text = "انا بهالشي مع التميمي ..<br />يعني من جد مالكم دااااااعي ..<br />اوكي سوقو احد مسكم ..بس لا تدخلو الاسلام في السالفه ..<br />اصلا الاسلام دين حريه ..بس فيه ضواابط ..<br />إلي اعرفو ان الاسلام ما حرم عليكم السواقه ..<br />بس انتو ما فكرتو في الجانب المظلم لهالشي ..<br />ماغير تزيد الفتن ..هه ..اصلا هيا موجوده كذا كذا ..<br />ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />وبعدين من ناحيه ثااانيه<br />إلي اعرفو عنكم يالبناات انكم دلوعااات ..<br />ليش طيب نمسك سيااره ونسوق ..دام فيه ..اخوي..زوجي..ابوي..جدي ..(السواق)..<br />كل ذوول تحت امرك ..واهم شي ان هم إلي يسوقون ..<br />اشلكم بوجع الراس والألم والمهاناة ..<br />اقوول بس اعشقو الراحه ..<br />والله يخلي سوااقناا بس"
