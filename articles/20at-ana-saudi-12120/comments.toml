text = "اقتباس التميمي:<br />حسبي الله ونعم الوكيل<br />ماسمعتوى القرآن والحديث<br />ماتعرفون معن كلامكم<br />متعرفون انه اللي يسن سنة !!<br />حرام عليكم<br />ماتشوفون اللحين الزلازل والبراكين<br />كل هذا غضب<br />ماتشوفون الغبار؟؟<br />الى متى تطالبون باللي تسمونه الحرية وتسمون الانفتاح؟؟<br />معنى كلامكم ان الاسلام ماعنده حرية اذا انتم مع الانفتاح وووو ؟؟؟<br />اللهم اكفنا شرهم وشر ما يؤلون بنا اليه<br />وهل الإسلام حلام قيادة المأة للسيارة<br />و هل قيادة المرأة المحرتمة للسيارة تؤدي الى ارتكاب الحرام<br />انا من دولة شقيقة و لاكن لا تمنع قيادة المآة<br />وتجود لدينا نسوان مرتبات و محترمات<br />يستغلوون السيارة في الخير و الذهاب الى لمآتم و الماكن لدينية<br />ولكن<br />الله يهدي الجميع من الأفكار التي هي مشتتة و ممانعة للمرآة لأن المرأة هي التي عظمها الإسلام<br />المرأة كانت من اعظم ممن شارك ببناء الإسلام"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124085539/http://www.20at.com:80/20at/ana-saudi/12120-2009-05-19-10-14-49.html"

