[[comments]]
order = 1
subject = "مش بالغناء"
author = "قوله تعالى: { ومن الناس من يشتري لهو الحديث ليضل عن سبيل الله بغير علم ويتخذها هزوا أولئك لهم عذاب مهين } [سورة لقمان: 6]"
posted = "2006-05-02"
text = "قال حبر الأمة ابن عباس رضي الله عنهما: هو الغناء، وقال مجاهد رحمه الله: اللهو: الطبل (تفسير الطبري) وقال الحسن البصري<br />رحمه الله: \"نزلت هذه الآية في الغناء والمزامير\" (تفسير ابن كثير).<br />قال رسول الله صلى الله عليه وسلم: « ليكونن من أمتي أقوام يستحلون الحر و الحرير و الخمر و المعازف، و لينزلن أقوام إلى جنب علم، يروح عليهم بسارحة لهم، يأتيهم لحاجة، فيقولون: ارجع إلينا غدا، فيبيتهم الله، ويضع العلم، ويمسخ آخرين قردة وخنازير إلى يوم القيامة » (رواه البخاري تعليقا برقم 5590، ووصله الطبراني والبيهقي، وراجع السلسلة الصحيحة للألباني 91)."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022817/http://masr.20at.com:80/article.php?sid=255&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "حرام عليك"
author = "واحد منقوط"
posted = "2006-05-02"
text = "الى الاخ اللى بيقول مش بالغناء<br />1)الاية لا تنزر بالعذاب من يشترى لهو الحديث و إنما تنذر من يشتريه ليضل عن سبيل الله و هذا ليس كلامى و إنما كلام الإمام ابن حزم و كلام حجة الإسلام الإمام الغزالى<br />2)من فضلك راجع فتوى الشيخ القرضاوى بخصوص الغناء و المعازف<br />3)الدكتور محمد عمارة له بحث يقع فى مائتى صفحة عن الغناء فى كتابه \"الإسلام و الفنون الجميلة\"_دار الشروق<br />4)نحن نبحث فى هذا الموقع عن الإصلاح و من أهم سمات الإصلاح هى إحترام التخصص و مش كل من قراله حديثين بقى مفتى! مع إحترامى"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022817/http://masr.20at.com:80/article.php?sid=255&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

