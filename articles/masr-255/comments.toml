[[comments]]
order = 5
subject = "الاغاني تاني"
author = "عبدالله مفتاح"
posted = "2006-05-03"
text = "تاني موضوع الاغاني هنفضل نختلف للابد اهم حاجه نخلينا متفقين على حاجه<br />ايه هيه؟<br />اقلك كلنا متفقين على ان الاغاني اللي فيها كلام مش اد كده حرام خلاص يبقى كلنا نبعد عنها"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022817/http://masr.20at.com:80/article.php?sid=255&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "بدل ما نختلف"
author = "shaimaa"
posted = "2006-05-03"
text = "بدل ما نختلف كل شويةعلى حلال و حرمانيه الاغانى ... نعمل حاجة مفيدة نجازى عليها خيراً .. و ربنا بيكرم ..لما الواحد بيعمل خير ربنا بيبعده عن الحرام كله .. و بعدين ... يعنى زى ما الاخوة قالوا ... الاغانى اللى بتخدش الحياء او فيها كلام حرام ..تبقى حرام .... لكن طفى النور يا بهية ايه اللى هيحرمها بس<br />يا ريت نقدر نعمل حاجة كويسة لبلدنا .. علشان لما ربنا يحاسبنا يوم القيامة نلاقى حاجة نرد بيها عليه .. مش نقوله ..اصل احنا كنا مختلفين الاغانى حلال و لا حرام ... و مش معنى كلامى برضه اننا نهمل الكلام ده ..بس زى ما اتقال ان الاغانى عليها اختلاف بين العلماء نفسهم ..لسه امبارح الدكتور على جمعه المفتى .. قايل انه بيسمع مزيكا بس مش اى نوع مزيكا .... ربنا يكرمكم و يجزيكم كل خير"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022817/http://masr.20at.com:80/article.php?sid=255&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

