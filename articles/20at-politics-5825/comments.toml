subject = ""
author = "أحمد الهواري"
posted = "2007-05-14"
text = "السادة الأفاضل مصري حتى النخاع وهيكل<br />تم ذكر ان أن عازفة الهارب مصرية في أغلب الأخبار التى قرأتها قبل كتابة الموضوع، واهمها الشرق الأوسط والبي بي سي النسخة العربية، ويمكنكما مراجعة أرشيف النسختين الإليكترونتين.<br />وعملت علي مراجعة ما ذكرتموه في الأماكن التي ذكرتها بعد ان طالعت التعليقين علي أنى وجدت انه مكتوب أنها مصرية ومصحوبة بلقب حسناء.<br />ولكم جزيل الشكر"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110075153/http://www.20at.com:80/20at/politics/5825.html"

