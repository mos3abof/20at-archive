posted = "2007-05-14"
text = "يا استاذ هواري رغم أنها بسيطه بس أخشى أن تحمل على معان آخرى غير بسيطه أطلاقاً … فعلاً والله العظيم كل وكالات الانباء العالميه قالت إن عازفة الهارب ذات الرداء الاحمر كانت \"روسيه \" الجنسيه … المصداقيه في تحرير الاخبار هي كل حاجه يا باشا … ارجو التأكد من مصادر معلوماتكم جيداً"
archived = "2009-11-10"
