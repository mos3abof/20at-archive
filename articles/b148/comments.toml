[[comments]]
order = 7
subject = "الدين والأنترنت"
author = "الأب بسام شحاتيت"
posted = "2006-01-28"
text = "السيدهايدى أبراهيم الجزيل الاحترام /القاهرة<br />اشكرك على هذا الموضوع الرائ الذي يهم شبابنا اليوم في بحثهم عن الأجوبة لتساؤلاتهم.<br />وأحب أن اشارك بهذه الأفكار<br />لقد أصبح الانترنت مركز مهم لتلقي المعلومات المتعلقة بنواحي الحياة المختلفة بعد أن دخل معظم البيوت<br />لذلك يعتبرمنأأهم منابر الخطابة والرسالة في العصر الحديث وله درو كدور الجامع والكنيسة.ويوجد اليوم عدد لايحصى من المواقع الدينية.<br />أويد أن تستقي المعلومة من ألأنترنت ولكن كما أن ليس كل شيخ يستطيع أن يفتي بالحقيقة كذلك ليس كل موقع أنترنت موثق به .<br />يجب أن تبحث وتتأكد من الصحيح.<br />أشجع على أن يكون الانترنت لللعبادة والصلاة ونشر الأيمان في مقابل المواقع التي تنشر الذيلة.<br />الأب بسام شحاتيت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123115/http://www.20at.com/article2.php?sid=148"

[[comments]]
order = 8
subject = "زمان ابي جهامة!"
author = "زمان ابي جهامة!"
posted = "2006-09-02"
text = "واضح ان الفقه السعودي سمح للغاية ـ علي غير ما يشاع عنه ـ في تفسير الآية الكريمة: (ان الحسنات يذهبن السيئات)، وهذا ما يفسر حرص ثلاثة من رجال الأعمال السعوديين علي إنشاء قنوات إسلامية بجانب قنوات (الهشك بشك)، والمصطلح لفيصل القاسم. فالوليد بن طلال المفدي انشأ قنوات (روتانا) المسوقة للحم الأبيض، من كل الجنسيات، وبجانبها انشأ قناة إسلامية هي (الرسالة)، والشيخ صالح كامل (المفدي) أيضا، أقام قناة (اقرأ) بجانب قنوات الـ (إيه ار تي)، المهتمة بتسويق كل أصناف (القوامات) المثيرة ـ جمع قوام ـ وصاحب قناة الخليجية منصور كرسة، وواضح من اسمه انه ليس (مفدي)، انشأ بجانبها قناة (الناس)، وهي قناة بلغ بها التدين حد انها لم تكتف بفرض الحجاب علي المذيعات، ولكن الي درجة انها استغنت عنهن، باعتبار ان صوت المرأة عورة!<br />وبحكم أنني (مهتم)، فقد تابعت عن قرب (نسبي) نشأة فضائية (الناس)، وأعلم ان هدف ملاكها، والذين يملكون في نفس الوقت قناة (الخليجية) لم يكن إنشاء قناة دينية يتقربون بها الي الله، فقد كان الهدف إنشاء قناة عادية جدا، وبأقل تكلفة مادية، ولأنهم وقعوا في يد بعض المحررين فرقة (عشانا عليك يا رب)، فقد عملوا لهم البحر طحينة، وقالوا لهم أنهم سوف يأتون بمذيعين، ومقدمي برامج، ومعدين، يعملون مجانا، ثم تطورت الفكرة لتصبح ان هؤلاء سيأتون باموال للقناة من خلال برامجهم، وتم فتح الباب لاستقبال متعاملين، وقد انتشي أصحاب فكرة (ابو بلاش)، عندما فوجئوا بمئات المتقدمين، ليكتشفوا والقناة توشك علي البث ان هؤلاء هم مجموعة من معدومي الموهبة، ولا علاقة لهم بالعمل التلفزيوني، لا من قريب ولا من بعيد، ولان أصحاب الفكرة لم يستطيعوا ان يعلنوا فشل اقتراحهم الفتاك، فقد كان الاقتراح ان تتحول الي قناة إسلامية،"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123115/http://www.20at.com/article2.php?sid=148"

[[comments]]
order = 9
subject = "كلنا في الدين حلوين"
author = "معاذ السيد الصاوي"
text = "الدين يسر بس مش فوضى عشان إحنا لو جانا شويت انقلونزا بنجري على أكبر بروفيسور في الجامعة بس شرع ربنا كلنا بإينا خبراء فيه<br />وَإِذَا جَاءَهُمْ أَمْرٌ مِنَ الْأَمْنِ أَوِ الْخَوْفِ أَذَاعُوا بِهِ<br />الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : { وَإِذَا جَاءَهُمْ أَمْر مِنْ الْأَمْن أَوْ الْخَوْف أَذَاعُوا بِهِ } يَعْنِي جَلَّ ثَنَاؤُهُ بِقَوْلِهِ : { وَإِذَا جَاءَهُمْ أَمْر مِنْ الْأَمْن أَوْ الْخَوْف أَذَاعُوا بِهِ } وَإِذَا جَاءَ هَذِهِ الطَّائِفَة الْمُبَيِّتَة غَيْر الَّذِي يَقُول رَسُول اللَّه صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ أَمْر مِنْ الْأَمْن . فَالْهَاء وَالْمِيم فِي قَوْله : { وَإِذَا جَاءَهُمْ } مِنْ ذِكْر الطَّائِفَة الْمُبَيِّتَة . يَقُول جَلَّ ثَنَاؤُهُ : وَإِذَا جَاءَهُمْ خَبَر عَنْ سَرِيَّة لِلْمُسْلِمِينَ غَازِيَة بِأَنَّهُمْ قَدْ أَمِنُوا مِنْ عَدُوّهُمْ بِغَلَبَتِهِمْ إِيَّاهُمْ { أَوْ الْخَوْف } يَقُول : أَوْ تَخَوُّفهمْ مِنْ عَدُوّهُمْ بِإِصَابَةِ عَدُوّهُمْ مِنْهُمْ { أَذَاعُوا بِهِ } يَقُول : أَفْشَوْهُ وَبَثُّوهُ فِي النَّاس قَبْل رَسُول اللَّه صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ وَقَبْل أُمَرَاء سَرَايَا رَسُول اللَّه صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ . وَالْهَاء فِي قَوْله : { أَذَاعُوا بِهِ } مِنْ ذِكْر الْأَمْر وَتَأْوِيله : أَذَاعُوا بِالْأَمْرِ مِنْ الْأَمْن أَوْ الْخَوْف الَّذِي جَاءَهُمْ , يُقَال مِنْهُ أَذَاعَ فُلَان بِهَذَا الْخَبَر وَأَذَاعَهُ , وَمِنْهُ قَوْل أَبِي الْأَسْوَد : أَذَاعَ بِهِ فِي النَّاس حَتَّى كَأَنَّهُ بِعَلْيَاء نَار أُوقِدَتْ بِثَقُوبِ وَبِنَحْوِ الَّذِي قُلْنَا فِي ذَلِكَ قَالَ أَهْل التَّأْوِيل . ذِكْر مَنْ قَالَ ذَلِكَ : 7899 - حَدَّثَنَا بِشْر بْن مُعَاذ , قَالَ : ثنا يَزِيد بْن زُرَيْع , قَالَ : ثنا سَعِيد , عَنْ قَتَادَة , قَوْله : { وَإِذَا جَاءَهُمْ أَمْر مِنْ الْأَمْن أَوْ الْخَوْف أَذَاعُوا بِهِ } يَقُول : سَارَعُوا بِهِ وَأَفْشَوْهُ. 7900 - حَدَّثَنَا مُحَمَّد بْن الْحُسَيْن , قَالَ : ثنا أَحْمَد بْن مُفَضَّل , قَالَ : ثنا أَسْبَاط , عَنْ السُّدِّيّ : { وَإِذَا جَاءَهُمْ أَمْر مِنْ الْأَمْن أَوْ الْخَوْف أَذَاعُوا بِهِ } يَقُول : إِذَا جَاءَهُمْ أَمْر أَنَّهُمْ قَدْ أَمِنُوا مِنْ عَدُوّهُمْ , أَوْ أَنَّهُمْ خَائِفُونَ مِنْهُمْ , أَذَاعُوا بِالْحَدِيثِ حَتَّى يَبْلُغ عَدُوّهُمْ أَمْرهمْ . 7901 - حَدَّثَنِي مُحَمَّد بْن سَعْد , قَالَ : ثني أَبِي , قَالَ : ثني عَمِّي , قَالَ : ثني أَبِي , عَنْ أَبِيهِ , عَنْ اِبْن عَبَّاس , قَوْله : { وَإِذَا جَاءَهُمْ أَمْر مِنْ الْأَمْن أَوْ الْخَوْف أَذَاعُوا بِهِ } يَقُول : أَفْشَوْهُ وَشَنَّعُوا بِهِ . 7902 - حَدَّثَنَا الْقَاسِم , قَالَ : ثنا الْحُسَيْن , قَالَ : ثني حَجَّاج , عَنْ اِبْن جُرَيْج : { وَإِذَا جَاءَهُمْ أَمْر مِنْ الْأَمْن أَوْ الْخَوْف أَذَاعُوا بِهِ } قَالَ : هَذَا فِي الْأَخْبَار إِذَا غَزَتْ سَرِيَّة مِنْ الْمُسْلِمِينَ خُبِّرَ النَّاس عَنْهَا , فَقَالُوا : أَصَابَ الْمُسْلِمُونَ مِنْ عَدُوّهُمْ كَذَا وَكَذَا , وَأَصَابَ الْعَدُوّ مِنْ الْمُسْلِمِينَ كَذَا وَكَذَا . فَأَفْشَوْهُ بَيْنهمْ مِنْ غَيْر أَنْ يَكُون النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ هُوَ الَّذِي يُخْبِرهُمْ بِهِ . قَالَ اِبْن جُرَيْج : قَالَ اِبْن عَبَّاس : قَوْله { أَذَاعُوا بِهِ } قَالَ : أَعْلَنُوهُ وَأَفْشَوْهُ . 7903 - حَدَّثَنِي يُونُس , قَالَ : أَخْبَرَنَا اِبْن وَهْب , قَالَ : قَالَ اِبْن زَيْد فِي قَوْله : { أَذَاعُوا بِهِ } قَالَ : نَشَرُوهُ. قَالَ : وَاَلَّذِينَ أَذَاعُوا بِهِ قَوْم , إِمَّا مُنَافِقُونَ , وَإِمَّا آخَرُونَ ضُعَفَاء . 7904 - حُدِّثْت عَنْ الْحُسَيْن بْن الْفَرَج , قَالَ : سَمِعْت أَبَا مُعَاذ يَقُول : أَفْشَوْهُ وَشَنَّعُوا بِهِ , وَهُمْ أَهْل النِّفَاق .<br />وَلَوْ رَدُّوهُ إِلَى الرَّسُولِ وَإِلَى أُولِي الْأَمْرِ مِنْهُمْ لَعَلِمَهُ الَّذِينَ يَسْتَنْبِطُونَهُ مِنْهُمْ<br />الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : { وَلَوْ رَدُّوهُ إِلَى الرَّسُول وَإِلَى أُولِي الْأَمْر مِنْهُمْ لَعَلِمَهُ الَّذِينَ يَسْتَنْبِطُونَهُ مِنْهُمْ } . يَعْنِي جَلَّ ثَنَاؤُهُ بِقَوْلِهِ : وَلَوْ رَدُّوهُ : الْأَمْر الَّذِي نَالَهُمْ مِنْ عَدُوّهُمْ وَالْمُسْلِمِينَ إِلَى رَسُول اللَّه صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ , وَإِلَى أُولِي أَمْرهمْ , يَعْنِي : وَإِلَى أُمَرَائِهِمْ , وَسَكَتُوا فَلَمْ يُذِيعُوا مَا جَاءَهُمْ مِنْ الْخَبَر , حَتَّى يَكُون رَسُول اللَّه صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ أَوْ ذَوُو أَمْرهمْ هُمْ الَّذِينَ يَقُولُونَ الْخَبَر عَنْ ذَلِكَ , بَعْد أَنْ ثَبَتَتْ عِنْدهمْ صِحَّته أَوْ بِطُولِهِ , فَيُصَحِّحُوهُ إِنْ كَانَ صَحِيحًا , أَوْ يُبْطِلُوهُ إِنْ كَانَ بَاطِلًا . { لَعَلِمَهُ الَّذِينَ يَسْتَنْبِطُونَهُ مِنْهُمْ } يَقُول : لِعِلْمِ حَقِيقَة ذَلِكَ الْخَبَر الَّذِي جَاءَهُمْ بِهِ الَّذِينَ يَبْحَثُونَ عَنْهُ , وَيَسْتَخْرِجُونَهُ مِنْهُمْ , يَعْنِي : أُولِي الْأَمْر . وَالْهَاء وَالْمِيم فِي قَوْله : { مِنْهُمْ } مِنْ ذِكْر أُولِي الْأَمْر. يَقُول : لِعِلْمِ ذَلِكَ مِنْ أُولِي الْأَمْر مَنْ يَسْتَنْبِطهُ . وَكُلّ مُسْتَخْرِج شَيْئًا كَانَ مُسْتَتِرًا عَنْ أَبْصَار الْعُيُون أَوْ عَنْ مَعَارِف الْقُلُوب , فَهُوَ لَهُ مُسْتَنْبِط , يُقَال : اِسْتَنْبَطْت الرَّكِيَّة : إِذَا اِسْتَخْرَجْت مَاءَهَا , وَنَبَطْتهَا أَنْبِطهَا , وَالنَّبَط : الْمَاء الْمُسْتَنْبَط مِنْ الْأَرْض , وَمِنْهُ قَوْل الشَّاعِر : قَرِيب ثَرَاهُ مَا يَنَال عَدُوّهُ لَهُ نَبَطًا آبِي الْهَوَان قَطُوب يَعْنِي بِالنَّبَطِ : الْمَاء الْمُسْتَنْبَط . وَبِنَحْوِ الَّذِي قُلْنَا فِي ذَلِكَ قَالَ أَهْل التَّأْوِيل . ذِكْر مَنْ قَالَ ذَلِكَ : 7905 - حَدَّثَنِي مُحَمَّد بْن الْحُسَيْن , قَالَ : ثنا أَحْمَد بْن مُفَضَّل , قَالَ : ثنا أَسْبَاط , عَنْ السُّدِّيّ : { وَلَوْ رَدُّوهُ إِلَى الرَّسُول وَإِلَى أُولِي الْأَمْر مِنْهُمْ } يَقُول : وَلَوْ سَكَتُوا وَرَدُّوا الْحَدِيث إِلَى النَّبِيّ صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ وَإِلَى أُولِي أَمْرهمْ حَتَّى يَتَكَلَّم هُوَ بِهِ , { لَعَلِمَهُ الَّذِينَ يَسْتَنْبِطُونَهُ } يَعْنِي عَنْ الْأَخْبَار , وَهُمْ الَّذِينَ يُنَقِّرُونَ عَنْ الْأَخْبَار. 7906 - حَدَّثَنَا بِشْر بْن مُعَاذ , قَالَ : ثنا يَزِيد , قَالَ : ثنا سَعِيد , عَنْ قَتَادَة : { وَلَوْ رَدُّوهُ إِلَى الرَّسُول وَإِلَى أُولِي الْأَمْر مِنْهُمْ } يَقُول : إِلَى عُلَمَائِهِمْ , { لَعَلِمَهُ الَّذِينَ يَسْتَنْبِطُونَهُ مِنْهُمْ } لَعَلِمَهُ الَّذِينَ يَفْحَصُونَ عَنْهُ , وَيُهِمّهُمْ ذَلِكَ . 7907 - حَدَّثَنَا الْقَاسِم , قَالَ : ثنا الْحُسَيْن , قَالَ : ثني حَجَّاج , عَنْ اِبْن جُرَيْج : { وَلَوْ رَدُّوهُ إِلَى الرَّسُول } حَتَّى يَكُون هُوَ الَّذِي يُخْبِرهُمْ , { وَإِلَى أُولِي الْأَمْر مِنْهُمْ } : أُولِي الْفِقْه فِي الدِّين وَالْعَقْل . 7908 - حَدَّثَنَا الْقَاسِم , قَالَ : ثنا الْحُسَيْن , قَالَ : ثني حَجَّاج , عَنْ أَبِي جَعْفَر , عَنْ الرَّبِيع , عَنْ أَبِي الْعَالِيَة : { وَلَوْ رَدُّوهُ إِلَى الرَّسُول وَإِلَى أُولِي الْأَمْر مِنْهُمْ لَعَلِمَهُ الَّذِينَ يَسْتَنْبِطُونَهُ مِنْهُمْ } : يَتَتَبَّعُونَهُ وَيَتَحَسَّسُونَهُ. 7909 - حَدَّثَنَا أَبُو كُرَيْب , قَالَ : ثنا اِبْن إِدْرِيس , قَالَ : أَخْبَرَنَا لَيْث , عَنْ مُجَاهِد : { لَعَلِمَهُ الَّذِينَ يَسْتَنْبِطُونَهُ مِنْهُمْ } قَالَ : الَّذِينَ يَسْأَلُونَ عَنْهُ وَيَتَحَسَّسُونَهُ . 7910 - حَدَّثَنِي مُحَمَّد بْن عَمْرو , قَالَ : ثنا أَبُو عَاصِم , عَنْ عِيسَى , عَنْ اِبْن أَبِي نَجِيح , عَنْ مُجَاهِد , قَوْله : { يَسْتَنْبِطُونَهُ } قَالَ : قَوْلهمْ : مَا كَانَ ؟ مَاذَا سَمِعْتُمْ ؟ * - حَدَّثَنِي الْمُثَنَّى , قَالَ : ثنا أَبُو حُذَيْفَة , قَالَ : ثنا شِبْل , عَنْ اِبْن أَبِي نَجِيح , عَنْ مُجَاهِد , مِثْله . * - حَدَّثَنَا اِبْن وَكِيع , قَالَ : ثنا أَبِي , عَنْ أَبِي جَعْفَر , عَنْ الرَّبِيع , عَنْ أَبِي الْعَالِيَة : { الَّذِينَ يَسْتَنْبِطُونَهُ } قَالَ : يَتَحَسَّسُونَهُ. 7911 - حَدَّثَنِي مُحَمَّد بْن سَعْد , قَالَ : ثني أَبِي , قَالَ : ثني عَمِّي , قَالَ : حَدَّثَنِي أَبِي , عَنْ أَبِيهِ عَنْ اِبْن عَبَّاس : { لَعَلِمَهُ الَّذِينَ يَسْتَنْبِطُونَهُ مِنْهُمْ } يَقُول : لَعَلِمَهُ الَّذِينَ يَتَحَسَّسُونَهُ مِنْهُمْ. 7912 - حُدِّثْت عَنْ الْحُسَيْن بْن الْفَرَج , قَالَ : سَمِعْت أَبَا مُعَاذ يَقُول : أَخْبَرَنَا عُبَيْد بْن سُلَيْمَان , قَالَ : سَمِعْت الضَّحَّاك يَقُول فِي قَوْله : { يَسْتَنْبِطُونَهُ مِنْهُمْ } قَالَ : يَتَتَبَّعُونَهُ . 7913 - حَدَّثَنِي يُونُس , قَالَ : أَخْبَرَنَا اِبْن وَهْب , قَالَ : قَالَ اِبْن زَيْد فِي قَوْله : { وَإِذَا جَاءَهُمْ أَمْر مِنْ الْأَمْن أَوْ الْخَوْف أَذَاعُوا بِهِ } . .. حَتَّى بَلَغَ : { وَإِلَى أُولِي الْأَمْر مِنْهُمْ } قَالَ : الْوُلَاة الَّذِينَ يَكُونُونَ فِي الْحَرْب عَلَيْهِمْ الَّذِينَ يَتَفَكَّرُونَ فَيَنْظُرُونَ لِمَا جَاءَهُمْ مِنْ الْخَبَر أَصِدْق أَمْ كَذِب ؟ أَبَاطِل فَيُبْطِلُونَهُ , أَوْ حَقّ فَيُحِقُّونَهُ ؟ قَالَ : وَهَذَا فِي الْحَرْب , وَقَرَأَ : { أَذَاعُوا بِهِ وَلَوْ } فَعَلُوا غَيْر هَذَا و { رَدُّوهُ } إِلَى اللَّه و { إِلَى الرَّسُول وَإِلَى أُولِي الْأَمْر مِنْهُمْ } . .. الْآيَة .<br />وَلَوْلَا فَضْلُ اللَّهِ عَلَيْكُمْ وَرَحْمَتُهُ لَاتَّبَعْتُمُ الشَّيْطَانَ إِلَّا قَلِيلًا<br />الْقَوْل فِي تَأْوِيل قَوْله تَعَالَى : { وَلَوْلَا فَضْل اللَّه عَلَيْكُمْ وَرَحْمَته لَاتَّبَعْتُمْ الشَّيْطَان إِلَّا قَلِيلًا } . يَعْنِي بِذَلِكَ جَلَّ ثَنَاؤُهُ : وَلَوْلَا إِنْعَام اللَّه عَلَيْكُمْ أَيّهَا الْمُؤْمِنُونَ بِفَضْلِهِ وَتَوْفِيقه وَرَحْمَته , فَأَنْقَذَكُمْ مِمَّا اِبْتَلَى هَؤُلَاءِ الْمُنَافِقِينَ بِهِ , الَّذِينَ يَقُولُونَ لِرَسُولِ اللَّه صَلَّى اللَّه عَلَيْهِ وَسَلَّمَ إِذَا أَمَرَهُمْ بِأَمْرٍ : طَاعَة , فَإِذَا بَرَزُوا مِنْ عِنْده بَيَّتَ طَائِفَة مِنْهُمْ غَيْر الَّذِي تَقُول , لَكُنْتُمْ مِثْلهمْ , فَاتَّبَعْتُمْ الشَّيْطَان إِلَّا قَلِيلًا , كَمَا اِتَّبَعَهُ الَّذِينَ وَصَفَ صِفَتهمْ . وَخَاطَبَ بِقَوْلِهِ تَعَالَى ذِكْره : { وَلَوْلَا فَضْل اللَّه عَلَيْكُمْ وَرَحْمَته لَاتَّبَعْتُمْ الشَّيْطَان } الَّذِينَ خَاطَبَهُمْ بِقَوْلِهِ جَلَّ ثَنَاؤُهُ : { يَا أَيّهَا الَّذِينَ آمَنُوا خُذُوا حِذْركُمْ فَانْفِرُوا ثُبَات أَوْ اِنْفِرُوا جَمِيعًا } 4 71 . ثُمَّ اِخْتَلَفَ أَهْل التَّأْوِيل فِي الْقَلِيل الَّذِي اِسْتَثْنَاهُمْ فِي هَذِهِ الْآيَة , مَنْ هُمْ , وَمِنْ أَيّ شَيْء مِنْ الصِّفَات اِسْتَثْنَاهُمْ ؟ فَقَالَ بَعْضهمْ : هُمْ الْمُسْتَنْبِطُونَ مِنْ أُولِي الْأَمْر , اِسْتَثْنَاهُمْ مِنْ قَوْله : { لَعَلِمَهُ الَّذِينَ يَسْتَنْبِطُونَهُ مِنْهُمْ } وَنَفَى عَنْهُمْ أَنْ يَعْلَمُوا بِالِاسْتِنْبَاطِ مَا يَعْلَم بِهِ غَيْرهمْ مِنْ الْمُسْتَنْبِطِينَ مِنْ الْخَبَر الْوَارِد عَلَيْهِمْ مِنْ الْأَمْن أَوْ الْخَوْف . ذِكْر مَنْ قَالَ ذَلِكَ : 7914 - حَدَّثَنَا بِشْر بْن مُعَاذ , قَالَ : ثنا يَزِيد , قَالَ : ثنا سَعِيد , عَنْ قَتَادَة , قَالَ : إِنَّمَا هُوَ لَعَلِمَهُ الَّذِينَ يَسْتَنْبِطُونَهُ مِنْهُمْ , إِلَّا قَلِيلًا مِنْهُمْ , وَلَوْلَا فَضْل اللَّه عَلَيْكُمْ وَرَحْمَته لَاتَّبَعْتُمْ الشَّيْطَان. 7915 - حَدَّثَنَا الْحَسَن بْن يَحْيَى , قَالَ : أَخْبَرَنَا عَبْد الرَّزَّاق , قَا<br />27/12/2005<br />اقرأ بقية التعليق .."
