author = "الضبع"
posted = "2009-12-21"
text = "واللة فعلا التخن فى الراس مش فى الجسم فياريت يختاروا بالمرة اكبر دولة فى نسبة غباء وفساد بس ياريت متكونشى مصر اولهم واحدة فيهم كمان<br />وشكرا على الموضوع الحلو دة"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080304/http://www.20at.com:80/masr/hot-topics/14499-2009-12-21-14-02-11.html"

[[comments]]
order = 2
subject = ""
author = "الى المعلق السابق"
posted = "2009-12-21"
text = "مين اللى قال ان سيدنا داوود حكم مصر والشام وفلسطين<br />يا محترم فلسطين بس كان فيها اربع ممالك وكانت مملكة داوود احدى الممالك فى فلسطين ولك ان تتخيل الكثافة السكانية فى فلسطين<br />يعنى بالعربى الفصيح كان داوود شيخ قبيلة ولا يزيد عن هذا وبكثافة السكان وقتها<br />ولم يحكم لا مصر ولا الشام ولا حتى فلسطين ولكن كان ملك قبيلة زى القبيلة الحاكمة فى الكويت او قطر او البحرين<br />اما حكاية الهدهد اللى طار من اليمن لفلسطين فى 3 ايام فهذة قصة للموعظة ولا يمكن لهدهد او حتى نسر ان يقطع تلك المسافة فى 3 ايام"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080304/http://www.20at.com:80/masr/hot-topics/14499-2009-12-21-14-02-11.html"

[[comments]]
order = 3
subject = ""
author = "مش ححبك"
posted = "2009-12-21"
text = "لما يكون الجسد تخيف دي مش مشكلة<br />المشكلة لما يكون المخ تخين<br />لما يكون على حدودنا بلد اسمها اسرائيل بقالها 60 سنه<br />ولسه مش فاهمين يعني ايه اسرائيل<br />لسه الشعب المصري بيلعب مع بعضه عسكر وحراميه<br />الشعب المصري لسه مش فاهم يعني ايه اسرائيل<br />الشعب المصري مش فاهم ان سيدنا داوود كان بيحكم فلسطين ومصر والشامن<br />لسه مش فاهمين يا مصريين<br />خلينا احنا في ماتشات الكوره"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080304/http://www.20at.com:80/masr/hot-topics/14499-2009-12-21-14-02-11.html"

[[comments]]
order = 4
subject = ""
author = "nimooooo"
posted = "2009-12-21"
text = "والله الغط عندنا احنا اللى موش بنمارس اى حاجه وحججنا فاضيه<br />ياعنى لو احنا رايحين الشغل الصبح وصحينا بدرى شويه وخدناها مشى مدش هايقولك انت ماشى ليه ولو بطلنا المحشى شويه هايكون احسن واكلنا الخضار اكتر حبتين يكون افضل موش كدا بس الكسل<br />طعمه احلى موش كدا"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080304/http://www.20at.com:80/masr/hot-topics/14499-2009-12-21-14-02-11.html"

[[comments]]
order = 5
subject = ""
author = "عيادة العظام"
posted = "2009-12-21"
text = "كنت فى عيادة دكتور عظام علشان مراجعة كسر فى ذراع اخى الصغير<br />معظم المرضى سيدات متاخن من الوزن الثقيل وكلهم بيشتكوا من الم فى مفصل الركبة<br />طيب كدة بالبلدى كيس القطن دة اية اللى هيشيلة غير الساقين والاقدام والركب<br />وهو الدكتور هيعمل اية فى عمارة ثقيلة واقفة على عمودين بس<br />والمصيبة انهم مش عايزين يمشوا<br />حتى بتوع الاحياء الشعبية بيركبوا التوك توك من باب العمارة لاول الشارع<br />طبعا نصيحة الدكتور الاولى تخفيف الوزن والمشى"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080304/http://www.20at.com:80/masr/hot-topics/14499-2009-12-21-14-02-11.html"

