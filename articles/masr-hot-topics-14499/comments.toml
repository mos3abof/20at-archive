subject = ""
author = "المعلق رقم 4"
posted = "2009-12-21"
text = "الى الاخ الكريم المعلق رقم 4<br />اولا احب ان اقول ان الله تعالى قال سبحان الذي اسرى بعبده ليلا من المسجد الحرام الى المسجد الاقصى<br />وفي تفسير الشيخ الشعراوي قال ان هذه الرحلة بمثابة مصادرة هذه الاراضي الى الاسلام يعني الاسلام صادر فلسطين ومن حولها برحلة الاسراء وتم فتح هذه البلاد وضمها الى المملكة الاسلامية بواسطة الصحابه<br />هذا هو الاصل في الموضوع<br />اما كوني انني ذكرت ذلك سواء كان كذب ام حقيقة فانا اردت التنبيه فقط لان علم اسرائيل مرسوم عليه نجمة اسرائيل وفيه خطيت يعني من النيل الى الفرات فانا اقصد التنبيه<br />واردت ان انوه الى ان الشعب المصري لسه بيلعب عسكر وحراميه بواسطة مباحث امن الدولة والاخوان المسلمين لسه لغاية دلوقتي بيلعبوا عسكر وحراميه للاسف<br />وبسبب هذه اللعبة السخيفة ضاعت سيناء<br />فانا قصدت التنبيه فقط"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080304/http://www.20at.com:80/masr/hot-topics/14499-2009-12-21-14-02-11.html"

[[comments]]
