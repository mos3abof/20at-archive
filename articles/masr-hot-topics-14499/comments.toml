[[comments]]
order = 8
subject = ""
author = "نعيش لناكل"
posted = "2009-12-22"
text = "فية اناس تعيش فقط لتاكل وتملىء بطنها وتلغى مخها تماما<br />علشان كدة مفيش ابداع<br />هل ظهر كاتب بديل لتوفيق الحكيم او عباس العقاد ؟<br />هل ظهرت مطربة فى حجم ام كلثوم او حتى شادية او نجاة<br />هل عندنا ملحن فى مستوى بليغ حمدى<br />هل شاعر بحجم امل دنقل<br />هل عندنا سياسيون بحجم النحاس باشا او مكرم عبيد او فقهاء دستوريين بحجم السنهورى باشا<br />ال 30 سنة الماضية حدث تجريف للعقلية المصرية واخماد اى نشاط للعقل بفضل امن الدولة الذى قتل الجامعات وقتل الشباب<br />الناس بتاكل وبس وتتخن<br />والحكومة بتوفر العلف وبتجيب قمح يصلح لعلف الحيوانات"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080304/http://www.20at.com:80/masr/hot-topics/14499-2009-12-21-14-02-11.html"
