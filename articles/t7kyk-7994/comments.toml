author = "قرف الزمان"
posted = "2008-01-10"
text = "يقال ان الرئيس حسنى مبارك والرئيس القذافى كانا يتمشيان على كوبرى قصر النيل فى ساعة صفا بالليل وطبعا بيتكلموا مع بعض فى مدى حب الشعب لكل منهم<br />مبارك بيقول للقذافى - تصور ان الشعب بتاعى بيحبنى موت لدرجة انى لو طلبت طلب من اى واحد بينفذة فورا<br />القذافى - ازاى<br />مبارك - هتشوف<br />وقابلهم واحد مصرى مهموم وقرفان فقال لة مبارك - انتى عارفنى - فرد علية - طبعا ياريس وهل يخفى القمر<br />فقال لة مبارك - لو طلبت منك طلب ممكن تنفذة - رد الرجل - طبعا ياريس - فقال لة مبارك - ارمى نفسك فى النيل<br />فجرى الراجل وهب وطلع فوق سور الكوبرى ورمى نفسة فى النيل وغطس تحت المياة ومات<br />القذافى قال لة - لا دى يمكن حاجة فردية ومش ممكن تتكرر - رد مبارك - لا هاوريك<br />وقابلوا واحد تانى وتكرر ما سبق ورمى نفسة فى النيل ومات<br />وقابلوا واحد تالت وتكرر ما سبق ورمى نفسة فى النيل ايضا<br />والقذافى مبهور من حب الشعب للرئيس<br />قابلوا واحد رابع وقال لة ترمى نفسك فى النيل فجرى ليقف على سور الكوبرى لينط فة المياة ولكن القذافى جرى وراة وحضنة ومسكة من وراء وقال لة - حرام ياراجل ترمى نفسك فى النيل حرام<br />فقال لة الراجل - لا سيبنى خليينى اموت واغور من وشة<br />الناس بتموت نفسها علشان تغور من وشة"
archived = "2009-05-25"
capture_url = "https://web.archive.org/web/20090525141857/http://www.20at.com:80/t7kyk/7994.html"
