posted = "2008-01-09"
text = "عيب عليكم يا مشايخ الازهر سواء في دار الافتاء او الازهر فكلكم ازهريين<br />اولا هذا موضوع ليس بحاجه الى فتوى على الاطلاق<br />فالشباب حر في نفسه الشباب بيهاجر في الزوارق بحثا عن باب زرق على مسئولية نفسه<br />هذه الامور ليست بحاجه الى فتوى ولا يحزنون<br />كل واحد يعقلها ويتوكل على الله"
archived = "2009-05-25"
