author = "زهرة الرمان"
posted = "2008-01-09"
text = "لا كهنوت فى الاسلام - وما يقولة من اراء لبعض المشايخ المتسيسين لا يمثل غير اراء شخصية لبعضهم - قد يبغى منفعة شخصية من وراء تلك الفتاوى - كان ينظر الية بعين الرضا من الحكام او الولاة ويراعوا ذلك فى ترقيتة الى وظيفة اعلى<br />فتواهم ليست ملزمة ولا تمثل غير راى شخصى اذا كانت تخالف الاجماع او ما اجمع علية العلماء والمشايخ<br />واذا لم يخرج هؤلاء الشباب لطلب رزقهم هل تتكفل حكومة من وظفت هذا الشيخ بتوظيف هؤلاء الشباب وفتح بيوتهم ؟<br />ثم يا مولانا من قال لك ان هؤلاء الشباب يريدون الحياة السهلة وانهم حينما يدخلون اوروبا يجدون الحياة السهلة التى تعيش فيها انت ؟ انهم يعملون فى اشق واحقر واقسى الاعمال مما يرفض الاروبيون العمل بها - ولكنة الفقر الذى يدفعهم الى ذلك<br />سمعة بلدنا فى اروبا فى الحضيض نتيجة الفقر<br />الم تمتنع دولة اروبية عن تأشيرة لدخول فريق رياضى ؟ ونوقش ذلك فى مجلس الشعب بشان ما قيل المعاملة بالمثل<br />الم تعمل فتياتنا الجامعيات فى تقديم الشيشة والطلبات فى فنادق الخليج للسكارى ؟<br />ابن فتواك فى من ارادت ارسال الجامعيات للعمل كخادمات فى بيوت السعودية معرضين تلك الفتيات للاغتصاب والبهدلة وتطاول الاولاد الذكور عليها وخصوصا عندما ينادونها داخل البيت ليس باسمها وانما تعالى يا مصرية وهاتى يا مصرية وروحى يا مصرية<br />تلك اذن فتاوى سياسية مرفوضة لا تمثل غير راى شخصى لاحد الاشخاص وضعتة الظروف على كرسى الافتاء رغم انة خريج تجارة<br />اما هؤلاء الخارجين الذين خرجوا يطلبون رزقهم ولو من فم الموت فلهم اللة ولن يحاسبهم اللة وحدهم اذ سيحاسب حاكمهم قبلهم"
archived = "2009-05-25"
