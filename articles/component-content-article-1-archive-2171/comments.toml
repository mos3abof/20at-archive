[[comments]]
order = 0
subject = "بتحصل .."
author = "هوووووبه مش شغلك وهبهوب سابقا"
posted = "2006-05-24"
text = "علي فكره الموضوع دا جامد لو شوفته ,<br />البرنامج بتاع البيوت فضايح اتكلم علي الموضوع دا وازاي نظره المجتمع بتختلف للشخص المخنث او مبتتقبلش وجود شخص اتحولت من جنس لجنس اخر , بس فعلا الواحد<br />لما شاف الحلقه دي قعدت اضحك ضحك هما كانوا عارضين نمودج لواحد اتحول لواحده من نوعيه زكيه زكريا.<br />كانت واحده طبيبه باين وواخده الموضوع بتقبل , اما اللي كانت نكته بجد اللي كانوا مستضيفينوه وكان بيتجوز في ليله الجواز اكتشف ان مراته راجل والله مش بهزر شوف الحلقه دي بجد جامده , النقطه بقي فعلا في تقبل الامر بعقليه عربيه\" عامه \" حرفض او حمئلس علي الشخص اللي المحول دا لانها مش منتشره وفكره غير مستساغه للنفوخ وحسخر منه , بس بصراحه لو غربيه عاااااااااااااااااااااادي جدا جدا جدا , المشكله بقي في البشر دي\" اللي في الوطن العربي \" بتحس بنقص لاهي عارفه تاقلم مع اللي حوليها وبينظرلها علي انها كائن من الفضاء ,<br />,وازاي تكمل حياتها او حياته بعد التحول هل ينفع يرتبط ؟ ولو نفع ممكن يخلف ؟؟ ولو خلف يقول لابنه ايه ؟ راي انا بقي انا ربنا عايزله كدا او عايزلها \" لخبطتونا كدا\" ويتقبل الامر اوتتقبل الامر لان دا امر ربنا , وطززززززززززز في كلام الناس . فكرتوني بمحمد صبحي وهو عامل دور واحده شويه وراجل شويه .<br />\" علي فكره انتو ابتديتو تكتبوا اسماء بحروف شطار والصوره جامده \" ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133812/http://www.20at.com/article2.php?sid=854"

[[comments]]
order = 1
subject = "حاجة غريبة"
author = "مؤمن"
posted = "2006-05-24"
text = "سلام عليكم ورحمة اللة طباعا موضوع جيد جدا بسى فى سوال غريب ديمن تقابل ناسى فى شات يبحثوة على موجب او سالب وتلقى هزاة انسان سالب غنى جدا ازى يدخل وتعرف على اشخاص دخل نيت عشان يمارس معة جنس انا اعرف انوة حرام جدا من اكبر كباير وتهز سبع سموات هل هذا مرض موجود من زمان فى بعد حوادث بتحصلى فى فى رجال كبار بيتعدوة على اطفال فى شوارع طيب هلى يوجد قانون حماية اطفال هل يوجد قانون يحاسب مريض جنسين اية حكم علية يرت يجماعة نحول لخلى بالنا من شات انا فى مرة شوفت كلام فى شات على عام انى فى ناس بتحب تبحث عن ممرسة شزوز جنسى انا اصتغربت من هذة موضوع علانا<br />لزم يجماعة يكون فى تدين شوية او معرفة اوامر دين انا ليست متدين بسىانا مستغرب بيحث فىحياة( اذا بليتوة فاة استروة) مشى علانا<br />هل دة بسبب عندم وجود جواز؟<br />ولة افلام مخلة بتعرض فى دشى وكمبيوتر؟<br />ـــــــــــــــــــــــــــــــــــــ<br />كان زمان اسمع انى طفل معشرتة زيادة او اعدة مع بنات اكتر فى حياتة بتقصر على شخصية رجل<br />هذا كلام دة حقيقى ولة مشى حقيقى؟؟؟<br />على تجربتى شخصية كلام دة غير صحيح لانة طفل يوم بكبر بحيس بترد عندما بتقبل مع ناس ويفهم حقيق وصول حياة ويتعلم منها هيعرف بعد كدة معنة رجولةفى تعامل مع ناس وحياة وختيارة لهوة ليصبح راجل او حاجة تانية<br />ربنة يوفقم ويكرمك يرب يكون افتكم بشى<br />شكرا مؤمن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133812/http://www.20at.com/article2.php?sid=854"

