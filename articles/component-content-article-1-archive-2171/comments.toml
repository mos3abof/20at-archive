text = "كلامك صحيح فمجتمعنا ما زال جاهلا و أرجوا أن تثابر بتعليقاتك عن المتحولين أكثر و أكثر شكرا حزيلا لمساعدتك فاني أحد الذين يعانون من تخلف المجتمع و رفضه لي و لتصرفاتي فاني امرأة و لكني أفكر و أشعر بأني رجل و لا أستطيع أن أكون امرأة أبدا ذهبت الى العديد من الأطباء من مختلف الفئات و لا فائدة ترجى و أنا أتحمل الكثير من المواقف المحرجة و احب فتاة و هي تعلم و لكنها لن تستمر معي رغم حبها لي لأنها تعلم بوضعي كاملا و متقبلة له و لكنها تخاف أهلها فانهم شرقيين أرحو مساعدتك أريد أن أتكلم معك اذا ممكن لأني بدات أجن من نظرة المجتمع ساعدونا أرجوكم فما نحن به كمرض عضال لا نقوى عليه"
