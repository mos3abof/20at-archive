[[comments]]
order = 12
subject = "امتى هنلاقي حل؟"
author = "dido"
posted = "2006-06-12"
text = "الموضوع ان الناس دي بتكون معذورة الى حد كبير لان ده موضوع مش بيدهم..زي ما ربنا خلق ناس طبيعين خلق برضه ناس عندها ميول غريزية بالشكل ده و باعضاء مش كاملة او تشوه معين...<br />اعتقد انه مش صواب اننا نعيب عليهم كانها غلطتهم<br />محدش يقدر ينكر ان في ناس منحرفة بتستغل انتشار الموضوع .. لكن في المقابل في ناس فعلا عندها مشكلة ومش لازم نزود عليها مشكلتها باللعنة و المعايرة من غير اي حل لدرجة تخليهم يتمردواو المسافة بينا و بينهم تزيد جدا و ميبقاش في فهم للموضوع و تدور العجلة بالشكل ده علطلول...<br />تخيلك او تخيلي انك كنتي شخص من دول و لقيت ميول بالشكل ده و بطريقة قهرية يا ترى كان هيبقى عندك نفس الحكم اللي بتحكم بيه على الناس دي بيه دلوقتي؟ و ده سؤال للناس اللي بتتعامل مع الموضوع بعصبية و لعنات..<br />انا بنيت حكمي ده بعض ابداء قرفي و ضيقي من مجرد مناقشة الموضوع ده لو اتفتح قدامي عدة مرات لكن اعتقد ان اننا نحط راسنا في التراب و تنجاهل حجم المشكلة مش هو الحل و دول افراد بينا و موجودين منقدرش ننكرهم او نتجاهل وجودهم و لا عددهم المتزايد.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133812/http://www.20at.com/article2.php?sid=854"

