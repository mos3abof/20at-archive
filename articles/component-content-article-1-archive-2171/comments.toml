[[comments]]
order = 19
subject = "هناك فرق"
author = "مراسل"
posted = "2006-07-09"
text = "لا بد ان نميز بين الخنثى و هي حالة طبية فيزيزلوجية . و بين الشواذ أو من يحلو لهم أن يسموا نفسهم الجنس التالث .<br />فالحالة الأولى هي حالة طبية يجب أن تخضع للطب - بالطبع مع أخذ رأي العلماء - الطب هو الذي يقول كلمته فيها .<br />أما ما أصبح يروج له تحت مسمى الجنس التالث مثل الشخص الذي استجوبته قناة الرأي و أفصح عن شذوذه بوقاحة نادرة . أقول هؤلاؤ يجب أن يحل أمرهم تربوبا و يجب أن تثار مسألة الوقاية من هذه الأمراض بشكل جاد و عاجل لأن الأمر استفحل .<br />كما يجب عدم التساهل معهم تحت مسمى الحرية لان هذا الأمر سوف يفتح المجال للمفسدين .<br />و قد ورد عن الرسول صلى الله عليه و سلم كل أمتي معافون إلا المجاهرون .<br />اللهم الطف بنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133812/http://www.20at.com/article2.php?sid=854"

