posted = "2006-05-27"
text = "أن عالم العربي بأكمله في حرب علاميه ونفسيه . متى وكبف بداء هذه الحرب نفسي هو ضعف الشباب ديني وهيكلي<br />ماينبغي هو تجنب حركة ستعمارية من قبل الغرب ..وتجنب أفكار ادخيله على العالم السلامي والعربي ..<br />على كل حل أرجاء طرح لأستبانه تعطي وضوح لشباب لعربي عن رأى وفكر لتحةيل الجنسي<br />وشكراً،،،،،"
