[[comments]]
order = 8
subject = "كلاكيت تانى مرة"
author = "نادر"
posted = "2006-05-28"
text = "طبعا انا كنت متحمس جدا لقراءة الموضوع<br />وذلك لانشغالى الشخصى بمثل هذة الظواهر الشاذة وقد سبق لى ان كتبت فى عشرينات مقال عن الشواذ جنسيا تحت عنوان شاب لا مؤاخذة قد يذكرة قراء الموقع القدامى ورغم انى لم تصل لى رسالة كاتبة المقال بوضوح - على حد ما فهمت فهى تناصر تغيير الجنس _ وهذا امر يجب تفصيله لان له اكثر من حالة<br />فان كانت تتحدث عن اضطراب هرمونى مثل الشخص الذى يمتلك اعضاء كلا من الذكر و الانثى فانا ارى ان هذا من حقه ان يختار وذلك تبعا لما يعرفه هو عن نفسه<br />اما اذا كنا نتحدث عن ذكر ( ولن اقول رجل )متانث او انثى ( ولن اقول امرأة ) مستذكرة فان هذا هو الانحراف الشاذ الذى اصاب قوم لوط فهولاء لابد اما علاجهم او اجتثاثهم لانهم لا يفعلون غير اشاعة الدمار على انفسهم وعلى كل الكائنات الحية<br />وبالطبع لابد من مراعاة ظروف الفساد والدمار القيمى والنفسى والمجتمعى الذى نحياة وان نعالج بصراحة _وليس بجاحة _ امراضنا<br />واعان الله كل مبتلى وارجوا التواصل لمزيد من النقاش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133812/http://www.20at.com/article2.php?sid=854"

