text = "السلام عليكم<br />اولا اوقفوا الشائعات التي تقول ان التحويل فيه دمار نفسي وجسدي للمتحول فهذا غير صحيح ..فاكثر من 95% من المتحولين سعداء وراضين عن وضعهم الجديد ولكنهم لن يكونوا محط الانظار فلا احد يستطيع التعرف عليهم كمتحولين لانهم اجتازوا المرحلة بنجاح .. اما ال 5% الباقية التي تفشل فتكون حديث المجتمع ترجع اسباب فشلها الى:<br />نبذ الاهل والاقارب والمجتمع له<br />فقدانه لاي شكل من اشكال الدعم النفسي والمادي والاجتماعي<br />اجبار المجتمع له على التخفي والانكار حتى في دول الغرب لانه النظرة مازالت سلبية لعمليات التحويل كالمجتمعات الشرقية تماما ولكن بفارق ان القانون في الغرب يحميه ويحفظ حقوقه كانسان ولكن هذا لايلغي الرعب من قلوبهم من انفضاح امرهم وهدم حياتهم<br />بعض المتحولين وخاصة المتحولة من ذكر لانثى مظهرها الخارجي يكون غير متناسق فيبقى امرها مفضوح لانه ليس من السهل التخلص من العضلات وخشونة الصوت والجبهة العريضة..وغيرها من مظاهر الرجولة مما يصعب عليها التخفي في المجتمع بجنسها الجديد فيستحيل تقبلها كانثى لتفقد اي فرصه للنجاة بنفسها بالعمل اوايجاد الشريك وممارسة حياتها بشكل طبيعي.. وكثير منهن يلجأن للعمل في البغاء للحصول على المال ولتثبت للمجتمع انها انثى مرغوبة<br />ثانيا ماهي علاقة المفتيين في موضوع طبي بحت؟؟؟ اضطراب الهوية الجنسية هو مرض له اسباب واعراض وعملية التحويل هي علاج.. اذا الكلمة الاولى والاخيرة ان كانت العمليات الجراحية او ان كان هناك بدائل اخرى للعلاج هي للطبيب وحده.. وان كان الطبيب نفسه لايستطيع وضع قاعدة موحدة لكيفية علاج جميع الحالات فكل حالة لها تفاصيلها المختلفة، اذا كيف للمفتي ان يضع قاعدة لجميع الحالات بمنع علاجها جراحيا ؟؟ ولو كان هناك شبهة في حرمانية اجراء هكذا عمليات، هناك قاعدة فقهية تقول الضرورات تبيح المحظورات.. ان اي شخص مصاب باضطراب في الهوية الجنسية لديه ميول انتحارية لعدم قدرة البشر على تحمل مصيبة بهذا الحجم ولا اظن هناك ضرورة تبيح المحظور بقدر الحفاظ على النفس.<br />ثالثا وعندما يقرر المجتمع او المفتيين تحريم علاج ما لشبهة فيه اذا عليهم ان يقدموا البديل .. فمثلا لو كان علاج احدى الامراض المستعصية بشرب الخمره المحرمة تحريم صريح، ولابديل لهذا العلاج الا بشربها للحفاظ على حياته.. فهل فعلا عليه ان يموت بمرضه لان شرب الخمره حرام؟؟ واقول بكل تاكيد لا يوجد حالة واحدة سجلت بانها اضطراب في الهوية الجنسية وتم علاجها بالطرق النفسية.. الا ان كان تشخيص الحالة من البداية خاطئ.<br />رابعا وهي الاهم بنظري لناخذ مثال لانثى عليها ان تتحول لذكر عندما تبدا سن المراهقة ومايصحبه من ميل عاطفي نحو الاناث كاي شاب في عمرها .. مالحل هنا؟؟ طبيعي كمجتمع عربي اسلامي يرفض ان تقيم علاقة صداقة او اختلاط مع الذكور مع انها لاتشعر باي عاطفة جنسية او غرامية نحوهم.. وفي نفس الوقت لو سمحنا لها بالاختلاط بالاناث سيحصل ما لاتحمد عقباه لان الوضع تماما كانك تركت الحرية لشاب ليعيش وسط الاناث وغالبا تحدث امور كالملامسة او الرقص او تغيير ملابس و غيره ممالايحتمله الشاب لكبت رغبته مهما كان ملتزما دينيا … مما يؤدي الى اقامة علاقات غير مشروعة وفتنة \"معدية\" فاول علاقة لهذه المضطربة غالبا ستتحول لشاذة والشاذة ستقيم علاقة جديدة مع فتاة اخرى وهكذا وذلك ايضا حال الشاب المضطرب الهوية الجنسية… هل الحل عزلهم عن العالم كله؟؟ لا تعامل مع ذكور ولا اناث؟؟ حبسهم في غرفة بلا نافذة ولا باب؟؟ طبعا هذا حل غير واقعي ولا انساني مع انه تم تطبيقه على البعض ..اليس الاصلح للمجتمع ان تقوم هذه الانثى بالتحول الى ذكر ومن ثم الزواج والاكتفاء بامراة واحدة دون التسبب بضرر للمجتمع وحتى ان لم يستطع الزواج على الاقل يكون مظهره الخارجي كافي للحكم عليه ان كان يسمح له بالاختلاط بالاناث او الذكور..او الذكر بالتحول لانثى والزواج والعيش بسلام دون اثارة الفتن واقامة العلاقات الغير مشروعة.. ام ترغبون بمزيد من السحاق واللواط في مجتمعنا؟؟<br />خامسا هناك من يظن ان الموضوع كله موضة او نزوة او من باب التغيير وهذه اسخف نكتة ممكن ان تقال.. كيف لانسان ان يضع جسده تحت مشارط الجراحين لاجراء عمليات معقدة وخطرة وكيف لانسان ان ينفق كل تحويشة العمر والتي غالبا لاتكفي فيلجا للقروض التي يسددها طيلة حياته وكيف لانسان ان يضطر لمسح ذاكرة مالايقل عن عشرين عاما بكل ماتحملها ليبدا من تحت الصفر في بلد غريب وكيف لانسان ان يدخل تجربة لارجعة فيها نتائجها غير مضمونة فقط لانه الموضة تحتم عليه فعل ذلك!! او سمع ان شخصا فعلها فقرر تقليده!! هذا كلام لايخرج الا من السفهاء,,, من يقوم بالتحويل لا يمكن الا وانه قد وصل لحافة الانتحار.. فحينها فقط سيقبل باي خسائر حتى يحافظ على حياته وهذه غريزة البقاء لكل الكائنات .. وهناك من الجاهلين من يعتقد ان الانتحار هو دائما لضعف النفس.. اقول له ان الانتحار للمرضى النفسيين غالبا يكون سببه اصابة الشخص باكتئاب حاد والاكتئاب يبدا نفسيا وينتهي بتغير كميات سوائل الدماغ ونسبتها مما يجعل الشخص احيانا يرى ويسمع امورا غير موجودة من هلوسات والقيام بافعال دون وعي كحالة المجنون وان بدى عليه احيانا العقل والوعي وغالبا من يقوم بالانتحار لاسباب نفسية يقوم به وهو خارج عن وعيه وحتى هذه الحالة حسابها عند الله يختلف لانه يعتبر كالمجنون بخلاف من يقوم بالانتحار مثلا لانه خسر ماله او غيره من الاسباب التي لاعلاقة لها بالامراض النفسية<br />سادسا : من زمن بعيد كان يحكم على المولود ان كان انثى او ذكر من شكل اعضاءه الجنسية الظاهرة فقط وبعد تطور العلم والطب اكتشف المجتمع انه تم ظلم الكثيرون لان معيار تحديد الجنس بشكل الاعضاء التناسلية لم يكن كافيا فهناك الهرمونات ونسبها والغدد المسؤلة عن افرزها فاضافوا معيار جديد لتحديد جنس المولود وهو الهرمون.. وبعد فترة تطور العلم والطب مرة اخرى واصبح لديه القدرة على رؤية ماداخل الاحشاء فاكتشفوا اناثا بخصيتان داخليتين في احشائهم وذكورا برحم واناثا بلا رحم ومبايض وغيره الكثير من امور لم يكن ممكن رويتها ولامعرفتها الا من خلال التكنولوجيا وهنا ظن المجتمع ان معايير تحديد الجنس قد اكتملت ولن يظلم احد وسيجلدوا كل من لا يعترف بجنسه بلا رحمة طالما انطبقت عليه كل المعايير السابقة… وبعد مرور سنوات طويلة تطور العلم مرة اخرى ووجدو هناك اناثا مكتلمين الانوثة وكل المعايير السابقة تثبت انهم اناثا ولكن الكروموسوم الذي يحملونه هو كروموسوم ذكري وكذلك الحال بالنسبة للذكور… وبعد فترة اكتشفوا ان هناك حالات تحمل كروموسوم لا هو ذكري ولا انثوي وحاليا اقول لكم ولا اعتقد ان الكثرين يعلمون ان اخر دراسة تثبت ان المتحولين يحملون تركيبه عقل الجنس الذي تحولوا اليه لانه تركيبة المخ تشريحيا تختلف من الذكر للانثى… هذا يعني ان الانثى التي تحولت لذكر هي اساسا لديها مخ مطابقا من ناحية تشريحية لمخ الذكر والعكس بالنسبة للذكور المتحولين… ولا تستغربوا حين يتطور العلم مرة اخرة وتكتشفوا كم مدى عمق مستنقع الجهل الذي غرقت فيه مجتمعاتنا .. لااقصد جهل علمي فقط بل جهل اخلاقي وانساني وديني<br />واخيرا مع احترامي لجميع المفتيين لكن اتمنى ان اسمع شيخ وهو يفتي في حالة اضطراب الهوية الجنسية ويشعرني انه قادر على التفريق مابين هذه الحالة ومابين الشذوذ الجنسي للاسف هناك جهل في هذا الامر من قبل الشيوخ .. واشك ان اي من هؤلاء الشيوخ قد جلس مع الاطباء المختصين وللاسف هم غير متوفرين في العالم العربي قبل ان يحكم في المسألة .. وكل تقديري وحبي للشيخ فيصل المولوي الذي اصدر فتوى فيها شرحا طبي تفصيلي للحالة واباح اجراء التحويل بعد المرور بمراحل علاجية اشترطها الاطباء قبل اجراء العملية لضمان ان العملية ستكون في صالح المريض وليس ضده بعد التأكد من صحة التشخيص.. بالمختصر فتوى علمية مبنية على تقارير الاطباء وليس اعتباطا<br />والسلام عليكم ورحمة الله وبركاته"
