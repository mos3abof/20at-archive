text = "اقتباس سارة:<br />ياااااااه أقبل بس<br />أنا أتمنى<br />أنا مصرية وأكبر أمنية لى أن أـزوج مجاهد وأن نعيش بفلسطين<br />وأن أكون شريكته فى جهاده<br />شوفولى عريس بقى<br />ربنا يثبتهم وينصرهم يارب<br />ايه المشكلة انك تكون استهادى<br />ربنا يكرمك بالى تستهالك ويقوفك ويكون فى ميزان حسناتك"
