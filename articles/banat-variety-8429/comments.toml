posted = "2009-12-26"
text = "والله انا بكيت لما قراءت المقال<br />ولكني ليس عندي الجرأءه علي ذلك ولكنه حلمي<br />ولو كان بعقلي لوافقت عليه فقد احاول الجهاد معه و أمزق الأعداء بيدي و ولكني لا اريد أن ايتم اطفال<br />فيمكنني ان اجاهد بنفسي وزوجي فهو ذلك بطل<br />ولكن نقطت ضعفي هي الأطفال أي أطفال<br />أكره ان اري طفلا يتألم نفسيا اوجسديا"
