subject = ""
author = "فجرى"
posted = "2009-12-21"
text = "مش اى بنت تردى انها تاخد واحد مجاهد<br />تفكير البنات مش زيه بعده واكيد الى تردى بانسان مجاهد تبقى على قدر من الالتزام وحتتفهم الظروف الى هو فيها وتغيبه كثيرا وعدم الاستقرار فى الحياه ربنا يرزقهم جميعا بالزوجات الصالحات ويرزق بناات المسلمين بالازواج الصالحه اللهم امين"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227041008/http://www.20at.com:80/banat/variety/8429-2009-11-04-13-01-56.html"

