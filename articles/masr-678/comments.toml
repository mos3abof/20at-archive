subject = "كل سنه وانتم طيبين"
author = "عبد الحليم ::::مصري"
posted = "2006-07-23"
text = "انا بقه عارف الجيش العربي فين<br />الجيش العربي في مصر .... بيقبض بالملايين ويتمتع بكل الحمايه والدعم علشان يفضل ولائه للامبراطور الاعظم<br />وطبعا الامر لا يخلو من بعض العقاب والتخويف لكل من تسول له نفسه ان يعبر عن رايه بحريه ... يا جماعه الموضوع مترتبله كويس قوي ... الحاكم فاهم كويس قوي من اين تؤكل الكتف ... المهم احنا مشغولين اليومين دول في ارتفاع اسعار البنزين والسولار في الوقت اللي بنتسرق فيه عيني عينك في كل ساعه وكل دقيقة وكل ثانية في النهايه لنا الله ولكل الشعوب العربيه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062252/http://masr.20at.com:80/article.php?sid=678"

