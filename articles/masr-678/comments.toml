[[comments]]
order = 10
subject = "شاعر ممتاز"
author = "ابو اسامة"
posted = "2006-07-26"
text = "انا احييى هذا الشاعر الذى عبر بصدق عن حالة الجيوش العربية التى لم تعد عنده اى قدرة على مواجهة حتى الحاكم الذى يهينها<br />نعم ان هؤلآالحكام اهانوا الجيوش العربية لأنه لم يعطها الفرصة للتعبير عن وجودها<br />وهذا لأنه لايعطى الفرصة للشرفأ من القيادات فى الجيش للوصول الى اماكن مهمة ومؤثرة ولم يعد هؤلآ الحكام يرقون فى الجيش الا من عندهم ثقافة الأستسلا والخنوع لأهدافهم ومصالحهم كثائر جميع المؤسسات المصرية فأصبح الجيش هو مؤسسة تابعة للرئيس لاتنفذ الا ما يامرها به والذى يخدم مصالح مرتزقة النظام فأن هؤلآ الحكام لا يريدون حربا حفاظا على ما جمعوه من اموال وخوفا على شكاتهم واستثمارتهم فأصبح<br />الجيش يتحكم فيه اصحاب المصالح حرصا على مصالحهم فلم يعد عندنا جيش ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062252/http://masr.20at.com:80/article.php?sid=678"

