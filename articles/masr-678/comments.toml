subject = "الجيزة"
author = "مصرى وعربى"
posted = "2006-08-10"
text = "العرب لا قيمة لهم وثمن وخاصة الشعب المصرى الجبان ماذا فعل هذه الشعب الجبان عندما قتل 3جنودمصرين عند الحدود المصرية الفلسطنية ثم 2 اخرين ولم يتحرك مبارك بخصوص هولاء الجنود ولذلك اطلب من كل شاب مصرى بعدم تقديم نفسة للخدمة العسكريةللانتقام للشهداء المصرين وانا واثق ان هذا لايحدث من هذا الشعب الجبان الضعيف ولذلك لا استعجب من موقف الشعوب العربية اتجاة القضية البنابية واقول للشعب البنانى لاتنتظر شى من هذه الشعوب العربية الجبانة وخاصة الشعب الصرى"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062252/http://masr.20at.com:80/article.php?sid=678"

