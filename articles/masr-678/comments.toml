[[comments]]
order = 4
subject = "الجيش العربى!!"
author = "عابر القارات"
posted = "2006-07-23"
text = "الجيش العربى و طبع أكيد نواته الجيش المصرى و اللى بيمثل أكبر و المفروض أكثر الجيوش العربية تدريبا بقى عبارة عن مرتزقه يعنى بيحارب لما بتكون فى سبوبة كويسه زى ما حصل فى حرب العراق أيام إيران و حرب العراق الثانية أيام الكويت فى الحالة الاولى الجيش المصرى راح يحارب مع العراق بحجة الدفاع عن العراق ضد المغتصبين الايرانيين الوحشين و فى الحالة الثانية حارب ضد العراق علشان العراق كانت هيه اللى طاله بدور الشرير فى الفيلم ده و طبعافى الحالتين الجيش المصرى حارب و إتدفع تمنه زى ما قال واحد كويتى مرة لواحد مصرى لما المصرى حب يتنطط عليه و يقوله إحنا اللى حررنالكم الكويت و طبعا الكويتى كان عنده ... للاسف فى الحالتين إتدفع ثمنه و فى الحالتين أدار ظهره للعدو الحقيقى إللى هوه إسرائيل و راح يحارب دول مسلمة مهما كانت !!! و لسه بتقول الجيش العربى فين ... الجيش العربى عاطل عن العمل و مستنى سبوبة جديدة يمكن فى حرب قريب على دولة مسلمة و لا حاجة."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062252/http://masr.20at.com:80/article.php?sid=678"

