[[comments]]
order = 12
subject = "الجيش المصري المنتصر الوحيد"
author = "أحمد"
posted = "2006-07-26"
text = "هل تتذكر يا أخي كم حرباً خاضتها مصر ضد جيش إسرائيل الغادر الغاشم الأحمق، منذ خطط مهندسو الاستعمار الأوروبي لتأسيس الكيان الاستيطاني الصهيوني علي الأراضي العربية؟ وهل تعرف كم شهيداً قضي نحبه، دفاعاً عن الأرض والعرض وكرامة بلادك وكرامة الأمة العربية؟ وهل تنسي كم من رجال هذا البلد ارتوت بدمائهم أرض فلسطين في حرب ٤٨، وأرض بورسعيد في ٥٦، وأرض سيناء في ٦٧، لننتزع نصراً يكسر كبرياء القوة، وغرور البطش الإسرائيلي في حرب أكتوبر٧٣؟<br />أذكرك فقط - لكي تسجد شكراً - أنك تنتمي للشعب المنتصر، بل الشعب «المنتصر الوحيد» علي خريطة الشرق الأوسط، تنعم في بلادك علي أرض حرة، لا تدنسها قدم مستعمر، ولا تلوثها دبابات غازية، أذكرك يا أخي لكي لا تنسي أنك تحيا في وطن مرفوع الرأس، وطن حارب أهله بشرف وانتصر بشموخ، ووقف يتحدي العالم بالحرب والقوة والصمود، ويبارز الدنيا في ساحات السياسة والدبلوماسية والتفاوض، حتي صارت مصر حرة مستقلة محررة، جيشك لك، لك وحدك، أنت وأبنائك، جيش مصر كان، ولايزال هو الجيش الأطهر والأنقي والأعظم بين جيوش هذه الأمة، جيش لم يحارب رجاله إلا في معارك الشرف، ولم تكن لهم غايات إلا عزة هذه الأرض، ولم تهنأ أرواحهم إلا والعلم يرفرف علي الحدود، كل الحدود، وأطلال الحرب تروي قصص بطولاتهم وصفحات نضالهم المجيد .<br />جيش مصر، هو الجيش الذي لا يقارن، وليس من حق أحد مقارنة مجده وانتصاره التاريخي، بأي نوع آخر من النضال والانتصار، وأرجوك ألا تقبل هذه المقارنة أبداً، ولا تقبل المساواة بين ما ضحي به جيشك أنت، وما ضحي به الآخرون، أياً كان موقعك اتفاقاً واختلافاً مع النظام السياسي في البلاد، فرؤيتك السياسية لا يجب أن تنعكس مطلقاً ع<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062252/http://masr.20at.com:80/article.php?sid=678"

[[comments]]
order = 13
subject = "الجيشفى اجازة"
author = "سىسيد"
posted = "2006-07-27"
text = "لا لاالجيش العربى لا اعرفو اما جيش مصر هو فى اجازة من يوم ما مات الرئيس جمال عبد الناصر الف رحمة علية وعلى رجال الجيش القديم حتى 73 بعد هذ حضر الطيار حسنى و طار بالجيش على القصر نصف بس ونصف الاخر خروج من الخدمة على المعاش الان الطيار حسنى محمدمبارك هو وابنو وابنو والزوجة العزيزةهم اكبر اصحاب امريكا يعنى مش ممكن ياسيب القصر بدون خدم وحرس ؟؟ ولكن اين الشعب من هذ الخادع الكاذب هو و الوزارء اين حق اهل مصر لا تفرحو على روخص الرغيف افرحو على كرمت اهل مصر فى لسان كل العالم ووالف خسرة عليك يا مصر عضة من كلب خالةمصر ؟؟؟وسلامى على الاخ الشوجع صاحب الشاعر الجميل اللة معة واللة انا خيف علية بس هذ هو الرجل لا لا يخاف من سجن ولا تعذيب الف الف خسرة على جيل بعد 73 مثل الجيش ارجو لا لا تسمع الى اى حزب لان هم ايضآ وراء الفلوس شوف رجال المسلمين حزب اللة اللة معهم علشان الحرية الحرية بدون قرش ,,, ولاة ريئس نافع ولا جيش نافع واطلب من اللة الصبر,,,؟؟؟"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062252/http://masr.20at.com:80/article.php?sid=678"

[[comments]]
order = 14
subject = "التعليق على أحداث لبنان و فلسطين الأخيرة"
author = "مسلم مصرى"
posted = "2006-08-01"
text = "التعليق على أحداث لبنان و فلسطين الأخيرة<br />كتب : الشيخ الدكتور ياسر برهامى<br />أكثر من تساؤل و استفسار تم ارساله الى الموقع طُلب فيه التعليق على الأحداث الحالية من حزب الله وهل نساعدهم وندعوا لهم أم ما هو موقفنا تجاههم فنقول و الله الموفق :<br />أما الأحداث الحالية فهي أحداث متشابكة ولا يصح موقف عام من كل هذه السلة من هذه الأمور المحبوبة والمكروهة ولابد من التفصيل فلا شك أن هناك أعمال قلبية واجبة وأيضاً هناك أعمال قولية واجبة أيضاً مع قضية متعلقة بالولاء والبراء حتى وإن لم يتمكن المسلمون آحاداً من أن يدفعوا عن المسلمين في مكان آخر، فأما بالنسبة إلى ظلم اليهود وطغيانهم وكفرهم فلا شك أن كل مسلم يجب عليه أن يبغضهم في الله عز وجل أشد البغضاء لأنهم أشد الناس عداوة للذين آمنوا يقول الله تبارك وتعالى: (لَتَجِدَنَّ أَشَدَّ النَّاسِ عَدَاوَةً لِلَّذِينَ آمَنُوا الْيَهُودَ وَالَّذِينَ أَشْرَكُوا )(المائدة: من الآية82).<br />وقد دخل في الذين أشركوا النصارى الذين يعاونون اليهود ويفرحون بما يفعلونه بالمسلمين من أذية وقتل في فلسطين وأيضاً هم يعاونون ويخططون في العراق وفى غيرها وهذا أمر لا شك لابد أن يعتقده كل مسلم، لأن الترويج بأن العداوة بيننا وبينهم قد انتهت إلى الأبد والسلام قد حل إلى الأبد كل ذلك دعاية خبيثة مناقضة للكتاب والسنة ومناقضة لما أخبر به النبي- صلى الله عليه وسلم- عن وقوعه، وإنما الهدنة أمر مؤقت وهذا لا يشك فيه أي مسلم يعلم كتاب الله عز وجل وسنة نبيه صلى الله عليه وسلم.<br />وبغضهم هذا يقتضي البراءة منهم ومما يفعلون، وإذا زادوا في أذية المسلمين وبطشوا جبارين كبطش عاد وفرعون وأمثالهم فهذا مما ينزل الله بأسه بهم بسببه قال تعالى: ( عَسَى رَبُّكُمْ أَنْ يُهْلِكَ عَدُوَّكُمْ<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062252/http://masr.20at.com:80/article.php?sid=678"

[[comments]]
order = 15
subject = "خيــــــر جنود الارض"
author = "محمد ذكى الشاملى"
posted = "2006-08-01"
text = "حقاخير جنود الارض هو الجندى المصرى الذى هو جزء لا يتجزاء من الجيش المصرى اعزة اللةوانى قدكان لى الشرف ان التحق بالخدمة العسكرية بسلاح الدفاع الجوى على حدود مصر و ليبيا (حباطة)وقدعانيت الامرين ولكن ما زادنى هذا الا قوة وجعل منى رجل بحق واقسم لكم ان الجيش المصرى فى احسن حالاتةوهو المؤسسة الوحيدة فى مصر الذى يجب ان تحترم ولا نكن لها الا الاحترام لانها بحق درع مصر الواقى بقوتها وعتادها و جنودها البواسل الذى كان لى الشرف انى كنت واحد منهم و مازلت اذا احتاجنى وطنى الغالى وخير جنود الارض نعم فذلك بشهادة رسولنا الكريم علية الصلاة و السلام"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062252/http://masr.20at.com:80/article.php?sid=678"

