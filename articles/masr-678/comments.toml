[[comments]]
order = 8
subject = "جارى البحث عنه"
author = "افنان"
posted = "2006-07-24"
text = "هو الجيش العربى موجود من اصله انا بدور عليه ومش لاقيه احنا ممكن نعمل ورقة ونلزقها فى كل محافظات مصر ونكتب عليها خرج ولم يعد ونقول لقد خرج الجيش ولم يعد ومن يراه يتصل على الهاتف وله مكافاة هياخد قلمين وبوكسين وممكن يكهربوه وممكن يموتوه ومن يتقدم بتقديم المكافاة هى امريكا واسرائيل وبجد بجد مافبش حاجة اسمها جيش عربى لان العرب اتفقوا على ان لا يتفقوا وبعدين حتى لوكان فى جيش عربى مش هنروح نحارب لانى امريكا ماسكة العصاية لينا يعنى اللى هيرسل جيشه للمحاربة او لمساعدة لبنان امريكا هتديله على افاه وسلملى على جامعة الدول العربية"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062252/http://masr.20at.com:80/article.php?sid=678"

