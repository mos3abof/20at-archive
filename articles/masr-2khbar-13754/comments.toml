posted = "2009-10-20"
text = "عمري ما كانت مشكلتي مع ايا من تقدم لي المادة بل دائما الاخلاق<br />حتي من ظننت فيه حسن الخلق اثبت الوقت خبثه<br />او انه ابن ابيه او ابن امه<br />ما زال الامل في ان الطيبيين للطيبات"
archived = "2009-10-20"
