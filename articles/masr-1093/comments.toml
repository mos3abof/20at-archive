posted = "2006-10-26"
text = "اولا احيي الاخ عادل على تعليقه العادل فمن حق كل شخص ان يقول رايه وان يلقى معارضه بشكل مهذب و محترم كما فعل الاخ.<br />وفى المقابل اخرى الشخص الغير محترم الذى يسمى نفسه alkmik احد مهاويس الانترنت ما ان يلاقى راى يخالف راييه حتى لا يتمالك نفسه ولا يجد امامه الا الشتيمه وسوء الادب ، انه احد هؤلاء المتعصبين الاغبياء الذى لن تستفيد البلد من ورائهم الا الكلام.<br />نعم للتوريث ولاستكمال المسيره"
