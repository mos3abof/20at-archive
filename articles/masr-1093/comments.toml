[[comments]]
order = 24
subject = "أدعو الله تعالى أن يفك أسره"
author = "فهمي"
posted = "2006-10-31"
text = "والله وانا أقرأ هذا التقرير دمعت عيناي ، حزنا وفرحا .<br />حزنت على حاله وحال الاسرى في السجون ، ان سألتموني عن أي شئ تكرهه في هذه الدنيا ، فسأقول لكم السجن خاصة ان كان من ذوي القربى ، فالسجن وحياة السجن قاسية خاصة ان كنت مظلوما ومقهورا .<br />فرحت لأني وجدت ان الامة الاسلامية بخير ما دام فيها أمثال هذه القيادات ، عرفت أن الأمة بخير ما دام أبناؤها يضحون بكل ما يملكون في سبيل عزتها وكرامتها .<br />ختاما أدعو الله تعالى ان يفك أسر أخانا الدكتور عصام ، وأن يفرج كربه .<br />بارك الله في كاتب المقال ."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014932/http://masr.20at.com:80/article.php?sid=1093"

[[comments]]
order = 25
subject = "كل سنة وانت طيب ياعمو"
author = "أسماء"
posted = "2006-10-31"
text = "كل سنة وانت طيب ياعمو عصام<br />وحشتنا جدا ووحشنا صوتك وضحكتك وسؤالك عنا<br />وحشت النقابة وبيتك وجيرانك وحبايبك كلهم<br />معلش ياعمو مش أول مرة يحصل كده احتسب عند ربنا أجرك وأيمك اللى بتكون طاعة حتى في وسط المنحة<br />فاكر ياعمو زمان لما كنا نيجي ونجري عليكم وتاخدونا في احضانكم انت وابي الله يرحمه لما كنت هناك في ملحق طرة برضه من غير تهمة او ذنب غير انكم بتقولوا لا اله الا الله<br />معلش ياسمية وانتي يااسماء وياخالتو فاطمة اصبروا ..طالما نه عمو على الحق فمايهمكوش من اللى بيعملوا<br />قلبي معاكم وقولوا لعمو ماتنساش بنت اخوك من دعائك<br />أسماء"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014932/http://masr.20at.com:80/article.php?sid=1093"

