[[comments]]
order = 13
subject = "بايع ضميرة"
author = "فارس _fr"
posted = "2006-10-30"
text = "ردا على الزفت اللى اسمه الدشم \" اقل ما يمكن ان اصفك به هو انك انسان حقير ومعندكش اى ضمير وختلاف فى الراى ايه يا حشرة انت ,, وتوريث ايه اللى انت بتتكلم عنه يا كلب ,,, وبعدين بتوصف اهل بلدك بالعامة من الناس ,, كان ناقص تقول عليهم حشرات يا كلب ماهو انت واللى زيك هم اللىموديين البلد فى داهية يا حيوان ,,, انا اسف لكل انسان محترم جرحته باسلوب ردى على الشئ ده بس كان لازم ارد عليه وعلى اللى زيه كده ,, وبالعند فيك يا كلب الحكومة انت ...<br />لا للتوريث واستكمال الفطيرة .... اكيد انت اللى زيك عينه مبتشفش النا عاملة ايه وحالها عامل ازاى يا كلب يا حيوان .....<br />وكفاية عليك كده ...<br />اسف مرة تانية ولكن الحيوان ده خرجنى عن شعورى ... اسف<br />لا للتوريث ولا لاستكمال الفطيرة"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014932/http://masr.20at.com:80/article.php?sid=1093"

