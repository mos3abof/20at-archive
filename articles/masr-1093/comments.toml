[[comments]]
order = 21
subject = "كل عام وانت مُعلمي المحبوس"
author = "إسلام لطفي"
posted = "2006-10-30"
text = "أبي ومُعلمي في الله الدكتور عصام<br />كل عام وانت محبوس خلف اسوار الكبت والظلام , كل رمضان وانت صائم داخل اسوار وطن صار يخشى حتى من الكلام , كل عام والجماعة بلا مدرب محنك في التعامل مع \"حيوانات\" السياسة في مصر . .<br />كل عام وانت مختطف من بيننا انت وزمرة من اخوانك حتى ألفنا الأمروصرنا نستغربه ان مر الحول عليك كاملاً دون غياب<br />كل عام وانت رمز للحرية لدى جميع فصائل مصر السياسية ما عدا فصيل واحد اتمنى ألا تكون قد استنتجت اسمه . . وحتى ان استنتجته فثقتي في اخلاصك وايمانك كبيرة فما عند الناس ينفذ وما عند الله باق"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014932/http://masr.20at.com:80/article.php?sid=1093"

[[comments]]
order = 22
subject = "أصبروا وصابروا ورابطوا"
author = "أسامة"
posted = "2006-10-30"
text = "بسم الله الرحمن الرحيم<br />(( قَالَ رَبِّ السِّجْنُ أَحَبُّ إِلَيَّ مِمَّا يَدْعُونَنِي إِلَيْه)ِ)<br />- صبرك الله أخ عصام وفك كربك ..<br />- وملاحظة للذين يعلقون على تعليق الدشم أذكرهم بحديث رسول الله (ص) \"ليس المؤمن بطعان ولا لعان ولا فاحش ولا بذيء\" ..<br />- بوركت يا مجاهد .. :) ومنتظرين منك لقاءات شيقة أخرى .. تحياتي"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014932/http://masr.20at.com:80/article.php?sid=1093"

