posted = "2009-12-30"
text = "مش شرط ان التعامل يبقى على اساس انا لبسة دبلة فمحدش هيفهمنى غلط ياجماعة كل واحد لية حدود والى يتعدى الحدود دى نوقفه عند حدة سواء فى دبلة او مفيش دبلة ,مش معا احمد لما قالى انه بيتعامل وحش مع السكرتيرة لنه خايف تفهم ضحكتة او لطفة بطريقة غلط او انه معجب بها بالعكس كدا مكنش حد اتعامل مع حد بلطف لو انا مثلا بنت ليا حدود فى التعامل وعارفة انا بعمل اية عمر ماحد هيفهمنى غلط والى هيفهم غلط يبقى اتعدى حدودة يبقى لازم اوقفة ونقولللللللل استوب"
archived = "2010-01-06"
