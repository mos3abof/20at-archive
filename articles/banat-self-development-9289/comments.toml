text = "والله يا هبه انا كمان بضم صوتي لكل الناس اللي اجريتي معاهم الحوار، احنا في مجتمعنا الشرقي كتير تفتكر البنت الولد اللي بيعاملها بلطف وزوق انه معجب بيها بس ده بيكون عند البنات المتربية في بيئة منغلقة، وكمان وده الاكثر طبعا ان اي ولد بيلاقي اي بنت بتكلمه عادي وهي في دماغها انه زي اخوها مش اكثر يفتكر مثلا انها معجبة بيه وبترسم عليه الخ الخ…"
