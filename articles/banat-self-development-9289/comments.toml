text = "هو انا اه لسه في صفوف الانتظار بس مش اوي برضو زي بسنت كده<br />بس انا عارفه ومتأكده ان دبلتي هتبقى سبب تقيدي مش حريتي خالص<br />انا كنت بتعامل مع اصحابي في الكليه عادي جدا وكلهم عارفين ان انا اختهم وهم اخواتي<br />بس لما هتخطب انا متأكده ان اللي كان بيحصل قبل كده مش هيحصل بعد الخطوبه و الارتباط<br />لأن خطيبي هيبقى مش عاوزني اصلا اتعامل مع اي ولد سواء داخل الكليه او خارجها وده هيبقى بشكل رسمي اكتر وهتبقى مسئوليه اكبر خصوصا لما دبلته تبقى في ايدي"
archived = "2010-02-12"
