text = "السلام عليكم<br />للأسف فكل ماسبق ذكره حقيقي<br />قبل تجربتي للخطوبه كنت دائما حريصه في كل حرف , حتي لا يعتقد زملائي في العمل انني اكن لهم أية مشاعر<br />بل وقد حدث ان فهم زميل لي خطءا انني عندما اساعده في تقوية مهاراته اللغويه في اللغه الانجليزيه عن طريق اعارته بعض الكتب , انني معجبه به , ده طبعا على مبدأ ان مفيش حاجه لله في لله<br />بعد الخطوبه , كما قالت الاخت سابقا أحرص جدا على اظهار الخاتم<br />ومازال الاحترام كما هو لهم قولا وفعلا حتي مع خطيبي"
