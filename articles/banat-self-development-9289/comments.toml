author = "بسنت"
posted = "2009-12-29"
text = "انا مش ف الصفوف اوووى يعنى<br />بس اناكنت بتعامل عادى ولابتحفظ اووى ولا هزار وتسيب اووى<br />كان الموضوع عادى بالنسبالى لحدماجه يوم وعرفت ان حد من بعض الشباب قال انى معجبه ولهانه متيمه حيرانه<br />ومن ساعتها بقيت اتعامل بتحفظ بس مش اووى يعنى لحدما قالو عليا دى بت كشريه وخنقه ومعقده<br />يعنى لاكده عاجب ولا كده عاجب اعمل ايه ياربى اشق هدومى<br />ده بقى كان قبل الارتباط<br />اما بعد الارتباط فبقيت اتعامل بتحفظ جداا وتبقى وقعتى سودا لوحد جه كلمنى او سألنى ع حاجه يبقى يومى ويومه مش معدى<br />وتقريبا كده بعد الخطوبه والجواز هيتمحى من ذاكرتى اسم ولد او راجل ومش هيفضل فى الجمجمه غير خطيبى<br />انتو عارفين بقى يابنات حكم القوى ع الضعيف بس طبعا احلى حكم واحلى قوووى"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106031006/http://20at.com/banat/self-development/9289-2009-11-04-12-50-23.html"

