[[comments]]
order = 3
subject = "ضمضم رزق"
author = "ضمضم رزق"
posted = "2006-12-24"
text = "\"يا معشر قريش، اللطيمةَ اللطيمةَ، الغوثَ الغوثَ\".. لم تُسجل له صفحات التاريخ غير هذه الكلمات، ولم يُقدِّم شيئًا تذكره به الأجيال سوى أنه جدع أنف ناقته وشق قميصه وأخذ يصرخ ويولول في أهل قريش أن هبُّوا لقتال محمد فإنَّ خطره قد زاد.<br />رأيت هذه الأيام ضمضم بن عمرو الغفاري- الذي استأجره أبو سفيان لاستنهاض قريش- يخرج علينا من جديد؛ تنشق عنه صفحات الجرائد وشاشات الفضائيات ليؤدي نفس الدور الذي لعبه منذ أكثر من ألف وربعمائة عام، خرج علينا بنفس الهيئة ونفس مركب النقص والعقد النفسية والاسترزاق من المصائب والفتن.. في محاولةٍ للبحث عن أي دور.<br />خرج ضمضم هذه المرة مستغلاًّ صور طلبة جامعة الأزهر ليفتح المندبة ويصيح مولولاً: أين أنتم يا سادة القوم؟! أين أنتم يا معشر الأمن؟! أين أنتم يا بني وزارة الداخلية؟!.. إنَّ خطرَ الإخوان قد عمَّ، وبلاءهم طمّ، والويل، الويل.. إن لم تتدبروا أمركم، وتُوحدوا صفَّكم وتضربوا رؤوس الفتنة ضربةَ رجل واحد!!<br />وأخذ ضمضم يهدد ويتوعد بالويل والثبور وعظائم الأمور حتى تمَّ اعتقال الطلبة قُبيل دخولهم موسم الامتحانات.. ليته سكت، بل ظل ينفخ في نار الفتنة لتحرق الجميع.<br />حكى لي زميلٌ صحفي بالجريدة اليومية التي يعمل بها \"ضمضم\" القرن الحادي والعشرين أن بدايةَ ظهوره ككاتب عمود لأول مرة واكبت ترك رئيس التحرير السابق للجريدة، فاهتبل \"ضمضم\" الفرصةَ وكان حريصًا على لفتِ انتباه القراء وإثارةِ أي نوعٍ من الجدل يثبت به أمام رئيس التحرير الجديد أنَّ له قلمًا مؤثرًا، يُثير الرأي العام.. حتى لو الناس تشتمه.. المهم يثبت وجوده، مثلما كان يفعل من قبل عندما كان يرسل لنفسه خطابات تهديد مدعيًا أنه الكاتب اللوزعي الذي تطارده جحافل المتطرفين، فلم يجد- منذ أن بدأ كتابة عموده الثابت- أفضل<br />اقرأ بقية التعليق .."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010823/http://masr.20at.com:80/article.php?sid=1344"

