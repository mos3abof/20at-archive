[[comments]]
order = 7
subject = "لا يا سيد حمدى أنت غير محق"
author = "زميل لك في نقابة الصحفيين"
posted = "2006-12-24"
text = "عزيزي حمدى رزق اسمح لى أن أقول بانك غير موضوعي في طرحك بشكل عام فهناك آلاف المشاكل والقضايا التي يعانيها المجتمع المصري وتحتاج الى معالجة ، أما أن يكون شغلك الشاغل هو محاربة الاخوان وتوجيه الاتهامات اليها ، فانا أدعوك الى اعادة النظر في هذا المنهج ، لأن الشعب يعرف جيدا من هم الاخوان واحتك بهم عمليا ، فهم مواطنون مصريون مجتهدون يريدون أن يخرجوا بمصر من هذا النفق المظلم الذي تعيشه سواء على مستوى الفساد المالى والاداري أو على مستوى تكميم أفواه خلق الله والاستئثار بالسلطة وتوريثها باساليب غير مشروعة .<br />لماذا يا سيد حمدي لا نحتكم للشعب ، وعندئذ لتكن الكلمة الفصل لارادة الشعب ؟<br />لماذ اسلوبك انتحاري في العداء للاخوان ، صدقني يا حمدي لو أخلصت النية وقرأت ادبيات الاخوان بانصاف واحتككت بممارساتهم الراقية لكنت واحد من هؤلاء الذين لا هم لهم سوى نهضة بلدهم ؟<br />أقول هذا الكلام وأنا مدرك أن عداءك للاخوان سافر ومستحكم ، وأن ما تحصده من وراء ذلك كثير وكثير ، لكن لعله يأتي اليوم الذي تجرى فيه مراجعة وتقف مع نفسك وقفة جادة وصادقة ، وثق تماما يا سيد حمدى أن الأمن رغم عدائه للاخوان الا أنه يحترمهم ويقدرهم فيما يعرف مدى نفاقك أنت وسرايا والقط وآخرين<br />اكتب في شئ مفيد يا سيد حمدى لعله ينفعك في الدنيا والآخرة"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010823/http://masr.20at.com:80/article.php?sid=1344"

[[comments]]
order = 8
subject = "قل ماشئت ولاتخشى"
author = "ايمن امام"
posted = "2006-12-24"
text = "الى حمدوف - اخيرا اظهرت وجهك الحقيقى هذه المقاله تفسر كل ماقرأته لك من قبل-لاالسجون ولا المعتقلات ولا التعذيب - سيمنع هويه هذا الشعب - نحن دوله مسلمه الديانه وعربيه الجنس - انت تشعل النار - انت تضع الرئاسه امام احراج داخلى وخارجى - لااعرف هل يقرأ الرئيس مقالاتك هذه - لااعلم هل من حوله ينقلون له الصوره الحقيقيه للرأى العام - كل ما اعرفه انك ومن هم على شاكلتك سيشعلون هذا البلد حريقا انت ومن هم على شاكلتك - يدفعون الامور الى الهاويه - الاتعلم ايها المثقف - ان مجرد التفكير فى هذا الطرح الاعمى يؤدى الى فقدان الرئيس الشرعيه الدستوريه - الاتعلم ايها الهذا ان الدوله ان فعلت ذلك فقد اعلنت الحرب على نفسها - الاتعلم ايها الشىء ان الاسلام باق باق ما بقيت دنيا الرحمن الاتعلم ايها الهذا ان مصر بلد الازهر الشريف - الاتعلم ايها الهذا - ان الدين هو الذى يحمى هذا النظام الحاكم من خروج عليه - الاتعلم ان مجرد شطب الهويه من الدستور هو نهايه هذا النظام فلاامن الدوله ولاالمخابرات ولا الشرطه ولا الجيش سيوقف الغضب الشعبى - لاتظن ان مصر ماتت - بل اريدك ان تكن واثقا انه ان حدث ماتحلم به فأن تبعاته ستكون عاتيه تقتلع هذا النظام ومن عاونه - لاتظن ان ك بهذا تحصل على جائزه فخريه من الاخوه الاقباط - لانك تزيد النار اشتعالا- اقولها لك وليحدث ما يحدث - هذا النظام الحاكم ان اقدم على هذه الخطوه التى تدفعه لها - فأن هذا النظام يكون قد تبرأ من الاسلام ونحن بالتبعه نتبرأ منه - ثم انك لم تتحدث عن الاستفتاء الشعبى على الغاء هذه الماده - وكأنك تضمن مقدما نتيجتها - ياحمدى ان لم تستحى فافعل ما شئت- اجد نفسى الان مرغما ان اوجه رساله الى الرئيس/ نرجوك ان توقف هذا العبث وهؤلاء العابثين نرجوك ان تعيدهم الى رشدهم - عدم الر<br />اقرأ بقية التعليق .."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010823/http://masr.20at.com:80/article.php?sid=1344"

[[comments]]
order = 9
subject = "ريس مين يلة"
author = "واحد و خلاص"
posted = "2006-12-24"
text = "الريس بتاعك اللي ما بيعرفش ينط على مراتة الا بحبوب الفياجرا (دة لو هو راجل من الاساس)اخرتة يبوس جزم اسيادة الامريكان و الصهاينة من امثالة الاستنجاد بة مش حينفع لانة خلاص يا حبيبي جاب جاز و في اخر ايام حكمة الحقير اللي خلى بلدك في اسفل سافلين و النصارى اللي انت عايز تتطمنهم هم اللي فصلوا نفسهم و عملو لهم دولة داخل الدولة و ما يبكوش لما تتجز روسهم لانهم بيمشو وا شنودة الي عايز يخلص ال اية البلد من الاحتلال الاسلامي<br />روح دور لك على حاجة تانية يا شاطر لان كلامك دة ما بيخيلش الا على امثالك من الديول"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010823/http://masr.20at.com:80/article.php?sid=1344"

[[comments]]
order = 10
subject = "فليسقط دعاة الفتن"
author = "وطني مغموم"
posted = "2006-12-25"
text = "تصحيح للعنوان اسمع للأخوان وأمثالهم من شرفاء مصر ولاتخف هكذا تستقيم الأمور وبهذا تكون الوطنيةوالشرف المصري النظيف ان أي منصـف يري مافعله الإخوان فى كل النقابات من انجازات رغم قلة الإمكانيات يعرف حجم كل من يجعجع ولايخدم الوطن بل يفسد وأكل عيشه اشعال الفتن. أشارك الأخ الذي دعاالي محاكمة هذا المفسـدالذي ينفخ فى نار الفتنةبتقديمه سريعا الى القضاء العادل الذي سيريحنا من أمثاله ممن يكرهـون مصـر ويحيون فقط على الدسائس والفتن.<br />انني لم اسمع أوأرى تمييزالإخوان بين أي مواطن فى أي نقابة على أساس الدين وليأت لنا أي شخص تعامل مع ممثلي الإخوان فى أي نقابة مثلا ويقول أنهم اضطهدوه لدينه.اذا لم نجد هذا المضطهد فليخرس أعداء الوطن ودعاة الفتنة وان كتبوا فليكتبوا أفكارهم لإصلاح الوطن وليس هدمهواشك ان مثل هذا المفسـد عنده افكار بناءه"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010823/http://masr.20at.com:80/article.php?sid=1344"

[[comments]]
order = 11
subject = "ليه بتعمل كده ياحمدي"
author = "بحب الإخوان"
posted = "2006-12-25"
text = "بالله عليك ياحمدي ليه بتعمل كده ...<br />ياأخي اتق الله<br />ستقابله يوما ... ويسألك عن الكلمات التي تفوهت بها ...<br />لمصلحة مَن تعمل ...<br />والله إني أخاف عليك أكثر من خوفك على نفسك<br />الدنيا زائلة ... والكراسي لن تبقى ...<br />وسترقد في تربه متران في متر وتحاسب !!! أي والله ستحاسب على كل كلمة تفوهت بها في حق أي إنسان ظلم على يديك أنت وأمن الدولة والنظام البائس<br />تذكر ذلك جيدا تذكر وقوفك بين يدي ربك واصدق مع نفسك أولا قبل أن يصدق قول ربك عليك ألا هل بلغت ؟؟؟ اللهم فاشهد."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010823/http://masr.20at.com:80/article.php?sid=1344"
