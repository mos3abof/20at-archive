[[comments]]
order = 6
subject = "هو مفيش عير ابن الواطى ده .... !!!"
author = "فارس_fr"
posted = "2006-12-24"
text = "اولا معذرة لاى واحد هياذية كلامى !! عن الواطى ابن اللوطى حمدى المخبر ,, اللى ادارةالموقع لازم تتحفنا يوميا بمقال او اتنين له طبعا لزيادة الاقبال على الموقع ,, بس كده انتوا هطفشوا الناس ,, الشئ ده خنقنا ,, حرام عليكم حرام كل يوم ,,مفيش غيره ما الكلاب كتيييييييييير شوفوا كلب غيره ,, ولكن الكلب ده فعلا انطبق عليه قول القائل يا خبيتها إللي حملت و رضعت و ربت!!!!<br />مع تحفظى على الناس اللى بتقول اننا ممكن نختلف مع حمدى فى الراي بس ممننزلش لمستواه ونشتمه !!! احب اقول لهم اسف مش دى الشخصية اللى نتعامل معاها باحترام ده كلب ابن كلب واطى وعميل لنظام اوطى منه !!! ارحمونا بقى هتقوا انتواوالصورة اللى فوق دى ايه كمان<br />الرحمة يا عالم"
archived = "2007-01-08"
