[[comments]]
order = 0
subject = "يا حمدي قلها و لا تخف"
author = "يا حمدي قلها انت ولا تخف و كف عن اللف و الدوران و الهبل و الاستهبال و كفاك عبط و استعباط"
posted = "2006-12-23"
text = "لا تقدر أن تقولها صريحة و تلف و دور بيها يا صاحب كل صفة قبيحة , ماذا تريد بتأكيد الهوية و ما هي الهوية التي تريد توكيدها يا من يصدق عليك لفظ يا خبيتها إللي حملت و رضعت و ربت<br />تلف و دور على الدستور و غرضك من ده كله مادة يتيمة يتم خرقها و هلهلتها ليل نهار و هي ان الإسلام دين الدولة الرسمي<br />يا حمدي الإسلام في مصر مش محتاج مادة في الدستور المنخور أو حتى صاحب قلم مثلك هو في الأصل صاحب ماخور<br />شيلوا المادة حطوا المادة كله في عبادة المادة<br />ياريتك حتى كنت شجاع لكنك أكبر طماع كاثوليكي أكثر من البابا و ملكي أكثر من الملك<br />ياريتها كانت ربت دكر بط كان نفع !!!!"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010823/http://masr.20at.com:80/article.php?sid=1344"

[[comments]]
order = 1
subject = "حمدى رزق ..ربنا يهديك"
author = "ياسر أبو عمار"
posted = "2006-12-24"
text = "يعنى سعادتك شايف ان اللى هيحمى البلد ويحفظ الوحدة الوطنية هو الغاء المادة الثانية من الدستور،قلها يا عمى من غير تلميح ،انا مش عارف المادة دى عملالكم ازعرينة ليه ؟يا جدعان عاوزين تلغوا الاسلام من مصر مفيش اى مانع والله بس ابقوا موتونا واخلصوا من الكام مليون المسلمين اللى فى البلد،ايه المشكلة يعنى ،هى ديتها حملة اعلامية وامنية من بتوع حبايبك يا استاذ حمدى تقول ان المسلمين ارهابيين ولازم نلغى الاسلام شوية من مصر لتهدئة خواطر اخواتنا فى الوطن .يالهوى عليكم وعلى كهنكم ،الاقباط ماقالوش بالغاء هذه المادة تقوموا انتوا تستحثوا الريس على الغائها ؟لا والله عندكم حق ،ما هى ام البلد مستقرة ورايقة والناس عايشة زى الفل علشان تنخروا فى حاجة مستقرة ،هو لازم تعملوا قلق فى اى مكان ،والله العظيم الكلام بتاعك ده المفروض انك تتحاكم بيه بتهمة الاخلال بالسلم الاجتماعى ،هى الدعوة دى مصدرها منين باتلظبط يا عم حمدى ؟قصدى المرة دى واضح انها من برة ،رغم ان كل اطروحاتك العظيمة فى مقالاتك المبدعة فى المصرى اليوم مصدرها داخلى \"وداخلى اخو داخلية \"ودى حاجة مش عاوزة فتاكة ولكن اللى عاوز فتاكة شوية السؤال عن اسباب تبنى المصرى اليوم لمثل هذا الكاتب غريب الاطوار الذى \"عاوز جنازة ويشبع فيها لطم \"ايه يا عم حمدى كله هدم هدم مفيش عندك اى فكرة للبناء والتشجيع .متعرفش تكتب حاجة فى حياتك تشجع فيها على الانجاز او تمتدح حاجة عدلة حصلت من اى واحد مصر -حتى لو كان من الاخوان -ولا انت البرمجة بتاعتك على الشتيمة بس .ربنا يهديك ويخليك تحب البلد دى شوية بدل الترصد بابنائها الوطنيين ومحاولة هدم كل حاجة حلوة فى مصر ."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010823/http://masr.20at.com:80/article.php?sid=1344"

