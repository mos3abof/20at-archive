author = "برضة"
posted = "2008-02-03"
text = "مصر تملك خمسة ملايين فدان - معلوم خمسة ملايين فدان<br />واذا افترضنا جدلا ان كل فدان يحتاج خمسة ايدى عاملة وهذا كثير جدا<br />يبقى الخمسة مليون فدان محتاجين 25 مليون مصرى<br />يبقى باقى عندنا 50 مليون انسان نشغلهم فين<br />ثم انة فى اوروبا وامريكا - يوجد شخص واحد عامل لكل فدان بعد استخدام الالات والمكائن<br />ثم ان الفلاحين عندنا فى القرى قاعدين بدون عمل الان لان رقعة الارض ضيقة<br />ثم ماهو انتاجية الفدان فى السنة فى مصر - 5 الاف جنية - يمكن الحصول عليهم من تصنيع جهاز محمول واحد فى عشر ثوانى -<br />لا بد من التصنيع لان مصر لا تملك ارض زراعية ولا حتى ماء للرى"
archived = "2009-10-30"
capture_url = "https://web.archive.org/web/20091030151936/http://www.20at.com:80/masr/t7kyk/8141.html"

