text = "فعلا الدكتور احمد نظيف مش كفاية الموظفين لا دا كمان المودعين في البنوك الذين لهم ودايع في البنوك وعايشين على ارباحا اي والله عايشين عليها الفايدة كانت 10% وبالانجازات الكبيرة بتاعة الدكتور نظيف اصبحت 6% يعني اللي كان عنده مثلا 10000 جنيه كان بياخد عليهم 100 جنيه في الشهر وعايش بيهم او بيسدوا ركن معين فوجىء بانهم اصبحوا 60 جنيه بس نظيف القط بلاش يا نظيف…"
