text = "امن مركزي عمال يقفل في الشوارع<br />وامن دولة عمال يعتقل في الخلق<br />وتقولي وزارة ورئيس وزارة<br />وفايدته ايه رئيس الوزارة بيتفرج وبيضحك على الخلق<br />الاخ اللي فوق قال لما كان النبي محمد صلى الله عليه وسلم رئيس الوزارة<br />انا عايزكم تشوفوا كمان سيدنا عمر بن الخطاب لما كان رئيس الوزارة عمل ايه<br />مش لازم رئيس وزارة خليه قاعد في بيتهم احسن"
archived = "2009-10-30"
capture_url = "https://web.archive.org/web/20091030151936/http://www.20at.com:80/masr/t7kyk/8141.html"

[[comments]]
