author = "مصرى فلاح"
posted = "2008-01-29"
text = "عاصرت عزيز صدقى عندما كان وزير للصناعة وكنت طفلا صغيرا<br />كان يبنى 3 مدارس كل يومين وخمسة مصانع فى الشهر - ابتداءا من النصر للسيارات والحديد والصلب ومصانع الادوية والمصانع الحربية والغزل والنسيج<br />كانت المصانع تذهب الى المدارس الصناعية الثانوية لتغرى الطلبة ليتلحقوا بها بعد الحصول على الدبلوم - اى واللة كانت تتعاقد مع الطلبة قبل ان يتخرجوا<br />ومكان المهندسين يكلفوا للعمل بالمصانع اجباريا بعد التخرج<br />وكانت مصانع الغزل والنسيج ترسل الاتوبيسات الى القرى لتجذب بعض الشباب لتدريبهم على مهن الغزل والنسيج<br />كان كل واحد بيحصل عمل مناسب - لا بطالة ولا عنوسة والكل بيبنى بلدة باخلاص ولا مكان للحرامية<br />فى الصعيد تطورت مصانع السكر وشركة كيما فى اسوان وشركة الومونيوم نجع حمادى التى بنيت فى صحراء الهو<br />هية يا عزيز<br />لقد بنيت<br />ولكن الحرامية بعدك جاءوا للبيع - بيع كل ما بنيتة وبنتة مصر معك<br />وداعا يا عزيز فقد اديت رسالتك كمصرى اصيل وعريق<br />وليرحمك اللة"
archived = "2009-10-30"
capture_url = "https://web.archive.org/web/20091030151936/http://www.20at.com:80/masr/t7kyk/8141.html"

