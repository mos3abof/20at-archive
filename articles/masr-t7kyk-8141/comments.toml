author = "ابومحسن"
posted = "2008-01-29"
text = "عندما راس الوزارة النبي محمد صلى الله عليه وسلم وزارة جزيرة العرب<br />نريد ان ننوه هنا انه يجب قراءة كتاب عن حال الجزيرة العربية قبل البعثة النبوية المحمدية<br />وعندما راس النبي محمد وزارة الجزيرة العربية ومكث في الوزارة 23 سنه صلوات الله وسلامه عليه<br />عمل لمصلحة شعبه شعب جزيرة العرب ولم يعمل لمصلحة نفسه علشان خاطر بعد كده اي بعد 23 سنه اصبحت الجزيرة العربية اقوى دولة في العالم كله<br />وسار رؤساء الوزارات من بعده على نهجه صلوات الله وسلامه عليه ابو بكر وعمر وعثمان وعلي رضي الله عنهم اجمعين<br />وبذلك في اقل من 100 عام اصبحت الدولة من اسبانيا الى الهند وفي السكه هزموا الفرس والروم<br />اللهم صلي وسلم وبارك على احسن رئيس وزارة عرفته البشرية<br />ولذلك لا صلاح لنا ولا نجاح الا بعد العودة الى منهج النبي محمد صلى الله عليه وسلم"
archived = "2009-10-30"
capture_url = "https://web.archive.org/web/20091030151936/http://www.20at.com:80/masr/t7kyk/8141.html"

