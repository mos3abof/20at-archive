posted = "2009-06-18"
text = "في البداية لدي رغبة في شكر موقع عشرينات في تغطية حفل تقييم المشروعات الصحفية في الملتقى العاشر للإبداع الصحفي بكلية الإعلام<br />إلا إنه عندي من توضيح.. مجلتنا FOCUS الصادرة عن الشعبة الإنجليزية لم تدخل المسابقة على أية حال حيث كانت ضيف شرف وحصلنا على الجائزة التقديرة بجانب المسابقة وذلك يرجع إلى كوننا شعبة مختلفة وبالتالي فأي محاولة للمنافسة غير عادلة بالمرة للطرفين وهذا ما أوضحته دكتور ليلى عبد المجيد في تصريحها .. هذا بالإضافة أن يوم 25.6.2009 هو يوم عرض مشاريع التخرج الخاصة بنا - الشعبة الإنجليزية .. الدعوة عامة للجميع وخاصة لموقع عشرينات.<br />وبالأخير إحنا كشعبة إنجليزية ومجلة FOCUS تحديداً بنتمنى التوفيق للجميع<br />\"وما توفيقي إلا بالله\""
archived = "2009-06-19"
capture_url = "https://web.archive.org/web/20090619090315/http://www.20at.com:80/masr/t7kyk/12392-2009-06-17-11-39-06.html"

