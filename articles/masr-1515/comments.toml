text = "الف الف ملييييييييييون شكر لكل من ساهم بجهالة فى شهرتى تعليقاتى<br />والله يا عم دواخلي عارفين كده من الاول انك تبتغي الشهرة من وراء ذلك وقلنا كده في تعليقاتنا وكويس انك اعترفت وانا زودتها معاك وشديت في الهجوم عليك حتى انزع الاعتراف دا منه والحمد لله حصل وطبيت زي الجردل واعترفت<br />وانت صحفي كبير آه بس مش علينا"
