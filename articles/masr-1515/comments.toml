[[comments]]
order = 28
subject = "موضوع تحفة"
author = "moodysalihamidzic"
posted = "2007-02-02"
text = "-1 الموضوع والله جامد وعاجبنى جداً<br />ومبروك للعروسين وربنا يسعدهم<br />2-ابدأ ارد على كل انسان علق تعليق غير طيب<br />-الناس اللى بتقول فى حاجات اهم<br />هو لازم يكتب عن الظلم والاستبداد عشان يبقى الموضوع مهم!!!<br />-وفى ناس مغرورة كمان وحقودة ومريضة ربنا يهدينا جميعاً<br />وبعدين مفيش حاجة اسمها فلان مغرور وده حقه!!!كسر حؤه<br />الموضوع جامد وبراء صحفى زى العسل ومتميز<br />واكيد مش محتاجنى انى انا اللى اقول له الكلام ده<br />ولا محتاج اى حد ..ثقته بنفسه اكبر من اى كلام :)"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025156/http://masr.20at.com:80/article.php?sid=1515"
