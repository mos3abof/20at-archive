subject = "الموضوع رائع والتناول جيد"
author = "منير أديب"
posted = "2007-01-30"
text = "الموضوع رائع والتناول جيد ، حقيقي الفكره جديده ، وأنا رغم عملي الصحفي من سنوات طويله إلا أنني لم اقرأ موضوع بهذا الشكل من الطرافه ، أحي البراء علي التناول ، وادين له باوقات طيبه في قرأة هذا الموضع دون ما يكتب ، لأني اختلف معه كثيرا في كثير مما يكتبه ، والذي أشم فيه رائحه الخروج من ثوب جده وأبيه ، بل وعائلته والتي ينتمي كل افرادها للإخوان المسلمين ، كأنتمائه الذي دائما ما يحاول أن يخبئها وراء أفكار مواقف وكلمات ينثرهاهنا وهناك"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025156/http://masr.20at.com:80/article.php?sid=1515"

