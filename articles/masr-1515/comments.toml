[[comments]]
order = 16
subject = "موضوع حلو ووراه معاني وعبر"
author = "مصرية مفروسة"
posted = "2007-01-30"
text = "سبخان الله من الاشخاص والتعليقات الغريبة دي واحد عمال يتكلم على البراء وينتقد انه كتب عن الفرح عشان دول صحابه والرد عليه ببساطة شباب جدعان مش بتوع هتافات ومظاهرات وبس لا دول ليهم رؤية وراي فيما يحدث في مجتمعهم<br />وواحد تاني بيقول ان الموقع بيشهر براء عشان الموضوع رئيسي وان فيه موضوع تاني اهم والله ياعمنا دي مش شغلتك يعني حضرتك قاريء ومش رئيس تحرير<br />والاخ شريف الدواخلي الل يعامل فيها صلاح الدين الايوبي في القوة والشجاعة ومصطفى امين في الصحافة انت اصلا ولا بتعرف تكتب ولا تعمل بس اهو كلام واذا كنت فعلا فاهم صحافة طبق على كتاباتك الاول<br />كل الناس سابت الموضوع الاساسي والفكرة الاساسية واتكلمت على براء وشريف والاخوان يبقى مين اللي غاوي شهرة ده موضوع عن فرح اتنين مدونين مهمين قوي في مصرر والحدث كله يا جماعة بيعبر عن فئة جديدة مجموعة عارفه هي بتعمل ايه قدروا يتحرروا من المجتمع ومن الشرطة ومن كل القيود اللي احنا متكلبشين فيها من يوم ما اتولدنا<br />انا ياحييهم بصراحة على قوتهم في التدوين وقوتهم في تنفيذ فرحهم بطريقة تفرحهم هم مش كل همهم الشكل العام والفرح فين وحجز النادي والمعازيم هايقولوا ايه ومين لبس سواريه ومين اتريق عليهم ياريت كل الناس تتعمل منهم وتعمل زهم ونبطل الفشخرة اللي في دمنا دي"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025156/http://masr.20at.com:80/article.php?sid=1515"

