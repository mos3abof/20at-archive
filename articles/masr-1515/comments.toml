subject = "السادة النقاد"
author = "ahmoss"
posted = "2007-01-31"
text = "السادة النقاد الأدبيين ... كل ما حد يكتب كلمة تتباروا في النقد ولا الغقاد في زمانه و تلاقي ولا واحد منكم راح معرض الكتاب حتى علشان ياكل فشار.<br />هو إحنا كدة لما المنخب يلعب نبقى كلنا محمود الجوهري و ساعات أبو تريكة كمان.<br />مبروك يا عمرو و أنا أحييك على الإستغناء عن الفرح الفخم و التصرف بعملية تناسب العصر الذي نعيشه"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025156/http://masr.20at.com:80/article.php?sid=1515"

