[[comments]]
order = 23
subject = "دفاع عن الدواخلى"
author = "أحمد بكير"
posted = "2007-01-30"
text = "انتوا بجد هبل بشكل .. اعتراف ايه اللى نزعته من الدواخلى .. الراجل قال شكرا لكن من ساهم بجهاله فى شهره تعليقاتى \" بجهاله يعنى بالهبل \" وبعدين شهره ايه اللى هايستفدها من انه يكون اشهر معلق على موضوعات عشرينات ... انا قولت قبل كده شهرته اخدها من شغله الرائع فى الدستور .. وفى حاجة اخيرة اللى عاوز يرد على الدواخلى يرد على نقط الضعف اللى بيعلق عليها مش يفضل يهبهب وخلاص دون ان يستطيع الدفاع عن الموضوع بكلمة بل بالفاظ نابية .. والكلام ده بيحصل مع الدواخلى فى الموقع ده بس يعنى فى العربية او فى الجول او اى موقع فيه تعلبقات شريف بيحرص على تسجيل رأيه ومحدش هناك بيقوله ايه اللى كتبته ده عشان هما فعلا ناس متحضرين ومقتنعين باختلاف الاراء والحق فى التعبير عنها ..<br />وبعدين تعالوا هنا الراجل نقد فى الموضوع او شكر فيه هى هى الشتيمة ..ده مش دليل على انكوا بتتلككوا عشان تسبوه وتشتموه .. واحلى حاجة فيه انه مش بيرد على حد وانا متأكد انه هارد فعلا على كل نقد يوجه لموضوعاته لان بيعرف يدافع عن شغله كويس ومش هايستنى حد يدافعله عنه ..<br />اتقوا ربنا بقى"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025156/http://masr.20at.com:80/article.php?sid=1515"

