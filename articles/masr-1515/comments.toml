text = "في حاجات أهم من الكلام الفاضي ده...<br />يعني اتضح إن الاخوان هما ورا سفاح المعادي..مش ده موضوع كويس تقدر تخرج كل إلي جواك فيه !!<br />وخد عندك ..مصادرة اموال وممتلكات الاخوان والتحفظ عليها..أكتب وقول حوالين المصادر السرية لتمويل الاخوان...وشوف كده العالم دي جابت الملايين دي منين وميبقاش الشعب مطحون وطالع عينه والاخوان غرقانيين في النعيم !!<br />اكتب ..دي فرصة متتعوضش !!"
