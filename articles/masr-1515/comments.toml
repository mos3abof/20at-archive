[[comments]]
order = 8
subject = "احلى موضوع كتبه للبراء من وجهه نظرى فى شهر 1 كله"
author = "شريف الدواخلى"
posted = "2007-01-30"
text = "الف الف ملييييييييييون شكر لكل من ساهم بجهالة فى شهرتى تعليقاتى لدرجة ان الجمهور حاول ان يتقمص شخصية المحلل \" بسذاجة طبعا \" وكـانه انا وهو يظن ان مااكتبه كتعليقات يستطيع اى هاوى اى يكتبه ان \" الموضوع وحش او زفت وزباله وكده \" وكـأن النقد مجرد ذكر العيوب بس .. والله انا لو شفت حاجة حلوه بحللها برضه لانى بحب الصحافة جدا جدا جدا وبحب كل اللى ينزل فى الموقع لا يهبط عن مستوى معين ..ولو لاقيت حاجة حلوة بستخسر اقول انها حلوه وخلاص لكن بشوف عناصر القوة فيها وبعدين لازم نفرق بين تعليق الهواه \" او الجمهور \" وتعليق من يعملون فى الحقل الاعلامى .. فلو كان التعليق على اى موضوع انه زفت وخلاص ما كنش حد غلب<br />والاهم من كده ياجماعة اننا بنتعامل مع نقد الاخر \" وان كنت معترف بوجود بعض السخرية فيه كما نبهنى البعض \" وكأنه مقدس يبقى ازاى هانعرف اخطائنا واحنا اصلا لانطبق النقد الذاتى لموضوعاتنا ومن ثم فبديهيا الا نقبل اراء الاخرين الا لو كانت بدون نقد .. وانا أعهد امامكم انى هارحب بكل كلمة نقد موضوعية توجه لما سأكتبه \" فى الموقع \" وسأحاول الرد على كل تعليق لو كان موضوعى طبعا ً وده لانى كان فى ظروف بس منعتنى من الكتابة فى الموقع الفترة الماضية ...<br />نيجى بقى لاحلى موضوع كتبه للبراء من وجهه نظرى فى شهر 1 كله<br />وده لكذا سبب وعلى فكره ده مش دفاع عن من انتقد براء لا ده دفاع عن الموضوع لانى حينما انتقدت براء انتقدت موضوعه لانى احترم شخصيته جدا وهو زميل عزيز<br />المهم<br />1- مين اللى قال ان البراء كده واخد الموقع لحسابه هو ما كتبش عن فرح اخوه ولا اخته ومش ذنبه ان العريس والعروس اصدقائه وده لان براء اتعامل مع الشخصية النمطية للعروسان \" كام شاب و شابه فى ظروفهم<br />2- اول مرة اقرأ وصف لفرح بالشكل الجميل ده<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025156/http://masr.20at.com:80/article.php?sid=1515"

