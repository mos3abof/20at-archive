subject = "الاستاذ"
author = "ممكن نغير الاسم"
posted = "2007-01-29"
text = "ممكن نغير اسم الموقع الي موقع \"ما يكتبة البراء اشرف \" الحاجة الي تيجي علي مزاج البراء ينعم علينا ويكتبها وبالتاكيد يكون هو الموضوع المستر علي الموقع يعني موضوع وظائف مبارك موضوع لذيذ وكويس لكن اه الموضوع ده اه الي انا استفدتة من موضوع زي كده<br />انا شايف ان الموقع بيحاول يحابي للبراء مش عارف له<br />علي فكرة انا مستغرب ازي موضوع ان سفاح المعادي اخوان ازي عدي من تحت قلمك ولا محدش اتصل وقال لك تعمل الموضوع يا براء هي اه نمرة امن الدولة ولا هما الي بيتصلوا"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025156/http://masr.20at.com:80/article.php?sid=1515"

[[comments]]
order = 7
subject = "برااااء تاااااني؟"
author = "أولا مبروك للعروسين اللي معرفهمش ..ربنا يبارك لهم ..."
posted = "2007-01-30"
text = "بس هما ليه كتبوا الكتاب في مسجد الشرطة؟؟ولا هما بيستخبوا في البوكس؟؟<br />وبعدين انتو مالكو؟ براء يكتب اللي هو عايزه واحنا خدامين ابوه نقرأ و الجزم فوق رقبتنا طالما عشرينات عايزة تجامل براء حتى لو غنى ظلموه ..ولا لو كتب هرتلة زي اللي كتبها قبل كده عن الواد اللي قاعد على الكنبة ورا وبكرة يسوق العربية<br />ولا شوية لعب الاطفال اللي بيعملها مع دعاء و يركب عليها اغنية محمد منير ومجموعة من الصور المكررة ..وقال ايه اخراج ومونتاج أغنية وطنية؟!!"
archived = "2007-02-02"
