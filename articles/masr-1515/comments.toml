subject = "الموضوع قلب على شريف الدواخلى ,, والله وحققت اللى فى بالك"
author = "فارس_fr"
posted = "2007-01-30"
text = "بغض النظر عن حالة الجدل والنقار اللى شغالة بينك وبين المعلقين واللى فى راي المتواضع حققت مبتغاك فى الشهرة على حد قولك , اعتقد انى قرات ليك بعض الردود الجيدة واتمنى من الناس انها تصبر عليك ونشوف شغلك هيكون ايه !!!! مع كمية التعليقات اللى انت قطعت بيهااخوانك الصحفيين , اعتقد ان موضوعك الجاى لازم يكون TOP ,والا ابشر بكم من السخرية والتهكم من حبايبك المعلقين , اجتهد لكل مجتهد نصيب ."
