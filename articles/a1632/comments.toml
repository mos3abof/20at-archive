[[comments]]
order = 2
subject = "عاطف دغلس"
author = "صراحة رغم ادعاء القضاء الاسباني النزاهة والحيادية والموضوعية والتطور ايضا الا انه لا يمكن وصفه الا بانه قضاء متاخر وفاشل، ولا يبني احكامه على اساسيات واقعية. فهو سرب الاحكان قبل يومين من الحكم الى الاعلام وهذا بالطبع جريمة يجب ان يعاقب عليها هو نفسه."
text = "وحقيقة من كان يجب ان يقف للقضاة وللمحكمة وان يمنعهم من اصدار هذه الاحكام هو الاعلام ووزارته لانها تعرف ماذا يعني ان يقابل الصحفي ايا كان وكيف كان؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"

