[[comments]]
order = 11
subject = "حمدى"
author = "اللة كلكم ياعرب اغبياء ومتسرعين وبتحكموا هيك بالعواطف من غير ادلو وبراهين؟"
text = "لو بتعرفو شو عمل ها التيسير العلوانى ماقلتم هيك<br />انكم اصبحتم انت الحق والعدالة والنزاهة والقضاء الاسبانى بحالة رمز للغدر؟؟؟؟كيف واللة؟؟؟؟<br />انتو ما بتفهمو شى لهى تتكلمو فية هيدا ارهابى كبير ومنضم لتنظيم القاعدة<br />نعم ويساعد فى تمويل خلايا ارهابية كتير كبيرة<br />لهيك حكم القضاء بحبسة ومن امثالة عليهن بالحبس متلة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"

[[comments]]
order = 12
subject = "إلى حمدي الغ.."
author = "الله ما في أغبى منك يا حمدي"
text = "يا حضرة الغبي من أي منطلق حكمت وقررت أنه إرهابي ومن القاعدة أمن الترجمة الغبية لمكالماته الهاتفية أم للقائه الصحفي مع ابن لادن؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"

[[comments]]
order = 13
subject = "حمدى"
author = "ا يااخى الذكى وانا مابغلط فيك متلما تغلط فى"
text = "على اى حال اسبانيا ما بها الغباء اللى عم تتصورة كى تحكم علية لاجل مكالماتة او ماشابة<br />يا عزيزى ليش بتدافعو عن الارهاب ليش؟؟؟؟؟<br />ليش مابدك يتحاكمو<br />موهيك اللى فجروا اهالى مصر عندكم فى تفجيرات شرم؟<br />واللة ما بعرف شو اقول؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"

[[comments]]
order = 14
subject = "إحترم نفسك لو سمحت"
author = "لسلام عليكم"
text = "أولا يا ريت اللي إسمه حمدي دا يراعي آداب الحديث<br />ثانيا مرتديتش على الأخ اللي سئلك و قالك عرفت مينين انه إرهابي ؟؟؟؟؟؟؟؟؟؟؟<br />ثالثا عندي إحساس إنك إما يهودي او مسيحي شامي أيا كنت فأنت لا تعرف آداب الحديث تعلمها اولا و بعدين تعالى إتكلم<br />رابعا إنت معندكش إنتماء لوطنك العربي ليه كل الفخر دا بالقضاء الأسباني و كأن إحنا العدوين وهما الحبايب ؟<br />أخيرا اكرر لما تتكلم عن العرب او المسلمين تكلم بأدب عشان منزعلكش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"

