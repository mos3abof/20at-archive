[[comments]]
order = 7
subject = "لا حول ولا قوة الا بالله"
author = "الفعل حسبنا الله و نعم الوكيل"
text = "هي ضربة لكل انسان مسلم و ضربه موجعة<br />و اللي يزيد الالم و الاحساس بالمهانة انه الامريكيةىانجلاند و اللي التهمة الموجهة اليها باهانة و تعذيب العراقيين موثقة بالصور و الادلة و كان المفروض تعاقب بلا محاكمة طويلة عريضه حكم عليها بالسجن ثلاث سنين فقط<br />من وقف ليدافع عن العراقيين و ما لاقوه من عذاب ؟؟<br />من وقف ليطالب بانزال اشد العقوبات على انجلاند؟؟<br />لا احد ،، و للاسف الخوف انه ايضا لن يقف منا احد لمناصرة علوني<br />المفروض نقابات الاعلام و الصحافيين جميعا يتحركوا لنصرة قضية علوني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"

[[comments]]
order = 8
subject = "للأخ"
author = "لسلام عليكم و رحمة الله و بركاته"
text = "للأخ اللي كتب إن الدول العربية يحب ان تساند الصحفي تيسير علواني عن طريق مقاطعة الدول العربية لسبانياا ما رأيك في ان نبدأ بأنفسنا و من حولنا في تشجيعهم على مقاطعة كل المنتجات الأسبانية و الأمريكية و اليهودية و البريطانية و أنا إن شاء الله معك و سأحاول ما استطعت و احمس من حولي على المقاطعة<br />ما رأي باقي الإخوة و الأخوات؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"

[[comments]]
order = 9
subject = "سارت القافلة بالرغم من نباح الكلاب"
author = "ل دولة ولها الادلة والبراهين لتحكم علي رعاياها كما تشاء وان حاولت ان تدخل هذه الدولة عليك احترام قوانينها حتي لو تدركها او تعلمها جيدا ."
text = "فمجرد الخلافات التي نشرت وان هناك ديموقراطية فلاتوجد حرية مفتوحة لاي دولة كانت والا اصبح كل من هب ودب ينشر رايه ويتحدث باسلوب اقبح من الاخر وانتشرت الفوضي فكل فرد ان يراعي كل دولة بما فيها من قوانين .<br />وماذ بعد المقاطعات والمهاترات والاراء التي لاتشبع الذهن بعد ان اصبحت دول العلم الثالث ملفات مفتوحة امام الدول المتقدمةتتحكم فيها كيفما تشاء فسارت القافلة وظلت الكلاب تنبح فالي التركيز علي التعقل وعدم المهاترات ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"

