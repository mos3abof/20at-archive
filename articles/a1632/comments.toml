author = "جب على الدول العربية والامه الاسلامية والشرفاء في العالم مقاطعةاسبانيا والضغط على الحكومة الاسبانية"
text = "حتى الافراج عنه ولااملك الا بدعاء ان يفك اسرة انه على كل شي قدير."
