author = "كذا ظهر الغرب المتوحش علي حقيقته هذه هي ثقافة الغرب العنصري البربري أين حقوق الصحفي الهنية أين حقوق الإنسان أين حتي حرية الرأي هؤلاء هم القضاة في الغرب فما بالك بالمجمع العسكري الصناعي ؟"
text = "للمسلمين أقول ( وأعدوا )"
archived = "2006-11-02"
