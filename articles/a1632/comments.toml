author = "ن فضلك يلي اسمك حمدي احترم نفسك ومن احسن لا تتكلم حتى تعرف ما معنى ادابكما يجب عليك احترام راي اخر"
text = "وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"

[[comments]]
order = 16
subject = "حمدى"
author = "ووو يااللة ليش كل هيك"
text = "عزيزى انا ماغلط بشى<br />وانتو اللى يقول عنكم الحق يبقى غبى والا ايش؟؟<br />انا بدى تفوقوا ياعرب قبل فوات الاوان<br />كل العالم بيطلع لقدام واحنا نصير ورا<br />ليش؟؟؟؟؟<br />بسبب افكارنا ومعتقاداتنا<br />وبعد هيك انا 100% انتمى لوطنى العربى ولهيك اخاف علية<br />وسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"

[[comments]]
order = 17
subject = "ربنا فك قيد أسرانا"
author = "حية الى الأخ تيسير علوني القابع تحت سجون الظلمة القائمين على العدوان ، ربنا أعنه في محنته وانصره على الظلمة المفتريين الذين كل همهم جمع الأموال والعدوان على الاسلام والمسلمين ربنا اضرب الظالمين بالظالمين وأخرجنا من بينهم سالمين غانمين ، ربنا انصر الاسلام والمسلمين ندعوا الله العليم القدير أن يقوينا على هؤلاء الظلمة ويبعد عنا شرهم وعن كل الأمة الاسلامية ، أن الله لايحب الظالمين،\" قال تعالى\"وفأنزلنا على الذين ظلموا رجزاً من السماء بما كانوا يفسقون ، وأخيراً كل عام والامة الاسلامية بألف خير بمناسبة حلول شهر رمضان المبارك"
text = "هنو من فلسطين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"
