[[comments]]
order = 0
subject = "له الله له الله له الله"
author = "ذا الحكم يعكس مدى الضعف الذي نحن فيه فلو أن أمة واحدة ولنا خليفة واحد يحكمنا لكنا أقوياء و يجرؤ مثل هذا القضاء الفاسد الأسباني أن يصدر حطكما مثل هذا ."
text = "أقول يجب أن نقاطع المنتجات الأسبانية وأن تعلن الجزيرة عن مقاطعة هذه المنتجات من هذه الدولة فحتى ععدنا كمسلمين لم نسفد من كثرته 1200 مليون<br />وله الله وله الله له الله وصدق الله في أمثال الأستاذ تيسير قوله تعالى<br />\"أم حسبتم أن تدخلوا الجنة ولما يأتكم مثل الذين خلو من قبلكم مستهم الباساء والضراء حتى زلزلوا. . \" الله ارزقه الصبر وأهله الصبر<br />واجعله هذا في ميزان حسناته وسائر المعتقلين ظلما وعدوانا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"

