[[comments]]
order = 5
subject = "محاكم التفتيش المعاصرة"
author = "نذ عدة قرون قام الاسبان بشن حرب ابادة جماعية ضد الاسلام والمسلمين فى الاندلس التى كانت درة اوربا فى تلك العصور وقبلة الطلاب والمتعلمين وفى حين كانت مدن لندن وباريس وغيرها تغرق فى ظلام الجهل والتخلف كانت شوارع غرناطة وقرطبة تتلالا بالانوار ليلا وبالعلم والججامعات نهارا الا ان فرديناند وزوجته قاموا بابشع حرب ابادة دينية ضد كل ما يشير الى الاسلام والمسلمين من فكر وثقافة ومكتبات واناس حتى خرج ما يزيد على مليون من المسلمين مكدسين فى سفن متهالكة اما من عجز عن الفرار فكان امامه اما التنصير او الموت وظلت محاكم التفتيش عارا يلاحق الاسبان الا ان ما حدث للصحفى المسلم تيسير علونى يوضح ان احفاد الطغاة الاسبان الذين ابادوا المسلمين ما زالوا يتمسكون بتراث اجدادهم ويحنون اليها ."
text = "ان ما حدث لتيسير ليس غريبا ولا مستهجنا فى بلد قام بازالة كل اثر للاسلام فى نفوس الاسبان الا انه لا يخجل من ان يفخر بالاثار التى قام بابادة من ابدعوها .<br />ان الاسبان اثبتوا انهم مخلصون لتراث محاكم التفتيش فى حكمهم الذى صدر بحق الصحفى المسلم تيسير علونى."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142055/http://www.20at.com/article.php?sid=1632"

