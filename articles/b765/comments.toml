text = "كان بامكان صدام ان يكون عميلا فيجلس مرتاح البال على كرسي الحكم حتى يموت<br />كان بامكانه ان يضع راسه في الرمال<br />كان بامكانه ان يحتفظ بامواله ويورث الحكم لابنه مقابل الولاء للشيطان الاكبر وللقوى المتربصه<br />قد نعترف ان صدام اخطا في غزوه للكويت<br />ولكننا يجب ان نعترف انه يمتلك من القوميه العربيه الكثير<br />كان راغبا في الوحده العربيه ولكنه اساء التصرف في محاولته للتوصل اليها<br />لا اقول ان صدام ملاكا ولكنه ليس بشيطان"
