text = "سادتي الأكارم/<br />لنترفع رجاءا عن الردح والسباب ولنتعلم أن نقرأ الأحداث قراءة موضوعية، قبل أن نمدح أونقدح. أتريدونها وصلة ردح سادتية أم عبدلاوية قذافية؟ لم هذا، الرجل مكذوب عليه مزورة ومدلسة عليه خطاياه وجرائمه. وما علمت بتاريخنا المعاصر سوى ثلاثة رجال أرادوا بناء أمة عربية قوية، أحدهما ألباني لم يك يعرف العربية وهو محمد علي، والآخران عربيان، ليفتنانت كونيل ناصر بمصر وصدام حسين بالعراق. كلهم سعى لاستجلاب أسباب النهضة وأدخل أوليات التصنيع ببلاده وأوفد البعثات العلمية شرقا وغربا لتوفير الكادر التعليمي اللازم لإستمرارية خطى النهضة.<br />لكنهم جميعا للأسف أهملوا أهم جانب وأخطره ألا وهو بناء الإنسان بالمعنى الحقيقي. ليس بالشحن المعنوي وحده تدار المصانع والمعاهد والمؤسسات والجيوش، لابد من تمحيص خطط التعليم عندنا أولا، ووضع أصحاب الكفاءة لا الولاء المطلق بمفاصل الدولة، وقبل ذلك إشعار المواطن بآدميته وبأن فعلا شريك بوطن يحثه الدين والضمير وأحيانا الحاكم على حبه وفدائه بكل غال ورخيص.<br />بجيش من المطحونين تحت وطئة من يحكمهم ويفترض أنه يقودهم للعزة لا تكسب إلا أشنع الهزائم.<br />كل الأمم التي أعرفها اليوم متحضرة تجمعها خصلة هامة، ألا وهي الإستمرارية في البناء، بغض النظر عمن يحكمها. أما نحن ففكرة النهضة والبناء عندنا تموت وتدفن مع صاحبها لدن وفاته أو خلعه او الإنقلاب عليه، فكيف يصلح لنا حال؟<br />حدث الأمر كذا بعد محاصرة محمد علي بعد هزيمة وتحطيم الإسطول المصري بنفارين، وبعدها تلاشت فكرة الصناعة والبناء وظلت هكذا حتى بزغ الكولونيل ناصر، وحاول الشئ عينه، وبدأت بمصر محاولات خجولة لصناعات يمكن أن نسميها تجاوزا بالثقيلة.<br />بمجئ السادات وأدت الفكرة كلها، وبات أقصى همنا إستيراد الكماليات والتوطين لحيتان الإنفتاح ولصوصه وأكثرهم من عائلة المقبور وأصهاره ومن دار بفلكه ممن لاضمير له ولا دين. بعهد السادات بدأ بيع القطاع العام ومؤسسات الدولة وإستكملت اليوم بولي عهده فخر البقر الضاحك طرا وأطول جاثم على حكم مصر العزيزة عمرا وأشدهم خيانة وجبنا وعمالة، خبيث الدين والمعتقد والعقيدة حسني أفندي المنوفي.<br />لصدام هذا أياد بيضاء على المصريين بوجه خاص وعلى العرب بوجه عام، وما إزاحته عن الطريق إلا لأنه كان كمثل سابقيه علي وناصر فعله وقوله سيان، وهذا ذنب لايغفره الغرب لنا.<br />العجيب حقا أن بلاد الجزيرة العربية لعبت دورها المناوئ لكل من الرجال الثلاثة، ووقفت ضدهم مع من حاربهم، وإن إختلفت الدوافع والتحالفات بكل حالة. الوهابيون ضد محمد علي وكبدوه خسارات عظيمة، وبنو قرود السعادين يدا بيد مع الإنجليز والأميركان ضد ناصر ببلاد اليمن السعيد. وإن إلتمسنا لهم شيئا من العذر أنهم غزوا أو جيرانهم من اليمنيين من المصريين بكلتا الحالتين، فما عذر بني اللكيعة بتدمير العراق؟<br />أقولها لكم علنا العرب لايتحدون طاوعية، مافعلوا ذلك سابقا ولن يفعلوه لاحقا، واقرءوا التاريخ منذ خلق العرب، وليستدرك علي منكم مستدرك إن إستطاع.<br />آل سعود وقرود أسسوا مملكتهم بصك بيع فلسطين بين جدهم عبد العزيز وروزفلت، تولى التسليم وكيلهم المتعمد على إمارة شرق الأردن عبدالله حيث سلم النصف، وتولى حسين حفيده تسليم النصف الثاني بحرب سبعة وستين. للإنصاف الوحيد الذي إنضم للحرب وهو غير شريك بالخيانة ولا يعلم عن الأمر شيئا كان الملك فاروق.<br />وأيضا أتعلمون سادتي بأن كل المساعدات والهبات العربية لتحرير فلسطين منذ عهد النكبة وحتى خروج المقاتلين الفلسطنيين من لبنان جميعا عينية وشيئية وهبات لم تتجاوز البليون دولار أعني مليارا. هذا على أكثر من ثلاثين عاما من الصراع، وإسرائيل ياسادة تحصل على تبرعات من يهود العالم فقط تتجاوز التيرليون دولار سنويا، ودع عنكم ما نتندر به من بخلهم وحبهم للمال، ما البخلاء إلا من ملكوا خزائن المال منا.<br />الكويت جادت للزهار بسبعة ملايين دولار نقدا وعدا، ياللجود والكرم، شوماخر الألماني تبرع لضحايا تسونامي بعشرة ملايين، وبيل جيت لمرضى الإيدز بنصف مليار، هل تفهمون عني؟<br />نجم الدين"
