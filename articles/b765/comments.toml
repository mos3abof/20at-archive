subject = "لو أدركك الأعشى أبا عدي، لقال فيك هذا أبيت اللعن!"
author = "نجم الدين!"
posted = "2006-05-20"
text = "ما تعيفُ اليومَ في الطّيرِ الرَّوحْ *** مِنْ غرابِ البينِ أوْ تَيْسٍ بَرَحْ<br />جالسًا في نَفَرٍ قدْ يَئِسُوا *** مِنْ مُحيلِ القِدِّ مِن صَحبِ قُزَحْ<br />عندَ ذي مُلْكٍ إذا قيلَ لهُ: *** فَادِ بالمَالِ تَرَاخَى وَمَزَحْ<br />فَلئِنْ رَبُّكَ مِنْ رَحْمَتِهِ *** كَشَفَ الضِّيقَةَ عَنَّا وَفَسَحْ<br />أو لئنْ كنَّا كقومٍ هَلَكُوا *** مَا لِحَّيٍّ يا لَقَوْمي مِنْ فَلَحْ<br />لَيَعُودَنْ لِمَعَدٍِّ عَكْرُها *** دَلَجُ اللّيلِ وتَأْخَاذُ المِنَحْ<br />إنَّمَا نَحْنُ كَشَيْءٍ فَاسِدٍ *** فَإذا أصْلَحَهُ الله صَلَحْ<br />كَمْ رَأيْنَا مِنْ أُنَاسٍ هَلَكُوا *** وَرَأيْنَا المَرْءَ عَمْرًا بِطَلَحْ<br />آفِقًا يُجْبَى إليهِ خَرْجُهُ *** كلَّ ما بينَ عُمَانٍ فَمَلَحْ<br />وَهِرَقْلاً يَوْمَ سَاآتِيدَمَى *** مِن بني بُرْجانَ في البأسِ رَجَحْ<br />وَرِثَ السُّؤْدَدَ عَنْ آبَائِهِ *** وغزا فيهمْ غلامًا ما نَكَحْ<br />صَبَّحُوا فارِسَ في رَأدِ الضُّحَى *** بِطَحُونٍ فَخْمَةٍ ذاتِ صَبَحْ<br />ثمّ ما كَاؤُوا ولكنْ قَدَّمُوا *** كَبْشَ غارَاتٍ إذا لاقَى نَطَحْ<br />فَتَفَانَوْا بِضِرَابٍ صَائِبٍ *** مَلأَ الأرْضَ نَجِيعًا فَسَفَحْ<br />مِثلَ ما لاقَوا مِنَ الموتِ ضُحًى *** هَرَبَ الهَارِبُ مِنهُمْ وَامْتَضَحْ<br />ليتَ شِعْرِي عن خَليلٍ مَالَهُ *** إذ أَكَبَّ الدَّهرَ يومًا وَأَلَحّْ<br />هل يَقُولَنَّ إذا كنتُ صَدًى *** صَدَّ عَنِّي وتَناسَى وَاطَّرَحْ<br />أمْ عَلى العِهْدِ فَعِلْمي أَنَّهُ *** خَيرُ مَنْ رَوَّحَ مالاً وَسَرَحْ<br />وإذا حُمِّلَ عِبْئًا بعضُهمْ *** فاشتكى الأوصالَ منهُ وَأَنَحّْ<br />كانَ ذا الطَّاقةِ بالثِّقْلِ إذا *** ضَنَّ مَوْلى المرءِ عنهُ وَصَفَحْ<br />وَهُوَ الدَّافِعُ عَنْ ذِي كُرْبَةٍ *** أيْدِيَ القَوْمِ إذا الجَاني اجْتَرَحْ<br />تَشْتَرِي الحَمْدَ بِأغْلَى بَيْعِهِ *** واشْتِرَاءُ الحَمْدِ أَدْنَى لِلرَّبَحْ<br />تَبْتَنِي المَجْدَ وتَجْتَازُ النُّهى *** وَتُرَى نَارُكَ مِنْ نَاءٍ طَرَحْ<br />أوْ كما قالوا سَقِيمٌ فَلِئنْ *** نَفَضَ الأسْقَامَ عَنهُ وَاستَصَحّْ<br />لَيُعِيدَنْ لِمَعَدٍّ عِكْرَها *** دَلَجَ اللّيل وَإِكْفَاءَ الِمَنحْ<br />مِثْلَ أَيَّامٍ لَهُ نَعْرِفُها *** هرَّ كلبُ النّاسِ فيها وَنَبَحْ<br />ولهُ المُقْدَمُ في الحَرْبِ إذا *** سَاعَةَ الشِّدْقُ عنِ النَّابِ كَلَحْ<br />أيُّ نارِ الحربِ لا أَوْقَدَها *** حَطَبًا جَزْلاً فَأوْرَى وَقَدَحْ<br />ولقدْ أَجْذِمُ حَبْلي عَامِدًا *** بِعَفَرْنَاةٍ إذا الآلُ مَصَحْ<br />تَقْطَعُ الخَرْقَ إذا ما هَجَّرَتْ *** بِهِبَابٍ وَإرَانٍ وَمَرَحْ<br />وتُوَلِّي الأرضَ خُفًّا مُجْمَرًا *** فإذا ما صَادَفَ المَرْوَ رَضَحْ<br />فَتَرَاهُ فَلِقًا فَرَاسِنًا *** ذا رَنِينٍ صَحِلَ الصَّوتِ أَبَحّْ<br />وَشَمُولٍ تَحْسِبُ العينُ إذا *** صُفِّقَتْ وَرْدَتُها نورَ الذُّبَحْ<br />مِثْلُ ذَكْيِ المِسْكِ ذاكٍ رِيْحُها *** صبَّها السَّاقِي إذا قيلَ تَوَحّْ<br />مِثلُ زِقَاقِ التَّجْرِ في بَاطِيةٍ *** جَوْنَةٍ حَارِيَّةٍ ذاتِ رَوَحْ<br />ذاتِ غَوْرٍ مَا تُبَالي يَوْمَهَا *** غَرَفَ الإبْرِيقِ مِنْهَا وَالقَدَحْ<br />وَإذا مَا الرّاحُ فِيهاَ أزْبَدَتْ *** أَفَلَ الإِزْبَادُ فيها وَامْتَصَحْ<br />وَإذا مَكُّوكُهَا صَادَمَهُ *** جَانِبَاها كَرَّ فِيهَا فَسَبَحْ<br />فَتَرَامَتْ بِزُجَاجٍ مُعْمَلٍ *** يُخْلِفُ النّاَزِحُ منها ما نَزَحْ<br />وِإذا غَاضَتْ رَفَعْنَا زِقَّنَا *** طُلُقَ الأوْداجِ فيها فَانْسَفَحْ<br />ونُسِيحُ سَيَلانَ صَوْبِهِ *** وَهْوَ تَسْيَاحٌ مِنَ الرَّاحِ مِسَحْ<br />تَحْسِبُ الزِّقَّ لديها مُسْنَدًا *** حَبَشِيًّا نامَ عَمْدًا فانْبَطَحْ<br />وَلَقَدْ أغْدُو عَلى نَدْمَانِهَا *** وَغَدَا عِنْدِي عَلَيْهَا وَاصْطَبَحْ<br />ومُغَنٍّ كلَّما قيلَ لهُ: *** أَسْمِعِ الشَّرْبَ فَغنَّى فصَدَحْ<br />وَثَنى الكَفَّ عَلى ذِي عَتَبٍ *** يَصِلُ الصَّوتَ بذي زِيرٍ أَبَحّْ<br />في شَبَابٍ كمَصَابِيحِ الدُّجَى *** ظاهرُ النِّعمَة ِ فِيهِمْ وَالَفَرَحْ<br />رُجُحُ الأحلامِ في مَجْلِسِهِمْ *** كُلَّمَا كَلْبٌ مِنَ النّاسِ نَبَحْ<br />لا يَشِحُّونَ عَلى المَال وَمَا *** عُوِّدُوا في الحَيِّ تَصْرَارَ اللِّقَحْ<br />فَتَرَى الشَّرْبَ نَشَاوَى كُلَّهُمْ *** مثلَ ما مُدَّتْ نُصَاحَاتُ الرُّبَحْ<br />بَينَ مَغْلُوبٍ تَلِيلٍ خَدُّهُ *** وَخَذولِ الرِّجْلِ مِن غَيرِ كَسَحْ<br />وَشَغَامِيمَ جِسَامٍ بُدَّنٍ *** نَاعِمَاتٍ مِنْ هَوَانٍ لمْ تُلَحْ<br />كالتَّماثيلِ عليها حُلَلٌ *** ما يُوَارِينَ بُطونَ المُكتَشَحْ<br />قَدْ تَفَتَّقْنَ مِنَ الغُسْنِ إذا *** قَامَ ذُو الضُّرِّ هُزَالاً وَرَزَحْ<br />ذاكَ دَهْرٌ لأناسٍ قدْ مَضَوا *** وَلهذا النَّاسِ دَهْرٌ قد سَنَحْ<br />ولقدْ أمنحُ مَنْ عَادَيْتُهُ *** كُلَّ ما يَحسِمُ مِنْ داءِ الكَشَحْ<br />وَقَطَعتُ نَاظِرَيْهِ ظَاهِرًا *** لا يكونُ مثلَ لَطْمٍ وكَمَحْ<br />ذا جُبَارٍ مُنْضِجًا مِيسَمُهُ *** يُذْكِرُ الجارِمَ ما كانِ اجْتَرَحْ<br />وتَرَى الأعداءَ حولي شُزَّرًا *** خَاضِعي الأعناقِ أمثالَ الوَذَحْ<br />قدْ بنى اللُّؤمُ عليهمْ بَيْتَهُ *** وَفَشَا فِيهِمْ مَعَ اللّؤمِ القَلَحْ<br />فَهُمُ سُودٌ قِصَارٌ سَعْيُهُمْ *** كالخُصَى أشْعَلَ فِيهِنَّ المَذَحْ<br />يَضرِبُ الأدْنَى إلَيهِمْ وَجْهَهُ *** لا يبالي أيَّ عَيْنَيهِ كَفَحْ"
