posted = "2006-05-03"
text = "بسم الله أمل المستضعفين<br />حياكم الباري وأحياكم<br />متى وكيف نحكم على أي حاكم وكل من جلس على الكرسي وتحكم في رقاب الناس<br />ربما سيأتي أناس ويقولن أن الفراعنه<br />وأخص فرعون موسى عليه السلام بأنه كان حاكم عادل وأنه كان يحمي المصريين من بني أسرائيل وأنه عمر وبناء وأنه عمل وفعل و في عهده أزدهرت وتوسعت الخيرات ووو<br />من سسن الله في العباد أن أعوان الظالم لا ينالون جزائهم الا بيد الظالم نفسه<br />وستجدون ممن أعدم صدام من أعوانه وما حسين كامل ببعيد<br />وما صدام ألا من أعوان أمريكا وما يحصل له ألا سنه الله في أعوان الظلمة<br />أختم<br />بحديث بما معناه<br />أن الحاكم الكافر العادل أحب الى الله<br />من الحاكم المسلم الظالم<br />لم يأترى ...<br />في أمان الباري"
