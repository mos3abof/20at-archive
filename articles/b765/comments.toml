text = "اه يا عرب بتشتمو مصر ...يا احط الشعوب يا بقر با غنم يا اهبل خلق الله ده من خيببتنا ان احنا وانتو عرب زى بعض شميتو نفسكو يا كلاب يا عقالات ... العقالات شمت نفسها .. ده انتو احط من الخنازير .مصر دى هيه اللى حامياكم هيه اللى مخلياكم تشمو نفسكم ..وبعدين اللى بيتكلمو علخيانه يروحو يشوفو نفسهم الخليج بكمله اصبح ولايه امريكيه جديده ..قواعد فى كل قريه .....جنود حمر الوجوه فى كل شبر..ده كفايه عشان نقول ان انتو خونه ولاد كلب ولا لا...الجماعه اللى بيدافعو على صدام صدام مين المعفن اللى رمز للعرب ..ده احااااا....صدام الحيوان اللى سلم بلده للامريكان بغباوته المتناهيه.صدام اللى مسكوه مستخبى زىالفار فى جحر..صدام اللى بحموريته قتل اكتر من ملوين عراقى فى حروب خاسره وغبيه ...صدام الذى يحاكمه عملاء هو المفروض رئيسهم المنتخب ............اتفوووووووعلى العرب وعلىاللى خلفهم..فعلا كلاب لا تاكل الا العضم..."
