[[comments]]
order = 13
subject = "العدل اساس الملك"
author = "اللهو الخفي"
posted = "2006-05-04"
text = "العدل أساس الملك مااجملها من مقوله وما أجمل الحياة عندما يكون الحاكم عادلا<br />وما أقساها عندما يكون الحاكم طاغيا مستكبرا<br />وفي ثقافتنا الإسلامية قال ابن القيم رحمه الله ان الله ليقيم الدولة العادلة ولو كانت كافرة ويبطل الدولة الظالمة ولو كانت مؤمنة<br />العدل.. يااخوتي الكرام اصل كل خير في الحياة<br />والظلم ... هو اصل كل شر في الحياة والظلم ظلمات يوم القيامة<br />هل تعرفون جنكيز خان زعيم المغول وموحدهم وواحد من( أعظم) القادة العسكريين في التاريخ الإنساني ---لمن لا يعرف قصته هذا الرجل با ختصار جعل من شعبه المتفرق المتنازع إلي تطحنه الخلافات والنزاعات جعل منهم شعبا واحدا وأمة قويه تعمل الأمم لها ألف حساب ويرتعد الملوك والقادة في كل أنحاء الأرض عندما يسمعون اسمه أو يسمعون عن التتار<br />** كان شخصا قاسيا متحجر القلب لا يشعر بالنشوة الا بعد أن يحقق انتصاراته ويسفك دماء أهل المدن التي استولي عليها رغم إن غالبية المدن كانت تسلم دون قتال<br />هل تعرفون كم ذبح هذا الرجل من البشر ؟ وهل تعرف كم ذبح خليفته هولاكو من المسلمين ؟؟ يكفي أن تعرف أن انهار بغداد كلها تلونت باللون الأحمر عندما دخل المغول بغداد<br />هل لا زلتم تعتقدون انه من أعظم القادة العسكريين في التاريخ كما يصنفه المؤرخون<br />وأين دولة اللتار الآن وأين كل تلك الحضارات الظالمة التي بنت مجدها علي دماء الناس وعلي قهرهم وظلمهم<br />وما علاقة ذ لك بـ صدام حسين ؟؟ طبعا هذا السؤال الذي يدور في أذهانكم<br />العلاقة هي في كيفية حكمنا علي حاكم أو قائد أو زعيم ما بأنه قائد عظيم أو مغوار<br />هل أصبح كل من يقتل ويكثر في القتل والحروب وفي سفك الدماء قائدا عظيما وبطلا نتغنى ببطولاته دون أن نسال أنفسنا من قتل ولماذا قتل؟<br />لنتكلم بالوقائع بعيدا عن العاطفة صدام قتل ابناء شعبه من المسلمين بآلاف وأرجوكم لا تقولوا أنها أكاذيب فالعراقيين اليوم هم اكبر شاهد علي جرائم صدام<br />وادخل بلده في حربين متتاليين مع دولتين مسلمتين قتل فيها الآلاف من المسلمين<br />فعن أي بطولات تتحدثون وعن أي قائد عظيم تتحدثون ؟؟؟<br />صدام كان العميل رقم واحد في المنطقة عندما كانت مصالحه تتوافق مع أمريكا أثناء وقبل فترة الحرب الايرانيه العراقية<br />ولكن عندما تضاربت المصالح أصبح صدام حسين كارتا خاسرا كان لابد من التخلص منه<br />إمبراطورية صدام حسين التي كان يحلم بيها وحلم معه بها بعض العرب الحالمون المغيبون انهارت سريعا لأنها بنيت علي الظلم والقهر وبنيت علي جماجم الآلاف من المسلمين<br />اللي بيخالفني الرأي ده حقه لكن ياريت يكون بأدب وبعيد عن التجريح<br />وسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125754/http://www.20at.com/article2.php?sid=765"

[[comments]]
order = 14
subject = "المصرى ابن العروبة"
author = "احة للركب"
posted = "2006-05-06"
text = "المصرى ياولاد الكلب هو اللى حما ضهركم سنين طويلة ولما بقيتوا بنى ادمين شديتوا حيلكم على المصرى<br />تعالوا نتحاسب<br />1- دافع عن عاركم فى فلسطين من 48 وخسر كتير فى الوقت اللى كلكم كنتوا هتيفة بس<br />2-وقف جنب كام دولة فيكم علشان تتحرر وولادكم دخلوا مدارس مصر واتاعملوا زى المصرى من غير فلوس<br />3- دخل حرب اليمن وابويا بيحلفلى ان اليمنيين كانوا بيضربوهم بالنار وهوا داخل يهدى<br />4- التكية المصرية اللى كانت مفتوحة فى مكة وانقفلت من فترة قريبة وكسوة الكعبة اللى كانت بتيجى من مصر بالرغم ان مصر عمرها ماتحكمت مين يروح الحج ومين ميروحش<br />5- حرب 67 النكسةوخسرنا ارض كبيرة وراح من الجنود اللى راح فى قضية تخص العرب كلهم لكن الجدع فى العرب هوا واحد بس مصرى<br />6- حرب 73 وفرحتنا اللى بتحاولوا تقتلوها كل يوم بكلامكم القذر على انة ماكنش انتصار لا انتصار غصب عنكم<br />7- كام عامل ومدرس ودكتور وخلافة دخل الخليج يمعر وينور وبنضف ناس متبصوش على العمار دلوقتى المصرى دخل الخليج وقت التخلف مكانش فية مكيف كان المصرى يدخل يعلم وقت اللبنانى مكان فى اوروبا بيتعلم دلوقت شعار الخليج المصرى والهندى واة يازمن على العزيز لما الايام تحوجة للكلاب<br />8- كام مستثمر عربى فى مصر مش محبة فيها لا دول سمعوا عن النهب قالوا ناخد جانب زى شركة الاسماك الكويتية اللى جت تاخد رزق الصيادين الغلابة فى اسوان وقت الكلي يوسف والى والحمد للة ان القرار وقف فى عهد احمد الليثى<br />فين العرب فى النخوة العربية فلسطين قدامكم مبترحوش بجيوشكم لية ياعالم ياهو احنا المصريين خونة واتفقنا من العدو روحوا نتوا حرروا انتم فين ياعرب بتوع الخليج بتوع العملة الموحدة فينمايحركوا جيوشهم يورونا الرجولة والعروبة بلاش العروبة يورونا الاسلام راح فين الاسلام من السلفيين بتوع السعودية<br />مافيش مجيب عارفين لية لان المصرى فى رقبتة دين من رب العالمين فى الاخر هوا اللى حيخلصها<br />وطز فى العرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125754/http://www.20at.com/article2.php?sid=765"

[[comments]]
order = 15
subject = "يااااااااااه على الظلم يا مصر"
author = "نيفين"
posted = "2006-05-06"
text = "اولا بقول لمنى سليم الموضوع قديم صحيح بس الاسلوب اكثر من رائع بجدبرافو عليكى<br />ثانيا بالنسبه لعبد الله انت واخد الصوره من ناحيه ورديه اوى لان الراجل دا عليه اكتر من ليه<br />و ثالثا انا بضم صوتى للمصرى ابن العروبه(رغم تحفظى على الشتايم)عنده حق<br />بيتكلمو عن مصر وهما عارفين و متاكدين ان مصر هى اللى ف العرب و بيتفقو معانا على كده بينهم و بين نفسهم<br />الغلط مش على العرب الكلاب الغلط على حكامنا اللى خلوهم يقولو علينا كده دلوقتى و زمان و التاريخ مبينساش<br />رجل ف الذاكره<br />اللى ف الذاكره يا منى منظر زعيم عربى منكوش السعر و بيفكرنا باهل الكهف و بيوصمنا بالعار<br />اه ممكن نقول عزيز قوم ذل<br />و مش هقول اللى قلته قبل كدا ان يا ريت كان شعبه خده و قطعه مليون حته اكرم ليهو لنا من المهازل اللى بتتعرض على الشاشات ف محاكمته<br />و الصوره اللى مش بتضيع من بالى هى صورتهخ يوم القبض عليه<br />وكل عربى (حر)يتفق معايا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125754/http://www.20at.com/article2.php?sid=765"

[[comments]]
order = 16
subject = "مصري للابد"
author = "ahmed zayed"
posted = "2006-05-15"
text = "للاخوة العرب الذين يشتمون مصر ، بكل هدوء رد اخوتي المصريين علي الشتيمه ، وارجو ان اذكر الجميع بما جاء في الوثائق العراقيه السريه بأنهم أستعانوا بوحدات كوماندوز مصريه عام 1988 للتدخل لصالح القوات العراقيه بعد ان توقف الهجوم علي الفاو ، ونجحت الصاعقه المصريه في تحرير شبه الجزيرة وعادت لمصر سرا لان الجيش العراقي ماكنش ناقص فضايح ، كفايه ان المشير الجمسي هوا اللي خطط لاخر سنتين في الحرب علي ايران وبعد كده جايين تشتموا مصر وجيش مصر المذكور في القران ، طب ده كلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125754/http://www.20at.com/article2.php?sid=765"

[[comments]]
order = 17
subject = "صدام ابن العراق"
author = "ابو علاوي"
posted = "2006-05-16"
text = "كل انسان ولهو هدف في الحيات وصدام كان يريد ان يكون رئيسا وحاكم للعراق وهو كان في صفوف الشعب وهو انسان عادي جدا وفكر وجاهد وحارب ووصل الى ماكان يريده فهو رجل وفي ناس يريدون كل شئ بدون تعب ولا مثابره وهذا هو تفكير الاغبياء \\ وفي ناس تقول ان صدام كلب انا اقله انو الكلب الذي تعرفه افضل من الكلب الذي لاتعرفه واذا كان صدام كلب وكان يقتل ويذبح وغيره \\ فالان الذبح والقتل اكثر بكثير والان الجه غير معروفه \\ في زمن صدام كنا نعرف جهت الخطر اما الان لا نعرف جهت الخطر واين سوف نقتل وكيف سوف نقتل \\ انا اكره صدام بس والله لايوجد رجل غيره في هذه الدنيا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125754/http://www.20at.com/article2.php?sid=765"

