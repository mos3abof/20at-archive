text = "بسم الله الرحمن الرحيم<br />لن يتعين على احد سب احد<br />ولكن دعونا نعترف ان صدام حسين ضحى بكل ما لديه ليقف موقفا يشرفه امام التايخ هو لا يطمح اطلاقا التشريف منا فقد غسل يديه منا منذ زمن بعيد ولا ينتظر الفرج ليعود رئيسا للعراق الذي خذله البعض فيه ولا رئيسا للعرب الذين خذلوه جميعا ولكن لو اعدنا التفكير للحظة ونسينا كل ما نحن عليه الآن من استعمار العراق ومحاكمة صدام وقلنا اننا لا سمح الله شددنا علي يد صدام وايداناه وما سمحنا لأجنبي بالدخول الى ارض العراق وفي الوطن العربي عرق ينبض ستجدون ان صدام على حق وانه قد خلق لنا وضع في هذا العالم لم نحلم به ووجدنا اننا اصبح لنا كيان وسلطه في هذا العالم المتعجرف الذي لا يتواني للحظة على تسميتنا بأبشع الاسماء<br />اخوتي<br />عندما قام رسول الله عليه السلام بطرح قضية رسالته امام الفرس والروم ( وهم في معايير القوة ) اقوى من كل الدول التي تتكالب علينا كان الاستهزاء التمرد والعزة بالكفر هما السمات الاساسية في ردودهم البشعة<br />نفس الشئ اليوم يتكرر وصدام كان يريد لي ولك للمغربي والمصري والليبي والكويتي ايضا ان يكون انسان يحكم ثروته ويتحكم بمصيره وأراد ان يخلق منا رجالا لهم شأن في التاريخ فليرى كل من ساهم في هذا المنتدى ما هو الشأن الذي حصله من سقوط صدام وما هو موقعه في التاريخ الحالي والمستقبلي ولكن تبقى كلمة اخيرة<br />صدام من نال كل الشرف الذي اراد اشراكنا فيه فكان فارسامغوارا لا يهاب الردى وعندما ترجل هذا الفارس ترجل كأي فارس بشموخه وعزة نفسه غير مستسلما لقدره وانما رمحافي صدري وصدرك وصدر كل عربي كان يوما بإمكانه ان يناصر صدام ولم يفعل<br />اخوتي لاتسبوا بعضكم في الحقيقة المصري والليبي والمغربي والسوري والسعودي الكويتي كلنا كعرب نستحق السب فإن اردتم ان تنعتوا احدا بالحثالة فكلنا حثاله ليس لها قيمة بعد صدام ولتصدأ عقولنا كي لا نتحمل مسؤولياتنا وآخر دعوانا ان الحمد لله رب العالمين"
