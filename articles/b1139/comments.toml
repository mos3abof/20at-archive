[[comments]]
order = 0
subject = "استفسار"
author = "بلقاسم"
posted = "2006-08-19"
text = "ادا كانت هده الحفلات فيها الات موسيفية ورقص فانها لا تختلف عن الموسيقي الهابطة او التجارية..في غرب الجزائر تقام الاعراس عند العائلات الملتزمة بدون دف ولا موسيقى..انا اعتقد انها بدعة.لان هده الفرق قامت على اساس تجاري--ربح الاموال--متل الاغاني التى تعرض في روتانا-لها هدف واحد وهو المال--ويبقى راي العلماء الحقيقيين الدين يخافون الله وليس النظام هو الاصح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124138/http://www.20at.com/article2.php?sid=1139"

