[[comments]]
order = 10
subject = "إن كان جاهلا .. فهل كان أعمى؟!"
author = "حسين عبد الظاهر"
posted = "2006-05-11"
text = "والله لا أدرى كيف واتت هذا الضابط الجرأة أن يضرب وجها بسماحة وجه عمناالأستاذ محمد عبد القدوس ؟!<br />حتى وإن كان هذا الضابط جاهلا به وبمكانته وبكتاباته و بعائلته ..ألم ينظر إلى ذلك الوجه الوضاء؟!<br />إن كان جاهلا .. فهل كان أعمى البصر والبصيرة أيضا؟!<br />شلت تلك اليد التى تمتد لرجل كان وما زال بذله وعطاؤه لوطنه بلا حدود<br />فضل أن يشارك المقهورين والمستضعفين ما يعانون ، وتحمل معهم الظلم ، وهو الذى كان باستطاعته أن يبيع كما باع الآخرون ويتقرب من مراكز صنع القرار ولديه المؤهلات لذلك.. إلا أنه أبى إلا أن ينحاز للشعب ضد السلطان الجائر<br />كان باستطاعته على الأقل العيش فى بيئته الاستقراطية بعيدا عن المظاهرات والاعتصامات ووجع القلب ، إلا أنه فضل درجات سلم النقابة على شاليهات مارينا والساحل الشمالى !!<br />عموما هذا هو دأب أصحاب المبادئ والرسالات .. بارك الله فى جهادك يا أستاذنا<br />على فكرة يا زين الصندوق الأسود بتاع الطيارة وجدوه، و وجدوا بداخله مفاجأة<br />لقيوا كل الصندوق \"نعم لمبارك\""
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

