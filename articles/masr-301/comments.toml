[[comments]]
order = 2
subject = "ومين زي محمد عبد القدوس بس؟؟ ليه بتزعلنا علي نفسنا وعلي رجالتنا بس"
author = "محمد السيد"
posted = "2006-05-10"
text = "ياااااااااااااه<br />يا عمنا .... محمد عبد القدوس ...<br />أنا في حياتي مشفتش راجل زي الراجل ده ..<br />والله كلمة راجل شوية عليه ...<br />تعرفوا ؟؟ لو تشوفوه وهو ماسك الميكرفون وعمال يهتف وينادي بحماس ... والله تتكسفوا من نفسكم ...<br />في يوم كان في مظاهرة و قبل بدايتها لقيته مسك الميكريوفن لوحده و وقف علي سلم نقابة الصحفيين وعمال يهتف وينادي علي الناس تشارك معاه ...<br />تخيلوا ؟؟ لا حد واقف جنبه ولا معاه .. لا حد يشجعه او يرد عليه ... لا حد أصغر منه يسنده أو يمسك ويهتف بداله وهو الكبير ...<br />والله حاجة تكسف بجد ..<br />ساعات كنت بأسأل نفسي ..هو الراجل ده مبيتعبش أو مبيزهقش ...بلاش ... هو الراجل ده مفيش وراه بيت وعيال وحاجات من دي ؟؟؟<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "دي حكايته متتحكيش...اسمعوا تاني عنه"
author = "محمد السيد"
posted = "2006-05-10"
text = "لكن الحقيقة .... لو عندنا من الراجل ده كتير كان حالنا اتغير من زمان ...<br />أقول إيه تاني ؟؟؟<br />يبهرك بأخلاقه ... كتير كنت بأستغرب في مظاهرات كفايه وغيرها .إن ساعات لسانهم بيفلت وتلاقي ألفاظ متصحش . أو حتي ساعات بيتخانقوا مع بعض وإحنا ماشيين في المظاهرة ....<br />لكن عمنا ...؟؟ والله العظيم يخليك واقف دايب في نفسك من أدبه وأخلاقه وحلاوة لسانه ... نفس اللسان اللي بيقف يهتف علي السلم يسفط حسني مبارك ولا للديكتاتورية .... هو هو . اللي تلاقيه واقف بيكلمك بمنتهي الذوق والأخلاق والصوت الهادي الوقور ...<br />والله إنت خسارة فينا . خسارة في شباب كتير نايم كسلان . أو حتي لما بيقوم بيقوم وهو مكسوف يعلي صوته أو يهتف لوحده أو حتي يمسك في إيده علم البلد دي ...<br />ربنا يخليك ليا يا عمنا ويجمعني بيك في مصر وهي حرة ويجمعني بيك في الجنة<br />امين<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

