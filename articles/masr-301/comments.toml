text = "في كل مرة بيرد عليا بيعتبرني واحدة صاحبة مشكلة و بيعرض عليا انو يساعدني في حلها بمنتهى الادب و الودو الاحترام<br />ولما بعرفه اني صحفية بيساعدني اكتر ..ومرة سألته عن حال الشباب و سلبيتنا و و جهلنا السياسي ..قاللي لا شبابنا فيهم الخير ..متبصوش للقلة الضعيفة احنا عندنا شباب زي الورد ..بساحنا نتخلص من سلطة الفساد ومن الديكتاتور..واحنا نبقى زي الفل<br />الله يبارك لك يا عمنا"
