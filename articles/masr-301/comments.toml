order = 0
subject = "وهي الاستيكه بايظه ولاه ايه ؟؟؟"
author = "مش شغلك ..."
posted = "2006-05-10"
text = "والله عندك حقك يا كابتن زين ...<br />فكرتني بحته كتبها عمنا مصطفي محمود بتقول في روايه اكل عيش نقلا عن واحد قبطي \" ولكني الان وانا اتدكر حياتي وحياة الناس واضع الحقائق الي جوار بعضها البعض .. اجد ان الام المسيح كانت شيئا هينا فلم يكن للمسيح ابناء وكان يموت من اجل هدف نبيل تهون من اجله الام اربعه وعشرين ساعه علي الصليب اما امي فقد عاشت علي الصليب ستون عاما وماتت بدون هدف يبرر عدبها\" .... \"شقاوه استيكه يا ريس \"..."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

