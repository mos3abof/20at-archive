[[comments]]
order = 20
subject = "ولا يهمك يا عمنا"
author = "توتى"
posted = "2006-05-15"
text = "ولا يهمك يا أستاذ .. و على رأى المثل إن طلع العيب من أهل العيب مايبقاش عيب ..<br />و عمار يا مصر مادام فيها رجال أمثالك يا عمنا ..<br />اللهم أنشر رحمتك على العباد و عجل بالفرج يا أرحم الراحمين"
archived = "2006-09-03"
