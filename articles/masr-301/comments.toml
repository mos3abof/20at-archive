[[comments]]
order = 19
subject = "امسحها فينا يا عمنا"
author = "نيفين"
posted = "2006-05-15"
text = "امسحها فيى مصر<br />امسحها ف عشرينات امسحها ف 70 مليون<br />امسحها فيا<br />هقول ايه<br />لا عزاء للشرفاء<br />و على رايك يا زين يا رايح كتر م الفضايح"
archived = "2006-09-03"
