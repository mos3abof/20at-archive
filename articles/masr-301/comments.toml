posted = "2006-05-15"
text = "يا عم إنتا إيه ....إنتا جبت أسلوب كتابتك دا منين؟؟ أنا مقدرتش أنط كلمة واحدة...<br />و الله إن الكتابه ليها ناسها ..الله يفتح عليك و يزيد من أمثالك و على فكرة عمنا أكبر من كدا و على رأي إخوانا الخليجيين يا جبل ما يهزك ريح ...ووالله عمنا دا جبل و رمز لينا"
