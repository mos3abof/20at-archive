[[comments]]
order = 17
subject = "بكائيات"
author = "باكي"
posted = "2006-05-15"
text = "أبكي ياعين لعلك تغسلي العار أبكي لعل دمعك يكون دافع لأن نستيقذ و نفيق من هذا الكابوس .<br />ياعمنا و عم أهلنا لا تغضب من هذا الصعلوك فهو تربية الجلاد الأعظم.<br />و لأحبائك و لنفسي أقول أعلموا أن الديكتاتور قد ربى أتباعة ليتبعو مثل هذا الصعلوك ربما طال حكمة .<br />ولذلك فهم لن يستسلمو ولن يغيرو سلوكهم فهم تربو على ذلك وهم يعلمو ان لو تغير الحال فسيكون مكانهم اسفل السافلين.<br />محتلينا أستمرئو الفساد<br />وعلينا أن نكون أقوياء و لاتحزنو ولاتهنو و أنتم الأعلون<br />أنتم مولاكم الله و هم لا مولى لهم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
