[[comments]]
order = 5
subject = "صديق لسجين !!!!!!"
author = "مصطفى"
posted = "2006-05-10"
text = "يا هل ترى ماذا لو !!!!!!؟<br />يا هل ترى ماذا لو شباب الإخوان اقتدوا بالأستاذ محمد عبد القدوس ؟ هذا الرجل يعرف أصل المشكلة لذا تراه يهتف يسقط ,,, يسقط ... حسنى مبارك ، يا أستاذ محمد ما تعمل فينا جميل وتطلب من المرشد أن يفرج عن شباب الإخوان فقط لمدة 24 ساعة وتاخدنا جميعا نحو قصر مبارك .. ايه الى هيحصل يعنى !!!؟ هيموت مننا 20000 !!!! وإيه يعنى يموتوا شهداء أحسن ما يموتوا فى العبارات !!! ، عارف يا أستاذ محمد ماذا قال لى صديقى السجين !!!؟ قال هو نفسه يشوف مظاهرة كبيرة يكون هدفها فعلا اسقاط مبارك ، ولو شاف المظاهرة دى هيسيب السجن فورا وهيكون فى الصف الأول !!! يا أستاذ محمد ما تستغربش من الكلام !!! فصديقى ليس سجين فى طرة أو فى أبو زعبل !!! بل هو واحد من سجناء البيوت !!! إنت عارف مين سجناء البيوت !!!! دول شباب زى الورد بعد ما خلصوا الجامعة وخلصوا الجيش راحوا يدوروا على شغل !!! بسى انت عارف !!!! شغل ايه الى انت جى تقول عليه !!!! بعد الياس والإحباط استقر بهم الحال فى البيت !!!! هؤلاء هم سجناء البيوت !!!!! ما تعمل فينا وفيهم معروف وتقودنا على قصر مبارك !!!! بسى انت زى منت عارف احنا جُبَنَا !!! منه لله الى كان السبب !!! المهم بقى عشان احنا جبنا احنا عاوزين ناس جامدة عشان يشجعونا عشان الجبن معشش فى قلوبنا !!! اوعى تقولى كفاية !!!! لأ يا عم دول 50 واحد خدوا حبوب الشجاعة واحنا الحبوب دى متأسرش معانا أصلى الجبن إلى عندنا من أيام ذكى بدر يعنى مى الآخر جبن مستوطن ، احنا عاوزين شباب الإخوان . هم دولا فعلا إلى هيشجعونا ، احنا سألنا واطقسنا وعرفنا انى المرشد خايف عليهم من العين عشان كده حابسهم ، لو خايفين من الموت قولهم هم بس ييجوا يشجعونا وبعد كده يسيبونا احنا هنكمل الباقى ، وصدقنى هنديعلك وهند<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

