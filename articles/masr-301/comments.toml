[[comments]]
order = 15
subject = "احنا ولاد مصر مش هما"
author = "سنووايت"
posted = "2006-05-13"
text = "يا وطنـي ..كــل العصافيـر لها منـازل<br />إلا العصافيـر التي تحتـرف الحريّـة<br />فهي تمــوت خـارج الأوطــان<br />دي بلدنا احنا هما ميعرفهواش ولا يعرفوا تاريخها ولا ناسها انت معجون بنبض البشر بهمومهم - بتعرف تلمهم انا مش عايزه ابان كما لو كنت بحكي عن بطل شعبي بس عبد القدوس فعلا كده انسان شديد الحرص على العلاقات الانسانية بينه وبين الصحفيين مع كل مناسبة في كروت بتتبعت منه على الجرايد باسم الصحفي الصغير قبل الكبير بيعرف يلم الناس وده شئ صعب في زمن انتشر فيه التوحد والانانية والافاقين معلش لازم كل ده يستفزهم قلوبنا كلنا معاك يا استاذ"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

