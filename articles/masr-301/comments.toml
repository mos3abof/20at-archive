[[comments]]
order = 22
subject = "نو كو منت"
author = "مخنوق من ازهي عصور الحريه قصدي الحراميه"
posted = "2006-05-16"
text = "انا هاحكي عن تجربه الراجل ده انا حضرته مظاهره لكفايه في عابدين وكان بيهتف ويقاوم الامن المركزي ولاشاب في العشرين اللي حصل مش غريب ع الامن المصري وياما شفنا ناس محترمه بتتهان من جمال بدوي لعبدالحليم قنديل ياقلبي لا تحزن بس هي ي ضريبه الناس المحترمه ودفاعهم عن المباديء وقيم الحق والعدل"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 23
subject = "بطل الميكروفون والشارع"
author = "محمد رضا"
posted = "2006-05-16"
text = "عمنا محمد عبد القدوس لمن لا يغلم سقفه هو الخروج للشارع وإزالة هذا الركام الأمنى من أمام سلم النقابة وتشعر وهو يقود حشود المتظاهرين فى أى مكان وكأنه يريد إزاحتهم من كل مكان غير مفرق بين إسلامى أو يسارى أو ناصرى او حتى وطنى الكل سواء أمام عمنا , يقول البعض إن آخره الميكروفون والشارع ولكنى أعتقد أن الميكروفون والشارع وبخاصة فى شارع عبد الخالق ثروت او شارع ثروت كما هو الدارج عند سائقى التاكسى له أثره الكبير وأنا كمثال أتت وقفات الشارع التى كان يقودها عمنا ومن على دربه فى الأفراج عنى وعن آخرين من زملاء كل ما وزروه هو حب الوطن والسعى إلى حرية ورثناها من أمهاتنا اللواتى ولدتنا أحرارا, وعاش عمنا بطل الميكروفون والشارع."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 24
subject = "اه يا استاذى اه من النظام وافعاله"
author = "سمير المصرى"
posted = "2006-05-16"
text = "معلش يا استاذى الغالى محمد عبد القدوس ...سبحان الله فى هذا النظام الذى يرفع قوم ويخفض اخرون..عنده مزاج فى ازلاال اولاد الناس وتكعهم ولكن مزاجه الاخر هو رفع شئن اولاد الكلاب اتباعه وكمان بيحميهم ..كل من يدافع عن هذا الشعب يضرب بلجذمه..وكل من ينكل ويزل الناس يرفع من شئنه ..غريبه الدنيا ..صحبنا بلله اللى قتل الزعيم السادات..ولم يصب وهو قاعد بجوارة ..تزوج من امرة يهوديه طبعا كلن عرفنها سوزىىىى ام اويءبرطانيه الاصل ويهوديه العقيده ...اصل حسونه باع البلد من زمان وباع نسها ...استاذى لايوجد عندى الا ان اقول لك صبرا جميلا فقد حان وقط الوداع فهو الان ام يورثها لجمى ام يبعها لليهود وفى كلتا الحالتين نحن ضحايا الجهل ...واحد زى اللى قلك الكلام ده طبعا ابوه مربهوش رباه حسنى باشا وطبعا تربيه وسخه زيه تمام...الى كل الشرفاء فيكى يا مصر تجمعو واتحدو يوم الخميس القادم امام القضاء العالى ولا تخفو منهم انهم قله امامنا لو تجمعنا كلن فى شعب واحد امه واحده تدافع عن حقها اما الظلم والفساد..اما بيع مصر امام اعيناواخيرا..بيت شعر ..الضرب فينا مقوله واسجن بقى لينا طوله ..دى عصابه واسمها دوله"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 25
subject = "الله اكبر والعزه لله"
author = "محمد ج."
posted = "2006-05-31"
text = "سوف يذكرك التاريخ بفخر انك احببت مصر وتدفع لها مهرها فوالله مصر تستحق وتستحق<br />ان يدفع لها الشرفاء من امثالك ياعمنا مهرهافهي تاج علي مفرق الشرق برغم كل سرقات اللصوص وتجار المغشوش وماجورين الوحوش قابله للنهوض اذا استلم قيادها المخلصون والعالمون باصول النماء."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 26
subject = "دقت الساعه"
author = "علي خليل"
posted = "2006-05-31"
text = "لا محاله سوف تطير رؤس الحاكم الظالم وبطانة السوء قريبا واسرع مما تتوقع وساعتها لكل حادث حديث ومصر تستاهل الكل يتعب علشائها."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 27
subject = "لست من عشاق محمد عبد القدوس"
author = "باختلف كتير مع الأستاذ محمد عبد القدوس خصوصا لما يفتي في الدين ... بيقع خصوصا في القضايا التاريخية في نقطة تافهة قوي ."
posted = "2006-06-22"
text = "طيب الموضوع على المستوى الإنساني و السياسي أكتر ... و ده شيء جديد و جميل<br />لكن لي تعليق على المقال نفسه إن الجزئية بتاعت \" انت زعلان يا عمنا؟ \" مباشرة قوي ، و كإنها مفتعلة و داخلة في الموضوع بالعافية ... مع إن كان ممكن الاكتفاء بـ \" إمسحها في مصر \""
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023134/http://masr.20at.com:80/article.php?sid=301&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
