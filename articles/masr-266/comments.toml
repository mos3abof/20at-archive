[[comments]]
order = 2
subject = "انا زباااااااااااااااااااااال"
author = "مجدى اليمانى"
posted = "2006-05-04"
text = "مكن اعرف قراء ولاد البلد زعلانين ليه من عمو اسامه سرايا احنا اتفقنا ان فى مصران مش مصر واحده والراجل بيبعت تحيات مصر بتاعته هو وامثاله مش مصر بتاعتنا احنا يبقى الموضوع ما يخصناش وهو ليه حريه الرائ والتعبير لكن احنا هنا مصر بتاعتنا من مصر المحروسه الى مصر المخروسه من مصر زكريا عبد العزيز والبسطويسى ومكى الى مصر احمد عز وسمير رجب والشاذلى ونافع نقول لهم استعدو فالطوفان ات لامحاله وزى ما قال على الحجار فى ذئاب الجبل 0ولابد من يوم معلوم تترد فيه المظالم ابيض على كل مظلوم اسود على كل ظالم 00فالى ذلك اليوم واعتقد انه قرب قوى 0حد يقولى هى مزبله التاريخ هتشيل ايه ولا ايه يا مبارك انت ورجالك لقد اسئتم الى الزباله"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614122947/http://masr.20at.com:80/article.php?sid=266"

