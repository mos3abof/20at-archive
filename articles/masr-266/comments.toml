text = "يا نهار إسوح !! سرايا باشا ده فعلا مصدق الكلام ده!! و يا نهارين إسوح تفتكر فعلا إن سرايا باشا ممكن يصدق إن الشعب ممكن يصدق اللى مكتوب ده!!! يا عدد 3 نهار إسوح و فوقهم مصيبة سوحه ممكن إذا كان الريس فعلا مصدق الكلام ده!!!"
