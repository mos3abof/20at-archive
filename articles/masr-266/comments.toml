[[comments]]
order = 4
subject = "أى كلام"
author = "أنا طبعا !!"
posted = "2006-05-04"
text = "وقد يسأل سائل‏:‏ لماذا كل هذا الحب والثقة التي تجمعنا معا قائدا وشعبا‏,‏ أو قل أبا كريما لأسرة كبيرة عظيمة قوامها‏72‏ مليون إنسان هم كل الناس في مصر‏..‏ أو أخا أكبر لكل مواطن‏,‏ كما يحب الرئيس أن يصف نفسه؟<br />مش ناقص غير يقول لأنه بيسمحلنا نتنفس وناكل ونشرب ونحمد ربنا إنه ما عملش زي الزعما الوحشين وقال أليس لي ملك مصر وهذه الأنهار تجري من تحتي ، يعني هو برضه يهمه إننا مندخلش النار<br />وهكذا تحولت الأهرام إلى مبولة عامة بعد أن كانت مبغى برئ وكل الشكل لفصيل القوادين"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614122947/http://masr.20at.com:80/article.php?sid=266"

[[comments]]
order = 5
subject = "سرايا المجانين"
author = "مصرية"
posted = "2006-05-05"
text = "اعذروا الأخ سرايا فيما قاله فمن لا يفقد عقله فى العيشه الهباب اللى احنا عايشنها ويبدأ يعيش احلام يقظه انا متأكده لو فاق من الغيبوبة اللى كتب فيها هذا الكلام ويقراه حيزعل من نفسه جدا الا اذا اصبح عضوا فى شلة المنافقين والعياذ بالله اللهم احفظ شرفاء مصر من الضعف والأستسلام اللم اجعلها آخر الأحزان"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614122947/http://masr.20at.com:80/article.php?sid=266"

[[comments]]
order = 6
subject = "مصر اولى"
author = "مصرى"
posted = "2006-05-05"
text = "يا حاكم بلا إنتخاب ويا محتل للسلطة ويا من لا تمتلك الشرعية لوجودك أقول لك لقد تيقنا جميعاً أنك وصلت على أبواب الثمانين ولازلت عندك المقدرة للتحرك بدون كرسى كهربائى أو عصا كما يتحرك من فى سنك وأنك لا زلت تعرف أسمك كما لا يعرف كثير ممن فى سنك أسمائهم ولكنك للأسف الشديد لا تعرف أنك تحكم مصريين أحرار لن يرضوا بالذل والطغيان ويقولون لك أقرأ الدستور لتعرف كيف يجيء الحاكم للحكم برضا الشعب والإنتخاب وأنت لم تنتخب من قبل الشعب فى يوم ما إذا أنت غير شرعى للحكم فى مصر وأنصحك أن توفر المبالغ الطائلة التى تدفعها على مكياجك وصباغتك لشعرك وشد وجهك الكرية بالنسبة للمصريين كلهم وأقول لك عيش باقى عمرك بما نهبت من مال ولكن بعيداً عن مصر التى حتى ترابها سيلفظ جثمانك بعد مماتك ولن نسمح لك بتوريث الحكم لإبنك المفقد للشرعية فى وجوده بسبب إفتقادك أنت أصلاً للشرعية ونقول لك كما قال الزعيم أحمد عرابى لقد خلقنا الله أحراراً ولن نورث بعد اليوم"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614122947/http://masr.20at.com:80/article.php?sid=266"

