subject = "بلد تانية"
author = "بن الكفر"
posted = "2006-05-03"
text = "من الواضح ان اتلكابتن اسامة سرايا عايش في دولة غي بتاعتنا وبيهني رايس ير بن الناس الكويسشين بتاعنا مش عارف هو كان بيحلم ببلد وهي نظيفة ولا كان بيكتب المقال في امن الدولة ولا عاوز 40 جنية علاوة على المرتب من اول الشهر اللي حي وبعدين مين اللي قالة يتكلم باسم مصر ده كلب من الكلاب الي بتخلص للسلطة علشان العضمة بتاعت اخر كل شهر وربنة يوعدة بنصيبة تخدة زي اللي قابلة ولو بدوم كانت دامت لغيرك ياعم سرايا"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614122947/http://masr.20at.com:80/article.php?sid=266"

