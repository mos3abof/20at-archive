[[comments]]
order = 4
subject = ""
author = "اية اللى وداهم"
posted = "2009-11-19"
text = "اية اللى وداهم هناك - كتر فلوس - والا طيارات احمد عز ام بلاش بتاع الوطنى<br />لو اللى اتصرف على المباراة دى كانوا اشتروا بة دواء لمستشفيات الحكومة المزرية والحقيرة او صرفوا الفلوس دى فى رفع الزبالة من الشوارع كنا استفدنا منها<br />انما قيادة تتميز بالسفاهة<br />شوية عيال بتتصدر الحزب الوطنى وعايزين يسيطروا على الكرة<br />طيارات مخصوصة بتطير وشايلة الانجال والفنانات والراقصات والمطربين والمطبلاتية وكانها زفة سيدى المتطاهر ننوس عين امة وكلة من الضرايب اللى بتلمها الحكومة من الغلابة والبياعين الجوالين فى الشوارع وبياعة الفجل"
archived = "2009-11-20"
capture_url = "https://web.archive.org/web/20091120045938/http://www.20at.com:80/masr/news/14099-2009-11-19-00-04-35.html"

