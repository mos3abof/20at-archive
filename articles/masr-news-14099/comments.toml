[[comments]]
order = 1
subject = ""
author = "التحريض"
posted = "2009-11-19"
text = "عمرو اديب<br />والكابتن شوبير<br />والكابتن زعبور<br />وقناة الرياضة للمكسحين<br />وقناة الرياضة للهتيفة<br />قنوات شغالة 24 ساعة واتصالات وتليفونات ومقابلات وتحليلات وكاننا بنحصد الكؤوس فى كل الدورات وكسبانين كل المونديالات<br />اية الغم دة<br />كفاية قوى برنامج عن الرياضة فى كل قناة<br />انما شوبير فاتح قناة وقاعد فيها 24 ساعة وبيقبض ملايين ويبنى عمارات وشغال فى الفساد والصحفيات والتهديدات وقضايا وامور مسخرة"
archived = "2009-11-20"
capture_url = "https://web.archive.org/web/20091120045938/http://www.20at.com:80/masr/news/14099-2009-11-19-00-04-35.html"

[[comments]]
order = 2
subject = ""
author = "بلاغ للنائب العام"
posted = "2009-11-19"
text = "كمواطن مصرى عادى مغمور اطلب من سيادتكم اغلاق قنوات الكباتن الرياضية المتخصصة فى تهييج واثارة الشباب وشحنة بمفاهيم خاطئة وكاذبة واصبحت دعائية غوغائية تهدم الرياضة ولا تشجع عليها<br />ان القنوات الرياضية التى تجند الكباتن العجائز امام الشاشات ليشحنوا فى الشباب اوهام وخبل انهم الاعلى والافضل وانهم لا بد ولا بد ان يفوزوا يجب وضع روابط لتلك القنوات فهى اخطر الف مرة من قناة للمتطرفين<br />ان امثال تلك القنوات يجب اغلاقها وطرد الكباتن العواجيز منها الذين يرتزقون الملايين وبنوا عمارات وفيلل وملايين فى البنوك يجب وضع حد لها"
archived = "2009-11-20"
capture_url = "https://web.archive.org/web/20091120045938/http://www.20at.com:80/masr/news/14099-2009-11-19-00-04-35.html"

