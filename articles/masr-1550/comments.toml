[[comments]]
order = 0
subject = "ومالة يا اخويا"
author = "كلة يدلع نفسة شوية"
posted = "2007-02-06"
text = "والناس لما تفرح لها شوية يجرى اية ولما يعملوا وزارة اعلام قطاع خاص يجرى اية هو سياسة الدولة مش الخصخصة والبصبصة اى ان الناس تبص على اللى هى عايزاة<br />والا لازم يتفرجوا على قنوات الاكتئاب زى قناة الاسرة والقناة العقارية وقناة القرف الاخرى<br />والا لازم يشوفوا الخطابات السامية التى تفكرهم بحصص القراءة المقررة<br />كلة يدلع نفسة زى ماهو عايز"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208164538/http://masr.20at.com:80/article.php?sid=1550"

[[comments]]
order = 1
subject = "مزايا و عيوب"
author = "الدش و الموبايل و الكمبيوتر فتحوا باب رزق كبير اوى لناس كتير و دى حاجه حلوه مش وحشه ... بس تبقى بحدود .. يعنى عيب اوى لما تخصص كبير ودقيق زى الكمبيوتر يبقى مهنه من لا مهنه له وده عن تجربه"
posted = "2007-02-06"
text = "يعنى تلاقى واحد خيبان و تعبان و يادوب من كام شهر كان بيقرا كلمتين انجليزى على بعض يتحول بقدره قادر الى مهندس كمبيوتر ( يقفل لك اى جهاز انت عاوزه ) وطبعا تبقى انت بتشترى و عينيك فى وسط راسك من اساليب الغش و الاستهبال اللى بتحصل."
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208164538/http://masr.20at.com:80/article.php?sid=1550"

[[comments]]
order = 2
subject = "هات نفس.."
author = "ياسيدي..هي دي الديموقراطية اللى بجد.."
posted = "2007-02-07"
text = "و سلملى على برامج القناه الأولى channel 2..<br />ما هى الناس معذوره برضه..يعنى مش برامج عمك حسنى أحسن 100 مره من برامج الغم والتخلف و قلة القيمة اللى في القنوات المحلية والفضائية المتخصصة؟؟<br />فليحيا عم حسنى الحلاق أحسن ما يحيا عم حسنى الدهل..اللى قرف الناس في عيشتها بدساتيره و ريادته الإعلامية..<br />أخوكم قاطن بالدولة المجاورة لسمنود \"منية سمنود\" و أحد رواد مقاهى عم حسنى.."
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208164538/http://masr.20at.com:80/article.php?sid=1550"

