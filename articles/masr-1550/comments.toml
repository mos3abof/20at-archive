subject = "فكرة جنان"
author = "إبراهيم"
posted = "2007-02-07"
text = "فعلا فكرة جنان -------- ممكن بعد كده يكون في محطة الدقي الفضائية - وكل محافظة ومركز وقرية يكون لها قناة خاصة بيها عبارة عن جهاز كمبيوتر ووصلة وكل واحد يقدم الفنون اللى يحبها"
