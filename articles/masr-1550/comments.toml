[[comments]]
order = 5
subject = "حبيبى كل دة فى قرى وجة بحرى"
author = "حبيبى النت ابو كيبل او ابو وصلة والوصلة الخاصة بتلع القنوات اياها منتشرة فى كل قرى وجة بحرى لان اللى عندة لا يبخل على اللى معندوش فية تكافل اجتماعى"
posted = "2007-02-07"
text = "اما قنوات الغم الحكومية بتاع وزير الطعمية والافلام ابيض واسود بتاع الاجداد لا يتفرج عليها الا المتخلفين عقليا وبتوع الحزب الوطنى الديمقراطى سليل الاتحاد الاشتراكى سابقا"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208164538/http://masr.20at.com:80/article.php?sid=1550"

[[comments]]
order = 6
subject = "كاتب الموضوع ..كداب"
author = "سمنودى"
posted = "2007-02-08"
text = "انا من سمنود محافظه الغربيه ولا يوجد بالوصلات كلام مما يدعيه صاحب الموضوغ واعتقد انه يكتب لكى يستقوى الشرطه على اصحاب الوصلات حتى يصادروا الاجهزه واعتقد انه من بتوع ال اه ار تى..ومكشوفه يا خليل !بالمناسبه انت منين من سمنود من العزبه ولا سماحه ولا ايه ؟ وحسنى مين ده وفين ؟"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215075232/http://masr.20at.com:80/article.php?sid=1550"
