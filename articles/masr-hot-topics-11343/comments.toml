posted = "2009-12-13"
text = "السلام عليكم و رحمه الله<br />علي فكره كل ماسبق صحيح ملابس التصدير فيها بواقي اوردرات درجه اولي و بواقي اوردرات فرز تاني و تالت كمان و اصحاب المحلات المتخصصه لبواقي التصدير كتير جدا و المعيار انك تشتري من محل محترم بيوضح الدرجه للقطعه و هناك الكثير منها مثل محلات شعبان بالهرم و الدقي و روز بوسط البلد و ديسكونت بالزتون و اوت ليت و لو عايز نصيحه لله و في الله خليك مع محلات شعبان و روز و ديسكاونت ناس عارفه شغلها و فاهمه في الموضوع و بتخاف علي اسمها و عميلها و الاخ اللي ما شافش حاجه لينا بتتصدر ما شفهاش عشان عايز يشوفها"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205154207/http://www.20at.com:80/masr/hot-topics/11343.html"

