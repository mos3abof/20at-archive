subject = ""
author = "اكتب اسمك هنا"
posted = "2009-02-18"
text = "احنا بنصدر لمين ؟<br />على فكرة انا كنت با اتفرج على المعارض فى دول الخليج ومعظم الاقبال كان على الملابس التركية الجاهزة وكذلك الملابس القطنية السورية وانتاج جبل على فى دبى عشر اضعاف الانتاج المصرى<br />المنتج الوحيد الذى تجدة فى السوبر ماركت فى دول الخليج من انتاج مصر هو المعسل بتاع الشيشة بريحة التفاح ولة شهرة تغمر الافاق<br />ثم ان معظم الملابس الجاهزة داخل مصر نفسها من انتاج الصين والمصريين فى القرى والمدن بيلبسوا انتاج الصين"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205154207/http://www.20at.com:80/masr/hot-topics/11343.html"

