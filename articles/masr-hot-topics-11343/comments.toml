author = "مها"
posted = "2009-06-18"
text = "ملابس التصدير رحمة الناس من حرقة نار الأسعار فى محلات الملابس الجاهزه وخصوصاً الأطفال وال أققل بلوزه بناتى متتلبسش فى المحلات تبدأ من 70ج مصرى للأسفولا لون ولا زوق ولا خامه وطبعا ولا سعر وإنتشار ملابس التصدير فى الفتره الأخيره اصبح منفس لكل الناس ولجميع الفئات ولجميع الأعمار وحجات جميله تعتمد على الزوء والجوده والخامه والألوان الرائعه أى إن كان ولو كان فى بعض الحجات فيها عيوب مش لازم نخدها بتبقى صناديق كله على بعضه تبدأ القطعه من 3.5 ج مصرى فقط لا غير ولو قرنتوها بالملابس الجاهزه فى المحلات اياها اتحدى ان البواقى ال 3.5 بتشرب العرق ومفهاش الياف ومبتعملش حساسيه ولا بتحرر ولالونها بيتغير ولا بتوسع وطبعا ال قطعه ال 70ج من الملابس الجاهزه مواصفتها عكس ال قولته والله أنا ولا صحبة محل بواقى تصدير ولا ليا عداوات مع اصحاب محلات الجاهز والله على ما أقول شهيد"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205154207/http://www.20at.com:80/masr/hot-topics/11343.html"

