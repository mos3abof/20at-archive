subject = "لا تغيير حقيقي بدون المادة 77"
author = "المواطن المطحون"
posted = "2006-12-28"
text = "ايظن .. حسني مبارك انه بتعديل 34 من الدستور ان الشعب يصدق ديموقراطيته التعبانه , اعتقد ان لا ديموقراطية ولا نماء ولا ازدهار بدون تعديل المادة 77 من الدستور , دستور الشعب المصري ومصر , وليس دستور مبارك وجمال (رضي بوش عنهما)"
archived = "2007-01-08"
