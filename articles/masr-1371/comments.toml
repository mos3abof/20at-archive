[[comments]]
order = 0
subject = "تيجو نقصى نفسنا بنفسنا"
author = "سحس"
posted = "2006-12-28"
text = "\"إقصاء الشعب المصري\" .. احدث عبارة سمعتها تعبر عن ديكتاتورية النظام .. لكنى أختلف معها .<br />هو فين إقصاء الشعب ده .. طيب يا ريت إلهى وانت جاهى نصبح الصبح نلاقى النظام أقصانا كلنا.. أو تعالوا نطلع كلنا بره البلد ونسيبها لهم لوحدهم ، ونحرمهم من ممارسة الاستبداد<br />بس نروح فين ؟ أه سمعت أن ليبيا واحة خضراء فيها كل مظاهر الحرية والديمقراطية ، والناس هناك فى منتهى السعادة .. مفيش مرة الزعيم عندهم يطل على الشعب إلا والناس بتموت على نفسها من الضحك"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010142/http://masr.20at.com:80/article.php?sid=1371"

[[comments]]
order = 1
subject = "تعديل وليس تبديل"
author = "احمد"
posted = "2006-12-28"
text = "انا كنت مستني الرئيس يعدل المادة 77 وليس غيرها \"كده هو زي اللي رقص علي السلم \"وياريت تتعدل علشان تداول السلطة حتي لو تبقي كل 25 سنة رئيس انما الي ماشاء الله ؛يبقي كلام فاضي طبعا وموضوع اقصاء الشعب عن العمل السياسي اصلا الشعب مش بيقرب من السياسة علشان نقصيه دول كلهم كام الف واحد في الجامعات وده داخل الجامعة فقط وكام وعشرين واحد في ميدان التحرير ودول معروفين بالاسم ياريت يحصل تعديل وليس تبديل."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010142/http://masr.20at.com:80/article.php?sid=1371"

