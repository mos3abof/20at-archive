[[comments]]
order = 7
subject = "والله فكرة"
author = "مهتمه"
posted = "2006-12-28"
text = "عاجبني اوي تعليق سحس اللي فوق ده<br />والله فكرة نسيبهالهم ونمشي ويبقوا يدوروا على شعب يقهروا فيه<br />والله دول يعيطوا ويعرفوا قيمتنا ويتحايلوا علينا عشان نرجع<br />امال يسرقوا مين؟ ويستعبدوا مين؟ ويستهبلوا مين؟ دول حتى يعانوا من الفراغ<br />بس حكاية اننا نروح ليبيا دي مش احسن فكرة<br />انا بقول نبني مستوطنات في الصحراء الغربية عشان نبقى على ارضنا برضة -<br />ما هو محدش حيرضى يخلينا نعتب ارضه بامراضنا النفسية والكبدية والكلوية والعقلية احيانا!!-<br />وبعدين نحط سور بيننا وبين القوات الوطنية (الوطنية اوي) ونبدأ نبني بلدنا الجديدة من تاني من الصفر - يعني على مية بيضا-<br />بس اللي حيبنوا دول لازم يكونوا احنا احنا بقى مييييييين؟<br />اللي يعرف يقولي"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010142/http://masr.20at.com:80/article.php?sid=1371"

[[comments]]
order = 8
subject = "العملية مش محتاجة ترقيع"
author = "ترقعوا اية دا الدستور عامل زى الجلابية الدايبة ومهرية كمان هترقعوا اية"
posted = "2006-12-28"
text = "عندكم ترزية القوانين يفصلوا اجدع من دستور فرنسا امنا فى التشريع<br />بس الكلام على الورق حاجة والتنفيذ حاجة تانية<br />اى حتة ملازم شرطة يقبض على اى واحد بدون سبب ويعذبة ويطلع عنين امة وهذا كلة غير مكتوب لا فى الدستور ولا فى القانون<br />احسن حاجة ما يبقاش عندنا دستور تمشى كدة الاوى<br />لماذا نشغل انفسنا بحاجة مش نافعة ولا شافعة"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010142/http://masr.20at.com:80/article.php?sid=1371"

[[comments]]
order = 9
subject = "هو فين الدستور!!!"
author = "خالد"
posted = "2006-12-30"
text = "انا شايف دخان بس مش شايف نار!! يعنى ببساطة الجنازة حارة والميت كلب!! يعنى احنا زعلانين عشان هيعدلوا الدستور طيب ممكن واحد بس يقولى فين الدستور ومين اللى بيطبق الدستور فى مصر... انا مش شايف ان مصر فيها أى دستور عشان نزعل لما حد يغيروه ولا يعدله ولا حتى يشيلوا خالص ........ ضربوا الأعور على عينه قال خسرانة ..خصرانة"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010142/http://masr.20at.com:80/article.php?sid=1371"

