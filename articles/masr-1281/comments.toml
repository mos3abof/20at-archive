[[comments]]
order = 1
subject = "كل ما أروح صفحه تهب في وشي ؟؟؟"
author = "إبن بهيه"
posted = "2006-12-11"
text = "أنا بصراحه مش لاقي تفسير لرصة المواضيع المكلبنه دي .. ولو إنها لذيذه برضه ؟؟؟ كل ما أروح صفحه تهب في وشي ؟؟؟ فيه إيه بس يا جدعان ؟؟؟ عاملين حملة تشويقيه لرجوعه بالسلامه والشفا من الجوله الأوروبيه ولا إيه بالضبط ؟؟؟ عموماً كلام حيلو خالص .. بس على فكره يا أحمد ندا .. المتوكل أمر لعلي بن الجهم بضيعة أو عزبه بها بحيره وجوار حسان يمرحون بين الزهور واللون الأخض الجميل .. عشان كده اتعدل حاله وقال فيهن (واصفاً الجواري) عيون المها .. شفت بقى أثر البيئة على البيني آدم ؟؟؟ معذورين ولاد بهيه بقى لما يعملوا زي شكمان العربيه الفورد القديمه ويطلعوا هباب .. ما هو من الهباب اللي شايفينه .. وعايشينه وشاربينه ويا ريت حتى يلاقوا ياكلوه ... تحياتي للجميع<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045010/http://masr.20at.com:80/article.php?sid=1281"

[[comments]]
order = 2
subject = "انا قلت \"ده اليوم العالمى للكلاب \""
author = "فارس_fr"
posted = "2006-12-11"
text = "انا قلت قبل كده , الظاهر ان اليوم ده يومهم يوم \"الوفاء \" بصراحة يايزلاد االبلد من عناوين المواضيع ممكن تتخنق من كثر ذكر كلمة الكلاب وهوهو ونونو , ولكن بعد القراءة مواضيع كلها الى حد ما كويسة وخلت الواحد ضحك شوية ,,, بدل الغم اليومى \"اخبار مبارك وحرمة \" ..... الا بالحق اخبار البوبي الصغير والتوريث ايه ؟؟؟؟ظ"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045010/http://masr.20at.com:80/article.php?sid=1281"

[[comments]]
order = 3
subject = "الكلاب نوعان يا جماعة"
author = "يسقط جمال برايز"
posted = "2006-12-11"
text = "الكلاب نوعان الاول:وهو الاحسن نوعا وفـي ومخلص لصاحبه وهو الكلب بشكله الطبيعي.<br />والنوع الثاني : وهو الاسوء والابشع في كل التاريخ وهم حرس النظام المصري من الشرطة وامن الدولة والحرس الجمهوري وبعض افراد الجيش والموالين للنظام العميل وعلي راسهم حسين طنطاوي السمسار<br />وليس كل الجيش لان هناك من يريد ان يخلص مصر من النظام العميل.<br />http://ibnbahya.blogspot.com"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045010/http://masr.20at.com:80/article.php?sid=1281"

[[comments]]
order = 4
subject = "كلب مثقف تقدمى"
author = "ايمن امام"
posted = "2006-12-11"
text = "مساء الخير/ على فكره فى كلب مثقف يعنى تسأله فى اى حاجه يهوهو على طول كمان تلاقيه يحب يتكلم عن سكان الشارع- قال ايه قال واحده ست لابسه طرحه - تبقى ذفت وواحده قالعه هدومها تبقى ورده- قام الكلب التانى يدافع عنه لما سكان الشارع هاجو عليه - قام الكلب التانى قال يا متخلفين انتو مش فاهمين لغه الكلاب ودى لغه منتشره فى العالم العربى اليومين دول- وأسألو طنط هلهل وطنط دغدغ وطنط نواله المصريه - ياجهله- دا ابداع الكلاب المصريه غطى سماء المنطقه- واللى مش عاجبه ها نجيبله عقد عمل فى كوبا حيث الماء والهواء والكلاب حسنه المظهر يلا جونتو نامو يارعاع - الليل قرب ودا معادنا احنا التنويريين -ننور ونهوهو- وبوش تقرفونا كل شويه - لحسن اجيبلكو ابو صباع مدوحس بتاع امل الزاويه- هوهوهو- ديمقراطيه تقدميه ياجهله يااعداء التنوير/ ايمن امام"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045010/http://masr.20at.com:80/article.php?sid=1281"

[[comments]]
order = 5
subject = "موضوع جميل يا احمد وصاحب تعليق جمال برايز ف الجون"
author = "نيفين نيفى نوفا"
posted = "2006-12-12"
text = "فعلا تعليق جنال برايز دا ف الجون<br />كلاب الداخليه فعلا نوع جديد من الكلاب بس مننصحش حد بالتفرب منها لانه غير مستانثه بالمره<br />و بحب اقول لاحمد تدا ان دليل جمال موضوع انك لما تبداه تلاقى نفسك مش قادر تسيبه الا لما تخلصهو دا اللى حصللى مع موضوعك اللى برغم انه لايت فهو جميل"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045010/http://masr.20at.com:80/article.php?sid=1281"

