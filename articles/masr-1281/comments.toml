text = "أول وآآآآآآخر مرة أكتب موضوع لايت .. والله مابعرف.. ده كتب تحت وطأة التهديد .. يعني لولا كده ماكنتش حبيت أهوهو مه بقيت البشر اللي هوهوت .. أنا باهوهو لوحدي في النقد الأدبي وراضي بحالي هنااااااااك في الركن البعيد الهادي ..المواضيع اللي مالهاش قراء إلا أنا :)"
