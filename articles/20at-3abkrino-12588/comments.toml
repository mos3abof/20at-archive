text = "الموضوع ده غاية في الاهمية لان الفم هو مدخل الجسم الوحيد والاهتمام به يبين مدي ثقافة الانسان و الملتزم بنظافة فمه احتراما لكلام رسول الله (ص) فهو ملتزم بالسنة وياخد عليها اجر بالاضافة لاحساسه بالصحة في جسده .قال رسول الله (ص)لولا اشق علي امتي لامرتهم بالسواك قبل كل صلاة .صدق رسول الله(ص)"
archived = "2009-08-11"
