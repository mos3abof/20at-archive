text = "جزاك الله خيرا اختنا الكريمة<br />الموضوع هام جدا للصغار او الكبار<br />ولكن اين ذكر السواك فهو يكون معنا فى كل مكان<br />ولكن بارك الله فيك ونرجو ان تتابعى كتابة مثل هذه المقالات"
