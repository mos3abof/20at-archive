[[comments]]
order = 0
subject = "نونا"
text = "يا ليلى .. فيه حد برضه ياخد ميعاد من عضو مجلس الشعب عن الدايرة بتاعته ... طب كنت شوفي الدائرة اللي جنبك ولا اللي جنب اللي جنبك ولا أي دائرة شقيقة والسلام ... وبعدين بذمتك هو عضومجلس الشعب بس اللي فرقع لك ميعاد .. يعني مش الموضوع ده ظاهرة عامة"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022003105/http://www.20at.com:80/article.php?sid=480"

[[comments]]
order = 1
subject = "نجاح المتاح"
text = "أنا باضرب مواعيد .. وأي حد يقول أنه ما بيضربش مواعيد يبقى كداب ... يعني في بلد زي مصر أزمة المرور لوحدها تخليك تتأخر عن ميعادك ييجي 4 ساعات .. وساعات تبقى مفلس ماعاكش فلوس تنزل .. وساعات الجو حر والرطوبة عالية ... وساعات على ما اشرب الفايف تي اوكلوك بتاعي تبقى الساعة بقت 8 والميعاد راح وعادي يعني بتحصل"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022003105/http://www.20at.com:80/article.php?sid=480"

[[comments]]
order = 2
subject = "مصـ( الخير )ـعب"
text = "يا جماعة أنا لما قرأت الموضوع الجميل ده<br />افتكرت مقولة كان قالهاأحد مشاهير مصر<br />( مش فاكر مين بالضبط)!!!!!!!!!<br />قال:<br />\" في مصر ؛ عقرب الثواني في الساعة ليس له أدنى<br />فائدة لأنه لا يوجد أحد يلتزم بمواعيده بالثانية!!! \"<br />و انا أؤيده<br />بل و أضيف:<br />\" في مصر ؛ لا توجد أدنى أهمية لعقرب الدقائق<br />بل ولا حتى الساعات لأنه لا يوجد بموعده في نفس اليوم\"<br />أو بمعنى آخر :<br />\" لو ما جيتلكش خلال 12 يوم من المعاد ابقى روح \"!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!<br />ترقبوا البيان التأسيسي للحلف الالكتروني الفظيع!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022003105/http://www.20at.com:80/article.php?sid=480"

[[comments]]
order = 3
subject = "مصـ( الخير )ـعب تاني"
text = "بالمناسبة ليه ما تعيشيش انتي<br />في دور :<br />\" عبده المهم \"<br />ده دور جنان<br />و هادلك على محل أعصاب باردة في وسط البلد<br />هيناسب الدور ده جدا<br />بس المشكلة ان مجلس الحي<br />جاب قرار إزالة<br />للدور ده!!!<br />سلاااااااااااااااااااااااااام<br />ترقبوا البيان التأسيسي للحلف الالكتروني الفظيع"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022003105/http://www.20at.com:80/article.php?sid=480"

