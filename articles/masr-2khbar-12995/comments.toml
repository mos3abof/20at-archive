posted = "2009-08-20"
text = "من سنة 52 حتى الان من عمر الثورة والبلد في النازل<br />حكومات ورؤساء ما ورهمش غير السرقة والنهب<br />سرقة ونهب<br />وادي النتيجة<br />جوع ضرب في كل اركان الدولة<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />يا شماتة الاقباط فينا والله<br />يا شماتة عدلي ابادير فيها"
archived = "2009-08-26"
capture_url = "https://web.archive.org/web/20090826171352/http://www.20at.com:80/masr/2khbar/12995-2009-08-20-09-46-37.html"

[[comments]]
order = 3
subject = ""
author = "تمهيدا للبيع"
posted = "2009-08-21"
text = "الحكومة بتتعمد عدم الصيانة والتجديد للاتوبيسات - يعنى تلاقى الاتوبيسات ماشية بتدخن واصوات المحرك عالية جدا والمرور شايفها بتدخن يروح عامل مخالفة للسواق الغلبان تتخصم من مرتبة<br />وكل دة تمهيد للبيع لواحد اسرائيلى بيشتغل خلف واحد سعودى او كويتى يتقدم للشراء<br />تمام زى ما حدث لمصنع الكتان بطنط<br />باعوة لواحد سعودى من الحجاز وزى ما قال العمال فى المظاهرة امس باعوا المصنع بشوية جاز لواحد من الحجاز<br />وطبعا السعودى قفل المصنع وهيبيع ارضة مبانى<br />والفلاحين هيبطلوا زراعة الكتان التى كان يزرع من ايام الفراعنة علشان مفيش مصنع كتان ياخد انتاجهم<br />وبذلك تم القضاء نهائيا على زراعة الكتان فى مصر بفضل الاثتثمار بتاع الفكر الجديد<br />انا مش فاهم مين اللى بيخطط للبلد دى<br />فية شوية عيال مش مصريين ابدا ومش فاهمين يعنى اية مصر<br />البلد رايحة فى ستين داهية قريب جدا"
archived = "2009-08-26"
capture_url = "https://web.archive.org/web/20090826171352/http://www.20at.com:80/masr/2khbar/12995-2009-08-20-09-46-37.html"
