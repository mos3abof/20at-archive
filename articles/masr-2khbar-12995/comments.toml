author = "فين مجلس الطراطير"
posted = "2009-08-20"
text = "فين مجلس الطراطير بتوع قانون المرور الجديد<br />ازاى سواق مرتبة 600 جنية ويدفع مخالفات مرور 400 جنية غرامات مرور عشوائية<br />هيشتغل للة<br />قانون المرور حل مشاكل المرور<br />ابدا<br />تسبب فى اضراب اصحاب المقطورات<br />والان سواقين الاتوبيسات<br />ولسة لما يطبقوا قانون الضرائب العقارية والناس تعجز عن الدفع<br />مجلس شعب ابن وسخة"
archived = "2009-08-26"
capture_url = "https://web.archive.org/web/20090826171352/http://www.20at.com:80/masr/2khbar/12995-2009-08-20-09-46-37.html"

