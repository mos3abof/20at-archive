posted = "2009-08-20"
text = "من سوء حظ مصر ان ربنا ابتلاها بشوية العيال المجرمين دول الي سمو نفسهم رجال الثورة<br />لا دين ولا اخلاق ولا ضمير ولا شرف<br />شر1مه كانت متجرده من كل ما هو انساني<br />ستين سنه تدمير وتخريب في البلد<br />والنتيجة سواء اتوبيس بياخد ستين جنيه ويدفع مخالفات ربعين جنيه<br />عجبي"
archived = "2009-08-26"
