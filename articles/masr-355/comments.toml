text = "طريق الالف ميل عندنا لازم يبتدى باسقاط النظام<br />ويارب متبقاش نهايه كل معارض ذى ايمن نور<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
