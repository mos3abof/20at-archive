[[comments]]
order = 0
subject = "هؤلاء اولادنا"
author = "هل فقدنا الاحساس ؟"
posted = "2007-02-13"
text = "هؤلاء الاطفال هم نتاج الانفتاح واقتصاد السوق وتجويع المجتمع كلة كى يشبع 2% من المجتمع حتى التخمة<br />فى مصر وعلى تاريخ عمرها وسنينها السود والبيض كان الكل يقول<br />فى مصر بلدنا محدش بيبات من غير عشا<br />يا سادة يا مسئولين الناس دلوقتى بتنام من غير عشاء<br />فية اطفال شوارع من الفقر زى امريكا الاتينية مثل المكسيك والارجنتين والبرازيل<br />اصبحنا اقتصاديا اسوأ من الكونغو برازافيل<br />اما تنجانيقا فنحن نتمنى ان نلحق بيها فى التنمية<br />يا سكان المحروسة انتم فى فريزر سياسى لا تنمية لاخطة لا سياسة كلة ماشى ببركة الاولياء الصالحين ودعوات ام هاشم بالعمر الطويل المديد وحتى اخر نفس<br />فى السنوات القادمة سنسمع عن نساء الشوارع ورجال الشوارع وكلة هيصيع وهينام فى الشارع ابشروا الخير قادم"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073214/http://masr.20at.com:80/article.php?sid=1590"

[[comments]]
order = 1
subject = "سودان بتضرب مصر وحسنى بيبنى القصر"
author = "كوكوكوكو"
posted = "2007-02-14"
text = "الشرطة السودانية تعذب ٢٨ عاملا مصريا بسبب مشاجرة مع سوداني<br />كتب وائل علي ١٣/٢/٢٠٠٧<br />أحد المصريين الذين تعرضوا للاعتداء.. والصور نشرها موقع سودانيز أون لاين<br />تعرض ٢٨ عاملا مصريا لاعتداءات شديدة وتعذيب علي أيدي أفراد شرطة النجدة والعمليات السودانية مساء يوم السبت الماضي، ونشر موقع «سودانيز أون لاين» صورا لعدد من هؤلاء العمال، وآثار التعذيب علي أجسادهم.<br />طالب مركز الجنوب لحقوق الإنسان، الذي يتبني قضية هؤلاء العمال، بإجراء تحقيق عاجل في الواقعة التي شهدتها مدينة الرياض السودانية.<br />وأكد المركز في بيان له أمس أنه تم الاعتداء عليهم في موقع عملهم بالمدينة، ثم تم استكمال حفلة التنكيل بهم بمركز شرطة الرياض تحت إشراف ضابط برتبة ملازم ثان.<br />وذكر البيان أن تفاصيل الحادث تعود إلي خلاف نشب بين عامل مصري وآخر سوداني في إحدي العمارات تحت الإنشاء، حيث قام السوداني بسب المصري بألفاظ غير مقبولة، ثم توجه إلي أقرب نقطة تمركز للشرطة، وأبلغها حيث جاءت إلي الموقع، واعتدت بالضرب علي جميع المصريين، مستخدمة العصي وفوهات البنادق والركل بالأحذية، فضلا عن توجيه الشتائم إليهم.<br />وأشار البيان إلي أن بعض أبناء الجالية المصرية في السودان قاموا في صباح اليوم التالي بالاحتجاج لدي وزارة الخارجية السودانية، ولدي مكتب الأمم المتحدة والقنصلية المصرية بشارع الجمهورية.<br />وأدان البيان مثل هذه الاعتداءات التي لا يمكن تبريرها بأي حال من الأحوال، مطالبا بإنزال أقصي العقوبة ضد مرتكبيها أو الذين أشرفوا عليها.<br />وطالب وجدي عبدالعزيز، مدير المركز، مسؤولي وزارة الخارجية المصرية بسرعة التدخل لحماية حقوق العمال المصريين والعمل علي عدم إفلا<br />اقرأ بقية التعليق .."
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073214/http://masr.20at.com:80/article.php?sid=1590"

[[comments]]
order = 2
subject = "واحد كان في الشارع"
author = "واحد كان في الشارع"
posted = "2007-02-14"
text = "كنت واحد منهم قبل خمسه وعشرين سنه لولا قابلني واحد طيب وابن حلال قدام جامع كنت عايز اشحت منه راح واخدني من ايدي وقالي هاديلك اللي انته عايزه بس تعالى<br />خفت منه في الاول احسن يسلمني للعسكري وجريت ولكن بعد يومين رحت معاه وجابلي اكل وعطاني فلوس عشان اديها لامي العيانه وما كانش لي ام اصلا بس انا قلتله كده ساعتها<br />قابلته كام مره بعد كده واتكلم معايا وسالني مش عايز تشتغل فرديت عليه لا وبعد فتره تانيه فضل يسالني مش الشغل احسن من البهدله دي ورحت معاه مكان فيه شغل عند مكتب محاسب كنت بانضف المكتب واتعلمت اعمل شاي وقهوه ولبسني كويس وخلاني انام في المكتب ولما لقيت نفسي نضيف ومعايا فلوس رحت ازور اهلي وحكيت ليهم وجه ابويا وسلم على الراجل وشكره وعمي الحج طلب من ابويا اوراقي عشان يدخلني مدرسه وفعلا دخلت وكان ابنه بيذاكرلي ويحفضني الدروس ولاول مره لقيت نفسي وسط عيله طيبه وولاد حلال ساعدوني لغايه ما بقيت معايا دبلوم واشتغلت في المكتب عندهم وكملت وبقى عندي بكالوريوس وبرضه لسه معاهم في مكتبهم مش عارف ارد الجميل ده ازاي لغايه النهارده<br />باقي كلمه حق مهمه اهم من كل اللي قلته قبل كده وهي ان عم الحاج ده اعتقلوه كتير لانه من الاخوان المسلمين وانا هنا مش بادافع عن الاخوان ولا لي علاقه بيهم كتنظيم لكن لي علاقه بيهم كبني ىدمين شفت على ايديهم الخير لكل الناس ومن غير قسم كان بييجي لعمي الحاج ناس نصارى من بلدهم فقرا ويعطيهم والله كان بيساعد كل المساكين وعلى يدي وقدام عنيه شفت مساعدته لكام واحد مساكين من بلدياته ومسيحيين كانوا بيشتغلوا عندهم في البلد وسنهم كبر والفقر قتلهم زي كتير من ناس مصر<br />طيب ليه الحكومه بتعمل كده مع ناس زي عمي الحج ده والله ما عرفش ليه"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073214/http://masr.20at.com:80/article.php?sid=1590"

