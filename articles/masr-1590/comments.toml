[[comments]]
order = 4
subject = "يا كوكوكو"
author = "مصرية"
posted = "2007-02-15"
text = "واللهى انا بقول اننا احنا اللى عملنا اطفال الشوارع دة مش ذنبهم دة ذنب المجتمع ذنب الحكومة ذنبنااحنا دة ذنب الظلم ذنب الزمن كان ممكن واحد من اطفال الشوارع كان ممكن يبقى عالم او رئيس يحكم بالعدل او مدرس يتقى الله او اب يعلم ولاده الكرامة والعزة.وعلى فكرة اطفال الشوارع بعد كام سنة هيعملوا امة شوارع وكلنا بعد كدة هنعيش فى الشوارع وبعد ماكنا مصريين هنبقى شوارعيين والبقاء لله فى المصريين وفى مصر وياريت الدول العربية تيجى تعزى فى المصريين فى عمر مكرم للاسف يا جماعة حتى عزنا هيبقى فى مكان مش مكتوب انه مصرى لكن مكتوب انى المكان سعودى بس يلا مش مشكلة ما احنا السبب احنا اللى بعنا ارضنا.ويا كوكوكو ليهم حق السودانين يعملوا كدة فى العمال المصريين ماهما شايفين اننا نتهزق من حكومتنا واننا اصلن معندناش حقوق يعنى المواطن المصرى معندوش حقوق يعنى لو مات ماشى بالسلامة ولو عاش الحكومة بتدعى انه يموت كان لازم يعملوا كدة ما خلاص شافوا انى كرمتنا فى الارض والانسان المصرى بقى يداس عليه بالجزمة القديمة وهى دى كلمة شكرا عندهم لينا احنا اللى عاملين حضارة لافرقيا يعنى لولا مصر كانت افرقيا مش هيكون ليها حضارة احنا بناة الاهرام وفى ناس بتقول انى احتمال يكون الفراعنة وصلوا للقمر احنا اصحاب الحضارة احنا اللى علمنا العالم كله ازاى يزرعوا دلوقتى بقينا بناخد بالجزمة وبنضرب وبنتهان يااااه متشكرين اوى للناس اللى بتضربنا. واللهى لو كانوا الفراعنة عرفوا انى دة هيحصلنا كانوا راحوا عاشوا فى حتة تانية وبنوا حضارتهم فى حتة تانية لاننا منستهلش اى حاجة وكمان منستهلش الهواء اللى بنتنفسوه احنا اصلن منستهلش اننا نبقى مصريين.<br />انا اسفة يا مصر لو كان بايدى اختار انا مين وجنسيتى ايه كنت اخترت ابقى حد تانى لانى مستهلش انى اكو<br />اقرأ بقية التعليق .."
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073214/http://masr.20at.com:80/article.php?sid=1590"

