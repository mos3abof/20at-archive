posted = "2009-11-02"
text = "المشكلة الحقيقية اللي تواجه شعب الجزيرة العربية انهم مخدرين من بن سعود وعياله وسار لهم ابووهم مايدرون وخادعين الشعب باسم الدين ومطوع بريدة000000 والفساد في القصور الملكية والله المستعان00000 الوزارات الكبيرة عيال عبدالعزيز الاندية الرياضية عيال عبدالعزيز0000 الشركات الكبيرة عيال عبدالعزيز 0000 المؤسسات الكبيرة عيال عبدالعزيز0000 البنوك الكبيرة ملك عيال عبدالعزيز000 عوايد البترول مقسمة علي عيال عبدالعزيزواحفاد ه 0000 الفنادق الكبيرة في اوروبا ملك عيال وبنات عبدالعزيزوتجي واحده مثل جواهر بنت فهد وتقول حنا نملك الجزيرة وشعبها 0000 تستاهلون اكثر من كذا"
archived = "2010-01-26"
capture_url = "https://web.archive.org/web/20100126084803/http://www.20at.com:80/20at/latest-news/7392.html"

[[comments]]
