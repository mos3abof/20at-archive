text = "الدكتور سعد الفقية يسيئ اكثر مما ينفع عن قصد او غير قصد الله اعلم<br />ترى ذلك في الاعضاء المنتمين الى الحركة بأسلوبهم الفارغ وثقافتهم المحدودة<br />كما يمكن مشاهدة هذا الناتجج من المعارضين تربية الفقية<br />على صفحات المنتديات عقول جوفاء وتفكير قاصر<br />هذة الاصناف من المعارضة مئالها الفشل<br />والشعب ينتظر ما تحت الرماد او ينتظرولادة معارضة جادة واعية"
