posted = "2009-11-06"
text = "ودي اسأل بعض الإخوة المتسعودين من عيال القبايل وشاللي صار بالسبلة 2-واشلون عبدالعزيز دخل الرياض هو وربعه ومن اللي دخل وسط حريم بن هادي 3- واشلون صارت ارامكو تتحكم في البترول بعقد مع عبدالعزيز لمدة 120 سنة4- وإيش قصة الاميرة بنت محمد ابوشرين5- وإيش الخلاف بين تركي بن عبدالعزيز وعزيزبن فهد6-واشلون تزوج فهد بن عبدالعزيز من ال ابراهيم7- ويش الخلاف بين عبدالله وال السديري8-<br />ويش سالفة الوليد بن طلال والمزرعة وقبيلة الدواسر8-واشلون سارت بنات القبايل قهوجيات بقصر العاهر الوليد بن طلال اللبناني9-وايش اللي صاربعسير وتهامة واشلون صار فيصل ملك وسعود وقصر خزام 10-اشلون صارت الاراضي الفاضية شرق الريلض ملك سلطان بن عبدالعزيز 11- واشلون فيصل بن فهد اصيب بالإيدزفي صمت الجميع"
archived = "2010-01-26"
capture_url = "https://web.archive.org/web/20100126084803/http://www.20at.com:80/20at/latest-news/7392.html"

[[comments]]
order = 5
subject = ""
author = "سعود الثمالي"
posted = "2009-11-06"
text = "تزعم جواهر اننا بشر لاكننا خراف —— ليس تماما انما في ظاهر الاوصاف<br />نقاد مثلها نعم —نذعن مثلها نعم —نذبح مثلها نعم— تلك طبيعة الغنم —- لكن يظل بيننا وبينها إختلاف نحن بلا اردية وهي ترفل بالاصواف —نحن بلا احذية وهي بكل موسم تستبدل الاضلاف— وهي لقاء ذلها تثغو ولاتخاف ونحن حتي صمتنا من صوته يخاف<br />وهي قبيل ذبحها تفوز بالاعلاف —-ونحن حتي جوعنا يحيا علي الكفاف—-<br />هل نستحق نحن أبناء الجزيرة تسمية الخراف———"
archived = "2010-01-26"
capture_url = "https://web.archive.org/web/20100126084803/http://www.20at.com:80/20at/latest-news/7392.html"

[[comments]]
order = 6
subject = ""
author = "سعود الثمالي"
posted = "2009-11-08"
text = "قلت لكم ان الشعوب المسلمة 000 رغم غناها معدمة0000 وإنها بصوتها مكممة0000<br />وإنها تسجد لبن سعود0000 وهو يسرقها ويملك مبني المحكمة0000 ويملك القضاة والحجاب 00أستغفر الله فما أكذبني 00فهاهي الأحزاب 00تبكي لدي أصنامها المحطمة 00وهاهو الكرار يدحو الباب علي يهود الدونمة00 وهاهو الصديق يمشي زاهدامقصر الثياب00وهاهو الدين لفرط يسره قد إحتوي مسيلمة0000 فعاد بالفتح بلا مقاومة00من مكة المكرمة00000 ارجوا من جميع الإخوة الإصلاحيين ان يضعوا تسمية حقيقية تليق بشعب الجزيرة العربية قبل ان يسلبهم بن سعود اسماء أبائهم وقبائلهم قال تعالي :أدعوهم لابائهم)وأرجو عدم التسمية بالسعوديين وأن تفق علي مسمي وطنا بعيدا عن تسمية السعودية— وأن يفكر الجميع كيف يكون الحكم بعيدا عن الملكية والتبعية وتجار الدين<br />ربم الزاني يتوب —- ربماالماء يروب —ربمايحمل زيت في ثقوب —-ربما يتوب الشيطان من الذنب فيعفوعنه غفار الذنوب —-انما لايبراءابن سعود من ذنب الشعوب—-<br />وأنا أدعوا هذه العاهرة جواهر بنت فهد الي الحوار وهي تهدد وماتبي احد يرد عليها بالتلفون<br />هذا الحجي كان زمان قبل الصحوة والإصلاح واقولها الله يلعنك ويلعن ابوك000"
archived = "2010-01-26"
capture_url = "https://web.archive.org/web/20100126084803/http://www.20at.com:80/20at/latest-news/7392.html"

[[comments]]
order = 7
subject = ""
author = "سعود الثمالي"
posted = "2009-11-11"
text = "لقد كشف الحوثييين جيش الكرتون الذي صنعه بن سعود ولاعب الارجوز خالد بن سلطان<br />دقائق من المواجهة فرت علي إثرها قوات بن سعود أمام مراي ومسمع العالم لماذا لاتهرب هذه القوات واسلحتها مجرد ألعاب لاتضر ولاتنفع واتحدي وزير الدفاع ان يشتري أسلحة جديدة ومتطورة لان إتفاقية الحماية بين بن سعود وأمريكا تفرض عدم السماح بشراء اسلحة الابموافقة امريكا ولان امريكا تقوم بالحماية فلاداعي لهذه المسرحية اللتي يلعب فيها خالد بن سلطان دور البطل ولماذا لم يكلف احد أبناء االقبائل الموجودين داخل الجيش بهذه المهمة السبب هو خوف بن سعود من تحالف الفبائل في الجنوب مع الحوثيين وبن لادن وجيش الإصلاحيين مع شعب الجزيرة العربية ومن ثم سقوط حكم اليهود والاتراك في جزيرة العرب<br />من بعد كل مذبحة —لم نري من قواتنا ردود افعال— سوى النوح علي امواتنا—وثارهم لموتهم بالعوات الصالحة —لمن إذنحول وهاد جوعنا —قامت جبال الاسلحة الم يكن اجدي لنا لوادخرنا مالنا ثم اتخذنا قوة رخيصة وكاسحة—————-"
archived = "2010-01-26"
capture_url = "https://web.archive.org/web/20100126084803/http://www.20at.com:80/20at/latest-news/7392.html"

[[comments]]
order = 8
subject = ""
author = "سعود الثمالي"
posted = "2009-11-14"
text = "بلادنا تكتض بالفقراء ولمن يرصون السلاح وحربهم—حب وهم في خدمة الأعداء——<br />وباي أرض يحكمون وأرضنا لم يتركوا منها سوي الأسماء؟—- وباي شعب يحكمون وشعبنا متشعب بالقنل والإقصاء؟—- يحيا غريب الدار في أوطانه ومطارد بمواطن الغرباء—— لكنما يبقي الكلام محررا إن دار فوق الألسن الخرساء — ويظل إطلاق العويل محلللا —- مالم يمس بحرمة الأمراء—- ويظل إسمك بالجريدة جائز مادام وسط مساحة سوداءويظل رأسك عاليا مادمت فوق النعش محمولا في الغبراء — وتظل تحت الزفت كل طباعنا —مادام هذا النفط في الصحراء"
archived = "2010-01-26"
capture_url = "https://web.archive.org/web/20100126084803/http://www.20at.com:80/20at/latest-news/7392.html"

[[comments]]
order = 9
subject = ""
author = "سعود الثمالي"
posted = "2009-11-30"
text = "لقد كشف السيل في جدة عن المشاريع الوهمية التي يدعي بن سعود انه قام ببناء البني التحتية وكشف الله سؤئتهم وابشركم بن سعود مغيريين موعد يوم عرفة اللي كان حسب التقويم الصحيح يوم الجمعة ولكن واحد من الكهان من السنغال وهو مبطي عند بن سعود قالهم اذا صار يوم عرفة الجمعة ثلاث مرات تري حكمكم يزول لكن الذين يقرئؤن التاريخجيدا يعلمون ان سيل جدة هو بداية النهاية لبن سعود مدري الملك عبدالله يقولون يبي يحاسب المسؤلين عن ماحدث في جدة سبحان الله وراك ماتحاسب حصة الشعيلان حرمكم المصون وهي مع بطل مسلسل سنوات الضياع وراك ماتحاسب دلوعة امه الشاذ ولدك ايمن وراك ماتحاسب العاهرة جواهر بنت فهد وهي تمارس السحاق مع الفلبينيات والزنا مع السائقين<br />نحن لسنا فقراء بلغت ثروتنا مليون فقر وغدي الفقر لدي امثالنا وصفا جديدا للثراء<br />بيتنا كان عراء—- والشبابيك هواء قارس والسقف ماء—- فشكونا امرنا عند ولي الامر—-<br />فاغتنم ونادي الامراءوجميع الوزراء واقيمت ندوة واسعة—نوقش فيها وضع ايرلندا وانف الجيوكندا—— وقضايا هونللولو—— وبطولات جيوش الحلفاء—-ثم بعد الاخذ والرد صباحا<br />الغي عبدالله الشتاء"
archived = "2010-01-26"
capture_url = "https://web.archive.org/web/20100126084803/http://www.20at.com:80/20at/latest-news/7392.html"

[[comments]]
