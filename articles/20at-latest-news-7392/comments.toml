subject = ""
author = "سعود الثمالي"
posted = "2009-12-01"
text = "اخيرا اصدر اللملك امرا يتعويض اسر الغرقي في جدة مليون ريال عن كل شهيد والله لودفع لكل اسرة 100 مليون ريال ماتبرر هذا العمل الشنيع من امراء ال سعود وهذا تعويض بسيط من اموالنا اللي مستمتعين فيها الاسرة الحاكمة —— واحد يسأل ويقول وراهم يدفعن الملايين الي لبنان ؟؟؟ الإجابة بسيطة : السيد رفيق الحريري هو ولد فهد بن عبدالعزيز وهذه قصة طويلة والشبه واضح ومايحتاج تفسير ولا جربوا DNA ———<br />وضعوا فوق فمى كلب حراسة— وبنو للكبرياء في دمي سوق نخاسة—امروا التخدير ان يسكب كاسه ——ثم لماصحت —قد اغرقني فيض نجاسة—وقيل لي لاتتدخل في السياسة<br />فلماذا اناعبد وال سعود اصحاب قداسة —- ايها السادة عفوا كيف لايهتز جسم عندما يفقد رأسه ————-"
archived = "2010-01-26"
capture_url = "https://web.archive.org/web/20100126084803/http://www.20at.com:80/20at/latest-news/7392.html"

[[comments]]
order = 11
subject = ""
author = "سعود الثمالي"
posted = "2009-12-06"
text = "ابشركم بن سعود بدا يهتم بما يقوله الإصلاحيون قام بزيارة لجيش الكرتون في جيزان واخذ صورة تذكارية مع الارجوز خالد بن سلطان والطريف في الأمر إنه خالد بن سلطان سأل عمه الملك عن أحوال الأمير سلطان ابوه ولكن الملك ادار وجهه عنه وقال يسير خير —أبارنا الشهيدة تنزف ناراودما—- ونحن في جوارها نطعم جونارها—لكنناننجو ا ونحمل البرد علي جلودنا ونحمل الضلوع ونستضيء في الدجي—- بالبدر والشموع كي نقرا الجريدة الوحيدة—حملت شكوي الشعب في قصيدتي—لحارس العقيدة وصاحب الجلالة الأكيدة قلت له شعبك ياسيدنا علي الحديدة وقبل ان افرغ من تلاوة القصيدة رأيته يذرف دمعا<br />ويصدر قرارا ان تصرف الحكومة الرشيدة لكل رب اسرة حديدة جديدة— ارجو من دكتور سعد ان ينزل علي الهواء جانبا من هذه المشاركات في القناة"
archived = "2010-01-26"
capture_url = "https://web.archive.org/web/20100126084803/http://www.20at.com:80/20at/latest-news/7392.html"

[[comments]]
order = 12
subject = ""
author = "سعود الثمالي"
posted = "2009-12-08"
text = "سلطان بن عبدالعزيز من الاقامة الجبرية مسوي مشروع جديد لبناء المساكين للمغفلين عبر الموبايل وطالبين تبرعات لسكان جدة —ها ها ها— سرقة جيدة لجيوب بن سعود رقم الحساب 5040 واحد من الانبطاحيين بعد غرق اسرته في جدة قال صورة عبدالله الوحيدة اللي ماغرقت لعنبوك صورة عبدالله سارت مصحف ولا اشلون هذا بدل ماتطلب القصاص من الجاني بن سعود تقعد تتطبل فرعون ربنا ابقي علي جسده بعد الغرق حتي يكون اية—- ان لست اهجو الحاكمين وانما — اهجوبذكر الحاكمين هجائي—- امن التأدب ان اقول لقاتلي— عذرا اذاجرحت يديك دمائي أأقول للكلب العقور تأدبا—دغدغ بنابك يااخي أشلائي—— أأقول للقواد ياصديق او ادعوالبغي بمريم العذراء—-أأقول لللص الذي يسطو علي كينونتي شكرا علي إلغائي——- بن سعود هم الكلاب مع إعتذاري فالكلاب حفيظة لوفائي—إن لم يكونوا ظالمين فمن باتري — ملا البلاد برهبة وشقاء—إن لم يكونا خائنين فكيف مازالت فلسطين بيد الاعداء——سبعون عاما والمواطن ماله شغل سوي التصفيق للامراء—سبعون عاما والسجون مدارس منهاجها التنكيل بالسجناء—سبعون عاما والقضاء منزه إلا من الأغراض والأهواء———"
archived = "2010-01-26"
capture_url = "https://web.archive.org/web/20100126084803/http://www.20at.com:80/20at/latest-news/7392.html"

