posted = "2009-10-23"
text = "فضايح ال سعود تزكم الأنوف وشعب الجزيرة بطوله وعرضه صار ابوهم عبدالعزيز وجدهم بن سعود وصارو يسمونا سعوديين لعنبوكم حنا عيال حرام ولا إشلون حنا بقبايلنا وعزوتنا وديرتنا الشرهة عليك يالجوهرة بنت فهد يالي ماتستحين علي وجهك وتقولين حضرتونا مير نهبتونا وذبحتونا ذبح واخرتها سمعتكم في الدعارة والفساد يالله لاتبلانا ابشرك انت وامثالك من الرخيصات والمدللات وعايشين علي حلال غيركم ابشركم والله اللذي رفع سبع بلياعمد واقولها وحنا عيال القبايل وباذن الله نطردكم عنها طردة الكلاب ويعود اسم الجزيرة العربية ونقول حنا اهل الجزيرة مهوب تابعين لبن سعود اللي ماعنده شي بها"
archived = "2010-01-26"
capture_url = "https://web.archive.org/web/20100126084803/http://www.20at.com:80/20at/latest-news/7392.html"

[[comments]]
