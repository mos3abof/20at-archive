text = "لابد من صحوة عيال القبايل اللي غدر عبدالعزيز باجدادهم بمعركة السبلة وهذه الجوهرة اللي تحسب ان شعب الجزيرة العربية ملك لها ولبوهاى وهذه الدراهم اللي طفحتوها من عرق شعب الجزيرة لابد من يوم يلاسخيف الذرعان مثل يوم السبلة ولابد ماتعودولديرتكم إسرائيل متي يجي في نجد حسن التدابير حتي يجي للصابرين انفراجي"
archived = "2010-01-26"
