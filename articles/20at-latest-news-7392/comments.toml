posted = "2010-01-30"
text = "الحوثيين انسحبوا بعد ماطلبت امريكا ذلك مهوب هالكراتين وعرايس الباربي ومشكلة جدة هم بن سعود وعياله ام قيدوا ام شردوا هون عليك كلهم ليس يساوي شعرة من شاربيك<br />بل لكل العرفان ممن قيدوا حيث استراحوا —- ولك الشكر من القتلي يابن سعود علي جنات خلد دخلوها بيديك ————— اصحوا ياعيال القبايل"
