text = "مبروك تم تسية بحيرة المسك سابقا ببحيرة بن سعود نرجوا إسنخراج شهادة ميلاد جديدة لهذه البحيرة باسم اسرة بن سعود وماشابه أباه فماظلم وأرجو من جميع الإنبطاحيين ان يبدؤا معنا بحصر قصور بن سعود في مدن ومحافظات الجزيرة العربية لأننا وباذن الله سنوزعها علي الشعب المسكين خاصة اهل الصفيح وسلمولي علي ملك اللا إنسانية"
