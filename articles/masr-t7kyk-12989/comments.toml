posted = "2009-08-21"
text = "بجد بجد<br />لية كل واحد ميكونش في حالة<br />العلاقة ملهاش دعوة بحجاب و لا مش حجاب<br />كتير شكلهم بيكون غير ملفت و بيتعرضوا لأزعاجات في الشوارع مش عادية<br />دة,احنا للأسف اتعودنا ننتهك حرمة المارة بنظرات او كلامات و مفبش مشكلة لملامسة كمان<br />للأسف .<br />اما فكرة ان الحوار اتفتح فية مناقشة بشكل صارخ و زيادة فا دا معناة انة محتاج يثار فعلا<br />و ان في كتير فئات متضررة منة.<br />بس الحوار المتمدن هو افضل حوار عشان يطرح اي موضوع بطريقة منطقية ومحترمة و مقبولة من الناحية الفكرية."
archived = "2009-08-22"
