posted = "2007-01-11"
text = "المسلمون مشششششششششششششش ارهابييييييييين دول اسيادكوا يالى رديتوا على صاحب التعليق الاول انتم ولى /* بتحاموا عنهم الكفرة*/ اقسم باللة لو الامر بايدى لالم الكفرة اللى هما المسحين واعدمهم فى ميدان عام ********************/ لو كلامى غلط طب ممكن واحد من المسحين يقولى ازاى انتوا بتقولوا ان */*/عيسى ابن اللة ازاى وعلى فكرة لو ماكنتوش فى فى دينكوا حاجة غلط مكانش الاقباط قالو لازم نحب بعض */*/* اريد الرد من واحدمسيحى*/"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112195343/http://masr.20at.com:80/article.php?sid=1367"

