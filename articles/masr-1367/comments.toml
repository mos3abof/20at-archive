subject = "ياريت تغير العنوان"
author = "فارس_fr"
posted = "2006-12-27"
text = "ياريت تغير العنوان ممكن يكون \"حصاد عام 2006\" سياسيا واقتصاديا واجتماعيا ,.......,.....<br />وبالطبع كلكم عارفين ايه الحصاد السنة دى \" فشل xفشل , تزوير انتخابات وعبارة تغرق وحوادث قطارات ودعارة صحفية يترأسها حمدى رزق وكرم جبر بيمارسوها ضد الاخوان . وغلاء اسعار , انتهاك ادمية المواطنين على يد امن الدولة والشرطة , يعنى من سئ الى اسوا ...<br />ربنا يفرجها من عنده خلاص التدخل البشري مينفعش مع مبارك وعصابته لازم معجزة !!!!"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010222/http://masr.20at.com:80/article.php?sid=1367"

