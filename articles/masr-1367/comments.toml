[[comments]]
order = 0
subject = "الاقباط وهبلهم"
author = "كاتب جاهل يذكر ان اسيوط فيها اغلبية مسيحية مع ان عددهم فى محافظة اسيوط لا يتجاوز 10% كم مسيحى فى مركز البدارى التابع لاسيوط وكذلك فى مركز صدفا ومركز ديروط الشريف وغيرها بل كم مسيحى فى حى الوليدية اكبر احياء اسيوط كثافة سكانية"
posted = "2006-12-27"
text = "فى عموم المحافظة لا يتجاوزون 10%<br />ثم ما سبب عداء الاقباط للاخوان المسلمين<br />حاجة غريبة ماكل المسلمين فى مصر اخوان وحبايب -مش عاجبكم انفلقوا<br />هل تذكرون رحلات التسول للعائلة اياها فى مصر وتنقلهم من بلد لبلد وفشلة الحمارة اللى عملوا عليها كنيسة<br />عجبى للجهل"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010222/http://masr.20at.com:80/article.php?sid=1367"

