[[comments]]
order = 5
subject = "التعليق و هبله"
author = "الجاهل الاحمق عديم الدين صاحب التعليق الاول (الاقباط وهبلهم) تسب المسيح عيسى و امه التى جاء ذكرها فى القران اكثر من الانجيل بل سميت باسمها سوره كامله"
posted = "2007-01-05"
text = "انت لا يمكن ان تكون الا يهودى فهم وحدهم يحملون الكراهيه للمسيح عيسى ابن مريم والغريب انه يدخل مدافعا عن الاخوان المسلمين مما لا يتفق مع كونه يهودى ، اما لو كان يعتقد انه بهذا يدافع عن الاسلام فهى الكارثه.<br />فانت اما ملحد او متخلف عقليا او جاهل فى اسفل درجات الجهل ، وانصحك قبل ان تتحدث بالارقام والاسماء ان يذهب الى مصحه نفسيه او ان تتعلم من اول و جديد قبل ان تجلس امام جهاز كمبيوتر و تكتب عليه<br />رحمنا الله منك و من امثالك."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010222/http://masr.20at.com:80/article.php?sid=1367"

