text = "صاحب التعليق الاول بيقول فيه\"\"هل تذكرون رحلات التسول للعائلة اياها فى مصر وتنقلهم من بلد لبلد وفشلة الحمارة اللى عملوا عليها كنيسة\"<br />تقصد مين يا محترم بالعائلة المتسولة؟؟<br />تقصد عائلة السيد المسيح يا اكبر غبي وجاهل في الدنيا كلها؟؟<br />اشتم زي ما انت عاوز في المسيحيين واليهود والمسلمين كمان..بس بلاش تقل ادبك علي انبياء الله يا عم الحمار....<br />جاتكوا نيلة مليتوا البلد بجد..."
