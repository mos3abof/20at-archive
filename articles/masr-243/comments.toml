subject = "لا يجب أن نتركهم"
author = "مقهور"
posted = "2006-05-03"
text = "القضاه والصحفيين بإعتصامهم لا يمثلون الإعتراض على ما تفعله الحكومة بهم فقط ولكنهم يمثلون ما تفعله الحكومة بالشعب كله ولا يجب ألا نتركهم وحدهم لابد أن يلتف الشعب كله حولهم فمطالب القضاه هى مطالب كل مصرى شريف ولكل مصرى شريف ونفس الشيء مطالب الصحفيين ولا بد أن نكون كلنا يد واحدة من أجل إزاحة هذا الفساد وتذكر أن دول كثيرة حدث بها فساد وثار الشعب وأعيدت الإنتخابات مرة أخرى وبتزوير الإنتخابات يعنى حسنى مبارك مالوش أى صفة فى الحكم لأنه كده حاكم غير شرعى وكيف يحاكم الدكتور أيمن نور على التزوير وهو مزور وقاهر للشعب كله فى كل الإنتخابات فوجود كل المصريين حول الصحافة والقضاة هو أكبر دليل على وحدة الوطن من أجل صد الفساد وتنحيه."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113220/http://masr.20at.com:80/article.php?sid=243"
