subject = "الجاهل صاحب تعليق ولم تعرف مصر المسيحيه"
author = "مصرى وبس"
posted = "2007-02-14"
text = "اولا بولس الرسول لم ياتى الى الاسكندريه ولكن مرقص الرسول هو الذى بشر بالمسيحيه فى مصر وامن الكثير ثم بعدان استشهد مارمرقص وهو البابا رقم واحد توالت الباباوات على كرسى الاسكندريه خلفاء مرقس الرسول الى عصرنا هذا (البابا شنوده وهو رقم 117 )وكانو كلهم مصريين<br />ثانيا كان الرومان الوثنيين يعذبون فى المسيحيين لكى يقضو على الديانه المسيحيه ولكن بالعكس انتشرت الديانه المسيحيه اكثر لدرجه ان عساكر وقوادالرومان انفسهم امنو بالمسيحيه واستمرت الديانه المسيحيه فى الانتشار الى ان امن الامبراطور قسطنطين بالمسيحيه واعلن ان الديانه الرسميه للبلاد هى المسيحيه وكانت مصر احد هذه البلاد حيث كانت كلها مسيحيه وكان هناك القليل من الديانات الاخرى وهذا كان فى القرن الثالث تقريبا<br />ثالثا 5% دى جبتها منيين ومن اى مرجع<br />رابعا كان المصريين يتكلمون بالغه القبطيه وهى تحديث للغه الفرعونيه وعندما دخل الاسلام مصر منع التكلم بها ويذكر التاريخ انه كانت تقطع السن من يتكلم بالغه القبطيه حتى انتهت اللغه القبطيه فى التعاملات الرسميه ولكن استمرت الكنيسه فى الاهتمام بهذه اللغه لانها لغه اجدادنا ومازالت حتى الان تستخدم فى صلوات الكنيسه<br />خامسا مصر فرعونيه مصريه ليست اسلاميه ولا مسيحيه ولا يهوديه"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073036/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 16
subject = "الجاهل اللى فوق"
author = "مصر عربية اسلامية"
posted = "2007-02-15"
text = "واللغة القبطية هى لغة الرومان حروفا ومعنى واستخدامها هو الذى قضى على اللغة الفرعونية ويوجد عدد قليل من اللغة الفرعونية فى اللغة القبطية التى تصلون بها<br />ثم ان الذى قضى على الحضارة الفرعونية هم المسيحيين لانهم سكنوا فى المعابد المصرية واعتبروها اديرة وحطموا كل التماثيل باعتبارها اوثان وكمثال واحد معبد الدير البحرى<br />مصر ابدا لم تكن مسيحية وانما الجالية الرومانية الكبيرة التى كانت تجبى الضرائب للعرب هى التى ادخلت الاسلام فى مصر"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073036/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 17
subject = "الي الناس اللي بتفهم"
author = "اولا الاخ اللي اختار معبد الدير البحري يعني انت عميت مش لاقي غير معبد فرعوني حتي الان علشان تقول عليه ان الاقباط اخدوه وحولوه لكنيسة ثانيا ارجع لكتب سليم حسن وانت تعرف ان اللغة القبطية هي اللغة الفرعونية نطقا ولاتينية كتابة يعني النطق هو النطق الفرعوني"
posted = "2007-02-15"
text = "المهم ان مصر لم تكن في يوم من الايام دولة مسيحية وهذا صحيح لأنها كانت مجرد ولاية من ولايات الدولة الرومانية فمصر لم تكن دولة مسيحية بل ولاية مسيحية<br />الاهم من ذلك انك تدين المسيحين لانهم حولوا بعض المعابد لكنائس وهذا صحيح ولكنهم لم يحطموا التماثيل باعتبارها اصنام<br />ولكن الذي فعل هذا هم المسلمين الذين حطموا تماثيل بوذا باعتبارها اصنام<br />علي العموم الكلام ده انا بقوله للناس اللي بتفهم لكن الناس اللي مش عارفه تاريخ ومش بتعرف تفكر فدول مايستهلوش اني اتعب نفسي واكتب علشانهم"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073036/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 18
subject = "ايه الهبل ده"
author = "شادى ابراهيم"
posted = "2007-02-15"
text = "يعنى ايه الجمله الى انت كتبتها دى (وانما الجالية الرومانية الكبيرة التى كانت تجبى الضرائب للعرب هى التى ادخلت الاسلام فى مصر )<br />هو سمك لبن تمر هندى اى حاجه وخلاص ضرائب ايه ياهبل وبعدين الاسلام دخل مصر عن طريق عمر بن العاص وجيشه<br />وانا عارف انى الناس هتزعل من كلمه جيشه بس للاسف هى دى الحقيقه"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073036/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 19
subject = "ازاي جيشه"
author = "واحد بيفهم"
posted = "2007-02-16"
text = "الاسلام انتشر بحد السيف!! أليس هذا ما تخدعون به أنفسكم؟؟ لقد صمد المصريون المسيحيون على تعذيب الرومان كما تقولون قرونا فكيف لم يصبروا على جيش من العرب أقل عددا من الرومان وأقل كفاءة قتالية؟؟ حتى لو كانوا اسلموا قهرا لماذا لم يعودوا لدينهم أوقات الضعف؟؟ لا تضحكوا على أنفسكم.المسلمين لم يقوموا بتذبيح مسيحيي مصر كما فعل مسيحيوا الصرب مع مسلمي البوسنة وكوسوفو. اذا تأملت ستعرف من انتشر بالسيف ومن بقى به. لأنه لو كان الاسلام انتشر بالسيف لما كان لك ولكل المسيحيين واليهود أي وجود في مصر منذ الفتح الاسلامي"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123431/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 20
subject = "يا رومانى"
author = "حينما فتح العرب مصر كانت فيها جاليات رومانية كبيرة وكان جيش عمرو بن العاص 5 الاف وترك عمرو الرومان المسيحيين يجمعون لة الضرائب او الجزية من الناس وترك من 5 الاف عددا قليلا وتحرك الجيش الى شمال افريقيا لاستكمال الفتح"
posted = "2007-02-16"
text = "وكان عدد المصريين وقتها 5 ملايين<br />ماذا يعمل 5 الاف مع 5 ملايين<br />الرومان المسيحيين البعيدين عن الرقابة كانوا يجمعون اضعاف المطلوب من الجزية وياخذونة لانفسهم<br />وضج المصريين منهم وعددمنهم اسلم من ظلم هؤلاء الرومان<br />ولعلمك وحتى سنوات قليلة خلت كان معظم الصرافين التى يجمعون ضرائب الاطيان من المسيحيين وانا رايتهم<br />اقرأ تاريخ<br />ولا تقرأ التاريخ فى الكنيسة المضللة"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123431/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 21
subject = "اقراوا تاريخ"
author = "هل تريد ان تقنعنى ان شنودة ابو عيون لونها اخضر من اصل فرعونى"
posted = "2007-02-16"
text = "الفراعانة كانوا افريقيين سود او سمر<br />اما اصحاب العيون الخضراء فهم من اصل رومانى من ايام الاحتلال الرومانى<br />اما مهزلة بتوع المهجر اللى بيقولوا انهم اصحاب البلد فهذة خرافة كبرى<br />انتم اولاد الرومان واليهود"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123431/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 22
subject = "استفزاز غير مقبول من الموقع"
author = "نشأت المصرى"
posted = "2007-02-16"
text = "اعتقد ان العنوان يدل على الموضوع ( شنودة) مكتوبة بكل وقاحة وكانة ليس رجل دين والاسم مكتوب بلا القاب ودة بيدل على انحياز الموقع ضد قداسة البابا . وبخصوص المشكلة فاقول ( ان ابواب الجحيم لن تقوى عليها ) والاخ بباوى جاى وعاوز يغير قوانين كنسية سارية من 2000سنة . ومهما حاول هو او غيرة زعزعة استقرار الكنيسة فبكل ثقة اوكد انة سيفشل لان الكنيسة قائمة و مبنية على الصخرة و ابواب الجحيم لن تقوى عليها مرة اخرى"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123431/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 23
subject = "اقرو تاريخ"
author = "الناس الهبله الى بدافع عن الاسلام هو الاسلام محتاج لحد يدافع عنه وللاسف وهما بيدافعو بيزيفو الحقائق وبيقولو معلومات خاطئه اولا الى فتح مصر هما مسلمين يعنى بشر وليس الاسلام كدين قد يكون منهم من له مطامع وممكن لا. اصلهم مش معصومين من الخطاء لحد امتى هنزيف التاريخ ونبدل الحقائق .التاريخ يذكر اخطاء ويذكر محاسن لابد ان نعرفها كما هى"
posted = "2007-02-17"
text = "وبعدين لما المسلمين هما العرب والمسيحيين هما الرومان ومال مين الفراعنه الامريكان"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123431/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 24
subject = "العالم الاخر"
author = "سيد مرزوق"
posted = "2007-02-18"
text = "الاخ ابن بهيه ده مش اول تعليق اقراه له عن مسأله تاريخيه يذكرها<br />واعتقد على اسلوب روايات د نبيل فاروق ان ابن بهيه يقرا فى كتب تاريخ لعالم اخر مواز لكوكب الارض.<br />ده رايى واعتز به جدا و بشده بعد اذنكم يعنى و لو مفيهاش اساءه ادب."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123431/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 25
subject = "عن المواقع الصفراء"
author = "سعيد جدا"
posted = "2007-02-18"
text = "ظريف اوى هذا الموقع الاصفر - او لنقل الاسود - اى خبر ضد المسيحيين يكتبه و يبروزه و يعمل له صوره و لوجو و يسيبوه على الرئيسيه بتاع شهر و هات يا تعليقات و شتيمه و فى الاخر يقولوا احنا مجموعه شباب معرفش مالنا و بنكتب باسلوب معرفش ماله و الدين لله و الوطن للجميع ههههههه ههههه هههه هههه هههه هه<br />خلاص يا شباب الحبكه معادتش اللى هى والكلام معادش منه فايده و فى النهايه كلنا - اخوان - فى هذا البلد. ههه هههه ههههه ههه"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123431/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 26
subject = "البابا خارج النقاش"
author = "ابرام جميل ( اسيوط - القوصية )"
posted = "2007-02-19"
text = "انا لست اعلق لكى ادافع عن قداسة البابا شنودة ( ربنا يعطية طول العمر) فهو الذى يدافع عنا جميعا ولكن اعلق لكى اوضح لكل الاخوة الاعزاء الذين يرون انفسهم عباقره انكم مهما حولتم من ان تشوه صورة البابا فى عيون الاوده لن تسطتيعوا ذلك لان محبة البابا فى قلوبنا وايماننا بتعليمة السليمة (لانها تعليم البابا كله من الكتاب المقدس والاباء الرسل ) اكبر من ان تتصوروه والعبوا فى مكان تانى غير هنا"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123431/http://masr.20at.com:80/article.php?sid=1582"
