[[comments]]
order = 3
subject = "لماذا كل هذا"
author = "باحث"
posted = "2007-02-13"
text = "لماذا كل هذه المصائب التى حلت على الكنيسه القبطيه 0 ولماذا كثر عدد المقاومين لها ؟ اننى ارى ان الكنيسه الارثوذكسيه اليوم فى ظلام الجهل غارقه - لان الاساقفه غير جديرين بالخدمه ولا مؤهلين لها اتوا الى الاسقفيه بالمحسوبيات والمعارف 0 فكان منهم القاسى العنيف الذى يتلذذ بتعذيب الاخر ويشويه على نار ملتهبه وشوه اسمه 0 ومنهم الجاهل الحديث العهد بالخدمه فلا يعرف كيف ينتقى الفاظه ويرتب كلامه كالاسقف الذى سالوه ما معنى بطرخانه فقال مثل كرخانه 0فهل هذا يصلح ان يكون خادما فى مدارس الاحد ؟ وبالرغم انه لا يصلح ان يكون خادما بالمره وجد نفسه بين عشية وضحاها اسقفا لعدة بلاد ويقود مجموعه كبيره من الكهنه والخدام - يا للاسف - ولا يكفىه ان يكون جاهلا ولكنه اكثر من هذا متكبرا لا يحترم كبيرا ولا صغيرا والبلاد التابعه له تستغيث ولا مجيب ! والخدمه ضاعت والكل مغلوب على امره 0 ومنتظرين ابعاده او الكارثه - ولكن يبدو ان الكارثه اقرب 0 وبعد هذا لعلنا وجدنا الجواب على لماذا كل هذا 000 الله يبارك البابا مكسيموس لعله المنقذ"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073036/http://masr.20at.com:80/article.php?sid=1582"

