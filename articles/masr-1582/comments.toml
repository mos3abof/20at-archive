posted = "2007-02-14"
text = "لعنة الأريسيين<br />هي لعنة على من ظلمهم وليست عليهم بالطبع ومعروف أن من ظلمهم هم الرومان واليهود ولعنة الأريسيين أي ذنبهم في رأيي وهذا ما فهمته من القصة ومما لدي من ثقافه بسيطه في هذا الموضوع ولازم الاخ ابو نضال يوضح لنا هل كلامي صحيح ولا لا وله التحيه"
