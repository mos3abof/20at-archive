text = "مالك انت ومال شيخ الازهر يا (.....) ويا (.....) ويا (........)<br />مش عايز اقول اللي بين الاقواس علشان خاطر ديني ينهاني عن ذلك<br />شيخ الازهر سيد ابوك وامك وسيد ابوك حتى لو كان معين فهو تم تعيينه نظرا لمكانته العلمية والاخلاقية.<br />اما عن الشماته في هدم المسجد الاقصى<br />فالمسجد الاقصى مكان وليس بناء ما يهمناش البناء في شيء لازم حيجي اليوم اللي يتحرر فيه هذا المكان.<br />واحنا عندنا بنيان شامخ اسمه القرآن لا يستطيع احدا هدمه ابدا ياحقير بيرد على امثالك"
