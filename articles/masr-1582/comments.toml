[[comments]]
order = 13
subject = "الناس الى بتتكلم عن اريوس"
author = "لو سمحتم بلاش نالف قصص ونزيف الحقائق"
posted = "2007-02-14"
text = "ارجعو الى كتب التاريخ والتاريخ الكنسى وانتم تعرفو مين اريوس<br />اريوس كان قسيس ولكنه كان مهرطق ولذلك حرمته الكنيسه<br />وعاوز اؤل حاجه لو كان اريوس صح اين اتباعه اين مذهبه لقد انتهى لان مابنى على باطل فهو باطل<br />وبعدين اليهود مالهم ومال الحوار هو تلفيق تهم وبس وبعدين جبت منيين انه اتعذب وعملته قديس لو سمحت اكتب المرجع الى جبت منه القصص الى سيادتك تكرمت والفتها لنا<br />الى تصدى لاريوس هو البابا اثناسيوس وليس اليهود كما تدعى ولايفهم من كلامى اننى ادافع عن اليهود لان اليهود هم حقا قتله الانبياء ولكنى اذكر حقائق<br />وبعدين اليهود مكنش ليهم اى سلطه فى مصر كانت مصر بكاملها مسيحيه حتى الامبراطور كان مسيحى (الامبراطور قسطنطين) ولكن كان هناك بقايه وثنيه وقليل من اليهود"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073036/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 14
subject = "ولم تعرف مصر المسيحية"
author = "المصريون كانوا يعبدون الالهة المصرية القديمة التى اطلق عليها الرومان الوثنيةوكانوا يتعبدون لرع وامون وازوريس وحوريس وست"
posted = "2007-02-14"
text = "وكان الرومان يضهدونهم لانهم لم يامنوا بانجيل بولس<br />وحتى حينما جاء بولس اليهودى الى الاسكندرية للتبشير بانجلية قابل اسكافى مصرى وقال لة جئت بالتبشير بالدين الجديد رد علية الاسكافى اننا نعبد اللة الاحد من زمان<br />والاسكندرية كانت ببابواتها كلها من الرومان وكيلواباترة وانطونيوا وبقاياهم<br />وكانت اقلية فقط من المصريين لا تتعدى 5% هى التى تحولت الى المسيحية<br />وهؤلاء بقوا مع الرومان حتى يومنا هذا مسيحيين<br />واسلم المصريين اتباع رع وامون<br />فلا يدعى حاهل ان مصر كانت مسيحية"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073036/http://masr.20at.com:80/article.php?sid=1582"

