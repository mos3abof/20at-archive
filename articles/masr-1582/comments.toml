text = "احب اسال حضرتك سؤال واحد بس , هو انت كتب الموضوع ده للمسيحين بس ولا ايه ؟؟؟؟؟ يعنى المفروض انك تشرح المصطلحات اللى انت كاتبها!!<br />_______________________<br />ومنهم القديس يوحنا ذهبي الفم والقديس غيريغوريوس النيصي والقديس أثناسيوس الرسولي واضع قانون الإيمان والقديس كيرلس الأورشليمي.<br />يعنى ايه \"ذهبي الفم \" , \" الرسولي \".....<br />ذهبي الفم دى على اساس انه مبيغلطش وكلامه كله حكم ولا ايه ؟؟؟؟؟؟؟؟؟؟؟ ارجوا الايضاح<br />_______________________"
