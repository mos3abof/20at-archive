[[comments]]
order = 10
subject = "تعليق على التعليقات"
author = "أبو نضال"
posted = "2007-02-13"
text = "السلام على من اتبع الهدى وخشي الرحمن بالغيب<br />كلمة لوجه الله<br />في رسالة الرسول صلى الله عليه وسلم إلى قيصر الروم ورد ما يلي:<br />((أسلم تسلم وإلا لحقت بك لعنة الأريسيين .. إلى آخر الرسالة))<br />وقد ذكر بعض المفسرين أن كلمة الأريسيين هي الفلاحين ولكن بعضهم ذكر أيضاً أن كلمة الأريسيين نسبة إلى أتباع أريوس الذي قتله اليهود حقا في القرن الرابع الميلادي خشية منه لكونه يدعو إلى المسيحية الحقة ومناهضة التخريبات اليهودية في العقيدة المسيحية فتخلصوا منه ولكن بقي أتباعه مشتتين في بقاع الأرض يدعون إلى المسيحية الحقة برغم ما تعرضوا له من تنكيل وتعذيب واضطهاد من الرومان الذين تغلغل فيهم الفكر اليهودي ومن الوثنيين المصريين أيضا<br />ليس هناك مجال للخوض أكثر في هذا الأمر ولكني لاحظت هجوما عنيفا من البعض على الأخ المعلق الذي ذكر هذه الحقيقة ولا أدري لمصلحة من طمس التاريخ<br />كما أتمنى من الإخوة المداخلة بغير عنف وإيذاء للآخرين فهذا ليس سجالا بالأيدي حتى نسب ونلعن بعضنا بعضا ، فمن لديه تعليق محترم ووقائع تاريخية فليوردها دون تجريح وسب في الآخرين الأعلم ولأخبر منه كثيرا بالتاريخ على ما يبدو<br />للجميع التحية<br />أبو نضال"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073036/http://masr.20at.com:80/article.php?sid=1582"

