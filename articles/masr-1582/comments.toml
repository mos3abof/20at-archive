[[comments]]
order = 5
subject = "قبطي يسرق كنيسة العذراء بالقليوبية"
author = "القس يسطس فانوس"
posted = "2007-02-13"
text = "أمر أحمد عزوز مدير نيابة الخانكة بحبس سائق القس «يسطس فانوس» راعي كنيسة العذراء بالقليوبية ٤ أيام علي ذمة التحقيقات سرق خزينة الكنيسة وبداخلها ٤٥ ألف جنيه، وادعي أن مجهولين اقتحموا الكنيسة وارتكبوا الحادث كشفت المباحث غموض الواقعة وأدلي المتهم باعترافات تفصيلية في تحقيقات النيابة.<br />قال المتهم غبريال نادر عزيز «٣٥ سنة» إنه يعمل سائقاً للقس يسطس فانوس «بطرس» راعي كنيسة السيدة العذراء «مطرانية الأقباط الأرثوذوكس» بمنطقة ورش أبوزعبل منذ أكثر من ٥ سنوات تزوج قبل عامين وأنجب طفلة، تطالبه الزوجة بمصاريف بالغة تفوق راتبه الشهري، حاول الالتحاق بعمل إضافي إلا أن الوقت لم يسمح له.<br />ذات يوم شاهد السائق القس يسطس ومعه ٣ آخرون من مسؤولي الكنيسة داخل حجرة مبني الخدمات الملحق بالكنيسة وقفوا أمام خزينة حديدية، بابها كان مفتوحاً تظهر المبالغ المالية منه.. وقف السائق علي باب الحجرة اتخذ قراره بالاستيلاء علي تلك الأموال عاين المكان والحراسة الأمنية علي الحجرة حدد طريقة الدخول عاد إلي منزله اتصل بالقس وأبلغه أنه مريض واستأذن في الراحة واستقر القس داخل منزله هو الآخر. توجه السائق إلي الكنيسة غافل حارس الحجرة ويدعي جاب الله غالي سليمان وكسر زجاج الباب الداخلي المفضي إلي الحجرة حمل الخزينة ووضعها داخل حقيبة سيارة القس وعاد إلي منزله خبأ الخزينة في جدار خزان الصرف الصحي بداخل منزله ولم يفتحها.<br />وأضاف المتهم أنه ارتكب الواقعة نظراً لمروره بضائقة مالية كما أن المبالغ التي شاهدها في الخزينة أغرته واعتقد أنها ستحل له كل مشاكله واستمعت النيابة لأقوال حارس الحجرة والقس الذي قام بفتح الخزينة وأكد سلامة الأموال الموجودة بها، أمرت النيابة بالتحفظ علي الخزينة لحي<br />اقرأ بقية التعليق .."
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073036/http://masr.20at.com:80/article.php?sid=1582"

[[comments]]
order = 6
subject = "قصيدة( اسد فى السبعين) اهداء للشاعر الكبير امين الديب"
author = "المصرى"
posted = "2007-02-13"
text = "الشاعر الكبير امين الديب ابن قرية نكلا وهو للعلم فى السبعين من عمره تعرض للسجن والاعتقال والاهانه وكل تهمته انه يحب بلده ويكتب قصائد فى حب وطنه ولو كان كتب اغانى لهيفاء ونانسى كان زمانه راكب شبح وضيف دائم فى التليفزيون<br />(قصيدة اسد فى السبعين<br />وشوبش زغرتى يا نكلا<br />عشان انجبتى عم امين<br />ما قيمتك بيه بقت مليار<br />اسد مع انه فى السبعين<br />كلامه حامى زى النار<br />ما بيخافشى ولا يهابشى<br />ولو ضربوه بألف عيار<br />سلامتك يا أبن مصر يا زين<br />وعندى رجاء لو تسمح<br />انا والدى ربى يغفر له<br />كان مصرى اصيل زييك<br />يا<br />اقرأ بقية التعليق .."
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073036/http://masr.20at.com:80/article.php?sid=1582"

