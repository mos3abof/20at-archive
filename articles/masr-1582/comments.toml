[[comments]]
order = 1
subject = "عفوا أستاذ هاني الأعصر .. آريوس ليس مهرطقا .."
author = "إبن بهيه"
posted = "2007-02-12"
text = "لم يكن آريوس أشهر المهرطقين يا أخي .. آريوس كان قسيسا محترما جاء من ليبيا وعمل قسيسا في كنيسة الإسكندرية وقتلته جماعة القوة الخفية (الماسونية اليوم) التي أسسها أحيرام اليهودي عام 43م لتخريب العقيدة المسيحية .. وقتل رحمه الله ببقر بطنه وهو يقضي حاجته بعيدا عن تلاميذه بأمتار خلف أحد الجدران<br />وهو من عزلوه وعذبوه كثيرا لتمسكه بالمسيحية الحقة التي طمسها اليهود في أول مجمع مسكوني في التاريخ عقد ببيقة سنة 325 م<br />واليهود هم من وصمه بالمهرطق وكادوا له عند النصارى .. كان هذا قبل مجيء الإسلام بثلاثة قرون تقريبا .. يعني اليهود دول وجمعياتهم المخفية والماسونية المترمية دلوقتي في شوارع مصر في نوادي الروتاري والليونز بقالهم قرون بيحفروا وراء أي دين وملة عشان يخربوها مش مخصوص للمسلمين كما يعتقد البعض .. هم قتلة الأنبياء منذ كانوا وكان أنبياء<br />طبعا بقية الموضوع لا أستطيع التعليق عليه لأنني لم أقرأ كتاب البابا شنودة حتى اليوم ولم أقرأ رد الأخ بباوي ، ولا تعليق بغير علم .. حبيت بس أوضح ما أعلمه عن آريوس رحمه الله<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073036/http://masr.20at.com:80/article.php?sid=1582"

