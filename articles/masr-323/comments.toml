subject = "موت يا حمار"
author = "واحدة وخلاص ....... لكن مصرية جدا"
posted = "2006-05-14"
text = "تعديلات ايه اللي حتيجي منهم<br />التغيير مش بيجي من رأس الهرم<br />التغيير لازم ييجي من قاعدة الهرم (اللي هي الشعب ..الناس الغلابة .. صحاب البلد الحقيقيين..)<br />و..قبل ما تحلم فوق..<br />لا للتمديد .. لا للتوريث .. نعم لتعديل الدستور"
