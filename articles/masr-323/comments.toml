[[comments]]
order = 8
subject = "الحكاية غير كده خاااااالص"
author = "zikaa"
posted = "2006-05-15"
text = "يا خواننا الكلام ده كله معروف و محفور في الاذهان المشكلة فينا احنا يا شباب البلديعني الناس زمان كانت بتعمل ثورة وبتتمرددلوقتي كله بقي بيخاف من سياسة الكرباج و الثورة السلبية اللي اتطبعنا بيها من ايام من أيام اسود الوجه و القلب السادات ياخواننا مش كفاية خسرنا عيشة ايامنا كمان هانتولد ونعيش ونموت كاننا لم نكن احنا لازم نعمل حاجة يفتكرنا بيها التاريخ زي اللي قبلنا والا ها نفقد وجودنا في ذاكرة التاريخو نبقي جيل منسي الله يزيد من أمثالكم"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211143/http://masr.20at.com:80/article.php?sid=323&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

