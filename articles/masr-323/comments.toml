text = "الى متى ننتظر على رائحه الفساد التى نستنشقهاالتى نراها التى نحسهافى كل مكان. الى اين يسرى بناهذا القطاراللذى لا يستطيع احد ايقافه.هل ننتظر قطار الصعيد مره اخرى. ام ننتظرعباره سلام اخرىام ننتظر حادث كنيسه الاسكندريهالذى عرفنا انه من تدبير الداخليه حتى نعود لقانون الطوارئ مره اخرىالى متيييييييييييييييييييي ."
