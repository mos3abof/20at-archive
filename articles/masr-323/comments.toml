[[comments]]
order = 13
subject = "استحمار الشعب"
author = "انا"
posted = "2006-05-22"
text = "في احدى تصريحات الرئيس جزاه الله<br />ما يستحق على افعاله<br />قال في جدوله الانتخابي ( الاستحماري)<br />انه خلال فترة الحكم القادمة يعني<br />خلال فترة 6 سنين راح يبني 1000 مصنع<br />بالحرف الواحد قال كده حضرته .<br />ولما فكرت شوية ... قلت يااااااااااااه<br />الشعب ده حماااااااااااااااار<br />قوي للدرجة ده ...<br />قمة الاستحمار ... والاستخفاف بعقول<br />المشاهد والأعمى والمستمع والأطرش<br />والجاهل والمتعلم<br />يعني راح يبني كل سنة 166 مصنع<br />يعني في الشهر 13 مصنع<br />يااااااااااه<br />زوبر مان ....<br />إنهما قمة الاستحمار"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211143/http://masr.20at.com:80/article.php?sid=323&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

