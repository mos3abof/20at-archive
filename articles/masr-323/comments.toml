[[comments]]
order = 1
subject = "كداب من يومه"
author = "ابو كرتونة"
posted = "2006-05-14"
text = "عم حسني مزبط شعبه ما فيش بطالة ولا فقر ولا فساد, والشعب ميت فل وعشرة كمان<br />وبس شوية شله منحلة مواليه لاسرئيل همه الي عملين المظاهرات علي الفاضي<br />وعموما كام واحد اشتغل من 5و4 مليون فرصة عمل يا عم حسني يا مزبطنا<br />والله كداب من يومك يا عم حسني"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211143/http://masr.20at.com:80/article.php?sid=323&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "اين حمرة الخجل!!!!!!!"
author = "يا ايها الفاسد المفسد لا نريدك و لا نريد تعديل منك ..فقط نريد الا نراك لا انت ولا امرآتك ولا ابنائك ...كفاك ظلم وجبروت..غدا سوف تذهب ولن ينفعك وزير البلطجة الغير عادلى و لا وزير القواده اللاشريف ولا بائع الفتاوى شيخ اسقاط الازهر ...لن ينفعك احدا ايها الفاسد وسوف ترى اعمالك السوداء ودعوات المظلومين عليك .."
posted = "2006-05-14"
text = "لانريد الا ان ترحل او تنتظر دورك لترى يوم يسحلك شعبك ايها الفاسد.."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211143/http://masr.20at.com:80/article.php?sid=323&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

