[[comments]]
order = 4
subject = "هو إنت لسه متعبتش من الكذب"
author = "مصرى قرفان"
posted = "2006-05-15"
text = "بقالك 25 سنة بتكذب كفاية مش الشعب بس إللى عرف إنك كذاب كل العالم عرف عنك كده خلاص بتلمع نفسك قدام مين وبأى حق تلقى بتصريحات إنت حاكم غير شرعى لمصر لم ينتخبك الشعب وبأى صفة تسافر لتمثل مصر فى أى مكان إنت لم تأتى للحكم بالإنتخاب أنت مغتصب السلطة فى مصر وشأنك شأن أى محتل ونرجوا من العالم كله أن يعرف أن حسنى مبارك رئيس مزور وليس ممثلاً عن الشعب فى أى شيء والشعب بريىء من أى تصريحات يدلى بها عن مصر برائة الذئب من دم إبن يعقوب وأخرج من مصر أنت وعائلتك يا خائن يافاسدالشعب لا يريدك وسيأتى يوم محاكمتك قريباً على فسادك ومصر ستتحرر منك قريباً إن شاء الله ولن تجد لنفسك مكان إلا فى مزبلة التاريخ مع حثالة الشعوب الظالمة"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211143/http://masr.20at.com:80/article.php?sid=323&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "ياه"
author = "من تصريحاته"
posted = "2006-05-15"
text = "وعلق سيادته علي غيبة القانون والنظام بين البعض في الشارع المصري بقوله: إن الحكومة لا تستطيع فرض القانون والنظام بالقوة. فهذا شيء سيسبب حساسية لدي الناس.. وقال: إن الشعب يستطيع أن ينفذ القانون بنفسه. ويلتزم بالنظام طوال الوقت. وليس تحت ضغط غرامات فورية أو تدخل الشرطة.<br />فى حد بيحتقر شعبه للدرجه دى"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211143/http://masr.20at.com:80/article.php?sid=323&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "انتم عبيد احساناتنا"
author = "رشاااد"
posted = "2006-05-15"
text = "ستظل هى فلسفة البغال و كلابهم دائما : انتم عبيد احساناتنا . نحن نملك الارض و من عليها . ليس لكم شىء اليس لى ملك مصر و هذه الانهار تجرى من تحتى هو دائما يستخف قومه فهل سيظلوا يطيعونه فى فساده و استخفافه ؟<br />وكما واجه فرعون موسى بقوله انى اخاف ان يظهر فى الارض الفساد و كما واجة توفيق عرابى بقوله انتم عبيد احساناتنا هى هى نفس العقلية النتنة التى تستخف بكل من فى البلد كانهم اصفار وهم كذلك ان لم يعلموا اولئك الكلاب ان يحترموا كرمتهم<br />قالوا اوذينا من قبل ان تاتينا و من بعد ما جئتنا قال يا قوم اصبروا ان الارض لله يورثها من يشاء من عباده"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211143/http://masr.20at.com:80/article.php?sid=323&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

