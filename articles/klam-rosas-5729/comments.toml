text = "الاومه ازمه دراما مصريه تحتضر و تبتلعها الدراما السوريه<br />اما بالنسبه لموضوع عوده الفنانات المحجبات للدراما و جوده اعمالهم من عدمها افضل انى معلقش على الاقل دلوقتى عاشان مزعلش منى ناس كتير ف الموقع بحبهم و اعتز بيهم<br />بس انا واثقه ان هييجى الوقت المناسب اللى هعلن فيه تعليقى"
