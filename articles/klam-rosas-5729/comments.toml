text = "نشر فكرة التمثيل بالحجاب فى الوسط الفنى اللى مش عاجبه اسامه انور عكاشة فكرى مش قبيحة والله دى فكرة ممتازة لكن للاسف المسلسلات اللى رجعوا بيها الفنانات المحجبات كانت اما تافهه او مملة او وعظيه ولا حاجه منها تستحق الذكر لكن العيب هنا مش فى الحجاب اللى برىء من كل الاتهامات العيب فى الاختيار والنصوص والمخرجين"
