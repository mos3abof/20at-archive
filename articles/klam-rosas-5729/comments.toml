[[comments]]
order = 3
subject = ""
author = "شرين منصور"
posted = "2007-05-06"
text = "السلام عليكم ،في الايام العشر الاوائل من شهر رمضان وبدأت موجة غريبة من نوعها من اتهامات ونقد لاذع في بعض الاحيان واحيانا مسار التنكيت على الممثلات الاتي يرتدن الحجاب مش فاهمة ليه ،اولا منذ متى اصبحت الاعمال التي تذكر الجمهور ببعض القيم والعادات والاخلاق التي يسميها الاستاذ طارق الشناوي مثاليات؟ انها ليست مثاليات انها اخلاق وعادات لابد ان نكون نعلمها علما يقينا وان كان التلفاز قد شوه وقد يكون وصل للاسف لمرحلة محو اخلاقياتنا فهو يحاول ان يعيدها بالطريقةة التي تصل الى شبابنا من شباب وبنات لأن للاسف اصبحت الدراما هي الوسيلة الوحيدة لتوصيل ما نريده اليهم، بالرغم من ذك الا انني لا اوافق على أن تمثل الفنانة وهي مرتدية الحجاب لأن التمثيليات التي نشاهدها على شاشاتنا مجرد اكاذيب للاسف نصدقها بكل سهولة واحيانا نبكي ونفرح معهم وكأن ذلك حقيقة، ومن المفترض ان الممثلة المحجبة بالاخص يجب عدم مشاركتها في كذبة ،ومن ثم لماذا لا ننتقد وضعنا الدرامي و والفني من جميع النواحي ليشمل المحجبات وغير المحجبات فكم من الاعمال التي كانت تجارية ليس فقط المسلسلات التي شاركن فيها الفنانات المتحجبات لماذا نسلط الضوء علىها دون غيرها ؟؟وعودة لكلام الاستاذ الناقد طارق الشناوي وردا على ما قاله ياريت والله تبقى الدراما بتاعتنا مواعظ ،،ومن ثم منذ متى ونحن نطلق على الدراما التي تقدم وعظ كما يقال( تفاهة )حتى لو كانت دون المستوى؟ ،،،اما الحقيقة التي لا انكرها انا شخصيا ان مثلما قال الاستاذ محمد فاضل في احد المواقع الاخبارية المهمة ان السينما توفت الى رحمة الله واضيف انا عليه الدراما ككل وليس دراما المحجبات قد توفت ،،انا اتفرجت على حبيب الروح مسلسل حنان ترك ومسلسل سهير رمزي وكان من الطبيعي جداا انهم على الاقل يقدموا شيء في وعظ ولو لم يقدمو ذلك لكن ميزان الدراما انقلب راسا على عقب ،،وانني لا افهم ماذا تريدون من ممثلة محجبة ان تؤدي ،هل ادوار الخلاعة لا اعلم ولا افهم …خلاصة الموضوع الدارما كلها تعيش غيبوبة و هي في مرحلة غوغائية درامية …"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519193609/http://www.20at.com:80/klam-rosas/5729.html"

