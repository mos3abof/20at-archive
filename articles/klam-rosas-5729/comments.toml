posted = "2008-04-05"
text = "انا واحدة من المحجبين نفسى ابقى ممثلة ولسة لابسة الحجاب قريب جدا علشان التمثيل لكن قلت لنفسى ليه مينفعش امثل بالحجاب لان لازم يكون فى ممثلين فى الوسط الفنى لان التمثيل ده بيعبر عن الحيلة اليومية لماذا لايوجد ممثلين محجبين كتير مع ان معظم البنات فى الحياة اليومية محجبين فكيف تكون فى مسلسل بنت فقيرة وتلاقيها بشعرها وعملا عند الكوافير دى حاجة مش واقعية انا طبعا مش بتكلم ان الفقرا بس هما اللى محجبين بس ده من اقل الامثلة ياريت تساعدونى فى حلم حياتى انا ساعات بضعف واقول اخلع الحجاب علشان التمثيل لكن برجع اقول لا بلاش انا مقدرش اوعدكوا انى مش هخلع الحجاب لكن لو ساعدتونى انا اوعدكوا انى مش ممكن اخلعه ابدا وده ايميلى وياريت تساعدونى فى تحقيق حلم حياتىmixsaragy@ yahoo.com"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519193609/http://www.20at.com:80/klam-rosas/5729.html"
