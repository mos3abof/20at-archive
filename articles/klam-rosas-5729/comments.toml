posted = "2007-05-06"
text = "صباحو ولا مساؤو قشطة نفسي مرة ادخل اعلق تعليق بريء والا الاقي بنت الايه شرين بتعلق ارحمي نفسك خلينا نعرف نعلق بس ارجع واقول تعليق فيه الزبد يا بنت الايه ،،الاخت نيفين نوفي نوفا ليه مش عايزة تعلقي مهي بنت الايه علقت قولي رايك هو اصل رايك يا اه او لأ او شتيمة ..والاخ مندور ابو الدهب جاب المفيد…انا بقى اقول رايي باة اللي بيتفرج على المسلسلات لازم حيجلهم عته مليش دعوة باة محجبات ولا من غير انا مش عارف اعلق بسببك يا بنت الايه مندر ابو الدهب بيس مان سلام مع تحياتي لكم المعلق برنس مصر"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519193609/http://www.20at.com:80/klam-rosas/5729.html"

