[[comments]]
order = 0
subject = "نداء عاجل لكل شخص محترم فينا...تعالوا شجعةنا في عرض النيابة النهاردة"
author = "محمد السيد"
posted = "2006-06-05"
text = "اليوم عرض 200 من المقبوش عليهم في يمظاهرة القضاة يوم الخميس 11/5..<br />واللي شرفت برفقتهم ... لكن مش عارف ليه استعجلوا عليا وطلعوني ....<br />لو حد ممكن ييجي يساندهم ... متتخيلوش كان تأثيره إيه علينا منظر مئات البشر اللي كانوا واقفين خارج مبني محكمة الجلاء .... والله ده كفايه يشجعنا متين سنة قدام ...<br />بجد والله ... اللي يفدر يحضر ويتواجد .. ده له أثر محترم جدا علينا جوه ...<br />وبرضه<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919011609/http://masr.20at.com:80/article.php?sid=459&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "العنوان والوقت وياريت تحضروا ومتقلقوش. مفيش اي قلق أو مضايقة أمنية"
author = "محمد السيد"
posted = "2006-06-05"
text = "صحيح ...نسيت العنوان ..<br />شارع الجلاء .. موازي لرمسيس .. هناك المكان معروف جدا .. وحتلاقوه زحمة ...<br />كمان ... العرض طول اليوم لغاية الساعة 5غالبا ... ماهم كتير ... يعني وقت ماتكونوا فاضيين تعالوا ..<br />بس بجد .. متسبوهمش لوحدهم<br />لا للتمديد... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919011609/http://masr.20at.com:80/article.php?sid=459&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

