[[comments]]
order = 0
subject = "سمية"
text = "يا شيرين<br />الحياة ليست صراع بين الرجل والمرأة ، والرجال الذين يستغربون وجود نموذج امرأة ناجحة وملتزمة رجال مرضى ولا يستحقون الالتفات لهم .. ونصيحتي لكل الستات : خدوا حقكم بالقوة .. الاسلام حض المرأة على أن تلعب دور في كل المجالات .. كل المجالات يا أصحاب الفتاوى المظلمة .. سامعني"
archived = "2004-06-22"
capture_url = "https://web.archive.org/web/20040622062326/http://www.20at.com:80/article.php?sid=373"

[[comments]]
order = 1
subject = "واحدة من المخاليق"
text = "عجبتني جدااا الجملة دي\" لكي يقتنع بأن جرأة الفتاة وثقتها في نفسها، لا ينتقصان من أدبها وتدينها\" ياريت لو الرجال أو الأشباه الموجودة حاليا لو تدرك المعنى دة ... فمازلت عقول البعض منهم مقتصرة على نموذج واحد يحلم به ويتمناه وهو ان تكون زوجته تجمع ما بين رابعة العدوية وهيفاء وهبه!! يرغبون في الكمال بأي صورة.<br />الدين والجرأة والحياء والأدب من السهل أن يجتمعوا في نموذج واحد وليس هناك حد فاصل بين كل صفة واخرى ...أفلا يعقلون!!!!"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803115626/http://www.20at.com:80/article.php?sid=373"

[[comments]]
order = 2
subject = "أمل السيد"
text = "أويد رأي \"واحدة من المخاليق\" فبعض الرجال يعجب بالمتدينة الجرئية المؤدبة المثقفة...لكنها وقت الجد لا يقبل أن تكون زوجة له...قد يرجع ذلك للعقلية الشرقية، او لاحساسه بالنقص أمامها ...لا اعلم لكن في كل الاحوال يعجب بها كأخت، كصديقة، كابنة،كام ...بأي صورة كانت لكنة لا يجرؤ أن يضعها في خانة الزوجة."
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803115626/http://www.20at.com:80/article.php?sid=373"

