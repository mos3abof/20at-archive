subject = "واحدة تانية من المخاليق"
text = "يا أخي بدلا من أن تردد كلمة \"ناقصات عقل\" المنزوعة من سياقها، حاول أن تناقشنا بشكل موضوعي. يا ريت تثبت لنا ان ابو العقل كله بدل ما انت عاجز عن المناقشة أو الإتيان بجديد أو مفيد."
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803115626/http://www.20at.com:80/article.php?sid=373"

[[comments]]
order = 6
subject = "تعقيب بسيط"
text = "\"فأنا مثلاً بنيت أثناء فترة الدراسة الجامعية عدة صداقات مع ذكور وكانوا كلهم عند ثقتي بهم\"..<br />لفت نظري هذا التعليق لأحد عينات الإستطلاع ..<br />ولم أستطع هضمه تماما لعدة أسباب :<br />1- أفضل لفظ زمالة أو أخوة .. لأن تعبير مثل صديقي وصديقتي يبدو واسعا كثيرا ..<br />2- قد يفهم من هذه الكلمات أن صاحبتها دخلت في \"صداقات\" مع الذكور بدون أن تكون هناك غاية معينة وبدون معرفة كافية بهم .. فبعد أن تكونت \"الصداقة\" .. ظهرت \"الثقة\".<br />- التلاقي بين الذكر والأنثى يقره الإسلام في حالة كونه نوع من التلاقي (الإيجابي) في جو من الإلتزام والحشمة، ولا ينبغي جره إلى مفهوم يصوره بصورة مماثلة للقاء الشاب بالشاب أو الفتاة بالفتاة ..<br />أي<br />تلاقي أو تعارف لسبب إيجابي --> ثقة بحدود --> زمالة في ظل الحشمة والإلتزام ...<br />ولا تعقيب آخر لدي ..<br />وجزاكم الله خيرا.."
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803115626/http://www.20at.com:80/article.php?sid=373"

