[[comments]]
order = 9
subject = "marmoor"
text = "ايوة يا جماعه فعلا البنات دلوقتى اصبحو اذكى من الرجاله و عشان كده الراجل اللي بيلاقي فتاه مؤدبه و محترمه و مثقفه في نفس الوقت بيخاف منها لانها هتكون اذكى منه و دة طبعا هايحسسه بالنقص و ايام الرسول عليه الصلاة والسلام كان الرجل بيحترم عقلية المرأة و كان بيشركها في المناقشات و بياخد برأيها في بعض الاوقات ياريت الرجاله اللي بيقولو ناقصات عقل و دين يفهمو الكلام ده<br />شكرا"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024155920/http://www.20at.com:80/article.php?sid=373"
