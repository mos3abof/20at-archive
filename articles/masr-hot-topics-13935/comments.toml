text = "انا فعلا بقالي مده كبيره مش بحلم ،، بس يوميها الحلم كان واضح بطريقه مستفزه تخليني اقول عليه كابوس مش حلم<br />الكابوس كان ان الجزاير حطط جون ف اول المتش ، الزفت اللي اسمو زياني ده ، واحنا كنا اللي بنلعب طوووول المتش بس جينا ف الشوط التاني معرفش ايه اللي حصل المهم كسكسنا وبقينا احنا اللي بنداااافع ، وف الدقيقة 88 حمص جاب جون من مرتده بس الحكم وهو بيشوف الجون وقع عالارض فمشفهوش وحسب الكوره تسلل!! وانا بقول ف نفسي يا ساتر حتى ده محسبهوش (شكل الحكم هيبقي زفتتتتتت)<br />وياريت جت على كده وبس لا دنا لقيت جماهير الجزاير الللي ف الاستاد (القله) حطين ايديهم ف ايدين بعض وبيلفو الاستاد كلو واحنا بنهرب منهم لبرا الستاد!!<br />يااااااارب يكون زي ما يقوقلو الحلم يجي بعكسو ونكسب 3 يااااارب"
