posted = "2009-11-09"
text = "انا مش بحلم بالماتش وانا نايم -ده كمان وانا صاحي<br />والله<br />عارف شاغل تفكيري وكل شويه اتفرج علي اجوان كاس افريقيا 2008 وكاس القارات واجوان المنتخب في التصفيات .. وبجد بيصعب عليا قوووي الاعيبه اما بيجيبوا جون ومن الفرحه بيعيطوا ودموع بتنزل والجهاز كمان بيبكي من الفرحه.<br />اما الحلم انا حلمت الحلم اللي عجبني وفاكرة انا المنخب كان بيلعب والجهاز كله واقف طول الماتش والجوهري وحسن شحاته مع بعض.<br />المهم ان الجماهير كانت مش بتشجع لا كانت بتغني ومسكتتش ولكهم بنفس واحد يارب انصرنا<br />ومصر كانت جايبه جونين والجزائر كانت بدافع بالفريق كله<br />وفي اخر دقيقتين عمرو زكي يباصي الكوره لاحمد فتحي اللي يضم لجوه ويسند لابو تريكه اللي يحطها جوه الجون علي الارض جنب القائم والجماهير كلها تبكي من الفرحه ويتعالي الدواعات يا رب يا رب لحد الماتش ما ينتهي 3/ صفر لمنتخب مصر ان شاء الله"
