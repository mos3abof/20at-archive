author = "ميدو المصرى"
posted = "2009-11-09"
text = "والله بقالى فتره بحلم بالماتش وكل مره كان ربنا بينصرنا وابو تريكه بيكون سبب فى فرحه 80 مليون مصرى<br />اكتر حلم فرحنى وبتمنه انه يحصل لانها هتكون فرحه ما بعدها فرحه<br />حلمت ان الماتش كان متنشن اوى والشوط الاول خلص 1/0 لمصر والجزائر ضيعت واحنا ضيعنا كتير<br />وفى اول الشوط التانى اخذنا بلنتى وزيدان حطها بحرفنه عليا اوى<br />والجزائريين خلاص مقتنعين بالماتش الفيصل والاستاد والع وبيرددو كلمه يارب فى نفس واحد وفى اخر دقيقه صانع الفرحه محمد ابوتريكه بيحط جول نسخه من جول الصفاقسى بس بيمينه و الاستاد بجد ولع وكل لعيبه مصر بكت من الفرحه<br />وصحيت من احلى حلم حلمته فى حياتى<br />ياااااااااااااا ااااااااااااااا ااااااارب"
