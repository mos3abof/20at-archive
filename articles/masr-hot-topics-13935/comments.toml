posted = "2009-11-09"
text = "حلمت بس بملابسات ماتش تانى خالص - بس الحمد لله وصلنا لكأس العالم<br />وده التفاصيل<br />للمرة الثالثة فى حياتى التى أعلق فيها على موضوع او منتدى أو ما شابه منذ 6 سنوات<br />ولكنى بالفعل أعجبت بالموضوع<br />غير انى - بالفعل أيضا- حلمت بالماتش<br />بس حلم من نوع تانى<br />حلمت إنى بصور فيلم اسمه (مصر تتأهل لكأس العالم )<br />فيلم وثائقى يحكى قصى يوم فى حياة جمهور كرة قدم فائز وأخر منهزم<br />ولأول مرة فى حياتى اذهب إلى الإستاد<br />بس فى هذه المرة كان ستاد خماسى فى المانيا الشرقية - وطبعا معرفش أصلاً فين ألمانيا الشرقية ولا ليه ولا إزاى"
