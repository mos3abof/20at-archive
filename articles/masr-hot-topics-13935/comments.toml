text = "انا حلمت الحلم ده من 4 ايام<br />حلمت ان زيدان كان بيجيب الجول الثانى وقبل نهاية المباراة بربع ساعة ولا تقريبًا كانت نهاية الشوط الاول مش فاكر<br />ابوتريكه حط فيهم جول مزيكا بجد ويكفى ان الحارس بتاعهم - كان الحارس الثالث- متسمر ف الارض وابوتريكه شايط الكورة وبتزغرذ وهى داخله المرمى<br />على فكره انا شفت الهدف بمنظور الكاميرا خلف المرمى !!!!!<br />يا رب نكسب"
