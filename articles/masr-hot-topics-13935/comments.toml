text = "انا حلمت خير اللهم اجعله خير<br />انا الشوط الاول هيتنهى بجون لابو تريكه فى نهاية الشوط من شوطه من ناحية اليمين عند المنطقه هتسكن المقص واننا هنكون مضيعين اجوان بالجملة فى الشوط الاول والجزائر هيكونوا مرعوبين واعصابهم بايظه …<br />انا هروح دلوقتى عشان الحق الشوط التانى باااااااااااااا ااااااى<br />انا رجعتلكم<br />فى الشوط التانى متعب هيجيب جون فى بداية الشوط من عرضية لسيد معوض والماتش هيولع ومطور لاعب الجزائر هيضرب بركات وهيطرد والماتش هيولع والمدرجات هتشتعل وهتفضل النتيجه 2/0 لنهاية الماتش لحد ما احمد حسن هيجيب جون عالمى فى اخر دقيقتين"
