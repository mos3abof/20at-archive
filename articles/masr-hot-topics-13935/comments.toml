text = "هو انا حلمى غريب شوية بس طبعا دا مجرد حلم المهم .خلينا نحكى لاعبى الجزاير نزلوا الملعب وفجأة كدا حصل دخول اسطورى لفريق مصر يعنى مثلا حسن شحاتة دخل بعجلاة حربية ابوتريكة نزل بالباراشوت واحمدحسن طلع من تحت الأرض على منصة وائل جمعة بقى كان داخل بدبابة ودارت الموقعة اللى حررفيها احمس الهكسوس وطرد الجزاير من ارض جنوب افريقيا بعد ما اجتمع مع يوسف شاهين ومحمود المليجى وقرروا يعملوا فيلم (عزبة الصفيح )ودا كان فى سنة 2500 فيلم عزبة الصفيح اتصور فى غابات سرق اسيا ب300 كاميرة سينما واتعرض على الهوا فى اول عرض سينمائى عالهوا فى تاريخ السينما العالمية وحقق 2050مليون جنية ايرادات نصيحة للجماهير ما تحولش تعمل كدا لان الفيلم دا كان بطولة مشتركة مع كل الشعب المصرى ."
