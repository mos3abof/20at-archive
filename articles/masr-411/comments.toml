subject = "اذ عرف السبب بطل العجب"
author = "babasamman"
posted = "2006-06-01"
text = "لابد وان يفهم الجميع ان الصعيد تكمن نشكلته في شده الفقر<br />اي ان الشاب قبل ان يفكر في الابداع لابد وان يفكر في لقمه العيش وبعدها ياتي الابداع ومن هنا نعرف السبب وهو ان الشباب لا يكاد يحد اقل القليل من اجل خياه متواضعه وبالتال يؤجل ابداعاته حتى يوفر لنفسه الاستقراروهو مالا يحدث ابدا<br />بالاضافه الى ان المدن الكبرى لديها تشجيع للكثير من الشباب المفكر حيث سيجدون من يقدر افكارهم ويستغل طاقاتهم بثمن بخس بدلا من دفن هذه الطاقاتفبالتالى يتم وبلا تفكير الهجره الى المدن المعموره بالاستثمار<br />نخلص من كل ماتم عرضه ان سبب فقلا الصعيد هو سلسله من كل ما فات ولا يمكن حل مشكله وترك الاخرى<br />وافضل مايمكن عمله هو فتح مجالات للشباب باكثر من طريقه كي يتم ربطهم بمدنهم وايجاد الحافز على الاستمرار وذلك عن طريق انشاء وحدات انتاجيه يتم الاعتماد فيها على ابناء الالصعيد وليس غيرهموبالتالى سيكون هذه البدايه مشجعه للكثير ومغريه بالتقليداذذانجحت وهذا ما نريد ان يتم ربط ابناء الصعيد بالصعيد حتي يتشجع الصعايده انفسهم باسثمار اموالهم داخل بلادهم بدلا من العكس<br />لان حاله الكساد التاتج عن هجره الشباب وهجره راس المال تجعل الكثيرين يفكروا الف مره قبل استثمار اموالهم داخل الصعيد خوفا من الكساد<br />واله ولى التوفيق<br />احد ابناء الصعيد"
archived = "2006-06-15"
