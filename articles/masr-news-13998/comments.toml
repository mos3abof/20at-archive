posted = "2009-11-11"
text = "زمان ايام الرئيس المرحوم عبد الناصر لم يكن هناك مشكلة فى اللحمة كان كيلو اللحمة ب 30 قرش اى نعم ثلاثون قرش صاغ مصرى<br />وايام الرئيس المرحوم انور السادات ارتفع سعر اللحم ووصل سعر الكيلو الى جنية كامل اى مائة قرش صاغ مصرى وخرجت المظاهرات فى الشوارع والجامعة تهتف يا حجازى بية سعر اللحمة وصل جنية ( حجازى كان رئيس وزراء مصر ) عبد العزيز حجازى الخبير الاقتصادى العالمى<br />وضع حجازى حلا<br />هو مزارع حكومية لتربية العجول البتلو وتسمينها وتكبيرها وبيعها<br />ونجح المشروع وثبتت اسعار اللحوم<br />انما عندما اضمحل دور الدولة وتركت الناس للمحتكرين فى الاسمنت والحديد والقمح و اللحم - انتهى كل شىء<br />المفروض ان هناك دورا للدولة<br />والا تقف الدولة دور المتفرج ولا تفكر الا فى الامن السياسى وجباية الضرايب فقط وكاننا فى امريكا<br />يا ايها السادة مصر فى افريقيا ومصر بلد فقير فى امكانياتة ولا يشابة امريكا ابدا ولا بد من دور للدولة"
archived = "2009-11-12"
