text = "كيلو اللحم فى اعلى دول العالم فى دخول الافراد بيعادل 30 جنية مصرى<br />انما كيلو اللحم فى مصر وصل 40 جنية رغم فقر الناس الشديد<br />لية ولماذا ؟<br />لان الفلاح المصرى لم يعد المربى الرئيسى لمواشى الذبح<br />اصبح المحتكرين كبار ملاك مزارع علف وتسمين العجول هم المتحكمين فى سعر اللحوم<br />الان اصبح سعر الجاموسة 8000 جنية<br />وسعر البقرة 6000 جنية<br />وعجل البقر المتوسط ب 5000 جنية<br />وطبعا مكسب الجزار وتكاليف الدكان واجور الصبيان والنقل والكهرباء والماء<br />العملية كلها احتكار<br />تقاطعوا او لا تقاطعوا مفيش فايدة لان العجول عندهم والعقول ايضا<br />حبيبى مشى حالك وربى شوية فراخ فوق السطح وادبح لك فرخة كل اسبوع وسيبك من كلام انفلونزا الطيور وتوابعة<br />واتصرف بمعرفتك يا مواطن لان مفيش احد فى الدولة هيعمل لك حاجة"
archived = "2009-11-12"
