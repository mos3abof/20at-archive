text = "انت يالجلب يلي نكك فلا داعي للمقارنه طبعا مافي اي مقارنه بين مصر ودول الخليج مصر = بلاد الدعاره<br />الخليج = عز وفخر<br />والله انا اروح لمصر وييوني البنات شسوي انا اذا بناتكم شراميط مليت من بناتكم ابي انيجك انت ككككككككككككككك شكل طيزك محترم طيز مصراوي<br />بطنىىىىىىىىىىىىىىىىىىىىىىىىىىىىىىىىىىىىى<br />يلا افصخ وراويني طيزك بقوم عيري وبنيجك فيه ككككككككككككككككككككككككككككككككككككككككككككككككككككككك<br />يلا بـرب لوول"
