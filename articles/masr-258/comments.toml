[[comments]]
order = 14
subject = "معلش يا مجدي"
author = "ربيع"
posted = "2006-05-03"
text = "اولا اعتذر لمجدي ثم لكل الموجودين من كافه المحافظات<br />ليه<br />لاني ربما قد انزل لمستوي كاتب المقال<br />عموما<br />فيه مثل شعبي بيقول<br />تعرف فلان....... اه<br />عاشرته...... لا<br />تبقي ما تعرفوش<br />المثل ينطبق علي ما هو مشهور عن المحافظات<br />انا دخلت الجيش وعاشرت ناس من اغلب محافظات مصر<br />ومع احترامي للشراقوه الا اني لم اقابل في حياتي من هو اكثر بخلا ولؤما من شخص قابلته في الجيش وكان من محافظه الشرقيه<br />وعلي النقيض لم اقابل اكرم من شاب دمياطي برضه كان معايا في الجيش<br />ولم احب شخصا في حياتي لطيبته كما احببت شاب من المنوفيه وهو الوحيد الذي ذرته في بلدته بعد الجيش<br />واخف دم ثلاثه اشخاص قابلتهم في الجيش كانوا بورسعيدي واسكندراني وصعيدي<br />لم اقصد في كلامي ان اشيد بابناء محافظه او ان انتقد ابناء محافظه<br />فالارض تببت التفاح والرمان وقد تنبت الحنظل والصبار<br />احنا ولاد البلد دي<br />وبصراحه الموضوع زباله<br />رغم ان في رد يستحق ان يكون موضوع<br />مره تانيه وتالته بحيي مجدي اليماني<br />رغم اني معرفوش"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

