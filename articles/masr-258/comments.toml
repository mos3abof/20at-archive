author = "إسمعوا يامصريين ... أنا عندي خطه لاحتلال الكويت ... نرسل لهم في الاول شوية كلاب من النوع اللولو لبث الرعب في قلوبهم ... ثم نرسل بعض الطائرات لتسقط عليهم كميات كبيره من الفيشار."
