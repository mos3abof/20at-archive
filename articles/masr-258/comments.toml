text = "محمد حسنى مبارك<br />صاحب الضربه الجويه والبريه والبحريه<br />مواليد / من زمان من قديم الازل<br />من انجازاته باع البلد وخربها ومقعدش على تلها لان ملقاش تل<br />انشاء الله يقعد على خازوق<br />كونه خليه تسمى مصاصى الدماء<br />يحرق دم امه زى ماحرق دمنا<br />مجهز له سويت خاص مع امثاله من الطغاه<br />مش فى شرم الشيخ قصدى فى جهنم ربنا يريحنا منه ومن كل من ساعده ونافقه"
