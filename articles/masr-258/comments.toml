text = "ماتيجي ياخول يانكار الجميل ... انت ليه بتنكر إن الزب المصري أحلي من الامريكاني ... ولا عشان الامريكاني شغال فيكو ليل نهار.<br />بقي بعد ما العراق تنيكك رجالتكو علي نسوانكو جاييين تتكلمو علي نسواننا ياولاد الشرموطه يامتناكين.<br />ياللا عشان واحد أمريكاني منتظرك في القاعده بتاعته عشان تفلقس ... ياللا بسرعه"
