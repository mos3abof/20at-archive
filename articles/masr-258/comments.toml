[[comments]]
order = 7
subject = "مصر فعلا اجدع ناس"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "ستظل مصر تنجب الرجال..لن تكون مصر هوليود الشرق ..لكنها مقبرة الغزاة<br />اعرف تاريخ بلدك الحقيقى<br />سيكون هذا الموضوع سجل لشرفاء كنانة الله فى الارض<br />لا تنسو انكم خير جند الارض..وليس هؤلاء اشباه الرجال<br />(ادخلو مصر إن شاء الله امنين)<br />التاسع من مارس هو يوم الشهيد الذي أعلنته السلطات المصرية منذ عام 1969 تخليداً لذكرى رحيل رئيس أركان حرب الجيش المصري عبد المنعم رياض.<br />فبعد نكسة يونيو 1967 أعلن الرئيس الراحل جمال عبد الناصر 8 مارس بدء حرب الاستنزاف ضد العدو الإسرائيلي، إلا أن القدر شاء أن يستشهد عبد المنعم رياض في 9 مارس أي بعد يوم واحد من بدء حرب الاستنزاف، وسط 35 من الجنود والضباط وهم يقومون بواجبهم الوطني القومي على الضفة الغربية لقناة السويس.<br />نزار قباني<br />عبد المنعم رياض<br />في ذكرى رئيس الأركان المصري الذي استشهد على جبهة القتال في السويس 1969<br />لو يُقتَلونَ مثلما قُتلتْ..<br />لو يعرفونَ أن يموتوا.. مثلما فعلتْ<br />لو مدمنو الكلامِ في بلادنا<br />قد بذلوا نصفَ الذي بذلتْ<br />لو أنهم من خلفِ طاولاتهمْ<br />قد خرجوا.. كما خرجتَ أنتْ..<br />واحترقوا في لهبِ المجدِ، كما احترقتْ<br />لم يسقطِ المسيحُ مذبوحاً على ترابِ الناصرهْ<br />ولا استُبيحتْ تغلبٌ<br />وانكسرَ المناذرهْ…<br />لو قرأوا – يا سيّدي القائدَ – ما كتبتْ<br />لكنَّ من عرفتهمْ..<br />ظلّوا على الحالِ الذي عرفتْ..<br />يدخّنون، يسكرونَ، يقتلونَ الوقتْ<br />ويطعمونَ الشعبَ أوراقَ البلاغاتِ كما علِمتْ<br />وبعضهمْ.. يغوصُ في وحولهِ..<br />وبعضهمْ..<br />يغصُّ في بترولهِ..<br />وبعضهمْ..<br />قد أغلقَ البابَ على حريمهِ..<br />ومنتهى نضالهِ..<br />جاريةٌ في التختْ..<br />يا أشرفَ القتلى، على أجفاننا أزهرتْ<br />الخطوةُ الأولى إلى تحريرنا.<br />اقرأ بقية التعليق .."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
order = 8
subject = "اللى يقرا يقرا واللى ما يققراش 0000000000المهم انى ريحت ضميرى"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "شارون ثعبان خلي بالك منه رد عليه.. وأنا رفاعي (الفرقة 39)<br />إبراهيم الرفاعى (اسطورة العمليات الخاصة)<br />إبراهيم الرفاعى عبد الوهاب لبيب، من مواليد 1931- العباسية-القاهرة. قائد سلاح العمليات الخاصة في حرب أكتوبر 1973. قائد المجموعة 39 الشهيرة بأداء العمليات الانتحارية. قام بتنفيذ 72 عملية انتحارية خلف خطوط العدو من بين 67، 1973. قام بتدمير معبر الجيش الاسرائيلي على القناة الدفرسوار. حصل على 12 وساما تقديريا لشجعانه. استشهد في حرب أكتوبر فكان استشهاده أروع خاتمه لبطل عظيم<br />بساله وشجاعه المجموعه 39قتال للاسف لم تجمع حتي اليوم نظرا لانتساب جميع افرادها للمخابرات وطبقا لمبدأ حمايه هوياتهم لم يتم نشر موسع لعملياتهم ..<br />وقد يكون مااعلمه عنهم ضحلا للغايه ولايذكر.. فهم الذين قامو صباح استشهاد الفريق عبد المنعم رياض بعبور القناة واحتلال موقع المعدية رقم 6 الذي اطلقت منه القذائف التي تسببت في استشهاد الفريق رياض واباده 44 عنصر اسرائيلي كانو داخله بقيادة الشهيد ابراهيم الرفاعي الذي كانت اوامره هي القتال باستخدام السونكي فقط<br />وكانت النتيجه ان اسرائيل تقدمت باحتجاج لمجلس الامن في 9مارس 69 ان قتلاها (تم تمزيق جثثهم بوحشية)<br />كما ان المجموعه 39 قتال هي صاحبه الفضل في اسر اول اسير اسرائيلي في عام 1968 عندما قامت اثناء تنفيذ احد عملياتها باسر الملازم الاسرائيلي داني شمعون بطل الجيش الاسرائيلي في المصارعة والعودة به للقاهرة دون خدش واحد<br />وكانو اول من رفع العلم المصري في حرب الاستنزاف علي القطاع المحتل حيث بقي العلم المصري مرفرفا ثلاثه اشهر فوق حطام موقع المعدية رقم 6<br />وفي 22 مارس 69 قام احد افراد المجموعه القناص مجند احمد نوار برصد هليوكوبتر عسكريه تحاول الهبوط قرب الموقع وب<br />اقرأ بقية التعليق .."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
order = 9
subject = "لى الاخ المحرر اتعلموا بقى احنا مش ناقصين احباط"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "رجال من بلدى<br />أغلى الرجال يسجلون أروع البطولات<br />(( 1 ))<br />الرقيب / محمد حسين محمود سعد<br />أول شهيد مصري فى حرب اكتوبر حسب إشارات التبليغ من الوحدات الفرعية ويوميات القتال لدى قادة الوحدات الفرعية المتقدمة هو الرقيب ( محمد حسين محمود سعد )<br />** ولد عام 1946م ودرس فى معهد قويسنا الدينى<br />وعين بعد التخرج باحثا اجتماعيا بوحدة طوخ بالقليوبية<br />** انضم إلى القوات المسلحة عام 1968 م كجندي استطلاع خلال السنوات السابقة على حرب اكتوبر .. وعندما جاءت لحظة العبور كان ضمن قوات الجيش الثالث التي نزلت إلى سيناء<br />وكان يوم استشهاده هو يوم العبور ذاته 6 اكتوبر 1973 م<br />** كان أول شهيد فى أعظم معارك الشرف والفداء<br />(( 2 ))<br />اللواء / شفيق مترى سدراك<br />وأول شهيد من الضباط هو اللواء ( شفيق مترى سدراك )<br />الذي كان اسمه أول الحاصلين من الضباط على وسام نجمة سيناء عندما قلد الرئيس السادات أبطال القوات المسلحة الشهداء والأحياء أوسمة النصر فى مجلس الشعب يوم 19 فبراير 1974 م<br />** ولد فى عام 1921 م بقرية المطيعة مركز أسيوط الأب كان يعمل مدرس ثانوى والابن الطموح قضى عامين فى كلية التجارة ولكنه اختار ف النهاية أن يلتحق بالكلية الحربية ليتخرج منها عام 1948م مقاتلا بسلاح المشاة وخدم فى السودان مرتين خلال حياته العسكرية<br />** اظهر ( شفيق مترى ) تفوقا ملحوظاً لدرجة انه كان من الضباط القلائل الذين حصلوا على شهادة أركان حرب وهو برتبة رائد ، واختير للعمل كمدرس لمادة التكتيك بالكلية الحربية ، ثم أصبح كبيراً للمعلمين بها .<br />** خاض معارك مصر قبل 1973م فاشترك فى حرب 1956م وفى حرب 1967م كان ( شفيق مترى ) قائدا لكتيبة مشاة حاربت فى منطقة أبى عجيلة وكبد العدو خسائر كبيرة ، وحصل على ترقية استثنائية بسبب هذه المعركة"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

