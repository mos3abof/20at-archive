[[comments]]
order = 23
subject = "منوفي متعالج (اسكندنافي)"
author = "معاذ السيد الصاويwww.assawe.com"
posted = "2006-05-08"
text = "أكبر دليل على ان المنوفي راجل كباره وبيعمل السنة انه أخرج الذبابة من كوب العصير وشربه عملاً بقول النبي صلى الله عليه وسلم ((إذا سقط الذباب في إناء احدكم فليغمسه ثم ليشرب فإن في أحد جناحيه الداء وفي الآخر الدواء)) أو كما قال المصطفى صلى الله عليه وسلم أما حدوتة بخل المنايفة فأنا لا أؤمن بها مع أني ولدت في الإسكندرية وتربيت في الإمارات إلا أن أبي ولد في المنوفية لأبوين منوفيين ولم ألحظ في يوم أنه بخيل مع أي كان كما أنه كان يخبرني أن أمه كانت تكسر الخبز الصابح لما يأتيهم ضيوف فيغضب منها فتقول له إنت مش فاهم حاجة الضيف لما يشوف العيش سليم حينتبه لمقدار الأكل اللي بياكله لكن لما يكون العيش مكسر حياكل لحد ما يشبع.رحم الله جدتي المنوفية."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
order = 24
subject = "لبنان لبست ثوب الفرح"
author = "sara from alexandria"
posted = "2006-05-11"
text = "يا جماعة عيب انى انتوا اتكلمتوا كدة على لبنان بعدين لازم تحرموا رأيها لانى اللى ما يعرفش يقول عتس هى رأيها كدة فى المصريين لاكن رأيها غلط لانى احنا عندنا عقل والحمدلله بدليل زويل والباردعى ونجيب محفوظ والادباء زى يوسف أدريس والسباعى ومن الاصوات العظيمة ام كلثوم العندليب الاسمر عبدالوهاب بعدين عيب تردوا عليها كدةو بعدين فى أدب حوار ومناقشةولما انتوا ردتوا عليها كدة شوهتوا صورة المصريين فى ّذهنهااكتر ما هى متشوهة يا ريت نتعلم اداب الحوار بعدين احنا المصريين مش هنرد عليكى لاننا ناس بتعرف الاصول بس انا مش قصدى انك قليلة الاصل لا طبعا بس من عادة المصريين انهم يحترموا اراء الناس التانية بس العادة دى بقت فى ناس قليلة جدا والرسول قال صلى الله عليه وسلم:انى احنا منردش السوء بالسوء لا بل نرد السوء بالمحبة والتسامح وشكرا وارجو انك تصلحى فكرتك عن المصريين التى ذكرت فى القرأن وبالنسنة للموضوع هو جميل جدا بس مش شرط انى تكون كل محافظة مشهورة بحاجةلانى فى اى مكان هتلاقى البخيل والكريم والغبى والذكى واللى دمه خفيف واللى تقيلمش شرط يعدين احنا فى النهاية مصريين وعايزة اقول انى طول عمر مصر وبلاد الشام اخوات"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

