text = "يااااااااااحكومة مصر ... إستغلوا مواردنا البشريه ... كفايه ... كفايه البقر والحيوانات زي الكوايته يكلمونا بالشكل ده ... تاريخ الفراخ والفطريات والبكتيريا أصبح يتجرأ علي مصر ...<br />كس أمك ياكويتي ........... يابن إلمتناكه"
