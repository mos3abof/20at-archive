author = "مصري وابن مصري"
posted = "2006-06-19"
text = "نسيت اقول :<br />انا مش عارف تبقي البنانيه عندها 50 و 40 سنه ةترةح للدكاتره عشان يطبطوها وتعمل عمليات تجميل (تضييق لكسها وكده يعني انتو عارفين بقي )<br />ولاد الزانيه ما شبعوش عيزين وهما خلاص هيموتوا كمان عالم بنت زانيه والله العظيم اه واللي عمال يقول ربنا يلعن مصر دا واحد ابن مفقوعه لأن ربنا ذكر مصر ف القرءان ومـ لعنهاش<br />كل اللي هقوله ربنا يستر بقي"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

