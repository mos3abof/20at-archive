subject = "تحية الى شعب مصر الشقيق"
author = "دعاء"
posted = "2006-11-11"
text = "السلام عليكم انا دعاء من المغرب . لماذا تردون ايها المصريون على هذه الاهانات وهذا الكلام الماسخ الذي لا يقوله الى الكافر مصر من احسن الشعوب واقول للكويتي احمل هذا الكره الى اليهود الصهاينة وليس لشعب عربي وخصوصا شعب مصر مصر اخلاق و تربية وتحية الى كل الشرفاء العرب وخصوصا شعب مصر الذي احترمه كثيرا والسلام عليكم"
