text = "معلش يا لكويتى يالجلب انا عارف انى كلامى صعب عليك عشان كدة مو مفهوم انا هاحاول اكلمك كلام سهل عشان انا عارف ان الكاويتة اغبية مو بيفهمو شى<br />انت روح شوف الامارات و شوف اسيادكم بالامارات دول حق احسن دولة فى الخليج و انتوا دولة معفنة تعالى عندنا شوف دبى اسياد الخليج و انا مصرى عندى جنسية اماراتى يا كويتى يا جربان يا مديون و الشعب المصرى كله اسيادك يا خول.<br />تعيش مصر تعيش الامارات كس ام الكويت"
