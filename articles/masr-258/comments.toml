[[comments]]
order = 11
subject = "بلاش تفاهه"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "العقيد/ إبراهيم عبد التواب<br />**فى الساعة الرابعة والنصف يوم السبت 6اكتوبر 1973م وخلال نصف ساعة نجح العقيد ( إبراهيم عبد التواب ) ورجاله من مشاة الأسطول فى اجتياز البحيرات المرة لاقتحام نقطة كبريت (وهى قرية تقع شرق البحيرات)<br />** منذ يوم 16اكتوبر وبداية التسلل الاسرائيلى فيما عرف بعد ذلك بالثغرة أصبحت نقطة كبريت مركزاً لهجمات شرسة من إسرائيل لمحاولة استعادتها وقد ساهم (إبراهيم عبد التواب) وزميله (محمد أمين مقلد) فى قيادة ملحمة الصمود داخل النقطة رغم القصف الجوى والمدفعي العنيف .<br />** ليلة 23اكتوبر استشهد( محمد أمين مقلد) وأصبح منذ تلك اللحظة (العقيد إبراهيم عبد التواب) قائداً للنقطة التي دمرت القنابل جزء كبير منها .<br />** فى يوم 14يناير 1974م حرك العدو عرباته المدرعة فى اتجاه الموقع ووقف القائد المصري عند الحد الامامى للموقع وهو يوجه المدفعية بنفسه أطلق العدو دانة مدفع استقرت إحدى شظاياها فى جسد( إبراهيم عبد التواب) ... ليحيا شهيداً."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
order = 12
subject = "انت ابن مين فى مصر 00جتكوا نيلا مليتو البلد"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "هما دول المصرين يا بتاع النكت البايخه والمواضيع المعفنه واتمنى من الله انك تعقل شويا وتبطل هيافه ولا اقولك روح اعمل موضوع عن المانكير والباديكير اهو هتلاقى حد يقولك برافو لكن احنا هنا عايز دافع للامام مش عايزين نضحك على بعض ونقول نكت كفايه بقى شبعنا نكت وسخرة فى بعض ولا مكتوب علينا نقول كفايه برا وجوا ارحمونا لله"
archived = "2006-06-25"
