[[comments]]
order = 49
subject = "بص ياواد ياكويتي"
author = "بص ياواد ياكويتي يامتخلف"
posted = "2006-05-25"
text = "مصر ستك وتاج راج راسك....تعرف ليه؟<br />علشان هي اللي علمت امثالك وخليتك بني ادم بعد ماكنت بتمشي حافي اتعلمت ازاي تلبس جزمة ياجزمة<br />تعرف المصريين بيجيوا بلدكم علشان يشتغلوا ويعرقوا وتبقي لقمتهم من عرق جبينهم حتي لو كان عرقهم ريحته وحشة<br />لكن انتم بتعرقوا في شارع الهرم يا اوساخ<br />انتم تتركوا نسوانكم يرحوا لندن يعملوا ما بدا لهم وانتم تلفوا علي بلاد الله تتصرمحوا<br />وبعدين تقولي مصر والعدوان الثلاثي اللي خرج بعد 3 ساعات<br />طيب ده لولا ربنا ثم مصر كان ولا واحد فيكم<br />قاعد في الكويت كان زمانكم مشردين يا اجبن خلق الله مصر دافعت عنكم بخير اجناد الارض يا ناكر الخير<br />الخير مش شوية فلوس ولا شوية بترول وجاز<br />الله يزيده عندكم لحد ما يولع فيك<br />سلام يا مراهق"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

