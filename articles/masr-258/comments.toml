subject = "المصارية اوساخ"
author = "سعودي ولي الفخر"
posted = "2006-11-11"
text = "اقووول المصريين الاوساخ هم الي بدءو يغلطون علينا وعلى اهل الكويت الاعزاء.<br />وانا متأكد ان المصاروه مقهورين لان حنا واهل الكويت الحبيبه يد واحده .<br />ووالله الي يغلط على الكويت الحبيبه ندوسه حنا السعوديين بنعالنا .<br />ونعم والله بأهل الكويت الحبيبه وسبع انعام والله<br />وموتو بغيظكم يامصاروه يا حوش.<br />سلاموووووووو"
archived = "2006-12-18"
