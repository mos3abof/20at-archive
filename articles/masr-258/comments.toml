[[comments]]
order = 69
subject = "بقي كده يا (كويتي )عرب دا لو كنت كويتي"
author = "مصري وابن مصري"
posted = "2006-06-19"
text = "ليه بس يا كويتي تشتم اخواتك العرب يا عم احنا عارفين انك غني وبتتفاخر انك بزني ف مصر ويمكن اللي بتزني معاهم يكونوا اخواتك بس ابقي اسألهم بس ..<br />وبعدين انت غني دلوقتي لكن ف الاخره هتعمل ايه بتفاخرك بالزنا دا يا بن الكلب يا جاهل الدين وناكر العروبه وانت اكيد مش عربي خالص لأنك لو كنت عربي يبقي خلاص العرب مش هيتحدوا تاني خالص<br />وعامل تقول بزني وبعمل يا بن الكلب شوف امك واخواتك المزز فين دلوقتي واسأل نفسك قبل ما تشتم تبقي تشوف نفسك يا ابن الواطي واذا كان المصريين بيجوا عندكوا يشتغلوا فهما بيشتغلوا بالصبح ويظبطوا اخوتك وامك باليل<br />ههههههههههههههههه<br />يلا معلش يا شباب انا هزقت الواد دا اوي<br />يلا بقي يا روح امك روح بلدك وشوف امك فين ومتنساش تقول والا هخلي اخواني المصريين ما يظبطوهاش"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
order = 70
