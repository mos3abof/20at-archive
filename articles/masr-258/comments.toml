[[comments]]
order = 33
subject = "ايوه اجدع ناس"
author = "احمد المصرى"
posted = "2006-05-17"
text = "انا معاك مجدى<br />وانا ايضا ضدك يامصرويه<br />لما نجى نتكلم عن شىء نريد اصلاحه<br />يبقى شىء مهم اذاى<br />يعنى عيويب الصناعه فى مصر عيوب الجوده<br />فى المنتج دى العيوب الى نتكلم عنها<br />فاهمنى يا مصرويه<br />انتقد مجدى الكاتب ولاكن بطريقه معقوله<br />وانتى انتقدتى مجدى ولاكن بطريقه غير معقوله حتى<br />لماذ ننتقد بعضنا البعض<br />من اجل الاصلاح اذاكان من اجل الاصلاح اذا<br />يكون فى الصالح فقد وهو ما لدينا من عيوب اذا اصلاحناه اصلاحت البلد<br />مش نقعد نتكلم عن اشياء تافه<br />ونقول اصل دى عيوب فى الشعب<br />اذا كان كيده يبقى الفتاة البنانيه<br />التى انتقدات مصر بكلمتها الغبيه هذه على حق نحنو بلا عقولفى النهايه ارسل تحياتى لمن يتكلم باحترام ومن لم يتكلم كذالك فلا داعى لرائيه لانه بلا قيمه"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
order = 34
subject = "لبنان دى اية تاريخها علشان تتكلم على دولة عظيمة زى مصر"
author = "safa iam male"
posted = "2006-05-20"
text = "افهموا يا عرب انتوا من غير مصر متسوش حاجة قولولى ونبى لو اتنين عساكر من اسرائيل دخلوا لبنان دى يعملوا فيها اية؟؟؟ طبعا يحتلوها فى ثوانى وبعدين ارض الكنانة ارض التاريخ ارض العروبة وارض الاسلام وارض الادب والزوق والزكاء وكل شئ حلو وجمييل فى الدنيا كلها مصر ارض المصريين انضف ناس فى الكون مش تقولى شوية عرب مهابيل مصر هية اللى بتحميكوا ودى الحقيقة مصر هية الكبيرة ومصر هية العظيمة وباذن الله حنرجع تانى لبدايتنا اقوى ناس على الارض اذا مكناش اصلا دلوقتى اقوى ناس فعلا ابقوا اعقلوا كلامكم باذات لو جت سيرة مصر"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
order = 35
subject = "انتبهوا ايها السادة"
author = "يارا"
posted = "2006-05-21"
text = "انتبهوا ايه السادة<br />هذه هي بداية الشراراة......موضوع يفرق اهل البلد الواحد....وكل واحد يدخل يافع عن محافظته ويسب في المحافظة التانية<br />انا من الاسكندرية..احسن ناس ووقت الجد جد<br />ووقت الهزار هزار<br />احنا خرج من عندنا مشاهير مصر بل العالم كله.....وال 26 محافظة كلهم اهل خير من مرسي مطروح والسلوم الي جنوب سيناء<br />بتجمعنا ارض واحدة وسماء واحدة<br />ولو سالتك انت ايه؟؟؟؟؟؟؟<br />قولي مصري وابن مصري...وكل مصري الله عليه<br />قولها باعلي صوت وارفع راسك لوفوق<br />انا مصري وابويا مصري بسماري ولوني مصري<br />وكل مصري الله عليه"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
order = 36
subject = "مصر بلد الحراميه"
author = "كس ام مصر وشعب مصر شعب الدعاره والحراميه والمنافقين والكلاب اوصخ شعب على الارض"
posted = "2006-05-22"
text = "للبيع مصريه شريفه لم يدخل في طيزها سوى الف زب وهذه اشرف مصريه بالنسبه للمصريين الكلاب وقد تم رفع المزاد ووصل 20 جنيه وهذه اغلى مصريه من يشتري يا شباب<br />مطلوب مصري يكون حارس للكلب بتاعي بس يكون المصري ريحته نظيفه عشان الكلب بيقرف من ريحة المصريين العفنه الزباله<br />يعيش العدوان الثلاثي الذي دمر المصريين وناك المصريات وجعل كس المراه المصريه 20 متر كم اتمنى لو كنت مع جيش العدوان الثلاثي لكي انيك المصريات وافك بكارتهم"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
order = 37
subject = "فين المشرف"
author = "ابن بلد"
posted = "2006-05-23"
text = "صباح الخير يا جماعــــه<br />انا بقرا المقال وشفت التلعيق ده<br />كس ام مصر وشعب مصر شعب الدعاره والحراميه والمنافقين والكلاب اوصخ شعب على الارض<br />للبيع مصريه شريفه لم يدخل في طيزها سوى الف زب وهذه اشرف مصريه بالنسبه للمصريين الكلاب وقد تم رفع المزاد ووصل 20 جنيه وهذه اغلى مصريه من يشتري يا شباب<br />مطلوب مصري يكون حارس للكلب بتاعي بس يكون المصري ريحته نظيفه عشان الكلب بيقرف من ريحة المصريين العفنه الزباله<br />يعيش العدوان الثلاثي الذي دمر المصريين وناك المصريات وجعل كس المراه المصريه 20 متر كم اتمنى لو كنت مع جيش العدوان الثلاثي لكي انيك المصريات وافك بكارتهم<br />___________________________________<br />انا للاسف نقلته كله علشان المشرف يشــوف<br />ويا ريت الاخــوه في عشرينــات يخلو بالهم من خاصيت التصويت لانها بتشــوه منظر الموقع ككل وبتفقده احترامه وعشرينات غالي عليا عايزه علي طول اجمل موقع<br />ههههههههههه والاخ اليي بيشتم ده ضحكني والله هههههه وبقولك ايه يا كــابتن متقولنا سعادتك منين<br />ولا تتكسف تقول ؟؟؟؟؟؟؟"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
order = 38
subject = "أنا كويتي"
author = "صباح الصباح"
posted = "2006-05-24"
text = "بتشتموا الكوايتة ليه يا مصريين، هو احنا عشان اتحايلنا عليكوا عشان تدافعوا عنا تقوموا تعملوا فينا كدة؟ هو احنا عشان كسكسنا قدام صدام ورحنا بوسنا جزمة أمريكا تعملوا فينا كدة؟ هو احنا عشان مفيناش رجالة وخلينا صدام يحتلنا في 6 ساعات تقوموا تعملوا فينا كدة؟ هو احنا عشان حاسين بالدونية ومجرد أشولة فلوس ووستاتنا بيتعروا في أوروبا والقاهرة، ليه بس كدة؟ بصراحة احنا غلطانين عشان معندناش نخوة ولا رجولة ولا جيش ولا شعب ولا أرض أساسا، احنا عبارة عن تفة ممكن شوية شباب من شبرا يمسحوها بالجزمة، احنا إللي سيبنا بلدنا تحتل وهربنا بالمرسيدس، احنا إللي أمريكا أعلنت إننا من حلفائها، احنا إللي حفرنا الباطن وياريت نندفن فيه"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
order = 39
subject = "نعمة الاسلام"
author = "ابن النيل"
posted = "2006-05-24"
text = "إخواني إن سبب تخلفنا الاول هو تعصبنا الاعمى في كل شىء ، فكفانا ما حدث لنا من مصائب و أنتكاسات وعلو قامة الاعداء وضياع بلاداً كانت بأيدينا من أجل عصيتنا العمياء فضياع الاندلس خير مثال،فتعالوا نترك عصبيتنا جنباًونتحد عربا ومسلمين لنواجه أعدائنا قبل أن يقتحموا بيوتنا ويهدموها علينا وكل شعب منا لايزال يشغله أنه أفضل الشعوب العربية وكيف يثبت ذلك لاخوته.<br />إخواني قولوا الحمد لله على على نعمة الاسلامفهي خير ما أكرمنا به الله وكفى بالله حسيب ."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

