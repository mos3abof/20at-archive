[[comments]]
order = 81
subject = "فلا داعى للمقارنة"
author = "مصرى"
posted = "2006-07-05"
text = "عرفت مدى كره العرب لمصر اثناء فترة عملى بالخليج و الان ارى صورة عنيفة من صور التبجح و التطاول على بلد ذكرت بالقران و اوصى بها رسول الله صلى عليه و سلم فى حجة الوداع، و اكتب الان من لندن حيث اعمل استاذا للقاون بجامعة كوين مارى. و سأرد على من يحاول ان يقلل من شأن مصر بحقائق.<br />ذكر احد الخليجيين اننا نعمل عندهم كاكلاب على حد تعبيره و اقول له ها انا مصرى و عملت قاضيا بالخليج و كانت نسبة القضاة المصريين وقتها اكثر من 80% أى اننا كنا و مازلنا نحكم بلادكم ايها المتغطرس المريض المتباهى بثروات منحها الله اياكم لولاها لظللتم بدو و رعاه للغنم تسكنون الصحراء حفاة الاقدام، لن اتكلم عن مصر و تاريخها و علمها و ادبها و فنها و لن اتفاخر بالاهرام و ام كلثوم و نجيب محفوظ و زويل و انما سأذكر حقائق حالية و ليست مجرد ذاكرة تاريخية، هل تعلمون يا امة العرب ان احسن اطباء بالنمسا هم المصريون؟ هل تعلمون ان جامعة لندن اختارت مصرى ليكون صاحب افضل بحث للدكتوراة فى القانون الدولى؟ هل تعلمون ان موسوعة (من هو) الامريكية اختارت الدكتور ابو العينين ليلقب بلقب ابو التحكيم التجارى بالعالم؟ اين انتم من كل هذا؟ اى شاب خليجى يأمل ان ينهي مرحلة التعليم الاعدادية بنجاح حتى يتقدم للعمل بالجيش أو الشرطة!!! اقصى امال الشاب السعودى (الترقيم) و لن أذكر معناها لأنهم يعرفونه جيدا. يتباهى الكويتيون دائما بأموالهم و لم نري اغنى اغنياء انجلترا الملياردير المصرى محمد الفايد يفعل ذلك من قبل!!!! و السؤال الان اين تذهب ثرواتكم البترولية؟ تذهب للغرب ليتركوا لكم الفتات حتى تشبعوا رغباتكم الاستهلاكية السطحية ايها الاغبياء. يقول احد الجهلاء الكويتيون ان اغنى مصرى يتقاضى راتب شهرى 100 دولار اسمح لى ايها الجاهل الكويتى ان اتكلم معك بلغة<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010754/http://masr.20at.com:80/article.php?sid=258"

