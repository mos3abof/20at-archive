[[comments]]
order = 112
subject = "هذا موضوع عن مصر شو دخل الخليجين"
author = "انا استغرب بصراحه"
posted = "2006-11-24"
text = "من مشاركة الخليجين والسب المتبادل بينهم<br />الحين شو دخل الكويتي اللي يقول انه كويتي في الموضوع وداخل يسب ,,,والله انك بينت لنا صورة خايسه عن العقل الكويتي ,,واهل الكويت بريئين من كلامك<br />شو دخل الشيخ زايد الله يرحمه في الموضوع<br />والله ان عبدالله بالخير اللي بعد سبيته اريل منك<br />هذا جزاء الاحسان؟؟ انته شكلك ماكنت مولود ايام حرب الخليج ولا جان ما سبيت وعضيت الايد اللي مدت لكم,,, والشيخ زايد الله يرحمه مب انته اللي تسبه وتشتمه وحتى لو سبيته ما بينقص منه شي الا انته اللي بتزيد سيئاتك وهو بتزيد حسناته وباقولك شي هو عمك وتاج راسك<br />نحنا ما ننكر فضل حد علينا من بعد الله<br />ومصر والمصرين نكن لهم كل الاحترام<br />ولكن هالموضوع خاص فيهم هم انشاء الله يسبون بعض انته شو دخلك عرض؟؟<br />ابغي اعرف ليش كل هالكره والحقد<br />ليش نحنا نضحك اليهود فيها ونبين لهم كيف العرب والمسلمين يكرهون بعض؟؟؟؟<br />واعتذر لاخواننا المصرين والكويتين اللي اكن لهم كل معزه عن هالكلام<br />بس ماهان علي ان واحد محشش مثل اللي يقول انه كويتي يدخل في الموضوع ويبداء يفرق مابين اهل الخليج ومصر"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218221808/http://masr.20at.com:80/article.php?sid=258&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 113
subject = "الى السيد القاضي"
author = "فايز العتيبي من الكويت"
posted = "2006-11-27"
text = "لا أستغرب من الشتائم المتبادلة بين رواد الانترنت فنحن لا نعرف من يكتب من خلف الشاشة فقد يكون يهودي يسعى لإشعال الفتن وقد يكون طفل أو مراهق يستمتع بالردود حتى ولو كانت شتائم وقد يكون سفيه ناقص العقل...بإمكانكم المرور على مواقع الحوار المختلفة لتجدوا مختلف انواع السباب بين أبناء الدول العربية بل وبين أبناء الوطن الواحد أيضا...بمعنى أن الأمر لا يختص بمصر فقط..ما أثار دهشتي هو رد القاضي المصري !!! وأود أن أطرح عليه بعض الأسئلة التي أرجو أن يتسع لها صدره :<br />كيف سمحتك لنفسك أن تنزل الى مستوى صاحب المداخلات الخارجة ؟<br />ألم يخطر ببالك أن صاحب الردود قد يكون طفلا في عمر أبناءك أو أحفادك ؟<br />هل الترقيم وهو ما أشرت اليه فيه ردك مقتصر على شباب دولة واحدة أم هو موجود في كل بلدان الدنيا ؟<br />هل من طبيعتك أن ( تسخن ) بسرعة وتتصرف بدافع العاطفة وليس العقل والمنطق ؟<br />خاصة وأنت تعمل قاض وبإمكانك تغيير حياة المتهمين لسنين طويلة .<br />الإخوة المصريين الكرام كلنا إخوة يجمعنا الإسلام أولا ثم العروبة..أرجو منكم عدم الرد على المعتوه الدي يزعم أنه كويتي رغم أن كثير من المفردات التي كتبها لا تستخدم في الكويت نهائيا...لا أقصد أنه لا يوجد أمثاله في الكويت فلسنا ملائكة ولسنا شياطين أيضا بل منا الصالحون ومنا دون دلك."
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218221808/http://masr.20at.com:80/article.php?sid=258&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

