text = "برافو عليك يا محمود الموضوع بجد حلو جدا ويحتاج لوقفة منا احنا لية محافظاتنا بتشتم بعض ولية بنتخانق على حاجات هايفة.<br />والغبي بس هو اللي مش يفهم الموضوع ده بيقول اية انا اعتقد ان كاتب المقال يقصد ااننا نبص لنفسنا ونطلع عيوبنا الاول قبل ما نعمل اي حاجة ونعرف اصل وفصل كل حاجة فينا الاول<br />وشكرا وانتوا يا ولاد البلد دماغكم عالية جدا احسن موقع شبابي شوفته"
