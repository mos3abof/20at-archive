[[comments]]
order = 47
subject = "ياكوايته ياولاد ال"
author = "أحب أضيف لتعليقي السابق ..."
posted = "2006-05-24"
text = "المصريين كانو معارضين للهجوم العراقي ...المصريين كانو معارضين إحتلال الكويت ... المصريين كانو معارضين إن العراق ينيكو نسوانكو ... وإن رجالتكو تهرب زي الفراخ وتسيبو نسوانكو يتناكو... حتي النسوان إللي هربو معاكو را حو يتناكو في كل حته في الدنيا.<br />المصريين كانو بيبوسو إيد صدام إنه ينسحب من الكويت ... المصريين أرسلو قوات عسكريه لأراضيكم في مهمات خاصه لتحمي المنايك الكوايته.<br />كل ده مش عاجبكم ياولاد الشرموطه<br />وبعدين تقولو بفلوسنا !!! ...<br />ياكلااااااااب .... فعلا ... بقر و فراخ وبكتيريا"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

