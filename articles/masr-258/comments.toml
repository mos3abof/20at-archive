subject = "اكيد اجدع ناس"
author = "احمد المصرى"
posted = "2006-05-15"
text = "استاذى الفاضل محمود<br />انت تتكلم عن عيوب الشعب المصرى<br />وناسيت ان كل شعب فى الدنيا له مميزات وعيوب<br />وانا الشعب المصرى من هذا العالم<br />وايضا له مميزات وعيوب<br />ولاكن عندما تقارنه بائى شعب فصدقنى<br />هما اجدع ناس واحسن شعب<br />الم يكفينا فخرا عند الشده نتحد<br />وننسا عدائتنا القديمه من<br />اجل ان نرفع رايه واحده وهيه رايت مصر<br />ام الدنيا ّّّ!سيدى الفاضل احنا مصرين واحنا<br />اجدع ناس هيه دى الحقيقه"
