[[comments]]
order = 51
subject = "ياكوايته ياولاد الحثاله"
author = "انت مش فاهم حاجه ياكس أمك. ألغباء متوارث ياولاد الزانيه."
posted = "2006-05-27"
text = "العدوان الثلاثي سنة1956 ماكانش فيه كويت كانت ومازالت تفه أو شخه علي الخريطه. كانت أمك بتطبخ في الرمل....<br />إنتوا حررتو مصر؟! هاهاهاهاهاهاها ... أضحكتني يابن ألشرموطهز أنا مش قلتلك قبل كده يافراخ ياأرانب العراق ناكتكو إزاي ولا أعيد القصه تاني؟ نعيد تاني.<br />المصريين كانو معارضين إن العراق ينيكو نسوانكو ... وإن رجالتكو تهرب زي الفراخ وتسيبو نسوانكو يتناكو... حتي النسوان إللي هربو معاكو را حو يتناكو في كل حته في الدنيا.<br />المصريين كانو بيبوسو إيد صدام إنه ينسحب من الكويت ... المصريين أرسلو قوات عسكريه لأراضيكم في مهمات خاصه لتحمي المنايك الكوايته.<br />كل ده مش عاجبكم ياولاد الشرموطه<br />واحب أقوللك تاني ... إنتو ماكنتوش ع الخريطه خالص ... إنتوا طلعتوا زي الدود.<br />إنتوا حررتوا مصر!!! هاهاهاهاهاهاهاهاييي<br />اه اه ... إفتكرت ... مش إنتوا اللي فوزتوا في الحرب العالميه الأولي والثانيه؟؟ اه اه وكمان أرسلتوا قوات بقيادة العميد صبيح الصبوح المصباح المصبح لعبد الناصر عشان يحرر مصر من الإنجليز.... هاهاهاهاها... ياهاي.<br />ياولاد الوسخه ياكوايته ... صدق المثل \"عريان الطيظ و يتأمز تأميز"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
