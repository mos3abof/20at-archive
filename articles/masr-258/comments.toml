[[comments]]
order = 101
subject = "مصر الاسلام والجهاد"
author = "ابن الاسلام"
posted = "2006-10-16"
text = "اكاد اجزم ان الشخص الذى يدعى خليجته وقام بكيل السباب القذر لمصر وشعبها الكريم لا خرج عن اثنين<br />اما وان بكون يهودى او شيعى وكلهم اقذر من بعضهم البعض ولا تمثل شتائمه المسعورة القذرة لى شيئا<br />ولكن مالفت انتباهى هو رد الدكتور المصرى !!!<br />الذى تعجبت من ذكائه ومفهوميته خصوصا انه كان من المفترض ان يعرف قبل دخوله وتعميمه لاهل الجزيرة العربية ارض المقدسات من ان الاسلام هو ابونا وجامعنا ومن ان نسبة كبيرة من اصل سكان مصر المحروسة هم من احفاد العرب الذين قاموا بفتح الامصار لنشر الاسلام واعلاء كلمة ان لا اله الا الله وان محمد رسول الله<br />فيااخوتى كفاكم فرقة و غباء فكلنا من اصل ومنبت واحد ولو بحث احدكم عن جذوره سيجدها تنتمى لاحدى قبائل الجزيرة العربية والتى تسمى اليوم بالسعودية والكويت والامارات وباقى دول الخليج<br />واخيرا اسئل الله لمصر ولشعبها العزيز الامن والامان والتقدم<br />اخوكم شاب من ارض الحرمين"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218221808/http://masr.20at.com:80/article.php?sid=258&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 102
subject = "انا انا................. خليجي"
author = "ابوووووهم"
posted = "2006-10-19"
text = "هيه شووف مصري وش يقول<br />يالمصري انت سافل واطي .. وانا اعرف لي مدرسين مصاريه والله والله تافهين نفسهم رخيصة .. انا اتصدق عليه واخدمه والله خدمتهم كثر ونكروا الجميل في دقيقه.. بعدها عرفت انو مافي مصري فالدنيا شريف<br />كلهم حقين فلوووس<br />والله والله الا اليوم وانا ماشفت مصري نضيف او مصري شريف او مصري كريم وجيههم مغسوله بمرقه كلب<br />مع انني ماقد قابلت كويتي لاكن اشوفهم نظيفين واشراف نفسهم عزيزة ماهم مثل المصاريه<br />المصاريه شي تافه اشتريهم بريال وابيعهم بريال<br />المصري من ورا الشاشه سوا نفسه رجال .. والله لو اجي عنده مثل الدجاجه مايهش ولا ينش<br />انا من احد الخليجين اللي سافروا مصر لجل شي واحد اللي هو (( الكس )) يعني مافي خليجي ماهان شرف المصاريه..<br />وياناس تخيلوووووا مدرس مصري انا معاه طيب واستغل طيبي ومره من المرتا قال لي ياحمار تدرون وش سويت ماكلمته..<br />رحت له بيته بعد فتره عشان مايحس اني ابغى اسوي له شي .. المهم رحت بيته واخذته على اسا اننا نروح نتعشى في مطعم ونتمشى.. انا متفق مع شباب في الاستراحه حقتنا ينتظروني .. المهم اخته على الاستراحه وضربناه ونكناه وصورناه<br />عشان قالي ياحمارر دفع ثمنها غالي<br />وبعدين هددته بالمقطع الفيديو ونجحني ونجح كل اللي اعزهم بالمدرسه .. وهو الحين في مصر ذليل تافه نكته واخذت شرفه<br />وشره الا الان بيدي..<br />ما احب اطووول عليكم<br />احب اقووول<br />ان ما اعتقد انو في مصريه شريفه<br />ولالالالالالالالالالالالاهنو الخليجين"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218221808/http://masr.20at.com:80/article.php?sid=258&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 103
subject = "مش كده يا خوانا عيب"
author = "Tormentor"
posted = "2006-10-24"
text = "اخوانى المصريين براحه شوية على الكويتى المسحوب من لسانه ده, أنا مش معاكو خالص, ليه بقى؟؟<br />ما تردوش عليه أصلأ لأن ده كويتى.<br />دول يا جدعان بيقولو على حرف الكاف (تشاف) يعنى فيه شلل أكتر من كده؟؟<br />و بعدين كل خولاتهم بالصلاه عالنبى كده بييجو يتجوزوا هنا فى مصر ماهو خلاص الدين اتغير ونيك الرجاله لبعض بقى حلال طالما متجوزين على رأى سعيد صالح حيث قال (أبوك هايمشى مع عمتك؟؟؟ دى عمتك متجوزة) .<br />فامتزعلوش نفسكوالعيب على حكومتنا البريئه اللى غاتحه الفنادق مدعره للأشكال اللى زى دى و الله يرحم الدين والأسلام.<br />البلد كلها مليانة شيمايلز كوايته.<br />ضاربين هرمونات و بزبزهم حريمى و حاطين فل ميكاب<br />شبه الفنان المسجون القدوة حرامى شهادة الجيش تامر حسنى القدوة<br />الله يخرب بيت كده فوقى يا مصر بقى فين زمن الرجاله؟؟"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218221808/http://masr.20at.com:80/article.php?sid=258&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 104
subject = "استهدووووووووووووووا بالله"
author = "السلام عليكم ورحمة الله وبركاته جميعا... لكل"
posted = "2006-11-02"
text = "ياأخوووووووووووووووان ياسااااااااااااااده<br />ياعرب<br />يامسلمين .....<br />صلو على النبي ...<br />اللحين كل واحد فيكم يمدح بدله ويسب البلد الثاني .....والله اللي بيدخل ويشوفكم كذا انه بيضحك عليكم كلكم ويقول متخلفين ....<br />والله حرام كذا .... استهدو بالله ....<br />بعدين يالأماراتي وشفيك على السعودييين ...<br />والله اني احب الأماراتيين ... ولي معارف أمارتييين عزيزين علي ... تجي انت كذا بتغيرها.... لا تغير نظرتي ..<br />مولازم اي واحد سعودي كويتي امااراتي يصير قليل ادب ....لكن للأسق هالقله من الناس قليل الأدب شوهو سمعة اخوانهم<br />وتقبل خالص تحياتي ...<br />اخوك من السعوديه"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218221808/http://masr.20at.com:80/article.php?sid=258&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

