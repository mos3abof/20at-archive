[[comments]]
order = 95
subject = "نداء من مصرى الى كل المصريين"
author = "محمد عبدة اباظة من الشرقية"
posted = "2006-08-02"
text = "با ولاد بلدى يا مصريين اول حاجة السلام عليكم ورحمة الله وبركاتة*<br />قبل كل حاجة لازم تعرفوا (ومن الاعراب اشد كفرونفاق)<br />وياريت انا بطلب من الاخوة المصريين انهم ماينزلوش مستواهم للعالم الزبالة دى احنا عارفين تاريخنا وعارفين نفسنا<br />والخلجيين دول مش من مستوانا علشان نتناقش معاهم دول شوية جهلة مثل الحمار يحمل الى بيشيل كتب وبعدين هما بيحاولو جاهدين انهم يعملو لنفسهم تاريخ بفلوسهم ونسيو (التكية)الى كان جمال عبد الناصر بياكلهم فيها صدقة لوجه الله دة طبعا قبل ظهور البترول وبعد ظهور البترول اصبحو كدة زى ما بنقول بالمصرى شبع بعد جوع وعلشان كدة تلاقى معظم الخلجيين بيجرو وراء الجنس دليل على الحرمان فنداء اخير لاتتناقشو مع هؤلاء الجهلة الرعاة<br />واخيرا اقول لكم بالمثلالشعبى المصرى(يا مصريين لاتعملو للخرا ثمن)وطبعا ال(الخرا)هو الخلجيين الحاليين"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906165314/http://masr.20at.com:80/article.php?sid=258&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 96
subject = "عير كبير"
