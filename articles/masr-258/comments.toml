posted = "2006-08-03"
text = "هههههههههههههههههههههههههههههههههه<br />ههههههههههههههههههههههههههههههه<br />ههههههههههههههههههههههههههه<br />موتني ضحك ياخو القحبه تذكرني بفلسفه اساتذه الجامعات يامعود مص عيري وابلعه وخلك ساكت<br />هههههههههههههههههههههههه<br />من جد توني قاعد وضحكت من قلب<br />وبعدين انت اعترفت بنفسك انه احنا اقوياء<br />عندنا بترول والله لو نهجم عليكم بنخليكم صج تعرف شنو معنى الخليجي<br />واحنا فعلا نركض ورا الجنس لانه احنا مانسويها مع بنات ديرتنا ونسويها معكم ياخوات القحبه<br />هههههههههههههههههههههههههههههههههه<br />يلا انتضر ردك ياخو قحبتي<br />ههههههههههههههههههههههههههههههههههههه"
