text = "يا شعوب الخليج لما انتوا معاكم فلوس كتير ليه بتيجوا مصر تناموا مع نسواننا المعفنه غير انكم فقراء وشحاتين واتخن من فيكم مديون للبنوك لشوشته وكمان لا زم يدفع تعويضات للخادمات الاسيويات الخليلات المعفنات الفلاحات ابوك السقا مات لما حدف روحه من البلكونات"
archived = "2006-12-18"
