posted = "2006-09-19"
text = "تلحسوا طيزي واحد واحد مصريين على خليجيين على لبنانيين كس ام بلدكم و كس ام مصر هم مش اجدع ناس روح شوفوا نفسيكم في مكه في موسم العمره او الحج كيف الناس كلها تشكي منكم و من دناءة نفسكم المصريين للاسف اشتهروا بدناءة النفس و مش بالجدعنه.على زبي هيك جدعنه اذا ذل النفس اتسموه جدعنه يا اخوات الشرموطه."
