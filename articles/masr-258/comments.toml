text = "سمعني اجدع سلام للأسكندرانية لو سمحت<br />اعتقد ان مقولة ان الاسكندرانية بتوع كلام وبس دي صحيحة نوعا ما وده بيظهر في العركات او الخناقات (بالقاهراوية).<br />اما المنوفويين فانا ححكي اني لما رحت هناك لقيت ناس في منتهى الكرم وعزموا اتوبيس كامل.<br />وفي ناس فعلا بخيلة جدا واستغلالية جدا.<br />وقبل ما امشي<br />سمعني اجدع سلام للمصراوية... اللي بدعيلهم ربنا يهديهم ويفك خنقتهم ..قريبا ان شاء الله"
