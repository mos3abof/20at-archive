[[comments]]
order = 99
subject = "تعالوا مصوا زبري"
author = "ابو زب كبير"
posted = "2006-09-19"
text = "قال جدعنه المصريين قال<br />انتم مجرد حفنه من الانذال بتبيعوا حالكم من<br />اجل الجنيه,و ما عندكم الصاحب و لا عزة النفس<br />كس امكم لا تتكلموا عن الجدعنه انتم اخر ناس<br />تحكي عنها .على زبي المصريين و الخليجيين و نانسي<br />عجرم و هيفاء الشرموطه و ال سعود و ال الصباح"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218221808/http://masr.20at.com:80/article.php?sid=258&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
