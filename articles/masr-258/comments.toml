order = 58
subject = "يالاحماراتي وش دخلك"
author = "كس امكم يا احماراتيين يا عيال زايد الكلب الاعور الدجال يالمخانيث يالمطايا يالجبناء لو رياييل ردو اراضيكم من ايران اللي فجت كس امهاتكم ككككككككك كس امكم يا بو دولتكم الخايسه الوصخه يااهل الفساد ياعيال الدعاره يا عيال الرقاصات انتو بناتكم اربع وعشرين ساعه بالدعاره والمراقص الواحد يخاف يتزوج من بناتكم يمكن يكون فيها ايدز والا عندها شهاده احترافيه في ادارة المراقص كس امكم على كس ام دولتكم الحمارات على كس ام رئيسكم الخنيث"
posted = "2006-05-29"
text = "شعبكم كله نفس الشكل ونفس الويه ونفس الصوت ونفس الملابس ونفس الخيزرانه هههه انا لو افتح مركز تعديل اللحميه اللي بخشمكم لو افتح المركز عندكم جان نص شعب الحمارات ياي عندي باول يوم ههههههه لا ابوكم لا ابو ابوكم من شعب واطي زاني شاذ جنسيا اهل اللواط قبل فتره صادو عندكم شواذ يا عيال الكلب لعنة الله عليكم حكومة وشعبها وارضا انتو حرام انكم محسوبين علينا كخلجينيين ياعيال الحرام بس مثل ما قلت انتو عندكم صفه وحده واهيا انكم جبناء مطايا لو رياييل ردو جزركم من ايران<br />واقرا هذه المقاله اللي كتبوها عنكم في احد المنتديات تفضل اقراها نسختها لك .:<br />لماذا الاماراتي مسطول ياشباب ..؟؟<br />يتراود في اذهاننا عن الشعب الاماراتي المسطول اللي ماينعرف هل هو مجنون او صاحي !!<br />قسم بالله ياشباب واول دليل المشارك اللي بمن سيربح المليون الاماراتي محمد خليفه اللي يسئلونه بثالث سؤال عن 300 دولار كم حرب عالميه .. يقولهم اربع حروب !! لهدرجه وصل التخلف فيكم يااماراتين ؟<br />وثاني دليل المشارك اللي بستار اكاديمي خليفه .. مدري هل هو جنس او لا ؟؟ الله عالم<br />وثالث دليل .. الفنان المهبول المسطول المخبول المجنون عبـــــــدالله بالخير .. والله بالشر ماهو بالخير هههههه<br />اهبل من كذا ما اعتقد فيه .. والله<br />اقرأ بقية التعليق .."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

