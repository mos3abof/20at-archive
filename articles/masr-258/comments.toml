[[comments]]
order = 3
subject = "لا يليق التنابز بالألقاب ورمي الناس بالتهم جزافا"
author = "مصراوي بيحب مصر"
posted = "2006-05-02"
text = "مساكم الله بالخير والسرور..<br />أختلف مع كاتب هذا المقال جذريا، فالأجدر به أن يعدد مناقب ومزايا كل محافظة لتحقيق مزيد من الانتماء لدى الشباب، لا أن يذكر المثالب والعيوب، رغم أن ما يدعي أنها عيوب يتداولها الناس لم يقم عليها دليل شرعي أو إحصائي صحيح يثبت مثلا أن أهل محافظة كذا كرماء أو بخلاء، فلا يخلو مجتمع من البخيل والكريم، والمهذب والبذيء والجميلة والدميمة..<br />يعني من جهة علمية إحصائية بحتة فهذا المقال صفر على الشمال مع احترامي الكامل، ولعل الأولى بالكاتب أن يتطرق مثلا للخصائص السلوكية أو للطبيعة الجغرافية للمحافظات طالما أنه مغرم بالحديث عن المحافظات..<br />المقال أيضا تجاهل محافظات سيناء والبحر الأحمر تماما وكأنها ليست مصرية، أو كأنها في محافظة أخرى..<br />آمل من الكاتب أن يتقي الله فيما يكتب..<br />وانطلاقا من القرآن الكريم أحذر إخواني وأخواتي القراء من أن ينزلق لسانهم باللمز والإساءة لأي من مواطني المحافظات التي يشتهر على الألسنة أنهم مثلا بخلاء أو أغبياء..<br />قال تعالى {يا أيها الذين آمنوا لا يسخر قوم من قوم عسى أن يكونوا خيرا منهم ولا نساء من نساء عسى أن يكن خيرا منهن ولا تلمزوا أنفسكم ولا تنابزوا بالألقاب}"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

