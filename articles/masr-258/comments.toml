[[comments]]
order = 53
subject = "ياكوايته ياولاد الحثاله"
author = "يامرضي نفسيين ... لما تييجي مصر إبقي كلمني عشان أشوف ... إنت بتبعبع ولسه برضه بتتكلم بالفلوس بس ... وماتدخلش الإسلام في الموضوع."
posted = "2006-05-27"
text = "بلاش أقوللك الحكايه بتاعة الكويتيه اللي كانت بتتعلم في مصر... هاريتها نيييييييك<br />ماكنتش بتشبع أبدا بنت المتناكه. ومصر الجديده كلها تشهد. وسألتها إنتي بتتناكي كده برضه في الكويت؟؟؟ قالتلي لأ وإلا كان العقيد صبوح الصباح المصبح مصباح المنور وداني ف داهيه.<br />بس بيني وبينك ... كانت نااااااااار."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

[[comments]]
order = 54
subject = "ياكوايته ياولاد الحثاله"
author = "واحد كويتي خول ... سولت له نفسه في يوم ع البار إنه يعزمني علي بيره \"هنيكان\"... أنا كنت بشرب بيره ستلا (أرخص طبعا)... قلت له لأ ... إنت اللي ح تشرب بيره ستلا وعلي حسابي وإلا ح اضربك ... بعدها شرب علي حسابي أربعه ستيلا زي الكلب لغاية ما رجع كل اللي في بطنه في البار... ضربتو قلمين علي وشه وقلتله روح لأمك ياخول..."
posted = "2006-05-27"
text = "الغريبه إني شفته في نفس البار تاني وقلت له روح مكان تاني يابن المتناكه...<br />وطبعاً عمري ما شفته تاني ....<br />طبعاً راح يتناك في مكان تاني....<br />ياخولااااااااااااااات. يامكبوتيييييييييييييييين ........ يامرضي ...<br />وأضيف... كس أمك ياكويتي يابن المتناكه."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

