[[comments]]
order = 19
subject = "جرى إيه يا بت يا لبنانية ايه اللى دخلك على أسيادك بدون إستأذان"
author = "نمر من ورق"
posted = "2006-05-04"
text = "جرى إيه يا بت يا لبنانية على الاقل الخناق بين المصريين لا يفسد للود قضية مش شوية صيع و منتفعين و مأجراهم إسرائيل و أمريكا علشان يتخانقوا بدلاها و كفاية إن فى واحد عندكم إسمه \"جعجع\" عليا النعمة ده لو مصرى كان زمانه شبع تريقه للصبح ثم بتحمدى ربنا أن أمك مش مصرية طيب ليه ما قولتيش أبوكى!! أيوه أيوه أنا عرفت ده أكيد علشان ما عندكوش رجاله أصلا 1/2 نسوانكم لابسين بيكينى و طالعين يبيعوا لحمهم فى الفيديو كليب علشان بيوت الدعارة أصلا إتملت و مش لاقينلهم مكان فيها و 1/2 شبابكم بينتف شعر حواجبه و إسألى وائل الكافورى .... ها عاوزه كمان و لا كفاية كده النهارده!!"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170440/http://masr.20at.com:80/article.php?sid=258"

