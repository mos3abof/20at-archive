text = "أحب أقول إن أنا مصري ... وعمري ولا عمري حروح الكويت ... والسبب بإختصار.............إن الكوايته ولادمتناكه .... حيوانات و بقر معاها فلوس ... حتي إللي بييجوا عندنا ويتعللموا في جامعاتنا مجرد عقل فارغ فيه التفكير إنه كيف يتناك... والغريبه إنه بييجي عندتا زي الفراخ ... جبناء"
archived = "2006-06-25"
