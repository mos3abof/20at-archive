posted = "2006-07-24"
text = "انت يابن القحبه شدخل الامارات بالسالفه انت غبي صج اسم على مسمى لوووووووووووووووووووووووول<br />انا ماعرف الا مقولة مصرية وهي يابتاع الفول وطبعا هالكلمة علمتني قحـبتي المصرية لوووووووووووووووول<br />وبعدين اذا انت ماتعرفني روح اسال امك وهي بتقول لك منو اناا طبعا لاني نياجها وجم من مره نمت معاها لوووووووووووول<br />روح شوف امك في غرفتها ولا ؟!!!<br />ههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههه"
