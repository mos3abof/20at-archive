subject = ""
author = "مش سهلة كدة"
posted = "2009-11-15"
text = "العملية صعبة جدا ومش بالسهولة المتخيلة من العيال دى<br />دى بلد بتغرق<br />وعايزة راجل ناضج بمعنى كلمة راجل ينقذها من الضياع والهوان والانحدار اللى هى فية<br />فية مشكلة فقر رهيبة فى البلد وفية بطالة لا تقل عن 40 فى المية<br />والبلد عايشة على شوية المعونات الخارجية والمصريين العاملين بالخارج<br />البلد مش نادى كرة قدم ولا مركز شباب لتولى رئاستة دى دولة كلها مشاكل<br />وربنا يولى الاصلح"
archived = "2009-11-17"
capture_url = "https://web.archive.org/web/20091117020719/http://www.20at.com:80/masr/news/14046-2009-11-15-11-32-32.html"

