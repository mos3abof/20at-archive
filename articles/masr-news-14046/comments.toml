[[comments]]
order = 1
subject = ""
author = "العملية سخنت"
posted = "2009-11-15"
text = "الرئيس بوتفليقة امر بسفر 10 الاف مشجع جزائرى الى الخرطوم مجانا لتشجيع الفريق الجزائرى<br />رجل اعمال سودانى تبرع ب 10 الاف تذكرة فى استاد المريخ بالخرطوم للمشجعين المصريين<br />اشتباكات بين المشجعين المصريين والجزائريين فى لندن<br />حالات شغب فى باريس بعد انتهاء المباراة<br />العملية بقت سياسية اكتر منها رياضة<br />والبركة فى الناس بتوعنا<br />ويعيش الحزب الوطنى الديمقراطى<br />وربنا يستر"
archived = "2009-11-17"
capture_url = "https://web.archive.org/web/20091117020719/http://www.20at.com:80/masr/news/14046-2009-11-15-11-32-32.html"

[[comments]]
order = 2
subject = ""
author = "............."
posted = "2009-11-15"
text = "حتى فى الموضوع السياسى الناس بتتكلم فى الكوره<br />والله لو اتعلم من والده يبقى ده سبب كافى لرفضه<br />هو الاكيد انه هيوصل للحكم<br />بس ازاى دى مش معروفه فى ظل وجود والده ولا هو هينزل بداله<br />ومن ناحيه مفجر \"الى قالها احمد عز\" فهو مفجر كبت الشعب و مفجر…الناس"
archived = "2009-11-17"
capture_url = "https://web.archive.org/web/20091117020719/http://www.20at.com:80/masr/news/14046-2009-11-15-11-32-32.html"

[[comments]]
