posted = "2009-11-20"
text = "واطى مين يا ابن الواطى<br />يا يهود العرب يا كلاب<br />احنا فخوريين برئيس دولتنا<br />ولو كان ابنة هيبقى رئيس احنا فخوريين بية ايضا<br />ومن اليوم انا معاك يا جمال<br />وربنا يقدرك وتجيب حقنا من كلاب العرب الجزائريين الاوساخ<br />عبيد فرنسا<br />وانا متاكد ان جمال عمرة مايهرب<br />بس من حقة يحافظ على هيبتة هوا مستحيل يقف امام الحثالة<br />الوساخ فى الشارع<br />وزى مقال علاء اخوة احنا لو عايزين نمحوهم من على وش الدنيا احنا باذن اللة قادريين<br />تحيا مصر تحيا مصر<br />وتسقط الجزائر يهود العرب وكلاب فرنسا"
archived = "2009-12-21"
