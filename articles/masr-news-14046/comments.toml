text = "احنا عايزين الكابتن حسن شحاتة يبقى الرئيس لانة اتعلم يجيب لنا النصر فى الاستاد ويوحد شعب كل مصر مسلم ومسيحى على الانتماء للبلد<br />يعيش الكابتن حسن شحاتة اللى ما نعرفش غيرة"
