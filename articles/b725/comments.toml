[[comments]]
order = 0
subject = "لي تحفظ"
author = "عبدالله"
posted = "2006-04-23"
text = "أعتقد أن طرح مثل هذه المواضيع يثير كثير من الأمور في ذهني ولا سيما في طريقة معالجتها، فقد يكون الكاتب بذل جهدا في جمع هذه المصطلحات او الحصول عليها، ولكن ما هو الهدف من جمعها؟<br />وبقدر وضوح الهدف يكون توجيه المعالجة.<br />- ربما يكون الهدف هو مجرد العلم والمعرفة من خلال إطلاعنا على ثقافة جديدة<br />- وربما يكون من قبيل الدعابة<br />ولكن في كل الأحوال أعتقد أن جمع هذا الكم من المصطلحات قد يدفع إلى انتشار هذه اللغة وسط أو ساط جديدة من الشباب<br />وباستثناء هذا التحفظ أعتقد أن الطرح في حد ذاته جيد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154444/http://www.20at.com/article2.php?sid=725"

[[comments]]
order = 1
subject = "انا منكتمه"
author = "نيفين"
posted = "2006-04-23"
text = "الموضوزع دا خلانى منكتمه و مقلوزه جدا لان بدل ما المصطلحات دى تتعالج للاسف هتنتشر اكتر و خصوصا انها كلها بتضحك و (روشه طحن)و احنا شعب لاذيذ و ابن نكته وبنستقبل ثقافات الغير المرحه دى بصدر رحب<br />مبروك على الشباب المصرى مصطلحات جديده لانج<br />ليه يا عشرينات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154444/http://www.20at.com/article2.php?sid=725"

[[comments]]
order = 2
subject = "؟؟؟؟"
author = "صايع"
posted = "2006-04-23"
text = "نيفين والنبى تركنيلك على جنب<br />واللهى تعليقاتك رخمة اوى<br />انتى مش مسدقة لية يابنتى انتى ؟؟؟؟؟<br />لا حول اللة يارب<br />يابت روحى نامى ولا اكنسى ولا امسحى<br />قعدتك كدا غلط وسط الناس العاقلة هنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154444/http://www.20at.com/article2.php?sid=725"

