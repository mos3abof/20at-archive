[[comments]]
order = 5
subject = "مسلمه"
author = "مسلمه"
posted = "2006-04-23"
text = "ايه المصطلحات الغريبه دى انا اول مره اسمعها مع انى شباب برضو<br />بس يمكن سمعت كلمه تانيه \"مستنكر\" وتعنى متضايق<br />بس مش كل الكلام ده حلو<br />ايوه اقول نفض وكبروطحن لكن مقولش مهايط دى<br />اللهم اهدى شباب المسلمين اللهم اهدى فتيات المسلمين اللهم اهدنا معهم يارب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154444/http://www.20at.com/article2.php?sid=725"

[[comments]]
order = 6
subject = "لييييه؟؟؟؟؟؟؟؟؟؟"
author = "السلام عليكم"
posted = "2006-04-23"
text = "انا عندي سؤال... هو لييه الصايع مش بالع نفيين؟؟ اذا كانت هي رخمة زي مابيقول يبقي هو إيه؟؟؟<br />ولا يهمك يا أستاذة نفيين.. كل إناء بما فيه ينضح<br />سلاااام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154444/http://www.20at.com/article2.php?sid=725"

[[comments]]
order = 7
subject = "ممكن تفرق"
author = "حلم"
posted = "2006-04-24"
text = "أول حاجة أحب أشكر كاتب الموضوع على موضوعاته المميزة لأنه بيكتب عن لقطات وحجات بسيطة أوي في حياتنا مش بنتأمل فيها في العادة.<br />بس أنا كان عندي استفسار عن الكلمات دي<br />ياترى هل هي خاصة بأهل نجد ولا كمان في الحجاز؟؟ لأني بصراحة مسمعتش عنها قبل كدة<br />وزي ماانتو عارفين بين الفريقين مصانع الحداد فأكيد هيفتكسو مصطلحات تانية<br />وربنا يوسطر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154444/http://www.20at.com/article2.php?sid=725"

[[comments]]
order = 8
subject = "الى صايع و هانى الف شكر ة الى تونى و لييييييييه علمى علمكو"
author = "نيفين"
posted = "2006-04-24"
text = "انت تانى يا صايع و<br />مين هانى دا كمان<br />انا قبل كدا سبتك يا صايع لهبهوب واكرم وردو هما عليك ..فاكر<br />ة المره دى انا سيباك ليهم و معاهم عبد الله هيردو بالنيابه عنى برده<br />و بقةل لتونى و ليييييييييييه شكرا انكو رديتو و انا بجد مش عارفه صايع دا انا عملتلو ايه؟؟؟؟؟؟؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154444/http://www.20at.com/article2.php?sid=725"

