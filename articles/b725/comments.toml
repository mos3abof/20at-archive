subject = "اسم على مسمى"
author = "سندريللا"
posted = "2006-05-02"
text = "على فكره يا صايع الناس كلها على الموقع عارفه نيفين وعارفه تعليقاتها<br />والناس عارفاك يا صايع<br />وقبل كدا رد عليك اكرم و هبه وطلعت نيفين محترمه معاك<br />عايز منها ايه<br />احترم نفسك<br />علقى براحتك يا نوفا<br />تعليقاتك زى العسل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154444/http://www.20at.com/article2.php?sid=725"

[[comments]]
order = 13
subject = "اهلا بيكم"
author = "Hanno"
posted = "2006-05-09"
text = "اهلا بيكم جميعا<br />دى اول مره اشترك معاكم واتمنى متكونش اخر مره<br />انا شدنى الصراحه اكتر موضوع نيفين عن الموصوع الرئيسى عشان كده انا عاوز اقولك يانيفين متزعليش ونفضى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154444/http://www.20at.com/article2.php?sid=725"

[[comments]]
order = 14
subject = "اهلا بيك يا hanno ومش اهلا بيكى يا امنيه"
author = "نيفين"
posted = "2006-05-15"
text = "و الله انا اتعودت ارد على الناس اللى بتفهم بس<br />و الواضح انك يا امنيه مش فاهمه حاجه و بتخبطى<br />و علشان كده ميل ميرسى يا ستى على كلمه غلسه و لو انك جديده ف الموقع و متعرفيش انا غلسه و لا لتا بس يللا مش مشكله<br />و بالنسبه ل hanno اهلا بيك ف الموقع<br />و صدقنى انا بنفض و لا يهمك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154444/http://www.20at.com/article2.php?sid=725"
