[[comments]]
order = 0
subject = "جامد يا واد ..!!"
author = "بصراحة تحليلك للفيلم جامد... يمكن مش بالعمق بتاع طارق الشناوى أو رفيق الصبان ...بس ...انا قريت التحليل على نفس واحد ..."
posted = "2005-12-10"
text = "استمر .. و ربنا يهد اسامة بن لادن و ايمن الظواهرى الى اذوا الاسلام اكتر من جورج بوش و شوهو صورة الاسلام عند المسلمين قبل الغربيين ...الله ينتقم منهم هما و ابو مصعب الزرقاوى ...آمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113151/http://www.20at.com/article2.php?sid=52"

