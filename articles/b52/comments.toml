author = "شكرا لموضوعك وارقو ان يتطرق اليه الكثير من الناس وان يهتمو بنا وبمظهرنا امام الغرب وان يقومو بتبديد ما قد صنعناه نحن بانفسنا واتمنى لك التوفيق"
