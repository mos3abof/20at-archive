[[comments]]
order = 0
subject = "وبعد كل ده ...؟؟ عايزينا نخاف ....."
author = "محمد السيد"
posted = "2006-06-27"
text = "الله أكبر ....<br />والله بجد حاجة تفرح ... في زمن نفسنا في حاجة تفرحنا فيه ....<br />الله أكبر مع كل أم ضحت ومستعدة تضحي بكل أولادها لأجل الأرض الطيبة الطاهرة ...<br />الله أكبر مع كل أب ... أنشأ ابنه علي حب الأرض دي ... و الموت في سبيلها ...<br />الله أكبر مع كل أخ وأخت ... وصلوا أخوهم وهو خارج يقابل عدوه بسلاحه الضعيف أو بصدره العاري ...<br />الله أكبر مع كل عروسة ودعها عريسها عشان عروسته الأولي نادت باسمه ...<br />الله أكبر مع كل طفل جمع حجارة حوش مدرسته وخرج بيها ... يرد دبابة واقفة علي باب بيته ...<br />الله أكبر مع كل فلسطيني ..... عرف إن البلد دي تستاهل كتير ... كتير أوي ...<br />وعشان كل ده ...<br />مش حاسكت ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130500/http://www.20at.com/article2.php?sid=999"

[[comments]]
order = 1
subject = "في واحدةالصبح كانت بتقول إنها خايفةعلي غزة..بعد اللي سمعتيه لسة خايفة؟"
author = "محمد السيد"
posted = "2006-06-27"
text = "أقولكم أنا افتكرت حاجة ....<br />مش هو ده الجو بتاع غزوة الخندق ؟؟؟<br />مش كانت الدنيا صعبة جدا ... والجو غاية في الصعوبة ...؟<br />مش كان الحصار مضروب علي المسلمين من كل مكان ...؟<br />مش اتفق مشركين مكة مع اليهود في المدينة واتحالفت كل قوي الشر ...؟<br />النهاردة في برنامج العاشرة مساء اتصلت واحدة من خان يونس ...<br />كلامها كان يكفي لوصف حال الناس هناك ...<br />قالت بالنص : إنهم مش خايفين وإنهم مستعدين لكل حاجة ... وإن الناس هنا كلها مطمنة علي الآخر ومش خايفين ...<br />صوتها كان كفاية إنك حاجة من اتنين ...<br />يا إما تقوم جري وتروح علي هناك معاهم ... أو إنك تجلس تبكي في مكانك إن في ستات بيتكلموا كده ... تبكي فرحان إن في ناس هناك عايشين في الظروف دي ... لكن بالروح دي ...<br />وبرضه مش حاسكت .......<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130500/http://www.20at.com/article2.php?sid=999"

[[comments]]
order = 2
subject = "مولد أمة"
author = "ما يظهره اخواننا في فلسطين المباركة -أسأل الله أن يثبت أقدامهم ، وينصرهم على عدوهم - من الثبات والتماسك رغما عن الحصار والتجويع ، ليدل دلالة واضحة على ارادة الصمود والتحدي للعدو الغاشم مهما أرغى وأزبد ، ويظهر أيضا نهاية حقبة الاستسلام والخنوع للظالم التي كرسها وزرعها فينا العدو الغازي واتباعه من طواغيت العرب."
posted = "2006-06-27"
text = "بقي علينا نحن أهل مصر وأهل الجزيرة وأهل الشام ، أن ننصر اخواننا في فلسطين ، بأن ننتقض على الطغاة ونقيم حكم الشرع ، وبعدها نسند أخواننا في فلسطين بكل ما نستطيع ، أما الان فنحن في حصار كهم أو أشد ، بل هو -والله- أشد."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130500/http://www.20at.com/article2.php?sid=999"
