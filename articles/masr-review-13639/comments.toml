author = "النفس القصير"
posted = "2009-10-06"
text = "الموضوع موضوع تركيبة جسدية لشعب - الشعب بتاعنا نفسة قصير<br />اى دورة او اى كاس عالم او اى مشاركة دولية بعد المباراة التانية او الثالثة الكل بيبقى واقع مهدود الحيل وما بيقدرش يجرى<br />تمام زى الراجل مع الست بتاعتة فى السرير بعد الجولة التانية او اقصاها التالتة ما بيقدرش يمشى وبيتقطع نفسة<br />دى امكانيات شعب<br />مش فراعنة بقى"
archived = "2009-11-08"
