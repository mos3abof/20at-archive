[[comments]]
order = 2
subject = "ممكن"
text = "فكرة الموضوع جيدة... لكن حاسس إنها كان ممكن تتعالج بشكل أكثر عمقا...<br />بصراحة أنا مع التخوف من جانب البنات... فعلا كتير من الرجال ممكن يفهموا الموضوع غلط..<br />بس أظن الفكرة مطروحة... وبتحصل فعلا... بس محتاجة توافر بعض النقاط:<br />_ لو تم التفكير في الارتباط لازم البنت تكون مدركة إن السؤال في هذه الحالة له إجابتين ... هل هي ممكن تقبل الإجابة الأخرى ... حتى لو الولد أسلوبه محترم ... (أصل إحنا دايما بنتكلم عن الرجل الشرقي ... خلونا نتكلم عن المرأة الشرقية برضه)<br />- مش هاقول الولد لازم يكون محترم ومؤدب لأن دا أساسي بس لازم البنت تكون عارفة إنه بيفكر بطريقة صح.. ومش هايفهم الموضوع غلط ...( عذرا ...كتير من الشباب حتى المحترمين منهم... ممكن ما يفكروا غلط بخصوص الموضوعات المتعلقة بالمرأة ...وأظن صعب معرفة هذه النقطة في الشاب إلا في حالات قليلة)<br />- في رأيي الموضوع من الأفضل إنه يكون عن طريق وسيط.... مش بشكل مباشر (كتير من الأولاد بيعملوا نفس الموضوع بالمناسبة يعني ما بيتقدموش مباشرة)<br />وفي النهاية أنا شايف الموضوع لو حصل وتم وكان متوافر فيه النقاط السابقة ... لازم ناخد بالنا إن الولد ممكن يفكر في الموضوع ومش هايفكر في نفس الوقفة ... دون أن يعني هذا الرفض ( زي ما البنات بتعمل ... ولا إحنا أقل منكم )<br />دكتور جيكل"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018092451/http://www.20at.com:80/article.php?sid=537"

[[comments]]
order = 3
subject = "سيدة القصر"
text = "أنا مرة قلت لواحد إنت مرتبط؟<br />فأجابنى: \"إنت معندكيش إخوات صبيان\"<br />بغض النظر عن الإفيه..انصح كل فتاه ألا تقدم على طلب الزواج من أى شخص بعد سيدنا عمر بن الخطاب \"لأنه كان حاجه كده ملهاش مثيل\" لأنها فيما أعتقد سوف تفقد جزء كبير من استمتاعهابالزيجة لأنها فى الغالب تحب أن تشعر برغبةالرجل فيها أضعاف أضعاف رغبتها فيه مع أن الحقيقة هى العكس، فنذكر أن الملائكة قد سألت ستنا حواء عن حبها لسيدنا آدم...فقالت أنها لا تحبه على الرغم من أنها تحبه أكثر ممايحبها ..<br />وكمان الله عز وجل جعل قرار الطلاق فى يد الرجل لأن المرأة أحيانا قد تطلب من زوجها الطلاق حتى تختبر حبها لديه..<br />فعلى المرأة إن أرادت الاستقرار لحياتها أن تراعى طبيعتها فى إختيار شريك حياتها، ويمكن لو صبرت ربنا يعوضها بواحد أفضل ممن اختارته ويعرف يقدر قيمتها، وتعيش معه ملكة زمانها، وأذكر أن عمى قد سألته إمرأة لا يحبها الزواج منهاوبعد ضغط منها وافق.. أى نعم هو عمى ولكنى أكره فيه الطريقة التى يعاملها بها ويذل أنفها..<br />فلماذا تعرضين نفسك لهذا السيناريو الذى من الممكن أن يتكرر..<br />وعلى إيه يعنى ما\"يولعوا\"!!!!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018092451/http://www.20at.com:80/article.php?sid=537"

