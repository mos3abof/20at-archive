subject = "marmoor"
text = "لا طبعا ايه الكلام ده هى خلاص الكرامة خلصت و بعدين الراجل فعلا مش بيحس بقيمة المرأة الا بعد ما يتعب عشانها و يكون هو اللي بيجري وراه لكن غير كده بيفضل طول عمره شايف و عارف و فاكر انها هى اللي جريت وراه مش هو اللي كان عايزها و بصراحه كده اللي بيجي بالسهل بيروح بالسهل او<br />easy come easy go<br />شكرا"
