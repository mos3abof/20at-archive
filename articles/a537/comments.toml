[[comments]]
order = 7
subject = "بيرو"
text = "أعرف واحدة سألتني السؤال ده ...<br />الحقيقة أول مرة كنت حاسس أنه طبيعي<br />تاني مرة قلت يمكن نسيت إنها سألتني قبل كدة<br />تالت مرة قلت زيادة تأكيد<br />والرابعة قلت اللهم أخزيك يا شيطان<br />ألاقي صورتي ومكتوب عليها من ورا كلام غريب بخطها<br />قلت يمكن كان واحد بيمليها حاجة في التليفون وملقتش غير صورتي وكتبت عليها<br />أينعم انا ما اعرفش صورتي وصلت لايدها ازاي ...بس بلاش ظن وسوء نية<br />مرة عاشرة سألتني السؤال ده ...رديت بمنتها البراءة<br />لكن الغريب انها قالتلي انها ناوية تروح تنتحر بعدها وقالتلي ابقي سلم علي ابو الهول لما تفهم ..!!<br />تفتكروا يا جماعة تبقي \"كدة يعني \" ولا ده سوء ظن مني وتفسير موش سليم لانتحارها ...!!1<br />الله يرحمك يا سنية..!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018092451/http://www.20at.com:80/article.php?sid=537"

