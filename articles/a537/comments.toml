text = "عارفة ياأخت بيرو إنت عاملة ذى جورج سيدهم لما كان عامل أم الضيف أحمدوكان بيقول: الواد خلى بالك منه<br />لو يزعل طبطب على خاطره<br />لو يغلط قول أنا مصارحه....<br />وبعدين مين قالك ياست إنت إن أنا عينى منه<br />ياسلام<br />هى الدنيا حصل فيها إيه<br />يعنى منصحش سنية من الورطة دية<br />واحدة كلمته 10 مرات ولم يفهم<br />يعنى كانت بتدن فى مالطة..<br />روحى ياختى شوفيلك أخ تانى تحاميله..."
