text = "طيب وانت مالك بقي ان شاء الله باخويا وتتدخلي ليه بينه وبين سنية<br />الا بقي لو كنت حاطه عينك عليه اكمنه تخين كدة ومليان وينفع في العيد<br />علي العموم انا هسكتلك المرة دي بس بلاش نعك كتير مع بيرو علشان الواحد اخويا الوحيد واللي حيلتي في الدنيا وامه موصياني عليه قبل ما تروح تصيف في بولاق عند أختها ....أم سنية !!!!!!!!!!!!!!!!!"
