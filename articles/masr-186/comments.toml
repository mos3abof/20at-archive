[[comments]]
order = 0
subject = "ورقة التوت"
author = "عابر القارات"
posted = "2006-04-17"
text = "أعتقد لم أرى فى حياتى أو سمعت حتى أن هناك نظام شمولى يسهر على راحة الفساد و المفسدين كحال نظامنا \"المبارك\" فهل يعقل أن من يحارب الفساد و التزوير يحاكم و يهان و من زور و بارك و إحتضن الفساد يرتع و يلهو يزداد فسادا!! أتسأل بالفعل لماذا كل هذه التضحيات من النظام حتى أنه قد ضحى بالبقية الباقية من ورقة التوت التى أكلهتا ديدان الفساد من أجل أن ينتشر و يترعرع الفساد !! ما الذى يجنيه !! ألا يكفى ما حصل عليه المفسدون تحت رعاية النظام!! اليس أجدر بالنظام أن يجارى أجواء الديمقراطية التى ينادى بها الشعب و يبدأ فى إلتقاط بعض ورقات التوت ليغطى عورته المفضوحه القبيحة فلربما جنى أكثر مما يتخيله بحب الشعب و تعاطفه مع نظامه أكثر بكثير من إنتهاج البجاحة و مساندة أى مفسد مهما فعل!! أعتقد أن الجواب سهل و هو أن نظامنا المبارك قد فقد البوصلة و تاه و لا يدرى على أى شاطئ يرسو و وجد نفسه مع مجموعة من المفسدين على جزيرة نائية بعيد عن الشعب المزعج"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213329/http://masr.20at.com:80/article.php?sid=186&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "أنا عارف السبب"
author = "م"
posted = "2006-05-07"
text = "أنا عارف ليه حسنى مبارك بيعمل كدة فى القضاه علشان دى عقده نفسية عنده بسبب إن ابوه كان حاجب محكمة وكان القاضى بيديله على دماغه لو قال كلمة أكثر من محكممممممممه علشان كده العقدة كبرة وبقت كولكيعة كبيرة قوى ومن يومها وهو بيكره كلية الحقوق زى العما وإبتدأ ينتقم من القضاه وميخليهومش يشرفوا على الإنتخابات بل وخلى كلابه يعتدوا عليهم فى الإنتخابات ثم بعد كده إبتدى ينتقم من الدكتور أيمن نور وبعدين الدكتور نعمان جمعة ثم بعد ذلك الإعتداء على المستشارين وضربهم بالحذاء إللى أولى منهم إن هوه إللى يضرب بيه ولكن أنا لقيت إن الحل إن أحنا نغير الراجل إللى كل مرة بيركب له حته نعل جزمة فى مخه علشان كده مخه طخين قوى وغبى وقلت إننا نوديه المجزر الألى علشان نجيب له إكسسوار لمخه من هناك يمكن يقدر ينسى العقده الكبيرة قوى إللى عنده وما يحاولش إنه يتطاول على أسياده من القضاه والمستشارين ويخليه فى مسح جزم الإمريكان زى الأول أحسن له"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213329/http://masr.20at.com:80/article.php?sid=186&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "دى قضية مصر كلها"
author = "مصرى"
posted = "2006-05-08"
text = "أعتقد أن الإعتصام حق للإنسان فى دولة حرة ولكن مصر دولة تحت الإحتلال ولننظر كيف كان الزعماء فى عصور الإحتلال لمصر يتعاملون مع المحتل والدفاع عن مصر وعن شرعية وجود المحتل على أرض مصر الغالية وهم جميعاً من الحقوقيين مثل مصطفى كامل ومحمد فريد وسعد زغلول وغيرهم كثير. فنظام الحكم الموجود فى مصر ليس نظام شرعياًلأن الرئيس حسنى مبارك لم يأتى للحكم منذ تولى الرئاسة بإنتخاب الشعب كما ينص الدستور وكان وجوده فى الحكم طوال هذه السنوات بالتزوير وما بنى على الباطل فهو باطل. ثانياً كيف للقضاء أن يرتضى لنفسه هذه الوقفة المستجدية فى دولة محتله كان من المفروض المطالبة بتحرير مصر وليس الإنتظار من المحتل أن يعطيهم حقوقهم التى سلبها منهم الذى هو من وجهة نظر القضاء المتهم الأولى على قتل السادات وكل الأدلة تشير إلى أصابعة الخفية فى ذلك وكان لا بد أن يسقط القضاء شرعية الحاكم فى وجوده فى الحكم. وأيضاً لما أصاب مصر من فساد وتدهور وإخلال بكل مؤشرات الحياة من بطالة وتعليم وصحة وقتله للحياة الديمقراطية لكى يضمن سيطرة على الحكم وهذه نفس سياسة المحتل ولكن الحل الوحيد الذى لا بديل عنه هو الثورة على هذا الفساد وخاصة أن الشعب كله مؤيد لكم وملتف حولكم ولكنه ينقصه القيادة وأنتم القيادة الصالحة التى يتمناها المصريين جميعاً فماذا تنتظرون هل تنتظرون أن يقضى عليكم الحاكم كما فعل فى الحياة الحزبية وبذلك تفقدوا حتى أحترام الشعب لكم لا امل الأن إلا بالثورة والشعب كله معكم وفى إنتظار شرارة البداية على أيديكم يا شرفاء مصر لنطهرها من هذا الفساد المتسرطن"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213329/http://masr.20at.com:80/article.php?sid=186&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"
