text = "الدنيا مهما كانت وحشة لازم يبقي فيها تفائل ..<br />لان دوام الحال من المحال<br />الشعب المصري انكسر واحبط بعد نكسة 67 .. الورح والتفاؤل رجع تاني ..<br />سبحان الله مين يصدق ان النصر ومش اي نصر يجي بعد 6 سنين بس !<br />وانا واثق ان حال بلدنا مش حيفضل علي كدة كتير ..<br />لان الليل مهما طال بيجي بعده شروق"
