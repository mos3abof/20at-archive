[[comments]]
order = 21
subject = "الى معاذ محمود انا كمان زهقت"
author = "نيفين نيفى نوفا"
posted = "2006-09-20"
text = "بص يا معاذ انا كمان و الله زهقت<br />ناهيك عن الموضوع دا بالذات فيه مليون قضيه فقهيه اهم من اباحه او تحريم الغناء و لسه علماء المسلمين بيتختلفو عليها بدايه من المشاكل الصغيره زى نقول ف التشهد محمد رسول الله و لا سيدنا محمد و انتهاءا بالمشاكل الكبيره اللى اخرها اثبات ولد الزنا<br />بالنسبه للاغانى بصراحه مش هقوللك انى مقتنعه اوى انها حلال لان كفايه انها يتلهى عن ذكر الله بس هقوللك انا هحاول امشى بمبدا لا افراط و لا تفريط اذا جاز انى اقول كدا هنا<br />انا بصراحه مش هقدر مسمعش اغانى بالمره لان رحم الله امرىء عرف قدر نفسه لان فعلا هى بقت ضروره حياتيه لينا بس انا كان نفسى بجد ف رد قاطع<br />و بمناسبه الكلمات يا معاذ اسالنى انا<br />انا بكتب شعر و بميل اكتر للشعر الرومانسى و كنت بنشر اشعارى ف معارض و منها معرض ف كليتى و مش عايزه اقوللك كنت بلاقى كلام ازاى من الاسر الدينيه بيتهمونى بالمعصيه و ان دا كلام حرام<br />ودا كان بيحصل مع كل زمايلنا الشعراء ف المعرض<br />للاسف احنا لسه بنناقض نفسنا<br />تلاقى واحد بيشتم ف نزار قبانى مع ان بينه و بين نفسه بتلاقيه حافظ اشعاره<br />عموما ربنا يهدينا للصواب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 22
subject = "علامات القيامه اتعضوا"
author = "فاعل خير"
posted = "2006-09-20"
text = "لا اريد ان ادخل في باب الافتاء والتحريم والتحليل ولكن في اعتقادي وحسب راي الغير معصوم من الخطاء ان هذا كله من علامات القيامه ففي وقتنا الحالي ظهرت الكثير من اشراط الساعه الصغر والناس في غفله من ذلك واكبر اهتماماتها جمع الاموال واللهو في دنيا زائفه فانيه قمن اشراط الساعه على سبيل المثال كما حدث الرسول صلى الله عليه وسلم وهو لا ينطق عن الهوى انما هو وحي يوحى تسارع الوقت فالسنه تمر كالشهر والشهر كالاسبوع والاسبوع كاليوم واليوم كالساعه وهذا حاصل في ايامنا هذه سرعة الوقت نحن على ابواب رمضان اعاده الله علينا وعليكم بالخير واني اذكر كانه البارحه ثانيا كثرة الزلازل وهذا يحدث باكستان واندونيسيا وتركيا وغيرهاثالثا الموت الجماعي اي الموت في جماعات وكل يوم نفتح التلفاز لنسمع موت عدد من الناس في انفجار او حادث او غيره رابعا التطاول بالبنيان وهذا واضح وبين في ايامنا هذه وخامساً ضرب المعازف في المساجد والتباهي بها فاتعضوا وليرجع كلن منكم الى دينه ويتمسك به قبل ان يحين اجله والحمدلله الذي خلقنا مسلمين وما عند الله خير وابقى مهاما عمر الانسان فنهايته الموت ولا يبقى الى الله سبحانه فاما جنه او نار خالدا مخلدا هذا والله ورسوله اعلم ولكم مني التحيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

