text = "كما قال الإمام علي رضي الله عنه و ارضاه<br />يا أمة بكت من جهلها الأمم<br />المعازف على أبواب المساجد<br />يالها من دولة اسلامية على الموضه وداعاً بلد الازهز<br />محمد حسن غنيم"
archived = "2006-11-02"
