[[comments]]
order = 25
subject = "التكفير"
author = "ميرا الكعبي"
posted = "2006-09-21"
text = "التاريخ البشري مع التكفير طويل، وأذكر منه على المستوى المحلي السعودي بعض الأمثلة: حينما دخلت شركات التنقيب عن البترول لأول مرة للبحث عن الذهب الأسود قيل إنها كفر وستجلب الفساد للبلاد! حينما دخلت الإذاعة لأول مرة في تاريخ المملكة جوبهت بالتكفير وإنها بدعة من عمل الشيطان، حينما بثت أول قناة تلفزيونية على أرض المملكة هوجمت بحجة الكفر، حينما فتحت أبواب المدارس النظامية قيل إنها كفر وتفسد عقول الشباب، حينما نزل الإنسان لأول مرة على سطح القمر، قيل إن التصديق بذلك كفر!.<br />هذه قراءة سريعة لتاريخ التكفير، ومازلنا حتى اليوم الحاضر نتخبط في سلسلة من التكفير في مواجهة ملفات القضايا المفتوحة في الساحة المحلية. على الرغم من أن الوقت كان دوماً الحكَم في قضايا كهذه، في إثبات ضعف حجة المكفرين حيث أصبحت هذه الأمور جزءاً أساسياً من حياتنا اليومية وندين للكثير منها بالفضل، من الإذاعة وحتى التلفزيون واكتشاف النفط، وفتح أبواب المدارس وما إلى ذلك. لكن المشكلة الحقيقية التي نعاني منها، أننا لا نعطي لأنفسنا مساحة من المرونة من أجل التفكير وعدم التسرع في إطلاق أحكام جزافية، لا تلبث أن تثبت مدى هشاشة حجتها، وعلى خجل تتوارى خلف الحائط.<br />التعليم والتكنولوجيا ووسائل الإعلام والبترول أصبحت جزءاً من حياتنا المعاصرة، ونفس الأشخاص الذين وقفوا ضدها في الماضي باتوا اليوم مدينين لها بالفضل لما جلبته لنا من رخاء ورفاهية وتطور. إن التأمل في الماضي واستقراء التاريخ يعطينا مساحة مرنة من التفكير في المستقبل قبل أن نطلق أحكاماً متسرعة ثم نعود على أعقابنا بعد أن نكتشف خطأ حججنا، ألم يكن من الأجمل أن نعطي لأنفسنا مساحة من التفكير والتأمل والسماح للوقت بأن يكون الفيصل قبل أن نطلق النار على الآخرين متهمين إياهم بالكفر والتكفير؟!.<br />الأخطر من ذلك تكفير التفكير وكل الممارسات الإنسانية للبحث والتساؤل والنقاش، ربما لأننا شعوب عاطفية لا يمكنها أن تحتمل النقد، أو تؤمن بثقافة التعددية والاختلاف، متناسين أن نكون مختلفين لا يعني أن يلغي أحدنا الآخر، ولا يعني بالضرورة أن يكون طرف على حق وآخر على باطل. هنالك دوماً وسطية، أو نقطة في المنتصف يلتقي فيها الطرفان، المشكلة أن البعض لا يرون أبعد من أنوفهم. فالمكعب على سبيل المثال يتكون من ستة مربعات، إذا نظرنا إليه من إحدى الزوايا فسنرى فقط مربعاً واحداً، وقد يرى الشخص المقابل من زاوية أخرى مربعاً آخر، لكن عدم رؤيتنا لبقية المربعات من زاويتنا التي نقف فيها لا يعني أن نلغي حقيقة أن المربع ما هو إلا جزء من مكعب!.<br />لقد قرنت الكثير من الآيات في القرآن الكريم التي تتحدث عن الإنسان بالفؤاد والسمع والبصر، وتقيم الحجة على هذا الإنسان: ألا تعقلون؟ ألا تفكرون؟ ألا تتدبرون؟ ومن وحي ذلك نستنتج أن الفعل الإنساني في التفكير والبحث والتأمل والاستقراء أمر مشروع، بل واجب تدعو إليه الفطرة والدين، حتى إننا كي نؤمن لا بد أن نشك أولاً ونعمل عقولنا بالتفكير كي نصل لليقين.<br />ومن المؤسف له أن الكثيرين من يمارس سياسة التقييد الفكري والانغلاق الذاتي على التفكير والوعي الذهني، سواء كان ذلك بدافع أو بدون دافع. وعند أي محاولة للتفكير أو التعبير عن الرأي بأي شكل من الأشكال المشروعة وضمن أدبيات الحوار وموضوعية الطرح وحيادية الموقف، تُجابه أنت وفكرتك بالكفر! لكن السؤال الذي يطرح نفسه: لماذا الإنسان العربي مازال يحتفظ بتلك الأفكار التي كان يتغذى عليها مذ سنين العصر الحجري، مما نتج عنه للأسف ضخامة في النمو الجسدي وضحالة في المستوى العقلي والنمو الذهني، لأولئك الذين يتغذون منذ الصغر على أفكار موروثة، ويتناولونها مع الوجبات السريعة، كما أي سلعة استهلاكية أخرى بدون التعامل معها بحيوية، كالنظر والتحليل والتفكير والدحض والتفنيد والشك حتى اليقين؟<br />حيث أنتج ذلك عقلية حجرية وتفكيراً متحجراً غير قابل للتغيير والتجدد، وغير قابل أيضاً للتبديل، وليس فيه مرونة للتعايش مع الطرف الآخر، خاصة ونحن نحيا في ظل ثورة اتصال حيث أصبح العالم قرية صغيرة، وأصبحت الشعوب المختلفة باختلاف ألوانها وأجناسها شعباً واحداً، يشترك في ذات الوجع وذات الهم، هم الإنسان والسلام. وكما قال الراحل عبد الله القصيمي: (إن الذين لا يفكرون هم أشد عقماً من الذين لا يلدون).<br />*نقلا عن جريدة \"الوطن\" السعودية"
