[[comments]]
order = 0
subject = "أعتقد"
author = "معاذ محمود عامر"
posted = "2006-09-18"
text = "من البداهات أن الموسيقى ليست من المحرمات في الاسلام لأن الاسلام دين الفطرة والموسيقى من أقدم فطر الانسان بل انها موجودة قبل الأديان اذ كانت ولا تزال وسيلة ترفيهية ثقافية رفيعة المستوى.<br />ولكن من البديهي أيضا أن المسجد كمكان عبادة لا يحتمل هذا ولكن من الممكن أن تقام في المسجد حفلات انشاد ديني وابتهالات ربانية بديعة ,أما بالنسبة للموسيقى فيمكن أن ينظم المسجد حفلا موسيقيا راقيا في مكان مخصص لذلك ويعلن أنه تحت رعايته مثلا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 1
subject = "لا اعتقد بعيد"
author = "BATISTUTA"
posted = "2006-09-18"
text = "من اخبرك ان الموسيقى ليست من المحرمات هل سمعتها من شيخ نص لبه ام انك مفتى .<br />حلوة من البديهات دى ان شاء بعد كده المسجد يبقى ينظم حفل موسيقى للفنان الشيخ عمرو دياب ومعاه النجمة التقية نانسى عجرم<br />برعاية مسجد النور.والله دا اللى ناقص كمان ندخل مساجد ربنا فى القذارة دى."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 2
subject = "إغاثة اللهفان من مصائد الشيطان للامام ابن القيم"
author = "طه سمير"
posted = "2006-09-18"
text = "ومن مكايد عدو الله ومصايده التي كاد بها من قل نصيبه من<br />العلم والعقل والدين وصاد بها قلوب الجاهلين والمبطلين : سماع المكاء والتصدية والغناء بالآلات المحرمة الذي يصد القلوب عن القرآن ويجعلها عاكفة على الفسوق والعصيان فهو قرآن الشيطان والحجاب الكثيف عن الرحمن وهو رقية اللواط والزنا وبه ينال العاشق الفاسق من معشوقه غاية المنى كاد به الشيطان النفوس المبطلة وحسنه لها مكرا منه وغرورا وأوحى إليها الشبه الباطلة على حسنه فقبلت وحيه واتخذت لأجله القرآن مهجورا فلو رأيتهم عند ذياك السماع وقد خشعت منهم الأصوات وهدأت منهم الحركات وعكفت قلوبهم بكليتها عليه وانصبت انصبابة واحدة إليه فتمايلوا ولا كتمايل النشوان وتكسروا في حركاتهم ورقصهم أرأيت تكسر المخانيث والنسوان ويحق لهم ذلك وقد خالط خماره النفوس ففعل فيها أعظم ما يفعله حميا الكؤوس فلغير الله بل للشيطان قلوب هناك تمزق وأثواب تشقق وأموال في غير طاعة الله تنفق حتى إذا عمل السكر فيهم عمله وبلغ الشيطان منهم أمنيته وأمله واستفزهم بصوبه وحيله وأجلب عليهم برجله وخيله وخز في صدورهم وخزا وأزهم إلى ضرب الأرض بالأقدام أزا فطورا يجعلهم كالحمير حول المدار وتارة كالدباب ترقص وسيط الديار فيا رحمتا للسقوف والأرض من دك تلك الأقدام ويا سوأتا من أشباه الحمير والأنعام ويا شماتة أعداء الإسلام بالدين يزعمون أنهم خواص الإسلام قضوا حياتهم لذة وطربا واتخذوا دينهم لهوا ولعبا مزامير الشيطان أحب إليهم من استماع سور القرآن لو سمع أحدهم القرآن من أوله إلى آخره لما حرك له ساكنا ولا أزعج له قاطنا ولا أثار فيه وجدا ولا قدح فيه<br />من لواعج الشوق إلى النار زندا حتى إذا تلي عليه قرآن الشيطان وولج مزموره سمعه تفجرت ينابيع الوجد من قلبه على عينيه فجرت وعلى أقدامه فرقصت وعلى يديه فصفقت وعلى سائر أعضائه فاهتزت وطربت وعلى أنفاسه فتصاعدت وعلى زفراته فتزايدت وعلى نيران أشواقه فاشتعلت فيا أيها الفاتن المفتون والبائع حظه من الله بنصيبه من الشيطان صفقة خاسر مغبون هلا كانت هذه الأشجان عند سماع القرآن وهذه الأذواق والمواجيد عند قراءة القرآن المجيد وهذه الأحوال السنيات عند تلاوة السور والآيات ولكن كل امرىء يصبو إلى ما يناسبه ويميل إلى ما يشاكله والجنسية علة الضم قدرا وشرعا والمشاكلة سبب الميل عقلا وطبعا فمن أين هذا الإخاء والنسب لولا التعلق من الشيطان بأقوى سبب ومن أين هذه المصالحة التي أوقعت في عقد الإيمان وعهد الرحمن خللا أفتتخذونه وذريته أولياء من دوني وهم لكم عدو بئس للظالمين بدلا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
