text = "لو كان عندك أي قصائد<br />ممكن أتمنى عليكي أنك تسمحي وتبعتيهالي على ايميلي لأن أنا أزعم اني بفهم في الشعر وأتمنى اني أقرأ شعرك<br />mizo_bns2011@yahoo.com<br />وعلى فكرة الحروف اللي بعد اسمي دي معناها بالترتيب<br />b<br />بدر شاكر السياب)<br />N<br />الأستاذ نجيب)<br />S<br />صلاح عبد الصبور)<br />وبما أنك طلعتي أخت في الشعر<br />خددي الشوية دول من عند السيد صلاح عبد الصبور:<br />ألم يرووا لكم في السفر<br />أن البدء يوما كان....<br />_جل جلالها_ الكلمه<br />ألم يرووا لكم في السفر أن الحق قوال<br />ولكني أقول لكم بأن الحق فعال<br />أقول لكم:<br />بأن الحق والقول جناحان عليان<br />وأن القلب ان غمغم<br />وأن الحلق ان همهم<br />وان الريح ان نقلت<br />فقد فعلت, فقد فعلت!!<br />كتائب فوق طوق الحصر<br />مسرجة على الأفراس<br />طوافة<br />وطوق لجامها الكلمه................"
