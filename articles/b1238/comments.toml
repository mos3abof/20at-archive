[[comments]]
order = 4
subject = "لا ليست من المحرمات يا باتيستوتا"
author = "معاذ محمود عامر"
posted = "2006-09-19"
text = "أنا متأكد تماما أن الموسيقى ليست من المحرمات سواء أفتيت في ذلك أم لم أفت<br />أما بالنسبة للشيوخ النصلبة اللي أفتولي فعلى رأسهم دار الافتاء المصرية والفتوى طلعت سنة82 ومن الشيوخ النص لبة أيضا اللي أفتوا باباحتها الشيخ القرضاوي الا لو انت كنت شايف اني استنى فتوى من المتطرفين أمثال محمد حسان أو محمد حسين يعقوب أو غيرهم من الوهابيين الجهلاء<br />في حاجة كمان مهمة أنا أزهري ودارس الشريعة الاسلامية دراسة متعمقة أمثالك ميفهموهاش لأن شكلك كده من بتوع الشرايط وده أخرك<br />وبعدين لما قلت حفلات محترمة مقولتش عمرو دياب اللي واضح ان ده أرقى حاجة سمعتها انما أنا بتكلم عن الفن الراقي اللي الاسلام أساسا لا يتعارض معاه وانما يشجعه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 5
subject = "الاستاذ ياسر"
author = "عشرينات"
posted = "2006-09-19"
text = "ياريت ياجماعة نسمع لبعض وكل واحد يقول رأيه من غير ما يشيل هم انه يتهان من واحد لبمفروض انه أخ له، ومعاذ بيتكلم عن وجهة نظظر الكتير بيؤمنوا بها زى ما حضرتك فى كتير بيؤمنوا بوجهة نظرك وحتى رجال الافتاء اختلفوا حول الامر ولم يشتم احدهم الآخؤ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 6
subject = "معلش"
author = "معاذ محمود عامر"
posted = "2006-09-19"
text = "الأخ ياسر أحب أقولك الله يسامحك<br />وعموما أنا حاسس ان ده جزائي عشان أنا قليت أدبي برضه وشتمت باتيستوتا في موضوع ليه يا بابا عموما أنا اعتذرتله هناك وأكرر اعتذاري له هنا<br />بس ده ميمنعش ان أنا لسه شايفه متطرف ودوجماتي صميم ولسه مصمم ان الموسيقى مش حرام بل انها من أرقى الفنون وأهمها وأقدمها على الاطلاق ولا تتعارض مع الدين وليست بديلا عن كتاب الله كما قال أحد المعلقين وانما هي فن فلا يصح حتى أن أقول أنها ضد القرآن أليست هناك أناشيد دينية بديعة ومؤثرة لأقصى الحدود وتكون مصحوبة بالموسيقى<br />كما أن القرآن الكريم في تلاوته فن موسيقي رائع<br />عموما الموضوع مختلف فيه<br />وشكرا يا عشرينات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 7
subject = "من اجل الانصاف"
author = "mr: designer"
posted = "2006-09-19"
text = "يا اخوه معاذ و ياسر و باتيستوتالا يصح ان نرد علي بعضنا البعض بالشتائم ولا يصح ايضا يا اخ معاذ ان تصف دعاة معرفون بالعلم و الصلاح انهم متتشددون فالموسيقي حرام حرام حرام كما اقر ذلك جميع علماءنا الاجلاء القدماء و لا اقول علماء عصرنا فكل علماء المسلمين السابقين قد حرموها و لم يبيحها منهم الا بن حزم الاندلسي و قد رد فتواه العديد من العلماء الذين كانوا معاصرين له و من جاء بعده المهم يجب ان نراعي اسلوب مناقشة اكثر حميمية و مودة من هذا فالله جعل دينه عرضة لللاختلافات من اجل التيسير علي العباد لا من اجل ان تتفشي بينهم البعضاء بسبب اللاختلاف و هدانا الله لما فيه الخير و ما فيه رضوانه علينا اجمعين ملحوظة اخيرة للسيد معاذ ان الشيخ محمد حسان و محمد حسين يعقوب ليسوا وهابيين فاصحاب المذهب الوهابي هم فقهاء السعودية مثل صالح العثيمين و بن باز و غيرهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 8
subject = "الي معاذ"
author = "حمدي"
posted = "2006-09-19"
text = "انا معك يا معاذ في كل ماقلت ......... ولكن اختلف معك في اسلوبك في الرد<br />اذا كنت تنتقد في الوهابين او السلفييين تشددهم كما قلت فلا ينبغي انت الاخر ان تكون مغاليا ومتشددا في ردودك... وكما قالوا قديما لاتنهي عن خلق وتاتي مثله<br />كما انه لا ينبغي ان تصف العلماء مهما كان موقفك منهم بالجهل<br />وهناك من شيوخ التيار السلفي شيوخ اجلاء وانا شخصيا رغم انني شخصيا لا اعتقد ان التيار السلفي يعبر عن الفهم المعتدل لالاسلام الا ان بعض شيوخهم رائعين واخص بالذكر هنا الشيخ محمود المصري ابو عمار ...... فعندما اراه اشعر كاني اري رجل من اهل الجنه<br />فرجاء يا معاذ لاتجعل احد يستفزك لانك ستكون الخاسر وستبدو حجتك ضعيفه حتي لو كان الحق معك<br />وكل عام وانت بخير بمناسبة الشهر الكريم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 9
subject = "لأ حلال حلال حلال"
author = "معاذ محمود عامر"
posted = "2006-09-19"
text = "عموما بقى هي حلال وأنا كل العلماء مجتمعين ميهمنيش رأيهم طالما مفيش في اديهم نص قرآني صريح أصل هي لو حرام ومهمة أوي كدة في الاسلا كان لازم يبقى في نص قرآني يحرمها<br />قال النبي صلى الله عليه وسلم<br />(ما حرمه الله في كتابه فهو حرام وما سكت لكم عنه فهو معفو عنه)<br />وبعدين ارجع الى حديث الجاريتين اللتين كانتا تغنيان فيوم عيد وكان النبي راقدا فلم ينههما وعندما نهرهما أبوبكر وقال (مزمارة الشيطان في بيت النبي )فزجره النبي وقال له دعهما فانه عيد وهذا حديث صحيح أخرجه البخاري ويؤخذ منه كما درسنا اباحة الغناء وأن صوت المرأة ليس بعورة<br />وعموما أنا أعرف أن الذين ذكرتهم ليسوا وهابيين بالضبط ولكنهم يعتنقون نفس الأفكار المتشددة كوجوب اللحية وتحريم معظم الفنون ويضاف اليهم عدد ليس بهين كالشيخ يوسف البدري على سبيل المثال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 10
subject = "هو بالعافيه حلال؟"
author = "عبدالله مفتاح"
posted = "2006-09-19"
text = "يا معاذ بيه عيب عليك تقول على محمد حسان ومحمد حسين يعقوب جهلاء ومتطرفين<br />مينفعش تاخد راي فقهي وتصمم انه صح<br />وعشان تبقى اكثر هدوء كلام الموسيقى حرام ده راي الائمه الاربعه<br />الائمه الاربعه بردو زي ما انت قلت على محمد حسان؟<br />يا صحبي راي القرضاوي -على عيني وراسي- بس هو مخالف للائمه الاربعه<br />عايز يا سيدي تاخد بالراي ده خد بيه<br />بس متتهمش العلماء اللي بياخذوا براي الائمه الاربعه بالجهل والتطرف الله يكرمك<br />وعلى فكرة راي الدكتور القرضاوي ده مشتق من ابن حزم ولو قرات فتوى القرضاوي هتلاقيها بمحاذير كتيرة انت مش واخدها في اعتبارك يا ريت تقرا الفتوى كلها كده وتخليك هادي وتحترم العلماء<br />تحياتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 11
subject = "يا جماعه مش كده.."
author = "ايثار.."
posted = "2006-09-19"
text = "اختلاف العلماء رحمة.. منهم من حرم الموسيقى و منهم من احلها.. و انا شخصيا ارى انه عادى لان الحديث اللى معظم العلماء حرمو بسببه الموسيقى هو تقريبا بما معناه لانى مش متأكده من نص الحديث..\"حرمت عليكم الخمر و الحرير و المعازف\" لان فى عصر الرسول عليه الصلاة و السلام كان التلاته دول بيتجمعوا فى جو حرام يعنى نساء و خمر و موسيقى و كده.. لكن طيب دلوقتى المعازف هى الات الموسيقية.. طيب ما دلوقتى فى برامج ممكن تطلع موسيقى زى و يمكن احلى من الالات و كله من الكمبيوتر يبقى كده حرام ولا حلال؟؟ و كمان اللى يرفض الموسيقى يبقى يوقف العصافير عاالشجر كل حاجة ممكن تبقى موسيقى.. انا مؤمنة ان الموسيقى حلال طول ما هى مبتلهيناش عن عبادة الله.. و ابقو خليكو متحضرين شوية فى المناقشة.. للناس اللى بتقول ان الموسيقى حرام اظن الشتيمة برضه حرام.. و كمان انت يا معاذ انا معاك فى اللى قلته بس لو بطريقه احسن شوية.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 12
subject = "الى حمدي"
author = "معاذ محمود عامر"
posted = "2006-09-19"
text = "كلامك كله صح وأنا معاك اني عصبي جدا ودي مشكلة أنا بتخلص منها اما بالتدريب على الهدوء أو يمكن مع السن هتروح عموما<br />أنا لا أعتبر الخلاف هنا مجرد خلاف في فتوى وانما هو خلاف في منهاج كامل بحيث تحرم فيه جميع الفنون من الموسيقى الى النحت والرفنون التشكيلية بنفس الحجج الضعيفة والتبريرات الرجعية التي تعتبر كلام السابقين مقدسا ونحن أنه لا يوجد أحد كلامه تشريع سوى النبي ان ثبت صحة نسب الكلام اليه<br />الأخ عبالله أنا قريت فتوى القرضاوي<br />بس مش فتوى القرضاوي هي اللي خلتني أعتقد ما أنا معتقده الآن<br />انما دي قناعتي الشخصية اللي أنا مرتاحلها (استفت قلبك) وعموما أنا سقت أدلتي وأظنها مقنعة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

