[[comments]]
order = 14
subject = "لا حول ولا قوة الا بالله"
author = "واحد مصري في الخارج"
posted = "2006-09-19"
text = "الأخ الفاضل معاذ أحببت فقط أن أوضح نقطة<br />لحضرتك لما قريت ردك بأن لو في دليل من القرآن فحبيت أن أذكرك كما قال الله عز وجل \" فذكر أن الذكرى تنفع المؤمنين \"<br />سورة لقمان :الآية6<br />{ومن الناس من يشتري لهو الحديث ليضل عن سبيل الله بغير علم ويتخذها هزوا أولئك لهم عذاب مهين}.<br />لو ممكن حضرتك تراجع معني الآية في كتب التفسير المعتبرة<br />بس في حالة انك لم تأخذ برأي الصحابة الكرام كما في التفسير \" \"لهو الحديث\": الغناء في قول ابن مسعود وابن عباس وغيرهما.\"<br />فأحذرك أخي الكريم من مجاراة هواك في فهمك حتي لا يضلك هواك وان كنت تأخد برأي القرضاوي الذي هو مبني على رأي الأمام أبن حزم فقد أجمع الأئمة على انه ليس من الحزم أن تأخذ في الغناء برأي ابن حزم<br />وان كنت تعيب على من يأخذ برأي الأئمة مجتمعين ومن قبلهم الصحابة فأولى أت تعيب تعلقك برأيك الشخصي وانت قطعا ليس على ما هم عليه من العلم وتقبل تحياتي أخي في الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 15
subject = "مش جايه اهدى النفوس"
author = "نيفين نيفى نوفا"
posted = "2006-09-19"
text = "مش هقول زى كل مره يا جماعه نهدى نفسنا و نتكلم بهدوء علشان مفيش فايده<br />انا هقول كلام سنعته من الشيخ خالد الجندىو هو انه قال راى عجبنى اولى<br />الراجل قال ان الموسيقى حلال مش حرام و الا هنحرم صوت البلابل و حفيف الشجر و هدير الامواج و ما شابه<br />بس اكيد لما قال كدا قصد على الاقل صوت الموسيقى مجرده<br />لكن اللى يخليها تبقى حرام هى الكلمات اللى بتتحط عليها ورد فعلنا تجاهها<br />دا كان كلام خالد الجندى<br />اتناقشت مع ناس كتير لانى فعلا بحب الموسيقى و بحب الاغانى جدا<br />و دايما حاسه بتانيب ضمير لانى عارفه انها حرام<br />حاولت اقنع نفسى انها حلال مقدرتش<br />اصل بالعقل محدش يقول ان اغنيه لنانسى عجرو و لا لعمرو دياب و بالكلمات اللى عارفينها حلال<br />بس برجع اقول بلاش نحجر على راى بعض<br />و يا ريت حد يدينى راى وسط ف موضوع الاغانى دى<br />حلال و لا حرام<br />عايزه جواب نهتئى<br />و شكرا مقدما"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 16
subject = "فعلا لا حول ولاقوة الا بالله"
author = "BATISTUTA"
posted = "2006-09-19"
text = "عندما ذكرت فى تعليقى السابق عمرو دياب كان ذلك بقصد السخرية فقط وكنت اعلم ان احد من المعلقين ما هيصدق ويقولى احنا نقصد اغانى اسلامية على العموم ليس هذا موضوعى .<br />بالنسبة للموسيقى فهى اصل الداء فالاصل فى الكلام المباح فانا اتكلم فى اى موضوع فهذا حلال ان لم يكن لغو .<br />فلو كانت اغنية اسلامية كانت او وطنية بدون موسيقى فهى حلال اختلطت بها الموسيقى فحرمت تماما كالماء فهو حلال ولكن ضع عليه قطرة خمرة افسدته .<br />ولهذا الموضوع حديث شريف رائع \"ليكونن من أمتى أقواما يستحلون الحرير والخمر والمعازف \" والمعازف هى بالطبع الموسيقى فهل اقتنع بكلامك وارفض اقوال الرسول .<br />وصدق الرسول عليعه الصلاة والسلام فيما قال فنحن نرى فعلا فى عصرنا هذا اناس لا يجدون فى الغناء والموسيقى اى عيب .<br />وهناك ملحوظة اخرى احببت ذكرها (انا افعل الذنب وانا اعلم انه حرام اهون على من ان افعله عن اقتناع بانه ليس عيب او معصية واجادل فى ذلك تماما كموضوع الحجاب للفتايات تخبر بعضهن بان الحجاب فرض ذكر فى القرآن تقول لك لما اقتنع الاول .<br />ملحوظة اخرى (لم اعلق على الاغانى الهابطة مما نتعرض له فى دنيانا لانها حرام سواء بموسيقى او بدون فلم يعد الكلام مباح بعد ذكر العيون والجفون وغير ذلك )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 17
subject = "أنا زهقت من كتر الكلام"
author = "معاذ محمود عامر"
posted = "2006-09-19"
text = "بصوا بقى أنا زهقت من كتر الكلام هنفضل نتكلم في الموسيقى اللي العالم كله بيعتبرها من الضرورات الحياتية<br />عموما أنا لسه مقتنع بوجهة نظري لأن شايفها صح ومرتاحلها زي كل واحد ميحترم وجهة نظره<br />لنيفين لو انتي مقتنعة ان الموسيقى حلال والمشكلة في الكلمات فكده انتي سهلتي الموضوع على نفسك جدا لأن الكلام حتى لو كان حب مفيهوش خلاف حتى عند السلفيين<br />ودليلهم<br />بانت سعاد فقلبي اليوم متبول<br />متيم اثرها لم يفد مكبول<br />اللي كتبت في الرسول ودي كانت بدايتها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

[[comments]]
order = 18
subject = "بس أن برضه أشعر بالاطراء"
author = "معاذ محمود عامر"
posted = "2006-09-19"
text = "برغم وجع الدماغ الي أنا سببته واللي اتسببلي الا ان أنا أشعر بالاطراء لاني قدرت اني أعمل أثر<br />ومناقشة مطولة حول الموضوع ده<br />ومتهيألي كده ان أدب الحوار كلنا هنلتزم بيه بالممارسة لأنه خبرة حياتية قبل ميكون خبرة ذهنية وشوية قواعد<br />وقبل مخش أنام أحب اخيي الأخ حمدي والاخ باتيستوتا<br />واحب أشكر عشرينات الي مقدرش دلوقتي أعيش من غيره ونلتقي في معركة أخرى سلااااااااااااااااااااااااااااااام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124410/http://www.20at.com/article2.php?sid=1238"

