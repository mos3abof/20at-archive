text = "وانا واغلب من علقوا ومتفقين معى ،مقتنعين جدا بما نعتقده ونثق انه صحيح الاسلام.<br />ولك ان تعرف ان هذا ليس اختلاف رأى او فكر بل اختلاف فقهى ودائما نأخد بما اجمع عليه العلماء وابحث لترى على ماذا اجمع العلماء عموما الدين ليس حكرا على احد ولك ان تعتقد فيما تشاء وعلينا النصح وحسابنا جميعا عند الله فالمخطئ يجازى والمصلح يثاب وشكرا على اداب الحوار"
