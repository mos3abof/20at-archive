text = "كنت اركب القطار القشاش من القاهرة لبنها والقطار القشاش هو اللى بيقف فى كل المحطات<br />وركنوا القطار القشاش فى قها لمدة ساعتين علشان القطار اللى لسة هيقوم من القاهرة بتاع السياح هيعدى وبيوسعوا لة السكة وكل القطارات اللى على الخط قدامة لازم تخزن فى المخازن بركابها لغاية سعادة قطار الاكابر السياح يعدى وما يعطلوش حاجة<br />يلعن ابو السياح ويلعن ابو الكبير اللى جابهم البلد دى<br />ملعون ابو بتوع السياح ولاد [ *** ] اللى خلونا كلاب ودرجة تالتة فى بلادنا<br />ساعتين مخزنين فى محطة قها علشان قطارهم يعدى ولاد [ *** ]"
