subject = "مش الناصري بس ..ده كله"
author = "محمد السيد"
posted = "2005-11-30"
text = "طبيعي جدا .... مش الناصري بس .... ده كل الأحزاب كمان ...<br />واللي فرق مع باقي الشخصيات الحزبية التانية إنها بتنجح باسمها وشخصيتها ... مش بأحزابهم ...<br />بعكس الإخوان مثلا ... اللي بينجحوا مع الجماعة وباسم الجماعة .... و سياسيا ده الصح علي فكرة ...<br />ليسارين كلهم انضموا لجانب الدولة ... زنسوا حقوق العمال والحاجات اللي كانوا بينادوا بيها زمان ...<br />القوميين ... وبعد النكسة و حكم عبد الناصر .. انتهي الفكر تماما ... وإن كان البعض بيترحم علي خطب وشخصية عبد الناصر ....<br />الليبراليين ... بداية الوفد أيام الملكية كانت رائعة ... لكن بمرور الأيام بات مشكلته ... وهي اعتماده علي الباشاوات والإقطاعيين ... وبكده كتب نهايته .... وكانت نهايته علي يد نعمان جمعة في انتخابات الرئاسة ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-08-15"
