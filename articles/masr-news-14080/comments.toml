author = "صفقة مع الامن"
posted = "2009-11-18"
text = "ربما هناك صفقة ما<br />الافراج عن الاستاذ الدكتور ابو الفتوح فى مقابل الا يستقيل المرشد ويظل على كرسية<br />لان الامن منزعج جدا من حكاية الديمقراطية فى الاخوان<br />فعلا هناك رائحة صفقة ما"
archived = "2009-11-19"
