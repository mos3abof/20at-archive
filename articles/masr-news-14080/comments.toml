subject = ""
author = "افراج لية ؟"
posted = "2009-11-17"
text = "لماذا اعتقلوك ؟<br />ولماذا افرجوا عنك ؟<br />وبعد 5 شهور سجن لدكتور طبيب حائز على اعلى الشهادات العلمية فى الطب وشخصية مصرية مؤثرة ومحترمة فى الوسط العربى<br />هل هو عبث امنى ؟<br />واحد لواء امن دولة شايف نفسة شوية وبيقول انا هنا<br />هل لا يوجد قانون واضح فى البلد دى وكل رتبة بيتصرف على مزاجة ؟<br />احنا عندنا دستور وقانون والا كل شىء ماشى ببركة مولانا ولى النعم سلطان البلاد"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040209/http://www.20at.com:80/masr/news/14080-2009-11-17-14-25-58.html"

[[comments]]
