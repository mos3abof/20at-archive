subject = ""
author = "عسكر وحراميه"
posted = "2009-11-17"
text = "خلينا في لعبة العسك والحراميه بين الحكومة والاخوان<br />مش عارفين حتنتهي امتى اللعبة السخيفه دي<br />لا الحكومة عايزه تكبر دماغها ولا الاخوان عايزين يكبروا دماغهم<br />والنتيجة<br />الشعب خسران وبيخسر وحيخسر<br />فلوس لقمة العيش والدواء بتتصرف على الفرق المنية<br />دا كلام"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040209/http://www.20at.com:80/masr/news/14080-2009-11-17-14-25-58.html"

