subject = "القضاة اولا 000وثانيا"
author = "الاستاذشيكو"
posted = "2006-05-28"
text = "اولا المقال رائع من كل الوجوة بس الكلام علي ان الدوله لم تستطيع ان تخترق النظام القضائي غير صحيح بدليل اختبارات النيابه العامه او الاداريه والقواعد الخاضعه لها جعلت من الشرفاء الذين يدخلون الي سلك النيابه ثم القضاء تتم بصورة غير شفافه وغير نزيهه ولكن امالنا كبير في الشرفاء من القضاة لوقف هذا العبس والاختراق من قبل الدوله للمؤسسه القضائيه<br />ويحيا قضاء مصر مستقل دائما"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084433/http://masr.20at.com:80/article.php?sid=365"
