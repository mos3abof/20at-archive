subject = ""
author = "حوار الطرشان"
posted = "2009-06-29"
text = "واذا كان النظام القمعى وضباط امنة لا يعرفون النت ولا يقرؤون ما كتب فية يبقى اية فايدة الكتابة<br />واذا النظام دفع لشوية ماجورين شوية فلوس واعطاهم خط مجانى وكمبيوتر وجعلهم يعملون مواقع ومنتديات ويوتيوب تؤيد النظام وتشتم الخونة المارقين<br />يبقى الموضوع مجرد تسالى<br />اللى عايز يغير لازم يبقى عندة القوة<br />انما الكلام لا بيودى ولا بيجيب<br />والنظام الايرانى باكمل عافية وشوية العيال سكتوا والحرس الثورى الايرانى مستعد لسحق اى اضطرابات<br />ولكن ما شهد بة الجميع انة كانت انتخابات نزيهة وان فى البلد حركة بناء وتنمية قوية<br />ويكفيهم ان معظم مليونيرات دبى ايرانيون او من اصول ايرانية"
archived = "2010-01-03"
capture_url = "https://web.archive.org/web/20100103172123/http://www.20at.com:80/masr/hot-topics/12508-2009-06-29-12-59-41.html"

