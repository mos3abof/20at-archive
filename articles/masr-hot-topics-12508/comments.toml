author = "كريم قباري"
posted = "2009-06-29"
text = "موضوع هايل يا فتحي، وأتذكر أنه يفتح الباب من جديد لمناقشة أثر الإنترنت على السياسة، خاصة وأنها أصبحت سلاح الناشطين لتعبئة الجماهير، ولكنها في نفس الوقت تبرز إشكالية كبيرة وهي أن هناك من يستتر وراء الإنترنت ويظلها هو الهدف وليس والوسيلة، فالمشكلة أننا نعتقد أننا تخلصنا من سلبيتنا باستخدام الفيس بوك أو تويتر أو يوتيوب في فضح قمع حكوماتنا، لكن مادامت تلك الفضائح ظلت قابعة وراء الشاشة، فلن نستفد شيئاً.<br />ما أقصده أن الإنترنت وسيلة للتغيير وليست هي الهدف في حد ذاته.. لكن مادمنا نجعلها غاية ننشر عليها سلبيات الوضع الراهن بدون التحرك \"أوف لاين\" للتغيير.. فلا فائدة من وراء الإنترنت.. سياسياً.<br />شكراً على موضوعك الهايل الذي يثير كثيراً من النقاش"
archived = "2010-01-03"
capture_url = "https://web.archive.org/web/20100103172123/http://www.20at.com:80/masr/hot-topics/12508-2009-06-29-12-59-41.html"

[[comments]]
