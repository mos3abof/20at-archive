subject = ""
author = "أحمد فتحي"
posted = "2009-07-01"
text = "مقال جميل كعادة موضوعاتك لكنه يثير مجموعة من القضايا في مقدمتها المصداقية والتحقق من الصور ومقاطع الفيديو لأان فقد هذه الأداة لمصداقيتها سيكون وسيلة الأنظمة أو الحكومات للترويج لعدم أهميتها، فعلى سبيل المثال تبين في الانتخابات الايرانية الأخيرة أن أنصار موسوي قدموا للعالم بعض صور ومقاطع فيديو مفبركة لم تكن حقيقية. وعليه فمن الأهمية بمكان التأكيد على ضرورة كتابة بينات الصورة او الفيديو بشكل توثيقي ككتابة : مكانها وزمانها وتاريخها بل وأجواء الصورة التي تقوم بإلتقطاطها<br />وأيضا الميديا الجديدة أو الاعلام الجماهيري وحده لا يكفي ما لم تتوافر إرادة على الأرض للتغيير"
archived = "2010-01-03"
capture_url = "https://web.archive.org/web/20100103172123/http://www.20at.com:80/masr/hot-topics/12508-2009-06-29-12-59-41.html"
