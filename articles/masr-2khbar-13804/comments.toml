text = "السائق امير حليم وبباوى مساعدة<br />زمان ايام الاحتلال البريطانى كان الانجليز بيشغلوا النصارى فى السكك الحديدية وبيعطوهم اولوية مطلقة ويستبعدوا المسلمين<br />ويظهر ان ولادهم ورثوا وظايفهم<br />والسؤال ازاى يعطوا قيادة قطار ومساعدة النصرانى لية ما يبقاش السواق نصرانى ومساعدة مسلم او العكس<br />انا اعتقد انها مؤامرة ارهابية من نصارى المهجر لقتل المسلمين<br />وهى حادثة متعمدة"
