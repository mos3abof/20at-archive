text = "انا مواظبة على الزنجبيل والشاى الأخضر والبردقوش بس مش عشان أخس<br />لكن الشاي الأخضر مضاد للأكسدة والزنجبيل بيريح الجسم وبيهضم الأكل وبيدفي وبيعالج البلغم ونزلات البرد عندى ..اما البردقوش بشربه دائما بعد الغذاء لأنه بيمنع الإنتفاج وبيهضم الأكل وبيريح المعدة جدا خاصة بعد الوجبات الدسمة"
