text = "صحيييح الشاي الاخضر مبيعملش اي حاجه بس انا بحبه بحسه بيريح واحسن مالنسكافيه او الشاي العادي فالطعم .. وهو كمان مضاد للاكسده ودي حاجه كويسه جداا جدا .. اما الزنجبيل حلو و فعلا بيخسس لكن انا عمري ماشربته انا شفت واحده قريبتي كانتش بتعمل رجيم لكنها كانت بتشرب جنزبيل و بتمشي كتيير جداا ..<br />فخست كتيير اوي مااللي بتعمله وكانت بتاكل عادي جداا"
