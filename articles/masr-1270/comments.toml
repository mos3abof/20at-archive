[[comments]]
order = 3
subject = "خسارتك يا مصر"
author = "المصرى الحزين"
posted = "2006-12-10"
text = "فضايحنا بقت عالميه<br />أرسل هذا التعليق بواسطة : المصرى الحزين<br />اناشد كل الدول والمنظمات والمؤسسات التى تقوم بارسال المنح والمعونات المقدمه للسراب المسمى \"العمل الاجتماعى والانسانى فى مصر\" بعد الفضائح المدوية والجرائم البشعة والمخزية التي حدثت مؤخراً من قتل واغتصاب الاطفال والمراهقين على يد عصابات منظمه، بل وتتحدث الأرقام إن عدد المشردين تجاوز المليونين من صغار السن بينما الجمعيات الخيرية تنهال عليها المعونات بالملايين فى الداخل ومن الخارج، ولايدرى احد اين تذهب؟، والمسؤولون مشغولون بالاجتماعات والندوات فى فنادق الخمس نجوم بحجة البحث عن حلول ! بينما الضحايا يلقى بهم من فوق أسطح القطارات.<br />محمد زين - القاهرة<br />نقلا عن صفحة اراء حره بموقع bbc ولا تعليق<br />09/12/2006<br />هنا لندن bbc<br />أرسل هذا التعليق بواسطة : المصرى الحزين<br />http://news.bbc.co.uk/hi/arabic/talking_point/newsid_6165000/6165003.stm<br />09/12/2006"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214311/http://masr.20at.com:80/article.php?sid=1270"

[[comments]]
order = 4
subject = "كل الكلام لعب فى الوقت الضائع"
author = "عبد المنعم المصرى مقيم بالمهجر"
posted = "2006-12-10"
text = "بالامس كتبت رايى فى موضوع الكلاب والقاعدة . واليوم انبه فقط لمن لم يستوعب جيدا ما قلته .. وقبل ذلك اشكر ابن بهية ابن مصر الذى علق على ما قلته فاقول لكم فى موضوع اليوم ..<br />كل ما تقراون عنه او تسمعون من اجتماعات لمناقشة مسيرة الاصلاح هو لعب فى الوقت الضائع فلو تاملتم من اعد لهذا الاجتماع ومن الذى تناقش فيه وتحاور وما هى توصياتهم للاصلاح وما هى الخطوات العملية التى قرروا اتخاذها لحل مشاكل الملايين فقد تستغربون لما جمع الشامى على المغربى من اصحاب الاتجاهات .. والكل يعزف على وتيرة واحدة تدغدغ مشاعر الناس الا وهى الدين .. يا اخوانى انا اعيش فى بلد علمانى واقسم بالله العظيم ان سلوك افراده حكاما ومحكومين افضل مليون مرة من الانظمة التى تدعى انها تطبق الشريعة وتعمل بدستور الله .. فهنا تجد الكنيسة وتجد المسجد وتجد المعبد اليهودى وتجد من لا يؤمن اساسا باى دين وتجد ايضا حانات الخمور والفجور وكل صور الانحلال ومع ذلك لكل شخص الحق ان يتجه حيث يشاء دون مانع او اعتراض ..<br />والاهم من ذلك هو الحاكم الذى يعرف انه جاء ليكون حكما بين الدولة والمواطن او المقيم .. كما يعلم انه ليس معصوما من المساءلة امام الشعب بل ويتعدى الامر ذلك كله انه يخاف من الشعب وثورته ويعمل الف حساب ويعلم ايضا انه اما ان يدخل التاريخ بما انجزه لبلده فى فترة حكمه او سيدخل الى مزبلة التاريخ لو حاد عن الهدف الذى اختير من اجله وايضا لان الدستور ينص على انلايزيد شخص اكثر من دورتين فقط فبذلك يخشى ان ينصب غضب الشعب عليه ويقذفونه بالاحذية عند رحيله .. لم يتكلم احد عن الدولة المدنية او الدينية او غير ذلك .. ودعونا نتامل قليلا ما مفهوم الدولة اساسا ثم ما هو الدين فى راى المنظريين واص<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214311/http://masr.20at.com:80/article.php?sid=1270"

[[comments]]
order = 5
subject = "أخي العزيز عبدالمنعم"
author = "إبن بهيه"
posted = "2006-12-10"
text = "أخي العزيز عبدالمنعم<br />هي الدنيا كده .. مؤتمرات وناس عايشين عليها وناس عايشين على نقلها وناس عايشين على التعليق عليها وآهي دنيا يا عمونا .. والله كلامك صح بس تقول إيه للي مش عايز يتحرك ومصمم يقع في البير المحفوره ليه من سنين .. تقوله يا عم فتح .. يا عم حاسب .. هناك بير .. يقولك أصلك أعمى ... فاكر نفسه هو المفتح لوحده .. وهو الحزين أعمى بصر وبصيره وحواليه شوية ألاديش منتفعين من الفرح المنصوب في انتظار الليله الكبيره ... ليلة<br />عرس بهية على الولد الصهيوني اللي راح يغتصبها من غير حتى عقد عرفي ...<br />ربك يعدلها يا أستاذ عبدالمنعم<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214311/http://masr.20at.com:80/article.php?sid=1270"

[[comments]]
order = 6
subject = "الى المناضل ابن مصر ابن بهية"
author = "عبد المنعم المصرى مقيم بالمهجر"
posted = "2006-12-10"
text = "يا خى العزيز ويا اخوانى اولاد مصر لطيبين ,انا اعرف تماما ما جاء براى ابن بهية من مؤتمرات واجتماعات وما اعرفش ايه كل دا انا باعرفه كويس وكمان باعرف ان دى ارزاق ربنا بيوزعها بمعرفته , لكن المسالة موش زى ما حضرتك بتقول وان ما فى اد بيسمع لغاية ما يقع فى البير ويتم اغتصاب مصر بدون عقد عرفى كل هذا الكلام جيج لكن للامانة ان من يقدر على فعل اى شيئ فليفعل ولا ينتظر ودى موقعة لا بد من خوضها او هى غزوة ضد من يسلبون الناس حقوقهم ولو استسلم الجميع وكل دفن راسه فى الرمل معتقدا ان احدا لا يراه ما دام لا يري هو شيئ فستكون النهاية وعموما لا بد من نهاية ويجب ان يكون الانسان مثل الشجرة يموت واقفا, وليعمل ما فى وسعة لانهاض الناس من سباتهم وانا اردت ان اخص من يعملون المؤتمرات والاجتماعات ليبحثوا مشكلة دولة مدنية ام دولة دينية وقلت رايى كما اراه ويجب على الجميع الاستمرار فى انهاض الناس وتوعيتهم فربما كما يقول المثل ان العيار اللى ما يصيبش بيدوش فربما ينصاب النظام وفى اضعف الاحوال يندوش والكل مدعوا لشحذ الهمم والله سبحانه وتعالى فال واعدوا لهم ما استطعتم من قوة ترهبون به عدو الله وعدوكم صدق الله العظيم فالنظام والمؤتمرين بدون حراك او فعالية هم اعداء الله واعداء المواطنون ومقاومة ظلمهم امر مطلوب من الله وبدلا من الاجتماعات لمناقشة تسمية الدولة ب مدنية او دينية فلياخذوا العبرة والعظة وليتعلموا من لبنان بلد ال 3 مليون مواطن وكيف تم جمع مليون اليوم لمحاولة اسقاط الحكومة وايضا ليرى النظام الحاكم الذى يؤيد حكومة لبنان المدعومة من امريكا واسرائيل فبالتالى هى مثله ولكن لم تستعمل العنف ضد المعتصمون فى لبنان , فلا المعارضة فى مصر تحاول اخذ نموذج لبنان وتفعل مثله ولا<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214311/http://masr.20at.com:80/article.php?sid=1270"

[[comments]]
order = 7
subject = "وسطية الاسلام"
author = "bakryhasan"
posted = "2006-12-10"
text = "وهل يجب علينا ان نتخلي عن الدين حتي نقيم دولة عادلة ديمقراطية حرة. للجميع حق المواطنة فيها. لماذا لا ننظر لايهم اكثر عدلا ورحمة وعدلا هل بنظام اسلامي وسطي عادل ام نظام علماني ليبرالي دعونا ننظر بموضوعية وعلمية الي مميزات نظام اسلامي وسطي او غيره العلماني الليبرالي.لماذا كره الدين الذي يبديه بعض العلمانيين والليبراليين تجاه الاسلام لمجرد الكره فقط.من حق كل انسان ان يعيش حر في فكره ورأيه وعمله طالما لا يتعدي ذلك الي حدود حريات الاخرين اذا المنطق يقول اي نظام يكفل لك هذا ثم يأتي بعدها تقييم موضوعي لتلك الانظمة.الدين الاسلامي وضع نظام حياة وسطي عادل حر لاتباعه ولكل من اراد ان يعيش في ظله والعلمانية الوضعية ايضا وضعت نظام ديمقراطي حر السؤال ايهما اكثر قربا وعدلا ورحمة وحرية لنا بموضوعية وعلمية .فهل يجب علينا تغييب الدين حتي تكون دولة مدنية .الدولة المدنية هي التي تفكل لك حرية التعبير والرأي وتعطيك حقوقك وتأمرك بواجباتك وتتكفل لك بمقومات حياتك الخ فهل صحيح الاسلام لا يكفل للجميع مسلمين ومسيحيين كل ذلك .الذي ربما يغيب عن البعض ان الاسلام في عباداته الواجبة خص بها المسلمين ام معاملاته فقد خاص بها جميع الناس يتساوي في ذلك مسلمين وغير مسلمين بعدل لم تجد له مثيل في اي نظام اخر شكرا لك ."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214311/http://masr.20at.com:80/article.php?sid=1270"

