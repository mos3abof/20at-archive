order = 0
subject = "مناقشات بزنطية ليس هذا موعدها"
author = "اتقوا اللة- هل حللنا كل مشاكلنا لنناقش هذة الفروع"
posted = "2006-12-09"
text = "هل حللنا مشكلة البطالة والشباب اللى مش عارف يتزوج والبنات العواتس<br />هل حلينا مشكلة الجودة فى التعليم<br />هل حلينا مشكلة التصدير<br />هل ببنينا مدت جديدة بعد ان اصبحت القاهرة 18 مليون<br />ماهو اقتصادنا ونقاط القوة فية ونقاط الضعف<br />هل عندنا خطة للتصنيع وماذا نصتع؟<br />ماذا نفعل كشعب لمساندة الحكومة؟<br />سهل ان ننقد ولكن ليس من السهل ابدا ان نعرض افكار تحل مشاكل البلد<br />كيف ندرب العمالة المصرية؟<br />كيف يخطط المحافظون لتعمير المحافظات وايجاد فرص للعمل<br />ارجوكم كونوا جادين ولو مرة واحدة<br />واللة المستعان"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214311/http://masr.20at.com:80/article.php?sid=1270"

