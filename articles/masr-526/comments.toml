[[comments]]
order = 7
subject = "دمهم في رقبتة"
author = "ام العيال"
posted = "2006-06-16"
text = "والله دمهم في رقبة حسني ليوم القيامة منة لله.. اصل دول مش تبعة ..يمكن هوة اصلة مش مصري<br />لانه كان اتحرك دا حتى اسمهم احنا مانعرفوش ولا حتى صورهم<br />دا الجواسيس بنعرفهم وبنحفظ صورهم مابالكم بالشهدا ولا حتى نعرف عنوانيهم علشان نهنئ اهلهم<br />لية بس كدة يا بلد<br />حتى لما بنموت بنحتسب عند الله شهدا<br />بس عند حسنى اقل من الحيوانات<br />يا حسني غور بقى<br />علشان تحيا مصر وتعيش"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619135953/http://masr.20at.com:80/article.php?sid=526"

