[[comments]]
order = 10
subject = "فين امن الدولة"
author = "أبو أسامة"
posted = "2006-06-17"
text = "واللهى يا ناس منا عارف مين بيحمى مين<br />ومين بيحمى مينمن مين اسهلها لكم شوية<br />هى مش كيميا . يعنى بنشوف شوية فتوات<br />وبلطجية عملين يضربوافى الشباب المصرى<br />ويسحلوه وتيجى تسأل مين دول يقولك امن<br />الدولة طيب امن لمين ولأى دولة ماهى الدولة الى قرفانا جنبنا على الحدود<br />والمفروض شوية البلطجية دول يخدوا السنج<br />والمطاوى ويرحوا يحربوا البلطجية الى<br />زيهم وكل يوم يقتلوافى اخوانهم ولا امن الدولة ميتحققش الا متعملوا امن دولة على ولاد البلد جتكوا خيبة منتوش فالحين الا فى ضرب الغلابةلكن ولادال الى زيكم بتحسوا نحيتهم بالقرابة علشان كده مبتعملوش لهم حاجة وتقبلوهم وتعزموهم علشان يكلوا فى ولاد بلدكم بالزمة دى ماهى خيبة<br />ولا ايه يا عم نجم بالزمة ماهى حاجة تقرف<br />ويا ريت الأخ جمال يكون سمعنى ويودلهم<br />شوية من بتوع امن الدولة علشان يبقى اسم على مسممى ونشوف بقى الفتونة ."
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619135953/http://masr.20at.com:80/article.php?sid=526"

[[comments]]
order = 11
subject = "بحبك يا عم أحمد يا بو نجم"
author = "أمير"
posted = "2006-06-17"
text = "ياريتك تقرا رسالتي دي..أنا بحبك و الله .. و كل المصرييين الشرفاء بيحبوك..لما بشوفك بأفتكر أبويا الله يرحمه..كان يشبهك..كافح وتعب علشانا...شال الصخر علشان يربينا و لا عمره كل ولا إشتكي إلا لربه..نفسي أشوفك وأخدك في حضني و أبوس راسك...ربنا يخليك لينا و يمد لنا في عمرك..أنا بلدياتك من الزقازيق .. طبيب بشري .."
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619135953/http://masr.20at.com:80/article.php?sid=526"

[[comments]]
order = 12
subject = "اللهم اجعله خير بجد"
author = "مخنوقه وهطق"
posted = "2006-06-18"
text = "الله يخليك يا نجم وينور عليك كمان وكمان انت وكل الى بيحبوا البلد وعاوزينها احسن بس لو نبطل ننسى اللى فات احنا يا جماعه العيب فينا مش فيهم احنا اللى بنسى بسرعه تحصل حادثه تقوم الدنيا وتقعد على مفيش يعنى بتوع العباره مش مصرين وماتوا من غير ذنب ولا بتوع القطر اللى اتشوا ولا الطياره اللى لسه بيحققوا فى سبب سقوطها وبرضو ملناش تمن ولا ديه لا جوه البد ولا بره بس لو كنا مش بنعدى وننسى وكل حادثه من دول يقوم الشعب كله يطلب بحقهم مكنش حد يجرئ انه يرخصنا فاكرين الاتنين الكورين للى ماتوا فى حادثه على طريق الصعيد الناس فى كوريا (كوريا يا اخونا بنت امبارح) عملوا مضاهرات طلبوا بتحقيق وقوموا الدنيا لانهم مش عاوزين يسكتوا لحد ما يرخصوا زينا يبقى بجد العيب فينا وعلى رأى مثل امى بتقوله يا فرعون ايه فرعنك ملقتش حد يلمنى والسلام عليكم"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619135953/http://masr.20at.com:80/article.php?sid=526"

