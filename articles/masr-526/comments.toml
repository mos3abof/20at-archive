posted = "2006-06-16"
text = "الشهيد ايمن حامد صديق عزيز تعرفت الية من قرب فهو رحمة الله مثال جيد للشاب المصرى والاخلاق الشرقية<br />سؤالى<br />لماذا التكتم على الحادث وكأنة عار علينا ؟<br />ولماذا لانعطيهم حقهم ؟<br />ولا انا نسيت انهم من مصر والمصرى بطبيعة الحال ليس لة حق"
