[[comments]]
order = 19
subject = "انا مش مصدق"
author = "Max"
posted = "2006-06-23"
text = "انا خلاص هتجنن من المنافقين هو فيه حد بيحبه قلولى عليه وانا اقله عمل فينا ايه<br />ولا انتم مش من مصر ولا حزب وطنى ولا ايه دماغكم اكيد عمرك ماحد نزلك من ميكروباص وشتم وطلع عينك ولا سحل اختك فى الشارع عشان صحفية وبتصور الظلم فى وسط البلد ولا عمرك ما جريت مع الشباب بتوع كفايه وهما بيجرو على نادى القضاة عشان الحيوانات المفترسة الى معندهاش دماغ<br />ولا يهمهم غير كراسيهم<br />واكيد طبعا منمتش مرة فى المحطة بتاعت السكة الحديد عشان مستنى قطر الصخافة عشان معكش فلوس ويجى واحد يقولك قوم يروح امك محضر تشرد وانته منمتش غير وانته قاعد ولا مددت ولا عملت حاجة بس منظرك مش عاجبه ولا يا عيبنى الست بياعة الجرانين الى قاعدة على الرصيف وسحلوها فى الشارع ده غير تقطيع هدو الصخفيات والبنات الى فى المظاهرة كانك بتسرق مش بتطالب بحقك وكرهك للظلم والموضوع قرب على النهاية الناس الى بتحب البلد هى الى هتحارب اليومين الجايين والناس الى معاهم معاهم عليهم عليهم ربنا يخدهم ويطلع عينيهم ويعرفو يعنى ايه ظلم ولو مسكتش هتجنن زى ما بنشوف الناس الى فى الشارع معظمهم خريجى امن الدولة دخلو عقلين اتخرجو مجانين وبردو تعيش مصر لان لسه ولادها بيحبوها"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625165945/http://masr.20at.com:80/article.php?sid=526"

