[[comments]]
order = 1
subject = "الريس ماله"
author = "زهقان م الحر"
posted = "2006-06-15"
text = "ماله الريس؟<br />أنا مبخافش وحفضل أقول<br />كلمة حق عليها مسئول<br />إن الريس راجل طيب<br />وبشعبه دايمًا مشغول<br />مشغول إنه يلم فلوسنا<br />بره سويسرا يحوشهالنا<br />وفى حسابات سرية يشيلها<br />نفسه يأمن مستقبلنا<br />عنده إيمان وضميره سليم<br />بيجوعكوا لجل تخسوا<br />آه يا شعب محتاج لرجيم<br />من جهلكوا بتقولوا بطالة<br />وان الأحوال مش شغالة<br />دا الراجل نفسه يريحكم<br />هى الراحة تبقى عوالة؟<br />أما حكاية المنتجعات<br />ليه تسموها معتقلات<br />ليه الظن<br />وسوء النية<br />نفسه يفسحكوا يا بهوات<br />أما الكرسى واللى تقال<br />دا كلام مش محتاج لسؤال<br />الغلطة دى غلطتنا يا عالم<br />إن مجبناش كرسى تيفال<br />والله انتم ظالمين الراجل<br />ضيع عمره ومين يستاهل<br />حتى الأكل بياكلوا بدالنا!<br />بعد دا كله... ماله الريس؟"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619135953/http://masr.20at.com:80/article.php?sid=526"

