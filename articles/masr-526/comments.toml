text = "هما كلمتين؟<br />و هما الكلمتين؟<br />قالهم عم النجم<br />نجم النجوم<br />من أشعار احمد فؤاد نجم<br />منقول \" محمد حسن غنيم\"<br />من شعر أحمد فؤاد نجم<br />حالتنانا<br />ماتسرش انسان<br />وحالنا<br />يصعب ع الغلبان<br />لكن يا خلق علينا لسان<br />لو جريناه ع الصلب<br />يسيل<br />محمد حسن غنيم"
