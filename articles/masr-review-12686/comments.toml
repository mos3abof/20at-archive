text = "فى ايه يا جماعة انتوا بتنقدوا الفيلم ولا بتنقدوا الشعب!!<br />اولا الفيلم جميل جدا جدا واللى ميفهموش يبقى ميعلقش ويدارى خيبته انما بيشم فى الفيلم وهو من احسن الافلام الموجودة طيب ميروح يشوف عمر وسلمى وباقى الافلام العبيطة<br />ثانيا ايه المشكلة ان الفيلم يجيب مليون ولا عشرة فى اليوم هو المليون دة خدوا منك اللى عايز يروح السينيما يرفه عن نفسه يروح واللى عايز يتبرع بالفلوس دى يتبرع مش يقول شعب عبيط ما عبيط الا انت<br />كل واحد قاعد يتكلم ويشتم فى الشعب ودلاقيه هو وعيلته دخلوا الفيلم انما حنعمل ايه فى ازدواج الشخصية اللى بنعانى منه<br />مش عاجبكوا سينما احمد حلمى المحترمة امال سينما الاسفاف بتاعة محمد سعد وسينما الاباحية بتاعة عادل امام نقول عنهم ايه وكل واحد بياخد عشرة مليون علشان واحد يضحك علينا ببوحه وتوحة والتانى علشان يبوس يسرا شوية ارحمونا بقى"
archived = "2009-08-14"
