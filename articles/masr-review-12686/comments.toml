text = "السلام عليكم<br />الفيلم بمنتهى البساطه بيتكلم عن الشخص الاناني اللي مش بيدور غير على نفسه وبس وملوش دعوه عن الحقيقه المهم نفسه وبس<br />كام مره عاد المشاهد عشان في الاخر لما اتخلص من انانيته فهم الموضوع كان ماشي ازاي<br />طبعا الكل بيقول ان اخر ربع ساعه تقرف بالدرامه دي انا بقى بكيت من اخر ربع ساعه لما كان حلق شعره عشان يتضامن مع والدته اللي شعرها هيقع لما تتعالج بالكيماوي رغم انه مقبل على فرحه ولازم يظهر بأحسن صوره وفي الاخر بيكسب حب الجميع بما فيهم منافسه في العمل وبيضحي عشان وهو على بعد دقائق من زفافه عشان ينقذ عيلته<br />شكرا لجميع من قاموا بهذا العمل بجد عمل مبدع ومش عيب انه يكون فيه اخطاء شويه بس العيب في امخاخنا التخينه"
