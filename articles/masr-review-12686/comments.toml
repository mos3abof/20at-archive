author = "مليون جنيه يوميا"
posted = "2009-07-21"
text = "ايرادات الفيلم مليون جنيه يوميا<br />دا في فيلم واحد<br />يعني بقية الافلام حيبقى الايرادات خيالية يوميا وشهريا<br />يا جماعة الشيك كشك الله يرحمه قال ان الحج ما ينفعش وفيه ناس جعانين<br />واستشهد بقصة عبدالله بن المبارك لما كان رايح يحج وشاف واحدة ست بتربي ايتام فاعطاها كل فلوسه ورجع تاني وقال لا حج لنا هذا العام<br />يعني مساعدة الجائعين والمرضى اولى من الحج<br />فما بالكم بالسينما<br />يعني مليون جنيه ايرادات مش كان اولى بيهم مرضى السرطان<br />او مرضى الفشل الكلوي<br />او الارامل اللي بيربوا ايتام<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــ<br />يا شعب اصحا المرضى والايتام والمحتاجين اولى بفلوسك من ولاد الكلب بتوع سينما الدعاره والقواده دول<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726002221/http://www.20at.com:80/masr/review/12686-1000-.html"

