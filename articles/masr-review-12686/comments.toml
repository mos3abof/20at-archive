author = "واحد من الناس"
posted = "2009-07-19"
text = "بالنسبة للفيلم فهو فيلم اكثر من رائع من ممثل اكتر من فظيع . بس للاسف احمد حلمي مش عامل الفيلم دة للجمهور كلة<br />هو بيختار طبقة من المثقفين اللي اخدين علي الافلام الاجنبي وما فيها من قصص مشابهه<br />الفيلم تحفة بمعني الكلمة<br />اما بقي بالنسبة للاستاذ صاحب مقال شعب فاشل . هو انا معاك ان الشعب فاشل بس انتا شكلك مش طايق حاجة في الدنيا فارجوا ان تكون ايجابي شوية بلاش كل حاجة زباله<br />وانا عن نفسي بهنيء احمد حلمي بالتمثيل دة لانه بجد ممثل جامد وبيعمل افلام اجنبي ناطقة بالعربية<br />للامام يا احمد وملكش دعوة بكلام المحبطين او الغيورين"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726002221/http://www.20at.com:80/masr/review/12686-1000-.html"

[[comments]]
