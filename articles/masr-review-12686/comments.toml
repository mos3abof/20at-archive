text = "احمد حلمى يتقاضى 5 مليون جنيه عن فيلمه الجديد (عقبال عندكم)<br />3/18/2009 5:04:00 PM<br />خالد فؤاد - خاص - استقر النجم أحمد حلمى على الوجه الجديد رحمة لتشاركة بطولة فيلمه السينمائي الجديد (عقبال عندكم) الذي احتفل ببدء تصويره مؤخراً بداخل بلاتوه رقم 1 باستوديو مصر استعدادا للعودة به لسباق الصيف القادم في نفس توقيت عرض فيلمه السابق (كده رضا) الذي تخطت ايراداته حاجز العشرين مليون جنيه في سباق الصيف الماضي.<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــ<br />الكلاب بتغتني وانت بتفتقر يا شعب<br />من فلوسك يا شعب الكلاب بتسكن في الزمالك والمهندسين وانت مصيرك (اسكان الايواء العاجل)<br />الكلاب عماله تنهش في لحمك يا شعب<br />يا خسارة يا شعب مصر<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــ<br />الاخ واحد من الناس حمدل على السلامه<br />كنت فين الغيبة الطويلة دي"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726002221/http://www.20at.com:80/masr/review/12686-1000-.html"

[[comments]]
