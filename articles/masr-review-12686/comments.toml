capture_url = "https://web.archive.org/web/20090726002221/http://www.20at.com:80/masr/review/12686-1000-.html"

[[comments]]
order = 4
subject = ""
author = "محمود"
posted = "2009-07-20"
text = "والله يا جماعة فيلم حلو جدا و بجد هو مشكلتة انه مش اى حد يفهمه و انا متفق مع \" واحد من الناس \" فى تعليقة ان الفيلم موجه لطبقة معينة من المثقفين و يا جماعة هو بجد السينما المصرية كانت مفتقدة النوع ده من الافلام ة انا دخلت الفيلم اكتر من مرة و مسمعتش حد قال \" ايه القرف ده !!!!! \" او \" ايه الملل ده !!!! \" فعلا الفيلم كان فيه مواقف متشابهة بس كان كل مرة فى اختلاف فى السيناريو اللى بيه كان بيكتشف انه فاهم الناس غلط … و لو على اسم الفيلم هو فى اعتقادى بيوجة الكلمة دى للناس اللى حتحاول تكتشف حقيقة الناس اللى حواليها بجد و الف مبروك انك قدرت تتغلب على حتة الانانية اللى جواك و انك بدأت تبرر للناس مواقفهم … يا ريت يا جماعة افلامه كلها تفضل كده لان بجد اداؤه كان مميز جدا و هو فنان محترم 1000% … هو يستاهل كل خير و منن نجاح لنجاح ان شاء الله"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726002221/http://www.20at.com:80/masr/review/12686-1000-.html"

[[comments]]
