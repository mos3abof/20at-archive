posted = "2009-08-16"
text = "أنا شفت الفيلم وأعجبني جدا و أحب أقول<br />أحمد حلمي فنان بجد مش من تجار الضحك الرخيص<br />و الفيلم ده له فكرتين ، فكرة سطحية و فكرة عميقة<br />الفكرة السطحية هي أسطورة زسيفيوس و تحقيق الأماني بشكل غير متوقع<br />أما الفكرة العميقة اللي المؤلف كان عايز يوصلها للجمهور هي \" لو رجع بيك الزمن تاني ، هتتصرف زي ما اتصرفت قبل كدة ، ولا هتفكر و تعيد النظر في تعملك مع الأمور من حولك؟\" و أحمد حلمي جرب عدة طرق للتعامل مع الدنيا حوله في الفيلم كان منها العنف اللي باء بالفشل و مات برضه ، و وصل في الآخر إلى أنه لا يستبق الأمور عشان ما يظلمش حد ، و ما يكونش أناني و يفكر في غيره كمان ، و يعالج الأمور بعقل و حكمة عشان يكون الغائب الحاضر مش الحاضر الغائب.<br />ده رأيي بالنسبة للفيلم و كمان أعجبني الفيلمين السابقين حتى لو كانوا مأخوذين من أفلام أجنبية<br />لأن السينما المصرية محتاجة تغيير زي اللي بيعمله أحمد حلمي<br />و لو أي حد عايز يكلمني أنا مستعد و ده إيميلي<br />Abu_ollo1<br />hotmail.com<br />و ده الفيس بوك أكونت بتاعي<br />Medo abollo<br />و شكرا"
archived = "2009-09-17"
capture_url = "https://web.archive.org/web/20090917014207/http://www.20at.com:80/masr/review/12686-1000-.html"

