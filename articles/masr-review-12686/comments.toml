text = "الفيلم جميل جدا وفيه معنى كبير اللى بيفهم بس هوه اللى يعرفه بغض النظر عن الضحك والهيافه دى كل واحد بيقول ان الفيلم وحش هوه زى الشخصيه اللى ف الفيلم اللى مثلها الممثل العظيم احمد حلمى … ولازم هييجى يوم ويحس بالناس ميبقاش انانى بيفكر ف مصلحته وبس حتى مصلحته مبيفكرش فيها الا بالهيافه"
