text = "احمد حلمى فنان لا يختلف عليه اثنان<br />وبعدين لو ركزنا كوييس هانلاقى ان اغلب الافلام اللى بتعجبنا مستوحاة من افلام اجنبية اساسا<br />الفيلم جميل جدا…وقبل ما نبص على السلبيات نبص على الايجابيات<br />مشهد احمد حلمى وهو بيقص شعره فى الفيلم اكيد له مغزى جميل<br />بعدين يا جماعة الفنان الحقيقى المفروض مايحطش نفسه داخل قالب معين<br />يعنى زى ماهو فى كوميدى بحت فى دراما بحتة فى كوميدى درامى والعكس<br />وده اللى احمد حلمى بيبص عليه والمفروض نشجع ده مش نهاجمه<br />عموما هى فى الاول والاخر وجهات نظر واكيد هايكون فى تفاوت فيها"
