posted = "2009-07-18"
text = "لما يكون الشعب فاشل يبقى لازم الممثلين فاشلين واغبياء<br />لان الممثل والعصابة اللي عملت الفلم حطه في مخطها تكسب مبلغ ضخم يقسموه على بعض<br />هو دا الهدف من الفيلم<br />فالنتيجة زباله زباله زباله<br />كل حاجه زباله<br />لكن لما يعملوا فيلم ويكسبوا منه مبلغ بسيط ويعلموا الشعب حاجه مهمة من هذا الفيلم<br />كان يبقى افضل<br />وبعدين مرات النطع دا منزلة فيلم اسمه احكي يا شهر زاد كسب كتير لان فيه مشاهد ساحنه<br />النطع دا ما عملش مشاهد ساخنه هو كمان ليه<br />كان جاب مراته منى زكي وعمل معاها مشاهد ساحنه علشان خاطر الناس تكسبر الشبابيك<br />واهو هما متجوزين ويبقى زيتهم في دقيقهم<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــ<br />سلام يا علي عبدالمنعم وسلملي على عبدالمنعم علي<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ تتتت<br />مش رضوى حسن ولا مروى صلاح"
