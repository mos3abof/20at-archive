[[comments]]
order = 9
subject = "أنت المسئول يا ريس"
author = "مواطن مصرى"
posted = "2006-05-08"
text = "المناطب فى جمرك بورسعيد توزع بالواسطة ، فالمبدأ المعمول بة \" أهل الثقة \" فمديرين العموم بالجمرك توسط لهم نائب قوى بمجلس الشعب هو الأستاذ / محمود العربى وهم ليسوا أكفاء لهذة المناصب ويوجد من هم أكفأ منهم وليس لهم وساطة ... يا ريس البلد بتغرق والفساد عم والحقوق ضاعت والأمر يستدعى تدخلك السريع خاصة وأن الأجهزة الرقابية أستؤنست وتفرغت لمصالحها من الأستيلاء على الأراضى والفيلات والشاليهات ونسيت عملها الأساسى ... يا ريس أنت المسئول عن الى بيحصل فى البلد ويا ريت تبدأ بحركة أصلاح شاملة وكل المصريين بيحبوك يا ريس ولازم تتدخل ."
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235347/http://masr.20at.com:80/article.php?sid=273"

