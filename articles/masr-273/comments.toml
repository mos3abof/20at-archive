subject = "لا زم كلنا نقول لا"
author = "مصرى"
posted = "2006-05-05"
text = "الدعاء لله ضرورى لإزاحة الغمة ولكن نحن مطالبين بالإعتراض باللسان واليد وبكل شيء لابد من الوقوف والتظاهر والرفض إحنا مش أقل من الشعوب إللى أسقطت الفساد إللى فيها بالإضراب والتظاهر وحققت حريتها ولا تنسى قول الزعيم أحمد عرابى لقد خلقنا الله أحراراً ولن نورث بعد اليوم."
