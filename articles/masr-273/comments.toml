subject = "فرعون مصر"
author = "احمد امين"
posted = "2006-05-13"
text = "ربنا يخليك ويبارك فى عمرك ونشوفك انت بتتحاكم على من شعب مصر وحب اقولك ويارت تكون شايف او رجلتك شايفه ان احنا زهقنا منك من نظامك الفاسد المستبد وعلى فكره احنا فقنا خلاص من الاوهام ومن الاحلام وحنفضل وراك لحد متغور عنا لا للتمديد.... لاللتوريث....نعم لتعديل الدستور المصرى"
