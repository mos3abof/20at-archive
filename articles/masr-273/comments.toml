subject = "إستغاثة"
author = "عابر القارات"
posted = "2006-05-03"
text = "أستغيث بالله العظيم رب العرش العظيم و أستعيذ به إستعاذة مظلوم و أدعوه دعوة مضطر أن يمحم بقدرته سبحانه و تعالى أى ظلم واقع و محيط بالغلابة و المظلومين فى كل مكان و أن يذيق من ظلمهم عذاب الهوان و الذل فى الدنيا و الاخرة و أن يحتفل كل ظالم هذا العام بعيد ميلاده المشئوم و هو إما فى غياهب سجن بارد لا تستر جسده خرقا باليه أو وهو معلق فى مشنقة فى وسط ميدلن عام أو هو متقلب داخل مصير الطغاة و المتكبرين و هو مزبلة التاريخ"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235347/http://masr.20at.com:80/article.php?sid=273"

