[[comments]]
order = 0
subject = "حماقة النساء"
author = "ابن البلدة"
posted = "2005-12-26"
text = "من حماقة بنا اليوم هو البجري وراء السراب و الحلام الوردية الماني الكاذبة كل ذلك نتيجة تربية مادية تلفزية تنقل الإنسان من عالم الواقع إلى عالم الخيال البراق الذي يوجد فيه أي شيئ و لا يتحقق منه أي شيئ حتى إذا استيقظت الفتاة و جدت القطار قد فات و أن فرس الأحلام قد مات و انه لا ينفع ندم على ما فات أنا اود ان أشير إلى نقطة مهمة في سبب العنوسة توقف عجلة الزواج هو الكرم الجنسي الذي تتمتع به بنات اليوم فهن لا يرددن يد لامس و يمنعن شهوة راغب و الغريب في الأمر أن ذلك عن وافق اتفاق فالشباب الذي يمر بلحظات الفاحشة م كل من تتشتهيها نفسه و لم يصادف عفيفة قط ولد عنده فكرة أنه لا وجود للعفاف لأنه لم يصادفه لأنه ليس من أهله إذ العفيفات لا يسعهن غير البيت الذي يأمن فيه من أنياب الذئاب و ما وصل إليه الأمر اليوم هو نذير شؤم خيبة امل لأن بنات اليوم رضين بالشهوة العابرة التي يعشنها دون حسيب و لا رقيب و متى دعت النفس الخبيثة المتحكمة فيهن إلى ذلك كل هذا جعلهنيأنفن من حياة الزوجية المفعمة بالمشاكل و التي قد تحدث طلاق يجعل المرأة تعيش وضعا سيئا أكثر مما هي عليهأأنا لا أتشائم من الواقع و لكن الحال ه كم لا يخفى على ذي العينين و أقول إن العفيفات الطاهرات لا يخلو منهن زمان و لكنهن أنذر من الذهب الأحمر في هذاغ الزمان و لا كثر الله فينا الساقطات و أرجو من الله العلي القدير الفرجوالقريب و التوبة و الرشاد لشباب المسلمين ذكرانا و إناثا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112534/http://www.20at.com/article2.php?sid=154"

[[comments]]
order = 1
subject = "طاحت الصمعة علقوا الحجام"
author = "غريب"
posted = "2005-12-26"
text = "اشكر القائمين على الموقع واشك كاتبي الموضوع الذي يمس شريحة مجتمعية كبيرة وكما يقال يلامس جرح عميق يعيشه شباب هذه الامة، لكن أخاف أن يصدق علينا المثل المغربي الشائع \"طاحت الصمعة علقوا الحجام\" بمعنى ان نبحث دائما عن اقرب شماعة نعلق عليها فشلنا وسوء تصرفاتنا عوض البحث عن الاسباب الحقيقية.<br />وكما يقال مادامت هناك حياة فهناك امل.. وشباب اليوم اولى من غيره بالتغيير وصنع مستقبل زاهر لكن لا نفكر ان ذلك سيتم بدون تضحيات جسام وصبر وتضامن.<br />واسف على الاطالة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112534/http://www.20at.com/article2.php?sid=154"

[[comments]]
order = 2
subject = "أريد زوجا........."
author = "الصديق"
posted = "2005-12-26"
text = "إدا كان الشاب المغربي كل همه أن يجد شغلا يكفي به نفسه، فدعاء الشابة أن تجد رجلا تتزوجه و لو للحظات لتكتب من المتزوجات هكدا كان لسان حال كل شابة مغربية غير متزوجة و ما أكثرهم دعونا من المدونة و يسروا للشباب الزواج فما أحلى زواج بمتاعب من عنوسة قاتلة و لكن أنى لها دلك و القيمين في بلادنا يريدون أن يبقى مغربنا أعزبا شبابه و شاباته امام وضع كل الحجرات لتقوى العثرات الاخلاقية........."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112534/http://www.20at.com/article2.php?sid=154"

[[comments]]
order = 3
subject = "أريد زوجا أولا .....ثم شهادة ثانيا"
author = "سعيد الصديق"
posted = "2005-12-26"
text = "بداية أشكر الأستاد عادل والاستادة ليلى على تقديم هدا الموضوع.<br />أما فيما يتعلق بالتعليم و هل هو معوق من معوقات الزواج فهناك بعض المتعلمات اللواتي يجعلن من دراستهن وسيلة للبحث عن زوج و رغبتهن جامحة في أن لا تنتهي مدة الدراسة إلا و لديها شهادة في يد و زوج في الأخرى لأن المجال رحب و مساحة التواصل شاسعة و غالبا ما يكون دلك بدراية و توجيه من الأم و دعاء من الوالد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112534/http://www.20at.com/article2.php?sid=154"

[[comments]]
order = 4
subject = "ولماذا لا نقول العكس؟؟"
author = "فاتنة المغرب"
posted = "2005-12-26"
text = "مرحبا شكرا للجميع على إثارة هذا النقاش، في الحقيقة لست أدري لماذا الخطئية مؤنثة؟؟ ولماذا دائمة أي شيء سلبي مرتبط بالمرأة؟؟ هل هو قدرها في مجتمع المفروض فيه أن ان يطبق الرفق بالقوارير!!<br />ليس كل فتاة تدرس هي بالتالي تعتبر ذلك فرصة فقط للفوز بزوج، والواقع يثبت ذلك. ولماذا لا نقول العكس؟؟ ارجو الا ندخل لهذا النقاش العنصري ضد الفتيات وكأنهن بتن يطرقن باب الذكور طلبا للرحمة .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112534/http://www.20at.com/article2.php?sid=154"

