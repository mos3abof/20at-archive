[[comments]]
order = 10
subject = "لا حول ولا قوة إلا بالله"
author = "واحد معدي (مصري أبا عن جد)"
posted = "2006-01-11"
text = "أولا : السلام عليكم<br />أحب أحيي \"مغربية\" و \"مغربي قح\" ، و أقول لهم بارك الله فيكم<br />و أحب أقول للذي يزعم أنه \"مغربي\" ، إذا كنت تعتقد أنك أفضل من غيرك فلا تأت هنا ثانية ، فهذا الموقع ليس لك و لا لأمثالك ، كيف تقبل أن تتنازل و تزور مواقع صنعها غيرك ممن هم أدنى منك قدرا ..<br />اذهب ولا أريد ان أرى وجهك مرة أخرى!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112534/http://www.20at.com/article2.php?sid=154"

