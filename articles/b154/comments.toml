[[comments]]
order = 13
subject = "يهمني الأمر"
author = "مغربي من الشرق"
posted = "2006-02-14"
text = "هذا موضوع متشعب وليس بالسهل لأن أسباب العنوسة تختلف من مجتمع للأخر و كذلك حسب الظروف فهنالك العناس الميسورو الحال الذين يستطيعون تحمل مصاريف و تكاليف الزواج و هنالك من لايستطيع فمن نلوم القادر أو الغير القادر الراغب المسألة مادية من جهة و من جهة أخرى نفسية فبعض الرجال القادرون على تحمل الأعباء يجبونك أنهم لايثقون في بنات اليوم ليعرفون العفة و لاالحشمة فلم يعودو يثقون بمن تلبس الحجاب و من تلبس السروال فكلهم سواسية و أنا قادر على الزواج ولكن فقدت الأمل بعد فشل زواج أخي الأكبر لأن زواجه كان فاشلا فهذا زاد من شكوكي في الزواج فبنات اليوم لايقدرون الواقع الذي يعيشون فيه فالمسلسلات التي كانت تبتها شاشتنا المحترمة و التي شاهدوها في سن المراهقة ختمت على عقولهم فأصبحو لا يحلمون إلا بالحياة السهلة فهن يبحثن عن الرجال الذين يأتون من الخارج أما نحن لإاصبحنا غير مرئيين نحن دوو الدخل المتواضع ولكم هده القصة القصيرة عبرة .<br />جاء أخي من ديار المهجلر بسيارته الفاخرة و بعد ما أخدتها منه في جولة في المدينة... كم من فتيات كنت أمر من أمامهن و كأنني غير مرئي غير موجود أما الآن فهن يبتسمن لك يتأخد رقم هواتفهن النقال بكل سهولة......<br />فكيف لي أ، أتزوج من هؤلاء العفريتات فلن تتزوج إلا واحدة لها تاريخ عريق في العلاقات الخارجية و الله يهدينا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112534/http://www.20at.com/article2.php?sid=154"

