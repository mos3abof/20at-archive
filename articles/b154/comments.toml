[[comments]]
order = 6
subject = "هذا غير مغربي"
author = "مغربي قح"
posted = "2006-01-03"
text = "لم أكن أعرف أن المغاربة متعصبين ونرجيسيين ولا ينظرون إلا بعين واحدة..<br />هذا الذي تحدث فوق اكيد ليس مغربي ربما يعيش خارج المغرب وولد في المغرب لذلك يتحدث بهذه العنصرية والعصبية.. ما يوجد في المغرب يستحيل ان تحجبه بالغربال؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112534/http://www.20at.com/article2.php?sid=154"

[[comments]]
order = 7
subject = "استدراك"
author = "المغربي القح"
posted = "2006-01-03"
text = "أقصد بكلامي صاحب التعليق اللي فوق مني الذي قال ان المغاربة اسيادنا وانهم افضل وووو<br />هذا الكلام الذي اكل الدهر عليه وشرب ولا زال يردده فقط أولئك المقبلين للأعتاب كما نسميهم في المغرب \"المقدم\" ديال الحومة... وحتى هذا المقدم اصبح يتراجع عن مل هذا الكلام.. يا سيدي افتح عينيك وانظر بالالوان وسترى العجب العجاب واذا ظللت تنظر من تحت نظارة سوداء ستسقط يوما ما في حفرة لن تجد من ينقذك منها..<br />لا تنسى هذه النصيحة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112534/http://www.20at.com/article2.php?sid=154"

[[comments]]
order = 8
subject = "نحنا اسيادكن"
author = "مغربى"
posted = "2006-01-04"
text = "انا عم اتحدث عن وعى وفهم تماما لانى ها البلاد الاصيلة<br />ولكن الحقيقة انكو ماعن تشوفو العم بيحصل حولكن وانتن جهااال سوا العرب عامة والمصريين خاصة<br />لان ببساطة العرب ما فيها غير المغرب حقا وها الحكى عن بيعرفوة بلاد الغرب جيدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112534/http://www.20at.com/article2.php?sid=154"

