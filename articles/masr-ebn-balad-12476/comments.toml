[[comments]]
order = 6
subject = ""
author = "قربة مثقوبة"
posted = "2009-06-27"
text = "الست حنان كمال<br />سعادة السفير<br />انتم بتنفخوا فى قربة مثقوبة وبتاذنوا فى مالطة<br />الست حنان كمال - قيامك بجمع اموال تبرعات بدون تصريح من الدولة قضية امن دولة<br />اما جمع التواقيع فهو تجمهر غير قانونى فى ظل احكام الطوارىء السارية المفعول<br />ربوا عيالكم وعيشوا حياتكم<br />وللبيت رب يحمية<br />والزعيم سعد باشا زغلول قال رائعتة الصامدة على مر الاجيال<br />غطينى يا صفية وصوتى<br />صوتى يا حنان على سعادة السفير"
archived = "2009-06-27"
capture_url = "https://web.archive.org/web/20090627135858/http://www.20at.com:80/masr/ebn-balad/12476-2009-06-25-14-11-37.html"

[[comments]]
order = 7
subject = ""
author = "نضال"
posted = "2009-06-28"
text = "الأخ بتاع قربة مثقوبة …@<br />جمع التواقيع لا تنطبق عليه أحكام التجمهر .. ولا يوجد في قانون الطوارئ بند يمنعه<br />ولكن حكاية التبرعات دى هى فعلاً الى لازم يكون فيه تصريح بجمع التبرعات او تكون جمعية مصرح لها بذلك .<br />بس ممكن برده العملية تمشي بين المعارف والأهل والأصحاب<br />وتأكد أن طول ما بتقول ( للبيت رب يحميه) يبقى احنا مش هنتقدم خطوة لأن ده يبقى تواكل مش توكل"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105144551/http://20at.com/masr/profile/12476-2009-06-25-14-11-37.html"

[[comments]]
order = 8
subject = ""
author = "مسلم و كلى فخر"
posted = "2009-06-30"
text = "السلام عليكم و رحمة الله و بركاته<br />تعرفوا يا جماعه موضوع الغاز ده من الحاجات اللى جابت لى هسهس فى دماغى بجد.أنا فضلت اجيب الموضوع ده يمين و شمال و أتضح لى الأتى :<br />الموضوع مش سمسره و لاحاجه لأن بالمنطق كده إذا كان الغاز متباع للى مايتسموا بملاليم يبقى أزاى رجال الأعمال دول هايهبروا زى ما الناس بتظن<br />أنا فعلا فضلت أفكر و وصلت لكارثه أكبر و يارب أكون أنا غلطان … عارفين ايه هى … كامب ديفيد<br />الغاز ده يا جماعه لاقوه فى سيناء يعنى مش بعيد يكون من بنود الأتفاقيه إن أى ثروات معدنيه تكتشف فى سيناء تؤول للعدو زى كده ما ألت إليهم طابا و المنتجعات السياحيه<br />طبعا أنتم فاهمين أنا قصدى ايه<br />المصرى مش بيعرف يدخل سيناء إلا لما يطلع عينه لكن العدو بيروحها بالبطاقه<br />انا أحيانا بحس إن الإتفاقيه ديه إديتنا سياده على سيناء على الورق بس و العدو له كل الأمتيازات فيها<br />يا سعادة السفير أبراهيم يسرى يا راجل يا محترم … يا ناس يا محترمين ياللى عندكم سلطه و خايفين على مصر دوروا ورا المو ضوع ده … كامب ديفيد"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105144551/http://20at.com/masr/profile/12476-2009-06-25-14-11-37.html"

