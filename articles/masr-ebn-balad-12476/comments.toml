[[comments]]
order = 0
subject = ""
author = "ملعون ابوة"
posted = "2009-06-25"
text = "ملعون ابوة اللى يعطى غاز لاسرائيل ويصل الغاز الى حيفا وتل ابيب ولم يصل الى اسيوط وسوهاج<br />ملعون ابوة لما اسرائيل تعمل بة صناعات عسكرية وصناعات كيميائية واحنا ولادنا قاعدين على المقاهى<br />ملعون ابوة لما محطات كهرباء شبرا الخيمة وحلوان تشتغل بالمازوت وتعمل سحابة سوداء فى القاهرة ومحطات كهرباء اسرائيل تعمل بالغاز المصرى النظيف ولا تعمل اى تلوث عندهم<br />اللى محتاجة البيت يحرم على الجامع فما بالك العدو<br />ملعون ابوة لما يدعم المواطن الاسرائلى فى سعر الغاز ويشيل الدعم عن المواطن المصرى<br />ملعون ابوة"
archived = "2009-06-27"
capture_url = "https://web.archive.org/web/20090627135858/http://www.20at.com:80/masr/ebn-balad/12476-2009-06-25-14-11-37.html"

[[comments]]
order = 1
subject = ""
author = "مصر لها صاحب"
posted = "2009-06-25"
text = "مصر لها اصحاب كتير من الشعب المصرى الحقيقى<br />من اصحاب مصر عبد العاطى صائد الدبابات فى حرب 1973<br />ومحمد المشد مهاجم النقاط القوية فى خط برليف على شط القناة<br />من اصحاب مصر البنت تفيدة وجمالات وام حسين وهم واقفين على الحوال بيسقوا عيدان الذرة وعيدان القصب<br />من اصحاب مصر العمال والفلاحين والبدو فى صحارى مصر الشرقية والغربية<br />انما الديدان الطفيلية التى تسكن حول حدائق جناين الجولف وفى الشرم والغردقة ويهربون على ظهر اول طائرة مغادرة ومعهم فلوسهم فمش اصحابها ولكن الحرامية بتوعها<br />مش من اصحابها اللى يغرق الف مصر فى البحر ولا يجيب لها مبيدات مسرطنة ولا اللى يحتكر بضاعتها"
archived = "2009-06-27"
capture_url = "https://web.archive.org/web/20090627135858/http://www.20at.com:80/masr/ebn-balad/12476-2009-06-25-14-11-37.html"

[[comments]]
order = 2
subject = ""
author = "سيولة مالية"
posted = "2009-06-26"
text = "بعد ازمة رغيف العيش - الحكومة عايزة سيولة مالية تشترى بها قمح فاسد ومسرطن على حسب مواصفات مجلس الاسرة لتحديد النسل وتقليل عدد السكان بتسميمهم واصابتهم بامراض السرطان والفشل الكلوى فبيضطروا يبيعوا اى حاجة لاسرائيل وباى سعر علشان الدولارات<br />اما من ناحية التنمية فبصريح العبارة مفيش اى تنمية لان كل مشاريع البطاطس خلصت وبقى عندنا اكبر كمية من مصانع الشيبسى ىتغطى كافة انحاء الجمهورية<br />وكذلك مصانع السيراميك<br />اما اذا اى شاب عايز يعمل اى مشروع صغير فالانتاج الصينى مغرق البلد ورخيص واى منتج وطنى هيفشل بجانب تلك الاسعار لان السوق سداح مداح والمستوردين اكتر من الهم على القلب<br />بصراحة اة<br />البلد دى ملهاش اصحاب"
archived = "2009-06-27"
capture_url = "https://web.archive.org/web/20090627135858/http://www.20at.com:80/masr/ebn-balad/12476-2009-06-25-14-11-37.html"

