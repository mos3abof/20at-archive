subject = "انا قريت ف مجله ريفيه"
author = "نيفين"
posted = "2006-03-25"
text = "و الله عندك حق يا اكرم حتى لما خلصنا و اشتغلنا مش لاقيين يوم راحه لا و المجستير طلعلنا ف البخت<br />المهمشكلى انا كمان هقوم بانقلاب و اروح راس البر و اضربها طناش<br />هبهوب انهرداالسبت"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210313/http://masr.20at.com:80/article.php?sid=69&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
