[[comments]]
order = 0
subject = "ايامنا الحلوه"
author = "هبابه او هوبه او هبهوب"
posted = "2006-03-24"
text = "في مصر كنت با خد الاحد اجازه مش عشان اروح الكنسيه لاه اصل الشوراع بتبقي فاضيه ومفيش بشر<br />نقعد انا وبنت عمي في الشوراع وشراء الايس كريم من \"عبدو\" اقصد عبد فتاح مروزق\" واللي يرزقه يرزقنا<br />دلوقتي بقي يا بشر طلع عيني في السبت ولاحد بالدات<br />والجمعه تاكل كلب بدمعه \" واحده صاحبتي كانت بتقوليهالي \"<br />الخميس تاكل فار بخانفيس \"يع \"<br />الناس خبتها السبت والاحد وانا خبتي ماوردت علي حد<br />بالحق هو النهارده ايه ؟؟"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210313/http://masr.20at.com:80/article.php?sid=69&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "يا مين يديني اجازه"
author = "كرميلينو"
posted = "2006-03-25"
text = "ازيك يا هبهوب انا سبقتك قبل كده في التعليق على كبشة موضوعات بس الظاهر انك بتصحي بدري اليومين دول تعلقي و تمشي<br />خليكي قاعده يا شيخه ممكن حد يعلق على شاي و لا حاجة و يبقا ليكي نصيب في كوبايه<br />اما عن الاجازة فيعني ايه اجازة ؟؟؟<br />من ساة ما خلصت دراسة و اشتغلت مخدش اجازة ( هو بصراحه كله بتمنه ) بس انا ايه مكنه<br />يا ريت تغيروا الموضوع ده و صورة المركب دي<br />عشان انا خلاص شكلي هقدم على اجازة اسبوع اروح دمياط اخدلي فلوكه و سنارة و اعيش مع نفسي و مع السمك الاسبوع الجاي ده<br />و سلام يا منطقه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210313/http://masr.20at.com:80/article.php?sid=69&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

