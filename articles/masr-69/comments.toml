subject = "مشكله"
author = "عبدالله مفتاح"
posted = "2006-03-25"
text = "انا بحب الاجازة عشان الاسترخاء لاني عادة مش بحب الصخب<br />بس مفيش مانع قعدة مناقشه سخنة مع واحد ماركسي نطلع عين بعض<br />او جلسة هلس وضحك بسبب ومن غير سبب<br />الاجازة حلوة بس البطاله وحشه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210313/http://masr.20at.com:80/article.php?sid=69&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "كل الايام زي بعض"
author = "عيون القلب"
posted = "2006-03-25"
text = "والله الايام بقت شبه بعض..لانو ايام الاسبوع كلها روتين والاجازه بتجي وبتخلص قبل ما تستمتع بيها..بس حقيقةً هي بتخلي الواحد يرجع لدوامه وشغلو وهو مرتاح شويه...الله يعيييين دنيا!!!!!!!!!!!ما دايم فيها الا الله."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210313/http://masr.20at.com:80/article.php?sid=69&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 6
subject = "اجازه طب لية؟؟؟؟"
author = "طماطم"
posted = "2006-03-26"
text = "لية اجازه اذا كان احنا مخلصين دراسة بقالنا اربع سنين ووخدين اجازة من ساعتها وفى قبلنا مخلصين من عشر سنين وفى اجازه مفتوحه . وبعدين انا شايفة ان موظفين الحكومة بيدوهم اجازة السبت طب لية هما اصلا كدا كدا فى اجازة نوم فى الشغل والبيت<br />بجد البلد دى الواحد قرف منها خاااااااالص والله الواحد بيقول الكلام دا وقلبة بتقطع كان نفسى بلدى تكون احسن من كده<br />حسبى الله ونعم الوكيل فى اللى كان السبب"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210313/http://masr.20at.com:80/article.php?sid=69&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 7
subject = "الشاطرة بتغزل برجل حمارة"
author = "whitecat"
posted = "2006-03-30"
text = "انا النهاردة بس دخلت السايت ده صدفة وعجبني كلامكو وقولت اكتب هنا هو الكلام عليه جمرك<br />عايزة اقولكو يا بختكو بجد في حياتكو . كل دي ايام فاضية وخروجات وفسح. انا صحيح لسه في سنة تانية جامعة وعندي نص الاسبوع وقت فاضي بس المشكلة هروح فين؟<br />اصل غزة دي نسخة عن كوكب المريخ متلقاش فيها غير البيوت والشوارع اما بقية مستلزمات الحضارة بعتنا نجيبها من الدول المانحة بس طبعا نصها صادرته اسرائيل لدواعي امنية والنص التاني حولته السلطة على بنوك سويسرا واذا تبقى بقية باقية تروح للحرامية الصغيرة وكلاب الاسياد . بس ان شاء الله في 2020 القادم ممكن تحصل مفاوضات لاقامة دار سينما او احتفال بيوم الارض او حتى يعملولناجنينة صغيرة يطلعونا نشم هوا فيها كل شهر ( طبعا حسب حسن السير والسلوك)<br />وعلى رأي محمد منير \" طفي النور يا بهية كل العسكر حرامية\""
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210313/http://masr.20at.com:80/article.php?sid=69&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 8
subject = "مش كل أجازة حلوة"
author = "لميس"
posted = "2006-04-28"
text = "والله مش كل أجازة حلوة إلا لما يكون ليها معنى بجد يعنني تخرج مع صحابك ولا مع العيلة ولا مع مين؟؟؟<br />مين فضللك؟؟<br />طيب إزا خرجت هروح فين ؟؟ والفلوس إل معايا هتكفي ؟؟<br />الأجازة مش كل حاجة أنا عندي أدي الفقير ربع جنية وشوف الإبتسامة على وشو تكون أحلى أجازة؟؟<br />أشوف واحد بيشرب سجاير أألو أي حاجة ياوم رميهه تكو أروع أجازة ؟<br />يا جماعة الفسحو والخروج بيروحو عن النفس معنديش مانع بس إنك تعد على النيل وتبص للأمر نص الليل وتفكر في حالك وحال ناسك وبلدك فدي أحلى أجازة .......هيه آه كتيرة وتملا خزانات بس لازم تفكر في غيرك مش في نفسك بس علشان تعيش ؟؟<br />وأنا شعاري في الحياة ......طنش ، هوي،إديلو صبونة ، أو زحلأ بكبشة ملوخية ......<br />لازم متملاش ألبك وتكتم علية فضفض لغيرك هتحس بالراحة وتعيش مرتاح"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210313/http://masr.20at.com:80/article.php?sid=69&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"
