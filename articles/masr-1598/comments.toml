subject = "الكلام دة كذب واللة"
author = "مجدى كامل"
posted = "2007-02-15"
text = "الكلام المكتوب دة كذب وتلفيق الحكاية الن نواب الاخوان اتكلموا عن عمل اعتصام ونقابة موازية ودة اللى ازعج السيد جلال عارف وقال بالحرف الواحد احنا مش حنعمل دولتيت وقال كمان ان الاخوان عاوزين يفصلوا الحكومة والهيئات على مزاجهم علشان كدة رفض الماهترات دى<br />دة اللى حصل"
