[[comments]]
order = 0
subject = "النور فى بلاد الظلمة"
author = "أبو أسامة"
posted = "2006-05-20"
text = "ان القضاة هم بقعة النور فى ظلام سلطات الحكم والتى نتمنى من الله ان تسطع لتضىء سمأ مصر وان يكونوا هم قادة الحكم وحملة مشاعل النور فى ظلمة الحكم الفاسد"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172123/http://masr.20at.com:80/article.php?sid=347&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "قانون استقلال السلطة القضائية"
author = "ميدو المصري"
posted = "2006-05-20"
text = "والله لو القانون الجديد ليس له دخل بالاوضاع المالية ويعالج موضوع الكوسة في التعينات وان احنا نلاقي عائلات بأكملها في سلك القضاء والنيابة لان القاضي مهما كان ملتزم مش شرط يكون ابنه زيه ويعالج موضوغ دفعة وكلاء النيابة الاستثنائية اللي مش مهم فيها التقديرمقبول اوحتي دور تانيبيتهيألي لازم الكلام دا يكون في الاعتبار لتطهير ثوب القضاء من اي دنس"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172123/http://masr.20at.com:80/article.php?sid=347&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
