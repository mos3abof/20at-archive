subject = "احترس من التحرش .."
author = "إبن بهيه"
posted = "2006-12-30"
text = "يالا بقى .. بعد صلاة العيد .. والسلام على الأقارب ((ماسيجات وميسد كول بس)) وبعد ذبح ثلاثة أربعه مكعبات مرقة الدجاج لزوم الفطار بفتة مرقة الدجاج ((لغاية ما تفرج)) نروح نتفرج على زحمة العيال قدام السينمات .. ونستنى الليخارجين يحكولنا الفيلم..<br />ملاحظه:<br />احترس من التحرش ..<br />احترس من التحرش ..<br />احترس من التحرش ..<br />البوليس مش فاضي .. بيلم في الإخوان .. وكل سنه وأنتم طيبين .. ويا رب بهيه تكون محرره في العيد الجاي ..<br />وكل سنه ومبارك الواطي واطي ((تحت التراب)) هو وعصاباته وبوبيهات الأمن في السجون .. قريبا بإذن الله ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104070930/http://masr.20at.com:80/article.php?sid=1383"

