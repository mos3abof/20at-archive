[[comments]]
order = 9
subject = "الى الكلاب"
author = "الى كل الكلاب اللى بيتطاولوا على مصر و المصريين , ليفى الكلب اليهودى اللى عايش على ارض غيره بياكل فى خيرها و ان شاء الله راح يطفحوا قريب و يموت بغيظه لانهم من غير زعيمة ( العالم الحر ) ما بيساوا شئ ابدا ."
posted = "2007-01-07"
text = "اما ( الاخوة العرب ) من السعودية او غيرها بنقولهم بس افتكروا جايين منين يا رعاع جايين من ورا الجمال يا غجر و مصر طول عمرها اكبر منكم و افضل و هى اللى عملتكم بنى ادميين قبل ما يبان عندكم البترول اللى فرحانيين بيه و لما يضيع منكم ان شاء الله ابقوا ورنوا نفسكم حتبقوا فين . احنا رغم كل مشاكلنا و بلاوينا احسن منكم على الاقل عارفينها و بنحاول نخلص منها انما انتم بقى يا اهل الفجر و البغاء بتسيبوا بلادكم و تيجوا مصر او لبنا ليه .<br />و يا فنانين مصر اتقوا الله فيما تقدمون علشان ما تجرؤش الكلاب علينا . و حسبى الله و نعم الوكيل"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108011108/http://masr.20at.com:80/article.php?sid=1383"

