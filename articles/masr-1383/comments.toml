subject = "أحداث الرهينة"
author = "\"وتدور أحداثه في إطار بوليسي حول مهندس مصري مقيم في الخارج ويعمل في أحد المفاعلات النووية يتعرض للاختطاف من قِبل جماعات إرهابية ويتم احتجازه كرهينة.\""
