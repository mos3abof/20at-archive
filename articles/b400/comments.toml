order = 0
subject = "أيها المواطنون"
author = "إسلام"
posted = "2006-02-05"
text = "ايها المواطنون .. جائنا البيان التالى ... لقد جاء اليوم الذى سنرتاح فيه بعد تعب .. بعد كل هذاالفسادطوال 27 عاماً. مات الرجل الذى جعلنا أرخص من التراب .. الرجل الذى جعلنا فى أرجل الأمم .. الرجل الذى جعلنا دلاديلاً لأمريكا طوال فترة حكمة .. توفى إلى رحمة الله وبعد طول إنتظار . الغير مأسوف عليه الرئيس محمد حسنى مبارك بطل الفقر والجهل والمرض والبطالة.. بطل التعذيب فى السجون بطل الحزن الوطنى الدموىقراطى اللى طول عمرة واطى ... وإلحقوا بسرعة روح أمه جمال إبنه قبل ما يستولى على الحكم ....<br />طبعاً لو الحجر غتحرك الشعب المصرى عمره ما هيتحرك ... أسيبكم بسرعة أحسن بتوع أمن الدولة صوتهم على السلالم ..ز سلالالالالالالالالالالالالالالالالالالام..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113649/http://www.20at.com/article2.php?sid=400"

[[comments]]
order = 1
subject = "البقاء لله"
author = "احمد سعيد"
posted = "2006-02-06"
text = "البقاء لله اصيبت مصر والدول الاسلاميه والعربيه بل اصيب العالم اجمع ببلاء عظيم حيث فقدنا جميعا الرجل الذي طالما اجتهد وعمل من اجل مصلحة شعبه الرجل الذي لم يسعي ابدا خلف امريكا واسرائيل ورفض اي تنازلات من كبرياء وطنه العظيم الرجل الذي رفض اتفاقيه الكويز ورجع قبلها تاني بسروط اصعب الرجل الذي رفض ان يكون حكم مصر بالوراثه ورفض ان ابنه علاء يمسك الحكم بالوراثه واداه لابنه التاني جمال الرجل اللي رفض ان المواطنين المصري يتهانوا ورفض ان الوزراء والفاسدين من رجالته يستمروا في عملهم اكتر من 25 سنه الرجل الذي طالما احب مصر واحب شعبها الرجل الذي رفض ان تكون ثروته في بونك اوروبا اكثر من 200 مليار دولار امريكي واللي زاد عن كده حولوه لليورو الرجل الذي رفض ان تنداس كرامة بلده بدون ان ياخذ هو المقابل الرجل الذي صمت عن اساءة الرسول الكريم رغم انه لايكت ابدا اذا كانت الاساءه لشخصه الحقير واخيرا ادعوا الله ان يتغمد الفقير برحمته وان يلهمنا نحن الشعب المصري الصبر والسلوان علي هذه الفاجعه وان نتحمل الفاجعه الاكبر وهي وصول جيمي للحكم هذا وقد ارسل الرئيس الاميركي 3 برقيات للمدعو جمال الاولي بالطبع عزاء للرئيس علي وفات والده والثانيه تهنئه بوصوله للحكم والثالثه سؤال مهم جدا هلي سيبقي رقم حسابه القديم بسريسرا زي ماهو ولا حيغيروه<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113649/http://www.20at.com/article2.php?sid=400"

