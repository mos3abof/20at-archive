subject = "الله يجازيك قلبت علينا المواجع"
author = "واحد متغرب برضه"
posted = "2006-02-08"
text = "و الله كلامك قلب علينا المواجع أنا بقالى خمس سنين فى الغربة و كل يوم بسأل نفسى سؤال واحد أمتى هرجع بيتى و أعيش بين أهلى تانى و فعلا أكتشفت ان الواحد بيلهث طوووول عمره علشان يوفر ما يتخيل انها كماليات و هي فى الحقيقة أشياء مفروغ من وجودها فى بلاد تانية و لا حول و لا قوة الا بالله .... اللهم أنتقم من سارقينا .... بس و الله أرجع و أقول المقولة الشهيرة \"من أعمالكم سلط عليطم\" لأنى بجد ما لاقيتش شعب و أنا طبعا من ضمن هذا الشعب بالسلبية و الخنوع و الخضوع ده فمن الطبيعى أذا دخل على سارق البيت أن أهاجمه لأنه يحاول يسرقنى لكن للاسف مع الشعب ده السارق بيسرح و يمرح بداخل البيت و ينهب و يشفط ما يشاء أما صاحب الحق و صاحب البيت فدائما يؤثر السلامة و يهرب عن طريق عقد عمل فى الخارج .... لا حول و لا قوة الا بالله و لكن هذه المرأه بسشبب جبن هذا لشعب الخانع الذى يستحق ما يلاقيه على يد الحرامية و لتهنئ العصابة بالبلد بطولها و عرضها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113649/http://www.20at.com/article2.php?sid=400"

