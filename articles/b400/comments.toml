[[comments]]
order = 14
subject = "ربنا ياخدك يا مبارك انت وعيالك فى الطيارة بتاعة الطلعه الجوية"
author = "نبأ وفاة المعفن"
posted = "2006-02-08"
text = "بسم الله الرحمن الرحيم<br />الراجل داه عنده حق يا جماعه وداه اللى خلانى اهرب من البلد واتغرب عشان خلاص مابقيتشى طايقها وعشان انا حسيت انى بقت خطر على نفسى وعلى اللى حولى وانى ممكن اعمل حاجه فى ولاد الكلب دول ,وأىذى اخوانى والناس اللى حولى ,واولهم شيخ المنصر والحرامى الكبير المبجل محمد حسنى مبارك وعائلته<br />فعلا حسيت انى ممكن اتهور واعمل حاجه ترمينى ورا الشمس عشان كده اثرت السلامه وخلجت بره البلد<br />فى غربه ما يعلم بيها الا ربناعشان ايه<br />شوية قروش<br />ابعد عن امى المريضه واخواتى البنات اللى مالهم غيرى بسبب جيوب اصحاب القلوب المتحجرة اللى الواحدمنهم لو شافك قرش صاغ هيحطك فى جيبة ويقول لاهلك ماشوفتهوش<br />غربة بكل ما فيها من ذل وحرمان وقهر وليه<br />عشان شقه ولا عشان جوازه ولا عشان ايه<br />اقول ايه الله يلعنهم ويلعن جشعهم وسعارهم اللى بقى اكبر من سعار الكلاب<br />تخيلوا انى بطلت احلم<br />تخيلوا ان امه ولا شعب مابيحلمشى<br />عشان الاحلام بقت محرمه<br />بتتكسر<br />تخيلوا ان واحد يبقى كل حلمة انه يبقى عنده شقه وعربيه وهيا من المسلمات فى اى مكان خارج مصر<br />كارثه ان احلامنا ماتت للدرجة اللى مانقدرشى نحلم تانى<br />لازم نعمل حاجه مش هنفضل طول عمرنا كده فى الهوان<br />لازم نقول لا<br />كفاية سلبيه ولا مبالاه وقعده على القهاوى ومصمصة الشفايف وشرب دخان<br />والملاحظ ان الحكومه الجديده بتحاول تتجمل عشان تكسب الناس فى صف الحزب الوطنى الحرامى واول حاجه هوه قيام اتنين من الوزراء المنصور والمغربى بالاستيلاء على البنك المصرى الامريكى بنص تمنه<br />بـــنـــص تــمــــنـــه ولسه ماعدوش الاربعين<br />مش يخلو عندهم دم ويستنوا بعد الاربعين بتاع الوزاره<br />لا دول اول حاجه عملوها وضع يد على البنك<br />وبقى بتاعهم<br />عشان كده انا عايز من هنا تبدأ حملة مقاطعة للبنك داه<br />مقاطعة البـــنــــك المــــصــــرى الامـــريـــكـــى<br />بتاع الوزراء الحرامية<br />مرة فى حياتنا ننتقم وناخد حقناونربيهم<br />نعرفهم انه كفايه خلاص مابقاش فاضل فى البلد الا شوية بشر<br />يا ترى هييجى اليوم اللى يتاجرو فيه بينا احنا كمان<br />ويبيعونا عبيد<br />او اجسامنا تبقى قطع غيار لحضاراتهم<br />ومش كفايه لا دول بيحضرو العمده الجديده بتاع البلد<br />اللى معاه مفتاح الخزنه<br />المبجل البرئ اوى وهوه بيقول مش هنورث الحكم النجم الكبير اللى متنعم فى خير ابوة<br />صاحب العزبة الجديد جمال مبارك<br />طب قسما بالله والله العظيم انا من كتر ما الراجل داه بتيجى اسمه فى النشرات احيانا ببقى سرحان ولما اسمع اسمه اقول عليه الصلاة والسلام<br />ايه المرحلة المزريه اللى وصلنالها دى<br />اسمع اسمه لدرجة انى اسمعه اكتر من الرسول عليه الصلاة والسلام فى خطبةالجمعه<br />الظاهر انى خلاص<br />حرام حرام حرام حرام كفايه انا طهقت<br />حسبنا الله ونعم الوكيل<br />اللى عنده اقتراح لحاجه يقولهاالجروب دى كبيره ولازم نستغل جرأة اعضاءها<br />يا جماعه لازم نعمل حاجه يا اما هنفضل فى مستنقع الوساخه داه لحد مانموت<br />بيتهيألى ان اولادنا اللى لسه ماجوش لهم حق اننا نبقى رجاله فى عينيهم ونحاول نغير<br />مجرد محاوله<br />وحلم قرب يضيع<br />حلم يحتضر زى باقى الاحلام اللى راحت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113649/http://www.20at.com/article2.php?sid=400"

