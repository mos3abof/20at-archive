[[comments]]
order = 30
subject = "قاده فاشلين"
author = "ابو خليل .فلسطين.غزة.الشيخ زايد"
posted = "2006-04-28"
text = "بسم الله الرحمن الرحيم<br />الصلاة والسلام على اشرف المرسلين سيدنا محمد بن عبدالله سيد الخلق اجمعيا<br />انا لا اوجه الولم الى الدنمارك الكافره ((لانها دوله كافره )) ولكن الولم كل الولم الى زعماء العرب والمسلمين اصحاب الكروش المعفنه واصحاب الكراسي المتسلطه على شعوبهم وعند اساءة الحبيب لا نجد احد يفعل ما يجب ان يفعل<br />والى المسمى الزعيم الاسلامي احمد النجاد اين انت من الاساءه وماذا فعلت من اجل نصرة بينا واين حسن نصرالله ليقوم بما يجب عليه من اجل دينه والله كلهم يعملون من اجل مصلحتهم الشخصيه البحثه<br />ايها الشباب المسلم علينا ان نعي جيدا ان الامه بحاجه الى زعماء مسلمين بحق وليس كما نراهم اليوم وكلهم يركدون خلف الغرب من اجل البقاء على كراسيهم<br />ولكن نقول لهم انت اليوم في الدنيا تفترون على شعوبكم ولكن نسئل الله العزيز الحكيم الجبار المعز المذل ان يرينا يوما بالكفره ومن يواليهم من هذه الامه<br />اين نصره رسوله الله يا زعمااااااااااااااااء هذه الامه<br />والله لو وقفتم كلكم من اجل الرسول لكان كل الشعوب خلفكم واخدتم ثقتهم ولا احد من الغرب استطاع ذلكم<br />ونذكركم ان لا جدوى من الركود خلف الدول الكافره وامريكا واعوانها عليكم العوده الى شعوبكم هم وحدهم قادرين على نصرة رسول الله<br />الله اكبر ..... الله اكبر .... الله اكبر...<br />على كل من تخاذل على نصره رسول الله<br />بابي انت وامي يا رسول الله<br />رحم الله ابي وامي وادخلهم جنته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113649/http://www.20at.com/article2.php?sid=400"

[[comments]]
