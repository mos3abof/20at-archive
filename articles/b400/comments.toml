[[comments]]
order = 27
subject = "اهل الطغيان"
author = "شاب ابن مواطن مطحون"
posted = "2006-03-21"
text = "اذهب غير مأسوف عليك<br />اضعت شعباًً......... ودمرت احلام شباب.......... وجرت على من مالت عليهم الدنيا<br />لوكنت حكمت بحكم الله لبكينا عليك كثيراً ولامنت فى قصرك وبلدك<br />ولكن هيهات ان يجتمع الظلم والامن فى وقت واحد<br />لو حكمت بحكم الله لقلنا فيك حكمت فعدلت فأمنت فمت يا...............<br />ولكنك حكمت فظلمت فخشيت فمت يا جائر<br />ماذا ستقول لربك يوم الحساب على الحساب الذى ملاء بنوك سويسرا<br />ماذا تقول لربك يوم العذاب على العذاب الذى اذقته لشعبك<br />فلترحل غير ماسوف عليك........ ولن يدوم الكرسى ... ولو دام لغيرك ما وصل اليك<br />اين الفراعنة الشداد؟ اين ثامود وين عاد؟ تلك بيوتهم خاويه سكنتها الذئب العاويه<br />انها فلسفة السماء مع اهل الطغيان (( وما كان ربك نسى))<br />اسال التاريخ عن قياصرة العذاب ! اساله عاد وثمود وهامان والنمرود<br />فلن تجد من يدلك لان بطانتك فاسد ومن فسد ت بطانته ضل وانحرف عن الحق<br />اقمت على الاغنام ذؤبانا وحكمت فينا حكم الغاب<br />فاذهب غير مأسوف عليك<br />وحسبنا الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113649/http://www.20at.com/article2.php?sid=400"

[[comments]]
order = 28
subject = "عندي نعي نفسي فيه من زمان"
