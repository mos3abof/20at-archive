[[comments]]
order = 5
subject = "فى مليار دهية"
author = "خالد"
posted = "2006-02-06"
text = "ايها المواطنون الشرفاء , مواطنوا مصر العظماء , يا اصحاب الحضارة و التاريخ , ان اليوم هو اعظم ايام الامة , فقد فقدت الامة طاغية , فاسد , حقير , لص , مستبد كان رمزا رمزا عظيما فى اللوصوصية فقد استطاع ان ينهب ثروات هذا الشعب المسكين على مدار 25 سنة و اعاش هذا الشعب فى حالة من الضنك و الفقر و الازمات الاقتصادية التلاحقة مما يجعلنا لانستغرب على موقفه تجاه ما حدث لنبى الامه و شفيعها , فان شخصا بهذه الاخلاق السمحه تتعجبون لو اخبرتكم انه تقاضى من الدنمارك 65 مليون يورو حتى يسكت و لا يتخذ اى موقف تجاه الدنمارك , فماذا تظنون من شخصا هذه اخلاقه ؟؟انه لمن الصعب علينا ان نودع جسمانه النجس قبل ان نأخذبثأر الناس منه و لكن المنتقم الجبار حى لا يموت و ندعو الله له ان يغمسه فى قاع جهنم و ان يرى جنة ابدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113649/http://www.20at.com/article2.php?sid=400"

