[[comments]]
order = 24
subject = "اغتيال السيناتور م.ح.مبارك حاكم ولايه مصر الامريكيه علي يد مسلحين"
author = "شهاب مقدسي"
posted = "2006-02-15"
text = "فقدت الامه الامريكيه امس واحدا من اخلص رجالاتها هو السيناتور م.ح.مبارك الذي تولي حكم ولايه مصر الامريكيه منذ العام 1981خلفاً لسلفه السادات ، وقد شهدت فترة حكم مبارك الكثير مما يجعل كل امريكي مخلص يحزن بشده علي فقد هذا الرجل العظيم فهو الذي قام بضم مصر رسمياً لتصبح ولايه امريكيه جديده وسعي بحنكه واقتدار الي اخضاع كافه الولايات المتمرده في المنطقه، وقد تصدي الرجل بقوة واخلاص علي مدار ربع قرن لكل محاولات التمرد التي قام بها الهنود الحمر في بلاده علي الولايات المتحده وخاض في ذلك معارك ضاريه استخدم فيها القطارات المحروقه والعبارات الغارقه والمسارح المشتعله ولم يألوا جهدا في سبيل اخضاع الشعوب البربريه .هذا وفي موكب مهيب قام خلفه السيناتور ج.م.ح.مبارك علي رأس مشيعي الفقيد بمواراه جثمانه الثري في مقابر الاسرة في فيلادلفليا، وقد اعلن الحداد علي روحه لمده 30 ثانيه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113649/http://www.20at.com/article2.php?sid=400"

