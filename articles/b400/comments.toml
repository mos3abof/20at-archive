posted = "2006-03-30"
text = "إلى جميع المواطنين العرب وصلنا البيان التالي ويسعدني نقله تم اليوم وبحمد الله موت جميع الحكام العرب بجلطة دماغية حادة وبناء عليه تقرر النظر في الدول العربية بعين التطور والرقي والديمقراطية التي لم تشاهد أو تحدث من قبل بأن يعيين بدل منهم قي هذه الماصب من خيرت واشرف الشبان ومن الجيل الحديث نظرا لرأية الصادقة والواعية لما يجب تحقيقه في هذه البلدنا وأؤكد أن على ايديهم لن يستطيع ان تستولي امريكا واسرائيل على هذه الدول مع تمنياتي لهم بتوفيق والله لايرحم إلي ماتوا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113649/http://www.20at.com/article2.php?sid=400"

