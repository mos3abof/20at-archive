subject = "Idoltary"
author = "Amgad"
posted = "2006-02-06"
text = "We have not matured beyond the stage of worship a person yet. We should not be aspiring to the day when mubarak dies, because our next dictator will be a corrupt dictator like him but with a better cosmetics. Instead we should aspire for the day when we have a system that guarantees us our basic needs regardless of the person in charge. A system with which we can correct or reject the government actions like in so called civilized countries. But before we get to this stage we must become active citizens who reject corruption and oppression and claim their rights whenever the situation calls for active action."
