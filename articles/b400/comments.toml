[[comments]]
order = 11
subject = "الى جهنم الخلد يا مبارك"
author = "اجئ إقتصادى"
posted = "2006-02-08"
text = "فقدت مصر رجلا من أعفن الرجال ... من أصيع الرجال ... من أغبى الرجال ... من أجشع الرجال .... (الله يرحمك يا سادات)... رجلا عاش و مات على كرسى الحكم فقط لأن الكرسى قد ألتصق بمقعدته و أقسم ألا يفارقها لا حتى يفارق باقى الجسد الحياة ... و هاهو الجسد قد فارقت الحياة لكن أعماله ستبقى و كذلك حساباته فى بنوك سويسرا و السويد و أمريكا .... سوف تبقى حساباته و حسابات عائلته عامرة بكل ما هو نفيس و غالى تم جمعه من دم الغلابة و من أرواحهم ... و كذلك سوف تكون السجون عامرة بالصراخ و رائحة التعذيب و الجثث تزكم الانوف ... أذهب فلتكن جهنم الخلد مثواه و من الشوك و الحميم فراشه و طعامه أمين أمين أمين بعدد من تولى رعايتهم كراعى و لم يحفظ حقهم بعدد دموع الايتام و الثكالى أدعوا من الله سبحانه ان يريه ملايين لحظات الهلع كما رأتها أم فقد أبنها الرضيع فى البحر و هو يغرق بين يديها ... حسبنا الله و نعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113649/http://www.20at.com/article2.php?sid=400"

