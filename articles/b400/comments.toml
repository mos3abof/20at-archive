subject = "كيفما تكونوا"
author = "نينو"
posted = "2006-05-16"
text = "كيفما تكونوا يول عليكم<br />صدق الرسول عليه الصلاة و السلام. طب و الله العظيم تلاته انتوا شعب معفن و ماتستاهلوا غير ده.<br />و والله العظيم تلاته كمان مرة مافي شيء منكم من الي فاتح جاعورته قد كده و مستخبي ورا الانترنت و عمال يجعجع الا اما هيعمل اوسخ منه اول ما يمسك الحكم.<br />جتكم البلا فقعتونا، كل واحد فيكم عمال يكدب على نفسه و مش لاقي سبب لخيبته غير الريس، طب كنتوا عملتوا ايه يا كلاب ، مانتوا السبب"
