subject = "راح في ستين ألف"
author = "مصري"
posted = "2006-02-08"
text = "اليوم، وبعد ثلاثين عاما من خلافة حكم مصر عن جده الرابع عشر، انتقل الى ستين ألف داهية الرئيس المصري وائل حسام صبري أحمد حسين جمال محمد حسني مبارك مسلما ًالراية من بعده لنجله كريم وائل....محمد حسني مبارك والذي كان قد أكد مرارا وتكرارا نفيه أن يكون هو الرئيس الخليفة لوالده.<br />هي دي بلدنا \"المملكة العربية الحسنية\" واللي مش عاجبه يعمل له بلد تانية باسمه ويعيش فيها.. يا شعب يا حوش يا رعاع جاتكو نيلة عرتونا قدام العالم"
