[[comments]]
order = 34
subject = "ولما يموت يفوت؟"
author = "منحوس"
posted = "2006-07-03"
text = "طيب مات الرئيس وشبع موت واخد على دماغه لمل قال يابس كده المشكله اتحلت يعنى اخدنا حريتناواقتصادنا اتصلح والسرقة انتهت وخير البلد رجع ليها وكل واحد اخد حقة سواء كان الحق اشتراكى ولا راسمالى ولا دينى يعنى هو ده حل المشكله تفتكروا ان الرئيس بقى بالسوء ده وبالغتاته دى من نفسه ولا من شلة المقاطيع اللى حواليه واللى هموا على فكره عامليبنة وقاصديين يجيبوه_لاحظوا ان وقتها كان فى ناس تانيه قريبه من الحكم وبيقولوا انهم كان ممكن يكونوا رؤساء بس مكانوش على هوى البعض_ المشكله مش فى الرئيس. يموت الرئيس حيطلع غيره كتير المهم فى الحمام القديم ااقصد النظام القديم الى عايز يتنسف من اساسه. الترقيع مش حيفيد الله يرحمة عبد الناصر لو كمل جميله وعمل بلد صح ليها قوانينها ومؤسساتها ماكنش ده حصل الله يسامحة بقى وعلى فكره يوم يموت الرئيس اكيد الناس حتبقى فرحانه مش لا سامح الله علشان مات لا علشان حتاخد 3 ايام اجازة قولوا ااامييييييين يااااااارب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113649/http://www.20at.com/article2.php?sid=400"

