subject = "منك لله يا سادات"
author = "إسلام الأصلي . . تاني"
posted = "2006-02-09"
text = "وبالمناسبة انا لي همسة عتاب على الباشمهندس الراحل السادات . .<br />عيب عليك . . حقيقي عيب عليك وحرام عليك . . يا ريس يا راحل اللي انت عملته ده اسمه هزار بوابين<br />حد يهزر مع شعبه يقوم يلبسه خازوق لمدة 25 سنة؟؟<br />طبعاًانت كنت مهيس وضارب سنة افيون من اللي متوصي عليها في تذكرة داوود بتاعة زمان يوم ما عينت المحروق اللي اسمه حسني نائب للرئيس<br />ومش بعيد تكون قلت في سرك اهو كلها كام شهر والشعب يكتشف اني سبت له خازوق مش رئيس ويقوم يخلعه . .<br />عاجبك يا رخم؟ اهو الخازوق تغلغل وانتشر وبقى معشش في كل حتة في مصر ومش راضي يطلع . . دي عملة دي؟<br />جتك القرف فيك وفي النايب بتاعك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113649/http://www.20at.com/article2.php?sid=400"

