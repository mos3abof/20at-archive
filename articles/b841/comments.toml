subject = "هام للغاية"
author = "ديمة"
posted = "2006-05-23"
text = "كلام مهم اوى يامروة وامانة حقيقية فى نقل كل كلمة لها علاقة بالموضوع، المفروض انتكون هذه الندوة تجمع جماهيرى فى شوارع مصر من القاهرة لشرم الشيخ لمواجهة هذا الخطر الذى لايرحم فمن ناحية كما قلت فى البداية يهددنا ما يهدد العالم اجمع من سيطرة الشركات الرأٍمالية الالمية ومن ناحية اخرى نخترق من جانب الصهاينة، تسلم ايديكى"
archived = "2006-11-02"
