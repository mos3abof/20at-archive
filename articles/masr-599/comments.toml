[[comments]]
order = 2
subject = "نظافة نظيـــــــــــــف"
author = "مصــرية"
posted = "2006-07-02"
text = "أقترح على السينمائى اللامع نظيف الأستعانة بسيناريست جديد أكثر موهبه لتقديم حبكة درامية أكثر اقناعا فيما يخص أمور الوطن لأن السيناريست الحالى درجة ثالثة وكل أفلامه هابطه لا يقتنع بها حتى العبيط ولا الأهبل ولا المتخلف عقليا وهذا ما يفترضه فى الشعب المصرى..للأسف كل الرويات والدراما التى تقدمها الحكومة روايات غبية لا تنطلى الا على من هم فى مثل غبائهم الذى لم يمكنهم من فهم ما بين سطور عدم التعرض للذمة المالية لأى مسؤول أو موظف عام!!!!!!!!! لماذا وضعت هذه الفقره ؟؟؟؟؟؟؟؟ ما الذى يخشاه أى انسان من المساءلة عن ذمته المالية اذا كان نظيفا يا دوك نظيف؟؟؟؟؟؟؟؟؟الأجابة واضحة وضوح الشمس ..أم هل معنى ذلك اعلان صريح للشعب أن الأموال ليست أموالكم وأنتم لستم سوى عبيد بالأجرة التى يمن عليكم بها أسيادكم وليس من حق العبد أى يسأل سيده من أين لك هذا؟؟؟؟؟ . أى ساذج اواهبل لن يمر عليه هذا الأمر مرور الكرام..كان من الأوقع والأكثر اقناعا لو صاغ لكم قانون بتأميم عقول الشعب وأقلامه وأمواله حتى تكون الأمور اكثر شفافيه علىحد قولكم ويعلم الشعب المصرى انه ليس من حقه فى الحياه سوى ما تسمحون وتمنون عليه من التنفس..الم أقل لك سيناريو رخيص ..<br />صحيح ان لم تستحى فافعل ما شئت<br />يا خير اجنـــــــــاد الأرض<br />انقذوا الوطــــــــــــــن"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010846/http://masr.20at.com:80/article.php?sid=599"

