subject = "شيلوا صورة مستر رابسو دي .. عندي حساسية منه"
author = "واحد من أولاد بهية الغلابة"
posted = "2006-07-09"
text = "والنبي يا شباب شوفوا شكل الراجل ده اللي أهله سموه نظيف بالغلط .. طبعا وقطعا ويقينا هو عكس أي نوع من أنواع النظافة .. ممكن تكون من ناحية تنظيف جيوب المصريين .. لكن مستر رابسو ده مجرم وجاء في زمن مجرم ونظام مجرم والله يعينك يا بهية .. إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-07-19"
