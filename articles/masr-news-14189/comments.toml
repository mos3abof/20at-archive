text = "تقرير رسمى<br />الغذاء المصرى يجيب السرطان<br />وفى التقرير ان الاسراف فى اطعام الدجاج فى مزارع الدواجن بالهرمونات وكذلك الحيوانات وفى النباتات المهجنة وفى الفاكهة الملعوب فى جيناتها كلها تجيب السرطان<br />ويظهر ان الحكومة عارفة كل حاجة ومطنشة علشان تموت الناس ومدام هم الاكل بييجلهم بالطيارات"
