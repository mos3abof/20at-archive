author = "دعاء"
posted = "2009-11-29"
text = "يقول ربنا سبحانه وتعالى في القران<br />وما هم بضارين به من احد الا باذن الله<br />يعني مرض السرطان لا يضر الانسان الا باذن الله<br />فدائما الواحد يتحصن بالدعاء وبذكر الله ويدعو الله الوقاية من الامراض لان زي ما قال اخونا المعلق السابق<br />كل حاجه في مصر اصبحت بتجيب سرطان<br />تلوث الجو الرهيب اللي موجود في مدينة القاهرة بسبب حرق الزباله وعوادم السيارات المسبب الرئيسي للسرطان والفشل الكلوي<br />لطفك يا رب"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202085605/http://www.20at.com:80/masr/news/14189-2009-11-29-10-48-44.html"

[[comments]]
order = 1
subject = ""
author = "بس !!!!!"
posted = "2009-11-29"
text = "الكمامات بس اللى فى السوق مسرطنة<br />يا اخى قحة<br />انت لا تاكل جبنة من السوق فيها فورمالين مسرطن<br />بتوع الجبنة بيحطوا فورمالين بتاع حفظ الجثث فى المشرحة علشان الجبنة لا تعفن<br />كل حاجة فى البلد دى يا اما منتهية الصلاحية يا اما بتجيب سرطان<br />لان البلد دى مفيش فيها اى رقابة<br />فيها امن سياسى بس<br />يحرس الكبار<br />ويحرس الوزراء بمواكب بنشوفها فى الشارع<br />وكل يوم يقبض على شوية عيال بدقون بتهمة تكدير الامن<br />انما الشعب يولع بجاز وسخ<br />وعايز تصدق<br />روح قف امام مستشفى سرطان الاطفال الجديد المبنى من التبرعات وشوف كم طفل بيدخل وكم طفل بيخرج<br />يا راجل<br />دة حتى دولة زى ايطاليا عملت اتفاقية مع مستشفى السرطان عندنا علشان تدرب الاطباء الايطاليين فى مستشفى مصر لكثرة حالات السرطان عندنا<br />مهزلة"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202085605/http://www.20at.com:80/masr/news/14189-2009-11-29-10-48-44.html"

