posted = "2009-10-12"
text = "ماذا تعرف عن البوسة أو القبلة ؟؟<br />بعد دراسات كبيره جدا تبين التـــــــالي :<br />1- عندما يقبِّل الأشخاص بعضهم فإن 29 عضلة تشترك فى هذا.<br />2- وأكثر عضلة تعمل هنا هي العضلة التي تعطي للشفاه وضعية<br />القبلة ، ويتم استهلاك 12 حريرة ** كالورى ** في كل قبلة.<br />3- ويخفق القلب 150 ضربة في الدقيقة ويرتفع إيقاع التنفس من 13<br />حتى 60 .<br />4-ويرتفع ضغط الدم ويتمرن القلب وكأن الإنسان قد ركض<br />100 متر.<br />====>> ( لغير مرضى الربو )<br />5- في القبلة التي تستمر لفترة ثلاث ثوان يرتفع النبض إلى 130<br />نبضة بالدقيقة، غير أن غالبية القبل لا تستمر أكثر من<br />ثانية.<br />====>> ( لغير مرضى الـقـلب )<br />6- كما وأنه في أثناء التقبيل يتم طرح الأدرينالين والأنسولين<br />، فينخفض بهذا محتوى الدم من السكر وتحطيم السكريات والدهون<br />والمواد الضارة !!<br />***** ينصح المتخصصون في ازدحام السير بالتقبيل المكثف قبل السفر<br />لمسافات طويلة ومرهقة .<br />معقوله كل هذي الفوائد ببوسه"
archived = "2009-10-15"
capture_url = "https://web.archive.org/web/20091015063740/http://www.20at.com:80/masr/t7kyk/13690-2009-10-12-12-00-50.html"

