subject = ""
author = "البوسة الهادفة 1"
posted = "2009-10-12"
text = "البوسة الهادفة<br />أول ما يتعلم الطفل في مصر بعد البصق على الآخرين (تف على اونكل يا حبيبي) هي البوسة، في الغالب تأخذ البوسة أسماء متعددة ، فهي القبلة باللغة العربية ، وهي (إدي لعمو سكر) بالنسبة للاطفال الصغار، و(إديني أطة) عند الجيل القديم من الرجال المصريين (جيل انقرض والحمدلله) ، ولو ذهبت للدول العربية ستجد كل دولة لها عادة في التقبيل عند التحية على عكس الدول الاوروبية تماماً الذين يرون أن البوسة ما لم تكن للحبيب أو الحبيبة أو الطفل الصغير فهي جلابة المرض (بوس إيه وقرف إيه يا نيلة إنت)!!<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-10-15"
capture_url = "https://web.archive.org/web/20091015063740/http://www.20at.com:80/masr/t7kyk/13690-2009-10-12-12-00-50.html"

[[comments]]
