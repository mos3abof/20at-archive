text = "انا بردانه اح<br />بوس الواوا بوس الواوا خلي الواوا يصح<br />لما بست الواوا شلته خلا الواوا بح<br />بوس الواوا بوس الواوا خلي الواوا يصح<br />لما بست الواوا شلته خلا الواوا بح<br />بأربك خليني اغمرني ودفيني أنا من دونك<br />أنا بردانه أح<br />ليك الواوا بوس الواوا خلي الواوا يصح<br />لما بست الواوا شلته الواوا بح<br />ليك الواوا ليك<br />ليلي أحلى سهرة عند أصحابي<br />بدي أياني ألبس أحلى تيابي<br />ليلي أحلى سهرة عند أحبابي<br />بدو أياني ألبس أحلى تيابي<br />بلبس لعيونك ياحبيبي<br />كل جديد ودح<br />ليك الواوا بوي الواوا خلي الواوا يصح<br />لما بست الواوا شلته الواوا بح<br />ليك الواوا بوي الواوا خلي الواوا يصح<br />لما بست الواوا شلته الواوا بح<br />ليك الواوا ليك<br />بوسق فيك وبدي تبآى حدي<br />أنت بين الناس الاإلى عندي<br />بوسق فيك وبدي تبآى حدي<br />أنت بين الناس الأغلى عندي<br />وآخر همي شو ما يقولو<br />غلط وإلا صح<br />ليك الواوا بوي الواوا خلي الواوا يصح<br />لما بست الواوا شلته الواوا بح<br />ليك الواوا بوي الواوا خلي الواوا يصح<br />لما بست الواوا شلته الواوا بح<br />بأربك خليني اغمرني ودفيني أنا من دونك<br />أنا بردانه أح"
