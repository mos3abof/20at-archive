posted = "2009-10-12"
text = "اهي دي القبلة ولا بلاش<br />قطعت إسرائيلية بطريق الخطأ جزءا من لسان صديقها العربي خلال قبلة محمومة بينهما، حيث تم إسعافه إلى المستشفى التي أعادت الجزء المقطوع من اللسان وغادر المستشفى بعد العملية مع نصائح الأطباء بعدم التقبيل إلى أن يلتئم جرحه.<br />وقال الناطق باسم مستشفى مدينة \"نهاريا\"، زيف فاربر، إن شابا عربيا من شمال إسرائيل وصل الليلة إلى غرفة الطوارئ في المستشفى ترافقه فتاة ويحمل كيسا من النايلون فيه قطع من الثلج وشيئا بداخله مغطى بالدم.<br />وانتبه الأطباء في غرفة الطوارئ أن الشاب (30 عاما) الذي كان ينزف بشدة من فمه تمكن بصعوبة النطق ببعض كلمات فهم منها الأطباء أنه فقد جزءا من لسانه.<br />وتبين أن الشاب كان يتبادل القبل مع الفتاة التي ترافقه، وإذا بها تقضم جزءاً من لسانه.<br />وقامت الفتاة بوضع الجزء المقطوع من لسان حبيبها في كيس بين قطع ثلجية وهرعا إلى المستشفى، واستقبله هناك الطبيب الجراح وادخله غرفة العمليات فورا، وبعد عملية تنظيف الجرح، اعاد الطبيب للمصاب الجزء المقطوع من لسانه. ونصح الأطباء الحبيب باحتساء مشروبات مثلجة وتجنب \"التقبيل بالفم\" حتى يلتئم جرحه."
archived = "2009-10-15"
capture_url = "https://web.archive.org/web/20091015063740/http://www.20at.com:80/masr/t7kyk/13690-2009-10-12-12-00-50.html"

