subject = ""
author = "مدارس بوس الواوا"
posted = "2009-10-12"
text = "انفراد مصرى …..افتتاح سلسلة مدارس بوس الواوا<br />فى بلدنا المحروسة لابد من انشاء مدارس تعلم المواطنين كيفية بوس الواوا وان تكون وزيرة هذه المدارس الفنانة العالمة هيفاء وهبى وذلك بعد زواجها من الفحل المصرى احمد ابو هشيمة ….<br />.ليه بقى ؟؟؟؟؟؟؟؟؟<br />لان الراجل صرف عليها كوم دولارات من اموال الغلابة علشان يتجوزها ويعرف ازاى يبوس الواوا وعلشان مصر دى امنا كلنا فلازم يتولى معاها تعليمنا ازاى نبوس الواوا ونتطور زى الناس مش نضرب الواوا بالجازمة ده يبقى تخلف وبعدين انا فكرت ازاى المغامر احمد ابوهشيمة يعوض للبلد الفلوس اللى صرفها علشان يعرف الواوا بتنباس ازاى<br />شوف يا سيدى …مافيهاش حاجة لما العالم كله يبعت لينا بعثات علمية للتعلم فى مدارس بوس الواوا والحصول على شهادات عليا وساعتها هتنشط السياحة وهينصلح الحال وممكن نطلق على احمد ابو هشيمة اسم احمد حرب تيمنا بالزعيم الاقتصادى المصرى طلعت حرب<br />ويجعله عامر يابلد من غير صاحب"
