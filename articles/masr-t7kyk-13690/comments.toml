subject = ""
author = "البوسة الهادفة 3"
posted = "2009-10-12"
text = "في السينما المصرية اخترع المخرجون والممثلون المصريون مصطلحاً غريباً هو مصطلح (البوسة الهادفة) لمواجهة عواصف الانتقادات التي تثار ضدهم بين الحين والآخر بسبب زيادة البوس عن معدلاته الطبيعية في الفيلم، وهي بوسة موظفة درامياً (زي موظفة الحكومة كده)، ولابد منها في سياق الفيلم (واحد متجوز واحدة أكيد مش هيعاملها زي أمه ) ، لكن الغريب أن الفئة ذاتها من المصريين -فئة الممثلين والمخرجين- هي التي ابتكرت مصطلحاً آخر غريبا هو مصطلح السينما النظيفة تماما من البوس لدرجة قد تتسائل :لماذا لا يضعون تحذير على الافلام مثل (فيلم خالي من البوس) أو (بوستين في كل مشهد) ؟ ..ويذكر البعض فيلم “ابي فوق الشجرة” الذي أنتج بعد نكسة يوليو الشهيرة والذي احتوى على اكثر من 27 بوسة ، فقد كانت مشكلة عبد الحليم حافظ في الفيلم إنه مش عارف يبوس ميرفت أمين ، وهكذا ولدت الدراما فابتعد عنها ليبوسة نادية لطفي كمية البوس التي دفعت الناس للاندهاش، ودفعت الرئيس جمال عبد الناصر نفسه للسؤال عن الفيلم بدهشة فبل أن يقول -كما نسب له : خلي الناس تنبسط ، ”.<br />مش رضوى حسن ولا مروى صلاح"
archived = "2009-10-15"
capture_url = "https://web.archive.org/web/20091015063740/http://www.20at.com:80/masr/t7kyk/13690-2009-10-12-12-00-50.html"

[[comments]]
order = 7
subject = ""
author = "البوسة الهادفة 2"
posted = "2009-10-12"
text = "البوس عند المصريين لا ينتهي ، فنحن شعب (مقضيينها بوس)، يتعلم المصري أن يبوس الخدود تحية ،وأن بوس الرأس اعتذار ( أحب على راسك يا معلمي) ، وان بوس اليد احترام (مع الجد والأب والأم) ، أو إتيكيت مع بعض أصناف السيدات ، أو مذلة ( أبوس إيدك يا مستر أروح الحمام) ، أما أسوأ بوسة فهي تلك التي تتعلق بالمهانة (ما بقاش أنا لو ماخلتهوش يبوس الجزمة).<br />ولو رجعت للتاريخ فستجد أن موضوع البوس عند المصريين طبيعي جدا، حيث رسم الفراعنة على جدران المعابد أشخاصا يتبادلون القبل ، لكن الواقعة التي يذكرها التاريخ جيداً هي واقعة كليوباترا الملكة المصرية التي كانت تكافئ جنودها الشجعان بتقبيلهم ، وهي العادة التي اندثرت بعدها حيث أصبح الحكام من الرجال الذين سيفهمون حتماً بطريقة خاطئة إذا قال أحدهم لجنوده ما تجيب بوسة) بس طبعاً بالهيروغليفي !!<br />مش احمد الهواري ولا عبدالله الطحاوي"
archived = "2009-10-15"
capture_url = "https://web.archive.org/web/20091015063740/http://www.20at.com:80/masr/t7kyk/13690-2009-10-12-12-00-50.html"

[[comments]]
