author = "جمعية لمنع القبلات"
posted = "2009-10-12"
text = "انشاء جمعية لمنع القبلات بين الأزواج<br />أعلن دكتور عادل عاشور أستاذ طب الأطفال عن رغبته في انشاء جمعية لمنع القبلات بين الأصدقاء و زاد على ذلك بإعلان رغبته في منع القبلات بين الأزواج ,أكد دكتور عادل أن كافة الأبحاث العلمية التي نشرت في كبرى المجلات الطبية العالمية أجمعت على الأضرار الطبية الخطيرة التي يسببها تبادل القبلات من خلال انتشار العدوى من الأمراض الزكام و الرشح والتي يجب عدم الاستهانة بها حيث قد تصيب الخلايا المبطنة لخلايا ا لمخ و ينتج عنها ارتفاع شديد في درجة الحرارة يصعب السيطرة عليها و قد تؤدى الى الوفاة في بعض الأحيان أيضا التهاب الغدة النكفية و كذلك الحصبة الرمادية و الألمانية و الفيروسات الكبدية وأكد أن الجمعية تضم في عضويتها كافة التخصصات الطبية لشرح الآثارالسي ئة للقبلة .<br />وعن رأى الدين في أهداف هذه الجمعية أكد الدكتور إسماعيل معروف بجامعة الأزهر أن تعاليم الدين الأسلامى تحرم القبلة في غير الإطار الزوجي وقد أكد العلم على وجود إضرار جسيمة لذلك._______________ ____________<br />مش دعاء حسن ولا دعاء الشامي"
archived = "2009-10-15"
capture_url = "https://web.archive.org/web/20091015063740/http://www.20at.com:80/masr/t7kyk/13690-2009-10-12-12-00-50.html"

