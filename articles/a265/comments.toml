[[comments]]
order = 0
subject = "سيادة المحافظ"
text = "جرى ايه يا إخوانا<br />يا بتوع عشرينات<br />انتم مش عاجبكم حد؟...<br />طايحين في الكل كليلة؟ (ودمنة)<br />ايه يا جدعان<br />طيب القذافي وقلنا لاسع وبتاع كتب ملونة<br />لكن الراجل الأمير الكبارة اللي اسمه بيرلمسكوني<br />كمان طلعته فيه القطط الفاطسة<br />عيب قوي يا قوى الظلام يا فئة منحرفة<br />يا قلة ( أو زير) مأجورة<br />يا<br />ولا بلاش<br />إخص<br />إخص<br />إخص<br />انت ياد يا غاندي<br />لم الدور في التصويت<br />لأنك مأجر عيال يصوتوا لك<br />عقبال ما يصوتوا عليك يا شيخ"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926232518/http://www.20at.com:80/article.php?sid=265"

[[comments]]
order = 1
subject = "غاندي البلد"
text = "عجيب سيادة المحافظ ده .. كل ما يتزنق في حاجة .. يشتم غاندي البلد .. كان مفيش حد غير غاندي البلد في المنتأة .. إيه يا أخي .. لو مضايق من إني بأجر ناس تصوت لي .. أجر أنت كمان ..<br />إنما أنا عندي سؤال لسيادة المحافظ<br />هو أنت محافظ إيه بالظبط: محافظ من المحافظين الجدد، ولا محافظ على مشاعري.. ولا مَحافظ جلد .. ولا محافظ مدينة خلتأوش..<br />وعلى الرأي المثل : اللي تفتكره محافظ يطلع بطيخ..<br />ويلا .. الفلوس بتروح وتيجي<br />مع تحياتي العطرة : غاندي البلد<br />قريباً في الأسواق: شامبو غاندي البلد<br />زبادي رجيم غاندي البلد<br />مستحضرات توحيش غاندي البلد<br />مع غاندي البلد .. الحياة أحلى ً"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926232518/http://www.20at.com:80/article.php?sid=265"

[[comments]]
order = 2
subject = "سيادة المحافظ"
text = "أنا ماسك لساني بالعافية<br />ولامم نفسي<br />بالنسبة لفكرة المحافظ ده لغز مش هقوله لك دلوقتي<br />لكن عامة<br />هو مزيج من الانتشال الأفقي ووالمعينات اللولبية متحولة إلى لولميات المستقبل في العائد الاقتصادي لدودة القز وتأثيراتها على التنمية البديلة للمتطلبات المرحلة الزفت اللي احنا عايشينها<br />أو بعبارة أخرى الثورة السمكية وانبعاثات ريودي جانيرو- بنها العسل رايح جاي... ولوضوح اكثر استعمل مبيد حشري بيرت بلاس لتخفيف الشعر ونحل الوبر ورعاية القشرة<br />هو فيه ايه؟ ايه الاستظراف اللي انا بكتبه ده؟<br />إخص<br />إخص<br />إخص"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926232518/http://www.20at.com:80/article.php?sid=265"

