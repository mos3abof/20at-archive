text = "المسلمون في الغارب هما امل المسلمين في العالم كله ان ينصرهم الله ويجري عتلى ايديهم المعجزة كما اجراها على يد محمد الفاتح<br />يا رب انفخ في صورة المسلمون في الغرب وشد ازرهم يا رب واشف صدور قوم مؤمنون يا رب"
archived = "2010-01-17"
capture_url = "https://web.archive.org/web/20100117012003/http://www.20at.com:80/masr/hot-topics/9153.html"
