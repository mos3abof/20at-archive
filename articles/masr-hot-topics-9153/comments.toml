subject = ""
author = "مش بحبك"
posted = "2008-05-22"
text = "حتى يرضى الاقباط<br />اولا لابد ان يعترف المسلمون انهم غزاه محتلين وانهم ليسوا اصحاب الارض<br />ثانيا لا بد لمجلس الوزراء كله يكون من الاقباط المسيحيين<br />اعطاء مجلس الشعب كلهم لا بد ان يكونوا اقباط<br />كل اساتذة الجامعات لا بد ان يكونوا اقباط وخصوصا كلية الطب<br />كل قيادات الجيش والشرطة لابد وان يكونوا اقباط<br />;كل الوظايف العليا لا بد ان يكونوا اقباط<br />كل التجار لا بد ان يكونوا اقباط<br />هذه هي باختصار مطالب الاقباط<br />وان يعترف المسلمون ان الاقباط هما الاغلبية الساحقة مع ان عدد المسلمين السنة في مصر 94 %<br />عجبي"
archived = "2010-01-17"
capture_url = "https://web.archive.org/web/20100117012003/http://www.20at.com:80/masr/hot-topics/9153.html"

[[comments]]
order = 1
subject = ""
author = "من البشر"
posted = "2008-05-22"
text = "فى انجلترا 5 مليون مسلم<br />وفى فرنسا 6 مليون مسلم<br />وفى المانيا 3 ملايين مسلم<br />وفى روسيا 30 مليون مسلم<br />ولم نسمع طلبات من هذة الاقليات بأن يخصص لهم نسبة من الوزراء او المحافظين او الوظائف العليا<br />الا فى مصر<br />عندنا اربعة ملايين نصرانى من بقايا الاحتلال الرومانى بعيونهم الخضراء وشعرهم الاصفر ووجوههم البيضاء يصيحون صبحا ومساءا وبالذات كلاب المهجر عن الاضهاد وعدم وجود نسبة لهم فى الوزراء والمحافظين<br />ان الدولة متراخية معهم بالذات ومع تلك الجالية النصرانية المسماة خطأ قبطية وهى رومانية"
archived = "2010-01-17"
capture_url = "https://web.archive.org/web/20100117012003/http://www.20at.com:80/masr/hot-topics/9153.html"

