text = "مطلوب قانون لمنع بناء كنائس عشوائية - كنائس لا - اللى عايز يصلى يصلوا فى صالات واسعة - انما ابراج وصلبان دى لا<br />مصر دولة موحدة باللة منذ الفراعنة ولا يوجد تثليث فيها منذ الالة رع وامون<br />اما بتوع التثليث - ايزيس الام مريم - والاب ازوريس - والابن يسوع اللى هو حورس فدى اقلية ضئيلة جدا من ايام الفراعنة<br />مصر دولة موحدة باللة الفرد الصمد"
archived = "2010-01-17"
capture_url = "https://web.archive.org/web/20100117012003/http://www.20at.com:80/masr/hot-topics/9153.html"

