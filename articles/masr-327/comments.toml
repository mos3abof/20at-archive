[[comments]]
order = 1
subject = "ههههههههههههه"
author = "القهوه هناك ياسيدى بـ 175 قرش سعير بسيط جدا"
posted = "2006-05-15"
text = "ممكن تزور الاماكن الجميله دى على فكره وسط البلد من اجمل الاماكم فى مصر كفايه بس انك بتشم رائحه الناس الى عصرت ايام زمان ياااااااااااااااااه بجد بجد مقال اكثر من روعه للاخت الكاتبه هذا<br />الى الاخ الى بيسال عن اسعار المشروبات هناك لو عايز تعرف اى حاجه عن مصر القديمه ووسط البلد ممكن تتكرم وتكلمنى على الاميل هذا وانا تحت امرك واى حد مصرى احنا لبعض بننطحن سواء وبنجوع سواء وهنموت من القهر والظلم الى احنا عايشين فيه سواء<br />a_matrix_a@msn.com<br />اخوك : السيد"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192717/http://masr.20at.com:80/article.php?sid=327&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

