subject = "ريش العظيمة"
author = "السعيد المصرى"
posted = "2006-05-15"
text = "رائع هو المقال<br />ووصلنى احساس المكان وتخيلت نفسى<br />اقف امام الصور المعلقة<br />بس ريش لسة مليئة بالرواد<br />سؤال بسيط رخم<br />هيه القهوة هناك بكام<br />وممكن اى حد يدخل كدة"
