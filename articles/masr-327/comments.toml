[[comments]]
order = 3
subject = "ريش وبرجوان وأمثالهما"
author = "ابن عاشور"
posted = "2006-05-16"
text = "بغض النظر عن التعليقين الأخيرين على الموضوع والتي يحاول صاحباها أن يتظارفا ويخلانا في حارة جانبية<br />لا شك أن الإحساس بالزمن القديم وبالثقافة يأتيك عندما تمر على مقهى ريش، لكنني أحب أن ألفت الانتباه إلى أن مقهى ريش وأخيه برجوان وسائر مقاهي وسط البلد التي كان يفتحها الخواجات ويقدمون فيها الخمور ويتناول روادها الخمور على أنه شيء عادي..يعني جزء من حياة الأسرة المصرية العادية..أظن أن هنا المفارقة والتي جعلتني حينما دخلت للمقهى في المرة الوحيدة التي دخلتها أحس بعدم الارتياح وبأن شيء غريب علي يحيط بي..وبأن الجلوس في المكان شبهة..بغض النظر عن تاريخ المثقفين والفنانين الذين كان البعض منهم لا شك يحب إنه يعدل دماغه عشان يبدع، وعشان كدة كانو ييجوا يسهروا في ريش وأخواتها<br />نعم هي جزء من مصر، ولكن مصر الخواجات والجاليات الأجنبية الذين تكاثروا في مصر بداية من فترة حكم محمد علي.. وكانت زيادتهم طفرية في ظل الاحتلال البريطاني وأضر بعضهم بالاقتصاد والثقافة المصرية مع الإقرار أن البعض منهم كانو يعيشون في سلام ووئام مع جيرانهم من أهل البلد، ومن ثم فإن المقهى هي من بقايا ريحتهم<br />كون أن المثقفين والفنانين كانوا يجدون أنسهم ومتعتهم في هذا المكان شيء آخر<br />أو كون أن المقاهي المصرية الأخرى لم تحفظ لها تراثا وتاريخا كتلك المقهى الخواجاتي فذلك أيضا شأن آخر<br />صباح الثقافة والمعرفة"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192717/http://masr.20at.com:80/article.php?sid=327&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "جه في وقته"
author = "سنووايت"
posted = "2006-05-16"
text = "فرحت اوي قول ما قريت العنوان بره في الصفحه الرئيسية وجدتني اصفق بيدي كالاطفال واقول اكيد قهوة ريش<br />كنا محتاجين لموضوع زي ده وحكاية في شوارع القاهرة اللي مليانه باسرارها ميدان طلعت حرب - والشوارع اللي جنبه اللي مليانه ريحه الوطن على راسها قهوة ريش وشارع الشيخ ريحان وندوات ايام الثلاثاء في أتيليه القاهرة مش عارفه انا فرحت اوي بالموضوع ومشيت مع مفرداته في عالم الابداع السحري التاريخ والحلم والوطن"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192717/http://masr.20at.com:80/article.php?sid=327&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "اليهود وخطط جهنمية ضد مصر"
author = "صايع وقديم"
posted = "2006-05-16"
text = "اليهود وخطط جهنمية ضد مصر<br />بسم الله الرحمن الرحيم<br />تقديم<br />الحمد لله رب العالمين القائل سبحانه (إنَّمَا يَخْشَى اللَّهَ مِنْ عِبَادِهِ العُلَمَاءُ) [ فاطر :28] ، ونشهد أن لا إله إلا الله وحده لا شريك له ، ونشهد أن محمداً عبده ورسوله الذى علمنا أن \" العلماء هم ورثة الأنبياء \"، اللهم صلى على محمد وعلى آل محمد كما صليت على إبراهيم وعلى آل إبراهيم ، وبارك على محمد وعلى آل محمد كما باركت على إبراهيم وعلى آل إبراهيم ، إنك حميد مجيد .<br />.... أما بعد<br />* فهذا كتابنا \"الرابع\" \" الإستعمار والصهيونية وجمع المعلومات عن مصر \".ضمن سلسلة نحو وعى سياسى واستراتيجى وتاريخى \" ، بقلم الأستاذ الدكتور حامد عبد الله ربيع .<br />* وقد نشرت مقالات هذا البحث تباعاً فى الأهرام الاقتصادى تحت عنوان رئيسى \" إحتواء العقل المصرى \" :<br />المقالة الأولى : \" إحتواء العقل المصرى \" العدد 733 القاهرة فى 31/1/1983 .<br />المقالة الثانية : \" دور المعلومات فى الاستراتيجية الأمريكية \" العدد 437 القاهرة فى 7/2/1983 .<br />المقالة الثالثة : \" تحركات السياسة الأمريكية على أرض مصر \" العدد 735 القاهرة فى 14/2/1983 .<br />المقالة الرابعة : \" ولم يتعلم الأمريكيون من أخطائهم \" العدد 736 ، القاهرة فى 21/2/1983 .<br />المقالة الخامسة : \" سياسة جمع المعلومات فى منطقة الشرق الأوسط \" العدد 737 ، القاهرة فى 28/2/1983 .<br />المقاله السادسة: \" التوافق الإسرائيلى الأمريكى\" العدد 738، القاهرة فى 3/3/1988.<br />المقالة السابعة: \" الأمن المطلوب فى سياسة جمع المعلومات \" العدد 739، القاهرة فى 14/ 3/ 1983.<br />* ومجموع هذه المقالات- بإيجاز- تدور حول [ الموضوعات التالية ]:<br />* حرص القوى الاستعمارية والصهيونية- وعلى رأسها أمريكا وإسرائيل وحلف الأطلنطى- على جمع المعلومات عن<br />اقرأ بقية التعليق .."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192717/http://masr.20at.com:80/article.php?sid=327&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "سحر المكان .... يغير الزمان"
author = "واحدة وخلاص"
posted = "2006-05-16"
text = "المقال حلو قوي واسلوب الكاتبة رائع<br />يأخذك في تسلسل بسيط وسهل لتغوص في الكلمات وتحلم بالمكان حتى تتخيله.... و يتجسد امامك وكأنك تراه....<br />اما عن هذة الاماكن في فعلا \"ذات طابع فريد ... وتدخل في نفسك احساس خاص\""
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192717/http://masr.20at.com:80/article.php?sid=327&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

