text = "كنت بدور غى النت على مواضيع عن المقاهى علشان انا بعمل رسالة عن المقاهى فى مصر فى الفترة ما بين 1900 الى الان وكنت مبسوطة جداً بالمقال لان المواضيع او المصادر غير متوفره ومافيش حد فكر يكتب عن موضع زى ده باعتبار انه موضوع غير مهم فأشكرك بشده"
