subject = "السلام عليكم ورحمة الله وبركاته"
author = "سعودية وأفتخر"
posted = "2006-07-10"
text = "لا أعلم لماذا تشن بعض المواقع هجوماً على السعودية وأهلها؟!!<br />أعتقد أن السبب هي الغيرة والحسد على ما وهبنا الله من نعم نحمده عليها كثيراً.<br />أقول بالنيابة عن كل فرد من أفراد المجتمع السعودي بأننا فخورين بانتمائنا لهذا البلد فيكفي أننا أصل العرب ويكفي أن بلادنا فيها الأراضي المقدسة، ولمن ينادي بفتح ملاهي ليلية وحانات فأقول له اتقي الله.. هل ترضى أن تفتتح مثل هذه الأماكن القذرة في أرض نزل بها القرآن؟.. في الأرض الطاهرة التي عاش فيها نبينا محمد صلى الله عليه وسلم حبيب الله؟؟<br />هل تعلم أنت وغيرك أن افتتاح هذه الأماكن سيحدث فساداً ونحن لا ينقصنا الفساد ، يكفي الفضائيات التي تبث سمومها من لبنان والدول الأخرى.. يكفي الإنترنت الذي يحتوي على مواقع تعلم الشذوذ الجنسي وتدعو إلى الإرهاب والفساد بطرق أخرى.. اتقوا الله إن مجتمعنا نظيف وآمن ولسنا بحاجة لأن يتغير.. ويا من تسبون آل سعود لا داعي لهذا الكلام فلولا الله ثم ولاة أمرنا لكان مجتمعنا مليئاً بالانحلال الأخلاقي كالمجتمعات العربية الأخرى.<br />الحمد لله ليس لدينا بفضل هذه الأسرة المالكة مراقص و(رقاصات) و(كباريهات) و(عاهرات في الفنادق)!!<br />بفضل آل سعود ليس لدينا شرب الخمر وأندية للقمار كالدول الأخرى.. وليس مباحاً تعاطي المخدرات والترويج لها.. نحن في نعمة نشكر الله عليها، ولا نريد غير آل سعود ولاة لأمرنا فهم مسيطرون على الوضع تماماً.<br />رجاء دعوا السعودية وأهلها في حالهم.. دعونا وشأننا، وانظروا إلى مجتمعكم أولاً فهو مليء بالمشاكل التي تحتاج إلى حل.. لماذا لا تنتقدون رئيسكم الذي عيشكم في فقر مستمر؟؟<br />لماذا تقولون بأننا فقراء وأغنياء فقط ولا يوجد لدينا طبقة متوسطة مع أن هذا الشيء ينطبق عليكم أنتم فأنا زرت مصر كثيراً ورأيت كيف تعيشون.. لا يوجد لديكم من يعيش بحالة مادية متوسطة، يا غني فاحش الثراء أو فقير يعيش في مكان متواضع!<br />أما نحن فلدينا عدة طبقات.<br />أتساءل.. لماذا لا تتحدثون عن أفلامكم ومسلسلاتكم الهابطة؟<br />لماذا لا تتكلمون عن تلك المخرجة الوقحة (إيناس الدغيدي) التي تحب المشاهد الساخنة ولا يخلو فيلم لها من مشهد إباحي!!<br />من الحماقة أن تقذفوا الآخرين بحجارة بينما بيتكم من زجاج!<br />ومن العيب أن تنتقدوا السعوديين وأنتم لديكم من (الفضايح والبلاوي) في مجتمعكم!!<br />المهم بالنسبة للسينما أقول بأنها ليست ضرورية، فنحن لن نموت إذا لم تفتح لنا دور سينما في بلادنا.. نستطيع مشاهدة الأفلام (النظيفة) في بيوتنا بتحميلها من الإنترنت أو شراء السي دي من أي محل... لا توجد مشكلة كبيرة!"
