text = "خطابي هذا لكل مسلم سعودي أومصري اوغيرة<br />لماذا كل هذا التسطيح فى نقل افكارنا وتخاطبنا . اليست لدينا قضايا ومشكلات اعمق وأهم من هذه الترهات المقيتة نقوم بطرحها ومناقشتها وتبادل الرأي فيها .<br />اني اطلب من كل سعودي ومصري التوقف عن هذا الردح المسخ وليكن شعارنا ( مسلم وافتخر )"
