[[comments]]
order = 11
subject = "السلام عليكم"
author = "عبدالرحمن"
posted = "2006-05-11"
text = "السلام عليكم<br />موضوع جميل .<br />لكن لا اعلم لماذا هذا الهجوم الشديد على دوله اتخذت من دين الاسلام دستورا لها .<br />من قال اننا لسنا احرار ؟ ماذا تريد ان نتكلم عنه بحكم حريتنا هل تريد ان نثور على الحكومه مثلا ؟؟ ام تريد ان نسب ونشتم بالنابر ؟؟ ام تريد ان نطالب بأشياء هي متوفره لنااصلا .<br />الحكومه السعوديه اعزها الله لم تقصر في حق المواطنين السعوديين ابدا فها نحن ولله الحمد نعيش في امان وراحه ليس كبهائم (( سامح الله من قال هذه الكلمه )) .<br />اريد ان اسأل سؤال :<br />هل تعتقدون ان المواطن السعودي لايعرف غير المال والصرف و الطيش ؟؟<br />للأسف يجب ان تعيدوا هذه النظره الغريبه التي لم تظهر الى من الغرب للأسائه لصورتنا. ارجوا ان تعيدوا النظر وان تفكروا قبل ان تحكموا .<br />هل سأل احدكم عن الجامعات ؟ هل سأل احدكم عن التعليم ؟ هل سأل احدكم عن الطفره السعوديه ؟؟<br />ذاذ كان في السعوديه قله طائشون او شباب يستمتعون فهذا الامر لايقتصر على السعوديين بل في كل دول العالم .<br />ارجوا من اخزاننا المصريين عدم التجريح . لأنني بالفعل صدمت . (( هذا وانتم اخواننا اذن كيف هم الغربيون ))<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131541/http://www.20at.com/article2.php?sid=514"

[[comments]]
order = 12
subject = "وضع المجتمع السعودي"
author = "سعودي"
posted = "2006-05-13"
text = "أنا أحد أفراد المجتمع السعودي .. وأعترف فعلا إنه مجتمع متناقض وماله هوية .. يا اما تشدد يااما تطرف يا اما تحرر يا اما انحلال .. ما فيه منهجية معينة للشعب أو للحكومة .. يقولون ان دستورهم هو القران وهم كذابين .. محلات الاغاني مالية الشوارع ومهرجانات الاغاني كل سنة موجودة .. وغيرها وغيرها وغيرها .. احنا ناقصنا يكون قداما قانون واضح نمشي عليه .. وبالنسبة لي أنا أقترح على الحكومة انهم يسمحون بالسينما والمراقص والبارات .. والانسان رقيب نفسه .. وكلنا فاهمين ومتعلمين .. اللي يبغى يدخل يدخل واللي ما يبغى براحته<br />شي ثاني .. الحين انتوا يا مصريين تاكلو من خيرنا وتتنكروا لينا .. مالين عندنا البلد ومضيقين علينا وتتبجحوا برضه .. حقيقي ما عندكم دم .. سلمي لي على خالك ياsweet_princess وقولي له يرجع الفلوس اللي سرقها .. زي زي كل مصري حرامي مقيم في السعودية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131541/http://www.20at.com/article2.php?sid=514"

[[comments]]
order = 13
subject = "خليك محترم"
author = "مصري"
posted = "2006-05-18"
text = "هحترم نفسك يا اخ و فوق المصريين مش حرامية المصريين دول هما اللي علمك وعرفوك ازاي تقرا و تكتب علشان اول لما تشتم تشتمنا و الفلوس اللي انتو فرحانين اوى بيها دي من غير علم ولا حاجة احنا الي فضلنا عليكم من راسكم لرجليكم و اللة يرحم كنتوا اية من 50 سنة بس ولا خلاص نسينا ابقى اسال جدك اصل الموضوع مش بعيد اوى يعنى ولا فاكرين نفسكم كدة من زمان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131541/http://www.20at.com/article2.php?sid=514"

[[comments]]
order = 14
subject = "اندماج مجتمعات"
author = "الفارس"
posted = "2006-05-19"
text = "الغريبه يا اخوان ان مافي احد ذكر ان المملكة عباره عن مجتمعات مختلفه وهي الآن في حالة اندماج لولادة مجتمع جديد . ونحن الآن في ولله الحمد في حالة حوار وطني عظيم في ظل حكومتنا الرشيده . هذا اللي لازم يصير . اما عن المتكلمين من خارج الوطن والآكليين من خيرها ويتكلمون عنا بالسوء . ياليت يشوفو مجتمعهم ويحسنو منه بدل ما ينتقدونا لان مشاكلهم انا متأكد من كلامي اكثر منا بكتير . وبالنسبه للاخ اللي يقول هم علمونا ولبسونا وضبطونا . لاتنسى ان هذا كله من خيرنا وزي ماجبناكم نجيب غيركم وهذي هي الحياه فيد واستفيد. بس هذا مو عيب ابدا ( مجتمع جديد ) لايمكنك التحدث عن العموم . وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131541/http://www.20at.com/article2.php?sid=514"

