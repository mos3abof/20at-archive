[[comments]]
order = 1
subject = "تناقضات المجتمع السعودي"
author = "قد يستغرب البعض التناقضات الواقعة في هذاالمجتنع ، فمن نزعة نحوالتدين المفرط الى نزعة نحو التغريب المفرط ."
posted = "2006-03-03"
text = "سبب ذلك هو تسلط أسر ال سعود الفاجرة على هذا المجتع المتدين ، فما ترونه من اثار التغريب في هذا المجتمع فهو من تأثير هذه الاسرة الخبيثة ، وما ترونه من مظاهر تدين فهو من هذا الشعب الطيب المبارك -شعب الحرمين.<br />وحتى ينسجم هذا المجتمع قيادة وشعبا ، وتخفي مظاهر التناقض هذه ، فلابد من ازالة هذه الاسرة الخبيثة ، وأن يتولى الحكم رجال يختارهم الشعب بنفسه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131541/http://www.20at.com/article2.php?sid=514"

[[comments]]
order = 2
subject = "تعليق مخنوق"
author = "Dabdoob"
posted = "2006-03-03"
text = "انا نفسي اعرف الاخت اللي فوق عايزانا نكتب مواضيع عن ايه مثلا في المجتمع السعودي ؟ لما نكتب عن مشاكل العزاب يقولوا ده موضوع تافه ولما نكتب عن العيلة المالكة يقولوا اننا فاسدين وفاسقين ولما نكتب عن الصراع داخل المجتمع السعودي بين التغريب والتدين المتشدد يزعلوا بس اما نكتب عن رقصة العارضة الهبلة ينبسطوا !!!!!!!!!!<br />في ايه ؟<br />ويا ريت اعرف المواضيع اللي عايزينا نكتب عنها في السعودية ويا تري هي مواضيع من عينة (الملك راح الملك جه الملك دخل الحمام الملك ولله الحمد خرج من الحمام )<br />اما بالنسبة للاخ الي نسي يكتب اسمه فانا شايف ان العيلة المالكة مالهاش دعوة المشكلة في المجتمع نفسه مفروض عليه التدين بطريقة معينة ومحروم من حاجات كتير لاسباب كتيرة اجتماعية وسياسية وده سبب التناقض الرهيب بين الافكار عند الشباب هناك<br />يلا مع السلامة<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131541/http://www.20at.com/article2.php?sid=514"

[[comments]]
order = 3
subject = "السعوديه بين كفي عفريت"
author = "جنون قلم"
posted = "2006-03-03"
text = "بعد ماقراءت من التعليقات على موضوع احببت ان ابين ... وخصوصا انني من السعودية<br />ما يلي :<br />اننا دوما نسعى الى إلقاء اللوم على الاخرين في سبب الفساد وغيره والصحيح المعروف ان التربية هي موطن الخلل (واعني التناقض بين البيت والمدرسة والمجتمع والشارع )فما يتعلمه شيء والواقع شيء اخر<br />اننا كعرب لا نفلح الا بالنقد وتحليل دون المبادره لاصلاح الخلل .<br />اما اسلوب الحوار بيننا وكما اقراء فللاسف يحمل كثيرا من عقلية صغيره فسب وشتم من ابسط مايقال ...<br />اما مايقال بفرحنا عن مايقال عن الفنانين \"اقصد مهابيل\" فهو غير صحيح فليس شريحة معينة من ذوي تفكير السطحي هم ما يمثلنا كشعب سعودي قد يكونون من ضمن الشعب لا انكر لكن ليس الجميع<br />اما المواضيع المطروحه فهي ملك لصاحب المقال يكتب مايريد فارضاء الجميع ليس مطلوب لانه مستحيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131541/http://www.20at.com/article2.php?sid=514"

[[comments]]
order = 4
subject = "dabdoob......ماتستغربش"
author = "sweet_princess"
posted = "2006-03-03"
text = "ماتستغربش وماتتخنقش :<br />هو دا المجتمع السعودي اللي بيرفض اي ابداء للراي في الحياه هناك او اسلوب المعيشه وفي نفس الوقت بينتقدونا على اتفه الاشياء.<br />مجتمع بيجمع اغرب مجموعه من الناس انت ممكن تقابلهم (وعلى كل لون يا باتسته).<br />ممكن تلاقي هناك الغني جدا... والفقير جدا في نفس الوقت .<br />ممكن تلاقي هناك الفقير اللي مش لاقي ياكل (وهما قله هناك )والغني (اللي بيصرف بهبل).<br />انا خالي حكالي عنهم وكان بيشتغل هناك في السعوديه خمس سنين قاللي ان الواحد فيهم ممكن يكون غني جدا وتلاقيه قاعد طول النهار في خيمه بيرعى شوية معيز وعنده قصر وعربيه فخمه جداواخر اليوم تيجي العربيه تاخده هو والمعيز ع القصر (والله اتحكالي كده).<br />وطبعا الكلام دا مش عنهم كلهم دي فئه معينه هي اللي كده.<br />واخيرا هما بيعتبروا اي حد غير مسموح ليه انه يتكلم عن حاجتين ( الحياه الفخمه..... واسلوب المعيشه ).<br />اما اي شيئ غير كده مسموح بيه .<br />طبعا هيفضل ايه ؟...ولا حاجه .شوية حاجات تافهه.<br />مقال عن معرض سجاد ...السجاده فيه مش عارفه مرسوم فيها مش عارف كام الف نوع ورد ...هو دا الموضوع اللي يعجب ويشد.<br />طبعا انا ماذكرتش شيئ عن الحج والكعبه لان دي حاجات ماتخصش المجتمع السعودي وحده .....دي تخص المسلمين كلهم على مستوى العالم كله."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131541/http://www.20at.com/article2.php?sid=514"

[[comments]]
order = 5
subject = "جنون قلم"
author = "اخي انا لست مخنوق ولست مستغرب :"
posted = "2006-03-03"
text = "مجتمعي وانا اعيش بين طيته اتنفس من هوائه واشرب من اباره من نجد ...واحة وسط الصحراء<br />ولانني من اهلها استطيع التحدث عنها فكما يقول المثل \"اهل مكه ادرى بشعابها\"<br />اي ان ابن البلد هو اعلم بامجتمعه من غيره<br />ما اعجب من اجله هو ان تصدق كل مايقال وان تتكلم دون ان ترى<br />وما يخاف حقا ان تطلق الاحكام جزفا ، تحارب بسلاح دون حمل رخصة بذلك<br />فماقيل اننا مجتمع فينا الاغني والفقير والميسور نعم اما اننا اما فقراء واما اغنياء فهو مغلوط<br />انا هنا اتحاور معك ... على اساس حوار سليمة دون مساس وقذف باحد<br />اما لغة القذف بما ليس فينا فهذا خروج عن اطر الحوار وابداء الراي فكما تحب لنفسك احبب لغيرك ...<br />من قال اننا نرفض الحوار وابدا الراي قد يرفضه اشخاص لكن هناك اخرون يقبلون به فتعميم الاحكام على اساس خمس او عشره اخرون فهذا ليس بالصواب<br />فكل مجتمع يحيوي جميع الاصناف والاشكال ولولا الاختلاف لتوقفنا عن التطور والنمو<br />شعاري نعم للحوار ولا للاسفاف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131541/http://www.20at.com/article2.php?sid=514"

[[comments]]
order = 6
subject = "السعودية مزرعة يملكها بن سعود"
author = "إن هذه السعودية الموصوفة زورا أنها دولة ، ماهي الا مزرعة يملكها بن سعود(العيلة) يفعل فيها ما يشاء ، يبيع حصادها ، يجيع بهائمها ، يطعم بهائمها .... وهكذا"
posted = "2006-03-03"
text = "ومن كان في كلامي في شك ، فلينظر الى \"سعودي\" من عامة الشعب يتكلم في منبر حر ، هل يخرج من كلامه بشئ؟<br />والله ليعجزن ؛ لأنه ببساطة ما هذا السعودي الا ..... في تلك المزرعة المملوكة لا لسعود(العيلة) ، وكيف .... تتكلم في شأن من شئون صاحب المزرعة؟؟!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131541/http://www.20at.com/article2.php?sid=514"

