subject = "الموضوع يتكلم عن شي وانتو عن شي"
author = "اولاا ماله داعي التجريح بين اخواننا السعوديين والمصريين وبعدين انا سعودية واعتبر مصر بلدي الثاني... واحنا ماننكر دور مصر في الثقافة ولكن هذا ماكان ببلاش اولاا يعني انتو كل شويه تمنون علينا احنا اللي علمناكم طيب ..انتو قدمتو هذه الخدمة عشان سواد عيوننا؟؟ لأ طبعا عشان الفلوس عشان كذا ماله داعي الانسان يحرج نفسه.."
posted = "2006-10-08"
text = "اما بالنسبه لوضع السعودية في السابق من انهم كانو اميين.. فهذا شي طبيعي لأنهم كانو بدو ويعيشون في الصحراء ويرعون الاغنام واحنا نعتز بماضينا مثل مانعتز بحاضرنا والرسول صلي الله عليه وسلم كان امي وكان يرعى الاغنام وهذا مو عيب لأن اصل العرب كذا ..<br />اما بالنسبه للوضع الحالي فنحن نلاحظ ان الاية انقلبت .. شوفو عدد المتعلمين في السعودية وشوفو بمصر.. احنا بناتنا وشبابنا معظهم جامعيين وقلت الاميه بشكل كبيررر جداا وهذا بفضل من الله سبحانه وتعالى ثم بفضل حكامنا ال سعود الله يخليهم لنا ذخر يارب ,, هم اللي يأتون بالناس من الصحراء لكي يتمدنون ويتعلمون وهذا الشي من ايام الملك عبدالعزيز رحمة الله عليه حيث كان يدفع للبدوالاموال الكثيره ويعطيهم سكن وكل شي ببلاش فقط لكي يتمدن المجتمع السعودي.. وهذا اكبر دليل على ان احنا عايشين بنعمة ولله الحمد ,, لكن بمصر الى الان كثير ناس ماتعرف تقرا وتكتب وانا شفت هالشي بنفسي...<br />وبعدين ليه تقولون ان المصريين حرامية؟؟<br />صحيح اني كل مرة اسافر فيها مصر تنسرق مني اشياء كثيررررة ,لكن ماانكر حبي لهذا البلد العظيم<br />وكل مكان له سلبياته وايجابياته<br />وعلى فكره السعودي اللي مش عاجبته مصر لايزورها بالصيف ويستمتع باماكنها الاكثر من رائعه ويضيق على الناس بالزحمة<br />والمصري اللي مش عاجبته السعودية لا يجي يشتغل ويكون ثروة فيها ويضيق على اهل البلد برزقهم<br />وبليز محد يشتم احد بكلمات نابية وكل انسان يقدر يوصل وجهة نظره مهما كانت لكن باسلوب محترم.."
