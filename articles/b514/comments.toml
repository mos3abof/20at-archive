text = "اولا انا مش شايفه لازمه للموضوع دا و عايزه اعرف ايه اللى طلعت بيه منه<br />بالنسبه لجنون قلم اقدم اعتذارا لان انت عندك حق ان محدش يهين بلدك<br />و sweet princess الحوار ميبقاش كدا لانلاحظى محدش يقبل ان حد يهين مجتمعه و لا انتى مش فاكره كلنا عملنا ايه ف المغربى اللى هان مصر<br />صدقينى كدا غلط"
