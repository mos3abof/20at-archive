[[comments]]
order = 8
subject = "لا تضغطوا على الجرح بكل هذه القوه"
author = "أكرم"
posted = "2006-03-05"
text = "يا عشرينات حلوة منكم موضوع التعليق على التعليقات دي بس برضوا انتوا مزودنها حبتين مع السعوديين انتوا و دبدوب اللي كل مايلاقي الفرصه للهجوم يديها<br />يا جماعه مش كده عايزين نبقا موضوعيين اكتر منه حماس و بلاش موضوع الضغط على الجرح بقوة ده عشان مينفجرش في وشكوا<br />اما عن صديقتنا المختفية في ظروف غامضة نيفين باشا حمد لله ع السلامة و بعدين انا لفيت الموقع اني الاقيلك تعليقات زي ما عودتينا ابدا الا تعليق تهدية النفوس ده<br />على العموم لعل المانع خير و ربنا يعينك و تكملي مذكرات هبهوب اللي برضه فص ملح و داب ( الظاهر ان انا الوحيد اللي فاضي هنا في الموقع )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131541/http://www.20at.com/article2.php?sid=514"

