[[comments]]
order = 4
subject = "حلوة نقد بناء دي"
author = "مش فاكر"
posted = "2006-05-04"
text = "إيه حكاية النقد البناء دي .. كل ما حد يتكلم كلمة مش على مزاجه يقول لك عاوزين نقد بناء ...<br />وسط الأوضاع المتدهورة بل والمنهارة على جميع الأصعدة وفي جميع المجالات بلا استثناء داخل بلدنا المحروسة بفضل قيادتها وإدارتها وحكوماتها التي ليست على مستوي المسئولية ... وسط كل ذلك أي نقد بناء تريد يارجل؟؟<br />لما نشوف الناس اللي فوق عمالين يلعبوا بينا وببلدنا وعمالين يهدموا كل شيئ جميل أو كان جميل فيها ... دون أي احترام أو خوف أو حتى تردد من أي حد أو أي حاجة .. حزب فاسد حتى النخاع وحياة حزبية وسياسية متعفنة ... حالة اقتصادية تحت الصفر بمراحل وارجع الى التقارير الدولية المشينة والمهينة (والله ياشيخ أنا بابقى مكسوف وانا بقراها) ... والفقر والجوع والمرض أدوا بالتالي إلى فساد أخلاقيات الشعب في الأغلب الأعم وأصبحنا نعيش حالة انحطاط أخلاقي واجتماعي ليس لها مثيل ... سياسة خارجية تكسف أدت إلى تراجع وزن بلدنا وثقلها في المجتمع الدولي لدرجة والله انها ما تسوى دلوقتي جناح بعوضة في موازين القوى سواء الدولية أو حتى في الشرق الأوسط ... جهاز حكومي فاسد فاسد من أصغر موظف إلى أكبر وزير .. جهاز حكم محلي مشوه وبشع و ريحته وحشه جدا ... مستشفيات حدث ولا حرج ... تعليم ماشاء الله جامعة القاهرة اللي كانت أقدم جامعة في أفريقيا حصلت الشهر الماضي حسب ترتيب اليونسكو على المركز السادس والعشرين في قارة أفريقيا (تخيل في أفريقيا) ... جهاز شرطة ومباحث وأمن دولة يحارب الشعب وكأنه في حرب مقدسة ضده ...<br />الخلاصة ان حجم مصر بلدنا أكبر بكتييير جدا جدا من اللي بيحكموها ... تخيل فـأر قاعد على كرسي العرش بتاع الأسد !!!<br />و باختصار ... في بلدنا دلوقتى .. لو انت مسنود ح تعيش مية مية ... ولو مش مسنود ومعاك فلوس ح تعيش 80% .. ولو مش مس<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "أعداء النجاح"
author = "عابر القارات"
posted = "2006-05-04"
text = "يا عم إنتا يا اللى مش فاكر كفاياك تشاؤم (و لو إن التشاؤم دلوقتى حتى بقى من الترف و الرفاهية) أيوه كفاية بص للنصف المليان من الكوب يعنى شوف إن مصر كسبت كاس أفريقيا و إن فوزية كسبت لقب ملكة جمال مصر (أقصد جمال باشا مصر ما تودوناش فى داهيه) و إذكر كمان .... إذكر كمان .... إذكر كمان ..... يا نهار إسود و الله ما لاقى حاجه تانبه حلوة ممكن تتذكر .... أكيد الحاجات الحلوة موجودة بس أنا اللى فقدت الذاكرة"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "يارب"
author = "sara"
posted = "2006-05-04"
text = "يا اخ مصرى عايزنا نتكلم عن مبارك بصورة كويسة هو مبارك عمل ايه للبلد ما هو ناهبها ويقولك ما فيش فلوس وبعدين انزل بجد الشارع المصرى انزل الحتت الشعبية وشوف الفقر والشباب وهما قاعدين على القهوة والغريبة انى الشاب يكون متخرج من الكلية بتفوق ومش لا قى شغل فى مثل شوفته بيقول\" بعد الفرحة بالبكا لريوس والزغاريط جت الوظيفة قاعدة على القهوة\""
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "الشعب أولى"
author = "مصرى"
posted = "2006-05-05"
text = "يا حاكم بلا إنتخاب ويا محتل للسلطة ويا من لا تمتلك الشرعية لوجودك أقول لك لقد تيقنا جميعاً أنك وصلت على أبواب الثمانين ولازلت عندك المقدرة للتحرك بدون كرسى كهربائى أو عصا كما يتحرك من فى سنك وأنك لا زلت تعرف أسمك كما لا يعرف كثير ممن فى سنك أسمائهم ولكنك للأسف الشديد لا تعرف أنك تحكم مصريين أحرار لن يرضوا بالذل والطغيان ويقولون لك أقرأ الدستور لتعرف كيف يجيء الحاكم للحكم برضا الشعب والإنتخاب وأنت لم تنتخب من قبل الشعب فى يوم ما إذا أنت غير شرعى للحكم فى مصر وأنصحك أن توفر المبالغ الطائلة التى تدفعها على مكياجك وصباغتك لشعرك وشد وجهك الكرية بالنسبة للمصريين كلهم وأقول لك عيش باقى عمرك بما نهبت من مال ولكن بعيداً عن مصر التى حتى ترابها سيلفظ جثمانك بعد مماتك ولن نسمح لك بتوريث الحكم لإبنك المفقد للشرعية فى وجوده بسبب إفتقادك أنت أصلاً للشرعية ونقول لك كما قال الزعيم أحمد عرابى لقد خلقنا الله أحراراً ولن نورث بعد اليوم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

