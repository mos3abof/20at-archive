[[comments]]
order = 18
subject = "سبب انفلونزا الطيور"
author = "المغنواتي"
posted = "2006-05-08"
text = "توضيح .. علمت من جار لي فرخجي مثقف أن أعضاء الحزب لوطني الديقراطي هم سبب تفشي مرض انفلونزا الطيور بالبلد بعد أن ظهرت أعراض المرض عليهم بوضوح في الانتخابات البرلمانية الماضية مما أدى الى نفوق الكثير منهم واضطرار النظام (نظام المزرعة) الى الاستعاضة عنهم بفراخ من مزارع أهلية تدعى مزارع المستقلين وهذا سبب من الاسباب التي دفعت تجارالدواجن الى التظاهر أمام مجلسي الشعب و الشورى مطالبين بتعويضات عن نفوق دواجنهم بسبب دواجن الوطني المريضة ."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

