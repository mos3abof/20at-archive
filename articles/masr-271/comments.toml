author = "خالد المصرى"
posted = "2006-05-08"
text = "بسم الله الرحمن الرحيم والعزه لله ولرسوله والمؤمنون (اما من لم يحكم بما انزل الله فاولئك هم الكافرون ) سلملى على الشريعه الى بتطبق سلملى على السرقه سلملى على الزنا سلملى على الدعاره المرخصه سلملى على الربا البونك (اتفو على شيخ الازهر الكلب ) وسلملى على مصانع الخمر ومحلات الخمر (اتفو على زينب رضوان الحقيره وكيله مجلس الشعب ) وسلملى على مراكز لعب القامر (اتفو على كل من يشارك فى النظام الحاكم ) يا رب ارحمنا من حسنى مبارك الكلب وابنه ومراته نفسى افهم مراته رئيسه وعضو ووكيله لاكتر من 250 جمعيه يعنى عاوزه تقريبا 125 ساعه فى اليوم الواحد علشان تعرف تشرف عليهم والنبى قولى احنا ازاى نقدر نكافا المراءه الفولاذيه دى بفكر ادبحلها كام عيل من عيالى يمكن تتبسط ولا حاجه انا سمعت انها بتاكل عيال على الفطار يمكن مش بعيد ما جوزها بياكل شعب بحاله هي مش حتاكل عيال المهم بالنسبه لحبيب الشعب جيمى الواطى سورى الباشا الى مكنش لاقى يجيب شقه يسكن فيها علشان كده لسه متجوز من كام يوم على واحده اد عياله ربنا ما يكتبله يخلف علشان ميجيش شادى ابنه يورثنا هوه كمان فى يوم من الايام سلملى على والدى المعتقل من 18 سنه على ذمه قضيه العاثدون من افغانستان ابويه الى عمره ماطلع بره اسكندريه بقا عاثدون من افغانستان ابويه الى معندوش اصلا جواز سفر بقا افغانستانى بقا عاوز يقلب نظام الحكم الى مكنش بينام الا اربع ساعات فى اليوم الواحد اه العشرين الساعه التانين مكنش بيقود التنظيم ولا حاجه اوعى تفتكرو حاجه يا سوسه منك له لا ده اصل بعيد عنكم كان بيشتغل بيشغل من سبعه الصبح لغايه تلات الضهر فى فرن قدام النار وبعد كده يطلع على محل عطاره يشيل ويحط ويتبهدل علشان يلحق يروح المصنع بتاعه ويرجع على البيت علشان يلحق ينام اربع ساعات على<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 20
subject = "مصر يا اما يا سفينه"
author = "طبعا هخاف اقول اسمى زى باقى شعب مصر"
posted = "2006-05-08"
text = "هو ليه دايما برمى المسئوليه على الغير<br />دايما غيرنا بيغلط غيرنا بيعمل<br />ليه دايما بنخاف نقول احنا غلط<br />دايما بنخاف بنخاف<br />انا شايف ان احنا اللى غلط<br />احنا اللى مش عاوزين حققنا<br />كله بيخاف يطالب بحقه<br />يقول و انا مالى يا عم<br />غيرى يقول هو انا يعنى اللى هعدل الكون<br />طول مااحنا كده يبقى كل سنه وكل الناس بخير وصحه وسلامه<br />و عقبال ميت مليون سنه لميت مليون شخص يستغلط خوفنا<br />وعمار يا مصر<br />سلام ..."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 21
subject = "الصبر يا ناس"
author = "توتى"
posted = "2006-05-08"
text = "الصبر يا ناس ... إستحملتم 25 سنة و اكيد اللى فاضل اقل من اللى راح و ربنا يستر على مصر بعد ان يخلو منصب الرئيس من شاغله الان عندما يأتى امر الله<br />فالطامعين كثيرين<br />و اللهم انشر رحمتك على العباد و عجل بالفرج يا ارحم الراحمين يا الله ."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 22
subject = "ماله الريس يا ولاد الحسوده"
author = "خالد حسنى مبارك"
posted = "2006-05-08"
text = "ماله الريس يا شويه حقده يا حسوديين كل ده علشان مش عارفين تبقو رؤساء يا شويه حقوديين يلا مش مهم فيها ايه يعنى لو سرقكم 25 سنه ما هو بيطفحكم عيش حاف مش عاجبكم كمان ده انتو مفترييت عاوزين تاكلو ايه انشاء الله جاتوه يا زباله فيها ايه لو غرق 1000 واحد فيكم ما انتا سبعين مليون يا ولاد الكتيره حتخسو اد ايه لو مات فيكم الف دى البلد حتفضى يا هبل الريس عارف مصلحتكم اكتر منكو والبقاء لله"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
