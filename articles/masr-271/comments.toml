[[comments]]
order = 16
subject = "والطياره الي وقعت في المحيط"
author = "ابو كرتونة"
posted = "2006-05-07"
text = "نسيتو الطيارة الي وقعت في المحيط وكان قائدها وهو ربان بطوطي ولي المخابرات الامريكية الي اسقطتها في المحيط وكان علي متنها خبراء في السلاح الجوي المصري بعد اكتشافهم لسر اسقاط الطائرة f16 فاسقطوها بمن عليها في اعماق المحيط الاطلنطي<br />ومع ان الرئيس مبارك كان علي علم بهذا الحادث جيدا<br />ولانه عميل امـــــريكا<br />وكمان بيخاف من اسرئيل<br />ولانه بيحج كل عام الي قبلته وهو البيت الابيض<br />وكمان مرتشي وحرامي وسارق بلده مصر<br />فيجب عليه الخنوع لاسياده(امريكا) علشان لا تقطع عنه المعونة السنوية الي بياخذها في كرشة وكرش جمال وسوزان"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

