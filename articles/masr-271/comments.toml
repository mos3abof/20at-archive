[[comments]]
order = 12
subject = "يارب"
author = "مصرية"
posted = "2006-05-06"
text = "يارب اجعلها عليك لوحدك سنة جميلة لون اعمالك فى مصر طوال ال 25 سنه لا فيه فساد ولا سلب ونهب وتهريب اموال واشخاص ولا فساد ولابطاله ولاتدهور اقتصادى وصناعى وزراعى وتعليمى والحرية ماشاء الله بترفرف فى سماء مصر وكل واحد عاوز يقول حاجه بيقولها اهو بيهبهب زى كلاب الشوارع والديمقراطية الله عليها انتم نموذج لحرفنة التزوير فى الانتخابات وعدد اصحاب الملايين ارتفع ماشاء الله وارتفع اكثر واكثر عدد اصحاب الملاليم والجنيه المصرى فى اوج عزه فهو يحتل مكانه عاليه فى الحضيض والتارخ سيفتح ابوابه لكم لتحتلوا اعلى مكانه تليق بكم فى مزبلته ان شاء الله يااااااااارب اجعلها آخر الاحزان"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

