subject = "رجل الانجازات"
author = "محمد علي ابراهيم"
posted = "2006-12-08"
text = "كل سنه وأنت طيب<br />25 عام من الفساد والرشوه والمحسوبية الأنهيار التام في كل مرافق الدولة.<br />ان مصر في عهدكم الميمون اصبحت وسيه ينتفع من ورائها المداهنون والأفاقون والمحتالون من كبار رجالات الدولة.<br />كل عام ومزيد من السجون والقمع وتدهور في مستوي معيشة الفرد.<br />كل عام ومزيد من الشعارلت الرنانة الجوفاء من تحس الدخل ورفع الرواتب واصلاح جهاز اداري بيروقراطي متعفن.مع أطيب التمنيات لنجلك الميمون بتوالي التكية لمتابعة المسيرة."
archived = "2006-12-16"
