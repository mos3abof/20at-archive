posted = "2006-05-19"
text = "الرئيس مبارك رئيس واعى وجيد ومن أحسن الرؤساء فى الوطن العربى قد يسبقه القذافى ، لكنه وبكل تأكيد قائد ماهر فى زمن كثرت فيه الثعالب ، هل تعلمون أن فى عهده 300 مليار دولار تم تصديرها للبنوك السويسرية ، الم يشجع الاستثمار هو ابنائه ، من أجل مساعدة هذا الشعب المنهك والمجلود ، عارفين ساعات بحس ان الرئيس دا لو مكنش علينا ، وكان علينا رئيس تانى لا قدر الله ممكن يدخلنا فى حرب مع ليبيا أو السودان<br />ربنا معاك يا ريس"
archived = "2006-09-05"
