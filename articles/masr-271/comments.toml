text = "هسأل كل واحد سؤال واحد ويجاوب عليه بكل صدق وأمانة ( لو صحيت الصبح لقيتهم عينوك رئيسا للجمهورية هتعمل ايه مع 75 مليون مواطن يا حلو ومع العالم الخارجى ؟)"
archived = "2006-09-05"
