[[comments]]
order = 9
subject = "حبيب الشعب"
author = "ammaaly"
posted = "2006-05-05"
text = "صورة الحاكم في كل اتجاه<br />أينما سرنا نراه!<br />في المقاهي<br />في الملاهي<br />في الوزارات<br />وفي الحارات<br />والبارات<br />والاسواق<br />والتلفاز<br />والمسرح<br />وفي ظاهر جدران المصحات<br />وفي داخل دورات المياه<br />اينما سرنا نراه!<br />صورة الحاكم في كل اتجاه<br />باسم<br />في بلد يبكي من القهر بكاه<br />مشرق<br />في بلد تلهو الليالي في ضحاه<br />ناعم<br />في بلد حتى بلاياه<br />بأنواع البلابا مبتلاه<br />صادح<br />في بلد معتقل الصوت<br />ومنزوع الشفاه<br />سالم<br />في بلد يعدم فيه الناس<br />بالاف يومياً<br />بدعوى الاشتباه<br />صورة الحاكم في كل اتجاه<br />نعمة منه علينا<br />اذ نرى حين نراه<br />انه لما يزل حيا<br />... وما زلنا على قيد الحياه !"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "رب ساعدهم علينا"
author = "ammaaly"
posted = "2006-05-05"
text = "أدع للحكام<br />بالنصر علينا<br />يا مواطن<br />وأشكر الله الذي ألهمهم موهبة القمع<br />وإبداع الكمائن<br />قل : إلهي أعطهم مليون عينٍ<br />اعطهم ألف ذراع<br />أعطهم موهبة أكبر<br />في ملء الزنازين وتفريغ الخزائن!<br />رب ساعدهم علينا<br />فهم أثنان وعشرون شريفاً مخلصاً<br />وإنما ياإلهي<br />مئتا مليون خائن!<br />احمد مطر"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

