text = "اللهم خذ حسنى مبارك وعائلته والفسدة من حوله أخذ عزيز مقتدر يارحمن يارحيم يارب العالمين اللهم عليك بمبارك أنه طغى اللهم لا ترحمه اللهم أرنا فيه يوماً اللهم ذل نفسه وأزل عرشه أطيح بملكه يارحمن يارحيم اللهم طهر مصر من فساده اللهم رد لمصر ما نهب من ثرواتها اللهم أحفظ مصر من مبارك وفساده يارحمن يارحيم يارب العالمين"
