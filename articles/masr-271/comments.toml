[[comments]]
order = 24
subject = "أقولكوا هتعملوا أيه"
author = "مشمش"
posted = "2006-05-08"
text = "أول حاجه لآن الأنسان طفس هيطلب أكل مشافوش فى بيتهم وهيلبس لبس من بره وعربيات على فيلا على أى لخبطة وفى الآخر هينسى نفسه وهينسى يا عينى الشعب الغلبان ويقول ربنا يكون فى عون الواحد مشغول لشوشته . عارفين أزاى نكون قد المسئوليه لما ربنا يرضا عننا ونطيع ربنا الأول فى أبسط أمور حياتنا بعدها نقدر نكون قدوة وقيادة لأى شعب لو ربنا رضى عننا هيسهلنا حاجات كتير مش نبقى أسما مسلمين كده وبس"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 25
subject = "سنة سودة عليه طبعاً"
author = "عادل"
posted = "2006-05-09"
text = "طبعا سنة سودة أسود من الصبغة إللى على رأسة وطبعاً أنا مش هاقوله ياريس لأنه مش رئيس لمصر ده محتل لمصر ومجاش بإى أنتخابات فى يوم من الأيام لكن جه بالتزوير فهو مغتصب للحكم وليس حاكم ولا زال يزور فى شكله بالزمة ياناس ده شكل واحد قرب على الثمانين ده عايز يعيش سنيين أطول بكتير طمعاً فى باقى ثروة مصر المنهوبة وعلشان يفضل يبقى محتل كده لمصر لأنه مش هايقدر يعيش زى الشعب إللى هو عارف هو عامل فيه أيه ونهبة أزاى لكن العيب مش عليه لأن المال السايب يعلم السرقة وهو حرامى وجه لاقى محدش بيقوله أنت بتعمل أيه ولا قاعد على الكرسى ده ليه فساق الهبل وأستمر فى إللى هو بيعمله لكن أحنا عايزين قيادة تخاف ربنا وياريت تكون من القضاء ونلتف كلنا حولها علشان نرجع مصر للمصريين ونطرد المحتل زى زعماء مصر الشرفاء لما كانوا بيعملوا مثل مصطفى كامل ومحمد فريد واحمد عرابى إللى قال لقد خلقنا الله أحراراً ولن نورث بعد اليوم ولازم كمان العالم كله يعرف أنه رئيس غير شرعى لمصر علشان محدش يخليه يتكلم بإسم مصر فى أى مكان وإن غداً لناظره قريب"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 26
subject = "أستغفر الله العظيم يارب"
author = "dodo"
posted = "2006-05-09"
text = "استغفر الله العظيم يا رب عليكوا يا شباب مصر بجد حزينه جدا عليكوا يا جماعة الحرية ملهاش دعوة بقله الادب انا كدة اسلوبنا خاطى البعض منا بتجة لاستخدام الفاظ مهينة لا تجوز الا فى الشوارع ، لابد لنا ان نتعلم أدب الحوار الموضوعى الهادف وبعدين يا شباب اية الاستفادة اللى بتعود علينا من الشتائم والسب والقذف لية كل واحد مننا ميعبرش عن رأيه بصراحة ووضوح بدون الغلط كمان مش فاهمة لية المسئولين عن الموقع يسمحوا بدة ، أه احنا شباب ولكننا غير متعلمين جهلة فى استخدام أسلوب محترم للنقد ، وطبعا أقصد النقد الهادف ، مهما كان الظلم علينا وأشكركم على مساحات الحرية بموقعكم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 27
subject = "إيه الفرق"
author = "الضوء الشارد"
posted = "2006-05-12"
text = "يا دودو معلش بقى أصلى أنا بتفرس من الأراء إيلى إنت بتكتبيها علشان أنت فى وادى وإحنا فى وادى وحسنى مبارك فى وادى ومش عارف أوصلك إزاى رأيى لكن على العموم أنا هاضربلك مثل يمكن تقدرى تفهمى منه أنا عايز أقول إيه دلوقتى لو جاء لك ضيف وإستأذن فى الدخول لزيارتك فواجب عليكى إنك ترحبى بيه علشان إكرام الضيف واجب ولكن لو جائك حرامى وإحتل شقتك ونهب كل حاجة فيها وجوع أولادك وحرمك من حقك فى الحياة وهى الأمن والأمان فماذا ستفعلين فيه هل سترحبين به أم ستحاولين إخراجة وإسترجاع حقوقك المنهوبة بكل الطرق المباحة والغير مباحة فهذا ما فعله حسنى مبارك أتى للحكم بدون شرعية كما ينص الدستور فهو لم يأتى بترشيح الشعب وموافقته عليه ولكنه أتى مغتصب للحكم ثم زور الإنتخابات لمدة 25 سنة لضمان بقاءه فى الحكم ثم أستولى على ثروات مصر كلها وحولها لحساباته فى الخارج وإحتمى بفسدة من حوله لكى يضمن قهر الشعب وإزلاله وأنتشرت البطالة وبيعت الشركات إللى هى ملك للشعب وليست من أملاكه الخاصة وشردت العمالة التى بها وهربت أموال مصر للخارج من حثالة المجتمع إللى حواليه فى الحالة دى هل مطلوب من الشعب إنه يركع تحت رجليه ويترجاه أنه يعطيه فرصة علشان شباب مصر يلاقوا عمل ولا يلاقوا دخل أصلا ولا يرجعوا حقوق مصر من نهب ولا لازم الشباب يدافع عن بلده ويطرد هذا الفاسد ومن حوله لتعود مصر للمصريين وكفاية بقى لغاية كده وربنا قادر على إزاحة هذه الغمة عن مصر وتعود أمنه إن شاء العلى القدير"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 28
subject = "ملك الكوميديا"
author = "مصرية"
posted = "2006-05-14"
text = "مش معقول يانوبى خفة الدم دى بالصدفة ده تانى تخليق اقراه لك وفعلا ضحكت من قلبى بعد الغم والهم اللى احنا فيه من عيشتنما السوده ربنا يسود آخرتهم ويجعلها قريبه ان شاء الله وكيد بعد ربنا ما يفرجها على مصر حتكون انت ملك الكوميديا الساخرة القادم ارجوا ان نقرأ لك المزيد لتخفف عنا المصئب المباركه التى نعيش فيها ونعرف ان النكته المصرية لسه بخير"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

