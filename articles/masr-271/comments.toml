[[comments]]
order = 0
subject = "25 سنة"
author = "بن الكفر"
posted = "2006-05-03"
text = "25 سنة وبتخرف امال اللي بيحكم بقالة 25 سنة يعمل اية وعاش 53 سنة فوق ال 25 سنة بتوعك فهمني يعمل اية وتقولولي سيادتة بيخرف طب مهو انتم اللي شعب تعبان تعبتوة وهديتة حيلة ومع ذلك كنواضع ولسة بيحكم دة انتم شعب غريب اتكموا باي وانتم ساكتين دة انتم شعب يخنق يا اخي .......؟؟<br />وبعدين يا اخي 25 سنة وذاكرتك نار بس نسيت شوية حاجات صغيرة<br />الأعتراف بالبهائية ديانة جديدة ورابعة في مصر<br />نجاح مصطفى الفقي فردة في الانتخابات<br />خروج مصر من تصفيات كاس العالم<br />اول قمر تجسس اسرائيلي يتجسس على المنشات العربية الاستراتيجية...<br />تعديل المادة 76 من الدستور الله يولع في اللي عدلها<br />غرق العبارة السلام 98<br />براءة المسئولين المتهمين في حادث قطار الصعيد<br />اقلة ورجوع مرتضى منصور رئيسا لنادي الزمالك<br />وكفاية علشان مش فاكر دماغي صدعت من كتر التفكير وكلها حاجات عايزة تتنسى يلا سلام"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072412/http://masr.20at.com:80/article.php?sid=271&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

