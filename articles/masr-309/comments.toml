subject = "استر ياللى بتستر"
author = "عكروت"
posted = "2006-06-13"
text = "انا مندهش لان الفكر المنحرف مسيطر على كل اللى بيدلوا بتعليقهم لان مش ممكن حد ينسى جرايم القتل والارهاب اللى قامت بها الاخوان المسلمين فلوا كانوافعلا زي ما انتوا مبتقولوا ابرياء ناس كتير ماتوا بسببهم ليه هماالناس دول كتانوافى النطام ولا ايه. جماعة الاخوان دى جماعة ارهابية وغرضها السيطرة على حكم مصر لدعم الارهاب فى العالم وملهاش دعوة بالدين لو كان ليها دعوا كان بان عليها واستر ياللى بتستر"
