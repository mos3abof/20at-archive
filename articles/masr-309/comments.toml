text = "يعني احنا خايفين لو الاخوان مسكوا الحكم وبقوا دولة ... لية يعني يعني هم مسكوا فبل كدة وضربوا وسحلوا واعتقلوا ولا يعني بنحكم بحكم مسبق للي ممكن يحصل حاجة غريبة والله ، يعني معني كدة ان حماس بما انها امتداد لجماعة الاخوان في فلسطين انها حاتعمل كل اللي قالت علية استاذة سحر؟ صح ولا اية؟؟ ياريت قبل ما نكتب بعد كدة نحكم العقل اكتر من كدة"
