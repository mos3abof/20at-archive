[[comments]]
order = 15
subject = "دعوة لقبول اختلاف وجهة النظر"
author = "ميدو مشاكل"
posted = "2006-05-17"
text = "بداية يااخوانى ارجو ان نستطيع ان نتقبل اختلاف وجهات النظر بدون اى زعل وهى دى الحرية التى هى جوهر الدين فكل واحد حر فى رأيه ويقول كيفما شاء بدون اى وصاية<br />واحب ان الخص وجهة نظرى فى نقاط محددة<br />اولا.شكرا للاستاذة الكاتبة على رأيها فينا كجماعه حتى لو اختلفت مع ارائنا<br />ثانيا.اذكرها اننا ام نتولى السلطه من قبل ولم نمارس الظلم والفسادوكل ما نطلبه ان نأخذ الفرصة واذافشلناليأتى الشعب بغيرنا كما اتى بنابالديموقراطية<br />ثالثا.بالنسبةلبعض الافكار الغامضة فاوافقك الرأى ان بعض الافكار كانت فى حاجة الى التوضيح والتعديل واعتقد ان هناك مراجعة تحدث من الجماعة باستمرار<br />رابعا.لا ندعى اننا المتحث الرسمى باسم الدين لكننا اتخذنارؤيتنا الخاصة للمبادئ الاسلامية كمرجعية كما لكل حزب مرجعيته لكن ممكن ان يختلف معنا البعض حول هذه الرؤية<br />خامسا.هناك جيل جديد من الجماعة بافكار اكثر حداثة مثل حزب الوسط فهذا يدل ان الجماعة تجدد نفسها وليست جامدة فكريا<br />سادسا.لسنا انتهازيين ولكننا لسنا ملائكة فأكيد هناك اخطاء نعترف بها ونعمل على تصحيحها"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113458/http://masr.20at.com:80/article.php?sid=309&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 16
subject = "بالعقل"
author = "دماغ"
posted = "2006-05-17"
text = "انا شايف يا جماعة اللي انتو مبالغين في الموضوع حبتين<br />وانا شايف ان كل واحد متحيز لرأيه بقوة<br />بس لو احنا بصينا للموضوع من زاوية مختلفة هنلاقي فعلا ان الاخوان هم القوى السياسية المعارضة الأولي في مصر وده بشهادة الجميع وبيتهيألي انهم علشان يوصلوا لكده بذلوا كتير جدا جدا ومش معقولة يجي واحد وفي فمه معلقة دهب ويجى بعبقريته ورأيه المحنك ويتفلسف وينكر ده كله .<br />بالعكس انا شايف ان الاخوان هم أصلح ناس للقيادة في الوقت الحالي رغم ان هم نفسهم يرفضوا ده فحتى شعارهم في الانتخابات هو ( المشاركة لا المغالبة ) وهم موقنين تماما انهم لن يعتلوا العرش الا برأي الشعب وانا مش شايف ان الاسلام بيضر في شئ هتئولوللي الاسلام حاجة والاخوان حاجة تانية ، أه ومين اللي قال كده ؟؟<br />طيب لو بصنا كمان هنلاقي ان هم الجماعة المعتدلة الوحيدة الموجودة ع الساحة وكمان الناس دول ضحوا كتير جدا علشان الشعب ده ولا يصح أن نعمم في الحكم ولا أن نحكم علي نوايا الناس فالله هو الوحيد العالم بنوايا البشر وهو كمان اللي عارف بنية كاتبة هذا المقال<br />والا ايه ؟؟"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113458/http://masr.20at.com:80/article.php?sid=309&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

