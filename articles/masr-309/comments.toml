[[comments]]
order = 1
subject = "هل انت شوفت"
author = "محمد جبريل"
posted = "2006-05-13"
text = "أخى ياكاتب هذا المقال أرجو منك أن تسمعنى<br />بالله عليك هل الاسلام دين ديكتاتورى<br />هل الإسلام دين يطبق الحدود فقط<br />هل الإسلام دين ظلم وفساد<br />أعتقد أنك ستسارع بالإجابة وتقول لا<br />بل دين الشورى والاصلاح<br />أخى ان جماعة الإخوان المسلمين منذنشأتها أخذت شعارا لها كلنا نعلمه الله غايتنا والرسول قدوتنا والقرأن دستورنا والجهاد سبيلنا والموت فى سبيل الله أسمى أمانينا<br />أخى اعلم بل ثق تماما ان الاخوان لايعملون الا لله ولا يعملون لمنصب زائل أو كرسىً فان لوارادوا المناصب فما أسهلها ولكنها يوم القيامة حمل ثقيل وسؤالها كبير أمام الله<br />عايز اقولك ان الاسلام قبل ان يطبق يجب ان يأخذ كل مواطن حقه وتطبق الحريات فىالبلد ثم بعد ذلك يطبق الإسلام<br />اطمئن ياأخى وأرجو أن تعمل على عودة الحكم بالإسلام مرة أخرى<br />وأرجو الله أن يمن علينا بعودة الحرية لنا فى بلدنا مصر وأن يصلح حال هذه الأمة"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113458/http://masr.20at.com:80/article.php?sid=309&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "كلمتين وبس..بطلوا تهليل !!"
author = "عليوه"
posted = "2006-05-13"
text = "بالنسبة للتعليقات الى بتدافع عن الاخوان اظن والله اعلم ان ليها تأثير سلبى على صورة الاخوان من حيث ان هناك فرق بين الاسلام والاخوان يعنى الاتنين حاجتين منفصلتين فمحدش من الاخوان السذج يطلع ويقول \"بالله عليك هل الاسلام دين ديكتاتورى<br />هل الإسلام دين يطبق الحدود فقط<br />هل الإسلام دين ظلم وفساد<br />أعتقد أنك ستسارع بالإجابة وتقول لا<br />بل دين الشورى والاصلاح \" لأن ده كلام ساذج وبيشوه صورة الاخوان وبيخوف الناس منهم ...<br />النقطة التانية ان كتير من الاخوان فى عواطفهم تجاه الجماعة بيفكرونى بالمراهقين بتوع ثانوى بمعنى ان الموضوع عندهم مجرد عاطفة بتحركهم فى فلك الجماعة وخلاص من غير تشغيل دماغ أو نقد للذات وبيبصو لبعضهم على انهم ملائكة لا يخطئون فى حين ان الاخوان زيهم زى اى تجمع بشرى لازم يكون جواه اخطاء وتجاوزات واظن ان اغلبية الاخوان نظرتهم للجماعة زى الواد بتاع ثانوى الى بيحب بنت الجيران يعنى عاطفة جوفاء وفارغة من اى مضمون...لان الاخوان كبشر لازم يخطأوا وكتير قوى من الموضوعات والقضايا اثيرت داخل الاخوان خلال العشر سنين الى فاتو زى مثلاً قضايا نصب اخوان على اخوان وتبديد اموال وفساد ادارى رهيب جوه الجماعة وسيطرة ضيقى الافق والمهليلاتية وحملة المباخر على دوائر صنع القرار فى الجماعة يعنى كل ما مسحت جوخ اكتر توصل اكتر ...<br />وحاجات كتير تخنق ... البلد مغلفة بطبقة من الفساد وغرقانة فى بحر من الفساد وبطبع وصل الفساد ده للاخوان ...وربنا يستر على البلد !!<br />mohamed_elhamed2000@yahoo.com"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113458/http://masr.20at.com:80/article.php?sid=309&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "الطريق التالت"
author = "ياء"
posted = "2006-05-13"
text = "ليس كل الناس تخيل ان اسرائل دوله مزعومه واكتفا -بعضهم قال انها دوله محتله وقاتلها حتى اخرجها من غزه ( حماس - الجهاد - كتائب شهداء الاقصى - وغيرهم ) حكامنا هم فقط من تخيلو انها دوله مزعومه ومع ذلك تعاملوا معها<br />اما منطق الجماعه المنحله فيستخدمها المعارضون للجماعه والحكومه المصونه<br />الآن الإخوان من أمامكم والحزب الوطني من خلفكم، وحتي الاختيار ليس من حقكم<br />لا ارى ان ذنب الاخوان انهم اقوياء ومنظمون ومتحدون بل هذا ذنب الاخرون وليس ذنبهم ولو خيرت بين ظالمين هذا لو تخيلنا ان الاخوان ظالمين لخترت الاخوان من باب التغير على الاقل<br />موقفهم يوم مجلس الشعب كان مزايدة على القوى الوطنيه<br />هاهاهاهاهاهاهاهاهاه<br />القوى الوطنيه اى قوى وطنيه قلى معرفتش تدخل المجلس ولا قلى دخلات اليوم ده مكنش في حدغير الاخوان وبعض المستقلين<br />والعضوين بتوع محل التجمع اسف حزب التجمع مرحوش كان عنهم مشاوير اهم<br />انا عن نفسى اتوقع ان رده ابو الفتوح ستكون ارحم من قانون العادلى ( مد الله فى قوه عساكره ونفخ فى قوته )<br />فى الجريده التى نشرت المقال وهى جريده محترمه نشر مقال غريب نوعا ما هى ان الحكومه تطلب بعض قيادات الجماعه ( المحظوره ) بالاسم لانهم مسؤلين عن المعارضه للحكومه متوقعش انها عيزاهم عشان تتحدث معاهم عن هموم المواطن<br />طلبت وزارة الداخلية من نيابة أمن الدولة ضبط وإحضار ١٧ قياديا بجماعة الإخوان المسلمين في سابقة هي الأولي من نوعها، ردا علي المظاهرات التي اندلعت للتضامن مع القضاة أثناء محاكمة المستشارين البسطويسي ومكي.<br />وتقدم مأمور قسم الأزبكية بقائمة الأسماء إلي وزارة الداخلية التي تقدمت بمحضر التحريات الذي جاء فيه ضرورة القبض علي ١٧ قياديا بالجماعة، علي ر<br />اقرأ بقية التعليق .."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113458/http://masr.20at.com:80/article.php?sid=309&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

