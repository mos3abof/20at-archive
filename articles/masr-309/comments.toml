[[comments]]
order = 5
subject = "اين الدليل على ما تقولين؟"
author = "لا يوجد عاقل ينكر قمع و بطش وديكتاتورية النظام ودليله على ّذلك انه راه بام عينيه فلا يوجد فرد فى مصر لم يقع عليه الظلم من هذاالنظام."
posted = "2006-05-13"
text = "أما هذا الكلام عن ديكتاتورية الاخوان وكل التهامات التى تكيلينها للاخوان فما دليلك ومن اين لك هذا الكلام؟ هذا برأييى تماماكما تفعل الحكومةوهوالمداومة على الاشارة باصابع الاتهام الى الاخوان والتشكيك فى نزاهتهم ودوافعهم لزعزعة ثقة كل من أعطاهم صوته.اعطوهم الفرصة ثم حاكموهم ولكن لم تدخلوا قلوبهم لتحكمواعلى نواياهم فاين العدل والديمقراطية فى ذلك؟!!!<br />كما ارفض الاشارة والقول بان الشعب مسلوب الارادة ومحاط بنارين فقد اثبت الشعب انه هو من يختار برغم كل العقبات وقد اراكم من اختار فكيف بعد كل ذلك تأتوا لتساووا بين نار الحكومة ونار الاخوان؟؟!!!!<br />اعتقد ان لهذا غرض واحد وهو فى نفس بعقوب!!!!"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113458/http://masr.20at.com:80/article.php?sid=309&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "معلهش احنا بنتحاور"
author = "طارق"
posted = "2006-05-13"
text = "مش عرف أبدأ منين ولكن مع كل احترامي وتقديري لكاتب المقال إلا أنه يعبر عن وجة نظره الخاصة .<br />أما أنا فلست اخوانياً ولكن كان لي اتصال بهم في صباي ،وللحق أقول إن فكر ومبادءهم الإخوان لو طبقت كما يقولون لتغير الحال في مصر كثيراً ، وأنا أؤكد أن فكر الإخوان يستمد أساساً من الكتاب والسنة وإجماع الفقهاء وهي عينها المبادئ التحكم بها الرسول والخلفاء الراشدون فكان من نتيجة ذلك أن تقدمت الأمة وأصبح لها شأن خاص بين شعوب الأرض وحينما تخلت عن ذلك كانت النتيجة كما نري الأن ولن أعدد ما نحن فيه من الهم والغم ومظاهر التخلف .<br />سؤال بسيط أود الإجابة عليه ؟<br />ما الفترة التاريخية التي جعلت لهذه الأمة كرامة ؟ بل وما سر تقدم المسلمين الأوائل ؟ بلا شك ستجد اجابتك كلمة واحدة الإسلام<br />يا سيدي خراب الاقتصاد وانعدام الأمن وانتشار الفساد والفوضي والمحسوبية والظلم الذي انتشر وفاحت روائحه النتة كل ما سبق يعود إلي شئ واحد وسبب جوهري وهو \" خراب الذمم وانعدام الضمير \" والجشع الإنساني والرغبات الجمومة التي تضرب بكل القيم عرض الحائط<br />وهذا الأمر هو ما أتي الإسلام من أجل ان يكبل جماحة ويقضي عليه ويعلمنا القناعة ويدعونا إلي الرحمة ويحثنا علي عفة اللسان وقبول الآخر ......الخ<br />وهذا بكل تأكيد ستجده في دعوة الإخوان وغير الإخوان ممن يطبقون الإسلام علي نفوسهم وفي بيوتهم وغلفون حياتهم بكل مبادئه<br />* الإسلام ليس حكراً علي الإخوان ولكن الإخوان هم بعض حملته وهم أقوياء به وهو قوي بهم وبغيرهم ممن يبطبقون تعاليمه<br />* القضية ليست أبو الفتوح ولا غيره القضية هي قضية الأمة كلها قضية كل طفل وشاب ورجل وامرأة قضية كل الحركات المعارضة قضية الحكومة إن أرادت أصلاح نفسها وتخلت عن مبادئ العصور الوسطي وسياسة فرق تسود والعصا لمن عصا<br />ال<br />اقرأ بقية التعليق .."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113458/http://masr.20at.com:80/article.php?sid=309&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "داحنا هنضحك ضحك!"
author = "Yahya_Ayash"
posted = "2006-05-13"
text = "الأستاذة سحر مش عارفة تجمع أول مقالها من آخره!!<br />شوية مش عاجبها النضال الحنجوري، وجاية تمارسه بعد كده (بسطرين)!!<br />هذا كل رصيدها من الأدلة:<br />\"أشك في نواياهم\"<br />\"لم يفعلوها إلا مزايدة\"<br />مزايدة على مين؟<br />هل تنكر الأستاذة سحر أن الإخوان -وحدهم- كانوا لسنوات طوال في معركة قانون الطوارئ، وكان اللوم ينصب عليهم من كل جانب من قبل العلمانيين والليبراليين بدعوى أنهم لا يهتمون لمشاكل المواطن \"العادي\" على اعتبار أن قانون الطوارئ هو من مشاكل المواطن \"الإخوانجي\" الخاصة؟!<br />أي مزايدة تلك التي تتكلم عنها الكاتبة؟<br />إنني أزعم أن مجرد مقارنة جهود ما تسميه الكاتبة بالقوى الوطنية في محاربة قانون الطوارئ بجهود الإخوان لهو مزايدة من قبلهم، وهو محاولة لاكتساب حجم أكبر من حجمهم الحقيقي باستخدام الإعلام الذي سلب الإخوان أغلب أدواته \"انتهاء بإغلاق جريدتهم\" ولم يبق لهم إلا أفرادهم والإنترنت!!<br />أنا لا أحب \"التنطيط\" عندما يبدي أحدهم رأيه فليحترم عقولنا قليلا.."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113458/http://masr.20at.com:80/article.php?sid=309&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "مقال وهمى ليس له اساس من الصحة"
author = "مع كل احترامى للاستاذة سحر والصحيفة اللى بتشتغل فيها الا انى اختلف تماما معها فى الراى وسأعلق على الموضوع فى عدة نقاط:"
posted = "2006-05-13"
text = "1-موضوع ان الجماعة منحلة ولكنها للاسف موجودة بأرادتكم التى سعت الى الديموقراطية وكأن الاخوان لم يكونوا موجودين الا لما حضرتك سعيتى الى الديموقراطية احب اقول لحضرتك ان الاخوان فى الثلاثينات من القرن الماضى بلغ تعداداهم 5 ملاين من اجمالى 18 مليون مصرى أن ذاك<br />2-ازاى فيه اعتراف ضمنى من اقطاب الحزب الوطنى للاخوان وبيتحاوروا معاهم ومع ذلك يعتقلوا 200 من الاخوان يوم الخميس علشان المظاهرة بتاعت مناصرة القضاه والاعتقالات قبل كدة كتير طبعا.<br />3-ازاى يعنى السلطة ارض متنازع عليها بين الاخوان والحكومة.الاخوان مش غايتهم السلطة ولكن السلطة عندهم وسيلة وليست غاية.ومع ذلك-بحسب فرضك- انا اول مرة اعرف ان طلب السلطة جريمة لا تغتفر بالشكل دا يعنى هو حزب التجمع او الناصرى مش عايزين سلطة ولا هو حلال لناس حرام لناس<br />4-موضوع مزايدة -والله عجايب-هو لما الاخوان يسكتوا يبقوا عايزين يحققوا اكبر مصلحة شخصية ويضربوا عصفورين بحجر ولما يتكلموا يبقى مزايدة<br />5-وبعدين هو ذنب الاخوان ان الاحزاب ضعيفة ولا هو المفروض علشان خاطر الاحزاب ضعيفة الاخوان يناموا بأه فى بيوتهم كمجاملة للاحزاب وبعدين استغلال ضعف ايه حضرتك بتحسسى الناس ان اللى بيدخل فى الانتخابات يبقى داخل مؤامرة واستغلال.بلاش بأه استخفاف بعقول الناس<br />6-ليه نحاسب الاخوان على ما نظن ونتخيل انهم سوف يفعلوه ولا نتحد-كلنا-لنحاسب الظلمة على ما يفعلوه فعلا<br />7-مين اللى قال ان الاخوان هايستغلوا الحريةوالعدالةوالمساواه والشورى للقضاء على الدولة الحالية وكأن الاسلام ما فيهوش الكلام دا كله.على فكرة العلمانين هم اللى متعلمين الكلام دا من الاسلام مش ا<br />اقرأ بقية التعليق .."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113458/http://masr.20at.com:80/article.php?sid=309&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "نعم وكيف واجهتيها"
author = "محمود جلال"
posted = "2006-05-14"
text = "نعم ما تقولينه صحيح ولكن ماذا قدمت لمواجهتهم وكشفهم أمام المغرورين بهم وأعتقد ان مكاشفتهم بأنفسهم تدور في فلسفة شعارهم وتحركاتهم فشعارهم هذا (الإسلام هو الحل) هو شعار يحمل في طياته كل معاني الإستبداد والإستعلاء والعدوانية والصلافة بل ولا يخلو من عنجهية وكبر وأيضا حيلة واحتيال على مشاعر البسطاء والعوام كذلك المقهورين والمتحيرين إلى آخر كل المعاني والصفات التي نهى عنها الإسلام الذي هو الحل الذي اتخذوه مطية إلى غاياتهم وحلمهم القديم وهو العرش والسلطان<br />من هم ومن منهم يستطيع أن يدعي الإلمام بكل شريعة الإسلام وأحكامه وفرائضه ومنهجه ... وهل هم إلا بقايا كيان قديم عاش ومات قبل سبعون عاما لا غير لا تحملون مسحة منه ولا من منهجه وتعاليمه , وهل هم إلا ما تبقى من رحيل علماء وفقهاء الإخوان الذين رفضوا نهجهم وخططهم وبروتوكولاتهم وأظهروهم على مخالفتها الشرعية لكتاب الله وسنة رسوله كما كان من الاستاذ محمد قطب وغيره إلا إنهم أعرضوا واستكبروا واصروا إصرارا , ألم يرفض يوضح مؤسس الجماعة الإمام الشهيد رحمه الله موقفه من الإنتخابات والأحزاب ونهى عنها وحذر منها تحذيرا شديدا كما لو كانت محرمة<br />أي إسلام يعنون؟ إسلام الوهابية أم إسلام السلفية التكفيرية؟ إسلام جماعة الجهاد أم إسلام الجماعة الإسلامية؟ إسلام الإخوان أم إسلام الطالبان؟ الإسلام السني أم الإسلام الشبعي , يجب تفنيد دعواهم حديثا وقديما فقها وديناغاية ووسيلة<br />الإسكندرية مهندس / محمود جلال mgalal303@yahoo.com"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113458/http://masr.20at.com:80/article.php?sid=309&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "ايه ده"
author = "رشاااد"
posted = "2006-05-15"
text = "ومعظم دوائر الصراع التي تزعج الدولة الآن لا تخلو من أياد إخوانية تحركها، وتشعلها حين تشاء بزعم مناصرة الحرية والديمقراطية فرغم رفضي لمد العمل بقانون الطوارئ لم أجد في مظاهرة الإخوان في المجلس الموقر إلا مزايدة سياسية علي كل القوي الوطنية، ورغم إيماني بالمطالب العادلة للقضاة والصحفيين أشك في نوايا الإخوان خلال دعمهم لتلك الفئات، فهم لا يقدمون شيئا \"لله والوطن\"، لأنهم محترفون في المقام الأول، ولأن لديهم سيناريو محكما تصل آخر حلقاته إلي \"كرسي الحكم\" !.<br />هم -في رأيي - يزيدون الفتنة السياسية لهيبا، وقد نجحوا في استغلال ضعف أحزاب المعارضة وتوسعوا علي حساب الفراغ الذي خلفه غياب بعض تلك الأحزاب، كما نجحوا في استغلال مبادئ \"حركة كفاية\" وأولها قبول الآخر وأصبحوا جزءا من الحراك السياسي الذي نراهن عليه .<br />متى سنتخلص من هذه الكلاكيع و الامراض النفسيه ؟ الى متى سنظل نساعد بقاء هؤلاء الكلاب الفاسدين فى السلطة بزعم ان البديل مر؟ يا سيدتى عالجى تلك الخرافات لانها ليست فى مصلحة احد الا الفاسدين الباقين فى السلطة هذه التشوية لكل البدائل يفض الشعب عن الالتفاف حول خيار التغيير هل هذا وقت مناسب لاستمرار تلك المعارك الجانبية السخيفة على جثمان وطن مات و اندثر كما يفعل الشيعة و السنة فى العراق ؟<br />ليكن ما تقولين صحيح بشان \"نوايا\" الاخوان المزعومة و\"مزايدتهم\" على باقى \"القوى الوطنيه\" فان الواقى الوحيد فى هذا الشان هو شعب حارس لحريته و مكتسباته و ليس الرضا ببقاء شلة العملاء تلك التى تعبث بنا و بمصيرنا.<br />ساظل مؤمن بان اقتلاع شجرة الفساد الضخمة يستحق العناء و ان كان البديل بذرة شوك صغيرة و بان الحارس الوحيد على مكتسبات الشعب هو وعيه ليس احد اخر لن اكون امن على حريتى ان ابيقيتها بيد اخر قد يضن على بها ي<br />اقرأ بقية التعليق .."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113458/http://masr.20at.com:80/article.php?sid=309&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

