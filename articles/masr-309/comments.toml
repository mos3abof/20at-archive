[[comments]]
order = 0
subject = "لا غير صحيح"
author = "حمد"
posted = "2006-05-13"
text = "لا غير صحيح ما تقولينه عن فكر الاخوان في الدولة القادمه فارجعي الي كتب القرضاوي. ان التغيير لن يحدث الا بمشاركة جميع طوائف الشعب لا الاخوان وحدهم.عدم الموافقه علي قطع يد السارق هو عدم الموافقه علي تشريعات الله.وعند قطع يد السارق لن يسرق احد ولن يخاف الا الحراااااااميه."
archived = "2006-09-07"
