author = "النظام غير ديمقراطي"
posted = "2010-03-05"
text = "في مصر توجد الكثيييييييير .. منها: النظام غير ديمقراطي، تعديل الدستور، المطلوب نظام جديد<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــ<br />وانتا يا ابو شخه اللي حتعلمنا الديمقراطية<br />شعب مصر ما ينفعش معاه الا الجذمه القديمه<br />من ايام الاحتلال الروماني<br />نخلص من احتلال يجيلنا احتلال<br />خلاص اخدنا على الذل<br />ما ينفعش معانا ديمقراطيات"
archived = "2010-03-06"
capture_url = "https://web.archive.org/web/20100306014552/http://www.20at.com:80/masr/hot-topics/15603-2010-03-04-20-33-56.html"

