text = "ابن طبقة برجوازية عريقة (والده نقيب المحامين الأسبق)، محب التغيير، متواضع، هادئ ودقيق.<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــ<br />يعني ابوه كان البرادعي ومشاركوه حراميه ونصابين مجتمعين ومنفردين<br />او البرادعي الحرامي بالنصب والدعارية العليا"
