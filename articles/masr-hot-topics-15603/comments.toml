author = "اظهر على حقيقتك"
posted = "2010-03-05"
text = "دكتوراه في القانون الدولي من جامعة نيويورك.<br />ايوه كده يا برادعي<br />طيب ما هو السادات كان بتاع امريكا<br />وحسني مبارك برضه<br />وانت برضه من امريكا<br />يعني حتعمل ايه اكتر من اللي عمله السادات<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــ<br />وهذا الكلام موجه للعبط اللي كانوا الانتخابات اللي فاتت مع ايمن نور"
archived = "2010-03-06"
capture_url = "https://web.archive.org/web/20100306014552/http://www.20at.com:80/masr/hot-topics/15603-2010-03-04-20-33-56.html"

