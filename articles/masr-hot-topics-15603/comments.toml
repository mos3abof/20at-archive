author = "كل اللى اعرفهم بيؤيد"
posted = "2010-03-06"
text = "انا حاسس ان اللى كاتب التعليقات دى كلها شخص واحد<br />بصراحه الناسى كلها عاوزه تغييييييييييييي ييييييييييييييي يييير بجد<br />ان شالله حتى يكون عنده 100 سنه<br />او يكون امريكانى الجنسية<br />المهم نغير الجثة اللى عتقت من الكرسى دى"
archived = "2010-03-06"
capture_url = "https://web.archive.org/web/20100306014552/http://www.20at.com:80/masr/hot-topics/15603-2010-03-04-20-33-56.html"

[[comments]]
order = 10
subject = ""
author = "الى السابق الوطنى"
posted = "2010-03-06"
text = "يا عم احنا موافقين الجيش يحكم - ما هو برضة الجيش اخوتنا وعيالنا ومن اهالينا<br />بس يبقى فية تغيير<br />الجيش فية الف لواء<br />وفية كفاءات وطنية وبرضة عيالنا<br />لازم يبقى فية تغيير<br />اى لواء تانى بفكر تانى وطنى - انما تأبيدة من المهد الى اللحد ولا جديد وبعدين يجيب ابنة كمان وكانها عزبة او تكية<br />لواءات الجيش فيهم ناس محترمين وكفاءات<br />غيروا شوية<br />انما السماجة دى الى الابد<br />وبعدين الناس كلها عارفة السادات اختارة لية يبقى نائب<br />تحب نقول<br />واللى<br />اذكروا محاسن موتاكم"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314030542/http://www.20at.com:80/masr/hot-topics/15603-2010-03-04-20-33-56.html"

[[comments]]
order = 11
subject = ""
author = "الى المعلق السابق"
posted = "2010-03-06"
text = "يا حبيبي انا مش من الحزب الوطني ولا الحزب النيله<br />انا راجل واقعي احب اعيش في الواقع<br />ايمن نور مين وبرادعي مين<br />احنا بيحكمنا الجيش<br />وقائد الجيش لازم يبقى هو الحاكم<br />حتى حسني مبارك القائد الاعلى للقوات المسلحة ورئيس المجلس الاعلى للشرطة وحتى سمى كلية الشرطة اكاديمية مبارك للامن<br />يعني الدولة بيحكمها الجيش<br />وشوف في باكستان وتركيا<br />يعملوا انتخابات وديمقراطية وهوب هوب بعد شوية تلاقي الجيش عمل انقلاب واخد السلطة<br />يا عم عيش في الواقع بلاش الخيالات اللي انت عايش فيها دي<br />الجيش هو اللبي بيحكم يعني حيحكم<br />ريح نفسك ايمن نور اخد 5% في الانتخابات والبرادعي حياخدهم يا سيدي<br />سلام يا صاحبي<br />وبعدين حسني مبارك لحد دلوقتي متردد انه يتنازل لابنه للحكم<br />موضوع جمال مبارك دا بقاله كتير اوي<br />لحد الان حسني متردد انه يتنازل لابنه يبقى حيتنازل للبرادعي<br />سلام"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314030542/http://www.20at.com:80/masr/hot-topics/15603-2010-03-04-20-33-56.html"

[[comments]]
order = 12
subject = ""
author = "معاك يا برادعى"
posted = "2010-03-10"
text = "ااحسن حاجه ان محدش فاهم حاجه<br />انتوا قالبين على الراجل كده ليه<br />يعنى حتى لو مسك هيعمل ايه اكتر من الى قبله عمله<br />ادولوا فرصته حتى لو كان هيخربها<br />مهى خربانه خربانه<br />مصر لسه عايشه<br />عماله تتسرق من ايام الفراعنه لحد دلواتى ولسه الخير فيها ولسه بيسرقوا فيها<br />بنوا الاهرامات الى العالم كله بيتكلم عليها بالذل<br />بنوا قناه السويس برده بالذل<br />كله عمال يذل فى الشعب<br />احنا قاعدين نتكلم وسايبين الحراميه<br />ياريت الواحد كان طلع معاهم حرامى<br />ايه بس الى انتوا بتتكلموا فيه<br />طيب انتا من رايك انتا وهو انتوا عاوزين مين يمسك الحكم<br />عاوزين الجيش<br />كلهم زى بعض<br />ابقى قابلنى لو حد من الجيش اتقدم للرئاسه<br />دى تطير رقابته فيها<br />دى مش ديموقراطيه<br />دى ديكتاتوريه<br />واييييييييييييي ييييييييييه<br />واحسن حاجه ان محدش عارف حاجه<br />شوفوا انتوا عاوزين مين يترشح ويكون كويس بانسبه لكم<br />واكتوا اسمه على الاقل نعرف ان لسه فيه ناس كويسه فى البد دى"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314030542/http://www.20at.com:80/masr/hot-topics/15603-2010-03-04-20-33-56.html"
