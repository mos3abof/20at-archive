author = "اسلوب شاذ"
posted = "2010-03-06"
text = "بالتاكيد اللي كتب كل التعليقات اللي قبلي واحد فقط و للاسف مفيش اي حد من اسرته مسئول عنه في التربية فطلع مريض مش عارف هو عايز ايه او امتي لسانه ينطق بقذارة و امتي يتكلم بأدب او الاحتمال التاني انه واحد بلطجي من الحزب الوطني الجاهل ارجو من الموقع مراجعة التعليقات حتي لايعتقد زوار الموقع اننا مجتمعين مع اشخاص من قاع المجتمع"
archived = "2010-03-06"
capture_url = "https://web.archive.org/web/20100306014552/http://www.20at.com:80/masr/hot-topics/15603-2010-03-04-20-33-56.html"

[[comments]]
