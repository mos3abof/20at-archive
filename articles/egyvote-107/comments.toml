[[comments]]
order = 0
subject = "مقال هام"
author = "محمود يوسف"
posted = "2005-12-07"
text = "عمي صديق مسيحي عمره فوق الخمسين .. يعمل طبيباً وقد ذهب مع عمي إلى الانتخابات لإعطاء صوته للإخوان .. ويحكي عمي عنه أنه من المسيحيين الملتزمين .. فهو يداوم على الذهاب إلى الكنيسة .. وعلاقته بعمي طويلة جداً منذ كانا يدرسان سوياً .. يذكر لعمي أنه كان كالآخرين ينظر إلى الإخوان نظرة خوف وريبة إلى أن جاوره في السكن رجل مسلم متدين يعمل أستاذاً في الجامعة .. ويقول الطبيب المسيحي أن هذا حدث منذ عشرين عاماً .. ويقول أنه بعد أن حصل على هذه الشقة بشق الأنفس تفاجأ بهذا الجار المسلم الملتزم .. فكره الشقة والشارع كله وفكر كثيراً في تركها.. ويقول أنه بسبب هذا أجل زواجه عام كامل للبحث عن شقة أخرى ولم يجد .. فرضي بنصيبه كما يقول وأراد أن يتمم زواجه ثم يبحث فيما بعد عن شقة أخرى .. يقول أنه في أثناء تجهيز الشقة حدث أن تضرر الجدار الفاصل بينه وبين الرجل المسلم الملتزم .. ويقول أنه ترك الشقة أسبوعاً كاملاً خشية من رد فعل الأخ المسلم .. يقول أنه ظن أن الرجل المسلم يمكن أن يأخذها سببا في النيل منه .. وبعد أسبوع عاد إلى الشقة بين عدد من أهله تحسباً لمعركة يمكن أن تنشب بينه وبين جاره الذي تضرر جداره وسقط بسبب أعمال الصيانة تلك .. ويكمل صديقنا المسيحي فيقول عندما دخلت إلى الشقة متسللاً وجدت الجدار قد تم بناؤه .. وفي الصالة وجد طاولة صغيرة موضوع عليها سلة زهور توشك أن تجف وبطاقة تقول له ألف مبروك وربنا يتمم زواجك على خير .. إمضاء .. جارك أحمد .. يقسم الرجل أنه لم يتمالك نفسه من جملة مشاعر متداخلة .. وطرق على باب جاره أحمد ليعتذر له عما حدث ويطلب منه أن يشارك في مصاريف بناء الجدار على الأقل .. لكنه وجد رفضاً تاماً من أحمد وليس على لسانه غير ربنا يتمم بخير .. عيب تقول كده .. إحنا جيران .. إحنا مقصرين معاك<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228233659/http://egyvote.20at.com:80/article.php?sid=107"

[[comments]]
order = 1
subject = "بقية المقال"
author = "محمود يوسف"
posted = "2005-12-07"
text = "حنا مقصرين معاك لأننا لا نساعدك كما يجب .. يقول منذ ذلك اليوم أيقنت أن الإخوان غير ما كنت أظن وأنا أنتخبهم لأنهم الأفضل ولأنني وطني أريد لبلدي الصلاح والفلاح ولم أجد خيراً منهم لتطهير البلد من الفساد الذي يضرب بأركانها .. لذا فقد انتخبتهم .. هذا الرجل المسيحي صديق عمي تعامل عن قرب مع واحد من الإخوان وعرفهم عن قرب لذا أعطاهم صوته .. ويقسم أنه مازال بعد عشرين عام لا يدري كيف يرد إلى جاره أحمد صنائعه الطيبة المستمرة معه .. فهو خير جار رآه في حياته .. فهل رأيتم الإخوان كي تتحدثوا عنهم ؟؟؟ أم أنه مجرد ترديد بلا وعي وراء كل من هب ودب واسترزق من وراء الكتابة ومهاجمة الإخوان ؟؟؟ أرجو"
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228233659/http://egyvote.20at.com:80/article.php?sid=107"

[[comments]]
order = 2
subject = "هل أخطأ المسلمون في مصر"
author = "محمود يوسف"
posted = "2005-12-07"
text = "هل أخطأ المسلمون في مصر عندما نادوا ومارسوا بشكل فعلي حرية العبادة والدين لله والطن للجميع ؟؟؟ هل كان من المفروض وهم أغلبية 96 % أن يضطهدوا المسيحيين بحق طالما هذا حالهم لا يعجبهم العجب؟؟؟ ولكن الله سبحانه أوصانا بحسن المعاملة .. ولا إكراه في الدين .. إذن أين الخطأ ؟؟؟ لماذا يكن لنا جيراننا في الوطن من المسيحيين كل هذا الحقد والغل ؟؟؟ أعتقد أنه آن الأوان فعلاً للمسلمين أن يواجهوا المسيحيين بالشدة اللازمة لكي يقفوا عند حدود الأدب ولا يتمادوا أكثر .. فهم 4 % ويتمتعون بكافة الحقوق بشهادة غير المسلمين ومع هذا يصرخون في كل مناسبة وفي غير مناسبة بأنهم مضطهدون !!! عن أي اضطهاد يتحدثون ؟؟؟ أو قل عن أي بلد يتحدثون ؟؟؟ ماذا يريدون أكثر من هذا ؟؟؟ أعتقد أن جيراننا في الوطن من المسيحيين قد تجاوزوا حدود الأدب ويريدون أن يفرضوا علينا أجندتهم الخاصة .. 4 % تملي رأيها وأجندتها على الـ 96 % (سأقربها لك أكثر للآخرين من أصحاب الأقلام الخنثى ربما لا يفهمون النسب المئوية .. هب أنك في غرفة بها مائة شخص .. ستة وتسعون منهم يرون رأياً ما في قضية ما .. وأربعة فقط يرون غير هذا .. أين الرأيين يجب أن يؤخذ به ؟؟؟) .. بأي منطق وفي أي شرع يكون هذا ؟؟؟ أليس من حق المسلمين الـ 96 % من المصريين أن يراجعوا أنفسهم في معاملتهم للمسيحيين الذين فهموها خطاً .. فعلاً إخواننا المسيحيون فهموا الموضوع خطأ وظنوا من حسن المعاملة أنهم يستحقون أكثر منها .. بل راح بعضهم من الموتورين يظن أنهم أقوى وأخذ يسب الإسلام دين البلد التي تؤيهم ودين أهلها .. ولما لا والحكومة المصرية لا تسجن ولا تعتقل ولا تسحل إلا كل من قال ربي الله من المسلمين ؟؟؟!!! وأما الأحباب المسيحيين فلا أحد يقترب منهم .. لقد آن الأوان لكي يطالب المسلمون بحقوق<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228233659/http://egyvote.20at.com:80/article.php?sid=107"

[[comments]]
order = 3
subject = "بقية مقال الدكتور صلاح الدخيل"
author = "محمود يوسف"
posted = "2005-12-07"
text = "كي يطالب المسلمون بحقوقهم وليس المسيحيين .. لقد آن الأوان كي يطلب المسلمون المساواة .. المساواة في المعاملة بالمثل فنحن نحسن إليكم ونعاملكم بأحسن من المطلوب ومع هذا تتبجحون وتسيئون الأدب .. والأدهى اليوم أنكم تريدون فرض رأيكم على الأغلبية ؟؟؟!!! ليقل لي أي عاقل ماذا يجد في هذا ؟؟؟ أين يمكن أن نصنف هذا العته ؟؟؟ ماذا نسميه ؟؟؟ أليس من حق المسلمين أمام هذا أن يغيروا معاملتهم للمسيحيين كي يعودوا إلى رشدهم ويعرفوا قدرهم الذي يبالغون فيه ويكذبون ويصدقون أكاذيبكم ؟؟؟ ليقل لي أي عاقل ماذا ينتظر من المسلمين بعد كل تجاوزاتهم تلك ؟؟؟ بعد كل تطاولهم الغير مبرر والغير مفهوم ؟؟؟!!! لقد تجاوز الظالمون المدى .:. فحق الجهاد وحق الفدا .. هذا البيت سنسمعه قريباً .. تردده حناجر الشباب المسلم في كل ربوع مصر من وراء همجية المسيحيين الرعناء تلك التي لن تجلب لهم إلا المصائب .. سيقول البعض تطرفاً .. وآخرون سيقولون إرهاب .. وآخرون سيقولون ما يقولون .. ولكن ليتذكر الجميع أنهم من بدأ وأبدى العداوة واضحة جلية في كل مناسبة .. فو الله الواحد الأحد إنهم يبذرون الإرهاب ويرعونه تحت شعارات جوفاء من المحبة وقولهم أحبوا أعدائكم .. وأدر له خدك الأيمن وما إلى ذلك من تخريفاتهم .. فلا يلومن إلا أنفسهم بعدها .. إن الإرهاب يا كل ذي عقل يبدأ من هنا .. من مقابلة الحقائق بالأكاذيب .. من الرغبة المريضة لسيطرة الأقلية الصغيرة جداً على الأغلبية .. من التسلط .. من الغطرسة .. ألا تجدون كل هذا في كتابات الكتاب المسيحيين اليوم؟؟؟ فماذا ينتظرون من شباب مصر المسلم ؟؟؟ أن يصفقوا لهم ولغطرستهم ومقارعتهم الحق بالباطل ؟؟؟ سيأتي نفر من المخنثين من مدعي التحضر والتمدن والميوعة ويرمينا بالإرهاب وعدم قبول الآخر ووووو من تلك الأقاويل الخ<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228233659/http://egyvote.20at.com:80/article.php?sid=107"

[[comments]]
order = 4
subject = "بقية المقال"
author = "محمود يوسف"
posted = "2005-12-07"
text = "وووو من تلك الأقاويل الخنثى التي اغتصب بها الإعلام الغبي عقول هؤلاء فحملت سفاحاً بأفكار ضالة مضللة .. أي قبول للآخر ؟؟؟ وأي حوار يكون مع من يغالط في كل كلمة ويكذب ويقابل الحق بباطل هو أعلم به يقيناً أنه باطل ؟؟؟ هل يستقيم حوار على هذا الأساس ؟؟؟ أنا أعلم أن الحوار يكون بين العقلاء .. رأي برأي وحجة بحجة .. وإعمال المنطق في كل كلمة؟؟؟ ثم نأتي بعد ذلك نلوم الشباب على التعصب والتطرف .. إن التطرف والتعصب الأعمى فيما يقوله المسيحيون .. إن الحق عندما يواجه الباطل المتغطرس لا يملك إلا أن يسكت ويصبر .. أو ينفجر .. وقد صمت الشعب المصري المسلم عن بكرة أبيه طويلاً جداً .. وصبر كثيراً .. كثيراً .. وما بقي إلا الثانية .. فهل يريدونها ؟؟؟<br />صلاح الدخيل .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228233659/http://egyvote.20at.com:80/article.php?sid=107"

[[comments]]
order = 5
subject = "ما رأي يونان لبيب رزق وميلاد حنا ؟؟؟ مقال للدكتور صلاح الدخيل"
author = "محمود يوسف"
posted = "2005-12-07"
text = "ذه هي الحكومة التي تضطهد المسيحيين .. ما رأي يونان لبيب رزق وميلاد حنا ؟؟؟ تملأ السجون بكل من قال لا إله إلا الله لو نطق بالحق .. كلمة الحق فقط .. وتترك من يهزي بالباطل ليل نهار .. من الذي يحق له طلب المساواة من الحكومة ؟؟ من المضطهد؟؟؟ أحاول جاهداً أن أهذب نفسي بهدي المصطفى صلى الله عليه وسلم في كبح الغضب (والكاظمين الغيظ) لكني لا أتحمل المغالطات الفجة الوقحة .. عندما تستطيل هامة الباطل ويصمت الحق كاظماً غيظه .. يصدق الباطل الغبي أكاذيبه السمجة فيظن نه هو الحق ويتمادى .. ويعلو صوته أكثر .. ثم ماذا بعد ؟ أيظل الحق كاظماً غيظه أم ينفجر ؟؟؟ طبيعي أن ينفجر .. ثم تعلو الصيحات إرهاب .. بالله عليكم من بدأ الإرهاب وسعى له سعيه ؟؟؟ أما مل إخواننا المسيحيون تلك اللعبة السخيفة من الاستعباط وادعاء المحبة والتسامح .. يا حرام .. مساكين وطيبين .. طيب بأمارة إيه يا عقلاء العالم ؟؟؟ تذكرني هذه الكلمة بمسلسل يا رجال العالم اتحدوا .. الذي أنتجه تليفزيون صفوت الشريف للمسيحيين عندما صرخوا بأنهم غير ممثلين في الفن المصري .. عن أي تمثيل يبحثون ؟؟؟ إنهم يتنفسون التمثيل علينا وعلى العالم ليل نهار وفي كل لحظة .. هو لازم يعني يطلع على الشاشة ؟؟؟ أليس ادعاء المحبة كذباً والعيش بوجه وإضمار غيره تمثيلاً ؟؟؟ أليس الصراخ والعويل وشعارات الوطنية الكاذبة تمثيلاً ؟؟؟ أليس النوم في فراش الأعداء وارتداء أقنعة الوطنية عند الصباح تمثيلاً ؟؟؟ إن هذا ما يحدث من جيراننا المسيحيين المصريين على مر العصور والتاريخ خير شاهد عليهم .. التاريخ الذي كتبه مسيحيون مثلهم وليس المسلمين .. تاريخهم الأسود في بيع الوطن والمسلمين والكيد للإسلام على مر العصور .. من قبل الحروب الصليبية وما تلاها من مؤامرات على وطنهم وبني وطنهم من ال<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228233659/http://egyvote.20at.com:80/article.php?sid=107"

[[comments]]
order = 6
subject = "بقية مقال الدكتور"
author = "محمود يوسف"
posted = "2005-12-07"
text = "لى وطنهم وبني وطنهم من المسلمين .. يذكر المؤرخون الأوربيون كيف كان مسيحيي الشرق يطلبون منهم العون على المسلمين ويرددون نفس ما يقولونه الآن .. اضطهاد .. وتعاونهم مع كل أعداء الإسلام من تتار لمغول لبلى أزرق .. بل وتعاونهم مع الاحتلال البريطاني علناً وخفية .. وما جمعوا من ثروات من وراء تجارتهم المشبوهة مع الإنجليز .. والدليل لديهم هم في تصرفاتهم .. في هربهم من الثورة وخوفهم من العقاب .. لكن الشعب المصري الطيب ينسى أو يتم مسح ذاكرته بممحاة النظام الفاسد .. ومنذ ربع قرن .. منذ بداية العهد المبارك بدأت أموال تجارة آبائهم مع الإنجليز تعود إلى مصر .. وبدأنا نسمع عن شركاتهم الكبيرة .. وبدأوا يكيدون لأبناء وطنهم من المسلمين في كل مناسبة .. اضطهاد المسيحيين .. ورغبتهم الأكيدة في التدخل العسكري لمساعدتهم .. تماماً وبنفس السيناريو الذي كان في الحروب الصليبية مع اختلاف الأسماء .. هرقل صار بوش وتيودور صار بلير ووو بس أسماء تغيرت .. حتى أن ذلك الأهبل قالها ذات مرة .. حرب صليبية .. فلتكن يا بشبوش البيت الأسود كما قلت .. بس يا ريت جيراننا المسيحيين يساعدوا عمهم بوش يخرج من العراق أولاً .. هل يتذكر أحدكم عملية اختطاف المهندسين المصريين العاملين في شركة اتصالات مصرية بالعراق قبل عام تقريباً .. إنها شركة ساويرس رجل الأعمال المسيحي المصري .. إبن أكبر التجار مع الإنجليز أيام احتلالهم مصر بينما كان المسلمون المصريون يموتون بالآلاف في المقاومة ضد ذلك المحتل الغاصب في مصر وفلسطين ومن ذكرهم يونان لبيب رزق بأصحاب القمصان السوداء من شباب الإخوان المسلمين .. ما هذه القدرة العجيبة على قلب الأوضاع وتحويل الشرف والنضال إلى شبهة وسبة وتهمة وتحويل الخيانة والعمالة إلى محبة ووداعة .. أليس هذا عين الإرهاب ؟؟؟ عم<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228233659/http://egyvote.20at.com:80/article.php?sid=107"

[[comments]]
order = 7
subject = "نهاية المقال"
author = "محمود يوسف"
posted = "2005-12-07"
text = ". أليس هذا عين الإرهاب ؟؟؟ عموماً هل تجدون روابط من نوع ما ؟؟؟ أرجو من شباب المسلمين في مصر وخارجها ومن المسيحيين الشرفاء .. الصادقين مع أنفسهم أن يقرأوا التاريخ .. التاريخ الذي لم يكتبه عرب أو مسلمون .. التاريخ الذي كتبه الأجانب من غير المسلمين .. اقرأوا التاريخ الذي كتبه الخواجات ..<br />صلاح الدخيل .."
