subject = "خونه طول عمرهم والحقد مالي يقلوبهم"
author = "محمود يوسف"
posted = "2005-12-07"
text = "أنا مش حاتكلم زي المسيحيين الأغبياء دول والظاهر فعلا على راي الدكتور صلاح الدخيل انهم بداوا يقلوا ادبهم أوي اوي من تسامحنا معاهم دول تاريخهم اسود ومنيل بستين نيله الف مره بيبقوا عايزين يبيعوا البلد والكلام ده مش جديد ده تاريخ فعلا قديم المسيحيين عندنا في مصر خانوا وطنهم الف مره قبل كده اشتغلوا جواسيس للمغول والتتار واليهود واشتغلوا جواسيس للصليبييين وهم اللي جابوهم عندنا ويوسف شاهيم لما حط قصة عيسى لاعوام في فيلم صلاح لادين كان عايز ينفي التهمه اللي لابساهم واللي مسجلها المؤرخين الاوربيين يعني مش مؤرخ مصري ولا مسلم هما اللي راحوا يطلبوا نجدتهم من انجلترا واوروبا وجابولنا الصليبيين وهم اللي اشتغلوا مع الانجليز ايام الاحتلال وكونوا ثروات ضخمه من تجارة البرنس والقرنص واللعب مع الانجليز وحكاية الهلال مع الصليب دي عملوها القسيسين لما انكشفوا فراحوا جري على الازهر يبوسوا ايدين شيوخ الازهر ويقولولهم احنا معاكم دي بلدنا والمسلمين من طيبتهم صدقوا وطلعت الثورة الهلال مع الصليب دي الاعيبهم وطول عمرهم بيكيدوا لمصر وشعب مصر الاغبيا بيقولوا دي بلدنا طيب واحنا مين يا رمم وما هو احنا كنا مسيحيين زيكم ولكن ربنا هدانا وهدى اجدادنا ودي بلدنا برضه لكن تقول لمين بس دول فعلا كلاب ولازم ينضربوا بالجزمه عشان يتادبوا ويبطلوا قلة الادب بتاعتهم دي ويا اما يعيشوا زي الكلاب زي اي اقليه في العالم او يغوروا بعيد عننا الواحد خلاص قرف منهم كل ما الواحد يقرا ويعرف عنهم اكتر باكرهم اكتر واكتر دول ما خلوش حيله عشان يخربوا بيها بلدنا الا وعملوها وهم طبعا فاكرين انهم لما بيتعاملو مع العدو سواء تتار ولا اليهود والمغول ولا الصليبيين ولا الانجليز في الاخر فاكرين انهم ممكن يدولهم البلد يحكموها زي ما كانوا بيعمل<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228233659/http://egyvote.20at.com:80/article.php?sid=107"

