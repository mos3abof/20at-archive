[[comments]]
order = 12
subject = "نعم البلد بلدنا"
author = "قبطي"
posted = "2006-02-19"
text = "عم البلد بلدنا دي مش هزار دي حقيقة البلد دي بلدنا مش لأننا أقباط أو أن الأقباط كانوا هم ملاك هذه الأرض قبل أن ياتي المسلمون و يستولون عليها منذ مئات السنين و لكن البلد بلدنا لأن دي بلد المصريين منذ آلاف السنينز<br />نعم البلد بلدنا لأننا بنحبها و نخاف عليها عايزنها أجمل بلاد العالم مش عايزين نخربها لكن عايزين نبنيها مش عايزين نهدمها لكن عايزين نقويها هي دي مصر اللي بتعيش جوانا مش مصر اللي بنعيش فيها<br />هو ده إيمانا المسيحي المبني علي تعاليم المسيح مش يس كلام لكن أفعال.. صلوات و تضرعات نرفعها لألهنا الواحد علي شان يحميها و يعليها<br />و زي مالكتاب المقدس قال مبارك شعبي مصر و أظن أن الياء التي في شعبي تعني الملكيه ..<br />أما بخصوص الأضطهاد فنحن نعرف إلي من نشكوا فيقول الكتاب المقدس الرب يدافع عنكم و أنتم تصمتون"
archived = "2006-04-27"
capture_url = "https://web.archive.org/web/20060427020708/http://egyvote.20at.com:80/article.php?sid=107"

[[comments]]
order = 13
subject = "مصر و المسلمين فى قلبنا"
author = "مايكل"
posted = "2006-02-25"
text = "قول لأخى محمود يوسف أننا لسنا بخونة ويجب أن تراعى مشاعرنا جيداً وأقول لك أننا نحب مصر اكثر من أى شيئ لأن السيدالمسيح قال مبارك شعبى مصر و يقول الأنجيل أحبوا أعدائكم باركوا لاعنيكم فما بالك و أنتم أخوتنا فى الوطن ولا أحب أن أقول كلمة مسيحى ومسلم لأنى بذلك أفرق بين الأثنين بل أقول ديانتى هى (مصرى) و أقول لا يجب أن تتابع الكتابات التى تكتب لأنها ممكن تكون من ناس مش من مصر أساساً لأن العالم الغربى يريد الأستعمار مرة أخرى وهو يعلم كيف وطريقة دخول مصر عن طريقة أحداث الفتن أما بالنسبة للأخوان فياريت يراجعو أفكارهم السياسيةمرة أخرى لأنى قرأت فى أحد برامجهم مقول تقول ( ونستعين بغير المسلمين فى العمل كخادم أجير) وهذا يتنافى مع الأسلام لأنه يقول لكم مالنا وعليكم ما علينا يعنى المساواة فى كافة الحقوق و الواجبات لأن وكلمة خادم أجير تعنى أهانة للمسيحيين و ألغاء مبدأ المواطنة وهذا ما سيؤدى إلى حدوث الفتنة على أوسع نطاق ."
archived = "2006-04-27"
capture_url = "https://web.archive.org/web/20060427020708/http://egyvote.20at.com:80/article.php?sid=107"

[[comments]]
order = 14
subject = "لبنان-الجنوب المقاوم"
author = "محمد يوسف الحريري"
posted = "2006-07-11"
text = "لسلام عليكم :<br />انا مسلم عربي لبناني من جنوب المقاومة:؟؟؟<br />اقول لكم :يا اخواني المصريين متى ما بدأتم تفكرون هكذا (توقعوا نهاية مصر الحبيبة ؟؟؟اما اذا كنتم تحبون وطنكم كما تدعون فحافظوا عليه من انفسكم اولا\")<br />فمن خلال تجربتي كمواطن لبناني جنوبي عاش تحت نير الاحتلال الاسرائيلي اقولها وبفخر لولا لم نكن نحن اللبنانيين وبالاخص الجنوبين متحديين مسلمين ومسيحيين لم نستطع ان نحرر ارضنا ؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />فمن يقول انا مسلم او انا مسيحي ولا يقول انا مصري فهو(عميل؟؟) ولا يستحق ان يعيش فيها.............<br />اخوكم ...<br />ارجو منكم الرد؟؟؟؟؟؟؟"
