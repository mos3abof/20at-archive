[[comments]]
order = 15
subject = "سبب كراهية المسيحيين للمسلمين وادعائهم الكاذب بأن البلد بلدهم"
author = "زائر"
posted = "2006-12-04"
text = "ما تعلمون يا اخواني ان هناك حقيقة غائبة عن الناس وهي ان العرب المسلمين الفاتحين خرجوا ليفتحوا البلاد بأمر من الله سبحانه وتعالى وليس لمزاجهم الخاص والدليل على ذلك ان كل معركة دخلها المسلمين كانوا اقل عددا وعدة ومع ذلك انتصروا وارجو للجميع ان يقرأ عن معركة القادسية واليرموك اهم معركتين في الفتح الاسلامي وفتح مصر كيف انتصر عمر بن العاص بستة الاف جندي على اربعين الف جندي روماني.<br />المهم في اول تعداد حصل لمصر بعد الفتح الاسلامي اذا صحت الرواية كان عدد المسلمين 1% والمصريين سواء كانوا وثنيين او مسيحيين كانو 99%.<br />ثم بعد ذلك اخذ ينتقل المصريين الى الدين الجديد رويدا رويدا حتى كان آخر تعداد وبشهادة المخابرات الامريكية 94% مسلمين و6% اديان اخرى وعلشان خاطر المسيحيين نخليهم 90% مسلمين و10%مسيحيين واديان اخرى.<br />واثناء انتقال المصريين الى الدين الجديد وعندما بدأ يقل عدد المسيحيين تدريجيا تنبه المنتفعين من الديانة المسيحية الى هذا فعملوا منهج تكريه في المسلمين يدرسونه لاطفالهم يمنع تسرب المسيحيين الى الدين الاسلامي وبالفعل نجحو وهذا المنهج كان منذ عدة مئات من السنين وعلى ما يبدو هذا المنهج قد نجح واصبح الان المسيحيين المصريين يكرهون المسلمين كراهية شديدة بفضل هذا المنهج. وخصوصا النبي محمد صلى الله عليه وسلم وشخصيته.<br />وارفق سطور من اخ مسيحي دخل في الاسلام مذكور فيها موضوع تكريه المسيحيين في الدين الاسلامي:<br />قصة أسلامي<br />بسم الله الرحمن الرحيم<br />* الحمد الله على نعمة الاسلام نعمة كبيرة لا تدانيها نعمة لأنه لم يعد على الأرض من يعبد الله وحده الا المسلمين.<br />* ولقد مررت برحلة طويلة قاربت 40 عاما الى أن هدانى الله وسوف أصف لكم مراحل هذه الرحلة من عمرى مرحلة مرحلة:-<br />مرحلة الطفولة:- ( زرع<br />اقرأ بقية التعليق .."
archived = "2006-12-07"
capture_url = "https://web.archive.org/web/20061207080552/http://egyvote.20at.com:80/article.php?sid=107"

[[comments]]
order = 16
subject = "من الذى حرف الانجيل"
author = "زائر"
posted = "2006-12-04"
text = "ن الذى حرف الانجيل و التوراة ؟و لماذا؟وكيف ؟<br />ومتى ؟وأين؟<br />موضوعات مسيحيه هامه بقلم عالمة مسيحية كبيرة.<br />من كتاب (الصراع العظيم بين الحق والباطل) للكاتبة الأمريكية ( اّلن هوايت)والذى تم توزيع أكثر من<br />(20 ) مليون نسخة منه فى أنحاء العالم ب( 117 ) لغه كما قال الناشر/جلال دوس، وهى فيلسوفه دينيه ،كتبت<br />كتبا أكثر من أى امرأه فى التاريخ.وعنوان الناشر :ص.ب.45 مدينة العاشر من رمضان - مصر.و يمكن لأى شخص أن يطلب نسخة مجانية بالبريد.<br />أخى القارىء: كثيرون من المسيحيين الذين يجادلوننى يسألونى نفس الأسئلة قائلين : من الذى حرف الكتاب المقدس(عندهم) و لمصلحة من حرفوه ؟؟؟ وكيف ومتى ؟؟؟ وما هو الدليل؟ و لهم أكتب هذا الموضوع،<br />وسوف تجد الكثير من الأدلة على تحريف التوراة والأناجيل فى المواضيع المختلفة على موقعى ،ولقدعثرت فى مذكرات أبى الواعظ الكبير فى (جمعية أصدقاء الكتاب) فى شارع عثمان ابن عفان – بمحرم بك – بالاسكندرية ، على مقال عن نفس الموضوع قال فيه:<br />ولا يخفى أن قيام المسيح الكذاب كان بالتدريج ، لأن الكنيسة دخل فيها الفساد بعد عصر (قسطنطين) و دخلت طقوسا كثيرة فى عبادتها ، حتى ادخلت عبادة القديسين واقامة الأيقونات فى الكنائس ، وكان رجال الدين بوجه عام – وخاصة أسقف روما-- يتقدمون فى السلطان يوما فيوم ،و قد ارتقى أسقف روما الى رئيس أساقفه ثم الى بطريرك ، ثم ادعى بسلطان أسقف عام(رئيس عام) على الكنيسة المسيحية فى العالم كله، ثم ادعى بسلطان ملك الأرض سنة 606 م. وكان من عادته أن يحمل سيفين:اشارة الى السلطان الروحى و السلطان المدنى،و أخيرا ادعى أنه نائب المسيح على الأرض ، وكان الملوك يقبلون قدميه(وما زالوا) ولا يأخذون التيجان الا من يده،ويخافون من غضبه، لأنه اذا حرم ملكا فان ر<br />اقرأ بقية التعليق .."
archived = "2006-12-07"
capture_url = "https://web.archive.org/web/20061207080552/http://egyvote.20at.com:80/article.php?sid=107"
