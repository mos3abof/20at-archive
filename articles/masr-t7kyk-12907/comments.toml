subject = ""
author = "مها السعودي facebook"
posted = "2009-08-11"
text = "انا شخصياً بحب اسمع للناس كلها<br />و أبني وجه نظري من اللي فهمته و اللي قريته بنفسي و لنفسي<br />يا جماعة دا احنا ساعات كتير بنسمع لغير المسلمين لما يهاجمو المسلمين<br />و بالنسبة للاستاذ جمال مبارك هو كشخص انا بحبه جدا<br />بقول و بكرر انا بحبه جدا ك شخصية وانا لست عضوة في اي حزب ولا اي جماعة<br />و لا جمعية اهلية ولا غير اهلية<br />انا عايزة اروح اسمعه و افهمه من دماغي مش من خلال محللين كل واحد يفهم و يفهم الناس اللي هو عاوزه<br />و دمتم"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814161235/http://www.20at.com:80/masr/t7kyk/12907-2009-08-11-12-41-25.html?"

