author = "اية الجديد"
posted = "2009-08-11"
text = "انا مش شايف اى حاجة جديدة فى البلد دى<br />ومحدش لة كلمة فى البلد دى<br />اللى لة كلمة البنك الدولى بيعطى تعليمات بيع دة وسيب دة وخد القرض دة<br />والغى ايات قران معينة من المدارس ودرس كذا ومتدرسش كذا<br />اية الجديد<br />مفيش اى جديد<br />والشعب حالتة زى الفل<br />وكل سنة وانتم طيبين<br />وذنبكم مغفور وسعيكم مشكور"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814161235/http://www.20at.com:80/masr/t7kyk/12907-2009-08-11-12-41-25.html?"

[[comments]]
order = 3
subject = ""
author = "بسمه عبد الحى"
posted = "2009-08-11"
text = "والله ياجماعه اجنا سمعنا كتير و هنسمع كتير<br />واتكلمنا كتير<br />انا شايفه اننا مش هنخسر حاجه<br />وياريت الكل يشارك<br />نذكر السلبيات مع أنه لو فتح صفحات الانترنت هيلاقيها كلها بينه زي عين الشمس<br />لكن أهى ماحوله<br />زي كل المحاولات<br />فإن صابت<br />فرب رمية من غير رامى وإن خاب<br />فماأكثر من فشلوا"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814161235/http://www.20at.com:80/masr/t7kyk/12907-2009-08-11-12-41-25.html?"

