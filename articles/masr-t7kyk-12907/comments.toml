author = "النزيل 25"
posted = "2009-08-11"
text = "مرت علي ذكري مؤلمة يوم 14 يناير وقد سردت فيها ما تعرضنا له بداية من اعتقالنا في أول أيام العام حيث كنا مجموعة من قيادات العمل الطلابي بجامعات مصر واجتمعنا لبحث التهديدات التي توجهها امريكا لاحتلال العراق بزعم امتلاكها أسلحة دمار شامل فاقتحمت قوات مباحث أمن الدولة اجتماعنا السلمي بقيادة العقيد محسن عبدالعال واسمه الحقيقي محمد عبدالوهاب برفقة المقدم عاطف الحسيني حيث اقتحمت الشقة كتبة من القوات الخاصة يرتدون ملابس ملكية وملثمي الوجوه ويحملون رشاشات وطالبوا منا الإنبطاح أرضا وقاموا بتقيدنا أيادينا من الخلف وبعدا تم احالتنا لنيابة أمن الدولة العليا وأمرت بحبسنا خمسة عشر يوما وفي 14 يناير تم عرضنا للمرة الثانية علي النيابة التي أمرت باستمرار حبسنا وبدلا من أن نتوجه لسجن مزرعة طره تم احتجازنا الي منتصف ليل هذا اليوم بسجن الإستقبال حتي سلمنا مأمور لسجن لمجهولين بعد أن طلب منا أن نعصب أعيننا بأنفسنا وتم اقتيادنا لمقر مباحث أمن الدولة بمدينة نصر تعرضنا للتعذيب فيها لمدة 13 يوم حتي تم اعادتنا لمقر حبسنا الأساسي بسجن مزرعة طره"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814161235/http://www.20at.com:80/masr/t7kyk/12907-2009-08-11-12-41-25.html?"

