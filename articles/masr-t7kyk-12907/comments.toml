text = "جمال مبارك طلع علينا ذات يوم وقال انه حيسلم اصول الدولة للمواطنين عن طريق الاسهم<br />لماذا يا جمال انكفا على الخبر ماجور<br />ليه بتضحكوا على الشعب يا جمال"
