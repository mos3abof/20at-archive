posted = "2009-08-12"
text = "اكيد هاشارك انا عن نفسى شايف انه حدث جامد وخطوه كبير لنقل اهتمامات شباب النت الى المشاركه السياسيه وشايف انها خطوه لازم يعملها كل حزب<br />وبالنسبه للى بيقول مش هاشترك ده ضعف اشترك وقول رأيك وعبر عن اللى شايله فى نفسك مش تهرب الحزب الوطنى عمل كده علشان يخلع عنك ردأء الخوف اللى انت لبسه ومخليك بتخاف تقول رايك يلا اتشجع وابعت سؤالك مش تكون ضيعف هنفضل كدا على طول ازاى<br />شكر خاص منى لمن اتاح لى ولغيرى من الشباب هذه الفرصه"
archived = "2009-08-14"
