[[comments]]
order = 0
subject = "من كل قلبي تنجح يامبارك"
author = "و مبارك سقط مثلا كلنا هنعمل ايه هنتعب ونلوص اعتقد ان مفيش في مصر والعالم العربي كله افضل من حسني مبارك وانا اعرف ان معظم الشعب المصري يدعون له دبر كل صلاة ان ربنا يديمه في الحكم ويجي لنا واحد من ذريته يكون زيه قولوا امين يارب العالمين"
text = "كفايه الديمقراطيه اليي انتم عايشنها والانتخابات<br />اعترفوا وقولوا كلمه حق<br />واقول بكل قوة لازعيم بعد مبارك ولازعيم قبله مبارك افضل زعيم ولو فيه انصاف كان يحكم العالم مش مصر بس دة حكيم العرب وحاميهم يارب طول في عمرة مائه سنه كمان او مائتين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143430/http://www.20at.com/article.php?sid=1476"

[[comments]]
order = 1
subject = "almoshir_1981@yahoo.com"
author = "نا مش هتكلم كتير كلمتين وبس لولا مبارك لكانت البلد دخلت اكتر من حرب وكانت مصر اصبحت مثل فلسطين او العراق ومتهيقلى ان اعداء مصر هما اللى عايزين دا يحصل ودا مش ضعف لأ دا واحد عارف قدراته وقدرات غيرة وحاطت مصلحة شعبة اولا"
text = "انا يكفينى انه ماخلناش زى اى بلد من البلدان اللى قلتها وان انا نايم ومطمن على بيت واخواتى وولدتى<br />وللعلم كل المرشحين ماسكين عليه انه جبان لألألألألأ دا كدب ويكفى فى هذا المقام<br />قوله صلى الله عليه وسلم ( رحم الله رجلا عرف قدر نفسه)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143430/http://www.20at.com/article.php?sid=1476"

[[comments]]
order = 2
subject = "مبروك لزعيمنا"
author = "اض المعارك بروح كاسرة للهزيمة ومتطلعة للنصر"
text = "خطط للمعركة الجوية ولم يستسني احد حتي شقيق الزعيم الراحل انور السادات .<br />مرفوع الراس دائما متطلع لما هو افضل<br />قائد حكيم ياخد بالاراء ليتقن اتخاذ القرار<br />يقف مع الحق ولا يراوغ بالاحاديث الماكرة<br />له مكانة عالميه اعطته الثقة بالاغاء المادة 76<br />له القدرة والسيطرة في الموقف الصعبة<br />ثاقب النظر لما يجري علي الساحة السياسية<br />مبدع لطرق الابواب المغلقة لدعم الشباب<br />لاوجود للكسالي والمرابين والمتسلقين بين يديه<br />يعرف مكانة نفسه في قلوب شعبه مصر (بلدة التي اقسم ان يكون فداء لها منذ صغرة وهو طالب بالحربية<br />رجل عرف النظام والجدية والبعد عن كل المشككات<br />لايستمع للمهاترات والاقوال العشوائية<br />ليس 30 مليون ناخب وارء حسني مبارك ولكن 75 مليون مصري يحبوك من القلب ( فمن القلب الي القب يازعيم الامة العربية والي الامام )<br />ومهلا للحاقدين والمارقين والكذابين واصحاب المصالح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143430/http://www.20at.com/article.php?sid=1476"

[[comments]]
order = 3
subject = "ان الاوان لك يازعيم"
author = "ن تهز شعبك الكلمات المعسولة والتي لاتضمد الجروح"
text = "من وقف امامك سحق من الهزيمة لتفاهه ما يقول ..<br />قصفت الاقلام وقطعت الالسن امام صخرة بارزة بمصر (مبرك)<br />سيدوس شعبك بقدمة علي التفاهات ليتحمل المسيرة<br />سيكون الشباب اول من يرجع لرأئيك الصائب...<br />سنخوض الصعاب وننمي الاراضي الصحراوية واتساع الافقي<br />ستقتل البيروقراطية والروتين الاداري محطم الامال<br />ستفتح ابواب الامل للتوسعات الافقية بالارضي الزراعية كما بداءها بخطط مدروسة وبيانات واضحة ..<br />لامكان للكسالي والوصوليين بل المكان للجادين والمجاهدين لدفع عجلة التقدم للامام لديك يازعيم نخبة المفكرين للوقوف امام شللات المشاكل لدراستها<br />الحلول البديلة والامل يحدونا برئاستك لنا يازعيمنا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143430/http://www.20at.com/article.php?sid=1476"

