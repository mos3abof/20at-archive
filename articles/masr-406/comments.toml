order = 0
subject = "مسخرة"
author = "عبدالله مفتاح"
posted = "2006-05-29"
text = "والله اللي يسمع المشروغ الفارغ ده يقول ان مصر فلوسها كتيرة اوي ومش عارفه توديها فين<br />اظن ان ده اهدار للمال العام<br />ده كلام فارغ جدا وملوش اي معنى"
archived = "2006-09-06"
