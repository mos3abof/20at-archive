[[comments]]
order = 1
subject = "ابتسامة لله"
author = "د . محمود"
posted = "2006-05-29"
text = "مع الاعتراف بان الموظف مظلوم فعلا ولكن لابد ايضا من الاعتراف بأن الموظف فى كثير من الاحيان يخرج هذا الظلم فى صورة تسلط على المواطن الذى اتى لكى ينهى اى مصلحة فكثير من الموظفين عندهم عقد كبيرة جدا وغل واحيانا حسد واقسم بالله العظيم ان هذا حدث معى ذهب لانهى مصلحة فى احدى الجهات الحكومية الهامة فاذا بالموظف يعطينى محاضرة بانه رزقة قليل وانتم ( يقصد انا وغيرى ) من الذين يعملون بالخارج رزقنا كثير وكلام من هذا القبيل فما ذنبى انا وذنب غيرى وانا ليس لى حيلة فى الرزق فهو من عند الله قلت له هذا الكلام فكانت مشكلة وتم تعطيل مصلحتى عنده لمده 3 ايام حتى انهاها بالواسطة . ايضا فى مرة فى السجل المدنى لاستخراج بطاقة وكان الموظف اصغر منى سنا بحوالى 15 سنة وليه اقوله يااخ قامت الدنيا عليا ازاى اقولة ياأخ ومقلوش ياأستاذ ده طبعا غير التكشير فى الوجوه زى ما يكون احنا متجوزين امهم طيب هما مطحونين ومكبوتين احنا ذنبنا ايه حاجة اخيرة اى واحد يروح يخلص شغلانة فى اى بنك حكومى ويشوف نفس الخدمة فى بنك استثمارى وهيشوف العجب بين الموظفين !"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044014/http://masr.20at.com:80/article.php?sid=406&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "ابتسامه علي بطن فاضية"
author = "ابو شريف"
posted = "2006-05-30"
text = "سبق وفي موقع اخر طلبت ان يتم خضوع الحكومة للكشف الطبي لبيان مدى سلامتها العقلية وفكرة دورة الابتسامة دي تؤكد وجهة نظري<br />موظف يتم حشرة في اتوبيس وعنده مشاكل حياتيه لايعلم بها الا الله من دروس خصوصية ومن غلاء اسعار ومن تصريحات الحكومة وبعد كده عايزه يبتسم ... صدقوني سيبتسم لو مرتبه كفاه لنهاية الشهر ... وبعدين يادكتور مقارنتك بين موظف البنك الاستثماري والبنك الحكومي مع احترامي الشديد لك مقارنة ظالمه ... شوف اخر السنة موظف بنك الاستثمار ده داخله كام والثاني داخله كام والفرق هو ثمن الابتسامه<br />ياريت نكون واقعيين"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044014/http://masr.20at.com:80/article.php?sid=406&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "الحكومة صح"
author = "شىء غريب فعلا..انا مش عارف ليه الموظفين بيكونوا دايما مكشر ين....يعني الحكومة تعمل ايه...الموظف من دول بياخد المرتب اللي يكفيه دا غير العلاوات الضخمة (36 جنيهوماسابه) وبعدها يروح يستريح ويستني برامج تلفزيون هابله دا طبعا غير الويك اند اللي بيقضيه مع اسرته في النادي او الجنينه .. وطبعا كل سنة بيسافر في اجازة صيف ممتعه...غير وغير وغير.... كل ده ومكشر ...يااااه دي الناس دي وحشه اوي."
posted = "2006-06-01"
text = "ربنا ع الظالم والمفتري... وربنا يرحم شعب من غلبه قبل الظلم علي نفسه"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044014/http://masr.20at.com:80/article.php?sid=406&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
