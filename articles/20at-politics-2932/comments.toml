text = "انا احى الشعب واحترم الحكومة واحزر من العواقب المترتبة على ذلك واحنا فى مصر ممكن نعمل كده بس اعتصام لمدة عشرون دقيقة وبعد ذلك تفتح المعتقلات والسجون ابوابها لكل واحد كان ماشى فى الشارع حتى لو مش عارف فى ايه ربنا ينصرنا ويعنا على اللى احنا فيه ويخرجنا منه على خير"
