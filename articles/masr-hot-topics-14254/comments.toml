author = "الشيخ الشكسي"
posted = "2009-12-05"
text = "يا سلام عليك يا (زهقت منكم) فهذا الموقع اللعين سقط في الهاوية .<br />المواضيع تافهة . الأفكار سطحية . المعلومات خاطئة . الكتاب أسماؤهم غريبة . المعلومات خاطئة .<br />و لكن الخطأ الأكبر هو أنهم أهملوا قراءهم .<br />و أنا أتحدث بعد تجربة شخصية . فبعد أن رجوت القائمين على الموقع بكل تهذيب و احترم تزويدي بمقالة قديمة . رفضوا ذلك بسبب عمري . فهم يدعون أنهم موقع الشباب و لكنهم موقع ناكري الجميل التافهين ."
archived = "2009-12-08"
capture_url = "https://web.archive.org/web/20091208124211/http://www.20at.com:80/masr/hot-topics/14254-2009-12-05-09-57-22.html"

