subject = ""
author = "مشجع شهم"
posted = "2009-12-06"
text = "لن أنسى هذه الحادثة المفجعة لطالما حييت !<br />فإني رجل مصري أسكن في الجزائر و كانت هذه أكبر غلطة في حياتي فبعد المباراة بين الجزائر و مصر بأسبوعين طعنني رجل في إصبعة قدمي اليمنى فبعد أن خزلتني الجزائر بلدي الثاني و مصر بلدي الأول انتقلت للعيش في سورية بلدي الثالث و لغتي الأم و من وقتها إلى حد الآن لم أشاهد مباراة كرة قدم في حياتي و أنا أرجو أن تساعدوني في ايجاد طريقة للانتقام من هذا الرجل الخبيث"
archived = "2009-12-08"
capture_url = "https://web.archive.org/web/20091208124211/http://www.20at.com:80/masr/hot-topics/14254-2009-12-05-09-57-22.html"

[[comments]]
order = 5
subject = ""
author = "الشيخ الشكسي"
posted = "2009-12-06"
text = "إن الله يضل من يشاء و يهدي من يشاء . و لكن أنا متأكد أنه ان يهديك أنت و شركاؤك أصحاب هذا الموقع المغضوب المليء بالقردة بل و حتى الخنازير .<br />لقد تماديت يا (ربنا يهدي) فلم يكفيك التطاول علي أنا أكثر رجل شكسي في العالم بل أيضاً تطاولت على أمي رحمها الله .<br />و أنا متأكد أن شرابك المفضل هو الليمون بالخمر و العسل شراب الكفار و الأذلاء .<br />و السلام عليكم و رحمة الله ."
archived = "2009-12-08"
capture_url = "https://web.archive.org/web/20091208124211/http://www.20at.com:80/masr/hot-topics/14254-2009-12-05-09-57-22.html"

