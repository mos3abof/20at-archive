author = "نيفين..نيفى ..نوفا"
posted = "2006-05-28"
text = "اشى خيال يا ناس<br />محمد السيد لسه راجع و لا انا اللى كنت نايمه<br />حمد الله على السلامه يا محمد<br />و على راى هوووبه كفاره<br />المهم ابقى خد باللك شويه مش هقوللك عيش نمله تاكل سكر لان السكر شاحح ف البلد بس هقوللك خد بالك و انت فاهم اكيد<br />المهم حمد الله على السلامه<br />و كنت و انت غايب بنكتب ف اخر تعليقاتنا لا للتمديد<br />لا للتوريث<br />نعم لتعديل الدستور<br />لكن دلوقتى انت رجعت<br />استلم انت العهده قصدى الشعار يل بطل"
