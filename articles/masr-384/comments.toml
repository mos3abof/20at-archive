subject = "شكرا لكل العشريناتية"
author = "محم"
posted = "2006-05-28"
text = "شكرا كتييييييييييييير<br />لنيفين..نيفى ..نوفا<br />و لهبهوبه ........<br />ولو إني مكلمتكوش قبل كده ومتعرفنويش ... بس شكرا كتير لوقفتكم دي<br />وسلام مخصوص لعبد الله مفتاح ... الكابتن ده رائع الحقيقة ....<br />وواحدة مصرية ... ياسلام وإحنا اللي مش مصريين يعني ؟<br />و الاستاذشيكو ... ياعيني علي التواضع ...<br />وضد الحكومة .... إنتو حتودونا في داهية بأساميكو دي ....<br />مين تاني ؟؟؟<br />اه انا هو في غيري يقدر يكتب بايدي ... ده اسمه كده...<br />و أبو أسامة ...ربنا يبارك لك فيه يا أستاذ ...<br />و مش شغلك ...حاضر .إنت حر ...<br />وممممممم<br />يارب مكنش نسيت حد تاني .......<br />اه سٍيد الكل ؟؟<br />الأستاذ ياء .... الحقيقة مش عارف أقول ايه بعد اللي كتبته عني ..<br />ربنا يجمعني بيك في الجنة يارب<br />الحقيقة أنا قريت كل اللي فات ... ومش عارف أقول لكم إيه .؟؟؟<br />الصراحة حسيستوني إن الواحد له صحاب بجد .... حاسين بيه وخايفين عليه ...<br />بجد بجد<br />ربنا يخليكوا ليا . وميجمعناش في حاجة وحشة أبدا<br />وبرضه<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025753/http://masr.20at.com:80/article.php?sid=384"

