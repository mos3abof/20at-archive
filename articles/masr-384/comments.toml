text = "اقول لك ايه بس بجد واحنا فى الغربة بنكون منتظرين نسمة تعدى من مصر ولما اقول مصر اعنى حرفيا مصر الانسان مش الهرم ولا ابوالهول ولا حتى البحر المالح(على اساس انى اسكندرانى)بجد الله عليك رائع رجعتنالايام جميلة وبجد شممت عطر تلك الايام وتوظيفك للاحداث الجاريه جميل وياريت المزيد وجل تحياتى لاهل مصر الطيبين الطيبين وبس"
