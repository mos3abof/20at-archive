posted = "2006-05-30"
text = "انا شايف ان ليك مستقبل عشان كده انا اقترح عليك انك تبعتهاالي<br />عبدالله كمال بتاع روزاليوسف وهو هايقوم بالازم<br />انت بتضحك ايوة والله هو هايقوم بالازم0000<br />وهاينشرها في الصفحه الاولي للمجله بتاعته<br />وهايحطها تحت بند<br />كلاااااااااام جديد للمرشد العام وبعدين هايصغر الخط اوي ويكتب خنب المرشد العام اسمك يا عم هه فرحان<br />اعمل اللي انا باقولك عليه 0000ولو عايز كارت توصيه لما تدخل عليه المكتب قوله انا جايلك من طرف المرشد العاموهو هايقوم بالواجب<br />ولو زنقك في الكلام ووداك المحكمه ابق قول انا اقصد المرشد العام للجمهوريه<br />مش برضه هو مرشد للجمهوريه هاهاهاهاهااي"
