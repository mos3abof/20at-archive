text = "محمد بأعتبره واحد من شباب الجيل الذهبي ..<br />اللي يمكن عاش آخر أحلي ايام في تاريخ مصر ..<br />عشنا طفولتنا مع ميكي وسمير وتهته وعشنا مراهقتنا مع الشياطين ال13 وتختخ ونوسة ولوزة وعاطف ..وفي باكورة شبابنا عشنا مع رجل المستحيل وكوكتيل 2000 وملف المستقبل ..<br />بس عشان الحلو ميكملشي .. ادينا بنقرا الدستور ونتحسر علي حال البلد .. ونفرح بفلم شفرة دافنشي اللي اتمنع م السوق وبقت حياتنا كلها منع في حظر في شجب ..<br />ومن سيء لأسوأ بنمشي .. وياخوفي من سن شرخ الشباب وما بعده ...<br />محمد فتحي .. شكراً علي كل كلمة بنتنفس فيها من ذكريات جميلة ... ونعيشلنا لحظات وسط محيط من اليأس .."
