posted = "2006-06-06"
text = "القصة مع انها عجبانى بس فيها بعض الخيال<br />يا ريت تكون واقعية اكثر وتسميها(مبارك والأربعين حرامى) مع انهماكتر من كده الله يحرقهموبعدين انت ظلمت الوزير وسميته فرقع<br />مع انى عارف انه اسمه طرقع ودى شغلته فى الأساس هو والرجالة بتوعه لما الشعب قفاه ورمويا ريت متنساش فى القصة الجاية بقيت الأخوة الأعدأ من الحرامية قصدى الوزرا<br />ويا ريت بلاش تسرح بالخيال قوى اصل الوزير<br />يطرئعلك على قفاك يصحصحك .<br />وكل قصة وانت طيب وتعدى منها على خير<br />واشكر جميع المدونين ..."
