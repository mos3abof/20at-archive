[[comments]]
order = 3
subject = "لبد من عمل شيء إيجابى"
author = "مصرى"
posted = "2006-05-04"
text = "كل الإعتراضات دى لا تشكل شيء عند مبارك الفاسد ويعتبرها فقاقيع هواء سرعان ما تنتهى ولكن لا بد أن نكون إيجابيين أكثر من ذلك فعدد المصريين 72 مليون نسمة وحجم الفساد أقل بكثير ولن يستطيع الفاسدين الوقوف فى وجه نصف المصريين لو وقفوا فى وجوههم وقاموا بمشاركة القضاه والصحفيين والعمال فى إضراباتهم وإعتصامهم وهذا الفاسد أجبن من أن يستمر بعدهاوأكبر دليل على ذلك أنه يحمى نفسه بحثالة المجتمع حتى لا يستطيع أحد الوصول إليه وليكن لنا فى زعماء مصر الإشراف موعظة فهل نسيتم كلمة الزعيم أحمد عرابى والله لن نورث بعد اليوم."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171729/http://masr.20at.com:80/article.php?sid=274&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

