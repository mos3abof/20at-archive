posted = "2006-05-04"
text = "ياه لسة الدنيا بخير الحمد لله انا حسيت انى فى شباب مصريين بجد ومش تايهين بين روبى ونانسى ودومنيك ودانا وبوسى سمير ونجلا وهيفا وماريا احمدك يارب بس عايزين نعمل حاجة بجد غير انى احنا نكتب كلمتين وخلاص ونام عادى انشلا نعمل مظاهرة وما تكونش فى القاهرة بس تكون فى كل المحافظات وانا معا كو من اسكندرية"
