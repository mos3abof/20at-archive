[[comments]]
order = 8
subject = "البلد بلدى"
author = "مصرى"
posted = "2006-05-07"
text = "فعلاً فاضل على الحلو زقه ولكنها أقوى ذقة ومحتاجه أيدينا كلنا مع بعض علشان نضمن إنه ها يروح فى داهية وهايمشى أحنا محتاجين نكون كلنا إيد واحدة وأظن ظهر للجميع دلوقتى أنه هو اللى بيحاول يعمل تفرقة طائفية علشان يقدر يسيطر على الشعب بالضبط زى أى محتل لما يكون شعاره فرق تسد لكن لازم نكون كلنا إيد واحدة وإن شاء الله هانقدر على إزاحته لأن وجوده أصلاً باطل ده محتل للسلطة ولا زم يمشى ونطهر مصر منه وكفاية الفساد اللى وصلت مصر ليه من نهب وسلب وبطالة وهانقوله لقد خلقنا الله أحراراً ولن نورث بعد اليوم يعنى مش هاتقدر تورثنا لإبنك المختل عقلياً لأنك أنت وهو لا تملكون شرعية وجودكم وكفاية عليكم كده"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171729/http://masr.20at.com:80/article.php?sid=274&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "دى قضية مصر كلها"
author = "مصرى"
posted = "2006-05-08"
text = "أعتقد أن الإعتصام حق للإنسان فى دولة حرة ولكن مصر دولة تحت الإحتلال ولننظر كيف كان الزعماء فى عصور الإحتلال لمصر يتعاملون مع المحتل والدفاع عن مصر وعن شرعية وجود المحتل على أرض مصر الغالية وهم جميعاً من الحقوقيين مثل مصطفى كامل ومحمد فريد وسعد زغلول وغيرهم كثير. فنظام الحكم الموجود فى مصر ليس نظام شرعياًلأن الرئيس حسنى مبارك لم يأتى للحكم منذ تولى الرئاسة بإنتخاب الشعب كما ينص الدستور وكان وجوده فى الحكم طوال هذه السنوات بالتزوير وما بنى على الباطل فهو باطل. ثانياً كيف للقضاء أن يرتضى لنفسه هذه الوقفة المستجدية فى دولة محتله كان من المفروض المطالبة بتحرير مصر وليس الإنتظار من المحتل أن يعطيهم حقوقهم التى سلبها منهم الذى هو من وجهة نظر القضاء المتهم الأولى على قتل السادات وكل الأدلة تشير إلى أصابعة الخفية فى ذلك وكان لا بد أن يسقط القضاء شرعية الحاكم فى وجوده فى الحكم. وأيضاً لما أصاب مصر من فساد وتدهور وإخلال بكل مؤشرات الحياة من بطالة وتعليم وصحة وقتله للحياة الديمقراطية لكى يضمن سيطرة على الحكم وهذه نفس سياسة المحتل ولكن الحل الوحيد الذى لا بديل عنه هو الثورة على هذا الفساد وخاصة أن الشعب كله مؤيد لكم وملتف حولكم ولكنه ينقصه القيادة وأنتم القيادة الصالحة التى يتمناها المصريين جميعاً فماذا تنتظرون هل تنتظرون أن يقضى عليكم الحاكم كما فعل فى الحياة الحزبية وبذلك تفقدوا حتى أحترام الشعب لكم لا امل الأن إلا بالثورة والشعب كله معكم وفى إنتظار شرارة البداية على أيديكم يا شرفاء مصر لنطهرها من هذا الفساد المتسرطن"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171729/http://masr.20at.com:80/article.php?sid=274&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "المحتل الاجنبى و المحلى"
author = "عابر القارات"
posted = "2006-05-08"
text = "للاسف المحتل الاجنبى ماكر و طبعا من طول إحتلاله للبلاد شرقا و غربا أخد خبرة كويسة فبدل أن يتبهدل و يقاوم من سكان البلاد الاصليين عمل نفسه إنسحب من البلدان اللى كان محتلها و راح جايب مجموعة محتلين محليين يحكوموا البلد و طلع للسكان الاصليين لسانه فكده ضرب عصفورين بحجر أول عصفور أنه يتقى شر السكان الاصليين و وجع الدماغ و اللى يقول الاستقلال التام و الموت الزوؤام و المقاومة المسلحة فى القناة و العصفور التانى أنه هيعرف يتفاهم مع المحتليين المحليين لأن بنهم مصالح مشتركة يعنى يسيب المحتل المحلى ينهب اللى هوه عاوزه و المحتل المحلى يقوله حاضر تحت أمر معاليك فى أى حاجه يقولها المحتل الاجنبى و للاسف الشديد جدا اللى ضايع فى الحالتين و المفروم من الجهتين هما السكان الاصليين اللى عمرهم ما شموا نفسهم و لا إرتاحوا من سنييييييييين و سنين تحل إحتلال مستمر مع تغيير الوشو من وشوش بيضا من تلج أوروبا لوشوش سودا من عمايلهم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171729/http://masr.20at.com:80/article.php?sid=274&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 11
subject = "اقتراح"
author = "محمد ألمصرى"
posted = "2006-05-09"
text = "رغمأ عن بساطة وعدد مفردات هذة ألاغنية ألا أنها تعبر بوضوح عما داخل نفوسنا جميعا وأن رتمها مصرى سهل ألحفظ وألترديد لذأ أقترح أن تعمم :أغنية فى جميع ألمظاهرات ووقفات نادى ألقضاة فسوف يلتف حولها ويرددها ألشعب بسهولة وفكرة أن أحنا نجرب نشيد واحد يجمع أفكارنا فى كلمات بسيطة ومعبرة وهاتشد ألناس أحنا فعلأ محتاجين أغنية تجمعنا مدامو يمزقون ويدسون علم مصر ألذى يرتفع فى وجوههم ويبقوا بقى يخنقو ألاغنية داخل صدورنا"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171729/http://masr.20at.com:80/article.php?sid=274&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 12
subject = "يارب الزقة تبقى قريب"
author = "مصرية طفحانة الدم"
posted = "2006-05-10"
text = "أولاً الأغنية جميلة فعلا ويارب تتحقق كلماتها قريباًوأتمنى يبقى فيه ردود فعل أكثر من اللى احنا فيه دلوقت ومش مجرد كلمات بتتقال<br />بس ياريت الكلمات كانت تكون \" فاضل على اللى مش حلو \" و ع العموم هاااااااااااااااااااااااااانت حاسة ان الزقة قربت اوىىىىىى"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171729/http://masr.20at.com:80/article.php?sid=274&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 13
subject = "ممكن أشوفكم بكرة تاني ؟؟شكلنا مش حنخلص"
author = "محمد السيد"
posted = "2006-05-10"
text = "ممكن اشوفكم بكرة في الاعتصام ؟؟؟ اعتصام إيه ؟؟ انتو متعرفوش ؟؟<br />بكرةالنظام الجميل بتاعنا ...... قرر إنه يحاكم كل قاضي اتجرأ وقال إن الانتخابات كانت مزورة .... وإن الحكومة لعبت فيها واستخدمت فيها البلطجية ....<br />وكان الرد محاكمة إثنين من أنبل و أشجع القضاة عشان يكونوا عبرة ومثل لباقي القضاة .....<br />بكرة أثناء المحاكمة في اعتصام والدعوة عامة لكل الناس .. لأي حد ييجي وميخفش ... أصل البلد دي زي بلدنا إحنا مش بلدهم ...<br />دعواتكم .......<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171729/http://masr.20at.com:80/article.php?sid=274&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 14
subject = "اه نسيت اقولكم أشوفكم فين ؟؟ المكان يعني ؟؟؟ مش قصدي أنهي ليمان.."
author = "محمد السيد"
posted = "2006-05-10"
text = "المكان ... عند محطة المترو بتاعة جمال عبد الناصر .... أمام نقابة الصحفيين والمحامين .....<br />أنا عن نفسي رايح اللي يحب ييجي معايا ييجي .... أو يقول لحد ييجي ... أو أقل حاجة إنه يتابع اللي بيحصل قي الأخبار بكرة ....<br />ولما أرجع حأحكي لكم إحنا عملنا إيه ...؟؟؟ وهم عملوا معانا إيه ....<br />عشان يخرسوا ... ويسكتوا ... ويسكنوا ... وميجبوش سيرة أي حاجة تاني ...<br />من الآخر عايزينهم يوصلوا للمرحلة اللي كتير من الناس العادية اللي زينا وصلوا لها ....<br />وعشان البلد دي بلدنا إحنا مش بلدهم هما ...<br />عشان دي بلد الطلبة والموظفين والعمال والمهندين والأطباء والصحفيين والمحامين والقضاة .... مش بلد الرؤساء وأولادهم و زوجاتهم \" عشان أكون واضح مش بلد محمد حسني مبارك أو جمال أو سوزان مبارك \" ....<br />كان لازم الناس العادية اللي هي إحنا تقف مع القضاة وترد عنهم الظلم وتحسسهم إنهم مش لوحدهم قدام النظام المستبد ده ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171729/http://masr.20at.com:80/article.php?sid=274&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

