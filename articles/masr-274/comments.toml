subject = "والله لسنا فينا شجعان"
author = "فاطمة محمد"
posted = "2006-05-16"
text = "بصراحة أنا لم أصدق نفسي عندما قرأت هذا التعليق الذي رغم صغره إلا أنه عبر عما بداخلنا،بل وعبر عما يكنه العديد من الشبان الممبوزين وراء القضبان الحقيرة ليس إلا لقولهم كلمة الحق ولكن هيهات فشعبان ولاّد ينتج من الجيل أجيال عديدة.<br />ولا نستطيع أن نقول لكم إلا جزاكم الله خيراً وزاد من أمثالكم"
