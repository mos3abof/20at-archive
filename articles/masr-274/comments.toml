[[comments]]
order = 32
subject = "لا للتمديد..لا للتوريث ...نعم لتعديل الدستور"
author = "أمة الله"
posted = "2006-05-27"
text = "السلام عليكم ورحمة الله وبركاته،<br />يجماعةإحنا عايزين نفتكر دايماً قضية بلدنا أيوة قضية بلدنا الي بيروح ضحيتها الكثير والعديد من المدافعين عنها عارفين ليه؟<br />علشان هما عايزنا نكتم صوتنا داخلنا ولكن والله ده مش هيحصل أبداًً<br />مهما عملوا ومهما أخذوا من شبابنا وأبائنا وإخوتنا وأبنائنا،ولكن مش هنكف عن المطلوب وهنفضل نقول ونصرخ لا للظلم لا للطغيان لا للإستبداد .<br />هنصرخ ونقولها بأعلى صوت نعم صوت ذاق طعم الظلم منذ مهده أصعبٌ عليه الصراخ في وجه الطغيان،<br />حسبنا الله ونعم الوكيل حسبنا الله ونعم الوكيل،حسبنا الله ونعم الوكيل.<br />وفي الختام أرجو منكم الدعاء لجميع المعتقلين داخل السجون الحقيره ونتمنى من الله أن تكون في ميزان حسناتهم ونقول لهم لا بد لليل أن ينجلي ولا بد للنور أن يسطع في سماء الحق .<br />(غرباء وإرتضيناها شعارا لنا)<br />وجزاكم الله خيرا"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171729/http://masr.20at.com:80/article.php?sid=274&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 33
subject = "ربنا ينتقم منك يا عم حمكشة"
author = "ابو كرتونة"
posted = "2006-05-27"
text = "انا كلي غيظ , نفسي انزل في الشارع واصرخ بصوت عالي جدا واقول(ربنا ينتقم منك يا حمكشة ياكبير انت وابنك حمكشة الصغير) يلي ضيعت البلد من خمسة وعشرين سنه لحد دلوقتي وعمال تقول احنا بنصلح, بتصلح ايه يا عم حمكشة, هي خمسة وعشرين سنه مش كفاية ولسه حتصلح ايه,البلد باظت خلاص,انت يا حمكشة تجلس الان علي فهوة بركان غاضب سينفجر في اية لحظة , الشعب غاضب جدا جدا, ومستني اللحظة الي يسترد فيها حقة الضائع, قولي ايه اخبار ال 5و4 مليون فرصة عمل ,ممكن تبعت اسماء الي اشتغلوا من ساعة توليك الرئاسة وتعرضها علي الشعب علشان يصدقق , كفاية كدب ان زهقت منك خالص"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171729/http://masr.20at.com:80/article.php?sid=274&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

