[[comments]]
order = 28
subject = "الراجل ده مكروه قوي كده"
author = "انا"
posted = "2006-05-22"
text = "انا كل يوم باكتشف ان حسني مبارك<br />مكروه قوي قوي قوي من الشعب<br />ياترى ليه ... علشان بوظ لهم البواسير<br />ليهم حق برضوا ..<br />بس هو برضوا ليه حق يلعب في البواسير<br />ما هو شايف ان الناس كلها ساكته ومبسوطة<br />وكل اللي بتعمله كلام في كلام في الهوا وبس<br />وهذا الشبل من ذاك الأسد<br />الحل الوحيد يخرج الشعب المصري كله في الشوارع يسقط النظام<br />والله العظيم ... في خلال ساعتين 3 بس<br />راح يسقط النظام والحكومة فوراً<br />اذا خرج 10 او 20 مليون مصري مطحون<br />في الشارع<br />مش راح ينفع معاهم لا شرطة ولا ولاد الكلاب بتوع الشرطة ولا جيش ولا اي حاجة ...<br />ده الحل الوحيد غير ده مفيش<br />واستحملوا بقى ... وركبوا جلدة للبواسير<br />علشان ابنه جاي وشدوا حيلكم ..."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171729/http://masr.20at.com:80/article.php?sid=274&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

