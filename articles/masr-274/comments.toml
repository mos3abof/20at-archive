text = "1805-1848<br />H.H,Muhammad'Ali Pasha<br />(Mohammad'Ali The Great)<br />Wali Of Egypt<br />1848<br />Field Marshal H,H - Ibrahim Pasha<br />Wali Of Egypt<br />1848-1854<br />H.H 'Abbas Hilmi Pasha,<br />Wali Of Egypt<br />1854-1863<br />Admiral H.H. Muhammed Sa'id Pasha,<br />Wali Of Egyt<br />1863-1879<br />H.H. Ismail Pasha,<br />Khedive Of Egypt, Sovereign Of Nubia, Of The Sudan<br />1879-1892<br />H.H. Muhammad Tawfik Pasha<br />Khedive Of Egypt<br />1892-1914<br />H.H. 'Abbas II Hilmi<br />Khedive Of Egypt<br />1914-1917<br />H.H. Husain Kamal<br />Sultan Of Egypt<br />1917-1936<br />H.M Ahmad Fu'ad<br />Sultan Of Egypt<br />1936-1952<br />H.M Faruk<br />King Of Egypt & Of Sudan<br />1952<br />H.M Ahmad Fu'ad II.<br />King Of Egypt & Of Sudan<br />1952-1953<br />H.E Gen. Mohamed Naguib,<br />President Of Egypt<br />1953-1970<br />H.E. Gen. Gamal Abdel Nasser<br />President Of Egypt<br />1970-1981<br />H.E. Mohamed Anwar El Sadat,<br />President Of Egypt<br />1981-20XX<br />H.M. Mohamed Hosni Moubarak<br />President Of Egypt<br />20XX-20VX<br />H.H. Gamal Moubarak<br />Wali Of Egypt<br />20VX-2VX1<br />H.H. Mohamed Alaa Moubarak<br />Khedive Of Egypt, Sovereign Of Nubia & Sudan"
