[[comments]]
order = 5
subject = "إشترى لعبة بوحه وخد كتكوت هدية"
author = "أبو ساره"
posted = "2006-09-27"
text = "فى ظل تدنى مستوى الذوق عندنا وبعد ظهور سعد الصغير السباك وريكو بتاع الأنابيب وشاندو الفران وعبد الباسط الحلاق وغيرهم من بياعين السمك وتهافت الهايفين عليهم .. أقول ماباليد حيلة ولامانع من ظهور هذه اللعبة بس ياريت الاعلان ينزل ويقولوا عند شرائك هذه اللعبة خد كتكوت مجانا +مصاريف شحن !!! وسلام مربع لكل بلطجية العواء ( الغناء ) والموجه الحالية"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061615/http://masr.20at.com:80/article.php?sid=979"

[[comments]]
order = 6
subject = "الكل عايز الدبح والتعليق"
author = "رياض مهنا"
posted = "2006-09-27"
text = "فعلا الساحة اتملت ببلطجية الغناء والفضل يرجع لشعبان عبد الرحيم المستعبط فيها والحقيقة كل اللى طالعين اليومين دول سواء المتربين او العجلاتية أو شيالين السكك الحديد كلهم عايزين الدبح والتعليق بميدان عام أما موضوع اللعبة دى فنأمل ان لاتكون مملة زى صاحبها اللى مش عايز يغير لا سجنته ولا صوته ولا عبطه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061615/http://masr.20at.com:80/article.php?sid=979"

[[comments]]
order = 7
subject = "جمال البنا والاساءات"
author = "معاذ محمود عامر"
posted = "2006-09-28"
text = "أعتقد يا عشرينات انه كان يجب عليكم من باب الدقة والامانة أن تنشروا آخر مقالين كتبهماالمفكر الاسلامي الأستاذ جمال البنا الأربعاء السابق واربعاء الأمس...<br />فبما أنكم قررتم ان تنشروا مقاله المثير للجدل عن التدخين والصيام, كان يجب أن تكملوا السلسلة المتعلقة بهذا الموضوع...<br />وأعتقد أنه تعرض لكثير من الاهانات على لسان بعض العصبيين أو المتشددين....<br />وأظن أن مقاله الذي كتبه الاربعاء قبل السابق كان جديرا بأن يدفع عنه كثيرا من هذه الاهانات السفيهة التي لا يحكم أصحابها عقولهم قبل أن يطلقوها في وجه رجل جليل ومفكر كبير وصاحب مشروع فكري جيد جدا,<br />وان لم يكن كل ذلك فعلى الأقل هو كبير في السن بدرجة تجعل اهانته من الفحش والسب الذي نهى عنه الرسول صلى الله عليه وسلم,<br />لذا أرجو منكم رجاء حارا جدا جدا أن تنشروا مقالتيه المؤرختين27_9<br />و20_9<br />ولكم الشكر العظيم والاحترام الجم ان فعلتم..."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061615/http://masr.20at.com:80/article.php?sid=979"

