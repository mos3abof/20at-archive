text = "يارتكوم تعملو ا العاب تانيه غير بوحه وتعبر عن مشاكلنا يعنى ممكن تعملوا لعبه فيها مواطن مصرى مطحون وطالع عينه بيحارب الفساد اللى فى الحكم ويقضى على اعداء الشعب اللى واكلينها والعه وماصين دمنا على الاقل الواحد يطلع الكبت اللى عاملينه لنا ودماغنا ما تضربش"
