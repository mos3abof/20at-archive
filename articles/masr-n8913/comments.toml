[[comments]]
order = 2
subject = "الى فخامة الرئيس مبارك"
author = "مطلوب فوري"
posted = "2006-09-25"
text = "الدفاع عن حقوق الإنسان حول العالم<br />Egypt<br />مصر<br />28 اغسطس 2003<br />فخامة الرئيس حسني مبارك<br />رئيس جمهورية مصر العربية<br />قصر عابدين<br />القاهرة<br />جمهورية مصر العربية<br />فخامة الرئيس<br />تكتب منظمة هيومن رايتس ووتش إلى فخامتكم للإعراب عن قلقها الشديد بشأن استمرار سجن المهندس أشرف إبراهيم، الناشط المعارض للحرب على العراق، وبشأن قرار السيد/ أسامه عبد المنعم علي، القائم بأعمال المحامي العام لنيابة أمن الدولة العليا الصادر بتاريخ السابع من أغسطس/آب 2003، بإحالة قضيته إلى محكمة أمن الدولة العليا طوارئ؛ إذ نخشى أن يكون أشرف إبراهيم، وأربعة آخرون متهمون معه في هذه القضية ولكن لم يحتجزوا بعد، يتعرضون للاضطهاد بسبب محاولتهم ممارسة حقوقهم الأساسية في حرية التعبير عن الرأي، وتكوين الجمعيات أو الانضمام إليها، وتلقي المعلومات وتبادلها حول الدفاع عن حقوق الإنسان وحرياته. ومما يثير انزعاجنا بنوع خاص أن هؤلاء المتهمين الخمسة سيخضعون للمحاكمة على نحو يخرق المعايير المعترف بها دوليا للإجراءات القضائية العادلة.<br />ومن ثم فإننا ندعو فخامتكم إلى اتخاذ خطوات فورية ضمانا لإطلاق سراح أشرف إبراهيم بدون إبطاء، وإسقاط التهم الموجهة إليه وإلى المتهمين الأربعة الآخرين. كما نحث حكومتكم على إلغاء أو تعديل بعض مواد قانون العقوبات المصري، وخصوصا المادة 80 (د) والمادة 86 مكرر للتوفيق بين القوانين المصرية والالتزامات الدولية الواقعة على عاتق مصر فيما يتعلق بحقوق الإنسان. وأخيرا ندعو فخامتكم إلى العمل على إلغاء قانون الطوارئ المصري ونظام محاكم أمن الدولة طوارئ المصاحب له.<br />إن قرار النائب العام بإحالة هؤلاء المتهمين إلى إحدى محاكم أمن الدولة العليا طوارئ لا يمكن اعتباره سوى تأكيد على أن حكومت<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061615/http://masr.20at.com:80/article.php?sid=979"

