subject = "كل الحب للحسن وليس للجمال"
author = "سيف الدين سلامه"
posted = "2006-09-28"
text = "كل الحب للشهيد حسن البنا أما اخوه جمال البنا فكنت أود ان لا نسمع عن أحد بهذا الاسم فهو صراحتا نكته وبيضحك أكثرمن شعبان عبد الرحيم وخاصة لما بيتكلم فى الدين وبيأيد فتاوى المعتوه حسن الترابى ولكن لا يضير حسن البنا الشهيد مايتلفظة اخوه إبن أمه وابوه ولكن هكذا الاعلام ينشر الكفر والإلحاد حتى وان كانت لأسماء مسلمة"
