subject = "فعلا"
author = "محسن"
posted = "2006-06-07"
text = "فعلا عين الامن تسهر علي حماية الوطن ويولع الشعب اللي لاعايز يفهم ولا راضى يتحرك<br />قوم يا مصري<br />قوم الله يحرقك"
