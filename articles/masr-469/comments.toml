[[comments]]
order = 1
subject = "يا كدابين"
author = "شويه العيال اللى مارسوا فيهم اقسى صنوف العذاب كانوا مجرد ضحاياالنظام اللى استغل اعتقالهم قبل حادث دهب بشهورعلشان يمثل دور حامى الحمى و يغطى على خيبته القويه فى منع الارهاب الى هو فى الاصل سبب فيه"
posted = "2006-06-08"
text = "دول قالوا عن العيال دى انهم كانوا حيغتالوا كل ولاد الكلب فى مصر وده تنفيذه مستحيل دول خمس عيال مش لاقيين ياكلوا حيراقبو ويتسلحوا ويغتالوا و يفجرواازاى يا ناس ؟؟؟؟؟<br />ايه العبط دة<br />و متنسوش ان ده كان من ضمن التمهيد لمد قانون الزفت الطوارىء<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأأأأه يــــــأ بــــــــلـــــــدى"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112846/http://masr.20at.com:80/article.php?sid=469&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "إديني عقلك"
author = "الغريب إن النظم حاجه من إنتين"
posted = "2006-06-08"
text = "أولاَ : في حاله لو الفاس وقعت فالراس وحصل مصيبه يقول مختل ومجنون وسفيه زي أحداث إسكندية إياها ومنسمعش حس الغلابة إللي راحو فالرجلين..<br />ثانيا: البمه انا نفسي حد يبص في صوره الغلابه دول (10 ثواني بس)!! دول شكلهم حيلتهم شغل؟ حيلتهم حتى ياكلو والله الضعف والإذلال باين في عنيهم,ويقلك نيه للإغتيال!! والأحداث كلها حصلت وهم مشرفين فأمن الدوله بياخدو الواجب<br />يا رب إصلح حال مصر وحال شبابها<br />آآآآآآآآآآآآآآآآآآآآآآآه يا بلدي"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112846/http://masr.20at.com:80/article.php?sid=469&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
