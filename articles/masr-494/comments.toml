[[comments]]
order = 11
subject = "صحيفة ذئاب يوسف وأخواتها"
author = "ابن النيل"
posted = "2006-06-11"
text = "لا حول ولا قوة الابالله<br />ملأ الوطن بدجالي االكلمة والمنتفعين المتربحين من دماء الشعب المقهور الراضي بالزلة و البهدله .هولاء هم رجال النظام وسفاحية، الذين أخذوا من الكلمة وسيلة تربحهم ومقصلة في أيدي النظام ، والحمد لله هم معروفون عند الناس وفي بيئته الصحفية و الاعلامية بأنهم كلاب النظام ومريديه الذي باعوا رجولتهم وكرامةوطنهم بثمن بخس فبئس ما يفعلون ، وللاسف كل يوم هم في زيادة بعد أن صار طريقهم الوضيع هو أسهل الطرق للوصول الى الفمة ولكنها قمة مزيفة فالصاعد نازل ضيق صدرة في الدنيا وهو في الاخرة من الخاسرين ومن هولاء المتنطعين و المحزلقين على الباطل عمرو عبد السميع وكل ضيوف برنامجة المشبوة ووصحيفة ذئاب يوسف كرم جبر وكمال عبدالله وغيرهم كالشبهفي نهضة مصر وصلاح عيسى وغيرهم الكثير و الكثير في الاهرام والاخبار والجمهوريه وومجلة المصور وغيرها."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025326/http://masr.20at.com:80/article.php?sid=494"

[[comments]]
order = 12
subject = "أخر شطحات كرملله"
author = "2arfan"
posted = "2006-06-11"
text = "اغتصاب بورقة كرتون<br />بقلم : كرم جبر<br />لا أتصور أنه فى مقدور «محمد شرقاوى» أن يثبت أنه تعرض للاغتصاب بوضع ورقة كرتون فى مؤخرته فى قسم شرطة قصر النيل.. ولا يستطيع أيضا أن يثبت أن أحد الضباط قام بتدليك خصيته اليسرى باستمتاع وتركه يصرخ لمدة ثلاث دقائق، ولا أتصور أيضا أنه تم سحله فى الشوارع والعمارات وقسم الشرطة بالطريقة الوحشية التى تحدث عنها!<br />بداية.. أعتذر للقراء عن كتابتى لهذا المقال وعن استخدامى الكلمات القبيحة السابقة، ولكنه الأسلوب الذى كتب به «شرقاوى» حكايته وتناقلتها وكالات الأنباء وجمعيات حقوق الإنسان.. واتصلت بى إذاعة لندن على الهواء لتسمع تعليقى ورأيى فى هذا الشأن.......<br />\"ده كلام؟؟ حاسس انه بيكتب محضر في القسم\""
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025326/http://masr.20at.com:80/article.php?sid=494"

