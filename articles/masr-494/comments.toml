subject = "انقذوا روزا"
author = "متابع"
posted = "2006-06-10"
text = "اولا لازم تقرأوا تفسير عبدالله كمال لاستقبال الرئيس للصهيوني اولمرت بعد مصرع الجنود ..عشان تدركوا حجم الوضاعة الحقيقي .<br />كمان وفي نفس العدد - امبارح السبت- مقال كرم جبر اللى بيتريق فيه على تعذيب محمد الشرقاوي وبينكر التعذيب اللى حصل له بالادلة والبراهين .<br />بتاع الجرايد اللى جنب المؤسسة بيقول أنه التوزيع زايد عنده لان المحررين بيشتروا النسخ لانهم مش بياخدوا نسخ ببلاش<br />بتاع الجرايد بيسمي الجرنال \"مايو اليوسف\"<br />وبيبقى محرج جدا لما يجي له كمولة يقول له التوزيع عامل ايه .. لكن الموقف بيختلف لما يجي وائل الإبراشئ يسأل ع توزيع صوت الامة .<br />مشكلة روزا الان انهم مش لاقيين حد جديد يشتموه .<br />روزا اليوسف وممتاز القط بيدلوا ع حجم الانحطاط اللى وصل له النظام اللى ترك ناس زي دول يمثلوا، حتى النظام واقع ف المدافعين عنه، وكأن مفيش موسى صبري جديد في مصر .<br />هل الحل اننا ننسى ان الجرنال دة يطلع<br />عشان يتحول ل مايو بجد<br />ولا محرري روزا المحترمين يحتلوا الجرنال بالقوة ويمنعوا صدروه وينقذوا روزا اليوسف من ولاد ال....... دول"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025326/http://masr.20at.com:80/article.php?sid=494"

