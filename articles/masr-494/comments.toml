[[comments]]
order = 14
subject = "هبوا لا أبا لكم وذوذوا عن شرفكم"
author = "سمسم"
posted = "2006-06-11"
text = "لا إله إلا الله ولاحول ولاقوة إلا بالله العلي العظيم!<br />لم يكتف إبن العاهرة اللامبارك وزبانيته بهتك أعراض الإنات وعلنا في شوارع المحروسة، بل تعداه للذكور، إقتداءا بقومه أهل سدوم وعمورية!<br />كيف لايفعل وقد وطأ للأمر بتعين وزير إعلام لوطي هو فاروق حسني، الذي يبشرنا بتقنين وترخيص دور البغاء، لأن هذا ما سيجعلنا نلحق بالأمم المتقدمة، أي والله هذا ما يعتقده المأبون! قبله بهر توفيق الحكيم- وإنظروا تفاهة رواد فكرنا- بالزواج الثلاثي بالغرب، زوج وزوجة وعشيق يعيشون تحت سقف واحد، وكان يترنم بمحاسن ومزايا تلك العلاقة بمجالسه الخاصة وقيل لي من شهود ثقات على صفحات صحف المقبور الساداتي وبالإذاعة.<br />أنشدكم الله بعد ما حدث، أيلوم أحد شرقاوي هذا إن فقد عقله وطفق يطلق النار على كل ذي روح في هذا البلد التعيس بحكامه؟ لا وأيم الحق لا ألومه إن وضع يده بيد كل من مكر بمصر من أعدائها ولو كانوا من اليهود.<br />ما تنتظرون أيها السادة؟ أن يلحق بكم أيضا شرف السحل والإغتصاب لتحسوا وتتحركوا؟ إنها والله مواجهة واحدة تقتحمون فيها مركزا من مراكز الإجرام هذة، وتحررون مسجونيكم وتعلقون جلاديهم على أعمدة النور بعد إنزال ما يستحقون من العذاب بهم، حتى لاتعرض لكم تلك الأعاجم أبدا.<br />والله ما إستأسدوا عليكم إلا بعدما تنعجتم أنتم!"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025326/http://masr.20at.com:80/article.php?sid=494"

[[comments]]
order = 15
subject = "masr 2020"
author = "mohamed hassan ghonem"
posted = "2006-06-11"
text = "اخبار سنه 2075<br />اخبار مصر<br />· تعلن كل من الجماعات المتحاربه على الاكل والشرب من اخوان ووطنى وتجمع واقباط واحرار ووفد على التوحد لاول مرة لمصلحه الشعب وذلك من نتائج المؤتمر الاخير الذى اقام فى اقليم الدلتا<br />· قام الامير احمد هيثم جمال محمد حسنى مبارك باصدار قرار رقم 512/2075 م بمد قانون الطوارئ لمدة سنتين فقط حتى يتسنى للحكومه بتعديل قانون اخر للطوارئ.<br />· امرت الراقصه هند بنت الراقصه احلام بنت الراقصه فيفى عبده الحكومه بالتخلى عن منتجع شرم الشيخ لصالح ابنتها الراقصه العالميه شوشو والا ستقوم بسحب الدعم من الحكومه فى مجلس الاقاليم المصريه .وسحب اموالها من البنك الحكومى المصرى بسويسرا .<br />· قام بعض الاغبياء من الاسكندريه من خريجى كليه الطب والهندسه والعلوم والتربيه بالتظاهر امام قصر راس التين للمطالبه بحل مشاكلهم مع القوى العامله التى استمرت 50سنه حتى الان بدون حل .<br />· تندد حكومه الاقاليم المصريه بالوضع فى العراق نتيجه وصول 40 الف جثه فى شكاير على متن الطائره الامريكيه توتو الى مطار مبارك الدولى بعد مجزره الاكراد الاخيره للمصرين التى حدثت سنه2073م ووصل على اثرها 16 الف جثه بما فيها رؤس الهيئه الدبلوماسيه بدون اجساد ؟<br />· من النشره الاقتصاديه : دولار امريكى = 132.16 جنيه مصرى . سعر ربع كيلو اللحم = 152 جنيه مصرى .<br />سعر معلقه السكر = 3.50 جنيه مصرى .<br />سعر السيجاره الواحده فى البورصه = 13 جنيه .<br />اقرأ بقية التعليق .."
archived = "2006-06-13"
