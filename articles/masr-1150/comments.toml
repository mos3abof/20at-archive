[[comments]]
order = 20
subject = "شدى حيلك يابلد أتهتك عرض الولد"
author = "كائن فى شكل أنسان"
posted = "2006-11-22"
text = "أنتم فاكرين أن ربنا هاينصرناواحنا قاعدين ندعى عليهم أبقوا قابلونى أحنا هانفضل كده الحكومة ( تغتصبناأو بالبلدى ت000) وننجحها فى الانتخابات ونجدد العهد للملك وابنه وساكتين بس ده طبيعة المصريين غلابة طول عمره مللك لمن يحكمه بدليل كل الرسل والانبياء أرسلوا الى أقوامهم عدا موسى أرسل الى فرعون لان لو أمن فرعون لامن أهل مصر . كفاية يامصريين هى موته واحدة بس تكون بكرامة بكرامة على فكرة أنا مش أرهابى بس مصرى شايف مصريين ورجالة بيغتصبوا ويهتك عرضهم فدمى بيغلى"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095557/http://masr.20at.com:80/article.php?sid=1150"

