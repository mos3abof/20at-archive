subject = "احنا كلاب لهيك درجه؟"
author = "هند دره"
posted = "2006-11-12"
text = "انا قراءت مدونه وائل عباس الصبح..ومن وقتها وانا شايفه الدنيا كاروهات..شو الصح ..اممممممم<br />كيف كيف هيك يحصل..خلاص الشعب كلاب لهيك درجه..هيك صرنا بنتعامل<br />؟؟<br />واحنا ساكتانين..لحتى يجي علينا دور..انا بصراحه شايفه ان فيديو متل هيك لازم يتنشر..لأنه ماممكن شي راح يأثر فينا متل لو شفناه..<br />لكن شي سؤال حسه كتير داخلي..مين اللي صور..يعني اللي صور كان موجود وقت ما هيك حصل......!!"
