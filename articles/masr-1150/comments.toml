[[comments]]
order = 5
subject = "البقاء لله"
author = "عنتر مش لاقى سيفه"
posted = "2006-11-13"
text = "السلام علي من اتبع الهدي<br />انا لله و انا الي راجعون..<br />في حادث اليم و مأسوي..لا يعد الاول و لا الاخر.. انتقل الي رحمة الله تعالي الضمير المصري عن عمر يناهز سبعة الاف سنة..بعد حياة طويلة من الشرف و الكفاح و النضال كان خلالها الضمير المصري نموذجا يحتذي به و يضرب به المثل علي مستوي ضمائر العالم اجمعين.<br />كان ضميرا حيا يقظا .. تصدي لكل ما هو قبيح و شاذ..قاوم كل ما هو معتدي و جبار.. ناصر كل من هو مظلوم و ضعيف.<br />كان ضميرا ناصع البياض , لا تشوبه شائبة, لا طالما بحثت و استفسرت كل ضمائر العالم عن سبب صفوه و نقاؤه..و ان كانت بعض هذه الضمائر قررت قتله و محوه من التاريخ.<br />انقل لكم خبر وفاة الضمير المصري و كلي الم و حزن علي هذا الفراق الذي طال كل جوانب الحياة..فقد فارقنا الضمير المصري فى العمل و في الشارع, في الجامعة و في البيت, حتي الاماكن التي كان من المفترض ان تكون المأوي الاخير له, وهي دار القضاء و اقسام الشرطة..فقد اكتشفت انها الاماكن التي فارقها اولا.<br />و مع هذا الوداع الاليم..انقل اليكم خبر ميلاد الضمير العصري الجديد..الذي لا يعرف حق و لا باطل..الذي لا يعرف ابيه من اخيه.. ولا يفرق بين حلال و حرام..ضمير له هدف واحد فقط.. ان يتقارب من السلطة و الجاة و النفوذ..له غرض واحد فقط..طحن المواطن المصري الضعيف..له عدة سمات جديدة..العنف و القسوة و الشدة و عدم الرحمة..الكذب و النفاق و الجهل و السرقة...ضمير ولد من رحم الحرام و يعيش بالحرام و يأكل بالحرام و يتلذذ بالحرام.<br />يا ايها الشعب المصري..ليس لكم في هذا الزمان بعد الله سبحانه و تعالي الا انفسكم..لا تنتظروا العون و الخلاص و الفرج من احد..بقاؤنا علي ما نحن عليه هو الغذاء الامثل و المتنفس الوحيد لهذا الضمير الجديد حتي ينتشر و يترعرع و يكبر<br />اقرأ بقية التعليق .."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118123716/http://masr.20at.com:80/article.php?sid=1150"

