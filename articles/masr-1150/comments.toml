[[comments]]
order = 3
subject = "الى كل من يكره الحكومه المصريه"
author = "مصرى ازهرى"
posted = "2006-11-12"
text = "سبحان الله اتعلمون سبب الذل الذى انتم هو بعدكم عن منهج الحق تقولون الحكومه تحارب وتعتقل اقول هذا جزاء من خذل جندا من جنود تفتكرون يا ابناء بلادى حركه الجهاد الاسلامى بقياده الدكتور ايمن الظواهرى الذين تقاعستم عن نصرتها لكى تقيم الخلافه فى ارضنا ومع ذلك صدقتم الحكومه التى تحارب الاسلام وتوالى الكفار من اليهود ووصمتوها بالاهارب انتظروا يااهل بلدى فالذل القادم انكى وامر وانتظروا ياباانتاء العرب فحكامكم لايهمم الا كراسيهم اما شعوبهم فى ستين داهيه ان الله سبحانه وتعالى اذا اراد عقاب بشر اخذ الصالح بالطالح لان الصالح لا يامر بالطالح رغم انى ازهرى فاه يا ازهر ايه على منارتك الضائعه بفعل شيخ الازعر الذى باع دينه بدنياه انتظروا ذلا شاملا وفقرا عارما بسبب بعدكم عن المنهج القويم اللهم يارب الكون انقذ شعوب الاسلام واهلك الطغاه فى كل مكان واستبدلهم بالخلافه الاسلاميه التى يسعى اليها المجاهدون فى العراق وفغانستان اهل السنه والجماعه"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118123716/http://masr.20at.com:80/article.php?sid=1150"

