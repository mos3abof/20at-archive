text = "وانا صايم النهارده علشان خاطر الاثنين عندنا في الدين بتاعنا من السنه ان الواحد يصوم اثنين وخميس.<br />والموضوع دا يا ماما فيه اهانة للشعب المصري بصي في الصورة كويس انا شخصيا شعرت بالاهانه.<br />اتفوووووووووووووا على دي وزارة وسخه وعلى اللي شغالين فيها"
