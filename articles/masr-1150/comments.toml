[[comments]]
order = 22
subject = "الله يجحمك يا باشا"
author = "مصراوى"
posted = "2006-11-25"
text = "الله يجحم الباشا الكبير هو السبب فى كل اللى بيحصل للناس الغلابة فى البلد اللى أبتلاه ربنا بيهم, فليفرح الحزب الوثنى بما جناه و معهم كل الأفاقين من الحكومة, للأحزاب, لصحف الحكومة لمجلس الطراطير (الشعب), للمحافظين . الكل باطل و بطال.<br />أما أحنا الشعب نستاهل اللى يجرى لنا كله ساكت و يقول مدام بعيد عن ط..... خلاص, و اللى بيتكلم فى الطراوة, شعب كله جبان , هيتعمل فيه أيه أكتر من كده , خايفين من أيه عندكم أيه تخسروه"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095557/http://masr.20at.com:80/article.php?sid=1150"

