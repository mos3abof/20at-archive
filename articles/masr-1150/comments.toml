text = "كالعاده الموضوع اكثر من رائع بس الله يسامحك يا براء<br />جددت الاحزان<br />بس تعرف خليتنا نعيط و بكده اثبتنا لنفسنا اننا مش حيوانات<br />بس مين يثبت دا لكلاب الداخليه<br />مش هنقدر نقول الامليون مره حسبنا الله و نعم الوكيلفيهم من اول حبيب العادلى لاصغر عسكرى من عساكر الامن المركزى"
