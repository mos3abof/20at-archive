text = "لكن ما اود او اقوله انكم شوية خونه وعملاء للامن وموقع ولاد البلد هذا ما هو الا وعاء لجمع المعلومات ويتبع الامن المصري وهذا الموضوع الحقير اللي انت عامله هذا ممكن تقولي ايه لزمته<br />لزمته هو اهانة الشعب المصري وتخويفه وازلاله وتحقيره.<br />اتفوووووووووووووووووووا عليك وعلى اللي مشغلنكم يا شوية زباله<br />اتفوووووووووووووووووووا عليك وعلى اللي مشغلنكم يا شوية زباله<br />اتفوووووووووووووووووووا عليك وعلى اللي مشغلنكم يا شوية زباله"
