author = "ياماما بصي لارشيف الموقع وشوفي كام موضوع عن حسني مبارك وجمال مبارك وشوفي الشتيمه اللي في التعليقات مع ان كل المحررين اللي كاتبين الموضوع مصريين وجوا البلد وانا عارفهم واحد واحد يبقى تقدري تقوليلي دا بيسموه ايه."
