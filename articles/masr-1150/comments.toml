[[comments]]
order = 15
subject = "لى مقهى العزوبية.. يتحدثون!"
author = "2006/03/09"
posted = "2006-11-13"
text = "**البراء أشرف<br />عازب منذ البداية وحتى النهاية<br />\"هو يريد الزواج ليجد من تغسل له ملابسه ويوفر الجنيهات المائة التي ينفقها شهريا في الدراي كلين، أما أنا فأحتاج لها لأسباب مختلفة تماما، الغسالة الأوتوماتك تقوم بدورها في الغسيل، لكن من يحل لي أزمة المكواة كل صباح، خاصة أنه لا يوجد محل للمكواة قريب من منزلي...\"<br />الفقرة السابقة من حوار بين أصدقائي العزاب على المقهى، حوار لم ينته بعد، لكنه بدأ مع اللحظة التي أبلغتهم فيها بنيتي ترك صفوف العزاب وتفكيري الجدي في الارتباط ومن ثم الزواج.<br />فكرت أن الفرصة قد تكون مناسبة لكتابة مذكراتي عن العزوبية وأيامها، خاصة أن الحوار أنعش في رأسي ذكريات لا حصر لها، قد تكون السطور القادمة جزءا منها.<br />عازب = عذاب<br />\"عازب\".. لا أعرف للكلمة معنى، لكني أخمن أن هناك رابطا بينها وبين \"العذاب\"، فالفارق ليس كبيرا بين الـ\"ز\" والـ\"ذ\"، والفارق ليس كبيرا أيضا بين حال العازب وحال المتعذب، كلاهما يتمنى أن يمر الوقت سريعا لتنتهي مشكلته.<br />في حالتي اجتمعت العزوبية مع العذاب، فقد كان قدري أن أنتقل للعيش في محافظة أخرى غير محافظتي للدراسة، وهناك عرفت قيمة أمي الطيبة، وفهمت الفارق بين أكلها ذي الملح الزائد وبين ملح المطاعم ذي الأكل القليل.<br />مرت سنوات الدراسة بسرعة، لأنتقل بعدها إلى دولة أخرى للعمل هناك في تخصصي، وهو ما زاد في أزمتي، فلا أمل عندي في الرجوع قريبا للبيت، ولا أمل هناك في الزواج من البلد الذي أعيش فيه، ولا أمل لدي أيضا في أن تكفي إجازتي السنوية القصيرة في التعرف على عروس والزواج منها، خاصة أن تقاليد بلدي لا تميل لأن يأخذ الزوج زوجته ويسافر في الشهور الأولى للزواج.<br />السطور السابقة هي حكاية عبد المنعم، صديق المقهى، وهي<br />اقرأ بقية التعليق .."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118123716/http://masr.20at.com:80/article.php?sid=1150"

[[comments]]
order = 16
subject = "الى صاحب تعليق البراء اشرف"
author = "نيفين نيفى نوفا"
posted = "2006-11-16"
text = "مش هقوللك ان البراء اشرف برىء من اتهامك<br />و ل هقوللك ان كل اللى بيكتبو ف عشرينات ناس فعلا موهوبين<br />زى البراء و دعاء الشامى و عجم و الطحاوى و الدرينى و روضه و فعلا مش عايزه انسى حد<br />و مش هقوللك ان الصحافه عقل حتى لو مليون محرر ف اوضه<br />و مش هقوللك ان صحفيين كبار ادام الناس و صغيريين ادام نفسهم قاعدين ف اوض فخمه بس قلمهم زباله<br />انا هقوللك بص لاصحاب المدونات بيحصلهم ايه<br />بص للشرقاوى وو ائل عباس و اللى زيهم<br />و هنروح بعيد ليه ما كتير البراء و غيره على الموقع بيكتبو و بنعلق نقولهم خدو بالكو لبكره الصبح منلاقيكوش<br />و هنروح ابعد ليه انا واو انت او اى حد ممكن بكره يكون ف مكان ابعد من الشمس<br />فكر شويه لو سمحت"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118123716/http://masr.20at.com:80/article.php?sid=1150"

[[comments]]
order = 17
subject = "حاجة مش جديدة"
author = "ابومكرم"
posted = "2006-11-17"
text = "انا شفت فيلم على الموبيل عبارة عن ظابط لابس ميرى وفى قسم شرطة امام التخشيبة وواقف امامة شاب فى العشرينيات من عمرة ويقوم الظابط الذى يدعوة اصدقاءة بمصطفى بضرب هذا الشاب مش اقل من 20 قلم على وجهة والمدهش ان ذلك يحدث فى وجود شلة من الظباط المحترمين وهم يتخيلون انهم يصورون فيلم سينمائى ويضحكون ويسخرون ييف والكذب<br />المجلجل هن آيات النجاح<br />فلتذكروني في الدموع<br />فلتذكروني حين يستقوي الوضيع<br />فلتذكروني حين تغشى الدين صيحات<br />البطون<br />وإذا تحكم فاسقوكم في مصير المؤمنين<br />وإذا اختفى صدح البلابل في حياتكم<br />ليرتفع النباح<br />وإذا طغى قرع الكنوس على النواح<br />وتجلج الحق الصراح<br />فلتذكروني<br />وإذا النفير الرائع الضراف أطلق في<br />في المراعي الخضر صيحات العداء<br />وإذا اختفى نغم الإخاء<br />وإذا شكا الفقراء واكتظت جيوب<br />الأغنياء<br />فلتذكروني<br />فلتذكروني عندما يفتي الجهول<br />وحين يستخزي العليم<br />وعندما يستحلي الذليل<br />وإذا تبقى فوق مائدة إمرء ما لا يريد<br />من الطعام<br />وإذا اللسان أذاع ما يأبى الضمير من<br />الكلام<br />فلتذكروني<br />فلتذكروني إن رأيتم حاكميكم يكذبون<br />ويغدرون ويفتك<br />اقرأ بقية التعليق .."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118123716/http://masr.20at.com:80/article.php?sid=1150"

