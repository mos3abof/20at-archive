author = "سامح محمود من مصر"
posted = "2006-11-09"
text = "اخى صالح اهذا هو عدل لماذا تلوم المصريين وقد كان ابن العرب هذا يتعالى على المصريين والغريب يا اخى الكريم ان القطرى المدعى عبد الرحمن سب الملك السعوديه حفظه الله ولقد رد عليه شخص مصرى عامى فى الكلام الذى يقول مصرى واقول الحق وستم القطرى ثم اتيت انت وتلوم المصريين يا اخى نعلم ان فى كل بلد الحقير والشريف فلا يا اخى تكره اهل مصر فهم يحبونكم فاذا وجدت موقف يسئ لاهل مصر من مصرى جاهل فهذا لايعنى ان كل اهل مصر جهله فيا اخى الكريم الايام دول فكانت مصر من اغنى البلاد سابقا والتاريخ شاهد على ذلك واليوم هى فقيره وكانت بلادكم الكريمه فقيره واليوم غنيه فماذا التفريق يا اخى الييس لغتنا واحده واسلامنا واحد وعلى العموم مصر بلدك يا اخى هذه رسالتى اليك والى اهل السعوديين الكرام يعلم الله اننا نحبكم"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

