subject = "طيب"
author = "عبدالله مفتاح"
posted = "2006-08-27"
text = "تمام كده يا محمد انا عايزك متزعلش خالص<br />حقك عليا<br />لما تدافع عن كتابتك دافع بفكر مش بتجريح ولو غلطت اعترف بغلطك<br />اكتب اللي انت عايزة اهم حاجه محدش ينتقد (اقلك نصيحه لو مش بتقبل النقد متكتبش )<br />انا يا سيدي مش هعلق على اي حاجه ليك تاني<br />لاني محبش حد يتطاول عليا<br />وبردو مش هرد"
