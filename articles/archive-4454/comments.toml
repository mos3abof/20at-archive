text = "انا لاادري لماذا كل هذه العنصريه التي يتحدث بها هذا المقال فهو يتحدث عن العرب وكانهم اعدائنا وكانهم صهاينه وكاننا كمصريين لسنا عرباوكانه لايجمعنا تاريخ واحد وثقافه واحده بل ومصير واحد اننا لاننكر انه قد يكون هناك بعض الخلافات سواء بين الحكام او بين الشعوب ولاسف يتحدث كل منابالاساءه لبعضنا البعض كفانا هذه النعره العربيه والتفاخر بالاصل والجنسيه ...اتحدوا يا عرب وانتبهوا..العدو يتربص بنا جميعا..!!!!"
