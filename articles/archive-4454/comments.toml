posted = "2006-09-28"
text = "ولا يهمك يامصرى ومتزعلش الا منى أنا بس ولكن للعلم الجماعة الكوايته والساعوديين دائما بينظروا لينا بإزدراء إبتداءا من عامل البناء حتى أعلى المراكز وبيفضلوا عبده البقر وبوذا علينا وعموما مرحبا بهم وياهلا و100 هلا فيهم وحياهم الله ودنانيرهم وريالاتهم بأى مكان بأرض من المحروسة بس بطريقة ومنظومة (أ.ب ) يعنى أقعد بأدبك"
