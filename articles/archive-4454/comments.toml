[[comments]]
order = 93
subject = "مووووتول قهر"
author = "عمتكم"
posted = "2006-10-01"
text = "هههههههههههههههههههههههههههههههههه مساكين بجد موتوا قهر<br />مالحد منه الله اللي عزنا<br />اي مكان نحتله بفلوووووسنا ما اخذنا من احد شي<br />واحمدوا ربكم نرفع اقتصادكم ونوكلكم عيش<br />يااااااااااااااااااي ليه الحقد هذا<br />انتوا لو عندكم فلوس عملتوا اشد من كذه<br />وامسكوا بناتكم عن الدعاره<br />وشبابكم عن التسويق لبناتكم<br />والشاب الخليجي ارقى من انه يفكر بمصريه<br />والدليل ان المصريات صاروا يلبسون عبايات علشان يبص لها لها الخليجي<br />بس تمووووووووت ماتحصله<br />الخليجي المنحط جدا جدا جدا هو اللي يطالع بناتكم<br />صدق عالم شحاته وتتشرط"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
