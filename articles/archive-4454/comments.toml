order = 102
subject = "كنت اتمنى"
author = "رضا البرعى"
posted = "2006-10-09"
text = "كنت اتمنى ان يكون معظم الخليجيين مثل هذه الفتاه السعوديه فتعليقها على الموضوع عاقل اما انا بحب كل العرب بس لازم الخليجيين يعترفوا اناالمصريين هما اللى علموهم كل حاجه الهندسه والطب والمعمار يعنى احنا اللى بنينا الخليج ولو مش دى الحقيقه طيب ازاى البلد اتبنت والشباب الخليجى نايم ولا وهما بيسابقوا بعض بالعربيات ولا اي ه الكلام"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 103
subject = "لاالة الا الله محمد رسول الله"
author = "محمد عبدالله الدخيل"
posted = "2006-10-09"
text = "كيف تقول العرب الست عربيا ان كان هذا رايك فانت حر ولاكن ليس رائ مصر و المصرين فالعرب هم اهل بلد مثلك وجعلناكم امة واحدة الحرية ايها ان تحترم حرية الاخرين وانهم شاركونا فى ازماتنا حرب اكتوبر وان كان القليل فاسد الفكر و العقيد فلاتعممايها الاخ و اتقى الله hardlovel@yahoo.com"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 104
subject = "الفقر ده ليه حكمه الهيه"
author = "رضا البرعى"
posted = "2006-10-09"
text = "الى كل مصرى بيحب مصر لازم تعرف ان اللى مصر فيه دلوقتى اختبار من رب العالمين وان لو مصر شعبها عاش فى الغنى الفاحش ده يبقى بعد كده ازاى يكون شباب وجنود مصر هم خير اجناد الارض كما قال سيدنا محمد صلى الله عليه وسلم ولا انتوا ايه رئيكم المصرى لازم يكون ناشف راجل يعنى مش خرع وطرى زى غيرو وموضوع الذكاء ما تردش عليهم دى حاجه شهدت بيها دراسلت واحصائيات عالميه وقالت ان الطفل المصرى اذكى طفل فى العالم ودى حاجه انا مش مالفها ومن ناحيه الطب ده موضووووووووووووووووووع تانى خالص واقدر اقول ليكم بحكم انى من مدينه المنصورة قلعة الطب فى مصر ان الخليجيين الى بيتعالجوا فى مستشفيات المنصورة وجامعتها اكتر من المصريين وده واقع ملموس ويشهد على كده الدكتور غنيم اكبر دكتور فى الكلى مؤسس مركز غنيم للكلى بالسعوديه وده اللى عملتوا المنصورة امال مصر كلها عملت للخليج ايه وما خفى كان اعظم فى النهاي مصرى بيحب مصر وكل العرب اللى شاكرين الجميل"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

