[[comments]]
order = 167
subject = "الي المصري الاصيل"
author = "ابن العرب"
posted = "2006-11-06"
text = "قناة السويس ههههههه انت تعرف كم تدخل قناة السويس سنو يان لا يتجاوز نصف مليار دولار فقط واي غاز او بترول تتكلم عنهى ؟ في قطر فقط يوجد اكبر احتياط من الغاز في العالم والسعودية فقط من غير باقي دول الخليج يوجد بها اكبر احتياط من النفط وانت تعرف دخل قطر او امارات او كويت او سعودية الواحدة منهم فقط دخلهم اعلا من دخل مصر بعدد سكانهم القليل وروح شوف من اعلا دخل فرد في العالم وهي من اي دول الخليج وبعدين اتكلم احنا ننعش اقتصدكم كل فنادقكم ومجمعات التجارية من الخليج وسياح الخليج يصرفو مش مثل المصريين ينهبو بس من الخليج لو لا خليج كانت مصر في الحظيظ بلاد العرب او اللي يوجد بها عرب اكثرية وكانت عربية قبل الاسلام هي جزيرة العرب والعراق والشام اما انتو مش من دمنا النبوي من سلالة الانبياء دمكم افريقي اسود ذو الشعور الجعدة وبشرتكم الغامة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 168
subject = "الى ابن العرب"
author = "احمد"
posted = "2006-11-06"
text = "انا نفسى تشوف شكلك واشكالكم ووجوهكم القبيحه فى المرايه وشوف وجوهنا فى الفضائيات وشوف الفرق يا وسيم افندى على فكره مصر هى الدوله التى وجوه اهلها خليط فعندنا الوسيم جدا الفائق الوسامه وعندنا القبييح وعندنا المقبول وعندنا الزنجى وعندنا الغامق والاشقر والابيض اتدرى لماذا لات ن مصر فيها الاتراك القدامى واالرومان والعرب والاقباط وباقى الاجناس فنحن مثل دوله امريكا اشكال مختلطه واذا عمل مسابقه ججمال ومسابقه قباحه اؤؤكد لك يا اهبل ان القباحه والدناءه ستاخذ نصيب كبير فيكم اما الو سامه فهى تجتمع فى اهل الشام ومصر فهل شملامحكم تشبه اهل مصر والشام اتحداك يا عبيط وللمعلوميه انتى غبى واحمق وجاهل لانك تحكم بالشكل بالله عليك ماذا قدمت للعرب يا جرب"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 169
subject = "لهشام ونسخه لكل مصري"
author = "المستبده الخليجيه السعوديه"
posted = "2006-11-06"
text = "ليس مشكلتي جهلك وافتقار معلوماتك عن بلد كالمملكه العربيه السعوديه وتاثيرها على العالمين العربي والاسلامي والثقل الدولي والاقليمي لها..سنويايقام اكبر تجمع في العالم موسم الحج واتحدى اي دوله بالعالم ان تقدم الخدمات لضيوف الرحمن مثل بلدي لدرجه القنوات الاخباريه العالميه تنقل الوقائع وتشيد بنجاح واستراتيجه بلدي في انجاح وتنظيم هذا التجمع يغبطنا عليه الكثير صحيح بعض التجاوزات تقع ليس التقصير من الحكومه انما من همجيه بعض الحجاج..يتم طبع وتوزيع ملايييين النسخ من القران الكريم مجانا على كل المسلمين..بناء المساجد ومساعده المسلمين في تسونامي وافريقياوالشيشان ولبنان وكل مكان ودعمهم والتبرع بما نقدر عليه فلله الحمد والمنه حب الخير والكرم متاصل في نفوسنا..سنويا يتم استضافه حجاج لايستطيعون اداء فرائض الحج على نفقه حكومتي وتقدم لهم افضل الخدمات من طعام وشراب وعلاج مجاني ..هذا غير صناديق الخيريه لرجال الاعمال مثل صندوق عبداللطيف جميل التنموي لمساعده فقراء العالم العربي ومصر على ايجاد عمل شريف لهم..الوقوف على قضايا العرب جمبا الي جمب..ليس مطلوب منا محاربه اسرائيل والتصدي لااكبر قوه في العالم امريكا من اجل فلسطين لنعرض مصالحنا وامننا للخطر ليس نحن من جلب اسرائيل الي اراضي العرب ليس نحن من عقد سلام الشجعان واتفاقيه كامب ديفيد مع اسرائيل..نحن لانؤمن بدويله تسمي نفسها اسرائيل بل لاسلام ولا تفاوض ولا علاقات مع العدو..معلوماتك قديمه جدا الملك عبدالله حفظه الله امر باخراج القواعد الامريكيه من بلدي وفعلا خرجت وتناقلت وسائل الاعلام ذلك الحدث وانا متاكده من ذلك بنفسي لاني اقطن بقرب المنطقه التي اصبحت مهجوره الان..بلدي ياعزيزي اشهر من نار على علم..تمجد تاريخ الفراعنه الطغاه..وتبخس تاريخنا العربي اجدادي<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 170
subject = "الي احمد والمصري"
author = "ابن العرب"
posted = "2006-11-06"
text = "يااللي تقول عندك وثيقة اني من نسل الانبياء اليهود يعرفون انة العرب ابناء عمومتهم وهم من نسل النبي اسحاق بن النبي ابراهيم واحنا العرب من نسل النبي اسماعيل بن الني ابراهيم الكتاب اللذين شتمو العرب والنبي كتبو عن نسل العرب وهم يطلق عليهم العدنانيين على جدهم وانت لاتعرف اسال اي عالم دين او خبير بالانساب وراح يقولك يا غبي لو تشوفني راح تنبهر يا بشع انتو المصريين الاصليين ذو الشعر الاجعد والبشره السوداء انا ابيض البشره ولا تدخل الباقي الاجناس في مصريين فكثير من اهلي تزوجو اجنبيات من اوروبا وامريكالكن ليسه لي دخل فيهم وكتلم عن اصلك المصري ويا احمد باين عليك عراقي العباسيين طلعو منه والامويين طلعو منه وانافيني من عرقين او قبيلتين عربيتان نزحو او رجعو لجزيرة العرب من الشام والعراق يعني كثير رجعو لبلاد العرب وحتا من نسل العباسيين يوجد في الخليج ومن نسل الاشراف موجودون بكثرة يا غبي"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 171
subject = "الي الغميل الوهابي الارهابي هشام"
author = "المصري الاصيل"
posted = "2006-11-06"
text = "كتاباتك تصب في خدمة اسرائيل ايها العميل الوهابي فعلا الشيعة اكثر ناس بيقوموا أسرائيل وامريكا في العراق الشيعة من انصار مقتدي الصدر اكبر مقاومين لامريكا وفي لبنان معروف حزب الله وبطولاته التي لا ينكرها الا عميل صهيوني متخفي باسم اسلامي مثلك ومعروف ان دولة ايران هي اكبر دولة معادية لامريكا واسرائيل والعالم كله يعرف ذلك انت واسيادك من الوهابيون السعوديون هم اكبر اعداء الاسلام الحقيقي ودائما امريكا تتبني السعودية الوهابية وتسبغ عليها حمايتها من ايام روزفلت للان كيف تقول انهم يسبون الرسول وهم اهل بيته ويفتخرون بالانتساب له ولعلمك الازهر من فديم ايام الامام شلتوت افتي بان الشيعة الجعفرية والزيدية هي مذاهب يمكن لاي مسلم التعبد بها بطل تكفير وخدمة للصهاينة واهل فلسطين يعرفون جيدا ان حزب الله وايران هم اكبر انصارهم اتق الله ان كنت مسلما فعلا وتب من هذا التكفير ولماذ خرست اوي لما المستبدة السعودية الخليجية مسحت بك الارض وانتفضت عند الفاع عن الشيعة كفاية عمالة وخدمة لاسرائيل"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 172
subject = "الي ابن العرب"
author = "المصري الاصيل"
posted = "2006-11-06"
text = "يعني انت ودويلتك الخليجية المضحكة اللي كنتوا من 35 سنة عبارة عن خيام وشوية معيز وجملين خلاص هتتطاولوا علي ام الدنيا مصر بعمقها التاريخي والحضاري صحيح القوالب نامت والانصاص قامت كما يقول المثل المصري يابو جهل دخل قناة السويس فقط 4مليار دولار سنويا وبعدين كم تدفعون انتم من مليارات حتي تشربوا مياه صالحة للشرب احنا عندنا نهر النيل وكم تدفعون من مليارات ومليارات عشان تجيبوا اجانب يشغلوا بلدكم لانكم شعوب جاهلة وفاشلة ومتخلفة ومش عارفين تشغلوا بلدكم واحنا بنساعدكم في تنمية بلدكم بالخبرة المصرية عشان تعرفوا تعيشو ا وتستمروا وللاخت المستبدة التاريخ خرج من منطقتكم من ايام الخلفاء الراشدين واصبحتوت صحراء قاحلة لا يطيق العيش فيها حتي الانعام والدواب مش ملاحظة ان مفيش مستعمر طمع في ارضكم لانها طول عمرها كانت خراب الي ان ظهر البترول ابتديتوا تعملو شوارع ونعل لكم مدارس ومستشفيات لكن مفيش فايدة الانسان عندكم تعبان وغبي وخربان وكل همه عضوه التناسلي عشان كده عمركم ما هاتتقدموا لانكم كسالي وبدائيون وجهلة وتعيشون عالة علي الاجانب وارجوا الا نري وجوهكم القميئة عندنا في مصر ارض الخير والحضارة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 173
subject = "ابن العرب و المصرى"
author = "هشام من مصر المسلمه"
posted = "2006-11-06"
text = "ابن العرب يتفاخر بقبيلته وببياض شكله الم اقل لك انك غبى فى كلامك هل انت من الدماء الزرقاء ونحن من الدماء الحمراء هل لو فعلت الفاحشه مثلا اصلك سينقذك من النار والعياذ بالله صدقنى انت اغبى وكلامك فاضى اما بخصوص المصرى الاصيل فانت جاهل تنعتنى بالوهابيه وهى كلمه تقال على عالم جليل ليفرقوا بها اهل السنه فى بلاد الحرمين فو الذى لا اله الا غيره انى خريج من جامعه الازهر واعرف منك من الشيعه ادرس دينك يا جاهل اما بخصوص فتوى شلتوت هذه فلقد عارضوه معظم العلماء وقتها وكل ياخذ منه ويرد الا رسول الله صلى الله عليه وسلم فيا رجل نفس الكلام والتفاخر بالنيل وبالاشياء التى لاتنفعنا مثل ابن العرب الذى يتفاخر مثلك باشياء تافه كاللاصل وغيره صدقونى انتم مثال متكرر فى بلادنا مثال جاهل فهذا خليجى جاهل يتفاخر ببياض وجه وباصله المعدوم وانت بنيل الفانى مع الزمن اتقو الله قرفتونا انتم الاتنين صدقونى انتم لاتمثلون الاسلام فهذالا يمثل اخوانى فى الجزيره العربيه وانت لاتمثل اخوانى المصريين ربنا يشفيكم ويعفوا عنكم الامراض التى تعانون منهااا انتم بابن عليكم فاضيين واهلكم بيصرفوا عليكم وما فيش شغلانه ليكم بدليل سرعه الردود لكم ربنا يهديكم وتبطلو غباء يا عربى ويا مصرى"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 174
subject = "الى ابن العرب"
author = "سامى الوسيم"
posted = "2006-11-06"
text = "نفسى اشوف شكلك عشان انبهر يا عبيط يعنى ابنهر ازاى ابوسك يعنى فعلا صدق ت امريكا بتقول عليكم فى الصحف بانكم اغبياء على اهل الخليج بسبب غباوتكم الوفيره طيب ايه رايك انا هخلى نفسى عبيط زيك واشوف عقلك ايميلى بالاسفل تعالى كلمنى على الياهو اشوف شكلك وبياضك يا بيضه وتشوف شكلى واللى يطلع الاجمل التانى يبصق فى وجهه التانى وانا اتحداك ولو راجل عشان اشوف جمالك وتشوف شكل واحد مصرى مثلى ياللى بتعيب على شكلهم وان طلعت احسن منك تدفع كام ياروح امك وهذا ايميلى لو راجل كلمنى وافتح الكامير وانا هفتحها لك وممكن نتعرف ونشوف واهى مسابقه جمالfares_net27@yahoo.com"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
