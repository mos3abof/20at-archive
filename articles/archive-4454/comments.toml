[[comments]]
order = 125
subject = "للاستاذ كويتى"
author = "مصرية"
posted = "2006-10-15"
text = "يا استاذ كويتى انت بتتلكم عن فقر العقل اولا انا عايزة اقولك حاجة الرسول صلى الله عليه وسلم كان امى ثانيا كان عندنا زعيم اسمه محمد فريد. محمد فريد قال انى التعليم الابتدائى اجبارى يعنى المفروض اى مصرى يكون على الاقل معاه الابتدائية لكن عمك حسنى مش همه اذا كنا نتعلم ولا لا هو اللى همه انه يمص فى دمنا ويكسب من ورانا ثالثا ودى اهم حاجة نفترض انى كل الكويتين متعلمين يعنى مافيش ولا كويتى مش متعلم كلكم متعلمين تقدر تقولى كام واحد منكم اخذ جايزة نوبل ولا واحد كويتى اخد جايزة نوبل لكن فى مصر اللى اخذوا جايزة نوبل 4 (دكتور زويل ونجيب محفوظ وانور السادات و دكتورالبرادعى) وعلى فكرة رويات وكتب نجيب محفوظ تدرس فى جامعات امريكا الادبية .يعنى 4 واخدين جايزة نوبل ونص الشعب مش متعلم شوف بقى لو الشعب المصرى كله متعلم يبقى شوف بقى كام واحد هيأخذ جايزة نوبل .وفى قصة حلوة جدا انا سمعتها قبل كدة بتقول القصة\" كان فى واحد انجليزى يفتخر بحضرته فقام واحد اسود اللون وقال للانجليزى كيف تفتخر بحضرتك وانا اللى عطيك هذه الحضارة فأندهش جدا الرجل الانجليزى وقال له ازاى انت اعطيتنى هذه الحضارة فقال له هذا الرجل الاسود اللون انتم ايها الانجليز اخذتم حضارتكم من الرومان والرومان اخذوا حضارتهم من اليونان واليونان اخذوا حضارتهم من الحضارة الفرعونية القديمة( فى مصر) ومصر فى شمال شرق افريقيا وانا من نيجيريا ونيجيريا فى افرقيا يعنى انا الذى اعطيتك هذه الحضارة .<br />يعنى يا استاذ كويتى واحد من نيجيريا بيفتخر بحضارة الفرعونية لمصر فمابالك بقى احنا نعمل ايه دة احنا نحمد ربنا انى احنا طلعنا مصريين وكمان يا اخ كويتى مصر مش مشهورة بكابريتهامصر مشهورة بحضارتها وانها ارض الامن والامان كما ذكرها الله وان بها خير جنود الارض زى ماق<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 126
subject = "توضيح للاستاذ مصرى جدع وللاستاذ محمد فارس"
author = "مصرية"
posted = "2006-10-15"
text = "وللاستاذ مصرى جدع اولا انت مش مصرى لانى احنا مش بنقول هيك ولا بنتكلم باللهجة دى اصلا ثانيا للاخ محمد فارس يا استاذ اللى مالوش خير فى وطنه يبقى مالوش خير فى اهله ودينه وعرضه وشرفه وانت كمان بتقول انى الشعب المصرى شعب متخلف بس انا مش هرد عليك ياريت تقرأالتاريخ المصرى كويس جدا قبل ماتتكلم ولما تقرأالتاريخ هتعرف ايه هى مصر يا استاذ \"مصر ام الدنياوارض الامن والامان وقلب العروبة\"وبصراحة انا شاكة يا استاذ محمد انك مصرى من اساسه لانى انت لو مصرى وبتتكلم كدة على بلدك وعلى شعبك دى تبقى مصيبة كبرى وانا حاسة انك مش مصرى خالص لانى لسة احنا موصلناش اننا نشتم فى شعبنا وفى ارضنا احنا ممكن نشتم فى ريسنا لانه بعنا وباع البلد لكن مانشتمش فى شعبنا وحضارتنا وتاريخنا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

