text = "(طبعا مع العلم ان الهباب ده اللى اكتشفه و استخرجه وحاليها بيشتريه و يصنعه هم الاجانب اللى بيتشتموا من السعوديين انما مفيش مانع يعاملوهم طالما فى مصلحه!!)<br />واللى بعد كده يقول وحده عربيه ابقوا صحوه من النوم.<br />واتفق العرب على الا يتفقوا."
