text = "اظن اختلاف الرأي لا يفسد للود قضية.<br />وانتا كبرت القصة وعطيتها اكبر من حجمها.<br />حسستني ان احنا في حرب مو في طرح رأي.<br />عموماقل ماشئت فأنا أنسحب لان السالفة والله ماتستاهل كل الأخذ والرد هذا<br />سي يو ليتر"
