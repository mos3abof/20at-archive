subject = "كلمه لابد منها"
author = "مصرى ازهرى"
posted = "2006-11-10"
text = "فليخسأ القطرى الحاقد الذى يسب السعوديين بالوهابيه وكان الوهابيه مذمه يرحم الله / مجدد القرن الامام محمد بن عبدالوهاب الذى حارب البدع والخرافات سحقا لك يا قطرى يا حاقد الم تعلم ان الله ورسوله الكريم صلى الله عليه وسلم نهى عن التفاخر بالحسب والنسب وان لافرق بين اعجمى ولاعربى الا بالتقوى اذاكان هناك وضيع مثلك يسئ لاهل قطر الكرام فانت ليس منهم فارفع راسك ياكل سعودى فانت فى بلد الامن والايمان وحفظ الله اهل السعوديع من كل شر واهل مصر من كل حاقد"
