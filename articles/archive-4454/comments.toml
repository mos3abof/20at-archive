text = "من انتم وما تاريخكم اي دويلة فيكم لا تزيد عمرها عن 40 سنة ثانيا كلامك كله متناقض تقولين ان المصريون مشهورين بالتخلف الانساني والعقلي فمن الذي علمكم في المدارس ومن الذي عالجكم اليسوا مدرسينا واطبائنا ومن الذي بني لكم مدنكم اليسوا مهندسينا وعمالنا الصعايدة اللذين تسخرين منهم ومن الذي وضع للكويت قوانينعا ودستورها اليس هو السنهوري باشا المصري ومن الذي انشء المسرح عندكم اليس هو زكي طليمات المصري كل هذا لانكم شعب فاشل وجاهل وتعتمدون علي الاجانب في كل شيء لانه لا عقول لكم عقولكم تتركزفي نصفكم الاسفل ثم تعترفين بانك تاتي الي مصر لزيارة النيل والتاحف والمكتبات يعني مصر بتثقفك وبتعملك بني ادمه رغم ان امثالك من ناكري الجميل مفروض الا نرحب بهم وما هو الدعم الي تقدموه لنا لعلمك سياح الخليج اقل عددابكثير من السياح الاوربيون بل اننا نرسل الي السعودية سياحا للعمرة والحج اكثر من مليون سنويا بينما من ياتي الينا من السعودية حوالي 300 الف والمليون اللذين يذهبون الي العمرة والحج يدعمون المملكة بفلوسهم وبما يشترونه من بضائع في مكة والمدينة وجدة والمحلات هناك مفتوحع علي حس المصريين لاننا اكثر جالية تشتري في النهاية عايز اسالك سؤال يياتري لو الاجانب انسحبوا من بلادكم الخليجية ماذا ستفعلون وانتم لا تجيدون اي شيء اظن هاتموتوا من الجوع اتكلمي علي قدك ولا تحاولي ان تتطاولي علي اسيادك المصريين وعل مصر بلد الحضارة والتاريخ والخير والجمال والعلم والثقافة الارتباط بكم يجرنا الي الخلف مع مشاكلكم من دفاع عنكم ضد العراق وصدام وياريته كان احتلكم فانتم اصلا مش محصلين لا دول ولا شعوب ناضجة ولكن اغنياء ببلا عقل بصدفة اكتشاف البترول اللذي لا تستحقونهوان شاء الله عندما ينفد ستعودون كما كنتم ف<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 86
subject = "الى ابن النيل"
author = "نوره الشمري"
posted = "2006-09-25"
text = "كلامك لا يمثل لي اي اهمية لانه عار من الصحة والحقيقة الواحدة ان المصريين شعب حقود وحسود على الخليجيين وهذا ما قرأته في تعليقاتكم.<br />عموما مهما كانت قلوبكم قاسية وحقودة الا ان احنا شعب نحب الحب وعلى حب الحب تربينا وماعندنا فرق بين عربي او اجنبي او حتى خليجي .<br />بالنسبة لرأيك الشخصي فهذا لا ينطبق على كل المصريين, لاني اعرف كثير من المصريين يحبون الخليجيين مثل ما الخليجيين يحبون المصريين.<br />وفي الاخير كلنا عرب ومسلمين ومافيش داعي للتخلف الفكري والرجعي اللي عند حضرتك.<br />تقبل تحياتي"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 87
subject = "الي نورة الشمري"
author = "ابن النيل"
posted = "2006-09-25"
text = "من انتم حتي نحفد عليكم لعلمك انتم بالنسبةلنا فقراء جدا هل بترولكم كله في الخليج يساوي نهر النيل طبعا نهر النيل اغلي بكثير او قناة السويس وهذه كنوزنا ستظل موجودة ودائمة الي قيام الساعة ان شاء الله بينما ثروتكم البترولية الي نفاد ويومها ستظهرون علي حقيقتكم وترجعون الي اصلكم البدوي المتخلفثانيا مصر مملوءة بكوادرها البشرية اللتي غطت بعلمها وثقافتها العالم العربي كله بغكس فقركم البشري والعلمي اللي بيحقد علي احد بيكون معتقد انه احسن منه لكنكم تعرفون ونعرف جيدا حقيقتكم التافهه مرة اخري لا تحاولي ان تتطاولي علي اسيادك حتي لا تسحقي انتي وامثالك تحت الاقدام"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

