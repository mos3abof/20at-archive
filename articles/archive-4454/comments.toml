subject = "ياسيدك المصري"
author = "عبدالرحمن"
posted = "2006-11-07"
text = "انت اصلان سعودي وكذاب وتسوي نفسك مصري وتقول ال تاني يعني صدقت انك مصري مرة تقولون كويتي ومرة سعودي ومره قطري وال ثاني تاجن على راسك وراس ملكم خائن الحرمين حفيد اليهودي مردخان والمشيخات والقبائل عندكم انتم ياسعودي وصار في سعودية انتخابات شيخ القبيلة تصدقون ياعالم انتخابات شيخ القبيلة ضحكتوني والله"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 198
subject = "كلنا واحد"
author = "للاسف عربي"
posted = "2006-11-07"
text = "اتفق العرب على الا يتفقوا<br />كل ذي نعمة محسود<br />للاسف كاتب الموضوع ليس لديه موضوعية<br />مصر بأهلها والخليج بأهله<br />العرب الكرام المصريون المسلمون ليس بينهم وبين الخليجيين ادنى مشكلة المشكلة هم الاقباط وزغروطة للاقباط لانهم فرقوا بين العرب المسلمين مصر ارض الحضارة والتاريخ وجزيرة العرب ارض الاصالة فهم توأمين لايفترقان العرب الخليجيون ساعدوا مصر والمصريون ايضا كذلك وأكبر مثال حرب 73 عندما قطع الخليجيون البترول نصرة للاخوة المصريين ألا لعنة الله تترى على الاقباط وشكرا"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 199
subject = "الى ابن العرب الحقير القطرى وكل قطرى"
author = "مصرى واقول الحق"
posted = "2006-11-08"
text = "بصراحه انا كنت متابع الكلام ولما اتضح ان الحمار ابن العرب طلع قطرى كان لابدان ارد كنت فاكره سعودى وكنت زعلان جدا ان اهل السعوديه الذين نحبهم والايمان فيهم والعراقه والاصاله واستعجبت من ان سعودى يعيب على اهل مصر ويشتمهم اما انه اتضح قطرى فكان لابد ان ارد على هذا الحقير العرص ابن العرب نعم عرص اتدرى لماذا يا حمار يا جزمه انت واهل قطر كلكم لن تاتوا مقدار اقل واحد فى مصر انظر يا جزمه الى اشكال مصراللى مش عجبينك واللى شكللكم وانظر الى رئيس دولتكم اللى عامل زى العجل مش عارف العجل ده بيركب اى سياره المفروض يركب قطار لوحده عشان يستحمل وانظر الى القواعد الامرييكيه يا عرص اللى بتحكمكم مش عارف تاريخ اه وخلافه اه هى كان فى قطر ايامها الخلافه يا خول ده انتم اصلكم رعاع كانتم ساكنين على الساحل ومختلطين اجناس متعدده من هنود الى باكستنين الى ايرانين مش عارف نسل ايه العرب يا خول اصلهم فى السعوديه واليمن انته مين ياد ودولتكم الحقيره اللى شارع شبرا عندنا مش تيجوا نصهم احنا لو سيبنا شارع واحد على دولتكم كاملا تفترسكم يا حمار ده انتم وليه هى اللى بتحككم اسمها موزه حتى قناه الجزيره اللى عامله شريفه وبددافع عن العرب بينها وبين القاعده الامريكيه اللى بتضرب العراق خطوتين ويا حمار ياقطريين مش تغلطوا فى سيدكم المله فهد على الاقل اشرف من رئسكم الخائن والسعوديين لهم تاريخ عريق هما والمصريين يا جزم"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 200
subject = "الى مصرى واقول الحق"
author = "عبدالرحمن"
posted = "2006-11-09"
text = "يامصري يا فلاح اول شوف رئيسكم وبعدين اتكلم عن سمو الامير المفدى حفظة الله وقبل ان تتكلم عن قصف العراق شوف قناة السويس اللي سهلت عبور السفن الحربية يعني بداخلها جنود المارينز والطائرات لقصف افغانستان والعراق واول من فتح القواعد العسكرية الامريكية في الخليج هي السعودية ويوجد بلكويت اكثر من 10 جندي امريكي وفي البحرين اسطور البحري الخامس لامريكا احنا دخلنة الامريكان لصغر بلدنا اما انتو لكم فلس واهل قطر ياغبي هم من اتو من 500 او 400 سنة لقطر من الحجاز والعراق والشام يعني سوريا وجزيرة العرب من العوائل الاصيلة وانا جدودي من سكان الحجازقبل الاسلام بل كنا نحكم مكه ومنطقة لااريد ان اذكرها لكي لايعرف احد اصلي الكريم وبداية الاسلام في شرق الجزيرة ولي عرق من الي اتو من الشام لقطر قبل مئات السنين ومن العراق قبل مئات السنين يعني احنا خليط من العرب وقطر كانت ضمن الخلافة عندما بعث النبي علاء الحضرمي اللي ملك بحرين وهي تمتد من شرق العراق لحد قطر هو الملك منذر بن ساوي وكانت عاصمتهم هجر وهو ابن عم امير قطر الحالي ياكلب وهو من حاضر العرب قبل الاسلام ومن نسل الانبياء وهجر كانت طريق تجاري واقرأر ماذا كتبو عن سكانها وزالغنى اللي كانو فية وماذا كانو يزينون بيوتهم ومن كتب عنهم قبل العرب في كتب الاغريق وجدودي المباشرين من سادات العرب قبل الاسلام والعوائل اللتي اتجهت لقطر او الكويت اوبحرين معظمهم من الحضر مش بدو واقراء تاريخ العرب هم الحضر والبدو ومثل ماعندكم او باي دول العالم فلاحيين او ريفيين عندنا البدو لاننا بصحراء وارضنا غير صالحة للزراعة ياابن الفقر لاتتعالة على اعلا دخل فرد في العالم يعني من اغنا الشعوب ومن سلالة الانبياء"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 201
subject = "وداعاً مصر ..!!"
author = "صالح"
posted = "2006-11-09"
text = "اشكركم اخواني المصريين ... فقد ابديتم ما في قلوبكم من حقد وكرهـ لا اعلم سببه ..!!<br />فنحن الخليجين بطبعنا العام مسالمين محبين للغير.. لا نحتقر ولا نزدرئ احد..!!<br />ودائماً ما نكون مضيافين كرماء مع الغير .. ودائماً ما نتوقع من الغير المعاملة بالمثل..!!<br />ولكن للاسف كنت اتوقع ان بعض التصرفات والكلام العنصري البذئ الذي نسمعه في شوارع القاهرة .. هو مقتصر فقط على طبقة البلوليتاريا لديكم..!!<br />ولم اكن اتوقع ان تلك المشاعر تصل اى طبقة المثقفين والكتاب لديكم ..!!<br />فانا مواطن سعودي ولدي منزل بسيط أأجره على العمالة الوافدة .. ودائما ما اتقصد تاجيره على المصريين واتساهل معهم بالاجارات لانني احب هذا المجتمع فهو يتمتع بالدين .. والاصاله.. وحب الغير .. وخفة الدم المشهورة.. واتساهل معهم بالايجارات بشكل كبير يصل لانهم يتاخرون بالستة اشهر ولا اضايقهم ..!!<br />وانا كل سنة اتوجه الى مصر لتغيير الجو ورؤية اصدقائي هناك .. اما الان وبعد ما قرأت المقالة وقرأت ردود الاخوان المصريين وعرفت ما يضمرونه لنا في قلوبهم .. لن افكر بعد الان بالذهاب لمصر .. صحيح انني لن اؤثر بحركة السياحة هناك... ولكن هو تسجيل موقف فقط لا اكثر ..!!<br />وبالاضافة الى تسجيل الموقف.. فانا لم اعد اشعر بالامان هناك .. فلا استغرب ان يعتدي علي احد هؤلاء الحقدة .. لانه دئما ما يحدث نفسه بكرهنا وبغضنا ..!!<br />تحياتي للكاتب والاخوان .. وثقوا ثقة تامة بانكم فقدت سائح \"عربي\" بعد هذا الموضوع .. كان يحبكم ويعتبر مصر بلده الثاني ..!!<br />تحياتي للجميع..!!"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

