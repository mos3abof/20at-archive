author = "ابن العرب"
posted = "2006-11-05"
text = "يامصاروة يا فلاحيين العرب من نسل النبي اسماعيل بن النبي ابارهيم وينقسمون العرب لثنين هم البدو يعني الريفيين والحضر وهم المتحضريين يسكنون المدن لا تعممو على العرب بلكامل انهم بدو وقبل البترول كانا طبقات منه الملوك والامراء والتجار واسر من نسل كريم اما ميزه البترول انه رفع الشعب كامل ولم يجعل طبقات وروحو اقرأو من هم الفراعنة وقصدي ملوك مصر من الفراعنة كانو فلاحيين رحالة قبل ان يبنو الحضارة اما العرب فبنو حضارة سبأ العريقة بجنوب الجزيرة من قبل الميلاد ولما انهدم سد مأرب وهو عاصمتهم انتشرو باقي الدول العرية فبنو مملكة الحيرة بلعراق وبنو مملكة غسان في الشام وبنو مملكة كندة في جزيرة العرب وفي عهد الاسلام او بمعنة بعهد الامويون وهم من نسل معاوية بن ابي سفيان مؤسس الاسرة بنينة امبراطورية امتدت من حدود الصين لحد فرنسا مش اسبانيا بس وفي عهد العباسيين بنينة مدينة وطلقن عليها بغداد اما الان انتو صرتو بدو تترحلون بلملايين خارج بلدكم للقمة العيش"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 148
subject = "الى كعبول فهيم أوي"
author = "فاهم"
posted = "2006-11-05"
text = "يعني عايز تدحك علينا الناس<br />كفاية عبط وحمورية<br />انته مصنف الناس على كيفك<br />وعامل نفسك فهيم أوي<br />دنته طلعت حمار أوي أوي أوي<br />مش عارف الاشكال دي بتكتب ازاي"
archived = "2006-11-06"
