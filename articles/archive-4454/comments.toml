[[comments]]
order = 149
subject = "الى المستبده الخليجيه"
author = "هشام من مصر المسلمه"
posted = "2006-11-05"
text = "الى التى تقول انها المستبده الخليجيه يا ايتها السيده المستبده على نفسك وليس على احد اولا بخصوص الفساد والعربده والمجون والدعاره التى فى مصر بربك يا شيخه اليس فى كل كل بلد الصالح والفاسق اوليس فى بلاد كم اللواط والسحاق من اشهر ما يكون حدثينى بربك اذا كنت صادقه اليس فى اى بلد سواء مصر او غيرها الاسود او الابيض والشرير والصالح فلا تعممى على اهل مصر بالفسق والمجون بل ساحدثك ان كان لى صديق باحد دول الجزيره وهى من البلاد التى تشتهر بالصلاح ان عرض عليهالكفيل الفعل به باللواط ولا سوف يطرده فما كان من صديقى ان رفض وطرد من البلاد فاين الاخلاق كان من المفروض ان اقول كل اهل البلاد شاذه واعمم على البللد كلها ولكن هناك الفاسق هناك الصالح فكما انك حاقده وان الامريكان يستغلوكم بغبائكم فهناك ايضا منكم الذكى والصالح فيعلم الله انى لى اخوه احبهم جدا من بلاد الحرمين والامارات وازورهم وهم يزورونى فى بلدى وهم على الاخلاق طيبه فلا تعممى على اهل البلد والقذاره يا مستبده والاهمال موجود فى اى بلد حتى امريكا لعل شا هدتيها مثلى فيا اخيه اذا كان عندك مشكله لاحد من اهل مصر فهذا لايجعلك ان تكونى حاقده على اهل مصر كلهم واذا كنت تقولين بمعنى كلامك اننا فقراء وانتم حسنتم اوضا عنا فلا تمن على احد فاالمصريين لم يشتغلو لكم ببلاش وانتم لم تعطفوا عليهم بدون عملهم وعرقهم ودموعهم فلا فضل عليكم لنا ولاكرامه لانكم تحسنون للامريكان وتحترمونهم وهم يحتقرونكم ويدسون علييكم ونحن اخوانكم فى الدين اتحداكى يا مستبده ان تذكرى لى حسنه فى التاريخ بلاد كم التى عمرها سبعون عاما التى لم يكن لها اسم الابلا دالجزيره اذكر لى تاريخ او شخص بنى شئ فى اهل الاسلام او مذكور فلا تمن فنحن لم نمن على اطعامكم قبل ما البترول ياتى<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 150
subject = "الى المستبده الخليجيه"
author = "هشام من مصر المسمله"
posted = "2006-11-05"
text = "واعلمى يا ابتها المستبده ان بلادكم فى خطر شديد يحدق بها بل هى الان صارت بين فكى الكماشه والحقيقه انا مندهش من الشباب الذين هم فى بلاد الخليح من كثره الترف الذى لا يجعل اى شخص لا يجلس بدون تكييف واذا رايته رايت بالونه منفوخه الحجم امام بطنه من كثره الاكل فيكف بذلك يدافع عن بلده ويحمى اعراضكن والحقيقه يزداد عجبى اذا رايت اهل العراق الابطال اهل السنه الذين يدافعو عن بلادهم ودينهم فهم قوم شرفاء رجال متعودون على الحرب وانتم تعودتم على الترف والنوم والاسترخاء اننا لا اعممم البلاد التى اقصدها هى بلاد التى حدودها على اخليج العربى فاما اهل بلاد الحرمين ففيهم الرجال الابطال فيا اختى عندما يطرق بلادكم الروافض الحاقدين مثملما يفعلون بالمذابح لاهل السنه فى العراق وعندما تقعون فى ايدى الامريكان من كثره القواعد المتواجده فمن يجيركم ويسكب الدماء على ارضكم غير اخوانكم فى الدين وهم اهل مصر والشام فاتقى الله فى قولك ان اعتبرك انك انسانه شاذه الافكار غير محسوبه كليا وجزئيا على اهل الجزيره الاصيله فانتى لست منهم وان عشت بينهم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 151
subject = "اللي هشام المصري"
author = "عبدالرحمن بن خليفة"
posted = "2006-11-05"
text = "ياهشام مثل ماتعممون علينة البداوه راح نعممل عليكم وروح شوف من هم الفراعنة هم عبارة عن قبائل رعاة رحالة من شمال أفريقيا وصلوا إلى نهر النيل و أستقروا وبنو الحضارة لم يلد احد ملك الكل طلع من ولاشي وحعطيك مثل عندما بعث الخليفة العظيم ( العربي ) المقتدر بالله العباسي الرحالة ( العربي ) احمد بن فضلان اللي منغوليا قابل ابن فضلان في رحلتة قبائل اجداد الاروبيين وقال عنهم اقذر خلق الله لا يستهمون بنظافتهم وانهم همجيين والان الاروبيين في سقف العالم بلتحضر اقصد الكل بداء من لاشيء وللعلم العرب من نسل النبي اسماعيل بن النبي ابراهيم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

