[[comments]]
order = 15
subject = "للمثقفين فقط"
author = "معاذ محمود عامر"
posted = "2006-08-26"
text = "الموضوع سفيه وعنصري وبغير قيمة وأظن ده واضح لأي ذي عقل والتعليقاتمريضةوده كله لي اسمه علم النفس بس عايز أوجه كلامي للصديق محمد قرنة ما قيمة ما كتبته سوى أنه عنصري وانا طبعا متأكد انك واثق من عنصرية موضوعك ولا أنتظر أن يقال العكس فدعك من السفهاء الذين يقولون أن الموضوع غير عنصري وأن العرب هم العنصريون فأنت أرقى من هذه العقول القاصرة الجاهلة بالطبع هل تبتغون اثارة الضجة وتسخين الجو عالفاضي ما أود أن أقوله لك أظنه واضحا جليابلا لبس فعليك أن تتفههم وأن تتنازل وتعتذر للعرب لانها مش ناقصة تشتيت وهبل أكتر من اللي موجود بالفعل وأكرر أن ذلك موجه للكاتب فقط فلا أود من أحد الجهلاء المنتشرين في أرجاء العنكبوتية أن يرد لأني مش ناقص وجع دماغ ورغي مع شوية سفهاء وحمقى ومراهقين ومرضى"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 16
subject = "عنصريه..غبيه"
author = "خالد..سعودى محب لمصر الشريفه"
posted = "2006-08-26"
text = "انامواطن سعودى..<br />وما راح اقول الا الله يشفيك....لانك انت بالضبط نفس العينه العنصريه سواء عندنا بالسعوديه وعندكم....<br />يا اخى والله نحب مصر لمجرد انهامصر..ولو القضيه كباريهات وشغل فساد...بانكوك موجوده وباريس..و المغرب غيرهم...<br />لكن فعلا كفايه تكرهون الناس فيكم...<br />خالد سعودى محب لمصر الاصيله..."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 17
subject = "اخيب ما في مقال عنوانه"
author = "عبدالله مفتاح"
posted = "2006-08-26"
text = "العرب احتلوا مصر؟<br />والله شر البليه ما يضحك<br />امال احنا ايه بنجلادش<br />مش عارف الحاجه دي تتسمى ايه<br />بس اكيد يرجع لحاجه مش كويسه<br />العرب؟ واحتلوا<br />بجد ساعات بستغرب من ثقافة البعض<br />من اين استمد ثقافته الكاتب المحترم ليكتب مثل هذا العنوان"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 18
subject = "ابوجهل او ابو حقد؟"
author = "مصرى عربى - كندا"
posted = "2006-08-26"
text = "فبداية التسعينات عملت بالسعودية خمسة سنوات والحمد لله لم اطاطى لاحد ولم يصادفنى اى موقف عدائى او عنصرى. بل رايت من الزملاء السعودين بالعمل كل مودة وكرم وحسن خلق نفتقده فى مصر. وللعلم فى اكثر من مناسبة كثير من السعوديين (موظفين واصحاب اعمال) ممن عاصروا الأيام الصعبة بالسعودية يتحدثون مع زملائهم المصريون بامتنان عن المساعدات المالية التى كانت تقدم من مصر للسعودية قبل تبدل الاحوال. اذكر جار يمنى بالسعودية درس فى مصر فى كلية التجارة قال لى بحصرة \"ايه اللى حصل لمصر؟! دى كانت حاجة تانية خالص ايام دراستى هناك\". هذا لا يعنى ان السعوديين ليس بينهم مثل كاتب هذه المقالة ومن هو اسوأ او اقل سوأ او انه لاتوجد مشاكل خاصة بالعمل هناك. ارى ان كثيرا من التعليقات تنكر على السعوديين الحق فى حماية مجتمعهم من اى فوضى قد يسببها الوجود الدائم لملايين الاجانب فى بلادهم. هذا وان كنت لا انكر وجود تجاوزات. اعتقد ان من يذهب هناك للعمل يعلم الكثير عن نظام العمل هناك وله دائما حق اختيار العمل هناك من عدمه. من الافضل صب غضبنا ورفضنا للاوضاع فى مصر على المسئولين عن هذه الاوضاع. هذه المقالة مغرضة ودنيئة وتنم عن نفسية مريضة وشخصية فاشلة."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 19
subject = "وأنا من السعودية وأحب مصر"
author = "محمد الدوسري"
posted = "2006-08-27"
text = "أشكر كل كاتب شارك في الموضوع الذي يفوح رائحة كراهية وحقد دفين ، من كاتبه ، الذي عمم بكلامة على كل السعوديين / الله يسامحه / وتمنتي لو كتب بعض ،<br />وبالنسبة للأخت الأردنية التي تقول انهم سبب في رفع الأسعار وحجز العقارات واقول لها أن السبب ليس السياحة التي تدعوا إليها الجهات في كل بلد وإنما في استغلال التجار في بلادك وجشعهم في اموال السياح من الدول الخليجية بشكل عام ،<br />ودامت الدول عزيزة بأهلها ما داموا صادقين بالانتماء إليها<br />ونرجع نقول بنحبك يامصر"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 20
subject = "نقصاها غباء أصلها"
author = "محمد قرنه"
posted = "2006-08-27"
text = "المقال مفهوش كلمة واحدة بتدين العرب ، ومش عارف اللي شموا ريحة العنصرية دي شموها منين بالظبط .. الشم من المناخير بس .. متنسوش الموضوع دا !!<br />التعليقات بعد الموضوع هى اللي شتمت العرب ، ودي ملهاش علاقة بالمقال ! زائد كون اسم الموضوع ( العرب .. احتلوا مصر !!) فدي أغبى نقطة في التعليقات بأمانة .. ليه ، لأن المصريين حاليا عرب ! يعني العنوان من الناحية المعجمية صحيح ، زائد إن مصر كانت فرعونية وبعدين مستعمرة لبلاد مختلفة زى الإغريق في الأول .. وبعدين بقت قبطية ، إلى أن فتحها عمرو بن العاص وأصبحت عربية ، والفتح بمنظور عقلاني (مش ديني ) هو احتلال !! وعمرو بن العاص من الجزيرة العربية طبعا ، فالعنوان تأريخيا برده مظبوط يا عباقرة<br />الأخ اللي بيتكلم عن الإسلام ، لازم إنت تفهم الأول إن الإسلام حاجه ، وكلمة العرب المستحدثة اللي بتضم تحت طياتها خليط من شتى الأديان والعبادات حاجه تانية<br />الأخ اللي بيقول إني مش مبسوط وإني بأدمر السياحة ! أكيد ليا ملاحظات كتير على سلوك العرب في مصر ، والانبساط أو الزعل دا موضوع داخلي ملكش فيه ، المقال لم يطلب رحيلهم أو يطالب بترحيلهم ، الموضوع يرصد الأماكن التي يتجمعون عندها وطرق تعاملهم بداخل تلك الأماكن ، أو فلسفة وجودهم بالنسبة للمجتمع ككل باعتبارهم وافدين لفترة محدودة !! مش الموضوع معمول عشان أهاجمهم أو أهاجم السياحة<br />معاذ .. حظك إني رديت على الأغلب فحرام أتجاهلك يعني !! اقرا ردي اللي كاتبه وإنت تفهم ليه الموضوع مش عنصري ! أما تشتيت العرب فيا عزيزي العرب عمرهم ما قربوا يتجمعوا حتى مش اتجمعوا عشان أشتتهم ، ولو مقال هو اللي حيشتتهم يبقى فعلا هما ميستحقوش إنهم يتجمعوا أصلا !!<br />عبدالله مفتاح .. نصيحة لوجه الله .. بلاش تخليني أقولك من أين استمديت ثقاف<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 21
subject = "الى الاخ مصراوى"
author = "الدكتور محمود"
posted = "2006-08-27"
text = "اولا يااخ مصراوى كل بلد ولها قوانينها وطالما انت رضيت انك تعيش فى اى بلد اعتقد من البديهى انك تحترم قوانينهم وسعادتك مش عاجبك النظام ده انت حر<br />ثانيا حكاية ان فلوس السعودية عمتنى وبعت نفسى والكلام الخايب ده وفى الاخر شتيمة اعتقد صعب انى انزل لمستواك فى الحوار وعلشان تعرف مش انا اللى ابيع نفسى واحد كان مع اول فوج عبر قناة السويس فى حرب 73 واصبت فى خامس يوم المعركة وده وسام وشرف يمكن سعادتك متعرفوش اظن ان واحد من النوعية دى مفيش مخلوق فى الدنيا يقدر يشترية او يذلة واذا كنت انت سافرت وفشلت دى مش مسئوليتنا ولو انت فشلت ففى موجود الاف ناجحين ومحدش يقدر يعمل فيهم حاجة من اللى فى دماغك ....<br />واخيرا عيب انك تكلم الناس بالاسلوب ده مهما كان صغير او كبير"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 22
subject = "الى الاستاذ محمد قرنة"
author = "الدكتور محمود"
posted = "2006-08-27"
text = "اولا يااستاذ انا مقلتش انك بتدمر السياحة وارجع للرد وبرضة انا مقلتش انك طلبت منهم انهم ميجوش لكن اللى سعادتك قلتة فيه كثير من التريقة والتسفيه مثل<br />(( كوبرى قصر النيل على سبيل المثال يتحول فى فصل الصيف الى ملكية خاصة للعرب تجدهم حولك فى كل مكان هناك على اقدام الاسود الاربعة باعتبار ان العرب هم اشجع خلق الله والاسود الكلاب بالنسبة لهم ))<br />ادى واحده تريقة يااستاذ محمد والثانية<br />(( على الرغم من ملاصقة كوبرى قصر النيل لدار الاوبرا المصرية الا ان الاوبرا هى اخر ما يفكر فيه السائح العربى فالسياحة العربية سياحة ترفيهية استهلاكية فى المقام الاول ولا يجد العربى فى الفن الراقى الذى تقدمة الاوبرافى كافة المجالات شيئا ترفيهيا بالمرة وان كان يجد ضالته فى مسارح عادل امام وسمير غانم والمسرح الخاص بشكل عام والذى يعتمد على الابتذال الى حد مبتذل ))<br />مش هو ده كلامك برضة ولا انا غلطان يعنى التريقة والتسفيه واضح جدا فى المقاله وهو ده اللى استفز الناس . واخيرا موضوع زعلك انت حر فيه ومحدش قالك انى ليا فيه انت حر ازعل على قد ما تقدر . وتقبل تحياتى بدون زعل"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 23
subject = "ليه العرب دايما ما بيعرفوش يتناقشوا بهدوء و بموضوعية"
author = "واحد فكر يبعتلكوا"
posted = "2006-08-27"
text = "أحب أقول للي نقدوا الموضوع أني شايف إن الموضوع عادي جدا لو سلمنا بوحود بعض أو الكثير (علي حد رؤية كل شخص) من التريقه فأن السخرية بتدي لموضوعات النت بعض الجذب و التشويق والراجل ما سبش ليهم .و بعدين السياح العرب ليهم الكثير من التصرفات المشينة في مصر وغيرها واللي هما بيعترفوا بيها( بس ده ما يخليناش نكون فكرة عامة). أحب بعد كده إني أقول لمحمد أن بعد إذنك تبريراتك واهية مايصحش تقولها لزوار زي زوار الموقع و ماكنش المفروض إنك تنزل لمستوي أقل من المستوي اللي المفروض تكون فيه بأنك تتكلم بالطريقة دي.أعتذر إذا كنت ضايقت حد مني بس ده رأيي أرجو أنكم تتناقشوا بعد كده بهدوء"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 24
subject = "الخ محمود"
author = "مصراوي"
posted = "2006-08-27"
text = "حكاية ان كل بلد لها قوانينها ولازم نحترمها غلط ياستاذ لان المحك هنا هل القوانين ظالمة وبتحترم حقوق الانسان ولا عنصرية يعني ايام ماكانت جنوب افريقيا فيها تفرقة عنصرية بين السود والبيض نقول ومالو كل بلد لها قوانينها ولازم نحترمها ياخي يجب فضح هذه العنصرية ورفضها مش التعايش معاها عشان مصالح شخصية وريالين الان السعودية اكبر بلد عنصري يفرق بين السعوديين وغيرهم ده مسميين العرب الاجانب وبعدين نجاح ايه وفشل ده كل اللي هناك بيشتغلوا بالراتب يعني يعني موظفين عند كفلائهم اللي بيقدر يستمر في الظروف دي ومبسوط منها هو المنافق لكن في ناس اكيد مضطرة تشتغل في الظروف الغير انسانية دي وانا اعذرهم طبعا وهما من داخلهم وكلامهم بيفضح هذه الدولة العنصرية ولعلمك يا اخي انا عمري ماشتغلت في السعودية فان صاحب عمل خاص في مصر لكني باروح كتير السعودية والاماكن المقدسة للعمرة وال وحج عشرات المرات واعرف كل شييء عن الاوضاع هناك مما لمستة من احتكاكي بالمصريين هناك وهنا في مصر وما تعرضوا فيها من ظلم واكل حقوقهم من كفلائهم وما لمسوه من عنصرية بغيضة وقد ذكرت بعضها في تعليقي السابق وانت عارف ان في مقولة بيقولها المصريين والعرب هناك ان دي اطهر ارض وانجس شعب واخيرا تجرد من مصالحك الشخصية وانك عايز تاكل عيش بس مش علي حساب المصريين او الحقيقة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 25
subject = "المقال جيد"
author = "BATISTUTA"
posted = "2006-08-27"
text = "انت يا اخ محمود انت محزوق قوى ليه كده دا لو خليجى مش هيتكلم بالحرارة والروح دى ارحم نفسك شوية وبعدين الراجل كلامه صح يعنى السائح العربى جاى مصر عشان يصلى فى الجامع الازهر معروف انه جاى عشان يدلع نفسه .<br />دخل مصر لقى فى وشه حبايبه المصريين شبه اللى فى بلده اللى بيتمسخر بيهم بالنسبه له عادى لما يتريق على شوية مصريين فى بلدهم .<br />اما حبايبنا بتوع الثقافة والعنصرية جتكم خيبة منهم الاخ المثقف اللى مبيردش على الجهلة والحمقى ربنا يشفيه .<br />يا جماعة بالنسبة لاهل الخليج خلاص دى بقت ثقافة عندهم يتم توريثها جيل بعد جيل ان المصرى فولة وكذا وكذا .<br />انا مش بنكر ان فى عرب وخليجيين بيحترموا مصر بس دول زى نقظة فى بجر وشكرا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 26
subject = "في ريحه مش كويسه"
author = "كعبول الفهيم أوي"
posted = "2006-08-27"
text = "بصو يا جدعان<br />إحنا عندنا سياحة كويسة .. و عندنا سياح كويسين .. و أنا بما إني شغلي مرتبط بالسياحة أتعامل متير مع الجماعة العرب و الخليجين بالتحديد .. و أستطيع أن أجزم على الآتي :<br />السعودين : أغبياء لدرجة لا تتصور .. من يشوفو بنت معدية يتهبلو و ينصرعو و يدفعو اللي قدامهم و اللي وراهم عشان تسلم عليهم بس .. عندهم إحساس بالنقص و الحنان و الغباء .. و على كل ده شايفين حالهم و فاكرين نفسهم ملوك زمانهم<br />الكاويته: يا عيني .. غرور و كبرياء بلا ثقافة و لافهم .. فاكرين إنهم أجمل خلق الله و هم شكلياً أقبحهم .. فاكرين الفلوس كل حاجة .. و ده المهم بالنسبة لنا .. ننهب و نضحكهم و نديهم بالجزمة على دماغهم<br />الإمارتين: ناس فاضين و معندهم هدف في الحياة .. لكنهم مستعدين لدفع أي شيئ مقابل إنك تضحكهم<br />القطرين: أغبى خلق الله .. ناس دماغهم جزمة قديمة و معفنة .. مش فاهمين هم عايشين ليه .. عايشين عشان ياكلو و يموتو بعديها .. المهم .. دول أحلى ناس يدوك فلوس و هم مش عارفين ليه .. من كثر الغباء اللي فيهم .. بعت على أحد القطرين ساندويتش طعمية ب400 جنيه !<br />البحرينين: يا عيني .. بكل صراحة ناس أدب و زوق و أخلاق .. ناس فاهمة هي عايزه أيه .. ناس جاية للسياحة و ليس للدعارة .. ناس مؤدبة أوي و مثقفة .. بس يعبهم يا عيني الفقر !! .. صدقوني .. بعض البحرينين يتسلفون من جيارنهم و يحوشون القرش سبع سنين عشان يخرجو من بلدانهم للسياحه .. بل و أكثر شيئ عجبني فيهم .. إنهم في عطلة الصيف بيروحو العمرة للسياحة !<br />العمانين : يا عيني ... ناس أدب بس معندهم المعرفة و لا إسلوب التخاطب .. بس ناس عسل الصراحة .. و جاين للسياحة النظيفة<br />يعني ... أهم حاجة نعملها من السياح دول هو إستغلال الفرص و إستغلال المادة .. و هذا هو<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 27
subject = "اي كلام يا عبد السلام"
author = "واحد عايش في الخليج"
posted = "2006-08-27"
text = "الكلام المكتوب ده كله اي كلام في اي كلام و الناس بتتعامل معانا كويس مع ان في ناس قاعدة عندهم بقالهم سنين عواطليه. كنا احنا بقي حاسيين بالنقص فده لا مؤاخذه من فقرنا.جتكو ستين نيلة أكتر ما نتو منيلين.العالم كله بيتقدم حتي الخليجين اللي مش عاجبنكم.دول اساسا تجار ولاد هرمه و مخهم يوزن بلد.مش فقر و عنطزة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

