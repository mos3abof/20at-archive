[[comments]]
order = 176
subject = "كلمه حق فى خضم المعركه"
author = "اسامه السورى"
posted = "2006-11-06"
text = "نعم انها كلمه ارى الحقد على اخوانى المصريين كثيرا فلا اعلم سببها فمن هنا تاتى قنبله ومن هنا ياتى صاروخ لماذا كل هذا الحقد لعن الله عقولكم يا خليج فانتم غباءكم مستحكم ولقد زاد الطين بله بذاك المتعجرف المتفاخر بيباضه المسمى ابن العرب فحقيقه ضحكت جدا من كلامه هل تتفاخر بالجمال اوكيه هل تتفاخر بجمالك انت ام بباقى الخليج الغبى اذا كنت تتفاخر بجمالك الظاهرى فما هو مقياس الجمال عند الرجل وعندك؟ واعلم يا هذا ان اهل مصر فيهم الجمال الاخذ فانت لم تزور مصر مثلى لعلك تقابل العماله المطحونه عندكم فكمال يقال ان مصر هليوود العرب ففيها الفتن ومصر وسوريا متشابهتان فى كل شئ حتى فى الطبع فاخسأ ولا كرامه يا ابو الحمق"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 177
subject = "الى اسامه السورى"
author = "ابن العرب"
posted = "2006-11-06"
text = "يا اسامه اقراء عدل من الموضوع وراح تشوف من اللي بدا ومن قال اني احقد والله العظيم وانا حلفت بربي لااحقد وبعد احقد على ايش ؟ انتو اللي تشتمون وتحقرون وهذى دليل على شعوركم بلنقص اما للمصري ياللي يتكلم عن الجمل يامصري الحمير والجمل عندكم انتم وتركبون به واحنا العرب اول من ركب الاحصنة ولانرضا بركوب الجمال واحد مثل حسبي ونسبي العريق واما عن العمال اللذين ياتو لدول الخليج او اننا نأتي بهم السبب في قله عدد سكاننا بكل دولة خليجية يوجد بها فقط عدت مئات من السكان وسبب الثاني اننا لانرضا ان نشتغل بأي من الشغلات العادية مثل المصريين ويا سوري لاتتشبه المصريين بك فانت من دم ثاني وهم من دم ثاني لايوجد بكم عرق واحد"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 178
subject = "للمصاروة"
author = "ابن العرب"
posted = "2006-11-06"
text = "انا لست كويتي يامصري وقولك اننا من سكان الخيام انا يافلاح من سكان القصور وسكان الخيام هم البدو الريفيين يعني احنا سكان المدن ويوجد كثير من بقايا قصور اهلي بلمنطقه وبلدي له تاريخ تجاري بين الشرق والغرب من قبل الوف السنين ولما رجعت الطرق التجاريةاحتلينة من قبل البرتغاليين في سنة 1500 تقريبان بس لم نسكت انتصرنا عليهم بقيادة الامير محمد ال مسلم وهم من نسل الصحابي خالد بن الوليد كان هو واسرتة من الاسرة الحاكمه ببلدي في ذيك الايام وفي سنة 1800 تقريبان احتلينة من قبل الانجليز ولاكن بقيادة الامير محمد بن ثاني طردناهم من البلد وقبل 130 سنة احتلينة من قبل العثمانيين وصارت معركه اخرة وانتصرنا بقيادة سمو الامير العظيم قاسم بن ثاني يعني بلدنا كانت طرق تجارية ولدينة بيوت وقلعة ذات المعمار العباسي اكثر من 300 بيت وللعلم بلدي لم تكن مؤهلة بلسكان على طول القرون وكانت ضمن دول كثيرة واحنا لم نكن بلبلد وانا وضح رجوع اهلي من الشام والعراق يعني كل بلد لايسكن فيها الشعوب طول القرون لانه كانت بلدان الخليج ضمن دول والخرائط تتغير على مدة القرون او المدن اللتي كانت عاصم الدولة"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 179
subject = "الىابن الغبيه اللى مش بيفهم"
author = "احمد"
posted = "2006-11-06"
text = "يا ابن الحماره العبط باين من كلامك يا غبى هناك العائلات فى مصر تنتسب الى الحسين بن على رضى الله عنه فهل انت اشرف منهم نسبا ومع ذلك هم مصريين ومتزوجين من مصريين وليس هناك فرق سواء فى اللهجه او فى الشكل يا ابن الكلب يا اهبل صدقينى انت شغال عمال تتكلب عن نسب والقبائل وهذه الحاجات انتهت من زمان ده دليل انك واطى وابن واطى اشك انك نسلك عربى اصيل انت عارف وحياه امك يا حمار يبدو ان نسب جدك الاصل هندى او زنجبارى لان معظم الخليج اصولهم ليست عربيه بل ايرانيه وهنديه ووسكنوا مع السكان الاصليين وكل منهم مع مئات السنين نسب لنفسه نسب قبائل زوا ومع الايام الكذبه اتصدقت يا ابن الزفت يا واطى صدعتنتا من نسب امك شكلك ابن حرام وعندك نقص وبتبين نفسك انك عندك اصل وانته مش عند امك دم انا مش عارف مستحمل غبائك وعايش على الدنيا من غير مثل البهائم بل ان البهائم افضل منك يا كلب يا اللى مش عندك اصل اتفوه"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 180
subject = "هددوء"
author = "فهد الجوفى"
posted = "2006-11-06"
text = "عندما دخلت الى هذا الموقع عن طريق الصدفه شاهدت كم من السب من الطرفين بل تعجبت من التفاخر بالانساب انصح الاخوه بالبعد عن هذا وكفى يا ابن العرب تجريح فى اهل مصر الكرام فلن تعدوا قدرك باعتقادى انك انسان مجذوب به جن فاتركوه يا اخوه ولا تسبوه فنحن نحب اهل مصر واهل مصريحبوننا وكان هناك من عده ايام ان علنت جريده المصريون باقتراع من فئه عشوائيه عن طريق الاتصال بالجوال ان اكثر بلد يحبها المصريين هى السعوديه بلد الحرمين وان اكثر بلد يكرها المصصريون هى اسرائيل وامريكا فدعوا هذا الشخص الذى اشك انه مسلم وسنى فيبدو من كلامه انه يحمل حقدا لاهل مصر النشامى وحيا الله مصر اخوكم فهد من بلاد اقدس الاماكن"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 181
subject = "للسعودي"
author = "ابن العرب"
posted = "2006-11-06"
text = "يا سعودي اقراء الردود وراح تشوف من اللي احتقر الاول وسب الاول وانا دخلت الموقع بلصدفه كنت ابحث بgoogel وشف كثير من الردود السب والاحتقار للعرب وهم جهلة بتاريخ العرب ونسب العرب قلت اوضح لهم وللمصري اللي يغلط على الامهات ويطعن وفي النسب الرسول حرم الغلط على الامها وقال انها من الكبائر قال رسول الله صلى الله عليه وسلم اثنتان في الناس هما بهم كفرالطعن في النسب والنياحة على الميت لا تطعن بنسبي ومعروف عن العرب بتعصبهم لايرضون ان يتزوجو من الخارج وانت تقول اني اتكلم عن القبائل وغيرها يااخي انتو ذكرتو التاريخ والحضارات قلت ارد عليكم وللاخ اللي يقول اني لم ازور مصر اقولك اللي زار مصر معى احترامي قعد يشتم فيها وفي الاستغلال والشحت والخرابة تظن بعدها راح نفكر نيجي مصر ومعظم اللي بمصر من الخليجيين هم سعوديين لانة جامعاتهم لاتقبل الا بمعدل عالي او الي ياتون مصر لجامعات الانتساب"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 182
subject = "الى احمد"
author = "ابن العرب"
posted = "2006-11-06"
text = "يا احمد ايش دخلك بلاشراف ؟ مش هم عرب ؟ يعني ليسو منكم على العموم اظن من الافضل اغلاق الموضوع او عدم الرد لاحد لانة شكله طول وانا زهقت ههههه وكل له مجدة واصلة"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 183
subject = "الى ابن الجرب"
author = "احمد سيدك يا جرب"
posted = "2006-11-06"
text = "انا مش عارف مستحمل تقل الدم اللى عند اهلك اذاى واذاى مستحمل السماجه اللى فى دمك يا اهل الخليج يا من احترقتم للرد هذا عينه منكم يتكلم عن شكل وعن اصل اعرفتم بغبائكم وبان الغرب يضحك عليكم والى البنت المستبده اخليجيه يا هانم مش انتى بتقولى على التحرش الجنسى اللى عندنا فى الشوراع طيب ما تشوفى حادثه الاغتصاب اللى تناوب عليها اكثر من فرد على فتاه مسكينه فى القطيف لاحول لها ولا قوه وشوفى الدعاره علنا فى فناديق دبى والكويت والامريكان يرخصون اعرضاكم فى القواعد الخليجيه الامريكيه عجبت لك يا زمن اللى على راسى بطحه يحسس عليها بلاد الخليج مشهوره على علن بانها ام الدعاره وفى الفناديق السياحيه يا ابن اجرب اين شرفك يا عربى اليس العربى له شرف ونخوه هههههههههههه روح العب يا وله بعيد انت شكلك فاضى وتافه وامك بتصرف عليك تلاقيك مش ليك اى فائده فى المجتمع غير السهر على الكمبيوتر وملاحقه البنات الوسخين وبعدها تنام كالخنزير هههههه"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 184
subject = "يا احمد يانجس"
author = "ابن العرب"
posted = "2006-11-06"
text = "مابقى غير واحد مثلك يتعالون على احفاد الانبياء ولن ارد على ابن الفقر انا من سلالة عظماء وان الله اصطفى بني إسماعيل على العالمين واحنا من ال اسماعيل نبي الله بن ابراهيم نبي الله ولن ادخل الموقع مرة اخرا واعيد الرد على سفهاء ولا يهمني نبيح الكلاب"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 185
subject = "فى ستين الف داهيه يا حمار"
author = "احمد"
posted = "2006-11-06"
text = "اخوانى واهلى اهل الخليج الشرفاء فقط اعتذر لكل لفظ تلفظت به ولكن انا لااعمم على فكما ان هناك الحقير مثل هذا ابن العرب فهناك الشريف فهو ابن الجزمه يتعالى ولا ينسى ان الامارتيين والكويتيين كانو ياتو لمصر فى الثلاثينات وشاهدو شوراع مصر المسفلته ويتعجبون من نظافه الشوراع وسفلتتها وهم الذين علمناهم فكما ان هناك الحقير فى بلدى فهناك الشريف ايضا وانتم كذلك فانا لااعمم واقول لابن الغبيه الاحمق هذا الخنزير القبيح على راى المثل القرد فى عين امه غزال فاكر نفسه وسيم واقول له فى ستين الف داهيه امشى ومش تيجى نهائى وياريت يا ابن اغبيه تقول لاخوانك الاغبياء مش يعتبوا مصر ابداا ما عدا الشرفاء فقط وليس الاغبياء مثل يا جزمه"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 186
subject = "واعرف يا ابن الغبيه"
author = "احمد"
posted = "2006-11-06"
text = "واعرف يا ابن الغبيه لو كنت قرات ردود الاخوه المصريين عندما تفاخرت بنسب سيدنا اسماعيل با نه ابو العر بفرد عليك ايمنى ثم قال لك اخ ان المصريين اصل العرب قول ليه ؟ هقولك يا حمار اصلو انتوا حمير مش بتيجوا الا بالتكرار فالتكرا ر يعلم الى الحمار عشان يا زفت ام سيدنا اسماعيل اسمها هاجر عليها السلام فهاجر مصريه افهمت يا غبى مش بقول انتم اغبيه وصدق اللى قال الخليجى مش همه االا كرشه وفرجه اتفوا على اصلكم يا هنود وليس عرب"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 187
subject = "هل هذه امه محمد صلى الله عليه وسلم"
author = "نور الدين المصرى"
posted = "2006-11-06"
text = "كيف تريدون من الله ان ينصر امتنا وانتم تكنون كل هذا الحقد والكره لبعض<br />ارجوكم راجعوا انفسكم وحاسبوا انفسكم قبل ان تحاسبوا<br />رابعا: ليس ابداً من اخلاق المسلمين ان نسب بعضنا ونقول يا غبي او يا غبية<br />ارجوكم استيقظوا واعتذروا لبعض حتى نخلص النية لله وينصرنا بجد<br />وجزاكم الله كل خير وهداكم"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 188
subject = "الى ابن العرب واحمد"
author = "مسلم"
posted = "2006-11-06"
text = "يا ابن العرب نحن نعرف اننا من نسل اسماعيل بن ابراهيم ونفتخر بها بس لايجب ان تحقر العالم علشان نسبك ويا احمد لاتدخل الامهات بلشتم وما دخل امه بواحد باين علية لايتجاوز 20 سنة ويشتم بلعالم وانت نفس الكلام لك لاتحقر الغير وتذكر ايام كنتو كذا او كذا وهم سيذكرون ايام الخلافاء كانو وكانو والكل سيقعد ويذكر ماذاكان او من هم الان كالنة مسلون وقال الخليفة العظيم عمر رضي الله عنة نحن قوم اعزنا الله بالاسلام فان ابتغينا العزة بغيره اذلنا الله شوف حال العرب من الخليج الي المغرب قبل الاسلام كنا تحت سيطرة الفرس والروم من الخليج لحد الروم"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 189
subject = "الى الاخ مسلم وجميع الاخوه"
author = "احمد"
posted = "2006-11-06"
text = "اخى المسلم احييك بتحبه الاسلام اخى لقد حاولت فى بدايه كلامى احترامه فهو يعيب على شكل المصريين ويحتقرهم كان المصريين عبيد عنده ولقد تابعت الردود جيدا فقد كان الاخ هشام حليما معه وهو ما ذال على قله اديه فحاولت ان اتصدى لوقاحته هذه هى الحكايه فيا اخى العزير المحترم نحترمه والغير محترم نرميه من الشباك ولك من تحيه على اخلاقك وربنا ينصر الامه الاسلاميه ويعلم الله انى مسامحه حتى لو لم يسامحنى فهو يبدو من كلامه انه مازال مراهقا وصغيرا التفكيرا فمعذره للجميع عربا وعربانا فتحيه من اخيكم فالعفو من شيم اخلاقكم يا عرب وليس للمتطفلين عليكم الذين يشوهون سمعتكم مثل هذا المتطفل وسلام الله عليكم ورحمته وبركاته"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 190
subject = "الى الاخ المصرى الاصيل وقفه لو سمحت"
author = "ممدوح المنصوره"
posted = "2006-11-07"
text = "يا اخى من كلامك يدل انك انسان محترم وانا مصرى مثلك وعايز اقولك حقيقه الشيعه وجيش المهدى اللى انته بدافع عنهم لو تفضلت ادخل على هذا الرابط وستعرف القليل عنهم لان معظم اناس مخدعو بهم ويعلم انهم على خطأ ادخل وستعرف الدليل الساطع والبرهان القاطع وحكم العقل يا اخى"
archived = "2006-11-22"
