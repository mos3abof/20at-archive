[[comments]]
order = 95
subject = "الي عمتكم اقصد خدامتكم"
author = "مصري صميم"
posted = "2006-10-02"
text = "انتي ياهبله انتي لو بصيتي في المرايا هاتقرفي وتبصقي علي المرايا من انتم وايه تاريخكم يا بدو ياللي طول عمركم بتشحتوا من المصريين احنا كنا بنبعت لكم المدرسين والكتب الدراسية علي حسابنا وكنتوا بتنتظروا الحجاج المصريين عشان تشحتوا منهم لان المصري دايما سخي وكريم الدعارة والزنا واللواط ده سمة مجتمعاتكم اللي بتحاولوا تغطوها بعباية سودا عشان ماحد يعرفها وهي رايحةتزني و بعدين خليجي ايه وزفت ايه انتو عارفين تشغلوا بلكم وتعيشو كابني ادمين الا بالاجانب عموما وبالمصريين خصوصا روحي يا بت ياهبلة ياتافهه انتي ارجعي لاصلك البدوي المتخلف وروحي اقعدي في الخيمة اللي لسة طالعين منها قريب جدا روحي احلبي الناقة واجري ورا الغنم يا غنم واوعي تتجرأي تاني علي اسيادك المصريين عشان مايدوسوكي تحت جزمهم يا محدثة نعمة يا شعوب طول عمرها جعانة وفقرانة ما بتدوش تشبعوا غير من سنوات معدوده بعكس مصر بلد الخير والنيل والحضارة من الاف السنين"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 96
subject = "read my post :("
author = "فتاة سعودية"
posted = "2006-10-05"
text = "أوووف !! كل هذا -___-<br />انا خلاص نسيت الموضوع، الردود هي العجيبة<br />~ اولاًً: الرجاء عدم التعميم مو كل السعوديين كائنات شريره و عنصريه (وهذا موجه للأخوه و الأخوات المصريين اصحاب ردود غير لائقة البته)<br />~ ثانيا: في احد الأخوان ذكر إن المصريين اللي يعملون بالسعوديه يحولون ملايين لأهلم بمصر !! طيب و بعدين! الملايين هذي مو صدقه هذي من جهدهم و عرقهم يعني مافي داعي للـ \"تمنن\" من غير سبب لإنك بالطريقه هذي \"بتزيد الطيب بله\"<br />انا لاحظت كثير مصريين ماخذين فكره جداً خاطئه عن السعودين إننا ناس متخلفين و جهله و قحيين<br />ابداً هذا غير صحيح<br />بالعكس في كثيييير ناس محبين للعلم بأنواعه وانا اولهم<br />*اه قبل لا انسي الأخت \"مووووتول قهر\"<br />..... اسلوب سوقي بشكل غير طبيعي و كلام غير منطقي و أسائتي لنفسك بكلامك و هذا يدل على عقليه ضيقه جداً هداك الله<br />anyway مصري vs سعودي<br />متى تنتهي هذي الحكايه ؟؟؟<br />واتمنى عدم التعميم حبايبي :)<br />واتمنى من اي مصري او مصريه عملوا بالسعوديه و قرأو ردي هذا انهم يتفضلون ويشرحون تجربتهم بالسعوديه<br />نحبك يا مصر و كل مصري و مصريه على العين والراس انتم اخوانا و اهلنا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 97
subject = "مسألة البدو / و رد للأخط \"مصري صميم\""
author = "فتاة سعودية"
posted = "2006-10-05"
text = "معليش نسيت شئ<br />مصر بلد حظاره اكيييد<br />بس يعني ايش السعوديه بدو !!!<br />معلومه جدا مهمه اتمنى تعرفوها<br />اغلب سكان الجزيره سكنوا القرى المدن منذ قبل عهد الرسول عليه الصلاه و السلام !!<br />معلومه جديده لكم صح<br />صحيح إن فيه كثير قبائل تسكن \"الباديه\" بس مو كل سكان الجزيره سكنوا الباديه جزء منهم فقط<br />و عشان أأكد لكم انتم شفتوا مسلسل الزير سالم ؟ فين كانوا ساكنين ؟؟؟<br />و حتى القبائل اللي سكنت الباديه هذا ما تعتبر اهانه<br />مصري صميم.. الله يهديك قذفت اكثر من 20 مليون مسلمه بكلامك<br />محد يجبر البنت تتغطي عندنا على فكره,, من لاتريد الغطاء تكشف ولكن اعلم إن كل من تغطي وجهها هذا بإرادتها هي و أحساساً بقيمتها"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 98
subject = "عاملين من الحبة قبة"
author = "افنان"
posted = "2006-10-06"
text = "خلاص يا جماعة صلوا على النبى واهدواكدة وصلوا على اللى هيشفع فيكم بلاش يعنى نقعد نشتم فى بعض دة احنا كلنا مسلمين بنشهد ان لا إله إلا الله وان محمد رسول الله وكفاية كمان انى احنا كلنا بنصوم فى شهر واحد ومؤمنين برب واحد ولينا كتاب واحد (القران الكريم)وبلاش نسمع لناس عايزة تفرق ما بينا احنا مش نافصين تفرقة احنا اصلا ما تفرقين خلقة فمش طالبة الحكاية تفرقة اكترمن كدة وبعدين انا اعرف ناس خليجيين كتير بيحبوا مصر والمصريين ومقتنعين انى مصر ليها الفضل عليهم لانى لولا حرب اكتوبر وانتصار المصريين فيها ماكان البترول غلى وما كانوا همابقم اصحاب فلوس وربنا يسماح اى حد شتم فى مصروالمصريين.<br />وكل سنة وانت طيبين بمنسة رمضان"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

