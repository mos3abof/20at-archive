subject = "شهامة المصريين"
author = "رامى احمد ماهر"
posted = "2006-12-01"
text = "انا مصرى وابن مصرى وعاوز اتعرف على كل المصريين واللى عاوز يتعرف علية انا الموبايل بتاعى 0102091396 وانا فخور انى مصرى لان الجندى المصرى اشجع جندى فى العالم والعالم يشهد بكدة ومهما العرب فهم فى الاول والاخر هما اخوان لينا لانهم عرب مثلناوالعربى بيحب اخيه العربى"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190217/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 256
subject = "رد الجميل"
author = "شهاب"
posted = "2006-12-04"
text = "واللة ياباشا التقرير جميل وحلو بس انتة نسيت انهم عرب ومسلمين زينا والعربي مش مصري وبس العربي كل واحد فينا زيك انتة ياللي كاتب المقال لو دورت علي ساسك وراسك حتلاقية مقطوع من الجد الرابع او الخامس والباقي نطة فرنسي ايام حملة نوبليون او من المماليك اللي هم اصلا كانوا بلا وطن ولا ارض ولمة اجو مصر بقة ناس وعيلة ولمة ... رد الجميل انا مولود فيالكويت ومشفتش ناس مؤدبة ومحترمة وغير كدة بيهتموا بالمقيمين زي الجماعة دول اي نعم في منهم ناس معرصة بس الاكثرية ناس محترمة وتستاهل كل تقدير وانا واحد من الناس منكرش ابدا ان الشيخ جابر رحمة اللة كان دايما كل سنة يوقع ميزانية فلوس موجهة بس للمقيم وبيعاملة زي صاحب البلد بإختلاف بسيط طبعا فانا اقول كلمة حق .... ياصاحب المقال ... أصلك فعلك ... والسلام عليكم يااااللي جدك عسكري من عساكر نابيلون"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190217/http://masr.20at.com:80/article.php?sid=840"

