[[comments]]
order = 12
subject = "الي بشوف مصيبة غيرو"
author = "انا فاهمة عليك و عارفة شو الي مخليك معصب يا اخي بس انت شوف شو بيعملو بالاردن بتبطل زعلان"
posted = "2006-08-26"
text = "يعني احنا البصيف السائحين العرب مش بس بحتلونا لا بنافسونا بلقمة عيشنا<br />يعني الصيف عنا رفع اسعار مش طبيعي بسببهم<br />و ما بتعود اتلاقي شقة واحدة للاجار و ان لقيت بسعر خيالي يعني عنا الي بدو يجوز بشهر 7 او 8 بيستاجر الشقة من شهر 1 او 2 و بدفع اجار 6 او 7 اشهر و هو مش ساكن طب مش حرام<br />و المصيبة الكبرى بتتلخص بالشوارع ما بعود في مكان لتركن سيارتك و الطريق الي بتاخد 10 دقايق بتصير تاخد منك ساعة الا ربع<br />و اذا حبيت تطلع ترفه عن حالك بتنصدم من الاسعار الخيالية للكفيهات و ما شابه<br />و لهلا انا مش عارفة شو بستفيد من جيتهم و شو هالسياحة الي بنعشوها"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 13
subject = "من واحد مصري"
author = "محمد النقيب"
posted = "2006-08-26"
text = "الى كاتب هذا المقال..انت انسان عنصري ومريض بالدونيه..لم كل هذه المشاعر السلبيه..ماذا فعل لك العرب..يريدون ان يأتوا ليكونوا في مكان يحبونه..وانت مالك؟..بدلا من ان تتكلم عن العرب تكلم عن الاسرائيليين الذين يملئون سيناء كسياح..اذا كان بعض العرب عنصريين فلا فرق بينك وبينهم بعد هذا الكلام الذي لا يصدر الا عن شخص مريض بجد..ربنا يشفي قلبك من مرضه.."
