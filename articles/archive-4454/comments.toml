[[comments]]
order = 65
subject = "الاعتذار اولا"
author = "محمد عبد الحميد"
posted = "2006-09-05"
text = "أولا قبل كل شيء أحب أعتذر للدكتور محمود عن اي لفظ يمكن يكون زعله من الموقع ، أنا ماعرفش الراجل ده أبدا لكن راجل حارب في سيناء واتصاب في سبيل الله والوطن علشان كلنا نعيش بكرامتنا .. خصوصا ان معظمنا ماحضرش الايام ديه ما يستحقش مننا أقل من تقبيل يده التي حملت السلاح من أجلنا جميعا ، مصريين وغير مصريين ، مش يتهم بالعمالة والخيانة .. وواضح من طريقة رده علي الاهانة انه راجل في قمة الاحترام والتواضع والعقل أيضا ، ولكنني اعتب علي الاستاذ شريف أبو غزالة تفوهه بتلك الكلمات البذيئة التي قرأناها بالأعلي ، راجل مثلك يا استاذ شريف لايصح له ان يتدني لهذا المستوي حتي في الرد علي الأهانة ، ولنا في الرسول صلي الله عليه وسلم أسوة .. ولنا بعده في الدكتور محمود في رده أيضا .. ولا ايه ...؟<br />ثانيا .. الموضوع متحيز شوية .. يا استاذي الكاتب كل شعب فيه الصالح والطالح .. ولا ايه برضه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 66
subject = "زغرتوا يا عرب على خيبتنا التقيلة اوى \"لووووووووولىىىىىى\""
author = "مصرية"
posted = "2006-09-06"
text = "ايوة انا مع الاستاذ احمد الالفى احنا نضرب بعض ولا اقول لكم بدل مانضرب بعض احنا نقول لامريكا تضربنا بقنابل ذرية ايه رأيكوا.<br />بصراحة حاجة تفرح يا عرب بجد حاجة حلوة اوى.<br />واحد يقولك الموضوع فيه عنصرية .عنصرية ايه بس .عنصرية ايه يا اساتذه دة احنا العرب كلنا معندناش كرامة وتقولوا عنصرية لما كرامتنا ترجع ودة طبعا مش هيحصل نبقى نشوف العنصرية اللى بتتكلموا عليها.<br />ولا الاساتذة اللى قاعدين يشتموا فى بعض بأفظع الشتايم مش مقدرين انى ممكن تكون اختك او والدتك بتدخل على الموقع وهتشوف الشتايم الفظيعة اللى مكتوبة ولا بقى الناس اللى قاعدة تشتم فى اهل الخليج ولا بقى الناس اللى قاعدة بتشتم فى مصروالمصريين ولا بقى الموقع اللى مكبر دماغه انه يعدى يشوف التعليقات وانه يحذف التعليقات اللى فيها قلة ادب ولا بقى عدم احترام رأى الغيرولا ايه ولا ايه ولا ايه حاجات كتير اوى.<br />يا سلام علينا ربنا يحفظنا زغرتوا يا جماعة على خيبتنا الكبيرة اوى اوى خيبة العرب قاعدين بنشتم فى بعض واحنا مش عارفين كام بيت دلوقتى بيدمر فى فلسطين كام طفل بيتشرد فى العراق كام عرض بينتهك .مش ليه حق انى ازغرط على خيبتنا .<br />وانا بعتذر لكل وواحد او واحدة اتشتم او شاف شتايم فظيعة مكتوبة سواء كان مصرى او خليجى او سورى او لبنانى او مغربى او تونسى او جزائرى او حتى سودانى .<br />واهلا بيكم فى مصر يا اهل الخليج ويااهل المغرب العربى ويا اهل السودان ويا اهل الشام نورتم مصر يا عرب.<br />بس احب اقول إن لله وإن إليه راجعون فى العرب .والله يرحمك يا سعد زغلول انت قلتها حكمة \" مافيش فايدة\""
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

