author = "مصرى مسلم ولى الفخر"
posted = "2006-11-11"
text = "روح فى داهيه يا قطرى يالى عامل نفسك سعودى السعوديين كلامهم معروف بالالفاظ المحترمه لعنه الله عليك ي حاقد كان المصريين اولاد عبيد زنوج اتق الله فانت مريض وفاضى ياهذا بكره البترول يخلص مش عارف هتعملوا ايه بعدها تذكروا مصر كانت فاتحه لكم ابوابها وهى التى علمتكم الان صرتم تحتقرونها وتنعتوها باللقر والشحاته بكره تزول النعم التى كفرتم بها واعطيتموها لاعداء الاسلام الامريكان سجل يا تاريخ من الان على هؤلاء الاغبياء من المحسوبين زورا على الاسلام والعرب النجباء احساسى يدلنى خمسون عاما فقط وسيتغير مجرى التاريخ وستعرف يا من حقد على اهل مصر لكم الله يا شعب مصر من هؤلاء الحاقدين لكم الله"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 220
subject = "مصر بلدي.. ولا يهمني كلامك"
author = "احمد - السعودية"
posted = "2006-11-12"
text = "مرحباً بالجميع<br />اخي كاتب الموضوع مهما كان هدفك من المقالة لن تثنيني عن زيارة مصر سنوياً، فأنا اعتبرها بلدي واحس وانااتجول في شوارع القاهرة والاسكندرية كانني اتجول في شوارع جده والرياض.. فالود بيننا وبين المصريين واضح ولا يحتاج ادلة.. فنحن اهل وبيننا النسب والرحم... وان كانت مناظر ملابسنا (العباءة والثياب) تكسر الحس الحضاري لديك .. فلا تنسى بانها ملابس جدك وجدتك .. ولا خير في حاضر ان لم يكن له ماضي عزيز .. او كما تقولون انتم (من فات قديمه تاه).. فالثوب لبسنا الرسمي الذي نعتز به .. والعباءة لنسائنا دليل الستر والعفة..<br />ومن ناحية عنوانك فهو يخفي الكثير الكثير.. فان كنت مهتماً بالاحتلال .. فلا اعتقد ان هناك اكثر من فلسطين المحتلة خصابة لمواضيعك.. اما نحن فزوار وضيوف ونحسب انفسنا اصحاب مكان .. فلم ناتي لنحتل ونستوطن ..<br />حاول استاذي ان تنزل من برجك العاجي لمستوانا ... فنحن اخوان بالاسلام اولاً .. واخوان بالعروبة ثانياً ... واخوان بالانسانية ثالثاً ... فتلك الروابط متينة ولا تخترق ... فلا تتعب (قلمك) وتحاول ان تختبر مدى صلابتها ..<br />واخيراً اشكر جميع اخواني المصريين وغيرهم الذين ارتقوا في حوارهم وحديثهم ... وحاولوا ان يوضحوا لنا مدى اختلافهم مع توجه الكاتب الفاضل..<br />واقول للبقية من خليجيين ومصريين ... أن احترام الآخرين مرحلة دائماًما تلي احترام النفس ..<br />شكراً لكم<br />اخوكم احمد من السعودية .. بلاد الحرمين الشريفين"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 221
subject = "يحيا العرب جميعا وليموتوا بيغظهم"
author = "حسام المصرى _ الجيزه"
posted = "2006-11-12"
text = "فليموتوا بغيظهم النصارى اولاد الكلب الذين يحاولون ان يفرقوا بين اخواننا السعوديين وكل اهل الخليج اللهم يارب شل يد صاحب المقاله الحقير وبصفتى انا مصرى اتبرا لاخوانى من هذا الكلب صاحب المقاله وعفا الله عن من سب اهل مصر وعفا الله عن من سب اهل الخليج من مصريين فانتم اخوان فى الدين ارجوا ان تتركوا هذا الموقع الحقير مصريين وعرب لانه نصارنى يدس السم فى العسل بمقالته فلقد اجتمع العلمانين والنصارى مع بعض اللهم فرق جمعهم يا كريم ويا اخوانى كفى من تعليق فلقد تعبنا وسامح الله الجميع فلكم اعشق اهل الخليج باصالتهم كما لى اخوه منهم يعشقون مصر فانتم نحن ونحن انتم حفظ الله بلادنا من ايد هؤلاء الانجاس وسلامى للجميع"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

