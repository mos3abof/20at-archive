[[comments]]
order = 133
subject = "الرد موجة للأستاذ محمود وفقة الله و لكاتب الموضوع"
author = "محمد حسن عبدالله"
posted = "2006-10-19"
text = "بسم الله الرحمن الرحين<br />اولا بصفتي مسلم عربي سعودي يشرفني ان اتوجة بالشكر و التقدير للدكتور محمود<br />ثانيا اقول لكاتب الموضوع كلام محدد جدا كعربي : لابد ان تخرج ايها الشريف من مكان تواجدك لتشاهد بقية العالم فعند تواجدك في شارع جامعة الدول العربية في اوقات تواجد العرب بها او تواجدك في دار الاوبرا او تواجدك بمناطق الزحام بشارع الهرم لن تستطيع مجاراة حياة الشعب المصري الحبيب فشرفاء مصر لا يتواجدون في هذه الاماكن.وعندما تلاحظ وجود زحام من شباب عرب في هذه الاماكن فتأكد انهم مجرد ذباب يحوم حول جيفة . فلا الجيفة تمثل كل المصريين ولا الذباب يمثل كل العرب<br />ختاما : اعتذر عن قلة ادب بعض المنتمين لدول الخليج فهم يشبهون الذباب وهو يحومون حول من شابههم بردودهم<br />اكرر شكري لسيدي الكريم الدكتور محمود وفقه الله و رزقة الجنة و هدانا و إياكم و تقبل صيامنا و صيامكم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

