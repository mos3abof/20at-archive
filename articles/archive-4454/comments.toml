subject = "الى المدعو مصراوى واتباعة"
author = "شريف ابو غزالة"
posted = "2006-08-27"
text = "الى المدعو مصراوى واللى زية اللى اسمة باتيستوتا اللى نزلوا هجوم على الدكتور محمود على اساس انه بيسترزق من السعودية اللى متعرفهوش ياجاهل انت وهو ان الدكتور محمود اللى نازلين فيه تريقة وانه باع نفسة للريال اولا ده راجل معاه فلوس من قبل ما يسافر السعودية تشتريك انت وعيلتك انت وهو فوالدة رئيس سابق للمحكمة الدستورية العليا وخاله شقيق والدتة كان وزير من اشرف الوزراء فى فترة السبعينات والثمانينات ده غير انه عنده ميراث ضخم جدا واللى متعرفوش ياجاهل انت وهو انه دكتور من الدكاترة القليلين فى تخصصهم واللى متعرفوش يااغبى خلق الله انت وهو انه كل شهرين بيسافر اليابان يدى محاضرات هناك عارف اليابان اللى اجهل واحد فيها بيفهم احسن منك انت وعيلتك .. تقوم تيجى انت وهو وتغلطوا فى الراجل بالطريقة القذرة دى وانت ياللى اسمك مصراوى ياللى بتقول عندك عمل خاص هنا لو انت حتى عندك ايه ميجيش ذرة فى اللى عنده ولا هو علشان مرضيش يرد تقوم تقل ادبك على اسيادك انا اسمى شريف ابو غزالة وساكن فى ابراج اغاخان الدور التاسع عشر لو انت راجل اكتب لى عنوانك وشوف ايه اللى هيحصل لك انت واللى خلفوك علشان تعرف ازاى تتعامل مع اسيادك وانا تعمدت اكتب عنوانى علشان لو انت عامل نفسك جاكد قوى وبتغلط فى الناس ولا انت فارس على حروف الكيبورد وخلاص وانا للعلم بكتب الرد ده بالنيابة عن الدكتور محمود لانة حلف انه ميدخلش تانى على الموقع ده واتصل بيا وقالى لان انا اللى قلت له على الموقع قبل ما يلم شوية زبالة من امثالك ويقعدوا يغلطوا فى الراجل واحد زى ده معاه نوط الشجاعة ونجمه سيناء فى الحرب يبيع نفسة ياحيوان انت وهو واذا كان هو مرضيش يرد وينزل لمستواكم انا هرد بالنيابة عنه .. شوية اوباش"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 33
