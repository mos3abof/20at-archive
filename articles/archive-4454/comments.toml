text = "يامصاروة اليهود يقولون انهم هم من بنو الاهرامات وقصور الفراعنة بخبرتهم وهم يقصدون ان المصريين ليسة لهم خبرة او ليسو متحضريين هههههههه"
archived = "2006-11-06"
