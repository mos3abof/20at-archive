subject = "medo"
author = "الحرمان الثقافي"
posted = "2006-10-13"
text = "كتب:د.سعود هلال الحربي<br />قبل سنوات كنت اشرف على مجموعة من طلبة التربية العملية في احدى المدارس، وذات يوم احضر لي احدهم مسابقة ثقافية وزعت في جامعة الكويت، وطلب مني مراجعة الاجابات التي كتبها بمشاركة زملائه وكم ذهلت من اجاباتهم، فطالب في المرحلة الجامعية وسيصبح معلما لا يعرف من ذو النورين ولا من شاعر النيل وغيرها من الاسئلة التي كنا نعدها ابجديات ثقافية لنا قديما"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 120
subject = "medo"
author = "السلام عليكم ..."
posted = "2006-10-13"
text = "شلونكم شخباركم<br />كوني كويتي<br />حبيت اعلمكم شالأكووو والماكوووو بالكوووويت<br />بس في الكويت.... نطلب دبل تشيز برغر وبطاط حجم سوبر وبيبسي دايت<br />بس في الكويت .... الناس تروح مطاعم والمجمعات عشان الخز والقز باول و اخر اليل وبكل وقت بعد<br />بس في الكويت.... في بدون<br />بس في الكويت....يطلعون لستات باسامي خلق الله لانه ماكو شغل<br />بس في الكويت... المطار فيه المستقبلين اكثر من المسافرين<br />بس في الكويت....الهنود وعمال شرق اسيا اكثر من الشعب<br />بس في الكويت....دورى كرة القدم ما فيه جمهور بس عمال التنظيف هى اللى تشوف المباراه ومرات تشجع حسب المزاج بعد<br />بس في الكويت....بوق ولا تخاف<br />بس في الكويت .... الشوارع زحمه ليل نهار لان عدد السيارات اكثر من الشعب<br />بس في الكويت....لازم مدرس خصوصي<br />بس في الكويت... الوحده لازم يكون عندها بوي فرند وقيرل فريند<br />بس في الكويت...الي ماعنده شاليه يصير هيلقي<br />بس في الكويت....اذا صار حادث على طريق اللي رايح..الطريق الي راد يوقف حق التطمش<br />بس في الكويت... الي ما تحط ميك اب معقده او قيز<br />بس في الكويت...اليهال الصبيان لازم سبايكي والبنوتات قلوس وماسكارا ( هذه حاولت والله حاولت انى اعرفها ما عرفت شنو المقصود يمكن اكله او اسم نوع من الكيك )<br />بس الكويت ... مذيعه غريبه تخترع لكنه غريبه والبنات يقلدونها<br />بس في الكويت....المواقف فل والمجمع زحمه والمحلات تصفر هدووووء ماكو احد<br />بس في الكويت .... الي عنده فلوس الناس تحترمه واللى ماعنده ما حولك احد<br />بس في الكويت .... في ستاربكس في كل مستشفى<br />بس في الكويت.... ينادون الواحد باسم سيارته"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

