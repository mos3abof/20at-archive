subject = "العربان الغربان"
author = "مصري واتشرف"
posted = "2006-11-23"
text = "أسمع يا طويل السروال يا من تلبس طرحة مثل النساء وعقال وشكلك ورائحتك ووساختك تفوق الخيال ايها العرب الجرب الصحراويين يا أنجس وأحط مخلوقات الله عقولكم دائما في مؤخراتكم بسبب شذوذكم المخزي لا نريدكم في بلادنا مصرنا الحبيبة كنانة الله في أرضه انت اخرك انت وهو تروح تاكل كبسة وتخلي واحد ينيكك وتنام زي الحمار وعقولكم ايها الجرب في أجازة مفتوحة واي واحد فيكم مايساوي نعل جزمة اي مصري اتفو عليكم ولاد شرموطة أنجاس"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014049/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
