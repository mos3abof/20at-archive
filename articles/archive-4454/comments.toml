posted = "2006-10-02"
text = "البنت المصرية هتبص للخليجى على ايه على جماله ووسامته بلا خيبه .<br />شباب ما عندهم ذوق ولا فكر فى اى شئ حتى فى لبسهم لابس جلباب وعليه عقال اسود دا البدوى فى سيناء حاليا اشيك منك .<br />ولا رشاقته شاب له كرش سابقة بثلاثة متر من تخمة الاكل الحمد لله اننا فقرا عشان ما ناكل مثل الثيران مثلكم"
