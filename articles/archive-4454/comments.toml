subject = "المصاريه كلاب"
author = "سعودي ولي الفخر"
posted = "2006-11-16"
text = "اولا اقسم بالله انني ليس عبدالرحمن القطري<br />انا سعودي والحمدلله لي الفخر انني سعودي<br />اما عنكم انتم المصريين الكلاب تحاولون ان تزرعون المشاكل بيننا نحن اهل الخليخ.<br />فأقوول لكم ...تخسووون تخسووون ياكلاااب<br />ويعيش الخليج بأكمله وتسقط مصر السخيفة<br />تفوووو على اشكااال الحاقدين"
