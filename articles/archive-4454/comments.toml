text = "ياسعودي ياوهابي ياحاقد يابطاله يافقر انت تعرف اصولنا ياوهابي وانا من اثرياء العرب قبل البترول ومعظم العوئل الثرية الان هم اثرياء قبل البترول وشوف اميرتكم جواهر الابراهيم صاحبة محطة العبرية الجنسية وانتو معروفين انكم من بقايا حجاج اتو من افريقيا واسيا وهنود وبنغالية للحج ومن بعدها استوطنتم بلصعوطية الوهابية"
