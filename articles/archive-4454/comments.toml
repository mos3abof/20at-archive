subject = "خربوها"
author = "ابو عرب"
posted = "2006-09-11"
text = "انا بقى شاهد عيان وكل يوم اشوف مسخرة من الجماعة اللى اسمهم العرب<br />شباب صايع بيدور على بنت حلوة يقضى معاها ليلة حمرة وبنات عرب تشوفهم تقول محترمين على حق لكن اتضح انهم لامحترمين ولاحاجة تلاقى البنت منهم قاعدة فى الكوفى شوب وتحط رجل على رجل وماسكة الشيشة وبتشدالدخانة كما الفنان ذكى رستم فى فيلم الفتوة وتلاقى الواد ولا البنت من دول راكب حاجة كدة فخمة من اللى بيقولو عليها سيارة لو حسبت تمنها تلاقيها=اجمالى مرتبات موظفين مصر كلها لمدة سبع سنوات متتالية (ماهو مش تعبان فى حاجة) وماشى فى الشارع يتمختر ومايحترمش قواعد المرور ولا حتى المواطنين وتلاقى لسانه اطول من رجله وماحدش من السادة بتوع الشرطة بيقوللو تلت التلاتة كام ماهو مش مصرى بقى<br />ولو كان مصرى كان خد على قفاه واتكسر عضمه & صحيح بلد أمن مش بلد امان<br />أيييييييه واللى قبلنا خدوا أيه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

