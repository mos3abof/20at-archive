[[comments]]
order = 31
subject = "بيقولك فرق وجمع"
author = "BATISTUTA"
posted = "2006-08-27"
text = "فرق تسد دا لو احنا مجتمعين لكن احنا متفرقين على طول الخط ولو المقال هو اللى هيفرقنا يبقى احنا تافهين نافهين.<br />المشكلة فى اغلب المعلقين انه بيدافع وبيرد وواحد تطور وبيتريق على فقر المصريين دا خلاص بقى منهم تطبع با سلوبهم .<br />المشكلة فى الخليجين انهم متأكدين ان مصر ومعاها المغرب بلادة الدعارة والجنس يعنى خلاص انتهى الكلام وده عربى زيك ويعايرك بفقرك وبافلام الثمانينيات زى ما تكون انت اللى مثلتها .<br />لو مش مصدقين عليكم وعلى غرف الشات هتسمعوا العجب فى الشات اكتر ناس بيحقدوا حقد اسود على المصريين هم الكوايته مع اننا اللى محررينهم الكلاب .<br />ورسالة شكر لكعبول الفهيم اوى اوى .مقالك اكد لى حاجات كتير متأكدة اساسا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

