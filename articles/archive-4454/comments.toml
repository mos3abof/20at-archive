subject = "سوف اقاطع"
author = "هشام من مصر المسلمه"
posted = "2006-11-06"
text = "ظهر احمق جديد من بلدى ياسامى الوسيم قلت للغبى ان هناك القبيح فى كل بلد وهناك الجميل فبطل حماقه مثله ام انكم تافهين ساذهب بلا رجعه من كلامك الغبى لانكم ناس متخلفين عقليا اى والله ناس متخلفين عقليا"
archived = "2006-11-22"
