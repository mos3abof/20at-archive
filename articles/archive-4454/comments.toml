[[comments]]
order = 110
subject = "مسخرة"
author = "الطارق"
posted = "2006-10-10"
text = "first think I wont to say to dubai sucks you will find me some day above your sistr In dera<br />لأن المصريين عرب وكفاية تخلطوا العروبة بالاسلام يا...<br />ولو المصريين مش عرب حيبقوا إي توتو موتو<br />واللهجة المصبرية لغة متفرعة من الموزمبيق<br />بس حييجي يوم إنشالله وحتعرفوا إن العرب هم<br />خير أمة مش الاسلام لان العرب هم اللي نشروا الاسلام بالقوة<br />وماكان حد غيرهم حيحرر مصر من الاحتلال الروماني<br />حاعطيكم لمحة عن قبيلتنا اللي ساعدت<br />ونسقت فتح الشام مع الرسول ذات نفسه لأن الشام كانت محمية رومانية يعني كل حاجة بتزرعها بتخذها روما<br />وانتوا أكيد عارفين الحكاية<br />بس الفرعنة دي حكاية عاوزين يشربوها على شان يبقو المصرييين ملهمش لازمة كدا يعني زي اللي عايشين وخلاص ملهش هدف ولا قضية<br />وشكراً ياسيدي"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 111
subject = "غبى منه فيه"
author = "رضا البرعى"
posted = "2006-10-11"
text = "الى الطارق اللى مش عارف اصله وملته ايه.........اولا قبل كل حاجه اما تيجى تذكر سيرة سيدنا محمد صلى الله عليه وسلم....لازم تتكلم بطريقه مهذبه مش تقول الرسول ذات نفسه ايه يابا انت بتتكلم عن واحد صاحبك ولا ايه.......... حتى لو انت مش مسلم لازم تاخد بالك وانت بتتكلم عن اشرف الخلق وسيد الانام...ثانياعندى ملاحظه فى كلامك الملخبط اللى اتحداك انك لو قراته مره تانيه اتحداك لو انت ذات نفسك فهمته........انت يا بنى مش قادر تجمع جمله مفيده مدخل كذا موضوع فى بعض فى اقل من خمس سطور جايب اكتر من 10جنسيات مش فاهم انت مصرى ولا مش مصرى ..مسلم ولا مش مسلم....مع الفراعنه ولا مش معاهم .....انت بتشكر فى العرب ولا بتشتمهم........انت ايه حكايتك بالظبط انت شكلك ملخبط اصلا....ثم مين اللى انت بتقوله شكرا ده انا عايز افهم...."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

