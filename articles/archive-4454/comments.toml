subject = "ابقى سمعنا صوتك"
author = "رضا البرعى"
posted = "2006-10-10"
text = "الى المنهوب عربى. اولا يا منهوب هو اللى يقول الحق فى الزمن ده وووووووووويكون وطنى ويحب العرب اللى هو منهم يبقى برياله شكرا اوى على كلمتك دى يا عم المنهوب ثانيا اما انت عارف اللى انت منهوب ومتاكل حقك طيب يا سيدى ما تسمعنا صوتك وتقول لالالالالالالالالالالالالالالالالالالالالالالا . ولا انت خايف وبرياله عرفت مين فينا اللى برياله يا منهوب ثالثا ودى اهم حاجه لانها غلطه كبيره اوى فى حقى . اكن بقى يا سيدى واحد من عائلات البرعى با لدقهليه يكون جعان انت يابنى غلطت غلطه كبيره."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 108
subject = "اتقوا الله فيما تقولون"
author = "احمد عثمان"
posted = "2006-10-10"
text = "يقول تعالى (ما يلفظ من قول إلا لديه رقيب عتيد) فكل بلد به الصالح والطالح حتى الأخوة الأشقاء من أب وأم واحدة ليسوا سواء..... أشهد الله أني قابلت أخوة سعودين أشبه بالصحابةفي معاملاتهم والعكس فاتقوا الله ولا تأخذوا الحسن بالسئ , فمصر فيهامن كل الأطياف ....ومن كان بيته من زجاج فلا يرمي الناس بالحجر !!!!!!!!!!!!"
