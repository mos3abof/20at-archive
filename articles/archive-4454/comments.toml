subject = "مضبوط!!!"
author = "واحد وخلاص"
posted = "2006-08-26"
text = "أظن أن الكلام اللى فى الموضوع مافيهوش حاجة غلط إطلاقاً...و أكيد كل واحد منناشاف حاجة من اللى مكتوبة فى المقال \"بأمى عينيه\"... و بالنسبة للى بيقولوا أن الموضوع عنصرى.. أظن أن اللى كتبه بيتكلم عن \"السياح العرب\" مش \"العرب\".. ممكن فعلاً عنوان الموضوع يكون مش تمام أوى (بس هوا برضو مغلطش كتير.. ماحنا نعتبر برضك محتلين ... عن بعد.. بالريموت يعنى.. و كلنا عارفين الريموت موجود فين).. أما بالنسبة للأخ اللى بيقول أن الاقتصاد هيتضرب و مش عارف أيه.. يا حبيبى الاقتصاد عندنا بسياح أو من غير سياح، ببترول أو من غير بترول، بأريال أو ببرسيل.. كان وسيظل اقتصاد مضروب بالنار... ليه؟؟ .. لأننا ببساطة سلمنا دقوننا لشوية حرامية بيحكمونا!!!"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

