subject = "هذا الكلام صحيح مائة في المائة"
author = "سليم جواد"
posted = "2006-12-25"
text = "انالعرب هم اسوأ امة على الاطلاق الم يحتلوا العراق ويذبحون اهله الاصليين ويجعلونهم خدما .. لماذا ينكر البعض ذلك<br />نعم احتلوا مصر وجعلوا من سكانها الاصليين يبدون كاللاجئين وراحوا يطردزنهم ثم يعلمونهم اسوأ العادات المعفنة اننا نحن العرب الاكثر ضررا على العالم وقد حصلنا من الاسلام المتعفن على سند فيما نرتكب من جرائم وموبقات نحن مليئون بالعيوب ولانجيد سوى ان نعيب الاخرين<br />اعان الله المصريين على العرب .. لو انهم لم يصلوا مصر لكانت الان في قمة الرقي والتقدم<br />اللهم امحق العرب وخلص العالم منهم اللهم انقذ الناس من طغيانهم ومن بطشهم الارعن الجبان اللهم آمين"
archived = "2006-12-30"
capture_url = "https://web.archive.org/web/20061230202707/http://masr.20at.com:80/article.php?sid=840"

