[[comments]]
order = 5
subject = "امرنا غريب جدا"
author = "الدكتور محمود"
posted = "2006-08-25"
text = "الاستاذ كاتب المقال شكله مش مبسوط طيب نعمل لك ايه علشان تتبسط اذا العرب مجوش لمصر نقول مش عاوزين اقتصادنا يبقى كويس وعاوزين يضربوا السياحة واذا حضروا لمصر نتريق عليهم ايه الهبل ده المفروض يبقى فيه شوية احترام وادب فى معاملة الضيوف طالما سمحتوا لهم انهم يحضروا لمصر يبقى ملكش دعوة يروحوا للمكان اللى هما عاوزينة وبعدين انت نسيت حكومتك المبجلة انها هى اللى بتعمل الاعلانات الحقيرة اللى بتظهر فيها الراقصات والممثلين ونورت مصر يبقى قبل ما تلوم عليهم لوم على الحكومة اللى مش محترمة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 6
subject = "عنوان عنصرى"
author = "الدكتور محمود"
posted = "2006-08-25"
text = "حتى عنوانك ياقرنة عنصرى يعنى ايه العرب احتلوا مصر اشمعنى مبنسمعش فى الدول العربية اللى احنا عايشين فيها اننا احتلينا البلد مع العلم ان عدد المصريين الموجودين فى السعودية لوحدها مليون و250 الف مصرى والرقم ده حسب تعداد 2005 يعنى رقم رسمى فى السعودية ومع ذلك عايشين وشغالين هنا مع انهم دلوقتى البطاله موجوده عندهم .<br />الحاجة التانية بتقول مبيدخلوش الاوبرا ليه ؟؟ ياحلاوتك ياجمالك بلد مفيهاش لا سينما ولا مسرح ولا اى حاجة من دى ومحرومين منها والاوبرا مبيسمعوش عنها يبقى يدخلوها يعملوا بيها ايه طيب ليه المصريين مبيدخلوش الاوبرا الا لما يكون فيها مطرب او مطربة يعنى عاوز تقولى ان اللى بيحضروا البالية كلهم بيفهموا فيها ابدا اقسم بالله وزير من وزراء مصر السابقين قال انه بيحضر الاوبرا مجبر علشان البروتوكول لانة مبيفهمش فيها حاجة يااخى اتقوا الله"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 7
subject = "الي د محمود"
author = "مصراوي"
posted = "2006-08-25"
text = "العنصرية الحقيقية موجودة في الدول العربيةوخاصة في السعودية وده من اول ما تحط رجلك في المطار في جدةتلاقي منفذ لدخول السعوديين واخر لباقي الجنسيات وهل انت بتتعامل كويس هناك يا فالح ولا ساحبين جواز سفرك وحاطين عليك كفيل يذل فيك انت مش مسموح لك تشتري اي عقا او عمل اي مشروع خاص هناك بينما هما لو عايزين يشتروا نص مصر هايشتروها حتي البورصة هناك ممنوع لغير السعوديين الاكتتاب فيها بينما احنا في مصر بنسح لهم السعودية اللي بتتكلم عنها دي اكبر بلد عنصري في العالم ولا انت فلوس السعودية عمتك عن الحقيقة انت لو عايز تستقدم مراتك في السعودية لازم اذن الكفيل وموافقته لقد كنت في السعودية ولمست مهزل هذا البلد وبعد كده تقولي عنصرية جتك ستين خيبة انت واللي زيك اللي بيبيعوا ضمائرهم عشان شوية ريالات"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 8
subject = "مجرد رأي"
author = "العرف فعلا احتلوا مصر..وبلاش التمثيل بتاع بعضكم اللي بيتكلمواعن الوحدة العربية..والهبل ده"
posted = "2006-08-25"
text = "السعوجية و اهلها بينزلوا بلدكم علشان بجلهم فاهمينانهم بيشترونا بفلوسهم..<br />اما الاخ الطيب بتاع احصائية 2005و بيقول ليه السعودية مش بتقول ان المصريين احتلوها ..طيب ماهم فعلا بيقولوا كده يا ابني ..دول يطيقوااليهود و لا يطيقونا..اومال هما عاملين نظام السعودة ليه يا ابني<br />نورت مصر!!!"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

