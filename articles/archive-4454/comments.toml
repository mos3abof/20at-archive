[[comments]]
order = 140
subject = "مصر محتلحين السعوديه"
author = "انا الخليجيه"
posted = "2006-10-27"
text = "احب اقولكم انه العلم اللي على قولتكم علمتوناا اياه هذا مو علمكم انتو من يوم يومكم حراميه ونصابين وريا وسكينه امثلتكم<br />والرقاصاااات شو السينما حقتكم كلهاا مساخه وقله حياء ترااااااكم عليتونااا بالسعوديه روحوا الله لايردكم وبعدين النيل اللي انتو فرحانين بيه ترى اللي يجونا كلهم فيهم بالهارسيا وداء القطط اقلكم روحوا اشربوا مويه نضيفه ومسحوا كاساتكم لانه وحده من الاردن سمعتهاا في برنامج تقول انه او لبنانيه انه كاساتكم وسخه ولازم الواحد يطالع فيهاااا ههههههههههههه<br />ومييييين قال مصر احتلوهاا العرب ترااااااااااكم كلكلم عندناااااااااااا<br />خماجه عرب<br />وبالنسبه اننا بدو ترى الرسول عليه السلام بدوي وكان يرعى غنم وانا اتشرف به اني اكون بدويه مثله<br />هههههههههه تعاسه يامصر ياقذاره العرب وفساده"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 141
subject = "الي الواطية السعودية"
author = "سيدك المصري"
posted = "2006-10-30"
text = "اسمعي يا بنت الناقة انتي معروف اصلكم الوضيع وانكم اصلا كنتم الي وقت قريب جدا قطاعين طرق تهيمون علي وجوهكم في الصحراء وما تصدقوا يجي موسم الحج حتي تسلبون الحجيج اموالهم او تتسولون منهم ولا ننسي كلمتكم الخالدة القديمة واسالي ابوكي ايم هللة ياشيخ وكانت التكية المصرية تفتح لكم ابوابها لانقاذ ابوكي وامك واعمامك من الجوع وكانت هيئة البريد المصرية تطبع طوابع يشتريها المصريون لفقراء نجد والحجاز صفاتك انت وامثالك من ناكري الجميل مثل صفات الكلب الاجرب المسعور الذي اذا ساعدته واطعمته يعض يدك القران وصفكم بانكم اشد كفرا ونفاقا انتم الاعراب وطول مانتم مجتمع قبلي عمركم ما هتتقدموا احنا عندنا عائلات كبيرة مش قبائل متخلفة زيكم وتاريخيا بعد الخلافة الراشدة انتقال حواضر الدول الاسلامية الي الكوفة ودمشق وبغداد والقاهرة واستنبول اصبحت منطقتكم خارج التاريخ الي ان جاء سعود والاربعين حرامي وسرقوا هذه الصحراء وسموها باسمهم بالذمة في اي دولة في العالم متسمية باسم شخص وانتوا مبسوطين اوي انكم منتسبين لسعود واسمكم سعوديين جتكم ستين الف خيبة عمركم ما هاتتقدموا ولو في حكومة وطنية في مصر فعلا كانت قاطعتكم عشان تعلمكم الادب مع اسيادكم اللي علموكم وعملوكم شبه بني ادمين بدل ماتدعمكم بمليون ونص معتمر وحاج سنويا هايصرفوا مليارات الريالات عندكم يستفيد منها اصحاب الفنادق والمحلات يعني احنا بناكل اهلكم عيش حلو اوي اللي بييجي مصر منكم لا يزيد علي 300 الف ومش عايزينهم لانهم اوساخ وما يعرفوش غير الاماكن الوسخةزيهم زي الذباب اللي بيتلم علي الوساخة اتكلمي ياعبيطة انتي علي قدك وكفاية وساخة وزني محارم عندكم وسواقين هنود بينيكوا نسوانكم ولواط وشذوذ روحوا في داهية بعيد عننا ويلعن ابوكم أ<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 142
subject = "يا عرب يا خليج يا مصريين انتبهوا بالله عليكم وشاهدو كلامى"
author = "هشام من مصر المسلمه محافظه بورسعيد"
posted = "2006-10-31"
text = "يا عرب يا مصريين والله على ما اقول شهيد ان هذا الموقع قبطى نصرانى وهو يوقع فرقه بين العرب والمصريين ويحقد على الاسلام وان المندسين باسم المصريين ويسبون اهل الجزيره هم مسيحييون فلا تصدقوهم بل نحن اخوه والخير فينا كثير كثير والخير فيكم كثير كثير والله معظم الذين يتكلمون باسم المصريين هم نصارى حاقدون او مسلمون يحترقون للرد الفعل فقط وسامحكم وسامحنا الله يكفى فخرا ان منبع العروبه فيكم وييكفى اننا دافعنا عن الاسلام وعنكم غزوات التتار والمغول فناسف للمصريين على سبهم ونسامح اهل الخليج على سبهم لنا وربنا يهدى الجميه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

