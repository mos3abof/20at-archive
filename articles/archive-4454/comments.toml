[[comments]]
order = 14
subject = "اشد الناس عنصريه"
author = "غيبوبه"
posted = "2006-08-26"
text = "السعوديين و الخليجيين عموما أكثر الناس عنصريه<br />راجع نظام الكفيل<br />انهم يكرهون المصريين و يحتقرونهم<br />خلاص نسيوا التكايا المصريه التى كانت توزع صدقات المصريين عليهم<br />\"لما تاخد حقك من النيل ابقى تعالى خده من البترول\"<br />هذه الحكمه قالها كفيل لمصرى بعد اننهب حقوقه و سرق امواله و طرده من جنه اللى خلفته"
archived = "2006-11-06"
