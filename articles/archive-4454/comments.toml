text = "طيب يا مصري أنا عندي ثلاث فلاحين من مصر راح أوريك فيهم ، راح أقطع عنهم الراتب و أذلهم لأني سعودي و في بلدي يعني حر أعمل إلي أنا عايزه .....<br />يا شيخ عيب عليك و الله ، هذا و أحنا نقول مصر بلدنا و المصريين أخواننا يطلع كل هذا الحقد من بعضكم علينا أنا مارحت مصر و كنت أفكر أروح لكن مادام الوضع كذا بلاش و اللحين حاروح أفطر مع أصحابي الفلاحين البسيطين مو زيك يا عنصري ."
