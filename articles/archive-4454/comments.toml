[[comments]]
order = 231
subject = "يا مصري صميم"
author = "من نسل الاكرام"
posted = "2006-11-19"
text = "حرفة مثل السباكة والحلاقة و النجارة مانرضى نشتغل فية لانه اهانة واحنا نجيب الناس بفلوسنى مش عالة وبواسين الجزم امثالك اما عن الاكل بليد انا لا اكل بيدي بس لو في منه وبعد انت تاكلون بايديكم كفاية المسلسلات والافلام المصرية وهم ياكلون بايديهم ووجوههم المقرفه ههههه ولاتظن اني اشوف افلامكم او مسلسلاتكم لا والله مااطيقهى وايش النوم بلارض ؟؟؟؟؟ يعني تشوف واحد تعمم على الكل ؟ وشفت مصريين ينامون بلشارع من تظن الافضل ؟ وقبل ماازور مصر قالولي ناس احذر لو نزلت من الطيارة راح تشوف اشكال غريبة بلمطار لاتنخض لكن لما نزلت شفت اشكال غريبة والمطار زبالة والمصاروة مايصدقون يشوفون خليجي علشان يركضون وراه للشحت حتا موظفين اللي يشتغلون يشحتون ومن ذيك اليوم حلفت اني مااحط رجلي بمصر وروح مثل عادتي لندن وفرنسا"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 232
subject = "الي اللوطي السعودي الجربان وتابعه"
author = "مصري صميم"
posted = "2006-11-19"
text = "يا حثالة البشرية يا قوم لوط يا خليجيين بتقول انكم بتستكبروا علي شغلة حلاق وسباك و نجار وتجيبوا ناس تشغلوهم كويس وقبل ما تعرفوا الفلوس اللي ما عرفتوهاش ألا بعد الحقبة البترولية كان مين يرضي يجي عندكم في ارضكم الصحراوية الفقيرة مع الخيام والجمال والحمير اللي زيكم ده انتو ما عرفتوش الفلوس غير من 35 سنة يا ولاد الكل يا جربانين ياللي خير مصر عليكم كانت ترسل لكم المدرسين والكتب والدفاتر علي حساب مصر وأصلا دولكم ما كان لها أسم ولا حد كان يسمع عنها كل شيخ قبيلة عمل له دوله ومش عارف يدافع عنها عشان كده جايبين الأمريكان يدافعوا عنكم يعني عملاء من يومكم وعمركم ما هاتنضفوا أو تتطوروا لان الحضارة في الأ نسان وعندكم الانسان قمة التخلف والهمجية فهمتوا أيها الأجلاف العرب السفهاء"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 233
subject = "وانا معك اخوي من نسل الاكرام"
author = "سعودي"
posted = "2006-11-19"
text = "صدقني اخوي الكريم(من نسل الاكرام)<br />ان هذا الشعب الحقير(المصري)<br />لايعرف اساسا مامعنا الكراامة وعزة النفس<br />وناس فعلا مثل ماقلت اشكالهم وصخه والله<br />وريحتهم الله لايوريك بس يالغالي<br />تقووول مجاري ماشية خخخخخخخخخخ<br />تفوووو عليكم يالمصاروة يا احقر شعوب العالم<br />حتى بناتكم عفنااات قسم بالله<br />يعني لاجماال فيهم ولاشرف محافظه عليه<br />يااااااااعبيد الفلوس انتم<br />تفوووووووووووو<br />باااي ياحقراء<br />باااااااااااااااي"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 234
subject = "الي قوم لوط نسل البهائم السعودي وتابعه"
author = "سيدك المصري الصميم"
posted = "2006-11-19"
text = "يا ولاد الكلب يا خولات مش مكسوفين من نفسكم يا أحفاد قوم لوط وشذوذكم المخزي المنتشر فيكم من أصغركم الي أكبركم المحترم شوية فيكم تلاقيه اتناك خمسين مرة علي الأقل ونسوانكم السحاقيات والمتناكات من الهنود والبنغال عشان كده جيلكم طالع شبه الهنود بالظبط لانهم اباءكم ده البهائم عايشه انضف وأشرف منكم أنت خلاصة زبالة البشرية ولا تستحقون سوي كل الاحتقار لانه ليس لكم أصل ولا فصل اتفووووووو عليكم حثالة ولاد ستين الف شرموطة"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 235
subject = "الي السعودي الصعلوك"
author = "مصري ولي الشرف"
posted = "2006-11-20"
text = "تقول يا صعلوك لولا الخليج ما كانت مصر واضح عليك أنك مسطول ومن مدمني المخدرات أنت عارف يا هبل دول الخليج من كام سنة وجدت الحكاية كلها ثلاثين اربعين سنة وعارف مصر بتاريخها من كام ألف سنة سبعة الاف سنة والوحيدة المذكورة في القران أكثر من أربعة عشر مرة أخزي وأخرس واعرف مستواك المنحط ولا تتطلعون الي العمالقة أيه الاقزام الخليجيين حتي لا نسحقكم تحت أقدامنا مش ناقص غير شعوبكم المعفنة هايعملوا نفسهم ادميين وهم حيوانات معدلة وراثيا"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 236
subject = "يامصري يانجس"
author = "؟؟؟؟؟؟؟؟؟؟"
posted = "2006-11-20"
text = "اتعرف انة القرأن ذكر مملكة سبأ العربية واصحاب الاخدود وهو من جنوب جزيرة العرب واجداد العرب وذكر القرأن انة الله اصطفى ال ابراهيم وهم من نسل ابراهيم الخليل عليه السلام وهو جد العرب على العالمين الاتعرف انة القرأن ذكر جد العرب اسماعيل وابراهيم وهود عليهم السلام وهم اجداد العرب الا تعرف انة الله استجاب دعاء جدي ابراهيم علية السلام ووعد ان يكثر من نسل ابنة اسماعيل المباركة وتمتد بلادهم من الفرات في بلاد الرافدين وهو موطن ابراهيم جدهم الي النيل وهي موطن هاجر علية السلام امهم الا تعرف انة القرأن ذكر اشخاص من العرب من الوليد بن المغيرة في سورة المدثر وعن ابي لهب وغيرة الا تعرف اننا احفاد الصحابة والانبياء ؟"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 237
subject = "يامصري نجس"
author = "؟؟؟؟؟؟؟؟؟؟"
posted = "2006-11-20"
text = "اكمل الاتعرف انك مصري نجس زبالة الاتعرف انكم عار على العرب ومتشتتين بدول العالم تشحتون ويطردونكم بصفتكم مقيمين غير شرعيين ويطلع بلاخبار انة الحكومه الامريكية طردت العرب او الحكومة الاروبية وهم لايعرفون انكم لستم عرب وانتم المصريين وغيركم تعرف من هم"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 238
subject = "يا اخوه يا مصريين"
author = "عبد الله السعوديه"
posted = "2006-11-20"
text = "يا اخوه يامصريين الذى يسب مصر هو كلب قطرى ويتكلم احيانا باسم سعودى وهو الوحيد المعلق هنا وانا اعرف طريقه كلامهم وهو يحاول ان يوقع فرقه فاقول لابن العاهره القطرى اخسأ يا رافضى يا شيعى يا متخلف"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 239
subject = "ياسعودي"
author = "؟؟؟؟؟؟؟؟؟؟"
posted = "2006-11-20"
text = "والله اتهمتوني بكثير من الناس اكتبو وقلتو انهم انا لا والله ناس ثانية بس الشيعه عندكم انتم بلسعودية انا سني شريف لست وهابي ولا شيعي والعاهرة امك اللي تتزوج بلميسار"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 240
subject = "والله انا لست قطري"
author = "سعودي"
posted = "2006-11-20"
text = "ياعبدالله صدق انك وصخ<br />واقف مع المصاروه الكلااااب ضد اهلك الخليجيين ياوصخ<br />اقسم بالله انني ليس القطري انا سعودي ووالله اني سعودي<br />ونعم والله بأخواننا القطريين<br />وتخسأانت ياعبدالله ياوصخ تتكلم عن اهل قطر الحبيبه الخليجية الي مننا وفينا<br />عاااااااااش الخليج وخسأالباقي"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 241
subject = "من نسل الاكرام"
author = "امبراطورية قطر العظمى"
posted = "2006-11-20"
text = "هلا فيك اخوي سعودي احنا عرب الجد والدين والتاريخ واحد ومايهم كلام ولد المصرية عبدالله واللي خوالهم مصاروة اتفووووو امحق نسب"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 242
subject = "هلا بالغالي"
author = "سعودي"
posted = "2006-11-20"
text = "هلااا والله بالغالي (من نسل الاكرام)<br />والله ياخوي صراحه هذا ولد المصرية فشلنا<br />بس يارجال دااام انه موب اصيل وخواله مصاروه فطز فيه وفي اشكاله العفنه.<br />الي قاهرني ان الوصخ حان لاصله المصري<br />ويدافع عنهم على ...... انت والمصاروه حقونك<br />وعاشت قطر والسعودية والخليج بأكمله<br />وسقط الباقي<br />ونعم فيك والله اخوي من نسل الاكرام<br />والله لايهينك ان شاءالله يالغالي"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 243
subject = "الي جرذان الخليج"
author = "بحبك يا مصر"
posted = "2006-11-22"
text = "[يها الجرذان العرب الخليجيين الجرب أما تعرفوا تدافعوا عن بلدانكم ونسوانكم بدلما تجيبوا الخارج يدافع عنكم وبعد كده ينيككم يا خولات يا لوطيين بعد كده تعرفوا حجمكم وكراهية وأحتقار العالم كله شرقه وغربه لكم وأعتباركم متخلفين عقليا ومشبوهين ثم قبلوا أقدام وأحذية المصريين اللي عملوكم شبه بني ادمين وفتحوا لكم المدارس والمستشفيات وبعد كده أمامكم 500 سنة وتبقوا بقر"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014049/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 244
subject = "يا بحبك يا مصر"
author = "؟؟؟؟؟"
posted = "2006-11-22"
text = "العالم يرانة ويراكم واحد كوننا شرق الاوسط والدول العالم تراكم دولة تاخذ الاموال من بعض الدول مثل امريكا ودولة يوجد بهى اكبر نسبة من الاميين وتحت خط الفقر دولة نامية اما الخليج فيرونها دولة نفطيه غنية شعبه لايهرب ويدخل بلدانهم للشغل او بوس الجزم شعب طلعت منهم الحضارة او الدولة الاسلامية القوية وطلعت منهم الجيوش وغزت العالم شعب متريش اما انتم لم تستطيعو طرد الاسرائيليين من سينا الا باتفاق معى انكم 70 مليون واسرائيل 5 مليون وانا اشوف كثر اتهام الناس بللواط منك يالمصاروة ليش ؟؟؟؟ظ هل انت لوطي وتفكيرك كالو لواط"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014049/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 245
subject = "مصاروه كلاب"
author = "خالد الرياض"
posted = "2006-11-22"
text = "انتم اللوطيين يالمصاروه الكلاب ........حنا الخليجيين دووم نجي مصر نفتح نساءكم على رجالكم خخخخخخخ<br />ونعطيكم بالجزمه القديمة على وجوهكم<br />وتسكتوون مثل الدجاج يادجااج<br />اتفووووووو عليكم وعلى بلدكم الوصخه مثلكم<br />قال مصاروة قال ههههههههههههههههه"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014049/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
