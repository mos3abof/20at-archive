[[comments]]
order = 251
subject = "الي الحمار اللي الخليجي اللي قبلي"
author = "مصري وأتشرف"
posted = "2006-11-24"
text = "يا متخلف مصر هبة النيل أكبر بلد زراعي عربي بل هي اللي علمت العالم الزراعة من ايام الفراعنة انتو مفيش أي انهار عندكم في صحرائكم عشان كده جافين في سلوككم وعقولكم وبعدين يا غبي احنا بنيجي عندكم عشان أنتم اللي عايزنا نيجي نعلمكم ونعالجكم من البلاوي اللي عندكم لانكم مش عارفين تعتمدوا علي أنفسكم زينا وعارفين كويس أنكم شعب بليد وفاشل ومش نافع في أي حاجة أحسن لكم يرموكوا في البحر ويخلصوا منكم البشرية بدل مانتوا عالة علي العالم ومفيش فايدة فيكم"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014049/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 252
subject = "عن العرب"
author = "منة اللة"
posted = "2006-12-01"
text = "عرب بيجوا مصر اكيد هيشتروا اشياء كثير من مصر فا تزيدالفلوس لى مصروتزيد على الشعب وكمان هم يج ليرون الاثارة بتعت مصر وحد يفيد البلد ولالاء الفيدة لنة نحنوا مش ليهم صح الكلم دة المفروض ان نحترمهم لان لو بسطوا حتلق كتير من الناس يعش فى البلد العربية وحم جنسيتهم مصرية وهم بيعمر الخير علين ولا لا"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190217/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 253
subject = "نورت مصر يا عرب"
author = "منة اللة"
posted = "2006-12-01"
text = "نورت مصر يا عرب نورت مصر نرحب بيكم فى مصر ام الدنياة ازى العرب احنلوا مصر واحنا بلدنااسمة ام دنيا دة البلد التانى الاى همالعرب احسن من مصر مصر بلد الخش والخدع والسرقة وكمن فى طالبة كتير حلصوا الجامعة خل عندكم دم؟ وشغل الطالبة وفكر فى العرب الا احتلو مصر دة كدة زادة موت"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190217/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 254
subject = "مصر وقفت جنبهم ثم يعيروها"
author = "خليجي متنور"
posted = "2006-12-01"
text = "السلام عليكم، لا شك إن الشعب المصري وريث حضارات نظامية ونحن عرب الجزيرة ورثنا حضارات همجية إذا صح القول ,نظرا للظروف البيئية, الاختلاف شديد بين الشخصيتين, البيئة الصحراوية والشح في الطبيعة أورث شحا في الشخصية، تأمل جبلا أو صحراء وتأمل أرضا سهلية زراعية، الصحراء تذم الزراعية بعدم نظافتها وطواعيتها للإنسان يفعل فيها ما يشاء وتفخر بمنعتها وطهارتها وإبائها على الإنسان,إننا في مقارنة بين البشر والبشر نتاج بيئتهم ,هي التي ميزتنا وإلا فكلنا واحد, إذا تشابهت الظروف على مدى طويل ،فالمصريين كثير منهم من أصول عربية ثم انصهروا في البيئة المصرية . نعود للفخر, فإن مصر أعطت كثيرا لنا بحكمالظروف, وما منت علينا يوما ، ونحن عندما تسنت لنا الفرصة منحنا قليلا ومننا كثيرا, وليس ذلك حمدا للنعمةزوأنهي<br />على قدر أهل العزم تأتي العزائم<br />وتأتي على قدر الكرام المكارم<br />وتعظم في عين الصغير صغارها<br />وتصغر في عين العظيم العظائم<br />ولا تدعوا برميل زيت يعكر بحرا من المودة"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190217/http://masr.20at.com:80/article.php?sid=840"

