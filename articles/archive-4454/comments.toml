subject = "اتقوا الله في أنفسكم"
author = "فهد"
posted = "2007-01-13"
text = "إنها رسالة للجميع..<br />أسأل الله أن تجد لها قلباً واعياً يؤمن بالله ربا وبمحمد صلى الله عليه وسلم نبيا وبالإسلام دينا..<br />جميع من سب أو قبح فلا يلومن إلا لنفسه..<br />يقول صلى الله عليه وسلم ( المسلم من سلم المسلمون من لسانه ويده )<br />فيا أيها المسلم..<br />أنج بنفسك وابتعد عن المهاترات..<br />ولاتسب إخواناً لك في الله سواء كانوا من مصر أو السعودية أو الشام...<br />اللهم إني بلغت اللهم فاشهد"
archived = "2007-01-14"
capture_url = "https://web.archive.org/web/20070114145707/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 262
subject = "مصر مستعمره وليست محتله"
author = "طاهر"
posted = "2007-01-14"
text = "اقول للسعودي<br />هل يوجد في بلدك رقاصه مثل فيفي عبده او دينا؟<br />هل يوجد شارع مثل شارع الاهرام كله مراقص<br />وخمر ومحرمات ؟؟<br />هل يوجد مهاجرين للغرب ، بحث عن الحياه؟<br />هل يوجد بطاله لدرجة ان حامل الدكتوره لا يحصل على وظييفه؟؟<br />هل يوجد عندكم مثل شحاذين مصر؟؟<br />فعلا الشعب مصري حقووود والمشاكل اللي يعشيها بسبب الحقد والكراهيه ...<br />ولو كان النيه صادقه ولكن الله يرزق من يشاء<br />هل يوجد"
archived = "2007-01-14"
capture_url = "https://web.archive.org/web/20070114145707/http://masr.20at.com:80/article.php?sid=840"
