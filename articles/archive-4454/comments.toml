text = "النقود بتسموها عندكم \" مـصـارى\" علشان مصر هى اللى عرفتها لكم<br />و جاى واحد تبرأ من اصله يقول على المصريين شحاتين<br />الــــواطــى"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 60
subject = "من واحد شخص سعودي"
author = "احمد حمدان"
posted = "2006-09-03"
text = "انا لا اري في نظام الكفيل و الكفالة اي بعد عنصري - النظام لحماية الاقتصاد من تدفق العمالة الرخيصة و ضمان ان يكون المواطن هو المنتفع الاول - انا اتفهم شعور المواطن المصري في السعودية - لكن تذكروا ان اكثر من مليون و ربع مصري يعملون في السعودية و يحولون مئات الملايين من الدولارات شهريا. المهم ان العدو الاكبر لاي دوله هو الاعتماد على مصدر وحيد للدخل - احصاءات الحكومة المصرية دوما مبشرة بالخير بخصوص تحقيق نمو يقارب 6 في المائة سنويا - لكن يجب علي المصريين ان يتنبهوا الى ان هذه الزيادات تعزي لنشاطات السياحة و الاعمار - ولكن على المصريين الحرص ان يتم توظيف الفوائض المالية في استثمارات تعليمية و توطينية للتكتنولوجيا<br />بالتوفيق"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

