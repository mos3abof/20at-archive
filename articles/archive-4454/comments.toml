author = "المستبده الخليجيه"
posted = "2006-10-27"
text = "هههههههههههااااي حسبكم الله يالحقده والحسده يلي عقده النقص ذابحتكم قال ايش علمتونا؟؟>> امحق علم.. علمو انفسكم اول شي عندكم نسبه الاميه بالطالع بدليل فيفي عبده ولوسي والطقه خخخ >> ايش تقولين انتي ؟؟<br />..عيييب لمن تهرجون عن اسيادكم لازم تقومون واقفين والا تبوني اجيبلكم بهاء سلطان يعلمكم النشيد الوطني حقكم قوم اوقف وانت بتكلمني >> خلاص اجلسوا متواضعه لووول<br />لاتنسون اننا اولياء نعمتكم!! احنا اكلناكم وكسيناكم وامناكم من جوع ومن خوف ولحم اكتافكم من خيرناواذا انتم شايفينا بدو احب اقولكم اننا نفتخر باصولناالبدويه العربيه الاصيله وعارفين جذورنا انتم اللقب حقكم كله اسماء مدحت عبالفتاح عبالحليم السيد محمود حسنين سنقر لوووووول وبعدين البدوي مو مذمه البدوي انسان بلفطره كريم وعفيف وشهم ويكرم ضيوفه ويفضلهم علي نفسه ..موب مثلكم استغفر الله نكارين جميل من يومكم وابتلاكم ربي بالقمل والدم والضفادع وبالحقد والغيره واللؤم .. والله اني امشي في الشارع بمصر كوم شحادين يبسون رجولي عشان يبون نص ريال بس واقوم اعطيهم 10 ريال>> كريمه لوول<br />لكن هين راح اكلم حكومتي تقطع عنكم المصروف ونخليكم تموتون جوع وتنذلون ذل فوق مانتم مذلولين وخلي النيل ابو حشرات وبلهارسيا ينفعكم..اكثر بلد عربي مستوى النظافه فيها متردي هي مصر..لدرجه اعرف كتير اطباء مصريين وزرت بيوتهم صعقت جدا بمستوى القذاره البيت زباله وفيه جميع انواع الحشرات حتي المنقرضه موجوده ..وكله كوم لمن تخش سينما او اي مكان مزدحم متشم غير ريحه العرق وعععع الله يقرفكم ماتستحمون ولا تتنظفون عشان توفرون ثمن الشامبو وفاتوره الموياوالبنات مسترجلات مافيه انوثه بالمره لاصوت ولا جمال ولا جسم ولا شعر ياربي لك الحمد موب مثلنا ايش جمال نجدي عربي اصيل وايش عيون وايش بشره<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 139
subject = "بالله ينظف بلدي من المصاريه الوسخين"
author = "بنت السعوديه وافتخرررررررررررررررررررررررررررررررر"
posted = "2006-10-27"
text = "اولا انتم تافهيييييين ههههههههههه والشي الثاني اصلا مصر فاضيه مافيها احد كلهم هنا بالسعوديه متكومين رزم رزم حسبي الله عليكمجلسين في بلدنا يلا امشو انقلعو الله لايردكم والي يقول جايين عشان الحج والعمره ياكذابين يلي متعرفون اللله اصلا انتو الاجانب دخلتو بلدنا ووسختوها الله لايبارك فيكم قولو امين وغير كذلا تجلسون هنا 30 يسنه وتولو مصر واحشتنا روحلها ليش جالس هنا امشوا يلا جوازات ...جوزات يلا"
