[[comments]]
order = 114
subject = "موتوا بغيضكم"
author = "كويتي"
posted = "2006-10-12"
text = "احتلال؟؟ سبحان اللة لولا افلوسنا من الي ننفقها في السياحة على مصر لكسدت مصر وللمعلومة انفاق الخليجي في السياحة هو الاكثر في العالم هذا جانب اما الجانب الثاني هو مشكلة ان المصريين عندهم عقدة الفقر وعشان يعوضون هذا النقص ينفخون نفسهم ويدعون العلم في حين معدلات الامية ترتفع عندهم(ماكو داعي للاحصائات عشان مانفضحكم)مثل مايقول الشعر كالهر يروي انتفاخا صولة الاسد بئس الاهرره انتم وتبون الصرحة انا زرت ماصر مافيها شي حلو غير الكبريهات الي في شارع الهرم وصراحة اسافر اوروبا واايد احسن باريس وجنيف احلى من مشاهدة اشكال المصريين"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 115
subject = "الي الكويتي"
author = "ابن النيل"
posted = "2006-10-12"
text = "ايها الجلف الخليجي مصر يزورها سنويا اكثر من 5ز8 مليون سائح والسياح الخليجيين لا يزيدوا عن 700الف سائح سنويا اي انكم اقل من 8% والباقي اجانب محترمين اكثر منكم لانك بتقول ان مصر الحلو فيها هو كبريهات شارع الهرم فعلا هذا ما يناسبك وهذه هي ثقافتك التي تتركز في المنطقة السفلي من جسدك وانمتم محدثين نعمة لم تعرفوا الفلوس الافي الستينات وقبل الستينات لم يك هناك وجودلكم لا تعرفون سوي الصيد ورعي الابل لا داعي للمقارنة بمصر بلد الخير والنيل اللي طول عمرها كانت بتصرف عليكم ايام فقركم وبتدعمكم وبتحميكم من اطماع الغير كان زمانكم المحافظة رقم19للعراق لولا مساندة مصر علي العموم الاصيل مايعض الايد اللي بتساعده لكن احنا ماشفناش منكم غير العض امثالك واشكالك لا نرحب بهم بيننا ولا نريدكم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 116
subject = "يا استاذ كويتى الإنسان المحترم بيدور على اماكن محترمة"
author = "مصرية"
posted = "2006-10-12"
text = "فى حديث عن الرسول صلى الله عليه وسلم بس انا مش فكراه الحديث فيما معناه إنى الرسول بيسأل واحد بيقوله شفت ايه فى مصر قاله شفت ناس مؤمنةومتدينة وسأل الرسول صلى الله عليه وسلم واحد تانى قاله شفت ايه فى مصر قاله انا شفت ناس مش محترمة وناس عاهرة وناس مش محترمين يعنى انا عايزة اقول انى الإنسان الكويس بيدور على الاماكن الكويسة يعنى المحترمة لكن الإنسان اللى مش محترم بيدور على الكابريهات والاماكن مش محترمة يعنى يا استاذ كويتى لما تقول انى مافيش حاجة فى مصر عجبتك غير الكابريهات دى مشكلتك انت لانى الانسان المحترم بيدرو على اماكن محترمة والانسان الغير محترم بيدور على اماكن غير محترمة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 117
subject = "يا استاذ كويتى"
author = "مصرية"
posted = "2006-10-12"
text = "ويا استاذ كويتى للمعلومة انى اشكال المصريين اللى انت بتفضل تروح اوربا او باريس علشان ماتشوفش اشكال المصريين عايزة اقولك حاجة انى ربنا هو اللى خلق اشكالنا اللى مش عاجباك وكمان ربنا اعطى مصر النيل واعطاها حضارة اتحدى اى عربى او اى غربى عنده حضارتنا امال سموا مصر ام الدنيا ليه ماهو علشان حضارتناومصر كمان يا اخ كويتى ذكرت فى القران يعنى مصر ارض مقدسة ولولا مصر يا اخ كويتى ولولا حرب اكتوبر ما ارتفعت اسعار البترول اللى انتم بقيتوا اغنية من وراهاوكمان يا اخ كويتى الفقر مش عيب لكن العيب هو فقر العقل احنا ممكن نكون فقرة بالفلوس ودة لانى عمك مبارك سارقنا وناهبنالكن الحمد لله معندناش فقر العقل وفقر العقل انى الواحد يتكلم كلام غير منطقى وعايز يعمل نفسه فاهم وهو ولا فاهم ولا عارف حاجة اصلا هو دة الفقر العيب"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

