text = "اقسسسسسم بالله العظيم بعد ماقريت هالمقال والتعليقات وبعد مكنت احب المصريين اني مصر هذه ماعتبهاااا لا انا ولا اي احد من اهلي ولا الاردن قال نفسك في لقمه عيشك ليه غلا الاجور كلمي حكومتك فيه من ورا زيتنا لبلدك اقتصادكم يعلى وتاكلين عيش ولا مفكرين مافي سياحه الا بلدكم الخايسه الي دخان السيارت ذبحنا فيها والناس نايمه في شوراع والله مكنت اوزراها الا عشان اقول اهله ناس طيبيه ولا مصر ايش تكون عند ماليزيا خضره وتطور ونظاااااااافه وناس طيبه ومحترمه جاكم البلا حقده الحقد بيقطع قلوبكم"
