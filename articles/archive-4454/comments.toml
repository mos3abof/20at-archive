[[comments]]
order = 153
subject = "الفخر للاسلام وليس للفراعنه الطغاه"
author = "هشام من مصرالمسلمه"
posted = "2006-11-05"
text = "اخى انا لاافخر بالفراعنه فلا احب ان اون منهم بل هم قوم كانوا يستعبدون الناس فسلط الله عليهم الهكسوس فاستعبدوهم واذلوهم بل الفخر ان مصر بلدى بد الاسلام وليس بلد الفراعنه مصر بلد الازهر حاميه الاسلام وقلعته الحصينه اما بخصوص نسل العرب من نبى الله اسماعيل فليس كلهم يا اخى فاقرا التاريخ جيدا فلا تنسى العرب اليمنيين الاوائل الذين سكنوا مع السيده هاجر ام نبى الله اسماعيل ولقد تزوج منهم سيدنا اسماعيل عليه السلام وللعلم يا اخى ان ام اسماعيل الذى هو ابو العرب هى مصريه فالمصريين اخوال العرب فكفى يا اخى قوميه فالدين هو النسب وربنا يهدى الجميع"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 154
subject = "إلى كل من شارك بالجميل والقبيح"
author = "ذو يزن من اليمن"
posted = "2006-11-05"
text = "ايها الأفاضل ماهذا الذي أراه هنا انا في الاول عقبت على الموضوع ولم أكن قد قرأت الردود كلها لكن للأسف بعد أن قرأت الكثير منها وياليتني لم أقرا وجدت الفاظاً تتنافي مع روح التحضر الذي يدعيه او تدعيه من تكتبه يجب علنا جميعاً أن نحاور بعضنا ونحن نتفهم جيدا أن الأختلاف بالرأي لا يفسد للود قضيه متى سنكون عند هذ المستوى من الفكر والنضج في التفكير ... دعوها فإنها منتنه وإلى من يفتخر بأن العرب من نسل الأنبياء عليه أن يقرأ التاريخ جيدا ليستوعب حقيقة العرب .. فكلمه عربي في اللغه تعني الراعي المتنقل في الصحراء وقد سمى العرب عرباً لانهم كانو رعاه يتنقلون في الصحراء والعرب ينقسمون في أصولهم إلى ثلاثة أقسام :<br />الأول : هم العرب البائده وهي تلك القبائل التي استوطنت بعض البقاع من صحراء العرب ومنها منطقة الأحقاف في محافظة حضرموت شمال شرقي اليمن ومن تلك القبائل قبائل عاد وثمود وتلك القبائل انقرضت بأمر من الله وبعذابه لانها كفرت بأنعم الله رغم ما كانو عليه من حضاره وتقدم<br />الثاني : هم العرب المستعربه وهي تلك القبائل التي استطوطنت جنوب الجزيره العربيه او ما يسمى اليمن وبنت فيها حضارة سبا وتملكتهم بلقيس وقد ذكر الله حضارتهم وملكتهمفي القران الكريم وهؤلاءالعرب الكثير منهم لا يزال يعيش حتى يومنا هذا في جنوب الجزيره العربيه والباقي تفرقوا مع انهيار سد مأرب في شمال الجزيره العربيه وفي شرقها وغربها<br />الثالث : هم العرب المستعربه وهي تلك القبائل التي ليست عربيه بالاصل انما تزاوجت مع العرب وتكاثرت وتكلمت بلغتهم كنبي الله اسماعيل عليه السلام وكتلك الشعوب التي اسلمت بلدانها مع الفتح الاسلامي وتكلمت اللغه العربيه وتزاوجت مع العرب الفاتحين فهم فسمو بالعرب المستعربه ...<br />هذه نبذه بسيطه لمن يفتي بغي<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 155
subject = "الي الجهلة الاعراب"
author = "مصري أصيل"
posted = "2006-11-05"
text = "بطلوا حقد وجهل وهبل عمر الفراعنة ما كانوا رعاة غنم رحل زيكم طول عمرهم من أصل مصر العظيمة بدليل ان مالهم اي اثار فرعونية وكتابة هيروغليفية غير في مصر وبعدين البدوي اللي بيقول ان احنا بقينا بدو وبنروح نشتغل عند العرب ده دور مصر الحضاري انها تعلمكم وتعالجكم وتبني بلدانكم المتخلفة واقسم بالله ان مصر لو منعت عنكم كوادرها المهنية لاغلقت عندكم مستشفيات وجامعات ومدارس ومكاتب هندسية كثيرة وانا عملت في السعودية فترة واعرف اوضاعها جيدا ولا توجد اي كوادر من دولة عربية اخري تستطيع ان تغطيكم ويكفي ان حسب تقدير الصحافة عندكم امامكم 300 سن حتي تستطيعوا سعودة القطاع الطبي فقط الذي يعمل فيه 90 % من الاطباء المصؤيين وكذلك اساتذة الجامعة ياريت مصر تقطع عنكم كوادرها المهنية المتميزة عشان تعلمكم قيمتها ايها البدو الرعاع وبعدين بصراحة مبارك وحكومتنا القذرة المتواطئة معكم هي اللي دللتكم وخلتكم تتطاولون علي اسيادكم المصريين ايام عبد الناصر كان بيضربكم بالطائرات عندما قصف ابها والمنطقة الجنوبية وكنتوا أقل من الجزمة الله يخرب بيتك ياحسني يا مبارك خليت الاعراب الواطيين يتطاولوا في البنيان وده من علامات الساعة بطلو شغل محدثين النعمة ايها الاعراب الصعاليك"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 156
subject = "اللي هشام المصري وذو يزن من اليمن"
author = "ابن العرب"
posted = "2006-11-05"
text = "ياهشام المصري ويا ذو يزن من اليمن العرب ينقسمون لثنين العدنانيين هم من سلالة النبي اسماعيل بن النبي ابراهيم وانا من العرب العدنانيين والنبي محمد من العرب العدنانيين صح لم نكن عرب بلاول وكنا في العراق بمنطقه لاكن النبي محمد لبن عمي من العرب العدنانيين والعرب الاوائل هم من عرب قحطان من حضارة سبأ يعني العرب الاثنين من اهل الحضارات وكلمه طلعو من حضارة واقول للمصري الاخر روح شوف من هم الفراعنة قبل ان يحكمو"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 157
subject = "الى ذو يزن من اليمن"
author = "ابن العرب"
posted = "2006-11-05"
text = "يا يمني مش كل العرب منك انا من اصل العدنانيين من سلالة النبي اسماعيل بن النبي ابراهيم وانت تعرف انة حكام الخليج من عرب العدانيين وانا من العدنانيين من سلالةالانبياء والنبي محمد علية الصلاة والسلام ابن عمي والاعراب هم البدو وحنا لسنة من البدو وجدودي قبل الاسلام من حاضر العرب يا مصاروة ياصعيدة يافلاحيين"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 158
subject = "لليمني"
author = "ابن العرب"
posted = "2006-11-05"
text = "ليسة مهم لو كنا عرب الاوائل ام لا احنا نفتخر انة اصلنا من منطقة اسمها أور بلعراق والعراق ارض الحضارات بس انت تعرف انة النبي محمد منه احنا وابن عمنا يعني لو تقول عنه مش عرب او مستعربين عادي ملوك وامراء الخليج منه النبي محمد منه والنبي اسماعيل جدنا لم يكن بدوي مثلكم يعني جدودنا الاولين ليسو بدو"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 159
subject = "الي الصعيدي مصري أصيل"
author = "ابن العرب"
posted = "2006-11-05"
text = "يا مصري أصيل ياصعيدي يافلاح من قالك اني سعودي ؟؟؟؟ هو كل العرب سعوديين بس ؟؟؟؟ احنا اصولنا من جزيرة العرب بس ولحد الان بس مش بلسعودية يا صعيدي دخلنة عليكم بقيادة سيدي عمرو بن العاص علمناكم العربية وحررناكم من احتلال الروم ومثل الشي في بلاد المغرب حررناهم بقيادة عقبة بن يافع من احتلال الروم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 160
subject = "الى الذى يدعى انه المصرى الاصيل"
author = "هشام من مصر المسلمه البورسعيدى"
posted = "2006-11-05"
text = "على فكره يا د انته مش مسلم العب بعيد يا قبطى يا حاقد يا نصرانى كلامك مفضوح نحن نحب اخوا ننا السعوديين واهل الجزيره كلهم وان كان فينا الخير والشر ففيهم ايضا الخير والشر ولكن نحن اخوه فى الدين فيفكى هذا وليس ياتى صعلوك مثلك يأجج الصراع يا احاقد وقد سبق ان اخبرت االاخوه المصريين والاخوه العرب ان هناك اقباط ولاد كلب حاقدين يندسو بين الصفوف فاتقوا الله واقفلوا الموضوع ولعن الله هذا الموقه الذى مؤسسه قبطى نصرانى فقاطعوه افضل ونحن اسفين على كل كلمه صدرت من اخ لنا مسلم مصرى من داقع القوميه المخربه فلا ننسى انكم اهل المكارم والشيم حفظكم الله لنا وحفظنا لكم وشكراااااا للجميع ما عدا النصارى الحاقدين مثل المصرى الذى هو ليس عند اهله اصل"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 161
subject = "الي البورسعيدى"
author = "ابن العرب"
posted = "2006-11-06"
text = "والله العظيم انا رجع الموقع وكنت حقول نفس الكلام هم يحاربون اللغة العربية لانها لغة القرأن ويضنون بنسيان لغة العربية يعني ظياع القرأن ومن كم شهر طلع قسيس قبطي وقال يجب ان نغير لغتنا احذرو النصارى هم يحقدون على العرب لاننا نشرنا دين الله واحنا هل الخليج عرب اصليون من سلالة الانبياء تتكلمون عن ايام لما كان فينة الفقر كثير مش الكل وانا جدودي تجار من قبل النفط بمئات السنين ونرد عليكم ونقول انتو فقر الان واحنا في عصر خلافاء الراشديون والامويون والعباسيون كنا في سقف العالم من ناحية القوة او المال والكل يشهد لنا حتا الاروبيون بكتب تاريخهم ذكرو امجاد العرب التاريخ كتب ولايهم نباح الكلام يانصراني"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 162
subject = "فيا اهل الاسلام استيقظوا"
author = "نور الدين المصرى"
posted = "2006-11-06"
text = "فيا اهل الاسلام كفاكم غباءا وتصديقا لكل شئ عن طريق الاعلام الفاسد اليس فيكم كرامه رجال يضحون وبالغالى وبالرخيص وانتم تفتخرون بان هذا مصرى وذاك خليجى اتقو الله فلا فضل لااحد على احد الا بالتقوى يا عالم يا بشر استبقظوا اعراض اخواتكم فى العراق يغتصبن وشباب يفتتن من الروافض الحاقدين باسم المتعه وانتم غافلون هل انتم من امه خير البشريه صلى الله عليه وسلم نصيحه لله كل بلد فيها الصالح والطالح فاتقوا فى هذه المواضيع ولقد صدق الاخ هشام بان الموقع قبطى حاقد وكفاكم ياعرب كفاكم انتم فى واد والامه الاسلاميه يذبحها اليهود والشيعه الخونه والامريكان فى واد اخر اللهم هل بلغت اللهم فاشهد"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 163
subject = "الي المدعو هشام"
author = "المصري الاصيل"
posted = "2006-11-06"
text = "اعرفك بانني مسلم ولست نصراني ومسلم يفهم الاسلام اكثر منك اولا انت افكارك مشوشة ومتناقضة تقول انك ترفض القوميات ثم تتحدث بعنصرية عن فخر العروبة والعرب الاسلام الحقيقي لا يعرف قومية عربية ولا تركية ولا فارسية ثم تدعي الاسلام ثم بشق صف المسلمين بسب الشيعة وتكفيرهم الي اخر هذه الخرافات الوهابية السعودية المدعومة باموال النفط رغم ان الشيعة اكثر ناس يحاربوا اسرائيل وامريكا اعرف الاسلام صح وتكلم بادب و واضح من كلامك انك ارهابي من تنظيم القاعدة وامثالك هم اللي شوهوا الاسلام اعرف اخلاق الاسلام كويس هداك الله"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 164
subject = "الى المصرى الغير اصيل"
author = "هشام من مصر المسلمه البورسعيدى"
posted = "2006-11-06"
text = "تصدق بالله انت اجهل من ابو جهل انت تقول ان الشيعه يحاربوا امريكا واسرائيل اقول لك يا اعمى البصيره انت جاهل اتدرى لماذا // ماذا تعرف عن الشيعه الا تعرف انهم يسبوا عرض نبيك اذا كنت مسلم الم تعلم انهم يتهمون القران بالتحريف مثل النصارى يا ابو جهل سوف ادعمك بالوثائق // انت تقول ايضا انهم يحاربوا امريكا و اسرائيل انا اقول انظر اليهم فى العراق لم تجد شيعى واحد يحارب امريكى بل رجال االسنه الشرفاء ثم يا جاهل بخصوص حزب االلات هذا الذى يضحك على غبى مثلك الم تعرف ان حسن نصر اللات هذا كان فى منظمه امل الشيعيه التى قتلت اهل فلسطين فى صبرا وشاتيىلا ثم انه اعلن ياختطاف الجندينن فى وقت كان سيعرض ملف ايران على مجلس الامن يعنى بالعربى بيعمل لمصلحه ايران وليس لمصلحه فلسطين"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 165
subject = "الي ابن العرب"
author = "المصري الاصيل"
posted = "2006-11-06"
text = "ياحاقد مصر عمرها ما كانت فقيرة طول عمرها اغني دولة عربية واكثرها تقدما الي الان لكنها منهوبةمن حكامها احنا عندنا قناة السويس واكبر بلد سياحي عربي زنهر النيل ونفط وغاز طبيعي وزراعة وصناعة لكن حسني مبارك واولاده ناهبين البلد وقاعدين يبيعوها للخليجيين بابخس الاسعار لانهم متواطؤن ومرتشون ومثال ذلك بيع محلات عمر افندي للسعوديين احنا الدولة العربية الوحيدة اللي عندها كوادر بشرية وما بنسوردش بشر يشغلوا لينا البلد زيكم لانكم شعوب فاشلة ومتخلفة ودائما تطلبون مساعدة مصر الله يرحم ايام المصاري اللي كانت بتوصلكم من مصر للان بتقولوا علي الفلوس مصاري ونحن نفخر بالصعايدة والفلاحين المصريين هم بناة مصر الحقيقين واقسم بالله ان بعضكم يكره مصر اكثؤ من كراهيته لاسرائيل الله يلعن امثالكم ليس ذنبنا اننا متفوقون عليكم في جميع المجالات وانكم شعو ب بدائية تاكلون بايديكم مثل الحيوانات احنا فوق أوي وانتم بالحضيض دائما الاشجار المثمرة تقذف بالحجارة من صبيان بلهاء"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

