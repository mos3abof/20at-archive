subject = "بلاد الخليج الامريكى"
author = "انا متأكد فعلا ان ناس خليجيين محترمين ومثقفين زى المعلقة باسم فتاه سعودية بس دول نقطة فى بحر وما يمنعش ان خليجيين سفلة وقحبة زى ما بسمع على النت منهم ."
posted = "2006-10-07"
text = "ياريت كل واحد بعد كده يبقى فى حاله احسن المصرى اللى شغال عندكم شغال بجهد نظير اجر يعنى اى كلب خليجى يقول بيمن على المصريين يكتم ثانيا انا واحد مصرى ما بريدكم تزورا بلدى للسياحة واوربا اللى عاجباكم جدا اذهبوا اليها واصرفوا ريالتكم ودنانيركم هناك واذا كان معرفتنا بعض يبقى بلاش احسن"
