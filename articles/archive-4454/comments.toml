text = "حاجة تانية علشان تعرف اقدار الناس كويس الدكتور محمود اتعرض عليه الجنسية السعودية ورفضها عارف ليه لان لانه بيحب بلدة جدا مش علشان شوية زبالة زيك انت وغيرك ....."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 34
subject = "ممصر احتلت العرب"
author = "سمير السباعي"
posted = "2006-08-28"
text = "مصر احتلت قلب كل عربى اصيل سؤا كان مسلم او مسيحى مصر دايما و ابدا الاخت الكبرى للعرب اعتقد مقاله مثل هذه الان لاتخدم الا اعداء العرب ان كان هناك بعض المنتفعين من شتات العرب و يبذلونا كل ما يملكون من مال و قوه لتحقيق هدفهم فلا يكون موقعكم احدى الوسائل اللتى تساهم و بدون ان تدرى فى تحقيق هذا الهدف اننا البوم فى امس الحاجه الى من يوحدنا لا الى من يفرقنا اامل ان ترفع هذه المقاله و يكون بدلا منها ما هو انسب للظروف التى نمر بها وفقكمالله الى ما هو افضل"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 35
subject = "عيب ياولاد"
author = "عبده"
posted = "2006-08-28"
text = "ايه يا جماعه انتوا هتشمتوا فينا الامريكان و اليهود و لا ايه هما مش عرب زينا و من حقهم يزورونا و لا ايه و كمان يا اخي انت و هو ما كل بلد عربي و خليجي فيها مصريين كتير و بيتركزوا في اماكن و شوارع ليهم و رايحيين لشغل هناك و عايشيين كويس و لا لازم تفضحونا يا مصريين عيب كدا خلينا عرب و بنحب بعض بس خلاص"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 36
subject = "واحد خليجي"
author = "إذا سبني نذل تزايدت رفعة"
posted = "2006-08-28"
text = ".................وما العيب إلا أن أكون مساببه<br />ولو لم تكن نفسي علي عزيزة<br />.................لمكنتها من كل نذل تحاربه<br />يخاطبني السفيه بكل قبح<br />...................فأكره أن أكون له مجيبا<br />يزيد سفاهة فأزيد حلما<br />...................كعود زاده الإحراق طيبا<br />أذا نطق السفيه فلا تجبه<br />..................فخير من إجابته السكوت<br />فإن كلمته فرجت عنه<br />..................وأن خليته كمدااا يموووت"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 37
subject = "ماشى يا اخ شرشر"
author = "BATISTUTA"
posted = "2006-08-28"
text = "انا مغلتطش فى الاستاذ محمود بتاعك ده ولا وجهت له اى انهام من اى نوع لانى معرفوش .<br />وكلامى واحد ارجع اقراه تانى .<br />وبعدين لو احنا سفلة واوباش وحمقى زى ما بتقول فعيب يا اخى تنزل لمستوانا السافل ده عيب عليك دا انت راجل كبره وايدك طايله فى البلد وهتودينا ورا النجوم (عليا اسد وعلى اللى اكبر منه ارنب ) ومتقوليش انت اكبر واحد فى البلد شوف يانجم الكبير فى اللى اكبر منه .<br />انا لم ااتعرض للاخ محمود رفع الله من قدره ومنزلته كمان وكمان ودى مش تريقه والله عشان كده انا بكرر تانى اى كلام مش يكون موجه ليا .<br />واللى سب او شتم يرد عليك.<br />واخر مايكون يجى خليجى ولا اى كان يقتبس قصيدة اكيد مش فاهم نصها يتريق على الانذال اللى بيهينوا اقرانه عموما كويس اننا نلاقى خليجى بيعرف يقرا ويكتب الليلة عيد يا جماعة وشكرا للمحترمين بس"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 38
subject = "تعقيب صغير"
author = "BATISTUTA"
posted = "2006-08-28"
text = "اسلوب التهديد دا مش مقبول اكيد زى ما بيوصف لنا انهم من عيلة كبيرررررررة ولها جدذور فى البلد هو ده اسلوب المصريين الكرام .<br />(انت ما تعرفش انت بتكلم مين )البلد بقت ماشية كده كل واحد عارف له ظابط ولا لواء ولا وزير حتى يتنطط على خلق الله والبسطاء لهم الله اللى هو اكبر منك ومن العيلة ومن رئيس بلدك ذات نفسه .<br />انا مش خايف منك ولا من اللى وراك بس الواحد عنده عقل مش هكتب لك عنوانى عشان انسان طبقى زيك بيقيس الناس بمراكزهم ولو ان الواحد برده مش هين زى ما انت متخيل بس لو كل واحد لجأ للاسلوب ده هنبقى عايشين فى غابه كبيرة كل واحد بيخلص حقه بدراعه .<br />رسالة اخيرة بما انك راجل محترم وكبير واساتذة قانون المفروض تكونوا قدوة وتحترموا القانون اللى بتطبقوه على خلق الله ولا حدالله لا يطبق فى الا على بسطاء القوم وللاسف دى حقيقة وشكر مرة اخرى"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 39
subject = "تعقيب على باتيستوتا"
author = "شريف ابو غزاله"
posted = "2006-08-28"
text = "شوف ياحبيبى لما تبقى تكلم اى حد مهما ان كان صغير او كبير عيب انك تقوله انت محزوق ليه!!. مش هو ده اللفظ اللى قلتة ولا لا .. تانى حاجة انا عمرى ما قلت لاى مخلوق انت مش عارف انت بتكلم مين وانا مقلتلكش انت بتكلم مين انا كتبت اسمى وعنوانى علشان انا صريح ودوغرى ومبخفش غير من اللى خالقنى لانى مبغلطش فى اى حد انما اللى يغلط فيا اضربة بالجزمة حتى لو اكبر راس فى البلديعنى اسد فى حقى وعمرى ما كنت ارنب زى ما بتقول وانا مبستخباش ورا اسم مستعار ؟ لا انا بكتب اسمى وعنوانى علشان مش جبان وتانى مرة انا مردتش غير علشان خاطر الدكتور محمود اللى قلتوا عليه انه باع نفسة بريالين وهو للعلم من ساعة ما شاف الردود بتاعتكم وهو قرر انه ميدخلش هنا تانى .. حاجة اخيرة احنا مبنتحاماش فى لواء ولا ظابط ولا لينا فى الكلام ده لاننا مش بلطجية انما الغلط لالا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 40
subject = "الضيف له حق الإكرام"
author = "أحمد زين الدين"
posted = "2006-08-28"
text = "باختصار لم يعجبني اسلوب الرد في التعليقات. مش اسلوب ولاد البلد الجدعان<br />وكل واحد له رأي يعبر عنه سواء صاحب المقال او غير بس يا ريب لا نشتم ولا نسب وكل واحد يقول اللي هو عاوزه بأدب<br />وفي الاخر مصر بلدنا كلنا بترحب بكل ضيوفها."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 41
subject = "اعتذار"
author = "احمد زين"
posted = "2006-08-28"
text = "اسجل اعتذاري لكل من تم شتمه او سبه<br />سواء مصري او عربي<br />اتمنى من الله ان يوحد قلوبنا على محبته<br />مصــــــــر بخير ... بس خلوها في حالها"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 42
subject = "اسلوبك !!!!!!!!"
author = "BATISTUTA"
posted = "2006-08-28"
text = "اسلوبك فى الكلام بيحسسنى انك داخل معركةوكانك افضل مخلوق فى مصر شوف انت محترم والاستاذ محمود محترم بس فى محترمين كتير اوى برضه وزى ماهو دكتور فا نا قريبا جدا هكون دكتور .<br />واذا كانت كلمة محزوق استفزتك فانا بعتذر عنها وانا عمرى ما تطاولت على حد لا فى حياتى ولا على النت خصوصا لو كان مصرى ومسلم يعنى اخ .<br />ايضاح صغير انا بتخفى ورا اسم مستعار لانى بتكلم فى السياسة كتير اوى وانا مش مستنى امن الدولة يجى البيت يزورنى واكيد انت عارف البلد اكتر منى يعنى حجتى دى سبب مقنع انى اخبى اسمى حتى عن نفسى لحد ما ربنا يخلصنا من الظلمة واللصوص.<br />وارجو انه يكون اخر تعقيب على الموضوع ده وشكرا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 43
subject = "الى كعبول وشاكره باتيستوتا"
author = "مصرى عربى - كندا"
posted = "2006-08-28"
text = "ياترى انت مدرك لمدى الانحطاط بتعليقك؟ على كل حال انت اردت الاستهزاء بالعرب ولكنك فى حقيقة الامر كشفت عن انك تكسب من النصب على الناس (وان ادعيت انك تعمل بالسياحة). لعلك تدرك ان المال الحرام لاينفع صاحبه."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 44
subject = "الاخوان المنافقون"
author = "وائل عباس"
posted = "2006-08-28"
text = "يجب طرد العرب خارج مصر ، و طرد جماعة عمرو خالد و الاسلاميين الفرافير .<br />الاخوان ديما كدابين و منافقين ، لقد شاهدت من قبل واحد من الاخوان يقبل صورة مبارك عشان<br />يرضي عنه.<br />انا المعارض الحقيقي ، علي عكس الاخوان الذين<br />باعوا امهم و ابوهم عشان كرسي في مجلس الشعب.<br />يا غلاة الاخوان ضيقتم الدين .... وزغتم عن منهج الحنفاء<br />ما رأيتم منه سوى الكبت .... والحقد وابداء نقمة وازدراء<br />وانتقاصاً من الشوارب .... والثوب وميلاً لغزوة وعداء"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 45
subject = "سياحه"
author = "مواطن"
posted = "2006-08-28"
text = "المساله مش عرب او غيره، الفكره ان السائح اى سائح بيتعامل من سواء الاماكن التجاريه او المواصلات او الاجهزه الحكوميه او غيره على انه مواطن درجه اولى ويجب الاهتمام به حتى على حساب المصريين اهل البلد ، لهذا يشعر المصريين ان هؤلاء قادمين لمشاركتهم فى بلادهم بل واخذ حقوقهم.<br />المشكله ان فى فئه من العرب ياخذون بهذا الاسلوب وكانه حق لهم ، وكما شاهدت و سمعت و قرات كثيرا انه من السهل على السائح العربى اهانه العامل المصرى الذى يحتك به بدايه من السائق الى البائع الى عامل المطعم و موظفى الفنادق ولسان حاله يقول اهو كله بفلوسى يا كلاب!<br />واقول من جديد (((((( لابد من نوع ما من الرقابه على الردود فى الموقع على الاقل حذف الشتائم، لا اعتقد ان من حق اى مشارك كتابه شتائم كما لا اعتقد ان هناك من يحب سماع الشتائم بدعوى الحريه الشخصيه )))))."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 46
subject = "لا ادرى"
author = "BATISTUTA"
posted = "2006-08-29"
text = "لا ادرى لم يعترض البعض على تعليقات البعض كنوع من تفريغ شحنة زائدة او التنفيس عن النفس لما يشعر به الغالبية من المصريين من اهانة من العربى السائح او المقيم او فى بلده وحتى من حكومته المتواطئه والتى تأتى دائما على حساب المصرى فى كل الاحوال. يقتل مصريين فى حادثة المطار فيفر القطرى وتقفل الحكومة الموضوع على كده.<br />يهان المصرى فى بلادهم فلا يجد سند من حكومته ثم يصبح كثيرا على المصريين ان يسخروا او يتكلموا عن عليه القوم شيوخ النفط كأنهم ملائكة لا يخطئون ابدا .<br />ما كتبه كعبول قد اتفق مع معظمه وليس كله ما اعجبت به فقط هو طريقة تحليله لكل شخصية خليجية غالبا متطابقة مع الواقع"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

