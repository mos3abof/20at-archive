[[comments]]
order = 207
subject = "القرطرى ابن العرب+مسلم + محمد + عبدالرحمن خليفه شخص واحد"
author = "سامح محمود من مصر"
posted = "2006-11-09"
text = "اما بخصوص القطرى هذا فاقول له من منا الخائن وانتم عندك اكبر قاعده امريكيه فى بلاد الجزيره وعن اى خلافه تتفاخر فيها الم تعلم يا ابو جهل يا من سميت نفسك مره ابن العرب ثم محمد ثم سميت نفسك مره عبد الرحمن خليفه/ انت شخص واحد واخطائك الاملائيه تتشابه فى المقالات انظر الى جميع الاخوه العرب والى جميع الردود لم تجد احد يتعالى بنسب العرب وبالخلافه غير هذه الاسماء وطريقه الكلام ونفس الاخطاء الاملائيه انت مريض نفسى وجاهل الم تعلم ان الخلافه الامويه والعرب هاجرو الى بلاد الاندلس وبعدما سقطت جاءت الى بلاد المغرب ثم ان الخلافه العباسيه كان اخر نسلهم فى مصر بعدما سقطت الخلافه بايدى التتار وذبح الخليفه العباسى وقامت الخلافه على ايد سيف الدين قطز وعين ابن اخ الخليفه العباسى تعيين صوريا وشرفيا ثم بعدها قامت الخلافه العثمانيه يا ايها الطفل الحقير انت مريض وجاهل تتعالى بغنى بلادكم ولكن جهلكم فيكم انظر الى اخطائك الاملائيه وبعدها تعالى سب //المصريين والسعوديين اسيادك يا مجانين انتم بلا فائده اين خنزيركم وزير الخارجيه الذى قصفت لبنان من القاعده الامريكيه فى بلادكم سبحان الله صدقنى انتم عندكم عقده من النقص تحاولون ان تناطحوا اكبر الدول وعفا الله عن كل اخ قطرى شريف فهذا الحقيرالذى يبدو من كلامه انه تافه ويحمل حقدا على اهل مصر والسعوديه لامثيل له وليس غريبا لو ظهر انه رافضى حقير او نصرانى وضيع ويتكلم باسم الخلافه ليشق الصفوف //الى اخواننا فى بلاد الحرميين نهديهم سلاماااااااااا"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 208
subject = "فإن أتاكم فاسق بنبأ فتبينوا...."
author = "عربي موحد..من أمة محمد"
posted = "2006-11-09"
text = "لي وقفات مع بعض من أخطاء الكاتب الدينية والفكرية...وهي:<br />أولاً أخطأ الكاتب في العنوان ( وأقرب شيء للعنوان هو..عنوان تجاري أو دعائي للإثارة ) وفيه غمز المصريين بأنهم ليسوا بعرب وهذا يدل على ضحالة فكر الكاتب.<br />ثانياً سنة محمد صلى الله عليه وسلم هي السنة الوحيدة التي نتبعها وليس سنة السياح من جميع الجنسيات والذين يتسابقون على حجز مقاعد السينما التي تفسد العقول والدين والأخلاق...فقدوتنا هو محمد صلى الله عليه وسلم وليس من يمثلنا في السينما والنوادي الليلية.<br />ثالثاً افتخر كسعودي ومسلم قبل ذلك أنه لايوجد لدينا دور سينما مفسدة للدين والعقل والأخلاق والنشئ...والسبب أن الله قالى تعالى ( وما خلقت الجن والإنس إلا ليعبدون ) فالله أمرنا بعبادته...والسينما فيها عصيان لأمر الله وإنشغال بسفاسف الأمور الدنيوية..وفيها من الرذيلة الشيء الكثير..وما المقاطع التي حذفت من بعض الأفلام إلا دليلاً على خستها وانحطاطها ودنوها...فأي فائدة سأجنيها من بطل للفيلم في حالة سكر مع امرأة في وضع فاضح ومخل؟؟؟<br />قالى تعالى ( مالكم كيف تحكمون )..<br />رابعاً الكاتب استهزأ بعباءات النساء المسلمات وبلباس الرجال الأبيض...وهذا رايه وحده ولا يعمم على إخواننا المصريون الذين تربطنا بهم اخوة في الدين...فهم إخوتنا وأهلنا مهما قال ناقصوا العقل والمتعملقون في طريق زرع الفتن وبثها بين المسلمين...وراي الكاتب يبين مدى ضيق فكره وعلمه الشرعي...فكتابته ورأيه يطغى عليهما أسلوب المنافق الذي يزرع الفتنة بين المسلمين.<br />أختم بهذه الآية....<br />( يا ايها الذين آمنوا إن جاءكم فاسق بنبأ فتبينوا أن تصيبوا قوما بجهالة فتصبحوا على مافعلتم نادمين ) الايه<br />يجب على من يحمل مثل فكر هذا الكاتب أن يوقف عن الكتابه لأن في هذاالفكر مفسدة<br />اقرأ بقية التعليق .."
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 209
subject = "يا احب العدل سعودى محب لاهل الكنانه"
author = "عبدالرحمن بن خليفة"
posted = "2006-11-10"
text = "يا سعودي ياللي امك مصرية سمو الشيخ محمد بن حمد ال ثاني لم يدخل المزاد لكي يشتر الكورة لا دخل ودفعه لكي تذهب اموالة للمحتاجين وهو عمل خيري وانت جبت الكلام من موقع اسلامي يعني الدليل على الخير وليسة هو وحدة لا الكثير من الاسرة الحاكمه والقطريين دخلو واشترو حتا زي رياضي بكم مليون دولار لتذهب الاموال للمحتاجين وللمصري من قال اني من الخلافاء انا كنت اتكلم عن زمن العرب وهم حكمو العرب وكانو بمصر في اخر الزمن عندما سقطت دولتهم"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 210
subject = "من نسل الاكرام"
author = "عبدالرحمن بن خليفة"
posted = "2006-11-10"
text = "وكمل على كلامي تحت رعاية الاميرة ابنت امير قطر اقامت قطر مزاد وهو ايادي الخير الى اسيا لكي تساعد اموال المزاد الفقراء والمحتاجين في اسيا من الدول العربية لشرق اسيا يعني كل ماهو اسيا والمزاد كان يتكرر على شيء واحد يعني شخص دفع كم مليون دولار سيارة ويعيدها للمزاد لكي تباع مرة ثانية وتجمع اموال اكثر وهو فقط دفع ولم ياخذها لانه فاعل خير ولم ياتي لكي ياخذ لا بل ليساهم بلخير"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 211
subject = "دولة الشيخة موزة"
author = "سيدك المصري"
posted = "2006-11-10"
text = "يا قطري يا قبيح تحدثت سابقا عن جمالكم الرائع الا ان عرفنا وهذا قمة الهزل انكم من بلد التاني وموزة هل عميت عينيك ولا بتستهبل انت ماشوفتش منظر اميركم البشع اللي عامل زي الغوريلا او انسان الغابة وشكل وجهه الاسود واضح تماما الاصل الهندي فيه وزوجته موزه و منظرها المريع انت تستعبط علينا ايها الجلف الهمجي ده انتم طول عمركم منبع وأصل الفقر واسال ابوك وامك كانو عايشين أزاي علي فكرة مذكرات الشيخ القرضاوي وهو عندكم من الستينات وضحت كيف كان الشكل البدائي والمظهر الفقير لقطر عند بداية عمله هناك يا محدثين نعمة فعلا دي صفات الناس الواطية اللي زيك اللي هم شبع من بعد جوع طويل وعلي فكرة السعوديين دائما يقولوا علي اللي ساكنين في السواحل انهم طرش بحر زيكم كده يعني لفظكم البحر من جهات متعددة زي الهند وجنوب اسيا وايران اصحي يا هندي ومتتطاولش علي اسيادك المصريين تاني ليدوسوك تحت جزمهم يا أوطي من الجزمة"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 212
subject = "الى اخي سامح محمود"
author = "صالح"
posted = "2006-11-10"
text = "اخي الفاضل،، اشكر لك ردك الكريم والذي ان دل فانما يدل على طيب خلقك واصلك،،<br />استاذي ذكرت في معرض حديثي انني صدمت من ان طبقة المثقفين والكتاب لديكم تنظر لنا بتلك النظرة الدونية..!!<br />فالمقال عنصري بشكل يرى بالعين المجردة.. فهو امر محير وبنفس الوقت غير مطمئن..!!<br />واتفق معك بان التعميم من اكبر الاخطاء التي نقع فيها.. ولكن استاذي اذا كنت تحب مجتمع وبعض افراد هذا المجتمع ينظرون لك بتلك النظرة الدونية والازدراء الواضح.. فهل تعتقد بانه من الصحيح استمرارك بالتعامل مع ذلك المجتمع..!!<br />انت والكثير مثلك اخي سامح هم من جعلنا نحب مصر,.. فالاخلاق الكريمة والخلق الحسن والتعامل الطيب من شيم المسلمين جميعاً.. ولكن استاذي نحن يهمنا ان نكون مقبولين في اي مكان نذهب اليه .. فاذا كنا نضيق ونسبب \"زحمه\" ومنظر غير لائق بتجمعنا في بعض الاماكن كما يعتقد كاتب الموضوع .. فالاولى بنا المكوث في بيوتنا .. او تغيير وجهة سفرنا لمن يستلطفنا ويحبنا..!!<br />لكي نرتاح ونريح..!!<br />وجهة نظر .. واشكرك مرة اخرى اخي الفاضل"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 213
subject = "من شر حاسد اذا حسد"
author = "ابراهيم الشعلان الغامدي"
posted = "2006-11-10"
text = "بسم الله الرحمن الرحيم<br />هل هذه التعليقات تمثل النخبه في مصر ؟!<br />أم تمثل المراهقين الذين لم ينالوا التربيه المصريه الشريفه العربية الأصيلة ؟<br />في نظري ان كل من يكتب كلمه لا تليق به كمسلم فهو من النوعية الثانية التي ذكرتها في البدايه ..<br />هل هذا يا كاتب المقال حقد ؟!<br />أم حسد ؟<br />لا يمكن أن تكون شيئا آخر ..<br />لأنني ألاحظ أن العائلات المصريه في مصر الذين يمتلكون الماده ويعيشون في سعة من العيش ولله الحمد لا يمكن أبدا أن يتحدثوا بكلامك أبدا .. لان الله اكرمهم وبذلك كأنك يا اخي في الاسلام تعترض على حكم الله وعلى قدرة بأن تكون فقيرا أو خلافه .. وانا على استعداد على أن أقسم بالقرآن الكريم أن حالتك الماديه ليست بالممتازه او الميسوره والجيده .. وإلا لكانت طريقتك في الحوار تختلف كثيرا عن هذا الأسلوب .. جميعا ً نعلم أن هناك مصريون شرفاء ومصريون ليسوا بشرفاء وكذلك في السعودية وكل دول العالم .. فحاول أن تكون من الشرفاء وليس من ليسوا بشرفاء .. ومن الشرف الأدب .. والكرم .. وحسن الضيافة وخلافه .. سبحان الله العلي القدير يأتي شخص ليشتم السعوديه وغيرها من الدول وكأنه بشتم هذه الدول قد دخل الجنه ؟!<br />هل هذا هو طموحك وحلم حياتك أن تشتم سعوديا ً ؟<br />لماذا ؟<br />هل لانك رأيت مثلا ان هناك سعوديين ياتون الى مصر ليمارسوا الزنى مع بعض البنات المصريات ؟<br />إذا كان كذلك .. فما أدراك ؟ إلا ان كنت تذهب إلى هناك .. ؟ ولكن لو أن اهتمامك ديني وتذهب الى المساجد لرؤية ايضاً خليجيين يصلون ولكن انت لا تعرف الا الجانب السيء او السيؤون وعديمي الأخلاق لانهم يتواجدون في أماكن تواجدك فتجمعكم الصدف في ظلال الشيطان ؟!<br />واتمنى انك تشغل نفسك بقراءة قصة عمر الخطاب رضي الله عنه عندما ارسل اثنين لمص<br />اقرأ بقية التعليق .."
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

