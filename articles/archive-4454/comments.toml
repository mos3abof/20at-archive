[[comments]]
order = 144
subject = "الى الاخت المستبده الخليجيه هل انتى مسلمه ؟!!!"
author = "هشام من مصر المسلمه"
posted = "2006-11-01"
text = "سبق ان اخبرت ان هناك الكثير من المصريين مندسين بين الصفوف وهم من الاقباط النصارى الحاقدين وليسوا اهل مصر الجعدعان فهل يا اخت الاسلام اذا كنت مسلمه تعى ما تقولين اما اسمك منطبق على شخصيتك الحقيقه وهناك عقده نقص فى حياتك تعانين منها مصروف ايها وتقطعى ايه ربنا يهديك على فكره الايام القادمه يا اختى لاتحمل خيرا لاهل الخليج فالشيعه الحاقدون من ايران ينتظرون الفرضه ليفترسوكم فهل انت شييعيه حاقده ؟ ام انتى من اهل السنه مثل اهل مصر الكرام الذين لايحملون حقدا لاى شخص ولا لاى قوميه واذكرك يا اختى اذا كنت اختى فى الاسلام ان خريطه الشرق الاوسط الجديده ليسها فيها الكويت ولا الامارات فما رايك فمن ينقذكم غير الله وبعدها اهل مصر الذين انقذو الاسلام من ايدى التتار والمغول والصليبين وهل نسيتم ماذا يفعل فيكم الامريكان على ارضكم ويستعمروكم وياخذون البترول باقل الاسعار ومع ذك تقبلون ايديهم والعجيب ان اهل مصر هم من بنوا وشيدو بلادكم بالدموع والعرق يا اختاه ادعو الله لك بالشفاء فانى ارى انك تقطرين حقدا لامثيل له على اهل مصر فو الذى رفع السماء بلا عمد اما انتى ثلاث اشياء لارابع لها اما انتى رافضيه شيعيه او صليبيه مسيحيه حاقده او مجنونه تعانين من عقده ما ربنا يهديك"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 145
subject = "إلى كاتب المقال وكل من شارك"
author = "ذو يزن من اليمن"
posted = "2006-11-02"
text = "عزيزي كاتب المقال تحيه ود ممزوجه بالمفهوم الذي يقول بأن الأختلاف في الرأي لا يفسد للود قضيه .. وبعد أراك تتكلم في مقالك عن مصر وكأنها ليست عربيه وكأنها ليست مصر العروبه والاسلام اللذان تجذرا فيها أكثر من تجذر اوتاد اهرامات الجيزه الاسلام عندما يحل في بلد لا يغادر نفوس أهلها إلى ان يرث الله الأرض ومن عليها ومن حمل الاسلام إلى مصر الكنانه هم العرب وهؤلاء العرب استوطنوا في مصر وتزاوجو وتناسلوا مع سكانها الاصليين بمعني أن مصر التي تتكلم عنها عربيه رغم أنف من تشدق بغير ذلك وستظل قلب العالم العربي الاسلامي وحامية بيضته هذا قدرها شئت أم أبيت هذا تعليقي فيما يخص عنوان الموضوع اما ما تكلمت عنه فهو كما يقال كلمة حق أريد بها باطل فكل ما ذكرته صحيح من اسماء وحقائق عن الاماكن والشوارع وانا حاليا أعيش في مصر ومتزوج من مصريه والمس كل قلته في الصيف ومعظم ما ذكرته من حقائق لكن يا عزيزي تعال لنتناول الموضوع ونأتيه من جذوره وأعماقه فالعنصريه التي صغت بها كلامك هي للاسف عنصريه متجذره في ثقافاتنا كشعوب عربيه تقطعت اوصالها من جسد واحد الى 22 قطعه هي بعدد الدول العربيه فتلك الثقافه هي ثقافه مستورده لتغرس في المصري بأنه مصري وفي اليمني بأني يمني وفي السعودي بأنه سعودي ليصرفونا ما هو أهم من عروبتنا وليضعفوا ذاك الرابط الذي يربطنا برباط قوي ومتين وهو رباط الأسلام فأنت تفتخر بمصريتك أكثر مما تفتخر بكونك مسلم وذاك يفتخر بسعوديته أكثر من كونه مسلما وذاك ... الخ يا عزيزي كفانا هرطقه ترديد عبارات كما تعمل البغبغاوات فنحن نعيش في كذبه اصطنعها لنا الغرب وجرعوها لنا في ثقافاتنا ومع البان امهاتنا فكما يوجد في مصر أمثالك عنصريين يوجد أيضا في السعوديه منهم على شاكلتك ويوجد في اليمن كذلك وفي كل شبر عربي مسلم<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 146
subject = "هشام الي يقول انو مسلم ومصري"
author = "المستبده الخليجيه"
posted = "2006-11-04"
text = "اولا سبت كل هالردود وجيت على ردي ..انا دخلت على الموضوع واتمعنت بالردود وتفأجات بكم هائل من الحقد والسفاله والدناءه في الالفاظ على اهل الخليج مماجعلني ارد بالمثل وقديما قيل اذا عرف السبب بطل العجب ..رده فعلي المهذبه جدا نتيجه تطاولكم علينا وكنكم انتو لكم الفضل في النعمه الي احنا فيها ياربي لك الحمد<br />ثانيا حبيبي انتو صح جيتو واشتغلتو عندنا وتقولون انكم عمرتو بلادنا اظن انكم جيتو هربا من فقركم عشان تحسنون اوضاعكم جيتو وخدمتو عندنا واخذتوبالمقابل فلوس على عملكم بالعربي لاتمنون علينا وانتم كنتو المستفيدين اولا واخيرا خلكم منطقيين شوي وترى موبس انتم فيه كثير من البريطانين والامريكين والهنود والسنود وكل الجنسيات محد حسدنا على النعمه كثركم من جد عيونكم فاضيه وماشفتو خير<br />ثالثا لااسمح لك ان تنعتني بالرافضيه او الصليبيه الحاقده لانني لم اتعدى على ثوابت دينيه هل يعتبر ردي على اساءتكم لنا يخرج عن دائره التوحيد؟.. ويحك وخسئت<br />رابعالو فيكم خير زي متقول وعندكم حضاره كان نفعتو بلدكم بدل مهي اوسخ واقذر بلد مستوى التلوث يصل الي اعلى المستويات في مدينه كالقاهره الشوارع القذره واكثر بلد عربي في النشل (رمتني بدائها وانسلت) والسرقات وحكومتي تصيدكم في المواسم وتعبت معكم وانتم حتى متخافون الله تنشلون في بيته لاخوف ولا رجاء الله لايبلانا<br />اذا اردت ان تتعرف على عالم السكر والعربده والفسق والمجون والخلاعه ودناءه الاخلاق والحسد والحقد والحقاره ..اهلا بك فانت في مصر >> على قولتكم نورت مصر<br />خامسا لااحمل ذره حقد او كراهيه لنكم لاتعنو لي شئ فالقافله تسير والكلاب تنبح لان الخليجي عربي اصيل بالفطره انسان طيب وشهم وكريم الاخلاق عشان كذا مسامحتكم ايش نسوي تموت الحيه وسمها برأسها"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

