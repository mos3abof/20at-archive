[[comments]]
order = 62
subject = "والله مصري"
author = "ساكت"
posted = "2006-09-03"
text = "سعودية ايه يا شويه غجر<br />والله السعوديه اللي بتكلموا عليها دي<br />اشرف واكبر من ان تتقال على لسان واحد فيكم لو قعدت للصبح اقول مميزات السعوديه مش حخلص<br />ولو قعدت للسنه الجايه اتكلم في فساد مصر المحروقه بردو مش حخلص<br />كفايه غباء دا اليهود مالين سيناء اتشتطروا يا بهايم واتكلموا عنهم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
