subject = "السياحه في الدول العربية"
author = "اماراتيه"
posted = "2006-09-06"
text = "صراحه الغلطة غلطة الخليجيين لاني ضد السياحه في الدول العربية بشكل عام ولكن العذر ان من يذهب للسياحه في الدول العربية هي من الطبقات الفقيره الخليجيه ممن لا يستطيعون تحمل نفقات السفر في الدول الاوروبيه لذلك يذهبون للدول العربية وكثير منهم (يعيثون فيها فسادا) نظرا لمستواهم الاجتماعي المتواضع ،،، شئ اخر عن السينمات المصريه عفوا اخي ولكن مااسمعه عن مستوى السينمات المصريه شئ ليس بجيد ولا يقارن بمستوى السينمات الخليجيه (او الاماراتيه تحديدا) اما الاحتلال فانا اعمل في قسم في هيئة عدد المصريين العاملين معنا في هذا القسم يفوق عدد المواطنين (نظرا لقلة اعداد المواطنين اصلا فنحن لا نتعدى 15% من عدد السكان في الامارات) ومع ذلك لم نقل احتلونا ولا هم يحزنون و بالعكس اعز صاحباتي هن من المصريات والفلسطينيات ،،،، اما عن الاوبرا for god's sake لماذا لا يذهب المصريين الى اوبرا عايده هذا ان سمع بها معظم الشعب المصري اصلا او اذا عرف بوجودها ،،،، ومع ذلك لا ادري هل منظمو الاوبرا (الموسميه) قد اشتكوا الى جنابكم الكريم بقلة اعداد الحضور من الخليجيين؟ ام ان سموكم (يقطع تذاكر) فعرف انه لا يوجد خليجي واحد يذهب هناك واعود واكرر من يذهب للدول العربية للسياحه هم من الطبقات البسيطه التي لا تهتم باوبرا عايده او اوبرا نبويه وفتكات ،،،، مصر بها مقومات سياحه عالميه مثل الاهرامات و غيرها ولكن للاسف الشديد جدا جدا جدا لا يوجد بها صناعة سياحه ولا انسى برنامج في تلفزيون ابوظبي عن سرقة الاثار المصريه و الاوضاع التي عليها صناعة السياحه المصريه (واكرر هي صناعه وعلم والا ضاعة هذه السياحه من نقص المقومات) من اراد منكم معرفة كيف تطور الدول ذات الاثار سياحتها عليكم بتركيا و ايطاليا ستعرفون الفرق<br />p. s للاخ الاردني ،،<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 68
subject = "تعليقات"
author = "ابن النيل"
posted = "2006-09-07"
text = "الاخت الاماراتية اولا الخليجيين الذين ياتون مصر ليسوا من الفقراء بل فيهم الكثيرين من العائلات الحاكمة في الخليج بل ومنهم مقيمين وشبه مقيمين اقامة دائمة في مصر وده لان مصر هي الدولة الوحيدة في العالم اللي بتستمل مخالفاتكم وبلاويكم وده عيب حكومة مصر ومصايبكم دي لو بتحصل في دولة تانية كان زمان معظمكم في السجون واسالي عن مهازل الامير تركي وحاشيته والولد القطري اللي من عائلة امير قطر وصدم وقتل بعض المصريين وهرب للاسف بسبب تواطئ الحكومة ثانيا انت بتقولي الناس بتيجي مصر عشان الاهرام والاثار وده عمر الخليجيين مابييجوا عشان كده ده بالعكس انا سمعت منهم كثيرين ان البتماثيل دي عبارة عن اصنام ومالهاش لازمة ولو روحتوا اوروبا او تركيا بيبصوا لكم كانكم ارهابيين ومتخلفين ومابيرحبوش بيكم زي مصر ما بتعمل لكم الاخ السعودي اللي بيدافع عن نظام الكفيل لحماية الاقتصاد زي ما بيقول طب ليه اوربا واريكا واليابان مابتعملش نظام كفيل عشان تحمي اقتصادهاده طبعا لانه نظام غير انساني ومتخلف واخيرا قرات بعض التعليقات من بعض المصريين وده للاسف الشديد كانوا خناجر مسمومة تطعن في ظهور اخوانهم المصر يين ومع الجانب المتجاوز من العرب وده للا سف بسبب مصلحتهم واستفادتهم بطريقة او باخري هؤلاء يجب احتقارهم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

