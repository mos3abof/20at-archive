[[comments]]
order = 49
subject = "البودي جارد شرشر ابو غزالة"
author = "مصراوي"
posted = "2006-08-29"
text = "يعني سيدك اللي قاعد في السعودية بيتصل بيك عشان تضرب واحد بسنجة او ترمي علي مية نار مش كده يا بلطجي يا ماجور واسلوب الردح بتاعك اللي عامل زي المعلمة سكسكة ده مش هاينفع معايا وانك هاتوديني ورا الشمس يعني انت تبع الجماعة اياهم بتوع المباحث وحلوة اوي دي قلي علي اسمك وعنوانك ياعميل يامعفن انت واللي مشغلينك بالفلوس اتفو عليك رمة وواطي وحقير بيئة منحطة صحيح وعلي فكرة انا مابحبش اتكلم مع خدامين زيك هات سيدك الي مشغلك اكلمه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 50
subject = "الى الكلب مصراوى"
author = "شريف ابو غزالة"
posted = "2006-08-31"
text = "فعلا كلب وابن كلب ولو انت راجل متتخفاش ورا اسم مستعار ياقذر والمعلمة سكسكة دى تبقى امك روح قوم لها محامى يطلعها من قضية الاداب اللى هى ممسوكة فيها ياعالم زبالة واحنا مش خدامين ياكلب احنا اللى زيك يتمنوا انهم يعرفونا واحنا مش عملا لحد ياعرة اخواتك ملعون ابوك على امن الدولة وتانى مرة لو انت راجل قول على اسمك وانا مش بلطجى علشان امسك مطوة ولا ميهة نار دة شغل الهمج اللى زيك ياصايع علشان واحد واطى زيك يشتم اسيادة واللى بتقول عليه سيدى ده ياابن الكلب احسن من عيلتك كلها لان واضح ان انتوا عيلة احسن واحد فيهم عربجى مع الاحترام للعربجية ده انت مش محصل عربجى انت الكبير بتاعك الحمار اللى بيجر العربية ولو ان كده هنظلم الحمار . ادعى للتكنولوجيا اللى خلت بهيم زيك يقعد على كمبيوتر ويعمل فيها اسد ولو انك مش محصل مرات الاسد .<br />ملحوظة : انا بعتذر لقراء الموقع على الالفاظ اللى اتقالت ولكن الزبالة دى مكنش ينفع معاها الا ضرب الجزم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 51
subject = "الي الشرموطة شوشو ابوغزالة"
author = "مصراوي"
posted = "2006-08-31"
text = "يا شبيه الرجال يا خول يابن المرة الوسخة احترم نفسك شوية انت واللي ماجرينك يا بيئة منحطة وواطية انا مابحبش اتكلم عن نفسي انا اصغر واحد في عيلتي يفعصك تحت جزمته زي الصرصار انت واهلك يلعن ابوك عيلل وسخ وعيل واطية ما جبتش رجل انا باحس بقرف وغثيان لما اضيع وقتي مع عيل جربوع وابن مرة لبوة زيك مرة تانية اتفووو عليك خدام وعميل رخيص ابن جزمة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 52
subject = "الي اللبوة شوشو"
author = "مصراوي"
posted = "2006-08-31"
text = "سالت علي اسمك الوسخ في العنوان الوهمي بتاعك ده وعرفت ان مفيش رحد بالاسم ده ساكن هناك وده طبعا ماكنت اتوقعه يا خول يابن الشرموطة روح العب مع اشباهك بعيد وانا متاكد ان انت واللي اسمه محمود ده نفس الشخص انا فاضي لاشكالكم ياولاد الشرموطة يلعن ابوك رمة وقواد ابن مرة متناكة شكك"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 53
subject = "ايه القرف دا"
author = "نيفين نيفى نوفا"
posted = "2006-09-01"
text = "انتو فين يا عشرينات<br />شويه رقابه على الموقع علشان مش منظر اننا نقرا الكلام المقرف اللى فى التعليقات دى<br />و للمره المليون بيتعمل مشكله على موضوع مش مستاهل<br />محمد قرنه اكيد مقصدش المعنى اللى وصل دا بالظبط هو ممكن يكون قصد ان االعرب بيتمتعو ف مصر باللى مش بيتمتع بيه اهلها المصريين البسطاء و دا برده مش كويس لكن الموضوع موصلش لحد العنصريه يعنى ارحمو الراجل شويه مش كده<br />بس بالنسبه لموضوع عبد الله انا بحب اقول لمحمد ان صدقنى عبد الله انت ظلمته لانه مقصدش يهينك و لا حاجه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 54
subject = "اقرع و نزهي"
author = "مزاج عالي"
posted = "2006-09-02"
text = "اهو احنا يا مصريين ينطبق علينا مثل اقرع و نزهي .. يعني مش عاجبكم العرب و بتقوبو عليهم جرب ؟ طب مهو الجرب اصلاً مكانو عندنا , مش احنا اللي لسه بنستخدم العربيات الكارو و الحمير و البغال ؟ مش احنا اللي الغالبيه العظمى من الشعب عياره عن شوية جلهه و عاطليين و مجرميين و فاسدين ؟ ولا ده مش الشعب المصري ؟ مش احنا اللي فضلنا نمن على الشعوب العربيه بشوية المساعدات اللي ككنا بنرسلها زمان ليهم ؟ اصلاً جمال عبد الناصر كان بيعمل كده عشان يعمل لنفسه مجد شخصي مش اكتر عشان العرب يحبوه ؟... و النبي يا ريت نفوق شويه احسن دحنا حالنا بقا زباله قوي لو قارنت تاريخا بخاضرنا = احنا ازبل بلد ممكن تعيش فيها من بين الدول العربيه حالياً و ده للآســــــــــــــــــــــــــــــــف"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 55
subject = "كلامك مش مضبوط"
author = "ابن النيل"
posted = "2006-09-02"
text = "يا اخ صاحب المزاج العالي لو مصر ازبل بلد عربي تعيش فيه زي ما بتقول ماكناش نبقي اكبر بلد سياحي عربي وكل العرب بيحبوا يجوا مصر ويشتروا شقق فيها للاقامة حتي الاجانب الاوربيين بيعشقوا مصر زكل سنة في مليون الماني بيحبوا يجوا مصرسنويا يا خي تحري الصدق في كلامك وبلاش جلد الذات ده"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 56
subject = "ياسلام سلم هي الشحاته بتتكلم"
author = "سيدكم عربي"
posted = "2006-09-02"
text = "ايه قلة الادب دي<br />شحاتين وبنصرف عليكم وكمان لسانكم طويل<br />نصابين حرامية وكمان مش عاجبكم الي بتسرقوه<br />ولكن كما قال المثل<br />كن من اللئيم على حذر اذا اكرمته"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 57
subject = "الى الموقع سيدكم العربى"
author = "مصرى عارفكم"
posted = "2006-09-02"
text = "شحاتين مين يا زباله يا ابن الزباله<br />مصر دى اللى كانت بتصرف عليكم و اسأل جدك اذا كنت عارف هو مين أصلا ولا حتى ابوك<br />مين<br />اما اذا كانت الظروف اتغيرت و لقيتوا فلوس فالجزمه مهما اتملت دهب و فلوس حتفضل برضه جزمه<br />اسأل عن التكيه المصريه فى بلدك اللى كانت بتوزع صدقات المصريين عليكم<br />و مين كان بيبعت كسوه الكعبه كل سنه<br />\"التانيه\" اللى بتعملوها فى الجلاليب سببها ان لماكانت مصر بتبعت الملابس للعراه فى بلدك كانت ممكن انها تتفك لوكان اللى حيلبسها طويل<br />خلاص المصريين دلوقت شحاتين<br />بالمناسبه<br />انت برضه بتلبس فوطه على دماغك ؟؟؟"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 58
subject = "احنا نحارب بعض احسن"
author = "احمد الالفي"
posted = "2006-09-02"
text = "انا رايي كده نحارب بعض عشان نحط حد للحورات دي نضرب السعوديه بالطيران او بالصواريخ او بالبحريه .. بدل ما نكمل بعض بنتخانق مع بعض يسلام علينا .. طب دلوقتي السعوديه فيها فلوس تشغل قاره و مصر فيها كمية عماله تشغل قارتين و الارض واسعه اوي في السودان و المعادن ماليا الدنيا في الجزائر و مصر و الخبرات التكنولوجيه موجده في سوريا و لبنان و مصر و عناصر الجزب السياحي ماليا الدول العربيه في الجناح الغربي طب ليه منكملش بعض بقي .. اللي ناقصه عمال ياخد من اللي عنده عمال زياده واللي عاوز فلوس يخاد من اللي معاه فلوس واللي عنده دمغه و علماء يعلم اللي ناقص عنده خبره و اللي عاوز خامات ياخد من اللي بينتج خامات و كده فلوسنا تدور و تكسب والناس تشتغل و البلاد تنتعش .. ونبطل خناق .. و لا هيا بنوك سويسرا و التصدير لاسرائيل و البحث في جامعات امريكا و الهجره لفرنسا و العمال الهنود اولا ..."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

