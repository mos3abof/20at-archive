[[comments]]
order = 128
subject = "مصر لازم ترجع فرعونية ياهوووووه"
author = "أحمد القماش"
posted = "2006-10-15"
text = "ياخلق هووووووه اتخنقنا الحكاية بدأت ايام امجاد ياعرب امجاد ووصلتنا للتنحي ولما جاء السادات بتغيير اسم دولتنا ال جمهورية مصر العربية وقال ان مصر موجودة قبل مايدخلها العرب قامت الدنيا وماقعدتشي اقترح ان يكون اسم دولتنا جمهورية مصر الفرعونية وتكون اللغة الرسمية هي اللغة الفرغونية ياخلق هووووووه نفسي يبقي لينا هويه اصل مبدا علشان مايجيش اليوم ال البدو الزلم يتبولوا علينا بالشارع واوعي حد يقول عليا انني علماني ربنا يجيب العوالم سليمة انا مصري فرعوني ديانتي مسلم لاحب العرب ولا الانتماء اليهم فأنا مصري صاحب الحضارة حتي هم لايقارنوا بتاريخ مصر الحديث مش الوسيط او القديم ياهوووووووووة اتفرجوا عليهم من 60 سنه بس كانوا ومازالوا زبالة في اخلاقهم وعاداتهم حيونات في طباعهم ياهووووووووووه ياريت نختار بني ادمين يدخلوا بلدنا مش حيوانات وسلميلي علي المعاملة بالمثل ارحمونا اتخنقنا من اشكالهم وافعالهم.<br />ياهوووووووة بحلم باليوم ال نعود فية للغة الفرعونية القديمة والذي المصري القديم لكي يكون لنا هوية ولانتشبة بالحيونات.<br />احمد القماش"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 129
subject = "مصر العظيمة"
author = "عثمان الخطاط"
posted = "2006-10-16"
text = "انا مواطن اعتز كونى مصرى اصيل وكل واحد فى العالم يعتز ببلدة ووطنة وبا لنسبة للأخوة الذين يهاجمون الأخوة العرب بلأش هجوم لأن مش كلهم وحشين يوجد بينهم كثير جدا جدا ناس فى غاية الأحترام لمصر وشعب مصر وعارفين قيمة مصر العظيمة انا سافرت الى السعودية الشقشقة وشفت بنفسى ناس بتحب مصر بلأش نتكلم ونقول عنصرية اى عنصرية نتكلم عنها كلنا عرب كلنا مسلمون نعرف الله سبحانة وتعالى اما بالنسبة لتواجد الأخوة العرب فى مصر هذا شيى عادى جدا جدا منة سياحة منة استسمار فى البلد وفتح بيوت ناس كثيرة فلماذا هذا الهجوم لأبد ان نفكر بعقل شوية وبلأش التفكير الخطأبلأش العنصرية فى التفكير كما يوجد عندهم ناس وحشين يوجد عندنا ايضا / وهذا قانون السياحة لأبد من احترام القانون يااخوة بلأش الهجوم على الناس بهذا الشكل والله الهادى الى السبيل /والله الموفق"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 130
subject = "كلنا عرب"
author = "عبير"
posted = "2006-10-17"
text = "السلام عليكم ورحمه الله وبركاته.والله ماينفع ان احنا نقول كدا على اخوانا العرب كدا وكمان زى ما العرب بيعملوا فى اجانب كمان بيزورا مصر انت ليه مقلتش عليهم كدا ولا احنا دايما نحب ان احنا نتكلم كلام مش صح على اخوانا العربى المسلمين حتى اذا كانوا مش كويسين مع ان الناس كلها مش واحد يعنى الناس بتختلف عن بعض وزى ما فى عرب مش كويسين فى مصريين زى كدا.وفى الاخر كلنا عرب وعلى فكره كلامك ده هو اللى مرجعنا الى الخلف دايما احنا المفروض نكون احرص الناس على بعض.ناقش الموضوعات اللى انت تحبها دى حريتك بس ياريت تخلى فى اعتبارك ان مش كل الناس واحد.وربنا يهدينا كلنا وينصرنا على اعداء العرب والمسلمين"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 131
subject = "مصر بلد العجائب"
author = "سعودي يعشق مصر حتى النخاع"
posted = "2006-10-18"
text = "نزلت انا وأسرتي هذا الصيف لمصر لمدة 10 ايام صرفت فيهم 6500 ريال بدون تذاكر راحوا ل:<br />صاحب الشقه<br />التاكسي<br />البواب<br />المطعم<br />الملاهي<br />السينما<br />محلات الجلديات<br />محلات البازار<br />المراكبيه<br />المطاعم النيليه<br />محلات الموبايل<br />المتاحف<br />الاماكن السياحيه(الاثار)<br />شفت ياصاحب التقرير كم اسره استفادت من عائه واحده<br />للمعلوميه اكثر من مليون ونصف سعودي نزلوا مصر هذه السته (صيف فقط)<br />اذا من ناحيه علميه موضوعك مش مفيد ولايقدم شئ نافع لمصر<br />ماهو شعوركم اذا قدمت لكم تقرير بالوثائق ان اكثر من 65% من نشالي الحرم الشريف مصريين<br />وأسألكم بالله في هذا الشهر الكريم ايهم أفضل للبلد الأخر السائح ام النشال<br />كل سنه ومصر بألف خير وربي مايحرمنا منها"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

