[[comments]]
order = 192
subject = "؟؟؟؟؟"
author = "محمد"
posted = "2006-11-07"
text = "اي ده يا عرب واحد عاملي نفسو نبي من عند الله والتاني فرعوني ياابن العرب ياحبيبي محنا عرفين العرب من سلالة اسماعيل بن ابراهيم بس انت للاسف ماختش دمهم اخت دم ابن عمك اللي كمان هوا من نسل اسماعيل ابى لهب ويا احمد والمصريين انتو فاكرين نفسكم احفاد الفراعنة ؟؟؟؟ الفراعنة دول ملوك مصر وانقرضو واحنا مصريين صح بس مالناش دعوه بلفراعنة واصل كلمت جرب احنا اللي اخترعناها على حلنه من فقر وجهل واكتر الدول العربية امية في بلدنا كل دول العربية وصلت لانحطاط حتا قصور ملوكنا في مصر وبيوتهم اخدناه من معمار عثماني وانجليزي وحنا مش ناقصين تخلف وشتم بعضنا"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 193
subject = "اشهد يا زمن فهذه حقيقه ابن العرب اللى عامل نفسه محمد"
author = "احمد"
posted = "2006-11-07"
text = "انته غبى جدا يا ابن العرب اقولك ليه لانك دخلت باسم محمد وبترد على نفسك ونفس طريقه كلامك متشابه اقولك ليه عشان تعرف ان المصريين اذكيا جدا بل ان الطفل المصرى يعتبر اذكى طفل فى العالم حسسب تقرير من بلاد الغرب اقولك ليه يا ابن العرب يا اللى عامل نفسك باسم محمد اقولك بس بعد مش عند داخل لانى فعلا قرفت من الموضوع ده اقولك // السبب يا محمد او يا ابن العرب بسيط جدا ومش محتاج ذكاء بس انتى غبى وكشفت نفسك وفعلا كلام صحيح عنكم السبب // اولا تكلمك عن النسب بنفس طريقه ابن العرب والسبب الاخر والاكيد الذى جعلنى اكشفك بان ابن العرب ومحمد شخص واحد اتدر ما هو اضحك // كلمه حتى انت كتبتها بالالف كده يعنى حتا وابن العرب يكتبها مثلك انكشفت ياريس وربنا يهديك وتبطل عبط روح يابنى اكشف على طبيب نفسانى اصل انته فعلا شكلك مريض وربنا يشفيك وندعوا الله ان يشفيك من حمقك الذى ليس له مثيل امين يارب"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 194
subject = "الي القطري التافه ابن الاعراب"
author = "سيدك المصري"
posted = "2006-11-07"
text = "بقي انت طلعت من مشيخة ال تاني المسماة بقطر اللي ما كان لها في التاريخ ولا الحياة لااصل ولا فصل وجي تناطح مصر بشموخها وعراقتها مش مكسوف من نفسك وبلدك ده قطر دي ماتجيش عددها زي سكان شارع في مصر وال تاني ايه وامير ايه انت صدقت ياله ان عندكمامير ده شيخ قبيلة حقير ماعندوش اصل طرد ابوه ونفاه وقعد مكانه ده انتوا ماعرفتوش المدارس غير قريب من 30 سنة علي ايد المصريين اسيادك اللي المفروض تبوس ايدهم يا جربان يا عريان ياللي ماعرفتوش الفلوس غير بعد ماظهر الزفت عندكم روح الله يخيبك اكتر مانت خايب واهبل"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

