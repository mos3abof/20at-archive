[[comments]]
order = 2
subject = "سعودي وافتخر"
author = "عمر فاضل"
posted = "2006-12-26"
text = "الى هذا السعودي ..!!!!!!!!!!!!!!!!!<br />عندما سئل الكاتب الروسي الشهير تورغنيف : لماذا تناولت طبقة النبلاء فقط في روايتك الاباء والبنون ، اجاب: لانني اردت ان اقول ان هذا هو حال الزبد فكيف يمكن ان يكون حال اللبن..<br />اسوق هذا المثال لانتقل الى مايلي .. في مؤتمر قطر وعندما القى ملك السعودية كلمته وردت فيها بعض الآيات القرآنية ، لكن الملك ابن الملوك لم يتمكن من ان يحسن قراءة جملة واحدة من تلك الآيات بشكل مضبوط<br />هل مصر معفنة ايها الجلف الجاهل سليل الجهلة ؟؟؟ هل المصريون لايحسنون قراءة القرآن ؟؟ هل ابناء مصر هم الذين يأكلون الضب واليربوع ياجلف الصحراء؟<br />هل تمتلكون انتم السعوديين كاتبا واحدا؟؟ لان مصر التي تعيرها يااجرب بالتعفن تمتلك مئات الكتاب !!<br />هل عندكم فنان تشكيلي واحد يامن تأكل الصراصير؟؟<br />لان مصر عندها مئات الفنانين التشكيليين!!ّ<br />هل عندكم شخص واحد تجرأ على كتابة تفسير لقرآن ؟<br />لان المصريين ابلوا في ذلك!!<br />هل عندكم مغني واحد يعرف الغناء؟<br />لان كل المغنين السعوديين لايصبحون مطربين الا بالدفع والرشوة!!<br />مالذي تجيدونه ياجهلة لتتطاولوا على بقية العرب ؟؟<br />انا اقول لك !!<br />تجيدون ان تحبسوا نساءكم في البيوت شرفا وعفة وانتم لاتدرون انهن بمجرد الذهاب للمستشفى وبمجرد رؤيتهن لسوري او مصري او لبناني او اي عربي فسوف يعرضن انفسهن عليه!!<br />لالا لم يرو احد لي ذلك انا رايته بنفسي<br />عندكم 8000,000عانس .. اظن ان مصر المتعفنة تجيد التعامل مع ابناتها وابنائها<br />انتم جهلة سفلة ساقطون ... هل انا اكذب<br />اذن اجبني كم هي نسبة الشاذين جنسيا من الرجال عندكم؟؟ وعندما تذهبون الى انكلترا وفرنساالى اية اوكار تلجئون؟<br />هل نسيت انكم السعوديين لكم سماسرة تشترون بواسطتهم الغلمان من البوسنة لان غلمان البوسنة هم الاجمل ع<br />اقرأ بقية التعليق .."
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130005814/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 3
subject = "اتقوا الله في أنفسكم"
author = "فهد"
posted = "2007-01-13"
text = "إنها رسالة للجميع..<br />أسأل الله أن تجد لها قلباً واعياً يؤمن بالله ربا وبمحمد صلى الله عليه وسلم نبيا وبالإسلام دينا..<br />جميع من سب أو قبح فلا يلومن إلا لنفسه..<br />يقول صلى الله عليه وسلم ( المسلم من سلم المسلمون من لسانه ويده )<br />فيا أيها المسلم..<br />أنج بنفسك وابتعد عن المهاترات..<br />ولاتسب إخواناً لك في الله سواء كانوا من مصر أو السعودية أو الشام...<br />اللهم إني بلغت اللهم فاشهد"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130005814/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 4
subject = "مصر مستعمره وليست محتله"
author = "طاهر"
posted = "2007-01-14"
text = "اقول للسعودي<br />هل يوجد في بلدك رقاصه مثل فيفي عبده او دينا؟<br />هل يوجد شارع مثل شارع الاهرام كله مراقص<br />وخمر ومحرمات ؟؟<br />هل يوجد مهاجرين للغرب ، بحث عن الحياه؟<br />هل يوجد بطاله لدرجة ان حامل الدكتوره لا يحصل على وظييفه؟؟<br />هل يوجد عندكم مثل شحاذين مصر؟؟<br />فعلا الشعب مصري حقووود والمشاكل اللي يعشيها بسبب الحقد والكراهيه ...<br />ولو كان النيه صادقه ولكن الله يرزق من يشاء<br />هل يوجد"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130005814/http://masr.20at.com:80/article.php?sid=840"
