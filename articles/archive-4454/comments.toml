[[comments]]
order = 227
subject = "المال والجهل"
author = "كيميائي فريد"
posted = "2006-11-18"
text = "احنا فى مصر عندتا مشكلة اقتصاديه نتيجه لوجود الحرميه ويمكن ده اللي ماخرنا عن بقية العالم لكن انا نفسى اعرف دوله زي السعوديه 8% من الاقتصاد الامريكى ودوله زى قطر بتدي معونات لامريكا ودبي اللي بتدير نصف موانئ العالم ايه اللى ماخرهم ليه مفيش بحث علمي وناس بتهتم بالعلوم والتقدم ؟ انما همه شطرين يركبو سيارات ابراج يمكن اصلا مش موجوده في امريكا مثلا وانما مصممه مخصوص فىها للخليج .انا نفسي اشوف العرب منظومه متكامله اللي عنده اقتصاد يدعم اللي عنده عقول وعلم قبل مالشويت البترول يخلصو ونرجع تاني نركب الجمل ونعيش في الخيمه."
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 228
subject = "يا كيميائي فريد"
author = "؟؟؟؟؟؟؟؟؟؟"
posted = "2006-11-19"
text = "العقول عندنا في الخليج تجاريا البترول ليسة له دخل احنا رفعنى البلد وعائد البترول للدولة مش للمواطن مااعرف شلون تفكيركم تظنون انا للمواطن نسبة من البترول ؟؟؟؟؟ او انا الدولة توزع علينا لكل واحد كم مليون ؟؟؟؟ انتو جهلة من يوم الفراعنة فقد كان التعليم أيام الفراعنة مقتصر على الملوك والنبلاء اما الشعب كانو اميين لعدم قدرتهم على الدفع وحتا في يومنا هذا اكثر نسبة الاميين في مصر الملوك انقرضو ومابقى غير حوش وهم الان عالة على العرب من ناحية توظيفكم ورفع اقتصاد بلدكم"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
order = 229
subject = "أيها البدائيون الهمج الخليجيين"
author = "مصري صميم"
posted = "2006-11-19"
text = "من يا ابو جهل صاحب التعليق السابق العالة علي العرب وعلي البشرية كلها أنتم لا تستطيعون ادارة أي شيء في بلدانكم من تعليم الي صحة ال هندسة الي زراعة الي صناعة الي اي حرفة بسيطة مثل السباكة والحلاقة و النجارة يعني تعيشون مثل الاطفال الذين يعتمدون علي الكبار وأولهم المصريين العظماء اللي خلوكم نص بني ادمين او انتم مثل السفيه المجنون الذي لايحسن عمل اي شيء فيجب الحجر عليه والله المفروض مصر تحتلكم يا عرب يا أنجاس يا اللي طول عمركم حافيين ولا زلتم الي الان شوف كعب رجلك يا بدوي انت وهو فيه شقوق تدخل حشرات وتعابين ولس للان بتاكلوا بأيديكم القذرة وتناموا علي الارض وانا رحت دول الخليج وخاصة السعودية وشفت قمة التخلف والجهل ولما تقعوا في مشكلة او حرب تعال يا مصر أنقذينا زي ايام صدام ياريته كان احتلكم جايز كنتوا نضفتوا شوية انا بقرف منكم لما بشوفكو في مصر يلعن ابوكم همج ما بتفكروا غير في الكبسة والجنس ولو شفت حد فيكم في مصر هاضربه بالجزمة"
archived = "2006-11-22"
capture_url = "https://web.archive.org/web/20061122010447/http://masr.20at.com:80/article.php?sid=840"

[[comments]]
