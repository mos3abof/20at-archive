[[comments]]
order = 83
subject = "سبحان الله"
author = "نوره الشمري"
posted = "2006-09-23"
text = "سبحان الله في مقالتك يا أخي الفاضل وسبحان الله في تعليقات الأخوة الأعزاء .<br />غلطت أخي الكريم في بلدك كونك عربي ابن عربي قبل ان تغلط في بلد خليجي عربي ومسلم,إذا كنت ممن لازالوا يطلقون لفكرهم الضعيف وقلبهم المريض كلام مثل هذا ووصف يسيء للخليجين فهذا انما يدل على حقددفين وعقل صغير عليك اخي العزيز وممن هم على شاكلتك ان يروا العالم بمنظور آخر فانتم في قمع مقفل لا يدخله النور والهواء لذا ستظلون هكذا ضعفاء لا تصلحون الا للسب والقذف.<br />بالنسبة لدار الاوبرا الذي تتحدث عنه اريد ان اسألك سؤالا هل دخلت انت نفسك دار الاوبرا ؟؟ لا اريد معرفة الاجابة احتفظ بها لنفسك.<br />من قال الخليجين اموال بلا عقول؟؟ اذا سمح لنا بالتحدث في هذه النقظة فمن باب اولى ان اخبرك عن المصريين المنتشرين هنا في خليجنا العربي يمرحون ويسرحون وهم اخوة لنا ومنهم لا اريد ان اخبرك انهم يفتقرون لابسط اسس الانسانية فهم مشهورين بالتخلف العقلي والانساني اناس بلا رحمة ولا شفقة وهذا حافل في مسيرة الجريمة في مصر منذ فجر التاريخ , حتى مع ابناء بلدهم في بلاد الغربة ,اللهم لا شماته طبعا.<br />من قال الخليجي يسافر لمصر حتى يفعل ماتقول عليه انت واعوانك؟؟ الخليجي لولا حبة لمصر ماكان كلف على نفسه مشقة السفر كان الاجدر به السفر لبد آسيوي مثلا.<br />مصر الحضارة لا جدال في ذلك ولكن انتم من يريد هدم تلك الحضارة,كثير من الخليجين وانا اولهم لا يمكني السفر لمصر دون زيارة النيل وشراء الكتب وزيارة المتاحف بكل انواعها.<br />من قال ان اقتصاد مصر ينهض دون مال الخليجي, الم تسمعوا بمنطقة خيطان في الكويت؟؟<br />تلك المنطقة التي حولت لمستعمرة صعايدة انظروا لشوارعها القذرة كلها مياه وسخة وطين تعالوا الي هناك وانظروا كيف يعيشون الصعايدة دون حسيب ولا رقيب وكانهم في ملكم ول<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

