subject = "مصرى فى دول العرب"
author = "مصرى"
posted = "2006-08-25"
text = "البلاد العربية والعرب عندهم فقر فى الروح الترفيهيه واهتمامتهم بالابراج ناطحات السحاب والتكنولوجيا الحديثة تستمتع لمدة 3 دقايق ادام ناطحات السحاب وتزهق فى الدقيقة الرابعة تقف 5 دقايق امام النهر المصطنع وتزهق فى الدقيقة السادسه وتطلع البحر الطبيعى تغرق فى العرق من الرطوبه كل ده يخليك مش مستمتع بحاجة بحاجة لكن مصر فيها بساطه بتعمل روح جميله وجوها نعمة من نعم الله بس المصرى لازم يبقى مهذب مع اخواته العرب ويرحب بيهم فى بلده لان مصر هى ام الدنيا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

