subject = "هباب"
author = "جربتم تدخلوا على مواقع سعوديه.. فى الغالب .. طيب فيها ايه .... شتيمه و دعاء على كل حد و كل شىء بدايه من اليهود القرده حتى جمهور المشجعين فى الانديه السعوديه المنافسه! وتلاقى يا عمنا شويه ردود جهل و تعصب و كراهيه، فى مين ؟ مش مهم المهم فى عدو ما لازم يطلعوا عنيه شتيمه و تهزيق و طبعا مصر بينوبها من الحب جانب ، وعلى راى عدد كبير من اللى راحوا السعوديه و جم : البلد دى لولا شويه الهباب الاسوداللى بيطلع من الارض ده كانوا ولا ليهم لازمه."
