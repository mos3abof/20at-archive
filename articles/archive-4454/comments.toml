subject = "كلمة صغيرة بس"
author = "د. درويش"
posted = "2006-10-09"
text = "ايه يا جدعان بس .. ليه هالحكي طيب :(<br />انا فلسطيني .. مولود ومقيم بالسعودية .. وكل سنة او اتنين بزور مصر اجازة ,, قرايبي ساكنين هناك ..<br />والحمد لله مبسوط بالرياض .. ومبسوط بالقاهرة ..<br />بس هي كلمة صغيرة<br />المحترم بيجبر الناس انها تحترمه<br />الي بسوي شي صح .. الواحد بشيله ع راسه<br />والي بيغلط .. ساعتها في كلام تاني ..<br />سواء من هالبلد او من هالبلد ..<br />وكل الناس خير وبركة .. الشغلة ما بدها هالقد ..<br />الله يهدينا جميعا<br />وعقبال ما نشوف العرب من غير حدود وتأشيرات وبلد وحدة يا رب<br />قولوا اميين"
