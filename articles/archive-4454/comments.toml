text = "ياكلب يوم تتكلم على اعمامك الخليجيين يبقا وطي راسك ياحقير ..<br />لولا الخليج مكنش في مصر اساسا ياحقير<br />رووووح كل فسيخ بس ياجهل يامتخلف يامصري<br />مصري=زبالة منيلة خخخخخخخخخخخخخخخخ"
archived = "2006-11-22"
