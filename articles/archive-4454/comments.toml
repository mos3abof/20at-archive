subject = "صلي على الرسول الكريم من سيشفع فينا"
author = "عربي مسلم"
posted = "2006-11-22"
text = "ربنا واحد وسولنا واحد وكتابنا واحد<br />لااله الا الله محمد رسول الله من كان منكم يؤمن بالله ورسوله قليقل خيرا او ليصمت اتقو الله ياعرب اذكرو لله لاحول ولا قوه الا بالله قل اخي \" سبحانك لا أله الا أنت اني كنت من الظالمين \"<br />اللهم اغفر لب ولأخواني المسلمين<br />هداكم الله اخواني"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014049/http://masr.20at.com:80/article.php?sid=840"

