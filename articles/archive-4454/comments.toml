[[comments]]
order = 75
subject = "مصر"
author = "احسبوها كويس"
posted = "2006-09-14"
text = "يعني بصراحة الموضوع يدل على الفراغ الفكري لكاتبه و هو لا يعرف اصلا بان السياحة العربية و ايراداتها لمصر تمثل جزء مهم لدخل مصر. للولا السياح العرب والخليجيين لما كان هناك زيادة في بناء الفنادق في القاهرة و غيرها من المدن بالاضافة الى ان السياحة تحتاج الى قوى عاملة و بالتالي فهي بتوفر لكم في مصر فرص عمل من حمال الحقائب الى مدير عام الفندق, كما ان الاخوة المصريون العاملون في الخليج يتقاضون رواتب خيالية بالمقارنة مع رواتب الموظف المصري في مصر و هؤلاء يعولون اسرهم من خلال المليارات التي يتم تحويلها شهريا. وبعدين اذا كان العرب احتلوا مصر ، فالمصريون محتلين العرب بافكارهم القومية و الناصرية و الاشتراكية و الاخوانية و كفاياكم كلام عن مساعدات مصر ايام جمال عبدالناصر لانكم انتوا اللي بتخدوا مساعدات دلوقتي من امريكا و دول الخليج. كنت اتمنى من كاتب المقال يكتب حاجة مفيدة لبلده بدلا من وقته اللي ضيعه على هذه المقالة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062216/http://masr.20at.com:80/article.php?sid=840"

