text = "ايه يعنى مرحبا بيهم فى اى وقت وعموما دول مهما يكن اهلان وزى ما قلت دول نت جلدنا يعنى منقدرش نستغنى عنهم وبعدين مش كفايا ان الحكام فرقونا عن بعض كفايا كده وعمام احسن ما روحو بلاد غربيه ويدفعو دم قليهم اهوه بيفدونا برضوه"
