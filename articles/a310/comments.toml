[[comments]]
order = 5
subject = "الشيخ مشعود الرايق"
text = "بيقولك واحد اسمه الشيخ مسعود .. قعد هو والأخت ( اللي قلبها مكسور يا عيني ) وواضح انها كانت مبهدلة الدنيا مع صاحبنا .. وقعدت يا عيني تعيط والشيخ مسعود يقول لها ولا يهمك .. كل حاجة هتتصلح<br />ايه القرف ده<br />يا شيخ مسعود روح اقعد مع شباب مش لاقيين شغل .. وواضح من كلامك ان سنك كبير يعني فوق الخمسين يبقى انت لازم تحترم سنك وتحترم كونك بتحمل لقب شيخ . وماهياش طالبة بنات يا حبيبي وبعدين يا بتوع عشرينات انتم كمان<br />هي الحكاية توقفت عند الحب واللي فقدت عذريتها .. واللي عملت كل حاجة بس كانت شاطرة وواعية ولم تفقد عذريتها .. واللي ماشية على حل شعرها وهما دول بقى اللي نقعد نصغر المشاكل الحقيقية بتاعت البنات علشان نسمعهم .. يا لهوي<br />حلو كلامكم عن عمرو خالد وسامي يوسف وطارق رمضان ويوسف اسلام<br />وحش كلامكم بطريقة الشيخ مسعود دي اوي .. واضح انها غلطة منكم ومش هتكرروها تاني<br />وأبلتي اللي تعبانة بعد ما خدت متعتها خلوها تتألم شوية من الطريقة اللي هتكت بيها الستر بتاعها<br />وسلمولي على مستر مسعود عشرينات"
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019011318/http://www.20at.com:80/article.php?sid=310"
