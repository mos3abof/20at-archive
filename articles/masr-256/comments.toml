[[comments]]
order = 0
subject = "بمناسبة الجيم و حتى الياء"
author = "عابر القارات"
posted = "2006-05-02"
text = "و بابمناسبة السعيدة دى أحب أنقلكم الارقام الاتية و هى بالطبع مكملة للصورة القاتمة و القائمة و القاعده على رؤوس الغلابة المساكين و على فكرة الصورة معبرة جدا و لو إن السيدة العجوز اللى فى الصورة واضح إنها من الفئة ميسورة الحال فباين إنها عندها \"بمبة\" بوتاجاز وراها و ده دليل قاطع إنها أكيد بتستخدمة فى الطبيخ و ده معاناه إنها من الفئة المحظوظة اللى لسه بتلاقى أكل تاكله :) و أسيبكم مع الارقام و باقى الصورة القاتمة:<br />( إحصائات من مؤسسة الأهرام من مصر )<br />الأحوال المالية<br />ديون : إجمالي 614 مليار جنيه<br />الفقر : 35% من الشعب تحت خط الفقر,أقل من1 دولار في اليوم<br />نقود مهربة : 300 مليار دولار خرجت من البلاد<br />الجنيه المصري : الدولار= 85 قرش سنة1981م و 6 جنيهات سنة 2005 م<br />الأحوال الصحية<br />السرطان : تضاعف 8 مرات ..أعلى نسبة في العالم<br />الذبحة الصدرية :20 % من الحالات شباب تحت الأربعين<br />البلهارسيا : أعلى نسبة في العالم<br />السكر : ‏7‏ ملايين .. ‏10 %‏ تقريبا من عدد السكان<br />إلتهاب كبدي : 13 مليون.. 20 % من الشعب<br />فشل كلوي : أعلى نسبة في العالم<br />شلل الأطفال : موجود في 6 دول في العالم فقط منهم مصر<br />الإكتئاب : ‏20‏ مليون مواطن<br />أمراض نفسية ( أخرى) : ‏6‏ ملايين<br />التدخين : 80% من البالغين مدخنين<br />التلوث : أعلى نسبة في العالم...تلوث للهواء ومياه الشرب<br />والتدهور في التربة والمناطق الساحلية..خسائر 30 مليار جنيه<br />الانفاق الحكومي: 10 دولار للفرد سنوياً<br />الأحوال الاجتماعية<br />القضايا : 20 مليون قضية بالمحاكم ..أقدمها من 38 عام حتى الاّن<br />البطالة : 29% من القادرين على العمل..حوالي 5 مليون شاب<br />الانتحار : 3 اّلاف محاولة سنوياً<br />حوادث الطرق : 6 آلاف قتيل سنويا و 23 الف مصاب<br />الطلاق : 28%<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905012652/http://masr.20at.com:80/article.php?sid=256&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "يا مبارك البطالة"
author = "فريد"
posted = "2006-05-06"
text = "خمسة مليون عاطل بــــــــــس يمكن الضعف هو الحد الادني يعني عشرة تقريبا وده من تقرير الامم المتحدة 2005<br />علي فكرة انا معايا ليسانس حقوق بتقدير جيدجدا وبقالي خمس سنوات ببحث عن فرصة عمل<br />علي فكرة انا اعرف واحد زميلي معاه ماجستير في القانون وبيشتغل بياع فول بكشك<br />ربنا ينتقم منك يا حسني مبارك"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905012652/http://masr.20at.com:80/article.php?sid=256&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "اضحك الصوره تطلع حلوه"
author = "مصرية"
posted = "2006-05-06"
text = "الى الأخ عابر القارات رجاء اكمال الصورة المشلرقه واضافة احصائيات عن ارقام الأمال المهربه خارج مصر وعدداصحاب الملايين وعدداصحاب المليارات وعدداصحاب الملاليم حتى تكتمل الصورة ونتصور كدة معاها واحنا بنضحك ببلاهه المصدق حكامه حتى الوهم والخيال اصبح كدبهم فيه مقرف ونفاق الاعلام يجيب القىء وهو بمنتهى الصفاقه يعمل المكياج ويطلع يقول كلام كتبه له احد منافقيه ويصدق نفسه ويتهيأله ان الناس مصدقاه ربنا ياخدهم كلهم ونرتاح"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905012652/http://masr.20at.com:80/article.php?sid=256&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "الى أختى مصرية"
author = "عابر القارات"
posted = "2006-05-06"
text = "و الله يا مصرية يا أختى للاسف دى الارقام المتوفرة عندى لغاية دلوقتى و لو أنى ممكن أنصحك لو عاوزة تشوفى الصورة (LIVE) ممكن تخطفى رجلك بس لغاية مساكن الدويقة أو منشية البكرى فى بولاق أو عزبة بكر فى المنيا أو قرية نعناعة الدريس فى سوهاج و أنتى تشوفى اللى عمرك ما شوفتية فى حياته و مختصر الصورة هتلاقى مثلث الهلاك \"الفقر و الجهل و المرض\" قاعد و متجوز و مخلف كمان"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905012652/http://masr.20at.com:80/article.php?sid=256&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

