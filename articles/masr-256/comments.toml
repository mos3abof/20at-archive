[[comments]]
order = 5
subject = "حرام"
author = "محمد"
posted = "2006-08-08"
text = "منهم لله اللى بيحصل فىالبلد ابسط قوق الانسان الطعام والتعليموالصحة والزواج والحياة الكريمة غير متوافرة فى مصر والله انا كنت بتمنى مبقياشى مصرى ربنا ينتقم منهم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905012652/http://masr.20at.com:80/article.php?sid=256&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "مصر البؤس والشقاء"
author = "الباحثة نور حامد"
posted = "2006-09-27"
text = "ان معدلات البطالة والفقر في مصر اخذة بالتزايد ليس السبب الحقيقي هو زيادة معدلات السكان وانما سياسات صندوق النقد والنك الدولي الذي يدفح بمصر شيئافشيئا الى حافة الهاوية اذ جعلت السوق مفتوحة لكل من هب ودب للعبث باقتصاد البلد وكل ذالك على حساب افرد المجتمع الذي يعاني من سوء السياسات التي لاتوجه لخدمة البنى التحتية ومحاولة القضاء على الفقر والبطالة المستشرية في جميع انحاء مصر مشكلة حلها بيد الحكومة"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111122241/http://masr.20at.com:80/article.php?sid=256"

