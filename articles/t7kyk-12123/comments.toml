author = "بلد وسخه"
posted = "2009-05-19"
text = "بلد وسغة<br />ما بقاش فيها غير جنس وبس<br />كله ما لوش هدف ولا شغل الا ممارسة الجنس<br />الله يخرب بيوتكم<br />ـــــــــــــــ ـــــــــــــــ ـــ<br />مش ححبك"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522025535/http://www.20at.com:80/t7kyk/12123-2009-05-19-13-02-32.html"

[[comments]]
order = 1
subject = ""
author = "اترضاه لامك"
posted = "2009-05-19"
text = "اترضاه لامك يا ابن تييييت<br />وبعدين ربنا قال وقرن في بيوتكن<br />المفروض الست تترزع في البيت وما تخرجش منه ابدا واذا خرجت تخرج بمحرم<br />والمفروض كده المرأة تذهب لتكشف عند طبيبة<br />الدولة تجرم معالجة الاطباء للنساء<br />المرأة تروح لدكتورة تتعالج عندها<br />المرأة تشتغل طبيبة ومعلمه فقط<br />المرأة تخدم بني جنسها فقط<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />نش شريف الدواخلي ولا البراء اشرف ولا مروى صلاح ولا رضوى حسن ولا عبدالله الطحاوي ولا احمد الهواري بتاع تيت راديو"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522025535/http://www.20at.com:80/t7kyk/12123-2009-05-19-13-02-32.html"

