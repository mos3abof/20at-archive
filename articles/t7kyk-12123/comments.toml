author = "يا شماتة الاقباط"
posted = "2009-05-19"
text = "الى الاخوة الاقباط الاسلام وضع عقوبة صارمه لمثل هؤلاء الناس يرجى الاطلاع عليها<br />المفروض هذا الكلب يعدم في ميدان عام"
archived = "2009-05-22"
