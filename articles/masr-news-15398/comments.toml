author = "ابو السعود - موشا ا"
posted = "2010-02-20"
text = "النظام الحاكم الجاثم على صدر مصر 30 سنة فى ورطة حقيقية<br />طبعا يقابلها حاليا باسلوب الجلد التخين<br />ابو جلد تخين ولا كأنة هنا<br />طبعا البرادعى وهذة هى المصيبة انة مش اخوان ولا لة ميول متشددة حتى يخيف اوروبا وامريكا ان الاسلاميون قادمون وان الارهابيون اقارب حماس سيحكمون وانة يجب اعتقالة وحبسة وتقديمة لمحكمة عسكرية كما فعل مع الدكتور مهندس الشاطر<br />حقيقى النظام فى ورطة<br />يعمل اية<br />اظن انة سيبعت الحناكيش بتوعة الى بيت البرادعى للتفاوض فى السر ويحاول شرائة او ارهابة او اخافتة او تهديدة بالقتل<br />واظن انهم فى ورطة حقيقية<br />وامريكا تراقب<br />واسرائيل تراقب<br />والسعودية والخليج يراقبون ويتمنون فوز البرادعى لانة يريحهم من سماجة صاحب الجلد التخين الذى يقرفهم برحلات التسول<br />الايام قادمة<br />ولكن المياة فى النهر ليست ساكنة"
archived = "2010-02-22"
capture_url = "https://web.archive.org/web/20100222020739/http://www.20at.com:80/masr/news/15398-4-.html"

