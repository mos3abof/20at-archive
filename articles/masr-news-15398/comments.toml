author = "الامل وصل"
posted = "2010-02-20"
text = "انقذنا يا برادعى من الحرامية<br />سرقوا البلد وخربوها<br />امبارح يا برادعى وزيرة اسمها فايزة ابو النجا وزيرة ما يسمى التعاون الدولى<br />الويزة صرحت ان خدمات الديون التى جلبها الديكتاتور حسنى وتم تسديدها هذا العام بلغت 3 مليار دولار<br />يعنى يا برادعى قناة السويس ضاعت<br />لان دخل قناة السويس 3 مليار دولار - ومخصص ايرادها لتسديد اقساط ديون حسنى وفوائدها<br />تضيع مصر قطعة قطعة يا برادعى<br />الناس مش لاقية انبوبة بوتاجاز<br />وقريبا مش هتلاقى رغيف العيش<br />لانة كلة رايح لتسديد فوائد ديون جلبها حسنى ولم يبنى مشروع واحد<br />انقذ ما يمكن انقاذة يا برادعى - مصر تغرق"
archived = "2010-02-22"
capture_url = "https://web.archive.org/web/20100222020739/http://www.20at.com:80/masr/news/15398-4-.html"
