author = "خمسة الاف مصرى"
posted = "2010-02-20"
text = "خمسة الاف مصرى من جميع محافظات مصر استقبلوا البرادعى رغم الحصار الامنى الرهيب<br />وكان يحاصرهم 3 الاف جندى مركزى وقيادات امنية برتب اكثر من رتب جيش اسرائيل<br />وصل البرادعى<br />ودبت الروح فى شباب مصر<br />ولكن لم يظهر اى اثر للاخوان فى المطار<br />لان الاخوان حلفاء النظام الفاشل<br />الاخوان بتوع الفتة لم يظهروا يوم عودة البرادعى<br />لم يظهر غير محمد عبد القدوس وبصفة شخصية"
archived = "2010-02-22"
capture_url = "https://web.archive.org/web/20100222020739/http://www.20at.com:80/masr/news/15398-4-.html"

