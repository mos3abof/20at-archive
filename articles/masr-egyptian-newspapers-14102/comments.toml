author = "مسلم عربي"
posted = "2009-11-19"
text = "السلام عليكم، لانريد المونديال إذا كان يفرق بين الشعبين ولا نريد هذه الكرة الملعونة التي فرقتنا بدل أن تجمعنا، لكن كل اللوم على زارعي الفتنة أمثال عمرو الغير أذيب والغندور هم من جعلوا مقابلة الأخوة تنعرج بهذا الشكل، وصدقوني إخوتي أن الجزائريين الذين أصبحوا يتابعون المنتخب بلغت 100/100 بسبب إعلامكم، فكيف يقبل أي أحد أن يسب الشهداء أو كما جاء على لسان عمر غير الأديب الذي دعا بالنكد على الجزائريين، وسمير زاهر الذي دعا بمواجهة الجزائريين بكل الطرق، الله يهدينا جميعا"
archived = "2009-11-22"
capture_url = "https://web.archive.org/web/20091122223122/http://www.20at.com:80/masr/egyptian-newspapers/14102-2009-11-19-10-10-55.html"

