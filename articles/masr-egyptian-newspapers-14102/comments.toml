text = "بارك لله فيك على هذا المقال، و لله نفس الشاعر و الأحاسيس و الاحبطات عشها الشعب الجزائري بسبب الضغط من الإعلام السيء، و الله قلبي و روحي معاكم و كما قلت الحمد لله في لسراء والضراء"
