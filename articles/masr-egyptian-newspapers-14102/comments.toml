posted = "2009-11-21"
text = "سلام الله عليكم . نشكركم جزيل الشكر عتى المقال و دمتم سدا منيعا لاصحاب الفتنة كما تطرقتم لهم . وتحيا مصر وشعبها ان هيا الاا مقابلة في كرة القدم لاغير .ولكن استغلال الفرصة من الجهات ( الكل يعرفها ) و تحريك العملاء … وراء كل هدا . وفقكم الله في سعيكم و السلام عليكم"
