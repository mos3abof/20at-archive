posted = "2009-11-24"
text = "اولا مصر فوق راس العرب بسبب انجازتة السياسية والحربية والرياضية بطل افريقيا مرتين ودى حقية للكل ومينكرهاش غير البرابرة الحقودين على مصر مصر ام الدنيا مصر ام الازهر الشريف والاسلام مصر ام العلم بوابة العرب للتعليم فى الطب والهندسة مصر جوائز نوبل للسادات ونجيب محفوظ والبرادعى وزيل مصر ام الدنيا التاريخ هو الى يحكى وبلاش الحقد يلعن الكورة تكون سبب فى كل هذا بس الموضوع بالنسبة للبرابرة مش كورة دة اكثر من كورة العملية كان فيها ترتيب من الجهات السياسية وربنا يكترلهم من جريدة الشروق بتعتهم دى سيقى البلدة وراها يمن يمن شمال شمال ههههههههههههههه ههه ربنا يصلح حال الجزائر ويشفيهم من مرض الحقد (محمود من الاسكندرية"
