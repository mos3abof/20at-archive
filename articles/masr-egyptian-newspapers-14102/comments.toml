text = "ماشالله من أجمل ما قراءة<br />مصر لا تهزمها مبارة<br />و تاريخ موغل في المجد<br />لا ينحي لزمره من المهرجين<br />جيل يجب أن يكرم<br />ومصر رأس العرب<br />برفعتها يرتفع العرب"
