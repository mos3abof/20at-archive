subject = ""
author = "خبير بوزارة العدل"
posted = "2009-07-21"
text = "أدعو الله أن تقف في موقف الكسير الحقير المظلوم ويلحق بك الجور والظلم ولا تجد مجيرا ولا نصيرا لكي تعرف كيف سيكون دور الخبير كيف يكون دوره في رد الحقوق لأصحابها ولا تقلق فإن الخبراء لا يعاملون أمثالك بأقوالهم ولكنهمك يراعون الله في تقاريرهم وكيف تحكم علي عمل أخرين دون أن تعلم طبيعته صدقني كل بئر بما فيه ينضح فلعلك أحد الموظفين الكسلانين الذين أكسبوا العاملين بالحكومة المسعة السيئة لذلك لاتعرف شيئا حسنا"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727212509/http://www.20at.com:80/masr/2khbar/12714-2009-07-21-05-22-17.html"

[[comments]]
order = 1
subject = ""
author = "خبراء اية ؟"
posted = "2009-07-21"
text = "واللة دول لا خبراء ولا يحزنون<br />دول شوية موظفين ميعرفوش اى حاجة فى اى حاجة وعمالة زائدة وليس لهم اى لزمة<br />يعنى مثلا خبير زراعى فى العدل بيعمل اية<br />وزارة الزراعة ترفع قضية على فلاح انة زرع ارضة ارز مخالفا للقانون<br />الفلاح يروح المحكمة ويقول للقاضى ارز اية يا سعادة البية دى انا زارع بدنجان<br />القاضى يبعت الخبير الزراعى بشوفة زارع بدنجان والا زارع ارز<br />واى واحد ممكن يميز البدنجان من الارز حتى القاضى نفسة يعرف<br />يبقى خبير فى اية انا مش عارف<br />والا يمكن بدل ما يكون خبير يطلع خابور"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727212509/http://www.20at.com:80/masr/2khbar/12714-2009-07-21-05-22-17.html"

