[[comments]]
order = 3
subject = ""
author = "كل دول خبراء"
posted = "2009-07-22"
text = "ياة دى حاجة هايلة كل دول خبراء<br />ما تيجى نصدرهم لليمن والصومال يبقوا خبراء هناك ويعملوا نهضة كبيرة قوى<br />الخبير يبقى خبير فى الطاقة النووية زى العالم ابو الكلام فى الهند انما شوية موظفين ارزقية بيقعدوا السنة بحالها لا شغلة ولا مشغلة لغاية ما تتحول عليهم اوراق قضية يعطلوها سنين على ما يكتبوا تقريرهم ويؤخروا القضاء لسنوات طويلة<br />الناس دى هم سبب بلاوى القضاء المصرى وبياخروا الحكم سنين ويجب طردهم من الخدمة والاستعانة بمكاتب استشارية محترمة فى القضايا لابداء الراى<br />انهوا خدمات هؤلاء الناس لانهم هم والمحامون سبب نكسة القضاء المصرى وسبب ل بلاوية<br />يا وزير العدل اطرد الناس دى من الخدمة واستعين بالمكاتب الاستشارية واساتذة الجامعات فى القضايا"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727212509/http://www.20at.com:80/masr/2khbar/12714-2009-07-21-05-22-17.html"
