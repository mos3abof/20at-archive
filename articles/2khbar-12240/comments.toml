author = "انسكب الماء يا ولدى"
posted = "2009-06-01"
text = "لا فائدة اطلاقا من اى معارضة او كفاح<br />لقدوصل الياس بالناس من اى مستقبل ان يكرروا كلمة الياس الخالدة على مر التاريخ<br />غطينى يا صفية وصوتى الشعب المصرى مفيش فية اى فايدة<br />اليست تلك كلمات الزعيم سعد باشا زغلول فى نهاية رحلة كفاحة ومعارضتة للانجليز والملك<br />غطينى يا صفية وصوتى الشعب المصرى مفيش فية اى فايدة<br />لقد انسكب الماء يا ولدى"
