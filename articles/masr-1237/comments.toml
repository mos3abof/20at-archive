[[comments]]
order = 4
subject = "ما أكثر الكلاب"
author = "فلاح مصري"
posted = "2006-12-02"
text = "ما أكثر الكلاب اليوم في مصر تجد الشعب المسكين ماشي جنب الحيط بل ماشي في الحيط وخايف لكلب من كلاب الحكومة ينهشه .<br />ما أكثر الكلاب اليوم كانت بالأمس وفية لكن كلاب الحكومة مفترسه لأنها لسه ما شبعتش عاوزة كام 25 سنه عشان تشبع<br />وجاي جيمي مبارك<br />عاوز يخلص عليها طبعا ماهو كلب كبير متربي على عضم المصريين الغلابة مش كفاية الراس الكبيرة والله حرام إللي بيحصل في البلد دوت لكن كتر الكلام ما منوش فايده لازم نتحرك .. ونصرخ ونقول لا وألف لا طبعا هيكون فيه ضحايا لاكن ما فيش حلاوه من غير نار ... وكتر الكلام ما منوش فايدة لأن الريس بتعنا ما بتأثر جتته منحسه مهما تتكلمو مش ها يسمعكو هو واخد عهد على نفسه ما يتكلمو أو يشتموا أيه يعني ( ديمقراطيه ) لكن عيشه كويسه لا فلوس لا أي حاجه فيها منفعه لا وألف لا<br />هي ديت سياسة مبارك ولن تتغير مهما حدث<br />عذرا أطلت عليكم<br />بقلم فلاح مصري"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073432/http://masr.20at.com:80/article.php?sid=1237"

