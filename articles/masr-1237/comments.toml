[[comments]]
order = 2
subject = "أنا متضامن مع السيد ألدو"
author = "إبن بهيه"
posted = "2006-12-01"
text = "شالوا ألدو حطوا شاهين .. ألدو قال ما احناش لاعبين ... وطالما فيها الريس الواطي يبقى كلنا سنتضامن ونتبنى موقف لاسيد ألدو وحنزعق معاه ونقول ..ماحناش لاعبين .. ماحناش لاعبين .. ماحناش لاعبين .. لجنه ؟ طيب مالو يا خويا لجنه لجنه .. رئيس محكمة النقض ؟ ما يضرش ... مستشارين من مجلس الدوله ؟ ماعليهش ... لكن تكون زي وزاره وتابعه لفخفخامة جلالة مبارك الواطي ؟؟؟؟؟؟؟؟؟؟؟؟؟؟ أهو ده اللي خربها وخلاها طين ... أنا رأيي نخليها زي ما هي .. والأفضل نعطيها بشكل كامل لحبيبهم العادلي وكل البوبيهات اللي معاه من صبيانه .. خليهم يظقططوا ويتمنجهوا يا شيخ .. عنه ما حد نجح غيرهم .. وإيه يعني ؟؟؟ برضه لا جديد ... الجديد الوحيد هو فتح باب رزق حرام لناس تانيه .. وكله من جيب بهية الغلبانه المخروم أصلا ومفلس بعد ما لهفوا كل قرش دخله ... ربك يعدلها واللي عنده حومه يبدلها ....<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073432/http://masr.20at.com:80/article.php?sid=1237"

