subject = "نشرة اخبار سنة 2015"
author = "اصدر الرئيس جمال مبارك تعليمات الي رئيس الوزراء احمد نظيف لاستكمال مسيرة التحرر الاقتصادي والخصخصةوالمصمصة للدولة ان يتم بحث بيع المتحف المصري للبيع للمستثمرين الاجانب وبحث اجراء مناقصة عالمية لبيع اهرامات الجيزة ومدينة الاقصر بالناس الي فيها لمستثمر رئيسي , كما بحث محمود محي الدين وزير الاستثمار اجراءات الشركة الانجليزية المالكة لقناة السويس شراء نهر النيل وكل متعلقاته من ترع ومصارف, كما بحث وزير الاستثمار ايضا اجراءات الشركة الاسرائيلية المالكةلمائتين الف فدان في سيناء لشراء مائة الف فدان اخري جديدة في سيناء لاستصلاحها وتوفير مزيد من فرص العمل للمصريين لدي الشركة الاسرائيلية."
