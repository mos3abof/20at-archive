[[comments]]
order = 6
subject = "احنا خبنا من زمان"
author = "كامل داود"
posted = "2006-12-06"
text = "بقولك واحد قابل واحد صاحبة يوم الإنتخابات فسألة<br />- انتخبت،،،،،، رد علية<br />- أنا خبت من زمان<br />ولذلك أنا أقترح على الحكومة بدل ماتزور الإنتخابات أنها توفر الفلوس اللى بتصرفها على الدعاية وعلى اللجان وعلى مكافآت القضاه والصحفيين وتجيب للشعب بالفلوس دى فول ولحمة ( واطعم الفم تستحى الحمير ) مع الإعتذار للشعب اللى اناواحد منة وللحمير اللى الحكومة بتعاملنا على اننا منهم."
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210013946/http://masr.20at.com:80/article.php?sid=1237"

