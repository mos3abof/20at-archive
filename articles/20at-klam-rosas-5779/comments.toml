text = "طيب كده مش يبقي من المنطقي …<br />إن الاستفتاءات كلها تكون بالطريقة دي ؟؟؟<br />والموضوع اتكرر قبل كده أكثر من مرة … وكان برضه في تلاعب في النتيجة …<br />لعل أشهرهم … هل توافق علي حزب للإخوان …<br />اللي اتحولت فيه النتيجة .. وبرضه كانت بفعل فاعل …<br />الأحسن في حالة زي دي … هي منع التصويت إلا بعد مده … أو منعه من نفس الآي بي …<br />ودي سهلة جاد جدا جدا … غي إنها بتدي نتيجة حقيقية للاستفتاء<br />وآسفين علي الخروج عن الموضوع …<br />ومعاكم مقااااااطع أو تي في …<br />بس برضه مش حاسكت<br />لا للتمديد … لا للتوريث … نعم لتعديل الدستور المصري\" بس مش كده أوي يعني .. \"34\" مرة واحدة؟؟\"<br />دلوقتي تقدروا تروحوا هناك … وتشرفونا خلاص …<br />www.mesh7askot.blogspot.com<br />mohamedmat@hotm ail.com"
