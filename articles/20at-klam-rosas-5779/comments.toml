text = "ما بلااااااااااااا ااااااااااااااا ااش ما نظرية المؤامرة دي هيا اللي ودت العرب في داهية و خلتنا نقول حتي علي الطماطم اللي مفيهاش بذر إنها سلاح موجه لشباب المسلمين!!!!!!! !!!!!!!!!<br />نيجي بقي و نقول إن موقع عشرينات المفضل عندي مستهدف !!!!!!!!!!!!!<br />يعني هوة ساويرس مش حيخاف من الرأي العام و حيخاف من عشرينات ؟؟؟<br />و يعني ساويرس مزنقة معاه اوي و أجر 3 عيال بس علشان يغيروا نتيجة التصويت؟<br />يلالا حنعديها المرة دي يا عشرينات علشان انتو موقعي المفضل"
