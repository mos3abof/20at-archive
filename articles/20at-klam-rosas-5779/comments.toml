subject = ""
author = "اكتب اسمك هنا"
posted = "2007-12-29"
text = "يا سلام !<br />قبل كل شىء، هل القناة أصلاً مخصصة لعرض الأفلام فـقـط ؟.. لمن يعارض سياسة القناة فى عرض أفلامها فليمتنع عن مشاهدة هذه الأفلام، لكن لماذا يقلع عن مشاهدة القناة بأكملها لمجرد شىء واحد يختلف معه ؟<br />تسجيل موقف ؟.. أعتقد أنها الإجابة الوحيدة لكنها غير مقنعة إلى هذا الحد.. أولاً لأن عدد من يفكر بهذه الطريقة أشبه بعدد حبات السكر التى تسقط من ثقب صغير فى كيس ضخم ما !.. و ما سبق ليس السبب لكن لماذا لا تنخفض معدلات المشاهدة فى أوقات عرض هذه الأفلام فقط ؟.. فضلاً عن أنها ستكون نسبة صغيرة بالرغم منا لأن هناك شريحة أكبر-نعرفها جيدًا-ربما لن تشاهد سوى هذه الأفلام !.. ثانيًا لأن القناة تبث أشياءًا أخرى جميلة بحق، فى البرامج مثلاً هناك الكثير: (حبة عسيلى)، (يبقى أنت أكيد فى مصر)، (صباحك/مساءك سكر زيادة)، و هناك أيضًا الفقرة التى تنفرد بها و هى (عيون الـ OTV) و التى هى عبارة عن تسجيل موقف الشارع المصرى فى عدة قضايا متنوعة حيث يسجلون فى الشوارع و يحاورون جمهور العامة فى عدة قضايا…<br />رأيى الشخصى إن هذه القناة أثبتت تميزها منذ البداية.. و إن كنا نريد تسجيل موقفًا بالفعل فهناك ما هو أكثر إستحقاقًا بكثير…<br />مساء الفل."
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122534/http://www.20at.com:80/20at/klam-rosas/5779.html"

