posted = "2007-05-08"
text = "السلام عليكم انا مكنتش متوقعة ان دي حتكون النسبة انها تكون لصالح otv ،تاريخ التصويت هو تاريخ مليء بتزييف النتائج لغاية النهاردة عمري ما سمعت عن تصويتات نظيفة نتائج دون تدخل اي جهة من الجهات حتى في المواضيع العادية البعيدة عن السياسة يعني تعالو نفتكر برنامج استار أكاديمي بمواسمه الأربعة حتلاقوا ان كل نتائجه مزيفة وملعوب في التصويت الخاص بالمشتركين انا احيانا كنت بصوت لمجرد أعرف ايه النظام أحيانا الخدمة تتوقف لمشترك في حين أنها مستمرة لمشترك أخر ، وتزييف الاصوات في ستار أكاديمي 3 لصالح هشام ولا نعلم لماذا ،ولذلك لا أشك لثانية في صحة كلام موقع عشرينات ان هناك جهة تولت موضوع التصويت ،أما عن الأخ اللي كتب دون ما يكتب اسمو ،من متابعتي المستمرة لعشرينات بشوف انهم مش محتاجين يعملوا كدة ،،على العموم دي شجاعة من عشرينات ومن الاستاذ محمود انهم يعرضوا النتائج الحقيقية للتصويت ودي نقطة تحتسب ليكم يا عشرينات ،ولو موقع غيركم كان عرض النتيجة ولعب فيها لمصلحتو عشان يدعم موقفوا ،،،فجملتي التي اعتدت عليها عند انبهاري بشيء لافت هو انني أرفع قبعتي اعجابا بصراحتكم ومصداقيتكم…goooooo a head"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122534/http://www.20at.com:80/20at/klam-rosas/5779.html"

