author = "السوهاجى بية"
posted = "2008-09-08"
text = "السيد رئيس الدولة اطال اللة عمرة<br />والسيد ابنة امين السياسات ( جمع سياسة ) ولية سياسات ومش سياسة واحدة والا يمكن السياسات بتخبط فى بعضها<br />والسيد رئيس الوزراء<br />والسيد رئيس الحى<br />والسيد زعبلة [ *** ]ر القلة<br />كلهم بلا اثتثناء وفى جميع التصريحات وكل يوم وكل اسبوع وكل شهر وكل سنة ولمدة 27 سنة بيقولوا كلام مكرر هو جملة واحدة هى لا رجعة عن الاصلاح الاقتصادى<br />وبما اننى جاهل اقتصاد - بحثت فى كل المراجع والمعاجم وسألن عن طريق النت الاستاذ عبد الشكور شعلان استاذ الاقتصاد فى البنك الدولى وسألت الست فيفى عبدة والبنت جمالات بياعة الفجل على راس الحارة وسألت المخبر ابو ايد زى المطرقة يعنى اية اصلاح اقتصادى<br />كلهم قالوا<br />قالوا<br />الاصلاح الاقتصادى هو بيع القطاع العام لاصحاب الحظوة والمقربين لينتقل من ملكية الشعب الى الملكية الخاصة<br />طيب موافق<br />نبيع القطاع العام للقطاع الخاص وبربطتين فجل لكل مصنع ودراهم معدودة لكل مصنع وشركة<br />ولكن كل دة ياخد اية يوم او شهر او سنة ماشى<br />انما سبعة وعشرين سنة بنبيع ونقول لا رجعة عن الاصلاح<br />يا عمخ انت وهو فضونا من السيرة الهباب دى وخلصوا بيع<br />حطوا خطة للبيع تنتهى فى 6 شهور<br />خطة بيع شاملة نخلص من الاصلاح فى 6 شهور ونفضى لحاجة تانية<br />اللة يخرب بيت عزيز صدقى عمل مصانع فى 10 سنين مش عارفين نبيعها فى 27 سنة<br />رجاء ضعوا حدا لحكاية الاصلاح الاقتصادى دى<br />بيعوا بقة مرة واحدة وريحونا وارتاحوا"
archived = "2009-05-26"
capture_url = "https://web.archive.org/web/20090526215321/http://www.20at.com:80/t7kyk/10025.html"

