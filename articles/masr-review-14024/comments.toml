[[comments]]
order = 14
subject = ""
author = "محمد مصطفى"
posted = "2009-12-09"
text = "ده كان كلام كتير من مثقفى مصر<br />ولازالوا بيصحوا فى الناس ان اه ابو تريكه حلو ومتعب جميل واحمد حسن والفريق كله والمعلم كمان حاجه زى الفل<br />بس موش بماتش كوره هتعلا رايتك يا مصر<br />الرايه موش العلم<br />مصطفى محمود حد حس بيه لما مات حد يعرف قيمته قريتولو كام كتاب؟<br />جاوب مع التعليل فى مادة التاريخ<br />لو كنت مذكرتش الاهم هيفيدك بايه الوهم<br />فوقوا ياشعب خرفانه كترت"
archived = "2009-12-19"
capture_url = "https://web.archive.org/web/20091219104640/http://www.20at.com:80/masr/review/14024-2009-11-13-23-17-02.html"
