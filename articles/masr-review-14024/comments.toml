[[comments]]
order = 1
subject = ""
author = "االعبو صلح"
posted = "2009-11-13"
text = "اية شوية العيال المخابيل دول<br />دول اطفال الشوارع<br />انتم بتشموا جلة<br />والا بتضربوا بانجو<br />فى ذمة ابوكم دة شعر<br />والا كلام حلمنتيشى<br />اخية على دة كلام منحط"
archived = "2009-11-15"
capture_url = "https://web.archive.org/web/20091115123328/http://www.20at.com:80/masr/review/14024-2009-11-13-23-17-02.html"

[[comments]]
order = 2
subject = ""
author = "casber"
posted = "2009-11-14"
text = "كلام كبير بمعاني اكبر ميحسهوش غير اللي عايشه<br />ولاي ةاحد مفهمهوش متزعلش قوي الكلام مهجه للي بيفهموه<br />(اسمه شعر حر)<br />عن نفسك انت حر<br />تفهم انت حر<br />تكبر برده حر<br />بس خد بالك ياحر<br />عن غير انت مش حر"
archived = "2009-11-15"
capture_url = "https://web.archive.org/web/20091115123328/http://www.20at.com:80/masr/review/14024-2009-11-13-23-17-02.html"

[[comments]]
order = 3
subject = ""
author = "الشعر الحر"
posted = "2009-11-14"
text = "شعر حر اية<br />اللة يرحمك يا ست نازك الملائكة يا بتاعة الشعر الحر<br />على العموم كان فية مجلة زمان بتصدر فى اسكندرية اسمها البعكوكة اى واللة اسمها مجلة البعكوكة<br />وكان فيها واحد بيقول شعر اسمة الشعر الحلمنتيشى<br />ودايما كان بيشتكى من ضرب البراطيش<br />ويظهر ان الشاعر الحلمنتيشى القديم قد بعث من جديد<br />على العموم ربنا يستر لواحد ياخد الكلام دة ويغنية اغنية تهد الدنيا من النهيق"
archived = "2009-11-15"
capture_url = "https://web.archive.org/web/20091115123328/http://www.20at.com:80/masr/review/14024-2009-11-13-23-17-02.html"

