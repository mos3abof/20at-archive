text = "انا مش متفقة معاك يا مجدي<br />دبور في رأيي أكتر جيله موهبه في الكتابة الساخرة والشعر بشهادة اساتذة كبار<br />بس احنا دايما اللي بناخد موقف من أي حد في سننا"
