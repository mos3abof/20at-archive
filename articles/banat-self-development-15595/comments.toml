posted = "2010-03-06"
text = "انا بقالي حوالي 21 يوم متكلمتش معاه<br />مش عارفه<br />ايه دا<br />مع اننا اخر مره كنا متكلمين مع بعض كويس وبنهزر ومكانش في مشاكل خالص<br />انا عارفه انه هو بيحتاج يكون ليه وقت لوحده بس مش لدرجه 21 يوم<br />انا بتصل بيه مش بيرد<br />ودلوقتي اخدت موقف لما يطلع من الي هو فيه يبقا يكلمني بس خايفه قوي دا يبعد ما بينا<br />انا مش عارفه اعمل ايه<br />انا عارفه انه خجول ومشغول قوي وانه بيحبني قوي بس انا تعبت نفسيا عاوزه اتطمن عليه<br />كان قبل كدا بيدخل ع النت ع الاقل يوم الخميس دلوقتي مبقاش بيدخل خالص<br />مش عارفه اوصله باي طريقه لانه كمان مش في مصر<br />ربنا يهديه بقا ويكلمني"
