text = "اقتباس lolo m:<br />انا وخطيبى اصلا مش بنتكلم ولا في الموب او حتي علي النت لان بابا مانع التليفونات اصلا ومش عارفه اعمل ايه<br />معقول باباكي مانع التليفونا وهو عارف انك خاطبة ؟؟<br />يعني حتى ممنوع تكلميه وانتي مخطوبالو؟؟<br />انا مش مع باباكي على فكرة انا اسفة<br />المفروض تقوليلو انك محتاجة تتعرفي عليه اكتر"
