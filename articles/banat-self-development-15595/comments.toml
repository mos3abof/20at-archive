author = "حبيبة خطيبها"
posted = "2010-03-07"
text = "الموضوع كتير حلو<br />انا وخطيبي بنتكلم بكل الوسائل نت او موبايل او بيزورنا في البيت<br />بس في النت علي الميل مش بحب كده لان الصوت بيكون أفضل وكمان مش بحب اعطله عن شغله فا الموبايل احسن حل<br />بس بعد ما كتبنا كتابنا بقينا مش بس بنتكلم نت او موبايل بالعكس<br />دلوقتي ممكن نخرج كمان ونروح اي مكان<br />نصيحتي لكل بنت مخطوبه اعرفي خطيبك كويس ومش عيب ابدا انكوا تتكلموا كتير في بداية الخطوبه لانكوا مفروض بتفهموا بعض اكتر اومال ازاي عايزين تتجوزوا من غير ما تفهموا بعض كويس !!"
archived = "2010-03-07"
