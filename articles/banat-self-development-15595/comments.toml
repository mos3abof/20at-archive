text = "انا وخطبيى بيحصل ده<br />اجعلي مدة المكالمة التليفونية بينكما لا تزيد عن 10 دقائق، فليس من السيئ أن تنتهي المكالمة وهو مازال يريد التحدث معك، المشكلة هي أن يكون اكتفي من التحدث معك ومازالت المكالمة مستمرة.ا<br />ومش بكون عرفه اعمل اييييييييه بضيق اكيد انه مش بيتكلم<br />.وغلبا بنتكلم على النت والموبيل قليل"
