order = 0
subject = "مسلمه"
author = "ربنا يهدى ده بيقول صنايعى لقد صدق الله تعالى :\"والشعراء يتبعهم الغاون*ألم تر أنهم فى كل واد يهيمون* وأنهم يقولون ما لا يفعلون\""
posted = "2006-03-28"
text = "ربنا يهديه ويهدى كل الناس اللى سايبه كل حاجه ومهتمه بالاغانى والشعرا ء وحاجات غريبه<br />ربنا يهدى"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022654/http://masr.20at.com:80/article.php?sid=83&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 1
subject = "شعرااء إيه حضرتك؟!!"
author = "كريم الشناوى"
posted = "2006-03-31"
text = "هوه صحيح كلام البنى أدم ده غريب... بس مش نطلع من ده كله إنه شاعر ... و إن الشعراء بقى ولاد...<br />أولا ده مش شاعر حضرتك.... ثانيا... مش فاهم... مين قالك إن الناس مهتمة بالشعراء؟!!.. على اساس إننا عايشين فى مكتبة ولا إيه... عموما ياريت... و أخيرا بقى... ربنا يهدينلا جميعا..."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022654/http://masr.20at.com:80/article.php?sid=83&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"
