[[comments]]
order = 2
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-01-15"
text = "فين التحامل على فكرة المتابع لالجيد لمواضيع السعودية هيتأكد اننا نتناول المجتمع السعودي بالحلو و الوحش اللى فيه زي ما في صفحة ولاد البلد اللل ى متخصصه فى الشأن المصرى بنعمل كدة و مش فى بالنا ابدا نشوه حد احنا بننقل واقع<br />بشكل عام و على فكرة الموضوع مكنش مقصود ابدا منه و لا عنصرية و لا حاجة الموضوع بيشجع فكرة هؤلاء السيدات بس كل واحد بيحب يقرأ الموضوع كما تسول له نفسه و تحية الى الشعب و الاخوة فى السعودية و السلام عليكم"
archived = "2009-06-15"
capture_url = "https://web.archive.org/web/20090615050340/http://www.20at.com:80/20at/salamo-3lakom/7935.html"

[[comments]]
order = 3
subject = ""
author = "سعودية واللي مو عاجبه ينقهر"
posted = "2008-01-15"
text = "يا عشرينات ليش انتم عنصريين ومتحاملين على السعودية، أوضح أن المطعم للنساء فقط وليس للسعوديات وهنا الفرق، لأن من تدخله لا تبرز هويتها وأنه ممنوع دخول غير السعوديات بحسب ما يوحيه المانشيت، لكنكم ياعشرينات دائما تصورون السعوديين والسعوديات بطريقة غير جيدة تبدي مدى تحاملكم على الشعب السعودي ونساؤه، واذا دل على شئ فإنما يدل على عنصريتكم اننم وهجومكم بسبب وبغير سبب على السعودية وتشويه صورة السعوديين والسعوديات، لكن موتوا بغيظكم فالسعوديين احسن منكم ."
archived = "2009-06-15"
capture_url = "https://web.archive.org/web/20090615050340/http://www.20at.com:80/20at/salamo-3lakom/7935.html"

[[comments]]
