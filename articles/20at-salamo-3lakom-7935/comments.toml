author = "اكتب اسمك هنا"
posted = "2008-11-07"
text = "مشروع وفكره ممتازه<br />فيها تحس المراه انها عامله وموظفه توضف نفسها بنفسها<br />دون ان تلجأ الى الشحاذه<br />والحكومه السعوديه تشجع مثل هذه الفئات في مجالات اعمالهم<br />بل وسهلت عليهم حتى اقتراض مبلغ مالي باقساط مسهله ومريحه تصل الى 500 او 400 ريال في الشهر<br />وذلك لانشاء مشاريعهم تلك"
archived = "2009-06-15"
capture_url = "https://web.archive.org/web/20090615050340/http://www.20at.com:80/20at/salamo-3lakom/7935.html"
