text = "ممناز وبالتوفيق لهم<br />اعتقد ان ام خالد لم تحكي لنا عن الصعوبات التي واجعاتها لاخراج تصريح تجاري لمحل يخص النساء<br />وهو الشيء المتعارف - كثير من التعقيدات للحصول على تصريح وموافقة<br />دعائنا لهم بزايدة الرزق والتوفيق والتميز في عملهم"
