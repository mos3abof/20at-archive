subject = "حقيقة بداخلنا"
author = "ahmed_lovely"
posted = "2006-04-11"
text = "ان الحقيقة التي بداخلنا هي ان الاهلي هو الاول بافريقيا والزمالك الثاني في مصر ومن غير لاعيبة الاهلي ما كنا ابطال افريقيا فيجب علينا ان نعترف بهذا ونبوح به واذا قارنا الاهلي بالزمالك فا مش هينفع لان الزمالك لا ياتي شئ امام الاهلي وشكرا لقراتكم لرسالي وانا بريدي هوalempratore_el_a_n@yahoo.com"
archived = "2006-09-04"
