[[comments]]
order = 0
subject = "متعصب جدا لفريقه و لكن متبصر"
author = "مناضل أنترنتى قديم"
posted = "2006-03-26"
text = "السلام عليكم ورحمة الله و بركاته<br />لا أنكر عليكم ولن أحاول أن اظهر نفسى فى موقف المتغقل فأنا أهلاوى جدا و لكن لست متعصب أعمى .... ولكن<br />و هنا نتوقف كثيرا فأنا أشجع فريق و أتحيز له انا فى هذه الحاله متعصب لأن هذا الفريق هو الفريق الصحيح و كل كل ما عداه فهو باطل أحسبكم عرفتموه<br />أنه فريق الأسلام و لكن ليس معنى كلامى أننى اكره ما هو غير أسلام لا ولكننى اسأل الله عزوجل ان يمن عليهم بهذه النعمه الغاليه"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192332/http://masr.20at.com:80/article.php?sid=73&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "اهلاويه"
author = "الحقيقة انا اهلاويه ومن عيلة اهلاوية جدا"
posted = "2006-03-26"
text = "وكلنا بنحب الكورةجدددددددددددددا<br />لكن الحقيقة انا عن نفسى لما الاهلى بيعمل \"ماتش \"وحش باشتم فى الاهلى ولعيبه الاهلى"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192332/http://masr.20at.com:80/article.php?sid=73&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "SOME BODY LIKE U"
author = "العبرة ليست بقوة أو ضعف الفريق الذى تشجعة و لكن مربط الفرس هو لماذا نشجع هذا الفريق بلاخص دون غيرة ........؟؟"
posted = "2006-03-26"
text = "هل سألت نفسك مرة هذا السؤال<br />لو كنت بتشجع فريقك لآنه صاحب أحسن حارس مرمى و خط هجوم أو حتى هداف الدورى !!!!<br />هل ستشجعه لو سحب البساط من تحت قدمة<br />أو هل كنت ستشجعه من الاساس لو كنت قد فتحت عينك علية و هو فريق مش سوبر<br />دى هوا الفرق بين جماهير الاهلى و الزمالك و بين أى جمهور تانى من فرق الاقاليم<br />لذى نرى هذه المسألة بوضوح فى فرق القناة ( المصرى , الاسماعيلى , القناه )<br />حيث مهما كانت نتيجة او مستوى او درجة الدورى الذى يلعب بة ناديهم دائما ما يكون هناك فى المدرجات جماهيير تهد الارض<br />إنها نوع من الانتماء لمبدأ ما مهما كان موقف هذا المبدأ و تأثير ما حولك بة و ما يمكن أن يحققة من نتائج"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192332/http://masr.20at.com:80/article.php?sid=73&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

