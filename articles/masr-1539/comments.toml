[[comments]]
order = 7
subject = "المبرشمون اوساخ وغجر"
author = "هم يعرفوننى جيدا"
posted = "2007-02-05"
text = "واتعجب كيف يسمحون لمندوبيين من موقع الميرشمون متحدون يتجولون داخل مصر ويرسلون للمشرشح القذر والسافل عدلى ابادير ! والذى يتقول على الازهر اخيرا فى فيديوهاته الساقطه والتى تعبر عن سفالته وقذارته هو ومدحت قلاده المهووس !كيف يسمحون بمراسليهم بحريه فى مصر وموقعهم يلم الساقطين امثال جورج المصرى ومحسن بائع البويه السابق بدبلوم تجاره والذى مسحوا بكرامه اهله فى السجن حتى سافر ودكر البط وفاء الملحده ! وقبل ذلك هاله المصريه التى تدعى انها كاتبه كانت ترسل تقارير كاذبه عاملوها برقه فى امن الدوله وغيرهم من الساقطين والهامشيين فى المجتمع...واخيرا هل تعرفوا بان المتطرف والمهوس والمعروف ارتباطاته بمنظمات صهيونيه وهو مجدى خليل قد حضر الى مصر وغادر وقفاه تقمر عيش ! ان حكومتنا لاتستطيع الاقتراب منهم لانهم ليسوا مصريين ويحملون جنسيه اجنبيه ويتاجرون بكلمه( قبط) فقط لزوم البزنس...وفى النهايه عملوا حديث من الرقاص القمص مرقص قال نحن اصحاب البلد !! هم اصحاب البلد هؤلاء الخونه! اى بلد يتحدثون هؤلاء السفله الساقطين المبرشمين وقد استهزؤا بدماء الشهداء فى 73 وهم احباء للصهاينه سمعناهم فى الكاتدرائيه يهتفون لشارون...."
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206025209/http://masr.20at.com:80/article.php?sid=1539"

[[comments]]
order = 8
subject = "رد على المطلب الثاني لاقباط المهجر موضحا فيه عدد السكان المسيحيين"
author = "المطلب الثانى :"
posted = "2007-02-05"
text = "2. الأقباط يطالبون بالمساواة فى بث البرامج الدينية الخاصة بهم من خلال وسائل الإعلام التى تسيطر عليها الدولة.<br />إن خمسة عشر مليونا من الأقباط يعيشون في مصر ويدفعون الضرائب التى تنفق منها الدولة على الإذاعة والتليفزيون وبالتالى فمن حقهم أن يخصص لهم وقت للبث من خلال هذه الوسائل.<br />الرد على المطلب الثانى :<br />قبل البدء فى الرد علينا أولا أن نكشف زيف مايدعيه النصارى فى مصر من كونهم 15 أو 20 أو 25 أو حتى ثلاثين مليون بحسب ما كتب أحد سفائهم من قبل , وقد تكون تلك أمنية او حلم يحلم به نصارى مصر وهذا حق مشروع لهم لا نجادلهم فيه , ولكن أن يكذبوا ثم يصدقوا أنفسهم فهذا يدعونا على الأقل من باب الشفقة أن نبين لهم تعدادهم الحقيقى فى مصر حتى نزيل الضلالة عمن انخدعوا بهذه الأكاذيب التى ضللهم بها أعباط المهجر لدرجة أن من النصارى من يصدقها.<br />ولن يتطلب منا الأمر عناء أو جهدا للتحقق من العد الحقيقى للمسلمين والنصارى فى مصر وذلك لوجود موسوعات عالمية متخصصة بذلك فتعالوا معا نرى ما هو تعداد النصارى فى مصر من الموسوعات العالمية والتى يملكها نصارى .<br />حول تعداد المصرين مصر تقول موسوعة (Encarta) العالمية:<br />Population 78,887,007 (2006 estimate)<br />وهو ما ترجمته :<br />الكثافة السكانية : 78,887,007 (تقدير 2006 )<br />أى أن تعداد السكان فى مصر لعام 2006 هو حوالى تسعة وسبعون مليون نسمة والتعداد هنا للكل مسلمينالمئوية بحسب الأديان تخبرنا الموسوعة بالتالى ونصارى بالطبع , وحول تقسيمهم بحسب النسبة :<br />Religious affiliations<br />Muslim (mostly Sunni) 94 percent (official estimate )<br />Coptic Christian and other 6 percent (official estimate )<br />وهو ما ترجمته :<br />أتباع الأديان<br />مسلم ( معظمهم من<br />اقرأ بقية التعليق .."
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206025209/http://masr.20at.com:80/article.php?sid=1539"

[[comments]]
order = 9
subject = "الاوغاد متحدون"
author = "1-عدلى ابادير يوسف - رجل اعمال ، رئيس المؤتمر القبطى،رئيس منظمة الاقباط متحدون"
posted = "2007-02-05"
text = "2-مجدى خليل- كاتب ومحلل سياسى، عضو لجنة إدارة مؤتمر واشنطن<br />3-سليم نجيب - رئيس الهيئة القبطية الكندية<br />4-منير بشاي - رئيس جمعية اقباط كاليفورنيا<br />5-عادل جندي -كاتب وناشط قبطى ، باريس<br />6-وليم الميري- صحفى وناشط قبطى<br />7-ميلاد اسكندر رئيس الهيئة القبطية الاميركية<br />8-رائف مرقص -رئيس الاتحاد القبطى الدولى<br />9-الفونس قلادة -الاتحاد القبطي الدولى<br />10-ايهاب زكى- الاتحاد القبطي الدولى<br />11-فؤاد سمعان -الهيئة القبطية الاميركية<br />12-عادل حنا -الهيئة القبطية الاميركية<br />13-سعد اسكندر- الهيئة القبطية الاميركية<br />14-عماد يوسف- ناشط قبطي ، كندا<br />15-حلمى جرجس- رئيس الهيئة القبطية البريطانية<br />16- ابراهيم حبيب- الهيئة القبطية البريطانية<br />17-ناجى عوض- رئيس الهيئة القبطية الاوروبية، باريس<br />18- ملاك غبريال- رئيس الهيئة القبطية بكاليفورنيا<br />19-ماهر رزق الله- رئيس الهيئة القبطية بتورنتو<br />20-نبيه عبد الملك- اوتاوا كوبتس<br />21-شريف منصور- ناشط قبطى ، مشارك فى تنظيم مؤتمر واشنطن<br />22-صموئيل فاهد- رئيس الهيئة القبطية الاسترالية<br />23-جميل حلمى-الهيئة القبطية الاسترالية<br />24-فكرى ماكس- صحيفة المصرى، استراليا<br />25-منير داوود- ناشط قبطى ، نيوجيرسى<br />26- اقلاديوس ابراهيم- صحفى ، لندن<br />27- أرنست أوريجانيوس- رئيس الهيئة القبطية بتكساس<br />28-جورج فرج الله- الهيئة القبطية بكاليفورنيا<br />29-نبيل الشماع-ناشط قبطي<br />30-احمد اباظة- ناشط قبطي<br />31-فايز عبد الملك - محرر صوت النيل<br />32-صبرى جوهرة- استاذ بكلية طب اوهايو، ناشط قبطي"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206025209/http://masr.20at.com:80/article.php?sid=1539"

