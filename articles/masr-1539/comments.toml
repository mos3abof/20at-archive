author = "هم يعرفوننى جيدا"
posted = "2007-02-05"
text = "واتعجب كيف يسمحون لمندوبيين من موقع الميرشمون متحدون يتجولون داخل مصر ويرسلون...... عدلى ابادير ! والذى يتقول على الازهر اخيرا فى فيديوهاته الساقطه والتى تعبر عن سفالته وقذارته هو ومدحت قلاده المهووس !كيف يسمحون بمراسليهم بحريه فى مصر وموقعهم يلم الساقطين امثال جورج المصرى ومحسن بائع البويه السابق بدبلوم تجاره والذى مسحوا بكرامه اهله فى السجن حتى سافر ودكر البط وفاء الملحده ! وقبل ذلك هاله المصريه التى تدعى انها كاتبه كانت ترسل تقارير كاذبه عاملوها برقه فى امن الدوله وغيرهم من الساقطين والهامشيين فى المجتمع...واخيرا هل تعرفوا بان المتطرف والمهوس والمعروف ارتباطاته بمنظمات صهيونيه وهو مجدى خليل قد حضر الى مصر وغادر وقفاه تقمر عيش ! ان حكومتنا لاتستطيع الاقتراب منهم لانهم ليسوا مصريين ويحملون جنسيه اجنبيه ويتاجرون بكلمه( قبط) فقط لزوم البزنس...وفى النهايه عملوا حديث من الرقاص القمص مرقص قال نحن اصحاب البلد !! هم اصحاب البلد هؤلاء الخونه! اى بلد يتحدثون هؤلاء السفله الساقطين المبرشمين وقد استهزؤا بدماء الشهداء فى 73 وهم احباء للصهاينه سمعناهم فى الكاتدرائيه يهتفون لشارون...."
archived = "2007-02-13"
capture_url = "https://web.archive.org/web/20070213142702/http://masr.20at.com:80/article.php?sid=1539"

