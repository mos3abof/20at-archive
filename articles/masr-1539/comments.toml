[[comments]]
order = 16
subject = "حسبنا الله ونعم الوكيل"
author = "Drsalah_hanie"
posted = "2007-02-06"
text = "شكرا للأخت أميرة على مواضيعها الميزة دائما.<br />وأقول أن الكنيسة أصبحت الآن دولة داخل الدولة وأصبح تهديد المسلمين يتم ليلا ونهارا على أيدى النصارى بل أصبح من حقهم المشروع أن ينادوا بأعلى أصواتم إعلانا عن كتبهم كما حدث فى المعرض هذا العام وعندما قام أحد المسلمين الغيورين بالوقوف خارج دار الكتاب المقدس لينبه المسلمين بعدم الدخول أو الشراء وأنهم يستغلون جهلكم بدينكم ليعرضوا دينهم عليكم قامت مباحث أمن الدولة بالقبض على أخينا وحيازة كتيبات مكتوب عليها \"لماذا أنا مسلم\".<br />لم يفعل شىء سوى أنه كان ينبه إخوانه المسلمين ومع ذلك تم القبض عليه.<br />إذن من المضطهد المسلمون الذين يضيق عليهم فى لقمة عيشهم أم النصارى الذين يمتلكون 60% من اقتصاد مصر فى صورة شركات ومصانع و.......<br />من المضطهد المسلمون الذين يعتقلون ليل نهار ويكال بهم فى أقسام البوليس أم النصارى الذين لايستطيع رجال الشرطة اقتياد احد منهم وإلا فأمريكا موجودة تدافع عن النصارى المضطهدين .. !!!<br />وأخيرا لاأقول إلا حسبنا الله ونعم الوكيل فى كل من يظلم المسلمين ويظلم الإسلام ويحاربه ."
archived = "2007-02-13"
capture_url = "https://web.archive.org/web/20070213142702/http://masr.20at.com:80/article.php?sid=1539"

