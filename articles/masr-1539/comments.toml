[[comments]]
order = 19
subject = "هو ده الشغل"
author = "النصرانى الكافر و الخائن"
posted = "2007-02-17"
text = "احب ان احيى ذكاء الاخوان جدا .. فهم بدايه الامر صوروا الاقباط على اعتبارهم حفنه من الخونه يتمسحون بالدين لاجل تحقيق اهدافهم الخاصه ، معرفش فى ناس تانيين برضو بيعملوا كده يا ترى مين ميين ممم .. ياللا ، المهم ، وان المسيحيين عاوزين رئيس مسيحى واكتر من كده عاوزين يقسموا البلد بينهم و بين المسلمين ، وطبعا محدش حاول يسال نفسه عن كيفيه تحقيق هذا عمليا على ارض الواقع ، لايهم فهناك من يؤمن تماما بان الاقباط كلهم ( سواء 5 او 10 او 12 مليون ) عباره عن خونه و عملاء.<br />بعد كده دخلوا فى تأليفه جديده اوى هى ان اقباط مصر ليسوا اصلا مصريين !! ودى اشيعت فى مواقع كثيره منها موقعكم المصون هذا فهم البقيه الباقيه من رومان و يونان وربما يهود كذلك كانوا فى مصر قبل الفتح الاسلامى ، طبعا مش مهم ايه الدليل على كده طالما انه فى ناس بيصدق هذا الكلام انما كان الغرض من الموضوع ده الغاء حجه الاقباط بانهم مصريين لهم الحق فى العيش فى هذا البلد ... طيب انتو بقى منتوش مصريين عشان تتهدوا و تخرسوا مخالفين فى ذلك كل الحقائق التاريخيخ التى لم يختلف عليها اى ناحث او متخصص فى التاريخ سواء كان مسلم او مسيحى.<br />واخيرا وبحمد الله تعالى ( مهو لازم كده عشان الحكايه تبقى محبوكه ) التأليفه الثالثه بان الاقباط واخدين راحتهم على الاخر و ( مبرطعين ) فى البلد و عاملين اللى ما يعمل و كاتمين على نفس الاخوان المسلين ، يا سيدى محدش قال ان فى اضطهاد وان المسيحيين بيتاخدوا من بيوتهم بس متجيش تقول ان المسيحيين فى مصر بيطهدو االمسلمين .. عيب اوى ده تهريج .. ان كان على الاغنيا فده لانهم اغنيا سواء كانوا مسلمين او مسيحيين اما عامه الناس فماشى عليهم اللى ماشى على اخوانهم المسلمين ..<br />كل هذه البدع الجديده بغرض عزل المسيحيين عن المسلمي<br />اقرأ بقية التعليق .."
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221065108/http://masr.20at.com:80/article.php?sid=1539"
