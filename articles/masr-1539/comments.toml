[[comments]]
order = 12
subject = "اضطهاد المسلمين فى ظل عهد مبارك"
author = "اقول للاخوان ليس من حقكم طلب المساواة مع المسحيين فى ظل رئيس يطلق عليه اهل زوجته الانجليزية \" جورج \" وابنائه جيمى والن ، اذن الامر واضح ولايحتاج لذكاء لفهم انحياز سيادة الرئيس لديانة اهل زوجته ، وعلى الاخوان الصبر وعدم الصدام مع نظام قوى ومسنود من امريكا المسيحية ، عليهم تعليم الاسلام ودعوة الناس اليه بالحسنى ، فالاسلام مهدد بحراب لا هوادة لها وانظروا لما حدث لدكتور محمد عمارة ، فالرجل كل جريمته انه نقل نص للامام الغزالى يقول فيه ان من كذب النبى محمدص صلى الله عليه وسلم فهو كافر مثل المسحيين ، فهل هم مومنون بأن النبى محمد اوحى اليه من الله ام هم يكبون ذلك ؟"
posted = "2007-02-05"
text = "فاضطهاد الان فى هذا العهد هو من نصيب المسلمين"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206025209/http://masr.20at.com:80/article.php?sid=1539"

