text = "انتوا زعلانين ليه ياجماعة ؟؟؟<br />انتوا ممكن تتوقعوا اى حاجة فى دولة رئيس وزرائها بيعلن انها دولة علمانية<br />ورئيسها المحترم ... طالع يتكلم بصفته رئيس حزب .. مش رئيس دولة<br />حسبنا الله ونعم الوكيل"
