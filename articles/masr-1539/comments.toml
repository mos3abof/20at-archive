[[comments]]
order = 4
subject = "المساواه ف الذل عدل"
author = "ايمن امام"
posted = "2007-02-04"
text = "السلام عليكم/ مساواه الاقباط بالمسلمين عد ل ويطابق الدستور ومرجيحه المواطنه التى تهتز كلما دفعها احد ما- وهذه المرجيحه ليس لها سوى اتجاه واحد - وعشان ابقى مثقف- ها اسميه ون واى - المهم-- اذا كان الاقباط يدعون انهم مضطهدون واذا كانت الدوله تدعى وورائها جيش كتابها - ان تيار الاخوان يريد ان يحول الدوله الى دوله دينيه - فالمقارنه السريعه تبين ما اذا كانت الدوله صادقه فيما تزعمه والاقباط صادقون فيما يروجون له من فكره المرجيحه - حاولت ان اعقد مقارنه لاشياء كثيره - بين الفريقين لنرى من هو الظالم ومن هو المضطهد---<br />1- تعيين شيخ الازهر- وانتخاب البابا<br />2- جواز عزل شيخ الازهر بقرار يصدر من اصغر موظف فى رئاسه الجمهوريه- واستحاله حدوث ذلك بالنسبه للبابا<br />3- خضوع ميزانيه الازهر لرقابه الجهاز المركزى للمحاسبات- واستقلاليه ميزانيه الكنيسه<br />4- اعتبار شيخ الازهر موظف عام يسرى عليه مايسرى على غفير الدرج وعدم خضوع البابا لهذا القانون<br />5- اعتبار اموال الازهر اموال عامه - وعدم اعتبار اموال الكنيسه اموال عامه<br />6- جواز المحاكمه الجنائيه لشيوخ الازهر - والاكتفاء بالمحاكمه الكنسيه لرجال الكنيسه<br />7-عدم جواز تلقى الازهر اى تبرع من ايه جهه دوليه الابعد موافقه رئلسه الجمهوريه - والحريه المطلقه للكنيسه فى ذلك<br />8- امتناع الكنيسه عن تنفيذ اى احكام قضائيه بمقوله عدم سريان هذه الاحكام عليها - وتعرض اى موظف عام كشيخ الازهر للحبس اذا امتنع عن تنفيذ حكم<br />9- اخضاع مطبوعات الازهر لرقابه الاجهزه الامنيه - والحريه المطلقه للكنيسه فى ذلك<br />10- اخضاع المناهج التى تدرس فى الازهر لرقابه الدوله ولوزاره التعليم العالى والمجلس الاعلى للجامعات و-- عدم اخضاع مايدرس فى مدارس الاحاد لرقابه الدوله<br />11-بقاء الكنائس على مدى ساع<br />اقرأ بقية التعليق .."
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206025209/http://masr.20at.com:80/article.php?sid=1539"

