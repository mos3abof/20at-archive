posted = "2007-02-05"
text = "هنا فى مصر مندوبين لهم وهم الذى يدعى انه مستشار جبرائيل واخر يدعى انه محامى عالمى نخله وهم مندوبين لغجر المهجر وينفذون اجندتهم الصهيونيه...بالاضافه الى بعض من يدعوا انهم كتاب وهم : خالد منتصر ورفعت السعيد وصلاح عيسى وشويه اوساخ على شاكلتهم من يدعون انهم ليبراليين واعضاء فى حزب مصر الام وشويه حسالات من المجتمع المصرى"
