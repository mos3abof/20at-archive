subject = "ده بعدكم يا إخوان!!!!!"
author = "ياسر أبو عمار"
posted = "2007-02-04"
text = "ده بعدك يا دكتور حمدى ،ليه ان شاء الله ؟<br />عاوزين تناموا فى بيوتكم من غير ما تبقوا متوقعين ان امن الدولة يخبطوا عليكم -او يكسروا الباب فى اى وقت؟<br />ولا عاوزين تسافروا من غير ما تقعدوا فى المطار 5 ساعات؟<br />ولا يمكن عاوزين كمان تتعينوا فى الشرطة والنيابة ولا يمكن كمان عاوزين يقبلوكم ضباط فى الجيش ؟يالهوى معقولة ؟<br />ولا يمكن كمان بقى عاوزين انكم لما تقدموا على جمعية اهلية يتوافق لكم ؟او انكم تعملوا اجتماعات علنية ،يا اخى والله الاخوان دول امرهم غريب ..يعنى عاوزين الحكومة تعاملكم زى الاقباط ؟ليه ان شاء الله ؟بامارة ايه يعنى ؟"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206025209/http://masr.20at.com:80/article.php?sid=1539"

