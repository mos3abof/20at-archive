text = "انا بقترح على الاخوان يلمو نفسهم وعيالهم ونسوانهم وفلوسهم ويسيبو البلد ويهجو بره مصر ويسيبوها للنظام وللاقباط ...<br />الكنيسة المفروض تخضع للكشف من الجهاز المركزي للمحاسبات زي الازهر ويتم الكشف عن غسيل الاموال \"الحقيقي\" إلي بيتم بإسم الكنيسة من مجموعة رجال الاعمال إلي اهم من يقوم بغسيل الاموال للكنيسة رجال اعمال طلعو مرة واحدة ومحدش عارف مصدر أموالهم الحقيقية إيه زي سامي سعد وساوبرس وغبور..."
