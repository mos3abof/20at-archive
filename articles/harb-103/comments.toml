subject = "عزيزي الوطن العربي...... من فضلك اقبل...... استقالتي"
author = "TeGo"
text = "عزيزي الوطن العربي...... من فضلك اقبل...... استقالتي<br />بعد التحية والسلام..... اطلب من الوطن العربي قبول... استقالتي كمواطن عربي.... وانا في كامل قواي العقلية وبدون ضغط او تاثير من طرف خارجي..... فلم تعد قوميتي العربية لها اي قيمة.... بل اصبحت حمل ثقيل ممزوج بالعار في داخل الوطن العربي اوخارجة .....وقد شاهدت عيني الطائرات والسفن من كل دول العالم تحمل رعاياها او بالاخص كل من يحمل جواز سفر اجنبي من لبنان تاركة كل ما هو عربي تحت قصف الصهاينة...... عندها تأكدت ان الوطن العربي لم ولن يوفر الحماية والكرامة ابدا ......وايضا رايت القادة العرب في حالة اشفاق وتوسل ويطلبوا الرحمة من العدوان .....وتاكدت مرة اخري ان قراري قرار سليم لا ندم علية ....وايضا الخلافات الدائمة بيننا كشعوب عربية ونزاع دائم وعنصرية وشعارات زائفة عن قومية عربية ليست لها وجود ولن يكون..... لذلك قررت ان ارحم نفسي من الاوهام والانتظار لشئ لن يحدث الا بمعجزة وان اكون اكثر واقعية قبل ان يفوت الاوان ....واستقيل واسعي الي منصب جديد هو ان اكون.. بريتش مسلم .....انا لست نادم بالمرة عن استقالتي ....وحرق جواز السفر العربي الذي ليس لة اي قيمة حتي انة لا يصلح للعبور من حدود الي حدود بلد اخري.... واذا اظهرتة بدأت كل المشاكل من الشكوك اني ارهابي لمجرد انة جواز سفر عربي ...سوف اتنازل عن كل حقوقي كمواطن عربي انا لا اعرف ماهي وعمري ما اخذتها... لكني سوف اتنازل عنها ...وفي الاخير انا لست نادم بالمرة علي قراري فقد اخذتة بعد دراسة طويلة في تاريخ الامة العربية...... وشكرا وارجو قبول استقالتي.... بالذوق او بالعافية .....لانني لن اغير من قراري ابدا"
