text = "هيكل شرح خريطة الطريق لمصر<br />فمن ينفذ ؟"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122048/http://www.20at.com:80/masr/t7atuf/13775-2009-10-21-07-07-50.html"

[[comments]]
order = 1
subject = ""
author = "جيمـي"
posted = "2009-10-21"
text = "لأ … فيه فايدة<br />طول ما فيه إصرار"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122048/http://www.20at.com:80/masr/t7atuf/13775-2009-10-21-07-07-50.html"

[[comments]]
order = 2
subject = ""
author = "اقرؤو الفاتحة لسعد"
posted = "2009-10-21"
text = "اقراووا الفاتحة لروح سعد باشا زغلول<br />الراجل قال<br />مفيش فايدة"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122048/http://www.20at.com:80/masr/t7atuf/13775-2009-10-21-07-07-50.html"

[[comments]]
order = 3
subject = ""
author = "عقلاء الامة"
posted = "2009-10-21"
text = "فعلا لازم عقلاء الامة يقولوا لنا نعمل اية<br />هيكل قال راية<br />ولكن كيف التنفيذ<br />وهو الحل الوحيد المتاح للانقاذ<br />فهل يستجيب النظام<br />ام يستمر فى العناد وتكون نهايتة الموت ضربا بالقباقيب زى شجرة الدر"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122048/http://www.20at.com:80/masr/t7atuf/13775-2009-10-21-07-07-50.html"

[[comments]]
order = 4
subject = ""
author = "ستنهال الشتائم"
posted = "2009-10-21"
text = "استاذ هيكل انت قلت الحل للخروج من كارثة النظام الذى خرب البلد<br />ولكن انتظر<br />سوف يخرج المطبلين وارزقية الاخبار والجمهورية وروز اليوسف للشتيمة ولعن سنسفيل اللى خلفوك بكرة او بعدة<br />هيطلعوك عجوز بتخرف وعايش فى القرن الماضى<br />ومحدش هيسمع الكلام دة والبلد هتولع اكيد<br />الا اذا ولادها اتحركوا<br />انما توريث وتهجيص فمش هيتم اطلاقا لان البلد على فوهة بركان والبطالة والفقر فى كل مكان"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122048/http://www.20at.com:80/masr/t7atuf/13775-2009-10-21-07-07-50.html"

[[comments]]
order = 5
subject = ""
author = "الحق"
posted = "2009-10-22"
text = "قلت الحق ولا شىء غير الحق<br />ربنا يطول فى عمرك"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110022718/http://www.20at.com:80/masr/interviews/13775-2009-10-21-07-07-50.html"

[[comments]]
order = 6
subject = ""
author = "القربة مخرومة"
posted = "2009-10-23"
text = "اية يا عم هيكل<br />انت بتنفخ فى قربة فيها الف خرم وخرم<br />مفيش فايدة<br />ولا فية اى امل<br />بعد ما تخرب وتولع هيبقى فية حل<br />خللى الامور ماشية وهى هتولع لوحدها<br />اسكت انت خالص<br />الحل هييجى من عند عزرائيل"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110022718/http://www.20at.com:80/masr/interviews/13775-2009-10-21-07-07-50.html"

[[comments]]
order = 7
subject = ""
author = "هدي مراد"
posted = "2009-10-23"
text = "اول مرة اري املا في الحل لمصيبتنا وسيناريو لانسان او جماعة مخلصة لله وللوطن يمكن ان تنفذه لتنتزع هذا البلد العظيم من الحضيض اطال الله عمرك يا استاذ لتكون مستشارا للفترة الانتقالية وادعو الله الا يفلت المجرمون من عقاب رادع"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110022718/http://www.20at.com:80/masr/interviews/13775-2009-10-21-07-07-50.html"

[[comments]]
order = 8
subject = ""
author = "احلام وردية"
posted = "2009-10-24"
text = "كلام الاستاذ هيكل عبارة عن احلام وردية<br />فالرئيس عندما وصل الى الكرسى لم يعين نائب ابدا لة وكان يعد ابنة لذلك<br />ثم حكم البلد شلة المستوردين والوكلاء التجاريين واصحاب الاحتكار وهؤلاء كونوا اخطبوطا شل الاقتصاد وقتل التنمية وضيع البلد<br />انت تطالب بالمستحيل<br />وسوف يشتموك وينتهى الامر"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110022718/http://www.20at.com:80/masr/interviews/13775-2009-10-21-07-07-50.html"

[[comments]]
order = 9
subject = ""
author = "فات الاوان"
posted = "2009-10-26"
text = "فات الاوان يا عم هيكل<br />خلاص احنا فى عهد الابن<br />كل شىء راح وانتهى وما ينفعش اقتراحات مضى زمانها<br />ولكن لعل الحل يكون عند عزرائيل ويكون قريبا<br />عزرائيل هو الحل<br />ياخدهم جميعا"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110022718/http://www.20at.com:80/masr/interviews/13775-2009-10-21-07-07-50.html"

[[comments]]
order = 10
subject = ""
author = "التحلل"
posted = "2009-10-28"
text = "انا اشوف ان الدولة بتتحلل<br />زى الجثة ما بتعفن وتتحلل بعد فترة من الموت<br />البلد شكلها كدة انها بتطالع فى الروح"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110022718/http://www.20at.com:80/masr/interviews/13775-2009-10-21-07-07-50.html"

[[comments]]
order = 11
subject = ""
author = "عزبة الحاج"
posted = "2009-10-28"
text = "فية مدونة اسمها عزبة الحاج ابوجمال ابقى اقراها يا عم هيكل واظن صاحبها مصرى فى امريكا"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110022718/http://www.20at.com:80/masr/interviews/13775-2009-10-21-07-07-50.html"
