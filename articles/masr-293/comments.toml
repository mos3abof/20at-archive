order = 0
subject = "بيهييس!"
author = "هريدي الجن"
posted = "2006-05-09"
text = "الراجل ده بيهيس ياجماعة!<br />مطار سرى إيه وبتاع إيه!!<br />يعني كنت عايزهم يوافقو علي قانون الطوارئ عشان تيجي سعادتك تشتم فيهم عشان هم مع الطوارئ!!<br />صحيح ياأخي.. ملقوش في الورد عيب, قالو أحمر الخدين!"
