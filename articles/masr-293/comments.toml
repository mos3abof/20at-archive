[[comments]]
order = 1
subject = "الحل العبقرى"
author = "إيهاب"
posted = "2006-05-09"
text = "وهل البديل الذى تقدمه هو الحل أيها العبقرى ؟ إنك تقول .. \"فيعلن الموافقة علي «تمديد قانون الطوارئ» بشرط أن تقتصر مدة العمل به عاماً واحداً، وليس عامين.. لأن الحكومة إذا كانت جادة في عزمها المضي قدماً علي طريق الإصلاح السياسي.. يجب أن تسرع الخطي، لتتجاوز حالة القلق والتوتر اللذين صنعهما «قانون الطوارئ!! وفي ضوء هذه القنبلة.. كان علي الأغلبية الدخول في مناقشة لم يستعد لها قادتها الأشاوس.. لنري نحن أبناء «الشعب المصري الشقيق» أحداث مباراة حرمتنا منها سذاجة الفريقين!!\"<br />يعنى كل اللى حضرتك عاوزه إنك تشوف مباراة وخلاص ...<br />وإيه نتيجة المباراة ؟ حضرتك فاكر إن الموضوع حيفرق ؟ ولا انت مصدق إن نواب الحزب الوطنى فعلاً ممكن يتناقشوا وإن القرار بإيديهم هما مش بييجى من فوق ؟<br />يارب ارحمنا من صحفيين آخر زمن ..."
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517233214/http://masr.20at.com:80/article.php?sid=293"

