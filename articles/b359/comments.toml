[[comments]]
order = 1
subject = "قول نكتات خلي الناس تنبسط!وبعدين!"
author = "لا يوجد شيئ اسمة خلي الناس تفرح.يا عمي قول نكت عشان الناس تنبسط وتنسي الهم اللي هما فيه.هذا هو الغباء بعينة .والواضح في سلسة الافلام المصرية الحالية التي لا هم لها الا في اخراج نكته وضحك للناس.اوكي منذ سنين والناس يضحكون.ثم ماذا!هل حققنا شيئ! هل انتجنا!ام انن نجلس علس قرعان الطريق نحتسي الشاي ونطلق النكات وغيرنا ليس عنده وقت من كثرة انشغاله لأنه كائن منتج."
posted = "2006-01-31"
text = "الاحري ان نسأل انفسنا.هل هناك انسان عامل مشغول عنده هدف عندة وقت لنقل وتواتر النكات كما في قعدات الانس والفرفشة!<br />اذكر ان عادل امام اتي الينا في فلسطين سنة 1998 وقال بالفم المليان.بلاش نكد علي الناس خلي الشعب يفرح.خليه ينبسط .ودي كانت رساله واضحة انه خليه ينسي مستقبلة وماضيه وما يفكرش في الاحتلال .كما هو الحال في مصر الان.انبسط وانسي انك من الرعاع.وانك اداه في ايد مسؤولينك.<br />موضوع النكت بالظبط زي حرب الافيون .بريطانيا تغرق الشوارع الصينية بالافيون عشان الناس تنبسط وتنسي.<br />اما في مجال حركة المقاومة الاسلامية حماس.والنكات التي تطلق عليها .هي دليل واضح علي غيرة البعض بل وحقدهم علي الاسلام.وليس علي الحركة.لأن النكت التي قرأناها في الاعلي هي نكات ضد الاسلام.مثل الحجاب الشرعي.مثل الجمال.مثل الصلاه.ومن الحرام ان ننقل مثل هذه النكت وحتي ولو علي سبيل المزح.هناك قطاع عريض من الفلسطينيين العلمانيين.او بالاحري اللادينيين ومن مصلحتهم ان يطلقو النكات للتنكيل بالمسلمين في عقيدتهم من اجل ان نسمعهها وننفر من السلوك الاسلامي.مثل الزي الشرعي.او مثل الصلاه.<br />في النهاية.حماس مسلمة رغم انوف العلمانيين.وبما انهم خائفين .سيستمرون في اطلاق النكات .وهم غير قادرين علي اصلاق شي غير النكات.فليقبرو في قبورهم.<br />والسلام عليكم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114817/http://www.20at.com/article2.php?sid=359"

