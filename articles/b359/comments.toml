subject = "الموقع باظ و الله"
author = "أكرم بس"
posted = "2006-01-31"
text = "فين نشرة 9<br />فين كلاكيت<br />فين الموضوعات الحلوة و المهمة<br />الموقع بقى محتكر من شباب الاخوان ( اللي ثقافتهم ضحلة جدا ) باستثناء الثقافة الدينية و المقالات المنقولة من مصادر تانية<br />اما عن اللي بيدخلوا الموقع فالله يرحمهم<br />انا كل يوم بدخل عل جوجل و بعمل بحث عن موفع عشرينات اللي كنت بحبه بس لحد دلوقتي مش لاقيه<br />انا لله و انا اليه راجعون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114817/http://www.20at.com/article2.php?sid=359"

[[comments]]
order = 4
subject = "اقدر مشاعركم"
author = "حين نتحدث عن الاقلام التي تكتب ام لا فلا بد ان نعرف قلمك يأ أخي المتحدث فوق، لكن بالنسبة للموضوعات وتناولها من قبل الاسلاميين واو مواضيع اسلامية مثلما تقول، فان هذالا دخل للكاتب فيه. فقط الموضوع نفسه الذي فرض نفسه على الكاتب وغيره من الكتاب ايضا."
posted = "2006-02-01"
text = "واريد ان ازيدك من الشعر بيت وهو ان الاسلاميين بقوا هم حديث المجتمعات المتحضرة، لانهم اصلا فرضوا نفسهم من منطلق اسلامهم العظيم.<br />وعلى كل حال يا اخي الكريم انا بحترم رايك واشكرك عليه.<br />لكن الموقع بالفعل أصبح قوي جدا بنشره للموضوعات. وبالعكس شكله اصبح جدا.<br />ولو كل مرة هيغيروا شكل الموقع عشان يرضوك فده بكون لانك مكتئب مش أكثر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114817/http://www.20at.com/article2.php?sid=359"

