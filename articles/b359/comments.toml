subject = "أنا مكتئب"
author = "مكتئب جدا ( أكرم سابقا )"
posted = "2006-02-01"
text = "شكرا انا مش قصيرة قزعة انا طويل و مكتئب<br />اولا يا اخي احنا اسلاميين برضوا ( مسلمين يعني ) بس لا يصح الا الصحيح<br />و اذا كان احنا بننقد الموقع اللي بنحبوا ده من حبنا في رقيه و تحضره مش انهياره<br />و الدليل على ذلك قالوله<br />قالولوه ايه بقا<br />اكتب كلمة فغعهخ في البحث في الموقع و شوف نتيجة البحث<br />شوف الارقام اللي في الاستفتاء اللي على الموقع و انت تعرف موقعنا الجميل حصلوا ايه"
