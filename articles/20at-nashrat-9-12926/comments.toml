text = "واحد متل هاد اكيد هو ورى كل جريمه بصورها طاقمه لانه مو معئول يكون بيعرف كل شي لحتى يصوره هاد اكيد محتال عالمي<br />ومستحيل يكون هو نفسه القدر يلي بيزرعو بمكان الجريمه<br />بس هو فعلا برنامج رائع ما كنت بعرف انه هيك حقيقته<br />هو فعلا cheet<br />باااي<br />تحياتي احلى بنوته<br />ايمو بالاردن<br />ولا تقولوا عنا شيئا كازبا<br />فنحن ثقافة تمتاز بالحساسية والتمرد الحسي وليست ال emo ديانه بل هو ثقافتنا يا من اخطئتم التعبير<br />باي باي"
