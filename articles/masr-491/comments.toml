[[comments]]
order = 1
subject = "السيناريو"
text = "أرسل هذا التعليق بواسطة :"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 2
subject = "محمد المصرى"
text = ":اسمحو لى ان ارسل لكم سيناريو التوريث كما تخيلة شاب مصرى مهموم مطحون زى شباب مصر كلهم"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 3
subject = "* مشهد رقم واحد:"
text = "مبارك في صالة بيته، يجلس على سجادة صلاة بشكل علم مصر، ويمسك في يده مصحف، وعلى الأرض نسخة من قانون الضرايب الجديد، تركز الكاميرا على الساعة التي تشير عقاربها إلى الرابعة AM، ويعلو صوت مبارك بالتسبيح..<br />مبارك: يا رب، يا رب الواد جمال ربنا يهديه كدة ويكمل نص دينه، ويارب أشوف ابنه ييجي يصلي معايا العصر ونبقى أنا وهو أكيد في مصر.. يا رب أشوف ابنه بيشجع معايا مصر في بطولة كأس أفريقيا 2030.. يا رب..<br />صوت الباب يفتح، ويدخل جمال وهو يمشي مترنح.."
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 4
subject = "مبارك: إنت جيت يا حبيبي"
text = "جمال: إحم.. بابا.. إنت إيه اللي مصحيك لحد دلوقتي..<br />إنت موش وراك حكم الصبح، كدة تروح الرئاسة متأخر..<br />مبارك: يا ابني.. أنا من ساعة ما حكمت البلد دي وأنا موش شايف شكل النوم، الأمانة اللي في رقبتنا تقيلة قوي، يلا بقى عشان تيجي تشيل معايا الحمل<br />جمال (وهو يقبل قانون الضرايب): ربنا يخليك لينا يا بابا<br />مبارك: يا أبني بقى موش ناوي تعقل وتكمل نص دينك"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 5
subject = "جمال: وهو أنا عرفت أجيب النص الأولاني"
text = "مبارك: بتتريق حضرتك، طيب اتفضل أدخل أوضتك، محروم من لجنة السياسات لمدة أسبوع، ومفيش مؤتمرات ولا مناكفة مع عمك صفوت غير لما تتجوز، يلا أمشي من وشي، جتكوا نيلة.. مليتوا الحزب"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 6
subject = "جمال: والله ده ظلم"
text = "مبارك: بتبرطم بإيه يا ابن الـ......"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 7
subject = "* مشهد رقم اتنين:"
text = "أمام الجامعة الأمريكية، الطريق واقف، عربات مصفحة على اليمين والشمال، يقف جمال في وسط الشارع أمام باب الجامعة، يرتدي بنطلون جينز وتيشيرت أخضر مكتوب عليه \"فكر جديد\"، ونضارة شمس مرسوم عليها صورة مبارك، وفي فمه لبان سحري اللي لونه بيتغير..، تخرج من البوابة بنت برنزية اللون، واسمها خديجة، واحتمال تبقى خطيبته في المشهد الجاي..."
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 8
subject = "خديجة : اشمعنا.."
text = "جمال : طالب القرب"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 9
subject = "خديجة : يا سم"
text = "جمال : والنبي أنا موش نقصاني حاجة، مال وجمال ولجنة سياسات، وقريب هجيب موبايل 6600، ويمكن أغير عربيتي على آخر الصيف.."
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 10
subject = "خديجة : باباك يعرف إنك هنا"
text = "جمال : لو سمحتي.. أنا ليا شخصيتي المستقلة، وعندي عقدة أوديب..<br />خديجة : تقدر تروح تكلم باباي"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 11
subject = "* مشهد رقم تلاتة:"
text = "منزل العروسة، صوت سارينة في الشارع، تخرج خديجة من غرفتها إلى الصالة، وهي تصرخ..<br />خديجة: وصل يا بابا"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 12
subject = "وصل"
text = "باباها: بس يا بنت إختشي، واضح إن عريسك متريش<br />خديجة : سامع يا بابا سامع، يا حلاوة سارينته"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 13
subject = "باباها : خلي سعدية تفتح الباب"
text = "جمال : الحقيقة يا عمي.. أنا جاي أصلح غلطتي، وأطلب القرب من بنتك<br />باباها : معندناش بنات للجواز"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 14
subject = "جمال : ليه يا عمي"
text = "باباها : مينفعش تيجي لوحدك، لازم أبوك يكون معاك<br />جمال : هجيبه حالا.."
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 15
subject = "* مشهد رقم أربعة:"
text = "نفس سجادة الصلاة، ومبارك يجلس نفس الجلسة، يدخل جمال وهو ينهج<br />جمال: بابا، حبيبي.. شوف بقى... أنا جايبلك خبر حلو<br />مبارك : إيه يا ابني.. الـ88 بتوع الإخوان غرقوا في العبارة"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 16
subject = "جمال : لا .. حاجة أحلى"
text = "مبارك : العبارة لسه مغرقتش"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 17
subject = "جمال : لأ أحلى"
text = "مبارك : إيه، حركة (كفاية) بقت جماعة محظورة"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 18
subject = "جمال : لأ يا بابا.. أنا نويت أصلح غلطتك"
text = "مبارك : (ينزل بيده على وجه جمال).. جتك نيلة، وهو حد يعرف يصلحها.. يا أبني أنا غلطت مع الشعب كله<br />جمال : لا يا بابا، هصلح غلطتي أنا وأتجوز<br />مبارك : يا ما انت كريم يا رب.."
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 19
subject = "* مشهد رقم خمسة:"
text = "بيت العروسة، الأب وبنته ومراته وجمال وأبوه وأمه وأخوه وعيال أخوه ومراته، و..كمال الشاذلي.."
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 20
subject = "جمال : الحقيقة يا عمي.."
text = "باباها : عارف يا أبني، السيد محسن ممتاز من المخابرات"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 21
subject = "كان هنا من شوية، وفهمني كل حاجة"
text = "مبارك : طيب، حيث كدة أحب أقول إننا هنجيب السجاد وطقم المعالق و..<br />باباها : يا باشا إنت تأمر.. أنا بس كنت عايز أسأل العريس بيشتغل إيه.."
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 22
subject = "* مشهد رقم 76...بعد فترة طويلة يعنى:"
text = "قناة دريم، فيلم الدعاية لحملة جمال الانتخابية لفترة رئاسة عاشرة، يجلس جمال وبجواره خديجة<br />جمال : عجبني فيها إنها بدأت معايا من البداية وأنا لسه موظف صغير في لجنة السياسات، ودلوقتي برضه مستحملاني وأنا مشغول بهموم"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"

[[comments]]
order = 23
subject = "الوطن."
text = "خديجة : كان روش قوي، يا ما اتمشينا مع بعض على كورنيش نهر الراين، وكان بيقبض أول ما أتجوزنا مليونين بس، لكن أنا كنت شاطرة وكنت بعرف أوفر، وبعدين زمان كان المليونين دول يقدروا يفتحوا بيت كويس، لكن الحمد لله ربنا فتحها عليه من وسع..<br />*ندخل بقى بصوت المرحومة نانسي عجرم، في اغنيتها الخالدة، أطبطب .. أدلع<br />10/06/2006"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919124007/http://masr.20at.com:80/article.php?sid=491&PHPSESSID=169d1d7ef097bfce44c381274ae1cf1e"
