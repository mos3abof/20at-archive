posted = "2009-12-16"
text = "اكتير حلو هيك التوبيك واقترحات طرد التوتر فعلا سليمة 100% ولكن انا بدى اقول شئ واحد مش كل انسان يقدر انه يعمله كده فى ظروف بتكون غصب عن الانسان تمنعه من تطبيق هذه الشروط لمنع التوتر مثال الشاب فى البيت ممكن يكون فى مشاكل فى اطفال فى صراخ كل هيك الاشايء هتمنعه انه يجلس بهدوء وبعدين الشروط دى مش ممكن تطبق فى اى مكان مثل العمل لو انا توترت فى العمل شو راح اعمل اترك الشغل واذهب للمنزل ميشان اطرد التوتر الكلام سليم لكن تطبيق الشروط صعب ولكن من الممكن لو تعرض الانسان فينا للتوتر يعمل شئ واحد هو انه يقول يارب ويتنفس بهدوء واعتقد ان دى سهلة جدا لكم كل تحياتى ‎Wail Asmas Robn Hod‎"
archived = "2009-12-19"
capture_url = "https://web.archive.org/web/20091219153835/http://www.20at.com:80/20at/health/14292--10-.html"

