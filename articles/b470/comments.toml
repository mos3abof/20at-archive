[[comments]]
order = 19
subject = "معلش يا سي دبدوب"
author = "عبدالله مفتاح"
posted = "2006-02-21"
text = "اول حاجه معلش عشان اسلوب كلامي كان جامد<br />تاني حاجه مينفعش يكون النت مصدر معلوماتك ابدا لان في منها معلومات كتير مفبركه وغير موثقه<br />ثالث حاجه ان متهمتكش انك بتعادي الشريعه انا قلتلك لو عايز تقول قول<br />بجراه<br />رابع حاجه وهي الاهم انك مفترض السوء في كل المجتمع السعودي وفي كل القائمين على احوال السعوديه وده غلط<br />في حاجه تانيه عايز اقلهالك ان ناس كتير بيتكلموا عن علماء دين افاضل ويقللو من فتوى هما افتوها والناس اللي بيقللو من الفتوى دي لا يفقهون شيء في اي شيء<br />الحاجه الاخيرة اللي عايز اقلهالك ان مفيش شيخ بيخترع فتوى دي وجهات نظر وكل واحد حر ياخد بيها او مياخدش<br />بس لازم في الاخر كلنا نحترم اللي قالها لانه مش حرامي ولا نصاب ده عالم دين نحسبه على خير<br />ولا تزعل نفسك وانا بقلك مع السلامه يا صحبي وسلام كمان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

[[comments]]
order = 20
subject = "قلبكوا ابيض متتشنجوش"
author = "أكرم"
posted = "2006-02-25"
text = "بصراحه الموضوع ده خيالي جدا عشان انا عارف ان سينما سعودية زي العنقاء و الغول و الخل الوفي<br />عشان كده مرضيتش اعلق عليه بس لما دبدوب قال رأيه و الكل قلب عليه قلت من منطلق الصداقة لازم الواحد يدافع عن صاحبه<br />انا مش هقول غير مقوله للشيخ عمر عبد الكافي و هي ازاي بلد كبيرة طويلة عريضة و بلد الحرم كمان تكون على اسم عيلة واحدة مش ده تمييز للعيلة المالكة عن جميع العائلات و تمييز للنجديين عن الحجازيين و الشرقيين يا ريت تغيروا اسم المملكة احسن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

[[comments]]
order = 21
subject = "قلبك أبيض يا اكرم"
author = "ما اعتقدش انه في حد ينظر للسعودية حتى السعوديين نفسهم من هذا المنطلق ، انه اسم السعودية يميز عيلة عن اخرى ؟؟"
posted = "2006-02-25"
text = "دي حاجة تاريخية حصلت و انتهى الامر ، بلد عمره عشرات السنين نأتي لنغيره عشان اسمه يميز عيلة عن اخرى<br />... مافيش اي تمييز هو التاريخ يصنع هكذا .. و الاسم مادام لا يعيبه شئ يبقى خلاص .. الناس فاهمة التاريخ بيمشي ازاي..<br />طيب و الاردن يا باشا ... المملكة الاردنية الهاشمية ..<br />تاريخنا فيه الفاطميين و العباسيين ، الامويين .. الدولة الايوبية ..<br />هي الحاجات بتتسمى على الحدث الكبير اللي قامت عليه ممكن يكون اسم المكان اللي حصل فيهالحدث و ممكن باسم الشخص اللي عمل الحدث و كده يعني ...<br />حتى امريكا اللي هي امريكا الطويييييلة العريييييييييييييضة سميت على اسم المكتشف امريكو .. اسم شخص واحد و ليس حتى اسم قبيلة<br />فهل نطلب منها ان تغيره<br />ما اعتقدش ....<br />مداخلتك حلوة يا اكرم ..<br />سلااااام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

