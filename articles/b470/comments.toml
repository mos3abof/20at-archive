posted = "2006-02-20"
text = "ليس إلى الإخوة المتفذلكين والسطحيين والمصابين بفوبيا السعودية...<br />رغم كل ما قيل تظل تجربة موقع سينماك تجربة فريدة ومتميزة، وقد أثبتت نجاحها بالفعل... وهناك تيار رائد يكتب في جميع الصحف السعودية كان لسينما دور في صقل مواهبه وإبرازه.<br />وإلى كل من هاجم الفكرة أسال؟<br />هل لا تذهبون إلى السينما؟ هل لا تشاهدون الأفلام؟<br />كما أعود وأكرر السينما كوسيلة لم يتم تحريمها والعبرة بالمحتوى<br />وإلى هؤلاء جميعا أدعوكم لمتابعة مقالات الأستاذ رجا المطيري بجريدة الرياض لعلكم يوما تفهمون!"
