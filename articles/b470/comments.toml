[[comments]]
order = 23
subject = "رد على الاخ دبدوب"
author = "عبدالرحمن"
posted = "2006-05-19"
text = "السلام عليكم ...<br />الاخ دبدوب انا اتمنى اعرف ليش كل هالحقد على السعديه ؟؟<br />هل انت فقط تنتقي اخطائنا علشان تجاهر بها ؟؟<br />انت وللأسف سألت سؤال اقدر اقول عليه وللأسف الشديد ومع العذر (( غبي )) .<br />الشباب السعودي زي كل الشباب اللي بالعالم مهما كان دينهم يا أما مراهقين او شباب .<br />يبدوا لي انك تريد ان نكون كلنا متدينين ومتشددين علشان ترتاح .<br />طيب انا ابي اسألك سؤال بسيط ؟؟<br />كيف يكون بلد كماتلمح ان تسميه (( استقراطي )) او (( دكتاتوري )) متوسط دخل الفرد فيه تقريبا 4000 دولار ؟؟<br />اليست الدول الدكتاتوريه تأكل الشعوب ؟<br />ان كيف تريد ان نكون :اسلاميين متشددين ام متحررين منحلين ؟؟<br />هو طبعا كل دوله بالعالم عليها بعض السلبيات ولو اريد ان اعد السلبيات الموجوده في مصر (( الحبيبه )) لما توقفت حتى الصباح !!<br />اريد ان اقول لك كلمه واحد نحن عرب اخوه لاتجعنا اعداء بكلامك هذ وسبك للحكومه السعوديه .<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

