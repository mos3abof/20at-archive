[[comments]]
order = 12
subject = "لدبدوب مع التحية"
author = "\"لا تقل لي من فضلك انه يوجد الطيب والخبيث في كل مكان فهذا الكلام يقال في اي وكل مكان اخر لا يطبق الشريعة الاسلامية بهذا الشكل, فاذا كنا وصلنا الي نفس النتيجة حينما طبقنا الشريعة فاين الخلل؟"
posted = "2006-02-20"
text = "هذا السؤال الذي طرحته حضرتك .. صح ؟<br />و هذا كان ردي ..<br />\"بس اعود مرة اخرى الى سؤال دبدوب .. ما تسمعه عن تطبيق الشريعة في السعودية ليس كافيا .. علينا ان نعرف كيف يتم تطبيقها قبل ان نستنتج نجاح التطبيق او عدمه .. فأنا مثلي مثل غيري اسمع انه في السعودية تطبق الشريعة و لكن لا اعرف الكيفية اذا كانت صحيحة او لا..<br />الشريعة الاسلامية ناجحة لابد اذا كان تطبيقها متكاملا و عادلا و يتناسب مع المكان و الزمان \"<br />يعني يا اخ دبدوب انا لم أرد على سؤالك و بالحرف قلت انه سؤالك لماذا الشريعة لما طبقناها ظهر خلل مش كفاية ، الاولى اننا نتبين كيف يتم تطبيقها عشان بعدين نحكم لماذا فشل تطبيق الشريعة في السعودية ..<br />و هذا بالفعل ما قمت به حضرتك و ووضعت في ردك الثاني الاسباب و التي تظهر بكل وضوح انه الصورة اللي تنقل عن السعودية في تطبيق الشريعة هي غير صحيحة او غير مكتملة لأنه في حاجات تطبق بطريقة خطأ مثل الفرض بالقوة و غيرها من اللي حضرتك ذكرته في ردك الثاني ..<br />.. يعني الشريعة لم يتم تطبيقها بالشكل الصحيح و الخلل لم ينبع من الشريعة و انما من تطبيقها بطريقة خاطئة<br />اعتقد الان انه تعليقي الاول واضح و كان في محله<br />و كما قلت في تعليقي الاول أنني أعلق على دبدوب و ليس ردا عليه<br />لانه الرد يجب ان يأتي من شخص عاش في المجتمع السعودي أو شخص على درايةبكل شئ فيه و الحمد لله أنا طول عمري إماراتية و عايشة في الامارات ..<br />و تحياتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

