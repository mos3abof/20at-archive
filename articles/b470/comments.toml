text = "والله يا اخي انا ماجبتش الكلام ده من بيتنا انا قراته في عدة مواقع علي الانترنت وعموما يا سيدي اسف علي الفتوي دي<br />بس الاهم انك لم ترد علي ما قلته بالاعلي واكتفيت باتهامي بالعداء للشريعة .<br />يا اخي اما ان ترد علي (لوكنت تملك ردا) او تسكت<br />انا زهقت بصراحة من الناس اللي بتسيب الموضوع الاساسي وتمسك في تفاهات<br />وبلاش سلام المرة دي<br />Dabdoob"
