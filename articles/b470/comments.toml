[[comments]]
order = 26
subject = "فوق هام السحب ي وطنا"
author = "احلى سعوديه"
posted = "2006-09-06"
text = "السلام عليكم اولا الشباب الي مو عاجبتهم السينما وضد ان يتم صناعه سينما سعوديه ليه تعبتوانفسكم وبحثتو عن الموقع ثانيامن مصلحتنا انا نسوي افلام عنا عشان العالم يعرف معنى الاسلام وطريقه تطبيقه وعن شخصيات المسلمين الي صنفوها انها ارهابيه على فكرة الاخت الي تكلمت عن ابو متعب ياليت تحترم نفسها لانها صنفتها والي فهمته من كلامها انها تتهم انه موالي لسياسه الامريكيه<br />على مااضن انك انتي نفسك تحسين ان كلامك ماله معنى ووهم انتي لوحدك عايشته مااضن ان مجرد صناعه سينما توصل الشعوب لرذيله والفسق على فكرة مواضيع سينما والمسلسلات السعوديه دائما اسلاميه اجتماعيه بحته مافيها الي ينوجد بدول ثانيه عربيه مثل افلام المصريه<br />احنا كاسعودين لان مافي سينما وهاذاسبب تافه ينظرون لنا نظرة ارهابيين واكثر من كذا عشان مافي سينما اعتقد انه سبب تافهاحنا بنصنع سينما وبنبني ديرتنا ونخليها على القمه اكثر واكثر<br />واضن الي عنده نقد ياليت يكون بناء من دون اتهامات ساذجه مثل الي كتبتها الاخت عن ابو متعب<br />sweet_princess<br />ياليت تغيرين نك نيم حقك لان مانوجدت عندك اخلاق الاميرة<br />هاذي نصيحه جادةثالثا :على مااضن ان الي يتكلمون عن الاضطهاد مو عايشين بسعوديه السعوديه وفرت للمراة وصحيح متاخر لكن ان تصل متاخرا خير من الا تصل ابدا قوانين تحميهاوتساعدها ان كانت وحيدة او لها عون مع مراعاه الشريعه الاسلاميه وجهل المراة بحقوقها مو مشكله النضام بل مشكله المراة بعدم اهتمامها بحقوقهاكامله<br />السعوديه وفرت اشياء الدول الجارة لها ماوفرته وخلونا من السواقهالسيارة من يتجرى ويسوق بكبر مساحه المملكه ونصها بر ونتو عارفين واحنا كانساء سعوديات تعودنا نجلس والرجال يوفرون لنا طلباتناودول ثانيه ينزلون يوفرون لازواجهم الي يبيه بااساليب منحطهالمراة السعوديه محجبه ولا مو محجبه تبقى سعوديه والي مو فاهم المجتمع السعودي هو اكبر خاسر اذا ماحاول يفهمنا<br />وفي نساء من دول ثانيه يجون بصفتهم سعوديات وهاذا مو صحيح ياخذون حقوق السعوديات ويرجعون بلادهم عايشين من خيرناواقرب مثال الكويتين<br />احنا بنعمه ونحمد رب العالمين عليها ارضنا بفقرها وغناها وبحلوها ومرها فوق على القمه والي مو شايف هاشي ياليت يناضر فوق عشان يشوفنا<br />الزبدة ياجماعه الله يعطيكم العافيه والي الله كاتبه بيصير غصبن عن خشوم الي مو عاجبهم<br />وبالتوفيق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

[[comments]]
order = 27
subject = "لا تدخل نفسك في شي مايخصك"
author = "سعودية"
posted = "2006-10-03"
text = "بسم الله الرحمن الرحيم،،<br />والله ثم والله اني استغربت هالردود الغريبة ،، توني استوعب ان فيه ناس فاهمينا غلط،، يااخواني واخواتي انتو بتجيبون معلوماتكم هاذي من وين ؟؟<br />ابي بس اقول ان هاللي يكتبون عن السعودية لا عاشو فيها،، ولا حتى عاشروا سعوديين ،، اللهم بس ياخذون الأفكار الانترنت والقنوات اللي الواحد مايضمن صحة مصادرهم<br />يمكن مايشوفون او مايعرفون شي من السعودية الا طاش ماطاش ،، وطاش ماطاش مسلسل يطرح المشاكل عندنا ،، بس فقط لاغير،<br />انا سعودية وافتخر،،<br />مسألة الفتاوي وكذا ،، ماارد الا اقول لا تسمع فتوى من اي احد،،<br />بالنسبة للسينما في السعودية ،، كل شي جاي ليه متسعجلين !!!<br />وكمان انافتاة سعودية ماتسوق،، اوكي مافيه ذيك المشكلة زي ماقلت كل شي جاي،، وانا حالياً اكثر من راضية ،، وش احسن من اهلي السعوديين يوفرون لي سواق 24 ساعة وكأني أميرة ،، أغلب العربيات مااحد يحميهم ويدللهم،،<br />وبالنسبة لتغيير اسم الدولة،، ابي اعرف اللي طلب هالطلب،، طالبه لغرض الدفاع عننا والا ايش،،<br />انا افتخر اني احمل اسم عائلة ملكي عبدالله بن عبدالعزيز اسم كله فخر وعزه،،<br />ورداً على ماقالوا الاسم لا يميز بين حجاز ونجدي وجنوبي وماادري ايش ،، بالعكس هذا اللي يجمعنا،،<br />بالنهاية مااقول الا الله يخلي لنا السعودية وهي كل يوم تتطور اسرع من اكثرية الدول العربية والحمدالله والشكر ،،<br />والله يحمي جميع المسلمين والعرب ويخليهم يد وحده ،،<br />وبالتوفيق للجميع ان شاء الله ،،<br />ودمتم سالمين ،،"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"
