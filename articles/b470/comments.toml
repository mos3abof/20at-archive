[[comments]]
order = 9
subject = "رفقا بنا يا اخ عبدالله ويا دبدوب"
author = "عبدالله مفتاح"
posted = "2006-02-20"
text = "من الواضح يا اخ عبدالله ان نظرتهم للسينما ليست كنظرة الايرانيين للسينما وابسط دليل وضعهم مقال عن مخرجه سعوديه (غير محجبه) في الموقع والاكتر من كده ان المخرجه بتتكلم عن حاجات زي اضطهاد المراه في المجتمع ورضوخهم للضغوط ومش عارف ليه حاطين صورة بنات منقبات مش عارف ايه لازمة الصور دي جنب المقال يمكن يقصدوا ان هم دول النساء اللاتي بلا ظل يبقى نظرتهم مش زي السينما الايرانيه خالص ويا ريت بلاش تقول اننامن العصور الوسطى حتى لو احنا خايفين على المجتمع ده مش مبرر انك تسخر مننا ويا ريت كلامك يبقى في شياكه شويه ومتقلش المشكله في عقولكم<br />اما الاخ دبودوب بقا انا مش فاهم انت عايز تقول ايه لما انت اعترضت على كلام الاستاذ اللي رد عليك لو كنت تقصد ان العيب في الشريعه خليك جرئ وقولها ومتلفش ولا تدور اللي عايز تقوله قوله بجراه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

