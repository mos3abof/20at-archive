order = 14
subject = "ارحموني باه"
author = "Dabdoob"
posted = "2006-02-21"
text = "مين قال اني ضد تطبيق الشريعة؟!!<br />اللي اعرفه اني ماقلتش أي حاجة عن كده لكن الشريعة ما بتقولش انك تمشي الدين علي هواك ولأغراض دعائية ولا بتقول انك تحرم كل واي حاجة جاية من بره لمجرد انها من بره !!!<br />برضه اللي انا قلته كله واقع وحقيقي انا ما فبركتش أي حاجة من الكلام ده والحاجات الي قلت انهم بيحرموها هم فعلا بيحرموها !!! انا مش فاهم انتوا معترضين علي كلامي ليه انا كلامي واضح يعني...........<br />اخر حاجة من النماذج الدعائية دي لما الملك عبد الله مسك الحكم اصدر قرارا بمنع تقبيل يد الملك لان هذا حرام (وهو حرام بالفعل) ولكن الم يكتشف فقهاء السعودية طوال اكثر من نصف قرن من الحكم الملكي ان تقبيل يد الملك حرام . حاجة تانية ان السعودية تسحب سفيرها من الدانمارك للاحتجاج ليه ماسحبتهوش من امريكا لما سبوا الرسول مليون مرة في الصحف والقنوات والافلام ولما تبولوا علي القران.<br />اخيرا بالنسبة للسينما الاسلامية يا هبهوب تقدري تتفرجي عليها علي قناة اقرا قريبا وممكن ابعت لك اراء الكتاب عنها . بس رايي انا انه من الصعب جدا وجود سينما بالشكل ده لاسباب كتير جدا.<br />وسلام<br />kokorah@maktoob.com<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

