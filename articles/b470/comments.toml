[[comments]]
order = 2
subject = "إلى الأمام سينماك"
author = "عبدالله"
posted = "2006-02-19"
text = "يبدو أن الإخوة الذين قاموا بالتعليق قبلي مازالو يعيشون في العصور الوسطى، وقد أغلقوا عقولهم وبدأو يرددوا نفس الجمل والعبارات الشائعة..\" حرام\"، مع ان احدا لم يحرم السينما كوسيلة، والتحريم جاء للمحتوى، وعندما يأتي هؤلاء الشباب لتطبيق أفكار جدبدة هم يومنون بها دون الإخلال بمنظومة المجتمع بالرغن ما يواجهون من صعوبات مادية فلا نملك سوى ان نحييهم، ونخص الأستاذ رجا ساير المطيري الذي أسهمت كتاباته ومقالاته في جريدة الرياض في إماطة اللثام عن كتير من الأمور المتعلقة بفوبيا السينمافي بلادنا... فالسينما أداة ثقافية قبل أن تكون أداة ترفيهية، وإن هناك كير من الشعوب طوعت السينما لتعكس تطلعاتهاوتلبي احتياجاتها، مثل السينما الإيرانية فالأفلام الإيرانية تظهر فيها ممثلات مرتديات لغطاء الرأس، ولا تحتوي على أي مشاهد غير لائقة. إذن فالمشكلة ليست في السينما أو سينماك... المشكلة في عقولكم؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

[[comments]]
order = 3
subject = "شكرا سينماك"
author = "أنا لن أقوم بالتعليق ولكن سأنقل لكم فقط مقتطفات من مقال الناقد الفني السوري صلاح سرميني عن موقع سينما."
posted = "2006-02-19"
text = "يقول سرميني: موقع (سينماك)، وعلي الرغم من سيطرة السينما الأمريكية علي معظم (زواياه)، لشغف المُشرفين، واقتصار مشاهداتهم علي ما هو متوفر في الأسواق السعودية من أفلام، يبقي موقعاً مهماً، يُضاف الي قائمة المواقع العربية السينمائية، انه علي الأقل، يُحرض المتفرج علي مشاهدة الأفلام، ويثير فضوله المعرفي، ويجعل من المُشاهدة السينمائية نشاطاً انسانياً، ويُزيح عنها فكرة التحريم، ويُخلصها من قيود الأفكار المُسبقة، والمُكتسبة<br />ولكن، مهما كانت العادات، والتقاليد، والتفسيرات الدينية صارمة في حق السينما، ومشاهدتها، فانها لم، ولن تستطع الوقوف في وجه التطورات التقنية الجديدة.وأن يشاهد المتفرج السعودي أفلاماً أمريكية، هندية، ومصرية.. والقليل من السينمات الأخري، وأن يتصفح موقعاً مثل (سينماك) القادر علي الانفتاح نحو آفاق سينمائية متعددة... أفضل بكثير من غياب السينما عنه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

[[comments]]
order = 4
subject = "فهموني"
author = "Dabdoob"
posted = "2006-02-20"
text = "ارجو الا يساء فهمي في كلامي التالي فانا اكتبه لانني حقيقة لا افهم المجتمع السعودي<br />مجتمع منغلق متزمت بشدة بحكم تقاليده وعاداته وحكم القبيلة, مجتمع مجبر علي التدين , متشدد في تطبيقه. برغم هذا كله فانك تشعر دائما ان هناك الكثيرون داخله ناقمون علي هذا الوضع متمردون عليه تراهم في السينمات في الدول العربيه تراهم علي المنتديات المهتمة بتحميل الافلام والاغاني تراهم علي شاشات الفضائيات باحثين عن منفذ للحياة بعيدا عن كل هذه القيود الداخلية.<br />وسؤالي هو لماذا وصلنا الي هذا الوضع في دولة من المفترض فيها انها اكثر الدول تطبيقا للشريعة الاسلامية؟<br />لا تقل لي من فضلك انه يوجد الطيب والخبيث في كل مكان فهذا الكلام يقال في اي وكل مكان اخر لا يطبق الشريعة الاسلامية بهذا الشكل, فاذا كنا وصلنا الي نفس النتيجة حينما طبقنا الشريعة فاين الخلل؟<br />ومرة ثانية ارجو الا يساء فهمي وهذا هو ايميلي لمن يرغب في المناقشة<br />kokorah@maktoob.com<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

[[comments]]
order = 5
subject = "سؤال جميل"
author = "السلام عليكم و رحمة الله وبركاته"
posted = "2006-02-20"
text = "لو سمحلي الاخ دبدوب اعلق على مداخلته<br />و هو فعلا سؤال مهم الذي تم طرحه ..<br />و هو لماذا وصلنا الى هذا الحال في السعودية رغم تطبيق الشريعة ؟؟<br />و اجابتي هي : عندما نقول انه تم تطبيق الشريعة فماذا نعني ؟ و كيف تم تطبيقها ؟ الجواب هو اللي سيحدد .. الصورة التي يتم تناقلها عن السعودية في كثير من المواقع غير السعودية للاسف تعكس واقع رداءة اعلامنا العربي و انه فشل في تعريف الشعوب العربية ببعضها البعض ، لانك حيثما تذهب تجد ان الناس بمجرد سماعها لكلمة \"البلد الفلاني أي كان \" فانها تطلق\" أحكام مسبقة \" تم الحصول عليها من الانترنت او المحادثات او الاعلام .. و هي ان كانت احكاما صحيحة او خاطئة الا انها لا تعطي الصورة الكالمة بالمرة ...<br />نحن كشعوب عربية علينا ان نتعرف على بعضنا ليس من خلال ما نسمعه في المنتديات و المواقع ، على اعلامنا ان يفتح لنا نوافذ على الدول الاخرى ،، للاسف الاعلام المصري اللي كان في التوب يوم من الايام هو في الوقت الراهن منغلق على نفسه جدا و المشاهد المصري لا توجد لديه وسائل كافية للاطلاع الى ما يحصل خارج حدود مصر ..<br />الموضوع متشعب على ما اعتقد .. بس اعود مرة اخرى الى سؤال دبدوب .. ما تسمعه عن تطبيق الشريعة في السعودية ليس كافيا .. علينا ان نعرف كيف يتم تطبيقها قبل ان نستنتج نجاح التطبيق او عدمه .. فأنا مثلي مثل غيري اسمع انه في السعودية تطبق الشريعة و لكن لا اعرف الكيفية اذا كانت صحيحة او لا..<br />الشريعة الاسلامية ناجحة لابد اذا كان تطبيقها متكاملا و عادلا و يتناسب مع المكان و الزمان ... و ايضا لا ننسى انه الصالح و الطالح كان دائما موجود حتى في الدولة الاسلامية الاولى ايام لارسول صلى الله عليه و سلم و خلفاؤه ..<br />و السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

[[comments]]
order = 6
subject = "ما هي خربت"
author = "sweet_princess"
posted = "2006-02-20"
text = "والله خربت مش الملك عبد الله راح وزار المعفن بوش في المزرعه بتاعته اول السنه اللي فاتت يبقى طبيعي جدا انه يظهر اي تفكير ممكن يكون في بدايته او في ظاهره شئ عادي والخوف فعلا انهم بيتدوا التطلع للغلط بعد كده وياريت سينيماك دا يناقش افلام السينما الامريكيهوتاثيرها المدمر وانا بكرر المدمر علينا كلنا كشباب وياريت بقى الاخوه دول ما ينسوش الافلام اللي بينجها وبيخرجها يهود(ال يعني فيه حد قاعد على تلها غير اليهود ) وبتسئ للعرب والمسلمين ولا برضه زي باقي العرب دايما بيجرو ورا التفاهه ؟عموما هي سلاح ذو حدين ممكن تكون بتناقش واقعنا العربي وموقف السينما العالميه مننا وممكن يكون الموضوع كله تهجيس وبس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

[[comments]]
order = 7
subject = "يعني ايه يعني"
author = "Dabdoob"
posted = "2006-02-20"
text = "اسف جدا لكنني لا اظن ان ما تقوله يعتبر ردا<br />لقد سالت عن السبب في هذا الوضع الذي نري عليه المجتمع السعودي ؟<br />اظن ان السبب هو ببساطة :<br />1-اجبار الناس علي ارتداء عباءة الدين رغما عنهم ويتمثل هذا في الكثير من الامور وان كان اهمها النفوذ الرهيب للسلطة الدينية في السعودية ومنها هيئة الامر بالمعروف والنهي عن المنكر.<br />2-قهر الافكار المخالفة باسم الدين ويتمثل هذا في حالات الاعتقال والمحاكمات الكثيرة للمعارضين السعوديين تحت ستار مخالفة ولي الامر!!!!!<br />3-اطلاق الفتاوي المضادة للحداثة والعصرية والمعادية للغرب ويبدو هذا جليا في الفتاوي الخاصة بالتليفزيون والكاميرات عموما والبورصة والتليفونات المحمولة ومقاهي الانترنت وقيادة السيارات بالنسبة للمراة والصحافة و.........<br />4-الكيل بمكيالين فيما يتعلق بالدين حينما يتعلق الامر بالسلطة الحاكمة فنري الشيوخ السعوديين يحرمون مقاهي الانترنت بكل سهولة ولكنهم حين يتعلق الامر بتجاوزات الامراء او دخول القوات الاجنبية الي داخل البلاد لمحاربة المسلمين فان هذا حـــــــــــــــــــــــــلال!!!!!!!!!!!<br />5-طبيعة المجتمع السعودي من حيث كونه مجتمع قبلي بحت تحكمه التقاليد بشكل خانق.<br />6-تراجع قيم الحريات (حرية التعبير حرية الصحافة حرية الاجتماع حرية العقيدة حرية الفكر.....الخ) داخل المجتمع السعودي وتصوير هذه الحريات علي انها مفسدة من مفاسد الغرب المادي المتعفن ( علي حد قول احد شيوخهم) وهذا التصوير كان بالطبع بايعاز ومباركة الاسرة الحاكمة .<br />وانهي كلامي بانني لا اقصد ان اسئ الي احد بل انني اناقش الامر لنعرف جميعا اين الخلل<br />KOKORAH@MAKTOOB.COM<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103228/http://www.20at.com/article2.php?sid=470"

