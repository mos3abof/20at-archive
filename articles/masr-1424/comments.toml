text = "و الله نسيتها ايام الامتحانات بس الموضوع ذكرني فيها... اصلي متخرجةمن 5 سنين و الحمد لله ما تورطتش بدراسات عليا زيك يا نوفا... شفت صحبتي شو عمل فيها المجستير فاخذت عبرة<br />اما ايام الامتحانات فتربط بذاكرتي مع روب بابا الشتوي(طبعا اذا كانت اجت بالشتا)اصلي بريدة قوي.. فكنت استولي عليه و احط الدفاية قبالي و اتربع على الارض وهات يا دراسة(مذاكرة بالمصري) وطبعا النفس مفتوحة ديما عالاكل وعشان ما اضيعش وقت كنت بقضيها شرب لبن مخيض(ودا معرفش بالمصري بقلولو ايه)<br />وكل موسم امتحانات و انتو بخير"
