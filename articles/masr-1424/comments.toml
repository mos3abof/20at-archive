[[comments]]
order = 6
subject = "هعلق علشانك انتى بس يا روضه"
author = "نيفين نيفى نوفا"
posted = "2007-01-10"
text = "اولا ازيك يا روضه و وحشتيييييينى<br />ثانيا انا مدعت الامتحانت خلاص مع انى ف اللى اشد منها الا و هو المجستير الله يعمررررر بيته<br />و عايزه اقول لكل الناس اللى زهقانه من الامتحانات انتو ف نعمه<br />بكره لما تجربو شغل الدراسات العليا عتهرفو انكو كنتو كتمتعين بنعمه كبيره و انتو مش عارفين<br />على الاقل انتو لاقيين حاجه تذاكروها مش بتدورو و تبحثو و تطلع عينيكو ف البلد كلها و مكاتبها من شرقها لغربها و ف الاخر الموضوع ميعجبش السيد المشرف بتاعكو و روحو تانى و دورو ا خبطو راسكو ف الحيطه<br />المهم و الله انا الامتحانات عندى كانت بتساوى الطقوس الاتيه:<br />قعاد على السفره لان الاوضه يتخلينى انام+كبايه القهوه التمام+الراديو+اى ديوان شعر لزوم الهروب المؤقت من الواقع الاليم+ورق ابيض لزوم الخواطر او اى الهام شعرى صارىء+كتاب الماده و اى ورق متعلق بالماده من بعيد او قريب<br />عموماابقى اسالى يا روضه"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112213344/http://masr.20at.com:80/article.php?sid=1424"

[[comments]]
order = 7
subject = "ايام الامتحانات"
author = "اذكر انى حضرت امتحان وكان الاستاذ الذى يدرس المادة استاذ امريكى زائر"
posted = "2007-01-10"
text = "وجدنا ورق الاسئلة فية 200 سؤال يتدرجوا من الاسهل الى الاصعب واحيانا كانت الاجابة كلمة واحدة تكتب تحت السؤال وطبعا الاسئلة مباشرة جدا وتبين ان كنت فهمت المقرر او لا كلام جميل<br />وطبعا اللى جاوب 50 سؤال واللى 100 سؤال<br />ونجحنا كلنا<br />اما المعقدين فبيجيبوا 5 اسئلة كلها الغام وتخمينات وياترى يقصد اية<br />الامتحانات المصرية مش امتحانات دى نكد<br />ممكن الاسئلة كلها تيجى من باب واحد<br />ربنا يسلم<br />وينجحكوا جميعا"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112213344/http://masr.20at.com:80/article.php?sid=1424"

