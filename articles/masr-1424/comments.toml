text = "و الله الموقع منور بيكى يا روضه<br />بالنسبه للماجستير ربنا يسمع منك<br />انا نفسى طويل متخافيش عليا<br />وبحب اقول لريماانتى فين من زمان<br />من شاعه موضوع القهوه متكلمناش<br />و الله يا ريما الطموح العلمى دا قدر و احمدى ربنا انه مش قدر عليكى<br />بالنسبه لمحمد هندعيللك زى ما دعينا ليك كلنا قبل كدا<br />فاكر امتى<br />و لا بلاش تفتكر احسن انت ف ايام امتحانات<br />يعنى انت كدا عليك لينا دعوتين<br />ربنا يوفق الجميع"
