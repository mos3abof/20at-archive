subject = "نسيت اقولكم حاجة"
author = "مصرية"
posted = "2007-01-24"
text = "نسيت اقولكم انكم تدعولى علشان كل مااجى اذاكر اسمع عمكم عبد الحليم وهو بيقول \"وطريقك مسدود مسدود مسدود مسدود يا ولدى\"اقوم انا من على المذاكرة وانا فى حالة تشاؤم وفى حالة قرف غير طبيعية وربنا يستر واعرف اذاكر السنة دى وانجح"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127215415/http://masr.20at.com:80/article.php?sid=1424"

