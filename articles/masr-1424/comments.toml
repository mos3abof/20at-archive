author = "مصرية"
posted = "2007-01-24"
text = "الموضوع حلو جدا يا روضة وعلى فكرة انا لسة مغيرة فيوز دماغى لانه ضرب اكتر من مرة دة غير بقى انى جالى حول فى عينى وقربت البس نظارة والحمدلله و قرب يجيلى القلب والسكردة غير انى عندى اصلن الضعط ودة طبعا قبل ماتطلع النتيجة وبعد ماتطلع النتيجة انا بقولكم تقرولى الفاتحة وتحضروا جنازتى فى عمر مكرم\"هو اتباع بس يلا الواحد يعمل فيه الجنازة احسن مايعملها فى الشارع\".<br />وربنا معاكم فى الامتحانات وذاكر كويس تنجح وغش تجيب مجموع"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127215415/http://masr.20at.com:80/article.php?sid=1424"

