posted = "2007-01-10"
text = "ايام المتحانات كان الصراحة ايام هباب انا فاكرها اصلى لسة خريج جديد زى ما بيقولى بس مزاكرة عندى يعنى البس رووب التفكير و رووب التفكير دة للميعرفوش دة روب بتاع ابويا قديم عامل زى بتاع عماد حمدى فى افلامه القديمة اربط الروب الربطة التمام مع اغانى عبد الحليم او فيروز و لو المادة صعبة يبقى شغل نجوم افام بهيفتها و ازاكر و انا برد على كل هايف و هايفة بيتصلو ببرامج الازاعة دى و والله جابت نتيجة كويسة جدا و شدو حيلكو و منجلكوش فى مادة صعبة"
