[[comments]]
order = 8
subject = "تعالوا نبقى واحد قدام العدو"
author = "سمسم"
posted = "2006-07-04"
text = "بسم الله الرحمن الرحيم<br />إخوانى فى الله من المسلمين, إخوانى فى الوطن من النصارى..<br />تعالوا نبقى واحد قدام العدو..<br />العدو اللى عمره ما حب الخير لينا..<br />العدو اللى عاوزنا نحقد على بعض وننشغل بالتخطيط لبعض ونقتل بعض وهو المستفيد الأول وربما الأوحد..<br />تعالوا نحرر بلدنا من الديكتاتورية والفساد اللى احنا مشتركين فى جزء منه بسكوتنا عليه..<br />تعالوا نقول للظالم اللى ظلم المسلمين والمسيحيين وعاوزهم رعايا تحت حكمه..<br />عاوزين نقعد نتهم بعضنا ونحاكم بعضنا وسايبين المفسدين والإنتهازيين ياكلوا فى بلدنا..<br />يا اخوانا دى بلدنا..<br />بنتخانق عليها وكل واحد عاوز يطرد التانى منها وهى أصلا مش فى إيد حد مننا..<br />عاوزين ننتبه لنفسنا ونبص لمستقبل أجيالنا الجاية..<br />عاوزينهم عبيد ولا رعية..<br />ولا عاوزينهم أحرار يقفوا ويتحملوا المسئولية..<br />مسؤلية البلد اللى هيلومونا عليه مليون مرة لو فرطنا فى حبة حرية..<br />حريتنا وحرية أجيالنا الجاية..<br />الله أكبر.. ولله الحمد..<br />القرآن دستورنا.. والرسول زعيمنا..<br />والموت فى سبيل الله أسمى أمانينا..<br />(الإسلام هو الحل)"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705081559/http://masr.20at.com:80/article.php?sid=592"

[[comments]]
order = 9
subject = "إذا كان زعيمهم بيدعوا للفتنة والطائفية"
author = "واحد عارف النصاري عايزين ايه"
posted = "2006-07-04"
text = "يعني يا سمسم انت الكلام اللي بتقوله كله عك إذا كان ريئسهم وزعيمهم بيخطط لدولة ولسلطة وللتمكين من الارض منين بقي نبقي واحد ومش عارف ايه الكلام اللي انت عمال تقوله, انا مبقولش نتحارب ونتخانق الكل عارف ان الاسلام والمسلمين بطبعهم مسالمين ومش بتوع مشاكل, لكن شغل اليهود ده بتاع مزج السم بالعسل مينفعش معانا, فيه خطة ومحكمة ولو تلاحظ مش هتلاقي حد يكدب الكلام لأنه حقيقة مية بالمية."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705081559/http://masr.20at.com:80/article.php?sid=592"
