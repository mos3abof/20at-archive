[[comments]]
order = 1
subject = "ديه البداية"
author = "مصري مسلم"
posted = "2006-07-03"
text = "القاهرة- (اف ب)<br />أكد رجل دين قبطي انشقاقه عن الكنيسة الارثوذكسية الأم في مصر، لأن عهد رئيسها البابا شنودة \"هو الأسوأ\" في تاريخ الاقباط كما قال، معلنا عن تأسيس مجمع مقدس مرتبط بالمجمع المقدس للمسيحيين الارثوذكس في الولايات المتحدة.<br />وقال راعي كنيسة المقطم الذي أطلق على نفسه اسم الانبا مكسيموس الأول في حديث إلى صحيفة \"المصري اليوم\" المستقلة \"لا امل في إصلاح كنيسة البابا شنودة فكان من الضروري اللجوء للخارج لإنقاذ الأقباط في مصر الذين عانوا من تسلط هذه الكنيسة\".<br />وأضاف \"عهد البابا شنودة يعتبر الأسوأ على الإطلاق في تاريخ كنيستنا\"، واتهم الباب شنودة بالتحريض الطائفي وقال إن \"تصرفات البابا شنودة كمن يصب الزيت على النار فقد كان يحرض الأقباط على الثأر من المسلمين وحمل السلاح\".<br />وأوضح أن إنشاء مجمعه جاء بقرار المجمع المقدس للمسيحيين الارثوذكس في الولايات المتحدة.<br />وقال \"تحدثت مع المجمع الأمريكي فقررت قيادته إنشاء مجمع مقدس لمصر وكنائس الشرق الأوسط يكون موازيا للمجمع الموجود داخل الكاتدرائية\".<br />هذا الحوار تم نسخه من موقع العربية, نود اي ايضاح او شرح من المسيحين لهذا الموقف وهل هذا نذير سئ, لأنني أعلم كم انتم تحبون وتقدسون البابا شنودة هل فعلاً يوجد هذا الكم من الإنشاق داخل كنيسته."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705081559/http://masr.20at.com:80/article.php?sid=592"

[[comments]]
order = 2
subject = "هو ده شنودة"
author = "واحد عارف النصاري عايزين ايه"
posted = "2006-07-03"
text = "خطاب ألقاه البابا شنودة في الكنيسة المرقصية الكبرى في اجتماع سري أعان الله على إظهار ما وقع فيه ...<br />نقدم لسيادتكم هذا التقرير لأهم ما دار في الاجتماع :-<br />بعد أداء الصلاة و التراتيل طلب البابا شنودة من عامة الحاضرين الانصراف ولم يمكث معه سوى رجال الدين وبعض أثرياء الأسكندرية ، وبدأ كلمته قائلاً :<br />\" إن كل شىء على ما يرام و يجري حسب الخطة الموضوعة لكل جانب من جوانب العمل على حدة في إطار الهدف الموحد \" ، ثم تحدث في عدد من الموضوعات على النحو التالي :<br />أولاً : شعب الكنيسة<br />صرح لهم ( أي شنودة ) أن مصادرهم ـ في إدارة التعبئة و الإحصاء ـ أبلغتهم أن عدد المسيحيين في مصر بلغ ما يقارب الثمان مليون(8.000.000) نسمة ( هذا الكلام في عام 1973 ) ، و على شعب الكنيسة أن يعلم ذلك جيدًا ، كما يجب عليه أن ينشر ذلك و يؤيده بين المسلمين ، إذ سيكون ذلك سندنا في المطالب التي سنتقدم بها إلى الحكومة التي سنذكرها لكم اليوم . و التخطيط العام الذي تم الاتفاق عليه بالإجماع و الذي صدرت بشأنه التعليمات الخاصة لتنفيذه ، وُضع على أساس بلوغ شعب الكنيسة إلى نصف الشعب المصري ، بحيث يتساوى عدد شعب الكنيسة مع عدد المسلمين لأول مرة منذ 13 قرنًـا ، أي منذ (( الاستعمار العربي و الغزو الإسلامي لبلادنا )) ـ على حد قوله ـ ، و المدة المحددة وفقًـا للتخطيط الموضوع للوصول إلى هذه النتيجة المطلوبة تتراوح بين 12 ـ 15 سنة من الآن .<br />و لذلك فإن الكنيسة تحرم تحريمًا تامًا تحديد النسل أو تنظيمه ، و تعد كل من يفعل ذلك خارجًـا عن تعليمات الكنيسة ، و مطرودًا من رحمة الرب، و قاتلاً لشعب الكنيسة ، و مضيعًـا لمجده، و ذلك باستثناء الحالات التي يقرر فيها الطب و الكنيسة خطر الحمل أو الولادة على حياة المرأة ، و قد اتخذت الكنيسة عدة ق<br />اقرأ بقية التعليق .."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705081559/http://masr.20at.com:80/article.php?sid=592"

[[comments]]
order = 3
subject = "هو ده شنودة"
author = "واحد عارف النصاري عايزين ايه"
posted = "2006-07-03"
text = "طبعاً ده مش معناه ان النصاري كلهم متأمرين وعايزن للمسلمين الضرر, انا بس عايز أقول لكل المسلمين خدوا بالكوا وانتوا بتتعاملوا مع غير دينك, وموضوع أقباط ده عايز اوضح التالي:فالنصاري (كما ذكر إسمهم في القران) المصريين أو المسيحيين (كما نسميهم) بدؤوا الفترة الأخيرة في الترويج بطريقة لافتة للنظر لكلمة (أقباط) في حين أنها تعني مصري و ليس معناها مسيحي و عرفت السبب في ندوة أقيمت في الجامعة الأمريكيه في القاهرة حيث قامت مسيحية لتوصل رساله إلي الجميع بأن سكان مصر الأصليون هم الأقباط وليس المسلمين .... ولكنني أوؤكد الصواب أن الأقباط هم كل من كان يسكن مصر وقت الفتح الإسلامي أي أن قبطي تعني الجنسية المصرية وقتها...ثم جاء الفتح الإسلامي و أسلم معظم المصريون .. إذن فالمسلمون الحاليون هم أبناء أقباط مصر النصاري واللذين أسلموا فأصبحوا أقباط مسلمين.. لم أكن أحب لفظ قبطي لإرتباطه في عقلي الباطن بالنصاري ولكن لما علمت حقيقة الأمر أخذت عهدا علي نفسي أن أنشر هه الكلمة في كل موضع حتي لا يجيئ اليوم الذي يفاجئنا فيه النصاري بأن مصر بلدهم وأننا المسلميين غزاة سرقنا منهم بلدهم.. وهذا هو ما بدا `مسيحيو المهجر` ( أقباط المهجر) في الترويج له الأن ... وربنا يستر علي مصر من الفتن.. ليس معني كلامي العنصرية نحوهم ولكني أنتهج مبدأالولاء والبراء كما أمرني ديني فأنا أعامله جيدا وبود وإحترام ولكن لا أحبه ... وذلك مبدأالتعايش في الإسلام دين السماحه"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705081559/http://masr.20at.com:80/article.php?sid=592"

[[comments]]
order = 4
subject = "سيدنا قداسة البابا شنودة التالت بابا الاسكندرية وبطريرك الكرازة المرقس"
author = "رامى فواد"
posted = "2006-07-04"
text = "اولا ياعزيزى اسمة ليست شنودة اسمة قداسة البابا شنودة الثالث بابا الاسكندرية وبطريرك الكرازة المرقسية خليفة القديس مرقس الانجيلى ابا الابا راعى الرعا رئيس اساقفة المدينة العظمى الاسكندرية والخمسة المدن الغربية وبلاد الشرق والمهجر واثوبيا والنوبة والسودان تفتكر اقولك اية تانى والاهم من كدة بنموت فية وكل من يقراء هذا يدعو لة بالرجوع بالسلامة من سفرة معلومة احب اضيفها احنا من مصر وبنحب مصر والمسيحى اللى ميحبش كل الناس ميعرفش دينة المسيح قال اى فضل لكم ان كنتم تحبون اللذين يحبونكم بل احبو اعدائكم باركو لاعنيكم احسنو ا الى اللذين يسئون اليكم وياعزيزى انت مين انت مين حتى تتكلم عن البابا شنودة دور فى التاريخ ابحث فى جوجل غنى غنى غنى عن التعرف التاريخ قال كلمتة ومين هو البابا لا يوجد عقل ولا حكمة افضل فى الكرة الارضية من حكمة البابا شنودة وحنكة فى التصرفات"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705081559/http://masr.20at.com:80/article.php?sid=592"

[[comments]]
order = 5
subject = "شنودة بالنسبة ليا بابا بالنسبة ليك"
author = "واحد عارف النصاري عايزين ايه"
posted = "2006-07-04"
text = "مع احترامي الشديد ليك كل ما تقوله لا يعني لي شيئا, دائما تتحدثون عن كرامات ومعجزات (البابا) شنودة اتمني ان نسمع او نري اياً منها,ومن كلامك باين ان فيه مسح عقل معمولك يعني ايه يعني مفيش في الكرة الارضية عقل زيه يا عزيزي فكر في الكلام الاول,لا شفنا منه اختراعات ولا شفنا حاجات غيرت مجري البشرية علشان يستحق الكلام ده, انا لست مهاجماً."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705081559/http://masr.20at.com:80/article.php?sid=592"

[[comments]]
order = 6
subject = "مش حرب"
author = "شخص مسلم"
posted = "2006-07-04"
text = "احنا مش في حرب يا جماعة فتن كثيرة تحدث بين المسيحين وبعض وايضا بين المسلمين وبعض وبين المسلمين والمسيحيين مين اللي عمل كل دا اولا احب اصحح مفهوم الاخوة الاقباط احنا مش في حرب معاكو ولا هي مسابقة في النسل انما هو العمل الصالح والهدي هو مايفرق بين المرء والاخر واذا كان البابا شنودة عليه انشقاق فاحنا مش فرحانين فيكوا ولا غرضنا انكو تخرجوا من مصر كما تعتقدون انما من بدا موجة الاستفزاز هي المسرحية التي عرضتموها واذا كان الدين الاسلامي لا يجرح في الدين المسيحي ويؤمن بالمسيح نبيا فلماذا تجرحون فينا لا اقصد ان كل الاقباط يفعلون ولكن هناك من له بعض المصالح الخارجية في هذه الفتن فانا ادعوا المسلمين والاقباط للانتباه لهذه الفتن واخر كلامي<br />بسم الله الرحمن الرحيم<br />امن الرسول بما انزل اليه من ربه والمؤمنون كل امن بالله ووملئكته وكتبه ورسله لا نفرق بين احد من رسله وقالوا سمعنا واطعنا غفرانك ربنا واليك المصير"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705081559/http://masr.20at.com:80/article.php?sid=592"

[[comments]]
