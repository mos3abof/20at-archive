subject = "تساؤل"
author = "رنا"
posted = "2006-07-04"
text = "امبارح البيت بيتك اتصل بمرقص عزيز (انا مش فاكرة منصبة اية بس هو مع البابا شنودة) كان رافض رفض تام انة يقابل او حتى يجلس للحوار مع ماكسيموس تماما و هنا سؤالى لية التعصب الشديد دة مش احسن يلموا الموضوع بدل ما يخرج عن السيطرة. ما مصر قعدت مع اسرائيل و فلسطين بتقعد مع اسرائيل بردة بالرغم اننا لا بنحبها. دة مجرد تساؤل."
