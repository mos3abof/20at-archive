[[comments]]
order = 3
subject = "نقلا عن اسلام اون لاين"
text = "أسباب العنوسة في المجتمعات العربية<br />أولا أسباب الاجتماعية:<br />تتمثل في:<br />غياب المفهوم الصحيح للزواج كسكن ومودة ورحمة.. قبل أن يكون شكليات ومظاهر.<br />غياب دور الأسرة في توعية أبنائها، وتربيتهم على تحمل المسئولية، وتفهم معنى الزواج، وإعداد أبنائها وبناتها للقيام بهذا الدور.<br />ياب دور المؤسسات الاجتماعية والهيئات غير الحكومية في محاولة إيجاد حلول عملية واقعية تتناسب مع كل بيئة ومجتمع في مجتمعاتنا.<br />الاستسلام والانسياق وراء ما يبثه الإعلام من مفاهيم مغلوطة عن الأسرة والزواج ومتطلباته.<br />ثانيا أسباب الاقتصادية:<br />وهي نوعان:<br />واقعي وحقيقي: يتمثل في الارتفاع الفعلي في تكاليف الزواج خاصة مع ازدياد معدلات البطالة، وعدم وجود فرص عمل حقيقية أمام الشباب، وانخفاض مستوى الدخل خاصة في الدول غير النفطية.<br />نوع صنعناه نحن بأنفسنا، ثم فرضناه كأمر واقع.. وهو المغالاة في الجهود واستعدادات الزواج؛ حيث غابت فكرة الأسرة التي تبدأ بحياة بسيطة، ثم تنمو تدريجيًا، وتستكمل كل ما ينقص من أساسيات وكماليات مع النمو الطبيعي لدخل الأسرة، ومع مفهوم جميل غاب عنا وهو الصبر واليقين بالله تعالى، وحل محلها مفهوم جديد، وهو البيت الذي يبدأ مستكملاً كل أساسيات وكماليات الحياة العصرية، والغريب أن هذا النوع في المشاكل الاقتصادية يكاد يكون ممثلا بدرجة متساوية في الدول الغنية والدول الفقيرة، وكأننا لم نسمع عن مثل شعبي حكيم يقول: \"على قدر لحافك مد رجليك\".<br />ثالثا أسباب سياسية:<br />يث إن القيادات السياسية في بلادنا لم تأخذ الأمر بجدية، ولم تشعر بحجم المشكلة أو تأثيرها السلبي على المجتمع، وربما توارت المشكلة خلف ركام من المشاكل السياسية الأخرى، وهذا أدى إلى غياب دور أساسي كانت الجولة منوطة به، ويشمل توفير فرص عمل حقيقية للشباب، وتيسير المشروعات الصغيرة، وتشجيع الشباب المقبل على الزواج المبكر بشقة بأسعار مناسبة ومشاريع توفر لهم احتياجاتهم في حدود طاقاتهم.<br />ما غاب دور الدولة في تشجيع الزواج المبكر والدفع في هذا الاتجاه إلا في بعض الدول التي استشعرت خطورة الأزمة مثل الإمارات والكويت؛ وذلك بإنشاء صندوق الزواج. أما بقية الدول فبالعكس أحيانًا يكون هناك اتجاه لرفع سن الزواج.<br />إن ما وصل إليه حالنا كدول عربية وإسلامية من غياب للقيمة والهدف من حياتنا وحالة الإحباط العامة التي تسود بلادنا جميعًا والخوف دائمًا مما سيحدث غدًا لا بد أن يكون سببًا غير مباشر في عزوف الشباب عن الزواج، وعدم تحمسهم لبدء حياة جديدة كلها أمل وتفاؤل.<br />رابعا أسباب تربوية:<br />حيث إن الدراسة بالمدارس تجعل الفتى والفتاة حتى دخول الجامعة ليس لهم همّ إلا النجاح والحصول على أعلى الدرجات، ثم فجأة يجدون أنفسهم في مواجهة الحياة، وقد خلت كل المناهج الدراسية مما يساعد الفتاة على أن تكون زوجة وأما وربة أسرة، لم يحدثها أحد عن معنى الزواج وتبعاته، وكذلك الفتى لم يتعلم معنى المسؤولية، ومعنى أن يكون رب أسرة، ومعنى الرجولة.. حتى معنى السعي وتكسب الرزق الحلال غاب عن شبابنا.<br />خامسا أسباب ثقافية وفكرية:<br />حيث إن كل ما يساهم في بناء وصياغة فكر وعقل المجتمع إما تجاهل المشكلة تمامًا، أو على العكس كان سببًا في تفاقمها، سواء كانت وسائل الإعلام خاصة التليفزيون والصحف والمجلات أو الكتاب والمفكرين، أو كما ذكرنا طريقة التربية في المدارس وفي داخل الأسرة نفسها. ولكن أعجب مَن تجاهل المشكلة هم رجال الدين والفقهاء.. فكيف تخلو الخطب والدروس الدينية من تناول للظاهرة وأسبابها وطرق العلاج، بالرغم من أننا كشعوب إسلامية عندما تتضح أمامنا الأبعاد الدينية للمشكلة تختلف طريقة تعاملنا معها؟<br />الواقع أن غياب البعد الديني ساهم كثيرا في تفاقم المشكلة، وأعني هنا النظرة الدينية الواعية التي تهتم بدراسة الأرقام والإحصاءات وكل ما يعتري المجتمع الآن من تغيرات واتجاهات، وليست مجرد مجموعة من الفتاوى المتفرقة الجامدة التي لا تتفاعل مع المجتمع.<br />سادسا أسباب نفسية:<br />وهذه جاءت نتيجة لتفاعل كل الأسباب السابقة.. فمنذ 20 سنة كانت كل الأفلام -التي كما هي عامل مؤثر في ثقافة الشعوب هي أيضا نافذة تعبر عما يجري داخل هذا المجتمع- تعبر عن قصص النجاح والحب الذي يتحدى العقبات وينتصر، الشاب والفتاة اللذين يحلمان بأن يبدآ حياتهم بأبسط الإمكانات ليكبرا مع الأيام. أما اليوم فهذا الجيل منهزم من داخله لم يحاول أن يتحدى العقبات ويهزمها، ولكنه هرب من المواجهة؛ فالخوف من المستقبل وعدم تحمل المسؤولية والتمسك بل التقيد بكل أسباب الرفاهية والكماليات.. كل هذا هزم روح التحدي داخلنا، وكأن ك<br />Read the rest of this comment..."
archived = "2004-09-23"
capture_url = "https://web.archive.org/web/20040923022418/http://www.20at.com:80/article.php?sid=627"

