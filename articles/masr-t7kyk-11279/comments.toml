author = "هو فية اية"
posted = "2009-02-13"
text = "معروف انة شرعا بعد كل لقاء جنسى فيه استحمام للطهارة<br />هو الرجالة قرفانة من نسوانها والا اية قصد المحافظ<br />انا اقترح علية ان يوزع حبوب فياجرا على الرجال وبعدين العملية تنشط وبعدين الناس تستحمى<br />ثم يا سيادة المحافظ المبجل<br />معروف ان شركة انتاج المياة فى الغردقة هى شركة قطاع قطاع خاص تتبع الوليد بن طلال وبيبيع المياة للمحافظة بالمتر وبيكسب ملايين<br />وعلى حسب علمى ان انتاج جالون المياة تحلية من مياة البحر بيتكلف 10 قروش وبيبيعة للمحافظة بالشىء الفلانى<br />سيادة المحافظ ان بتسوق المياة للوليد بن طلال<br />مصلحتك اية<br />ليك عمولة قد اية<br />عايز الناس تستهلك مية كتير لية"
archived = "2009-11-01"
capture_url = "https://web.archive.org/web/20091101113400/http://20at.com:80/masr/t7kyk/11279.html"

