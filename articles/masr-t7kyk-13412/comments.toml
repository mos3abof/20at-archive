author = "مفروس من رغداء بندق"
posted = "2009-09-11"
text = "يا رغداء بندق الكلام اللي انتي بتقوليه على ال[ *** ]ان دا ايام ستي وستك ايام الرخص يعني دلوقتي يا ماما البنات بيتجوزوا بالتيله يا دوب العريس كده بيجي ملصم اوي علشان خاطر يتجوز<br />التريقه على ال[ *** ]ان دي كان زمان ايام الرخص<br />ايام الملك فاروق<br />لكن احنا هنا في عهد ما بعد الثورة<br />الثورة قضت على الاخضر واليابس<br />وعهد ما بعد الثورة قضى ما بعد الاخضر واليابس<br />العريس دلوقتي بقا قانون جديد هو وشقته قانون جديد<br />على اد حاله<br />ننوس عين امه<br />مش عارف ايه<br />بس يجي<br />احسن من العنوسه"
archived = "2009-09-14"
capture_url = "https://web.archive.org/web/20090914134702/http://www.20at.com:80/masr/t7kyk/13412-2009-09-10-08-10-55.html"
