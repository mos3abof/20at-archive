text = "كله تمام يل فندم وما فيش أحسن من كده<br />اللهم انتقم من الموالسين والمنافقين ومساحي الجوخ<br />لكل حكم صالح منتخب أخطاؤه فما بالكم بمن أخذوها بالدراع"
archived = "2006-09-08"
