subject = "نفاااااااااااااق"
author = "مصرية"
posted = "2006-05-06"
text = "المنافقين الذين يسخروااقلامهم للسلطة اول من سيسقط معها باذن الله وحتكونوا شلة واحدة فى مذبلة التاريخ تاريخطم الاسود اللى زى اعمالكم ربنا يعجل بهذااليوم اللهم اجعلها آخر الاحزااااااااااان"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908064423/http://masr.20at.com:80/article.php?sid=265&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "ارجوزات النظام"
author = "فريد"
posted = "2006-05-08"
text = "لا اقف كثيرا عندما اقرء بعض مقالات من اقلام النظام المصري فهم عبارة عن الاراجوزت الذي يسخرهم مولاه لخدمته<br />والضحك به علي عامة الشعب,<br />فهم ايضالا يختلفوا كثيرا عن كلاب النظام وهم امن الدولة"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908064423/http://masr.20at.com:80/article.php?sid=265&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

