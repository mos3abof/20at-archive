subject = "فعلا"
author = "عابر القارات"
posted = "2006-05-03"
text = "لا أحد ينكر أن مصر بالفعل حققت بعض ما يسمى الانجازات الهامشية و لكن للاسف فهى كنملة تحفر جبلا فضاعت النملة و بقى الجبل كذلك هو الانجاز و الفساد"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908064423/http://masr.20at.com:80/article.php?sid=265&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "أتكسفوا بقى"
author = "بن الكفر"
posted = "2006-05-03"
text = "هي العالم بتاعت النفاق دي بقى مش عايزة تخلص معدوش بيتكسفوا يا اتكسفو بقى الله يولع فيكم كلكم وانتم مفيش عندكم دم"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908064423/http://masr.20at.com:80/article.php?sid=265&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
