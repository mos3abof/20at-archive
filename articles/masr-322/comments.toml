subject = "إتأخرت كتييييير .....كان من بدرى يا مصريين"
author = "لو لم أكن مصريا..................لشكرت الله"
posted = "2006-05-14"
text = "إتأخرت كتييييير .....كان من بدرى يا مصريين<br />كويس ان المصريين اللى مستريحين من القرف اللى احنا فية لسة فاكرين ان ليهم اخوات مظلومين ما عرفوش يهربوا من القهر و الظلم و البلطجة<br />بس يا ريت تكون بداية لسلسلة من المظاهرات التى تستقبلالريس و ولادة و حرمة و حكومتة فى كل مكان يخطوة فى أوربا و أمريكا<br />نعم لشعب حر.....نعم شعب مصر<br />لا للدستور......لا لحكم بنى عسكر"
