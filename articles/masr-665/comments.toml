[[comments]]
order = 0
subject = "هو لابيه"
author = "طارق حسن"
posted = "2006-07-17"
text = "وما هند الا فرسه عربيه ابنه افراس<br />تحللها بغل<br />فان ولدت مهرا فالله لها<br />وان ولدت بغلا فهو لابيه"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720024655/http://masr.20at.com:80/article.php?sid=665"

[[comments]]
order = 1
subject = "اللى على راسه"
author = "عباس الابيض"
posted = "2006-07-18"
text = "منعوا المسرحية بتاعة \"بلاد فى المزاد\" لأن اللى على راسه بطحه بيحسس عليها مع إن المسرحية بتتكلم على بلد فى القطب الجنوبى يعنى بعيدة عن مصر خالص لكن تقول إيه الخفافيش خافوا ليكون الكلام عليهم"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720024655/http://masr.20at.com:80/article.php?sid=665"

[[comments]]
order = 2
subject = "عندهم حق"
author = "مصري متغرب"
posted = "2006-07-18"
text = "عندهم حق يرفضوا المسرحية لسبب بسيط جدا وهو أنهم أكتشغوا أن هناك أماكن لم يتم بيعها ...."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720024655/http://masr.20at.com:80/article.php?sid=665"

[[comments]]
order = 3
subject = "أصلهم ... ماهمش أصل"
author = "عباس الابيض ملك البودرة"
posted = "2006-07-18"
text = "هما ما عرضوش المرسحية لأنهم إكتشفوا إن المسرح إتباع أصلا"
archived = "2006-07-20"
