[[comments]]
order = 6
subject = "علموهم الادب مع رسول الله و اتباعه"
author = "elias ben ali"
posted = "2006-02-22"
text = "بسم الله الرحمن الرحيم،السلام عليكم ورحمةالله،<br />أما بعد: فإليكم يا من آمن بمحمد، و إليكم يا من أحب محمد صلى الله عليه و سلم، إذا سب أحد أباك فما أنت بفاعل؟ أو سبك على مرأى و مسمع العالمين؟ لا شك تغضب و تثأر لنفسك، و إن استدعى الأمر إزهاق روحك. فما بالك بسب من هو أعظم شأنا و قدرا من أبي و أبيك؟ بل من نفسي ومن نفسك! و الشافعي رحمه الله يقول: من استغضب و لم يغضب فهو حــــــــــــــــــــــمــــــــــــــــار، فهل أنت حمار؟!!<br />قاطع منتوجاتهم قطعهم الله، و اعلم أخي أختي أن أول منتوج صهيوني وصل إلينا هم القادة و الحكام، ما حكموا بما أنزل الله. بل سجدوا لأمريكا بسجدتي السهو القبلية و البعدية!! و نصبوا أنفسهم أصنام على المنابر تعبد من دون الله، فإليك يا رب أشكو غربتي بين إخوتي، و إليك يا الله أشكو كربتي و وحدتي بين أحبتي. و السلام على من اتبع الهدى."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125801/http://www.20at.com/article2.php?sid=482"

