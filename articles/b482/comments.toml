[[comments]]
order = 1
subject = "انتي وجعتي قلبي والله"
author = "sweet_princess"
posted = "2006-02-22"
text = "ايه يابنتي انتي باعته التعليق مرتين عشان تاكدي على حبك وتايبيدك لكنتاكي وامريكا (غريبه )<br />انا اول مره اشوف واحده زعلانه انها هتقاطع مطاعم زي دي مع انك بكل جنيه بيدفعيه بتساهمي في وصول ملايين المساعدات الامريكيه لاسرائيل من اسلحه وفلوس<br />دا بدال ماتقولي يارب دايما يتخرب بيت المطاعم اللي من النوع دا هي وماكدونالد انشاء الله (واللي مايعرفش ماكدونالد دا كمان عامل زي كنتاكي كده بس هو اصله من انجلترا )<br />دي تبقى كارثه لو الشباب كلهم رايهم كده وده بيقى ابسط دليل ان امريكاهي واللي زيها ملكونا فعلا لان سياستهم اللي بيتحكم فيها اليهود اللي طبعا بياخدوا الكلام دا كله من برتوكولات حكماء صهيون وجزء منها بيقول اهم شئ عشان تاثر على دوله او امه يبقى لازم تضيع شبابها عن طريق انهم يملكو فينا حاجتين العقل والبطن<br />العقل عن طريق التلفزيون والقنوات اللي مابقيناش ملاحقين عليهاوالافكار اللي بيزرعوها في دماغنا نانسي وزفت حتى لو حصلت كارثه لازم يصرفو نظرنا عن الجزء المهم وييجو في الهايفه ويعملوها قضيه واللي هيجنني الاصرار الغريب على انهم يدخلو في عقلنا دايما ان المجاهدين اللي في فلسطين دول ارهابيين ومالهمش حق في اللي بيعملوه في المستوطين الغلابهواي عمليه استشهاديه تتعمل لازم يتقال انها انتحاريه ويجيبلك بقى الناس اللي اتصابت واهاليهم بيعيطو وحالتهم صعبه وحاجه تقطع القلب لكن يجيبو اهل شهيد فلسطيني او ام شافت ابنها بيموت قدامها لاءطبعا<br />اما البطن بقى يملوها مالذ طاب من اكل اصلا احنا مش عارفين اساسه ايه (لحمة خنزير وفراخ ميته وحتى لو مش ميته نعرف منين دي كانت بتاكل ايه ولا مدبوحه ع الشريعه الاسلاميه ولا لاء وهما خلاص علرفين انهم طالما ملكو فينا الحاجتين دول بيقى خلاص مش هتقوم لنا قومه تاني<br />فوقو ياشباب الله يخليكو ماتخلوناش في ذيل الامم كده<br />لكن هقول ايه ربنا يهديكي انتي واللي بيفكرو بالشكل دا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125801/http://www.20at.com/article2.php?sid=482"

