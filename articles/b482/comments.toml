[[comments]]
order = 15
subject = "محمود درويش وصل يا جدعان"
author = "أكرم"
posted = "2006-02-24"
text = "يطير الحمام<br />( محمود درويش )<br />يطيرُ الحمامُ<br />يَحُطُّ الحمامُ<br />- أعدِّي لِيَ الأرضَ كي أستريحَ<br />فإني أُحبُّكِ حتى التَعَبْ...<br />صباحك فاكهةٌ للأغاني<br />وهذا المساءُ ذَهَبْ<br />ونحن لنا حين يدخل ظِلٌّ إلى ظِلِّه في الرخامِ<br />وأُشْبِهُ نَفْسِيَ حين أُعلِّقُ نفسي<br />على عُنُقٍ لا تُعَانِقُ غَيرَ الغَمامِ<br />وأنتِ الهواءُ الذي يتعرَّى أمامي كدمع العِنَبْ<br />وأنت بدايةُ عائلة الموج حين تَشَبَّثَ بالبرِّ<br />حين اغتربْ<br />وإني أُحبُّكِ، أنتِ بدايةُ روحي، وأنت الختامُ<br />يطير الحمامُ<br />يَحُطُّ الحمامُ<br />أنا وحبيبيَ صوتان في شَفَةٍ واحدهْ<br />أنا لحبيبي أنا. وحبيبي لنجمته الشاردهْ<br />وندخل في الحُلْمِ، لكنَّهُ يَتَبَاطَأُ كي لا نراهُ<br />وحين ينامُ حبيبيَ أصحو لكي أحرس الحُلْمَ مما يراهُ<br />وأطردُ عنه الليالي التي عبرتْ قبل أن نلتقي<br />وأختارُ أيَّامنا بيديّ<br />كما اختار لي وردةَ المائدهْ<br />فَنَمْ يا حبيبي<br />ليصعد صوتُ البحار إلى ركبتيّ<br />وَنَمْ يا حبيبي<br />لأهبط فيك وأُنقذَ حُلْمَكَ من شوكةٍ حاسدهْ<br />وَنَمْ يا حبيبي<br />عليكَ ضفائر شعري، عليك السلامُ<br />يطيرُ الحمامُ<br />يَحُطُّ الحمامُ<br />- رأيتُ على البحر إبريلَ<br />قلتُ: نسيتِ انتباه يديكِ<br />نسيتِ التراتيلَ فوق جروحي<br />فَكَمْ مَرَّةً تستطيعينَ أن تُولَدي في منامي<br />وَكَمْ مَرَّةً تستطيعين أن تقتليني لأصْرُخَ: إني أحبُّكِ<br />كي تستريحي?<br />أناديكِ قبل الكلامِ<br />أطير بخصركِ قبل وصولي إليكِ<br />فكم مَرَّةً تستطيعين أن تَضَعِي في مناقير هذا الحمامِ<br />عناوينَ روحي<br />وأن تختفي كالمدى في السفوحِ<br />لأدرك أنَّكِ بابلُ، مصرُ، وشامُ<br />يطير الحمامُ<br />يَحُطُّ الحمامُ<br />إلى أين تأخذني يا حبيبيَ من والديَّ<br />ومن شجري، من سريري الصغير ومن ضجري،<br />من مرايايَ من قمري، من خزانة عمري ومن سهري،<br />من ثيابي ومن خَفَري?<br />إلى أين تأخذني يا حبيبي إلى أين<br />تُشعل في أُذنيَّ البراري، تُحَمِّلُني موجتين<br />وتكسر ضلعين، تشربني ثم توقدني، ثم<br />تتركني في طريق الهواء إليك<br />حرامٌ... حرامُ<br />يطير الحمامُ<br />يَحُطُّ الحمامُ<br />- لأني أحبكِ، خاصرتي نازفهْ<br />وأركضُ من وَجَعِي في ليالٍ يُوَسِّعها الخوفُ مما أخافُ<br />تعالى كثيرًا، وغيبي قليلاً<br />تعالى قليلاً، وغيبي كثيرًا<br />تعالى تعالى ولا تقفي، آه من خطوةٍ واقفهْ<br />أُحبُّكِ إذْ أشتهيكِ. أُحبُّكِ إذْ أشتهيك<br />وأحضُنُ هذا الشعاعَ المطوَّقَ بالنحل والوردة الخاطفهْ<br />أحبك يا لعنة العاطفهْ<br />أخاف على القلب منك، أخاف على شهوتي أن تَصِلْ<br />أُحبُّكِ إذْ أشتهيكِ<br />أحبك يا جسدًا يخلق الذكريات ويقتلها قبل أن تكتملْ<br />أحبك إذْ أشتهيكِ<br />أُطوِّع روحي على هيئة القدمين - على هيئة الجنَّتين<br />أحكُّ جروحي بأطراف صمتك.. والعاصفهْ<br />أموتُ، ليجلس فوق يديكِ الكلامُ<br />يطير الحمامُ<br />يَحُطُّ الحمامُ<br />لأني أُحبُّك (يجرحني الماءُ)<br />والطرقاتُ إلى البحر تجرحني<br />والفراشةُ تجرحني<br />وأذانُ النهار على ضوء زنديك يجرحني<br />يا حبيبي، أناديكَ طيلة نومي، أخاف انتباه الكلام<br />أخاف انتباه الكلام إلى نحلة بين فخذيَّ تبكي<br />لأني أحبُّك يجرحني الظلُّ تحت المصابيح، يجرحني<br />طائرٌ في السماء البعيدة، عِطْرُ البنفسج يجرحني<br />أوَّلُ البحر يجرحني<br />آخِرُ البحر يجرحني<br />ليتني لا أُحبُّكَ<br />يا ليتني لا أُحبُّ<br />ليشفى الرخامُ<br />يطير الحمامُ<br />يَحُطُّ الحمامُ<br />- أراكِ، فأنجو من الموت. جسمُكِ مرفأْ<br />بعشرِ زنابقَ بيضاء، عشر أناملَ تمضي السماءُ<br />إلى أزرقٍ ضاع منها<br />وأُمْسِكُ هذا البهاء الرخاميَّ، أُمسكُ رائحةً للحليب المُخبَّأْ<br />في خوختين على مرمر، ثم أعبد مَنْ يمنح البرَّ والبحر ملجأْ<br />على ضفَّة الملح والعسل الأوَّلين، سأشرب خَرُّوبَ لَيْلِكِ<br />ثم أنامُ<br />على حنطةٍ تكسر الحقل، تكسر حتى الشهيق فيصدأْ<br />أراك، فأنجو من الموت. جسمك مرفأْ<br />فكيف تُشَرِّدني الأرضُ في الأرض<br />كيف ينامُ المنامُ<br />يطير الحمامُ<br />يَحُطُّ الحمامُ<br />حبيبي، أخَافُ سكوتَ يديكْ<br />فَحُكَّ دمي كي تنام الفرسْ<br />حبيبي، تطيرُ إناثُ الطيور إليكْ<br />فخذني أنا زوجةً أو نَفَسْ<br />حبيبي، سأبقي ليكبر فُستُقُ صدري لديكْ<br />ويجتثُّني مِنْ خُطَاك الحَرَسْ<br />حبيبي، سأبكي عليكَ عليكَ عليكْ<br />لأنك سطحُ سمائي<br />وجسميَ أرضُكَ في الأرضِ<br />جسمي مقَامُ<br />يطير الحمامُ<br />يَحُطُّ الحمامُ<br />رأيتُ على الجسر أندلُسَ الحبّ والحاسَّة السادسهْ.<br />على وردة يابسهْ<br />أعاد لها قلبَها<br />وقال: يكلفني الحُبُّ ما لا أُحبُّ<br />يكلفني حُبَّها.<br />ونام القمرْ<br />على خاتم ينكسرْ<br />وطار الحمامُ<br />رأيتُ على الجسر أندلُسَ الحب والحاسَّة السادسهْ.<br />على دمعةٍ يائسهْ<br />أعادتْ له قلبَهُ<br />وقالت: يكلفني الحبُّ ما لا أُحبُّ<br />يكلفني حُبَّهُ<br />ونام القمر<br />على خاتم ينكسرْ<br />وطار الحمامُ.<br />وحطّ على الجسر والعاشِقيْنِ الظلامُ<br />يطير الحمامُ<br />يطير الحمامُ"
