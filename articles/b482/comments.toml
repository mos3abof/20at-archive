[[comments]]
order = 3
subject = "شكرا لانفلونزا الطيور"
author = "نيفين"
posted = "2006-02-22"
text = "يلدا سلام بجد شكرا لانفلمنزا الطيور التى حققت انجازات على المستوى الصحى و القومى و الوطنى و التليفزيونى و هى:<br />1_خلت الناس اللى لسه نايمه ف العسل و بتروح كنتاكى و مش بتقاطع كاننا بندن ف مالطه نبطل تروح<br />2_ساعدت دكاتره اليجيم و الناس اللى نفسها تعمل دايت<br />3_ساعدتنا فى عمل ترشيد استهلاك مليون وزاره عدت على البلد معملتهاش<br />4_و ده الاهم ريحت عنينا من الوشوش الغبيه اللى كنا بنشوفها ف نشرات الاخبار<br />و خلت الفراخ نجوم النشرات<br />طيب و الله الفراخ اتصيتت يا جماعه<br />افتحو الجزيره هتلاقو الفراخ منوره على الشاشه<br />مش بعيد نلاقى الفراخ نجوم اعلانات و سينما و نبقى اول دوله تعمل سينما الفراخ<br />و يكون باكوره انتاجها فيلم ادبحنى يا معلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125801/http://www.20at.com/article2.php?sid=482"

