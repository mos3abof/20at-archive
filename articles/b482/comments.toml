[[comments]]
order = 8
subject = "قصيدة الطيور لأمل دنقل"
author = "أكرم"
posted = "2006-02-22"
text = "انا عارف ان محدش هيقرا التعليق ده بس اللي مش هيقرا القصيدة دي هيخسر كتير و اللي هيقراها و مش هيفهما هيخسر اكتر عشان كده انا بهديها الى نيفين بس<br />الطيور<br />.. امل دنقل<br />(1)<br />الطيورُ مُشردةٌ في السَّموات,<br />ليسَ لها أن تحطَّ على الأرضِ,<br />ليسَ لها غيرَ أن تتقاذفَها فلواتُ الرّياح!<br />ربما تتنزلُ..<br />كي تَستريحَ دقائقَ..<br />فوق النخيلِ - النجيلِ - التماثيلِ -<br />أعمِدةِ الكهرباء -<br />حوافِ الشبابيكِ والمشربيَّاتِ<br />والأَسْطحِ الخرَسانية.<br />(اهدأ, ليلتقطَ القلبُ تنهيدةً,<br />والفمُ العذبُ تغريدةً<br />والقطِ الرزق..)<br />سُرعانَ ما تتفزّعُ..<br />من نقلةِ الرِّجْل,<br />من نبلةِ الطّفلِ,<br />من ميلةِ الظلُّ عبرَ الحوائط,<br />من حَصوات الصَّياح!)<br />الطيورُ معلّقةٌ في السموات<br />ما بين أنسجةِ العَنكبوتِ الفَضائيِّ: للريح<br />مرشوقةٌ في امتدادِ السِّهام المُضيئةِ<br />للشمس,<br />(رفرفْ..<br />فليسَ أمامَك -<br />والبشرُ المستبيحونَ والمستباحونَ: صاحون -<br />ليس أمامك غيرُ الفرارْ..<br />الفرارُ الذي يتجدّد. كُلَّ صباح!)<br />(2)<br />والطيورُ التي أقعدتْها مخالَطةُ الناس,<br />مرتْ طمأنينةُ العَيشِ فَوقَ مناسِرِها..<br />فانتخَتْ,<br />وبأعينِها.. فارتخَتْ,<br />وارتضتْ أن تُقأقَىَء حولَ الطَّعامِ المتاحْ<br />ما الذي يَتَبقي لهَا.. غيرُ سَكينةِ الذَّبح,<br />غيرُ انتظارِ النهايه.<br />إن اليدَ الآدميةَ.. واهبةَ القمح<br />تعرفُ كيفَ تَسنُّ السِّلاح!<br />(3)<br />الطيورُ.. الطيورْ<br />تحتوي الأرضُ جُثمانَها.. في السُّقوطِ الأخيرْ!<br />والطُّيُورُ التي لا تَطيرْ..<br />طوتِ الريشَ, واستَسلَمتْ<br />هل تُرى علِمتْ<br />أن عُمرَ الجنَاحِ قصيرٌ.. قصيرْ?!<br />الجناحُ حَياة<br />والجناحُ رَدى.<br />والجناحُ نجاة.<br />والجناحُ.. سُدى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125801/http://www.20at.com/article2.php?sid=482"

