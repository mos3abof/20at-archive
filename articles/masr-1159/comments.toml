subject = "لقد ظهرت حقيقتكم"
author = "قاسم"
posted = "2006-11-14"
text = "كنت اشك فى حقيقة هذا الموقع ، حتى تأكدت تماما بعد هذا المقال من طبيعة القائمين على هذا الموقع ، فرائحة الكره والبغض للاسلام واضحة تماما ، والكراهية للمسلمين واضحة وضوح الشمس ، حتى اسم الموقع يشير الى تلك المجموعة الحاقدة على الاسلام والمسلمين والتى ترى فى نفسها انها ابناء البلد وان المسلمين غزاة من الصحراء ، يجب ان يعودوا من حيث اتوا .<br />اتمنى ان تكونوا اكثر شجاعة وتعلنوا حقيقتكم يا ولاد ..........."
