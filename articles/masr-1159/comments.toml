[[comments]]
order = 1
subject = "الحمد الله اخيرا"
author = "سيكو"
posted = "2006-11-13"
text = "اولا وقبل اى شىء اخر احيييي الكاتب العظيم على هذا الخبر الذى كنت انتظره من زمان<br />ثانيا اولا ياجماعه كريم ده انسان ليس بكامل قواه العقليه فهو انسان متخلف بمعنى كلمه متخلف<br />فى بدايه ظهوره على الساحه الاعلاميه (الشبكه الحقيره دى) قريت ليه كتير فى موقعى المفضل<br />الموقع الى بكتب فيه موقع الحوار المتمدن ضفته عندى واتكلمنا نت واخدت رقم موبايله وفضلنا<br />نتكلم اكتر من ساعه لما خرب بيت ابويا ( وش مبتسم ) حسيت من كلامه معايا ومن اسئلتى ليه انه<br />فعلا ولد مسلم لكن برغم الظروف الى هو عايش فيها والى بيامل ان الاقباط يسفروه اى دوله اوربيه<br />والى كان (بيحوم) عليه كريم فعلا هو ده كريم تهجم على الاسلام وتهجم على علماء الازهر الشريف<br />ويمكن علشان انا ليبرالى مثله كنت متفق معاه فى بعض النقاط ولكن بعيد عن التهجم على دينا الحنيف<br />باختصار كريم يستحق المحاكمه من زمان جدا وانا اعتقد يعنى على حد خبرتى بالاعتقالات الى مريت بيها<br />ان كريم هيتحكم عليه بسبع سنوات من الشغل وهيتقدم لمحاكمه امن الدوله طوارء لان بعض التهم المنسوبه اليه<br />تخص محكمه امن الدوله طوارء فا باعتقادى كريم هيشرف ان شاء الرحمن فى لومان سجن طره او لومان وادى<br />النظرون سبع سنين يقضيهم فى عرق العافيه ويبقى يخلى الاقباط ينفعوه ابئا خلى ابراهيم القبطى ينفعك ياكوكو<br />وابئا خلى المحامى الفاشل بتاعك الى هو قبطى يطلعك برئه<br />اختصار القول (برغم اننا دوله (علمانيه من وجهه نظر الحكومه وعلى حد زعم احمد كلين رئيس حكومتنا المؤقره) بس برضو فى قانون<br />تحيه من القلب الى العميد / احمد ...... على اعتقاله لكريم وتقديمه للمحامى العام لنيابه امن الدوله العليا<br />المستشار هشام بدوى<br />ودمتم ياشباب مصر المنحوسه<br />كان معكم اخوكم سيكو<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 2
subject = "يا ستي حرام"
author = "مهدي"
posted = "2006-11-13"
text = "حرااااااااااااااام وجع الدماغ واللف والدوران ورا عيل فاشل زي ده حب يتشهر من الباب السحري شتيمه الدين البني ادم ده حتت حماااااااااار بيتكلم علي النبي والصحابه انهم حراميه وبيتباكي علي الشيوخ اللي بيتكلموا عن المسيحيه ده حتت حيواااااااااااااااااااااااان"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 3
subject = "طارق الوزير"
author = "tark alwzer@yahoo.com"
posted = "2006-11-13"
text = "هذا الشخص زباله فى التفكير باع نفسه لموقع المبرشمين متحدين وكان يشيد به عدلى المشرشح نظرا لمشاركاته التى تسب الاسلام بطريقه اعجبت المبرشمين<br />وعملوا معه لقاء وصفوه بالمفكر !!!! المهم من كتاباته تدل انه لادين له وهو من المعجبيين بسلطانه الالحاد المدعوه وفاء سلطان !! واخر مشاركه له فى موقع المبرشمين طالب بالا يكون هناك زواج بمعنى اللى شايف واحده ياخدها وينام معاها"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 4
subject = "وا ا ابااديرااااااااااااااه"
author = "مهدي"
posted = "2006-11-13"
text = "ابقي عري طيزك يا عبد الكريم واصرخ اطلب عمك عدلي ابادير ينجدك يا ابن الكلب ياللي نزلت شتيمه في سيد الخلق والصحابه لمجرد غضب الناس من شويه مناجيس شتموا دينهم قبل اي حاجه انا معنديش مشاكل من الفقر او القبح وانا من شبرا يعني مش غني بس باين من منظره عيل اعور جربان مش لاقي ياكل حب يشتم دينه باين اسياده من الأقباط ينصره ويسفره مش قادر يفهم ان هما هيستنزفوه ويعملوه ان راجل انقلب من الداخل وخلي بالك من حكايه الداخل لازم يفضل يتنفخ في مصر وينفخوه ويعملوه كاتب علشان ينقبض عليه ويتنفخ افرح يا عم الكاتب وخلي امك تزغرطلك يا عرص كنت نازل شتيمه في الأسلام ونبيه في موقع الأقباط الأمريكيين والأقباط المتحدين خليهم ينفعوك وابقي المعرص بتاعك ابادير ولا الخول شنوده ينفعوك حتت حماااااااااااااااااااااااااااااار<br />سياده الكاتب عبد الكريم حيوان<br />يحموك انت وامك في كنكه"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 5
subject = "بدون غلط أرجوكم"
author = "BATISTUTA"
posted = "2006-11-13"
text = "اقول له اعتقد فيما تشاء فكر فيما تشاء لكن لا تسمعنا ما تقول لانى لا اريد ان استمع لك .<br />تركت الدراسة فى الازهر لانك رايت ان الاسلام دين التطرف والارهاب اتركه ولكن لا تدعو لذلك فانت لست مخول للحديث بالسنه احد فاتركنى اعبد الهى الله عز وجل واعبد انت الهك .<br />حريتك ليست كما تتدعيها فى التهجم على الاسلام .<br />اخير هنيئا للغرب سلمان رشدى مصر اذهب لهم هناك مقعد محجوز لك هناك وحينها تستطيع ان تقول على الاسلام ما تشاء ولن يمنعك احد فهناك الحرية التى تنشدها وفورا ستحصل على كل الجوائز نوبل وغيرها .<br />الاسلام لا يخسر اذا تركه احد من يترك من يخسر وموعدنا بعد الموت لتعرف اين الحق واين الباطل ."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 6
subject = "التزموا اداب الاسلام ارجوكم"
author = "BATISTUTA"
posted = "2006-11-13"
text = "والله الناس اللى بتشتم دى صورة سيئة للاسلام انت فاكريين انكم حماة الاسلام لما تشتموا واحد كفر بالاسلام انتم بتسيئوا للاسلام اهدو وفكروا بعقلانية اتكلموا بادب لانكم صورة للدين اللى مش عاجبه .<br />تحلوا باداب الاسلام وانتم بتتكلموا مع اى حد مسلم او كافر حتى . وشكرا"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

