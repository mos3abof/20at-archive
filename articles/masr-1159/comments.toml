[[comments]]
order = 11
subject = "ملاحظات على الموضوع"
author = "1- عبد الكريم لم يشارك في أي فعالية من الفعاليات المنادية بالاصلاح لا في القاهرة ولا حتى الاسكندرية عكس ما جاء في التقرير"
posted = "2006-11-14"
text = "2- بالنسبة لموضوع القبض عليه فهو لا يخرج تفسرها عن كون امن الدولة ده حاجة من اتنين ملهمش تالت ياإما غبي لدرجة الثمالة أو زكي وبيتلاعب بالناس واتوجيه اهتماماتهم لأمور ثانوية مش هتودي ولا هتجيب وفي كلتا الحالتين قوى الاصلاح هي المتضرر الاول من شغل الرأي العام بالقبض على طالب سابق فاشل و كاتب حالي مغمور ...وننسى قضايا الاصلاح والبلاوي الى البلد غرقانه فيها لشوشتها<br />3- بالنسبة للصورة الي موجودة اعلى الصفحة ومع اختلافي مع 99% من مواقف وآراء شيخ الازهر إلا اني لا اقبل ان الموقع يضع صورة نبيل في مواجهة شيخ الازهر إلي بيمثل قيمةإسلامية وإجتماعية بالرغم من مواقفة المحزنة...فرجاء تغير الصورة والتدقيق بعد كده في الامر ده علشان الموضوع ده ملحوظ في الموقع في الفترة الاخيرة<br />4- عبد الكريم عامل لامؤخزة زي القطة عمال يشب علشان حتة اللحمة إلىي ممكن يرميها ليه جدو عبدو أبادير وهي تأشيرة ومركز مرموق في مركز ابحاث اوروبي ولا امريكي مقابل خدماته الجليلة في التهويل والكدب على الناس وكان على نفس الدرب نصر ابو زيد وتسليمة نسرين ووسلمان رشدي وكلهم حالياً في بلوعة التاريخ ومحدش يعرف عنهم حاجة<br />5- بصراحة في مجموعات من الاقباط مش ناويين يجبوها على بر هيفضلوا يزنو على خراب عيشتهم على امل تدخل امريكا واعتقد ان الاقباط في مصر وضعهم مش قوي زي المسحيين في السودان ولا البربر في الجزائر...الاقباط في مصر \"كقاعدة شعبية\" وضعهم هادي ة مرتاحيين في بلدهم ومش عايزين وجع الدماغ بتاع شنودة ورفاقه إلي هيخربو على نفسهم<br />وبس"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

