[[comments]]
order = 8
subject = "بصه كاتب ايه في موقع الكلاب متحدين"
author = "الصايم"
posted = "2006-11-14"
text = "عبدالكريم نبيل سليمان<br />karam903@excite.com<br />2006 / 1 / 31<br />يقول الشاعر العربى :-<br />لكل داء دواء يستطب به ..<br />إلا الحماقة أعيت من يداويها.<br />.لم أعرف .. لماذا وردت هذه الأبيات إلى ذهنى وأنا أتابع ردود الفعل العربية والإسلامية على مانشرته بعض صحف الدانمرك من رسومات كاريكاتورية إعتبرها البعض مسيئة إلى الدين الإسلامى لأنها تصور نبى الإسلام محمد بشكل تهكمى ، ولا أعرف على وجه التحديد السبب الذى جعلنى أشخص الحالة العربية والإسلامية الآنية على أنهامصابة بداء مستعصى على الشفاء ، ولكننى أدركت لاحقا أن هذه الأبيات الشعرية تنطبق - للأسف الشديد - على حالنا المخزى والذى جعلنا نغض الطرف عن مشاكلنا الحقيقية ونفتعل خلافات واهية مع حكومات ومؤسسات إقتصادية لا صلة لها بهذا الأمر من قريب أو بعيد سوى أنها تحمل ذات الجنسية التى يحملها الفنان صاحب الرسومات الكاريكاتورية !! .<br />فمنذ عدة أشهر وتحديدا عقب خروجى من السجن إلتقيت بالصدفة البحتة بأحد الأساتذة الجامعيين الذى يفترض أنه يمتلك عقلية أكبر من أن تهتم بتسليط الضوء على هذه الموضوعات التافهة على حساب المشاكل الحقيقية التى نعانيها ، ووجدته يحمل علىَّ بشدة لموقفى الصريح من الإسلام ، ويخاطبنى - بإعتبارى أزهرى - أنه يفترض بى أن أهتم بقضايا العالم الإسلامى والتحديات التى تواجهه من دول \" الكفر \" الغربية التى لن يرضى عنَّا مواطنوها وقادتها من اليهود والنصارى حتى نتبع ملتهم !! ، وخلال حديثه ذكر لى مانشرته بعض الصحف الدانمركية من رسومات تسىء إلى نبى الإسلام محمد محاولا أن يقنعنى أن الإسلام ليس سوى ضحية لدول الغرب التى تحاول أن تمحوه من على خارطة العالم - على حد تعبيره - ، عندها أدركت حجم الكارثة التى يعانيها مثقفو العالم الإسلامى الذين نجح السياسيون فى<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

