text = "والله لم قرات المقال وقرات تعليقاتكم, ذهلن من اللى بيحصل فى مصر واللى لسه يا ماهنشوف ,, احب اشكر باتيستوتا علىتعلقه لانه فعلا قال كل اللى اناكنت عايز اقوله بس احباقولك يا بتستوتا الاخ مهدى عنده حق برده والناس عندهاحق انها تشتم الزفت ده اللى اسمه كرم ده مش كل واحد حب يشتهر يشتم الاسلام والمسلمين...<br />شكرا بتستوتا \"راى حر محترم \""
