subject = "بيقولك ودعا شهر النفاق كافر بقى"
author = "عبدالكريم نبيل سليمان"
posted = "2006-11-14"
text = "karam903@excite.com<br />الحوار المتمدن - العدد: 1715 - 2006 / 10 / 26<br />للمرة الأولى منذ أن كنت فى الخامسة أجد فى نفسى الشجاعة الكافية لرفض صيام شهر رمضان هذا العام ، على الرغم من كافة المصاعب والعوائق والتحديات التى صاحبتنى أثناء تنفيذ هذا القرار الذى أعاد لى قدرا من إرادتى التى كانت مسلوبة منى عندما كنت أجد نفسى مضطرا للقيام بممارسات وأعمال عن غير إقتناع كامل بها لمجاملة من حولى ليس إلا .<br />ولقد خرجت من هذه التجربة الناجحة بتصورات جديدة عن مجتمع الفاترينات الذى نعيش فيه والذى يحتم على المرء أن يبدى قدرا من من النفاق للمجتمع الذى يعيش فيه حتى يحظى برضا من حوله حتى وإن كان من داخله مختلفا معه تمام الإختلاف .<br />فمنذ عدة أعوام تقدم أحد أعضاء مجلس الشعب بمشروع قانون يجرم من يجاهر بالإفطار فى نهار رمضان ، وهو الأمر الذى يمثل دعوة صريحة لغير الصائمين لنفاق المجتمع وإقناع من حولهم بأنهم صائمون مثلهم على الرغم من أن شعيرة الصيام يفترض أنها شأن خاص بين الصائم وإلهه ، ولكن ما يحدث حولنا من قطعنة لمجتمعاتنا على الطريقة الإسلامية جعلت الصيام يتحول من عمل تعبدى خاص بالمؤمنين الذين يرغبون فى أدائه إلى عادة يجب إتباعها فى الظاهر حتى لا تثير مشاعر الصائمين ، وكأنه يجب على غير الصائم أن يمتنع عن الطعام والشراب أمام الصائمين حتى يساعدهم على تأخير رغبتهم فى الطعام والشراب حتى موعد الإفطار !! .<br />وعلى الرغم من أن مشروع القانون هذا لم ير النور ، إلا أن هذا القانون مطبق بصورة أو بأخرى فى الشارع المصرى - كنموذج معاش - حيث نجد المقاهى والمطاعم تغلق أبوابها حتى ساعات الإفطار ، ولا يسمح ببيع المأكولات السريعة والعصائر والمشروبات أثناء النهار بحجة أنه يفترض أن يكون الجميع صائ<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 14
subject = "رد على كريم"
author = "مواطن عادى"
posted = "2006-11-14"
text = "حد دخا على مدونة كريم و تطاوله الشديد وقلة الأدب الذى يمكن ان نقول كفر على السلام و على الله عز وجل و رسوله الكريم. دنيا هاجت لمل الدنمارك عملت الرسوم. المفروض ايه الى يحصل لما واحد زى كريم يقول كده. أنا ضد القبض و اعتقال الحريات. بس حد يقول ممكن يكون ايه الحل للناس زى كريم"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 15
subject = "المتطلعون"
author = "عبدالله مفتاح"
posted = "2006-11-14"
text = "على فكرة مش عبد الكريم بس مهو في مدونين عاملين فيها مفكرين وبيطعنوا بردو في الاسلام بس بطريقة اقل وقاحة من طريقة عبدالكريم وكلهم بيتطلعوا لقطعة اللحم<br />واظن ان قطع اللحم لتترمي ليهم قريب وهيحققوا مرادهم وهيخسروا نفسهم"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 16
subject = "يا جماعة شوية صبر"
author = "صابر"
posted = "2006-11-14"
text = "أولا أنا أعيب على ولاد البلد انهم فتحوا الموقع لكل حاجة و أي حاجة زي ما يكونسد فراغات و خلاص<br />طيب مين عبد الكريم آسف مين عبد نفسه و هواه اللي انتم مليتم صفحة كاملة بكلامه و التعريف به و الله حرام مش كل من هب و دب نلاقي الموقع بيتكلم عليه و عامل تحقيق مطول و الصحفية اللي تعبت نفسها و كتبت ده كله استفادت أو أفادت ؟؟؟ على فكرة الموقع ده له مثل في اللغة العربية ممكن نقول عليه ( حاطب ليل ) و اللي يعرف معنى حاطب ليل يفهم قصدي إيه<br />هل عبد نفسه هذا يستحق كل هذا أولا أنا لم و لن اعلق على ما قاله عبد نفسه و يكفى أن أمثاله في القرآن الذي لا يؤمن به قال عنهم الله تعالى ( و اتل عليهم نبأ الذي آتيناه آياتنا فانسلخ منها فأتبعه الشيطان فكان من الغاوين * و لو شئنا لرفعناه بها و لكنه أخلد إلى الأرض و اتبع هواه فمثله كمثل الكلب إن تحمل عليه يلهث أو تتركه يلهث ذلك مثل القوم الذين كذبوا بآيتنا فاقصص القصص لعلهم يتفكرون ))<br />صدق الله العظيم"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 17
subject = "الى امن الدوله"
author = "المصرى"
posted = "2006-11-14"
text = "من حقى عليكم ان تهتكوا عرضه وتمرمطوا به الارض ويعترف لكم عن اتصال اقباط المهجر به<br />حتى اصبح مشاركا قذرا ليشتم ديننا وكم شيكا قبضه من عدلى ابادير..ولا تطلقوا سراحه ابدا لانه سيظل وسخ مثل اخر دبلوم تجاره !! فى كندا يعمل لحساب موقع الاقباط متفرقون والولد ده عاوزكم يشتغل فى تنضيف مجارى السجن لان وشه بكابورت"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 18
subject = "سامحك الله والله عزيز ذو أنتقام"
author = "مصرى أصيل"
posted = "2006-11-14"
text = "أنت لا تعرف معنى لا تعرف معنى الحرية وأكيد عميل ومعقد وحاقدعلى الأسلام وأكتب ماترى من تخاريف وأوامر ولكن الأسلام برىء من أمثالك"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 19
subject = "الى الاخ قاسم"
author = "مش مهم"
posted = "2006-11-15"
text = "كلامك صحيح يا اخ قاسم ولكن الصحفيين اللي بيعملوا في هذا الموقع معظمهم بيشتغل مع الصحافة الاسلامية والمواقع الاسلامية زي اسلام اون لاين واخوان اون لاين ولكن هذا الموقع ليه هدف لانه لانه جوا مصر والمحررين عايشين داخل مصر ومع ذلك نجد اغلب تعليقات القراء سب وشتم في حسني مبارك وجمال مبارك والحكومة.<br />واكيد ورا هذا الموقع جهة مشبوهة"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 20
subject = "أسهل حاجة لتجاوز فاشل"
author = "أسهل حاجة لتجاوز الفشل هو سب الدين ... أعتقد أن محاولاته ليست الا نوعا من محاولة الشهرة بإسفاف واضح وكلام اهبل مجرد اتهامات بيرددها زي الببغان اتعلمها من اسياده الامريكان"
posted = "2006-11-15"
text = "سلاام ياعم ... دية مناظر تتكلموا عليه ...<br />والله الحرامية اللي معترض انه مسجون معاهم فيهم من هو اشرف منه ... على الاقل بعضهم سرق عشان ظروفه الصعبة ... أما ده .... يللا"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 21
subject = "الواد ده فاشل"
author = "احمد"
posted = "2006-11-15"
text = "يا جماعه لازم الامور تكون واضحه شويه في حاجات تايهه عن الجميع بعيد عن حرية الفكر والابداع والكلام الكبير اللي ناس كتير بتاخد منه مدخل لسوق الهبل على الشيطنه<br />عموما دا راجل فاشل فلاح مجبش مجموع في الثانويه يدخله كليه محترمة ودخل احد كليات الفاشلين اللي بيتخرجو يقعدو على الرصيف وطبعا لانه خايف من قعدته على الرصيف ويمكن ميلاقيش مكان فاضي في الرصيف فيضطر يقعد في انابيب الصرف الصحي اللي هي المكان المناسب لامثالهوطبعا حضراتكم عارفين ان احد الطرق للوصول للنجوميه او النجاح اللي هو بيكون عن طريق مساندة الافكار الغربية هو الهجوم على الدين الاسلامي ورموزه وشخصياته التاريخيه<br />وعلى ذلك البيه بتاعنا لقى في الموضوع ده طوق النجاه من الرصيف والمجاري ولا اظن ابدا انه عنده اي مؤهل من مؤهلات الكتابه لانه من الواضح غير مثقف بالمره ولا يفقه اي شئ لانه من كلامه واضح انه ميعرفش معني الحضاره ولا المدنيه ولا الاديان حتى .<br />اما عن رأيي في الحكم عليه :<br />انا رأي انه راجل مسلم واضح من اسمه وهاجم الدين الاسلامي باسلوب مهين مما يصبح من خلاله في حكم المرتد وحكم المرتد عارفينه<br />بس مش هقول يتعدم لانه من رأي عيل غلبان وتافه ومش عارف هو بيعمل ايه هو كل اللي عاوزه انه يهرب من المستقبل المظلم ويبقه من المشاهير بس بقله ميكنش على حساب دينك واخرتك يا جاهل يا متخلف<br />وامر الحكم عليه يرجع لاولي الامر"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 22
subject = "12"
author = "12"
posted = "2006-11-15"
text = "هنا بدأت أفكر هل فعلا يستحق عبكريم أن نطالب بالإفراج عنه<br />أنا إلى هذه اللحظة لا أجد إجابة علي هذا السؤال و كأن هناك في عقلي شخصان يتناحران<br />أنا الأول يرى أن عبكريم لا يستحق فهو يسب المسلمين - أي يسبني أنا شخصيا بصورة أو بأخرى - و بالتالى فهو ليس الشخص المناسب الذي من الممكن أن نجعله رمزا لحرية التعبير. و هناك أيضا سبب أخر للتراجع عن مساندته فالحكومة من الواضح أنها بتتلكك للمدونين و بالتالي فليس من المستحب أن نستفزها خصوصا لو كان السبب هو القبض على واحد مثل عبكريم<br />أما أنا الثاني فيختلف مع أنا الأول جملة و تفصيلا فهو يرى أننا يجب ألا ندافع عن حرية الرأى فقط حين يكون هذا الرأي متطابق مع رأينا و أنه حر في السباب كما أننا أحرار إننا نشتم أهله لو شئنا. و بالنسبة لإستفزاز الحكومة فدور المدون أن يتكلم بصراحة و من العار عليه أن يجبن و لا يقول ما يراه صحيحا و لو الحكومة هذه المرة ألقت القبض علي شخص مثل عبكريم فما الذي يمنعها من القبض علي و عليك في المستقبل<br />الملاحظ أن هذه المرة الكورال إنقسم إلى إثنين و كل منهم يغني في جانب - قسم معه و قسم ضده - لكنهم إتفقو أن يغنوا هما الإثنين أغنية عبكريم<br />أما أنا فحتى الآن أعتقد أنني سأنزوي جانبا هذه المرة و لن أغني مع أي من فرقتي الكورال العبكريمي في محاولة لمراجعة النفس و التخلص من ثقافة الكورال التي أصبحت تغلب علينا"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 23
subject = "غاوى شهرة"
author = "وليد فوزى أبوعقيل"
posted = "2006-11-16"
text = "ربما قرأت لمن يفكر مثل هذا الشخص ولكنى لم أستفز قدر استفزازى لتصرف هذا الاحمق وهو لاشك شخص يختصر طريق الشهرة والنجاح لشهرة غبيةوتصرف مجنون مثل السفاح الذى يقتل العشرات لا لشى سوى لتكتب عنه الصحافة .<br />يتضح من خلال ما قرأته من آراء لهذا الشخص أنه يصطدم بالمجتمع لتحقيق شهرة زائفة .....والغريب أنه يرغب فى الافطار جهارا وبنطاعة وتجرأ دون مرعاة لمشاعر الصائمين ويهزأ بركن من أركان الاسلام يسمو بالنفس ويحد من شهواتها كالصيام!!!!<br />والاغرب أنه يهنى أصدقائه بانتهاء رمضان..!!<br />أي تركيبة هى تركيبتك ؟؟<br />لاشك أنك أحمق ولا تستحق الرد عليك أو ذكر أسمك .<br />وردى فقط لكى لا يتأثر بكلامك شاب يأس او غاوى شهرة مثلك.<br />وهنيئا لك شهرتك الملوثة مثل عقلك..والعقاب الحقيقى لن يكون بالسجن بقدر ما ستلاقيه فى مستقبلك من عقلك الخرب وربنا يشفيك"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"

[[comments]]
order = 24
subject = "مع الحرية لا مع عبد الكريم"
author = "معاذ محمود عامر"
posted = "2006-11-16"
text = "بالرغم من اختلافي الكامل مع كل ما يكتبه كريم عامر على مدونته أو على أي موقع من المواقع الأخرى التي يكتب عليها<br />الا أنني أرى أنه ما كان يجب أن يسجن أو يساءل عما كتبه<br />وبعدين ليس أمن الدولة هو حامي حمى الاسلام بالطبع<br />ان التضامن مع كريم عامر هو تضامن مع حرية الرأي والتعبير كمبدأ<br />فمن حقه أن يفكر وأن يعبر عما يجول بفكره بصورة منضبطة<br />أنا قرأت له كثيرا ولم يكن دائما منضبطا في طريقة تعبيره واستفزني في معظم الأحيان ما يقوله عن ديني ولكن.....<br />ليس عقابه السجن<br />فأنا ضد العقاب على أي رأي أيا كان ومن حق أي انسان أن يختار طريقه ودينه وأسلوب حياته أيا كان ما يختار"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015235/http://masr.20at.com:80/article.php?sid=1159"
