[[comments]]
order = 0
subject = "سونيا الشريرة"
text = "أنا معلوماتي ان المياة السخنة بتستخدم في الولادة .. بس .. إيه علاقتها بالحر .. وايه لزمة الموضوع ده أصلا .. عايز تقاوم الحر .. قاومه بالعرقسوس .. هو ده الكلام"
archived = "2004-08-20"
capture_url = "https://web.archive.org/web/20040820162548/http://www.20at.com:80/article.php?sid=369"

[[comments]]
order = 1
subject = "رنين الحب"
text = "السلام عليكم ورحمه الله وبركاته<br />ايه يا اخت سونيا المفروض ان الموضوع طبعا مفيد امال هما كاتبينه ليه<br />زياده عدد مثلا وبعدين ولو انتى مش مستفاده سيبى غيرك يستفيد<br />شكرا القدس برس<br />رنين الحب"
archived = "2004-08-20"
capture_url = "https://web.archive.org/web/20040820162548/http://www.20at.com:80/article.php?sid=369"

[[comments]]
order = 2
subject = "marmoor"
text = "يه كده يا سونيا الموضوع مفيد فعلا و الكلام ده صح جدا و انا عن نفسي متأكده منه و كمان مجرباه و اى حد لو جرب فعلا ياخد دش سخن في الحر هيلاقي نفسه مش طالع حران اكتر لكن هيلاقي نفسه مش حران و اللي مش مسدأ يجرب بنفسه بس تكون المياة ساخنه مش فاتره<br />شكرا"
archived = "2004-08-20"
capture_url = "https://web.archive.org/web/20040820162548/http://www.20at.com:80/article.php?sid=369"
