author = "Mohamed Saleh"
posted = "2008-12-29"
text = "يا عم ارحمونا بقى من نغمة العرب—الحلوين اللى بيقولو انهم حاسين بالعار يكلمونا الاول عن معاملة العرب معاهم اصلا وهما بيعتبروهم درجه تانيه—دلوقتى بقينا احنا اللى لازم نحارب—كمان نفتح لهم المعبر ليه ونشيل هم قضية مش بتعتنا ليه—عاجبكو يعني الظابط اللى مات برصاصهم—تقدرو تقولولي اد ايه فلسطينيين عايشين بره—وعندهم فلوس اد ايه—بصو لما حد يكلمكو قولوله انتو روحو حاربو واحنا معاكو—بس احنا بطلنا نفتح صدرنا ونحارب ويبقو الناس كلهم بيتفرجو"
archived = "2009-10-24"
capture_url = "https://web.archive.org/web/20091024095711/http://www.20at.com:80/masr/masr/t7kyk/10818.html"

