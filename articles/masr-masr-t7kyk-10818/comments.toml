author = "الى احة"
posted = "2008-12-29"
text = "ستنتصر غزة<br />وسينتهى دور مصر لتتفرغ للجوع والعشوائيات والتحرش الجنسى والقروض والمعونات<br />دورها هى اطعام الجياع<br />اتركوا النضال للرجال<br />خليكم وراء ليفنى تضربكم بشبشبها<br />ولكن غزة ستنتصر"
archived = "2009-10-24"
capture_url = "https://web.archive.org/web/20091024095711/http://www.20at.com:80/masr/masr/t7kyk/10818.html"

[[comments]]
order = 2
subject = ""
author = "مصرى حتى النخاع"
posted = "2008-12-29"
text = "ياسيدى انتا زعلان لية ؟<br />انا بنشوف العجب دلوقتى<br />الناس بتتهم مصر لان مصر مش بتحارب نيابة عن العرب<br />ياخى احة<br />طز فى العرب كلهم واولهم فلسطين<br />واحد فلسطينى بمنتهى البجاحة واقف امبارح بعلو صوتة يقول مصر عميلة وخاينة<br />قلت لة : احة<br />انتا واقف تعمل اية فى الكويت ماتنزل تدافع عن بلدك بدل ماتشتم فى مصر<br />الحمد للة ان الكلاب الاخوانجية ممسكوش الحكم والا واللة حنبقى زى فلسطين كدة مغامرات عاطفية صبيانية على الفاضى"
archived = "2009-10-24"
capture_url = "https://web.archive.org/web/20091024095711/http://www.20at.com:80/masr/masr/t7kyk/10818.html"

[[comments]]
order = 3
subject = ""
author = "مصرى عجوز وحزين"
posted = "2008-12-29"
text = "انا مصرى<br />شاركت مجندا فى حرب الاستنزاف وحرب اكتوبر ولم اشعر ابدا بالمهانة ولا الاذلال مثل ما اشعر بة الان<br />كانت الطائرات الاسرائيلية تحلق فوقنا اربعة وعشرين ساعة فيما يسمى الساقية - طائرة تضرب فينا وتروح وتستلمنا التانية تضرب فينا<br />وكان يصاب واحد منا او اتنين<br />وكان راسنا عاليا<br />كان الراديو يذيع هنا القاهرة فتصمت كل العواصم فى الشرق الاوسط ولا واحد يرفع صوتة بعد هنا القاهرة<br />كان المصرى ينزل فى مطارات الدول العربية فيقابل بالاحترام<br />انما بعد ان سرحنا الجيش<br />وبعنا الاقتصاد ودمرناة<br />واصبحنا بعد 35 سنة من السلام من اسوأ اقتصاديات المنطقة ورجل الشرق الاوسط المريض<br />وشعبنا يموت فى طوابير الخبز<br />وتاتى رقيعة من اسرائيل اسمها وزيرة الخارجية وتعلن الحرب على غزة من القاهرة ووزير الخارجية واقف بجانبها لم يعقب بكلمة واحدة - فهذا لا يصلح وزيرا لخارجية لمصر - هذا الرجل يصلح ان يكون كاتب فى سفارة او موظف علاقات عامة<br />وزير الخارجية هو محمود فوزى وورثتة العظام فى الخاجية لتنتهى بعمرو موسى<br />اما هذا الشخص فلا ادرى من الذى اختارة للخارجية - لتنتهى بقصف السفارات المصرية بالطوب<br />مطلوب يا سادة رجال محترفون يمسكون الحكم فى مصر ووزراء اكفاء<br />مطلوب جيش قوى جدا لمصر<br />مستعدين ان نموت من الجوع ويكون لنا اقوى جيش مصرى فى المنطقة<br />مصر بجلالة قدرها مش عارفة توصل شوية ادوية لغزة<br />مطلوب اقتصاد قوى<br />قطاع عام وقطاع خاص<br />مطلوب طرد الحرامية<br />وطرد الفاسدين والمفسدين<br />انا حزين<br />مصر تستجدى موقفا تركيا<br />وزير خارجية مصر فى تركيا واقف مجهد ومش قادر يفتح عينية وبيقول اى كلام فارغ"
archived = "2009-10-24"
capture_url = "https://web.archive.org/web/20091024095711/http://www.20at.com:80/masr/masr/t7kyk/10818.html"

