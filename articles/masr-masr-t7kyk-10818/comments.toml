text = "انت اتجننتوا في عقلكوا ولا ايه مصر ايه اللى عميله يا زباله وانتم يا عشرينات معندكمش مخ انا عايزة اعرف وزيرة الخارجية الاسرائيليه زارت مصر قبل القصف ب 24 ساعه بس والقصف ده بيكون في اعداد على الاقل اسبوعان ايه الارف ده"
