text = "طبعاً الموضوع حلو و أعتقد أن مافيش حد أتكلم فية قبل كدة .. بس عايز أقول حاجة يا أستاذة أميرة انا شايف أن الجو حلو<br />أوى اليومين دول علشان تكتبى فى السياسة ويا سلام لو كتبتى بالطريقة الهزلية زى ما كتبتى فى الدستور حاجة تحفة<br />بصراحة أسلوبك هايل ورائع<br />وماتخفيش ماحدش ها يقدر يتكلم معاكى لو كتبتى فى السياسة أنتى( سلطة رابعة …؟) ولو حد أتكلم أنا ماليش دعوة"
