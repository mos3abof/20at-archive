posted = "1999-11-30"
text = "بصي هو أفلام الرعب ديه و الزومبي كانت هواية عندي و انا صغيرة بس اخر علاقة ليا بيها انتهت من فترة لا بأس بها..بس واضح انها ما انتهتش من عند المخرج \"روميرو\" ..أعجبني فيه أصرارة و ايمانة بالزومبي الي الحد اللي يخلي موضوع افلامه كلها عن الزومبي لاء و الادهى انه بيعمل فيلم جديد و تقريبا انا شفت قصته و انا صغيرة ..فاكرة؟؟<br />بس عامة الموضوع حلو و أعتقد أن فيه ناس بتتفرج على الافلام ديه كتير و متعرفش اساسا يعني ايه \"زومبي\"<br />و اللي شدني اكتر أسماء أفلامة ..\"ليلة الموتى \" \"فجر الموتى\" و مش بعيد يغير أسم الفيلم الجديد اللي هو اسمة\"يوميات الموتي\" و يخلية \"الموتى الموتى\" و بكده يكون أكمل سلسلة الموتى<br />بحييكي على أسلوبك"
archived = "2009-05-11"
capture_url = "https://web.archive.org/web/20090511135948/http://www.20at.com:80/klam-rosas/2955.html"

