author = "English Youth"
posted = "1999-11-30"
text = "عندما وجدت في العنوان كلمة Zombie توقعت بصراحة إن الموضوع يكون أجمل من كده وأعمق شوية، وبعد ما قريت الموضوع حسيت إن الأحسن يا إما كان يتعمل بروفايل عن روميرو نفسه وخلفيته النفسية اللي خلته يعمل كل الأفلام دي، يا إما يكون موضوع عن أفلام الزومبي كلها بلا إستثناء… فمثلاً لم يتم ذكر أفلام مهمة زي Resident Evil بجزئيه واللي أصلاً كان لعبة كومبيوتر في الأول، وكمان 28 days later وكل الأفلام اللي أقدم من أفلام روميرو وكمان أجدد منها… زي مثلاً أول فيلم سينمائي يظهر فيه زومبي وكان عامل إزاي…؟!<br />أعتقد لو كان الموضوع عن أفلام الزومبي كان ممكن يا أميرة بشوية search بحث على جوجل كنتي حتطلعي بمعلومات ومواقع بالهبل عن تفاصيل اللي أنا بقوله ده… أما لو الموضوع كان عن روميرو نفسه فإزاي ما نتكلمش عن خلفيته النفسية ونحاول ندي للناس ولو تحليل بسيط عن نفسية المخرجين اللي زي دول…<br />على العموم الرعب بشكل عام بقى إهتمام لناس كتير أووووي سواء قراءة أو أفلام… وربنا يعافينا من العقول المريضة…!!<br />وعلى العموم الموضوع حلو وبداية جيدة للكلام عن أفلام الرعب… إلى الأمام."
archived = "2009-05-11"
capture_url = "https://web.archive.org/web/20090511135948/http://www.20at.com:80/klam-rosas/2955.html"

