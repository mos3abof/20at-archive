text = "أولا أنا لست من محبي أفلام الزومبي و دراكولا و مصاصي الدماء المتعجرفين الأرستقراطيين الذي دائما ما يصرخون في وجوه ضحاياهم قبل سفك دمائهم و نزع أحشائهم و اللعب بعيونهم المقلوعه و التسليه بتمزيق أكبادهم بدون سبب مفهوم كما أنني لطالما تعجبت من الجمهور الذي يصر بشده علي مشاهده هذه النوعيه من الأفلام<br />ما هو السبب وراء ذلك؟؟؟ فهل هو ظمأ للشعور بالرضا علي الحياه الحاليه أم هو مرض؟؟؟ و لو كان مرض فمن هو المريض أهو الجمهور ؟؟؟ أم روميرو ؟؟؟؟"
