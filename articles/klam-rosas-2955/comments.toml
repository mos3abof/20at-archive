text = "يا بنتى هوه فيه اكتر من الرعب اللى البلد فيه انتى مش شايفه اللى بياكلو فى البنى ادمين وهما صاحيين من غير افلام ولا وجع دماغ البلد بتخرب دوووول يا ست الكل بياكلو بالعماره مره واحده مش نأناأه بنى ادم بنى ادم لاه هووووب تلاقى كرش شافط ييجى متين تولتمين واحد وهووووب متكرع هيييييييه خلاص بقو فى بطنه وبالشفااااااااا ا مش شايفه الكبيييييييير شافط قد ايههههههههه من غير افلام ويجعلها عامره"
