text = "بصي سيبك من كم المعلومات و اسلوب العرض و اسلوبك انت الشيق اصلا و الرائع و الحلو و المش ممكن علي حد تعبير كل التعليقات يا استاذة اميرة<br />انا مش باحب افلام لرعب و مش بتفرج عليها اصلا..لاني جربت و النتيجة ماكنتش شيقة باليل بقي مع النوم وحيدا و وجهك للجدار..و عشان كده باحيكي ن بعيد لبعيد"
