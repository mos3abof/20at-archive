[[comments]]
order = 10
subject = "يل نشوف حل"
author = "yahy"
posted = "2006-11-22"
text = "نا سعيد خالص عارف ليه<br />عشان عرفت ان فيه ناس لس عندها شجاعة ونخوه بس عاوزين منهم مليون وسعيد اكتر من مني الشذلي عشان عرفت موقع المدونات دي والحمد الله<br />علاء كان شجاع وله الفخر بس يلننشر الفكر بتاعنا عشان نحرر الناس جايز اكون داخل سخن بس الفساد انتشر علي يد مبارك وحكومته يعني هو ما بيشفش ما بسمعش اهطل ايوه بس اكيد بيشوف وبسمع ولا تبقي مصيبه وبعدين هيروح بيه العمر لحد فين<br />ولا احنا هنستني لحد ما يموت تبقي مصيبة ولا يجيب الاهطل ابنه تبقي مصيبتين علي جستي تحياتي"
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124072801/http://masr.20at.com:80/article.php?sid=1188"

