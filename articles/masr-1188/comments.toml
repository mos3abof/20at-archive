text = "مبارك علينا الخراب والفساد<br />مبارك علينا قهر الولاد<br />مبارك علينا ضياع البلاد<br />مبارك عليك سويت في جهنم<br />جايلك خصوصي وحجزه مقدم<br />مبارك يا ريس<br />يا فخر الزمان<br />غلبت الابالسة هزمت الشيطان<br />ابليس بيولع لو استعذنا بربنا<br />بس انت بإيه تغورياريس من وشنا"
