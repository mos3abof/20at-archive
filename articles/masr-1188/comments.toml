subject = "مصر العزيزة لي وطن"
author = "رموززززززززززززززززززززز"
posted = "2006-11-21"
text = "هو الرئيس لو مشي وجه بدله واحد معارضه نتن من الللي كلامهم هواء هنزهق اكتر وبعدين اي نعم حسني مبارك بعصرة فساد بس الفاسدين هو احنا مش احنا اللي كلنا حراميه<br />برضه وهو زعيمنا يعني لو وحشين هو وحش زييا وعاجبه الحال خلاص وبعدين لو مشي وجه غيرة هتندموا صلحوا نفسكم ربنا يكرمكم بالاصلح لو انتم كنتم كويسسن مش معقوله رئيسكم هيبقي وحش الجزاء من جنس العمل وربنا يهدينا الخطر الحقيقي علي الحدود<br />وانا خايف منه لانه خطر داهم مش برئيس شعب هو قبل مييمسكم كنت شعب بايظ برضه وخارج من الحرب منتصر بس الاهم الاخلاق"
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124072801/http://masr.20at.com:80/article.php?sid=1188"

