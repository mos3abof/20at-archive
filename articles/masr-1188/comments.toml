text = "الضوء الشارد<br />والراجل اهو قاعد<br />وبيشرب بارد<br />والسكة مسالك<br />وطوز كبير اوي ف المالك<br />طب لما هو هيقغد ( ليه بيداري كده ولا داري كده ولا داري كده ولا ناده علي راي سيدة الغناء العربي الست ام شعبان<br />وسمعني الدستور<br />والله يرحمك يا سعاد<br />معلش مش قادر اجمع من تاثري بالخطاب التاريخي للرئيس المدمن تسلط محمود المليجي<br />نسرين"
archived = "2006-11-29"
