[[comments]]
order = 5
subject = "علي علبة"
author = "علي علبة ...صديقي القهوجي"
posted = "2006-11-21"
text = "أحمد زين<br />لا أدري متى عرفته..أكثر ما أعرفه عنه نداؤنا المشهور..يا علي كراسي كبيرة..لأن معظم الشلة من أصحاب الوزن الثقيل الذين لا تستوعبهم الكراسي العادية..فيأتي مهرولا مبتسما..بالكراسي وهو يقول أهلا بالأساتذة أهلا بالباشوات..ويجلس الباشوات الذين هم شلة أصدقائي .. وتمتد الجلسة والكل يطلب..زبادي باللبن أو عناب بارد أو شاي فتلة سكر برة..أصل الشلة التخينة دي كلها عاملة ريجيم وبتحب معلقة سكر واحدة !!..يأتي علي بالطلبات وقبلها ابتسامته..يخترع أي موضوع صغير يسألنا عنه من باب \"الملاغية\" وندرك تماما أن الموضوع لا يهمه وأنه مجرد \"إشتغالة\" لكننا نرد بصدق وحب.."
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124072801/http://masr.20at.com:80/article.php?sid=1188"

