[[comments]]
order = 12
subject = "كفاكم انشقاق ومهازل"
author = "مستشار مصطفي عبد الخالق"
posted = "2006-11-22"
text = "رئيس الجمهوريه ، أو الامير ، أو الملك المعين او المرشح او المستولي علي الحكم مهما كانت التسميه يعتبر الحاكم الشرعي للبلاد وله السمع والطاعة ما اقام فينا الدين ولا سمع ولا طاعة ان أمر بكفر بواح هذا هو معتقد أهل السنه والجماعة ..اما الانشقاق والمهازل والاستهزاء بالحكام فهذا أمر لا يحبه الله ورسوله وكفاك ياعاشق الكوميديا استهزاءا فوالله لو قلدوك مقاليد الحكم ما استطعت ان تقود 5 عنزات وقرد فاتقي الله في سرك وعلنك وكفي اثارة الشعب علي حاكمه واتقي الله وقل قولا معروفا او نصيحه تبتغي بها وجه الله واحمد الله انك تستطيع ان تقول ما تقول وان كان هناك قهرا كما تصورت لكنت تقبع الآن في غيابات السجون - واتحداك بالنشر"
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124072801/http://masr.20at.com:80/article.php?sid=1188"

[[comments]]
order = 13
subject = "مستشار مصطفىكلام حضرتك معقول و ضحكتنى يا حسين عبد الظاهر"
author = "نيفين نيفى نوفا"
posted = "2006-11-22"
text = "بالنسبه للمستشار مصطفى انا مع حضرتك فى (بعض)ما قلت<br />بس حضرتك مش شايف اننا نضحك بدل ما نطق و نموت<br />دا مش مصداقا لقول سعاد حسنى عن كلمات صلاح جاهين فبدال ما نطق يا وله لا نضحك<br />و لكن دا مصداقا لكل اللى بيحصل ف البلد<br />اللى لو لخصناه هنقول زى ما قال تشارلز ديكنز ف اوقات عصيبه على لسان شخصيه مقهوره<br />it us all a mess<br />انها لفوضى<br />بالنسبه لحسين عبد الظاهر انا لسه مقريتش موضوعك معلش<br />بس تعليقك ضحكنى يا حسين و الله<br />حلوه موت فكره كتاب عن التعليقات<br />و ايه رايك تقرره وزاره التعليم على الطلبه ف المدارس<br />و زى ما ف ليبيا فى الكتاب الاخضر نسمى دا الكتاب الفحلقى"
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124072801/http://masr.20at.com:80/article.php?sid=1188"

[[comments]]
order = 14
subject = "الي المستشار مهم جدا"
author = "yahy"
posted = "2006-11-22"
text = "شوف ياسيتي المستشار يعني مفيش غير حسني مبارك هو ال يمسك البلد وعشان ايه ولصالح مين لصالحه هو واولادة وبس مفيش افضل منه<br />ال بيتكلم بيروح في دهيه فين طلعت السادات لا فين السادات وبعديني اسيدي كفاية 25 سنه مش كفاية يسيب غيرة يمكن يصلح<br />تبقي فيه حريه ولا انت عاوزه يجيب الكلب ابنه وتبقي التكية بتاع ال خلفوهم ايه الحياة بقت عاملة ايه واذاي والاشياء وكيلو اللحم والبصل والطماطم والمرتبات<br />تعال نتكلم عنها شويه هتكووووووووووون مصيبة انت عارف ليه عشان فيه ناس يتصرف علي حراصتهم الملاين وناس تموت من الجوع لسه الي الان ناس بتاخد 100 لا 200 جنيه بزمتك يجيبوا فردة جزمه ياشيخ حرام عليك وناس والشرطة ال الان بتحرص مين الكلاب الكبار الكلب الاول العادلي والكلب الثاني حسني واولادة ومراتة طبعا<br />ايه ال دخله جمال بيه في الموضوع طول عمرنا نعرف انه خول دخل الان وبيتكلم وبيمسك امكرفون كمان<br />ياشيخ حرام عليك ده لازم يعدم الف مرة فين عمر وهو نايم تحت الشجرة<br />فين الخلفاء فين السادات وهو بدون حرس<br />ياشيخ ارحمنا ويلة نقوم يابلد نهدها عليهم<br />كفايه كده لازم نتحد ونكون نفسنا ونخطط لقلب نظام اتلحكم ذي ما بيقولوا لان اي واحد يشز بس شويه كده ده بيقلب نظام الحكم يله نقلبة بالفعل ياصابت ياخابت<br />وكفايه كده يامبارك والي كاتب الرسالة المستشار انت ما شفتش ما حدث في الانتخابات ده مش كفيل انه يعدم حسني ورجالته كفايه<br />ارحمومتنا بقي وانقلعوا من الحكم<br />مع تحياتي"
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124072801/http://masr.20at.com:80/article.php?sid=1188"

