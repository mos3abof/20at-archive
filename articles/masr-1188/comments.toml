[[comments]]
order = 2
subject = "أحمد زين هل تعرفه؟!"
author = "أحمد زين هل تعرفه؟! ..هو صديق \"علي علبة\" لمن يجلس على المقهى وهو من ربط الرؤساء بالأحذية أو العكس صحيح وهو من كشف كروت روبي المحروقة ..هو باختصار مدير التحرير السابق حتى سلم الراية إلى أحمد نصر الدين .."
posted = "2006-11-21"
text = "قبل شهرين من الآن تلقي زين دعوة ليشارك في اختبارات قناة الجزيرة الفضائية بالقاهرة ..ومن خلال هذه الاختبارات تم إعلان فوزه ورغبة الجزيرة في ضمه إلى صفوفها بمقرها الرئيسي بقطر ..وبعد مشاورات طويلة وافق زين على العرض على أن تكون هناك فترة اختبار مدتها ثلاثة أشهر ..يقرر بعدها إما الاستمرار أو العودة من جديد لعشرينات<br />أحمد زين من مواليد القاهرة وحاصل على ليسانس دار العلوم عام 98 وهو متزوج وله من الأبناء فداء الدين وعمر .. وقد عمل فور تخرجه بشبكة إسلام أون لاين محررا بالقسم العربي بصفحة مجاهيل ومشاهير ثم مسئولا عن نادي المبدعين وأخيرا مديرا لفريق الشباب الذي أسس موقع عشرينات منذ عشرة شهور فقط ..<br />زين هو كاتب (من نحن) على عشرينات وهو أيضا صاحب مجموعة مقالات المتدينين الجدد التي تولت نشرها صفحة دعوة ودعاة بإسلام أون لاين ولاقت اهتمام النخب الثقافية والإسلامية محليا ودوليا حيث قامت صحف خارجية بإعادة تقديمها لقرائها<br />يغادر زين القاهرة عصر الثلاثاء القادم.. والعشريناتية جميعا بانتظار عودته و.. مبروك عليك الجزيرة يا عم أحمد..ومبروك ع الجزيرة أحمد زين..!"
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124072801/http://masr.20at.com:80/article.php?sid=1188"

[[comments]]
order = 3
subject = "كتاب نكت"
author = "حسين عبد الظاهر"
posted = "2006-11-21"
text = "والله فكرة يا زين .. ما تيجي نجمع \"إفهات\" الريس ونطلعها فى كتاب نكت .. والله هيوزع طحن<br />يعنى خد عندك .. مما يروى عن سيدنا الرئيس أنه كان فى زيارة أحد المصانع وبيكلم إحدى العاملات فبيقولها عندك أولاد ، قالت له أه 4 يا ريس فرد عليها : انتى متجوزة ؟ وهذه النكتة عملها هانى رمزى فى فيلم محامى خلع<br />يروى أيضا ان مبارك فى افتتاح معرض الكتاب فى احد الاعوام كان يحدثه مسئول بوزارة الثقافة عن ان المحور الأساسي للندوة الثقافية هيكون \"الطريق الثالث\" - وهو الوسطية بين الرأسمالية والاشتراكية - فرد عليه مبارك : هو الطريق ده مش بتاعنا احنا.. أيوه الطريق ده بتاعنا<br />فأجابه فاروق حسنى : ايوه يا ريس هو طريق هادى وحلو<br />كان هناك مجموعة من الصهاينة يهددون بهدم المسجد الاقصى .. فصرح مبارك : هو ده وقته !!<br />ولا تنسوا أخطر افيه اطلقه الريس عندما قال ان الحرب على لبنان تهديد للبتاع ده"
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124072801/http://masr.20at.com:80/article.php?sid=1188"

