subject = "مش أقل من نيكول كيدمان"
text = "سيبك من الكلام ده<br />كله<br />المهم بيصرفهم في<br />أيه<br />و الأهم لما يجي<br />يتحاسب<br />ربنا يستر<br />يا رب طول في عمره<br />كمان و كمان و زود فلوسه<br />و أثقل حسابه<br />كده كفاية أوي<br />HMH"
