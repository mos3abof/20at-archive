[[comments]]
order = 3
subject = "حسبنا الله و نعم الوكيل"
text = "أتفق أعداء المسلمين على تدمير مصدر قوة و عزة المسلمين ألا وهو العقيدة وشباب المسلمين وهذا هو تفسير لهث الفضائيات العربية على العري و الفحش وتسفيه عقول الشباب وجعل الشباب يدورون في فلك الشهوات و التفاهات ونظرة متفحصة لحال شباب المسلمين....ستجد أن أغليهم لا يصلح لتحمل مسئولية...أي مسئولية...حتى و لو كانت مسئولية نفسه فما بالك بمسئولية الزواج....وهو غالبا فارغ عقائديا...محطم معنويا..مهزوم نفسيا أمام أمريكا(فن-تكنولوجيا-قوة نووية- طائرات-مدرعات-أقمار صناعية...)<br />أفيقوا..<br />إن الله لا يغير ما بقوم حتى يغيروا ما بإنفسهم<br />أرفعوا أنفسكم عن تفاهات الأمور و سفاسفها"
archived = "2004-07-01"
capture_url = "https://web.archive.org/web/20040701041414/http://www.20at.com:80/article.php?sid=5"

