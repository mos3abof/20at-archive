author = "قلة ادب"
posted = "2009-08-06"
text = "قلة ادب وعدم حياء<br />يعنى اية هعلى صوتى عليك<br />اسفاف وسفالة وقلة ذوق من مدعية طرب صوتها مسرسع وكانها مركبة زمارة فى حنجرتها<br />فين الرقيقة الحالمة المطربة نجاة الصغيرة انا با استناك<br />فين حبيبة مصر الست شادية لما قالت قولوا لعين الشمس ما تحماش لحسن حبيب القلب صابح ماشى<br />فين الكلمات الجميلة بتاع الزمن الجميل<br />ولاد الكلب بوظو اذنينا واضعفوا الذوق اللى عندنا"
