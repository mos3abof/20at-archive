posted = "2007-05-08"
text = "اعتقد لو كان هناك مواطن مصري محترم في وطنه باليقين كان علمه ورمزه هو الاخر سوف يكون<br />محل تبجيل واحترام منه ومن الدولة كلها.ولكن حال العلم ليس باكثر سوء من حال المواطن فكلنا<br />واعني المصريين البسطاء للاسف الشديد وآسف علي التعبير شباشب في ارجل الممكسين بزمام<br />الحكم عندنا. اذا قبل ان تبحثوا عن كرامة العلم يجب ان تبحثوا اولا عن كرامة من صنع من اجله العلم."
archived = "2009-11-05"
