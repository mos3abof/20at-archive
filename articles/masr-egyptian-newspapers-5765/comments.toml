posted = "2007-06-24"
text = "يمكن اللي بيلبسوا الشبشب ده خلطوا بين نقمتهم على الحكومة ورمز البلد!<br />وأشهد أني في الجيش أثناء فترة التجنيد رأيت مدى نقمة زملائي على العلم المصري!<br />ولن أنسى تهليلهم وسعادتهم الغامرة عندما وقفوا يوما لتحية العلم ثم فوجئوا به ممزقًا!<br />وأحد الظرفاء قال إننا نكاد نعامل العلم كالوثن!…فنحن نقف لتحيته…ثم نرتل أمامه الأناشيد…ثم نطوف حوله أثناء طوابير السير!!!!"
