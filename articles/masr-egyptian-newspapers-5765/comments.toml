text = "السلام عليكم كل ما اقدر اقوله والله حرام يعني احنا بنشوف شباشب عليها اعلام انديه اوروبيه ومالو مش مهم لاكن علم مصر لا والله لا تسلمس اي مصر انني الفدا ولكي قلبي وعزمي للجهاد وسلاما يا بلادي ان رمي الدهر سهامه التقيها بي فؤادي واسلمي في كل حيييييييييييييي ييييييييييييييي ييييييييييييييي ين"
