posted = "2007-11-05"
text = "طبعا الفقروالظروف الاقتصادية ممكن تكون سبب لكن السبب الاساسى عند الشاب الذى حمل روحه على كفه ليخوض اغوار وظلمات البحار- بعد ان استدان اوباع ذهب اهله -ويهرب بحثا عن شىء لم يجده فى مصر ..هذا الشىء الذى فقده فى بلده هو الكرامة والعيش كانسان ادمى..وبعد ان فقد كرامته فى بلده على ايدى عصابة تحكمه لاكثر من ربع قرن وتتحكم فى مستقبله ولا أمل امامه فى تغيير هذا الواقع المؤلم -على الاقل خلال سنوات عمره بعد تجهيز الوريث -ليس امامه سوى الهروب باى ثمن حتى لو كلفه ذلك حياته -وانظروا لمن نجا منهم :انكروا مصريتهم .. قتلوا الانتماء فى نفوسهم اولا..فكانت النتيجة ما نرى ..انظر لما يحدث مع الشباب داخل الجامعات لتعرف كيف قتلوهم.. ..لك الله ياشعب مصر…"
archived = "2009-11-05"
capture_url = "https://web.archive.org/web/20091105043601/http://www.20at.com:80/masr/egyptian-newspapers/5765.html"

