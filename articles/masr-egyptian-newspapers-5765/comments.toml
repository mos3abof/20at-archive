text = "ماذا حدث بالدنيا وصل الحال الى الاستهزاء بالوطن فالعلم هو من مقومات الدوله كيف يهان علم مصر بهذة الطريقة الوضيعة اليهود يحاربون ويسيميتون فى فلسطين من اجل ان يكون لهم وطن وهوية والمصريين عنده اعظم حضارة بل هى مهد الحضارة الفرعونية واليونا نية والبيزنطية وهى اول من دخلها الاسلام فى القارة الافريقية اى والحضارة الاسلاميةايضا وبعد كل ذلك يوضع العلم اعزكم الله على \"شبشب\" لما اغفل المصريين عن عظمة بلادهم ولم يعودوا يحترما هويتهم"
