[[comments]]
order = 5
subject = "الحقونا يا عالم"
author = "عاصم"
posted = "2006-06-03"
text = "احنا شعب غلبان ... بس مبيغلبش !<br />نحن لا نعدم الوسيلة والمصريين لو حطوا حاجة في دماغهم بيعملوها<br />اسمحولي الآن ان اتحدث بلا قيود .. واسمحولي باستخدام العامية في هذا الموضوع بالذات !<br />الأبطال حسب الظهور<br />1- شادي ( صاحبي )<br />2- المعلم أبو رفاعي ( صاحب القهوة )<br />3- 1 معرفوش<br />4- ضميري ( لسه مامتش )<br />5- ضميري ( بيحتضر )<br />6- عمرو خالد ( داعية اسلامي )<br />7- محمد باشا ( موزع وصلات )<br />8- ضميري ( مات خلاص او صحي مبقتش فارقة)<br />المشهد الأول<br />العبد لله : يلا يا عم شادي ، الماتش حيبدأ !! عايزين نلحق مكان !<br />شادي : اولا حنلاقي مكان ، ثانيا دي كوت ديفوار يا ابني وعلى ارضهم يعني حنشيل طين لا مؤاخذة !<br />العبد لله : لا يا حج خليك متفائل - الله ينتقم منك يا تارديلي - وحنكسب كوت ديفوار ونروح كاس العالم<br />شادي : طيب خلاص يا عم الوطني ! يلا انا خلصت أهو<br />وانطلقنا يا سادة نبحث عن قهوة بلدي لنشاهد فيها مباراة عنق الزجاجة ومباراة الأمل الأخير !<br />وشالتنا بلاد وحطتنا بلاد والشمس في عيونا والعرق والكلام ده كله<br />العبد لله : مبسوووووووط يا عم شادي مفيش مكان لرجل وتقولي حنلاقي اماكن !<br />شادي ( البارد ) : يا باشا لا تقلق .. مغلوبين مغلوبين على ايه تحرق دمك !<br />العبد لله ( شامم ريحة دم محروق فعلا ) : يا شادي يا ....... انت مبتحسش !<br />وبعد رحلة معاناة ، حطينا الرحال في غرزة - مستحيل يكون هنا art !! - سبحان الله كان عنده art ! وطبعا كنا واقفين صف عاشر .. طبعا مكانش شايفيين حاجة ، طبعا اتغلبنا<br />اقرأ بقية التعليق .."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025845/http://masr.20at.com:80/article.php?sid=388"

