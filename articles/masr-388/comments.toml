[[comments]]
order = 11
subject = "النائب العام والوصلة وعمرو خالد"
author = "newman"
posted = "2006-06-14"
text = "والله عايز اعرف السبب مابين المصنفات والشيخ صالح كامل واعرف سبب انى النائب العام يصدر قراربمصادرة الاجهزة وغرامةمالية خمس الاف جنية لاصحاب شبكات الدش مع العلم انى النائب العام ليس جهة تشريع القوانين فى مصر وصاحب الحق هو مجلس الشعب وهل المكافاة المالية اللى عرضها الشيخ صالح كامل على كل ضابظ خمسة الاف جنيةوانتم عرفين اليوم الاسود ده وبعدكدة معطاش ولا واحد حاجة وكان مصدر سخط كل ضابط مصنفات فى مصر وعمليات المدهمة الغير شرعية اللى حصلت مين السبب وعشان مين مفيش قانون صريح فى مصر يجرم الشبكات ولاقانون والعملية كلها القانون بيتلف على القانون شركة artهى مستثمر اجنبى فى مصر يعنى حق مدنى وجهة الاختصاص محكمة الجيزة يعنى بالعربى جميع القضايا المنظورة امام القضاة فىجميع محافظات مصر هم ليس جهة اختصاص وعلى المتضرر اللجوة للقضاة بس محكمة الجيزة كما منصوص فى نص العقدمع الشركةوكل العملية محدش عارف حاجةفى حاجةنادى القضاة فى الاسكندرية ناقش الموضوع ده وبعض القضايا اللى ملهاش نص صريح فى القانون وكان الراى الصح البراءة لكل هذة القضايا.... اما الشيخ عمرو خالد فى الاعلان الشهير انى الوصلة حرام الشيخ عمرو خالد هو المستشار الدينى للشيخ صالح مالك القنوات ثانيا الشيخ عمرو خالد مش خريج الازهر عشان يفتى وهو قال كدة وبعدين اى هادف هى قناة الفيلم تشنل اعلام هادف هى قناة ستار اعلان هادف وبعدين رجع قال وكذب قال انها كانت عملية دبلجة للصوت وانا لا افتى يعنى هى حرب وفى الاخر الوصلة تكسب لو الحكومة المصرية رخصتها هاتكسب وبعدين كل اصحاب الشبكات عندهم بطاقة ضريبية مكتوب فيها شبكة دش وللعلم فى حاجة اسمها الاحتكار ودى جريمة ممكن يعاقب عليها الشيخ صالح وفى الاخر الوصلة تكسب وتحيا مصر"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023230/http://masr.20at.com:80/article.php?sid=388&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

