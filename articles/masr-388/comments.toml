subject = "بلد الفساد ... يابلدى"
author = "مصرى مصرى بجد"
posted = "2006-05-28"
text = "اولا شكرا ليك على الموضوع<br />ثانيا مفيش حكومة زى حكومتنا بتتلذذ بتعذيب الشعب الحكومة عارفة ان الماتشات هى المتنفس الوحيد للناس ومع ذلك بيحاولوا يعكننوا على خلق الله يعنى السبعة مليون دولار اللى هيدفعوهم لشراء حقوق النقل للمباريات خلاص بقوا مبلغ كبير على الحكومة طيب دول ممكن يتوفروا من مصاريف ملهاش لزمة بتصرفها الحكومة زى حكاية دورات تدريب الموظفين على الابتسام والهبل اللى بيعملوه ده حكومة فسادستان على رأى عمنا احمد رجب لو وفرت 10 دقايق فقط من السرقة هيجمعوا المبلغ المطلوب . مثلا سفريات المسئولين اللى ملهاش لزمة وخصوصا رحلات الريس الميمونة اللى مبنستفدش منها غير قلة القيمة لو وفروا جزء من المصاريف الهبلة دى كان حالنا بقى غير كده خالص لكن تقول ايه حاميها حراميها ! معلش ياشعب مصر"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025845/http://masr.20at.com:80/article.php?sid=388"

