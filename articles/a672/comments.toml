subject = "يا ريت"
text = "يا سيدي يا ريت<br />أي حد ليه في موضوع التمويل الخليجي يقول الله يبارك لكم<br />احنا مستعدين نشمشم الريحة دي قوي<br />بالمناسبة الاخ اللي باعت التعليق السابق:<br />هل الخليجيون كفار؟<br />هل فلوسهم حرام؟<br />هل لو فيه تمويل من أي إنسان عربي أو مسلم او حتى غير مسلم ولا عربي ولكن له أهداف محترمة أو راضي على الأقل على أهداف محترمة زي الموقع ده مينفعش نشتغل معاه<br />يا ريت والله يا عشرينات تشوفوا الوليد يمولكم<br />ولا هو هيمول الهلس بس<br />على رأي واحد لما قالوا إن إسرائيل بتمول الجزيرة وإسلام اون لاين قال والله تشكر يا أخي أنها بتعمل حاجات مفيدة كدة"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018194200/http://www.20at.com:80/article.php?sid=672"

[[comments]]
order = 6
subject = "وائل عباس"
text = "مصيبتنا كمصريين اننا غير مدركين ان احنا طيبين زياة عن اللزوم وان فيه ناس بتغير مننا ومن ريادتنا وعاوزين يحتلوا هذا المكان والريادة وده عن طريق تخريب مصر من الداخل ... ولاحظوا ان انا باتكلم عن اخوة عرب مش عن اسرائيل ... يعني الطعنة بتيجي من الظهر ... تذكروا دعوة شهيرة يقولها المصريين اللهم عليك باصدقائي اما اعدائي فانا كفيل بهم<br />بالمناسبة اسلام اونلاين تمويل قطري<br />وما ادراك ما قطر<br />لاحظوا ايضا ان قناة الجزيرة لا يمكن ان تذيع خبرا يمس قطر واميرها<br />لكن اي خبر يخص مصر وتاريخها بالذات لو كان سيء فيا مرحب بيه"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018194200/http://www.20at.com:80/article.php?sid=672"

[[comments]]
order = 7
subject = "ياريت اللي جرى ما كان"
text = "الحداية ما بتحدفشي كتاكيت<br />ومافيش تمويل لوجه الله خالص ابدا<br />ومن يقول بغير ذلك فهو ساذج كفانا الله حسن نيته<br />هناك اخ ذكر مثال احتكار مباريات كرة القدم في مصر<br />وشخص تحدث عن احتكار المطربين<br />وهذا بالفعل حدث في الثمانينات<br />بل وتحدث عن هذا مسلسل ابو العلا البشري الشهير صراحة"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018194200/http://www.20at.com:80/article.php?sid=672"

