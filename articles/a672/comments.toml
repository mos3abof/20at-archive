text = "أن صاحب السمو الملكي الأمير الوليد بن طلال بن عبدالعزيز أل سعود . حفظة الله ورعاه.<br />ملك من ملوك الأرض . وليس مجرد رجل أعمال ناجح.<br />فالواجب اذا ذكروا ملوك الأرض ان يذكر ابو خالد من ظمنهم . فكما تعلمون ويعلم الجميع انه وعبر العصور كان هناك ملوك . ولكنهم لو عاشوا في عصر الوليد بن طلال .ليس بعيدا ان يعبدوه اويقربوا له قربانا .<br />اتمنامن الله العلي القدير ان يوفقه وان يزيد في عمره<br />وان يمتعه بالصحة والعافيه .<br />وجميعكم يعرف ان الفقر فتنه والغنافتنه .<br />وصاحب السمو الملكي الامير الوليد بن طلال يعيش في فتنة الغنا ومع ذلك ثبت كالجبل الشامخ .<br />واذا دل ذلك على شي فإنما يدل على انه ملك . وهذا ليس بالغريب على أبناء جلالة الملك عبدالعزيز طيب الله ثراه.<br />مــــــــــــــــــــــــــــــــع تحيات////<br />الــــــصـــــــــــــقــــــــــر الجارح؟؟؟<br />munsaher_2005@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151852/http://www.20at.com/article.php?sid=672"

