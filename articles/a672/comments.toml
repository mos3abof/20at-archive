text = "الوليد بن طلال يقدم لنا الدين المسطح في قناة اقرأ<br />ويقدم لنا العري والعهر بعرض الافلام القديمة بكامل مشاهد العري والجنس التي حذفتها الرقابة على قنوات الافلام<br />عن اي فائدة يتحدث الاخ؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
