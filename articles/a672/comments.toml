[[comments]]
order = 18
subject = "إلى المتملق المدعو وائل"
text = "أنت معجب جداً بالشيخ الشعراوي رحمه الله ، وقد قرأت لك عدة مرات مما تسميه مقالات - وهي تفتقر إلى شروط المقالة - تهاجم فيها ابن تيمية وتدافع بشراسة عن الشعراوي .<br />والسؤال الذي يطرح نفسه يا محب الشعراوي لماذا لم تتجرأ بالرد على عطية زاهدة في جريدة عرب تايمز وهو يكفر الشعراوي ويكيل له التهم ؟<br />أعتقد السبب واضح فهو أنك تخاف أن يغضب عليك عطية زاهدة خاصة أن لسانه أطول من لسانك ، وكذلك تخشى غضب مدير تحرير هذه الجريدة ( عرب تايمز ) التي أقل ماتوصف به أنها صفراء وتسمح بالهجوم على كل ما هو إسلامي وكل ذلك في سبيل أن يكون سيدك زهير جبر مدير التحرير راضياً عنك وينشر ما تسميه (مقالات ) وليت شعري يعود للحياة بعض من جهابذة الأدب كالرافعي والعقاد ليروا مدى تدهور الحال الذي آل إليه الأدب ليصبح مثلك كاتباً وعضواً في الصحافة حتى لو كانت الكترونية ."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018194200/http://www.20at.com:80/article.php?sid=672"

[[comments]]
order = 19
subject = "وائل عباس"
text = "هل تعليقك هذا له اي علاقة بالموضوع ؟؟؟<br />الاستاذ عطية زاهدة بيحترمني وباحترمه<br />وهو حقيقة يزيد عني انه دافع عني وعن مقالي<br />اه نختلف في امور<br />لكن مش معنى كده اننا نتخانق وده منى عينك طبعا<br />لاننا مش زي عينتك ومستوانا غير مستواك<br />الذوق بيتعامل بالذوق<br />اما قليل الادب زيك عاوز الدنيا تبقى حريقة<br />ولا يهمه امه ولا ابوه ناهيك عن الشعراوي<br />لو كنت مخلص كان كلامك بقى غير كده ..."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018194200/http://www.20at.com:80/article.php?sid=672"

