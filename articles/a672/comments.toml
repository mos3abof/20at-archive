subject = "مصيبة"
text = "مصيبة كبرى<br />هذا الامير يشتري اصول الافلام المصرية القديمة كلها ويدفع بسخاء<br />قريبا تراث مصر السينمائي كله في ايدي غير المصريين<br />وابناؤنا لن يعرفون غير هنيدي واللمبي واحمد السقا<br />لانه لن يتبقى لهم تراث في المستقبل من افلامنا القديمة العظيمة"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018194200/http://www.20at.com:80/article.php?sid=672"

[[comments]]
order = 11
subject = "محزن"
text = "أنا من السعودية<br />ولكن لا أوايد ما يقوم به الأمير الوليد بن طلال من استثمار في قنوات الاغاني التي تبث الفحش والعري.<br />ولكن قراءت كلاما هنا تفوح منه رائحة جاهليه!! رائحة العصبيه !! التي قال عنها الرسول الكريم صلوات الله وسلامه عليه \"دعوها فإنها منتنه\" .<br />(رائحة تميل خليجي) (إحنا المصريين طيبين وهم بيغيرو مننا لأننا نملك الريادة!!) (روتنا بتاخذ المطربين المصريين وتغمرهم وتشهر المغنيين الخليجيين على حسابهم!!)<br />أنا حزين جدا ً أن أسمع مثل هذا الكلام يتردد بين أخوة في الدين واللغة والمصير!!<br />تكريس مفهوم القوميه هو تكريس للجاهليه.. لافرق لدي بين مصري وسعودي او خليجي ... لا فرق إلا بالدين قال الرسول الكريم (لا فرق بين عربي ولا أعجمي إلا بالتقوى)<br />أتمنى أن نتنبه لمث هؤلاء والذين يحاولون دق اسفين افرقه بين المسلمين بكل شكل ممكن بالقومية بالرياضة بالفن بالسياسة باي اسلوب كان .. يجب ان ننتبه ونفوت الفرصه عليهم وننصح اخواننا الذين قد يقعون في مثل هذا الامر بدافع حسن نية او بدافع الجهل فعلينا تنبيههم إلى أن مثل هذا الامر لا يصح بين الاخوه المسلمين..<br />دمتم طيبين متحابين وتآخين،<br />وأبعد الله عنكم العصبيه والجاهليه ورد كيد من يبثها في نحره إنه سميع مجيب الدعاء،،،"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018194200/http://www.20at.com:80/article.php?sid=672"

