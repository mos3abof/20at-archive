subject = "walidchouia@hotmail.com"
author = "سم الله الرحمان الرحيم."
text = "من وليدالجزائري الى الاخ الوليد بن طلال.<br />لا اعرف ادا كنت تقرا هده التعاليق لكنك ربما تقراها يوما.<br />مهما قيل عنك فانت رجل عربي مسلم ابواب الجنة مفتوحة لك ولغيرك من المسلمين ولن تغلق ومن يدري مادا عملت من الخير كي تلج هده الابواب اما عن مالك هدا واللدي ينتقدك من اجله الكثيرون فتمتع به واشكر الله فان الله يحب ان يرى اثر نعمته عليك فقط كنصيحة ادا كنت تقبلها مني حاول ان تعمل لاخرتك كما تعمل لدنياك كي يديم الله عليك النعمة في الاخرة كما ادامها عليك في الدنيا.<br />واتمنى لك اخي من كل قلبي كل التوفيق وان يهديك الله لما فيه الخير لنفسك اولا ثم لمن اراد له الله الخير على يدك."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151852/http://www.20at.com/article.php?sid=672"

[[comments]]
order = 37
subject = "الوليد بن طلال بن تعجز النساء ان تنجب جزمته......"
author = "نا اعرف ان كلامي يؤلم الكثير والكثير من الناس"
text = "ولكن هذا هو الواقع.<br />طيب من الذي اعطاه؟ اليس الله . نعم الله الذي اعطاه<br />المال والجاه. فلماذا الحسد؟<br />المهم انا بصراحة حبيت ان اوضح للكثير من الناس<br />أن سمو الامير الوليد بن طلال حفظه الله.<br />يتبرع ويتصدق ويؤدي الزكاة سنوياًً.<br />ولو أنه لا يقوم بهذه الواجبات لكان اثرا رجل على<br />وجه المعمورة.<br />عشت ياأبو خالد ذخرا للعالم .<br />مع تحيات الصقر الجارح؟؟؟<br />munsaher_2005@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151852/http://www.20at.com/article.php?sid=672"
