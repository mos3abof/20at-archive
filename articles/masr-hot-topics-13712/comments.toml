text = "اقتباس جيمي:<br />حلو<br />بس أنت نسيت تقول ان الحصة الفاضية في فصل الولاد في الثانوي بتعني تدخين الحشيش و السجاير وشرب الشاي و مطالعة آخر عدد من احد المجلات الجنسية و الفرجة علي افلام جنسية علي الموبايلات وخلع خشب الديسكات من أجل المرح وعلشان يضربوا بعض بيها .. وهكذا وفيه حاجات تانية مش هقدر اقولها .<br />وكنت بتساءل بس .. هو مش المفروض أن شوشو يبقى ليها تواجد أكتر من كدة<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />هو بالفعل شوشو دورها كبير في اليوميات ياريت بس نتابع بصبر شوية اه لازم تكون متشوق ودة اشكرك عليه لكن في تفاصيل كتير بالنسبة لشوشو عموما اشكرك على فضائح حصة الولاد الفاضية وهيكون لها دور بس يعني في فرق بين موضوع بيرصد موضوع بعينه وبين اليوميات لان الاخيرة بتعرض جزء يوصلنا لنقطة تانية في الدراما عموما بكرر شكري ليك ولكل القراء"
archived = "2009-12-27"
