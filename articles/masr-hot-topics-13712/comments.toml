posted = "2009-10-14"
text = "حلو<br />بس أنت نسيت تقول ان الحصة الفاضية في فصل الولاد في الثانوي بتعني تدخين الحشيش و السجاير وشرب الشاي و مطالعة آخر عدد من احد المجلات الجنسية و الفرجة علي افلام جنسية علي الموبايلات وخلع خشب الديسكات من أجل المرح وعلشان يضربوا بعض بيها .. وهكذا وفيه حاجات تانية مش هقدر اقولها .<br />وكنت بتساءل بس .. هو مش المفروض أن شوشو يبقى ليها تواجد أكتر من كدة"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227202455/http://www.20at.com:80/masr/hot-topics/13712--4.html"

