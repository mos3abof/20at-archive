[[comments]]
order = 20
subject = ""
author = "أحمد حموش"
posted = "2009-03-11"
text = "مقال من هسبرس لأحمد حموش<br />Wednesday, March 11, 2009<br />قبل عام من كتابة هذه السطور، التقيت زميلة فرنسية، تشتغل دكتورة باحثة في المركز الوطني للأبحاث العلمية بفرنسا، وعلى هامش ندوة فكرية بمكناس فاجأتني بسؤالها: ما كل هذه القسوة في الإسلام في تعامله مع الشواذ جنسيا؟.. وباختصار فالزميلة الباحثة ترى أن ما أسمته الاختيار الجنسي هو حرية شخصية وقرار من حق كل فرد لوحده الحسم فيه. سألتها: ماذا تعرفين عن الإسلام من غير قضية الحدود الشرعية ومسألة الشذوذ؟ وقفت صامتة وحاولت لملمة بعض الأفكار من هنا وهناك لإثبات أنها تعلم أشياء كثيرة عن الإسلام بما يؤهلها \"للحكم عليه\".. أخبرتها أنها وهي الدكتورة الباحثة التي غدت مرجعا مهما في مجال اختصاصها عجزت عن اختراق الدائرة التي رسمها الإعلام والكثير من الكتاب والمفكرين الغربيين ـ ومن بينهم مسلمون للأسف ـ للدين الإسلامي، واختزلوه وهو الدين العظيم الذي يمنح تفسيرات واضحة للأسئلة المرتبطة بالكون والحياة والجماد، في مجموعة من الممارسات التي يفهم من خلالها أن الإسلام هو دين العنف والبشاعة. أما إذا وضعت في سياقها الطبيعي الشامل، فالصورة ستكون أوضح، وحروف الرسالة سيستطيع الجميع قراءتها بشكل صحيح… ولحظة قراءة الرسالة بشكل صحيح وسليم، ليس هناك من حل أمام الآخر سوى الإيمان والاعتقاد بها، والأفواج التي تدخل في هذا الدين سنويا خير دليل على ذلك.<br />وجدتني بعد هذا الاستطراد أوجه لها سؤالا ظهرت معالم الدهشة على وجهها وأنا أطرحه، وهو \"تصوري لو أن فرنسا أفاقت ذات صباح لتجد كل الذكور الفرنسيين تحولوا إلى شواذ، بينما النساء تحولن إلى سحاقيات\".. ابتسمت الزميلة العزيزة وأجابت بسرعة خاطفة أن \"هذا سيناريو مستحيل\".. طلبت منها أن تتصور حدوث هذا \"السيناريو المستحيل\" ولو للحظات، فكان أن شردت بذهنها وغيرت وجهة النقاش إلى الاستفسار عن بعض الفتاوى.. لم أمنحها الفرصة، وقلت لها إنه في حالة حدوث هذا السيناريو فالفرنسيون سينقرضون ويندثرون من على وجه الخريطة البشرية للعالم… وإذا ما اعتمدنا وجهة نظر المدرب الأمريكي العظيم \"دال كارنيجي\" (توفي عام 1955 وله مؤلفات مهمة أعد زملائي وزميلاتي من القراء تخصيص عمود لاحق له) بأن عظمة الأشياء هي في بساطتها، طلبت من الزميلة الفرنسية أن تسمح لي بعرض وجهة نظر ساذجة تبعا لنظرية \"انقراض الفرنسيين\" هذه…<br />فـ \"الطبيعة\" ـ كما يسميها العالم والقدرة الإلهية كما نسميها نحن ـ اقتضت أن تكون علاقة المرأة والرجل هي العلاقة الصحيحة التي تستمر باستمرارها الحياة، وإذا ما أصاب هذه القاعدة البديهية أي خلل، فالاستمرارية تلك ستتأثر بالتأكيد. والعقل الغربي المبدع الذي اخترع كل ما نراه، يستطيع أن يتأمل الجهاز التناسلي للمرأة فيرى أن المهبل والرحم والمبيض له وظيفة معينة، هي احتضان الجنين البشري لفترة تسعة أشهر ـ أو سبعة أحيانا ـ ثم دفعه ليخوض تجربته في الحياة خارجا. وكذلك هذا العقل الغربي المبدع يستطيع أن يتأمل الجهاز الهضمي للمرأة والرجل على حد سواء، فيرى أنه ينتهي بشرج متخصص في طرح فضلات ما يتناوله الإنسان، وعلى الإنسان المداومة على تنظيفه وإلا فالروائح الكريهة ستجعل الناس تفر منه… ولا يستطيع أي عقل غربي مبدع الادعاء بأن هذا الشرج متخصص في شيء آخر غير طرح الفضلات، هكذا ببساطة… معتذرا مسبقا عن مشاعر التقزز التي قد تصيب قارئ هذه الكلمات، لكن هذه هي الحقيقة.<br />ولا أخفي شعوري بالدهشة وأنا أتحدث عن هذه الحقيقة البسيطة الواضحة، والتي يعلمها الصغير والكبير على حد سواء، فيما يتنكر لها الكثيرون رغم كونها حقيقة بسيطة واضحة..<br />لكن المشكل هو أن العقل الذي أبدع الذرة وثورة التكنولوجيا الهائلة، عاجز تماما عن تفهم هذه الحقيقة البسيطة، واخترع لنا شيئا اسمه \"حرية الفرد في منح شرجه دور آخر غير ما خلق لتأديته\".. (الشذوذ الجنسي طبعا ظهر قبل القرون الحديثة لكن أتحدث هنا تجاوزا عن العصر الذي نعيشه)..<br />لنتصور جميعا أننا أحضرنا فريقا طبيا أمريكيا مثلا، وقلنا له إن للفم دورا جديدا هو السمع، أو أن للأذن وظيفة أخرى هي الشم، أو أن للكلى دورا جديدا هو المشي.. ماذا سيظن هؤلاء بعقولنا؟ لكن أن تقول لهم إن ممارسة الذكر للجنس على الذكر في الشرج المخصص لطرح الفضلات، فهذا ليس أمرا مقززا على الإطلاق، بل سينقسم الفريق الطبي إلى ثلاثة أقسام: قسم مع وقسم محايد وقسم ربما ضد..<br />المثير أن النقاش تطور في إسبانيا وفرنسا وأمريكا وكثير من الدول الأوروبية، إلى الحديث ليس عن حقوق الشواذ ـ وهذا أمر تحقق ـ بل عن حقهم في التبني وإنشاء أسر وعائلات …إلخ. بعضهم ممن يملؤون الشاشات الفرنسية يقولون إن للشواذ ـ ذكورا ونساء ـ الحق في ممارسة عاطفة الأبوة والأمومة من خلال استيراد أطفال من أسر طبيعية.. مصيبة حقا فهم هؤلاء، وهم على الأقل يعترفون ـ وقد عجزوا ـ أن ما هم عليه من وضع ليس طبيعيا ولا يمكن أن يكون كذلك…<br />وذكرت الزميلة الفرنسية بنقاش ساخن جدا جرى على شاشة قناة فرنسية جمع بين شواذ بمختلف الأنواع مع عالم اجتماع وعالم نفس، وبدا فيها هذان العالمان يائسان من مستقبل فرنسا، وحذرا من أن الاستمرار في الاستهتار ببنية المتجمع الفرنسي يقود البلاد إلى الهاوية. هاوية قريبة مما طلبت من الزميلة الفرنسية تصوره لو تحولت فرنسا بين عشية وضحاها إلى مجموعة من الشواذ والسحاقيات…<br />لقد صدق الله تعالى وهو يحذر الإنسان من أن يتخذ إلهه هواه، ففي هذه الحالة يعجز المرء عن تصور المجهول الذي يقوده إليه هذا الهوى.. وإذا اختصرنا الحديث عن \"الهوى الجنسي\"، ففي الوقت الذي بدأت فيه العلاقة طبيعية: امرأة ورجل، تطورت لنوع من الإباحية بتفصيلاتها كلها، ثم لم يعد الإنسان الغربي يجد متعته في ذلك وهو يرى العري في كل مكان، فتطورت الأمور بعدها إلى جنس مختلط، ثم إلى تحول جنسي، ثم إلى ممارسات جنسية جماعية، ثم إلى \"التبادلية\" التي تتم خلال حفلات جماعية ويتم فيها تبادل الأزواج والزوجات، ثم إلى الزواج المتعدد والزواج مع المصاحبة… إلخ.. وكانت آخر التقليعات ـ بحسب علمي ـ الممارسة الجنسية برفقة الحيوانات، وهنا لا أستطيع الاستمرار لأن التقزز بلغ من نفسي مداه…<br />المهم أن اتخاذ الإنسان هواه ورغبته إلها، هوى به كل هذه المهاوي وأخرى غيرها مما لا يعلمها إلا الله..<br />طيب فكرة أخرى، لماذا لا تنشر الدراسات الخاصة بالأمراض القاتلة التي يتسببها فيها الشذوذ بشكل خاص، والإباحية الجنسية بشكل عام؟ بالله على كل من يقرأ هذا المقال تخصيص دقائق للاطلاع على بعضها وعلى بعض المقالات بهذا الشأن.. ويحضرني هنا شريط سينمائي للمثل الأمريكي طوم هانكس، الذي خصصه للشواذ جنسيا ومثل قصص بعضهم.. المثير أنه قبل الانتهاء من إعداد الفيلم وبدء عرضه على الشاشات، كان أغلب الشواذ الذين تواصل معهم هانكس عاجزين عن مشاهدة الشريط.. ببساطة لأنهم كانوا قد توفوا بسبب السيدا. والمريض بالسيدا لا يمرض لوحده ويموت لوحده، بل ينقله قبل ذلك إلى ما يعلم عدده إلا الله، برغم الاحتياطات التي يدعي أصحابها أنها تمنع من انتشار المرض..<br />وبمناسبة ذكر الله تعالى، أين الدين في كل هذا؟.. هنا أعترف للقارئ الكريم أن من أسماء الله الحسنى التي تثير في نفسي الرغبة في التأمل دوما، هو اسم \"الصبور\".. الأكيد أن كل هذه الجرائم التي ترتكب في العالم بأسماء متعددة، تستوجب استئصالها من الأرض لكن الله \"الصبور\" كثير الصبر، الحليم، قد جعل لكل شيء أجلا مسمى..<br />فمن ابتلي ـ أو من ابتليت ـ بهذا الداء فليتعالج وهذا من حقه على المجتمع وليس عيبا أن يعالج، العيب كل العيب أن يشرعن مرضه، ويتبع أصحاب الشمال في غيهم، فيلقى ربه وهو غضبان عليه، فيكون جزاؤه جهنم وبئس المصير.. وكل شيء يغفره الله قبل الوفاة أفليس هو القائل \"قل يا عبادي الذين أسرفوا على أنفسهم لا تقنطوا من رحمة الله، إن الله يغفر الذنوب جميعا إنه هو الغفور الرحيم\"..<br />إن التطبيع مع الحرام وبخاصة الشذوذ طامة ما بعدها طامة، لكن سيبقى الشذوذ شذوذا ومرضا مهما ادعى المدعون.. والمرء حقيقة تصيبه حالة من الإحباط وهو يتابع ما يجري، لكنها حالة سرعان ما تنجلي حينما يتطلع الإنسان إلى السماء فيعلم أن للطبيعة البشرية الفطرية النظيفة ربا يحميها… اللهم قد بلغت اللهم فاشهد، اللهم قد بلغت اللهم فاشهد، اللهم قد بلغت اللهم فاشهد…"
