text = "انا شاب ابتلاني الله بهده المعضلة الا انني لم امارسها في حياتي و السبب يعود الى حسن خلقي و اخلاقي و الفضل يعود لربي و للوالدين مشكلتي في الحياة التي اعتبرها مسرحا بالنسبة لي لانني مند استيقاضي في الصباح الى ان تغفى اجفاني و انا ادعي ما الا انا عليه سواء ضاهر للعيان لكن الله و حده يعلم ما تخفيه سريرتي و ما تحتويه نفسي من صراع مع \"حاجياتي\" احترامي للعقلية العربية و المبادء الراسخة و القيم و شعور والدي كانو رادعي و كدالك تقديري لنفسي بغض النضر عن هواها الحمد لله انا الا ن في 27من عمري رضيت بقسمة الله لي و التمسه راحتي بالهداية فقط اريد ان اشير الى القراء الشدود لا يتعلق داءما بالجنس بل بالاحساس \"الشعور بالحب\" و الحاجة الى دفى المشاعر"
