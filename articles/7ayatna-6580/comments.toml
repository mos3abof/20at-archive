text = "اخي محمد تتساءل كيف تجمع بين حبك لدينك منذ صغرك و العياذ بالله من هذا الفعل الشنيع اقول لك وببساطة ارجع الى الله عود الى الله تب توبة نصوحة اقرا القران عاشر الموءمنين بالله تمسك بروادت المساجد والصلاة مع الجماعة ولا تفارق معاشرة الاخيار وابتعد على كل ما له صلة بهذا الموضوع وصوم لله على الاقل يوم الاثنين والخميس و ان استطعت الزواج تزوج وكن على علم بان من يقترف هذا الجرم الشنيع المشين فان مصيره النار والعياذ بالله وادرك نفسك قبل فوات الاوان لان الدنيا كما تعلم كانها ساعة واجعلها طاعة والله ينعل هذه الشهوة وهذا الشذوذ الذي يدخلني النار خالدا فيها واخيرا اقول لك اتق الله يجعل لك مخرجا ويرزقك من حيث لا تحتسب والسلام على من اتبع الهدى"
