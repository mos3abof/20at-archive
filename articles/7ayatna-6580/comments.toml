author = "محمد نواف الحمدالله ..."
posted = "2008-01-03"
text = "لقد تناسيتم // ولم أقل نسيتم // لأنكم قاصدون بهذا الشيء .. كل مافي هذه الدنيا من حروب بكافة أشكالها .. من مشاكل لها أول و ليس لها آخر .. من فقر وجهل ومرض .. من حرمان وجوع وعطش .. من ظلم ( طاغي ) وألم ومر وذل وقهر واستبدادوإضطهاد .. من قتل وسفك للدماء التي حرمها الله الإ بالحق .. من تكبر وتجبر وطغيان .. من حزن وأسى وعواطف مريرة .. من إرهاب يفتك بنا .. من شتم وإعتداء على الوالدين ونهرهما ومعصيتهما، وعند الكبر روميهما في دار المسنين (( أعوذ بالله بكل مايغضب الله )) . // يارضا الله ورضا الوالدين // ،،،<br />من ظلم الإنسان لأخيه الإنسان .. من الأمراض والأوبئة التي تهل وتزخ علينا كقطرات المطر .. من جشع وطمع وأنانية الإنسان في كل شيء .. من ومن ومن ومن … الخ (( كل يوم يولد شيء جديد في هذه الحياة )) .. سامحوني إن أطلت عليكم .. ولكن هذه الأمور وغيرها من الأمور الأخرى يجب أن لانغفل عنها مطلقاً .. وأيضاً منطلقاً من قوله تعالى (( وذكر إن نفعت الذكرى )) . // سلامي للجميع //"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020359/http://www.20at.com:80/7ayatna/6580.html"

