text = "بسم الله الرحمان الرحيم والصلاة والسلام على اشرف المرسلين اما بعد الحمد لله نحمده ونستعينه ونستغفره ونعود بالله من شرور انفسنا ومن سيئات اعمالنا من يهده الله فلا مضل له ومن يضلل فلا هادي له واشهد انا لا الاه الا الله وان محمد عبده ورسوله اما بعد فان خير الكلام كلام الله وخير الهدي هدي سيدنا محمد وشر الامور محدتاثها وكل محدثة بدعة اما بعد فيا عباد الله افلا تتدبرون القران لكي تعلمو كيف اخد الله الظالمين اخد عزيز مقتدر الم ياتكم نبا قوم لوط كيف املى لهم الله وحين اخدهم لم يفلت منهم احد تالله انكم تجحدون النعم التى انعم الله عليكم فالله خلقنا من دكر وانثى ازوج ولم يامرنا بتيمم الخبيث فسبحانه حرم علينا الزنى بين دكر وانثى وهي من اكبر الكبائر فما بالك باللواط والسحاق فانتهو خير لكم فانكم لاتعجزون الله في شي ان اراد ان يعدبكم فاتقو الله قبل فوات الاوان فان الله غفور رحيم لمن تاب واتقى وشديد العقاب للظالمين وما ظلمونا ولكن كانو انفسهم يظلمون"
