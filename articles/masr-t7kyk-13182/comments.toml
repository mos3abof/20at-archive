author = "فبركه واستهبال"
posted = "2009-09-05"
text = "يا رغداء بندق كل دي فبركه يا حبيبتي ولا تمت للواقع بأي شيء<br />في افتتاحية المقال لما رجعتي من بره الظهر وامك قالتلك حتاكلي دلوقتي ولا لما تصحي فقلتلها لما اصحا تدل دلالة قاطعة على ان الموضوع كله فبركه<br />لان مستحيل حد اي حد سواء كان طالب او شغال بيرجع الظهر وبينام من غير ما ياكل<br />وفيه حاجات كتير اوي في المقال مهروشه<br />زي بالضبط طبيب الاطفال اللي امه بتأكله<br />ايه يا بت الفبركه الزفت دي<br />يعني لازم تفوري دمي على المسا<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ تتت<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-09-16"
capture_url = "https://web.archive.org/web/20090916091901/http://www.20at.com:80/masr/t7kyk/13182-2009-09-05-11-46-28.html"

