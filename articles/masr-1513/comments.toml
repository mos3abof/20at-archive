subject = "ارشح مهاتير محمد"
author = "مصرى"
posted = "2007-01-29"
text = "ياكاتبنا العزيز تسالنا نرشح مين - مهاتير محمد تولى الحكم ودخل الفرد 500 دولار فى السنة فى بلدة وترك الحكم ودخل الفرد 12000 دولار فى السنة - هو دة مقياس الانجاز والنجاح لاى رئيس<br />انما احنا فى طريق الانهيار الذى يمر بالجحيم<br />من سىء الى اسوأ والحبل على الجرار"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032504/http://masr.20at.com:80/article.php?sid=1513"

[[comments]]
order = 2
subject = "عمر موسي ههههههههه"
author = "جورج ابراهيم"
posted = "2007-01-29"
text = "انا موش فاهم عمر موسي ده راجل لا يقنع عاقل راجل منظر فقط يقنع السذج وعامل لي فيها فله اولا راجل اثري ثراء فاحش منذ تولي مبارك الحكم وطقاق حنك ولا يجرؤ علي تغيير اداره مدرسهواي واحد حسني مبارك اختاره لمنصب فيه في شخصيته شكوك قويه والعملاء العرب اختاروه طرطور للجامعه العربيه ليس من فراغ بل لانه فسوخه وخيال ماته واهه يسافر يمين وشمال ومفيش حاجه حاصله فربنا يبعدنا عن النصابين والافاقين والامعات"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032504/http://masr.20at.com:80/article.php?sid=1513"

[[comments]]
order = 3
subject = "فعلاً كده"
author = "إحنا عايزين رئيس ليس سابق ولكن حالى يصلح حال مصر ويعيد لها دورها القيادى وينهض بها لإن منصب الرئيس الآن شاغراً وأنا فعلاً فى إعتقادى إن السيد عمرو موسى رجل سياسى من التراث الآول وهذا ما أزعج مبارك منه فنفاه لجامعة الدول العربية وهو يعرف جيداً أنه أكفء من هذا المنصب."
posted = "2007-01-29"
text = "وإللى عماله تهاجم عمرو موسى أحب بس أقولها قوليلى إيه خبرة مبارك ووصل مصر لإيه ومنين جاب المليارات بتاعته هو وولاده ومراته وحال الشعب بقى إيه فى ظل حكمة دى السادات قال عليه أنا جايب نائب مالوش فى السياسة خالص وطبعاً بالإضافة لكده هو ملوش فى أى حاجة وكل إللى عمله أنه حكم بالدكتاتورية والتهميش حتى لا بقف أحد فى وجهه محمياً بعصا وحذاء الأمن المركزى وفين بقى خبرته السياسية ولا إنجازاته سوى النهب والبطالة وبيع المصانع والشركات والفقر ومعزرة لو كنت نسيت باقى الإنجازات الجسام له<br />لا أمل إلا بحكم جديد ودستور جديد من الشعب وللشعب ونعم ونعم ونعم للسيد عمرو موسى رئيساً لمصر بكل فخر"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032504/http://masr.20at.com:80/article.php?sid=1513"

[[comments]]
order = 4
subject = "3agab"
author = "سنة 2010 خرج روح صلاح الدين الايوبي ونظرت الي العالم وصراعاته فتعجبت من حال الامه فلم تستطيع ان تمنع نفسها من التدخل ونصرة الامة كعادتها القديمة . الا انها يجب ان تتجسد في شخص ما حتي تستطيع التعامل مع الجنس البشري لانها في حالة روحية... بحثت روح صلاح الدين عن هذا الجسد الذي يمكن من خلاله تنفيذ مخططها لاصلاح الاحوال واحتارت في الامر لانها وجدت مئات ومئات تتطابق اوصافهم ونفوسهم مع صلاح الدين الايوبي .. واخيرا استقر امر الروح ان تتجسد في رجل في العقد الخامس من عمرهافني عمره في خدمة المجتمع بضمير وحق وعدل ولم يكن في يوم طامع او ظالم ..كان صورة ثانية من صلاح الدين"
posted = "2007-01-30"
text = "ربما كان هذا الرجل قاضي او طبيب او لواء متقاعد او محامي او شيخ عرب او اي شيئ اخر الا ان الروح علمت ان له قدرات صلاح الدين الايوبي فتعجبت الروح الان هذا الرجل كان يعمل بجد ونشاط في مجال عمله الا انه منقطع عن المشاركة السياسية ربما بسبب طبيعة مهنته وربما بسبب ظروف الامة وربما بسبب ضعفه امام التيارات المعادية وعدم اقتناعه بجدوي الاشتراك في الاحزاب!!!<br />تجسدت الروح في الرجل واصبح كل أماله هي اصلاح الامه فوضع خطة اصلاحية وبرنامج انتخابي مفصل وذهب الي الاحزاب السياسية للاشتراك في العمل السياسي الا ان الاحزاب رفضته لانهم لايريدون قادة بل يريدون اتباع لرموزهم وكان ردهم ( اذا كان لك خطة وبرنامج فاذهب وعمل حزب لنفسك وقول الي انت عايزه ) فتعجب صلاح الدين فذهب الي مجلس الشعب لعرض برنامجه وخططه فقال له المجلس خطط وبرامج جميلة بس علشان ترشح نفسك لازم الشروط تنطبق والوقت كدة لم يسعفك نأسف هذا هو القانون .<br />اشتكي صلاح الدين للدستور فقال له انا صلاح الدين انا قائد الجيوش العربية كيف لا يكون لي الحق في ترشيح نفسي لانتخابات رئاسة الجم<br />اقرأ بقية التعليق .."
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032504/http://masr.20at.com:80/article.php?sid=1513"

[[comments]]
order = 5
subject = "مبارك الاحتفالات"
author = "مصرى حتى النخاع"
posted = "2007-01-30"
text = "الغريب ان الرئيس حسنى مبارك قرر كما هى العادة الاحتفال بعيد الشرطة ؟<br />ياربى هؤلاء السفاحين مهما قيل ان هناك من الشرطة ادميين لكن تظل النسبة الاكبر اشخاص دمويين فقدوا معنى ان يكونوا ادميين وفى وسط امواج الاحتجاجات من هنا وهناك وفى سط اكوام حفلات التعذيب والسادية لرجال الشرطة المصرية يخرج السيد الرئيس ليحتفل معهم<br />ويههدد بان من يمس مسيرة التقدم المظفرة ويريد العودة الى الوراء سيكون نصيبة مثل عماد الكبير ؟ اى مسيرة يتحدث عنها ؟ الا يدرك السيد الرئيس اننا اصبحنا اضحوكة الوطن العربى طيب سمى لى مجتمعا غيرنا يحلف باللحمة ؟ يشتهى الستر<br />سمى لى مجتمعا عربيا واحدا يتفق فية سواد المجتمع على شىء ثم يقوم رئيسة بعمل العكس؟<br />سمى لى مجتمعا واحدا خرج منة الطبقة المتوسطة الى غير رجعة واصبح مجبرا السواد الاعظم منة الى الاستمتاع السادى بمشاهدة علية القوم وهم ينفقون انفاقا مجنونا يكفى لسد رمق هؤلاء الناس<br />سمى لى بلدا خرجت منها الاستثمارات الى دول خليجية كنا الى فترة قريبة نتندر عليها وبقى السيد الرئيس وحيدا يتحدث عن مسيرة التقدم ؟<br />الاجابة هى : مصر"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032504/http://masr.20at.com:80/article.php?sid=1513"

