subject = "شباب إيه وهبل إيه"
author = "الحالة اللى وصلت ليها مصر من فساد لا تحتاج شاب يصلحها وطبعاً إحنا فاهمين تقصدى مين بالشاب اللى هو جيمى المدمن والشاذ يعنى أصلا مش راجل لكن السيد عمرو موسى رجل محنك ويملك كل خبرات القيادة الحكيمة وهايقدر يحل مشاكل مصر كلها بالإضافة إنه يلقى شعبيه كبيرة جداً من المصريين وهذا ما يقلك مبارك منه علشان يورث النونو كمانونو الصغنون بتاعة إللى جاى من موظف بنك عايز يبقى رئيس لمصر ياقلبى لا تحذن"
posted = "2007-02-04"
text = "أعطى العيش لخبازه ولو ها ياكل نصفه<br />نعم لعمرو موسى رئيساً لمصر بالروح بالدم نفديك يا عمرو موسى"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032504/http://masr.20at.com:80/article.php?sid=1513"

[[comments]]
order = 12
subject = "بص ياعم الحج؟"
author = "بص ياعم الحاج انتا راجل قليل الادب لية بقى ؟ علشان انا مصادرتش على افكارك انما انتا كمان بتقوللى هبل اية ؟؟؟؟ هيا اصل الحكاية مش عافية"
posted = "2007-02-04"
text = "وبعدين لما تحب تتحاور مع حد بلاش كذب ؟<br />جمال مبارك محدش بيحبة من الشعب علشان هوا مفروض علينا لكن معلومة ان شاذ ومدمن دى كذب وسخيف كمان<br />لانك معندكش دليل عليها<br />وانصحك بلاش تتكلم فى السياسة لانك معندكش اصلا فكر<br />لية بقى لان مصر مكونة من قطاعات اهما الجيش والجيش محتاج ايد من حديد علشان تسيطر علية ولو اتكلمنا عن عملرو موسى دة راجل بتاع دبلوماسية ومصر محتاجة واحد يغير الخريطة الاقتصادية تماما معناها ان مصر محتاجة واحد عندة فكر اقتصادى<br />وتانى مرة اتعلم تحترم الناس وبلاش هرتلة فى الكلام"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032504/http://masr.20at.com:80/article.php?sid=1513"
