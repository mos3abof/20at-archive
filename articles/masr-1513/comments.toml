[[comments]]
order = 9
subject = "فيه فرق"
author = "اللى كاتبه إن عمرو موسى غير كفء علشان عمره 74 عاماً اقول لها إن خبرته السياسية تزن ملايين السنوات وإن مبارك عنده 82 عاماً وبيخرف فى كل اللقاءات وليست له أى خبرات سوى العمالة والنهب والفساد والسادات قال عنه إنه مالوش فى السياسة"
posted = "2007-02-02"
text = "يعنى مبارك لا وعائلته لا والشعب هو صاحب قراره وهو اللى بيقول نعم للسيد عمرو موسى رئيساً للمصريين بكل التأييد<br />ياترى مبارك وإبنه الفاسد ها يعتقل عمرو موسى زى ما بيعتقل الآخوان المسلمين علشان يورث الحكم هى المشرحة ناقصة ميتين ولا 26 سنة نهب وفساد مش مكفيين العيلة الحرامية دى"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032504/http://masr.20at.com:80/article.php?sid=1513"

