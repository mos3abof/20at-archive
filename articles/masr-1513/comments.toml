[[comments]]
order = 0
subject = "هو فين الرئيس"
author = "أولاً الرئيس ده غير شرعى دى قاتل ومزور يعنى لا يحمل أى شرعية لوجوده فى الحكم وهذا الذى يدفعه إلى القمع والإرهاب خوفاً من الإطاحة به فى أى لحظة يعنى هو بيحكم مصر بصفة محتل للحكم وطبعاً كلنا عارفين المحتلين للشعوب بتعمل فيهم إيه علشان كده هو دمر الشعب بتهميشه وتجويعه له وبتفتيت كل المعارضة علشان يطيح بكل البجاحة دى فى الحكم"
posted = "2007-01-29"
text = "يعنى هو كان شرعى لما قال إنه قاعد على قلبنا لغاية آخر العمر أنا مش عارف هو استمد الشرعية دى منين وهل عمل أستفتاء شعبى على وجوده أو حاول تجديد ثقة شعبه به الرافض له نهائياً<br />أنهى حاكم دى فى أى دوله إللى خلى مراته وعياله والخدامين والطباخين بتوعه يساعدوه فى الحكم معنى كده إنه أخل بالدستور إللى مسح بيه الأرض فى مهام الوظيفة بتاعته يبقى هو غير شرعى<br />الحل الوحيد هى الثورة والإطاحة به وحكم إنتقالى لمدة سنتين نسترد فيها كرامتنا وحريتنا ويكون من القضاه الشرفاء وبعد كده إنتخابات حرة بإشراف قضائى كامل ويحكم الشعب من يختارة<br />أعتقد ما يحدث فى لبنان بروفة لكل مصرى علشان يعرف يعنى إيه ديمقراطية وإزاى يوصل ليها<br />يسقط حسنى مبارك يسقط حسنى مبارك يسقط الطاغية الدكتاتور لا للتوريث<br />عايزين المعلم عمرو موسى مش عايزين إللى لسه بيتعلم الأهبل العبيط جمال المدمن"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032504/http://masr.20at.com:80/article.php?sid=1513"

