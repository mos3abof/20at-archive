subject = "الى مواطن"
author = "مصرى حتى النخاع"
posted = "2007-01-31"
text = "صدقنى ياعزيزى انا لم اغير مواقفى ابدا كل ماهناك اننى اكرر مرارا اننى ضد مبارك ومايحدث فى مصر وضد الاخوان ومايمكن ان يحدث فى مصر انا اريد مصريون غيورين على بلدهم يتمتعون بالافق الواسع للراى والراى الاخر يضعون العلم والتقدم ورفاهية المواطن المصرى هدفهم الاول يستطيعون تكوين كوادر فى شتى المجالات قادرة على القيام باعباءها<br />لا اريد ذقون تحكم باسم الاسلام وتعتقل الافكار فى مهد الرؤس ولا اريد انحلال لايضيف للبلد الا الشبهات<br />اريد من يعلم الاجيال الجديدة قيمة العلم والعمل<br />من يتمتع بالمواصفات يتقدم ؟"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032504/http://masr.20at.com:80/article.php?sid=1513"

