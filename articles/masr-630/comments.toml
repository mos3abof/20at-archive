[[comments]]
order = 0
subject = "عيب يا حمودة"
author = "زعلان وحزين"
posted = "2006-07-10"
text = "متى توضع الأمور في نصابها ومتي يظبط حمودة نقاطه المبعثرة عمدافي الحروف لتكون واضحة وضوح الشمس.. لقد عفا الزمن على تلك العبارات الخايبة البايخة الجبانة التي تفصل بين كلمة النظام والرئيس .. وكأنه عندما تريد أن تنتقد وتهاجم فلازم تهاجم النظام وكلما يقودك الحديث عن الرئيس مباشرة تتأدب في عباراتك وتنزه الرئيس عن خطايا اللنظام والاعيبة وأحاييله ... طب بذمتك ودينك ياعادل افندي ياحمودة النظام ده نظام مييين بالظبط ويعني إيه النظام ويعني إيه قوانين يصدرها النظام بالطغط أو دون رغبة الرئيس .. ده كلام هبل في هبل يغلفه الجبن هل هناك فرق بين النظام والرئيس لا طبعا فالنظام هو نظام الرئيس . والرئيس هو رئيس النظام .إذن بعد المعطيات والمطلوب يطلع لنا البرهان أن كل قانون يصدره الرئيس هو بمحض مشيئته واختياره ولم يضؤبه النظام على إيده وأن الجرم الذي يرتكبه النظام هو جرم ارتكبه الرئيس .. يا أخي حتى باعتبار المتبوع مسئول عن أفعال تابعه .. فلماذا يا حمودة باشا بتضغط قوي لما تهاجم لفظ النتظام وبعدين تشيل رجليك من على البنزين فجأة وتضرب فرامل تعلم على أسفلت السطور لما تيجي كلمة الرئيس ... عيب ياحمودة"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131233/http://masr.20at.com:80/article.php?sid=630"

[[comments]]
order = 1
subject = "لقد قلت ما اردت ان اقوله"
author = "ابو اسامة"
posted = "2006-07-10"
text = "واللهى يا اخ زعلان لقد قلت ما اردت ان اقوله وزد عليه ان معظم الصحافيين ايضا<br />حتى المحترمين منهم يفعلون نفس الشىء<br />يضعون،بين النظام وصاحب النظام مع ان<br />صاحب النظام هو الى بينظم النظام وهو<br />الى بيعين النظام يعنى لا حد بيختار وزير ولا غفير من بتوعه يبقى ايه الفرق بقى<br />بين النظام والى نظم النظام لأ ومستنين<br />من صاحب النظام انه يعارض النظام علشان<br />أعدأ النظام شوفت الهبل ال يعنى صاحب النظام مش عارف ايه الى بيهببوا النظام<br />شوفت الخيبة. ربنا يشفى"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131233/http://masr.20at.com:80/article.php?sid=630"

[[comments]]
order = 2
subject = "الرئيس الكذاب .. ألأفاق .. الحرامي .."
author = "http://ibnbahya.blogspot.com/"
posted = "2006-07-11"
text = "وعد إيه بس ؟؟ يا ناس أنتم لسه أغبياء ولا بتستهبلوا ؟؟؟ وعد إيه ده ؟؟؟ من إمته كان مبارك له كلمه في حياته من يوم ما وقع على دماغنا زي القضا ؟؟؟ مبارك الكذاب ده من أول ما وصل للحكم قال أنه سيحكم مدة واحده فقط وسيترك الحكم كي يختار الشعب ما يريد .. والله قال ده بعظمة لسانه وسمعته بنفسي وقال إنه هيصلح ويعمل إصلاحات .. الكلام ده من سنة 1981 يا ناس .. والريس عجبه الكرسي وقعد ودلدل رجليه ودلدل حمامته (على رأي عمنا أحمد فؤاد نجم) ولسه من ربع قرن الناس بتستهبل وتقول وعد الريس .. يا عم فوقوا وبلاش استهبال .. البلد دلوقتي مش حاملة استهبال .. كلنا عارفين الريس ده كذاب وكذاب وكذاب .. وفي عهده زاد النصب والنهب والبهدلة .. ولا كلمة بينطق بيها صح .. كل كلامه كذب في كذب في كذب ..إنه الرئيس الكذاب .. ألأفاق .. الحرامي .. ربنا يهد المفتري<br />http://ibnbahya.blogspot.com/"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131233/http://masr.20at.com:80/article.php?sid=630"

[[comments]]
order = 3
subject = "شال الغطا"
author = "مصري موجوع"
posted = "2006-07-11"
text = "أراد مجلس الشعب أن يظهر بصورة سيد قراره أمام الشعب المصري المسكين بعد ما أخذ الضوء الأخضر بالموافقة علي قانون تكميم الصحافيين وصرح تصريح عنتري بأن القرار لمجلس الشعب فقط وأن رئيس الجمعهورية ليس من حقه فرض القوانين ... قام الرئيس شال الغطا عنهم وهم نيام وقرر الغاء قانونهم ومنع حبس الحصفيين .. المثير للشفقة علي أعضاء سيد قراره انهم صفقوا للقرار اللذين رفضوا ان يأخذوه<br />طفي النور يابهيه .... كل العسكر حرامية"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131233/http://masr.20at.com:80/article.php?sid=630"
