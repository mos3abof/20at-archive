[[comments]]
order = 7
subject = "القيم الدينية"
author = "ابو شريف"
posted = "2006-05-31"
text = "الي السادة المنادين بضرورة تدريس الثقافة الجنسية في المدارس أسوة بأوروبا وأمريكا ... ارجو منهم أن يفكروا : -<br />** ماذا سيكون شعورك وابنتك أو إختك داخله عليك ومعها صديق وتذهب به لغرفتهامثل الغرب<br />** ماذا سيكون شعورك عند علمك بأن ابنتك او اختك بأنها حامل من صديق لها<br />اخواني الأفاضل ... زيادة الثقافة الدينية والوعي الديني سواء كان اسلامي او مسيحي وارتباط الانسان بالمسجد أو الكنسية هو الوحيد القادر علي ايصال الشاب أو الفتاة الي بر الأمان وليس الثقافة الجنسية ... وهل تدريس الثقافة الجنسية سيمنع الفتاة من ان تتزوج عرفي سرا من خلف اهلها ... هل الثقافة الجنسية ستمنع الوالد من أن يسأل عن ابنته في حال مبيتها خارج البيت ... قديما كان البغاء مرخص وكان له شارع وأماكن معروفه فهل الشعب المصري كله كان يذهب الي هناك لزيادة الثقافة الجنسية والذي يطالب بتدريس الثقافة الجنسية الان كيف هو شخصياً تربي ... أما القول ان الانترنت والفضائيات تؤثر علي الشباب اذكركم بأن حين ظهور الفيديو تم التخوف منه أيضاً والان 70% تقريباً من الشعب المصري يمتلك فيديو فهل كل بيت مهم لديه شريط بورنو ... رب الأسرة الذي يقوم بتركيب ستلايت في بيته هو أقدر الناس علي الاشتراك في القنوات التي تأخذ بيد أبنائه الي الامام وليس ألى أسفل ... أما الفيديو كليب وسخونته ... ارجوكم ارجعو الي الاستعاراضات الراقصة في أفلام الأبيض والأسود والتي كانت تتم في الكابريهات والمايو البيكيني بل والميني جيب والميكرو جيب من الخمسينات والستينات ظهر ولم يطالب احد بتدريس الثقافة الجنسية خوفا من جيبة بنت الجيران السخنه ...<br />أرجوكم إن هناك حملة مدبرة لضرب مصر في أعز مالديها وهو شبابها سواء بالجنس أو المخدرات فلا تكونوا معاول هدم في أيدي المخربين بترديد<br />اقرأ بقية التعليق .."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025807/http://masr.20at.com:80/article.php?sid=391"

