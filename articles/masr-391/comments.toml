[[comments]]
order = 1
subject = "للأستاذ عبد الله مفتاح"
author = "lotus"
posted = "2006-05-28"
text = "معلش اسمحالي اعلق على اعتراضك على تدريس الثقافة الجنسية.أظن مش معقول نسيب الشباب للجهل والمعلومات الغلط اللي مالية النت و الدش وكتب البورنو ونغمض عينينا ونقول لا بلاش نفتح عينين الشباب.أعتقد الأفضل لو فتحوا عينيهم يبقى على معلومات صح و بقدر الحاجة.يعني كل مرحلة عمرية يتدرسلها معلومات معينة و بعدين كده كده احنا كا بناخد الكلام ده في مناهج الأحياء بس للأسف بدون اهتمام زي ما تكون حاجة عيب.يبقى تدريس المادة يبقى بأصول ومش كل حاجة يعرفوها الشباب لأن مش كل المعلومات هيحتاجوها, فيه معلومات تبقى خاصة للمتزوجين.وبعدين أضرار ايه بأه اللى هتنتج؟ هو حضرتك مش واخد بالك من أضرار الدش و الانترنت وأن معدلات الفشل في اقامة علاقة زوجية ناجحة- بسبب الجهل او المعتقدات و الافكار الخاطئة واللي أحيانا الشباب بياخدوها من أصدقائهم- بتزيد كل يوم؟يبقى الأحسن مانغمضش عينينا ونسيب الشباب يضيع في كم الاثارة اللى على الدش والنت والكليبات ونستخصر حتى فيه المعلومة الصح .بس طبعا لازم المعلومة تكون بقدر الحاجة ويشرف عليها متخصصين.كلمة أخيرة: القرآن تحدث في كل شئ بأسلوب مناسب و رائع وما أغمضش عينيه عن الحقائق بدعوى ان عيب نتكلم فيها"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025807/http://masr.20at.com:80/article.php?sid=391"

[[comments]]
order = 2
subject = "اخي لوتس"
author = "عبدالله مفتاح"
posted = "2006-05-28"
text = "بص يا سيدي سالخص ما اود قوله في نقاط<br />اولا: انا لم اقلا انه عيب ابدا تدريس الثقافه الجنسيه كل ما قلته ان سلبياته اكتر بكتير من ايجايباته وده نلاحظه في ايه<br />1- لازم تضع في اعتبارك ان في مصر العديد من المدارس المختلطه اللي البنات والشباب واخدين على بعض ترى لمو تم تدريسهم هذه الثقافه كيف سيكون وقعها عليهم وماهي النتيجه<br />2- ممما لا شك فيه ان الانسان لا يملأ عينيه الا التراب ومفيش حد عنيه مغمضه زي ما انت بتقول ولو درسنا شباب المدارس الثقافه الجنسيه لن يكتفوا بها بل سيبحثون ويبحثون ولن تنطفئ جذوة ولهيب حماسهم لمعرفه المزيد الا بالمزيد من الاتجاه لما اسميته انت ثقافه خاطئه في النت والدش وبذلك نكون قد قننا لهم ما لم يكن مقننا .<br />والحل؟.......<br />الحل في دورات التوعيه قبل الزواج والتي تشرح وتوضح كل المعتقدات الصحيحه والخاطئة<br />نقطة اخيرة مهمه جدا اظن ان في الماضي كانت الحياة الزوجيه اسعد من الحياة الزوجية الحاليه ولم يكن هناك دراسة للثقافه الجنسيه اذا فالعيب ليس في تدريس الثقافه بل في بعض المعتقدات التي جعلت من المراة والرجل ندا لا جزئين يكمل كل منهما الاخر كما ان انتشار الكثير من الثقافه الخاطئه ( البعيده عن الثقافه الجنسيه) كان له الاثر الاكبر في سوء العلاقه الزوجيه .<br />وان كان الجهل بالثقافه الجنسيه هو سبب تعاسه بعض الاسر فاني اجزم بان عدد هذه الاسر ليس بالكثير وان سبب التعاسه الزوجيه امور اخرى نبحث لها عن حل<br />ويجب علينا الا نصلح الخطا بخطا اخر<br />ولك مني جزيل الشكر"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025807/http://masr.20at.com:80/article.php?sid=391"

