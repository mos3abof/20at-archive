subject = "الحمدلله على نعم الله"
author = "ايمان"
posted = "2006-07-24"
text = "بسم الله الرحمن الحيم من المفروض انا الواحد يبقى عندة درايا كاملة بالمحيط بي وكمان المفروض ان احنا نتعرف عليةاولا وعى من الاعلام ومن المدارس والكليات لان اساسا فى المنازل ممنوع الام تكلم البنت فى اى حاة لان بيبقى فى احراج وسعتة البنت تبقى مش عارفة اى حاجة انا موافقة انة تدرس فى المدار بس فى حدود الادب والدين والحرثعن عدم الخروج من الموضوع لان اكيد الشباب محتاجة للوعى والتوعية من الثقفين وارجو من الله التوفيق"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170854/http://masr.20at.com:80/article.php?sid=391"

