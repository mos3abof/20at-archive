subject = "يوووووووووووووه"
author = "عبدالله مفتاح"
posted = "2006-05-28"
text = "لما سلامه احمد سلامه ده بيكلم في الدين بيجبلي حساسيه الراجل ده بيخرجني عن شعوري باراؤه العلمانية<br />انا ضد تدريس الثقافه الجنسيه وبطل يا استاذ سلامة صيد في الميه العكرة تدريس للثقافه الجنسيه في المدارس لا لا لا<br />ولو حسبتها هتلاقي سلبياتها اكتر من ايجابياتها بكتير اوي<br />ده لو انت عايز تحسبها بالعقل والقيم مش بحسابات تانيه"
archived = "2006-06-13"
