[[comments]]
order = 4
subject = "شكرا لردكم"
author = "Lotus"
posted = "2006-05-29"
text = "ميرسي أوي على الرد.والحقيقة انا طبعا لايمكن أوافق على تدريس العلاقة نفسها في المدارس.لكن بصراحة فيه اسئلة بيبقى البنات أو الأولاد عايزين يسألوها ومش بيعرفوا والأسئلة دي مش بتكون على حاجة عيب.دي ممكن تكون عن حاجة بتحصلهم وهمه مش عارفين يسألوا وللأسف الأهل مش بيرضوا يتكلموا او يعرفوا حاجة عن أولادهم وسايبينهم كده وخلاص يعرفوا بأه اى حاجة صح غلط مش مشكلة.أنا بس كنت عايزة الشباب مايبقاش بيدور على كتب او معلومات الاصدقاء عشان يعرفوا حاجة لكن طبعا المعرفة المفروض تكون بقدر الحاجة وطبعا المفروض المادة دي ماتتدرس لوحدها كده, المفروض تبقى مرتبطة بالمفاهيم الدينية و تقاليد المجتمع لأن أعتقد أن الثفافة دي مش بس عن العلاقة وبس,كل التغيرات اللي بتحصل للشباب و حتى النظافة الشخصية داخلة فيه.وأكيد طبعا دورات الزواج مهمة.أما بالنسبة للسعادة الزوجية فأنا ماقولتش أن الجهل بالثقافة دي هو السبب الوحيد لكن برضة دي حاجة لايمكن تجاهلها في العلاقة بين الزوجين,وحضرتك قلت بنفسك أن من أسبابها انتشار الثقافة الخاطئة.اخر حاجة اني لايمكن أطالب باننا نبقى زي الغرب لأني شخصيا بحتقر العلاقات الإجتماعية عندهم ولا يمكن أوافق على أن الشباب عندهم في سن ال 14 و ال 16 وعايشين مع بعض زي مايكونوا متجوزين.ده مجتمع تقاليده غريبة عننا ولا يمكن حد يقبل بالكلام ده طبعا.لكن أنا بس كنت أقصد أننا مانسيبش الشباب للنت و الدش والكليبات الحلوة اللي مغرقانا بطوفان من الإيحاءات المخلة.و شكرا للرد"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025807/http://masr.20at.com:80/article.php?sid=391"

