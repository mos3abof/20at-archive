text = "بل انهم سبوا\"محمد\"حبيبنا وهادينا<br />وهذه الاعتذارات لم تاتى الا على لسان بعض الافراد اما الحكومه فقد تكبرت على ذلك<br />لقد استهنا بهذا الامر كثيرا واستهنا باسلامنا كثيرا ولكن يجب ان تقوم هذه الامه من سباتها الطويل<br />يجب ان تكون اسلامنا وعزتنا هى رموزنا وصوتنا وفعلنا وليس التهاون والاستسلام<br />ولا يغرنا هذه الصور فهى فقط من قبيل السياسه بعد ان ارهقتهم المقاطعه<br />اللهم عليك بكل مناساء الى نبيك<br />اللهم اهدى المسلمين"
