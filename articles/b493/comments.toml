author = "أكرم"
posted = "2006-02-25"
text = "اولا احب اقول ان الشباب الدنماركي و الحملة دي مكانتش هتتحرك و لا تلاقي صدى واسع من الدنماركيين المعتدلين الا اذا كان في رد فعل مزلزل مننا كمسلمين و ده اللي حصل بالفعل<br />ثانيا : احنا اللي رخصنا نفسنا ادام العالم لدرجة ان الامريكيين انتخبوا بوش لفترة تانية رغما عن فشله الداخلي الكبير لمجرد انه احتل افغانستان و احنا قاعدين احتل العراق و احنا قاعدين بيهدد ايران و سوريا و احنا قاعدين ( قاعدين ليه متقوموا تروحوا )<br />ثالثا : ردة فعل المسلمين بحلوها و مرها بعقلها و بعنفها عرفت الاعالم اننا لسه عايشين و ان في حاجة فينا اسمها بلود ( دم يعني )<br />و السلام ختام"
