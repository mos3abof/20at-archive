[[comments]]
order = 12
subject = "عشان الشباب الحلو هي دي مصر"
author = "مصري"
text = "2،4 مليار جنيه خسائر صناعة الدواجن بسبب وباء أنفلونزا الطيور .. وتساؤلات عن موانع تنفيذ وعود مبارك بعدم حبس الصحفيين!! .. ورئيس نادي القضاة يكذب تصريحات وزير العدل .. والمصرية لحقوق الإنسان تؤكد وجود 16 ألف معتقل في السجون..<br />خرجت الصحف الرسمية أمس (السبت) بعناوين حاولت طمأنة للناس وأعلنت انحسار وباء أنفلونزا الطيور وعن خطة حكومية لمنــــع رفـــع أسـعار الســلع البديلـــة للدواجن وإجراءات لشراء الدواجن وتعويض أصحاب المزارع بطريقة عادلة .. وتخصيص 200 مليون جنيه لشراء 30 مليون دجاجة وذبح 30% منها وإعدام الباقي .. في حين أكدت إجراء تحاليل لـ ‏352‏ شخصا من مخالطي الدواجن‏.. والنتيجة‏:‏ لا إصابات بشرية بأنفلونزا الطيور .. وأشارت إلى أن الوضع مطمئن بالمحافظات والذبح بالمجان في مجازر القوات المسلحة .. والى مساعدة منظمة الصحة الحكومة المصرية علي إنتاج الأمصال واللقاحـات .. لكن صحف المعارضة كشفت ان الخسائر في صناعة الدواجن بلغت 2،4 مليار جنيه بسبب مرض أنفلونزا الطيور . ووصل حجم الخسائر إلي 16% من إجمالي قيمة الاستثمارات والتي تصل إلي 17 مليار جنيه كما أكدت صحيفة الوفد وفي موضوع آخر .. أثارت صحيفة المصري اليوم على نطاق واسع مسألة الحكم القضائي بحبس محررها عبد الناصر الزهيري على خلفية انتقاده وزير الإسكان السابق .. وأعلنت عن تضامن نقابة الصحفيين واتحاد الكتاب والمنظمات الحقوقية معها .. وقدم نواب المعارضة في مجلس الشعب بيانا عاجلا إلى رئيس الوزراء حول تأخير إصدار قانون منع الحبس في قضايا النشر رغم وعود مبارك بإلغائه قبل عامين .. وتسائل كتاب عن الموانع والأسباب (الخطيرة) لعدم تنفيذ وعود الرئيس !! .. وسط تشاؤم الصحفيين من مستقبل الصحافة المصرية . وفي سياق متصل أبرزت الصحف المستقلة تكذيب رئيس نادي القضاة المستشار زكريا عبد العزيز للتصريحات التي أدلى بها وزير العدل بخصوص سحب النادي مشروع تعديل السلطة القضائية .. فيما ردت المنظمة المصرية لحقوق الإنسان على تصريحات مساعد وزير الداخلية التي نفى فيها وجود معتقلون في السجون .. وأكدت أن هناك نحو 16 ألف معتقل حاليا !! . نبدأ تقريرنا اليوم من الأهرام التي أعلنت ان اللجنة الوزارية التي شكلها مجلس الوزراء لتحديد إجراءات شراء الدواجن الحية من أصحاب المزارع ‏،‏ بما يسمح بتعويضهم ومساعدتهم علي الاحتفاظ بالعمالة الموجودة لديهم ‏.‏ وأبرزت تأكيدات الدكتور أحمد نظيف رئيس مجلس الوزراء أن الحكومة تتحرك بسرعة لدعم صناعة الدواجن‏ ،‏ وإخراجها من الأزمة الطاحنة التي تمر بها من جراء إصابة الدواجن بأنفلونزا الطيور‏ ،‏ وقال إن الإجراءات سارت علي مسارين هما ‏،‏ التعامل مع الأزمة الحالية بسرعة وكثافة ‏،‏ ثم اتخاذ احتياطات طويلة الأجل تحسبا لعودة المرض في الأعوام المقبلة ‏.‏ وأبرزت الأهرام تصريحات الدكتور مجدي راضي المتحدث الرسمي باسم مجلس الوزراء بأن إجراءات الخروج من الأزمة شملت تقديم بنك التنمية والتسليف الزراعي قرضا فوريا لكل صاحب عنبر دواجن بمبلغ ‏15‏ ألف جنيه‏ ،‏ لينفقها علي توفير الأعلاف والرعاية الصحية لمزرعته‏ ،‏ مع دراسة مدي إمكانية إلغاء الفوائد علي هذا القرض‏ . ‏وقال إن الحكومة تتوقع انتهاء المشكلة عمليا في النصف الثاني من شهر مارس المقبل‏ ،‏ مع انتهاء دورة التربية الحالية‏،‏ وكذلك الرحلة الرابعة والأخيرة لهجرة الطيور عبر الأراضي المصرية ‏.‏ وأضاف راضي أن معدل البلاغات عن الإصابة بالمرض يتراجع حاليا خاصة أن الحكومة أعطت أولوية مطلقة للحفاظ علي صحة المواطنين ‏،‏ مع العلم بأنه لا خطر من تناول الدواجن المطهية جيدا في حرارة مرتفعة‏ .‏ وأعلن أمين أباظة وزير الزراعة واستصلاح الأراضي‏ ،‏ ورئيس لجنة تعويضات منتجي الدواجن أن اللجنة سوف تجتمع اليوم لوضع أسس تعويض المضارين من المرض ‏،‏ بحيث يكون عادلا ومعقولا‏،‏ وأضاف أن هناك خطة وإجراءات لمنع استغلال الوضع السييء ‏،‏ لصناعة الدواجن في رفع أسعار السلع البديلة خاصة اللحوم والأسماك إلى ذلك صرح الدكتور زهير الحلاج ممثل منظمة الصحة العالمية في مصر بأن المنظمة ستساعد مصر وإيران علي إنتاج الأمصال واللقاحات الخاصة بفيروس أنفلونزا الطيور ‏،‏ لتلبية احتياجات دول الشرق الأوسط بالكامل ‏.‏ لأن طاقة أوروبا وأمريكا من الأمصال تكفيهم وحدهم ‏،‏ وأضاف أن المنظمة اختارت مصر بالذات لأنها من أكثر البلدان تقدما في صناعة الدواء ولديها خبرات كبيرة وبنية تحتية جيدة ‏.‏ وقد واصلت أجهزة الطب الوقائي بوزارة الصحة عملها لمحاصرة مرض أنفلونزا الطيور في أضيق نطاق ومنعه من الانتشار ‏،‏ ولم توقف نشاطها أمس في يوم الإجازة بجميع محافظات الجمهورية ‏،‏ وقامت المعامل المركزية بالوزارة بتحليل ‏352‏ عينة من أشخاص مخالطين للدواجن ثبت خلوهم جميعا من المرض‏ .‏ من جانبها أبرزت صحيفة الجمهورية تصريحات د.نظيف أن الحكومة ستعلن عن إجراءات بعيدة المدى تحسباً لظهور المرض في الأعوام القادمة.. مشيراً إلي أن الأزمة الحالية سوف تنتهي في النصف الثاني من مارس القادم بعد نهاية الدورة الحالية لتربية الدواجن وانتهاء موسم هجرة الطيور . وأعلن أمين أباظة وزير الزراعة أن الحكومة خصصت 200 مليون جنيه مبدئياً لشراء الدواجن من المربين وصرف التعويضات مؤكداً أنه لن يضار \"مربي\" أو عامل واحد. من ناحية أخري لم تسجل المعامل المركزية لوزارة الصحة أمس أية إصابات جديدة المحافظات أكد عدلي حسين محافظ القليوبية رئيس بورصة الدواجن الرئيسية في بنها التي تنتج 65% من الثروة الداجنة علي مستوى الجمهورية أن الوضع مطمئن للغاية . في مقابل تلك التصريحات الحكومية (الوردية) كشفت الوفد نقلا عن مصادر حكومية مسئولة أن صناعة الدواجن بلغت خسائرها في الأيام الماضية نحو 2،4 مليار جنيه بنسبة تصل إلى 16% من إجمالي قيمة الاستثمارات والتي تصل إلي 17 مليار جنيه . وطالبت الوفد بسرعة تدخل الحكومة لإنقاذ مستثمري القطاع الخاص الذين يمثلون 95% من الاستثمارات . وأشارت إلى ضرورة تسهيل جدولة القروض ووقف فوائد البنوك لإنقاذ صناعة الدواجن في مصر . وقد نفت مصادر حكومية لـ الوفد ما تردد عن تحديد سعر شراء الدجاجة بجنيهين ونصف . وأشارت المصادر إلي ان السعر الذي سيتم إعلانه سيكون مرضيا للحكومة وأصحاب المزارع . وتزامن مع ذلك رفض أصحاب محلات بيع الدواجن قرار رئيس الوزراء بإغلاق محلاتهم أو تحويل نشاطها إلي بيع اللحوم المجمدة . واتهم التجار الحكومة باستغلال الأزمة لغلق محلات الدواجن تعسفيا . وطالب التجار في اجتماع شعبة الثروة الداجنة وأصحاب المجازر باتحاد الغرف التجارية أمس برئاسة الدكتور عبد العزيز السيد بإعادة فتح محلاتهم وممارسة نشاطهم وفقا لمعايير بيئية وصحية وحذروا من تفاقم الخسائر وتوقف صناعة الدواجن . وكشف عباس زكي رئيس غرفة تجارة القاهرة عن رفض منظمة الصحة العالمية تداول الطيور الحية داخل المدن . وأشار إلي مساهمة الغرفة في تعويض أصحاب المحلات المغلقة عن خسائرهم . فيما أكد أحمد حسين سكرتير عام محافظة القاهرة عدم التراجع عن إغلاق محلات الدواجن !!. ومن أزمة الفراخ إلى أزمة السكر .. حيث كشفت صحف المعارضة عن صدور توجيهات عليا للحكومة بحظر تصدير السكر خارج البلاد واستثنت المصدرين المتعاقدين علي صفقات قبل الأزمة ، كما صدرت تعليمات باستيراد مليون طن سكر ورفع جميع المعوقات التي تقف أمام المستوردين . وبحسب مصادر اقتصادية فان الشركة الوحيدة التي ستستفيد من الاستثناء من القرار هي وكيلة شركة أمريكية يصل حجم تعاقداتها للتصدير 5 آلاف طن . وأضافت المصادر أن الحكومة قررت استيراد ما لا يقل عن مليون طن من الخارج يتم شراؤه بالتعاون بين عدد محدود من المستوردين وشركات السكر ، ووضع الضوابط النهائية لعملية الاستيراد .. وكشفت المصادر فشل محاولات عديدة لتصدير السكر وتهريبه خارج البلاد ، وأكدت أن محاولة فشلت في ديسمبر الماضي لتصدير 6 آلاف طن لكينيا عبر ميناء السويس بسبب خلافات بين قبطان الباخرة والوكيل الملاحي . وتم تفريغ الشحنة بالميناء واشتراها نجل وزير سابق وقام بتخزينها في الإسكندرية . كما فشلت محاولات أخري لتهريب السكر إلي ليبيا وتشاد والسودان عبر منافذ السلوم وحلايب وشلاتين مما اضطر الحكومة لتكثيف الرقابة علي المنافذ الحدودية لمنع التهريب ومن الفساد في السكر إلى الفساد في الألبان .. حيث نشرت الصحف أن النائب كمال أحمد يعد حاليا لتفجير قضية فساد جديدة يتورط فيها وزير حالي في الحكومة ، وسيتقدم باستجواب حول صفقة شراء شركة مصر للألبان بأقل من سعر السوق 15 مرة بعد ان حصل على مستندات البيع والشراء .. حيث تقدم وزير حالي من رجال الأعمال لشراء شركة مصر للألبان ، إحدى شركات القطاع العام بالإسكندرية قبيل توليه للوزارة . اشتري الوزير الشركة بمبلغ 19.5 مليون جنيه تعادل نحو 40% من القيمة السوقية التي حددتها الجهات الفنية بمبلغ 48 مليون جنيه . تشمل الصفقة قيمة المعدات والأرض المقام عليها المصنع والسيارات والمنشآت الأخرى . وتلقى الوزير بعد عام واحد علي شرائه للشركة عرضاً لشرائها بمبلغ 300 مليون جنيه تعادل أكثر من 15 مثل سعر الشراء . لكن الوزير رفض البيع لأن قيمة الشركة السوقية أكبر من هذا المبلغ !!!. ولعل قضايا الفساد كانت السبب الحقيقي الذي جعل الحكومة ترفض حتى الآن إصدار قانون يقضي بعد حبس الصحفيين في قضايا النشر كما أشار احد الكتاب .. لكن وزير الإعلام الفقي أكد أمس ان الوعد الرئاسي بعدم حبس الصحفيين في قضايا النشر قائم !! .. وقال الفقي في تصريح لوكالة أنباء الشرق الأوسط أمس إن القانون الخاص بهذا الموضوع جاهز للعرض علي مجلس الشعب في الدورة البرلمانية القادمة . وأشار الوزير إلي أن الرئيس مبارك كان قد أعلن في الجلسة الافتتاحية للدورة البرلمانية الجديدة لمجلس الشعب تمسكه بحرية الرأي والتعبير وعدم معاقبة أي صحفي بالحبس في قضايا النشر من منطلق إيمان الرئيس بحرية الرأي والتعبير لدعم مسيرة الديمقراطية . يذكر أن محكمة جنايات القاهرة قد أصدرت حكمها أمس الأول في قضية السب والقذف التي أقامها الدكتور إبراهيم سليمان وزير الإسكان السابق ضد ثلاثة صحفيين بجريدة \"المصري اليوم\" لنشرهم خبراً عن قيام أجهزة رقابية رفيعة المستوي بتفتيش مكتب الوزير وتجميد نشاطه مما اعتبره سباً وقذفاً في حقه . وقضت المحكمة بتأييد حبس الصحفي عبد الناصر زهيري سنة مع الشغل وبراءة زميليه علاء الغطريفي ويوسف العومي وإلزامهم متضامنين جميعاً بدفع 10 آلاف جنيه علي سبيل التعويض المؤقت للوزير السابق . إزاء تلك الأزمات وحالة الجمود السياسي وتعثر خطوات الإصلاح في البلاد .. أعلن السفير الأمريكي بالقاهرة في تصريحات نشرتها الصحف المستقلة أن الظروف الحالية لا تشجع للموافقة علي اتفاقية التجارة الحرة بين مصر وأمريكا .. وقال ان الظروف الحالية داخل الكونجرس الأمريكي لن تدعم الموافقة علي اتفاقية التجارة الحرة بين مصر والولايات المتحدة. وقال انه من الممكن بدء مناقشتها مع تحسن العلاقة بين إدارة الرئيس بوش والكونجرس مما يوفر ضمان نجاح عرض الاتفاقية علي الكونجرس . وأشار إلي ان الاتفاقية تعتمد بصورة أساسية علي المنفعة المتبادلة بين البلدين . وأكد السفير حرص بلاده علي استكمال المفاوضات في اقرب وقت مناسب . ودعا في مؤتمر صحفي بمناسبة افتتاح عدد من المشروعات بمحافظة المنيا بتمويل من الوكالة الأمريكية للتنمية الحكومة المصرية إلي تعميق مفاهيم الديمقراطية في مصر ، مؤكدا قدرة المصريين علي عبور أي انتكاسات قد تواجههم خلال خطة الإصلاح السياسي في مصر . من جانبه انتقد الكاتب محمد حامد الجمل في مقال بالوفد تناول الإعلام الحكومي مع كارثة العبارة وأنفلونزا الطيور .. وقال ان النظام الشمولي قد تمكن بتأميم الصحافة سنة 1960 من أن يتسلط تماماً عليها ويستغلها ، بالإضافة إلي الإذاعة والتليفزيون الذين كانا تحت سيطرة واحتكار الدولة!!، ولتزييف حقيقة الغايات الاستبدادية من هذا التأميم فقد نص علي الإشراف الشعبي الوهمي عليها من خلال الحزب السلطوي الوحيد للاستبداد وهو الاتحاد الاشتراكي الذي كان يسمي الاتحاد القومي وإيماناً وإدراكاً بقيمة النصائح الميكافيلية، التي جربها العهد الناصري فإنه رغم<br />25/02/2006<br />اقرأ بقية التعليق .."
