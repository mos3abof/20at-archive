subject = "سلملي ع البتنجان"
author = "سوسة المفروسة"
posted = "2006-02-26"
text = "و الله الجماعة الدينماركيين دول كويسين قال بيبعتولنا اعتذارات و 12 الف واحد كمان??<br />شكلها كده بلد ضاربها السلك ما تيجي بقة نطبق الحكمة العربية الخالدة<br />العجل وقع هاتوا السكينة)<br />المطالب المصرية:<br />1- على كل مواطن دنيماركي التبرع بربع اجرة شهريا لتعويض ضحايا العبارة (تحاور حضارات بقه و لا زم نقف جنب بعض)<br />2- توافق جميع المنشئات الاقتصادية على اعادة استيراد الزبدة الدنيماركية على ان يتم في مقابل ذلك تصدير الفراخ المصرية بسعر 5ز34 يورو للفرخة(حبايبنا برضه و لازم نكرمهم)<br />3-على الحكومة الدنيماركية التوسط عند اكبر الاندية الاوروبية للموافقه على توقيع عقد لاحتراف النجم الصاعد حسام حسن بمقابل مغري (حيث انه مازال في كامل صحته و الدهن في العتاقي(انظر المطلب رقم 2)<br />و سلملي ع البتنجان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125815/http://www.20at.com/article2.php?sid=493"

