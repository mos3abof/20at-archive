subject = "لا بقى انا بختلف معاكم كلكم"
author = "sweet_princess"
posted = "2006-02-25"
text = "يعني ايه اعتزار على مواقع على حرق العلم الدنماركي والسويدي وكمان مجرد ايميلات ورسايل اعتزار مش كفايه لاوم الناس دي تقدم اعتزار احسن من كده مش عارفه ايه هو بس لازم يكون فيه اعتزار اشد من كده ..<br />وليكن مثلا...تقديم المجرمين والخنازير والاغبياء اللي فكروا في العمله القذره دي لمحاكمه علنيه على مستوى العالم كله وتتذاع في قنوات التلفزيونات العربيه كلها وياخدوا حكم رادع لان اللي عملوه دا مش غلطة عيال صغيره .<br />اما بقى لو عاوزين يعتذروا لازم يشوفو فيه كام واحد مسلم في العالم ويبعتوا له رساله باي طريقه عن طريق الايميل او البريد العادي ومعاها تزكره شامله الانتقالات لعمل عمره عشان نزور النبي ونتوب لربنا عشان وافقنا على اعتزارهم دا برضه لانه مش كفايه واحنا نوعدهم اننا نتنازل ونتواضع ونوافق اننا نقرا الرسايل دي ونقبل دعوة العمره دي .<br />اما عن نفسي فانا موافقه على الحل دا لكن الرسايل لازم تجيلي ع الايميل والبريد العادي كمان عشان اوافق اني اقاراها ولما يقرروا يعملوا كده ابقوا ادوني خبرعشان اعمل حسابي من دلقتي ودلوقتي بقى مين فيكم هيوافق على الحل البسيط دا.....؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125815/http://www.20at.com/article2.php?sid=493"

