posted = "2006-02-27"
text = "بسم الله الرحمان الرحيم والصلاة والسلام على اشرف الخلق كلهم سيدنا محمد وعلى اله وصحبه اجمعين اما بعد اخوتي في الله بعد السلام عليكم ورحمة الله وبركاته صلوا على سيدنا محمد اللهم صلي عليه وسلم تسليما اخوتي لو كان سيدنا محمد حيا في عصرنا هدا مادا يا تراه كان سيفعل بهؤلاء الدانماركيين تخيلوا معي الم يقل لقمه صلى الله عليه وسلم عند فتح مكة ادهبوا فانتم الطلقاء فهده هي اخلاق سيدنا محمد لايحقد حتى على الذ اعداءه فهو الرحمة المهدات فعلينا ان تتبع خطاه حتى يفرح بنا عند الحوض فانا من وجهة نطري لو وجدت فتاة من الدانمارك ساكون لها نعم الصديقة باخلاق المسلمين حتى تعرف من هم المسلمون حقا وحتى تعرف اننا نتصف باخلاق اشرف الخلق كمن يدري فقد تدخل الاسلام واخيرا بدلا من ان تدعوا عليهم ادعو الله ان يكثر بهم امة حبيبنا محمد حتى يباهي بامته باقي الامم يوم القيامة والسلام عليكم ورحمة الله وبركاته اختكم في الله نوال وصلى الله على سيدنا محمد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125815/http://www.20at.com/article2.php?sid=493"

