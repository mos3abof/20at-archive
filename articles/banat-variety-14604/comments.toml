[[comments]]
order = 15
subject = ""
author = "White heart"
posted = "2010-01-04"
text = "انا بردو اصغر اخواتى .. لكن لم اشعر ابدا انى اهم فرد فى الاسره او انى محط الانتباه .. بالعكس دايما احس انى جيت فى الوقت الضايع .. او انى جيت متأخر اوى .. و انا صغيره ماكنش عندى مشاكل فكان الاهتمام منصب على مشاكل اخواتى الاكبر .. و لما كبرت و اخواتى اتجوزو و بقيت لوحدى بابا و ماما كبروا و بقيت كل ما احب اعمل حاجه و محتاجاهم معايا يحسسونى انهم عملو الحاجات دى مع اخواتى قبل كده و خلاص مش هيعملوها تانى .<br />اجمل احداث مرت بيها اسرتى و انا كنت لسه مش موجوده .. و خلاص مافيش حاجه فاضله عشان اعيشها معاهم.<br />البنت الاخيره لو زيى بتحس بالوحده لأنها مش بتلاقى حد فى اسرتها بيشاركها افكارها او نشاطاتها.<br />ده غير ان بيكون مطلوب منها تساعد والديها فى كل شئ و مطلوب منها تحقق النجاحات اللى ماقدرش اخواتها يحققوها .. و هى اللى بتستحمل عصبيه والدها اللى اصبح عنده ضغط و سكر و قلب حتى لو ماعملتش اى خطأ.. فى النهايه بتلاقى نفسها موجوده فى كل شئ متعب لأن كل الاحداث الجميله مرت على الاسره و هى ماكانتش موجوده فى الدنيا اصلا.<br />احيانا اخر العنقود بيكون جه فى الاخر اوى ."
archived = "2010-02-01"
capture_url = "https://web.archive.org/web/20100201071619/http://www.20at.com:80/banat/variety/14604.html"

