text = "اقتباس فاعل خير:<br />للأسف فقد وجدت بعض الأخطاء في هذا المقال . و أنا أعتب بشدة على إخواني مسؤولي الموقع و أتمنى أن لا يتكرر ذلك .<br />فبعد أن تحدثت إلى عدة مواقع طبية أكدت جميعها لي أنه من المستحيل أن تنجب امرأة 2.9 طفل أو 2.5 طفل . فبعض النساء ينجبن طفلين و بعضهن ينجبن ثلاثة أطفال أما ما بينهما فهو مستحيل<br />ده انت خروف!!!!!!! ده معدل يا عم الحاج!!!!!!! ده اللي علمك انك تشغل كمبيوتر اصلا و تدخل علي الموقع عشان تكتب الكلمتين دول… ظلمك و ظلمنا معك!!!"
