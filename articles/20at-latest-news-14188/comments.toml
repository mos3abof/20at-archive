text = "للأسف فقد وجدت بعض الأخطاء في هذا المقال . و أنا أعتب بشدة على إخواني مسؤولي الموقع و أتمنى أن لا يتكرر ذلك .<br />فبعد أن تحدثت إلى عدة مواقع طبية أكدت جميعها لي أنه من المستحيل أن تنجب امرأة 2.9 طفل أو 2.5 طفل . فبعض النساء ينجبن طفلين و بعضهن ينجبن ثلاثة أطفال أما ما بينهما فهو مستحيل"
