subject = "جميل يا عجم"
author = "عبدالله مفتاح"
posted = "2006-07-03"
text = "مقال جميل<br />فعلا نمطيه التفكير مشكله كبيرة جدا بيعاني منها اغلب المدرسين<br />تحس انه لا يجوز الابداع الا تحت المواضيه دي<br />مقال جميل فعلا"
