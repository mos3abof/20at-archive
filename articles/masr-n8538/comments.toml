[[comments]]
order = 1
subject = "عنوان الدول المتخلفة"
author = "المصري"
posted = "2006-07-04"
text = "يا سادة هي حكمة معروفة جدا عنوان الدول المتخلفة هي التعتيم والطمس: على كل ما من شأنه أن يطرح أو يفتح أو يبصر الناس بسؤال أو موضوع يثير مشاكل للنظام الحاكم - ولا مؤاخذة - المعفن. ومشكلة إنعدام الشفافية ياحضرات تعصف بالأمة سنين للوراء وتخفس بالشعب أسفل سافلين. والأسلوب بالغ السوء لأجهزة الإعلام التي لدينا وبالأخص الحكومية يفقد مع الوقت للأسف - مع مرور الوقت وعدم تغير الأسلوب - يفقد مصداقيته أمام المواطن. وأى مواطن يتحول - حتى إذا كان مناصر أو متعاطف - الى فاقد الثقة ثم كاره ثم لاعن لهذا الإعلام المتخلف خبيث الأسلوب خايب الفكر وأيضا المفلس. العرب اللي بنقول علمناهم شوفوا بقوا فين: شوفوا دبي , شوفوا قطر, شوفوا الكويت. والله يا جماعة مش عارف أوصل لكم أد إيه بقت الهوة مش بيننا وبين الغرب, ولكن بيننا وبين العرب اللي بنقول احنا العفاريت واحنا واحنا. والحقيقة إن الإستاتيكية اللي إحنافيها منذ زمن طويل حولنا مع الوقت للأسف إلى طرابيش. الحل هو التغيير وضخ دماء جديدة وأن يكون لدينا صف أول وثان وثالث ويكون الكوادر الشابة جنبا إلى جنب مع الكبار ذوي الخبرة. وحاجة مهمة جدا جدا جدا أن الحكومة تبطل الأسلوب - عفوا - المعفن في التعمية والطمس وأزيدكم استكراد وإستهبال المواطنين."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705142202/http://masr.20at.com:80/article.php?sid=603"

[[comments]]
order = 2
subject = "ملل فزيع"
author = "هوووووبه"
posted = "2006-07-04"
text = "علي ما افتكر لماكان يجيلنا اتنين موضوع تعبير الاول لو سياسه ابعد عنه<br />واختار التاني ايه حاجه التاني بقي<br />المهم ابعد عن السياسيه<br />يعني كنا الاء احنا كمان بس شكل الاء كتبت في القنبله الذريه وعلاقتها بالفته المقليه ."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705142202/http://masr.20at.com:80/article.php?sid=603"

[[comments]]
order = 3
subject = "لو نبطل حذاقة زايدة وفهلوة الأول"
author = "مكاري"
posted = "2006-07-04"
text = "الشعب ده محتاج رسول من أولي العزم، مبعوث من رب العالمين، يبقى عايش وسطنا عشر أضعاف عمر نوح ويكون عنده قدرات موسى ومعجزات المسيح وهداية النبي العربي علية الصلاة والسلام، إنما مجرد مصلح مفكر أو زعيم يبقى عاجز مع شعب مشلول التفكير زينا. عرفتم دلوقتي ليه تجربة عبد الناصر فشلت وقبله محمد علي، لأننا أغبياء كسالى جبناء وعاملين روحنا ملوك المفهومية، وإحنا أغبى الناس تبعنا وتقبض وإحنا نعد الفلوس ليهم كمان. لوسألت أي مصري مهما كان عن أي حاجة، تلاقي فيهم حد يقولك معرفش؟ أبدا محنا أرض الفهلوة والخفية والشطارة إحنا اللي دهنا الهوا دوكو.<br />لازم نتعلم نفكر ونقرا اللي بيجرى حوالينا بأسلوب مدروس ونسيب الفلهوة المتأصلة فينا. ياعالم ياهوه والله ما أحنا أذكياء ولا نيلة إلا على الغلبان اللي مننا، مش بعنا الترمواي للصعايدة؟ طب ليه مش للإنجليز؟<br />فاهمين أنا عايز أقول إيه؟ طبعا"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705142202/http://masr.20at.com:80/article.php?sid=603"

[[comments]]
order = 4
subject = "الحمد لله اني عديت"
author = "واحدة وخلاص"
posted = "2006-07-04"
text = "اولا احب اشكر الكاتب على الاسلوب الرائع المتسلسل في المقال<br />ثانيا<br />افتكر وانا في امتحان ثانية ثانوي (من حوالي 6سنين ) - مش فاكرة كان الموضوع عن ايه بالظبط بس كان من الموايع العبيطة المكررة - المهم ان الالهام نزل عليا ولقتي بدخل كل حاجة في الموضوع وكتبت عن العولمة والهوية وسيطرة الدول الكبري على الفكر العالمي وعلى انها بتعيننا اقتصاديا علشان تسيطر على افكارنا واهدفنا و ....الخ<br />وكنت مستمتعة جدا ومبهورة باللي انا كاتباه<br />بس طبعا الحمد لله ان الموضوع ده كان قبل 11 سبتمبر وإلا مكنتش زماني قاعدة بكلمكم دلوقتي كان زماني في مكان ما يبدأ ب(ابو....)<br />\" يا رب احمينا واسترنا وقوينا \""
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705142202/http://masr.20at.com:80/article.php?sid=603"
