text = "بالذمة ده سؤال ..<br />هو العيد يبقى عيد اساساً من غير صلاة العيد .<br />طب ده انا قبل كدة سهرت مع أصحابى وكسلت عن صلاة العيد … والله والله والله ماحستش بطعم العيد اللى بحسه كل مرة .<br />بس الموضوع جااااااامد آخر حاجة وفيه معلومات وحاجات جديدة .. شكراً للمحرر وشكراً لعشرينات<br />وكل سنة وأنتم بألف خير ومن نجاح لنجاح إن شاء الله"
