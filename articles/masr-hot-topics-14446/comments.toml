[[comments]]
order = 5
subject = ""
author = "المفترية مراتى"
posted = "2009-12-20"
text = "شكلها رقيق جدا وهى بنت - ولما تزوجتها اصلها كانت قريبتى من بعيد شوية - كانت معاملتها اخر ظرف واخر لطافة - وفى يوم زعلنا مع بعض على موضوع كدة - واتهورت ومديت ايدى وضربتها قلم - وعينك ما تشوف الا النور - تحولت الى نمر هائج - بونيات وشلاليت وصرخات الجودو والتايكاندو وضرب بالبوكس ونص ركبة وامامية مستقيمة وضربة خطافية - واتخرشمت والدم نزل من مناخيرى وكان فيع قطع عرضى فى حاجبى الشمال 2 سم وبيخر دم وعملت فيها غرزتين<br />واكتشفت انها اخدت دورة جودو وتايكندو فى النادى ايام ما كانت فى الكلية ومعاها الحزام الاسود - وفى ساعة رواقة قالت لى اعمل اللى انت عايزة فيا اشتمنى هزأنى كل طلباتك مجابة الا حاجة واحدة بس انك تمد ايدك عليا<br />والحمد للة مش عايز منها حاجة تركت لها البلد وسافرت للخارج وابعت مصاريفها وانا بعيد<br />لكن المصيبة اننى احبها ولكن خايف من ايديها"
archived = "2009-12-22"
capture_url = "https://web.archive.org/web/20091222081301/http://www.20at.com:80/masr/hot-topics/14446-2009-12-17-13-52-35.html"

