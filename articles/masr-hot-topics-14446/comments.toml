author = "ممدوح زكى زخارى"
posted = "2009-12-30"
text = "اقتباس mohamed ali:<br />هل كل الناس فكرين اخر علقه خدوها ولالالالالالالا<br />ههههههههههههههه هههههههه<br />اهم حاجه انك تذكر المكان الي انتا خدت فيه العلقه<br />طبعا فاكرها و كانها حدثت الان؟<br />يوم ما ضبطتنى المدرسة بتاعت التاريخ و انا بأقبل مدرسة اللغة الفرنسية الفرنسية الجنسية؟<br />كنت على علاقة غير مشروعة معها و حقا كانت تستاهل كل يوم مليون علقة؟<br />علشان شفايفها و صدرها و هى كلها تستاهل اى حاجة تحصلى؟<br />المهم كانت أيام و زكريات و مغامرات عاطفية جميلة"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123084651/http://www.20at.com:80/masr/hot-topics/14446-2009-12-17-13-52-35.html"
