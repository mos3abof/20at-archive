text = "يا بخت بتوع اليفت القماش كسبانين في كل الاحوال...نفاق شغالين...هبل شغالين...ده حتى أى محل عايز يعمل يافطة مضيئة مخالفة يقوم يحط فيها صورة الريس ويكتب \"نعم للريس\"وبكده اليافطة عمرها ماهاتتشال....أمال فهلوة يا حبيبى..وأهو كله ماشي وسيبها تسبح"
