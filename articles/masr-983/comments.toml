[[comments]]
order = 5
subject = "بلد زبالة"
author = "مصطفى"
posted = "2006-09-27"
text = "مصر بلد زبالة وأعتقد أننى أظلم الزبالة بهذا التشبيه .. الذى كتب فى الصحف العام الماضى من تفصيل للفساد الذى حدث طوال 25 سنة كان كفيل بتحريك الصخر ولكن ما حدث بعد ذلك شىء غريب فالجميع عادوا إلى حياتهم العادية وكأن الأمر لا يعنيهم .. منذ عامين وأنا أنتظر مظاهرة ضخمة يختفى على أثرها النظام ولكن وبعد مرور عامين مللت من الإنتظار .. وصلت الآن إلى حالة من اليأس شبيهة بتلك الحالة التى تنتاب الغريق بعد أن تخور قواه وأقصد بها إنتظار الموت وتقبله كنوع من الراحة ... كل يوم يستمر فيه النظام لهو دليل على أن الرجال فى مصر قد ماتوا ولم يبقى إلا الجبناء ، .... الشىء الذى يحيرنى أن جميع عوامل التغيير متوافرة فلماذا لا يحدث شىء ؟<br />فمثلا التغيير يحتاج إلى قوة منظمة وهذا متوافر فى الإخوان ...<br />التغيير يحتاج إلى تقبل الناس ، والناس الآن كما نعلم ضربها الجوع والفقر والمرض ....<br />ما الذى يؤخر التغيير ؟<br />لماذا لا نخرج اليوم بعد الفطار ونعتصم بالشوارع ؟؟؟<br />أعلم أن أى خروج يجب أن يتم بقيادة الإخوان فماذا ينتظر الإخوان ؟<br />الشىء الغريب أن مواقع الإخوان الآن كأنهم فى عالم آخر ، أشعر كأنهم عقدوا إتفاق على تمرير التوريث كما مرروا إنتخاب مبارك من قبل ... بالنسبة لى لو حدث هذا لن أحزن لسبب بسيط أننى أصبحت أكثر تصديقا لمقولة أن مصر بلد زبالة !!!!!!!"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

