text = "انت عمال تمدح في الراجل<br />انا حاسس انك لم تقرا له شيء الا المقالات دي<br />يا اخ الراجل ده منكر اصلا للسنة انت عمال تقول مفكر ومحترم هو اي حد كبر في السن ومسك قلم بقا مفكر ومشروع وعظيم<br />انت مش عارف اللي ينكر السنة يبقى ايه؟<br />سبحان الله"
