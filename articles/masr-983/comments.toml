[[comments]]
order = 26
subject = "لأخي أشرف رائعة أخرى للأعشى"
author = "كيمو العجلاتي"
posted = "2006-10-02"
text = "لأعشى قيس مكانة عندي ليس لغيره أبدا من شعراء الجاهلية والإسلام..ولقد سبرت القريض جله..وجندرته مليا..وما من شاعر سواه إلا و وجدتني أستطيع أن أدخل بما نظم أبيات كثيرة من لدني ولا يضطرب لقصيده نسج ولا نسق خلاه. وهذا لعمرك ما يجعله مميزا ومقدما عندي.<br />ما تعيف اليوم في الطير الروح *** من غراب البين أو تيس برح<br />جالسا في نفر قد يئسوا *** من محيل القد من صحب قزح<br />عند ذي ملك إذا قيل له: *** فاد بالمال تراخى ومزح<br />فلئن ربك من رحمته *** كشف الضيقة عنا وفسح<br />أو لئن كنا كقوم هلكوا *** ما لحي يا لقومي من فلح<br />ليعودن لمعد عكرها *** دلج الليل وتأخاذ المنح<br />إنما نحن كشيء فاسد *** فإذا أصلحه الله صلح<br />كم رأينا من أناس هلكوا *** ورأينا المرء عمرا بطلح<br />آفقا يجبى إليه خرجه *** كل ما بين عمان فملح<br />وهرقلا يوم ساآتيدمى *** من بني برجان في البأس رجح<br />ورث السؤدد عن آبائه *** وغزا فيهم غلاما ما نكح<br />صبحوا فارس في رأد الضحى *** بطحون فخمة ذات صبح<br />ثم ما كاؤوا ولكن قدموا *** كبش غارات إذا لاقى نطح<br />فتفانوا بضراب صائب *** ملأ الأرض نجيعا فسفح<br />مثل ما لاقوا من الموت ضحى *** هرب الهارب منهم وامتضح<br />ليت شعري عن خليل ماله *** إذ أكب الدهر يوما وألح<br />هل يقولن إذا كنت صدى *** صد عني<br />اقرأ بقية التعليق .."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 27
subject = "حبا وكرامة لاخى كيمو"
author = "اشرف"
posted = "2006-10-02"
text = "الكتب معزرة والرسل مخبرة.. والحق متبع والخير محمود.. والحرب ساكنة والخيل صافنة والسلم مبتزل والظل ممدود .. فان انبتم فمقبول انابتكم..وان ابيتم فهذا الكور مشدود.. على ظهور المنايااو يردن بنا.. فلسطين والباب مسدود ومردود.. انى امرؤليس من شأنى ولا اربى..طبل يرن ولاناى ولا عود.. ولا اعتكاف على خمر ومخمرة.. وذات دل لها غنج وتفنيد..ولا أبيت بطين البطن من شبع..ولى رفيق خميص البطن مجهود.. ولا تسامت بى الدنيا الى طمع.. يوما ولا غرنى فيها المواعيد"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 28
subject = "عاجل بسرعة البرق"
author = "كيمو --حاف"
posted = "2006-10-02"
text = "من كيمو حاف الى كيمو العجلاتى---- وصلتنى رسالتك واليك ماهواتى -- اناعمرى ماشفت ولا دقت طعم النابت-- وعلشان كده سالتك وعرفت ماهوثابت-- - ان اكلك عند صاحبك خلى اعصابك سابت--- ووصفت الحضره الذكيه كأنك زبون مرابط--- وعارف كل صغيره وكبيره ولاأجدعهاظابط--- ده لوقالوالعجوزه صابت والشابه شابت--- اقول اكلهابدوئه ولايقولوكيمو أكل نابت--- ويبقى المثل صحيح القوالب نامت-- واللى نصاص قامت"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 29
subject = "سلي صيامك"
author = "سيكو الميكانيكي"
posted = "2006-10-02"
text = "الرئيس مبـارك لقـى فانـوس سحـري قام دعكـه فطلعلـه منـه ابليـس<br />قاله : شبيـك لبيـك تطلـب ايه؟<br />قاله الرئيس: بـص بقـى يا عـم ابليـس انا عمـلت فى الشعـب بتاعـي كل حاجـة..قوللي بقى علـى حاجـة جديـدة اعملـها<br />ابليس قاله: بس كـده..بسيطـة..هـات ودنـك..وش وش وش وش وش<br />قام الرئيس قاله: ايه ياعـم لعـب العيـال ده..ده كـلام برضـه ؟<br />قام ابليس قاله: بـلاش دي..هـات ودنـك...وش وش وش وش وش<br />قام الرئيس قاله: إيه يا عـم ده ...انـت شكـلك ابليـس نص كـمّ ولاّ ايه ؟<br />ابليس قاله : معقـول الفكـرة دي مـش عاجبـاك؟!..طـب خـد دي بقى..وش وش وش وش<br />قام الرئيس قاله : ياعم انت شكـلك كـده لا ليـك في العفـرته ولا حاجة..هات ودنـك بقـى أقـولك أنا باعمـل إيه في الشعـب بتاعي....وش وش وش وش وش<br />قام ابليس وشه إصفرّ و قاله : يا راجـل اتّـقي<br />الله<br />واحد اتحشر في زحمة المرور فلقى واحد بيخبطّله على شباك السيارة<br />فتح الشباك و سأله: عايز ايه ؟<br />قاله : الرئيس حسني مبارك خطفوه و الفدية 5 مليون دولار و لو الفدية مااتدفعتش .. الخاطفين هددوا يدلقوا عليه بنزين و يولعوا فيه..واحنا بنجمع تبرعات .. تحب تشارك ؟<br />الرجل سأل: و في المتوسط الناس بتتبرع بكام ؟<br />الرجل الثاني : من 5 الى 10 لتر بنزين"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 30
subject = "رد للكيمو حاف كامل الأوصاف"
author = "كيمو العجلاتي"
posted = "2006-10-02"
text = "إعلم يابن الأفاضل والعدول ..أن ليس أنفع للأجسام من أكل الفول..وأسأل أي خبير في التغذية سيقول..بروتين خالص لا كولسترول...أنت مولع بأكل اللحوم..وإكتناز أطنان الشحوم..وهذة حفظت بالضبط..تسبب أمراض الكلي والضعط. فإن أتيت على كذا دجاجة..فلا أقل من عشر كيلو مترات رياضة بالدراجة..وتشرب من الماء كذا زجاجة..هل وعيت فوائد الفول؟ وتنويره للأذهان والعقول المفتوح منها والمقفول؟ ثم دلني على طعام مثله بسعر معقول؟<br />يوم طيب!"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 31
subject = "عذرا اخى كيمو"
author = "اشرف"
posted = "2006-10-02"
text = "حباك الله من نعم لم ينعم بهاعلى كثير من عباده الكثيرين# فناشدتك الله لاتغتر بماملكت وكن متواضعابين الحين والحين@ ولا تأتى بنظم يرهق اخوانك فى التفسير والتعليل# فكل قصيدة لهاظرف عند قائلهاولها سبب وتاويل@ فربما قصد شاعرامقصدا وغيره قصد قصدا غير القصيد# فبالله اتنا بشعر تألفه ازانناولا تاخذنا مأخذبعيد# فاين المتنبى والبحترى وابو العتاهيه صاحب القول السديد# فشعراء الاسلام افضل شعرا من قوم جهلوا الشريعةوالتنزيل@ وعذرأ انى حاولت معارضتك وانا لست اهلا لذلك التعريض# وتقبل منى تحية وسلاما حتى تستقم المواعيد"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 32
subject = "رد على الرد"
author = "كيمو --حاف"
posted = "2006-10-02"
text = "اعلم ياكيمو ياأخى الصغير--- ان اكل الفول ضرره على المعده خطير --- بيلهب المصران وينزل البواسير --- ويرفع الضغط وبيلغى التفكير ---- ده حتى فى بلاد الفرنجه طعام للحمير------ ولا انت عايزنا ننهق ونلبس طراطير --- ونمشى عرايا ونمسك صفافير--- ونجرى فى الشوارع صغير وكبير --- ويذيعوا فى الجزيره اخر التقارير ---- المصريين طلع لهم ودن كبيره وديل صغير---- رمضان كريم"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 33
subject = "النابغة الذبياني"
author = "كيمو العجلاتي"
posted = "2006-10-02"
text = "أمن ال مية رائح أو مغتد *** عجلان ذا زاد وغير مزود<br />أفد الترحل غير أن ركابنا *** لما تزل برحالنا وكأن قد<br />زعم البوارح أن رحلتنا غدا *** وبذاك تنعاب الغداف الأسود<br />لا مرحبا بغد ولا أهلا به *** إن كان تفريق الأحبة في غد<br />حان الرحيل ولم تودع مهددا *** والصبح والإمساء منها موعدي<br />في إثر غانية رمتك بسهمها *** فأصاب قلبك غير أن لم تقصد<br />غنيت بذلك إذ هم لك جيرة *** منها بعطف رسالة وتودد<br />ولقد أصابت قلبه من حبها *** عن ظهر مرنان بسهم مصرد<br />نظرت بمقلة شادن متربب *** أحوى أحم المقلتين مقلد<br />والنظم في سلك يزين نحرها *** ذهب توقد كالشهاب الموقد<br />صفراء كالسيراء أكمل خلقها *** كالغصن في غلوائه المتأود<br />والبطن ذو عكن لطيف طيه *** والإتب تنفجه بثدي مقعد<br />مخطوطة المتنين غير مفاضة *** ريا الروادف بضة المتجرد<br />قامت تراءى بين سجفي كلة *** كالشمس يوم طلوعها بالأسعد<br />أو درة صدفية غواصها *** بهج متى يرها يهل ويسجد<br />أو دمية من مرمر مرفوعة *** بنيت بآجر تشاد وقرمد<br />نظرت إليك بحاجة لم تقضها *** نظر السقيم إلى وجوه العود<br />سقط النصيف ولم ترد إسقاطه *** فتناولته واتقتنا باليد<br />بمخضب رخص كأن بنانه *** عنم يكاد من اللطافة يع<br />اقرأ بقية التعليق .."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 34
subject = "ليس ذنب الفول المبين..أنظر بلاد الصين"
author = "كيمو العجلاتي"
posted = "2006-10-02"
text = "لكيمو حاف الأريب الفطين..اليك منتهى الخبر اليقين..رأيت- أبيت اللعن- ببلاد الصين-- فول الصويا وما هم منه بصانعين...حليبا سائغا للشاريب...وآخر يقال له\" الكيرد بين\"..لعلك بالأخير من العارفين..ومنه تصنع أطباق لذة في كل حين...بمذاق يروق كل المشتهين...ورهبان بوذا من النباتين--لا يمسون لحما سيد العارفين..يجعلون منها الغذاء الثمين..وهم أصح الأصحاء بعد مع اليقين. ليتنا نلحق بذيل الصين..إذا والله كنا مع الغانمين...ليس جرم الفول بل الملاعين..من حكام مصر الفجرة الجاهلين...أن حالنا غدت برخص الطين..وأنا سنبقى من المتأخرين..عن كل ركب لأبد الأبدين..ونظل مطية لكل خوان لعين."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 35
subject = "ان الله لا يغير ما بقوم حتى يغيروا ما بانفسهم"
author = "انسان"
posted = "2006-10-02"
text = "لا اعرف ان كان تعليقى له علاقة بالموضوع ام لا كن اعتقد ان الحال واحد ففى بلد ترغم الام ابنتها على ارتداء الضيق والقصير لتبرز مفاتنها وكل نقاط اثارة الشهوات والغرائز حتى اصبح شباب البلاد يتقلبون على النيران فلا مكان تقع عليه العين فالشوارع الا وملاتها المناظر المثيرة كيف بالله عليكم تفكرون فالرد او حتى مجردالتفكير فالاعتراض على شرزمة من الطغاة اجهضو شعبا وتحكموا فيه شعب كسول نائم ثم اذا به شعب منساق وراء شهواته فكيف بالله عليكم لا يستطيع حتى طفل يملك القليل من الذاكء فى التحكم فى مثل هذا الشعب الواهن حاسبو انفسكم قبل ان تحاسبو لا الله لا يغير ما بقوم حتى يغيروا ما بانفسهم"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 36
subject = "تحية لعادل بن العادلة بين الزناة"
author = "سيكو"
posted = "2006-10-04"
text = "حذاري يابن تافة الأعاجم*** وإلا نال عرضك كل قاسم<br />أعادل إن أمك من مجوس*****لها ولع بإتيان المحارم<br />تأدب يا بن خالك دون شك***لعتت من الجحاجح والأكارم<br />يدب لخدر أمك يعتليها****أخوها العلج في ليل الفواحم<br />وجدك قائم بالباب هاجت***به الشهوات في شبق مهاجم<br />يناقل بين قائمتيه قهرا*****وينغط في خلاء نغط كاظم<br />وفاض به الغرام فلم يبالي****مقولة ناصح أو لوم لائم<br />فأولج في إست أمك نصف إير**فصاحت كله يابن الأشائم<br />وهاج الجار جار السوء هذا***فأقبل نحو ثالوث الغواشم<br />وألقمها هزيل الأير راحت*** تعاصره بفيها عصر ظالم<br />تعاورها الثلاثة ينكحوها *** تراوح فوقها فعل الحوائم<br />وأمك جودها بالعرض أضحى**يصاغر عنده جود لحاتم<br />تقلب طرفها من فرط شوق***لأير مثل أعواد اللهاذم<br />وتعدل بين طراق لديها**** كجور سدوم في غبش وعاتم<br />لهذا إسمك المنحول زورا**برغمك يابن ساعية الأراقم<br />حذاري ويل أمك أن تثرني**فتعلم هجمة الصيد الضراغم<br />عفوت اليوم عنك عن إقتدار**نجوت بجذع أنف منك راغم"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 37
subject = "لماذا نتنكر للايجابيات"
author = "ايمن امام"
posted = "2006-10-07"
text = "السلام عليكم وكل عام وانتم بخير- اه ياشعب مايطومرش فيه معروف - الراجل اعطى حديقه الحيوان عدد 2 غزاله زكر وانثى - شىء عظيم ورائع غزالتين ياشعب ياناكر الجميل لا وايه دكر ونتايه الحمد لله انه مااداهمش اتنين دكرا-كانت تبقى حوسه - المهم انا عاوز اسأل سؤال برىء جدا ياترى فى دكتور هناك كشف عليهم وأتأكد انهم غزالتين يعنى ما يكونوش كلبين مضروبين من الشارع - او يكونوا بدايه خصخصه ازاى - اقولكم - الفكره بسيطه جدا الطكتور يهدى الحديقه غزالتين - وتتعلق يافطه ويه ميه - تمر كام سنه -وييجى ابن ابن عاطف عبيد ويقول ان الحديقه دى مدينه لجده بتمن الغزالتين ودول كانو غزالتين من النوع النادر الذى لايوجد الا فى اماكن حساسه فى العالم - اللهم انى صائم - المهم تشكل لجنه واللجنه تقر بأن الغزالتين دول يساوو عده ملايين - يقوموا يجيبوا بيت خبره يهودى ويدوله كام مليون - لتحديد ثمن الغزالتين بسعر ذلك اليوم المهبب ويضاف الى الثمن - عدد بقاء الغزالتين فى الحديقه ونسبه الارباح التى كان من المفروض ان تحققها الحديقه طيله هذه المده - ونظرا لان الدوله تسير على خطى الخصخصه يبقى الواد احق بغالتين جده والتمن بعد خصم حق الغزالتين يطلع كام الف جنيه - ويقوم الواد ابن المحظوظه يقدم ما يفيد انه يتبع قانون الاستثمار -وبالتالى فأنه معفى من الضرائب والرسوم الجمركيه ويستورد قمصان نوم وكام الف سياره لزوم الحديقه وكمان كام الف جهاز كمبيوتر وكام الف زجاجه خمر وكام الف اجهزه حمايه اليكتونيه وكام شريك اجنبى - وكام دكتور بيطرى مستورد لتوقيع الكشف الطبى على الحديفه واللى فيها والتكلفه على قفا الزبون وتطلع الدوله مديونه بكام مليار - يقوم واحد من مجلس الشعب يقدم استجواب - وكاالمعتاد ينتقل المجلس الى جدول الاعمال - تقوم جمعيات الرفق ب<br />اقرأ بقية التعليق .."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 38
subject = "زبالة الزبالة"
author = "العربي المصري حشيش"
posted = "2006-10-09"
text = "الصور زبالة والتعليقات زبالة ولازم تحديد نوعية الردود حتى لايقول علينا العالم الزبالة أننا زبالة..<br />لابد من الموضوعية في التعاطي مع مثل هذه الأشياء..<br />مثلاً في حديقة الحيوان هناك قرود تعامل معاملة غير اعتيادية وهي تتبع يوسف والي شخصياً وكان يقدم له تقرير يومي عنهاوهي المعروفة بالربابيح، وهذه القرود هي من بني اسرائيل التي نسخ الله أقوامها وظلت تتناسل ولدينا الأدلة على وجود هذا القسم من القرود، وأهم الأدلة في البخاري عن صحابي جليل يقولوجدت قردة ترجم قرداً زانياً فرجمت معهم..<br />وياجماعة سيبكم من عهد مبارك وواحد زبالة أهدى عدد 2قرد أو غزال أوكركدن.."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

