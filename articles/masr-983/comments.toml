[[comments]]
order = 15
subject = "تَمَرُدُ الظِلالُ.."
author = "رشيد الْجشي"
posted = "2006-09-29"
text = "كَم من مُحالِ ِباتَ أمْراً واقِعاً***لا تُجْزِموا أن الْمُحالَ..مُحالُ..!؟؟<br />بل وانْشُدوا زَمَنَاً جديداً قادِماً ***يأتِي لكي,,يَنْزاحَ هذا الْحالُ<br />وادعوا لِرَحْمٍ.. يا أحِبِة حاملٍ ***بالعَزمِ حتى تَنْطوي ألأقوالُ<br />والفِعلُ يَغدو فَرْيُنا بيْنَ الورى***سَبَقَ الكلامَ..فََبَرْعَمَتْ آمالُ<br />حتى إذا غِبْنا ولم نَرثْ الرُبَى ***هَلَّتْ لِكي تَرِثَ الرُبَى أجْيالُ..!!<br />لو أن جَدَ اليوم َقَد نَشَدَّ العُلا***ذّهَبَ الْحفيدُ إلى العُلايَخْتالُ<br />صَلوا لآتِ الدهرِ يُصِلِحُ أَمرَنا ***لا تَقْنَطوا..فِي الآتياتِ مَجالُ<br />ظَلُّوا قُعوداً..هادِنوا..أو داهِنُوا ***واسْتَبْشِروا ما شَدَّت الأغْلالُ<br />فالصيدُصِيدٌ بالقُيودِ بِدونِها ***ما دامَ..عيْشاً ما طَوتْ آجالُ..!؟؟<br />لولا الْحياءُ لَقلتُ.. أنَّا نِسوةُ ُ ***فِي قارِعاتٍِِ صالَ فيها رِجالُ..!!<br />ما لِلتَمَنُعِ فِي رَوابينا اخْتَفى***لو غابَ عنا الكَربُ..جاءََ وَبالُ<br />مع كُلِ هذا ما تأفَفَ..غاضِبٌ***يَوماً ولا قد صاحَ ضاقَ الْحالَُ..!؟؟<br />بِتْنا كحُمْرِانٍِ يُطاوِعُ َ ظَهرُها ***لا يَشكُ مَهْما زادَتْ الأحْمالُ<br />لو أدمَنَتْ ذلَّ الهوانَ نُفوسُنا***يا ليتَ لا تَرضى الهوانَ ظِلالُ..!!<br />عَلَّ الظِلالَ..إذا بِحيْنِ تَمَردَتْ ***لا نَرتَضي.ما لم تُطقْهُ ظِلالُ..!؟؟<br />ظِّلِّي تَمَرَدَ ..ذاتَ صُبْحِ ِِ..ما أرادَ الإنْصِياعِْ..!!<br />وأنا حَييتُ أقولُ سَمْعاً..في مَعِيَةِ من أطاعْ..!!<br />أَحْنَيْتُ عَزْمي.صاحَ ظِلي قد أردَتُ الإمْتِناعْ..!!<br />وبَسَطتُ خَدي لِلأكُفِ فَما أرادَ الإضْطلاعْ..!!<br />رَفَضَ الأوامِرَ والنَواهي.ظِلُ..مَلَّ الإخْتِضاع..!!<br />ظِلي تَمَرَدَ مُعْلِناً..عِصْيانِهُ ..!!<br />ما عادَ يَرْسُمُني..<br />بِريشةِ..أو يَراعْ..!<br />اقرأ بقية التعليق .."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

