[[comments]]
order = 21
subject = "فك الله قيده"
author = "اشرف"
posted = "2006-10-01"
text = "الأخ العزيز كيمو اشكرك على التحيه الطيبه ولكن ارجو الا تغضب منى لموقفى من الرئيس صدام فك الله اسره واحب ان اوضح لك شىء اولا - انا اقرا للأستاز الدكتور محمد عباس منذ التسعينات ايام كان يكتب فى جريدةالشعب وكنت انتظر مقاله هو والأستاز عادل حسين (رحمه الله)كل ثلاثاء ومن منا ينسى مقال (من يبايعنى على الموت) للدكتور عباس والذى كان سبب اغلاق الجريده المحترمه الوحيده فى زلك الوقت ثم بعد زلك جمد حزب العمل-- ثانيا ليس معنى اننى احب الدكتور محمد عباس او مقالات الاستاز مصطفى بكرى او الاستاز عبد البارى عطوان ان لايكون لى موقف خاص بى وان لا انساق ولا اتعصب لتيار معين وقديما قال الامام مالك(رحمه الله ) كل ياخذ منه ويرد الا صاحب هذا المقام (صلى الله عليه وسلم ) وعن سيدنا عمر (رضى الله عنه) قال اصابت المرأه واخطأ عمر والدكتور محمدعباس نفسه كان صاحب توجه يسارى هو والاستازعادل حسين ثم اصبح اتجاههمااسلا ميا وهذا لاينقص من قدرهما بل يزدهما --- ثالثا اعلم يااخ كيمو ان كل من يعادى امريكا اوتعاديه امريكا فان بعض كتابنا وادباءنا وشعرائنا بدافع العاطفه وبغضنا لامريكا والغرب يجعلون منه بطلا قوميا حتى ولو كان العقيد القذافى قبل ان ينبطح من تلقاء نفسه ومن امثال هؤلاء صدام حسين بل ان بعضهم يحاول صبغته بصبغه اسلاميه والرجل كان بعيد كل البعد عن الاسلام ولا يعرف عنه الا اسمه وكان كل ولائه لاستاذه الملحد ميشيل عفلق وقد عرفت انه امر بصلاة الجنازه عليه فى مسجد ببغداد برغم ان الرجل كان مسيحيا ؟؟؟ وانا لااريد ان انكأالجراح فاالرجل اسير الاعداء وهذا يؤلمناويحز فى نفوسنا لكن فى نفس الوقت يجب ان يكون لنا رأى خاص بنا حتى ولو خالف من نحبهم من شعراء وادباء وكتاب وطنيين فهذا ليس عيبا ولا شىء نخجل منه وقديما قال العلما<br />اقرأ بقية التعليق .."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 22
subject = "الى العجلاتى"
author = "كيمو حاف"
posted = "2006-10-01"
text = "حلوه قوى كيمو حاف دى ياعجلاتى انا مش هاغيرها بس فيه حاجه عايز اعرفهالك انا مبأجرش عجل لان عندى عجلتى ملكى وثانيا تفتكر لو انا اجرت عجله واتأخرت هاتقدر تعمل معايا حاجه ؟ انا معايا حزام اسود فى الكراتيه ثم نفسى اسالك انت تعرف ابو غضه ده من زمان --- وياترى لما كنت بتحضر حلقات الزكر بتاعتهم كانوا بيفرقوا عليكو عيش ولحمه ولا عيش ونابت -- ياريت تعرفنى --- وكل سنه وانت طيب"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 23
subject = "حبا وكرامة أخي أشرف"
author = "كيمو العجلاتي"
posted = "2006-10-01"
text = "لأخي العزيز أشرف حفظتم ..هذة قصيدة لعبيد بن الأبرص أحبها جدا .<br />هبت تلوم وليست ساعة اللاحي *** هلا انتظرت بهذا اللوم إصباحي<br />قاتلها الله تلحاني وقد علمت *** أن لنفسي إفسادي وإصلاحي<br />كان الشباب يلهينا ويعجبنا *** فما وهبنا ولا بعنا بأرباح<br />إن أشرب الخمر أو أرزأ لها ثمنا *** فلا محالة يوما أنني صاحي<br />ولا محالة من قبر بمحنية *** أو في مليح كظهر الترس وضاح<br />يا من لبرق أبيت الليل أرقبه *** من عارض كبياض الصبح لماح<br />قد بنت عني وبات البرق يسهرني *** كما إستضاء يهودي بمصباح<br />دان مسف فويق الأرض هيدبه *** يكاد يدفعه من قام بالراح<br />ينزع جلد الحصى أجش مبترك *** كأنه فاحص أو لاعب داح<br />كأن ريقته لما علا شطبا *** أقراب أبلق ينفي الخيل رماح<br />كأن فيه عشارا جلة شرفا *** شعثا لهاميم قد همت بإرشاح<br />بحا حناجرها هدلا مشافرها *** تسيم أولادها في قرقر ضاح<br />هبت جنوب بأولاه ومال به *** أعجاز مزن يسح الماء دلاح<br />فمن بنجوته كمن بمحفله *** والمستكن كمن يمشي بقرواح<br />فأصبح الروض والقيعان ممرعة *** من بين مرتفق فيه ومن طاح<br />فالتج أعلاه ثم ارتج أسفله *** وضاق ذرعا بحمل الماء منصاح<br />كأنما بين أعلاه وأسفله *** ريط منشرة أو ضوء مصباح"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 24
subject = "عيش ونابت"
author = "كيمو العجلاتي"
posted = "2006-10-01"
text = "حبيبي كيمو حاف صاحب النكت والألطاف، صاحبك بيوزع نابت وعيش حاف لهو طري ولا جاف..والحلو بتاعه خشاف..يعني متأملش في ضاني الخراف..ولا قطايف ولا كنافة ودي الأصناف..وخادم التكية إسمه عساف...طويل عريض بعضلات وأكتاف..ولو أجرت عجل وجريت يا بهي الأوصاف..حأسلطه عليك وتتعلم تخاف...ومن سمع يا أخي مش زي من شاف. أتمني ليك صوما مقبولا وإفطارا شهيا."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

