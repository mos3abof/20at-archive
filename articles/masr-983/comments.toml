text = "الناس اللى خايفه تعلق لا صيامها يبوظ هو بايظ بايظ على و لاد البلد<br />طيب نعهمل ايه<br />الواحد دمه بيتحرق من المهازل اللى بتحصل ف البلد و بيفقد اعصابه<br />و بنلاقى نفسنا ماسكين الكيبورد و هنكسر الزراير و احنا بنكتب من الغيظ<br />بس الواحد ممكن يعلق على الموضوع ده بجمله واحده<br />يا امه ضحكت من جهلها الامم"
