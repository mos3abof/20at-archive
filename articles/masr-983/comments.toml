[[comments]]
order = 7
subject = "البلد المزنوق"
author = "هو يعنى الشعب العسل ده لازم يحب يزنق نفسه وخلاص هو يا جيمى يا مهدى"
posted = "2006-09-28"
text = "عادى مهم احفاد من جاء بمحمد على واليا واول ما تمكن خزوقهم كلهم رغم ما اضافه من انجازات للبلد، انما يظهر ان البلد دى متمشيش غير كده ، يا بتقديس الفرعون يا بالكرباج يا الاحتلال و حاليا بالجزمه العيب ليس فى الرئيس الفلانى او الوزير العلانى العيب فى الشعب اللى على راى مقال قريته مره بما معناه : طالما الواحد من دول بيروح يلاقى طبقين الاكل على السفره و بعدها يخش يتخمد هو و المدام و العيال خلاص وتولع الدنيا بما عليها (ربما قصد كاتب المقال ان الناس بقت زى البهايم تاكل وتتزاوج و تنام!)<br />يعنى هو لو الاخوان مسكوا الحكم هينصلح الحال! ابدا ، ما هى الا صوره اخرى من الاستبداد ، ولا كل من رفع رايه الاسلام(والله اعلم ما فى نيته) نضرب له تعظيم سلام."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

[[comments]]
order = 8
subject = "جمال البنا والاساءات"
author = "معاذ محمود عامر"
posted = "2006-09-28"
text = "أعتقد يا عشرينات انه كان يجب عليكم من باب الدقة والامانة أن تنشروا آخر مقالين كتبهماالمفكر الاسلامي الأستاذ جمال البنا الأربعاء السابق واربعاء الأمس...<br />فبما أنكم قررتم ان تنشروا مقاله المثير للجدل عن التدخين والصيام, كان يجب أن تكملوا السلسلة المتعلقة بهذا الموضوع...<br />وأعتقد أنه تعرض لكثير من الاهانات على لسان بعض العصبيين أو المتشددين....<br />وأظن أن مقاله الذي كتبه الاربعاء قبل السابق كان جديرا بأن يدفع عنه كثيرا من هذه الاهانات السفيهة التي لا يحكم أصحابها عقولهم قبل أن يطلقوها في وجه رجل جليل ومفكر كبير وصاحب مشروع فكري جيد جدا,<br />وان لم يكن كل ذلك فعلى الأقل هو كبير في السن بدرجة تجعل اهانته من الفحش والسب الذي نهى عنه الرسول صلى الله عليه وسلم,<br />لذا أرجو منكم رجاء حارا جدا جدا أن تنشروا مقالتيه المؤرختين27_9<br />و20_9<br />ولكم الشكر العظيم والاحترام الجم ان فعلتم..."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

