[[comments]]
order = 11
subject = "فاعلاتُنْ فاعِلاتُنْ..فاعِلَن.."
author = "رشيد الْجشي"
posted = "2006-09-28"
text = "فاعِلا تُنْ..فاعِلا تُنْ...فاعِِلَنْ *** تاهَتْ الأوطانُ مِنا في الوطَنْ..!؟؟<br />بَلْ وتاهَ النَحوُ فِي أشْعارِنا***وغَدَا الإمْلاءُ فيها مُضْحِكنَْ<br />أُكْتُبوا في النحوِ ماأحْبَتُموا *** من بَنحوٍ ظلَّ فينا سائِلِنْ..!؟؟<br />أوفمن بِالصَرفِ يَدْري إخْوَتي *** لا أرى بالصَرْفِ مِنا.مُدرِكَنْ..!؟؟<br />بل ومن بالضادِ حتى كُلها ***فِي رُبوعِ العُربِ.يَبدو حافِلَنْ<br />قد رَهَنَّا النَحو مع أحكامِهِ *** مع طِباقٍ مع مَجازٍ من زَمنْ<br />واشْتَرينا عادِماً من سامَنا ***بُُرْغَراً كولا وِشُهْداً في اللبَن<br />ما لنا والنحوُ كي نُبْقي بهِ ***في قَصيدٍ باتَ قَطْعاً مُرْتَهَنْ<br />فانْظُموا الأناتِ لو نامَ الوَرى ***وابْحثوا مِثلي.لِتَلقوا قارئنْ..!!<br />لم يَعُدْ في الْحَيِ قَومٌ يَقرؤوا***بل ولن تَلقوا لِشعْرٍ.سامِعَنْ<br />أمسَت الأحداقُ لا تَرنو إذا ***ما رَأتْ خَصْراً تلَوى راقِصنْ<br />بل ولن تلقى عُيوناً فَنْجَرَت *** إلا إن تَلقَ غَنوجاً صادِحَنْ<br />هكذا يا قومُ بِتنا فِي الورى ***قد مَضتْ أيامُ ..تَطوي قُرأنْ..!!<br />فاعِلا تُن..فاعِلا تُن ..فاعلِن ***لم يَعُدْ للنحوِحُكمٌ أو سُنَنْ..!!<br />فاكتُبوايا قوم ما يَرضى بِهِ ***عَقْلُكم لا من أتاكُم رافِضَنْ<br />لاتَسَلْني عن جِناسٍِ ياأخي***أو تَسَلني عن طِباقٍ مُطْلَقنْ<br />أو تَسلْني يومَ عن فِعلٍ بَغا***كي تَعَدى بَعد أن فَكَّ الرَسَنْ<br />لا تسلْ عن صورةٍ أهْملتُها***باتَ شِعري يا زميلي مُهْمَلَنْ<br />أو فلا تَبْحَث بِنَظمي لَمْحَةً *** فيها قد فََنَنتُ ..فَناً راقِيَن<br />لو نَويتَ الدارَ نَحوي.. زائِراً ***لا تَهَبْ لولا تَرانِي مُقْطِبَن<br />فاقصُدْ الربوات حالاً هاتَِني ***ضُمَةً صَفراءَ من وَرْدِ الوَهَ<br />اقرأ بقية التعليق .."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

