[[comments]]
order = 18
subject = "شكرا"
author = "اشرف"
posted = "2006-09-30"
text = "شكرا يااستاذ كيمو على التحيه الرقيقه وشكرا على تعريفك لنا بهذا الشاعرالجميل صاحب القلم السيال والسحرالحلال وان كنت اخذ عليه عشقه لصدام حسين وقوله قصيدة رائعة تمدحه - فرغم تعاطفنا مع صدام كرئيس عربى ورغم بغضنا لامريكا وحلفاءها من العرب والمسلمين الذين خانواالله ورسوله وخانوا اوطانهم وشعوبهم الا ان هذا لايعفى صدام من استبداده وجبروته ايام حكمه وعلى كل فالشاعر رشيد الجشمى شاعر كبير له وزنه وثقله فى عالم الشعر وكم اتمنى والله ان اسمع قصائدلشاعرنا الكبير بالصوت -- فحاسة السمع فى الشعر تكون اشد تاثيرا على السامع --- وفى الختام 1000شكرا لتعريفك لى لشاعر رائع كنت اجهله"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011417/http://masr.20at.com:80/article.php?sid=983"

