text = "لو مصر بلد زبالة فعلا يا اساتذة يا محترمين لازم تتأكد انها زبالة بينا كلنا هي مصر ذنبها ايه ان ناس زيي و زيك عليها؟؟؟<br />مصر دي كانت مهد الحضارات بلد الأهرامات ولا نسيت؟؟ عارف ليه ؟ لان كان فيها ناس نضاف مش زبالة<br />موكاكاي<br />http://egybeats.blogspot.com"
