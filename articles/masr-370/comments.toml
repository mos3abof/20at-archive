[[comments]]
order = 14
subject = "قديمة"
author = "زعرب"
posted = "2006-05-27"
text = "يا اخوانا انا سمعت الكلام دة قبل كدة,وكان برضة عن ضرب المصريين بالجزمة,<br />لكن القائل ما كانش المرشد, كان واحد امة من ويلز مركز انجلترا , وابوة فاقد الاهلية وكان نفسة يعيش فى بلاد الاكسلنسات.<br />وساعة ما سمعت الكلام دة , كان تقديرى ان دة طبيعى من عيل ما يعرفش قيمة \"مصر\" وعايش عالة عليهاوانتماءة ليس لها.<br />اما المرشد فدا راجل وان كان غلط فى مصر نتيجة اندفاع ارعن , الا ان حكاية الجزمة دى فهى استثمار للغلط اللى وقع فية نتيجة غرورة وتعالية, وعلى رأى المثل الشعبى \" ال\"ق..\" تلهيك وتجيب اللى فيها فيك.<br />والدليل ان الكلام اللى سمعتة حقيقى , موثق بالصور وكلنا شفناة فى مظاهرات الخميس المشؤم, حيث قام \"الشرفاء\" و \"الوطنيين\"بتنفيذ الاوامر بتمزيق علم مصر وضرب ابنائها بالجزمة."
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084459/http://masr.20at.com:80/article.php?sid=370"

[[comments]]
order = 15
subject = "يا سلام عليك يا براء"
author = "سمر منصور"
posted = "2006-05-27"
text = "براء انت فعلا فظيع,فى الاول لازم احييك على كتاباتك المميزه,و خاصة بعد ما شوفتك فى برنامج الجزيرة,كلكم بصراحة حاجة تشرف.<br />بالنسبة للمقال,فأنت فى رأيى حللت الموضوع صح و بمنتهى الحياديه,و النقط اللى ناقشتها غاية فى الاهمية,خاصة تصريحات المرشد اللى بقت فوق الاحتمال,انا باحترم الراجل ده جدا و باحترم كفاحه بس ياريت يقلل من تصريحاته اللى بتحيرنا أكتر فى الاخوان و منهجهم.<br />فى حوار روزاليوسف اياه اكد ظبعا انه ماينفعش مسيحى يبقى رئيس مصر,و بعدها طلع بعدها عبدالمنعم أبو الفتوح فى العاشرة مساءا يحلف ميت يمين انه لا يتعارض مع منهج الاخوان,يقولوله يا عم ده رأيك انت يأكد و يقول لأ انا باتكلم بلأسم الاخوان كلهم و عارف بقول ايه,طب نصدق مين؟؟؟؟<br />الفكرة مش فى كون ده موضوع فرعى و لا أساسى-موضوع طز بالنسبة لى غاية فى التفاهة,لكن تقول ايه فى اللى بيزايدوا رغم ان كل تصرف بيتصرفوه هو طز فى مصر و المصريين-بس الفكرة فى تضارب التصريحات.<br />طبعا لا تعليق على اخواننا بتوع البيت بيتك و خاصة العزيز تامر أمين-ربنا يحميه-<br />برافو براء,اسلوبك مميز,keep it up"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084459/http://masr.20at.com:80/article.php?sid=370"

