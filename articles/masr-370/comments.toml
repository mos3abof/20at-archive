[[comments]]
order = 19
subject = "الحق أبلج وإن كثر الباطل"
author = "صواعق الحق"
posted = "2006-05-27"
text = "أخوتي وأخواتي القرآء الكرام<br />إتنوا عارفين ان ال بيصلي ربنا حيعذبه<br />مستغربين ؟؟؟؟ غريبة هي ديه طريقة المنافين والمدسوسين على الامة والظريف فى الموضوع لما تقوله إزاي تقوله كده يرد بالقرآن فيقرأ نصف الآية ويترك النصف الآخر<br />يعني ربنا بيقول فى القرآن الكريم ويل للمصلين-الذين هم عن صلاتهم ساهون- الذين هم يرآءون ويمنعون الماعون<br />فلما يجي يستدل يجيب أول آية بس ويسيب كل الآيات ال بعدها فينقلب المعني<br />هذا بالضبط أسلوب المرجفين فى الامة من عهد الرسول صلي اللع عليه وسلم الكذب على الصالحين والعملاء والدعاة والمصلحين والموضوع ده سنة إلآهية من قبل الرسول كمان<br />أنا بيعجبني فى شيخ الاسلام ابن تيمية منهجه ال بتر بيه المللين والمنافقين وفضح طرقهم الرخيصة للنيل من اهل الحق وعلشان كده الزنادقة العلمانيين فى البلد بيكرهوه<br />هو علمنا ان الرد على اهل الباطل يكون من كلامهم المثبت عنهم فى كتبهم<br />علشان ميقدرش حديرد علينا ونحن نطالب بأن تفتحوا كتب الإخوان المسلمون والجماعات الإسلامية والمعتدلة التى تحمل هم أمتها وإذا وجدت كلام من هذا القبيل إضربوا المرشد انتم بالحذاء والجزمة وانا معكم<br />وبقي ان أقول إن فين ناس أقل من الحيوانات فعلا وده مش كلامي ده كلام ربنا<br />يقول الله عن المكذبين والمنافقين في سورة الأعراف<br />وَلَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيراً مِنْ الْجِنِّ وَالإِنسِ لَهُمْ قُلُوبٌ لا يَفْقَهُونَ بِهَا ا وَلَهُمْ أَعْيُنٌ لا يُبْصِرُونَ بِهَا وَلَهُمْ آذَانٌ لا يَسْمَعُونَ بِهَا أُوْلَئِكَ كَالأَنْعَامِ بَلْ هُمْ أَضَلُّ أُوْلَئِكَ هُمْ الْغَافِلُونَ (179)<br />فربنا قال على الظالمين والمنافقين والملحدين انهم اقل من الحيوانات وذكر الاسباب وهو تعطيل العقل"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084459/http://masr.20at.com:80/article.php?sid=370"

[[comments]]
order = 20
subject = "المصريون لا يقرأون"
author = "الجهبز"
posted = "2006-05-28"
text = "أظن عيب أوى أن واحد مثقف و فاهم يعتمد على شوية عيال (3 اعلام ) أكيد عقلق لم ينضج بعد لانه لم يدرس سنة ستة أصلهم رجعوها تان اول مرة أعرف أمس و القمح مش عاوزيين يستلموه من الفلاحين طب يا اخونا خلووه قال (؟) و نحاكمه بس بشرط نحاكم برده اللى نفذ !!! يا ترى محمود سعد اتكلم قبل كده عن ضرب الشرطة الناس بالجزمة و التوثيق هنا واضح جدا بالصوت و الصورة و الفضائيات ..... الموضوع واضح جدا .... الحكومة عاوزة تقلول انها و الاخوان زى بعض يعنى ماحدش احسن من حد و قبل كدة نعمان طلع دكتاتور و نور طلع مزور ..... مفيش حد غير جمال ... حافى لا يضرب بالجزمة ... منتخب من قبل جميع الحزب الوطنى .... و الشهر العقارى بتاعه يعنى مش معقول يزور ......"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084459/http://masr.20at.com:80/article.php?sid=370"

[[comments]]
order = 21
subject = "المحرقه"
author = "عبدالفتاح طنطاوي"
posted = "2006-05-28"
text = "تابعت كما تابع غيري ماينشر عن المرشد الخاص بجماعه الاخوان ولاول وهله تشككت في صحه مانسب لهذا الرجل اتغرفوت لما ..... لان المجلات التي نشرت هي المجلات التي يسيطر عليها اهل اليسار ياليل سابقا واهل الحظوه في الجرائد الحكوميه الذي بينهم كره عميق للمعارضه الاسلاميه التي يمثل جزء منها مرشد الاخوان وكما هو مغلوم للجميع مطلوب سحل الجميع وتشويه الجميع كل معارض يجب ان تنصب له الفخاخ انظروا الى ما حدث الي ايمن نور ونعمان جمعه واي من يسحلفي الشوارع او يعتقل. ثذكروا المحاكمات العسكريه التي تمت لبعض المعارضين ممن ينتمون لللاخوان نحن اما م نظام سمته البطش الذي تتنوع اساليبه من هتك عرض وسحل في الشوارع والاعتقال وضرب النظام بحاول ان يشوه صوره ذلك الرجل عن طريق كتبته وعملاءه ومرشدي المباحث المعينيني في الجراءد التي اسولت عليها مباحث الحكومه واممتها لتكون السوط الذي يضريون به اي معارض واخيرا ارجو من اي معارض الا يجري اي حديث مع اي صحفي ينتمي الي جريده حكوميه الا اذا كان يعرف انه صحفي شريف ونظيف لان البعض منهم لا يراعي واجباته وضميره"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084459/http://masr.20at.com:80/article.php?sid=370"

[[comments]]
order = 22
subject = "من اين تؤكل الكتف؟"
author = "طارق حسن"
posted = "2006-05-28"
text = "اولا انا لست ناصرى ولا اخوانى ولا يسارى او ليبرالى انا مصرى وبحب كونى مصرى وهذا يعطينى الفرصه اكبر لتقييم هذة المذاهب دونما اى تعصب اعمى<br />لا يختلف معى ثانى ان الاخوان المسلمين اول قوى معارضه منظمه فى الشارع المصرى ولا يختلف معى احد بانهم اول قوة تعرف كيف تستفيد من كل المواقف واستفادتها شخصيهدونما الرجوع للمصلحه العامه<br />فهم مستفيدون من كونهم مجرد جماعه ذات مرجعيه دينيه تعزف على وتر الدين فى قلوب المصريين<br />لذا فان الامر يتطلب الخروج ببعض الكلمات العنتريه من ان لاخر من باب ان اكون فى الكادر باستمرار لان الموضوع مجرد تمثيل والا فليجبنى احدهم اين كان الاخوان المسلمين يوم 25 مايو تلاشو تماما كما تلاشوا الجماعه الجورنالجيه بتوع جرايد المعارضهاللى كل شغلتهم بيع هموم الناس للناس والتكسب والتربح منها<br />يوم 25 كان يوم مفصلى جدا فى حياتى اول يوم اشوف حقيقه الناس دى كلهم عاد القضاه لبرجهم العالى وانفصلوا عن الشعب اللى ازرهم عندما راى فيهم الرمز سواء فى زكريا عبد العزيز او البسطويسى او مكى<br />وفى المظاهرة ظهر مكى للحظه ورايت كم فرح المتظاهرون به ولكن فى لمح البصر اختفى كذلك ظهر وائل الابراشى واختفى وذهب المتظاهرون الى نقابه الصحافيين حيث انعقاد الجمعيه العموميه ليرى كل ذى عينين كيف ان المسافه بين الصحفيين والشعب كبيرة وبعيدة جدا<br />كل هذا والاخوان لم يشاركوا اصلا فى المظاهرة<br />ربنا ينتقم منكم جبتولى اكتئاب<br />خليتونى معنتش اصدق اى حد<br />حسيت انى اكبر اهبل فى العالم<br />انا بكرهك يا ابراهيم عيسى انت وبلال فضل وعمرو سليم<br />بكرهك يا مهدى عاكف<br />بكرهك يا هيكل يا عادل يا حمودة<br />بكرهك اوى اوى اوى يا زكريا عبد العزيز<br />والله بقيت اكرهكم من كل قلبى والله"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084459/http://masr.20at.com:80/article.php?sid=370"

