[[comments]]
order = 0
subject = "كفاية بقى"
author = "هشام محمد"
posted = "2006-05-24"
text = "اولا انا لا اخوانى ولا علمانى ولا يحزنون انا مواطن همة مصلحة الوطن بس انا شايف انة فى حمل كبير اوى اوى على الاخوان مش عارف لية ودة بيخلينى اتعاطف معاهم .<br />الاخوان بلا شك اكبر حزب فى مصر وانا مصر اسميهم حزب لانهم كدة شانا ام ابينا.واكثرهم تاثير وفاعلية من غيرهم الى هما كتير ومبيعملوش حاجة .والحكومة مدركة كدة كويس وعلشان كدة مش فاضية غير فانها تلصق بهم الاتهامات عمال على بطال<br />ودة كان فى صالح الاخوان ومدام النظام الحالى الكابس على انفاسنا مش نافع يبقى ندى فرصة لغيرة بقى الى يستحق .وتهيالى الاخوان هما احق ناس بتولى زمام امور هذا الوطن بعد ماعنوة طوال حياتهم .<br />ولاخوان عندها كوادر كبيرة تستطيع تولى المسؤلية امثالوغيرهم كثير بس احنا مش فضيين غير اننا نهجمهم وخلاص طب منهاجم الى كبسين على نفسنا دول .<br />وانا بقول انة مفيش مشكلة اطلاقا فى ان الاخوان يمسكو الحكم وبلنسبة لكلام المرشد دة غير صحيح بلمرة ولا يعقل ولو مش مصدقنى تابع الجرايد وهتلاقى الى كتبين وبيهجمو الكلام دة هما اسياد الموالسة ودة كافى فى انة ممكن بل اكيد محرفين فى الكلام ولو هوا فعلا ميجيبو المرشد فى حوار على التليفزيون المصر ويورونا.<br />بجد انا مليت من الكلام الساذج دة انا هلاقيها من الجيش ولا من منكم.<br />اخوكم العسكرى h<br />شعورى غدا<br />كشعور اليوم....<br />اكرة ان ارىتلك الشمس<br />المسائية الغاربة!"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084459/http://masr.20at.com:80/article.php?sid=370"

[[comments]]
order = 1
subject = "و جاء دور الاخوان"
author = "لابد للصوره ان تتضح للجميع فمن جملة ملاحظاتى كأحد المنتهكه حقوقهم فى مصر المخروسه أؤكد بكل ثقه ان النظام بعدما فرغ من الاحزاب الهشه و قياداتها و وأدت حلم ايمن نور و من استشعر به بصيص من امل بدا ممكناللحظات و بعدما فرغت من تأديب شرفاء القضاه و ....و...و..."
posted = "2006-05-25"
text = "حان الدور على الاخوان و تصفيه ما تمكنوا من الحصول عليه من مكاسب فكون اعتبارهم ـ من قبل رجل الشارع ـسبيل الخلاص من نظام غبى اكبر جريمه يجب عقابهم عقابا رادعاعليه<br />لقد اطلق النظام كلابه من المنافقين و المنتفعين فى كل وسائل الاعلام للتمهيد لما ينتظر الاخوان من مذابح سوف يشيب من هولها الولدان<br />بالمناسبه<br />فليحكم الاخوان او فليحكم الشيطان فلن ابالى فالمهم الا يحكم مبارك جونيور فيهرب كل سارق بماسرق و لا يحاكم مجرم بما اقترف من جرم و تظل نفس الشرذمه تحكمنا و تتحكم فى مصائرنا<br />ااااااااااااااااااااااااااااااااااااااااااااااه يـــا بــــــلــــــــدى"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084459/http://masr.20at.com:80/article.php?sid=370"

[[comments]]
order = 2
subject = "مافيش فايدة"
author = "من مصر المحروشة"
posted = "2006-05-25"
text = "عن برنامج البيت بيتك فأنا أتمنى من الله عز وجل أن يتحرق البرنامج كله بسبب كم النفاق والكذب والتشويه للحقائق فيه وخاصة من المذيع الفاشل تامر أمين الذى يعتبره العامة من الناس المذيع الفاشل والمغرور وكل هذا التفتيت فى المجتمع يرجع لدكتاتورية حاكم جمع من الفسدة من حوله ما يجعله ينشأ وطن لنفسه من الإرهاب والإستبداء والهجوم على كل رأى معارض له ومدافع عن مبادىء الشعب ورغبتهم فى حياة مستقرة وهى حصيده لحكم إنتهت صلاحيته وأصبح يلملم أشلائه ليحارب بها كل من يجروء على هجومة والإخوان المسلمين هم رأى الشعب وكانت إنتخاباتهم من قبل الشعب وحب الشعب لهم ولأخلاقياتهم المميزة فى حب الشعب والوطن وعلى الصحف الصفراء والحاقدة أن تبتعد عن هذه الكتلة الشعبية الممولة بقبول الشعب ورضاه والطالب الذى أجرى الحوار هو نفسه كذب كلام الجريدة وقال أن المرشد قال كلام مختلف عن المكتوب فى الجرائد الصفراء المأجورة والمشتاقة لرضا الفسدة من حولهم وهذا الهجوم بعد أن أطمأن النظام لمصير الدكتور أيمن نور والدكتور نعمان جمعة ومحاولتهم الفاشلة لكسر حده القضاه واليوم تصفية الحسابات مع الأخوان وهذا لن يكون وإذا حاول النظام ذلك فهو يحفر قبرة بيده"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084459/http://masr.20at.com:80/article.php?sid=370"

[[comments]]
order = 3
subject = "هاهاها"
author = "عبدالله مقتاح"
posted = "2006-05-25"
text = "بداية اظن انه يوجد حالة توهان في الاخوان ولكن كل ما في الامر ان عصام العريان وابوالفتوح لديهم لباقة الحديث مع وسائل الاعلام والجهلة<br />اما عاكف يا عيني راجل كبير عصبي متسرع ولا زم نحترم كبر سنه ومش بعد ما كبر نعزله او نيجي عليه لان تصريحاته غير موفقه طب والحل<br />الحل ان المقربين منه يحاولوا يقنعوه بتقليل تصريحاته او الحد منها<br />لكن لازم نضع في اعتبارنا انه راجل قدم العديد والعديد من التضحيات لازم نستحمله شويه<br />تهنئتي القلبيه لطالب الاعلام الذي عرف ان اقصر الطرق للشهرة هو التخلي عن المبادئ وتهنئة اخرى بمناسبة التبني واذا كان محمد الباز صاحب كتاب( دعاة في المنفي) هو المشرف على هذا الطالب لا استبعد ان يصدر الطالب بعد عدة سنوات من التبني كتاب بعنوان( دعاة في المرقص)<br />يلا مبروك عليك يا صحفي يا شاب الشهرة مين يحلم بحوار معاه في اوسع البرامج انتشارا لم يكن هذا ليحدث لولا فعلتك هذه فالغاية تبرر الوسيله<br />سؤال لبراء بغرض الاستفسار وهو عارف انه حبيبي(اكئب ولا اكثر كآبة)"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084459/http://masr.20at.com:80/article.php?sid=370"

