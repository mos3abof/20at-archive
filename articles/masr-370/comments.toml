[[comments]]
order = 10
subject = "عم البراء ...اسمحلى !!"
author = "الشمحطجى"
posted = "2006-05-26"
text = "فى البداية ياد يا براء \" اسمحلى ادلعك \" قلمك حلو وشيك \"وبتحسس\" ..لامؤخزة.. على نقط حيوية بأسلوب سهل وبسيط وده الجميل فى مقالاتك وربنا يكرمك كده وجماعة اسلام اون لاين \"إلى مش محظورة\" يشفولك سكة ويطلعوك على الجزيرة ولا العربية ولا حتى الحرة \" اصلهم سككهم كتيرة... ويجعله عامر ...المهم<br />بالنسبة لعمنا المهدى عاكف هو بصراحة الراجل وتصريحاته لا شك في انهم يتميزو بدرجة من الاندفاع إلا ان الاندفاع ده فى رأيى والله اعلم انه موصلش لدرجة من الاندفاع السئ او التخبيط المرزَع لا قدر الله ..يكشى ان مهليلاتية إعلام الريادة \"الله يرحمه\" وقفيين للراجل ع الواحدة منتظريين منه كلمه ويقعدو يشبعو عليها لطم زى نسوان الحوارى ..ولامؤخزة...<br />وبالنسبة لمقالك فى عدة ملاحظات عليه ووسع صِدرك كده وخليه ملعب كورة واقبلها من اخوك الاكبر منك بيجى 70 شهر ده وفقاً للرواية الى بتقول ان عندك 22 سنة :<br />اولها يا عم البراء ..إن لا عقلاء الوطن ولا مجانينه ولا مختليه \"بصفتهم الاغلبية فى البلد\" طلبو من عمنا المرشد انه يبطل كلام لان الموضوع وما فيه على الضجة الى عملها مسمعتش بالصورة الى هى ...ومن احق اى حد يقول اى حاجة ...زائد كمان ياعم بيرو عقلاء الوطن لو جمعتهم فى اوضه هتلاقيهم ميعدوش الخمشاشر نفر فيكى يامصر ...يعنى مش اغلبية ...موافقة !!<br />تانى حاجة يا عم براء ان الموضوع وما فيه ان نظامنا ابن الوسخة \" لامؤخزة\" كل شوية يطلعلنا بفرقيعة يلهى بيها الناس شويتين فى اطار سياسة الالهاء الى البلد ماشية فى ركابها بقالنا خمسة وعشرين سنة واظن والله اعلم ان عقلك كبير \"أد البطيخة\" بحيث انك ناصح بما فيه الكفاية انك متجرش وتساهم فى سياسة الفرقيعة بتاعة نظامنا الوسخ..<br />نقطة تالتة ...يا سيدنا البراء ...الاخوان المسلمين فصيل<br />اقرأ بقية التعليق .."
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084459/http://masr.20at.com:80/article.php?sid=370"

[[comments]]
order = 11
subject = "عم االبراء... اسمحلى ! 2"
author = "الشمحطجى"
posted = "2006-05-26"
text = "نقطة تالتة ...يا سيدنا البراء ...الاخوان المسلمين فصيل سياسى محترم \"من وجهة نظرى الضعيفة\" لا هما ملايكة ولا هما شياطين ومش هيكونو مفتريين علينا اكتر من النظام النجس الى بيحكمنا حالياً وفى اعتقادى ان لو الاخوان بعد سبعين تمانيين سنة كده لو مسكو الحكم بيتهيألى والله اعلم إن مش هيطلع منهم وزير يسمم ابدان المصريين بمحاصيل مسرطنة ولا وزير بيتاجر فى الاثار ولا وزير لامؤخزة \"لامؤخزة\" وإنت فاهم لامؤخزة التانية دى ايه؟!.. وتجاربهم فى الحكم فى تركيا وماليزيا وفلسطين \"تجارب الحكم الثلاثة الوحيدة للاخوان\"...اظن والله اعلم انها محترمة كل تجربة على حسب ظروفها وبالرغم ما فيها من سلبيات ..!<br />نقطة اخيرة الاخوان عندهم بلاوى كتيرة قوى... بس منسبش الكلاكيع الكبيرة ونمسك فى الهيافات على شاكلة طز واخوتها... ومعروف مين الى بيغلوش ويشن الحملات دى على الاحزاب والقيادات السياسية فى مصر والغرض منها معروف للبيبى الصغنون ومن الآخر النظام عايز يوصل رسالة للناس من الآخر \" إن مفيش غير مبارك وبس \" وده طبعاً الحاجة الى اظنك ماتقبلهاش !!<br />ومعلش طولت عليك ...ولاونى بقالى كتير معلقتش ومبدخلش الموقع بس اقبلها من اخوك الكبير ...<br />وعلى فكرة ان مرضتش انى ابتدى تعليقى بكلمة \" ولاونى مش من الاخوان\" لان الاخوان مش تهمة... الاخوان المسلمين ناس محترمين واحسن من ولاد الاحبة الى بيحكمونا دلوقت .. وكنت اتمنى انى اكون من الاخوان ولكن بحكم زفارة اللسان وقلة الادب مينفعش انى اكون من الاخوان لأنهم هيقفولى على الواحدة وانا راجل لسانى طويل وأبيح ...ومشكرين يا عم براء على وقتك السمين ...<br />ويجعل بيوت المحسنين عمار !!<br />وربنا يفك الكربة الى فيها البلد ..."
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084459/http://masr.20at.com:80/article.php?sid=370"

[[comments]]
order = 12
subject = "جزمه ولا مش جزمه"
author = "الاستاذشيكو"
posted = "2006-05-26"
text = "الاخوان هما عارفين ايه الصح وايه الغلط يعني هما عارفين مصلحتهم كويس والجدل اللي موجود في الشارع المصري بخصوص التصريحات للمرشد اكيد الاخوان هايستفيدوا منها كويس بس المشكله ان كل الحكومه بتاعتهم (بتاعه اللي بيحكموا البلد مش بتاعتنا حسنى وشركاةعزواخواته)مش لاقيه حاجه غير الاخوان والناس مش لاقيه غير الاخوان طيب فين المشكله ندي الحكم للاخوان تحت اشراف الحكومه والناس هيه اللي هاتجيب الاخوان للحكم وهيه اللي هاتمشيهم ونجرب والناس تتحمل نتيجه اختيارهاونفضها سيرة"
archived = "2006-06-02"
