order = 0
subject = "مشروع \\\"قومي\\\" !!"
author = "hacker"
posted = "2006-03-20"
text = "رب الكيبورد و الماوس ...<br />عاوزين مشروع قومي؟!!<br />روحوا توشكى اللي مصروف عليها دم قلب \"قومنا\" و معمول في حتة غلط أساسا ... أرض أصلا لا تصلح للزراعة و للا للاستصلاح!<br />عاوزين مشروع قومي؟!!<br />روحوا للمعتقلات و السجون السياسية ... هتلاقي المساجين و المعتقلين مش عارفين يقعدوا من كتر العدد فالحل إنهم يقضوها \"قايمين\" ..<br />عاوزين مشروع قومي؟!!<br />روحوا اتفرجوا على كأس الأمم الأفريقية (أو إعادته لأنه خلص) .. و أكيد هتشوفوا الجمهور \"قايم\" يأدي حركة الموجة أو النشيد الوطني!!<br />عاوزين مشروع قومي؟!!<br />روحوا شوفوا معاهدات الاستسلام (عفوا السلام)اللي الريس عاملها علشان الاستسلام (عفوا للمرة التانية) يسدو المنطقة العربية و الدول ما \"تقومش\" على بعض!<br />عاوزين مشروع قومي؟!!<br />روحوا زوروا المساجد في رمضان اللي مش عارفين \"نقوم\" الليل فيها براحتنا .. علشان خاطر عيون الأمن \"القومي\"<br />عاوزين مشروع قومي؟!!<br />تابعوا أخبار البلد اللي \"قامت\" و ما قعدتش علشان \"بسلامته بيخطب\" (قصدي المقال بتاع الكاتب اللي اسمه برء - دوروا عليه في أرشيف عشرينات)<br />عاوزين مشروع قومي؟!!<br />كفاية عليكم كده و \"قوموا\" شوفوا حالكم!"
archived = "2006-05-24"
