subject = "يا بلد"
author = "هبابه او هوبه او هبهوب"
posted = "2006-03-22"
text = "بص كانت هنا هو يا بني والله منك لله اشوف فيك يا يوم يايايا مش عارفه عايزه اقولها ومصر كلها تقولها يا بن يا بن يا ين مبارك<br />يلا بقي الحدق يفهم<br />حاجه كمان العالم دي ما بتستغناش<br />العالم دي طماعه عايزه كمان وكمان \" ويزحف ويزحف ويتوغل ويتوغل \"<br />\"صرصار اصله\""
