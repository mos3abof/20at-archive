[[comments]]
order = 0
subject = "مبروك"
author = "وفاء &وليد"
posted = "2006-09-12"
text = "مبروك لكل الفتيات اللاتى ارتبطن بالخطوه الأولي للزواج ولكن نصيحتي للفتيات لا تبالغي في مظهرك فوق حدودك الماديه لأن كل خطيب يعلم امكانيات خطيبته جيداوثانيا لا تقنعي نفسك بأنك موفقه مع خطيبك وانتي علي العكس ومجرد ان تثبتي للناس انكم موفقين معا او انك تعدين للزواج فقط لابد من معرفة ان الخطوبه هي فتره تمهيديه فاذا مرت بالضغط وانتي تتجملي وهو كذلك فما بالك بالحياة الحقيقية دون تجميل وانتم معا في بيت واحد ولذلك لابد من حسن الأختيار والخطوبه والزواج لن يكونوا فرح وشهر عسل وبعدين هنرجع لبابا وماما انما هي حياه وعمر كامل اما سعادة اوتعاسة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134046/http://www.20at.com/article2.php?sid=1216"

[[comments]]
