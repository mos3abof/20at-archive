text = "ادعيلي يا كابتن ألبس الدبله في اليمين ..و الا الشمال مش مهم ..بصراحه عايزة أخلص بأه ..الموضوع طول و بقا بايخ ..ربنا يكرم كل البنات يارب<br />شوف أنا عامله بلوج خصوصي للموضوع ده ..اسمه عايزة أتجوز.......<br />ابقى تعالى<br />http://wanna-b-a-bride.blogspot.com"
