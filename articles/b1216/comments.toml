subject = "التوافق التوافق"
author = "محمد فايد"
posted = "2006-09-12"
text = "السلام عليكم جميعا<br />اظن اهم حاجة فى موضوع الجواز هى التوافق والتوافق دة لازم يكون فى كل حاجة واهمها التوافق بين اهل الزوج والزوجة لان من غير التوافق دة ممكن يخلى حياتهم عذاب!! ربنا يكرم الجميع ويوفق كل المخطوبين والمتزوجين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134046/http://www.20at.com/article2.php?sid=1216"

