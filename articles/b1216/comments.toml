text = "الموضوع جيد بصفة عامة ولكن به بعض المبالغات والتحامل على الفتيات لان هناك تغيرات ايضاتظهر على الشباب تفوق تلك التغيرات التي غالبا ما تكون شكلية للفتيات وجوهرية للرجال"
