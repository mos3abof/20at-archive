author = "مش ححبك"
posted = "2009-04-28"
text = "الى سامح فوزي انت كاتب في مقالك<br />الإقدام على خطوة إعدام الخنازير في مصر، خوفاً على مشاعر الأقباط،<br />انا عايز اعرف هو علشان خاطر الخنزير محرم اكله عند المسلمين اصبح طعام مقدس عند النصارى<br />ممكن تشرحلنا والله اكل لحم الخنزير عند النصارى يمثل لهم ايه بالضبط وايه علاقة اكل لحم الخنزير بالدين المسيحي مع سرد الادلة"
archived = "2009-04-30"
capture_url = "https://web.archive.org/web/20090430072627/http://www.20at.com:80/masr/t7kyk/11897-2009-04-28-11-32-44.html"

[[comments]]
order = 1
subject = ""
author = "لا لخنازير المهجر"
posted = "2009-04-28"
text = "نجيب جبرائيل رئيس منظمة \"الاتحاد المصري لحقوق الإنسان\"،<br />ونادر فوزي رئيس منظمة \"مسيحيي الشرق الأوسط\"،<br />وحلمي جرجس رئيس منظمة أقباط المملكة المتحدة<br />وبهاء رمزي رئيس الهيئة القبطية الهولندية<br />ونبيل عبد الملك، رئيس المنظمة المصرية الكندية لحقوق الإنسان،<br />ووديع فهمي منظمة أقباط النمسا<br />وخيري مالك رئيس جمعية الصداقة القبطية الأمريكية.<br />بيتر ميخائيل \"هيئة الشاب القبطي الأسترالي\"،<br />وكمال عبد النور رئيس \"منظمة اندماج وصداقة أقباط النمسا\"،<br />ونسيم كامل شحاتة \"هيئة الشاب القبطي الفرنسي\"،<br />وصبحي جرجس \"رئيس جمعية الصداقة القبطية بفرنسا\"،<br />ورمسيس شحاتة رئيس \"منظمة اندماج وصداقة أقباط ألمانيا\".<br />منظمة \"الأقباط متحدون\" التي يرأسها ال[يا وحش] عدلي أبادير،<br />و\"التجمع القبطي الأمريكي\" الذي يرأسه كميل حليم،<br />و\"الهيئة القبطية الكندية\" برئاسة سليم نجيب،<br />ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-04-30"
capture_url = "https://web.archive.org/web/20090430072627/http://www.20at.com:80/masr/t7kyk/11897-2009-04-28-11-32-44.html"

