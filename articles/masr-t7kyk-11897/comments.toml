author = "ابو النصر"
posted = "2009-05-05"
text = "الخنزير حيوان قذر ومقرف ومقزز فهو الحيوان الوحيد الذي يأكل روثه وهو يتبع الحيوانات الاخرى ويأكل روثهم وفضلاتهم ولحم الخنزير مشبع بالدهون القاتله ويتعرض للتغفن السريع وهذا الحيوان النجس يتحول إلى وحش كاسر بعد اسبوعين من اطلاقه في البرية فتبرز له انياب بطول عشرة انش ويتحول لونه من الزهري إلى الاسود ويعتبر كل شيئ يراه طعام ولا تجد مستشفى او مطعم راقي يقدم لحم الخنزير على القائمة وقد قيل قديما بأن من يأكل الخنزير فهو مثله واقدح شتيمه توجه للمشتوم هي وصفه بالخنزير"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519042418/http://www.20at.com:80/t7kyk/11897-2009-04-28-11-32-44.html"
