author = "انس باشا"
posted = "2009-11-16"
text = "اقتباس أحمد سامي:<br />ههههههههههههههه ههههه وماله<br />ووقتها يكون التشكيل الأفضل:<br />الاحتياطي: جواوي- كريم زيانى – رفيق صايفى- أحمد حسن- عماد متعب- عمرو زكي<br />انت اكيد بتهزر<br />كريم زياني اللعيب الجامد الوحيد اللي بيلعب عندهم في الاحتياطي ؟<br />و كمان ابطالنا عمرو زكي و عماد متعب في دكة الاحتياطي ؟؟<br />عموما هي فكرة جامده طحن بغض النظر عن امكانية تنفيذها<br />بس ممتازة قوي<br />لان في الاتحاد قوة<br />تخيل اجمد ناس عندنا مع اجمد ناس عندهم تكون فريق خليط جامد<br />بس المشكلة كلها في ان الفريق لازم يكون مندمج معنويا سوا"
archived = "2009-11-17"
capture_url = "https://web.archive.org/web/20091117132227/http://www.20at.com:80/20at/lifestyle/14064-2009-11-16-12-19-42.html"

