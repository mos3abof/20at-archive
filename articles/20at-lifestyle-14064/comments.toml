text = "يا جماعة الفكرة دي وهمية وهي الحل الافضل للحالة اللي احنا فيها من انقسامات ومشاحنات مالهاش علاقة بين الشعبيين دول، وفعلا المنتخب المصري والجزائري من اقوي المنتخبات العربية في الوقت الحالي ، وسعتها هيبقي شكلنا حلو اقوي كعرب لديهم فريق عالمي بعناصر المنتخبين دول"
archived = "2009-11-17"
capture_url = "https://web.archive.org/web/20091117132227/http://www.20at.com:80/20at/lifestyle/14064-2009-11-16-12-19-42.html"

