text = "ههههههههههههههه ههههه وماله<br />ووقتها يكون التشكيل الأفضل:<br />حراسة المرمى : الحضري<br />الدفاع: عنتر يحيى- وائل جمعة- مجيد بوقرة – رفيق حليش<br />الوسط: حسني عبد ربه- أحمد فتحي- سيد معوض- نذيير بلحاج<br />الهجوم: زيدان- أبو تريكة<br />الاحتياطي: جواوي- كريم زيانى – رفيق صايفى- أحمد حسن- عماد متعب- عمرو زكي"
