text = "اعجبتني في الافكار الي سبقت فكرة المباراة الودية والله فكرة رائعة وممكن تهدّي الوضع كتير وعندي كمان فكرة تانية هي انو أبوتريكة وزين الدين زيدان يعملوا نشاط معين وزيارة للبلدين تحت اطار معين…ماتقلوش ليه زيدان وليه ابوتريكة اخترت زيدان لانه حاليا اللاعب الجزائري تقريبا الوحيد الي المصريين ممكن يقبلوه في بلدهم وابو تريكة كمان محبوب عند الجزائريين بأمارة ان جريدة الهداف الجزائرية اختارتو كاحسن لاعب عربي سنة 2006 ..والله اتمنى د يحصل لانو في النهاية مش شوية بلطجة وشوية افواه على الشاشة السودة وكلام جرايد من الطرفين ومستطيل اخضر يخلينا نكره بعض ونسيب قضايا اهم من كدة بكتير خلونا نترفع عن الخلافات الهينة والمشينة ."
archived = "2009-12-21"
