author = "جيمي"
posted = "2009-11-16"
text = "إذا كان علي لون التى شيرت .. فاللون الى انتوا حاطينه جامد جداً<br />طبعاً جمهور البلدين هيعتبروا ان دى خيانة .. او مش هيتقبلوا الأمر بصورة أو باخري نظراً لشغب بعض العناصر التخريبية من الشجعين في كلا الطرفين .<br />لكن الفكرة الأحسن واللى هتبقى مقبولة شوية هي انك تعمل مباراة مع البرازيل مثلاً .. وتتنفذ نفس الفكرة دى في المباراة الودية دى مع البرازيل لإثبات أننا واحد وأننا متحدون والكلام اللى مابيأكلش عيش ده .<br />ياجماعة خلاص .. اللى حصل حصل والإعلام الأصفر ولعها لدرجة يستحيل معها التهدئة ."
archived = "2009-11-17"
capture_url = "https://web.archive.org/web/20091117132227/http://www.20at.com:80/20at/lifestyle/14064-2009-11-16-12-19-42.html"

