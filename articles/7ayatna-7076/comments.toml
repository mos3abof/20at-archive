text = "اولى يوجد قهوه اسمه {بطاطس}يوجد بها تجمع كثير من الشباب السودانى من أبناء يمكنهم الاشتراك فى المنتدى بس اعتقد هم لا يعرفون بى الموقع نرجو اعلمهم با الموقع مشكلتى الى ما متوجد الحين با القاهره شباب يحبون السودان و الونسه على الشات …واشكركم على هدا المنتدى الجميل الدى يتكلم عن ابناء السودان بمنطقتنا الجميله {عين شمس}ودائمى فى تقدم أنشاء الله"
