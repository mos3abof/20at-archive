subject = "عيب عليك يا سوا"
author = "اروى"
posted = "2006-03-15"
text = "محمد على ده من المسلمين العظماء الذين اغفل التاريخ ذكرهم وشوهت الكتب المدرسية المصرية صورهم الرجاء انك تقرا شويه فى التاريخ وابعد شوية عن كتب الوزارة المسيسة علشان تفلح محمد على ده فتح بلاد قد شعر راسك لوكان ليك شعر من اساسه اقرأوانت تفهم اقرأ كتاب تاريخ الدولة العثمانيةلعلى محمد الصلابى وانت حتفهم لو كنت عاوز تفهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133505/http://www.20at.com/article2.php?sid=570"

[[comments]]
order = 3
subject = "بلاش صرصرة"
author = "ايه التعليقات الغريبة اللي فوق دي ، يا جماعة ياريت تركزوا وتفوقوا قبل ماتقروا الموضوعات محمد علي صاحب قصر المنيل هو ابن ابن محمد علي باشا المشهور والمعروف في كتب التاريخ والنبي بلاش رصررة عشان تعرفوا معلومات جديدة"
posted = "2006-03-15"
text = "الصور حلوة قوي يا جماعة وانا رحت قصر المنيل مرتين ومكان فعلا يتزار يعني وسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133505/http://www.20at.com/article2.php?sid=570"

[[comments]]
order = 4
subject = "الناس اللى فوق دى بتقول ايه"
author = "نيفين"
posted = "2006-03-15"
text = "يعنى بدل ما نشكر عشرينات على الموضوع الحلو نقول كده<br />احنا مش بنناقش تاريخ العثمانيين احنا اداه قطعه اثريه جميله<br />الله يا عشرينات رجعتونا لورا ييجى 100 سنه و اكتر<br />المشاهد اللى متاخده للقصر و الله يا جماعه فكرتنى بقصر الجوهره ف اسكندريه<br />المشربيه و شغل الفنان العربى الجميل<br />الله<br />مش عارفه ممكن ادفع اد ايه من عمرى و اقضى يوم كامل ف مكان زى دا<br />يوم الواحد يعيش فيه 100 سنه فاتت و اكتر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133505/http://www.20at.com/article2.php?sid=570"

