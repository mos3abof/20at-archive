text = "اتفق العرب على الا يتفقوا<br />نفسي بجد اشوف ايام اللي كان كل قائد عربي مسلم بينسب الفضل لغيره<br />الله يرحم ايام ابي بكر وعمر وعثمان وعلي وعمرو بن العاص وصلاح الدين وطارق بن زياد رضي الله عنهم اجمعين<br />بجد كلمتين وصورتين بس ابلغ من الف مقال وبيعبر عن حال العرب حاليا.. مرسي جدا يا خباب وربنا يكرمك دايما"
