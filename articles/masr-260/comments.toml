[[comments]]
order = 0
subject = "نقلا من اسلام اون لاين"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "يا وطن.. بحبك كتير!!<br />محمد عبد الكريم – 28 عاما - مصر<br />يا وطن وصلني تو مكتوبك<br />بتسألني عن حالي؟<br />بتسألني عن الغربة؟<br />بتسأل كيفها أحوالي؟<br />أفيدك يا وطن إني<br />ما ناويتش أزيد همك<br />كنوز الدنيا لا بتسوي<br />عكارة نقطة من دمك<br />أعيش جوّال شايل همي<br />ولا اتسببش في عذابك<br />وفي الأول<br />سلاماتي<br />لكل ترابه على أرضك<br />لشربة ماي من نيلك<br />لكل سنبلة في غيطك<br />سلامي لموجة على شطك<br />سلامي للون السمرة على خدك<br />ومن جهتي<br />أفيدك مختصر يا وطن<br />بقسوة ليل غربتنا<br />غريب عن ليلنا في حضانك<br />وفي الآخر<br />يا وطن هانت<br />سنيني في غربتي ولت<br />وساعة قرب الحبيب هلت<br />نويت أخبط على بابك<br />نويت أخف من حملك<br />راجع لك يا وطن تاني<br />و برسل لك سلاماتي، تحياتي<br />بامضائي/ وليدك يا وطن غالي"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904062514/http://masr.20at.com:80/article.php?sid=260"

[[comments]]
order = 1
subject = "هيه دي المأمرة"
author = "لميس"
posted = "2006-05-04"
text = "كل شىء تحت السيطرة....أنشودة مصرية غارقة...السلام 98<br />>>سيناريو رقم 1<br />>>كبرياء وعظمة<br />>>ضابط أول : يا فندم العبارة هتغرق<br />>>القبطان : تغرق إزاى وأنا القبطان يلا<br />>>ضابط ثانى : يافندم كلامه صح لازم نلف ونرجع للسعودية تانى<br />>>القبطان : عشان يقولوا إنى معرفتش أطفى الحريقة ويفتكروا إنهم أحسن<br />>>منى<br />>>ضابط أول : يا فندم إحنا معانا وزن فوق الحمولة والإستمرار خطر<br />>>القبطان : وإنت هتعرفنى شغلى<br />>>ياض...دنا شغال قبطان من سنة 67<br />>>ضابط أول : مش دى سنة النكسة يا فندم ؟<br />>>القبطان : إخرااااااااااااااااااس...مش عايز أسمع صوتك (كل شىء تحت<br />>>السيطرة)<br />>>ــــــــــــــــــــــــــــ<br />>>سيناريو رقم 2<br />>>غباء وجهل<br />>>أحد الركاب (الضحايا) : ياساتر يارب...إيه الدخان ده...إلحقونا إيه<br />>>اللى بيحصل<br />>>فرد من الطاقم :<br />>>مفيش حاجة يا حاج ده إبن عمى بيشوى كباب تحت<br />>>الحاج : كباب إيه يابنى دى ريحة هباب....كح كح كح....مش قادر هو إيه<br />>>اللى بيحصل بالظبط<br />>>فرد أخر من الطاقم أذكى من زميله السابق : دى يا حاج حريقة عادية<br />>>بتحصل فى كل السفن فى المكان ده عشان أشعة الشمس بتضرب فى<br />>>البوصلة...ومتقلقش طفيناها خلاص<br />>>الحاج : دى بتزيد والدخان بيعلى إلبسى يا حاجة سترة النجاه<br />>>فرد الطاقم بغضب : إنت مش واثق فى كلامى ولا إيه...أنا المسؤول هنا<br />>>ومش هتفهم أكتر منى...هات السترات دى إنتوا<br />>>عايزين تفزعوا الركاب وتعملوا قلق وخلاص...خش يابا جوه كابينتك وإقفل<br />>>عليك...قلتلك (كل شىء تحت السيطرة)<br />>>ــــــــــــــــــــــــــــ<br />>>سيناريو رقم 3<br />>>جشع وطمع<br />>>القبطان : أيو<br />اقرأ بقية التعليق .."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904062514/http://masr.20at.com:80/article.php?sid=260"
