author = "عسكر وحراميه"
posted = "2009-08-10"
text = "يظهر ان اللعبة احولت من قبل كل من الطرفين<br />لعبة العسكر والحرامية اللي كنا بنلعبها زمان واحنا صغار<br />كل طرف مبسوط اوي باللعبة ومستمتع بيها<br />طرف الاخوان وطرف المباحث<br />عسكر وحرامية او لعبة فرعون وجنوده من قبل الاخوان والخوارج من قبل مباحث الدولة<br />العبوا العبو عسكر وحراميه واستغمايه كمان واصرفوا اموال الدولة على اللعبة والمستشفيات خالية من الدواء واللي معاه فلوس بيتعالج واللي معهوش حيموت زي الكلب<br />واهي اسرائيل عماله تلعب بالقدس<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-08-12"
capture_url = "https://web.archive.org/web/20090812110556/http://www.20at.com:80/masr/2khbar/12891--13-.html"

