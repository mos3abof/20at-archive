author = "القبض والافراج"
posted = "2009-08-10"
text = "دة موال بقى رخم قوى وممل من بتوع امن الدولة<br />تقرا خبر اعتقال عدد من قيادات الاخوان فى اسكندرية<br />وبعدها باسبوعين تلاتة خبر الافراج عن بتوع الجيزة<br />ثم اعتقال بتوع الغربية والافراج عن بتوع اسكندرية<br />هو احنا بنلعب استغماية<br />قبض وافراج<br />امك فى العش والا طارت<br />يتمسكوهم على طول يتسيبوا الناس فى حالها<br />مش عايزين نسمع اخبار اعتقالات وافراجات تانى"
archived = "2009-08-12"
capture_url = "https://web.archive.org/web/20090812110556/http://www.20at.com:80/masr/2khbar/12891--13-.html"
