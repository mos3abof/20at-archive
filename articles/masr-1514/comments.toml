order = 0
subject = "حضارتنا"
author = "ما معنى الحضارة ؟ هل التقدم فى صنع الالات والمكائن هو التقدم اى بمعنى تقدم تكنولوجى"
posted = "2007-01-31"
text = "هم ارقى واكثر تقدما منا<br />اما اذا كانت الحضارة هى الحياة الانسانية فنحن ارقى منهم با لاف السنين<br />نحن المسلمين نعيش فى اسر مترابطة متكافلة حياتنا الزوجية منظمة ومحترمة واسرنا قوية<br />ليس عندنا الانحلال الاخلاقى الهمجى كعصور البشرية الاولى مثلهم<br />نصف المواليد فى فرنسا ابناء غير شرعيين<br />فى امريكا بيل كلينتون الرئيس الامريكى السابق ليس لة اب شرعى<br />اننا ارقى انسانيا وعاطفيا واقوى اخلاقيا<br />انهم بالنسبة لنا عالم منحل<br />وهناك فرق كبير"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031749/http://masr.20at.com:80/article.php?sid=1514"
