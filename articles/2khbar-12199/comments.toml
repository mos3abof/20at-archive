text = "امتحانات اية ؟<br />انا ادعوا السيد وزير التربية والتعليم ان يصطحب لفيفا من رجال اعضاء مجلس الشعب الموقرين وان يدخل فصلا فى احد الاحياء الشعبية او القرى او المحافظات وخللوهم يدخلوا صف فى تالت اعدادى<br />ويجعلوا التلاميذ يكتبون قطعة املاء فى اللغة العربية مبسطة<br />ويشوفوا كم طالب فى الفصل يقدر يكتب قطعة املائية<br />النتيجة صادمة<br />والفلوس التى تصرف على المدارس حرام<br />لان مفيش اشراف ولا فية ادارة ولا فية احد بيحاسب احد - المدرسون لا يحضروا والتلاميذ لا يحضرون ويذهبون الى الدروس الخصوصية ويعتمدون على الغش لينجحوا"
archived = "2009-05-30"
