subject = "منقول من موقع إخوان أون لاين"
author = "عبد المعز محمد"
posted = "2005-11-15"
text = "ا إن أعلن الإخوانُ خوضَهم الانتخابات بمدينة نصر إلا وانقلبت الدنيا في هذه الدائرة المعروفة بدائرة الرئيس، فالحزب الوطني أصابه الذعر، والإخوان انطلقوا بكفاءةٍ وتميز، وباتت الدائرة في قلب الأضواء لعدة أسباب، أبرزها أن الإخوان خاضوا المنافسة في هذه الدائرة بمرشحةٍ على مقعد الفئات، إضافةً إلى أن مرشحَي الحزب الوطني ابتدعوا ما عُرِف بالقيد الجماعي، بل إن هناك لجانًا بعينها كانت مخصصةً لهؤلاء الناخبين.<br />على الجانب الآخر فإن الدائرة شهدت صراعًا من نوعٍ خاص بين عددٍ من كبار رجال الأعمال حتى وصل سعر الصوت إلى 500 جنيه عند بعض اللجان، وقد حقَّق الإخوانُ العديدَ من المكاسب، التي أبرزها هذا التواجد الذي كان محرَّمًا في الماضي بدائرةٍ يسكنُها السيد الرئيس، كما حقَّقوا نجاحًا في مَحْوِ الصورة السلبية التي زرعَها الحزب الوطني ضد الجماعة، كما حقَّقوا مكسَبًا آخر وهو تزايد التعاطف الجماهيري بشكل كبير معهم.<br />ورغم أن النتيجة النهائية في الدائرة انتهت بعد ولادةٍ متعثرة بفوز مصطفى السلاب بمقعد الفئات بعدد أصوات 12010 مقابل 11589 للدكتورة مكارم الديري، وفوز عصام مختار مرشح الإخوان بمقعد العمال بعدد أصوات 13727 مقابل 9232 لثرية لبنة، إلا أن ما حققته الدكتورة مكارم يُعدُّ إنجازًا كبيرًا؛ فهي في الواقع حققت نجاحًا رغم محاولات البعض التشكيك في مجرد حصولها على عدد من الأصوات يؤهلها لانتخابات الإعادة.<br />وفي النهاية فإن ما حققته الدكتورة مكارم من مكسبٍ يؤهلها للفوز بهذا المقعد في البرلمان القادم، خاصةً وأنه كان هناك تحيُّزٌ واضحٌ ضدها؛ لأنها سيدةٌ من الإخوان، فضلاً عن صراع رأس المال غير المعقول في هذه الدائرة والذي انحصر بشكل كبير على مقعد الفئات.<br />أما مقعد العمال فبالإضافة إلى<br />اقرأ بقية التعليق .."
