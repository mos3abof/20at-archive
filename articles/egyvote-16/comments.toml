[[comments]]
order = 1
subject = "حسبنا الله ونعم الوكيل فى الظالمين"
author = "حمدى نصار"
posted = "2005-11-17"
text = "حب ان انقل الى جميع احبة الاخوان المسلمين فى كل مكان ان المصرين بمختلف ديانتهم رأو فى الاسلام هو الحل هو الخلاص من هذا الظلم الذى عم البلاد فقادها الان تتذيل جميع دول العالم فى جميع المجالات واقول لهم ان الله عزوجل سينصر من نصر دينه واقول ايضا لقيادات الحزب الحاكم انكم مهما سخرتم من امكانيات سواء فى وسائل الاعلام على اختلافهافهم يستضيفون من هو كاره لنفسه قبل كرهه لاى احدويسب اخوان ويستهزأ بهم وبشعار الاسلام هوه الحل دون ان يوجد من يرد بلسان الاخوان اما فى دائرة مدينة نصر وهىه دائرة المرشد والرئيس فهيه مثال مصغر لما عليه الجمهوريه باكملها فقد انتصر الاستاذ عصام مختار ونجحت الدكتوره مكارم ولكن لكى يحفظوا ماء وجههم زورو لصالح السلاب فبشهادة المصرين انتصر الاسلام رغم مايمكرون ويستخدمون من رشاوى وقيد جماعى وضغوط على ضعفاء النفوس ون القضاه (ويمكرون ويمكر الله والله خير الماكرين )(ولينصرن الله من ينصره) وجزاكم الله خيرا"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013043628/http://egyvote.20at.com:80/article.php?sid=16"
