subject = "عمار"
text = "يعني التفاح و الشاي و العلكة مقدور عليهم .<br />بس 12 كباية مية و ملح عشان شوية وجع !! أنا أروح العيادة أسهل لي .. لالا أنا بمزح طبعا:) .. أنا مجرب الوجع و عارف .. و لا إيه يا دكتورة ؟"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803044501/http://www.20at.com:80/article.php?sid=396"

[[comments]]
order = 1
subject = "أربعتاااااااااااااااااااااااااااااااااااااااشر يا"
text = "تخيل لو عندك ضرس واحد يوجعك<br />أمامك حل من متعدد:<br />أن تتناول 14 معلقة ملح .. (طب دي ومبلوعة) ..<br />أنما هاعمل إيه بـ12 كوباية مية: والله ما عارف أقول إيه<br />ده لو فيل نابه وجعه مش هايعمل كده...<br />أما لا قدر الله لسه ضرسك بيوجعك (ده لو كنت لسه عايش بعد ملحمة الـ14 معلقة ملح والـ12 كوباية مية) ..<br />لو كان لسه ضرسك بيوجعك .. لازم تروح لـ36 دكتور ... 24 مستشفى ..وخللي بالك لازم تكشف 142 كشف..و 655 استشارة ..<br />حسبنا الله ونعم الوكيل"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803044501/http://www.20at.com:80/article.php?sid=396"

[[comments]]
order = 2
subject = "موقع عشرينات"
text = "ألف ألف ألف سلامة لأي واحد ضرسه بيوجعه ..<br />معلش وزي ما علمونا في الحضانة: الوقاية خير من العلاج.. ولو كان كل واحد يعمل بكلام الدكتورة أميرة وياخد الـ14 معلقة ملح والـ12 كوباية مية ماكنش ضرسه يوجعه ..<br />المهم .. نخش ف الموضوع: نعتذر عن هذا الخطأ المطبعي الظريف.. ونود أن ننوه أن الجملة المقصودة: 1/4 (ربع) كوباية ملح.. و1/2 (نصف) كوب ماء..<br />عفواً لهذا الخطأ .. وشفى الله الجميع من كل داء وألم"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803044501/http://www.20at.com:80/article.php?sid=396"

