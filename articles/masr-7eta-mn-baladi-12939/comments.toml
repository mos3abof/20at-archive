author = "حماس جماعة شيطانيه"
posted = "2009-08-15"
text = "قتلت زعيمها ومساعده .. وأحد عناصرها يسلم نفسه للأمن المصري<br />«حماس» تسحق جماعة «جند أنصار الله» السلفية<br />فلسطينيون يصلون على جثث تابعة لشرطة حماس ومدنيين قتلوا خلال الاشتباكات التي وقعت في رفح - جنوبي قطاع غزة أخيرا. رويترز<br />غزة ـ الوكالات:<br />سحقت أجهزة الأمن التابعة للحكومة المقالة التي تديرها حركة حماس جماعة سلفية متشددة تعرف بـ «جند أنصار الله» في رفح جنوب قطاع غزة في عملية أسفرت عن سقوط 24 قتيلا ونحو 130 جريحا،<br />ــــــــــــ"
archived = "2009-08-17"
capture_url = "https://web.archive.org/web/20090817075738/http://www.20at.com:80/masr/7eta-mn-baladi/12939--sos-.html"

