author = "أحمد كريم"
posted = "2009-08-15"
text = "مس بالضرورة يعني، صحيح المهني صاحب الحرفة والصنعة مفيد للمجتمع لكن بصورة مادية فقط، لكن برضه المفكرين والمثقفين العيب عليهم هم لو هم هيتعلمو علم ومش هينفعوا بيه حد… لكن ول كانوا بيعملوا بيه حاجة مفيدة مكنتش انت قلت عليهم كده"
archived = "2009-08-17"
capture_url = "https://web.archive.org/web/20090817075738/http://www.20at.com:80/masr/7eta-mn-baladi/12939--sos-.html"

[[comments]]
order = 2
subject = ""
author = "االتلمذة الصناعية"
posted = "2009-08-15"
text = "للطفل المشرد او الفقير او اليتيم مطلوب<br />ورشة واسطى ويلحق الطفل بها ليتعلم مهنة او صنعة تنفعة فى مستقبلة<br />انا قرات ما فعلة محمد على باشا حاكم مصر فى البعثات المصرية لفرنسا وكان عظيما<br />كان المبعوث يتفق مع ورشة المسيو فلان صاحب ورشة الشنط والاحذية الجلدية على تعليم المبعوث نظير كذا قرش صاغ مصرى<br />واللة كان محمد على يرسل المبعوثين لتعلم حرفة وصنعة وكانوا يعودون اسطوات ملىء العين والبصر واصحاب خبرة عملية وعلمية<br />وفسد كل شىء لما البعثات تركت المهن وراحت تدرس القانون والفلسفة الرومانية والادب الفرنسى والالحاد والزندقة ورجعوا زى امثال طة حسين يشككون الناس فى دينهم<br />احنا عايزين اصحاب المهن اللى تجيب عائد مادى<br />علموا الاطفال صنعة<br />الصنايعى اللى بيعمل حذاء بيدية افيد للمجتمع من عشرة من حاملى الدكتوراة فى الفلسفة وديكارت وبتوع انا افكر اذن انا اعيش"
archived = "2009-08-17"
capture_url = "https://web.archive.org/web/20090817075738/http://www.20at.com:80/masr/7eta-mn-baladi/12939--sos-.html"
