text = "شائعات ؟ يعنى إيه شائعات ؟<br />يعنى الغلاء<br />يعنى الظلم<br />يعنى العذاب<br />يعنى القهر<br />يعنى الكذب<br />يعنى الفساد<br />يعنى الرشوه<br />يعنى المحسوبيه<br />لو أن الحكومه هتحاسب الشعب على الشائيعات طب مش الأول تحاسب نفسها على القائمه الموضحه أعلاة و تنقى نفسها الأول<br />لك الله يا مصر.ياشباب ياريت نحاول تغير نفسنا الأول لعل الله يزيح الغمه أو يعفوا عنا يوم العرض"
