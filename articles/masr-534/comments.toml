[[comments]]
order = 2
subject = "هل تلد الحية عصفورا؟"
author = "بهاء"
posted = "2006-06-18"
text = "والنبي إيه؟ هو الجحش هشام ده إبن الحمار مزراحي(مصطفى خسارة فيه) خليل صاحب السادات ولا جحش ثاني؟ ياجماعة ده أبوه-إن كان فعلا أبوه الله أعلم- كان صاحب فكرة توصيل مياه النيل لإسرائيل، وأقنع السادات الحشاش بيها، وذلك أول خط تيلفوني ساخن بين مصر وإسرائيل إتعمل كان بيشرف عليه الخواجة مزراحي خليل أبو إبن الحرام الجحش هشام ده.<br />إتعلموا بقى من فضلكم تشوفوا الأمور على حقائقها، عمال تصوتوا وتنبوا من قانون الطوارئ سئ السمعة ده، طب حد فيكم سأل الي أكبر منه سنا عن الأحوال قبل قانون الطوارئ؟<br />مجلس المطية ده، عمره مايطلع منه خير، ده في مرة كان السادات محشش، وقال كلمة\" لازم تطلعو قانون العيب لمن يقدح في شخصي\"، وفعلا قطيع الخرفان طلعوا القانون ثاني يوم، وده القانون الي إستند عليه في الإعتقالات الي سبقت إعدامه.<br />مجلس المطية ده كان يصفق للسادات وهو بيقول على الهوا \"الي حيكلم حأفرمه\"، ريس أبو مفرمة، وكمان لما قال عن الشيخ المحلاوي:\" أهه مرمي في السجن زي الكلب!\"، الله أكبر علماء الإسلام بقم كلاب، ويقال إنه شيخ الأزهر والمفتي كانوا سعداء بما سمعوا، الله أعلم، لكن لم يعترضوا أبدا.<br />حقكم تخدوه بإيديكم، ومفيش كلام تاني، سيبيكم من الأوهام والوعظ بالحسنى."
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620061652/http://masr.20at.com:80/article.php?sid=534"

[[comments]]
order = 3
subject = "أيوة ..البيه الصغير ...خليفة البيه الكبير...ذاك الهريرة من تلك القطة"
author = "محمد السيد"
posted = "2006-06-18"
text = "أيوة ياعم....<br />البيه الصغير ابن البيه الكبير ...مصطفي خليل ... المطبعاتي الأول في مصر ..<br />وأول واحد مشي ورا السادات وقاله أمين وجريوا ورا اسرائيل وأمريكا ...<br />لأ .. والبيه الصغير بعدما نجح كمستقل أمام حسام بدراوي في الانتخابات .. مخيبش رجاءنا فيه وانضم للحزب الوطني ....<br />واوعي تفكر إنه نجح بشعبيته ... لا والله ...<br />ده اللي نجحه لعبة تكسير العظام اللي كانت بين الشاذلي باشا وقدامي نادي أصحاب المصالح ... وبين رجالة الفكر الجديد ... جمال وشركاه ...<br />وكان نصيبه إنه يكسب هو والشاذلي .. و يخسر حسام بدراوي ...<br />ياعم خلينا ساكتين .... الواحد كان ناويب يهدي التعليقات شوية اليومين دول .... متنرفزوناش ...<br />يلا سلام ..<br />صحيح ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620061652/http://masr.20at.com:80/article.php?sid=534"

[[comments]]
order = 4
subject = "يا اخواننا إنتوا ليه مش فاهمين"
author = "شقيان"
posted = "2006-06-18"
text = "يا اخواننا إنتوا ليه مش فاهمين؟؟<br />القانون ده مش لينا دا لــ اللي شغالين في الحكومة والمسئولين<br />وبعدين القانون مش بس عقاب ممكن يكون مكافأة أو حاجه تنظيميه<br />يعني:-<br />1- عقاب لمن ينشر إشاعة مثل أن دعم رغيف العيش، خلو مصر من مرض أنفلوانزا الطيور، ارتفاع مستوى المعيشة إرتفاع مستوى التعليم .... إلخ وكل تصريحات السادة المسؤولين وأعضاء مجلس الشعب الذين وعدوا أهالي دائرتهم بإنجازات ولم يقوموا بها وبهذا الشعب لن يكون هو المقصود بمثل هذا القانون.<br />2- مكافأة لمن يؤكد صحة هذه الإشاعات ويروج لها وطبعا دول صحافة وإعلام مهدف وموجه لخدمه أي برامج انتخابية.<br />3- أمر تنظيمي إنهم يكونوا عايزين يقولوا حاجه أو نـُصها \"جزء منها\" أو في مكان ومكان آخر يقولوا حاجة تانية وهكذا واحنا مش ضد النظام.<br />وبذلك ستكون مثل هذه القوانين في مصلحة الشعب في كل الأحوال... وليس حجر لحرية التعبير بالعكس .. والناس يعني هتجيب الكلام دا منين؟ غير من مصادر زي التليفزيون أو الجرائد ؟؟؟<br />يبقوا يحاكموا المسئولين عن هذا الكلام<br />ببساطة القانون يرفع شعار الشعب أولا!!!!"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620061652/http://masr.20at.com:80/article.php?sid=534"

[[comments]]
order = 5
subject = "لعنة الله على الكذاب أبو زبيبة"
author = "بهاء"
posted = "2006-06-18"
text = "يعني الرؤية إتضحت ياأخ محمد خالص، العرب بتقول إيه:<br />إن بنيَّ رملوني بالدم+++++شنشنة أعرفها من أخزم<br />ملاحظ إني معظم المصايب أردها للكلب السادات؟ لأنه أصل الداء، والخنزير الي جي بعده، هو ذيل ومعندوش قدرة على إبتكار حتى الأكاذيب المحبوكة زي السادات. البسطاء بيقولوا إن السادات أبو الديمقراطية والحريات، وهو الي سمح بعودة الأحزاب والكلام ده كله، تعرف هو عمل كده ليه؟ لأن رجال الأعمال إشترطوا عليه هذا، لأنهم مش عايزين تكون رقابة مركزية على حركة أموالهم في البلد، وبوضوح أكثر علشان لايكون ضبط للداخل والخارج من الأموال ولا يحق لأحد أن يسأل حتى أكبر جاسوس عمن مصدر ملياراته، عشان ده<br />سمح بإقامة أحزاب شكلية.<br />مرة السادات طلع على الشعب بإقتراح عجيب، قال إيه:\"اللحمة سعرها غالي، كان وقتها ثلاثة جنيه للبتلو، قرار بمنع الجزاريين من ذبح الماشية لمدة شهر\"، طب ليه يا محشش؟ قال:\"آه بكده يعرف الجزاريين إن الله حق، ويبيعوا رخيص، ده حصل زمان في بريطانيا أيام الحرب، ورخصت هناك اللحمة\". بغض النظر إن ده عمره ما حصل لا في بريطانيا ولا كينيا، كان سعادته متعاقد مع شريكه عبد الحي على أكبر صفقة فراخ فاسدة في تاريخ مصر، قعدت الناس تاكل منها شهر، والي مات والي معرفش إيه، أمانه عليك يامحمد تسأل الوالد أو الوالده إن كان ده حصل، وإلا مطلعه من دماغي!<br />المقصود الفساد بقاله عقود، ولإزالته لابد من إزالة رموزه، عايزين كده؟ يبقى كل تضحية رخيصة، مش عايزين، إبقم موتو قهر وغيظ!<br />لعنة الله على الكذاب أبو زبيبة"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620061652/http://masr.20at.com:80/article.php?sid=534"

