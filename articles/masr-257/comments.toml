[[comments]]
order = 1
subject = "برافو يارجالة"
author = "بن الكفر"
posted = "2006-05-04"
text = "في حد فيكم رايح يصلي يوم الجمعة وسمع الدعاء اللي بعد الخطبة اللي كل الشيوخ بيدعوة اللهم اهلك الظالمين بالظالمين وأخرجنا من بينهم سالمين غانمين ......؟؟؟؟؟ يارب الاتنين يطيروا"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012800/http://masr.20at.com:80/article.php?sid=257&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "خلوا بالكوا"
author = "موللي"
posted = "2006-05-08"
text = "يا جماعه انتوا كده ضيعتوا نفسكوا انتم هاتجيبوا سيره مرتضى منصور كمان ؟ اهوا دلوقتي يفتح لكم ملف فساد ويحبسكم ان شاء الله لانه عارف كل الفاسدين اللي فى الدنيا ومصور ملفاتهم"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012800/http://masr.20at.com:80/article.php?sid=257&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

