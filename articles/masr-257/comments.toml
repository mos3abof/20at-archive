subject = "مافيش فايده"
author = "ابو شريف"
posted = "2006-05-31"
text = "مش عارف ليه كل ما اسمع مرتضى منصور بيتكلم افتكر أن هناك قضية فساد كبيرة سوف يتم الإعلان عنها وفي النهاية أتذكر أن الذي يتكلم مرتضي منصور ....<br />ارجوك تكلم قليلا وإفعل كثيرا<br />الله يرحمك يامايستروا"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012800/http://masr.20at.com:80/article.php?sid=257&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
