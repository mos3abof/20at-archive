[[comments]]
order = 22
subject = "حسنى فاهم فى كل حاجة اصل جدو كان عمدة"
author = "احة يا بلد"
posted = "2006-07-04"
text = "من اكنر من 10 سنين وانا كل ما اقراء جريدة او اشوف لقاء لاى مسئول ويكون حقق اى نجاح او محققش حتى كنت يسمع جماة واحدة من اى وزير او مسئول كان بيقول الانجاز دة تم بتعليمات من الرئيس فى الكهربة بتعليمات من الرئيس فى فى البترول فى التعليم فى الصحة فى الى حاجة بتعليمات من الرئيس هو فاهم فى كل حاجة ماشى دة كويس طيب الباقى لزمتو اية انا اعرف ان ورير الكهربة المفروض بيفهم اكتر من الرئيس فى مجال الكهرباء واى وزير او حتى فرد عادى بيفهم اكتر من الرئيس فى المجال اللى بيشتغل فية دة شىء طبيعى انما هنا فى دولة فسادستان حسنى بيفهم فى كل حاجة اصل جدو كان عمدة عشان كدة البلد دى اوسخ بلد فى الدنيا الشعب المصرى بيموت يوم ورا يوم حبيبى ما جالى نوم وهما الحرمية فوق دماغنا واسيدنا كمان"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082241/http://masr.20at.com:80/article.php?sid=593"

