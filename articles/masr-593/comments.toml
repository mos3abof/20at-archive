subject = "قدر ولطف"
author = "جبان وخايف"
posted = "2006-07-04"
text = "اولا :-احب ان اهنأ والد الطالبةواقول حمدالله على السلامة وقدر ولطف وسيبوا اسيادنا فى حالهم بقى. انا عارف ان الايام اللى جاية حتكون سودة عليكم وعلى اللى يعرفكم من بعيد او من قريب واحب ان اوجة نصيحة لاختى الطالبة لو ربنا كرمك وكملتى تعليمك سيبك من سؤال التعبير وحاولى تعوضى فى باقى الامتحان ومن خاف سلم .برضة انتى عملتى اللى شناب مش قادرة تعملةوكفاية لحد كدا يمكن يرحل او تجيلة مصيبة تاخدة."
