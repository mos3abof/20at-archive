[[comments]]
order = 26
subject = "من حقك يابو شريف المصري (الصهيوني)"
author = "مكاري"
posted = "2006-07-04"
text = "من حقك تتغزل بأفضال اليهود على مصر من عصر الفراعنة لغاية يوم يبعثون. بس بص ياعمنا شايف حد هنا بقرا وبيفهم؟<br />حبيبك دايان قالها لما نشروا في الصحف زمان خطة الهجوم على مصر وسوريا، قال دايان بيرد على الصحفيين:\"العرب لا يقرأون، وإن قرأوا لايفهمون، وإن فهموا لايفعلون!\"<br />وبمتابعة إخوانا هنا اللي كتبوا تعليقات بعدك، أبصم بالعشرين إن المصريين أضل من الأنعام، أتاريكم لاقينها لعبة سهلة معانا.<br />إصحوا ياحمير مصر!!"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082241/http://masr.20at.com:80/article.php?sid=593"

