author = "حسن البياع"
posted = "2006-07-03"
text = "انا حسن البياع ياخوانا احب اعرفكم بنفسى انازى معظم المدرسين فى مصر طالب فاشل واصبحت مدرس ازاى معرفش بس دا من القوى العامله معنديش هدف ولارساله باخاف من عسكرى المرور بحب حسنى مبارك وكل صحابه واللى يرشهم بالميه هارشو بالبنزين واولع فى اللى خلفوه وشويه نفاق للسيد وكيل الوزاره ممكن يكون فيها ترقيه ولا حاجه ومش مهم العيال تفهم ولا تروح فى داهيه المهم رضا المسئولين وبكره تشوفو لما ابقا وزير التعليم ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟عجبى عليكى يابلد فيكى حاجه محيرانى نزرع القمح فى سنين ويطرح القرع فى ثوانى .......الادهم5555"
