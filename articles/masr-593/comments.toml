[[comments]]
order = 18
subject = "الريس الحووونين باس الواوا..وبقت صح!!!"
author = "حكاية الريس دى ماسخة اوى..هى البنت بتشحت منه؟ وللا عناوين الجرايد اللى فرحانه اوى بالعفو عن المتهمه باهانة الذات العليا، وجرح احساس حكومة القريب وحكومة الغريب، جتهم نيله هم الاتنين..وطبعا هو الاب الرحيم والصدر الحنين لابناء مصر، ومعلش اللى غلط يضربه بالراحه ونديه كارت ارهاب على اده، وهو صغنن عشان بعد كده فى جزم وشلاليت الامن المركزى وغير المركزى اساسا، وممكن الموضوع لو على معاها شويه نلاقيها صحفيه صريحه ويبقى ملهاش مكان غير فى القفص.."
posted = "2006-07-03"
text = "والله \"سونه\" ده فى الكلمتين الحوونيين للبنيه \"اكتبى محدش يقدر يعملك حاجه\" عامل زى محمد صبحى فى شخصية الديكتاتور سئيل وهو بيسأل المواطن عن رأيه فى حال البلد \"تكلم بلا خوف\" وهو بيشاور له انه هيندبح لو ماقلش اللى على مزاجه..<br />على العموم، طالما ان محدش هيعملها حاجه، يبقى اكيد واضح مين \"محدش\" ده<br />اهى بقت بلد الحق بيتشحت فيها ولازم ساعتها تبوس الايد اللى ايدتهولك (وهو حقك أصلا!!)، او تدفع رشوة عشان تاخده(عشان حقك برده!!)..وابقى قابلنى لو خدته"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082241/http://masr.20at.com:80/article.php?sid=593"

