[[comments]]
order = 1
subject = "فيهم الخير"
author = "mesh3aref"
posted = "2006-07-01"
text = "أنا سمعت ا منى الشاذلى مذيعة برنامج العاشرة مساءا فى دريم استضافت على التليفون وكيل الوزارة فقالها انا لا اقبل اهانة الرئيس بوش يعنى الرئيس بوش بيقبل اهانة شعبه له انما السيد وكيل الوزارة ما بيقبلش ان حد يقول عليه فى مصر كلمة وحشة حتى لو كان بنت صغيرة عندها 15 سنة فى امتحان العربى فى سؤال التعبير ربنا يخليه هو و حسنى مبارك و جمال و وزير التربية و التعليم للرئيس بوش سحيح فيهم الخير"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082241/http://masr.20at.com:80/article.php?sid=593"

[[comments]]
order = 2
subject = "ال ختشوا ماتوا"
author = "النجا ر27"
posted = "2006-07-01"
text = "احب اقول حاجه ان المدرسه والاداره ولا حتى الوزاره فى دماغها القرار 41 لسنة 2000 الكل بيكتب اكثر من ذلك فى الشهادات والدباليماتر من كده اشى غنيه واشى كلام جنسى فاضح ولكن المشكله ان الاخ السيد البياع من سلالة الاتحاد القومى والاتحاد الاشتركى وحزب البعث مشكلة البياع انه يذهب الى المدرسه للخناق وليس للاافاق فهو الكل هنا يعرف انه فى حرب اهليه طاحنه بينه وبين وكيلة المدرسه ال هى ام الطالبه واحنا هنا عارفين انه لا صحح ولا كان يعرف بس هو حلف براس جده البياع الكبير بتاع شادر البطيخ ال جابن شريط القطار ان البت لازمن تسقط فارس فيرانه للتجسس فخرج احدهم وهويقول كلمة ارشميدس وجدتها وجدتها وجدا ايه الجيبه والويبه ويفضح مصر وشعب مصر وسط الحثاله الذين يحكمون بالحديد والنار وبمناسبة الكادر الجديد فان السيد وامثاله لا يستحقون سوى شادر جديد ويعلقون من السنتهم جزاءا وفقا لشغلهم الراى العام ورئيس الدوله<br />هولاء الاوصياء لا يستحقون مثله ومثل مدير المدرسه ومدير الاداره وكيل الوزاره ان يبقوا فى اماكنهم فليشحنوا الى العراق حتى يمونوا على مستولى القاعده منهم لله"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082241/http://masr.20at.com:80/article.php?sid=593"

[[comments]]
order = 3
subject = "ياه هما لسه عايشين"
author = "عبد الله"
posted = "2006-07-01"
text = "ولاء رسبه فى العربى<br />ولاء دور تانى<br />ولاء راسبه سنتين<br />ولاء محلف عربى فقط<br />زكيل الوزاره عايز حد يقولى ايه شهاداته ايه ال يميزه عن اى موظف فى الدوله غير انه وصل باسلوبه<br />فليتفضل حد ويرسل لنا c.v بتاعه ونتاع البياع<br />وايه ال فادوا به التعليم<br />بس شغلونا وشغلوا الرأى العام وفضحونا هنا فى بلاد الله لخلق الله<br />والله بعد القلم ال اخدوه على قفاهم من السيد الرئيس ال قال (اكتبى واقرأى ياولاء محدش يقدر يغملك حاجه) كان الاولى بالسيد البياع ومدير المدرسه ومدير الاداره ووكيل الوزاره ان يلقوا بأنفسهم من اعلى كوبرى شربين الجديد<br />بس الحمد لله ال مافعلوا حتى لا يلوثوا ماء النيل<br />واحب ان احىى السيد المحافظ سعيد صوان والذى اعلن نجاح ولاء رغم انف وكيل الوزاره بحكم انه يحكم المحافظه وذلك قبل تدخل السيد الرئيس<br />ودعوا الى نشر موضوع التعبير ونشره على كل المواقع<br />ياولاء<br />ستبقين انت ويذهب كل من تسبب فى هذا الموضوع<br />الى المكان الذى يستحقونه وهو موش بعيد هو بجوار سور نادى شربين<br />الى المزبله"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082241/http://masr.20at.com:80/article.php?sid=593"

[[comments]]
order = 4
subject = "خلاص سيبوه يا ولاد"
author = "عابر القارات"
posted = "2006-07-01"
text = "مش عارف ليه لما بأفكر فى الفيلم بتاع الاء ده بأفتكر المشهد الشهير اللى لا يكاد فيلم قديم يخلو منه و هو مشهد العصابة اللى بتمسك البطل و تقعد تطحن فيه تطحن فيه و هوبه يدخل المعلم الكبير و يقول عبارته الشهيرة \"خلاص يا ولاد سيبوه\" طبعا بعد ما يكون البطل يا ولداه شاف البرد فى عز الصيف .... فاللى حصل ان البنت المسكينة مسكوها من أول الريس بياع لأمن الدولة لمدير الادارة التعليمية لوزير التربية و التعليم و إنتهت طبعا بتدخل المعلم الكبير الريس \"و خلاص سيبوه يا ولاد\" بعد ما البنت هتحرم بعد كده اصلا تكتب اسمها حتى على اى ورقة و اكيد أتعقدت فى حياتها ... الله يخرب بيت البياع و اللى ورا البياع"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082241/http://masr.20at.com:80/article.php?sid=593"

