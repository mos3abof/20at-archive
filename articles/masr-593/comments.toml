subject = "كنتى طنشى يا ست الاء"
author = "المصهين اوى"
posted = "2006-07-04"
text = "ما كنتى تطنشى ياست الاء انتى مالك ومال السياسه جبتى الكلام لابوكى وامك من اللى يسوى واللى ما يسواش عيشى يومك وصهينى وما تنسيش اغنيه ريكو اللى بتقول (راحت عليكى يا دنيا وراح زمن الشهادات وبقيتى يا دنيا ماشيه ع السقفه وع الصاجات ) وطبعااكيد انت عارفه ان اكبر راس فى البلد دى هى اللى ماسكه الصاجات والباقى كله بيرقص ما كنتى ترقصى يا بنتى وتريحى نفسك..........والبلد دى مش محتاجه معبرين البلد دى محتاجه صيع"
archived = "2006-07-05"
