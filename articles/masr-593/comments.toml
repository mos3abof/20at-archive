[[comments]]
order = 11
subject = "بلا فلقه هو جت على بياع واحد"
author = "سليم"
posted = "2006-07-03"
text = "مش قادرين على الحمار نطينا على البردعة. يجعل كلامنا خفيف لأحسن أستاذ برادعي يلفق لنا تهمة صناعة أسلحة نووية، ويلهف من ورانا مليارات من تاني حار ونار في جتته.<br />المهم بالنسبة لأستاذ رسن البياع ده، تأديبه سهل من غير ضرب وقتل وكلام من اللي المصريين عمرهم مايعملوه لنقص الرجولة فيهم، لو البلد شربين دي كلها تتفق على تحريم معاملة الحشرة البياع ده، لاسلام معاه ولاكلام ولا معاملة وكل من شافة يتف على الأرض ويقول أعوذ بالله من الوسواس الخناس، تفتكرهم درس زي ده من يبقى عبرة لأمثاله.<br />تلاته بالله كنت أعتقد إنه مفيش أحقر من الكويتيين حكومة وشعب في الكون، لكن مقارنة بمبارك ومين معاه، أقول يعد آل القباح الكفار الخونة اليهود الصهاينة معدومين الشرف والعروبة والإسلام، مقارنة بحلوف المنوفية من رجال الله الصالحين وقمة العروبة والشرف.<br />حد يحب يعلق ويستفسر؟"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082241/http://masr.20at.com:80/article.php?sid=593"

