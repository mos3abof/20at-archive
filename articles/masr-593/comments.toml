subject = "بيا ع ورحت ابيع باعونى"
author = "ابو اسامة"
posted = "2006-07-04"
text = "الأخ البياع اللى راح يبيع ولاد بلده علشان يقبض التمن باعوه فى اول قاعده وبقى هو<br />كبش قصدى حمار الفدى وخلا المنافقين والحرامية كلوا على قفاه عيش وبقوا هما<br />المنقذين والحنينين ورافعى الظلم عن المظلومين هى يعنى كانت نقصاك ما كله بيبيع اللى بيبيع بلده والى بيبيع شرفه والىبيبيع دينه وكله بقى بياع<br />ويا بلد فيكى كم بياع ؟؟"
archived = "2006-07-05"
