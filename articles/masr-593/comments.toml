order = 19
subject = "ربنا يبارك لينا في الريس مبارك وذريته"
author = "أبو شريف المصري"
posted = "2006-07-04"
text = "المرحوم مناحيم بيجن والمرحوم السادات والمرحوم رابين وسيادة الرئيس حسني مبارك وأستاذتي عبد العظيم رمضان وأنيس منصور وبطرس غالي وعبد الستار الطويلة والشيخ الطنطاوي والبابا شنودة ورؤساء تحرير الصحف القومية بالإضافة للدكتور مصطفى خليل وإخوات شهيد السلام الرئيس السادات دول وحدهم اللي تعلمت أحترمهم وأجلهم، لشجاعتهم وإيمانهم بالسلام وكراهية الإرهاب والحروب.<br />كفاية الخداع اللي عشناه في أيام ناصر والحروب اللي خسرناها والفقر اللي تجرعناه، عبد الناصر علشان يبقى زعيم كان لازم يجد له عدو، ووجد ضحيته في اليهود الغلابة، ولو قدر عليهم كان عمل لهم محرقة زي النازيين، هو مش كان عايز يرميهم في البحر؟<br />اليهود أقرب لينا كمصريين من العرب، وهما اللي بنوا لينا الأهرامات وألأثار اللي بنفتخر بيها، وده إعترف بيه المرحوم السادات أمام المرحوم بيجن، لما بيجن قال:\" أجدادنا بنوا الأهرام\" فتبسم السادات وقال: آمين. دي هي الشجاعة الأدبية، سيادة الرئيس مبارك تلميذ السادات الوفي والأمين على مبادئه الوطنية، ومصر بخير طالما حافظنا على خط السادات.<br />عاش الحزب الوطني، عاش الرئيس مبارك، عاش أنصار السلام، الموت للإرهابيين."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082241/http://masr.20at.com:80/article.php?sid=593"

