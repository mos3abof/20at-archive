author = "من تكون ايمان مرسال"
posted = "2009-12-12"
text = "واحدة عاشت فى كندا فى ثقافة غربية لا تعرف عن بلدنا شىء غير الاسم وانها من اصول مصرية<br />عايزة تطبع او تطبع كتبها فى اسرائيل<br />اية القضية<br />اية اللى فى فكرها هنخاف منة لما اسرائيل تعرفة<br />انا عن نفسى كشخص فنى متخصص فى تحلية المياة واعرف ان كبار علماء تحلية مياة البحر هم اسرائيليون وعندهم امرأة عجوزة تعتبر اكبر خبيرة فى العالم فى تحلية المياة وتحضر الندوات العالمية وتلقى بمحاضرات غاية فى الخبرة ونحاول جاهدين ان نتتبع كتبها واى اوراق تكتبها فى النت بلا اى حساسية فالعلم لا وطن لة ولا دين لة<br />واسرائيل فيها علماء فى الادوية وتحلية المياة ويا ريت نتعلم منهم<br />خليهم ياخدوا الادب بتاعنا اياك يجيبهم وراء<br />الموضوع مش قضية"
archived = "2009-12-20"
capture_url = "https://web.archive.org/web/20091220125038/http://www.20at.com:80/masr/review/14355-2009-12-12-09-03-14.html"

