[[comments]]
order = 5
subject = "الشهيد الجبان"
author = "محمد الجنابي"
posted = "2006-07-01"
text = "اريد ان اوضح بانه اذا كان بامكاتك مواجهة العدو وقتاله فلا داعي للعمليه الانتحاريه الا اذا كان منفذ العمليه جبان ليس لديه القدره ع المواجهة فيريد ان يختصر الومضوع ويخلص كما هو حال الخوارج في كل وقت فاما الغدر والاغتيال او الانتحار وكما قال عنهم رسول الله صلى الله عليه واله وسلم في الحديث الصحيح المروي في صحيح مسلم لان ادركتهم لاقتلنهم قتل عاد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123946/http://www.20at.com/article2.php?sid=1011"

[[comments]]
order = 6
subject = "ماتغلطش"
author = "المياسة"
posted = "2006-07-02"
text = "ياسيد محمد الجنابي ماتقولش عليه جبان لوسمحت الجبان اللي يدخل على الناس الآمنين العزل بالمصفحات والدبابات وحتى بالطيارات يقصفهم من فوق أما اللي مش لاقي دبابة يركبها ولاسلاح يضرب بيه وجعل من جسمه السلاح ده بتقول عنه جبان.؟ مالكش حق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123946/http://www.20at.com/article2.php?sid=1011"
