subject = "والاسوا من كده"
author = "عبدالله مفتاح"
posted = "2006-06-29"
text = "مقال جميل<br />الاسوا من كده ظهور شهداء للفن<br />شفت المهزله<br />الفن اللي بيتقدم دلوقتي ده خلو ليه شهداء<br />المقال جميل فعلا ولفت النظر لاحد المهازل الموجوده في مجتمعنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123946/http://www.20at.com/article2.php?sid=1011"

