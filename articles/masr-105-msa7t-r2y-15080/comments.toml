subject = ""
author = "لا مقارنة بالعرب!"
posted = "2010-01-30"
text = "حكومتنا فاسدة هما افسد! .. انا لفيت تقريبا من الخليج لحد تونس سواء سياحة او عمل كله فااااسد<br />اولا الامارات فبقولكم امنااااء شرفاء في اي جريمة مايقومش بيها اماراتي وخاصة لو ابن شيخ او حد مهم<br />وحد سمع عن جريمتين خلصوا بسرعة زي هشام طلعت مصطفي وقتلة الحمساوي ده (لان المتهمين غير امارتيين او خلايجة حتي) وشوفوا جرايد الخليج كله الجريمة بتبتدي بكلمة وافد او مقيم…قتل سرق نهب ..الخ لكن فيه مواطن عمل او مواطن يدير شبكة معرفش ايه ولو حصل وده عمري والله ماقريته اكيد مش هيبقي اي حد مهم!!"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130142023/http://www.20at.com:80/masr/105-msa7t-r2y/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 19
subject = ""
author = "شرطة دبى"
posted = "2010-01-30"
text = "شرطة دبى بتشتغل بالتكنولوجيا - بالصوت والصورة - مداخل الفنادق والعمارات متركب عليها كاميرات بتصور بالليل والنهار وعلى مدار 24 ساعة وكذلك التليفونات والمكالمات وتحديد المواقع<br />انما رجالة الحبيب العادلى عندنا بيقبضوا على اى واحد وينزلوا فية ضرب وصعقة كهربيا والقبض على مراتة وابنتة وتعريتهم امامة حتى يعترف<br />وعلى فكرة حبيب العادلى ممكن يقبض على واحد مصرى ماشى على كوبرى الجلاء ويخلية يعترف فى التليفزيون انة هو اللى قتل بتاع حماس فى دبى<br />خللى بتوع دبى يحولوا القضية للعادلى وهو هيمسك القاتل فى 3 ساعات"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130142023/http://www.20at.com:80/masr/105-msa7t-r2y/15080-2010-01-27-15-38-55.html"

[[comments]]
