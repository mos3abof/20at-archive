posted = "2010-01-31"
text = "اليوم مباراة غانا<br />كل سنة وانتم طيبون<br />بس وحياة ابوكم مفيش احد عندة انبوبة بوتاجاز زيادة<br />اليوم رحت بيت الحاجة ادور على وابور جاز قديم عندها - لقيت وابور الجاز بتاع الحاجة موجود واشتريت كيروسين اللتر ب 2 جنية وولعت الوابور<br />بس المشكلة الرهيبة ان الفونية طلعت مسدودة وقعدت ادور فى جميع الدكاكين على ابرة تسليك الفونية - كل البياعين كانوا فاكرين اننى عبيط لان انتاج الابر دى بطل من زمان<br />صحيح انا فى ورطة<br />مفيش انابيب بوتاجاز<br />والبديل وابور الجاز ومفيش ابر تسليك الفونية<br />الحل التالت الكهرباء<br />ومش معقول مع سعرها التصاعدى اطبخ على الكهرباء<br />فية احد عندة حل"
archived = "2010-02-06"
