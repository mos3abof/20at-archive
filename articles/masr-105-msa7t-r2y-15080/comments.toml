subject = ""
author = "لا بد من يوم"
posted = "2010-01-28"
text = "لا بد من يوم ترتد فية المظالم<br />ابيض على كل مظلوم<br />اسود على كل ظالم"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 7
subject = ""
author = "بيفكرنى بالعزب"
posted = "2010-01-28"
text = "هى دى دولة والا عزبة الاكسلانس<br />النهاردة دفعت فاتورة التليفونات - الجديد الشهر دة فى الفاتورة اضافة رسوم دمغة لفاتورة التليفون - نعم مكتوب -دمغة 7 جنيهات - وضريبة مبيعات 8 جنيهات<br />ضريبة مبيعات لية هو انا اشتريت اية<br />ودمغة لية هو انا مقدم طلب لمين دى انا با ادفع رسوم خدمة<br />وعلشان كدة يا عم زفت قررت الغى التليفون الارضى - مش عايز تليفون فى البيت - كفاية قوى موبايل اتصالات<br />ملعون دة ابو نظام حكم فاشل<br />بينهبونا ويشتروا القروض هو وابنة ويحطوها فى بنوك سويسرا"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 8
subject = ""
author = "حاجه تنرفز"
posted = "2010-01-28"
text = "ايه الكلام ده الشعب فين ورئيس الجمهوريه فين ولا الحاشيه… مقارنه غاريبه<br />وبعدين مين الى عمل الديون ده<br />والمشكله ان اى دوله فى العام تقدر ثروتها بعدد شبابها احنا شبابنا اعد على الاقهاوى مش لاقى شغل"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 9
subject = ""
author = "مصر والجزائر عجبي"
posted = "2010-01-28"
text = "الجزائر بلد المليون شهيد<br />ومصر بلد المليون شحات"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 10
subject = ""
author = "يا ست حنان"
posted = "2010-01-29"
text = "الفلوس دى فى انهو بنك<br />الفلوس دى فى بنوك وطنية مصرية<br />والا بنوك سويسرا<br />والا بنوك امريكا<br />والا بنوك اسرائيل<br />اللة يخليكى المقالة الجاية تبقى على الموضوع دة"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 11
subject = ""
author = "يا ناس يا شر"
posted = "2010-01-29"
text = "يا ناس يا شر كفاية قر<br />واية يعنى ابن الرئيس محوش 750 مليون دولار - دى الابن التانى<br />انما الابن الاول فاللة اعلم<br />واية يعنى<br />الراجل كان بيحوش مصروفة من البابا ويحط الدولار على الدولار لما بقى مليونير<br />واحد بيحوش مصروفة - انتم مالكم يا رخمة<br />كل واحد حر فى مصروفة"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 12
subject = ""
author = "مصر والجزائر"
posted = "2010-01-29"
text = "احتفلت الجزائر تحت رئاسة بوتفليقة بتسديد اخر دولار فى القروض التى عليها<br />الجزائر لم تعد مديونة لاحد وليس عليها اى قروض حاليا<br />بينما مصر الان عليها قروض بحوالى 900 مليار جنية قروض تم استدانتهم جميعا فى عهد الرئيس الحكيم محمد حسنى مبارك<br />فعبد الناصر مات وعلينا قروض 400 مليون جنية بتوع بناء السد العالى تم تسديدهم ببضائع البرتقال المصرى واثاث دمياط للروس - يعنى الدمايطة سددوا قرض بناء السد العالى<br />والسادات مات وعلينا ديون مليار واحد من الجنيهات<br />اما الان فلا احد يعرف كيف سنسدد تلك الديون<br />والاغلب انة سيتم فرض الرقابة المالية الدولية على البلد كما فعلوا مع الخديوى اسماعيل ثم اتى الاستعمار البريطانى<br />وضع مبكى ومخزى<br />وفرحانين اننا غلبنا الجزائر فى الكورة<br />افرحوا"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 13
subject = ""
author = "برضة لية"
posted = "2010-01-29"
text = "لان الداخلية ميزانيتها 9 مليار جنية وهو رقم رهيب اذا علمنا ان ميزانية الجيش المصرى ايام حرب 73 كان 200 مليون جنية<br />ميزانية الداخلية 9 مليار جنية وهو رقم ضعف رقم ميزانية وزارة التربية ووزارة الصحة معا<br />مبالغ رهيبة مقررة لقهر الشعب المصرى<br />لية مليون عسكرى امن مركزى مجند - بمناسبة اية<br />لو صرفنا 5 مليار من ميزانية الداخلية على المجارى ومياة الشرب هنخللى كل قرى مصر خدماتها مية فى المية وفى سنة واحدة<br />كل موارد الدولة مخصصة لقهر الشعب المصرى وكسر ارادتة واذلالة<br />ربما عندهم فى القيادة مستشارون من الموساد يوجهونهم بعمل اللازم نحو اذلال الشعب<br />المواطن معرض للمحاكم المدنية ومحاكم الطوارىء امن الدولة والمحاكم العسكرية<br />تماما يعامل الشعب المصرى كما يعامل الشعب الفلسطينى فى الضفة الغربية من قوات الاحتلال الاسرائيلى ان لم تكن اسرائيل ارحم"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 14
subject = ""
author = "مواطنة مصرية مفروسة"
posted = "2010-01-29"
text = "انا مفروسة من المصريين كلام كلام كلام وبس .. قال يا فرعون اية فرعنك قال مالقيتش حد يلمنى .. اين الجماعات والأخزاب واجمعيات الأهلية ( كله كدة ساكت ومستنى فرصة يلحس فيها جزمة الرئيس وإبنه ) اين المثقفيين والمعارضيين واصحاب الصحف المستقلة ورؤساء تحريرها - اية كل دة اونطة كومبارس بيطبلوا ويغنوا على الشعب المصرى وخلاص - صحيح والله نحن كما قال الشاعر \" يا أمة ضحكت من جهلها الأمم \""
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 15
subject = ""
author = "فلوس المساكين"
posted = "2010-01-30"
text = "كل الفلوس دى فلوس اليتامى والارامل والمساكين دافعى الضرائب<br />لان نظام الضرايب فى مصر يدفعة الفقير من لحمة ودمة<br />فالفقير اذا اشترى جزمة او بنطلون او شراب بيدفع ضريبة مبيعات من 25 الى 35 % من التمن الاصلى وبتخصم من المنبع<br />واذا تكلم فى التليفون فعلى كل مكالمة ضريبة مبيعات<br />واذا استهلك كهرباء او ماء فسيدفع تمنها بالاضافة الى ضريبة مبيعات<br />وقريبا جدا هيدفع ضريبة العقارات نظير نومة على السرير فى بيتة ملكة الخاص<br />وكل هذة الاموال تجمع وتشحن الى بنوك سويسرا<br />اما المشاريع والطرق فكلها هبات ومعونات من دول الاتحاد الاوروبى ودول الخليج<br />وعمار يا مصر"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130142023/http://www.20at.com:80/masr/105-msa7t-r2y/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 16
subject = ""
author = "صحيح لا مقارنة"
posted = "2010-01-30"
text = "رجالة الحزب الوطنى دخلوا يعلقوا بجهل<br />انت هتقارن اية باية<br />هتقارن الجهل والبلطجة بالحضارة فى دبى<br />انت شفت اية فى الخليج يا جاهل<br />العسكرى فى قسم الشرطة هناك بيكتب محضر الحادثة على الكمبيوتر واحنا هنا بنشتغل على السيركى ودفتر الحوادث والاحوال بتاع المماليك<br />عسكرى المرور هناك واقف بكمبيوتر فى الشارع وانتم وافقين فى الكمين تلموا فلوس بالعافية من الناس<br />فرق كبير بين ظابط مرور جاهل هنا مش عارف يسوق عربية وعسكرى هناك راكب مرسيدس<br />اما الجزائر فتعدادها 30 مليون<br />ومفيش عندة عشوائيات ولا ناس ساكنة فى الترب والمقابر<br />طول ما فية ناس جهلة زيك بتخبى راسها فى الرمل والزبالة مغطياها مش هنتقدم<br />فعلا مفيش مقارنة<br />هتقارن اية باية<br />علشان كدة محتقرين"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130142023/http://www.20at.com:80/masr/105-msa7t-r2y/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 17
subject = ""
author = "لا مقارنة بالعرب!"
posted = "2010-01-30"
text = "ثانيا الجزاير رمز التخلف<br />والفساد والجهل وروحوا الجزاير اوشوفوا جاليتهم في اوروبا<br />و لاهما نصنا في العدد ولا مواردهم زينا و حكومتهم عصابة<br />وعايزين نعرف اصلا ديونهم قد ايه واتسددوا منين يالبترول اوالاتحاد الاوروبي اتنازل عن النص عشان بايعين اصلا هويتهم ليه من زمان!التفاصيل دي مانعرفش ومش هنعرف عنها حاجة عشان نقارن 85مليون بدويلة عدد سكانها زي عدد سكان القاهرة الكبري وبالكتير طنطا فوقها!!<br />واخيرا احب اقول لمسؤولينا اسرقوا بس بشويش علينا!و اقول لصاحبة المقال انهم مش بالامانة دي يعني انتي جملتيهم كتير!!"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130142023/http://www.20at.com:80/masr/105-msa7t-r2y/15080-2010-01-27-15-38-55.html"

[[comments]]
