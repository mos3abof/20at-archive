[[comments]]
order = 0
subject = ""
author = "سياسة الدولة"
posted = "2010-01-27"
text = "المقاله دي تتماشى مع سياسة الدولة<br />انتو تقولوا اللي انتو عايزينه<br />واحنا نعمل اللي احنا عايزينه<br />يعني قولوا جمال مبارك حرامي الدولة بتتسرق مش عارف ايه مفيش مشكلة<br />قولوا اللي انتو عايزينه<br />والدولة تعمل اللي هي عايزاه تغير الدستور تبيع ممتلكات الدولة تعمل اللي هي عيزاه<br />فهمتوا سياسة الدولة"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 1
subject = ""
author = "مقالك ناقص"
posted = "2010-01-27"
text = "اولا المرتب حاجة والمخصصات حاجة تانية<br />انتى لم تذكرى قيمة المبالغ المرصودة شهريا للمخصصات لقصور الرياسة الملكية<br />اذكرى لنا مخصصات القصور قد اية<br />واذا كان مجلس الشعب مايعرفهاش<br />وكل وزير لة مخصصات غير المرتب بالملايين"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 2
subject = ""
author = "حمدى حسين"
posted = "2010-01-27"
text = "الاستاذة/ حنان مقال رائع … وكله مصداقية .. ياريت تعميمه على كل المواقع لبساطة كلماته ، وحسن توصيله وفهمه لكافة مستويات الفهم … شكرا لكى ،،،،"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 3
subject = ""
author = "محكمة عسكرية"
posted = "2010-01-27"
text = "لو الكلام اللى ذكرتية دة حقيقى فى اى دولة متقدمة او متخلفة فالنهاية محكمة عسكرية<br />يعنى اية ابن الرئيس يشترى ديون مصر<br />ومين اللى جاب الديون دى<br />وفين وزارة المالية ووزارة الاقتصاد<br />وفين الخبراء القانونيين والدستوريين<br />هو يجيب ديون وابنة يشتريها بربع تمنها ويرجع يبيعها للحكومة تانى<br />اية الهنا دة<br />احنا فى عزبة والا فى دولة<br />كلام ينرفز<br />وبعدين مرتب رئيس الدولة 6000 جنية ولكن مصاريفة ستة ملايين جنية فى الشهر على حساب الخزينة خارج المرتبات والا من اين تكاليف الاقامة فى الشرم وسمك الجمبرى والطيارات والحاشية والانجال وسفريات باريس والعلاج<br />بطلى نرفزة يا ست حنان"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 4
subject = ""
author = "وفين الهدايا"
posted = "2010-01-28"
text = "فى الدول المحترمة والدول الغير محترمة برضة - لما رئيس دولة او زوجتة بتزور دولة تانية وتقد هدايا للرؤساء وزوجاتهم - هدايا ثمينة من الذهب والالماس - الهدايا دى بتتسلم لخزينة الدولة وبتبقى من مقتنيات الدولة<br />عايزين نعرف الهدايا دى دلوقتى اللى بتيجى من امراء البترول وغيرهم بتروح فين<br />فية احد فى البلد دى عارف عنها حاجة"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
order = 5
subject = ""
author = "حسني مبارك"
posted = "2010-01-28"
text = "مفيش مشكلة<br />انتو قولوا اللي انتو عايزينه<br />وانا حعمل اللي انا عايزه<br />هي دي سياستي"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091350/http://www.20at.com:80/masr/hot-topics/15080-2010-01-27-15-38-55.html"

[[comments]]
