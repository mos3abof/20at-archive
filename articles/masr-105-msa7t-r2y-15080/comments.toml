author = "حماس فى دبى"
posted = "2010-01-30"
text = "وبتاع حماس بيعمل اية فى دبى !!!!!!!!!! بيعمل اية فى فنادق دبى<br />الاخ محمد دحلان عضو القيادة فى حركة فتح ومساعد ابو عباس ورجل امريكا واسرائيل فى فتح والقيادة الفلسطينية - الباشا المناضل الثورجى - عندة اربعة عمارات سكنية كبيرة فى دبى - ايجار الشقة الواحدة فيهم السنوى 130 الف درهم - هى دى المشاريع والا بلاش - وهى دى النضال بتاع فتح<br />والاخ ابو عباس كل اسبوعين فى الشرم - يا خوفى ليكون لة فندق تمليك الاخر فى الشرم<br />رؤساء اخر زمن"
