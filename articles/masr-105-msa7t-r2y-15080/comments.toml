order = 21
subject = ""
author = "الى حبيب العادلي"
posted = "2010-01-30"
text = "حبيب العادلي شوف يا حبيب يا عادلي فيه واحد اتقتل من حماس في دبي شوف حكومة دبي بتعمل ايه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــ<br />وكشفت شرطة دبي ان معظم المشتبه بهم يحمل جوازات سفر أوروبية وغادر الإمارات قبيل الإبلاغ عن وفاة المجني عليه والعثور على جثمانه في أحد فنادق دبي. وقال المكتب الإعلامي لحكومة دبي نقلاً عن مسؤول أمني في دبي إن التحقيقات الأولية ترجح أن الجريمة ارتكبت على يد عصابة إجرامية متمرسة كانت تتبع تحركات المجني عليه قبل قدومه إلى دولة الإمارات. وأكد أنه رغم سرعة تنفيذ الجريمة ومهارة مرتكبيها، إلا أن الجناة خلفوا وراءهم أثراً يدل عليهم وسيساعد على تعقبهم ومن ثم اعتقالهم في أقرب فرصة. وقال إن شرطة دبي لم تعد تعترف بعبارة «جريمة غامضة أو مجهولة».<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />يا ريت تتعلموا من شرطة دبي"
