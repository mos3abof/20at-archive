order = 0
subject = "الصور دي مش غريبة عليا... شفتها في أي فيلم يا واد محمد ؟؟ شفتها فين؟؟"
author = "محمد السيد"
posted = "2005-12-07"
text = "لصور اللي إنتو جايبنها دي .... مختلفة تماما عن البيت اللي أنا ساكن فيه ....<br />يمكن عشان مش عندي غرفة لوحدي ... يمكن ؟؟ مش عارف ...بس أنا حسيت بـ ... ولا بلاش .....<br />في الجنة إن شاء الله ... حأرجع نفسي شباب وحأعمل غرفة زي دي ... وأعيش فيها لوحدي ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114649/http://www.20at.com/article2.php?sid=14"

