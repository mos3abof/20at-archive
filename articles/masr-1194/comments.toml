subject = "لقطة جميلة فعلا"
author = "bebo"
posted = "2006-11-22"
text = "أستاذى العزيز : لن أقول إن الموضوع جميل أو جديد فهذا دوما كان عهدى بك فى كل ابداعاتك ولكن الجديد فى هذا الموضوع هى اللقطة الجميلة أوبقول آخر اكتشاف شخصية جديدة لم يلتفت أحد إليها ... ولكننا فى حاجة إلى موضوعات الساخرة التى دوما ما اشتقنا لها<br />ولك منى ألف سلام"
archived = "2006-11-24"
