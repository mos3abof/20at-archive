[[comments]]
order = 1
subject = "الله يمور يا عمنا"
author = "ياسر ابو عمار"
posted = "2006-11-30"
text = "الله ينور يا عم حسين ،ايوة كدة متحرمناش من طلعتك البهية ،فكرتنى فى يوم كنت مع المهندس عمر عبد الله فى المحامين وبعد دقيقة واحدة من دخوله النقابة سامح عاشور او طوسون اتصل بيه وقال له ايه اللى جايبك النقابة النهاردة ؟فعرف ان صاحبك بلغ فورا ،المهم واحنا خارجين قال المهندس عمر لعمك محمود بقه ده كلام يا راجل انت لحقت تبلغ ؟فرد عليه بكلمته الماثورة :اكل عيش يا باشا .<br />طيب عمك حكشة ده وعلرفنا انه بياكل عيش فى نقابة المحامين يا ترى مين بياكل عيش فى اماكن تانية وازاى نعرفهم ؟<br />انت مش فاكر زميلنا اللى قاعد فى الصحفيين 48 ساعة فى اليوم لاقط الرايحة والجاية ،لدرجة ان احدى الصحف لما نشرت خبر بصورة عن فعالية كانت فى النقابة جابت صورته وهو بيبلغ تقرير فى التليفون .عرفته يا حسين؟؟؟؟"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073028/http://masr.20at.com:80/article.php?sid=1194"

