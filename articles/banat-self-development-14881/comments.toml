author = "El Ghoul"
posted = "2010-01-15"
text = "مع احترامي لكاتبة المقال ,,, مقال سئ جدا جدا جدا … وسؤال بقي وهو حضرتك بقي اللي جبتي الديب من ديله وانتي الوحيدة اللي عرفتي حقيقة الرجل وكل البنات مش عارفاه … وبما انك كاتبة يعني المفروض مثقفة يعني المفروض ان مافيش قاعدة عامة يعني مش ينفع نعمم علي كل الرجال … مش عشان انا رجل بقول الكلام ده بس ممكن حضرتك تروحي تبصي قدام المرايا وتشوفي انتي اد اية مقصرة في حق جوزك لو متجوزة او شوفي انتي كبنت كاملة ولا فيكي نقص اكيد فيكي نقص . يا ريت ما نرميش اخطائنا او فشلنا في علاقة علي شماعة الرجالة وحتى لو هما مخطئين فانتوا كمان مخطئين او علي الاقل ماعرفتوش تعالجوا الخطأ اللي في شريك حياتك،،، في النهاية كلنا بني ادمين .. يعني ننتمي لنفس النوع … يا ريت اللي تكتب تكون فعلا بتكتب لهدف ,, مش اي بتنجان والسلام"
archived = "2010-01-16"
capture_url = "https://web.archive.org/web/20100116015947/http://www.20at.com:80/banat/self-development/14881-2010-01-14-15-29-12.html"

