[[comments]]
order = 18
subject = ""
author = "eshraka"
posted = "2010-01-25"
text = "(حقيقة الرجل):<br />(ليس مغرو)ر:كل الحكاية لا يحب ان تعامله المرأة بندية و المرأة أيضا لا تحب أن تعامل الرجل بندية و لكن تحب أن تشعر أنه حامى الحمى فهذا من تمام التوافق بين الرجل والمرأة<br />(ليس كسول):الزوجة الكسولة هى التى تتضرر من خدمة زوجها فما الذى يضرها أن تعمل كوب شاى أو تناوله الموبايل..و لو تخيلنا رجل من بداية الزواج انه كل يوم يقول لزوجته انه يريد شاي بالنعناع بعد الغدا ..اذا بعد 3 شهور فقط من الزواج سيكون قال الحكاية دى 90 مرة..اليست 90 مرة كافية انها بعد كدة تعمل الشاى من نفسها ؟؟؟ و قس على كدة الأمور الأخرى…ثم الرجل يعمل ليلا و نهارا ليلبى طلبات الاسرة ثم نقول عنه كسول؟؟<br />(بصباص): صحيح الرجل المفروض ما يبصش لكن العتب أولا على البنات الماشيين شبه عرايا تستعرض كل واحدة جسمها كما تعرض السلع فى الفاترينة<br />(عيد الحب): اذا بذل الرجل ما يستطيع ليسعد زوجته ثم لم يقل لها كلمة رومانسية فى مناسبة هل هو افضل ام من يجيد الكلام الرائع و لكن بدون فعل؟؟<br />(التفكير فى الخيانة):ما اسهل الخيانة للرجل و المرأة بدون الرادع الأخلاقى و الدينى"
archived = "2010-02-18"
capture_url = "https://web.archive.org/web/20100218065640/http://www.20at.com:80/banat/self-development/14881.html"

