text = "احب احيي صاحبة التعليق رقم 18 و اقول يا رب ربنا يكرمك و يا رب البنات كلها تبقى عندها نفس الحكمة بتاعتك دى و رزانة العقل.<br />اما اللى عملت الموضوع فأحب اقولها مش شرط انك قابلتى مثال او اتنين من الرجالة اللى فيهم الصفات اللى انتى بتحكى عليها انك تعممى الكلام دا لكل الرجالة و احب انك تقرى تعليقى على البنات فى العنوان دى بنفس اسمى فى التعليقات \"أحمد المصرى\" و الله انا بشكر فى كل البنات المصريات<br />http://www.20at.com/banat/only-for-men/14972-2010-01-19-18-51-19.html"
