posted = "2010-02-10"
text = "انتو مالكوا داخلين فيها شمال ليه !!!!!!!<br />اولا هي مش بتقول رأيها بس و خلاص .. لكن بالعكس هي مدعمة كلامها بدراسات و احصائيات اتعملت هنا وبرة .. يعني هي مش بتتكلم من فراغ ..<br />كلنا فينا مشاكل .. وفيش جنس أفضل من الجنس الآخر .. كلنا متساويين عند ربنا والفرق بين كل واحد والتاني مش بجنسه<br />بس الفرق ان احنا الستات بنعترف بمشاكلنا .. رغايين؟ آه رغايين .. في البعض يحب النميمة؟ آه فيه .. وهكذا .. عادي يعني ..<br />وهو دة الفرق بينا وبنكو .. الرجالة مابيحبوش حد ينتقدهم أو يتكلم في عيوبهم .. مع انهم بشر يعني !!!! .. بس دايما كتير من الرجالة عندهم شعور بأنهم كائنات (استغفر الله) قربت توصل الى حد الكمال .. معندهومش مشاكل و يهربوا من مواجهة الآخرين لهم بأخطائهم .. خصوصا لو كانت ست هي اللي بتواجه !!!!!<br />كل جنس في حاجة للجنس الآخر .. وعمر مالحياة هتمشي بالرجالة بس أو بالستات بس .. ربنا خلقنا كدة .. كل جنس بيكمّل الجنس الآخر ولا تستقيم الحياة بدونه .. لكن الأهم نتعلم ازاى نحترم الجنس الآخر و نتعلم ازاي مانتفهش منه و نعرف ازاي نتعامل مع بعض من غير مانقلل من بعض<br />وشكرا"
