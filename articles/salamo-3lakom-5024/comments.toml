text = "المسيح لم يولد في 7 يناير ولا 25 ديسمبر<br />وميلاد المسيح مشكلة حلها القران العظيم عندما قال ربنا وهزي اليك بجزع النخلة تساقط عليه رطبا جنيا<br />والرطب له ميعاد الا وهو في الصيف وتحديدا في شهر اغسطس<br />وطبعا مفيش معلومات اوثق من القران الذي لم يتغير ولم يتبدل على مدار 1400 عام"
