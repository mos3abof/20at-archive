text = "في رد على الأخ موضح 2<br />لو أنك أردت أن تشرح للناس أن هناك حساب و عقاب و أن الناس بعد أن يموتوا لن يفنوا بل س يذهبوا لدار العدل ليحكم عليهم بسبب أفعالهم و أن من ي فعل الخير سيجد الخير و من ي فعل الشر سيذهب للجحيم …و لأنك عندما تشرح لهم هذا سيقواوا نعم نعرف .. ساعتها ستقول أنك تأتي بدين إلى أناس تعرف الدين …لم يكن المصريون القدماء وثنيين كالفايكنج أو كالسومريين أرجو منك يا أخي أن تعيد قراءة ديانة مصر القديمة و ستعرف أنها و إن كانت في ظاهرها وثنية إلا أنها بالتأكيد لها أصول سماوية<br />قد يكون التاريخ و الزمن الطويل أضاف لها ما ليس فيها و لكن فكرة التوحيد لم تكن بعيدة عنها كما أن فكرة الخلود موجودة و الحساب و العقاب كانت لو أن لنا أن نقول أنها أرقى الديانات الوثنية و أقربها للدين السليم ."
