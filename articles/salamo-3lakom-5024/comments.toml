posted = "2007-01-08"
text = "يعني ميلاد سيدنا عيسى .. مختلفين علية اذا كان قبل ميلادة بسنتيت و للا 4 سنين ؟؟<br />وللتعليق اللى فوقى بقول ماتقولش لا قبل فوات الاوان وللا بعده .... سيب كل واحد على راحتة .. لا اكراه في الدين ...<br />و بعدين كل واحد يعمل اللي هو مصدقة و مقتنع بيه .... المهم فعلا ان هما يكونوا مقتنعين بيه ... و الا يبقى مالهوش لازمة<br />سلام يا ريس ...."
