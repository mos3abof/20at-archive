subject = ""
author = "موضح"
posted = "2008-05-30"
text = "عزيزي كاتب المقال، أسمح لي أن أعلق على بضعة تقاط:<br />1- \\\\\\\"ويقول وسيم السيسي أن هناك قول مشهور للقديس مارمرقس (الذي أدخل المسيحية مصر) يقول فيه: عندما جئت وجدت المسيحية في مصر..\\\\\\\". هذا الكلام لا صحة فيه. فلو كان هذا الكلام صحيح، فلماذا أحتاج القديس مارمرقس أن يلاقي العناء في نشر المسيحية في مصر، بل وأكثر من ذلك فأن الكنيسة القبطية تعيد كل عام باستشهاد مارمرقس الرسول اول باباوات الاسكندرية (30 برمودة). في مثل هذا اليوم الموافق 26 أبريل سنة 68 م. فلو كان كلامك صحيح فلم تم قتله من قبل الشعب الوثني كله، إلا يعني هذا أنه كان ينشر دين مخالف لما كان يؤمن به الأقباط الوثنين في هذا الوقت؟ هل تعرف أن المسيحية ظهرت في مصر في عام 68 ميلادية وليس كما قيل في المقال؟ ويمكنك مراجعة كتاب السن[ *** ]ار المسيحي (تاريخ القديسين) كما يمكنك مراجعة كتاب تاريخ الكنيسة الفصل الأول. إما قول أن هناك شبه بين ولادة المسيح وولادة حورس ولهذا آمن به الأقباط فهذا كلام تنقصه الدقة. فحورس كان إلهاً عند الفراعنة ولهذا كان الجميع يعرفون قصته حق المعرفة أنه ولد من أب هو أزوريس وأن هي إيزيس (بالتناسل) أما مارمرقس فجاء ليدعو للمسيح الذي ولد من أم عذراء (لم يمسسها بشر) حملت بقوة الآله. فهناك تناقض بين ميلاد المسيح وميلاد حورس. ولم يولد المسيح كملك (بل ولد في مذود بقر، كشخص فقير ليس له ليسند رأسه)، بينما حورس ولد ملك في كل قوته وبهائه. فما الذي جعل الأقباط يؤمنون بالمسيح الذي ولد في مذود بقر من أم فقيرة ويتركون الخرافة (حورس ذو المجد والبهاء). ولا داعي أن أشرح الفرق بين مفهوم ميلاد المسيح (الموجود في القرآن أيضاً) وبين ميلاد حورس، فلو صدقت أن ميلاد المسيح يشبه ميلاد حورس إذن فأنت تنكر ما جاء في القرآن أيضاً (أنا لا أشكك فيك ولكني أوضح الخطء الشنيع الذي وقعت فيه). كما أن اليوم الذي ولد فيه المسيح هو 30 كيهك وليس 29، ونحن نحتفل به في يوم 29 كيهك ليلاً أي في أول ساعات يوم 30 كيهك وهذا هو الوقت التقريبي الذي ولد فيه السيد المسيح.<br />2- بدأ المسيحيون في العالم كله الأحتفال بعيد ميلاد السيد المسيح على الأرض منذ عام 40 م، وقد بدأه القديس يعقوب (أسقف روما وتلميذ المسيح) وكان في ذلك الوقت يحتفل المسيحيون بعيد ميلاد السيد المسيح مرة كل 33 عاماً تذكاراً ليوم ولادته وهي الفترة التي كان فيها على الأرض. وبعد ذلك وجدوا أن كثير من الناس لا يمكنهم حضور العيد إلا مرة أو مرتين ولما في العيد من طقوس دينية هامة للأنسان فقد وجدوا أنه يمكن الأحتفال به في كل العام في ذلك الوقت. ومن الهام أن نلاحظ أن السنة القبطية هي سنة شمسية أي ثابتة المواعيد.<br />3- لفظ عيسى ليس لفظ مصري قبطي بل هو (أيسوس) وهو لفظ يوناني وهو المعادل اللفظي لــ (يسوع) والذي ينطق بالأرامية (يشوع) ومعناه (المخلص) بالعبرية (وينطق عيسى في العربية)<br />4- السيد المسيح لم يقيم في أسيوط في معبد أزيس بل في كوخ وأيضاً في وقت ما كان في كهف في الجبل (راجع قصة رحلة العائلة المقدسة إلى أرض مصر) وقد بنى بعد ذلك في هذا المكان دير المحرق بأسيوط.<br />شكراً لك على إتاحة الفرصة لي للرد. أتمنى أن أكون قد أفدت"
archived = "2009-05-11"
capture_url = "https://web.archive.org/web/20090511144134/http://www.20at.com:80/salamo-3lakom/5024.html"

