[[comments]]
order = 4
subject = "بلا ازهر بلا كنيسه"
author = "هذا الموضوع يؤكد ان الموقع اخوانى صميم فقد قام الموقع العزيز بالتشكيك من قبل فى بعض قواعد و رجال الازهر وجامعته وها هو الان يشكك فى قواعد ورجال كنيسه الاقباط ، فى حين انه لم يحاول التطرق ابدا لاى تشكيك او تحاوزات الاخوان سواء على المستوى الفردى او الجماعى اللهم الا موضوعات بسيطه وجندت فيها كل الردود لتبرئتهم وكانهم قوم من الملائكه واخر بل والوحيدين المحترمين فى العالم ، سحقا لكم. ان النيل من الرموز الدينيه فى البلد لا يخدم حريه الراى و لا الشعب ولا كل الكلام الفارغ الذى تتشدقون به بل لا يخدم الا جهه واحده ترى فى نفسها الزعامه الدينيه الوحيده فى البلد والجهه العليا المفوضه بالتحدث باسم الله و رسوله"
posted = "2007-01-10"
text = "واسخروا ما شئتم من كلامى فانا ارى ايدى الاخوان فى كل مكان كما ترون انتم ايدى اليهود فى كل مكان. ومفيش حد احسن من حد و كلنا عندنا امراض نفسيه و بنتخيل حاجات."
archived = "2007-01-26"
capture_url = "https://web.archive.org/web/20070126091722/http://masr.20at.com:80/article.php?sid=1412"

