text = "قرأت ايضاانهم لمافتحواالهرم الاكبر وجدوا التابوت خالى من الجثة وكتب الكهنة ان الفرعون الملقب خوفوا بعد موتة ووضعة فى القبر صعد بجسدة الى ابوة الذى فى السموات<br />هل هى حيلة من الكهنة لاخفاء اين دفن اذ انة لم يعثر لة على قبر<br />هل كان خوفو ابن الة<br />واين دفن<br />سؤال للاستاذ السيسى"
