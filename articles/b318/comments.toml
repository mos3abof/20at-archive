subject = "الجنس الناعم"
author = "فرحات"
posted = "2006-06-11"
text = "مرجبا يا أصدقاء<br />الجنس الناعم نعمة من عند ربنا خلقها لكي نتنعم بها .<br />المرأة عبارة عن سلعة في أيدينا نلهوه بها كما نشاء سلعة رخيصة جدأيعني بنلعب فها ونلحمس على صدرها وندخش أصبعنا في بخشها حتى يجي ضهرنا ونرتاح فيه أحلى من كدة قلولي أرجوكم ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113904/http://www.20at.com/article2.php?sid=318"

