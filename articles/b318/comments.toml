posted = "2006-07-10"
text = "الجنس الناعم نعمه بحب مايتوقعه الاخرون بلا عذاب على من لايقدرهالانها مسئوليه يصعب حملها على بعض أرباب البيوت لانهم قديتركوها وتصبح عبئ عليه وعار ولاأنكر انهم نعمه ايضن لانهمهم الذين يريحوالرجل في الكثير من المهام والمصائب لوقدرالله وكماقال الله تعالى (وجعلنا من انفسكم أزواجن تسكنواليهن )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113904/http://www.20at.com/article2.php?sid=318"

