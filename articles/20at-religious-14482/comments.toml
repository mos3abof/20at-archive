text = "صراحةً أرى أن الموضوع كله هو عبارة عن سوء إدارة ليس إلا<br />وأرى من وجهة نظرى أن يكون وقت الراحة فى العمل والمخصص لتناول الوجبات ,, أن يتضمن وقت الصلاة ,, وأن يكون الوقت كاف للصلاة والوضوء وتناول الوجبات ,,, بحيث يعاقب الغير ملتزم بهذا الأمر أو بمواعيد الراحة<br />وأرى أيضاً أنه يجب أن يطبق نظام هيئة الأمر بالمعروف والنهى عن المنكر القائم بالسعودية الأن حتى يلتزم الجميع بأداء الصلاة بالمساجد ,, وأن المتحكم فى طول أو قصر الصلاة يكون هو إمام المسجد وليس المأمومين<br />أما التطويل فى الصلاة = موظف كسلان فأنا أستغرب جداً هذا العنوان<br />لأن أغلب ظنى أن الكثير منا يتكاسل عن الصلاة أصلاً على الرغم من أنها شىء مهم جداً ويجب أن يأخذ حقه كالعمل تماماً ,,, بل وهى الأساس الذى ينظم لنا حيانا طوال اليوم<br />وشكراً لكم ,, وأسف على الإطالة"
