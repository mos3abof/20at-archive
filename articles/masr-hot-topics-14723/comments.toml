author = "الحالات المعلنة"
posted = "2010-01-03"
text = "مش ملاحظ ان الحالات المعلنة معظمها فى القاهرة واسكندرية - انما بقية المحافظات محدش بيسأل فى ميتين اهلها<br />يعنى الناس بتصاب بالمرض او تشفى او تموت ومحدش دارى<br />اعتقد ان المرض متفشى بدرجة كبيرة ولكن ستر اللة بيشفى الناس بعلاج نوبات البرد والزكام العادية - مثل المضادات الحيوية وادوية السعال وتخفيض الحرارة وربنا الشافى"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112161942/http://www.20at.com:80/masr/hot-topics/14723--h1n1-.html"

