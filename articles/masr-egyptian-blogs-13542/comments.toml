text = "لما يبقى مجتمع عايش على هامش الحياة بتشوف المناظر دى<br />لو الاخ دة كان عندة وردية ليل وطالع من وردية الليل مهدود الحيل وبيدور على ساعتين يعرف ينامهم لم يكن يصنع تلك الهيافات<br />انما مخة فاضى بيشتغل اى حاجة هامشية وبيزوغ من الشغل وبيسلى نفسة<br />لو كنا شعب بتاع انتاج وعمل فعلى وحقيقى وناس فى صالات المصانع بتنتج اى حاجة وتتعب كانوا هيبقوا جادين اكتر<br />انما انت شايف حتى الزبالة بتاعتنا جايبين شركات خواجات تشيل الزبالة من الشوارعطواعتبار ا من قلم الرصاص لسجادة الصلاة لفانوس رمضان انتاج صينى<br />يبقى عايز اية"
