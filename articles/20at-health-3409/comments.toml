text = "بغض النظر العنوان من الديسك ولا من المحرر انما الموضوع القى الضوء على كارثة الصراحة .. ايران التى نتهمها بالديكتاتورية و الاستبداد والحكم البائد يطلع نجادى محترم كده لدرجة انى يخصص وقت كل فترة عشان يتكلم مع الناس طيب احنا فين والامور بتاعنا فين ولا مشغول بجوازة جيمى"
