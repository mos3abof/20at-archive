[[comments]]
order = 17
subject = ""
author = "نهى مصرية"
posted = "2007-06-11"
text = "مش حقولك اخ عشان بجد اسمك مؤذى جدا (مع اعتذارى طبعا لأن دى حريتك الشخصية فى اختيار اسمك اذا كان كونيك او شمبانيا)!!<br />انا معاك قلبا و قالبا ان كون حد يترشح امام الريس و يكسب دى من عاشر المستحيلات ..<br />لكن بص حواليك كده على مين اللى فى مصر؟! مفيش غير الاخوان اللى انا بجد بكرههم عمى.. و كرهى ليهم ده مش من فراغ ولا حبا فى الريس لأ , كرهى ده لأنى مرة تناقش معايا واحد منهم فى الجامعة.. و اتفرجت برضه على المظاهرات بتاعتهم لما كنت لسا بدرس.. و حسيتهم فعلا انهم اشخاص بلا مبدأ و لا حتى فكر ممكن يقنعك..<br />يعنى مره عملوا مظاهرة و هيصه و قوموا الطلبة, و ده كان عشان يلا نحارب اسرائيل و ناخد بتار فلسطين.. طبعا كلامهم جميل.. بس لو جيت فكرت, طب طالما هما محروقين اوى كده مسافروش يحاربوا ليه؟ و لو قلتلى حكومتك مش حتسمح.. حقولك ماهو فى الف طريق يروحوا بيه (و طرق ملتوية) و هما مش حيغلبوا!!<br />دا غير طبعا خد عندك التكسير اللى فى الجامعة و تعطيل الدراسة و كل الكلام ده..<br />و فى الآخر يدخلك واحد المحاضرة و ده طبعا قبل ما الدكتور يدخل و ماسك مصحف فى ايديه و يقرالك شويه سور عن ان الجهاد ضرورى و يقولك معاد المظاهرة الجاية امتى!!<br />و بقيت اللى فى الصورة و مشهورين و ممكن يرشحوا نفسهم يا اما حرامية يا اما محترمين و من القرف اللى بيدور حواليهم فى العالم و جوه مصر مش عايزين يدخلوا فى الليلة دى يا اما ناس خايفة لتروح ورا الشمس لو فكرت ترشح نفسها.<br />و طبعا كل اللى انا بقوله ده.. ميبررش ولا يقلل من الاخطاء و الغباء اللى بتعملوا الحكومة, لأنى برضه زى ما انا رافضه فكر الاخوان فأنا برضه رافضه فكر الحزب الوطنى!!"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105211422/http://20at.com/20at/health/3409.html"

