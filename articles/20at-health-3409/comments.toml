author = "abo ammar"
posted = "2008-03-26"
text = "ايام عبد الناصر كان فيه زوار ليل دلوقت بيجو بالنهار وضرب وتعذيب وإهانة وكله عيني عينك واللي مش عاجبه يتحرق اي انجازات بتاعت سيادة الريس خراب البيوت وحضرتك هي فين الصناعة الوطنية اللي ها نشجعها حكومتنا الموقرة شغالة لنفسها لأفرادها بس ومش يهمها الشعب اصلا مين الشعب ده المهم الوزرا ياكلو ويعيشوا والشعب ده يتحرق مش مهم كل شئ في مصر بيغلى الا البني ءادم المصري بقى رخيص في مصر وبرة مصر اللي هايجي بعد مبارك ها يلاقي ايه اصلا عشان ينهبه هو خلى حاجة في البلد هو واولاده خلصو على كل حاجة ولسه كمان على الاقل على ايام عبد الناصر كان لينا كرامة لكن دلوقت المصري ملوش اي كرامة والدليل لسه اهو السفينة الامريكية تموت واحد مصري على ارض مصرية والحكومة لا حياة لمن تنادي مش بعيد تقدم اعتذار لامريكا وتقولي بتحبي الريس حضرته خلى حياتنا كلها عذاب وذل ومهانة وكوارث والقادم اسوأ"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105211422/http://20at.com/20at/health/3409.html"

[[comments]]
order = 28
subject = ""
author = "عرائي"
posted = "2008-05-30"
text = "اييييه يا ناس هي الحكومه ما واراهاش حاجه غير بس تنفز طلباتكو متحلو بئه اللاه ،متدبرو حاكو يا خوانا الحكومه مش فاضيه هي مشغولة باللغف ( سرقة اموال الشعب) متحمدو ربكو انكو بتتنفسو الهوا وتشربو من ماية النيل متسيبو المسؤلين في حالهم اهي كم سنه ونموت ولا مش كده ! وكما قال الرسول الكريم محمد صلى الله عليه وسلم ( الكيس من دان نفسه وعمل لما بعد الموت) ، ماكو كده مهتمين للحياه وهملتم الموت ؟! انا اسألكو بربكم كم واحد فيكو صلى صلاة الصبح؟؟؟؟ ها؟ متصلحو حالكو عشان ربنا يبص علينا ياناس كفاية بئا ، يا مضيعي حق الله ، حاسبو انفسكم قبل ان تحاسبو."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105211422/http://20at.com/20at/health/3409.html"

