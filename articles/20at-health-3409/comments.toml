[[comments]]
order = 12
subject = ""
author = "نهى مصرية"
posted = "2007-06-07"
text = "انا على فكرة بحب الريس.. و يمكن كمان لو مشى حزعل..<br />و انا متأكدة ان لو كل واحد فيكوا فكر, الراجل ده لو مشى يا ترى حيبقى حالنا احسن؟<br />ليه مش بتفتكروا اليابان؟ هل بعد هيروشيما بقت اليابان دلوقتى بسبب رئيسها؟<br />مشكلتنا اننا بنجعجع مع بعضينا و بس, لكن نفكر نشتغل او حتى نشغل عقلنا.. لا ازاى .. نشتم فى الحكومة احسن و اوفر.<br />الرئيس الجديد اللى حييجى حيخترعلكوا شغل؟ ولا حيديكوا فلوس و انتوا قاعدين فى بيتكو؟<br />انا حديكوا مثال.. استهلاك المواطنين للسلع هنا مثال حى على الغباء و التخلف مع ان اليابان ساعة هيروشيما مكانش فيها غير نوع واحد من الاقلام (يابانى) و لترشيد الاستهلاك كانوا بيغيروا الانبوبة بس و يفضل هيكل القلم معاهم لحد ما يتلف.<br />مثال كمان.. بص كده على اى يابانى فى بلدك .. اراهنك انه راكب نوع التيوتا فقططططط عشان يابانية, بيشجع صناعة بلده الذكى و عشان كده بقت احسن عربيات فى العالم.<br />فى الوقت اللى احنا بندور فيه على اى ماركة غير المصرى حتى فى اللبس..<br />العيب فينا يا ساده"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105211422/http://20at.com/20at/health/3409.html"

