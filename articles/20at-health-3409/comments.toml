text = "احنا يا عم بيبو شعب أصيل مولود بالإنتماء بتاعه لا مستنين رئيس ولا غيره عشان يزرعه فينا دي أكيد ثقه من الريس في شعبه متناهيه عارف وواثق اننا فراعنه لو قابلتنا أي مشكله إحنا كافليين بحلها وأكيد أكيد مش هنحتاج مساعده ياعم احنا .. ايه … قول فراعنه .ما علينا أما بخصوص الناس التانيه ياعم ملناش دعوي بحد هيا يعني إقتصرت الفجوه بينا وبينهم علي دا بس ونسيت جمعيه المحافظه علي حقوق الحيوان الغربي وإهدار دم الإنسان العربي وغيره وغيره الفجوه كبيره قوي (فبلاش تفتح عنين الشعب ) وسلام"
