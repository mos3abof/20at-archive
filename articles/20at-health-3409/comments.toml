text = "افكارك ولقطاتك دايما هى سبب لفت النظر اليك .. انتا عارف انا مش بعاكسك !! بس ديه الحقيقة لدرجة انى مش بقرا او اعلق على اى موضوع ينزل الا موضوعاتك .. رغم انى بختلف معاه فكريا تماما \" مش مهم تعرف انا مين \" بس واضح انك تمتلك امكانيات متعددة يعنى مش مجرد حد عمال يشتم فى الريس والتوريث فى الدستور .. لا انتا غندك ما شاء مهارات متعددة لانك حد موهوب بجد ..و انا شايفة انك تدوس فى الموضوعات السوفت ديه شوية هنا لانك بتعرف تمزج بين الجد واللعب فى اختيار الموضوع بشكل جيد و بتستخدام اليات حلوة لتنفيذه . يعنى معلومات و شغل فى موضوع خفيف معادلة صعبة فعلا !! بس انتا عملتها ! ومستنيه ردك"
