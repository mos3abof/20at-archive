subject = ""
author = "نهى مصرية"
posted = "2007-06-09"
text = "انا مش مع مراته ولا ابنه ولا خالته حتى..<br />و الظاهر انك مفهمتش قصدى..<br />بس انا خايفة نقع تحت المثل اللى بيقول (يا ناكر خيرى, شوف زمنى من زمن غيرى)..<br />و على فكرة انا فى سلبيات كتيرة مضيقانى, بس برضه الراجل ده عمل كتيييييير..<br />و ابسط حاجة افتكر جمال عبد الناصر ماهو كان حبيب الملايين, بس جاب مصر الارض.. و ايامه كان فى زوار الليل و تعذيب و قرف و سجون بس الفرق دلوقتى انك تقدر تقول رأيك حتى لو مش بيتنفز لكن ايام عبد الناصر اللى كان يقول تلت التلاتة كام, كانوا اهله بينسوه.<br />اسأل نفسك بقى, ليه ايام عبد الناصر كان فى الحاجات دى مع ان الشعب كان بيموت فى تراب رجليه و لما قال اتنحى بعد ما جاب الوكسة .. الشعب قام على حيلة و قاله و النبى لأ.<br />و ياريت تفهم كلامى صح المرة دى..<br />و بالمناسبة انا ضد التوريث.."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105211422/http://20at.com/20at/health/3409.html"

