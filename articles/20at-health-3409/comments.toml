text = "\" الموقع يتيح الفرصة حتى للأطفال ليدلو بدلوهم في الموقع، وإن لم يستطيعوا التعبير بكلماتهم فعن طريق الرسومات الصغيرة، والتي يعرضها الموقع بأسماء هؤلاء الأطفال بما يعزز انتمائهم لإسرائيل و يقوى عاطفتهم تجاهها \" ديه كارثة بجد يعنى الفيد باك عندهم عالى للدرجة ديه .. واحنا لسه فى ناس مننا متعرفش ان الملك مات لانها لسه حاسه انه عايش"
