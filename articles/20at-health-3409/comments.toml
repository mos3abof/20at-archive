text = "بص ياحاجة نهي اذا كنت مش عارفة اللي هايجي بعد الريس هيعمل ايه هوه مش هيعمل فينا اكتر من المعمول واذا كنت مش شايفة حد ينفع مكانه غير ابنه او مراته (زوجته يعني ) ده يبقي عيب عليه مش حاجة تتحسب له وللا انا غلطان يا اخونا انا بتكلم علي رئيس جمهورية كمبوزيا العظمي وابن رئيس جمهورية كمبوزيا العظمي ومراة(زوجته يعني ) رئيس جمهورية كمبوزيا العظمي اما عندنا االريس و مراته (زوجته )و ولاده كويسين"
