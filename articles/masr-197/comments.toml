[[comments]]
order = 9
subject = "اسكندرية المحروسة"
author = "ريم"
posted = "2006-08-11"
text = "**(( رائعة احمد فؤاد نجم)) اسكندرية المحروسة * إسكندرية المحروسة الصيادين و سمك موسى منين ماتمشي تصادف ناس شيلاه يا مرسي يابو العباس ناس من الصعايدة و ناس بحري و القلب مفتوح عالبحري دايب في سحر بنات بحري و الحب تحت الشموسة الله عليكي يا إسكندرية مالبحر رايحة مالبحر جاية لما الصباية عالصهبجية جمعتي فرعون على موسى ** في إسكندرية يابو إسكندر بدع الضواحي والبندر فيها الحواري بالمساكين و فيها جنة راس التين و فيها فوق الشط زغابة و فيها عند الرمل ديابة و الابتسامة الخلابة أنيابها في الناس مغروزة ** الظهر سمكة بلطية و العصر ناعمة و لعبية و اليل عريسك يا عروسة ===================== و هكذا و هكذا الدنيا غابة و منتزه عصفور جناحه ريشة فضة و ريشة نور و عشه عود من التمر حنة وعود بخور و عوده ناحل م الضنا بين الطيور ممنوع يغني غنوته إلا إذا و هكذا و هكذا الدنيا غابة و منتزه ** و الصقر طايح في الفضا زي القضا باسط جناحه ع المساكن و الفضا كل الطيور بتبصله بعين الرضا رقص الغوازي للملوك يا حبذا و هكذا و هكذا الدنيا غابة و منتزه ** ناس قبلنا قالوا كلام يالا العجب عالأصل دور حتى في أمور النسب مافيش جريمة بترتكب من غير سبب و لافيش وليد بيتفطم على الأذى"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105204955/http://masr.20at.com:80/article.php?sid=197&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "زرتها مره و من بعدها"
author = "حمد"
posted = "2006-09-13"
text = "عفوا للمداخله اخواني معاكم حمد من الامارات(ابوظبي)....... بصراحه زرتها اول مره كانت سنه 2005 في الصيف و من بعدها كل اربع اشهر ازورها بمعدل 4 مرات في السنه ...... حسب ظروفي في العمل<br />و اللي ناقصنها السناتر بس....<br />و بلنسبه للجو ما عليه كلام (زي الفل)<br />و تحياتي لكم اخواني و السموحه على المداخله...... و كلمه حق كل مره ازورها احس بفرق .....و شكرا"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105204955/http://masr.20at.com:80/article.php?sid=197&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
