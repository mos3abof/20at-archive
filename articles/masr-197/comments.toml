author = "barbie"
posted = "2006-05-29"
text = "ولو ....مهما صار أسكندريه بتوقع وتقوم من تاني<br />دي أسكندريه يا جدعان<br />رمل وبحر وشمس<br />حضارة وتاريخ وفن<br />أسكندريه موش بنت النهاردة ولا امبارح....أسكندريه دي قرون وملايين السنين<br />ياما طغاة حاولو يهدوها ويحرقوها<br />لكن بردو ولو...<br />واقروا الفاتحة لابو العباس<br />ايووووووووووة يا ناس"
