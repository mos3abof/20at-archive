[[comments]]
order = 0
subject = "اسكندراتى"
author = "ياء"
posted = "2006-04-18"
text = "صلاه النبى مدح النبى ملحه فى عينك يلى ما تصلىىىىىىىىىىىىى<br />اقرو الفاتحه لبو العباس يا اسكندريه يا اجدع ناس<br />افروا الفاتحه لسيدى ياقوت ولى يعادينا يطق يموت<br />وقروا الفاتحه لسيدى مرجان ولى يعادينا يجيلو جنان<br />وقروا الفاتحه لبو الدردار ولى يعادينا<br />يولع نار<br />دى زفه اسكندرانى<br />وصلى صلى صلى<br />اسكندريه هى قلعه قيتباى وقلعه ابو قير التى لا يعرفها معظم الناس<br />اسكندريه هى ميدان الجوامع<br />احلى ما فى الاسكندريه هما<br />الناس<br />الناس الناس واحلام الناس<br />ويا اسكندريه بحرك عجايب يريت ينلنى من الحب جانب<br />yehia2784@hotmail.com"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213602/http://masr.20at.com:80/article.php?sid=197&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "حلو قوى يامنمون"
author = "حد قريبك"
posted = "2006-04-19"
text = "برافو يامنمون ماتنسيش ان منمون دى بتاعتى على العموم انا عارفة قد ايه انت بتحبى اسكندرية ونفسك تسافرى وانا اللى معطلاكى لكن فرجه قريب ان شاء الله ربنا يوفقك وماتنسيش ميعاد بكره الساعة 12"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213602/http://masr.20at.com:80/article.php?sid=197&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "اسكندرية كمان وكمان"
author = "واحدة اسكندرانية"
posted = "2006-04-19"
text = "محدش يقدر يوصف اسكندرية الا ولادها اللي كبروا على هواها وبحرها<br />اللي عايز يوف اسكندرية بجد يشوفها في الشتاء<br />ولو قلت انك شفت اسكندرية كلها تبقى بتضحك على نفسك كفاية بس اني اقولك ان اسكندرية اللي فوق البحر متجي حاجة جنب اسكندرية اللي تحت البحر<br />وبجد من اجمل الاماكن اللي شوفتها في اسكندرية هي طابية عرابي في ابو قير"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213602/http://masr.20at.com:80/article.php?sid=197&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

