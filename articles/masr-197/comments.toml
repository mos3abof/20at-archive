subject = "اسكندريه حدوته مصريه"
author = "نيفين"
posted = "2006-04-27"
text = "عروسه البحر<br />اسكندريه هى منظر البحر اللى عمرك ما تشوف زيه الا من فوق قلعه قايتباى<br />اسكندريه كافيهات الرمل بليل<br />اسكندريه المنتزه و الشمس بتغيب<br />اسكندريه ضحكه مصريه عايزين يطفوها مش عارفه ليه اسكندريه ماريه"
