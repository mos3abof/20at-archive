posted = "2008-03-25"
text = "لا واللة راجل بيفهم وعندة خق لو لغى القرش الاسعار هترفع وبالتالى الناس هتترفع وهو عندة حق وخايف على الناس ومبيحبش يثقل عليهم لأ راجل محترم ربنا يخلية لأمة علشان هو بيوقف مع الغلابا ومش عايز يلغى القرش<br />ربنا يخليك لينا ولمصر يا يوسف يا طيب يا أمير يا مفرح ملايين المصريين وبيدعوا عليك لأ قصدى بيدعولة وعجبى وعجبى وعجبى وعجبى"
