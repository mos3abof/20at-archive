text = "الناس دى فاكرة الناس مابتفهمش ولا إيه قرش إيه إللى لو اتلغى الأسعار هترتفع ما هى الأسعار مولعة اهه والبياع نفسه ساعات كتير مش بيرجع الربع جنين والخمسين قرش ولو لفت انتباهه يقولك هو دا باقى وبعد كده الحكومة تقول لأ احنا مش هنلغى القرش عشان الأسعار كلام غريب"
