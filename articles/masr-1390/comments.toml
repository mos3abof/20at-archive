[[comments]]
order = 0
subject = "الله يرحمه"
author = "انسان"
posted = "2007-01-03"
text = "الله يرحمه ويعوضنا بحد عظيم يكون مؤمن بقضيته بجد ومخلص ليها لانه كان شخص فريد وقليلين قوى اللى كده فى الدنيا دى الله يرحمه<br />ويصبرنا على اللى احنا فيه وشيفينه من مدعين وما اكثرهم"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115328/http://masr.20at.com:80/article.php?sid=1390"

[[comments]]
order = 1
subject = "روضه"
author = "ياااااااة"
posted = "2007-01-03"
text = "معرفش ليه حسيت ان زمنه نفس زمنا<br />نفس ازمة الطلاب<br />نفس الاعتصامات<br />ولكن لم تفرق بواسطه عصا الامريكان الغليظه ؛وانما بعصى امن الدوله البلدى<br />فهل ما نحن فيه تمهيد ل73؟"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115328/http://masr.20at.com:80/article.php?sid=1390"
