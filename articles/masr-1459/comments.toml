text = "انا كل يوم بحب الاخوان درجه اكره الحزب الوطنى درجتبن وممكن تلاته دا لو مكنش اربعه<br />يا جماعه الحزب دا فاسد لدرجه لا تصدق ومش فاسد بس لا دا فاشل<br />كل دى مشاكل حدثت بسببالحزب الوطنى وفى عهد الرئيس مباؤك لا اطال الله حكمه<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/<br />اوعى تيجى المدونه دلوقتى الوقت مش مناسب خالص خالص خالص"
