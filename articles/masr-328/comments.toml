text = "مفيش عصافير دلوقت خلاص الناس بقت بتشتغل فى الشارع على الملا من3 سنين الورق فى الجامعه كان بتوزع فى هدوء عشان العصافير متخدش بالها داوقت خلاص معظم الناس بطلت خوف وهما كمان بقو فى الشارع كده تشوفه تعرف انه امن بطل يستخبا<br />الصراع الان على المكشوف<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com<br />يوم الخميس قلى فات على الطريق الصحراوى الظابط كان بيوقف العربيه وبقول قلى رايح يحضر مع القضاه ينزل يروح احسن كده على العلن اه والله"
