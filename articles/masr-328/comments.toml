[[comments]]
order = 1
subject = "العصفور"
author = "د. حسن حنفي"
posted = "2006-05-15"
text = "إن التاريخ يعيد نفسه، أزمة انتخابات نادي الضباط عام 1952 والتي عجَّلت بثورة يوليو، وأزمة نادي القضاة في الإسكندرية عام 2006، بعد ما يزيد على نصف قرن. وهناك حنين إلى الستينيات والعودة إلى ذروة انتصارات الثورة المصرية في مواجهة الاستعمار والصهيونية والبناء الاشتراكي لمصر.<br />تلاعب الملك في انتخابات نادي الضباط ورغبته في انتخاب أحد أنصاره، حسين سري عامر، ضد مرشح الضباط، اللواء محمد نجيب. وهو ما يحدث الآن في الصراع بين مجلس القضاء الأعلى المعين من وزير العدل ممثل الدولة، ونادي القضاة الحر المنتخب من مجموع الهيئة القضائية في مصر، والصراع على قانون السلطة القضائية التي يريدها نادي القضاة، والإشراف على الانتخابات الرئاسية والبرلمانية، وإثبات التزوير في حالة وقوعه، وتصدي نواب محاكم النقض ورئيس نادي القضاة لذلك، الخضيري ومكي وبسطاويسي. أزمة نادي الضباط الأولى في القاهرة، وحصار نادي القضاة الثانية في الإسكندرية، التي أيد معسكرها وأيدت جامعتها الثورة بعد اندلاعها.<br />والظروف في الحالتين متشابهة. في كلتا الحالتين برز \"الإخوان\" والشيوعيون، وفشل الحياة الحزبية بين أحزاب القصر، أحزاب الأقلية، وحزب \"الوفد\"، حزب الأغلبية في الحالة الأولى، وفشل أحزاب الأقلية المعارضة وفشل الحزب الحاكم في استقطاب مجموع الشعب، ووجود حزب المعارضة الرئيسي، \"الإخوان\"، في الشارع والبرلمان، والصحافة دون أي سند شرعي يحميه بعد حل الجماعة منذ 1954، في الحالة الثانية.<br />كان هناك الملك والحاشية وأحزاب الأقلية. والكل يمثل سلطة القصر. واليوم هناك الحزب الحاكم ولجنة السياسات للتدخل في الحياة السياسية وفرض الوزراء والنواب والمحافظين ومديري الأمن ورؤساء الجامعات والهيئات العامة. وكان الإنجليز القطب الثان<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903021226/http://masr.20at.com:80/article.php?sid=328"

