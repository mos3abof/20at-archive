[[comments]]
order = 7
subject = "مفيش حاجة اسمها عصفورة !!"
author = "مهند"
posted = "2006-05-15"
text = "على فكرة.. ممكن نقول بالفم المليان ان مفيش حاجة اسمها عصفورة، وممكن نثبت ده بالدليل، لأن فيه حالتين:<br />الحالة الأولى: إن العصفور هيكون ذكى وهينقل الأخبار للى مشغله فى سرية تامة ومحدش هيعرفه، وبالتالى محدش هيعرف ان فلان ده عصفورة، وبالتالى يبقى كأنه ملوش وجود.<br />الحالة التانية: إن العصفور هيطلع غبى وهيتفقس، وفى الحالة ده كل الناس هتعرف انه عصفور، ومحدش هيتكلم قدامه عن حاجة، وغالبا هيخرج من العصفورية، يعنى كإنه برضه مش موجود.<br />وفى كلا الحالتين.. مفيش عصفور، بمزاجه أو غصب عنه!!"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903021226/http://masr.20at.com:80/article.php?sid=328"

