[[comments]]
order = 13
subject = "عصافير الحزب"
author = "أبو أسامة"
posted = "2006-05-23"
text = "على فكرة فى عصافير جديدة نزلت السوق خلوا بالكم منها كويس وهى عصافير الحزب الوثنىودول مجموعة من المنتفعين من الحزب تلقيهم فىكل قريةاو مدينةودول بقى شغلهم جديدقوى مشبيوصلوا الأخبار للحزب دول بينشروا الأخبار الى عاوز ينشرها الحزب ودول اخطرلأنهم بيضحكوا على الناس فى القرى وشوفتها فى انتخابات الرئاسةكانوا بيقولوا للناس ان حسنى بيه حميهم من الحرب<br />وانه هيعين الشباب وان ايمن نور عميل لأمريكاوقدروا انهم يكسبوا بكدة أصوات الغلابةوانصاف المتعلمين وبعد كدة ظهرت عليهم نعمة الأنتخابات اشى محمول واشى عربيات وهام جراااا يا رب يخدهم هما والحزب فى ساعة واحدة"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903021226/http://masr.20at.com:80/article.php?sid=328"

[[comments]]
order = 14
subject = "آآآآآآآآآآآة ياوطنى"
author = "مصرية"
posted = "2006-06-04"
text = "ابو اسامه والله كلامك كله صحيح 100%..نفس الكلام سمعته من بواب عمارتنا وهومن الشرقية ..تتصور ان عملاءه من الحزب الوطنى ..يقولواللناس هناك ..بالحرف الواحد...( ان مبارك حايش عنكم بلاوى ولولاه اسرائيل حتدخل بلدكم ويقتلوا فيكم ويطردوكم..وكويس انكم لاقيين مكان يأويكم ..انشالله تاكلم لقمه واحده فى اليوم او حتى متلاقوهاش أحمدوا ربنا انكم لسه عايشين..وكل الناس اللى مرشحه نفسها معاه خونه عاوزين يشيلوه عشان هو بيحب المصريين )..تتصور نفس الكلام سمعته صديقه لى من الشغاله وهى من المنوفيه..وطبعا عملنا المستحيل عشان نصحح أفكارهم..والآن هم ينتقدوا أبناء بلدهم...اللى يبقى مش لاقى لاشغل ولاحتى ياكل ويقول ربنا يخلى الريس هوه اللى آوينا...شفت الكارثه..يضللوا الغلابه الجهله..بنشر عملائهم فى كل الكفور والنجوع ... آآآآآآآآآآآ ياوطنى طالتك يد الفساد ..وكثر فى سمائك نباح الكلاب لالالالالالالالالالالالالالالا للقرصان وسلالته وعصابته..ونعم..نعم..نعم..لثورة الجيش والشعب على الظلم والفساد..اللهم اجعله يوما قريبا..آآآآآآآآآآآآآآمين"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903021226/http://masr.20at.com:80/article.php?sid=328"

[[comments]]
order = 15
subject = "حسبنا الله ونعم الوكيل"
author = "آدم"
posted = "2006-08-24"
text = "والله الواحد مش عارف يقول في الناس دي .. نفسي اقراالافكار عشان اعرف هم بيعملوا كده ليه ... يعني لو الموضوع مغري ماديا ولا اجتماعيا ولا اي حاجة .. بالعكس الناس اللي بتعرفهم دايما بيكون في شيء من الاحتقار للنفوس الضعيفة دي ... اكيد الناس مش زي ففيلم احمد زكي في البرئ لما كان معتقد انه بيحارب اعداء الله والوطن اللي ممكن يقتل في سبيل حاجة زي كده ...<br />طب ده راجل مزنوق في القرية مش لاقي حتي العيش فضلا عن الجرنال ولا الراديو واول جزمة لبسها كانت البيادة وله حق انه ميعرفش اي حاجة في اي حاجة ... لكن الناس دي مش حاسه باللي اناس عايشاه .. كمان بيحسابونا علي راينا اللي بنفضفض بيه بينا وبين بعض ...<br />يعني من الاخر المواطن المصري لازم يتحول لسلك كهربا .. مش في انه رفيع ومزنوق جوه غلافه لا لانه ماشي جوه الحيطة لان في الزمن ده حتي اللي جنب الحيط بيداس ..<br />بجد لا حول ولا قوة الا بالله<br />سلام"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903021226/http://masr.20at.com:80/article.php?sid=328"
