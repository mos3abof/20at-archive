subject = "ما اسخفهم"
author = "واحدة وخلاص"
posted = "2006-05-16"
text = "ما اسخف هؤلاء الاشخاص<br />بجد نفسي اعرف هو ده بيبقى مرض عندهم<br />ولا هما بيعملوا كدة ليه<br />وازاي الناس اللي بيشغلوهم في العصفورية بيعرفوا ان دول ينفعوا يبقوا عصافير<br />انا شخصيا جربت عصافير الكلية<br />وعصافير الشغل (في الصيف اللي فات)<br />وما اسخفهم من اشخاص<br />والمصيبة ان في ناس منهم اتفقسوا<br />بس لسه مصريين يشتغلوا نفس الشغلانة بمنتهى البرود"
