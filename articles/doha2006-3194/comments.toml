[[comments]]
order = 1
subject = "نجاح قطر"
text = "أرسل هذا التعليق بواسطة : عربي مسلم<br />نجاح قطر يدل على حكومه متميزة او امير متميز جعل من شعبة اعلا دخل بلعالم وقوة اقتصاد قطر وطور البنية التحتية ونشكر صاحب السمو الامير الشيخ حمد بن خليفة ال ثاني امير قطر وصاحب السمو ولي العهد الشيخ تميم بن حمد ال ثاني والفارس المغوار سمو الشيخ محمد بن حمد ال ثاني اللذي صعد بخيلة الاصيل العربي رغم الامطار اللتي جعلت الخيل يزلق ولكن الامير محمد فارس اب عن جد من مئات السنين وحفيد الامراء صعد الى الشعلة ونشكرهم على اظهار الحضارة العربية القديمة وعلاماء العرب ودور العرب في العلوم والحضارة في بداية عهد الاسلام في دولة الخلافة وللعلم 3 مليار مشاهد شاهدو الافتتاح في قنوات التلفزيون يعني نصف سكان العالم رأو الافتتاح"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205072749/http://doha2006.20at.com:80/article.php?sid=3194"

