[[comments]]
order = 3
subject = "عايز الحفل!"
text = "أرسل هذا التعليق بواسطة : مصري بيحلم بالولايات العربية المتحدة<br />أروجكم عايز أنزل الحفل لاني مشتااااااق أوي عشان أشوفه !<br />شرفتينا يا قطر ورفعتي رسنا لفوووووووووق!<br />بس من غير زعل يا أخواني : الإسلام شورى مش توريث للحكم."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205072749/http://doha2006.20at.com:80/article.php?sid=3194"

[[comments]]
order = 4
subject = "هو ده الافتتاح ولا بلاش"
text = "أرسل هذا التعليق بواسطة : محمد المصري<br />يا جماعه هو ده اللي يتقال عليه افتتاح بطوله بحق مش زي الافتتاح اللي بيتعمل عندنا ..... قال وعايزيين نستضيف كأس العالم وزعلنا علي الصفر"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205072749/http://doha2006.20at.com:80/article.php?sid=3194"

[[comments]]
order = 5
subject = "برافو قطر"
text = "أرسل هذا التعليق بواسطة : مصريه<br />شكرا قطر على المجهود الرائع<br />الى الامام دائما<br />تمنياتنا ليكى وكل الدول العربيه والاسلاميه بحصد الميداليات"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205072749/http://doha2006.20at.com:80/article.php?sid=3194"

[[comments]]
order = 6
subject = "شرفتونا"
text = "أرسل هذا التعليق بواسطة : محمد مال الله<br />قطر شرفت العرب و الخليج بالإفتتاح الرائع و التنظيم المتقن. أنت أهلهاو ألف مبروك لقطر"
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210080055/http://doha2006.20at.com:80/article.php?sid=3194"

