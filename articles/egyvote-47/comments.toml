[[comments]]
order = 1
subject = "عندما نظلم الفكرة بمثل هذه الصور والعناوين"
author = "محمد السيد"
posted = "2005-11-30"
text = "نا متعودتش أعلق علي الصور و العناوين والحاجات دي ... وعلي طول كنت بأدخل في الموضوع ....<br />لكن هنا .... نقطة نظام !! ...<br />أولا : العنوان سئ جدا ... وخصوصا لما تجمع القضاء مع الحمام ...<br />الفكرة جيدة جدا ... لكنها تسمح باكثر من عنوان اخر غير كده ....<br />ثانيا : الصورة .... أيضا سيئة جدا ... سواء في بنات بس أو شباب بيدخلوا الموقع ....<br />لكن أنا كده المفروض أتخيلها أيه ؟؟ قاضي في الحمام ؟؟<br />أعتقد ملهاش لازمة .... وياريت لو تتغير أو تتشال خالص وصدقوني مش حتقلل من قيمة الموضوع أو جمال الفكرة ...<br />اللي حرام نظلمها وبدل ما الناس تعلق عليها ... تفضل تكتب عن الصورة والعنوان<br />مع تحياتي ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013043500/http://egyvote.20at.com:80/article.php?sid=47"

[[comments]]
order = 2
subject = "صورة سيئة"
author = "محمد عبد اللطيف"
posted = "2005-12-24"
text = "ع احترامي لكم ولموقعكم الجميل ، إلا أنني أرى أن هذه الصورة لا تليق بقيمة منصب القضاء ومدى ما نكنه للقضاة والقضاء من توقير واحترام.<br />فأعتقد أن هذه الصورة تسئ إساءة بالغة للقضاة جميعًا دون تمييز بين موال للحكومة أو معارض لها، فأرجو أن تزيلوها من الموقع أو تغيروها ولن يقلل ذلك من أهمية الموضوع في شيء."
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013043500/http://egyvote.20at.com:80/article.php?sid=47"

