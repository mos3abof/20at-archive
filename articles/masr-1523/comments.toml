[[comments]]
order = 31
subject = "الى الاخ بتاع سوزان مبارك"
author = "يا اخي انت هاجمت سوزان وهاجمت مبارك"
posted = "2007-02-05"
text = "بالنسبة لسوزان فانا شاهدت مواقع مسيحية مصرية على الانترنت يكرهونها ويبغضونها وهذا دليل على انها مسلمة.<br />بالنسبة لحسني مبارك والله الراجل بيدافع عن المادة الثانية من الدستور والتي تنص على ان الدين الرسمي للدولة هو الاسلام والشريعة الاسلامية هي مصدر للتشريع ويدافع عنها دفاع مرير ضد عصابات اقباط المهجر ولو كان كما تقول لكان لغى هذه المادة ووفر على نفسه الكثير"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210222729/http://masr.20at.com:80/article.php?sid=1523"

