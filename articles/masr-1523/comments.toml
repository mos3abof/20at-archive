[[comments]]
order = 34
subject = "عضو بحزب الغد"
author = "المصمم المعمارى سووم"
posted = "2007-02-07"
text = "ياعم ناس من عند الرسول اية هو ايمن نور كافر لو سمحت وضح قصدك وبعدين معنى خدوا سرور وهاتو نور تقصد اسجنو الفاسد هانى سرور واخرجو البرى ايمن نور المواطن المظلوم الذى يقتل فالسجن لانة قال لا ولم يرضى بالذل وتحدى الصعاب<br />ودةوفى خلال ثلاثة اشهر اكتف النظام فجأة ان توكيلات الحزب (والتى تمت مراجعتها اربع مرات ) التى قدما ايمن نور مزورة !! لقد بدى للجميع ان النظام ينتقم من ايمن لانة نجح ...لانة صنع فارقا ....لانة اوجد حزبا حقيقيا ...ثم بدأ مسلسل الاضطهاد تم رفع الحصانة عنة فى اسرع جلسة لسحب الثقة من نائب فى البرلمان المصرى ...وفى اثناء الجلسة (اى قبل صدور اقرار ) تم تفتيش مكتبة وبيتة الامر الذى يعنى بطلان جميع الاجرائات القانونية (وهوالامر التى اشارت الية مذكرة نيابة النقض...والتى خلصت الى بطلان جميع اجرائات القضية ) ...بعد قليل واثناء خروج ايمن من المجلس تم اللقاء القبض علية داخل اعتاب مجلس الشعب !! وتم القبض علية بعنف لا مبرر لة وتم تكبيلة وسحبة عنوة مع انة لم يقاوم التوقيف ولكن القوة استمرت فى استخدام العنف معة متعمدة اهانة امام المجلس<br />كلام قريتة اقرو يمكن تفهمو"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210222729/http://masr.20at.com:80/article.php?sid=1523"

[[comments]]
order = 35
subject = "نظام جبان"
author = "نظام حكم مبارك لا يختلف عن نظام الإحتلال اليهودى لفلسطين ولا نظام الإحتلال الأمريكى للعراق فهو نظام مبنى على الخطف والسرقة والإعتقالات والتهم الجاهزة التحضير الملفقة للإنتقام من كل معارض له"
posted = "2007-02-07"
text = "ولكن بعد تخلى أمريكا عنه بدأ فى مزيد من التنازل لها بكل شيء من أجل إعادة الثقة به فهو مؤيد مطيع لإبعد درجات العمالة والشعب كله يعلم أن نظام حكم مبارك باطل لإنه مبنى على التزوير وأن وجود مبارك فى الحكم لم يحظى فى يوم من الأيام بأى شعبية فلكى يستطيع توريث الحكم للطاغية والدكتاتور الأهبل الصغير فلابد أن يقضى على كل من له شعبية وتأييد فلذلك هو يتلذذ فيما يفعله فى أيمن نور أو طلعت السادات أو الأخوان المسلمين ولكنه التلذذ الذى يشعر به من يحكم عليه بالإعدام حينما يرتشف آخر قطرة ماء فى حياته<br />وغداً لناظره قريب"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210222729/http://masr.20at.com:80/article.php?sid=1523"

