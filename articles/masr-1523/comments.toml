author = "الحرية للشعب إللى أعتقله مبارك القذر المزور القاتل الحرية للزعيم أيمن نور ومهما عملوا كل يوم ها يطلع نور للشعب علشان يحرر مصر من فساد مبارك وعيلته ويرجع لمصر كرامتها إللى أهانها مبارك بوجوده فيها من غير شرعية"
posted = "2007-02-01"
text = "نعم لحرية أيمن نور ولا لوجود مبارك فى الحكم"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050146/http://masr.20at.com:80/article.php?sid=1523"

[[comments]]
order = 22
subject = "و لكنه انسان"
author = "نيفين نيفى نوفا"
posted = "2007-02-01"
text = "يا جماعه ايه المنطق اللى بتتكلمو بيه دا<br />الموضوع دلوقتى مش ايمن نور اللى رشح نفسه ف انتخابا الئاسه<br />و لا هو نزر اللى ممكن نتفق او نختلف معاه<br />و لا هو نور اللى بتدور علامات الاستفهام حوالين علاقته بامريكا<br />و لا هو نور حتى المواطن العادى<br />دلوقتى احنا اد<br />ام نور الانسان اللى من ابسط حقوقه انه ينال الرعايه الطبيه<br />اللى بيحصل ده ظلم و حرام بكل المقاييس الانسانيه و غير الانسانيه"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050146/http://masr.20at.com:80/article.php?sid=1523"

[[comments]]
order = 23
subject = "و لكنه انسان"
author = "نيفين نيفى نوفا"
posted = "2007-02-01"
text = "دلوقتى احنا ادام نور اللى من ابسط حقوقه انه ينال الرعايه الطبيه<br />اللى بيحصل دا ظلم و حرام بكل المقاييس الانسانيه و غير الانسانيه<br />ايه يعنى<br />احنا ف جوانتانامو و لا ايه<br />لما يسكون الراجل معرض للموت و يتساب كدا يبقى ايه الرساله اللى بيوجهها النظام للشعب<br />و اضحه اوى<br />حسبنا الله و نعم الوكيل"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050146/http://masr.20at.com:80/article.php?sid=1523"

[[comments]]
order = 24
subject = "إنها القمة"
author = "رغم أن أيمن نور فى قمة ضعفه لكنة يشكل كل القوة لنظام مفزوع من المعارضة ومن أى صوت يقول له لا للفساد ولا للحكم الغير شرعى ولا للتوريث وهذا ما يجعله يتلذذ بتعذيب الدكتور أيمن نور معتقداً أنه بذلك سيقضى على صوت الشعب الذى يرفض التوريث ولكن الشعب كله بعد أن أصابة الأكتئاب والإشمئزاز مما يحدث له لتوريث الحكم لن يحتاج بعد ذلك سوى رصاصة ليفرغها فى جمال مبارك ليرتاح من فساده ودكتاتوريته ونهبه وهذا ما ينوى الشعب فعله"
posted = "2007-02-02"
text = "الصبر يا دكتور أيمن نور نحن ندعوا الله أن يخفف عنك ويشفيك ويجعله فى ميزان حسناتك اللهم أمين<br />أتمنى أن افجر نفسى فى وجه مبارك وإبنه وعائلته عسى أن أريح مصر من فسادهم ونهبهم وأعيد للمصرى كرامته التى أهدروها"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050146/http://masr.20at.com:80/article.php?sid=1523"

[[comments]]
order = 25
subject = "الى محبي ايمن نور (الوسخ)"
author = "ايمن نور دا راجل . والجريدة بتاعته طلعت ملحق اسمه اسوأ عشر شخصيات اسلامية منهم السيدة عائشة ام المؤمنين وسيدنا عثمان بن عفان"
posted = "2007-02-03"
text = "وهو في السجن مراته راحت حضرت مؤتمر مع امرأة فاجرة شيوعية ملحده كافرة اسمها وفاء سلطان بتساعد اقباط المهجر الخونة وتلاقوها دايما في موقع اسمه (الكلاب متحدون) متأسف اقصد الاقباط متحدون<br />وبعدين ايمن نور دا دخل السجن لانه مزور زور توكيلات علشان خاطر يأسس الحزب والقضية ثابته عليه وفيه ملف قضية ثابت فيه كل هذه ..ايمن نور دا راجل.."
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210222729/http://masr.20at.com:80/article.php?sid=1523"

[[comments]]
order = 26
subject = "واضح من الكلام"
author = "واضح من كلام إللى عماله تشتم الدكتور أيمن نور إنه من طرف الدشم أو باقى أسمائها ولكن ما سأقوله إن الدكتورأيمن نور لو كان مزور فتزويره أقل ضرراً من تزوير مبارك إللى زور 26 سنة إرادة الشعب وإللى قاعد من غير شرعية فى الحكم وطبعاً كلنا عارفين جه الحكم إزاى دى لوحدها محتاجة إعدام يعنى لو ها نحاكم المزورين يبقى لازم أول واحد يكون فى المعتقل مبارك ولو ها نحاكم الحرامية يبقى مبارك وعيلته أول إللى ها يتحاكموا على إللى عملوه فى مصر من نهب وسرقة وطبعاً الصغير والكبير فى مصر عارف هما بيعملوا كده ليه فى الدكتور أيمن نور ولو ها نتكلم على إن مراته إجتمعت مع سيدة فلن تكون هذه السيدة أسوأ من سوزان ثابت \"مبارك\" اليهودية الأصل إللى نهبت كل جمعيات حماية المرأة والطفل وإللى عمالة تسافر على حساب الشعب بأى حجج وهمية علشان تجمع تبرعات لدعم حملة ترشيح أبنها المتخلف عقليا وإللى الشعب كله بيكرهه"
posted = "2007-02-03"
text = "الحرية للدكتور أيمن نور وللشعب من حكم الطاغية الدكتاتور الفاسد مبارك والمعتقل لمبارك وعائلته"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210222729/http://masr.20at.com:80/article.php?sid=1523"

[[comments]]
order = 27
subject = "الللة يسامحك"
author = "المصمم المعمارى سووم"
posted = "2007-02-03"
text = "طيب انا مش حقلك مبارك بيقعد مع مين وموافق على اية وانة بيطبع مع اليهود وكل اليلة دى المفروض تكون عارفها<br />اولا ملحق الصحابة دة رايى كاتب وقال كلام حقيقى كل العلماء اثبتتة بس الغلطة انة اتقال فالجرايد فعيب الكلام دة يتقال واراهنك انك تكون قارى الملحق والا كنت استوعبت<br />وبعدين رئيسر التحرير اترفض علشان الغلطة دى<br />وكمان ايمن نور كان فالسجن<br />وبالنسبة للتزوير علشان يعمل حزب فانا مش حارد عليك علشان انت فالبطاطا واحد علشان تعمل حزب مش محتاج غير 50 توكيل يزور الفين توكيل لية وتوكيل زوجتة وابوة كمان وبعدين يعنى الصباح يعمل حزب ويقدر يجيب ناس وايمن نور افضل برلمانى لمدة عشر سنين والقانى فى انتختابات الرئايسة والخ ميقدرش يجيب خمسين عضو"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210222729/http://masr.20at.com:80/article.php?sid=1523"

[[comments]]
order = 28
subject = "شوز ان مباركر\"ثابت\""
author = "سوزان مبارك أمها مسيحية من أصل يهودى. و بالرغم من أن والد سوزان المصرى كان مسلما الا أن سوزان تكرة دين الاسلام كرها فى العرب و المسلمين عامة و فى أبوها خاصة الذى كان قاسيا و بخيلا و غليظ القلب و معتاد الاعتداء بالضرب المبرح على أمها. فى ذات الوقت تأثرت سوزان بالمسيحية أكثر بفضل والدتها و أخوالها الذين غرسوا فى سوزان و شقيقها تونى (منير) الديانة المسيحية. لم تصلى سوزان أو تصوم فى أى مرحلة من مراحل حياتها كما انها لم تقرأ القرأن أو ترتدى أبدا حلى أو سلاسل برقبتها تحمل أيات من القرأن كما تفعل كل النساء المسلمات. وقد شوهدت سوزان فى بعض مراحلها العمرية تؤدى صلاة مسيحية. و بالرغم من ذلك فان الأقباط لم يعانوا من اضطهاد و ظلم و تفرقة و تمييز على مر تاريخهم كما يعانون تحت حكم مبارك الأسود الذى لا يميز بين أى دين و ملة فى القمع و القهر و الظلم."
posted = "2007-02-04"
text = "و بالرغم أن مبارك نفسة لا يصوم أو يصلى بل هو يأتى بكل فاحشة بما فى ذلك الزنا و الخمر و القتل و التعذيب و الاغتصاب و السرقة و النصب و الكذب و الفتن و التجسس و التلصص و تلفيق التهم و التشهير بالمعارضين و الخصوم و حبس الحريات بدون حق و الظلم و القهر و تزوير ارادة الشعب و تضليلة و أكل أموال الفقراء و اليتامى و المساكين الا انة مع ذلك يحرص على أن تلتقط لة الصور و هو يصلى أو و هو بصحبة رجال الدين على الأقل من باب الدعاية. أما سوزان فهى تحرص على الدعاية لذاتها فى كل المجالات الا تهتم بالدعاية لنفسها و لو بالكذب مثل زوجها بأنها مسلمة حريصة على دينها تمارس شعائرة و تخاف اللة. كما لم تشاهد سوزان أبدا و هى تصلى و لم تلتقط لها صور و هى تزور أو تفتتح جامع أو تقف الى جوار أى من رجال الدين بل عرف عنها كرهها الشديد لهم و لايزال موضوع عمرو خالد و غيرة خير م<br />اقرأ بقية التعليق .."
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210222729/http://masr.20at.com:80/article.php?sid=1523"

