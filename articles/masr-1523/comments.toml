[[comments]]
order = 16
subject = "تعليق الدواخلى رائع ورغم كده برضوا تتعدوا عليه بالالفاظ .. !"
author = "أحمد بكير"
posted = "2007-01-31"
text = "انا مش عارف شريف حرق دمكوا للدرجة ديه يعنى الراجل علق على الموضوع تعليق تمام يبجى واحد اهبل فارغ ياخد تعليق شريف على موضوع شريف ويعمله بالطريقه المسفه ديه \"يمكن حن لاصله فى المطبخ \" وياريت على كده لا .. ييجى واحد اهبل يصدق ان اللى كتب هو شريف ويقوله انتا بتقول نفس الكلام تانى مع ان شريف تعليقه عنوانه \" اذا اعتقلوا نور فكلنا نور \" وشريف ما بيقرائ الموضوع مرتين واستحاله يعلق مرتين ... وبعدين انا هاعيدلكوا نفس الكلام مش كل من علق بقى صحفى محترم !!<br />بس هى نفوس قذره .. بس بجد الف شكر فى الاول حد اهبل علق بالنيايه عنه والمره ديه واحد سرق اسمهم .. بجد بجد زى ماقالكم شهرتوه بتخلفكم<br />بس فى حاجة مهمة جدا عاوز اطلبها منك ياشريف بالله عليكى حتى لو عرفت موضوع التعليقات وضايقتك اوعى ترجع عن مبادئك وتبطل تعليق لانى بكل بساطة بحب قوى اعرف مواطن الضعف والقوه من تحليله لاى موضوع .. فبجد اوعى تبطل تعلق"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050146/http://masr.20at.com:80/article.php?sid=1523"

