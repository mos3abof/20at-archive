[[comments]]
order = 6
subject = "اذا اعتقل نور فكلنا نور !!!"
author = "شريف الدواخلى"
posted = "2007-01-31"
text = "كتير قالوا ان ايمن نور بتاع امريكا<br />كتير ظنوا ان ايمن نور عميل للخارج<br />كتير شككوا فى وطنيه ايمن نور<br />وبعدين ... لو كانت امريكا فعلاُ تدعم ايمن نور فلماذا تخلت عنه الان ...<br />لان امريكا لا تعرف سوى مصلحتها فترك الحبل على الغارب لتنظر أيا من الاطراف المتصارعه يحقق مصالحها ولو كانت حتى مع الاخوان المسلمين ... مش مع حد ليبرالى او اشتراكى حتى .. والنظام المصرى المصون يلعب بورقه داخليه تتمثل فى فزاعة الاسلاميين وورقة خارجية تتمثل فى اطلاق يد مصر عن التدخل فى اى مشكلة تتعلق باى دولة عربية \" وسيبكوا من الكلام عن الدور الريادى لمصر والهبل ده \"<br />لكن نحن من سيدفع الثمن ! لابد ان نحارب بكل ما اتوتينا من قوه كى ننتزع حرياتنا وكرامتنا مما انتهكوها منذ ما يربو عن ربع قرن .. لا بد لنا ان نكون اقوياء لا نرضخ .. لا نستكين واذكر فى هذا الصدد<br />تصريحات كنت قد اخذتها من جميلة اسماعيل فى موضوع \"عيسى كلاكيت تانى مره \" لما سألتها ايمن ايه اخبارك انفجرت فى البكاء وقالتى ايمن بيموت ياشريف . هما خلاص عاقبوه جنائى سيبوه بقى يعمل عمليه القلب .. دول لو كانوا بيعاملو كافر مكنوش عملوا معاه كده !!<br />بس انا مش هاضعف وهافضل لاخر نفس ادافع عن جوزى لانى على يقين تام انه برئ ؟<br />كلمات بسيطة لكن معانيها قوية جدا"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050146/http://masr.20at.com:80/article.php?sid=1523"

