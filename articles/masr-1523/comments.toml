subject = "موضوع جيد جدا"
author = "شريف الدواخلي"
posted = "2007-01-31"
text = "الموضوع بجد عجبنى جدا يا استاذ الهندي ورحته حلوه جدا لدرجة انى قريته أكتر من مره \" تصور ديه \" وده لان الموضوع مطبوخ كويس ودا باين فيه من اول كلمة لنهاية الموضوع وناخد حاجة حاجة<br />1- توافر عنصر الطبخه فى تغطيه الحدث<br />2- المعالجة المطبخية لكل جوانب الازمة<br />3- التزام المهلبية بشكل رائع فى الموضوع<br />4- الاسلوب كان دسم جدا وفيه مرقة لحمه كتير<br />وعلى فكره يا الهندي انتا من احسن الطباخين اللي بيطبخوا فى الموقع من وجهه نظرى المطبخية"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050146/http://masr.20at.com:80/article.php?sid=1523"

