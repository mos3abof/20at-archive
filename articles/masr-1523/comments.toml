[[comments]]
order = 9
subject = "مافيش مكان لفاسد"
author = "خذوا رأس الأفعى مبارك وعائلته وحزبة القذر الواطى خذو كل فاسد منافق نريد التطهير من دنس مبارك النجس الذى نهب مصر العميل اللى باع البلد لليهود والأمريكان"
posted = "2007-01-31"
text = "بعد كده الشعب هو إللى ها يختار قيادته الشريفة إللى يعرف قيمة مصر وينهض بشعبها مش عايزين عماله نهبوا مصر مافيش مكان لمدمن شاذ عايز يورث الحكم وفاكر نفسه فى محل بقالة ها يورث المحل دى بلد وفيها كفاءات كرمهم الله وشرفهم بإسم مصر لكن واحد موظف بنك نهب وسرق ورصيدة بالمليارات وعايز يورث هى مصر دى كرسى ولا دولاب ولا بقية عفش القصور اللى هو عايش فيها عالة على الشعب ومن دمه<br />عايزين تغيير عايزين الإطاحة بمبارك وعيلته كلها كفاية فساد كفاية فساد كفاية فساد لا لمبارك وعيلته كلها نعم لكل إنسان شريف مصرى خالص مش أصلة يهودى عميل."
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050146/http://masr.20at.com:80/article.php?sid=1523"

