text = "انا يا اخونا سائق تكسى ومع الحريه التى نتمتع بها والحمد لمبارك وعسكر مبارك ..ارسل له هذا الموضوع<br />يا سياده الرئيس شعبك يهان من رجال الشرطه انا مواطن عادى وليس لى زنب فى اى شى الا اننى اسعى لقوت اولاادى وانا رجل كبير 48 سنه فهل يعقل انا اضرب فى وسط الميدان بدون سبب ياريس انجدنى ورجع لى كرمتى من رجالك ..والله لم ارتكب خطى ابدا ولم اكسر اشارة ولم اطعم اولاادى<br />الحقنى يا ريس انا واحد من رعياك<br />ضربونى رجالك امام اعين المارة فى جسر السويس<br />ياسياده الرئيس انا اطالبك باسترجاع كرمتى<br />شكرا"
