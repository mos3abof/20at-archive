text = "جماعة الاخوان المسلمين ليها محاسنها وليها مساوئها<br />مساوئها هي الخروج على النظام<br />واريد ان اضرب مثلا<br />الاخوان المسلمين خرجوا على النظام ايام جمال عبدالناصر وحصل صدام قوي بينهم وصراع ثم بعد ذلك استولت اسرائيل على سيناء<br />يبقى كان لزومه ايه شغل الخوارج<br />خلينا اهل سنه وجماعة احسن<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ<br />ولا نرى الخروج على أئمتنا وولاة أمرنا، وإن جاروا. ولا ندعو عليهم، ولا ننزع يدا من طاعتهم، ونرى طاعتهم من طاعة الله -عز وجل- فريضة ما لم يأمروا بمعصية، وندعوا لهم بالصلاح والمعافاة.<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ"
