subject = "شكرا جزيلا"
author = "دكتورة مسلمة"
posted = "2006-06-04"
text = "مع الشكر الجزيل للآنسة سارة بس أعتقد أن الجدول ده مينفعش غير للطلبة لحد ثانوي لكن الكليات لا سواء عملي أونظري لكن الموضوع جميل جدا و شكرا جدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114504/http://www.20at.com/article2.php?sid=149"

