[[comments]]
order = 1
subject = "واضح جداً"
author = "إسماعين طالع فوق"
posted = "2006-05-31"
text = "واضح جداً إن الآنسه اللي بتتكلم معندهاش أي فكرة عن نظام التعليم في مصر و بالأخص في كليتي المخروبه (كلية الهلوسة).<br />فاكرين حفظ الشعر و النثر بتاع الثانوية العامه (زلطة الملتقى و العيال التايهه) كل ده مايجيش ربع في المليون من الحفظ اللي في الكلية المخروبه.<br />و بأقولها للمره الألف : يا إخواننا مفيش عملي في الكليات العملي إفهموا بقى.<br />أنا أعرف ناس بتحفظ المسائل و بتنجح بتقدير و كل اللي أعرفهم من اللي بيفهموا أذكى واحد فيهم لازم يكون سقط قبل كده.<br />حاجه تفقع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114504/http://www.20at.com/article2.php?sid=149"

[[comments]]
