author = "و فى مصر كمان"
posted = "2007-06-19"
text = "ما احنا عارفين ان مصر فيها متسولين و فى كل الدول العربية و مفيش مشكلة اننا نتكلم على الظاهرة دى علشان نصحصح المسؤولين و يحاولوا يعالجوها و يا سيدي متخدش كل حاجة بالشكل ده الحمد لله اننا بنلاقى حد يتكلم عن مشاكلنا بدل ما نفضل نخبى فيها لغاية لما يتحول المجتمع العربي كله لشحاتين لدى الامريكان و الغرب"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106001600/http://20at.com/20at/ana-saudi/6350.html"

