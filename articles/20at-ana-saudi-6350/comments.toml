[[comments]]
order = 5
subject = ""
author = "عيسى يوسف ابوسعيد"
posted = "2007-06-21"
text = "لاشك ان ظاهرة التسول في وطننا العربي اصبحت في ازدياد حيث ان المتسولين اصبحوا يتزايدون يوما بعد يوم خصوصا في هذه الايام فلا يكاد يمر يوم لا نشاهد فيه المتسولين وهم يطلبون العون والمساعدة فاغلبنا وهو متجه الى عمله او ذاهب لقضاء متطلباته يشاهد هؤلاء المتسولين بوجوه حزينة او اعضاء ناقصة تمد اياديها طالبة بعض المال ولكن هل هؤلاء المتسولون بحاجة للمال ام هم اناس احترفوا وتدربوا واصبح همهم الوحيد هو جمع المال بلا تعب او مشقة؟ ولكن هناك عددا من المتسولين قد اتخذوا من التسول مهنة لكسب المال دون تعب فاصبح شغلهم الشاغل هو التسول ولكن الطامة هو ان تشاهد ابا يدعو ابناءه الى التسول وهم في عمر الزهور بوجوه بريئة لا حول لها ولا قوة قد اجبرها الزمان على فعل تلك العادة فمن المحزن هو ان تشاهد عائلة بأكملها وهي متفرقة على الاشارات او المساجد او اماكن التسول المعروفة لديهم وبالتأكيد ان تلك الظاهرة موجودة في اكثر البلدان بلا استثناء وقلما نجد بلدا يخلو من هذه الظاهرة خلوا تاما اخيرا يجب على المتسولين ان يدركوا ان هناك جمعيات خيرية خصصت من اجلهم ولمساعدتهم فبدلا من التسول فالاولى ان يذهبوا لتلك الجمعيات التي بكل تأكيد لن تقصر معهم فهي موجودة من اجل راحتهم والعمل على قضاء احتياجاتهم."
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106001600/http://20at.com/20at/ana-saudi/6350.html"
