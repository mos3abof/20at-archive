author = "عاشق عشرينات"
posted = "2007-06-20"
text = "تاريخياً كانت ظاهرة التسول مقرونة بالفقر و الاحتياج، و كانت حكرا على فئة معينة بذاتها من فقراء ومساكين وجدوا أنفسهم على هامش الحياة لا معيل ومعين.. أما اليوم فلقد اتسعت الدائرة كثيرا ويرجع ذلك لغياب الضبط والقانون الواضح للحماية الاجتماعية، ولتفاقم حدة البطالة بموجة التسريح التي شملت آلآف المناصب..<br />عالم التسول مليىء بالأسرار و الألغاز المحيرة، ويضم أشكالا مختلفة من المتسولين..<br />ياساتر"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106001600/http://20at.com/20at/ana-saudi/6350.html"

