text = "انا شايفه يا جماعه ان حلم راح او حلم اتحقق او حلم استبدلناه بحلم تانى كل ده بيدور حوالين حكمه انجليزيه بحبها اوى و اتعلمت منها اوى اوى بتقول<br />there's a will,there's a way<br />الاراده مفتاح كل حلم سواء اتحقق او لا او استبدلناه"
