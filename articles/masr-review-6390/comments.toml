posted = "2007-06-21"
text = "لم و لن اتنازل عن حلمى و لكنى لا حيلة لى فى عدم تحقيقه و لهذا اعتبر ان الوقت الذى يمر على و لم احقق فيه حلمى بعد هو وقت يرسله لى ربى كى استعد و \" اشحن البطارية \" حتى اذا ما جاء وقت تحقيق الحلم اكون فى ابهى صوره .<br />احلم ليس فقط بالعمل فى الصحافة و لكن احلم بالتعلم من خبرات من تجولوا فى شوارعها و ذاقوا حلاوة و مرارة ممارستها<br />و ان شاء الله لن يموت حلمى . اتمنى ذلك"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718110118/http://www.20at.com:80/masr/review/6390-2009-06-09-12-10-12.html"

