subject = ""
author = "معلقة دائما.."
posted = "2007-06-21"
text = "السلام عليكم احلامنا ..قص ولزق تعبير مع احترامي لمن يؤمنون به لا اوافقه فلماذا ما دمت تحلم بشي لماذا تقصه وتلزق غيره لماذا لا تحاول تحقيق الحلم حتى وان كان صعب الا انه ليس مستحيل وليس معنى كلامي انني لم اقم بقص شيء من أحلامي ولصق غيرها ولكن احيانا تقوم الظروف بدور المقص بدون ارادتي اذا فالحياة دائما تقوم بهذا الدور فلماذا ناتي ايضا، ونقصها وان قمنا نحن والحياة بالقص فماذا تبقى لنا من أحلامنا كما اننا احيانا نفص أحلامنا لأنها تتغير بتغير أفكارنا فلا تستسلموا لمقص الحياة ولا تلعبوا انتم بهذا الدور، اتمنى للجميع تحقيق أحلامه وما يتمناه(ان أقسى مقص هو مقص الحياة)…"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718110118/http://www.20at.com:80/masr/review/6390-2009-06-09-12-10-12.html"

