text = "قص ولزق دى الكلمة الشيك لما تصنعه بنا حياتنا وكلك احلامنا فواحدى ترحكنا لامام وتطالبنا بما لا نستطيع وواقع ينظر لك ببرود وابتسامة متشفية ، انا برقع الآن حياتى واحلامى، لم اعد اعرف للوقع ملامح ونسيت احلامى"
