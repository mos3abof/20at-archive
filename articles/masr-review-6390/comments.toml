text = "السلام عليكم لاتفعل مثلي و تستسلم للواقع الذي يفرض علينا دون ارادتنا وتمسك باحلامك حتى ولوكانت الدنيا تنظر اليك ببرود وبكل قساوة واتمنى ان لاينسى احد احلامه لأنه أمر قاسي أن تنسى ما تحلم به لمجرد واقع بارد فلا تقسى انت والظروف على احلامك ألا يكفيك الحياة…معلقة دائمة"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718110118/http://www.20at.com:80/masr/review/6390-2009-06-09-12-10-12.html"

