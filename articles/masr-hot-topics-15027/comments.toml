author = "حسام عوام"
posted = "2010-01-29"
text = "مش الحل إنك تقاطع الفيس مع إحترامى الشديد للخطوة دى<br />بس معتقدش ان دى اداة ضغط لأنك هترجع تفتحة تانى ومع الوقت هيضعف السلاح دة<br />وكمان حكاية المقاطعه دى وانا اسف انى بقولها مكانتش مقاطعه لأن أغلب الناس كانت بتدخل تشوف المقاطعه ع الفيس ومين دخل ومين قاطع<br />وهل تفتكر اسرائيل قاطعت علشان يمسحو الجروبات المعادية ليهم …؟<br />إحنا ما بنتعلمش من عدونا دايما متفوق وكلمتة بتتسمع عكسنا<br />, علشان بيفكر صح وإحنا مش أقل من اى أمة بالعكس انت مع الإسلام \" ما حاج هذا الدين أحداً إلا غلبة \"<br />فين الكلام دة…؟"
archived = "2010-02-28"
capture_url = "https://web.archive.org/web/20100228145152/http://www.20at.com:80/masr/hot-topics/15027--2-.html"

