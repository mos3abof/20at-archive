text = "لا هو ده الحل ووالله بقى ده اختبار للمسلمين لو الخمس ايام منفعتش هنقاطعوا بإذن الله على طول وأصلا الفيس بوك ده من غير المسلمين ولا يسوى لأن المسلمين كتييييييييييير منهم داخل ومسجل فى الفيس بوك وأعتقد لما تحصل المقاطعة دي اكيد اكيد هيتراجعوا ولما قاطعناهم المرة اللى فاتت تراجعوا الى حد ما وعموما مش هنخسر حاجة واما بقى عن الناس اللى بيدخلوا يشوفوا الناس اللى قاطعت فالمفروض ميدخلوش لأى سبب من الأسباب"
archived = "2010-02-28"
