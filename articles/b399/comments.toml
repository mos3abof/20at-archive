posted = "2006-02-06"
text = "يا ريت يا جماعه اللي يكتب مقال ميفرضش رأيوا بالقوة و يصف المخالفين له بالجهله و الغافلين و يا ريت يكون المقال سرد فقط و للقاريء الحرية في تحديد الغث من السمين ( و الكوارع و الكلاوي كمان )<br />و اقترح انه يكون في تصويت على مستوى المقالات في الموقع لو مافيش مانع يعني"
