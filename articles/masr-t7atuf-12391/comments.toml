text = "قول يارب الله سبحانة وتعالى زكر مصر الحبيبة فى القران انشاء الله ربتا يحفظ البلد الجميلة علشان اهلة غلبان ياريت كلنا نتجاة الى الله ونصلى ونصوم ونقول يارب صدقنى انشاء الله ربنا يحفظنا من كل شر احنا شعب طيب يرضى اقل حاجة بس المهم نقول يارب والصلاة الصلاة تبعد الامراض عن المؤمنين<br />والله احنا لو نبقى مع ربنا كل شر يمشى من حيتنا"
