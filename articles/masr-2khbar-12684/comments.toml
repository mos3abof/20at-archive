text = "اجر احمد السقا ارتفع من 2 مليون الى 4 مليون<br />يا حلاوة وكل دا من جيب الشعب الاهبل اللي حيفضل طول عمره مفلس على طول<br />وغيره بيغتني على قفاه<br />ونخص بالذكر ممثلين السينما<br />اصحا يا شعب وفوق لنفسك وبطل هبل وعبط"
