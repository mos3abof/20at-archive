text = "مش بس الاشياء الماديه احيانا يبقا ليها ريحه وحشه ولاكن احيانا الكلام بيكون ليه ريحه وحشه ومنتنه ولكن مش عارف الريحه دى جتلك مينين ياترى من اصحابك النصارى الى مش عايزين مصر توصف بانها دوله اسلاميه ولا من ناس بتدفعلك فلوس عشان تقول الكلام ده ولا الريحه دى جايه من عقلك العفن واقتناعه بالعلمانيه والافكار المهلبيه"
