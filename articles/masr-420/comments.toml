[[comments]]
order = 1
subject = "قليل من البحث الجاد"
author = "قذائف الحق"
posted = "2006-06-01"
text = "السلام عليكم<br />عزيزي الكاتب<br />موضوعك يحتاج منك بعض البحث<br />أولا أحيلك إلى كتاب \"تدوين الدستور الاسلامي\" للاستاذ أبو الأعلى المودودي و هو محامي و عالم إسلامي كبير<br />و أحيلك أيضا لكتاب الخراج لأبو يوسف و هو تلميذ الامام الاكبر أبو حنيفة و الذي يوضح مبادئ الاقتصاد الاسلامي<br />و بعض كتابات الدكتور عبدالحميد الغزالي استاذ الاقتصاد في جامعة القاهرة<br />و أخيرا كتابات الشيخ عبد الوهاب خلاف استاذ الشريعة الاسلامية في جامعة القاهرة رحمه الله<br />أتمنى أن تقرأ هذة أو بعض هذه الكتابات قراءة محايدة قبل كتابة المقال القادم<br />و جزاك الله خيرا<br />أخوك قذائف الحق"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022329/http://masr.20at.com:80/article.php?sid=420"

[[comments]]
order = 2
subject = "هل هذا كلام"
author = "محمد"
posted = "2006-06-01"
text = "قرأت المقال وانا مستغرب اشد الاستغلااب من تلاعب الكاتب بالافاظ عندما قال انه بحث في القرأن فلم يجد لفظة شريعة لا مرتين وجه الاستغراب ان رسولنا الكريم يقول فيما معناها تركت فيكم ما ان تمسكتم به لم تضلوا بعدي ابدا كتاب الله وسنته<br />ومن المعلوم بالضرورة في اي مبدأ من مبادئ التشريع سواء كان اسلاميا او اي لون اخر من فسلفات التشريع ان يكون مصدر التشريع قواعد عامة تحدد مسار التشريع بحث ان تسن القوانين سواء التي جاء بها نصر صريح في الكتاب او السنة والتي اجتهد فيها العلماء ولم تخرج عن القواعد العامة التي جاء بها القرأن ودعونا نتفق ان المبادي تكون قواعد وهذا ما جاء به القرأن وزخرت به كتب الفقة الاسلامي منها على سبيل المثال ان الاصل في الاشياء الحلال ومنها قاعدة لا ضرر ولا ضرار ومنها قاعدة البيوع والربا من هذه القواعد تسن القوانين ايها الكاتب الكريم انظر للقواعد في كتب الفقة والتي استمدت من القرأن والسنة واجتهاء الامة عنا سوف تعرف جيدا ان الشريعة ليست كلمة غير واضحة انما هي قواعد تستمد منها القوانين التي تتيسر معاملاتنا سواء الاقتصادية او الاجتماعية او قل ما شئت حتي الرياضية فأننا نمتلك ثلااء واسع وسعة بمبادئ التشريع ومرونه تستطيع ان تتغلب على ما يواجه المجتمعات من تحديدات الحياه<br />وارجو ان كنت تريد الحقيقة فعلا ان تقرأ جيدا كتب الفقة الاسلامي في المعاملات وان كان مرادك شيئا اخر وفأنت وهذا الشئ سواء"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022329/http://masr.20at.com:80/article.php?sid=420"

[[comments]]
order = 3
subject = "مش عارف يعني ايه شريعه 000وماله نعرفهالك"
author = "الاستاذشيكو"
posted = "2006-06-03"
text = "ما معني ان يكون الانسان المسلم غير ملم بامور الشريعه التي هي اساس الحياة<br />يا اخي الاساس في مجايبنا الدنيا لن الواحد يعبد الله علي حرف<br />الدين هو الدستور بتاعنا<br />انا عايز واحد من الناس اللس عماله تقول ان الدين ده من زمان ومش مناسب للزمن الللي احنا فيه يطلعلي قضيه واحدة واحده بس يكون فيها اختلاف وااااااااسع بين الفقهاء الاسلاميين مش اللي بيقرا كلمين في الدين<br />المشكله يا سيدي الفاضل ان صوت الحق الان في هذا الزمن ضعيف ويتم الغلوشه عليه وانت عارف مين اللي بيعمل كده؟؟!!!!<br />لو سالت الاغلبيه من العلماء في الدين حاليا مثلا عن البنوك هاتلاقيها قضيه محسومه بس عشان المفتي و الشيخ الازعر اااااسف اقصد الازهر الشريف مش عارفين ايه الحلال وايه الحرام بيقولوا انه حلال وانهم تبع المؤسسه الرسميه حكومه يعني فهما اللي مخليين لهذا الراي قيمه<br />كل القضايا كده اكثريه عارفه الحق وتسمح بلاختلاف بس صوتها واطي واقليه رسميه بس صوتها عااااااالي<br />ولكي الله ياااااااااااامصرنا"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022329/http://masr.20at.com:80/article.php?sid=420"

[[comments]]
order = 4
subject = "اللهم اهدى قلبه"
author = "عبد الله"
posted = "2006-06-03"
text = "ما كنت اتصور ان يقول مسلم هذا الكلام تشكك فى صلاحيه حكم الله لكل زمان ومكان اعلم هداك الله ان الله الذى خلقك وخلق البشر<br />يعلم ما يصلحهم وما وصلت الدول الاسلاميه من ضعف تراه ظاهرا الا بسبب بعدنا عن الشريعه الاسلاميه وقال النبى صلى الله عليه وسلم (تركت فيكم ما ان تمسكتم به لن تضلوا بعدى ابدا كتاب الله وسنتى ) اتعرف ماهى الشريعه انها كتاب الله وسنه النبى محمد والشريعه ليست قاصره على اقامه الحدود مثل حد السرقه والزنى ولكن الشريعه معناها ان تكون الامه الاسلاميه تكون مستسلمه لامر الله تحرم ما حرمه وتحل ما احله"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022329/http://masr.20at.com:80/article.php?sid=420"

[[comments]]
order = 5
subject = "نعم؟؟؟ عمروإسماعيل ؟؟ إيه هو مفيش كتاب في العالم غيره ولا إيه؟"
author = "محمد السيد"
posted = "2006-06-03"
text = "في إيه يا عشرينات ؟؟؟<br />ماهو عمرو إسماعيل \"الكاتب ده\" معروفة توجهاته دايما ..وطول عمره وكل كتاباته بيهاجم الإسلام والمسلمين والشريعة وكل ما يمت للإسلام بصلة ...<br />واحد زي ده بأي منطق تنزلوا له مقال هنا ؟؟؟<br />أنا مش حأعلق علي المقال .... بس أي حد يفتج جوجل ويكتب اسم الكاتب ده ... حيشوف النتيجة إيه ؟؟<br />مفيش حاجة إلا وهاجم الإسلام فيها ... وأي حاجة ممكن تقول إن بالإسلام حيرجع عز المسلمين هو ضدها تماما ...<br />لدرجة إنك ممكن تشك في معرفته بأي شئ ... أو إنه بيفهم في اللي بيكتبه أساسا ...<br />علي فكرة ده مش ضيق بالآخر والله ... لكن أظن إن الموقع له رسالة ومبادئ وهدف ..<br />ده كمان عكس موقع إيلاف تماما .. بالرغم من بعض الكتاب الجيدين اللي بيكتبوا فيه .<br />لا للجهل ... لا الكذب ... لا التضليل<br />وبرضه<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022329/http://masr.20at.com:80/article.php?sid=420"

[[comments]]
order = 6
subject = "جاهل يجهل جهلا فهو جهول"
author = "د. ياسر نجم"
posted = "2006-06-03"
text = "بصرف النظر عن اسم الكاتب و مصدر المقال الشهير بعلمانيته..فالمقال يعبر عن جهل شديد ألم بصاحبه..فجعله يسىء استغلال ما أدركه من قشور الدين..ليدلى بدلوه فى الصياح العلمانى الذى يهب علينا بروائحه النتنة ما بين الحين و الآخر...<br />أولا: بصرف النظر عن لفظ:( شريعة) التى يدعى الكاتب أنها لم ترد فى القرآن بالمعنى المقصود...هناك قوانين الهية و نظم سنها المولى عز و جل لصلاح البشر على مستوى الأفراد و الجماعات تمثل سياجا لحفظ البشر..و اطارا لتعاملاتهم و معايير للصواب و الخطأ..و اوامر و نواهى تهدف الى استقامة الحياة فى الدنيا و سعادة الناس فى الآخرة..<br />هذه القوانين مصادرها هى القرآن و السنة و اجتهادات الفقهاء..<br />المعادلة بسيطة..انت مسلم..تؤمن بأن القرآن و السنة من عند الله..اذن تطبيق هذه القوانين جزء من عقيدتك...<br />أنت غير مسلم..لا تؤمن بان هذه القوانين من عند الله ..لا تعمل بها...<br />على الكاتب هنا أن يحدد موقفه..<br />و هى كل لا يتجزأ..اما عقيدة و قوانين اسلامية...<br />أو لا عقيدة..لا قوانين اسلامية...<br />بصرف النظر عن عقيدة الكاتب ...فالدستور يحدد فى مادته الثانية أن الاسلام هو دين الدولة..اذا مصر دولة اسلامية..بقية المعادلة عى تطبيق القوانين الاسلامية..و هذا الدستور تم الاستفتاء عليه فى سنة 1971 و وافق عليه الشعب المصرى..مسلموه و مسيحيوه..لا مجال للمناقشة هنا..<br />ثانيا: الكاتب بسلامته ببساطة ادعى أن الله قد جعل لكل أمة شريعة خاصة بها..و بالتالى كل شعب حر فى اختيار شريعته..هل هو جهل أو ادعاء للجهل ؟<br />المقصود يا سيدى الفاضل هو الأديان المختلفة..فشريعة المسلمين غير شريعة المسيحيين غير شريعة اليهود..هذا هو المقصود بعيدا عن الترهات و الأهواء و التخاريف..<br />ثالثا: ما يدعى الكاتب أنه محل خلاف بين الفق<br />اقرأ بقية التعليق .."
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022329/http://masr.20at.com:80/article.php?sid=420"

[[comments]]
order = 7
subject = "أوجه الاختلاف"
author = "أحمد هندي"
posted = "2006-06-03"
text = "رسالة للباشمهندس اللى كاتب الموضوع ده اولا عشان ما يكونش ليك حجة انك تستخدم التعليقات الصاروخية لكل الغيورين على الاسلام اللى ارسلوا تعليقات هنا ونصحوك بالرجوع الى كتب تدوين الشريعة الاسلامية انا قبل كل الكلام الكبير ده اللى احتمال انت متفهموش من كتب تدوين الشريعة احب اوضح لك نقطة<br />اولا يا استاذ اية هى الشريعة المستخدمة في الحكم واية الشريعة الخاصة بكل فرد فينا بصورة خاصة لعباداته ومعاملاته واية اللى فيه اختلاف لحد النهاردة واية اللى متفق عليه واسمه معلوم من الدين بالضرورة اى يشترك في علمه العام والخاص والعالم والجاهل والذكر والانثى والكبير والصغير<br />الشريعة الاسلامية اللى لازم تكون في القوانين بتاعتنا اللى هى مختصة بتنظيم شئون المعاملات بين الافراد وبعضهم وبين الافراد ومؤسسات الدولة وبين مؤسسات الدولة وبعضها-تمام كدة؟<br />الشريعة دي تتلخص في بعض الواجبات العامة زي وجوب مراعاة الحاكم لشعبه زي سيدنا عمر بن الخطاب كدة وكمان ان الشعب او الافراد يتعاملوا مع بعض باحترام وكمان مبادىء حقوق الانسان وكل دي حاجات متفق عليها ومفيهاش اى خلاف فى الاسلام<br />وكمان بعد كدة الحدود الجنائية او العقوبات يعني للى يخالف النظام في الدولة الاسلامية وهى مثلا حد الزنا او السرقة او القتل ودي مفيش فيها اى اختلاف برضة على مستوى جميع الفقهاء حتى عند الشيعة يا راجل يا طيب<br />اما بأة الاختلافات بين الفقهاء فهي فى العبادات الشخصية البحتة يعني مثلا لو انت مأموم وبتصلى ورا امام - ده لو كنت مسلم وبتصلي - والامام بيقرا فهل انت تقرا واللا لا؟<br />السيدة عائشة قالت من لم يقرأ ام الكتاب -الفاتحة- فلا صلاة له ويوافقها في ذلك الامام البخاري بينما قال سيدنا سعيد بن المسيب - صحابي جليل - ان من قرأ والامام يقرأ ملىء فوه نار<br />اقرأ بقية التعليق .."
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022329/http://masr.20at.com:80/article.php?sid=420"

