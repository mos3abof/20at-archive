subject = "لا حول الله يارب"
author = "محمود"
posted = "2006-06-06"
text = "مساء الفل علي كل الرجالة اللي علقوا واللي شتموا منهم بالذات طيب بالذمة اللي عاملين نفسهم محموقين اوي كده وفاهمين كل حاجة حد من كلف نفسه ان هو يسرد كلام الرجل ويرد عليه بلاش كده الاخ اللي كتب عن ابو الاعلي المودودي كلف نفسه يقولنا اختصار للكتاب بتاعه يا جماع بلاش تعصب من فضلكم ناقشوا بموضوعية شوية وافتكروا ان ربنا سبجانه وتعالي كان بيقول \" وجادلهم بالتي هي احسن \"<br />ليا عودة عشان ابويا عايز الدوا"
