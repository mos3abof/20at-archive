text = "{أَفَحُكْمَ الْجَاهِلِيَّةِ يَبْغُونَ وَمَنْ أَحْسَنُ مِنَ اللّهِ حُكْمًا لِّقَوْمٍ يُوقِنُونَ (50)} المائدة<br />عندما يأتي يوم الدين ويحاسبك رب لعالمين قل له هذا الكلام الذي ذكرته"
