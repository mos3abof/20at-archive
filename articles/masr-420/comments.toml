subject = "مثال عملي"
author = "واحد معدي"
posted = "2006-06-13"
text = "ما هو لو كان ممكن أن تحدد أحكام الشريعة بصورة غير مبهمة كانت جماعة الأخوان المسلمين أعلنت ما هو دستورهم منذ أن أنشأت يعني فوق نص قرن ، بدل ما العملية عايمة و كل شوية يطلع المرشد ليفتي بفتوى نابعة من الشريعة ثم يأتي مرشد بعده ليلغيها برده ، إلا اذا دا في الشريعة باردو و في الحالة دي تبقى الشريعة غير صالحة فعلا لو كل شوية يتغير الدستور لم يتغير الحاكم<br />و أخيرا لن أتعجب ان لم ينشر التعليق و ان نشر يبقى لسه في أمل في التغيير"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022329/http://masr.20at.com:80/article.php?sid=420"

[[comments]]
order = 13
subject = "أعوذ بالله أن أكون من الجاهلين"
author = "مصرية مسلمة"
posted = "2006-06-14"
text = "هل تؤمن بأن الله خالقك<br />ولماذا خلقك؟<br />خلقنا الله سبحانه لعبادته<br />\"وما خلقت الجن والإنس إالا ليعبدون\"<br />هل يعقل أن الله العظيم خلقنا لعبادته ولم يوضح لنا معالم الطريق وكيفية تيسير أمور دنيانا .... حاشا لله<br />خلقنا لعبادته ... أى أننا عبيد الله<br />نمتثل لكل أمر أمرنا به ونبتعد عن كل ما نهى الله عنه<br />من يصدق بالعلمانية كأنه يقول لنا أن الله سبحانه سبحانه المنزه عن كل نقص لا يفهم فى السياسة ولم يضع لنا الطريق وتركها لعبد من عباده ........؟<br />فالله سبحانه قبل خلق كل البشر يعلم بالغيب ويعلم أننا شعوبا مختلفة<br />أيعقل أن يترك عبيده لأهوائهم؟<br />أو لعبد من عبيده أن يسن قوانين فى الأرض<br />فإإذا كنت حقا مسلم كما تدعى<br />فالاسلام هو إستسلام وخضوع لارادة الله عز وجل<br />وكل أوامره ونواهيه<br />فعل سبيل المثال من شريعتنا الأسلامية<br />أن السارق تقطع يده<br />بالله عليك لو ان سارقا واحدا قطعت يده<br />هل سيكون هناك حرامى واحد فى البلد؟<br />ربما يكون الامر مخيفا عند تخيل ما يحدث من منظر قطع اليد ولكنه لن يتكرر كثيراوسوف يكون رادعا لكل من تسول له نفسه بعمل ذلك الفعل بالأضافة إالى أنه خضوع واستسلام لأوامر الله لأننا عبيده سبحانه ولسنا عبيد بشر إو أهواء أو أفكار إو معتقدات.<br />وليس من حق أحد أن يجعل الدين الإسلامى على كيفه يإخذ ما يشاء ويترك ما يشاء هو شريعة كاملة قبلت بها أم تركتها وبحثت عن شئ يرضى أهواءك<br />ونتذكر جميعا أن الدنياأيام معدودة إما قضيناها فى طاعة أو معصية عافانا الله وإياكم. هداكم الله إالى ما يحبه ويرضاه ونور بصيرتكم لكى تروا الاشياء حقها<br />ونعوذ بالله أن نكون من الجاهلين"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022329/http://masr.20at.com:80/article.php?sid=420"

[[comments]]
order = 14
subject = "دستور ام قانون"
author = "مهندس مسلم"
posted = "2006-06-21"
text = "اخي العزيز<br />لا تنجرف مع الريح وحكم عقلك<br />هل تعرف الفرق بين الدستور والقانون<br />القران والسنة هما دستور الامة الذي لن يتغير ابد الدهر<br />اما القوانين فهي تختلف باختلاف الحوادث وباختلاف الزمن وهوما اختلف فيه الناس والعلماء ايضا على مر التاريخ<br />ولكن لاننا نترك الفرصة لانصاف المتعلمين للكلام في امور استحى علماء عظام عن الخوض فيها<br />نجد بعضهم يمسك حكمين يشتركان في ظرف واحد ويختلفان في مائة ظرف ثم يقول انظر هناك تناقض وكأنه \"جاب الديب من ديله\""
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022329/http://masr.20at.com:80/article.php?sid=420"

[[comments]]
order = 15
subject = "الكتالوج"
author = "مسلم غيور"
posted = "2006-06-27"
text = "السلام على من اتبع الهدى<br />ربنا يا اخى لما خلق الانسان وضع له كتالوج هذا الكتالوج هو القرآن و السنة<br />يعنى تخيل لو جبت تسجيل جديد و انت ما تعرفش ان فيهاصلا حاجة اسمها تسجيل و رحت رامى الكتالوج و قلت انا بذكائى حقدر اتوصل لطريقة تشغيله ازاى حتقدر و انت اصلا مش عارف هو ايه ده<br />هو ده الانسان ربنا اللى خلقه و ربنا نزل له مع الرسول صلى الله عليه و سلم القرآن و السنة عشان يبقو هما الذين يحكمان تصرفاته فان حاد عنهما فسد و أفسد"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022329/http://masr.20at.com:80/article.php?sid=420"

