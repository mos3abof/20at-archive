text = "بسم الله<br />انا نفسي اعرف الاساس الي بتتكلم عليه الناس معناه ايه ان الشريعة الاسلامية لا تصلح ان تكون قانونا للبلادهل هذا كلام يعقل اسغفر الله ولاتتبع خطوات الشيطان"
