text = "أريد أن أعرف بوضوح ما هى مبادئ الشريعة الأسلامية فى الأمور المختلفة - مثلا فى موضوع الحكم على السارق والقاتل والزانى وشارب الخمر والمرتد المعاملات المالية وفى الزواج وفى معاملة غير المسلمين فى كل هذه الأمور ، وشكراً"
