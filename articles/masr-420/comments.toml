[[comments]]
order = 21
subject = "الي الكاتب العلماني الحقير"
author = "صوت الحق"
posted = "2006-11-23"
text = "معلوم ان العلمانيين لا يؤمنون بالبعث لذا تجرؤا علي كتاب الله ووصفوه بالانتقاص قاتلهم الله أني يؤفكون<br />أيها العلماني النجس<br />أولك نطفة مذرة وآخرك جيفة قذرة وأنت بين ذا وذا تحمل العذرة<br />ستبعثوا ورب الكعبة ستبعثوا<br />قال تعالي<br />{زَعَمَ الَّذِينَ كَفَرُوا أَن لَّن يُبْعَثُوا قُلْ بَلَى وَرَبِّي لَتُبْعَثُنَّ ثُمَّ لَتُنَبَّؤُنَّ بِمَا عَمِلْتُمْ وَذَلِكَ عَلَى اللَّهِ يَسِيرٌ} (7) سورة التغابن"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216143535/http://masr.20at.com:80/article.php?sid=420"

