[[comments]]
order = 11
subject = "من حقي أن أختلف"
author = "مصطفى حسان"
posted = "2006-06-10"
text = "سعدت بقرائتي مقالك المليء بالأسئلة ..<br />والذي أسعدني أن أرى شخصاً يختلف دون أن يخشى تضارب وجهات النظر .. لأنه وكما تعلم أن اختلاف الرأي لايفسد للود قضية وأيضاً من الأمور الجلية أنه من عاش بلا رأيه الخاص لا يستحق إلا أن يموت فقط ..<br />سيدي كاتب هذه المقال ...<br />كما اختلفت أنت فمن حقي أناأيضاً أن أختلف معك ... وألا أصدقك ... لأنه من الواضح جدا أن كلامك سطحي جدا لاتأخذ من الأمور إلا مسمياتها .<br />ومن الواضح أيضا أن درايتك القانونية غير متعمقة .<br />أولا ) لابد أنك تعلم أن الشريعة الإسلامية مطبقة كليا في قانون الأحوال الشخصية .<br />فلو كانت الشريعة الإسلامية غير صالحة للتطبيق لما كانت قد صلحت للتطبيق في قانون الأحوال الشخصية بدون أن تثير أي مشاكل .<br />ثانيا) يبدو أيضا أنك غير مقتنع بما تقول ... إذا كنت غير مقتنع بتطبيق الشريعة الإسلامية فلماذا إذن تحاول التظاهر بأنك تبذل ما في وسعك لكي تعرف ما هي الشريعة في اللغة و في الإصطلاح .. مع أن كلامك يدل على انك لم تترك نفسك لعناء البحث ومشقته ومن الواضح أيضا أنك اكتفيت بالمعلومات العامة التي يعرفها أي عيل صغير ( عفوا ) . ولو كنت حقا غير مقتنع فكان يكفيك أن تقول أنك غير مقتنع بدون ان تذكر أنك بحثت في القرآن والسنةلمجرد أن تنال لقب ( معرفة الآخر )<br />ثالثا) أنا غير متفقه في الدين ولكني مجرد طالب بكلية الحقوق معلوماتي القانونية ليست ضخمة وكل ما أردت أن أقوله لك .. لو أنك لم تذكر أن معلوماتك القانونية بسيطة لكان من السهل على أي طالب بالفرقة الأولي بكلية الحقوق أن يعلم ذلك ."
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022329/http://masr.20at.com:80/article.php?sid=420"

