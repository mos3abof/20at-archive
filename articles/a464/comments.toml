[[comments]]
order = 1
subject = "طبيعي"
text = "ما يحدث هو حالة طبيعية، ففلسطين ترغب في التحرر من استعمار السلطة الفلسطينية حتى تستطيع التخلص من استعمار إسرائيل..<br />وهي نظرية \"الطريق إلي القدس يبدأ من مقر عرفات\"..<br />حدث ما يشبه ذلك في فينزويلا ومن قبلها الأرجنتين وبولندا ودول الاتحاد السوفيتي السابق ودول أوروبا التي تحولت من الشيوعية إلي الرأسمالية<br />لكن الفارق أن دول أوروبا تحولت من اقتصاد الفساد الداخلي إلي اقتصاد الإفساد الخارجي.."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231522/http://www.20at.com:80/article.php?sid=464"

[[comments]]
order = 2
subject = "مطر"
text = "عباس وراء المتراس<br />،يقظ منتبه حساس<br />،منذ سنين الفتح يلمع سيفه<br />ويلمع شاربه أيضا، منتظرا ،محتضنا دفه<br />،بلع السارق ضفة<br />،قلب عباس القرطاس<br />،ضرب الأخماس بأسداس<br />(بقيت ضفة)<br />،لملم عباس ذخيرته والمتراس<br />،ومضى يصقل سيفه<br />،عبر اللص إليه، وحل ببيته<br />(أصبح ضيفه)<br />قدم عباس له القهوة، ومضى يصقل ؛سيفه<br />صرخت زوجة عباس\" :أبناؤك قتلى ،عباس<br />؛ضيفك راودني، عباس<br />\"،قم أنقذني يا عباس<br />عباس - اليقظ الحساس - منتبه لم ،يسمع شيئا<br />(زوجته تغتاب الناس)<br />صرخت زوجته \" :عباس، الضيف \"،سيسرق نعجتنا<br />قلب عباس القرطاس، ضرب الأخماس ،بأسداس<br />،أرسل برقية تهديد<br />فلمن تصقل سيفك يا عباس<br />(لوقت الشدة)<br />!!إذن، اصقل سيفك يا عباس"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231522/http://www.20at.com:80/article.php?sid=464"

[[comments]]
order = 3
subject = "القرد اللي اسمه ابو عمار كفاك استخفاف بقلوبنا وعقو"
text = "منذ عشرات السنين ومنظمة التحرير اقصد التخريب وهي تمص وتسرق دماء شعوبنا باسم القضية وبقيادة ابو عمار راس الفساد 0بنوا قصورا واصبحوا من رجال العمال علي حساب دماء الشعب الفلسطيني المسحوق بسم القضية والله فلسطين بريئة منهم -----والفرد ابو عمار يقوم بدعمهم بالفلوس وتقويتهم وجعل من السلطة عصابة له ولعائلة القدوة وترك الشعب الفلسطيني غارق بدمائه---كفاك ابو عمار استخفاف بناء اما آن ان تومت 00 وتنتهي مسرحيتك اللعينة وكفاك دمارا 00 وسفك لدماء للعنك الله ايوة القرد اللعين راس الفساد--------قنااااااص غزة"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231522/http://www.20at.com:80/article.php?sid=464"
