[[comments]]
order = 45
subject = "هذا رأيي و رزقي و رزقك على الله"
text = "اولا اود ان اوجه مزيد من الشكر لموقع عشرينات الذي فتح لنا مساحة للحوار فى موضوع شائك هو العمليات (الاستفجارية)، فبرهن على أن القائمين عليه، من اولئك الذين يسمعون القول فيتبعون أحسنه<br />أما عن رأيي فى موضوع العمليات الاستفجارية، فهو ليس برأى، وإنما هو مجموعة من التساؤلات، أولها هل يوجد بالفعل مجتمع مدنى فى إسرائيل، و إذا كانت الاجابة هى النفي، فماذا نسمي جماعات التى تنادى بالسلام داخل اسرئيل، و التى قامت بالعديد من المظاهرات منددة ببناء الجدار العازل، و إذا كانت الاجابة هى بالايجاب، أى انه بالفعل يوجد مجتمع مدنى فى اسرائيل، جاء إليها بعد خديعة مارسها الاعلام الصهيونى ، ادعى ان الذهاب الى اسرائيل هى واجب وطنى على كل يهودى، إذا فكيف تقوم الفصائل الفلسطينية، بهذه العمليات التى لا تفرق بين مدنى و عسكرى، و بين كهل و طفل و امرأة و شاب؟<br />ارى من وجهة نظرى أن هذه العمليات حتى لا تصبح مجرد سلاح للتنافس بين الفصائل الفلسطينية من جهة، و حتى لا تفقد تعاطف جماعات السلام داخل الكيان الصهيونىو المجتمع الدولى بشكل عام، ارى أنها يجب ان توجه الى الأهداف العسكرية الصهيونية، فبذلك سوف نضرب عصفورين بحجر واحد، اولهما استمرار سلاح هذه العمليات فى أيدى الفلسطينين كورقة ضغط، و ثانيا استمرار تعاطف المجتمع الدولى مع القضية الفلسطينة<br />و لكن السؤال الأهم، و الذي يدور فى خيالى دائما، هل هذه العمليات قتل للنفس ام لا؟<br />و فى النهاية، أنا لا ابدى رأيا واحدا فى كل العمليات التى تقوم بها الفصائل الفلسطينية، بل علينا ان ناخذ كل منها على حدة، فى ظروفها و أسبابها و توابعها<br />و لا ننسي فى النهاية أننا نعبر عن هذه الأراء و نحن جلوس فى غرف مكيفة و بجانبنا كوب الشاي، غير معرضين للضغوط التى يتعرض لها الفلسطنيين<br />أؤكد عليكم ان هذه مجرد تساؤلات تدور فى مخيلتى عندما ياتى ذكر هذه العمليات<br />و الله المستعان"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

