[[comments]]
order = 68
subject = "نونا المجنونة"
text = "يا بشمهندس فلسطيني انا مش ناوية اني انتحر ولا افجر نفسي عشان كده مش هرهق نفسي بالقراءة في الموضوع ده لاني في مواضيع تانية لازم اقراء فيها و اهم بالنسبة لي<br />اولا انا مش هسافر فلسطين عشان افجر نفسي مش معني كده ان معنديش دم بس انا احب اهلي و مظنش ان هيفرحوا لما افجر نفسي اكيد اتمني الشهادة بس معلش اتمني الشهادة عشان ديني مش عشان ارض انا امي من عائلة التميمي في فلسطين لكن معلش مش هروح افجر نفسي عشانها في مواضيع للقراءة لها الاولوية بالنسبة لي مش اكتر"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

[[comments]]
order = 69
subject = "فلسطيني"
text = "طب وانا شفت مين اللي في دماغك يا من فضلك ؟؟؟<br />هاهاها<br />ثم انت اللي مين ؟؟؟ مش يمكن انت كمان اللي في دماغي ؟؟؟<br />الاخت نونا<br />احنا كده متفقين<br />انتي مش موافقة على موضوع الانتحار ده<br />لكن فيه ناس موافقين وبتدافع عنه ودول هما اللي انا باخاطبهم لان اللي ايده في المية مش زي اللي ايده في النار<br />ولما الواحد يشوف حاجة غلط بتتعمل باسم الدين وبتضل ناس تانية وتؤدي الى انتحارهم وتشويه صورة الاسلام يبقى واجبي الديني يحتم عليا اني اوضح والا ابقى انا اثم وعلي وزر انني عرفت الحق وكتمته والساكت عن الاحق شيطان اخرس ...<br />واي واحد عاقل عمره ما يروح ينتحر ولا يسيب اخوه ولا ابوه ولا اخته ولا امه تروح تفجر نفسها لان ده ببساطة هبل في الجبل !!! وفعلا زي ما احد الاخوة هنا قالوا ... مافيش حد بيفرض على ربنا انه يتقبله شهيد !!! واحدة متجوزة جديد وعندها طفلين تروح تفجر نفسها ليه ؟؟؟ طبعا غسيل مخ !!! والمستفيد ناس عاوزة تعمل زعامات على الفاضي ... والاسلام مافيهوش اي كلام من ده نهائي واللي يقول كده كذاب في اصل وشه !!!"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

[[comments]]
order = 70
subject = "شخص ما"
text = "أعترض على ما كتبته \"نونا\" وبعدها \"فلسطيني\": من أن الفلسطينيين يفجرون أنفسهم من أجل \"الأرض\".. أو من أجل زعامات شخصية.. فهل شققتم قلب كل استشهادي ورأيتم ذلك..<br />ثم يا أخت \"نونا\" .. من حقك ألا تكون من أولوياتك أن تفجري نفسك .. ومن حقط ألا تهتمي بقراءة ما يكتب عن تلك العمليات..<br />ولكن عفواً ليس من حق أحد أن يتهم الاستشهادي الذي ضحى بروحه بأنه فعل ذلك من أجل أرض .. لا من أجل دين.. ثم أن الدفاع عن الدين يستوجب استرداد الأرض.. فالقضية قضية دين متمثلة في الدفاع عن أرض مقدسة طاهرة دنسها اليهود وأعوانهم..<br />وإلي الأخ \"فلسطيني\" .. اختلاف العلماء حول مسألة العمليات الاستشهادية لا يعني أن من يؤيدها أيدها لسبب سياسي ونفعي.. فلماذا لا يكون العكس.. أن من يدينها ويحرمها هو الذي يفعل ذلك.. أنا لا أتهم مشايخنا الأجلاء ولكن ما دام المسألة بالظن.. إذن لماذا نفترض شيئاً ولا نفترض العكس<br />أكرر أنا لا أتهم شيوخ أنا لا أمثل نقطة بجوارهم.. ولكنني أستغرب ممن يتهمون القرضاوي بالتسيس .. فهذا سيجعل مريديه يتهمون أعداءه بنفس التهمة"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

