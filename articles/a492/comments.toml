subject = "بحث وائل عباس - جزء 3 من 15 - ما هو الجهاد"
text = "تعريف الجهاد<br />السابق | الصفحة الرئيسية للموضوع | التالي<br />وشبابنا المسلم والحمد لله ولا يعرف فى البطاطا<br />ولا يعرف دينه ولا بيقرا تفسير قرانه ولا بيتاكد من صحة احاديثه وسيره<br />ومن هذا الشباب من يبحث بالفعل عن الحقيقة ومعلق بقشة<br />وكونه غر لا خبرة له بالحياة فمن السهل التغرير به غسل مخه والتلاعب بمعتقداته<br />والشباب فى هذه السن ايضا لا ياخذ من الامور الا ظاهرها<br />واحد بدقن ولابس جلابية بيضا قصيرة وسروال تحتها يبقى على طول سنى وبتاع ربنا<br />واى حاجة يقولها يقول له امين<br />حتى انه فى الشارع والمواصلات العامة ينادنه فقط ب يا شيخ<br />مع انه ممكن يكون عيل عنده 17 سنة !!!<br />وبالفعل وبسبب الجهل والفقر والتخلف اصبحت الافكار المتطرفة ذات ثقل فى المجتمعات الاسلامية<br />ولها تاثير حتى على اعلى المستويات بما فيها الصحافة والاعلام وحتى الاجنبى منها<br />فمثلا بناء على ضغوط الرأى العام استبدلت دائما كلمة عمليات انتحارية باستشهادية<br />او فى احسن الاحوال فدائية<br />هكذا بدون مناقشة واذعان كامل للتطرف والارهاب<br />والواقع ان بعض الانظمة تستغل هذه العمليات للضغط السياسى على اسرائيل<br />وتعترف بها وتشجعها احيانا وتنفر منها احيانا اخرى حسب الحاجة السياسية<br />ومثال على ذلك الحكومة المصرية المعروف انها لا ليها فى الطور ولا فى الطحين فى الدين<br />ابواقها الاعلامية تسبح بحمد تلك العمليات عمال على بطال<br />ولما جه وقت محدد سياسيا ارسلت مصر رئيس مخابراتها ليتوسط لوقفها<br />وابتدت نبرة التشجيع لها فى الاعلام المصرى تخف لو حد لاحظ<br />واعطى الضوء الاخضر لمنتقديها فى الصحف لمعاودة الكتابة<br />اى ان العملية لعبة سياسية وضغوط وشد وجذب وارخاء<br />لا يمت بصله لله ولا قرآنه ولا رسوله ولا سنته ولا اقوال الفقهاء على مر العصور<br />واى قول غير ذلك هو افتئات على الدين وافتراء على الله ورسوله وكذب<br />وانا هنا لاثبات حرمانية العمليات الانتحارية من الناحية الدينية<br />والحالة الوحيدة اللتى تكون حلالا فيها هى السياسة وليس الدين !!!<br />والسياسة نشاط انسانى يحتمل الخطأ ويحتمل الصواب ولا تعمل من منطلق دينى<br />وموقفى هذا سادعمه من ثلاثة منطلقات<br />منطلق الجهاد وادابه وقواعده واحكامه وشروطه وادابه<br />ومنطلق الاستشهاد فى سبيل الله واحكامه وشروطه<br />والمنطلق الثالث هو الفتاوى المعاصرة حول تلك القضية<br />و نبتدي نتكلم عن الجهاد :<br />نتفق الاول على ان الجهاد له شروط اهمها القدرة واذن ولى الامر<br />كما ان الجهاد ليس بالسيف فقط عملا بحديث رسول الله: جاهدوا المشركين بأموالكم وأنفسكم وألسنتكم - عن انس ابن مالك<br />يعنى الجهاد بالمال والنفس واللسان والعلم كما اضاف الفقهاء<br />واتمنى من الله ان يكون ما نفعله فى هذه المجموعة من باب الجهاد باللسان والعلم<br />كمان احب اوضح خطأ شائع<br />وهو الحديث بتاع الجهاد الاكبر هو جهاد النفس<br />الحديث ده غير صحيح<br />وقال ابن تيميه ولو انى مش باحب استشهد بيه وباتحقظ على اقواله : الجهاد إما أن يكون بالقلب كالعزم عليه ، أو بالدعوة إلى الإسلام وشرائعه ، أو بإقامة الحجة علي المبطل أو بيان الحق وإزالة الشبهة أو بالرأي والتدبير فيما فيه مع المسلمين ، أو بالقتال بنفسه فيجب الجهاد بغاية ما يمكنه<br />لحد كده الكلام عاقل وزى الفل<br />غير الجنان اللى قاله بعد كده !!! وانا هنا لست فى محل الطعن فى ابن تيمية !!!<br />بس مش عارف يعنى اشمعنى ده اللى اجتهاداته مقبولة عن الجماعة اياهم واى حد تانى لا !!!<br />ويقول الشيخ محمد فتحي الدريني عميد كلية الشريعة في جامعة دمشق :<br />قال تعالى: {واعدوا لهم ما استطعتم من قوة ومن رباط الخيل، ترهبون به عدو الله وعدوكم} وجاء الاسلوب القرآني الكريم بالتعميم: {من قوة} دون اقتصار على نوع معين منها، فشمل كل ما يعتبر عدة للقتال، ماديا ومعنويا، فالسلاح والعتاد والتدريب على فنون الحرب، وانشاء المصانع الحربية لانتاج ادوات القتال والذخيرة، والعلوم الكيماوية والفيزيائية والهندسية والطبية. وتنمية موارد الانتاج في البلاد. زراعيا وتجاريا وصناعيا، تدعيما لاقتصاد الدولة. وسائر العلوم النظرية الاخري كالعلوم السياسية والقانون والادبية والفنية، كل أولئك وغيره من وسائل اعداد القوة الذي جاء القرآن الكريم بالامر به، في قوله تعالى: {واعدوا لهم ما استطعتم من قوة، ومن رباط الخيل}.<br />والآية<br />Read the rest of this comment..."
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

