[[comments]]
order = 8
subject = "بيرو ....جاء دوري في الكلام"
text = "الاخ الكريم فلسطيني ....في موضوع هيا بنا ننتحر وبعد ان خرجت المناقشة بيننا من نطاق المناقشة إلي نطاق الخناقشة علي رأي مريم نوح ....<br />ارسلت لك رسالة أعلن فيها اني قد انسحبت أنا ومصعب الخير ومعنا مطر وكنا جميعا نحاورك تحت اسم الحلف الإليكتروني الفظيع ... جاء إنسحابنا لإحساسنا ان الشيء الوحيد الذي يخسر نتيجة حوارنا هو إسلامنا الجميل وأحترامنا لعملائنا ...<br />أما الان فقد آثرت ان انتظر قليلا لاسمع اراء الاصدقاء الذين لم يشاركوا في حوارنا الاول والان وبعد ان سمعت ....جاء دوري في الكلام<br />دعنا نتحدث بشكل من اشكال المنطقية بعيدا عن ابواق اتخوين والاتهام بالعمالة ..<br />اخي العزيز .... ما رأيك في رجل اعزل يلقي بنفسه بين مائة رجل مدجيين بالسلاح يبغي قتلهم ..<br />او رجل هزيل الجسد مؤمن يخرج ليجلس بين قوم كافرون جاحدون جبارون يلقي علي مسامعهم القرىن وهو يعلم انه ميت لا محالة ...<br />ما رأيك في رجل يقولون له قل كفرت او تمت فيقول لا...<br />في رايي المتواضع يا اخي الحبيب ان العمليات التي نتحدث عنها بغض النظر عن تسميتها فسأترك لك ان تسميها كما تشاء لأنها في نظري ليس لها إلا اسم واحد اعرفه جيدا.....<br />النماذج التي حدثتك عنها في رايي هي شكل مبسط من اشكال هذه العمليات....<br />دفاع عن الكرامة ...صرخة اعتراض علي الوضع القائم ..<br />العليات الاستشهادية مجرد كلمة فس سطر طويل من كتاب إسمه قصة أمة حرة هي الامة الفلسطينية ..<br />وتبقي كلمة الاسرائليين ليسوا مدنيون عزل بل هم محتلون غرباء اجانب يعلنون الحرب علي الاسلام في كل ساعة ودقيقة ...!!!!"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

