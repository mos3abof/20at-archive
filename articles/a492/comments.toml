subject = "بحث وائل عباس - الجزء 2 من 15 - صلح الحديبية"
text = "ومن اكثر ما يخفونه ويخافون من ظهوره هو موضوع صلح الحديبية<br />حيث اظهر مهارة وحنكة الرسول السياسية صلى الله عليه وسلم<br />حيث استطاع بخروجه مسالما لا محاربا لزيارة بيت الله الحرام ان يكتسب تعاطف القبائل<br />بل واوجد انقساما فى صفوف قريش حتى ان الاحابيش كادوا ان يهبوا لنصرة محمد<br />وقالوا انه ما كان لقريش ان تصد الناس عن بيت الله الحرام ما جاؤوا معظمين له<br />والدليل انه غير طريقه عندما عرف بنية قريش ارسال جيش لملاقاته الى طريق اخرى وعرة<br />بل عفا عن اربعون من هؤلاء المهاجمين<br />حتى عندما اشاعوا عن مقتل عثمان لم يكن رد المسلمون عشوائيا او اهوجا ولكن بيعة على القتال<br />وهذا اول نصر سياسى بالمعنى المتعارف عليه حيث ان ما فعله الرسول كان بمثابة ضغط على الكفار<br />وقال فيه الشافعى بجواز ابتداء الإمام بطلب صلح العدو إذا رأى المصلحة للمسلمين فيه ولا يتوقف ذلك على أن يكون ابتداء الطلب منهم<br />وقد اضطرت قريش للصلح وطلبوا ان يعود المسلمون العام التالى حفظا لماء الوجه ومكانة قريش فقط لا غير<br />وقد اضطرهم موقف الرسول الكريم لذلك باحراجهم فقد جاء فى سلام وهم يصدونه<br />وعندما علم الرسول بطلبهم الصلح قال للمسلمين : لقد سهل لكم امركم<br />وكلنا نعرف اعتراض عمر بن الخطاب على الصلح وقوله لماذا نعطى الدنية فى ديننا وليس عن قلة ايمان ولكن عن قلة علم بحكمة الله ورسوله السياسية من ذلك الصلح<br />أى ان الخلاصة ان اى انسان قد يخطىء مهما كانت درجة ايمانه لجهله بالحكمة الالهية !!!<br />كان من عناصر المعاهدة اللتى تستمر عشر سنوات انه بالامكان اقامة التحالفات العسكرية مما يقوى المسلمون ومن ذلك دخول خزاعة فى عهد الرسول وبكر فى عهد قريش<br />بمعنى ان الهدن قد تكون استراتيجية لاغراض التحالف واعداد العدة<br />كما منع الصلح من يؤمن ان يترك قريش ويهاجر الى محمد<br />ومن ذلك قصة ابى جندل حيث يقول رسول الله صلى الله عليه وسلم : يا أبا جندل اصبر واحتسب ، فإن الله جاعل لك ولمن معك من المستضعفين فرجا ومخرجا ، إنا قد عقدنا بيننا وبين القوم صلحا ، وأعطيناهم على ذلك وأعطونا عهد الله وإنا لا نغدر بهم<br />وقال ايضا : من أتاهم منا فأبعده الله ومن أتانا منهم فرددناه إليهم جعل الله له فرجا ومخرجا<br />وفى ذلك حكمة فالمرتد لا حاجة للمسلمين به لانه لا يؤمن غدره اما المؤمن فبقاؤه وسط المشركين ففيه فائدة للمسلمين حتى ان الكفار ادركوا ذلك فاحبوا ان يغيروا قواعد الصلح بعد ان كانوا يظنون انه لصالحهم كما ظن المسلمون وهذا يظهر بعد النظر السياسى للرسول وانه كان يخطط للمدى البعيد كما انه كتم الامر عن المسلمين انفسهم حتى لا يصل الى المشركين ويفهمون المقصد<br />كما اثبت كذب قريش فى ان المسلمين لا يراعون حرمة المسجد الحرام !!!<br />وأتاح الفرصة أمام للمسلمين ليتفرغوا ليهود خيبر وتيماء وفدك ولأعراب المدينة فقد كان رسول الله صلى الله عليه وسلم يحرص على أن لا يواجه الأعداء جميعا في وقت واحد ، فإذا تجمعوا لقتاله حرص على التفريق فيما بينهم بكل الوسائل ، حتى إذا أمكنته الفرصة بطش بأقواهم ثم بمن بعدهم حتى يتم له النصر، ولم يكن عليه الصلاة والسلام حين يريد الأمر فيحال بينه وبين ما يريد، تأخذه حمية المقاتل الذي يصر على أن ينتصر، بل كان يقدر الظروف المحيطة به ، ويقارن بين ما يريد وبين ما يعرض له من فرصة، فإن وجدها أجدى عليه مما يريد عمل بها وأخر ما يريد إلى وقت آخر<br />وانتظر الرسول صلى الله عليه وسلم حتى تمّ صلح الحديبية ، وأمن شرّ قريش ، فاتجه إلى تصفية قضية اليهود الباقين حول المدينة فأنهى علائقه مع يهود فدك ، بحقن دمائهم ومغادرة ديارهم ، وترك أموالهم ، ثم انتهى من يهود وادي القرى ويهود خيبر، فتغلب عليهم ، وفرض عليهم الجزية، وجردهم من قوتهم الحربية . . وبذلك انتهى من معركة اليهود، دون أن يخوض معهم جميعا معركة واحدة، ودون أن يحاربهم وقريشاً في وقت واحد وهذه إحدى العبر في تاريخ الرسول السياسي والعسكري ، دلنا على براعته وتوفيقه في الوصول إلى النصر، دون أن يثير قوى الأعداء عليه جميعاً ما دام يستطيع أن يفرق بينهم ـ كما في غزوة الخندق ـ أو أن يضربهم الواحد بعد الآخر كما حصل في تصفية قضية اليهود في جزيرة العرب<br />مش احنا اللى عمالين نلطش فى روسيا والهند والفلبين وامريكا واوستراليا وكله فى وقت واحد وينسمع كلام واحد اهبل قاعد فى جبال افغانستان بيقلب العالم علينا !!!<br />وانا شخصيا ممكن اجيبلكم اسباب تلطشوا بيها فى باقى دول العالم يعنى ممكن مثلا تلطشوا فى السويد علشان موضوع الحريق بتاع الحفلة اللى عملوها شباب من اصل عربى وممكن تلطشوا فى الصين بسبب اللى عملوه فى الثورة الثقافية من حرق وهدم للمساجد فى شنغهاى وغيرها واعدام للمسلمين وشيوخهم حتى الان ومش ها نخلص وها نلاقى نفسنا بنكره العالم كله والعالم بيبادلنا نفس الشعور !!!<br />Read the rest of this comment..."
