text = "في فهم غلط لي انا مقلتش حرام او حلال العمليات الاستشهادية عشان انا مش مفتي بس انا مش هحارب عشان فلسطينين معلش يا اخ فلسطيني انا لو حد هوب جنب بلدي اكله بسناني لكن فلسطين مش بلدي لو هتقولي احارب عشان مسلمين ماشي عيني ليك لكن فلسطين مش بلدي و الاولي اهلها يحاربوا عشانها و مش هجاهدالا برضي اهلي لان كلنا عارفين قصة الراجل الي كان عايز يجاهد بس الرسول منعه لان والديه محتاجين رعايته"
