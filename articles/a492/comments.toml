subject = "الجزء 12 من 15 كيفية الاعداد للجهاد ... وائل عباس"
text = "الاعداد للجهاد كيف يكون ؟؟؟<br />السابق | الصفحة الرئيسية للموضوع | التالي<br />نرجع تانى للجهاد :<br />والاعداد للجهاد بيكون ازاى زى ما قال تعالى :<br />وأعدّوا لهم ما استطعتم من قوة ومن رباط الخيل تُرهبون به عدو الله وعدوكم وآخرين من دونهم لا تعلمونهم الله يعلمهم<br />وقد قال الفقهاء بوجود اربعة جوانب للاعداد للجهاد<br />1 - اعداد عقيدى :<br />اى يجب ان يكون الجهاد فى سبيل الله وان يكون المجاهد مؤمنا بعدالة القضية التى يجاهد من اجلها<br />ومستعد للبذل والتضحية فى سبيل ذلك بثقة لتحقيق الهدف<br />2- الاعداد البدنى والنفسى والروحانى والاخلاقى :<br />وهو توافر الصفات المناسبة مثل الشجاعة والاقدام والتضحية والصبر والحزم والمبادرة<br />والنية والعزم على الجهاد وحمل همه<br />ومن الصفات السابقة ما يحتاج الى تعود وتدريب ووقت كافى<br />3 - الاعداد السياسى :<br />وهو التعرف على الاعداء وحجمهم ونقاط ضعفهم واساليبهم واسلحتهم وتاريخهم<br />ويجب أن يتعرف المجاهد على كل شي‏ء يخص العدو حتى يحسب لكل شي‏ء حسابه<br />فقد أكد الاسلام على ضرورة معرفة المؤمن للزمان والأحداث والتحولات التي تجري لكي يتقي الضربات التي قد تأتيه من حيث لا يشعر<br />يعنى لا يكفى ان يعيش على امجاد الماضى !!!<br />4 - الاعداد العسكرى :<br />وينقسم الى شقين<br />- الإعداد النظري: وهنا لا بد من معرفة الأسس والمبادى‏ء العامة في مواجهة العدو، ومعرفة طبيعة الأسلحة ونوعيتها وأسلوب الحرب النفسية وحروب الجبهات.<br />- الإعداد العملي: ويبدأ من نقطة الاهتمام بالسلاح والتعود على حمله واستخدامه.<br />والإعداد العسكري لا يكون فقط بالتعلم على الأسلحة وطرق القتال وإنما يتطلب ايضاً الإعداد الجسدي سواء في المحافظة على الجسد سليماً أو في جانب تربيته وتنمية القدرات البدنية لديه وفي هذا الجانب صفات ضرورية يجب تربية الجسد عليها مثل عدم توتر الأعصاب، والسرعة والدقة والقدرة على التنسيق.<br />إن القوى الجبارة والأسلحة الفتّاكة لا يمكن ردها وإلحاق الهزيمة بها والتفوق عليها إلاّ بالعدّة والإعداد وامتلاك جميع شروط الاستعداد للمواجهة<br />السابق | الصفحة الرئيسية للموضوع | التالي"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

