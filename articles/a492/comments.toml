text = "معلشلى استحملوا بقى معايا لانى لما كتبت البحث ده على الوورد عمل فوق الخمسين صفحة يعنى بقى كتاب مش مقال واتمنى انى اكون رديت على كل المزاعم المثارة حول العمليات الانتحارية حرام ولا حلال وردى هنا ها تلاقوه مقسم الى اجزاء بسبب طوله والرجاء انكم تقروه كله على بعضه حتة واحدة لانه ما يتقريش غير كده واللى مش ها يقدر يقراه كله ينتظر لحد ما يلاقى وقت فاضى ويقراه ومعذرة انى اسلوبى المرادى مش سهل وتقل فيه العامية تماما لكن الموضوع ده ما ينفعشى فيه الكلام غير كده !<br />ورجاء خاص من اللى يقرا الكلام ده ويقتنع بيه انه يبعته لاى حد وكل حد يعرفه والا يبقى بيخون امانة انا حملتهاله اهه وبيكتم الحق بعد ما عرفه !<br />موضوع العمليات الانتحارية مهم جدا<br />من حيث كونه تابع لايديولوجية سياسية ودينية مزعومة<br />وله تاثير كبير على الشعوب المسلمة وبخاصة غير المثقفة او الواعية<br />وهنا يكمن الخطر<br />حيث فى بيئة جاهلة بدينها يرتع التطرف والافكار المغرضة المستوردة<br />المدسوسة علينا بفعل عدو او بفعل طامع فى سلطة وجاه وشهرة<br />ظاهرها الرحمة وباطنها العذاب<br />ويكون هؤلاء المغرضون مراكز قوى وسيطرة على الراى العام<br />دون اى اعتبار لدين او فقه<br />بل هم يخفون عن عمد ايات من القران بعينها وينكرون احاديث نبوية صحيحة فى سبيل دعواهم<br />يقول تعالى : إِنَّ الَّذِينَ يَكْتُمُونَ مَا أَنزَلْنَا مِنْ الْبَيِّنَاتِ وَالْهُدَى مِنْ بَعْدِ مَا بَيَّنَّاهُ لِلنَّاسِ فِي الْكِتَابِ أُوْلَئِكَ يَلْعَنُهُمْ اللَّهُ وَيَلْعَنُهُمْ اللَّاعِنُونَ(159)إِلَّا الَّذِينَ تَابُوا وَأَصْلَحُوا وَبَيَّنُوا فَأُوْلَئِكَ أَتُوبُ عَلَيْهِمْ وَأَنَا التَّوَّابُ الرَّحِيمُ<br />ويقول ايضا : إِنَّ الَّذِينَ يَكْتُمُونَ مَا أَنزَلَ اللَّهُ مِنْ الْكِتَابِ وَيَشْتَرُونَ بِهِ ثَمَنًا قَلِيلًا أُوْلَئِكَ مَا يَأْكُلُونَ فِي بُطُونِهِمْ إِلَّا النَّارَ وَلَا يُكَلِّمُهُمْ اللَّهُ يَوْمَ الْقِيَامَةِ وَلَا يُزَكِّيهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ(174)أُوْلَئِكَ الَّذِينَ اشْتَرَوْا الضَّلَالَةَ بِالْهُدَى وَالْعَذَابَ بِالْمَغْفِرَةِ فَمَا أَصْبَرَهُمْ عَلَى النَّار<br />ِ<br />والاية التالية حاولوا كده تطبقوها على من يقولون بان العمليات الانتحارية حلال :<br />وَمِنْ النَّاسِ مَنْ يَقُولُ آمَنَّا بِاللَّهِ وَبِالْيَوْمِ الْآخِرِ وَمَا هُمْ بِمُؤْمِنِينَ(8)يُخَادِعُونَ اللَّهَ وَالَّذِينَ آمَنُوا وَمَا يَخْدَعُونَ إِلَّا أَنفُسَهُمْ وَمَا يَشْعُرُونَ(9)فِي قُلُوبِهِمْ مَرَضٌ فَزَادَهُمْ اللَّهُ مَرَضًا وَلَهُمْ عَذَابٌ أَلِيمٌ بِمَا كَانُوا يَكْذِبُونَ(10) وَإِذَا قِيلَ لَهُمْ لَا تُفْسِدُوا فِي الْأَرْضِ قَالُوا إِنَّمَا نَحْنُ مُصْلِحُونَ(11)أَلَا إِنَّهُمْ هُمْ الْمُفْسِدُونَ وَلَكِنْ لَا يَشْعُرُونَ(12)وَإِذَا قِيلَ لَهُمْ آمِنُوا كَمَا آمَنَ النَّاسُ قَالُوا أَنُؤْمِنُ كَمَا آمَنَ السُّفَهَاءُ أَلَا إِنَّهُمْ هُمْ السُّفَهَاءُ وَلَكِنْ لَا يَعْلَمُونَ<br />ومن تفسير ابن كثير :<br />لقوله تعالى : إنما يأمركم بالسوء والفحشاء وأن تقولوا على الله ما لا تعلمون<br />أي إنما يأمركم عدوكم الشيطان بالأفعال السيئة, وأغلظ منها الفاحشة كالزنا ونحوه, وأغلظ من ذلك وهو القول على الله بلا علم, فيدخل في هذا كل كافر وكل مبتدع أيضاً<br />ويظهرون علىالسطح احاديث اخرى صحيحة وغير صحيحة وايات لها اسباب نزولها الخاصة<br />ولا علاقة لها بفتاواهم من الاساس الا ربما اللفظ<br />وبالتحديد ايات الجهاد والحث على الاقبال عليه لتبرير العمليات الانتحارية<br />وشتان ما بين االجهاد والانتحار لاسباب سياسية<br />وحتى لو بصينا لتاريخ العمليات الانتحارية مش ها نلاقى اى مثيل لها فى الاسلام حتى فى قصة الغلام وقصة البراء اللى اصلا ما ماتشى وانا ها اذكر ليه بعد كده ورأى كبار العلماء فى القياس على هاتين القصتين وها نلاقى تاريخهم بيرجع لطيارى الكاميكازى اليابانيون الانتحاريون ابان الحرب العالمية الثانية ثم اول تفجير للنفس بغرض الاغتيال قامت به فتاة من السيخ لا غتيال راجيف غاندى رئيس وزراء الهند !!!<br />يقول تعالى : من قتل نفسا بغير نفس او فساد في الارض فكانما قتل الناس جميعا – المائدة 32<br />والاية تقول نفس !!! اى نفس !!! يعنى مش ضرورى مسلمة !!! يعنى لما تقتل واحد يهودى عمره ما قتل واحد فلسطينى وتقول كلهم عسكريين يبقى انت كده بتقتل نفس بغير نفس !!! ومافيش ايات نزلت تنسخ الاية دى !!! ومالكومشى حجة !!!<br />الى جانب اله دعائية ضخمة مرتكزة على كتب صفراء لا اصل لها وفتاوى مجانين فى عصور مظلمة<br />وتتركز دعايتهم بالتحديد على الانترنت حيث معقل الشباب والمراهقين<br />Read the rest of this comment..."
