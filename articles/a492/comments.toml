text = "الاخوة الشيعة برضه رايهم انهم مش بيعملوا حاجة حرام<br />والبابا يوحنا بولس في رايه انه بيهدي الناس<br />واتباع الطائفة البهائية رايهم انهم بيعبدوا ربنا ومش بيعملوا الحرام<br />وكذلك عباد البقر في الهند<br />شارون برضه فاكر انه بيتبع كلام الله من التوراه<br />وبوش مس مستحرم الحرب في العراق لانه يظن انها من الانجيل<br />ليس مهم ما نظن وما نشعر<br />المهم ما هو الحق المبين<br />تطاول رجل على رسول الله ذات مرة وهو من المسلمين<br />فهم سيدنا عمر باشهار سيفه مريدا قتله<br />فمنعه رسول الله وقال هل شققت قلبه ؟؟؟<br />فسيدنا عمر ذو بصيرة وفكر وعاطفة لكنها تخصه<br />اما الحكمة الالهية فتتجلى في منع رسول الله له من قتل الرجل<br />فان وجدت تعارض بين ما يجيش في نفسك واوامر الله فماذا تختار ؟؟؟<br />ارجو ان تكون مؤمنا حقا وليس متبعا لاحدى البدع مثل القومية والاشتراكية والشيوعية ... الخ"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

