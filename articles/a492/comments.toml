text = "بسم الله الرحمن الرحيم<br />أولا أشكر إدارة الموقع التي اعترتني من الأصدقاء<br />و أتمنى أن أكون عند حسن ظنهم<br />أما بالنسبة للأخ \" فلسطيني \"<br />أعتذر الآن لأني مشغول قليلا<br />لأنني أبحث لك الآن بصورة أكثر تفصيلا<br />لأن الموضوع خطير جدا ...<br />و أعدك أني سأعود قريبا بالجواب الشافي لكل الذين<br />عندهم لبس في هذه القضية<br />ترقبوا البيان التأسيسي للحلف الالكتروني الفظيع<br />سنعود بعد قليل!!!!"
