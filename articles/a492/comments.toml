subject = "الحكاية لسه فيها"
text = "رغم انني مع العمليات الإستشهادية الا ان صدمتي كبيرة في مؤيديها الذين يكتبون الشعر ولم يردوا علي \"فلس... طيني\" واخواته اصحاب العين الثاقبة في التقاط الفتاوي من مشايخ البترول الكرام وجوقة آل سعود التي تري في الكافر افضل من صدام وتري في الإحتلال فرصة لا تعوض لحماية حكمها وبالتالي هي ضد اي مقاوم سواء استشهد او قاتل باليد العارية المهم عندهم ان نفهم اننا في حالة ضعف ونبقي في حالة الضعف حتي ...وهنا يأخذالدكتارة المشايخ الأفاضل 1000 دكتوراه في حتي وغيرها مادام القعدة مريحة والحالة مليحة"
archived = "2004-08-14"
