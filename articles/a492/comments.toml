subject = "هندسة إلى استشهاديوا فلسطين"
text = "اشهر فيتو استشهادي باسم ابن الدرة وباسم جنين<br />اشهر فيتو استشهادي في وجه الفيتو الأمريكين<br />يا أرفع شمخة عز في وطني لجبين<br />قالوا إرهاب أن تستشهد كي تحيا هذه الأوطان<br />من خوف قالوا إرهاب أن تصمد وحدك في الميدان<br />فتأمل ياابني و اشهد كيف تزول رقاب الخوف الآن<br />يرعبهم أن يتجاوز هذا العشق غدا حد الإدمان<br />شكرا لحضارة أمريكا في اقرن الواحد و العشرين<br />شكرا فالحقد سينمو في الأطفال سيربى في خلجات جنين<br />شكرا فاليوم مئات منا صاروا استشهاديين<br />و غدا ألف فملايين ويجيء الدور على الباغين<br />اشهر فيتو استشهادي باسم ابن الدرة وباسم جنين"
