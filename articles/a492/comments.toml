subject = "مصـ( الخير )ـعب .... عدنا"
text = "كما وعدتك أخي \" فلسطيني \" فها أنذا قد عدت و هذا<br />بعض ما وعدتك به<br />العمليات الاستشهادية<br />بين المجيزين والمانعين<br />اختلف أهل العلم في العمليات الاستشهادية التي يقوم<br />بها بعض المجاهدين المغلوبين على أمرهم دفاعاً عن<br />دينهم وحريمهم، وأعراضهم، وأوطانهم، بعدما تخلى<br />عنهم إخوانهم المسلمون وخذلوهم، وأسلموهم لعدوهم،<br />بل ظاهر بعض المنتسبين إلى الإسلام الكفار على<br />المسلمين، بأن دلوهم على عوراتهم، وقاتلوا إلى<br />جنبهم، إلى قولين، هما:<br />1. أن هذه عمليات انتحارية وليست استشهادية،<br />والانتحار حرام، ومن ثم فلا تجوز.<br />2. أن هذه العمليات عمليات استشهادية، وأنها من<br />النوازل التي أملتها الظروف الحرجة التي تمر بها<br />الأمة الإسلامية، وأنها تجوز بشروط، وهي:<br />أ. أن يكون المسلمون في حالة جهاد مع الكفار، سواء<br />كان جهاد طلب أودفاع، كما هو الحال الآن في فلسطين،<br />والعراق، وأفغانستان، والشيشان، وكشمير، وجنوب<br />الفلبين، وغيرها من البلاد المغصوبة.<br />ب. أن يمارس ذلك مسلم يبتغي بذلك النكاية بالعدو<br />وإرهابهم.<br />ج. أن يبتغي بهذا العمل وجه الله عز وجل.<br />د . أن يغلب على ظنه النكاية بالكفار وإرهابهم.<br />ﻫ . أن لا يكون الدافع له اليأس والقنوط والتخلص من<br />الحياة.<br />وبادئ ذي بدء لابد من أن نقرر حقيقة، وهي أن هذه<br />العمليات من النوازل الحرجة، وأن الحكم عليها<br />بالجواز أوعدمه من الأمور التي تحتاج إلى تأنٍّ وإلى<br />بصيرة، ومعرفة بالواقع والملابسات المحيطة بها،<br />والظروف التي دفعت إليها، ولهذا لابد من التريث،<br />وعدم الاستجابة لردود الأفعال.<br />وكذلك ينبغي أن ينحصر الحكم في مشروعية هذا العمل<br />أوعدم مشروعيته، أما أن يتخطاه بالحكم بالشهادة<br />لفاعله نفياً أوإثباتاً فهذا مما لا يعلمه إلا علام<br />الغيوب، فالمطلوب معرفة هل هذا العمل مشروع أم لا؟<br />هل له سند في الشرع والنظر أم لا؟ أما أن نشهد على<br />فاعله بالشهادة أونحرمه منها فهذا تحكم وتقوُّل على<br />الله عز وجل.<br />من الذين نُقِل عنهم أنه حكم بعدم مشروعية هذه<br />العمليات، وأنها داخلة في دائرة الانتحار سماحة<br />الشيخ محمد بن صالح العثَيمين رحمه الله في<br />كتاب \"فتاوى الأئمة في النوازل المدلهمة\"1، مستدلاً<br />على ذلك بقوله تعالى: \"ولا تقتلوا أنفسكم إن الله كان<br />بكم رحيماً\"2، ودافعاً لدليل واحد من عدة أدلة<br />للمجيزين لذلك، وهو دلالة غلام أصحاب الأخدود للملك<br />الغشوم على كيفية قتله، بأن قتل الملك إياه كان<br />سبباً لإسلام أمة، وفي صنيع هؤلاء لا يُسْلِم أحد، بل تشتدُّ<br />الوطأة على المستضعفين من إخوانهم، وفيما قاله<br />الشيخ رحمه الله نظر، لأن هذه العمليات الجهادية لها<br />أغراض عديدة وفوائد كثيرة، يرجوها القائمون بها من:<br />1. النكاية بالعدو.<br />2. وإرهابهم وزرع الخوف والرعب في قلوبهم.<br />3. واستنزاف طاقات العدو.<br />4. وجعلهم يعيشون في قلق وعدم استقرار، مما يدفع<br />كثيراً منهم إلى الفرار والانسحاب.<br />وكل ذلك وغيره كائن إن شاء الله بسبب هذه العمليات<br />الاستشهادية المباركة.<br />فاستشهاد غلام أصحاب الأخدود لم يقتصر على إسلام كل<br />الحاضرين، وإنما أرهب الملك وأخافه، وزعزع سلطانه،<br />ودك أركان دولته، وفضَّ الناس من حوله.<br />ومما يُحمد لسماحة الشيخ العثيمين رحمه الله أنه رجا<br />لمن فعل ذلك متأولاً عدم المؤاخذة، حيث قال: (ولكن من<br />فعل هذا مجتهداً ظاناً أنه قربة إلى الله عز وجل فنسأل<br />الله تعالى أن لا يؤاخذه لأنه متأول جاهل).3<br />وهذا مما يدل على أن هناك فرقاً عنده بين المنتحر<br />والمتأول جواز هذا، ومما لا شك فيه أن المتأولين<br />لجواز هذا الأمر منهم أهل علم وفضل.<br />وقول الشيخ رحمه الله في شرح حديث قصة أصحاب الأخدود،<br />محدداً الفوائد المستنبطة منه: (إن الإنسان يجوز أن<br />يغرِّر بنفسه في مصلحة عامة للمسلمين، فإن هذا الغلام<br />دل الملك على أمر يقتله به ويهلك به نفسه)، وما<br />قرره الشيخ هو الذي تحققه العمليات الجهادية<br />الاستشهاد<br />Read the rest of this comment..."
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

