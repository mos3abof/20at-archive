[[comments]]
order = 11
subject = "رسالة من استشهادي للارض التي يموت من أجلها (بيرو)"
text = "صورتك هنا فوق الحيطان رسماها ايدى من زمان<br />اسمك صدي زى الادان رملاية بتصد الطوفان<br />في عشق الأرض أنا فارس<br />من يومي بجسمي وتكويني<br />ولنفس الأرض أموت حارس<br />بدمايا وشوقي وحنيني<br />يا بلادي يا غضبي وإيماني ويا داري وارضي وأوطاني<br />لساك الحب ونبض القلب وشكلي واسمي وعنواني<br />الأرض دي موش حد وأسوار<br />ولا خط سياسي خريطة وجار<br />الأرض بتكتب أغلي حوار<br />بين طينة الأرض وشراييني<br />راح أبوس الصورة و اغنيلك<br />واحلم بنسيمك وبطيرك<br />ما هو مقدرش أنا أعيش من غيرك<br />وياك أحلامي و سنيني<br />من يوم ما بعدنا وأنا لامحك<br />وبكمل نفسي بملامحك<br />وابني اللي في يوم هيشيل اسمك<br />يا عراقي يا إما فلسطيني<br />راح أفجر نفسي وأكون أفراح<br />ليا ولناسي أداوي جراح<br />وأقول الليل ينتهي بصباح<br />وإسلمي يا بلادي وضميني"
