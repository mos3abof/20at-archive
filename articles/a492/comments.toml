text = "الاخ هندزة وليس هندسة ...<br />تعرف حاجة عن الانكودينج واليونيكود<br />بلاش<br />تعرف اي حاجة بتلاته تعريفة عن الويندوز ؟؟؟<br />لو سمحت<br />معايا كده شوية ها اعطلك معلشي ...<br />افتح كنترول بانل<br />افتح ريجونال اند لانجويتش اوبشنز<br />دوس على زرار كاستامايز<br />بص تحت ها تلاقي حاجة اسمها ستاندارد ديجيتس<br />هي دي الطريقة اللي جهازك بيظهر بيها كل الارقام<br />سواء مكتوبة بالعربي او بالهندي او بالكوالالامبوري !!!<br />ومعلش العب غيرها ... فلتت منك المرة دي يا هند ... زة !!!<br />وبلاش تتنطط احسن تتكعبل ويبقى شكلك وحش وانت بتقع ...<br />والله مكسوفلك يا راجل !!!"
