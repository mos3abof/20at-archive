subject = "الجزء 6 من 15 المعاهدات والتحالفات والهدن ... وائل"
text = "رأي في المعاهدات والتحالفات والهدن<br />السابق | الصفحة الرئيسية للموضوع | التالي<br />نيجى لموضوع المعاهدات التى يبرمها اولى الامر لمصلحة عموم المسلمين :<br />نجد ان الوفاء بالعهد من الايمان - وأوفوا بالعهد إن العهد كان مسؤولا - اما المنافق فهو يغدر<br />وينقض عهده - واذا عاهد غدر<br />وقال رسول الله صلى الله عليه وسلم : ما نقض قوم العهد إلا أديل عليهم العدو - عن ابن عباس<br />يعنى نقض العهد مع الكفار محرم وخيانة ومن اسباب هزيمة المسلمين عقوبة من الله<br />واتفق الفقهاء على ان نقض مجموعة من الكفار العهد لا يعنى معاملة غيرهم من الكفار كناقضي العهد<br />ومثال على ذلك الوفاء بالعهد الاية الكريمة التى نزلت حول صلح الحديبية:<br />ولا يجرمنكم شنآن قوم أن صدوكم عن المسجد الحرام أن تعتدوا - المائدة<br />اذ كان بموجب صلح الحديبية لا يحق للمسلمين العمرة الى المسجد الحرام وللكفار منعهم<br />واذا اعتدى المسلمون على على هؤلاء الكفار يكونوا قد خالفوا شرع الله<br />هل فيه اكتر من منع المسلم عن بيت الله الحرام ؟؟؟<br />ومع ذلك انزل الله تعالى فيها قرآنا تثبيتا لمبدأ الحفاظ على العهود مع الكافرين !!!<br />وزيادة على ذلك ومن مكارم اخلاق وشهامة المسلم التى يجب ان يتحلى بها قول النبى:<br />أد الأمانة الى من ائتمنك ولا تخن من خانك<br />شايفين لا تخن من خانك دى ؟؟؟<br />شايفين الشهامة والمروءة كرم الاخلاق !!!<br />عندنا برضه سيدنا محمد صلى الله عليه وسلم عندما هاجر الى المدينة<br />عاهد كل من بنى قينقاع وبنى النضير وبنى قريظة<br />فنقض بنو قينقاع العهد فحاربهم النبى ولكن لم يحارب كل اليهود بسبب ذلك<br />فقد ظل صلوات الله وسلامه عليه على عهده مع بنى النضير وبنى قريظة<br />حتى نقض بنو النضير عهدهم اولا فحاربهم<br />ثم بنو قريظة بعد غزوة الاحزاب فحاربهم ايضا<br />وعند اول نقد للعهود من اليهود لم يتبع المسلمون عواطفهم<br />ولم يستعدوا العالم كله عليهم ويقولوا كلهم كفار وكلهم يهود<br />لا فالاسلام حكمة وحنكة وشرف<br />والمسلم لا يدع عاطفته تتحكم به ويتبع اوامر الشرع ويصبر حتى يجعل الله له مخرجا<br />ونحن بعيدون كل البعد عن ذلك الان<br />فنحن نكره اليهود والنصارى والامريكان والهندوس والروس والكل كليلة وندعى عليهم ونحرض عليهم !!!<br />يعنى ما سبناش حد فى العالم فى حاله !!! طب ده كلام بالذمة ؟؟؟<br />كمان فيه حاجة بالمرة عاوز اقولها من زمان عن غزو العراق للكويت<br />قال تعالى : وان طائفتان من المؤمنين اقتتلوا فاصلحوا بينهما فان بغت احداهما على الاخرى فقاتلوا التي تبغي حتى تفئ الى امر الله - الحجرات 9<br />ليه احنا ما عملناش كده بدل ما نجيب الامريكان ونتحالف مع الشيطان على راى القذافى ؟؟؟<br />وادى النتيجة ماثلة امامنا<br />كل واحد خايف على دهبه وبتروله ومش مهم الاسلام ولا الدين<br />مش اية فى القران اهه ؟؟؟<br />كمان الجهاد محرم فى اشهر رجب وذى القعدة وذى الحجة ومحرم الا اذا بدا الكفار بالقتال<br />لقوله تعالى : الشهر الحرام بالشهر الحرام والحرمات قصاص فمن اعتدى عليكم فاعتدوا عليه بمثل ما اعتدى عليكم - البقرة 194<br />وده معنى الاعتداء بالمثل مش معناه قتلوا مدنيين نقتل احنا كمان مدنيين !!!<br />اما موضوع قتل المسلمين والاسرى والنساء والاطفال والتجار اذا تترس العدو بهم<br />ولم يكن هناك طريق للانتصار غير ذلك فلم اجد له اصلا فى المصادر السنية<br />ولكن فى رواية يتداولها الشيعة تقول:<br />قال حفص بن غياث : سألت ابا عبد الله عن مدينة من مدائن الحرب هل يجوز ان يرسل عليها الماء او تحرق بالنار او ترمى بالمنجنيق حتى يقتلوا ومنهم النساء والصبيان والشيخ الكبير والاسارى من المسلمين والتجار ؟ فقال : يفعل ذلك بهم ولا يمسك عنهم لهؤلاء ولادية عليهم للمسلمين ولا كفارة<br />اما عن قوله تعالى : فان كان من قوم عدولكم وهو مؤمن فتحرير رقبة مؤمنة - النساء 92<br />فهو عن القتل الخطأ فى الحرب وليس القتل المتعمد !!!<br />وهناك مسائل انا اثرتها من قبل فى المجموعة حول اننا من الممكن ان نكذب ونتظاهر باتباع الغرب ونعمل اننا اصحابهم وبنراعى مصالحهم وعملاؤهم حتى نقوى انفسنا بالداخل وناخذ منهم خبراتهم وتكنولوجياتهم واستثماراتهم واموالهم ووجدت حديث لرسول الله يدعم قولى هذا فحبيت اذكره:<br />قال اسحاق بن عمار عن جعفر عن ابيه ان عليا عليه السلام كان يقول : سمعت رسول<br />ا<br />Read the rest of this comment..."
