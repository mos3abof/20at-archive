order = 62
subject = "الجزء 9 من 15 الشورى ... وائل عباس"
text = "عن الشورى<br />السابق | الصفحة الرئيسية للموضوع | التالي<br />اما عن الشورى فى الاسلام والعلاقة بين ولى الامر والرعية ولو انها مش مجال الحديث هنا<br />فوجدت مجموعة احاديث ارجو انها تفيدكم<br />عن أبي هريرة قال‏:‏ ‏ما رأيت أحدًا قط كان أكثر مشورة لأصحابه من رسول اللّه صلى اللّه عليه وآله وسلم‏ - رواه أحمد والشافعي‏<br />وعن معقل بن يسار قال‏:‏ ‏سمعت رسول اللّه صلى اللّه عليه وآله وسلم يقول‏:‏ ما من عبد يسترعيه اللّه رعية يموت يوم يموت وهو غاش لرعيته إلا حرم اللّه عليه الجنة‏ - متفق عليه<br />وقوله : ‏ما من أمير يلي أمور المسلمين ثم لا يجتهد لهم ولا ينصح لهم إلا لم يدخل الجنة‏ -‏ رواه مسلم<br />وعن عائشة قالت‏:‏ ‏سمعت رسول اللّه صلى اللّه عليه وآله وسلم يقول‏:‏ اللّهم من ولي من أمر أمتي شيئًا فشق عليهم فاشقق عليه ومن ولي من أمر أمتي شيئًا فرفق بهم فارفق به‏ - رواه أحمد ومسلم‏<br />وعن جابر قال‏:‏ ‏‏كان رسول اللّه صلى اللّه عليه وآله وسلم يتخلف في المسير فيزجي الضعيف ويردف ويدعو لهم‏ - رواه أبو داود‏<br />السابق | الصفحة الرئيسية للموضوع | التالي"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

[[comments]]
order = 63
subject = "الجزء 10 من 15 المنهج الصحيح في الجهاد ... وائل عب"
text = "المنهج الصحيح في الجهاد<br />السابق | الصفحة الرئيسية للموضوع | التالي<br />والمنهج الصحيح فى الجهاد يخالف ما يقوم به من يدعون الجهاد الان<br />فمن شروط الجهاد المنصوصة صراحة فى احاديث النبى دعوة الكفار الى الاسلام<br />يعنى ما يقام به الان من تفجيرات فى مدنيين لم يسمعوا حتى بالاسلام ينافى الجهاد من اساسه<br />بل وعلى العكس يغرس فى نفوسهم نفورا وكراهية للاسلام من قبل ان يعرفوه<br />عن سهل بن سعد‏:‏ ‏أنه سمع النبي صلى اللّه عليه وآله وسلم يوم خيبر فقال‏:‏ أين علي فقيل إنه يشتكي عينيه فأمر فدعا له فبصق في عينيه فبرأ مكانه حتى كأنه لم يكن به شيء فقال‏:‏ نقاتلهم حتى يكونوا مثلنا فقال‏:‏ على رسلك حتى تنزل بساحتهم ثم ادعهم إلى الإسلام وأخبرهم بما يجب عليهم فواللّه لأن يهتدي بك رجل واحد خير لك من حمر النعم‏ - متفق عليه‏<br />عن ابن عباس قال‏:‏ ‏ما قاتل رسول اللّه صلى اللّه عليه وآله وسلم قومًا قط إلا دعاهم‏ - رواه أحمد‏<br />وهناك من الاحاديث ما يقول بان من يسلم من الكفار بامكانه ان يهاجر من بلده ويعيش بين المسلمين<br />والحديث التالى ايضا يلخص قواعد الجهاد وادابه<br />عن سليمان بن بريدة عن أبيه قال‏:‏ ‏كان رسول اللّه صلى اللّه عليه وآله وسلم إذا أمر أميرًا على جيش أو سرية أوصاه في خاصته بتقوى اللّه ومن معه من المسلمين خيرًا ثم قال اغزوا بسم اللّه في سبيل اللّه قاتلوا من كفر باللّه اغزوا ولا تغلوا ولا تغدروا ولا تمثلوا ولا تقتلوا وليدًا وإذا لقيت عدوك من المشركين فادعهم إلى ثلاث خصال أو خلال فأيتهن ما أجابوك فاقبل منهم وكف عنهم ادعهم إلى الإسلام فإن أجابوك فاقبل منهم وكف عنهم ثم ادعهم إلى التحول من دارهم إلى دار المهاجرين وأخبرهم أنهم إن فعلوا ذلك فلهم ما للمهاجرين وعليهم ما على المهاجرين فإن أبوا أن يتحولوا منها فأخبرهم أنهم يكونون كأعراب المسلمين يجري عليهم الذي يجري على المسلمين ولا يكون لهم في الفيء والغنيمة شيء إلا أن يجاهدوا مع المسلمين فإن هم أبوا فسلهم الجزية فإن أجابوك فاقبل منهم وكف عنهم وإن أبوا فاستعن باللّه عليهم وقاتلهم وإذا حاصرت أهل حصن فأرادوك أن تجعل لهم ذمة اللّه وذمة نبيه فلا تجعل لهم ذمة اللّه وذمة نبيه ولكن اجعل لهم ذمتك وذمة أصحابك فإنكم إن تخفروا ذمتكم وذمة أصحابكم أهون من أن تخفروا ذمة اللّه وذمة رسوله وإذا حاصرت أهل حصن وأرادوك أن تنزلهم على حكم اللّه فلا تنزلهم على حكم اللّه ولكن أنزلهم على حكمك فإنك لا تدري أتصيب فيهم حكم اللّه أم لا‏<br />ومهمة قوى حته تخفروا ذمتكم دى<br />يعنى وزرهم لو اعطوا عهد باسم الاسلام ونقضوه اكبر من لو اعطوا عهد باسمهم<br />مش زى اليومين دول<br />كل واحد بيعمل اللى هو عاوزه وبيقول باسم الاسلام !!!<br />وده اللى علشانه انا كاتب الايميل ده !!!<br />السابق | الصفحة الرئيسية للموضوع | التالي"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

[[comments]]
order = 64
subject = "نونا المجنونة"
text = "اخ فلسطيني انت تعرفني عشان تقول ان عايزة الدين تيك اواي او الكلام الي انت قلته؟؟؟؟<br />انا الحمد لله مهندسةمعمارية شاطرة و اتعلمت تصميم مواقع و تطويرها و عمل قواعد بيانات و asp و بدرس دبلوم هندسة ادارية الحمد لله مش جاهلةو نفذت مشاريع و سني صغير مش كبيرة يعني ولا بكره ان اقرا او اتعلم لكن انت نفسك تبقي كداب لو قلت انك تقدر تقعد علي الكمبيوتر تقراء كل ده لا عينك و لا اعصابك هتقدر و متحكمشي علي حد متعرفوش"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

[[comments]]
order = 65
subject = "فلسطيني"
text = "نونا المجنونة :<br />لا والله مش جاية اهيس بس فعلا انا مش فاهمة حاجة بجد<br />الكلام كتر قوي صعب جدا ان حد يقرا كل ده و كل واحد بيقول كلام عكس التاني و كلام كبير و فعلا انا مش فاهمة اي حاجة<br />طيب يا ست نونا<br />لما انت كويسة وبنت حلال مع اني والله ما قلتش غير كده ولا قصدتك بالكلام<br />تقدري تقوليلي لما انتي مش قادرة تقري يبقى الاخوة اللي بيكتبوا الكلام ده يعملوا ايه ؟؟؟ يولعوا في نفسهم علشان هما دود كتابة ؟؟؟ يعني الراجل وائل عامل بحث 15 جزء ده يروح يعملهم قراطيس لب ؟؟؟ وفي النهاية الناس بتتعب ومش عاوزة تقرا كلامهم !!! وعاوزين الحقيقة جاهزة مغلفة ؟؟؟ وضحيلي لو سمحتي انتي قصدتي ايه من كلامك ؟؟؟ واحب اقول للاستاذ وائل عباس ... بس ما تكملشي ... محدش بيقرا ولا بيفهم ... تاعب نفسك ليه ؟؟؟"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

[[comments]]
order = 66
subject = "فلسطيني"
text = "واحب اقولك اه انا قريت كل الكلام حتى الان ولا عيني تعبت ولا اعصابي تعبت ... وبالمناسبة انا كمان مطور مواقع الى جانب اني مهندس شبكات كمبيوتر ومصمم جرافيكس وفلاش الى جانب اشياء اخرى ومترجم وباتكلم انجليزي وفرنساوي والماني وايطالي واسباني وقريبا عبري وروسي ... الى جانب اني باحث واكتب مقالات للصحف والمجلات وربما تسمعين عني ... لكنني لا احبذ ان اكشف شخصيتي الحقيقية واكتفي بهذا الاسم اللذي اتخفى وراؤه من المغرضين ..."
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

