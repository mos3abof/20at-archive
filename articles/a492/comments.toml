[[comments]]
order = 81
subject = "الجزء 11 من 15 سياسة وصحافة واحصائيات"
text = "ماذا يقول اهل السياسة والصحافة والاحصائيات ؟<br />السابق | الصفحة الرئيسية للموضوع | التالي<br />ناخد كده استراحة ونتكلم من منطلق سياسى :<br />وها ناخد مقتطفات من ما كتبه صحفى فلسطينى اسمه محمد هواش حيث يقول :<br />و هناك فئة أخرى لا تريد للتسوية أن تقوم بين إسرائيل والنظام الفلسطيني الراهن، وهم يقتنصون فرصا كي يتمكنوا من جعل الحل العسكري هو \"اللعبة الوحيدة في المدينة\" . كما انهم من مواقعهم السياسية يريدون للمعركة أن تكون \"نظيفة\" :أي أن تقوم إسرائيل في عهد شارون بتصفية النظام الفلسطيني المعتدل ,لأنه يحظى بشرعية والكفاح واعتراف دولي وعربي مناسب، لم يكن ممكنا تجاوزه<br />مش الكلام ده انا قلته يا جدعان ؟؟؟<br />جبت انا حاجة من عندى ؟؟؟<br />اهو شاهد من اهلها كمان اهه !!!<br />ويقول ايضا :<br />بل إن المعركة اليوم حول الإصلاح هي صراع على قيادة المعركة السياسية وتحديد اتجاهاتها<br />ويقول :<br />فالمجتمع الفلسطيني انقسم على تقييم نتائج العمليات الانتحارية من دون أن يرافق هذا الانقسام أي حوار جدي على الورق وفي وسائل الإعلام، ما جعل المعركة تسير بمشاعر الجمهور المتأججة، وليس بخطة عمل تحتكم لمعايير العمل الوطني وتحدد الفائدة والضرر<br />ويقول :<br />فقد نحتاج إلى مراجعة للعمليات الانتحارية، وهي عدة عمليات استهدفت المدنيين الإسرائيليين، بتوقيت سياسي وهدف سياسي لا علاقة له بالعمل الوطني ... كما أنها لم تجلب إلا الضرر للمجتمع الفلسطيني<br />والضرر هنا ليس فقط بانتقاماً إسرائيلياً قوياً وتدمير خطير لبنية المجتمع المدني الفلسطيني , بل بتحويل الأصدقاء إلى أعداء ... إن هذه العمليات، في معظمها ، عمليات ضارة لأنها تفقد الفلسطينيين وسائل مقاومة جديرة بالاحترام وجديرة بجلب نتائج سياسية افضل ... إن استناد هذه العمليات على فكرة اختراق العمق الأمني للمجتمع الإسرائيلي هي مجر د وهم ,لأن الأمن يمكن اختراقه من دون خسارة الرأي العام في إسرائيل وفي أوروبا وأميركا ، التي باتت تتحدث عن الفلسطينيين كإرهابيي،ن وليس كمناضلين من اجل الحرية، كما هم في الواقع، حيث خسر الفلسطينيون في هذه المعركة جزءا كبيرا من رصيدهم الأخلاقي ، خاصة بعد هجمات 11 أيلول ... تزايد رصيد هؤلاء الذين ما يزالون يتأملون ولا يميزون بين ما يريده الجمهور وما يحتاجه<br />ويقول والكلام ده مهم لانى انا قلته بالضبط قبل كده :<br />ومن نافلة القول إن العمل العسكري الفلسطيني ينبغي أن يستهدف إسرائيليين وإيقاع الخسائر بهم، ولكن ليس في المدن والمراقص وصالات الأفراح، بل في ساحات المعارك مع عناصر الجيش والأجهزة الأمنية، وليس مهما عدد القتلى .المهم أن تبقى روح المقاومة عالية وتحافظ على تفوقها المعنوي كتعبير عن حركة تحرر وطني ذات بعد إنساني ... وحصر المعركة في الأراضي المحتلة، ما يبرر جميع العمليات التي تطال عسكريين ومواقع عسكرية ومنشآت عسكرية وأخرى مدنية في الأراضي المحتلة . إن اختراق العمق الأمني الإسرائيلي ممكن، من خلال عمليات تفجير تطال هذا العمق، من دون تعريض حياة المدنيين للخطر<br />ويقول كمان :<br />وإذا كانت هذه العمليات تستهدف إيقاع اكبر عدد ممكن من الخسائر، فالأولى أن تستهدف حواجز ودوريات الجيش الإسرائيلي، التي تقوم بإهانة الفلسطينيين، وتمنعهم من التنقل والخروج إلى أعمالهم، وتغتال بعضهم، وتصطاد فتيانهم، وترسلهم إلى المعتقل !!!<br />سبحان الله<br />كلامى ده ولا مش كلامى ؟؟؟<br />ويقول :<br />ولكن هناك فرق أن يخرج الجيش إلى احتلال المدن، وفي يده وإعلامه حق الانتقام والرد على عملية انتحارية تستهدف قلب المدن الإسرائيلية وتقتل عددا لا بأس به من المدنيين ، وبين أن يخرج لعملية عدوانية من دون مبررات قوية ... ويسهل على الدول العربية والصديقة وبعض الدول المحايدة أن تتحرك مع المجموعة الدولية بهوامش حركة أوسع بما لا يقاس, ويضع في أيديها أوراق قوة أفقدتها إياها العمليات الانتحارية .لقد اضطرت الدول العربية إلى إدانة العمليات الانتحارية وتشبيهها بالإرهاب، على الرغم من تفهم دوافعها وأسبابها العميقة المتمثلة بالاحتلال<br />شوفوا كلام الناس العاقلة الحكيمة<br />مش الناس الغضبانة المجنونة المدفوعة بعواطفها اللحظية !!!<br />وهنا بقى يتطرق لنقطة خطيرة وهى الصراع على السلطة تانى :<br />لقد نقلت العمليات الانتحارية المعركة إلى شرعية السلطة، وهذا هو الخطر في السجال . مع أن المقاومة البطولية الباسلة للمواطنين الفلسطينيين وأجهزة الآمن وتحديدا عندما كان الطابع الرئيسي ذا بعد مدني مع بعض الأنشطة العسكرية الدفاعية لاقت أوسع تأييد وتعاطف دوليين، وحدا بالإدارة الأميركية أن تطلب من<br />Read the rest of this comment..."
