text = "شروط الجهاد<br />السابق | الصفحة الرئيسية للموضوع | التالي<br />والجهاد عملا بسنة رسول الله يكون تابعا لمصلحة المسلمين<br />فاذا اقتضت مصلحة المسلمين الجهاد فليجاهدوا<br />اما اذا كان فى الجهاد ضرر بسبب ضعف المسلمين او عدم قدرتهم فهو خطأ<br />واللى يقرر الموضوع ده ليس رجال الدين وحدهم ولكن بالتشاور من اولى الامر<br />واهل الخبرة بالحرب والراى فى الدولة<br />يعنى ما ينفعشى واحد يطلع يفتى بالجهاد من غير استشارة اولى الراى والامر والخبرة !!!<br />تعالوا نشوف كده:<br />كل حكم في شرعنا يهدف لحفظ النفس والمال والعرض والنسل والدين والمفاضلة بين هذه الأشياء منوطة بقاعدة درء المفسدة وجلب المصلحة والأولى مقدمة على الثانية<br />أين المصلحة التي تحققت إذا كان العدو يستمر في إنشاء المستوطنات ويتوافد إليها اليهود من شتى بقاع الأرض ؟ فهل شعر هؤلاء بأي تهديد تشكله عليهم هذه العمليات وهم أحرص الناس على حياة ؟<br />أين المصلحة إذا كان العدو يجد الذريعة بعد هذه العمليات لينكل بعائلات منفذي هذه العمليات فيهدم منازلهم ويشردهم ويغتصب أرضهم بعد أن يتلفها ويعتقل حتى النساء منهم ؟<br />أين المصلحة حين نخسر مسلما يفجر نفسه وربما لا تحدث في العدو أي إصابة بل ربما يُقتل قبل أن يتم عمليته ؟ أليس من الأولى أن يحافظ على حياته ويقاتل اليهود ؟<br />أين وجه الشبه بين ما فعله الصحابة الكرام عليهم رضوان الله وبين ما يفعله هؤلاء في هذه العمليات ؟ فالصحابة كانوا في قتال واستمروا في القتال وهم يقتحمون المهالك حتى ماتوا عليهم رضوان الله , أما هؤلاء قتلوا أنفسهم دون قتال وربما لم يقتلوا من العدو أحدا<br />ما أدرانا بنية هؤلاء ؟ مثلا , هل كانوا ينفذون هذه العمليات حمية ؟ هل كانوا ينفذونها يأسا من الحياة ؟ أم فعلا نفذوها للنيل من العدو وطلب الشهادة ؟ , كل هذه علمه عند الله سبحانه وتعالى , فهو سبحانه أعلم بمن قتل في سبيله وهو أعلم بالشهداء إذا يكفينا أن نقول أنها عمليات فدائية من باب حسن الظن بإخوتنا<br />اما اللى بيعملوه حماس من انهم بيقولوا دا احنا عملنا عمايل وسوينا الهوايل وها نهزم اسرائيل وخربنا اقتصادهم وها نخليهم يهاجروا وكل الاونطة دى تخيلوا مذكورة فى القرآن ومنهى عنها ولو مش مصدقين الاية اهه :<br />قال تعالى : ولا تكونوا كالذين خرجوا من ديارهم بطرا أو رئاء الناس<br />وتعالوا ناخد من كلام ابن تيمية اللى دايما بياخدوا من كلامه اللى يعجبهم ويسيبوا الباقى<br />قال ابن تيمية : الواجب ان يعتبر في أمور الجهاد برأي أهل الدين الصحيح الذين لهم خبرة بما عليه أهل الدنيا<br />يعنى اهل الدين اللى مش دراويش واللى عارفين الدنيا كويس وعايشينها !!!<br />كما ان الجهاد لا يجب الا للضرورة القصوى وهو ليس ميزة او هواية اى شىء يرتجى<br />ومن ذلك قول الله عز وجل فى غزوة الاحزاب : وكفى الله المؤمنين القتال<br />وقول رسوله الكريم : لا تتمنوا لقاء العدو - وهو حديث متفق عليه<br />وقوله ايضا : لتظهرنّ الترك على العرب حتى تُلحقها بمنابت الشيح والقيصوم، فأنا أكره قتالهم لذلك - رواه أبو يعلى<br />ومن الشروط الشرعية للجهاد هى القدرة لقوله تعالى : وأعدوا لهم ما استطعتم من قوة - الانفال 60<br />يعنى اذا انتفت هذه القدرة لا جهاد<br />وقاعدة شرعية اخرى اتفق عليها العلماء هى انه لا جهاد اذا كانت قوة العدو اكثر من ضعف قوة المسلمين<br />لقوله تعالى : الآن خفف الله عنكم وعلم أن فيكم ضعفا فان يكن منكم مائة صابرة يغلبوا مائتين وان يكن منكم ألف يغلبوا ألفين باذن الله والله مع الصابرين - الانفال 66<br />وتفسير القرطبى بيقول ان الاية هنا للتخفيف على المسلمين وعدم تحميلهم مالا طاقة لهم به<br />وطبعا واضح فى اخر الاية الامر المباشر بالصبر حتى يتحقق للمسلمين التكافؤ ثم يخرجون للجهاد<br />الصبر وهو ما لا يتحلى به المسلمون اليوم ويحلون الجهاد بدون تحقق شروطه !!!<br />كمان نيجى للسنة النبوية:<br />ما فر من فر من أكثر من اثنين - رواه البخاري عن ابن عباس<br />فيه اكتر من كده شروط واضحة بينة للجهاد ؟؟؟<br />نيجى بقى لاذن ولى الامر<br />يقول الله تعالى فى كتابه :<br />انما المؤمنون الذين آمنوا بالله ورسوله واذا كانوا معه على أمر جامع لم يذهبوا حتى يستأذنوه<br />يعنى امر الجهاد جامع يجمع له الجيوش مش يطلع واحد او اتنين ويقولوا ها نجاهد !!!<br />وشفتوا موضوع الاستئذان من ولى الامر ده<br />واتفق الفقهاء بعد ذلك حول وجوب استئذان ولى الامر حتى ولو كان فاجرا !!!<br />Read the rest of this comment..."
