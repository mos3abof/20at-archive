subject = "مصـ( الخير )ـعب"
text = "السلام عليكم و رحمة الله وبركاته<br />الأخ \" الحكاية لسة فيها \"<br />حضرتك لو طلعت 9 مشاركات فوق مشاركة حضرتك<br />هتلاقي فتوى طويلة عريضة<br />من اللي يؤيدوا \"العمليات الاستشهادية \"<br />ده أولا ...<br />ثانيا لا يصح بأي حال من الأحوال<br />أن نتهم العلماء والفقهاء<br />اتهامات مجردة من الأدلة الكافية<br />لأننا \" متبعون \" و لسنا \" مجتهدين\"<br />أو بمعنى آخر ؛<br />لأنك لم تصل بعد للمرحلة التي تعطيك<br />مجرد الحق في النظر في أمر أولئك العلماء!!!<br />أخ \" فلسطيني \"<br />لم أكمل لأنني أنتظر ردك<br />بقالك فترة ما ظهرتش<br />و لعل المانع خيرا<br />و سلام من الله عليكم ورحمة منه وبركة<br />ترقبوا البيان التأسيسي للحلف الالكتروني الفظيع!!!<br />مهندس العمليات المستحيلة!!!"
