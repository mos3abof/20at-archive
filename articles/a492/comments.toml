[[comments]]
order = 26
subject = "بيرو"
text = "نكتب قصايد ليه يا تري ....؟؟؟<br />بنكتب قصايد لأن القضية عندنا منتهية ...<br />مبدأ من مبادئنا... حاجة مؤمنين بيها كويس قوي ...<br />لما كتبت القصيدة كتبتها لأني موش عايز أرد...<br />أو بمعني أصح لو رديت ردي موش هيكون منطقي ..<br />ياجماعة الموضوع موش فتاوي وبس رغم القيمة الكبيرة للفتاوي ..<br />الموضوع عندي موش محتاج لاكتر من قلب وعقل يوزنوا اللي بيحصل..<br />ده الكلام اللي انا قلته الأول ...واللي لسه بقوله لحد دلوقتي ...<br />أنا بحب الموضوعية جدا ...والديموقراطية كمان..<br />واول درس في الديموقراطية أني احترم اللي قدامي مهما كان..<br />وانا بحترم الأخ فلسطيني جدا ...<br />وبحبه كمان ...(!!!)<br />لكن غير قادر علي الإستمرار في هذا الحوار ,<br />انا لا أملك اسباب واضحة<br />قد يكون عجز أو جهل أو تخلف<br />موش مهم ...<br />المهم أني اعلن أنسحابي من هذا الحوار بغير ندم<br />اخ فلسطيني نلقاك في حوارات أخري قادمة..<br />وسيواصل الاخ مصعب الخير النقاش معك ومع الاصدقاء في عشرينات...<br />أما أنا فذاهب لبيتنا أناااااااااااااااااام ....(!!)"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

