subject = "الجزء 8 من 15 من يجب استئذانه قبل الخروج للجهاد"
text = "من يجب استئذانه قبل الخروج للجهاد<br />السابق | الصفحة الرئيسية للموضوع | التالي<br />نيجى بقى لموضوع العيال اللى بتنتحر فى فلسطين دى<br />وبيخرجوا وبيسيبوا اهلهم من غير اذن وفاكرين انها جهاد<br />هل اذن الوالدين ضرورى فى الجهاد ؟؟؟ تعالوا نبص كده<br />عن ابن مسعود قال‏:‏ ‏‏سألت رسول اللّه صلى اللّه عليه وسلم أي العمل أحب إلى اللّه قال‏:‏ الصلاة على وقتها قلت‏:‏ ثم أي قال‏:‏ بر الوالدين قلت‏:‏ ثم أي قال‏:‏ الجهاد في سبيل اللّه حدثني بهن ولو استزدته لزادني‏ -‏ متفق عليه‏<br />اى ان بر الوالدين تقدم على الجهاد والحديث التالى ايضا يدعم نفس السياق :<br />عن عبد اللّه بن عمرو قال‏:‏ ‏جاء رجل إلى النبي صلى اللّه عليه وآله وسلم فاستأذنه في الجهاد فقال أحيٌّ والداك قال نعم قال ففيهما فجاهد‏ - رواه البخاري والنسائي وأبو داود والترمذي وصححه‏<br />ورواية اخرى :<br />‏أتى رجل فقال‏:‏ يا رسول اللّه إني جئت أريد الجهاد معك ولقد أتيت وإن والدي يبكيان قال‏:‏ فارجع إليهما فأضحكهما كما أبكيتهما‏ - رواه أحمد وأبو داود وابن ماجه‏<br />وعن أبي سعيد‏:‏ ‏‏أن رجلًا هاجر إلى النبي صلى اللّه عليه وآله وسلم من اليمن فقال‏:‏ هل لك أحد باليمن فقال‏:‏ أبواي فقال‏:‏ أذنا لك فقال‏:‏ لا فقال‏:‏ ارجع إليهما فاستأذنهما فإن أذنا لك فجاهد وإلا فبرهما‏‏‏ - رواه أبو داود‏<br />وعن معاوية بن جاهمة السلمي‏:‏ ‏أن جاهمة أتى النبي صلى اللّه عليه وآله وسلم فقال‏:‏ يا رسول اللّه أردت الغزو وجئتك أستشيرك فقال‏:‏ هل لك من أم قال‏:‏ نعم فقال‏:‏ الزمها فإن الجنة عند رجليها‏ - رواه أحمد والنسائي‏<br />كمان فيه حد واجب استئذانه قبل الخروج للجهاد<br />مش ها تصدقوا مين !!! الدائن !!! يعنى اللى ليه عندك دين او فلوس !!!<br />عن أبي قتادة‏:‏ ‏عن رسول اللّه صلى اللّه عليه وآله وسلم أنه قام فيهم فذكر لهم أن الجهاد في سبيل اللّه والإيمان باللّه أفضل الأعمال فقام رجل فقال‏:‏ يا رسول اللّه أرأيت إن قتلت في سبيل اللّه تكفر عني خطاياي فقال له رسول اللّه صلى اللّه عليه وآله وسلم‏:‏ نعم إن قتلت في سبيل اللّه وأنت صابر محتسب مقبل غير مدبر ثم قال رسول اللّه صلى اللّه عليه وآله وسلم‏:‏ كيف قلت قال‏:‏ أرأيت إن قتلت في سبيل اللّه تكفر عني خطاياي فقال رسول اللّه صلى اللّه عليه وآله وسلم‏:‏ نعم وأنت صابر محتسب مقبل غير مدبر إلا الدين فإن جبريل عليه السلام قال لي ذلك‏ - رواه أحمد ومسلم والنسائي والترمذي وصححه‏ ولأحمد والنسائي من حديث أبي هريرة مثله<br />وعن عبد اللّه بن عمرو‏:‏ ‏أن رسول اللّه صلى اللّه عليه وآله وسلم قال‏:‏ يغفر اللّه للشهيد كل ذنب إلا الدين فإن جبريل عليه السلام قال لي ذلك‏ - رواه أحمد ومسلم‏<br />وعن أنس قال‏:‏ ‏قال رسول اللّه صلى اللّه عليه وآله وسلم‏:‏ القتل في سبيل اللّه يكفر كل خطيئة فقال جبريل إلا الدين فقال النبي صلى اللّه عليه وآله وسلم إلا الدين‏‏ - ‏رواه الترمذي وقال حديث حسن غريب‏<br />وهنا نجد الاسلام يقدم الحق الادمى على الحق الالهى<br />حتى تستقيم الامور الحياتية للبشر<br />فالاسلام دين دنيا واخرة وليس اخرة فقط !!!<br />والحديث ده حلو اوى علشان حبايبنا واخواتنا الحلوين فى السعودية والكويت والخليج<br />وهو عن حكم الاستعانة بمشرك فى حروب المسلمين :<br />عن عائشة قالت‏:‏ ‏خرج النبي صلى اللّه عليه وآله وسلم قبل بدر فلما كان بحرة الوبرة أدركه رجل قد كان تذكر منه جرأة ونجدة ففرح به أصحاب رسول اللّه صلى اللّه عليه وآله وسلم حين رأوه فلما أدركه قال‏:‏ جئت لأتبعك فأصيب معك فقال له رسول اللّه صلى اللّه عليه وآله وسلم‏:‏ تؤمن باللّه ورسوله قال‏:‏ لا قال‏:‏ فارجع فلن أستعين بمشرك قالت‏:‏ ثم مضى حتى إذا كان بالشجرة أدركه الرجل فقال له كما قال أول مرة فقال له النبي صلى اللّه عليه وآله وسلم كما قال أول مرة فقال لا قال فارجع فلن أستعين بمشرك قال فرجع فأدركه بالبيداء فقال له كما قال أول مرة تؤمن باللّه ورسوله قال نعم فقال له فانطلق‏ -‏ رواه أحمد ومسلم‏<br />وعن خبيب بن عبد الرحمن عن أبيه عن جده قال‏:‏ ‏أتيت النبي صلى اللّه عليه وآله وسلم وهو يريد غزوًا أنا ورجل من قومي ولم نسلم فقلنا إنا نستحي أن يشهد قومنا مشهدًا لا نشهده معهم فقال‏:‏ أسلمتما فقلنا‏:‏ لا فقال‏:‏ إنا لا نستعين بالمشركين على المشركين فأسلمنا وشهدنا معه‏ - رواه احمد<br />اما عن الحالات النادرة التى استعان فيها المسلمين بمشركين<br />فهى حالات لم يكن للمشركين فيها قوة او سلاح وكانوا تحت تحكم كامل من المسلمين<br />‏أن النبي صلى اللّه عليه وآله وسلم استعان بناس من اليهود في خيبر في حربه فلم يسهم ل<br />Read the rest of this comment..."
