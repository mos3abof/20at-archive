subject = "الجزء 7 من 15 اداب الجهاد ... وائل عباس"
text = "آداب الجهاد<br />السابق | الصفحة الرئيسية للموضوع | التالي<br />نيجى بقى لحاجة اسمها اداب الجهاد :<br />وها اذكر منها الان ما له صلة بموضوعنا وماهو متفق عليه بين الفقهاء :<br />- مكان القتال متفق عليه مع ولى الامر ومعروف لكافة المسلمين<br />- ان يكون الجيش مرتبا ومنظما يسمح بدخول المعركة بمعرفة اهل الخبرة العسكرية يعنى مش هبوللى<br />والسؤال هنا هل يوجد جيوش منظمة مستعدة فى فلسطين ؟؟؟<br />- ولى الامر هو من يختار التوقيت المناسب للجهاد حسب المصلحة !!! مهمة دى برضه !!!<br />- الكتمان<br />يعنى مثلا فى فلسطين مافيش كتمان واسرائيل عارفة تحركات بتوع المقاومة وبتغتالهم<br />والفلسطينيين بيرشدوا على بعض وحاجة اخر مسخرة على عكس العراق مثلا اللى محدش بيخون حد فيها<br />ده اليهود بيروحوا المخبأ وعارفين مين جوة بالضبط وامتى جه<br />اخر مرة دى راحوا المخبأ وقالوا فى الميكروفون سلم حالك يا فايز !!!<br />سبحان الله عرفوا الاسم والمكان والوقت بالضبط !!! لا حول ولا قوة الا بالله !!!<br />يبقى بالذمة ينفع الجهاد كده ؟؟؟<br />- عدم التمثيل او التشهير او حرق الجثث<br />- الغنائم لا تسرق وانما تجمع وتوزع بمعرفة ولى الامر<br />- من اعطيته الامان لا تغدر به ولا تقتله<br />- و قال بعض الفقهاء بحرمة تسميم الماء والهواء والارض ايضا<br />- كما ان اخراج المصاحف والكتب الفقهية فى الجهاد حرام شرعا<br />- واتفق الفقهاء على أنه لا يجوز في الجهاد قتل النساء ، والصبيان ، والمجانين ، والخنثى المشكل وكذلك لا يجوز قتل الشيوخ عند جمهور الفقهاء ولا يقتل الراهب في صومعته ولا أهل الكنائس الذين لا يخالطون الناس والذي يجن ويفيق وكذلك الفلاح الذي لا يقاتل . ومن قتل من لا يحل قتله ممن ذكر . فعليه التوبة والاستغفار كسائر المعاصي<br />- وحرم الفقهاء الغدر ، والغلول ، والمثلة ، لقوله صلي الله عليه وسلم : لا تغلوا ولا تغدروا ولا تمثلوا - أخرجه مسلم<br />والغلول في الجهاد الخيانة في المغنم بأن يخفي ما وقع في يده واما ما يحتاج إليه من الطعام وعلف الدواب والسلاح فهو جائز عند الحاجة . والغدر - الخيانة ونقض العهد واما المثلة فهي العقوبة الشنيعة مثل قطع الأنف أو الأذن أو غيره<br />- كما اختلف الفقهاء حول حرمة اغراق العدو بالماء او حرقه بالنار<br />فبعضهم يحله وبعضهم يحرمه اى ان المسألة هنا غير محسومة<br />ومن حكمة الاسلام التدرج فى مشروعية الجهاد على اساس قوة المسلمين<br />فعندما كان المسلمون ضعفاء وقلة لم يسمح لهم بالجهاد<br />قال تعالى : فاصفح الصفح الجميل - وقال ايضا : أدع إلى سبيل ربك بالحكمة والموعظة الحسنة ، وجادلهم بالتي هي أحسن<br />كما يقول تعالى : َلَمْ تَرَ إِلَى الَّذِينَ قِيلَ لَهُمْ كُفُّوا أَيْدِيَكُمْ - النساء 77<br />وتلك الفترة التى شهدت عذابات المسلمين واشد الاهانات للرسول من القاء امعاء الذبائح عليه وهو ساجد ... الخ ولو كان الاسلام يفتقد الى الحكمة لكان شرع الجهاد وقتها بحجة الدفاع عن النفس ولكن الاسلام دين عقلانى يتبع الواقع ولم يشرع حتى ولو الاغتيال ااو حتى القاء الحصى على الكفار !!!<br />وذلك حتى اشتد عود الاسلام واصبح بامكانه ان يقف لعدوه فانزل الله تعالى قوله:<br />أذن للذين يقاتلون بأنهم ظلموا<br />وده ممكن نطبقه فى العصر الحالى من حيث حالة الضعف والتشرذم والتفرق<br />ولا يعنى ذلك ان نستكين لهذه الحالة بل نعمل للخروج منها كما عمل المسلمون الاوائل<br />باكتساب الانصار والقوة المؤثرة القادرة على احداث التغيير المرجو<br />وفى هذا يقول الشيخ سعد بن تركى الخثلان:<br />أما عند ضعف المسلمين فإن الأدلة الشرعية وهدي الرسول صلى الله عليه وسلم يدل على أن جهاد الطلب لا يكون في حالة ضعف المسلمين، وذلك لما يترتب عليه من أضرار كبيرة بالإسلام والمسلمين وبالدعوة الإسلامية، فهذا مفهوم الجهاد في الإسلام والأمة الإسلامية لا تخلو من أحوال ثلاث، الحالة الأولى حالة القوة فهنا هي مأمورة بالجهاد دفعاً وبدءاً أي جهاد دفع وجهاد طلب.. الحالة الثانية: حالة الضعف الشديد فحينئذ هي مأمورة بترك الجهاد والصبر كما فعل النبي - صلى الله عليه وسلم - في الفترة المكية. الحالة الثالثة هي حالة وسطى بين الحالتين وحينئذ هي مأمورة بجهاد الدفع عند اعتداء الكفار عليها وأما جهاد الطلب فإنه حينئذ لا يكون بجهاد الطلب وانما يكون بجهاد الدفع فقط في الحالة الوسطى<br />ويقول الشيخ بن باز ولو ان لى تحفظات عليه وعلى المذهب الوهابى وممالئته لآل سعود :<br />أن حال المسلمين في هذا العصر أقرب إلى الحالة الوسطى، فتكون مأمور<br />Read the rest of this comment..."
