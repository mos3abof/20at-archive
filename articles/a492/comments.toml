[[comments]]
order = 6
subject = "عبد الله الشهراني"
text = "مع احترامي لكل من يؤيدها، اعارض هذه العمليات الانتحارية التي تهاجم المدنيين لعدة اسباب :<br />اولا : المدنيين لايجوز قتلهم ومهاجمتهم ، هؤلاء المدنيين بكل انواعهم اطفال وكبار سن ونساء ورجال في كامل صحتهم ممن لايحملون سلاحا ولايشاركون في ميدان الحرب ،،، قتل المدنيين محرم دينيا (حسب ما افهمه ولا انتظر فيه فتوى سياسية) ، قتل المدنيين قلة مروءة من المحاربين النبلاء والفرسان العرب حسب مااعرفه من تاريخ حروب العرب ،، هذا المبدأ الذي اؤمن به ينطبق على كل المدنيين بغض النظر عن ديانتهم او جنسهم او جنسيتهم سواء كانو عرب او مسلمين او يهود او بوذيين او شعب الاسكيمو ،، من يهاجم المدنيين قاتل وظالم مهما كانت ديانته او جنسه او جنسيته سواء كان بن لادن او جورج بوش او شارون او كوادر حماس ،،، لا احب ان اكون بوجهين ومعيارين وحكمين ، احدهما لي ولقومي والاخر للاخرين ،،، فهذا منتهى الظلم والبغي اذا كنا لانحب الظلم والبغي على انفسنا.<br />اذا كان شارون ونتنياهو يقتلون المدنيين فهذا لايجيز لنا ان نتبعهم ونقلدهم ،،، ببساطه لاننا يجب ان نعمم قيمنا ومبادئنا واخلاقنا ومن ضمنها تلك التي نلتزم بها في الحروب ، يجب ان تكون قيمنا ومبادئنا هي التي تحركنا وليس قيم ومبادئ اعدائنا ، لايجوز ان نكون ردة فعل ، وانما يجب ان نكون الفعل نفسه. يجب ان تكون اهدافنا عسكرية فقط.<br />ثانيا : العرب والفلسطينين في موقع ضعيف عسكريا واقتصاديا واعلاميا امام اسرائيل ، ولكنهم يملكون سلاحا قويا لازال ينخر في اسرائيل ومؤيديها في العالم ،،، هذا السلاح يتمثل في عدالة قضيتهم وبأنها قضية احتلال ومقاومة احتلال.<br />بعد عملية 11 سبتمبر ، اصبح العالم يعتبر ان اي عمل يهاجم المدنيين ليس له اي مشروعية ابدا حتى ولو كان مقاومة للاحتلال ،، هذه الحقيقة لم يفهمها الفلسطينين وغيرهم ممن لايزال يعيش حلما انه في جيش صلاح الدين الايوبي برمح وسيف في مواجهة رمح وسيف فقط متجاهلا ان جزء كبير من الحرب والمقاومة يتمثل في الاعلام وكسب تأييد العالم. لذلك كانت هذه العمليات اكبر عون لشارون وبقية عصابته المجرمة في اللوبي اليهودي الامريكي لتحويل القضية الفلسطينية الى قضية ارهاب يقتل المدنيين وليس قضية احتلال كما يزعم العرب. وتم ربط هذه العمليات الانتحارية بعملية نيويورك التي قتلت المدنيين الامريكان وادانها كل العالم ، وبذلك اصبح للمحتل الاسرائيلي شرعية في عدوانه. (ساهمت قناة الجزيرة في مؤازرة شارون بعرضها الغامدي بالشماغ الفلسطيني).<br />على الرغم من قوة اللوبي الاعلامي اليهودي في امريكا واوروبا ، فانه لم يستطع ان يقاوم استنكار الشعوب والعالم للعدوان الشاروني على المدنيين ، بل ان الكثير من اليهود الصهاينة اصبحوا يشتكون من انحياز الاعلام في اوروبا وامريكا ضد اسرائيل. فاذا كان هذا حال اسرائيل فما هو حال العرب والفلسطينين الذين لايملكون محطة تلفزيون او صحيفة بغير لغتهم. لذلك فان مثل هذه العمليات الحقت الكثير من الضرر بشرعية المقاومة لدى الشعوب التي لاتؤيد مهاجمة المدنيين ، تماما مثل الضرر الذي الحقه بن لادن بالمسلمين والاسلام بعملية نيويورك (حسبنا الله عليه).<br />ثالثا : قبل ايام قامت في اسرائيل تظاهرة ضمت اكثر من مائة الف متظاهر ضد الحرب وضد الاحتلال ،،، ايضا اعلن الكثير من اليهود عصيانهم في العمل في جيش الاحتلال ،، وهناك الكثير من الاسرائيلين يعارضون الاحتلال علانية ،، فهل يستطيع الانتحاري الذي يفجر نفسه في مطعم او معبد ان يتأكد من ان كل من يقتلهم هم من مؤيدي شارون وليس بينهم احدا من هؤلاء الذين يرفضون الاحتلال؟؟؟ احدى هذه العمليات حدثت في مقهى اجتمع فيه يهود بعد قيامهم بمظاهرة ضد الاحتلال امام منزل شارون ، والنتيجة انهم قتلى هذه العملية .<br />افضل جواب يمكن ان يقدمه شارون لمثل هؤلاء الذين يؤيدون الفلسطينين هو عملية انتحارية تقتل قريب او صديق لهم ليقول بعدها شارون \"هؤلاء الفلسطينيون لايرغبون في السلام ، سيقتلونكم حتى لو انسحبنا، دعوني انتقم لكم منهم على طريقتي\".<br />رابعا : لماذا لم توجه هذه العمليات الى الجيش الاسرائيلي؟ هذا الجيش بضباطه وافراده ومعداته ومقراته هدف مشروع لمن يقاوم الاحتلال ،،، حين تم تدمير دبابتين اسرائليتين وحين تم مهاجمة مركز للجيش قتل فيه ضباط كبار اهتزت وزارة الدفاع الاسرائيلية ولم نسمع كلمة استنكار واحدة لمثل هذه العمليات حتى من اليهود انفسهم لانها ببساطة مشروعة في كل عرف ودين ،،، فلماذا اذن لم تستمر وتتركز على الجيش فقط؟ الذي اخرج الجيش الاسرائيلي من لبنان مظاهرات امهات الجنود الاسرائليين الذين كان يتصيدهم حزب الله ،، اخرجه ايضا معنويات هؤلاء الجنود المحطمة من عمليات حزب الله ،،، اما صواريخ الكاتيوشا التي كانت تطلق على المستوطنات فلم تقتل مدنيين وانما كانت تدب الرعب فيهم فقط.<br />خامسا: حتى لو كان<br />Read the rest of this comment..."
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

