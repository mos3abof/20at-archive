subject = "الجزء 5 من 15 ... تابع شروط الجهاد ... وائل عباس"
text = "تابع شروط الجهاد<br />السابق | الصفحة الرئيسية للموضوع | التالي<br />كمان نيجى لموضوع السن المناسب للجهاد :<br />حيث قال ابن عمر رضي الله عنهما : عُرضت على النبي صلى الله عليه وسلم، يوم أحد وأنا ابن ثلاث عشرة سنة فلم يجزني، وعُرضت عليه يوم الخندق وأنا ابن خمسة عشر سنة فأجازني - متفق عليه<br />يعنى فيه سن محدد للجهاد متروك ليحدده اولي الامر كما يرون الصالح وحسب بنية الاجسام والعقول<br />ويشترط فى من يجاهد البلوغ واكتمال الرجولة على ما اتفق الفقهاء<br />واتفق الفقهاء ان لا جهاد للصبي او للمجنون او المرأة<br />حيث روى عن عائشة انها قالت : يا رسول الله هل على النساء جهاد ؟ فقال : جهاد لا قتال فيه الحج و الهجرة<br />ويقال ان سيدنا على قال : كتب الله الجهاد على الرجال والنساء فجهاد الرجل ان يبذل ماله ونفسه حتى يقتل في سبيل الله وجهاد المراة ان تصبر على ما ترى من اذى زوجها - والله اعلم بصحة ذلك<br />يبقى لما المقاومة الفلسطينية تبعت بنات يفجروا نفسهم هل ده صح ؟؟؟<br />دماغكم معايا والنبى مش عاوز حد ينام<br />احسن الايميل ده شكله ها يطول !!!<br />ومما اتفق عليه الفقهاء ايضا فى موضوع القدرة على الجهاد انه لا يحق الجهاد على الاعمى والاعرج والمقعد والشيخ الهرم والمريض والفقير الذى يعجز عن نفقة الطريق والعيال وشراء السلاح<br />وذلك تفسيرا لقوله تعالى : ليس على الاعمى حرج ولا على الاعرج حرج - الفتح 17<br />ليس على الضعفاء ولا على المرضى ولا على الذين لا يجدون ما ينفقون حرج - التوبة 91<br />والسؤال هنا هو تعالوا نطبق الكلام ده على فلسطين دولة فقيرة لا تجد ما تنفقه فى مواجهة عتويل ممول من الخارج من اقوى قطب فى العالم وكمان بيقولوا ما عندناش سلاح !!!<br />بس برضه مش باقول ان المقاومة الشريفة حرام او ها اناصر من حرموا الجهاد تماما<br />من الشيعة وبعض السلفيون ولو ان كلامهم منطقى وعملى وموضوعى<br />لكن انا هنا باركز على العمليات الانتحارية لكن ذكرت ذلك من باب العلم بالشيء فقط<br />علشان ماحدش يقول وائل بيحرض على عدم المقاومة !!!<br />السابق | الصفحة الرئيسية للموضوع | التالي"
archived = "2004-08-14"
