subject = "مسلمة"
text = "عملا بمبدا من قال لا ادرى فقد افتى .... انا لا اعرف<br />اذاذ كانت هذه العمليات حرام ولا حلال........ لكنى متعاطفة مع اصحابه جدا ... ولكن عندى مجموعة اسئلة يا اخ فلسطينى... اولا اذا كانت العمليات الاستشهادية حرام... ما البديل؟؟؟! اعتقد انه سؤال جديد لم يطرح من خلال مناقشاتكم الساخنة... ماذا نفعل لنرد علي مايفعلوه باطفالنا و نسائناو شيوخنا ردا موجعا..؟ سيادتك كنت متعاطف جدا مع الاطفال منهم والشيوخ ولم تتعاطف بنفس الكيفية مع نفس الفئة منا..؟؟ يا ترى لماذا؟؟!!!!!!!<br />و هل لو الاستشهادى ذهب و هو يحمل القنبلة فى يده ليرميها على مجموعة من اليهود فاردوه قتيلا يعتبر شهيد ام لا من وجهة نظرك؟؟؟<br />الرسول عليه الصلاة والسلام كان يمنع المسلمين من الجهاد فى البداية من قلة فى العدد... تفتكر لو الرسول عليه الصلاة والسلام معاه اكثر من 30 مليون رجل فلسطينى كان هايمنعهم من الجهاد..ام سيدفعهم له؟؟؟!!! و ما بالك به لو معه مليار ونصف مليار مسلم؟؟؟!!.... ما البديل للجهاد ونحن خمس تعداد العالم و نوازى بقية العالم قوة ومال وعتاد..لـــو توحدنا؟؟!!!!<br />واذا كانت حكومات الشعوب لا تستطيع ان تريد شعوب المسلمين ولا تتيح لها الجهاد فى سبيل الله فهل ننتظر الطير الابابيل لترجم اليهود بحجارة من سجيل ونحن مكتوفى الايدى ؟!!!<br />لا يا سيدى لن تنزل الطير الابابيل ولن يهزم اليهود الا بايدينا .<br />و اذا كانت كما تقول العمليات الاستشهادية حرام .... فلندعوا كل محب للاستشهاد ان يغير من اسلوب احاطة نفسه بالقنابل , فقط عليه ان يمسك فى يديه بها ليلقيها<br />على اعداء الله....و هو على نية صادقة ان ما يفعله لله وحده لا شريك له...فان نال الشهادة فهو فى سبيل الله<br />و لكن يا اخى لا تقول له كف يدك...فهم لن يكفوا ايديهم عنا... ولن يهزموا الا بايدينا ان شاء الله"
