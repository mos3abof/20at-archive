subject = "مصـ( الخير )ـعب ... خيبة أمل كبيرة !!!"
text = "كنت أظن أن الحوار سيأخذ مسلكا جيدا !!!<br />و أننا سنصل إلى نقاط اتفاق نتعاون فيها<br />و نقاط خلاف يعذر بعضنا بعضا فيها ...<br />و لكن -و ما أسوأها من كلمة-<br />أصابتني خيبة أمل شديدة<br />و كمية إحباط أعتقد أنها<br />تكفي لتدخلك التاريخ من أوسع أبوابه<br />فلم أصب بها من قبل<br />ولا أظن أحدا أصيب بمثلها<br />عندماتحول النقاش<br />الذي كنت أسعى به للحقيقة إلى مراء<br />و وجدتني أحاور واحدا ممن و صفتهم أنت بقولك:<br />\" شباب لا يعرف في الدين و لا البطاطا\"<br />و نظرا لأن الحوار تطرق إلى ثوابت لا تقبل التغيير<br />و لأنه اعتمد على فهم النص الظاهري<br />و السطحية في فهم الأمور و الاقتناع بها<br />\"فقد قررت باسم الحلف<br />أن أنسحب , لأن وقتي مهم بالنسبة لي<br />ولأن رسول الله (ص) قال:<br />\" أنا زعيم أهل بيت بربض الجنة لمن ترك<br />المراء و إن كان محقا \"<br />أو كما قال عليه الصلاة والسلام<br />و لأنه أيضا قال \" المراء لا يأتي بخير \"<br />و لا يسعني أن أقول لك في النهاية إلا :<br />\" اللهم اهد قومي فإنهم لا يعلمون \"<br />الأعضاء المؤسسين للحلف :<br />1.بيرو<br />2.مصعب الخير<br />3.مطر<br />4.أبوصلاح الدين"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

