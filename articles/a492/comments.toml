subject = "شخص ما"
text = "مع كامل احترامي لرأي \"فلسطيني\" وآراء الشيوخ الأفاضل الذين حرموا العمليات الاستشهادية.. لكنهم يتحدثون عن فقه الانتحار وليس فقه العمليات التي يضحي فيها الشخص بحياته في خدمة قضية وطنه التي هي قضية دينه<br />أما من أيدها، فهم أناس أعلم بالقضية وبخطورتها وبأبعادها .. وبكافة الظروف الدولية.. وأكيد هم حريصون على صورة الإسلام وأكيد حريصين على الرأي العام العالمي<br />وبمناسبة الرأي العام العالمي .. أنا أشبهه بمسرحية صامويل بيكت \"في انتظار جودو\".. فهذا الرأي العام العالمي لن يقف بجانبنا أبداً ولا فجرنا أنفسنا في أنفسنا يا سيدي.."
