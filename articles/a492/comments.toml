order = 78
subject = "فلسطيني"
text = "الاخت الكريمة نونا<br />كلامك ما اقدرشي اختلف معاكي فيه<br />الاخ اللي كتب في انتظار جودوت لصامويل بيكيت<br />القصة دي بالذات تحمل الكثير من المعاني وليس المعني اللذي قصدته فقط<br />انا اصلي درستها وكتبت في نقدها اكثر من كاتبها نفسه صامويل بكيت<br />اما كلامك عن ان اللذيت افتوا بالاباحة هم الاقرب وهم اللي بيفهموا فهو كلام غير موضوعي بالمرة ولا يصلح<br />وفي انتظار باقي بحث وائل عباس<br />فينك يا عم وائل ؟؟؟"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

[[comments]]
order = 79
subject = "شخص ما"
text = "سيدي الفاضل، لا يهمنا هنا من حلل \"في انتظار جودو\" أو حتى \"توتو\"..<br />ما أقصده أن مسألة الرأي العام العالمي وتحسين صورة الإسلام حتى يعلم الجميع حقيقة القضية .. هذا كله سراب.. وإذا أعتمدنا على أوروبا أو شعوبها أو أمريكا ورأيها العام فسنقول على القضية باى باى مع السلامة..<br />إن ننصر الله ينصرنا.. هذا ما أعرفه<br />أما الحديث عن صورتنا في الخارج .. هذا سراااااب.. والله أعلم..<br />ومازلت عند رأيي : هناك فرق بين فقه الانتحار وبين فقه من يضحي بروحه من أجل استرداد مقدسات المسلمين<br />اللهم اروقنا الشهادة في سبيلك..<br />أرجو أخي \"فلسطيني\" أن تراجع جيداً ما كتبه المشايخ تأييداً للعمليات الاستشهادية..<br />قد أفهم ألا تؤيد العمليات سياسياً - رغم عدم اقتناعي بذلك- إلا أن رفضها شرعاً فهذا يحتاج منا إلي وقفة .."
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814071504/http://www.20at.com:80/article.php?sid=492"

[[comments]]
order = 80
subject = "فلسطيني"
text = "يا اخ شخص انت<br />هو مين اللي اتفزلك وقال في انتظار توتو ؟؟؟<br />انا ولا انت ؟؟؟<br />مش قد الفزلكة ما تتفزلكشي طالما بتتنصل منها بعد كده ...<br />والاسلام يستحق منا تحسين صورته امام العالم وامام انفسنا وامام ضعاف الايمان والمؤلفة قلوبهم<br />لا تنسى ان الاسلام انزل للعالم كافة وما تقوله انت هو كلام من جعلوا الاسلام قبلية وعنصرية ومغلقا على ناسه والكون له نظمه ونواميسه وعمر الاسلام ما كان شاذ عن نواميس الكون واسبابه !!!<br />لا تنسى ان من ادخل في الاسلام ما ليس فيه يأثم ويأثم كل من اتبعه ... لان هذا يسمى الابتداع ونصر الله ليس هكذا ولم يكن هكذا ابدا في تاريخ الاسلام ومحدش بيفرض على ربنا الطريقة اللي ينصره بيها<br />ربنا حدد الجهاد يبقى ازاي وايه شروط الاستشهاد ... اما ما يحدث فهو استنحار<br />فاهم شروط الشهادة اللتي اتفق عليها الفقهاء في كل زمان الا زماننا هذا زمن الضلال هو ان الشهيد يجب ان لا يعرف ولايوقن بانه ميت والا لا يصبح شهيدا !!!<br />ويبدو انك اكتفيت بقراءة في انتظار جودوت ولم تقرأ بمثقال حبة شعير في الفقه وبتدافع عن ما لا تعرف عنه شيئا !!!<br />ولعن الله شيوخا تحركهم السياسة او هوى الشعوب !!!<br />وفعلا الله اعلم منك .. دي مش عاوزة كلام !!!<br />ولا يوجد اصلا ما يسمى فقه الاستشهاد ... هو فعلا اسمه فقه الانتحار ... وهو ليس فقها بل تخريف سياسي ويأس من رحمة الله ... فما هو موجود عندنا هو ما يسمى فقه الشهادة يعني ما هي شروط الشهادة ... وهي لا يضعها الشهيد قبل شهادته كما يفعل المنتحرون ...<br />رجاء راجع صلح الحديبية وما قاله الرسول عن الكعبة وعن مكة<br />لا احد يكره الشهادة في سبيل الله ... لكن الانتحار هل تضمن لي انت ومشايخك او اي مخلوق مهما فعلتم ان ادخل الجنة به ؟؟؟ هل هذا مما يقامر به ؟؟؟<br />وبالعكس قد اؤيد العمليات سياسيا لو قال فاعلها انه شيوعي احمر ماركسي لينيني او قال انه قومي ناصري اشتراكي او حتى قال انه من حزب الخضر ... لكن ان يزعم انه يفعل ذلك باسم الاسلام وكان الاسلام ده مالهوش صاحب ... يبقى لا والف لا ... انا مسلم ... والتهريج ده مش باسمي ولا باسم ديني ولا يمكن اسكت !!!<br />اما عن فوائدها سياسيا فهي ليست الا هبل في الجبل !!! ولم تجلب الا السور الفاصل !!! وعلى اهلها جنت براقش !!! اصحى الله يرضى عليك بلاش اوهام كاذبة !!! وتذكر كيف خرج اليهود من سيناء وكيف خرجوا من جنوب لبنان ... لكن عملية انتحارية في تل ابيب تخليهم يهدوا جنين وعملية تانية يحتلوا غزة ... تهريج طبعا ومش كلام ناس عاقلة !!!<br />بالمناسبة فيه مبدا فقهي مهم جدا تناسيته حضرتك وتناساه من تزعم انهم شيوخ وبيفهموا ... الا وهو جلب اكبر المصلحتين ودرء اكبر المفسدتين ... ياريت تقرا عن المبدأ ده وبلاش شعارات قومية وسياسية ما تساويش تلاته تعريفة ..."
archived = "2004-08-14"
