text = "ارجو ان ننسي حكاية تعاطف المجتمع الدولي لأن المجتمع الدولي لن يتعاطف مع اي رد \"موجع وفعال \" للمقاومة لأن هذا بإختصار ينفي دور المجتمع الدولي الذي يستمد طاقته وحركتة من قدرنه علي التأثير وإدارة الصراع حسب مصالحه الشخصية أولا وحسب مصالح القوي الدولية المؤثرة التي ولله الحمد نحن بعيدون عنها تماماً<br />كما أننا نتحدث عن مبادئ أخلاقية تخص الإسلام والمسلمين أي أننا نتحدث عن طريقتنا نحن في إدارة الصراع بمعزل عن رأي الآخرين وإن كان بدون تجاهل لهؤلاء الآخرين"
