subject = "فلسطيني"
text = "الاخ بيرو<br />لك مطلق الحرية ان تفعل ما تريد<br />لكن هل تركنا الله ورسوله لتتحكم فينا عواطفنا وحماسنا وغضبنا ؟؟؟<br />اليس الاسلام بمثابة الضوابط والمعايير وصمام الامان اللتي تحكم حياة الانسان ؟؟؟<br />واحد يحب واحدة ويرغب فيها بشدة فهل يترك نفسه واياها ينساقان للخطيئة ام يذعنا لكلام الله وضوابط الاسلام ومعاييره فيكللان عواطفهما الطبيعية بالزواج الحلال ؟؟؟<br />وتذكر دائما حديث رسول الله بما معناه : ليس الشديد بالصرعة ولكن الشديد هو من يملك نفسه عند الغضب !!!<br />وليكن الامر مبررا عند الشيوعي او الاشتراكي اوالعلماني او القومي ... لكن المسلم يحكمه دينه اولا واخرا !!!"
