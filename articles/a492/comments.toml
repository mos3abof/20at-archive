text = "حول موضوع الاستشهاد<br />السابق | الصفحة الرئيسية للموضوع | التالي<br />نيجى بقى الى لب الموضوع وهو ادعاء الاستشهاد<br />الشهيد:<br />اتفق الحنابلة والشافعية والحنفية والمالكية ان الشهيد هو من قتل فى قتال الحربيين فقط !!!<br />رجل او امراة او شيخ او طفل بشرط ان يموت بسبب العمليات الحربية مباشرة او بطريق غير مباشر او حتى عن طريق الخطأ ووضعوا ايضا له شروطا وهو ان يكون مسلما يقاتل لوجه الله تحت راية الاسلام الواضحة ولا يقتل نفسه<br />فعن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم : الذي يخنق نفسه يخنقها في النار، والذي يطعن نفسه يطعنها في النار<br />وكان فيه حد سأل عن عدد من يشفع لهم الشهيد<br />هناك حديث نبوى يقول : يشفع في سبعين من أقاربه<br />وهناك باب فى البخارى اسمه : باب لا يقال فلان شهيد<br />انصحكم بقراءته<br />وروى البخاري ومسلم عن سهل بن سعد أن النبي صلى الله عليه وسلم قال في غزوة غزاها : من أحب أن ينظر إلى الرجل من أهل النار فلينظر إلى هذا ، فاتبعه رجل من القوم وهو على تلك الحال من أشد الناس على المشركين حتى جرح فاستعجل الموت فجعل ذبابة سيفه بين ثدييه حتى خرج من بين كتفيه ، فأقبل الرجل إلى النبي صلى الله عليه وسلم مسرعاً فقال أشهد أنك رسول الله فقال وما ذاك ؟ قال قلت لفلان من أحب أن ينظر إلى رجل من أهل النار فلينظر إليه ، وكان من أعظمنا غناء عن المسلمين فعرفت أنه لا يموت على ذلك فلما جرح استعجل الموت فقتل نفسه فقال النبي صلى الله عليه وسلم عند ذلك : إن العبد ليعمل عمل أهل النار وإنه من أهل الجنة ويعمل عمل أهل الجنة وإنه من أهل النار وإنما الأعمال بالخواتيم<br />ومثيل لهذا ظاهراً ما جاء في الصحيحين بأن عامر ابن الأكوع ارتد عليه سيفه فقُتل بسيفه وفعل نفسه ، فقال رسول الله صلى الله عليه وسلم عنه : إنه شهيد وأنا عليه شهيد ، فالأول قُتل بسلاحه في أرض المعركة جزعاً فوجبت له النار ، والثاني قتل بسلاحه في أرض المعركة خطأ فوجبت له الجنة !!!<br />يعنى واحد قتل نفسه خطأ فى المعركة دخل الجنة<br />وواحد استعجل الشهادة وقتل نفسه فاصبح منتحرا فمثواه النار<br />ومثال ذلك من يلقى بنفسه على سيف او حربة العدو او يكشف نفسه لرصاص العدو<br />وعلى حسب النية<br />وفى ذلك حكمة حتى يبقى ويقاتل والا اذا فعل كل المسلمون ذلك وقالوا انا شهداء<br />يبقى مين اللى ها يفضل ويحارب ؟؟؟<br />وده اللى بيحصل فى فلسطين<br />بدلا من تدريب الكوادر واعدادها يفجرونهم !!!<br />قال رسول الله صلى الله عليه وسلم : يذهب الصالحون الأول فالأول فتبقى حثالة كحثالة الشعير - رواه البخارى<br />وفى الشرع تعريف المنتحر انه يقتل نفسه بسبب الغضب والملل والخوف<br />الغضب مما تفعله اسرائيل !!!<br />الملل من التوصل الى حل للقضية الفلسطينية !!!<br />الخوف من تنكيل العود به عند قبضهم عليه !!!<br />وده عملوه بعض الانتحاريون لما فجروا نفسهم ولم يصيبوا احدا خشية القبض عليهم !!!<br />قال تعالى : ولا تقتلوا أنفسكم إن الله كان بكم رحيماً ، ومن يفعل ذلك عدواناً وظلماً فسوف نصليه ناراً وكان ذلك على الله يسيرا - النساء 29<br />ويقول ايضا : ولا تقتلوا النفس التي حرم الله إلا بالحق - الانعام 151<br />متى تجوز العملية الاستشهادية فى راى الفقهاء :<br />- ابتغاء الشهيد وجه الله لا ان تتصدر صورته نشرة الاخبار ويصورون له فيديو ويلصقون صوره على الحوائط ولا ان يكون قد قام بها انتقاما لشخص بغينه او احد قياداته<br />- ايمان الشهيد ان ما سيفعله لا يمكن فعله باى طريقة اخرى تضمن له السلامة !!!<br />وده انا سبق ذكرته لما اتكلمت عن القنابل الزمنية والمفجرة عن بعد<br />- ايمان الشهيد ان ما يفعله هو الشىء الوحيد اللذى سيضمن النصر على العدو<br />- استشارة واستئذان ولى امر المسلمين والا كان لما يفعله افسادا لخططهم وتنبيه للاعداء !!!!!!<br />لا يقام بتلك العمليات الا فى حالة الاستنفار المعلن من ولى الامر والا كانت مضرة<br />ومن المذهب الحنفى يقول محمد بن الحسن الشيباني : فإن كان لا يطمع في نجاة ولا نكاية، فإني أكره له ذلك لأنه عرض نفسه للتلف في غير منفعة للمسلمين. وإنما ينبغي للرجل أن يفعل هذا إذا كان يطمع في نجاة أو منفعة للمسلمين !!!<br />وده كمان نابع من حديث نبوي : ما أحد يدخل الجنة يحب أن يرجع إلى الدنيا وله ما على الأرض من شئ إلا الشهيد ، يتمنى أن يرجع إلى الدنيا فيقتل عشر مرات لما يرى من الكرامة<br />يعنى اصلا الشهيد مش عاوز يموت ونفسه يفضل عايش علشان يحارب اعداء الله<br />Read the rest of this comment..."
