[[comments]]
order = 6
subject = "مين يلملم لحمنا من الشارع ؟؟؟"
author = "إبن بهيه"
posted = "2006-12-22"
text = "لا يوجد بمصر إحصائيات موثوقة عن عدد هؤلاء المساكين ولا أماكن تواجدهم .. البعض يقول مليونين والبعض يقول ثلاثة ملايين في مصر ، وهي ارقام إن صدقت فأبشروا بكارثة محققة بلا جدال خلال أعوام قليلة جداً .. إن هؤلاء المساكين يمكن أن يكونوا بنائين للوطن أو معاول هدم حسب رغبة البلد .. والبلد عندنا هايصه ولايصه ما بين مثقفين أكل العيش والجاتوه المخابيل اللي توقفت عندهم الحياة عند الإخوان المسلمين ويانا يا الإخوان .. وبين الحكومة القذرة العميلة التي تتبنى أولاد الصهاينة وتقتل أولاد بهيه<br />وحتى يأتي لهذا البلد قائد محترم وإبن بهيه بجد مش الواطي مبارك وعصاباته .. لهؤلاء المساكين الشارع ما غيره ..<br />فلتبتهلوا إلى الله أن يزيل عن بلدنا ذلك الطاغية المجرم القذر مبارك وذريته الحقيرة وعصاباته حتى يمكن لأولاد بهيه أن يلملموا لحمهم من الشوارع ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-29"
capture_url = "https://web.archive.org/web/20061229100019/http://masr.20at.com:80/article.php?sid=1342"

[[comments]]
order = 7
subject = "الناس بتهرج"
author = "max"
posted = "2006-12-22"
text = "يعنى انا مش فاهم بصراحة ايه دخل الدستور يا شاب يا وطنى فى الموضوع المتكوب ده والتانى عايز يستئصل اعضاء الناس طب افرض ان ابوه وامه ماتو ومعندوش قرايب هنستئصل اعضاء مين يا جماعة مجتمعنا وشبابنا فين الاطفال ديه انا بشوفها كل يوم وبصراحة مبقدرش اتعامل معاهم احنا عايزين ممجوعات منظمة تتعامل مع الوضع بطريقة صح يا جماعة يا ناس يا بلد المجتمع بينهار من جميع الجوانب ناس مشغولة بالدستور وناس مشغولة بالكورة وناس مش مشغولة بحاجة اصلا والله لايغير بقوم حتى يغيروا ما بانفسهم زى مع بنحب بلدنا وخايفين عليها وعايزين نعدل الدستور بتاعنا لازم يبقى عندنا انسانية الاول العيل من دول بيقف فى اشارة المرور ويجى عند انضف عربية ومحدش يعبره ليه مش فاهم انا والى يبقى ف العربية ولا اكنه شايفه طب افتكره اخوك افتكره ابنك الله اعلم بكره فيه ايه وبعدين يعنى اديلو ربع جنيه يا اخى ده لو انته حانوتى يعنى تلاقى برضه عيال واقفين عند الجامعة عندنا جامعة القاهرة وبيشربوا كلة وبيشربوا سجاير وفكر باه انته تشد منه السجارة لازم اسلوب دبلوماسى مع الاطفال ديه تصاحبهم تخليهم يحبوك ده رأى الخاص يا ؤيت لو ممكنفيه حاجة نعملها بدل قراية الجرانين بتاعت الكورة نعملها ومصر وبتاع البلد ميتة من تحت الله اعلم الكام سنة الجاية مدى مستوى الاخلاق هيبا عامل ازاى بلدنا بتضيع يا ريت نبصلها نعمل اى حاجة نقدر عليها كل واحد فى حدود امكانيته فين البلد الى ناس فيها تقلك ربك بكره يعدلها بلدنا كانت كده ولا ضحكوا علينا وقالوا انها كانت حلوة وزى الفل بس للاسف انتم جيلكوا الى نحس وانا واحد من الجيل بس يا ترى هو نحس ولا ايه"
archived = "2006-12-29"
capture_url = "https://web.archive.org/web/20061229100019/http://masr.20at.com:80/article.php?sid=1342"

