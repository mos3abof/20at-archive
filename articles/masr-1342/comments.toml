[[comments]]
order = 9
subject = "كان فى قريتنا واحد حرامى"
author = "حسب اللة السادس عشر"
posted = "2006-12-23"
text = "كان فى قريتنا واحد حرامى زى ما بيقولوا بيسرق الكحلة من العين وقضى نصف عمرة فى السجن وبيطلع من قضية يدخل قضية وبيسرق اى حاجة تقابلةويبيعها باى حاجة وصايع لا اسرة ولا اقارب ولا حاجة<br />المهم توسط لة مامور المركز وشغلة فى مصنع كعامل نظافة واصبح لة دخل ثابت ضعيف نعم ولكن لة اجر<br />صدقونى بعد ان اطمئن على لقمتة الحلال توقف عن السرقة تماما واصبح انسان تانى تماما بل انة اصبح يوم الجمعة بيروح يتطوع وينضف الجامع ويكنسة<br />اللى انا عايز اقولة ان الناس دى عايزة فرصة عمل لقمة عيش حلال عايزة اللى يعمل لهم ورش يشغلهم فيها ومصانع صغيرة تعمل نجارة وحدادة والات زراعية وغيرة وغيرة<br />مين ينفذ الكلام دة<br />الحكومة حلت المشكلة دى طبعا لا<br />مين اللى يحل المشكلة<br />الناس دى تحل مشكلتها ازاى غير بالسرقة والشحاتة وخطوة تالية هيقتلوا اذا لم يجدوا ماياكلوة<br />ياايها المسئولين تحركوا قبل فوات الاوان والا اصبح الشارع المصرى غابة ياكل فية القوى الضعيف"
archived = "2006-12-29"
capture_url = "https://web.archive.org/web/20061229100019/http://masr.20at.com:80/article.php?sid=1342"

[[comments]]
order = 10
subject = "منه لله اللى كان السبب"
author = "فارس_fr"
posted = "2006-12-23"
text = "مين فينا مش ابن شوارع ,, لم نقول على العيال اللى واقفين فى الاشارةولاد شوارع . هم بالنسبة لنا ولاد شوارع !! طب احنا بالنسبة لمبارك وعصابته والحرامية اللى فوق الى عمالين يلهطوا مش ولاد شوارع ,, المواطن الغلبان المطحون مش من ولاد الشوارع بالنسة للحكومة , يا اسيادنا البلد كلها ولاد شوارع , محتاجين تعديل تغيييييييييييير شامل , محتاجين تسونامى التغيير يخلصنامن مبارك وعصابته عشان البلد تنظف من ولاد الشوارع ويبقى اللى فيها ولاد ناس بجد .<br />يالا منه لله اللى كان السبب !!!!!!!<br />لا للتوريث ولا لاستكمال السرقة والنهب !!!!!"
archived = "2006-12-29"
capture_url = "https://web.archive.org/web/20061229100019/http://masr.20at.com:80/article.php?sid=1342"

[[comments]]
order = 11
subject = "تبرير .. تبرير"
author = "قلم جاف"
posted = "2006-12-24"
text = "مصطلح \"توحش نبيل\" مصطلح مستفز .. من امتى كان التوحش نبيل؟<br />في حالة واحدة ، لو كانوا دول حيوانات عايشين في غابة ..<br />لسة ما انحدرناش للمستوى دة ..<br />دة أول هام..<br />تاني هام ودة الأهم .. أنا شايف إن احنا بنفرط في التبرير لكل مصيبة بتحصل ، متغافلين عن فعل المصيبة نفسها..<br />فيه ناس مننا مصرة على إن التوربيني ضحية ، وإنه تعرض لضغوط ، وإنه .. وإنه .. هل لسة عاجزين عن تصديق وجود مجرمين سايكوباتيين في مجتمعنا؟ هل اللي بيدرسوا علم نفس في كليات التعليم ما بعد الرابسوماتيكي مش عارفين يفرقوا بين السايكوباتي والمجنون؟ ولا المواد الدراسية والمعارف بقت بتدخل من ودن علشان تخرج من التانية؟<br />آه يا بلدّ!"
archived = "2006-12-29"
capture_url = "https://web.archive.org/web/20061229100019/http://masr.20at.com:80/article.php?sid=1342"

