subject = "اتقوا الله في مصر والإسلام"
author = "مسلم غيور"
posted = "2006-12-21"
text = "اتقوا الله ايها الإخوان في مصر والإسلام فهذا والله مخالف لهدي النبي صلى الله عليه وسلم وما كان الصحابة والتابعون ومن تبعهم بإحسان إلى يوم الناس هذا على شيء ولو يسير مما أنتم عليه اليوم. وإذا كنتم على اقتناع مما فعلتم فلم تواريتم. وسترون ضرر ما فعلتم على الدعوة والدعاة وعلى المسلمين في مصر. لقد فتحتم وما زلتم تفتحون الباب لأعداء الإسلام لينالوا منا جميعا. عجبا يا قوم اللحية والالتزام الظاهري بالسنة عندكم ليس بالشيء المهم. أما الالتحام مع المسلمين ومع المسؤولين هو قوة وشكيمة وعزة للإسلام. اللهم اهد قومي فإنهم لا يعلمون. مسلم غيور"
archived = "2006-12-22"
capture_url = "https://web.archive.org/web/20061222173801/http://masr.20at.com:80/article.php?sid=1286"

