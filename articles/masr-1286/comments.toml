subject = "ادعو شباب الغخوان للتريث .. لأن المتربصين بهم كثيرون"
author = "على شباب الإخون أن يدركوا أن هناك كثير من المتربصين الذين يتصيدون لهم الأخطاء ويفتشون عن أى نقيصة وينفخون فى الرماد ليصبح نارا تلتهم الجميع .. على شباب الإخوان أن يراعوا ذلك جيدا ، ويفكروا ألف مرة قبل أن يقدموا على أى عمل .. كيف يمكن أن يفسر فى سياق الأحداث التى تموج بها البلد والمنطقة ككل؟ و ما الدلالات التى يمكن أن يحملها المتحاملون للعمل؟"
posted = "2006-12-12"
text = "لأن هناك كثير من المتربصين ، يجب على شباب الإخوان أن يفوتوا عليهم فرصة الاصطياد فى الماء العكر.<br />هذه نصيحة لشباب الإخوان .. أحسب أنى مخلصا فيها ، وأعتقد أنهم سيأخذونها بعين الاعتبار"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045403/http://masr.20at.com:80/article.php?sid=1286"

