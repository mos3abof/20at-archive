[[comments]]
order = 25
subject = "يا سلااااااااام على فكره انا سواق"
author = "محمد"
posted = "2006-12-14"
text = "انا شايف ان بعض الاخوه الشباب متحامل اةى على الاخون وحركه الاخوان وطلاب الاخوان ...الخالمهم انهم بيصوروا لنا ان الاخوان دول محبوسين فى غابه او امام وانهم لو خرجو هايكلو عضمنا قبل لحمنا وانهم قله منحرفه متخلفه على رغم انهم وبصراحه وبحياديه تامه على اساس انى مش من الاخوان ولاكنه من باب انصاف الحقانى ما رئيت احد من الاخوان او تعاملت معاه الا والله العظيم فى اعلا خلق وامانه<br />احنا بنحاسب الشباب دهعلى اللى عملوه وماحسبناش اللى وصلوهم لانهم يعملو كده ياسلاااام ملشيات وعصابات الاخوانبقى ده اسمهم ونسينا عصابت الحن الوثنى اقصد الحزب الواطى ىىىىىه اقصد الحزب ههه الوطنيى والله كلمه الوطنى مش عاوزه تطله نسيناهم فى انتخابت المجلس وفى المحليات وفى مص دم الشعب والله والله والله الذى لا الله الا هو الحزب الواطى ده واعضائه كلهم بيكرهوا بعض ونفسهم كل واحد منهم يروح فى نصيبه علشان ياخد مكانهيا جماعه ياريت نفوق ونفهم بقا ونصحاوبلاش نظام اللى يتجوز ابنى نقوله يا عمى واخترناك اخترناك وحسبى الله ونعم الوكيل فيك يا حسنى"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217235441/http://masr.20at.com:80/article.php?sid=1286"

