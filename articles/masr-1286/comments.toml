text = "انا نفسي تبقي مصر مرتاحه شويه زي اي دوله عربيه مثل الخليج ده بس لو طلعو الحراميه منها والاخوان دول اخوانا بس لو انا خايف عليهم جداجدا وعليه العوض ومنه العوض في مصر ام الدنيا ولادها في الخارج بيموتو في المعمار وفي الداخل بيموتو من الحكومه"
