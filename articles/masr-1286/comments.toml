[[comments]]
order = 0
subject = "لا حول ولا قوة الا بالله"
author = "م. إسلام القصبى"
posted = "2006-12-20"
text = "شغل عيال و غير محسوب العواقب و بدون هدف ويعبر عن ضعف الثقافة الدينية فى حل المشكلات و الإعتراض لا يكون ابدا بهذا الأسلوب وادعوا الله ان يرنا الحق حقا ويرزقنا اتباعه ويرنا الباطل باطل و يرزقنا اجتنابه."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042236/http://masr.20at.com:80/article.php?sid=1286"

[[comments]]
order = 1
subject = "شباب الاسلام"
author = "ابومالك"
posted = "2006-12-20"
text = "الله معهم شباب الاسلام امضوا على بركت الله ولا تنظروا خلفكم فالاسلام منتصر باذن الله ولو كره المنافقون لا تلقوا بالا الى ما يقولوا فمن اتبع اليهود والنصارى ماذا ننتظر منه انتم جيل المستقبل والمستقبل للاسلام"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042236/http://masr.20at.com:80/article.php?sid=1286"

[[comments]]
order = 2
subject = "اتقوا الله في مصر والإسلام"
author = "مسلم غيور"
posted = "2006-12-21"
text = "اتقوا الله ايها الإخوان في مصر والإسلام فهذا والله مخالف لهدي النبي صلى الله عليه وسلم وما كان الصحابة والتابعون ومن تبعهم بإحسان إلى يوم الناس هذا على شيء ولو يسير مما أنتم عليه اليوم. وإذا كنتم على اقتناع مما فعلتم فلم تواريتم. وسترون ضرر ما فعلتم على الدعوة والدعاة وعلى المسلمين في مصر. لقد فتحتم وما زلتم تفتحون الباب لأعداء الإسلام لينالوا منا جميعا. عجبا يا قوم اللحية والالتزام الظاهري بالسنة عندكم ليس بالشيء المهم. أما الالتحام مع المسلمين ومع المسؤولين هو قوة وشكيمة وعزة للإسلام. اللهم اهد قومي فإنهم لا يعلمون. مسلم غيور"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042236/http://masr.20at.com:80/article.php?sid=1286"

