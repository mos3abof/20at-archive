[[comments]]
order = 8
subject = "ربنا يسامحكم"
author = "ايه القرف ده....."
posted = "2006-12-12"
text = "أنا قرأت البيان اللى اتكتب فى الرد على ما حدث..بيان سخيف وركيك ويفتقد للمصداقية ...<br />للأسف الإخوان يحتاجون لمزيد من النضج الفكرى والعقلى ....<br />ايه التمثلية أو حتى الإسكتش اللى يحتاج ل50واحد لابسين زى موحد وعاملين عرض كاراتيه وكنج فو دى حاجة سخيفة....<br />انتم عاملين اعتصام علشان فصل الطلبة<br />مال الإعتصام ومال الهبل ده....<br />البلد كلها وبرضو كل الطلبة وقفوا وشاركوا فى الإتحاد الحر....<br />هى دى جايزة مشاركتهم.....<br />أوعى حد منكم يفكر انكم لما تعملوا كدا الإدارة هتخاف...<br />لم ينالكم سوى الفضيحة للأزهر ولجماعة بحجم الإخوان.....<br />أوعى تكونوا عاوزين توصلوا رسالة للأمن وللإدارة انكم جامدين وبتفوتوا فى الحديد وشوية الهجص اللى عملتوه ده هوا اللى هيجيب ليكم الحق.......<br />أنا رافض رد الإدارة عليكم ورافض موقف أحمد الطيب...<br />بقليل من الذكاء د/الطيب طلع على الهواء وقال الفصل لا رجعة فيه والأزهر أكبر من الإتحاد الحر ومن الإخوان أنفسهم....<br />استحالة حد يجى ويقول انه هيتراجع وهو المعبر عن رأى وموقف الحكومة<br />بجد دى سقطة لطلبة الإخوان فى الأزهر بجد حاجة تكسف.....<br />كلنا بجد انبسطنا من نشاط الإخوان وتميزهم وحملهم لواء المعارضة فى مصر....<br />وبرضوا هنقف وراكم........<br />وأنا متأكد لو الكلام ده اتعرض واتناقش فى مكتب الإرشاد فلن تنالوا سوى ............<br />أنا بجد مفقوع .....<br />حاولو يبقى عندكم دماغ جديدة بتفكروا بيها...."
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045403/http://masr.20at.com:80/article.php?sid=1286"

