subject = "خطأ استراتيجي وتاريخي"
author = "Isado"
posted = "2006-12-14"
text = "أنا مش عارف هل الطلبه ديه بتتصرف بمزاجهم ولا فيه أوامر بيتجيلهم من فوق ؟<br />لو كانوا بيتصرفوا بمزاجهم يبقى طيش شباب واندفاع غير عاقل<br />أما اذا كانت ديه أوامر من فوق يبقى ربنا يستر<br />أنا لا أؤيد ولا أعارض الأخوان كل شئ في الدينا نسبي مفيش حد حلو على طول ومفيش حد وحش على طول ، المره ديه وحشه في حق الأخوان"
