[[comments]]
order = 13
subject = "اين الحقيقه"
author = "نيفين نيفى نوفا"
posted = "2006-12-12"
text = "اولا احب اسجل اعتراضى على العنوان<br />ميليشيات ايه بس<br />البلد مش ناقصه تولع اكتر ما هى<br />اظن الرساله واضحه<br />بالنسبه للموضوع دا و حسب معلوماتى من القاهره الايوم امبارح و اول جاب عمرو ف البرنامج المشاهد دى و جاب نائب رئيس الجامعه اللى اتكلم مرتين و مش عارفه رئيسالجامعه نفسه فين<br />الظلهر مينكشفش على برامج<br />ما علينا<br />المهم و جاب كمان واحد من الطلاب اللى اتفصلو و جاب المتحدث الاعلامى باسم الطلاتب المتظاهرين كل دول على التليفون و الموضوع كالتالى<br />1.الناس دى ليها طلبات منها السماح بعمل اتحاد حر منهم موازى للاتحاد المنتخب اقصد المعين من قبل الجامعه<br />2.اعاده 7 طلاب مفصولين بتهمه تكوين الاتحاد الموازى<br />3.الطلاب هيرجعو لان الفصل كان مؤقت<br />دا على اد معلوماتى<br />يا ريت بقى ننسى موضوع دول اخوان و لا لا<br />و منكبرش الحكايه يا ولاد البلد<br />البلد مش ناقصه"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045403/http://masr.20at.com:80/article.php?sid=1286"

