subject = "من الحبه قبه"
author = "مدين"
posted = "2006-12-23"
text = "انامستغرب من الذي فاعلين من الحبه قبه وخايفين على الأسلام من مجرد استعراض للمارات القتاليه والذي نشاهده يوميا على شاشات التلفزيون ولكن من غير الملتزمين ميضرش؟؟ولكن من الأخوان اه ارهاب ومليشيات وللعلم قدنكون هأولا من المنتسبين لبعض ألانديه الحكوميه .ولا حول ولاقوة ألا بالله."
archived = "2007-01-31"
