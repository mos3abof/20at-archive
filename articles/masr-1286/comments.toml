author = "أحمد مطر"
posted = "2006-12-12"
text = "عَـن مآسي الا حتِـلا لْ<br />عَـنْ دِفـاعِ الحَجَـرِ الأعـزَلِ<br />عَـن مدفَـعِ أربابٍ النّضـالْ !<br />وَعَـنِ الطّفْـلِ الّذي يُحـرَقُ في الثّـورةِ<br />كي يَغْـرقَ في الثّروةِ أشباهُ الرِّجالْ !<br />قَلّبَ المَسئولُ أوراقـي، وَقالْ :<br />إ جـتـَنـِـبْ أيَّ عِباراتٍ تُثيرُ ا لا نفِعـا ل<br />مَثَـلاً :<br />خَفّـفْ ( مآسـي )<br />لِـمَ لا تَكتُبَ ) ماسـي ( ؟<br />أو ) مُواسـي (<br />أو ) أماسـي (<br />شَكْلُهـا الحاضِـرُ إحراجٌ لأصحابِ الكراسي !<br />إ احذ ِفِ ) الأعـْزَلَ ( ..<br />فالأعْـزلُ تحريضٌ على عَـْزلِ السّلاطينِ<br />وَتَعريضٌ بخَـطِّ الإ نعِـزا لْ !<br />إحـذ ِفِ ) المـدْ فَـعَ ( ..<br />كي تَدْفَـعَ عنكَ الإ عتِقا لْ .<br />نحْـنُ في مرحَلَـةِ السّلـمِ<br />وَقـدْ حُـرِّمَ في السِّلمِ القِتالْ<br />إ حـذ ِفِ ) الأربـابَ (<br />لا ربَّ سِـوى اللهِ العَظيمِ المُتَعـالْ !<br />إحـذ ِفِ ) الطّفْـلَ ( ..<br />فلا يَحسُـنُ خَلْطُ الجِـدِّ في لُعْبِ العِيالْ<br />إحـذ ِفِ ) الثّـورَةَ (<br />فالأوطـانُ في أفضَـلِ حالْ !<br />إحـذِ فِ ) الثّرْوَةَ ( و ) الأشبـاهَ (<br />ما كُلُّ الذي يُعرفَ، يا هذا، يُقـالْ !<br />قُلتُ : إنّـي لستُ إبليسَ<br />وأنتُمْ لا يُجاريكُـمْ سِـوى إبليس<br />في هذا المجـالْ .<br />قالّ لي : كانَ هُنـا ..<br />لكنّـهُ لم يَتَأقلَـمْ<br />فاستَقَـالْ !"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045403/http://masr.20at.com:80/article.php?sid=1286"

[[comments]]
order = 15
subject = "اجلسوا تحت أرجل العلماء وكفى تشبها بكلاب النار"
author = "أبو زياد الذى لايقر بالجماعات كما علمه دينه"
posted = "2006-12-12"
text = "نصيحتى للاخوان المسلمون ومن شابههم من الجماعات ومرشدهمأن يجلسوا تحت أقدام العلماء الثقات الربانيين ليتعلموا حكم الشرع فى الجماعات ويتعلموا و ليسمعوا حكم الله تعالى فيهم كخوارج على الحكام ويتعلموا هل يجوز سب الحاكم ويتعلموا هل تجوز بيعتان لاثنين المرشد العام للاخوان ورئيس الجمهوريةفى وقت واحد لموطن واحدويتعلموا حديث البخاري من حديث عبادة بن الصامت قال بايعنا رسول الله على السمع والطاعة فى المنشط والمغرم وعلى أثرة علينا وأن لا ننازعن الأمر أهلة الا أن تروا منهم كفرا بواحالكم فيه من الله عليهم برهان.<br />هل هؤلاء الحكام وجدتم عليهم من الله فى دين الله كفرا بواحا يعلمه القاصى والداني وليس عندكم ياأخوان حتى من يقيم الحجه على أحد بالكفر وفى حديث أخر عليكم بالسمع والطاعة وات ضرب ظهرك وأخذ مالك هل الحاكم ضرب ظهرك وأخذ مالك وان فعل ذلك فعليك السمع والطاعة.<br />أقرءوا ياأخوان المسلمين رأي علماء المسلمين فيكم واخرهم الأمام الغزالى.<br />وياليت قومى يعلمون.<br />ياليت شعرى من الخاسر فنعزيه ومن الفائز فنهنيه.<br />فتوبوا الى الله جميعا أيها المسلمون لعلكم تفلحون."
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045403/http://masr.20at.com:80/article.php?sid=1286"

[[comments]]
order = 16
subject = "الاخوان تانى وتالت"
author = "مصرى حتى النخاع"
posted = "2006-12-12"
text = "بالراحة ياجماعة الاخوان ؟<br />ناس معتصمين ودة حقهم ونشجعهم علية لغاية كدة وكويس لابسين اللبس دة لية بقى ؟هما حيعملوا استعراض قوة<br />والمقصود بالاستعراض دة مين بالظبط الامن ولا المواطن المصرى يعنى اى رسالة عاوز تبلغها احنا هنا يابتوع الامن ومعدناش نخاف منكم ولا للمواطن المصرى اسلم تسلم ؟<br />حاجة غريبة جدا ومحيرة<br />عموما لعب الكراتية والكلام دة سقطة جديدة لالااخوان<br />ياجماعة الاخوان هنا القاهرة مش لبنان"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045403/http://masr.20at.com:80/article.php?sid=1286"

[[comments]]
order = 17
subject = "ارحموا الاخوان"
author = "هانى المصرى"
posted = "2006-12-12"
text = "ارحموا الاخوان من سخافات النشر ماينشر ميلشيات ايه وعبط ايه كونوا منصفين الاخوان على مدار تاريخهم كانوا كلشجر يلقون بالحجر ويردون باجمل الثمر ويكفى ان نعترف ان ليس هناك فصيل سياسى او اسلامى ذاق الامرين من الحكومات المصريه مثل الاخوان المسلمين ياحباب شباب الاخوان كل يوم يفصل منهم العشرات ويعتقل منهم المئات ويسحل منهم الكثير وماسمعنا عن انجرارهم لاى احداث عنف ويكفوا ان تعلموا ان رجالات الامن الاشواس جمع لطلاب الاخوان بجامعه الازهر بلطجيه ومسجلين خطر حتى يمعنوا فيهم ضربا واستخدموا الاسلحه البيضاء وجرحوا العشرات وهددوا ارواح مئات الطلاب وكل ذلك فى حماية الامن ولولا تربية الاخوان لهؤلاء الشباب لتحولت ساحة جامعه الازهر لساحه قتال ولكن الصور التى نشرتها جريدة الامريكان واقصد المصرى اليوم كانت مجرد فقره من فقرات برنالمج لطلاب الاخوان كان منها ماهو انشاد ومسرحيات واسكتشات فاكهيه سخروا الشباب من خلالها من الاضهاد الذى يلاحقهم داخل وخارج اسوار جامعتهم ولاذنب لهم سوى انهم يقولون ربى الله"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045403/http://masr.20at.com:80/article.php?sid=1286"

[[comments]]
order = 18
subject = "عفوا اخ هانى؟"
author = "مصرى حتى النخاع"
posted = "2006-12-13"
text = "معلش ياخ هانى عندى ملاجظات على كلامك<br />1- انتا بتتهم جريدة المصرى اليوم بانها جريدة الامريكان اية الدليل المادى اللى عندك على كدة ؟<br />2- بتتكلم على اللى حصل على انة فقرة من برنامج الاخوان .... اى فقرة؟ ياترى اخدوا تصريح من مين علشان يعملوا فقرات سواء اسكتش ولا اناشيد<br />3- بتتكلم عن القهر اللى بيلاقوة الاخوان المسلمين وكان الاخوان دولة جوا الدولة اليس الاخوان جزء من مصر ؟<br />بصراحة اللى حصل بيخللى عقلى مش مصدق كلام مش مقصودة وخلافة انا بكرة الحكومة ورجالتها جدا لكن معنديش استعداد اتحول لايران او لبنان او حتى السعودية لو فاكرين انكم فى يوم ممكن تعملوا كدة تبقوا بتحلموا"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217235441/http://masr.20at.com:80/article.php?sid=1286"

