[[comments]]
order = 23
subject = "فتبينوا ......."
author = "محمد جلال"
posted = "2006-12-14"
text = "شباب تعالوا نتكلم بهدوء وبواقعية وبتحليل أكثر للأمور ذلك إن كنا نريد الحق ....<br />بعيدا عما جرى بجامعة الازهر سواء ما يقوله الاخوان عن انه عرض فكاهي من اسكتشاتهم ...<br />أو ما تقوله معظم وسائل الاعلام وغيرها من انها مليشيات اخوانية تنم عن تجهيزات عسكرية وجناح سري للاخوان !!<br />من الردود الفائته مع احترامي الكبير لها ولكاتبيها ولكنى أجدها مندفعه لبعض تعليقات الكتاب التى قد لا تكون حقيقيه او لم تعالج الامر بشكل صحيح ...<br />حتى نستطيع ان نصل الى الحقيقه وان نعرف خيوطها جيدا لا يصح ان ندرس موقف بحد ذاته لطلاب الاخوان ولكن الصحيح من وجهة نظري ان ندرس المرحله الفائته بمجملها من نشاط طلاب الاخوان على مدى عامين ماضيين وبالتحديد منذ تبنوا حملة \"معاً للإصلاح\" ويجب ان نربط بين ما يجري داخل اسوار الجامعه وما يجري خارجها حيث الواقع المصري المتغير يوميا مرتبطا ببعضه البعض .<br />فيجب ان يكون حكمنا على اى فعل او رد فعل سواء من الاخوان او من الحكومة ننظر له نظره شموليه جامعه لا نظرة موقف في حد ذاته .<br />ومن وجهة نظري إن كان ما قام به طلاب الاخوان عرض عسكري بالفعل فواجب عليهم الاعتذار لانهم اخطأوا أما ان كان اسكتش او نشاط رياضي للاستعراض الرياضي وفقره من فقرات الاعتصام المفتوح فهذا من حقهم كما من حق طلاب الاتحاد الرسمي ان يقوم بمهرجانات رياضية ويستعرض فيها العاب القوى والكاراتيه . فلنعامل المثل بالمثل ولا نعطي الموضوع أكثر من حقه<br />ولى تعقيب على جريدة \" المصري اليوم \" في كتاباتها الاخيره حيث انها اخذت فى تضخيم بعض الامور- ولا اقصد ما يتعلق بالاخوان فقط - بل ان كثير من كتابها وصحفييها لم يعطوا المهنة حقها ولم ينقلوا الخبر بمصداقيته المعهوده عن الجريدة منذ ظهورها .. واصبحت كالجرائد المشبوهه مثل ر<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217235441/http://masr.20at.com:80/article.php?sid=1286"

