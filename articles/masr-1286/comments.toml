[[comments]]
order = 2
subject = "الحقيقة فيما حدث"
author = "طلاب الإخوان بجامعة الأزهر ينفون صحة ما نشرته \"المصري اليوم\""
posted = "2006-12-11"
text = "إخوان أون لاين - 11/12/2006<br />الطلاب يطالبون بحقهم في كيان يعبر عن إرداتهم<br />كتب- عصام سيف الدين<br />نفى طلاب الإخوان المسلمين بجامعة الأزهر صحة ما نشرته جريدة (المصري اليوم) في عددها الصادر اليوم الإثنين الموافق 11/12/2006م، والذي جاء فيه أن ميليشيات الإخوان تستعرض قدرتها القتالية بالكاراتيه والكونغ فو في جامعة الأزهر أمام مكتب رئيس الجامعة.<br />وأوضح الطلاب في بيانٍ أصدروه اليوم وصل (إخوان أون لاين) نسخة منه أنَّ هذه الصورة المنشورة كانت عبارةً عن فقرةٍ تمثيلية ضمن فقرات الاعتصام المفتوح بالمدنية الجامعية، وكانت عبارةً عن أناشيد وفقرات تمثيلية، ولم تكن استعراضًا للقوة أو التصعيد ضد جهةٍ بعينها.<br />وأكد البيان أنَّ هذا الموقف لم يكن أمام مكتب رئيس الجامعة، ولكن في المدينة الجامعية، وكان عبارةً عن اعتصامٍ منذ يوم الخميس الماضي إلى يوم الأحد؛ وذلك بسبب الفصل التعسفي للطلاب المشاركين في الاتحاد الحر\".<br />كان ما يقرب من 3 آلاف طالب قد تظاهروا أمس الأحد 10/12/2006م بسبب قيام إدارة الجامعة بفصل 6 من الطلاب الذين شاركوا في انتخاباتِ الاتحاد الحر والمطالبين بحقِّهم في إنشاء كيانٍ يُعبِّر عن إرادتهم بعيدًا عن تدخل الأمن؛ وقيامها بتحويل العشرات من أعضاء الاتحاد الحر إلى مجالس تأديب.<br />وكانت إدارة الجامعة قد قررت فصل الطلاب صهيب شوكت الملط (الأمين العام للاتحاد الحر) وجلال أبو شامية (الأمين العام المساعد)، وكارم السيد ومحمد النجار وعبد الحميد السبخاوي وعمر طلعت.<br />طالع نص البيان"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045403/http://masr.20at.com:80/article.php?sid=1286"

