author = "الحقوق الطلابية بين مطرقة الأمن و سندان ميلشيات ال"
posted = "2006-12-14"
text = "الحقوق الطلابية بين مطرقة الأمن و سندان ميلشيات الإخوان<br />لم يكن ما حدث من طلاب الإخوان المسلمون من استعراض للقدرات القتالية داخل جامعة الأزهر, أمرا غريبا و لا مستغربا عليهم و على تاريخهم الذي حرصوا فيه على تربية شباب الإخوان تربية عسكرية أو شبه عسكرية من خلال معسكرات الكشافة, أو التدريب الفعلي على السلاح, و قد استغل قيادات الإخوان تلك التربية في الكثير من أعمال العنف التي وصل كثير منها إلى حد التصفية الجسدية, سواء تلك التي مارسها جناحهم الطلابي في الجامعة أو التي مارسها الجهاز الخاص للإخوان.<br />لم يكن ارتداء العشرات من طلاب الإخوان للملابس السوداء و الأقنعة السوداء و تعليقهم شارة صامدون فوق رؤوسهم, و اصطفافهم بين آلاف الطلاب لاستعراض قدراتهم القتالية غريبا, عن تنظيم أعلن رئيسه أو مرشده منذ فترة أنه على استعداد لإرسال 10 آلاف مقاتل مدرب إلى لبنان, و بالرغم من أن قيادات الإخوان حاولت تأويل ذلك التصريح إلى أكثر من رأي إلا أنه من الواضح تماما أن مهدي عاكف كان يعني تماما ما يقوله.<br />و لما كانت الانتهازية السياسية هي أحد أهم صفات جماعة الإخوان المسلمون منذ تأسيسها, فقد جاء الموقف الذي اتخذه المرشد الحالي على الاستعراض العسكري لطلاب الإخوان قريبا إلى حد ما من الموقف الذي اتخذه حسن البنا بعد القبض على خلية الإخوان المسلمين التي قامت بقتل النقراشي, فما كان من البنا إلا أن أصدر بيانا عنهم عنونه قائلا \"ليسوا إخوانا, و ليسوا مسلمين\", أما موقف المرشد الحالي فقد كان أكثر استخفافا بعقولنا حيث قال أن هذا الاستعراض لم يكن سوى اسكاش فكاهي!!!, و هو ما يتناقض مع كلام محمد حبيب نائب المرشد بأن ما حدث من طلاب الإخوان في جامعة الأزهر هو موقف فردي لا يعبر عن الجماعة.<br />و بالرغم من أن الإخوان يؤكدون في<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217235441/http://masr.20at.com:80/article.php?sid=1286"

[[comments]]
order = 27
subject = "س و ج"
author = "مصري"
posted = "2006-12-15"
text = "س : هل فصل الطلبة اللي حصل عدل؟<br />ج : طبعا مش عدل وكا انسان ديمقراطي وبيفكر هو ضده<br />س : هل من حق الطلبة يعتصموا علشان زمايلهم؟<br />ج : أكيد من حقهم ولاشك .<br />س : هل لعب الكاراتيه والكونغ فو والتايكوندو ممنوع؟<br />ج : أكيد مش ممنوع .<br />س : هل لعب التايكوندوا والكونغ فو ليه علاقه بالاعتصامات؟<br />ج : بالتأكيد لا مالوش علاقه .<br />س : هل من المعقول أن يجيد الطالب وحتي الرياضي عدة ألأعاب قتاليه؟<br />ج : غالبا لا الا اذا كان طالب كلية عسكرية أو عضو ميليشيا.<br />س : هل من المعتاد لعب هذه الألعاب واستعراضها بزي موحد غير زي اللعبة؟<br />ج : لا غالبا برضه لكن ده ممكن وبنشوفه بيحصل من طلبة الكليات العسكرية لما بيتخرجوا وكمان من الميليشيات العسكرية في استعراضاتها<br />س : هل تتم هذه العروض الرياضية بأقنعه زي اللي شفناها في جامعة الأزهر؟<br />ج : ده بيحصل بس في استعراضات الميليشيات زي مليشيات حماس وفتح .<br />س : هل علشان نعرف ان دي مليشيات نشوف في ايديها بنادق ؟<br />ج : لا طبعا مش شرط لان في استعراضات الكليات العسكرية مفيش ظابط بيظرب طلقة نار واستعراض المهارات القتالية اليدوية بيكون هو الأساس .<br />س : هل للاخوان سوابق في الموضوع ده؟<br />ج : طبعا النظام الخاص اللي كان الجناح العسكري بتاعهم وبالمناسبة هما كانوا بينكروا وجوده ساعتها لكنهم كانوا بينكشفوا بعروض شبيهه بيقوم بيها شباب مترشحين للالتحاق بهذا الجناح العسكري .<br />س : هل الاخوان في أي اعتصام قادم هيقوموا بعروض رياضية( زي ما سموه) ؟<br />ج : لو افترضنا حسن النيه وان الموضوع مجرد عرض رياضي في اطار اسكتش استنكاري (زي ما قال المرشد بتاعهم) فالمفروض نشوف في الاعتصام القادم شباب قاعدين ينطقوا كورة أومثلا شباب قاعدين يلعبوا بنج بونج تضامنا مع زمايلهم ولا دي مش رياضات برضه .<br />س : طب اي<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217235441/http://masr.20at.com:80/article.php?sid=1286"

[[comments]]
order = 28
subject = "اسأل مهدي عاكف"
author = "وطني"
posted = "2006-12-15"
text = "كان في حد بيسأل عن السلاح وبيقول طب لما هي مليشيا السلاح فين وبغض النظر عن غباء السؤال بقول للحد ده اللي هو اخواني زي أي اخواني دماغه ميح : اسأل مهدي عاكف عليه بس غالبا مش هيرد عليك لان مجرد عبيط من العبط اللي كل اللي عليهم التنفيذ وبس يعني السمع والطاعة وخصوصا وانت عارف ( وممكن ما تكونش عارف) ان انت دي كل لازمتك في التنظيم وان انت ممكن تتكفر لو بس خالفت الأوامر ده ناهيك عن ان انت تنتقد مثلا أو خيالك ياخدك ان ممكن في يوم من الأيام ان الاخوان يؤمنوا بجد بالديمقراطية ويكون رئيس التنظيم بتاعهم بالانتخاب وبنصحك نصيحة الحق نفسك قبل ما تلاقيه متبرأمنك في يوم ويقول ليسوا اخوانا وليسوا مسلمين زي ماعمل حسن البنا قبل كده في ناس من النظام الخاص ده يعني لو عندك فكرة عن التنظيم الارهابي اللي سيادتك مسحوب فيه"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217235441/http://masr.20at.com:80/article.php?sid=1286"

