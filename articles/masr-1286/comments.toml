text = "هذا الفعل الذى تم فى جامعة الأزهر الصرح الدينى وأمام مكتب ولى أمر الجامعة هو (((( الخروج على الحاكم لمن لا يعرف للخروج معنى)))) وهذا الفعل يدل على الجهل بأحكام الشريعة الغراء فالى الله المشتكى فيمن يفسدون الشباب بالفكر الخروجى للخوارج واسلافهم من قبلهم فهل يتوبون الى الله ويستغفرونه والله غفور رحيم."
