subject = "فعلا يجب مواجهه هذا النظام العميل"
author = "مسلم مصري ليس اخواني"
posted = "2006-12-12"
text = "فعلا يجب مواجهه هذا النظام العميل باي طرق فمبارك لم ولن يترك شيء في البلد الا وسيبيعه للاجانب من الامريكان واليهود , ولن يترك مبارك منصبه الـا وسيوررثه لابنه المجنون الشاذ جمال , فماذا ننتظر .<br />هل ننتظر اليوم التي تعرض الحكومة المصريين انفسهم للبيع بحجة الخصخصة والمصمصة."
