[[comments]]
order = 13
subject = "سلام الله عليكم"
author = "فكر جديد"
posted = "2007-01-05"
text = "كنت أرجو ألا يتم تصعيد الأمر بهذا الشكل<br />ولكنى أقول<br />امضوا على بركة الله ياشباب الاخوان فلولاكم فى الجامعة لنهبت حقوقنا أكثر مما هى<br />وحسبكم شعار القول والعمل\" خير الناس أنفعهم للناس\"<br />وقد رأيت ذلك بأم عينى وأحسسته بقلب عقلى<br />ولكنى أقول أنتم حملتم أنفسكم هذه الرسالة لخدمة هذا الدين فاحتسبوا واصبروا وما قوم عاد من الظالمين ببعيد"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042236/http://masr.20at.com:80/article.php?sid=1286"

