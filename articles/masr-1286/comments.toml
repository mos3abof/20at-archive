order = 0
subject = "يا دى التهويل اللى فى المصرى اليوم"
author = "ياسر ابو عمار"
posted = "2006-12-11"
text = "والله الواحد زهق من التهويل اللى ادمنته المصرى اليوم وسياستها الغريبة فى نقل الاخبار وتفسيرها على مزاج اصحاب الجريدة او ادرة تحريرها وذلك لاهداف انا شخصيا لا اعلمها ،فضلا عن اخطائها المهنية التى اصبحت تتكرر بشكل دورى ،بصراحة الواحد مش عاوز يقول ان اللى بيصرفوا على الجريدة -والكل عارفهم-هما اللى بيوجهوا صياغة الاخبار والموضوعات .<br />انا شايف ان موضوع الميليشيات ده سقطة لا تغتفر للمصرى اليوم ،وتوجيه للاحداث فى ناحية بعيدة تماما عن حقيقتها ،الموضوع ده مش اول مرة يتعمل ،وهو عبارة عن عرض كاراتيه اتعمل عشرين مرة قبل كده فى الجامعات المصرية ،ايه اللى دخل مسالة الميليشيات والكلام الفارغ اللى الفه الاخ محرر الخبر او اللى دسكه ؟<br />يا جماعة راعوا المهنية الصحفية ولا تضخموا احداثا لا تستحق."
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045403/http://masr.20at.com:80/article.php?sid=1286"

