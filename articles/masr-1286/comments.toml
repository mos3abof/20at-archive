[[comments]]
order = 20
subject = "القبض على 180 طالب من الاخوان"
author = "قوات الأمن المصرية تعتقل النائب الثاني للمرشد العام للإخوان المسلمين"
posted = "2006-12-14"
text = "في تصعيدٍ جديدٍ وخطيرٍ شنت قوات الأمن المصرية حملة اعتقالات موسعة شملت العديد من قيادات الإخوان المسلمين وعلى رأسهم الرجل الثالث في الجماعة المهندس محمد خيرت الشاطر النائب الثاني للمرشد العام، والمهندس أيمن عبد الغني زوج ابنة الشاطر، والمهندس ممدوح الحسيني وآخرين.وأكدت مصادر الجماعة أن هذه الأسماء هي فقط التي تم التوصل إليها أثناء عملية المداهمة والاعتقال التي بدأت في الثالثة من فجر اليوم الخميس 14/12/2006م وهو ذات توقيت كتابة هذه السطور.الجدير بالذكر أن حملة الاعتقالات الجديدة تتم بعد حملة إعلامية واسعة شنتها أجهزة الإعلام المصرية على جماعة الإخوان المسلمين، متهمةً إياها بالعنف متذرعةً ببعض المشاهد التمثيلية التي قام بها بعض الطلاب في جامعة الأزهر.كما أن هذه الحملة تأتي في أعقاب ثلاثة أيام من الإفراج عن الدكتور محمد مرسي عضو مكتب الإرشاد والدكتور عصام العريان القيادي في الجماعة؛ وهو ما يمثل حالة من النكوص والترجع عن كل الوعود المعلنة من قِبَل النظام المصري لعمل إصلاحات حقيقية في الحياة المصرية."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217235441/http://masr.20at.com:80/article.php?sid=1286"

