[[comments]]
order = 5
subject = "عليه العوض فى البلد"
author = "لا مهو السلاح جاى قريب يا حلو منك له"
posted = "2006-12-11"
text = "بقامناظر زى دى تتعمل سواء فى الجامعه فى مدينه جامعيه ولا حتى فى خرابه مش ده المهم بلاش كلام فى تفاهات وقال ايه عرض رياضى برىء .... انتو عبط ولا بتستعبطو الناس.<br />طبعا انا هطلع عميل عشان قلت الكلمتين دول و ممكن اطلع اسرائيلى كمان ومش بعيد حد يتهمنى انى جوز خاله حسنى مبارك وطبعا هاخد لى شتيمتين معتبرين<br />مهم كلميتن محفوظين بيتقالو للى يقول راى غير رايكم من غير اى تفكير مما يؤكد على انكم بهايم.<br />يا ناس يا بقر حرام عليكم بقى هم دول اللى عاوزينهم يحكموكم هى دى الجماعه المسالمه اللى مش عارف ايه انتو يا كلكم اخوانجيه اصحاب مصالح يا اما مغفلين<br />عادى ما انتو احفاد اللى راحو اترجو محمد على عشان يحكم مصر و بعد كده قعدوا يصوتوا من ظلمه على الشعب!!!<br />قبل ما اتشتم : روحو فى ستين داهيه كلهم لا يهمنى كلامكم موتو بغيظكم واولعو بجاز وجاتكم ستين نيله اكتر من النيله اللى انتو فيها بعقولكم المتخلفه."
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045403/http://masr.20at.com:80/article.php?sid=1286"

