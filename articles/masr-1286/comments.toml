[[comments]]
order = 30
subject = "ما اشبه الليلة بالبارحة"
author = "مهموم"
posted = "2006-12-15"
text = "ما أشبه الليلة بالبارحة اليوم يتنصل محمد حبيب مما فعله الطلبه في جامعة الأزهر ويقول ان ما حدث هو موقف فردي لا يعبر عن الجماعة وكأن ما حدث لم يتم بتدبيرهم وخصوصا ونحن نعلم آليات العمل داخل الجماعة والتي تتعامل مع هؤلاء الطلبة كمجرد آداه ليس من حقهم التصرف دون أوامر .<br />والبارحة حين قام النظام الخاص باحدي عملياته الارهابيه الشهيرة وهي عملية قتل النقراشي وكانت ردود الفعل عنيفة فضحي حسن البنا بهؤلاء الشباب وأصدر بيان بادانتهم وقال ليسوا اخوانا وليسوا مسلمين .<br />والسؤال هنا هل لو لم تكن ردود الفعل بهذا العنف والاستنكار لما حدث هل كان حبيب ليصدر تلك الأقوال؟<br />الطريف في الأمر أن ما قاله يتناقض مع ما قاله مهدي عاكف من ان الأمر مجرد عرض عادي ولأنه غبي ولانه أحد أبناء النظام الخاص الرهابي فهو لم يجد ما يشين في التلويح بالارهاب .... فمن الطبيعي ألا يجد الارهابي غضاضة في الارهاب أو في التلويح به"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217235441/http://masr.20at.com:80/article.php?sid=1286"

