[[comments]]
order = 48
subject = "الاسلام هو الحل رجال فى زمن عز فيه الرجال"
author = "ابو دحية"
posted = "2007-01-13"
text = "الله معهم شباب الاسلام امضوا على بركت الله ولا تنظروا خلفكم فالاسلام منتصر باذن الله ولو كره المنافقون لا تلقوا بالا الى ما يقولوا فمن اتبع اليهود والنصارى ماذا ننتظر منه انتم جيل المستقبل والمستقبل للاسلام"
archived = "2007-01-15"
capture_url = "https://web.archive.org/web/20070115142407/http://masr.20at.com:80/article.php?sid=1286"

[[comments]]
order = 49
subject = "رجال أحرار واثقين بنصر الله \"جماعة الاخوان المسلمين\""
author = "ابو دحية"
posted = "2007-01-13"
text = "امضوا على بركة الله ياشباب الاخوان فلولاكم فى الجامعة لنهبت حقوقنا أكثر مما هى<br />وحسبكم شعار القول والعمل\" خير الناس أنفعهم للناس\"<br />وقد رأيت ذلك بأم عينى وأحسسته بقلب عقلى<br />ولكنى أقول أنتم حملتم أنفسكم هذه الرسالة لخدمة هذا الدين فاحتسبوا واصبروا وما قوم عاد من الظالمين ببعيد"
archived = "2007-01-15"
capture_url = "https://web.archive.org/web/20070115142407/http://masr.20at.com:80/article.php?sid=1286"

[[comments]]
order = 50
subject = "منارة العلم الإسلامي تعود لرشدها"
author = "سيف الحق"
posted = "2007-01-15"
text = "الحمد لله رب العالمين أن الصحوة الإسامية بدأت تنطلق من مراكزها من جديد من حيث أنطلقت سابقاً ولاتستهينوا بهذه الأفعال التي لا زالت لاتصل إلى المستوى المطلوب فالخير قادم والمرد الإسلامي بدأبالنهوض ونهاية االباطل والظلم قد بدأت"
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120125517/http://masr.20at.com:80/article.php?sid=1286"
