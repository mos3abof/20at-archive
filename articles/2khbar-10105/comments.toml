author = "مش متطرف"
posted = "2008-09-18"
text = "طالما الحكومةبتكافح الدين وبتعامل الاسلاميين كمجرمين وحرامية وبتدخلهم السجون وبتعملهم محاكم عسكرية يبقى لازم تكون دي النتيجة<br />تتصوروا فيه حاجه اسمها في وزارة الداخلية مكافحة الجماعات الاسلامية<br />يعني فيه ضباط مكافحة جماعات اسلامية زي المخدرات بالضبط<br />يعني بيكافحوا الدين بيكافحوا لا اله الا الله محمد رسول الله<br />بيكافحوا المصلحين اللي عايزين ينضفوا البلد<br />عايزين يساعدوا الناس عايزين يطوروا الناس<br />كلهم في السجون<br />خلاص اشربوا بأه مسجلين خطرين"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519200847/http://www.20at.com:80/2khbar/10105.html"

