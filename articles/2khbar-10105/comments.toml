posted = "2008-09-19"
text = "والله لما تكون جهاز الشرطة فيه ضباط من عينة اسلام نبيه ومحسن منير السكري<br />جهاز الشرطة فيه سفاحين وقتله وحرامية<br />يبقى الناس العاديين ليهم حق"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519200847/http://www.20at.com:80/2khbar/10105.html"

