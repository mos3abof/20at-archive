text = "الجماعات الإسلامية لا تقل خطر عن الإرهابيين و مسجلين الخطر و تجار المخدرات ..لكن على الأقل المجرمين بيقولوا احنا مجرمين ..لكن سيدنا الشيخ في الجماعة بيتدارى وراء ستار الدين ..و الله أعلم بما في القلوب"
archived = "2009-05-19"
