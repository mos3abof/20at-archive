[[comments]]
order = 6
subject = "اضائة الفانوس على الرافضة المجوس"
author = "عبدالله بن خليفة _ قطر"
posted = "2007-01-08"
text = "داوود النعيمي . هل تعرف ان تعد إلى العشرة ؟<br />ارجع إلى كتب الخميني الهالك قدس الشيطان سره . وستعرف ان الروافض اخطر من اليهود واحقد من اليهود على أهل السنة ، لكن ولله الحمد والمنه ، رد الله كيدهم في نحرهم وبدت تنكشف حيلهم امام الشعب العربي بعد ما اغتر الكثير من العرب بحزب اللات ، وحزب الشيطان هذا من اكذب الاحزاب على وجه الأرض ، دين الإسلام دين تسامح مع من قر بذنبه وطلب الصفح ، لكن من يتلون مثل الأفعى فلا عذر له .<br />صدقتي يا ام زايد ولله درك ، صدق انهم آل بيت الأبيض .<br />محمد بن سالم الله يكون في عونكم من القوارض ، قصدي الروافض ، الكويت ما زال فيها أسود من أهل السنة والجماعة . ولا خوف عليهم فهم متوكلين على رب العالمين<br />اماكلاب الشوارع والكلام الضاله من الروافض فليس لهم سوا النباح في حسينياتهم<br />أم خليفة لله درك ، وحفظ الله دار زايد من جرذان الشيعة أحفاد المجوس<br />وانت ياللي تقول زعماء شيعة مصر ؟ مصر من متى فيها شيعة ؟ واي زعيم شيعي في مصر ؟ انت تبي تسوي لك تاريخ بالغصب ؟ انتوا اذا كان لكم تاريخ ، بيكون ملطخ بالدماء والكذب والنفاق والخايانات والدسائس والسب والشتم . دين الشيعة قائم على السب والشتم ، ومن تشتمون ؟ افضل وخيار أهل الأرض بعد الرسول عليه الصلاة والسلام وهم صحابته الكرام وزوجاته و و و و و .. الخ<br />لعنة الله على الخميني ملعون الوالدين اللي كان يبيع سمبوسه في الهند وفي الاخير حكم دولة مجوسه . ماعليه عتب لعنه الله في قبره ، لقا له كم خروف من خرفانا فارس يحكمهم وهم مثل الغنم يسيرون على ركبهم .<br />والله لن تنفعكم خيانتكم ولا دسائسكم ولا تحالفكم مع اليهود سراً يا ملاعين الصير ، واختم كلامي بلعنة الله على الخميني والسيستاني وفضل الله وحسن نصر اللات والعزى ومقتدى الصدر والفخذ والركب<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128192954/http://masr.20at.com:80/article.php?sid=1143"

[[comments]]
order = 7
subject = "الطائفيه مزقتنا"
author = "أبن العرب"
posted = "2007-01-18"
text = "نجح أعداء الأمه في تمزيقها , فقد فعلت الطائفيه مافعلت في أيران ... ثم لبنان ثم العراق .... القتل والتنكيل والخراب ومالحل ؟؟؟؟ أذا كان الشيعه والسنه يكرهون بعضهما البعض .. فما الداعي للقتل ... نعم لا ود لا حب لا زواج ولكن أمورا آخرى يجب أن تسير مثل البيع والشراء ... الفزعه وقت الحاجه الضروريه .. ردع مثيري الفتنه ومقلبي الأمور .. فمثلا لو حدث أبن طائفة قومه أن تعالوا نشكل مجموعه تقتل وتنكل وترهب أبناء الطائفه الأخرى فهنا المفروض من أبناء طائفته ردعه فورا وعدم التهاون في ما يقول ومحاسبته بل وحتى سجنه أن تطلب الأمر .. المعارك بين الطائفتين أمر جديد تعايشت الطائفتين ( نعم دون مودة وأخاء ) ولكن الأمر لم يصل ألى ما وصل أليه الآن أبدا .... أعتقد بوجهة نظري الشخصيه أن من أثار الطائفيه هو ( الخميني ) عام 1979 وما قبله . مع الأسف منذ توليه سدة الحكم في أيران والمنطقه في توتر وخوف .... لقد حرمنا زيارة أيران الجميله ( زارها والدي عام 1976 ) بلد جميل وأخضر ... أما اليوم ومع الأسف يملئ شوارع أيران ( الطائفيين ) الذين شوهوا صورة البلد... وأثر نهجهم على تجارة البلد وسياحته ونسيجه الأجتماعي .. وأستغلت دول الغطرسه ( أميركا ومن معها ) هذا الأمر وتمكنت من زج المنطقه في حروب طويله ومعقده ... شيعه سنه سنه شيعه , ملت الناس من هذا الحديث .. الناس تريد أن تعيش تريد أن تحيا بكرامه فعلا سئمت من هذا الأمر ....<br />ثم ما دخل الدين بالدوله التي يجب أن تعامل أبنائها على قدر سواء... يا أخي أمر جد مستنكر أن يزور بين فتره وأخرى شخصيات في الحكومه العراقيه ما يسمى بالمرجع الأعلى ( أيا كان ) ... ما دخل المرجع الأعلى بالدوله. ألا أذا كانت دوله طائفيه قائمة على أساس طائفي ؟؟؟؟ الله يصلح حال المسلمين وينصف مظلوميهم . و<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128192954/http://masr.20at.com:80/article.php?sid=1143"

