subject = "شيعة مصر"
author = "سلمان الفارسي"
posted = "2007-01-22"
text = "لن تنالو من ثقافة الشعب المصري وتفتحه وايمانه بالعيش المشترك ، مصر بلد حضاري ولا يعرف ابنائها هذه الشتائم القذرة ، فدعو وساختكم لكم وعودوا لصحرائكم ايها الاعراب وستزولون بعد خمسون عاما من الوجود مع البترول ، جئتم للاسلام غفلة وستذهبون غفلة ، الا قبح الله السنتكم وقلوبكم ومربيكم ياابناء الافاعي ."
archived = "2007-01-28"
