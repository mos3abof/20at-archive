order = 0
subject = "اي مستقبل"
author = "ابو شريف"
posted = "2006-06-14"
text = "اي مستقبل تطلب من النواب أن يعبروا بنا به ومن امتى وهذه الفكرة تشغل بال سيد قراراه ونوابه ... أهم شئ الحصانة وإن أردت في الحياة الصيانة فعلك بالحصانة<br />وشكرا"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615212433/http://masr.20at.com:80/article.php?sid=511"

[[comments]]
order = 1
subject = "موافقة موافقة"
author = "سيد مفتاح حامد"
posted = "2006-06-15"
text = "يا باشا دول اخرهم موافقة يقولوا موافقة وهما عارفين ان الحكومة هى اللى جايباهم وان اللى هى عايزاة هو اللى يكون"
archived = "2006-06-15"
