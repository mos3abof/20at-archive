[[comments]]
order = 2
subject = "الحزن الوطني"
author = "قذائف الحق"
posted = "2006-06-16"
text = "السلام عليكم<br />صدق من سماهم نواب الحزن الوطني<br />سلام<br />أخوكم قذائف"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031938/http://masr.20at.com:80/article.php?sid=511&PHPSESSID=7799781482a9ff7d72e5ea636bcd291b"

[[comments]]
order = 3
subject = "ده لازم يحصل"
author = "زهره"
posted = "2006-06-16"
text = "السلام عليكم:<br />مستنين ايه من نواب خانو الجماهير التى قامت بانتخابهم<br />اغلبهم كانو مستقلين والناس انتخبتهم<br />على هذا الاساس ورفضو نواب الوطنى ورغم كدا المستقلين بقو حزن وطنى<br />وهما اللى بيشكو فى شرعيه الاخوان رغم ان الاخوان فى حملتهم قالو انهم اخوان<br />ده كان لازم يحصل"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031938/http://masr.20at.com:80/article.php?sid=511&PHPSESSID=7799781482a9ff7d72e5ea636bcd291b"

[[comments]]
order = 4
subject = "بضاعتنا ردت الينا"
author = "صرماتى"
posted = "2006-06-17"
text = "المشكله ان هذا المجلس الخايب هو افراز سيىء للشعب الخايب \"من عملنا سلط علينا \"<br />وحسنى مبارك ونظيف وخلافهم هو افراز وطنى مصرى عن شعب من تاريخه القديم يستعذب الذل والمهانه ويحيى ويهتف للمستبد ويستسلم للطاغيه ونحن نستحق هذا الذل والاستبداد لقد تحولنا من اناس الى مجموعه من الاغنام يجرجرونا الى الصناديق لنجلب لزربيتهم مجمعه من الاعضاء الذى يزيدون من اسنحقارهم لنا وناهيك عن القوانين التى تخرج من دورات المياه ويتجرعها الامه الموكوسه لن ينصلح حالنا حتى انضربنا بالجزم ولو حتى خطفوا بناتنا وحريمنا"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031938/http://masr.20at.com:80/article.php?sid=511&PHPSESSID=7799781482a9ff7d72e5ea636bcd291b"

[[comments]]
order = 5
subject = "كله زى بعضه"
author = "مشفارقه"
posted = "2006-06-18"
text = "اهوه كله زى بعضه معديتش فارقة سينا من سونيا وسلملى على سيد قراره افندى"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031938/http://masr.20at.com:80/article.php?sid=511&PHPSESSID=7799781482a9ff7d72e5ea636bcd291b"

[[comments]]
order = 6
subject = "نائب ميعرفش حاجة"
author = "محمود سعيد محمد نصار"
posted = "2006-06-18"
text = "والله العظيم قدمت نفسى للكلية الحربية عشان ابقى فيها ولكن انت عارف قالوا لازم الواسطة قدمت ثلاثة مرات وكل مرة أدخل على مدير الكلية الحربية أقول له أرغب فى الالتحاق بمصنع الرجال وعرين الابطال ونفس النتيجة كل مرة حرام حرام حرام لحد امتى البلد هتمشى بالواسطة لحد امتى مفيش حد هياخد حقة كل دة حرام"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031938/http://masr.20at.com:80/article.php?sid=511&PHPSESSID=7799781482a9ff7d72e5ea636bcd291b"

