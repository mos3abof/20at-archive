[[comments]]
order = 0
subject = "المطلوب"
author = "ياء"
posted = "2006-05-17"
text = "بكره باذن الله عنشوف احلى شو من الامن المصر حنشوف قلى عمرنا ماشفناه<br />بكره مش حتقدر تغمض عينك على راى قناه روتانا<br />بكره مطلوب منك لو رايح وسط البلد ما ياتى<br />1- استعداد نفسى وبدنى لخوض حرب عالميه جديده<br />2-شويه عقل وصبر كبير<br />3-حذاء رياضى لزم الجرى والتنطيط<br />4 -محدش ياخد معاه كاميرات ولا موبيلات<br />5-الاتفاق مع صديق اذا لم اعد حتى الساعه الفلانيه غالبا 5 مساء ارجوك ابلغ اهلى انى سافرت الى ما وراء الشمس<br />6- محاوله الحصول على دروع واقيه مما يستخدمه الامريكان فى العراق<br />7-تىشيرت زياده<br />اهم حاجه بجد ركعتين حاجه بالليل قبل الذهاب<br />والدعاء للمصرين الاموات وقلى حيموتو لسه<br />yehia2784@hotmail"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192729/http://masr.20at.com:80/article.php?sid=341&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "نصيحه"
author = "ياء"
posted = "2006-05-17"
text = "بجد يا جماعه قلى عنده امتحانات ترم ما يرحش بكره مش خوف بس بالعقل الموسم الصيفى ده كده كده حنصيف فى ابو زعبل خلص امتحانات وقباروح زى منتا عايز الموسم لسه فى<br />محاكمه المعتقلين<br />تعديل الدستور المتوقع<br />توريث الحكم المؤكد<br />الموسم طويل طويل طويل يا ولدى<br />بجد خلص امتحانات وروح عشان تصيف فى المعتقل براحتك<br />انا بقا لو مشفتوش اسمى بكره على الموقع تعرفو انى اتخدت مع صحبى واخويا محمد السيد<br />وكل خميس وانت متظاهرين<br />وكل مظاهره وانت متخدين<br />ادعوا لمصر بالنصر والتحرير<br />سلام يا عشريناتيه<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192729/http://masr.20at.com:80/article.php?sid=341&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "الدعوه عامه"
author = "يعنى يا جماعه لو انى اتزنقت فى طلعه ـ مش جويه طبعا ـ مع خطيبتى و امها و اخواتها و اهلى علشان نشترى الجهاز اللى ابويا شحت تمنه يقوموا يعتقلونا بتهمه التجمهر طبقا لقانون الطوارىء و تبقى الدخله فى اى معتقل من معتقلات مصر المخروسه تحت رعايه جهاز امن الرئيس"
posted = "2006-05-20"
text = "عقبال عندكم جميعا<br />الله يخرب بيوتكم<br />ااااااااااااااااااااااااااااه يا بلــــــــــــدى"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192729/http://masr.20at.com:80/article.php?sid=341&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "نشرة الاخبار"
author = "ابو كرتونة"
posted = "2006-05-20"
text = "اليكم نشرة الاخبار: قامت القوات المصرية مدعومة باحدث الاسلحة المدرعة بمهاجمة اماكن العدو الحصينة امام دار القضاء العالي وقامت بقصف اماكن تجمع العدو والحقت بهم اشد الهزائم, كما قامت قواتنا المسلحة بصد امدادات العدو القادمة من شارع رمسيس لدعم العدو , وقامت بسحل العدو في الشارع وخطفهم واعتقالهم وضربهم حتي استسلموا لايدي قواتنا المجيدة<br />وبعض من اعتقلتهم قواتنا كانوا من شباب العدو العاطل , وبناته العوانس , وبعض الفقراء المسلحين, وبعض القضاه الماجورين, وبعض من الارهابين من جماعة الاخوان اليهوديين. وقد قامت قواتنا بمعاملتهم اذل معاملة سواء بالضرب او التحرش او الاهانة, وذلك بسبب اعتدائهم علي مصر ) وانتهت النشرة ...شالوم<br />للعلم اسرائيل ممكن ان تحتل سيناء كاملة الان في ثلاث ساعات فقط( شوفوا مصر كلها ممكن تاخذ في يدها قد ايه بقي) يعني يوم مع الرءافه<br />يا عم حسني بدل كل قواتك الي بعتها تضرب الناس يوم الخميس الي فات والي قبليه, يا ريت تبعد الالوف من العسكر الي ضربوا الناس الغلابة يحموا مناطقنا الي في سيناء من عملاء الموساد, بدل اما تحصل عمليات اخري وبعدين نلبسها في البدو."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192729/http://masr.20at.com:80/article.php?sid=341&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

