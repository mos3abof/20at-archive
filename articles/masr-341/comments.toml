subject = "هل تشرق الشمس"
author = "حالم"
posted = "2006-05-20"
text = "هل سياتى اليوم الذى اذهب فيه الى انتخبات حقيقيةهل سياتى اليوم الذى سيحاسب فيه الخونة والمرتشونوومن قادوا هذا البلد الى الموت حرقا او غرقا اودهس احلامه البسيطة فى ايجادطوق للنجاة بهذا البلد الى الديموقراطية"
archived = "2006-09-04"
