[[comments]]
order = 5
subject = "الناصريه شيء والصيد في الماء العكر وخلط الأوراق شيء آخر .."
author = "إبن بهية"
posted = "2006-11-30"
text = "أخي الحبيب الرفيق جيفارا ... بالله عليك كونك ناصري يعطيك الحق في استغلال أي مصيبه معديه ما لهاش دعوه بالإخوان وتروح نازل فيهم تلطيش وخلط أوراق ؟؟؟ هل ده يمكن أن يكون في صالح الوطن بأي حال ؟؟؟ طبعا أنا باحب السناوي وباحترمه لكنه فيص في الموضوع ده زي صاحبنا مكرم محمد أحمد تلاقيه عاقل وزي الفل ولما تيجي سيرة الإخوان يركبه ألف عفريت وتبص تلاقي نفسك قدام تلميذ عايز يستفز ويغيظ زميله في الفصل وبس ... يا جماعه هو ده العيب الكبير اللي فينا .. لازم نكون موضوعيين .. لو شايف الإخوان كويسين يبقى لازم أعطيهم حقهم وأكون معاهم على الباطل .. إحنا مش أعداء مطلقا إحنا كلنا بنحب هذا البلد ((لو بجد بنحبه)) ومخلصين لهذا البلد ((لو كلنا بجد مخلصين)) وما ينفعش ألاقي واحد قلبه على البلد وأهاجمه بكل وبأي وسيله عمال على بطال لمجرد خلافي معاه في بعض الأمور .. بالله ده كلام ؟؟؟ طيب لمصلحة مين ؟؟؟ ده اللي عمله نظام مبارك الواطي وخلانا ناكل في بعض بدون داعي لما كل التيارات بقت كفته من طحنها في بعض وسايبين العرص بيعمل في البلد اللي هو عايزه ... ده اللي مش عاجبني في السناوي ... ولا يعجبني من أي تيار آخر أن يتسلق على حساب الآخرين .. أرجوك تعيد قراءة مقال السناوي وترى مدى صدق كلامي ... مع خال تقديري وحبي لك وللسناوي من غير ركوب الموج والاصطياد في الماء العكر لأنها مش ناصريه خالص لو كانت كده ..<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216071237/http://masr.20at.com:80/article.php?sid=1217"

