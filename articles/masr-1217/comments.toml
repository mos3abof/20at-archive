[[comments]]
order = 1
subject = "بطل العك ده يا سناوي .. عيب اختشي"
author = "إبن بهية"
posted = "2006-11-28"
text = "الأستاذ عبدالله السناوي راجل عال العال وكله شده على النظام وريسه الواطي وكلامه كله دايماً عسل كده .. لكن ليه مش عارف حضرتك يا أستاذ سناوي بتشرب الناس كلها عسل وتيجي عند الإخوان المسلمين وتروح حاطط حفنة سم في العسل ؟؟؟ سطور المقال جيده وفي الاتجاه الصحيح ولكن ما بين السطور كله همز ولمز ولغز في الإخوان ووعود الإخوان وكأن الإخوان خلاص حكموا البلد وجه علينا الدور عشان نراجعهم ونحاسبهم .. حاسب انته يا عمنا .. انته نسيت ولا إيه ؟؟؟ الإخوان لسه في المعارضه زينا وما حكموش ... الأستاذ المحترم السناوي حول الموضوع كله للهجوم على الإخوان وقال إيه أول اختبار عام لهم ومش عارف إيه من كلام فارغ .. المصيبة أن السناوي يشدد في كل فقرات المقال على أهمية الالتفاف حول الأزمة التي نعيشها ولا نعير موضوعاً كالحجاب وصفه أو وصف له بالتهريج .. طيب وكلام حضرتك ده هنا مش تهريج التهريج ؟؟؟<br />لما تيجي تحول الموضوع كله هجوم شديد شديد شديد على الإخوان وتصفهم بأنهم فشلوا في أول اختبار حيقي للدولة المدنية ؟؟؟ يا راجل استحي شويه ... انته فاكر كلامك المهلهل ده ينطلي على عيل في الحضانة ؟؟؟ بقى الزوبعة اللي بتتكلم عليها دي ما خرجتش منها غير بهذا التصور الصبياني العاجز الكسيح ؟؟؟ لأ اسمحلي حضرتك لسه لازمك تعليم كتير عشان تتكلم بجد في قضايانا المصيرية ... لما ييجي كاتب بنحترم قلمه ونتضامن معه في الدفاع عن هذا الوطن ضد الطغاة يلتف على المواضيع ويحورها ويصوبها في اتجاه آخر بعيد تماماً عن جوهر القضية يبقى ما ينفعش نعتمد عليه في المشاركة في تحمل تبعات هذا الوطن .. لما تيجي سعادتك تصطاد في الماء العكر كده يبقى خليت إيه لنظام مبارك الواطي وقرنية الصحافة الحكومية ؟؟؟<br />يا سيد سناوي لا الإخوان فشلوا كما خيل لك شيطانك ولا أ<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216071237/http://masr.20at.com:80/article.php?sid=1217"

[[comments]]
order = 2
subject = "الأزمات تفضح المزايدين"
author = "منصف"
posted = "2006-11-28"
text = "الحقيقة إن اختراع الديمقراطية والحرية حسب المقاس يبدا من أصحاب الفكر الغير سوي فالحرية الصحيحة هى الحرية التى لاتضـر غيرك كانسان سواء فى حياته أو معتقداته وغيره وإلا اصبحنا كالحيوانات فى حريتها فى كل شيء حتى قضاء الحاجة فى الطرقات باسم الحرية.فهل سب المحجبات حرية هل نعتهم بالمتخلفات حرية هل سب المشايخ حرية هل شتمهم والقول بأنهم أو فتاويهم بثلاثة مليم حرية. والله بئس الحرية التى تنادون بها حرية الحيوانات التى ليس لها رابط ولاضابط إلا أهواء من ليس له عقل من الحيوانات وعذراً فبعض الحيوانات بيعرف مصـلحته."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216071237/http://masr.20at.com:80/article.php?sid=1217"

[[comments]]
order = 3
subject = "كنت محتار أعلق ولالأ؟؟ لكن عجبني تعليق ابن بهية"
author = "محمد السيد"
posted = "2006-11-28"
text = "الحقيقة أنامش حأعلق حأكتفي بنقل باقي التعليق اللي قبلي ... وتقدروا تعتبرونى متفق مع معظم اللي فيه .....<br />يا سيد سناوي لا الإخوان فشلوا كما خيل لك شيطانك ولا أي حاجه من ده كله .. الحكاية أن وزير في حكومة مصر عايز يفرض رأيه على الناس ((منين حرية رأي بقى ؟ ده مش شخص عادي يا سناوي ده وزير في حكومة)) تيجي تقولي الإخوان مش عايزين حرية رأي ؟؟؟ ما تقول اللي انته عايزه .. حد كلمك ؟؟؟ لكن لما تبقى وزير وده مكن قريب لو لينت المسائل وركبت الموجه ورفعت شعار أكل العيش وأهم شيء ركبت القرنين يبقى مش من حقك تعلن رأيك على الملأ .. لأنه ببساطة سيكون رأي حكومة البلد يا اسطى سناوي ..<br />أنا لا لي دخل بالإخوان ولا يحزنون بس بيغيظني أوي الاصطياد في الماء العكر والاستهبال كده وخلط الأوراق والمواضيع وتضييع الحقائق على الناس .. والنبي يا عم سناوي فيه استهبال أكتر من اللي حضرتك بتستهبله ده ؟؟؟ من ناحية بتلطم وتصرخ سيبونا من الموضوع الهايف بتاع الحجاب ده .. خلونا في الأزمة الحقيقية وهي الفساد .. وتكمل بقية مقالك بهيافة ما بعدها هيافة .. يعني حضرتك بتعطي في البداية انطباع جيد عن حضرتك إنك راجل بيتكلم بجد وله هيبة ووقار استمده من تبني رأي السيد المرشد العام للإخوان المسلمين وتكمل المقال في الهجايص والهجوم على الإخوان وكأنهم هم من اخترع هذا الوضوع الهايف أو التهريج ؟؟؟ يعني انته مبسوط من نفسك كده ؟؟؟ ما أظنش .. عيب العك ده .. هو ده اللي لازم نحاربه .. نحارب العك الصحفي والعك السياسي وركوب أي موجه ممكن تطرطش على غيرنا .. يا حبيبي عيب الأساليب الواطية دي.. خلاص بطلت من زمان والناس بقت واعيه وفاهمه وبتقرأ ما بين السطور قبل السطور .. بطل عك انته بقى ..<br />إبن بهية<br />وبرضه مش حاسكت<br />لا للتمديد ... لا للتوريث .<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216071237/http://masr.20at.com:80/article.php?sid=1217"

