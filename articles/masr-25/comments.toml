text = "بنحبك ياباشا الله , بس لو مكنتش اقره<br />ادهم صبري والعالم التانيه دي<br />خلتني اعرف يعني ايه \"وطن\" هو صحيح ابن ___ بس نعمل ايه بقي,<br />وياررريت نشوف حاجات حلوه كتير من بتاعتك<br />زي \" ارزاق\"."
