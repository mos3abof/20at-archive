[[comments]]
order = 0
subject = "شكرا لكاتب المقال"
author = "hassene"
posted = "2006-03-13"
text = "اناباكتب الاسطر دي عشان اشكر كاتي المقال على اسلوبو الحلو والساخر في الكتابة<br />ده خلاني اضحك من اسلوب مصطفى شعبان في التعامل مع الناس<br />شكرا لكاتب المقال الذي كشف لنا حقيقة هذا النجم المتعالي والمغرور<br />ومرة اخرى برافو على الاسلوب الساخر<br />و المميز لكاتب المقال<br />ارجو انو يمتعنا بحاجات جميلة زي كده دايما<br />على فكرة انا من تونس<br />سلام"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205008/http://masr.20at.com:80/article.php?sid=25&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "يمكن....."
author = "أمير"
posted = "2006-03-14"
text = "لن أدافع عن النجم الشاب ولن أدينه لأنى لا أعلم الحقيقة أو غير متأكد منها<br />لكن ما أتأكد منه أن بحكم معرفتى وتعاملى مع الصحافة تأكدت انها دائماتعشق المبالغة فى مثل هذه المواقف<br />وحسب ماقرأت عن نفس الموضوع فى مواقع أخرى، فطلبة الكلية كانوا يلتفون عليه بعشوائية، مع العلم أنه مذكور أن عدد الطلبة كان بالالاف، فلتتخيلوا المنظر، الاف من الطلبة والطالبات فى سن المراهقة، نادرا ما يروا ممثلا أو شخصا مشهورا ملتفين حول هذا الممثل، والذى يجب عدم تجريده من الصفة البشرية، طبيعى أن يطلب هذا البنى ادم قبل أن يكون نجما بتأجيل موعد الندوة مع تنظيم أفضل، وحسب ما قرأت فى مواقع أخرى، فهو طلب جديا تحديد موعدا اخر للندوة، وقبل أن يهجامه أحد، فليتخيل نفسه فى هذا الموقف، وحوله الالاف و أكرر كلمة الالاف من المراهقين، وطبعا مش محتاج أقول النظام فى الأماكن دى بيكون عامل ازاى"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205008/http://masr.20at.com:80/article.php?sid=25&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

