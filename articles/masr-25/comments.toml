subject = "كذب"
author = "مروه"
posted = "2006-03-24"
text = "الكلام ده كذب مصطفى حضر الندوه بنفسه واتكلم معانا وفرح اوي لما خرج والندوه خلصت ان الطلاب التفوا حول عربيته ومكنوش عايزينه يمشي هو مش زي احمد السقا مبيحبش جمهوره ..مصطفى احسن واحد في الوسط ومتواضع وحضر الندوه وكان سعيد جدا<br />الاعتذار جه من نيللي ونور بس<br />وياريت منألفش"
