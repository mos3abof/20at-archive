[[comments]]
order = 2
subject = "متابع"
author = "عقدت في 17 مايو الحالي جلسة استماع في مجلس النواب أمام اللجنة الفرعية للشرق الأوسط بلجنة العلاقات الدولية الخاصة بالشرق الأوسط، وجاءت هذه الجلسة في توقيت هام إذ أنها كانت بعد عدة أيام قليلة من زيارة سرية قام بها نجل الرئيس المصري جمال مبارك لواشنطن، وفي الوقت الذي تمتلئ فيه الصحف والتليفزيونات الأمريكية بأخبار قمع الحكومة المصرية المتكرر والعنيف للمتظاهرين سلميا في وسط القاهرة."
posted = "2006-05-22"
text = "أدلي بشهادتهم أمام اللجنة كل من:<br />- ديفيد ويلش David Welch ، مساعد وزير الخارجية لشئون الشرق الأدنى وسفير الولايات المتحدة في مصر سابقاً.<br />- السيد جيمز كندر James Kunder ، مساعد مدير وكالة المعونة الأمريكية لمنطقتي آسيا والشرق الأدنى.<br />- والسيد مايكل كولتر Michael Coulter ، نائب مساعد وزير الخارجية للشئون السياسية والعسكرية.<br />ورأست الجلسة النائبة الجمهورية روس ليثنيان Ros- Lithinen من ولاية فلوريدا.<br />الإدارة الأمريكية تشيد بالدور المصري<br />أفتتح السيد ديفيد ولش كلامه بسرد المواقف المتعددة التي وقفت فيها مصر إلى جانب الولايات المتحدة كشريك متضامن في الحرب على الإرهاب، وطبقا لويلش فقد ظهرت هذه الريادة في صور شتي منها قرارات التصويت الصائبة في مجلس الأعضاء الإداريين في هيئة الطاقة الذرية، وموقفها في مجلس الأمن والأمم المتحدة تجاه القضية الإيراني، بالإضافة إلى مبادرة مصر بالموافقة على اتفاقية أبوجا، والتزامها العام بتوفير القوات العسكرية عندما يطلب منها ذلك.<br />وأضاف ويلش أن الإدارة الأمريكية ترغب في رؤية نفس هذه الجهود على مسار الإصلاح السياسي، كما أحرزت مصر تقدما اقتصاديا ودولياً، وأشار ويلش أن الإدارة الأمريكية قد حثت مصر على تنفيذ البنود التي حددها الرئيس مبارك من اجل الإصلاح السياسي في مصر، واستبدال<br />اقرأ بقية التعليق .."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114814/http://masr.20at.com:80/article.php?sid=351&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "منقول"
author = "منقول"
posted = "2006-05-23"
text = "منقول<br />:سيدي الرئيس .. أنت جبان<br />أراك تلتصق الآن في مقعدك الوثير، وتثبّت عينيك على الشاشة الصغيرة، وترتعش يداك وهما تتعّرقان حول سمّاعة الهاتف، وقد جاءك صوتٌ من أحد كبار الكبار يطمئنك بأن كل الأمور على ما يرام، وتمام يا أفندم، فقواتك الباسلة، يا صاحب الضربة الجوية الأولى، اخترقت بشجاعة منقطعة النظير جيشاً عرمرم من شباب صغير ومرهَق من السهر استعدادا للامتحانات، ثم لبى نداء قضاته الشرفاء.<br />كانوا عشرة على الرصيف، وجنودك الأبطال أكثر من تسعمئة يحاصرونهم. القانون يقول بأنه يتم القبض على مخالفيه، ثم يُعْرَضون على النيابة. أما قانون الجبان فيطلب من كل ثلاثين أو أربعين كلبا محاصرة مواطن واحد، ثم القائه أرضا، وركله بشدة في كل أنحاء جسده حتى يتورم، وتنفجر من مساماته دماء حمراء قانية.<br />أراك هاربا في ايطاليا أو ألمانيا أو المغرب أو شرم الشيخ، وأتحداك أن تخرج في موكب مخترقا شوارع العاصمة ولو كنت في حماية أمريكا واسرائيل وكل كلابك الذئبية المفترسة.<br />أقدم اعتذاري الشديد لكل الطيارين الأبطال الوطنيين الذين رعتهم سماء مصر في السادس من أكتوبر عام 1973، وأقول لهم بأن هذا الرجل ليس منكم وليس مِنّا.<br />لعلك كنت تستلقي من الضحك على غضروفك الذي آلمك عندما بلغك نبأ تحرش ضباطك وجنودك بفتيات مناضلات أصغرهن أكثر منك شجاعة، وأعمق حبا للوطن، وأقرب لروح السماء منها لتراب الأرض.<br />انتقدتك كثيرا، وكتبت عنك ما ظننت أنه يفجر الماء من الصخر، ولكنني هذه المرة أحمل لك رسالة من سبعين مليونا من المصريين، ومعهم ستة ملايين مغترب منعهم ظلمك أن يدلوا بأصواتهم في الانتخابات الأخيرة خشية أن يكون الوعي قد أصابهم، والخوف من زائر الفجر قد زال عنهم في الغربة.<br />الرسالة التي أستطيع أن أختصر لك فيها ربع قرن من حكمك ا<br />اقرأ بقية التعليق .."
archived = "2006-12-15"
