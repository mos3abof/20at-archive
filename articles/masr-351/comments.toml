text = "ما شاء الله يا دكتور ... المقال أكثر من رائع ... يا ريت تستكمله بمقالات أخرى عن السيناريوهات المتوقعة في الفترة المقبلة مع استمرار الوضع المحتقن بهذا الشكل ... فأسلوبك في التحليل المنهجي وقراءة الأحداث بشكل ثاقب يعجبني جدا ... ولك الشكر"
