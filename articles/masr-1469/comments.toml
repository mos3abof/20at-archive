[[comments]]
order = 13
subject = "خير انشاء الله"
author = "الهندي"
posted = "2007-01-22"
text = "انت المصري ونحن المصريون وجع بطننا بالسموم وبفسدوا الدم وحرقوا الفنون في قصر بني سويف<br />انت المصري وهم ليسوا مصريون يطلبون الامل ويحبوا التضحية<br />من المصري ومن المصريون<br />المصري الي الزمن ينده ويسالة عن بلوتة<br />يرده هو وهو بيبكي علي نيبنتة<br />انا مالي ومال عيالي اتسرق<br />وانا مال ومال جدودي اتحرق<br />وانا مال واقعد في بيتي<br />واستخبي من الامل<br />اصل الامل ده تهمة وقضية<br />عندنا ممكن يحولك لامن<br />دولة او تروح لربنا<br />علي نعش او متقطع<br />بس المهم لا تنسوا انا المصري<br />والله يا استاذ عبد الله فكرتنا بوجعنا وتعبنا والقرف"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091423/http://masr.20at.com:80/article.php?sid=1469"

[[comments]]
order = 14
subject = "محمد السيد حرامي يا رجاله وسارق التعليق بتاعه"
author = "ارسل: الخميس يوليو 27, 2006 1:12 pm موضوع الرسالة:"
posted = "2007-01-22"
text = "أنا المصري.!! قصيدة في حب شهداء لبنان المقاومة!!<br />لبناية تصرخ حوش عنا يارب<br />بقلم: عبدالرحمن الأبنودي:<br />أنا المصري.. كريم العنصرين<br />سليل المخلصين.. المؤمنين<br />وحامي الأمة في وقت الشدايد<br />وشقَّاق السِّكك للواردين<br />ودمّي ملك ليكم.. أجمعين<br />أنا المصري<br />كريم العنصرين.<br />أنا المصري كريم العنصرين..<br />فقدت العقل والصوت والأيدين<br />وبعد ما كنت نجدة وروح ووقفة<br />مانيش عارف نسيت ده كله فين<br />ومين اللي سلبني اسمي مين؟!<br />أنا المصري..<br />كريم العنصرين..؟<br />وكنت أصرخ أطفِّي النار بصوتي<br />ويحيي أمّتي في الشدّة.. موتي<br />فمين اللي كتب عاري ف جبيني<br />ومين اللي سرق شعلة سكوتي<br />وأنا اللي غنايا صحي العالمين<br />أنا المصري<br />كريم العنصرين..؟<br />أنا مِتْباع.. ماهيش عادْتَك يا وطني<br />عدوْ.. لِعدو.. ومين ما قبضْش تَمَني<br />صبي البقال يتاجر في الضماير<br />وأحلا عمري ضاع مستنِّي زمني..<br />بقينا بصمتنا الموت.. مُكتفين.<br />أنا المصري<br />كريم العنصرين<br />كان الوحل.. شد الرِّجل منِّي<br />أنوح وأبكِي وأنا قاصد أغنّي<br />وواقفين علي الشطوط بأيادي سودا<br />محال.. حيغرّقوني غصْب عني<br />لو نصبوا في قلبي ميت كمين<br />أنا المصري<br />كريم العنصرين.<br />بنيتها من الهرم للسدِّ.. يَدِّي<br />بنتْها كلها ف لحظة تحدي<br />وكنت زعيم نبيل ما بين جيفارا<br />وتيتو وكاسترو ونهرو وغاندي<br />ومش محتاج أقول أنا كنت مين؟<br />أنا المصري<br />كريم العنصرين!!<br />وكان يخطب تصيب الدنيا ربكة<br />ومن لبنان يعود أسطول أمريكا<br />ولينا في الوجود كلمة ومكانة<br />وأخوة في الأمل.. دمعة وضحكة<br />ور<br />اقرأ بقية التعليق .."
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091423/http://masr.20at.com:80/article.php?sid=1469"
