subject = "إيه يابن الطحاوي"
author = "أنا"
posted = "2007-01-20"
text = "والله كنت فاكر إن مستجاب الرهيب خلاص مات ... لكن إبن الهرمة ضحك على كل العدا ورمى البذرة قبل ما يموت فطرحت الطحاوي ... يخرب بيت طينك يامصر.. طينك لسة فيه بواقي طمي الفيضان رغم كل اللي صابه ونابه... يخرب بيتك يا طحاوي ..أراهنك وانت بتكتب ذاتك ونفسك إن عفريت التاريخ كان لابسك ..آه ياطحاوي يامجرم .. مشيتنا معاك من تحت من أول بلاد بون لغاية اللا الازرق .. خليتنا نشم ريحة تراب عمرنا وتاريخنا ونفسنا ..يخرب بيتك ياطحاوي .. قصدي يابذرة مستجاب اللي طرحت تاني."
