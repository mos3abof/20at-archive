[[comments]]
order = 2
subject = "لا للفقر..لاللبطالة..لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-01-20"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو السيلة الوحيدة للتوظيف<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />من الاخر ياناس ده قانون ظالم وسيهدم اركان المجتمع الذي يقوم علي الاستقرار الي مجتمع يقوم علي التعاقد المؤقت ثم الي الشارع انت واسرتك ايه الموظف المسكين."
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091423/http://masr.20at.com:80/article.php?sid=1469"

[[comments]]
order = 3
subject = "طوبى لمن لا يمللك شيئا فاصبح لا يخشى شيئا"
author = "نيفين نيفى نوفا"
posted = "2007-01-20"
text = "بس الناس ف مصر لسه بتخشى حاجات كتير صدقنى<br />بتخشى فقد الامن المزيف<br />بتخشى فقد العمل اللى مبيجيبش عائد بتخشى من الكلاب على ولادها<br />بتخشى تفقد ادميتها ف اقسام الشرطه ماركه سجن ابو غريب<br />للاسف يا طحاوى ليس كل من لايمللك شيئا لا يخشى شيئا<br />المقال رائع"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091423/http://masr.20at.com:80/article.php?sid=1469"

[[comments]]
order = 4
subject = "مانا اللي رميت الطوبة دي وكنت جاي أرميها تاني"
author = "محمد السيد"
posted = "2007-01-20"
text = "ده رد ... كنت كتبته علي الطوبة واللي رماها ....<br />وبعدين قلت بلاش اكتبه في التعليقات .... لقيته طويل ... بس استخسرت أمسحه بعد كده .....<br />ابقي وصله للأستاذ عبد الله .. أو حتي مش لازم ... المهم إني كتبته ...وبس<br />سلام<br />أنا المصري كريم العنصرين ... المقاومة والاستقلال ...<br />أنا المصري حضارة امتدت لآلاف السنين ... و عز للإسلام في كل العصور ....<br />أنا المصري ... قيامة الدنيا قامت لما قمت .... ولما نمت ..... نامت ...<br />لما أردت ارادوا ... ولما تكلمت سكتوا ... ولما رديت ... خرست الألسن وشاهت الوجوه ...<br />لما سكت .... التتار جاؤوا... ولما نطقت خرجوا أذلاء مدحورين ...<br />ولما غفلت .... نزل الصليبيون ... ولما فقت كانت الخيبة تجر نفسها وراهم ..<br />ولما سكرت ... حل اليهود ... فلما صحيت أسكرتهم في 6 ساعات ....<br />أنا المصري .. كريم العنصرين .... الحضارة والتاريخ ....<br />أنا المصري .... بطوبتي ... بحجارتي ... بصبري ... بشدتي ... بسكوتي ...<br />يمكن بسكوتي ....؟؟<br />لكن بعد سكوتي .... اسألوا الأيام ...<br />اسألوا عمرو بن العاص ... مين فتح أفريقيا كلها ....<br />اسألوا العزبن عبد السلام ... مين وقف مع القاضي العادل ...<br />اسألوا محمد علي ... مين خرج فريزر ...وكانت بداية مصر الجديدة...<br />اسألوا الأزهر ... اسألوا عرابي ... اسألوا جمال الدين الأفغاني ... اسألوا مصطفي كامل .. اسألوا حسن البنا ... اسألوا مصطفي مشرفة ... اسألوا الشيخ كشك ... اسألوا فاروق الباز ... اسألوا أحمد زويل ...<br />اسألوا أبويا وأمي ... وإخواتي ....<br />اسألوا حبيبة قلبي ....<br />مرت سنين .... وسنين .... لكن منستش إني كنت يوم الأول .... وإني راجع تاني الأول من جديد ...<br />أنا المصري ... مش تاريخ وبس .... لكن إيمان جوا<br />اقرأ بقية التعليق .."
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091423/http://masr.20at.com:80/article.php?sid=1469"

