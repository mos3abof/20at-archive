author = "مهندس مصرى"
posted = "2010-01-21"
text = "السد العالى جبل من صخر الجرانيت الاحمر نقل الى مجرى النهر ولا يمكن ضربة اطلاقا وحتى لو استخدمت اسرائيل القنبلة الذرية فلن تؤثر فى جسم السد اطلاقا ولكن ربما تدمر شبكة الكهرباء الخارجة من السد<br />اما حكاية الاهتزازات الناتجة من تشغيل التوربينات المائية والمولدات فلها حد الانذار عندما تتخطاة ولها حد اعلى اذا زادت عنة يتم فصل التوربين او المولد اتوماتيكيا بواسطة اجهزة حماية ووقاية معايرة جيدا<br />الناس الغير متخصصة لا تتكلم فى امور بدائية يعرفها اصغر مهندس فى الكهرباء<br />كل شىء فى الكهرباء علية اجهزة وقاية وحماية للفصل فى جزء من الثانية<br />السد العالى فى امان<br />ولا داعى للكلام فى امور هى بديهيات<br />وبعدين الامور الهندسية فى بلدنا مش فوضى ولا فيها فتاوى دى امور علمية على حسب المواصفات العالمية"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123102821/http://www.20at.com:80/masr/news/15005--500-.html"

