[[comments]]
order = 0
subject = "دعاء الحكام العرب"
author = "دعاء الحكام العرب"
posted = "2007-01-09"
text = "اللهم زِد من جلوسنا على كراسينا!<br />وبارك لنا فيها!<br />واجعلها للوارث منا!<br />واجعل ثأرنا على شعبنا!<br />وانصرنا على من عارضنا!<br />ولا تجعل مصيبتنا في حُكمنا!<br />ولا تجعل راحة الشعب أكبر همنا ولا مبلغ عِلمنا!<br />ولا الإنقلاب العسكري مصيرنا!<br />واجعل القصر الرئاسي هو دارنا!<br />اللهم إنا نسألك فترة ممتدة!<br />وهجمة مُرتدة!<br />والصبر على المعارضة!<br />والنصر على الشعب!<br />ونسألك الحُسن لكن لا نسألك الخاتمة أبداً!<br />اللهم ارزقنا معونة لا نسرق بعدها أبدا!<br />اللهم لا تفتح أبواب خزائننا لغيرنا!<br />اللهم أعطنا كلمة السر لحسابات الحكام السابقين لنا في بنوك سويسرا!<br />اللهم وفق أمريكا لما فيه خيرنا!<br />اللهم اغفر لـ (جورج بوش) فإنه لا يعلم أننا لا نعلم!<br />اللهم وفقه لما فيه 99% في المئه من أصوات الناخبين!<br />اللهم اقذف حُبه في قلوب (اللوبي) الصهيوني كالجلطة!<br />اللهم لا تُحاسبه من أول غلطة!<br />اللهم نجهِ من أي إعصار أو كارثة طبيعية لأننا سنلوص مع شعبنا من غيره!<br />اللهم عليك بشعبي، أما أعدائي فأنا سأتفاوض معهم!<br />اللهم طيّب جمرتي وخبّث جمرة شعبي!<br />اللهم ارزقنا حب أمريكا!<br />وحب من يُحب أمريكا!<br />وحب ما يُقربنا إلى حب أمريكا!<br />اللهم مش كنت خلقتني أمريكاني و ريحتني!؟<br />اللهم أمركني ولا تأفغني!<br />اللهم برطني ولا تصوملني!<br />اللهم فرنسني ولا تسودني!<br />اللهم ألمني ولا تؤلبني!<br />اللهم أني أبرأ من الإستعانة في حكم شعبي بأحد!<br />ولا حتى بصديق، ولا برأي الجمهور!<br />اللهم أني أعوذ بك من كرسي لا يُخلع!<br />ومن شعب لا يُقمع!<br />ومن صحيفة لا تُمنع!<br />ومن خطاب لا يُسمع!<br />ومن مواطن لا يُخدع!<br />ومن الوقت المستقطع!<br />وأعوذ بك من كل عمل يُقربني إليك!<br />الل<br />اقرأ بقية التعليق .."
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111072042/http://masr.20at.com:80/article.php?sid=1417"

