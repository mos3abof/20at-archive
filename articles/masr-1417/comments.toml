[[comments]]
order = 3
subject = "موضوع جديد"
author = "مصرى حتى النخاع"
posted = "2007-01-09"
text = "امبارح ياجماعة سمعت ان الزبالة كانت زيادة فى المهندسين ياريت ياادارة الموقع تتحفونا بموضوع عن الزبالة وياريت تحملوا الحكومة سبب البلوة الجديدة دى ومافيش مانع نسمع راى البية عاكف فى المشكلة الكبيرة دى<br />ومتنسوش تسودوها فى وشنا كمان ويجعلة عامر ؟"
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111072042/http://masr.20at.com:80/article.php?sid=1417"

[[comments]]
order = 4
subject = "شكرا للرئيس"
author = "كان الرئيس مع اولمرت حاسما وقويا وال كلاما رائعا"
posted = "2007-01-09"
text = "اما الخارجية فرحم اللة عمرو موسى والدكتور فوزى وبطرس غالى وغيرهم من العمالقة<br />اسف رحمة اللة تجوز على الحى والميت"
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111072042/http://masr.20at.com:80/article.php?sid=1417"

[[comments]]
order = 5
subject = "و الله يا منى فكرتينى بالبتاع"
author = "نيفين نيفى نوفا"
posted = "2007-01-10"
text = "موضوع جميل يا منى<br />فكرتينى و انا بقرا ردود الرئيس بموضوع البتاع<br />مصر رفعت الايه من زمان و انضمت للاشقاء ليبيا و دول الخليج برئاسه الكويت اكبر قاعده امريكيه ف الوطن العربى<br />و ايه الجديد<br />بس زعلنا اوى من نزار لما قال متى يعلنون وفاه العرب<br />يللا<br />امجاد ياعرب امجاد"
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111072042/http://masr.20at.com:80/article.php?sid=1417"

[[comments]]
order = 6
subject = "سؤال مهم"
author = "مصرى حتى النخاع"
posted = "2007-01-10"
text = "الاخ اللى بيشتم المسيحيين وبيقول 6% ابت نفوسهم الخبيثة ومش عارف اية طيب انتا مش عارف ان القران بتاعنا بيقولنا ان اقرب الناس للمسلمين هما الاقباط لان فيهم قساوسة ومش عارف ان الرسول الكريم سيدنا محمد عمل هدنة مع اصحاب الديانات الاخرى<br />دة جوهلا خلاف بينى وبين كتير من الاخوان المتشددين بيفكرنى بكلام الراجل المحترم الدكتور هداية فى برنامج طريق الجداية على دريم امبارح بيقول بعض النساء بتكون فى حالة حيض ومصممة تقرا القران مثلا وقال نص القران بيقول فيما معناة التزموا بنصوص اللة تعالى حرفيا يعنى مافيش صلاة وقران وقت الحيض يبقى خلاص يعنى ربنا قال ان فيهم قساوسة يبقى خلاص اى نعم فيهم مسيحيين صهاينة لكن دول فى امريكا ومش لازم تجمع المسيحيين كلهم فى شوال واحد"
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111072042/http://masr.20at.com:80/article.php?sid=1417"

