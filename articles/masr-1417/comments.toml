subject = "من وحي الصورة"
author = "رئيس الوزراد الاسرائيلي"
posted = "2007-01-23"
text = "انا سفير شعبي انا جاي اش،ف مصلحة شعبي انا خادم شعبي اموت انا ويحيا شعبي<br />حسني مبارك<br />انا يا ابني هنا الكل في الكل اانا لما بتكلم مفيش حد بيفتح بقه كله بينضرب بالصرمه الكلمة كلمتي واللي يفتح بقه عندي مجرمين مشغلهم في أمن الدولة بيروحوا يجيبوا اتخن تخين في الفجرية ويكسروه عليه باب الشقه وبينفخوه ويقطعوه وبيبهدلوه"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127043531/http://masr.20at.com:80/article.php?sid=1417"
