author = "مش ححبك"
posted = "2010-02-08"
text = "طز في مصر<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ<br />يا جماعة القران قال<br />ولا تقربوا الصلاه<br />ايه رأيكم ما حدش يصلي اذا كنا حناخد كلمتين من القران ونعمل بيهم كتاب<br />القران بيقول ولا تقربوا الصلاه ايه رأيكم<br />فيا سعيد زفت الطين عيب لما تاخد كلمتين من الحديث وتعمل بيهم كتاب<br />بلاش شغل العيال الصيع دا واتحدى ان كنت انت خريج صحافة واعلام انت صايع ودخلت نقابة الصحافيين صياعه وضياعه<br />المرشد لما قال طز في مصر كان قبليها كلام وبعديها كلام يا ابن [ *** ]ه<br />انشر الكلام اللي اتقال كله علشان خاطر الناس تفهم<br />وما تعملش زي اللي قالوا ولا تقربوا الصلاه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــتت"
archived = "2010-02-09"
capture_url = "https://web.archive.org/web/20100209224455/http://www.20at.com:80/masr/news/15258-2010-02-08-18-41-10.html"

