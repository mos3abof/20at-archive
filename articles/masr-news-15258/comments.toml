author = "سعيد شعيب صايع"
posted = "2010-02-08"
text = "الواد دا بيشتغل في اليوم السابع<br />بكره انا حتصل وحعرفلكم مؤهله ايه<br />اكيد حيطلع صايع وملقاش شغل واشتغل صحفي<br />لان الصحافة امانه وعيب لما ياخد كلمتين من حديث طويل ويعمل بيهم كتاب علشان خاطر يشتهر على حساب اسياده واسياد امه<br />ادوني فرصه يومين بس واثبتلكم انه صايع"
archived = "2010-02-09"
capture_url = "https://web.archive.org/web/20100209224455/http://www.20at.com:80/masr/news/15258-2010-02-08-18-41-10.html"

