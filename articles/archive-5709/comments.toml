text = "بسم الله<br />أعتقد أن ما فعله الرئيس الإيراني أحمدي نجاد، هو رد الجميل لمعملته ولو بتقبيل اليد، ولا أظن أن في ذلك معضلة كما يصورها البعض، بل بالع[ *** ] تماماً. هو احترام وفضل المعلمة على نجاد. وأعتقد أنها إمراة كبيرة وليست صغير تبلغ من العمر 20 أو 25 عاماً!"
