text = "شوف الهبل الايرانى و انعدام المعرفه و التشدد المغالى فيه يقولون امراه متوسطة العمر و هى شكلها يتعدى السبعين عاما و كأنه ارتكب جريمه عندما قبل يدها و كأن رئيس مثل احمدى نجاد سوف يهتاج على معلمته السابقه او ان الجيل الصاعد و اطفال ايران سوف يعتبرونها صوره اباحيه و يهتاجون عند مشاهدة هذا المشهد فعلا قمة الرجعيه فى الحكم على الاشياء .. كلما اقرا مثل هذه الاخبار عن امثال هؤلاء من الرجعيين المتحفلطين احمد الله على نعمة الحريه<br />صديقكم المخلص دكتور بنيامين كوهين مزراحى"
