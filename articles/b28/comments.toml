[[comments]]
order = 1
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-19"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133924/http://www.20at.com/article2.php?sid=28"

[[comments]]
order = 2
subject = "الكتاب مش من العنوان"
author = "القط الأسود"
posted = "2006-09-19"
text = "واضح إن الأخت منال صاحبة أول تعليق لم تقرأ إلا عنوان الموضوع فقط...!!!!<br />الموضوع عن الناس اللي بتتعرف على بعضها أثناء السفر وركوب المواصلات مش جواز السفر الذي نستخدمه في السفر...<br />الله يكرمكم اقروا الكتاب وبلاش تتفرجوا صورة الغلاف... وسلام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133924/http://www.20at.com/article2.php?sid=28"
