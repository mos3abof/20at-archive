[[comments]]
order = 0
subject = "الي شريف الدواخلي"
author = "احذر يا شريف هذا المقال فية سم قاتل اهرب بحياتك وانجو من السم الزعاف"
posted = "2007-01-31"
text = "ارجوك لا تعلق هنا حتي لا يسري السم القاتل في دمك فتتاثر افكارك وترتعش يداك ولا تستطيع ان تتحفنا بعملك الصحفي البارع الذي لا يدانيك فية احد ولا تغامر بكتابة نقد عن المقال فكما نعرف جميعا ان لا احد في مصر بل في العالم اجمع يدانيك البراعة الصحفية والاسلوب المبتكر والافكار الخلاقة فنحن لا نريد ان نفتقد قدوتنا الصحفية البارعة<br />ارجوك لا تعلق ."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123453/http://masr.20at.com:80/article.php?sid=1526"

