[[comments]]
order = 5
subject = "لو مفيهاش رزالة"
author = "مصرية"
posted = "2007-02-15"
text = "هى شكلها قصة حلوة بس للاسف انا معارفهاش اصلن يمكن دة جهل منى ودة اكيد جهل منى اصلى الواحد مهتم بالمناهج الدراسية بس ان شاء الله هحاول اقرها وتبقوا تدعولى علشان السنة الجاية واللى بعدها ثانوية عامة.وربنا معاكى يا دعاء ومتخافيش انا هبقى اكتبلك الاهداء ليكى ولكل اللى هنا فى جريدتى ان شاء الله بس استنى شوية عليا بالضبط بعد 12 او 13 سنة ان شاء الله هتلاقى اهداء ليكى فى الجريدة اللى انا نوية اعملها ان شاء الله"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123453/http://masr.20at.com:80/article.php?sid=1526"
