text = "أنا سعيد جدا بموضوعك ده يادعاء..فقد أظهرت قدرة على التحليل الانطباعي (ولا أقول النقد) بشكل شديد السلاسة ..<br />الموضوع ممتع فعلا ..ولكن تنقصه بعض النقاط المهمة يعرفها كل من يكتب نقدا لنص سردي حديث..(هابقى أقولهالك وجها لوجه)..موفقة ياأستاذة.."
