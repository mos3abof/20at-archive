subject = "رواية رائعة"
author = "الرواية دي جميلة قوي انا قريتها مرتين ورا بعض من كثر ما هي حلوة وبهاء طاهر ابدع فيها جدا بالرغم من اني كنت فاكره ان نقطة النور هي اجمل ما كتب لكن واحة الغروب قلبت كل الموازين"
posted = "2007-02-01"
text = "شكرا للكاتبة على سردها الجميل"
archived = "2007-02-19"
