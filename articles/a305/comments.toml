[[comments]]
order = 1
subject = "رنين الحب"
text = "ممكن يا استاذ احمد يكون هو ده راىء الفانانين ورسامين الكاريكاتير بس نسيت تقول لنا وجه نظرك عشان الموضوع يكمل لانه كده مش موضوع كده يبقى نكته وعلى العموم انا مش رسامه بس اقدر اعبر عن راىء بالكتابه وهو ان التمثال ده منظر بس كل حكومه تقدر تسيطر او بالفعل مسيطره على شعبها وخاصه امريكا.<br />وكلنا عارفين كده او بعضنا .<br />رنين الحب"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616121837/http://www.20at.com:80/article.php?sid=305"

