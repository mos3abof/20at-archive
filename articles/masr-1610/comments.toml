subject = "تسقيفه تسقيفه يللا"
author = "نيفين نيفى نوفا"
posted = "2007-02-19"
text = "تسقيفه للى يفرحنا و ادعولو ان شا الله يعيش<br />الف مبرووووووووووووووووووووك للاهلى<br />و دا المتوقع طبعاو فعلا يا رب يخلى اللى يفرحنا او حتى يخلينا نبتسم ف الايام الغريبه اللى احنا عايشينها دى<br />تانى مبروك يا اهلى"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222080145/http://masr.20at.com:80/article.php?sid=1610"

