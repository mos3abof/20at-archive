posted = "2007-02-19"
text = "ألف بركه لولاد بهيه<br />ويا رب أشوفهم شاطرين ومتفوقين في الكيميا<br />والفيزيا<br />والرياضيات<br />زي ما هم شاطرين في الألعاب وما بيفوتوش حصه<br />ألف ألف بركه لمصر والأهلي<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
