[[comments]]
order = 4
subject = "عنوان الفرحة"
author = "فارس_fr"
posted = "2007-02-19"
text = "الف مليون مبروك للنادى الاهلى لنادئ الانجازا ت , على تحقيقه لبطولة جديدة تضاف الى سجله المشرف الحافل بالانجازات .<br />ابن بهية :<br />لنقل ان هناك 50مليون مصري بيشجعوا الاهلى , كفاية علينا ان كل شئ فى البلد محبط وكئيب ولا يوحى باى سعادة , خللى ال50مليون دول يباتوا ليله فرحانين بجد حتى اللى ملهمش فى الكورة بيفرحوا لفرح اخوانهم وحبايبهم ,, الاهلى اصبح مصدر الفرحة لكتير من الناس خليهم يفرحوا ,, وكل راجل لم يفرح فى ليلتها يفرح اهل بيته وتبات اسر مصرية مبسوطة وبعدين انت فاهمنى بقي والعيال تكتر وخللى مبارك يتفلق من كثر السكان ويخليهم شماعته دايما للهروب من اى مسؤلية \" شوفت بقي الاهلى عمل فيناايه !!! ههههههههههه \"<br />خللى الناس تفرح يابن بهية ."
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222080145/http://masr.20at.com:80/article.php?sid=1610"

[[comments]]
order = 5
subject = "تمام يا فارس"
author = "نيفين نيفى نوفا"
posted = "2007-02-21"
text = "عندك حق يا فارس<br />فعلا يا جماعه<br />ايه بيفرح ف البلد دلوقتى الا الاهلى و انتصاراته المتتاليه<br />ربنا بستر من نق الاخوه الزملكاويه<br />و بالحق يا فاس انال كنت رديت عليك تانى ف موضوع جمال و بلطجيه المنوفيهاذا<br />كنت لم تلتفت للموضوع"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222080145/http://masr.20at.com:80/article.php?sid=1610"
