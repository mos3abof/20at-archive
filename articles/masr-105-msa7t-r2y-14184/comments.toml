posted = "2009-11-28"
text = "يا أحلى إسم فى الوجود يا مصر … يا إسم مكتوب له الخلود يا مصر<br />نعيش لمـصـــر و نموت لمـــصــر … مــصــر مـصـــر تحيا مـــصـــــر<br />أعد ذكر مصر إن قلبي مولع بمصر ..<br />ومن لي أن تري مقلتي مصر<br />رويدك إن حدثتني عن ربوعها<br />فتطويل أخبار الهوي لذَّة أخري"
