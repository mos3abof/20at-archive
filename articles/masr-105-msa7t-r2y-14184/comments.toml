subject = ""
author = "الى جزائري"
posted = "2009-12-03"
text = "يا اخ جزائري عندنا في مصر مثل بيقول<br />اللي بيته من زجاج ما يحدفش الناس بالطوب<br />انت فاكر عباس مدني زعيم الاخوان عندكم لما دخل الانتخابات واكتسح في عهد الشاذلي بن جديد من حوالي 18 سنه<br />وفاكر لما استقال الشاذلي بن جديد<br />ايه اللي حصل في الجزائر<br />فاكر ولا نسيت فاكر المجازر والمدابح فاكر الجزائريين لما كانوا بيدبحوا بعض كالخرفان<br />اما عن الدعاره في الجزائر فانت اعلم بها مني<br />روح يا ابني شوف الخيبه اللي عندكم في الجزائر<br />ما لكش دعوه بمصر<br />اللي بيحصل في مصر بيحصل في كل الدول العربية<br />كل الدول العربية اسوأ من بعض<br />ما لكش دعوه بمصر روح شوف الفساد اللي في الجزائر"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

[[comments]]
