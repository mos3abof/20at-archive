posted = "2009-11-30"
text = "مش عارف انهي التعبير الادق كلاب الثورة ولا ثورة الكلاب بقيادة من<br />جمال عبد الناصرهو أكبر مجرم في تاريخ العرب الحديث.<br />هذا الطاغية هو أكبر مصيبة حدثت للمسلمين و العرب<br />أذل مصر و أهدر ثرواتها و مكّن للأعداء .<br />رفع من شأن﻿ الراقصات و الساقطات و أذلّ العلماء و نخب الفكر.<br />تسبب في أكبر الهزائم في تاريخنا<br />إلى مزبلة التاريخ"
