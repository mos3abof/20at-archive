author = "ام الدعارة"
posted = "2009-12-02"
text = "فى الجزائر دعارة وفى بيروت دعارة<br />وفى مصر ايضا دعارة وعلى المستوى التقيل وتجارة بالبشر وبيع بنات ونسوان لاثرياء العرب وعندنا مراكز للبيع فى العياط والحوامدية وامبابة<br />ثم لا تنسى ان عندك شارع الهرم بشهرتة العربية فى الوساخة والمسخرة وشقق المهندسين المفروشة انت عارف العرب بيعملوا فيها<br />انت عارف ان الدعارة فى فنادق دبى بتجيب نسوان من اين<br />بلاش تحدفوا الناس بالطوب وانتم اصلا تعبان يا قلبى<br />انت رحت شرم الشيخ وشفت الشراميط هناك<br />اصبح هناك مراكز صحيح غير مرخصة زى الجزائر ولكنها شغالة فل الفل<br />الصراحة راحة وانت يا حبيبى ما بتعرفشى<br />الصراحة راحة وانت يا حبيبى ما بتقدرش"
