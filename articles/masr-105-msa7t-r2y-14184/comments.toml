[[comments]]
order = 37
subject = ""
author = "يا عباس"
posted = "2009-12-04"
text = "المصريون ما انطردوش يا عباس دول الناس اللي علمهم المصريون وكبروهم دخلوا منافسين معاهم في سوق العمل<br />لكن في الاصل المصري هو الاصل المصري هو الدكتور وهو المدرس وهو القاضي وهو المهندس وهو السياسي وهو الفنان وايضا هو العامل الذي بنا في كل الدول العربية من المغرب الى سلطنة عمان<br />وبعدين يا عباس انا كنت بكلم واحد جزائري انت بتدخل على الخط ليه سيبني مع الجزائري علشان خاطر اعلمه انهم شعب همج وكل العالم شاهد على ذلك والدليل مكتب مصر للطيران اللي كسروه"
