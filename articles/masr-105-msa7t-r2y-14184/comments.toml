author = "ممتاز البغل"
posted = "2009-12-03"
text = "حتى البلاهة وصلت ان عشرات الاف خرجت لتشجيع الفريق باعلام مصرية صناعة الصين<br />تخيلوا يا شباب مصر الناهض ان الاعلام وعلم الدولة صناعة صينية والوانة ملخبطة ومن غير النسر ( يبقى حلال حرقة )<br />هل عجز دكان خياطة عن عمل علم مصرى<br />او حتى ستات البيوت يقعدوا على ماكينة الخياطة وتفصل لابنها علم مصرى يطلع يشجع بة فى الشارع<br />مصر بتتقدم بنا<br />اذا كان العلم رمز الدولة بنستوردة من الصين والكمامة من الصين<br />يبقى احنا فى البلد دى بنعمل اية<br />عاملين زى الديك بياكل ويني______"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

[[comments]]
order = 33
subject = ""
author = "جزائري"
posted = "2009-12-03"
text = "اشكر صاحب المقال. ولاكن بالنسبة لنا نقول لكم كشف امركم ومسحناكم من قاهئمة الاخوة والاشقاء نهائيا وللابد.فزنا عليكم في الكرة والدبلوماسية والاعلام .<br />لمادا يوجد عندكم زواج المسيار والعرفي والدعارة الرسمية والغير رسمية وحتي انه هناك من افتي عندكم بجواز ان يرضع الموضف من زميلته في العمل وكيف انكم قدمتم في حرب الخليج 5000[ *** ] للعلوج الامريكان +مادا عن اقتصادكم الدي يعمل لصالح اسيادكم واخوانكم الصهاينة مادا عن اتفاقية الكويز واسعار تصديركم للغاز وللبترول لهم +كيف خنتم الفلسطينين وبعتم قضيتهم بالدولار …"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

[[comments]]
order = 34
subject = ""
author = "احمد محسن"
posted = "2009-12-03"
text = "السلام عليكم ورحمة الله وبركاتة<br />كلاااااااام راااااااائع<br />ما حدث في السودان والجزائر احزننا كثيييييييرا نحن المصريين<br />وان دل فيدل لى قلة متعصبة كارهه لمصر بل للاسلام<br />ولكن لا نستطكيع ان نحكم ع جل الشعب الجزائري بهذا<br />وانا مع انسحاب مصر من اتحاد شمال افريقيا لكرة القدم<br />بل انا مع انسحاب كلا البلديين من كورة القدم تمام<br />تلك اللعبة الحقييييييييييي يرة التي اودت بنا الى طريق مسدود<br />ولكني لست متفق كعك في كلامك عن نصر الله<br />فهو مسلم بلا شك<br />ولكننا كلنا متفقون انه يعمل لمصلح ايران والشيعه وليس لمصلحه احد<br />ولما لا وما يحدث في ايران من ايزاءات لاخواننا السنيين العن مما يحدث في غيرها<br />وطبعا انا متفق معااااااك في عدم شن الحرب على العراق ضد الكويت<br />واتمنى ان نتحد كي نصبح قوة واحده في مواجهة العالم الخارجي<br />ولو اي حد عنده تعليق على هذا الكلام يا ريت يراسلني لاني لست متابع لهذا الموضوع جيدا<br />م / احمد محسن<br />ahmedmohsen@liv e.com"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

[[comments]]
