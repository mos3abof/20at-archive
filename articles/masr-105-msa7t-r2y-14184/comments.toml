subject = ""
author = "المعلقة السابقة"
posted = "2009-12-02"
text = "ادي يا ستي الجزائر بتاعتك<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــ<br />ثمانية آلاف بيت دعارة في العاصمة الجزائرية لوحدها<br />أثارت الدعوة التي تناقلتها وسائل الإعلام الجزائرية والعربية ونسبتها إلى المحامية فاطمة الزهراء بن براهم بشأن تشجيع فتح بيوت الدعارة لمواجهة ظاهرة اختطاف واغتصاب الأطفال في الجزائر، أثارت ردود فعل واسعة. مُستنكرةً ما أسمتها دعوة المحامية الجزائرية إلى ممارسة الرذيلة علنا. والمحامية (بن براهم) التي لها باع طويل في معالجة مختلف القضايا الاجتماعية قالت: إن تصريحاتها أُسيء فهمها مؤكدة أنها دعت السلطات إلى مراقبة وتقنين بيوت الدعارة السرية المنتشرة عبر ربوع الجزائر حيث تستغل المافيات حاجة العائلات إلى المال فتلجأ إلى إكراه بناتها على البغاء مقابل أثمان بخسة وفي ظروف أقل ما يمكن وصفها بأنها لا ترقى إلى معاملة الحيوانات."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

