text = "تعلن شركة الالمنيوم عن وظائف لجميع التخصصات وعنوانها كالتالى —————- وتليفون كذا —————<br />وعندما يصل الشاب الى هناك يطلبون منة السيرة الذاتية وتعبئة استمارة تباع ب 15 جنية<br />فاذا قدم 100 الف شاب واشتروا الاستمارة ب 15 جنية تقدر تحسب العائد اد اية<br />كلة نصب فى نصب<br />والحكومة بتشتى فى شرم الشيخ وبيصلوا العيد فى ملهى ليلى او نادى قمار هناك<br />والشعب ملهى فى مباراة الجزائر وشتيمة الجزائر<br />وكل عام وانتم بخير"
