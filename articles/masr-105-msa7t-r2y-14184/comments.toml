text = "شوفوا الزاي زكي عبد الفتاح مدرب الحراس الامريكان ( ماما امريكا) بيأخذ بعقلنا حلاوة .لما فازت علينا امريكا في مباريات ما بين القارات كان فرحا جدا و مبسوط اوي ونسى بلده الاصلي .و النهار ده عايز يثأر لنا من الجزاير . القرعة بتفخر بظفاير خالتها يا راجل سوق عجلك بعيد و دهية تأخذك انت و الي عزمك في برمجه . و تيحيا مصر…"
