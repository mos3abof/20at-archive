[[comments]]
order = 44
subject = ""
author = "المصرى ب 3 الاف جني"
posted = "2009-12-05"
text = "المصرى الحكومة صرفت تعويض لقتلى حادث القطار فى العياط المصرى ب 3 الاف جنية<br />يعنى دية المصرى 3 الاف جنية مع ان سعر الجاموسة فى السوق ب 13 الف جنية يعنى دية المصرى مش محصلة تمن حمار<br />كلام رخم وبايخ ولكن اليس تلك الحقيقة<br />بينما ملك السعودية صرف دية لكل واحد مات فى سيول وامطار جدة مليون ريال سعودى اى مليون ونصف مليون جنية مصرى<br />ولحسن الحظ مات فى السيول فى جدة 5 مصريين وكل مصرى فيهم اخد تعويض مليون ونصف جنية<br />مش قلنا المصرى حقير فى بلدة ومالوش سعر<br />يبقى برة مصر هيحترموكم على اية<br />على حكومتكم الزبالة<br />ثم كرامة اية اصلا اللى بتتكلموا عليها<br />خدوا كرامتكم فى بلدكم الاول"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

[[comments]]
order = 45
subject = ""
author = "الى المعلق السابق"
posted = "2009-12-05"
text = "يا حبيبى مفيش احد بيقول اشقاء غيركم<br />كل الدول العربية ما بتتكلمش عن موضوع الاشقاء الا انتم المصريين وبتتمسحوا فى العروبة وبتاكلوا من وراها عيش وبتشحتوا من وراء الحكاية دى - عايز تاخد حقك وعامل نفسك واد عنتيل روح خد حقك واللى يضربك قلم اضربة اربعة - هذا اذا كان فيك نفس او ريحة العافية"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

[[comments]]
order = 46
subject = ""
author = "HLine"
posted = "2009-12-05"
text = "زي كل مره نتضرب و نتبهدل و نقوم اي موضوع كام يوم و بعد كده نهدي الموضوع.<br />و لو هنرجع نقول اخوه عرب هما مش مقدرين الاخوه دي اما ضيعوا عين الدكتور المصري في 89 و دلوقتي بيجروا ورانا بالسكاكين و دم المصريين يروح في سبيل الاخوه و الشعارات الفارغه دي يبقي احنا مش عايزين الاخوه دي<br />العين بالعين و السن بالسن و البادي اظلم<br />و هسال كاتب المقال سؤال واحد<br />لو اخوك او ابوك او اي حد يقربلك حصلوا حاجه كان هيبقي رأييك كده برده .<br />حسبي الله و نعم الوكيل في كل اللي يسكت علي نقطة دم مصري راحت كان كل همه انه يشجع بلدنا"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

