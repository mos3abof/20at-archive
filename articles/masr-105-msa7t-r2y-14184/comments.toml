posted = "2009-12-05"
text = "لاا اقول كلكم منافقون لان هنا يوجد مصريون محترمين معززين قبلتم و رضيتم على حكامكم ان يرسلو بنساءكم الى مارنس لى يتسلو بهم 8000 دار دعارة ان وجدت لا استبعد ان امك او ختك اشتغلتا فيهم هدا من ميزاتكم"
