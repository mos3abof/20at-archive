text = "السرقة في الجزائر واللي بيته من زجاج ما يحدف الناس بالطوب<br />http://forums.moheet.com/showthread.php?t=141685<br />يا اخ جزائري في نشرة الاخبار لما رأيت مكتب مصر للطيران في الجزائر محطم والجزائريين امثالك بيسرقوا محتوياته حزنت ان فيه شعب متخلف بهذه الصورة لانه ما ذنب شركة الطيران في مباراة كرة قدم"
