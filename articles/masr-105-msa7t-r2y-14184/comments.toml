text = "و الله لم أكن﻿ للأصدق الخبر لولا أنني رأيته ! لماذا لم يتقدم أحد أعضاء مجلس الشعب بطلب إحاطة حول هذه الفضيحة ؟ هذا هو العار …العار لهولاء و لنا جميعا…إذا لايحق لنا الحديث عن حقوقنا المهدرة في دول الخليج أو غيرها<br />فين نواب المعارضة<br />فين نواب الاخوان<br />ايه اللي حصل<br />ولا هما مش فاضيين بيستعدوا لانتخابات 2010"
