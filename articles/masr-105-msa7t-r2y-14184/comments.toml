posted = "2009-12-02"
text = "الوزرا بيبوسو لانهم مش مصدقين انهم بقوا وزرا<br />فلازم يبوسوا الايد التي انعمت عليهم وجابتهم من اوطا البيئات في مصر ورفعوهم وخلوهم وزرا<br />اللي يبوس الادين ادام الكاميرا يا ترى بيعمل ايه بعيد عن الكاميرا<br />وخلينا احنا قاعدين كده مستنيين صخرة الدويقه التانية لما تنزل على دماغنا ان شاء الله"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

