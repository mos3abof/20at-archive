author = "مفيش وزراء"
posted = "2009-12-02"
text = "انت بتصدق ان عندنا فى مصر وزراء لهم كلمة وبيتحكموا فى وزارتهم<br />الواضح من موضوع بوس الايدى ان<br />السيد رئيس الدولة هو حسنى مبارك اطال اللة فى عمرة<br />وان السيدة سوزان ثابت هى رئيسة الوزراء امد اللة وبارك فى عمرها<br />وان السيد علاء مبارك هو رئيس مجموعة الوزرات الاقتصادية بتاع الفلوس<br />وان السيد جمال مبارك هو رئيس الوزرات بتاع الحكم المحلى والداخلى<br />وان القرارات تتخذ على مائدة الفطار بما فيها نتائج مباريات كرة القدم<br />يبقى الوزراء الهيكلى يبوس الايدى ويبوس الجزمة ويبوس الواو صح علشان يظل قاعد على الكرسى اهو يهبش حتة ارض فى الصحراء او فيلا فى الساحل الشمالى او توكيل شركة او فندق عائم او قرية سياحية<br />وابقى سلم لى على المحروسة بتاع البوس والمص"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

