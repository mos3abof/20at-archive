[[comments]]
order = 42
subject = ""
author = "لا علاء ولا فريال"
posted = "2009-12-05"
text = "احنا مش عايزين ناس مكروهة احنا عايزين ناس من ولاد البلد<br />واحد متربى فى الشارع المصرى وعارف يعنى اية طابور الخبز واحد يحكم 4 سنين بس ويمشى وييجى غيرة<br />عايزين قضاء منفصل عادل وسريع مش بياخد عشر سنين لما يحكم فى قضية<br />عايزين وظايف لعيالنا واذا فشل القطاع الخاص فى توفيرها يبقى الدولة تبنى مصانع<br />عايزين واحد مصرى مننا احنا<br />مصرى نضيف مش جبلة ساقعة قاعدة على كرسى لا بيهش ولا بينش<br />عايزين واحد زى مهاتير محمد<br />يصحى الصبح يقول احنا بنينا كم مصنع وكم سفينة تحمل انتاجنا الى الخارج للتصدير<br />قرفنا من الجبلة والتناحة ومشاريع المجارى والكبارى<br />قرفنا مجارى<br />وافتتاح مشاريع مجارى<br />ريحتكم بقت قرف"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

