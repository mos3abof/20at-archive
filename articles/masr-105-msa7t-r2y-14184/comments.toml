text = "المفروض مصر هي اللي كسبانه الجزائر وتصعد الى كاس العالم<br />لان الهدف في مرمى الخصم بهدفين<br />وحيث ان نتيجة مباراة مصر في الجزائر كانت النتيجة 3/1 والهدف في مرمى الخصم بهدفين يبقى النتيجة 3/2<br />وفي مصر كانت النتيجة 2/صفر لصالح مصر يبقىالنتيجة 4/3 لصالح مصر يا حمار<br />معرفش ايه اللي غير القانون"
