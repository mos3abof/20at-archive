author = "صلاح بدر"
posted = "2009-12-03"
text = "الأخت الفاضلة شيرين، اللهم اكفني شر أصدقائي أما أعدائي فأنا كفيل بهم<br />لما تيجي الضربة من الأخ لأخوه بتوجع اكتر من العدو وبتجرح والدم بيكون مألم أما العدو فبيننا وبينهم سجال يعني حروب رايحة جاية وكل الدول العربية بلا استثناء تعلم مدي كراهية الشعب المصري بحكماه مدى الكراهية لاسرائيل فأرجو أن لا تطلبي من الشعب أن ينسي ماحدث ويتغاضي عن مافعله المفروض الآخوة للأسف نريد الحق والاعتذار مما بدر من هذه الدولة"
