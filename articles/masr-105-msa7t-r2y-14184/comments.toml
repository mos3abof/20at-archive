text = "انت شعب همك والدليل على ذلك مكتب مصر للطيران في العاصمة الجزائرية اللي اتكسر واتسرق<br />والى المصري لازم تعرف ان الدكتور المصري والمدرس المصري والقاضي المصري هما اللي عمروا الجزائر وكل الدول العربية قبل ما يكبروا ويعرفوا يكسروا مكاتب شركات الطيران"
