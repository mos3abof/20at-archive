capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

[[comments]]
order = 38
subject = ""
author = "عباس"
posted = "2009-12-04"
text = "هاها هاها<br />المدرس المصرى والدكتور المصرى والمهندس المصرى لما راحوا الدول العربية بعد بوس الايادى طبعا علموهم النفاق وازاى تطاطى وعلموهم الكذب والخنوع وتحب اضرب لك امثلة ماشى<br />وطبعا طردوهم وجابوا فلسطينيين وسوريين وجابوا باكستانيين وهنود<br />قبل الكلام العنترى بتاع الجهلة يروح اى واحد يدخل اى مستشفى فى ابو ظبى والا دبى والا قطر والا الكويت والا الجزاير او ليبيا هيلاقى الغالبية العظمى من الطاقم الطبى هنود وباكستانيون وفلبينيون وقلة نادرة لا تتعدى اصابع اليد الواحدة من المصريين بتتعلم منهم<br />اما المدارس يا روح خالتك فالمدرس الفلسطينى والسورى وبتوع غزة فى كل المدارس<br />مصر اية اللى بتتكلم عنها<br />انت عارف كلمة مصرى فى الخليج معناها اية<br />اسال واحد معرفة او صاحبك هناك<br />كلمة مصرى ومتزعلش لان دى حقيقة مرة اسم الحمار هناك<br />الحمار هناك اسمة مصرى<br />سلام يا منفوخين هواء"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105171527/http://20at.com/20at/religious/14184-2009-11-27-18-08-46.html"

