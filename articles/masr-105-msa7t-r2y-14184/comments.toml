text = "اعلان هام ملصوق على الجدران في شوارع القاهرة<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />اعلان هام للشباب الطموح<br />فرصة للتعيين فورا<br />0101015120<br />تعلن مؤسسة الاهرام بالتعاون مع مؤسسة الرحاب<br />عن فتح باب التعيين لحد من البطالة وتوفير فرص عمل للشباب<br />0117727551<br />لجميع المؤهلات والطلبة بدخل يتراوح من 1000 الى 1500 جنيه مع توفير اقامة مجانية ممتازة للمغتربين<br />0126040824<br />نؤهلك في يومين ولا يشترط الخبره والعمل معنا يغنيك عن السفر للخارج ويحقق لك احلامك في فترة قصيرة جدا<br />وتفائلوا بالخير تجدوه<br />35733360 و37826297<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــ<br />طبعا من اول وهله المقصود ان الشباب يتصل بالارقام دي علشان خاطر سرقة الرصيد<br />ـــــــــــــــ ـــــــــــــت<br />والحكومة نايمه على نفسها وسايبه لصوص رصيد التليفونات يضحكوا على الشباب<br />ولا حول ولا قوة الا بالله"
