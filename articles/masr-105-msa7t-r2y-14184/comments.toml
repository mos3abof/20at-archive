subject = ""
author = "لماذا يكرهنا العرب"
posted = "2009-11-27"
text = "سؤال لاى مصرى بعيد عن الانفعال والعقلانية -<br />لماذا يكرهنا العرب كل العرب ويحتقروننا احيانا ؟<br />بل اننى ركبت سيارة تاكسى فى دبى وكان سائق السيارة باكستانى فكال السباب عندما عرف اننى مصرى لرئيس مصر واتهمة بابشع الاتهامات<br />الموضوع مش موضوع كرة او مباراة او جزائر<br />الموضوع موضوع سياسة دولة<br />دولة يعتقد العرب جميعا ورجل الشارع فى اى دولة اسلامية ان النظام المصرى وليس الشعب المصرى هو اكبر حليف لاسرائيل فى المنطقة وعميل لامريكا من الطراز الاول<br />بل ان سودانيا قال لى بصراحة ان مبارك يقبض من امريكا ويقبض من دول الخليج<br />الاتجاة السياسى المعادى لايران وحزب اللة والمقاومة العربية عموما<br />مشاركة مصر اسرائيل فى حصار غزة وتجويع غزة التضييق على الناس هناك ومنع قوافل الاغاثة من الدخول<br />هل تنسون ان مصر منعت قافلة اغاثة قادمة من الجزائر الى غزة قبل ذلك<br />حينما يرون جائعا فى غزة او جريح يتهمون مبارك ولا يتهمون اسرائيل<br />اخبار الاعتقال والقبض شبة اليومى التى تكتب على شريط الاخبار فى جميع التليفزيونات ضد الاخوان المسلمين بدون اى سبب الا مناصرتهم لقطاع غزة<br />قناعتهم اننا حلفاء اسرائيل<br />تلك هى المشكلة"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201063404/http://www.20at.com:80/masr/105-msa7t-r2y/14184-2009-11-27-18-08-46.html"

