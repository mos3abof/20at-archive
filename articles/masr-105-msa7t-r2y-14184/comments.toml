capture_url = "https://web.archive.org/web/20091201063404/http://www.20at.com:80/masr/105-msa7t-r2y/14184-2009-11-27-18-08-46.html"

[[comments]]
order = 8
subject = ""
author = "فى المحكمة - البؤس"
posted = "2009-11-28"
text = "مات الوالد رحمة اللة فقلت اعمل اعلام شرعى لتوزيع الميراث على الاخوة والاخوات<br />استخرجت شهادة وفاة من السجل المدنى<br />ورحت المحكمة - زمان كان اسمها المحكمة الشرعية - دلوقتى محكمة الاسرة<br />دفعت الرسوم وملئت اوراق وقدمتها وحددوا موعد الجلسة وطلبوا منى ان احضر اتنين شهود معى يشهدوا ان الوالد مات وان الورثة فلان وفلان وفلان<br />ذهبت يوم الجلسة وقفت امام القاعة الصغيرة فى الصالة كان ترتيبى رقم 40 فى الدخول وعدد القضايا التى ستنظر 85 قضية يعنى موجود فى الصالة 85 نفر وكل نفر معاة 2 شهود - وكاننا فى زحام يوم الحشر ولا يوجد كرسى واحد نجلس علية وبياع الشاى والمحامين وسوق فوضى<br />تخيلت اننا فى زمن المماليك - وصل القاضى الساعة العاشرة صباحا رغم حضورنا من الساعة 8 صباحا<br />كانوا غرفتين وعدد اتنين قاضى لينظروا 85 قضية<br />كل قضية تستغرق دقيقتين واقلب<br />خرجت وانا مريض ومكسح من الوقفة والزحام والصراخ والوقفة<br />وذهبت لاستلام الحكم<br />مسخرة<br />جابوا لى دفتر الاجندة لانقل الحكم بخط يدى فى استمارة ثم يراجعوها وتختم<br />مبنى المحكمة 5 طوابق ليس فية كمبيوتر واحد<br />محاكم المماليك<br />مصر هى امى<br />احة<br />احة<br />احة<br />احة"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201063404/http://www.20at.com:80/masr/105-msa7t-r2y/14184-2009-11-27-18-08-46.html"

[[comments]]
order = 9
subject = ""
author = "ابومحسن غربة 28 سنه"
posted = "2009-11-28"
text = "مصر هي أمي ..<br />مصر هي أمي .. نيلها هو دمي<br />شمسها ف سماري .. شكلها ف ملامحي<br />و إن كان لوني قمحي .. ده من فضل مصر<br />ما تلاقيش مثالها .. ست كل عصر<br />عشة جنب نيلها .. تسوى ألف قصر<br />ولا وردة بلدي .. فيها عطر مصر<br />ولا سحر مصر .. ولا جو مصر<br />ولا .. ولا .. ولا<br />ده شئ ملهش حصر<br />.. روحوا زوروا مصر<br />و إنتوا تعذروني .. لما أقول يا مصر<br />مصر .. مصر .. مصر<br />فاتك نص عمرك ياللي ما شفت مصر<br />ده التاريخ ف مصر .. و الهرم ف مصر .. و الكرم ف مصر<br />و الحلوين ف مصر .. و الجدعان ف مصر<br />ادوني عصاية .. أرقص رقص مصر<br />.. روحوا زوروا مصر<br />و انتوا تعذروني .. لما أقول يا مصر"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201063404/http://www.20at.com:80/masr/105-msa7t-r2y/14184-2009-11-27-18-08-46.html"

