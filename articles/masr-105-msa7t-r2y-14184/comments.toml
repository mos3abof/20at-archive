posted = "2009-11-28"
text = "كل دولة عربية بتغنى على ليلاها<br />دبى مطحونة فى 80 مليار دوولار اللى راحوا<br />والسعودية دخلت دوامة حرب العصابات مع الحوثيون والشيعة واحتمال تنتقل الى نجد والمنطقة الشرقية وبتطلب مساعدات من باكستان وقطر والبحرين<br />واليمن بسبب التوريث بيتفكك الى خمس قطع اهم قطعة فيهم السعودية هتاكلها<br />والسودان بيتفكك الى ولايات<br />وكلة مش فاضى للتانى<br />والجزائر اخبرت عمرو موسى انها غير معنية بالازمة مع مصر او داخل مصر وانة لا حاجة الى وساطة<br />ومصر عمالة تذمر وتطبل على ماتش الكوورة<br />وسلام مربع"
