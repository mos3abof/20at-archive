posted = "2009-12-06"
text = "تفرجت دى الوقت على ابراهيم حجازي في نيل سبةر هو و الممثل كريم عبد العزيز و راح يتباهى بكون كان تابع للقوات الخاصة وبيقول كلام خطير للي واخذ بالو انا المصريين دخلوا 3 مرات لألات دون ان واحد لم يأخذ خبر ( ده بيحلم ولا ايه يا براهيم دي القزاير وخذت عقلك يا راجل و دخلوا كمان للأرد و العراق كأن يستهي بالمخابرات الاردنية و قال كمان ان قادر يدخلوا اي مكان ( يقصد الجزاير عشان ادون علقة في السودان يا راجل بلا تهريج دى الشعب بيجوع و طوابير الخبز ليست لها نهاية ) دحنا مش قادرين لحد دي الوقت نطلع صورة للعالم على الاعتدءات المزعومة في السودان كل عيش يا راجل و كفاية بقاء . و انسى فو الله الجزائر غلبتنا على جميع الاصعدة و مبروك للجزائر .اخوكم مصري شريف…"
