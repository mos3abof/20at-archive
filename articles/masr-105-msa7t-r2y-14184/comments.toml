text = "توفت اليوم فى جنيف ملكة مصر وزوجة الملك فاروق الملكة فريال وهى من مواليد 1938 وستدفن فى القاهرة بعد يومين - رحمها اللة فقد وافق الملك فاروق على التنازل عن الحكم خوفا من اراقة دم اى مصرى ولو كان اصدر اوامرة للحرس الملكى بالمقاومة لسالت الدماء انهارا<br />رحم اللة الاميرة العظيمة<br />وهى كانت من حبايب مصر<br />شوفوا الزبالة التى حكمت مصر بعد كدة اللى اصلها مالطى واللى اصلها يهودى يلعن ابوهم"
