posted = "2009-12-03"
text = "كلام الجزائرى صح<br />كلامك صح يا ابنى<br />شوف انت بتتكلم فى اية وهم بيردوا عليك فى اية<br />انت كلامك صح<br />بدليل تصريح نظيف امس<br />وتصريح سرور<br />وتصريح وزير الثقافة<br />كلهم بيترجوا الجزائر تسامحهم وان مفيش خلاف ودى مجرد مباراة<br />ورحمة خالى حسن انت صح يا جزائرى واحنا شعب ما بيجيش الا بضرب القفا"
