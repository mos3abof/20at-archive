text = "بيقولك حسنى مبارك حط ايدة فى جيبة طلع 5 مليون جنية فراح قال للحرس بتاعة ال5 مليون دول حرام و عايز احللهم راح قالة بس كدة يا ريس احنا نروح للشيخ طنطاوى و هو يحللهملك راح طنطاوى قالة انت تروح عند الكعبة و تلف 3 لفات و هما هتحللة راح لقة عاطف عبيد بيلف راح مبارك بيقول لعاطف انت كام لفة قالة 9 قالة يخربيتك سارق 15 مليون من البلد راح عمنا عاطف قالة يا عم روح شوف جمال ابنك راكب موتوسكل و بقالة 3 ايام بيلف"
