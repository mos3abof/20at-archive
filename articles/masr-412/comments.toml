[[comments]]
order = 38
subject = "فلتسقط الفلكه"
author = "حسانينو الجمال"
posted = "2006-09-02"
text = "فلتسقط الفلكه والرعب فى السكه<br />والخوف من الطارئ حسنيه يامباركه<br />دى بنت شرموطه وعميله لاميركا<br />حكمانا كتمانا رعبانا بالفلكه<br />والكوسه ع الكوسه<br />فى وراكنا مدفوسه<br />ناس بالقروض تخلع<br />وناس هنا فى حوسه<br />وناس تقول كلمه بسببها محبوسه<br />وناس لها واسطه بسببها تتوظف<br />وناس لها بسطه تقعد وتتحنتف<br />وناس وناس وناس<br />حصلت لنا البركه<br />فلتسقط الفلكه واللى يفلكنا<br />وصاحب الفلكه اللى مهشكنا<br />فلتسقط الكوسه وحكمها النازى<br />واللى ورا مباركه لفكرنا غازى<br />فليسقط كل دول<br />العالم السكه<br />فلتسقط الفلكه"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120937/http://masr.20at.com:80/article.php?sid=412&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
