[[comments]]
order = 10
subject = "يه اللى فرعنك يا مبارك؟!"
author = "ابو القاسم"
posted = "2006-05-31"
text = "قال ايه اللى فرعنك يا مبارك قال لقيت كل رجالة البلد مخصيين ومالقيتش ستات فى مصر برضه يلمونى والله لو كان البلد فيها دكره ما كنش حسنى مبارك عال فى الارض ما كنش قلنا يا ايها الملا ما علمت لكم من اله غيرى وهو عارف اننا هانقوله امين ونسجد تحت جزمة سيادته ليه لما قلنا برضه اليس لى ملك مصر وهذه الانهار تجرى من تحتى افلا تبصرون قلناله نبصر ونشوف ونبصم بالعشرين يا الهنا ومولانا وسيدنا الاعظم؟ليه لما اخونا بيتاخدوا من وسطينا ويروحوا لاظوغلى او طره او عاصمة جهنم الحمره (سجن الواحات زى مابيتقال عليه)ليه لما ده بيحصل محدش فينا وقف فى وش كلب امن الدوله ودافع عن اشرف ناس فى مصر وهما بيتسحلوا على عربية امن الدوله وليه مادفعناش عن عرض مصر وهو بيتهتك اكتر من مره وليه وليه زمااااااااااااااااااااان كان فيه واحد بيعرف ربنا اسمه عمر ابن الخطاب كان بيقول ان احسنت فاعينونى وان اسئت فقومونى فطلعله راجل قاله والله لو راينا فيك اعوجاجا لقومناك بالسيف فلما اختفى الراجل ده من وسطينا ركبنا امثال يزيد بن معاويه والحجاج بن يوسف وحسنى مبارك كل دول ركبونا ودلدلوا رجليهم عشان كده لما ييجى حسنى يعين علينا من بعده ابنه(لعنهمالله هم ومن معهم)يبقى ده حقه الطبيعى لانه لقى مصر كلها مخصيه وزى ما كان بيقول واحد من اساتذتى الفضلاء من لم يدفع حسنى مبارك ولو بشق تمره فليس بؤمن abu_alqasem2005@hotmail.com"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

