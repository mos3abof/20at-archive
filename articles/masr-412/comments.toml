author = "مصرية"
posted = "2006-06-03"
text = "الحل الوحيدلك ياجيمى لفض الاشتباك بينك وبين رفض الشعب لك..هو اعلانك ميثاق شرف معه بنوده محدده وواضحه<br />1- التخلى عن الجنسية الأمريكية اليهودية واعلانك الاخلاص التام لجنسية الفقراء المصريين<br />2-التبروء بشكل كامل من كل أفراد عائلتك وخصوصا الوالد الغير محترم من كل الجرائم التى ارتكبوها طوال عهدهم الغابر<br />3-اعادة كل أموال الشعب المسروقةفى الداخل والخارج الى خزانة الدولة الخاوية وتجريد الأخ علاء وأمثاله من كل ممتلكاتهم ومصادرة ثرواتهم التى كونوها من دماء المصريين<br />4-ادانة ومصادرة أموال كل من سرق ونهب المال العام وفضحه بالأسم<br />5-انهاء قانون الطوارىء وتعديل الدستور وفق مطالب الشعب<br />6-الأفراج عن المعتقلين السياسيين..وادانة ومحاكمة كل من قام بتعذيبهم وانتهاك حقوقهم..وعلى رأسهم حبيب العادلى..واغلاق هذا الملف الأسود الى الأبد<br />7-انهاء الفساد والمحسوبيةوتطهير أجهزة الدولة من عملاء والدك (السابق بأعتبار تبرؤك منه)<br />8-حل مجلسى الشعب والشورى والحزب الوطنى..وتطهيرهم من الهتيفة والبصمجيةوالبلطجية والتعهد باقامة انتخابات نزيهه<br />9-وضع استقالتك أمام مجلس الشعب الجديد لقبولها فور اخلالك بأحد هذه الشروط<br />10-اعلاء سيادة القانون والكل أمامه سواء<br />اذا قبلت بهذه الشروط ممكن انتخبك رئيس لمصر..لكن ده معناه انك لازم تسلخ جلدك على يد هندى أحمر ..وللأسف أصحابك الأمريكان خلصوا عليهم..وعندنا مثل مشهور بيقول ( ديل الكلب لا ينعدل )<br />هااااارد لاك يا جيمى ..يعنى برضه مفيش فايده..ولالالالالالالالالالالالالالالالا للقرصان وسلالته وعصابته..ونعم..نعم..نعم..لثورة الجيش والشعب على الظلم والفساد اللهم اجعله يوما قريبا..آآآآآآآآآآآآآآآمين"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 20
subject = "الفصل الأخير من حكم مبارك"
author = "بقلم:عامر عبد المنعم"
posted = "2006-06-03"
text = "تعيش مصر هذه الأيام حالة من المخاض، والكل ينتظر الفجر الجديد، ولحظة الخلاص من حكم مبارك وعائلته، الذي خرب البلاد ونشر فيها الفساد. المصريون ينتظرون قدوم الطوفان ليكنس عصابات النهب وجماعات الخيانة التي باعت الوطن لأعدائه، وفتحت الأبواب أمام كل مفسد ليدمر أرض الكنانة.<br />إن حالة الفوران التي عاشتها مصر في الأسابيع الأخيرة مع الانتفاضة المباركة للقضاة المصريين الشرفاء ما هي إلا بداية الفصل الأخير لإغلاق هذا الملف الذي أخرج مصر من التاريخ والجغرافيا.<br />لم تشهد مصر عبر تاريخها الطويل محنة كما تعيشها الآن. حاكم فاسد لا يريد أن يفر بجلده ويهرب مع أسرته رغم الحرائق المشتعلة في كل الوطن، ويصر علي البقاء علي جماجمنا ودمائنا.<br />لم يشبع من البقاء في السلطة لأكثر من ربع قرن من الزمان، ولازال لديه الأمل في أن يورث مصر لابنه وكأننا عقارا أو أثاثا. هذا الحاكم لا يسمع زفرات المقهورين، ولا يري دخان الغضب، وفقد كل إحساس بحرارة الغليان في الشارع المصري، ويبدو أنه ينتظر مصيره كغيره من الطواغيت الذين ظلوا علي كراسيهم حتي تم خلعهم وتعليقهم علي المشانق.<br />ما يحدث الآن يؤكد أن صفحة مبارك تطوي، وحكمه انتهي. لا يوجد من يدافع عنه إلا قلة آثمة مفضوحة وأبواق مأجورة. كل الشعب المصري تمرد عليه، وخرج من تحت مظلته. وما كانت ثورة القضاة المشرفة إلا فصل الختام في حركة الشعب المصري لإنهاء هذا الحكم الذي فرط في استقلال البلاد، وحول مصر العظيمة إلي ولاية خاضعة للبيت الأبيض.<br />لا يحمي مبارك الآن سوي جيش الأمن المركزي وعصابات البلطجية. هذه القوات لن تصمد كثيرا أمام حركة الشعب المصري المتصاعدة. ستأتي اللحظة التي يترك فيها الجنود أسلحتهم وينضموا للشعب، ويتركوا الطاغية ليسقط وينهار.<br />الفظائع التي ارتكب<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

