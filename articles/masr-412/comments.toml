[[comments]]
order = 6
subject = "احنا ملكيه مش جمهوريه"
author = "الاستاذشيكو"
posted = "2006-05-31"
text = "مش عارف ليه احنا عمالين نقول ان مصر جمهوريه مع ان اللي عنده شويه نظر يلاقي ان الوضع راجع زى زمان ايام الملكيه والعن<br />حسني وفرقته استفادت من تجارب اللي قبلهم 00000<br />هوة مين اللي قام وغير نظام الحكم في مصر ايام الملك !!!؟؟000000 الجيش (ابناء الفقراءوالوطنيون فقط)جمال عبد الناصر ومن علي شاكلته<br />مين اللي حرر مصر من الاستعمار (برضه الفقراء والوطنيون )<br />ودي كانت الغلطه اللي وقع فيها الملك انه سمح لفقراء والوطنيون انهم تدخلوا الجيش المصري هم واللي عندهم استعداد يغيروا في البلد وكانت النتيجه ان مصر تحولت الي نظام ااااااخر غير الملكيه 0<br />حسني مبارك كان ناصح عمل الشعب طبقتين واستيك<br />الطبقه الاولي هي الناس اللي مستفادة من ان الوضع يفضل كده00000 ناس يزدادوا غني وناس يزدادوا فقرا0000 وهمه اللي ليهم الدخول في كل شىء بدون عائق<br />ودول يشملوا كل الللي علي السطح هما اللي يدخلوا شرطه وحربيه وفنيه عسكريه ودفتع جوي والتعيين في الوظائف العليا كله كله<br />هذة الوظائف والمناصب هي الللي ممكن تتحرك عشان تغير وزي ما احنا شايفين لا حياة لمن تنادي واللي منهم يحب يتغير يترمي برة<br />اصبح الفساد عيني عينك وكله لمصلحه النظام والحاكم الي انا اتحدة انه تصحح الاوضاع حتي لو حاول لانه ببساطه فقد القدرة علي الحكم علي هذة الطبقه اللي بقت دوله داخل الدوله<br />اما الطبقه التانيه هي اللي زيي وزي الناس المتبهدله في الدنيا وفي البلد دي<br />كل اللي مش داخل الطبقه الاولي فهو معانا معانا مش بمزاجه ده غصب عنه<br />يا اخوة الاحصائيات اللي بتتعمل بتتكلم عن الفقراء والعشوائيات والناس اللي عايشه فيها كان الخيانه والشلشحه والردح ده خارجه من الناس دول بس مافيش احصائيه تخرج وتقول لينا الاغنياء الرجال بخونوا نسوانهم ازاي وغيرهااااااااااااا<br />اما<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 7
subject = "المتناقض"
author = "محمد أبو حمزة"
posted = "2006-05-31"
text = "الستاذ يوسف هو نوع معروف من الكتاب الذى يقول الكلمة ولا يلقى لها بالا , خاصة فى جانب من ليس لديهم الأدوات الإعلامية لكشفه وامثاله, ومن كتاباته ومنها هذا المقال يتضح أنه ممن يفضلون الهباب على التيار الإسلامي أو الأخوانجية كما يسمونهم معشر المصفقين , وعنوان المقال مأخوذ من المثل الشعبى \"قال ايه اللى رماك ع المر قلت اللى أمر منه\" والأخوان هم فى رأى صاحبنا , هم اللى أمر منه!<br />عذرا سيدى فكل ما تطرحه اليوم من استفسارات ليس لها سند من حق لأن الأخوان أبانوا موقفهم منها ولا لبس فى ذلك وموقفهم هذا يتفق معهم فيه من يختارونهم فى أى انتخابات سواء فى مجلس الشعب أو الغرف التجارية أو النقابات المهنية , وأظنك ستقول لى أنهم ومن يختارهم من المنغلقين وعديمى الفهم وأرد :فما بالك بالمحامين والصحفيين والأطباء والمهندسين وأعضاء هيئة التدريس , موقف التيار الإسلامى تزكيه فى مجال الأبداع كتاب أعلام منهم على المستوى المصرى الكيلانى وباكثير وغيرهم الكثير وأدعوك للبحث عن كتابات آخرين من الإسلاميين , أما عن التناقض الذى أراه فيك أنك مدع لليبرالية وتكيل بمكيالين مثلك مثل أمريكا التى تعلن أنك ضد مواقف إداراتها المتعسفة ,يا أخى انظر لتركيا وبص حواليك وشوف الدنيا فيها ايه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 8
subject = "هذا بخصوص الجيش! للمصرية"
author = "نجم الدين"
posted = "2006-05-31"
text = "إبنتي العزيزة المصرية/<br />الجيش كان ولايزال حياتي، ولكني أشك أنه بقياداته وتركيبته الحالية يمكن أن يلعب أي دور في الصراع، هذة ستة وثلاثين عاما إبنتي العزيزة، فعلوا هم والزمان دورهم بإفراغ الجيش من كل ذي توجه وطني عربي أو إسلامي، والقيادات اليوم تعطى لأهل الولاء لا الكفاءة.<br />وكثيرا ممن يرسلون للبعثات التكميلية من محاسيب النظام وصبيانه، الحمد لله أن الفساد في المؤسسة العسكرية أقل من باقي مؤسسات الدولة، ولكنه بمعيار العسكري فساد كبير.<br />وضعنا عام ثلاثة وسبعين كان أفضل من اليوم بمرات عديدة، وقتها كان تفوق إسرائيل علينا عسكري الطابع، ومن ناحية تكنولوجية محضة، والفارق جيل أو جيلين من التقنيات الحديثة. كان العدو معروفا والأهداف واضحة ومعنا إخوتنا العرب وأيضا السوفيت، فمن معنا اليوم؟<br />الفارق بيننا وبين إسرائيل يزداد سعة كل ساعة، وهو فارق فلكي لصالح إسرائيل، منذ حرب إكتوبر لليوم خاضت إسرائيل عدة حروب إكتسبت فيها خبرات قتالية جديدة، وجربت وطورت أنظمة دفاعية وهجومية نعلم عنها اليسير، وغدت بلاد كالصين والهند وتركيا تتعاقد معها بمليارات الدورات سنويا لتطور لها أنواعا بعينها من الأسلحة. السلاح الذي يعطى لنا من العم سام، نسخ متخلفة منزوعة منها أنظمة التحكم والقيادة الإلكترونية، لأجيال كانت لدى إسرائيل منذ عقد على الأقل.<br />علاقة مبارك بإسرائيل قديمة جدا، وإن صدقت الوثائق التي لدي، كان هو أيضا إحدى مصادر المعلومات الهامة لإسرائيل، وحتى سيده السادات ذكرها صراحة وأكثر من مرة على باب المداعبة\" في إسرائيل بيحبوك يا مبارك!\"، ولعله كان يبلغه رسالة ما.<br />الثابت عندي ومن وثائق عسكرية متنوعة المصادر، أن إسرائيل في حرب رمضان لم تفاجأ لا بالتوقيت ولا أماكن العبور، التي إختلفت عن الخطة المسربة لها بموضع وا<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

