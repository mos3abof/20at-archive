[[comments]]
order = 22
subject = "قيادة واعية؟ مستر شعبولا سير!"
author = "سمسم"
posted = "2006-06-03"
text = "الأخت الطيبة المصرية/<br />الإستاذ عامر عبد المنعم كاتب في جريدة الشعب وده مقال له منقول من واحد من ولاد الحلال، يعني ما أظنش إنه يمكن يقرا تحيتك.<br />لما أشوف رد زي الأخ الأستاذ المتخفي وراء إسم محمد الشرقاوي، يعلى عندي ضغط الدم، حضرته ممكن يتعطف ويقول لنا إيه تعريفه \"لمصر بخير طول ما فيه قياده واعيه وحريصه على سلامة وأمن شعب مصر وفقك الله يا مبارك !\"<br />بغض النظر إنه لايميز الهاء من التاء المربوطة، يمكن يحدد لنا متى تكون القيادة واعية ووطنية؟ ومتى تكون غبية وعميلة؟ علمنا مما علمك الله ياجهبذ يا علامة يابن بجدتها وبيضة البلد!!(من باب السخرية!)<br />الجهل بتاعنا ميقدر يعالجه غير ربنا سبحانه وتعالى، لما احنا يفرحنا قوي إن \"شعبولا\" يطلع لنا بأغنية هابطة زي\" أنا بأكره إسرائيل!\" اللي بيغنيها عطوفة المكوجي السابق في الملاهي الليلية اللي معظم روادها يهود، وهمه كمان اللي يطلبوا منه يغنيها ويرقصوا على أنغامها ويهزم مؤخراتهم ويضحكم على سذاجتنا..خلاص خلوا شعبولا يبقى قائدنا المغوار.<br />الوضع لايحتمل المزاح يامحترم، وأنا شايف إن إحنا مقدمين على أيام نسأل الله إنه يلطف بينا بيها، وأحب أقولكم النهارده حتى لو تمكنا من القضاء على الحلوف وسلالته، يبقى قدمنا لسه طريق طويل عمره سته وثلاثين سنه من النفايات، لازم ننظفه، ولكن ده مش حيرضى حد وراح يحاربونا بشراسة علشان يمنعونا من التنظيف والتطهير!.<br />مفيش أسهل من إني أقول لكم تشجعوا ياإخوان النصر قاب قوسين أو أدنى وأنا قاعد في الزمالك، الحرية والعزة والرفعة لاتعطى ولكن تنتزع عنوة، مستعدين لكل تضحية تقدموا على بركة الله، ستحاربون من الداخل والخارج، وستقتلون وتقتلون ولكن ستنصرون إن علم الله صدقكم."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 23
subject = "الى الأخ سمسم"
author = "مصرية"
posted = "2006-06-03"
text = "الى الأخ سمسم..شكرا على الأيضاح..وأنا دائما أهتم بقراءة تعليقاتك..لأنى أشعر بمدى أخلاصك فى حب مصر..وأنا فى الحقيقة عملت مقاطعة لكل مايمت بالأعلام المصرى بصلة..لأنها أصبحت أبواق دعاية تصيبنى بالغثيان والقرف..تماما كتعليق السيد الشرقاوى وتهليله للطاغية..تشخيص حالته لا تخرج عن ثلاث افتراضات ...أما أنه فقد عقله من العيشه الهباب والضغط والقهر ..واما انه فى غيبوبه ولا يعلم ما يدور حوله...أو أنه من شلة الهتيفة البصمجية البلطجية..الماجورين كأبواق دعاية للنظام الفاسد وفى أى الأحوال هو لا يستحق الأهتمام.. واتا آسفه لأضطرارى قول هذا الكلام لكنك ياشرقاوى حرقت دمى فعلا..أعرف ان الفساد قد طال الكثير من أبناء مصر وأننا نحتاج الى كم كبير من الجهد والوقت لأصلاح أخطبوط الفساد الذى تسللت اذرعه فى كل مكان ..ولكن الوطن يستحق ان نبذل المعجزات من أجله..الخلاص من الطاغية الفاسد ما هى الا الخطوة الأولى لمشوار طوبل كماقلت سيمتد لسنوات ولكنها ستكون خطوة الى الأمام على الطريق الصحيح ..فى تصورى..وأرجو أن يكون سليما أننا نحتاج الى حكم شريف ومخلص..ولكن ذو قبضة قوية وحازمة لأقتلاع كل هذا الفساد..بدءا من وسائل الأعلام المنحلة...الى أخلاقيات الناس فى الشارع المصرى ...استعادة الشخصية المصرية الكريمة المحبة الطيبة المتمسكة بالقيم والتقاليد والأخلاق والدين ..هو ما سيسرع من اصلاح حال الوطن..المهم ان الكل يتفق على الخلاص من الطاغية..وانا أعتقد انه لا أمل فى تحقيق ذلك بدون وقفة كل شرفاء مصر معا جيشا وشعبا..نحتاج لمن ينظم ويحول طاقات الرفض بالكلام ..الى فعل وعمل..الى اين نتجه.؟؟؟.الآلاف والملايين لاشك..يحملون نفس المشاعر ..المظاهرات ايضا لم تعد هى الحل ..لأن الدنيا كلها تعلم تماما..أن هذا الطاغية مرفوض وملفوظ من شع<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 24
subject = "هام للغاية!"
author = "جندي الوطن والواجب"
posted = "2006-06-04"
text = "بسم الله الرحمن الرحيم<br />لمن يهمه الأمر/<br />كلفت بصفة شخصية من سعادة ف.أ.ح. متقاعد نجم الدين أن أرد على بعض الأسئلة ذاث الإختصاص بموقف الجيش في حالة إندلاع ثورة شعبية على نطاق واسع.<br />أولا: يوجد داخل الجيش نوع من التململ والتذمر لما يجري في الشارع المصري، ولكنه لم يصل لدرجة الغليان والإنفجار بعد، وأنا آسف أن أخبركم بذلك.<br />ثانيا: الجيش يمكن أن يقوم بدور مساند في حالة قيام عصيان مدني شامل، ومواجهة بين المدنيين وقوات أمن النظام، يكن فيها نوع من التوازن، الذي يحسمه إنضمام قطاعات من الجيش للشارع. بمعنى إحنا النهارده موقفنا غير سنة إثنين وخمسين، بمعنى إن المبادرة لازم تأتي من قيادات شعبية مدنية، همه اللي ينظموا الإضرابات والعصيان المدني، وأماكن وتوقيت وحجم المواجهة مع النظام. أهم شئ في حال وجود قيادة أو فريق منها مستعد لأداء هذا الواجب، إنه لايترك مكشوف ولوحده في الميدان، لابد من الإلتفاف الشعبي حوله.<br />ثالثا: قوات الأمن المركزي ليست من القوة ولا الكفاءة ولا التسليح بحيث يمكنها من السيطرة على الشارع، وسينفرط عقدها بعد أول ضربة تتلقاها من الجمهور. يعني في حال إشتباك مباشر مع الجمهور يمكن الإلتفاف على بعض التشكيلات وحصرها وعزلها ونزع أسلحتها، ولن تجدوا منهم مقاومة حقيقية.<br />رابعا: النظام يعتمد في حماية الشخصية على فريق حماية أجنبي، لأنه لايثق حتى في القيادات المصرية المواليه له، والتي رباها بمعرفته، ويؤسفني أن أخبركم أن معظمهم (القيادات دي) لايمتون للعسكرية إلا بالزي العسكري والرتبة، لأن كثير منهم أصبحوا رجال أعمال وبتوع إستيراد وتصدير، حتى في أمور تتعلق بمهمات الجيش.<br />الحقيقة لا أعلم مدى سعة إنتشار هذا الموقع وتأثيره في القطاعات والشرائح المدنية، أرجو أن يكون كبيرا.<br />وتقبلوا وافر الإح<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 25
subject = "hgالى جندى الوطن والواجب"
author = "مصرية"
posted = "2006-06-04"
text = "أشكرك على مداومة التواصل من أجل مصر فهذا يجب أن يكون دور كل شرفاء مصر فى كل مكان وليس فقط فى هذا الموقع..وعن مدى انتشار هذا الموقع نستطيع ان نبدأ بدعوة كل من يشارك فيه للعمل على شحذ اكبر عدد من الناس للمشاركة..واسمح لى ان ابدى الرأى فى النقاط الأربع التى قمتم بذكرها..أولا..التذمر والتململ داخل الجيش ليس محبطا على الأطلاق ..بل هو بادرة أمل يجب التمسك بها والعمل على دعمها من الشعب كله وهذا سيحدث تلقائيا<br />ثانيا..فى اعتقادى انه من الأقوى والأنجح أن تكون البادرة الأولى من الجيش ومساندة الشعب له ستكون حتمية وتلقائية ..لأن الجيش يملك القدرة على التنظيم والتخطيط..والتنفيذ بشكل لا يتعرض للفشل.. وهذا ما تفتقر اليه أى تجمعات شعبية<br />ثالثا..قوات الأمن المركزى ستتلاشى أمام قوة الجيش ولن يفكر حتى قادتهم فى الدفاع عن قضية خاسرة..هم فقط يستعرضون عضلاتهم أمام الشعب الأعزل<br />رابعا..فريق الحماية الأجنبى مجموعة من المرتزقة المأجورين..سيفروا كالفئران..ناجين بأنفسهم..للتعاقد فى مكان آخر فهم على يقين تام أن هذا اليوم آت..أماقيادات الجيش التى توالى هذا الخائن..لن تجد لها ولاء داخل صفوف الجيش..لأنهم لاينتمون أساسا له...<br />هذا هو تصورى وأرجوا أن يكون صوابا..ولازلت اناديكم يا أحرار الوطن ..ياجنود مصر أنتم الأمل الوحيدلنا..الوطن قد هان على السفلة اشد الهوان..وما لنا من مخرج سوى انتفاضة قوية منكم ونحن معكم..لالالالالالالالالالالالا للقرصان وسلالته وعصابته..ونعم..نعم..نعم..لثورة الجيش والشعب على الفساد والظلم ..اللهم اجعله يوما قريباآآآآآآآآآآآآآآآآآآآآآآمين"
