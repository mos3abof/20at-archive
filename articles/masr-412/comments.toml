text = "ارجوا من المنظمين لموقع أولاد البلد..تخصيص صفحة..وليكن عنوانها مثلا..*من أجــــــل مصـــــــر *..هذة الصفحة تكون نقطة انطلاق لعمل جدى ..وليس لمجرد ابداء الآراء..ويمكن من خلالها تنظيم حركة شعبية واسعة..تساندوتشارك فى العمل الوطنى من أجل تحرير مصر من الطاغية..انها فكرة خطرت لى الآن وأرجوا من كل الشرفاء المساهمة فى تطويرها وتفعيلها...لتكن هذه الصفحة النواة الأولى لتجميع صفوف الشعب ..والثورة على الطاغية ..<br />ياكل شرفاء مصر من الشعب والجيش ..انقذوا مصر من الفساد والظلم ..<br />آآآآآآه يا وطنى كم هنت ورخصت لدى الأقذار ..لكنك ابدا لم ولن تهن فى عيون الشرفاء...لالالالالالالالالالالالا للقرصان الطاغية وسلالته وعصابته..ونعم..نعم..نعم..لثورة الجيش والشعب ضد الظلم والطغيان..اللهم اجعله يوما قريبا آآآآآآآآآآآآآآآآآمين"
