subject = "المشكله مش فى امريكا"
author = "م فيروز"
posted = "2006-06-27"
text = "المشكله ان الحكومه استطاعت بالفعل اقناع امريكا والكثير من الشعب الصرى وللاسف منهم المثقفين انه لا بديل عنها سوى الاخوان وانه لا بديل ثالث فى حكومه مدنيه حره ومن هنا ياتى الدور الاخطر لمثقفى مصر فى طرح البديل الثالث ولا يهابون من بطش الحكومه ولا فتاوى الاسلام السياسى فالتاريخ سيحاسبهم على الاستسلام فمصر تحتاج الى التضحيه اكثر من ذلك"
