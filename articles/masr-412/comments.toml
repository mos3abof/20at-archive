text = "اشعر بالسعادة والفخر كلما قرأت تعليق مثل تعليقك يا أخ عبد المنعم..انت والأخ نجم الدين.. نريد لاصوات الشرفاء امثالكم ان يملأ الدنيا ..أن يملأ سماء مصر ليطهرها من تلوث الفساد ..أن يملأ العقول ليحميها من التفاهه والتضليل..انكم تقوون الأمل فى انقاذ الوطن..اللهم كثر من أمثالكم ياكل شرفاء مصر...<br />لالالالالالالالالالالالالالا للقرصان وسلالته وعصابته..ونعم..نعم..نعم..لثورة الشعب والجيش على الطاغية والغسادوالظلم ..اللهم عجل بهذا اليوم..آآآآآآآآآآآآآآآآمين"
