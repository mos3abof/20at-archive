[[comments]]
order = 1
subject = "فما هو العمل؟"
author = "قاتل الكلاب"
posted = "2006-05-30"
text = "سادتي الأعزاء/<br />من سنن الله في الكون التداول والتدافع، وليس في القرآن كله ولا السنة المشرفه أثر ولو باهت يستقى منه أن نظام الوراتة في الحكم ملكيا كان أو جمهملكيا مثالا وأنموذجا ينبغي علينا إتباعه، ولو كان في ذلك من خير لنص على الأمر صراحة، كما نص على العدل في الحكم.<br />لاخير في حكم أبناء المنوفية البتة، هؤلاء باعوا الدين والوطن والعروبة والشرف والكرامة جميعا، وفعلوا من الفساد والظلم ما يعجز شر الأبالسة عن بعضة، ومهما قلتم في الهكسوس والفاطمين والأيوبين والمماليك والعثمانين وأسرة محمد عليـ فهؤلاء جميعا مصرتهم شمس مصر ولم يبيعوا ثراها وسماءها وهواءها ولا إستقلالها بثمن بخس، بل كانت بلاد العرب وحدة تحت حكمهم.<br />ليت الإخوان يعطون الفرصة كما أعطيت لحماس من الشعب، وذلك لن يتم وأفاعي المنوفية كلها فيها نفس يتردد بعد، طبعا تصفية نجلي الديوث اللامبارك، يحسم قضية التوريث حسما، وهي واجب ديني، ولكن الفساد تغلغل لنخاع الدولة، وللمؤسسة العسكرية بالتحديد، وحتى لو هب الشعب كله، كما النموذج الإيراني، فأستبعد تماما أن ينضم الجيش المصري للشعب، وقد أفسدوا قادته وأقصوا كل شريف عنه.<br />فما هو العمل؟ أفيدوني أصلحكم الله، فقد حار دليلي؟"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

