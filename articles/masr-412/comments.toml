[[comments]]
order = 4
subject = "ألا إن نصر الله قريب"
author = "قاتل الكلاب"
posted = "2006-05-30"
text = "الأخ الفاضل/<br />الإدارة الفاسدة كفيلة بإفساد أعظم المشاريع والمؤسسات بل والدول وإن كانت عظمي، وانظر ما فعله جورباتشيف بالإتحاد السوفيتي مثلا، إن سئمت من تكرار مثال أقطارنا العربية.<br />جورباتشيف كان سيئ الإدارة فقط، يفسد وهو يظن أنه يحدث ويطور، فمابالك إن إجتمعت مع ذلك سوء الطوية والتجرد من الشرف والمسئولية والوطنية والعروبة والإسلام، وكان الهدف الأنبل لمن يقودنا هو النهب والسلب والغش وبيع كل مقدس وثمين؟<br />مصر هي قلب العروبة، وكنانة الله في أرض الإسلام، هذا ما أراده الله لها أن تكون، وماشاء الله ماض، مهما تآمر عليها علوج المنوفية الأوغاد، من أبنائها أو من أبناء المسلمين ستجد رجلا لا يخشى إلا الله عليه تجتمع الأمة، ويربأ به الصدع وتزول العلة، وما ذلك على الله بعزيز.<br />أعلم أن أمام الأمة سعي جهيد وطريق طويل عليها سيره، والله يسدد الخطى، ويهدى الألباب بفضلة، وهو على كل شئ قدير.<br />اللهم إمنح عبادك قوة وجلدا وعزيمة وشجاعة على تغير الظلم بأيدهم، ولاتكلنا لذوي الغايات والمآرب منا، ويسر لنا من أنفسنا رجلا لايخشى إلا إياك، يكن به الفتح المبين بإذنك."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 5
subject = "المر يحكم الآن..أين الجيش؟؟"
author = "مصرية"
posted = "2006-05-31"
text = "لايمكن أن يكون هناك أمر ممانحن فيه الآن..وأنا معك فى نداء المثقفين والأحرار.. والشرفاء من أبناء مصر..وأضيف نداءاالى الأحرار من الجيش المصرى ..أين أنتم من هذا الفساد والظلم ..لاتجعلوا سموم الفسادتتسرب الى دمائكم ..أنقذوامصر من الطغاة ..فأنتم حماة الوطن ...ثوروا.. انتفضوا ..هبوا..ولبوا نداء الملايين المطحونة من أبناء الشعب ..انهم ومصر أمانة فى أعناقكم..فلا تخونوا الأمانة ..لاتستسلمواولاتنصاعوا لأوامرفاقدى الأهلية والشرعية ..أقسمتم اليمين لحماية الوطن من كل معتدى ..والنظام الفاسد يعتدى على الحريات فى كل يوم..فأنتم فى حل من قسمكم لحمايته لأن الوطن فوق الجميع..وكفى لمصر وأبنائها مذلة ومهانة تحت هذا الحكم الفاسد..الذى انتهك القانون..ليصنع لنفسه شرعية البقاء ..وسوف يتحايل وينتهك اكثر وأكثر ليبرر توريث مصر وما فيها ..بحمايه قانون الطوارىء فكل من يعارضه ارهابى..غير عابىء بالملايين التى فاض بها الكيل ..أنتم الأمل الوحيد والأقوى للخلاص من هذا الطاغية...انقذوا مصر والمصريين.. انقذوا انفسكم من أن تكونوا حماة الطاغية وعائلته التى أعطت لنغسها حق امتلاك مصر بمن فيها ومافيها..مصر كلها تحلم بيوم الخلاص ..كونوامن يحقق هذا الحلم..أعيدوا لنا الحياة ..وخلصونا من الطغاة....لالالالالالالالالالالالا لمبارك وسلالته..لالالالالالالالالالا للفساد ..لالالالالالالالالالا لقانون الطوارىء ...ونعم..نعم..نعم..لتعديل الدستور ..ربنا يخلصنا منكم ..ونلاقى داهيه ترضى تاخدكم ..قولوا آآآآآآآآآآآآآآآآآآآمين"
