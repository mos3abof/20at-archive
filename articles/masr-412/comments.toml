text = "ياعم أبو القاسم ربنا يعطيك الصحة، ويفتح عليك: الكلام ده اللي سعادتك بتقوله أظن إنه حتى طوب الأرض يعرفه. والأساتذة نجم الدين وقاتل الكلاب وغيرهم قالولينا على أبعاد وخطورة الوضع.<br />الحل إنه قيادة شريفة تظهر الوقتي، من الإخوان من غير الإخوان مايهمش، قيادة يلتف الشعب حواليها، ويكون عندها برنامج واضح وسياسة محددة، وكفاءات تضمن تطبيق المبادئ والخطط دي.<br />الحلوف الغير مبارك مش حيسبها طوعا، ومن القوات المسلحة اللي %90 موالي له، ميجيش حسب رأي المتواضع أي دعم، وأكون سعيد جدا لو إلتزموا الحياد في حالة قيام إنتفاضة شعبية ضد الحلاليف، ولكن إحنا برضه شوفنا إيه اللي عمله الجمسي في الشعب سنة1977 ، وبعدها رقاه السادات وعمله مشير.<br />الحل الوحيد إنه تتم قصقصة أجنحة نظام الحلاليف الغير مبارك ده، وقطع القنوات اللي بستمد منها قوته، ودول حيثان النهب والسلب والفساد واللصوصية في البلد. ودول أهداف أسهل من إبن القحبة مبارك، وزوالهم يضعفه جدا. وبعدين لحسم مسألة التوريث دي، مفيش طريقة غير إنه لايوجد وريث إطلاقا! نقدر نعمل كده؟ يبقى فينا لسه بقية من الشهامة والدين، محناش قادرين؟ يبقى ضاعت والعوض على الله!<br />وشكرا"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 12
subject = "شكرا أخي العزيز"
author = "سمسم"
posted = "2006-06-01"
text = "والله يا أستاذ مقروف، كان لسه الملك فاروق أنظف من الحلوف الغير مبارك ومن الخنزير اللي قبلة بتريليون مرة. رحمة الله عليك يا فاروق رغم كل بتقال عنك، أقله ياراجل كان وطني، ومطلبش تدخل الإنجليز ولا غيرهم علشان يحموه ويقعدوه على قلب الشعب. وبعدين هو لما مشي خذ معاه نص مليون جنيه بس، وساب خزينة عامرة، اللي منها تمكن المرحوم الرئيس عبد الناصر إنه يكسر إحتكار السلاح، ويبني الصناعات اللي الحلاليف دمروها وباعوها حديد خردة ورهنوا إقتصادنا، وركبونا ديون عمرنا مانقدر نسدها، وحتي رغيف العيش أجبرونا نستورده وإحنا أكبر بلد زراعية في القارة.<br />الهند يابن الناس بلد المجاعات، بقى عندها إكتفاء ذاتي من القمح والغلال وبقت كمان تصدر.<br />لايوسف والي اليهودي لازم يستوردلنا من أهله المبيدات والبذور المسرطنة، دحنا في عهد فاروق ياراجل كنا بنزرع وبننتج اللي يكفينا ويكفي قوات الحلفاء كلها، ولسه ما كنش السد العالي عندنا، وإستصلاح الأراضي مبداش. فين الأراضي الزراعية ياحلوف والي؟ كلها باعها السادات والخنزير اللي بعده وإتبنت عليها شاليهات ونوادي معرفش إيه لترويج الرذيلة والإنحلال.<br />هم خربم إقتصاد مصر بس، دول خربم الذمم وأجبرم الغلبان اللي مش قادر يعيش عياله إنه يا يسرق يا ياخذ رشوة يا...يا..يا. لما الفول بنتستورده من أمريكا، والموز والتفاح والفاكهة من إسرائيل، وإحنا عندنا النيل، يبقى لينا عين نكلم حد؟ ياجدع بلاد الخليج اللي يقدرم يشتروا الهوا من الخارج، زرعوا الصحاري اللي عندهم وخضروها، وإحنا بنصحر الخضار اللي عندنا وبنزرع علية نوادي قمار وعراة ودعارة، فين فيه خيبة زي دي؟<br />فهمت أنا حأتجنن ليه يابن والدي؟ اللهم عفوك ورضاك وسترك."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 13
subject = "الى الأخ الشريف نجم الدين"
author = "مصرية"
posted = "2006-06-02"
text = "أشكرك لهذا التعليق فلقد مس معلومات عرفتها..وكنت فى حاجة الى تأكيدها وبعد قراءة تعليقكم أود ان أقول بعض ما لدى من معلومات فى هذا الشأن وأرجوا من سيادتكم التعليق بمدى صحتها..بأختصار شديد أن تمثيلية حركة التصحيح التى قام بها غير الغفور له السادات.. وحل منظمة الشباب والقاء قادتها فى السجون بتهم ملفقة ..لأنهم كانوا على وشك كشف سيناريوا معد بينه وبين أمريكا وأسرائيل ..يبدأ بحرب متفق عليها .. وينتهى بالأعتراف بأسرائيل..وعمل معاهدة سلام معها الى آخر السيناريو القذر الذى نعيشه الآن..ولكنى بذلك لاأمس ولاأقلل من يسالة الجندى المصرى الذى خاض هذة الحرب بشجاعة خير أجناد الأرض..فهم بعيدون عن كل هذة الحقارات السياسية..التى يمارسها أصحاب الكراسى..نحن واقعون فى كماشة اللوبى اليهودى الأمريكى الأسرائلى من الخارج ..وبدعم رئيس عميل من الداخل وكان السادات أول عميل ..وأتمنى من الله أن يكون الغير مبارك آخر العملاء ..اذا كانت شبكه الفساد هذه محكمة الى هذا الحد ..فلا ننسى أن الله معنا ..هو سبحانه أفضل من روسيا والصين وغيرها ..الله لايرضى بهذا الظلم ..ولكن لابد من اتخاذ خطوة فى المسار الصحيح ..وانى أعتقد انه لا نجاح لأى حركة دون مساندة الجيش ..مثل ما هناك البعض من محاسيب السلطة ومنتفعيها ..لابد من وجود الكثير من الشرفاء الذين لايبيعون شرفهم ولا وطنهم لهؤلاء الأقذار..وليعلموا أن الشعب كله معهم..يساندهم ويؤيدهم ..هناك أصوات فى العالم تقف فى وجه أمريكا مثل فنزويلا..وايران ..وكوريا ..وغيرها..أنهم يفتحون الباب للشعوب امام عصر التحرر من وطأة الأستعمار الأميريكى الصهيونى..لقد كانت مصر منارا للحرية لم تكن يوما فى مثل هذه المهانة والتبعية التى نعيشها الآن..لم تكن مصر ولا المصريين عملاء لأعداء الوطن ..آه ياوطنى ك<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 14
subject = "اليك إبنتي جزءا يسيرا مما جرى!"
author = "نجم الدين"
posted = "2006-06-02"
text = "إبنتي الغالية المصرية الفاضلة/<br />حديتك مس شغاف قلبي، وترقرقت عيناي بدموع البهجة لما لمسته فيك من ثاقب النظرة والذكاء الفطري المميز، دمعت عيناي طربا لأنني أيقينت أن كل جهود التجهيل وتعمية الحقائق عن الشعب قد ذهبت أدراج الرياح، وأن معدن هذة الأمة الأصيل يستعصي على كل طرق وسحب وتطويع.<br />معلوماتك جد صحيحة، وعمالة الكلب السادات أو رغبته بدور العميل كانت أبرز شئ في شخصيته المريضة المحكومة بعقدة نقص متحكمة فيها، هذا ضروري لفهم شخصيته. بدأ مغامراته بالإتصال بجواسيس ألمانيا النازية، بتكليف من الإنجليز. وفي الستينيات عرض خدماته على السي أي إيه، ولعب دورا قذرا في فض عرى الوحدة مع الشقيقة سوريا وقتها، والحقيقة أن الزعيم عبد الناصر رحمه الله كان يعلم هذا، وأكثر منه تآمر الخنزير مع محور آل سعود- أمريكا ضد الجمهورية العربية المتحدة، خصوصا بعد تدخلنا في اليمن. وعبد الناصر كان محرجا جدا، خصوصا وأن القوات المسلحة كانت موالية لعبد الحكيم عامر، لا لمصر، شخصيا لاأشك بوطنية عبد الحكيم عامر، ولكنه لم يكن لديه أي وعي عسكري لتولي قيادة الجيش، هو كان رائدا ولم يطور معارفه لرتبة المارشال التي لاتمنح هكذا جزافا، الذي أود أن أقوله أن يدي المرحوم ناصر كانت مكبلتين، رغم كل مايشاع عن أنه كان الحاكم بأمرة، هذا أمر غير صحيح على إطلاقه!<br />عبد الناصر كان محرجا خصوصا بعد إصتدامه مع اللواء نجيب، ووضعه تحت الإقامة الجبرية، لأسباب خافية عني، أن تبدأ الثورة بأكل أبناءها، فشلت محاولات ناصر بتحجيم دور حكيم، وأكتفى بإقصاء السادات عن دوائر صنع القرار، بمعنى ثم فرش بساط مزكش فوق كثير من التناقضات والخلافات الخطيرة، وحجبت عن العيون فقط، وهي ما أدت لنكسة يونيه.<br />وضع مصر قبل نكسة يونيه كان كما ذكرت لك، صراع مرير على السلطة، زج<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 15
subject = "توازن الرعب"
author = "ابو القاسم"
posted = "2006-06-02"
text = "انا معاك برضه يا اخ سمسم فى ان المصريين لو عايزين يخلصوا من الملعون والذين معه المفروض يقصصقصوا او يحرقوا ضوافره من الحراميه والنهيبه بجاز اسود بس ازاى؟كان حسن نصر الله بيدعوا دايما لتوازن رعب مع العدو الصهيونى وان عدونا قوى فقط فى عقولنا ونفوسنا فاذا تخلصنا من مهابة العدو وجدناه اوهن من بيت العنكبوت انا فى رائيى المتواضع عايز ادعوا كل المصريين انهم يعملوا توازن رعب مع العلوج اللى بيحكمونا واننا نوريهم فى نفسناالقوه ونثبت فى صدورهم المهابه بحيث يفكر الخنازير اللى بيحكمونا الف مره قبل ما يقولوا ان الاوباش اللى هما احنا ديتهم كام ضربه على دماغهم وبعد كده هايحطوا الجزمه فى بوقهم ويسكتوا يا عالم عدونا من الفرعون وجنده ضعاف جداجدا يعنى فعلا هما اوهن من بيت العنكبوت ولو احنا عايزين الخلاص منهم فهو فعلا فساعتها هايكون الخلاص قاب قوسين او ادنى واول حاجه ان احنا فعلا نكون بنكره النظام ده كراهيه خالصه اكتر من كراهية الشيطان او جهنم مع انهم اسوأ من الشيطان وفعلا ما قصروش فى انهم يحولوا بلدنا لجهنم الله فى ارضه المهم لو كانت الكراهيه خالصه فعلا فهى هاتتغلب على اى خوف من عدونا وبعد كده هاتتحول الكراهيه دى لفعل على ارض الواقع ولى تعليق بسيط على كلام الاخ سمسم فى انه بيقول ان الحل فى وجود قيادت نظيفه سواء من الاخوان او غيرهم انا متفق معاه فى كده بس الاعم هو وجود شعب قادر على انه يغير قدره المبتلى بيه وانه ما يتعلقش بوهم السوبر مان اللى هايجى يحرره من الطغيان عشان احنا طول عمرنا بنعانى من البطل المغوار اللى بيجى يحررنا مرورا بمحمد على اللى كل المصريين مشوا وراهعلى انه يحررهم من ظلم الولاه وبعد كده ركبهم ودلدل رجليه وورث الحكم برضه لاولاده من بعده وانتهاء بعبد الناصر اللى حررنا من احتلال ال<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 16
subject = "ربنا قال إسعى ياعبدي وأنا معاك!"
author = "سمسم"
posted = "2006-06-02"
text = "السلام عليكم أخي أبا القاسم وباقي صحبة الناس الفل اللي هنا/<br />لما قرأيت تعليقك وتعليق الأخت المصرية وتعليق حضرة الضابط نجم الدين، وباقي الإخوة الكرام حسيت معاكم بألفة شديدة وبمودة. يمكن أكون هنا أصغركم سنا، لأني لسه ماكملتش عشرين سنة، وقدامي لسه كثير اللي أتعلمه، رغم إني قريت كثير جدا بالعربي والإنجليزي. لذلك بأطلب من حضراتكم المسامحة مقدما لو كان رأي غير صحيح أو خطأ، العصمة لله وحدة.<br />لي قصة عايز أقولها لحضراتكم تجي زي أفلام السيما بتاعتنا، يوم إحتلال بغداد قعدت حزين ومقهور وفجأة أغمى عليا، ومن يومها وأنا عندي السكر، ربنا يبعده عنكم، وشوية زعل كافية ترميني، والحمد لله إن الوالد دكتور والوالدة كمان، أهم جنب الواحد لو جد شئ.<br />الحقيقة مافي عمري كنت في العراق ولا حتى أعرف عراقي واحد شخصيا، لكن دي رابطة الدم والدين والعروبة اللي لايمكن شئ يلغيها لامبارك ولا مليار حلوف زيه.<br />عم أبو القاسم لو سمحت لي أقول لحضرتك، مفيش ثورة ولا مشروع ولا حتى صلاة جماعة تنفع بدون إمام أو قائد، وأنا مش مقتنع قوي بحكاية السوبرمان ده أو رامبو لأنه ده مالوش وجود، الجماهير بدون قيادة تكون فوضى.<br />وعندك مثل حكاية هوجة الأمن المركزي في الستة وثمانين على ما أظن، إتفضت ليه بسهولة لأن ما كنش ليها قيادة، وأهدافها مايعة مش معروفة، أكيد كانت تمرد على وضع داخلي في ثكناتهم أو سوء معاملة الضباط ليهم، نظرا لأن معظمهم أميين يعني، ومعندهمش فكرة، ولما يطلع فيهم إستثناء زي الشهيد\" سليمان خاطر\" يصفوه في وسط السجن الحربي، ويقولوا إنتحر، الله!<br />هو الإنتحار عندنا هواية، كمان قالم إن الكابتن البطوطي كمان إنتحر وخذ معاه الضباط المصريين اللي راحهم يتخخصوا في أمريكا، وكل عيل يعرف إن الطيارة أسقطت بصاروخ، وكمان يعني أي مبتدئ في الس<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 17
subject = "الى الأخ الشريف نجم الدين"
author = "مصرية"
posted = "2006-06-02"
text = "اشكر سيادتكم كثيرا على ردكم..ان الحقائق التى ذكرتموها تضع امورا كثيرة فى موضعها الصحيح..من الواضح أن سيادتكم برتبة كبيرة..وخبرة عظيمة ووطنية أعظم ..هذا النموذج الشريف المنزه عن المطامع ..هو ما نحتاجه الآن ..لم أخطىء حينما وجهت ندائى الى الشرفاء من الجيش المصرى..ولم اخطىء ايضا لشعورى بالأسى .. حينما كنت أشاهد قائد القوات المسلحة وأشعر أنه انسان آلى ..أو كائن يعيش فى غيبوبة..لن أنسى آخر حديث سمعته له بعد حادثة العبارة السلام وهو يقر باستلامه الاستغاثة فى حوالى السابعة صباحا .. وتحركنا0...( فورا)..وأضع هنا تحت كلمه فورا مليون خط..فورا هذه كانت الساعة التاسعة أو التاسعة والنصف ..هذا كلامه بالحرف الواحد..وأكيد توجد منه نسخ مسجلة..القائد العام للقوات المسلحة .(..فورا..)<br />.. عنده..مداها ساعتين ونصف..ولا يوجدمجال لأوقات غير محددةبالثانيه<br />..وأنا كمواطنة عادية معلوماتى تقول أن الدقائق و الثوانى ..تكون سببا فى قلب الأمور العسكرية 180 درجة..ومنها أنقاذ الأرواح..ولكن مادامت الأرواح مصرية..فلا شيىء يهم ..بعد أن هانت عليهم مصر..قبل أن..أكتب هذا الرد ..سمعت فى قناة الجزيرة عن استشهاد..الجنديين المصريين على الحدود مع اسرائيل..ولم تذيعها القنوات المصرية كالمعتاد..الا بعد اذاعتها فى كل قنوات الدنيا ..واذاعتها بطريقة مهينه ومستفزة ..لاتليق بالشهداء..لم يكن ليجرؤء كلب اسرائيلى باطلاق نار على جندى مصرى..لولا معرفتهم..بمحدودية تسليح هؤلاء الجنود..بحسب معاهدة الأستسلام..ولايخفى على أحد ..احدى البنود السرية التى تشترط عدم تسليح الجيش المصرى بما يحقق له التفوق على الجيش الأسرائيلى..وكما ذكرت سيادتك..أصبح التفاوت كبيرا وخطيرا ومخيفا..آه ياوطنى ..الدموع تتجمد فى قلبى من الحسرة والخوف عليك ..ولا أجد سو<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

