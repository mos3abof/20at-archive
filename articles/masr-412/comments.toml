author = "سمسم"
posted = "2006-06-05"
text = "أنا سعيد جدا باللي قريته من خبيرن من أهل الكفاءة في الأمور العسكرية، وبأحي فيما قريته روح المسئولية والتقدير الواقعي الرزين للموقف. وأنا متأكد تماما إنه لدى كل منهما الكثير ليضيفه، وإن لديهما من الأسباب القوية ما يمنعهما من إبداء تفاؤل أو حماس عاطفي غير قائم على حقائق على الأرض.<br />كإنسان عادي يحاول جاهدا إنه يتلمس شعاع الحقيقة الضائع وسط الأنوار الباهرة للأكاذيب الرسمية الموجهة، لا يمكني إلا أن أنصت لكلام العقل والمنطق الصادر عن أهل المعرفة بخفايا الأمور.<br />ترجمة رسالة الرجلين واضحة، وهي إن العسكر غير متحمسين للتدخل، وإنه لايوجد ولو حد أدنى من الثقة بين الضباط، وأن هناك ضبابية شديدة تجعلهم عاجزين عن معرفة الصالح من الفاسد، وهمه بيقلوا لنا بطريق غير مباشر، \"من فضلكم إبدءوا إنتم تمرد كبير، يكون مبرر لتدخلنا فيما بعد، لإن إحنا عاجزين عن أخذ زمام أي مبادرة نظرا لإختراقنا من عملاء النظام وأسياد النظام الأجانب!\".<br />دي الترجمة حسب فهمي المتواضع لفحوى رسالة كل من الخبيرين.<br />وعلينا ألا نقلل من شأن وبطش وقوة النظام مهما بدى لينا من هشاشة تكوينه وتركبيته، النظام كما هو عليه الآن، لايشترط أبدا أن يكون على رأسه الغير مبارك أو الجرو بتاعه، يحظى بتأيد إقليمي من دول الجوار وفي مقدمتها إسرائيل، وبتأيد القوة العظمى والوحيدة على الساحة العالمية وهي الولايات المتحدة، وهذة حقيقة أكثر من واضحة، وإذا إنسان بسيط وعادي زيي توصل ليها بإجتهاد شخصي، فما بالك بخبراء يرون ويعرفون مالا أراه أنا ولا أعرفه.#<br />العسكر ناس مبرمجون ولا يفعلون شئ غير مدروس، وعامل الإنتروبي أو عدم التأكد من وقوع إحتمال ما لابد أن يكون عندهم في أضيق نطاق. المجازفة عندهم قد لاتنتهي بالإعدام، ولكن بتفريغ كامل للجيش من العناصر الوطنية ال<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 28
subject = "الى كل شرفاء مصر .. الثورة الآن"
author = "مصرية"
posted = "2006-06-05"
text = "الأخ الفاضل سمسم لقد طرحت السؤال الذى يطرح الآن فى كل بيت مصرى..وأتمنى من خلال الحوار الذى أدعو كل من يحب مصر المشاركة فيه حتى نصل الى الأجابة..لقد عشنا سنوات طوال فى حالة من اليأس والأستسلام وهذا ما وصلنا الى ما نحن فيه..واستمرار هذا الحال سيؤدى الى تفاقم الكارثة واستحالة الخروج منها..الغليان والغضب يملأ قلوب الناس .. والكل لايعلم كيف يعبر عن هذا الغضب..لم تعد المظاهرات هى الحل ..فهى تفيد فى بلد تحترم الديمقراطية فعلا..وليست مجرد شعارات كاذبة ..وهاهم يقومون بوقف أنشطة منظمات حقوق الأنسان فى مصر واحدة تلو الأخرى بدعوى انها غير مكتملة الشروط القانونية حسب الدستور المصرى ..وهم ينتهكون القانون والدستور كل يوم ببقائهم فى الحكم بانتخابات مزورة..ويتمادون الى لعبة توريث الحكم...الأوضاع تسيرمن سيىء الى أسوأ..وليس أمامنا سوى احد خيارين فقط.. ان نستمر فى السكوت والأستسلام وأضعف الأيمان ..أن نفتح احدى هذه المواقع وننفس فيه عن الغضب بالأنتقاد والشجب ونتركهم يوزعون الأدوار كما يشاؤون فى ميراث لا يملكوه أصلا.. والخيار الثانى ان نعرف الطريق الى الخلاص من هذا الطاغية القرصان..<br />أدعوكم يا شرفاء مصر ..انيروا لنا الطريق ..كيف نفعل هذه الطاقه الهائلة من الغضب والثورة الى عمل وطنى يفيد قضيتنا..نريد اتجاها شعبيا خالصا لا اطماع سياسية لة ..الناس فى ضياع.. فيمن تثق والصراعات دائرةفى كل حزب ..كيف لهذا التمرد الشعبى الظهور على ارض الواقع دون تنظيم وقيادة..وأختلف معك ياأخ سمسم..فى نقطة الحماس العاطفى..انه مطلوب اشعاله فى كل مصرى ..حتى لا ننجرف الى الأستسلام مرة اخرى..يجب على كل مصرى الا يكتفى بدور المتفرج ..فهذه قضيتنا جميعا ووطننا جميعا ..وآن الآوان للفعل وانتهى دور الكلام..وانا أتساءل معك ما هو الحل<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

[[comments]]
order = 29
subject = "يا شرفاء الجيش المصرى..الثورة الآلآلآلآلآلآلآلآن"
author = "مصرية"
posted = "2006-06-05"
text = "أدعوكم يا كل شرفاء الجيش المصرى ..أن تنضموا الينا وتتفاعلوا معنا ..اكملوا التواصل الذى بدأه الأخ الشريف نجم الدين..نريد أن تمتلىء سماء مصر بنجومها حتى تنير لنا الطريق..لن أكف عن النداء ..ولن أكف عن مطالبتكم لقيادتنا ..ولن أيأس من الثقة بقدرتكم على تحربر مصر مهما كانت الصعاب..كفاءاتكم كفيلة بالتغلب عليها..قد يطول الوقت ..ولكنه فى النهاية سيأتى باذن الله<br />أخى جاوز الظالمون المدى<br />فحق الجهاد...وحق الفدى<br />لآلآلآلآلآلآلآلآلآلآلآلآلآلآلآلآلآلآ للقرصان وعصابته وسلالته ..ونعم..نعم..نعم لثورة الجيش والشعب على الظلم والفساد<br />اللهم اجعله يوما قريبا آآآآآآآآآآآمين"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132844/http://masr.20at.com:80/article.php?sid=412"

