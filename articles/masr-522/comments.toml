subject = "جامعة قناة السويس"
author = "ايوته"
posted = "2006-06-15"
text = "شكرا يا دينا انتى قولتى اللى بيحصل فى جامعتك اقولك انا بقى على اللى بيحصل فى جامعتى بعيد عن الصياعه والسرمحه مع الولاد اللى بتحصل فى اى مكان دلوقتى احب اقولك عن المساؤى اللى بنشوفها اولا مفيش دكاتره بتدخل تشرح حاجه،ثانيا مستوى التعليم زباله يعنى قلته احسن وده لان مفيش مؤهلات لكده يعنى مدرجات معفنه والميكريفونات بايظه يدوب الدكتور يوشوش نفسه،ثالثا الدكاتره ما بيصدقوا نبقى لسه فى اول السنه الدكتور يلاقى حد بيعمل دوشه يقول خلاص المنهج مشروح وغيره وغيره بس عايزه اعرف هيستفيدوا ايه لما يسقطونا؟؟يا رب ارحمنا من ظلم الدكاتره وقرفهم"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616152704/http://masr.20at.com:80/article.php?sid=522"

