text = "الاستاذ بتاع تعليق صباح الخير على المواضيع الملطوشه..احب اقول لحضرتك ان الموضوع مش ملطوش ولا حاجه ولا حتى مسروق ..واحب اوضح لحضرتك ان الفكره دى فعلا جاتلى من الموضوع اللى كتبه بلال فضل<br />صباحك زى وشك يا مصر جميل و حزين هوفعلا لما قريته قررت انى اكتب عننا احنا الطلبة وعن حال الجامعة وعن كليتى..هى حاجه اسمها مطارحةانك ترد على حد بنفس الاسلوب والطريقه بس بفكرة جديده..وده اللى انا عملته استوحيت الاسلوب من بلال فضل وكتبت الفكره عن الطلاب والجامعة والكليه.. وعلى فكره تقريبا اللى معظم اللى علقوا على الموضوع قرءوا مقال بلال فضل قبل التعليق على موضوعى ...ده للتوضيح فقط"
