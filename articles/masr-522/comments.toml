posted = "2006-06-16"
text = "إيه يا بنتي ده ؟؟<br />طيب أنا أعمل إيه اللي كنت خلاص داخلها وغيرت رأيي يوم كتابة الرغبات رغم إني كنت جايب مجموعها ....<br />ودلوقتي أهه مرت السنين ..وأديني رابعة حاسبات ومعلومات وربنا يكرمني في المشروع ....<br />مممم ... يعني رأيك أقول لبنت عمي الصغيرة تغير رأيها وبلاش منها ؟؟؟؟<br />يلا عموما ربنا بيكتب لناالخير دايما<br />وبرضه ...<br />لا للتمديد ... لا لتتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
