subject = "صباحك سكر"
author = "سنووايت"
posted = "2006-06-15"
text = "جيتي على الجرح خدي دول كمان<br />صباح الخير على اقسام الاعلام اللي منها قسم اعلام عين شمس \" اللي اتخرجت انا منه\"<br />صباح الخير على سوزان القلليني اللي هبطت بالبارشوت من مدرس مغمور في اعلام القاهرة لهوب هو بهوب رئيس قسم اعلام عين شمس<br />صباح الخير عليها برضه وهيه بتنزل في التيرو الواحد اكتر من 15 كتاب للاربع فرق في القسم في كل التخصصات بس للاسف على ايامي مكنتش لسه نزلت كتب في العربي<br />تلاقي كتابها بكراسه عملي فاشله معفنه بس علشان تتاكد انك اشتريت<br />عناوين الكتب تضحك - كيفيه الكتبه الكتاب الاول - للراديو وبعدين التليفزيون وبعدين الاخراج الصحفي والعلاقات العامه - وبعدين التصوير وبعدين العملي كله كله مدرسة كشكول<br />صباح الخير على الابعدية بتاعتها على الفساد الواضح اوي من غير تستر<br />صباح الخير على زملائي المتسلقين اصحاب المهام الصعبة واحيانا المستحيله شله الهانم<br />صباح الخير برضه على الساعي بتاع مكتبها اللي فاكر نفسه سفير النوايا الحسنة<br />صباح الخير على الذكريات والمواجع اللي قلبتيها علينا وصباحكو سكر"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616152704/http://masr.20at.com:80/article.php?sid=522"

