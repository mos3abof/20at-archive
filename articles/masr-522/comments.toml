[[comments]]
order = 18
subject = "ممكن احد يفهمني"
author = "بنوووته"
posted = "2006-06-19"
text = "can you tell me !<br />لست مصرية0000 انا سعودية<br />اشارككم المعاناة ولكن تزيد<br />فعلى الرغم من صعوبة المناهج وغلاء الكتب التي اشتريها احيانا بما يفوق التسعين ريالا0<br />ولكن كل شيء يمكن تحملة امام مشكلة عويصة وهي<br />ان من يدرسنامن جنسيات سودانية ومصرية<br />بعضهم (وضعوا تحت بعضهم مائة وخمسين خط )لا يدركون من تخصصهم الذي يحملون فيه شهادات عليا ادنى شيء والفضائح تتجلى واضحة اذا كان القسم لغة انجليزية لا وكمان ادب<br />اتمنى تفهموني ايش السبب؟؟؟؟<br />عندما تدرسني استاذة(ماجستير ادب انجليزي)ولا تعرف ان كانت oxenمفردا ام جمعاوللاسف هي مصرية<br />ولدينا الكثير من هذه الحالات<br />(لا وعاملين فيها ابو العريف مايعطون علامات<br />ويقولون اننا مانفهم)<br />مع اني ادركت شيء من موضوع دكتوراة للبيع في منتداكم<br />ولكن ارجو التوضيح؟؟؟"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144342/http://masr.20at.com:80/article.php?sid=522"

[[comments]]
order = 19
subject = "صباح المواضيع الملطوشة"
author = "عيب كده"
posted = "2006-06-20"
text = "عيب كده الموضوع مسروق من بلال فضل وده نصه:<br />صباحك زي وشك يا مصر..جميل وحزين<br />يوم فى حياة مواطن حقيقى<br />بقلم : بلال فضل<br />صباح الخير<br />يا مصر ..<br />صباح الخير<br />على الناس المرهقين من عناء الحياة<br />والدايرين في الساقية اللي منصوبة لهم من سبعة الاف سنة ..<br />الناس اللي عايشة اليوم بيومه .. كل أملها يعدي من غير اي خساير ..<br />مابتفكرش في بكره عشان ماتتقهرش ...<br />مابتفكرش في النهارده علشان ماتتنقطش ..<br />صباح الخير<br />على ضحكة عالية في قهوة شايها مايتشربش ..<br />على شاب بيقوم لست كبيرة في الاتوبيس ..<br />على كوباية شاي باللبن وحتة بقسماط بعد صلاة الفجر جنب السيدة نفيسة ..<br />على قهوة في الحسين مبيعديش عليها حسن بشندي ..<br />على سينما زحمة والضحك طالع من القلب للركب ..<br />على سور الأزبكية وكتبه المعتقة ..<br />على عشاق فقرا مش لاقيين شقة محافظة فبيخطفوا الفرحة متداريين في صخور الكورنيش ورا شجر النيل ..<br />على صوت الشيخ السيد متولي وهو بيقرا سورة يوسف وبيخلينا نعيط على سيدنا يعقوب اللي ابيضت عيناه من الحزن ..<br />صباح الخير<br />على كل الناس اللي بتشقى عشان تجيب اللقمة من بق الاسد ومراته ..<br />على عربيات الكبده والسجق لحمة الفقير ..<br />وعربيات الدوم تفاح الفقير ..<br />وعربيات السوبيا خمرة الفقير ..<br />على طبق الكشري وخللي العدس ورد زياده وغرقان في الدقة ..<br />على فطاطري الحسين اللي سمى نفسه بيتزا الحسين فباظ من ساعتها ..<br />على العدوي بتاع ميدان الجيش يعني أحلى رصة فول وطعمية بمستلزماتها وبرخص التراب ..<br />على أفران العيش في اسكندرية ..<br />على البلكونات اللي مافيهاش كراكيب ولا بصل ولا توم ..<br />فيها كرسيين وكوبايتين شاي وبصة رضا وأهة شوق ..<br />على كل صالة بتلم الناس اللي مش عارفة تتلم على نفسها ..<br />على كل نكته قبيحة تتقال بصوت عال<br />اقرأ بقية التعليق .."
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141231/http://masr.20at.com:80/article.php?sid=522"

