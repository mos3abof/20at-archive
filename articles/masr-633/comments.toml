[[comments]]
order = 2
subject = "سلم لي على سيد سيد قراره"
author = "http://ibnbahya.blogspot.com/"
posted = "2006-07-11"
text = "سيد قراره دي لناس وناس .. يعني لو الأعضاء المظلومين اللي زورولهم النتائج وسقطوهم وبجحوا غيرهم كسبوا القضية وده شيء مفروغ منه لأنهم مظلومين ولأن ده حقهم .. ييجي عمك جحا المصري (فتحي سرور) ترزي القوانين في البلد ويقولك المجلس سيد قراره .. طيب ليه ما هواش سيد قراره هنا يا عرص ؟؟ طبعا فيه ناس ممكن تزعل من كلمة عرص دي .. لكن يا جماعة المصيبة أكبر وما عادش ينفع معاها أي كلام غير الوساخة دي .. هو فيه أوسخ من اللي بنشوفه في مصر ؟؟؟ عرفتوا ليه هنا سيد قراره وليه في حالات تانية مليون طظ في قراره والقرار يأتي سيادياً من فوق رأس سيد قراره .. وسلم لي على سيد سيد قراره وعلى عرص المنصة الغبي سرور لاحس قراره ..<br />http://ibnbahya.blogspot.com/"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124958/http://masr.20at.com:80/article.php?sid=633"

[[comments]]
order = 3
subject = "عبدالله قفل"
author = "أرسل هذا التعليق بواسطة : عبدالله قفل مفتاح"
posted = "2006-07-11"
text = "إحنا بنبعد عن الحاجات المهمة ونمسك في تفاصيل هايفة، لذلك أحب أطلب من الإخوة التركيز على القضايا التالية في النقاش لأهميتها القصوى:<br />أولا: تحليل مواطن القوة والضعف في شخصية المصري. ليه المصري سلبي وساذج وخواف وقليل الوعي والتقافة. فيه طرق علاج ناجعة وسريعة لمعالجة هذه الأمراض؟ إيه هيه؟<br />ثانيا: أهم مشكلة تواجهنا وتدفعنا للتبعية والعبودية هي الديون الخارجية التي تتجاوز 800مليار دولار، واللي لو حسبانها راح نجدها مجموع ثروة بس عشرة من اللصوص الكبار في البلد زي الريس نفسه وأنجاله وطلعت وعزت السادات وزفت عز ..الخ. هل لو قامت ثورة شعبية أو من الجيش، يمكن تحصيل هذة الأموال المسروقة من الحسابات السرية في الخارج لتسوية الديون، وماتنسوش إن فوائد هذة الديون فلكية وتزايد بإستمرار.<br />ثالثا: هل هناك رؤيا واضحة لإنهاء التبعية الأمنية والعسكرية لأمريكا؟ إحنا بنحتاج من جديد لحليف قوي يزودنا بالسلاح والعتاد وبغطاء سياسي دولي. مين هو البديل؟ وقبل كده هل إخراج الأمريكان من مراكز السيطرة في البلد وقواتنا المسلحة أمر ممكن؟ هل راح يتم بالسهولة اللي خرج بيها الروس بقرار السادات؟<br />رابعا: هل يوجد حزب أو حركة شعبية لديها برنامج أو حتى تصور لحل البنود الثلاثة الأولي؟<br />إذا كان الجواب بالنفي فلن يجدي أبدا إعدام مبارك وعائلته في ميدان التحرير. وصلتكم الرسالة يا إخوان؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124958/http://masr.20at.com:80/article.php?sid=633"
