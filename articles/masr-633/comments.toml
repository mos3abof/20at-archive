subject = "سيد قراره"
author = "ابو شريف"
posted = "2006-07-11"
text = "ثبت للمرة المليون أن سيد قراره (مجلس الشعب) يدار بالريموت كنترول ... فبعد ما طلب منه حبس الصحفيين لكشفهم بؤر الفساد واللصوص قام الرئيس بإلغاء البند وقام أعضاء مجلس سيد قراره بالتصفيق لهذا القرار الصحيح .... طالما صحيح ماخدهوش ليه العباقرة دول .... ولله في خلقه شئون"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124958/http://masr.20at.com:80/article.php?sid=633"

