[[comments]]
order = 2
subject = "الله ربى"
author = "مسلمه"
posted = "2006-04-16"
text = "ياجماعه احنا لازم نصدق انه متخلف زى الراجل اللى قتل كام اسره من فتره ما كان متخلف<br />بس مش كل يوم عمالين فى تليفزيون مصر عمالين يطبطبوا على المسيحيين<br />كده يعنى هما اصلا مش مصدقين بس احنا برضو لازم نصدق<br />مش عارفه والله هما عايزين يعملو فينا ايه<br />عايزين الناس تقتل فى بعض ولا عايزين يقولو انهم من الاخوان المسلمين<br />ربنا يسامحهم على اللى بيعملوه فى البلد دى<br />اللهم اجعل هذا البلد امنا<br />اللهم اجعل مصر ارض سلام واهدنا يارب الى الاسلام"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212903/http://masr.20at.com:80/article.php?sid=168&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "الشعب كله اتجنن"
author = "طماطم"
posted = "2006-04-16"
text = "ياجماعه الشعب كله اتجنن وياريت الشعب كله دا العباره كمان كان عندها فصام<br />والله دى لعبه عشان يعززو قانون الطوارىء مش يلغوه حكوتنا دى شغاله على كبير اووووووى<br />وبصراحه يعنى المسحيين مزودنها خالص ومطالبهم فزيعه جدا ازاى عايزين لغو التشريع الاسلامى<br />طب نشرع باية تقولش يعنى احنا مطبقينه اوى<br />ااااااااااااه يادماغى"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212903/http://masr.20at.com:80/article.php?sid=168&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "قلب الوطن مجروح"
author = "واحد تاني"
posted = "2006-04-16"
text = "قلب الوطن مجروح<br />لا يحتمل اكتر<br />نهرب وفين هنروح<br />لما الهموم تكتر<br />نحيي غصون الورد<br />من دمع سال ع الخد<br />آه يا حبيبة الروح<br />قلب الوطن مجروح<br />لو حتى قلبي تاه<br />بين الشجن والاه<br />ياللى لقاكي حياه<br />انا حبي ليكي صلاه<br />يا مطيرة العصافير<br />يجعل هواكي خير<br />لو قلبي هتضميه<br />اديه حنان وداويه<br />ده الصمت مش لينا<br />فين الولد ما يروح<br />لازم يعود اسمر<br />قلب الوطن مجروح<br />لا يحتمل اكتر<br />لو ينطق الموال<br />لازم يروق الحال<br />محتاجه ليه دراع<br />وشراع وراحة بال<br />محتاج ليكي نجوم<br />هايمة فى حضن هلال<br />لو بحرنا نسقيه<br />صحيه وبوسي عينيه<br />ياما بكرة يسقينا<br />خلى طريق البوح<br />يصبح طريق مرمر<br />قلب الوطن مجروح<br />لا يحتمل اكتر<br />قلب الوطن مجروح<br />لا يحتمل اكتر<br />نهرب وفين هنروح<br />لما الهموم تكتر"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212903/http://masr.20at.com:80/article.php?sid=168&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "اسمعوا الحدوته"
author = "واحد تاني"
posted = "2006-04-16"
text = "منرضاش<br />منرضاش تدوس البشر بعضها<br />منرضاش يموت جوا قلبى نداه<br />منرضاش تهاجر الجذور ارضها<br />منرضاش قلبى جواى يغنى<br />واجراس تدق لصرخه ميلاد<br />تموت حته منى<br />اجراس بتعلن<br />نهايه بشر من العباد<br />الحكمه قتلتنى وحيتنى<br />وخلتنى اغوص فى قلب السر<br />قلب الكون<br />قبل الطوفان ما يجى<br />خلتنى اخاف عليكى يا مصر<br />واحكيلك ع المكنون<br />مين العاقل فينا مين مجنون<br />مين المدبوح من الالم<br />مين اللى الظالم فينا مين مظلوم<br />مين اللى ميعرفش غير كلمه نعم<br />مين اللى محنيلك خضار<br />الفلاحين الغلابه<br />مين اللى محنيلك عمار<br />عمالك الطيابه<br />مين اللى بيبيع الضمير<br />ويشتري بيه الدمار<br />مين هو صاحب المساله<br />والمشكله<br />والحكايه والقلم<br />رايت كل شئ<br />وتعبت على الحقيقه<br />قابلت فى الطريق عيون كتير بريئه<br />اعرف بشر<br />عرفونى لا<br />لا معرفونيش<br />قبلونى وقبلتهم<br />بمد ايدى لك<br />طب ليه ما تقبلنيش<br />لا يهمنى اسمك<br />لا يهمنى عنوانك<br />لا يهمنى لونك ولا ميلادك مكانك<br />يهمنى الانسان ولو مالوش عنوان<br />ياناس ياناس يا مكبوته<br />هى دى الحدوته<br />حدوته مصريه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212903/http://masr.20at.com:80/article.php?sid=168&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

