[[comments]]
order = 9
subject = "أكيد ده تدبير"
author = "سامى"
posted = "2006-06-28"
text = "يالآزم نصحى لازم نفوق كل ده بيدبير لأغراض كلنا يعرفها (الإستمرار و الأبدية) اللى هم عاوزنها وعاوزين الشعب على طول مشغول يتكلم القليل ويفكر كتير بس يقكر فى ايه هوده الموضوع يفكر بس فى لقمة العيش يصبح كل همه من صبحه لمساه هوه لقمة العيش ازاى يوفرها مع ان دى من المسئوليات الأولى لأى حكومة فى الدنيا يبقى ايه لازمتها اذا لم توفلر الحاجات الأساسية للحياة وعلشان كده لاما تكلمنا فى التغيير وحصل الللى حصل فى الأنتخابات وكلكم عارفين بدأوا يشغلونا عن التفكير فى الأتجاه السليم لأن كل واحد عايز مكانه ويسيبه ليه وهوه بيسرق من وراه الدهب ومن هنا وعبدالناصر عملها قبلنا بس كان سعتها فى احتلال غريب وكان عارف مين عدوه بس المشكلة دلوقتى اننا كتير كتير وتايه فى وسط الزحام هدفنا بس لازم لازم من التغيير وكلمة اخيرة هقولها لازم نفوق ونعرف ازاى نمشى ونخطى العتبة"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120139/http://masr.20at.com:80/article.php?sid=168&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "بوابة الأمل"
author = "سامر امام"
posted = "2006-07-25"
text = "لابدلكل المصريين من تحرير عقولهم وتفريغها من أي مؤثرات إعلامية أو عنصرية والتفكير فى حياه كريمة للبلد التى قادت الأرض لزمن طويل كما ورد في القرآن (واجعلني على خزائن الأرض) على كل من يملك العلم من دكاترة الإقتصادوالسياسة دفع البلد للمسار الصحيح ووالله هذا فى مصلحة الجميع أما سطحية الفكر والجهل والطبقية سوف يجلب علينا غضب ربنا وتجينا كارثة من حيث لا ندري عشان كلنا بندور على مصالحنا وسبنا كنانة الله وكأن الله أعطانا كنانته نعبث بها ونعيش فى ثراها كالبهائم والحيوانات يأكل بعضنا بعض حتى الفقراء أنحرف سلوكهم بين متطرف وصايع ونصاب وتذهب تسمع سباب الدين فى كل مكان فأين ذهب جيراننا بعدما سبقونا فى قلة الأدب والغفلة والجهل أنهم تحت أقدام محتلين والدور علينا .. والحل الإعتدال والتوكل على الله يذهب الفقير إلى عملة مستفتحا بالقرآن ذاكرا ربه ناصحا أهله ويدرك الغنى مراقبة الله له فلا يبخس الناس أشيائهم ويكسب بالحلال والعاملون بالحكومة يصلحو أنفسهم ولا يقننو الرشاوي العلنيةالآن عل الله يصلحهم وذوي العلم لا ييؤسو بل ينصحو الناس وعلماء النفس يدفعو الأمة إلى الأمل وآخر حاجة أقولها ربنا يحميكي يامصر حتى ولو منا نحن فأنت أرض الله الوحيدة التي ذكرها في كتابة سبع مرات يارب سامحنا وأصلحنا لوجهك الكريم فى كنانتك في أرضك وصلى على نبينا محمد"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120139/http://masr.20at.com:80/article.php?sid=168&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
