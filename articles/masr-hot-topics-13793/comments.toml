author = "جزائري لا فرنسي"
posted = "2009-11-10"
text = "لا أدري لماذا يصر المصريون على أن أبناء الجزائر يتكلمون الفرنسية، أتحدى الكثيرين أن الجزائريين يتقنون العربية الفصحى أحسن من كثير من المصريين الذين يقلبون سيبويه في اليوم الواحد أكثر من مئة مرة، ولعلمكم الجزائريون يحرصون على توظيف اللغة العربية في اللوائح الرسمية والمدارس واللافتات أكثر من المصريين، فلماذا يغفل المصريون عن أخطائهم: استاد، غول، فاول، أوت سايت، كورنة، كوتش، كرت، تططيب، رسيفر،… يبدو أن التلميذ تفوق على أستاذه، علمتمونا العربية وتفوقنا عليكم في الالتزام بتطبيقها والحديث بها في الجامعات والمدارس، فكيف تقولون إننا نتحدث الفرنسية؟"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202072637/http://www.20at.com:80/masr/hot-topics/13793--q-q.html"

