text = "كل واحد أكيد بيتمنى الفوز الشريف لبلده .. وده لا ينفي أننا عقلانيين كفاية لأننا نفهم أن ده مجرد ماتش كورة لازم هيبقى فيه غالب ومغلوب … الغالب هيفرح و المغلوب يتعلم ويطور .<br />واتمنى طبعاً أن مصر هى الى تكسب … بس من غير خناقات فى الأستاد ولا شد ولا شتيمة ولا اى هرج ومرج .<br />آه لو كنا بنعمل فى القضايا الى تخصنا جداً وتمس حياتنا ربع الى بنعمله علشان الماتش ده .. كان زماننا أتغيرنا من زمان!!!! وعجبي"
