text = "الجزائر فوق كل شئ يا … بلاش أقولهاااا ان شاء الله السودان ستكون التأشيرة للمنديال يا بلاد الخونة والكدابين …صح كنت بحب مصر ولكن بعد الكذب لي شتو منها والنفاق صرت بكرها كتير كتير حتي أتمنالها الموت استناونا في السودان يا أتباع شاون واليهود انتم ضد العرب والفلسطنيين أكتر من اليهود حد أنفسهم وحرام عليكم<br />المهم الفوز للجزائر ان شاء الله<br />سمير ابن الجزائر وخليها حياتك خضرا وشجع الخضـــــــــــ ـــــــــــــــ ـــــــراااااا<br />وسلام للعرب أجمع الا حثالة الأرض وطبعا هم المصريين<br />سمير جريوي"
