posted = "2009-10-28"
text = "انا مصري ولكني احترم اداء الجزائرين في هذه التصفيات<br />وعاوز اعرف الجزائرين بان المصريين كمان بيكروه عمرو اديب اللي متربي علي حجر مرة وكلامه وحركاته كلها حركات نساوين ومش نسين اللي قاله علي منتخب مصر في بطولة القارات. وعايز اقول لعمرو اديب ابو لمعة اتعلم من اخوك الكبير الاحترام يامهزا<br />عمرو أديب ( أبو لمعة )"
