author = "ahmed salem"
posted = "2009-10-30"
text = "اتمنى فوز مصر والصعودالى كاس العالم والتحليق بامنيات شعبنا وقاره افريقيا كلها الىلفاق جديده فى المونديال والملعب بينا ايها الجزائريون يوم النصر للمصريين بادن اللهوادا لم يكن فنكون اول من يهناكم لاننا شعب يحب الرياضه ويقدر الروح الرياضيه ولن ننساق لسخافتكم هده الحمقاء لاننا اكبر بكثير منغوغاء الصبيه والصحافه عندكم التى تخدع الجماهير عندكموبتسخنهم وكانكم مقبلون على حرب ولاننا دائما على قدر المسئوليه سيكون ردنا يوم المباراه مصر مصر مصرمصر مصر"
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107100231/http://www.20at.com:80/masr/hot-topics/13793--q-q.html"

[[comments]]
