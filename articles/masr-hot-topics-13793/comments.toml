text = "جزائر ايه اللي بتتكلموا عليها دي ده لولا المصريين مكنتش هتكون على الخريطه كانو حطوهم مع فرنسا ههههههههههههههه ههههههههههه<br />احنا لازم ناخد حقنا وحق المصريين اللي اضربوا في السودان وهي دقني اهي لو الجزاير الفشله دي عملت حا جه في بطولتهم دول اصلا ناس متشرفش العرب خاااااااااااااا اااااالص لا بيتكلموا عربي عدل ولا اخلاقهم اخلاق عربي مسلم دول بربر وبس وناس شورعجيه وعربجيه كفايه تشتتهم على الاقل احنا لما بتحصل مصيبه بنتوحد وبنبقى زي الاسووووووووووو ود وبعدين يعني ايه تحرقوا علم بلدنا طب احرقوا علم اعدئنا اليهود الاول ده اصلا دليل كافي على عدم عروبتكم وبعدين احنا اسيدكم واحنا اللي ساعدناكم لما احتلتكم فرنسا ده ايه البجاحه اللي تخليكوا تحرقوا علم اسيدكم يا خونه وابشركم بالخساره يا فشله<br />ههههههههههههههه ههه"
