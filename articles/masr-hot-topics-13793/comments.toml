author = "محسن ابراهيم"
posted = "2009-10-31"
text = "ياجماعة عيب الكلام ده .. دي كورة يعني رياضة ياجمهور الجزائر اللي بشتموا فيهم دول مصريين هه مصريين مصر دي هيا اللي عملكم كرامة في العالم كله مصر الكبيرة وعلي رأي المثل اللي ملوش كبير يشتريلو كبير هي مصر اللي غزت الجزائر هيا اللي قتلت اكثر من مليون شهيد جزائري دي مصر حينما وجدت شيقتها الجزائر محتلة والمحتل يستبيح الشعب الجزائري وقفت بجاني الجزائر والأن تحرقون العلم المصري ايه أشتقتو للأحتلال تاني وبرده ان حصل هذا سنقف بجابكم لأننا الكبار .. والكبير كبير لانبالي بهذه المهاترات … والرقصات الموجودين في شارع الهرم معطمهم جزارئريين دي مباراة كرة مش حرب ولا انتم عندكم عقدة نفسية من مصر دي مشكلتكم … لاكن منتخب مصر يوم 14/11 سيعلجكم من هذه العقدة واحنا مش هنولع في العلم الجزائري لأننا وطنيون<br />ولكن هنعرفكم مين مصر لأننا الكبار ومحترميين وأقول للشعب المصري ..<br />لاتسمع للجاهل السفيه فكل ماقال هوفيه<br />ماضر نهر النيل يوما لوخاض بعض الكلاب فيه<br />مصر هي مصر مصر العروبة … مصر الأسلام … مصر المحبة … مصر الوحدة<br />تحيا مصر . تحيا مصر تحيامصر تحيا مصر ولو كره الحاقدون<br />فيه"
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107100231/http://www.20at.com:80/masr/hot-topics/13793--q-q.html"

