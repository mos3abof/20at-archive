author = "ahmed"
posted = "2009-10-30"
text = "نحن المصريون اصحاب التاريخ والحضاره بل نحن اكرم وافضل شعوب العالم على الاطلاق وتاريخنا يشهد بدلك يا جزائريون يا ابنلء الفرسيين نحن اللدين علمناكم العربيه ولنا الفضل فى دللك وحررناكم من الاحتلال وقدمنا شهدائنا لتنالو حريتكم ولكن كعاتكم دائما تكنون لنا كل الكره لاننا دائمااا وابداا اصحاب الفضل عليكم وعلى العالم اجمع طيله التاريخ لاننا افضل شعوب العالم وهده هى عقدتكم الحقيقيه بل هى الحقيقه نفسها وليس نحن اصحاب العقده منكم فىكره القدم"
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107100231/http://www.20at.com:80/masr/hot-topics/13793--q-q.html"

