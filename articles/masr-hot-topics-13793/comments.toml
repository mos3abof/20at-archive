text = "الفوز لمصر انشاء الله والجزائر عشيلهم على ايدى وادفنهم كلهم المشجعين والاعبين انشاء الرحمن حسام ما اخطاء ملاك انزل شارع الهرم وشوف بناتكم عندنا بيرقصوا وبيعملوا ايه ياعم بلاش تتكلم احسن لانك متعرفش شئ كفايه انكم خونه وعملاء وناكرين جميل مصر الى وقفت معاكم كتير اظاهر انكم اشتقتم تانى للاحتلال مصر فضبلها عليكم فضل مطوق راقبتكم وده الى غيظكم من مصر والمصرين والمصرى هو الى علمك العربى ووقف معاكم فى التحرير المصرى هو عمك ومصر هى امك شئتم او ابيتم فمصر لها الفضل فى انكم مبقتوش 20 مليون شهيد"
