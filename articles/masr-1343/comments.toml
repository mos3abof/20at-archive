text = "خير أجناد الأرض ...<br />في كل مكان .. في كل زمان ... في كل مجال .....<br />إحنا المصريين ...<br />برضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
