text = "بصراحه يا عشرينات الموضوع دة شيق للغايه بس حزين لان كل ناجح مصري عربي مينجحش الا لما يسافر برة اتمني اسافر بلاد الواق الواق مهو انا خلاص زهقت بلادى بقت عزبه مصريه لمن هب ودب ولا يستيطع منحنا حب"
