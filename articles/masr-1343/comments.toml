[[comments]]
order = 11
subject = "للكابتن الى شتم"
author = "جلال"
posted = "2007-01-05"
text = "للمحترم الي بيهاجم الدكتور ابراهيم الفقى انا متاكد من اسلوب كلامك انك متعرفش حاجه عن الشخص الى انت اتكلمت عنه وانك كنت عايز تشارك فى الكلام وخلاص ...نصيحه عشان تحكم على انسان لازم تعرفه كويس ولو عايز تعرفو محاضراته كلها على النت وعموما انا مش بقول ان الكلام بتاعه قرأن بس هو بيحاول انه يشجع الشباب ويحمسهم على النجاح و كلامه مفيد"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010029/http://masr.20at.com:80/article.php?sid=1343"

