[[comments]]
order = 2
subject = "ناجح يرفع ايدة"
author = "ناجح فى اية الاخ دة بيتكلم عشر ساعات فى امور فلسفية كانت تنفع ايام افلاطون"
posted = "2006-12-22"
text = "احنا عايزين واحد ناجح يعمل لنا مكنسة كهربائية<br />وواحد ناجح يعمل للعيال قلم رصاص يكتبوا بية<br />وواحد ناجح يعمل عربية نركبها<br />وواحد ناجح يصنع ماكينة خياطة<br />وواحد ناجح يرصف6 الشارع ويزرع حديقة فيها ورد<br />النجاح مش واحد بيتكلم كلام مايفدش بية حتى حشرة<br />فلسفة اية ياجهلة<br />وكل يكتب لنا كم بيت شعر لا يقدم ولا ياخر يقول اننى مثقف مثقف فى اية مش عارف"
archived = "2007-01-01"
capture_url = "https://web.archive.org/web/20070101042056/http://masr.20at.com:80/article.php?sid=1343"

[[comments]]
order = 3
subject = "بدون عصبيه"
author = "سامى ندا"
posted = "2006-12-22"
text = "اولا: بخصوص الدكتور ابراهيم الفقى فلك منى التحيه والتقدير على مابزلت من جهد وعناء حنى تثبت ذاتك وقد كنت اتابعك منذ زمن على الفضائيات<br />ثانيا : الى كل الساده الافاضل الذين يعلقون على الموضوعات المطروحه لماذا هذه السباب والشتائم؟ لماذا لانتعلم لغة الحوار ؟ لماذا لانترك لبعضنا مساحه من الخلاف فى الرأى ؟ لماذا اذا اختلفت معك فى الراى اكون جاهلا وانت علامه ؟<br />طالما لم يتسع صدرنا للراى والراى الاخر فلن نتقدم ابدا<br />\" لله الامر من قبل ومن بعد وله الحكم واليه ترجعون \""
archived = "2007-01-01"
capture_url = "https://web.archive.org/web/20070101042056/http://masr.20at.com:80/article.php?sid=1343"

[[comments]]
order = 4
subject = "شكرا"
author = "إبن بهيه"
posted = "2006-12-22"
text = "لقد التقيت الدكتور الفقي أمده الله بالصحة .. وللحق والحقيقة هو رجل مصري محترم وحياته رحلة مليئة بالقصص التي يمكن أن يستفيد منها الشباب ، فضلا عن ملايين القصص الأخرى التي يعلمها من خلال خبراته الطويلة ودراساته المتعددة<br />الدكتور الفقي متخصص في التطوير الذاتي وعلم البرمجة اللغوية العصبية (LNP) وهو علم حديث يعتمد أساسا على بعث الطاقة الداخلية الخلاقة في البشر وله عماليق في الخارج مثل روبينز وكوفي وغيرهم .. وأنا سعيد أن يكون لدينا مثل إبراهيم الفقي كي ينقل لنا بوعي مثل هذه العلوم الجادة والمفيدة لعلنا نرتقي بمستوى الإدارة لدينا فهي إشكالية حياتنا .. نحن نفشل حتى في إدارة بيوتنا فما حال شركاتنا ثم أوطاننا .. ده إن كان يدير أوطاننا ناس محترمه ووطنية وليس كذاك العميل مبارك الواطي ..<br />تحياتي لعشرينات على هذا الموضوع .. وابعث بتحياتي إلى الدكتور إبراهيم الفقي وأسأل الله له العافية الدائمة ويديم عليه الصحة ولا تعاوده تلك الأزمة القلبية مرة أخرى وخصوصاً في بلده ووسط أهله .. تحية للجميع .. وأتمنى أن نكون جادين لمعرفة هذا العلم العظيم الأثر بالفعل .. اقرأوا عنه وستعرفون مدى تأثيره السحري على حياتكم وكيفية تغييرها بأيديكم وليس بالظروف<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-01-01"
capture_url = "https://web.archive.org/web/20070101042056/http://masr.20at.com:80/article.php?sid=1343"

[[comments]]
order = 5
subject = "الى صاحب تعليق الناجح يرفع ايده"
author = "نيفين نيفى نوفا"
posted = "2006-12-24"
text = "و الله صاحب تعليق الناجح يرفع ايده لو حضر جلسه واحده او محاضره واحده بس لدكتور ابراهيم الفقى مش هيقول الكلام اللى قاله دا ابدا<br />يا جماعه الراجل دا قوه روحانيه ماشيه على الارض و انا حضرتله ف مجال التنميه البشريه و قرات له كتير بس لما تقعد ادامه ف ندوه دى حاجه تانيه<br />دا الواحد بيستنى زياراته لمصر"
archived = "2007-01-01"
capture_url = "https://web.archive.org/web/20070101042056/http://masr.20at.com:80/article.php?sid=1343"

[[comments]]
order = 6
subject = "ولله جنود في الأرض"
author = "رجاء"
posted = "2006-12-28"
text = "الله يبارك فيك ويزيدك من علمه أكثر وأكثر والحكمة ضالة المؤمن أينما وجدها أخذها<br />والذي يتقي الله يجعل له مخرجاً ويرزقه من حيث لا يحتسب.<br />فليسددالله خطاك ويجعلك قبس نور تنير به طريق التائهين ويمد في عمرك ويبارك في وقتك ويجعلك من الذين لا خوف عليهم ولا هم يحزنون .....اللهم أمين<br />مع خالص تقديري وإحترامي ،، ،،<br />فأنت ثروة لا تقدر بكنوز الأرض"
archived = "2007-01-01"
capture_url = "https://web.archive.org/web/20070101042056/http://masr.20at.com:80/article.php?sid=1343"

