text = "الراجل داه ... ض.اسطوره عربيه دليل على اننا ح نكون حاجه فى كل شى فى العلم وفى الين وفى كل حاجهلان كل فتره بتظهر حاجه فوق المستوى البدايه قناة الجزيره عمرو خالد ابراهيم الفقى ... وبعد حاجات كتير جايه باذن الله"
