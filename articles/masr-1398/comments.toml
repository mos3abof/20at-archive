[[comments]]
order = 1
subject = "خنازير تصفق لخنازير ....."
author = "مصري"
posted = "2007-01-06"
text = "إن لم تستحي فافعل ما شئت ... دي ناس قليلة حياء .. ناقصه تربيه .. ناقصه أدب .. مجرد خنازير عايشه عشان تاكل براز الريس المعفن الواطي وتصفق له ... الله يلعنهم ويلعنه ويريحنا منهم قريبا بإذن الله ...<br />يا رب ريح مصر بقى من الزباله دي .. والله تعبنا .. تعبنا يا رب وأنت أعلم بحالنا منا ... يا رب خلصنا من هؤلاء الفجرة السافلين الأقذار الأندال وعلى رأسهم حسني مبارك الواطي العميل"
archived = "2007-01-06"
capture_url = "https://web.archive.org/web/20070106170624/http://masr.20at.com:80/article.php?sid=1398"

