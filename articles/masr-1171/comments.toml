subject = "إصرار على اللف والدوران .. طيب ليه ؟؟؟؟"
author = "إبن بهية"
posted = "2006-11-16"
text = "كلام الأخ عن المراكب والتوهان والقرف اللي احنا فيه كويس وما حدش يعارضه .. لكن اعتراضنا على تلميحاته العبيطة نحو الإخوان المسلمين ، فهذا ما نعارضه عليه ليس لأننا جميعا إخوان ولكن لأن الإخوان المسلمين يكادون يكونون هم وحدهم الفئة الوحيدة الغير مستفيدة في هذا الوطن المذبوح .. الكل ساحب سكينه إلا الإخوان .. الكل له مطامعه في التهليب (كل حسب قدره ومقداره) إلا الإخوان الذين يعلم كل من راقبهم وعايشهم عن قرب أنهم ينفقون من جيوبهم على حفنة المباديء التي يتحصنون بها ويريدون تحصين هذا الوطن بها ..<br />عندما نجح الإخوان في الانتخابات هاجت الدنيا من حولهم .. الجميع حقد عليهم .. وقلة قليلة جدا من شرفاء هذا الوطن باركت خطواتهم من أمثال عمنا اليساري الشريف أحمد فؤاد نجم الذي أرضعنا الاشتراكية شعراً مغزولاً من حبات تراب حواري مصر فشبت أجيال منا تعشق الاشتراكية الفاجومية دون الاهتمام بأيديولوجيات لينين ولا ماركس ولا تولستوي .. قرأناها وأعجبتنا ولكنا بقينا مصريين .. عشقنا مكسيم جوركي وكتاباته ولكنا بقينا مصريين .. تعلمنا ماجستيرات ودكتوراهات وسافرنا بلاد الله الواسعة من شرقها لغربها وخالطنا شعوبا وقبائل وثقافات ولكنا بقينا مصريين .. لم نخلع حجاب بهية ولا الطرحة ولا الجالابية .. وهي دي الرجولة .. وهي دي الأصالة والأصول لمن أراد الطريق الصحيح .. وفي رأيي الصادق لوجه الله والوطن أن الإخوان المسلمين هم الوحيدون اليوم القادرون على الفعل وعلى تحمل تبعات المشاكل والمصائب التي أغرقنا فيها نظام مبارك ، ليس لأنهم متدينون ونحسبهم بإذن الله عادلون .. ورعون .. ولكن لسبب آخر أهم وهو أن تنظيم الإخوان المسلمين هو الوحيد اليوم على أرض مصر الذي يمكن الوثوق به من حيث التنظيم والهيكلية الرائعة التي يتمتع بها ..<br />اقرأ بقية التعليق .."
