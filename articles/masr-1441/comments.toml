[[comments]]
order = 5
subject = "نصيحة للجميع"
author = "الى الاخوة معارضى النظام النجس عليكم أن تستخدمو كمبيوترات محمولة فى الاتى من الزمن لان الاخ حبيب العادلى سيقبض على كل كلب يلمس كيبورد ويشتم النظام وعليكم ان تخبو الاب توب فى الاماكن العامة عشان مخبرين النت مايقفشوش فى أهاليكو ولا اقلكو ماتستخدموش النت أقولكو ماتفتحوش النت قضوها بققيقى اقولكو أحسن ماتتكلموش كمان يكون أحسن"
posted = "2007-01-24"
text = "فكرت بأن أكتب شعراً<br />لا يهدر وقت الرقباء<br />لا يتعب قلب الخلفاء<br />لا تخشى من أن تنشره<br />كل وكالات الأنباء<br />ويكون بلا أدنى خوف<br />في حوزة كل القراء<br />هيأت لذلك أقلامي<br />ووضعت الأوراق أمامي<br />وحشدت جميع الآراء<br />ثم.. بكل رباطة جأش<br />أودعت الصفحة إمضائي<br />وتركت الصفحة بيضاء!<br />راجعت النص بإمعان<br />فبدت لي عدة أخطاء<br />قمت بحك بياض الصفحة..<br />واستغنيت عن الإمضاء!<br />للشاعر أحمد مطر"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182720/http://masr.20at.com:80/article.php?sid=1441"

