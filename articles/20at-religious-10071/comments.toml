text = "قال الله تعالي \\\"وما ابريء نفسي إن النفس لأمارة بالسوء إلا ما رحم ربي إن ربي غفور رحيم\\\"<br />أتمني من كل المسلمين في هذا الشهر الكريم أن يقوموا بإصلاح أنفسهم حتي نعمل علي نهضة الأمة<br />قال تعالي \\\"إن الله لا يغير ما بقوم حتي يغيروا ما بأنفسهم\\\""
