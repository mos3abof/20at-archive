author = "معلقة دائما.."
posted = "2007-06-30"
text = "السلام عليكم موضوع جديد فعلا ،انا اعرف شباب كتير عندنا في الكلية بيطلعوا رحلات جااااامدة اويييي وطبعا بيقولو احنا مش مستفيدين حاجة بس طبعا فيها سبوبة والحياة كلها بقت سبوبة ، بس المفروض من وجهة نظري ان لو حد فكر يطلع رحلة لازم يفكر فيها كويس جدااااا لأنها على قد ما فيها سبوبة على قد ما هي مسؤلية كبيرة جدااااااااااااا اااااا وبعدين حالات القيء اللي بتحصل دي حاجة عادية جداااااا ..انا بفضل اني اطلع رحلة حتى لو هي سبوبة بس ميكنش العدد كبير ،اما السيطرة على الأفراد اللي طالعين الرحلة دي من أهم المشكلات فعلا..على العموم ربنا يكرمنا برحلة سواء بسبوبة او من غير سبوبة هو ايه اللي في الحياة مبقاش سبوبة…وانا لو فكرت اطلع رحلة حفكر في المتعة من الدرجة الاولى ومش حيهمني لو فيه سبوبة ولا لأ أما لو امتهنت الموضوع ده طبعااااا لازم تبقى فيه سبوبة ..فده على حسب الهدف"
archived = "2010-02-11"
