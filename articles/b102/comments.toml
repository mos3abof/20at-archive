[[comments]]
order = 2
subject = "بابا !!مش للدرجه دي"
author = "المشكلة ف موضوعك إن الواحد مش عارف إنتا بتتكلم على ( بابا) ولا عن ( بابا) !!! بصراحة موضوعك لذيذ ، وواضح من الأول إنك بتتكلم عن الأب مش عن الابن ولا الروح القدس !! على فكرة ممكن برضه تتكلم عن الابن ،وكيف سيسر على خطى الحبيب ( أبوه يعني في الحالة دي) خاصة وةإن الابن ف حالتنا بيسمع كلام باباه قوي ، حتى بعدما سقط ف لجنة السياسات ،،، قصدي الامتحانات !! تُشكر يا هيمة"
posted = "2005-12-19"
text = "تم تعديل الاسم نظرا لأنه ليس \"واحد معدي الحقيقي\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134320/http://www.20at.com/article2.php?sid=102"

[[comments]]
order = 3
subject = "الدين لله والسلطة للشرطة والقهر للجميع"
author = "والله موضوع لطيف , ولعلمكم ساعات كتير بيبقى قلة وجود الأب أفيد من وجوده يعني لو مشيه بطال او \"بيصرف الفلوس على مزاجه\" أو ليه علاقات غير شريفة ببعض القريبات والبعيدات يبقى قلته احسن"
posted = "2005-12-19"
text = "ولو مش عارف يربي ولاده الاتنين وسايبهم يبلطجوا على خلق الله \"ويرموا الهلب على ولاد الحتة\" سواءً كان هلب سياسي او اقتصادي يبقى قلة الأب ده احسن من وجوده وتبقى انت اكيد اكيد في مصر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134320/http://www.20at.com/article2.php?sid=102"

