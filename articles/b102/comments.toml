subject = "ابراهيم يا بني"
author = "هناء"
posted = "2005-12-19"
text = "شوف يا ابراهيم يا بني<br />انت اتولدت كاتب مقال ساخر..انت اللي ساخر مش المقال<br />لغتك حلوة جدااوبموت فيها، بس من رايي لا داعي للملحوظة اطلاقا،حسيت انك بتهينني<br />كما انها أساءت للرمزيةاللي هي اصلا سافرة ف المقال..(الرمزية السافرة) اسم من اختراعي لنوع من الرمزية موجود فعلا لكن لا اعرف له اسما.المهم انه كمقال اجمل واعمق بكتير منه كقصة،وان كنت اراك قد تجاهلت اجزاء جميلة من القصة كان يمكن التعامل معها لاثراء المقال(طبعا الكلام دة للي قراها وهي قصة)لكن لو انا بقراها كمقال للمرة الاولي..فهو نص متكامل وجذاب<br />وفقك الله ،وحفظك..ومش حبلغ عنك ال........"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134320/http://www.20at.com/article2.php?sid=102"

[[comments]]
order = 13
subject = "تحياتي لحضراتكم"
author = "إبراهيم عادل"
posted = "2005-12-20"
text = "شكرًا لكل الأصدقاء الأعزاء الذين أسعدوني بردودهم في هذا المقال / ,أحب أنوه للعزيزة هناء فقط إن الملاحظة دي موضوعة لظروف رقابية بحتة<br />صوابع إيديك مش زي بعضها ...<br />ونفسي كل اللي افتركني بتكلم عن ( باباه) يروح يبوس إيد أبوه ...<br />ماشي سبوس إيد ابوه ...<br />وتحياتي ليكم ، ولكل الأبهات !!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134320/http://www.20at.com/article2.php?sid=102"

