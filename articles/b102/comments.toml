[[comments]]
order = 18
subject = "شوفوا الباباهات التانية واتحسروا"
author = "واحد تانى"
posted = "2006-03-19"
text = "من واقع تعاملى معاهم شفت ياجماعة باباهات تانية بتدى لولادهم حاجة اسمها منحة زواج للشاب(500 الف) والشابة (500 الف تانيين) لأ وكمان ارض 500 متر يبنوا عليها بيت العمر ( شايفين ... بيت, مش عش العصفورة يقضينا وكمان مش بيلاقوه عند بابانا) المهم بقى ان فيه اخوة تانيين محترمين برضة من بلد السيد الفاضل المحظوظ اللى فوق ده, باباهم بيدلهم حاجه شبه منحة الزواج برضه بس على هيئة قرض من صندوق التنمية العقارية (400 الف بس) يتسدد على 1500 سنة كده تقريبا وطبعا مش عاجبهم لانهم بيبصوا للسادة اللى قبلهم ويقولوا ياريت كان بابانا زيهم باباهم خيره (زايد) على الكل. الله يرحم باباهم ويرحمنا من بابانا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134320/http://www.20at.com/article2.php?sid=102"
