text = "ياااااااااااااا ااااااااااااااا اااااااه فكرتونى باحلى ايام حياتى<br />انا اصدقائي من ايام الحضانة لسة ليا علاقة بمعظمهم الحمد لله<br />وبالاخص صديقتنى الانتيم صدقتنا من 15 سنة ولحد دلوقتى ويارب تستمر<br />امممممممممممممم مم<br />صراحة بغير عليها جدااااااااااااا اا ااااا,بالذات من بقيت صحابنا حتى خطيبها كنت بغير منه لما احس انه واخدها منى بزيادة ,بحس كدا انها بنتى واحيانا اختا واحيانا امى بصراحة هى ركن اساسي جدااااااااااااا اا ااا فى حياتى,,لما بنعد بقى نفتكر ايام ابتدائي وثانوى والجامعة الشغل فرقنا شوية بس بنحاول نتغلب على الظروف دى"
