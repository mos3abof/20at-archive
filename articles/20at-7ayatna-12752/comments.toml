text = "اقتباس صداقة ايه:<br />لسه فاكرة زمن الصداقة يااستاذة رضوة .. مفيش وقت لحاجة غير لقمة العيش .. فات وولى وعدى ومر زمن الاصحاب أحنا في زمن البيزنس<br />أنا أتفق معك أو معكي اننا في زمن البزنس بس ده ميمنعش ان فيه صداقة حقيقية موجودة لأن الصداقة شيء ضروري في حياة الانسان ومش الانسان"
