author = "الصديق الندل"
posted = "2009-07-26"
text = "أيام المدرسة من حضانة لغاية اعدادي كان ليا واحد صاحبي اسمه محمد سعيد، كان تخين زيي ومبتسم على طول، كنا على طول مع بعض في كل مكان.. الفصل والنادي والفسحات<br />روحت عنده في البيت وجه عندي في البيت وكلنا وذاكرنا مع بعض<br />في ثانوي ابتدي يتعرف على شباب تانين يشربو سجاير ويسهروا للفجر المهم بعدنا عن بعض<br />انا بحكي الحكاية دي ليه.. الواطي الندل بعد كده لما شوفته في النادي بعد ما خلصنا جامعة عمل نفسه في الاول ما يعرفنيش.. بعد كده لما سلمت عليه وقف يتكلم دقيقتين وبعدين قال ان عنده ميعاد<br />شوفتم قلة اصل بالشكل ده؟؟؟؟؟؟؟؟؟؟؟؟؟ ؟؟؟؟؟؟؟؟؟"
archived = "2009-07-29"
capture_url = "https://web.archive.org/web/20090729020906/http://www.20at.com:80/20at/7ayatna/12752-2009-07-26-12-14-11.html"

