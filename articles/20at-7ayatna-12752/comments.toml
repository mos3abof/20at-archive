posted = "2009-07-30"
text = "انا بق كان عندى فى المدرسة بنت حبتها من اول نظرة وهى حبتنى اوى كونا اصحاب بجد وكان معانة واحدة تانية كان اسمنا الثلاثى المرح او مثلث برمودة بس جت لصحبتى اوى اوى منهوم انها تبعنى الى كونا صحاب جدا بعتنى والتانية لااء بعتنى عشان مش تترفد من الدمرسة مع اننا كونا هترفد سوى بس فضلت نفسها علية مع انها ه السب لما زعقت للمدرسين مش انا يعنى بس تعبت سنة وونت ببكى كل يوم وكل يوم كنت عند دكتور شكل بس ربنا الحمدلله هدانى وخفيت ونسيت كل حاجة بس اكيد كل حاجة بتسيب بصمة يلة بس ربنا عوضنى عن واحدة تانية كويسة ومحترمة ومقدرة كلمة صداقة ربنا يخليهالىىى"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105215747/http://20at.com/20at/lifestyle/12752-2009-07-26-12-14-11.html"

