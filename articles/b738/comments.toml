[[comments]]
order = 0
subject = "جملة مفيده"
author = "عبدالله مفتاح"
posted = "2006-04-27"
text = "من احسن الجمل اللي قالها ابن خلدون في مقدمته جملة لو العرب فهموها مش هنسمع مسطول يقول العلمانيه هي الحل<br />الجمله بتقول(كل الامم قد تنجح بلا دين الا العرب فهم بلا دين صعاليك)<br />معنى الجملة دي قالها بردو الشيخ الغزالي -رحمه الله-"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142851/http://www.20at.com/article2.php?sid=738"

[[comments]]
order = 1
subject = "ابن خلدون مؤسس علم الاجتماع بكل جداره"
author = "أحمد محمد أبو الليل"
posted = "2006-04-27"
text = "باحترامي لكل الاراء . وبصفتي طالب في الصف الثالث الثانوي وادرس علم الاختماع كماده مقرره.اثبتت لنا الدراسه في منهج علم الاجتماع ,ان بن خلدون هو الذي اسس علم الاجتماع حيث لا يذكر كلمة(عل اجتماع)في اي مكان إلا ما يذكر معها اسم بن خلدون .والدليل علي ذالك مقدمته المشهوره *مقدمة بن خلدون*وهذا كتاب يضم عدت كتب كبيره اطلق عليها/ديوان المبتدأ والخبر وهذا كتاب يحكي تاريخ العرب والبربر ومن جاورهم من ذوي السلطان الاكبر والبربر هم سكان شمال إفريقياومن جاورهم من الفرس والروم.وفي النهايه اقول ان مقدمة بن خلدون صحيحه% ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142851/http://www.20at.com/article2.php?sid=738"

