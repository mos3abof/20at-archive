[[comments]]
order = 0
subject = "زوال الطواغيت رأس كل صلاح"
author = "مسلم"
posted = "2006-10-19"
text = "اللهم اني أسألك باسمك الاعظم الذي إذا سئلت به أعطيت وإذا دعيت به أجبت أن تزيل طواغيت العرب والمسلمين وعلى رأسهم الخمسة الكبار ال سعود وحسنى والاسد وبرويز وخائن الاردن ، فبزوالهم تتوحد الامة وتنتهي هذه الفوضى في رمضان وفي غيره<br />ولن يزولوا الا على يديك يامن تقرأ هذه السطور ، والا فسيطول بهم المقام"
archived = "2006-10-22"
capture_url = "https://web.archive.org/web/20061022025012/http://www.20at.com/article2.php?sid=1368"

[[comments]]
order = 1
subject = "تهنئة"
author = "عبدالرحمن محمد"
posted = "2006-10-19"
text = "اهنىء الاستاذ/محمد المرشد العام للاخوان المسلمين بعيد الفطر المبارك اعاده الله<br />على الامه الاسلاميه بالخير واليمن والبركات"
archived = "2006-10-22"
