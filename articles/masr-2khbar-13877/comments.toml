text = "تمخض الجمل فولد صرصارا<br />اعلان بالمانشيت العريض زيادة معاش الضمان الاجتماعى 25 %<br />يا حلاوة امك بك<br />معاش الضمان الاجتماعى 80 جنية<br />هيزيدوا قدر اية<br />يعنى معاش الضمان الاجتماعى يشترى 2 كيلو لحمة فى الشهر<br />وبعدين يظهر انة مفيش اى بريق امل فى البلد دى<br />حرام نشتم ونهرى فى اعصابنا<br />تغور فى ستين داهية"
