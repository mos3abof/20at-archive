posted = "2006-06-14"
text = "يا اخوانا دور الشطرنج ده ما لوش اخر<br />طب بالزمة والصراحة السادات كان كويس؟<br />طب عبد الناصر كان كويس؟ فاروق كان كويس؟<br />ابوه كان كويس؟ جده كان كويس؟<br />و لحد الفراعنة مين جه يحكم مصر وكان كويس؟<br />المشكلة فينا احنالو كان عمر بن عبد العزيز حكم مصر كنا عبدناه وخليناه مش كويس."
