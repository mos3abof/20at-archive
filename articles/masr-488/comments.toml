subject = "النقلة االقادمة"
author = "أبو أسامة"
posted = "2006-06-14"
text = "اظن ان كل واحددالوقت مستنى النقلة القادمةو ربنا يعجل بيهاوالا هتخرب اكتر ماهى خربانةوكلناعرفنهاويموت بعدها الملك<br />لكن لو سكتنا تانى على حقنا هيجى ابن الملك ماهو اللعبة دى فيهالاعب زيادة قاعد<br />مستنى نشرب على ابوه قهوة سادة<br />وخليك يا شعب صابر وتقول مسيرها تروق وتحلى وانت عمال تقوم من وحلة تقع فى وحلة واللى جاية انقح واحلى<br />خليك يا شعب ساكت<br />لما تلاقى نفسك غرقان فى وحلة......<br />وعجبى<br />لا.............للتوريث<br />لا.............للسكوت<br />فوقوابقى"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233223/http://masr.20at.com:80/article.php?sid=488"

