text = "إقلع غماك يا تور و ارفض تلف<br />إكسر تروس الساقية و اشتم و تف<br />قال: بس خطوة كمان ... و خطوة كمان...<br />يا أوصل نهاية السكة يا البير يجف<br />يا طير يا عالي في الســــــما طظ فيك<br />ما تفتكرشي ربنا مصطــــــــــــــــفيك<br />برضـــــــــــك بتاكل دود و للطين تعًًًًودً<br />تمـــــــــص فيه يا حلو .. و يمص فيك<br />عجبي !!!<br />اااااااااااااه يامصر<br />sampo"
