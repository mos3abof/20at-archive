[[comments]]
order = 1
subject = "جماعات الضغط والمصالح"
author = "عبد الله"
posted = "2006-11-08"
text = "يبدو ان زنوبه يسارية علشان كده قرفت من الموضوع عموما الذي يسير فى مصر فى الاونة الاخيرة يشير الى تحول جماعات المعارضة والضغط الى جماعات المصالح حتى ولو تنافي ذلك مع ما تعلنه من مبادئ وشعارات رنانة ( وكل لبيب بالاشارة يفهم )"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015046/http://masr.20at.com:80/article.php?sid=1137"

[[comments]]
order = 2
subject = "فين هما اليسار"
author = "د. عماد جادو"
posted = "2006-11-08"
text = "أين هم اليسار أعتقد انة لا يوجد يسار فى مصر منذ يوليو 1952 وأن كانو موجودين فأما هو برهاناً ولا يصح ان يركب احد الموجة وتناحر المعارضة ليس فى مصلحة الجميع لانها ضعيفة أصلا نريد يسارا وأخوانا ويمينا فالكل مهم ولكل منهم دور فى منظومة وأتزان العمل السياسي"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015046/http://masr.20at.com:80/article.php?sid=1137"

[[comments]]
order = 3
subject = "الاخوان إخوان !!"
author = "مصري في قطر"
posted = "2006-11-08"
text = "الاخوان هيفضلوا اخوان .. في تفكيرهم الوصولي إلى حد كبير ، ما انركش انهم احسن من غيرهم من اليسار والنظام ..لكن للأسف الاخوان مش غاية .. وعلشان انتم في عشرينات أخوان ضروري تروجوا لشعارات الاخوان ولفكرهم ..هرجع وأكد على نقطة انهم احسن من غيرهم على الساحة لكنهم مش غايتنا"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015046/http://masr.20at.com:80/article.php?sid=1137"

[[comments]]
order = 4
subject = "الصحافة رسالة وليست تجارة"
author = "صحفي مصري"
posted = "2006-11-08"
text = "لا داعي للصيد في الماء العكر وتهويل القضايا أكثر مما تحتمل لأننا في وقت نحتاج فيه إلي التوحد وتقريب وجهات النظر رغم اختلافي الكلي مع حزب التجمع الذي لم يبقي منه سوي الإسم فقط والذي انهار علي يد رئيسه المدعو رفعت السعيد وكذلك وجود بعض التحفظات علي أداء الإخوان لا علي فكرهم"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015046/http://masr.20at.com:80/article.php?sid=1137"

[[comments]]
order = 5
subject = "روضه عبد الحميد"
author = "معلش أخ بهنس انا هسيب الموضوع كله وامسك فى حاجة بعيدا عنه"
posted = "2006-11-08"
text = "\"اتهامات أخرى كثيرة متبادلة تنبأ بانتهاء شهر العسل بين الإخوان واليسار\"<br />هما اتجوزا امتى ياراجل!! طب مش كانوا يعزمونا!!!<br />انا بعلق على التعبير مستقلا عن معناة<br />بس موضوع دسم ومجهود واضح"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015046/http://masr.20at.com:80/article.php?sid=1137"

[[comments]]
order = 6
subject = "إن بعض الظن إثم"
author = "زنوبه"
posted = "2006-11-09"
text = "يا عبد الله<br />إن بعض الظن إثم<br />لا يا سيدى مش يساريه<br />ومش بحب الاخوان ولا الوفد ولا الغد ولا الناصريين ولا اليسار ولا التيار العلمانى (الشيوعيين سابقا) ولا الوطنى ولا آثق فى آى من التيارات الموجوده على الساحة وبصراحة ندمت إنى إديت صوتى للآخوان ، طب هما فين الاخوان؟!!<br />وقرفت لآن كل التيارات الموجوده غرضها السباق الى الكرسى بطريقة ميكافيلية سخيفةعلى آساس إن الغاية تبرر الوسيله, كلهم بيغيروا الوشوش والاقنعة حسب الحاجة وبعدين يلبسوها تانى وثالث وده سر عدم نجاح آى تحالف حتى الان لأن الساحه \"مخنوقه\" بالتالى كله بيلعب على كله علشان يقدر يشم نفسه شويه.<br />الحل هو حكومة إنتقاليه يتم إختيارها من كل فئات الشعب (إخوان ويسار وناصريين ... إلخ) الناس فى ظل الحكومه دى تبتدى تبين سياستها وتعبر عنها بدون آقنعه ولا آفلام على الناس وبعدين يبقى فيه إنتخابات حرة.<br />لكن طبعا آنا بحلم وعمر ده ما هيحصل."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015046/http://masr.20at.com:80/article.php?sid=1137"

[[comments]]
order = 7
subject = "الصورة مش بالسواد ده يازنوبة"
author = "عبد الله"
posted = "2006-11-09"
text = "كلامك صح فى اغلبه يازنوبة بس الصورة مش بالسواد ده لان رسولنا الكريم بيقول فى حديثه الشريف ما معناه ( الخير في وفي امتى الى يوم القيامة ) اذن فيه خير واكيد فيه اتجاه من كل الاتجاهات دى صح بس احنا علينا ندور ونبحث عن الحقيقة مش نستسلم ونقول ( اففففففففففف) و ان الكل بتاع مصلحته ومفيش فايدة والناس زهقت ؛ لا ؛ الصح اننا نبحث بموضوعية عن الحق والاتجاه الصحيح ونحاول نصلح ما فيه من اخطاء لان مفيش حد معصوم من الخطأولا احد يملك الحقيقة المطلقة وكان دعاء الصالحين دائما ( اللهم ارنا الحق حقا وارزقنا اتباعه وارنا الباطل باطلا وارزقنا اجتنابه ) اللهم امين ."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015046/http://masr.20at.com:80/article.php?sid=1137"

