[[comments]]
order = 9
subject = "اين هو اليسار فى الشارع المصرى"
author = "ايمن امام"
posted = "2006-11-09"
text = "اين هو اليسار اساسا من الشارع المصرى لاوجود فعلى له سوى جريده لايعلم سوى الله وحده اعداد توزيعها ولايصح الربط بين اعجابى بصحفى معين اننى انتمى لفكره السياسى-ماذا فعل اليسار فى الانتخابات العماليه السابقه ماذا فعل اليسار من قبل اليست هذه الوجوه هى بذاتها التى كانت تقول ان المقاومه الاسلاميه ضد الشيوعيين فى افغانستان ارهاب- اليسار مجموعه مكتبيه تظهر بين حين واخر فى القنوات التليفزيونيه عندما تحتاج لها الدوله ولولا بزوغ نجم الاخوان الى حد ارعب الدوله لما رأينا هؤلاء- الذين يركبون المرسيدس ثم يتحدثون عن الاشتراكيه والشيوعيه - ايمن امام"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015046/http://masr.20at.com:80/article.php?sid=1137"
