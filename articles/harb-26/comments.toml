subject = "alhamd lellah"
author = "abw omar"
text = "دعونا نفكر بمنطقيه في مصر مثلا الوحيد القادر علي فتح هذه الجبه دون اذن لاعمروموسي ولاغيره بعد الله سبحانه وتعالي هم الاخوان المسلمون اولا لخبرتهم السابقه في هذا النوع من الحروب ثانيا انهم من مركز اصدار اعلان يعني المرشد العام لوخرج علينا وقال دون خوف الا من الله<br />بسم الله الرحمن الرحيم<br />ان الله اشتري من المؤمنين اموالهم وانفسهم بان لهم الجنه<br />تخيل الكم الهاءل من خيره اجناد الارض ومن الاموال دون مبالغه والله لوارادوا خلع الجبال لخلعوها وبالنسبه لحكومه مصر الريس التعبان ده ليس امامه الا ان يخرج للرأي العام اننا مجموعه ارهابيين والاسطوانه اياها وبكده يبقي هوخلص منينا مجرد اعلان يامرشد الاخوان في وقت يحتاج الاسلام الشجعان الذين والله يعزهم الله وينصرهم والا احنا بقينا صم بكم عمي"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720142152/http://harb.20at.com:80/article.php?sid=26"
