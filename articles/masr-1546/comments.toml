subject = "لااعلم هل نحزن ام نفرح"
author = "ايمن امام"
posted = "2007-02-06"
text = "لااعلم هل نفرح لهذا الخبر ام نحزن - امثال هذا- المنتحر هم - عصا السلطه الغليظه التى ضربت القضاه والصحفيين والمحاميين واساتذه الجامعات- مجموعه من الاشخاص الذين اهانوا كل طوائف الشعب المصرى- فهل نفرح ان جائهم زلزال مدمر قضى عليهم جميعا ودفنهم احياء فى سكناتهم- ام نبكى لان الوطن فقد رجلا شارك فى تمزيق ملابس امرأه على مرأى ومسمع من العالم -رجل شارك فى تعذيب اخر بوضع عصا فى مؤخرته - اللهم لاشماته- اللهم لاشماته<br />ايمن امام"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217031654/http://masr.20at.com:80/article.php?sid=1546"

