subject = "الموضوع حلو يا سيد تركي.."
author = "الموضوع حلو يا سيد تركي.."
posted = "2007-02-06"
text = "الموضوع رحته حلوه جدا يا استاذ سيد لدرجة انى قريته أكتر من مره \" تصور ديه \" وده لان الموضوع معمول بسمن بلدي اصيل من اول كلمة لنهاية الموضوع وناخد حاجة حاجة<br />1- توافر عنصر الطبخه فى تغطيه الحدث<br />2- المعالجة المطبخية لكل جوانب الازمة<br />3- التزام الملوخية بشكل رائع فى الموضوع<br />4- الاسلوب كان دسم جدا وفيه مرقة لحمه ضاني كتير<br />وعلى فكره يا سيد انتا من احسن الطباخي اللى بيطبخوا فى الموقع من وجهه نظرى المطبخية المتواضعة"
