[[comments]]
order = 4
subject = "حضرتك موجود يا وطن؟"
author = "نفر"
posted = "2007-02-06"
text = "شدي حيلك يا بلد<br />شدي حيلك يا بلد<br />وما نيل المطالب بالتمني .:. ولكن تؤخذ الدنيا غلابا<br />وما استعصى على قوم منال .:. إذا الإقدام كان لهم ركاباً<br />شدي حيلك يا بلد<br />شدي حيلك يا بلد<br />شدي حيلك يا بلد<br />في أول زيارة لي لزميل عزيز من الأرياف يدرس في قاهرة المعز ويسكن في شقة مع زميل آخر له ، صفعني منظر غريب جداً حيث وجدت أن الشغالة لديهم عبارة عن رجلين (عساكر أمن مركزي) وفرهما لهما قريبهما في الداخلية .. يذهب الجنديان يوميا لكنس ومسح وتطويق الشقه بالكامل ثم غسل وترتيب المواعين والملابس .. ولازم يكون كل شيء آخر ألسطه وإلا يتخرب بيت أبوهم وينضربوا بالجزمه كما حدث ذات مرة وخلع قريبهم الضابط حذاءه وألقاه في وجه الجندي الذي رباه أهله وأرسلاه لخدمة وطن يظنون أنه مازال موجوداً .. أخذ الجندي الحذاء الذي كاد يخرم عينه ووضعه عند قدم الضابط القذر وهو يتألم ألماً شديداً من الذل وليس من الدم الذي سال من أنفه .<br />بات أمر الجنديين الذين يقومان بدور الخادمة لهذين الزميلين المحترمين مألوفاً لنا وما كان بوسعنا غير التخفيف عنهما في كل مناسبة وبكل صورة ممكنة إلا إذا كان حضرة الضابط موجوداً في الشقة فهو لا يسمح لهما بالتنفس حتى في وجوده ، إلا إذا رغب هو في اللعب واستخدمهما للترويح عن نفسه المريضة كما كان يحكي دوماً ..<br />دي مصر يا حبيب الكلاب .. وده الوطن ياللي عايز تخدم الوطن<br />وما حدش يقولي الجيش أرحم من الشرطه .. اللي يقول كده يروح يشوف شباب المحروسه المجندين في الجيش شغالين بوابين على عمارات الباشوات في مدينة نصر وعايشين على عطف السكان المستأجرين اللي بيرقوا لحالهم<br />دي مصر يا حسني الكلب .. وده الوطن ياللي عايز تخدم الوطن وتروح تقضي فترة خدمة الوطن<br />إيه رأيك يا وطن؟<br />حضرتك موجود يا وطن؟<br />طي<br />اقرأ بقية التعليق .."
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217031654/http://masr.20at.com:80/article.php?sid=1546"

