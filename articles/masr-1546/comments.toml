subject = "طيب نلاقيك فين؟"
author = "نفر"
posted = "2007-02-06"
text = "في أول زيارة لي لزميل عزيز من الأرياف يدرس في قاهرة المعز ويسكن في شقة مع زميل آخر له ، صفعني منظر غريب جداً حيث وجدت أن الشغالة لديهم عبارة عن رجلين (عساكر أمن مركزي) وفرهما لهما قريبهما في الداخلية .. يذهب الجنديان يوميا لكنس ومسح وتطويق الشقه بالكامل ثم غسل وترتيب المواعين والملابس .. ولازم يكون كل شيء آخر ألسطه وإلا يتخرب بيت أبوهم وينضربوا بالجزمه كما حدث ذات مرة وخلع قريبهم الضابط حذاءه وألقاه في وجه الجندي الذي رباه أهله وأرسلاه لخدمة وطن يظنون أنه مازال موجوداً .. أخذ الجندي الحذاء الذي كاد يخرم عينه ووضعه عند قدم الضابط القذر وهو يتألم ألماً شديداً من الذل وليس من الدم الذي سال من أنفه .<br />بات أمر الجنديين الذين يقومان بدور الخادمة لهذين الزميلين المحترمين مألوفاً لنا وما كان بوسعنا غير التخفيف عنهما في كل مناسبة وبكل صورة ممكنة إلا إذا كان حضرة الضابط موجوداً في الشقة فهو لا يسمح لهما بالتنفس حتى في وجوده ، إلا إذا رغب هو في اللعب واستخدمهما للترويح عن نفسه المريضة كما كان يحكي دوماً ..<br />دي مصر يا حبيب الكلاب .. وده الوطن ياللي عايز تخدم الوطن<br />وما حدش يقولي الجيش أرحم من الشرطه .. اللي يقول كده يروح يشوف شباب المحروسه المجندين في الجيش شغالين بوابين على عمارات الباشوات في مدينة نصر وعايشين على عطف السكان المستأجرين اللي بيرقوا لحالهم<br />دي مصر يا حسني الكلب .. وده الوطن ياللي عايز تخدم الوطن وتروح تقضي فترة خدمة الوطن<br />إيه رأيك يا وطن؟<br />حضرتك موجود يا وطن؟<br />طيب نلاقيك فين؟<br />لأ ويقولك انتماء وحب الوطن .. طيب وروني حتة وطن عشان أحبها وأنزل فيها عشق وغرام لما أموت<br />طبعا ده جزء من المخطط الوسخ للعدو وبيستخدم عصابة الحكم في مصر للتنفيذ<br />إيه رأيك يا وطن؟<br />حض<br />اقرأ بقية التعليق .."
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217031654/http://masr.20at.com:80/article.php?sid=1546"

[[comments]]
order = 6
subject = "يلعن أبوك وطن"
author = "نفر"
posted = "2007-02-06"
text = "يعني الأم المصرية المسكينة تحبل وتتعذب في شهور الوحم وتشيل في بطنها جنين تسع تشهر وييجي يوم الولاده تموت م الألم وأوجاع المخاض .. وهوب يخرج من بطنها حتة لحمه حمرا مع آخر شهقة خرجت من صدرها .. تنسى الألم وتحضن حتة لحمها وتضمها وتديها صدرها .. وتدادي وتربي وتنضف وتليف وتحمي وتقلع وتلبس وتحادي وتهنن وننه هو .. هينام أهو .. ويكبر قدام عنيها خلية خلية .. لو كانت بتعرف القراية كانت عدت كل خلايا اللحم والعظم وهو بيطول ويكبر قدامها<br />وتيجي ساعة نداء الوطن .. (قال وطن قال)<br />تجهز لكبدها شنطته وآخر طبخه يدوقها من إيدها وتودعه بدمعه وتوصايه .. خلي بالك من نفسك يا ضنايه ..<br />يرجعلها كبدها المخلوع من ضلعها بعد شهرين .. دبلان .. تعبان .. صدمان .. عدمان .. وكأنه كان بيخدم الكلاب مش الوطن .. تزغط وتأكل وتحط الربع جنيه على البريزه عشان تشتريله نص كيلو لحمه يبر نفسه .. ويرجع يسافر من تاني لخدمة اللي بيسموه وطن ..<br />دي أم محظوظه .. أهو بيرجعلها كل شهرين تلاته ..<br />لكن تعمل إيه أم اللي رجعلها في شوال مربوط ومحطوط جوه صندوق مقفول جاي من سينا ولا من المحله ؟؟؟<br />وممنوع تفتحه .. ممنوع تقرب منه .. ممنوع تبص على كبدها البصه الأخيره .. ممنوع أي لمس وهمس وكلام .. الكبد نام .. خلاص يا بنت الكلب .. ملعون أبوكي جاهله متخلفه .. ما تعرفيش إن للموت حرمه .. ادفنوه .. ريحوه من الوطن .. آدي اللي نابه م الوطن .. كيس قماش وحتة قطنه في بقه عشان يسد حلقه وما يتكلمش حتى مع الملايكه<br />يلعنك وطن<br />ما بنشوفش حبك غير لما تضمنا في بطنك ونندفن في أرضك ميتين<br />يلعن أبوك وطن"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217031654/http://masr.20at.com:80/article.php?sid=1546"

