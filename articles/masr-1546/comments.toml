text = "يا نفر انت بتنادى على انه وطن الوطن من كتر الهموم بقى مش شايف ولا سامع ولا عارف الوطن واقف بيتفرج انت بتنادى على انه وطن الوطن اللى بنتحبس علشانه وبندخل المعتقلات وبنموت علشانه فعلا الوطن يستحق دة ويستحق اكتر من كدة بس من حقنا على الوطن اننا نتعامل كبنى ادميين احنا مش حيونات احنا بنى ادميين.<br />اوعى تلعن الوطن يا نفر الوطن تعبان الوطن فيه اللى مكفيه خلاص الوطن عنده الشيخوخة والسكر والضغط والبطالة والقلب والسفاح والشرطة والرئيس وكفاية هم الدول العربية اللى شايلها الوطن على رأسه.ويا ايمن انت تزعل على العسكرى لانى فى الاخر العسكرى اللى بيضربنا فى المظاهرة دة عبد المامور مغلوب على امره لو حاول يتكلم العسكرى هيلاقى الف واحد يقتلوه.وعلى فكرة رونى انا سمعت الحكاية بتاعة قنا لكن ياترى العيب من الضابط ولا من الناس كان لازم الناس يتكلموه بس لانى الناس غلابة وملهاش دهر فهتروح فى الرجلين.زمان كانوا اجددنا بيقفوا فى وش الانجليز والفرنسيين كانوافلاحيين وتجار وعمال وكانوا بيقفوا مع انهم برضه كانوا غلابة بس علشان كان فى زعيم مجمعهم لكن دلوقتى مافيش زعيم ومافيش حد يقدر يكون زعيم وحتى لو فيه زعيم الزعيم دة هيتعلم فى انهه مدرسة يا ترى فى مدرسة فيكى يا مصر تقدر تطلع زعيم مدارسك يا مصر يا إما امريكية او مدارس لا تستحق للاستخدام الادامى لا تستحق انه يكون فى طلاب فيها.بس يا ترى دلوقتى مبارك مبسوط ولا لسة ولو انت مش مبسوط يا ريسنا هتعمل ايه اكتر من كدة فينا علشان تتبسط انت خلاص بعت الوطن وبعت السويس اللى اجددنا ماتوا وهما بيحفروها وبعت الاثار ناقص ايه تانى تبيعه اه تبعنا احنا كمان بلدولار يلا بيع وبيع كمان سيناء وبيع دم الشهيد. بس مش هتقدر تبيع الاجيال اللى جاية مش هتقدر تبيع صوتهم. وهنفضل نقول تحيا م<br />اقرأ بقية التعليق .."
