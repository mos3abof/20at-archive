subject = "مين البرئ ومين المظلوم ومين الظالم !!!"
author = "فارس _fr"
posted = "2007-02-06"
text = "بالرغم ان الموضوع مأسوى شوية ويحزن على شاب منشباب مصر الغلابه اللى مات نتيجة الجهل , نتيجة جهله للقطاع اللى التحق بيه , نتيجة جهلةبقوة وهيمنة اولى الامر , نتيجة لحاجات كتير قوى , نتيجة هوان الناس وضعفهم فى مواجهة النظام العفن .<br />كلامى مش معناه انى شمتان فى العسكرى اللى مات ده - حاشي لله , ولكن الموضوع اكبر من كده بكتير , الموضوع فيه فساد قطاع باكمله سواء قطاع الجيش او الشرطة ."
