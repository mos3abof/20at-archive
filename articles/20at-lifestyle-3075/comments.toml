author = "Etho0o0o0o"
posted = "2007-01-18"
text = "يااااااااه يا اخت هدى انتى من الآخر كدة عقدتيني … بقى انا الى بقول هخلص من الملل الى في حياتى من غير خطوبة ولا جواز تيجي تقوليلي شحنهم بيخلص يالهوي بقى بعد ما اضيع زهرة شبابي عليه يسيبنى اتفرج على تيتانيك لوحدي النبي لو عمل كدة لهحوله البيت تيتانيك واغرقه بايديا … اة والنبي لاعمل كدة … ربنا يصبرك على ما بلاكي يا اختى"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225601/http://20at.com/20at/lifestyle/3075.html"

[[comments]]
order = 1
subject = ""
author = "ريما"
posted = "2007-01-18"
text = "و الله يا محمد دة مش صعب… انا عيشا الي نفسك في دة…ودة كله لان انا و زوجي اشتركنا بنفس الحلم انو نعيش قصة حب لاخر العمر… لحد دلوقتي كل ما نفتكر ايام الخطوبة بنعيش بجو رومنسي منغير ما نحس… احيانا بس اشوفو مشغول عني اروح مفتكرة اي موقف من ايام الخطبة و حكيالو عنو.. على طول يترك الي قي ايدو و ينتبهلي…بس تعرف يا سيد الرجل هو الطرف الي عليه المسؤولية الكبيرة في تحقيق هالحلم… لان الزوجةديما عندها استعداد للرومنسية و ديما بتحس بالفخر لما زوجها يحسس كل الناس انو بحبها و فخور فيها و سعيد معاها… الرجال غالبا مبحبوش ايبينو هالشي قدام الناس_ دة طبعا الزوجة الطبيعية الي معندهاش ميل فطري للنكد_ حب مراتك و حسسها باهميتها بحياتك على طول حتعيش حلمك هاد… اسال مجرب… و بالتوفيق يا محمد<br />و بنا انك ديما بتختم بشعارك الشهير حختم بشعار الفلسطنية الدائم<br />تصبحون على وطن"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225601/http://20at.com/20at/lifestyle/3075.html"

[[comments]]
order = 2
subject = ""
author = "محمد السيد"
posted = "2007-01-18"
text = "والله ضحكتيني … بجد حكاية الموبايل اللي شحنه خلاص دي أحلي حاجة …<br />وللأسف … أوقع حاجة …<br />موبايل … شحنه خالص ومش بيكلم حد خالص …<br />لكن تعرفي ؟؟؟ الموبايل ساعات بيعمل نفسه شحنه خالص لأنه مش بيلاقي يتصل بيه … ولا يكلمه …<br />في البيت عندنا … كانوا أي حاجة تعطل … يقولوا السبب هو الركنة وقلة الاستخدام<br />ساعات الموبايل برضه ممكن يعمل نفس الحركة …<br />لأنه … محدش بيكلمه …<br />نفسي … في حياة زوجية ميكنش فيها الغلطات اللي بأشوفها دلوقتي …<br />نفسي في حياة يكون كل واحد فيها بيفكر في الحاجت الصغيرة اللي ممكن تفرح التاني …<br />نفسي في حياة أكون فيها الأول والأحير … وتكون هي فيها …برضه الأولي والأخيرة …<br />نفسي … أول ما نيجي نشد مع بعض … واحد فينا ينهي الكلام …أو ممكن نتفق علي حاجة نعملها أول ما نشد … عشان نبطل شد … ونسكت ساعتها …<br />نفسي …لما نتضايق من بعض … أكون أول واحد يصالح … وتكون هي برضه أول مين يبدأ بالكلام …<br />نفسي …لما نقعد نفتكر في ايام الخطوبة وكتب الكتاب و الفرح والأيام دي …ونقول ياااااااااااااا ااه …عشنا من ساعتها في لغاية دلوقتي في السعادة دي …<br />نفسي قدام عيالنا …صوتنا مش يعلي علي بعض أو يحسوا ..بأن في أي حاجة غلط بينا …<br />نفسي … أبوس إيديها قدامهم … وكده يتعلموا يبوسوا إيديا وإيديها كمان …<br />نفسي … تقولهم علي طول استنوا بابا لما ييجي من الشغل عشان نبقي كلنا مع بعض …<br />نفسي أسيبهم مع حمايا أو حماها في البيت ويكون لينا يوم في الاسبوع ننزل فيه مع بعض … بس .. من غير حد تاني …<br />نفسي قدام أهلها أقولها ربنا يخليكي ليا … وهي قدام أهلي تقول ده أحسن راجل في الدنيا …<br />نفسي لما أقعد مع صحابي يقعدوا يقسموا عليا وعلي بيتي وعلي الهنا و الدلع اللي معيشاني فيه …<br />ونفسي قدام صحابها ..أفضل اشكر وأشكر وأشكر فيها …لغاية ماتبقي طايرة من الفرحة …<br />أقولكم باختصار!! … نفسي معملش الحاجات الوحشة اللي بيعملنا الناس الكبار دلوقتي …<br />ادعوا لي … وإن كان فيها الخير …ادعوا لي أكون معاها … ملكة اليمن السعيد ..<br />مش قلت لكم ؟؟؟مش عايز أسكت …؟<br />إن شاء الله مش حاسكت<br />لا للتمديد … لا للتوريث … نعم لتعديل الدستور المصري<br />mohamedmat@hotm ail.com"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225601/http://20at.com/20at/lifestyle/3075.html"

