[[comments]]
order = 4
subject = ""
author = "معزبة"
posted = "2007-01-19"
text = "تعرفي يا هدى كلامك دا واقعي جدا لأن أنا كمان عندي نفس المشكلة مع زوجي اللي بعتقد أنه رومانسي وياما قلتله يا ريت تظهر حبك ليا امام الناس وما فيش فايدة بالعكس الناس دايما حاسةاني حزينة، تقريبا مش هقدر اقق اللي نفسي فيه<br />ادعوا لي بجد"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225601/http://20at.com/20at/lifestyle/3075.html"

[[comments]]
order = 5
subject = ""
author = "مروة السيد"
posted = "2007-01-24"
text = "للي بيقرا التعليقات ..ولاحظ تشابه اسماء …ايون انا اخت محمد السيد<br />مش عارفة ليه بعد ما قريت الموضوع و سرحت في مشكلة الشحن اللي خلاص ..وبعدها قريت تعليق اخويا ..لقيت نفسي باقول زيه نفسي (امال يعني هو يقول وانا لا )<br />نفسي اللي حارتبط بيه يكون نفسه في حياة بجد ..زيك يا محمد<br />يكون نفسه في الحاجات اللي انت نفسك فيها دي<br />لانه زي ما قالت ريما في تعليقها …الناحية دي وتحقيق الحلم ده بالذات في ايد الرجل …<br />موضوعك جميل يا هدي …محبط حبتين اه …لكنه للاسف واقعي<br />اما بقي بالنسبة للواد اخويا …متقلقش يا محمد مش حاسيحلك وابعت لينك الصفحة دي لملكة اليمن السعيد طول ما انت كويس معايا ..<br />اقول زي محمد<br />مش حاسكت<br />لا للتمديد … لا للتوريث … نعم لتعديل الدستور المصري"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225601/http://20at.com/20at/lifestyle/3075.html"

