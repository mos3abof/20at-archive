text = "والله بجد الموضوع دمة خفيف اوى والتعليقات جذابة ودمها خفيف جدا بس الموضوع عامل زى هم يبكى وهم يضحك والله انا خايفة من الاقبال على خطوة الجواز دى عشان مضمنش اية اللى يحصل قدام وحقول اية ربنا الموفق"
archived = "2010-01-05"
