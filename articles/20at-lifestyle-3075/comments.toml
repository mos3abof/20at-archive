posted = "2007-04-16"
text = "أرسل هذا التعليق لمحمد السيد<br />يا محمد واضح انك مصري وعلشان أنا كمان مصريه وأعرف معنى حق المواطنة واجبى أنبهك أنك عايش في وهم كبييييييييير ولازم تفوق منه قبل ميفوقك بصفعة يكون ألمها كبيييييير قوي ، كن واقعى مفيش الكلام دة دلوقتى واذا كنت بتغنى فالنوع ده من المغنى بطل خلاص وبقى مستهلك ، وطالما انت بتأيد الدستور يبقى يا أخى خليك مع المو جة الجديدة ،"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225601/http://20at.com/20at/lifestyle/3075.html"

