subject = "طيب وبعدين"
author = "مونيكا"
posted = "2006-10-07"
text = "اتكلمنا وبنتكلم وهنفضل نتكلم كتير ايه الحل هتقولوا مظاهره منتوا عارفين ايه اللى بيحصل فى المظاهرات وياريت على اد الاعتداء والضرب حتى الموت وبيجيب فايده هانقاطع الحكومه يعنى ونسيبلهم البلد ماهو دا اللى هم عاوزينه..........ولا هانستغيث بامريكا تيجى تنقذنا عموما ربناا ما يورينا اليوم الل يجى فيه الننوس عين مامته وباباه وهو اعد على كرسى العزبه بتاع العيله واكيد دوام الحال من المحال واالظلم ليه اخر والصحوه جايه والمتتضررين بالملاين وربنا كان فى عون المظلوم"
