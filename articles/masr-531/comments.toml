[[comments]]
order = 9
subject = "ا"
author = "تقارير السفارة الأمريكية بالقاهرة تؤكد أن مصر مقبلة على مرحلة عدم استقرار سياسي بسبب الفساد وتعثر خطوات الإصلاح"
posted = "2006-06-24"
text = "ولا يتجاهل التقرير عنصرين باتا من سمة الحياة في مصر<br />العنصر الأول هو واقع الفساد الذي استشرى وبات ظاهرة أثرت على كل مناحي الحياة<br />والعنصر الثاني هو أن مصر مقدمة على مرحلة اللا استقرار السياسي نظرا إلى تعنت النظام في الإجراءات الإصلاحية التي يطالب بها الداخل والخارج.<br />في السياق ذاته ، لفت تقرير آخر للسفارة الأمريكية بالقاهرة يحمل عنوان \"مشاكل مناخ الاستثمار في مصر\"<br />أن الحكومات المصرية<br />من عاطف صدقي............... لأحمد نظيف<br />تتباهي بمقولة ترد في كل التقارير الدولية تقول إن الاقتصاد المصري يتمتع بإمكانيات هائلة للاستثمار وبمستقبل واعد ، ويكتفي المسئولون بترديد نصف المقولة ويتجاهلون تماما بقية النص ،<br />والذي ينطوي عادة على أحكام فاضحة<br />تقول إن موارد هذا الاقتصاد الواعد تخضع في كل المواقع التنفيذية لإدارة فاشيستة أو عابثة أو فاسدة<br />لا تتمتع بالموهبة أو الجدارة ولا ترتقي لمستوى الأمانة والمسئولية ،ولهذا تتعرض الموارد للإهدار وضياع الفرص .<br />وأكد التقرير أن قيمة الموارد المصرية تدهورت خلال العامين الماضيين بمعدلات غير مسبوقة وانهارت قيمة الأصول المالية والعقارية وخسرت نصف قيمتها على الأقل<br />لا إصلاح إلا بسقوط حسنى مبارك وزبانيته"
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912043202/http://masr.20at.com:80/article.php?sid=531"

