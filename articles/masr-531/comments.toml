[[comments]]
order = 14
subject = "هذا المجرم"
author = "مصرى مفقوع"
posted = "2006-10-17"
text = "هذا المجرم الذى امتطى ظهر المصريين فى غفله من الزمن ويريد ان يورث ابنه اللوطى مكانه وكانها عزبة ابوه هذا اللص قاطع الطريق عدو الله الذى تفوق على فرعون فى ظلمه اتمنى ان اراه يداس تحت الاقدام ويزف على حماره عرجاء تجوب انحاء مصر هو وهامانه حبيب العادلى وزبانيته وذيوله كمال الشاذلى وفتحى سرور ويقتص كل مظلوم منه مظلمته ثم يقتل على خازوق نكايه فى واذلالا لهذا الافاك الكذاب الخائن هل هذه امنيه بعيدة المنال والله لا لو اتحدنا روانيا الشيوعيه ليست افضل منا فعلت ذلك فى تشاوسيسكو كلابه المسماه وزارة الداخليه وهم جند فرعون نكن لهم كل ازدراء وبغض فهم شواذ فاشلين ثانويه عامه يعوضوا نقصهم باذلال الشعب المسكين وعندما ياتى يوم القصاص وهو اتى ان شاء الله سيكونوا عبرة لمن تسول له نفسه المريضه الظلموالخيانه"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105205403/http://masr.20at.com:80/article.php?sid=531&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
