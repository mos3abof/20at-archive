[[comments]]
order = 3
subject = ": تحالفوا.. لإنقاذ مصر"
author = "ملوك"
posted = "2006-06-20"
text = "ايها الشعب المصرى<br />استحلفك بلله ان تغضب مره من أجل شباب عمره الان25 عام خريج جامعات لايجدون فرصه للعمل الشريف بالتالى لازواج ويؤدى الى فسادالمجتمع هذا الفسادناتج من حكومه الملعون اللاخير فيه ولا بركه**<br />انقاذ مصر سهل باتحاد(80 مليون) مواطن بجميع فئاته ضدفرد واحدحاكم ظالم*<br />أنقذوا مايمكن أنقاذه من أيدى السفله المحتالين الافاقين السفاحين**<br />ياشعب مصر اتحدو لأنقاذ مصر الحبيبه فى الاتحاد قوه**<br />الحرامى بيسرق بيوتكم منتظرين أيه انها تخرب**<br />اللهم يارب العالمين انقذ شعب مصر الذى<br />لاحول له ولاقوه الا بك يا الله<br />اللهم انصر شعب مصر من الطاغيه مبارك الملعون<br />اللهم خلصنا من هذا الحاكم الظالم"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620143833/http://masr.20at.com:80/article.php?sid=531"

[[comments]]
order = 4
subject = "رساله الى نفسي"
author = "الاسد الخروف"
posted = "2006-06-20"
text = "ثوره يا خرفان ثوره يروى ان راعي غنم عثر على شبل صغير فرباه وسط القطيع وارضعته النعاج وعامله الراعي علي انه خروف وبث في اذنه اساطير ليخاف من كلاب الراعي وكلماغلبت عليه طبيعته الاسديه قام الراعي الجبان ومعه كل كلابه فضربوه وتكاثروا عليه طيله ربع قرن من الزمان حتي ازعن قهرا انه خروف وزات مرة صادف الراع الجبان وقطيعه مجموعه من الاسود وعندما زءروا فر الراعي وكلابه وخرفانه والاسد الخروف فلما رأت الاسود الاسد يجري تركوا القطيع ولحقوا به لماذا تجري فاجاب انا خروف فاجابوه لا انت اسد لاينقصك الاان تزأر عندما تعود لذلك الراعي الجبان وكلابه قف امامهم وازأر فلما عاد الي الراعي وكلابه زءر فإذا الراعي والكلاب الكل يجري في زعرانت ايها المصري ذاك الاسد الخروف ازءر مره واحده والكلاب سوف تجري مزعوره واسرع مما تتخيل لانها كلاب جبانه وانت اسد اما عن مركز الاهرام وهذا الخرف اصلاح سياسه بطاطس اقتصاد لمون كلهم اسود خرفان مع ان زءره واحده تكفي ولاكن الكل اجاب ماء ماء ماء سياسه بطاطس ليمون اصلاح لقد زءرت الاسود في صحراء موريتانياالقاحله والصومال الفقيره الكل رفض ان يكون خروف اما انت فقد استسهلت الحشيش والقش علي ضفتي النيل وقررت ان تموت خروف وان تنجب خرفان ليحكمهم ابن الراعي وابناء الكلاب مع ان زءرة واحده تكفي ليفر الراعي والكلاب معزره للهمزه على نبره والاخطاء اللغويه"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141412/http://masr.20at.com:80/article.php?sid=531"

[[comments]]
order = 5
subject = "يا كل مصر .. الثورة الآن"
author = "مصرية"
posted = "2006-06-21"
text = "لابد من قيام ثورة الآن فى مصر الثورة هى الحل الوحيدللخلاص من هذا الطاغية وعائلتة نحن لسنا عبيدا حتى نورث ومصر ليست عزبة من أملاكه حتى يورثها هذا الفاسد لأبنه ان لم ننقذ انفسنا وننقذ مصر من هذا المخطط فالله يعلم كم من سنوات أخرى سنعيشها تحت وطأة امبراطورية الفساد هذه..الكلام والتعبير عن رفض التوريث والفساد والظلم ليس بالحل الذى يتطلبه هذا الوضع المهين الذى نعيشه .. لابد من اقتلاعهم من جذورهم ونطهر أرض الوطن من فسادهم..اذا كان هناك آلآف الفسده من أعوان النظام يساندوه فهناك الملايين الذين يرفضوه ..لولا صمت هذه الملايين واستسلامها للأمر الواقع لما بقى هذا الطاغيه فى الحكم حتى الآن وتمادى فى التحكم بمصائرنا الى توريث الحكم لأبنه فلا يوجد سوى كلمته وهتافات الفسدة المتملقين المستفيدين من بقاءه ..ولا عزاء للمعترضين لم يعد بوسعنا المزيد من الصمت والسلبية فالساكت عن الحق شيطان أخرس ..لابد من الثورة والثورة الآن ..ليس من المعقول أن مصر بتاريخها وما أفرزته من زعماء وطننين قررت الخضوع لهذا الوضع ..ليس من المعقول ان مصر لا تملك رجالا قادرين على انقاذها من هذا الأحتلال هل امتد الفساد الى كل قادة الجيش المصرى ؟؟ هل امتد الفسادحتى طويت صفحات الشرف والكرامة المصرية؟؟..اذا كان هذا هو الوضع فلك الله يامصر الحبيبة .<br />ولا عزاء لكل المصريين<br />أخى جاوز الظامون المدى<br />فحق الجهاد وحق الفدى<br />يا كل أبناء مصر الثورة الآآآآآآآآآآن"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141412/http://masr.20at.com:80/article.php?sid=531"

[[comments]]
order = 6
subject = "نموت نموت ويحيا مبارك"
author = "مصرى عايز ينتقم"
posted = "2006-06-21"
text = ",واللة احنا شعب عايز الحرق تنقذو مصر من اية الرجل بقالة اكثر من ربع قرن بيحكم مصر ومخليها زى الفل .........<br />يعنى بيصرف على 25 الف معتقل داخل السجون من اكل وشرب ونوم وتدليك كل يوم<br />وكمان بيصرف على 100 الف عسكرى امن مركزى وحرس عشان يحمو المعتقلين من الجراسيم التى خارج المعتقل الى هو انتم وانا عارف انكم غيرانين منهم يعنى من المعتقلين لنكم شغلين وطالع عينكم والرتب ما بيكفيش تمن الاكل ولا الشرب ولا النور يعنى بتحقدو عليهم........<br />وكمان زايل الحواجز بينا وبين اخوتنا على الحدود ومخلينا اكننا بيت واحد ازى مخاى الصهينا يخجو ويطلعو على سيناء ويروحو ويجو اكنهم فى بيتهم واكثر يعنى راجل كريم ..........<br />وكمان مخليش الشباب هايص فى الجنس لا عندو كبت جنس ولا شى مش هقولك مخلية مكتفى بوحدة بس لا زى اعوز بلة من الجواز لا يعنى فاتح المواقع الجنسية على البحرى الى نفس يشوف يشوف مش زى المتخلفين فى السعودية الى حجبين هذة المواقع ومش هكلمك على الاقمار الصناعية وبذالك يكون هو حل مشاكل الجواز والكبيت الجنس.......<br />والتكملة فيما بعد لنى مشغول جدا<br />امضاء<br />مصرى عايز ينتقم"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141412/http://masr.20at.com:80/article.php?sid=531"

