[[comments]]
order = 0
subject = "البراء أشرف"
text = "محمد السيد.... ياه<br />صديق الثانوية العامة بمدرسة كرداسة الثانوية المشتركة...<br />غلطت مرة قدامه وقلت إن الشمس ثابتة في مكانها ...<br />قد يزعق ويشخط ...إزاي وإزاي أتجرأ وأقول إن الشمس موش بتلف....<br />لا طبعا بتلف ...(والله العظيم هو اللي قال كدة)<br />أختفي محمد شوية ورجع بعدها في امتحان الفرنساوي بتاع الثانوية العامة ...(!!!)<br />يصراحة كان ليه فضل عليا في الامتحان ده ..<br />أنا في الفرنساوي ميح والحمد لله ...وكان طبيعي إني احل كويس موش لأني شاطر لكن لأن الامتحان بيتكلم عن واحد صاحبي ....<br />وبعدها اختفي محمد السيد تاني ومشفتوش تاني غير علي صفحات عشرينات ...<br />علشان كدة لازم اقول المرة دي بجد ....شكرااااااااا<br />لعشرينات"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035424/http://www.20at.com:80/article.php?sid=483"

