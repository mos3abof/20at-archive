subject = "ماشاء الله"
text = "بجد يا جماعة، لولا ثقتى فى عشرينات، انا ما كنتش صدقت، ما شاااااااااااء الله، لكن ازاى لم يتم الاهتمام الكافي بهذا المخترع و هذه المخترعات، ما احنا كدة ، دايما فالحين فى تبويظ العقول و اهدار الطاقات، ربنا يستر على الربع اللى فاضل من عقلي"
archived = "2004-09-26"
