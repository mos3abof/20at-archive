author = "عادل"
posted = "2009-07-25"
text = "اولا التصريحات جاية من وزير اسمة وزير التنمية الادارية<br />يعنى اية وزارة اسمها وزارة التنمية الادارية واى ادارات بتنميها واية هى الواجبات الوظيفية لهذة الوزارة<br />التنمية الادارية اسم عائم وممكن نعمل وزارة اسمها وزارة شم الهواء او وزارة تنمية العصافير او وزارة النوايا الطيبة او وزارة الاخلاق الحميدة<br />اى كلام وبدنجان واهو كلام وبنعدية وبننفض دماغنا ونكبرة تمتمت زى وزارة مشيرة اللى قالوا عليها وزيرة الاسرة<br />اما حكاية العمل من البيوت<br />فهى مطبقة فى الصين وكوريا وماليزيا<br />يعنى بعض الاسر بتشترى ماكينة صغيرة لا تعمل ازعاج وبيحولوا البيت الى ورشة انتاج<br />يعنى بيجمعوا لعب اطفال ويحطوها فى كرتونتها ويسلموها لمنافذ البيع<br />وممكن احذية اطفال وصنادل وشرابات الرسم على السيراميك والقطع الصغيرة صناعات بلاستيكية صغيرة جدا زى زراير لوحة مفاتيح الكمبيوتر وغيرها وغيرها صناعات صغيرة كتيرة ممكن تنعمل من البيت<br />بس عايزة اشراف ومنافذ بيع وتوزيع والدولة هناك عاملة شركات تتكفل بهذا<br />انما واحد مترجم او واحد مدرس او بياع او ميكانيكى هيشتغل ازاى من البيت<br />فهمتى يا ست رضوى"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726221903/http://www.20at.com:80/masr/t7kyk/12742-2009-07-25-16-50-39.html"

