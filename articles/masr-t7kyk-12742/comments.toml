text = "دا أسلوب أهبل في العرض ميتعملش في مجلة حائط حتي ولا حتي في مجلة ميكي ما تقولولنا بالمرة هو مقاس جزمة كام في تفصيلة لواحدها .<br />ولا أنتوا عاوزين تفتكسوا بس الافتكاسة أوت وأبقوا أسألوا وشوفوا شكل الاستيل بوك اللي عاوزين تقدموه لينا بلا عبط بقي بلا كلام أهبل بطلوا بقي شغل قدييييييييييييي يييييييم فحت وطريقة عرض مقززة جدا"
