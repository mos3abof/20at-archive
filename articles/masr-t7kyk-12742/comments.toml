author = "مسلم و كلى فخر"
posted = "2009-07-25"
text = "ياااااااااااااا اااااه موضوع قديم أوى مع احترامى لجهد المحرره<br />أنا فاكر الكلام ده كان قالوا الوزير فى ندوه من حوالى سنتين فى ساقية الصاوى و انا كانت مبسوط اوى بالفكره و فضلت افكر فيها و فى ابعادها لكنها ما اتنفذتش لحد دلوقتى<br />الموضوع تنفيذه هاياخد وقت لان مش كل الفئات هاينفع معاها الكلام ده طبعا و كمان بعض الفئات هاتتطلب طبيعة شغلها وجود جهاز كمبيوتر فى البيت لانجاز العمل المطلوب<br />أما عن الايجابيات فهى كثيره<br />اولاها التقليل من الزحام فى الشوارع و توفير ثمن البنزبن و المواصلات و يمكن الأفطار لان الأفطار فى البيت أرخص بكثير من الأفطار فى المحلات أو مكان العمل<br />بيئيا هايقلل من التلوث لان عدد المركبات فى الشوارع هايقل<br />اجتماعيا الترابط الأسرى هايزيد لان الام هاتبقى اكثر قدره لمتابعة الأولاد و الزوج فبالتالى هايقل معدل الجريمه و التحرش الجنسى<br />أقتصاديا هايقل استهلاك الورق و التحول للنظام الكومبيوترى مما يعنى السرعه فى انجاز العمل و دورة راس المال هاتكون اسرع<br />و الأهم من كل ده ان الأيه القرانيه \"وقرن فى بيوتكن \" هاتبقى واقع<br />يارب لما ارجع مصر ان شاء الله فى القريب العاجل الكلام ده يبقى واقع"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726221903/http://www.20at.com:80/masr/t7kyk/12742-2009-07-25-16-50-39.html"

