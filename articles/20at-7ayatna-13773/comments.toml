author = "maya hendawee"
posted = "2009-10-20"
text = "الناس اللى دارسة سوفت وير هتفهم كلامى كويس<br />ان كل ضغطة من الموس فى موقع فاس بوك وكل صفحة بنقلبها دى فلوس داخلة للموقع<br />كل زيارة انت بتعملها للموقع دى فلوس داخلة للموقع<br />لان لازم الفاس بوك يزود عدد الزيارات اليومية اللى بتسجلها شركة ميكروسوفت ومن خلالها بيبقى زوار الموقع كتير وبالتالى يطلب اكتر واكتر فى ثمن الاعلانات<br />وده غير عقد المساحة اللى بتمنحهالو شركة ميروسوفت زيادة مع كل زائر جديد<br />يعنى لو اليوم ده قاطع الموقع مليون واحد من الناس اللى بتدخل كل يوم + الناس اللى من الوارد ان فى اى يوم ميدخلوش لاى ظروف<br />الموقع هيخسر نسبة كبيرة<br />وبالتالى هيبقى اليوم ده خسارة بالنسبالو<br />هيبحثو عن الاسباب<br />هيعرفو اننا بنطالب مسح الجروبات اللى بتسب المسلمين<br />وعلى فكرة فى اكتر من الف موقع اسلامى عاملين نفس الدعوة للمقاطعة<br />يعنى مش هنا بس ولا احنا لوحدنا اللى هنعمل"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022121927/http://www.20at.com:80/20at/7ayatna/13773--24-.html"

