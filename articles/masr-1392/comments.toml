[[comments]]
order = 0
subject = "ياقلبى يا كتاكت"
author = "ياقلبى ياكتاكت يا متقطع حتت وساكت"
posted = "2007-01-01"
text = "اخبار البدنجان اية النهاردة<br />هو العشا اية النهاردة يا عيسوى<br />سمك لبن تمر هندى<br />سلم لى على البزرميطة<br />اقفل الباب والا افتحة<br />الدنيا ربيع والجو بديع<br />فهمت حاجة لا ولا انا فاهم اى حاجة فى اى حاجة<br />سلم لى على المترو الجديد"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071212/http://masr.20at.com:80/article.php?sid=1392"

[[comments]]
order = 1
subject = "ليه مستغربيين"
author = "المواطن المطحون"
posted = "2007-01-01"
text = "بصراحة مش عارف اقول ايه؟؟؟؟؟؟<br />ده رئيس عميل يا جماعة.<br />هدفه الاول خدمة مصالح امريكا واسرائيل وطبعا المحافظين الجدد , والهدف الثاني له هو أفقار الشعب بكل الوسائل ليتسني له التحكم فيه والهائه في البحث عن لقمة العيش وطبعا فرص العمل التي لن يجدها الشعب ابدا اذا ظل الرئيس مبارك في الحكم.<br />والله المستعان"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071212/http://masr.20at.com:80/article.php?sid=1392"

