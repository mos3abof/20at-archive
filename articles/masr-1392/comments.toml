[[comments]]
order = 3
subject = "الله يرحمك يا إبن عروس"
author = "إبن بهيه"
posted = "2007-01-02"
text = "قال عمكم وتاج راسكم كلكم ((وأنا معاكم طبعا)) إبن عروس رحمه الله رحمة واسعه ..<br />لابد من يوم معلوم .:. ترتد فيه المظالم<br />أبيض على كل مظلوم .:. أسود على كل ظالم<br />ونهاية ذلك القذر الواطي العميل للماسونية القذره قد اقتربت .. فهذا البتاع القذر مهما عين حرس بالبتاع زي اللي سبقه برضك راح يموت مقتول قريبا جدا جدا بإذن الله .. إذا كان هو ولا الجرو الصغنن بتاع لجنة الوكوسات (إلهي يحرق لب أمه عليه قريبا.. إذا كانت طايقاه أصلا الرخم ده))<br />وبكره أفكركم .. لقد وصلنا إلى قاع القاع .. خلاص .. جبنا آخرنا .. ما عادش فيه سقوط تاني يعني .. والمنحنى لازم يبدأ في الصعود .. دي سنة الحياه يا خلق .. ومصر وصلت لقعر القعر من تحت خالص وما فيش أمام المنحنى غير الصعود وهتكون بداية هي التخلص من ذلك الخائن الواطي القذر مبارك وعصاباته اللصوص<br />ويا رب قرب البعيد والسنه الجايه ييجي العيد ومصر محرره ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071212/http://masr.20at.com:80/article.php?sid=1392"

