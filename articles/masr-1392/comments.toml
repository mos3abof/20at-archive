[[comments]]
order = 5
subject = "عيال"
author = "واحد"
posted = "2007-01-02"
text = "عبد الناصر مين يا عم ما هو السبب في كل اللي احنا فية بس المشكلة ان الناس ما بتحبش الا اللي بيجعجع حتى لو على الفاضي<br />و للذكر (النكسة , سرقة اموال الناس باسم التاميم و توذيعها كغنائم على الصحاب , تدمير التعليم بعمل مجانية سياسية لا تغني من جوع , عمل البلد معتقل كبير و كانت المعتقلات مش مكفية فعمل حتى المدارس معتقلات , اي حد يتكلم ورا الشمس )<br />يا طيب دة كانت الراجل بيخاف يتكلم مع مراتة لحسن تودية ورا الشمس بشكوة واحدة"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071212/http://masr.20at.com:80/article.php?sid=1392"

[[comments]]
order = 6
subject = "الشيعة سات"
author = "واحد مقهور"
posted = "2007-01-02"
text = "كان يوم اسود لما فكرنا نعمل النايل سات<br />كل القنوات علية تبع مقتضى الصدر وعبد العزيز الحكيم الواد ابو سنة دهب وكلها قنوات عنصرية شيعية متعصبة وكمان قناة المنار<br />فيا ايها المسئولين فى مصر سؤال برىء<br />هل النايل سات اسمة الحقيقى الشيعة سات<br />ارحمونا يرحمكم اللة"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071212/http://masr.20at.com:80/article.php?sid=1392"

[[comments]]
order = 7
subject = "ياريت بس نكون واقعيين"
author = "ديمقراطية إيه إللى بيتكلم عنها واحد أصلاً غير شرعى فى الحكم ولم يأتى بالإنتخابات لحكم مصر وكل الإنتخابات التى مرت على مصر فى عهده كانت مزورة وآخر إنتخابات كانت فضحته فيها سودة يعنى إللى إنتخبوه من الشعب 6 مليون من محموع الشعب 76 مليون ده بعد التزوير تخيلوا يعنى النتيجة دى لا تؤهله لحكم مصر ولكنه سايق الهبل ومصدق نفسه إنه رئيس بالإنتخاب"
posted = "2007-01-02"
text = "بعد الحالة إللى وصلت ليها مصر ما ينفعش أى أصلاحات عن طريق مبارك لازم إسقاط مبارك نهائى لو كنا عايزين نقول إصلاح ده واحد عنده 82 سنة يعنى كويس إنه بيعرف يروح الحمام لوحده<br />كل إللى عايزينة حكومة إنتقالية لمدة سنتين بإشراف قضائى شريف مثل السيد هشام البسطويسى وممدوح مكى وغيرهم ثم أطلاق الحريات وإغلاق المعتقلات وبعد كده إنتخابات حرة بإشراف قضائى كامل وبعدين دستور جديد يشرف عليه لجنة مستقلة منتدبة من قبل كل النقابات ومندوبين عن الشعب لوضعه<br />أعتقد هو ده الحل لكن نرضى إن يحكمنا واحد كل قواه العقلية غير صالحة لتقدمة فى السن فهذا لن يحقق لنا أى تطور أو نهوض أو نرتضى أن يحكمنا إبن مفتقد لكل الخبرات فهذا ضياع لنا إلى النهاية<br />الحل هو سقوط حكم مبارك والعائلة كلها<br />اللهم كما بليتنا بمبارك خلصنا منه اللهم آمين يارب"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071212/http://masr.20at.com:80/article.php?sid=1392"

