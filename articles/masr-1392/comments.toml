[[comments]]
order = 11
subject = "ديمقراطية الريس"
author = "برز الثعلبُ يوماً .... في شعار الواعِظينا"
posted = "2007-01-04"
text = "فمشى في الأرض يهدي ... ويَسُبُّ الماكرينا<br />ويقولُ: الحمدُ للهِ .... يا إلـــــهِ العالمينا<br />يا عباد الله, تُوبُوا .... فهو كهفُ التائبينا<br />وازهَدُوا في الطير؛ .... إن العيش عيش الزاهدينا<br />واطلبوا الديك يؤذن .... لصلاة الصبح فينا<br />فأتى الديكَ رسولٌ .... من إمام الناسكينا<br />عَرَضَ الأمر عليه .... وهو يرجو ان يلينا<br />فأجاب الديكُ: عُذراً .... يا أضل المهتدينا!<br />بلغِ الثعلبَ عني ... عن جدودي الصالحينا<br />عن ذوي التيجان ممن ... دخل البطن اللعينا<br />انهم قالوا وخيرُ القول ... قولُ العارفينا:<br />مخطئ من ظن يوماً .... أن للثعلب دينا<br />مخطئ من ظن يوماً .... أن للثعلب دينا<br />مخطئ من ظن يوماً .... أن للثعلب دينا"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071212/http://masr.20at.com:80/article.php?sid=1392"

[[comments]]
order = 12
subject = "دى ما بنفعش"
author = "لا داعى لأى تعديلات دستورية حالياً كل ما هو مطلوب إسقاط حكم مبارك وحكومة إنتقالية من القضاه الشرفاء أمثال المستشار هشام البسطويسى والمستشار ممدوح مكى لمدة سنتين تطلق فيها الحريات وتغلق المعتقلات وبعدين إنتخابات بإشراف قضائى حر وبدون تزوير وبعد كده دستور جديد"
posted = "2007-01-04"
text = "لكن أن تحدث تعديلات بنفس الوجوه الراكدة العفنة فهذا لا يسمى إلى إستهبال المصريين من حاكم غير شرعى مرمت بكرامة أم الدستور الأرض ولسه بيضحك على الشعب فاكرين لما قال مرة أنا يوم لما أحب أضحك على الشعب هااقول لكم ها اعدل الدستور ده راجل فاقد للشرعية وللأهلية بعد بلوغة الثانية والثمانين ولا يجب الإعتراف به رئيس بأى حال من الأحوال"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010803/http://masr.20at.com:80/article.php?sid=1392"

[[comments]]
order = 13
subject = "غير شرعى"
author = "مبارك مزور للإنتخابات يبقى غير شرعى"
posted = "2007-01-04"
text = "نتيجة الإنتخابات الرئاسية بعد التزوير كانت 6 مليون مزور إنتخب مبارك يعنى نتيجة لا تصلح للإعتراف به رئيس<br />أنا مش عايز مبارك ولا أى حد من عيلته يحكم مصر عايز رئيس تانى كفاية بقى تخلف عن الأمم مصر فيها ناس تصلح لحكم مصر بكفاءة وكرامة"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010803/http://masr.20at.com:80/article.php?sid=1392"
