[[comments]]
order = 9
subject = "احترموا رئيسكم"
author = "لماذا قلة الادب وعدم الحياء والتطاول ايها الاقزام على السيد الرئيس البطل صاحب الضربة الجوية ومعد لنصر اكتوبر العظيم ؟"
posted = "2007-01-03"
text = "ماذا تريدون ؟ عايزين الفوضى الخلاقة ؟<br />من يدفع لكم ؟ البلد مش ناقصة هم جاتكم الهم جيل منحوس<br />الرئيس البطل صاحب اطول فترة استقرار فى مصر بفضل وهمة ونشاط وزير الداخلية الهمام اللى عرف يوقف الفوضى هو ورجالتة الاشاوس<br />دوروا لنفسكم على شغلة بدل الكلام الفارغ اللى بتكتبوة"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071212/http://masr.20at.com:80/article.php?sid=1392"

