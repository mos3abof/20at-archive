subject = "لا يحب الخنزير الا الخنزير"
author = "محمد"
posted = "2006-08-05"
text = "اضن ان الخنزيراطهر من ساكن البيت الابيض لانه يعرف كيف يتصرف في البراري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153838/http://www.20at.com/article2.php?sid=1074"

