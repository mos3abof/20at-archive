text = "خراب الدين الايوبي ومعاويه وسيف الله المشلول<br />تقصد مين يا كابتن؟<br />أرجو ان لا تكون من المعاتيه اياهم و سيبنا نتعاطف مع حزبالله أحسن من المجادلة الطائفية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153838/http://www.20at.com/article2.php?sid=1074"

[[comments]]
order = 23
subject = "احسنتم يا عرب"
author = "معتصم بالله"
posted = "2006-07-27"
text = "عن جد اللي يقول انه المسلمين هادول ساذجين يبقي غير فاهم , فكما اري من تعليقات الجميف انهم فاهمون ماذا يحدث في منطقتهم بالضبط , و الله معكم يا عرب , و نصر الله قريب و نهاية بوش و ميركل و شارون و كل من عاونهم في الجحيم ان شاء الله و يوم الحساب بأذن الله هنذكر كل من عاون اليهود و قتلوا المسلمين و سنذلهم عندما يروننا ندخل الجنة و هد يشوون في النار."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153838/http://www.20at.com/article2.php?sid=1074"

[[comments]]
order = 24
subject = "الكلاب المسعورة"
author = "محمدالعيداني"
posted = "2006-07-30"
text = "الله اكبر الله اكبر الكلاب المسعورة تدعي الحرية وهية تأكل الخنازير<br />وعنوان الكلاب معروف هو النباح<br />واليوم بوش ينهش في جلود العرب الخونة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153838/http://www.20at.com/article2.php?sid=1074"

[[comments]]
order = 25
subject = "خنزير بن خنزير يأكل خنزير"
author = "أبو الهيثم"
posted = "2006-07-31"
text = "ليس هناك أبلغ من قول أن الخنزير ابن الخنزير يأكل لحم الخنزير<br />فهو يمتص دم العرب والمسلمين ويشرب نخب بترولهم ويدنس أراضيهم ويعربد فيها وينفس الفساد فيها وعلى الدنيا السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153838/http://www.20at.com/article2.php?sid=1074"

[[comments]]
order = 26
subject = "يوم لكم ويوم عليكم"
author = "حكيمة"
posted = "2006-07-31"
text = "يا خنزير قارة امريكا سياتي يوم ياكل فيه لحمك امام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153838/http://www.20at.com/article2.php?sid=1074"

[[comments]]
order = 27
subject = "يا ترى من الخنزير نحن ام هم؟؟؟"
author = "ابو محجن"
posted = "2006-07-31"
text = "الله الله يا رجاله عمالين نشتم فى بوش وكأن مشكلتنا بقت امريكيه يا حماعه محدش هينصر لبنان و هو محتل من حكومته يا ترى يا جماعه مين الخنازير اللى انتو عمالين تقولو عليهم اليهود و امريكا ولا حكام العرب ولا المعارضات الفاشله فى الدول العربيه ولا الشعوب مين الخنازير احنا ولا هما ؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153838/http://www.20at.com/article2.php?sid=1074"

[[comments]]
order = 28
subject = "بوش اكل اباه(اي خنزيراكل خنزير)"
author = "عبدالله"
posted = "2006-08-02"
text = "ايها العرب استيقظوامن نومكم فان لم تاكلوا بوش(الخنزير)اكلكم جميعا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153838/http://www.20at.com/article2.php?sid=1074"

[[comments]]
