[[comments]]
order = 13
subject = "اتقوا الله"
author = "الياقوتة احدى المصريات"
posted = "2006-11-20"
text = "السلام عليكم ورحمة الله وبركاته يا اخواتى الافاضل مهما كانت ظروف البلد السيئة ومهما كنا رفضين بقاء الرئيس في منصبه ولكننا لانقبل ابدا بإهانة الشعب المصري ولا بالخوض في اعراض الناس هل لكم دليل يا من قذفتم تلك السيدة هل لديكم دليل هل رأيتم بأعينكم هل لديكم شهود عدول؟؟؟؟؟؟ اى مكان في الدنيا فيه الكويس وفيه الوحش ومش معنى ان الراقصة دينا قامت بالرقص في الطرقات ان كل المصريات منحلات اخلاقيا وراقصات اتقوا الله فينا انسيتم توصية الرسول \" فإذا فتحتم مصر فاتقوا الله في اهلها فإن لكم فيها رحم \" معذرة اذا لم يكن نص الحديث هكذا ولكن هذا هو معناه وبالرغم مما حدث فما زال في شعب مصر واهلها الخير فقد قال الله عنها \" ادخلوا مصر ان شاء الله امنين\" والرجال المتمسكون بدينهم في مصر كثير والرجال الملتزمون اخلاقيا كثير ولكن دائما السئ هو الذى يظهر بوضوح وفي النهاية ارجو من كل من يقوم بالتعليق انه لا يندفع وراء انفعالة \" فليس الشديد بالصرعة ولكن الشديد من يملك نفسه عند الغضب\"( حديث ) ولا ننسى اننا كلنا مسلمون وكلنا عرب فإذا اسئنا الى البعض فقد اسئنا الى الكل<br />وصل اللهم وسلم وبارك على سيدنا محمد وعلى آله وصحبه وسلم"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

[[comments]]
order = 14
subject = "المشكلة"
author = "tarek_t80"
posted = "2006-11-21"
text = "يا جماعة سبب المشكلة واحدة راقصة ومنتج بتاع جردة علشان يزود ارادت الفيلم الساقط بتاعةخلها رقصت وفجرت غرايز الشباب حكمو الساقطة هى والمنتج بتاعة وكفاية عليها حسام ابو الفتوح اللة يخرب بتها شوة سمعة المصثرين فى الداخل والخارج واللةيلعنهم فى كل كتاب وتسلم مصر باولادها المخلصين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

[[comments]]
order = 15
subject = "ولاد قحبة"
author = "علي علي"
posted = "2006-11-22"
text = "كل العرب اللي علقوا على الموضوع بلهجة غير مصرية وأساءوا للمصريين أعتبرهم ولاد قحبة أمهاتهم بتتناك ،، يكفي أن مصر بها حرية يا ولاد الوسخة ،، يكفي أننا نتكلم بصوت عال في شوارعنا وصحفنا وإعلامنا ،، كل كلب منكم يلم لسانه ويلم أمه المتناكة وأخته القحبة ورئيسه الكلب"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

