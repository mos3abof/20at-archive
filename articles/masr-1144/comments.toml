[[comments]]
order = 6
subject = "إنهيار"
author = "واحد شيوعى"
posted = "2006-11-11"
text = "لقد إنهارت مصر تمام...آلاف المعتمرين المصريين تقطعت بهم السبل فى العقبة...إرتفاعجنونى فى الأسعار....فضائيات منقسمة الى قسمين:<br />إباحية مطلقة وتطرف....كبت هو أحد سمات المجتمع لكنه صار إستفزازيافى ظل تحول الجنس والمرأة الى سلعة فى قنوات العرى أو وعاء للرذيلة فى قنوات التطرف الدينى"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

[[comments]]
order = 7
subject = "التحرش"
author = "متحرش"
posted = "2006-11-11"
text = "اولا التحرش مش هلا بدا كان من قديم حتي كان في بيت الرئيس حسني مبارك قائد الدعاره والديوثيه لما كان ميقدرش علي ارضاء مراتو كان يجيب لها امريكي او اسرائيلي يتحرش فيها<br />حتي تصل الي ذروتها<br />ادن مافي جعب لما ايكون التحرش في الشوارع المصريه لان الناس علي دين ملوكها وبس"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

[[comments]]
order = 8
subject = "محاكمه قحبه"
author = "حمودي الاشنخ"
posted = "2006-11-11"
text = "ليش وعلي ايه يحاكموها لانها رقصت مكل المصريات رقاصات فرطرتا اما دي الي اسمها دينا دي محاكمتها مش لانها رقصت عاريه لان التعري والرقص قاعده عرفيه في مصر لكن بيحاكموها كونها مرقصت<br />قدام الاسرائيلين والامريكين مثل ما فعلن بنات الرئيس حسني مبار لما بعثهن للامريكين في العراق<br />والقضاوه للاسرائيلين مش للعرب او المسلمين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

[[comments]]
order = 9
subject = "كونوا قوامين بالديمضراطيه احسن من الديمقراطيه"
author = "حمبوص بن هارون الرشيد"
posted = "2006-11-11"
text = "الف طيط لحسني مبارك دي تهنئه علشان يحاكم وحده زي امو عملا لان امو كانت زمان ترقص في شارع الهرم وابوه كان بيلم النقطه وهوه كان طبال<br />واختو تعزف علي الاكردون وجدتوا كانت تنام بالاحضان يامصريين كفا مبس ذل وانتبهوا بس كو والله الي اختشوا ماتوا يخوانه انتوا ايه معنكمش دم مافيش ضمير الزاي تحكموا بنت زي دي كونها رقصت بالشارع وهي ارتكبت عمل شنيع واله ايه<br />لو كان عملها ده شنيع واله ايه امال الدعاره في قصر الجمهوريه اسمو ايه اسمو عمل رفيع علي اي حال كونوا قوامين بالقسط زي مابيقول عمونا شيخ الازهر لما كان يزور شارع الهرم في ليله الجمعه"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

