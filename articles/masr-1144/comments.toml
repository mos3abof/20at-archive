archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

[[comments]]
order = 11
subject = "الي العربي القذر"
author = "واحد من المصريين"
posted = "2006-11-12"
text = "أحترم نفسك يا كلب يا حيوان وانت بتتكلم علي أسيادك المصريين ومتقولش المصريات كلهم رقا صات وبعدين ياحمار مبارك مالهوش بنات ومش معني اننا بنكره مبارك اننا نتكلم عليه بالكذب والافتراء وبعد كده تسب الشعب كمان مصر أفضالها عليك يا جلف يا معفن لكن اذا أكرمت اللئيم تمردا"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

