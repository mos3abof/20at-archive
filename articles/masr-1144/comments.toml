[[comments]]
order = 0
subject = "محاكمه الراقصة دينا على سلالم النقابه"
author = "داليا"
posted = "2006-11-09"
text = "فعلا لازم الحكومه توضع حد للتحرش الجنسى اللى بيحصل فى الشوارع ولازم يتعاقب كل اللى بعملوا العمل الوحشى ده كانت عندنا واقعه فى العائله للتحرش الجنسى وللاسف مقدرناش نمسك اللى عمل العمل الاجرامى ده وللاسف كان فى رمضان وكان فى صبحا ربنا يحفظ كل البنات وكل السيدات ويهدى العاصى."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

[[comments]]
order = 1
subject = "الى الاخ اللي فوق المتحرش"
author = "ابومحسن"
posted = "2006-11-10"
text = "ليك عندي رد<br />فيه واحد مثلك تماما جاء الى النبي محمد صلى الله عليه وسلم قال له ابح لي الزنا فرد عليه النبي محمد رد مفحم.<br />قال له اترضاه لأمك قال لا<br />قال له اترضاه لاختك قال لا<br />وهكذا قد حل النبي محمد صلى الله عليه وسلم المشكلة لدى الشاب<br />وعلى كل شاب قبل ان يتحرش باي امرأ’ ان يتذكر امه واخته فورا وان ما يفعله بهؤلاء النسوة ممكن ان يحدث في امه او اخته في مكان آخر.<br />والنبي محمد صلى الله عليه وسلم وصف العلاج<br />يا معشر الشباب من استطاع منكم الباءة فليتزوج ومن لم يستطيع فعليه بالصيام فأنه له وجاء.<br />ويا اخي العزيز انا مقدر ظروفك وكلنا مقدرين ظروف الدولة الاقتصادية فحاول مبدئيا ان تجرب منهج النبي محمد عليه الصلاة والسلام في الصيام واذهب واعمل واكسب من عمل يدك واخلص في عملك عسى ان يرزقك الله بمال تتزوج به وما ذلك على الله بعزيز.<br />واريد ان اقول هنا كما ان احنا بلدنا مصر النبي محمد كانت بلده جزيرة العرب وعندما بعث النبي محمد صلى الله عليه وسلم في اهل جزيرة العرب كانوا اناس همج لا ماضي لهم ولا حاضر ولا مستقبل (يستلزم هنا قراءة حال الجزيرة العربية قبل الاسلام<br />ثم مكث معهم النبي محمد صلى الله عليه وسلم 23 سنه<br />يرجى قراءة السيرة النبوية<br />وبعد ان توفى الله النبي محمد صلى الله عليه وسلم تحول اهل الجزيرة الى شعب آخر وناس اخرين بعد ان التزموا بمنهج النبي ويرجى قراءة تاريخ الخلفاء واحوال الجزيرة العربية بعد وفاة النبي ففي خلال مائة عام كانوا يحكمون من اسبانيا الى الهند وكل هذه الشعوب دخلت في دين النبي الاسلام حبا في منهج النبي الرباني<br />وطبعا احنا المصريين اصبحنا لا حاضر لنا ولا مستقبل فياليت ان نعود الى منهج النبي محمد صلى الله عليه وسلم<br />قد اسمعت لو ناديت حيا"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

[[comments]]
order = 2
subject = "حسبنا الله و نعم الوكيل"
author = "مرشدة سياحية"
posted = "2006-11-10"
text = "كنت افتخر دائما و انا اسمع تعليقات السائحات عن مدي احساسهم الشديد بالامن في مصر و كيف انهم يرونها بلدا امنا خاصة للنساء والان شعرت بالخجل لاني مصرية<br />و اري ان السبب الاساسي بعد ضعف الدين و الاخلاق في النفوس هو تاكد المجرم انه لن يعاقب او ان العقاب بسيط و تافه فذادت الجرائم و المجرمين و الله يستر علينا امين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

[[comments]]
order = 3
subject = "العقاب"
author = "علاء فوزى المحامى"
posted = "2006-11-10"
text = "اذا اعتبرنا الرقص مهنه فلكل مهنه مكان تمارس فيه فمكان الرقص هو الكباريهات وبالتالى فممارسه الرقص فى الطريق العام يعتبر مخالفه لاصول مهنه الرقص واستهانه بحرمه الطريق العام واستهزاء بالقانون وبافراد الشعب ويتعين عقابها عقاب شديدحتى تعلم ان لهذه البلد اصحاب يدافعون عن حيائها وشرفها واعتبارها ويكون هناك ردع لها ولمثيلاتها فيما بعد"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

[[comments]]
order = 4
subject = "وليه يكون فيه رقص"
author = "فارس_fr"
posted = "2006-11-11"
text = "هل الست دينا وامثالهامن الساقطات من رموز مصر ولا حاجه ؟؟ ليه لازم يكون عندنا رقص وكباريهات وخمارات ... ليه لازم يكون فى مصر الرزائل دى كلها ؟؟؟ الله يلعن الشيطان اللى بيهيالكم الحق باطل والباطل حق ,,, الله يلعن جلالة الملك المباك وحاشيته<br />حسبي الله ونعم الوكيل"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015127/http://masr.20at.com:80/article.php?sid=1144"

