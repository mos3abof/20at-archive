text = "المستبصر الشاب الإماراتي أبو شهاب البلوشي<br />بسم الله الرحمن الرحيم<br />(إنما مثل أهل بيتي فيكم كمثل سفينة نوح من ركبها نجا ومن تخلف عنها غرق وهوى )<br />تعرفت عليه وأعجبني ولائه وإخلاصه لمذهبه الذي لم يرثه وإنما أختاره عن وعي وإراده وتصميم , ذالك هو الشاب الإماراتي الذي ينتمي لعائلة ربما عُرفت بالنصب والعداء لمذهب أهل البيت عليهم السلام . إنها عائلة (البلوشي) التي تنتشر في دول الخليج وبالأخص دولة الإمارات ودولة عمان …<br />إنه الشاب المؤمن أبو شهاب البلوشي الذي كتب قصته المليئة من المعاناة والجهد والاطلاع والحوارات والتي أستمرت لسنوات حتى جاء ذالك اليوم الذي ركب فيه سفينة محمد وآل محمد عليهم الصلاة والسلام ..<br />واليكم قصته<br />كافر عند أهلي لأني تشيعت : قصة استبصاري الكاملة<br />بسم الله و الصلاة والسلام على رسول الله و على آله الطاهرين المعصومين و اللعنة على أعدائهم أبد الآبدين ..<br />بماذا أبدء و من أين و كيف لي أن أعبر و القلب يعتصر حزناً على هذه الامتحان العسير … سأحاول أن أسرد لكم قصتي و أوصل لكم صوت مظلوم من شيعة آل محمد صلى الله عليه وآله وسلم ..<br />منذ أن فتحت عيني على الحياة وكلي شغف و فضول بمعرفة كل ما غاب عني وكأني أريد معرفة كل شيء خصوصاً كل ممنوع و مخالف لرأي الغالبية … و كأني السمكة التي دائماً تسبح عكس التيار ..<br />و كنت منذ صغري ( مواليد 198<br />مولعاً بالقراءة و اقتناء الكتب .. فكان أغلب مصروفي يذهب عليها .. ربما تستغرب فعلي على عكس الذين هم في عمري و عكس ميولهم و اهتماماتهم التي يحبون أن يقضونها في الذهاب إلى المراكز التجارية مع أصدقائهم أو الذهاب إلى السينما أو اقتناء الهواتف المحمولة واللعب .. الخ .. حيث ينفر أغلبهم من شيء أسمه كتاب ويعتبرونه مضيعة للوقت و شيئا مضجراً .. وقد كنت على عكسهم فكانت راحتي في خلوتي و صديقي الأقرب هو الكتاب .. و قد لا حضت أن لدي شبه إدمان حقيقة في اقتنائها ولا يزال لدي هذه الإدمان .. فتجدني أشتري عشرات الكتب و المجلدات فيسألونني لماذا تشتري كل هذه الكتب و تنهك نفسك في قراءتها ، فأجيب : أني لا أريد أن يمر علي يوم و لا أقرأ فيه شيئاً جديداً علي ..<br />و كانت نتيجة و محصلة هذه الهواية( التي تكاد أن تكون شبه هوية ! ) ثقافة كبيرة جداً أن يستوعبها من هو في سني .. فلم أعش طفولتي مثل غيري و على شاكلة المثل .. كبرت قبل وقتي .. و تمردت على سني و ظروفي و بيئتي التي حقيقتاً لم تشجعني إطلاقاً إن لم تكن محبطة من معنوياتي في أغلب الأحيان ..<br />ومن العلوم التي كنت مولعاً و عاشقاً لها هو علم التاريخ و العلوم الدينية و الروحانية بشكل عام ..<br />وكأي شخص يترعرع في دولة الإمارات الحبيبة .. وخصوصاً في مدينة الشارقة .. فقد نشأة في بيئة بمدارسها و مساجدها و إعلامها و رجال دينها بتأثير الوهابية الطاغي على أغلب المؤسسات و التوجه العام في هذه الإمارة .. فنشأة و أنا أقدس شخصيات هذه الفكر من ابن تيمية و ابن القيم و العثيمين و عبد الله بن باز .. الخ<br />وأسمع في خطب الجمعة قال ابن القيم و ابن تيمية و فلان وفلان أكثر مما قال رسول الله (صلى الله عليه وآله وسلم) .. وعلى هذا وكما تتوقع فقد توجهت مشاربي الثقافية في هذا المنحى .. فكنت ممن يعتقدون بمعتقدهم ويسيرون على نهجهم .. لدرجة أني ألفت وكتبت مقالات و بحوث كثيرة في مثالب تاريخ الشيعة ( والعياذ بالله ) بل و وصلت إلى مرحلة شديدة من التعصب فكنت أكفر أئمتهم دون عامتهم (أستغفرك ربي وأتوب إليك ) ..<br />لقد قرأت في المقدمة عن فضولي و حبي للمعرفة .. فهذا ما دفعني إلى قراءة الفكر المقابل للوهابية وهو فكر أهل السنة والجماعة الأشعرية و الماتريدية و الصوفية .. فكنت أدرس و أقارن بين اختلافاتهم في مسائل فرقت فيما بينهم بخصوص منهجية الفريقين و عقائدهم ، فكانت بدايتي مع سالك في إحدى الطرق الصوفية وقد تعرفت عليه بالصدفة و رب صدفة خير من ألف ميعاد ، و يوم بعد يوم قد توطدت علاقتنا و طالت نقاشاتنا و حواراتنا في المسائل المختلف عليها بين الفريقين مثل مشروعية زيارة المصطفى صلى الله عليه وآله وسلم و التوسل و التجسيم و الرؤية و الاستواء و إلى ما هنالك من المسائل المتعارف عليها ، و من الكتب التي أفادتني في هذا الخصوص كتاب :<br />(( مفاهيم يجب أن تصحح )) للدكتور السيد محمد بن علوي المالكي الحسني .<br />و كتاب : ((شواهد الحق في الاستغاثة بسيد الخلق صلى الله عليه وآله وصحبه وسلم )) للقاضي الشيخ يوسف بن إسماعيل النبهاني .<br />و كتب الأمام الكوثري في الرد على الوهابية ، و الكثير غيرها من الكتب في الرد على هذه الفرقة المنحرفة ، و بعدما تعمقت أكثر في مذهب أهل السنة بعد إنهاك نفسي في القراءة و الحوار والسؤال تبين لي زيف هذا المذهب ( الخارجي ) وبطلانه وضلاله .. و هكذا بعد اقتناع تام فقد انتقلت من مذهب الوهابية إلى مذهب أهل السنة على المذهب الأشعري في الأصول و الحنفي في الفروع و الطريقة القادرية في التصوف .. وهذه كله بالطبع من دون علم أهل بيتي و عائلتي غير أختي التي انتقلت معي ..<br />و يوم بعد يوم تبدلت المنهجية التي كنت أتبعها و الأفكار التي كنت أحملها ، و أنا أدرس في كتب أهل السنة الفقه و الحديث و العقائد على يد الشيخ الذي كنت مريد عنده أكثر فأكثر .. فخف عندي حنقي على الشيعة بعدما تغير عندي كثير من المفاهيم التي لدي عنهم وعن معتقداتهم بخصوص التوسل والاستغاثة و الزيارة و التنزيه وإلى ما هنالك من المسائل المتفق عليها بين الأشعرية و الشيعة.. فغيرت وجهة نظري في تكفيرهم و رأيتهم مسلمون غير أنه عندهم بعض الشبهات التي لم يتبين لهم حقيقتها .. وانعكست لدي الرؤية حيث تيقنت أن بدع الوهابية مخرجة من الملة المحمدية .. و على هذه فقد تركت صلاة الجماعة في مسجد الحي لأنه عند أهل السنة في الفقه الحنفي لا يجوز الصلاة خلف صاحب بدعة مكفرة .. فانقطعت عن المسجد حيث إمام المسجد يعتقد بذلك و يرى أن لا نصيب للصوفية من الإسلام والعياذ بالله من هكذا فكر .. إلا بعض الأحيان التي أجبر فيها تقية مرضاة لوالدي في الذهاب معه إلى صلاة الجمعة و بعض الصلوات اليومية .. و في يوم من الأيام كنت أقرأ في كتاب الإمام الكوثري (1296هـ - 1371هـ ) لتلميذه الشيخ أحمد خيري ، في سيرة حياته و قد كنت من أشد المعجبين بشخصه حيث أنه قد كان شديداً على الوهابية في الرد عليهم و ترساً لأهل السنة ضد مناوئيهم .. وقد استوقفني الكاتب في موضع يقول فيه :<br />(( وكنت – مع إجلالي التام للأستاذ – أخالفه في أشياء – وكان رضي الله عنه لا يغضب من ذلك ولا تبرأ مني لأنه كان يحب أن يعتقد الإنسان ما يقتنع به ما دام الأمر لا يمس أصول الإسلام المعروفة ، ولا بأس بأن أذكر هنا بعض ما خالفت فيه شيخي الجليل رضي الله عنه و أرضاه<br />فأولا مخالفتي للمذهب الحنفي ومنها :<br />1- اعتقادي نجاة أبي طالب رضي الله عنه ولي في ذلك مؤلف خاص سهل الله تعالى إتمامه.<br />2- اعتقادي أفضلية سيدنا علي عليه السلام على سيدنا أبي بكر رضي الله عنه ولى في ذلك ( القول الجلي ) وقد سبقني بعض الحنفية إلى ذلك . وحسبك قوله : و يجوز إمامة المفضول مع وجود الفاضل إلى آخر ذلك البحث المشهور . )) صـ55 الإمام الكوثري وكيل المشيخة العثمانية سابقاً .<br />فاستوقفني هذه النص كثيراً و أخذت أبحث في هذه الشأن مع علماء و طلبة أهل السنة غير أني لم أجد لديهم الجواب الذي أنشده .. لأن هذه القاعدة (تجويز إمامة المفضول مع وجود الفاضل ) تخالف العقل السليم ، وهم لا يأخذون بالعقل ويكتفون بالنقل الأعمى ..<br />و في زيارة لي إلى معرض الكتاب بالشارقة ( عام 2005) .. تذكرت أسم كتاب قد سمعت به في بعض المناظرات بين السنة والشيعة .. وهو كتاب ( المراجعات ) لصاحبه العلامة الإمام شرف الدين العاملي الموسوي .. فاشتريت الكتاب و أنا مسرور لتذكري الكتاب و اغتنام هذه الفرصة .. و وقع ناظري على كتاب آخر أسمه ( عقيدة الإمامية في عدالة الصحابة و التقية ) للشيخ الفاضل جعفر السبحاني ..و كتاب آخر في الأدعية أسمه : (( مهج الدعوات )) للسيد إبن طاووس ، و كان لدي كتاب : (( الصحيفة السجادية )) للأمام زين العابدين عليه السلام و الجزء الأول و الثاني من كتاب الكافي قد أخذتهم في زيارة لي لإيران عام 2004 مـ ، و غيرها من الكتب الشيعية ، فبدأت بالأول و انهمكت في قراءته بعدما أعجبني أسلوب المحاورين .. و فصل بعد فصل وصفحة بعد صفحة تفتحت لدي مدارك و أشياء لم أكن على علم بها سابقاً على الإطلاق .. وأقول لنفسي أين أنتي عن هذه الكتاب .. ولا أبالغ إذا قلت أن الكتاب قد غير كثير من مفاهيمي و نظرتي للتاريخ … حقيقة كانت صدمة … كانت صفعة .. كانت استيقاظاً بعد سبات طويل .. قد علمت شيئاً و غابت عنك أشياءُ .. و بعد قراءة الكتاب الثاني قد زاد هذه الوعي … فكنت في حالة بين الإنكار و التسليم بالحق … والصراع بين الحق والباطل في داخلي .. فأخذت بمحاورة شيخي عن الشيعة ، فكان يقول لي بأنه عاشرهم و هو أعلم بهم فقد درس معهم في المدرسة وأخذ عن مشايخهم بعض الأذكار الروحانية ، فكان يقول لي بأنه ليس لديهم شيء يعتبر وهم أهل كذب و نفاق و أخذ يهول و يهول ويصورهم بأبشع الصور لدرجة أنه كان يقول لي بأنه كان يراهم بعد حصول صفاء روحاني عنده على أشكال حيوانات !!<br />فقلت له يا شيخ هل أنت معصوم ؟<br />قال بالطبع لا<br />فقلت له هل هنالك أمكانية بأن يكون الشيطان هو من يوهمك بهذه الذي تراه عليهم ؟<br />قال ممكن<br />قلت : طيب وماذا تقول في أصحاب المذاهب و الديانات الأخرى الذين يحصلون على خوارق هل هذا يدل على صدق دينهم ؟<br />فقال لا يدل لأنه إمكانية حصولها ممكن أن تكون للصالح كرامة و فتنة أو استدراج من الشيطان.<br />فقلت : إن قولك هذا على الشيعة لا يثبت بانتفاء العصمة عنك .<br />و هنالك كثير من الحوارات و المناقشات التي كانت تدور بيني وبينه و كنت أجله رغم ذلك .<br />و لكي يأخذ القارئ فكرة أشمل عن صورة استبصاري أمده بنماذج أكثر عن الحوارات التي كانت تدور بيني وبينه ، ومنها :<br />في يوم قد قلت له لماذا تقرأ في كتب الشيعة الدعائية و الروحانية وهم أهل بدعة و نفاق ؟<br />فقال : إن الأدعية التي يمتلكونها لها قوة روحانية عالية .<br />فقلت : فكيف يستجيب الله ممن ينسبون هذه الأدعية إلى أئمة أهل البيت كذباً ؟<br />فقال : ربما تكون صحيحة عن أئمة أهل البيت .<br />فقلت : تحتوي هذه الأدعية و التوسلات على كثير مما يخالف عقيدتنا أهل السنة ، و بإقرارك بنسبتها إلى أهل البيت تكون قد أقررت بأن أئمة أهل البيت كانوا شيعة وليسوا سنة كما نقول ؟<br />فقال : أنا أقرائها لفوائدها الروحانية ولا يهم من كتبها المهم قارئها !<br />و هكذا كان دائم التهرب من الحوار وبارع جداً في تغيير الموضوع و تضييع الحوار ، و في هذه الأثناء كنت أقرأ في كتب الشيعة و المستبصرين كل يوم من الصباح حتى المساء ، وكنت أحاوره في كل ما أقرأ ومما حاورته فيه مسألة الولاء و البراء ، ففي يوم من الايام قلت له : إذا كنت تحب إنسان أليس من المفترض أن تحب أحبائه ؟<br />قال : نعم<br />قلت : و أن تكره أعدائه ؟<br />قال : نعم<br />قلت : هل يمكن أن يقول إنسان بأني أحب الله تعالى وأوليائه و أحب الشيطان و أوليائه ؟<br />قال : هذه جمع بين النقيضين و اعتقاده باطل و مخرج من الدين .<br />قلت : طيب فكيف بنا أهل السنة نتولى أهل البيت و كذلك نتولى أعدائهم .<br />قال : من تقصد بالأعداء ؟<br />قلت : معاوية وبني أمية .<br />قال : لا يجوز التعرض للصحابة فقد رضي عنهم رسول الله صلى الله عليه وسلم قبل مغادرته للدنيا .<br />قلت : هذا مما لا دليل عليه بل ما يناقضه في كونه صلى الله عليه وآله قد أعلمنا بأن فيهم من سيرتد بنص أحاديث كثيرة وردت في البخاري ومسلم قد أعلمتك عنها ، فكيف توافق بين ما ورد عنه صلى الله عليه وآله سلم ، و قوله تعالى في المنافقين : (( لا تعلمهم نحن نعلمهم )) ؟<br />قال : إن كل ما عمله الصحابة و ما شجر بينهم قد علمه الله و كتبه عليهم ، وقال لهم صلى الله عليه وآله وما سيجري لهم و قد أجبروا على ذلك فلا خيار لهم !<br />قلت : إن قولك هذا مثل قول إبن زياد الملعون حين قال للعقيلة زينب عليها السلام : (( إن الله قد قتلكم )) ، فرد الفعل لله و هذا أكفر الكفر ، وإلا لما خلق الله الجنة والنار ؟<br />قال : ليحاسبنا على أعمالنا<br />قلت : و هل يجوز على الله الظلم وقد حرمه على نفسه وعباده بنص حديث قدسي صحيح يرويه أصحاب الصحاح والسنن ، فكيف يعاقبنا على شيء قد كتبه علينا ولا حول ولا اختيار لنا بفعله !<br />فغير الموضوع كالعادة ، وكانت هذه سنته في الحوار ، و يوم بعد يوم في دراستي للمذهب الشيعي من خلال كتبهم لا ما كتبه خصومهم بعدما تبين أن أكثر مما قرأته عنهم لا أصل له ، و قراءتي للكتب التي ترد عليهم مثل كتاب : (( الصواعق المحرقة في الرد على أهل البدع والزندقة )) و (( تطهير الجنان و اللسان عن الخطوره و التفوه بثلب سيدنا معاوية بن أبي سفيان )) ، و (( الأساليب البديعة في فضل الصحابة و أقناع الشيعة )) للشيخ النبهاني ، و غيرها من كتب الوهابية التي تقدح في التشيع , و تشنع فيه كذباً وبهتناً وزوراً ، و الكتب التي كتبها بعض من ينتسب للتشيع مثل كتب موسى الموسوي المنتشرة في المكتبات بأسعار زهيدة للتشجيع على انتشارها مثل كتاب : (( الشيعة والتصحيح )) و كتاب<br />( يا شيعة العالم استيقظوا )) ، فكانت مثل هذه الكتب هي من أخرني في استبصاري و أطال المدة في سبيل دراسة أدلة الفريقين و مقارنتها ، و يوم بعد يوم ثبت بعد الدراسة والتحقيق عندي أن أدلة الشيعة أقوى و أصح وأصمد وأقرب للعقل من أدلة خصومهم ، و أكثر ما أثر في استبصاري إهمال أهل السنة لأهل البيت و ترك فقههم ، و مظلوميات أهل البيت عليهم السلام و موقف أهل السنة منها ، وكانت الزهراء عليها السلام من أكثر ما أحز في قلبي و أثر بي ، فسحقاً لأمة خطأتها وهي سيدة نساء العالمين من الأولين و الآخرين ، و كذبت شهادة أبنيها سيدا شباب أهل الجنة ، و هل إلا كل أهل الجنة من الشباب بنص الأحاديث عن الشيخين ، فهم أسياد جميع من في الجنة دون الأنبياء عليهم السلام ، و شهادة سيدهم و سيد العترة ، فلا بد أن يكون الحق مع أحد الطرفين فكان لابد لي من اختيار من أوصاني رسول الله صلى الله عليه وآله وسلم بأتباعهم .. و في تلك الأيام التي أفكر فيها بمظلومية الزهراء عليها السلام ، رأيت في منام نفسي أمام حسينية في منطقة أعرفها وهذه المنطقة ليس فيها حسينية سوى مسجد صغير للشيعة ، و قد كتب على باب الحسينية : (( فاطمة بضعة مني فمن أغضبها فقد أغضبني و من أغضبني فقد أغضب الله )) ، و استشهدت الصديقة و هي غاضبة عليهم ، وأرادت أن تسجل مظلوميتها للتاريخ فقالت لأمير المؤمنين : (( أدفني ليلا )) و لا تعلمهم بموضع دفني .<br />و أقرأ أكثر و أكثر في ما بدلوه من الدين ، و ما محقوه و ما محوه و حرفوه ، و ما خالفوا فيه أمر المصطفى روحي فداه صلى الله عليه وآله وهو الذي قال عنه الله تعالى : (( لا ينطق عن الهوى إن هو إلا وحي يوحى )) .<br />و رأيت في منام آخر بعده بأيام نفسي وقد لبست ثوب أخضر اللون و عمامة خضراء .<br />فلم أستطع أن أحجب الشمس بكفي و إذ الحق يفرض نفسه علي .. لا أستطيع أن أتجاهله أو أتعامى عنه … فأخذة في قراءة المواضيع والبحوث وكتب المستبصرين و غيرها في المواقع الشيعية .. فكنت كل يوم من الصباح حتى المساء وأنا منهمك في القراءة و كل يوم أفاجأ بما غاب عني أكثر .. و أقتنع أكثر بأن هذا هو الإسلام الحقيقي … الإسلام الذي حجبه و زوره الإعلام على مدى العصور الأموية فالعباسية و حتى وقتنا الحاضر … و تيقنت أنا و أختي بهذه الحقيقة .. و أعلنا لبعضنا تحولنا لمذهب أهل البيت عليهم السلام …<br />فرأيت في تلك الليلة في منام نفسي في مدرسة الإمام المجتبى جالس في قاعة درس كبيرة واسعة ملأت علماء معممين بعمائم سوداء و يدرسهم شيخ ذو هيبة و وقار لم أعرفه .<br />و في اليوم التالي ذهبت إلى مسجد الزهراء عليها السلام في الشارقة و التقيت بأحد العلماء الأفاضل و بلقائه قد تم يقيني التام بما أنا معتقد به .. وصليت معهم صلاة المغرب والعشاء .. و والله الذي لا إله إلا هو أحسست كأني مولود من جديد .. كأني أسلم .. كأني هذه أول صلاة لي .. وقد كادت أن تدمع عيناي .. وأنا أحس بهذه الروحانية العظيمة بهذه المكان .. وعلم شيخي بتشيعي فحاول معي أن يردني و حاولت معه أن أحاوره فاختلفنا فكان الفراق ..<br />وقد تلتها زيارة أخرى أخذت فيها كتب أحتاجها من المكتبة المجاورة للمسجد و أيضا بعض أقراص التربة الحسينية على ساكنها أفضل الصلاة والتسليم .. لي ولأختي .. و بعدما رجعت إلى البيت .. صليت قيام الليل و بعد الانتهاء من أورادي أخذت في قراءة زيارة عاشوراء و قلبي يعتصر حزنا وكمداً و عيناي تذرف دموعاً على مظلوميات أهل البيت عليهم السلام … وهكذا كانت أحوالي … حتى جاء يوم و رآني فيه صدفة غير محسوبة أخي أسجد على التربة الحسينية .. فأخبر أهلي بأني قد تشيعت … فقامت الطامة علي .. خصوصا وهم لاحظوا علي أني أتابع القنوات الشيعية مثل الأنوار والكوثر وغيرها .. فأخذوا في أتهامي بالردة , وسب الشيعة و تكفيرهم وقول أشياء أنزه لسان القارئ من قراءتها .. لا ألومهم حقيقتاً .. ولكنهم شديدي التعصب ضد الشيعة .. و قد أخذوا مني التربة وتخلصوا منها و حذروني إن هم رأوني عدت لذلك و هددوني بالتبرء مني و طردي من البيت … و أنا منذ ذلك اليوم و أمارس التقية معهم .. و أمارس شعائر ديني في غرفتي وأقفل الباب على نفسي .. خوفاً من أن أحد يراني أصلي أو أشاهد القنوات الشيعية أو أقرأ دعاء وغيره .. ولا أستطيع الذهاب للمسجد حيث أني لا أقود السيارة و لا هم يسجلوني للتعلم … و الذهاب يكلفني كثيراً لبعد المسافة.. غير أني أحاول قدر المستطاع .. ، و هذا هي أحوالي منذ استبصاري أنا و أختي ، و أحمد الله و أشكره أن أنعم علي بالهداية والنور و التمسك بولاية العترة الطاهرة و النجاة من الضلال و ركوب سفينة الهدى ..<br />اللهم فرج عن آل محمد و شيعتهم وصبرهم وكن في عونهم بحق فاطمة و أبيها وبعلها وبنيها … آمين"
