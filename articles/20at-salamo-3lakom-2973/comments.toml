text = "القاهرة -رويترز- إسلام أون لاين.نت<br />أبو الغيط اعتبر تصريحات نجاد تفتح بابا للتسلح النووي<br />وجهت مصر انتقادا إلى إيران لقولها إنها \"دولة نووية\" محذرة من أن ذلك قد يدفع إلى سباق تسلح نووي \"محموم\" في منطقة الشرق الأوسط.<br />وفي بيان رسمي اليوم الإثنين قال وزير الخارجية المصري أحمد أبو الغيط إنه طالع \"ببالغ الاهتمام\" تصريحات الرئيس الإيراني محمود أحمدي نجاد التي قال فيها إن الدول الغربية مدعوة لقبول إيران \"كدولة نووية\". وأضاف: \"إن استحواذ بعض الدول على التكنولوجيا النووية السلمية لا يعني بأي حال أن تدعي أنها دولة نووية إذ إن الدول النووية هي التي لها قدرات عسكرية\".<br />وتابع: \"إن التحدث عن القدرات النووية في الشرق الأوسط يمثل المزيد من التعقيد للوضع الراهن في المنطقة ويدفع دولها إلى الد[ *** ] في سباق محموم للتسلح النووي وغيره، وهو أمر مرفوض لما يترتب عليه من إخلال بالسلم والأمن الدولي والإقليمي\"."
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814161157/http://www.20at.com:80/20at/salamo-3lakom/2973.html"

