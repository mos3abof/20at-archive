[[comments]]
order = 28
subject = ""
author = "شيعي جريء ناطق بالحق"
posted = "2009-05-29"
text = "الى كل ناصبي وكل سني وهابي كافر كلب ابن كلب جاي من الزنا من اتباع السعوديين ومن اتباع اسامة بن لادن والقاعدة والأردن<br />اولاً : احنا الشيعة منذ الأف السنين حتى قبل الخلق في عالم الذر نحن مطهرون ونحن مختارون ومميزون عن باقي شعوب العالم<br />ثانياً : كل كلب راح يفتح فمه الي زي البالوعه ويقول ان الشيعة تقول ان جبرائيل خان الأمانة راح اجي العن ابوه لأن احنا الشيعة ما نقول هذا الكلام . هذا الكفارالي يلبسون شخصية الشيعي المسلم<br />ثالثاً : احنا مش اتباع الأيرانيين ولا اتباع احد غير النبي وال البيت ولا حتى لأبن الحطاب ولا لأبو بكر ولا لعثمان المعفن (( عفان ))<br />رابعاً : الشيعة من جنسيات مختلفة وما حد مسيطر علينا لأن العقل الشيعي اكثر العقول ادراكاً للحقيقة وايماناً بالله<br />خامساً : السنة تتكلمون عن المتعة للشيعة وانتم في الخليج لديكم زواج المسيار في كل ساعة وانتم جايين من المسيار والزنا<br />سادساً :هل تعرفون ان ام صدام كان لديها سبع ازواج والله اعلم بأن صدام تكون من والد<br />سابعاً : صدام اكبر نذل عرفه التاريخ واعماله تدل على هذا الشي حتى اكبر من فرعون والنمرود<br />يلعن ابو اي واحد يكفر اي شيعي"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814161157/http://www.20at.com:80/20at/salamo-3lakom/2973.html"
