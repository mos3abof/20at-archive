text = "من لا يصدق ما يفعله الصفويون الذين ارتدوا لباس التشيع فليأت الى العراق، فأهل السنة يُذبّحون ، والمساجد بيوت الله تُهدّم، والقرآن كلام الله يُحرق بأيدي جيش المهدي انصار مقتدى الصدر الذي يٌعد رمزاً شيعياً ن وبأيدي فيلق بدر الذي صنعته الدولة الفارسية ايران ويقوده احد ابرز رموز الشيعة عبد العزيز الطبطبائي الحكيم،… كل ذلك يحدث باسم اهل البيت؟؟؟؟؟؟؟؟؟؟ ؟؟؟؟؟"
