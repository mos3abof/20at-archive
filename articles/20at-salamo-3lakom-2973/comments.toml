subject = ""
author = "امير جابر –هولندا"
posted = "1999-11-30"
text = "بعد قيام الثورة الاسلامية في ايران عام 1979 وسقوط حليف امريكا واسرائيل و السعودية شاه ايران وجدت المخابرات الامريكية والموساد الاسرائيلي والمخابرات السعودية والصدامية ان افضل وسيلة لمحاصرة تلك الثورة وتحييد الاعجاب الاسلامي بها هو باثارة النعرات الطائفية، وهكذا بدات المطابع تنشر الكتب الصفراء وبكل اللغات وتنشرها على طول الارض وعرضها، واسست لذلك المعاهد والمؤسسات في كل من الدول الخليجية وتل ابيب ولندن وواشنطن و التي خرجت الالاف من الشيوخ والكتاب، وكما قال بذلك الدكتور مصطفى محمود في الاهرام وغيره الكثير من الكتاب المصريين والفلسطينيين الذين اكدوا ذلك وقدموا الادلة الموثقة عليه، وعندما سقط صدام بعد ضربات بن لادن في 11سبتمبر واتضاح الدور السلفي الوهابي قامت الحكومة السعودية بانشاء المئات بل الالاف من المكتبات والمواقع الالكترونية وبعض الصحف الواسعة الانتشار والمحطات التلفزيونية والاذعية خارج السعودية وكانت هذه الوسائل بعضها يتخذ الاسلوب السلفي والاخر يتخذ الاسلوب اللبرالي ، وانا هنا ساتحدث فقط عن عينة من تلك المواقع ،ومنها محطة العربية وموقعها الالكتروني وصحيفة الشرق الاوسط والحياة وموقع ايلاف ومفكرة الاسلام ، وهذه المواقع الستة هي الاشهر وهي معروفة التمويل والكادر والموضوع وقد انشات هذه الوسائل الاعلامية في الخارج حتى لاتتحمل السعودية مسؤليتها سواء فيما تنشره بخصوص علاقات السعودية الخارجية او على المستوى الداخلي وخاصة فيما يتعلق باللبرالية التي يشكو منها التيار السلفي المسيطر ، وكذلك محاولة التنصل عن السلفية التكفيرية وما تسببت فيه من ارهاب عرف العالم من هم اصحابه وعلى من يعتمد تمويلا وفكرا.<br />وبعد المواجهة الحادة بين امريكا واسرائيل من ناحية وبين ايران من ناحية اخرى حول مفاعلها النووي واتهامها بتعطيل عملية السلام من خلال دعمها لحزب الله ولحماس، ثم جاءت حرب حزب الله واسرائيل الاخيرة وانتصار حزب الله ذلك الانتصار الذي اسقط فيه مشروع ولادة الشرق الاوسط الجديد واحراجه لامريكا واسرائيل ذلك الاحراج الذي كشف عن حقيقة الحلف الامريكي الاسرائيلي وجبنه، وقوى من معنويات الشعوب العربية في وجه الغطرسة والظلم الامريكي الاسرائيلي، حتى وجدتها السعودية فرصتها لتجعل الشيعة هم مصدر الخطر وليس الوهابية ولتقنع الغرب ان مصالحه تكمن في دعمه للسعودية ولهذا شن الاعلام السعودي حملة منظمة وواسعة على الشيعة وحزب الله وايران وجند الالاف ممن ياكلون باقلامهم من الكتاب العرب خاصة وان السعودية تشهد الان فائضا ماليا ليس له نظير وقد وصل الامر بالرئيس الامريكي بوش ان يقول علنا ان الخطر الاكبر لاياتي من القاعدة التي قضينا على دولتها لكن الخطر الماحق يأتي من الشيعة وايران التي تسيطر على دولة غنية وكبرى وفي كل خطبه الاخيرة اخذ يكرر ويركز على الشيعة وحزب الله وقبله قال سعود الفيصل في احد المعاهد الامريكية اننا حاربنا معكم ايران ثمان سنوات وانتم الان تعطوها العراق على طبق من ذهب، وما تبني السعودية لمجموعة 14 اذار ودعمها لهم بشتى انواع الدعم بخافية على احد.<br />واخذ هذا التحالف يتطور حتى اننا وجدنا الاعلام السعودي من خلال تلك الوسائل المذكورة انفا اصبح اسرائيليا اكثر من الاعلام الاسرائيلي، وقد عملت دراسة مقارنة ولمدة شهرين وهي المدة التي عاصرت فترة الحرب الاخيرة على لبنان بين تلك الوسائل السعودية وبين ستة صحف اسرائيلية فوجدت ان الاعلام السعودي كان اكثر انتصارا لاسرائيل من الاعلام الاسرائيلي نفسه حتى اني وجدت ان مانسبته 70% من لتحليلات والتعليقات الاسرائيلة تجزم ان اسرائيل قد هزمت وبالمقابل وجدت ان اكثر من 80% مما نشر بالمواقع السعودية المذكورة من دراسات وتحليلات ومقالات واراء تقول ان اسرائيل هي التي انتصرت، حتى ان الباحث يكتشف وبسهولة وكان خسارة اسرائيل هي خسارة كارثية على السعودية ، ولاحاجة للتذكير بفتوى ابن جبرين وعضو مجلس القضاء العالي اللحيدان بتكفير حزب الله والدعوة الى تخذيل الناس عنه ابان فترة الحرب ، وهذان الشخصان من يعرفها يعرف تماما انهما لايمكنهما ان يصدرا تلك الفتوى الا بتوجيهات رسمية وحتى مواقف الرئيس حسني مبارك وملك الاردن عبدالله التي تحدثت عن الخطر الشيعي كانت بتوجيهات سعودية.<br />ووصل الامر بتلك الوسائل المذكورة في الاونة الاخيرة وخاصة موقع العربية نت وايلاف ان تنقل كل يوم تقريبا التقارير التي تسربها السي اي ايه والمخابرات البريطانية للصحف الغربية والتي تهدف الى اشعال الفتنة الطائفية بين الشيعة والسنة وباسلوب مخابراتي سيكولوجي يثير الضغائن ويهيج العامة تتنقلها وكانها حقائق لاتقبل النقاش، علما بانهم يعرفون تماما انها اكاذيب وخاصة مايجري على ارض العراق الدامي ووصل الامر بالمصادر البعثية ان تزودهم بالاكاذيب التي يعرفها حتى الطفل الصغير كقول عدنان الدليمي ان الشيعة يذبحون اهل السنة في بغداد ذات الاغلبية السنية المطلقة؟؟ وعندما تستهدف المناطق الشيعية لاتذكر هويتها الطائفية لكن عندما تستهدف المناطق السنية تشخصها بل وتشخص القتلة لكن قتلة الشيعة على الدوام هم من المجهولين وكم من مرة سمت بعض الاحياء الشيعية التي تستهدف كل يوم من التكفريين والصداميين بانها احياء للسنة<br />والامر المستغرب اننا نرى ونسمع العاهل السعودي الذي يقول ويكرر انه لاتوجد مخاوف من حرب مذهبية فهل هذا الامر يراد منه مخاطبة الداخل ام انه لايدري بمايقوم به اعلامه الممول بماله في تأجيج تلك العداوات والحروب وعلى مدار الساعة؟ التي فيما لوبدأت فان اول من يحترق بلهبها هم السعوديين وخاصة اذا علمنا من ان الامريكان قالوا من خلال الوسائل الاعلامية انهم لم يعد لديهم وسيلة للسيطرة على العالم الاسلامي الا من خلال فرق تسد والفوضى الخلاقة والاسلوب السحري كما يسمونه لتحقيق اهدافهم مبني على اثارة العداء السني الشيعي ونبش التاريخ الاسلامي، وقد انشؤا المراكز المتخصصة لهذا الامر ومن خلال متابعتي الدقيقة لتلك الوسائل الاعلامية السعودية تبين لدي بما لايقبل الشك ان الكثير من العاملين في تلك الوسائل انما ينفذون ما يطلب منهم من المخابرات الغربية والاسرائيلية المعروفة وقد شهد بذلك الصحفي مهند الخطيب الذي استقال من قناة العربية لهذه الاسباب وقال بالحرف الواحد ان معظم من يشتغلون بالعربية تبين لي ان لهم ارتباطات مشبوهة مع مخابرات دولية هذه الشهادة المنشورة على العديد من المواقع والصحف العربية، ومنهم من له ارتباطات بالقاعدة ويتمنى تلك الفوضى الخلاقة حيث ان القاعدة كالطفيليات لاتعيش الا على القاذورات. لكن السؤال المهم هل ان المخابرات السعودية غافلة عما ستؤول اليه هذه الكوارث وهل يتوقع السعوديون انهم بمنجى منها ام انهم لم يعد لديهم خيار ووضعوا بيضهم كله في السلة الامريكية الاسرائيلية لكن هل حقا يطمأنون للامريكان والاسرائيليين الذين شيمتهم الغدر والمكر؟ والشهور القادمة حتما ستجيب على هذه التساؤلات عندما يخرج لهب نيران العراق الى المحيط العربي البترولي وعندها سيعرف السعوديون انهم هم من اشعل النار في ديارهم وعندها سيتحققون من عهود الامريكان والصهاينة الذين لاعهد لهم عندما يتخلون عنهم ويقسمون بلدهم الى امارات يسهل عليهم ادارتها وسيتذكرون ماقلناه مرارا وتكرارا لهم ولكن حين لاينفع التذكار"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814161157/http://www.20at.com:80/20at/salamo-3lakom/2973.html"

