text = "الى كل من يتهم الشيعه , قال الله تعالى بعد اعوذ بالله من شياطين الانس والجن ( ان جاءكم فاسق بنبأ فتبينوا ان تصيبوا قوما بجهالة فتصبحوا على ما فعلتم نادمين )<br />انا لن اتهمكم في دينكم كما تفعلون , لكن ابحثوا في الخسائر العراقية , كم من اتباع اهل البيت واخواننا السنة الشرفاء قد قتلوا على يد الاحتلال والوحوش البشرية التي ارسلتها السعودية لنا.<br />كلكم تعلمون ان الشيعه لا يتهمون الوحي بالخيانة ولا يعبدون القبور , لكن السؤال لماذا تثار هذه الامور الان , وفعلكم هذا يؤكد كلام امير جابر من هولندا , يفترض بالمؤمن ان يكون حكيما , وكما قال سيد المرسلين صلى الله عليه واله وسلم (قل خيرا أو اصمت ) ويا ليت بعض الناس يتبع السنة ويقول خيرا"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814161157/http://www.20at.com:80/20at/salamo-3lakom/2973.html"

