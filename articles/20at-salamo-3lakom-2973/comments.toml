posted = "1999-11-30"
text = "الذي يحرق بيت اللة ويقتل على الهوية والاسم ويقتل اناس مجرد انهم سنة حرقو القران وهجرو العوائل من دورهم وغتصبو النساء لائنهم سنة يشتمون ابى بكر وعمر يقولون جبريل خان الامانة نزلهى على محمد وهي المفروض قولهم انهو ينزلهى على علي تقسم لهو باللة لايعترف بلقسم يصدقك عندما تقول وعلي والعباس اي كفر وشرك بللة انى مع المقال واكثر لايهم ايران ان تضرب بيت اللة وتقتل الحجاج لائن الذي تفعلهو في العراق لايوصف واللة على ما اقول شهيد"
