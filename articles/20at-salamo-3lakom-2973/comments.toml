posted = "1999-11-30"
text = "اللهم انتقم من ابناء المتعة . الشيعة الاوغاد و اذقهم الزقوم .و اخسف بايران الارض و اجعلها مذلولة بين الدول . ايران و ذيولها العرب من مقتدى الصدر و عبد العزيز الحكيم و حس نصر الله اقسى من امريكا و اسرائيل و كل امراة عراقية سنية تنادي الان وامعتصماه فهل من مجيب . اللهم انصر المقاومة العراقي الباسلة على اعداء الاسلام من امريكيين و روافض.لن تستطيع ايران الصفوية ان تنشر دين الشيع الذي يضل من يتبعه عن الطريق المستقيم لان اسود السنة سيقفون لها بالمرصاد."
