[[comments]]
order = 10
subject = "فهمتوا ولا نقول تاني؟"
author = "عبدالله مفتاح"
posted = "2007-01-09"
text = "يا جماعه بتجيبوا سيرة الدين ليه؟؟؟<br />الدين ده عند عمرو خالد في الجامع مش في السينما عند هاني سلامه؟؟؟<br />محدش يخلط .... لما نتكلم في الفن الدين يركن على جنب خالص ولا يفتح بقه....<br />مش ناقص كمان الا الدين هو اللي هنحكم بيه على الفن<br />هي الوهابيه دي اللي رجعتنا لورا ....<br />ناس بتكلم في الفن... وبيحللوا من الناحيه الفنيه تدخلوا الدين في النص ليه؟؟؟؟<br />هو حد جاب سيرة الدين؟؟؟؟؟؟؟<br />متهيالي انا اتكلمت عن القيم الانسانيه<br />مجبتش سيرة الدين خالص<br />يعني هل من الانسانيه ان انسانه تتنقل من فراش الى فراش لانها فنانة(بتفن)<br />ولا من الانسانيه ان واحد يبقى كالانعام يشبع غرائزه على الملا بحجة ان المشهد عايز كده؟؟؟<br />فين الانسانيه؟؟<br />ولا الفن لما يوصل لا دين لا انسانيه؟؟؟؟؟"
archived = "2007-01-10"
capture_url = "https://web.archive.org/web/20070110211912/http://masr.20at.com:80/article.php?sid=1407"

[[comments]]
order = 11
subject = "خالد يوسف؟؟الحلو ميكملش؟؟"
author = "محمد السيد"
posted = "2007-01-09"
text = "بجد يا عبد الله يا مفتاح ... مش لاقي تعليق أحسن من تعليقك الأخير ده ...<br />الفيلم حكاااااية من الناحية الفنية .. كويس جدا ...<br />لكن ماهو الفن برضه المفروض يكون بيعبر عن قيم وعادات المجتمع ده .. وإلا بقي يكون حاجة تجريدية حداثية همبوطية مهلبية .. مش عارف إيه هي ؟؟؟؟ وكده يعني ؟؟؟<br />أنا من المحبيييييييييين جدا لخالد يوسف ... وشايف إنها حالة نادرة إنه يتوجد الابداع الإخراجي ده .. مع ثقافة حقيقة ... مع رأي حر يندر وجوده في المشتغلين بالفن ....<br />لكن ليه إصراره الغريب علي بعض المشاهد اللي لا تقدم ولا تأخر في الفيلم ... غير المعني ده ؟<br />في العاصفة كان مشهد يسرا وهي وحدها .... كان معني المشهد حكاية .. لكن كان ممكن يتقدم بصورة أكثر قبولا بمراحل \"حد جاب سيرة الدين هنا؟\"<br />وفي إنت عمري برضه شوية ...<br />وفي الأخير ده برضه ؟<br />طيب ليه يا سيدي ؟؟؟ محدش عارف<br />وبرضه محدش جاب سيرة الدين ....<br />بس برضه مش حاسكت ...<br />لاللتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-01-10"
capture_url = "https://web.archive.org/web/20070110211912/http://masr.20at.com:80/article.php?sid=1407"

[[comments]]
order = 12
subject = "إلي أحمد فؤاد الدين"
author = "محمد السيد"
posted = "2007-01-09"
text = "وبعدين شايف في لهجة ...أحمد فؤاد الدين ...<br />نوع من الوصاية والتعالي الغير معهود من عشرينات ...<br />كان ممكن نفس المعني يوصل لكن بإسلوب تاني ... وجملة غير مستفزة زي دي ...<br />مش عارف حسيت لما قريت تعليقه إن في حاجة مستفزة في الكلام ... ممكن تأدي بالتعليقات إنها تاخد منحي تاني خالص ... يبعدنا عن الفيلم والموضوع ... وتبقي خسارة فكرة أميرة تروح علي الفاضي<br />زمان .. ويمكن لغاية دلوقتي ... كانوا عشرينات بيدخلوا يعلقوا بأسامي غير أساميهم .. أو حتي بأسامهيم لكن بإسلوب غير كده خالص ...<br />ياتري إيه الجديد ؟؟ في عشرينات الجداد ؟؟<br />برضه مش حاسكت ...<br />من أفدم عشريناتي ... علي ماأظن ... يعني<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-01-10"
capture_url = "https://web.archive.org/web/20070110211912/http://masr.20at.com:80/article.php?sid=1407"

[[comments]]
