text = "أنا مشفتش الفيلم بس أنا بحب النوعية ديه من الأفلام اللي فيهاsuspense<br />و عندي يكون الفيلم قصتة متكررة 7878 مرة بس معمول حلو و محستش بالملل و أنا بتفرج عليه عن أما يكون فيلم فكرتة أكتر من رائعة بس مش معمول حلو ..<br />أنا عن نفسي أكتشفت عبقرية \"خالد يوسف\" في \"أنت عمري\" ..و صحيح أنا مبحبش هاني سلامة و كنت دايما أقول عليه أنه طالع يمثل بعنية بس ..و مازلت مبحبوش لكن بقيت بحب أدائة التمثيلي جداا اللي بدأ فعلا يظهر من فيلم\"السلم و التعبان\" و بعدين \"أنت عمري\"<br />الفيلم شكلة حلو فعلا يا أميرة ..أكيد ها ادخلة بعد الكلام اللي قلتيه عليه"
