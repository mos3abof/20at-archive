text = "لماذا لا نقول اننا في زمن الحريه او بمعني اصح احنا في زمن الحياه الطبيعيه فاذا كان الفيلم به مناظر اباحيه او مخله فانها لاتنطبق لجعل المشاهدين تتنطلق لمشاهده الفيلم لكن لجعل الفيلم يبدو في صورة طبيعيه وحقيقي الانجاز هو فيلم رائع وطبيعي"
