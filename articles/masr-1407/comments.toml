[[comments]]
order = 20
subject = "حمد الله على السلامه يا عبد الله"
author = "نيفين نيفى نوفا"
posted = "2007-01-10"
text = "اولا حمد الله على السلامه يا عبد الله<br />ثانيا ابقى اكمك ف موضوع المجستير بتاعى دا بعدين لان احنا ف ايام مفترجه و النك موجود طبيعى(للحديث بقيه)<br />انا مع احمد فؤاد الدين ف رايه لان الف بتاء نقد ف اى فن من الشعر للسينما للمسرح هو ابعداد الدسن و ابعاد معتقدات الكاتب الشخصيه عن ما يكتب<br />و ف نفس الوقت انا مع عبد الله لان الفن لما بيتدنى بيخلى الراقصات يقولو على نفسهم فنانات<br />يعنى الموضوع الفرخه قبل البيضه و لا البيضه قبل الفرخه<br />هى دى الدايره المغلقه اللى بنلف فيها من ايام السينما الصامته<br />و علشان كدا انا بعتبر المسرح عشقى الاول و الاخير ابو الفنون ارقى الفنون<br />لالنسبه لهانى سلامه انا بختلف<br />معلش يت جماعه هو بتستثناء ان دمه تقيل شويه هو موهبته تاكدت ف السلم و التعبان و انت عمرى وويجا<br />هو فعلا بيمثل كويس و ليه ادواره اللى بيعرف يعملها صح بغض النظر عن المشاهد الاباحيه او غيره"
archived = "2007-01-10"
capture_url = "https://web.archive.org/web/20070110211912/http://masr.20at.com:80/article.php?sid=1407"

