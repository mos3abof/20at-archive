[[comments]]
order = 35
subject = "الفيام حلو"
author = "توتى"
posted = "2007-02-11"
text = "الفيلم حلو بجد الموضوع موجود فعلان فى الحياة اللى احنا عيشنها<br />انما العرى اللى فى الفيلم موجود اقذر منة فى الشارع المصرى وجميع البلاد العربية<br />احنا لية عايزين ندارى على الحقيقة لية مانعالجش المواضيع بجدية احسن من اننا نحط رسنا فى الاطين<br />اللى مش عاجبة الفيلم ميتفرجش علية اللى بيقول الحلال والحرام-والسب والشتائم مش حرام<br />ياريت نخلى عقلنا اكبر بكتير من الممسلين والمخرجين<br />والاخر الفيلم خطوة جدية فتح عنينا على الكثير"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212041753/http://masr.20at.com:80/article.php?sid=1407"

[[comments]]
order = 36
subject = "افلام الأوسكار المنزلى"
author = "ميمو"
posted = "2007-02-12"
text = "فيها اية لما نعمل فيلم كويس وفيه اكشن وفيه مصاريف<br />بس ممكن نبعد برضو عن المناظر المخله الي حد ما ماننساش ان<br />في ناس عندها ذوقيات بتتفرج علي الفيلم او بعد كدي نعمل حساب<br />ان في اب ام اولاد بتتفرج اخوه واخوات نعمل حساب ان دول برضو<br />بيتفرجوا معانا علي هذه الأفلام<br />علشان لما نعمل فيلم كويس<br />يبأ علي مستوي الأسرة كلها والكل يقول ان الفيلم صحيح يستحق انو ياخد<br />أحسن فيلم بغض النظر عن مين المخرج وله الممثل كلهم بيحاولوا<br />يطلعوا الفيلم بشكل كويس وكلوا بيشتغل<br />بس ياريت عاوزين فيلم اادر اخش فيه انا خطيبتي او زوجتى<br />بدون إحراج من بعض المناظر وشكرا"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219212711/http://masr.20at.com:80/article.php?sid=1407"

