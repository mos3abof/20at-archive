posted = "2007-01-09"
text = "اتعجب من هذا الاسلوب الغريب فى تناول الافلام .. يتحدثون عن الدين و التدين دائما الى ان ياتون الى الافلام ويبدا الحديث عن حريه الابداع .. الدين لا يتجزا و لا يوجد منطقه ممنوعه لا يجب للدين الدخول فيهااو ان تلعب على كل الاوجه ، كالممثلات اصحاب ادوار العرى و الانحراف طوال الموسم و فى اخر السنه يذهبوا الى الحج ثم يعاودون نفس الادوار بعد عودتهم المباركه<br />واخيرا الاخ أحمد فؤاد الدين ما تيجى تاخدنا قلمين احسن."
