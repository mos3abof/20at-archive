text = "الفيلم بأمانه روعه من اخراج لتمثيل واللى يقول وحش هو ده اللى بيحصل فى مجتمعنا فعلا وهانى سلامه روعه بصراحه وسميه والوجه الجديد اللى كان اخوه فى الفيلم الحاجه الوحيده اللى بايخه مشهد العمليه ماهو معروف الترقيع ايه مش لازم يجيبوا الوضع يعنى وبرضه مش الحمام بتفاصيله مالوش لازمة المخرج كدة ادى فرصه للنقاد يمسكوا على الفيلم غلطة يعنى مالقوش فى الورد عيب...."
