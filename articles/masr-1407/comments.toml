[[comments]]
order = 29
subject = "خيانة مشروعة"
author = "ياسمين"
posted = "2007-02-01"
text = "انا بصراحة شفت الفيلم كله ثلاث مرات وعجبنى جدا من الناحية الفنية فهو يحمل وجهة نظر جديدة ومختلفة على السينما بالرغم من ان قصة الخيانة تناولتها السينما المصرية فى العديد من الافلام ولكن هذا الفيلم يحمل فكر مختلف للمخرج العبقرى خالد يوسف الذى اؤيده من الناحية الفنية اما ولقد اعجبنى نقد الفيلم كثيرا لانه كان محايدا ولكنها ولم تتناول صراحة ايجابيات وسلبيات هذا الفيلم فمن رأيى الشخصى ان هناك عدة سلبيات فى الفيلم التى قد تؤثر على بنيته الدرامية ومنها اللقطات الساخنة والتى كانت لم تكن سوى لقطة واحدة او اثنين والباقى فى الجمل التى استخدمها الممثلون فى الفيلم وايضا مشهد الفنانة ساندى الساخن الذى كان فى الحمام كان زائد كثيرا فكان من الممكن ان يكتفى المخرج بقبلة واحدة اذا اراد ان يثير الجدل وايضا مشهد عملية الترقيع والتى كان من الممكن ان يكن اقل من ما كان عليه بكثير حتى لا يخدش حياء الموجودين وايضا الممثلة التونيسية ساندى كانت من المفروض ان تعطى للدور حقه فهى ارتدت ملابس ساخنة فى اماكن ليس لها علاقة بالدور فدورها انها فتاة فقيرة ومنحرفة وكان يجب ان ترتدى ملابس اكثر احتراما وحتشاما مما كانت عليه اما عن دور هانى سلامة فقد اعجبنى دوره كثيرا لأنه اخرج نفسه من ثوب الرومانسى الحبيب الشقى ودخل فى دور الشرير الشرس الذى يحمل تركيبات عديدة فى شخصيته وايضا بالرغم من كل هذا فانه يختفى بداخله شخصية اخرى عكس شخصيته تماما وهى شخصية طيبة وحنونة ومحبة للحياة فقد اعجبنى تجسيده للدور بشكل جيد بدون نقص او مبالغة فى اداءه للدور ولم يستخدم وسامته فى هذا الدور بالتحديد فقد انضج فنيا كما قالت الفتاة فى نقدها واما عن سمية الخشاب فقد اثبتت للجميع انها بمئة جلد وتستطيع ان تفعل جميع الادوار وان اصعب الادوار على اى<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025538/http://masr.20at.com:80/article.php?sid=1407"

