text = "يا جماعه بتجيبوا سيرة الدين ليه؟؟؟<br />الدين ده عند عمرو خالد في الجامع مش في السينما عند هاني سلامه؟؟؟<br />محدش يخلط .... لما نتكلم في الفن الدين يركن على جنب خالص ولا يفتح بقه....<br />مش ناقص كمان الا الدين هو اللي هنحكم بيه على الفن<br />هي الوهابيه دي اللي رجعتنا لورا ....<br />ناس بتكلم في الفن... وبيحللوا من الناحيه الفنيه تدخلوا الدين في النص ليه؟؟؟؟<br />كووووووووووووووول الكلام ده مش على لساني انا بقوله على لسان اخرين<br />ازاي تتخيل ان عبدالله مفتاح يقول الكلام ده اخص عليك<br />مرة عشان قلت عبدالله قفل<br />ومرة لما قلت انه ظلمني اللي سماني عبدالله<br />ومرة عشان تخيلت لوهله ان الكلام ده ممكن يكون راي عبدالله مفتاح"
