text = "والله حجج فارغه ناس فاضيه كله باصص للمناظر اللي في الفيلم ماحدش بص للامكانيات اللي في الفيلم ولا في المصاريف الخاصه بالفيلم ليه كلنا ننظر للشئ الغلط ونبعد عن الصح الشئ الذى تحت اقدامنا والتي من الممكن ان تجعل لنا الحياه مستفبليه جديده الفيلم زى مافيه مناظر الي انتو مسمينها مناظر مخله رغم سماح النقابه بها بها ايضا مناظر وصلت تقربيا للاكشن الغربي التي لم يصل اليها اي بلد عربي من قبل والاخر فعلا ناس فاضيه"
