text = "والله انا شايف انى اللى تعب وشاف الفيلم وقعد يسترسل فيه هوه اللى كتب الموضوع ده واذا كان على الفن واخلاقياته ده حاجات معروفه اماهانى سلامه فهو ممثل مقنع جدا خصوصا فى الادوار ذات الطابع الرومانسى اماخالد يوسف فهو سليل ابداعات يوسف شاهين مع الاخذ فى الاعتبار ان دى افلام مفهومه وقيمه للسينما اما يوسف شاهين فمعلشى بقى افلامه يفهمه هوه بس فشكرا لصاحبه هذا المجهود"
