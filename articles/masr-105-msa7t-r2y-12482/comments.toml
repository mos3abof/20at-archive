text = "كيف حالك حسينه احنا سعداء جدا ان اهل الشام بيشاركونا<br />ولكن يا حسينة مش هي دي المشكلة المشكلة حتلاقيها في الصورة كويس<br />بصي في الصورة كويس يا حسيني وحدقي كويس يا حسينا<br />حتلاقي ريمان وحياتك انتي قرعه ولابسه باروكا<br />وبعدين يا حسينا اللي عملته ريهام دا شغل ناس قرع كون انها تجلس في اوضه ضلمه وتكلم بنتين ولاد خالة بيمارسوا السحاق مع بعض<br />دي اسمها حركات قرعه<br />انا عارف يا اخي انفلوانزا الخنازير سايبه الناس دي ليه"
