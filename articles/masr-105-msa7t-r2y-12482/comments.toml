text = "سلوكيات مرفوضة وهذا دليل على ضعف التربية الدينية والاخلاقية<br />مطلوب زيادة الحصة الدينية فى المدارس وفرضها اجباريا فى المدارس الخاصة والمدارس الاجنبية<br />والمفروض البرامج التليفزيونية فى القنوات الدينية الخاصة توعى فئة الشباب والشابات"
