author = "مواقع اباحية"
posted = "2009-06-29"
text = "المواقع الاباحية المفتوحة على شبكة النت يجعل اى شاب او شابة بكلك واحد من الماوس يفتح مواقع ويشوف بلاوى وطبعا احيانا يحصل انة عايز يجرب او يتعرف على الثقافات دى<br />وبما ان البنت فى مجتمعنا تخاف من الحمل غير الشرعى وفضيحتة فتلجأ الى الشذوذ والسحاق والبلاوى اللى بنسمع عنها<br />يجب على الدولة ان تضع قيودا على النت وتحظر تلك المواقع<br />مش ممكن نسيب الباب مفتوح كدة للافساد - رقابة الاسرة مش ممكن لان الشباب عندة اللاب توب وبيقفل علية باب غرفتة ويشوف المواقع دى بعد نوم ابوية<br />امنعوا المواقع الفاسدة على النت زى الامارات وبقية الدول العربية"
