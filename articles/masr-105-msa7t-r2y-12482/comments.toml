author = "وللة الامر"
posted = "2009-06-27"
text = "خلاص النماذج الطيبة فى حياتنا وفى مجتمعنا انتهت ومفيش البنت المكافحة الشريفة حتى ننشر قصص الانحراف والشذوذ الجنسى وننشر الفاحشة ونقول للبنات الصغار الذين يجلسون امام التليفزيون اسالوا واعرفوا يعنى اية شذوذ<br />اتقوا اللة فى بناتنا الصغار فى البيوت عندما تخدش اذانهم تلك الالفاظ القبيحة والمعيبة<br />فىة بنات مشرفات وحملوا راية التعليم فى مشارق العالم العربى وغربة<br />ولا انسى اننى كنت فى بلد خليجى فى قبل فترة طويلة وركبت السيارة الى مكان ما على البحر ثم ركبت قارب بموتور فى البحر الى احد الجزر وعند الشاطىء ركبت حمار صعد بى الجبل مع مرافقين فى رحلة شاقة جدا<br />وفى قمة الجبل وجدت مدرسة من فصلين مصنوعة من جريد النخيل وفى احد الفصول وجدت مدرسة مصرية واقفة وامامها اطفال البدول وتكتب على السبورة ا ب ت ث جح خ<br />ساعته شعرت بفرحة طاغية وسالتها فى استعجاب كيف وصلتى الى هنا وكيف تعيشين ؟<br />قالت انها رسالة المعلم<br />هذا كان زمان من 30 سنة فى احدى دول الخليج<br />فية نماذج مشرفة جدا<br />انما الشذوذ<br />اخية<br />اخية<br />غممان نفس"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085023/http://www.20at.com:80/masr/105-msa7t-r2y/12482-2009-06-27-10-15-24.html"

