text = "أنا ما عنديش مشكلة يا علياء إنه يبقى فى مناقشة لهذه القضايا الشائكة<br />لكن لابد من الحذر الشديد في طريقة العرض والتناول<br />ولابد من توجيه العرض في هذا آفة ومرض نفسي وذنب لابد الخلاص منه<br />ما ينفعش نقدم للناس المصيبة دى كده وخلاص<br />خاصة وان المصايب فى مجتمعنا كتير"
