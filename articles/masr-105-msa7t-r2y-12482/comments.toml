[[comments]]
order = 35
subject = ""
author = "الحاجة رقعت بالصوت"
posted = "2009-07-03"
text = "الحاجة كانت مريضة ومحتاجة الى عملية جراحية - وبما اننى مهاجر من فترة طويلة الى لندن فقلت اخدها هناك بالمرة تقعد معايا شوية واراعيها واخدمها شوية كواجب على لانها امى وفضل الام فوق اى فضل ثم ان الجنة تحت اقدام الامهات ودعوة لى منها تبارك فى بيتى وعيالى<br />وصلت الحاجة بسلام اللة الى لندن مع اخى<br />واثناء سيرها معى فى احد الشوارع عائدين الى البيت بعد الفحوصات تسمرت فى الارض اذ كان هناك شاب وشابة يمارسان الجنس علنا فى حديقة جانبية<br />ورقعت الحاجة بالصوت يا نهار اسود فى الشارع يا ولاد الكلب دى ربنا هينزل عليكم حجارة من السماء وتجمع بعض الفضوليين وسحبتها الى البيت<br />وفى مدخل العمارة كان هناك ولد وبنت امام الاسانسير ملتصقان ويقبل فيها ويمد يدة من تحت ملابسها الواسعة الى اجزاء جسمها<br />وصوتت مرة اخرى وشتمتهم<br />ثم اصرت الحاجة على عدم اجراء العملية فى البلاد [ *** ] دى على حسب تعبيرها<br />وعادت الى الوطن<br />وطلبت منى الا ارسل لها اى اموال من البلد دى لها لانها حرام<br />طالما فية امثال الحاجة فى مصر لا تخافوا<br />الحاجة موجودة وبتعرف تصوت لما تشوف عيب وممكن تمد ايدها وتضرب كمان<br />الحاجة موجودة<br />اطال اللة اعمارهم"
archived = "2009-08-02"
capture_url = "https://web.archive.org/web/20090802054213/http://www.20at.com:80/masr/105-msa7t-r2y/12482-2009-06-27-10-15-24.html"

