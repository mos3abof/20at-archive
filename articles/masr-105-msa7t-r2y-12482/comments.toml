text = "شر البلية مايضحك<br />أنا شايفة ياعلياء إن السبب فى ده ولو كان حقيقى<br />إنه الحمد لله نادر فى مجتمعنا ومش فى حاجة الى نقاش أو حتى عرضه ولو فكره<br />إحنا محتاجين نتمسك بمبادئنا أكثر وحرية الغرب لازم نحد من تسسللها الينا<br />بإننا ننهض ونرفع من على كاهل المرأة تسولها حنان الأهل وطلبها الشديد للمادة<br />مش الحرية امتهان كرمتها"
