author = "نضال"
posted = "2009-06-28"
text = "ده إعلام أسود … ناس بقوا مذيعين لمجرد ان الشكل حلو وكام معلومة على كلمتين أنجليش يعدوا بيها الأختبار وشكراً<br />ما يعرفوش يعنى أيه مهنية .. وكلامي مش على ريهام السعيد لأني ماشفتهاش قبل كدة .. لكن على إعلاميين كتير بيستغلوا اى حاجة علشان يعملوا فرقعة إعلامية ويجيبوا اعلى نسبة مشاهدة للقناة .. علشان إعلانات القناة تزيد و بالتالى مادام البرنامج بيجيب نسب مشاهدة عالية وبيدخل فلوس للقناة من خلال الإعلانات .. يبقى المذيع هيضمن ان البرنامج هيفضل وبالتالى هو كمان .<br />يعنى مثلاً .. اى مشاجرة صغيرة بين مسلم ومسيحي يجيبوها في البرامج ويفضلوا ينفخوا فيها ويقولك فتنة طائفية … وهو عارف انه هو بعرضه لمشاجرة عادية زى دى بيولع وبينفخ فى نار الفتنة … مع أن فيه مئات المشاجرات الى بتحصل يومياً .. لكن مادام فيها مسلم ومسيحي . يبقى لازم تتعرض على المصريين بطبيعتهم بيحبوا يشوفوا المشاكل .."
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085023/http://www.20at.com:80/masr/105-msa7t-r2y/12482-2009-06-27-10-15-24.html"

