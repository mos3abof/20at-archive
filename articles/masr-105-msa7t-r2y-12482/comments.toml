author = "مش ححبك"
posted = "2009-06-30"
text = "باختصار<br />الافلام الاجنبية بيبقا فيها مشاهد جنسية ولكن مش هو دا الغرض من انتاج الفيلم الغرض من الفيلم القصة بتاعته<br />اما الافلام العربية بيبقى فيها قصه ومشاهد جنسية ولكن عندنا بيبقى الغرض من الفيلم هو المشاهد الجنسية مش القصة وانا فاكر مرة زمان ايام ما كنا عيال في السبعينات ظهر فيلم افتكر كانت البطلة بتاعته سهير المرشدي المهم الفيلم ولاول مرة ادخل كلمة (مومس) في السيناريو بتاعه واللي قالتها سهير المرشدي (بنت اخوك مومس يا استاذ)<br />علشان خاطر كلمة (مومس) دي الناس كانت حتكسر شبابيك التذاكر بس علشان خاطر يدخلوا يسمعوا سهير المرشدي وهي بتقول مومس<br />احنا شعوب متخلفة رغم اننا بنمارس الجنس اد الغرب عشرين مرة الا انه مازال الجنس عندنا اسرار بنحب نتصنط عليها<br />قال واحدة عامله برنامج عن بنتين بيمارسو السحاق<br />علشان خاطر الناس العبط يتفرجوا"
archived = "2009-08-02"
capture_url = "https://web.archive.org/web/20090802054213/http://www.20at.com:80/masr/105-msa7t-r2y/12482-2009-06-27-10-15-24.html"

[[comments]]
