subject = ""
author = "هشام يونس"
posted = "2009-06-28"
text = "عزيزتي علياء:ربما يصدمك قولي أن في مجتمعنا ما هو أسوا من ذلك ولا أظن أن هذه الحلقة التي رأيتها مصادفة مثلك تماما مفبركة على طريقة هالة سرحان وإذا نحينا جانبا موقفنا من المذيعة الفنانة أو الفنانة المذيعة ومدى أهليتها للوعظ والإرشاد فإن مجتمعنا أصبح مع الأسف ملئ بنماذج تشبه الفتاتين وتتجاوزهما بكثير..وربما يصدمك ثانية أن في دفعتك التي شرفت بالتدريس لها شابين تعرضا لتحرشات وطلبات صريحة بممارسة الشذوذ من صاحب مكتب جرافيك عندما حاولا الالتحاق بعمل في أثناء دراستهما وبالطبع كانت صدمتهما كبيرة لكنهما أخبراني بحكم الصداقة وبذلت جهدا معهما لأقنعهما بأن هذا الطلب الشاذ ليس قرينا بالعمل في أي مكان وأن بإمكانهما البحث عن عمل في أي مكان دون أن يتوجسا أن صاحب العمل أورئيسه سيكون شاذا ويطلب منهما ممارسة الجنس .."
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085023/http://www.20at.com:80/masr/105-msa7t-r2y/12482-2009-06-27-10-15-24.html"

