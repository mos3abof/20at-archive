posted = "2009-06-29"
text = "يا علياء<br />انتي لعبتي نفس اللعبة يا علياء<br />نفس لعبة المذيعة اتلعبت في هذا المقال<br />انتي لعبتيها في هذا المقال<br />والصحيح هو انتي كنتي بتدوري على فكرة مقال مثير تكتبيه<br />ففضلتي تقلبي في القنوات الفضائية علشان خاطر تشوفي فكرة مقال مثير (قنبلة)<br />كل البرامج قديمه<br />وانتي بتقلبي في الفضائيات وجدتي الهدف وهو مقال عن الشذوذ الجنسي بين فتاتين<br />برافوا يا علياء عبدالفتاح<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــ<br />بس على مين بأه دا احنا ناس معلمين ما يدخلش علينا الكلام دا<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــ<br />مش شريف الدواخلي ولا البراء اشرف<br />ولا رضوى حسن ولا مروى صلاح<br />ـــــــــــــــ ـــــــــــــــ ــــــــــــــ<br />وعلى ما يبدو ان التعليق حيتحذف"
