posted = "2009-07-06"
text = "وحيث إن واقعة الدعوى حسبما استقرت في يقين المحكمة ووقرت في وجدانها مستخلصة من سائر أوراقها وما تم فيها من استدلالات وتحقيقات وما دار بشأنها بجلسة المحاكمة تتحصل في أن المتهم الحدث الأول – … قام بالاعتداء على المجني عليه الأول – …البالغ من العمر سبع سنوات بالضرب وأنزل بنطاله وأولج قضيبه في دبره، كما أجبر المتهم الحدث الثاني – … المجني عليه الأول على لعق قضيبه بعدما شده من شعره وصاحب ذلك قيامه بتصوير واقعة لواط المتهم الحدث الأول بذات المجني عليه"
