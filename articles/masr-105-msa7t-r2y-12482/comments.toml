text = "عزيزتى علياء الواقع أسوأ من هذا بمراحل ولا حل ولا اصلاح الا بالمواجهة وكشف عورات ونقائص هذا المجتمع ولكن الفبيصل فى الموضوع هو طرية التناول والمعالجة الاعلامية فلا يصح أن يكون التناول من باب احداث دعاية للموضوع ولا أتفق ابدا مع طريقة ريهام سعيد فى تناول نقائص المجتمع خصوصا انها تحمل لواء الدفاع عن أشياء هى أبعد ما تكون عنها وهو ما يضعها فى خانة المتاجرون بنقائص هذا الوطن وليس من الباحثين عن اصلاحه ولا شك أنها تمثل أحد نماذج الفوضى الاعلامية التى نعيشها فى الوقت الحالى ."
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085023/http://www.20at.com:80/masr/105-msa7t-r2y/12482-2009-06-27-10-15-24.html"

[[comments]]
