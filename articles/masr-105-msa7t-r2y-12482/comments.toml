subject = ""
author = "الغاء الزواج في مصر"
posted = "2009-06-29"
text = "طبعا انتو عارفين ان الشذوذ الجنسي دا نتيجة عدم القدرة على الزواج<br />واحنا عندنا في مصر زي ما انتو عارفين حصلت ثورة في مصر اسمها ثورة 23 يوليو<br />يعني المسخرة وقلة الادب اللي كانت بتحصل ايام الملك فاروق دي انتهت وبدأ عصر الادب<br />ومن ضمن الاشياء اللي انتهت هي الحجات الوحشة دي اللي بيسموها جواز اي والله ايام الملك فاروق كانت الناس في مصر بتتجوز<br />اسألوا كده الناس العواجيز هل كان فيه حد مش لاقي شقه ايام الملك فاروق<br />لكن ثورة 23 نيلة وزفت وطين وقطران وبلة ازرق انهت عصر الجواز الحلال في مصر وبداية عصر الجواز العرفي والشذوذ الجنسي<br />واول بشاير الثورة هي ازمة الاسكان وانهت بازمة الخبز<br />والله المستعان<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــــ<br />مش احمد الهواري ولا عبدالله الطحاوي<br />وبالمناسبة اين ذهب عبدالله الطحاوي"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085023/http://www.20at.com:80/masr/105-msa7t-r2y/12482-2009-06-27-10-15-24.html"

