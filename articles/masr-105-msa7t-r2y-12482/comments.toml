text = "مع الختان والبنات هايجة وبتمارس الشذوذ<br />انما بعد تعيين وزيرة لشئون الختان اسمها مشيرة خطاب واجبار الناس على ختان البنات - اية اللى هيحصل<br />هل ستهاجم البنات الصبيان لاغتصابهم ؟<br />تعلمنا ان الختان هو تجميل وتخفيف وتقليل للشهوة الجامحة<br />فماذا سيحدث فى قادم الايام ؟<br />وخصوصا وعندنا الختان منذ العصر الفرعونى ولم يعترض علية احد<br />لماذا الان والان فقط يشرعون لايقافة<br />لكى تنتشر تلك المشاهد<br />هل كان ابائنا واجدادنا على خطا ونحن اللى ناصحين"
