text = "لو الام بتربى بنتها تربية كويسة وتعرف متى تدلعها ومتى تشد عليها ولو البنت عملت غلطة ضغيرة تقرصها من لباليبها قرصة موجعة تخليها تصرخ تطلع البنت زى المسطرة ادب واخلاق واحترام - انما لو الام متسيبة ولا تسال البنت كانت فين او بتعمل اية ونامت امتى ورجعت امتى وبتعمل اية هيحصل انحراف<br />الام اولا والام اخيرا فى تربية البنات<br />ملحوظة - محدش يسالنى عن معنى لباليبها لانى سمعتها كدة من احدى السيدات ومش فاهم معناها"
archived = "2009-06-30"
