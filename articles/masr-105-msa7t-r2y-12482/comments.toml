text = "يعنى الموضوع هايف<br />بنتين متخلفتين بيبوسوا بعض ويحضنوا بعض وخلاص هيعملوا اية اكتر من كدة<br />فى اروبا وكر الانحلال الخلقى والحضارة الكاذبة الولد بيعاشر امة والبنت بتعاشر ابوها وهناك معاشرة للحيوانات والكلاب<br />لا زلنا والحمد للة فينا الخير وهذة القاذورات التى تظهر فى وسطنا حالات فردية نادرة لاشخاص غير اسوياء او من غير ملة الاسلام فكل شىء مباح عندهم ولا اعتراض علية<br />فلا زلنا بخير<br />ولا زال البساط احمدى<br />فكفاية بقى واقفلوا على الموضوع دة وبلاش نكش فى الوساخة"
