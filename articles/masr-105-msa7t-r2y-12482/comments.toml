subject = ""
author = "نضال"
posted = "2009-06-28"
text = "ناس بتقول ضعف الوازع الديني<br />وناس بتقول تفكك أسري<br />وناس بتقول التربية الأسلامية الصحيحة<br />وناس بتقول نقص توعية<br />وهو بصراحة كل دول مع بعض .. وأهم عنصر ممكن نضيفه لكل ده .. الفرااااااااااغ القاتل الى بيعاني منه الشباب .<br />يعنى لو واحد عنده وازع ديني .. ووقته مافيش اى نشاط شاغله<br />لازم غصب عنه هيدور على اى حاجة تشغل وقته من غير ما يحس .. وطبعاً أسهل وأول حاجة ممكن يفكر فيها هى الجنس .. فمادام الكمبيوتر والأنترنت موجودين + الفراغ = مواقع جنسية + إنحراف + جريمة ."
