posted = "2009-07-03"
text = "الشباب هو مستقبل الوطن ولقد اسئنا تربيتة وساعد على ذلك بنسبة 90%تلاعب الحكومة بفكر واقتصاد واحلام المواطنين مما جعل الشباب والكبار يضربون كفا على كف ويقولون هى الحكومة عايزة اية والجيع يعرف ولكن هناك عدة خطوط تهدفها الحكومة جميعها ادت الى مانحن فية من الاقتصاد والعلم والاىخلاق والمخدرات والجنس الفاحش وحوادث القتل والامراض وكل القوانين المتجهة لمصلحة افراد وبصراحة كل مصر ارضا وشعبا وقيما واخلاقا وهواء وماء عايزة تنضف تنمضف تنضف لكن ازاى ومين واناس عاملين ذى الفراخ الدايخة وجاى دلوقت تقول شذوذ بين فتاتين دة بكرة فىهذة الظروف النجسة والمظبطة والمرتبة من جهات الاختصاص هنلاقى الجنس يمارس فى كل شوارع ومنازل مصر ويحمية القانون الامن رحم ربى الامن رحم ربى الامن رحم ربى واننى انادى باجتماع بعض رجال الازهر ذو التاريخ النظيف وبعض اساتذة الجامعات المديلات القديمة فقط وبعض القضاة الشرفاء واساتذة علم النفس والاجتماع وبعض الاحزاب وبدون الحزب الوطنى وبدون الحزب الوطنى ويجتمعوا ويخرجوا مصر من الجارى الى الشعب عايش فيها واقصد افسد واقبح وانتن وقت نعيشة الان"
archived = "2009-08-02"
