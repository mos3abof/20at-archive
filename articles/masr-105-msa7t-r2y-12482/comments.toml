subject = ""
author = "نفس اللعبة 2"
posted = "2009-06-30"
text = "الولية بتاعة قناة روتانا لعبت نفس اللعبة بس راحت فيها<br />مش عارف اسمها ايه بتاعة قناة روتانا<br />حبت تتفلسف وتعمل برنامج عن فتيات الليل<br />والحمد لله انكشف امرها وما طلعوش بنات ليل ولا حاجه وراحت المذيعة في ستين داهية<br />ودي نفس الحكاية اختلقت رواية انو فيه بنتين ولاد خالة بيمارسوا السحاق وقال ايه راحتلهم والنور مطفي علشان خاطر ما حدش يشوفهم<br />اعلام زباله<br />بينتعش ويشتهرعلى اثارة عرائز الناس"
archived = "2009-08-02"
capture_url = "https://web.archive.org/web/20090802054213/http://www.20at.com:80/masr/105-msa7t-r2y/12482-2009-06-27-10-15-24.html"

