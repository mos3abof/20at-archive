posted = "2009-07-01"
text = "اختفاء هالة<br />عقبال ريهام<br />ويروحوا احد نوادى الشواذ فى فرنسا او ايطاليا<br />وترجع واحدة منهم تمسك وزارة الثقافة 22 سنة<br />اصل المستقبل للشذوذ لانة هو الجديد المدعوم من امريكا<br />واللى مايشوفش الشمس من الغربال يبقى اعمى واللى يحجب الشمس بغربال برضة اعمى<br />فى البلد دى<br />الشذوذ هو الحل<br />والسؤال هو اين ذهبت هالة ؟<br />هل راحت مع البنات اياهم واللى تايهة فى شوارع لندن يمكن تقابل عرباوى فى موسم الصيف يعمل لها قناة مخصوصة بعد ان يمارس لعبة الهوكى معها<br />زى اى مهنة<br />فيها الشرفاء<br />وفيها الادعياء<br />وفيها الساقطون<br />والشاذون<br />ومن يبيعون مبادئهم ومن يبيعون اجسادهم"
archived = "2009-08-02"
capture_url = "https://web.archive.org/web/20090802054213/http://www.20at.com:80/masr/105-msa7t-r2y/12482-2009-06-27-10-15-24.html"

