subject = ""
author = "تفكك شعب"
posted = "2009-06-30"
text = "عندما يكون مرتب شاب خريج كلية تربية ويشتغل مدرسا بعقد راتبة 105 جنيهات تكفى لشراء جزمة وشراب او سندوتش فلافل فى اليوم<br />من اين لة ان يفكر فى الحصول على سكن<br />او مجرد ان يحلم مجرد حلم ان يتزوج<br />لماذا لا يتلبسة الشيطان ويعتدى جنسيا على تلميذاتة وطلبتة كما طالعتنا الاخبار فى الاسابيع الاخيرة<br />لماذا لا تمارس الفتيات الفاقدات اى امل فى الزواج الزواج العرفى والشذوذ وكل الانحرافات التى تخطر على البال<br />هناك من يفكك فى صواميل مقومات الشعب المصرى<br />حكومة فى تنام فى مقابر وادى الملوك فى الاقصر الغربى وتعيش على تقدم اجهزة الانعاش الصناعى لتظل اطول فترة ممكنة متشبسة بالحياة وتقضى على مقومات الحياة الاساسية للشعب المصرى<br />9 ملايين فتاة وشاب عانس حسب احصائيات الحكومة بسبب عدم وجود سكن او وظيفة او مصدر رزق وهم عالة على اهاليهم<br />تنتشر حوادث التحرش الجنسى<br />وحوادث الاغتصاب تحت تهديد السلاح<br />وحوادث الجواز العرفى<br />والسحاق واللواط والشذوذ الجنسى<br />والدعارة<br />وبيع البنات للعواجيز العرب فى الصيف<br />واطفال الشوارع<br />والتوربينى<br />وبيع الاعضاء والتجارة فيها<br />رحمتك يارب<br />رحمتك يا رب<br />رحمتك يا رب"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085023/http://www.20at.com:80/masr/105-msa7t-r2y/12482-2009-06-27-10-15-24.html"

