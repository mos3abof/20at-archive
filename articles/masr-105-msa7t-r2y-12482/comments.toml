subject = ""
author = "هشام يونس"
posted = "2009-06-28"
text = "..وربما يصدمك ثالثا أنه بعد تخرجك بثلاثة أعوام اكتشفت أن طالبة درست لها متزوجة عرفيا منذ خمسة أعوام دون علم أهلها رغم أنها ابنة وحيدة والمصيبة أن من تزوحته ليس مصريا وتم ترحيله إلى بلاده لقيامه بعملية نصب وتهريب وأنه ممنوع من دخول مصر وهي مازالت زوجته لكنها معلقة منذ تخرجها منذ ثلاث سنوات لكن أهلها لا يعلمون شيئا أما أنا فقد اكتشفت الأمر بعد أن وسطنى أحد طلبتي لطلب يدها وفوجئت برفضها الحاد وتسرب الشك إلى نفسي أن في الأمر سرا وأنها قد تكون مرتبطة لكني بعد ضغوط عليها لم أكن أتخيل أن يصل ارتباطها إلى درجة الزواج الكامل العرفي غير المعلن ..كانت صدمة لا يمكن وصفها يا علياء لكن الكارثة الحقيقة ألا نبحث في أسباب ما جرى وما يجري ..الكارثة الحقيقية أن نقول أن كله تمام على طريقة التصريحات الحكومية وأن ندفن رؤسنا في الرمال كالنعام هربا من واقع أليم..!!"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085023/http://www.20at.com:80/masr/105-msa7t-r2y/12482-2009-06-27-10-15-24.html"

[[comments]]
