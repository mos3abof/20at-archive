subject = ""
author = "علياء عبد الفتاح"
posted = "2009-06-28"
text = "أستاذي ومعلمي العزيز أ.هشام/ بصرف النظر عن موضوع المقال أو عن أي شيء آخر أنا سعيدة جدا بتعليقك على موضوعي واهتمامك به ..<br />فالفضل يعود إليك بعد الله عز وجل في خلق فينا القدرة على التعبير الحر عن آراءنا عبر سنوات دراستنا والتي كان أبرز ما فيها محاضراتك وتدريبك العملي لنا على الاحتكاك بالواقع الصحفي مباشرة وليس عبر صفحات الكتب والمقررات الدراسية.<br />وبالنسبة لما ذكرته عن المساوئ الموجودة في مجتمعنا فأنا لا أنكرها بالطبع فأنا أعلم وأدرك تماما أننا لا نعيش في مدينة فاضلة وأن مجتمعنا بل والوسط الصحفي والإعلامي بشكل عام مليئ بما هو أسوأ من ذلك وقصة الزميلان اللذان تعرضا للتحرشات لم تكن الأولى ولن تكون الأخيرة!! للأسف<br />ولا أعني بأن قصة بنات ريهام تشبه قصة بنات هالة سرحان بأنه لا يوجد في مجتمعنا شواذ أو فتيات ليل ..إلخ<br />ولكن ما أقصده وأرفضه هو الاستعانة بمأجورات للتحدث عن هذه الأمثلة بهذا الشكل الفج والذي لايصلح أن يقدم للأسرة العربية المسلمة !!<br />أرجو أن تصل فكرتي إليك<br />وأشكرك على التواصل البناء .. تقبل تحياتي"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085023/http://www.20at.com:80/masr/105-msa7t-r2y/12482-2009-06-27-10-15-24.html"

[[comments]]
