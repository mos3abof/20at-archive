posted = "2009-07-05"
text = "فى ايام النبى عيسى جاءوا الية بامراة زانية ليقيم عليها الحد<br />وفى ايام النبى محمد جائتة امراة زانية ليقيم عليها الحد<br />طالما فية حياة وفية بشر فهناك الخطائون<br />ولنهم ليسوا ظاهرة عامة بل عدد محدود من الناس يرتكبون المعصية لظروف ما<br />والاسلام فتح باب التوبة مفتوحا وخير التوابون الخطائون<br />نامل من اللة تعالى ان يرزق هؤلاء المنحرفون من يدلهم على باب التوبة - وتوبتهم تغفر لهم كل خطاياهم<br />ادعوا لهدايتهم وانصحوهم بالتوبة فستر اللة موجود"
archived = "2009-08-02"
