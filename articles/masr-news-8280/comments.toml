subject = ""
author = "ابو الوطاويط"
posted = "2008-02-21"
text = "فى زمن الكرامة المصرية الذى راح كان المصرى الذى ينزل فى مطار دولة خليجية كان يقابل بوفد استقبال وكان المدرس لة وضعة المحترم والطبيب المصرى محترم والمهندس المصرى محترم<br />اما الان - فالوضع حزين<br />حينما يذهب اكبر راس فى البلد الى هناك ليستجدى من شيوخها مساعدات - هل تنتظروا احترام احد<br />حينما كنا نعطى كنا نحترم<br />وعندما نمد ايدينا - فلا احترام<br />الذى يلام هو الذى اوصلنا الى هذا الوضع<br />لوموا انفسكم"
archived = "2010-01-21"
capture_url = "https://web.archive.org/web/20100121171320/http://www.20at.com:80/masr/news/8280.html"

[[comments]]
order = 1
subject = ""
author = "العنود من السعودية"
posted = "2008-02-22"
text = "شباب وكــر العصــافيــر مجمــوعــة مجنسيــن في السعوديــة من سكان المدينة و فــيه فرقة ضدهــا من جــدة يـرأسهم كــلاش .. و مــب أنتم أول من طلعوا لهم اغنيه .. طلعوا اغنية عن اهل الرياض و وحده عن أهل القصيــم بـكلمات بـذيــئة جـــدا .. الزبــده انهم مجموعة سلق مـا تربوا .. يبيلهــم 120 جلــده عن كل كلمة بـذيئة قــالوها .. ســـلآآآآم .."
archived = "2010-01-21"
capture_url = "https://web.archive.org/web/20100121171320/http://www.20at.com:80/masr/news/8280.html"

[[comments]]
order = 2
subject = ""
author = "رياض عبد الله"
posted = "2008-02-22"
text = "هذه محاولة يهودية للفتنة بين شعب مصر والدول العربية والرجاء الحذر منها ونحن في ليبيا نعتز ونفتخر بالمصريين الذين يساعدوننا في بناء البلد في كل المجالات ولقد سمعتها منذ شهرين تقريبا والاغنية لاقت التنديد في اواسط الليبين<br />فلا تغتروا يامصريين بها ومصر هي كبير الامة العربية والكبير كبير"
archived = "2010-01-21"
capture_url = "https://web.archive.org/web/20100121171320/http://www.20at.com:80/masr/news/8280.html"

