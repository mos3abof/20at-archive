text = "عندما يزور احد الرؤساء وبالذات من عندنا دولة خليجية على شاطىء الخليج يتبادر حتى بين الاطفال هناك ويقولون الشحات جاى<br />اى واللة - الناس بتقول الهدف من الزيارة انة جاى يشحت<br />وللاسف دى حقيقة"
archived = "2010-01-21"
