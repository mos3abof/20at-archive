[[comments]]
order = 4
subject = ""
author = "منغاظ"
posted = "2008-02-24"
text = "يا جماعة احنا اللى رخصنا نفسنا<br />تختلف مع عربى او خليجى او سعودى ويكون الحق معاك وتروحوا الشرطة - واول ما تدخل قسم الشرطة رغم ان الحق معاك الضابط ييجى عليك ويشتمك ويقول لك دة غريب وضيف عندنا ويقف مع السعودى او الخليجى ويطلعك متسويش 3 تعريفة<br />ولما تروح الخليج او السعودية وتعمل مشكلة مع اى واحد منهم ويكون الحق معاك وانت مظلوم تتهزأ وتنضرب بالجزمة وتتحبس وتتهان كرامتك<br />السعودية اللى قتلت 3 مصريين وتانى اسبوع كانت فى بلدها<br />والقطرى اللى كان بيسابق فى شارع المطار وقتل اسرة كاملة وتانى يوم كان فى بلدة<br />يا رجال الامن بتدوروا على مين من اللى كتب الكلمات دى<br />انتم اللى رخصتونا<br />طبقوا القانون على الغريب والقريب بالعدل<br />مفيش حاجة اسمها ضيف"
archived = "2010-01-21"
capture_url = "https://web.archive.org/web/20100121171320/http://www.20at.com:80/masr/news/8280.html"

[[comments]]
order = 5
subject = ""
author = "حنة"
posted = "2008-02-24"
text = "بصراحة انا رأيي ان المصري المتضايق ما يصحش ينزل كلام الاغنية المستفز<br />انا سمعتها ع اليوتيوب وهي حقيرة سواء ككانوا اصحابها سعوديين ولا صهاينة ولا اعتقد ابدا انها تعبر عن رأي السعوديين ولا عن اي انسان محترم<br />اما احنا كمصريين ينبغي علينا تجاهلها بمنطق ان عيل صغير وشتمك شتيمة قبيحة ما تعملوش وزن .. احنا مش لسه هنفكر العالم احنا مين<br />وباشكر الصديقة السعودية اللي شرحت لنا من هم دول وكر المحششين المعروفين بوكر العصافير .. ورأيها محترم ومتزن"
archived = "2010-01-21"
capture_url = "https://web.archive.org/web/20100121171320/http://www.20at.com:80/masr/news/8280.html"

[[comments]]
order = 6
subject = ""
author = "طائر الليل الحزين"
posted = "2009-11-26"
text = "بسم الله استعين وعلىالمصطفى اصلى وسائر المرسلين. اما بعد<br />لقد عجبت اشد العجب لما اثارته هذه الاغنيه من شتات الافكار واختلاف الاراء عليهاودعونا نترك كل التنبؤات والاحتمالات التى ساقها البعض عن مصدر تلك الاغنيه<br />دعونا نتجاوز ذلك كله ولنحكم العقل الذى حبا الله به مصر وسائر ابنائها عن العالمين<br />ياساده ان ماقيل ومايقال وماسوف يقال عن كلمات تسئ لمصر وشعبها لهو من قبيل ذر الرماد فى عين الحاذق الارب بل هو قدر مصر الذى تحملته عبر الازمان ومهما قيل فان مصر هى مصر وستظل مصر مناره العلم والتقدم مصر الازهر والاهرام مصر الحضاره والتاريخ مصر المصريين ولااجد اصدق من قول الشاعر فى ذلك المقام<br />قد تنكر العين ضوء الشمس من رمد وينكر الفم طعم الماء من سقم<br />بوركت مصر قائدا وشعبا وحماك ورعاك من لايغفل ولاينام"
archived = "2010-01-21"
capture_url = "https://web.archive.org/web/20100121171320/http://www.20at.com:80/masr/news/8280.html"

