[[comments]]
order = 0
subject = "البيضة ب75 قرش"
author = "انفلونزا اية اللى بتحاربوها -للقضاء على الانفلونزا يجب توعية الناس - الناس الغلابة من شدة البرد بتجيب قفص الفراخ وتحطة معاها فى الاوضة اللى بيناموا فيها علشان الفراخ لا تموت من البرد"
posted = "2007-01-05"
text = "وبالتالى هم الذين يموتون من الانفلونزا<br />انما القضاء على الدجاج والطيور بحجة المرض فكيلو اللحم هيبقى بميت جنية والبيضة بخمسة جنية<br />لاتحارببوا تربية الطيور علشان العيال تلاقى بيضة تاكلها وفرخة تدبحها<br />ولكن اعملوا توعية للناس بنظافة الحظائر ورش المطهرات وغلى اللحوم وبعض العادات الصحية"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130165015/http://masr.20at.com:80/article.php?sid=1401"

[[comments]]
order = 1
subject = "إيه رأيك يا ماما سوزان ؟؟؟؟؟"
author = "إبن بهيه"
posted = "2007-01-06"
text = "بلاش نربي طيور .. يعني بلاش العيال ياكلولهم حتة جناح فرخه كل شهرين .. وبلاش كمان يلاقوا بيضه الصبح وهم رايحين المدرسه .. طيب إيه رأيكم نموت العيال ونخلص ؟؟؟<br />مش تقولي حاجه يا ماما سوزان ؟ فالحه بس تتنططي في الشوارع وتقفليها زي المتعوس جوزك وانتي رايحه تفتحي حضانه هنا ولا هناك ؟<br />طيب حضانة إيه والعيال مش لاقيين ياكلوا ؟<br />يا ماما سوزان .. سامعاني .. ما تربيلنا شوية فراخ في العشه بتاعتك عشان عيالنا يلاقوا بيضه يفطروا بيها ورجل فرخه يمصمصوه .. إيه رأيك مش تكوني عملتي حاجه حلوه في دنيتك بدال العك بتاع أهلك ده كل يومين وتقفلي الشوارع؟؟؟<br />يا ريت كمان تكون فراخ بتاعتك عيانه وتنتقل العدوى للواطي والجرو الصغنن ونخلص بقى .. والله ساعتها الشعب هيدعيلك مرتين .. مره عشان الفراخ ومره عشان خلصتيهم من حرامي الفراخ وإبنه<br />روحي يا شيخه ليكي الجنه لو عملتي كده ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130165015/http://masr.20at.com:80/article.php?sid=1401"

