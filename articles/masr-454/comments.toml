posted = "2006-07-22"
text = "بجد انتوا حركتوا مشاعر وحماس جوايا<br />الكلام ده بالنسبه ليا كدى جي مبتدئ<br />انا أول مره سمعت وسط البلد كان من سنه او أكتر كان بالصدفه و انا اعد جامب الراديو لكن مركزتش أوي<br />لكن النهارده لما شفتكم منورين البيت بيتك و سمعت الاغاني بتاعتكوا مئدرتش امسك نفسي و طرت علي النت بسرعه اشوف ايه الموضوع ..ووصلت هنا للسايت الهايل ده (عشرينات)<br />و نفسي في حاجتين اني اسمع اغاني تاني للفريق<br />و أعرف مواعيد اققرب حفله ليهوم في اي حته<br />..معلمه أخيره انا كنت خلاص شبه زهقت من الاغاني العربي التقليديه ديه<br />اللي مفيهاش اي جديد بلعكس مستوها!! بينزل<br />لكن لما سمعت وسط البلد حسيت أني ممكن أقدر أسمع أغاني عربي فيها كل الجديد"
