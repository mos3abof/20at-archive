[[comments]]
order = 2
subject = "إنها ثقافة الضياع واللاوعي"
author = "زعلان وحزين"
posted = "2006-06-01"
text = "إنها مترادفات ثقافة الهزيمة والضياع . هل تذكرون قمة الذوق الغنائي .أم كلثوم وعبدالحليم وعبدالوهاب ونجاة وفيروز وفايزة وفريد ومحرم وغيرهم في الستينيات ..ثم عندما قامت القيامة في 67وصحا الشعب على الفاجعة والهزيمة القاتلة وضياع الحلم العربي والمجد والسؤدد..هنا في حالة الضياع والتخبط والانهيار لم يعد لأي شئ قيمة فلا قيمة للعقل ولاقيمة للحلم ولاقيمة للمنطق ولا قيمة للصدق ولاقيمة للمستقبل ..فبزغت أغاني السح الدح امبو ..والعتبة جزاز والسلم نايل في نايلو.. وياحلوة ياللي قومي استحمي.. وكان مردودها والإقبال عليها عظيما من كافة طبقات الشعب حيث انها كانت تعبيرا هلاميا للضياع ومحاولة في الاستغراق في اللامعقول واللامنطقي ... إلى أن تم استعادة جزء كبير من الوعي في حرب اكتوبر 73.. ثم عادت الانتكاسة مرة أخرى وأشد من سابقتها حينما فقد الشعب البوصلة مرة أخرى تحت وطأة القهر والبطش والاستغلال والدكتاتورية وقتل طموحه واغتصاب حقه حتى في الحياة الكريمة مع اسوداد النظرة للمستقبل ... فعادت من جديد السح الدح امبو ولكن بأشد هلامية وضبابية وركاكة وفجاجة وزاد الإقبال على أمثالها من أغاني وكليبات العري والضياع والانغماس في اللاوعي ...الأمر الذي يؤكد أننا نعيش في مرحلة انسحاق الذات بأشد وقعا من مرحلة هزيمة يونيو .... والمفجع أن يكون طعم المرارة هذه الأيام رهيبا للدرجة التي يعتبرمعها مرار الهزيمة في 67 مستساغ المذاق قياسا إليها..... فإلى أين يقودنا ...كعبو"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133338/http://masr.20at.com:80/article.php?sid=426"

[[comments]]
order = 3
subject = "القنبلة النووية في شرحة الاغنية العدوية"
author = "اكرم كرميلينو كرملله"
posted = "2006-06-01"
text = "للاسف يظن البعض ان هذه الاغاني البيئة مش من بيئتنا و لكن العكس - على ما يبدو لي - هو الصحيح<br />فهذه الاغاني تعبر عن الكثرة المطحونة مننا و لا تعبر عن القلة القليلية المندسة بيننا من المثقفين امثالي - و العياذ بالله - و امثال من يدخلون على هذا الموقع و يكتبون فيه<br />و لنقارن بين اغاني احمد عدوية في السبعينات و اغاني عبد الحليم حافظ او حتى عبد الوهاب<br />المقارنة ظالمة فاغاني عدوية قريبة من الشعب و لا تغزل السلطان ( يا بنت السلطان حني على الغلبان دي الميه في اديكي و عدوية عطشان ) فهي تبين الفقر و العطش في الشعب رغم امتلاك السلطان القدرة على كف ظمأه<br />ادي الواد لابوه ( اي اعطي الشيء لاصله) و هنا تظهر الفكر الاصولي عند عدوية و هو فكر اصيل في الشارع و لا دخل للحكومات به<br />شيل الواد م الارض ( هي دعوه للنهضه و هي نفي عن تهمة الجمود التي تلتصق بأي اصولي )<br />الواد عطشان اسقوه ( دعوه ايضا لحل مشاكل البلد على اساس ان الاعتراف ان في مشكلة من الاساس هي اول العلاج )<br />الواد ده لسه صغير قاعد باللفة يغير ( تدل على ان بلادنا في المرحلة الاولي من النمو و تحتاج الى كل الجهود لترتقي )<br />و في البداية و النهاية السح الدح امبو<br />قد تقولون اني من المهيسين او المهرطقين و لكن هذا ليس رايي وحدي و لكنه راي كثير من المثقفين - للأسف - قللدكتور يحيى الرخاوي مقولة ان شعبان هو اكثر المعبرين عن رأي الشارع و الشاهد اغنية مبحبش الكراس<br />و نص مقطعها<br />مبحبش الكراسي<br />و لا احب شكلهم<br />كان عندي اربع كراسي<br />امبارح بعتهم هيييييييييييه<br />و هي من وجهة نظري تعبر عن الوضع الراهن للشارع الذي كفر بالسلطة و بكل الكراسي التي تعاقبت علية و يريد الانقضاض على هذا النظام ليبيعه<br />و لكن الفرق بيننا كمثقفين - للأسف - اننا لا نمتلك العفوية و الصد<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133338/http://masr.20at.com:80/article.php?sid=426"

[[comments]]
order = 4
subject = "مالها الاغانى الهابطه!!!!!!!!!!!!"
author = "عاشق الشعبى!!!"
posted = "2006-06-01"
text = "خلاص كل الناس اصبحت مرفه الحس ومش لاقيين حاجه يشتكو منها!!!!<br />والله اللى يتريق على الاغانى الهابطه- لا اقصد احدا بعينه- يبقى يشوف له خيبه تلمه احسن لان دى تبقى عقده نقص فيه وعايز دايما يحس انه احسن من الاخرين فى اى حاجه حتى لو كانت انه مابيسمعش اغانى بيئه كما يقولوا عليها!!!!<br />ومش بيكون- المعقد نفسيا- فالح الا فى سماع اغانى الحب والهيام وغدر الحبوبه ننوسه امها اللى احنا مش فالحين الا فيها وهى دى الخيبه القويه عن حق !!!<br />والصبح تلاقيه بيشتم فى الشعبى وفى اليبت مش بيفتح الا ميلودى علشان يشوف هيفا ونجلا والحصان واجدد كليب لجاد شويرى واخبار القناع مع تينا وووو<br />وياجماعه كل واحد ينام على الجنب اللى ريحيه<br />اللى عايز يلعب يلعب<br />واللى عايز يرقص يرقص<br />وبدلا من ان ننقد الكبار على اغانيهم الممله نتحدث عن الاغانى البيئه اللى مش بيسمعها الا الغلابه<br />وفى فيلم الكيف قال محمود عبد العزيز جمله اثيره مع سائق التاكسى فى اول الفيلم<br />(لازم ندوش الدوشه بدوشه ادوش من دوشتها علشان ماتدوشناش)<br />وكمان على فكرة كل الاغانى الشعبيه لازم نطلع منها بدروس تمام<br />زى مثلا النجم الكبير على صالحين فى رائعته التى تقول<br />الدنيا زى الفرس بتمتع الراكب<br />طول مانت معاك المال علضهر راكب<br />او تناقش قضايا يخجل الجميع منها مثل الرائع حامد عبده وهويتحدث عن اسباب الخيانه الزوجيه ويقول<br />اهى قعدت قصادى وعطتنى سرها فى الحال<br />اتارى اللى واخدها عندة رمضان زى شوال<br />انا قلت لها ياغداره جوزك عامل ايه على دة الحال<br />قالت لى جوزى زى الشوال<br />بينام من المغرب!!<br />او تناقش مشاكل حرمان الشباب<br />كما يقول احدهم<br />يالهوى على بيحصل وشبابنا كله ضاع<br />عايز يشوف له لقطه لو حتى بالدراع<br />ولمن لا يحب او لمن ينزعج من هذه الاغانى انصحه انه<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133338/http://masr.20at.com:80/article.php?sid=426"

[[comments]]
