[[comments]]
order = 7
subject = "الجو العام مش ولا بد"
author = "زيزيتا"
posted = "2006-06-04"
text = "أنا شخصياً من عشاق أم كلثوم فقط لاغير .. يعني لا أسمع الا القرآن الكريم وأم كلثوم .. الا انه يعجبني جداً بساطة شعبان عبد الرحيم وكلمات وافكار اغانيه .. اعتقد انه (برغم الفارق الكبير) امتداد لفنان الشعب سيد درويش (بالمناسبة سيد درويش كان من أكبر متعاطي البودرة ) علشان بس الصورة تبقي واضحة .. المشكلة عندنا هي المناخ اللي احنا عايشين فيه لكن فيه مبدعين كتير وفيه ناس كويسين كتير لكن نعمل ايه في العيشة الهباب اللي عايشينها والحمد لله الذي لا يحمد على مكروه سواه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133338/http://masr.20at.com:80/article.php?sid=426"

[[comments]]
order = 8
subject = "نسيتوا المولد!"
author = "قلم جاف"
posted = "2006-06-04"
text = "نسيتوا الكلام عن مقطوعة المولد.. أيقونة الموسيقى البيئة في مصر المسكوت عليها؟.. اشمعنى ما حدش اتكلم ولا حلل المقطوعة من شجرة دي بينما الهجوم نازل يرف بعنفوان على اللمبي؟ ولا محاولة لرشوة الطبقة البيئة في مصر؟<br />يا جماعة الخير حطوا النقط على الحروف (مش زي اللي عايزاه بوسي سمير).. فيه فرق كبير بين البسطاء الفقراء وبين السوقة .. التي تمثلهم تماماً مقطوعة المولد وتابعتها الواو الواو الواو .. وجاء سعدالصغير ليمثل تلك الطبقة خير تمثيل غناءً وتمثيلاً .. طبقة السوقة دي تابو محدش عايز يقرب منه ، ولا يعرف الظروف اللي كانت ورا نشأته .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133338/http://masr.20at.com:80/article.php?sid=426"

