posted = "2006-06-08"
text = "يا جماعه انا واحد من الناس بسمع لكل الناس من غير ما أسد وداني ولاكن<br />في اغاني بيئة جدا و قذرة جدا على سبيل المثال لا الحصر<br />أغنية أسمها ( أنا نفسي اعمل واحد ) و الله العظيم أسمها كده و عندي<br />بقى بالذمة ده أسم اغنية ده ؟<br />و اغنية تانية لبلبل الحواري المصرية الي غنى من خمسة لخمسة و نوص مغني أغنية اسمها سعدية غاية في القذارة مينفشع الاغاني دي تشتغل قدام أي حد !!!!!<br />و في واحد تاني صوته أسؤ من نباح الكلاب مغني أغنية من احلى ما غنت الفنانة الراحلة ذكرة أغنية و حياتي عندك اسمو علي الصالحين صوته زفت و يرجح ان جوز ذكرى الله يرحمها لم سمع صوت الشخص ده قتلها عشان كده !!!!<br />و نفس الشخث ده مغني اغنية باسم تلاعبني ألاعبك اغنية لعشاق الدومنة ... أنعم و أكرم"
archived = "2006-06-15"
