posted = "2006-07-05"
text = "كل واحد عمال يذم فى الاغانى دى وكانه مابيسمعهاش طيب لما انت مش بتسمعها عرفتها ازاى وحكمت عليها وفنطتها وسمتها وعددتها ........عادى يا جماعه دى اذواق ومش بتعبر عن انحطاط الفن ولا تدنى المستوى عادى يعنى زمان كان فى اغانى زى كده يعنى مثلا لعبنى عشره كوتشينه فى البلكونه دي اغنيه قديمه موت واغنيه عبد الوهاب الميه تروى العطشان اغنيه واحد بيستحمى ايه يا ناس فى ايه عايزين تنقدو كونو موضوعين .<br />وبعدين بذمتكو اللى بيتريقو على الاغانى دى مش هى دى الاغانى اللى بتهيص اى مكان فى مناسبه ولا تهيصو وبعدين تيجو تنتقدوووووووو."
archived = "2006-09-04"
