text = "الاغنيه اغنيهومتدوهاش اكبر من حجمها ومتتعداش علي انها تسليه او مضيعه للوقت واللي يقول غير كده يبقي لامؤخذه يعني<br />متحولوش بقي تفلسفوا الكلام وتقولو ان دي هادفه او مش هادفه لاننا مش هنتعلم من الاغاني يعني والا ايه<br />وبعدين الاغاني القديمه فيها حاجات غريبه<br />وميصحش تتقال برضه<br />ذي اللي بتقول منتاش خيالي يا ولا<br />تقصد ايه بخيالي اظن المعني واضح<br />والا الطشت قاللي يا حلوة ياللي قومي استحمي ..............الخ<br />وشكرا"
