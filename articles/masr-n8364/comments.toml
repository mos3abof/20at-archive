subject = "على فكرة محدش فاهم حاجة"
author = "احمد إمام"
posted = "2006-07-06"
text = "على فكرة ياجماعة هم دول الناس اللى حاسة بمشاكلنا وبتغنى عليها ليه ماسكسن الخامسة والحاجات الهابطة دى ياريت لو حد فيكوا يعرف احمد بيليه وهو ليه شوية اغانى جميلة كمثال الناس وسألت نفسى لازم تبص للجماعة دول على انهم اللى بيمثلونا مش المغنيين بتوع اغانى العش والهيام واللى طالعين ملط من غير هدوم على الشاشات دول ناس لامؤخذة فى الكلمة مش فاهمين حاجة فى الدنيا غير انهم يجيبوا فلوس من عرق جسمهم او من الاغانى اللى بتحسس الواحد انه عايش فى دنيا تانيه<br />وآخر كلامى ياريت تسيبوا الناس دول فى حالهم علشان الناس نسيبكم فى حالكم"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904062048/http://masr.20at.com:80/article.php?sid=426&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

