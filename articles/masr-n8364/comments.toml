subject = "جلبي مساكن شعبيه ....."
author = "هووووووووبه"
posted = "2006-06-02"
text = "الكابتن اللي فوق بتاع الربع جنيه والاتوبيس وحاله خوار ماله الموقع بنفضفض يا بني الموقع اسمه ولاد البلد وبنات كمان ومش شرط اللي يعلق يكون مثقف يعني لو مصري وطفحان الكيل وشاف الموقع حيسب ويشتم وحيطلع اللي في نفسه ونفس الشي المثقف \" اللي زي سعادتك\" لما يشوف الظلم حيتكلم بردو, ومالهم يا خويا اللي بيدخلو الموقع\"حاجه كخه\"يعني ولاه ايه , براحه يا اكرم وتقبل راي بصدروفشه رحبه , الكابتن التاني ابدعت يابني بصراحه انتو الاتنين عجبتوني اكتر من الموضوع الرئيسي ."
