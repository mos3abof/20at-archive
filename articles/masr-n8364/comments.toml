[[comments]]
order = 15
subject = "احنا ولاد مين ياعم"
author = "هيثم محمد حشاد"
posted = "2006-06-08"
text = "هو احنا ولاد مين ياعم اغنيا شعبيه بيئيه ملهاش حل سمعتها في فرح ولقيت الناس فرحانه والبهجه مغطيه على الجميع زي الدخان بالظبط اللى كان موجود برده ومغطي على الجميع طبعاً مش اي دخان دى دخان متكلف وان كان هو دى الحل لنسيان الواقع المرير فهيا بنا الى المولدوالمسكرات الحديثة والله الكلام دى صح الاغاني دي بالضبط بتعمل غيبوبه وكل اللى بسمعوها من الجامعين مش بس سواقين الميكروباص والتكسي والاسواق الشعبيه بس دى بجد الشباب لقت فيه حل لنسيان انه متخرج بقالو كذا سنه ولسه بياخد المصروف من بابا وبنت الجيران الي فضل يحب فيها 6 سنين اتخطبط بعد ما ابوها قالوا روح يا حبيبي كون نفسك معندناش بنات للجواز وبعد ما الحكومه قالتله معنديش ليك وظيفه وبعد ما الزعيـــــــــــــم زود الطينه بله وحال البلد اللي بقى قلهفمعتش قدام الشباب غير الحل دى يشرب ويسمع يشرب ايه الله اعلم وبيسمع ايه الله اعلم وبقت الحياه عندنا كلنا \" هو منين بيودي على فين \" وادينا ماشين شويه مع شعبان وشويه مع حزمها كمان وكمان واهو كله خبط على الدماغ والملاحظ كمان على الاغاني الشعبية البيئية انها تضفي نوع من اللمعان بتخلي الحياه كده زي شعر كريه مضروب عليه شوية جل وسيجاره في دك وماشي على البحر هو دى الاحساس اللى انا كنت بتوصله بعد سماع الاستاذ حماده محرم لو حد يسمع عنه والموسيقار الكبير ايضاً الذي وضع الخطوط الاولى لموسيقا المولد الحاصله على 10 اوسكار واتنين شاى و3 شيشه بشهاده الشعب<br />فياريت والنبي منستغربش ونتكلم على حاجه احنا كلنا عايشين جواها حتى مش في الاغاني دي وبس كل واحد بيحاول يتوه بالطريقه اللى تريحه وعلى راي اللمبي يا تبنو مدارس يا تزودو الكله احنا بقى هنقول يا تشغلونا يا تزودلنا الكيف عشان نتكيف مع الواقع<br />وعاش الزعيم عاش وعقب<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133338/http://masr.20at.com:80/article.php?sid=426"

