subject = "القاعدة منضمة ارهابية"
text = "هلهناك وجود حقيقي للقاعدة ام انه كذب ودجل ليلصقو جائمهم بالاسلام والمسليمين"
archived = "2004-06-05"
capture_url = "https://web.archive.org/web/20040605095224/http://www.20at.com:80/article.php?sid=47"

[[comments]]
order = 1
subject = "فلسطينى الجنسية"
text = "لو كانت تنظيم القاعدة ارهابة لما شجعنام بشعبنا المناضل والمكفح من اجل القدس<br />القدس للمسلمين جميعأ ولزلك انا اسامة بن لادن يحارب من اجل مسجد الاقصى اشريف"
archived = "2004-06-05"
capture_url = "https://web.archive.org/web/20040605095224/http://www.20at.com:80/article.php?sid=47"

[[comments]]
order = 2
subject = "فلسطينى"
text = "لو ان تننضيم القاعدة منظمه ارهابيه لما عاش اسامه ابن لادن فى الكهوف لو انه ارهابى لعاش فى القصور اننى احب تنضيم القاعدة لو استطيع لانظم اليه"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803120515/http://www.20at.com:80/article.php?sid=47"

[[comments]]
order = 3
subject = "aissa_38@hotmail.com"
text = "بسم الله الرحمان الرحيم<br />وبعد<br />احيي الاخ القائد الكبير اسامة بن لادن علي نظاله في سبيل جهاده ضد الامريكان والصهاينة اعداء الله والرسول<br />صلي الله عليه وسلم و ااكد للاخ المجاهد اسامة بن لادن دعم الشعب الجزائري له ولكافة جنوده واتباعه وجميع من يظرب الاهداف الامريكية والصهيونية في سائر بلا د المسلمين<br />و العرب ونحن هنا في الجزائر لا يطمئن بالنا الا ونحن نرى ونسمع ان امريكيا او صهيونيا مات او قتل و نرجو منك<br />وكدلك نطلب منك الن تقتل كل من تمت له صلة با خوان القردة والخنازير و في الختام ندعو الله سبحانه ان نصرك و يلهمك الصبر والسلوان في عملك الدي جلب للعرب بعض الامل والارتياح في ظل صموت اشباه الحكام ان لم اقل انهم كدلك اخوان القردة و الخنازير بسبب اظطهادهم لشعوبهم الصابرة والابية<br />وفقك الله في مسعاك والهمنا جميعا الصبر والسلوان<br />والسلام عليكم و رحمة الله وتعالى وبركاته"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803120515/http://www.20at.com:80/article.php?sid=47"

