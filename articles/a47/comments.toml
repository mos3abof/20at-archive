[[comments]]
order = 5
subject = "الشيخ اسامه أمام المجاهدين في هذا العصر"
author = "سأل الله الكريم ان يبارك لنا في الشيخ أسامه وان يقوي من عزيمته حتى يعطي للامريكان ومن على شاكلتهم الدرس القاسي حتى يعلمو ان الاسلام لم يمت وأن هناك من يسخرة الله حتى يؤدب الكفرة والمشركين ."
text = "الهم انصر الشيخ أسامه بن لادن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154605/http://www.20at.com/article.php?sid=47"

[[comments]]
order = 6
subject = "الجهاد في بلا د الرافدين"
author = "يف للاإنسان عاقل بقبول الجهاد في بلاده وههي أمنة هل الجهاد على الاأممنين في بيوتهم اطفال ونساء يقتلون وهم مسلمين هل هذا الجهاد في بلاد الرافيدين"
text = "والجهاد في المملكة ضد الاجانب المستضعفين والدولة في امس الحاجة لهم لتطوير البلد لصالح المواطن وهذا كله منافي لي عقيدتنا الاسلامية وهناك اماكن للجهاد في العراق ضد الجيش الامريكي اذلهم الله وفلصطين الحبيبة عودو لعقولكم لاأعلاء راية الجهاد ضد اليهود عليهم لعنة الله واين العقول والعراق ينادي ضد الاحتلال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154605/http://www.20at.com/article.php?sid=47"

