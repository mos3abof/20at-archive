[[comments]]
order = 0
subject = "و الله جيمي معذور"
author = "عابر القارات"
posted = "2006-03-30"
text = "أنا شفت البرنامج بتاع إتكلم ده و أولا أحب أبشركم إن لو الاستاذ جمال مبارك إتولى حكم مصر بعد باباه و ده بعد عمرا طويـــــــــــل فأبشركم بكارثة و مصيبة يمكن رشها على كل مصايب اللى حلت و هتحل على بلدنا المغلوبة على أمرها ليه بقى!! أولا لأن اللى شاف و بيشوف جمال مبارك و أحاديثه سواء التلفزيونية أو الحزبية يكتشف من أول كلمة بيقولها أنه لا عنده الشخصية الجذابة اللى ممكن تجذب الناس من حواليه و لا عمق التفكير و لا حتى أهم حاجه بيبصلها الشعب الذكى اللماح و ليها تأثير السحر عليه و هيه خفة الدم و سرعة البديهة و ده و الله أنا بأعذر السيد جمال عليه فممكن مثلا السيد جمال يبقى مهندس شاطر أو طبيب ماهر أو حتى محامى ناجح لكن مش لازم يكون رئيس جمهورية و أعتقد أنه هوه نفسه حاسس بكده لكن طبعا ما يقدرش يكسر كلام بابا و ده بيفكرنى بالافلام المصرية القديمة اللى بيكون الولد مثلا عاوز يدخل كلية الفنون علشان يطلع رسام فيظهر فى الفيلم الاب القاسى اللى هيحرمه من الميراث لكنه عاوزه يدخل كلية التجارة علشان يمسك محلات البقالة لأنه شايف إن الفن ما يأكلش عيش و مهنة هايفة ... فتماما ده اللى بأحسه لما بأفكر فى موقف السيد جمال مبارك ... و على فكرة اللى شاف برناكج العاشرة مساءا إمبارح و شاف جيمى مبارك و هوه بيفتتح مشروح تحسين العشوائيات و بصفته رئيس جمعية المستقبل و شافه و هوه بيتكلم مع الناس و بيسلم على الغلابة قاطنى العشوائيات يحس بالكلام اللى قلته جدا .... عموما يمكن المؤهلات الغائبة عن السيد جمال و اللى هي غائبة عن رؤساء جمهوريات كتير يمكن مش هتكون عائق إنه يدخل كلية التجارة و يمسك محلات البقالة زى ما قال بابا"
archived = "2006-09-05"
