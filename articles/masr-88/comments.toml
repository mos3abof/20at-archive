text = "يا للعجب<br />سمعت من احد اصدقاءي ان ابن مبارك ذهب الى اميركا من اجل صلعته<br />تذهب الي اميركا كي تزرع شعر جديد !<br />واكثر من 40% من المواطنين تحت خط الفقر !.<br />يا للخجل.<br />هيهات منا الذلة<br />حسبي الله ونعم الوكيل<br />مع تحيات مواطن عربي وطنى قومى"
