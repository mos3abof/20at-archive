order = 5
subject = "احلم وما تخفش"
author = "مني ممدوح"
posted = "2006-12-03"
text = "يا شعب قوم يا شعب قوم يا شعب قوم ذي السيل غرق كل شء فاسدخذ حقك في الحياة انصر دينك صح اي كان بتباع تعاليمةونفذ صح ياشعب احكم صح احنا الحكام احنا الشعب لازم يكون ليك رد موة تنحي محد هايقول لا ولاحتي بمظاهرة قاعد يعمل ايةلايصح ائلا الصحيح انتةفاشل حتي في السياسة انتة اكبر كذبة في البلد كذبة ابريل ائلي الها اساس قاعد لية بس العيب مش عليك علي الشعب ائلي سايبك تشيل وتحط فية ربنا يرحمنا منك انتة وهما وتروحة سوي في شوطة ذيانفلونزا الطيور يكن حد فيكم يموت ونرتاح يا من الشعب يا من الحاشية ائلي حولية هو كدة كدة طالع مالوش لزمة ونغير النشاط ونعمل كفتة اصل محبش اللحمة وندفن الجثة احسن ريحتها فاحت وصلت لكل مكان وبقي ؤثر بس غبي اسلوة رخيص اصلة سرطان محتاج استئصال قو ياشعب قوم كفاية نوم يازارع يامدارس يجامعة ولوني مش عايزة احسبة مش موجودة مالهاش مكان في الحسبة ما علينا احسن يحطهم معتقل المستقبل يضيع اصلة مشرق منور ذي القمر طفوة ويقولة حبة البلدي دة كلام اعمل مظاهرة اميلوحدك هاتتقابل بمؤثر ها تلاقي نفسك في جامعة او ميدان او حتة واسعة او حتي اعتصام كفاية عمل المبادي اولي عان نعرف نحس بالامان هنتقابل ن غير ميعا حددة الزمان والمكان ونحس ببعض من غير مؤثراصل الوضع غلط وطال والبعد جفي اصل يشعب بعدنا عن بعض ن زمان انا مصر انا ماما مش هي انا دولت قومة قومة عشاني وانا مش لازمني ومش عايزة انا كنت فاكرة ذي ما افتكرت انا حبيبي معاية مش محتاجة جاجة من حد الفارس بتاعي مسافر اصل عامل عملة رجوعة بس صح يا ولادي يا بناتي انا سامعة انا فاهمة بس بالكلام لا عايز فعل قربة ن الحكم انتةمحرممين من من زمان احرموة ذي ما حرمنا خذة دي حق رجال الثورة راح زمنهم احنا ولاد النهردة احنا ولاد البلد دي عيشة صح احكم نفسك بنفسك<br />اقرأ بقية التعليق .."
