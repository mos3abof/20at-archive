[[comments]]
order = 2
subject = "لن اتكلم"
author = "منتصر حلمى محمد"
posted = "2006-04-12"
text = "في حوار الاستاذ جمال مبارك مع الاعلامية لمييس الحديدى ساق الاستاذ جمال مبارك مجموعة من المغالطات منها على سبيل المثال ادعاؤه ان الاصلاح الأقتصادي الحالى الذي بدأه سيادته في عام 2000 قد حقق نجاح ولكن هذا النجاح لم يشعر به المواطن وان سيادته لا يفكر في الترشح لرئاسة الجمهورية وليس لديه رغبة في ذلك وغيرها من التعليقات القاطعة الحاسمة التى لم تؤدى الى تطمين الشعب والمثقفين او تفهمهم شئ واضح في بلد تلفه الغموض كل تصرفات اهل ىالحكم به .<br />فالسيد جمال للم يعرف احد من الشعب ان هناك عملية اصلاح شغاله منذ عامان و الحقيقةان لا اصلاح ولا غيره فكيف يكون الاصلاح الاقتصايد ناجح ولدينا دين داخلى مقدره 400 مليار جنية ولدينا دين خارجى قدرة 29 مليار دولار ويكون الاجمالي بالتقريب حوالى 614 مليار جنية مع الاستمرار في الأقتراض لتسير احوال ابلد مع ارتفاع جنونى في الاسعار حيث تتجاوز معدلات التضخم الرقم 6 % المعلن دائما وال1ي احيانا تخفضه الحكومات الى 4 % كنوع من رفع معنويات الحكومة لأنفسهم كما اننا نعانى معاناة حقيقة من انهيار الصناعة المصرية والقضاء على الطببقة العاملة الماهرة وتحويل البلد لمجموعة من التوكيلات فقط لا غير. ......<br />كما لا يزال ملف التوريث قائم حيث ان النصوص الدستورية الحالية تعيدنا لنقطة الصفر فبل تعديل المادة 76 ولازال البرلمان هو القادر على تحديد شخص رئيس الجمهورية الذي والبرلمان جاء بعملية تزوير ضخمة وقتل وسحل شهد به القاصي والدانى كما ان اصرار القيادة السياسية على عدم المساس بالمادة 77 من الدستور امر يثير الاستغراب فاذا كان الرئيس قد اعلن انه لن يرشح نفسه مرة اخرى والاستاذ جمال ليس لدية رغبة فلماذا الابقاء على المادة 77 ولماذا لا يتم العودة للنص القديم باقتصار الرئاسة على فترتين<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223906/http://masr.20at.com:80/article.php?sid=88&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

