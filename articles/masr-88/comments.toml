[[comments]]
order = 4
subject = "وبعدين يابلد ؟"
author = "mona"
posted = "2006-11-23"
text = "حزب اية ائلي يرشح دئة حتي المواسير عندة ضارية خالص وريحتها ملة البلد وعفنة الاسورة الام دايرؤة تلم والكوع الاب بيحارب وبيلم اشي مقاول انفار عشان يضمن الموني واشي بيدور علي نجة مخفية وجهة جديد يعمل منها برواز يجلس من خلالة والنجم المطفي الجيمي بيسمع الكلام ويقول حاضر يابابا ائلي تشوفة المهم كرسي العمودية ما يطلعش برة البيت شوفلي حل ياباباب هي خديخة طويلة قوي بس هي الحلوة معائها شأن وقلوب الناس ائلي بتفهم وهما كثير سيبك من ائلي بيتغابي ميعرفشش ان الحلوة مصر ماما دولت مع ائلي يستاهل مالهاش في المجاري الضاربة والفارسبيحاول يوصلة لكن بيمنعوة وحالف ليكون تقي ويكون خير اجناد اللة في الارض لخدمة الوطن ومافيش مجاري هاتضرب في البلد وقال واللة لسترهاقالت ياابن بلدي مستورة بس هو القدر ائلي جمعنا من غير معاد عشان الذباب يمشي ويروح مكانة في الذبالة بعيد عن مصر الحزب دئة يادوب يعمل مؤتمر يقرفنا فية بريحة عرقة الوحشة قوي ونادت البلد قالت وحشني نفسي ام ريحت اصصل ريحتة طيبة والبلد اتخدش ائلا كل طيب ويارب اكون احترت صح ربنا نادي من فوق انتي طلبنتي تقي وانا اخترت وربنا حارسكم من سابع سماء لا وطني ولااونطا اصل انا بلدي مصر ومش بعيش اونطا علي حساب طنط حقوق المراة ياخي طظ روحي لي شعرك سد المجاري فضفحت قيح وقذذ ومصر بنتادي باعلي صوتها وبتقول وحني يا لاكي الحارس وتغني كمان وتقول حببي كان هنا مالي الدنيا عليا وعدني بتوصيلة وعبور الي المستقبل بجد مش كلام وبيوفر كمان اصلة حريص علي حبة للبلد وهوسواق ماهر راكب تاكس وهايركب بعدية كل الناس ائلي تستحق مش راكب حمار بيرفص في الناس ويما تكلم صوتةيجيب الشيطان ويادوب لو حد حاول يركب يا الواد لاابوة يعني ركبة سواء الحمار بن وقرب يموت ان مكنش مات وبيطلح في ال<br />اقرأ بقية التعليق .."
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218162722/http://masr.20at.com:80/article.php?sid=88&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

