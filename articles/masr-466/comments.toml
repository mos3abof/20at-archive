subject = "التغيير"
author = "محمد حسن غنيم"
posted = "2006-06-11"
text = "أستاذي هويدى - ان كان الله لا يغير ما بقوم حتى يغيرا ما بانفسهم كيف نتغير و نحن لا نلد الا مثلنا ...\" و قال نوح رب لا تذر على الارض للكافرين ديارا انك ان تذرهم يضلو عبادك و لا يلدوا الا كافرا فجارا \"<br />مللت من الحديث عن التغيير فمن الاسوا الى الاتعس و حالنا هو هو.. سيدي لست اعلم كيف ابدء حديثي .. لكن اسال الله ان يفك كربتنا"
archived = "2006-09-09"
