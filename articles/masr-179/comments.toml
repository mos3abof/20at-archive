[[comments]]
order = 1
subject = "هو مين ده إللى بيقول الكلام القذر ده"
author = "مصرية"
posted = "2006-04-20"
text = "هذا الكلام الذى يقوله لا بد وأن يكون رئيساً معترف به ولكنه ليس رئيساً ولا يملك الشرعية لحكم مصر لأنه لم يأتى فى يوم من الأيام عن طريق الإنتخابات كما قال الدستور المصرى ولكنه جاء فى ظروف مشوبه بالإتهامات وفرض على الشعب وليس له أى حق فى التصريح بإسم مصر أو الكلام عن هذا الشعب الأصيل الذى أهدر كرامته هذا المتسلل للحكم والمغتصب للكرسى ولنقول له من أنت حتى تقول هذا الكلام عن أسيادك من أبناء الشعب لا يعرفونك ولم ينتخبونك فى يوم من الأيام أنت مجرد مغتصب شأنك شأن أى أحتلال تتعرض له أى دوله وسيقاومك الشعب ويتحرر من وجودك المغتصب وستحدد إقامتك لتعرف كيف يكون الإحترام للمصرى الذى إستوليت على ثروته وكممت فمه وإغتصبت إرادته أيها المحتل البغيض"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030836/http://masr.20at.com:80/article.php?sid=179"

