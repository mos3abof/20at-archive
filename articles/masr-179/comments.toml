[[comments]]
order = 9
subject = "أصله شبع"
author = "مصرى"
posted = "2006-04-23"
text = "حينما أرى حسنى مبارك الآن وهو يتكلم أشعر أنه ليس الذى كان يتكلم عند توليه الحكم لأنه كان ساعتها عارف هو عامل أيه وحاسس بالبطحة إللى على رأسه لكن بعد لما مص دم الشعب وكمم كل أفواهه وطغى فى البلد وإعتبر أن البلد دى من أملاكه بدأ يتفرعن ويقول كل إللى نفسه فيه وإللى بيئته الواطية تسمح له بيه وده علشان لم يجد من يقف ويقول له أين حقى وماذا تفعل وليعرف أنه مهما فعل فله يوم سيأخذ منه الصغير قبل الكبير حقه وسيعرف أن الشعب المصرى أهين بوجوده على كرسى الحكم وسيتركه لمن يخاف الله فى شعبه ولكن لا بد من إتحاد الشعب فهو يحاول دائما أن يستخدم سلاح المحتل وهو فرق تسد فيحاول التفريق بين المسلمين والمسيحيين ويحاول إبعاد مصر عن الأشقاء العرب حتى لا يجد من يقف فى وجهه ولكن كل الشعب يعرف كل الاعيبه القذرة وسيقف فى وجهه وسيسقطه إن شاء الله"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030836/http://masr.20at.com:80/article.php?sid=179"

[[comments]]
order = 10
subject = "سبحان العاطى الوهاب بعد الشبشب والقبقاب"
author = "sara"
posted = "2006-04-25"
text = "صلوا على النبى احنا فى بلادنا ديموقراطيةازاى محدش قالى انا من رأى انى الدولة تطبق على الرئيس والوزراء قانون من اين لك هذا؟فعلا اسئلوا نفسكم يا ترى الرئيس جاب فلوسه منين؟ طبعا من مص دم الناس الغلابة بعدين اللى مخلينا ننتخبه هو اللى نعرفه احسن من اللى منعرفوش ومبارك نهب من الدولة لغية ما شبع واللى هيجى ورا سواء كان جمال او حد تانى عايز ينهب من جديد والبلد مش مستحملة"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030836/http://masr.20at.com:80/article.php?sid=179"

[[comments]]
order = 11
subject = "ازاى توافق يحمك حرامى"
author = "مصرى"
posted = "2006-04-26"
text = "للى بيقول أن مبارك سرق وشبع أقوله أزاى تقبل أن اللى يحكمك يكون حرامى وأنت عارف كويس أنه سرق أموال البلد والشعب كله وأنت عارف أنه سبب البطالة إللى فيها الشباب تفتكر إنه يوم لما سرقك كان حاسس بيك وبشعبه لا طبعاً يبقى عمرة ما أهتم بمصلحتك إزاى بقى تقول إن إللى نعرفه أحسن من إللى منعرفوش وليه أصلاً ترضى لنفسك الإهانة من إللى الدستور قاله أسهر على راحة الشعب ولكنه جعل الشعب كله يسهر من الجوع والمرض والفقر وسيأتى اليوم الذى سيطرده الشعب ويسترد منه حقه المنهوب"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030836/http://masr.20at.com:80/article.php?sid=179"

[[comments]]
order = 12
subject = "ميدان العباسية"
author = "V for Vendetta"
posted = "2006-05-18"
text = "النهاردة من كام ساعه كنت رايح الشغل من عند صلاح سالم رايح لقيت الدنيا مقلوبة جيش عرمرم من اصحاب الخوذات السوداء والنسور التى تزين اكتاف البهوات على اساس ان هما رايحين يحتلو أسرائيل مثلاَ لقيت من عند كوبرى العباسية مقفول لحد الجامعة و فرق الكاراتية اكتر من البنى ادمين كنت خايف خايف أوى ماكنتش ادر استحمل المنظر كان فظيع ناس بتتشد وتتسحل على الارض ودمها نازل وناس فى دنيا غير الدنيا مش عارفا حاجة و انا واقف لوحدى مش عارف اعمل اية وفرق العسكر مقضياها تشكيلات وضرب فى الناس بس الفكرة عمرها ماهتموت يا ريس عمرها الحرية مش من لحم ودم وهى الى هتسود مهما عدا الزمن برضة هيجيلك يوم ويطلع عليك الى عملتة فى السبعين مليون عليك انت وعائلتك من من هم على شاكاتك من الحلاليف و ابناء الافاعى"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030836/http://masr.20at.com:80/article.php?sid=179"

[[comments]]
order = 13
subject = "شنشنة أعرفها من أخزم"
author = "سمسم"
posted = "2006-06-11"
text = "سادتي ماذا تنظرون بعد؟<br />أحمد الشلبي والبرزاني والطالباني والحكيم وكل خونة الشيعة والأكراد، ولا حتى آل قباح بدولة الكويت العظمى ولا آل قرود بجزيرة العرب، وهم كفرة حقراء عملاء صرحاء، لن يقولون مثل هذا، بل سيدعون أن خيانتهم لأجل الوطن المسكين وحسب!!!<br />وابن الفاعلة القبيح المنظر سئ المخبر الصهيوني هذا ماحجته ليشنف أسماعنا بألفاظه السوقية، التي ورثها عن المقبور سلفه!<br />أحد القراء الكرام في موضع آخر بمعرض حديثه عن ناصر، قال إن في المنوفية يهود كثيرون يظهرون الإسلام كيدا وغشا وتربصا، وحقيقة لم أنم البارحة أبدا، وأنا أقلب الأمر على وجوهه:<br />فهل كان صدفة محضة أن عقليتي كل من الساداتي واللا مبارك هذا أم كل منهما يهودية إنجليزية؟ وعند اليهود لمن لايعرف يتبع المولود دين أمه لا أبيه. هل تعلمون الآن لماذا أصبح عمر الشريف نجما عالميا؟<br />تساءلت أيضا كيف حدث أيضا أن تقبل غانيتان عليهما مسحة لابأس بها من الحسن بقردين كهذين؟ ثم كيف حدث أن حمارين كهذين أصبحا من كبار العسكر. أما عن إبن ست البرين الزنجية إبليس فكل ما أمضاه في الخدمة فلم يتعد السنة ونصف السنة، وبسلاح الإشارة وليس له خبرة بقيادة سرية، فكيف أصبح قائدا عاما ويغدق بالرتب لا أقل من ليفتنانت جنرال وأحيانا مارشال؟<br />وأعجب من ذلك إسطورة صاحب الضربة الجوية الأولى! تعالوا نتصارح كم عمر الخنزير اليوم؟ ثمانون حولا؟ إذن فأنتم تصدقون أن يقود مقاتلة أو قاذفة من جاوز سن الثلاثين؟ دع عنك في حالة حمارنا هذا أنه جاوز منتصف الأربعينيات...مسكين هذا الشعب اللامبالي والذي يصدق كل شئ، أو يريد أن يصدق...<br />ها قد أسفر لكم عن خبث طويته، فما أنتم فاعلون؟ أعني أكثر من الدعاء عليه وسب أجداده الأنذال؟"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030836/http://masr.20at.com:80/article.php?sid=179"

