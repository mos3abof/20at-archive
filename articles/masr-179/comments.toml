text = "لا بقي ... دي مش زلة لسان ... دي مقصودة ..<br />وبالعند حاشتري الدستور عشان أقرأ المقاله دي (مش مهم الاتنين جنيه) .<br />ومش كده وبس.... حاصورها وحأوزعها علي صحابي كمان ...يالا بقي ...إن شاء الله ماحد حوش ...<br />أهه ... خلي فضايحه تطلع بره بقي .... ياساتر<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />مش مغيره<br />mohamedmat@hotmail.com"
