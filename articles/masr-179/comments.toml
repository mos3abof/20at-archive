posted = "2006-10-25"
text = "ضربه مبارك الجويه مازالت لغزا حتى الان فالطيران الذى اندفع ظهر السادس من اكتوبر وعمل عملته ونزل تحت الارض لا حس ولا خبر والا اين كان هذا الطيران عتد حدوث الثغره وتعاظمهاولماذا سقطت جميع الطائرات المصريه التى حاولت مواجهه الطيران الاسرائيلى مش برضه كان مبارك قائد للطيران وقبلها كان مدرب علشان كده صاحب الضربه الجويه دايما بسميه صاحب الفطشه الجويهواذا كان كل صاحب ضربه من خقهيكون رئيس جمهوريه فمن حقصاحب ضربه المخدرات يطالب بالكرسى مش كده ولا ايهههههههههههههههههههههههههههههههههههههه"
