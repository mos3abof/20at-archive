[[comments]]
order = 4
subject = "هم السبب"
author = "واحد طامع في الكرسي"
posted = "2006-04-20"
text = "للأسف يا جماعه بعد ما مشي الملك وجه بداله 100 ملك في الحركه القرعه الميمونه التي يطلق عليها ثوره .<br />اصبحت هذه البلد ميراث يتوارثه هؤلاء وذرياتهم وكذلك يرثون الشعب فوق البيعه.<br />والود ودهم يرثون البلد بدون شعب وهم هيجيبوا شعب بمعرفتهم.<br />فأحمدوا ربنا انهم لسه سامحين لنا بالمعيشه معهم في بلدهم أحسن لو زعلوا أحتمال يطردونا بره .<br />وعجبي...طبعاً علي اللي لسه فاكر انه صاحب البلد وهو في الحقيقه ضيف"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030836/http://masr.20at.com:80/article.php?sid=179"

[[comments]]
order = 5
subject = "متزعلوش يا بشر"
author = "المصرى افندى"
posted = "2006-04-20"
text = "انتو زعلانين ليه ، كل المنطقة العربية أكابر ، يعنى زى الفلاح اللى نفسه يبقى كبير البلد ، ومش عاوز العمدية تخرج من العيلة حتى لو مجانين . وعلى مايظهر للعرب شعب ، يبقى اللى يقول طظ ، يقولها بمزاج عالى ........ططططظظظظظظظظظظظظظظظ"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030836/http://masr.20at.com:80/article.php?sid=179"

[[comments]]
order = 6
subject = "براحة راحته"
author = "محمد"
posted = "2006-04-21"
text = "ان كان جلالته قال كده الله يسامحه وبعدين انتو ناسين ان مصر دي بتاعته واللي فيها ملك خالص له ولابنه وهما حرين فيها انتو لكو فيهاحاجه هو بيشتم في ملكه ودي حاجه ماتزعلش =========== لنا الله =========== اللهم من ولي من امر المسمين شيئافرفق بهم فارفق به ومن شق عليهم فاشقق عليه وعلي ذريته وعلي اللي جايبينه"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030836/http://masr.20at.com:80/article.php?sid=179"

[[comments]]
order = 7
subject = "بصراحة"
author = "مصرية بالسعودية"
posted = "2006-04-22"
text = "والله يا جماعة أنا مش عارفة مين السبب في هذا الحال سكاتنا ولا خوفنا من بطشهم ولا خلينا جنب الحيط وادينا عايشين عموما أنا رميت طوبتهم اللي عايزينه بيعملوه ولا قيمة لنا وكأننا عبيد ,طب أنتم عارفين لو طالوا يبيعونا في سوق العبيد مش هيتأخروا ويبقوا يستوردوا شعب من برة<br />وربنا يعينك يا شباب مصر"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030836/http://masr.20at.com:80/article.php?sid=179"

