[[comments]]
order = 1
subject = ""
author = "متفائل خير"
posted = "2010-02-08"
text = "بسم الله الرحمن الرحيم<br />السلام من إتبع الهدى<br />الطريقة أكيد راح تكون مقنعة لكن عندي ملاحظة بذلك<br />وهي أن تجسد شخصيات الصحابة هذه بحد ذاتها إنزال من قدر الصحابة ومكانتهم رضي الله عنهم جميعا, لذا لا أوافق على ذلك لأن الإسلام لايحتاج إلى تمثيل بل إلى حقيقة وواقع<br />هذا والله أعلم …<br />هذا وصلى الله على سيدنا محمد (صلى الله عليه وسلم)"
archived = "2010-02-09"
capture_url = "https://web.archive.org/web/20100209005543/http://www.20at.com:80/20at/religious/15231-2010-02-07-13-52-56.html"

