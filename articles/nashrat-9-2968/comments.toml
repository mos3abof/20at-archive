text = "واحنا فين بس من كل ده .. ياريتنا والله نعمل الحاجات دى عندنا ف مصر .<br />انا عارف ان الفتره الاخيره بدأت تظهر اعلانات توعيه ف شوارع القاهره زى \" السياحه أهل البلد وناسها \"<br />لكن باردو ده مش كافى محتاجين معرفه ودرايه اكتر واكبر بكتير من مجرد \" يافطه \" !!<br />شكرآ عشرينات ع المقال ."
