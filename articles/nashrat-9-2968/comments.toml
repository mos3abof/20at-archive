posted = "1999-11-30"
text = "انا ساعات كتير اوى بيجيلى احساس ان انا نفسى ما ابقاش مصرى.. على الرغم من انى بحب بلدى جدا… بس خلاص انا اتخنقت.. انا مابقتش شايف اى ميزة فى مصر تخلى اى واحد عاقل يحبها… الشوارع كلها زبالة والمبانى شكلها يقرف (مسخ على رأى عادل امام) وشغل مافيش وفساد ومهانة والمصرى بيبقى ارخص شىء فى بلده..انا بقيت بحب اتفرج على الافلام الابيض والاسود القديمة عشان اتحسر على مصر.. مصر زمان فعلا كانت عظيمة ايام ماكانت انجلترا بجلالة قدرها مديونة لينا ايام ماكان الجنيه المصرى اغلى من الجنيه الدهب… ايام ماكانت البيوت شكلها شيك.. مش شوية مكعبات شبه علب الكبريت… دى حاجة تقرف… يارب ليه ماخلقتنيش فى عصر الملك فاروق ولا فؤاد… يارتنى كنت اتولدت ايام محمد على"
archived = "2009-05-23"
capture_url = "https://web.archive.org/web/20090523230301/http://www.20at.com:80/nashrat-9/2968.html"

