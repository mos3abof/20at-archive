[[comments]]
order = 0
subject = "كلمة بذيئة"
author = "قذائف الحق"
posted = "2006-04-18"
text = "السلام عليكم<br />مش عارف ليه تذكرت كلمة بذيئة يستخدمها الجمهور في مباريات كرة القدم لوصف الحكم<br />منادين الصحافة فين ..... أهوه؟<br />المهم لازم كل المصريين الشرفاء ياخدو موقف قوي<br />كام صوت في مجلس الشعب مش حاجة<br />ممكن نعمل اضراب عام<br />مظاهرة مليونية<br />الموضوع تخطى كل الحدود<br />سلام<br />أخوكم قذائف"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224003/http://masr.20at.com:80/article.php?sid=188&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "هذا هو وجه النظام"
author = "عابر القارات"
posted = "2006-04-18"
text = "هذا هو وجه النظام أو مؤخرته لا فرق بينهم فهم متشابهين فى القبح و أؤيد تعليق أخي قذائف الحق فى إختيار هذه الكلمة التى أتحفظ على قوله أنها بذيئة فهى تمارس من قمة النظام الى مؤخرته أو مقعدته سواء فى مجلس الشعب و القائم بها خير قيام هو السيد فتحي سرور أستاذ القانون و الحقوق و الذى رضى ان يكون أول من يهدر الحقوق أو سواء فى أى وزارة أو هيئة تنتمى لهذا النظام العفن الاعمى الذى لا يرى حوله من متغيرات و أرتضى ان يعيش و يرغم شعبه على ان يعيش فى العصور الوسطى المظلمة و لتؤد الحقيقة و ليذبح الحق على يد من هم مفترض أن يحملوا شعلته"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224003/http://masr.20at.com:80/article.php?sid=188&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "بلاش العتاب"
author = "مجرد مواطن"
posted = "2006-04-20"
text = "صحيح يا ولاد لو علمتم الغيب لأخترتم الواقع .<br />زمان ايام الكليه كان يدرس لنا هذا المدعو فتحي سرور وللأسف كان لا يزال يرتدي قناع العلم والنزاهه وللأسف هذا ما حاول ان يغرسه فينا .<br />لكن بمجرد توليه رئاسه الجامعه ثم وزاره التعليم بدون تربيه ثم مجلس الشعب أخذت الأقنعه تتهاوي قناع وراء الأخر دونما حمره خجل أو أستحياء بل كان في بعض الأحيان ينتزعها نزعاً في تبجح ظاهر .<br />وعلي سبيل المثال نجله الذي تم تحويله من كليه الحقوق فرع بني سويف إلي حقوق القاهره وهو شايل ماده ( بقدرة قادر ولا يقدر غير الله ) تم تعينه بعد التخرج معيداً ثم سفره علي حساب الدوله لفرنسا حتي حصل علي الدكتوراه وعين في الكليه .<br />اليس هذا تع.....لكن لأنه سيد قراره فهذا في عرفه منتهي العدل .<br />لذا فعند حلول ساعه التوريث سوف يكون اول الموافقين والمهللين والمهنيئين لأن هذا هو الوجهه الحقيقي لمن يمثلنا في مجلس العاهات ولم يتبقي أي قناع لينزع ."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224003/http://masr.20at.com:80/article.php?sid=188&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "قاعدة فاسدة"
author = "عابر القارات"
posted = "2006-04-20"
text = "فعلا يا أخى (مجرد مواطن) عندك الف حق و أريد أن أضيف أن هذه الحالة بالنسبة لنجل فتحى سرور و غيره المئات ممن ينتمون الى النظام الفاسد غالنظام يبارك و يساعد هذا النوع من الفساد ليخلق له قاعدة عريضه من المفسدين الذين يدينون بالولاء له لأنه هو سبب ترعرعهم و نموهم و ولى نعمته فبالتالى يخلق له قاعدة متغلغله فى كل أجهزة الدولة تقول (موافقة) على طول الخط بعدما يتناقص عدد الشرفاء الذين غرقوا بطوفان الفساد و يخلق مسوخ فاسدة وظيفتها التصفيق على طول الخط و بذلك يضمن النظام الحياة الابدية محمولا على أعناق هؤلاء المفسدين ففى النهاية هى (شيلنى و أشيلك) النظام يدعم و يساعد و يربى و المفسدين تصفق و تقوم أمين"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224003/http://masr.20at.com:80/article.php?sid=188&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
