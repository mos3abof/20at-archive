[[comments]]
order = 2
subject = ""
author = "عبد الله"
posted = "2008-10-29"
text = "يبدأ الفيلم بمشهد للبطل نائما فوق سطح التوك توك متذكرا حكايات جده عن شخص مات وراح يقابل ربنا خايف ومتلخبط ومكسوف فرد عليه ربنا أنت بقى لا هتدخل جنة ولا نار، أنت هترجع الدنيا تاني لأنك معشتش\".<br />هو ده الفيلم اللى بتحتفوا بيه !!!!!!!!<br />شىء غريب جدا ايه فاضل للانسان يتمسك بيه غير دينه - انتوا بوظتوا كل حاجة - فوقوا انتوا بتتكلموا على اله خلقكم وخلق الكون كله وبتتكلموا بقمة الاستخفاف<br />فيلم حسب ما قلتوا كله بيتكلم على الجنس وبيهين الدين كمان تحتفوا بيه ليه ولمصلحة مين<br />فوقوا بقى يا عالم"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314163911/http://www.20at.com:80/masr/review/10348-2009-06-09-20-14-35.html"

[[comments]]
order = 3
subject = ""
author = "هبة ربيع"
posted = "2008-10-30"
text = "أبو محسن ،<br />شكرا على الترحيب ،<br />عبد الله،<br />أولا ما ذكرته في البداية كانت حكاية جد لطفل ، لا أحب بتر الكلام من السياق ، إذا وضعنا الجملة في سياقها فيبقى تعليق حضرتك \" ايه فاضل للانسان يتمسك بيه غير دينه - انتوا بوظتوا كل حاجة \" لا محل له من الإعراب ، الفيلم لا يحتفي بالجنس وهو أيضا ليس موعظة عن \" تأثير الإدمان على إدراك وسلوك الأفراد تجاه الممارسة الجنسية السوية \" ، الفيلم في بساطته وقصره وتكثيفه فني جدا لا يمكن اختزاله في جمله ، نصيحتي بدل ما تهاجم الفيلم اتفرج عليه ، سيقام عرض له في مسرح روابط خلال نوفمبر ، ومتنيين رأيك بعد ما تتفرج عليه ،<br />هيام،<br />مرحبا ،"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314163911/http://www.20at.com:80/masr/review/10348-2009-06-09-20-14-35.html"

[[comments]]
order = 4
subject = ""
author = "محمد السيد"
posted = "2009-10-28"
text = "السلام عليكم<br />عبد الله علق علي الفيلم من قرائته انا شوفت الفيلم ده من فتره طويله وذلك لأني من مؤيدين احمد العايدي ومحبيه لكن<br />هبه في شيء حتي لو مش هنكون ضده منبقاش مقييدين ليه في حاجات مينفعش منها الاقتراب والتصوير او التجسيد ولا سيما الاستخفاف طبع مش حتاج افكرك بيعقوبيان واولاد حارتنا<br />اخيرا احنا في حاجات كتير في حياتنا سايبنها ياهبه وبنتمسك بحاجات تانيه لاسبيل فيها<br />بسمالله الرحمن الرحيم (حتى يحكموك فيما شجر بينهم)"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314163911/http://www.20at.com:80/masr/review/10348-2009-06-09-20-14-35.html"
