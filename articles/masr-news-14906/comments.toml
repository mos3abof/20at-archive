posted = "2010-01-17"
text = "على ما يبدو انك لم تقرا<br />واذا قرأت لم تفهم<br />اقرا كويس لو سمحت كل كلمة مكتوبة<br />وصدق الرئيس السادات قبل موته وقال ان مصر بتستلف الاموال العربية من بنوك اليهود في اوروبا وبتدفع عليها فايده كمان"
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

