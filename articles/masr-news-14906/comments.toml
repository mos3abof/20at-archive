author = "المعلق السابق"
posted = "2010-01-17"
text = "الحمير انواع<br />منها الحمار الحصاوى والبغل الاسترالى انما انت حمار وطنى<br />فلوس اية ويهود اية وسادات اية وتهريب سلاح اية<br />السلاح ازاى بيتهرب من غزة لمصر ومن مصر لغزة وبيمشى على الارض المصرية مئات الكيلومترات من غير ما تشوفة الحكومة<br />هى هتمسكة على حدود غزة بس - لية مش فى مكان تانى<br />يا عم مبروك عليك ال 1500 جنية بتوع الوطنى واللاب توب اللى بتشتغل بية وخط النت adsl المجانى وعلق زى ما انت عايز<br />بس وحياة ابوك شوف لى شغلة زى بتاعتك دى اهو ناكل منها عيش وانا مستعد اكتب قصائد مديح فى الوطنى بس يمسكونى الفكة"
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

