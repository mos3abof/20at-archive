text = "9. ما علاقة الأنفاق بالجرائم الإرهابية التي تم تنفيذها في مصر؟<br />ثبت من القضية 230 لسنه 2009 حصر أمن دولة عليا المعروفة بتفجيرات \"المشهد الحسينى\" ، إستغلال إثنين من المخططين هما : خالد محمود مصطفى، أحمد محمد صديق ، لغزة كملاذ آمن ، تحت سمع وبصر حركة حماس. أيضا إستخدام البلجيكي من أصل تونسي، فاروق طاهر للأنفاق ، في العودة من غزة الى مصر للمشاركة في التفجيرات ، بعد الحصول على التوجيهات من قادة التنظيم في غزة .<br />وثبت من خلال القضية 409 لسنه 2006، 867 لسنه 2005 المعروفة بتفجيرات دهب وتفجيرات شرم الشيخ ، دخول المتهمين الآتي أسمائهم الى غزة لتلقي التدريب والتمويل والسلاح لتنفيذ تلك التفجيرات، وهم أيمن محمد حسين محارب، و يسرى محمد حسين محارب اللذين تسللا إلى غزة وقابلوا أبو سليمان عضو حركة \"حماس\" الذ قام بتجهيزهما بالأموال اللازمة للعملية بينما سهل لهما دخول القطاع زميله \"ماجد الدري\" أحد كوادر الحركة أيضا . وبذلك تحولت غزة الى ساحة لتدريب الإرهابيين المتسللين من مصر ثم العودة لتنفيذ عملياتهم."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
