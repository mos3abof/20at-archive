posted = "2010-01-16"
text = "19. وأخيراً، كيف نفي باحتياجات أهالينا في غزة؟<br />يتم تشكيل لجنة محايدة تدرس احتياجات غزة الـ1.400.000 نسمة من الغذاء والدواء وعلى مصر بالاتفاق مع الدول العربية توفيره وإرساله عبر المنافذ الشرعية \"رفح أو غيره\".<br />المعلومات الواردة في هذا التقرير مستمدة من الكتيبات التي أصدرتها الهيئة العامة للاستعلامات عن ثوابت الموقف المصري من الوضع في غزة والمعابر، وبحث عبد الرحيم على، ومجموعة من المقالات والتحقيقات المنشورة عن ذلك الموضوع."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
