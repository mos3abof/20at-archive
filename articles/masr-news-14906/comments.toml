posted = "2010-01-17"
text = "عايز تشتغل في الحزب الوطني ليه<br />هما الاخوان المسلمين ما بيدفعوش كويس<br />انا سمعت ان الاخوان بيدفعوا اكتر من الحوب الوطني<br />الحزب الوطني بيدفع 1500 والاخوان 2000<br />وحياتك تشوفلي شغلانه عند الاخوان لحسن العملية نشفه معايا اوي"
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
