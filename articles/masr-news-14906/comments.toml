posted = "2010-01-16"
text = "18. ما هى رؤية مصر نحو احتواء الوضع في قطاع غزة؟<br />رفض مخطط إسرائيل للفصل بين القطاع والضفة، والتنصل من مسئولياتها عن غزة وتحميل مصر بتبعاتها.<br />إن مصر لن تقع في الفخ الإسرائيلي الذي يروج منذ الثمانينيات لمقولة \"غزة أولاً\" بالنسبة للقطاع، والخيار الأردني فيما يتصل بالضفة، وأن مصر لن تشارك في الفصل بين الضفة والقطاع.<br />أن غزة والقطاع أراضي محتلة تقام عليها الدولة الفلسطينية المستقلة.<br />أن مصر لن تساهم في تكريس الانقسام بين غزة والقطاع، والذي يتحقق بفتح معبر رفح في غياب السلطة الفلسطينية ومراقبي الاتحاد الأوروبي.<br />إن الحق في مقاومة الاحتلال حق ثابت ومشروع.. لكن المقاومة تبقى مسئولة أمام شعوبها بقدر ما تحققه من مكاسب لقضاياها أو تجلبه من خراب ودمار وإهدار لأرواح الشهداء.<br />العمل على تحقيق المصالحة الفلسطينية الفلسطينية في أقرب وقت.<br />إن مصر لم تتوقف يوماً عن المطالبة بإنهاء الاحتلال وإقامة الدولة الفلسطينية المستقلة لتحقيق تطلعات الشعب الفلسطيني المشروعة."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
order = 3
subject = ""
author = "غزه والانفاق س ج"
posted = "2010-01-16"
text = "17. هل الانتقادات الموجهة إلي الإنشاءات المصرية على الحدود في محلها؟<br />الإجابة بالقطع لا، وذلك لثلاث أسباب ، هى:<br />أن مبدأ السيادة الوطنية ومسئولية كل دولة عن أراضيها هو حق قانوني أصيل، ومبدأ مترسخ في العلاقات الدولية، لذلك فأنه من الغريب أن تنتقد بعض الأقلام مصر في إجراء هدفه حماية حدودها الوطنية من الانتهاكات المتكررة والتي كان أخرها الاجتياح السكاني لرفح في 22 يناير 2008.<br />أن معبر رفح مفتوح للأفراد وفق الاتفاقيات الدولية، والضوابط المنظمة، والتي كثيراً ما تتساهل فيها مصر مراعاة للطابع الإنساني وحرصاً على العلاقات الأزلية مع الشعب الفلسطيني كما تم التوضيح.<br />أن مصر لن تسمح أبداً بأن يتم تجويع الشعب الفلسطيني، وفرض الحصار الإسرائيلي الغاشم عليه، وأنها تسعى بكل الطرق الدبلوماسية إلي ضمان وصول المساعدات الإنسانية إلي أهالينا في فلسطين."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
order = 4
subject = ""
author = "غزه والانفاق س ج"
posted = "2010-01-16"
text = "لماذا هذا الوقت بالذات<br />كانت تراهن مصر على فكرة تحقق المصالحة الفلسطينية، وأن هذه المصالحة سينتج عنها حال تحققها إعادة الهدوء إلي منطقة غزة ووضع آلية أمنية لمنع حالات التهريب، لكن مع إطالة الجانب الفلسطيني لمدة التفاوض وإصرار كل طرف على موقفه، وجدت مصر نفسها أمام خيارين أما ترك حدودها منتهكة على أمل تحقق المصالحة وهو أمر غير واقعي وفيه تهديد للأمن المصري، أو التحرك بنفسها لحماية حدودها وأمنها القومي، فاختارت مصر الحل الأخير."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
order = 5
subject = ""
author = "غزه والانفاق س ج"
posted = "2010-01-16"
text = "14. من هى الجهات التى تحرض ضد الإنشاءات الهندسية المصرية الهادفة الى غلق الأنفاق على الحدود؟<br />الإخوان<br />حماس<br />15. ما هى حقيقة تلك الإنشاءات؟ ومن الجهات التي تقوم بإنشائها؟<br />الإنشاءات التي تقوم بها مصر على طول الحدود مع قطاع غزة ليست جديدة‏,‏ بل تطوير لأوضاع كانت قائمة من قبل‏,‏ وهى شأن داخلي الهدف منه وقف عمليات التهريب غير المشروعة التي تقوم بها بعض العناصر الفلسطينية والوسطاء الدوليين، والقضاء على بعض العناصر الإجرامية التي تسعى للقيام بعمليات إرهابية في مصر وتتسلل عبر الحدود وتقوم بشراء الأسلحة التي تستخدم في قتل المدنيين المصريين والسياح الأجانب مثلما حدث في تفجيرات طابا وشرم الشيخ ودهب.<br />القوات المسلحة المصرية هي التي تقوم بتنفيذ الإنشاءات الهندسية تعزيزا للحدود وليس أى طرف أجنبي آخر كما تردد."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
order = 6
subject = ""
author = "غزه والانفاق س ج"
posted = "2010-01-16"
text = "12. هل هناك علاقة بين الأنفاق وتجارة المخدرات والرقيق الأبيض؟<br />بلغت حصيلة تجارة المخدرات بغزة خلال 3 أسابيع مبلغ 400 مليون دولار وفقاً لما جاء بموقع إخوان اون لاين 12/7/2009.<br />من أمثلة ذلك قضية المواطن الحمساوى \"عمار محارب\" خان يونس وأمجد بو النجا – ديسمبر 2007.<br />يتم بيع الروسيات بمبلغ يتراوح من 15 ألف إلى 30 ألف دولار كرقيق أبيض ووصلوا إلى 16 ألف فى تل أبيب.<br />13. ما هو الحل الجذرى لقضية الأنفاق؟<br />الحل بيد حركة حماس وحدها.<br />ينبغي أن تسلم السلطة على المعبر لرجال الرئيس محمود عباس .<br />يتم التوقيع على وثيقة المصالحة التى وافقت حماس على كل بنودها ثم عادت لتقول نريد أن نعيد الحوار."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
order = 7
subject = ""
author = "غزه والانفاق س ج"
posted = "2010-01-16"
text = "10. ما علاقة الأنفاق بتواجد تنظيم القاعدة فى (غزة) ؟<br />خلال الفترة من 1996 وحتى 2004 لم تكن هناك جماعات مرتبطة بتنظيم القاعدة.<br />تزامن عن الإعلان عن تلك الحركات بدأ مع فوز حماس بالانتخابات وتشكيل حكومتها الأولى فى 29/3/2005.<br />قامت القاعدة بتنظيم عمليات بالوكالة \" مثل اغتيال \"موسى عرفات\"، وعمليات اختطاف الأجانب، وعمليات ضد رجال وكوادر فتح. كما تم اختطاف \"آلان جونسون\" الصحفى البريطانى – وتحريره بمباحثات مع حماس<br />هناك تلويج دائم من الحركة بأن الحرب على حماس قد يأتى بالقاعدة .<br />11. ماذا عن اقتصاديات الأنفاق ؟<br />النفق يحقق أرباح قدرها 40 مليون شهرياً.<br />قامت شركات توظيف أموال ونصب على خلفية الأنفاق بمساعدة ومشاركة من بارونات حماس.<br />يبلغ نصيب حماس الشهري من الأنفاق 85 مليون دولار، وذلك في هيئة ضرائب ورسوم."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
order = 8
subject = ""
author = "غزه والانفاق س ج"
posted = "2010-01-16"
text = "8. هل تخلق الأنفاق سوقاً للسلاح في مصر والمنطقة؟<br />تخلق قضية تهريب السلاح من مصر الى غزة ، عبر الأنفاق، بشكل غير مباشر سوقا للسلاح في مصر ، ربما يذهب نصف ما يتم إستيراده أو صنعه لهذه السوق الى غزة ، والنصف الآخر يباع داخل مصر ، مما يضر بالأمن القومي المصري ويعرضه لخطر محدق .<br />لا يضمن أحد أن السلاح الداخل الى غزة لن يصل الى منظمات القاعدة الموجودة في غزة ، والتي أشتبكت معها حركة حماس نفسها في الفترة الأخيرة. والسؤال هل هناك من يريد إغراق غزة بالسلاح حتى يحين موعد إغراقها فى فوضى القتال والقتل المتبادل؟<br />أما بالنسبة للسلاح القادم من غزة ، فهل لنا أن نتساءل عن السلاح والمتفجرات المضبوطة مع خلية حزب الله وحقائب السي 4 التي تم إعدادها في غزة ماذا كانت تفعل في الجانب المصري ؟، وكذا السلاح المضبوط فى صعيد مصر عقب كسر الحدود من قبل حركة حماس في يناير 2008، والسلاح المستخدم فى تفجيرات شرم الشيخ ودهب ، ودور غزة في تدبيره."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
order = 9
subject = ""
author = "غزه والانفاق س ج"
posted = "2010-01-16"
text = "7. هل تخدم الأنفاق الأجندة الإقليمية لإيران؟<br />وعد خالد مشعل وعد الأسبوع الماضى بتدخل حماس وكافة الحركات الإسلامية الى جانب إيران في حربها .<br />حركة الجهاد الفلسطيني تداركت ذلك وقالت، أن الأمر بالنسبة إلينا لن يتعدى الدعم المعنوي ، لأننا لا نريد جر غزة إلى حرب أخرى.<br />كان من المتوقع أن تلعب الأنفاق دوراً إذا ما تدخلت حماس كما وعدت في حرب طرفاها إيران من جهة وأمريكا وإسرائيل من جهة أخرى ."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
order = 10
subject = ""
author = "غزه والانفاق س ج"
posted = "2010-01-16"
text = "5. من يحاصر غزة ؟<br />الذين رفضوا توقيع وثيقة المصالحة ، وعمقوا الجرح الفلسطيني ، تلبية لنداءات قوى أجنبية .<br />والذين رفضوا تسليم المعابر لأبو مازن.<br />والذين خاضوا الانتخابات على خلفية أوسلو ثم رفضوا التعامل مع نتائجه.<br />6. ما هى علاقة الأنفاق بالتهديدات الإسرائيلية؟<br />تكمن مصلحة إسرائيل في إستمرار وجود الأنفاق ، لتعميق فكرة عدم قدرة مصر على تأمين حدودها الدولية لدى الرأى العام العالمى.<br />يهدف ذلك بالأساس إلى إما تحميل مصر تبعات الأحداث الإرهابية ، تمهيدا لغق القطاع وفصله عن الضفة ، في محاولة لتنفيذ حلم إسرائيل القديم بإنشاء ( وطن بديل للفلسطينيين في سيناء) أو ضرب منطقة الحدود بقنابل \"ذكية\" تصيب بالضرر20 ألف مصري يعيشون قرب الحدود ، الأمر الذي يعطي للمعارضة الإسلامية مادة للطعن في قدرة الحكومة على حماية أبنائنا من بطش إسرائيل ، الأمر الذي يمهد للدخول في حرب مع إسرائيل ، وهو هدف التيار الإسلامي الذي تنتمي إليه حماس ."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
order = 11
subject = ""
author = "غزه والانفاق س ج"
posted = "2010-01-16"
text = "4. ما هو دور معبر رفح في نقل المساعدات الإنسانية والغذاء والدواء إلي القطاع خلال 2009؟<br />أغذية: 856 طن دقيق – 98 طن ألبان – 165 طن لحوم مجمدة .<br />معدات طبية: 7911 طن من الأدوية ، و12679 كيس دم، و224 سيارة أسعاف، و4 ثلاجات نقل دم، و194 عيادة متنقلة، و56 اسطوانة أكسجين.<br />26 شاحنة \"مدرسة متكاملة\" ضمت 11 فصلاً و55 ألف حقيبة مدرسية.<br />3 قوافل كبرى، هم: تحيا فلسطين (1)، الأمل وضمت 4 شاحنات أدوية ، 35 سيارة إسعاف، وتحيا فلسطين (2) وشملت 36 طن أدوية ومساعدات طبية<br />الأشخاص : 2034 معتمر فى أغسطس 2009 ، 5227 حاج فى نوفمبر وديسمبر من نفس العام.<br />تضغط مصر بكل قوة لدخول المساعدات الغذائية والطبية من معابر : كرم أبو سالم والعوجة – وهذه المسألة هى قضية مصرية بامتياز ."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
order = 12
subject = ""
author = "غزه والانفاق س ج"
posted = "2010-01-16"
text = "3. ما هو دور مصر في تزويد قطاع غزة باحتياجاته؟<br />تمد مصر القطاع بحوالي 10% من احتياجاته من الكهرباء بدون مقابل، وتبلغ تكلفة ذلك حوالي 30 مليون جنيه سنوياً.<br />لا تتواني مصر عن الاتصال المكثف بالجانب الإسرائيلي لفتح المعابر التي تربط إسرائيل بالقطاع والسماح بمرور المساعدات من منفذ كرم أبو سالم الحدودي مع مصر إلي داخل القطاع.<br />ترحب مصر بكافة أنواع المساعدات الغذائية والوقود والمتطلبات التي يحتاجها الشعب الفلسطيني في غزة، وهى على استعداد تام للمعاونة في توصيلها طالما تم الالتزام بالضوابط القانونية المنظمة لذلك.<br />معبر رفح مفتوح بشكل شبه يومي للحالات الحرجة والمرضى ، وكذلك أمام الطلاب الفلسطينيين الذين يتعلمون في الجامعات المصرية، والحجاج الفلسطينيين."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
order = 13
subject = ""
author = "غزه والانفاق س ج"
posted = "2010-01-16"
text = "2. ما هو الوضع القانوني لمعبر رفح؟<br />معبر رفح تحكمه وتنظم المرور عبره اتفاقية المعابر لعام 2005 التى تقضى بتواجد كافة الأطراف المعنية وبخاصة السلطة الفلسطينية ومندوبين عن الاتحاد الأوروبي .<br />للمعبر بوابتين إحداهما عند مصر والأخرى عند إسرائيل ولابد أن توافق إسرائيل على فتحه بالتفاهم مع مصر .<br />هناك كاميرات إسرائيلية تراقب هذه البوابة ولابد من إخطار إسرائيل بمن يدخلون منه لمنع لأية إدعاءات بأن المعابر تستخدم لتهريب الأسلحة والمخدرات وغيرها من الممنوعات ."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

[[comments]]
order = 14
subject = ""
author = "غزه والانفاق س ج"
posted = "2010-01-16"
text = "س و ج<br />غزة والأنفاق.. رؤية مصرية<br />سيطرت قضية الإنشاءات المصرية على الحدود مع غزة على أجندة النقاش العام في الفترة الأخيرة، وألقى ذلك بتبعاته على دور مصر في حماية أمنها القومي من خلال إغلاق الإنفاق على الحدود، وموقف مصر من جهود المصالحة الفلسطينية والوضع في غزة تحديداً. ويجيب هذه الجزء على أهم التساؤلات التي يطرحها الرأى العام بشأن هذه القضايا.<br />1. ما هو الوضع القانوني لقطاع غزة؟<br />غزة أرض محتلة وتسيطر إسرائيل – قوة الاحتلال على مخارجها ، وتتحكم فى حركة الدخول والخروج منها .<br />تأمين حدود غزة مسئولية إسرائيل لأنها قـوة الاحتلال ، وبالتالى فلا يمكن إلقاء المسئولية على كاهل مصر لأن هذا إن حدث فسوف يعطى إسرائيل الفرصة للتنصل من التزاماتها المقررة بمقتضى اتفاقيات جنيف لعام 1949."
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124070052/http://www.20at.com:80/masr/news/14906-2010-01-16-15-51-00.html"

