posted = "2010-01-17"
text = "اية الهيصة اللى كاتبها تحت دى<br />انا قرأت بضع اسطر فقط وعرفت انك من بتوع الذين يقبضون شهرية من الحزب الوطنى 1500 جنية علشان تلف وتكتب فى المواقع<br />احنا قلنا ان دة جدار خايب جدا زى اللى بيعملة<br />وان الجدار ممكن قطعة بسهولة وعمل فتحات فية تحت الارض فى اى مكان<br />وانة ليس لة اى لزمة اطلاقا<br />غير زيادة الكراهية للمصريين وعزلتهم من جميع الجنسيات والدول العربية<br />ومبروك يا عم 1500 جنية بتوع الوطنى ويظهر انك متعين جديد وابقى شف لى شغلة اهو الواحد يسترزق بكلمتين يكتبهم<br />ربنا معاك"
archived = "2010-01-24"
