subject = "هوس هوس هوس هوس , بس بس بس بس"
author = "هبابه او هوبه او هبهوب"
posted = "2006-04-20"
text = "“Keep your friend close, but keep your enemy closer.”<br />عادي يعني دي كانت حته اول مقوله حلوه في الاب الروحي , وبنشوف ماتركس وناس كتيره عامله اميلاتها عليه<br />ودهب مع الريح للعالم الرومانسيه والقلب الشجاع بردو شويه غم علي رومانسيه ,<br />بتحبي ايه تاني كل افلام الرعععععععععععب طبعا , وبحب بعد اما اتفرج عليها احكيها لصحابي<br />\"دماوي اصلي \"<br />وايه تاني يابت ؟؟؟<br />والاكشن جاكي شان داتحفه , سلفيستر استننوني دا بايخ او واقف في فيلم جاي بكره رائع علي قناه معرفهاش<br />اتفرجوا عليه<br />مش عايزه حد يتهمني بالزندقه .ونوفا تكمل بقي ."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223839/http://masr.20at.com:80/article.php?sid=204"

