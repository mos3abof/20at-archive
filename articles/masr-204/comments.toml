posted = "2006-04-27"
text = "و الله يا هبهوب انتى تامرى بس اقول ايه بعد ما اتكلنتى عن ذهب مع الريح<br />الفيلم التحفه اللى بعشقه هو و الرايه اللى تقريبا قريتها 50 مره<br />عندك برده تيتانيك<br />city of angels<br />u ve got mail today<br />speed 1<br />bodyguard<br />catch me f u can<br />unfaithful<br />ياااااااااااااه الافلام اللى تهوس كتييييير<br />بمسى او بصبح يا هبهوب<br />على فكره يا هبهوب انا كنت اتشتمت من صايع تانى ف موضوع كن قيقهه و كتكونش مهايطى ابقى ردى عليه"
