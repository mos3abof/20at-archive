[[comments]]
order = 2
subject = "أمهات قضاة يناشدن الشعب دعم \\\"أبنائه\\\" القضاة"
author = "مصري"
posted = "2006-04-20"
text = "فوجئ المعتصمون على الرصيف المقابل لنادي القضاة بعدد من السيدات الوقورات يتوجهن إليهم ويشكرونهم بحرارة.<br />وبعد ثواني عرف المعتصمون أنهن أمهات عدد من المستشارين والقضاة المعتصمين بدورهم داخل النادي.<br />أحدى الامهات لم تتمالك دموعها وهي تعبر عن شكرها للمعتصمين على الرصيف رغم رمزية عددهم (الساعة 11 ليلا) وتوجهت بحديثها إلى الناشطة عزة سليمان (حزب الغد) قائلة: أبني زي الفل.. حياته مستوره وموش ناقصه حاجة.. وعارضين عليهم أكتر، لكنهم متمسكين بموقفهم عشان الناس وعشان التزوير إللي ما قدروش يمنعوه.. واهانة ناس بتحترمها كل الحكومات والشعوب.<br />المفاجأة التي فجرتها الأمهات انهن لن يقفن مكتوفات الأيدي بينما المضايقات تلاحق أبنائهن أوأزواجهن من القضاة، واكدن ان دورهن في هذه الأيام هو الوقوف خلفهم لدعمهم.<br />وناشدت مجموعة الامهات نساء وفتيات مصر الإنضمام إلى امهات وزوجات القضاة اللاتي قررن الوقوف من التاسعة صباح الخميس القادم (27 أبريل)، توقيت جلسة عدم الصلاحية، بملابسهن السوداء حدادا على المستوى الذي وصل إليه مستوي التعامل مع القضاة بإحالة شيخين منهما لـ\"التأديب\".<br />كلمات المعتصمين لأمهات القضاة.. بأن الشكر هو لهن وللمعتصمين داخل النادي، تكررت لشيوخ القضاة الذين خرجوا أكثر من مرة لتحية المعتصمين على الرصيف، مشددين على أن قضيتهم مهنية وليست سياسية.<br />من جانبه دعا المستشار زكريا عبدالعزيز رئيس النادي منظمات المجتمع المدني والمهتمين بأمور العدالة والقضاء في مصر إلي التواجد في دار القضاء العالي يوم 27 ابريل الحالي.<br />دعوة أمهات القضاة تبنتها حركة كفايه التي دعت أعضائها نساءً ورجالاً لإرتداء الملابس السوداء منذ ليلة الأربعاء القادم والإنضمام للمعتصمين منذ يومين أمام النادي."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223839/http://masr.20at.com:80/article.php?sid=204"

