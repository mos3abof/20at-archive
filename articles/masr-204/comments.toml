posted = "2006-04-20"
text = "انا شايفه ان هوس الافلام دا مجرد هرووب<br />هروب من واقع بيعيشه المهووس<br />وبيبدأ يهرب داخل فيلمه > ، وكانه هو البطل ...<br />والى انا ملاحظاه ان الافلام الى النس بتتهوس بيها بتبقى البطل فيها سوبر مان ...<br />موضوع حلو صياغتك جميلة وبسيطة"
