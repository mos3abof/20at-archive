text = "انافعلا من المهووسين اللى ذكرتوهم فوق فأنا من اشد المهووسين بهارى بوتر من اول جزء حتى سادس جزء و والله كتير ببقى هموت و اعمل حركة الطيارة اللى على هناك دى بس مسنفعش بقى ظروف الدراسة و بس عايزة اوضح الهوس مش ضرورى يبقى بقيلم بل ممكن يبقى برواية زى هارى بوتر يعنى انا اصل الهوس عندى كان بالرواية و لما اتعملت فيلم اتنقل الهوس للفيلم.<br />حاجة اخيرة حبيت ارد على journalista و بقولهاالهوس ممكن يبقى روب معاكى فى دى لكن مش بيبقى دايما البطل زى سوبر مان.."
