text = "الموضوع جميل جدا وملخص...ولكن اريد جوابا لسؤالى ألا وهو :توجد انواع من المعتقدات الغذائية على أن النباتيين تسبب الأنيميا ؟؟ فهل هذا الكلام صحيح ام خاطئ وما هي صحتها العلمية ؟؟<br />اريد جوابا عاجلا ....وشكراااااااا جزيلاا"
