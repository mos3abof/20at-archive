subject = "اضافة للموضوع"
author = "Dabdoob"
posted = "2006-03-01"
text = "الانظمة النباتية ليست وردية كما يظن البعض وكمايلوح صاحب المقال فهي تحرم الانسان من البروتين النباتي الذي لا بديل عنه<br />اما بالنسبة للمعلومة الخاصة بالضعف الجنسي للنباتيين الذكور فهي صحيحة واضيف ايضا انهم اكثر عرضة لمشاكل الهرمونات وذلك لان الهرمونات ببساطة تدخل الدهون عموما و الحيوانية خصوصا في تكوينها بشكل اساسي<br />اخيرا فان الكثير من الفيتامينات والمعادن تحتاج الي وسط دهني لا يوجد الا في البروتينات الحيوانية<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113937/http://www.20at.com/article2.php?sid=508"

