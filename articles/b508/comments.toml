[[comments]]
order = 3
subject = "حقوق الإنسان المصرى"
author = "مصري"
posted = "2006-03-02"
text = "عندما أسمع مصطلح حقوق الإنسان تصيبنى نوبة ضحك غريبه على مصرنا الحبيبه،والحاله السيئه التى وصلت لها ، وأتسائل من أين جاء لها هذا الإنسان ربما يعتقد البعض أن مشكلتنا فى مصر هى إنتهاك حقوق الإنسان المصرى لكن المشكله انه( منين جت الإنسانيه لمصر) فعلا لماذا نصنف المصرى كإنسان ؟؟ (وماتقولش إننا بنى إدمين وعندنا حضاره مش عارف كام ألف سنه والكلام البطيخ بتاع مدرس التاريخ بتاع أولى تالت) لابجد مافيش حاجه فى مصر إسمها إنسان هذه الكلمه نسمعها فى تقارير منظمات حقوق الإنسان بس لكن الواقع شيىء (تقولى أزاى أقولك) هل يستطيع إنسان ما على وجه الأرض أن يعيش فى ظل تلك الظروف التى يعيشها المصرى؟؟؟ مثلا هل يستطيع شعب مكون من (بنى آدمين ) ان يعيش ربع قرن فى ظل حكومه أكل عليها الزمن وشرب بل (وعملها) عليها أيضا؟؟ هل يستطيع إنسان تحمل ما قام به وزير زراعه و (يسرطن لنا الخضار والفاكهه)؟؟؟ هل يستطيع إنسان أن يتحمل الحياه وسط مجتمع به 15000 شخص معتقل بدون أى تهمه؟؟؟أو وسط مجتمع به 1.7 مليون لا يمتلكون ما يأكلونه ؟؟؟؟ هل يستطيع شعب أن يعيش وسط حكم طوارىء 25 عاما ؟؟ هل يستطيع بنى آدم ان يعيش فى بلد كل من يقول بها (لا) يسحل ويضرب (لحد ما يبان ليه صاحب...ينضرب معاه) ؟؟ إنه المصرى يا عزيزى نعم المصرى والمصرى فقط هو من يستطيع الحياه وسط هذا الجو (المزفت) .. إذن أنا مخلوق جديد لا أعرف عن نفسى شيىء سوى أنى (مليش دعوه بالانسان ولا حقوقه) أنا مخلوق ليس لى تصنيف سوى أنى مصرى (يعنى ممكن أستحمل أى حاجه مايقدرش حد تانى يستحملها).<br />أرجو أن أكون وضحت الفرق بين أن تكون أنسان وأن تكون مصرى و بقى أن نعرف كيف نرتقى بالمصرى ليكون إنسان؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113937/http://www.20at.com/article2.php?sid=508"

