text = "حاجة اخيره<br />ياريت ترجع للمصحف والتفسير وتقرا وبعد كده تبقي تتكلم مش شغال تتفتري علي خلق الله واحنا مش ضد النقد لكن لما يكون موضوعي وسليم وبناء مش يبقي كلو افتراءات وكلام كدب ولتاني مرة بقولك ليه الافترا ده علي مصر اشمعنا مصر بذات وانا هرد عليك عشان انتو بتغيروا منها وهتفضلوا تحقدوا علينا لاخر الزمان وانا مش بلومك انت مش لوحدك اغلبكوا كده عشان مصر احسن بلد في الدنيا وغصب عنك هتفضل احسن بلد"
