text = "ههههههههههههههه هه<br />وربنا يا بسنت انتي بنت جدعه فحت عندك حق والله<br />يا متنرفزه هقولك حاجه يا قمري<br />القافله تسير والكلاب تعوي وكل لبيب بالاشارة يفهم اذا كان بيفهم عربي او غير عربي اصلا<br />وبعدين لما الدعوة جاتله من صديقه عالفيس بوك قبلتها ليه هو الموقع ده خاص بيك الله اعلم يمكن تكون (تييييييييت)ولا حاجه<br />هي تيت دي يا جماعه المفروض انها كلمه ممنوعه من العرض انا اصلا مافكرتش فيها بس ممكن كل واحده فينا تفسرها زي ما هي عايزه اوك…"
