text = "أولاًَ: لو كل واحد يعامل اللى قاعدة جنبه على أساس انهاأخته والله الأمر هيكون أسهل بكتير<br />ثانيا: الأخ عندما يدخل السيارة أو الاتوبيس أو غيره يدعوا بترك المقاعد الأخيرة للنساء وبالتالى نمنع الإختلاط<br />ثالثاً: على المرأة بالحجاب فالحجاب عفة للمرأة"
