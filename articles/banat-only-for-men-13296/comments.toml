subject = ""
author = "مش مهم الاسم"
posted = "2010-01-29"
text = "جيمس<br />من فضلك متعممش<br />زى مافى بنات وحشين<br />فى بنات زى الفل<br />وزى مافى شباب وحشين<br />فى شباب زى الفل ومحترمين جدا كمان<br />ياريت متعممش<br />وشكرا"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212075722/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
