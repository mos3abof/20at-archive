author = "واحده متنرفذه"
posted = "2010-01-03"
text = "الله يحرقك انت وجيمس في يوم واحد<br />عمال تقولي احترموا رأيي رأي ايه ياابو رأي انت اللي نحترمو جاي تقول علينا مش محترمين وتفكيرنا هابط لا سيبنالك انت التفكير المحترم انت والموزة اللي انت ماشي معاها ياريت يااستاذ انت متتكلمش عن الاخلاق والفضيله طلاما انت طلعت من الي بيمشو مع موزز وفرحان ياخويا دانت هتتحاسب يوم الدين علي افعالك دي جاي تحاسبنا علي لبسنا وتصرفاتنا ياشيخ روح حاسب نفسك واتقي الله قبل ماتموت انت والجيل الفريند اللي هتخش بيها جهنم ان اشاء الله وابقي خلي الجيل فريند تنفعك<br />والاخ اللي اسمو جيمس والله ماجديد عليك الكلام الوسغ بتاعك ده انت ليك تعليق في كذا توبيك سافل ومش محترم ده يدل علي انك شخصيه تيييييييت وعيل من العيال السيس اللي ربنا ابتلانا بيهم وبعدين مدخل نفسك ليه يابابا وسط البنات ياعيني شكلك محروم فعلا زي ماقالت بسنت والله صعبت عليا روح يابابا ذاكرلك كلمتين ينفعوك ده الي هينفعك مش انك تمسك موزة ومن حقك تتحرش بيها ايه الكلام السافل ده ياتييييييييت<br />وبالنسبه للبنات ياجماعه دول مرضي نفسيين ماتتتعبوش نفسكو معاهم دول اخرتهم ع العباسيه عدل وابقي سلملي انت وهوة ع الجيل فريند"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 43
subject = ""
author = "جسام"
posted = "2010-01-03"
text = "عن جد مستواكم الفكرى هابط جدا وشئ لايشرف احد انكم تخلطون الامور كلها ببعضها حتى انكم اتهمتونى كذب انى اكره مصر مع انى والله احبها وكنت بها من قريب مع ذلك اتهمتونى انى ادعى الفضيلة وللمرة المائة اقول انى لست متدين ولاادعوكم لتكونوا متدينين ولكن لى وجهة نظر ولم اقول ان جميع المصريات كما تدعون لست فى موقع لاحكم على احد ولا اقول على احد انه غير مسلم وحاولت ان اشرح وجهة نظرى الذى انتم لاتفهموها لماذا كل هذا التعصب لماذا لاتشرحوا وجهة نظركم باسلوب متحضر لماذا لاتفهمو الاخرين ماتعرفونه ماذا لو سمع واحد عنكى شئ هل ستشتمى لا ستوضحى ستشرحى لمن امامك اخذتم كلامى على انه كره لمصر ولكنى اتحدث عن عرب ككل ولم ارا فى كلامى اى تناقض لم اقول انى متدين من اول قلت لى فريند وافعل معها ماشاء وهذه حريتى ومن حقكم ان تفعلوا ماتشاؤن وهزه حريتكم وشكرا لك جيمس يبدو انك تفهم كلامى"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

