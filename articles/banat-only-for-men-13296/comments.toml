text = "اسمعوا بقا يابنات ماهو انتم لازم ترسوا على بر ليكم اما ان تلبسوا لبس مش فاضح وتقولوا احنا مظلومين لتلبسوا زى مانتم عاوزين وهيتعمل فيكم الا انتم عاوزين يتعمل فيكم والا مش عايزين يتعمل فيكم ماهو انا مش فاهم ايه حجاب شرعى على بادى ضيق وقصير وبنطلون ضيق ماعرفش لبستوه ازاى ولاجيب قصير كل حاجة تحته باينةماتلموا نفسكم علشان تعرفوم تعيشوم وتعرفوا ربنا يكرمكم وبلاش قلة ادب جاتكم نيلة"
