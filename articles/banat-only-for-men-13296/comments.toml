[[comments]]
order = 21
subject = "ايدك شاااااااايفك يا ابن ال"
author = "ADHB_85"
posted = "2006-07-04"
text = "عمالين تتخانقو العيب عند البنات ولا الشباب يخرابي ايه يا جماعه مش عارفين العيب بجد تخيلوا معايا طيب انا واحد كل يوم افتح التليفزيون بتفرج على كذا وكذا كليب الفنانه قشره اللي بتنسى دايما هدومها في البيت والفنانه روبي بيكيا اللي بتاجر عجل دايماوبتعلم الشعب ركوب العجل وغيره وبتلاقي الفيلم الفلاني اللي بيتكلم عيني عينك عن العلاقه الجنسيه في حياتنا مع الشرح طبعاوبتلاقي كل بطل طالع في دور حبيب ومعاه البت بتاعته زي مابيقولو وهمالين يحبوا في بعض في الفيلم فالشاب طبعا بيتفرج وبينزل يركب الميكروباص فاكر انه في حب من اول نظره ومن اول لمسه زي ما اتفرج عالفيلم والكليب وكمان طبعا علشان منظلمش الشباب بس لان الفئه الغالبه لبنات اليومين دول بتوع الحجاب حجاب القلب فانتشرت فكره عند معظم الشباب ان الحجاب ده ملهوش احترام لان برضه دايما في الاعلام مش بنشوف المحجبه دي غير خدامه او عاهره او بنت ارهابيه وفي الشارع بنشوف المحجبه مش عارف عامله ايه وماشيه مع مين فالشاب بيععم ان كل المحجبات كده لا ده كمان بيقولو ان المنقبات دول نصهم بلاوي وطبعاا ده من ثقافة التليفيزيون<br />الحل بقى يا جماعه بسيط جدا :<br />الحيااااااااااااااااااء<br />طبعا الحياء يشمل كل حاجه حياءك مع الناس وحياءك مع نفسك في لبسك ومنظرك وكمان المحجبه وكفايه بقى حجاب الشعر<br />وبعدين خدوا البرشامه :<br />الاذكااااااااااار طبعا بتحفظ من شياطين الجن ما بالك بقى من شياطين الانس<br />القرااااااان<br />صلاة الفجر<br />الدعاااااااااااء<br />كل دي امور غصب عن الجميع هيحترمك لان الحافظ فيها هو الله<br />وربنااااااااا يسترها معانا يارب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134442/http://www.20at.com/article2.php?sid=1007"

