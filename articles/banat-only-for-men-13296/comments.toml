posted = "2010-01-04"
text = "واحنا فعلا اللى مشوهين صوره مصر بتصرافتنا وافعالنا فعلا انت معاك حق<br />واقولك كمان احنا اللى بنسقط البنطلون وبنبن البوكسر واحنا اللى بنفتح زارير القميص عشان نبين شعر صدرنا واقولك كمان احنا اللى بقينا نوقف شعرنا زى عرف الديك عشان بنات الغرب بيعملو كده واحنا كمان اللى بنتحرش بيكو وبنغتصبكو يعنى هنعمل ايه قدام الاغراءت دى بوكسر معفن باين وجل ف الشعر وفاتحه القميص لازم طبعا نضعف قدامكو معزورين بقى<br />اقولك كمان احنا خلاص مافيش فينا بنت واحده محترمه ولاحتى مراتك ولاامك ولا اختك ولا بنتك كلنا بيقينا مش فيرجين وبنمارس الفاحشه ع الملاء ف الشارع وبقى عندناشذوذجنسى واقولك بقى نصيحه انت لومش متجوز تسافر لحسام فرنسا يشوفلك عروسه مؤدبه متربيه وبنت بنود ومتدينه تعرف ربنا بس بشرط ميكونش كان ليها بووى فريند قبلك وبعدين المواصفات دى سهله اوووى هتلاقى بسرعه ف فرنسا ده المحترمات هناك ع اقفى من يشيل واحنا ع فكره مش عايزين واحد يشكر فينا عشان مش محتاجنها منكو بس لما تيجى تتكلم اتكلم بالعقل والعدل"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

