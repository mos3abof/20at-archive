[[comments]]
order = 56
subject = ""
author = "جسام"
posted = "2010-01-04"
text = "لا اعرف لماذا هذا الهجوم علينا مع انى لم اغلط فى واحدة منكم فقط قلت رايى وهذا الراى لم اقصد واحدة معينة به بل قصدت من هم يتعرون او يلبسون كما يريدون تحدثت عن رايى انه اذا تعرت البنت العربية فانها فقدت الشرعية الاهلية لتكون بنت مسلمة محتشمة لايتحرش بيها احد والادعو ان تكونوا محتشمين ولا محجبات الكل عنده حرية فى تصرفاته اقول للفتاة التى تقول لجيمس انت لاتقدر ان تفعل ذلك فى الغرب فعلا لايقدر لان الغرب ليس بمحروم من الجنس ولا من الفتيات فهنا الجنس اكثر من الاكل هنا كل انسان يفعل مايريد ولا يحاسبه احد هنا كل انسان يفعل حتى الخطا لايوجد اخلاق ولا مثل اعلى ولااى شئ يحاسبه عليه احد يامن اتهمتونى بالزانى والفاجر ان كنتم محجبات او كنتم لاتتعروا وتستروا انفسكم لماذا الغضب من كلامى يامن تقولوا انك محترمون لماذا غضبتم من كلامى ثم انى لم اجد فيكم عموما غير جيمس هو الذى فهم مقصد كلامى وفهم ماريد لكنكم انتم تسرعتم بالشتائم ومن تشتم جسام اكثر فسنحبها اكثر اشتموا وهزقوا وافرحوا ولا تنسوا انكم بكلامكم الذى ارا فيه التخلف تضعفون موقفكم ولابد ان تحسنوا من انفسكم لتعرفوا تخاطبوا حتى لو تخاطبوا اعدائكم"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
