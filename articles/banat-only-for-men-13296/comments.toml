text = "و بعدين حاجة أخيرة ياللي اسمك جسام ..<br />بتعيب قوي على اننا كمجتمعات عربية بنصلي و في نفس الوقت لبسنا مش عاجبك ..<br />طيب مانت عامل فيها موعظ و تدعو لعدم التناقض وانت كلامك كله عكس بعضه ..<br />اذا كنت عدل قوي كدة ..عندك \" جيرل فريند \" ليه و انت عارف ان الشرع مأحلش ليك غير زوجتك !!!!!!!!<br />وانت يل جيمس .. كلامك دة مالوش غير معنى واحد .. انكم الرجال تحولتوا من بني أدمين الى مجرد \"\"\" حيوانات \"\"\"<br />يعني ايه تاخد حقك بايدك ؟!!!!! ايه التخلف و عدم التدين اللي انت وصلت ليه دة يابني !!!<br />عايز تفهمني ان ربنا ان شاء الله لما يخدك وياخد اللي زيك اليي بتسحلّوا لحم بنات الناس ربنا هايكافأك علي انت عملتو ؟!!!!<br />يوم العرض لما تقف قدامه و ايديك و رجليك تتكلم عنك بدل لسانك على ما اقترفته في حياتك .. هتقوله ساعتها ايه ؟!!! هتقول اصل هي اللي كانت لابسه و هي اللي كانت عامله !!! فين مخك و فين دينك اللي أمرك بغض بصرك و عدم اظهار عوراتك أمام المارين باللي انتو بتعملوه دة !!!<br />لا بقى في أدب و لا خشى و كلكو معقدين و لا تعرفوا ربنا !!!<br />والله كله سلف ودين واللي بتعمله في بنات الناس هيطلع على أمك و أختك و مراتك وبكره تشوف"
