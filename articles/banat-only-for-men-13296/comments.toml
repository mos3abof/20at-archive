text = "يسلم فمك ياجسام صح انتا بتتكلم صح الصح كمان ماهما ارفنا بلبسهم وبعدين يقولوا تحرش واغتصاب طيب ماتلموا نفسكم شوية هو بيتكلم صح انتم لاعارفين انتم مسلمين ولاتبع الغرب بتلبسوا لبسهم وتعملوا زيهم وتقولو احنا مش زيهم اتكلم بصراحة نفضتوه ماتحددوا ان تبع مين البنت منك فى الشارع والبيت ملاك فى الكلية وفى حواريها مغرمة بالاحضان وبعدين الواحدة منكم لبسة قصير ةجسمها باين وحالتها بلاا اى حد لازم يتحرش بيها هتقولو طيب والمحجبات فبلاش اتكلم لان فى محجبات اسخم من الا قالعين راسهم وكاشفين رجليهم واكتافهم يعنى الولد لالاقى شغل ولا لاقى جواز ولاقى واحدة ماشية فى الشارع او راكبة اتوبيس عريانة واو ضيق وماشية تهز هيعمل ايه الغلبان لازم ياخد حقه بايده ماتزعلش ياعم جسام ممكن اعرف انتا من اى بلد عربى وممكن نكون اصدقاء وياريت تقولى على الموقع الا انتا بتقول عليه لانى فضولى شوية"
