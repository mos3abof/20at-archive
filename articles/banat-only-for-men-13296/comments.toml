posted = "2010-01-03"
text = "وانتى ياخت متنرفزه انتى واجعه قلبك ليه مع شخصيه زى دى ده شكله تعبان ف دماغه والجيرل فريند عملته غسيل مخ وجاى تقول انا مش متناقض<br />ده انت شخصه تعبانه<br />وبعدين ملكش دعوه بالللى بيتحرشوا بينا<br />دول مهما عملو مش هيبقوا زيك هما لما بيعملو كده بيقى فالخفاء مش بيقولو انا مصاحب واحده ومش هتجوزها<br />وجاى تتكلم ع الفضيله والقران ياشيخ روح اتنيل ع جنب<br />الموزه بتاعتك بتندهلك شوفها عايزه ايه"
