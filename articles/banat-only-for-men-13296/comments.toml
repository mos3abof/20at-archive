posted = "2010-01-04"
text = "اشكرا انا جيمس لانك انت من تستحق الشكر ثم اننى لااضايق نفسى بما يتفوهون لاننى من اول كلامى معهم عرفت انهم ليست عندهم ثقافة الحوار او ادب الكلام مع الاخر لاتعرف كيف يفكرون هؤلاء وهل لديهم من الاساس عقل يقولون انك تتحدث عن الفضيلة فهل ترا انت فى كلامى اى تحدث عن الفضيلة يقولون اننى متشدد يقولون اننى اكره مصر هل رايت ذلك فى كلامى هل رتايتنى انصحهم ان يلبسوا النقاب او ان يصلوا كل انسان حر فى اختياره هل انا وصفت سيدات مصر بسوء لقد تكلمت عن فتيات يقولون انهم يتحرش بهم فقلت وجهة نظرى فلم تعجبهم وكما تقول انهم ملائكة فيجب ان اقول لهم انهم احسن الفتيات لاليس عندى ان اكون انسان بلا راى او ان اتاثر بتفاهات وضجيج الاخرين يقولون يامن تنصحنا وانتا زانى ومالكم بى هل قلت عليكم زوانى هل قلت انكم لو بحثتم فى الدين لرايتم ان لو امراة خرجت من بيتها متعطرة فهى زانية هل قلت لكم انكم تضعون العطر فانكم زوانى هل فعلت كما فعل شيخ ازهركم وقمت بخلع نقاب فتاة وسبيتها لااحب ان ادخل معكم فى مهاترات لانكم لاتفقهون حتى الحديث اشكرك جيمس لانك انسان مثقف وهذا ايميلى وارجو ان تقبل صداقتىgasm_arab @yahoo.com"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
