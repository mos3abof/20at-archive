posted = "2006-07-26"
text = "أنا موافق جدا و مؤيد لهذا الموضوع وفعلا بشوف جزء من هذه المواقف وخاصة أنني اسافر حيث كليتي في المنوفية فاضطرارا بركب جميع أنواع المواصلات من ميكروباصات و مترو و أتوبيسات و.... ولكن مرة رأيت موقف غير محترم في المترو فتدخلت ولكن لم اسمع الا وأنت ايه دخلك ونفس الموقف مع بعض التغيرات في الأتوبيس وقمت بتهزيء البني ادم اللي معندوش دم علي الرغم من عدم تكلمها ببنت شفة ومن ساعتها بطلت أتدخل لأن كثير مبسوطين كده ولكني لا أعمم..........."
