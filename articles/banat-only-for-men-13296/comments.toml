[[comments]]
order = 39
subject = ""
author = "واحده متنرفذه"
posted = "2010-01-02"
text = "بص يا اخ انت عشان الواحد تعب معاك من كتر الكلام ولو اني اشك في شخصيتك وانك مدسوس وكل كلامك ده نقمه علي مصر طب اشمعنا مصرعلي اساس ان امريكاو وفرنسا دي اللي فيها الفاحشه علي التليفزيونات والنت والسينما عيني عينك كده ومن غير كسوف ولا خجل وبتتكملوا عن منظمه حقوق للشواذ وحاجة تقرف وجاي تفتري علي بلد اسلامي لمجرد انك شوفت كام واحده مش محترمه تعم علي كل البلد وتقول كلهم كده انا بقولك لمره تانيه ابقي انزل شوف مصر وابقي احكم مش تبقي قاعد عندك في مكانك تحت التكيف والبطنيه وشغال تنزل اتهامات ع الناس احنا بلد اسلامي يامحترم ومجتمع محافظ وانت اتهمت وعميت كل نساء مصر بالباطل وخلي بالك لو انت قاري في الدين يامحترم هتعرف ان في ايه في القرأن بتقول<br />قال تعالى. إِنَّ الَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ الْغَافِلَاتِ الْمُؤْمِنَاتِ لُعِنُوا فِي الدُّنْيَا وَالْآخِرَةِ وَلَهُمْ عَذَابٌ عَظِيمٌ ()يَوْمَ تَشْهَدُ عَلَيْهِمْ أَلْسِنَتُهُمْ وَأَيْدِيهِمْ وَأَرْجُلُهُم بِمَا كَانُوا يَعْمَلُونَ () يَوْمَئِذٍ يُوَفِّيهِمُ اللَّهُ دِينَهُمُ الْحَقَّ وَيَعْلَمُونَ أَنَّ اللَّهَ هُوَ الْحَقُّ الْمُبِينُ..سورة النور"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
