[[comments]]
order = 66
subject = ""
author = "بسنت"
posted = "2010-01-06"
text = "ممكن اسالك شويه اساله ومعلش احترم رائ<br />اولا انت قلقان اووى كده ليه خايف عليها ولا عليك؟؟<br />لوخايف عليه وبتحبها ليه عملت كده من الاول معاها حرام عليك دى بنت ولو انتو متعودين ع كده وانا مقصدتش الاهانه بجد بس لازم تبطلو الموضوع ده عشان كده حرام.<br />لكن لو هى كويسه وانت بقى بتتسلى بيها يبقى اتقى الله ف افعلك وكما تدين تدان<br />لكن لوانتو بتحبوا بعض وحصل الى حصل يبقى لازم تتقدملها وتخطبها وتم الجواز ع اسرع وقت<br />وياريت ميكنش حصل حمل لقدر الله.<br />لكنى مانصحش بالغشاء الصينى انا معنديش تجربه ف الموضوع ده؟<br />بس تعمله ليه واذا انت ناولى فعلا انك تتجوزها وضامن ان الموضوع يتم<br />لكن لو ناوى تخلع يبقى بجد حرام عليك<br />وكده احنا بنحرض ان البنات يقعو ف الغلط ويعملو عمليه ويحطو غشاء صينى ده اسمه غش وخداع وانت ميرضكش انك تتجوز واحده عملت كده قبلك وخدعتك بالغشاء الصينى<br />انا شايفه ان انسب حل انك تتقدملها ولو الموضوع باظ واتعقد يبقى تسيبها لربنا ومتيأس ابدا ومتتخلاش عنها"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

