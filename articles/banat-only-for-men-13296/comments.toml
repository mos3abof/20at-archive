[[comments]]
order = 54
subject = ""
author = "بسنت"
posted = "2010-01-03"
text = "اقتباس جسام:<br />لست متناقض فى كلامى يامن تتهميننى بالتناقض لانى لم اقل انى شيخ او انى تربيت فى بلد عربى لان لااحب ان اعيش فى بلد عربى انا قولت رايى فى شئ معين ولست ممن يتحرشون لادافع عنهم ولست بمعجب بكم لادافع عنكم انولاتدعون انفسكم بانكم ملائكة لانى ايضا يظن اليهود وهم احقر الناس انهم ايضا ملائكة<br />اصلا مايشرفناش انك تعيش ف اى بلد عربى ومينفعش تشبهنا باليهود اظاهر دول اهلك…<br />وانت ايه اللى يخليك تدخل الموقع وتسمعنا كلام امثالك يابنى خليك مع الموزه بتاعتك<br />وقضيها…<br />اللى انت بتحبها ومش عايز تتجوزها وانشالله تموت وانت ع معصيه مع الاخت فريند وبتتريق ع بنات مصر واننا خلاص فجرنا انت مش شايف نفسك<br />بتعمل الفاحشه وفرحان بنفسك ياحليتهاوشملول اووى<br />يوم القيامه هتتعلق وهتستنى ليه يوم القيامه انت اكيد ربنا مش مباركلك ف حياتك انت وحبيبه القلب<br />ده فرحان بنفسه ياجدعان يالهوى<br />شكله من الموساد والله العظيم<br />هولسه ف ناس متخلفه كده"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

