author = "بسنت"
posted = "2010-01-04"
text = "يصراحه يابنات الحق يتقال ان الاستاذ جيمس مثقف جدااااااا وثقافته ايه من النوع العالى اوووووووووى والدليل انا قال<br />((واحده ف الشارع راكبه اتوبيس وعريانه او ماشيه تهز))<br />ده ايه الثقافه دى عشان كده انتو بقيتو اصحاب عينه واحده ولازم تبعتو تشكرات لبعض طبعا وانا معاكو بردو بشكركم صحيح ماجمع الاماوفق<br />وانت يااستاذ جيمس ياللى جمعت ان كل البنات عريانين والراجل يعنى هيبوص فين ولا فين عندى سؤال لحضرتك هى اختك وامك بينزلو عريانين ولا بيمشوا يهزو؟؟؟<br />لان من الواضح ان دى العينه الوحيده اللى انت بتشوفها العريانين واللى بيهزو انت فعلا لو محترم ومثقف زى ما العروسه شهدتلك بانك انسان مثقف وبيتمنى تتقبل صداقته<br />لايمكن كنت تقول لفظ زى ده ابدااا"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

