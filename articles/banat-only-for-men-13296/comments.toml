text = "وحق مين اللى بتتكلمو عليا ياولاد ال تييييييييييييت<br />مش من حقك ياروح… انك تلمس واحده مش حلالك ايه التخلف ده هو انت اللى هتاخد حق مش ملكك اصلا ربنا يخدكو وينتقم منكو والله العظيم ربنا ماهيسبكو ويطلع ع امك واختك وتشوفها قدام عنيك كده بيغتصبوها ناس زيكو بيدعو الفضيله<br />حتى لوقلت انا املى محترمه واختى مبتنزلش بلبس محزق وضيق وبتهز قمه قله الادب والسفاله انشالله هيعودلك ع فكره<br />وربنا عليكو"
