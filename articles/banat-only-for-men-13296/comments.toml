text = "جسام .. انت فعلا مريض .. وواضح ان قعادك برة اكسبك نوع من عدم التمييز بين الحق والباطل .. وفاهم انك لما تكون عربي وتطلع تشتم فينا نحن نساء العرب و مجتمعاتنا العربية اللي انت أصلك منها انك كدة هتنول الرضا السامي .. عشان يقولوا عليم برة انك متقدم و انك عربي أهو و مع ذلك انت مع كل ما يرسمه الغرب الماجن عن فتيات العرب المسلمات اللي اسمحلي أشرف منك و من توصيفاتك ميت مرة .. على الأقل نحن لا نتنصل من هويتنا العربية المسلمة ..<br />انت واحد عايش التناقض بين كونك عربي الأصل و بين مجتمعك الغربي المنحل اللي انت فرحانلي بيه .. ابقى خليه ينفعك وبكرة أمثالك اللي معجبين قوي كدة بالغرب هاتخدوا بالجزم ..<br />البنت اللي ممكن لبسها مش عاجب سيادتك انت والاخ المريض اللي كتب بعدك ممكن تكون عند ربنا أحسن منك ألف مرة ..<br />وانت ياللي مسمي نفسك جيمس .. في مثل بيقول \"اللي على راسو باطحة\" و \"اللي بيته من ازاز ..\" .. بتتكلم عن اللي بتهز وقلة الأدب اللي انت كاتبها دي .. بص الأول لنفسك واللي زيك ماشين بنطلوناتهم في حجرهم و بيهزوا بردوا و مواريين للناس ***** .. عيب عليكو بقى كتكو القرف مهو أمثالكو هي اللي ودت البلد في داهية"
