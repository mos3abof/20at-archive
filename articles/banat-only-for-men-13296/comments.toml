posted = "2010-01-03"
text = "هو انت تقصد بكلمه ع رؤسكم شئ يعنى اللى ع راسه بطحه صح<br />البطحه ع راسك يا…<br />مش عايزين تعليقاتكو دي تانى ولا انت ولا الاخ جيمس بوند<br />احنا مش منحطين زي بلدك<br />اظاهر انك بقى عندك عدم اتزان ياعينى<br />ومش عارف الفرق بين الفجر والفضيله<br />وانت ياخ جيمس انا والله امبارح شوفت بعينى واحده منتقبه وراكبه الاتوبيس وواحد بيمد ايده من تحت وبيلمسها<br />ده اسميه ايه؟؟؟<br />من عقليات متخلفه مش كل حاجه البنت السبب فيها<br />واقسم بالله انك لورحت اى بلد اجنبه صدفنى لايمكن تعمل اللى بتعمله هنا مع بنات الناس انا مش بوجهلك الكلام ليك انت لكن للشباب عموما<br />ومتنساش تاخد رقمه وتصاحبه<br />يمكن يشوفلك واحده تقضيها معاها شكلكو محرومين<br />حسبى الله ونعم الوكيل ف الناس اللى زيكو"
