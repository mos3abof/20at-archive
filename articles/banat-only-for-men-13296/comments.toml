text = "حاجة اخيرة ياريت يااخ انت ترحم نفسك من النقاش معانا لان مهما قولت فانت في نظرنا انسان حقير و انت من اللي ربنا قال عليهم يقولون مالا يفعلون وياريت كمان مانشوفش وشك هنا تاني في الموقع مش ناقصه الاشكال اللي زيك احنا مش بنلملم هنا<br />وياريت يابنات ترحموا نفسكوا وماتردوش عليه خليه يهاتي مع نفسو لحد مايزهق ويغور في داهيه ماتحرقوش دمكوا مع الاشكال دي دي ناس ضاله<br />حسبي الله ونعم الوكيل فيكوا ربنا ينتقم منكوا ويرحمنا من امثالكم"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 62
subject = ""
author = "واحده متنرفذه"
posted = "2010-01-04"
text = "وفي الاخر شبهتنا باليهود انهم يقلون علي انفسهم انهم ملائكه وهم احقر ناس حوش ياواد حوش الاجنحه بتاعتك هتخبط في العمود وانت تبقي ايه ان شاء الله والموزة اللي انت مقضيها معاها<br />ايه الفجور ده وجاي تتكلم علينا يابجاحتك يااخي والله العالم ده بقي ملينان مصايب والله يااخ انت لو عربي فانت عااااار علي العرب وعاااار علي الاسلام وانت عايش بنصين بتقولك انك مسلم وانت ماتعرفش اي حاجة عن تعاليم دينك اللي حرمت عليك انك تعيش مع واحده وهيه مش مراتك عارف دول اسمهم ايه اسمهم الزاني والزاينه عارف عذابهم ايه<br />{ الزَّانِيَةُ وَالزَّانِي فَاجْلِدُوا كُلَّ وَاحِدٍ مِّنْهُمَا مِئَةَ جَلْدَةٍ وَلَا تَأْخُذْكُم بِهِمَا رَأْفَةٌ فِي دِينِ اللَّهِ إِن كُنتُمْ تُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَلْيَشْهَدْ عَذَابَهُمَا طَائِفَةٌ مِّنَ الْمُؤْمِنِينَ } النور<br />يعني انت لو عايش في بلد اسلامي بتطبق الشريعه او لو كنت عشت في عهد الرسول هتتجلد انت واللي ماتتسمي الموزة بتاعتك<br />ده غير عذاب الاخرة شوفت نفسك عرفت اد ايه انت حقير وجاي تفتري علي بناتنا وتقول انهم عاهرات اظن روح حاسب نفسك الاول وتوب لربنا من افعالك الاثيمه"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 63
subject = ""
author = "واحده متنرفذه"
posted = "2010-01-04"
text = "معلش نسيت حاجة<br />الاخ ابتدي بكلاموا ب عن جد اممممم وياتري الاخ المصري اللي علمك العربيه علمك عن جد بردوه<br />وغربيه والله انك فاهم كل كلامنا وعارفو مع اننا بنتكلم بالعاميه المصريه مش باللغه الفصحي وكمان اغلب كلامنا لغه شبابيه مش غريبه علي واحد عايش في فرنسا بقالو 22 سنه<br />مش بقولك شكلك مدسوس وشاكه فيك<br />وبتقول<br />ولم ارا فى كلامى اى تناقض لم اقول انى متدين من اول قلت لى فريند وافعل معها ماشاء وهذه حريتى ومن حقكم ان تفعلوا ماتشاؤن وهزه حريتكم<br />والله هوة ده ابو التناقض بعينو وانت ازاي مسلم وانت تمارس الفاحشه مع الفريند بتاعتك انت مش شايف انك كده متناقض وانك بتخدع ربنا وبتخدع اللي حواليك هيه دي الحريه من وجهه نظرك ولما هيه دي الحريه بتتكلم عننا ليه وتحاسبنا وترجع تقول لم احاسب احد واضح انك بتنسي كل حاجة بتكتبها ارجع لكلامك واقراه كويس"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

