posted = "2010-01-04"
text = "باسف لكى ياجسام على الا بيقول عليك فمن الواضح انهم مرضى ومابيفهموش بسرعةوعاوزين حد يفهمهم فماتزعلش وعلى فكرة المصريين مش كلهم من نفس العينة التعبانة الا انتا شايفها دى الا جيبنا ورا لانهم بيشوهوا صورة المصريين والمسلمين بكلامهم وردهم التافهواصلا هما يعرفوش غير انهما يشتموا وخلاص انا معاك انى لكل انسان حريته وانه يعبر براحته وانا شايف فى كلامك انك ماقولتش انك متدين ولا شيخ علشان هما يحاسبوك على الجيرل فيرند بتاعتك انت قولت راى بس الراى ده مش على مزاجهم هما عاوزينك تشكر فيهم وتقولهم انتم احسن بنات فى الدنيا مش عاوزين يقولو انهم بيانتموافى الكليات ويعمل فضايح وبلاوى وجواز عرفى وحمل وهم مايتلم معهلشى ياجسام اصلهم مفكرين نفسهم عايشين فى قمقم فامحدش يعرف عنهم حاجة نسيوا ان العالم كله بقا قرية صغيرة والنت والدش بيجيب البلاوى كلها مثلا واحدة متنرفذة دى تلاقيها معقدة وعدت سن الجواز وموراهاش حاجة غير انها تشتم فى الرجالة وكمان والله انا فهمك ياجسام انتا بتطرح وجهة نظر وبس هما مش عاجبهم ياصاحبى اخبط دماغك فى الحيط ولو سمحت ممكن نكون اصدقاء"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107073110/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

