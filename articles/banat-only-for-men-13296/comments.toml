text = "يابسنت انا مش خايف عليها انا خايف على نفسى للبسها وانا ماليش فى الدور ده ومن الاخر انا اتجوزها ليه دى صديقة والا تفتح رجليها لواحد تفتحها لاى حد وانا ايه عرفنى انها مابتنمش مع حد تانى انا عاوز اطلسقها خليها تعدى ومش بضحك عليها لانها عارفة انى مش هتجوزها وياجيمس كلامك صح بس انتا فاهم الشهوة ياصاحبى ولما يكون قدامك مزة طحن نفس اى حد يلسمها وانتا توصل لللل هعمل ايه وصلت المهم انا معجب بيك انتا وجسام وياريت نكون اصدقاء"
