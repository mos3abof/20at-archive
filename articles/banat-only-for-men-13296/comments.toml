subject = "البنات هن السبب."
author = "حازم المكاوى"
posted = "2006-07-15"
text = "البنات فى الشارع اصبحوا فتنة كبيرة و لا ادرى كيف يسمح الاب او الام بان تخرج البنت ببنطلون استريتش و بدى ماسك على صدرها و لا يصل الى السرة (يعنى سرتها غير مغطاه) ارحموا الشباب يا بنات, على فكرة البنت هى اللى ممكن تسمح للولد انه يتجرء عليهاو لا انكر ان هناك فئة كبيرة فاسدة من الشباب و كذلك الفتيات, الا من رحم ربى."
archived = "2006-11-02"
