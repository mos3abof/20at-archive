text = "ثم اقول لكى يامن تشتم ام جيمس او اخته انا الان الذى اتهم بالفجور انا الان الذى ساعاقب لانى بشوه سمعتكمانا الان الذى سارما فى النار لانى بقول عليكم الفاحشة انتى ياسيدتى الان تشتمى سيدة وبنت لاحول لهم ولا قوة ومن المحتمل ان يكونوا اشرف واطهر منك"
