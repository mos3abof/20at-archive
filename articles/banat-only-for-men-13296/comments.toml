text = "ياعم هانى عيب عليك وحرام عليك وعليها انتا طبعا غلطان وهى اكتر منك وانا بصراحة ياجماعة بوجه كلامى للبنات اكتر من الاولاد فى حاجة زى كدا عيب عيب عيب ان بنت تصاحب ولد صداقة مش بريئة وعيب ان البنت تبقا رخيصة كدا حرام والله ان بناتنا يبقوا رخاص كدا طيب الولد بيعمل لافى غشاء بكارة ولا مجتمع بيحاسبه ولا بيلومه لكن انتى يابنت بتلاقى الف سكينة عاوزة تدبحك وعاوزة تتخلص منك واولها الشاب الا عمل معاكى كدا ياريت ياجماعة تفهموا كلامى انا وجسام فعلا جسام قالى على الموقع المصرى والله العظيم ياجماعة حاجة مالهاش وصف بنات كليات وستات متجوزة ستات كبيرة ومنقبات ومحجبات بالالافات والله حاجة فظيعة ياريت تفهموا انننا مش بيهاجمكم والله هو بيقول انا بكشف عيب بس وراى وكل انسان حر فى نفسه"
