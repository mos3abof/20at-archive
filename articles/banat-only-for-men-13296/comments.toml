text = "السلام عليكم<br />انا من سكان القاهرة وبركب المترو تقريبا يوميا وللاسف بشوف حاجات من دى كتير واللى بيحرق دمى ان البنات بتتعامل بطريقة سلبية وبتكتفى بالنظر خلفها او بتستسلم للتحرش حتى المحطة اللى هاتنزل فيها وبصراحة الواحد بيبقى مش عارف يتكلم ويهزأ الشخص ولا البنت عاجبها كده وعلشان كده ساكته لان ده اللى بيعتقده الكثير من الشخاص دى<br />وبس"
