text = "أنا شاب 25 سنة<br />أنا للأسف وأنا بمارس الجنس مع صحبتي معملتش حسابي ووقع المحظور حد يعرف ياجماعة حكاية غشاء البكارة الصيني ده وإلي كل الناس بتتكلم عليه وماحدش جاب حاجة أكيدة عنه أتمنى فعلا ماتخذولونيش في أول مشاركة ليا<br />وياريت لو مش ينفع ده طيب عايز رأي حد ذو تجربة بحاجة شبه كدة بس أرجوا رد جدي ونفسي كمان الي يرد عليا يكون عارف بش بس بيجامل لأنها بصراحة حوسة ووكسة ماأدعيش أي حد فيكو يقع فيها؟<br />إلي حاسس إنه ممكن فعلا يساعدني في الموضوع ده أنا هستنى بس أحس بجديته وهنتواصل على طول بأي طريقة أأمن من المنتدى ممكن مثلا ماسنجر."
