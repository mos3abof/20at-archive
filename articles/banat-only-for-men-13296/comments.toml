subject = ""
author = "جسام"
posted = "2010-01-22"
text = "اولا بشكرك ثانيا انا وجيمس فقط كان لنا راى ومن ثم قلناه فهذا لم يعجبهم ولاسف لانهم ليس عندهم ثقافة الحوار وكيفية رد على من يتحاورون معهم لانهم ببساطة شديدة لايحبوا ان يكونوا مخطئين وهزا عيب فيهم اوك"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212075722/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 75
subject = ""
author = "عبدالرحمن"
posted = "2010-01-23"
text = "انا دىه اول موضوع اقراة فى الموقع دة وانا داخل عن طربق الصدفه من خلال صديقى جوجل<br />انا معجب جدا بالمقال دة وبشكر يسرا وهبة عليه<br />انا منكرش انى كنت بحاول المس اى بنت قاعدة جنبي فى المواصلات لكن عمرى مفكرت انى اللمسها بايدى بس الموضوع مكنش متكرر يعنى ممكن اعد المرات دة على ايدي<br />بعد المقال دة … الموضوع دة مش هيتكرر تانى ان شاء الله … مع انى ماتزم بصلاتى وقراءة القران لكن البنت اللى بتبقى قاعدة جنبي بيبقى لبسها مستفز وممكن هى اللى تيجى تعد جنبي<br />لكن انا من النهاردة هحاول ماقعدش جنب اى بنت حتى لا تراوضنى هذه الافكار<br />لى تعليق بالنسبة للاخ حسام و جيمس وبسنت كل واحد ممكن كان يعرض وجهة نظرة باسلوب ارقى من كدة<br />الاخت \"مش مهم الاسم \" انا مش عارف هى ناسيت اسمها ولا لورد<br />انتى تحمدى ربنا انك مبتقابليش المواقف دة لكن نصيحتك اهانى انة يروح لدكتور … يعنى هو الدكتور هيهمل اة دة محتاج فرج من ربنا هو منتظر اة نت الالى فى الموقع ان اى حد يبعتلوا غشاء بكارة ولا اة …<br />هانى : انا شايف ان المشكلة مش مشكلة غشاء المشكلة انت هتقول لربنا اة دة غير ان نفس اللى عملتة او هتعملة هيتعمل فى بناتك"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212075722/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 76
subject = ""
author = "جسام"
posted = "2010-01-25"
text = "فقط جماعة قلت راى وانا لم ادخل لاشتم احد ولا انى مع احد ولا ضد احد والتى هم زعلوا من كلامى اوجه لهم كلامى الان لست ضدكم ولست معكم وليس لى اى شان بكم ولايهمنى فى اساس امركم تعريتم ام لم تتعروا فقط اقول لكم ان رايكم ليس بصحيح وليس كماتريدون لانه لابسط الاشياء ازا كنت تريد من احد ن يحترمك فاجعل كلامك هو افعالك فلا تقولوا نحن لانتعرا ونلبس ضيق ولانصادق فريند فى الجامعات وتقولوا انكم ملائكة لكى لاياتى واحد مثلى لايقفه شئ فى دنياه عنكم ان يقول لكم انك كلامكم غير صادق وانكم تجملون انفسكم فقط بالكذب"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212075722/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 77
subject = ""
author = "مش مهم الاسم"
posted = "2010-01-26"
text = "اخى عبد الرحمن أنا منستش اسمى ولاحاجه<br />انا بس مش عايزاه اكتبه هنا<br />والله انا كل يوم بحمد ربنا انى مبتبهلدش فالمواصلات<br />بس بالرغم من ده الواحد بيتعرض للمعاكسات<br />مع انى والحمد لله ملتزمه بالحجاب الشرعى<br />اما بالنسبه لنصحتى لهانى<br />فانا بس كنت عيزاه يعرف الاضرار<br />ده بعيدا تماما عن انه يتوب لربنا<br />ويسأله الفرج<br />وكمان الستر فالدنيا و الاخره<br />اما بالنسبه لحضرتك<br />فالحل مش انك متعدش جنب البنت وبس<br />لأ المفروض أنك تكون عارف ومقتنع أن الموضوع ده غلط وحرام فحرام<br />وأهم حاجه مش لحضرتك بس<br />لأ للشباب كلهم انهم يغضو بصرهم<br />والبنات لو انتى فعلا مش عايزاه حد يضايقك ولا يبصلك ولا يقولك كلمه تجرحك<br />لازم تلتزمى بالحجاب الشرعى<br />لو حد بقى كلمك ولا عمل حاجه وانتى واخده بكل الأسباب<br />يبقى فعلا أنسان مش محترم<br />وشكرا"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212075722/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 78
subject = ""
author = "مش مهم الاسم"
posted = "2010-01-27"
text = "ايوه انا عارفه البنات اللى حضرتك تقصدهم<br />الواحده فيهم بتبقى لابسه حجات غريبه<br />بجد مببقاش فاهمه هيا لابسه ايه<br />مره كنت بكلم واحده من البنات<br />كانت معايا أيام الدراسه<br />بقولها انتى مقتنعه بلبسك<br />قالتلى بكل بساطه<br />طبعا ده حجاب شرعى<br />انا مش عامله سبنش ولا حاجه<br />مع انها كانت لابسه حجات وعينك متشوف الا النور<br />بس انا الحمد لله لبسى ياأما عبيات يأما جيب وبلوزه<br />وبالنسبه لموضوع التريقه<br />فأنا فالاول كنت بكلهم تريقه أنا وصحابى<br />لحد لما سمعت حد بيقول(لاتشمت فى أخيك فيعفيه الله ويبتليك9<br />فف كل لما أشوف واحده كده بدعيلها بالهدايه<br />وربنا يهدينا كلنا ويرزقنا الثبات"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212075722/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
order = 79
subject = ""
author = "عبدالرحمن"
posted = "2010-01-27"
text = "للاسف اختى مش مهم الاسم ان كل واحده لابسه طرحة على بنطلون محزق وملرق بتفتكر انها كدة متحجبة مش كدة وبس الموضة دلوقتى تلبس جيبة قصيرة (انا مش عارف انتوا بتسموها اة ) بتبقى تحت الركبة بحاجة بسيطه وتلاقي البنت لابسة الطرحة فوقيها … انا والله بعد اضحك عليهم لان فعلا منظرها فيري فنى very funny ولو واحد صاحبى معايا بنفطس من الضحك من النكت اللى بتطلع<br />انا كنت هنسى اقولك<br />انا كنت بهزر بس مش فياريت يكون هزاري مقبول"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212075722/http://www.20at.com:80/banat/only-for-men/13296-2009-08-31-12-44-17.html"

[[comments]]
