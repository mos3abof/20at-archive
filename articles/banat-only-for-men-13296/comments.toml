subject = "مش عارفة"
author = "سارة"
posted = "2006-07-15"
text = "اهم حاجة دلوقتى نعرف اية السبب وبعد كدة نقول حل الموضوع دة اية اول حاجة ان كل واحد بيرمى الغلط على التانى البنات تقول ان الولاد منحرفين وقلالات الادب والولاد تقول ان البنات هما السبب لانهم عريانين وانهم مبقاش عندهم حياء طول محنا كدة للبنات هتتعدل ولا الولاد يا جماعة كل واحد يخلية فى نفسة يغير الاول من نفسة وبعد كدة يشوف بلاوى غيرة دة السبب الرئيسى من وجهة نظرى الحل اية بقى الحل الديييييييين اذا رجعنا للدين والسنة واقتدينابالرسول واللة لا المشكلة دى ولا غيرها هيكون موجودة اصلا ان اللة لا يغير قوما حتى يغيروا ما بانفسهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134442/http://www.20at.com/article2.php?sid=1007"

