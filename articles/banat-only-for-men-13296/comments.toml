text = "لست متناقض فى كلامى يامن تتهميننى بالتناقض لانى لم اقل انى شيخ او انى تربيت فى بلد عربى لان لااحب ان اعيش فى بلد عربى انا قولت رايى فى شئ معين ولست ممن يتحرشون لادافع عنهم ولست بمعجب بكم لادافع عنكم ولست متشدد ولست اوصف اى انسان مثلكم بالتشدد تريدى ان اقول لكى على موقع مصرى وترى فتياتكم عليه وترى هل هى واحدة ام بالمئات ووقتها قولى انى كاذب لست بالمتدين ولكننى احب ان يعيش الانسان بصراحة بدون ان يتجمل بالكذب ولاتدعون انفسكم بانكم ملائكة لانى ايضا يظن اليهود وهم احقر الناس انهم ايضا ملائكة"
