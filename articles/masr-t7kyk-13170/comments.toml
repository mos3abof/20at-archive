posted = "2009-09-04"
text = "يعنى مش خريج جديد ولا موظف فى بداية السلم الوظيفى<br />ولكنة وصل الى نهاية السلم<br />يعنى عجوز وسنة لا تقل عن 45 سنة<br />يعنى يا اما انتى قبيحة جدا ورزيلة ومصدية يا اما عانس وسنك لا يقل عن 35 سنة ومدكرة<br />وعايزين يستوروكى باى طريقة<br />طيب احنا ذنبنا اية"
