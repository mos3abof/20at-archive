text = "اقتباس ايوشة:<br />هو فى كده<br />بس والله عندك حق الشباب دلوقتى فاكر نفسه بيمن على البنات لمايروح يتقدم لها<br />وبعدين تساعده فى البنزين العربية وهو عليه برستيج العيلة هههههههه والله ضحكتنى دى ال برستيج ال حاجة تحزن<br />اى فى ايه هو انتوا لاقين جواز<br />مش قصدى انها تساعد فى البيت<br />لا بس تحمدوا ربنا ان حد بيتقدملك"
