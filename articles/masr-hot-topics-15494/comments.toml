author = "اتنين ماتوا"
posted = "2010-02-26"
text = "واحد فى المطرية والتانى فى الجيزة - لية - اثناء المطر استندوا على عمود النور فى الشارع فاتكهربوا وماتوا فى الحال<br />تحذير -<br />فى مصر المحروسة لو الدنيا مطرت اوعى تلمس عمود نور فى الشارع حتى لو ازحلقت وانكسرت رجلك ارحم ما تتكهرب وتروح فطيس<br />لان كل حاجة فى البلد دى بايظة ومحدش بيحاسب حد<br />ونبهوا على عيالكم<br />وربنا يستر"
archived = "2010-02-27"
capture_url = "https://web.archive.org/web/20100227081518/http://www.20at.com:80/masr/hot-topics/15494-2010-02-25-19-59-22.html"

[[comments]]
order = 4
subject = ""
author = "مصرى"
posted = "2010-02-26"
text = "شوية مطر زى اى شوية مطر بيسقطوا فى بنجلاديش او انجولا او موزمبيق<br />انما فى مصر حاجة تانية<br />البنية التحتية بتاع اونكل حسنى اللى اقترض من العالم مليارات علشانها وداين البلد والاجيال القادمة علشانها<br />الكهرباء انقطعت من اول زخة مطر ولا زالت مقطوعة<br />وادى انقطاع الكهرباء الى توقف مواتير المياة فانقطعت المياة ايضا<br />اما برك المياة التى سدت الشوارع وكميات الطين وتوقف السيارات والتكاتيك عن العمل فموضوع تانى<br />يعنى بمختصر الكلام البلد غرقت فى شوية مية<br />والخدمات زى الزفت والقطران<br />ويعيش الحزب الوطنى بتاع الفكر الجديد والقديم واللى لسة هيطلع"
archived = "2010-02-27"
capture_url = "https://web.archive.org/web/20100227081518/http://www.20at.com:80/masr/hot-topics/15494-2010-02-25-19-59-22.html"

