[[comments]]
order = 3
subject = ""
author = "اكتب اسمك هنا"
posted = "2007-11-13"
text = "عم نظيف اول ما جه عمل راجل اصلاحي كبير<br />وبدا في فيلم دمج البنوج<br />فلم قوي ومؤثر<br />المودعين في البنوك فرحو واستبشروا خيرا ان هذه الاصلاحات حترفع الارباح<br />ففوجئنا بعد ما الاصلاحات انتهت بانه نزل الربج من 10% الى 6%<br />يعني خرب بيوت ناس كثيرة كانت تعيش على ارباح البنوك<br />منك لله يا نضيف"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713004928/http://www.masr.20at.com:80/masr/2khbar/7578.html"
