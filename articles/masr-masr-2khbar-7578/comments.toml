subject = ""
author = "مواطن هنولولوي"
posted = "2007-11-12"
text = "واحد قريبي راح لبتوع المشاريع الصغيرة اللي فرحان بيها عم نظيف<br />المشاريع أيه؟؟<br />تربية دودة القز-عش الغراب-مخللات-تخييط ملابس وتطريز فساتين-حد يقول لي و النبي يا جماعة علشان حتجن<br />واحد معاه شهادة جامعية يعني طلع بوزه 15 سنة تعليم و يطلع يربي دود قز؟؟؟<br />يتجوز إزاي ده؟؟ يقول لأبو العروسة أنا معايا دود بس إن شاء الله حيكبر و يبقي فراش و أكسب دهب؟؟؟<br />الله يحرقكوا بجاز ياللي في بالي"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713004928/http://www.masr.20at.com:80/masr/2khbar/7578.html"

[[comments]]
order = 1
subject = ""
author = "مش هو"
posted = "2007-11-12"
text = "الراجل دة بيخاطب ناس فى هنولولو يعنى اية الشباب يعمل مشاريع بالطرق الشرعية والقانونية<br />اولا فين المكان المتوفر لكل شاب علشان يعمل مشروعة<br />ثانيا هينتج اية ويبيع لمين<br />واذا اعطوة قرض بعد ما يشوف النجوم فى عز الضهر هيسددة ازاى وتحت اى ضمان<br />كلة كلام حلو على الورق وفى الاجتماعات الوهمية اللى بتعملوها وتناقشوا فيها مشاكل الشباب فى تنجانيقا<br />يا عم نظيف نقطنا بسكاتك<br />زمانكم اغبر ومنيل"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713004928/http://www.masr.20at.com:80/masr/2khbar/7578.html"

