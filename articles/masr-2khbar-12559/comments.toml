author = "ية مالحة ووشوش كالحة"
posted = "2009-07-05"
text = "هنقول اية مية مالحة ووشوش كالحة وكنت فين يا بنت<br />وبعدين خط التليفون عند البقال ب 8 جنية والعدد الصينى تكاد تكون ببلاش - التقدم التكنولوجى فى شبكات الميكروويف جعل العملية سهلة خالص<br />ولكن للامن القومى مش امان<br />اى سفينة ممكن تقف فى البحر وتشوش على الشبكات وتشل التليفونات المحمولة دى تماما<br />وممكن اى سفارة معادية بجهاز صغير داخل مبناها تتجسس على عدد كبير من التليفونات<br />اى كلام فى الهواء ممكن اصطيادة"
