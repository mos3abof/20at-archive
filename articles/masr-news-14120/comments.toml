author = "حاجة تقرف"
posted = "2009-11-23"
text = "انا مش عارف الفنانين والمطربين الي بيتكلموا في البرامج بدوووووووووون عقل ولا اي ثقافة تذكر بس بيقلك اقطعوا العلاقات يعني الاشتاذ (احمد ادم ) الي عامل برنامج غببببببببببي لدرجة تفرس اوي وتبين تفاهته بيتكلم ليه هو فاهم حاجة في اي حاجة (واخيرا انا سعيد ان مصر خسرت مش عشان الي كانوا هيموتوا لا لا عشان كانوا هيقرفونا فقوا واصحوا الناس هتعيش ع المريخ واحنا بنقوا اضربنا وبنعيط ياناس روحوا شوفوا التعليم والصحة والعيش الي مش عارفين نكله والمياه الي مش عارفين نشربها وانته تقولي نصلي بالتشيرت"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124152704/http://www.20at.com:80/masr/news/14120-2009-11-22-08-05-27.html"

