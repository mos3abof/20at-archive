author = "تطوير اية ؟"
posted = "2010-01-06"
text = "القيادات العلمية والفطاحل الموجودين حاليا درسوا الثانوية العامة لما كانت قسمين بس قسم علمى وقسم ادبى والثانوية كانت سنة واحدة بس اللى هى سنة تالتة<br />انما البوظان اتى بعد تقسيم العلمى الى رياضيات وعلوم ومش عارف اية وكان المهندس مش هيحتاج الكيمياء ولا الدكتور هيحتاج الرياضيات ولا الكمبيوتر<br />وطبعا كلها تصريحات فى الهواء لانة لا يوجد اى اموال او فلوس لصرفها على التعليم ولا يوجد اصلاح بدون انفاق ولا اصلاح بدون فلوس - انما الاصلاح بتاع القوانين والكلام فهذة ليس لها اى لزمة"
archived = "2010-01-07"
