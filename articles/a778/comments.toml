[[comments]]
order = 0
subject = "ملاحظة صغيرة من رحماني"
text = "كلامك عن الكويت يا \" أستاذ\" / أحمد نصر الدين ينم عن جهل بقضية ولاية العهد و توريث الحكم في مشيخة الكويت... فالحكم عندهم تبادلي بين جناح \"الجابريين\"- نسل الشيخ جابر بن مبارك الكبير- و منهم الشيخ جابرالصباح الحاكم ورئيس الوزراء صباح الأحمد، و \" السوالم\"- نسل الشيخ سالم بن مبارك الكبير- و منهم الشيخ سعد العبدالله الصباح ولي العهد؛ و هذا يعني أنه لا يمكن أن تؤول ولاية العهد للشيخ صباح رئيس الوزراء ... فإ ما أن يكون الحاكم \"جابري\" و ولي العهد \"سالمي\" أو أن يكون العكس... و هنالك خلافات هذه الأيام بين جناحي العائلة إذ يقول \"السوالم\" أن \" الجابريين\" يستأثرون لأنفسهم بحقائب وزارية أكثر عدداًً و أهمية من الوزارات التي يحوزها \"السوالم\"... و عليه صار السوالم يتحدثون عن الخلافات داخل البيت الواحد و ضرورة رأبها... و للعلم فالشيخ صباح رئيس الوزراء أيضاًحالته الصحية ليست بالرائعة و لكنه بالمقارنة مع الحاكم و ولي العهد \" ماشي حاله\"... أما الأجيال الأصغر من ألأمراء فيبدوا أنهم سيقبرون و هم مازالوا في انتظار الدور!! - عفواً- المنصب."
archived = "2004-11-29"
capture_url = "https://web.archive.org/web/20041129063206/http://www.20at.com:80/article.php?sid=778"

