subject = "مشكور جداً"
text = "رغم كلامك عن الجهل والذي منه لكن في النهاية نشكرك علي التفاعل والإضافة..وحكاية ولاية العهد شبه المحجوزة للشيخ صباح ليست من اختراعي وانما كلام المهتمين بالشأن الكويتي..ويسعدنا أن ترسل لنا مايضيف من معلومات حتي نعالج جهلنا<br />شكراً"
archived = "2004-11-29"
capture_url = "https://web.archive.org/web/20041129063206/http://www.20at.com:80/article.php?sid=778"

