text = "ساعه تروح و ساعه تييجى<br />انا برده دخلت على الكواليس و مفخمتش حاجه بس كنت مبسوطه مووت من الانقلاب<br />و بعدين اتصدمت دلوقتى<br />و لا دى كانت افتكاسه و لا بعته و لا ايه<br />يا عشرينات يا ريت تفهمونا<br />هبهوب انا هموت م الفرحه بحكايه المزكرات دى و يا ريت تبعتيها و تقوليلى ع الموقع بسرعه<br />بخصوص البسبوسه منتحرمش يا باشا<br />بخصةص النكته انا مش لاقياها انتى كاتباها فين"
