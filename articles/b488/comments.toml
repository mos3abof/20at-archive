subject = "احوال عربية متخلفة"
author = "مصطفى احمد"
posted = "2006-04-27"
text = "هذه المقال الساخر لحال قادة العرب للاسف المتصارعين على الكراسى لصالحهم الشخصى لا لصالح شعوبهم المسكينة المطحونه .<br />لهذا ادعوا لمن يريد نغير عملاء الوطن من فخامة الرئساء والزعماء والملوك والسلاطين المسلطنة على من يريد تغيرهم ان يستمر فى حشد جموع الشعوب فليس بالانقلاب تتغير النظم فحدث فى كل الدول العربية انقلابات فكان الحال اسوء مما كان عليه.<br />فالتغير بيداء من هنا العقل.<br />ثم القلب.<br />ثم السلوك والحركة.<br />بالفهم والإخلاص والعمل ثم الجهاد والتجرد والأخوة ثم الثبات والتضحية ....."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114209/http://www.20at.com/article2.php?sid=488"

