[[comments]]
order = 21
subject = "يعيش عمال المواسير و أحنا مش مهم"
author = "مناضل أنترنتى قديم"
posted = "2006-02-25"
text = "يا خساره هذا هو حال كل العمليات الأنقلابيه فى بلادنا العربيه و احنا قلنا الرجاله هيعملوا حاجه جديده و هيعملوا انقلاب بص عامة الأمل موجود و بالروح بالدم نفديكى يا بلبله ولو الحرس القديم لعشرينات منع الماسينجر فعادى فى جوجل تاك و فى سكاى بى و ممكن نعمل انقلابات و اوعوا تستسلموا لان مدير الشركه عمل حركات من ديه عندنا فى القسم الفنى بس لاننا رجاله وقفنا وقفت رجاله و مسكتنالوش و عملنا مظاهرات و لانى مناضل قديم اتنين من زمايلى شالونى فوق كتفهم ومشينا فى مظاهره صاخبه من مكتبنا إلى مكتب المدير الذى يفصله عنا جدار و طالبنا بعودة حقوقنا و الحمد لله الحياه بقت زى الفل و انا اترقيت و بقيت مدير القسم و انا مع الرجاله مصعب و اصحابه عمال المواسير وممكن يعملوا مظاهره و يستولوا على الباسورد الخاصه بالسيرفر و يدوهانى و مالهومس دعوه و انا اوعدهم أن احنانغير العشرينات و نعمله تطوير ونغير اسمه للأنقلابيون المتحده وهى ديه فرحة الدنيا ............... من فوق جزيرة القطن ... مناضل قديم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114209/http://www.20at.com/article2.php?sid=488"

