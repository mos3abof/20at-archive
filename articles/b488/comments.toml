subject = "دا مقلب دوت كوم ؟"
author = "sweet_princess"
posted = "2006-02-23"
text = "انا اللي فهمته ان فيه حاجه كانت هتتقلب واتمنعت يارب المانع خير .<br />اصل احنا هنا في مصر معلوماتنا عن الانقلاب دا انه بيبقى حاجه مش حلوه بتودي على مكان من اتنين لاننا في بلد ديمقراطي بيسمح لاي حد يقول رايه من الزير (انا قصداها الزييييييير)الى الغفير يبقى عندك واحد من اتنين<br />1-اللومان (واختار اي لومان يعجبك بقى ياحلو )<br />2-العباسيه ودي ارحم بكتير طبعا من اللومان (لان ماحدش هناك هيحاسبك ع اللي بتقوله بس ع الاقل هيكون عندك امل انك تخرج في يوم من الايام ومعاك شهاده معامله تخليك تقول اللي انت عاوزه من غير ماحد يقوللك انت بتقول ايه .<br />*(( وبصراحه انا بفكر اعمل الشهاده دي من دلوقتي عشان اشتري دماغي ))<br />بس خلاص ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114209/http://www.20at.com/article2.php?sid=488"

