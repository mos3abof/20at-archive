posted = "2009-01-29"
text = "ان كانت جدتك بتولد فى الغيط وتقوم سليمة فهذة واحدة فى الالف - شاهدت المئات فى قريتى يموتون اثناء الوضع لتعثر الولادة او وضع الجنين بالعرض او يموتون بحمى النفاس<br />واية يعنى واحدة زى جدتك بقيت بفضل العناية الالهية ومئات غيرها توفوا الى رحمة اللة تعالى<br />كم كان عدد العميان والمرضى بالبرص وامراض السل الرئوى<br />كم كانت المظالم واغتصاب العائلات القوية لحقوق الضعفاء وانتهاك انسانيتهم<br />فى الخمسينات كان يعالجون الرمد عند الاطفال فى القرى بحاجة كدة مخلوطة من الجبس وبعض الدواء اسمة الششم<br />اسأل جدتك عن دواء الششم بتاع العنين<br />اسال جدتك اللى كانت بتاكل الفريك والعيش الذرة وعمرها ما شافت الارز ولا عيش القمح<br />اسألها عن ليالى القرى المظلمة والبرك والمستنقعات والناموس والبلهارسيا وتضخم الطحال والموت فى ريعان الشباب<br />كانت ايام سودة"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105151858/http://20at.com/masr/egyptian-blogs/11127.html"

