[[comments]]
order = 1
subject = "تحية لعادل بن العادلة بين الزناة"
author = "سيكو"
posted = "2006-10-04"
text = "حذاري يابن تافة الأعاجم*** وإلا نال عرضك كل قاسم<br />أعادل إن أمك من مجوس*****لها ولع بإتيان المحارم<br />تأدب يا بن خالك دون شك***لعتت من الجحاجح والأكارم<br />يدب لخدر أمك يعتليها****أخوها العلج في ليل الفواحم<br />وجدك قائم بالباب هاجت***به الشهوات في شبق مهاجم<br />يناقل بين قائمتيه قهرا*****وينغط في خلاء نغط كاظم<br />وفاض به الغرام فلم يبالي****مقولة ناصح أو لوم لائم<br />فأولج في إست أمك نصف إير**فصاحت كله يابن الأشائم<br />وهاج الجار جار السوء هذا***فأقبل نحو ثالوث الغواشم<br />وألقمها هزيل الأير راحت*** تعاصره بفيها عصر ظالم<br />تعاورها الثلاثة ينكحوها *** تراوح فوقها فعل الحوائم<br />وأمك جودها بالعرض أضحى**يصاغر عنده جود لحاتم<br />تقلب طرفها من فرط شوق***لأير مثل أعواد اللهاذم<br />وتعدل بين طراق لديها**** كجور سدوم في غبش وعاتم<br />لهذا إسمك المنحول زورا**برغمك يابن ساعية الأراقم<br />حذاري ويل أمك أن تثرني**فتعلم هجمة الصيد الضراغم<br />عفوت اليوم عنك عن إقتدار**نجوت بجذع أنف منك راغم"
archived = "2006-12-01"
capture_url = "https://web.archive.org/web/20061201081043/http://masr.20at.com:80/article.php?sid=1006"

[[comments]]
order = 2
subject = "عايزين ايه"
author = "محمد حسنى مبارك"
posted = "2006-10-05"
text = "ازيوكو يا اولادى و احبائى الاعزاء<br />عاملين ايه في الدنيا, و احوالكو ايه, اظن مافيش لا اجمل و لا احسن من كده,كل حاجة انتو عايزنها و طلبتوها عملتهلكو, عاشان بس ماخليش نفسوكو فى حاجة,وفرتلكو فرص عمل ليكو كولوكو,صحيح المرتب تعبان شوية(180 جنية) بس لازم كلنا نستحمل عشان مصرنا الحبيبة ام الدنيا, و بعدين كلنا تعبانين في حياتنا, مين فينا يعنى مبسوط,دة حتي انا و اولادى مش عارفيين ندبرها ازاى, دة الواد جمال ابنى اللي انتو قالبين عليه الدنيا يا عينى مش عارف يتجوز لغاية دلوئتى, لسا بيكون نفسه, يعنى زيو زي اي واحد فيكو, عشان تعرفوا انوكو كولوكو زي اولادى بظبط.<br />و بعدين يعنى عايزنى اقطع نفسي, انا هالاقيها منكو يا اولادى ولا من الصحفيين و لا القضاة و لا الجيش و لا المهندسين و لا مين و لا مين, بقالكو 25 سنة كاتمين علي نفسي انا و عائلتى و مش عارفين نستريح منكو و لا نريحكو, طب اعملكو ايه, كل شوية شاب من الشباب الوحشين منكو يطلع و يفضل يتكلم و يتنطط و يقول لا للتوريث, انا والله عايز اريحكو, مافيش داعي لكل اللى انتو بتعملوه ده, كدة كدة جمال جموله جماميلو جاى جاى و هاياخد مطرحى,يبقي مافيش داعى لكل دة, شوفتوا بقي انا عايز اريحكو ازاى و انتو مش عايزين ترتاحو.<br />و بعدين فى حاجة عايز اقولهالكو, و دة وعد مني, اول ما جيجو يمسك الحكم,والله (وانا بحلف اهو و انتو عارفين اني عمري ما بكدب) هاوصيي عاليكو توصية بقة عمركم ما كنتم تحلموا بيها, توصية هاتخاليكو تفضلوا تتدعولى طول عمري اللى جاي,عاش انا لسة مش ناوي اموت دلوئتي, لازم اطمن علي جوجى حبيبي و هو ريس كدة و ملعلط.<br />عشان كدة يا اولادى و حبايبي عايز اطلب منكو طلب, انا مش عارف اجيب الواد جوجي مطرحي اززاي من غير ما اخلي الناس الوحشين دول يفضلوا يزغقوا و يهللو,<br />اقرأ بقية التعليق .."
archived = "2006-12-01"
