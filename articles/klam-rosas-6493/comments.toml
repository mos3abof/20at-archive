author = "عزالدين ابراهيم"
posted = "2008-07-31"
text = "على فكرة مصطفى أمين هو ناشر البدع في مصر … وعن نفسي مابحبوش ولا اعتبره زي ما بتقولي انه عبقري … دة صحفي عميل دماغه مطرقعة ناقل كل كلامه من الغرب والغربيين يروح يعد هناك كام سنة وينقل علمهم وحضارتهم لينا … يعني مكنش راجل متحضر بالمرة"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100532/http://www.20at.com:80/klam-rosas/6493.html"

[[comments]]
order = 3
subject = ""
author = "الملاك البرئ"
posted = "2009-03-25"
text = "اذا كنت لاتحب انسان فعليك مواجهته اما اذا كان مات فعليك بالصمت واتركه للخالق وياليت من تتكلم عنه قد اذاك فى شئ<br />انما كرهك للاخرين مايجعلك تتسرع فى الامر والحكم وربما يكون يومك قادما وتكون عميلا ويقول عليك ذلك الناس ولا يوجد فى بلادنا ناشر للبدع انما نحن من نستحق المحاكمة …ومصطفى امين ليس فقط عبقرى انما ايضا صانع الصحافة فى بلادنا وياليته كان قد جعلها مثل الغرب حرة انه حقا العبقرى البدين واذا استمر احد فى قول شئ ضده فسيكون هوالظالم والعبقرى هو المظلوم"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100532/http://www.20at.com:80/klam-rosas/6493.html"

[[comments]]
order = 4
subject = ""
author = "عاشق مصطفى أمين"
posted = "2009-04-25"
text = "تقرير رائع للصحفية فمصطفى أمين بحق افضل صحفي وكاتب في زمانه . وقد تعرض لوشاية فاضحة ومعروفة من تلميذه محمد حسنين هيكل \" عراب قناة الجزيرة \" ليدخل العبقري السجن 9 سنوات بتهمة التجسس وهو منها براء وقد تم تبرئته عن طريق القضاء . ولكن شتان الفرق بين رجل كان كالجبل في مبادئه وآخرون كهيكل مستعدون لبيع المبادئ بالدولارات لكي يحيا . رحمك الله يا استاذ الأجيال"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100532/http://www.20at.com:80/klam-rosas/6493.html"

[[comments]]
order = 5
subject = ""
author = "ناجي طه"
posted = "2009-04-25"
text = "نعم هو العبقري البدين صحاب اسلوب فذ في الكتابة .. وهو ليس عبقريا فحسب بل أول من أدخل صحافة الخبر في مصر بعد ان كانت الصحف مجرد ورق محشو بكلام \" دش\" لا معنى له . أما من ينتقدوا الراحل العظيم مصطفى أمين فأشك كل الشك في انهم قرأوا له سطر واحد سواء في مقال أو كتاب . فكم من أم تترحم على هذا العبقري لأنه وشقيقه التوأم علي امين اول من دعوا لتكريم الأم وتخصيص يوم لها فجاء \" عيد الأم\" الذي حاول جمال عبد الناصر الذي ادخل مصطفى امين الى السجن ظلما ان يستبدل عيد الأم بعيد الأسرة .. فماذا حدث ؟ .. مات عبد الناصر وبقي عيد الأم خالدا .<br />هذا هو مصطفى أمين ايها المنتقدون !!"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100532/http://www.20at.com:80/klam-rosas/6493.html"
