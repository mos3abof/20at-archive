author = "عفريته"
posted = "2007-06-28"
text = "إيه المقال الجامد ده بصراحه والله تحفة بس نفسي أعرف إنتي ليه مش بتكتبي من زمان اوي إنتي اسلوبك تحفة يا ريت والنبي وحياة عشرينات ومحررين ومحررات عشرينات تفضلي تكتبي كده على طول عشان الناس كل ما بتفتكر إنك مديرة الموقع بتفتكر إنك كبيرة اوي وريهم كده كتاباتك اللى على ما اعتقد انها متطلعش غير من طفلة شقية تراوغ في كتابتها وتحاور نفسها وهي تكتب وتتالق وهى ترسم روحها على الكلمات لتزيد من معانيها معان اخري كثيرة ربنا يخليكي يا قمر لعشرينات بس تفضلي كده تكتبي على طول ها يا شيري اوعدينا بئى والنبي"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100532/http://www.20at.com:80/klam-rosas/6493.html"

