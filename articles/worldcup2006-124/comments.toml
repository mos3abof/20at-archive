subject = "زبالة يا عشرينات"
author = "واحد وخلاص"
posted = "2006-07-14"
text = "زبالة والله العظيم ..<br />وآسف لاستخدام لفظ زبالة ، لكن هو اللفظ الوحيد المعبر عن مستوى انحطاط الموضوعات<br />طول ما هتفضلوا بالمستوى دا محدش هيعلق ومحدش هيكتب<br />إيه الهبالة اللي بتعملوها دية!!"
archived = "2007-01-02"
capture_url = "https://web.archive.org/web/20070102204256/http://worldcup2006.20at.com:80/article.php?sid=124"

