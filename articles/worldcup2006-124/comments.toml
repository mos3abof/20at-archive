[[comments]]
order = 4
subject = "بطلوا حقد وتعليقات هابطة بقى"
author = "إلى الأخ (زبالة) يا عشرينات"
posted = "2006-07-15"
text = "انت ياللي كاتب زبالة يا عشرينات، لو مش عاجبك الموضوع اكتب مش عاجبك ليه، لكن لو عايز تشتم وخلاص علشان تطفش الناس من الموقع فطز فيك بجد لأن فعلاً الموقع ممتاز والموضوعات حلووووووووووة مووووت وبالذات ولاد البلد وكاس العالم... وصح النوم.. قال زبالة قال...!!!!"
archived = "2007-01-02"
capture_url = "https://web.archive.org/web/20070102204256/http://worldcup2006.20at.com:80/article.php?sid=124"

