author = "محمد الجزائري"
posted = "2009-11-18"
text = "أولا أشكر إدارة الموقع جزيل الشكر على فتح مثل هذه المجالات للنقاش، ومبروك الفوز للمنتخب الوطني الجزائري مع خالص الشكر للإخوة السودانيين على إحتضانهم لهذا الحدث.<br />أعتقد أنه حق للإخوة العرب أن يناصروا هذا المنتخب لأنه الوحيد الذي صعد للمونديال"
archived = "2009-11-20"
capture_url = "https://web.archive.org/web/20091120045038/http://www.20at.com:80/20at/latest-news/14097-2009-11-18-20-14-29.html"

