author = "من غير اسم"
posted = "2009-11-18"
text = "يا جدعان والله ده كلام من واحد قرفان … كل اللى خرجت بيه من الفيلم بتاع التصفيات دى … الجزائر دى حكومة ودولة وشعب ولعيبة والله سفلة سفلة سفلة … بجد لعب زبالة وتشجيع زبالة بل وحكومة زبالة والله خسارة فيهم كلمة الأخوة اللى كنا متمسكين بيها رغم الاهانات … حسبى الله ونعم الوكيل فى دى ناس .. ان كانوا ناس اصلا … اعتقد هما والاسرائيلين عندى سواء … موتهم احسن"
archived = "2009-11-20"
capture_url = "https://web.archive.org/web/20091120045038/http://www.20at.com:80/20at/latest-news/14097-2009-11-18-20-14-29.html"

[[comments]]
order = 5
subject = ""
author = "خسارة والف حسارة"
posted = "2009-11-18"
text = "اقول في البداية قدر الله وما شاء فعل …<br />دائما وأبدا بصر المنتخب المصري في مناسبات عديدة على ادخال الحزن ف قلوب الملايين .. ف مونديال كاس القارات بعد ان كنا قاب قوسين او اندى من تخطي عقبة امريكا والوصول للدور ال 16 ،يخرج من أمريكا ، والآن يخرج من الجزائر بعد مباراة باهتة لو يملكوا فيها زمام الامور ..<br />هنئيا للجمهور الجزئري ومن حقكم الفرحة وهي مستحقة .. أما نحن فوقفة قليلة او كثيرة مع النفس مع مجريات حياتنا بعيدا قليلا عن الكرة"
archived = "2009-11-20"
capture_url = "https://web.archive.org/web/20091120045038/http://www.20at.com:80/20at/latest-news/14097-2009-11-18-20-14-29.html"

