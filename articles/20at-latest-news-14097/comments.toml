text = "أولاً وقبل كل شي أهنئ الجزائر على ه>ا الفوز المبارك وعسى أن يكون الكأس من حليفكم<br />فأثبتم بلعبكم أنكم أفضل من أولئك .. فكنتم خير ممثلين لبلدكم .. بلد المليون ونصف المليون شهيد .. بلد المناضل الأمير عبدالقادر الجزائري انكم كنتم وما زلتم على الوعد باقون<br />اما بالنسبة لمصر فأقول موتوا بغيظكم وحسرتكم …<br />واللي ما يطول العنب حامض عنه نقووووووووووووو وووووووووول<br />مبروك للجزائر<br />** أردني متزوج من جزائرية"
