text = "انت زعلان على الحديدة- طيب انا اعرف واحد بينام بدرى ويشرب الحليب وفى الصبح بيشيل حديد وعندة حديد كتير قوى- روح خد لك حديدة<br />ياعم اصحى بقى ماسرقوا الصندوق زعلان قوى على المفتاح<br />سلم لى على المترو"
