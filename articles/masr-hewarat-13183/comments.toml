author = "امولة الجامدة"
posted = "2009-09-15"
text = "انا بصراحة نفسي اشوفك ويا رب تكون بتفتح الموقع ده<br />انا من الاسماعيلية انا عندي فكرة ايه رأيك تيجي في مدرستنا تخليهاكول شوية<br />لانها مدرسة كئيبة انا لو كنت اقدر اجي عندك كنت عملتها والله بس انا مش عارفة مكانك<br />على العموم مدرستنا اسمها الخلفاء الراشدين في منطقة الاطباء والصيادلة انت احسن واحد<br />تظبطها لو جيت اسال عن امال هشام وهم هيجبوني علطول"
archived = "2009-10-09"
capture_url = "https://web.archive.org/web/20091009153627/http://www.20at.com:80/masr/hewarat/13183-2009-09-05-12-36-35.html"

