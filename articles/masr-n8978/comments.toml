order = 0
subject = "نفسي اشوفو مرة تانية"
author = "ريما"
posted = "2006-10-12"
text = "اكتر مسلسل نفسي اشوفو مرة تانية هو حديث الصباح و المساء لان احداثو كتيرة و سريعة و حاسة اني محتاجة اشوفو كمان مرة عشان في كتير تفاصيل اكيد مرت علي من زخم الاحداث<br />و بحب كمان الشهد و الدموع و ليلة القبض على فاطمة و عباس الابيض و ثلاثية نجيب محفوظ بالذات الجزء الاول بين القصرين<br />و طبعا المسلسل الي ما بمل لو شفتو ميت مرة رافت الهجان<br />و في كمان مسلسل سوري كتير حلو اسمو الخشخاش نفسي اشوفو كمان مرة<br />بس بكره مسلسلات الهام شاهين بحسها كتير مملة و يسرا صايرة بالنازل مع انها بدت بمسلسلات حلوة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061710/http://masr.20at.com:80/article.php?sid=1045"

