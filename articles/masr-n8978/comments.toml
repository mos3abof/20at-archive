subject = "معالي زايد في عملين"
author = "خليل"
posted = "2006-11-23"
text = "ابدعت هذا العام الفنانة الجميلة معالي زايد في عملين جيدين<br />الاول - امراءة من الصعيد الجواني<br />الثاني- حضرة المتهم ابي<br />كما لن انى لها اعمال تلفزيونية رائعة مثل الحاوي- دموع في عيون وقحة- ثلاثية نجيب محفوظ- حلم الجنوبي- الدم والنار- اهل الدنيا- ام العروسة"
