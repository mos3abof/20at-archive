posted = "2006-10-24"
text = "والله هو احسن المسلسلات على الاطلاق السنة دى وبصراحة اكتر واحد فقع مرارتى هو بتاع تيسير فهمى ومن راى انها تتستت وتقعد بقى فى بيتها ومتقرفناش هى والشلة العظيمة زى فيفى هانم والليدى الهام والعصفورة نادية والامورة نبيلة وكفااااااااااااااااااااااااااية بقى وجعتولنا بطنانا واحب اهنى نور الشريف والفريق كلة على المسلسل لان كل واحد كان على قد دورة بالظبط واهنى احمد ميدوووووووووو وبقولة الى الامام يا روميل وفى تقدم باذن اللة ولكن اتقى الله ايضا فى نفسك ونفسى يعيدو المسلسل تانى بقى ورافت الهجان"
