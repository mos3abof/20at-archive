subject = "اجمد المسلسلات"
author = "مصرية"
posted = "2006-10-21"
text = "بجد احلى مسلسلات واجمد مسلسلات هما:<br />يوميات ونيس وميزو وسوق العصر وسنبل وارابيسك ونصف ربيع الاخر ورأفت الهجان والعميل 1001وام كلثوم وامرأة من نار بتاع الهام شاهيين و مسلسل عباس الابيض فى اليوم الاسود والمال والبنون والشهد والدموع واليالى الحلمية .<br />ومن السلسلات السورية المسلسل الرائع الحور العين وسلسلة المارقون ويقتلون الياسمين.<br />ومن المسلسلات الخليجية عمارة الاسرار"
