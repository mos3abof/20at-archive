[[comments]]
order = 12
subject = "يا استا ذ فارس"
author = "مصرية"
posted = "2006-10-21"
text = "يا استاذ فارس انا مع الاخ صاحب تعليق\"وما سمى الانسان انسانا إلا لانه ينسى\" بجد فكر مع نفسك هى عملت ايه لحبكم انا من رأيى ومتزعلش منى انى كان موقفهامن اهلها ضعيف يعنى كان المفروض انها تدافع عن حبكم بس مش معنى كدة انى هى تعمل خناقة لرب السما مع اهلها بس كانت مثلا تقعد مع اخوها وتسأله هو ليه رفضك وخصوصا انك كنت اشتغلت والقرش جرى فى إيدك\"واوعى تفتكر انى بقر انا بحسد بس\" انا على حد علمى انى اللى يحب لازم يدافع عن حبه وللاسف هى كان موقفها ضعيف ويا اخ فارس حاول تدور على واحدة غيرها وحاول تدى عقلك فرصة انه ينساها انا عارفة انه صعب بس حاول وبعدين يا سيدى اللى خلقها اكيد خلق غيرها وكمان لازم ترضى بنصيبك ولو ليك نصيب فيها هتتقبله وهتتجوزه حتى ولو بعد 30 سنة اينعم هتكونوا عجزتوا بس لو ربنا كتبلكم انكم تتقبله ان شاء الله هتتقبله وان شاء الله ربنا يرزقك بواحدة احسن منها"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061710/http://masr.20at.com:80/article.php?sid=1045"

[[comments]]
order = 13
subject = "ربنا تاب على والحمد لله"
author = "ام محمد"
posted = "2006-10-22"
text = "انا من 3سنوات بالضبط قررت التفرغ الكامل فى شهر رمضان للعباده فقط واغلقت التليفزيون تماما وربنا سبحانه وتعالى من على وتاب على من هؤلاء الكذابين اللذين يسمون انفسهم ممثلين والله يا جماعهاكبر متعه انك تتفرغ للعباده وخصوصا فى شهر رمضان جربوا كده فى رمضان القادم ان شاء الله حتحسوا بالفرق واضح اغلقوا هذاالمفسديون على راى الشيخ وجدى غنيم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061710/http://masr.20at.com:80/article.php?sid=1045"

[[comments]]
order = 14
subject = "الحمد الله اللي أبعدني عن المسلسلات والأفلام"
author = "عبدالرحمن"
posted = "2006-10-23"
text = "حياتي كلها كانت أفلام ومسلسلات وفوازير وأغاني ولكن بصراحو ما مشفتش السعادة الحقيقية والراحة النفسية إلا لما تركت مشاهدة كل هذه الأعمال اللي ضيعت وقتي وحياتي وتفرغت لطاعة ربنا ... من تقريبا ست سنوات كده ... أعصابي ارتاحت جدا جدا وبقيت بسامح أوي وبغفر اللي يخطئ بحقي ونفسيتي تحسنت أوي أصبحت السعادة ليها طعم تاني .. شعرت كم كنت سخيفا عندما ضيعت عمري بمشاهدة هذه السخافات واللي أصحابها بيطلعوا بدور الناصحين وهم في الحقيقة غير كده خالص ... وصدقت سعاد حسني عندما قالت في أيامها الأخيرة قبل موتها \" الفن دمر حياتي \" ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061710/http://masr.20at.com:80/article.php?sid=1045"

[[comments]]
order = 15
subject = "سؤال واحد بس ليه"
author = "انسان"
posted = "2006-10-23"
text = "أنا مشكلتي إن مسلسلي مع نفسي مكرر بس مسلي ممكن يتصنف كوميدي وممكن يتصنف كوميدا سوداء أو ممكن يكون ملهاة /أنا بطبعي خدوم وباكون سعيد لما أمد ايدي بالمساعدة ودايما بابخل على نفسي وأخدم غيري ... من 5 سنين بالظبط واحدة من اللي ساعدتهم اتصلت بي عشان تشكرني والشكوى اتقلبت صداقة والصداقة اتقلبت حب من طرفها ومن ناحيتي عمري ما بخلت بعطاء حتى عطاء المشاعر اديتها اللي هي عايزاه ... رغبتها في التقرب الى أصبحت تزداد يوما بعد يوم وانا متجاوب ثم منساق ثم متأثر بشدة وسعيد في نفس الوقت ,وفجأة وبدون أدنى مبالغة في أقل من يوم (بين عشية وضحاها) تغير ألأمر برمته جمد صوتها وفترت حماسهالي بدون أي مبرر منطقي ...ومن ناحيتي كل ما كنت أتمنى معرفته السبب فقط السبب الذي قلب حالها وغير معاملتها لي دون جدوى مما احالني لحالة غريبة من الشك في نفسي وفي كل من حولي بلا نوم بلا أكل لمدة تتجاوز الشهر وتركت البلد بكاملها لأجل أن أتخلص من حالتي المستعصية بعد أن استعصى على معرفة السبب الذي من أجله حدث ما حدث , إلى هنا والأحداث قدتبدو منطقية أو عادية , ولكن الطبع يغلب التطبع وحدث نفس الأمر معي بالحرف والكلمة والمعني وادق التفاصيل وأيضا دون أي سبب منطقي , ما علينا<br />نركت الجمهورية بأكملها وهاجرت إلى بلد بعيد لأنأى بنفسي عن الموت كمدا<br />فهل عادي أو طبيعي أو منطقي أن يتكرر الأمر بنفس الصورة والسكنات والحركات<br />رغم أنني في كل الأحوال لم أكن أبداً البادئ<br />من يجد الحل أرجو أن يدلني عليه<br />أرجوكم لأنهي هذا المسلسل اللا متناهي<br />من الكمد والحسرة<br />والحيرة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061710/http://masr.20at.com:80/article.php?sid=1045"

