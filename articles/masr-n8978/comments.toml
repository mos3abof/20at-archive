[[comments]]
order = 27
subject = "محمود المصرى"
author = "شريف"
posted = "2006-11-08"
text = "أما منة صلاح الدين 24سنة فتقول أن التليفزيون أصبح شيء ضروري لنا وبالتالي أصبحنا نهتم بالدراما التليفزيونية خاصاً مع فشل معظم البرامج التي تعرض حالياً وأنا بالنسبة لي أحب جداً مسلسل رأفت الهجان كما أن مسلسل ريا وسكينة كان أكثر من رائع.<br />أما للأعمال التي لم أستطيع أن أكملها فهذه كثيرة جدأ ولا أستطع حصرها مثل مسلسل \"محمود المصري\" لأنه ممل ورتيب وغير واقعي، ومسلسل \"السندريلا\" الذى يعرض حالياً بجد ضحكة منى زكى مستفزة وثقل دم مدحت صالح غير محتمل.<br />ويقول حامد عبد المقصود 26 سنة أنا بحب المسلسلات القديمة شوية مثل مسلسل \"الشهد والدموع\" وبكيزة وزغلول ومسلسل \"مطلوب عروسة\" و\"لن أعيش في جلباب أبي\" لأنها كانت ومازالت أعمال متميزة وإلى الآن عندما تعرض هذه المسلسلات أحرص على مشاهدتها.<br />أما وائل منصور فأكد أن كل المسلسلات العربية دون المستوى ويتذكر أنه حاول مشاهدة مسلسل الحفار لنور الشريف منذ أكثر من 10 سنوات ولكنه لم يستطيع مواصلة هذا لأكثر من ثلاثة أيام ولكنه أكد انه حريص على مشاهدة المسلسلات الأجنبية على ام بي سي 2 وone tv.<br />الضوء الشارد<br />منال محمد 22 سنة أكدت أنها معجبة بمسلسلات كثيرة جداً ولكن المسلسلات التي تعلقت بها بالفعل هي \"الضوء الشارد\" و\"ليلة القبض على فاطمة\" و\"جوارى بلا قيود\" و\"الحرملك\" و\"عباس الأبيض\" و\"ليالى الحلمية\" و\"هو وهى\" و\"حديث الصباح والمساء\" و\"زيزنيا\" و\"حب وأشياء أخرى\" و\"البخيل وأنا\" و\"الرايا البيضا\" و\"سنبل\" و\"عائلة ونيس\".<br />وقالت \"أن هذه المسلسلات عمري ما هزهق منها لأنها من وجهة نظري أعمال رائعة\"، وأضافت \"يوجد مسلسلات من أبطالها لا أستطيع مشاهدتها مثل جميع مسلسلات فيفي عبده بلا استثناء ويسرا والهام شاهين\".<br />وقال ياسر عبد الله: أنا بحب المسلسلات الكوميدي جداً، ه<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121222923/http://masr.20at.com:80/article.php?sid=1045"

[[comments]]
order = 28
subject = "الضوء الشارد"
author = "amira"
posted = "2006-11-08"
text = "محمد 22 سنة أكدت أنها معجبة بمسلسلات كثيرة جداً ولكن المسلسلات التي تعلقت بها بالفعل هي \"الضوء الشارد\" و\"ليلة القبض على فاطمة\" و\"جوارى بلا قيود\" و\"الحرملك\" و\"عباس الأبيض\" و\"ليالى الحلمية\" و\"هو وهى\" و\"حديث الصباح والمساء\" و\"زيزنيا\" و\"حب وأشياء أخرى\" و\"البخيل وأنا\" و\"الرايا البيضا\" و\"سنبل\" و\"عائلة ونيس\".<br />وقالت \"أن هذه المسلسلات عمري ما هزهق منها لأنها من وجهة نظري أعمال رائعة\"، وأضافت \"يوجد مسلسلات من أبطالها لا أستطيع مشاهدتها مثل جميع مسلسلات فيفي عبده بلا استثناء ويسرا والهام شاهين\".<br />وقال ياسر عبد الله: أنا بحب المسلسلات الكوميدي جداً، هذا هو النوع الذي أشاهده فقط ولا أشاهد غيره. وأضاف \"والمسلسل اللي بموت فيه هو (ميزو) لسمير غانم و\"النساء قادمون\" لحسين فهمى\".<br />وأنت إيه أخر مسلسل عجبك وتحب تتفرج عليه تاني، وإيه المسلسل اللي مش ناوي تقرب له بعد كدة؟<br />عدد التعليقات : 30<br />نفسي اشوفو مرة تانية"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121222923/http://masr.20at.com:80/article.php?sid=1045"

[[comments]]
order = 29
subject = "خدنا إيه من كل هذه المسلسلات سوي ضياع وقتنا علي الفاضي"
author = "عبدالله"
posted = "2006-11-10"
text = "لو كنا نقضي الوقت اللي انقضيه في مشاهدة هذه المسلسلات الطويلة جدا والأفلام الكثيرة جدا والمسرحيات الطويلة جدا في طاعة الله تعالي مش أحسن لينا في الدنيا والآخرة ؟ لو كانت هذه الأفلام والمسلسلات والمسرحيات لها فائدة لأصبح مجتمعنا من أرقي المجتمعات لأننا من الأكثر الناس انتاجا ومشاهدة لهذه الأعمال فأين التطور والتقدم في حياتنا ؟ بدل ما نضيع وقتنا في مشاهدة مسلسلات بحبك وتحبيني خلونا نستغل وقتنا وطاقتنا في طاعة الله تعالي<br />... وفي الدعوة إلي الله تعالي .... فنور الشريف ويحي الفخراني بأخذوا ملايين علشان يمثلوا هذه المسلسلات فهم يأخذوا الملايين والذنوب ونحن نأخذ الذنوب فقط ... ليه بس كده؟<br />خلونا نجرب نعيش من غير دوشة هذه المسلسلات علشان نفكر صح في دنيانا وآخرتنا ... ففي القبر مش ينفعك لا مسلسل ولا فيلم ولا نور الشريف ولا يحي الفخراني يسأل عنك وأنت في قبرك ."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121222923/http://masr.20at.com:80/article.php?sid=1045"

