[[comments]]
order = 8
subject = "عندك حق"
author = "ابن المنصوره"
posted = "2006-10-15"
text = "عندك حق مسلسلات الهام شاهين ممله في الاساس مصممه تطلع في دور بنت العشرين زي ما كانت بوسي بتعمل يبقي عندها 45 سنه( انا كده بكرمها في السن) وتقوم بدور بنت في العشرين وكمان المصيبه الكبيره فيفي عبده مصممه تمثل وايه معملتشي غير مسلسل واحد الي حلو والباقي عارفين مكانه الحقيقي ...<br />نفسي اشوف مسلسل للعداله وجوه كثيره..رغم انا مش من هواه مشاهده الحاجه اكتر من مره بس المسلسل ده في فرق اداء رائع من يحيي الفخراني والاغاني الجميله.. وكمان مسلسل الاصدقاء روح تانتيه خالص"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061710/http://masr.20at.com:80/article.php?sid=1045"

[[comments]]
order = 9
subject = "ياااااااه كنتييييير"
author = "نيفين نيفى نوفا"
posted = "2006-10-15"
text = "المسلسلات الحلو كتير و الله يا جماعه خدو عندكو:<br />سوق العصر<br />يوميات و نيس<br />ليالى الحلميه<br />ارابيسك(رائع)<br />الرايه البيضا<br />زيزينيا(ملحمه اسكندرانيه)<br />المال و البنون<br />مساله مبدا(رغم انف الحاقدين)<br />نصف ربيع الاخر(تحفه لن تتكرر)<br />رجل فى زمن العولمه(الجزئين احلى من بعض)<br />وفى المسلسلات السوريه الحور العين و فى الخليجى هدوء و عواصف<br />بالنسبه للسنه دى المسلسلات افضل من السنه اللى فاتت<br />بس الجميل فعلا الاعلانات<br />اعلانات موبينيل و فودافون حلوه جدا<br />و الاعلان التحفه اعلان شريف صبرى يتاع كليوباترا<br />الميوزيك فيه ملهاش حل فعلا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061710/http://masr.20at.com:80/article.php?sid=1045"

