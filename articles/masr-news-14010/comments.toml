subject = ""
author = "المانيا فوق الجميع"
posted = "2009-11-11"
text = "شايفين عدالة القضاء الالمانى السريع - كم استغرقت فترة المحاكمة ؟<br />وكم استغرقت محاكمة السكرى فى قضية سوزان تميم<br />على العموم معروف تاريخيا ان المانيا فوق الجميع<br />ويا خوفى لبكرة يطلع واحد من الحزب الوطنى ويقول فى بيان ان الحزب الوطنى الحاكم كان وراء صدور الحكم فى قضية مقتل مروة الشربينى<br />وانة لولا التوجيهات والاشارات والايماءات لما صدر مثل هذا الحكم<br />واعتقد ان حكومة نظيف سوف تضيف هذا الحكم فى سجل انجازاتها فى كتاب العام القادم<br />هاى هتلر<br />المانيا فوق الجميع"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121444/http://www.20at.com:80/masr/news/14010-2009-11-11-21-06-35.html"

