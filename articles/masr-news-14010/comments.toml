subject = ""
author = "قضية قومية"
posted = "2009-11-11"
text = "هى قتل مصرية فى المانيا اصبحت قضية قومية وتنشر فى عناوين الصحف<br />طيب يا سيدى فية ضابط شرطة كبير فى اسكندرية ضرب معوق بخشبة على راسة وقتلة داخل السجن بعد تعذيب شديد و حكم علية القضاء المصرى اللى بيقولوا علية نزية ب 5 سنين سجن<br />المانيا حكمت على القاتل بمدى الحياة سجن<br />و مصر حكمت على قاتل مجرم بالسليقة ب 5 سنين سجن - حتى ان صحيفة امريكية استهجنت الحكم<br />قضاء المانيا لما حكم وفى ظرف اسبوعين من المحاكمة اثبت ان القضاء المصرى بكل الدعاية عنة قضاء متخلف و بطىء وممل وغير عادل"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121444/http://www.20at.com:80/masr/news/14010-2009-11-11-21-06-35.html"

