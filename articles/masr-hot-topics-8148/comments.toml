author = "اكتب اسمك هنا"
posted = "2008-01-29"
text = "بصراحه حاسه ان نهال عنبر متقولش كده غير كده وكده اللى جاب نهال لمنه شلبى دى شكل ودى شكل تانى"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085200/http://www.harb.20at.com:80/masr/t7kyk/8148.html"

[[comments]]
order = 1
subject = ""
posted = "2008-01-30"
text = "علشان خاطر كده كل المشاهير ليسوا فنانين اصلا والواحد لما بيتفرج على فيلم او تمثيلية نفسه بتتغم بعكس افلام زمان ومسلسلات زمان (الفنانين الحقيقيين)<br />الان المنتجين كلاب ما بيوصلوش حد وخصوصا (النجمات) الا اللي يبيعوا نفسهم الاول<br />ولذلك كل النجمات المشهورات الان للاسف ما بيعرفوش يمثلوا<br />والممثلين الحقيقيين غابوا عن حقل الفن"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085200/http://www.harb.20at.com:80/masr/t7kyk/8148.html"

[[comments]]
order = 2
subject = ""
posted = "2008-01-31"
text = "يا استاذ رخم الشعره هنا كناية<br />يعني هي تقصد انها لم تفرط في شرفها قيد شعره وهي اقل شيء<br />واقل اشيء في التفريض ممكن تكون بوسة مثلا<br />فهي تقصد انها لم تفرض في عرضها بأقل شيء حتى البوسة"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085200/http://www.harb.20at.com:80/masr/t7kyk/8148.html"

[[comments]]
order = 3
subject = ""
author = "رخم"
posted = "2008-01-31"
text = "انها تقول انها لم تفرط فى شعرة من جسدها<br />والسؤال شعر اى منطقة فى جسدها - الموضوع محتاج تفسير - الشعر فى مناطق كثيرة من الجسم"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085200/http://www.harb.20at.com:80/masr/t7kyk/8148.html"

[[comments]]
order = 4
subject = ""
author = "الزير سالم"
posted = "2008-02-01"
text = "الست ما فرطشى فى شعرة من جسدها - طيب ما هو دى العادى - والا كل الستات بتفرط - هو الشرف بقى نادر دلوقتى والا اية -<br />اللى بتسمح بالتفريط فى حاجة فهذة بتفرط فى كرامتها - فى قيمتها كا انسانة محترمة<br />واحنا والحمد للة كل الستات فى بلدنا محترمات الا اقلية منحلة تتشبة بالغرب الصليبى المنحل اللى الولد بيعمل علاقة مع امة"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085200/http://www.harb.20at.com:80/masr/t7kyk/8148.html"

[[comments]]
order = 5
subject = ""
posted = "2008-02-03"
text = "وماذا عن علاقاتك بعايدة رياض؟<br />اهي بأه عايده رياض هي اللي فرطت في كل جسمها وبدأت ايام ميمي شكيب<br />فاكريتن ميمي شكيب وقضية الدعارة بتاعة الفنانات كانت ساعتها عايدة رياض متجوزة محرم فؤاد<br />وبعدين المفروض الشعب المصري يسيبه من حكاية الافلام والكلام الفارغ دا ويوفر فلوسه لحاجة تانية<br />والفنانين يتعلمولهم صنعة احسن من العمل في فن فن اثارة الغرائز"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085200/http://www.harb.20at.com:80/masr/t7kyk/8148.html"

[[comments]]
order = 6
subject = ""
author = "مش لازم"
posted = "2008-02-03"
text = "لان الراجل يا عين امه في عهد مبارك بيلهث ورا لقمة العيش<br />مش زي زمان بيشتغل نص يوم ويرجع يعد النص التاني في البيت مع اولاده يدير شئونهم<br />دا الراجل بيشتغل في عهد مبارك 48 ساعة في الاربع وعشرين ساعة صراع البقاء من اجل لقمة العيش<br />يعني انا مثلا بشتغل موظف حكومة وبخلص الساعة اربعة بخلص واروح اشتغل في مكان تاني بعد الظهر لغاية معاد النوم وتتصوروا يوم الاجازة بشتغل فيه برضه<br />ومراتي بتقولي على العيال انت عامل زي عمهم مش ابوهم لانهم ما بيشوفونيش الا على الماشي"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630085200/http://www.harb.20at.com:80/masr/t7kyk/8148.html"
