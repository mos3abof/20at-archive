text = "طبعا لازم رونالدنييو البطل كفاية حركات الايجابية فى كل المبارايات والبطولات مع نادية ومع المنتخب البرازيلي هو ده البطل الحقيقى بيلعب فى بيرسلونة نجم كبير فوق العادة فى أي مكان يارب يارب يارب الكورة فى جمهورية مصر العربية تكون كورة حقيقة علشان ناخد كاس العالم مش يارب نتأهل التأهل شي والتخطيط لكاس العالم شي أخر .<br />ياشلة اتحاد الكورة ياشلة نادي الاهلى المحترم ياشلة نادي الزمالك البطل خمس نجوم يابرازيل افريقيا يا درويش يابو أسكندر يامجدع والصعيدة الرجالة وكل بتوع البترول مش عارفين نعمل منتخب ونفوز بكاس العالم حرام عليكو حرام عليكوا انا عندى الحل نيمو اندية القمه اللى هرونا وجع قلب ومرة واحدة كونوا فى عملكوم ققلب واد يارب يارب يارب يفهموا<br />انا لله وانا اليه راجعوان مشجع ورياضى سابق"
