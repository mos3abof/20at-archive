author = "واحد من على القهوة"
posted = "2007-12-18"
text = "انا اتفرجت على المسلسل فى قهوة فى بولاق وكان بيتكلم على تجار الكيف والمخدرات وللاسف المسلسل بيقول ان التجار دول بيشتغلوا عند شخصيات كبيرة زى لواءات سابقين فى الداخلية ومحميين تماما<br />وان كل ارباح الحشيش والبانجو وهى مليارات بتروح لاسرائيل<br />وان عملاء اسرائيل من الرتب السابقين هم اللى بيوزعوا الحشيش<br />ربنا يستر"
