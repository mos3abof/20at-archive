[[comments]]
order = 0
subject = "كله زى بعضه"
author = "أى تغيير فى الدستور وأى تغيير فى الإنتخابات مع وجود مبارك وعائلته يعتبر تهريج وضياع وقت"
posted = "2007-02-18"
text = "التغيير يبدأ بإسقاط مبارك وحكم إنتقالى وإفراج عن المعتقلين السياسيين المظلومين ويكون الحكم فيه للقضاه الشرفاء ثم إنتخابات بإشراف قضائى كامل وبعدها يوضع دستور من لجان متخصصه وبإشراف الشعب وموافقته عليه<br />لكن إصلاح مع وجود نفس العفانة ونفس الوجوه فهذا لن يحدث والجميع يعرف أن الإصلاح المقصود بيه توريث الحكم وهذا مرفوض نهائى ولن يحدث فلا داعى لأى إصلاح إلا بسقوط هذا الفاسد مبارك وعائلته ومحاكمتهم على ما أصاب مصر أسوة بكل الخونة"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221024927/http://masr.20at.com:80/article.php?sid=1606"

