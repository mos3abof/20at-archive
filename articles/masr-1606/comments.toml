subject = "شهادة فشل"
author = "نشرت الواشنطن بوست اسوأ عشرين دولة سياسيا فى العالم"
posted = "2007-02-18"
text = "وكانت الحبيبة مصر من بين الاسوأ على مستوى العالم<br />مستنيين اية ما تقوموا تروحوا"
