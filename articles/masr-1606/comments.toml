[[comments]]
order = 2
subject = "احنا ههههه"
author = "كوكوكو"
posted = "2007-02-18"
text = "عايشين وطاويط<br />ساكتين علطول<br />وإن قلنا كلام فكلامنا عبيط<br />بنقول في كلام<br />ومهوش مسموع<br />وإن مره سمعته تقول ظغاريط<br />قاعدين بنقول ونعيد ونزيد<br />بنقول شعارات<br />وكلام وحديت<br />وهنعمل إيه ماهو صووت مكتوم<br />طالع من جوه بحر غويط<br />يضربو لبنان يضربو حلوان<br />لو ضربو الكهف بتاعنا كمان<br />علطول هنطير<br />ونروح لبعيد<br />ونعيش وطاويط"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221024927/http://masr.20at.com:80/article.php?sid=1606"

[[comments]]
order = 3
subject = "سيادة العميد أ ح .. ما زلنا ننطقها ألف وحاء بدون هاء في آخرها"
author = "إبن بهيه"
posted = "2007-02-19"
text = "منذ اعتلى مبارك كرسي الرئاسة في 1981م وهو يوصم نفسه كذباً عبر وسائل إعلامه الممولة من قوت أبنائنا أنه رجل الإصلاح والتغيير والتطوير والإنجازات ، بعد أن قضى فترة رئاسته الأولى وتمرغ في قصور الرئاسة المخملية ، بدأ الإعلام المصري مرحلة جديدة فكان يؤرخ لكل شيء في مصر من العام 1981 ، في شتى المجالات كنا نسمع منهم أن إنتاج الكذا قبل عام 1981 أصبح إنتاجه اليوم كذا وكذا وكذا .. بعد إضافة صفر كل عام حتى لم يعد لدى شامشرجية النظام أية أصفار وهمية يضيفونها ويلطخزن بها صفحات جرائد مبارك الصفراء ، كنا نعي حين سمعنا التأريخ الجديد لمصر عبر إعلام مبارك أننا بحق مقبلون على عصر جديد ترزح مصر فيه تحت ويلات الأساليب الجديدة في النصب والدجل الحكومي والديكتاتورية الموديرن المزينة بالفيونكات الديموقراطية وآخر موضات الدعارة السياسية والإعلامية.<br />بيانات توظيف شباب فاقت كل الأمنيات حتى أنك لو أحصيت ما صرح به الطاغية مبارك ورؤساء عصاباته المتعاقبة منذ (لزق) في الكرسي لوجدت أنهم وظفوا كل الشعب المصري والشعوب المجاورة . بيانات نمو اقتصادي لو لملمتها خلفهم من جرائدهم الحكومية لاستغربت كيف أن الاقتصاد المصري قد فاق كل اقتصاديات الدول المتقدمة مجتمعة. خدمات ، مرافق ، تعليم ، صحه كله تمام التمام وفق بيانات العصابات .. حين كان الناس تفيقون على فترات متباعدة مستغربين ، كان يفاجئهم الطاغية بأداء دور مسرحي كوميدي هابط لممثل فاشل على مسرح البرلمان في عيد العمال مستنكراً عبر نكاته السمجة الزيادة السكانية التي تلتهم كل الأصفار الوهمية التي يسوقها إعلامه للناس من تطور وتقدم ، ويضحك الناس على شر البلية ..<br />ربع قرن .. خمسة وعشرون عاماً من النصب والدجل والدعارة السياسية تحت حماية قانون الطواريء الذي يكمم الأفواه<br />اقرأ بقية التعليق .."
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221024927/http://masr.20at.com:80/article.php?sid=1606"
