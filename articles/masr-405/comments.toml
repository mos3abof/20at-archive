text = "المشكله مش فى الدكتور النفسانى المشكله فى انى الاقى دكتور نفسانى انا من الاقاليم يعنى مساله الدكتور النفسانى دى صعبه شويه كمان اهلى هيقولولى دكتور نفسانى ايه ده مثلا انا محتاجهع لدكتور بطنه او حاجه تانيه بس<br />انا مش بعانى اوى من مرض نفسى بس معظم الجيل ده محتاج انه يقضى وقت فراغه فى حاجه كويسه اكتر من احتياجه للكلام لان ده علاجنا وده عن تجربه على فكره متاسفه على التطويل"
