[[comments]]
order = 0
subject = "اه بقي ...."
author = "هووووووووووبه"
posted = "2006-05-29"
text = "بصي يا حاجه في بشر من كتر الاحباط بيجلها حالات نفسويه وحشه تلاقيهم بعيد عنك كدا وعن السامعين اسود في اسود \"البلج \" اسود في اسود معرفش هما بيعبو الاحباط في قزايز قبل ما يتباع ويغلي في الاسواق ايه دا ايه دا , اما الناس السكره التانيه تلاقي \"البلج \" بتعمهم بمبي حتي لو محبطين , و لو حد سالني عايزه تروحي لدكتور حقول لاااااااااااااااااااااه بالفم الملاين لسبب واحد مش ناقصه واحد ياخد الفلوس ويعملي بيفهم ويطلعني في الاخر عندي كولكيعه , بس بردو الواحد بيصعب عليه الناس اللي درست طب دي وفي الاخر يكونو مهزله لاه مش كويسه , وفي الاخر علي<br />راي \"سكارلت \"الدنيا ايه غير ضحكتين واه والاه دي بقي حاول تفكها مع نفسيتك كدا شويه قران , دعاء فك الكرب كدا يعني ومنشفكوش في دكتور نفساني يا حبيبتي ."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132712/http://masr.20at.com:80/article.php?sid=405"

