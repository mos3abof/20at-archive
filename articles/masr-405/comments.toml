[[comments]]
order = 2
subject = "وماله الدكتور النفسانى،،"
author = "هااي يا جماعة،"
posted = "2006-05-30"
text = "انا شايف ان مافيهاش حاجة ان الواحد يزور طبيب نفسانى، و بالذات اذا كان بيعانى من مشاكل نفسية زي الاكتئاب و العصبية المبالغ فيها، و بالذات الشباب، عشان ده هيأثر على حياتهم بعد كده، يعنى الي بيبقى عنده اي مرض نفسى بيشوف الحياة سلبية جدا و بيتبقى قراراتو فى الحياة غلط، و بيتهاون فى حقه، و حاجات كتير.<br />كل انسان محتاج ان هو يحكى و يخرج الي جواه، لان الكلام غذاء الثقة بالنفس، كل انسان له الحق فى انه يحب و يتحب، و ده ما بيكنش موجود عند المرضى النفسيين."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132712/http://masr.20at.com:80/article.php?sid=405"

