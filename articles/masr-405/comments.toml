capture_url = "https://web.archive.org/web/20060615132712/http://masr.20at.com:80/article.php?sid=405"

[[comments]]
order = 4
subject = "سكارليت ممكن تروح للدكتور يا هبهوب"
author = "نيفين..نيفى..نوفا ..اسكارليت"
posted = "2006-05-30"
text = "و الله يا هبهوب بعد ما قرات موضوع الشرقاوى تانى<br />اولا اسودت الدني<br />ثانيا حسيت بالقرف<br />ثالثا كرهت البلد<br />رؤابعا كرهت نفسى<br />خامسا فكرت اروح للدكتور النفسى<br />معادتش الحياه ضحكتين و اه<br />بقت ضحكه و 1000000 اه"
archived = "2006-06-15"
