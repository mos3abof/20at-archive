text = "يا جمكاعة صورة الدكتور النفسى المرفوضة لدينا نحن من رسمناها بجهل وساروى تجربتى تزوجت منذ عام وانا احب زوجى واحتلامة جدا وبعد 9 اشهر انجبت ابنى ولكن الغريب اننى اكتئبت جدا جدا بعد الولادة ولم اشعر بالحب الغريزى تجاة ابنى لدرجة مخيفة وحسيت ان فية حاجة غريبة فية البمهم طبعا مش ممكن ارح لدكتور للنظرة السابقة ولكن بقراءاتى المتعددة اكتشفت ان نسبة لا باس بها من النساء تصاب باكتئاب ما بعد الولادة وتشعر بنفس ما شعرت بة ولو انى وجدت دكتور يساعدنى فى هذه المرحلة لكنت استمتعت بالامومة من أول يوم وشكرا"
