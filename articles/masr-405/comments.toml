[[comments]]
order = 5
subject = "مش شغلك ياعبد الله وشغلك ياموقع ..."
author = "هووووبه.."
posted = "2006-05-30"
text = "مش كل اما اروح حته تقولي كلامك مش مفهوم ، لو مش عجبك تعليقاتي متنحش وتقرها، ولما علقت هنا كنت اقصد ناس بعينها\" واللي علي راسه بطحه بيحسس عليها \" والكلام ليك<br />ي ياجارة\" وتعليقاتي بتكون مبنيه علي تعليقات ليه قبل كدا اوحد معلق وبقتبس و'منهجي اكيلي تشور دو \" يعني \"سبني في حالي\" بالاردو لغه اهل باكستان. - وبعدين يابشر خليكم زي الواد\"محمد السيد\" شوفوا لسه طالع من ابو زعبل \" وخدلي بالك ياعم المجروح\" ومتفائل ، وايه ياموقع انتو كمان انتو مش الشعار بتاعكو<br />\" لا لاحباط...لاللمل..لاللفشل..لاللتسرع\" نسيتو ولاه ايه. ومتقولوش حاجه وتعملو العكس \" واخدنلي بالكو ياكتاب\".<br />-اخيرا الحاجه سكارليت ايه يابت انتي كمان مابتصدقي<br />تلاقي احباط وتفتحي ايه يانيفي, وعلي فكره بقي انا من العالم اللي لما يجلها احباط تضحك لان مفيش حاجه مستهله<br />و\" الوداع يادنيا يااسم علي مسمي' مش كدا ياسكارلت .<br />وللكل بقي ابقو اسمعو عمرو خالد وصناع الحياه مش \"الممات\" قبل وبعد الاكل .<br />.وحفقعكم شعرين لعمك ايليا ابو ماضي لعله يجيب نتيجه, يقول:<br />قلتُ ابتسم يكفي التجهمُ في السما<br />قال السمــــاءُ كئيبةٌ وتجهمـا<br />لن يُرجع الأسف الصبا المتصرما<br />قال الصبا ولَّـــى فقلتُ له ابتسم<br />صارت لنفسـي في الغرام جهنما<br />قال التي كانت سمــائي في الهوى<br />قلبي فكيف أُطيقُ أن أتبسمــا؟<br />خــــانت عهودي بعد ما ملَّكْتُها<br />قضَّيتَ عمـــركَ كلــه متألما<br />قلتُ ابتسم واطـــرب فلو قارنتها<br />يأتي إلــى الدنيا ويذهبُ مرغما<br />قال البشـــاشةُ ليس تُسعد كائنًا<br />شبرٌ فإنك بعــدُ لــن تتبسمـا<br />قلت ابتســم ما دام بينك والـردى<br />متلاطــمٌ ولذا نُحــبُّ الأنجما<br />فاضحك فإن الشهب تضحك والدجى<br />و\"التاني بقي\".<br />كيف تغــدو إذا غد<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132712/http://masr.20at.com:80/article.php?sid=405"

[[comments]]
order = 6
subject = "مجرد تعديل"
author = "قال السمــــاءُ كئيبةٌ وتجهمـا"
posted = "2006-05-30"
text = "قلتُ ابتسم يكفي التجهمُ في السما<br />قال الصبا ولَّـــى فقلتُ له ابتسم<br />لن يُرجع الأسف الصبا المتصرما<br />قال التي كانت سمــائي في الهوى<br />صارت لنفسـي في الغرام جهنما<br />خــــانت عهودي بعد ما ملَّكْتُها<br />قلبي فكيف أُطيقُ أن أتبسمــا؟<br />قلتُ ابتسم واطـــرب فلو قارنتها<br />قضَّيتَ عمـــركَ كلــه متألما<br />قال البشـــاشةُ ليس تُسعد كائنًا<br />يأتي إلــى الدنيا ويذهبُ مرغما<br />قلت ابتســم ما دام بينك والـردى<br />شبرٌ فإنك بعــدُ لــن تتبسمـا<br />فاضحك فإن الشهب تضحك والدجى<br />متلاطــمٌ ولذا نُحــبُّ الأنجما<br />و\"التاني بقي\".<br />أيا هذا الشــاكي وما بك داءٌ<br />كيف تغــدو إذا غدوت عليلا<br />إن شر الجُناة في الأرضِ نفسٌ<br />تتوقــى قبل الرحيل الرحيلا<br />وترى الشوك في الورود وتعمى<br />أن تــرى فوقها الندى إكليلا<br />هو عبءٌ علـــى الحياة ثقيلٌ<br />من يظــن الحياة عبئًا ثقيلا<br />والذي نفســـه بغير جمـالٍ<br />لا يرى في الوجود شيئًا جميلا<br />فتمتع بالصبــح مـا دمتَ فيهِ<br />لا تخـف أن يزول حتى تزولا<br />ومشفكوش في \"بلج\" اسود"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132712/http://masr.20at.com:80/article.php?sid=405"

