author = "عبدة المنوفى"
posted = "2010-02-14"
text = "انا قابلت مصرى اسمة اسامة بيشتغل فى الخليج بيتنكر تنكرا تاما من جنسيتة المصرية<br />وبيعتبرها عار - ايوة فية موضة بين الشباب هى عدم ولائهم ولا احترامهم للجنسية بتاع بلدهم - صحيح سياسة البلد وسلوك افراد الشعب المصرى تحت الفقر والمهانة اصبحت مستهجنة وبيستعار منها الناس - يعنى ممكن تلاقى افندى مصرى بيشحت او بينافق او يتسول او يضرب ذنب فى زملائة او يختلس ومعروف ان الكذب سمة رئيسية من سمات الافراد المصريين<br />ومصر زمان كانت محترمة وبتصدر دكاترة ومهندسين ومصريين - دلوقتى بتصدر بنات بيشتغلوا فى تقديم الشيشة فى فنادق دبى وخدامين وعمال نظافة وكل المهن الواطية"
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216221025/http://www.20at.com:80/masr/news/15309-2010-02-13-16-12-40.html"
