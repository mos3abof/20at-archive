author = "صحيح مصر مش بتاعتنا"
posted = "2010-02-13"
text = "صحيح مصر مش بتاعتنا وانسرقت مننا ولكن بنحبها وهنستردها من عصابة الحرامية<br />تمام زى ابائنا ما حاربوا الاستعمار الانجليزى<br />وحاربوا فساد الملك<br />لازم نحارب اللى ضيعوا البلد وضيعونا<br />لازم ترجع مصر عفية قوية<br />لازم يطلع ولد من ولاد الارض يقول بس ولحد هنا كفاية<br />لازم يرحل الظلمة وولاد الجواسيس وعملاء اسرائيل"
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216221025/http://www.20at.com:80/masr/news/15309-2010-02-13-16-12-40.html"

