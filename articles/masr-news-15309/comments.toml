subject = ""
author = "الى المعلق السابق"
posted = "2010-02-13"
text = "يعنى اية عدل اجتماعى بتاع سيادة امين لجنة السياسات<br />يعنى مستشفى حكومى مفيش فية شاش ولا قطن وبتموت الفقير ووزير المالية يتعالج فى امريكا من رمد فى عينية بمليون جنية<br />هى جملة العدل الاجتماعى اسطمبة كلام بيتختم بها فوق الاوراق<br />محدش بيصدق الهبل دة<br />ثم انة لية فية ازمة انابيب واذلال للناس<br />دة لان تخطيط السياسات بتاع جنابة فاشل<br />او يمكن قصدة العدل الاجتماعى للمواطن فى اسرائيل اللى بياخد غاز من مصر ببلاش"
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216221025/http://www.20at.com:80/masr/news/15309-2010-02-13-16-12-40.html"

