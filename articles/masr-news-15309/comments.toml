author = "سؤال مهم جدا"
posted = "2010-02-13"
text = "نفترض ان مصر دخلت حرب مع احدى الدول - السؤال - هو من سيدافع عن مصر ؟<br />الشباب اللى مش لاقى شغل ولا جواز ولا شقة وعايش على هامش الحياة<br />والا الشباب اولاد سكان مارينا والقاهرة الجديدة واولاد شلة المستفيدين من الحزب الوطنى<br />هل هيحارب معاها اللى ما شفش حاجة من خيرها<br />والا هيحارب معاها اللى بيصيفوا فى الشرم والغردقة والساحل الشمالى<br />فية تفرقة رهيبة<br />مصر بقت مصرين<br />مصر الغلابة<br />ومصر النهابة<br />يبقى ما دام مالناش فيها حاجة يبقى اللى لة حاجة فيها يدافع عنها"
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216221025/http://www.20at.com:80/masr/news/15309-2010-02-13-16-12-40.html"

[[comments]]
order = 3
subject = ""
author = "مصر هي أمي .."
posted = "2010-02-13"
text = "مصر هي أمي ..<br />مصر هي أمي .. نيلها هو دمي<br />شمسها ف سماري .. شكلها ف ملامحي<br />و إن كان لوني قمحي .. ده من فضل مصر<br />ما تلاقيش مثالها .. ست كل عصر<br />عشة جنب نيلها .. تسوى ألف قصر<br />ولا وردة بلدي .. فيها عطر مصر<br />ولا سحر مصر .. ولا جو مصر<br />ولا .. ولا .. ولا<br />ده شئ ملهش حصر<br />.. روحوا زوروا مصر<br />و إنتوا تعذروني .. لما أقول يا مصر<br />مصر .. مصر .. مصر<br />فاتك نص عمرك ياللي ما شفت مصر<br />ده التاريخ ف مصر .. و الهرم ف مصر .. و الكرم ف مصر<br />و الحلوين ف مصر .. و الجدعان ف مصر<br />ادوني عصاية .. أرقص رقص مصر<br />.. روحوا زوروا مصر<br />و انتوا تعذروني .. لما أقول يا مصر<br />الحمد والشكر لله على كل حال ونعوذ بالله من حال اهل النار"
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216221025/http://www.20at.com:80/masr/news/15309-2010-02-13-16-12-40.html"

