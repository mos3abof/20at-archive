author = "أزمة الأنابيب"
posted = "2010-02-13"
text = "للحزب الوطني الديمقراطي بتاريخ 11-02-2010<br />في اجتماع هيئة المكتب.<br />الشريف : الحزب يتابع أزمة الأنابيب وينسق مع الحكومة لحلها<br />جمال مبارك : مبادئ المواطنة والعدل الاجتماعي هي أساس كل سياسات الحزب. …( أخبار الحزب)<br />التاريخ: 11-02-2010<br />صرح السيد صفوت الشريف الأمين العام للحزب الوطني الديمقراطي بأنه تتم متابعة جهود أمانات الحزب في محافظات أسوان وشمال وجنوب سيناء في التعامل مع آثار السيول..<br />تفاصيل الخبر …<br />بحضور قيادات الحزب: انطلاق فعاليات البطولة الافريقية التاسعة عشر لكرة اليد بالسويس …( أخبار الحزب)<br />التاريخ: 11-02-2010<br />انطلقت ظهر اليوم بقاعة نادى النصر بالسويس فعاليات البطولة الافريقية التاسعة عشر لكرة اليد والتى تقام فى مصر فى الفترة من 11فبراير وتختتم بالقاهرة يوم 20 من نفس الشهر ، افتتح حفل افتتاح مجموعة السويس اللواء سيف الدين جلال محافظ السويس والدكتور محمد سعد رئيس المجلس الشعبى المحلى بالمحافظة قيادات السياسية والشعبية والتنفيذية بالمحافظة ."
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216221025/http://www.20at.com:80/masr/news/15309-2010-02-13-16-12-40.html"

