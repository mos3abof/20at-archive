[[comments]]
order = 0
subject = "اية ياجماعه"
author = "طماطم"
posted = "2006-03-27"
text = "اية ياجماعه هية حصلت لكده ولاده كمان فى الموقع<br />هية دى يامدام رغده ولاده فعلا ولا دا مجرد تدريب عليها<br />اصل انا شوفت الكلام دا فى فيلم قبل كده<br />بس مع اختلاف بسيط كان بيبقى فى بدل الدكتور \"داية\"وحله مية سخنه<br />وبيبقى فى مطره تقريباورعد وبرق<br />بس مش عارفه لية<br />هوه يعنى كل الولادات فى الشتا بس ولا اية<br />عموما حمدلله على السلامه"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022425/http://masr.20at.com:80/article.php?sid=80&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "واعيططططططط"
author = "هوبه او هبا به او هبهوب"
posted = "2006-03-27"
text = "انا عايزه جوزي هو اللي يخلف يا بابا \"<br />احبتطيني يا بنتي<br />يا دي النيله مش متخيله منظري بجد بصوت<br />\" يالهووووووي \"<br />والله انا زيك بستغرب ماما ازاي خلفت 7<br />وفي الاخر \" اللي يجي علي الولايه مايتكبش \"<br />وسمعينا\" الصويته\" يا حبيبتي."
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022425/http://masr.20at.com:80/article.php?sid=80&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "مبرووووووووووووووووك"
author = "عبدالله مفتاح"
posted = "2006-03-27"
text = "الف مبروك يا رغده بس ولد ولا بنت لو ولد سميه تامرعلى اسم الباشا لو بنت سميها حياء والف مبروك وربنا يجعله او يجلعها من الصالحين او الصالحات"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022425/http://masr.20at.com:80/article.php?sid=80&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "مسلمه"
author = "يا لهوىىىىىىىىىىىىىى"
posted = "2006-03-28"
text = "انتى هتعقدينا كده ليه على العموم انا متفائله لان ازمه العنوسه ممكن اوى تخلينا منمرش بالتجربه دى<br />المهم حمدالله على سلامتك<br />وانا عارفه ان اى بنت بس بتقول كده وساعه الجد برضوا بتخلف ويمكن كمان 7 \"يا هبه\""
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022425/http://masr.20at.com:80/article.php?sid=80&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "يالهويييييييي ... لولولولولي"
author = "sweet_princess"
posted = "2006-04-03"
text = "انا مابقيتش عارفه اصوت ولا اعيط ...<br />بس حبيت اديكي الاتنين ...<br />مبروك ياستي .. لوكان موضوع الولاده دا حقيقي ..<br />مش مجرد موقف او قصه بتحكيها ...<br />اما انا بقى .. ربنا يستر .. لان انا بجد مابتجملش اي شيئ مؤلم ممكن اتعرض له .. مجرد الصداع بس ماببقاش طايقه نفسي وبتبقى حالتي عجب ..<br />بس انا لو مكانك .. هاخدلي حبايتين منون ..عشان مااحسش بالدنيا ..<br />مع اني اعرف ان الام كل ماكان عذابها اشد في حملها وولادتها .. بيبقى تع7لقها باطفالها اكتر من الام اللي حملها وولادتها اسهل ..<br />لكن برضه هتفضل كلمة الامومه دي شيئ تاني ..<br />كل بنت بتحلم بيه بعد حلمها بفستان الزفاف ..<br />وربنا ينتع كل واحده حامل بالسلامه ..<br />يعني ايه ينتع دي؟!!!!!!!!!!!"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909022425/http://masr.20at.com:80/article.php?sid=80&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
