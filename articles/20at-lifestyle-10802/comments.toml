[[comments]]
order = 7
subject = ""
author = "أمجد ح"
posted = "2009-10-25"
text = "يعني كلكم متحاملين ضد مجموعة من الشباب والبنات اللي بيحاولوا يكونوا مختلفين عن المجتمع وبس بدكم تهاجموا وتشتموا بأي طريقة طيب ليه؟؟<br />مش الاصل انه نعرف السبب ونعرف الطرق اللي خلت الشباب دول يتبعوا تقليعه متل الايمو مثلاً.. طيب في كتير ناس لسه بيعملوا وبيلبسوا زي الثمانينات والديسكو دول برضه لازم نحاربهم ونشتمهم كمان؟؟ وفي ناس بيلبسوا زي تاعون الراب والهيب هوب برضه دول متخلفين ومختلفين ولازم يتحاربوا بالنار؟؟<br />وين عقلنا ووعينا لما نحارب المشكله -اذا كان في مشكلة بالاصل- بمشكلة تانية انه ننبذهم وما نتعامل معهم؟؟<br />ليه بقى ما نقعد معهم ونوجههم ومش ضروري يغير ملابسه او تسريحة شعره بيكفي انك تغيير وعييه وتخليه أوعى ويعرف شو اللي بيعمله مش بالعصبية، بالتفاهم واحتواء المشكلة -ان وجدت-.."
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027021216/http://20at.com:80/20at/7ayatna/10802.html"
