text = "انتم مكبرين الموضوع ليه ياجماعه والفيس بوك معركة علشان الايمو دول هما اكيد شويه شباب مش لقين حاجة يعملوها فاضيين يعني انا من راي يجوا مصر ياعيني يقعدوا معنا علي القهوة وهما يبقوا مش ايمو لا نيمينووووووو علي طول الخط ولو عاوزين يموتوا هيموتوا في حضن مصر وعلي قهوي مصر ولو مستعجلين هيروحوا المقطم هنا عند الدويقه وهما يرحوا ع طووول ولا يكون في ايمو ولا انتيمو ولا هباب علي سنينووووووووو"
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509190900/http://www.20at.com:80/7ayatna/10802.html"

