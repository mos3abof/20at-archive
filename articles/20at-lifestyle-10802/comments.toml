posted = "2008-12-26"
text = "مجتمعاتنا العربية فالأمر لا يزال عند حد الاستغراب والتعجب من انتشار ثقافة الإيمو ما دا طبيعي طبعا من امتي احنا بنحس بحاجة ولا بعرف حاجة استنوا لما ينزلوا شوارعنا ويعملوا زي عبدة الشيطان هتلاقي الدنيا قامت وهتقعد في ثواني ويقعدوا يعملوا استجوابات في المجلس وبتاع وشاي بنعناع وسلملي علي المجتمعات العربية الجهنمية"
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509190900/http://www.20at.com:80/7ayatna/10802.html"

