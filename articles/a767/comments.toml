[[comments]]
order = 0
subject = "رد:تيسير ال كابوني"
text = "لماذا تم تسميم عرفات مع بداية ولاية بوش الثانية؟وتدمير الفلوجة؟ والقبض على علوني؟ المسألة تصفية الحسابات والبداية من الصفر."
archived = "2004-11-23"
capture_url = "https://web.archive.org/web/20041123124940/http://www.20at.com:80/article.php?sid=767"

[[comments]]
order = 1
subject = "الخنزيرة"
text = "قناة صهيونية عميلة وتختلق كل يوم قصص وحكايات وكل هذه الإشيا بترتيب خاص مع الموساد الإسرائيلي والمخابرات الأمريكية"
archived = "2004-11-23"
capture_url = "https://web.archive.org/web/20041123124940/http://www.20at.com:80/article.php?sid=767"

[[comments]]
order = 2
subject = "الرأي والرأي الآخر"
text = "لو كانت قناة قناة صهيونية لما بثت برامج مثل الشريعة والحياة يا أخي!أم أن القرضاوي أيضا عميل صهيوني؟!"
archived = "2004-11-23"
capture_url = "https://web.archive.org/web/20041123124940/http://www.20at.com:80/article.php?sid=767"

[[comments]]
order = 3
subject = "من وائل عباس اكسترا"
text = "انا جاتني معلومات مؤكدة ان الجزيرة دي صناعة صهيونية بتمويل قطري .<br />وانا كنت حاكتب مقال مهم عن موضوع علاقة الجزيرة باسرائيل بس منهم لله المباحث كانت بتطاردني بسبب مقالاتي الخطيرة.<br />وائل عباس"
archived = "2004-11-23"
capture_url = "https://web.archive.org/web/20041123124940/http://www.20at.com:80/article.php?sid=767"

[[comments]]
order = 4
subject = "قلة أدب"
text = "الجزيرة قناة محترمة وبتبث برامج دينية برضة محترمة بس المشكلة الأولى إن الحكومات اين كانت صهيونية قطرية أمريكية ترسل لها بعض الأوامر والنواهى التى ريئما تغلق الجزيرة لو إبتعدت عن الأوامر والنواهى التى يفرضها الصهنويوأمريكى .<br />وحسبنا الله ونعم الوكيل<br />وأقولها صريحة على كل العاملين بالجزيرة وغيرها أن يتقوا الله فى مصداقية الخبر ."
archived = "2004-11-23"
capture_url = "https://web.archive.org/web/20041123124940/http://www.20at.com:80/article.php?sid=767"

[[comments]]
order = 5
subject = "الله اكبر"
text = "اتهام الابرياء من صفات اليهود<br />تيسير علونى حفظه الله وشفاه<br />الخيبة الامريكية تركزت فى عدم القبض على الشيخ اسامة بلادن رغم كل الاجهزة والمعدات الامريكية .<br />كذلك الفشل فى اخماد المقاومة<br />مع العلم ان امثال تيسير علونى فى هذا الزمان قلة"
archived = "2004-11-23"
capture_url = "https://web.archive.org/web/20041123124940/http://www.20at.com:80/article.php?sid=767"
