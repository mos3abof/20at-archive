[[comments]]
order = 4
subject = "الأقصر الحبيبة و أسوان الغالية"
author = "عوني"
posted = "2006-08-02"
text = "موضوعك حلو و فكرني قوي ببلدنا في الصعيد الجواني (الأقصر) و أنا أول ما شفت الصورة قلت دي من أسوانالحبيبة و الغالية علينا علشان أحنا بنعتبر أسوان و الأقصر توأم. أنا رحت أسوان قبل كده و هذا الموضوع فكرني بمصر علشان أنا في أمريكا دلوقتي. ربنا يحميكي يا مصر. و يحمي ناسنا الطيبين."
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911052124/http://masr.20at.com:80/article.php?sid=321&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

