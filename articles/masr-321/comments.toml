[[comments]]
order = 2
subject = "ستقاومين حبيبتى"
author = "shola"
posted = "2006-06-27"
text = "ستقاومين حبيبتى ستقاومين<br />حين تنقلب الضمائر تعرفين<br />اننى احببتك يوما ضمن ايام السنين<br />قد عشقت الورد حينا<br />حيث كان الورد مفتاح الحنين<br />قد شربت الداء مرا حيث قلتى سترحلين<br />لاعادت الدنيا تقاوم حبنا<br />لاعادت الاشواق تنتظر الحنين<br />لاعداعرف اسماء مدينتنا<br />قد ضاع منى كل امال السنين<br />اين ذهبت اسوار مدينتنا<br />قد تخلى الورد عن قلبى الحزين<br />اين فر الفرح منى<br />قد مات يوما هل بربك تذكرين<br />ستقاومين حبيبتى ستقاومين<br />قد طال غيبتنا واليوم سترجعين<br />ذلك من خواطرى"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911052124/http://masr.20at.com:80/article.php?sid=321&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

