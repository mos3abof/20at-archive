subject = "تمييز عنصرى"
author = "بعض النصارى ولا اقول الاقباط- لان كلمة قبطى تعنى مصرى - بعضهم يصرخ ويهلل ويملا الدنيا صياحا ونصارى الخارج يطلبون الغاء الديانة من البطاقة الشخصية وفى نفس الوقت يميزيون انفسهم عنصريا بطباعة الصليب بالوشم على رسغ اليد ليتعارفوا فيما بينهم"
posted = "2006-12-11"
text = "اذا كنتم تطبعون الديانة على جلودكم بالوشم فلماذا تطلبون من الاخرين عدم كتابة ديانتهم على الورق<br />انتم احرار تطبعون الصليب على اى مكان فى اجسادكم انشاللة تطبعوة على ......<br />ولكن لا تطلبوا من الاخرين الغاء هويتهم الدينية<br />انة مطلب عنصرى خبيث"
archived = "2006-12-16"
