[[comments]]
order = 1
subject = "خايف تكون الكتابات دي هي كروت الدعوه لذلك العرس القذر .."
author = "إبن بهيه"
posted = "2006-12-12"
text = "هي إيه حكاية رزق ده مع ولاد البلد ؟؟؟ هو إيه يعني ؟؟؟ شريك في الموقع ولا إيه ؟؟؟ بصراحه ما تزعلوش مني لو مصممين على نشر ذلك لاقيء الذي يتقيأه ذلك المخبر بتاع لاظوغلي كل يوم كده رايحين نسيبكم ونقاطعم زي الكوكاكولا والبيبسي وكنتاكي وهارديز وكل المنتجات الأمريكاني ديه .. أنا بس عايز أفهم إيه عاجبكم في رزق المخبر ده ؟؟؟ طيب بلاش دي يمكن من أحباب ولا صحاب الموقع .... إيه عاجبكم في الموضوع أصلاً ؟؟؟<br />يعني اللي اسمه زخاري المفروض يغيره عشان مخبر لاظوغلي حمدي رزق ينبسط .. وما يبقاش فيه تمييز ؟؟؟ يا ناس خلوا انتم عندكم تمييز وعيب كده .. أنا ملاحظ أن موضوع الفصل العنصري للمسيحيين شغال على ودنه معاكم .. يعني أسبوعيا لازم تنشروا موضوع عن الحصص وتمييز المسيحيين وووو .. طيب ليه ؟؟؟ يعني مش كفايه عليهم زكريا بطرس وبتوع المهجر اللي كرهوا فيهم طوب الأرض ؟؟؟ عايزين كمان الناس تكرههم هنا في الداخل بلا أي داعي ولا سبب ؟؟؟ طيب وبعدها يروحوا فين ؟؟؟ يهجوا من البلد ولا يندفنوا ولا إيه ؟؟؟ نرميهم في البحر ؟؟؟ طبعا أنا متأكد أن موقفكم من المسيحيين ليس من أجل سواد عيون المسيحيين ولا المسلمين لأن الإسلام بريء من هذا كما المسيحيون بريئون من مواضيعكم تلك التي تضربهم في مقتل ولا أدري لمصلحة من ؟؟؟<br />لأ ومين ؟؟؟ رزق .. مخبر لاظوغلي الشهير .. والنبي ده مش هبل وعته أمن دوله ؟؟؟ ما هو أمن الدوله الجبان عميل الأمريكان بيلعب بالحكايه دي من زمان خالص .. عارفين ليه ؟؟؟ لأنها ملمومه وفي إيده .. يعني الجو العام زفت والناس طهقانه من الحكومة العميله الفاسده يروح أمن الدوله مولع في كنيسه ولا أي حدوته قذره زي دي .. وولعها ولعها .. شعللها شعللها .. ولم لم لم كام واحد وفي الأخير يطلع مختل عقليا وخلصنا .. حدوته بيكرروه<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190936/http://masr.20at.com:80/article.php?sid=1284"
