subject = "جازاك اللة كل خير"
author = "HUSAM ALI"
posted = "2006-03-29"
text = "جازاك اللة كل خير.لكن المشكلة ليست فقط في الجواز صدقني انا متزوج و لكني امارس العادة السرية شبة يوميا لان زوجتي لا تحب المعاشرة الجنسية بعض السيدات لا يحبو المعاشرة الجنسية لذلك لا احب ان اغصب عليها لانها طيبة جدا و الموضوع موش عافية اقولي باة اعمل اية؟ اجوز تاني صعب؟الحمد للة اما مداوم علي الصلاة و الصوم و اداء جميع العبادات مشكلتي الوحيدة في الموضوع دة و علي فكرة كل اللي سيادتك كاتبة عن جميع الاعراض و كرق العلاج صحيح جدا لكنة لا يلغي الموضوع تماماممكن يقللة فقطز"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123143/http://www.20at.com/article2.php?sid=625"

