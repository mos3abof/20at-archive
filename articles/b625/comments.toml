text = "السلام عليكم ....<br />اشكركم على طرح موضوع ساخن بيت الشباب..<br />اما انا فلي قصتي ايضا مع هذه العادة...<br />فانااليوم شاب ملتزم من مجتمع محافظ ولله الحمد...<br />كأي مراهق لابد وان يمر في هذا الطريق<br />ولكن ؟؟<br />ينجو من نجا ويهلك من هلك ..<br />كانت بداياتي في سن16 ..<br />وكانت المدرسة فيها جميع الطبقات المتميزه والفاشلة...<br />ومن هناك استقيت فكرة العادة السرية..<br />لا لأنني فاشل:بل انني من الاوائل المتميزين وللمعلومة في تلك المرحلة اخترعت جهازا لقياس الهزات الارضية..<br />(ولكن التجربه خير برهان) هذاما اهدانياه الشيطان من حكمة ..<br />في يوم على شاطيء البحر وان اسبح بجوار<br />الشاليه(منازل على البحر)استرقت عيناي<br />على الطبيعة منظر لمؤخرة فتاة تلطخت ملابسها بالماء..<br />وهناك في الحمام ارتكبت الجرم...<br />واريد ان اطرح بعض اسباب ارتكاب جرمي:<br />- لم اجد في تلك المرحلة من يوجه غريزتي الجنسية.<br />- والداي ليسا متعلمان ولا يعلمان شيئا عن هذه العادة.<br />- ليس حولي اخوة ملتزمون فانا الوحيدالملتزم والذي يدافع عن الالتزام في البيت.<br />- القنوات الفاسدة في منزلنا.<br />- المشاكل العائلية المتواصلة<br />- فانا لا اعيش في جو اسري سليم ومتكامل.<br />- حولي بعض الاصدقاء الفاسدين.<br />فلقد وجدت نفسي وحيدا اسبح امام هذا التيار الجارف..<br />فلم استمر في حلقة القران.. وكما قيل(الصاحب ساحب) فلقدفصلت من الحلقة والتففت حول الفاسدين وبدأت حياة اخرى<br />مغازلات وفتيات واتصالات واغاني ومراااهقات شباب..<br />فتدنى مستواي الدراسي من متفوق الى ممتاز.. تتعجبوا اليس كذلك ؟<br />لاني اريد ان ابين اثرالعاده السريه على<br />ذاكرتي وتفكيري ..<br />فوالله انها اثرت علي واتا لا اتنتبه لذلك.<br />انتهت الثانوية بنسبة 91بالمئة القسم العلمي ..<br />وهنا ساعة ندم<br />عندما اردت التقدمالى معشوقتي( الطيران الحربي)<br />فلقدضعف بصري والله<br />وخارت قواي<br />وظهور بعض اثارالحبوب على جسمي<br />وهناك لم يقبلوني ...<br />هتاك ندمت على كل ساعة امضـيتها في العادة .<br />ثم التحقت بكلية العلوم في الجامعة..<br />وذلك فضل من الله فلقد وجدت شبابا صالحين والتفوا حولي حتى عدت الى الهدى والنور..<br />فانا اليوم ملتزم ولله الحمد..وللمعلومة مع كل هذه المعاصي السابقة فلم تمس يداي جسد فتاة ولله الحمد..<br />ولن اتراجع عن امنيتي (ف16)الطيران.<br />ولـكـن :<br />لازلت امارس هذه العادة حتى اليوم..<br />واسأل الله ات يجيرني واياكم شر هذه العادة وان يبدلني واياكم ازواجا صالحين مصلحين ...<br />وعندها لاتنسوتي من صالح دعائكم<br />اخوكم :<br />الطيار حربي : خااالد."
