subject = "ya ragel ya tayeb"
author = "Aregon"
posted = "2006-03-28"
text = "awalan ana 3ayez ashkor sa7eb el mawdoo3 3ala el taree2ah el mo7tarama el tanawal beeha el mawdoo3 ashkorak ya a7'y wa gazak allah kol 7'ayr ensha2llah...wana 3ayez bas as2al kol wa7ed beye3mel el 3adah el saye2ah deh ba2a ya ragel ya tayeb enta bellah 3alik 2olly keda enta law shara3t fel 3ada el saye2ah deh we da5al 3alik waldak aw waldetak aw 7atta tefl so3'ayar hatkamel?la wallahi..el shahwa hatetkeser 3alatool law 7atta bas 7aseet en fe 7ad hayshofak tab bellah 3alik ba2a enta faker en rabinah mesh shayfak?rabinah sob7anahu wa ta3ala aal fe el 7adees el kodsy \"man ya3seni wa howa ya3taked anni la araah fakad kafar wa man ya3seni wa howa ya3taked anni araah fakad ja3alani AHWAN al nazreen elayeh\"<br />ya a7'y el kareem elly beyomares el 3ada el saye2a deh enta mesh kafeek en rabinah bey2olak en enta ga3alto ahwan el nazreen elayeh?wallahi ana awel marra seme3t el 7adees dah 3ayat ya gama3a enta mesh kafeek el kelma deh ya ragel ya tayeb?we a7'y yally mesh 3agbak el 7al bta3 el dakatra bta3 el akl we 7al el shyookh el howa el 3'ad men el nazar ana a2olak ba2a enta mabtasta7eesh men rabinah?ya ragel 7araam 3alik rabinah ye2olak enta ga3elni ahwan el nazreen elaik wenta aafel wedanak we albak eswad men kotr ma enta 3'ar2aan fel shahawaat 7araam 3aliko ya shabaab wa shabbaat el moslimeen wallahi 7araam 3aliko raboko el kareem el 3'afoor dah tag3alooh ahwan el nazreen leeko endaf yabni enta we howa we ebta3ed 3an el 3ada el saye2a el 3ada el momeeta deh..tab enta te3raf en heya wallahi bete3mel dmoor fel 3adala bta3et el 3dow el zakari bta3ak?dah 3'air sor3et el kasf ya3ni mesh hatlaa2i ay mot3a wenta betomares el 3elaka ma3a zogtak fe 7alaalak mesh hat7es be ay mot3a ana banaadi 3ala kol shab we shabba moslimeen wa a2olo ba2a enta aw enti tetkesfi men el tefl el so3'ayar en enta tashra3 feeha odamoh we matasta7eesh men rabak el 7'ala2ak?we wahbak el ne3ma deh ba2a howa dah ya moslimeen el taree2ah el neshkor beeha rabinah 3ala el ne3ma?la2 wallahi abadan..ba2a bezemetak law 7atta betsalli we bete3melha enta mesh maksoof wenta wa2ef oddaam rabinah la wallahi maksoof ana 3aref...ba2a bezemetak enta faker en el eed deh el 3aset rabinah hatsalem we to7don sayeduna mo7ama (salla allahu 3alih wa sallam) yom el eyama?la wallahi mahate7sal...<br />tayeb kefaya men el kalam dah ba2a wa a2olak en enta ya sa7eb hazehe el 3ada el saye2a law mesh shayef en taree2a el islameya fe el ebt3aad 3an hazeh el 3ada mesh kefaya \"el howa el seyaam wal 3'ad men el basar\" we kaman mesh shayef en el taree2ah el tebeya mesh kefaya \"el heya etebaa3 gadwal akl mo3ayan\" mesh kefaya bardo a2olak esta7i men rabak wa asta3'feroh la 3alaho ya3'fer lak wa yar7amak we howa dah el akeed haye7sal law tobt tooba nasoo7a we argo ya shababna en e7na nasta7i men rabinah...el mo2mn howa alazi ya3bod allah wa ka2enaho yaraah...7awel 3ala ad mate2dar tewsal lel daraga deh men el maan heya 3alya wa sa3ba laken betawfee2 rabak wallahi mafeesh 7aga sa3ba...wa shukran le sa7eb el mawdoo3 marra tanya..allahoma la to3amelna bema na7no ahlon behe wa 3amelna bema anta ahlun beh allahuma er7amna fa3'fer lana 7'atayana faman za lazy ya3'foro el zonoob ella ant..allahoma ameen ameen ammeen"
