text = "لمن البنات؟؟؟ مكنتش مصدقه ؟؟؟؟ طب ليه<br />المهم انى عايزه اضيف ان هناك جماعه من العلماء اثبتوا حرمه هذه العاده واستدلوا بحديث الرسول  المعروف\"يا معشر الشباب من استطاع منكم الباءه فليتزوج...\"<br />وقالوا انها لو كانت حلال لكانت اولى من الصيام لسد الرغبه<br />اللهم اهدى شباب المسلمين واهدنا معهم يا رب العالمين"
