text = "بلاش تطلعوهم احسن ولا الرقابه ديما بتبقى على كل ما هو محترم يارب القيامة تقوم وصدقونى مفيش حد داخل الجنة الا العبط والهبل والى بيشحتو فى الشوارع وانا بقى مش هبطل فرجه على التليفزيون وغيرو<br />حراااااااااااااااااام باالى 5سنين خاطب ومش عارف اتجوز شكلها هاترسي للعرفى وخلى الشعب والحكومة تشيل الذنب معيا ولا هما كمان ها يعترضو ويستنكرو على ده كمان ***** يا قوى ولا غيرك قوى يارب"
