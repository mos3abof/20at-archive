[[comments]]
order = 13
subject = "انا من امثل هذا الموضوع"
author = "كاتـــ العبرات ـــــم"
posted = "2006-04-18"
text = "اولا السلام علسكم ورحمة الله ةبركاته<br />اشكركم جزيل الشكر على اعداد مثل تلك المواضيع التي تحاكي اسرار الشباب وتوجد ذاتهم وتهمس بلسان الحاني لاخية في اذنة.............. الصراحة انا داخل على قوقل وابحث عن حل لهذي المشكلة وقد وقع برابط الموقع لاتضفح مكتوبكم وثم قرات الموضوع والردود وشعرت كانكم تحاكوني ويتوجة الحديث لي انا ....؟<br />انا الصراحة انسان شهوتي ملكت مبادئي بيني وبين ذاتي ولا استطيع الزواج والحمد لله اني في مجتمع محافظ ومن عائلة لها سمعتها ولها تربيتها الشريفة بابنائها والا لكنت احد الشباب الذي يبحث ويتعب نفسة ومالة عن ايجاد تلك الفتيات الواتي يقمن برد غريزتي الجنسية واستمتع بملاذ شهوتي بالحرام ... ولكن لجئت ماهو يستر عيب من بداية بلوغي من سن السادسة عشر تقريبا الى ان وصلت الى عمر الثالث والعشرون ثمنية اعوام وانا استخدم تلك العادة السرية التي ل يمر يوم الا وانا استخدمها واحيانا استخدمها من مرتان الا خمس مرات باليوم او اكثر من ذلك المعدل احيانا لي رغبة بالجنس كرغبة العاطش الى الماء العذب واعلم اني لست في سرية انما معي من هو يراقبني وهو الله سبحنة اني اكتب لكم وانا اتائلم وفؤادي يحي من الحياء ويحكي من الاحترام لكم ولكن احسست اني اريد ان احكي لكم همي .... انا شاب من افضل الشباب ادبا وتربية واخلاقا ويشهد لي القريب قبل البعيد بالخير وكل ما اسمع اطراء لي من احد الاشخاص احس اني لست اهلا له لاني انسان استخدم ماهو يخدش الحياء وينقص رجولته ..........<br />اكرمني الله قبل اعوام بالهداية والالتزام وكنت ذاك الرجل المسلم الذي يرافق روحانية الاسلام في المسجد وبين جدولي اليومي وبين اقلمي وحديثي وبين نومي وفراشي فقد التزمت بتلك العادة وجعلت الايمان على سطح كومدينة الغرفة ولم انظر الى الله تعبت تعبت تعبت انني من يوم ان ستخدمتها وادمنت عليها واقول ادمان لانها تريح جسمي وتزيل بعض الهم عني لا استطيع النوم الا وانا .... قد عملت ماهو بيني وبين الله من ذنب قد جعلني اكتم همومي وعبراتي ولا ياتيني النوم ليلة ولا قد احصل على ملذ النوم الا عند عمل تلك العادة السرية ..... الحقيقة انا لست انسان يرثي نفسة بتلك الكلمات التي تفضح قلة الحياء لدية ولكن كتبها وانا اتئلم من ادماني.<br />نعم انا افعل تلك العادة كل يوم وتكرارا ولا اتطهر منها ابدا وان ذهبت للطهارة فعلتها بالحمام ..... انا اصلي امام الناس وانا نجس .... ااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااه<br />كل ماكتب من طرق للحل من تلك المشكلة لن تنفعني لان مابيني وبين الله مخذول الامل حتى وان تزوجت لن ترضى زوجتي ان اجامعها كل يوم خمس مرات ......كاتم العبرات؟؟؟؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123143/http://www.20at.com/article2.php?sid=625"

