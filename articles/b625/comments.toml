text = "عاوزة اقولكم ان فعلا البنات كتير اوى اوى بيعملو العادة دى بس مبيقولوش علنى<br />اعرف بنات بالهبل بيعملوها شبة يوميا ودى حاجة عادية لاننا البنات عاوزين نفرغ اللى جوانا ولا حلال للولاد وحرام للبنات<br />احنا اكتر حاجة ممارسة للعادة دى<br />لاننا بس نشوف ولد مثلا حلو فى القطر مثلا ونفضل نبص علية ونحلم بية وطبعا اول مانروح نعملها<br />ملحوظة\\\\\\ انا بحب اوى فادى استار اكاديمى"
