[[comments]]
order = 3
subject = "أختلف معاك...كتيييير !!"
author = "محمد"
posted = "2006-12-25"
text = "بصراحة رؤيا قاصرة وغير موثقة..هي رؤيته للأمر..وللأخوة إلي بيهللو ليها أقولهم ...الطلبة ليهم أكتر من 15 سنة لا يمارسو السياسة ولا غيرها في الجامعة ومفيش أي أنشطة حقيقية..وبالتالي إتهام العمل السياسي بأنه له تأثير سلبي على على العملية التعليمية ده إتهام باطل ومغلوط وواقع الحال لا يؤيده..<br />السبب الحقيقي لتدهور التعليم عموماً ولا سيما الجامعي منه هو سياسات خاطئة للقائمين على التعليم في مصر وحالة الفساد العامة إلي البلد غرقانه فيها والي وصل لكل شبر في مصر ..<br />معلش رأي المسلماني خطير وغير موفق..الانشطة في عمومها سواء كانت سياسية أو اجتماعية بتثقل الطلاب وبتلمعهم وبتوسع مداركهم بدلاً من الاساتذة الحاليين ..وازعم إن العشر سنيين القادمين هيكونو اسوء من إلي قبلهم لأن بالفعل عملية التعين في الجامعة حالياً خاضعة للواسطة والمحسوبية على حساب الكفاءة وكذلك مراكز البحوث القومية...هي دي الاسباب الحقيقية للسؤ الوضع التعليمي في مصر ...رؤيا غير ناضجة وغير منصفة ومقلقة بالمرة...عايزين تفرغو البلد من كوادرها ..وزهرة الامل الوحيدة إلي فاضلة ..لا هيطلو تعليم كويس ولا هينفعو يقدمو حاجة للبلد<br />إيه يا طحاوي ..إنت مش لاقي حاجة تكتبها ولا إيه!!<br />ومين أحمد المسلماني ده من الاساس..إسأله كده ..إتعين في الاهرام إزاي..والنبي تسأله !!!"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224643/http://masr.20at.com:80/article.php?sid=1352"

[[comments]]
order = 4
subject = "ياريت نركز على الفكرة"
author = "واحد معدي"
posted = "2006-12-25"
text = "الاخوة المتحاورون حتى ياريت نركز على الفكرة ما قاله الحوار مجرد راي ومن جاء باحسن منه قبلناه كما يقول الامام ابوحنيفة اوصواب يحتمل الخطا ياريت الشباب من ذوي النشاط الطلابي يدلون برايهم بكل موضوعية بدون تجريح وتذكروا نحن في الايام الحرام الدم والعرض والسمعة"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224643/http://masr.20at.com:80/article.php?sid=1352"

[[comments]]
order = 5
subject = "حوار بناء"
author = "دعاء"
posted = "2006-12-25"
text = "حوار مفيد معبر بالفعل عن تلك الازمة التي يعهيشها هذا الجيل ايضا وليس جيل السبعينات فقط يا استاذ عبدالله لاننا تعلمنا على ايديهم وتعرفنا على الحياة السياسة من تلك المناظير الضيقة التي سمحوا لنا بها<br />وعنده حق الرجل في سخطه على هذا الجيل"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224643/http://masr.20at.com:80/article.php?sid=1352"

[[comments]]
order = 6
subject = "العمل السياسى ضرورة جامعية"
author = "هانى صلاح الدين"
posted = "2006-12-25"
text = "بداية لابد ان ازيل سوء التفاهم بينى وبين زميلى العزيز عبد الله الطحاوى حيث كان لى تعليق من قبل على مقال الاخ براء الذى تفنن فى النيل من الاخوان المهم انى اكن للزميل الطحاوى كل الحب واعتز بقلمه الذى يشهد له الجميع بابداعه وليس هذا من باب المجاملة بل من باب انزال المواهب منازلها وبالرغم من ذلك اختلف مع الزميل الطحاوى الذى شاركنى وانا وصحفى افاق عربية مانعيشة من ظلم وقهر سياسى فى مضمون هذا المقال الذى يدعى الشباب للسلبية والأنعزال السياسى واعد حاليا مقال تحت عنوان (العمل السياسى جامعية ) ودون الدخول فى التفاصيل لكن اريدان اذكر زميلنا احمد المسلمانى ان الجامعات كانت على مر تاريخها منذ انشائها فى مصر وهى منارة ونبض الشارع المصرى بل نبض حى لهذه الامه بالله عليك يامسلمانى كيف يكون حال مصر اذا اعتزل طلاب الجامعات المصرية السياسة بل كيف يكون مستقبل مصر سياسيا بعد تجفيف منابع السياسة بالجامعة ياسادة الجامعات المصري والحركة الطلابية لعبت الدور البارز فى ايقاظ الشارع المصرى وحدت من طغيان اصحاب السلطان ياساده لولا حركة الطلاب السياسية ماكنا سمعنا عن ثورة 19 ومقاومة الاحتلال اسئلوا كبرى الجامعة الذى شهد حركة طلابية كتبت بحروف من نور وبدماءها تاريخ مصر ياسادة لاتتبنوا دعوات تخرج لنا اجيال سلبية خائفة مرتعشة خانعة بل اجيال تطلب ود الأنظمة وتقبل ان تعمل جواسيس للامن ياسادة ارفعوا ايديكم عن شباب الجامعات وتذكروا ان معظم السياسين الذين لمع نجمهم على الساحة السياسية الان ماهم الا ثمرة من ثمار العمل السياسى داخل الجامعة ولايجد اى تعارض بين طالب ناجح متفوق وانه يمارس النشاط السياسى فى الجامعة وراجعوا تاريخ مصطفى كامل وكثير من سياسى مصر<br />استاذى المسلمانى اطالب بان تراجع موقفك من نشاط الطلاب السيا<br />اقرأ بقية التعليق .."
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224643/http://masr.20at.com:80/article.php?sid=1352"
