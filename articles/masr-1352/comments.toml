subject = "عندك يا حق"
author = "Amazonien"
posted = "2006-12-25"
text = "أعتقد أن المسليماني أصاب قدر كبير من الحقيقة، الجامعة فعلا أصبحت مفرغة من معناها مفيش تعليم مفبش علم، ياإما ناس رايحة تتفسح أو ناس رايحة تتظاهر، لكن مفيش علم بالمعنى اللى واحد كان نفسه فيه"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224643/http://masr.20at.com:80/article.php?sid=1352"

[[comments]]
order = 1
subject = "فاشل"
author = "مريومة"
posted = "2006-12-25"
text = "فاشل...... مين اللي بيتكلم عن الفشل والجيل الفاشل؟<br />احمد مسلماني انا مش مصدقة نفسي<br />بقي عصام العريان وعبد المنعم ابوالفتوح واحمد عبدالله رزة وحمدين صباحي وابوالعلا ماضي فشلة<br />والله ده اللي ناقص بعد العمر ده كله من الناس دي واللي بحس انهم فعلا بيعملوا باخلاص بالرغم من القرف والزبالة اللي احنا عايشين فيها يخرج واحد يقول فين العلم والتعلم<br />دي نكتة والله<br />احمد مسلماني اتكلم عن نفسم والتيار اليساري اللي انت شايف انه فاشل وسيبك بقي من الكلام عن الاخرين<br />ابدأ بنفسك فانها عن غيرها"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224643/http://masr.20at.com:80/article.php?sid=1352"

