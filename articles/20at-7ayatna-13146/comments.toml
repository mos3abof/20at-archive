text = "فعلاً دى مشكلة بتقابلني لغاية دلوقتي<br />انا مش عارف ابطل جيمز خالص<br />ممكن أقلل المدة الى بقعدها عليها فترة وارجع لها تاني<br />بمجرد زوال السبب بمعني أصح .<br />إسرائيل عايزة تدمرنا .. الله يخرب بيوتهم"
archived = "2009-09-05"
