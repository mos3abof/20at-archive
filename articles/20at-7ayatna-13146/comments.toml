author = "عمري ما حبطل جيمز"
posted = "2009-09-01"
text = "بلاش كلام الناس التعبانة في دماغها<br />مدمن جيمز - مدمن تشات - مدمن فيسبوك - مدمن يوتيوب<br />انا مدمن كل ده و بشتغل و ناجح و الحمد لله و بخرج من بيتنا مش انطوائي و مثقف بس مش بحب القراءة ممكن اقرأ الجرايد و اقرا pdf علي الكمبيوتر<br />و آول ما جيم بتنزل جديدة لازم انزلها و العبها ابطل جيمز ليه ؟؟"
archived = "2009-09-05"
capture_url = "https://web.archive.org/web/20090905073451/http://20at.com:80/20at/7ayatna/13146------games-.html"

