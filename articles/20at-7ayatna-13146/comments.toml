posted = "2009-09-29"
text = "ياعم هوة كل حاجة غلط بنعملها نقول اسرائيل عايزة تدمر الشباب<br />وبعدين ماهو الجيمز احسن بكتير من الشطرنج<br />في تفكير علي مختلف المستويات وبيزود سرعة البديهة وبيعلمك اللغة الانجليزية ويعرفك معلومات تاريخية وبيعلمك ادارة الوقت لو بتلعب لعبة استراتيجية او لبعة من العاب ادارة الوقت<br />بيعلمك ازاي تاخد قرارك بسرعة<br />وبصراحة الجيمز اكتر حاجة فادتني في حياتي وخلتني شخص ناجح في شغلي وفي حياتي الشخصية"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122529/http://www.20at.com:80/20at/7ayatna/13146--games-.html"
