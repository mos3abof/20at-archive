posted = "2009-09-29"
text = "في الوقت الذي ستحدده لنفسك للعب الـGames ، يجب أن تضع شاشة الكمبيوتر في مسافة ما بين 60-80 سم.وإذا كانت أحرف الكتابة تبدو صغيرة من ذلك البعد فتستطيع تغيير حجم الحرف كما تشاء<br />احرف …علي اساس اني بلعب لبعة كلمات متقاطعة<br />وياتري شرب اللبن قبل النوم هايفيد علي التخلص من العادة دي<br />ومتنساش نم مبكر تستيقظ مبكر<br />واضح ان اللي كتب المقالة دي عمره ماسترجل ولعب جيمز"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122529/http://www.20at.com:80/20at/7ayatna/13146--games-.html"

