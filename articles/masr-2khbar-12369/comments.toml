subject = ""
author = "شطار فى الرسم"
posted = "2009-06-15"
text = "احنا بتوع الرسم فقط<br />لما يبقى عندنا 15 جامعة<br />و3 ملايين طالب جامعى<br />ورجال اعمال فى الشيبسى والاستيراد فى القمح المدود والفاسد واحتكار حديد التسليح<br />ولا نصنع او لا نقدر على صنع هذة الكمامة ونستوردها من بلاد برة<br />يبقى لزمة الناس دى اية<br />تبقى منظومة تعليم منهارة وسياسة اقتصادية فاشلة<br />اصنعوا الكمامة قبل ما ترسموا عليها<br />يا و[ *** ]تك يا بلد<br />مش قادرين تصنعوا كمامة<br />كمامة<br />كمامة يا بلد وسعرها ارتفع من 8 جنية ل 40 جنية علشان سياسة الاحتكار<br />غطينى يا صفية وصوتى"
archived = "2009-06-19"
capture_url = "https://web.archive.org/web/20090619075609/http://www.20at.com:80/masr/2khbar/12369-2009-06-15-07-38-23.html"

