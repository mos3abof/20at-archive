author = "ااحما من الجهل"
posted = "2009-06-15"
text = "طيب يا ست اميرة ما هى الالوان هتسد المسام بتاع الكمامة ومسار الهواء هيقل وهتؤذى مستخدم الكمامة<br />يعنى لازم الفذلكة<br />ربنا يرحما من شغل الجهلة"
