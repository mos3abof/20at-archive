author = "انفلونزا وهتعدى"
posted = "2009-06-15"
text = "فى الشتاء الماضى اصبت بانفلونزا حادة جدا ومناخيرى كان عامل زى الحنفية وكحة وصداع وحرارة ومفاصلى سايبة من بعضها<br />وبما انى رجل شوية متعلم رحت للدكتور وكان للاسف دكتور نطاسى واستاذ فى احد كليات الاقاليم الطبية وبيلبس بنطلونة بحملات زى رئيس تحرير الدستور ابراهيم عيسى والدكتور الحقيقة ما قصر - كتب لى مضادات حيوية ومهبط للحرارة وفيتامينات مقوية ودواء لتوسيع الشعب الهوائية وكانت الادوية دى بحسبة 350 جنية بالتمام والكمال<br />ومر اسبوع والانفلونزا ماسكة فى عظامى وبتهد فى حيلى ومفيش فايدة فى الادوية<br />رحت البلد ازور الحاجة<br />الحاجة كان عندها بصل اخضر<br />وضربت اكلة بصل اخضر مع ليمون ونصف كيلو سردين<br />وتكرعت<br />ونمت فى تلك الليلة نوما عميقا وتوقف السيلان من انفى<br />وانتهت الانفلونزا تماما<br />عليكم بالبصل الاخضر والليمون والسردين<br />وهتبقى انفلونزا خيخة قوى وهتعدى وسبيكوا من علاجات الدكاترة والمضادات وكل المواضيع دى<br />ابداو بالبصل الاخضر والكرات<br />وهيبقى الموضوع سهل خالص<br />وبعدين اشتروا علبة اقراص نعناع تضيع ريحة البصل من بقكم وتضيع كل الروائح غير المستحبة"
archived = "2009-06-19"
capture_url = "https://web.archive.org/web/20090619075609/http://www.20at.com:80/masr/2khbar/12369-2009-06-15-07-38-23.html"
