author = "الطريق إلى القدس"
posted = "2009-07-07"
text = "الى المتفلسفين مع التحية<br />فيه حاجه اسمها علامات يوم القيامه<br />طبعا ربنا في القران الكريم وعلى لسان رسله اجمعين اخبرنا ان الحياة التي نعيشها دي مؤقته وفيه حاجه اسمها اليوم الاخر او يوم القيامه<br />ويوم القيامه له علامات اخبرنا عنها النبي محمد صلى الله عليه وسلم والقران ايضا<br />من ضمنها حتى اذا جاء وعد الاخرة جئنا بكم لفيفا اللي هما اليهود<br />يعني من علامات يوم القيامه ان يجتمع اليهود في هذا المكان<br />لماذا<br />ليسوؤوا وجوهكم وليدخلوا المسجد كما دخلوه اول مرة<br />فلما نيجي نتكلم عن القدس لازم تعرف الناس بحقيقة علامات يوم القيامه<br />لان فيه علامة ليوم القيامه ادهى وامر من ضياع القدس الا وهي هدم الكعبة<br />فقد قال النبي محمد صلى الله عليه وسلم ان<br />ذو السويقتين سيهدم الكعبة<br />فارجو الى الاخوة المتفلسفين ادراح علامات يوم القيامه ضمن فلسفتهم<br />وشكرا<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــ<br />مش شريف الدواخلي ولا البراء اشرف<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ<br />وسلمولي على طحطح"
