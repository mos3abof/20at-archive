author = "الطريق إلى القدس 2"
posted = "2009-07-07"
text = "الطريق الى القدس مش بالجعجعه وقلة الادب<br />طريق ايه وقدس ايه اذا كنا مش عارفين نقف موقف موحد اصلا<br />سواء كنا عرب او فلسطينيين او مسلمين<br />ـ فرق دينية<br />ـ احزاب سياسية<br />وكل حزب بما لديهم فرحون<br />وكل فرقة وكل حزب متمسك برايه ومعجب برأيه<br />يا عم احنا مش نافعين في حاجه خالص<br />اسرائيل بتنطلق من (الصغرى) الى (الكبرى)<br />الحل الوحيد هو اننا نفهم يعني ايه (عقيدة اهل السنه والجماعة)<br />ودا موضوع يطول شرحه<br />الالتزام بتعليمات اهل السنة والجماعة هو الحل<br />ـ لا للخوارج (الاخوان المسلمون)<br />ـ لا للشيعة (حزب الله)<br />اهل السنة والجماعة هو الحل<br />عقيدة اهل السنه والجماعة هي التي انطلقت بالاسلام الى الشرق والغرب<br />الشيعة والخوارج هما اللي دايما يعرقلوا مسيرة الاسلام<br />اقرأوا التاريخ<br />حتلاقوا كل نكبات الامة بسبب الشيعة والخوارج<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــ<br />نش رضوى حسن ولا مروى صلاح"
archived = "2009-07-11"
capture_url = "https://web.archive.org/web/20090711134423/http://www.20at.com:80/masr/review/12578-2009-07-06-13-57-30.html"

