[[comments]]
order = 2
subject = "اتقي الله قبل التجريح في خلقه"
text = "إلى الأخ اللي فاكر نفسه أبو العريف و قاضي القضاة اللي حكمه ما يتردج دقق في معلوماتك قبل ما تحكم على أساسها علشان دي أمانة و ها تتسأل عليها عند ربنا الفيشاوي مخرج الفيديو كليب مش هو أحمد فاروق الفيشاوي"
archived = "2004-08-20"
capture_url = "https://web.archive.org/web/20040820181340/http://www.20at.com:80/article.php?sid=183"
