[[comments]]
order = 0
subject = "دائرية النص"
text = "السلام عليكم ..شكرا يا استاذ احمد على هذا الموضوع الجميل..انا اهوى الكتابة ..معظم ما اكتبه خواطر نثرية..لكن من حسن حظي ان اول قصة قصيرة نشرت لي فى اسلام اون لاين فى نادي المبدعين ..وحضرتك علقت عليها..كانت بعنوان عاشق بلا معشوق..بس انا مش عارفة ليه كل قصصي نهايتها دائرية..حتى لو حاولت الهروب اجد الافكار تتابع حتى اجدني انتهي من حيث البداية..واسمي قصصي دائما بنهايتها؟هل هناك سبب ؟ام انها عقدة!"
archived = "2004-08-20"
capture_url = "https://web.archive.org/web/20040820181340/http://www.20at.com:80/article.php?sid=183"

