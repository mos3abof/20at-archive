text = "الاخت الا شكلها جاى من جنوب السودان دى بتتكلم عن الرجالة زى مايكون اعداء الامة ايه يابنتى اهدى شوية كدا انتم من غير الرجل ماتعرفوش تعيشم ثم انك شكلك كدة واخدة مقلب طالع من نفوخك وايه الا عرفك اننا بقينا فنجرية حنك شكلك مجربة كتير علشان كدة حكمتى بس لو الا جربتى معاهم ماعرفوش فى ملايين غيرهم بيعرفوا ههههههههههه"
