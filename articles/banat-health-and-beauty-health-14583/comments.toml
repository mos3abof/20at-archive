author = "urfriend"
posted = "2009-12-30"
text = "اقتباس Saksoka Shaldam:<br />عزيزتى نسرين - انت تنفخين فى قربة مقطوعة - فالرجل الشرقى اصبح فنجرى حنك - مابيغرفشى - واصابه الهزال من اللواط والعادة السرية - واصبح يفكر فى التحرش والخطف والاغتصاب بالتهديد ليثبت انه رجل - ويتحجج بالفقر والبطالة وقلة الحيلة - فيجب معاملته بكل قسوة والحصول منه على اكبر منفعة مادية احسن من عينه - والتمنع وتطنيشه يدفعانه الى الهرولة خلفك - وحبيبك على ماتعوديه ولما يبقى جوزك اقرفيه ها ها ها<br />على فكرة… واضح إنك متحاملة جامد أوي ومعرفش هل ده نتيجة تجربة فاشلة مع واحد مايستاهلش ولا إيه…<br />وطبعاً أنا لو قعدت أقنعك من هنا للصبح بأي حاجة تانية غير اللي في دماغك هبأه بضيع وقتي…<br />أنا هقولك كلمة واحدة بس… هي:\"صوابعك مش زي بعضها\".<br />مش معنى إنك نزلتي وسط البلد وإتعاكستي بطريقة فظة هناك إن كل شباب وسط البلد طريقتهم فظة…<br />وهلم جرا."
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129022752/http://www.20at.com:80/banat/health-and-beauty/health/14583.html"

