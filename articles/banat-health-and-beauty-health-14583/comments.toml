text = "اولا مساء الخير انا سعيد ان فى موقع بيجمع الصبايا كلهم وبيفيدهم فى تبادل المعلومات تعليقى على الموضوع ده ان فعلا الخضروات مفيده جدا والفاكهه بس بشرط ان تكون طازه مثال طبعا على رأس القائمة الجرجير والخص والقرفس والبقدزنس والبزنجان والفاكهه الموز والفراولة والعنب واللحوم الكبده وطبعا جميع انواع الحيوان البحرية وبالذات السمك البورى وطبعا الجمبرى والكافيار والأستاكوزا<br />تحياتى لكل الصبايا<br />وليد مهندس شبكات 0109808000"
archived = "2009-12-28"
capture_url = "https://web.archive.org/web/20091228090744/http://www.20at.com:80/banat/health-and-beauty/health/14583.html"

[[comments]]
order = 8
subject = ""
author = "Saksoka Shaldam"
posted = "2009-12-28"
text = "عزيزتى نسرين - انت تنفخين فى قربة مقطوعة - فالرجل الشرقى اصبح فنجرى حنك - مابيغرفشى - واصابه الهزال من اللواط والعادة السرية - واصبح يفكر فى التحرش والخطف والاغتصاب بالتهديد ليثبت انه رجل - ويتحجج بالفقر والبطالة وقلة الحيلة - فيجب معاملته بكل قسوة والحصول منه على اكبر منفعة مادية احسن من عينه - والتمنع وتطنيشه يدفعانه الى الهرولة خلفك - وحبيبك على ماتعوديه ولما يبقى جوزك اقرفيه ها ها ها"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229140412/http://www.20at.com:80/banat/health-and-beauty/health/14583-2009-12-25-13-11-51.html"

[[comments]]
order = 9
subject = ""
author = "Saksoka Shaldam"
posted = "2009-12-28"
text = "للاسف الرجل الشرقى مهما تعلم فنظرته للنساء نظرة حيوانيةلا تهمه مشاعرها وكلهم يقولون ( نساؤكم حرث لكم فاتوا حرثكم انا شئتم - صدق الله العظيم )ويقولون ان المراة لاتدخل الجنة اذا تمنعت على زوجها ولو كانت تعبانة - الجنس ليس عملية ميكانيكية بل هو سمو وعاطفة وملاطفة للوجدان فى الوقت المناسب وبعد حمام دافىء للرجل فرائحة عرقه منفرة او رائحة فمه او عدم نظافة قدميه واظافره - فهناك فرق بين الانسان وباقى المخلوقات - وعجبى"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229140412/http://www.20at.com:80/banat/health-and-beauty/health/14583-2009-12-25-13-11-51.html"

