text = "نعم نريد بعض الثعالب فى قريتنا ليراها الاطفال وليتذكروا قصص الاباء عن الثعلب المكار<br />ثم انة فى قريتنا دجاج كثير وضفادع تنقنق كثيرا والثعلب يستمتع باكلها<br />وبعدين الثعلب بينضف البلد من الثعابين والطيور البرية المريضة<br />تعالوا يا ثعلب عندنا"
