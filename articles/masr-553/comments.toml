[[comments]]
order = 0
subject = "واللهى الحزب ده هوالى كله ملاحيس"
author = "أبو أسامة"
posted = "2006-06-21"
text = "ملاحيس لأنهم لسة معرفوش انهم مكروهين<br />ومحدش عاد بيصدقهم ولابيثق فى كلامهم<br />ولا فى اى حد بينضم او بيدافع عنهم فوقوا بقى الناس بيعرفوا الفرق بين الملاحيس والمناحيس الى نحسوا البلد وخربوها<br />الله يخرب بيوتكم والبيوت الى جنب بيوتكم<br />ما انت م كلكم فى مرينا والىبيسرق<br />بيروح فين"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170723/http://masr.20at.com:80/article.php?sid=553"

[[comments]]
order = 1
subject = "الحزب الوطي"
author = "احمد عبد السميع"
posted = "2006-06-21"
text = "طبعا الكثير من رعاع الشعب المصري يريدون الحريه وهم لايعلمون ان حكمانا يقوم علي اساس اراعي والغنم وكلب الحراسه فهل نترك الغنم للديابه"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170723/http://masr.20at.com:80/article.php?sid=553"

[[comments]]
order = 2
subject = "الظالم والمظلوم"
author = "عبد الله"
posted = "2006-06-22"
text = "الحقيقة التى يتغافل عنها الجميع أن الحزب الوطني هو حزب الأغلبية شئنا أم أبينا<br />وإذا أنت سألت الرجل العادي فى الشارع تختار من يمثلك فى البرلمان سيقول الحزب الوطني وهذا ماتم فى الإنتخابات الأخيرة ولكنكم قوم تجهلون فما حدث أن الحزب إختار أفراد على قوائمه عمل على إسقاطهم وإختار من هم أحسن منهم على قوائمه الأخري وهم أبنائه المستقلين وذلك كما أخبرنا السيد موافي الشريف عفوا صفوت الشريف<br />يا ناس يا عالم هو فيه حزب وطني أصلا<br />بداية هذا نصب فى نصب ليس هناك حزب أما عن جمعية مقاومة الملاحيس فهم والله الملاحيس واللصوص<br />فإبراهيم نافع لص<br />وممدوح إسماعيل لص وقاتل<br />وسمير رجب لص<br />وحسن حمدي لص وجميع أعضاء مجلس الشعب المصري من هذا الحزب إما مرتشون أو مزورون أو داعرون أو ديوثون أو .........<br />إلا من رحم ربي فهذا وأيم الله حزب الملاحيس<br />ودمتم"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170723/http://masr.20at.com:80/article.php?sid=553"

[[comments]]
order = 3
subject = "كفاية لبس طرح"
author = "لابس طرحه زي الحريم"
posted = "2006-06-23"
text = "سوري ياعم حسنين، أحبك في الله من غير معرفك إنت منين وفين.<br />وأقول لكل المصريين اللي زي أنا من اللي لبسوهم طرح الحريم، وطردوهم من كل تقسيم للنهيبة اللي هي مصر:<br />عارنا لايمكن إننا نغسله قبل مانمسك الحلاليف الخنازير اللي زي السادات ده وعز وسيد قرد مرعي عثمان هباب عثمان و..و..و...و وعائلاتهم في وسط الشارع ونطبق عليهم حكم الشرع في اللصوص والمفسدين في الأرض. حكم الشرع اللي في القرآن الكريم مش شرع طنطاوي. ساعتها الخنزيرة حسنية حتوصلها الرسالة وتاخد ذيلها في سنانها المهرتمة وتجري مع عيالها.<br />عارنا عمرنا ما نغسله قبل مانبدأ برجم الخنزير القذر السادات في قبره، لأن هو إبليس أبو الأبالسة دول الله يجحمه ويلعنه."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170723/http://masr.20at.com:80/article.php?sid=553"

[[comments]]
order = 4
subject = "رد على سؤال:"
author = "مختار"
posted = "2006-06-24"
text = "عايز تعرف ليه بدراوي الغاوي؟<br />إذن إقرأ:<br />من كان يملك درهمين تعلمت ---......-شفتاه أنواع الكلام فقالا<br />وتقدم الفصحاء فاستمعوا له --.-...و رأيته بين الورى مختالا<br />لولا دراهمه التي في كيسه .---.........-لرأيته شر البرية حالا<br />إن الغني إذا تكلم كاذبا ...----...قالوا صدقت وما نطقت محالا<br />وإذا الفقير أصاب قالوا لم يص ----وكذبت يا هذا وقلت ضلالا<br />أن الدراهم في المواطن كلها ----تكسوا الرجال مهابة وجلالا<br />فهي اللسان لمن اراد فصاحة ----وهي السلاح لمن اراد قتالا<br />ياخويا هو مين أنقح حسام ده، ولا حسام أبو الفتوح الي عامل فيلم جنس مع الراقصة دينا ومنزله على الإنترنت؟ لوتشوفوا شكله زي البرميل. والله دي بلد تستاهل الصواعق والنيازك والشهب تحرقها حرق، لإننا ما عندنا إيمان."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170723/http://masr.20at.com:80/article.php?sid=553"

[[comments]]
order = 5
subject = "أستودعكم الله أحبائي"
author = "سمسم"
posted = "2006-06-24"
text = "بعد غد بإذن الله أغادركم للندن للإقامة والعلاج هناك . قلبي معكم ومشاعري، وإذا ماجرحت مشاعر أحد منكم، فأرجوه أن يسامحني.<br />والسلام عليكم."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170723/http://masr.20at.com:80/article.php?sid=553"
