subject = "اشى خيال يا ناس"
author = "نيفين نيفى نوفا"
posted = "2007-01-23"
text = "اخيرا<br />بصيص امل وسط الضلمه<br />لم اكن مع ايمن نور و لم ارشحه و لكنه انسان فعلا يستحق الاحترام رغم كل شىء<br />يكفى ايمانه بمبداه و قضيته<br />فى وسط هذا الواقع السياسى الذى يشبه مسرحيه عبثيه و فى هذه الايام التى اهتزت فيها القيم و ازدوجت المعايير من يمللك مبدا و قضيه يستحق الاحترام"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130064235/http://masr.20at.com:80/article.php?sid=1482"

[[comments]]
order = 1
subject = "ليس دفاعا عن ايمن نور"
author = "مواطن"
posted = "2007-01-23"
text = "ليس دفاعا عن ايمن نور فايمن نور مواطن مصرى ينطبق علية القانون كبقية المواطنين<br />وانما السؤال<br />واحد زور ورق ينحكم علية والقاضى جاهز بخمس سنوات سجن<br />وواحد سرق وهرب مليارات الجنيهات الى الخارج ولم يحكم علية بيوم واحد سجن<br />وواحد غرق الناس بسفينة وقتل منهم الف ولم يحكم علية بشىء<br />هل عدنا الى الحديث<br />اذا سرق الضعيف قطعوة واذا سرق الغنى تركوة<br />هل هو قانون ساكسونيا كما قال عادل امام<br />يا قضاة مصر الرحمة ثم الرحمة<br />ولا تقولوا لنا انة قضاء نزية<br />اين النزاهة<br />هل كلنا سواء امام القانون<br />اشك"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130064235/http://masr.20at.com:80/article.php?sid=1482"

[[comments]]
order = 2
subject = "لماذا"
author = "لو قلنا أن أيمن نور سجن لتزويره طيب ما حسنى مبارك زور كل الإنتخابات من يوم لما مسك الحكم يعنى لو ضربنا كل إنتخاب مزور فى 5 سنوات سجن يعنى المفروض إنه يتسجن 25 سنة \"مؤبد\" ولكن ما فعله فى الدكتور أيمن نور معروف الأسباب لإن الدكتور أيمن طلب مناظرة مع الواطى مبارك وناسى إن الشعب هو إللى عمل المناظرة وحكم ونحن فى إنتظار حكم الله العادل القدير"
posted = "2007-01-23"
text = "لما واحد عنده دلوقتى 82 سنة وبيخرف فى كل اللقاءات وسرق البلد ونهبها وعايز يورث الحكم للعبيط إبنه وناسى إن مصر مليانة كفاءتها وإن إبنه مدمن إزاى واحد زى ده ما يتحاكمش على إللى وصل مصر ليه إزاى قاعد لسه فى الحكم وببجاحة بيقول لآخر نفس ربنه يقطع نفسه ويريحنا منه اللهم آمين<br />ربنا يفك كربك يا دكتور أيمن ويرجعك بالف سلامة"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130064235/http://masr.20at.com:80/article.php?sid=1482"

