text = "ليس دفاعا عنه ولكنه مواطن مصرى تجرا في يوم من الايام وقال لا فى وجه الفساد المباركي . ويمكن تكون قصته بالضبط زى اللى عملوه مع صدام البراءة بعد ان تسببوا فى اصابة نور بكل انواع الامراض الغريبة والخطرة جدا على حياته, انا سمعت والله اعلم انهم سجنوه مع ناس مصابين بامراض جلدية مستعصية وبالايدز والسرطان .... يمكن يكون نور بداية النور والامل و ان شاءالله مش هتكون النهاية , وان راح نور هيكون فيه مليون نور !!!!!!!!"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130064235/http://masr.20at.com:80/article.php?sid=1482"

