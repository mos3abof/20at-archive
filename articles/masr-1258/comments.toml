[[comments]]
order = 10
subject = "مش مستغرب!!!"
author = "مصطفى محي"
posted = "2006-12-09"
text = "مش عارف ليه مش مندهش من كل هذه التفاصيل ومش مندهش أيضاً من عدم سؤال سيادة اللواء المبجل الفاتح العظيم عما يفعله، لست مندهش لأنه ومنذ فترة أصبحت لدي قناعة أن كل رئيس جامعة هو بالضرورة تابع مطيع للأمن ومردد لخطاب الحكومة ولا أجدعها بغبان، وأضف إلي ذلك عمداء الكليات ووزير التعليم العالي، ياجماعة الجامعة قضيتها مرتبطة بقضية البلد كلها وعشان الجامعة تنضف لازم البلد كلها تتخلص من العفن الضارب فى كل حته، وقلبي بيقوللى (مش عارف ليه) إن الطلبة هيكون لهم دور كبير فى ده، وساعات كده خير اللهم اجعله خير بحلم بيوم الطلبة فيه معتصمين فى قلب ميدان التحرير أو أمام مجلس الشعب وبيطالبوا الحكومة بالاستقالة وبيدعوا كل فئات المجتمع بالتضامن معهم وبيطالبوا كمان إن الأمن يخرج بره الجامعة"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065436/http://masr.20at.com:80/article.php?sid=1258"

