text = "انا راي الرجل ده يحطو عليه يفطه تحت الطلب<br />لف كل الجامعات ناقص القاهرة وجامعه الدول العربية لو فيها كان ظبط وزراء الخارجه<br />حاجه وسخه وتكسف و<br />وده انسان زباله"
