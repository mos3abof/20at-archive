[[comments]]
order = 4
subject = "لماذا هذا كله"
author = "الطوارق"
posted = "2006-12-07"
text = "ماذا فعل هؤلاء الطلبة المحترمين الذين هم من خيرة اهل البلد والذين هم ستقع عليهم ادارة المستقبل ،الا يفكر هؤلاء المتجبرين الضالمين بماذا يمكن ان يكون في المستقبل .<br />والله انا اسكن في المانيا وانا مسلم والحمد لله ولي نشاطاتي الاسلاميه البسيطه ولكن مرايت في يوم من الايام اي معارضه من الاجانب هنا .<br />لماذا كل هذا ، ألكونه من ؟؟؟؟؟<br />لا اعرف<br />اعتذر لللاطاله والسلام عليكم"
archived = "2006-12-09"
capture_url = "https://web.archive.org/web/20061209002411/http://masr.20at.com:80/article.php?sid=1258"

