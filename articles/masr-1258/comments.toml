[[comments]]
order = 12
subject = "يعنى جت عليه"
author = "مصرية مهمومة"
posted = "2006-12-10"
text = "تحياتى سيدى<br />ماده بيحصل دايما واحنا نستاهل اكتر من كدة<br />ومثل مصرى بيقول يا فرعون ايه فرعنك قال ملقتش حد يردنى<br />وبعدين الاشخاص اللى سيادة اللواء اعتدى عليهم يبدو من كلامك انهم اخوان<br />فما الراى فى شاب قدم اوراقه لانتخابات الاتحاد _جامعة حلوان برضه_فقالوا لا تسال ثانية انت طلعت كفاية وفتاة اخرى قيل لها عندك محضر اداب<br />على فكرة الامر يتمصوريا حتى لا يملك احد من القلة المارقة امثالنا الاعتراض<br />شكرااااااااااا<br />مصرية مهمومة"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065436/http://masr.20at.com:80/article.php?sid=1258"
