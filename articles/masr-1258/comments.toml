subject = "بلد بتاعه اسماء صحيح"
author = "ههههههه"
posted = "2006-12-07"
text = "اللواء بيطلبوه بالاسم<br />والبلطجيه بالاسم<br />والوزراء بالاسم<br />والنصابيب بالاسم<br />والمعتقلين بالاسم<br />واه الخابه ده مفيش عالم بالاسم<br />لكن الحمد لله<br />في عالمه بالاسم"
