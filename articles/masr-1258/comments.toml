[[comments]]
order = 0
subject = "ما قدرتش أكمل الموضوع .. خفت الوولف يعضني ويبوظ الضغط معايا"
author = "إبن بهيه"
posted = "2006-12-06"
text = "الله .. الله .. إيه ده ؟؟؟ ده مش ضابط بقى .. ولا حتى بلطجي .. ده كلب حراسه غشيم ومش متدرب خالص على الحراسه .. بيعض بس من غير هوهوه حتى .. يخرب بيته ليكون مسعور والعيال يا ولداه يموتوا .. أنا لو مكان أي طالب منهم وعمل معايا كده بصراحه رايح أطخه عيارين وأخلص الناس من شره ..فيها إيه ؟؟؟ كلب وراح .. حاجه بجد تجنن .. والنبي دي حكومه ودول أمن ؟؟؟ أنا بصراحه باعتذر لأنني لم أكمل الموضوع .. وصلت لغاية جامعة الأزهر وقرفت وضغطي علي .. يمكن بكره أقدر أقراه .. ربنا ينتقم منه ومن أمثاله من بوبيهات مبارك الواطي .. بوبيهات إيه بقى ؟؟؟ ده لواء وولف متوحش .. هو إيه أضخم نوع في الكلاب ؟؟؟ يمكن يكون الوولف ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-09"
capture_url = "https://web.archive.org/web/20061209002411/http://masr.20at.com:80/article.php?sid=1258"

