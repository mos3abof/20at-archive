[[comments]]
order = 4
subject = "ما هي نوعية الحضارة القائمة علي شعر المرأة؟"
author = "شيماء"
posted = "2006-11-20"
text = "السلام عليكم و رحمة الله و بركاتة<br />الاخوة و الاخوات الافاضل<br />بمناسبة تصريحات السيد هباب المتهبب ماحي الثقافة في مصر جاعل اصغر عيل في اقل دولة في العالم مثقف اكثر من اساتذة التعليم في مصر و هذه اهم انجازات وزير الثقافة المصري التي لابد و ان تذكر لنرجع الفضل لاصحابة, اه بمناسبة تصريحاتة حول الحجاب و امة و زوجتة الي لسة متجوزهاش لانه لسة بيكوم نفسة اود ان اسأل سيادته و اسأل كل من يهاجم الحجاب و مرتدياته و يتهم بالرجعية و التخلف لي عنده و عندهم سؤال و هو سؤال حيوي جدا جدا جدا اما السؤال هو:-<br />اي حضارة عمو الوزير التي تقوم علي شعر و صدر و اقدام و خصر المرأة اي نوع من انواع الحضارات هذه ؟؟ طيب تفرق ايه مع سيادتك اني البس حجاب او ملبسش او استر جسدي او اعريه؟؟ هو لمؤاخذة انت و شوية الهبل الي بيهاجموا الحجاب من نوعية العالم الي قايمة قاعدة ماشية نايمة تبص في الستات الي حواليها و تبحلق علي اساس ان الله جميل يحب الجمال و احنا لازم نتمتع بالجمال ( كما يدعي الهبل امثالكم) او يمكن ان الحضارة كلها قائمة علي شعر و جسد المرأة و الي مش عاجبة افقعوا عينة؟؟<br />و يا تري الحضارة القائمة علي شعر المرأة تفرق معاها اذا كان الشعر اسود و لا اشقر و لا احمر؟؟ طيب بلاش السؤال دة يمكن صعب شوية نسأل سؤال تاني:<br />زمان في افضل عصور الدولة الاسلامية كانت كل النساء محجبات او يمكن منتقبات و مع ذلك قامت افضل الحضارات الاسلامية اذا كنت تسمع عنها اصلا و التي اقتبس الغرب حضارته منها لية بقي مأثرش الحجاب وقتها علي بناه الحضارة الاسلامية؟؟<br />طب بلاش سؤال تاني اسهل:<br />ممكن اعرف من حضرتك نوع الحضارة و التقدم الي احرزة الشعب المصري منذ خلعت الست الي ربنا خدها صفية زغلول حجابها اول مرة؟؟ الان في هذا العصر اكثر عصور الشعب الم<br />اقرأ بقية التعليق .."
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129044155/http://masr.20at.com:80/article.php?sid=1179"

[[comments]]
order = 5
subject = "ياى ياى ..حجاب موش فى الاسلام"
author = "المصرى"
posted = "2006-11-21"
text = "والوزير الولهان بيقول 4 اركان هى الاسلام ! واتعجب للصبايا المودرن يروحوا يأكلوا همبورجر وهوت دوج ودى غربيه مش من البيئه المصريه زى مابتهموا الحجاب انه غريب ...واخيرا هل الوزير كان يتمد من لسانه ويتكلم عما هو بعيد عنه لو كانت حرم رئيس الجمهوريه محجبه !!!!! اظن ردى لاسع وحراق لمن يؤيد الوزير وهو بمنصبه سياسى لاشخصى فهناك اراء شخصيه وليست للنشر كما فعل بل بغباء رايناه فى فضائيه مع دلدوله الرقيع حسين فهمى"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129044155/http://masr.20at.com:80/article.php?sid=1179"

[[comments]]
order = 6
subject = "زمن الغربة"
author = "م. محمد سيد"
posted = "2006-11-22"
text = "لا حول ولا قوة الا بالله<br />لا أحد من المسلميتن يؤمن ان الشكل هو الاساس فى الإسلام ولكن هناك اوامر صريحه فى الاسلام بالالتزام باشياء معينه بمعنى ان الله قد امر بذلك فسبحانه وتعالى امرنا ان نصلى و ان نصوم فهل يجوز لنا ان نسأل لماذا نصلى ؟ نحن نصلى لأن الله أمرناوحسب. و الأصل فى الدين \" من شاء فليؤمن\".<br />من شاء بمعنى ان الانسان حر فى الايمان او الكفر و لكن ليس له الحرية فى ان يختار ان يؤمن بجزء ويترك جزء فالدين اوامر ونواهى و بالطبع هناك منا( أو كلنا) من يرتكب المعاصى فنحن لسنا معصومون ولكن المصيبة الكبرى هى انكار المعصية و رد الامر على الله عز وجل والاعتراض على ما امر . وللأسف فاننا اليوم نرى مسلمون محسوبون على الإسلام يقلدون اهل الكتاب فى قولهم \" نؤمن ببعض و نكفر ببعض\" وكأنهم يريدون اسلاما مفصلا وفقا لاهوائهم فما لا يعجبهم هم له منكرون. اما الامر الغريب ان من يسمعهم يجدهم متمسكين بحرية الانسان فى المعصية و يحاربون حريته فى عدم المعصية!!!<br />فلم نسمع يوما كلاما او اعتراضا على من تسير شبه عاريه و يعتبرونه حرية شخصيه .<br />و ان كان هناك يقول ان كثير من الاخوات المحجبات \" مش تمام\" و هذا تعبيرهم لهم اقول ليس العيب فى الحجاب و لكن العيب فى من ترتديه فالاساس اننا نعرف الرجال بالحق و لا نعرف الحق بالرجال .<br />و إلى الله المشتكى"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129044155/http://masr.20at.com:80/article.php?sid=1179"

[[comments]]
