subject = "اعتذار للفنان فاروق حسني"
author = "عماد رشيد"
posted = "2006-11-23"
text = "بصفتي الشخصية أعتذر للفنات المستنير فاروق حسنى ، بسبب الحملة المسعورة الموجهة ضده .<br />تلك طبيعة الأمور في بلدنا.. أي رأي مخالف لطيور الظلام يلاقي الهجوم الضاري و التكفير و العمالة .<br />لا تقلق ياعزيزي ، فأنت الباقي بفنك و أفكارك أماهم فإلى النسيان.. فالتبق ألف عام."
archived = "2006-11-29"
