subject = "لقد نجح هذا الجدل العقيم فى صرف الناس عن قضاياهم الرئيسيه"
author = "نيفين نيفى نوفا"
posted = "2006-11-20"
text = "و هو دا اللى انا قصدته<br />و اللى عمرو اديب قصده<br />مش بقولكو<br />حكومتنا شاطره اوى ف لعبه التعتيم و التهميش و التغطيه على القضايا الرئيسيه"
