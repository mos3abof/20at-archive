[[comments]]
order = 0
subject = "في موريتانيا (فــال) حلو خالص"
author = "إبن بهية"
posted = "2006-11-19"
text = "أستغرب من قلة التغطية الإعلامية لموضوع الانتخابات البلدية الموريتانية رغم خطورة الموضوع .. فهو ربما يكون حلقة (بايلوت) في مسلسل التغيير العربي والإسلامي .. بروفة يعني .. آه لو نجحت تجربة إخواننا الموريتانيين وأتت بحكم ديموقراطي محترم سيكون بكل تأكيد (فال كويس أوي أوي) .. أقصد الإثنين كويسين طبعاً رئيس الحركة العسكرية (المباركة حتى اليوم) العقيد علي ولد محمد فال ، وبرضه فال كويس أوي أوي (من باب الفأل الحسن) لينا في مصر لو أكرمنا ربنا بحفنة عسكر تسري في عروقهم دماء حارة وانتزعوا البلد من براثن النظام الحاكم بأمر مش عارف مين .. تعلمنا قديماً أن الانقلابات والحركات العسكرية في أي بلد في العالم تأتي كنتيجة منطقية لجملة من الأسباب .. تتوفر كل هذه الأسباب في بلدنا الحبيب مصر منذ أكثر من ثلاثين عاماً ويزداد تركيزها كل يوم حتى باتت معتقة جداً لدرجة شديدة المرارة وشديدة العطن والعفن ..<br />لقد أعياني البحث كثيراً في سر عدم قيام أي حركة عسكرية انقلابية في مصر حتى الآن برغم كل ما تعانيه من آلام ومشكلات داخلية وخارجية بسبب ذلك النظام البغيض ؟؟؟ مليارات المليارات تنهب كل يوم وأهل مصر تقطعت بهم السبل في شتى بقاع الأرض طلباً للقمة العيش التي قلما يجدوها ويلعقون كرامتهم اتقاء عضة الجوع التي لا ترحم .. وفي المقابل تجد القطط السمان تزداد تخمة ورفاهية تصل إلى أبعد حدود السفه التي يمكن معها أن يصل مصروف قطيط صغير (قطقوط صغنن) إلى ما يوازي مصروف حي كامل من أحياء القاهرة الفقيرة .. دماء المصريين باتت مهدرة بعد أن أهدرت كرامته وأمسى لا قيمة له ولا ثمن يذكر ..<br />يموت المصريون يومياً في البر والبحر والجو بلا ثمن ولا مسائلة حتى من باب تكريم الإنسان .. يموتون على الإسفلت من جراء سرقة ونهب مليارات مخصصة<br />اقرأ بقية التعليق .."
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129044155/http://masr.20at.com:80/article.php?sid=1179"

[[comments]]
order = 1
subject = "ربك يعدلها"
author = "إبن بهية"
posted = "2006-11-19"
text = "أعتذر بداية عن نشر موضوع انتخابات موريتانيا في معظم الموضوعات ولكن السبب كما تعلمون أيها الإخوة أن إعلامنا المعفن من ريحة الأشكال الوسخة اللي كوموها فيه زي الزبالة من مخبري لاظوغلي أمثا ل عبدالله كما وريسه المعفن في روزاليوسف اللي نسيت اسمه لأنه نكره وتافه والدقاق في دار الهلال وكل الألاديش وأكوام القمامة دي .. أقول أن إعلامنا أهمل تماماً هذا الموضوع على أهميته وخطورته لأنه كما أتمنى وتشاركوني بكل تأكيد أمنيتي أن تكون بروفة يمكن تطبيقها في مصر .. طبعا سيضحك من يضحك ويقول ياه .. إبن بهية اتجنن ... آدي اللي ناقص .. نتعلم من موريتانيا .. راح أقولك إهدا كده وخليك عاقل وشوف حسني مبارك الواطي وصلنا فين ... يا بني احنا بكره راح نودي عيالنا يتعلموا في موزمبيق .. احنا بقينا في ديل الدنيا يا طيب .. المهم مش عايز أطول عليكم بس كنت باتمى على أولاد البلد يفردوا صفحة واحدة لموريتانيا وتجربتها الجميلة التي قام بها فال .. هي جميلة حتى اللحظة .. يا عالم ربك يستر ..<br />فالأستاذ جمال بدوي من الناس المحترمة ككثير من المحترمين في هذاالبلد من كل التيارات ولكنهم للأسف الشديد قلة نادرة .. يعني لو جينا لمناقشة سي فاروق بهدوء .. ما أظنش في بلدنا كافر (لا مسلم ولا مسيحي ولا يهودي أو بوذي حتى) يقبل أن سيادته بيحب يبصبص لشعر أمه ولا أخته ولا بنته .. صح ولا احنا خلاص فقدنا فتفوتة الرجولة الباقية ؟؟؟ فكلامه عن شعرها والورد والمسخرة بتاعته دي غير مقبولة بالمرة من باب النخوة وليس التدين .. يروح يرمي بلاويه في أي مزبلة من اللي هو عارفها .. وبعدين ماله هو ومال الستات ؟؟؟<br />كمان بيقول سي فاروق أنه لو كان متزوجا لمنع زوجته من ارتداء الحجاب ؟؟؟ يا سلام ؟؟؟ والنبي دي مش بجاحة ووقاحة وقلة أدب ؟؟؟ مش منع الحجاب عشان ا<br />اقرأ بقية التعليق .."
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129044155/http://masr.20at.com:80/article.php?sid=1179"

[[comments]]
order = 2
subject = "الحرية مثل الصياعة..أدب"
author = "قلم جاف"
posted = "2006-11-20"
text = "ألا يمكن لفاروق حسني والست إقبال بركة التعبير عن رأيهم بشكل يتناسب مع مستوى الثقافة التي يدعون امتلاكها.. إذا كان \"الإسلامويين\" هووليجانز وجهلة خليكم انتم الكبار..<br />عموماً .. شكراً للمصري اليوم ولعمرو أديب اللذان قدما لنا الوزير وإقبال بركة على حقيقتهما.. الوزير الكبير والكاتبة الكبيرة يؤكدان لنا في كل يوم أن التشنج في مصر بخير ولا نحتاج لاستيراد متشنجين من الخارج!<br />صباح العته والتشنج!"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129044155/http://masr.20at.com:80/article.php?sid=1179"

