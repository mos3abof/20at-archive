text = "انا عمري ما بحط اغنية عادية<br />اولا علشان لو رنت ادام حد وعجبته وحطها ما اخدش ذنوب عليه<br />ثانيا بحسها حاجة محرجة ان تليفوني يرن بأغنية في اي مكان<br />فدايما حطاها نشيد ديني او دعاء ودايما بتبقى حاجة مش منتشرة ومميزة علشان لو حد سمعها يحط زيها وعمري مابغيرها الا لما اسمع الاحلى منها<br />انا حاطة دلوقتي نشيد مشاري العرادة اسمه ثابت<br />جربو تسمعوه كده وقولولي ايه رأيكو"
