[[comments]]
order = 5
subject = "زهرة"
author = "أميرة الصمت أقول: دع ما يريبك إلى ما لا يريبك"
text = "وقول الحبيب المصطفى: 'الحلال بين والحرام بين وبينهما أمور مشتبهة فمن ترك ما شبه من الإثم لما استبان ّأترك، ومن أجترأعلى ما يشك فيه من الإثم أوشك أن يواقع ما استبان والمعاصي حمى الله من يرتع حول الحمى يوشك أن يواقعه'"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151905/http://www.20at.com/article.php?sid=1578"

[[comments]]
order = 6
subject = "يامسلمين أستعدوا"
author = "أستعدوالهذة الأيام المباركه"
text = "يجب أن تتدربوا على الصيام بصيام الأثنين والخميس<br />وكذلك قراءة القرآن وقيام الليل<br />عسى الله أن يعتق رقابنا من النار فى هذة الأيام المباركه<br />ونصيحه ياشباب لاتبدأ بقوة ثم تمل بعد ذلك<br />يجب أن تصبر وتأخذ هذا الشهر كله بقوة وليس أول عشرة أيام ثم تمل بعد ذلك<br />الهم أعتق رقابنا من النار اللهم أعتق رقابنا من النار الهم إعتق رقابنا من النار<br />الهم آمين آمين آمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151905/http://www.20at.com/article.php?sid=1578"
