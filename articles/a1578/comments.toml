subject = "زهرة"
author = "نتلتقي إن شاء الله طيلة أيام الشهر الكريم مع الداعية الإسلامي عمرو خالد في قناة إقرا للحديث عن السيرة العطرة للحبيب المصطفى صلى الله عليه وسلم ومن المدينة المنورة فكونوا من المتابعين."
text = "و بالتوفيق إن شاء الله."
