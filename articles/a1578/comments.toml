[[comments]]
order = 0
subject = "مهم . . منتظر . ."
author = "نت أود أن أكتب شيئا مماثلا . . أعتقد أن الفترة الباقية قليلة وتكفي بالكاد للاستعداد الروحي والمعنوي لاستقبال أوكازيون الحسنات"
text = "رمضان ليس إلا هدية لمن أجاد قبله في باقي العام، تماما مثله مثل امتحانات الدراسة، فلا أحد يحصل على درجات عالية وهو لم يكترث بالمذاكرة طوال أيام العام<br />ليس معنى ذلك أن الشخص الذي أهمل طاعة الله طوال أيام العام عليه أن \"يقضي رمضان بالمرة\" زي ما تيجي تيجي . . لكن عليه أن يبدأ من الآن . .<br />أعتقد أن من لن يبدأ بالحفاظ على ركعتين قيام من الآن لن يستطيع أن يكمل في رمضان . .<br />يارب بلغنا رمضان ولا تحرمنا أجره، ولا تبلغنا إياه إلا وقد جعلتنا مستعدين للنهل من خيراته . . ولا تخرجنا منه إلى وقد أعتقتنا من النيران . . وتقبلته منا يا رب رمضان ورب كل الشهور والأعوام<br />آمين<br />عمرو مجدي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151905/http://www.20at.com/article.php?sid=1578"

