author = "احمد مسلم"
posted = "2006-12-06"
text = "قال تعالى: وما اتاكم الرسول فخذوه ومانهاكم عنه فانتهوا واتقوا الله ان الله شديد العقاب ) صدق الله العظيم<br />السلام عليكم ورحمة الله<br />حد يقولى ياجماعه لحد امتى الكووسه هاتحكم فى بلدنا يعنى فاروق بتاع الكقته يبقى وزرير وحرامى وكمان بيتكلم فى الدين فعلا سبحان الله ويخلق مالا تعلمون متشكرين يا يا بو حسنى يانجم بس احب اضيف تعليق صغير عشان ماطولش عليكم<br />من صفات الله عز وجل وكل عارفينها عن ظهر قلب الرقـــيب فياريت كل مرتشى من ... تسوله مفسه بلاش يتكلم فى الدين"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214183709/http://masr.20at.com:80/article.php?sid=1236"

[[comments]]
order = 41
subject = "اسلامك عنوانك فاهم ياعم فاروق"
author = "احمد مسلم"
posted = "2006-12-06"
text = "الرجوله هى ان تلقى الله معتصما بالا سلام<br />وياريت نفوق بقى لاحسن الا حتلال مبقاش اقتصادى وبس ده بقى احتلال ثقافى واجتماعى ودينى والخ الخ الغرب عايز يعمل منك نموزج يامسلم اليهود اللى هانت عليهم اوامر ربنا هما كمان هانوا على ربنا"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214183709/http://masr.20at.com:80/article.php?sid=1236"

[[comments]]
order = 42
subject = "في إيه !"
author = "شنباوي ههههههه"
posted = "2006-12-10"
text = "السلآم عليكم يخوآنا ^_^<br />أنا وـآحد سعودي يعني عرث ههههههآإأي كيف الحال يا بتاع كلّّه هههههههههههآإأي<br />يالله باي<br />لالالا نسيت اقول لكم رآيي فالحجاب<br />الحجاب فرض يا كلآب يا وزير المعرصين خخخخخخخخخخخخ"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214183709/http://masr.20at.com:80/article.php?sid=1236"

[[comments]]
order = 43
subject = "تأييد للوزير"
author = "د. أحمد عزب"
posted = "2006-12-22"
text = "غريبة أمر الأسلاميين، عندما يجهرون بأرائهم لا يريدون لأحد ان يعارضهم، ولكن عندما يعبر شخص مصري في وظيفة وزير في مكالمة هاتفية عن نوستالجية لمصر التي كانت حتى نهاية السبعينات بدون حجاب، فهم يعترضون على حريته في إبداء رايه. الذين يعترضون على أبداء الوزير رأيه هم على شاكلة طلبة الجامعة الذين حاولوا قتل نجيب محفوظ وقتلوا فرج فودة."
archived = "2006-12-25"
capture_url = "https://web.archive.org/web/20061225174929/http://masr.20at.com:80/article.php?sid=1236"

[[comments]]
order = 44
subject = "مفاهيم خاطئه"
author = "د. سامى عمران"
posted = "2007-01-21"
text = "المشكله فى فهمنا الخاطى الحجاب هو فرض على المرأه المسلمه لا مجال فيه للاراء الشخصيه"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122044041/http://masr.20at.com:80/article.php?sid=1236"

[[comments]]
order = 45
subject = "حقيقه المشكله"
author = "باحث. حسن مختار-"
posted = "2007-01-21"
text = "المشكله هى قله المعلومات الدينيه لدينا بصفه عامه ان حجاب المسلمه هو فرض مثل الصوم والصلاه وكون ان بعضنا يجهل هذه المعلومه لا نلومه ولكن نلوم الجهات الاسلاميه التى عليها ان تعلم الناس الدين"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122044041/http://masr.20at.com:80/article.php?sid=1236"
