text = "الاخ العزيز سعيد المنصور اكرمك الله صاحب نقد بناء لكن لسنا نحن من يحارب للاسلام لانه لم يعد بداخلنا ايها الاخوة<br />الاعزاء لم يعد هناك اي مجالات للمناقشه والدفاع عن الوطني والدفاع عن الاخوان والتعصب انا بصراحه ربنا كرمني بابداعات مختلفه من صنع ربي فانا هترك مصر وادعوكم لهجرة مصر لان الجميع يتحالف ضدنا"
