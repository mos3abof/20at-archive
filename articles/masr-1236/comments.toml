posted = "2006-12-03"
text = "التعبير عن الرأي لا يكون بمثل هذا الكلام ولكن بالله عليكم لا تكتبوا هذا الكلام على الإخوان وإذا أردت أن تتحدث مع أحد من الإخوان فتكلم معي على هذا الإميل واعرف أهدافنا ولكن أقول لك خلي بالك من الكلام الجميل المكتوب أعلى الصفحة فهذا هو شيء من فكر الإخوان ولا الهدف هو الحكم فنحن مع مبارك ولكن يرضي الله في حكمه ونحن مع التوريث ولكن في النهاية نرى أثر الرضا على المصريين وعليك أنت من الداخل إذا كنت من غير المنتمين إلى الحزب الوطني أو إلى الأعمال الحكومية وربنا يكرمك وعرفنا عليك نحن نحب التعرف على الأساتذة المحترمة مثل حضرتك يا مصري إلى النخاع والسلام عليكم ورحمة الله وبركاته وبارك الله فيك يا أستاذ ياسر على هذا الكلام الجميل"
archived = "2006-12-05"
