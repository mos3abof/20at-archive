[[comments]]
order = 6
subject = "كيف تقابل المرأة الله؟؟؟!!!"
author = "إمرأة فى العصر المظلم"
posted = "2006-12-01"
text = "اذا كان الحجاب هو عائقكم فهل العرى هم دواكم ؟؟<br />واحب اقول لوزير الخطايا ان المرأة لما تفيض روحها الى خالقها تقابل الله وهى بحجاب فهل ترضى ان تحيا حياتها دون حجاب وهى تعرف انها ستقابل الله بحجاب<br />وثانيا نحن ابناء محمد تعلمنا منه التضحيه فاذا كنتم تزعمون انه يعيق حركتها فاننا مستعدون لأن نضحى بكل شئ حتى نحظى بارضاء الله سبحانه وتعالى ورفقه الحبيب المصطفى صلى الله عليه وسلم يوم القيامه<br />يا وزير الثقافه كفايه عار بقى على المسلمين<br />احنا بنفتخر باسلامنا ليه تنزلوا راسنا فى الأرض وتخلوا الغرب يضحكوا لينا ؟؟؟<br />واحنا فى وقت اهم من انك تناقش مواضيع منتهيه وامر من خالقنا<br />ياريت تنشغل بأمور المسلمين كدا زى ما حضرتك مشغول اوى كدا بامور النساء اللى هما اصلا راضيين بيها ومطلبوش بالتدخل<br />واظن وزير الثقافه مش وزير الدين سيادتك<br />وفى النهايه لا اقول سوى اللهم انصر الإسلام والمسلمين وارفع رايتهم الى الأعلى<br />والى الأمام يا ايها الأبطال الأخوان المسلمون<br />انتم فعلا اللى فيكم الخير وربنا يبارك فيكم"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073420/http://masr.20at.com:80/article.php?sid=1236"

