[[comments]]
order = 38
subject = "آن الآوان، ولا حول ولا قوة إلا بالله"
author = "أديب"
posted = "2006-12-05"
text = "مصادفة دخلت إلى موقعكم، وأهنئكم على الصراحة، ولكن يا أخوتي ، فعلا من المعيب أن ترد كلمات نابية على المواقع، لأنها تخدش الحياء والذوق العام، وإذا قامت الدنيا ولم تقعد على كلام قاله الوزير فاروق حسني وهو ليس للنشر، فالأحق بهذه الزوبعة مثل هذه الكلمات النابية التي يتلفظ بها من يظهرون أنفسهم بأنهم غيورون على الدين. أي متدينون هؤلاء الذين يتناولون أعراض الناس، ولا هم لهم إلا بالتصدي لهذا أو ذاك بكلام سفيه. آن الآوان يا أخوان أن نرتقي بلغة الخطاب إلى مستوى المصائب التي تعاني منها أمة الإسلام والتي تتعرض لأقوى هجمة لتفتيتها أمما وشعوبا وأحزابا، وليبق في أذهاننا جميعا أن الحساب حق لله جلت قدرته وحده ولا حول ولا قوة إلا بالله."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210329/http://masr.20at.com:80/article.php?sid=1236"

