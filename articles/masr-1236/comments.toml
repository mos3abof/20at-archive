[[comments]]
order = 27
subject = "كفاية حرام"
author = "ابن شبرا مصر"
posted = "2006-12-04"
text = "الحقيقة ياناس يا محترمةالفنان معروف من ايام مكان ملحق ثقافى فى ايطالي انة خول رسمى وعينة المرحوم عاطف صدقى وزير علشان كسبة دور طولة؟هتنتظرو اية من؟؟؟؟من الجالسين فى الوزارة والله كلهم عصابة روحوا شوفهم عيشين ازاى حتى بتاع الرقابة الادارية جاب الفلوس ال بانى بها القصر ال عايش فية منين ولا وزير الصحة السابق اسماعيل سلام ولا ولا؟؟ الظلم حرام والنفاق حرام وكفاية حرام واكبر عصابة فى مصروزارة الدخلية هما الارهاب بعينة شفهم وهما بيوصلوا اى وزير ولا ولااخر شيى جانى بيحطو عصاية فى راجل من ورة وبيصورة وهوا بيصوة معلش ياباشا؟؟؟احنا نستاهل ال بيحصل دة لان النخوا والرجولة مهاجرة والجيل ال موجود النص مضروب بى المخدرات وعايش فى الوهم وربع متجة اتجاة دينى وربع sms وتغير نغمات ومبيلات وهكر وفتح شفراة السكس ياخسارة يا مصر الحل ؟؟؟؟؟؟؟؟عند ام ترتر الحقيقة............لان ربنا مش راضى علينا لان احنا مش كويسين مع بعض ولما نحب بعض ربنا يرزقنا بحاكم صالح ياريت ايام الملك دامت على الاقل كنا بنحب بعض وكانت الناس بتساعد بعض وكان فى ادب واخلاق الانحلال فى مصر اكثر من اوربا والغلااء فى مصر لية؟؟بدورو على الحجاب يا ناس البلد بيظةوعوزة عمرة بسرعة؟؟مش نشتم ياريت كل واحد بيحب مصر وخايف عليها يعمل حاجةلازم لازم يحصل ثورة لو باقى عندنا لسة دم"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073420/http://masr.20at.com:80/article.php?sid=1236"

