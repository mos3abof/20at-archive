text = "انت لسه عايش يا دشم ,, الواحد يقرا تعليقك يحس بالقرف سواء انت او اللى على شاكلتك ..<br />انت عبيط يلا شكلك عبيط والله ..<br />لا للتوريث ولا لاستكمال المسيرةولا لابواق التعريص \"اسف فى الفظ \" اللى زى الدشم<br />لا للدشم ولا لكل جاهل \"قرنى\" زى الدشم"
