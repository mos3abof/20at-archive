text = "على كل صحفى ومصور بيحب مصر يدخل بيت الفنان فاروق حسنى ويبلغ الشعب عن ثمن الموبيليا والتحف ال موجودة عندة بصدق وامانةولا اموالة ال موجودة برة مصر لان فى تمثيل سفرة زيارة برة مصر ورجعت متغيرة وحواس شريك من اين تاتى هذة الملاين اقل حذاء لبسة فاروق 1000 يوروواقل بادلة عندة 3000 يورو اما الزعيم الكبير وابنة طبعا محتكر ماركة بريونى اقل قميص 350 يورو والبدلة بى 7000يورو والموظف خريج الجامعة مرتبة طول الشهر ميحصل 50 يورو يعنى فى السنةلم يحصل ثمن حذاء وزير..........الحقيقة والله العظيم وعنوانىyzshoubra@yahoo.com"
