[[comments]]
order = 13
subject = "طيب هنقعد ليه ولمين ؟؟؟؟؟"
author = "الاستاذ ك"
posted = "2006-12-02"
text = "انا اسف يا سيدنا اللي بتقول نهاجر ليه<br />يعني يرضيك ان البلد تتباع كده بالدس طيب احنا سكان اصليين ولا مستوردين ؟؟؟؟<br />طيب يا اخي لما البلد خسرانة الخساير دي كلها ومش جايبة همها بلاش يدوها للي قد المسؤولية<br />يعني حتى لما يبيعوها يشاورو صحابها<br />انا من رايي الواحد يلقاله بلد لاولاد قبل ماتتباع باقي البلاد ونبقى زي ركاب الترانزيت ولا احن محصلين لا شرق ولا غرب<br />سلام لحسن امريكا بتنده عليا<br />على فكرة انا مهندس الكترونيات<br />يعني طلع عين امي لحد مابقيت عاطل<br />حسبنا الله ونعم الوكيل"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073420/http://masr.20at.com:80/article.php?sid=1236"

