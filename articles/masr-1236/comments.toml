subject = "المصرى الشرموط"
author = "مصرى حتى النخاع"
posted = "2006-12-02"
text = "اسف لكل المحترمين على استخدام لفظ خارج الا المتخلف اللى مسمى نفسة مصرى<br />يااخوانجى اطلع وبان وعليم الامان برضة مش حتمسكوا البلد<br />اصل مصر صعبو عليكو مين قال انى بحب حسنى مبارك لكن لو القرد ابوصديرى مهدى عاكف هوا البديل<br />يبقى اة نعم للتوريث علشان انتم يااخوانجية ياوهابيين ولاد متناكة لا لكم فى الدين ولا حاجة انتم شوية ارزقية عاوزين تمسكوا البلد فى لحظة غيبوبة<br />وتانى مرة احترم نفسك لامسح براكة امك الارض ياواطى يازبالة"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073420/http://masr.20at.com:80/article.php?sid=1236"

