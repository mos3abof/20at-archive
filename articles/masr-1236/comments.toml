[[comments]]
order = 0
subject = "تهريج"
author = "إبن بهيه"
posted = "2006-12-01"
text = "كله تهريج .. كما قال السيد المرشد العام للإخوان السلمين منذ أيام ... لم أقرأ كلمة معبرة كتلك التي قالها الرجل ... هو صحيح تهريج بس مين المهرج بقى ؟؟؟ مين اللي لابس صديري وعامل فيها قرد ؟؟؟ مين اللي لابس طرطور بزر وعامل فيها بهلوان أو طرطور أو كلاهما ، فعندنا في ظل حكم الواطي مبارك امتزج المهرج بالطرطور وما عادش يفرق معانا .. المصيبه أن السيد فاروق أبو خازوق أو فيفي زي ما بيحب يكون يعني ((لا مؤاخذه احنا مش بنعيب في حد .. هو بيحب كده نعمله إيه؟)) لما تيجي الست فيفي .. أوه سي فاروق قصدي ويتنيل على عينه ويعك العك ده وهو مرمي على كرسي الوزاره يبقى عيب وعيب جدا على مصر كلها ... هو حر في رأيه .. بس ما يكون في بيتهم مش في كرسي الوزاره .. المفروض يا سي فاروق تفهم وتعرف بأن الحكومه في أي بلد لازم تخدم الشعب كله بكل طوائفه وتحترم الشعب كله بكل طوائفه .. هنا مربط الفرس ((طبعا أنا عارف الشعب ما يهمهمش في شيء .. لكن دي الأصول يعني)) ..<br />غور خارج الوزاره وارغي يا أمور زي ما تحب .. دي نقطه .. النقطه التانيه هي أن الجميع هاج وماج وكله رمى شباكه وصنانيره وهات يا صيد في الوحله اللي وقع فيها سي فاروق ... يعني بتوع الوطني حبوا يصيدوا .. والتيارات التانيه اللي ضد الحكومه حاولت الصيد .. والتيارات اللي ضد الإخوان حاولت الصيد والتصيد على حساب الإخوان وكأن الإخوان دول مش من البلد دي .. وكأنهم عايزين الإخوان يسكتوا خالص ما يتكلموش ولا حتى يناقشوا أي شيء ؟؟؟؟!!!!! طيب ده منطق والنبي ؟؟؟ أنا والله مستغرب من ناس كتير بتدعي الوطنيه والمهلبيه وهي كده ؟! طبعاً ضاعت الحقائق بسبب التدليس وخلط الأوراق والأمور زي العاده وكله راح منزل برابيره المعفنه في الموضوع بالطريقه اللي تخليه يلزق التاني على قفاه ... حاجه<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073420/http://masr.20at.com:80/article.php?sid=1236"

[[comments]]
order = 1
subject = "قصيدة عليا الطماطم"
author = "محمد المصرى"
posted = "2006-12-01"
text = "عمنا الشاعر الكبير احمد فؤاد نجم كتب قصيدته الرائعه عليا الحرنكش<br />وارجو ان يسمح لى بقصيده متواضعه بعنوان<br />(عليا الجوافه)ردا على تصريحات وزير الشرمطه<br />عليا الطماطم.....عليا الجوافه<br />انت حتة خول ..... يا وزير الثقافه<br />لو ايدى تطولك.... حملا وشك تفافه<br />لانك ماركه وسخه....وناقص نضافه<br />يا وزير منسون...مالوش فى الجواز<br />يا كلب الست سوزى...وشلتها اللذاذ<br />وحبيبك الخروف...مبارك ابو الطياظ<br />عايزين بنات بلدنا...يعريلكوا البزاز<br />يامصر كفايه نوم....ركبوكى الخولات<br />لحد امتى نفضل....ملجمنا السكات<br />شراميط تسكن قصور ....وشعب عالفتات<br />امتى يجيلنا يوم....ننسى فيه اللى فات"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073420/http://masr.20at.com:80/article.php?sid=1236"

[[comments]]
order = 2
subject = "تعليق"
author = "الدشم"
posted = "2006-12-01"
text = "وماله الراجل عبر عن رايه ، من حقه ، حتى لو كنا مختلفين معاه ، ده اللى يمسكم البلد هتعملوا اسوا نظام استبدادى حصل فى الدنياو هنترحم على الايام دى ، و هتمشوا تدبحوا الناس فى الشوارع على اعتبار ان ده كافر و ده مش ولابد وده دمه تقيل على قلبكم ، ده حته موقع اللى تحت اديكم و مش طايقين حد يقول كلمه غير كلمتكم ولا صوت يعلو على صوتكم ، يامتعصبين يا مستبدين يا شياطين ، اذا كنتم تدعون ان هناك جهات معينه هى سبب الفساد فى البلد فانتم سبب التخلف فى البلد. بس و خلاص ( وياللا ابتدوا السباب و ردودكم السافله زيكم )<br />نعم للتوريث ولاستكمال المسيره."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073420/http://masr.20at.com:80/article.php?sid=1236"

[[comments]]
order = 3
subject = "لخبطة الوزير"
author = "استشهاد"
posted = "2006-12-01"
text = "فى رايى ان موضوع الحجاب ليس قابلا للنقاش وان كان كلام الوزير مجرد دردشة فهو يطعن فى فرض من فروض الاسلام ،فهل اعتراف الوزير بان اركان الاسلام اربعة سبب فى اللخبطة التى يشعر بها الوزير نحو التعرف على اركان الاسلام وفروضه ،يعنى اللى انا عاوزة اقوله انه الوزير لو كان ميعرفش فلابد انه يسال ،ومش عيب ابدا ان الجاهل يتعلم ،لكن العيب انه يحس انه مثقف وعارف الكفت ،انما الواضح انه لا عارف الكفت ولا الكفته حتى ."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073420/http://masr.20at.com:80/article.php?sid=1236"

[[comments]]
order = 4
subject = "هى مش ناقصه"
author = "سعيد المنصور"
posted = "2006-12-01"
text = "السلام عليكم<br />تحيه اليكم جميعا<br />حقا لم يستوقفنى الموضوع بقدر ما استوقفتنى قصيده الجوافه هذه من الاخ محمد المصرى وكأن الناس ينقصها تردى لفظى و ثقافى.<br />عجبت لهذا التناقض كيف تدافع عن الحجاب ، ضمنيا تدافع عن الاسلام ، بهذا الشكل الكريه.<br />بالله عليكم ايتفق ( خول ... طياظ ... بزاز .. شراميط......) مع الدفاع عن الاسلام ، انك لم تترك كلمه فى قاموس الكلمات .... (سمها انت ما شئت) الا و ذكرتها فى شعرك ، وفى ماذا ؟؟ فى شعر يدافع عن الاسلام<br />واما اذا قلت ان هذه الكلمات من واقع الشارع المصرى و تحدثت عن مدى انتشارهاو ... الخ.<br />اذا فشارعك هذا امامه الكثير ليتعلمه من سلوكيات الدين و الخلق قبل ان تتعلم نساؤه ارتداء الحجاب.<br />لعلك تذكر حادثه التحرش الجماعى التى حدثت منذ فتره ليست بالبعيده ، دعنى اذكرك هذه الحادثه حدثت بعد الشهر الكريم مباشره حيث قمه الروحانيات وكما لم يفرق التحرش بين المحجبه و غير المحجبه.<br />فيا اخى الحجاب جزء من الخلق و الاداب العامه التى يجب ان يتحلى بها كل مؤمن فى هذا الوطن.<br />وفى النهايه اعتذر ان كان تعليقى قد اغضبك و لكن لعلنا قد نجد نقطه اتفاق ما<br />والسلام عليكم و رحمه الله و بركاته"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073420/http://masr.20at.com:80/article.php?sid=1236"

