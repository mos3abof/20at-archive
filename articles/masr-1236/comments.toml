text = "يا خواننا تسيبوا الحمار وتمسكو فى البردعة؟؟؟؟؟ وابن الم000و الع00 والخو0<br />ونسيتو ان اول عنصر لمحاربة الحجاب فى مصر هى مدام سوزى اوف انجلاند والشرموط الحرامى صبى من الصبيان00مجرد اغا منتفع وضيع<br />حرب الحجاب ابتدت مع صفوت الشريف لما منع المحجبات من الظهور فى تلفزيونة المعفن وحاول يوهم الراى العام بان مثال المراة القويمة هما النسوان اللباوى امثال فيفى ودينا الشرموطة00<br />ماحد فتح بقة معاة ولا طلعت مظاهرات ولا نطق حد من الاخوانجية بتوع السعودية0<br />راس الفساد هناك فى قصر العروبة0<br />ولا انا غلطان0"
