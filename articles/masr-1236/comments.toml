[[comments]]
order = 9
subject = "مع الاسف"
author = "سعيد المنصور"
posted = "2006-12-01"
text = "السلام عليكم و رحمه الله و بركاته<br />بارك الله فيك اخ رموززززززز<br />و مع الاسف هذا الكلام عن الهجره بلا عوده نسمعه من كثيرين هذه الايام<br />و كما نقرا جميعا عن محاولات انتحاريه للهجره باى شكل و اى ثمن و كأنهم يهربون من الجحيم و كأن الموت اهون عليهم مما هم فيه<br />ولا اكاد ارى خريج جامعى جديد الا و يفكر بالهجره ، فاصحاب الشهادات العاليه من المسلمين يحلمون بدبى و قطر و خلافه و النصارى يحلمون بكندا و استراليا و خلافه واما اصحاب المؤهلات المتوسطه و اصحاب الحرف فكل ما يعنيهم ان تضمهم سفينه - او حتى قارب - الى اى بلد اخر ايطاليا فرنسا ليبيا والقائمه تطول."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073420/http://masr.20at.com:80/article.php?sid=1236"

[[comments]]
order = 10
subject = "حسبنا الله ونعم الوكيل"
author = "الاستاذ ك"
posted = "2006-12-02"
text = "حسبنا الله ونعم الوكيل<br />يعني مش مكفيكم بعتو البلد<br />وبقينا اغراب في بلدنا<br />وقانون الطوارئ بالبندقية في دماغنا<br />وهنموت من الجوع قريب زي النيجر<br />اتلمو شوية يا اولا د الكلب ( اللي كلنا عارفينه )<br />مش فاضل غير تقلعو المرأة في الشوارع<br />يا اخي خلي عند امك دم<br />واحد زيك ما يستنوش منه حرارة ولا دم<br />الله يخرب بيوتكم<br />حسبنا الله ونعم الوكيل"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073420/http://masr.20at.com:80/article.php?sid=1236"

