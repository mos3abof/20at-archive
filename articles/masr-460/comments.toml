[[comments]]
order = 0
subject = "نداء عاجل لكل شخص محترم فينا...تعالوا شجعةنا في عرض النيابة النهاردة"
author = "محمد السيد"
posted = "2006-06-05"
text = "اليوم عرض 200 من المقبوش عليهم في يمظاهرة القضاة يوم الخميس 11/5..<br />واللي شرفت برفقتهم ... لكن مش عارف ليه استعجلوا عليا وطلعوني ....<br />لو حد ممكن ييجي يساندهم ... متتخيلوش كان تأثيره إيه علينا منظر مئات البشر اللي كانوا واقفين خارج مبني محكمة الجلاء .... والله ده كفايه يشجعنا متين سنة قدام ...<br />بجد والله ... اللي يفدر يحضر ويتواجد .. ده له أثر محترم جدا علينا جوه ...<br />وبرضه<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143631/http://masr.20at.com:80/article.php?sid=460&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "العنوان والوقت وياريت تحضروا ومتقلقوش. مفيش اي قلق أو مضايقة أمنية"
author = "محمد السيد"
posted = "2006-06-05"
text = "صحيح ...نسيت العنوان ..<br />شارع الجلاء .. موازي لرمسيس .. هناك المكان معروف جدا .. وحتلاقوه زحمة ...<br />كمان ... العرض طول اليوم لغاية الساعة 5غالبا ... ماهم كتير ... يعني وقت ماتكونوا فاضيين تعالوا ..<br />بس بجد .. متسبوهمش لوحدهم<br />لا للتمديد... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143631/http://masr.20at.com:80/article.php?sid=460&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "خيارواحد(الجهاد)"
author = "أبو أسامة"
posted = "2006-06-06"
text = "لم يعد امام المعارضة بعد ما شاهدناه من تكبر الحكومة والحزب الوثنى حتى فى الاصغأ<br />الى مواطنين شرفأ لا يريدون لهذا الوطن سوى التقدم والأستقراروالحريةوهذه المعاملة الدنيئةالتى تلقاهاشباب المعارضة<br />سوى الضغط والتظاهر امام هذا النظام الهش الذى انغلق على نفسه ولم يعد يسمع سوى<br />صوت اعلامه الهابط وصحفه التافهة التى تصور له ان الشعب يعيش ازهى عصور الديموقراطية وانه ليس هناك بطالة ولا فساد وان السفينة الى غرقت قضأ وقدر<br />والقطر الى انحرق كان واحد جاهل بيعمل شاى واخيرا اذكركم بقول المصطفى(ص)<br />(أفضل الجهاد كلمة حق تقال عند سلطان جائر)وما اظلمه ومااكثر جوره. فأعلموا يا اخوتى انكم تجاهدون اشرف الجهاد.<br />لا................للتمديد<br />لا................للتوريث<br />لا................للجور"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143631/http://masr.20at.com:80/article.php?sid=460&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "عمر بن الخطاب"
author = "ابو شريف"
posted = "2006-06-07"
text = "رحم الله امير المؤمنين عمر بن الخطاب الذي قيل في حقه عندما كان نائما تحت الشجرة وسيفه معلق عليها<br />حكمت فعدلت فآمنت فنمت ياعمر<br />اتعلم ياللي حاكمنا بقانون الطوارئ من 25 سنة"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143631/http://masr.20at.com:80/article.php?sid=460&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "اين المعارضة اصلا؟"
author = "سعيد احمد"
posted = "2006-06-07"
text = "نتكلم عن المعارضة ومظاهراتها ولكنى لا ارى معارضة انى ارى صحف سوداء مثل عقول اصحابها.انى ارى قدرات فائقة على النقد اللاذع والغير مسئول وعند الجد يقولوا نقاطع ,توريث.انى ارى اناس يتلذذون بالاهانة امام عدسات الكاميرات باعتبارهم شهداء الحرية.انى ارى قاضيا اصبح معارضا ودخل فى صراع سياسى .انى ارى احزاب موالسة واخرى نائمة وثالثة وافتها المنية .انى ارى معارضا يفتقد البديل ويفتقد البرنامج والمصداقية .واذا قلنا له ما البديل الذى تريده لهذا النظام ؟ يقول لنا اى بديل اى حاجة اى نظام .يعنى اى حاجة؟."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143631/http://masr.20at.com:80/article.php?sid=460&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "احنا عملنا ايه"
author = "shimoo"
posted = "2006-06-07"
text = "انا بصراحه معجبه بيكو جدا وبحماسكوا بس احنا ولاد البلد ده لازم يكون لينا دور فعال غير النقد علطول يعنى قاصدى نبدا من نفسنا ونصلح اللى حوالينا عارفين تبدا منين من احنا مانرميش حاجه فى الارض نحس ان الارض ده شقتنا او ملكنا الاجازه اهه هتبدا لازم نستثمرها كويس جدا نعمل مجموعات عمل ونشتغل علشان بلدنا"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143631/http://masr.20at.com:80/article.php?sid=460&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

