subject = "يا عميل..يا"
author = "حمكشة"
posted = "2006-06-08"
text = "ربنا ينتقم منك يا ناهب خير البلد ومجوعها ومشردها,ومعطل شبابها<br />يا حرامي<br />يا فاسد<br />يا عميل<br />يا..... اسبكوا تكملوه<br />طبعا انت عارفين انا قصدي علي مين"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143631/http://masr.20at.com:80/article.php?sid=460&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
