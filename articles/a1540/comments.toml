author = "صح ايه ربنا ياخدك وبراحته ابه وراحتك ايه"
text = "يعني عشان انتي شرموطة عايزة البنات كلها تتشرمط زيك ولا ايه<br />معلش يا جماعة انا اسف خرجتني عن شعوري<br />بس ازاي ممكن يكون شرف البنت اللي المفروض يكون اغلي حاجة عندها ازاي يبقي رخيص بالشكل دة"
