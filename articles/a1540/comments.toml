text = "ومفهوش حاجة واحدة غلط واللى حصلها حصل معايا بالظبط ولكن اكتر بكتير<br />انا اتبهدلت وخسرت حاجات مش حاجة واحدة<br />لكن بحبة وسمحتلة يعملى اللى هو عايزة منى براااااحتة<br />وانا كمان براحتى قوى معاة"
