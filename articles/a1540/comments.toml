[[comments]]
order = 7
subject = "Ashraf"
author = "amer,"
text = "I KNOW I will hear about you again. You are a good person and very steadfast about what you believe. I am very proud of you, and wish you all the succes. I only hope that when it is time for fame you will not bow to pressure. We need more people like you in Egypt.<br />Thanks for suggesting directing. I am a good critic, but I don't think I would make a good director. I am more of a performer, and I do perform a lot, mostly in Europe and the US, not in Egypt. But very soon. Hope to see more of your work when i come. Disagreeing with you does not mean that I don't respect you.<br />God Bless. Ashraf"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142732/http://www.20at.com/article.php?sid=1540"

