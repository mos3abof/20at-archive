text = "وثيقة اللاشرف الإعلامية العربية - الدكتور عبد الستار قاسم<br />Thursday 14-02 -2008<br />أضاف الحكام العرب من خلال وزراء إعلامهم اعتداء جديدا على المواطن العربي بتبنيهم وثيقة إعلامية جماعية بتاريخ 12/شباط، فبراير/2008. شكرا لدولتي قطر ولبنان اللتين لم توافقا على الوثيقة. هذه وثيقة خزي وعار تُضاف إلى سجلات الزعماء والقادة العرب المليئة بالاعتداءات المستمرة والمتواصلة على حرية الإنسان العربي وكرامته وعزته ورغبته في النهوض من بين ركام التخلف والهوان الذي يراكمه هؤلاء الحكام فوق ظهره.<br />وزراء الإعلام العرب يقرون وثيقة يقولون فيها بأنهم سيقفون ضد ما من شأنه أن يمس كرامة المواطن العربي على الفضائيات العربية، وكأن هؤلاء الأباليس الطغاة قد تركوا للمواطن العربي كرامة يمكن أن يُحافَظ عليها. بهذه النقطة بالتحديد، يبدو أن لدى الحكام العرب شكا بأن بعض الكرامة قد بقيت للمواطن العربي فقرروا استباق الحدث وإحكام إغلاق أي منفذ يمكن أن تتسرب منه كرامة.<br />ويقول الوزراء في وثيقتهم إنهم يقفون ضد التحريض على الكراهية والذي تبثه بعض الفضائيات العربية. عن أي كراهية يتحدثون؟ الحكام العرب هم الذين يبثون الكراهية بين الناس والشعوب العربية من خلال أجهزة مخابراتهم ووسائل إعلامهم الرسمية. أجهزة إعلام الحكام لا تنفك تكيل المديح والثناء للحكام، وتبث الأغاني والأهازيج التي تمجد أعمالهم وإنجازاتهم التي أودت بالأمة إلى الهزائم والهلاك. ووسائل إعلامهم هي التي تضلل الجماهير وتكذب على الناس وتصنع الأوهام وتصنع الأساطير الخيالية. إنها أجهزة تجعل من المواطن العربية كارها لنفسه وليس كارها للآخرين فقط.<br />من الذي جعل الفلسطيني يكره الأردني، والأردني يكره الفلسطيني، والمغربي يكره الجزائري والليبي التونسي، واليمني العربي في الجزيرة، واللبناني السوري، والعراقي الكويتي، والعربي العربي، والعربي نفسه؟ ألستم أنتم أيها الحكام من خلال مخابراتكم ومؤامراتكم وملاحقاتكم للمواطنين وتعبئتكم الحاقدة لشعوبكم ضد الشعوب العربية الأخرى؟<br />وزراء الخارجية العرب يريدون منع استعمال الفضائيات العربية من التحريض على الإرهاب. أي يريدون من الفضائيات التوقف عن التضامن مع المقاومة العراقية والفلسطينية واللبنانية والصومالية، ومقاومة التنظيمات الإسلامية لأمريكا وإسرائيل والمخططات الغربية ضد المنطقة؛ ويريدون من هذه الفضائيات التوقف عن استضافة من يؤازرون المجاهدين والمناضلين المصرّين على حرية الأمة وكبريائها.<br />الحكام العرب هم الإرهابيون الذين يلاحقون المواطنين في كل ركن وزاوية ويستعملون ضدهم كافة أساليب التنكيل والتعذيب والحرمان من الحياة الكريمة. الحكام العرب هم الذين ينهبون أموال الأمة ويبذرونها في الملاهي وعلى طاولات القمار وفي مخادع الساقطات. هؤلاء الحكام لا يملكون حقا في اتهام أحد بالإرهاب لأنهم رأس الأفعى القاتلة التي تنفث السم الزعاف في جسد الأمة وتطوحها ملقاة ينهش منها كل البغاة الطامعين.<br />وزراء العرب يريدون منع القنوات الفضائية من بث انتقادات للحكام أو الإساءة للرموز. هؤلاء المأجورون الذين لا يغار الواحد منهم على ذمة أو عرض يريدون إبقاء أرباب شهواتهم فوق النقد وفوق المس وكأنهم ملائكة خلّص أنعم الله بهم على أمة العرب. ويريدون منا أيضا أن نتوقف عن انتقاد رجال دين السلطان الذين فقدوا ضميرهم الديني وطوعوا معارفهم الدينية لخدمة من يهدم الأمة ويسلمها لأعدائها.<br />المضحك أن وزراء العرب يريدون الهجوم على الفضائيات التي تتعامل مع الإباحية. من أقام هذه الفضائيات يا حضرات الوزراء؟ ألم يقم حكامكم وأمراؤكم على إطلاق هذه الفضائيات الساقطة من أجل إلهاء المواطن العربي وإسقاطه في بحر الشهوانية والتمنيات بالحصول على المتع؟ ألم تشرف مخابرات دولكم على برامج تعهير المواطن العربي؟<br />حكام العرب لا يتفقون إلا على خزي أو هزيمة أو خنوع أو ذلة. هم لا يتفقون على ثأر أو كرامة أو فعل خير. إنهم يتفقون على الاعتراف بإسرائيل، وعلى ملاحقة بن لادن، والتآمر على المقاومة اللبنانية، وعلى ضرب المقاومة العراقية وعلى خدمة أمريكا وإسرائيل، وعلى ملاحقة المواطن، والتعاون الأمني بين وزارات الداخلية، وقمع الرأي في وسائل الإعلام، وأساليب التعذيب في المعتقلات وقطع سبل الرزق عن المواطنين المعارضين.<br />حكام العرب لا يتفقون على إطلاق حرية الرأي التي تعني كرامة الإنسان، ولا يتوقفون عن نهب الثروات العربية. وهم لا يتفقون على برنامج للوحدة، أو برنامج للدفاع المشترك، أو برنامج اقتصادي يطبقونه من أجل المحافظة على الأموال العربية. لا أريد أن أسترسل في هذا لأن المواطن العربي يستطيع أن يعدد الكثير من القضايا الهامة التي يتجاهلها الحكام العرب.<br />وثيقة الإعلام العربية هذه لا تصدر إلا عن جبناء يخشون الكلمة والرأي الحر. لو كان الحكام العرب رجالا لما لاحقوا الرأي ولما منعوا الكلمة ولما سجنوا الأحرار. الجبان هو الذي يخشى الكلمة ويخشى المواجهة المنطقية عبر وسائل الإعلام. أنتم يا حكام العرب عبارة عن أشباه رجال لا تسخن فيكم دماء ولا تهتز أبدانكم لمهانة. أنتم تعشقون الذل والعار، وتأبى نفوسكم أن تفارق الهزيمة، وتأبى ظهوركم أن يترجل عنها بنو صهيون والأمريكان.<br />مطلوب من المثقفين الأحرار ألا يقفوا صامتين أو مهادنين أمام هذه الوثيقة. مطلوب من كل عربي حر رافع الرأس أن يتصدى لهذه الوثيقة بدون خجل أو وجل، وأن يحرض على إسقاطها وإسقاط من صاغوها ومن أمروا بصياغتها. هذه أمة يجب أن يعلو شأنها، ولا يعلو شانها إلا بسواعد مفكريها ومثقفيها وثوارها الذين لا يرون في الذل حياة."
