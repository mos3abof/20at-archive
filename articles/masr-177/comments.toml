[[comments]]
order = 9
subject = "غشى البصر وجحد القلب"
author = "احمد السيد"
posted = "2006-07-30"
text = "لقد قال فضيلة الشيخ محمد متولى الشعراوى لاحكم فى ملك الله إلا بمراد الله لذلك أرجوا كل من يصول بخاطرة إهانة الرمز أن يعلم ان هذا الفعل يدل على غشيان البصر وجحود القلب فلينظر هؤلاء ألى المبانى والمستشفيات وغيرها وإن الفساد موجود فى كل مكان وإن كنت تحب مصر فساعدنا ويدك بيدنا واطرح الحلول ولاتكن كمن ظل يدعوا الله ان يسلط سيف الغضب والنقمة على رقاب اعداءه وفى منامه شاهد سيفاً بطاراً سيقطع رقبته فقام مسرعا وسأل أهل العلم فقالوا له إن الله سيستجيب دعوتك ويقطع رقاب أعدائك وسيبدء بك لأنك أكبر عدو لنفسك وإذا كنت تريد النقد البناء فعليك بإيجاد الحل اولاً ثم ابدء بنفسك لأنى ومن خلال تجربة علمت أن مصر اعظم دولة فى قوانينها لكن ينقصها تفعيل فعلى لكن ، تنتقد وتشرع وتتفلسف وإن كنت مثلا تركب اتوبيس تقترب من السائق وتطلب منه فتح الباب لتنزل فى الأشارة وإن لم يستجب لك إنهلت عليه سباباً إما علنية اوفى سرك فهل هذا سلوك ، احبوا مصر واعملوا من اجلها ودعكم من حجتكم المعلقة على رئيس الدولة حتى تقوم لكم دولة . هناك مثال اخر عندما يكون الأب شديد على نجله يخرج الأبن ساخطاً على الأب ويسبه وسط زملائه طبعا سراً وعندما يمرض الأب يبكى الأبن على مرض أبيه أعملوا من أجل مصر أبناء مصر ومن يريد أن يعرف الرئيس مبارك عن قرب فليراسلنى سلام من مصر ارض السلام"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903021046/http://masr.20at.com:80/article.php?sid=177&PHPSESSID=6b136c31bab57f78dfd36a9a15b33a57"
