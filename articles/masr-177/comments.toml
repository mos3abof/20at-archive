[[comments]]
order = 4
subject = "ديمقراطية النباح"
author = "مصرية"
posted = "2006-04-22"
text = "البرتوكول رقم19لحكماءصهيون فيه ان ثورة الشعب علي حكومة تم اعدادها جيدا كنباح الكلاب على الافيال تستمرفى النباح حتى تنهار قواها ثم تدرك انه لايمكنهاان ترهب الفيل وتستسلم لة هذة ديمقراطيتنا.واذا قال الفيل طظ فينا يبقى معاه الف حق اللى خلينا الفيل بتاعنابارك على انفاسنا طوال هذا الدهر ليس لها من دونك كاشفة يا الله اللهم اكشف عنا هذة الغمة وعن امة المستلمين اجمعين يا رب العالمين"
archived = "2006-05-19"
capture_url = "https://web.archive.org/web/20060519090223/http://masr.20at.com:80/article.php?sid=177"

[[comments]]
order = 5
subject = "مش عارفة"
author = "sara"
posted = "2006-04-25"
text = "انا مش عارفة كل واحد بيقول كلمة شكل بس اللى انا اعر فه على رأى سعد زغلول انى ما فيش فايدة اللى يقولك انى البلد دى هتتصلح يبقى بيضحك عليك لا ننا عايزين 100 سنة علشان البلد تتصلح ما دام فى جزء من الشباب ضايع ومش عارف هو رايح فين ومدام ورانا هيفاء وهبى ونانسى وروبى ودانا ومارياوالبطالةوالتعليم لان التعليم عندنا فى مصر يفرح"
archived = "2006-05-19"
capture_url = "https://web.archive.org/web/20060519090223/http://masr.20at.com:80/article.php?sid=177"

