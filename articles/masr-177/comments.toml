[[comments]]
order = 1
subject = "لم يملك الشرعية لوجوده بيقى يتكلم"
author = "يمنى"
posted = "2006-04-20"
text = "الرئيس حسنى مبارك رئيس غير شرعى لمصر لأن قدومه للحكم لم يأتى عن طريق إنتخابات ولأنه يزور الإنتخابات طوال 25 سنة ولأنه لم يعين نائب لما فهو رئيس متسلل للحكم ولا بد من عقابه على أى تصريح يقوله وأى برنامج يظهر فيه لأنه ليس له حق الإدلاء بإسم مصر فى أى شيء فهو ليس أكثر من نصاب متسلل للحكم بإسم مصر وكل الذى يقوله يعبر عن بيئته المنحدة نظراً لظروفه الإجتماعي منذ التنشئة لأن ولده كان حاجب محكمة ولم يحسن تربيته التربية التى تليق أن يخاطب بها أسياده من أبناء الشعب الناهب لكل ثرواتهم هو وإبنه وزوجته فما يقول هى تخاريف رجل فى الثمانين مجنون بجنون العظمة والزهايمر وكل أمراض الشيخوخة وسيخلصنا الله منه قريباً بإذن الله العلى الكريم"
archived = "2006-05-19"
capture_url = "https://web.archive.org/web/20060519090223/http://masr.20at.com:80/article.php?sid=177"

