subject = "معلومة اخرى"
author = "بيقولوا معمارجية"
posted = "2006-06-12"
text = "توضيح ..ان الدراسات اللى اتعملت كلها كان عاملها طلبة كلية الهندسة- جامعه القاهرة و منها طلع افكار ترميمه و كانوا بيشتغلوا بأيديهم و اياميها انا شفتهم فى هدة برامج و فى البيت نفسه و هما بيشتعلوا بايديهم فى الترميمات الفنية بالذات"
