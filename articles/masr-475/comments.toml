[[comments]]
order = 1
subject = "خدمه لو سمحتم"
author = "سيروووو"
posted = "2006-06-25"
text = "شكرا جزيلا على المعلومات والصور ، واسفه لو تعبتكم وطلبت خدمه كمان ازاي ممكن احصل على الرسم المعماري للبيت السحيمي (المسقط الافقي والواجهات والقطاعات) لاني بحاجه لتلك المعلومات لدراستي في قسم الهندسه المعماريه جامعه عين شمس"
archived = "2006-06-26"
