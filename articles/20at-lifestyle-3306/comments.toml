text = "انا عن نفسي شايفه انها كتبت الحلقة الاخيره لوجود رودو سخيفه في الحلقات اللى قبل كده وانا معتقدش ان هو دا رد فعل زوج كان بيظهر في الحلقات بشكل ممل وبعدين لما هو متابع الحلقات قاعد حلقة بحلقه يتابع ويستفز وجاى في الحلقة الاخيره اصلو كان عارف انها الاخيره ويبقي دا رد الفعل<br />معتقدش ان دى نهاية"
