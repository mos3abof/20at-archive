posted = "2007-03-22"
text = "أدعي بعد كل صلاة 3 مرات بالدعاء التالي \" اللهم اصلح بيني وبين زوجي وألّف بين قلوبنا\"، طبعا اولا صلي على النبي عليه الصلاة والسلام.<br />وسترين فرق خلال اقل من شهرين، لكن إياكي بعد ذلك من التوقف عن الدعاء، ولكن يمكنك بعدها ان تجعلي الدعاء مرتين صباحا ومساء بدل 5 مرات في اليوم."
archived = "2009-11-22"
