author = "http://www.islamadvice.com/nas"
posted = "2008-09-10"
text = "نائع المعروف تقي مصارع السوء<br />\"لا يذهب الفضل بين الله والناس\"<br />من توفيق الله عز وجل لرسوله قبل البعثة، زواجه من خديجة رضي الله عنها، وذلك لرجاحة عقلها، وحسن خلقها، وكمال تدبيرها، وقد ظهر ذلك جلياً عندما رجع إليها رسول الله صلى الله عليه وسلم من غار حراء عندما بدئ بالوحي: \"ترجف بوادره، حتى دخل على خديجة فقال: زملوني زملوني؛ فزملوه حتى ذهب عنه الروع.. فأخبرها الخبر، قال: وقد خشيتُ عليَّ، فقالت: لا، أبشر، فوالله لا يخزيك الله أبداً، إنك لتصل الرَّحم، وتصدق الحديث، وتحمل الكَلَّ1، وتقري الضيف، وتعين على نوائب الحق\".2<br />لقد استدلت خديجة رضي الله عنها بأن الله لن يخزيه بهذه الأعمال الجليلة التي عرفت عنه قبل بعثته صلى الله عليه وسلم، وهي:<br />1. صلته للرحم.<br />2. صدقه في القول، حتى كان يلقب في الجاهلية بالصادق الأمين.<br />3. إحسانه وإنفاقه على الفقراء، والأيتام، والأرامل.<br />4. اقراؤه الضيف وإكرامه له.<br />5. إعانته لمن أصابتهم جائحة أوحلت بهم مصيبة.<br />لقد جمعت هذه الصفات أمهات صنائع المعروف، ولم ترد خديجة رضي الله عنها أن تصفه بكل ما كان يتصف به من تلك الصفات، ولكنها أشارت إلى أهمها، ولا شك أن هناك صفات كثيرة غيرها، كان متحلياً بها صلى الله عليه وسلم.<br />قال الإمام النووي: (قال العلماء: معنى كلام خديجة رضي الله عنها: أنك لا يصيبك مكروه لما جعل الله فيك من مكارم الأخلاق وكرم الشمائل، وذكرت ضروباً من ذلك، وفي هذا دلالة على أن مكارم الأخلاق وخصال الخير سبب للسلامة من مصارع السوء).<br />بجانب ما ذكرت خديجة فمن صنائع المعروف التي تقي مصارع السوء ما يأتي:<br />1. الشفاعة الحسنة.<br />2. الحلم، والعفو، وكظم الغيظ عن الجاهلين.<br />3. تعليم الناس وإرشادهم.<br />4. القيام بالخدمات العامة التي يحتاجها الناس في أمور دينهم ودنياهم.<br />5. إنظار المعسرين، وقضاء الدين عن المدينين.<br />6. التنفيس عن المكروبين.<br />7. الأمر بالمعروف والنهي عن المنكر.<br />فمن أراد أن يقيه الله مصارع السوء فعليه القيام ببعض هذه الأعمال، فكل ميسر لما خلق له، ومن وفقه الله للقيام بها كلها أوجلها فذلك فضل الله يؤتيه من يشاء.<br />يزداد ثواب وفضل أعمال الخير بفضل الزمان والمكان، وليس هناك زمان أفضل من رمضان، ولا عمل أزكى من الصيام، فمن زاد فالله أزيد وأكرم."
