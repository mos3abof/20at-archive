text = "احنا لو فكرنا كده وبالشكل ده مش هنعرف نعيش لازم نتقي ربنا في كل حاجه واكيد هيبقي معانا ديما في اى وقت والمفروض نفكر في الله سبحانه وتعالي ديما عشان هو يفتكرنا وبعدين الموت ده بايد ربنا ومحدش عارف هيموت ازاى وامته وبعدين اول لما تفكر في كده حاول تنسي ده وتفتكر ربنا وتدعي وتقول يارب وهو اكيد مش هيسيبك ان شاء الله"
