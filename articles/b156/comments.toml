[[comments]]
order = 7
subject = "كفى كفى ياصهيون"
author = "ريم بنت السعودية"
posted = "2006-07-11"
text = "انا لله وانا اليه راجعون كفى كفى ياصهيون احتلو فلسطين ويريدون ان يحتلو النلس بافكارهم مابقي الا زمزم حتى تقولو عنه الاكاذيب والاقاويل فزمزم طعام طعم وشفاء سقم فهو يشفي من الامراض باذن الله وينقي الجسم من السموم ومن يقول غير هذا فنحن لا نجبره على زمزم تلك العين المباركة والعجيب انها تضخ مياه اكثر حينما يؤخذ منها بكثرة ويامسلمون كفاكم تصديق الخزعبلات والمشي وراء اقاويل اليهود فهم يحسدونكم ويفرقون بينكم وضاقت بكم ياعشرينات ان تجدو مشروب سام الا زمزم اينكم من الخمور وووووووو فالله المستعان على ماتصفون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124123/http://www.20at.com/article2.php?sid=156"

[[comments]]
order = 8
subject = "اين الغرابة"
author = "عالم"
posted = "2006-07-27"
text = "ومن قال ان ماء زمزم أصلا غير ملوث ؟ هل اجريت عليه فحوصات مخبرية موثوقة مؤخرا ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124123/http://www.20at.com/article2.php?sid=156"
