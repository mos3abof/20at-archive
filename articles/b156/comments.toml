subject = "لا حول ولا قوه الا بالله"
author = "صمود"
posted = "2006-01-01"
text = "ناس ما عندها لا ذمه ولا ضمير حسبنا الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124123/http://www.20at.com/article2.php?sid=156"

