[[comments]]
order = 0
subject = "ليس بعد"
author = "حسناء"
posted = "2005-12-27"
text = "السلام عليكم ورحمة الله تعالي وبركاته<br />نحن ناسف للحالة التي وصل اليها المسلمين<br />وباستغلالهم للماء الدي كرم الله واستغلال شوق وحب الناس لشرب ماء زمزم<br />فمادا عساني ان اقول غير حسبي الله ونعم الوكيل وربينا يهدي الجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124123/http://www.20at.com/article2.php?sid=156"

[[comments]]
order = 1
subject = "ماء زمزم لما شرب له"
author = "؛سن وأشرف وخالد مشعل"
posted = "2005-12-28"
text = "إنا لله وإنا اليه راجعون. هكذا حدث الرسول عليه السلام( سوف تتداعى عليكم الأمم كما تتداعى الأكلة إلى قصعتها. حسبنا الله ونعم الوكيل."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124123/http://www.20at.com/article2.php?sid=156"

[[comments]]
order = 2
subject = "ماء زمزم"
author = "حسن"
posted = "2005-12-28"
text = "هذا غش وخداع وعلى المسلمين الذين يعيشون مع هؤلاء الكفرة أن يأخذوا الحذر من مثل هذه التروجيات الباطلة فالمسلم كيس فطن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124123/http://www.20at.com/article2.php?sid=156"

[[comments]]
