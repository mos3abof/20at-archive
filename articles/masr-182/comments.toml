subject = "باكستان"
author = "ياء"
posted = "2006-04-18"
text = "بعيدا عن كل شى ومن المسؤول ومن المجنى عليه ومن ومن ومن<br />اتذكر مؤسس باكستان عندما قال عن الهند الدوله التى انفصل عنهاانه قال انه سيظل يذبح البقره والهنود يعبدونها<br />وان الابطال الباكستانين فى نظره اعداء للهنود وان انتصارات الباكستانين هى انهزامات للهنود<br />مشكله مصر مش مسلم ومسيحى<br />مشكله مصر حريه وعبوديه<br />yehia2784@hotmail.com"
