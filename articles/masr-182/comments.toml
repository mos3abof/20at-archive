[[comments]]
order = 13
subject = "مصر للمصريين"
author = "حماده المصرى"
posted = "2006-06-25"
text = "اذا سمحتولى و بعد اذنكم انا عندى امنيه ،ولكن تحقيقها لن يكون الا بيد الله ثم كل مصرى عايش فى البلد دى البلد اللى خيرها على كل الناس ..مصرى وعربى و اجنبى و مسلم و مسيحى و حتى اليهودى اللى عاش هنا و مات هنا و هو بيحب تراب البلد دى احنا لازم اولا نحافظ على البلد و مش معقول نستعين بجهود اجنبيه من اجل كل شىء كبير او صغير عشان قال الخبره و ماعرفش ايه و الكلام الفاضى ، يا جدعان داحنا المصريين اللى اجدادنا بدأوا الحضاره و قدمو كل الخبرات للعالم كلهو مازالت اسرار اجدادنا مجال للبحث و لم يتم اكتشافها حتى الان مع وجودالتقدم التكنولوجى و مع العلم بأن العرب حتى الان لا يستغنوا عن علم و خبرة المصريين فى معظم المجالات و عندى ادله و امثله كتير و لكن مع الاسف دائما ما نستنجد بالاجانب كى يقوموا بالترتيب و التنظيم و حتى الزباله اللى احنا بنرميها جبناهم علشان يشيلوهالنا و مع ذلك الناس زهقوا مننا لانهم ماقدروش حتى على انهم يلموا الزباله....<br />اتمنى اننا نلم الزباله بتاعتنا بأيدينا و طبعا فيه ناس كتير هيفهموا معنى كلامى..وشكرا"
archived = "2006-09-16"
capture_url = "https://web.archive.org/web/20060916122810/http://masr.20at.com:80/article.php?sid=182&PHPSESSID=93461b3b6a22c3783b54ac41eeaf755f"

