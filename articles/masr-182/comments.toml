[[comments]]
order = 0
subject = "كلمتين وبس"
author = "محمد الشرقاوى"
posted = "2006-04-17"
text = "المسلم مسلم قبل كل شئ ..<br />المسيحى مسيحى برغم كل شئ ..<br />وتاهت مصر بين الاسلام والمسيحية ..<br />فى اعتصام الصحفيين لواء داخلية كان مقرب مننا وبيتكلم وسألنى انت ايه رأيك فى الموضوع ولانى قلت كلام فى مجمله مش عجبه سألنى يا اخى احنا كلنا مسلمين رديت: انا بقى مصرى ..<br />الزمة كما طرحها دكتور شريف يونس \" أزمة هوية."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213230/http://masr.20at.com:80/article.php?sid=182&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "الحكومة"
author = "عابر القارات"
posted = "2006-04-17"
text = "يا أخوانا أرجوا أن نقف وقفة تأمل و تفكير بسيط و لكن منطقى فهل فكر أحدكم من هو الفاعل الحقيقى!! لا أقصد المختل أو من قيل عليه مختل لكن دائما فى البحث الجنائى هناك مبدأ هو أذا أردت أن تجد الجانى فعليك البحث عن المستفيد بالجريمة .... و ببساطة أقول أن المستفيد ليس أمريكا و أرجوزاتها أقباط المهجر لكن المستفيد هو حكومتنا الرشيدة و الذى سوف تستفيدة هو إلهاء الشعب عن حاله المر و بالتالى تبيع شركاته فى جنح الظلام و تحاكم حماة الحق من القضاه الشرفاء و تمرر تقرير العبارة بسلام و ... و ..... و .... و ... و تنتهج الحكومة بذلك أسلوب قديم جدا فى السرقة و هو أسلوب المغافلة و قد أستخدمه النشالين منذ قديم الازل بأن يفتعل أحد النشالين شجارا مع الضحية و يسرقه الأخر بكل هدوء و سلاسة فقد إفتعلت الحكومة هذه الواقعة و قبلها ألهت الشعب بكأس أفريقيا و قبلها واقعة المسرحية التى تم تصويرها فى أحد الكنائس و قبلها و قبلها ..... و للاسف حكومة طلعت سوابق و مسجلين خطيرين"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213230/http://masr.20at.com:80/article.php?sid=182&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

