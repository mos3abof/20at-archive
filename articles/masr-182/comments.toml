posted = "2006-10-26"
text = "انا اوافق الرأى بتاعك يا اخ حمادة بس الموضوع ده كبير اوى ولا انا ولا انت نقدر نعمل فيه شئ كل اللى نقدر عليه اننا نشجب ونستنكر وندين العدوان اللى احنا صنعناه بايدينا نعمل ايه فى وسط البيروقراطية اسف قصدى الديموقراطية والسلام ختام لكل من صام وقام وصلى الفجر والناس نيام واتبع سنة خير الانام عبد الذى لا ينام الواحد اللذى له الدوام"
