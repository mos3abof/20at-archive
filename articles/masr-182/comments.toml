[[comments]]
order = 12
subject = "الخ الفاضل اسامه المصرى المسيحى"
author = "يوسف المصرى"
posted = "2006-06-05"
text = "خاص للاستاذ اسامه الحمد لله على نعمه الاسلام وكفى بها نعمه اما بالنسبه لملكوت ابيكم احنا مش عايزين ندخله احنا ان شاء الله عايزين جنه الواحد الاحد ربك ورب سيدنا عيسى الذى لم يلد ولم يولد"
archived = "2006-09-16"
