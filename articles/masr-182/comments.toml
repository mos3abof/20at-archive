text = "يا جماعه طيب منراضيهم في اي حتة غير الكنيسه<br />وبعدين صلاه واحده لرب واحد ازاي؟<br />مش هما بيعبدوا(يسوع ملك الملوك ورب الارباب) رب واحد ازاي بس<br />وبعدين الشيخ قال مينفعش نصلي في الكنيسه<br />منراضيهم في اي حتة غير الكنيسه<br />ليكن مثلا في الميريلاند ههههههه"
