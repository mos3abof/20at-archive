[[comments]]
order = 5
subject = "لا يجوز"
author = "مصرية"
posted = "2006-04-22"
text = "لا يجوز لمسلم أن يؤدى صلاته فى كنيسة لا يؤمن من فيها بوجود الله أصلاً فكيف نؤدى عبادتنا فيها بالإضافة إن الموضوع مش صلى للترضية الموضوع أطماع ليهم ينتهزون الظروف لتحقيق المزيد منها ولن تنتهى أطماعهم ولن تنتهى طموحاتهم، ولا يجوز أن يكونوا مدللين بهذا الشكل ليحصلوا على كل طلباتهم التى ربما حرم من كثير منها المسلمين، لا بد أن يعامل الأقباط فى مصر على أنهم أقلية عادية وليست أقلية مميزة كما هو وضعهم الآن فى مصر، فلينظروا لكل الأقليات فى العالم كيف تعامل، ولينظروا لوضهم المميز فهم يعاملوا أحسن من المسلمين فلما كل هذا التدليل الذى يثير حفيظة المسلمين أحياناً."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213230/http://masr.20at.com:80/article.php?sid=182&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 6
subject = "فعلا يا أخت مصرية"
author = "محمود كاوتش"
posted = "2006-04-22"
text = "فعلا يا أخت مصرية إزاى و بأى منطق نروح نصلى معاهم طيب إحناهنتوضأ علشان يصلى طيب هما هيعملوا إيه إذا كان الواحد منهم مش بيستبرأ من بوله بعد ما بيتبول و بلاش دى أنا هأقرأ سورة فيها تأكيد على رسالة المسيح عليه السلام ألاقى اللى جانبى بيثلث و بيقول المسيح إبن الله !! بلاش دى و لا دى إزاى اذكر مثلا رسول الله صلى الله عليه و سلم فى التشهد و اللى جانبى مش معترف أصلا بنبوبة محمد و لا برسالته و بيقولوا على الاسلام إنه إحتلال لمصر!! يا جماعة مش عاوزين الجلاله تاخدنا و نعك و نزود الطين بله الموضوع أكبر من الصلاه مع بعض الاول لازم نحب بعض و كل واحد يروح يصلى عند بيته"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213230/http://masr.20at.com:80/article.php?sid=182&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 7
subject = "خلونى ارد"
author = "احمد مصرى"
posted = "2006-04-23"
text = "السلام عليكم) فى الاول وبعدين انتم بتتكلمم فى ايه بالظبت فى المشكله الى احنا فيها ولا فى السخريه من بعضنايامحمود انت ومن توقع باءسم مسلمه فى اى شىء تتكلمون انتم تعمون حقا ما تقولن للعلم انا مصرى مسلم مصرى مسلم لم ادافع عن الاسلام ولا عن المسيحيه انا ادافع عن الحق الذى سايدوم المحبه بين هذا الشعب اما الديانات فالها رب هوه اقدر القادرين على الحفاظ عليها انا او انتى او هوه غير قادرين على الحفاظ على دينانا مدمنا بعيدن عن الله عز وجل الكل فى الاول يعبد ربه ويحافظ على دينه كما قالت لنا رسولنا وبعد ذالك نتكلم صدقونى لما نعمل كيده لما ان اعمل زاى سيدنا محمد (ص) قال ولما جرجس يعمل زاى ماسيدنا عيسى عليه السلام) ماقال يبقى مش هانختلف فى شىء انما تعالى اما نشوف الى عملوم مظاهرات وقالو فى اتهاض للمسيحيه وفى وفى وفى ارهان ان اكترهم لم يعرفو حتى طريق الكنيسه ومن قال نحن ندافع عن الاسلام لم يعرفو حتى طريق المساجد او قرئو حتى صورة فى القرءان الكريم لاكن كل ما يفعلونه هو ارداء لى انفسهم هم ولم يخدوم حتى دينهم الذى يتكلمون عنه اما بالنسبه للصلاه فى الكنيسه فهوه يجوز على حد علمى لاكن المشكله فى شىء ان سيدنا عمر ابن الخطاب رضى الله عنه )عندما دخل الكنيسه ليطمئن على من فيها واتى موعد الصلى فاتر للذهاب الى الصلى فاطلب منه المسيحين اقامة الصلاه فى الكنيسه فارفد فاتعجبو وقالو لما اهيه محرمه عليكم فى دينكم فقال لا لا ولاكنى اخاف ان المسلمين يتخذها مسجدا من بعدى وهذا الرد كافى ام بال نسبه لانها تكون صلاه واحده فاكيف وان صلات الاسلام تختلف تماما مع صلات المسيحيه صلات الاسلام سجود ورقوع وقرئت قرءان ام المسيحيه فاكل ما اعلمه عنها انها ليست مثلها فاكيف؟نعم هم يعبدون رب العباد ويؤمنون به كما<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213230/http://masr.20at.com:80/article.php?sid=182&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 8
subject = "عايز اصلى فى جامع"
author = "مصرى مسيحى"
posted = "2006-05-01"
text = "انا مصرى و مسيحى و عايز اتعلم كيف اصلى زى اخوتى المسلمين فى جامع و انا متأكد ان الله مش هايرمينى فى النار علشان صليت زى المسلمين فى الجامع زى ما انا متأكد الله مش هايرمى مسلم فى النار علشان صلى فى كنيسة."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213230/http://masr.20at.com:80/article.php?sid=182&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 9
subject = "مافيش مشكله نصلى فى كنيسه ان شاء الله"
author = "حسام-مصر"
posted = "2006-05-05"
text = "سيدنا عمر حين فتحت باب المقدس كان هايصلى فى الكنيسه لولا انه خاف ان المسلمين يقتدوا به ويجوروا على الكنيسه اى انه خشى ان يطغى المسلمين على المسيحيين فى كنيستهم فصلى خارجها. يا سيدى مافيش مشكله خالص بس قبل ما نصلى مع بعض نتحاور ونشوف ايه المشكله لحد مانحلها وناسيبش حاجه معلقه فى النفوس تقوم اى حاجه صغيره تولعها تانى"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213230/http://masr.20at.com:80/article.php?sid=182&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 10
subject = "الوطن"
author = "مصرية"
posted = "2006-05-08"
text = "الموضوع اكبر من الصلاة فى كنيسة او جامع هذا مخطط صهيونى اميركى لتحويل مصر الى ساحة صراعات طائفية مثل العراق ولبنان والسودان وفلسطين بصرف النظر عن اسباب هذا الصراع المهم ان يوجد وللصدف او ربما لم تكن صدفه اصاب ذلك هوى الامبراطر الحكام ومع سيناريو احداث دهب هن يطلب بكل صفاقه وبجاحه تمديد قانون الطوارىء لعبه مكشووووفه واضافه جديده لما يرتكب فى حق الشعب المصرى من رئيس وجوده اصلا غير شرعى"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213230/http://masr.20at.com:80/article.php?sid=182&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

