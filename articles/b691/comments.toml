[[comments]]
order = 24
subject = "ان أهلها فى رباط فى رباط الى يوم الدين"
author = "مناضل أنترنتى قديم"
posted = "2006-04-15"
text = "السلام عليكم و رحمة الله و بركاته<br />لن أتحدث عن الوثيقه لاننى لست اهل علم او فتوى ولكن معلومات البسيطه من الدين و الفطره ترفضهاولكن ........<br />هنا اتوقف كثيرا و ارجو ان يتفهم الجميع كلامى جيدا لاننى رأيت تعليقا كثيره متزنه و متعقله لن اتوقف عندها لأنها لا تحتاج إلى تعلق فهى شرحت نفسها بل سوف اتوقف عند هواة الصيد فى الماء العكر و أترك اقباط مصر يدور عليهم<br />خبرونى بالله عليكم ايها الأقباط فى بر مصر حينما أتى عمرو بن العاص وصحاية رسولنا الكريم صلى الله عليه و على اله و صحبه و سلم إلى مصر<br />هل هدموا لكم كنيسه<br />هل أحرقوا لكم صومعه<br />هل أجبروا أحد منكم على دخول الاسلام<br />و حينما دخل أمير المؤمنين عمر بن الخطاب إلى القدس فاتحا ألم يصلى على أبواب كنيسة القيامه حينما جاء وقت الصلاه و رفض أن يصلى داخلها خشيه أن يتخذها الناس من بعده سنه أو حق مشروع على الرغم من ان بطريرك الكنيسه هو الذى دعاه ان يصلى داخلها<br />الم ياتى جيش المسلمين ليخلصكم من بطش الرومان و عصور الشهداء فى كتب تاريخكم القبطى عامره بأضطهاد الرومان لكم<br />ألم يامر أمير المؤمنين بجلد بن عمرو بن العاص و الذى أغتصب ارض قبطى مصرى وقال مقولته الخالده متى أستعبدتم الناس وقد ولدتهم امهاتهم احرارا<br />قولوا لى بالله عليكم و رهبانكم يدرسون قراننا و يعرفونه جيدا أفى قراننا ايه واحده او اى اشاره غلى أيذاء غير المسلمين إلا من بغى<br />قولوا لى الستم انتم الذين عرضتم مسرحيه و انا شاهدتها بام عينى تسىء إلى المسلمين و قرانهم و نبيهم<br />يا ساده ان ديننا العظيم يدعونا للتعايش مع الأخر وينبذ العنف دائما<br />لا تتركوا فرصه لامريكا و هواة الصيد فى الماء العكر ليتدخلوا فى شئوننا و لنا فى عراقنا عبره و عظه<br />يا ساده ليس كل المسلمين ارهابيين نحن دين رحمه و سلام وتحيتنا هى السلام عليكم ورحمة الله و بركاته<br />و لقد قال نبينا صلى الله عليه و على اله و صحبه و سلم عن شعب مصر انهم فى رباط إلى يوم الدين<br />افا نسيتم ماضينا القريب فى ثورة 1919 و كيف كان شيوخ الأزهر و علمائه يخطبون فى الكنائس و قساوسة الكنيسه يخطبون فى المساجد<br />إلى كل مسلم غيور على دينه انقل صوره جيد ه عن التسامح فى ديننا و قل لى بالله عليك هل سمعت ان رسول الله صلى الله عليه و على اله و صحبه وسلم أو احد من صحابته أذى يهودى واحد فى المدينه على الرغم من انهم اشد الناس عداوه للذين امنوا<br />و إليكم يا اقباط مصر هذه مصر التى فر إليها المسيح عليه السلام و امه سيدة الأطهار مريم عليها السلام و لقد اختر الله له مصر لأن شعبها مسالم<br />و نبينا صلى الله عليه و على اله و صحبه و و سلم حينما تزوج من خارج الجزيره العربيه لم يتزوج غير من اهل مصر<br />مصر امنه مطمئنه إلى قيام الساعه و موتى بغيظ يا امريكا<br />يقول تعالى على لسان نبيه يوسف عليه السلام<br />ادخلوا مصر أن شاء الله امنين<br />اللهم إن كنت قد أصبت فمنك أنت وحدك و إن كنت قد أخطات فمن نفسى فاغفر لى فأنه لايغفر الذنوب إلا أنت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

