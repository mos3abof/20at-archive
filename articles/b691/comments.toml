[[comments]]
order = 55
subject = "للمسيحيين من اولهم لآخرهم"
author = "مصري"
posted = "2006-06-06"
text = "اذا كنتم ستتهمون الدين الاسلامي الحنيف بالارهاب لأن شخص ما قتل مسيحيا او هاجم كنيسة اذا فالكلام هذا ينطبق علي الديانة المسيحية آيضا لما تفعله القوات الامريكية الصليبية باخواننا المسلمين في العراق و افغانستان و تدميرهم للمساجد و قتلهم للاطفال و الشيوخ....لماذا اذا يا نصاري لا تهاجمون اقباط المهجر في امريكا و بريطانيا و قوادهم الخونة مثل مايكل منير و امثاله من الخونة من اقباط المهجر الذين يأكلون علي طاولات صهيوأمريكية قذرة و آيضا متيهر هذا الغبي المدعو عدلي ابادير الذي يطالب ببناء كنائس في مكة و مدينة الا لعنة الله علي هذا الفاجر و لماذا لا تهاجمون صحف اقباط المهجر القذرة التي يسبون فيها سيد ولد آدم عليه الصلاة و السلام و يتهمونه بأبشع التهم ز لا تعتقدوا انكم اقوياء يا نصاري مصر بحماية امريكا او اسرائيل لكم فوالله لولا توصية رسول الله بمعاملة النصاري حسنا لكان المسلمون نفخوا نفخة واحدة طيروا النصاري من علي وجة الارض<br />و عايز اقول حاجة بالنسبة لاتهام النصاري للدين الاسلامي بالارهاب<br />اذا قرأتم القرىن الكريم جيدا سوف تلاحظوا ان كلمة السيف لم تذكر مرة في القرآن و لكن انظروا كم مرة ذكرت كلمة السيف في الاناجيل<br />يا نصاري مصر لقد فتحتم علي انفسكم ابواب جهنم بعملكم مسرحية محرم بك التي تهينون فيها الدين الاسلامي بكل تبجح و سفالة و البادي اظلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

[[comments]]
order = 56
subject = "مقارنة بين الاسلام و المسيحية"
author = "مصري"
posted = "2006-06-06"
text = "الحمد لله و الصلاة و السلام علي خير الانبياء و المرسلين محمد و علي آله و صحبه اجمعين<br />نحمد الله دائما عندما نري يوميا نصراني من عبدة العباد يدخل في دين الاسلام الحق طوعا و حبا في الاسلام و يعلن اسلامه في الازهر او في مساجد مصر فاسبوعيا في مصر يسلم ما يقرب من 15 نصراني او اكثر و قد تقابلت مع احدهم و روي لي ما يقول القساوسة عن الاسلام و المسلمين هؤلاء القساوسة ناكري الجميل و كارهي الاسلام و مدعين المحبة خسئتم يا قساوسة العالم<br />ان مهاجمة القساوسة للاسلام لعلمهم انه الحق و يا نصاري مصر فلتشكروا الله ان المسلمين لم يذوقوكم المر مثل ما فعل الرومان بكم<br />و سوف احكي للنصاري مثال علي رحمة الاسلام و لطفه بكم<br />عندما دخل عمرو بن العاص مصر فاتحا منتصرا علي الرومان وسط استقبال المسيحين له فدخل كنيسه و كان يريد ان يصلي شاكرا لله و حامدا لله علي نصره له فخرج و صلي خارج الكنيسة لكي لا يقول المسلمون و يقروا بملكيتهم للكنائس و هكذا اقر لكم بمثال لاخلاق من عامل النصاري من المسلمون انظروا الي هذه الكلمات من الاناجيل و فكروا في هذه الكلمات عن يسوع<br />انجيل يوحنا: تلك هي الحياة الابدية ان يعرفوك انت الاله الحقيقي و يسوع المسيح الذي ارسلته<br />انجيل يوحنا18:1 الله لم يره احد قط<br />اليس لديكم يا نصاري آيه تقول ان كل ما علي الصليب فهو ملعون اذا كيف يقومون الآن و تدعون ان المسيح صلب<br />و بالنسبه لعقيدة الصلب و الفداء<br />كيف يموت الاله؟<br />كيف يقف الاب عاجزا عن انقاذ ابنه من اليهود ؟<br />كيف يسمح الاله لنفسه بان يسب من قبل عباده و يصلب و يبسق عليه ؟<br />لماذا يصلب المسيح مع انه كان قادرا علي ان يغفر للبشريه خطيئة آدم بكلمة قدرته ؟<br />اريد ان اسال اي نصراني هنا هل قرآت نشيد الانشاد (الاصحاح السابع) ؟<br />و هل تجرؤ فتاة نصرانية ان تقرا نشيد الانشاد امام ابنائها او بناتها ؟<br />هل تعتقد يا نصراني ان الله يقول هذه البذاءات في نشيد الانشاد ؟<br />و ماذا عن سب الكتاب المقدس لانبياء الله و اتهامهم بالزني و منهم (سليمان و داود و غيرهم)<br />في الكتاب المقدس يأمر الله نبي مدعو هوشع بأن يرتكب الفاحشة في امراة زني (انجيل هوشع الاصحاح الاول العدد الثاني)<br />اهذا كلام يعقل يا نصاري ؟<br />افلا تعقلون ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

