text = "واللة واللة واللة<br />العيب على مسيحين مصر<br />نعم<br />لانكم سلبيون كتير عنكم سلبية<br />لما هيك ؟؟؟<br />لما عم تصمتو على حقوقكم الضائعة ؟<br />لما ترفضو تدخل بوش وغيرة لحمايتكم من مسلمى مصر الارهابيين<br />نحنا هن كتير نحب المسيحيين من كل القلب لاننا اخوة عن جد<br />لكن عنكم الارهاب كتير<br />واللة بتصعبو على كتير<br />لكن ما تصمتو<br />طالبو بحقوقكم<br />افعلو متلهم<br />اللة معكن"
