[[comments]]
order = 51
subject = "كل البلاوي من الفتاوي"
author = "الفلوجي"
posted = "2006-05-10"
text = "انما نحن البشر اخوة في الانسانية تلك التي انعم الله فيها للانسان ولنا ان نميز بين الخير والشر.ارادة الحياة وذبح وتكفير الزرقاوي .بين معسكر الغل والذبح والتكفير والتفخيخ وحد السيف وبين المحبة والتسامح والخير.وهذا كله يجب ان يكون بعيدا عن الفتاوي اومايرد عن فلان من الناس انما هي عن طريق علاقة خاصة بين الانسان وخالقه ونحن جميعا نريد ان نبني علاقة روحانية صادقة مع الخالق وعلينا ان نميز ونلمس تلك العلاقة ونتعلمها ولو بالنظر الى روعة ماصنعت يد الخالق من الطبيعة والطيور والازهار وان نرفض اللذين يجلبون الموت والدمار كما هم اللذين يفخخون اجسادهم العفنة واللذين يحزون اعناق البشر وينشرون الارهاب وينسبوه الى ارادة الله فاذا كانت ارادة الله حز اعناق البشر فماذا تكون ارادة الشيطان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

[[comments]]
order = 52
subject = "فليمت النصارى"
author = "باسل"
posted = "2006-05-23"
text = "يعجبني جراءة النصارى عندما يقولوا اننا مصريون بل خسئتم مصر هي ارض الاسلام من ايام سيدنا موسى لسيدنا عيسى حتى سيدنا محمد صلوات الله عليهم<br />والمدعي والذي يقول عن نفسه فلسطيني لعنك الله في الدنيا والاخرة ان كنت مسلما<br />اولا فلسطين ارض مسلمة وفلسطين ارض الجهاد وبنظر النصارى هاد اسمه ارهاب وانا فلسطيني وعلى فكرة نحنا عنا بنكره النصارى لسا اكثر من مصر لأنهم امة غدارة لا دين ولا ملة لهم هل ينسون الحروب الصليبية وتواطؤ النصارى العرب معهم ومذابحهم الشهيرة بالمسلمين هل يحاسبوننا على قمتل رجل كهل ويرفضون عتابنا على قتل ملايين من ابنائنا<br />ويتغانون في قتل ابنائنا في انجيلهم وتوراتهم لعنهم الله في الدنيا والاخرة واقول مصر 90% مسلمين ايه دخلكم في مصر انتم مش المسلمين الثانين يعني مش كفاية تحمدوا ربكم ان عمرو بن العاص لم يطردكم وراعاكم وكان من احسن العصور في تاريخكم بعد ما وروكوا الرومان العذاب ولا بس علشان امريكا نصارى يبقى الحكم ليكوا لا يا حبايبي لما امريكا تطلع من ضرب المجاهدين في العراق وفلسطين بعدين تدافع عنكم يا حثالة البشر صبحان الله عمري ما شوفت كبت وحرمان قدكم يا يهودي الهوية بيكونوا يحكوا مع المسلمين ويقولوا مصر ارض الوحدة وكلنا اخوان ويشتمونا من وراء ظهورنا<br />سبحان الله الشئ الوحيد الذي اراه هو دفاع المسلمين عن الرابط بيننا وبينهم مع ان البلد بلدنا ولا 10% شركاء فيها من ورانا بحجة ان الماما شنودة له وساطات خارجية اقولها لم ارى ابجح من نصارى مصر فهناك عندنا نصارى نعايشهم طبيعيا بل نجاهد معهم ويقاتلون الاحتلال معنا ولكن ان يشتمونا فهذا مستحيل فـ والله ما رأينا حثالة في البشر كنصارى مصر المستذئبين<br />لبنان وسوريا والاردن وفلسطين الدول المليئة بل اكثر الدول العربية الموجود بها النصارى ومع ذلك لم نرى ولا اتهامات ولا مسرحيات ولا اي شئ ضد الاسلام ولا النصارية<br />ولكن ابى شعب الكلاب المطلوقة ان يردخ للاسلام لأنه كلب اسعر لا يتربي الا بضربة تقصم ظهره مع احترامي للأشراف من نصارى مصر وهناك نصارى في مصر طيبيون وكويسين وهناك ايضا ملاعين يبغون دمار الدولة العربية الاسلامية مصر وتهويدها وتحويلها لعمود علماني على هامش التاريخ<br />انا لا ارى ان القتل في النصارى شئ غريب<br />لأن الغريب هو قتل النصاري للمسلم بغير سبب<br />كم من الالاف من المسلمين قتلوا في الشيشان وافغنستان والبوسنة والهرسك وفلسطين والعراق ولو وهناك دولة كان اسمها وزيرستان وهي طبعا انمحت من التاريخ بعد ان اتى الصليب ودبح كل من على هذه الامة ومن تبقى منهم عمل على تنصيرهم بالقوى والتاريخ يشهد<br />او ليس عيسى عليه السلام او كما تقولون يسوع او يهوه خلاص اللي بدكم اياه المهم مش هو اللي قال اللي بضربني على وجهي الايمن اعطيه وجهي الايسر وانتم نسبتم له انا لم اتي لكي اجمع بل لكي افرق بين الابن و ابيه وامه واخته و,,,,,<br />يا من لدغة الافعى وباطنها الاعوج<br />يا عبدة الصليب سيأتي اليوم الذي تنحنون امام راية الاسلام<br />واقول لكم خسئ كل من اتهم المجاهدين في الارهاب<br />اولا حاسبوا الارهاب الحقيقي وهو الدين النصاري ثم حاسبونا يا حثالة التاريخ<br />وستبقى مصر لنا وشعب مصر مسلم<br />والله ما كرهت النصارى الا بعد ان رأيت حقيقتهم في مواقعهم الحقيرة التي تسب الرسول والاسلام بل اخترعوا قرانا لكي يشتموا القران وكلهم من.؟!! كلهم نصارى مصر عليهم لعنات الله جميعا وتقولون امان وبنحبهم.!! والله عندي 10 مواقع واكثر كمان للنصارى بيشتموا الرسول شتايم لا حول ولا قوة الا بالله منها<br />واقول حسبنا الله ونعم الوكيل في عبدة الصليب عملاء امريكا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

