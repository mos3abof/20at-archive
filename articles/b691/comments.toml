[[comments]]
order = 3
subject = "اقتلوا الاشرار الوحشين"
author = "Dabdoob"
posted = "2006-04-14"
text = "الموضوع جعلني ارجع مرة اخري الي عشرينات بعد مقاطعة دامت اسبوعين اعتراضا علي اسلوب بعض المعلقين في الموقع واعتراضا علي بعض المواضيع<br />بالنسبة للموضوع بقي فانني اتسائل عدة اسئلة صادقة :<br />1- بدون حساسيات لماذا يغضب المسلمون اذا سمح بالتبشير في العالم الاسلامي في الوقت الذي يسمح لهم فيه بالدعوة الي الاسلام في البلاد المسيحية ؟ يقول البعض ان هذا طبيعي لان الاسلام دين حق والاديان الاخري ليست علي حق. وانا معه في ان الاسلام دين حق ولكن هل هذا رد منطقي ؟؟؟؟ بالطبع لا لان الذي يعتنق ديانة اخري غير الاسلام لا ينظر الي ديانته علي انها ضلالة وكفر بالطبع !!!! الرد المنطقي علي هذا السؤال ان الغرب يمتلك حرية تعبير وحرية عقيدة تسمح بالانتقال من دين الي دين وبالدعوة الي عقيدة اخري دون مشاكل اما نحن فنمتلك تراثا هائلا من التكفير والردة والاحتقان الديني.<br />2- لماذا يشكو المسلمون دائما من ان التبشير يتم تحت ضغط مادي واستغلال للظروف الصعبة والكوارث الانسانية؟؟؟ الا يفعل المسلمون هذا ايضا ؟ خاصة وان التحول من دين الي اخر يتم بالضرورة تحت اغراءات معنوية (كالاقتناع مثلا او الراحة النفسية) او مادية (كالنقود او الزواج او الطلاق مثلا).<br />3- ما هو اصل حد الردة ؟ وهل توجد حرية عقيدة في الاسلام مع وجود هذا الحد؟ سمعت ردا من احد الشيوخ يقول بنفس المنهج غير المنطقي ان هذه هي قمة حرية العقيدة لان الانسان يبحث عن العقيدة السليمة فاذا تحول عنها وجب قتله !!!!!!!ولم افهم ما علاقة السؤال بالاجابة!!!!!<br />اخيرا فانني مسلم ...اكرر مسلم وملتزم ولكنني ارجو ان نناقش الامر بهدوء ودون تعصب ودون ان يسبني العشرات متهمين اياي بانني مسيحي متنكر اومسلم كافر اويساري (علي راي عبد الله مفتاح ) او ابن كلب كم سبني احدهم<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

