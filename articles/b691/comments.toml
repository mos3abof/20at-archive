[[comments]]
order = 29
subject = "مالكوش دعوة"
author = "سوسة المفروسة"
posted = "2006-04-16"
text = "لو سمحتي يا اخت ياللي اسمك سالمة انت ممكن تخليكي في حالك و ما تتدخليش في اللي مالكيش فيه....لبنان ايه ياختي اللي مافيهوش تعصب ده انتوا كنتوا لحد اول امبارح بتقطعوا ودان بعض في الشوارع...ده غير ان اكبر دليل على جهلك المدقع انك بتقولي عندنا اقباط في لبنان و انا على حسب معلوماتي ان التسمية دي بتتقال فقط على المسيحيين في مصر بل ان في ناس بتعممها ع المسلم و المسيحي<br />و الاخت اللي اسمها جميلة و الاخ المغربي ده ...لو سمحتوا والله تشوفوا بلادكم الاول اكيد مليانه مشاكل تلهيكوا شوية عن دس انفكم في اللي مالكوش فيه ...ولو اني و الله اعلم كده شاكه فيكم ...بتفكروني بناس جيراننا اساميهم حاجه كده زي(راشيل و استر و موشيه)<br />مصر هتفضل دايما غصب عن الكل في سلام و اذا كان فيه مشاكل بينا و بين بعض برضه هنحلها بينا و بين بعض..مسلمين و مسيحيين عايشين فيها من قرون في سلام و ياذن الله هنكمل على كده...مصر مش هتكون ابدا لا عراق تانيه و لا لبنان تانيه<br />و اذا كان واحد هافه عقله و عمل حاجه زي كده ده مش معناه ان فيه حرب اهليه و لا اضطهاد منظم و لا حاجه من دي دي حوادث فرديه و لايجب ان تعمم<br />و اذا كان في تقصير من الامن فهذا هو دائما شان امن مصر ع المسلم و المسيحي احنا عايشين سوا في ظل نظام فاشل و اذاكنا هنغيره او هنستحمله فبرضه هنعمل كده مع بعض....رغم انف امريكا و رغم انف المتربصين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

