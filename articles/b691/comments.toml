subject = "وماذا بعد يا مصر"
author = "أحمد"
posted = "2006-05-29"
text = "الموضوع دة و التعليقات اللي معاة أقل وصف ليها إنها فعلا ترفع ضغط الدم<br />تسألوني لية ؟؟<br />الواحد بقى حاسس أنوا عايش في مستنقع من الطائفية و التعصب اللي يثير الإشمئزاز و أعتقد أن من الأسباب الرئيسية للوضع الحالي هو القمع و الفساد السياسي اللى خلا الناس عندها حالة من التربص و التكفير و التخوين لبعضهم البعض إضافة إلى داء هذة المنطقةالبائسة من العالم اللي أسمة \"الاسلام السياسي\" اللي زرع جوانا مبداء الغاية تبرر الوسيلة و تحقير الأخر هو الطريق للتقدم والحفاظ على الهوية و هذا كلة زيف يعود إلى إختلال المناخ الثقافي فى هذة البلد أصبح الناس يعتمدوا في عملية تكوين الأفكار على شرايط كاسيت تباع على الرصيف أو فضائية تبث أفكار مسمومة لنشر ثقافة خاصة بأصحاب مموليها ...رنجع خطوتين للوراء للتعليق على المشاركات اللي تفرح القلب<br />عم مسلم اللي بيقدم أسواء صورة ممكنة للإسلام صاحب فكرة تطبيق حد الردة .. أنا لا أستطيع أن أفهم كيفية تبرير أي إنسان لتطبيق هذا الكلام و نحن نعيش في الألفية الثالثة ...يا عمي يا من أفتيت بقتل من يرتد أساسا هذا الأمر يختلف فية أغلب علماء المسلمين و لكن للأسف ماذا نفعل و قد غرقنا في الأفكار و التشدد الوهابي المسموم ونتج عنها أمثالك الذين هم فعلا يقدمون أسواء صور الاسلام<br />التعليق الثاني اللي جذب إنتباهي هو تعليق باسل من فلسطين<br />في البداية يا عم باسل لا أسمح ليك و لا لغيرك أنك تصف أقباط مصر بأيى وصف أو إتهام قذر لان هؤلاء المسيحين هم إخواننا و شركاء الوطن وعندماأحتلت هذة الأرض دافعنا عنها سويا ...يعني أفكارك المسمومةأحتفظ بيها لنفسك و بعدين لو مش عارف تاريخ بلدك ممكن أوضحلك بعض النقاط ولو أن أنا عارف ان أمثالك ختم الله على قلوبهم بالغباء<br />من أول الجماعات المنظمة اللي تبنت المقاومة الفلسطينية المسلحة كانت الجبهة الشعبية لتحرير فلسطين ..تعرف مين مؤسسها ولا لا ؟؟؟<br />طبعا أحمد جبريل و جورج حبش و الثاني واضح من أسمة ومؤسس حزب البعث العربي هو ميشيل عفلق و حزب البعث تبنى و كانت من أولوياتة قضية تحرير فلسطين والمناضل عزالدين القسام كان من أوائل من تبنواالمفاومة المسلحة و لكنها لم تأخذ الشكل التنظيمي المماثل لجبهة التحرير ..<br />و بالنسبة للموضوع الأساسي هو التبشير فأنا أساسا مع الحرية الكاملة و التامة في الأعتقاد أو عدمة وهذا جزء من الايمان بقدرات الله العادل الذي سوف يحاسب الناس جميعا و هو وحدة من يدرك الحكم أما قاطعى الروؤس و التكفيرين فهم أسواء ما أنتجتة الثقافة المثيرة للإشمئزاز التي نعيشها حاليا والمسلم المقتنع بديانة مغايرة أفضل من المسلم المنافق وبالمثل للمسيحي الذي يريد عقيدة هى الأفضل في نظرة<br />أقول لكم أيضا أنني أتمنى العهيش في وطن يخلوا من تعريف للإنسان بمعنى أن يكون الإنسان هو فقط إنسان وليس مسلما أو مسيحيا أو غيرة ولنترك الطائفية و نؤمن جميعا بعقيدة واحدة وهى عقيد الأخوة البشرية ولنكن أخوة في الإنسانية ونتعامل مع الله من منطلق العلاقة الخاصةالمباشرة بيننا و بينة و أن نقبل الأخر مهما كان إختلاف عقيدتة أو أفكارة ولو تركنا أنفسنا نغرق في مناخ الطائفية وكراهية الأخر المختلف عنا فسوف نصبح أمة منبوذة \"و أظن أننا أصبحنا بالفعل\"وسوف نصبح كمن يحفر قبرة بيدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

