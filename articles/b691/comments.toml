posted = "2006-04-14"
text = "المسلمين ليسو قتله<br />المسلمين يعيشون من اجل الله\"قل ان صلاتى ونسكى ومحياى ومماتى لله رب العالمين\"<br />لسنا نحن من يقتل من فى الكنائس<br />انتم يا ايها الاقباط امنين فى مصر ونعيش على ذلك من القدم<br />المسلمين ليسو وحوشا<br />اللهم اجعل مصرنا ارض سلام واهدنا الى خير الاسلام"
