author = "ساره"
posted = "2006-04-16"
text = "كل ما اتمناه ان يعرفه اخواننا الاقباط ان هؤلاء لايمثلون الاسلام ولا المسلمين وليسوا على نهج رسولهم فرسولنا صلى الله عليه وسلم لم يربينا على هذه الافعال الوحشيه وعلمنا التسامح معكم ومع الديانات الاخرى وهو خير قدوة فى تعاملاته فارجوكم لا تروا الاسلام فى هؤلاء المسئين له ليس كل من اكرمه الله بنعمة الاسلام بمن يمثل الاسلام انا مسلمة عندما اتعرف على رسولى الكريم خاتم الانبياء لا اصدق اننا امته وفى موضوع اعتناق المسلمين لديانات اخرى وتركهم لدينهم الحنيف يصبح الرجل مسلما ويمسى كافرا بان هؤلاء لم يحافظوا على نعمة الاسلام وهى اول نعمة يجب علينا شكر الله عليها وهذا امر بيد الله وحده يختار من يشاء ويستخدم من يشاء ويستبدل من يشاء فاللهم ارنا الحق حقا وارزقنا اتباعه وارنا الباطل باطلا وارزقنا اجتنابه وامتنا على ملة الاسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

