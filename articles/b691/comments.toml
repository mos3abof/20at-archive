text = "مصرالان ليس مصر سلام مصر ارهابيه وليس اسلاميه حكومة مصر ارهابيه مبارك ارهابى شعب مصر الاسلامى ارهابى مازا تقول يا مبارك عن شعب مصر انت والحكومه اى ديانه تقول القتل حلال الحرق حلال التعزيب حلال هل هادى ديانه سماويه اى عدل يا مبارك ان يدخل ارهابك الكنيسه ويقتلون ابرياء مصر ارهابيه مبارك ارهابى وليس حكم عدل مبارك ضد اى ديانه اخرى غير الارهاب"
archived = "2006-11-02"
