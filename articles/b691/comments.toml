text = "نفسى اعرف لية ؟؟؟؟<br />اللى حصل انهاردا اعتداء على 3 كنائس فى الاسكندرية دخلوها مسلمين بالسيوف والسكاكين و و و<br />لية ؟؟؟؟<br />داحنا اخوات مهما كان وعايشين فى وطن واحد<br />لية تعملو كدا فينا لية ذنبها اية الناس اللى بتروح الكنيسة تصلى<br />دى ناس وبتصلى عادى زى مانتو بتصلو يعنى"
