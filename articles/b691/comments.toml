[[comments]]
order = 17
subject = "ماذا انتم فعلين وهم يريدون هذا"
author = "إبن النيل"
posted = "2006-04-15"
text = "السلام عليكم<br />التحية عندنا نحنوا المسلمين السلام<br />ها نحنوا نسير الى شرق اوسط الكبير كما هو مخطط من قبل<br />ماذا الذى يحدث فى مصر الان يحدث ذلك بعد ان تحول الاخوان المسلمين عن اكبر نقطات الخلاف وتحولو الى النظام للوصول لسلطة<br />نقول ارهاب مش معقول ما يحدث من انقسامات فى الداخل كل يوم<br />الى الاخواة الاقباط فى مصر لا تنسوا انكم من اختار الريس حسنى بتفويض منكم ان يتحدث البابا عن كل الاقباط فى مصر<br />انا ما يحدث لا يمس كل انسان فى ارض مصر بقول كل انسان يعنى ابناء الوطن انتبهو لما يخطط لكم من الخارج<br />ولله الامر من قبل ومن بعد<br />ابن النيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

