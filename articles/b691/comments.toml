text = "قال الله تعالى :انك لا تهدي من احببت ولكن الله يهدي من يشآء<br />عشان كدة بدي اوصل رسالة انو احنا عرب و نحبكم و نتمنى انكم تكونو مسلمين و رح اكتب بعض الايات الي في القران و تتكلم عن المسيحين<br />:لتجدن اقرب الناس للذين امنوا الدين قالو انا نصارى<br />ٌقال تعالى :مَا كَانَ لِبَشَرٍ أَن يُؤْتِيَهُ اللّهُ الْكِتَابَ وَالْحُكْمَ وَالنُّبُوَّةَ ثُمَّ يَقُولَ لِلنَّاسِ كُونُواْ عِبَادًا لِّي مِن دُونِ اللّهِ وَلَكِن كُونُواْ رَبَّانِيِّينَ بِمَا كُنتُمْ تُعَلِّمُونَ الْكِتَابَ وَبِمَا كُنتُمْ تَدْرُسُونَ<br />المقصود ان نبينا ونبيكم عيسى عليه السلام عبد الله ورسوله<br />قال تعالى:قل يا اهل الكتاب تعالو الى كلمة سواء بيننا و بينكم الا نعبد الا الله ولا نشرك به شيئا ولا يتخذ بعضنا بعضا اربابا من دون الله<br />هادي الايات الي اتزكرتها اي سؤال هادا ايميلي ebrahemsabeh@gmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

