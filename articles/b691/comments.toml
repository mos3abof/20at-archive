subject = "التعصب وعدم العقاب"
author = "محمد محمود"
posted = "2006-04-21"
text = "ان الاديان السماويه لاتدعو الي الاعتداء علي الغير او التهكم علي دين الاخرين فنحن كمسلمون لنا مبدا ان الدين لله ونري ضرورة معاقبة كل من يعتدي علي الدين 0000 واذا فكرنا في المتسبب وراء تلك الاحداث المؤسفه فسنري السبب 000ومعلوم ان لكل فعل رد فعل - وماحدث بكنيسة محرم بك بالاسكندريه بعرض مسرحيه تتهكم علي المسلمين والاسلام والرسول الكريم وهذه المسرحيه مطبوعه علي cd ومن الطبيعي ان يكون ذلك سببا لاثارة اي مسلم ولو قلبنا الامور وكانت تلك المسرحيه ضدرت من مسلمين هل يرضي المسيحيين بذلك 000 ولو لجات الشرطه والسلطات لاتخاذ الاجراء المناسب ضدد من قاموا بهذا العمل السفيه ومعاقبتهم لما تضخمت الازمه ولهدات الامور بمعاقبة الجناه"
