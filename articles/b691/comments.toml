[[comments]]
order = 15
subject = "معلش بقي ....."
author = "هبهوب , هبه , هوب"
posted = "2006-04-14"
text = "حاجه كدا لو سمحت يا دبدوب ؟؟<br />ابتدي من الاخر ....<br />ايه اللي بالخصوص السلفين دي معلش يعني<br />يعني سوري ؟؟ انت شفت سلفي ابن كلب متعممش خلتني يا راجل اسال هو الصلاه خلف حليق حرام ولاه لاء ؟<br />لما الراجل اللي سالته شتمني \" اللي هو عمي \" وقالي بالحرف ادا كنت انا يا حماره سلفي وبصلي خلف حليق يبقي ايه السوال الاهبل دا مكنش خد غلب وعملهم مسجد لوحدهم \"؟؟<br />هي دي الطز طزززز في الوثيقه مع الاعتدار للكلمه , يعني هي هدفيها تبشيري او تنصريه , يعني هما خلاص المسلمين سدج حيصدقوا كل حاجه ولاه ايه مش فاهمه ؟؟<br />انا ممكن اقول ان طرح الوثيقه عمل حاله دعر . ازاي دا يحصل , بس حصل قبل كدا في الجزائر واندونسيا. اتفق مع من شاء فليمن ومن شاء فليكفر . ولكم دينكم ولي دين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

