subject = "لكم دينكم ولى دين"
author = "مهند الشناوى"
posted = "2006-04-18"
text = "الايمان محله القلب .. واللى عاوز يغير دينه لازم يكون مقتنع تمام الاقتناع بده ، ومن حق صاحب اى ديانة إنه يحاول ينشرها لأن ديانته نفسها بتأمره بكده ، وإذا كان فيه ناس مسلمين عندهم استعداد يكونوا مسيحيين وبقوا فعلا مسيحيين ، يبقى مينفعش ان احنا نقول ان اللى خلاهم مسيحيين غلطان ، بالعكس ، ده يبقى نجح فى رسالته قمة النجاح ، ويبقى اللى غلطان - مش بمعنى الغلط اللى احنا عارفينه - ممكن غلطان فى حق نفسه هو المسلم اللى بقى مسيحى ، ضعف الايمان اصبح هو الاساس وقوته بقت استثناء ....<br />يعنى من الآخر لو انت مسلم وفجأة رجعت بيتكو لقيت ابنك او اخوك بقى مسيحى ، اوعى تقوله مين اللى خلاك مسيحى ؟؟ قوله انت ازاى تبقى مسيحى ؟؟ بس احنا دايما نسيب الاساس ونمسك فى حاجات تافهة وملهاش معنى ولا لزمة ...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

