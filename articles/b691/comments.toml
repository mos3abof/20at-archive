order = 61
subject = "ليكن شعارنا التحاور وليس التطاول"
author = "مارك سمارت"
posted = "2006-07-31"
text = "ليس بالألفاظ النابيه يكون الحديث ، وليكن شعارنا التحاور وليس التطاول،الحجه وليس العنجهية والتبجح وكما قال السيد المسيح له المجد : قبل السقوط تشامخ الروح وقبل الكسر الكبرياء<br />عزيزى من تطاولت علينا بالسب والأهانه يجب ان تفهم ان تطاولك لم يحرك ساكنى ، ولكن اسرنى رقة اخ اخر لك تكلم بكل الأدب والأحترام وتحدث بكل اللياقة والأحتشام ، هل تعلم ايها المتجنى انه قد زاد ايمانى بالمسيح عن طريق التوراة والقرآن اكثر من العهد الجديد نفسه ؟؟!!وان كنت اثق انك لا تفقه شئيا عنهما ولكن رحمة بك اسمع معى لعلك تفيق من سطوتك الطائشه وتعود الى رشدك وترحمنا من سلاطة لسانك<br />التــــــــــــــوراة<br />1- يعطيكم السيد نفسه اية ها العذراء تحبل وتلد ابنا وتدعو اسمه عمانوئيل ( الذى تفسيره الله معنا )اشعياء7 أيه 14<br />2-لأنه يولد لنا ولد ونعطى ابنا وتكون الرياسة على كتفه ويدعى اسمه عجيبا مشيرا الها قديرا ابا ابديا رئيس السلام .......اشعياء 9 ايه 6<br />3- قام ملوك الأرض وتآمر الرؤساء على الرب وعلى مسيحه قائلين نقطع قيودهما ونطرح عنا ربطهما ..مزمور2 ايه 2,3<br />كل ذلك قبل ميلاد السيد المسيح بما يقرب من 1500 عام....................<br />.. انها مجرد نبذه بسيطه من التوراه...<br />القــــرآن....والســــنه...والتفاسير<br />1- اذ قالت الملائكة يامريم ان الله يبشرك بكلمة منه اسمه المسيح عيسى بن مريم وجيها فى الدنيا والآخرة ومن المقربين.......آل عمران 44-47<br />2- انما المسيح عيسى بن مريم رسول الله وكلمته القاها الى مريم وروح منه ...........النساء 170<br />3- هذا بخلاف انه علم الساعه....ومن يعلم الساعة الا الله !!!!!!!<br />4- هذا بخلاف انه لن تأتى الساعة الا ويأتى المسيح عيسى ابن مريم حكما مقسطا بين العالمين!!!!...ومن يحكم بين الناس الا روح الله.......<br />هذه مجرد امثلة بسيطه منها العديد والعديد...وطبعا لا مجال لسرد الأنجيــل هنا فان كلام الأنجيل عن المسيح معروف...<br />على اية حال فاننى قد اتيت بهذه الأمثلة البسيطة لأنى اقرأ فى جميع الكتب بشتى انواعها ولكل الكتاب بمختلف اقلامهم وافكارهم،وبالطبع هناك القلم الصادق والأحساس المرهف ، وهناك القلم المغرض والأحساس المتبلد،وكلاهما نافع ، فالأول هو زينة للنفس حتى وان اختلفت معه فى العقيدة والثانى هو صندوق دشت وان اتفقت معه فى العقيده، فالعقيده هى المبدأ ، والمبدأ هو احترام الذات ، واحترام الذات هى فى كلمة الحق ، وكلمة الحق هى ذات الله... وبهذه الدائرة يكون الله هو البداية والنهاية....فلكل من يبحث عن الله فالله بداخله ليس ببعيد عنه ...اما من يدعى معرفة الله ..فالزيف مبدأه ..والضعف مسكنه...ولا ملجأ له الا الصياح والعويل<br />ورغم كل هذا فقد قال السيد المسيح يوما لتلاميذه تحب قريبك كنفسك وعندما سأل من هوقريبى؟؟ ..لم يقل المسيحى!!! ولم يقل الأبيض !!!ولا الأسود!!ولا اليهودى!!!وانما قال الذى يصنع رحمه...فهل انت ممن برحمون الناس ....ولو بكلمة حق تقولهايرحمك الله بها يوما قريب.. !!!!<br />مارك سمارت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

