[[comments]]
order = 21
subject = "مش عارف"
author = "ربيع"
posted = "2006-04-15"
text = "مش عارف اتكلم عن الوثيقه والا احداث الاسكندريه<br />والا اعلق علي كلام بعض المشاركين<br />بس هعلق علي كلام مين ولا مين<br />بدايه الوثيقه<br />انا مع مسلم<br />وبرضه مع حمدي<br />انما في مشكله كبيره هي احنا<br />ايوه احنا المسلمين الذين لم نعد نعرف شئ عن ديننا الا الصلوات الخمس ورمضان<br />ده اذا كنا بنصلي في الاساس<br />وبعد كده كل واحد يعمل نفسه مفتي<br />زي انا ومسلم مع عملنا واهدرنا دم اللي وقع علي الوثيقه<br />ومع كده انا لسه عند راي مسلم<br />لابد من اخذ موقف حازم مع من وقع علي هذه الوثيقه والموقف ده يريت يكون لرسمي<br />والعقاب يكون قاسي<br />تسموه تطرف ارهاب انتم احرار<br />مع ان فيه نقطه ان اللي هيدخل في الصليبيه عفوا النصرانيه مع انه يعتبر مرتد انما هو اساسا لا يستحق ان ينال شرف ان يكون مسلم<br />يرتد ويعبد الصليب افضل من ان يبقي عاله علي الاسلام<br />نيجي لاحداث الاسكندريه<br />موضوع مختل انا مش مصدقه<br />المختل ما ينقيش الكنايس بس ويسيب المساجد والشوارع والاتوبيسات<br />دي واحده التانيه حد فيكم عده من امام كنيسه تعرفوا ان اماكن العباده الوحيده في مصر اللي عليها حراسه من الشرطه مسلحه هي الكنائس وبالذات كنائس اسكندريه الحراسه فيها مشدده جدا جدا جدا بعد احداث محرم بيه<br />فين الحرس الي سبوه وفين رواد الكنيسه لما يخش عيهم راجل واحد معه سكينه ويضرب هنا وهنا محدش قدر يمسكوا يا سلام<br />رامبو ولا سوبر مان<br />والرجل يا عيني اللي مات متاثرا بجراحه كان في عز شبابه عند 80 سنه حسب المعلومات اللي عندي ما تحولش للطبيب الشرعي ليه<br />ولا الرجل ده مات من الخضه<br />ولا اساسا كان ميت وحبيتوا تحبكوا الدور عشان كده جبتوا جثته في الكنيسه<br />الكل عارف في مصر النصاري قبل المسلمين ان اي احداث فتنه طائفيه في مصر بيكون السبب الرئيسي هما النصاري تدخل المسلمين بيكون رد فعل<br />والدليل احداث الزاويا الحمرا في السبعينات<br />احداث الصعيد في التسعينات احداث كنيسه العباسيه احداث كنيسه محرم بك<br />انا عندي كلام كتير بس للاسف مش فاضي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

[[comments]]
order = 22
subject = "بسم الله الرحمن الرحيم"
author = "داليا _اسكندريه"
posted = "2006-04-15"
text = "السلام عليكم ورحمة الله وبركاته اولا احب اقول ان الدين الاسلامي دين سلام ورسولنا صلى الله عليه وسلم كان بيحث الصحابه على كده و بعدين زي ما قرأنا بقول وعمر مصر ماحصل فيها كده ابدا واحنا عايشين مع بعض طول عمرنا في احلى عيشه وبعدين المسلمين مش راضين على اللي حصل ده خالص وداللي عمل كده الاسلام متبري منه اكيد وياريت الاخوات اللي بيعلقوا من خارج مصر ياريت ملهمش دعوه بيناواحنا نحل مشاكلنا لوحدنا وبعدين من غير زعل لما كان موضوع المسرحيه اللي عملوها المسحيين و كان فيها اسأه للقران ولرسولنا وخير البشر سيدنا محمد صلى الله عليه وسلم ما محدش اتكلم يا جماعه ومخدناش حقنا والموضوع هدي وخلاص و يا جماعه مش ممكن يكون حد قاصد يعمل كده علشان يقلب حال بلدنا على العموم ارجو اخونا المسحسن ميزعلوش لان عمر ما دينا قال كده و حسبي الله ونعم الوكيل في كل واحد عايز يخرب البلد و احنا عمرنا ما كرهنا اخونا المسحين ابدا و الناس كلها و المسلمين كلهم زعلانين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

