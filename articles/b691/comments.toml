[[comments]]
order = 28
subject = "نحنا"
author = "سالمة"
posted = "2006-04-16"
text = "يااللة على ها المعاناة اللى عم تلاقوها بمصر ايها الاقباط ؟؟<br />كتير تعجبت امس اثناء مشاهدتى للفضاءية وانا اسمع باحداث متل الكشح وغيرها<br />اللة معكن عن جد ؟؟؟<br />نحنا هن عندنا كتير اقباط واللة مابنعمل فيهم هيك لاننا عن جد نعتبرهم شركاء بنفس الوطن واخوة لالنا بالحق<br />لكن اتعجب من سكوتكم ايها الاقباط واتعجب اكتر من راعيكم حسنى مبارك الذى لايبالى بمطالبكم ابدا ؟؟؟؟<br />اللة معكن ويعطيكم الامان ولبنان مفتوحة لكل من يريدها لاننا بلد تكرة التعصب وتحب الشعوب"
archived = "2006-11-02"
