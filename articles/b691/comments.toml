subject = "حراام"
author = "سالمة"
posted = "2006-04-14"
text = "لا مادونا اللى عم يحصل عنكم بمصر كتير واللة<br />لما هيك يامصريين ؟؟؟<br />يااللة عم تدخلو كنايسهن بالسيوف والسكاكين<br />يااللة على ها القسوة<br />كتير حاب اخبركن ان عنا بنحترم المسيحيين ايضا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

[[comments]]
order = 10
subject = "طيب"
author = "Dabdoob"
posted = "2006-04-14"
text = "الي الاخ احمد صبري شكرا جدا علي المقال<br />اما الاخ باسم فله اقول انني لم اتشدق او اتصدق ...فكل ما قلته ان هناك حرية عقيدة حرية وحرية دعوة للدين حقيقية ولا يوجد مثل هذا عندنا ثم انني سالت ثلاث اسئلة لم ترد علي احد منها واكتفيت بذكر مثال ما في دولة غربية لا يتعلق بالموضوع من قريب او بعيد لان هذا حدث في مجتمعنا المصري مع بعض المسيحيين وهناك قضية مشهورة في هذا الشان كانت لصالح المخابرات الامريكية .<br />اما بالنسبة لحادث الاعتداءات علي الكنيسة فهو نتيجة لاشياء كثيرة منها تصرف الحكومة اثناء مشكلة التعدي علي الاسلام في احدي المسرحيات المسيحية حيث لم تقم بمحاسبة المسيحيين الذين شاركوا في هذه المسرحية واكتفت بالقول انه لا توجد مسرحية!!!!!!! بالطبع من اهم اسباب الاعتداءات التي تظهر من وقت لاخر حالة التعصب والاحتقان التي يتصرف بها الكثير من المسلمين تجاه المسيحيين ولا سيما السلفيين.<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

[[comments]]
order = 11
subject = "اية ؟؟؟؟؟"
author = "توتا"
posted = "2006-04-14"
text = "ياسلاااااااام<br />ههههههههه احتقان من المسيحيين<br />بجد حرام اللى بيحصل دا<br />والحكومة اللى بتقول قالت مفيش شريط هتكدب لية ؟؟؟؟؟<br />للدرجةدى فية ناس موافقة على اللى حصل ؟؟؟؟؟<br />يعنى عادى عندكم ودينكم بيقولكم اقتلو المسيحين عادى يعنى ؟<br />معقول ؟؟؟؟؟<br />يعنى واحنا فى كنيسة بنصلى ممكن بقى تدخلو وتفجرونا وكدا ؟؟؟؟<br />مش بايدى اقول غير ربناااااااا يرحمنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

