[[comments]]
order = 0
subject = "ردة عن الاسلام"
author = "مسلم"
posted = "2006-04-13"
text = "من وقع من المسلمين على هذه الوثيقة -إن صحت - فما أراه الا مرتدا عن الاسلام ، يجب استتابته ، فإن تاب والا قتل ردة.<br />وأي جرم أعظم من أن تخرج الناس من الايمان الى الكفر ومن الحق الى الظلال ؟<br />اقرؤوا : ان تكفروا فان الله غني عنكم ولا يرضى لعباده الكفر وان تشكروا يرضه لكم.<br />وأما الدعوى أن هذه معاملة بالمثل ، بمعى أن الكفار يسمحون لنا بالدعوة الى ديننا في أرضهم ، فلا بد أن نسمح لهم بالدعوة لدينهم في ارضمنا ، فكلام مردود؛ لأن فتنة الناس (المسلمين) عن دينهم مقدم على كل شي ، حتى لو كان النفس ، أي أنه لو خير المسلم بين الموت على الاسلام ، والحياة مع الردة ، لكان لزاما عليه أن يختار الموت مسلما ، فما بالك إذا كان الثمن أن يدخل الاسلام بعض الكفرة؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

