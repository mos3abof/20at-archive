text = "الاخ اللى بيقول جبنا جثة الراجل وحطيناها فى الكنيسة<br />دا كلاام ؟؟؟؟؟؟<br />هل انت عاقل يعنى ولا اية ؟؟؟؟<br />حتى دى بتشكو فيها يابشر<br />دا بدل ماتقولو ان اللى عمل كدا غلطان ويستاهل<br />مانت لو بتعرف تشوف اخبار كنت شفت اثار الدم فى الكنيسة وفى كل حتة فيها<br />مش احنا اللى بنتبلى عليكم لان مالناش غير ربنا يحمينا منكم"
