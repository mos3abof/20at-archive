text = "يا أخ ربيع الجهل بالشئ ليس خطأ وانما ولكن الخطأ عندما تتحدث بجهل عن عقائد المسحيين وانت قاعد تفتى زى الشيوخ اللى بتقول فتاوى هبلة لتخدم أشخاص معينة المهم :ليس هناك مسيحية فى عصر ثم استبدلت بمسيحية أخرى طبعا دة كلام مصاطب وجهل بعينة المسيحية هى مسيحية على طول الزمن لم تتغير تؤمن بألله واحد كما هو فى نص فانون ايمان الكنيسة ويمكنك ان تتطلع علية او تسأل عنة صديق مسيحى وبعد كدة متبقاش تكلم عن اساسيات ديانة يمكن ان تحفز من يقرأكلامك عنها يا ابو جهل"
