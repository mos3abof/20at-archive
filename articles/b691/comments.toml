text = "يااللة<br />واللة ماعم كنت اصدق اللى عم يحصل فى مصر الا عندما تصفحت اخبار النت ورايت بعينى<br />لهيك وصلت مصر<br />قتل الابرياء واين ؟؟؟؟ داخل الكنائس فى مصر<br />يااللة<br />اذن ماحدا يذهب لمصر الارهابية هذة<br />داخل الكنايس ؟؟؟؟؟؟"
