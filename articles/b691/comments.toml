text = "قال الله تعالى<br />ولن ترضى عنك اليهود ولا النصارى حتى تتبع ملتهم)صدق الله العظيم<br />إن غالبية اليهود والنصسارى من الحاقيدين على دين الاسلام لذالك يحاولون دائما التبشير بدينهم المحرف الزائف (من عبادة الصلبان والتمسح بها)ولكن والله لن يصلوا ابدا لما يريدون"
