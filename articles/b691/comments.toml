text = "هل تزكرون حادثه المختل الذى مثل و قتل ثلاثه عشر عائله فى الصعيد من المسلمين . و الأن تبكون . روحوا أشتكوا لماما أمريكا لو كانت قادره تحمى نفسها فى العراق كانت حمتكم .. الله أكبر و لله الحمد . و نحن لا تأخذنا فى الله لومه لائم. و السلام على من أتبع الهدى. و ربنا و ربكم ليس واحد فربنا هو الواحد الأحد و ربكم هو المسيح أو الثالوث أو أو أو ......."
