text = "يا سيادنا<br />اللى مش عايز الاسلام .. الاسلام مش عايزه<br />الدين علاقة بين البنى ادم و ربه .. هو حر<br />عايز يبقى مسلم عايز يبقى مسيحى هو حر<br />زى ما احنا بندعى للاسلام فى دول الغرب ة هم سمحوا بكده<br />و مخافوش منا<br />و بعدين طالما احنا على حق ... خايفين من ايه... هه خايفين من ايه نفسى افهم<br />و بعدين حوار حد الرده ده انا مش مقتنع بيه<br />ازاى الاسلام كفل حرية العقيده و فى نفس الوقت يبقى حد الردة القتل<br />مش منطقوا بايظ فى النقطة دى ولا ايه<br />حد الرده الترك يا بنى ادمين<br />التــــــــــــــــرك"
