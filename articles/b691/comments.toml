subject = "الي تامر مره تانيه"
author = "ربيع"
posted = "2006-04-16"
text = "ثم تعليقا علي كلمتك<br />ملناش غير ربنا يحمينا منكم<br />رغم اني اتحاشي ان اكون طائفيا او ان ادعوا الي الطائفيه الا انني اري لكي ارد علي طائفيتك لابد ان اكون طائفيا<br />الا تتذكر ما فعله اخوانك من قتل للابرياء في الزاويا الحمرا والكشح<br />الا تتذكر ما فعله اخوانك في العباسيه<br />الا تتذكر حين رفعتم رايات تدعوا بوش لاحتلال مصر<br />الا تتذكر ما يفعله الان ومنذ سنوات عدلي ابادير في امريكا واوروبا<br />الا تتذكر اهانتكم لمقدساتنا عن طريق اعمال مسرحيه كررت اكتر من مره باكثر من شكل وباكثر من مسمي<br />نعم توجهوا الي ربكم بالدعاء<br />توجهوا له قبل ان يبلغ الغضب منا مبلغه<br />انا مسلمون مسالمون لم نقم لكم يوما(مع كل ما تفعلوه من ايذاء لمشاعرنا ومقدساتنا وارواحنا ) محاكم تفتيش مثل اهل جلدتكم<br />كفلنا لكم حريه العقيده وحريه العباده<br />ومع هذا لايزال قساوستكم يرتدون السواد<br />وتعلم لماذا<br />اذا كنت شجاع وصادق<br />فقل لي لماذا؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

