[[comments]]
order = 7
subject = "حمدي"
author = "الاخ المغربي اللي بيصطاد في المياه العكره"
posted = "2006-04-14"
text = "انا مش فاهم هو عايز ايه يا ريت تخليك في بلدك والبلاوي اللي فيها والمفقودين في السجون والمعارضين اللي تم تذويبهم بالاحماض وياريت تبطلوا تنحنوا تقبلوا يد امير المؤمنين بتاعكم انت اكيد مغربي يهودي<br />اماالاخ القبطي مارك ياريت يامارك ماتحملش المسلمين المصريين كلهم خطا افراد يعني اغلب المسلمين في مصر بيستنكروا العمل اللي حصل ده ودي جريمه الللي ارتكبها هياخد جزائه فياريت لا نحول الموضوع الي شكل طائفي وكان المسيحين في مصر مستهدفين من المسلمين<br />العلاقه في مصر بين المسيحين والمسلمين اقوي من هذه الحوادث الفرديه<br />ياريت تخلي بالك من كلامك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

[[comments]]
order = 8
subject = "تصحيح"
author = "مادونا"
posted = "2006-04-14"
text = "بصراحة اللى حصل دا حاجة تزعل بجد<br />احنا المسيحيين بجد فى يومين عيد وبنروح الكنايس بشكل مكثف اليومين دول<br />اللى حصل دا حاجة صعبة جدا وحرام فعلا بس<br />المهم ان<br />( مش هى دى مصر )<br />لا دى اخطاء فردية حصلت بس المهم الجانى او الجناة لان دا ( مخطط ضرب 3 كنايس )<br />لازم ياخدو العقاب<br />واحنا مش عاوزين حد يتدخل لاننا بنحب مصر وربنا قال (مبارك شعبى مصر )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123938/http://www.20at.com/article2.php?sid=691"

