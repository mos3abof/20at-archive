text = "علاش بالفعل<br />لما تفعلو هكذا يامسلمى مصر باخوانكم وهم يتقاسمو معكم نفس الارض بدل الاحترام بالذاف<br />ماتزعل اخى مارك انت وكل مسيحى مصر<br />هذة مصر نعم هذة مصر<br />تعو عنا المغرب عم ترو بالذاف حب واحترام لاالكم"
