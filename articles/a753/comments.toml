[[comments]]
order = 1
subject = "لمبة محروقة"
text = "يساتر يارب ؟؟؟<br />يسرقو هدوم ؟؟؟؟؟؟؟؟؟<br />أعوذ بالله<br />على أي حال لو أنا مكنتش هازعل<br />أحسن ياخدوها<br />أصلا أنا معيدتش السنة دي ومشترتش ولا نص حاجة جديدة للعيد ومحدش عيد عليا ولا عيدت على حد ولا خرجت من أوضتي أساسا<br />بس بجد صعبو عليا الناس / كويس أوي الحمد لله ان ضمير الحرامي صحي ورجع لهم الحجات<br />مرسي أوي للكاتب / خضيتنا يا شيخ<br />مش سلام لحد"
archived = "2004-11-17"
capture_url = "https://web.archive.org/web/20041117131233/http://www.20at.com:80/article.php?sid=753"

[[comments]]
order = 2
subject = "مصـ( الخير )ـعب"
text = "الموضوع حلو اوي يا أستاذ حسين<br />و يارب نشوف حضرتك هنا كتير<br />مش عارف إذا كنت حضرتك فاكرني وللا لا<br />بس أنا فاكر حضرتك كويس<br />سلام بقى علشان \"نعيد\"!!"
archived = "2004-11-17"
capture_url = "https://web.archive.org/web/20041117131233/http://www.20at.com:80/article.php?sid=753"
