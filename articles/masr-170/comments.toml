subject = "على بابا"
author = "عابر القارات"
posted = "2006-04-17"
text = "هاهاهاهاهاهاهاهاهاها ... حقوق .... إنسان .... هاهاهاهاهاهاهاهاهاها ... أحمدك يا رب ... هذا الموضوع ذكرنى بحكاية على بابا ... أى لا يحدث إلا فى الاساطير .... و مين السيد / بطرس غالى هوه رئيس المجلس!!! .... كان حمى حقوق المسلمين فى البوسنة و الهرسك لما كان أمين عام الامم المتحدة ... و المهم الكابتن بطرس راح زى التلميذ البليد و التقرير تحت باطه لسيده و ولى نعمته علشان يصححله الواجب طبعا المعلم (بضم أو بكسر الميم) راح قاله سيبك من التقرير ده و أنا جايبلك نسخة من تقرير حقوق الإنسان فى سويسرا بس مغير الغلاف روح أنشر التقرير ده و قولهم ده تقرير حقوق المواطن المصرى المحسود من نظرائه المواطنين فى الدول الاسكندنافيه"
archived = "2006-09-03"
