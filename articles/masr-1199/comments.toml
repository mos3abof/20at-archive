text = "اناشدمؤسس (جبهة طلاب من اجل التغيير )الاستاز(احمد حافظ)ان يرسل لى شرح فكرة الجبهةكاملة لكى يتم تنفيزهافى جامعة المنصورة لكى تكون مثل جامعة بنى سويف"
