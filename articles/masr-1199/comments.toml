[[comments]]
order = 0
subject = "ربنا معاهم الأبطال"
author = "إبن بهية"
posted = "2006-11-23"
text = "يا رب وفقهم للخير .. يا رب تعمم هذه التجربة الرائدة والجريئة والعادلة والقوية والبطلة في كل الجمعيات والنقابات حتى ولو بالإمكان تكون في مجلس الشعب يبقى يا هنانا ... طالما الدولة قذرة (أقصد الحكومة) يبقى نعملنا دولة خاصة بينا بعيد عنها في سلام وبدون صدام لغاية ما يبصوا يلاقوا ما لهمش لازمه يمكن يسيبونا ويحلوا عن سمانا بقى ويشوفولهم حتة لعبة غيرنا ..أصلنا قرفنا خالص والله<br />أحيي بكل قواي تجربة هؤلاء الشباب الأبطال ... ويغور اتحاد الحزن الوطني ويغوروا العيال العبيطة بتوع جيمي مبارك اللي ضاحك عليهم بكورس كومبيوتر وصاندوتش<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125172058/http://masr.20at.com:80/article.php?sid=1199"

