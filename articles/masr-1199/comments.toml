[[comments]]
order = 4
subject = "طلاب من اجل التغيير"
author = "احمد حافظ"
posted = "2006-11-25"
text = "هذه خطوة خطونها للامام يتبعها خطوات كثيرة نحو مستقبل افضل لطالب افضل لجامعة افضل وافضل<br />( مؤسس جبهة طلاب من اجل التغيير)<br />احمد حافظ<br />جامعة بنى سويف<br />وهذه فكرة انفردت بهاجامعة بنى سويف<br />لا لا متفهموش غلط اعنى الجبهة"
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195928/http://masr.20at.com:80/article.php?sid=1199"

[[comments]]
order = 5
subject = "مبروك اما نشوف هتعملوا ايه"
author = "A.A.H"
posted = "2006-11-26"
text = "اما نشوف هتعملوا ايه<br />عمالين بس تزاحموا عالسلطةباسم الله وباسم الدين<br />وياتري بقي البنات ماشتركوش في تكوين الاتحاد ده ليه علي اساس ايه بقي<br />ولا الاتحاد الحر ولاد بس زي منا شايفة كدة في الصور"
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195928/http://masr.20at.com:80/article.php?sid=1199"

[[comments]]
order = 6
subject = "فكرة جديدة"
author = "محمد ابو اسماعيل"
posted = "2006-11-26"
text = "عجبتنى اوى فكرة (جبهة طلاب اجل التغيير)فى جامعة بنى سويف حيث قامت بدوررئيسى فى خروج الاتحادالحر للنور وقامت بحشداكثر من 20000الف طالب للمشاركة فى الانتخابات وكانتااعلى نسبة مشاركةعلى مستوى جامعات مصر واشكر مؤسس (الجبهة) (احمدحافظ )على تحملةمسؤليةالجبهةكاملة"
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195928/http://masr.20at.com:80/article.php?sid=1199"

