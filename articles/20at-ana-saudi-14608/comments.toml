author = "الكثير من الكنائس"
posted = "2009-12-28"
text = "مش عارف ليه في كلامك حسيت انه شيىء غير طبيعي انه يكون فيه كنائس في مصر .. انت ناسي ولا ايه؟؟ مصر اصلا مسيحيه !!!!!! فلما يكون فيه كنايس في مصر ده الشيىء الطبيعي .. و كمان مصر مش اي دوله دي من الدول الرئيسيه في المسيحيه و ربنا بيحبنا \" مبارك شعبي مصر \" ربنا قال كده … و كلامك عن المعبد اليهودي … هو لسه فيه يهود في البلد ؟؟؟؟ ده ترميمه بس لانه يعتبر اثر و ثقافه مش عشان العباده"
