posted = "2009-12-28"
text = "للناس اللي بتتحدث عن التعصب في السعوديه الناس دي بطبق الشريعه الاسلاميه وفي الشريعه الاسلاميه لايجوز الاحتفال الا بعيد الفطر وعيد الاضحي ولذلك لايحتفلون باي عيد اخر حتي ولو كان اسلامي مثل مولد النبي عليه الصلاه والسلام او راس السنه الهجريه او ماشابه ذلك فكيف يحتفلون براس السنه الميلاديه…مصر كانت فرعونيه ومسيحيه ووووو ولكن الان اصبحت اسلاميه والحمد لله واتمني ان نصبح مثل السعوديه"
