text = "يعني لو انا لابس الزعبوط بتاع سانتا كلوز و سمعت صويت غب الشارع و طلعت جري يجلدوني عشان بروج للاحتفال ؟؟؟ ولا لو دعيت اصحابي في البيت للاحتفال يقبضوا عليا \"بتهمه\" التبشير ؟؟؟؟ هو للدرجه دي الناس في السعوديه مش واثقين في دينهم .. و الحكومه خايفه عليهم من زعبوط سانتا كلوز ؟؟؟؟"
