text = "اقتباس كلمتين و بس:<br />وجاوبا على سؤالك عن المأذن التى لغتها سويسرا…شكى المسلمون لانه منافى لمبادئ حقوق الانسان والتى دائما ما يتحدث عنها الغرب وايضا منافى للحقوق الدينيه …واعتقد عمرنا اما سمعنا ان فى الوطن العربى عن معبد يهودى او كنيسه تم هتمها…بالعكس هنا فى مصر يوجد الكثير من الكنائس التى تبنى …وايضا نرى ما تقوم به الحكومه من ترميم المعبد اليهودى فى شارع احمد سعيد<br />لازم تفهم السؤال كويس … هما ملغوش الجامع لكن المأذنه بس عشان الاذان المذعج في عصر احنا مش محتاجيتن فيه لحد يفكرنا بمواعيد الصلا .. عشان الموبايلات و الساعات و الكمبيوترات ماليه الدنيا … الاذان ده كان زماان .. و هناك كل واحد ليه دينه و معتقداته براحته … لكن ملوش دعوه بغيره لكن الجوامع الاسلاميه بتسبب ازعاج لاهل البلد الغر مسلمين … و بعدين لما انت بتقول منافي لحقوق الانسان … يبقى من حريه الانسان و حقوقه انه يحتفل بمعتقداته في اي مكان ( حتى السعوديه ) … اللا بقى لو كان رأيك ان السعوديه مفيهاش حقوق انسان"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123632/http://www.20at.com:80/20at/ana-saudi/14608-2009-12-27-14-55-11.html"

[[comments]]
order = 13
subject = ""
author = "خزامى"
posted = "2009-12-29"
text = "الإحتفالات الممنوعة في السعودية هي مثلا عرض الشجرة أو الشرب أو غيرها<br />وللعلم حتى المولد النبوي أيضا لا يحتفل به في السعودية<br />فقط العيدين الفطر والأضحى<br />ولو دققتم قليلا لوجدتم أن المنع يركز على المقيمين بمعنى من أتى البلاد بعقد عمل<br />والذي يعرف قوانين البلد ووافق عليها والعقد شريعة المتعاقدين لأن السعودية لا مسيحيين فيها<br />من ناحية المبدأ في رأيي هو ليس مناسبة دينية كالكريسمس مثلا لأنه هو بحسب الرأي الراجح هو مولد المسيح<br />أما رأس السنة الميلادية فهو احتفال يعود تاريخيا لأيام الوثنية وهو احتفال بيوم الشمس<br />بمعنى أن الاحتفال أساسه وثني لا مسيحي ولا اسلامي<br />ثم اننا نصوم عاشوراء مع أنه اليوم الذي نجى فيه الله سبحانه وتعالى موسى عليه السلام<br />الاسلام هو أكثر الأديان محبة وتسامح<br />دمتم بخير"
archived = "2009-12-30"
capture_url = "https://web.archive.org/web/20091230113332/http://20at.com/20at/ana-saudi/14608-2009-12-27-14-55-11.html"

