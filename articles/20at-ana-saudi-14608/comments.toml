author = "janjaah"
posted = "2009-12-27"
text = "اقتباس محمد عيد فايد:<br />والله ناس بتفهم وبتفهم قوي<br />ياريت عندنا كان ينفع الكلام ده<br />انا اعرف ناس مسلمين بيهتمو براس السنه الميلاديه اكتر من راس السنه الهجريه<br />يا أستاذ محمد مش موضوع ناس بتفهم<br />دول ناس بيطبقوا شريعة ربنا علشان كدا هى بلد مباركة بغض النظر عن اللى بيحصل فيها يعني هتلاقى المميزات اكتر من العيوب<br />كمان اذاعة القرآن الكريم من اول يوم فى السنة الهجرية الجديدة دي لغاية أخر شهر محرم هايحتفلوا بالعام الهجرى الجديد كل يوم من مسجد مختلف ومن محافظة لأخرى قبل صلاة العشاء والاحتفال عبارة عن قراءة القرآن والقاء خطبة عن سيدنا محمد وعن فضل الهجرة النبوية"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123632/http://www.20at.com:80/20at/ana-saudi/14608-2009-12-27-14-55-11.html"

