posted = "2009-12-27"
text = "اقتباس ABANOB MONIER:<br />da ta3asob da !!! balad kolaha mota3asebeeen :S<br />اولا عيب اوى تقول على بلد مسلمة كبيرة زاى دي ان كلها متعصبين<br />واضح ان سيادتك معرفتش تقرا المقال كويس<br />احب اوضح لحضرتك ان المقال بيقول انهم بيسمحوا بالاحتفال لغير المسلمين<br />فين التعصب دا اللى بتقول عليه, يعني غير المسلمين فقط هم اللى مسموح لهم بالاحتفال الموضوع دا يضر حضرتك أو غيرك فى إيه,<br />ولسبب بسيط ان احنا المسلمين والحمد لله شريعتنا الجميلة بتقول (لا عيد إلا العيدين) بمعنى لا يحتفل المسلمين إلا فى العيد الصغير والعيد الكبير فقط<br />مش فاهمة حضرتك زعلان اوى كدا ليه وبتقول تعصب, يعني البلد بتمشي على مبدأ إسلامي بحت وياريت كل الدول الاسلامية بما فيها مصر تتبع نفس النظام وتعمل هيئة الامر بالمعروف والنهى عن المنكر علشان اللى زايك يخاف حتى يخرج من باب البيت او يبص من الشباك<br />كمان عيب اوى تقول الكلام دا لأنك برضو أو غيرك هاتزعل لو حد أساء للفاتيكان أو أحد الرموز الدينية الكبيرة اللى عندكم"
