text = "وجاوبا على سؤالك عن المأذن التى لغتها سويسرا…شكى المسلمون لانه منافى لمبادئ حقوق الانسان والتى دائما ما يتحدث عنها الغرب وايضا منافى للحقوق الدينيه …واعتقد عمرنا اما سمعنا ان فى الوطن العربى عن معبد يهودى او كنيسه تم هتمها…بالعكس هنا فى مصر يوجد الكثير من الكنائس التى تبنى …وايضا نرى ما تقوم به الحكومه من ترميم المعبد اليهودى فى شارع احمد سعيد"
