text = "اقتباس ايه رأيكم ؟:<br />لو البلاد غير المسلمه منعت كل شيء اسلامي .. كان هايكون رد الفعل ايه ؟؟ و ليه ادايقتوا لما سويسرا لغت المأذن و قولتوا عليها متعصبه ؟؟؟؟ و لا هو حلوا ليكوا و وحش لغيركوا ؟؟؟<br />عمر اما كان الدين الاسلامى او المسيحى او اليهودى به تعصب …لانهم من عند الله<br />كلها اديان سماويه تدعو للسلام وعباده الله سبحانه وتعالى…اما قرار السعوديه فهو قرار سليم لانه يعطى الحريه لغير المسلم بالاحتفال بالعيد الخاص به …فى المكان الخاص به<br />اما المسلمون فليس لهم الحق بالاحتفال بعيد ديانه اخرى…لانه لكلا منا ديانته ومعتقداته<br />واخيرا ايا كانت ديناتنا فكلنا تحت لواء وطن واحد…الوطن العربى"
