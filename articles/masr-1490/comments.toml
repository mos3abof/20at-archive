author = "فهد الا سلام"
posted = "2007-01-25"
text = "اولا القذافى دة ملحد ومجنون فعلا واكيد الشعب اليبى اتعدى منه ولا اية والله يا اخونا المصرين بيشفوا اكثر من كدة فى كل العالم يمكن دول راحو يلعبوا ورجعين بر ضة بكرمتهم شوية لكن المصرى دلوقتى ليس لهو اى قيمة فى الخا رج وكل دة لية لا نه مش لا قى فر صة فى بلدة علشان كدة بيطلع يشتغل اى شغله مهينة وكله على حساب كرمته من اجل لقمة العيش لا نه فى مصر مفيش عا يش الله الله فيك يا مبارك ويورينا فيك يوم زى فرعون"
archived = "2007-01-30"
