[[comments]]
order = 0
subject = "هية جت على الكورة وبس"
author = "هية يعنى كرامة المصريين أتهانت فى الدول بسبب الكورة وبس طيب مهو المصرى متهان فى بلده ولا نسيتوا صورة ضرب الناخبين وصور ضرب المشاركين فى إعتصام القضاه وإزاى كانوا بيضربوا المصريين بالحذاء والعصاية بتاعة الأمن المركزى"
posted = "2007-01-24"
text = "بجد مافيش حد أهان المصريين زى الراجل ده ولن يسترد المصريين كرامتهم ولا عزتهم إلا بطرده ومحاكمته على ما فعله فى مصر<br />أمبارح كان مبارك الواطى رايح يفتح معرض الكتاب وكان الطريق كله مقفول والطلبة نزلوا من المواصلات وأخذوا الطريق جرى علشان يلحقوا الإمتحانات بتاعتهم وحتى العساكر والظباط إللى كانوا واقفين حراسة ليه كانوا عمالين يدعوا عليه ويقولوا ربنا يخده ويريحنا منه<br />والنهاردة كان بيدى أوسمة لشهداء الشرطة طيب ليه لم يعطى أوسمة للشهداء من أبناء مصر اللى إتعذبوا على أيد الشرطة فى السجون ولا للشهداء إللى الشرطة والأمن المركزى قتلوهم فى الإنتخابات المزورة بتاعة الرئاسة وبناعة مجلس الشعب ولا هوه بيديهم أوسمة علشان فسادهم وحراستهم ليه هو وعيلته الوسخة تخيلوا أنه بتخرج 3 تشريفات واحدة للجاموسة مبارك وواحدة للكلب إبنه وواحدة للمعزة مراته يبقى فين بعد كده الأمن إللى ها يحرس مصر"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130143807/http://masr.20at.com:80/article.php?sid=1490"

