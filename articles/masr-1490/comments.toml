[[comments]]
order = 6
subject = "وهما الاخوان مش مصريين ولا ايه؟"
author = "ياسر أبو عمار"
posted = "2007-01-25"
text = "كرامة ايه ومصرى ايه اللى بتتكلمى عنه يا منى ؟انتى ما سمعتيش عن الاف العمال اللى الحكومة رمتهم رمية الكلاب فى الشارع وحرمتهم من مصدر دخلهم الوحيد فى الدنيا والله اعلم هما عايشين ازاى دلوقت؟وما سمعتيش عن عشرات الشركات اللى الحكومة شمعتها وقفلتها بالضبة والمفتاح واستولت على اجهزة الكمبيوتر والتليفونات المحمولة واى فلوس موجودة فيها؟ما سمعتيش عن دار التوزيع والنشر الاسلامية اللى المفروض كانت تشارك فى المعرض اللى افتتحه \"؟؟؟؟؟؟\"اول امبارح وكانت مصدر مهم جدا لكل من يحتاج الى كتاب دينى ،ولا مسمعتيش عن الطلبة بتوع الازهر اللى ضيعت الحكومة عليهم السنة ورمتهم مع المجرمين رغم انهم من المتفوقين وكان منهم طلبة منتظرين التعيين فى كلياتهم بعد التخرج السنة دى ؟طبعا كل النماذج اللى فاتت الحكومة الظالمة بتاعتنا قهرتهم لانهم من الاخوان المسلمين او بيشتغلوا مع ناس من الاخوان ،يا الف خسارة على بلد بتعامل ولادها بالشكل ده ،وجايين زعلانين على مجموعة لاعبين انضربوا ،طيب ما المصريين بيتعلقوا كل يوم وتتهان كرامة اللى خلفوهم جات على كام لاعب اتبهدلوا ،طبعا انا مش موافق على اللى حصل ،لكن هما اللى بيتبهدلوا فى ام البلد بتاعتنا ويموتوا من الجوع وتتقفل مصادر ارزاقهم مش بشر علشان تدافعوا عنهم ولا ايه؟؟؟؟؟؟"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130143807/http://masr.20at.com:80/article.php?sid=1490"

[[comments]]
order = 7
subject = "سجونيك يا مصر"
author = "حسني مبارك"
posted = "2007-01-25"
text = "القسم الثاني<br />السجون محل الرصد .. وأوضاع السجناء والمعتقلين داخلها<br />أولا :<br />السجون محل الرصد<br />يتناول هذا التقرير بالرصد أوضاع السجناء والمعتقلين داخل أحد عشر سجنا ، من بينهم ثلاثة سجون مغلقة هي :<br />(1)<br />سجن شديد الحراسة ـ بطره<br />سبع سنوات من العزلة ..<br />يتصدر سجن شديد الحراسة ـ بطره قائمة السجون \" سيئة السمعة \" في مصر بسبب سجله السيئ في مجال انتهاك الحقوق الإنسانية للمحتجزين داخله . وهو سجن مخصص بحسب فلسفة بنائه وتشييده لإيواء أشد العناصر \" الإرهابية \" خطورة من وجهة نظر وزارة الداخلية ، وبهدف عزلهم نهائيا عن باقي السجناء والمعتقلين بل عن المجتمع خارج أسوار السجن . و رغم عدم وجود معلومات مؤكدة حول سبب إطلاق لفظ \" العقرب \" على سجن شديد الحراسة .. إلا أنه من المؤكد أن المحتجزين داخله رصدوا أوجه تشابه عديدة بين ما يجري داخل هذا السجن وبين لسعة العقرب .<br />ويقع سجن شديد الحراسة داخل نطاق سجون منطقة طره ، التي تضم بالإضافة إلى السجن المذكور سجون : استقبال طره ، مزرعة طره ، سجن ملحق المزرعة . ويبعد سجن شديد الحراسة حوالي 2 كم عن باب منطقة سجون طره ، وتم الانتهاء من بناء السجن في 30/5/1993 وافتتح في 26/6/1993 ويضم السجن 320 زنزانة للحبس الانفرادي موزعة على أربعة عنابر ، ويتخذ العنبر شكل H ويضم 80 زنزانة تبلغ مساحة الزنزانة 2.5×3 وارتفاعها 3.5 متر .<br />وحسب وثائق وزارة الداخلية ، خصص السجن منذ افتتاحه في 26/6/1993 لإيداع \" المسجونين الخطرين وهم من يخشى هروبهم وممن سبق لهم الهرب أو الشروع فيه أو الاعتداء على المسجونين أو الحراس أو العاملين بالسجن وتهديدهم ، وكذلك الذين تطلب جهات الأمن أو النيابات المخصصة إحكام الرقابة عليهم لخطورتهم ، كما يودع به حاليا الخطرون من ذوي ال<br />اقرأ بقية التعليق .."
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130143807/http://masr.20at.com:80/article.php?sid=1490"

[[comments]]
