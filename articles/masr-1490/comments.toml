[[comments]]
order = 11
subject = "لا للفقر..لاللبطالة..لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-01-25"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو الوسيلة الوحيدة للتوظيف<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />من الاخر ياناس ده قانون ظالم وسيهدم اركان المجتمع الذي يقوم علي الاستقرار الي مجتمع يقوم علي التعاقد المؤقت ثم الي الشارع انت واسرتك ايه الموظف المسكين."
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130143807/http://masr.20at.com:80/article.php?sid=1490"

[[comments]]
order = 12
subject = "أخي \"مصري سيدك\" تحية"
author = "عمران شلقم"
posted = "2007-01-26"
text = "هداك الله يا أخي، الحماقة ماليها وطن ولاجنسية، عندنا وعندكم والحمد لله كفاية، ما لينا دعوة بالزعماء منا ومنكم، دول يروحون ويجون غصب عنا وعنكم، إن جاهل وقح من ليبيا قل أدبه، لا وإيش تلعن الشعب الليبي كله؟<br />أخي الشعوب إخوان يظلوا الدهر ما يزعلون، همه الرؤساء يرحلون لجنهم. والله ما أعرف واحد ما هو حزين ومكسوف من الحاصل أخي.<br />ربنا يلم شملنا ونصير شعب عربي واحد من خليجها لمحيطها.<br />عمران شلقم<br />طرابلس"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130143807/http://masr.20at.com:80/article.php?sid=1490"
