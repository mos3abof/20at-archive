subject = "الاخ اللى فوق"
author = "ابن عنتر"
posted = "2007-01-25"
text = "تقريرك رائع عن السجون<br />اية التقدم الخطير اللى وصلنا لة فى بناء وعمارة السجون والمعتقلات<br />حاجة تشرف<br />طيب وبناء المستشفيات والمدارس ودور الايتام لية حالتها تعبانة وايلة للسقوط<br />هل نتقدم نحن ام نتاخر<br />لماذا سبقنا العالم كلة فى خبرات التعذيب وانتهاك حرمات البشر<br />يظهر ان مفيش فايدة<br />عطينى يا صفية وصوتى"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130143807/http://masr.20at.com:80/article.php?sid=1490"

[[comments]]
order = 9
subject = "لييا مش زي زمان"
author = "حسن المكيور"
posted = "2007-01-25"
text = "السلام عليكم<br />أولاً : التهكم على الغير حرام<br />ثانياً الظلم حرام<br />ثالثاً أصل الموضوع مبالغ فيه فإن ما حدث في الدورة العربية الثالثة كان من صنع مصري 100/100 والغرض منه هو إفساد البطولة فقط لاغير لأنها كانت أنجح من البطولات السابقة وتعرفون أين قامت<br />وأقول للسفهاء الذين يلفظون بأسم القائد البار معمر القذافي ( مصمص فمك بالزهر قبل ما تجبد أسمه ) لأن معمر القذافي أكبر منك يا جاهل<br />وبالنسبة لإعدام البلغاريات فهذا قانون ليبي حر لا تجوز عليه الضغوطات الأوربية مثل ما يحدث في معظم الدول العربية<br />يعني أحنا أسياد أنفسنا ولا نضع سياسات المال والإقتصاد في المرتبة الأولى نحن نضع مبداء الشرف<br />دامت ليبيا ودام معمر القذافي رغم أنف الحاقدين<br />حسن المكيور - ليبيا"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130143807/http://masr.20at.com:80/article.php?sid=1490"

