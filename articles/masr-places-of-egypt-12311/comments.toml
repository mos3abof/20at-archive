subject = ""
author = "انتهى عصر المكتبات"
posted = "2009-06-09"
text = "اى معلومة الانسان يحتاجها بيدور عليها على النت - والعملية مش محتاجة كتب ولا شغل اماكن فى البيت واللى عندة شوية كتب يروح يرميهم فى الزبالة لان معلوماتهم قديمة والجديد موجود فى النت وفى مكتبات العالم الاليكترونية<br />الناس بتتقدم وبتعمل مكتبات اليكترونية تاخذ منها المعلومة اللى هى عايزاها فقط مش تكوم كتب قديمة فى البيت"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621070122/http://www.20at.com:80/masr/7eta-mn-baladi/12311-2009-06-08-12-51-26.html"

[[comments]]
order = 1
subject = ""
author = "محمود زايد"
posted = "2009-06-25"
text = "وإنْ تقدمت المعلومة الألكترونية تقدماً على تقدمها سيظل الكتاب هو الموئل الرئيس والمصدر الأساس لأي مرجعية علمية، مصداقياً وصحياً في وضع ممتع بسهولة ويسر. من هنا أزكي ما قام به السيد علي بدرخان المصي الجنسية الكوردي الأصل على هذه القيمة الثقافية العظيمة في هذا المكان بالذات، وبإذن الله سيكون هذا الصرح الثقافي مصدر اشعاع حقيقي وتطهير لمنطقة لم تشتهر إلا بالـ…<br />مع تحيات محمود زايد"
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218070008/http://www.20at.com:80/masr/places-of-egypt/12311-2009-06-08-12-51-26.html"

[[comments]]
order = 2
subject = ""
author = "عاشق الآمال"
posted = "2009-12-06"
text = "مساء الخير يا أستاذ<br />سعيد جدا بالمكتبة والسايت ده<br />ياريت فيه طريقة اتصال معاك علشان أقول لك شكرا يا بدر خان<br />تحياتى<br />عاشق الآمال"
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218070008/http://www.20at.com:80/masr/places-of-egypt/12311-2009-06-08-12-51-26.html"

