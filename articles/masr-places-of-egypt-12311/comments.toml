posted = "2009-12-08"
text = "انا سعيد جدا بيك وانا فخور ان على بدرخان شخصية مصريه من اصل سينمائى وقليل جدا ما نجد شخصية ذو قيمة فنية مثل شخصيتك . انا نفسى احضر مع حضرتك فى جمع ثقافى واتكلم معاك ."
archived = "2009-12-18"
