[[comments]]
order = 9
subject = "لا تنتظر الفرج فلن ياتيك الي بالدم"
author = "مصري"
posted = "2006-05-06"
text = "(ان الله لا يغير ما بقوم حتي يغيروا ما بانفسهم) صدق الله العظيم<br />ياشباب مصر يا احفاد مينا وقظز والناصر صلاح الدين واحمدعرابي وسعد زغلول ومصطفي كامل وعبد الناصر<br />مصر شهدت الكثير من الثورات ضد الحكام الفاسدين وعملاء الاستعمار وخدمهم , فهل سنغير التاريخ ونعيد مصر الي المصريين وليس الي بقايا الهكسوس والصـليبين؟؟؟؟؟؟,او سنظل في قاع الذاكرة البلد بلد ابونا ومبارك وحاشيته يركبونا؟؟؟؟؟؟؟"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224119/http://masr.20at.com:80/article.php?sid=276&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

