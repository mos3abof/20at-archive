order = 0
subject = "مين.......ال بعده....و ..ازاى"
author = "الاسكندرانى الاصلى"
posted = "2006-05-04"
text = "سيبك من ده كله و خليك فى المهم..مين حيستلم مصر ما هى مصر بقت زى العهدة الحكومية لازم سلم و أستلم ...بس المرة دى العهدة (ال هى أحنا ) عهدة مفيش حد عاقل يقدر يستلمها...شوفوا لنا حد ( مختل عقليا) يستلمنا..و احنا (العهدة) حنخليه يبقى اعق العاقلين....<br />ارجوا نشر هذا الاعلان فى كطل مكان<br />مطلوب مختل عقليا لوظيفة رئيس جمهورية...العاقلون يمتنعون"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224119/http://masr.20at.com:80/article.php?sid=276&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "تعليق على التعليق"
author = "واحدة من العهدة"
posted = "2006-05-04"
text = "والله برافو عليك بس ياترى المختل الذى نبحث عنه بيعرف يقرأ ويكتب ولا هيعرف أنه مطلوب الزاى. وعلى العموم ماهو الرئيس خربها وقعد على تلهاهو وأصحابه. وعلى فكرة مختل من محتل يا قلبى لا تحزن يعنى ممكن تلاقى قدامك محتل ويسمى نفسه مختل"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224119/http://masr.20at.com:80/article.php?sid=276&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "لو انت مكانة"
author = "بن الكفر"
posted = "2006-05-04"
text = "استاذي مجدي مهنا انت واحد من اهم الصحافيين الموجودين اللي عندهم كرامة وعزة نفس في مصر عايزك تفترض معايا انا كل الناس اللي يعرفوك اجمعوا على انك فاشل ولست صحافيا وانك منافق وتزور الاخبار وتقلب الحقائق كم ستبقى وستظل تكتب بعد سماع هذا وكيف اذا لم يكن ملاك الجريدة يريدونك ان تعمل لديهم هل ستستمر عنوة مابالك برجل لا يريدة 70 مليون مواطن ان يراسهم هل هذا يمتلك من الكرامة شئ او عزة النفس شئ؟؟؟؟؟؟؟!!!!!!!!"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224119/http://masr.20at.com:80/article.php?sid=276&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "لما>ا هذا الهجوم"
author = "الفرعون المصري"
posted = "2006-05-04"
text = "سيدي<br />لما>ا هذا الهجوم ال>ي لا نستفيد منة<br />نتكلم بالعقل والمنطق مع العلم انني غير حزبي ولا انتمي لاي مجموعة معارضة ولكن مصري أحب مصر وأعشق ترابها واعمل من اجل ازدهارها هذا انا<br />من منكم يقدر علي تحمل المسئوليةدي اللي عندي ولدين بيفكر مليون مرة فما بالك اللي عندي 70000000 فرد مشي مبارك مين يتحمل الحمل وبعدين هل كان الممكن ان نتكلم بالحرية في الحديث سيبكم من الكلام ماذا تفعلوا في مواجهة اسرائيل<br />لك الله يامصر"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224119/http://masr.20at.com:80/article.php?sid=276&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "مصر ولاده لزعماء رجالة"
author = "مصرى"
posted = "2006-05-05"
text = "مصر ولادة لزعماء رجالة كثير وإقرأ التاريخ علشان تعرف الفرق بينهم وتعرف مين إللى إنتمائه كان لمصر ومين إللى كان لأمريكا وإسرائيل وده من إنجازاتهم مش من الشكرانية فى نفسهم فمثلاً أمسك كفاح مصطفى كامل ولا محمد فريد ولا أحمد عرابى ولا سعد زغلول ولا أنور السادات وشوف هو عمل أيه فى فترة حكمه حتى الغريب إللى هو محمد على إللى عمله لسه عايشين فى خيره لغاية النهاردة وشوف إيه إللى وصلت ليه مصر دلوقتى وعلى يد حسنى مبارك ها تلاقى الفقر والبطالة والفساد وإنحدار كرامة المصرى ومكانته على فكرة أيام جمال عبد الناصر كانوا مايعرفوش غير أن العربى جاى من عند جمال عبد الناصر وكان بيتعمل للمصرى ألف حساب وحساب وشوف لما الدول دى تشوف المصرى وهو بيتهان وتشوف القاضى وهو بيضرب بالجزمة فى بلده ومن كلاب السلطة فين ساعتها كرامة المصرى ولما تلاقى الشركات والمصانع فى بلدك بتتباع برخص التراب والعمال بيطردوا بره ويزودوا البطالة أكثر ولما تشوف البؤس والفقر والمرض فى وجهوه فلاحين بلدك وتقارن دول بالبذخ والرخاء والعز إللى عايش فيه حسنى مبارك وولاده والفسدة من حوله ها تعرف إن مصر خلفت رجالة ومش هايرضوا بالفساد ده نهائى ولازم الإعتراض يكون بالصوت والحركة يعنى عايزنكم ياشباب فى مظاهرات فى مصر كلها عايزين إضراب عايزينهم يعرفوا إن أحنا مش عابيد أحنا أحفاد أحمد عرابى إللى قال لقد خلقنا الله أحراراً ولن نورث بعد اليوم."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224119/http://masr.20at.com:80/article.php?sid=276&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "يوم الشؤم"
author = "مصرية"
posted = "2006-05-05"
text = "لااعلم اى ذنب اقترفة المصريين حتى يستمر الحبس بعدالتأبيدة التى نعيشها تحت حكم هؤلاء الظلمة المفروض ان يطلق صراحنا بعد 25سنة لحسن السير والسلوك واحنا سايبينك ترعى فى البلد زى ماانت عاوز انت وشلة الحرامية اللى معاك ياأخى خلى عندك شوية دمواستقيل وقضى الكام يوم اللى فاضلين لك وانت بتتمتع بللى نهبتة من اموال الشعب على الاقل يبقى عندك شوية كرامه فى اخر ايامك يمكن تحسن بيها صورتك وتطلع ولو خطوه من قاع مذبلة التاريخ اللهم اجعلها آخر الاحزان وافرج عنا يااااااااااااارب"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224119/http://masr.20at.com:80/article.php?sid=276&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "فهد"
author = "مصرى"
posted = "2006-05-05"
text = "يا حاكم بلا إنتخاب ويا محتل للسلطة ويا من لا تمتلك الشرعية لوجودك أقول لك لقد تيقنا جميعاً أنك وصلت على أبواب الثمانين ولازلت عندك المقدرة للتحرك بدون كرسى كهربائى أو عصا كما يتحرك من فى سنك وأنك لا زلت تعرف أسمك كما لا يعرف كثير ممن فى سنك أسمائهم ولكنك للأسف الشديد لا تعرف أنك تحكم مصريين أحرار لن يرضوا بالذل والطغيان ويقولون لك أقرأ الدستور لتعرف كيف يجيء الحاكم للحكم برضا الشعب والإنتخاب وأنت لم تنتخب من قبل الشعب فى يوم ما إذا أنت غير شرعى للحكم فى مصر وأنصحك أن توفر المبالغ الطائلة التى تدفعها على مكياجك وصباغتك لشعرك وشد وجهك الكرية بالنسبة للمصريين كلهم وأقول لك عيش باقى عمرك بما نهبت من مال ولكن بعيداً عن مصر التى حتى ترابها سيلفظ جثمانك بعد مماتك ولن نسمح لك بتوريث الحكم لإبنك المفقد للشرعية فى وجوده بسبب إفتقادك أنت أصلاً للشرعية ونقول لك كما قال الزعيم أحمد عرابى لقد خلقنا الله أحراراً ولن نورث بعد اليوم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224119/http://masr.20at.com:80/article.php?sid=276&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

