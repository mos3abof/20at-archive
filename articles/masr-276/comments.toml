[[comments]]
order = 11
subject = "قرفان من حسنى مبارك"
author = "برضوا قرفان قوى"
posted = "2006-05-07"
text = "ها أقوله فى عيد ميلاده أيه هو يعنى ناقص إللى أنا ها أقولهوله لاكن برضوا هاقوله قاعد ليه على كرسى مش بتاعك الكرسى ده بتاع حاكم شريف علشان يرعى مصالح المصريين زى لما الدستور قال وقال كمان أن الحاكم ييجى بالإنتخاب وإنت لم تنتخب من الشعب وكمان زورت الإنتخابات علشان تفضل قاعد وهاقوله كمان إللى قاله الزعيم احمد عرابى لقد خلقنا الله أحراراً ولن نورث بعد اليوم وإن شاء الله عيد ميلادك هايكون آخر أحزان مصر"
