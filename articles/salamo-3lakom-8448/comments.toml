posted = "2009-05-15"
text = "Quote:<br />قال تعالي ( إن الذين يحبون أن تشيع الفاحشة في الذين آمنوا لهم عذاب أليم في الدنيا والآخرة … ) صدق الله العظيم<br />أنت وأمثالك عار على الإسلام لاتنتسبو ن إلى الإسلام في شيئ وأنت التافه والسفيه الذي أخبرنا عنه صلى الله عليه وسلم في الحديث الشريف<br />قال صلى الله عليه وسلم ( سيأتي على الناس سنوات خداعات يصدق فيها الكاذب ويكذب فيها الصادق ويؤتمن فيها الخائن ويخون فيها الأمين وينطق فيه الرويبضه قيل وما الرويبضة يارسول الله قال : الرجل السافه يتكلم في أمر العامة ) .<br />والله لقد نطق السفهاء ونطق الرويبضه وصدقت ياحبيبي يارسول الله وسيبقى الإسلام شامخاً إلى يوم الدين ولن يغبر عليه أمثالك العلمانيون الذين لم يخلوا منهم زمان أو مكان وسيعلوا قول الله دائما أبداً .<br />صدقت والله الله يخرب بيته هو وامثاله هما اللي بيبوظوا الاسلام ربنا يجازيه بما فعل"
archived = "2009-05-27"
