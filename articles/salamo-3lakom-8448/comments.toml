text = "اة طبعا انا مع كل اللى رفضو كلام الشيخ وانا متاكدة انه حرام وغلط طبعا بس يعنى كل اللى بيقول ان كلامه غلط بينفده يعنى مش معظم الشباب بتعمل كدة ومن غير حب وكمان بيعملو اكتر من كدة وبيبصو للبوس دة على انه حاجة عادية اوى زى السلام بالظبط وكمان اللى بيتفرجو عليه حاجات تودى فى داهية ياريت كل واحد يراجع نفسه ويعرف حياته عاملة ازاى ودة واحد خرف وقال حاجة غلط وكمان سنه كبير طيب ما احنا اهو صغيرين نراجع نفسنا بقى ونحاسب نفسنا ودة عيب فينا نفضل نذكر عيوب غيرنا وننسا عيوبنا"
