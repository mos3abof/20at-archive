text = "فتاوى اخر زمن<br />انا لا اصدق ان يوجد هذه الجراه على تبديل دين الله<br />ياايها الرجل اتق الله<br />اترضى هذا لامك او لاختك او لابنتك او زوجتك<br />وان ترضى هذا لاهل بيتك فانت ديوس<br />وان كنت ديوس ففى الامه رجال غيورين على نساء الامة<br />يا خنزير بطل اكل لحم الخنزير حتى يتحرر لحمك من الدياسة<br />انصحك ماتفتيش تانى الامه فى غنى عن فتواك<br />وهذا يزيد ايمانا من صدق كلام النبى صلى الله عليه وسلم ودى فايدة امثالك"
