text = "يا أيها المجنون إذا كانت النظرة سهم من سهام إبليس وهى اول الطريق للزنى فبماذا تعرف القبله وانا اجيبك برد بسيط ماذا سيكون منك لو دخلت على ابنتك ووجدتها مع شاب تقبله او مع شابه وتحمل فى يدها فتواك .<br />المشكله ليست فى هؤلاء المجانين فهم موجودين على مر العصور ومع مختلف الاوقات لكن المشكله فى اعلامنا الفاشل الذى يتيح الفرصه والمجال لمثل هذة الاقلام والعقول الخربه ولاادرى لمصلحة من يسمى هذا بمفكر واسلامى هلى الاسلام يحتاج لمفكرين الاسلام يحتاج لعلماء ربانين يعرفون خطورة الفتوى ومدى تاثيرها … نسأل الله الهدايه لنا ولهم"
