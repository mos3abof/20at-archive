text = "الولد لما حيبوس البنت … حيسخن وشهوتو تشتعل نار … وبعديين<br />فميقدرش يمسك نفسوا …وحيبدأ في صراع مع نفسوا: … أمارس الزنا<br />ولا دا حرام …امممممم…بس أنا مش قادر…يلا خليني امارس …<br />فمدام طلع البوس حلال …يمكن يكون الزنا هو كمان حلال مين عارف…<br />دا يمكن جمال البنا …حيقول كده بس هو خايف…"
