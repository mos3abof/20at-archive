posted = "2008-04-08"
text = "من الموضوعية والأمانه عدم وصف الرجل ونسبته للشيخ البنا مؤسس جماعة الإخوان فهذا يصنع التباسا لدى القراء ويربط بين جمال البنا وحسن البنا والإخوان وهو رابط غير موجود واقعيا.<br />أنتم هنا تناقشون أفكاره لا نسبه وعائلته ومن أبسط قواعد الموضوعيه ألا تقحم ما ليس له علاقه بالفكر. وإذا اقتضى المقال ذكر هذه العلاقه - وهو ما لا يتوفر هنا - فيجب ذكر موقف هذه الأطراف بأمانه لمنع الالتباس.<br />أما إذا كان صنع الالتباس مقصودا فهذا أمر آخر."
