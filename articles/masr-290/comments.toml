order = 0
subject = "عاش النفس أساتذتي"
author = "صلاح الدين"
posted = "2006-05-10"
text = "عاش النفس أساتذتي الأجلاء وكم تأخرت هذة الوقفة الشجاعة ؛فكم تألمت مصر قبلكم في كل مرة تنتهك سيادة الجامعة,وكم تاخرت مصر مع كل تصرف مخل ارتكبه أعوان الداخلية وكم أهدرت كرامة بلدنا العلمية واصبحنا في مؤخرة ركب التعليم وكنا ذات يوم غرة ناصعة في محياه مازال هناك الكثير الذييجب عمله لإعادة الحق إلى نصابه قبل خراب كل شئ ؛تقدموا والكل معكم والله ناصركم ."
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235512/http://masr.20at.com:80/article.php?sid=290"

[[comments]]
order = 1
subject = "الظلم بقا للركب"
author = "عبدالله مفتاح"
posted = "2006-05-12"
text = "كله عمال يظلم وكله عمال يسرق وكله عمال ينهب<br />قال زكريا عزمي قال الفساد بقا للركب طيب يا اخويا بص لنفسك الاول قبل ما تتكلم عن حد<br />لا للتمديد ... لا للتوريث... نعم لتعديل الدستور"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235512/http://masr.20at.com:80/article.php?sid=290"
