[[comments]]
order = 4
subject = "طزين تلات طزات"
author = "عبدالله مفتاح"
posted = "2006-04-11"
text = "في الاول انا لم انتمي لجماعة الاخوان ولا يوجد في عائلتنا الكريمه اي فرد ينتمي لها.<br />وبعدين لماذا كل من يذكر الاخوان ينفي انه يدافع عنها ؟<br />بما ان الكل يخشى ويتجنب الدفاع عن الاخوان سادافع عنها انا.<br />اقول كلامي دفاعا عن الاخوان كجماعه وفكر<br />نعم الاخوان افضل فكر على الساحه ونعم الاخوان اشرف جماعه على الساحه<br />لم نسمع ان اخوانيا قبض عليه في قضيه فساد بينما الحزب الوطني الذي ينتمي اليه عبدالله كمال وامثاله يفرخ لنا يوما بعد يوم قضايا فساد من ابنائه الابرار<br />ولو كان هناك مسؤول واحد فقط شريف في ماسبيرو كلها لاحضروا فردا من الاخوان ليرد ، ولكن هذه هي عادة حكومتنا الرشيده الالكترونيه فهي تسمع الراي فقط ولا تنظر الى الراي الاخر<br />سنظل نحب الاخوان ونحترم المرشد قال ذلك ام لم يقل<br />وسنظل نحتقر عبدالله كمال وحمدي رزق وامثالهم<br />ولن يزيدنا كلامهم سوى كرها لهم وحبا في الاخوان وكل ما يتعلق بالاخوان<br />وطزين تلت طزات"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 5
subject = "الرد قادم"
author = "مش إخوانجي"
posted = "2006-04-11"
text = "يُشارك الدكتور عبد المنعم أبو الفتوح- عضو مكتب الإرشاد بجماعة الإخوان المسلمين- في برنامج (العاشرة مساءً) اليوم الثلاثاء 11/4/2006م بقناة (دريم 2) الفضائية حول ما جاء في برنامج \"البيت بيتك\" أمس الإثنين وحوار فضيلة المرشد العام للإخوان المسلمين الأستاذ محمد مهدي عاكف لجريدة (روز اليوسف).<br />ويشارك أيضًا في البرنامج الدكتور ضياء رشوان، والدكتور عمرو الشوبكي- الخبيران في مركز الدراسات السياسية والإستراتيجية بـ(الأهرام).<br />كان برنامج \"البيت بيتك\" قد أذاع في حلقته أمس الإثنين حديثًا منسوبًا إلى فضيلةِ المرشد العام الأستاذ مهدي عاكف وأثار ردودَ فعل متباينةً بشأنه.<br />منقول من إخوان أون لاين .. وربنا يستر ."
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 6
subject = "القضاء على اعداء الحزب الوطني"
author = "معارضة"
posted = "2006-04-11"
text = "الصراحة انا شايف ان روز اليوسف كانت من ايم الرئاسة و هي بتشوه صورة اي حد يقول لأ للحزب الحاكم و بعد القضاء على ايمن نور رئيس حزب الغد و التفكك الي حصل في حزب الوفد و الي حصل ل نعمان جمعه متبقاش غير الاخوان الصوت الاعلي في البرلمان فافتكروا الحديث الي بقاله 5 شهور و نشروهو بكده يبقى الحزب الوطني بيقضي على شعبية كل الي بيقوله لأ بطريقة منظمه جدا و انا مش حيتغير اي شئ من موقفي اتجاه الاخوان لانهم من اكثر الناس احتراما في مصر"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 7
subject = "بتنجان فى بتنجان"
author = "السلام عليكم ورحمه الله وبركاته"
posted = "2006-04-11"
text = "اصلا الصحفيين بتوع الصحف اياها غير موثوق فى كلامهم وحتى لو كان قالها اى شخص ممكن فى لحظه نرفزه تتطلع منه كلمه مش مقصوده... اما الاخ بتنجان انا مش عارفه ايه الاراء الغريبه بتاعته دى بنات ايه وانتخابات ايه .. واضح انه مكنش موجود فى مصر وقت الانتخابات الاخيره ومشفش المهازل اللى حصلت على مرأى ومسمع من الحكومه.. وبعدين سؤال للاخ بتنجان بقى.هو انت عمرك مااتنرفزت وقلت كلمه غير مقصوده فى حق مصر ولا غيرها مع انك بتحبها؟؟؟ ولا همامالقوش فى الورد عيب قالولوا يا احمر الخدين. عموما بكره تشوفوا ان نهضه البلاد مش هتقوم غير على ايدين اللى بيسموهم ارهابيين دلوقتى"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

