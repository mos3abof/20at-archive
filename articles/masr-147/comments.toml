[[comments]]
order = 20
subject = "إنك أحب بلاد الله إلي قلبي"
author = "أخوانجي إسكندراني"
posted = "2006-04-12"
text = "الأخوان المسلمون يرددون شعارا جميلا ويحاولون جاهدين أن تكون ألفاظ شعارهم مطابقة لحياتهم التي يحيوها فحينما نسمع في شعارنا الرسول قدوتنا فنحن نعنيها أي أن النبي قدوة لنا في كل أقوالنا وأفعالنا .. ما دفعني لقول هذا هو موقف الحبيب صلي الله عليه وسلم حينما أضطره قومه لترك بلده التي ولد وتربي ونزلت عليه الرسالة فيها فقال صلي الله عليه وسلم ( والله يا مكة إنك لأحب بلاد الله إلي قلبي ولولا أن أهلك أخرجوني منك ما خرجت ) ويقصد الحبيب بأهل مكة سادتها وكبرائها الذين تحدوا الإسلام ووقفوا له بالمرصاد .. وهذا بكل أسف هو واقعنا فنحن الإخوان نحب بلادنا ليس لإعتبارات دنيوية كما يراها البعض وفقط ولكن طمعا في الأجر والثواب لأننا بذلك نطبق سنة من سنن النبي الفعلية وهي حب الأوطان .. من أجل هذا أقول أنه لا يستطيع أحد أن يشكك في حب بل عشق الإخوان لبلادهم فضلا علي أننا لا نتحدث عن أخ عادي بل نتحدث عن مسئول الإخوان في العالم لذلك لابد أن نتحري الدقة ونحن نصرح تلك التصريحات العجيبة لأنه لم يثبت علي الرجل بشكل أكيد قوله لهذه الكلمة .. حتي ولو فرضنا جدلا أنه قالها فما يدرينا لعله يقصد النظام الذي يتمني كل غيور علي مصر أن يقول له عشرة ألاف مليار طز.. أو أن يقصد الوضع المتردي بسبب سياسة النظام الفاشلة .. وحتي لو أفترضنا الأسوأ وهو أن فضيلة المرشد قصد مصر ومن في مصر ألا تعد تلك ذلة لسان .. أليس المرشد العام بشر يصيب ويخطئ .. عموما لابد من الحكم علي الأشياء علي حسب فهمنا للأمور وكذلك ما تقتضيه المصلحة العامة<br />وجزاكم الله ألف خير"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 21
subject = "لازم نفرق"
author = "عبدالله مفتاح"
posted = "2006-04-12"
text = "لازم نفرق بين واحد قال طز في مصر وقاصد انها تغور ومش هماه وعايز يحرقها<br />وواحدتاني صحفي غلس قعد يستفزه وهو راجل تقريبا مقرب على 80 سنه راح قايل طز في مصر<br />ايه يعني هو المرشد قصد بطز ان مصر تروح في داهيه لا طبعا<br />دي كلمة في لحظه نرفزة زي اي واحد فينا بيشتم في مصر<br />بجد مش حاسين بالفرق ؟<br />مصيبه"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 22
subject = "الصحفيين الأحرار والقلم البتار يا عبد الجبار"
author = "أخوانجي وإخبط راسك في الحيط ياللي في بالي"
posted = "2006-04-12"
text = "تم القضاء علي انفلونزا الطيور<br />تمت محاكمة اللي قتلوا الناس في العباره<br />تم محاسبة اللي حرقوا الناس في بني سويف<br />تم محاسبة اللي حرقوا قطار الصعيد<br />تمت محاسبة كل من نهب أموال مصر وقال يا فكيك علي برا<br />تمت محاسبة ابو كرش وابو ضهر ساندو واللي النقيب خالو<br />تم الإفراج عن المعتقلين والصحفيين وتم وإلغاء الطواريء<br />تم وقف التعذيب والإهانه اليوميه للمصريين في اقسام الشرطه<br />تم محو أمية 60% من الشعب المصري<br />تم رفع مستوي معيشة كل مصري الي حد الكفاف يدوب 400 جنيه مش عايزين اكتر<br />هذا وبعد كل هذه الانجازات فقد تفرغت اجهزة اعلامنا الموقره بقيادة الأشاوس رؤساء مباحث افريقياوكاس العالم السادة اللواءات عبد الله كمال,تامر بسيوني وكل العاملين في هذه الحظيره الموقره بالدفاع عن مصر واللي جابو مصر واللي في مصر من الإخوانييييين الوحشيييييين اللي قالو طظ (إذا كانوا قالو اصلا)"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 23
subject = "يا نيفيى"
author = "صايع بر و بحر"
posted = "2006-04-12"
text = "يا نيفين يا أختى حق إيه اللى بتتكلمى عليه ده إنتى لو دخلتى قسم شرطه زى أى مواطن و كأنك داخله أستغعر الله العظيم تتحسبى يوم القيامه يا نيفيي ما بالك بمن دخلوا المعتقلات و نزعت أظافرهم و هتكت أعراضهم و أذلوا على مدى عشرات السنين ... أنتى لو تعرضتى لتقطيع جيبتك أو بلوزتك و هتك عرضك فى الشارع أم ألاف الاعين و تبعثر لحمك فى عز الضهر و تحت الرعاية الكاملة لمن هم المفترض أن يدافعوا و يسهروا على أمنك ... إنتى مش هتقولى طز فى مصر إنتى هتقولى ________ و أترك لكى ان تكملين ما فوق السطر (و طبعا لا أقصد مصر المكان و لكن مصر الاشخاص و الحكام و لذلك لزم التنويه"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 24
subject = "مواطن"
author = "مواطن"
posted = "2006-04-13"
text = "أبي الوطن<br />أمي الوطن<br />أنت يتيم أبشع اليتم إذن<br />أبي الوطن<br />أمي الوطن<br />لا أمك احتوتك بالحضن<br />ولا أبوك حن!<br />أبي الوطن<br />أمي الوطن<br />أبوك ملعون<br />وملعون أبو هذا الوطن!<br />نموت كي يحيا الوطن<br />يحيا لمن؟<br />لابن زنى<br />يهتكه.. ثم يقاضيه الثمن؟!<br />لمن؟<br />لاثنين وعشرين وباء مزمناً<br />لمن؟<br />لاثنين وعشرين لقيطاً<br />يتهمون الله بالكفر وإشعال الفتن<br />ويختمون بيته بالشمع<br />حتى يرعوي عن غيه<br />ويطلب الغفران من عند الوثن؟!<br />تف على هذا الوطن!<br />وألف تف مرة أخرى!<br />على هذا الوطن<br />من بعدنا يبقى التراب والعفن<br />نحن الوطن !<br />من بعدنا تبقى الدواب والدمن<br />نحن الوطن !<br />إن لم يكن بيتاً كريماً آمناً<br />ولم يكن محترماً<br />ولم يكن حُراً<br />فلا عشنا.. ولا عاش الوطن!"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 25
subject = "الاخوان اكشفوا"
author = "مرسى"
posted = "2006-04-19"
text = "الاخوان اكشفوا امام الشعب المصرى الحمد لله<br />واكبر دليل على ذلك قراءة التعلقيات يكتبوا على دعايهم الانتخابيه معا نحمل الخير لمصر ويرضون له بالشتيمه بل تبريره<br />وقد قراءة ان الاخوان جماعة قامه على السمع والطاعةولم اتصور ان تصل بهم ان يهنوا بلدهم الى هذة الدرجه<br />مصر العزيزيه لى وطن<br />وهى الحماه وهى السكن<br />بلدى بلدى لكى حبى وفواءدى"
archived = "2006-04-21"
capture_url = "https://web.archive.org/web/20060421085340/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 26
subject = "طالما مصر كدة"
author = "مصرى"
posted = "2006-04-24"
text = "ما قاله المرشد العام للإخوان بسبب حالة مصر دلوقتى فهو يصف حالة التخلف والجمود التى وصلت ليها البلد فكيف لشعب أن يرى بلده تنهب وتسرق وتكمم أفواه ابنائها وتزور بها الإنتخابات والشعب فى صمت وكأن الحاكم الفاسد يحكم بلد بلا شعب أنه لا يسب مصر أو المصريين ولكنه يصف حالة التردى التى وصلت لها مصر ولا تنسوا أن الإخوان يحفرون فى الصخر لكى يحطموا أصنام الفساد فى مصر ويكفى أن النظام الفاسد الموجود فى مصر لا يزال يطلق عليهم الجماعة المحظورة رغم حب الشعب لهم وثقتهم فيهم وترشيحهم لهم فى الإنتخابات ولولا تزوير الإنتخابات لكان الإخوان إكتسحوا كل المقاعد بثقة الشعب فيهم والذى أتمناه الأ ترددوا فلتات الألسن المقصود بترديها هو تشويه صورتهم كما فعل النظام مع حزب الغد وحزب الوفد حتى يدمروا كل الأصوات المضادة لهم ولا تنسوا أن من أخواننى الأقباط من يعنيهم تشويه صورة الإخوان بالدرجة الأولى ولكن والحق يقال هم فئة تتقى الله فى أبناء مصر."
archived = "2006-04-24"
capture_url = "https://web.archive.org/web/20060424155728/http://masr.20at.com:80/article.php?sid=147"

