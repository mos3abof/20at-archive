[[comments]]
order = 9
subject = "وكم ذا بمصر من المضحكات"
author = "إيهاب"
posted = "2006-04-11"
text = "بعد الحمد لله والصلاة والسلام على رسوله<br />اولا فيه شوية اسئلة على الموضوع في منها طرحها السابقون وهي :<br />1- لماذا لم يحضروا احد من الاخوان لمناقشته كما في العاشرة مساءا ؟<br />2- لماذا لم يذكر الصحفي الهمام اسم الجريدة اللي تم معاها الحوار ؟<br />3- لماذا لم يتم نشر ذلك في وقته خاصة انها كانت فترة هجوم رسمية على الاخوان وكانت هتحقق مكاسب في الانتخابات ؟<br />4- لماذا لم يعرض الصحفي السؤال الموجه للمرشد ورده على السؤال كاملا ؟<br />5-لماذا يغض الطرف عن كل مميزات الاخوان وايجابياتهم وحسانتهم ونسلط الضوء على سلبية صغيرة جدا هذا افتراض جدليا ان المرشد قال هذا الكلام ؟<br />6- لماذا لا تقام محاكمة علنية لفكر الاخوان المسلمين حتى نعلم الصالح من الطالح ؟<br />7- هل من المعقول ان جماعة له 88 نائب في البرلمان تظل تعامل على انها جماعة محظورة ؟<br />نهاية الموضوع ليه ناخد اي حاجة خاصة بالاخوان بحساسية زايدة دعونا نستخلص الدروس المستفادة من كل هذه الاحداث في التعرف على فكر الجماعة ونأخذ منهم ونسمع منهم ولا داعي للشائعات"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

