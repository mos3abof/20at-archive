text = "أنا ملاحظة يا جماعة إن كل ما الدنيا تهدى حول الإخوان يعاد تانى فتح النار عليهم فبعد برنامج حالة حوار وتقطيع فروة الإخوان مع عدم وجود شخصية إخوانية واحدة تدافع عنهم و انتقاد الناس الشديدللبرنامج بدأوا تانى يقوموا الدنيا تانى بنفس الطريقة للأسف التليفزيون المصرى أثبت بصراحةإنه فى منتهى الغباء لإنه مبيتعلمش من أخطائه والمفروض نحاكم كل القائمين على البرامج دى بتهمة الغباء السياسى و على العموم ربنا معاكوا يا بتوع الإخوان ودع الكلاب تنبح والقافلة تسير وجزاكم الله خيرا"
