[[comments]]
order = 14
subject = "أطزز واحد فى مصر !!"
author = "الشمحطجى"
posted = "2006-04-12"
text = "يا صلاة النبى احسن !!<br />فى البداية ازيك ياعم براء<br />الحاجة التانية...طز دى يا ريس براء كلمه اصلها تركى ومعناها \"ملح\" والمناسبة الى اتقالت فيها ان والينا التركى من زمان قبل عهد محمد على كان فى زيارة لبورسعيد وإلِى ربنا كرمه وزار بورسعيد قبل ما يدخل المدينة البازلة بيجى اربع ولا خمس محطات اتوبيس يلاقى على إجناب الطريق يمين وشمال السياحات بتاعة الملح على مد الشوف وكان الكلام ده فى الصيف فصاحبنا الوالى انبهر ان التلج بيطلع فى مصر فى عز الصيف والدنيا قايدا نار فكان لما يشوف السيَاحة بتاعة الملح يهتف ويقول \" إيه ده فالاد ؟! \" يقوم رادد عليه واحد مصرى ويقوله \"\"ده طز يا باشا !\"<br />المهم مطولش عليك ..قول طول !!<br />هو ده يا سيدنا معنى كلمة طز ...يعنى من الآخر الكلمة لا هى بزيئة ولا حاجة ولا تجرح المشاعر الروهيفة لمولانا عبدالله كمال ولا سيدنا سعيد شعيب والأتنين لامؤخزة انجس من بعضيهم !!<br />وبالنسة لعمنا مهدى عاكف الراجل مكفرش يعنى لما قال طز فى مصر وهو صحيح غلط ان مقالش 92 مليار طز بعدد الدولارات إلى اهربت بره مصر خلال العشر سنين إلى فاتو ولا الف وتلميت طز بعدد الناس الى ادفنت فى البحر فى حادثة العبارة الى صاحبها فلسع ولا اربع تلاف طز بعدد الناس الى اتشوت فى القطر بتاع الصعيد ولا خمسين طز بعدد الناس الى اتنصبتلهم المحرقة فى مسرح بنى سويف ولا خمسة وعشرين الف طز بعدد معتقلى النظام الى دخلو السجن وهما اطفال وشابو وهيموتو ولسة مخرجوش ولا خمسة وخمسين طز بعدد السنين الى النظام الوسخ ده قاعد فيها على قلب المصريين ولا طز بعدد ضحايا النظام ابن ***** \"لامؤخزة\" الى محتل مصر بقاله اكتر من خمسين سنة !!<br />فيا عم براء مش هنمسك للراجل على كلمة قالها فى حين ان افعال النظام الى حول الصحافة لعربيات أجرة تلمع<br />اقرأ بقية التعليق .."
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 15
subject = "اطزز واحد فى مصر !! 2"
author = "الشمحطجى"
posted = "2006-04-12"
text = "الجزء التانى \"لامؤخزة\"<br />فيا عم براء مش هنمسك للراجل على كلمة قالها فى حين ان افعال النظام الى حول الصحافة لعربيات أجرة تلمعه وتهشكه ومنها الصحيفة الى اتنشر فيها الحوار إياه !<br />وبالنسبة للاخ تامر بسيونى .. هو من الاساس مظهر من مظاهر الفساد فى البلد \"المطززه\" دى بص كده على التليفزيون هتلاقيه متقسم عائلات يعنى مثلاً عيلة بسيونى متعينلها فى التلفزيون ثلاثة اخوات مذيعين واربعة ولاد عم فى الاعداد وهندسة الصوت غير ولاد الخالة والخلان ...!!<br />فالبيته من إزاز ميحدفش الاخوان بالطوب !!!<br />من الآخر البلد لا فيها امل ولا اى ريحة اصلاح جاية والايام الى جاية اسود من قرن الخروب .<br />وسمعنى اغنية \" أطزز من كده إيه ؟!\"<br />اطزز واحد فى مصر !<br />الشمحطجى"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

