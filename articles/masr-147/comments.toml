order = 16
subject = "أصل كلمة طز (منقول من موقع بس نسيت اسمه )"
author = "طز في اللي مش عاجباه مصر أم الدنيا"
posted = "2006-04-12"
text = "أصل كلمة \"طز\" مأخوذة من اللغة التركية ومعناها ملح الطعام وتكتب باللغة التركية هكذا - toz نظرا لأن اللغة التركية اعتمدت الاحرف اللاتينية منذ عهد كمال اتاتورك.<br />فقد كان الأتراك عندما كانت لهم السيطرة وحكم بلاد العرب وخلال مراكز ونقاط التفتيش يمر العربي من امام العسكري التركي وهو يحمل اكياس الملح يشير إليه التركي بيده سامحا له بالدخول وهو يقول للجندي التركي: \"طز طز طز\" فيرد المواطن العربي \"طز\" اي إن ما يحمله هو فقط ملح فيسمح له بالمرور دون تفتيش!<br />وفي رواية اخرى يقول الكاتب أميل حبيبي انه أثناء الحرب العالمية الأولى كان الجباة الأتراك يداهمون البيوت في فلسطين بحثا عن المؤونة لفرض الضرائب عليها وهم يفرضون الضريبة على أكياس القمح والشعير والسمسم والفول والحمص والملح. ولكن اقل ضريبة كانت على الملح، ومن اجل التهرب من الضريبة كان الفلسطينيون يدعون ان أكياسهم مليئة بالملح وحده وهكذا يدخل الجابي فيدور الحوار التالي مع صاحب الدار:<br />ماذا في هذا الكيس؟<br />ملح!<br />فيصرخ الجابي بمرافقه: سجل طز!"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 17
subject = "عدوها يا جماعه"
author = "ابن البلد"
posted = "2006-04-12"
text = "بصراحه قالها مقلهاش ....مش مهم<br />اهم سؤال اشمعنا نشرتها الجريدة الحكوميه روز اليوسف في الوقت ده بالذات<br />ولو فعلا الحوار حر و ديمقراطي وفيه كلام عن مبارك ، ليه المانشتات الرئيسية في الحوار كلها كانت عن كلام المرشد..<br />هوا فعلا المرشد عصبي نسبياً وده عادي ، راجل اتسجن 25 سجن في عمره والباقي كان عايشها بره بلده ، اللي سجنه مصريين و وطنيين زي ما بيقولوا ، و اللي اجبره انه يخرج بره بلده مصريين و ووطنيين زي ما بيقولوا ،<br />الراجل بيقولوا انه قال طز في مصر و اللي في مصر<br />ايوا يا سيدي ، طز في مصر واللي في مصر فعلا ، لان بلد شعبها معرفشي ساكت ليه لغاية دلوقتي يستاهل انه يتقاله طزين ومليون طز .<br />يا سيدي انا بشتم مصر باللي فيها اكتر ما بشتم اليهود .....<br />وقال ايه ....عبداله كمال هوا اللي ناشرها....دودو مين ده ..انا اشك ان الراجل ده مصري اصلا ...لما هوا عامل انه وطني وابن بلد و حريه ودموي قراطيه وكلام فاضي من ده ، جت علي دي يا كمال ، يا سيدي روح شوف قانون الطواريء ، شوف المعتقلات ، شوف البلاوي الطين اللي حصلت في الانتخابات .....<br />يا عمي روح شوف حاجه تعملها تانيه غير الصحافه ، ربنا يهديك يا كوكو او يهدك..<br />وفي الختام لو قالها عادي ، لان احنا بنقلوها احنا كمان كل يوم ، ولو كان عمو كلين اللي قالها مش كان حد هيكلمه ، طيب ما هوا انكل كلين راح يونيتد ستيتس وقال ان احنا غير ناضجين ، اقول ايه ولا ايه ..<br />البلد دي طز فيها باللي فيها ما عدا العشريناتيه طبعا......"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 18
subject = "طز ولكن"
author = "نيفين"
posted = "2006-04-12"
text = "لا يا جماعه فيه وقفه<br />مش من حق عاكف و لا الف زيه مهما علا او انحط قدره ان يقول طز فى مصر او المصريين<br />طز ف اللى ناهبين البلد<br />طز ف اللى مهربين الملايين<br />طز ف التعتيم المتعمد<br />الف طز ف قا نون الطوارىء<br />مليون طز ف العملاء و الحاشيه و الحراميه<br />طز ف الفساد<br />ظز ف الغلاء<br />مصر بلد المليون طز<br />لكن طز ف مصر او المصريين لا و الف لا"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

