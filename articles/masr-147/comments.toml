[[comments]]
order = 0
subject = "خضرا الشريفة"
author = "ابن عاشور"
posted = "2006-04-11"
text = "أود أن أستفتح التعليقات فأقول، إن هؤلاء الصحفيين من طائفة المخبرين درجة تالتة الذين يعيشون في دور خضرا الشريفة اللي بتموت في حب مصر يستكملون المسيرة مسيرة الولاء لأسيادهمفالحملة ليست بعيدة عن شنب الأجهزة الأمنية الشريفة العفيفة في مصر<br />أما التسجيل فيأتي في إطار الحملة الحكومية لتصفية الحسابات مع الخصوم، والانفراد بالساحة- قال يعني هم مش منفردين غصب عن اللي خلفونا- ليقوم النظام بعد ذلك بخوض مبارياته ع الحلبة السياسية ضدنفسه..ويااااه النظام بيتعب قوي وهيفوز على نفسه بعد كدة..الله يكون في عونهم..هو دا سياق التسجيل يا سادة في نظام سافل ومنحط زي النظام اللي بيحكمنا..<br />وسلملي على خضرا الشريفة"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 1
subject = "وماذا تنتظرون"
author = "بتنجان"
posted = "2006-04-11"
text = "وماذا تنتظرون من مرشد جماعة إرهابية مثل الإخوان<br />الاخوان سيظلوا ارهابيين للابد<br />وحتى شوفوا ماذا فعلوا في الانتخابات البرلمانية السابقة<br />عايزين يحجبوا البنات بالعافية<br />وعايزين يقولوا على كل حاجة اسلامية غصب عن كل الناس<br />وميعرفوش حاجة عن الاسلام<br />يبقى مش طز في مصر..<br />لا طز في اللي يقول كدة<br />وكله يقول.. مصر هتفضل غالية عليا"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 2
subject = "طز ؟؟؟؟؟؟"
author = "مش إخوانجي"
posted = "2006-04-11"
text = "طز كلمة استخدامها ينحصر في أولاد الشوارع ؟؟؟؟؟؟؟؟<br />حاجة غريبة<br />أنا بسمعها من كل الناس بداية من أكثر مدرسين المدرسة إحتراما إلى أرفع وأكثر أساتذة الجامعة أدبا ..<br />كلمة لا تعني أكثر من الاستهزاء وعدم الاكتراث .<br />وعلى العموم ، الكلام مبتور .. ولسه الإخوان ما ردوش .<br />وربنا يخلي الإخوان ويخلي المرشد .<br />وحتى لو قالها .. هو المرشد مش من حقه يغلط ؟ \" كل ابن آدم خطاء \" .. مش ممكن يكون اتنرفذ ولا حاجة .. بس لو كان قالها يعتذر عنها لو كانت في سياق خاطئ .. ويبقى الإخوان كسبوا الجولة برضه باعتذارهم حيث ظهروا أمام المجتمع بمظهر من يخطئ فيعترف ويعتذر .<br />والصحفيين اللي أذاعوا الموضوع لسه مكتشفينه بعد 5 شهور ولا ايه ؟<br />على العموم هما أصلا تاريخهم مهبب ومش ناقص سواد زيادة .<br />والسلام"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

