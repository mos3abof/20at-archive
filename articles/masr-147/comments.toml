[[comments]]
order = 33
subject = "حبة \" طز \" ,, عند الجار !!"
author = "محمد كوول ,, طنطا ,,"
posted = "2006-11-18"
text = "(معنى كلمة طز) ,,<br />طز !<br />كلمة تركية و معناها \"الملح \"..<br />و يروى أن الحكومة العثمانية كانت تفرض ضرائب على التجار في جميع البضائع باستثناء (الملح) ..<br />فكان التجار العرب إذا مروا من عند المفتشين الأتراك يقولون لهم (طـز) !<br />أي لا يوجد معنا إلا ملح (والملح كما قلنا لم تكن عليه ضرائب) ..<br />وشيئا فشيئا صار التجار يقولونها بهدف السخرية من المفتشين الأتراك ..<br />وهكذا أصبحت هذه الكلمة تعني معنى سيئاً ..<br />هذه الكلمة تعني معنى سيئاً ..<br />بينما هي في الأصل ليست إلا بمعنى (ملح) !!!<br />Mister Cool"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216072255/http://masr.20at.com:80/article.php?sid=147&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 34
subject = "الإخوان الأعداء ,, أقصد الإخوه"
author = "بردو محمد كوول :)"
posted = "2006-11-18"
text = "بس حقيقي يا جماعه أنا أصبحت لا أفرق بين الإخوان وأبناء الحزب الحاكم ,,<br />أصبح يظهر لنا يوم بعد يوم الوجه الحقيقي والنيه الحقيقيه لهؤلاء \" الإخوان \" والذين لا يبحثون إلا عن شيئان :,<br />1) الحكم ,, 2) السيطره على موارد البلاد ,,<br />بل أننا لم نرى من وقت أن ظهروا في الساحه السياسيه في إنتخابات البرلمنا الأخيره ,, لم نرى منهم وفيهم رجل يمكن أن نثق به وبقراراته أو بعمى أصح ,, قدوه ,,<br />لذلك أنا أقول للإخوان وقياداته \" ملح \" ,,والحدق يفهم ,,"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216072255/http://masr.20at.com:80/article.php?sid=147&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
