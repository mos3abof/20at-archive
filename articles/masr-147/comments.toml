[[comments]]
order = 29
subject = "أيوة طز وستين طز"
author = "واحد مخنوق"
posted = "2006-06-11"
text = "أيوة ظز وستين طز لما يكون في بلد تعمل اللى بتعمله دا كله ليه ميكونش طز، البطالة والاقتصاد والسرقة والعنوسة والضرب والاعتقال والخوف والجبن والقضاة والتزوير واللى واللى لحد الصبح يبقى طز ولا مش طز<br />بلدي غلى على لما تحميني وانا مش لاقي اللى يحميني غير ان اقول يارب احميني<br />بلدي غاليه على لما توفري لي شغل بعد 17 سنة تعليم وقرف يبقى ليه مش طز<br />وغيرها وغيرها وغيرها<br />يبقى طز وستين طز ولا لأ"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030508/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 30
subject = "لنكن منصفين"
author = "ان الذي يتربص بكل حر يعمل لوطنه ودينه ومجتمعه لن يكون من الصعب عليه ان يدلس وان يكذب وان يلفق كلام ليس من الكلام وان يشهد شهادات الزور ليشتروا بذلك ثمنا قليلا من اولئك الاقزام في النظام الهرم الخائف والمرتعد من صوله الحق علي باطلهم وجبروتهم والذي لن يجد ووسائل اعلامه(السلولي) اعلام عبد الله بن سلول المنافق سبلا لاتخاذالتدابير الازمه للقضاء علي كل كلمه حق وكلمه حريه"
posted = "2006-07-18"
text = "ان المتابع لهذا الامر يجد ان حديث المرشد قد قص منه وتم التلاعب به لكسب موقف دنئ للنظام واتباعه من اجل التاثير في نهضه يقودها الاخوان من اجل تحرير هذه البلاد من مبارك واذنابه وكلابه من يريد ان يعرف الحق فليسعي الي ذلك وسيراه جليا"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030508/http://masr.20at.com:80/article.php?sid=147"

[[comments]]
order = 31
subject = "نصيحه للمصريين"
author = "الفلسطيني الثائر"
posted = "2006-07-20"
text = "السلام عليكم ورحمة الله وبركاتهاخواني المصريين الشرفاء ابناء الرئيس البطل جمال عبد الناصر ايها المصراويين النصراويين ايها الابطال عليكم الجهاد ضد من يسمى رئيسكم الغير مبارك هاذا العميل الامريكي الاسرائيلي انا اعلم وكل شعب فلسطين يعلم انكم لا تقبلو المهانه ونحن نعلق عليكم ايها الشرفاء امال كبيره"
archived = "2006-08-19"
