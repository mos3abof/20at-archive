subject = "وجعتكم قوى الكلمة"
author = "عابر القارات"
posted = "2006-04-12"
text = "يا حنتوسو خلاص روزا وجعتها الكلمة قوى ... طيب على الاقل الراجل قال كلمة الدور و الباقى اللى قعلها يعنى اللى \"عمل\" طز فى مصر يعنى اللى باع أصولها و مقدراتها و قبض عموله يعنى اللى غرق المصريين و قال طز فى أرواحهم و حقوقهم يعنى اللى سفه أحلام شبابها و همشهم و حصرها فى نغمة موبيل و صوت بيبعته لمخنثين علشان يفوز فى برامج هايفه يعنى اللى كمم أفواه الشعب و خلاه زى الشياطين الخرس شايفين لكن مش شايفين يعنى اللى أبد فى السلطة لأ و كمان عاوز ينطط أحفاده على الكرسى و كأنه إله خالد يعنى اللى خلا كلمة مصرى فى أى مكان فى العالم مرادف لكلمة \"صفر\" بعد ما كان الشعوب العربية بتتمنى بس رضى المصريين و يعنى اللى ... و يعنى .... و يعنى .... و أنا وإنتا"
archived = "2006-04-14"
capture_url = "https://web.archive.org/web/20060414173620/http://masr.20at.com:80/article.php?sid=147"

