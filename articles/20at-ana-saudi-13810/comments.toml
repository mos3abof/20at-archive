posted = "2009-11-23"
text = "اقتباس يزيد:<br />تستاهل القناة والفتاة . كانت حلقة وقحة من جد . وإلى الأمام أيها القضاء السعودي<br />امام مييين ما احنا عارفييين كويس ان 80% منكو شاذييين متزوجيين و مخلفيين و شاذين كبار و صغار … و قضاء سعودي ايش بس … انتو معاهم معاهم عليهم عليهم … لو سعودي صدم و لا سب اردني و لا هندي و لا مصري و راحو الشرطة ما يصيرله شي بالعكس ممكن كمان ياخد منهم فلوس … أقذر شعب في أطهر أرض … ما عرفت فيكم أكتر من 4 أو 5 كويسيين و الباقي شاذييين …يا راجل ده كان في شاذ عندو 50 سنة متزوج و مخلف و ابنه متزوج و كان يبيني أنا و صديقي ننام معاه بعد ماننام مع زوجته الاندونيسية …"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203030057/http://www.20at.com:80/20at/ana-saudi/13810--qlbcq-.html"
