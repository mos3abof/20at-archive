text = "بصراحه الكلام ده كله حلو بس ماشوفت لو واحد مافي عنده عمل يومي كيف هيكسر الملل ده انا كل اللي بعمله وخفف من الملل اللي عندي اني عملت صدقات كتير عن طريق النت ولكن في ملل اكبر بدات افقد العلاقات الاسريه وعدم الرغبه حتي في الخروج هاد الخطر الاكبر من الملل ذاته مع العلم اني بساعد اصدقائي باشياء بحياتهم حتي لو بتخفيف عنهم وحل مشكلهم وده الشئ اللي انا اتفقت معك فيه لاني بلفعل بكون سعيده بلحكي معهم اتمنا السعيده للجميع **"
