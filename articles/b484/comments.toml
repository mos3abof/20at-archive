subject = "هوفي ايه؟!"
author = "أنا!"
posted = "2006-02-21"
text = "هوفي ايه يا جماعة؟!!<br />ايه الملل ده؟<br />أنا مش جاي أقرا مقال بتاع ناس عواجيز ،لا مش بس كده ، ده كمان مليان أخطاء نحوية و لغوية و تحريرية!<br />ارحوا أهالينا ، و الأخ اللي كاتب المقال ابقى خللي بالك إنك بتنشر لشباب مش لناس قدك!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112939/http://www.20at.com/article2.php?sid=484"

[[comments]]
order = 1
subject = "سيبك منه"
author = "Dabdoob"
posted = "2006-02-22"
text = "سيبك من انا ده يا عم<br />المقال حلو ومكتمل بس جاف شوية<br />وعموما انا كنت متوقع ان في ناس مش هيعجبها الكلام ده لانها بتهتم اكتر بطبق النجوم وابراج النجوم واخر الفضائح وبقية الفضائح دي<br />يلا سلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112939/http://www.20at.com/article2.php?sid=484"

[[comments]]
order = 2
subject = "المقال حلو والله"
author = "sweet_princess"
posted = "2006-02-22"
text = "هو فعلا حلو بس يعني ما كنت تتكلم احسن عن واحد عربي بيلعب كويس يعني او عن مسابقة شطرنج عربيه وما اكثرهم يعني وانا مع راي دبدوب المقال فعلا جاف شويه بس حلو<br />بس فعلا اللي هيجنني ازاي اتنين ممكن يقعدو يلعبو شطرنج ساعات طويله واحيانا بالايام من غير ما يزهقو ولا يملو<br />يمكن لان انا بطبعي سريعة الملل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112939/http://www.20at.com/article2.php?sid=484"

