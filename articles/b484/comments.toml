[[comments]]
order = 4
subject = "يا شباب"
author = "سعيد"
posted = "2006-02-22"
text = "ياريت الناس تفهم ان لعبة الشطرنج لعبة جادة وبتنمى الزكاء فعلاً ولا فيها حظ ولا عدم توفيق انتا ا الى بتلعب وانتا الى بتتحدد مستوى زكائك لمؤخذة بالنسبة للناس الى موش عاجبهم الموضوع والحدق يفهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112939/http://www.20at.com/article2.php?sid=484"

