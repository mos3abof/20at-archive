[[comments]]
order = 6
subject = "انا بتحاد يا كاس........ ( و لا بلاش احسن تغلبني )"
author = "أكرم"
posted = "2006-02-22"
text = "و الله انا بقالي كتير ملعبتش شطرنج الناس بقت مش فاضية خالص<br />و مش هنشى اول مرة لعبت مع ابويا شطرنج و غلبني 5 مرات بنابليون ورا بعض و برضوا مفهمتهاش<br />و لما مصطفى العايدي غلبني بخطة من تأليفه 5 مرات برضوا<br />نفسي ارجع تاني بس مين فاضي يلاعبني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112939/http://www.20at.com/article2.php?sid=484"

[[comments]]
order = 7
subject = "اعملوا هيصة"
author = "Dabdoob"
posted = "2006-02-23"
text = "اغرب مرة لعبت فيها شطرنج كانت مع اكرم اللي فوقي ده واحنا عندنا 12 سنة.<br />كنا في النادي وكانت خطة اكرم العبقرية انه يعمل هيصة عشان ماعرفش اركز وكانت النتيجة اني صدعت وقررت اني اخسر بمزاجي عشان يرحمني<br />فاكر يلا<br />سلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112939/http://www.20at.com/article2.php?sid=484"

