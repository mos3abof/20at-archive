subject = ""
author = "من غير حياء"
posted = "2007-11-05"
text = "انا قارىء صحف عجوز قوى وبحكم النشأة والسن تقدر تقول اننى عاصرت كل الصحفيين العواجيز دول<br />وصدقنى المدعى صحافة اللى بتتكلم عنة وواجع دماغنا بية عمرى فى حياتى ما قرات لة مقالة تدخل الدماغ ولا تحليل صحافى او سياسى فية ادنى احتراف<br />الاستاذ اللى بتتكلم عنة راجل ادارى ينفع يشتغل اى حاجة اللا صحفى او جورنالجى وطول عمرة مطبلاتى ومزمراتى للنظام - اى نظام المهم يهبر الهبرة اياها وياخد عمولة الاعلانات<br />وحكاية عنترياتة فى اليمن دى واسعة قوى يا شريف<br />ويظهر يا اخ شريف ان عندك موهبة فى التقريع ومسح الجوخ وشخصيتك فيها شىء كبير من الوصولية وباين عليك عايز توصل بسرعة بس مش دى الطريقة النظيفة والسليمة<br />وبعدين انت قرفت الناس بتحليلاتك لمقالتهم وانت مقالتك هباب يعنى باب النجار مخلع دا اذا حتى كنت نجار طبالى<br />نصيحتى لك يا اخ شريف انك تسيب المهنة دى اذا كانت مقالتك كلها من نوعية مسح الجوخ للشخصيات الصحفية الباهتة<br />وشد حيلك لعل وعسى<br />ما احنا فى عصر سعد الصغير ومحمد سعد وشعبولا وشريف الدواخلى<br />اة يا حظ"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014615/http://www.20at.com:80/masr/hot-topics/7528.html"

