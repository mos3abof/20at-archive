text = "لى سمعناة عن الهبر الى هبرة 7 صحافيين فى ازمة النصاب الاماراتى محمد العبار بكل وقاحة ،ووصل الامر الى ان صحفية اتحزمت ورقصت حافية علشان خاطر عيون العبار ، وايضا عن الى حمدى رزق بيهبرة من التليفزيون كل شهر فى برنامج سبوبة اسمة ( مفيش حاجة ) ، والى شوفناة بالصور عن قصور الصحفيين فى التجمع الخامس ، وعن الهبر الذى بيهبرة الصحفيين من وزارة البترول ة الاتصالات و الكهرباء ، يخلى الجميع عايز يطلع صحفى.<br />و يا1000 خسارة عليك يامصر."
