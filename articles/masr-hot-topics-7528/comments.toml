text = "لو مقال لشريف الدواخلي تلاقي البراء داخل و عامل واحد خبير عمال ينقد أعمال شريف<br />و برضه تلاقي شريف نفسه عامل ناقد تحليلي و بيقول كلام زي الفل علي الموضوع بتاعه<br />تعالي بقي لموضوعات البراء تلاقي نفس الحوار بس غير الشخصيات شوية<br />شريف عامل واحد كبير سنا و خبرة<br />و ينقد البراء<br />و البراء يعمل تعليقات برضه لنفسه و يقعد يشكر في موضوعاته بطريقة مستفزة<br />وعلي رأي المعلق أيا كان (ممكن يطلع البراء في الآخر)<br />إحنا في زمن بعرور و شعبولا و شريف و البراء !!!"
