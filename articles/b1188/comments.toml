author = "ali---zx.350sa"
posted = "2006-09-15"
text = "اولا اوجه كلمة شكر للاخوين متشائل او متسائل والزيني بركات على ردودهم<br />وثانيا الحمد لله اني انسان ما احب التعصب ولي اصدقاء من مختلف المناطق والمذاهب كما قال الإمام علي (ع)( الناس صنفان إما أخ لك في الدين أو نظير لك في الخلق )<br />وثالثا اذا شخص غلط ما فيه شي لو صحح غلط<br />رابعااخي الزيني بركات انا عرض ها الوصلات مع العلم انها مثل ماقلت عن\" جدوى الاستشهاد بقول قوم قد بدت البغضاء من أفواههم و ما تخفى صدورهم اكبر هل ترى انهم اقرب لكم منا\" وانا لا ارى انهم اقرب لي \"منا\" لاننا كلنا واحد والحمد لله لكن حبيت اعرض بعض مما رصدته انسانيتهم ولا يعرفه الكثير من الناس رغما بغض النظر عن هدفهم"
archived = "2006-11-02"
