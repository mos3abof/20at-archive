text = "اخي ... انا من كتبت مقالي وكنت مشغولة متسرعة جدا جدا وقرات ماكتبته على عجالة وعندما عدت اليها مرة اخرى وجدت اني اخطات في القراءة ,,, فقلت ماله داعي اكتب اني اخطات ... ............. اما بالنسبة للائمة اي ائمة تقصد ''''''' واما علي والحسن والحسين وفاطمة رضي الله عنهم فنحن نحبهم ونشهد ماشهد الرسول صلى الله عليه وسلم عليهم .......... وما كتبت من احاديث فا نا لا اعرف صحتها ولن اخوض فيها حتى ماكتبته عن مسلم رحمه الله ........ وما ادري يمكن انك جايبها من كتابكم ''' الكافي ''' ثانيا انا اريد من القران دليل صريح عن الامام جعفر المزعوم وليس دليل نقلي ......... واخيرا تادب عند ذكر الرسول فلا تقل ص فقط قل صلى الله عليه وسلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

