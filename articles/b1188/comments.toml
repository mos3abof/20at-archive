order = 0
subject = "شيئ عاااااااااااااااااااااادي"
author = "ريم بنت السعوديةoooooooo"
posted = "2006-09-04"
text = "والله خلصت المواضيع ياا لغامدي الا تتكلم في خضيري وقبيلي لماذ ا تثير النعرات ,,......... الي تتكلم عنه في اي مجتمع ليس في السعودية فقط ............. وشيئ طبيعي ان القاضي يفرق بينهم فقط في حالة واحدة ا ذ حصلت المشاكل بين العائلتين التي قد تتطور في النهاية الى مخافر الشرطة والخناق وماله اول ولا اخر .......... فانت يالغامدي لو خطب اختك خضيري يعني ماله اصل اكيد بترفض ................. والله شيئ عادي عااااااااااااااااادي بس انت في كتاباتك ماتعجبني لانك تخلي من الحبة قبة ............. والله يهديك لما تتكلم لا تتكلم عن المشايخ وتدعم كتاباتك باقوالهم حتى لا ياتي مريض ويسب مالا يعرف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

