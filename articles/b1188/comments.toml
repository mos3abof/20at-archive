text = "والله يا اخي من شرق المملكة اذا حكمت علينا بالكفر ماهو دليلك من القران او السنة .......... يا اخوان من الي قال لكم باننا وهابيين علشان الشيخ محمد بن عبد الوهاب دعا الى الله ونبذ الخرافات والتبرك على القبور والشرك بالله قلتم باننا وهابيين كفرة .......... اذن ياشرق المملكة انتم رافضة لن اقول بانكم كفرة لان ليس عندي دليل ولكن انتم شيعة راااااااااااااااااااااا فضة ,,,,,,,,,,,, ترفضون الحق وعقولكم الجاهلة وصلت الى زيارة بل وعبادة وطلب الغوث من قبر الامام المزعوم موسى الكاظم من هو ها الشخص وفي اي اية من القران ذ كره الله ,,,,,,,,,,,,,, يالكم من سفهاء ما اقول الا الحمد لله الي عافانا مما ابتلاكم ,,,,,,,,,,,,,,,,,,,,,,,,,,,, وفي النهاية تاتي وتتكلم عنا بكل وقاحة واننا جامدين بل واننا كافرين ............. وانا لا اود ان اتكلم بها اللغة لكن غيرتي على ديني سبقتني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

