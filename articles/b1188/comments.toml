posted = "2006-09-14"
text = "الحمد لله رب العالمين والصلاة والسلام على خاتم النبيين محمد صلى الله عليه وسلم وارضى الله عن خلفاءه الراشدين ابي ابكر وعمر وعثمان وعلي وسائر الصحابة اجمعين واجمعنا بهم في اعلى عليين امين ................ وبعد يا اخوة انا لست بداعية فتنة انما اوضح الحق لاصحاب العقول المتحجرة العقول التي امتلات حقد على الصحابة العقول التي حينما نطبق القران قالو باننا متشددين ورجعيين اي دين ان لم اخذ بالقران واوامر الله اي دين ان طبقت بدعة وصدقتها بدون دليل واضح من القران ,,,,,,,,, اي دين يامرنا ان نتبرك بالقبور وندعوها من دون الله ............. حقا انها تخلف في عقول هؤلاء المساكين ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;; وبعد اخ متسائل وانا اشك باسمك ..... تاتي لي بنسب طويل عريض وكانني لم اقرا ولم اتعلم جاهلة ......... وتقول بانني لم اتادب معهم ,,,,,,,,, قلي الادب ان ازور قبورهم واعبدها من دون الله هو شرك بعينه ام الادب ان اطلب الغوث من اناس ميتين ........ ,لا يا خي والف لا ..........الادب هو مانطبقة من ان نترحم عليهم وندعو لهم بالرحمة وان لانرفعهم لمستوى الا لوهية فهم بشر وان نعترف بفضل علي بن ابي طالب وفضل فاطمه رضي الله عنهم وفضل ابناؤهم الحسن والحسين وانهما سيدا شباب اهل الجنة وفضل ابناؤهم وابناء ابناؤهم من التابعين وال البيت كلهم رحمت الله عليهم اجمعين ولا نرضى عليه كلام ........... كما لانرضى عبادتهم من دون الله ,,,,,,,, فهم بشر افضو لما قدمو فهل سمعو غوثكم وتلطيم صدوركم وضرب وجوهكم في الحائط انتم والسيد الغير محترم هذا هو الرجعية والتخلف ............... وانت يا اخ بركات مادخلك جزاك الله خير .......... وتقول لي , لاتتكلمي عن الصحابة فهم لم يتكلمو عنهم ......... انت اقرا ما كتبه جيدا فقد قال باننا وهابيين واننا نكفر من خالفنا ..... فانا اردت ان اوضح منهم المتخلفين هم من سب الصحابة ........... ونحن لانكفر الا من كفره الله في القران ............ وتقول يابركات تكلمي بعقلانية اتعجب اي عقليه تريد ان اتحدث بها سبحان الله عقلية الشيعة وبدعهم التي ما انزل الله بها من سلطان ........................................''''''''''''][]]]]]]]]\\\\\\\\\\\\ مرة اخرى افهمو قصدي ........... سبحانك اللهم لا اله الا انت نستغفرك ونتوب اليك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

[[comments]]
order = 18
subject = "حكم مسبق ونظرة عمومية"
author = "متشائل"
posted = "2006-09-14"
text = "نظرتك عمومية وحكمك مسبق على الشيعة، لذلك ولذلك فقط اعتقدتي بأنني شيعي لمجرد أنني ذكرت نسب موسى الكاظم وجعفر الصادق لأثبت أنهما ليسا مزعومين كما قلتي في ردودك<br />خلقت ووجدت نفسي أتبع المذهب السني، وأعتقد بما تعتقدين في عبادة القبور والغلو في عباد الله الصالحين، لم أرد عليك لأدافع عن الشيعة ولكن لأدافع عن السنة التي أمرتنا بحب آل بيت رسول الله وقرابته وصحابته أجمعين فإن كان التشيع هو حب آل البيت فأنا شيعي، وإن كانت السنة هي أن نقول موسى الكاظم مزعوم فلا سنة لي بها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

[[comments]]
order = 19
subject = "شكرا"
author = "الزيني بركات"
posted = "2006-09-14"
text = "السلام عليكم<br />الاخ متشائل ارجو المعذرة فقد اعتقدت انك اخطأت فكتبت متشائل بدلا من متسائل و لم ادرك ان خليط بين متفائل و متشائم الا عندما وقعت تعليقك السابق بنفس الاسم. و اتفق معك ان حب آل البيت هو واجب علينا و حب الصحابة ايضا فهم كالنجوم بأيهم اقتدينا اهتدينا.<br />ورد فى تعليق اخر كلمة ما دخلك......<br />ما اردت لمن كتب ما دخلك الا الخير و الاصلاح ما استطعت و لا اظننى اننى تجاوزت فى حقه سامحه الله<br />و اما انى قلت ملحوظة عن ذكر الصحابة فكان نائيا بهم و اعلاء لشأئنهم حتى لا يدخل احد و يتطاول على مقامهم الرفيع.<br />و اما عن العقلانية التى هجمت لأنى طالبت ان يتحدث بها من هاجمنى هي ما قد شكرنى عليها فى تعليق سابق و رد علي لأنى تحدثت بها.<br />واذكر ان الحق سبحانه وتعالى عندما تحدث عن المسيحيين اللذين قالوا ان المسيح ابن الله و ان الله ثالث ثلاثة و قاله فى السيدة مريم قولا عظيما و كذبوا رسول الله صلى الله عليه و سلم<br />\" قُلْ يَا أَهْلَ الكِتَابِ تَعَالَوْا إِلَى كَلِمَةٍ سَوَاءٍ بَيْنَنَا وَبَيْنَكُمْ أَلاَّ نَعْبُدَ إِلاَّ اللَّهَ وَلاَ نُشْرِكَ بِهِ شَيْئاً وَلاَ يَتَّخِذَ بَعْضُنَا بَعْضاً أَرْبَاباً مِّن دُونِ اللَّهِ فَإِن تَوَلَّوْا فَقُولُوا اشْهَدُوا بِأَنَّا مُسْلِمُون<br />\" آل عمران 64 -<br />هذه هي العقلانية التى هجمت لآنى طالبت ان يتحدث بها.<br />قلت ماسبق ما أصبت فيه فمن الله وحده و ما جانبني الصواب فيه من خطأ او سهو فمن نفسي و الشيطان و أستغفر الله العظيم لى و لكم<br />السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

