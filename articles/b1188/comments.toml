subject = "تعليق"
author = "حقيقة"
posted = "2006-09-17"
text = "الأخت ريم السعودية ( إن فيك جاهلية )<br />يقول النبي صلى الله عليه وسلم: ( تنكح المرأة لأربع, لمالها وجمالها ودينها ونسبها فاظفر بذات الدين تربت يداك )<br />الرسول صلى الله عليه وسلم لم يقل : ونسبها إطلاقاً والعنصريون هم الذين تقولوا على النبي وكذبوا عليه وأصل الحديث لا يوجد فيه نس بل والدليل :<br />روى أبو داود والنسائي عن أبي هريرة رضي الله عنه: قال النبي صلى الله عليه وسلم: ( تنكح المرأة لأربع لمالها ولحسبها ولجمالها ولدينها فاظفر بذات الدين تربت يداك).<br />والحسب هنا هو الجاه والمكانة الاجتماعية وليس المقصود به النسب ولم يرد عن النبي صلى الله عليه وسلم أن النسب هو ميزان للزواج بل هذا تحيرف عنصري والعياذ بالله .<br />فهل الزواج ميزان لقد أفتى فضيلة الشيخ ابن عثيمين رحمه الله بذلك :<br />مكتبة الفتاوى : فتاوى نور على الدرب (نصية) : متفرقه<br />السؤال: المستمع جعيثم هزاع من الخرج يقول ما هي قصة قول الرسول صلى الله عليه وسلم ليس منا من دعا إلى عصبية وقوله صلى الله عليه وسلم دعوها فإنها منتنة وهل يدخل في ذلك من يتفاخرون بأنسابهم وعراقة أسرهم ويمنعون بناتهم من التزوج إلا بمن كان من مستواهم نسباً فقط بصرف النظر عن الاعتبارات الأخرى التي أرشد إليها الدين الحنيف وكذلك أبناؤهم لا يتزوجون من بنات غيرهم إلا ممن كانوا في مستواهم نسباً وما هي نصحتكم لهم؟<br />الجواب<br />الشيخ: لا شك أن الطعن في النسب أو الفخر به من أمور الجاهلية والذي ينبغي أن يكون مصدراً للحمد والذم هو الدين والخلق وهو الذي ينبغي أن يكون الرفض والقبول مبنياً عليه في مسألة التزويج فإنه في الحديث عن النبي عليه الصلاة والسلام أنه قال إذا أتاكم من ترضون دينه وخلقه فأنكحوه إلا تفعلوه تكن فتنة في الأرض وفساد كبير فالذي ينبغي للإنسان أن يكون اعتباره للقبول والرفض مبنياً على هذين الأمرين الدين والخلق حتى المال لا ينبغي للإنسان أن يلتفت إليه التفاتاً كبيراً في هذا الموضوع وإلا فقد قال النبي عليه الصلاة والسلام تنكح المرأة لأربع لمالها وحسبها وجمالها ودينها فاظفر بذات الدين تربت يداك فبين النبي عليه الصلاة والسلام أن من جملة المقاصد في الزواج أن تنكح المرأة لحسبها كما تنكح لجمالها ومالها ودينها ولكنه حث على اعتبار الدين في قوله فاظفر بذات الدين ولا ريب أيضاً أن الحسب له أثره في العلاقات بين الناس ولكن كوننا نجعله هو الأول والأخير وهو الذي تبنى عليه الأمور في القبول أو الرفض هذا أمر لا ينبغي والفقهاء رحمهم الله في هذا الباب اختلفوا فمنهم من قال إن المرأة التي تكون من قبائل معروفة لا تزوج برجل ليس من القبائل وبعضهم يقول تزوج ولكن لمن لم يرض من أوليائها أن يفسخ النكاح والذي أرى أنه لا ينبغي أن يعتبر إلا ما اعتبره الشرع من الدين والخلق ولكن الناس إذا اعتادوا شيئاً لا يكون مخالفاً للشرع ويكون موافقاً لقول من أقوال أهل العلم فإنه لا يعاب عليهم ولا ينكر عليهم ما دام قد قال به أحد من أهل العلم وليس فيه مخالفة لنص وعلى كل حال فالذي ينبغي اعتباره هو الخلق والدين والله أعلم.<br />محمد بن صالح العثيمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

