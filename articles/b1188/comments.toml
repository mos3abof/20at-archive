[[comments]]
order = 24
subject = "قصيدة في الرد على ابراهيم الخضيري"
author = "انا من صناع نجد وافتخر"
posted = "2006-10-18"
text = "شيخ الجعوله<br />خسيت ياشيخ تطاول على الدين شيخ الجعول اللي على الدين حيال<br />أسود مثل وجهك دليلك على البين الشمس لو دللت ماتغطى بغربال<br />يتمت أطفال وفرقت غالين بذرحصدته كره بنفوس الاجيال<br />وش لو كنت تقضي بعهد العمرين طلقت سـلمان وثنـّيت ببلال<br />زوجاتهم زوجات ماعابهن شين آصل من اصلك ومن عمك ومن الخال<br />فقه البدو عاميك يا أعور العين درب الصناعة صار معيوب رجال<br />عيـّبتنا صنـّاع بحـرفة نبيين اللي اشرعوا درب الهدايه والآمال<br />حتى الأعاجم بحدود علمك شياطين لو اسلموا زدتوا عليهم بالافضال<br />ياكيف ننصى الدين ونكون داعين ونقدم العيبه في كل الاحوال<br />أنتم لكم دين وحنا لنا دين وشيخ على شكلك نواليه بتفال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

[[comments]]
order = 25
subject = "السعوديين الاغبياء"
author = "البركان"
posted = "2006-10-22"
text = "مرحبا<br />انا سعودي واقسم بالله ان السعوديين متخلفين عنصريين اغبياء لا يفقهون من الدين شي فهاهم اليهود يقولون نحن شعب الله المختار وايضا السعوديين يقولون انهم شعب الله المختار ولولا الله سبحانة وتعالي انه كرمنا بالبترول والحرمين لكنا حيوانات ضالة بل اضل سبيلا ابه القارئ انظر الذين يقولون انهم اصل في السعودية ماذا فعلو هل خدمو البشرية هل طور صنعو طائرات سيارات كمبيوترات الخ لا والله بل زادونا تخلف على تخلف وعنصرية وجهل مرير رجعونا الي الوراء الف مليون سنةفي حين هذاا لشيخ القبيله يتحكم في رعيته كاالحمير الضالة لا عنده علم ولا شهادة يقود قطيع من الغنم ولو اتي شخص بسيط من ال سعود لركع لة ساجدا ضليلا كلكلب الذي اذا جاع نبح لصاحبة قرف يا صاحبي لا يطبقون الاسلام يطبقون الاسلام على الضعفاء فقط المساكين فال سعود لا تطبق عليهم الشريعة لانهم من ذوات الدم الازرق والمشايخ عندنا عبدة للمال واذكر انهم كانو يعلموننا في المداس ان الصور حرام فكونا المطاوعة يشددون على ذلك بحيث انك نادر ما تجد صورا في الشوارع ولكن الامر يتغير اتماما عندما يزور امير ولا ملك للمنطقة فتجد ان الصور منتشرة للامراء و الملوك وكانة شي لم يكن ولا نجد من المطاوعة(الصحاب الحي الكذابة) اي استنكار فقط على المساكين بالله عليكم اي اسلام تقولون اي عدل اي شريعة تطبقون والله لستم من الاسلام بشي المجتمع يسودة الجهل بصورة كبيرة والعنصريةاصل وفصل وخصيري كلام ماله داعي روحو طور انفسكم يا معفنين شوفو وين وصلو العالم يا بقر يا همج نبغي تطور تكنلوحيا حضارة انسانية علم وعلوم كو اصل وطرف وخضير وعفن مو غبر وبريحة وقال شيخ والله حالة صدق قسم بالله همج اقسم بالله لفيت بلاد العالم من اليابان الي امريكا بهرت لما وصلو الية من حضارة ورقي عظيم واحزن على هؤلاء وماوصلو الية من عقلية متخلفة غبية لا بفقهون من امرهم شي اعراب انجاس خلوكم يا معفنين على عفانتكم زي منتم وخلوكم على اصل وطرف انتو ووجيهكم الغبراء ياامة ضحكت من جهلها الامم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

[[comments]]
order = 26
subject = "اسلامنا إلى اين"
author = "إسلام"
posted = "2006-11-01"
text = "من المؤسف جدا ما يحصل في السعودية.كيف تصدر المحاكم الشرعية مثل هذه الاحكام الجائرة بحق الانسانية.ٌاسلامنا الذي ينص على العدل والذي لا يفرق بين رجل ورجل الا بالتقوى.كما أنه لا يؤخذ رجل لا بجريرة ابيه ولا بجريرة أخيه.من يختار اهله من يختار حياته.ان الله هو الذي يقدر لنا كل شيء.اليس هذا هو الدين الاسلامي.كما انه اذا نظرنا نظرة عميقة بالقضية نرى ان الضرر المباشر كان على الزوجين وعلى الاطفال.فما ذنب هؤلاء الاطفال.كما انه اين كان القانون والشرع بوقف الضرر(على زعم من رفع القضية ومن اتخذ الحكم)قبل حصول الزواج.ان الحكم الصادر في هذه القضية هو حكم ظالم ويدل على تخلف المجتمع السعودي الذي يقبل بحصول مثل هذه المهزلة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"
