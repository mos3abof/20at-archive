[[comments]]
order = 3
subject = "لا حول ولا قوة إلا بالله"
author = "باحث عن الحقيقة"
posted = "2006-09-04"
text = "والله أنا لا أعرف هل هذا ما زال يحدث في هذا الزمان، والله إن النفس لتحزن لسماع مثل هذه القصص، ولا أعرف بأي شريعة يحكم قاضي مثل هذا الحكم الذي يهدم أسرة ويشرد أطفالها.<br />فحتى لو كانت الكفاءة في النسب أحد شروط الزواج، فهذا يفترض أن يكون قبل الزواج، لا ان يتم إثارته بعد الزواج.<br />وأني لأحزن أكثر من أن أرى أن هذا التفكير العرقي الذي يهب لتقسيم بين الناس وفقا لأعراقهم مستشري في المجتمع، إلى حد أن الأخت ريم تبرره، وتشير إلى انه أمر طبيعي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

[[comments]]
order = 4
subject = "علماء السعودية خوارج الامة ..."
author = "قال الإمام علي :"
posted = "2006-09-04"
text = "و آخر قد تسمّى عالماً و ليس به، فاقتبس جهائل من جهّال، و أضاليل من ضلاّل،....<br />و نصب للنّاس أشراكاً من حبائل غرورٍ و قول زورٍ، قد حمل الكتاب على آرائه، و عطف الحقّ على أهوائه، يؤمّن النّاس من العظائم، و يهوّن كبير الجرائم، يقول: أقف عند الشّبهات - و فيها وقع –<br />و يقول: أعتزل البدع – و بينها اضطجع – فالصورة صورة إنسان، والقلب قلب حيوان، لا يعرف باب الهدى فيتّبعه، و لا باب العمى فيصد عنه، و ذلك ميّت الأحياء."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

[[comments]]
order = 5
subject = ",والله ما هكذا يكون النقد!!!"
author = "نور"
posted = "2006-09-04"
text = "السلام عليكم ورحمة الله وبركاته<br />أخي الكريم ابن بهية<br />بعيدا عن أنك لم تعلق على الموضوع الأصلي وانتقدت أوضاعا داخلية ، إلا أنني ما أردت أن أعلق على ذلك فلك الحرية طالما تسمح بذلك قواعد الصفحة ، إلا أنه والله ما هكذا يكون النقد لا لنظام فاسد ولا لشيء آخر<br />فالنقد البناء هو ما كان معتمدا على قواعد ينطلق منها ليصيب هدفه ، وحتى ابداء الرأي لا يكون بالتطاول ولا بتلك الألفاظ التي تؤذي مسامعنا وتسيء إليك أخي الكريم قبل أن تسيء لمن قصدته بها<br />فليس المسلم باللعان ولا بذيء اللسان ، هداك الله أخي وإيانا وأراحنا وطهر أمتنا من كل بؤر وأنظمة الفساد فيها ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

[[comments]]
order = 6
subject = "جهل"
author = "علي ايمن"
posted = "2006-09-04"
text = "القضاء في السعودية قمة في التخبط وعدم الكفاءة الا ما رحم ربي ومن جرب زيارة احدى تلك المحاكم لتخليص معملة فسيجد ان النظام البيروقراطي والبطأ الشديد في الأجراءت للمواطن العادي تاخذ اشهر وربما تصل لسنوات وكل قضيه مرهونه بمزاج القاضي واصول المتخاصمين وقرابتهم منه او من المتنفذين في السلطة. فاسهل شيء هو التعزير وهو حكم \"مزاج\" او اكسترا يوقعه القاضي لأي طرف في حالة استفزاز القاضي او بلوغ الجرم او التعدي مرحلة تفوق تصوره. والقاضي يجب ان يكون قصيمي او نجدي وان تعذر فيكون من ضمن جماعة معينة وتحت منظومة وشبكة معينه \"اشبه بتظيم\" للأتفاق والتشاور ولدعم بعضهم البعض. وخير ما يطلق عليهم هو فقهاء البداوة كما قال المام الغزالي. ومن قضايا التفريق هي تفريق زوجين بسبب اختلاف المذهب حيث ان الزوج اسماعيلي وليس وهابي وهو المذهب الرسمي للدولة (الوهابيه)حيث يعتبر اي فرد لا يتبعه كافر او مشرك وفي احسن الظروف مسلم ولكن غير كوفأ والعامل الثاني: قبيلي كما قرأتم والقبيلي من كان من قبيله مشهورة وكبيرة وغيرهم يعتبرون \"خضيرين\" اي من اغصان او قبائل حديثة التكوين ليست ذات اصل وحسب ونسب.<br />بلد به الكثيرون من حديثي النعمه ذوي عقول جاهلية داخل مباني عصرية."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

[[comments]]
order = 7
subject = "رأي خاص قاس"
author = "الزيني بركات"
posted = "2006-09-04"
text = "السلام عليكم<br />ابدأ تعليقي بتوجيه تحية للأخت ريم من السعودية لدفاعها عن وطنها و غيرتها عليه و يا ليتنا لدينا هذه القدرة مثلك لدفاع عن واوطاننا<br />و لكن يا أختى انصرى اخاك مظلوما و ظالما فان كان وطنك مظلوما فلا حاجة لنا لشرح كيف ننصره و ان كان وطنك ظالما فلا تعنيه على ظلمه و انقده<br />نحن فى مصر لدينا الكثير من المساوئ و لا نصمت عليها و ننقدها .<br />اما بالنسبة لي فارى ان المجتمع السعودي مجتمع يعج بالعنصرية و الجمود و يزعم ان ذلك بدعم من الشريعة و استعير جملة من جمل الدكتور يوسف القرضاوي عندما وصف اناس بأنهم ينظرون الى حرفية الشريعة و لا ينظرون الى مقاصد الشريعة<br />ارجو من الأخت الفاضلة و كافة الاخوة السعوديين الا يضيقوا ذرعا بي فكل مجتمع يعج بمشاكله و لكن المجتمع الناضج هو من يعكف على مشاكله حتى يتم حلها و اختم قولى باننا لسنا افضل حال منكم و لدينا مشاكلنا فاطرحوها علينا و لكن باحترام فنستجيب لكم و نناقشها فان من هو خارج الاطار يرى الصورة بشكل اوضح<br />السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

[[comments]]
order = 8
subject = "للا خ الزيني بركات"
author = "ريم بنت السعوديةoooooooo"
posted = "2006-09-04"
text = "وانا احييك يا اخ الزيني ..... ومادفعني لارد عليك انت وحدك هو الاسلوب الراقي الي فيه احترام ............ لنحكم بالعقل فكل بلد لديه مساوء وفيه نقص ليس لاني سعودية ان افتخر واقول ان بلدي كامل لا والف لا الكمال لله وحده والنقص يعتري بني ادم سواء الملك او الامير او الشعب او حتى رجال الدين ودكاترة الشريعة الحاصلين على اعلى الدرجات ............... فمهما اجتهدنا وعملنا الا والنقص يعتريهم وانا لا ادافع عن حاكم ظالم او قاضي جائر انما كل دفاعي عن ......... المتمسكين بقال الله وقال رسوله فبلدي ادافع عنها فلا اقول ان ليس فيها فساد بل الفساد في كل الارض ادافع عنها لانها حامية الحرمين ادافع عنها لاني لا اصدق مايقال عنها من كذ ب في الصحافة فان شئت قل وطنية خالصة ,,,,,,,,,, وانت تقول ان لديكم المشاكل ولاتسكتون وتنقدون هل نفعتكم الانتقادات او المظاهرات التي لاتخلو من الضرب هل سمعو لكم قلي ......... نحن لدينا النقد وووووو ضد المجتمع الي نعيش فيه لكن بهدوء ليس بمظاهرات انما باسلوب حكيم مثل رفع الشكاوى والتوقيع على مايرفع الى الحكومة وبعد ذلك نرى الاعلان في الاخبار فحكومتنا لا نقول انها ارضتنا في كل شيئ انما لا اقول انها ظالمة كما عجت به الصحف والمجلات ,,,,, فدعوها لاننا اعلم بحكامنا منكم وان كان فيه انتقادات فنحن بحكومتنا اعلم ,,,,,,,,,,,,,,,, وتستشهد بقول الدكتور القرضاوي حفظه الله وانا احترمه وكثر الله من امثاله الا ان مقولته طبقتها هداك الله علينا ,,,,,,,,,,,, انما اطلب منك دليل اوضح من القران يوضح اننا جامدين وان من طبق الشريعة بحذافيرها هو متخلف ,,,,,,,,,,,, لا اقول الا ان الله قال ,,,,,,,,,,,,, كنتم خير امة اخرجت للناس تامرون بالمعروف وتنهون عن المنكر ,,,,,,,,,,, قل لي من هي البلد التي تطبق ذلك النظام الان هي فقط السعودية وعندما نتمسك بالقران ونطبقه تقولون اننا جامدين رجعيين ومتخلفين اي دين ان لم تطبق ما امرك الله به قل لي ............ وشكرا مرة اخرى انما رايت اسلوبك المتزن وقلت اوضح له فقط اما البقية فلا داعي ان ادخل معهم وارد عليهم في مهاترات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

[[comments]]
order = 9
subject = "وَلاَ تَسْتَوِي الحَسَنَةُ وَلاَ السَّيِّئَةُ"
author = "الزيني بركات"
posted = "2006-09-05"
text = "السلام عليكم<br />(وَلاَ تَسْتَوِي الحَسَنَةُ وَلاَ السَّيِّئَةُ ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ فَإِذَا الَّذِي بَيْنَكَ وَبَيْنَهُ عَدَاوَةٌ كَأَنَّهُ وَلِيٌّ حَمِيم)<br />اسوق هذه الأية لكل من كتب و تجاوز في رأيه وشط فيه هذا ان كان بيننا و بينه عدواة فما بالنا و نحن نقول اننا اشقاء.<br />أما بعد بالنسبة للأخت ريم أشكر لك مرة أخرى حسن أدائك و دفاعك المستميت عن بلدك وأؤكد اننا نكن له مثلما تكنيه انت له من احترام<br />واحاول فى السطور القادمة الرد على بعض ما ذكرتيه فى تعليقك<br />1- ما كتبتيه عن المظاهرات اعتقد انه اسلوب للتعبير عن الرأي سواء بالتضامن او الرفض و اختلف معك انه يؤتي ثماره فقد قام الشعب المصري بمظاهرات فى اخر عهد السادات و صحيح انى لم أعي على هذه المظاهرات و لكن ما قيل لنا انها كانت بسبب ارتفاع الأسعار و امام ثورة الشعب اضطر السادات الى خفض الاسعار مرة اخرى<br />اما انا فقد شاهدت فى الجامعة ما يكنه رجال الأمن من خوف و ترقب من مجرد نبأ المظاهرة فهم يدركون مدى خطورتها.<br />2-( يَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُم مِّن ذَكَرٍ وَأُنثَى وَجَعَلْنَاكُمْ شُعُوباً وَقَبَائِلَ لِتَعَارَفُوا إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ إِنَّ اللَّهَ عَلِيمٌ خَبِيرٌ)<br />طلبت منى ايتها الأخت الفاضلة أية من كتب الله اسوق الاية و اقارن بينها و بين ما حدث فى من تفريق للزوج و الزوجة و هدم أسرة سعيدة فلا اجدهم الا وهم يضربون عرض الحائط بحديث الرسول صلى الله عليه وسلم (إذا خطب إليكم من ترضون دينه وخلقه فزوجوه إلا تفعلوا تكن فتنة في الأرض وفساد عريض ) رواه الترمذي وابن ماجة ، وقال الشيخ الألباني : حسن<br />و فى رواية أخرى ( إذا جاءكم من ترضون دينه وخلقه فأنكحوه ، إلا تفعلوه ، تكن فتنة في الأرض وفساد كبير . قالوا : يا رسول الله ! وإن كان فيه ؟ فقال : إذا جاءكم من ترضون دينه وخلقه فأنكحوه ، ثلاث مرات )<br />ناهيك عن العنصرية التى يعامل بها كل من هو ليس بسعودى فى ارض السعودية وان كان مسلما بل انى استطرد و اقول خاصة وان كان مسما<br />3- أما قولك رجعيين و متخلفين فما كنت لأقول ذلك لأنى ايقن ان السلف الصالح قد أبلو بلاء حسنا أو هكذا نحسبه و اجتهدوا لأنفسهم ولنا جزاهم الله عنا خير الجزاء و لكن مساحة من الزمن لم يدركوها و هي التى نعيش به الآن فأصبح لازاما علينا لا أختيارا ان نجتهد كما اجتهد الذين من قبلنا<br />4- قولك عن نظام الاسلامى وان المملكة هي الوحيدة التى تطبق الشريعة اقول لك يا اختى اول فان المملكة تستحق الشكر على ما تؤديه و لكنه تنفذ بعضها و تعرض عن بعض فليس هدف الشريعة قطع يد السارق بل الهدف منع السرقة لذلك عندما سرق احدهم من حاجته ليسد جوعه لم يقطع الفاروق عمر رضى الله عنه يده<br />5- اخيرا و قد اطلت عليكم ليس هدفى ان انقد فحسب<br />فأنا لي وجهة نظر احاول ان اقنع الأخر بها ان كانت صحيحة فيتبنها و ينشرها و يربي بها اولاده عندما يكون أسرته<br />السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

