subject = "تكملة وزيادة توضيح"
author = "ريم بنت السعودية"
posted = "2006-09-13"
text = "ويا اخي لا تتكلم عن الصحابة وفضلهم ...... لاننا نحبهم كلهم رضي الله عنهم .......... وانتم تتكلمون عن الصحابة وانكم وانكم ...... وتكفرون الي ماتبغون كا امثال ابو بكر الصديق رضي الله عنه يكفيه شرفا انه صاحب النبي صلى الله عليه وسلم ويكفيه ان الله ذكره في القران , , وعمر بن الخطاب الي اعز الله به الاسلام واحد العشرة المبشرون بالجنة ولا يقول راي للرسول صلى الله عليه وسلم الا اتى القران يوافقه والنهاية تكفرونه .. علي اي دليل استندتم ........... يا اخي انا لا اريد ان ادخل بمهاترات معك لاننا نعرف الشيعة وعقيدتهم ال فاسدة ومافيها من حلف للحسين والاستنجاد بال البيت وعبادة القبور وزيارتها و وهو اكبر شرك بالله [[[[[ على فكره الحجر المكتوب عليه الحسين لماذا تسجدون له اهو ربكم [[[[ ان تدعو اولياءه وعبادة من دونه هذا هو الضياع هدانا الله واياكم للحق .......... طلب واحد اريد ادلة واضحة من القران تتكلم عن فضل عبادة القبور والتبرك بها وعن صحة معتقدكم ................ للمرة الاخرى خرجت عن الموضوع لكن رايت من يسبنا فلن اسكت له"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

