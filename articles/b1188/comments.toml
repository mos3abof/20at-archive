subject = "خواطر"
author = "الزيني بركات"
posted = "2006-09-13"
text = "السلام عليكم<br />ابدأ حديثى موجها اياه الى الاخت الفاضلة ريم ثم الى جميع الأخوة المشاركين ؛<br />السلام عليكم ورحمة الله وبركاته<br />اللهم صلى على سيدنا محمد و على اله و صحبه اجمعين وارضى اللهم عن سادتنا أبوبكر و عمر و عثمان و علي.<br />يا اختى الفاضلة اجعلى من هدؤ اعصابك درة تزيني بها كلامك فانا كما اوضحت من قبل أجدك غيورة على بلادك و دينك و هي غيرة محمودة لك ان شاء الله و لكن يجب ان نتحلى بالحلم خاصة عند الأختلاف فى وجهات النظر. أرى انك انفعلت فى تعليقك الاخير فأذكرك بقوله تعالى<br />\"فَبِمَا رَحْمَةٍ مِّنَ اللَّهِ لِنتَ لَهُمْ وَلَوْ كُنتَ فَظاًّ غَلِيظَ القَلْبِ لانفَضُّوا مِنْ حَوْلِكَ فَاعْفُ عَنْهُمْ وَاسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِي الأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ إِنَّ اللَّهَ يُحِبُّ المُتَوَكِّلِين \"<br />أل عمران 159<br />وان كنت قد أحسنت فى تعليقك على الأخ على بالأعتذار اعتقد انه كان يجدر بك ان تتمهلى في صياغة بقية الرسالة.<br />نقطة اخرى للأخت ريم الاخوة الشيعة لم يتحدثوا عن الصحابة رغم انى على علم مما قد يكنه بعض الشيعة للصحابة رضوان الله عليهم جميعا فلم تكونى موفقة فى ادراج نقطة هم لم يذكروها.<br />بالنسبة للأخين الشيعيين أشكر لكم أدائكم وان كنت اخالفكم فى الرأي<br />فأنا لست من دعاة تكفير الشيعة و ارجو الا تكونوا انتم من دعاة تكفير السنة و لسنا بصدد نشر عقيدة كل منا لدى الطرف الآخر فلا اظن اننا سنحيد مثقال ذرة عن عقيدتنا و اعتقد انه من الصعب ان تغيروا مذهبكم<br />النقطة قبل الاخيرة بالنسبة للأخ على التقرير الذى اشرت اليه فى الرابط الذى ادرجته فى تعليقيك عن حقوق الانسان أتسآل عن مدى جدوى الاستشهاد بقول قوم قد بدت البغضاء من أفواههم و ما تخفى صدورهم اكبر هل ترى انهم اقرب لكم منا.<br />هل ترجو منهم ما لا ترجو منا . و احذرهم ان يفتونك<br />اخر نقطة اود ان اري تعليق الاخت ريم على تعليق الاخ متسائل أرجو ان يكون تعليق متزن يتحلى بالعقلانية بأسلوب راق و بالطبع لا يفتقد الى الغيرة المحمودة على دينك<br />الله تعالى اسأل التوفيق لى و لكم<br />السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

