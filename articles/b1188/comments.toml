subject = "توضيح"
author = "ali---zx.350sa"
posted = "2006-09-12"
text = "اقول اقرئي ماكتب في تعليقي واعيدي قرائته عدة مرة وبعدين قول لي وين انا قلت بتكفيركم للتوضيح فقط انا قلت ان<br />\"النظام القضائي الوهابي الذي يعتبر المخالف له كافر او في حكم الكافر\"<br />والكلام واضح بس الي قلبه اعمى ما يقدر حتى يفهم كلمتين ومن المقصود بهذه الكلمتين ولتعرفي فضل الامام المصادر التي نقلت تلك النصوص كثيرة ، وهي تبلغ عند الأخوة من اهل السنة فقط 156 مصدراً ننقل من بينها ما سجلّه مسلم في صحيحه في كتاب فضل الصحابة الباب 9 من ابواب فضائل اهل البيت حديث 2424 ، 4 : 1883 عن ام المؤمنين عائشة : « خرج النبي غداةً ، وعليه مرط مرحّل من شعر اسود فجاء الحسن بن علي فادخله ثم جاء الحسين فدخل معه ثم جاءت فاطمة فادخلها ثم جاء علي فادخله ثم قال : ( انما يريد الله ليذهب عنكم الرجس أهل البيت ويطهركم تطهيرا ) . وفي رواية السيوطي في الدر المنثور 5 : 198 عن ام سلمة : « نزلت هذه الاية في بيتي : ( انما يريد الله ليذهب عنكم الرجس اهل البيت ويطهركم تطهيرا ) ، وفي البيت سبعة : جبرئيل وميكائيل وعلي وفاطمة والحسن والحسين رضي الله عنهم وانا على باب البيت . قلت : ألست من اهل البيت ، قال : انك الى خير ، انك من ازواج النبي » .<br />ولم يكتف النبي (ص) بهذا حتى نقل في الدر المنثور 5 : 199 عن ابي الحمراء : « حفظت من رسول الله (ص) ثمانية اشهر بالمدينة ليس من مرة يخرج الى صلاة الغداة الا أتى الى باب علي فوضع يده على جنبي الباب ثم قال : الصلاة الصلاة انما يريد الله ليذهب عنكم الرجس ويطهركم تطهيرا » .<br />ـ حديث الاثني عشر المروي بطرق متعددة ايضاً . وكمثال على ذلك روى مسلم في صحيحه عن جابر بن سمرة : « دخلت مع ابي على النبي (ص) فسمعته يقول : ان هذا الامر لا ينقضي حتى يمضي فيهم اثنا عشر خليفة ثم تكلم بكلام خفي عليّ فقلت لابي ماذا قال ؟ قال كلهم من قريش » لاحظ صحيح مسلم كتاب الامارة باب الناس تبع لقريش والخلافة في قريش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

