posted = "2006-09-08"
text = "القضيه هذي نشر عنها في الصحف والجرائد وهذا شي مش مستغرب على النظام القضائي الوهابي الذي يعتبر المخالف له كافر او في حكم الكافر ولا تستغرب لو تكررت مثل هذه القصه لان الاساس خربان والعقليه الجاهلية ما زالت تتحكم في البشر لحد الان<br />على فكرة مما قرئت في بعض الجرايد ان الزواج تم بموافقة اب الزوجة وعندما توفي طلع لها الاخ الغير الشقيق وطالب بالتفريق بينهم بالغمر من ان لها اشقائها وامه راضيين بالزواج وما عارضوه بس الله يستر ها القضاء الي يحكم بالاهواء ويسفه من لا تفق معه في المذهب والان الي يختلف في القبيله الحمد لله انا بعيد جدا عن القبايل ولا لي علاقة من قريب او بعيد حدنا العائلة وحتى هذي اشوفها شي رمزي ما يتعلق بها هالمشاكل<br />تحياتي اخوكم من شرق المملكة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123849/http://www.20at.com/article2.php?sid=1188"

