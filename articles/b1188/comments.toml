subject = "إلى ريم بنت العنصرية"
author = "متشائل"
posted = "2006-09-13"
text = "موسى الكاظم بن جعفر الصادق بن محمد الباقر بن علي زين العابدين بن الحسين بن علي بن أبي طالب زوج فاطمة الزهراء بنت رسول الله صلى الله عليه وسلم هم عند الشيعة أئمة وعند أهل السنة قرابة رسول الله صلى الله عليه وسلم ومن التابعين والعلماء الصالحين الواجب مودتهم<br />قال تعالى : (( قل لا أسألكم عليه أجراً إلا المودة في القربى ))<br />فكيف تطلبين التأدب مع رسول الله وتسيئين الأدب مع قرابته بالاشارة إلى موسى الكاظم وجعفر الصادق بأنه مزعوم فقط لأنك تعتقدين بأن كل ما لا تعرفينه خرافة أو شيء مختلق<br />كم هوالمخجل أن تكوني سنية ولا تعملين بالسنة"
archived = "2006-11-02"
