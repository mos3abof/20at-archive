[[comments]]
order = 0
subject = "كنت فين ياحمدوف"
author = "ايمن امام"
posted = "2007-02-01"
text = "مرحبا بالرفيق حمدوف وحشتنا ياراجل فينك من مده كبيره لم نقراء لك مقالات - وبالتالى اصبنا بالغم والنكد لان مقالاتك هى الوحيده التى تجعلنى اضحك ففيها - اثاره لهرمونات الضحك - ياحمدوف - الفيمتو ثانيه - واحمد زويل- لم تستفيد منها مصر شيئا تماما كبعض الكتاب الملاكى الذين يكتبون ويكتبون ثم تلقى مقالاتهم فى صفيحه الزباله ويا لحظ هذه الصفيحه تحتوى على مقالات ومقالات كثيره يخرج منها رائحه العفن - ياحمدوف الموقع دا من غيرك ذى العرب من غير --- بترول- كنت انتظر تعليقك على ماقاله اللواء الكبير قوى فى مجلس الحكومه - اقصد مجلس الشعب - عن مسئوليه الاخوان عن موضوع سفاح المعادى - ياترى ايه رأيك فى الموضوع دا ياراجل يامثقف يامستنير ياعدو الظلام - مش عارف ليه عندى احساس بأنك تعمدت ان تتهرب من الموقع لمده حتى انسى انك لم تجب عن الاسئله التى وجهتها لك مرارا وتكرارا - وبرضه ها اعيدها عليك للمره المليون<br />1- ما رايك فى حجاب الراهبات<br />2- مارأيك فى عدم اعلان ميزانيه الكنيسه واخضاعها لرقابه الجهاز المركزى للمحاسبات اسوه بالازهر الشريف<br />3- مارأيك فى طريقه تعيين البابا بالمخالفه لطريقه تعيين شيخ الازهر<br />4- مارأيك فى خضوع شيخ الازهر لقانون العاملين المدنيين فى الدوله وعدم خضوع الاباب لعذا القانون<br />5- ما رأيك فى رفض الكنيسه تنفيذ احكام قضائيه بمقوله عدم خضوعها لهذه الاحكام<br />6-الايعد كل مازكرته لك يرسخ مفهوم الدوله الدينيه لدى الاقباط--<br />7-الايعد هذا اخلالا بمبداء المساواه بين الجميع لاتفرقه بسبب جنس او دين<br />8- مارأى سيادتكم فى اجبار الكنيسه للدوله على استرداد الاوقاف المسيحيه - وفى ذات الوقت استيلاء الدوله على الاوقاف الاسلاميه<br />9- مارأى سيادتك فى الصحفى الذى توجه اليه اسئله كثيره ويتحاشى الرد عليها - ل<br />اقرأ بقية التعليق .."
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206153800/http://masr.20at.com:80/article.php?sid=1530"

[[comments]]
order = 1
subject = "مع الاحترام"
author = "نيفين نيفى نوفا"
posted = "2007-02-01"
text = "و الله مع احترامى لزويل و لنظريته اللى اعرفه اننا اتعلمنا و احنا ف المدارس ف حصص الدين ان فيه حاجه اسمها ديمومه ذكر الله و الاينقطع هذا الذكر سواء بالاذان او اقامه شعائر الصلاه طول اليوم و ان الفروق ف التوقيت بين القلعه و بولاق و الدقى و مصر الجديده او القاهره و ما حولها او مصر كلها و السعوديه و لبنان و موزمبيق حتى الفروق دى هى اللى بتحقق ديمومه الذكر<br />نظريه زويل تتدخل باى شكل ف الموضوع دا<br />دا اللى انا مش فاهماه"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206153800/http://masr.20at.com:80/article.php?sid=1530"

[[comments]]
order = 2
subject = "يا قومنا هل انتم فاضيين ؟"
author = "يعلم اللة ان وزير الاوقاف انسان حسبى اللة ونعم الوكيل يريد ان يرضى الفجار ليرضوا عنة"
posted = "2007-02-01"
text = "سعى ونفذ لاغلاق المساجد فى مصر اغلاقا كاملا بعد صلاة الجماعة الاولى التى تتم فى خمس دقائق ولا ادرى لماذا ؟<br />يسعى جاهدا لتوحيد الاذان وتلك بدعة لم يسمع عنها القاصى والدانى ولا تخطر بعقل شارون نفسة ليطبقها فى الضفة الغربية<br />هل هذا الرجل مصرى مسلم ويعرف اصول دينة<br />وما الفائدة من توحيد الاذان من جهاز راديو --- هل هذا شرعى ؟<br />الازهر ومشايخ الازهر اين هم"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206153800/http://masr.20at.com:80/article.php?sid=1530"

[[comments]]
order = 3
subject = "لا للفقر ..لا للبطالة.. لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-02-01"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو الوسيلة الوحيدة للتوظيف.<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا.<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />5) الغاء الاجازات بدون مرتب , وتقليل الاجازات المرضية لتصبح شهر فقط وبعد ذلك يطرد الموظف المريض اذا تجاوزها ويفصل من الخدمة نهائيا, 2 اجازة وضع لمدة ثلاث اشهر ولمرة واحدة بعد ان كانت ثلاثة في القانون القديم للموظفات .(6) من حق الطرف الاول (الحكومة) الاستغناء عن الطرف الثاني(الموظف) في اي وقت ولاسباب يراها الطرف الاول , دون ان يحق للطرف الثاني الرجوع علي ذلك.ولا استطيع عرض باقي البنود الظالمة من قانون الوظيفة العامة الجديد. من الاخر ياناس ده قانون ظالم وسيهدم<br />اقرأ بقية التعليق .."
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206153800/http://masr.20at.com:80/article.php?sid=1530"

