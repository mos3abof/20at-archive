subject = "ياااااااااااااااا الله"
author = "aya"
posted = "2007-02-03"
text = "يا أستاذ حمدي .........ويا سادة يا معلقين ليه التريئة على بعض وبعدين المقال كله سخافة قوي وحضرتك يا أستاذ حمد مادمت ماتعرفش من الاساس الفيمتو ثانية دي كيمياء ولا فيزياء يبقى ماتزودش في الاستخفاف قوي وعمل رشتين بهجة على الموقع على حساب علم وعالم بغض النظر عن اي اقاويل في حق الدكتور أحمد زويل . ولا برده يحقلنا اننا نتري على اسم شخص وان عيبنا تصرفاته........بصراحة احنا لازم نحترم بعض شويتين علشا نقدر نفهم بعض"
