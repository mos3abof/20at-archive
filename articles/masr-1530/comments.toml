[[comments]]
order = 8
subject = "فيمتو شرطة"
author = "شرقاوى"
posted = "2007-02-03"
text = "لست أدرى ما العجب لكى نسخر من امكانيات المجلس الشعبى لمحافظة القاهرة ان اكتشف عدم دقة نظرية الدكتور/زيل - الفيمتو ثانية؛ فهذا يذكرنى بالأستاذ/يوسف ادريس عندما كانت سيارته بورشة عم/عبده سمكرى السيارات بشارع الجلاء القريب من مكتب الأستاذ حيث ذهب لاستلام السيارة فوجد الورشة مغلقة وعلم أن الشرطة اعتقلته ولما ترتبطه بعم عبده من علاقة طيبة ذهب للسؤال عنه بالقسم وطلب مقابلته وسأله: عملت أيه ياعم/عبده .. قال له عم/عبده: أبدا ياباشا والله ماعملت حاجة دول بيتهمونى انى خرمت الأسون وانا مش عارف ايه هو الأسون ده .. وعندما توجه الأستاذ للاطلاع على المحضر تبين أن الشرطة تتهم عم عبده أنه المتسبب فى حدوث ثقب الأوزون لاستعماله اللحام بالأكسجين ؛ وأخيرا علم الأستاذ أن الشرطة المصرية استطاعت التوصل لما لم يتوصل اليه العالم من الأسباب الرئيسية لخرم الأسون؟؟؟"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206153800/http://masr.20at.com:80/article.php?sid=1530"

[[comments]]
order = 9
subject = "ارحمونا من رزق وهباب ده"
author = "بني آدم"
posted = "2007-02-04"
text = "هو الهباب ده مخبر امن الدوله رزق عامل ابونيه عندكم في الموقع ولا ايه؟ كل يومين تتحفونا بهطله وقذارته ليه ؟ شوف مهما قال في أي حاجه<br />كلامه ماسخ ومقرف حتى لو شتم الحكومه<br />كلنا عارفين انه كده وكده عشان يسبك علينا دور الوطني المعارض ويداري على شغلته الاصليه<br />مخبر امن دوله ..<br />بطلوا تقرفونا بيه كل يومين"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206153800/http://masr.20at.com:80/article.php?sid=1530"

[[comments]]
order = 10
subject = "الفمتو ثانية يا جاهل"
author = "أحمد القطب"
posted = "2007-02-04"
text = "كنت أتمنى أن يتمعن الأستاذ حمدي رزق قليلاً ويحاول الرجوع لأي مرجع أو يقوم بالبحث في جوجل على الفمتو ثانية ليعلم أنها تساوي 1×10 أس -15 من الثانية وليس 3 ثواني في الكيلو كما يتصور الكاتب الفاضل الذي يبدو من حديثه أنه متأثر بعض الشيء بثقافة سوق العبور، أستاذ حمدي نشكر لك مقالك الساخر، الذي يبعث على الضحك ولكنه لا يبعث على السرور، وأتمنى من كل كاتب مصري أن يكون أكثر إيجابية في حديثه عن بلاده وأهلها، وأن يحاول تصحيح معلوماته العامة.. ولو قليلاً.."
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206153800/http://masr.20at.com:80/article.php?sid=1530"
