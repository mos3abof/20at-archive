[[comments]]
order = 0
subject = "ده بالظبط مثل حكاية المجنون إياه"
author = "مصرى"
posted = "2006-04-23"
text = "بعد أحداث الأسكندرية الأخيرة كان هناك أخبار تشرت أن هناك تغيير فى قيادات فى الداخلية وطبعاً صاحبنا ضد التغيير فكان لا زم علشان يبرر وجوده يعمل أى حاجة تبين أنه مهم ولا يمكن يتغير أبداً بعد الوعود بإستمراره بسبب تزوير إنتخابات الرئاسة والبلطحة بتاعتهم على الشعب ونفس الشيء فى إنتخابات مجلس الشعب وقهر الناخبين بواسطته علشان كده الحكاية دى ملفقه علشان يضمنوا أهمية وجوده وأهمية وجود قانون الطوارئ إللى كل لما الناس تطالب بتغييره يحصل حاجة زى أحداث الأزهر والسيدة عائشة وعبد المنعم رياض وشرم الشيخ وكأن مصر لا يمكن أن تحكم بدون قوانين طوارئ علشان يضمنوا بقائهم فى الحكم وفى حراسة الكرسى بتاع الحكم والشعب كله عارف ده ولكن هما عمرهم ما بيعترفوا بوجود الشعب إللى بيقولوه ده علشان تلميع صورتهم للإعلام الخارجى لضمان بقائهم."
archived = "2006-05-02"
capture_url = "https://web.archive.org/web/20060502025240/http://masr.20at.com:80/article.php?sid=209"

[[comments]]
order = 1
subject = "سمعت"
author = "ربيع"
posted = "2006-04-23"
text = "في برنامج حاله حوار كانوا بينقشوا الطظ بتاعه مهدي عاكف<br />المهم كان فيه واحد محامي قال ان الاولاد دول مقبوض عليهم من اكتر من 45 يوم وانه حاول يتصل بيهم معرفش<br />عموما اعتقد ان احداث اسكندريه والعيال دول<br />زي العنوان ما بيقول ابتكار من وزاره الداخليه وسللملي علي قانون الطوارئ"
archived = "2006-05-02"
capture_url = "https://web.archive.org/web/20060502025240/http://masr.20at.com:80/article.php?sid=209"
