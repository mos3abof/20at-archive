text = "هو ماله الراجل الغريب ده , تلبس تقلع هيه حرة .. و لا ايه يا أبو حرية ؟؟<br />أنا أسجل هنا أني شخصيا مقتنع بالحجاب \" أو الخمار \" أكتر من النقاب ..<br />بس اللي اختارت تلبس النقاب هيه حرة , المهم تكون متعلمة كويس و تقدر تشارك بجد في المجتمع و تربي أولاد كويسين ..<br />و أنت حر ما لم تضر .."
