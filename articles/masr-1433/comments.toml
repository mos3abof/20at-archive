subject = "ربنا ينجيكم وينجي بهيه ..."
author = "إبن بهيه"
posted = "2007-01-12"
text = "تحية تقدير وحب واحترام لرجلي مصر العظيمين .. المستشارين مكـــي وبسطاويسي .. وكل زملائهما الكرام ..<br />المشكلة يا سيادة المستشار أن مبارك الواطي كالعادة بيدور على راحة ولاد بهيه .. يعني من غير ما يشتكي القضاة من صعوبة عمليات الإشراف دور هو ليهم على راحتهم وشال إيديهم خالص من الإشراف القضائي إلا وجودهم كضيوف شرف على التزوير .. طيب حضراتكم رجال قانون وعارفين .. هل ما يحدث اليوم يمكن أن يكون له علاقة بالدستور ؟؟؟ أي دسور في الكون ؟؟؟!!!<br />هل يوجد في مصر دستور من الأساس ؟؟؟<br />كلها عمليات تهريج متصله من مبارك الواطي للعب بمقدرات هذا البلد ليكون جاهزا لاستقبال الصهاينة (أحبابه وأسياده وأولياء نعمته .. وكاتمي أسراره) حين يقررون توسيع دولتهم كما هو موجود في التلمود .. من النيل إلى الفرات .. ولن يحيدوا عنه إلا بحرقهم وحرق تلمودهم القذر ...<br />وحضراتكم وولاد بهيه الشرفاء واقفين لمبارك الواطي زي اللقمه في الزور .. كان لازم بلعكم بكام ماده عشان يستمر في مسيرته لبيع البلد للصهاينه .. ويستكمل جروه الصغنون (إبن سوزان الواطي الثاني .. راضع الماسونية) في تكملة مسيرة الخيانة لمصر والولاء لأخواله الصهاينه بتوع إنجلترا حامية حمى الصهيونية وباعثتها ..<br />ياه بايننا بعدنا عن الموضوع شويه .. صح ؟ والله أبدا .. كله في صميم الموضوع ويا ريت نراجع التاريخ الأسود للصهيونية ونعرف بداية انطلاقتها في بريطانيا قبل عدة عقود بس مش كل تاريخها .. يعني مش من زمان أوي .. ونعرف أهدافهم وطريقة سيرهم فيها واعتمادهم الكبير على بناتهم لتجنيد القادة أو الطراطير العرب وكان منهم الخنزير اللي عندنا واللي قبله ..<br />يا ريت نحاول نعرف المخطط أو جزء منه عشان نقدر نستوعب اللي حاصل حوالينا .. يا ريت نقرا عن الماسونية واللي ب<br />اقرأ بقية التعليق .."
