[[comments]]
order = 4
subject = "اقباط من هم الاقباط ؟"
author = "فى بريطانيا 5 مليون مسلم وفى فرنسا نفس العدد وعددهم يعادل الاقباط فى مصر ولم نسمع بمطالبات خرافية لهم كما يزعم اخواننا الاقباط فى تولى الوظائف والمقاعد الوزارية والمحافظين وغيرها"
posted = "2006-12-08"
text = "اذن من هم الاقباط ؟<br />حينما دخل عمرو بن العاص مصر كانت الديانة المسيحية محصورة فى المحتلين الرومان وبعض اليهود<br />وكان غالبية الشعب المصرى يعبد رع وامون وازيس وازوريس والمحروس حورس<br />وحينما اراد عمرو ان يبنى مسجدا بنى لة اتباع رع -الة- الشمس مسجدا يشبة فى 95% من بنائة معابد الشمس فى ما عدا المحراب والماذنة وتركت ساحتة معرضة للشمس تماما كمعابد الشمس على حسب ديانة رع<br />ولو دخلت مسجدا فى مصر وحتى الان لربما وجدت اشعة الشمس مرسومة فى المحراب<br />واسلم اتباع رع وامون ودخلوا فى دين الاسلام افواجا<br />وبقى الرومان واليهود مسيحيون لم يجبرهم احد على الاسلام<br />وهاجر بعض الرومان الى بلادهم وبقت اقلية منهم تعبد الصليب وتعمل طابور خامس فى البلد<br />هل تذكرون المعلم يعقوب اثناء الحملة الفرنسية وكيف انة كون فرقة من النصارى وحارب مع الفرنسيين ضد المصريين واعلن انتهاء دولة الاسلام فى مصر<br />فى النهاية هرب نابليون من مصر وهرب المعلم يعقوب معهم ولكن الفرنسيوت القوة فى مياة المتوسط لقذارتة وزفارتة حيث انهم لا يستحمون الافى عيد الغطاس<br />كل هذا فى التاريخ<br />فاى حقوق لهم----------- انهم بقية الرومان وكلمة قبطى تعنى مصرى ولا علاقة لها بالدين هم تركوا اى نشاط سياسى واجتماعى وتقوقعوا فى الكنيسة تسيطر عليهم هواجس وامراض الاقليات المكروهة<br />غالبيتهم عندهم امراض نفسية وعندهم عجز جنسى واضح وبناتهم تلجأ الى الشباب المسلم لممارسة الجنس ويقلبون الدنيا صياحا فى ان المسلمين يختطفون بناتهم<br />اليست تلك حقائق مؤلمة نعم ولكنها حقائق<br />هل ازيدكم حتى يعلموا حج<br />اقرأ بقية التعليق .."
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214064911/http://masr.20at.com:80/article.php?sid=1262"

[[comments]]
order = 5
subject = "انت لا تنفع مسلم و لا مسيحي و لا يهودي"
author = "واحد من الناس"
posted = "2006-12-08"
text = "علي فكرة الخص اللي بيزل المسيحيين بان بناتهم بيلجأوا للشباب المسلم علشان هما عندهم عجز جنسي فده انسان تافهه و سطحي و علي فكرة انا مش ضد ان المسلم يحب مسيحية و هي تحبه او المسيحي يحب مسلمه و هي تحبه او اي حد يحب اي حد دا حب يا استاذ مش عيب دي مشاعر يا عديم المشاعر و علي فكرة العجز الجنسي ما لوش دعوة بمسيحي و مسلم ماهو انت عندك وزير الثقافة مسلم و شاذ جنسيا و يوسف شهين مسيحي و شاذ جنسيا و غيرهم كتير من النوعين و بعدين بالنسبة لمصر قبل الاسلام انت بتقول ان مصر ماكنش فيها مسيحين غير الرومان امال الباباوات بتوع اسكندرية دول بتوع مين و الاضطهاد اللي المسلميين بيتشرفوا دايما انهم رفعوه عن المسيحيين قبل الاسلام ما يدخل دول بقي مين المحتل كان بيضطهد نفسة اقرأتاريخ قبل ما تتكلم عيب انت بالشكلده بتسيئ للاسلام لان اي حد غير مسلم هيقول ادي المسلمين جهله واي حد مسلم بيفهم و محترم هيستعر من اللي واحد من دينه بيقوله و في الاخر مش شرط اي حد مش مع الاخوان تعتبروه ضد الاسلام و كافر انتوا بتشتموا حسني مبارك و محدش بيكلمكم و بالنسبة لفرنسا و الاقلية المسلمة هناك فقبل ما تشبههم بالاقباط لازم تعرف اية الفرق بين مصر و فرنسا و بين الاقباط و مسلميين فرنسا و بلاش الفاظ لو سمحت يا جماعة لان انتوا بتسيئواللاسلام الا لو كان الاسلام بيأمر بالشتيمة دا موضوع تاني"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214064911/http://masr.20at.com:80/article.php?sid=1262"

[[comments]]
order = 6
subject = "روقوا عيب العك ده .."
author = "إبن بهيه"
posted = "2006-12-09"
text = "يا ريت نخف شويه من الحدوته ديه .. حكاية الحصص حتى في الكلام ده شيء غريب وعجيب .. ولا يمكن يكون في صالح أي حد خالص .. الحكايه مش زيت وسكر عشان نوزعها حسب عدد المسجلين في بطاقات التموين .. حتى دي .. والله عيب عليكم .. المسيحيين ذايبين وسط ولاد بهيه وخلصنا ليه عايزين تطلعوهم من وسط الناس ويكون ليهم حصه محدده ؟؟؟ ليه ؟؟؟ دي سكة اللي يروح ما يرجعش عيب عليكم أوي والله .. ده أنا شايفه زي اللي بيقلب في الطبخه الأمريكاني وشوية شوية يطلعلها ريحه وريق الشياطين يجري عليها ويا عالم بقى راح توصل لفين .. أنا مش ضد المسيحيين ولا ضد الكلام في كل القضايا مهما كانت حساسه .. لكن التركيز على المحاصصه ده زي المره اللي فاتت البايخه اللي فاتت .. روقوا عيب العك ده .. ولا فيه إيه بالضبط يعني ؟؟؟<br />إبن بهيه<br />http://shadyforever.blogspot.com/"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214064911/http://masr.20at.com:80/article.php?sid=1262"

