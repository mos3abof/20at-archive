text = "الاخ اللى شتم واحد مش مهم وناس سب وشتيمة علشان الراجل قال رائية فى الاخوان المسلمين عاوز اقول للاخ دة كس ام ام الاخوان المسلمين على تلاتة كس امك يابن المتناكة ياخول اساسا امك زانية فيك وكس امك ولو انتا راجل هات رقم تليفونك ومبقاش راجل لو خليك تتناك يابن العرص يااخوانجى يازبالة يالا ياخوانجية ياولاد المتناكة الاخوان المسلمين دول اصلا يهود ومتحالفين مع امريكا وكل اللى هما عاوزينة السلطة فى مصر وكلهم ولاد متناكة ميعرفوش حاجة فى الدين"
