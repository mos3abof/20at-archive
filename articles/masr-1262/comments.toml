[[comments]]
order = 0
subject = "ارفعوا ايديكم عن الاخوان"
author = "كازانوفا"
posted = "2006-12-07"
text = "يعنى انا مش فاهم انتو جايين تكلموا عن نفسكم والانظواء اللى انتوا فيه منتوا اللى عاملين فى نفسكم كده. نروح الجامعة نلاقيكم واخدين ركن لوحديكم نروح الشغل واخدين جنب لوحديكم وتيجوا تقولنا العزلة انهى عزلة دى.<br />الاخوان المسلمين<br />قباط كانوا قدام اعينيا وانا فى لجنة انتخابات مجلس الشعب هذه الدورة كانوا يرشحون الاخون يعنى في ناس منكم عايزنهم عارفين ليه عشان مش حرامية زى الحزب الوطنى وغيره من بقية الاحزاب التانية دى حاجة الحاجة التانية انا مش شايف اى اضطهاد ليكم داخل مصر بالعكس المسلمين هما اللى مضطهدين امن دولة بيمسكوا فيهم وحكومة ناسيهم ومفيش ماما امريكا بتديهم معاونات للجوامع عندهم والاخوان المسلمين دول الحزب الوحيد اللى فى مصر منظم ويعتبر هو الاغلبية الحقيقية فى البرلمان.<br />اخر معلومة بس:<br />الاخوان لو اعلنوا يوم واحد العصيان المدنى سوف تتوقف وتشل جميع حركات الهيئات والمؤسسات الحكومية والقطاع<br />الخاص<br />مدونتى<br />www.cazanoova.blogspot.com<br />خبر حلو بس كده على الماشى<br />قضت محكمة مصرية الاربعاء 6-12-2006 ببراءة المرشد العام لجماعة الاخوان المسلمين محمد مهدي عاكف من تهمة سب<br />مصر، حيث كانت صحيفة روزاليوسف اليومية نشرت في أبريل/ نيسان مقابلة مع عاكف قال فيها \"طز في مصر وأبو مصر واللي في مصر\".<br />وأقام محام دعوى أمام محكمة جنح مدينة مصر بالقاهرة في مايو/ ايار اتهم فيها المرشد بسب وقذف مصر طالبا معاقبته<br />بتهمة السب والقذف كما طلب الحكم عليه بتعويض مؤقت.<br />وقال مصدر قضائي ان القاضي حازم صالح سيصدر أسباب الحكم<br />بالبراءة ورفض طلب التعويض الاسبوع القادم<br />المصدر :www.<br />اقرأ بقية التعليق .."
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214064911/http://masr.20at.com:80/article.php?sid=1262"

