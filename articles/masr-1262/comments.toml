[[comments]]
order = 9
subject = "لو كان يعلم ماكان فعل"
author = "مواطن عقلاني"
posted = "2006-12-11"
text = "يا جماعة المسلين اللي بيجرحوا في المسيحين و هما فاكرين انهم بيخدموا الاسلام انا بجد حزين عليهم انتوا بتسيئوا لدينكم المهم انكم قاعدين تتكلموا علي حالات الاسلمة اللي بتحصل في مصر و بتقولوا اننا مش عارفين نداري الفضيحة اي فضيحة فضيحة اننا نتعامل معكم بالمثل الكهنة و البابا بيحاولوا يمنعوا حالات الاسلمة و دا مش عيب في مجتمع مافيش حد فيه بيختار دينه بدليل اننا عمرنا ماشفناكم بتسيبوا حد يتنصر يعيش و لكن اول ما حد بيعمل كدةبتحلوا دمه بالذمة داكلام هو ده السماحة اللي في دين الاسلام اعتقد ان اية لا اكراه في الدين لازم تشيلوها من القران باعتباركم مش بتحترموها من خلال ممارساتكم و انا اعتقد ان الرسول عليه الصلاة و السلام لو كان يعرف اللي هيحصل من اتباع رسالته ما كان فعل ما فعله و اتمني الرد علي بمنتهي الموضوعية"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214064911/http://masr.20at.com:80/article.php?sid=1262"

[[comments]]
order = 10
subject = "يا عم كبر دماغك"
author = "قبطي يعني مصري"
posted = "2006-12-11"
text = "يا عم انت بتكلم مين العالم دي مش عاوزه تفهم عاوزين يحكموا علي الناس و بس من غير ما يسمعوا حد مش فالحين غير في انهم يعايرونا باسلمة البنات و الشباب اللي مش فاهم دينه او عاوز يتجوز طيب انا اتحدي اي واحد فيهم دكر يقدر يرد علي الكلام اللي بيقولوا ابونا زكريا علي قناة الحياة مش هتلاقي مش هتلاقي غير ناس بتشتم عليه لانهم مش عارفين يرضوا و بالمناسبة الناس دي مش عاوزه تشغل دماغها بدليل ان ابونا فضل يتكلم علي اسماء الله الحسني و الاخطاء اللي فيها و كلهم كفروه و لما واحد سعودي جه وعمل بحث اثبت فيه ان فعلا الاسماء فيها اخطاء و الازهر وافق عليه كلهم اقتنعوا لكن لما جت من زكريا زعلوا و اعتبروه كافر و المصيبة انهم مش هيعترفوا بغلطهم ابدا"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214064911/http://masr.20at.com:80/article.php?sid=1262"

