author = "تلميذة"
posted = "2006-12-13"
text = "صدقت في هذه الكلمات الجميلة لشخص اسمه مطر<br />مَـن يُدريـني<br />أنَّ لِسـانَكَ يلهَـجُ باسـمِ اللهِ<br />وقلبَكَ يرقُـصُ للشيطـانْ<br />لـنْ تَقـوى عِنـدي بالتَّقـوى<br />ويَقينُكَ عنـدي بُهتـانْ<br />الإيمـانُ الظالـمُ كُـفرٌ<br />والكُفـرُ العادِلُ إيمـانْ<br />هـذا يَذبـحُ بالتَّـوراةِ<br />وذلكَ يَذبـحُ بالإنجيـلِ<br />وهـذا يذبـحُ بالقـرآنْ !<br />لا ذنْبَ لكلِّ الأديـانْ .<br />الذنبُ بِطبْـعِ الإنسـانِ"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214064911/http://masr.20at.com:80/article.php?sid=1262"
