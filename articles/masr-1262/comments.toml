text = "ياشعب مصر فوققوووووووووا قبل<br />ماتختلفوا ويفوت الاوان ونبقى عاملين زى العراقيين وده الهدف المنشود ليكم انكم تبقوا ضد بعض وتقطعوا بعض وتختلفوا وتيجى امريكا تحط لكم قوات لحفظ الامن ولا يمكن قوات امريكية بس وساعتها ولا المسيح ح ينزل من على صليبه يخلصكم ولا الاخوان اللى ح تحرر البلد علشان تاخد الحكم ح تخلصكم انتم اللى ح تخلصوا على بعض بنفسكم<br />ولو شوفتوا مصلحة بلدكم احسن<br />وهانية لك يافاعل الخير<br />امضاء تلميذة"
