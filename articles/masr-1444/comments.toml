subject = "ليه يعنى بقى الكلام ده"
author = "سوزان مبارك أم المصريين ليه دى ممكن تكون أمنا الغولة ولا أم قويق لكن أم المصريين وسعت قوى منها!!!"
posted = "2007-01-17"
text = "على فكرة هما التقطوا ليها الصورة من بعيد علشان وشها عجوز ومترهل من كثرة عمليات الشد إللى بتعملها لكن أش تعمل المشطة فى الوش العكر؟"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192155/http://masr.20at.com:80/article.php?sid=1444"
