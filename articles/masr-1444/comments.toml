[[comments]]
order = 1
subject = "الغرض من الموضوعظ(خليها تاكلك)"
author = "المواطن المصري"
posted = "2007-01-15"
text = "طبعا الغرض من الموضوع باين في الصورة هما جايبنلكم صورة سوزان مبارك علشان خاطر بمجرد مشاهدة الصورة يبدأ الهجوم من المعلقين بالسب والشتم واللعن.<br />لكن على رأي المثل (خليها تاكلك) مش حنسب ولا نشتم ماما سوزان هي أم المصريين كلهم ونحن نحبها ونحترمه"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192155/http://masr.20at.com:80/article.php?sid=1444"

[[comments]]
order = 2
subject = "ردوا في أم الموضوع"
author = "أحمد رحال"
posted = "2007-01-15"
text = "الموضوع عن أهمية القراءة .. مش عن ماما سوزان و ماما سامية ..<br />أنا شايف إن القراءة في حد ذاتها من أكبر متع الحياة .. و مشروع مكتبة الأسرة ده بيقدم كنوز حقيقية للي بيفهم و يقدر .. بغض النظر عن أي حاجة تانية ."
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192155/http://masr.20at.com:80/article.php?sid=1444"

[[comments]]
order = 3
subject = "الحالة لا تسمح"
author = "بعد تدنى مستوى الحياة الإجتماعية والأقتصادية للإسر المصرية أصبحت القراءة من الأمور المهمشة نظراً لتعثر البحث عن عمل ولا عن مورد رزق يسمح لها بالحفاظ على ماء وجهها وهنا تراجعت القراءة وهذه هى سياسة أى مستعمر نشر الأمية وإلهاء الشعب بلقمة العيش. وأنا كنت فى سفر لكثير من المحافظات ووجدت الأطفال لا يعرفون الصيف من الشتاء لإنهم لا يغيرون الملابس التى عليهم طول العام وعلامات سوء التغذية تحفر بأظافرها الشرسة معالمها على وجوههم ووجدت أن الأسرة لا تذوق اللحوم إلا مرة من الشهر وأحيانا لا ومصر مجتمع ريفى أكثر منه حضر فهؤلاء هم الغالبية من الشعب المصرى المنهوب من حاكمة وعائلته كلها فهل هؤلاء سيهتمون بمكتبة للإسرة ويقرأون بها وفرضاً لو ذهب هؤلاء للمكتبة فهل عقولهم الجائعة ستفهم ما يوجد بالكتب فرضاً لو كان هناك كتب أو مكتبة أصلاً المطلوب أولاً هو حق الإنسان فى الحياة الكريمة وتوفير المأكل والملبس والعلاج والتعليم المجانى الحقيقى له ولإبنائه وبعدها سيقرأ الشعب."
posted = "2007-01-16"
text = "مصر فى عهد الإحتلال البريطانى والحكم الملكى كان الفرد يجد عمل يوفر به الطعام والملبس والحياة الكريمة وكان يقرأ لإنه يريد أن يكون إيجابى مثل القدوة الحسنة من الأبطال ولكن أين دور المصرى فى الحياة وأين القدوة المثلى هل فى مبارك العميل الذى نهب مصر أم سوزان التى تعتبر نفسها سيدة أولى وأنا أقول نعم ولكن فى النهب والفساد ولا فى جمال موظف البنك الذى أصبح رئيس للجنة السياسات ثم يريد أن يكون الحاكم وكأنه إبن صاحب الطابونة."
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192155/http://masr.20at.com:80/article.php?sid=1444"

