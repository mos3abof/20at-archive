[[comments]]
order = 0
subject = "مواطن مصرى"
author = "مواطن مصرى"
posted = "2006-04-19"
text = "مصر هتولع يا جدعان و مفيش حد هيطفيها .... اللى يشوف الاحداث اللى بتجرى النهارده و المتسارعة جدا و التى لم يحدث لها مثيل طول فترة حكم أخينا الرتيبة المملة بيفتكر على طول أخر أيام المرحوم خالد الذكر اللى كان أحسن من غيره مهما قال معارضوه الرئيس أنور السادات فلست أدرى أأفرح لقرب الفرج أم أخاف لقرب الكارثة التى تنتظر مصر و المصريين!!"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "يلا بينا يا شعب مذلول"
author = "نمر من ورق"
posted = "2006-04-20"
text = "يا شعب مذلول و دلدول و مش فالح غير فى الكلام و الهتافات و تفريغ الشحنات على صفحات الانترنت ... قوم يا خانع يا خاضع يا خرنج من قعدتك على القهاوى و على الكراسى قدام الكمبيوتر قوم و قول للحاكم بتاعك إنتا ظالم و كفياك ظلم لحد كده قوم يا اللى بتغنى إخترناك و زفتناك رضيتم بالخنوع و العجز و بقيت زى القوادين بتصهين على الدعارة اللى شايفها عينيى عينيك و شايف الحاكم بتاعك نازل إغتصاب فى بلدك و بلدك بتصرخ و بتستغيث بيك و إنتا إبنها و برضه عامل نفسك مش شايف و لا كأن اللى بيغتصب بلدك هو برضه اللى بيغتصبك و بيديك على قفاك فى الرايحه و الجايه و واضح إنك خلاص إتكيفت و عاوز كمان ... إتفو عليك ما طلعتش من صلب أحمس و لا عرابى و لا الرجاله فى ثورة 19 ... طلعت إبن حرام و لقيط"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "لن نلوم إلا أنفسنا"
author = "مصرية"
posted = "2006-04-20"
text = "لم يظلم حسنى مبارك المصريين فى يوم وليلة ولكنه ظلم مصر كلها منذ قدومه المشوب بالإتهام فى ظروف غامضة وتقلد الحكم بدون أى إنتخابات وزور الإنتخابات بإقتدار لبقائه ونهب مصر كلها على مدار حكمه ولكن إلى متى الصمت على هذا الخائن أما أتى الوقت للنهوض لتخليص مصر من هذا الفاسد الذى هو أضعف من أن يستمر فى الحكم والشعب أقوى منه بكثير إن كل ما ينتظره الشعب المصرى هو قيادة تتقى الله فى شعبها وسيلتف حولها الشعب كله لأن المصريين كلهم كارهون لكل أوضاع الفساد المتسلطة عليه من الحاكم وعائلته والخونة من حولة وأنا أدعو كل القيادات الشريفة أن تتحد لتقود شعب مصر كله لنتطهر من هذا الحاكم القذر."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "لمصلحه مين؟؟؟؟؟؟؟"
author = "نيفين"
posted = "2006-04-20"
text = "و الله يا جماعه البلد دى رايحه ف داهيه محققه<br />ادخلو علبى موضوع حدوته اسكندرانيه و شوفو الصور<br />بقى دى اسكدندريه الماريه<br />ناس عندها قضيه<br />وناس متشنجه ع الفاضى و ناس مش فاهمه حاجهو نفسها تفهم<br />وناس فتهمه و مطنشه و ناس منافقين<br />ووسط كل دول كدابين الزفه<br />و اللبيقو كتير اوى<br />من العباره لانفلونزا الفراخ<br />و من كلام المرشد لحوادث الاسكندريه<br />و لما يتقال ان الحكومه نشرت اشاعه انفلونزا الفراخ علشان تغطى على العباره و على موضوعات منيله تانيه<br />و لما يتقال ان موضوع اسكندريه متدبر و متفبرك للابقاء على قانون الطوارىء يبقى نصدق مين<br />و نعمل ايه لمل نتمنع و يتمنعو الطلبه انهم يخرجو اللى جواهم<br />انا بسال د<br />لمصلحه مين<br />و بكدا عايزينا نوصل لفين يعنى<br />حسبنا الله و نعم الوكيل"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "الى نمر من ورق"
author = "مصري"
posted = "2006-04-22"
text = "الاخ / العزيز (نمر من ورق)<br />اقدر دوافعك وغضبك وسخطك على الحاله التي وصلت اليها مصر ولكن لا اوافق مطلقا على اسلوبك في الحديث فهذا الشعب ظلم كما لم يظلم شعب في التاريخ وانا معك في ان فيه سلبيه لكن انا عاوز اسال سيادتك عملت ايه؟ دا مش وقت تبادل اتهامات دا وقت لازم نقف فيه كلنا ورا القضاه الشرفاء اعتقد اني دي المعركه الفاصله"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "كلنا فى مركب واحدة"
author = "مصرية"
posted = "2006-04-22"
text = "يا مصريين كلنا فى مركب واحدة والمركب بتغرق بينا الحاكم والفسدة من حولهم بيحاولوا يفتتوا الشعب علشان يقدروا يستمروا فى فسادهم الذى لا يتنهى إبتدأو برؤساء الأحزاب وتفتيت أحزابهم ثم بالفتنة الطائفية ثم بإغتيال القضاء علشان مفيش حد يدافع عن مصر خالص، يا مصرى بلدك محتاجة ليك أقرأ التاريخ علشان تعرف أنه كان فيه زعماء كانوا يقودوا مصر وهما فى سن الشباب زى مصطفى كامل ومحمد فريد وكانوا بيدافعوا عن مصر والمصريين، يامصرى بلدك بتتنهب وإنت وقف تتفرج عليها يامصرى لعن الله قوم ضاع الحق بينهم أنهض يامصرى وشوف الفساد فى كل شبر فى بلدك عمل فيك إيه لولا نهب الأموال كان زمان عندك عمل يجيب لك دخل تقدر تفتح منه بيت ولكن نهب الأموال وفساد الحاكم مش هايخليك تعيش أبداً فى أمان علشان متعرفش هما يبعملوا فيك أيه أصحى يامصرى وكفاية مصر أمانة فى إيدك ومحتاجة ليك."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "لا"
author = "مصرى"
posted = "2006-04-24"
text = "لا للحاكم الفاسد والفسدة من حوله لا للتوريث لا للتوريث لا للتوريث لا للتوريث لا للتوريث لا للتوريث لا لجمال مبارك لا لجمال مبارك لا لجمال مبارك ماهى خبرته سوى النهب والسلب من أين أتى بأمواله التى يتعالى بها هو وأبوه على الشعب أنها أموال الشعب أنها ثمن بطالة الشباب وثمن الفقر الذى يعيشة الشعب أخرج يا مبارك من مصر أنت وعائلتك الفاسدة لا لمبارك لا لجمال لا لسوزان لا للتوريث ولا للتمديد ولا للفساد ولا للفساد"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "مصر ماتت"
author = "المصرى الاصيل"
posted = "2006-04-25"
text = "مصر ماتت لما وقف اللامبارك يقول اصلاح والمقصود فساد ووقف السيد راشد المنافق يقول يجب ان نعمل بايدى غير مرتعشة ويصفق مجلس المنافقة ويقف العماوى ويقول دعونا نجرب والمقصود المراوغة وعاطف صدقى يعمل خطةالالف يوم والمقصود منة الصبر بالسم الهارى ثم منع التموين عن المواليد لمدة سنتين والى الان صارستة عشر سنة ,والمقصود هو الصبر بالسم الزعاف ثم فتح مفيض توشكى وقالوا اصلاح اراضى توشكى وسرقوا ميزانية البلد وطلع عليناالاعلام اللى مازال ينافق الشعب ويهدم البلديقول توشكى توشكى واتضح انهم سرقوا الارض وسرقوا البنوك ولم يستفد اى شخص من الشعب المصرى من توشكى ومازال الاعلام القذر يحس الشعب على عدم شرب المياة لتوفير المياة للرى للحرامية اللى سرقوا بلادنابواسطة الخونة واطلقت مصر اثنين قمر صناعى من قوت الشعب الاهبل ثم باعوا القنوات وقبضوا الفلوس وهربوها على سيوسرا كل هذا ومجلس الشعب يصفق للفساد كم نادوا الشرفاء على الكف عن هذا العببث بقوت الشعب ولم يسمع لهم احد واليوم الكل يندم على حريق مصر بسبب اللامبارك واولادة وزوجتة.. وخراب يامصر"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "تحيا مصر"
author = "على حسن"
posted = "2006-04-26"
text = "بسم الله الرحمن الرحيم الى كل مصرى منضل عليه ان يعرف ان مصر هى التى قامت بمعونه كل الدول العربيه وهلى راسهم الجزائر وليبيا وسوريا واخيرا واهمهم فلسطين يعنى علينا انا نعرف ان مصر مش بس دوله احنا فيها بس عايزين نحس لما انتصرنا فى 1973 شوف كان ايه الاحساس بمصر"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "فين المصريين وارؤساء"
author = "على"
posted = "2006-04-26"
text = "المصرين دلوقتى مش فى بالهم مصر امال فى ايه ياعلى المصريين بيدوره على حاجتين بس هما المال والنساء مش صح واحد هيسالنى هيقولى ده8 من وجهه نظرك او واحد اخر يقولى اتكل على نفسك صح بس المهم الكلام ده صح ولا لاء المهم ياجماعه احنا والله بعدنا اوى على دينا اللى هو الاسلام ومدام بعدنا على دينا هنبعد ايضا على كل حاجه ولراسهم بلدنا والشاب دلوقتى مش بيفكر والله غيلر فى الروشنه بس مش اكتر مش صح"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "الريس"
author = "على حسن"
posted = "2006-04-26"
text = "ليه كل مانيجى نغلط نقول الريس امال فين المصريين بس على فكره اللى ايده فى الميه مش زى اللى ايديه فى النار يعنى الريس يا جماعه هو السبب فى كل اللى حصل والله لاء والله كمان بالعقل لو كل اللى بيحصل بسبب الريس كانت املريكا احتلنا من زمان"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 11
subject = "السياحه"
author = "على"
posted = "2006-04-26"
text = "كل اللى بيحصل علشان مصر هى احسن بلد واامن بلد واحنا نعرف ان الارهاب هما ايه غير شمويه كلاب لو بيبرروا الاسلام يعنى كل الدم اللى بيحصل ده علشان الاسلام قال لكم موتوا كل الناس ولا ايع عايزين نعرف انتوا عايزين ايه"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 12
subject = "مصر"
author = "على"
posted = "2006-05-10"
text = "اولا بسمخ الله الرحمن الرحيم يا جماعه مصر مستهدفه من زمان من ايام الاحتلال والمشكله مش فى الريس المشكله فى العرب كلهم ماداموا سمحوا للاوربيين انهم يعملوا كده يبقى نستحمل كل اللى بيحصل فينا لالا ولسه هنشوف كل براحه"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 13
subject = "اولاد البلد"
author = "على"
posted = "2006-05-23"
text = "اولا كده احنا ناس زى العسل مش صح واحنا اللى عاملين كده فى نفسنا شوف يا عم من مقال للدكتور زكى نجيب محمود \\بصحيفه الاهرام بعد حرب اكتوبر --ومن ابرز سمات الامه العربيه ايضا الرباط الاسرى الزى يجعل العلاقه بين افرادها تجاوز حدود المصلحه الى ما هو من تلك المصلحه واعمق وهى علاقه يمكن ان تخفى على الرائى فى فترات الحياه العاديه لكنها تشتد ظهورا فى لحظات التازم كاللحظه التى تعيشها الامه اليوى"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 14
subject = "مش هو ده الموضوع"
author = "على"
posted = "2006-05-23"
text = "قد تجلس مع انسان متعلم فتحس انه مظلم من الداخل ثم تجلس الى انسان فطرى امى فتحس انه بداخله نورا يشع على الحياه فمن اين ياتىهذا النور الداخلى؟ان المعرفه الماديه لا تكفى الا لصنع مصابيح الطرقات واضاءتها اما النور الداخلى فلا يستمد الا من المعرفه الروحيه الخالصه المتمثله فى الاتصال الدائم بالله"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124330/http://masr.20at.com:80/article.php?sid=200&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

