subject = "رسالة من مختل عقلياً"
author = "فرعون مصر"
posted = "2006-06-30"
text = "====== رســـــــالــــة مــخــــتـــل عـــقــــلــــيــــاً ======<br />بلدى يا بـلــد الــمــعـتـــقـــلات والتزوير فى الإنــتــخـابــــات<br />بلدى يا حاصله على النياشين فى الحجر عـلـى الـحـريــــّات<br />غصبٍ عنــّى يـا بلدى باغنـّى وحلقى عـشانـك كـلـه مــــرار<br />بلدى يا ورده تايهه وشــارده مــركـب وجــرفـهـا الــتــيّـــار<br />كـنـتى زمــان بــلــد الأمــجــاد وتـــاريــخــك مـــلــيــان روّاد<br />مصرى وعايش ويّا المصرى ولا كان ظلم ولا إســتـعــبـــــاد<br />أقـبـاطـك هـــدمــوا الأصـنــام بـإيـمــان إتحـدّوا الأيـّـــــــــــام<br />وقـت ما كان فى العالم جهـل وقت ما كان فى الدنيّا ظــــلام<br />عبدوا إلــــه واحـــد قـــدّوس راح منهم عـلـشـانــه نـفــوس<br />دم الـشـهــدا فـى كـل مـكـــان روى أراضيكى يا إيـجـيبتوس<br />ظهـر الـسـيـف ولقى له مبرّر خلف شـعـار الـديـن متــســتــّر<br />حـلّـل نـهْــب وحـرْق وسـلْـب قـصـور الـمجـد اللّـى مـاتتقدّر<br />إمتى يا بلدى تفوقى وتصحى مـرّ الأيـام بـان فـى مـلامــحى<br />نفس الـسـيف عالغدر ناويـلك من ضحاياه كان عمّك نصحى<br />عُــدنــا لـعــصـر الإسـتـشـهـاد فى شـمـال وجــنـوبـك يـا بــلاد<br />جرجس و كمال شهدا الأقصر والــزقــازيـق آدى عــم فــــؤاد<br />عجبى عليك يا زمن ويادنيـّا ناس غـوغـاء يـدبـحـوا أبـريّــا<br />الـجـانـى بـرئ طـبعـاً مـؤمـن والمـجـنـى عـليه مـالـهـوش ديّه<br />وإنت يا قاضى ياللّى بتشكى من ظـلـم حــكــومــتك وبــتبكى<br />ليه فى قضايا الـقـبط بـتـظلم ولّلا فى ده مايصحـّش نـحــكـى<br />كـل وزير خـايـف عـالكرسـى واللّــى يـسـيـبه بـيصبح منـسى<br />مهما جمعت هاينتهى عمرك زيّ الخلق فـى تربـه هـاتـرسى<br />ك<br />اقرأ بقية التعليق .."
