[[comments]]
order = 19
subject = "الثمن الذي لم يدفعه الشعب المصري"
author = "مقهور"
posted = "2006-07-25"
text = "ياترى مين اللي قتل السادات ....بيتهيألي ان الناس فاكرين ان الارهابيين هما اللي عملوها...بس لو ركزوا شوية أكيد هيعرفوا دة اذا ماكانوش عارفين و عاملين عبط , للأسف عملنا عبط بمزاجنا لما السادات اتقتل , ودلوقتي بنعمل عبط غصب عننا عشان ملف أمن الدولة اللي بيتفتح دلوقتي مابيتقفلش تاني خالص فاللي عايز يفوق و يعمل ثورة بمزاجة... واديكوا شايفين حركة كفاية كلها في المعتقل... يعني بالعربي بقينا ندفع الثمن اللي عمرنا ما دفعناه وهوا ثمن السكوت ... شعب بيحب حد يسوقه ويقول له تعالى يمين و شمال من غير ما يسأل لية حتى زي الحمار اللي بيجر عربية البطيخ ...تقدروا تقولوا لي موضوع العبارة اطرمخ لية.. الدعارة و المخدرات هيا دلوقتي الشغل الشاغل للشباب ... يعني لما يكون الشباب نفسة اللي هوا قوة المستقبل تافه وأقصى طموحة هوا ( ياترى هخرج مع البنت دي امتى) بدل ما يقرأو قصة حياة هيتلر أو شي جيفارا أو آية الله الخميني أو غاندي... اسأل اي شاب ماشي في الشارع مثلا عن (متى حصل هيتلر على الجنسية الألمانية) والله مش هيعرف حاجة ده حتى ممكن لو سألتة عن عدد أهرامات سقارة ممكن يجاوب غلط...انما اذا سألته اية رايك في جسم هيفاء أو اليسا ممكن يقولك على آخر أخبارهم اللي لسة ماحصلتش.... خللينا نايمين لغاية لما ييجي علينا الدور بعد ايران من غير مقاطعة وده مش بعيد.... وحسبي الله و نعم الوكيل"
