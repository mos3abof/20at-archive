order = 0
subject = "ممكن أختلف معاكي؟؟؟"
author = "محمد السيد"
posted = "2005-11-30"
text = "ي إيه يا بنتي ؟؟؟؟<br />أنا حسيت إنك بتتكلمي عن واحدة تاني غير المستشارة وحشمت تاني خالص وقضية أساسا غير اللي بنتكلم عنها ؟؟؟<br />أنا والله مش بافترض سوء النية ... لكن ممكن تتفهمي غلط ...<br />أولا : الأقواس اللي عاملاها دي ... مش فاهم عايزة توصلي بيها إيه ؟؟ ملهاش لازمة ....<br />ثانيا :: الحديث عن الضغوط ... إنت بتكلمي القضاء ... طبيعي جدا إنها ترفض الحديث معاكي ... دي طبيعة القضاء ..<br />اللي كتير مش قادر يفهمها ... إنه ميختلطش بالإعلام أو الصحافة ... وهي ما كانت لتتكلم إلا لما رأت الظلم والاستبداد اللي كان بيحصل والاسم إنه تحت إشراف القضاء ....<br />هي قالت اللي عندها وشهدت أمام العالم كله ... و كانت شهادتها اساس لحاجات كتيره حتحصل الايام اللي جاية ... إن شاء الله .... وبس ... مش مطلوب منها إنها تعيد و تزيد ... وتحلل وتثبت و...<br />وفي النهاية ... تحياتي ليكي وارجو إنك متزعليش من كلامي ده ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044722/http://egyvote.20at.com:80/article.php?sid=88"

