[[comments]]
order = 0
subject = "لا يوجد"
author = "سيدى اكتر ما اخشاه ان ياتى الطوفان ليبتلعنا جميعا ولا نجد يومها جبل يعصمنا"
posted = "2006-05-17"
text = "قامت قوات مباحث أمن الدولة الآن بمحاصرة منافذ الإسكندرية المؤدية إلي القاهرة لمنع تدفق الإخوان للمشاركة في مساندة ودعم القضاة في محاكمتهم غداً الخميس.<br />فقد شهدت محطات القطار بسيدي جابر ومحطة مصر تواجداً امنياً كثيفاً منذ عصر اليوم الأربعاء 17 / 5 / 2006 وقد أسفرت تلك الحملة الأمنية عن اعتقال كل من:<br />المهندس / محمد إبراهيم نائب رئيس المكتب الإداري للإخوان المسلمين بالإسكندرية.<br />المهندس / إبراهيم السيد عضو المكتب الإداري للإخوان المسلمين<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043432/http://masr.20at.com:80/article.php?sid=343"

