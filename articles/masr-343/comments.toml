[[comments]]
order = 2
subject = "اكيد فى مصر"
author = "ammaaly"
posted = "2006-05-19"
text = "يبقى انت أكيد .. أكيد فى مصر<br />يبقى أنت أكيد.. أكيد فى مصر<br />لما الجنين فى بطن أمه يبايع<br />لما تخاف تمشى فى الشارع<br />لما تلاقى شباب ضايع<br />يبقى أنت أكيد.. أكيد فى مصر<br />لما تلاقى حاكم طاعن فى السن ومتسلطن<br />وإعلامه الرائد على طول بيطنطن<br />لما تاكل أكل كلاب أو متسرطن<br />يبقى أنت أكيد.. أكيد فى مصر<br />لما تموت من الغيط وتطق<br />وما تقدرش تقول لأ<br />يبقى أنت أكيد.. أكيد فى مصر<br />لما تلاقى شقق فاضية وناس فى المقابر ساكنين<br />لما تخاف تعيا وترقد وما تعرفش تروح فين<br />لما يتاجروا باسم الوطنية أو الدين<br />يبقى أنت أكيد.. أكيد فى مصر<br />لما تحارب نهارك كله لأجل القوت<br />ومن القهر أو الذل تموت<br />يبقى أنت أكيد.. أكيد فى مصر"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043432/http://masr.20at.com:80/article.php?sid=343"

[[comments]]
order = 3
subject = "زعلان وحزين"
author = "ليس بالاعتقال وحده يحيا الطغاة .وإنما بالتعذيب والسحل والامتهان والتضييق والمطاردة .. هذا غير أرتال السماجة والصفاقة والجبروت .. ومن عجب أن ذلك ليس مرده قوة أومنعة من الطاغية . بل سببه ضعف واستكانة وهوان الشعب على نفسه وتفريطه في ابسط حقوقه ..مما نتج عنه فرعنة الفأر المذعور . أمام خوف القط المرعوب.ولقد نعلم انه في الأثر دخلت إمرأة النار في هرة(قطة) لأنها حبستها فلا هي أطعمتها ولا هي أطلقت سراحها ؟؟؟ فما بلك فيمن يحبس إنسانا بلا ذنب أو جريرة وقد يكون مريضا فيمنع عنه الدواء وقد يكون طالب علم فيحرمه من التعليم وقد يكون رب أسرة تتفكك وتتحلل أو تنحل أحيانا أمام غول الحياة ومطالبها وقسوتها ومطامعها .. وقد يكون مؤمنا بالله فيكفر تحت ضغط القهر والظلم والتعذيب وضياع أروع ما يملكه وهو عمره في غياهب المعتقلات والسجون والتشتيت والحرمان من تكوين أسرة وإنجاب ذرية وصلة الأرحام ..ماذا يقول هذا الطاغية حينما يقف منتصبا ذليلا أمام ملك الملوك الديان .بماذا يجيب حينما يسأل عن الأنفس التي أزهقت والتي عذبت والتي سجنت والتي وئدت والتي أمرضت والتي أكفرت والتي ماتت قهرا وقضت حزنا ولوعا بفعل زبانيته وبعمل يدية لكي يحافظ على عرشه الملوث بدماء الأبرياء . بماذا يجيب وهو المكروه الممقوت ولسوف تكون فضيحته أمام الخلائق جميعا يوم العرض العظيم وملايين الضحايا يمسكون برقبته وتلابيبه ويسوقونه أمام عرش الرحمن مكبلا في أوزاره ومطوقا بخزاياه وذنوبه وكبائره هو ومن ظاهرة من الأذناب الكلاب الزبانية الذين لايعرفون لهم ربا غلا كلبهم مع شديد إعتذاري للكلاب .. الم يقرأ أو يسمع يوما على أحدث مكبرات الصوت والإنارة التي تحيطه أنى ذهب وأنى ارتحل قول الديان(وإذا الموؤدة سئلت بأي ذنب قتلت) والموؤدة هي الطفلة الأنثى المولدة فيد"
posted = "2006-05-22"
text = "اقرأ بقية التعليق .."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043432/http://masr.20at.com:80/article.php?sid=343"

[[comments]]
order = 4
subject = "كلنا محمد السيد"
author = "الاستاذشيكو"
posted = "2006-05-26"
text = "مع ان انا جديد علي الموقع بس حاسس ان محمد السيد ده صحبي من زمان وكلنا محمد السيد. اما ان فيه محترم لم تعتقل فهذا كلام غير صحيح كلنا معتقلون في وطننا الكبير نفس اللي اسرائيل بتعمله في الفلسطينيين بيعمله نظام حسني وشركاة في الشعب المصري ولكل واحد عايز تصلح حاجه في البلد الخربانه دي"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043432/http://masr.20at.com:80/article.php?sid=343"
