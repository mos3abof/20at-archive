subject = "رد على الأمبراطوووور"
author = "نعم مبارك هو المسئول عن خلق وظائف للشعب بعد لما باع المصانع والشركات وطرد العمالة إللى فيها وبعد لما نهب خير مصر فى حساباته يعنى الإيرادات إللى كان من الممكن أن تقام بها مشاريع ليعمل بها ملايين الشباب ولكنه نهب إيرادات قناة السويس والسياحة والبترول والغاز الطبيعى وغيره وغيره شوفوا رصيده دلوقتى بقى كام مليار هو والمحريث ولاده جمال وعلاء ولا مراته إللى رايحة جاية سفر على حساب الشعب ولا فيش أى نص فى الدستور يسمح ليها بكده الشعب أولى بتكاليف السفريات الغريبة بتاعتها قال إيه علشان تدى محاضرات فى فرنسا هى فرنسا ناقصة علماء علشان المتخلفة دى تروح تدى محاضرات عن أطفال الشوارع هى كانت فلحت مع أطفال الشوارع بتوع مصر إللى عددهم أكثر من 3 ملايين وأصبح منهم عصابات لأغتصاب الأطفال وقتلهم وبعدين المال السايب بيعلم السرقة وميزانية مصر كلها فى كرش مبارك وعيلته هو فيه حد بيحاسبة على أى حاجة"
posted = "2007-01-30"
text = "مليون مشروع ومدرسة بأسم مبارك ياترى بناهم من مدخراته علشان يسمح لنفسه يطلق عليهم أسمه ولا لزوم النفاق ليه فين فلوس مصر عايزين مشاريع للشباب عايزين مصانع تشغل العمال إللى أنطردوا من أعمالهم كفاية نهب وسرقة يا مبارك الكفن مالوش جيوب مش ده إللى أنت قلته بعد لما قتلت السادات ودفنته الظاهر الكفن كله أصبح جيب ليك وياريته يكفى حسبى الله ونعم الوكيل الله المنتقم الجبار على ما أصاب مصر فى عهدك الفاسد"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

[[comments]]
order = 17
subject = "لا للفقر ..لا للبطالة.. لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-01-30"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو الوسيلة الوحيدة للتوظيف.<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا.<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />5) الغاء الاجازات بدون مرتب , وتقليل الاجازات المرضية لتصبح شهر فقط وبعد ذلك يطرد الموظف المريض اذا تجاوزها ويفصل من الخدمة نهائيا, واجازة وضع واحدة لمدة ثلاث اشهر ولمرة واحدة فقط للموظفات .<br />6) من حق الطرف الاول (الحكومة) الاستغناء عن الطرف الثاني(الموظف) في اي وقت ولاسباب يراها الطرف الاول , دون ان يحق للطرف الثاني الرجوع علي ذلك.<br />ولا استطيع عرض باقي البنود الظالمة من قانون الوظيفة العامة الجديد.<br />من الاخر ياناس ده قانون ظالم وسيهدم اركان المجتمع الذ<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

[[comments]]
order = 18
subject = "فكره"
author = "ايمن امام"
posted = "2007-01-31"
text = "ايها الحاقدون على ابناء الذوات الذين تحجز لهم الوظيفه قبل ان يولدوا- انتم جميعا لاتفهمون ان البلد فى مرحله دقيقه وحساسه - ولابد لكل الجهود من ان تتكاتف - لكى ننطلق الى الامام- لقد استطاعت الحكومات المتعاقبه ان توفر حياه كريمه للشعب المصرى - لقد تمكنا من حل مشكله التليفونات- زمتن لما كان الواحد يحب يعمل تليفون كان بيسافر قبرص - الخصخصه مدروسه - وحمايه العمال هى الشغل الشاغل لى ليل ونهار- رجال الشرطه هم درع الوطن - لم نقصف قلما - لم نغلق جريده - لانتدخل فى اعمال القضاء- انفقنا العام اللى فات مليار وستمائه مليون جنيه - لتوفير فرص العمل للشباب- وبالفعل وفرنا الوظائف لكن الشباب هما اللى مش عاوزين يصحوا بدرى- الدوله تمكنت من ان تتحكم فى سعر البانجو لانه تقريبا الحاجه الوحيده اللى ماغليتش- دا مش انجاز- وفرنا لكل شاب مطرب دا مش انجاذ- وفرنا لكل شاب مخبر دا مش انجاز- وفرنا لكل شاب لعيب كره دا مش انجاذ- وفرنا لكل شاب كرسى على القهاوى اللى ماليه البلد دا مش انجاذ- شباب اليومين دول شباب متدلع - شوفو عيالى وخلوهم قدوتكم- شوفو عيال فلان وعلان وخلوهم قدوتكم - من مصروفهم شوفو عملوا ايه واتعلموا- اعرف واحد من مصروفه اشترى بلد يلعب بيها ليل ونهار - وواحد تانى صحى من النوم ودماغه بتزن من الحلم اللى حلم بيه وهو ان يكون رئيس مجلس اداره فسادستان- ويعين اصحابه فى كل حته ويجيب شعب شكله حلو من بره بدل الخلق العكره اللى مفروضه عليه- اعملو زيه- اوعى تحلم انا بهزر- ماانتو عارفين ايه اللى هايحصل لو حلمتو بكده - امضاء / بابا !!!/ ايمن امام"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"
