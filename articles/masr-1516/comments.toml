[[comments]]
order = 8
subject = "برافو يا أميره"
author = "منير أديب"
posted = "2007-01-30"
text = "فعلا برافو يا أميره ، الموضوع أكثر من رائع ، وأفضل ما أعجبني فيه اللغه الجميله والحوار الممتع بينك وبين العجوز وبين العجوز وأبنها ، علاوه علي الحس الصحفي المتيقظ فيك والذي جعلك تقفين لمتابعة ما يحدث بين هذه الأمه وفلذة كبدها ، بل تصلينا إليهما، لتعرفي المشكله، ومن ثما تعليقينا عليها ، بصراحه الموضوع يستحق أن نرفع القبعات عالية تحيه لكي ولما كتبته، وأنصحك بالبعد شوية عن كتابات الإخوان والإسلام السياسي ، وياريت تدور علي هموم المواطن العادي ، لنك بالفعل أبدعتي في هذا الموضوع ، ربما لحسك المرهف بهم رجل الشارع العادي ، وربما لأن الكتابه في هذا المجال تستحويك ، المهم المحصله واحده ، أن فعلا قلمك حلو في هذه الموضوعات ، ياريت متدفنيش نفسك ، وتستمر في هذا النوع من الكتابه"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

[[comments]]
order = 9
subject = "لــ\" شريف الدواخلى \" مبروك على الشهرة"
author = "فارس_fr"
posted = "2007-01-30"
text = "انت عارف باللى انت بتعمله ده بتفكرنى بايه _ فى افراح الفلاحين دايما تلاقى مجموعةمن الشباب ,الفاضي طبعا لاشغله ولامشغله , دايما الشباب دول كل يوم يدوروا عن اى فرح او مناسبة يدخلوا يهيصوا ويهللوا ويطبلوا للعريس والعروسة وهم لايعرفوه ولايعرفهم والاخر يدخلوا يتعشوا وكل يوم على كدا , بحثا عن الهيصة والعشا .<br />انت بقي فىكل تعليقاتك على اى موضوع زى الشباب دول بالضبط . عارف بيتقال عليهم ايه -بلاش اقول عشان متزعلش<br />عموما انا وزى زى غيري من الشباب مستنين الجديد من سيادتك وبيتهيالى ان الموضوع الى يقدمه شريف الدواخلى لا يوجد فيه ثغرة للنقد ,اجتهد زىماقلتلك قبل كده وطلعلنا حاجه حلوة مش ناقصين فلسفة , لان ماشاء الله عليك كونت قاعدة كبيرة من المعارضين ليك . منتظرين القنبلة الدواخلية !!!"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

