[[comments]]
order = 0
subject = "البرنامج الانتحاري للرئيس مبارك"
author = "احمد نظيف"
posted = "2007-01-29"
text = "عدد العاطلين وصل الحد لله الي 10 مليون عاطل من الشباب.<br />وقد تبادل سمو الوالي المقدس حسني مبارك المعرص<br />التهاني مع سمو الخليفة جيمي مبارك باشا التهاني بهذا الرقم العظيم .<br />وقد اعرب معالي الوزير احمدنظيف الخفيف سعادته بهذا الرقم مع تمنياته الكبيرة بزيادة هذا الرقم ليصبح 15 مليون في الخطة الخمسية القادمة.<br />وقد اعلن معالي الوزير نظيف في الصحف الحكومية المباركية انه من اهم انجازات عهد العارف بالله المقدس حسني المعرص انه اذا وقف العاطلين بجوار بعضهم البعض في طابور فسوف يصل الطابور من الاسكندرية الي اسوان, وتهدف الخطة الخمسية النظيفية القادمة وصول طابور العاطلين من الاسكندرية الي دولة جنوب افريقيا بهدف دعم العلاقات المصرية الجنوب افريقية, وتشجيع الاستثمارات والخصخصة والمصمصة."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

[[comments]]
order = 1
subject = "كله خلاص عقود يا شباب يلا ايكش تولع"
author = "انتصار"
posted = "2007-01-29"
text = "اظن ان من اهداف البرنامج الانتخابي للرئيس مبارك ان يوفر فرص العمل للشباب وليس فرص الوهم والخديعة لهم.<br />احمد نظيف وباوامر من الخنزير حسني مبارك العميل الغي فكرة التعيين في الحكومة والقطاع العام يعني من الاخر مش في تعيين في الحكومة بعد كده وكله اصبح بالعقود المؤقتة خلاص ومش في تثبيت مع قرب موافقة مجلس الوزراء علي قانون احمد درويش المريض نفسيا الوزير الذي يهدف الي تشريد ما يقرب 5,6 مليون موظف في الحكومة , ومع ذلك يوجد تعيينات في الخباثة للمحظوظين من اعضاء ولصوص الحزب الواطي الديموكتاتوري , يعني خلاص البلد حتولع قريب ان شاء الله والشباب الي مش لاقي فرصة عمل عليه بحمل السلاح في وجه الحكومة العميلة , حكومة العميل مبارك."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

[[comments]]
order = 2
subject = "120 ولا 48"
author = "هش"
posted = "2007-01-29"
text = "يااااااااااه طب ما الراجل مبسوط اهو وهياخد 120 جنيه فى اليوم ..وميه ميه<br />والقشيه معدن<br />انا من الشرقيه بردوا<br />اختى طالعه الخامسه على الدفعه فى كليه الحقوق<br />ومتعينتش طبعا<br />مع ان لو بنت دكتور طالعه العاشرة كانت اتعينت<br />المهم<br />قدمت فى النيابه الاداريه ورفضنا ندفع الستين الف جنيه اللى من تحت الترابيزة<br />هو مش وافقنا ..هو مش قدرنا ..مهو مش كل ما نعوز حد يتعين هندفعله 60 الف<br />المهم<br />ومقبلتش طبعا فى النيابة<br />دلوقتى بقى طبعا شغاله<br />فى المجلس المحلى<br />مشروع السرفيس والمواصلات<br />ب 48 جنيه شهريا<br />والله عمار يا مصر<br />وربنا يخليلنا حسنى اللى مهنينا ومعيشنا<br />احسن عيشه"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

[[comments]]
order = 3
subject = "كلة من الفساد والرشاوى لية تستغربوا بقة"
author = "سيف الاسلام"
posted = "2007-01-29"
text = "الحقيقة ان البطالة دى سببها الفساد والرشاوى وكل حاجة فى حياتنا بقت بفلوس واللى معاة يلزمة واللى معهوش ميلزموش يعنى وباختصار الوظائف واللة موجودة وقدامى ناس كتير بتشتغل بس كل حاجة لها سعرها والرشوة اللى على قدها واللى معهوش ميلزموش وبما ان الشعب كلة معهوش يبقة مليزموش اتفرجوا من اول حسنى الخنزير الى الى عامل الزبالة فى الشارع كلة بياخد رشاوى هو دة اللى ودانا فى داهية وبعدين انا عايز اعرف هى لية الناس مش بتعترف بالشغل الا فى الحكومة ولما هاشتغل فى الحكومة هاخد كام يعنى100 ولا 150 بالكتير دول مايجوش حق جزمة فيها لما ندور على الشغل الحر صدقونى واللة اللى بيدور هيلاقى بس مشكلة الشعب بتاعنا انة عايز مكتب ويقعد على وياخد فلوس لما الواحد بيسافر برة مصر بيشتغل اى شغلانة ومبفرقش معاة ولما يجى يشتغل جوة فى مصر ميشتغلش اى شغلانة علشان كلام الناس والوجة الاجتماعية ودة عيب فينا بردة وفى الاخر ربنا ياخد الحرامية اللى فى البلد ويريحنا منهم"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

[[comments]]
order = 4
subject = "اة يا اميرة"
author = "فهد الا سلام"
posted = "2007-01-30"
text = "اة يا اخت اميرة لو اقولك الى جوياة من حقد وكبت على هذا النظام الفاشى لكنت ولعت الدنيا عايز اقولك ان اعرف ناس مش انا يعن لتفتكرى انى محتاج وظيفة ولا حاجة ناس مش لقية تا كل والله الذى لا اله الا هو واحسب على هذا الكلام فية ناس اعر فهة مش لقية قوت يومها المهم زى ما اقولتك انا كويس الفلوس كتيرا جدا جدا لدرجة انى الواحد مش عارف يعمل حاجة طبعا انتى فا همنى الى عاوز اقولة انى فية نا س ليها 18 سنة مخلصة دراسة ومش لقية شغل وبتكلم بجد تخيلى 18 سنة من العذاب للواحد لقى شقة ولا عر وسة والشعر ابيض حتى القعدة على القهوة لزمله فلوس وطبعا مفيش شغل وبعد كل دة نسمع عن مش عارف قال اية ريس الشركة المصرية للا تصلات بيخد نصف ملييون جنية مرتب بتا ع البورصة بياخد مليون ومرتبات من هذا القبيل الى شهلر واحد منها يعين نصف شباب مصر يا اختى حسنى اية وزفت اية احنا الى وصلنا نفسنا الى هذا الوضع ولو اتكلمنا نبقى ار هابين ومتخلفين وحسبى الله ونعم الوكيا فيك يا حسسسسسسسسسسنى وفية اخرة وهنقتص منك يوم القيامة"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

[[comments]]
order = 5
subject = "تعقيب علي المدعو (سيف الاسلام)"
author = "المواطن المطحون"
posted = "2007-01-30"
text = "دايما نقول المشكلة في الناس الغلابة دايما الحكومة غلبانة والشباب هو الي فاشل عايز يجلس علي مكتب ويصدر اوامر, لو عايزين الحل في القضاء علي مشكلة البطالة يتلخص في 5 بنود:<br />1) التخلص من المستشاريين حوالي (25 الف مستشار) تعدوا السن القانونية للمعاش (60 سنة) والذين يتقاضون مبالغ تتراوح من 3000 جنيه شهريا الي مليون جنيه لبعض المحظوظين منهم وطبعا هذه المبالغ يتقاضوها في الشهر نظير الولاء للحكومة وللحزب الذي يعطيهم الاموال من الخزانة العامة للشعب حيث يتقاضون ما يتراوح مليار ونصف المليار , بينما يتقاضي الشاب الخريج الجديد 250 جنيه عند تعيينه , وبحسبه بسيطة ممكن ان نوفر وظائف لــ اربعمائة وستين الف خريج من العاطلين .<br />2)يوجد في الحكومة حوالي ستمائة الف درجة خالية لا يوجد من يشغلها وذلك باعتراف رئيس الجهاز المركزي للتنظيم والادارة.<br />3)النزول بسن المعاش لـ55 سنة حيث ان ذلك سيوفر ما بين مليون الي مليون ونصف فرصة عمل في الحكومة مباشرة .<br />4) تعديل قانون العمل الخاص بالعاملين بالقطاع الخاص بحيث يجعل القطاع الخاص يثبت العامل عنده ويؤمن عليه ويعطيه حقوقه الوظيفية كاملة مثل قانون العمل في الحكومة.<br />5)الاعتراض علي القانون السيء الذي ينوي وزير التنمية الادارية احمد درويش وهو قانون الوظيفة العامة الجديد الذي يهدر مكتسبات الموظفين والعمال علي مدي سنوات ويجعل من التعاقد فقط هو الوسيلة الوحيدة للتوظيف مع فكرة الاستغناء عن الموظف في اي وقت مما فيه اهدار للحقوق وعدم المساواة مع بين الموظفين في حق العمل ( المساواة بين الموظف الدائم والمؤقت)."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

[[comments]]
order = 6
subject = "الانهيار قادم قادم قادم"
author = "الدولة باعت القطاع العام والمصانع والشركات اللى كان لهم فائدتين"
posted = "2007-01-30"
text = "الفائدة الاولى تشغيل اليد العاملة العاطلة واكساب الناس خبرة عملية ممكن يشتغلوا بيها برة ويجيبوا دخل للبلد<br />الثانية المصانع دى كانت بتجيب دخل للخزينة العامة تدفع منها مرتبات وتعمل مشروعات وتصرف على الامن المركزى ومباحث امن الدولة وغيرة<br />طيب الدولة هتعوض الدخل دة منين بتاع المصانع اللى انباعت يبقى من القروض والمساعدات الخارجية والضرائب<br />طيب الناس معدمين وما بيدفعوش ضرايب والقروض عايزة فوائد والمساعدات مش مضمونة يبقى الخراب قادم<br />الاقتصاد صفر<br />تقوموا تقولوا الدولة تشغل الناس ازاى وفين<br />الا اذا شغلتهم فى الازرق<br />يعنى يشتغاوا مخبرين ومباحث سرية ويضربوا المظاهرات والبنات<br />سلام مربع لنظيف وبتوع الاقتصاد الحر"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

