[[comments]]
order = 11
subject = "إللى أختشوا ماتوا"
author = "نظيف فى مؤتمر صحفى فى دافوس وقف وقال إن مشكلة البطالة فى مصر أصبحت ليست البحث عن عمل فقط ولكن فى تدريب العمالة الجديدة على الأعمال!"
posted = "2007-01-30"
text = "قال الكلام ده وهو يعلم أن المصانع تباع والعمالة المدربة التى دفعت فيها الملايين لتدريبها تسرح فى الشوارع وعلى القهاوى<br />قال الكلام ده وهو يعلم أن أموال بيع المصانع والشركات هربت لرصيد مبارك وعائلته والمنتفعين من ورائه<br />قال الكلام ده وهو يعلم أن خيرة الشباب من الأخوان المسلمين يوضعون فى المعتقلات ويساقون للسجون خيرة الشباب من أساتذة الجامعات وأصحاب الأعمال التى تنهب أرصدتهم الحكومة وتجمدها حتى يغلقوا مشاريعهم وطبعاً محلات سعودى وغيرها تشهد على ذلك<br />الوظيفة الوحيدة للشعب الآن هى طرد مبارك وعائلته إللى خربوا مصر ونهبوها وبعدها الشعب كله هيلاقى وظائف وخير كثير"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

[[comments]]
order = 12
subject = "وظيفة فى الحكومة ...... ازاى ؟"
author = "فارس_fr"
posted = "2007-01-30"
text = "اعتقد انه من المستحيل حاليا انك تلاقى وظيفة حكوميةمن غير رشوي , من غير واسطة من غير محسوبية , وفى الاخر تلاقى الفساد عم من ظلمة وفسدة ورشاوى وعمولات ياقلبي لاتحزن . ماالبلد وشعبها باعوا القضية الكل جبان وخايف من السجن والمعتقلات , خايف من قلة القيمة والاهانة ... .....<br />نصيحتى لكل موظف جديد احب انقله الابيات دى واكيد انتوا عارفين مين صاحبها :<br />تسرق شلن تبقى هيصه وبلوه وجَرِيمَه<br />تسرق أُلوف الأُلوف تبقى م الابطال<br />وكل ما السرقه تكبر .. القانون سيمه<br />وكل ما السرقه تصغر .. فيه حرام وحلال<br />وتيجى تُجْرُد تلاقى الحسبه عال العال<br />مسددين الخانات والمِيَّه فى المِيَّه ..<br />فيه خانه ناقصه ؟.. حريقه فجأة مش ع البال<br />وابقي قابلنى إن لاقيت حنفيه الميه<br />عقود عمل ع القفا بس العمل بره<br />هاجر وسيب البلد مفروشه للغربان<br />يعنى يا إما السجون يا الشنق يا الهجره<br />يا اما تهمه جنون يا العيشه ع الصلبان<br />يا اما تسْـكر وتسْـكر زيى ليل ونهار<br />ونهار وليل .<br />اسقينى واعمينى لو حتى بميّه نار<br />علشان ما احسش بإن السيف على الرقبه.<br />* بعض الابيات تم تعديلها لان كان فيها كلمات ميصحش انقلها , بس دىحاجه بتحصل كل يوم فى السلم الوظيفى اللى الناس بتجرى وراه ."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202032324/http://masr.20at.com:80/article.php?sid=1516"

[[comments]]
order = 13
subject = "العيب فينا احنا"
author = "الامبراطور"
posted = "2007-01-30"
text = "ياجماعة انتو بتلوموا علي الريس حسني مبارك الريس هيعمل اية بس حرام عليكم ميبقاش كلام ده هوة الريس مسئول عن توظيف كل واحد في البلد ولا اية احنا ننام وبعد كده نحاسب الريس علي انه مشغلناش ياناس دوروا علي نفسكم وبلاش الاتكال علي ان الريس هيعملنا كل حاجة الريس الله يكون في عونة مش كفاية الضغوط الامريكية والبلاوي الي بتحصل في الشرق الاوسط والنار الي محاصرانا من كل ناحية كمان عاوزين الريس ينيمنا ويصحينا ويغطينا ويلبسنا ويدلعنا يناس حرام عليكم دوروا علي نفسكم بقي بلاش تستنو حد يدورلكم علي مصلحتكم"
archived = "2007-02-02"
