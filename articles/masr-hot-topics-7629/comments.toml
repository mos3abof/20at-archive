text = "انت رايح بعيد لية طيب ما هم بيتدربوا على الغزو والانزال وعمل جسور على الشاطىء ومن سنين طويلة كل دة بيتم فى مناورات النجم الساطع امال هما بيتدربوا ويصرفوا فلوس لية ؟ حبيبى البروفة جاهزة ؟"
