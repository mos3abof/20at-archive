subject = ""
author = "بوحة"
posted = "2007-11-21"
text = "أيوة صح<br />عشرينات عندهم بعد نظر<br />و ده واضح في المواضيع بتاعتهم<br />مش عارف هاني سلامة ركب الميكروباص<br />و ده يا حبايبي موضوع بيتكلم عن إن مشكلة المواصلات… مش عارف حد شايف بعد نظر في الحكاية دي؟<br />ولا الموضوع اللي مش فاكر إسمه بتاع ولاد الباشوات اللي عاملين جروبات أمثال شعبية عالفيس بووك<br />ياااااااااااااا اااااي ده أيه بعد النازار اللي عندوكوا ده<br />واضح إن عشرينات وصلت بيهم إن هما يكتبوا تعليقات عن نفسهم<br />قشطة عليكوا<br />لو طلع علي التعليق ده نهار"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131103842/http://www.20at.com:80/masr/hot-topics/7629.html"

[[comments]]
order = 12
subject = ""
author = "اكتب اسمك هنا"
posted = "2007-11-22"
text = "يا جماعة الصورة حلت المشكلة<br />بنات لابسين حجاب الراس والملابس محزقه جدا ولا تستر جسم الفتاة وتوضح مفاتن جسمها فالاخ الكاتب بيلفت النظر الى ذلك ان المفروض الواحدة طالما لابسه الحجاب تلبس ملابس فضفاضه لا تطشف مفاتن الجسم<br />والعنوان يا كارينة يا ساتر بنات مصر<br />تريقه على ان الكارينا محزقه قوي وبتبين مفاتن الجسم وبالتالي تجعل الحجاب لا قيمة له<br />تماما كما هو في الصورة"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131103842/http://www.20at.com:80/masr/hot-topics/7629.html"

