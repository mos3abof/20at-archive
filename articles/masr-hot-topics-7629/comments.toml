text = "مع كامل احترامى وتقديرى لكل التعليقات السابقه<br />المشكله الاساسيه يا استاذ احمد ان فيه ف السوق تقليد للكارينا بنفس السعر بس ال material مختلفه و ناس كتير بينضحك عليها و بتشتريه<br />يا ريت الكل ياخد باله يا جماعه"
