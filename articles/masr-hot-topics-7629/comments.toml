text = "جزاك الله خيرا موضوعك جميل ولاتلتفت الي التعليقات اللسلبية وربنا يبارك في مجهودك وادعوك الي زيارة موقع نصرة رسول الله وتقديم العون لهذا الموقع ان اردت فهو من اعظم المواقع الاسلامية واسال الله انيبارك في جهدك وياريت تزور الموقع وشكرا"
