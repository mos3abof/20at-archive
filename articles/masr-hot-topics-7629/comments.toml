subject = ""
author = "غتت"
posted = "2007-11-19"
text = "هنعمل زى الاعلام الحكومى نسطح عقل القارىء ونزرع التخلف العقلى فى ادمغة الناس<br />البنات لبست او قلعت هتأثر في اية<br />هل اللبس مشكلة قومية عاملة لنا صداع فى الحياة ونكد فى المعيشة ؟<br />يا جماعة الخير شوفوا همومنا القومية<br />البطالة والجهل والفقر والمرض والادوية المغشوشة وتزوير الانتخابات<br />مشكلة التعذيب والاعتقالات الليلية وحقوق الانسان<br />انما البنات بتلبس اية - يا سيدى ما يلبسوا ويعيشوا حياتهم فى حدود الحشمة والادب والتقاليد بتاعتنا<br />ابوها او جوزها عايز كدة انت مالك"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131103842/http://www.20at.com:80/masr/hot-topics/7629.html"

[[comments]]
order = 1
subject = ""
author = "قربت اكره الفيس بوك"
posted = "2007-11-19"
text = "والله لو هتكلم على الكارينه يا ريت يبقى موضوع مش من الفيس بوك الى خنتوقونا بيه والله انا من اعضاء الفيس بوك كرهته بسببكم انتم ازاى تبقى مجله شامله مورهاش غير الملك فاروق عظم الله قدره والفيس بوك وهاى ستايل حرام عليكم ياريت تشوفوا الشارع فيه ايه شوفوا الغلابه الى عيشين من غير نت ولا حتى موبايل وبلاش فيس بوك ولا فاروق ( تيم ) وبعدين هنتكلم ونقول الكارينه لازق على الجسم هيبقى احسن من المنى جيب بتاع السبعينات ولا ايه يا عشرينات ؟<br />وعجبى"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131103842/http://www.20at.com:80/masr/hot-topics/7629.html"

[[comments]]
order = 2
subject = ""
author = "اكتب اسمك هنا"
posted = "2007-11-20"
text = "الاخوة المعترضين على مواضيع عشرينات مش فاهمين حاجه<br />عشرينات مهمته هو ابراز التفاهات اللي شاغله الشعب المصري<br />اي تفاهات يتكلموا عنها<br />عملية مقصوده ومهمة جدا لتبصير الشعب المصري بعيوبه<br />والمحررين اوعوا تفتكروا انهم بيشتغلوا من دماغهم<br />ابدا دي خطة وسياسة مدروسة وعنهم رئيس تحرير بيوجهم وعندهم مدير تحرير بيراقب وعندهم سكرتير تحرير<br />والمواضيع في غاية الاهمية للي عنده بعد نظر"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131103842/http://www.20at.com:80/masr/hot-topics/7629.html"

