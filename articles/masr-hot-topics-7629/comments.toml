[[comments]]
order = 14
subject = ""
author = "زهرة الإسلام"
posted = "2008-09-28"
text = "السلام عليكم ورحمة الله وبركاته<br />يا اخواتي لا تحزن هنقول ايه غير حسبنا الله ونعم الوكيل في اللي صمم البادي دة<br />حسبنا الله ونعم الوكيل<br />اصل العيب مش عليهم العيب على البنات<br />لادول مش بنات العيب على المستهترات اللاتي لا تراعين حشمة ولا حياءا واشترته وارتدته<br />اين اولياء الامور<br />ولازم نهتم بالموضوع دة مع احترامي لكل من قال ما اهمية ان البنات تلبسولا مش تلبس<br />ازاي يا اخواننا بتقولوا كدة<br />اين اتباع دين الله وسنة حبيبه ؟<br />اين انتم حين تستهيفون هذه القضية فلا تجد منيقاومها بل تجد المرحبين<br />اتقوا الله في انفسكم وبناتكم<br />اتقوا الله<br />ماذا ستقولوا لله حين يسألكم هل غيرتم هذا المنكر من حولكم هل قاومتوه ؟<br />ماذا كان دوركم في هداية بنات المسلمين والحفاظ عليهم<br />والله لن تجدوا ما تقولوه<br />لاني بصراحة وجدت بعض من ردودكم البلهاء الباردة التي بالفعل لن نتحرك بها الى الامام بل الى الوراء قدما<br />اين الغيرة يا ابناء الاسلام ؟"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131103842/http://www.20at.com:80/masr/hot-topics/7629.html"

