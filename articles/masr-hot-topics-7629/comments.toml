posted = "2007-11-20"
text = "إنت مالك البنت تلبس أيه ولا تهبب أيه؟ طيب ما بالمرة كنت تقول إن الصبيان بقت موضة عندهم يلبسوا..!!!! و إن الناس بتحب العيش البلدي لما يبقي طازة يا عم دماغك و إتكلم في حاجة مفيدة دي موضة و حتتنسي زي ما جت فترة الميكروجيب ما كان موضة و العباية ما كانت موضة و بكرة … محدش عارف حيحصل أيه بكرة"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131103842/http://www.20at.com:80/masr/hot-topics/7629.html"

[[comments]]
order = 7
subject = ""
author = "طبعا محدش حيفهم حاجه"
posted = "2007-11-20"
text = "بسرعة<br />فيه كتاب اسمه على هامش السيرة كان بيتكلم عن احداث حصلت قبل البعثة المحمدية وان المجتمع الجاهلي بيحتضر لان الدين الاسلامي سيبقى على انقاض الجاهلية<br />الان فيه احداث بتحصل في مصر تدل على ضعف المجتمع وتفككه وشبه انهياره ونستطيع ان نقول هذه الاحداث على هامش حدث كبير مقبل على مصر وهو الغزو الامريكي لا قدر الله<br />الا اذا<br />فاق الناس وعادوا لرشدهم وتنبهوا للاخطار المحيطة بهم واصبحوا يدا واحدة وقوة واحدة يطيش ويتحطم عليها الاعصار القادم تماما كما يصطدم الاعصار بالجبال<br />طبعا محدث فهم حاجه"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131103842/http://www.20at.com:80/masr/hot-topics/7629.html"

[[comments]]
order = 8
subject = ""
author = "zo000m"
posted = "2007-11-21"
text = "يا جماعة اانا حاسس اننا فعلا بقينا شعب سطحى قوووى وبنتفرج على الغرب وبنحاول نقلجها فى كل الموضة والحاجات والهايفة علطووول يعنى عمرنا ما قدلنهم فى العلم ولا فى التفرغ للتعليم الصحيح ولا فى العمل الدؤب بضمير وذمة<br />تصوروا اليهودى برضه عنده زمه متينة جدا احلى مننا الشعب العربى اللى تربى للاسف حاليا على الكسل والاكل على الجاهز<br />ولا تتعجب انها حياتنا اللتى سلبونا ايااها بطرق غير مباشرة للاسف<br />مشكوور للمحرر على الموضوع فعلا مضووع جميل ويارت نعرف يا بنات بقه يا اخواتنا اللى فى كل البيوت هتستعملوا الكارينا دى فى اصول المعقوول وفى حدود الحشمة والوقار اى تحت الحجاب مثلا ولاخفاء المعصم ولا تحت البديهات والتى شيرتهات النص كم وما خفى كان اعظم"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131103842/http://www.20at.com:80/masr/hot-topics/7629.html"

