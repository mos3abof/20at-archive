text = "لذيذ موضوعك يا احمد والله جدا وفعلا الكارينا بئه موضه فظيعة والتجار بيستغلوا الحاجه دي وبيرفعو اسعارها جد والبنات لمسطحين بيشتروا المهم يلبسوا الموضوه ربنا معاك يا احمد وتهدى بنات مصر"
