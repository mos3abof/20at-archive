[[comments]]
order = 5
subject = ""
author = "خالد الامير"
posted = "2007-11-20"
text = "مش عارف ياعم احمد ياهواري ساعات كده بحس ان الحس الصحفي بيخونك وبتقدموا موضيع ولاليها لازمه ياعم كارينا ايه واستريتش ايه خلاص احنا فاضين مفيش ولا مشكله غير الكارينا ما هولو فيه … مكنش فيه واحده تطلع كده من بتها ولا لوفيه دين اساس مكناش وصثلنا لخلاعه دي والمسخره وخلاص ناقصين احنا كارينا ومارينا معندناش مشاكل ومصر المؤتمر الجاي بتاع حزب المهلبيه حيناقش مشكله الكارنيه ياعالم احنا عارفين كويس ان الموضه ديه حاجه مدسوسه علشان نتلهي بيها وعي راي الدكتور مصطفي محمودلو الموضه طلعت انهم يركبوا ديول حنركب علي طول لانا شعب بناخد اسوء ما عند الغرب ما انهم خدوا احسن ماعندنا وبيطبقوا ارحمونا ،الناس مشلاقي تاكل ولاتشرب ولاتنام حيلقوا الكارينا حسبي الله ونعم الوكيل"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131103842/http://www.20at.com:80/masr/hot-topics/7629.html"

[[comments]]
