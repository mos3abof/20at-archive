[[comments]]
order = 14
subject = "المصري اليوم والاخوان"
author = "الي اخواتي"
posted = "2006-12-13"
text = "المصرى اليوم فعلا انصفت الاخوان كثيرا لأنها جريدة تقول الحقيقة<br />واحنا او انا بحبها شخصيا علشان بتقول الحقيقة مش علشان بتنصف الاخوان ... بالعكس انا هحبها اكتر لو الاخوان غلطوا وهى نقدت الخطأ ده ...<br />لكن لى تعقيب \" اللى حصل من الشباب ده مش عنف ... العنف انك تعتدى على حد او ايذاء حد<br />لكن اللى حصل كان مجرد استعراضات علشان يحسوا بالعزة ويفرغوا الطاقة اللى عندهم<br />انا اخوية من طلاب اخوان جامعة الازهر ... والكلام بتاعى من مصدر موثوق"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216210914/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 15
subject = "لا نتجني علي المصري اليوم"
author = "الفيلسوف"
posted = "2006-12-13"
text = "ان ما حدث هو خطا شنيع يضر الاخوان جدا وهو من الممكن ان يكون خطوة فى طريق مسدود<br />اذا رفعت امامى سيف لتقتلنى وانت لا تمتلك الا السيف فانى ساحاول ان اقتلك ولكنى ربما امتلك دبابه او صاروخ فسئقتلك بهم<br />بذلك ربما تبرر الحكومه رد فعلها تجاه اى عنف من الاخوان<br />المصرى اليوم كلمه صادقه كثير ما انصفت الاخوان فلا يجب الان ان نتجنى عليها بالكذب والتهويل"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216210914/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 16
subject = "الاعتذار مش عيب"
author = "فلسفي"
posted = "2006-12-13"
text = "فعلا الاعتذار شئ واجب والعنف مش بالتشابك فمثلا لمايمنعوكم من دخول الانتخابات ده عنف بدون اى تدخل للاجسام العنف هو العنف<br />وانتم طلاب لسا الخبره السياسيه قليله ولما يحصل غلط امر جايز ولما يحصل نقد امرجايز ولما يحصل اعتذار فامر واجب وكذلك التحيه لمن اعتذر امر واجب"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216210914/http://masr.20at.com:80/article.php?sid=1294"

