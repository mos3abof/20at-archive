posted = "2006-12-23"
text = "اه ياعم الاخوان ارهابين والدليل النقراشي وعبد الناصر<br />واخيرا ما حدث بالازهر<br />انتم ارهابين متحولوش انكم تنكروا"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231001043/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
