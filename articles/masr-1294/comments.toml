subject = "الواد العجيب"
author = "ابو يوسف"
posted = "2006-12-13"
text = "يا واد يا مصري يا بتاع اليوم انت له صحيت من النوم عاوز جنازة وتشبع لطم وعاوز خناقة<br />انت منا يابن الجلاد ولا انت علماني وتحب اللت<br />العجن انت بتعشقة واللت انت بتبدعة وانت كنت فين ومخفتش علي ولاد ك من الوطني<br />يا واد يامصري يا بتاع اليوم<br />يا واد يمصري لو انت صادق وبجد واخد علي نفسك العهد وفي الصحافة هتقول الحق<br />انشر بيان طلاب الاخوان لو انت تقدر منغير متسال المخبرين والمرشدين<br />اسف اقصد اقول حمدي باشا رزق"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216210914/http://masr.20at.com:80/article.php?sid=1294"

