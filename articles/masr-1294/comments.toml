author = "اه ده الموضوع قديم"
posted = "2006-12-25"
text = "اه الموضوع القديم ده في مواضيع اجدد منة الموضوع مات<br />حتي ان الطالب الي بيتكلم فية<br />في المعتقل<br />اه ده يا ناس ارحمونا بقي"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130010206/http://masr.20at.com:80/article.php?sid=1294"

