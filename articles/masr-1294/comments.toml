[[comments]]
order = 3
subject = "على الأقل نضمن منهم شجاعة الاعتذار"
author = "إبن بهيه"
posted = "2006-12-13"
text = "هذا تعليق كتبته إلى الأخ براء في صفحة أخرى .. أعتقد أنه يصلح هنا أيضاً ..<br />مناقشة أي موضوع يا أخ براء مش مشكله بس بموضوعيه وبعيدا عن إهانة الآخرين أو تجريحهم وخصوصاً عندما يكونون في منزلة السيد المرشد العام للإخوان المسلمين الذي نقدره جميعاً وإن اختلفنا في توجهاتنا ، ومبعث التقدير ليس لشخصه فقط وهو يستحقه وإنما لأنه موضع تقدير من ملايين المصريين وحتى غير المصريين ، وبالتالي لابد أن نحترم هؤلاء الملايين وإن غضبنا منه هو شخصياً ، وهذا هو الفرق البسيط جداً بين الناس الذين يحترمون أنفسهم وبين الغوغاء ، فضع نفسك حيث تحب من الفريقين .. أنا لا أنتمي إلى تنظيم الإخوان المسلمين ، بل على العكس ربما يعتبرني البعض مناهضاً لأنني ناصري ولكن والله لم أدخر وسعاً في جلاء الحقيقة دوماً في أي أمر يخص الإخوان لأنهم جزء كبير جداً يصل إلى نصف عدد المصريين وتجاهلهم مصيبة لمصر والهجوم عليهم مصيبة أكبر لمن يعي ويفهم ويحب هذا الوطن حباً حقيقياً غير تجاري.<br />لا يكاد يختلف اثنان على أن السيد مهدي عاكف رجل مليء بالطيبة والتلقائية التي تتغلب في داخله على شخصية القائد السياسي الذي يجيد أساليب المكر والخداع والكذب واللوع ، ومن يقول بغير هذا فهو كاذب ومخادع ويضحك على نفسه من الأساس قبل أن يضحك علينا ، من يتابع أحاديث الرجل الإعلامية يتأكد تماماً أنه شيخ وداعية ليس أكثر وهذا وضعه الحقيقي الذي ينجيه من تبعات الدور السياسي الذي يحمله إياه البعض كرهاً ، فلا يكاد الرجل يصيب في أي موقف برغم صدقه وبراءة كلماته التلقائية لجملة أسباب سياسية في نفس تجار الوطن الذين يحملون كلمات الرجل أكثر مما تحتمل وكثيراً ما يغيرون معانيها ودلالاتها ، حين تحدث فضيلة المرشد عن أمله في إرسال عشرة آلاف مقاتل إلى لبنان لمناصرة إخوانهم<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216210914/http://masr.20at.com:80/article.php?sid=1294"

