[[comments]]
order = 0
subject = "كلاب المصري اليوم"
author = "فارس_fr"
posted = "2006-12-13"
text = "يعنى لم بلطجية الحزب الوطنى دخلواالجامعات وضربوا الطلبة كلها اخوان مع يساري مع كفاية كله على كله ,, مسمعتش صوتك يا حمدى يا كلب ,, لم منعوا الطالبات المنتقبات من دخول المدينة الجامعية مسمعتش صوتك يا كلب ,, انت عنك حق فى السطر التانى اللى قلت فيه ان البلد محتله ,, فعلا هى محتله من كلب زيك كده واولادة وحاشيته ,,, يا حمدى يا واطى يا مخبر يا معفن ,,, الاخوان انظف منك ومن اللى زيك ,,,, اللى زيك اللى هو \"كرم زفت جبر \" اللى امبارح اتكلم فى العاشرة مساءا ومستغرب وخايف من اللى حصل ,, ازاى هيودى ابنه ولا بنته الجامعه بعد الى حصل من الاخوان ,,, طب يارب يكون فعلا من الاخوان ويكونوا هم اللى منظمينها ويكون فعلا عندهم تنظيم جهادى ,,,, كفاية بقي كفاية عليكوا كده يا كلاب البلد ,,, ارحمونا وارحموا شعبها الغلبان هو لم بلطجية الحزب الوطنى يبهدلوكم ويضربوكم على قلبكم زى العسل والاخوان لم تعمل عرض سلمى ويارب يكون ليهم علاقة بيه ,,, خلاص القيامه قامت .... انت يا حمدى انت وكرم من كلاب الحكومة وابواقها لموا نفسكوا لانكم هتكونوا اول الضحايا يا ولداه فى عمليةالتطهير ان شاء الله ..... وارحمونا بقى ياولاد البلد من حمدى زفت ده ومقالاته السخيفه . الاخوان انظف منك ومن اللى جابوك وعلى فكرة\"انا لا اخوان ولا لى علاقة بيهم \" بس بداية مبشرة وعسي ان تكون حقيقة .<br />اسف على تكرار التعليق ولكنه ينفع هنا مع كلاب المصري اليوم وروزاليوسف"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216210914/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 1
subject = "ويمكرون ويمكر الله"
author = "حسام بن البلد"
posted = "2006-12-13"
text = "بسم الله<br />والله اما مش عارف هما ليه مصتقصدين الاخوان تركوا الشيوعين يعملوا والسلفين وكل الحركات الا الاخوان وهم بذلك ي}كدون على قوة الجماعه الصامده التى روت دمائهم الاراضى العربيه وهاهم فى فلسطين والعراق لا تجد دولة بها حرب على الاسلام الا ووجدتهم هناك ولكنهم يأبون الا الذل والهوان واقول لكم ان الله تعالى هزم الاحزاب وحده فالزى هزم االاحزاب وحده سيهزم حزب واحدا وانه لمصدره ورئيسه ابليس يوحى اليهم انا حاربوا كل ما هو مسلم وكل ما هو شريف ولا يعلمون بذلك انهم يحاربون الله فى منهجه<br />واخيراااا.........<br />اعملوا ما شئتم انه بما تعماون بصير<br />الله غايتنا والرسول زعيمنا والقران دستورنا والجهاد سبيلنا والموت فى سبيل الله اسمى امانينا<br />واللــــه اكبــر وللـــه الحــــمد"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216210914/http://masr.20at.com:80/article.php?sid=1294"

