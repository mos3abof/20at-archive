author = "مش مهم"
posted = "2006-12-23"
text = "اه ياعم الاخوان ارهابين والدليل النقراشي وعبد الناصر<br />واخيرا ما حدث بالازهر<br />انتم ارهابين متحولوش انكم تنكروا"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130010206/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
