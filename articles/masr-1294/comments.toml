posted = "2006-12-25"
text = "اه الموضوع القديم ده في مواضيع اجدد منة الموضوع مات<br />حتي ان الطالب الي بيتكلم فية<br />في المعتقل<br />اه ده يا ناس ارحمونا بقي"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231001043/http://masr.20at.com:80/article.php?sid=1294"

