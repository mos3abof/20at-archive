author = "ايناس فؤاد"
posted = "2006-12-20"
text = "ليس لنا ان نقول فى هذا الامر الا عجبى عليكم يا حكومة مصر ويا امن الدولة او قراصنة الحكومة, البلد كلها قيدة نار مش الازهر بس واين تلك الحاكم المبجل من كل هذا واين ماما سوزان هل هم للاعلان فقط ام ماذا ونصيحة لبابا حسنى انه يخلى امن الدولة او خيبة الدولة اكتر من كدة بمعنى على كل مواطن بلطجى من امن الدوله يكون ملازم لية زى ظله لكي لا يحدث اى حاجة تعكر صفوكم دة اذا كان اصلا بيتعكر وحسبنا الله ونعم الوكيل ورسالتى لكل من يحس بالظلم والمذلة فى ارض الله ان يستعينوا بالله ويقاوموا حتى ان كان بالراى واكيد حيجى يوم ومصر حتتحرر من اسواء استعمار لها على مر الزمان, بسم الله \"لا تهنوا ولا تحزنوا وانتم الاعلون ان كنتم مؤمنين\"صدق الله العظيم"
archived = "2006-12-21"
capture_url = "https://web.archive.org/web/20061221131655/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 24
subject = "مهزلة معتادة"
author = "د محمد سيد نصر"
posted = "2006-12-21"
text = "مافعله الاخوان ليس غريبا عنهم فهو تنظيم سياسيتمحك في عباءة الدين للوصولل الي اهدافه البينة لكل ذي لب عاقل ولكن شاءت الاقدار ان بعرف منهج الاخوان واختلافه عن عن السلفيين في كل دقيق وجليل"
archived = "2006-12-21"
capture_url = "https://web.archive.org/web/20061221131655/http://masr.20at.com:80/article.php?sid=1294"

