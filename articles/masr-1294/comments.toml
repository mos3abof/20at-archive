archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231001043/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 31
subject = "اقتلوهم"
author = "راجل"
posted = "2006-12-26"
text = "انا ادعوا المسلمين في هذة المصر الى اخذ الحكم و لو بالقوة فقد فاض الكيل و قد حانت لحظة الخلاص من حكم العسكر اللذين اذلونا و القونا في الوحل و لم يتركوا مجال الا للعمل المسلح فلسنا نصارى حتى يضربوننا و يذلوننا و نعطيهم الخد الايسر بل العذة و الكرامة للاسلام و المسلمين و من يدعي ان ذلك ارهاب او حكر على الفكر فليجد لنا طريق غير ذلك فقد تمت كل المحاولات السلمية دون جدوى بل شد النظام العلماني من قسوتة و جبروتة<br />وليت للاخوان مليشيات حقا و لا اظن ذلك فخطواتها هي لاستدرار عطف و مؤاذرة شعب بلا كرامة<br />و اقراو التاريخ (الثورة الفرنسية , الحرب الاهلية الامريكية , سيرة خاتم النبيين و صراعة مع \"اهلة\" قريش , الثورة البلشيفية و ......)<br />ستعرفون اني على حق"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231001043/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 32
subject = "مصري"
author = "له بس كده"
posted = "2006-12-28"
text = "نقتل ونموت له الكلام الكبير ده<br />براحة يا شباب براحة"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231001043/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 33
subject = "؟؟؟؟؟؟؟؟؟؟"
author = "انا عاوز اسال سؤال هو الاخوان المسلمين دول شيوخ وائمه ولا مواطنيين مصريين ؟؟؟"
posted = "2006-12-29"
text = "ولو مواطنين ليه عاملين الدين شعار وبيتكلمو فيه وبيفتو كتير وهما مش رجال دين ميسيبو الاسلام فى حاله ويسمو نفسهم الاخوان المصريين<br />ولو هما شيوخ وائمه ورجال دين ليه عاوزين<br />النفوذ والسلطه والحكم ميهتمو بعباده الله وتنفيذ الفروض وتوعيه الناس بالدين الاسلامى بدل مبيسيؤ ليه باعمالهم وبعدين رجل الدين ده المفروض يكون قدوه صالحه تهدينا الى الله مش تهدينا الى النفوذ والتعصب والعنصريه والارهاب وحب السلطه"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231001043/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 34
subject = "ياابراهيم"
author = "اولا انا اصلا مش فى مصر"
posted = "2006-12-30"
text = "وثانيا انا حاصل على دكتوراه فى فلسفه المحاسبه من جامعه برلين ولو انا فى مصر عمرى مكنت حصلت على الدكتوراه وانا فى السن ده<br />يعنى الى عاوز اوضحهولك انى بفهم مش بلى زى مبتقول وعلى العموم انا الى غلطان انى حولت انى اخد معلومه من موقع زى ده<br />انا هبحث جيدا وسوف احصل على ما اريد من مواقع اخرى<br />وشكرا"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231001043/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 35
subject = "إنكشف المستور"
author = "احمد منصور"
posted = "2006-12-30"
text = "كنا بسذاجة نعتقدان برنامج العاشرة مساءا يتمتع بهامش من الديقراطيه هو والبيت بيتك فى ظل هذا الحكم البغيض لكن سرعان ما ظهر جليا ان قطيع امن الفرعون هم المحرك الرئيسى من خلف ستار لكل هذه البرامج --- فمتى نعى ما يدبر لنا؟؟؟"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231001043/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 36
subject = "ابراهيم"
author = "اولا شكرا علي الرد"
posted = "2006-12-30"
text = "وثانيا<br />موقع عشرينات موقع محترم<br />ثالثا<br />انا سالت سوال زي مااتنت سالت سوال انا بقول لك<br />لو الاستاذ الي كتب بلي مش فاهم حاجة نفهمة لكن كون انت متعرفش مين الاخوان نعزرك بجهلك<br />زده سوال بري<br />ولو انت مش بتحب التحاور ده امر تاني<br />والسلام عليكم"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231001043/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 37
subject = "حكومة ولا إخوان"
author = "كمال"
posted = "2007-01-07"
text = "حكومة ولا إخوان كله واحد كلهم بيخربوها وهيعدوا على تلهاوالخاسر الوحيد اللى ملوش فى الطور ولا الطحين المواطن الغلبان"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109141917/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 38
subject = "يا رب شعللها كمان وكمان"
author = "أبو أحمد"
posted = "2007-01-07"
text = "يارب شعللها كمان وكمان احنا مش هنخصر اعملنا لأننا عاطلين عن العمل ولا هتبوز عربياتنا لأن معندناش عربيات ولا بيوتنا هتكسر على اللى فيها مش مهم المهم اشوفها والعة يارب تقبل منا وتزيد وتولع على الحكومة وعلى الشعب اللى يستاهل الحرق واللى ساكت على اللى بيتعمل فيه إخوان ولا إرهاب ولا حكومة ولا ظابط مرتشى ولا عامل حرامى ولا دكتور بيكتب دواء بيقتل فى الناس ولا مهندس بيأخذ عمولة احنا ملناش إلا الحرق يا رب ولع فينا كلنا من أول الريس لغاية العاطل اللى على القهوة"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109141917/http://masr.20at.com:80/article.php?sid=1294"

