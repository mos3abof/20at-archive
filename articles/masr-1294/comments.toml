text = "معلش الي بيقول الاخوان ارهابين ممكن يثبتت فعليا وواقعيا وتاريخيا اه الارهاب الي عملوه<br />الي عنده دليل يتكلم"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130010206/http://masr.20at.com:80/article.php?sid=1294"

[[comments]]
order = 4
subject = "الهندي"
author = "صهيب ربنا معاه"
posted = "2006-12-23"
text = "يا شباب الواحدكل مايقرا الموضوع يفتكر صهيب الملط وادعي له وقول ربنا معاك ويفك اسرك وينجحك ويثبتك"
archived = "2007-01-30"
