[[comments]]
order = 10
subject = ""
author = "sally"
posted = "2009-12-26"
text = "ربنا يخليلى أختى وابنها وميحرمنيش منها ابدا …<br />انا واختى كمان كنا ناقر ونقير لغاية سنتين فاتوا … من قبل ما تتجوز …هههههههه هه ده حتى أخر خناقه قويه كانت بنا كانت يوم فرحها وقبل ما تروح للكوافير … ده احنا كنا فوق راس بعض … خناقات عاللبس وعالاكسسوارات وعالموبايل وعلى كل حاجه ممكن تتخيلوها… بس انا طول عمرى كنت بغير على أختى…وعمر ما حد عاكسها او ضايقها غير لما اتصدرله…حتى لو كنا متخاصمين ونا مش طايقاها…وعلى الرغم من انها اكبر منى بسنتين ..بس سبحان الله حصلت حاجات قبل جوازها ومن بعد جوازها اكتشفنا فيها اننا بنحب بعض اوى وكل تصرفاتنا بقيت بتقول كده مش عارفه ازاى ده حصل رغم خلافتنا الشديده …ده احنا صوت خناقتنا كان بيجيب أخر الشارع … بس لو تسألونى دلوقتى مين أهم حد فى حياتك … أقولكم أمى وأختى وأحمد ابنها اللى على طول بحس انه ابنى انا وحته من قلبى وروحى"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106181546/http://www.20at.com:80/banat/variety/12713-2009-07-20-13-44-36.html"

