subject = "السيناريو"
author = "محمد المصرى"
posted = "2006-06-10"
text = "اسمحو لى ان ارسل لكم سيناريو التوريث كما تخيلة شاب مصرى مهموم مطحون زى شباب مصر كلهم<br />* مشهد رقم واحد:<br />مبارك في صالة بيته، يجلس على سجادة صلاة بشكل علم مصر، ويمسك في يده مصحف، وعلى الأرض نسخة من قانون الضرايب الجديد، تركز الكاميرا على الساعة التي تشير عقاربها إلى الرابعة AM، ويعلو صوت مبارك بالتسبيح..<br />مبارك: يا رب، يا رب الواد جمال ربنا يهديه كدة ويكمل نص دينه، ويارب أشوف ابنه ييجي يصلي معايا العصر ونبقى أنا وهو أكيد في مصر.. يا رب أشوف ابنه بيشجع معايا مصر في بطولة كأس أفريقيا 2030.. يا رب..<br />صوت الباب يفتح، ويدخل جمال وهو يمشي مترنح..<br />مبارك: إنت جيت يا حبيبي<br />جمال: إحم.. بابا.. إنت إيه اللي مصحيك لحد دلوقتي..<br />إنت موش وراك حكم الصبح، كدة تروح الرئاسة متأخر..<br />مبارك: يا ابني.. أنا من ساعة ما حكمت البلد دي وأنا موش شايف شكل النوم، الأمانة اللي في رقبتنا تقيلة قوي، يلا بقى عشان تيجي تشيل معايا الحمل<br />جمال (وهو يقبل قانون الضرايب): ربنا يخليك لينا يا بابا<br />مبارك: يا أبني بقى موش ناوي تعقل وتكمل نص دينك<br />جمال: وهو أنا عرفت أجيب النص الأولاني<br />مبارك: بتتريق حضرتك، طيب اتفضل أدخل أوضتك، محروم من لجنة السياسات لمدة أسبوع، ومفيش مؤتمرات ولا مناكفة مع عمك صفوت غير لما تتجوز، يلا أمشي من وشي، جتكوا نيلة.. مليتوا الحزب<br />جمال: والله ده ظلم<br />مبارك: بتبرطم بإيه يا ابن الـ......<br />* مشهد رقم اتنين:<br />أمام الجامعة الأمريكية، الطريق واقف، عربات مصفحة على اليمين والشمال، يقف جمال في وسط الشارع أمام باب الجامعة<br />اقرأ بقية التعليق .."
archived = "2006-06-14"
