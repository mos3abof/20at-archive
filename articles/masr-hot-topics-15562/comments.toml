posted = "2010-03-03"
text = "طب السؤال بقى مايبقاش خطك ببيانات ولا لأ<br />المفروض نسأل طب هما عايزين البيانات ليه وأنا هديلهم بياناتى ولا لأ<br />فيه طبعاً زي عقد منظم للخدمة بين العميل و الشركة لكن المفروض يبقى فيه البنود اللى على المستخدم أنه يلتزم بها مع الشركة و العكس صحيح .<br />بس ليه بقى ياخد بياناتى وأرقام تليفوناتى وعنواني والحاجات دى كلها ..<br />المسألة مسألة أمنية بحتة ومالهاش أى علاقة بالخدمة ولا بالتعاون بين العميل والشركة<br />انا شخصياً أتصلوا بيا قبل كدة وقلتلهم معلومات مضللة …"
archived = "2010-03-08"
