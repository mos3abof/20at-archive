text = "الاخت الفاضلة / د . منى<br />كل عام وأنتم بخير<br />ياريت نعطى هذا الموضوع المزيد من الاهتمام لان هذه المشكلة بدأت فى الانتشار بشكل كبير ويعرف ذلك كل من له مشكلة سمعية سواء عنده او بأحد من الاسرة ويذهب للعلاج ويلاحظ هناك الكثير والكثير من المرضى بهذا المرض الخطير الذى يحجب صاحبه عن المجتمع تماماً خصوصاً لو كانت درجة ضعف السمع عالية جداً<br />ولم نجد اي معلومات تنبهنا وتجنبنا المخاطر من استعمال سماعات الاذن التى تقوى السمع وانا من رأيى انها تزيد من ضعف السمع وهذا عن تجربة حقيقية مع اولادى فسمعهم يزداد ضعفاً عام بعد عام وهذا يسبب لهم مشاكل بالدراسة والمتابعة والتفاعل مع اصدقائهم , ولا ندرى ماذا نفعل .<br />فياريت ننشر بشدة كل شئ عن ضعف السمع خصوصاً طرق الوقاية قبل العلاج وتنبيه الناس بمثل هذه المخاطر<br />واريد طبيب متخصص اهرض عليه اولادى لان عندهم مشاكل كثيرة بسبب رضعف السمع<br />محمد سعد الدين<br />محمول 0122721424<br />Email : mizosaad_2@yaho o.com<br />ونشكركم جميهاً"
