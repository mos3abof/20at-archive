author = "لا خاص ولا حكومى"
posted = "2009-08-13"
text = "مفيش شغل لا فى القطاع الخاص ولا فى الحكومة<br />يبقى نسرق<br />او نخطف<br />ولو شطار يمسكونا<br />نخطف بنات ونتحرش ونبيع كابلات التليفون واسلاك الكهرباء ونخطف السلاسل ونسرق عربيات<br />نعمل اية<br />اية الحل<br />طيب الحكومة والوزير دة بياخد مرتب علشان اية<br />علشان يقول مفيش"
archived = "2009-08-15"
capture_url = "https://web.archive.org/web/20090815090113/http://www.20at.com:80/masr/2khbar/12922-2009-08-13-06-59-09.html"

