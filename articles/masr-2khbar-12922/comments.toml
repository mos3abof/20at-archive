author = "مش ححبك"
posted = "2009-08-13"
text = "مفيش تعيينات احسن<br />ولزومه ايه التعيينات<br />القعده في البيت احسن<br />يعني الواحد يروح يشتغل وياخد مرتب يا دوب المواصلات يبقى لزومه ايه<br />نقعد في البيت"
archived = "2009-08-15"
