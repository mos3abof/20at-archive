subject = "الجابر : يجب أن نهزم إسبانيا برباعية!!!"
author = "سامى الجابر ..بيستعبط !!"
posted = "2006-06-20"
text = "أكد سامي الجابر قائد المنتخب السعودي أن مباراة \\\"الأخضر\\\" الأخيرة في نهائيات كأس العالم أمام إسبانيا ستكون رسالة إعتذار يقدمها اللاعبين للجماهير السعودية بعد الخسارة القاسية أمام أوكرانيا برباعية نظيفة.<br />وقال الجابر في تصريحات نشرتها صحيفة الرياض السعودية يوم الثلاثاء : \\\"ليس لدينا أي عذر على الإطلاق ، نحن لم نتوقع أبدا أن تكون النتيجة بهذا الشكل ، فقد قاتلنا حتى النهاية لكننا لم نوفق\\\".<br />وخسر المنتخب السعودي برباعية نظيفة أمام نظيره الأوكراني يوم الإثنين ضمن الجولة الثانية للمجموعة الثامنة في بطولة كأس العالم بألمانيا.<br />وتابع الجابر : \\\"منتخب أوكرانيا قدم مباراة جيدة وكان رد فعله كبير بعد خسارته في مباراته الأولى برباعية أمام إسبانيا ، وفوزه علينا بالنتيجة ذاتها يشكل درسا لنا وأيضا يعطينا عبرة قبل مواجهة إسبانيا في مباراتنا الاخيرة ، إذ يتعين علينا تكرار ما فعلته أوكرانيا\\\".<br />وأعرب مهاجم فريق الهلال عن إعتقاده بأن هناك ركلة جزاء ضده لم يحتسبها الحكم قبل نهاية المباراة قائلا : \\\"الهدف السريع الذي دخل مرمانا في الدقيقة الرابعة أثر كثيرا على معنويات اللاعبين كما أن الهدف الثالث في الثواني الأولى من الشوط الثاني حال دون تقدمنا كما حدث في مباراة تونس ، كما أعتقد ان هناك ركلة جزاء لمصلحتي لم يحتسبها الحكم\\\".<br />وضعفت آمال \\\"الأخضر\\\" في التأهل لدور الـ16 بعد توقف رصيده عند نقطة واحدة قبل مباراته الأخيرة مع إسبانيا أقوى فرق المجموعة."
