text = "اخوانا الاخوان المسلمين عايزين يقيموا دولة اسلاميه ويطبقوا شرع الله وسنة النبي محمد صلى الله عليه وسلم<br />والنبي محمد صلى الله عليه وسلم حسم شكل الحكم من بعده حتى يوم القيامه فقال صلى الله عليه وسلم<br />\"في رواية صحيحة انه صلى الله عليه وآله وسلم أخبر عن ان الخلافة بعده ثلاثون عاماً ثم تصير ملكاً عضوضاً، ((وان هذا الامر بدأ نبوة ورحمة، ثم يكون رحمة وخلافة، ثم يكون ملكاً عضوضاً، ثم يكون عتواً وجبروتاً وفساداً في الأمة)) ، فأخبر صلى الله عليه وسلم عن مدة الخلافة الراشدة وهي ثلاثون سنة، وتكمل هذه المدة بالأشهر الستة لخلافة الحسن رضي الله عنه، ثم تتعاقب السلطنة والجبروت وفساد الأمة\".<br />وفهمت أن هذا من تنبئات الرسول وقد تحققت، فقد تنبأ بأن بعد ثلاثين سنة سيصبح الملك عضوضا أي يصيب الرعية فيه عسف وظلم كأنهم يعضون فيه عضا، أي تبدأ مرحلة من الإختلافات<br />وبناء عليه<br />فعلى المسلم السمع والطاعة في المعروف لمن قهر المسلمين بسيفه<br />هذا هو كلام اهل السنة والجماعة"
