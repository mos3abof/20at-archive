[[comments]]
order = 4
subject = "فيها اية ؟؟"
author = "هشام"
posted = "2005-12-22"
text = "فيها لما واحد يبوس ايد الشيخ الذى يحترمة<br />هو متضايق لية ؟<br />هل لانها نابعة من احترام حقيقي وليس من نفاق معلوم للجميع<br />نائب الاخوان له مرجعيةطبعا مثل اي نائب ينتمى الي حزب سياسي يجب ان تكون مرجعيته افكار الحزب<br />موتو بغيظكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113551/http://www.20at.com/article2.php?sid=118"

[[comments]]
order = 5
subject = "و الباقى بيلحس الاحذية"
author = "محمد"
posted = "2006-01-25"
text = "اذا كان الاخوان بيبسوى ايد المرشه فقد تكون هذه تقبل التلميذ ليد المعلم و معظم الناس هتفهم كدى مثل ما يفع الكير من امة او ابوه<br />و لك انا اهتقد ان باقى اعضاء مجلس من الحزب الى ما يتسمى قبلوا فعلا الجزم بل و لحسوها و خاصة جذمة جمال و الشازلى و الشريف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113551/http://www.20at.com/article2.php?sid=118"

[[comments]]
order = 6
subject = "حسد و حقد"
author = "جميل ولد كهمس"
posted = "2006-01-27"
text = "عودتنا روز اليوسف عبر محرريها وكتابها بمختلف مراكزهم وتوجهاتهم ,على مها جمة كلما وكل من يمت إلى الإسلام بصلة,حيث نصبت نفسها كمدافع شرس عن المنكرات والمعاصى,وعن من يمارسونها,وهذا ماحدا بها إلى أن تحتل القوائم الأخيرة فى سجل الصحف الصفراء,التى لا يعبأ بها القارئ ولايحترمها المثقف,وليست المبالغة فى الصورة المذكورة والتى لا تتنافى كما ذكر كاتبكم (الكبيرسنا)مع الشريعة الإسلامية ولانكم تجهلون كلما يتعلق بالإسلام والمسلمين فأود تذكيركم بماصنع زيدأبن ثابت بإبن عباس عندما ألتقاه وقبل يده,ليست هذه الصورة سوى أمتدادا للدور الحاقد الذى تمارسه جريدتكم التافهة على الإسلام وأهله ,لكن أبشروا بخزيكم وبعزة اللإسلام والمسلمين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113551/http://www.20at.com/article2.php?sid=118"

[[comments]]
order = 7
subject = "دعوا الكلام لآخرين"
author = "مسmuslimلم"
posted = "2006-02-01"
text = "أولا ليس لمثل تلك الصحيفة أن تتكلم عن المتدينين عموما بمثل هذا الكلام الأحمق.لكن أيضا علي الاخوان أن يعيدوا مراجعة الكثير من المبادئ . فقد رأيت بعيني مثل هذا الموقف و لم تطب له نفسي . اللهم اهد المؤمنين الي ما فيه نفع الاسلام ولا تشمت بنا عدوا يا رب العالمين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113551/http://www.20at.com/article2.php?sid=118"

