[[comments]]
order = 0
subject = "مش ناقص غيربتوع روز اليوسف كمان"
author = "حسبنا الله ونعم الوكيل........."
posted = "2005-12-19"
text = "مفيش غيرها ...ارفعها لربنا وهو وحده إن شاء قادر علي كل شئ ..<br />يعني انتم بتبوسوا مبارك ليل نهار..<br />وبتتمسحوا في ابنه صبح وليل ..<br />وماسحين جوح لحرمه صيف وشتاء....<br />وجايين دلوئتي تتكلموا عن قبلة نائب لمرشده ومربيه الأكبر ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113551/http://www.20at.com/article2.php?sid=118"

[[comments]]
order = 1
subject = "اللهم احفظنا ......"
author = "محمد السيد"
posted = "2005-12-19"
text = "هههههههه .... والله العظيم ضحكتني وأنا في أيام امتحانات ....<br />فعلا مش ناقص غير بتوع روز اليوسف اللي يكلموا عن قبلات الإخوان .....<br />طب إنتم فاتحينها علي البحري .... صور وحكايات وأفلام ... والمجلة حالها في النازل علي الآخر ...<br />شوية دم يعني .... ولا خلاص مفيش .... ؟<br />وبعدين المدعو عبدالله كمال .... ده !! والله العظيم بيصعب عليا لما بأشوفه في التليفزيون ...<br />حاجة غير محتملة أولا .... ثانيا بيكذب بطريقة لا تصدق .. يعني الواحد لو عنده شك في حاجة وسمعها منه ... تجيب رد فعل عكسي تماما ...<br />يعني انت لو كنت مصدق قبل ما يأكد لك هو ... بعد كلامه متصدقش ولا كلمة ..<br />و لو كنت متشكك ومكذب حاجة ... وهو أنكرها...علي طول بتلاقي نفسك لا تلقائيا بتصدقها...<br />أنا نفسي والله بجد .. أقابل واحد من الناس دي .. أكلمه ويكلمني .. و أشوف بجد ؟؟<br />هو معقولة مصدق نفسه أساسا؟؟ أو ممكن ييجي علي باله إن الناس ممكن تعتبره رمز صحفي أو مفكر سياسي ... ؟<br />والله العظيم دول غلابة...... ادعوا لهم ...<br />لا للتمديد... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113551/http://www.20at.com/article2.php?sid=118"

[[comments]]
order = 2
subject = "صدقك ،،، وهو كذوب"
author = "إخوانجي ،،، عامل"
posted = "2005-12-20"
text = "رداً على الموضوع ، لا أجد أبلغ من كلمات سيدنا رسول الله صلى الله عليه وسلم لأبو هريرة عندما زاره الشيطان وعلمه كلمات ينفعه الله بها، وقد كانت هذه الكلمات هي اية الكرسي ...<br />فلم يكن رد رسول الله عليه ان الشيطان ماله ومال اسلامنا أو ان الشيطان ده فيه كيت وكيت ، كما جاء في ردود التعليقات التي اعتقد انها ستزيد على نظام مين عبد الله كمال ده اللي ينصحنا ، ومين عبد الله كمال ده اللي هو أوةل من باس الايادي أيادي اسياده في امن الدولة ووووووو<br />اخواني ، بجد لابد أن ننطلق من امراضنا النفسية المزمنة التي جعلتنا نرفض النصيحة لمجرد أنها خرجت من شيطان اسمه عبد الله كمال رغم ان قدوتنا رسول الله - زي مابنقول في شعارنا - لم يرفض تلك النصيحة مخن الشيطان عندما زار أبو هريرة<br />ورغم اعتراضي على اسلوب عبد الله كمال الفج وأدلته العبيطة إلا أنه يظل تساؤل صغير مجرد من كل الكلام الكتير اللي في المقال ؟<br />هل يصح للمتحدث الرسمي باسم الكتلة البرلمانية الاخوانية في مجلس الشعب ( نائب الشعب قبل ان يكون نائب الاخوان ) أن يقبل يد المرشد العام ؟<br />لو حتقولوا يصح ،،، يبقى ماتنقدوش وماتزعلوش من حد بيمسح جوخ السيد الرئيس<br />ولا ايه ،،،،،،،،،،، وتحية للبراء أشرف<br />ورحم الله امريء أهدى الي عيوبي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113551/http://www.20at.com/article2.php?sid=118"

