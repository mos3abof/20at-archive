text = "والله عال عبدالله كمال وروزاليوسف مزعلاهم أوى البوسه دى وعلشان هما مالهومش غير فى الموالسه والنفاق بس ما يعرفوش انها مش حرام ولا مكروهه أساساومين فينا ما بيبوس ايد أبوه أو أمه أومعلمه(المرشد)على العموم البوسه دى أشرف من التسبيح بحمد مبارك ليل نهار"
