[[comments]]
order = 0
subject = "جمعية الإستشهاديين"
text = "لماذا لا نقوم بتعاون بيننا جميعا..ندخر الأموال من أجل تنفيذ عملية استشهادية..كل مجموعة قد تصل إلي هذا المبلغ لو أرادت حقاً وأصدقت النية..لا تقول من سيأخذ النقود وكيف ستصل إلي هدفها الحقيقي..لا تدعو الشيطان يأكل عزيمتك..أخلص النية ..وللخير والجهاد مصارف عدة وتساهيل من لدن حكيم خبير"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926234901/http://www.20at.com:80/article.php?sid=149"

