[[comments]]
order = 0
subject = "كل الشعب عليهم"
author = "ابو كرتونة"
posted = "2006-06-04"
text = "ما فبش فايدة من الكلام<br />الحل الناجح والاكيد هو<br />ثورة مفاجئة وشاملة عليهم<br />ساعتها مش هيقدروا يعملوا اي حاجة<br />زي الكلاب البلدي اما بتجري منها بتجري وراك, اما اذا وقفت ليها وما خفتش هتخاف هي وتجري منك<br />وتعلموا من ثورة اوكرانيا , ورسيا البيضاء, وكمان ثورة يوليو المجيدة في مصر<br />لا للتوريث..لا للفساد..لا لمارك"
archived = "2006-09-16"
capture_url = "https://web.archive.org/web/20060916122822/http://masr.20at.com:80/article.php?sid=421"

