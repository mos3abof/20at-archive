[[comments]]
order = 2
subject = "حسبنا الله ونعم الوكيل"
author = "أحمد محمد"
posted = "2006-06-07"
text = "لا للتوريث لا لالالالالالالالالالالالالالالالالا<br />حسبنا الله ونعم الوكيل يارب تورينا فيهم يوم<br />يارب اجعل كيدهم في نحورهم<br />يارب انصر المظلومين وكل شعبنا مظلوم مع الحكومة دي اللهم آمين<br />طب وبعدين عايزين نعمل حاجة<br />ولا هنفضل نتكلم كده وخلاص<br />يا ناس حرام عليكم<br />هو انتم مش عارفين ان فيه حساب ولا انتم خلاص كفرتوا مفيش في قلوبكم رحمة ولا خلاص ما بقاش عندكم قلوب ولا احساس<br />حسبنا الله ونعم الوكيل"
archived = "2006-09-16"
capture_url = "https://web.archive.org/web/20060916122822/http://masr.20at.com:80/article.php?sid=421"
