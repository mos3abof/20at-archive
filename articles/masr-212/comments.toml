[[comments]]
order = 19
subject = "دمروا كل شيء"
author = "مصرى"
posted = "2006-04-26"
text = "لا تراجع ونحن معكم ولن نضعف من أجل تدمير هذا الإحتلال الغير شرعى الذى جسم على أنفاسنا وأفسد كل شيء فى حياتنا ولكن لا بد أن يتعاطف معنا كل العالم ويعرف لماذا الإعتصام وأسبابه حتى يحتقر هذا الفاسد الحقير الذى ما جمع حوله إلا كل فاسد والذى يريد أن يورثنا لإبنه المفتقد للشرعية فى وجوده هو وأبوه المزور المدمر لمصر كلها والله معنا."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 20
subject = "كلنا مع القضاة ... ممكن أشوفكم هناك"
author = "محمد السيد"
posted = "2006-04-26"
text = "أظن جت فرصة بجد .. كلنا نقف وقفة واحدة ...<br />أنا هنا في اسكندرية دلوقتي ...<br />بعد ساعتين في وقفة ومؤتمر في نادي المحامين لدعم القضاة ...<br />وفي القاهرة في مؤتمر مشابه في نقابة الصحفيين ....<br />وبعدها اعتصام لغاية بكرة ... الجمعة .... لمساتدة القضاة ضد حكومتنا النظيفة ونظامنا المبارك ...<br />ياتري لما نقول إننا نحضر ده أو ده ...اسكندرية او القاهرة ؟؟<br />لما نقول نحضر بكرة الاعتصام اليوم كله ؟؟<br />لما نقول نبات في الشارع حتي للي يقدر بس ؟؟؟<br />لما نشوف القضاة الناس المحترمة دي وهي بتتبهدل ...وإحنا كل الي بنعمله إننا قاعدين في بيوتنا نقرا مفالات ونعلق ونتغاظ شوية وبعدين نهدا تاني ؟؟<br />ساعتها ممكن أطلب منكم أشوفكم هناك ؟؟<br />والله بجد ؟؟؟ ممكن ....<br />انا ناوي احضر النهاردة في اسكندرية وبكرة اروح القاهرة ...<br />وده والله ولا حاجة .... بس إحنا نبقي عملنا حاجة ...<br />أي حاجة<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />مش مغيره .... هه<br />mohamedmat@hotmail.com"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 21
subject = "معنى الايادى"
author = "ammaaly"
posted = "2006-04-26"
text = "أيها الشعب<br />لماذا خلق الله يديك؟<br />ألكي تعمل؟<br />لا شغل لديك<br />ألكي تأكل؟<br />لا قوت لديك<br />ألكي تكتب<br />ممنوع وصول الحرف<br />حتى لو مشى منك أليك!<br />انت لا تعمل<br />إلا عاطلاً عنك<br />ولا تأكل الا شفتيك!<br />أنت لا تكتب بل تُكتب<br />من رأسك حتى أخمصيك<br />فلماذا خلق الله يديك؟<br />أتظن الله جل الله<br />قد سواها<br />حتى تسوي شاربيك؟<br />أو لتفلي عارضيك ؟<br />حاش لله<br />لقد سواهما كي تحمل الحكام<br />من اعلى الكراسي . لأدنى قدميك!<br />ولكي تأكل من أكتافهم<br />ماأكلوا من كتفيك<br />ولكي تكتب بالسوط على أجسادهم<br />ملحمة أكبر مما كتبوا أصغريك<br />هل عرفت الان ما معناهما ؟<br />أنهض وكشر عنهما<br />إنهض<br />ودع كلك يغدو قبضتيك<br />نهض النوم من النوم<br />على ضوضاء صمتي!<br />أيها الشعب وصوتي<br />لم يحرك شعرة في أذنيك<br />انا لا على بي إلاك<br />لا لعنة في انهاك<br />إنهض<br />لعنة الله عليك !<br />أحمد مطر"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 22
subject = "الإخوان والسلطة والمقدس"
author = "محمود الزهيري"
posted = "2006-05-06"
text = "الإخوان والسلطة والمقدس<br />كيف تتكون هذه التوليفة الغريبة التي لها مايساندها ويؤيدها في الواقع المعاش علي المستوي السياسي والديني والإجتماعي , فمن المفهوم أن الإخوان يطبقون النص الديني ويطوعون مفهومه حسب المصلحة الداعية لخدمة أغراض الجماعة أولاٌ من منطلق القاعدة التي تقول أينما تكون المصلحة فثم شرع الله , ومن ثم إذا كانت المصلحة مع النظام الفاسد الظالم المستبدالمحتكر للحكم والمغتصب للسلطة , فلا مانع من التفاوض معه مقابل الحصول علي هذه المصلحة , وهم لهم باع طويل في هذه الأمور والنص الديني موجود ومليئة به كتب وتفسيرات وشروحات فقهاء المسلمين من كتب التفسير والحديث والفقه وأصول الفقه والتراجم والأخبار, بجانب أن التقية موجودة وحاضرة وفارضة نفسها وذاتها بقوة في ظل معطيات الفساد والإستبداد والظلم والدولة البوليسية المهيمنة علي كافة مقدرات الأمور في بلد كمصرعلي سبيل المثال, والقاعدة التي تبرهن وتدلل علي التقية التي مؤداها نصاٌ : أنه في المعاريض مندوحة. ومادام الأمر كذلك فلامانع من أن تتعامل الجماعة مع السلطان الظالم الذي يأمرنا النص بعدم الخروج عليه مادام يقيم فينا الصلاة وهو ذاته الذي يصلي العيدين ويحضر المناسبات الدينية ويوزع الجوائز سواء أكان بشخصه أو من ينيبه عنه من رجال الدين الموظفين في بلاط جلالة الحاكم الظالم المستبد سارق الوطن وناهب حقوق المواطن , بل وليس غريباٌ أن الإخوان هم من يدعوا خطبائهم علي المنابر داعين الله عز وجل ببقاء الحاكم الظالم علي كرسي الحكم حينما يقولوا : وينهاكم عن الفحشاء والمنكر والبغي , وماكان البغي سوي الخروج علي الحاكم الظالم الفاسد المستبد أياٌ كان الحاكم , والجماعة لها شكل هرمي يبدأبالمرشد علي رأس مكتب الإرشاد وينتهي إلي أصغر جندي من جنود الإخوان المتلب<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 23
subject = "أنا عارف السبب"
author = "مصرى"
posted = "2006-05-07"
text = "أنا عارف ليه حسنى مبارك بيعمل كدة فى القضاه علشان دى عقده نفسية عنده بسبب إن ابوه كان حاجب محكمة وكان القاضى بيديله على دماغه لو قال كلمة أكثر من محكممممممممه علشان كده العقدة كبرة وبقت كولكيعة كبيرة قوى ومن يومها وهو بيكره كلية الحقوق زى العما وإبتدأ ينتقم من القضاه وميخليهومش يشرفوا على الإنتخابات بل وخلى كلابه يعتدوا عليهم فى الإنتخابات ثم بعد كده إبتدى ينتقم من الدكتور أيمن نور وبعدين الدكتور نعمان جمعة ثم بعد ذلك الإعتداء على المستشارين وضربهم بالحذاء إللى أولى منهم إن هوه إللى يضرب بيه ولكن أنا لقيت إن الحل إن أحنا نغير الراجل إللى كل مرة بيركب له حته نعل جزمة فى مخه علشان كده مخه طخين قوى وغبى وقلت إننا نوديه المجزر الألى علشان نجيب له إكسسوار لمخه من هناك يمكن يقدر ينسى العقده الكبيرة قوى إللى عنده وما يحاولش إنه يتطاول على أسياده من القضاه والمستشارين ويخليه فى مسح جزم الإمريكان زى الأول أحسن له"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 24
subject = "دى قضية مصر كلها"
author = "مصرى"
posted = "2006-05-08"
text = "أعتقد أن الإعتصام حق للإنسان فى دولة حرة ولكن مصر دولة تحت الإحتلال ولننظر كيف كان الزعماء فى عصور الإحتلال لمصر يتعاملون مع المحتل والدفاع عن مصر وعن شرعية وجود المحتل على أرض مصر الغالية وهم جميعاً من الحقوقيين مثل مصطفى كامل ومحمد فريد وسعد زغلول وغيرهم كثير. فنظام الحكم الموجود فى مصر ليس نظام شرعياًلأن الرئيس حسنى مبارك لم يأتى للحكم منذ تولى الرئاسة بإنتخاب الشعب كما ينص الدستور وكان وجوده فى الحكم طوال هذه السنوات بالتزوير وما بنى على الباطل فهو باطل. ثانياً كيف للقضاء أن يرتضى لنفسه هذه الوقفة المستجدية فى دولة محتله كان من المفروض المطالبة بتحرير مصر وليس الإنتظار من المحتل أن يعطيهم حقوقهم التى سلبها منهم الذى هو من وجهة نظر القضاء المتهم الأولى على قتل السادات وكل الأدلة تشير إلى أصابعة الخفية فى ذلك وكان لا بد أن يسقط القضاء شرعية الحاكم فى وجوده فى الحكم. وأيضاً لما أصاب مصر من فساد وتدهور وإخلال بكل مؤشرات الحياة من بطالة وتعليم وصحة وقتله للحياة الديمقراطية لكى يضمن سيطرة على الحكم وهذه نفس سياسة المحتل ولكن الحل الوحيد الذى لا بديل عنه هو الثورة على هذا الفساد وخاصة أن الشعب كله مؤيد لكم وملتف حولكم ولكنه ينقصه القيادة وأنتم القيادة الصالحة التى يتمناها المصريين جميعاً فماذا تنتظرون هل تنتظرون أن يقضى عليكم الحاكم كما فعل فى الحياة الحزبية وبذلك تفقدوا حتى أحترام الشعب لكم لا امل الأن إلا بالثورة والشعب كله معكم وفى إنتظار شرارة البداية على أيديكم يا شرفاء مصر لنطهرها من هذا الفساد المتسرطن"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 25
subject = "ماذا بعد براءة مكي ولوم بسطويسي ؟"
author = "محمود الزهيري"
posted = "2006-05-19"
text = "ماذا بعد براءة مكي ولوم بسطويسي ؟<br />هما من أنبل القضاة , وهما من ضمن المغضوب عليهم من سلطة الفساد, وذلك لأن النبل في زمن الخسة جريمة ! لماذا هما يتكلمان يتحدثان ؟ أليس السكوت فضيلة يريدها السلطان الجائر ؟ لماذا يكرهان التزوير ويمقتان الإستبداد والظلم ؟ ألأنهما قضاة قضيتهما العدل والحق والمساواة بين الناس في الحقوق والواجبات؟ ولكن هناك العديد من القضاة وصامتون أيضاٌ ومع ذلك فهم قضاة !!قضاة في نظر السلطان ومعاوني السلطان , يقرون الأحكام التي يريدها السلطان سواء بالبراءة أو بالإدانة وذلك حسب مشيئة السلطان, فالسلطان رئيس لمجلسهم المجلس الأعلي لكل مشيئة قاض قابع في بهو السلطان يتنفس زفير السلطان ويستمتع به علي أنه شهيق يرفض أن يتنفس معه أو يستنشق هواء من هوائه حتي الهواء يتميز به السلطان , السلطان يرفض ويسخط ويمقت طويلي الألسنة , السلطان يكره النقد والنقض فحكمه مقدس كآيات سطرت في كتاب مقدس وعلي قضاته إنتظار نار السلطان في حالة مخالفة مقدساته , فالسلطان يحكم كإله ويأمر وينهي ويحب ويكره ويمنع ويمنح وكأنه رب لجميع من يحكمهم فمن يقدر علي مخالفة السلطان إلا كافر بما أمربه السلطان , وإلي هنا يوجد من كفر بالسلطان في ذاته ’ وكفر بآياته وصفاته , كفر بعقله وأساليب تفكيره , كفر بظلمه وفساده , كفر بإستبداده , وإغتصابه للحكم والسلطة , السلطان يكره وطنه ويريد أن يستبدله بوطن آخر , ويكره المواطنين ويريد هم رعايا لامواطنين , السلطان يختلق الفتن بين المواطنين ليشغلهم بأنفسهم وصراعاتهم , لينشغلوا عنه وعن فساده فالمواطنين ليسوا عنده سواء في الحقوق والواجبات , ولاحتي في إعتناق الأديان فالمسلم له أولوية علي المسيحي , ومؤسساته وشيوخ وأمراء فتاواه يدعمون أمره , لأنه يريدها فتنة مشتعلة علي الدوام , فهو<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 26
subject = "إحتكار النص : حصار العقل"
author = "محمود الزهيري"
posted = "2006-06-17"
text = "إحتكارالنص:حصار العقل<br />لايوجد في الكون أجمل من عقل يعي ويفهم ويتدبر الأمور , ويميز بين القبح والجمال , والخير والشر , والظلم والعدل, فما أروع العقل البشري منحة الخالق للإنسان التي بها ميزه عن سائر المخلوقات جميعها بما فيهم الملائكة المقربين , فالعقل مناط التكليف في الأديان فلا إلتزام لفاقد العقل أو ناقصه أو من هو تحت تأثير مايغيب العقل , فالعقل هو النور المبين لكل صاحب عقل ومن يفقده في الضلالة يتيه<br />وما كانت الأديان إلا لهداية الإنسان وخروجه من الظلام إلي إلي النور.فما الذي يحجب العقل ويغيبه في مواطن كثيرة حيث يفتقد حين يكون مطلوب , ويغيب وقت ضرورة حضوره؟!!<br />من هنا نبدأ التساؤل ,هل العلم يغيب العقل؟ سؤال لامحل له, فالجهل في حقيقة الأمر هو المغيب للعقل والمعطل له ولوظيفته, ومن أين يأتي الجهل ؟ الجهل يتأتي من الوصاية علي العقل , تلك الوصاية التي تختزل الإمكانات العقلية في شخص تكون له الهيمنة والسيطرة تحت أي مسمي سواء أكان ديني أو سياسي أو فكري , والأزمة ليست في السياسي والفكري , لأن الفكري والسياسي يجوز تعديله وتغييره بعد المراجعات العقلية والفكرية لأنهما من المتغيرات التي يطرأ عليها التغيير والتبديل حسب الظروف التي تجعل المصلحة أساساًلتقدم الشعوب والمجتمعات وعمارة الدنيا والبحث عن أسباب القوة والتقد م والحضارة , والخلاف في الرؤي والأفكار أمر حتمي ولازم .<br />أما الديني فإنه يمثل منظومة من الثوابت التي لايجوز الخروج عليها أو مناقشتها أو التفكير فيها , ومن ثم النقاش والجدال حولها فهو في الديني محرم , والذي يجوز له تفسير وفهم الديني هو المختص بفهم الدين وتفسيره أي ما أسميناهم بعلماء الدين , ومن هنا تبدأ أزمة إحتكار النص في الفهم والتفسير والتأويل , ويمتنع علي أي شخص محاولة الإق<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022252/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 27
subject = "أريد أن أنضم لتنظيم الإخوان المسلمين : ماهي الشروط ؟"
author = "محمود الزهيري"
posted = "2006-06-17"
text = "أريد أن أنتمي لتنظيم الإخوان المسلمين : ماهي الشروط ؟!!<br />سؤال من ضمن الأسئلة التي تراودني في البحث عن إجابات لها لمعرفة مدي خطورة أي تنظيم من التنظيمات أوجماعة من الجماعات , للوقوف علي شرعية ومشروعية هذه الجماعات او التنظيمات , ومدي توافقها مع المنظومة القانونية , والنسق الإجتماعي الرابط للمجتمع في الوعي الجمعي المختزل في العقلية الإجتماعية التي تحافظ علي الأمن والسلام الإجتماعي لمجتمع من المجتمعات , بصرف النظر مؤقتاٌ عن الشرعية القانونية والخروج علي القانون العام والخاص لهذه المجتمعات الذي هو في النهاية يؤدي لنفس الغرض ,نظراٌ للفساد العام المتمثل في السلطة الحاكمة السالبة لأمن وسلامة أفراد المجتمع تحت دعاوي الحفاظ علي المجتمع وإستقراره .<br />ولكن الأمر الهام حالياً هوفي بيان التفرقة بين الإنتماء لأي حزب من الأحزاب السياسية أو منظمة من منظمات المجتمع المدني والجمعيات الأهلية , وبين الجماعات الدينية بكافة أطيافها وألوانها والغرض من وجودها علي الساحة الإجتماعية , والسياسية , ولايمكن التفرقة والتمييز بين جماعة أوتنظيم من التنظيمات في الخطورة بداية من أقصي درجات العنف وأقصي درجات السلم والفارق الفاصل الوحيد بين تلك الجماعات هو أن العنف مقدم لدي البعض ومؤجل لدي أخري , ولافرق بين التيارات السلفية التي تحرم العمل السياسي وتجرم وتكفر المنتسبين لهذه الأحزاب السياسية , وبين جماعات الإسلام السياسي , والتيارات والجماعات السلفية الجهادية , وتيارات التكفير جميعها ,ولكن ماهو الموقف من جماعة الإخوان المسلمين ذات التنظيم الدولي الذي ينضوي تحت لوائه كافة التنظيمات القطرية بقيادة المرشد العام للإخوان المسلمين في مصر.<br />فما هي الأوراق والمستندات التي يتطلبها أمر إنضمامي لجماعة الإخوان المسلمين ؟<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022252/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

