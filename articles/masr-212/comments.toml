[[comments]]
order = 1
subject = "لا تتراجعوا نحن معكم"
author = "مصرى"
posted = "2006-04-23"
text = "لعن الله قوم ضاع الحق بينهم وما يفعله حسنى مبارك هو تفتيت لإرادة الشعب فبدأ بالإحزاب ثم بالقضاء ثم بالفتنة الطائفية حتى يفتت الشعب ليضمن عدم وجود أى معارض له وليضمن تكميم أفواه الشعب كله وأنتم أمل الأمل فى وصول أصواتهم للعالم كله والشعب كله معكم ولا بد من فضح أسباب إعتراضكم وهو تزوير الإنتخابات والفساد الموجود ولا تتراجعوا عن موقفكم لتكونوا قدوة لكل الشعب حتى يشل حركة الحاكم الفاسد ويزيحه والله فى عون العبد ما دام العبد فى عون أخيه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "الشعب كله مؤيد لكم"
author = "مصرى"
posted = "2006-04-23"
text = "أيها القضاة أنتم الحق وأنتم أمل مصر والشعب كله مؤيد لكم وملتف حولكم فلتكونوا أنتم نقطه البداية التى ينتظرها الشعب ونحن معكم ولا تتراجعوا فأنتم أمل مصر فى القضاء على الحاكم الفاسد ومن حوله"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "مش هنزل الإعتصام"
author = "عابر سبيل"
posted = "2006-04-23"
text = "مع إني متضامن مع القضاه ، لكني مش هنزل الإعتصام ، فشكل الإعتصام كما رأيته أمس لا يشجع أبدا.<br />لما النشطاء دول يعرفوا ينظموا حاجه أهلا وسهلا مش هيعرفوا يقعدوا في بيوتهم ويبطلوا تهبيل ويقولوا الشعب المصري شعب سلبي<br />قضاء حر = وطن حر"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
