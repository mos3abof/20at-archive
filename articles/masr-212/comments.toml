[[comments]]
order = 18
subject = "بكرة احلي"
author = "اصدقائي"
posted = "2006-04-25"
text = "أظن ان الشاب صاحب هذا الموقع لديه من التفاصيل ما قد يفيد القضاة في معركتهم من اجل الاستقلال<br />لن تصدقوا ما تحتويه مقالات هذا الشاب من مواضيع ولكن يمكنني القول فقط ان هذا الشاب قد استطاع ان يحل الكثير من المشاكل التي تعاني منها مصر فأذهبوا لزيارته<br />www.bokra-a7la.blogspot.com"
archived = "2006-05-24"
