posted = "2006-04-23"
text = "القضاء العادل هو مستقبل هذه الأمه فيا قضاة الحق نحن معكم . والساكت عن الحق كشيطان أخرص . أرجوا أن يكون يوم الخميس يوم حداد لكل من يهمه أن يقول كلمه حق"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 6
subject = "لا للتنازل"
author = "مصرى"
posted = "2006-04-24"
text = "نحن معكم ومؤيدين لموقفكم الشريف ولكن لا تتنازلوا ولا تتراجعوا ولتفضحوا كل فسادهم فى تزوير الإنتخابات ولا تنسوا أن هناك دول إعترض شعبها على تزوير الإنتخابات بها وأعيدت مرة أخرى ولا تتنازلوا عن حقوقكم التى هى حقوق للشعب كله من خلالكم ولا تنسوا أن المصريين كلهم فى إنتظار قيادة نظيفة ليلتفوا حولها ليقضوا على الفساد الذى نعيش فيه وأنتم الأمل فى ذلك والله يوفقنا جميعا ولكن لا تتنازلوا."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 7
subject = "الله معنا جميعاً"
author = "مصرى"
posted = "2006-04-24"
text = "لا تتنازلوا عن موقفكم الله معنا ونحن معكم ومؤيدين لوقفتكم الشجاعة"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 8
subject = "القضاة امل مصر"
author = "وليد نصر الدين"
posted = "2006-04-25"
text = "كل القوى الوطنية تتكاتف الآن للدفاع عن القضاة ضد نظام باطش غشوم لا يعرف الفرق بين القاضى والمتهم ولا بين ايران واسرائيل وبالنسبة للاخ اللى مش هينزل علشان المنظر ياريت يقدر يشوف ازاى شباب بسيط بيجتهد وبيحاول علشان بيحب بلده وعنده شهامة ،ارجوك فلتقل خيرا او لتصمت"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 9
subject = "عندما يرحل الأستعمار"
author = "مصرى إلى الأبد"
posted = "2006-04-25"
text = "وقفة القضاة هى بارقة الأمل فى كل هذا الظلام من فساد وتسلط و أتمنى من كل مصرى أن يتضامن معهم حتى يرحل هذا الأستعمار الدخلى الذى دمر و ما يزال يدمر كل شئ جميل فى مصر"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 10
subject = "للي مش هينزل الاعتصام"
author = "أحمد"
posted = "2006-04-25"
text = "عابر السبيل ال بيقول مش هانزل الاعتصام، لأن مش عاجبه التنظيم أهلا به يساعدنا و يقول لنا أفكاره عن ننظم ازاي و نحل المشاكل ال هو شافها ازاي.<br />النشطاء دول زيهم زيك، لا هم مخضرمين و لا محاربين قدماء، و كلنا بنتعلم شوية شوية. الموضوع مش جنرالات و عساكر، احنا كلنا مع بعض.<br />فيه مشاكل طبعا لأننا لسه بنتعلم، الحكاية مش حفلة الناس معزومة عليها علشان تقعد على الكراسي تتفرج على الشو."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 11
subject = "ايدكم معانا"
author = "معتصم"
posted = "2006-04-25"
text = "الاعتصام عفوي و المشاركة فيه فردية<br />فيه ناس بتحاول تبادر و تنظم<br />الأخ عابر سبيل: بدل ما تعدي و تقول ياي مافيش نظام و تروح تنام<br />مد ايدك ورينا الهمة"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 12
subject = "سلام من طالب حقوق لأشرف ناس في مصر"
author = "مخنوق من ازهي عصور الحرية قصدي الحراميه"
posted = "2006-04-25"
text = "الحمد لله انى لقيت منبر اعبر من خلاله عن تضامنى مع القضاه المحترمين مكي ودرباله وعبد العزيز وعبد الجبار مع حفظ الالقاب وانا بصراحه مش عارف هو اللي يطالب بحق دستوري يحال للجنه تأديب ياجماعه مطالب القضاه ليست مطالب فئويه بالعكس لما يكون فيه قضاء مستقل الناس هتأمن علي حقوقها اما من ناحيه الاعتصام فأنا راسي منكم والارض انا فاضل ليا شهرين واتخرج علشان بس افرح ابويا في البلد بعدها مش هخاف ولا هكش وهاتظاهر وهاعتصم يا انا ياهما ولاد......اصلي فلاح مش قادر اشتم بس اقول ايه جتهم فره تاخدهم زي اللي جت لفراخ الحاجه امي قولوا معيه امييييين"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 13
subject = "الى افضل الرجال"
author = "الازهرى"
posted = "2006-04-25"
text = "ربنا معاكم<br />ومصير المصريين كلهم وكل سلف اوخلف من رجال القضاء خاصةبايدكم<br />لقدنزل الى اسفل السافلين<br />فمن تفذية ضاعت فىكل موبق ـمن رشوة وفسادواهمال وجهل....الخ من امراض<br />الى تشريعة لاتعبرعنا ولانعرفها ولاتسعى الينا<br />وكان قدبقى شى يرجى فى قضاءنا والعدل لمن وصل اليه هوخير فصل<br />واخيرا سددالله خطاكم<br />و\"اناالله يدافع عن الذين امنوا\""
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 14
subject = "الحق اقوى من البطش"
author = "محمد"
posted = "2006-04-25"
text = "ان الحق الالهى بل والمتعارف علية اقوى من كل القوى والبطش وان مطالب القضاة وغيرهم من ابناء مصرهو الحق الذى ظل غائبا لفترة طويلة لكنة لم يموت لذالك فحق القضاة وكل المصريين يجب ان يتحقق بايدينا ووقوفنا صفا واحد ضد الظالم وحاشيتة"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 15
subject = "القضاء -- الحصن الاخير"
author = "حمدي"
posted = "2006-04-25"
text = "ربنا يشد من ازرهم ويثبتهم علي الحق يارب العالمين<br />القضاة الشرفاء هم شمعه مضيئه وسط هذا الظلام الدامس<br />فلنساندهم بكل ما نستطيع من دعم ومسانده"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 16
subject = "من أجل الحق والعدل والحرية"
author = "محمود الزهيري"
posted = "2006-04-25"
text = "لاإعتذار اليوم , لاخوف اليوم , لاإنتظار للغد , فإما أن يكون غداٌ حرأ , وإما أن نكون في بطن الأرض , فماذا بعد القضاة ؟ السلطة الفاسدة الكافرة بالوطن لم ولن ترحم من يخرج علي قانون الغابة التي ترعاه وتحميه وتحرسه بحزمة من البلطجية السفلة الفاسدين , ورأس الدولة الفاسد العظيم في الفساد يحرس كفارالأوطان وكفار العدل والحرية , غدأ سيكون أسوأ إن لم نجرج اليوم ونقول للفاسد الكبير والطاغية الظالم المستبد حسني مبارك وعصابته ,, لا,, وألف مليون لا ,, سنتحرك بالقول والفعل لأن من أهان قضاة مصر فقد أهان مصر كلها وليرحل مبارك وعصابته إلي الجحيم ولتبقي مصر واحة للأمن والأمان ولتكن أرواحنا فداء لمصر من أجل الحق والعدل والأمن والأمان والموعد نادي القضاة ومن يتخلف لايلومن إلا نفسه<br />محمود الزهيري"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213942/http://masr.20at.com:80/article.php?sid=212&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

