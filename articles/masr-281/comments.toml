[[comments]]
order = 2
subject = "لازم ....بالعافية تحبه"
author = "الاسكندرانى المصرى"
posted = "2006-05-11"
text = "يا عم الاهرام و كل صحف المطبلتية(القومية)كانوا عندهم حق فى ال كتبوه....احنا ال مابنعرفش نقراء أو نفهم...ده الريس عمنا وخالنا و تاج راسنا كلنا بالذوق بالعافية هو فوقنا و كاتم على نفاسناالى اخر نفس( فى عمرنا او عمره) و بعدين يا عم ال مش عاجبه يرحل .....ما تيجى نرحل كلنا..و نسيب له البلد فاضية هو و المطبلتية علشان هم الاتنين يغنوا على بعض بعيد عننا و عن دماغنا.......ياعالم دماغنا وجعنا...."
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520104718/http://masr.20at.com:80/article.php?sid=281&PHPSESSID=8127d6f08ccc6a47bcbdb74df17c1fa3"

[[comments]]
order = 3
subject = "شلوطين"
author = "طارق حسن"
posted = "2006-05-11"
text = "حبيبى بلال فضلتحياتى لك انت وكل العاملين بجريدتنا الغراء الستور وبخاصه على مقالك الثابت الذى خرج عن كونه قلمين لك ولعمرو سليم الى شلوطين اسبوعيا على افى الحكومه ولكن دعنا نخرج من تلك العركه ونتكلم بموضوعيه<br />اليس من الاجدر بك وبكل مثقفى هذا الوطن تقديم الحلول والاساليب التى تجير هذا الشعب الغلبان المطحون بدلا من<br />اشعال ثورته بما لا يعود عليه سوى بالسحل والاعتقال وغيرة<br />لم اقراء لاحدكم يوما عن برنامجللاصلاح<br />لم اقراء لاحدكم يوما عنشخص تباركونه وتناصرونه لتولى رئاسه الجمهوريه مع ذكر تاريخه بالكامل<br />لم اقراء ملفا اسود لاحد مدموغا بكل البراهين التى لا تدع مجالا للشك فيه<br />كل ما قراته صياح وهتاف فى جريده عزيزة بس تمنها 2 جنيه اقطعهم من مصروف اولادى اسبوعيا وقد تلقى بى فريسه للسحل او الاعتقال<br />شكرا"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520104718/http://masr.20at.com:80/article.php?sid=281&PHPSESSID=8127d6f08ccc6a47bcbdb74df17c1fa3"

