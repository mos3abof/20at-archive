subject = "هجرة الشعب المصرى"
author = "مصرية"
posted = "2006-05-11"
text = "كانت تايهه ولاقيناها احسن حل لمشكله الشعب المصرى المزمنة ان كلنا نهاجر نيوزلاندا عشان نحس بالنعمة اللى احنا فيهاواحنا مش داريانين واما نكون مشردين خارج الوطن تبقى اوقع من التشرد داخله"
archived = "2006-05-20"
