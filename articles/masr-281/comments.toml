[[comments]]
order = 0
subject = "لأ بجد فرحت"
author = "الهام"
posted = "2006-05-08"
text = "بجد فرحت لما عرفت الخبر ده أصل ساعتها بس فقت وعرفت قد إيه إحنا ف نعيم والناس بتحسدنا عليه وقد إيه إحنا شعب مفترى وظالم وجاحد و....متعدش<br />المهم<br />مواضيع الإنشاء الكيكة دى خلاص بقت سمة العصر بس هى ليها هوجة كده بتطلع فيها أيام الإنتخابات، إفتتاح مولد السيد البدوى بعد التطوير وعيد الميلاد طبعاً<br />أما بالنسبة لإقتراحك بضم المنافقين مع من يهينون الرئيس وإتهامهم جميعاً بتهمة اإهانة لشخص الرئيس ده هيخلى الجرايد فاضية عشان الأساتذه هيكونوا منورين النيابة.<br />أما بالنسبة لموضوع الإعتراض على سياسة الرئيس فى قلب العاصمة أكيد مش هيرفع من مكانة الرئيس بعد اللى بيحصل من ضرب وبهدلة للناس وهو واقف ساكت وراضى عن اللى بيحصل ولا عمره حاسبهم ولا هيحاسبهم فهم يده الباطشة على الشعب.<br />ومحدش بيقطع إيده طالما بتعمله اللى هو عايزه مش كده ولا إيه؟"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520104718/http://masr.20at.com:80/article.php?sid=281&PHPSESSID=8127d6f08ccc6a47bcbdb74df17c1fa3"

