text = "أربع سنوات فقط تفصل بين حياتين، الأولى لفتاه بسيطة تعيش في حي شعبي، حيث مفردات الحارة كانت جلية على قسمات وجهها، الستر والفرج كانا مطلب أمها من الله عز وجل، ضيق الحال ورغبة الفتاه في التنفيس عن موهبة الغناء التى تنفجر بداخلها دفعها إلى الغناء فى الافراح الشعبية، كما دفعتها رغبتها في ترسيخ موهبتها وصقلها إلى معهد الموسيقى العربية لتدون اسمها فى استمارة القبول بالمعهد. إنها شيرين سيد محمد عبد الوهاب، واسم شهرتها شيرين عبد الوهاب، المولودة في الثامن من يناير (كانون الثاني) 1980، في أحد شوارع حي محمد علي الشهير بحي العوالم في وسط القاهرة، والتي ما لبثت أن تركت المعهد لتلتحق بفرقة الموسيقى العربية التابعة لدار الأوبرا المصرية بعد عامين فقط من التحاقها بالمعهد العالي للموسيقى، طمعا في ان تلفت اليها الأنظار وان تنتقل إلى طبقة اخرى من عالم الفنانين غير طبقة العوالم التي ارتبطت بها نتيجة نشأتها وغنائها في الأفراح الشعبية، إلا ان أجرها الذي كانت تحصل عليه من دار الاوبرا لم يكن ليكفي رمق الأسرة التى اعتبرت نفسها مسؤوله عنها، فاستمرت فى إحياء الأفراح الشعبية وعينها على أفراح فنادق الخمسة نجوم، ضاربة باللوائح والقوانين المعمول بها فى دار الأوبرا عرض الحائط والتى تحرم على مطربيها الغناء خارج جدران الاوبرا. شيرين كانت على يقين أن مواصفاتها الشكلية لا تؤهلها للنجومية، وفقا لمقاييس قديمة، لكن ثورتها الداخلية وغليان موهبتها جعل حلم النجومية يداعب خيالها فقط، فيما كانت تبحث عن خيط تمسك بطرفه لعلها تجد منتجا ممسكا بالطرف الآخر. كان هذا حلمها الخاص بها، إلا ان مسؤوليتها عن أسرتها دفع بها إلى أحضان أول زيجة لها من الموزع الموسيقي مدحت خميس، وهو أمر غير مرغوب لمن هن على شاكلتها، فأغلب المطربات يفضلن النجومية وتحقيق الذات قبل حلم الزواج والنبات والصبيان والبنات، ولكن ربما اعتقدت المطربة المغمورة أن مدحت خميس هو الشخص الممسك بالطرف الثاني من خيط النجومية، وربما زواجها منه يحقق حلمها الثاني الذي طالما تحدثت عنه وهو العش الهادئ والاستقرار والأطفال. ستة أشهر فقط هي عمر زواجها من مدحت، لتنفصل شيرين عنه بعد نشوب الخلافات بينهما، وتأكدها من أنه ليس الحلم الذي تبحث عنه. واستمرت في الغناء مع فرقة الموسيقى العربية لتتحول من الصفوف الخلفية في الفرقة إلى الصفوف الاولى، ثم إلى صولو يصفق لها جمهور الأوبرا المعروف بذوقه الراقي، وظلت الفرصة التي تبحث عنها المطربة المغمورة غائبة إلى ان قدمت دويتو غنائيا مع المطرب محمد محيي بعنوان «بحبك» في ألبومة «صورة ودمعة» في مطلع عام 2001، فعرفها قلة من الجمهور، إلا ان الشاعر الغنائي مصطفى مرسي والملحن صلاح الشرنوبي أوقفتهما موهبة شيرين فقدماها إلى المنتج نصر محروس، الذي رأي فيها خامة جديدة لمنتج عالي الجودة، فأعاد صياغتها شكلا ومضمونا ولتبدأ المطربة الشابه في وداع أغاني الكبار الكلاسيكية التي اعتادت تقديمها في دار الأوبرا، لتقدم شكلا غنائيا خاصا بها.<br />ومع نصر محروس أسدلت شيرين الستار على المرحلة الاولى من حياتها لتبدأ الثانية، والتي كانت أهم ملامحها صورة لفتاة تهتم بمظهرها وتضع يدها على قلبها رافعة يدها إلى السماء مع أيادي أسرتها طالبين من الله الفرج والستر والنجاح لخطوة الابنة التي يضعون عليها آمالهم. وجاءت الانطلاقه الأولى للمطربة المغمورة مع المطرب تامر حسني من خلال دويتو «لو كنت نسيت» الذي رددته الملايين وحقق أعلى نسبة مبيعات عام 2002، وعلى الفور جاءت الانطلاقه الثانية للمطربة شيرين مع أغنية «اه يا ليل» التى اشتهرت بها وزحزحت الاسم الثاني لها «عبد الوهاب» لتحل محله وتصبح «شيرين أه يا ليل» والتي انطلقت منها إلى مجموعه من الأغاني جعلتها تتبوأ قمة هرم النجومية مثل «بحبك قوي» و«لا يا حبيبي» و«خايفة» و«سبني».. ويرسخ اسم شيرين في أذهان الجماهير ويداعب صوتها وجدان الملايين وتتربع في قلوب عشاق الطرب بأغاني مثل «أنا في الغرام» و«بتوحشني»، وهي الأقرب إلى قلبها، و«صبري قليل» و«بص بقي» و«نسيني».<br />وتودع شيرين سائقي سيارات التا[ *** ]ي مع صدور أول ألبوم لها، كما ودعت الحارة لتنتقل من حي راق إلى آخر أرقى، وبعد النجومية التى كانت مفرداتها البساطة والبحة المميزة وقوة الصوت والاختيار الجيد للكلمات والألحان بدأت شيرين التفكير في الاتجاه للسينما، فوجدت ضالتها في المخرج محمد النجار الذي منحها بطولة فيلمه «ميدو مشاكل» مع الفنان أحمد حلمي، محاولا الاستفادة من نجوميتها، إلا أن الفيلم لم يحقق لها طموحها السينمائي، وهو ما دفعها إلى رفض ما عرض عليها من سيناريوهات أخرى خوفا على نجوميتها التي حققتها في الغناء. ليس هذا فقط؛ فقبول شيرين المشاركة في «ميدو مشاكل» كان سببا في ظهور الخلافات بينها وبين منتجها ومكتشفها نصر محروس، الذي كان رافضا لعملها في السينما، الا انها أصرت على خوض التجربة التي كان نصيبها الفشل. الا ان شيرين المندفعة بقوة في بحر الحياة لم تتوقف طويلا أمام النجاح المحدود الذي حققه الفيلم، ورفعت شعارها المفضل «لازم أعيش»، وهو الاسم الذي اختارته لواحدة من اغنياتها وبدأت فى التحضير لألبوم جديد. حلم الزواج والأمومة هو الآخر لم يفارق خيال نجمة الغناء؛ فقبل عامين أعلنت خطبتها من عصام، رجل الأعمال الذي يحمل الجنسية الأميركية، واستمرت الخطبة عاما، إلا انها انفصلت عنه في هدوء بعد قصة حب وصفت من قبل المقربين منهما بالعنيفة. ومنذ ستة أشهر ترددت أنباء عن ارتباط شيرين برجل الأعمال أحمد غزالي، الذي يحمل جنسية مصر وليبيا وكندا، وهو الارتباط الذي رفضه كل المحيطين بها حتى أمها، إلا انها وقتها صرخت في وجه الجميع بقولها «أنا حرة ويجب أن أعيش الحياة وأمارسها كأي امرأة». وتحسم شيرين الكلام والشائعات في العرض الخاص لفيلم «حليم» عندما أظهرت خاتم الخطوبة، إلا أنها وبعد عدة أسابيع انفصلت عن الغزالي ايضا، وعندما سئلت عن السبب قالت: «انفصال سريع أفضل من ارتباط فاشل».<br />ومع تصاعد نجومية شيرين عبد الوهاب، تصاعدت خلافاتها مع المنتج نصر محروس، فتارة تصل الخلافات بين الاثنين إلى التهديد من جانب شيرين بالانفصال ومن جانب نصر بالمن عليها وصناعة نجوميتها. وفي كل مرة يعود الصديقان اللدودان لتؤكد شيرين أن نصر مكتشفها وصاحب الفضل عليها، إلا انه لا يمنحها الحرية في اختيار ما تشعر به من فن، بينما يؤكد نصر أن شيرين مطربته المفضلة، إلا انها عنيدة ولا تسمع النصيحة. ثم سرعان ما يعكر صفو العلاقة تصريح لشيرين بأن نصر محروس يربح من ألبوماتها الملايين ويعطيها بضعة آلاف، حتى انه يحصل على نسبة من أجرها في الحفلات، ويأتي نصر ليؤكد أنه احتكر شيرين سبع سنوات وأنه يهديها بعد كل ألبوم سيارة أحدث موديل وتستمر الخلافات بين الصديقين فيلجأ محروس إلى نقابة الموسيقيين لتتخذ إجراء ضد شيرين بمنعها من الغناء؛ وهو القرار الذي ضربت به شيرين عرض الحائط، وغنت في مهرجان من أجل لبنان الذي أقيم في القاهرة من أجل جمع التبرعات لإعادة إعمار لبنان. كما غنت في حفل بأحد فنادق القاهرة في عيد الفطر الماضي، الأمر الذي دعا نصر محروس الى مقاضاة شيرين وجعلها تدفع ثمن أخطائها، كما أعلن ذلك حسن أبو السعود نقيب الموسيقيين الذي قال إنه «سيجعل شيرين تندم على تحديها للنقابة». غير أن شيرين ظهرت في برنامج تلفزيوني في رمضان الماضي، أكدت أنها لن تتصالح مع نصر محروس أو النقابة مهما حدث، سرعان ما عادت وتراجعت عن قرارها وأعلنت أنها تصالحت مع النقابة وتنتظر التفاهم مع نصر محروس، ولكن بشروطها بعد أن عاشت أياما صعبة لم تكن تتوقعها، وهذا سبب لجوئها للتفاهم مع النقابة لإنهاء تلك الأزمة الكئيبة على حد قولها، حيث وصفت قرار منعها من الغناء بأنه أبشع من الموت. وحول شروعها في وضع الحلول لإنهاء الأزمة، قالت إنها طلبت من محاميها الخاص التوجه إلى النقابة والتفاهم معه لإنهاء تلك الأزمة، وما تم بحسب قولها أنه «جلس بالفعل مع نقيب الموسيقيين حسن ابو السعود والملحن جمال سلامه عضو مجلس النقابة وتوصلوا إلى أن أقوم بالاعتذار ودفع كل الرسوم الخاصة بالنقابة، وغلق هذا الباب كي أستطيع التفرغ لنصر محروس الذي عرضت عليه قبول أحد أمرين، وهما إما أن أقوم بدفع الشرط الجزائي في العقد المبرم بيني وبينه وقيمته مليون دولار، أي ما يعادل ستة ملايين جنيه مصري، أو إكمال مدة العقد بشروط جديدة، تمكنني من ممارسة حياتي الفنية بحرية. لأن هناك قيودا في العقد القديم تذبحني، ومن أهم هذه البنود عدم المشاركة في أي عمل فني إلا بموافقة المنتج، وهذا ما يعرضني الى خسائر كثيرة ويؤثر على مستقبلي الفني. فأنا فنانة وبداخلي طاقات كثيرة أتمنى إخراجها دون الرجوع الى المنتج، ومن حقي الطبيعي ان أختار الملحن والموزع الذي أفضل التعامل معه دون فرض رأي المنتج».<br />هذا الحديث من قبل شيرين لم يمر مرور الكرام، حيث علق عليه الموسيقار حسن ابو السعود بقوله «هذا الكلام غير صحيح، وكل ما تفعله شيرين حتى الآن مجرد مناورات لجس النبض. وقد عرضت من خلال محاميها الخاص سداد الرسوم المتأخرة عليها التي سبق وأرسلتها عن طريق البريد الحكومي. وحتى هذه اللحظات لم توافق النقابة على هذا الحل. والنقابة بصدد دراسة الموقف لاتخاذ قرار رادع وقوي تجاهها، وبخاصة بعد رفضها الالتزام بقرار منعها من الغناء، وسوف تكون عبرة لغيرها حتى تتعلم احترام قوانين البلد الذي تعيش فيه، لأن النقابة جزء من الدولة». المنتج نصر محروس نفى هو الآخر ما رددته شيرين من عرضها التصالح عليه وإرسالها له بشروط ذلك الصلح، وأكد ان هذا الكلام غير صحيح بالمرة، معربا عن رفضه أن تفرض عليه شيرين أي شروط.<br />واستمر الصراع إلى ان جاء إعلان شركة جود نيوز للانتاج الفني مؤخرا بالتعاقد مع شيرين بمبلغ 4 ملايين دولار لإنتاج اعمالها الفنية المقبلة، مما دفع بمحروس إلى مطالبة شيرين بدفع مبلغ 5 ملايين جنيه مصري، وهو النزاع الذي لم يحسم لصالح أي من الطرفين حتى الآن.<br />علي أية حال عاشت شيرين مثل أغلب النجمات حياتين؛ الأولى عمرها 22 عاما كانت مليئة بمفردات عدة على رأسها الكفاح والشقاء والضيق بدون أمل والطموح والرغبة في الوجود. والثانية عمرها أربع سنوات وفيها عاشت النجومية وراحة البال وإثبات الذات، ويبقي أمامها فقط حلم الاستقرار العاطفي"
