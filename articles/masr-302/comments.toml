[[comments]]
order = 0
subject = "ايه يا عم عجم ... عجبي ؟؟؟"
author = "مش شغلك ..."
posted = "2006-05-10"
text = "اولا انا ملحظه حتته اجدع ناس وميه مالحه ووشوش كالحه والحاجات دي في ايه ؟؟<br />علي العموم الكلمه دي ليها معاني كتيره عندي واول ما اتعرفت علي الاشخاص اقول الكلمه دي \" اجدع ناس \" بصرف النظر جدع او مش , ثانيا في واحد اسمه\" جحا\" اخ فاضل اول مره اقابل حد بالاسم دا اوم ايه اول ما اكلمه يتهمني بالفقدان الهويه وضعفي في اللغه العربيه مش عارفه العالم دي مالها ما علينا بحب انا سياسه \"صد له الطرشه \"<br />وبعدين مش شرط كل ما عاشر 40 يوم هو منهم يعني وبعدين اشمعني اربعين ؟؟ ..<br />قال لجوء قال .. علي فكره بقي حكايه اللجوء مش كويسه خالص مالص , بس خلاص نهايه القصه."
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124522/http://masr.20at.com:80/article.php?sid=302&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

