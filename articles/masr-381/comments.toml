[[comments]]
order = 0
subject = "نفسى فى بيت زيه"
author = "HopiZ"
posted = "2006-05-28"
text = "انا زرت البيت ده من 4 سنين. و فعلا البيت يعد تحفة من التحف المعمارية. فعلا بيت رائع و الى مديله المصداقيه كونه مفروش بالأثاث.<br />بس انا فاكره ان كانت كل ابواب الغرف و لاسلالم كانت قصيره بمعنى انك لازم تنخنى شويى و انت بتمر. و ساعتها قولنا ان الى بانى البيت كان قصير القامة. و ضخكنا. فانا كنت عايزه اعرف صحة المعلومه دى؟لو حد يعرفها"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620050440/http://masr.20at.com:80/article.php?sid=381"

