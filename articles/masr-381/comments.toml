[[comments]]
order = 3
subject = "كانت احلى رحلة ....\\\" القاهرة الاسلامية.\\\"...."
author = "واحدة وخلاص"
posted = "2006-06-29"
text = "فعلا بيت الكردلية او الكرتلية من اجمل الاماكن اللي زرتها في القاهرة الأسلامية<br />وساعتها اتمنيت ان يكون بيتي في المستقبل على هذا الطراز الاسلامي الجميل ...<br />واجمل ما فيه هو احساسك بالراحة والخصوصية والهدوء النفسي...<br />بجد نفسي بيتي يكون كدة.....<br />وكانت اجمل رحلة رحتها في الكلية<br />ولا انتي ايه رايك يا (( HOPIZ ))"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183029/http://masr.20at.com:80/article.php?sid=381&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
