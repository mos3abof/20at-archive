text = "نحن ومصر شعب واحد مكملين لبعضناواذا صـلحت النوايا نكون قوة عربية لايستهان بها تحياتي لشعب مصر العظيم"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923222304/http://www.20at.com:80/masr/7eta-mn-baladi/10697-2009-06-09-20-39-07.html"

[[comments]]
order = 5
subject = ""
author = "ابومحسن غربة في الخليج 27 سنه"
posted = "2008-12-09"
text = "كل دول الخليج يكنون لمصر كل حب واحترام وانهم يعلمون جيدا ان النهضة التي حدثت في الخليج مصر كانت الاساس فيها او الخبرة المصرية في الجيش وفي الشرطة وكافة ميادين الحياه وهذا ما سمعته على لسان الخليجيين اصحاب الاصول<br />اما فيه طبقة في الخليج اللي هما متجنسين وليسوا من اصول عربية من اصول فارسية وخلافه<br />دول هما الذين يسيئون لمصر وهؤلاؤ حسالة لا قيمة لهم<br />سلام"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923222304/http://www.20at.com:80/masr/7eta-mn-baladi/10697-2009-06-09-20-39-07.html"

[[comments]]
order = 6
subject = ""
author = "شممة"
posted = "2008-12-12"
text = "هل امريكا بتطلب الرئيس يروح يستلم المنحة السنوية منهم هناك ؟<br />ولما اوروبا بتعطى منح بيجيبوا الرئيس يقولوا لة خد<br />اشمعنى السعودية فى حضور الرئيس بتسلم العبارتين - لها معنى خفى<br />لا تكلمنى عن حكاية الاخوة وبحث المواضيع المشتركة والختم الكبير اللى بيتقال بعد اى لقاء عربى قضية الشرق الاوسط<br />مفيش حلجات مندى"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923222304/http://www.20at.com:80/masr/7eta-mn-baladi/10697-2009-06-09-20-39-07.html"

[[comments]]
order = 7
subject = ""
author = "سعودي مصري الهوا"
posted = "2009-11-26"
text = "ما هكذا تورد الإبل يا سعد..<br />مص والسعودية جناحي الأمة العربية ةالإسلامية فإن حصل تقصير من السعودية فمصر تقوم بالواجب والعكس وإن أعطت السعودية هدية لمصر فهذا ليس بغريب من بلدي والنبي الكريم يقولك: تهادوا تحابوا.<br />والمؤمنون إخوة متحابون ومصر والسعودية جسدا واحدا من زمن بعيد وسيظلوا كذلك إلى قيام الساعة بإذن الله والحسود يأكل في نفسه كالنار تأكل في نفسها إن لم تجد ما تأكله.."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105143030/http://20at.com/masr/places-of-egypt/10697-2009-06-09-20-39-07.html"
