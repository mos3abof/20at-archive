text = "مش لما كنا<br />انما دلوقتى<br />دا حتى الاسبوع اللى فات شحتونا عبارتين ب 30 مليون دولار<br />اصبحنا شحاتين"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923222304/http://www.20at.com:80/masr/7eta-mn-baladi/10697-2009-06-09-20-39-07.html"

[[comments]]
order = 1
subject = ""
posted = "2008-12-08"
text = "الهدية تبقى ساعة الماظ - انما هدية 180 مليون دولار - مش لطيفة<br />لما تبقى عاجز عن توفير عبارات لنقل مواطنيك<br />وتخللى القطاع الخاص يجيب عبارات متهالكة يغرق الناس فى المية وتاكلهم اسماك القرش<br />تبقى مسكين وتستحق الزكاة<br />ومعنى دة كبير قوى للناس اللى بتفهم<br />ولا داعى لمزيد من الايضاح لان الموضوع مهين والمواطن السعودى بيقرأ الخبر دة بطريقة غير فهمنا لة"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923222304/http://www.20at.com:80/masr/7eta-mn-baladi/10697-2009-06-09-20-39-07.html"

[[comments]]
order = 2
subject = ""
author = "مش كاتب"
posted = "2008-12-08"
text = "العبارتين بـ 180 مليون دولار وليس 30 مليون<br />ثانيا احنا ما بنشحتش والسعودية صرحت انهم هدية لشعب مصر<br />ليه<br />لان هناك مليون مصري يعملون في السعودية"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923222304/http://www.20at.com:80/masr/7eta-mn-baladi/10697-2009-06-09-20-39-07.html"

[[comments]]
order = 3
subject = ""
author = "ش"
posted = "2008-12-09"
text = "نعم تلك الاماكن المقدسة كانت تحت حكم المماليك وتحت حاكم مصر يختار لها الوالى ويتولى حراستها وعمارتها<br />ذاكروا تاريخ"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923222304/http://www.20at.com:80/masr/7eta-mn-baladi/10697-2009-06-09-20-39-07.html"

[[comments]]
