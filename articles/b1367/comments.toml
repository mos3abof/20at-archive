author = "ShadiObserver"
posted = "2006-10-27"
text = "اولا عذرا لأني هتكلم خارج عن الموضوع<br />انا بتمني من الناس الجادين يكونوا معي لكي نفكر في شئ لرفع شأن الاسلام والعالم العربي وانا معي افكار ومحتاج من يشاركني وينضم إلي او انضم انا الي ناس حقيقه تريد رفع شأن الاسلام والعالم العربي ومن يريد ان يكون معي فعليه بإضافة علي ShadiObserver@hotmail.com وعذرا مره ثانيه لإدارة الموقع وشكرا<br />ShadiObserver"
