[[comments]]
order = 8
subject = "الم يان للذين امنوا ان تخشع قلوبهم لذكر الله"
author = "فارس _fr"
posted = "2006-10-19"
text = "الاخت \"مهتمة \" انا ذكرت ف تعليقى الى فوق على فرض انى فعلا عايز اتجوز ومفيش مكان احسن من المسجد على فرض ان كل الى بيروحوا يصلوا صالحات وبنات ناس وكويسين جدا وانا والدتى لا تصللى فى المسجد ...!!!! ازاى هتعرف على الى اناعايز اتجوزها ؟؟؟؟؟؟ هلى ينفع يكون المسجد مكان للتعارف ومعرفة العناوين وارقام التليفونات !!!! بيتهيالى المكان له قدسية اكتر من كده ..لو عندك حل لمشكلتى ياريت تعرضيه .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134438/http://www.20at.com/article2.php?sid=1367"

