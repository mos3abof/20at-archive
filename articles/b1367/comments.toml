author = "شرين منصور"
posted = "2006-10-22"
text = "انا لاامانع أن كل وحدة عايزة واحد يعرف ربنا ويكون متدين بس مش بالطريقة دي لأن عيب اوي في حق المسجد اللي انتو بتروحوا ولن يصيبنا الا ما كتبه الله لنا لو ليكي نصيب حتخديه حتى لو كنتي في قمم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134438/http://www.20at.com/article2.php?sid=1367"

