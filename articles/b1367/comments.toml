order = 0
subject = "احسن الزيجات من المساجد"
author = "عبد"
posted = "2006-10-18"
text = "الحمد لله رب العالمين اهم شي الحب والتفاهم بين الزوجين والعيشة على الحلوه والمره لان الزواج هو ارتباط دائم وليس مؤقت شوفو المحاكم الشرعية شو فيها قضايا وخدو العبر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134438/http://www.20at.com/article2.php?sid=1367"

[[comments]]
order = 1
subject = "أول مرة"
author = "بيبو"
posted = "2006-10-18"
text = "بصراحة انا اول مرة اعرف الموضوع ده وبرغم انى إلى حد ما مستغربه حبتبن .إلا انه بالفعل له محاسن تطفو عن مساوءه إن وجدت .. فإذا عندنا إلى الاصل فينا وهو الاختيار بواسطة الدين اولاًً فسوف نسعد بدنيانا وآخرتنا .. ولكن يجب أن يتبع التوافق الدينى التوافق الاجتماعى والمادى . وماحدش يقولى المهم أنهم متدنيين وخلاص وربنا هايكرم .لأ .. لابد من توافق الافكار والقيم بين الطرفين وتقارب المستوى المادى وإن مان اعلى فيكون للرجل ..حتى لايفقد قوامته عليها .. وبصراحة لولا أنى مرتبط وعلى وش خطوبة لكنت فكرت فى موضوع الزواج من المسجد .. ليه لأ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134438/http://www.20at.com/article2.php?sid=1367"

[[comments]]
order = 2
subject = "\"الا ترجون لله وقارا \""
author = "فارس _fr"
posted = "2006-10-18"
text = "بعيد عن الحرام والحلال واللى يجوز واللى ما لا يجوز ,, انا مثلا والدتى لا تصلى فى المسجد وليس لى اخوت بنات ,, هل من المعقول انى اتعرف على واحدة فى بيت ربنا ,, نرتكب ما يغضب الله فى بيت الله ,, مش شايفين ان المسجد والصلاة لازم يكون ليهم قدسية شوية ,, ازاى اسمح لنفسي انى اتكلم مع واحدة او احال انى اتعرف عليها او اتصف مع اصدقائي زى ما بعض ااخوة قالوا لاختيار العروس , وهل بالشكل تقس المراة الصالحة من غيرها ...<br />ياريت نرجع لدينا ونفكر شوية فى الاخرة ...<br />وحسبي الله ونعهم الوكيل فى مبارك وعصابته ...<br />لا للتوريث ولا لاستكمال االفطيرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134438/http://www.20at.com/article2.php?sid=1367"

[[comments]]
order = 3
subject = "مش حرام، لكن الطريقة"
author = "الفكرة مش في إن الموضوع حرام أو عيب، و ليه لأ في بنات كثير اتجوزو عن طريق المساجد، يعني عن طريق أمهات شافو بنات مناسبة، او حتى بنات شافوا بنات و لاقوهم مناسبين لأخ أو قريب، و دي حاجة حلوة مش وحشة، المشكلة فعلا في الطريقة، يعني صعب اوي بعد مكون بصلي و أخشع بين يدي الله أطلع اتفرج و أعاين و ادقق و مراعيش غض البصر، هو دة اللي فيه إغضاب لله عز و علا، و لا إيه؟"
posted = "2006-10-18"
text = "الموضوع جميل، و بيحصل فعلاً للاسف، يارب الناس تحاول ترضي الله، بطريقة ترضي الله."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134438/http://www.20at.com/article2.php?sid=1367"

[[comments]]
order = 4
subject = "دا مش مكانه !!"
author = "أحمد عمر"
posted = "2006-10-18"
text = "أنا مش فاهم يعني إيه واحد يشوف واحده ماشيه فايبص عليها كويس و يحدد ( آآه والله دي كويسه تنفع )) أو ( لا لا لا دي ماتنفعش )))<br />إييييييه يا رجاله ده إنتوا بتشتروا إيييه ولا بتدوروا علي إيه بالظبط ؟؟<br />دي حد من روح و دم و مشاعر و إحساس و طباع و أخلاق و أهل و دين و بيت و عيله و ...<br />أنا شايف ف الطريقه دي جرح كبيييير امكانة المرآه, و لو كان الهدف عالي و النيه متظبطه<br />والله أعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134438/http://www.20at.com/article2.php?sid=1367"

[[comments]]
order = 5
subject = "مسخرة"
author = "عبده أفندي"
posted = "2006-10-19"
text = "فعلا حاجة قمة في المسخرة، لما تبقى العبادات هدفها أغراض دنيوية زي جواز أو تعارف<br />مش التراويح بس.. ده كمان العمل التطوعي وغيره<br />حاجة قرف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134438/http://www.20at.com/article2.php?sid=1367"

[[comments]]
order = 6
subject = "نحاول نفهم"
author = "مهتمه"
posted = "2006-10-19"
text = "الزواج من ضرورات الحياة ، وهو من سنن الرسول - صلى الله عليه وسلم - والبحث عن عروسة في صلاة التراويح او عن طريق المسجد مشروع وحلال ولا غبار عليه ، ومن ينظر لفتاة بنية وغرض انه يريد ان يتزوجها جائز ، فلا داعي ان نحرم ما احل الله ، والا كيف يتزوج من يريد الزواج الحلال ؟ هل يتزوج من كافية افضل من ان يتزوج من المسجد ؟ ام يتزوج \" عمياني \" بدون ان يرى عروسته<br />انتو بتضيقوا الحلال وتوسعوا الحرام ولا ايه؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134438/http://www.20at.com/article2.php?sid=1367"

