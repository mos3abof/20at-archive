subject = "ليست مصر الوحيدة"
author = "جنة"
posted = "2006-10-19"
text = "اعتقد هذا الموضوع موجود فى مصر وغير مصر وانا اعرف سيدة زوجت جميع بناتها وبعض من بنات معارفها عن طريق حرصها على صلاه العشاء والمغرب فى الجامع المجاور لبيتها . واعتقد انه ليس حرام او يقلل من ثواب الصلاه فى الجامع"
