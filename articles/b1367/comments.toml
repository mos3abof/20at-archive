subject = "ايه اللى يمنع؟؟"
author = "مسلمه بردوا"
posted = "2006-10-19"
text = "مفروض ع كل مسلم ومسلمه انهم يتوجهوا للصلاه بالمسجد بنيه خالصه لله بدون مايكون فى نيتهم حاجه تانيه مرتبنها غير الصلاه<br />بس لو ربنا اراد ان ام او اخت شاب اعجبت بيها وحبت تزوجها وليه لا<br />خير من ربنا<br />ايه اللى يمنع؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134438/http://www.20at.com/article2.php?sid=1367"

[[comments]]
order = 13
subject = "ايه اللى يمنع؟؟؟"
author = "مسلمه بردوا"
posted = "2006-10-19"
text = "هى اهو حب يراضى الله فربنا رضاها بزوج ممن ترتضوا دينه ورضاه بزوجه فظفر بذات الدين<br />الحمد لله الموفق الطيبات للطيبون<br />المهم احب اشكر احمد عمر ع تعليقه ورقيه فى نظرته للمرأه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134438/http://www.20at.com/article2.php?sid=1367"

[[comments]]
order = 14
subject = "لا حول ولا قوة الا بالله المساجد مظاهر"
author = "شرين منصور"
posted = "2006-10-22"
text = "يا جماعة المساجد اتعملت للتعبد واقامة الصلاة مش لأقامة علاقات أنا بصراحة كنت ناوية اروح المسجد أصلي فيه بس اللي بسمعو يخليني اشمئز اني اروح لأن دلوقتي بعد ما كان اللي بيروح ابتغاء وجه الله بيروح ابتغاء وجه الخطوبة ده طبعا بالنسبة للسيدات فانا مش لاقية غير لا حول ولا قوة الا بالله وحسبي الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134438/http://www.20at.com/article2.php?sid=1367"

