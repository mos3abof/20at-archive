[[comments]]
order = 3
subject = "حاول أن تموت ياعم سيد مهران(1)"
author = "مراقب"
posted = "2006-08-19"
text = "هذا ليس زمنك يا سيد مهران . وخيرا فعلت حينما اخترت لنفسك المقبرة لتنام فيها بسلام ... أنت لست في زمنك ..أنت لست في زمن الرجال ... الموجودون الآن من الأشباه ومن الغثاء ومن الإمعات أنت لا تعرف لغتهم ولا تعرف كيف تتحدث معهم.... ياه على هذا الزمان الردئ... ياترى لمن كنت تحارب الإنجليز؟؟ لمن وهبت روحك وأنت تعبر دقائق الموت في كل خطوة تخطوها ؟؟؟ ياترى امن مهدت الأرض بدمائك وأرواح مئات الألوف من إخوانك الشهداء الأبرار الأطهار ؟؟؟ مؤكد أنكم كنتم ت}منون أن مصر حرة أبية ومستقلة ولا يحكمها إلا أولادها الأحرار الفدائيون الشجعان؟؟؟ أليس كذلك يا عم سيد مهران؟؟؟؟طيب إيه رأيك طالما ربنا مد في عمرك و عشت وتوقف بك عند زمن مبارك ؟؟ وجمال مبارك ؟ وأحمد عز بتاع الحديد؟ وإبراهيم سليمان بتاع ردم النيل؟ وكمال الشاذلي بتاع كارتة مجلس الشعب؟ وأبو الغيط العبيط بتاع إحنا جاهزين بالمظاهرات؟ وأبو العينين بتاع الفياجرا؟ ومنصور شيفورليه؟ ومحيي الدين بتاع بيع كل حاجة حتى تكة اللباس؟؟ وسوزان هانم بتاعة السبع صنايع ؟؟؟ ها نقول لك إيه يا عم سيد مهران مانت عارف كل حاجة"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065202/http://masr.20at.com:80/article.php?sid=813"

[[comments]]
order = 4
subject = "حاول أن تموت ياعم سيد مهران (2)"
author = "مراقب"
posted = "2006-08-19"
text = ".. فاكر يا عم سيد الفلسطينيين الفدائيين اللي زيك وخطفوا سفينة اكيلي لاوروا الإيطالية علشان يلفتوا نظر العالم لقضيتهم ومصر أمنتهم على حياتهم وطلعوا الطيارة المصرية وهي في الجو اعترضها الطيران الأمريكاني ونزلها صقلية وأتاريهم كانوا بيتصنتوا على الريس بتاعنا وعرفوا كل حاجة عن الطيارة وما نطقشي ريسنا بحرف واحد يومها؟؟؟ فاكمر ياعم سيد سليمان خاطر اللي كان رابض على الحدود وقام بواجبة نحو الصهاينة الكلاب اللي دخلوا منطقة عسكرية محظور وجندلهم ..فاكر عمل له ريسنا ؟لأ طبعا مش علق له نيشان على كتفه ده علقه من رقبته وشنقه في شباك الزنزانة وقالوا انتحر؟؟ فاكر ياعم سيد صفر المونديال وللا العبارة اللي غرقت وللا اللي اتحرقوا في قطر الصعيد وللا اللي اتحرقوا قصر ثقافة بني سويف؟؟؟ فاكر ياعم سيد مليارات البنوك اللي نهبها رامي لكح واحمد بهجت وابوالعينين وخميس والعيال بتوع قواضي البنوك كتير قوي أصلها مش قضية ولا عشرة ولا ألف دي حاجة كدة مالهاش عدد وكلهم طلعوا منها زي لما يطلع المليار من العجينة ؟؟؟؟ وفاكر ياعم سيد بقى المصري الأسمر أبو ضحكة ترد الروح ؟؟ دلوقتي جاله السرطان والكبد والقلب والفشل الكلوي وبيسرقوا أعضاؤه وبيبيع كليته علشان يعيش ويجوز بنته ويجهزها؟؟؟ عارف ياعم سيد مهران المصري كان على زمنك له ألف وألف كرامة خصوصا لما رجله تحط في أي بلد عربي ..كفاية إنه جاي من بلد الزعيم جمال عبد الناصر زعيم الأمة العربية صاحب أكبر جنازة في التاريخ اللي ناحت عليه الرجال قبل النساء ؟؟"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065202/http://masr.20at.com:80/article.php?sid=813"

[[comments]]
order = 5
subject = "حاول تموت ياعم سيد مهران (3)"
author = "مراقب"
posted = "2006-08-19"
text = "تعالى وشوفه دلوقتي عامل إيه ..مش هاقول لك لأن قلبي وجعني ياعم سيد مهران... لكن اللي وجعني أكتر إنك إنت وغيرك من الشهدا والفدائيين الأبطال والأطهار تبيعوا حياتكم رخيصة وتخوضوا عمليات وبطولات ولا الأساطير علشان في الآخر ييجي واحد يحكم مصر ويحكمك ياعم سيد مهران زي مبارك ومن بعده ابنه المحروس جمال بتاع السياسات ومائة ألف من خيرة شباب وكهول وشيوخ مصر في المعتقلات وزنازين أمن الدولة بقالهم سنين طويلة بلا ذنب ولا جريرة والتعذيب اللي بيشوفوة عمرك ماشفته ولا على إيد الانجليز ... علشان كده بأقول لك ياعم سيد مهران حاول تموت ..حاول تخرج من هذا الزمن الردئ ..لأن هذا الزمن ليس زمنك ...فأنت لست في زمن الرجال ... بل أنت في زمن من باع فلسطين وباع العراق وباع لبنان وباع التاريخ والشرف العسكري وياع عمر أفندي وباع شركة الحديد والصلب وباع الغاز لإسرائيل لكي تمول به سلاحها لتهدم البيوت على أطفال قانا مرتين ... ها أقول لك إيه وللا إيه وللا إيه ياعم سيد مهران ....حاول أن تموت في هدوء وشرف .... واتركنا نعيش مع هذ1 الهوان ....مع هذا الجبان"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065202/http://masr.20at.com:80/article.php?sid=813"

