[[comments]]
order = 7
subject = "المصريين بتوع الستينات و السبعينات"
author = "سعد اليتيم"
posted = "2006-08-19"
text = "يا ريت حد يشاركنى رأى فإن جيل شباب الستينات و السبعينات و خصوصا اللى قضوا فى الجيش ست سنين من 67 لغاية 73 دول بيعتبروا أساطير بالنسبة لشباب اليومين دول لأن الجيل ده كان جيل خشن تحس فيه بالرجولة فعلا لدرجة إن فى أحد الظباط كان بيحكى عن حرب 73 كان بيقول و هوه طبعا صادق فى كلامه و مفيش مصلحة إن يكذب أنه كان بيشوف بعينية عساكر مصريين بيسيبوا السلاح من إيديهم و يهجموا على الإسرائليين بظوافرهم و أسنانهم و بيفترسوهم كأنهم فهود شرسة نزلت على فريسة كانت بتنتظرها من زمان .... تفتكروا إن ممكن الجيل اللى بننتمى له دلوقتى عنده الجلد و الخشونة و الرجولة دى!!! للاسف ما أظنش و طبعا ما أظنش لسبب بسيط لأننا ما عيشناش اللى عاشوه و لا شوفناش اللى شافوه لأننا إتربينا من صغرنا بنسمع عن إن إسرائيل دى دولة صديقة و بنشوف رئيسنا الحبيب نازل بوس فى نتنياهو و باراك و شارون الخنزير و أخيرا أولمرت الحيوان يبقى إزاى نحس اللى حاسوه و لا نعيش اللى عاشوه و منك لله يا اللى فى بالى يا اللى خليتهم يدخلوا بيتنا"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065202/http://masr.20at.com:80/article.php?sid=813"

