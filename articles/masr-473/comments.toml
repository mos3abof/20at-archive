[[comments]]
order = 0
subject = "رحم الله الدكتور أحمد عبد الله"
author = "د.مجدي سعيد"
posted = "2006-06-08"
text = "رحم الله الدكتور أحمد عبد الله رزة الذي عرفته فقط منذ منتصف التسعينيات، أي منذ ما يقرب من 12 عام وذلك حينما شاركنا سويا مع عدد آخر من الشباب من مختلف الأعمار من ممثلي التيارات السياسية المختلفة في الحوار الوطني الذي نظمته لجنة العدالة والسلام بالكنيسة الكاثوليكية ومنذ عرفته عرفت فيه اتساقه مع نفسه، واستقلال شخصيته ورفضه أن يكون أداة لنظام استبدادي يرفضه، شخص تحترمه، قد تختلف أو تتفق مع آرائه إلا أنك لا تملك إلا احترامه لأنه يحترم نسفه ومبادئه<br />ولقارئي عشرينات أقول إن الدكتور أحمد عبد الله رزة هو من أشهر مؤرخي الحركة الطلابية في مصر، حيث ترجمت رسالته للدكتوراه حولها ونشرت في دار سينا للنشر، ومن خلال جمعيته في مصر القديمة ظل حريصا على خدمة أهل حيه..رحمه الله وغفر له."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135507/http://masr.20at.com:80/article.php?sid=473"

[[comments]]
order = 1
subject = "إنا لله وإنا إليه راجعون"
author = "الوالدة باشا"
posted = "2006-06-10"
text = "رحم الله الزميل الغالي الدكتور أحمد<br />ونتمنى أن تستمر رسالته التى أفنى زهرة شبابه لتحقيقها<br />وأتمنى أن يتعرف على نضاله وكفاحه كل من<br />يؤمن بحب مصر"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135507/http://masr.20at.com:80/article.php?sid=473"

[[comments]]
order = 2
subject = "اللهم اغفر له جده وهزله"
author = "فارس الأندلس"
posted = "2006-06-11"
text = "رغم انى مازلت طالبا لكنى اشعر بالفخر من اعماقى بهذه الأمثله المشرفه.<br />وأدعو الله ان يعيننا على حمل الرساله وتأدية الأمانه ."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135507/http://masr.20at.com:80/article.php?sid=473"

[[comments]]
order = 3
subject = "ناي الفقراء"
author = "فادي اسكندر"
posted = "2006-06-13"
text = "احمد عبدالله رزة مصباح الغلابة وناي الفقراء<br />احمد عبدالله اللي رفض يسيب مصر القديمة عشان اهلة وعشان بيحب مصر اللي بجد وبيحب ولاد البلد اللي بجد<br />احمد عبدالله اللي اهدي رسالتة الي اهالي مصر القديمة البسطاء<br />احمد عبدالله اللي السادات قال \" انا مقعدش مع رزة \"<br />احمد عبدالله اللي رفض الخيانه والتطبيع والديكتاتورية<br />احمد عبدالله اللي قال انا اختلف مع عبد الناصر ولكني احترمة<br />احمد عبدالله الجدع اللي طول عمرة كان مبتسم<br />احمد عبدالله ابن البلد ... الله يرحمة"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613191528/http://www.masr.20at.com:80/article.php?sid=473&PHPSESSID=4639c9bced193ce25350918d6881048a"

[[comments]]
order = 4
subject = "رحمة الله عليه"
author = "هيثم الفلسطيني"
posted = "2006-08-01"
text = "رأيت هذا الرجل (أحمد عبدالله) على عدة قنوات فضائية، واحترمت طرحه رغم أنني أختلف معه فكريا... رحمه الله."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222425/http://masr.20at.com:80/article.php?sid=473&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
