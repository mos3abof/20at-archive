subject = "كيف تحمى نفسك من انفلونزا البنى ادمين"
author = "البليونير الروش"
posted = "2006-08-09"
text = "انتاسعات تكون ماشى فى الشارع وتلاقى حبة شباب روش تقول يااااة نفسى ابئا واحد منهم وممكن يكون واحد منهميكون من عائلة فقيرة ويكون بيبيع مش وجبنة قريش على الترعة بتاعت بلدهم الشباب الكويس الجميل الزى يكون طيب القلب عندما يرا فتاة فى الشارع لا ..... انتو فاهمين تزكر اختك لو انتا عرفت ان واحد من اصحابك يعاكس اختك او يجامعها مازا تفعل اكتفى بهزا والى القاء ......؟"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919123809/http://masr.20at.com:80/article.php?sid=457&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 20
subject = "محمد نبى اللة ورسولة ورحمة وشفيع للمومنين يوم لا ريب فية"
author = "البليونير الروش"
posted = "2006-08-09"
text = "السلام عليكم اما بعدانتم جميعا زعللين لما يقولون على الرسول صلى اللة علية وسلم .انتا ماشى فى الشارع وواحد جى يهينك راح جاء شخص ضخم الجسة ودافع عنك مازا يفعلون سيهربون ويفرون خوفا صحيح اما ان رسول اللة عز جلا لة يحمى رسول اللة واللة ان كل شخص من الزى هان الرسول ورب العزة سيدمرويقول ياليتنى كنت تربا لو فى اقل من التراب لكنت قولت وبعض صحابى يقولون هل رايت ما حصل للفتى الزى تعزب فى القبر بعد 3 ساعات انهو ليس عزاب العزاب قادم الا ما رحمة ربى ان ما حصل لهو من ضمة الارض لان البشر جميعا جزا من الارض ما معنى الضمة كنما شخص رفع جبل احد ووقعو عليك اكتفى بهزا ولا القاء .......؟"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919123809/http://masr.20at.com:80/article.php?sid=457&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

