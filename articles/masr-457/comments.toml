subject = "هييه خناقه"
author = "LisTaT"
posted = "2006-06-09"
text = "ايوة من الواضح ان الناس في المكنه دي انقسموا الي 2<br />الاول هو شباب روش زيادة عن اللزوم ة طبعا مش عاجبه الناس المؤدبه<br />و التاني ناس مؤدبه زيادة عن اللزوم او لابسين اخضر و عاملين فيها شيوخ و انا عارف الي فيها<br />متهيالي الموضوع محتاج توازن يعني من دة علي دة ولا تعقيد ولا روشنه زيادة<br />علي العموم انا حدي هديه مطوه لكل مواطن و قطعوا بعض بقي بلا وكسه"
