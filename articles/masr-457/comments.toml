[[comments]]
order = 10
subject = "يعني اييه ظظي"
author = "caironumb@yahoo.com"
posted = "2006-06-06"
text = "يعني اييه ظظي دي يا جماعه عشان بجد مش قادر أفهم الكلمه دي .... هي الكلمه دي عربي ..<br />اييه يا هايفه الفرحه اللي انتي فيها بسبب صحابك اللي بيقولك كلام حب .. تك خيبه يا هايفه انا بصراحه مش هاتكلم عن موضوع الصحوبيه ده دلوقتي لأن انا ممكن اكتب في نقضه مراجع . خصوصا إنه شغل بالي فتره و فكرت فيه كتير . بس للأسف مش فاضي"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919123809/http://masr.20at.com:80/article.php?sid=457&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 11
subject = "معنى يظظي"
author = "فهيم"
posted = "2006-06-07"
text = "بص يا باشا<br />ظظ يظظي فهو ظظاوي و المصدر منها ظظ برده<br />كلمة عاميه جديدة من إختراع بعض الشباب الروشين طحن و معناها هو ظرط أو فسى و هي نفس الكلمة اللي كان الجيل اللي قبلينا بيستخدمها عند شم رائحة من ايهاها أو سماع صوت من نفس النوعية بس دي فيها إبداع<br />و ممكن نستخدم ظظ كإسم فعل كمان<br />مثال : هذا ظظ فلان<br />أي أن فلان عمل حاجه و هي دي نتيجتها اللي كانت وحشه جداًً علشان كده بنقول عليها ظظ<br />و في النهاية أشكر الكاتب و بالذات أشكر الأخت (ظيظي) اللي أضافت هذه الرائحه للموضوع و كذلك الأخت الهايفة اللي أكدت نظريتي بهيافة تفكير البنات في البلد دي.<br />و انا هابتدي أفكر أعمل بحث على كلام الحب في جوجل عملاً بإقتراح الأخت الهايفة جداً."
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919123809/http://masr.20at.com:80/article.php?sid=457&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

