[[comments]]
order = 2
subject = "سلام الخرفان"
author = "أبو أسامة"
posted = "2006-05-24"
text = "لقد كان للاخ ابو عمار تعليق شهير اسمه سلام الشجعان ولكنه ميعرفش انهم كانوا عاوزين منه سلام من نوع اخر وهو سلام الخرفان الى بيعملوا دالوقتى الحكام العرب<br />والاخ حسنى والماماسوزان سلام(الأستسلام)والرضا بفرض الأمر الواقع والتسليم بكل شىء يفرضوه عليناوده طبعا له مقابل بس مش<br />للشعوب بالطبع ولكن لصالح هؤلأ الحكام<br />الذين ابتلينا بهمفمنهم الى ياخذ جايزة ومنهم الى يطنشوا عن الديموقراطية بتاعته<br />مع انه والله ماعمل حاجة فيها ديموقراطية<br />واليوقف فى وشهم زى الأسد يطلبوه بالديموقراطية. واخيرا لقد ضاع السلام فى زمن الأستسلام وشكرااااااااا<br />لا............. للتوريث<br />لا............. للاصتعباط"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223559/http://masr.20at.com:80/article.php?sid=366&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

