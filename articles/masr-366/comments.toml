[[comments]]
order = 18
subject = "سوزي بورنو إكس إكس إكس!"
author = "سمسم"
posted = "2006-05-29"
text = "لو تفتكرم ياحضرات إزاي حكومتنا الرشيدة مهدت لمدام سوزي إنها تدخل الحياة العامة والسياسة، الحكاية بدت في مقال لإبراهيم سعدة بيذكر إنها مصابة بسرطان الدم، قولو آمين، وإن الولية عايزة تصطلح مع ربنا، وتختم عمرها بالأعمال الخيرية.<br />نفس السيناريو اللي دخلت بيه جيجي اليهودية حياتنا العامة عن طريق إزاحة المرحومة أم كلثوم عن جمعية النور والأمل الخيرية. وأم كلثوم للي ما يعرف دارت تغني هنا وهناك وتجمع فلوس بعد نكسة يونيه، علشان إعادة بناء القوات المسلحة. المرة الشلق جيهان والأصل غلاب سودت عيشة أم كلثوم لما ياعيني ماتت بعدها من القهر ونكران الجميل.<br />الرئيس (المؤمن) أبو زبيبة الكذاب الله يجحمه، كان سايبها على حل شعرها، وزي البقرة الضاحكة خليفته بيسأل الشرموطة بتاعته\" هو إنتي يامدام جتي إيه وكام، وعمره ما سأل كنتي فين ولا مع مين؟\"<br />ده الديوث مهموش لما كارتر (صديقه) قدام كاميرات التلفزيون حضن الولية جيجي ونزل فيها بوس، على راي عادل إمام \"أصلها متعودة!\".<br />إحنا قعدنا نلعن سنسفيل جدود القذافي لما تلسن عليها وقال\" دعتني الي نفسها!\"، والديوث السادات عمل من وراها حرب مع ليبيا. والله العظيم كلام جد.<br />والسادات كان مسمي نفسه الرئيس المؤمن وكان عايز يبقى خليفة المسلمين، يبقى حضراتكم تخيلوا بقي سوزي بورنو بتعمل إيه؟ هي والمعرص بتاعها اللي ماهو فالح إلا في البلطجة علينا ؟ ياخونا دول إستوردوا لينا جواز المثليين (الشواذ) ليه هو فيه عندنا كام فاروق حسني بقى؟<br />وإلا مصر بقت سلطنة عمان ولا قذرات الخليج؟<br />ربنا يخلصنا منهم، قولو آمين!"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223559/http://masr.20at.com:80/article.php?sid=366&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

