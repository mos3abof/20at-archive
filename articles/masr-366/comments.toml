subject = "ليست ماما بل ماما لجمال بس"
author = "سيد الشباب الشايب"
posted = "2006-07-20"
text = "انها ثقافة السلام الأمريكية اليهودية<br />انها ثقافة السلام اليهودية الأمريكية<br />انها ثقافة الضعفاء الجنباء الذيول<br />اود أن اذكر أنهم سوف يموتون ويعرفون الحقيقة عندما يموتون فقط<br />لا أمل أن يعرفوا الحق الاا بعد موتهم<br />نعم<br />نعم<br />نعم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223559/http://masr.20at.com:80/article.php?sid=366&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
