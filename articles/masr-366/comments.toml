[[comments]]
order = 15
subject = "طعامتك ياخوجاية سوزي ياكميله"
author = "سمسم"
posted = "2006-05-28"
text = "طبعا يدوها جايزة وأكبر جايزة ياجدعان، هو اللي عملته في البلد شوية؟ دي تفوقت على بنت اليهودية جيهان، صاحبة فكرة السلام مع أهلها في إسرائيل، واللي مش عارف يسأل ويتنور.<br />أول ست ضيعت مصر كانت مرات المشير\"برلتني عبد الحميد\"، وفي ليلة خمسة يونيه كانت عاملة للطيارين حفلة ساهرة وحشيش وسكر على ودنه، عبد الحكيم عامر كان مسميها \"القطة الشاطرة\" علشان مكنش حد يلف سجارة الحشيش أحسن منها، والكلام دة أحلف عليه.<br />حد منكم يعرف شكل مرات \"جمال عبد الناصر\"؟ ولا حتى إسمها؟ إلا إذا كان من اللي عرفوه شخصيا؟ ليه لأنه كان راجل حر، وراجل مش إمعه زي جم بعده، من عيال المنوفية.<br />سوزان ياجماعة بقى ضيعت اللي مليون جيهان مقدرتش تعمله، جيهان والديوث بتاعها السادات أخرجم مصر وعزلولها عن إمتدادها العربي والإسلامي، إنما ماكنتش مصر مع ذلك بقت المفرخ لكل المؤمرات اللي بتحاك ضد العرب والمسلمين، ده إنجاز سوزي والقواد مبارك بتاعها."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223559/http://masr.20at.com:80/article.php?sid=366&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

