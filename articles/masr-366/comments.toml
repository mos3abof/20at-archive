subject = "لازم"
author = "تلقيها قدمت كام حته حلوة كدة من آثار مصر الغالية على كام مشروع بيع شركة من أملاك مصر للجماعة إياهم علشان كده هما برضوا لازم يرضوا الهدية بهدية وإلا بابا حسنى يزعل والصغنن بتاعهم برضوا ممكن يزعل وتبقى حوسه"
