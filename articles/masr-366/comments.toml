subject = "كان لازم تأخذ مقابل"
author = "بعد نهبها لكل أموال جمعيات المرأة وبعد نهبها لكل أموال مكتبة الأسرة وبعد أن أخذت السيدة رولا بوش لزيارة مدارس مصر وغيرت تلاميذ المدرسة بمدرسيهم بتلاميذ مدرسة أجنبية وأصابة تلاميذ المدرسة الأصلية بالإحباط وبعد تدهور مصر كلها على إيديها وإيدين بقيت العيلة بتاعتها أصبح كل شيء جايز وعادى وأهى جايزة سلام زى بالضبط جايزة إستسلام شعبها لكل فسادها وزوجها وإبنها وحسبى الله ونعم الوكيل"
posted = "2006-05-25"
text = "ولأقول لها قول الشاعر<br />أخى جاوز الظالمون المدى فحق الجهاد وحق الفدى"
