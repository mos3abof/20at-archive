[[comments]]
order = 10
subject = "فلاح خرسيس"
author = "اغجان باشا"
posted = "2006-05-27"
text = "تشكورات سوزان عي حضورك حفل تكريم بنت مولانا رضوان باشا مع سيدات مصر عظيمة ,انت نورتي حفلة باشا حفيد اتاتورك باشا عظيم ,ونحن نهنيك علي ما تفعلينه ببلدك مصر عثماني من خير يعم علي سيدات بشوات مصر الجديدة والزمالك والمهندسين ومعادي , من خدمة عظيمة لاطفال مجتمع اغنياء مصر.<br />اما فلاح خرسيس معفن فعليكي جلده كل يوم 10 جلده علي ظهره المقشف لانه ما ينظف حقل حضراتكم من الدودة, دول فلاحين معفنين مصريين جربانيين عليكي طردهم هما وعياله ومراته ,ولو عايزة تتخلصي منهم بسرعة عليكي و(ممدوح اسماعيل باشا) يحطهم في مركب كبيرة سيادتكم ويغرقهم كلهم علشان هما مصريين جربانيين فلاحيين, مو واجب يعيشوا مع حضراتكم في بلد واحدة من العزبة بتاعتك حضراتكم .<br />وسلملي علي التوريث"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223559/http://masr.20at.com:80/article.php?sid=366&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

