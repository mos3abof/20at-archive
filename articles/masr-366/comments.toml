[[comments]]
order = 8
subject = "ألف حمد الله على السلامة"
author = "مصرى"
posted = "2006-05-27"
text = "ألف حمد الله على السلامة يا محمد وربنا يفك أسر كل المعتقلين ويحط فى المعتقل كل الفسدة والمنافقين إللى خربوا مصر<br />وبالمناسبة هما يبدوا لسوزان مبارك جايزه على أيه هو النهب والسلب أصبح ليه جوايز دلوقتى وسلام إيه إللى هما يبدوها عليه جايزة ده أولا سوزان مبارك ليست مصرية يبقى بيدوها الجايزة ليه إللى تستاهل الجايزة لازم تكون مصرية وتكون عانت زى كل الشعب المصرى لما يبعانى من فساد حسنى مبارك وتكون حاولت إنها تحارب الفساد ده بأى طريقة وأنا أعتقد أن إللى تستحق الجايزة دى هى كل أم ربت ولاده لوحدها بعد لما أعتقلوا جوزها أو أبنها علشان نطق كلمة حق فى وجه الفساد وأتمنى إن الجايزة دة تعطى وبكل فخر للمستشارة نهى الزينى بارك الله فيها وكتر من أمثالها"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223559/http://masr.20at.com:80/article.php?sid=366&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

