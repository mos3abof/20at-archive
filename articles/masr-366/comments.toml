order = 16
subject = "مشروع ارهابي"
author = "عاطل عن العمل (خريج جامعة)"
posted = "2006-05-28"
text = "اه نفسي اركب العربية الحلوة ديه بس منين<br />مش لازم عربية<br />اه نفسي اشتري شقة علي قدي علشان اعيش بس منين<br />مش لازم شقة<br />اه ان بحب واحدة بس وهي بتحبني ونفسي ارتبط بس منين<br />مش لازم اجوز اصلا .... اوك<br />اه نفسي في وظيفة صغيرة ابدء بيها حياتي ولو150 جنيه بس ازاي وانا مش معايا واسطة, او فلوس ادفعها , اوخال او عم مسئول كبير<br />اوك انا خلاص اتعودت علي البطالة ومصروف امي المسكينة<br />مش مشكلة شغل<br />اه انا عايز اكل اي اكل والفلوس مش مكفية والاكل سمعت انه مسرطن ومليء بالامراض الخبيثة<br />طيب اعمل بقي في الدنيا الي مش عايزة تعطيني مجهود 23 سنه في تعليم مش ليه فايدة<br />ولا شغل ولا جواز واكل مسرطن<br />طيب اعمل ...ايه<br />خلاص عرفت... الاجابه.. والحل لمشاكل الشباب<br />عند ربنا ارحم من هنا."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223559/http://masr.20at.com:80/article.php?sid=366&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

