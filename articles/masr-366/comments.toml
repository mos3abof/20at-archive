[[comments]]
order = 0
subject = "برافو هايدي"
author = "أسامة صابر مصطفى"
posted = "2006-05-24"
text = "مقالتك أكثر من رائعة، وللحقيقة فقد كنت أنوي أن أكتب موضوعاً عن نفس الأمر في أحد منتديات الإنترنت وهو منتدى راديو مصر اليومhttp://masrelyoum.com/vb/forumdisplay.php?f=26، ولكنك سبقتني إليه..<br />وللأمانة، لم أكن لأكتبه بمثل هذه الحرفية.<br />أخيراً.. يوجد الكثيرات ممن يستحقن هذه الجائزة ومنهن:<br />المستشارة نهى الزيني: التي فضحت تزوير الانتخابات.<br />السيدة جميلة إسماعيل: التي تناضل من أجل زوجها الذي تحول لرمز شعبي.<br />الصحفيات اللاتي تعرضن لتحرشات وسفالات شرطة مبارك.<br />الفتيات المنتميات لحركة كفاية وحزب الغد اللاتي ما زلن معتقلات حتى الآن.<br />السيدة (ذات الرداء الأزرق): التي للأسف لا أعرف اسمها، وهي من رأيناها تُسحل في الشارع وهم يقتادونها لعربة الأمن المركزي."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223559/http://masr.20at.com:80/article.php?sid=366&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

