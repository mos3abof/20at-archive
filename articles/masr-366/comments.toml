[[comments]]
order = 5
subject = "مصر بلدى"
author = "شريف وطنى"
posted = "2006-05-27"
text = "ذى منتو بتقولو تعليق وبتطلبو تعليق سيده مصر الاوله ماما سوزان هيه مش فضيه تعلق عليكو كفايه ان العاله كلها سيباكو تقولو كل ما عندكم والرد يكون من ابناء البلد المصريين<br />حريه تعبركو متعبرش الا على حاجه وحده وهى انتو مش مصريين ومتعرفوش حاجه عن بلدى<br />على فكره انا لااتبع الا مصر وقائد مصر قائدى ومخلينه احرار انتو متعرفوش معنا الدمار<br />واقول لكل مصرى ومصريه اصحو من النوم ومتخلوش التشويش يعميكوانتو بتتكلمو على اهل البطل لو عيزين تعرفو اكتر ممكن تقراءو اكتر والف مبروك على مصر جائزه السلام لماما سوزان"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223559/http://masr.20at.com:80/article.php?sid=366&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "اخرج منها يا ملعون"
author = "الاستاذشيكو"
posted = "2006-05-27"
text = "الاخ الفاضل اللي مسمي نفسه شريف وطني علي وزن خزب وطني يبطل يمثل علينا جايزة ايه يا اهبل انت اللي انت فرحان بيها هوة فيه حاجه اسمها مصر فيه بلد اسمها مبارك وسوزان الاول وبعدين البلد وهي الست عملت ايه للسلام العالمي غير الاستهبال ع طول الخط باين عليك من اللي بيمشو ورا الست وبيرفعوا ديل الفستان يا تابع الست . اما الست نفسها فلو هي مقتنعه بانها تستحقها تجاوب علي اللي جاء في المقال وتورينا شطارتها ولا هي فالحه بس تتحفنا بالمكتبات اللي مافيهاش غير الكتب اللي تبايع لجوزها وتفرغ العقول من اللي فيها يا ست انا فيه جايزة انا هاعملها ليكي بس اسمها جايزة الست الاولانيه في كل حاجه وكل حاجه وبرده كل حاجه"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223559/http://masr.20at.com:80/article.php?sid=366&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

