[[comments]]
order = 20
subject = "سوزان جدتها انجيليزية"
author = "ياسر الناصرى"
posted = "2006-07-06"
text = "ماذا نتنظر من واحدة ليست جذورها مصرية تعين ابنها وعلى جوزها عشان ينزل علينا بالبارشوت من انجلترا لاكبر سلطة تنفيذية فى البلد انها سيدة تصنع مجدها ومجد عيالها ترى هل تعرف شيئا عن سيدات الوراق ولا البدرشين ولا حتى كوم القلعى انها سيدة صنعت للمجتمع الراقى وسيدات الاعمال مثلها مثل زوجها رئيس رجال الاعمال واحمد عز ابو العينية سايورس نهبوا البلد وظبطوا الحكام وخلاص كله ضحك على الدقون جوائز توزع لشوية نصابين واحدة جدتها انجليزية هيكون قلبها فين حتما ولاءها لانجلترا وما خفى كان اعظم ابنها الاولانى طلع رجل اعمال يحتكم على يجة 50 مليون والثانى كون نفسه واشترى شقة لخطيبنة يا عينى فى الزماللك بخمسة مليون وال65 مليون دولار الباقين اهم فى بنوك سويسرا مع اخوتهم بتوع الراجل الكبير اللى عنده بشهادة د ايمن نور ربنا يخليها نبراس على محاربة الفساد المباركى عند مبارك فى الخارح حوالى من 45 الى 55 مليون دولار وزغردى يا اللى انتى مشض غرمانه وسلم ليى على ابراهيم عيس ووائل الابراشى وكل الشرفاء الله هيتسحلوا فى عصر مبارك سوزان السلام والعهر المباركى"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223559/http://masr.20at.com:80/article.php?sid=366&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
