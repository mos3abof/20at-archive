subject = "تعالوا نرشحها رئيسة"
author = "على"
posted = "2005-11-26"
text = "اايها المصريين مابالكم بهذه السيدة الفاضلة التى قالت لا امام طاغة الحزب الوطنى فهل من الممكن ان نرشحها لرئاسة الجمهورية لعل الامل يكون على يديها الطاهرتين"
