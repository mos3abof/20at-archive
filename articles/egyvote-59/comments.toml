[[comments]]
order = 1
subject = "انا الله لا يغير ما بقوم حتى يغيرو ما بانفسهم"
author = "محمد"
posted = "2005-11-26"
text = "نامن اهل دمنهور وانا وغيرى سوف ننتقم اشد انتقام من كل من ينتمى للحزب الوطنى ولو فيها قتل وما اخز بالقوة لا يسترد الابالقوه*****اما القضاه لا يعنيه الا الكرسى الى جالس عليه *والاكانو ساندوالشعب فى انتخبات الرياسه"
archived = "2006-09-28"
capture_url = "https://web.archive.org/web/20060928143519/http://egyvote.20at.com:80/article.php?sid=59"

