author = "كشرى الكرة بالسياسة"
posted = "2009-11-19"
text = "القيادة السياسية الفاشلة فى كل المجالات بشهادة العالم اجمع ارادت ان تتجمل وان تتصور فى الاستاد بجوار نصر كروى فشحنت الناس فى الاعلام وكاننا نصرخ يا خيل اللة اركبى والى الجهاد يا رجال - كان شحن للشباب فوق الوصف وغير مسبوق<br />ناسين طبيعة المصريين ان نفسهم قصير جدا وانهم يبداوون العمل اى عمل بنجاح وحماس ثم يتكاسلوا نتيجة قصر نفسهم فينهزموا فى الاخر - تماما زى حرب 73<br />لقد خلطوا السياسة بالكرة وعملوا كشرى طعمة بايخ اصاب الناس بالاحباط الشديد<br />وخرج الناس بعد الماتش من المقاهى وامام التليفزيون وافرغوا غيظهم وغلهم فى معاشرة جنسية مع زوجاتهم وانخمدوا وناموا<br />وسلم لى على شرارة ابو وش فقر اللى عمرة ما بيحضر مباراة الا وننهزم"
archived = "2009-11-20"
capture_url = "https://web.archive.org/web/20091120045151/http://www.20at.com:80/masr/news/14098-2009-11-18-23-47-10.html"
