subject = "ربنا يتوب علينا بقى"
author = "دعاء"
posted = "2006-12-28"
text = "احنا هنا متعلمناش احنا علمنا نفسنا بنفسنا<br />وتسلم اديك يا احمد الموضوع حلو اوى<br />وسلامى لااحمد عطيه وحشتنا اوى وربنا رحمك من العك اللى هنا استمتع بدراستك<br />وربنا يوفقكوا انتوا الاثنين"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103109/http://masr.20at.com:80/article.php?sid=1369"

