[[comments]]
order = 10
subject = "وزير التعليم المحاق"
author = "أحمد فؤاد الدين"
posted = "2006-12-29"
text = "الموضوع جميل قوي يا احمد ارجوان يقراه وزير النعليم الخايب بتاعنا اللي مش وراه غير الاخوان و السياسة في الجامعة و التعليم الخاص حاجة تجيب الضغط اما بخصوص الشيعة فسيدنا علي من اهم علماء و فقهاء الاسلام لكل المسلمين سنة و شيعة و حتي الغير مسلمين يقرأوا الامام ليتعلموا عن الدين الكثير موضوع رائع يا احمد"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103109/http://masr.20at.com:80/article.php?sid=1369"

[[comments]]
order = 11
subject = "نهج البلاغة"
author = "مهندس مصرى"
posted = "2006-12-29"
text = "انا مغلطش فى الشيعة فى تعليقى<br />انما انتوا سبتوا بكل الالفاظ السيئة ودة<br />كمان ممكنش المفروض تنفعلوا كدة<br />واضح انك مش شيعى ملتزم يا فندم علشان كدة مش حرد عليك<br />وخليك فاكر قبل متنفعل ان :<br />لا دين لمن لا تقية لة<br />وان التقية دينى ودين ابآئى<br />وربنا يسامح كل اللى شتم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103109/http://masr.20at.com:80/article.php?sid=1369"
