text = "انا مش عارف كاتب المقال ومش عارف اللى اسمة احمدبس<br />يا اما كاتب المقال شيعى<br />يا اما الطالب شيعى<br />يا اما الاتنين مع بعض<br />ارحمونا بقى"
archived = "2007-01-28"
