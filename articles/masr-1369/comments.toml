[[comments]]
order = 3
subject = "نحن المصريون"
author = "نحن المصريون سنة نحب اهل البيت وليس فينا شيعة او غيرة - حبنا لاهل البيت اكثر من الشيعة بل ان القاهرة القديمة مقسمة احياء على اسماء اهل البيت"
posted = "2006-12-28"
text = "حى الحسين<br />حى السيدة زينب<br />حى السيدة عائشة<br />حى عابدين نسبة الى سيدنا على زين العابدين<br />وكذلك المساجد لا تفرقوا بين المسلمين<br />الشيعة مذهب خامس كالشافعى وابوحنيفة<br />نحن سنة نعشق اهل البيت<br />لا اسالكم اجرا الا المودة فى القربى<br />ونحن نحب اهلك يارسول اللة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103109/http://masr.20at.com:80/article.php?sid=1369"

[[comments]]
order = 4
subject = "ببساطة"
author = "مهتمه"
posted = "2006-12-28"
text = "طبعا مسألة \"نهج البلاغة\" لفتت نظري وخاصة ربطها بالمصحف مباشرة ( كما لو كان كتاب وسنة)<br />وكنت افضل الا يأتي ذكرها في الحوار حتى لا تثير حساسية او جدل لا داعي له<br />بعيدا عن قناعات كاتب الحوار او ضيفه<br />اعتقد ان محور الحوار ذاته هو المهم وهو المتعلق بالفروق الحياتية والتعليمية بيننا وبين امريكا<br />واظن ان هذه الفروق لم تعد مقتصرة على امريكا او اوروبا فقط وانما يمكننا الحديث عن التقدم العلمي في الهند والخطوات الواسعة التي تأخذها اغلب دول الخليج في هذا الاتجاه<br />رحمنا الله ورد علينا بلادنا التائهة او المسلوبة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103109/http://masr.20at.com:80/article.php?sid=1369"

[[comments]]
order = 5
subject = "ببساطة2"
author = "مهتمه"
posted = "2006-12-28"
text = "نسيت اعلق على تحول طموح الطالب المصري الذي لا يرى في مصر الا تحت قدميه ولا امل لديه في الافضل<br />ولكن عندما يجد فرصة وجو يشجع على التقدم تبدأ قدراته وطموحاته الكامنة في الانطلاق من عقالها<br />وفي الغالب لا يعرف ايا منا حجم الطاقة المكبوته داخله او المجهولة بالنسبة اليه الا عندما يجد فرصة ان يطلق لها العنان<br />فما فائدة اي طاقة او طموح او امكانيات اذا كان لا مجال امام الانسان لاستثمار هذه الامكانيات؟<br />بل الافضل ان يتجاهلها وينفي وجودها حتى لا يتحسر على نفسه!!<br />وصحيح اعلب المصريين \"سبع صنايع والبخت ضايع\""
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103109/http://masr.20at.com:80/article.php?sid=1369"

[[comments]]
order = 6
subject = "هل من مذيد"
author = "خالد الحسيني"
posted = "2006-12-28"
text = "موضوع جميل و جديد بيلقى نظره عمليه تنقصنا للناس دي عايشه اذاي و بتعلم و بتتعلم اذاي و اظن ان اللي خلاهم او من الاسباب اللي مخلياهم متقدمين عننا هو نظام التعليم ياريت اذا كان حد من الاخوه عنده المذيد من تجارب التعليم في الخارج انه يعرفنا بيها على الاقل نبقى عارفين ايه اللي بيجرى حوالينا و اهو يبقى كويس لو حاولنا نقلد الناس دول في الامور الجاده و من اهمها التعليم بدل ما احنا كل تركيزنا اننا نقلدهم في الهلس و قلة الادب"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103109/http://masr.20at.com:80/article.php?sid=1369"

[[comments]]
order = 7
subject = "نحن فى مصر عالم رابع"
author = "نحن كنا زمان من 30 سنة عالم تانى الان اصبحنا عالم رابع"
posted = "2006-12-28"
text = "اصبحنا متخلفين تقنيا وفنيا بدرجة مريعة<br />ساقارن بين مصر وبين الهند فى القطارات كمثال<br />اذا ركبت قطارا مصريا وجدت شبابيكة مكسرة ومظلم ليلا والتراب يسد خياشيمك والقذارة تملا المكان<br />ملحوظة : استثنى قطارات السياح<br />وقطارات الشعب تسير بدون فرامل ولا اشارات وكلة اخر السطة ويموت كل سنة اعدادا لا باس بها من الشعب اللى ملوش لزمة<br />فى الهند مظهر القطارات من الخارج نظيفة وتدهن كل سنة مرة بالوان جذابة مش الجرب اللى على قطارتنا<br />فى الهند القطارات تعمل بالكمبيوتر ومجهزة باجهزة اتصال حديثة جدا<br />ولا يعتمدون على المعداوى الذى كان يوصل القطارات كما كان من 300 سنة والغيت حكاية السيمافورات من عندهم تماما<br />نحن فى القطارات لا زلنا فى بداية القرن الثامن عشر<br />انما ابث حزنى الى اللة فيما وصلنا الية"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103109/http://masr.20at.com:80/article.php?sid=1369"

[[comments]]
order = 8
subject = "يابقر شيعة ايه وسنة ايه..خيبكم الله"
author = "أحمد الدريني كاتب الموضوع"
posted = "2006-12-28"
text = "والله تعليقات تجيب الاحباط..يعني انت مشفتش في الموضوع كله غير انه قال انه واخد معاه نهج البلاغة؟ ثم ياعديم الفهم انت هو سيدنا علي بتاع الشيعة بس؟ ثم يامنحط المضمون هو نهج البلاغة منشور مذهبي ولا كتاب أدبي وأخلاقي؟ وياجاهل ده اللي انت شوفته في الموضوع؟ طب انا شيعي واللي عايز حاجة يتكلم..اتقوا الله واعملوا ليوم تقفون فيه امام الله..هذه أمتك ياسيدي يارسول الله..نحدثهم عن العلم..يقولون شيعي وسني..لن ألومك أكثر من هذا اذ يتبدي جليا أنك لست بعاقل فأخاطبك ولا حصيف فأفهمك..حسبي الله ونعم الوكيل..جتكم داهية"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103109/http://masr.20at.com:80/article.php?sid=1369"

