subject = "غريبة"
text = "فعلاً أنا محتار .. لماذا همشزا عرفات ورفضوا قتله .. أكيد قتله سيجر على أمريكا قبل إسرائيل مشاكل لا قبل لهما بها .. فالأجدى هو تهميشه سياسياً حتى تكون حياته مثل وفاته ..<br />سبحان الله .. هذا مصير من يختار طريق السلام الأعوج<br />لكن أنا أتمنى له ولنا الشهادة فهى رضا من الله سبحانه وتعالى علينا .."
