author = "بلاش هبل"
posted = "2009-12-08"
text = "يا جماعة بلاش هبل وعبط<br />حسني مبارك مش حيسيب الحكم<br />والحكومة هي التي حتعمل الانتخابات وهي اللي حتفرز الانتخابات وهي اللي حتعلن النتيجة<br />بلاش تضييع وقت وفلوس<br />الفلوس الي حتتصرف على الانتخابات الكاذبة والمزوره تتصرف على المرضى والايتام احسن"
archived = "2009-12-31"
capture_url = "https://web.archive.org/web/20091231170810/http://www.20at.com:80/masr/egyptian-blogs/14309-2009-12-08-13-00-46.html"

