posted = "2009-12-19"
text = "الحقيقة انا نفسى الاقى رد على سؤال محيرنى اوى هو البرادعى بيه عمل ايه لما امريكا قالت ان فيه نووى فى العراق طب وبعد ما دخلت امريكا العراق وملقتش نووى وبصفتو رئيس الوكالة الدولية للطاقة الذرية اتصرف ازاى وعمل ايه متهيألى لو عرفنا عمل ايه ممكن وقتها نعرف ممكن نختارو رئيس لينا ولا لا"
archived = "2009-12-31"
capture_url = "https://web.archive.org/web/20091231170810/http://www.20at.com:80/masr/egyptian-blogs/14309-2009-12-08-13-00-46.html"

