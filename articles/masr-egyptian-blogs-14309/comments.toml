subject = ""
author = "واحد من الشعب"
posted = "2009-12-15"
text = "هات واحد غير البرادعى معرف وله تأثير زى ما البرادعى هيكون ليه تأثير فى الناس<br />وانا اوفقك عليه<br />وبعدين انت بتتكلم عن البرادعى كانه واحد مش عايش فى مصر او اى من كوكب تانى وميعرفشى هو جاى منيني ورايح فين البرادعى فاهم كويس بيعمل ايه وهيعمل ايه وتابع تصريحته كويس"
archived = "2009-12-31"
capture_url = "https://web.archive.org/web/20091231170810/http://www.20at.com:80/masr/egyptian-blogs/14309-2009-12-08-13-00-46.html"

