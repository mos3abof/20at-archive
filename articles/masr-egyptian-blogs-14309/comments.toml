text = "بصراحه انا مع ترشيح البرادعى لانه جاى ومعاه خبرات اجنبيه على الاقل تنتشلنا من اللى احنا فيه وبشجعه انه يترشح ويارب يكسب ونشوف ايه الجديد بتاعه"
archived = "2009-12-31"
capture_url = "https://web.archive.org/web/20091231170810/http://www.20at.com:80/masr/egyptian-blogs/14309-2009-12-08-13-00-46.html"

