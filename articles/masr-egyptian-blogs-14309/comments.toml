author = "ممدوح زكى زخارى جرجس"
posted = "2009-12-15"
text = "اقسم باللة العظيم ان البرادعى حتى لا يستطيع اعالة و قيادة اى حمار؟<br />فكيف تطلبونة ليكون رئيسا للدولة و هو لا يعرف حتى قيادة نفسة او حتى قيادة \"حمار\"؟!!!!!!!<br />قرفتمونا بتفاهاتكم يا غجر؟"
archived = "2009-12-31"
capture_url = "https://web.archive.org/web/20091231170810/http://www.20at.com:80/masr/egyptian-blogs/14309-2009-12-08-13-00-46.html"

