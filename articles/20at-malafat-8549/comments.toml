text = "أولا.اللهم صلي وسلم وبارك على سيدنا محمد وعلى اله وصحبه وسلم ثانيا.بدي أشكركم على هذا الموضوع وأذكركم ببعض كلام الحبيب(صلى الله عليه وسلم) قال (صلى الله عليه وسلم)ألا أدلكم على شئ اذا فعلتموه تحاببتم قلوا بلى يا رسول الله ,قال. أفشوا السلام بينكم.واذكركم اخوتي في الله,اذا مر كل فرض منا على اخيه وألقى السلام,لانتشر الحب والوئام بين المسلمين ولترابطوا واتحدوا,واوصيكم بالصلاة على الرسول الكريم. وجزاكم الله خيرا."
