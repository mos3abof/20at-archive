subject = ""
author = "منال عاشور"
posted = "2008-03-19"
text = "بسم الله الرحمن الرحيم<br />هذا الكلام اعبر به عن غضبى واستيائي لمن اساؤوا إلى الرسول (ص)… منال عاشور<br />• اسمه الحبيب المصطفى<br />• اسمه محمد واحمد<br />• ومحمود و طه ويس<br />• هو الهادي الأمين<br />• خاتم النبيين<br />• المبعوث من رب العالمين<br />• قبل النبوة قالوا عليه الصادق الأمين<br />• وبعدها قالوا عليه<br />• شاعر كاهن مجنون<br />• كان لهم عذرهم<br />• كانوا خايفين على<br />• الحسب و النسب<br />• خايفين على هيبتهم<br />• بين العرب<br />• كانوا ضالين تايهين<br />• خايفين من الحق والعدل والمساواة<br />• خايفين من التوحيد والصلاة والزكاة<br />• خايفين من الرسول وكان عايش بينهم<br />• خايفين على نفسهم منه يفرقهم او يضعفهم<br />• وكان ده تفكيرهم<br />• وفى النهاية فكروا وتأملوا وأمنوا ووحدوا وجاهدوا<br />• ورفعوا الراية ونشروا الرسالة<br />• ومات الرسول الامين ومرت السنين<br />• ومرت السنين<br />• ورجع الغافلين الحاقدين<br />• اللى بالدين مش واعيين<br />• ولا بالإسلام أو المسلمين<br />• ماجورين وفى طريق<br />• الشر ماشيين<br />• بيكيدوا المكايد ويشككوا<br />• فى نبوته وحقدوا فى<br />• رسالته وديانته<br />• قالوا عليه راعى غنم<br />مش عارفين ان ده<br />• اول درس فى التواضع والكرم<br />• قالوا اتجوز من النساء<br />• عشرة مش عارفين ان<br />• كل مرة لها حكمة وعبرة<br />• قالوا عليه إرهابى<br />• لكنه كان قائد عظيم ومثالى<br />• قالوا نشر الاسلام بحد السيف<br />• كل ده زيف<br />• لكن الاسلام انتشر بالحب<br />• والتسامح انتشر ونشر<br />• المودة والرحمة والصدق والامانة<br />ارجو نشر كلامى"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620090947/http://www.20at.com:80/20at/malafat/8549-2009-04-14-13-22-50.html"

