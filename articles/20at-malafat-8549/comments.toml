posted = "2008-08-14"
text = "هاااااااااااااا ااي…كيفكن…اول شي ميرسي على هيدا الموضوع الحلو وانا بقول انه لازم الانسان يحاول يكون صادق مع نفسه يعني يحاول يشوف حاله من جوا ويروض حالو ويدربها على كل الصفات الحميدة الي اتصف فيها النبي الحبيب محمد عليه الصلاة والسلام لانه قدوتنا ومثلنا الاعلى في هيدي الحياة ولازم الواحد بين فترة وفترة يحاول يفرمت حالو اكتر وعلى طول يكون داعية لنشر صورة الاسلام الحلوة الي كلنا والحمد لله بنفتخر فيها واحلى شي انه الانسان فينا يحاول يبعد عن النفاق والرياء وتكون نيته في كل اعماله لله تعالى مو لاي هدف دنيوي تاني حتى ما يضيع اجرنا ومرة تانية بحب قول ميرسي كتير على هيدا الموضوع المهضوم …وهلا باي"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620090947/http://www.20at.com:80/20at/malafat/8549-2009-04-14-13-22-50.html"

