subject = ""
author = "doaa"
posted = "2009-12-05"
text = "اللهم صلي وسلم وبارك علي سيدي وحبيبي وقرة عيني محمد بن عبد الله رسول الله ونبيه<br />لم يكن شهوانيا ولم يكن مزواجا كانت كل زيجاته لحكمة او تشريع ديني ولو انها لم تكن كذلك فلم شرعها له الله<br />الله الحكيم العليم الخبير<br />يا اخت مروة اعتقد انك غير مسلمة لانه ما في حدا يحكي هيك وهو مسلم لانه الاية القرانية واضحة فيما معناها<br />ماكان لمؤمن ولامؤمنة اذا قضي الله ورسوله امرا ان تكون لهم الخيرة من امرهم<br />يعني واجب الطاعة التامة لله ولرسوله وده طبعا لثقة الانسان الكاملة بالله سبحانه وتعالي هو الذي اختار محمد صلي الله عليه وسلم ليبلغ رسالته<br />ومحمد عليه الصلاة والسلام لا ينطق عن الهوي ان هو الا وحي يوحي فما بالكم بافعاله بقي مش باقواله<br />ياريت بحياتك كلها لاتحكمي علي حد من مجرد اراء اعرفيه كويس اذا حي او اذا توفي اقري عنه من كاتب وجهة نظره محايدة مش هقولك منحازة له وفي كتير غير مسلمين اشادوا وتحدثوا عن عظمة الرسول الكريم محمد بن عبد الله<br />بعدين تقولي رايك"
