posted = "2009-09-17"
text = "انتبهوآ الله يجزاكم خير..<br />من أختصار [صلى الله عليه وسلم ]بـ [ص ]<br />لايجوز<br />المفتي : الشيخ عبدالعزيز بن باز<br />الجواب هذا لا ينبغي، قد نبهنا عليه غير مرة ونبه عليه العلماء فلا ينبغي ذلك، فأقل أحواله الكراهة الشديدة، بل يكتب الصلاة على النبي كاملة يقول: -صلى الله عليه وسلم- فلا يجعل (ص) ولا (صلعم) كل هذا لا ينبغي، ولهذا جاء في الحديث عنه- صلى الله عليه وسلم - قال: (من صلَّى علي واحدة صلى الله عليه بها عشراً) ومن كتبها كتابة يحرم هذا الخيرفينبغي لمن كتب شيئاً من ذلك أن يكتب كاملاً، أن يكتب الصلاة كاملة - صلى الله عليه وسلم"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003222610/http://www.20at.com:80/20at/malafat/8549-2009-04-14-13-22-50.html"

