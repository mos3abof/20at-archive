author = "ابن الاسلام"
posted = "2009-12-02"
text = "السلام عليكم ورحمة الله وبركاته<br />الحمد لله والصلاة والسلام على رسول الله صلى الله عليه وسلم وعلى آله الطيبين الطاهرين وعلى صحبه الكرام ابو بكر وعمر وعلى و عثمان ذا النورين وسائر الصحابه أجمعين<br />ومثلك لم ترى قط عينى ومثلك لم تلد النساء<br />ولدت مبرئآ من كل عيب كأنك خلقت كما تشاء<br />الصلاة التامة والسلام الكامل على الحبيب محمد بن عبد الله النبى الطاهر الامين الاغلى من الاب والام والروح والولد<br />الله انتقاه لانه اطهر الخلق ومن يقول الله فى حقه \" وإنك لعلى خلق عظيم \"<br />لايجوز بعدها كلام لان بعد كلام رب العالمين لا ينظر لكلام ولا يجد العقل الا الاحتقار لمثل هذة التفاهات ومن انتم فى عتاولة الكفر فقد قالوا عنه اشد من ذلك والله طهرة وعظمة وأظهره وجعل رايته فوق الرايات ولوائة يلوى كل لواء ومدرسته التى اسسها الحبيب محمد صلى الله عليه وسلم علمت العالم واسست الحضارة التى خرج بها الاخرين من الظلام الى النور وما كان الانسان انسان قبل النبى وما عرف حقيقة وجوده الا بعد النبى صلى الله عليه وسلم الذى ارسله ربنا تعالى ليخرج الناس من عبادة العباد لعبادة رب العباد ومن جور الاديان لنور الاسلام"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106132013/http://www.20at.com:80/20at/malafat/8549-2009-04-14-13-22-50.html"

