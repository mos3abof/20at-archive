[[comments]]
order = 17
subject = ""
author = "امة الله"
posted = "2009-12-15"
text = "السلام عليكم ورحمة الله وبركاته<br />السلام على امة محمد صلى الله عليه وسلم<br />الصلاة والسلام عليك ياحبيب الله<br />الصلاة والسلام عليك يانبي الله<br />الصلاة والسلام عليك ياخاتم النبين<br />الصلاة والسلام عليك ياأشرف المرسلين<br />ياحبيبي يامحمد عليك افضل الصلاة والتسليم<br />سامحنا ياحبيبنا سامحنا يانبينا سامحنا يااشرف خلق الله<br />لقد كتر الاعداء وكترة عليك الشبوهات من بشر ظله الطريق وختم على قلوبهم الشيطان<br />تناسه دينهم من اجل المال والسلطة واصبحه اصدق الاصدقاء لاعداء الله واعداء الاسلام والمسلمين ..<br />اتقى الله ياالمدعوة باسم مروة .. توبي الى الله توبة نصوحة واستغفري ربك لانك غلطة غلط كبير جدا في حبيب الله عز وجل ..<br />استحالة تكوني مسلمة لان اهم اركان الاسلام شهادة ان لا اله الا الله وان محمدا رسول الله ..<br />اكيد بتعرفي تقراي كويس (((( وان محمدا رسول الله ))))<br />حسبي ربي ونعم الوكيل في اعداء الاسلام والمسلمين<br />حسبي ربي في كل واحد ظلم نفسه وظلم امة من بعده ..<br />حسبي ربي في كل واحد تلفظ عليك بالباطل يارسول الله ..<br />حسبي ربي في كل واحد لم يشهد ان لا اله الا الله وان محمد رسول الله<br />والصلاة والسلام عليك ياحبيب الله .."
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106132013/http://www.20at.com:80/20at/malafat/8549-2009-04-14-13-22-50.html"

