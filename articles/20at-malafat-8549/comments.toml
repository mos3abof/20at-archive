[[comments]]
order = 25
subject = ""
author = "nora"
posted = "2009-12-19"
text = "يارييييت والله نصلى كلنا على الحبيب وعشان تتأكدوا هاحكى قصه روى عن محمد بن المنذر انه قال:سمعت ابى يقول:بينما سفيان الثورى يطوف اذا رأى رجلا لا يرفع قدما ولا يضع قدما الا وهو يصلى على النبى (ص)قال فقلت:ياهذا انك قد تركت التسبيح والتهليل وافبلت بالصلاه على انبى (ص)هل عندك فى هذا شئ؟ قال:م انت عافاك الله؟فقلت:انا سفيان الثورى قالكلو لا انك زاهد اهل زمانك…مااخبرتك عن حالى ولا اطلعتك على سرى…ثم قال لى:خرجت ووالدى حاجا الى بيت الله الحرام حتى اذا كنت فى بعض المنازل مرض والدى…فقمت بشأنه حت مت..فاسودوجهه..فقلت:انا لله وانا اليه راجعون..وغطيت وجهه…فغلبتنى عيناى فنمت حزينا،فرات رجلا لمار احسن منه وجها،ولا انظف منه ثوبا،ولا اطيب منه ريحا،يرفع قدما ويضع اخرى…حتى دنا من والدى فكشف الازار عن وجهه فم بيده على وجهه فابيض…ثم ولى راجعا فتعلقت بثوبه فقلت:ياعبد الله من انت الذى من الله على والدى بك فى اض الغربه؟!انا محمد بن عبد الله صاحب القرآن…اما ان والدك كان مسرفا على نفسه…ولكن كان يكثر الصلاه على فلما نزل به مانزل استغاث بى وانا غياث لمن اكثر الصلاه على فاذا وجه ابى قد ابيض…"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106132013/http://www.20at.com:80/20at/malafat/8549-2009-04-14-13-22-50.html"

