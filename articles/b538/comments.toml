[[comments]]
order = 6
subject = "أمريكا بلد الهنود"
author = "عابر القارات"
posted = "2006-03-08"
text = "يا أخوانا و الى المنخدعين بأمريكا ... الحضارة العظيمة المسماة أمريكا ما هى و بكل بساطه الا حثالة أوروبا و أفاقيها و مافيا المخدرات و الدعارة و الشركات المتضخمة كل هذه الحضارة الوهمية بنيت على عظام و رفات الهنود الحمر و الذى مات منهم مئات الالاف تحت اقدام المغتصبين فببساطه أكثر ما بنى على باطل فهو باطل و لذلك السبب أمريكا ترى فى أسرائيل شبابها و صباها و تشابه كبير فى النشأة فهل ينتظر أحد من هذه الدولة اللقيطة و أقصد بها أمريكا أن تجلب الحرية لأى بلد و ألا كان الاولى لها ان تجلب الحرية للسود أو للاقليات اللاتينية و الكاريبية و التى تعيش على ارضها و التى تعانى حتى هذا اليوم من التفرقة العنصرية بالرغم ما تتشدق به أمريكا من أنها أرض الحرية لكل مظلوم فهذا وهم قد عاتها امريكا و أوهمت به العالم بنفس طريقة تسويق الوجبات السريعة المميته و المسرطنه ... بالرغم من أجابى طول عمرى بالنموذج الامريكى و خصوصا كفاحه طول هذه السنوات من العمل الجاد و المتواصل لتصل ما وصلت أليه و لكن للاسف نظرتى لها لا تختلف عن نظرتى الان الى بلطجى مفتول العضلات بدون مبادئ أو أخلاق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113731/http://www.20at.com/article2.php?sid=538"

