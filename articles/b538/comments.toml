[[comments]]
order = 0
subject = "علي يدي"
author = "هبهوب"
posted = "2006-03-07"
text = "انا زهقت من الشرح لهم , بس المشككله مش فيهم لاسف فينا احنا دا غير ان الامريكان سذج وبيصدقوا اي حاجه والاعلام مبوط دماغهم . يلا ححاول مره تانيه .\" لجنه حقوق البشر احنا بشر عايشين عدلك ميزانه انكسر فين حق المظلومين \"."
archived = "2006-11-02"
