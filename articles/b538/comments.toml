subject = "فليمت الطواغيت واعوانهم بغيظهم"
author = "الحمدلله ، فقد اوشك نجم الطواغيت على الافول ، وماهي الا أيام قليلة حتى نرى صروحهم قد تهاوت ."
posted = "2006-03-08"
text = "والامر اليكم -يا شباب الاسلام- في بناء أوطانكم ، فكونوا عند مستوى الحدث ، واصنعوا التاريخ بايديكم-وما شباب لبنان عنكم ببعيد"
