[[comments]]
order = 1
subject = "أمريكا نجحت في العراق"
author = "من زعم أن أمريكا فشلت في العراق فهو يظهر أمريكا كداعية سلام وديمقراطية ، وهذا زيف ودجل."
posted = "2006-03-07"
text = "إن معظم الاهداف التى غزت أمريكا العراق من أجلها قد تحققت لها:<br />-أمريكا تريد تدمير جيش العراق (وقد حدث)<br />- أمريكا تريد تدمير بنية العراق التحتية والفوقية(النسيج الاجتماعي) (وقد حدث)<br />- أمريكا تريد موضع قدم لها في أرضنا الاسلاميةالعربية (وقد حدث)<br />-أمريكا تريد وضع يدها على نفط العراق (وقد حدث)<br />الذي لم يحدث حتى الان (والامر مناط بكم يا شباب الاسلام في افشاله وانجاحه) هو ايجاد حكومه عميلة تيسر لامريكا أعمالها في العراق تحت غطاء شرعي.<br />إذن أهداف غزو العراق تحققت وهذا الثمن جاء بنتيجه(للامركان بالطبع)<br />المطلوب -يا شباب الاسلام- أن تفشلوا خطط عدونا (أمريكا ) في بلادناالاسلامية ، ولا يكون هذا الا بزوال الطواغيت ،فليسقط ال سعود ، وليسقط حسنى مبارك ، وليسقط الاسد ، وليسقط خائن الاردن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113731/http://www.20at.com/article2.php?sid=538"

[[comments]]
order = 2
subject = "امريكا شيكا بيكا"
author = "نيفين"
posted = "2006-03-08"
text = "وجعتو قلبى يا عشرينات اكتر ما هو موجوع<br />من غير كل اللى كتبتوه و من غير الصور اللى مقدرتش اكملها و اللى بهرب منها على شاشات الجزيره اطمنو التاريخ معروف<br />و لما بننسى بيعيد نفسه و كانه بيطلع لنا لسانه و يقول انتو بتنسو بس انا فاكر<br />التاريخ فاكر و هيدين الكثيرون<br />حسبنا الله و نعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113731/http://www.20at.com/article2.php?sid=538"

[[comments]]
order = 3
subject = "اعترض وبشدة ؟"
author = "فى عالم جديد تموج فيها الشعارات الزائفة من التبجح بحقوق الانسان الى الراسمالية الحقيرة الى التاسلم وهم منينوبون عنا نحن المسلمون الفقراء بالتحدث باسمنا عنوة اعترض بشدة على ماجاء فى هذا المقال من الاستهزاء بالرئيس حسنى مبارك ووصفة بحكيم العرب استهزاءا والغريب ان هذا الموقع داب تحديدا من فترة على السخرية من رئيس جمهورية مصر العربية ؟؟؟"
posted = "2006-03-08"
text = "انا افهم ان يكون هناك اعتراض باحترام على اشياء نختلف مهة عليها اما الاستهزاء فهو شيى مرفوض وخصوصا ان الموقع اصبح يرتبط بفترة ليست ببعيدة بالمتاسلمين الذين يفرضون ارائهم بالقوة متخذين من الاسلام ستار كبيرا لاهواء بغيضة رائحتها تزكم الانوف<br />اما الارهابى الذى سب كل الرؤساء العرب باعتبار انهم جميعا طواغيت على حد تعبيرة فاقول لة اذهب بعيدا الى بلدك ولا تتحدث عن مصر ورئيسها فليست مصر مستباحا لكل العرب<br />واذا كنت مصريا متاسلما فاقول لك الظروف تغيرت ولن تعودوا تستطيعون ان تضحكوا على شعب مكافح كان يظنكم عونا لة فاذا بكم مجرمون لاتترعون عن التضحية بة لمكاسب شخصية تحت ستار الدين<br />فلتذهبوا للجحيم<br />اما انا وبلدى مصر فباذن اللة ساكون مع الاغلبية التى تعمل بكل حب وديمقراطية اسلامية حقيقية لتغيير اوضاعنا للافضل بدون سب الطواغيت بدون شعارات زائفة هدفنا هو رفعة شان مصر ومصر فقط<br />وليذهب الاخرون وانتم معهم الى الجحيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113731/http://www.20at.com/article2.php?sid=538"

