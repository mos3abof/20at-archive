[[comments]]
order = 1
subject = "كل الشعب المصرى مجنون"
author = "مصرى مجنون"
posted = "2006-05-29"
text = "حسب تصنيف الحكومة الذكية زكريا يعتبر الاخوان المسلمون مجانين لانهم بيعارضوا الحكومة وحركة كفاية مجانين وجميع الاحزاب مجانين وغالبية الشعب اللى بايع القضية مجانين وكل الصحفيين الى بيكتبوا وبيهاجموا الحكومة والريس مجانين ولاد مجانين كده نوصل للعدد 74 مليون و999 الف شخص مجنون والالف الباقى هو اللى عاقل جدا طبعا بيضم الريس واولاده وحكومتة من الوزراء والصحفى النكرة بتاع روزا اليوسف يعنى بالعربى كده الالف دول بيحكموا شعب مجنون علشان كده لازم يعملوا حسابهم لان حركات المجانين ملهاش مقدمات يعنى ممكن واحد مجنون يضرب ضربتة ويعملها ويخلص من الشلة اللى بتحكم بضربة واحده ومش هياخد فيكم يوم كلها كام شهر فى العباسية ونخلص ايه رأى كاتب المقال تعملها انت ولا نشوف مجنون غيرك ؟ انا طبعا لآ منفعش لانى زعيم المجانين"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222737/http://masr.20at.com:80/article.php?sid=382&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

