subject = "gratsia italia"
author = "نيفين نيفى نوفا"
posted = "2006-07-14"
text = "اد ما زعلانه من ان المونديال خلص و هترجع الايام زى الاول ممله اد ما فرحانه ان ايطاليا خدت الكاسو اللى بيقول ايطاليا متستحقش بقوله حرام عليك يمكن مش مباراه النهائى مش احلى مباريات ايطاليا لان مثلا مباراتها مع المانيا اقوى بس دا ميمنعش ان مارشيلو ليبى مدرب ممتاز و ان تيم ايطاليا رائع<br />يمكن اكون بقول كدا لانى نتعصبه للكوره الايطاليه بس دا رايى"
archived = "2007-12-08"
