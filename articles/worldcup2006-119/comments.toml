[[comments]]
order = 2
subject = "زيزو طلع لانو هذا الايطالي قال عنو ارهابي مسلم"
author = "زيزو"
posted = "2006-07-10"
text = "اصلا زيزو طلع لانو هذا الايطالي قال عنو ارهابي مسلم وامو *** وهاي كانت مؤامره مخططينها الايطاليين عشان يطلعو زيزو حبيبي من اللعبه ظلهم طول اللعبه يستفزو بي عشان يفقد اعصابو ويتصرف هيك وهذا منو تصرف طفولي ولا شي هذا دفاع لكرامتو وفرنسا هي بتظل الاحسن وهي الي بتستاهل الكاس وايطاليا اخذو كاسهم بالغش والخداااااااااااااااااااااااااااااااع وانا بظل اشجع فرنسا حتى لو خسر من اول لعبه الهم بظلني احبهم لانهم بلعبو احسن من الايطاليين بميه الف مره وبووووووووووووووووووز ايطاليا"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074156/http://worldcup2006.20at.com:80/article.php?sid=119"

[[comments]]
order = 3
subject = "ايطاليا المجرمة"
author = "medo80"
posted = "2006-07-10"
text = "ايطاليابلدالمافيا والمخدرات والدعارة والبلطجةوالعصابات ال كابونى وغيرهم ليس بغريب عليهم ان يستخدموا كل ماهو غير مشروع لنيل مجد لايستحقوه ...كل من شاهدوا المباراة يعلمون جيداان الفريق الايطالى مااستحق الفوز واعتمد على الغش والتمثيل وخداع الحكم الخبيث الذى تحيذ لهم اصلا ولم يحتسب للفرنسيين ضربة جزاء صحيحة اثر عرقلة امادو داخل منطقة الجزاء وكذلك سرعة اخراج الكروت للفرنسيين وصرامته معهم رغم انهم لم يعترضوا على قرارته الخاطئة ورغم رؤيته خشونة واستفزاز الايطاليين لهم ..ان من الواضح تماماظهور عنصرية الحكم فى هذة المباراة ضد الفرنسيين لسببين:اللون والديانة اذ ان اكثر من سبعة اشخاص فى المنتخب الفرنسى مسلمون ..زيدان وهنرى وربييرى وتورام وابدال وفييرا وربما تريزجيه وغيرهم...ان الفريق الايطالى كان يلعب باثنتى عشر لاعبا اذ كان معهم الحكم..ولكن الابطال هم الفرنسيين حقا وشكرا"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074156/http://worldcup2006.20at.com:80/article.php?sid=119"

