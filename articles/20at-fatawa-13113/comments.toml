text = "انا امارس العادة السرية منذ الصغر وابلغ من العمر الان 36عاما - اقلعت وامتن الله علي بالتوبة من قرابة اشهر -لم اكن اغتسل بعد ممارستها بل اكتفي بالوضؤ ثم الصلاة - كما كنت امارسها في نهار الصيام فرضا اونافلة- جهلا مني بالحكم في البداية وتهاونا بعد ان علمت بعض احكامها- مالواجب علي فعله -علما انني لا استطيع ان احصي الصلوات والصيام"
