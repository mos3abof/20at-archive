[[comments]]
order = 0
subject = "مايو.. مايو ... مايو ؟بأي حال عدت يا مايو ؟؟بما مضى أم بأمرفيك تجديد؟؟"
author = "محمد السيد"
posted = "2006-06-15"
text = "ياربي ...<br />يعني مش كفاية بلوة ميلاد سيادته في الشهر ده ...<br />كمان بيكملوها ...<br />ولا غريبة ليه .؟؟؟<br />بجملة البلاوي اللي بنشوفها من سيادته ....<br />مايو ..... رنبا يفك أسره وأسرنا من عمو وحكمه ...<br />وبرضه ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219115109/http://masr.20at.com:80/article.php?sid=524&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "اه يا بلد"
author = "ام العيال"
posted = "2006-06-17"
text = "لا بلاش الكلام دة .. مايو مش هوة بس اللي اسود دا كل ايامنا سودة وهببة ..<br />وكمان الشايب بيحتفل بعيد ميلادة ..اسمالله عليه..<br />يارب يموت علشان تحيا مصر<br />نموت نموت وتحيا مصر..<br />وسنة تعيسة عليك ياسيدي رئيس الجمهورية بحق كل واحد حزين في بلدنا"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219115109/http://masr.20at.com:80/article.php?sid=524&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

