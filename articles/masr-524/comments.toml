subject = "زمن الكوسة"
author = "ايمان محمد"
posted = "2006-06-18"
text = "حرام على السادة كبارات البلد اللى بيعملوة فينا دة .الشعب المصرى يستحق معاملة أحسن من كدة و مصر أكبر و أجمل من ان يتعمل فيها كدة. البلدمليانة ظلم و فساد ادارى و سياسى وبطالة وانتهاك الحريات العامة و ظلم للناس الغلابة و الاقليات"
archived = "2006-12-19"
