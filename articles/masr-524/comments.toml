[[comments]]
order = 3
subject = "نشوف يوم اسود فيك"
author = "واحد مصري مظلوم"
posted = "2006-06-18"
text = "ربنا ينتقم منك يا بعيد ونشوف عن قريب يوم اسود لسيادتك, ربنا يذلك زي صدام وولاده<br />يا حرامي<br />يا فاسد<br />ياعميل<br />يا مجرم في حق شعبك<br />يا ظالم<br />يلي كل الصفات الوسخة موجودة في سيادتك<br />اسف علي الوصلة ديه بس كان لازم افك عن نفسي بدل اما اروح افكها (بنقبلة ديناميت بشرية)<br />ارهابية علي راي النظام"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219115109/http://masr.20at.com:80/article.php?sid=524&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "لازم ثورة شعبية"
author = "مصرية"
posted = "2006-06-18"
text = "لازم كلنا نتحرك بسرعة قبل اما الحرامية الكلاب ينهبوا باقي ثروات الشعب<br />هما(النظام وزبانيتة) علي راي المتحدث كلاب بلدي جربانة ام بتجري منها تجري وراك واما تقف ليه وتتحداها تنبح وتجري منك<br />لازم الشعب يقوم,الفقراء ,والعاطلين,والمظلومين , كل دول لو قاموا مره واحدة سيغيروا الكثير ويزيحوا هذا السرطان من جسد الامة المنهج"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219115109/http://masr.20at.com:80/article.php?sid=524&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "العصر الاسود"
author = "العرافة"
posted = "2006-06-18"
text = "مرت مصر بحضارات مختلفة كثيرة تركت على التاريخ بصمة بدايةمن الحضارة المصرية القديمة الى الاسلامية مرورا بالرومانية والاغريقية والقبطية.....وها نحن الان نعيش الحاضر الاسود أو العصر الاسود الذى عرفنا فيه كل صنوف الذل والهوان واهدار الكرامة.... اللهم اذقهم من نفس الكأس حتى الغرق فيها وأجعلنا عليهم شهود"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219115109/http://masr.20at.com:80/article.php?sid=524&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

