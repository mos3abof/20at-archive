text = "شوف يا براء السجون والمعتقلات شيء اساسي في حياة الاخوان المسلمين لان ما فيش صعود سياسي من غير سجن والدليل على ذلك<br />نيلسون ما نديلا خرج من السجن الى كرسي الرئاسة<br />وسيدنا يوسف عليه السلام خرج من السجن الى كرسي الرئاسة<br />الاخوان المسلمين فاهمين الحته دي كويس اوي وانا سمعت تفسير سورة يوسف كاملة على المنبر وكان الخطيب الشيخ عبدالمتعال الجابري في مسجد ابو بكر الصديق في ميدان سانت فاتيما وكان المقصود من تفسير سورة سيدنا يوسف هو التأكيد على ان السجون جزء لا يتجزأ من استراتيجية الاخوان المسلمين حتى كمان الاخوان العاديين الذين فازوا بكراسي مجلس الشعب كلهم كان السجن سبب رئيسي في ترشيحهم وفوزهم<br />الاخوان المسلمين حزب سياسي لا علاقة له بالدين وان كانوا يريدون اقامة دولة اسلامية والمرشد العام لازم يكون هو الحاكم وجماعة قائمة على التكفير وانكار الاخر حتى كمان فيه حاجه اسمها عندهم عام الفيل الصغير بيعتبروا ميلاد جماعة الاخوان عام الفيل الصغير زي ما النبي ولد في عام الفيل جماعة الاخوان ميلادها سموه عام الفيل الصغير وهذا دليل دلالة قاطعة على عدم الاعتراف بالاخر<br />وبعدين حسن البنا لما جه يؤسس الجماعة مع الرعيل الاول اختار اسم الاخوان من الاية القرانية التي تقول<br />وكنتم على شفا حفرة من النار فانقذكم منها فاصبحتم بنعمته اخوانا<br />يعني بيعة حسن البنا انقاذ من النار يعني هي جماعتة مبنية على التكفير على حسب فهمي<br />يعني في وجود حسن البنا الازهر دا كله راح في ستين داهية لو ما بيعش حسن البنا<br />وحكاية تانية للاخوان<br />وبيتعاملوا مع الحكومة ـ اي حكومة ـ بقصة فرعون موسى ان فرعون وهامان وجنودهما كانوا خاطئين<br />يعني الحاكم فرعون وهامان معرفش وزير الداخلية ولا الدفاع وجنودهما اللي هما يمكن الامن المركزي<br />والمرشد العام هو سيدنا موسى والاخوان هما بنو اسرائيل<br />نريد ان نمن على الذين استضعفوا في الارض ونجعلهم ائمة ونجعلهم الوارشين<br />وَنُرِيَ فِرْعَوْنَ وَهَامَانَ وَجُنُودَهُمَا مِنْهُمْ مَا كَانُوا يَحْذَرُونَ.<br />المهم يا براء اني اكتشفت ان كل دا كلام فارغ والاخوان المسلمين دول هما خوارج هذا العصر وتاب الله على من تاب ورجعت الى دين الاباء والاجداد الا لو هي عقيدة اهل السنة والجماعة اطيعوا الله والرسول واولي الامر منكم والسمع والطاعة لولي الامر في المعروف والحمد لله<br />ونوجه نداء الى المرشد العام<br />ارجع الى عقيدة اهل السنه والجماعة وكفاية سجون ومعتقلات بقا<br />حرام الناس المسجونه دي تكون فاهمه ان السجن هو الجهاد الاكبر<br />والنساء اللي اجوازهم محبوسين دول يكونوا صابرات محتسبات<br />غلط كده يا فضيلة المرشد<br />ودتنا في داهية يا فضيلة المرشد<br />كفاية بقا 80 سنه يا فضيلة المرشد<br />معلش يا براء ابوك وجدك من الاخوان يا براء<br />ربنا معاك يا براء"
