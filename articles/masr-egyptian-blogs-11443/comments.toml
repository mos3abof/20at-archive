text = "تصورا قرات التعليق الاول و لسا هعمل اقتباس علشان ارد عليه لقيت التانى و الثالث و …<br />قلت خلاص مش معلق على التعليقات اصل الى عاوز يهاجم حد و يحرف كلام هيعرف<br />وبكل بساطه<br />الاخوان لكفروا حد و لا قالوا احدنا جماعه المسلمين و البرنا مفارق للجماعه<br />و اصلا انا كنت عاوز اعلق على الموضوع و لما قرأت التعليقات نسيت تعلقى<br />يلا ربنا يهدينى و يسامحكم"
