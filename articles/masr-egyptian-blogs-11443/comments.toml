text = "مهما قالوا<br />لسنا طلاب حكم<br />ولسنا طلاب سلطة<br />ولا نكفر أحدا<br />وحسبنا الله ونعم الوكيل<br />نريد أن يحكم الإسلام<br />لا أن نحكم نحن<br />ويا من تعيشون حياة رغيدة في ظل التكيفات وما لذ وطاب<br />وتدعون أنكم دعاة للإسلام<br />فانظروا إلا إخوانكم الذين عذبوا في السجون ومازالوا<br />لإعلاء كلمة لا إله إلا الله لا أكثر<br />وحسبنا الله ونعم الوكيل"
