text = "اقرؤوا الفقره دي من موقع اخوان اون لاين<br />** العبد الفقير إلى الله علي نويتو من مواليد عام الفيل الصغير وإن شئت قل عام 1928م ميلاد دعوة الإخوان المسلمين،<br />ودا معناه تكفير المجتمع<br />زي ما قال المرشد حسن البنا عندما سما المولود الجديد بالاخوان المسلمين<br />وكنتم على شفا حفرة من النار فانقذكم منها فاصبحتم بنعمته اخوانا<br />فاهمين الكلام<br />وكنتم على شفا حفرة من النار فانقذكم منها فاصبحتم بنعمته اخوانا<br />يعني اللي دخل الاخوان قد نجا من النار<br />يعني شبهه دعوة الاخوان بدعوة النبي محمد صلى الله عليه وسلم اللي يدخل فيها نجا واللي ما دخلش فيها هلك<br />ما هو المفهوم من الاية كده<br />وانت اصبت فمن الله وان اخطأت فمن نفسي واعوذ بالله من ذلك"
