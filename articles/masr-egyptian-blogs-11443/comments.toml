text = "رقم الجلوس 11674<br />اســـــــم الطــــالــــــ ـــــب البراء أشرف جابر رزق<br />مادة اعلامية بلغة اوروبية مقبول<br />تاريخ اوربا الحديث والمعاصر مقبول<br />تحرير المقال الصحفى مقبول<br />أخلاقيات الاعلام جيد<br />اعلام متخصص مقبول<br />الصحافة الادبية مقبول<br />مناهج البحث فى الاعلام مقبول<br />غن تحرير المجلة جيد جدا<br />الإعلآم الدولى جيد<br />الإعلآم العربى جيد جدا<br />قاعة بحث وكتابة مقبول<br />بحث متخصص مقبول<br />مادة أختيارية مقبول<br />الإعلام البيئى مقبول<br />تاريخ مصر الحديث والمعاصر ضعيف جدا"
