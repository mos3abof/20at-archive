text = "عشرين سنه عايش مأساه بسبب قلة ضمائرهم وغشهم والتواطأ على حساب موكليهم الله يخرب بيوتهم قولوا معايه آمين؟؟؟؟؟؟؟ وحسبى الله ونعم الوكيل فيهم وربنا مايبارك لهم لا فى مالهم ولا عيالهم وكمان مره قولوا آمين"
