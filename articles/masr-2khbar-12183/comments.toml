text = "(الدعارة مهنة أصبحت أشرف من مهنة المحاماة)<br />أتفوا عليكم يا حثالة ما خلق اللة<br />الغانية تبيع جسدها مقابل المتعة الحرام<br />أما انتم يا حثالة البشرية فانتم تبيعوا العدالة مقابل من يدف و يشترى ضمائركم يا عديمى الذمة و الضمير"
