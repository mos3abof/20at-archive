[[comments]]
order = 1
subject = ""
author = "kim"
posted = "2009-06-29"
text = "فعلا الحكومه بتدلعنا<br />اصل الحكومه بتصرف علينا من جيب ابوها وبعدين خلفه ايه اللي بتقول عليها هو في حد بيتجوز علشان يخلف وبعدين هي ايران دلوقتي خلاص بقت دوله اسلاميه ما كنتم بتشتمو فيها من كام شهر وبتعتقلو كل الناس اللي ليهم علاقه بحسب الله الشيعي<br />وازاي اصلا ايران الشيعه اللي بيشتمو الصحابه وزوجات النبي يبقو دوله اسلاميه وعاوزانا نقلدهم"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062957/http://www.20at.com:80/masr/2khbar/12505-2009-06-29-07-18-13.html"

[[comments]]
order = 2
subject = ""
author = "الست مشيرة"
posted = "2009-06-29"
text = "الست مشيرة هانم<br />ممكن نعرف مين هو الكوافير بتاعك<br />وبالمناسبة مرتبك كام<br />ومن هو زوجك والا انت عانس او ارملة<br />ربنا يهدى سرك يا بنتى"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062957/http://www.20at.com:80/masr/2khbar/12505-2009-06-29-07-18-13.html"

[[comments]]
order = 3
subject = ""
author = "بوس الواوا"
posted = "2009-06-29"
text = "والحكومة بتدلع الشعب ازاى يعنى - بطوابير العيش والا القمح المسرطن والا البطالة الخانقة والمعاش المبكر<br />ازاى الحكومة بتدلع الشعب - بالتعليم المنهار والا الصحة المعدومة<br />الحكومة بتدلع الشعب بالاوبئة والطاعون وانفلونزا الطيور والخنازير<br />الحكومة بتدلع الشعب ب 9 ملايين عانس و9 ملايين مصرى مصاب بفيروس الكبد سى<br />الحكومة بتلع الشعب وجايبينك علشان تبوسى الواوا"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062957/http://www.20at.com:80/masr/2khbar/12505-2009-06-29-07-18-13.html"

[[comments]]
order = 4
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-06-29"
text = "للاسف حكومة ضعيفة لم تستطع تعليم الشعب كيف يعيس كانسان؟<br />حكومة ضعيفة تسيسس القوانينو هذا ادى الى التراخى فى تنفيذ القانون<br />وبالتلى فساد تفكير و عقل الشعب الذى يجب ان يقوم بيد من حديح و نار<br />و اللة المستعان"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062957/http://www.20at.com:80/masr/2khbar/12505-2009-06-29-07-18-13.html"

