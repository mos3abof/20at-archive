[[comments]]
order = 6
subject = ""
author = "مشيرة يا مشيرة"
posted = "2009-06-29"
text = "مشيرة بنت ام مشيرة بتقول فى اول جملة ان موارد الدولة محدودة وان الحل اننا نبطل خلف عيال ونموت نصف الموجودين بالقمح الفاسد والمسرطن<br />سؤال للست مشيرة هانم اية اللى جعل موارد الدولة محدودة مش النظام الفاشل اللى باع مصانع الاسمنت والاسمدة والمشروبات والمصانع الغذائية والفنادق السياحية وغيرها وغيرها والتى كانت تغذى الخزينة المصرية بالموارد والمليارات<br />النظام الذى باع كل مقومات الدولة بتهمة الخصخصة واصبح بلا موارد<br />قلة موارد الدولة سببها النظام الفاشل<br />كم مليار جنية تكسبها شركات المحمول وتحول الى بنوك اوروبا عند سواريس وغيرة<br />ماذا لو كانت شركات المحمول ملك الدولة<br />الست مشيرة انت ونظامك فاشلون"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062957/http://www.20at.com:80/masr/2khbar/12505-2009-06-29-07-18-13.html"
