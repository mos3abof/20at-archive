[[comments]]
order = 16
subject = "اولمرت طيب"
author = "مبارك قال اولمرت راجل طيب وهو لما يقول عنه طيب يبقى طيب"
posted = "2007-02-07"
text = "الدكتور خيرت الشاطر الرجل التقى الكفء راجل فلوسه محتاجة غسيل ومكوى ومنتمى لجماعة الإخوان المسلمين !!<br />اولمرت كان بيحصد فى الفلسطينيين ومبارك بيقول عليه طيب<br />مبارك زور الإنتخابات وفلوسه كلها من دم المصريين المنهوبة وولاده فلوسهم كلها من النهب والإستيلاء على المشاريع من أصحابها والفساد يعنى بالعقل واحد كان موظف بنك يملك كل هذه المليارات فى الفترة البسيطة دى يبقى جاب فلوسه منين وتبقى فولسه عايزه غسيل طبعاً<br />مبارك بيخرف وغير شرعى فى الحكم"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209061730/http://masr.20at.com:80/article.php?sid=1553"

[[comments]]
order = 17
subject = "عكنون المتعكنن"
author = "اهلاوي"
posted = "2007-02-07"
text = "لم انت مش عاجبك الموقع ولا اللى فيه وبتقول انه موقع للاخوان المسلمين بتدخلوا ليه ياكسمك , هو اللى الخولات اللى زيك هم اللى هيودا البلد فى داهية , هو انت قارفناعلى موقع العربية وهتيجى هنا كمان تتفلسف , ام انك عكنون ابن وسخة صحيح , عكننتنى الهى يعكننوا امك على المساء ."
