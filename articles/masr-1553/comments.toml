[[comments]]
order = 2
subject = "الشاطر و جمال مبارك"
author = "أحمد بلال"
posted = "2007-02-07"
text = "بالطبع أرفض تحويل المواطن العادي لمحاكمة عسكرية, فإن كان الشاطر قد أخطأفيجب أن تتم محاكمته أمام قاضيه الطبيعي محاكمة عادلة<br />أما عن مسألة أن ذلك تمهيدا لصفقة سياسية مع النظام فأعتقد أيضا أن الطريقة الوحيدة لنفي ذلك من قبل الجماعة هي التحرك الجماهيري للضغط على النظام للافراج عن الشاطر<br />فالجماعة كما تقول و كما يقول الكثيرون هي أكبر قوى سياسية موجودة في مصر<br />و من ثم فإن التحرك الجماهيري الذي يعلن رفض الجماعة لاعتقال بعض قياداتها هو من وجهة نظري الطريقة الوحيدة لإقصاء شبهة الصفقة السياسية و التي يدور الحديث عنها بأنها صفقة التوريث"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209061730/http://masr.20at.com:80/article.php?sid=1553"

