[[comments]]
order = 4
subject = "الابيض والاسود"
author = "ياء"
posted = "2007-02-07"
text = "هناك فرق بين من يرتدى اللون الابيض وبين من يرتدى اللون الاسود<br />اكتر حاجه بكرها فى حياتى اللون الاسود<br />سعات ينزل على قلوب الناس وعقولهم يخليهم طغاه<br />صلاح جاهين ليه رباعيه بتقول<br />فتحت شباكى لشمس الصباح<br />مادخلش منه غير عويل الرياح<br />وفتحت قلبى عشان ابوح بالالم<br />ما خرجش منه غير محبه وسماح<br />اهو الاخوان كده<br />النهارده لما مكتب الارشاد اعلن ان برنامج الحزب المدنى حيصدر خلال الشهر الحالى اتحول الاخوان اللى افرج عنهم القضاء الى محاكم عسكريه<br />حسبى الله ونعم الوكيل ... نعم المولى ونعم النصير<br />انا كل يوم اسمع ... فلان عذبوه<br />اسرح فى بغداد والجزاير واتوه<br />ما اعجبش م اللى يطيق بجسمه العذاب<br />واعجب من اللى يطيق يعذب اخوه<br />وعجبى<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/<br />لا مواخذه يا جوليت مينفعش ابقا روميو ممكن تقبلينى عنتر"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209061730/http://masr.20at.com:80/article.php?sid=1553"

[[comments]]
order = 5
subject = "تغطيه سريعه وممتازه ... وكلمه لمن يسب الاخوان بدون داع !"
author = "شريف الدواخلى"
posted = "2007-02-07"
text = "التحقيق جميل قوى وفى شغل صحافة حلو .. بس الاحلى أنه كان سريع جدا .. يعنى الجرايد لسه هاتتكلم عن الخبر وديه حاجة تحسب لكاتب الموضوع<br />وبالنسبة بقى لموضوع تحويل الشاطر لمحكه عسكريه فهو كارثه \" يعنى طلعت السادات قلنا ماشى أهو اسمه شاط فى الجيش انما الراجل ده عمل ايه ولا خلاص المحاكم العسكريه صارت المنوطه بمحاكمه المدنين \"<br />وادى دقنى لو الشاطر عرف ياخد منهم حق ولا باطل وبعدين ايه علاقه الاخوان بغسيل الاموال \" الحكومة تعلم جيدا من هم حيتان غسيل الاموال فى مصر وبالاسم \"<br />وليا كلمه اخيره لمن يسبون الاخوان اعترف فيها بدايه ان الاسلام هو الحل والاخوان هم المشكله .. و الاخوان فيهم الكثير من المثالب ويكفى مبدأ الطاعه العمياء \" كل الكلام ده تمام \" بس هو وقت الكلام ده يعنى الوفد يكون فى مشاكل ونيجى نقول الليبراليه فيها كل العبر \" ازاى \" بس الاخوان \" حتى لو كانوا يلعبون دور المستضعف \" فهم ضحيه لنظام سفاح علم انهم اخطر ما يهدد استبداده و قهره ومن ثم فيحاول القضاء عليهم ولكن هيهات \" اذا كان الملعون عبد الناصر بكل عنجهيته وجبروته لم يفلح فى ذلك ! \"<br />ولذا فلابد ان نعلم ان الدائره ستدور على كل اطياف المعارضه وانما الاخوان هم البدايه لانهم \" شئنا ام ابينا \" اقوى فصيل معارضه .."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209061730/http://masr.20at.com:80/article.php?sid=1553"

[[comments]]
order = 6
subject = "نداء عاجل الى فضيلة المرشد"
author = "يرجى التكرم بسحب اعضاء الجماعة من مجلس الشعب وهذا اقل شيء يجب ان تفعله للتهدئة لان فيه ناس كتيرة حتروح في الرجلين مش الاخوان بس"
posted = "2007-02-07"
text = "وكفاية سجون<br />كفاية معتقلات<br />كفاية امن دولة<br />كفاية تعذيب<br />كفاية محاكم عسكرية<br />كفاية ترويع امنين<br />كفاية كفاية كفاية ارحمنا بأه يا اخي<br />ارجوك اسحب اعضاء الجماعة من مجلس الشعب فورا.<br />وقل اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء<br />يا اخي دا سيدنا الحسين بجلالة قدره فشل في تغيير الحكم"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209061730/http://masr.20at.com:80/article.php?sid=1553"

