[[comments]]
order = 9
subject = "التوريث مرفوض"
author = "الدشم"
posted = "2007-02-07"
text = "واضح إن النظام الشايخ إللى بيحكم مصر أصابة الجنون فلم يعد يميز الفرق بين من يحاكم أمام المحكمة المدنية أوالعسكرية ولكن الحل هو رفض الشعب لكل المحاكمة ونحن نعلم جميعاً أنها تهم ملفقة وأن الشاطر من أكفء الكفاءات ولكنه تصفية للإخوان المسلمين والصمت على الفساد فساد فيجب أن يتحرك الشعب كله ويحطم المعتقلات التى بها خيرة شباب مصر ولكن مبارك يريد أن يصلح مصر بنظام فيكو أنا وإبنى ومراتى وحاشيتى لا أخفيكوا يا كل الشعب<br />الحل عند الشعب بقيادة الإخوان المسلمين ولا يوجد حل بديل<br />لابد من عقاب مبارك على قتله السادات أسوة بصدام حسين وأسوة بالمحكمة الدولية فى لبنان<br />لابد من عقاب مبارك على تزوير الإنتخابات وعدم شرعيته فى الحكم<br />لا بد من عقاب مبارك على نهبه وبيع المصانع والشركات ويسأل من أين له ولأبنائة بهذه المليارات<br />لابد من عقاب مبارك على ما وصلت له مصر من تدنى وخنوع<br />لابد من عقاب مبارك على عمالته لليهود والأمريكان<br />لابد من محاسبة مبارك على إيرادات مصر من قناة السويس والبترول والغاز الطبيعى والسياحة<br />لا بد أن يعاقب مبارك على إبادة الشعب المصرى العريق وإذلاله<br />حسبى الله ونعم الوكيل فى الظالم الطاغية الدكتاتور الحرامى مبارك وعائلته"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209061730/http://masr.20at.com:80/article.php?sid=1553"

[[comments]]
order = 10
subject = "الى الاخ اللي فوق"
author = "كل الكلام اللي انت قلته كلام فارغ"
posted = "2007-02-07"
text = "وبالنسبة لعنوان كلامك الفارغ التوريث مرفوق<br />بالنسبة لينا كعرب ومسلمين منذ قديم الازل ومنذ مطلع فجر الاسلام الاول وتحديدا مع بدء حكم معاوية ابن ابي سفيان بدأت عملية التوريث يعني كل حاكم بيعين ولي عهد سواء كان ابنه او اخوه او اي حد من اقاربه واستقر الامر في الدول الاسلاميةوالعربية على ذلك حتى في مصر منذ قديم الازل والامر مستقر على ذلك.<br />حتى كمان جمال عبدالناصر عين السادات نائب رئيس جمهورية وهو الاسم الدلع لولي عهد البلاد وعين السادات مبارك نائب رئيس الجمهورية وولي عهد ايضا.<br />وبناء عليه حسني مبارك له مطلق الحرية في تعيين من يخلفه وهذا رايي بناء على الادلة التاريخية المطروحة عاليه"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209061730/http://masr.20at.com:80/article.php?sid=1553"

[[comments]]
order = 11
subject = "لن يستمر الوضع"
author = "كان مبارك يعتمد على الموالين له من الأمريكان واليهود والسعودية ولكن موالات هؤلاء لم يعد لها القوة بعد أن أصبح عبء كبير عليهم ولم يعد يصلح ليقدم لهم المزيد ويوجد لهم مؤيدين أكثر فاعلية منه الآن فبدأ مبارك يشعر بضعفه وبفقد تأثيره على الوصول لتوريث الحكم مما جعله يبطش بأكبر معارضة تحظى بشعبيه هائله وهم الأخوان المسلمين فالخوف أن يكون لهم حزب يظهر فساد وينافس الحزب الوطنى الذى يعلم عاملة الشعب فساد أعضاءه من تجار المخدرات ونواب القروض والمزورين وتجار الفساد ومحتكرى السلع وناهبى خيرات مصر"
posted = "2007-02-07"
text = "هناك مثل شعبى يقول<br />أشتم الأحبه تلهيك وإللى فيها تجيبه فيك هذا ما يفعله نظام مبارك وعائلته الفاسدة"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209061730/http://masr.20at.com:80/article.php?sid=1553"

[[comments]]
order = 12
subject = "اخبطوا دماغكو فى الحيط"
author = "عكنون"
posted = "2007-02-07"
text = "الى كل الاخوه اللى بينتقدوا الاخوان<br />متحاولوش ...<br />ده موقع بيدعو للاخوان بس بصوره غير مباشره وكل اللى بيعلقوا اخوانجيه وانتو عارفين الناس دى لما بيسيطروا على عقول الشباب ممكن الواحد فيهم يموت نفسه ومعاه شويه مواطنين ابرياء من ابناء بلده وفاكر انه بيستشهد وعلى الجنه حدف - ويبقى يقابلنى - فخلاص الناس دى بيبقى دماغهم خربت خلاص لان القيادات دى بتعرف مين اللى تختاره و ازاى.<br />انا بدخل الموقع المهبب ده من باب الفرجه بس و للعلم بالشىء ومابردش فى التعليقات ولا الزفت بس صعب على اللى عمالين يقاوحو معاهم و يجادلوهم بتكلموا فى مين يا جدعان انتو عاملين زى اللى بيحاول يكسر الحيطه بدماغه."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209061730/http://masr.20at.com:80/article.php?sid=1553"

