[[comments]]
order = 18
subject = "لك الله يا دعوة الخالدين .. لقد اوشك البغي ان يهمدا"
author = "فدوى خالد"
posted = "2007-02-07"
text = "نشرنا دمانا الذكية نورا تضئ الظلام ويجنوا الهدي ففي كل قطر لنا شهداء تعيث الحراب والمدى ومن كان اكرم منا عطاءا ومن كان ابيض منا يدا ..<br />لكي الله يا دعوة الخالدين ..<br />ولا اقول سوى حسبنا الله ونعم الوكيل<br />ليس اليوم موعدنا ولكن هناك امام الواحد القهار ليعلم كل منكم انه ليس مننا جبناء ولا من يهرب امام الحق الله اسال لكم التماس طريق الحق .."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209061730/http://masr.20at.com:80/article.php?sid=1553"

[[comments]]
order = 19
subject = "حيا اللة ؟"
author = "حيا اللة شباب مصر الاتقياء حيا اللة شباب الاخوان المسلمين"
posted = "2007-02-08"
text = "الحين ثورة الاسلام الكبرى تبدا من مصر<br />ياشباب الاخوان متل ماقلنا انتم الدم ونحنا لن نبخل معكم بالمال واخر شيك انصرف وقريب بحول اللة شيك اخر ب8 مليون ريال سعودى<br />ابذلوا بذلوا ولاتخافون<br />انتم لستم اقل من المجاهد الشيخ اسامة<br />وفقم اللة وسدد رميكم"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209061730/http://masr.20at.com:80/article.php?sid=1553"

[[comments]]
order = 20
subject = "إلى إدارة الموقع الكريم"
author = "هادى الحبشى"
posted = "2007-02-11"
text = "إلى إدارة الموقع الكريم<br />نرجوا إتاحة الفرصة والتعبير الصادق عن كل المعارضة فإنتم تهاجمون المعارضة فى الوقت الذى تفسحون فيه الفرصة كاملة للحزب الوطنى ولمبارك وإبنه<br />نرجوا تطهير الموقع من اللينكات القذرة التى تضيفها واحدة عجزت عن فرض سطوتها على الموقع فتحاول إلهاء الشباب بهذا الفساد الحقير وهذه السياسة البلهاء<br />نرجوا إتاحة الفرصة لكل المعارضة للتعبير عن أرائها فى هذا الموقع المحبب لنا كشباب والذى نجد فيه فرصة للتعبير عن رفضنا للفساد<br />نرجوا عدم الهجوم على الإخوان المسلمين حيث أنهم المعارضة الأكثر تأييداً من الشباب"
archived = "2007-02-16"
