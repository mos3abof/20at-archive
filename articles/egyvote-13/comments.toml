[[comments]]
order = 0
subject = "لمتى ندفن رؤوسنا فى الرمال"
author = "كمال مختار"
posted = "2005-11-16"
text = "اسادة الجميع يعرف أن السرطان قد أكل وشبع فى جسد القضاء ويصرون على أن القضاء شامخ وأن ليس به شائبة كالمريض الذى يخشى أن يذهب للكشف حتى لا يخبره الطبيب بالحقيقة مع أنه متأكد من مرضه ..<br />ياسادة لقد شاهدت بعين رأسى ما تشيب الغلمان من أفعال يقوم بها قضاءة رؤساء لجان أن بهم من أكثر عهراً من مومسات لبنان أفيقوا لقد نخر الفساد بجسد القضاء كما فى باقى المجالات أفيقوا ..."
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813233135/http://egyvote.20at.com:80/article.php?sid=13"

[[comments]]
order = 1
subject = "الفقر وحش"
author = "سمسمة"
posted = "2005-11-19"
text = "الله يا جماعة الفقر وحش والناس فعلا محتاجة انا شفت بعيني ناس مش لاقية تاكل وبتلم من الزبالة لو حد شاور لها بعشرين جنيه ما تديلوش صوتها ليه خصوصا لو كان صوتها طول عمره ما يساويش حاجة انا من رايي نوفر للمواطن العيشة الكريمة الاول وبعدين نحاسبه"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813233135/http://egyvote.20at.com:80/article.php?sid=13"

