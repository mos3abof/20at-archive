[[comments]]
order = 4
subject = "سوف تحاسبون"
author = "مستاء من آل مبارك"
posted = "2005-12-23"
text = "طالب بلإنتخابات تحت إشراف الأمم المتحدة ولجنة مشكلة من الأحزاب المحترمة والقوى الفاعلة فى المجتمع للإشراف على الإنتخابات ولا يوضع فيها أى وزير من حكومات الحزب الوطنى ممكن نوجد ( كمال الشاذلى ) أمام باب اللجنة لينبح ويخوف الزائرين الغير مرغوب فيهم لأنه ممكن يتشكل على أى وضع"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813233135/http://egyvote.20at.com:80/article.php?sid=13"
