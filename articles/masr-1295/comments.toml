[[comments]]
order = 1
subject = "المناصب"
author = "حبيبه"
posted = "2006-12-13"
text = "بالرغم ان لا اعرف عن حركة كفاية غير انها من اجل تغيير الجمود فيمصر وهي حركة وليست حزب وتجمع مختلف الاتجهات ماحدش ينكر انها كسبت نجاح كبير مش مهم عدد اعضاءها كام والا هم مين المهم كم عدد المؤمنون بها كفاية اضبحت علي لسان المصريين كفاية ظلم كفاية سرقة كفاية فساد كفاية قمع كفاية تعذيب والخ 000 اعتقد ان ده شيء كويس اننا نبدا نتكلم و نعترض في راي الشخصي ان اللي انسحبوا كان علشان حكاية البيان عن الحجاب و علشان ان بعضهم عايز يظهر اعلاميا وده لا يؤثر علي الحركة مش مهم الاشخاص كفاية بقي الفردية والشخصنة وعموما انا مش مقتنعة بكلام اللي انسحبوا"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190824/http://masr.20at.com:80/article.php?sid=1295"

[[comments]]
order = 2
subject = "تصور تاني ...."
author = "إبن بهيه"
posted = "2006-12-13"
text = "أعتقد كفاية .. كفاية بقى سيبوها في حالها أحسن للجميع .. لا تنبشوا في الرماد .. كفاية بدأت حركة وطنية راشدة بها كل التيارات من أولاد بهيه .. وسعدنا بها كلنا تقريباً سواء من سارع واشترك بها مثل العبد لله أو من أيدها وجدانياً بحبة تنهدات كلما رأى شعارها أو شاهد أفرادها يضربون بالجزم من بوبيهات الأمن .. اسمحوا لي أن أبتعد قليلاً عن بعض رموز كفايه وميولهم الأمريكانية لأسلك منحى آخر لا يبعد كثيرا عن هنا وربما يلتقيان في النهاية باعتبار أن حكومتنا بجلالة قدرها ومقدارها وجبروتها ورئيسها الواطي مجرد لعبة أمريكية تافهة.<br />طبعاً زخم الحركة التي ضمت عناصر من كل تيارات الوطن كان أمراً مقلقاً لنظام مبارك الواطي ، وربما تفتق ذهن زبانية مبارك وأتباعه في جهنم قريباً بإذن الله .. (جهنم الدنيا وجهنم الآخرة .. أو جهنم الشعب وجهنم الرب) عن حركة أمريكاني تمكنهم من تفسيخ الحركة وبخاصة أنها ولدت قابلة للتفسخ أصلاً بسبب جهل .. نعم جهل .. وأنانية بعض مدعي الثقافة ممن يولون أمورهم الخاصة أهمية قصوى ثم من بعدها ما يخدم هذه الأمور الخاصة كولائهم للتيار ثم من بعدها ولائهم للقمة العيش ، ثم نمره عشره ولائهم للوطن .. للأسف هذا حال كثير إن لم يكن أغلب مثقفي هذا الزمان البطيخي سواء يسار ، يمين ، فوق ، تحت ، شرق ، غرب .. صح ولا غلط ؟<br />طبعاً ده أحد أهم أسباب مولد الحركة متصدعه برغم عمق يقين المؤسسين بمصيبة جهل المثقفين الذي ذكرناه ، لكنه لم يمنع ظهور الشروخ في الوليد .. أما الحركة الأمريكاني فهي معروفة .. الفولوس .. فوولوووس يا عم .. لشباب غلابه مش لاقيين العيش ولا العيشه حتى .. إحنا بقينا عايشين في عصر سمسره حقير .. أكاد أجزم بأنه أسوأ وأسود وأقبح وأقذر وأوسخ عصر مرت به مصر في تاريخها من قبل توحيد القطرين بق<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190824/http://masr.20at.com:80/article.php?sid=1295"

[[comments]]
order = 3
subject = "تفاهم"
author = "أحمد مطر"
posted = "2006-12-14"
text = "علاقتي بحاكمي<br />ليس لها نظير<br />تبدأ تم تنتهي ..<br />براحة الضمير<br />متفقان دائماً<br />لكننا<br />لو وقع الخلاف فيما بيننا<br />نحسمه في جدل قصير<br />أنا أقول كلمة<br />وهو يقول كلمة<br />وإنه من بعد أن يقولها ...<br />يسير<br />وإنني من بعد أن أقولها ...<br />أسير !"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190824/http://masr.20at.com:80/article.php?sid=1295"
