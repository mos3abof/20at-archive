subject = "المنحوس منوس حتى لو علقولو فانوس"
author = "sara"
posted = "2006-04-27"
text = "حلو أوى اللى انتى كتباه ياسوسة يا مفروسة بجد جميل بس محدش عايز فيلم لحياة الرئيس إن الله حليم ستار لو اتعملت قصة حياته على الحقيقة هيتفضح فضيحة ام الطاهر يوم طلوعه على المعاش فبلاش بس انا عايزة اوجه سؤال للاخ نمر من ورق هو عامل حاجة لو هتقول انك طول عمرك بتكره مبارك بس تقدر تقول على التلفزيون انك تكره بعدين يعنى انت اكيد عارف انى الشعب المصرى مجامل للرئيس امام التلفزيون بس لكن لو هما عايزين يدولوا بالجزمة علشان هو ولا مغلى الاسعار والشوارع فاضية وكل شوية الحكومة تقول لنا فكوا الحزام والمواصلا ت فاضية والشباب لقيين شغل وكل البنات متجوزة وعيشةهنية"
