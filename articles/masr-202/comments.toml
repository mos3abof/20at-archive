text = "مبارك الاب يقوم بدوره الفنان الكبير العظيم القدير الذي ليس له بديل (عادل امام)<br />مبارك الابن يقوم بدوره -مش حنروح بعيد- عادل امام الابن (محمد)<br />وبعا الاخراج ليه يروح بعيد رامي امام)<br />بس عندنا مشكله كبيرة يا تري مين يعمل دور سوزي اااا يعني ممكن يا تري نختار لبلبة ولا نيلي والله الواحد احتار"
