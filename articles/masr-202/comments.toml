text = "للأسف كل الأبطال اللي كانوا ينفعوا للدور ده ماتوا !!!!!<br />والمخرجين ماتوا<br />والمصورين ماتوا<br />كمان حتي الجماهير اللي كان من المفترض إنها تتفرج علي الفيلم ماتوا!!<br />انا بأقترح نرشح بوش للدور ده لعل وعسي يطلع سره باتع مع الأجانب مش مع المصريين بس .<br />وأقترح ان أول عرض يكون في إسرائيل برضه لعل وعسي بركاته تحل علي الجماهير اللي هناك."
