[[comments]]
order = 0
subject = "ما فيش أحسن منه"
author = "مناضل أنترنتى قديم"
posted = "2006-04-19"
text = "السلام عليكم و رحمة الله و بركاته<br />هو فيه غيره النجم أبو النجوم<br />طبعا هوه و بس هو الوحيد القادر على الفوز بثقة العائله المباركيه<br />انه القائد المفدى بطل سلاح المراجيح فى حرب أكتوبرالعظيمه انه الرئيس محمد حسنى مبارك<br />وده طبعا فيه مميزات كتير أوى زى مثلا<br />اننا مش هنحتاج لماكيير<br />و هوه بنفسه اللى هيمثل قصة حياته فهايبقى عايش اللحظه قوى<br />و الاهم انه احسن من انجبتهم السينما المصريه يا جماعه خمسه و عشرين سنه بيمثل على شعبه ده تاريخ يا ناس<br />بس فى مشكله واحده اللقطات اللى فيهااكشن و اللى النجم ممكن ما يقدرش يمثلهاليس إلا لأنه رجل وقور و خاصةً انه حياته كلها أكشن و لا توم كروز فى فيلم مهمه صعبه بدايه من حادثة المنصه بتاعت السادات و أديس أبابا وكمان مواقف ايام الرومانسيه لما كان بيتشعبط فى شجرة الكوسه الخضره (ألمح بعض الخبثاء أن هذه الشجره لعبت دور خطير فى قيادة مصر ..... من مذكرات الريس زكريا (صلاح قابيل فى مسلسل دموع فى عيون وقحه)) اللى تحت بيت سوزى ويعمل زى اللمبى فى فيلم اللى بالى بالك و كمان لما كان بيطلع أول طلعه (ناس هاجاصه بشكل) بطايرته المرسيدس اللى ضد الرصاص فى حرب أكتوبر<br />عامة ديه مشكله مش صعبه ممكن نجيب دوبلير زى الواد (اللى قال عليه واد الكبير بنفسه)احمد السقا ماهو غاوى تنطيط و نط من فوق كوبرى قصر النيل فى فيلم تيتو<br />السؤال الذى يفرض نفسه الأن مين اللى هيعمل دور جيمى لأن الناس ممكن تتقبل فكرة بابا حسنى ممثل هيقوله ايه ياعنى الراجل كبر وبيخرف يا سلام هى جت على ديه انما جيمى ده حاجه تانيه ده ولى العهد"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213717/http://masr.20at.com:80/article.php?sid=202&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "شاهدوا الان برومو الفيلم حصريا على روتانا سينما"
author = "سوسة المفروسة"
posted = "2006-04-19"
text = "المشهد الاول:<br />طفل ابيض متختخ و مكلبظ يجري مذعورا ويجري وراءة مجموعه من العيال الملحوسين منكوشي الشعور يرددون في صوت واحد و هم يحدفونه بالطوب: لا فاش كيري..لا فاش كيري..جبنا البقرة الضاحكة...ها ها ها ها...لا فاش كيري<br />يظهر من بعيد عسكري امن مركزي بخرزانة فيتوقف العيال للحظة ثم يبتعدوا عن المكان بسرعة الريح (غصب عنهم فالعلماء لم يكتشفوا بعد الجين المسبب لمرض فوبيا الامن المركزي الموجود عند جميع المصريين)....يتوقف الطفل الصغير المكلتم و يلتفت و ينظر للعيال و هيا بتجري و يصرخ بعلو صوته ...بكرة اوريكم كلكم كلكم هتبقوا خدامين عندي كلكم كلكم كلكوووووووم ...يسمع صوت من بعيد بيقول: بس ياله بدل ماجيلك ..يجري بسرعه يختفي ورا عسكري الامن الوركزي الذي يلتفت له و يبتسم في حنان...فينتاب الطفل شعور داخلي بالامان و بانه ما عليه في اي موقف الا ان يقول (جزر) ليجد هذا الرجل الحنون بجانبه يحميه من كل المتربصين<br />المشهد التاني:<br />نفس الطفل المكلبظ المتختخ و لكن بعد عدة سنوات صار الان شابا في احدى الكليات العسكرية حولة بعض الطلبة ينظرون له شزرا و بعضهم يضحك و يتغامز عليه..و كلما مر احد من جانبه يناوله شلوط او قلم على قفاه و بعضهم يلسعه بالحزام على....و هو مطنش خاااالص و كلما اطلق احدهم نكتة عليه تظاهر بانه لم يسمعها ووضع يده وراء اذنه و سال : ايه?....بتقول ايه?...<br />يدق جرس طابور الصباح فيخرج جريا ليلحق بالطابور و عند خروجه يفاجا بالكل ينظر اليه و يموت على روحه من الضحك فيتلفت حوله في دهشه فتقع عيناه على ملابسه الداخليه معلقه على سارية العلم فينفجر في البكاء و يتعالى ضحك الجميع و تصفيقهم فيلتفت لهم و الدموع في عينيه صارخا في الكل: بكره اوريكم كلكم هتبقوا خدامين عندي كلكم كلكم كلكوووووووووم..<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213717/http://masr.20at.com:80/article.php?sid=202&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

