[[comments]]
order = 4
subject = "قوم يا مصرى"
author = "نمر من ورق"
posted = "2006-04-20"
text = "يا شعب مذلول و دلدول و مش فالح غير فى الكلام و الهتافات و تفريغ الشحنات على صفحات الانترنت ... قوم يا خانع يا خاضع يا خرنج من قعدتك على القهاوى و على الكراسى قدام الكمبيوتر قوم و قول للحاكم بتاعك إنتا ظالم و كفياك ظلم لحد كده قوم يا اللى بتغنى إخترناك و زفتناك رضيتم بالخنوع و العجز و بقيت زى القوادين بتصهين على الدعارة اللى شايفها عينيى عينيك و شايف الحاكم بتاعك نازل إغتصاب فى بلدك و بلدك بتصرخ و بتستغيث بيك و إنتا إبنها و برضه عامل نفسك مش شايف و لا كأن اللى بيغتصب بلدك هو برضه اللى بيغتصبك و بيديك على قفاك فى الرايحه و الجايه و واضح إنك خلاص إتكيفت و عاوز كمان ... إتفو عليك ما طلعتش من صلب أحمس و لا عرابى و لا الرجاله فى ثورة 19 ... طلعت إبن حرام و لقيط"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213717/http://masr.20at.com:80/article.php?sid=202&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "بركاتك يا زعيم"
author = "نيفين"
posted = "2006-04-20"
text = "بركاتك يابوس<br />مش ملاحظين يا جماعه ان وش البوس حلو على الكاست الابطال المرشحين اتكلو<br />و انا من رايى يلحق محمد خان و شريف عرفه يستخبو اليسومين دول<br />و يا ريت نور الشريف ياخدله ساتر<br />اما شريف صبرى فمع ستين سلامه<br />و هو فعلا اللى يبفع يخرج الفيلم دا علشان ان شاء الله يفشل زى فيلمه الاولانى<br />و بعدين مين قال ان ميرفت امين ادت دور جيهان بكفاءه<br />انا مع حبى لميرفت انا شايفه ان لسه مفيش ممثله ف مصر قدرت تعمل جيهان السادات صح<br />جيهان بتجمع بين الجمال و الجاذبيه و ف نفس الوقت العقل و الشخصيه المؤثره جدا<br />ميرفت كانت اقل من جيهان كتير و الى شاف جيهان ع الهو ف لقاءالت هيعرف كدا<br />يا رب الفيلم دا يقف"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213717/http://masr.20at.com:80/article.php?sid=202&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

