author = "خالد شعراوى"
posted = "2008-05-12"
text = "شارع جزيرة بدران من أهم وأشهر شوارع شبرا مصر من قديم الازل وله تاريخ كبير<br />وليست هذه المستشفيات الاسلاميه والمسحيه هم التى رأيتهم فقط فيوجد أيضا<br />مركز مكارم الأخلاق الطبى ومركز العزراء مريم الطبى وليس المراكز فقط المتقاربه<br />فيوجد أيضا فى هذا الشارع العريق والذى يدل على الوحده بين الاسلام والمسحيه<br />فيوجد المساجد والكنائس وجها لوجه فى هذا الشارع العظيم منهم على سبيل المثال<br />مسجد مكارم الاخلاق مواجه له مباشرة كنيسه مارى جرجس وهم من أكبر المساجد<br />والكنائس فى جزيرة بدران وغيرهم كثير فى هذا الشارع وفى الشوارع الجانبيه ايضا<br />يوجد مساجد وكنائس متقاربه ومواجه لبعض فشارع جزيرة بدران على الخصوص<br />ومنطقة شبرا مصر عامة يثبتان ان المسلم والمسيحى يدا واحده فى الشدائد فهذه هى<br />الوحده الوطنيه على حق بين الاسلام والمسحيه فأن جزيرة بدران وشبرا وجميع<br />مناطق جمهوريه مصر العربيه لن تصبح لبنان كما جاء فى تعليق سابق<br />وشكــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــرا جزيــــــــــــ ـــ ـــــــــــــــ ــلا"
archived = "2010-01-05"
