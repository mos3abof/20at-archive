author = "المستشار"
posted = "2009-12-18"
text = "الموضوع كان يمكن اعتباره ممتازاً ، لولا إسرافك في السخرية والإساءة الحادة الى العاملين في المقبرة ، خاصة الحارس ، الذي كررتي ذكر اسمه اكثر من مرة ، منها ذكر اسمه ثنائي وقرنتي ذلك باتهامه بالحصول على رشوة ، بل و اعترفتي ضمناً بأنك قد ارتكبتي جريمة اعطاء رشوة الى موظف عام … وهي جناية في نظر القانون"
archived = "2009-12-19"
capture_url = "https://web.archive.org/web/20091219153959/http://www.20at.com:80/masr/places-of-egypt/14411-2009-12-15-11-15-09.html"

[[comments]]
order = 1
subject = ""
author = "Raeed Rabie"
posted = "2009-12-22"
text = "اولا اود ان اهنئك على الموضوع الاكثر من رائع :) ,,<br />ولا ارى اي مبالغه في السخريه او الاساءه ,, فهذه حقائق معلومه و واضحه و جليه في بلدنا الغاليه مـصر :) ,, و في بلاد كثيره !!<br />العامل ليس له خلفيه تاريخيه من قريب او من بعيد ,, و انما استمع لما يقال و ردده !!<br />تحياتي مره اخرى"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123082612/http://www.20at.com:80/masr/places-of-egypt/14411-2009-12-15-11-15-09.html"

[[comments]]
order = 2
subject = ""
author = "دعاء الشامي"
posted = "2009-12-23"
text = "أود أن أشكر صاحب التعليق الأول على رأيه ومجهوده في كتابة تعليق على المقال ولكني أريد أيضاً توضيح نقطة هامة وهي أنني لم أقصد أبداً السخريه منه ولا كان في نيتي ذلك بل جل ما أردته أن أقول الحقيقة بل هو أقل من الحقيقة يا سيدي ..<br />فهذا العامل ومسئولي المكان علمت بعد أن خرجت أنهم كانوا يستغلون المكان للعب البلياردو والبينج عبر سنوات طويلة وعلمت الوزارة بعد سنوات وبعدها لم تعد موجودة..<br />أما بخصوص موضوع الرشوة فهو أيضا غير مقصود بالمرة كل ما أردته أن أدخل ومعي كاميرا للتصوير وهو لم يوافق على ذلك لأنه يريد أي مصلحة من الموضوع وجميعنا يعلم ذلك ويضطر لفلعه في كثير من المواقف وقتها أقنعته أن يعطيني تذكرة للكاميرا حتى يسمح لي بذلك وكان لي باق نقود ولم يعطها لي وأنا فهمت القصة فلم أطلبها فقد أخبرني بشكل غير مباشر أنه لن يعطيها لي وكأنها حق له..<br />هل تعتقد يا سيدي بعد هذا التوضيح أنني قمت بجريمة الرشوة أم أن الرشوة لم تعد جريمة من الأصل .."
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123082612/http://www.20at.com:80/masr/places-of-egypt/14411-2009-12-15-11-15-09.html"

