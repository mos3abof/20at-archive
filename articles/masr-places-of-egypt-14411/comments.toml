text = "نا من عشاق محمد على<br />موضوع رائع ..<br />من اسكدرية وحستلم شغل فى القاهرة اول الاسبوع<br />وكنت مرة فى المواصلات وعديت على مدافن قريبة من السبتية واضح انها أثرية عجبتنى جدا<br />وعندى فكرة جامده أولها ننظم رحلة لهناك<br />2- نحاول نعمل حمله عشان المكان الرائع ده ياخد شوية اهتمام<br />seddek<br />gmail.com"
