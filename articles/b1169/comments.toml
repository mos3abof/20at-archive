[[comments]]
order = 1
subject = "البشر والتين"
author = "وفاء &وليد"
posted = "2006-09-02"
text = "البشر استطاعوا ان يصمدوا امام الطاغوت الاسرائيلى وان يثبتوا للعالم انهم سيصمدون بقلوب من صخر ولذلك اتجه العدو الاسرائيلي الي التين اللي (بتفعص بسهولة فهذا البشر وذاك التين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133402/http://www.20at.com/article2.php?sid=1169"
