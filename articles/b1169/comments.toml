subject = "حتى التين"
author = "مروان"
posted = "2006-09-02"
text = "حتى شجرة التين يريدون ان يقتلعوها، كما اقتلعوا الزيتون من قبل، هذا هو الاجرام بحد ذاته، فهم سيحاربون الحجر والشجر لا البشر فقط"
