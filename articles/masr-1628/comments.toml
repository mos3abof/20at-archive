subject = "هما دول ولاد البلد"
author = "شهود"
posted = "2007-02-23"
text = "صحيح والله مصر لسه فيها رجالة ومبادىء وقيم يارب تزيد وربنا معاك والله يا خويا ويارب الناس الكبيرة تفهم ده ولا التطبيع واخد حقه معاهم"
