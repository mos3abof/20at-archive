text = "فين التعليقات يا جماعه؟؟<br />وديتوها فين؟؟<br />هو لما تشيلوا الزبالة ترموا معاها عفش البيت ؟؟؟؟<br />فيه إيه يا ولاد البلد؟؟؟؟؟"
