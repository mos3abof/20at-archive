text = "دا خبر قديم اوي وانا نشرته هنا في التعليقات منذ حوالي سنه<br />وياليتها اقباط المهجر فقط<br />دا فيه مستوطنه اسمها زخاريا في اسرائيل وزخاريا دي تبقى عمته<br />بس الشهادة لله الراجل دا مثقف وعنده افكار كويسه"
