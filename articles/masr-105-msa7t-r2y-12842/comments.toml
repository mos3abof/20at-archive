posted = "2009-08-05"
text = "عرفتم احنا لية فى فقر دكر<br />علشان اشباة اللواء المحافظ الذى ترك اركان الحرب وراح يشتغل عالم اثار ضليع وحدد تاريخ البدء فى بناء الهرم وكان البلد ناقصة علماء اثار او فقيرة فى الخبراء الاثريين<br />اللواء اركان حرب بيفتى فى مياة الشرب لغاية مالبلد نامت فى المستشفيات تيفوئيد وفشل كلوى وتليف كبدى وفيروس سى ودى<br />واللواء اركان حرب بيفتى فى السكك الحديدية والطرق والمواصلات ورغيف العيش ومزارع العجول والبدنجان والصلصة والطماطم والزراعة<br />اما شغلتهم الاصلية اركان الحرب فالواد بلية السباك بتاع درب شكمبة هيبقى يروح يخطط للحروب<br />عرفتم لية احنا عندنا فقر دكر<br />كل واحد بيشتغل شغلة التانى"
