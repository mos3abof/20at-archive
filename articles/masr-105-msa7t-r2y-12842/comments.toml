author = "عشرين سنة"
posted = "2009-08-10"
text = "من عشرين سنة وانا اشترى اى كتاب ينشر عن الهرم الاكبر فى مصر واقرا كل ما يكتب عن الهرم فى النت<br />كيف تم بناء الهرم ؟<br />هناك 32 رسالة دكتوراة على مستوى العالم فى نظريات كيف تم بناء الهرم فى جامعات اوروبا وامريكا<br />ولكن السؤال الذى كان يدور فى عقلى كيف رفع البنائون الفراعنة الفلاحون احجار سقف غرفة دفن الملك ووزن الحجر الواحد 60 طنا وعلى ارتفاع 65 مترا<br />هل يمكن جر حجر وزنة 60 طنا بواسطة الحبال كما ينشر دائما فى الابحاث<br />مستحيل<br />حتى ولو كان المئات يجرون حجرا بهذا الثقل فسوف لا يتحرك ولا مسنتميتر واحد<br />كيف رفع الفلاح المصرى الحجر الذى وزنة 60 طنا الى هذا الارتفاع ؟"
archived = "2009-08-16"
capture_url = "https://web.archive.org/web/20090816201452/http://20at.com:80/masr/t7kyk/12842-happy-birthday.html"

