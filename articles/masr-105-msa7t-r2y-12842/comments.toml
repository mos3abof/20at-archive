author = "الى المعلق رقم 18"
posted = "2009-08-07"
text = "ايوه صح<br />اليهود هما اللي بنو الهرم<br />بنو اسرائيل هما بناة الهرم<br />لان فرعون كان بيضطهدهم وبيكلفهم بالاعمال الشاقة<br />وخلي بالك اليهود ما بيقولوش حاجه غلط كل كلامهم صح<br />اليهود دول هما بنو اسرائيل من اول سيدنا ابراهيم الى سيدنا المسيح<br />كل كلامهم صح<br />ولكن الشيخ الشعراوي حل المشكلة في تفسير قوله تعالى سبحان الذي اسرى بعبده من المسجد الحرام الى المسجد الاقصى<br />يعني الله سبحانه وتعالى قرر مصادرة ارض اليهود وبلاد اليهود وتاريخ اليهود الى الدين الاسلامي والغاء الديانة اليهودية والنصرانيه وعليهم الد[ *** ] في الاسلام تنفيذا للقرار الرباني<br />انما كلام اليهود صح وهما اللي بنو الهرم كعمال وليسوا مهندسين<br />اليهود بنو الهرم كعمال<br />تماما زي المصريين حفروا قناة السويس كعمال ولكن المهندسين اجانب"
archived = "2009-08-10"
capture_url = "https://web.archive.org/web/20090810101706/http://www.20at.com:80/masr/105-msa7t-r2y/12842-happy-birthday.html"

