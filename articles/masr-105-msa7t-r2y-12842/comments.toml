[[comments]]
order = 4
subject = ""
author = "بقية قرار اللجنة"
posted = "2009-08-05"
text = "ومن جانبه أكد الدكتور عبد الحليم نور الدين أنه تم الاستعانة بجميع علماء الآثار المصريين فى الداخل والخارج لتحديد موعد بداية بناء هرم خوفو، وتبين أن الملك خوفو حكم مصر بعد وفاة والده الملك سنفرو عام 2470 ق.م.<br />وتابع نور الدين - بحسب \"اليوم السابع\" - أن بداية البناء تم تحديدها من خلال ظهور نجم الشعرى اليمانية فيما بين 17- 19 يوليو، ويقابل 11 بؤونة من فصل فيضان النيل، وكان أول رصد للظاهرة عام 4241 ق. م.<br />واختتم أستاذ المصريات تصريحاته أن مساحة الهرم حوالى 13 فدانا، ويصل ارتفاعه 146 مترًا، وبفعل عوامل التعرية أصبح ارتفاع الهرم 138م.<br />واختارت محافظة الجيزة الكشف الأثري الهام لتعلن يوم 23 أغسطس من كل عام عيدا قوميا للمحافظة بدلا من يوم 21 مارس والذي شهد كفاح أهالي الجيزة عام 1919 ضد الإحتلال البريطاني."
archived = "2009-08-10"
capture_url = "https://web.archive.org/web/20090810101706/http://www.20at.com:80/masr/105-msa7t-r2y/12842-happy-birthday.html"

[[comments]]
order = 5
subject = ""
author = "اللجنة وقرارها"
posted = "2009-08-05"
text = "في كشف أثري كبير .. نجح فريق من الباحثين المصريين المختصين فى التاريخ الفرعونى والفلك في تحديد تاريخ بداية بناء الهرم الأكبر، معلنين أن منتصف يوم 23 أغسطس 2470 ق.م هو تشييد هرم خوفو فوق هضبة الجيزة.<br />وأوضح الفريق الأثرى المكون من الدكتور عبد الحليم نور الدين أستاذ المصريات بكلية الآثار جامعة القاهرة، والدكتور مسلم شلتوت عالم الفلك البارز والدكتور أيمن وزيرى استاذ قياس الزمن، والدكتور محمد جلال والدكتور علاء شاهين اساتذة في التاريخ الفرعوني علماء آثار وتاريخ فرعونى، أنه تم تحديد بداية بناء الهرم من خلال نجم الشعري.<br />وأشار الفريق البحثي وفقا لصحيفة \"اليوم السابع\" المصرية فى دراسة أعدها أنه توصل الي بداية بناء الهرم الأكبر من خلال ظهور نجم الشعرى اليمانية spdt\"\"، والذي خلصوا اليه بعد دراسة ظهور نجم الشعرى اليمانية فيما بين 17 - 19 يوليو \"يقابل 11 بؤونة من فصل الفيضان\" وعلى أساسه تم تحديد تاريخ البناء."
archived = "2009-08-10"
capture_url = "https://web.archive.org/web/20090810101706/http://www.20at.com:80/masr/105-msa7t-r2y/12842-happy-birthday.html"

