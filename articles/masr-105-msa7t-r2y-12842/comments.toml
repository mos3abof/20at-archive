posted = "2009-08-05"
text = "يا جماعة بلاش الهجوم غير منطقي وغير مبرر على قرار اللجنة<br />فيه حاجه اسمها اسباب وحيثيات<br />يعني مثلا سعادة القاضي المحمدي قنصوه حكم على السكري وطلعت مصطفى بالاعدام<br />حكم الاعدام كان سطر واحد<br />من اجل هذا السطر فيه حاجه اسمها اسباب وحيثيات<br />الاسباب والحيثيات دي كانت 225 ورقة<br />علشان خاطر يقول حكمت المحكمة باعدام طلعت والسكري القاضي كتب 225 ورقة<br />وكذلك اللجنة لما حددت يوم 23 اغسطس موعد بناء الهرم اكيد استندت على وقائع وقرائن مهمه<br />فبعيدا عن السخرية والاستهزاء نطالب اللجنة بالاسباب والحيثيات التي استندت عليها لتحديد موعد بناء الهرم"
