text = "يا جماعة انتم مكبرين العملية لية<br />سيادة اللواء شكل لجنة حضرت روح الفرعون وروح الفرعون قالت انة فى تاريخ 23 اغسطس لكن سنة كام ما يعرفش واوضحت روح الفرعون ان نتائج الحائط لم تكن عرفت بعد وان الفراعنة كانوا بيعرفوا الشهور الفرعونية ابيب وامشير وطوبة وبرمهات وان اغسطس دة خواجة لم تكن دولتة ظهرت الى الوجود بعد ولا احد سمع عن الرومان دول"
