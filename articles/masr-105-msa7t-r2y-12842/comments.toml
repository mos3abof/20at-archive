text = "طيب انتو مستغربين ازاي رفعوا الاحجار اللي وزنها 80 طن<br />مش هي دي المشكلة<br />المشكلة هما جابوها منين اصلا<br />اي مكان في مصر ممكن تلاقي فيه حجاره 80 طن<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــ<br />مش دعاء الشامي ولا دعاء حسن"
