text = "يا اخوانا انا سمعت طراطيش كلام كده والله اعلم والكلام بيني وبينكم مش عايز حد يعرف ان هرم خوفوا حيحصل تمثال رمسيس<br />ما هو اصل البلد ما ينفعش فيها غير فرعون واحد فلما ميدان رمسيس بقا اسمه ميدان مبارك وفيه محطة مترو الانفاق بتاعة مبارك ومحطة مبارك الدولية قالوا بقا شيلو اللزقه دي اللي اسمها تمثال رمسيس شوفولوا اي داهية تاخده او اي مصيبة او حتى قضية امن دولة<br />ولما لقوا ان مبارك حل محل رمسيس العيون اتجهم لخوفو قالوا ليه ما يبقاش هرم مبارك بدل حرم خوفوا<br />والمشروع هو نقل الهرم خوفوا من هذا المكان ليحل محله هرم مبارك<br />والمشروع لسه كلام بس كده وحيدخل في طور التنفيذ قريب بس دا سر بيني وبينكم ما حدش يفتن علينا<br />سلام يا اصحابي<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-08-10"
capture_url = "https://web.archive.org/web/20090810101706/http://www.20at.com:80/masr/105-msa7t-r2y/12842-happy-birthday.html"

[[comments]]
