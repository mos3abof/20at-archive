posted = "2009-08-07"
text = "محافظ معندوش ريحة الدم<br />انتم عارفين ان اكبر محافظة بتتاجر فى البشر فى الشرق الاوسط هى الجيزة<br />العرباوى بييجى من السعودية او الخليج وينزل قرى البدرشين وامبابة والكيت كات والعياط العرباوى من دول ينزل يصيف شهرين يروح يدفع لاهل البنت عشرين الف جنية وياخدها يضيع مستقبلها ويرميها لاهلها حامل فى نهاية الصيف ويرجع لبلدة والصيف اللى بعدة تتزوج عرفى من عرباوى تانى<br />المحافظ حل مشاكل الفقر<br />هى الحياة وقفت على العيد الوطنى للمحافظة<br />عيد وطنى اية وعيد قومى اية<br />بلاش قرف<br />بلاش قرف"
