posted = "2009-08-07"
text = "وأوضح الفريق الأثرى المكون من<br />اللي حسبته لقيته وجبتلكم قرار اللجنة اللي استندت عليها في تحديد بدء بناء الهرم في التعليق 11 و12 شوفوا اللجنة مكونة من مين<br />1 - الدكتور عبد الحليم نور الدين أستاذ المصريات بكلية الآثار جامعة القاهرة،<br />2 - والدكتور مسلم شلتوت عالم الفلك البارز<br />3 - والدكتور أيمن وزيرى استاذ قياس الزمن،<br />4 - والدكتور محمد جلال والدكتور علاء شاهين اساتذة في التاريخ الفرعوني علماء آثار وتاريخ فرعونى،<br />أنه تم تحديد بداية بناء الهرم من خلال نجم الشعري<br />اللطيف في الموضوع ان فيهم استاذ لمادة اسمها قياس الزمن<br />عمركم سمعتكم عن مادة اسمها قياس الزمن<br />يلا بقا بدل الكلام الفارغ كل واحد يكتب على محرر بحث جوجل كلمة قياس الزمن ويشوف يعني ايه قياس الزمن<br />سلام"
