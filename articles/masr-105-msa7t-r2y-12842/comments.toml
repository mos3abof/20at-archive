subject = ""
author = "لجنة الاثار"
posted = "2009-08-07"
text = "اللجنة العالمية حللت الهواء الموجود حول الهرم فطلع التالى<br />نسبة الاوكسجين 3 %<br />ونسبة الفساد 97 %<br />احنا بنتنفس فساد ونفاق وكذب<br />ونفترض يا محافظ يا ابن البلغة ان 23 اغسطس دة صح<br />هل محافظة الجيزة بس هى اللى بنت الهرم علشان تعملة عيد للمحافظة<br />والا مصر كلها سخرت من النوبة للدلتا لبناء الهرم<br />يلعن ابوكم<br />كنت فاكر انك هتفتخر بان الجيزة صنعت اول سيارة مصرية حديثة<br />او ان الجيزة احتفلت بموت اخر شخص امى على ارضها<br />او ان الجيزة صنعت عربات ترام او مترو طوكيو<br />او ان الجيزة احتفلت بالاكتفاء الذاتى من انتاج القمح<br />او ان الايجارات للبيوت فى الجيزة بقت رخيصة<br />يلعن ابو شكلكم لواءات متخلفين"
archived = "2009-08-10"
capture_url = "https://web.archive.org/web/20090810101706/http://www.20at.com:80/masr/105-msa7t-r2y/12842-happy-birthday.html"

