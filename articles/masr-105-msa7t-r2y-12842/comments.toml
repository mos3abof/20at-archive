[[comments]]
order = 27
subject = ""
author = "وحملناهم على ذات الو"
posted = "2009-08-12"
text = "بسم اللة الرحمن الرحيم<br />(وحملناهم على ذات الواح ودسر )<br />بجوار الهرام الاكبر عثر قسم الاثار على ثلاث غرف تحت الارض سليمة وفتحوا غرفة منها كان ذلك سنة 1954<br />كانت قطع الخشب مرتبة على حسب الاطوال والخشب سليم وليس فيى تاكل وكان هناك لفات كثيرة من الحبال<br />بعد فحص الخشب ومن شكل المجاديف تبين انها لسفينة مفككة ومحفوظة فى الحفرة<br />كان الاثرى الذى عهد الية بتجميع المركب رجل متدين اسمة احمد ولا اذكر اسمة كاملا<br />عندما قالوا انها اخشاب مركب قرا الاية<br />وحملناهم على ذات الواح ودسر<br />اين الالواح<br />واين الدسر<br />والحبال<br />ونجح الرجل بعد مجهود رائع فى تجميع اولى السفن الموجودة فى بيت زجاجى الان بجوار الهرم واسمها سفن الشمس<br />لم يستخدم ولا مسمار واحد فى التجميع لالواح المركب لان المسامير لم تكن تعرف فى الزمن القديم<br />وحملناهم على ذات الواح ودسر<br />كانت كل السفن تصنع من الالواح والدسر وليس الواح ومسامير"
archived = "2009-08-16"
capture_url = "https://web.archive.org/web/20090816201452/http://20at.com:80/masr/t7kyk/12842-happy-birthday.html"

