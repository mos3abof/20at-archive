[[comments]]
order = 30
subject = ""
author = "حجارة الهرم الاكبر 2"
posted = "2009-08-13"
text = "فهل<br />يعقل أن كل ذلك تم بدون أية أجهزة متقدمة أو آلات تكنولوجية أو معدات<br />متفوقة، وإنما كما يزعم علماء المصريات بالحبال والثيران والعمالة<br />اليدوية للفراعنة الذين يماثلونا في الحجم !! ( لو كانوا هم حقا البناة<br />) والأغلبية تريح نفسها عناء التفكر في ذلك اللغز القابع أمامنا جميعا،<br />فالبعض يرى أن الفراعنة كانوا معجزين !! والبعض الآخر يتساهل ويزعم أنه<br />ربما كان لديهم آلات وأجهزة وأدوات أخفوها ولا ندري عنها شيئا !!<br />والأكثرية تريح نفسها وتقر بألا دخل لها !! وكأن الموضوع بسيط وغير<br />هام، رغم أنه آية أمامنا ولغز حقيقي من وراءه دلائل عديدة هامة"
archived = "2009-08-16"
capture_url = "https://web.archive.org/web/20090816201452/http://20at.com:80/masr/t7kyk/12842-happy-birthday.html"

[[comments]]
order = 31
subject = ""
author = "حجارة الهرم الاكبر"
posted = "2009-08-13"
text = "الحجر المستخدم في تشييد تلك المباني يصل في بعض الأحيان إلى عشرات الأمتار المكعبة !! حجم<br />العدد التقريبي لحجارة الهرم الأكبر وحده هو 2.3 مليون صخرة !! ولضخامة<br />العدد، لو تم استخدام صخور الهرم الأكبر وحده لبنت سور يحيط بالعالم<br />بارتفاع 30 سنتيمتر، أو يحيط بكامل فرنسا بارتفاع 3 أمتار، أو بحدود<br />مصر حاليا بارتفاع 1.5 متر<br />متوسط وزن الحجر بالهرم الأكبر هو 2.5 طن ( ألفين وخمسمائة كيلوجرام !! )<br />سقف hلحجرة الرئيسية بالهرم الأكبر ( والتي يزعمونو أنها تخص خوفو ) يقدر<br />وزنه ما بين 15 حتى 35 طن !!<br />أثقل حجر هو رأس أبو الهول المنحوت من صخرة واحدة ويقدر وزنه بألف طن<br />مليون كيلوجرام<br />وهو يحتاج لسبعة طائرات جامبو لتحريكه !!<br />المسافات بين موقع تقطيع الحجارة وأماكن التشييد تبدأ من 35 كيلومتر<br />بالمعادي ووصلت في بعض الأحيان إلى 650 كيلومتر من أسوان !!<br />[center]ارتفاع البناء وصل إلى 163 متر !!"
archived = "2009-08-16"
capture_url = "https://web.archive.org/web/20090816201452/http://20at.com:80/masr/t7kyk/12842-happy-birthday.html"

