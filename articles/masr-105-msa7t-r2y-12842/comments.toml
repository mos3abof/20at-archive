author = "كريم نيفيا هو الحل"
posted = "2009-08-07"
text = "بما ان كريم نيفيا بيزحلق كويس<br />فالمفروض السيد المحافظ يزحلق المعلومات ويوزع علب كريم نيفيا علشان الناس تفهم<br />هو فية واحد عارف ان اسم خوفو دة اسم صح<br />دة منطوق كدة اطلقة الاثريون باجتهاد<br />وفية تفسيرات كتير<br />والاستاذ الكاتب الشهير انيس منصور كتب كتاب اسمة الذين هبطوا من السماء بيدعى فية ان مخلوقات هبطت من الفضاء الخارجى وبنوا الاهرامات اذ كيف يتخيل انسان كيف تم رفع حجر وزنة 80 طن الى ارتفاع 60 متر<br />اما حبايبنا فى اسرائيل فبيقولوا وسبق لبيجن صديق السادات وجيهان ان اخبر السادات بان اجدادة اليهود قبل خروجهم من مصر قد استعبدهم الفرعون وانهم هم من بنوا الهرم"
archived = "2009-08-10"
capture_url = "https://web.archive.org/web/20090810101706/http://www.20at.com:80/masr/105-msa7t-r2y/12842-happy-birthday.html"

