text = "يا اخي الكريم منذ ثلاثة الاف سنه كان الناس جسمهم كبير مش زي جسمنا دلوقتي<br />كانت اجسامهم كبيرةواحجامهم كبيرة واقوياء جدا<br />واكيد كان عندهم اجهزة ساعدتهم في هذا البناء الضخم<br />يعني دلوقتي فيه ونش<br />ليه زمان ما يكنش كان فيه اجهزة مثل الونش<br />ايه اللي يمنع"
