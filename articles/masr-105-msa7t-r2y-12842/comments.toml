text = "لو درست هندسة بناء الهرم الاكبر سوف تجد اشياءا تحتار فيها<br />مثلا تم عمل حساب تمدد الاضلاع بالحرارة وانكماشها بالبرودة بتصميم اخر حجر فى الضلع فى قاعدة الهرم يتحرك فى غنفارى يسمح بالتمدد والانكماش صيفا وشتاءا<br />تم عمل حساب الزلازل الارضية بتسوية ارض القاعدة بطريقة معينة تجعلها تمتص اى زلزال"
