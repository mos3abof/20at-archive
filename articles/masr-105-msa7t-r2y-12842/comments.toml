text = "يا جماعة الخير انتم شاغلين روحكم لية<br />اللى بنى الهرم مثتثمر اجنبى اجتذبتة الجو الاثتثمارى الرائع اللى وفرة ابن الفرعون هو ورجال الاثتثمار وباعوا صكوك بناء الهرم للاجيال القادمة واظن ان الحزب الوطنى بتاع الفرعون خوفو كان مش السبب وراء لعنة الفراعنة والفساد اللى حل فى البلد<br />23 اغسطس تاريخ وضع المثتثمر الاجنبى ايام الفرعون خوفو الطوبة الاولى"
