[[comments]]
order = 33
subject = ""
author = "الانسان العارى"
posted = "2009-08-14"
text = "هى دى عبقرية الفلاح المصرى<br />عريان وحافى وقالوا لة ابنى الهرم وارفع الصخرة الكبيرة دى بدون اى الات او معدات<br />لانة لم يكن بعد قد صنع المسمار<br />ولم يكن بعد قد قد عرف تشكيل المعادن والحديد وكان اقصى معداتهم بلطة من الحجر يقطع بها الصخور<br />وهل تم جر الصخور بالثيران ؟ وكم ثور كافى لجر مليونين ونصف من الاحجار<br />مستحيل توفير طعام لهؤلاء الثيران<br />اذن هناك قوة العقل<br />قف امام ماذنة السلطان حسن مثلا او ماذنة جامع ابن طولون<br />كيف رفع الفلاح الحجر الى اعلى نقطة فى الماذنة<br />هناك البساطة العقلية<br />زمان وانا مهندس صغير كان فى مكان عملى رجل صعيدى امى لا يعرف القراءة ولا الكتابة اسمة الحاج منصور ووظيفتة ريس مثقلات<br />ريس المثقلات هذا حينما يطلب رفع اوزان ثقيلة بالاطنان من مكانها يستدعون الحاج صميدة وبطرقة البلدية يقوم بالعمل خير قيام وبدون كتب ولا كتالوجات ولا تعليمات الشركة المصنعة<br />امثال او اجداد ريس المثقلات هم الذين رفعوا صخور الهرم وهم الذين بنوا ماذن المساجد فى القاهرة المحروسة بالاحجار البيضاء"
archived = "2009-08-16"
capture_url = "https://web.archive.org/web/20090816201452/http://20at.com:80/masr/t7kyk/12842-happy-birthday.html"

[[comments]]
order = 34
subject = ""
author = "وابطال ايضا"
posted = "2009-08-15"
text = "فى العاشر من رمضان 6 اكتوبر 73 كان هذا المشهد الصعب<br />سارت الدبابة فوق احدى معابر قناة السويس لتعبر الى الضفة الاخر<br />سارت الى مسافة 3 كيلومتر شرق القناة وبناءا على الاوامر توقفوا<br />طلب القائد من الاطقم خندقة الدبابات بمعنى ان يحفر كل طاقم مكون من 4 افراد حفرة تحت الارض لتنزل اليها الدبابة<br />وما لم ينسى ان هؤلاء الاربعة القادمين من قرى الدلتا ونجوع الصعيد امسكوا اطباق طعامهم ووقفوا كل واحد فى ركن ليحفر بطبق الاكل فى الرمال ليصنعوا حفرة تسع دبابة<br />كان شياطين الارض كانت تتلبسهم<br />ومن الغريب انة بعد ساعتين بالضبط كانت الدبابة مخفية تحت الارض فقد حفروا الرمال باظافرهم وكانوا يجلسون بداخلها استعدادا لاى اوامر<br />قدرة عملاقة جدا يحفرون باظافرهم بينما الجيوش الاخرى تستخدم اللوادر فى الحفر لجيوشها<br />وكانت شادية العظيمة تغنى<br />ما شفش الرجال السمر الشداد وصبايا البلد<br />هنا السر<br />الرجال السمر الشداد<br />حافرى قناة السويس<br />وبناة السد<br />ورافعى احجار الهرم"
archived = "2009-08-16"
capture_url = "https://web.archive.org/web/20090816201452/http://20at.com:80/masr/t7kyk/12842-happy-birthday.html"

