author = "بناة السد العالى"
posted = "2009-08-15"
text = "احفاد بناة الاهرام بنوا السد العالى<br />هنا تظهر الصلادة والقوة المصرية<br />فى اجتماع تنفيذى لمهندسى تنفيذ بناء السد العالى جلس المهندسون الروس وامامهم الخرائط مع المهندسين المصريين لمناقشة كيفية التنفيذ<br />ويؤشر المهندس الروسى على الخريطة انة مطلوب فى النقطة الفلانية عدد اثنين كراكة وثلاثة حفارات ميكانيكية<br />ويكتب المهندس المصرى بالعربى مكان كل كراكة ولانة لا يوجد كراكات ولا فلوس لشراء الكراكات يكتب المصرى بدل عن الكراكة 6 صعايدة وبدلا من الحفار الميكانيكى 5 صعايدة<br />ويشرح للروسى الممتعض والمستهجن<br />وفى التنفيذ كان فعلا 6 صعايدة يقومون بالعمل بدل الكراكة وخمسة صعايدة بدلا من الحفار الميكانيكى وانبهر الخواجات الروس من قوة المصريين وجلدهم وصلادتهم<br />وحينما غنى عبد الحليم حافظ كنا هنبنى ودى احنا بنينا السد العالى يا استعمار بنيناة بايدينا السد العالى<br />كان يعبر عن هؤلاء الصعايدة العمالقة الذين حلوا مكان الكراكات والحفارات<br />نحن شعب عندة ملكات خارقة تظهر وقت الشدة وتظهر فى ايام التحدى<br />نعم تم رفع احجار الاهرام بهؤلاء الصعايدة<br />ازاى<br />تلك قصة اخرى"
archived = "2009-08-16"
