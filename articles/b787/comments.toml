[[comments]]
order = 13
subject = "على قمة الشهرة"
author = "أحمد"
posted = "2006-05-30"
text = "الشهرة كالجبل كلما صعدت كلما ضاقت المشاحة التي تقف فيها (منطقي طبعًا فقمة الجبل أضيق كثيرًا من السفح)، تخيل نفسك فوق جبل كل الكائنات (المعجبون) المحيطة بك عبارة عن طيور تحلق حولك لبعض الوقت ثم تمضي إلى حالها و لايوجد من يظل معك.<br />أيضًا من عيوب البقاء على الجبل الشعور بالبرودة (كلمل صعدنا لأعلى كلمل قلت الحرارة)- كذلك من في القمة يرى غيره من الناس مخلوقات صغيرة (لا يقدر الناس حق تقديرهم)<br />الشهرة من أقوى الأسباب التي تتسبب في الخيلاء والغرور والله لا يحب كل مختال فخور.<br />ليست محاولة للتفلسف بس مجرد تشبيه يقرب الصورة للأذهان."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154041/http://www.20at.com/article2.php?sid=787"

[[comments]]
order = 14
subject = "رأيى أنا"
author = "سارة"
posted = "2006-05-31"
text = "بالنسبة لى الشهرة مش شايفه انها حاجة حلوة مع ان ليها اجابيات بس انا شايفه انها مش حاجة مستحبه أو حاجة الواحد يسعى ليها<br />وبالنسبة لحكايت تامر. هو يمكن التعليق من (الحلوة) اللى بتحبه جرىء شوية لكن انا قرأت فى كتب علم نفس ان ده شىء طبيعى فى حال المراهقات او المراهقين ( مع انى مراهقه بس عادى يعنى) بس فدى مش حاجة غريبة انها تطلع من مراهقين خصوصا لو بنات وانا مقصدش بكلمة (مراهقة) شتيمة او حاجة وحشة انا بس حبيت اعلق."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154041/http://www.20at.com/article2.php?sid=787"

