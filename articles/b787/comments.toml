text = "اما بالنسبة لالي انا الشهرة ما بتهمنى كهدف والسلام ، انا بتمنى من كل قلبي ان اصبح كاتبة و روائية ان شاء الله ، وهيك التاريخ بذكرني مش البشر ،<br />وحلمي الدائم اكون شهيدة بارضي فلسطين ان شاء الله ،،<br />وسلام ،،"
