subject = "حسبي الله"
author = "مسلم"
posted = "2006-05-15"
text = "أولا للبنات اللي هدفهم في حياتهم يعجبوا تامر حسني وكل طموحهم ان واحد مزور يحبهم هقول كلمة واحدة (هتتحاسبوا على كلامكم دا.)<br />ثانيا بما اني بشر نفسي أكون من رجال الأعمال المشهورين و الأغنياء جدا طبعا<br />لكن وعشان أنا لسه بشر أكيد دا هيخليني أتكبر وأكون مغرور ودا مش كويس عند ربنا قال تعالى \"إن الله لايحب كل مختال فخور\"<br />ربنا يستر علينا ويهدينا كلنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154041/http://www.20at.com/article2.php?sid=787"

