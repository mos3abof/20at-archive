subject = "يلا كله مع كله"
author = "احمد المصرى"
posted = "2006-05-17"
text = "سالمه وجميله<br />يحبان تامر<br />والاخرين ينتقدونهم<br />لماذا هلاشن الدين<br />ط__________ايب<br />هما عملو ايه لدينهم<br />تافهين طايب ماايه يعنى<br />هما وراهم ايه غيرها<br />ياعم انت وهيه انت عارف بنات اليوم ماشين اذاى<br />هاقول ايه يلاه كله مع كله<br />اهم حاجه ارحمونا يرحمكم<br />ربناانا خارجت عن الموضوع<br />لاكن داه طلب الاداره انه يكون<br />فى تعليق على الى مكتوب<br />من تعليقات"
