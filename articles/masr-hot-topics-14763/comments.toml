text = "من يوم ما زخاري دخل موقع ولاد البلد وانا بقيت محترف شتيمه واصبحت انسان بذيء اللسان<br />وكل دا بسبب زخاري<br />مع ان النبي محمد قال ان المسلم ليس بشتام ولا لعان ولا الفاحش البذيء<br />لكن حعمل ايه الواد زخاري خلاني محترف شتيمه<br />الله يخرب بيتك يا زخاري"
