text = "يا ترى عندك مكان على الدولاب فاضى أضع عليه إعلان عن ماركة للتى شيرت أو من فضلك المساحة الصغيرة المربعة دى اللى أمام باب شقة حضرتك هايوقف ولد وسيم يوزع ورق ع اللى طالع واللى نازل واللى داخل لحضرتك مقابل 2 شيش وواحد كفته للمدام وطبعا مش ها ننسى الكتاكيت الصغيرة ب 2 كيس بطاطس محمرة …<br />حرام عليكم يا شركات الاعلانات كم الاعلانات اللى بنتعرض لها كم بجد مقرف هو وحده يصيب الانسان بالهوس والصخب كفايه اعلانات عايزين نشوف حياتنا بالصورة اللى إحنا عايزينها مش اللى الاعلام عاوزة أأأأأأأأأأأأأأأ أووووووووفففففف ففففففففففففف بجد"
