[[comments]]
order = 0
subject = "لا تعليق"
author = "احمد"
posted = "2006-12-19"
text = "لماذا يدين شيخ الازهر ميلشيات الاخوان ؟ ولا يدين ميلشيات الحزب الوطنى وهم يعبثون با الشعب مالم يفعل فرعون مصر ؟لماذا لانسمع شيخ الازهر الا فى المواقف التافهه ويام العيدين بارك الله فيه واين هو ايام التحرش الجنسى فى وسط البلد لكل بناتنا واخواتنا محجبات قبل المتبرجات؟وايضا سب فاروق حسنى فى المحجبات ؟اين كان هو؟كان فى شرم الشيخ؟ولا كان فى بيلت شتوى ما احترامى له لانى من ابناء الازهر والسلام ختام"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102143/http://masr.20at.com:80/article.php?sid=1317"

[[comments]]
order = 1
subject = "شيخ الازهر"
author = "جعفر"
posted = "2006-12-20"
text = "شيخ الازهر قد مات من قديم الزمان الموجود الان يسمى شيخ ازعر لانه يزعر الاسلام ويسىء الى الازهر لانه صاحب كرسى ولا نقول الا الحقيقة حسبنا الله ونعم الوكيل فيك ياشيخ ازعر"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102143/http://masr.20at.com:80/article.php?sid=1317"

[[comments]]
order = 2
subject = "رد على : جعفر واحمد"
author = "محمد"
posted = "2006-12-20"
text = "أقول للأخوين اللذين قاما بالتعليق باسم جعفر أو أحمد لو سمحتم قفا عند حدودكما ، فوالله مابلغتما علم هذا الرجل ولا نصيفه والله هذا الرجل (شيخ الأزهر) لايقول إلا حقا ولا يخشى فى الله لومة لائم. ولكن التعصب الأعمى والجهل المطبق الذين تعيشون فيه هو ما يجعلكم تقولون مثل هذا الكلام فحسبنا الله عليكم."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102143/http://masr.20at.com:80/article.php?sid=1317"

[[comments]]
order = 3
subject = "ائمة السلاطين"
author = "ابو العل"
posted = "2006-12-20"
text = "لا ادري لعلي اكون خاطئا في هذه العبارة ولكني اتمنى من الله العلي الحفيظ ان يمحق الفساد والمفسدين ويلحق بهم ائمة الكفر والسلاطين"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102143/http://masr.20at.com:80/article.php?sid=1317"

[[comments]]
order = 4
subject = "لم يعد شيخا للأزهر"
author = "ABOSHEHAB"
posted = "2006-12-20"
text = "بهذه الطريقة لم يعد شيخا للأزهر ، لقد سمح للفرنسيين بنفسه أن يمنعوا ارتداء الحجاب ، ويأتي الكفار إلى بلادنا يشربون الخمر ويعربدون في شرم الشيخ وهو يذهب إلى شرم الشيخ ، أكان يرضى بذلك رسول الله -صلى الله عليه وسلم-"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102143/http://masr.20at.com:80/article.php?sid=1317"

[[comments]]
order = 5
subject = "الرد على العالم محمد"
author = "مصرى"
posted = "2006-12-21"
text = "انت مالك زعلان اوى وعمال تخبط فى الناس ايوا الراجل عالم بس بيستخدمة ليضل الناس زى اليهود ماحرفوا كتاب الله بعد ان علموا"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102143/http://masr.20at.com:80/article.php?sid=1317"

[[comments]]
order = 6
subject = "شيخ الازهر"
author = "صقر الجبال"
posted = "2006-12-23"
text = "انطلق على خيرة شبابناملشيات ولانطلق على الذى يصافحه وشريكه قاتل وسفاح وحسبنا الله فى كل من قال عن هؤلاء الشباب سوء نفرح بكل ماهومنكراقوللفضيلة الشيخ على حادثه بسيطهتطرد الفتيات من المدن الجامعيه الازهريه لماذا لانهم اردو ان يتقدم الملحد وزير الثقافه بعتذار اتقى الله ياشيخ وشوف المصائب داخل الوطن ولا تخاف فى حق من حقوق الله لومة لائم لااحد ينفعك يوم تكون بلحدك وتحاسب ولا فى النار فووووق قبل ما تروح وكرسيك مش هينفعك<br />طالب من طلاب الازهر وضحاياه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102143/http://masr.20at.com:80/article.php?sid=1317"

[[comments]]
order = 7
subject = "وا معتصماه"
author = "محمد عبد ه"
posted = "2006-12-24"
text = "ياشيخنا لنا ولطلبة الأزهر الله فنسأل الله عز وجل كما أسمع المعتصم صوت المرأة التى إستغاثت به فى أرض الطغاه أن يسمع صوتنامن له الأمر طالما أن شيخ الإسلام ليس بيده الأمر فيا من لك الأمر نستعين بك ونلوذ بك ونسألك أن تفك أسر طلابنا طلبة العلم ومن هم دائما يحتمون بك وكما أهلكت فرعون وجنوده أهلك كل من يجعل من أمر الإسلام مهانه واللهم أسمع صوتنا لكل من بيده الأمر فأنت على كل شىء قدير وبإجابة الدعاء جدير"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102143/http://masr.20at.com:80/article.php?sid=1317"
