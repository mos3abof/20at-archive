[[comments]]
order = 13
subject = ""
author = "سلمى وصفي _مصر (المنصورة)"
posted = "2008-11-05"
text = "ما بتصورش ان الكلام ده صادر من واحد من مصر اللي فيها احترام لكل الشعوب أنا مصرية وأكن كل احترام للسعوديين وأنا عايشت الكلام ده في الحج دول ناس ألبهم أبيض وان كان فية ناس بتعمل الحجات دي فده شيء طبيعي لأنهم 25مليون زي ما بعرف والطبيعي ان كل مكان فية الخير وفية الشر ومابيصحش نقزف الناس كده والكل بيعرف انهم لحد دلوأتي أكتر شعب متمسك بالدين ومحدش يأدر ينكر ولو فيه ناس شزت عن كده فده غير مستغرب لأن الدنيا فيها الخير والشر وبعدين الخبر فيه عامل يعني وافد مش من بلدهم ولو كان من بلدهم فهو بيمسل نفسة مش شعبهم اتكلم بمنطق او اسكت وميصحش ترمي الناس باسم بلدنا"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145129/http://www.20at.com:80/20at/ana-saudi/8114.html"

