[[comments]]
order = 0
subject = ""
author = "فرعونى وكلى فخر"
posted = "2008-01-28"
text = "السعوديين ومن بعدهم الشعوب الخليجيه اكثر الناس فسادا ، صحيح امور الكتابه على الحمامات بيحصل فى كل البلاد العربيه المتخلفه لكن مبيوصلش الى ابواب حمامات المساجد الا عند الشعوب اصحاب القلوب الخاليه من خشيه الله ، وبعدين عايزين ايه يعنى من قوم لوط تصوروا انهم بيصرفوا مبالغ طائله على الحقن الشرجيه ومواد التنظيف الخلفى للاستعمال الجنسى الله يهديهم والحمد لله اننا فراعنه مش سعوديين والله مصر بخير يا جماعه وال بيحصل فى مصر مايجيش ربع ال بيحصل فى بلاد الخليج لانه بيحصل عندهم فى السر بلاوى لكن احنا بنواجه مشكلاتنا بجراة وعندنا ايمان مهما كنا عصاه وبنستحى من ربنا وكفايه كدا"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145129/http://www.20at.com:80/20at/ana-saudi/8114.html"

[[comments]]
