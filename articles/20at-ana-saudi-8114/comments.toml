[[comments]]
order = 4
subject = ""
author = "مسلم و أفتخر"
posted = "2008-02-04"
text = "انا اعيب علي الأخ الفرعوني هذه المشاركة فأنا مصري ولكن افتخر بأني مسلم<br />والحمد لله الذي وحد بيننا بأخوة الإسلام<br />والفساد موجود في العالم كله وواجبنا مصريين وسعوديين وكل العرب والمسلمين التغلب علي هذا القبح<br />واما سبنا لبعضنا بهذه العبارات فلا تجوز ابدا<br />واشيد برد الأخ ابو فيصل واقول اننا نغار علي الإسلام كلنا فجزاك الله خيرا علي نصحك وحلمك<br />والمقالة تعرض خبرا لا غير وهو معمم علي كل البلاد لا بلد بعينها<br />ولابد لنا من التخلص من هذه العادات السيئة"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145129/http://www.20at.com:80/20at/ana-saudi/8114.html"

