archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145129/http://www.20at.com:80/20at/ana-saudi/8114.html"

[[comments]]
order = 2
subject = ""
author = "أبو فيصل الهاشمي"
posted = "2008-01-29"
text = "إلى أخي صاحب التعليق السابق. أخطأت خطأ كبير عند وصفك السعودية بأنها أطهر شعب وانجس ناس، نعم هي أطهر أرض ، ولكن أن تحكم على أنهم أنجاس فهذا قذف لا ينبغي لمسلم أن يصف أخاه المسلم بهذا اللفظ.<br />أما حكمك بأنهم قوم لوط وتحمد الله على أنك من الفراعنة ، فأنا أحمد الله على أني مسلم من آل بيت النبي صلى الله عليه وسلم من بني هاشم ، فمنا النبي والصحابة وهذا لا شك مفخرة بعد مفخرة الإسلام.<br />ما أريد أن أوضحه لك أن بلاد الحرمين المملكة العربية السعودية فيها من الخير الكثير ولا انفي وجود شر من بعض الناس ولكنه قليل وليس بالسوء الذي ذكرت ، ويبدو لي أنك لم تعش في المملكة يوما ما ، ولا تعرف حسن اخلاق أهلها .<br />وإذا كنت تريد فيشرفنا ويسعدنا زيارتك لنا في مكة المكرمة في أي وقت تود.<br />أخوك ومحبك في الله / أبو فيصل القرشي"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145129/http://www.20at.com:80/20at/ana-saudi/8114.html"

