text = "عفوا يا عشرينات .. طالما احترمت ما ينشر على هذا الموقع وشدت انتباهي الموضوعات المختاره<br />ولكن هذه المره اختياركم غير موفق .. ما الفائده من الكلام عن ( شخابيط على جدران الحمامات والرسومات ) ماذا استفدنا ؟"
archived = "2009-11-08"
