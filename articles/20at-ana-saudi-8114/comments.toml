text = "ياخي الله يلعن ام امهم ذا المصاريه مااطييقهم مدري ليش .. منافقين ونصابين وحراميه وكلاااب .. كل الصفاات الشينه تلقاها فيهم .. اختفوووو عليكم يا عياال الكلب ( والله الفقر وقلت الحياء والصياعه الي عندكم ماجت من فرااغ ) ..<br />انجاااس والله العضيــم ..<br />يالله سوقووها انتو وموقعــكم ذا الفااشـــــــل ( واذا كنا احنا اطهر ارض وانجس شعب ) فأنتم ( أنجس ارض وأنجس شعب )<br />اختــفووووووووو وووووووو عليكم يا عيال الكلب<br />والي في راس امه حرش يا عيال الكلب .. هذا ايميلي ورقم جواالــي<br />alwaleed-legend<br />hotmail.com وهذا رقم الجوال 05555012654"
