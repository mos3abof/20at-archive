subject = "ياريت كل اللي عندهم مستنات يطلعوها"
author = "احلام"
posted = "2006-12-20"
text = "انا دخلت علي موفع شايفنكم واعطيت صوتي للاستاذ احمد لانني قرات ما كتبه في الاسبوع والعربي الناصرى فساد للركب في مؤسسه نحن دافعى الضرائب للاسف نمولها يعني مش هامهم اننا نقاطع الصحف دى لكن كمان بيسرقونا بالغصب الله يولع فيهم"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224600/http://masr.20at.com:80/article.php?sid=1327"

[[comments]]
order = 3
subject = "كلام في الموضوع برضه ..."
author = "إبن بهيه"
posted = "2006-12-20"
text = "ألف بان خلفهم هادم كفى .:. فما بال بان خلفه ألف هادم ؟؟<br />بيت شعر قديم .. حكمه .. لا أسوقه لزيادة حالة اليأس بقدر ما أتمنى أن نفوق ونوحد هدفنا في هذا البلد .. هدفنا يجب أن يكون إزالة نظام مبارك الواطي بكامله .. من رأس الواطي مبارك إلى الولد صنقر بتاع المجلس القروي المحلي في كفر البطيخ .. وحل الحزن الوطني تماماً لأنه بجد جابلنا كل البلاء والغم والفساد<br />كل التيارات بكل توجهاتها لو وطنية بجد وبتحب البلد دي بجد لازم تتجه نحو هذا الهدف تحديدا وتبطل بقى العك السياسي اللي حاصل ده وضربها في بعض .. أنا ناصري وأقف بكل قواي خلف الإخوان لأنهم الأقوى حالياص والأقرب إلى الفعل من غيرهم .. يا ريت نفهم الحدوته البسيطه ديه ونعيها كويس<br />عايزين نفهم ونتعلم أصول اللعبه بقى كفايه عك بيدخلونا فيه مكتبانجية السلطه والنظام القذر بكل تياراتهم ..<br />على فكره النظام القذر بقوادة مبارك الواطي عندهم مكتبجيه من كل التيارات عشان يعملوا الشروخ دي كلها .. يعني هتلاقي مكتبانجية حكوميين يساريين وليبراليين وإسلاميين كمان وكلهم بايعين الوطن بلقمة جاتوه متغمسه بدم المصريين<br />الشعب لايص في الهباب ده ومش لاقي طريقه<br />الطريق في الزحمه دي هو مصر .. مصر وبس<br />لو مصر مع الإخوان يبقى نمشي وراهم والكل لازم يمشي وراهم لغاية ما نوصل لهدفنا من تطهير البلد دي من مبارك وعائلته القذره وعصاباته وكل اللصوص .. ساعتها هنكون عدينا حفرة الحزن الوطني ونقدر نغير أي حكومه لأننا عرفنا طريق التغيير .. بس نبدأ نغير .. حد فهم حاجه ؟؟<br />تحياتي للجميع<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224600/http://masr.20at.com:80/article.php?sid=1327"

[[comments]]
order = 4
subject = "صح النوم"
author = "ابو صياح"
posted = "2006-12-20"
text = "صح النوم واللة حاجة تضحك<br />انتم لسة جايين تعرفوا دة دلوقتى<br />يابويا دة كلام قديم قوى<br />نفسى اسال سؤال مين اللى لسة بيقرا الجرايد الحكومية بتاع الاتحاد الاشتراكى<br />بتكسب من اين ؟<br />مش معنى كل شىء اتخصص لاصحاب النصيب الا دى<br />فية حاجة تحير مش مفهومة ايش كدة"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224600/http://masr.20at.com:80/article.php?sid=1327"

