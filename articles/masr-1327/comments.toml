subject = "تغيير اسم البلد"
author = "تلميذة"
posted = "2006-12-20"
text = "البلد كلها فوضى ونهب وقلة نظام وقلة ضمير وقلة شرف وقلةامانة وقلة ادب وقلة نظافة وحياة ابوك اكتب عن الدوشة اللى سببت للناس العصبي وقلةالتركيز وكل ده المفروض يغيورا اسمها الى<br />وكما فعل القذافى هماالسابقون ونحن اللاحقون<br />امضاء تلميذة"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224600/http://masr.20at.com:80/article.php?sid=1327"

[[comments]]
order = 1
subject = "كتابة ما حذف"
author = "تليمذة"
posted = "2006-12-20"
text = "يغيروا اسمها الى<br />الجمهورية الملكية الفوضوية الاسلامية الدوشجية المتحدة<br />لانه لم يظهر في التعليق الاول<br />تلميذة"
