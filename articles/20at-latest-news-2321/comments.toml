author = "عبد الله ولد إبراهيم ولد محمد اعل"
posted = "2006-07-02"
text = "(نفس التعليق السابق بعد التصحيح الإملائي)<br />ما هذا الخبر السيئ ؟ الله يخرب بيت اللي مسؤول عنه(الله يحرق اظريع بيُّ و بي ذاك)<br />نحن الموريتانيين لم يبق لدينا من الكرامة إلا بقية من ديننا الحنيف ، فهل تريدوننا أن نفقد هذا أيضا.<br />إنني أدعو إلى منع مثل هذه النشاطات بأية وسيلة ممكنة و الحيلولة دونها.<br />و أما بالنسبة للنساء اللائي قد يشاركن في مثل هذا النشاط المشين فإني أقول لهن :<br />إذا كانت لديكن كرامة فلا تشاركن في هذا، أما إذا لم تكن لديكن كرامة (وهذا هو الواقع) فأنتن فاسقات (حوبارات و شراميط).<br />و أما بالنسبة للرجال (أو الذكور لأنه ليس كل ذكر رجل فهناك قطط ذكور و حمير ذكور و خنافيس ذكور ... و هم جميعاً ليسوا رجالاً) الذين لديهم علاقة بالموضوع فكل واحد منهم إما أن يكون قوادا أو ديوثا.<br />و أخيرا أذكركم بان الذي أهلك بني إسرائيل هو أنهم (كانوا لا يتناهون عن منكر فعلوه لبئس ما كانوا يفعلون).<br />مع تحياتي<br />المهندس عبد الله ولد ابراهيم ولد محمداعل<br />من أبناء مدينة أطار<br />و مقيم حاليا في الخارج"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141933/http://www.20at.com/article2.php?sid=1005"

