author = "محمد حمود"
posted = "2007-06-15"
text = "في الحقيقة الإنسان كائن ضعيف وأحب شيئ إليه هو ما منع منه وهذه غريزة فيه بشكل طبيعي والمرأة الساترة تشد القلوب دائما بما تستر سواء كان المستورا جميلا ام قبيحا ولهذا فرض عليها ستر عورتها وهي كلها عورة هذا من جهة ومن جهة أخرى لا يخفى علينا أن الغرب يغري بكل ما أوتي من قوة ومعروف أن غريزة الجنس من من أشد الغرئز البشرية تأثيرا على الإنسان لذا حاولوا جاهدين أن يغرسوا جرثزمة التبرج في الفئات النسوية القصر ، حيث قال رسول الله صلى الله عليه وسلم هن نواقص عقل ودين ، وهذا ما نجحوا فيه ولم يكتفوا بذلك بل أصروا على أن يعرضوا حصاد غرسهم على حلبات مسارح الرجال ، وبذلك يرضون عنا ؛؛ لا رضوا!! يقول الله تعالى «ولن ترضى عنك اليهود والنصارى حتى تتبع ملتهم» صدق الله العظيم"
archived = "2009-12-26"
capture_url = "https://web.archive.org/web/20091226174059/http://www.20at.com:80/20at/latest-news/2321.html"

