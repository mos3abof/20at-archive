posted = "2009-05-30"
text = "هاذ احرام ولاينبغى لأى مسؤل موريتانى يعتزبأصالته الرضاعنه.و<br />لاكن كثرهم اصحاب النفوس الضعيفه والذى في قلبه مرض والذين يحبون ان تشيع الفاحشه بين الناس .انما الموضوع هنا هو للكسب المادى تلهث خلفه شرذمه من القوادين لاغيرة لاهم ومستعدون لبيع اعراضهم لمن يدفع اكثر. واناواثق كل الثقة بأن أى فتاة موريتانية حرة عربية تعرف ان دينها وعادات مجتمعها القبلى البحت يرفضون هذا الفحش والدعوة للرذيلة وفسادالخلق وجعلهاسلعة رخيصة فىمتناول ايدى سماسرة ألبغأ والزنا بشكل مشين وبشع.عزيزى القارا عذرى فى اطالتى انى لهاذاالبلدأنتمى . لكل شريف وحرغيوراقول أرفضووبقوة هذاألنوع وحافظوعلى عزة موريتانية. وشكرا."
archived = "2009-12-26"
capture_url = "https://web.archive.org/web/20091226174059/http://www.20at.com:80/20at/latest-news/2321.html"
