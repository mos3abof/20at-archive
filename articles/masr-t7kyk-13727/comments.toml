text = "اولا انت غلطان<br />اعلام اية يا ابنى اللى رايح تدرسة فى جامعة حكومية فاشلة<br />انت بالفلوس دى ممكن تاخد دورة كمبيوتر فى مركز اجنبى وممكن تاخد دورة لغة انجليزية وممكن تاخد دورات تدريبية وورش عمل فى الاعلام فى مراكز ثقافية او الجامعة الامريكية"
