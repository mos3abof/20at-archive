text = "فعلاً مصاريف نار وانا اضطريت أعدي السنة دى علشان ماكنش معايا فلوس أدفع لكل ده<br />و النبي قول للوزير هانى هلال معاك أننا مش لاقيين ناكل بس بنسمع كلام الإعلانات الى بتقول أنك لازم تكون ناجح وكلام البرامج الى بيقولك كون طموح ..<br />وكلام سيادتك في الموضوع بتاع الدوافع والى بتقولنا فيه أن الحلم مالهوش حدود<br />بس أعتقد أنه له حدود فعلاً فهو لا يتعدي حدود جيبك"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018134443/http://www.20at.com:80/masr/t7kyk/13727-2009-10-15-15-02-28.html"

