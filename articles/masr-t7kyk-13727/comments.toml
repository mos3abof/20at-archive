posted = "2009-10-20"
text = "فية هيصة فى البلد<br />وطالعة هوجة انهم يحولوا مباراة مصر والجزائر فى الكرة الى معركة حربية وحرب داحس والغبراء<br />وكل يوم تصريحات وشد فى اعصاب الناس<br />هى اول مرة نلعب مع الجزائر<br />وافرض ان الجزائر غلبت او مصر غلبت بعد كدة هيعملوا اية<br />فى اول تصفية مع دول اوروبا هيخرجوا<br />طيب افترض ان كسبنا كاس العالم<br />كاس العالم هيحل مشكلة البطالة ومشكلة الفقر والعنوسة وانفلونزا الخنازير"
