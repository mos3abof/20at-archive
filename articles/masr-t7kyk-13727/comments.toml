author = "خد من دقنة"
posted = "2009-10-15"
text = "هناك مثل بيقول خد من دقنة وافتلة<br />شعار التعليم زى الماء والهواء صاحبة كان طة حسين وقالة لما كانت مصر دولة بتقدر تصرف على نفسها من مواردها وتعلم وتعالج ولادها<br />انما يا صاحبى انت مش فاهم حاجة فى اى حاجة<br />اولا انت عارف يعنى اية اصلاح اقتصادى اللى بيتغنوا بية كل شوية ؟<br />يعنى بدل ما الدولة تصرف على نفسها من مواردها ومن مصانعها وزراعتها وتجارتها تصرف من جيبى وجيبك وجيب المواطنين<br />بمعنى انك لازم تدفع ضريبة على كل حاجة<br />سموها ضريبة مبيعات<br />اذا اتكلمت فى التليفون تلاقى ضريبة مبيعات فى الفاتورة<br />اذا استهلكت كهرباء تلاقى فى الفاتورة ضريبة مبيعات<br />اذا مشيت على طريق تلاقى بوابة ويقول لك ادفع<br />ضريبة المبيعات 35 % من السعر اى غلاء الاسعار زاد على الشعب البائس 35 %<br />كل حاجة بفلوس<br />د[ *** ] الامتحانات<br />نتيجة الامتحانات<br />كرنية الد[ *** ]<br />انها سياسة الاستعمار<br />سميها استعمار داخلى استعمار محلى استعباد الناس<br />ولكن لازم هتدفع<br />لان حول الجامعة كتيبة امن مركزى عايزة اكل وشرب وعربيات ولبس وسيادتك لازم تدفع"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018134443/http://www.20at.com:80/masr/t7kyk/13727-2009-10-15-15-02-28.html"

