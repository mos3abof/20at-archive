subject = ""
author = "شيخ الازهر"
posted = "2009-10-25"
text = "شيخ الازهر وغيره من اللذين يريدون للمرأة ان تخلع النقاب لهم ادلتهم القوية<br />اولا ربنا قال في القران وقرن في بيوتكن ولا تبرجن تبرج الجاهلية الاولى<br />اذن التبرج ,والسفور هو خروج المرأة من المنزل التبرج<br />واحدى زوجات النبي محمد صلى الله عليه وسلم عندما نزلت هذه الاية لم تخرج من بيتها حتى ماتت<br />ثانيها: ان المرأة في الاسلام لا يجوز الخروج لها الا بمحرم<br />واذا كانت المرأة المنقبة ضربت بنداء رب العالمين وقرن في بيوتكن والخروج بمحرم عرض الحائط وعملت ودن من طين وودن من عجين<br />وبناء عليه يكون النقاب اللي هي لابساه طالما اخلت بشرط وقرن في بيوتكن وشرط المحرم يبقى هي ترتدي النقاب على غير اساس فاصبح نقابلها باطل ومردود عليها<br />وفيه واحد اسمه ابو اسحاق الحويني دا الراس الكبيرة بتاعة الوهابية المصرية شايفه عمال نازل هري في شيخ الازهر<br />يا اخي ما تقول للنسوان وقرن في بيوتكن افضل من وجع الدماغ بتاع حضرتك<br />وقولهم حكم الله في اللي تنتهك اية وقرن في بيوتكن<br />او اللي تنتهك شرط الخروج بمحرم<br />انا عايز حد من وهابي يرد عليا لو سمحتم"
archived = "2009-11-11"
capture_url = "https://web.archive.org/web/20091111191446/http://www.20at.com:80/masr/hot-topics/13727-2009-10-15-15-02-28.html"

[[comments]]
order = 8
subject = ""
author = "وقرن في بيوتكن"
posted = "2009-10-27"
text = "وقرن في بيوتكن<br />بـسم الله الرحمن الرحيم<br />لقد اهتم الإسلام بالبيت المسلم واصلاحه اهتماما بالغا فأمر المرأة أولا بالقرار فيه<br />فقال : {وقرن في بيوتكن ولا تبرجن تبرج الجاهلية الأولي }.أي اقررن واسكن فيها لانه أسلم لكن واحفظ . (ولا تبرجن …) أي لا تكثرن الخروج متجملات متطيبات كعادة أهل الجاهلية الأولى الذين لا علم عندهم ولا دين فكل هذا دفع للشر واسبابه .<br />وأمرها وأمر زوجها بعدم خروجها من بيتها حتي ولو طلقت فقال : ( لا تخرجوهن من بيوتهن ولا يخرجن ).ويشاركها الرسول – صلي الله عليه وسلم – في المسؤولية مع الرجل فيقول : \" والمرأة راعية في بيت زوجها ومسؤولة عن رعيتها \" إذ \" لا يصلح أخر هذه الأمه إلا بما صلح به أولها \" كما قال الإمام مالك رحمه الله<br />ـــــــــــــــ ———————————————<br />الى الاخوان المنقبات<br />فهمتوا ولا لسه<br />وخصوصا الموظفات والطالبات"
archived = "2009-11-11"
capture_url = "https://web.archive.org/web/20091111191446/http://www.20at.com:80/masr/hot-topics/13727-2009-10-15-15-02-28.html"
