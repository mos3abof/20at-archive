posted = "2009-10-15"
text = "طب ما كل حاجة في بلدك دلوقتي لازم تدفع رسوم ودمغة وحاجات كتيييير ملهاش لازمة .. ولما تسأل يا جدعان الفلوس دي ايه لزمتها او رايحة فين .. يردوا عليك كونسلتو حافظ الاجابات:انت اصلك مش عارف اي حاجة انت عايش في دنيا تانية البلد بتتحمل كتير وبتطلب منك تساهم بحاجة بسيطة هي الحكومة خلفتكم ونستكم؟<br />فإلى ماما الحكومة ارجوكي .. خلوا عندكم دم وكفاية مص دم الغلابة .. خدوا شوية من الاغنيا<br />على رأي حسن حسني في فيلم غبي منه فيه، مع الاحترام للأغبياء، لو حد خد معلقة كشري من طبق مليان .. هل التاني حيحس …<br />فيرد عليك ساعتها مسئول الحكومة: طبعا لما تاخد المعلقة نغرف احنا بايه؟؟؟؟؟"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018134443/http://www.20at.com:80/masr/t7kyk/13727-2009-10-15-15-02-28.html"

