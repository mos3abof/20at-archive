posted = "2010-01-04"
text = "مش للدرجادى يعنى .. صحيح انا مش باركب المترو كتير بس ماشفتش فى المرات اللى ركبته فيها حاجات زى دى.<br />فعلا فيه باعه متجولين .. فعلا فيه زحمه .. بس بردو لسه فيه اخلاق و زوق عادى..<br />يعنى انا بس كنت باحس ان المشكله فى الزحام لكن كل الناس بتفتح الشبابيك عادى و بتراعى الذوق العام ( على قد ما شفت يعنى) الله اعلم بس بلاش نبأه متشائمين اوى كده"
archived = "2010-01-15"
capture_url = "https://web.archive.org/web/20100115072328/http://www.20at.com:80/banat/variety/14329.html"
