text = "فعلا بجد انا مش بحب اركب المترو خالص…زولو حصل واضطريت انى اركبوا استحالة اركب عربية السيدات ..دة بتبقى بهدلة والسيدات بيكونوا فى قمة قلة الذوق.. وتحسى ان المترو والعربية دة بالذات بتاعتهم من كتر ما بيروحوا وبيجوا فية.. سواء بقى شغل او لاقدر الله الجامعة"
archived = "2010-01-15"
capture_url = "https://web.archive.org/web/20100115072328/http://www.20at.com:80/banat/variety/14329.html"

[[comments]]
order = 33
subject = ""
author = "nony"
posted = "2009-12-27"
text = "بجد لو كل انسان كان بدأ بنفسه مكناش هنوصل للمرحله دى لكن عيب بلدنا كلمه واحده بس كل الشعب بيقولها (هى جت عاليا ) والله لو بطل كل واحد يقول الكلمه دى و انتبه لافعاله و تصرفاته كل الظواهر دى هتقل كتير بس برده معتقدش انها ممكن تختفى لان كل شئ فى الدنيا لازم يكون ليها او فيها عنصر فاشل بس المصيبه لو كان ده اللى بدأ يسيطر"
archived = "2010-01-15"
capture_url = "https://web.archive.org/web/20100115072328/http://www.20at.com:80/banat/variety/14329.html"

[[comments]]
order = 34
subject = ""
author = "nnnnnnnnnnnnnn"
posted = "2009-12-27"
text = "المترو مهما كان اللى بيحصل فيه فهو اسرع وسيله مواصلات غير كده اليوم كله هيضيع فى المواصلات انا شوفت حاجات من اللى بتحكى عليها دى البياعين والرزحمه بقه ياعنى حاجه مش محتاجه كلام بدخل بقوه الدفع وبخرج بقوه الدفع<br />بس احنا نقدر نحد من التصرفات دى بان كل واحد يلتزم باداب المكان ويحاول ينصح اللى بيعمل كده<br />وشكرا على مقاللك اللذيذ ده"
archived = "2010-01-15"
capture_url = "https://web.archive.org/web/20100115072328/http://www.20at.com:80/banat/variety/14329.html"

