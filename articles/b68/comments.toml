[[comments]]
order = 0
subject = "ليس هناك حب با لأكراه"
author = "ريحانه"
posted = "2006-06-28"
text = "ليس هناك في اي ماكان على وجه هذه الأرض حب يأتي بالأكراه ...وأن تعددة المصطلحات اللغويه فاالنتيجه هي نفسها لاتتغيرفي مضمونها وجوهرها...فمثلا الأنسان الواعي والمدرك الحقيقة معنى الحب ويقدس تلك الروابط التى توحدها هذه الكلمه لا يمكن أن يعيش قصة حب لم يجد في ذات نفسه الشعور بالرضا عن تلك العلاقه لان نفسيته الفيسلوجيه لاتنسجم مع نفسية الطرف الأخر وبتالي لن يكون هناك توافق مابين الشخصيتين وستأدي بهم تلك العلاقه الى الأنهيار ام في منتصف الطريق او في نهايته وتلك أشارة وتنبيه لكل من يبتغي أن تكون علاقته بغاية الرضا ولاقتناع بأن لايعقد علاقة هي بالأكراه ويسعد مسائكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114941/http://www.20at.com/article2.php?sid=68"

[[comments]]
order = 1
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-19"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114941/http://www.20at.com/article2.php?sid=68"

