[[comments]]
order = 4
subject = "غباء X غباء"
author = "أيمو"
posted = "2006-03-31"
text = "اهو هو دة الغباء بعينة اننا نسيب الموضوع الكبير ونقعد ناخد المواضيع الصغيرة فمين..<br />انا من رايى ان اخواننا الاقباط عايشين عصر لايمكن ينسوة لان مع اقليتهم بس واخدين كل حقوقهم واللى يقول غير كدة ويروح يشتكينا للأمم المتحدةوأمريكا يبقى مش مصرى ولا نتشرف انة يكون واحد مننا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022304/http://masr.20at.com:80/article.php?sid=66&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 5
subject = "جحا يقر ويعترف"
author = "جحا المصري"
posted = "2006-04-13"
text = "اقر واعترف انا الموقع اعلاه اننا الاقباط نعيش في ازهي العصور حيث اننا اقلية نتمتع بكل الحقوق وزيادة شوية ومعافون من الواجبات الا ان اقباط المهجر الخونة العملاء يدعون بوقوع 23 قتيل مسيحي اثناء غزوة الكشح المباركة وتم حرق منازل الاقباط ومحالهم في الكشح ومدينة السلام واولاد طوق ومركز المنشأة وتكررالاعتداءات علي المسيحيين بشكل مسلسل في غزوة الاسكندرية وغزوة العديسات وفاو وكفر دميان ابوقرقاص وبني والمس قرية قصر هور ويعوزني الوقت لو ذكرتها غزوة غزوة والعجيب في حادثة الكشح حكمت المحكمة سنة علي كل مجاهد قتل مسيحي وتم خروجهم من المحكمةلمنازلهم لانهم سبق احتجازهم سنة علي ذمة الغزوة وهذه هي العدالة ةالاخوة والا فلا ربنا ليس لنا غيرك معين انت وحدك ياالله العادل القادر علي تخليصنا من افواه الذئاب لان بوش لا يستطيع ان يحمي حتي نفسه ولا ننتظر قوة ارضية بل اياك ننتظر يارب الجنود"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022304/http://masr.20at.com:80/article.php?sid=66&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"
