author = "ممدوح أحمد فؤاد حسين"
posted = "2009-11-14"
text = "من أجلك أنت<br />نسحل المعارضين والمعارضات<br />وليس لهم حقوق وعليهم الواجبات<br />لنا عليهم السمع والطاعات<br />ومن حقنا تزوير الأنتخابات<br />نذبح الأخوة ونستحيي الأخوات<br />وليس لنا في فرعون العظات<br />نحارب الفضيلة والمحجبات<br />ونشجع الرذيلة والعاريات<br />نقهر العفة والمنتقبات<br />ونحمي الراقصات<br />نأمر بالمنكرات<br />وننهي عن المعروف والخيرات<br />نحرم المباحات<br />ونحل المحرمات<br />بمياه المجاري نفسد الزراعات<br />وللمنافقين الكافيار والجاتوهات<br />نحشر الشعب في الحجرات<br />وللهباشين والسلابين القصور والفيلات<br />ونحشرهم أيضا في المواصلات<br />وللمسبحين بحمدك الطائرات<br />ففي أيدينا الأرزاق والخيرات<br />مرحبا بأهل الثقة والطاعات<br />وسحقا لأهل الخبرات والقدرات<br />لا نبالي بالكفاءات ولا بالاعتراضات<br />فنحن نسخر لك الشعب تسخير الحيوانات"
archived = "2009-12-12"
