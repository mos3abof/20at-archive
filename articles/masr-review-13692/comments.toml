author = "نوتى نوتى"
posted = "2009-10-13"
text = "يعنى اية نوتى نوتى<br />هو اى كلام وخلاص<br />وهو علشان واحدة كسبت قرشين من اى طريق وعملت بهم تجميل بالسيلكون ونفخت صدرها وكبرت شفايفها وصغرت مناخيرها هتفرض نفسها على الاطفال<br />التجميل ينفع فى الشكل انما الدم يلطش<br />بصراحة دمها يلطش<br />ولا يمكن مساواة الاشكال دى بمطربة اطفال جذابة غنت للاطفال زى الست صفاء ابو السعود وغنى ورائها الاطفال من الخليج للمحيط وادخلت البهجة بيوتنا باغنية اهلا بالعيد اهلا بالعيد<br />الاشكال المرتزقة دى ترجع بلادها فية هناك وظائف خالية كثيرة لامثالها فى بارات وملاهى شارع الحمراء فى بيروت والعرب بيدفعوا هناك بقشيش كويس"
archived = "2009-11-13"
capture_url = "https://web.archive.org/web/20091113101654/http://www.20at.com:80/masr/review/13692-2009-10-12-17-04-33.html"

