posted = "2009-10-13"
text = "يا دعاء أنا بتابع مقالاتك وهى أغلبها ظريفه وليها هدف<br />بس مش فاهم أيه المقاله ده<br />هو ليه أختيار الموضوعات بقى فى مشكله كبيره فى الموقع<br />يا ريت أختيار الموضوع يكون بعد تفكير كتيييير<br />انتى بتقدمى حاجه للشباب<br />اختارى الحاجه إلى تفدهم<br />مش مقاله كتبناها وخلصنا الواجب وخلاص<br />وتقلى تحياتى"
