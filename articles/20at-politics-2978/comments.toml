posted = "1999-11-30"
text = "\"البراءة من المشركين\" هو شعار ألزم الخميني حجاج بيت اللّه الحرام برفعه وترديده في مواسم الحج، من خلال مسيرات أو مظاهرات تتبرأ من المشركين من خلال ترديد هتافات بهذا المعنى، من قبيل \"الموت لأمريكا الموت لإسرائيل\"، باعتبار أن الحج يجب أن يتحول من مجرد فريضة دينية عبادية تقليدية الى فريضة عبادية و سياسية.<br />وقد أثار رفع الشعار المذكور حساسية السلطات السعودية واعتبرته أمرا منافيا للمظهر العبادي لفريضة الحج، ففي عام 1987 قام الحجاج الإيرانيين بتسيير مظاهرات حاشدة خلال أداء هذه المراسم، مما أدى الى حدوث مصادمات شديدة بين قوات الأمن السعودي وجموع المتظاهرين تسببت في سقوط 402 قتيلا…<br />…KIDA NEFHAM KOL 7AGA"
