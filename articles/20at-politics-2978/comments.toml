text = "بداية لا أملك إلا أن أشكر الأستاذ الغامدي على تقريره الرائع، وقيامه بتحليل القضية من الأف للياء لأني سبق أن قرأت تقري لكم باسم الشيعة احتلوا الحرم … وما كنتش فاهم من حاجة<br />أما الآن فالصورة كاملة… جهد طيب يا عشرينات… وموضوع رائع<br />ونتمنى من الإخوة الشيعة أن يتعقلوا ، وربنا يهدي الجميع"
