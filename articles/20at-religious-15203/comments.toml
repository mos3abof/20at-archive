text = "و هو يعني خلاص المسلمين عرفوا دينهم قوي عشان يروحوا يسألوا عن حرمانية الفيس ؟؟<br />يا جماعه احنا عايشين ف البالوظه و بعاااااااااد قوي عن الدين …<br />نشوف بس يعني ايه اسلام و يعني ايه عقيده و يعني ايه فقه و مصلح و حيث و تفسير و و و …<br />اظن ساعتها موش هانبقي فاضيين اساسا اننا ندخل لا ع الفيس بوك و لا حتي (لج ) بوك"
