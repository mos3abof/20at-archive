posted = "2010-02-06"
text = "eek:<br />على فكرة يا جماعة مش شرط ان يكون الكلام ده يشمل كل الناس الى بيدخلو على الفيس بوك لان اى حاجة فى الدنيا من نستخدمها فى الخير او فى الشر زى الومبايل او الدش النت او او او الموضوع يرجع للشخصية الى بتتدخل ان هو اصلا عندة استعداد ان يعصى ربنا هيعصية على الفيس وفى التليفون وعلى الشات والى عايز يطيع ربنا هيطيعة ولو وهو ماشى فى الشاع او مع اصحابة فى النادى وبرده لازم نخلى بالنا ونغلق باب الشيطان فى اننا مش اى حد نضيفة وخلاص لازم تتاكد انه من نفس جنسك على شان نبعد نفسنا عن الغلط وربنا يحميا كلنا من مكائد الشيطان وان يرنا الخير خيرا ويرزقنا اتباعة ويرنا الباطل باطلا ويرزقنا اجتنابة"
