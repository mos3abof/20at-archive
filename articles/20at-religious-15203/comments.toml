posted = "2010-02-04"
text = "ياجماعه حرام عليكو تنشروا كلام زى ده…اى حد غير مسلم لما يراه هيفتكر اننا ناس متزمتين وان الاسلام دين التطرف<br />لو سمحتوا لما تحبوا تكتبوا رأى فضيله الشيخ .. ابقوا وضحوا ان رأيه ده بيمشى عالناس اللى بتستخدم الموقع بطريقه غير شرعيه او بطريقه غير مسئوله<br />حرام عليكوا بقا .. سؤ نا صورة الاسلام فعيون غير المسلمين"
