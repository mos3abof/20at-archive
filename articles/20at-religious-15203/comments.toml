text = "أظن الشيخ كان يقصد بذلك الرد علي حالة معينة<br />لأن الفيس بوك موقع كبيــــــــــــ ر وفيه كل الاهتمامات منها الحرام فعلا ومنها الحلال ومنها المباح<br />فأظنها فتوي وليست حكما عاما<br />او اظنه يقصد هذا"
