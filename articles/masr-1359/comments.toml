posted = "2006-12-29"
text = "البلد مش ممكن تثوراوتتحرك طالم فيه اكثرمن حوالى 70% فلاحين ويبقى الطلائع يتحركو بالعصيان المدنى باتبع الاتى<br />1- تبدا بالخبط فى الحلل فى ساعةمحددة وليكن الساعة 10 مساءا فى احد الاحياء<br />2- ينشر عن ذلك ويزاد عدد الاحياء انهفىحى كذا الناس انضموا الى الثوره<br />3- كل ليله يزداد العدد لغاية البلد كلها تخبط فى الحلل ( قاعدين ماتقومو تروحو اوتكسحو"
