[[comments]]
order = 0
subject = "انا مبحبش الاتنين"
author = "Max"
posted = "2006-12-25"
text = "الموضوع اسمه عام الاضطرابات والانتكاسات يعنى المفروض ان المعنى يكون من مغزى الموضوع من غير فرقعة وخلاص انا ملاحظ ان كل التعليقات اخوانية ده المفروض حصاد السنة ولا انا اتعميت المفروض يبقى شامل جميع الاطراف اخوان ووطنى والناس التانية الموجودة نسمع جميع الاطراف عشان نعرف نميز بين الكويس والى بيستعبط علينا انا مبحبش ولا الوطنى ولا الاخوان احنا عيزين ناس تانية بلاش نتحيز مع حد ضد حد فين المحايدة الموضوع كان هيبقى جميل لو كان شامل جميع القوى السياسية ولا ايه رايك وشكرا على الموضوع"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224803/http://masr.20at.com:80/article.php?sid=1359"

[[comments]]
order = 1
subject = "يا مكس"
author = "أراء تانية أيه بس وإنت عايش فى فساد رأى الحزب الوطنى بقالك 26 سنة وكاتم على نفس المعارضة كلها من حق المعارضة ومن حق الإخوان المسلمين أنهم يقولوا رأيهم لكن مش من حق الحزب الواطى إللى فساده بقى للركب إنه يقول أى رأى لإن كل الآراء إللى ها تتقال علشان ننقذ مصر من فساد الحزب الوطنى والحاكم وحكومته إللى بيعانى منه الشعب كله من رشوه ومحسوبية وبطالة ونهب وسرقة وبيع أملاك الشعب وكبت الحريات آراء إيه وهباب إيه إللى إنت عايز تسمعه من الحزب الواطنى برأيسه وأبنه وحكومته"
posted = "2006-12-26"
text = "اللهم أنقذ مصر من فسادهم اللهم آمين<br />اللهم أعز المصريين بطرد مبارك من الحكم اللهم آمين"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224803/http://masr.20at.com:80/article.php?sid=1359"

[[comments]]
order = 2
subject = "حصاد 25عام من الانجازات المباركية"
author = "فارس_fr"
posted = "2006-12-26"
text = "بعد مرور 25سنة من الانجازات المباركية بحسب جريدة الجمهورية , فلا يحق للمواطن العبيط ابن العبيط ان ينكر ما انعم عليه الطاغوت الاعظم مبارك من نعم خلال هذه الاعوام وخلال هذا العام بالذات تحققت العديد من الانجازات , منها انالشعب مازال يحكم بيد من حديد ونار , اعزرونى المصيبة كبيرة والوكسه اللى احنافيها خلاص خلت الواحد اتجنن , نفسي افهم حاجه الناس مستنيةايه بعد كل المهانه اللى بتعرض ليها مع كل طلعة شمس فى البلد دى , انا خلاص مش عارف اقول ايه بس حبيت انقل لكم بعض الانجازات , والتى لا تخفى عليكم فى عهد اللامبارك منها :-<br />- لسه بنعيش فى ظل قانون الطوارئ المجيد .<br />- لسه الطلبة بتتهان فى الجامعات وبلطجية الحزن الوطنى يعتدوا عليهم .<br />- لسه رغيف العيش غالى وحالته تعبانه<br />- لسه الطماطم ب6جنيه والبصل ب4 جنيه<br />- لسه المواصلات زحمة واتوبيساتها تعبانه<br />- لسه التعليم حالته لا يرثى لها من سئ الى اسوا .<br />- لسه فيه على حد علمى 8 مليون عاطل عن العمل .<br />- لسه فيه كام عانس فى البلد متجوزتش<br />- لسه فيه تزوير فى الانتخابات<br />- لسه فيه تعذيب فى السجون واغتصاب وانتهاك لادمية المصري .<br />- لسه مبارك وزبالته مستمرين فىحكم بهية<br />- لسه ابواق الفساد والاقلام الفاسدةامثال حمدى رزق وكرم خبر\" بتضمضم وبقبق\" للحكومة وانجازاتها .<br />- لسه عندنا جرائد زى الاهرام والجمهوريه<br />- لسه الغاز الطبيعى بيصدر لاسرائيل ببلاش<br />- لسه البترول فى جعبة امريكا لننال الرضا السامى .<br />- لسه فيه فضائيات زى العربية وروتانيات<br />- لسه البلد مليانه علمانيين وليبراليين ومدعى الثقافه .<br />- لسه الاثار بتتهرب خارج مصر<br />- لسه الخصخصة شغاله وسرقه المال اعام<br />- لسه الحوادث شغاله ويروح معاها الالاف من الغلابه .<br />- لسه امين الشرطة والعسكرىالمعفن له قيم<br />اقرأ بقية التعليق .."
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224803/http://masr.20at.com:80/article.php?sid=1359"

[[comments]]
order = 3
subject = "اشمعنا دلوقتى يا ريس"
author = "رئيس تحرير"
posted = "2006-12-26"
text = "رئيس تحرير<br />حاولت جاهدا ان لا اكتب مقالا وادون اى شىء وان اهيأ نفسى لاستقبال عيد الاضحى المبارك والسنة الميلادية الجديدة لكن لم استطع فى خضم تلك الاحداث الساخنة والتى انتشرت على الساحة فجأة ولكن اعتقد ان كل هذه الامور مدبرة بدءا من الاخ بيومى رئيس مجلس ادارة شركة الفرسان والذى هرب وكل مساعدى وزير الداخلية كريه العادلى يقسمون بالطلاق انه ما زال داخل البلاد ولكنهم لا يعلمون مكانه ويتهم انه يدير اموالا لحساب الاخوان ثم فجاة شنت قوات الامن حملات على الاخوان واعتقلتهم واتهمتهم بالفساد وغسيل الاموال سبحان مغير الاحوال الاخوان هم من يفسدون وينهبون الاموال اما زبانية الحكومة فاياديهم بيضاء خالية من اى سؤ لا اله الا الله انقلبت الايه وصار الشريف لصا وانقلب اللص شريف ولكن هل المصريون بهذا الغباء هل يعتقد حكامنا اننا لا نتعلم واننا اصبحنا نفهم اللعبة جيدا التوربينى مع اعتصام طلبة الازهر مع اعتقالات الاخوان مع الاعياد التى تجمع المسلمين مع الاقباط والاجازات كل هذا الشو او العرض يرسل السيد رئيس الجمهورية بالتعديلات<br />. الدستورية التى من شانها التمهيد للتوريث هى خلاص زنقت ياريس فى يومين العيد<br />والظاهر والله اعلم ان لن يكون هناك اعياد هذا العام<br />وحسبى الله ونعم الوكيل<br />mego-mego.blogspot.com"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224803/http://masr.20at.com:80/article.php?sid=1359"

[[comments]]
order = 4
subject = "شعب من المجرمين"
author = "ايوب المصرى"
posted = "2006-12-26"
text = "هل من المعقول ان يحكم شعب بقانون الطوارىء لمدة 25 سنة<br />معقول جدا اذا كان هذا الشعب من المجرمين والخارجين على القانون ومعظمة من قطاع الطرق ويطلقون النار جهارا نهارا وفى كل صباح تدور عربيات البلدية لرفع 5 الاف جثة من الشوارع يوميا<br />فى تلك الحالة يجب عمل قانون طوارىء لهذا الشعب المجرم ووضعة فى القفص وفتح المعتقلات والصرف عليها بدل الصرف على المدارس والمستشفيات<br />ولكننا شعب لا يهش ولا ينش واغلب من الغلب وبيصلى العشاء وينام وبيعرف ربنا فلماذا الاعتقالات والطوارىء<br />هل الغرض اذلال الناس<br />هل الغرض قهر الشعب المقهور اصلا<br />هل الغرض ضرب المربوط يخاف السايب<br />فى اى قرن نحن نعيش<br />عجبى وعجبى وعجبى"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224803/http://masr.20at.com:80/article.php?sid=1359"

