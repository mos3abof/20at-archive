[[comments]]
order = 9
subject = ""
author = "وزير الثأاافة"
posted = "2009-09-25"
text = "هى فين الثأاافة فى بر مصر علشان يعملوا لها وزير<br />اية اللى تبع وزير الثاأافة<br />مصلحة الاثار وبس ويمكن جعلها مصلحة مستقلة<br />زمان ايام الاتحاد الاشتراكى كان فية سينمات ومسارح ودور عرض وقصور ثقافة ومكتبات كلها تبع القطاع العام وفاروق بية حسنى باع كل حاجة وخلاص ومعدش حاجة<br />والتليفزيون بقى تبع وزارة الاعلام<br />يبقى لزمة وزير ابن نطع اية<br />ما يغور فى ستين داهية ويلغوا الزفت الوزارة دى<br />بلد فيها عجز موازنة وبتتسول وعاملة الفين وزير ومحافظ بدرجة وزير"
archived = "2009-09-27"
capture_url = "https://web.archive.org/web/20090927015837/http://www.20at.com:80/masr/2khbar/13504-2009-09-23-22-40-29.html"
