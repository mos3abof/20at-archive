order = 0
subject = ""
author = "فاروق مخبر امنى"
posted = "2009-09-23"
text = "الذين زاملوا فاروق حسنى فى بعثاتهم اثناء دراسة الدكتوراة فى باريس كتبوا ان فاروق حسنى كان مخبر امنى<br />كان يكتب تقارير عن الطابة المصريين الذين يدرسون الماجستير والدكتوراة فى باريس يكتب عنهم تقارير لجهات امنية فى مصر<br />وكان عين الحكومة او امن الدولة على هؤلاء الطلبة<br />والمطلوب من النظام ان يتخلص منة بعد وقوفة ورائة ودعمة الى اقصى حد واعتبار نجاح حسنى نجاح لهم<br />ادفنوا الميت فريحتة بقت وحشة قوى"
archived = "2009-09-27"
capture_url = "https://web.archive.org/web/20090927015837/http://www.20at.com:80/masr/2khbar/13504-2009-09-23-22-40-29.html"

[[comments]]
order = 1
subject = ""
author = "وزير حكومة الطوارىء"
posted = "2009-09-23"
text = "كيف يختار لليونسكو ممثلة الثقافة فى العالم وزيرا فى حكومة دولة محكومة بقانون طوارىء لمدة 28 سنة ؟<br />كيف يختار لليونسكو رجلا من حكومة تحبس الصحفيين وتعتقل المدونين وتحبسهم وتعذبهم فى سجن برج العرب ؟<br />اليس المدونين المحبوسين فى قضية راى يمثلون ثقافة والصحفيين التى تصدر عليهم الاحكام<br />لا يحق للنظام المصرى ان يستغفل العالم ويقدم مرشحا يمثل التخلف فى العالم ليتولى منظمة ثقافية<br />عن اى ثقافة يرشح نفسة وبلدة تمارس التعذيب على المواطنين فى اقسام الشرطة والمعتقلات<br />عن اى ثقافة يترشح وبلدة تقدم المدنيين للمحاكم العسكرية<br />صلحوا انفسكم اولا من الداخل ثم تقدموا للخارج<br />اصلاح ذات البين اولا<br />اصلاح مصر اولا"
archived = "2009-09-27"
capture_url = "https://web.archive.org/web/20090927015837/http://www.20at.com:80/masr/2khbar/13504-2009-09-23-22-40-29.html"

[[comments]]
order = 2
subject = ""
author = "فو فو اخت سعاد"
posted = "2009-09-23"
text = "اولا من عو فاروق حسنى ومن يمثل ؟<br />فاروق حسنى ليس لة اى علاقة بالثقافة فهو رسام درجة عاشرة ولم يسبق لة كتب كتاب او تزعم تيار فكرى معين او ناهض فكر معين بل مجرد رسام<br />ثانيا يمثل من فاروق حسنى الوزير لمدة 23 سنة متصلة اذ انة لم يحدث ابدا ان وزيرا فى اوروبا ظل على كرسية مدة 23 سنة ولا فى اشد عصور اوروبا ظلاما الا اذا كان نظاما سلطويا ديكتاتوريا متجمد وجامد ولا يؤمن بالتغيير واصبح عالة على العالم<br />كان اختيار البرادعى للطاقة النووية رغم انة محامى لانة شخصية عامة وليس وزيرا او مسئولا حكوميا وانما نزيها<br />رابعا ان فاروق لم يرشح نفسة لهذا المنصب وانما اختارتة القيادة السياسة ودعمتة ووقفت ورائة فهزيمتة هى هزيمة للقوة السياسة التى شاخت وقرف منها المجتمع الدولى<br />وكانت الانتخابات نزيهة واختاروا الممثل الجيد لتولى المنصب"
archived = "2009-09-27"
capture_url = "https://web.archive.org/web/20090927015837/http://www.20at.com:80/masr/2khbar/13504-2009-09-23-22-40-29.html"

[[comments]]
