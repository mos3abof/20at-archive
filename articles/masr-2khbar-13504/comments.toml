posted = "2009-09-23"
text = "يا حسني انت راجل عربي<br />وقبل كده طبخوها مع بطرس غالي مع انه مسيحي<br />ولكن المشكلة في لسانه العربي"
archived = "2009-09-27"
capture_url = "https://web.archive.org/web/20090927015837/http://www.20at.com:80/masr/2khbar/13504-2009-09-23-22-40-29.html"

[[comments]]
order = 4
subject = ""
author = "200 مليون دولار"
posted = "2009-09-24"
text = "200 مليون دولار تكلفة الحملة الانتخابية كما ذكرت الصحف للسيد فاروق حسنى<br />200 مليون دولار من فلوس الشعب اللى بيشرب من المجارى<br />200 مليون دولار سفريات وبدلات واقامة فى فنادق 5 نجوم وفسح وعزايم لوفود ورشاوى علشان روقة ينجح<br />200 مليون دولار دعاية لفاروق حسنى<br />ويقول لك ادفع ضرايب فى الاعلانات وامسك دفتر<br />200 مليون دولار ويقول لك ارمى ورا ضهرك<br />هما دافعين حاجة من جيب ابوهم<br />اتفو<br />اتفو<br />اتفو"
archived = "2009-09-27"
capture_url = "https://web.archive.org/web/20090927015837/http://www.20at.com:80/masr/2khbar/13504-2009-09-23-22-40-29.html"

