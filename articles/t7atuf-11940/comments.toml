posted = "2009-05-03"
text = "انا مواطن مصرى مسيحى قبطى اؤيد بكل شدة زبح و حرق الخنازير<br />سلامة مصر و شعب مصر اهم مليون الف مرة فوق كل اعتبار<br />لتذهب الخنازير الى الجحيم خيرا ماليون الف الف الف مرة من زهاب مصر و شعب مصر الى التهلكة و الجحيم"
archived = "2009-05-19"
