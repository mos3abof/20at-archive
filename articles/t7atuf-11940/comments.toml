[[comments]]
order = 2
subject = ""
author = "الى زخاري"
posted = "2009-05-03"
text = "الى زخاري بصفتك مسيحي<br />عايز اعرف ايه علاقة الديانة المسيحية بالخنازير<br />بالله عليك<br />قولي سبب واحد يخلي المسيحي في اي مكان بالعالم او في اي ملة يتعلق بالخنازير<br />هل سيدنا المسيح اوصى باكل لحم الخنازير مثلا<br />ممكن تقولي اي اثر للعلاقة بين الخنازير والديانة المسيحية<br />منذ فترة جه مرض جنون البقر وبريطانيا كانت تحرق البقر حرقا<br />وبعدين انفلوانزا الطيور وكانت الطيور تحرق حرقا<br />ليه بقا الكل زعلان على الخنازير<br />هو علشان خاطر ربنا حرم لحم الخنزير في القران اصبحت مقدسه عند اعداء القران<br />الشيخ الشعراوي قال في تفسيره ان هذا المخلوق غير معد للاكل اصلا<br />لانه حيوان صديق للبيئة والوظيفة التي خلقه الله من اجلها هي اكل القمامه<br />ولم يخلقه الله لكي ياكله الانسان<br />هذه هي حكمة تحريم اكل الخنزير في الاسلام<br />ممكن يا استاذزخاري تقولي ايه سبب ارتباط الخنزير بالديانة المسيحية<br />وشكرا"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519042328/http://www.20at.com:80/t7atuf/11940-2009-05-03-08-33-48.html"

