[[comments]]
order = 10
subject = "حياتي مقابل حرية شعبي"
author = "رائد بغدادي"
posted = "2006-05-10"
text = "كتب مكسيم هذه العبارة يوما فأصبح مسموما في اليو م الثاني وهو تحت الاقامة الجبرية التي فرضها عليه ستالين وهومؤسس المدرسة الواقعية الاجتماعية وكان مقربا من لينين كتب رواية الام التي اصبحت تدرس في كل جامعات امريكا واورباورواية الطفولة التي تدرس في مناهج الأدب الأنكليزي هذا العملاق الذي سميت بأسمه صروحا عديدة يتجرأ بعض الطفيليين والفضوليين على الادب ويتهجموا عليه أسألكم بالله ماذاقدمتم لشعوبكم فمكسيم قدم حياته لشعبه .<br />أما آن ان تقبلوا يد موقع عشرينات لتشكروهم على تنوير هذه العقول المتصدئة بوحول الجاهليه اما آن ان تعرفوا ان جاهليتكم هي الوتر الذي لعب عليه الغرب ومسح بها كرامة العرب .<br />عزيزتي مروة بأسم مكسيم اشكرك ومبارك لك هذه الخطوة الجليله وتقدمي فلقد دفن الادب من دواووين العرب حتى صار المتنبي وابو نؤاس يدرسوا في جامعات امريكا وندرس مايمليه شارون علينا في جامعات العرب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132019/http://www.20at.com/article2.php?sid=777"

