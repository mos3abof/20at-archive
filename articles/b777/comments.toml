[[comments]]
order = 3
subject = "اخيييييييييه عالجهل"
author = "الافندي اللي بيقول ليت العرب يكون فيهم مثل ماكسيم.... يا ريت ينقطنا بسكاته .... فان كنت لا تعلم فلا تعمم."
posted = "2006-05-07"
text = "انا على استعداد أن آتيك بسير ابطال من العرب قديما وحديثا يسقط اما عظمتهم عشرات من هذا الماكسيم.<br />والافندي التاني اللي بيترحم على هذا الكافر او الملحد يتق الله في نفسه ..... لان المرء يحشر مع من أحب.<br />سؤال الله يكرمكم: هو الموقع دا ليبرالي .... تبع اندية الروتاري والفكر الانساني الجديد.... ولا انا غلط؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132019/http://www.20at.com/article2.php?sid=777"

[[comments]]
order = 4
subject = "طيب كمان اخييييييييييييييه"
author = "يعني هو كافر وملحد لا انخذه مثل علي الثوره الوتمرد وانه عاش لفكره واراد لشعبه الخير هو كل واحد حتي لو من الغرب نجد سيرته جميله بالنسبه لشعبه نقول عليه كافر وملحد هو فعلا كافر بما امنا به نحن لكن بالنسبه لشعبه هو رجل مؤمن بما هم يؤمنون وشعبه احترمه والاسلام علمنا احترام الاخر وهو رجل ليت بصدق نجد عندنا مثله في الادب الثوري وليس في الكفر يا عم الحاج يعني باختصار ناخذ منه ما ينفعنا"
posted = "2006-05-08"
text = "وبطلو شغل المراهقه ده هشد في شعري من تعليقاتكم قريب<br />بقيت ااقرع خلاص"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132019/http://www.20at.com/article2.php?sid=777"

[[comments]]
order = 5
subject = "ربنا يرحمنا"
author = "مفروسة"
posted = "2006-05-08"
text = "بجد مش عارفه اقول ايه، الله يرحمنا من السادة دعاة التكفير اللي فجأة ملوا الموقع واشبعونا بتعليقاتهم السخيفة<br />والله اللي مالوش في الادب والثقافة مايقراش او يقرا وينقطنا بسكاته وافهمومها بقى الانسان المفكر هو ثروة النمجتمع مش المتخلفين اللي مش فاهمين الدين وعمالين يكفروا في الناس اللهم ارحمنا منهم ونور قلوبهم وماتنساش يا استاذ يابتاع الكفر انت ان الرسول صلى الله عليه وسلم كان يجعل الاسرى(الكفار) يعملون المسلمين الاوائل القراءة والكتابة فاين انت من رسولنا الكريم والله يرحمك ياجوركي وميت فل يامروة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132019/http://www.20at.com/article2.php?sid=777"

