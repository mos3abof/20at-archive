text = "بغض النظر عن ان الدكتور حواس يستاهل انه يتعالج على حساب الدوله ام لا . بس احب اسالسؤال اشمعنىدايمااللىبيتعالج علىحساب الدولة واللىبيتصرف عليهم الالوفاتمنالمالالعام \" الممثلين والمشاهير وعلى حد كلامك المبدعين \" طب والغلابة المصابين بجميع انواع الفيروسات والسرطانات , الغلابةاللى حالتهم تعبانه ومش قادرين يتعالجوا حتى فى القصر العينى من يستحق الاشادة لانه ساعدهم ,,, وبعيدن ياسيد مجدى انت زعلان ان صحيفة حكومية قومت الدنيا عشان اى حركة للرئيس , ما انا قلت قبل كده انها دعارة صحفية بتقوم بيها الصحف الحكومية وغيرها زى صحيفتك برده .<br />معلش لو كان موضوعك وزعلك على الناس اللى مش لاقيه العلاج كان احسن من زعلك من صحيفة الاهرام الحكومية ,, ياريت ياسي مجدى نهتم بالناس الغلابةشوية , خلونا بعيد عن المشاهير والفنانين اللى يقدروا يعالجوا نفسهم بره وجوه . بالمناسبة فيه مثل بيقول \" برة وجوة فرشتلك وانت مايل وايه يعدلك \" .<br />معلش القافية حكمت ."
