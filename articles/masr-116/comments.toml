[[comments]]
order = 2
subject = "كان زماااااااااااااااااااااااااااان"
author = "نيفين"
posted = "2006-04-12"
text = "بيقوللك مره واحد ركب قطر الصعيد علشان يروح يزور جرايبينه القطر اتحرق بس ربنا نجاه<br />مره نفس الواحد ركب اتوبيس الموت و كان رايح مشوار و الاتوبيس انقلب بس برده ربنا نجاه<br />نفس الواحد مره ركب عربيه وراح قصر ثقافه بنى سويف و اتحرق المسرح و ربنا نجاه<br />مره نفس الشخص راح يحج و رجع على عباره السلام و غرقت و ربنا نجاه<br />مره نفس الشخص اللى عايش ف مصر و الللا ربنا نجاه كتير بس هو منتظر الموت برده لسه فيه انفلونزا الفراخ و لسه فيه الكوسه و لسه التعتيم و لسه ريحه الفساد اللى فاحت<br />يا رب تكون النكت عجبتكم<br />و خدو دى كمان<br />اجمل هديه تقدمها للمدام رحله على عباره السلام<br />كانت هذه اخر النكات المصريه فى عيد الحب الماضى<br />وسلمولى على النكت"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211506/http://masr.20at.com:80/article.php?sid=116&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

