order = 0
subject = "لما الضحكة تتسرق يضحكوا ازاي"
author = "سنووايت"
posted = "2006-04-04"
text = "لما كل بيت فيه مريض سرطان بسبب الحكومة<br />مش علشان ده امر ربنا -<br />لما الناس مرمية على الارصفة في الشوارع ماسكه روشتات ادوية وبتشحت علشان تتعالج<br />لما مرضى القدم السكري محجوزين في الدمرداش على سراير معفنه وعنابر ضلمة مرعبة والمرض بيسحف في رجلهم وكل كام شهر لما يفتكروهم يدخلوهم يقطعوا حته من رجلهم اللي \" المدة سحفت عليها: يضحكوا ازاي<br />لما أحلام الشاب تفضل تختصر وتصغر من وظيفة تناسب مؤهله لنادل في قهوة<br />ولما البنت تنتظر انها تبقى ام وليها بيت ميت سنة لحد 30 و35 سنة وبرضه الحلم ميحققش<br />الناس دي كلها تضحك ازاي<br />لو عرفتوا المقهور الغرقان في الهم ازاي يضحك ابقوا قولوا"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211506/http://masr.20at.com:80/article.php?sid=116&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

