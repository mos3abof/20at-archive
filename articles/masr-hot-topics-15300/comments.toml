author = "ابومحسن"
posted = "2010-02-11"
text = "معلش يا جماعة انا عندي اقتراح<br />ونشكر موقع عشرينات لاتاحة هذه الفرصة لنا<br />اقترح<br />بالغاء الثانوية العامة واستبدالها بنظام الثانويات التخصصية<br />مثل التعليم الصناعي والتعليم التجاري ثانوي صناعي وثانوي تجاري ثانوي زراعي<br />يعني كل كلية يكون ليها ثانوية تخصصية<br />كلية الطب يكون ليها نظام ثانوية مخصوص ثانوية علمية مثلا<br />كلية الهندسة يكون ليها نظام ثانوية مخصوص اللي هو الثانوي الصناعي<br />زي كلية التجارة الواحد لما يدخل ثانوي تجاري وما يكملش بيبقى مساعد محاسب<br />على هذا النمط اقترح تقسيم الكليات الى مجموعات وكل مجموعة كليات يبقى ليها ثانوية تخصصية يعني الكليات العلمية زي الطب والعلوم الخ الخ يكون ليهم ثانوية<br />كليات الهندسة والمعاهد الهندسية يكون ليها ثانوية مخصوصة<br />وكده يبقى اللي في الثانوية عارف هو رايح فين ولو ما دخلش<br />متهيألي هو دا الحل اما الثانوية العامة بهذا الشكل ما لهاش لزوم<br />يارب الاقتراح يوصل الى السادة المسؤولين<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ"
