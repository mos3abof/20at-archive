author = "احنا هنخترع"
posted = "2010-02-11"
text = "هى العملية اجتهادات شخصية وفتاوى وكل وزير ياتى يحط لنا نظام واللى بعدة يغيرة<br />زى ما بنستورد سيارات وزى ما بنستورد سجادة الصلاة وبنستورد كمبيوترات - ما نستورد المناهج من برة<br />نشوف اليابان عاملة الثانوية العامة ازاى<br />نشوف الهند الثانوية شكلها اية<br />فى المانيا الثانوية العامة نظامها اية<br />تمام زى ايام الملك فاروق كنا ماشيين على النظام البريطانى والمناهج والمقررات البريطانية<br />العملية سهلة وبسيطة<br />ورسالة من التربية للسفارات دى تفيدها بمقررات الثانوية العامة فى بلادها<br />ونطبق واحد فيهم ونمشى علية<br />ونتهد بقى ونمشى على وضع واحد"
archived = "2010-02-13"
capture_url = "https://web.archive.org/web/20100213081410/http://www.20at.com:80/masr/hot-topics/15300-2010-02-11-16-27-47.html"

