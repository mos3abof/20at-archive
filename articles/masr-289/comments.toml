[[comments]]
order = 0
subject = "جزاكم الله كل خير"
author = "خالد المصرى"
posted = "2006-05-08"
text = "بارك الله فيكم وجعلم زخرا للاسلام ايوه كده هوه ده الشغل فهمو الناس اسلامنا عامل ازاى مش العلمانيين ولاد الهبله ربنا يريحنا منهم ويسقط حسنى مبارك برضه"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235449/http://masr.20at.com:80/article.php?sid=289"

