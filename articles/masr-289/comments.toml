subject = "من علمنى حرفا"
author = "ابوعبد الحمن"
posted = "2006-05-09"
text = "امور فى غايه الاهميه ولكن ننظر اليها على انها بسيطه الاداب الاسلاميه هى اساس الايتيكيت فهى تجعل الشخص فى قمه الرقى بالاخلاق والمعاملات يارتنا نتعلم اللى فى ديننا كويس نصبح افضل من غيرنا كتير"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235449/http://masr.20at.com:80/article.php?sid=289"

