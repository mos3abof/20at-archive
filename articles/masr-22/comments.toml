subject = "اللي خدته القرعه.....!!!!"
author = "sweet_princess"
posted = "2006-03-14"
text = "يا جماعه احب ابشركم ان الراجل دا مش ممكن يسيب الحكم الا (بمعجزه الاهيه) ان ربنا يتولاه برحمته وياخده ..(اااااامين) او يحدث انقلاب وينجح...<br />لكن اللي يقول او يفكر انه ممكن يتنازل عن الحكم بسهوله كدا ..نصيحه يعني (لازم يروح يغسل وشه عشان يتاكد انه ماكانش نايم وبيحلم) ..<br />وبعدين والله اي واحد بييخاف ربنا بجد لازم يهرب من الحكم دا لو اتعرض عليه مش يجري وراه لانه لو يعرف حسابه هيبقى عامل ازاي يوم القيامه كان استعفي من زمان..<br />لكن حتى لو تفائلنا وقلنا انه هيتكل على الله ويعملها..(على راي المثل البلدي القديم ..ما ازفت من ستي الا سيدي) .. قطيعه تقطع حسني على نظيف على الباز افندي على بطرس غالي على .. على (وهلما جرجر ..<br />ما غلطشي الفصيح اللي قال ..... (( اللي خدته القرعه.. تاخده ام شعر ))."
