text = "قصة ذو الخويصرة<br />وعلاقته بأشقى الخلق قاتل علي بن أبي طالب رضي الله عنه<br />عن أبي سعيد الخدري رضي الله عنه قال: بينما نحن عند رسول الله صلى الله عليه وسلم وهو يقسم قسماً، أتاه ذو الخويصرة، وهو رجل من بني تميم، فقال: يا رسول الله اعدل، فقال: (( ويلك، ومن يعدل إذا لم أعدل، قد خبت وخسرت إن لم أكن أعدل )).<br />فقال عمر يا رسول الله، ائذن لي فيه فأضرب عنقه؟<br />فقال: (( دعه، فإن له أصحاباً يحقر أحدكم صلاته مع صلاتهم، وصيامه مع صيامهم، يقرؤون القرآن لا يجاوز تراقيهم، يمرقون من الدين كما يمرق السهم من الرمية، ينظر إلى نصله فلا يوجد فيه شيء، ثم ينظر إلى رصافه فما يوجد فيه شيء، ثم ينظر إلى نضيه - وهو قدحه - فلا يوجد فيه شيء، ثم ينظر إلى قذذه فلا يوجد فيه شيء، قد سبق الفرث والدم، آيتهم رجل أسود، إحدى عضديه مثل ثدي المرأة، أو مثل البضعة تدردر، ويخرجون على حين فرقة من الناس )).<br />قال أبو سعيد: فأشهد أني سمعت هذا الحديث من رسول الله صلى الله عليه وسلم، وأشهد أن علي بن أبي طالب قاتلهم وأنا معه، فأمر بذلك الرجل فالتمس فأتي به، حتى نظرت إليه على نعت النبي صلى الله عليه وسلم الذي نعته. قال: فأنزلت فيه: {وَمِنْهُم مَّن يَلْمِزُكَ فِي الصَّدَقَاتِ}<br />أخرجه البخاري في كتاب: استتابة المرتدين / باب: من ترك قتال الخوارج للتألف ولئلا ينفر الناس عنه رقم: 3414<br />أخرجه مسلم في الزكاة، باب: ذكر الخوارج وصفاتهم، رقم: 1064."
