author = "مريم"
posted = "2007-06-05"
text = "فعلا انا نفسى اوى العب اللعبة دي لانى ارى انها تساهم في شد الجسد وجعلة اكثر جمالا لكن يا استاذه ايمان لم تذكرى في موضوعك هذا الجسم المناسب لمثل هذه الرياضيات وهلى تناسب مثلا الجسم النحيف اكثر ام الممتلأ واين توجد هذه الصالات النسائية التى تتدرب على رفع الاثقال وما هى اسعارها ؟ ارجو الإفاده"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725043717/http://www.20at.com:80/masr/t7kyk/6187.html"

