author = "ايمان"
posted = "2007-06-05"
text = "اولا اللعبه ده موجوده فى اى جيم موجود به اجهزه جنب العاب الايروبكس وكمان اى جسم بيلعبها عادى يعنى النحيف بيتشد ويزاد عضل ويبقى حلو والجسم الممتلئ بيتحول الدهون لعضلات وتكون شكلها حلو لكن اللى انا بقول عنهم بيلعبوا اوزان ثقيله يعنى جسمهم وعضلاتهم يشبهه المصارعين اللى بنشوفهم بس الهدوم مخبيه وهما حابين ده لكن انا مقدرش اعمل زيهم والتكلفه حسب الجيم اللى بتروحيه حسب من 150 فى اقل فى اكتر حسب امكانيات الجيم ومكانه ومدربينه وتقدرى تسالى عن اقرب جيم فى منطقتك"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725043717/http://www.20at.com:80/masr/t7kyk/6187.html"

