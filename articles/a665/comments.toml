[[comments]]
order = 2
subject = "الموساد الاسرائيلي"
text = "احنا يا باشا ما نحبش نقول غير السليم .. الموساد الي عمل هادي العملة الوحشة عشان يضرب علاقة شارون بسيادة الريس المفدى (رعاه الله و ارضاه) لكن انا بحب اقول للموساد (طء موت) علاقة الريس المفدى رعاه الله و ارضاه قوية و متينة بشارون و ما تنهزش لو شو ما صار ..<br />و بعدين الموساد دا طلع عبيط هو زي ما تعاون مع الشيخ البطل المناضل المكافح (الاسامة اسامة بن لادن) في ضربات سبتمبر بفكر يعني يخرب علاقة الريس مع الاخوان المسلمين .. دا صراحة اعبط من العبيط<br />الموساد دا يا شباب طلع عبيط منو و فيه .. دا طلع هاني رمزي بالزبط ..<br />و بحب اشكر حكومة شارون على تعاونها مع الريس في حل الازمة (طبعا دا شارون و الريس اخوات) و بقول لشارون ما يهمكش انفجار طابا دا انتا حلو و عاقل ..<br />الله يفرجها على العرب و المسلمين يا شيخ"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018190216/http://www.20at.com:80/article.php?sid=665"

[[comments]]
order = 3
subject = "وائل عباس اكتسرا"
text = "ما بالش الاشتغالات دى...<br />الحكومة بنت ستين..... واسرائيل بنت مية وعشرين....<br />انبوب غاز لا ده تلاقيه بمب رمصان....<br />بقى الوهابين بتوع السعودية دول عاوزين يصوموا رمضان....دول لو اصادى حاطلع ......ابوهم"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018190216/http://www.20at.com:80/article.php?sid=665"

[[comments]]
order = 4
subject = "وائل عباس اكسترا اكسترا"
text = "(سنطرد من أراضينا كل أجنبي سيخرق صوم أيام شهر رمضان المبارك<br />القائل: بيان وزارة الداخلية السعودية )<br />التعليق:<br />ياختي كميلة عين امه<br />جبت التايهة يا واد<br />نورت عدالة المحكمة<br />ده ايه عبقرية اهلك دي<br />ده انت ما جابتكشي ولادة<br />الهي وانت جاهي تفضح وزارة الداخلية السعودية فضيحة هندريك شون قادر يا كريم!!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018190216/http://www.20at.com:80/article.php?sid=665"

[[comments]]
order = 5
subject = "المقدام"
text = "تعليق مقتبس<br />اييييييييييييييييييييييييييييييييييييييييه<br />هييييييييييييييييييييييييييييييييييييييييه<br />الريس طلع اسمو بالتلفزيون يا جدع ..<br />هييييييييييييييييييييييييييييييييييييييييه<br />و عاش الريس و عاشت حكومة مصر الداعمة لاسرائيل<br />دا انا قولتلكو يا رجاله انو علاقة الريس بشارون متينة و متهزش ..<br />الله اكبر و عاشت امتنا المجيدة<br />الله اكبر و عاشت فلسطين حرة عربية<br />الله اكبر و عاش العراق العظيم<br />الله اكبر و عاشت علاقة شارون بالريس<br />عارفين ياجدع دا ربنا لو يطول بعمر سياتو (الريس) دا حتصير حاجات (ما نحلمش بيها)<br />دا انا بسمع بالتلفزيون شعارات مظاهرات كلها ثقة فلسطينية احنا الي معانا الدبابات ما نكونش اكثر ثقة من العزل ليه مثلا<br />(غاياتنا الرسول - دستورنا القرأن ) ايه العظمة دي ولا لما يجي يقول متحدي (احنا الشبيبة الفتحاوية) ايه التحدي دا (طيب مصر الدولة الوحيدة الي هزمت اسرائيل بعد الشباب الفلسطيني ما تقولش شعارات كلها حقد على دولة الكيان الممسوخ ليه.<br />و ربنا الله يستر"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018190216/http://www.20at.com:80/article.php?sid=665"

[[comments]]
