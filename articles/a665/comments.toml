text = "استهدوا بالله<br />هو رامسفيلد بيقول كدة بيتحي مع بوش ولا مع كيري<br />يعني قصده يقول إننا كويسين قوي ولا إننا مدعوكين بالجامد في معركة مقرطة العراق<br />بقولك ايه<br />حلوة المقرطة دي<br />ع العموم بتفكرني بالملوخية"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018190216/http://www.20at.com:80/article.php?sid=665"

[[comments]]
order = 7
subject = "قطوب"
text = "1- أعتقد أن كلمة الشكر الوحيدة التي تلفظ بها شارون موجهة لرئيس عربي كانت لحسني مبارك، (في الحقيقة لا أدري إن كان قد توجه بالشكر لأي أحد آخر بشكل رسمي)، أعتقد أن هذه الكلمة ستدون في تاريخ هذه المرحلة، وأعتقد أنها لن تكون مما يفخر به أهل المنطقة العربية من تاريخهم"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018190216/http://www.20at.com:80/article.php?sid=665"

[[comments]]
order = 8
subject = "قطوب 2"
text = "2- بالنسبة لحدوث 3انفجارات في مناطق سياحية في سنة نتيجة تسرب \"غاز\"، فا أنا شايف ان ده شيء طبيعي، جايز السياح كانوا آكلين أكلة ثقيلة شوية، وبطنهم كانت مرتبكة و... دي حاجة بتحصل يا جماعة فيه ايه ؟"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018190216/http://www.20at.com:80/article.php?sid=665"

[[comments]]
order = 9
subject = "قطوب3"
text = "\"إن الولايات المتحدة ستستمر في تقديم التضحية في معاركها مع المقاتلين في العراق.\"<br />أنا أعتقد ان كلمة \"التضحية\" عندما تصدر عن القائد العام للقوات المسلحة الأمريكية، فإنها تصير وساماً على صدر كل \"رجل\" عراقي أو غير عراقي يناضل من أجل القضاء على ذلك الكابوس الأمريكي."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018190216/http://www.20at.com:80/article.php?sid=665"

[[comments]]
order = 10
subject = "قطوب 4"
text = "\"سنطرد من أراضينا كل أجنبي \"<br />هذه العبارة عبارة عن إعلان حرب..<br />ولكن عندما نضيف إليها:<br />\"سيخرق صوم أيام شهر رمضان المبارك \"<br />تتحول العبارة إلى نكتة..! :)<br />وبالنسبة لي لا أملك أن أضع تعليقاً جاداً، فالعبارة فرصة رائعة للسخرية والمزاح.. وأرى أنها سوف تصبح مثلا متداولاً فيما بعد..<br />تعليقي هو:<br />\"لأ دكر ياااد\"<br />تحياتي للجميع، وختاماً أرجو من القراء الكرام أن يلتزموا بأخلاقيات وذوقيات الحوار في كتابة تعليقاتهم.."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018190216/http://www.20at.com:80/article.php?sid=665"

