subject = "إلى وائل"
text = "شوف رغم كراهيتي الشديدة للكوايتة واحتقاري ليهم لكن لو كان صحيح واحد منهم اللي عمال يقرفك ويكشف فضايحك فأنا بصراحة أؤدي له التحية احتراما .<br />وكما قال الله تعالي: ولا يجرمنكم شنآن قوم ألا تعدلوا<br />وبالمناسبة ما اعتقدش انك تعرف معنى شنآن يا بو مقالات ولا مقاولات ."
