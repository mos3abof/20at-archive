text = "الموضوع ده اخد اكتى من حقه بصراحه وهيا خلاص اخدت حقها من زمان فيا ريت ننساها لاننا مش المفروض نبقى متعاطفين معاها لانها غلطت حتى اكتر من احمد نفسه"
archived = "2006-11-02"
