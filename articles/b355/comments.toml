[[comments]]
order = 1
subject = "قضية عم احمد"
author = "أكرم بس"
posted = "2006-01-31"
text = "الموضوع ده خد اكبر من حقه<br />و بقول للناس اللي متعاطفه مع هند مش كل واحد خبط واحد بعربية يبقى صاحب العربية الغلطان ممكن اللي ماشي هو اللي كان شارب حاجة او مسطول<br />انا عن نفسي مع الفيشاوي و مقتنع بانه مظلوم في القضية دي و هو اللي اتضر اكتر من هند و بنتها<br />ام عن البنت و مصيرها فدي مشكلة المجتمع كله مش مشكلتها ( يا ريت نتكلم عن المشكلة دي شويه )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152330/http://www.20at.com/article2.php?sid=355"

