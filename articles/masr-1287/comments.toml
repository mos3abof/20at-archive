text = "جيد ان يخرج الناس للمطالبه بحقوقهم و الاجماع على هذا و الاجمل ان يتم بصوره سلميه ويتم الموافقه على مطالبهم المشروعه من قبل الحكومه ، وهذا يحدث فى كل دول العالم المتحضر ، وليت كل اصحاب حق يخرجون للمطالبه بحقوقهم."
