[[comments]]
order = 2
subject = "البداية هنا ... كانت في المحله .. والجايات أكتر"
author = "إبن بهيه"
posted = "2006-12-12"
text = "بصراحه يا أحمد بلال موضوعك روعه .. بقالي فتره منتظر تتكلموا في الموضوع ده .. هم دول المصريين .. هم دول ولادك يا بهيه .. ما تسيبش حقك .. خد حقك بإيدك وبلاش تشل إيدك كده وتقول وأنا مالي .. جات عندي أنا .. جات علي أنا .. أيوه طبعا إنته لوحدك مش غيرك ممكن تغير البلد دي .. أنا سعيد جدا بهذا التطور العظيم في المفهوم والفكر الوطني .. الحرامي النصاب مبارك الواطي الماسوني مش راح يسيبنا لا هو ولا عصاباته غير لو سحبناهم من قفاهم ورميناهم في مزبلة التاريخ .. والله عمرهم ما هيحلوا عن البلد دي غير بكده .. مستحيل .. عمرها ما حصلت في التاريخ قبل كده أن يخرج عميل طاغيه جبان مثل مبارك الواطي من الحكم لوحده كده من غير ما الشعب يشوطه برجله بعيد عن الكرسي .. سيبك من العك الفارغ ده والعبط بتاع الإصلاحات اللي خالت على ناس كتير .. ما فيش في الدنيا حد عمل الإصلاحات دي قبل كده ولا حيحصل أبدا .. إصلاحات إيه بس ؟؟؟<br />اتحركوا يا ولاد بهيه .. بإيديكم بس ممكن نتخلص من العملاء وعصابات الحزن الوطني .. بس نتحرك بنظام .. ونتحرك في إطار وطني .. ويا ريت يا ريت يا ريت ننسى التقسيمات دلوقتي .. يا ريت نبص مين ممكن يقود المسيره لمدة سنه واحده بس ونكون معاه .. عارفين الموضوع بسيط .. لو قدرنا نعبر خندق مبارك الواطي وعصاباته وجبنا ناس غيرهم من ولاد بهيه بجد ساعتها هيكون سهل جدا نغيرهم لو مش عاجبينا لأننا خلاص عرفنا نغير بإيدينا .. صح ولا لأ ؟؟؟ يعني لو جبنا الإخوان وما عجبناش سياستهم .. نغيرهم بعد كده .. لكن نقعد نولول وناكل في بعض ونختار من دلوقتي مين اللي يحكم قبل ما نوصل أصلا للموقف اللي نقرر فيه أصلا يبقى ده مجرد عك في عك ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190558/http://masr.20at.com:80/article.php?sid=1287"

