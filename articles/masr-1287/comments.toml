subject = "الله ينور"
author = "ديمة"
posted = "2006-12-12"
text = "تسلم ايدك، بجد انا اتخضيت وبغم انى باحضر اجتماعات هماليى كتير للتحضير لاعتصامات ومناقشة اوضاع المصانع المتشابهة لحد كبير لكن المرة دى الضرية كانت قوية وفى المكان الصح والمفروض اسامة انور عكاشة يبتدى يحضر لجزء جديد من ليالى الحلمية وبدل مصنع البدرى يكون مصنع المحلة"
archived = "2006-12-16"
