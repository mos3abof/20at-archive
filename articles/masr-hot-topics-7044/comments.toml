author = "عاشقة نجم النجوم احمد عز"
posted = "2008-01-22"
text = "احمد عز هو نجم النجوم لانه بجد يستحق اللقب ده لانه حقيقى فنان مبدع ولا يقدم الا كل ماهو قيم وممتع للجمهور وقد يرجعنا الى العصر القديم المليىء بالعظماء والفنانين العباقرة وبقوله انت نجم العصر ويكفى ان فيلمك الشبح الاول براى الجمهور فى موسم الصيف ولم يكن الشبح وحده فقط بل جميع افلامك الممتعة الابقة اللائقة بكل فنان عظيم مثلك ولا يهمك كلام اى حاقد عليك او ناقد تافه"
