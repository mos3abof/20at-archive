[[comments]]
order = 4
subject = ""
author = "DDD"
posted = "2008-02-26"
text = "أولا أحب أن أحي الصحفية التي أجرت هذا الحوار، وأقدم لها الشكر على هذا المجهود. ثانيًا أود أن أبدي رأي بصراحة في ضيف الحوار. أعتقد إنه ليس إنسان \"هايف\" بالدرجة التي وصفه بها بعض الأشخاص، بدليل أنه استطاع أن يكسب قاعدة جماهيرية كبيرة - في الآونة الأخيرة - من كل الطبقات.غير أن هذا لا يعني أنه \"ملاك\" كما قد يصفه البعض الآخر؛ فكل ابن آدم خطاء. وقبل أن أكمل حديثي، أود أن أوجه كلمة لهؤلاء الذين وجهو إليه نقدًا لاذعًا؛ \"جميل جدًا أن تبدي رأيك في الآخر، حتى وإن كان هذا الرأي مناهضًا له، ولكن عليك أن تنتقي الأسلوب اللائق في النقد، الذي يعبر عن رأيك ولا يسيء للآخرين، وإلا كان ذلك شيئًا آخر بعيدًا كل البعد عن النقد!!. بالنسبة لأحمد عز، فأنا أعترف أنني لم أكن أحترمه في البداية؛ بسبب المشاهد التي قدمها في بدايات أفلامه (والتي أقر أنها خدشت حيائي كفتاة)، بالإضافة إلى أن طريقة أدائه كانت دون المستوى. أما الآن فأنا أقر أنه استطاع أن يجبرني على احترامه؛ نظرًا لطموحه العالي وإرادته القوية التي توجه هذا الطموح وموهبته التي تجلت في أدواره الأخيرة واختيارته المتأني لأفلامه واحترامه لجمهوره وطريقة آدائه المميزة وابتعاده قدر الإمكان عن المشاهد الخادشة للحياء (هذا على المستوى العملي، أما على المستوى الشخصي، فالعلم كله عند الله) كما بدأت أعجب بمستوى النضج الفكري الذي بدأ يتمتع به أخيرًا. وأنا لا أعني بكلامي هذا أنه الشاب الذي لا مثيل له، بل بالعكس فإن هناك الكثير من الشباب الذين يفوقونه أخلاقًا ودينًا وقيمًا وشخصيةً، ولكن ما أود التأكيد عليه، هو أن نمنحه فرصة للتغير وألا ندع للانطباعات التي كوناها عنه سابقًا تؤثر على حكمنا عليه الآن (خاصةً وأنه بدأ بالفعل يتغير إلى الأفضل - على حد ظني - على المستوى العملي في الفترة الآخيرة، وأتمنى أن يكون هذا على المستوى الشخصي أيضًا)…أعتقد أن كل إنسان يستحق هذه الفرصة؟!!"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906161315/http://www.20at.com:80/masr/t7kyk/7044.html"

