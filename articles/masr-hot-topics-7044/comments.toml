order = 6
subject = ""
author = "Dody M"
posted = "2008-07-04"
text = "لست أدرى لما كل هذا النقد اللاذع والأسلوب الغير لائق فى الحوار .. فلكل فنان جمهوره ومن يقدرونه والقالب الذى اختاره وارتضاه لنفسه .. ففى رأيي الشخصي .. أنني لم تعجبني أفلام وأدوار الأستاذ أحمد عز فى البداية وأري أن أسباب ذلك عن وجود الخبرة الكافية ورغبته بأن يدخل المجال الفني بشكل أو بأخر ولكن بعد ذلك بدأت أتابعه من جديد بداية من ملاكي اسكندرية وحتى فيلمه الأخير مسجون ترانزيت، فأعجبت جداً بأدائه المتميز وأنتقائه لأدواره بالإضافة إلى الخبرة التى اكتسبها مع الوقت والتى يريد أن يكتسبها ويعجبني أيضاً من خلال ما أراه أمامي أنه شخص طموح محب لعمله ويبحث عن الجديد دائما، لذا فهو يستحق الاحترام، أقول أخيراً لأخواتى صاحبات التعليقات القاسية الألفاظ \" من فضلكم أنقضوا كما تشاءوا ولكل بأسلوب صحيح فمن الممكن أن يكون النقد الواعي المحايد مفيد للشخص الذى ننقضه ويجعله يستفيد منه .. وأحيي الفنان أحمد عز على فيلمه الأخير \" مسجون ترانزيت \" وأتمتى له مزيد من النجاح .. بعيداً عن الغرور \"."
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906161315/http://www.20at.com:80/masr/t7kyk/7044.html"

