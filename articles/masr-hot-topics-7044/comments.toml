text = "أحمد انسان مجتهد جدا ،وبيحب شغله وهذا شئ لابد أن نحترمه عليه،خصوصا إن افلامه الاخيرة جميلة ومحترمة جدا.لكن نفسنا ربنا يهديه اكتر ويستمر على هذا الخط المحترم فى افلامه.ودايما يتذكر المولى عز وجل عندما يفكر أن يمثل أفلام مثل مذكرات مراهقة \\\"تذكر الله دائما يااحمد \\\" .على فكرة لازم عندما ننقض ننقض بطريقة محترمة وراقية ،خصوصا إذا تغير الانسان الى الافضل"
