subject = "موش هقول انا مين"
text = "الغريبة ان الناس كانت تعرف ان علي عبد المنعم من ضمن فريق عشرينات ...لكن محدش شايفه مقالات ...قلنا خير قالوا بيستعد علشان يفجر ابداعاته ويعمل\"قلق\"في المنطقة وبعدها بدأ يقلقنا بالمقالات اللي بالشكل ده... جماهير عشرينات الغفيرة بتناشد علي عبد المنعم بالتوقف عن الكتابة فورا وذلك للحفاظ علي حياة البقية الباقية من هؤلاء الجمهور ..ويا ريت ياخد في ايده الاخ بيرو اللي بيعلق بمعدل 60 تعليق في الساعة كفاية حراااااااااااام"
archived = "2004-07-05"
capture_url = "https://web.archive.org/web/20040705234157/http://www.20at.com:80/article.php?sid=408"

