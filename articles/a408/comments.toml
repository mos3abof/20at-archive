subject = "بيرو"
text = "ليه بس يا جماعة..المقال زي الفل وحليوة كدة زي نرجس بالظبط الموضوع وما فيه ان زي ما في ناس بتمارس الجنس مع نفسها .. برضه فيه كتاب مقالات بيمارسوا الكتابة مع نفسهم .. سيبوهم بس وان شاء الله هما هيخفوا"
