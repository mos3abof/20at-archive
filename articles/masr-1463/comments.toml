[[comments]]
order = 0
subject = "رسمى وشعبى"
author = "ديمة"
posted = "2007-01-18"
text = "انا قريت فى الاخبار التى اتنشرت بجورنال الاهرام من منتصف يناير 77 وحتى اول فبراير، بالفعل لم يقبض على مسيحى واحد، وسارع الطائفة الكاثوليكية بادانة الممارسات واعلنت الطائفة الارثوذكسية الضلاة لعودة لاسلام لمصر ، بلافعل لم يصرح البابا الذى كان على خلاف كبير هو وثيادة الكنيسة آنذاك مع السادات، لكن كانت كل البرقيات المسيحية التىنشرتها الجردية مليئة بالوقوف مع الرئيس والحكومة فى هذه المحنة والثقة فى حكمة سيادته.<br />ما عرفش ده كان انطباع كل الاقباك ولا ده الموقف الرسمى زى اى حاجة فى مصر، لكن مشكلة الاقباط زيادة انهم فعلا الشريحة الاكبر منهم تلتزم بموقف الكنيسة حتى لو مش مقتنعين به، و .. حتى لو بختلف مع مواقفهم الوطنية .. ودى ازمتهم الكبرى حتى الآن"
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120213205/http://masr.20at.com:80/article.php?sid=1463"

[[comments]]
