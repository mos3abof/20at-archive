subject = "لا تعايرنى و لا اعايرك"
author = "عم بطوط"
posted = "2007-01-18"
text = "ان شأنهم فى هذا شان كل المصريين الذين تعودوا طاعه رجال الدين او المتحدثين باسم الدين طاله عمياء بدون تفكير ، واقرب مثال ما يحدث هنا ، جرب كده واعترض على الاخوان او اى جماعه تنعت نفسها بالاسلاميه وشوف اللى هيجرى ، ده حال كل المصريين مش حكايه اقباط و مسلمين"
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120213205/http://masr.20at.com:80/article.php?sid=1463"

[[comments]]
order = 2
subject = "الله اكبر"
author = "لا شك أن الناس يتفاوتون في أمنياتهم للحظة الخاتمة وما من شك أن هذا الاختلاف ما هو إلا انعكاس لأحلام حياتهم كلها فتعالوا بنا نتأمل كيف تمنى الآخرون خاتمتهم:"
posted = "2007-01-18"
text = "** لما نزل الموت بالعابد الزاهد عبد الله بن إدريس اشتد عليه الكرب فلما اخذ يشهق بكت ابنته<br />فقال: يا بنيتي لا تبكي فقد ختمت القرآن في هذا البيت أربعة آلاف ختمة.. كلها لأجل هذا المصرع..<br />** وها هو هارون الرشيد لما حضرته الوفاة وعاين السكرات صاح بقواده وحجابه:<br />اجمعوا جيوشي فجاؤوا بهم بسيوفهم ودروعهم لا يكاد يحصي<br />عددهم إلا الله كلهم تحت قيادته وأمره فلما رآهم.. بكى ثم<br />قال :<br />يا من لا يزول ملكه.. ارحم من قد زال ملكه..ثم لم يزل يبكي حتى مات..<br />**أما عبد الملك بن مروان فإنه لما نزل به الموت جعل يتغشاه الكرب ويضيق عليه النفس فأمر بنوافذ غرفته ففتحت فالتفت فرأى غسالاً فقيراً في دكانه.. فبكى عبد الملك ثم قال: يا ليتني كنت غسالاً.. يا ليتني كنت نجاراً.. يا ليتني كنت حمالاً.. يا ليتني لم ألِ من أمر المؤمنين شيئاً.. ثم مات<br />وهذا مشهد من عصرنا الحديث[1]:<br />** شاب أمريكى من أصل أسبانى، دخل على إخواننا المسلمين فى إحدى مساجد نيويورك في مدينة 'بروكلين' بعد صلاة الفجر وقال لهم أريد أن أدخل فى الإسلام.<br />قالوا: من أنت؟<br />قال دلوني ولا تسألوني.<br />فاغتسل ونطق بالشهادة، وعلموه الصلاة فصلى<br />بخشوع نادر تعجب منه رواد المسجد جميعاً.<br />وفى اليوم الثالث خلى به أحد الإخوة المصلين واستخرج منه الكلام وقال له: يا أخي بالله عليك ما حكايتك؟<br />قال: والله لقد نشأت نصرانياً وقد تعلق قلبى بالمسيح عليه السلام ولكننى نظرت فى أحوال الناس فرأيت الناس قد انصرفوا عن أخلاق المسيح تماماً فبحثت عن الأديان وقرأت عنها فش<br />اقرأ بقية التعليق .."
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120213205/http://masr.20at.com:80/article.php?sid=1463"

