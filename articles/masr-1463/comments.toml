[[comments]]
order = 4
subject = "ازمة مجتمع"
author = "س.تركي"
posted = "2007-01-19"
text = "الازمة الحقيقية يا هاني اللي الاقباط بيحالوا يتجاهلوها ان ازمتهم مش هتتحل غير لما يشاركو بفاعلية في الشارع و يبطلو يقولو احنا خايفين ننزل الشارع.لأ انزلو وخدو حقوقكم من عين الحكومة.نفس الكلام للموتي من الشعب المصري اللي عاوز يغير حسني مبارك وهو قاعد يلعب مع الحريم ع السرير.اليسار ف امريكااللاتينية مكتسح لانه ببساطة قدم تضحيات,ناس دخلو معتقلات وناس ماتت لكنهم جنوا البشاير في نهاية المطاف ووصلوا للحكم,مش زي نخبتنا ال(م....)!!"
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120213205/http://masr.20at.com:80/article.php?sid=1463"

[[comments]]
order = 5
subject = "الخنازير تأكل"
author = "الى صاحب مقال اقلية تحتاج علاج نفسى الخنازير تاكل ماشى يا عم الانسان المحترم"
posted = "2007-01-19"
text = "المهم تعرف يا عم الانسان المحترم ان المسيحين لا يشاركوا فى الحياة السياسيه من نظره الانسان المسلم المحترم مثلك الذى يقبل ويحترم الاختلاف وطبعا انت عارف ان المسيحين فى مصر طبعا بيخدوا حقوقهم وزياده....اروح لنادى علشان العب كوره يقولى المدرب لازم تكون مسلم علشان تدخل النادى ... اروح ادم على شغل يرفضنى علشان دينى ....يقتلوا فى الصعيد المسيحين ولا حد دارى ...يرشوا ماء نار على البنات المسيحين ولا حد دارى ....يخلو البنات تبقى مسلمه دون اردتها ولا حد دارى ....عارف ليه الدمقراطيه مش نافعه فى دوله مسلمه؟؟؟علشان محدش علمنا يعنى احترام الاخر (مسلمين ومسيحين) وهنفضل نقول مسلمين ومسيحين لغايه لمل نعلم ان كل واحد حر يعبد اللة كما يريد ....هو الناس هتعاقب مكانه فى الاخره.....على فكره كلامك فى المقال (الخنازير تأكل)اكبر دليل على صدق كلامى ....انا كان ممكن اشتم زيك لكن.....انا مسيحيى"
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120213205/http://masr.20at.com:80/article.php?sid=1463"

[[comments]]
order = 6
subject = "يلا يا مصريين"
author = "احمد جمال"
posted = "2007-01-20"
text = "يلا يا مصريين قوموا علي النظام الفاسد وبلاش ننشغل في حكاية مسيحي ومسلم اللي عاملها مبارك فينا وبلاش نضحك علي بعض بحكاية الوحدة الوطنية دي وخلينا شركاء في الوطن وبس ولا نتناقش في الدين ولا غيرو<br />المسلميين شايفين ان المسيحين كفرة ومحرفين الانجيل والمسيحين شايفين ان المسلمين بيتبعوا نبي كذاب فبلاش نقعد نجامل بعض كل واحد فينا كافر في النظر التاني خلينا شركاء في الوطن وبس<br />وعلي فكرة دا رأي كتير من المفكرين المسلمين والاقباط"
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120213205/http://masr.20at.com:80/article.php?sid=1463"

