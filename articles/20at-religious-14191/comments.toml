[[comments]]
order = 2
subject = ""
author = "احمد صبري"
posted = "2009-12-01"
text = "اتركوا المأذن لالله فالله لن يترك دياره والتفتوا لأعمالكم العالم يمر بأزمات اقتصاديه عنيفه<br />ارجوكم بطلوا هيافه و قله عقل و قبل ما تزعلوا علي الجوامع و المأذن يا ريت اى حد فينا يعرف يرد علي ما يدعيه الأقباط علي قناة الحياة علي القمر الأوربي<br />يا ريت حد يقول لشيخ الأزهر ولا حتي فضيلة المفتي يرد بدل حالة الخزي الشديد التي اصبحت امة الأسلام فيها بطلوا هيافه فرجتوا علينا الناسالمصدر : C.N.N"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202121310/http://www.20at.com:80/20at/religious/14191-2009-11-29-13-45-16.html"

