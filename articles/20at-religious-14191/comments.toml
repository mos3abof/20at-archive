text = "و بعدين الاستاذ صاحب التعليق رقم 1 … انا اكاد اجزم انك موش بتقرب من صلاة الجماعه ف المسجد … لانك فعلا لو كنت بتعمل كده كنت حسيت يعني ايه كلمة مسجد او جامع …<br />و يا ريت حضرتك توضحلنا المواضيع المهمه ايه هي من وجهة نظرك"
