text = "استاذ احمد صبري صاحب التعليق 3 .. فيه ايه يا عم ؟؟ ايه اللي جاب موضوع المآذن لقناة الحياه اللي ع الهوت بيرد , موش فاهم ؟؟؟<br />و بعدين ماهي كل الشبهات اللي ع الحياه مردود عليها من علماء كتييييير قوي قوي لا حصر لهم بل من بعض عوام المسلمين كمان ..<br />احنا بس بنستغرب علي دعاة المحبه و البذل من اجل الاخرين و لو لطمك احد علي خدك الايمن اديله الايسر من اللي هم بيعملوه بس موش اكتر"
