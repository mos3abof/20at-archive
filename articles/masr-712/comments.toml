text = "ممكن اعرف الاستاذ اللى كاتب عنوان موقع ضد هاله ليه؟ دا موقع رعب تقريبا عموما متشكرين خدعه سخيفه جدا<br />كمان انا مش ليه فى الافلام والحاجات الفاضيه دى فى ناس بتتعذب وتتقتل وانتم نااااااااااااااااااااااااااايمين<br />ربنا يهدينا ويهدى المسلمين امين"
