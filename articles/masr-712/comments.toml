subject = "وإلي متي نظل في دوامة الأغاني والأفلام والمسلسلات ؟"
author = "عبدالرحمن"
posted = "2006-10-23"
text = "زهقنا ... دبحونا بعبدالحليم وفريد الأطرش وو وو و و إلي متي سنظل ندور بهذه الدوامات ... عايزين نتحرر بقي ونرجع لربنا ... العالم كله أكلنا وبيحتل أرضنا وحنا بس نغني ونرقص ونصفق .. ماهذا السقوط ... تعبنا تعبنا لازم نكسر القبود اللي عودونا عليها أفلام وأغاني ومسلسلات ومسرحيات وعندليب وسندريلا سيدة شاشة وعذراء الشاشة ودلوعة الشاشة ... إيه الكلام الفاضي ده ؟ أخدنا إيه منه سوي أننا انشغلنا بالكلام الفاضي ده وتركنا الشغل والعمل والانجاز وبلدنا من سئ إلي سئ .... دول بحولوا يشغلونا عن معرفة حقوقنا ...<br />ربنا يرحم الشيخ عبدالحميد كشك اللي مات وهو ساجد بين يد الله تعالي يوم الجمعة وقبيل صلاة الجمعة ."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121222854/http://masr.20at.com:80/article.php?sid=712"

