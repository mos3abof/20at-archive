[[comments]]
order = 24
subject = "ولا عزاء للهايفين"
author = "أبو ساره"
posted = "2006-09-27"
text = "وكما عودنونا المطبلاتية والأرزقية من الاستفاده من كل حادثة او قصة طلعلوا علينا وقالو الأسطوره يجسد الاسطوره وضحكوا على الناس وخدوا فلوسهم بسيما أونطه .. أقول للجماعة دول عيب عليكو خدو لكم جنب أو إللى خايف على فلوسه يروح .. وأقول لهيثم الحبوب .. بابا أحمد فى إحتياج إنك تكون ولد صالح تدعوا له وليس ترسل له اللعنات بمشيك على دربه المميت .. وسيبك من المجون والاحضان والشهره والفلوس فآخرتها كما أخذ معه والدك وكذلك العندليب رحمنا الله وإياهم أجمعين"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121222854/http://masr.20at.com:80/article.php?sid=712"

[[comments]]
order = 25
subject = "وكل الاصدقاء بما فيهم ؟؟ بألف خير"
author = "أبو ساره"
posted = "2006-09-28"
text = "كل سنة واللى مش (ظالمين أو موش فاهمين ) أبو ساره بألف خير رغم إنى عارف إن (القلوب ) معبعبة من ناحيتى بالخطأ والكبرياء ولكن أبو ساره برضه زى النخلة ينضرب بالطوب ولكن بيسقط بلح وعموما ابو ساره مكتبه .. قصدى بريده مفتوح 25 ساعة باليوم والكلام كثير بس فين النفس اللى تكتب"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121222854/http://masr.20at.com:80/article.php?sid=712"

