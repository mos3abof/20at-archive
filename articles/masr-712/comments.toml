subject = "لآ زٍلـت في قلوٍبنآ وٍفي ذهوٍننآ"
author = "عادل العيوي"
posted = "2006-09-01"
text = "ذآلك اليوٍم نعم ذآلك اليوم هو يوم الاحد<br />هو اسوا يوم في حيآآتي لم اتكن من امساك نفسي نعم فهو خبر لا يفرح الكثيرين سمعت خبر بوفآآته الفنان الكبير اسطوره السينماء العربيه امبراطور السينماء العربيه الفنان احمد زكي كم حزنت وكم اشتد حزني بسماع ذالك الخبر فقد فقدت االمه العربيه رجل ولا كل الرجال فليس هو فنان وحسب ولكن زعيم نعم انه جمال عبد الناصر وانه انور السادات<br />عجزت حروفي عن وصف ذالك البطل<br />انه احمد زكي اسمه سيضل في عقولنا وفي ذهوننا وفي قلبونا فلا يستطيع احد عن نسيانه<br />احمد زكــي اسم له تاريخ<br />اسم مسجل في كل ذاكره رجل وامراه وطفل وطفله<br />اسئل الله ان يتغمد الفقد بواسع رحمته<br />ويسكـــنه فسيـــح جنـــآتــــه<br />الله يرحمك يا احمد زكـــــي"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121222854/http://masr.20at.com:80/article.php?sid=712"

