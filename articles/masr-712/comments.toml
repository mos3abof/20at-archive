subject = "رأيى"
author = "جمال سليمان أفضل ممثل فى الفيلم وهو صاحب امكانيات عملاقة ويذرنى بالعمالقة أمثال آل با تشينو وأنتونى كوين وأنتونى هوبكنز وزكى رستم"
posted = "2006-07-26"
text = "أما سلاف أدت دور تقليدى تؤدى فيه نفسها ولا تمثل ، وامكاناتها لا تظهر فى هذه الأدوار<br />ومنى زكى أدت بطريقة الكلام العبيط المستفزة التى تؤدى بها كل دور لفتاة فقيرة ، ولا أرى لها أى داعى سوى أنها تريد تذكيرنا دائما أنها بنت ناس وليست مثل الشخصية لتقطع عننا أى شك !!<br />عزت أبو عوف أدى دور جيد ولكن متكلف وكان أفضل من يؤدى الشخصية هو عبد العزيز مخيون<br />أحمد زكى .. يرحمه الله ..كلف نفسه فوق طاقته<br />هيثم أحمد زكى .. أدى بتكلف وغابت عنه التلقائية المفترضة فى أول دور ، وبدا وكأنه يقلد والده !"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065053/http://masr.20at.com:80/article.php?sid=712"

