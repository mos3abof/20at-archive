[[comments]]
order = 22
subject = "الي الاخت جويريه"
author = "عبد الله"
posted = "2006-09-23"
text = "انا اللي كتبت موقع هاله ومش عارف تقصدي ايه بموقع رعب....ده موقع حقيقي قام به بعض الاخوه من اجل جمع التوقيعات من اجل ارسال الي الوليد بن طلا ل مالك قنوات روتانا من اجل وقف هاله سرحان عن العمل<br />.... اذا كان الموقع مفتحش معاكاو حصل مشكله يمكن لان الموقع اتعرض لمحاوله اختراق من جانب احد الهاكر لكن تم اصلاح العطل والحمد لله وتقدري تتاكدي من كده من الرابط ده وانا لسه مجربه الان وليس به اي مشاكل<br />وااله العظيم انا صادق في اللي بقوله<br />اضغط هنا"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121222854/http://masr.20at.com:80/article.php?sid=712"

