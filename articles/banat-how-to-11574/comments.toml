author = "اى حد والسلام"
posted = "2009-03-16"
text = "انا شايفة انك المفروض تقعدى ف بيتك<br />وماتنزليش اساسا<br />عشان ماتشوفيش حاجة تعجبك وتشتريها<br />واهو نكون جيبناكى من اول الطريق<br />يلا بالشفا<br />بس تعرفى<br />افكار حلوة<br />لكن فيها حاجات مبالغ فيها اوى<br />زى موضوع الهدايا اللى بالجملة ده"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224135425/http://www.20at.com:80/banat/how-to/11574-7-.html"

