text = "اصل احنا شوية عيال وبنلعب عسكر وحراميه وكل فريق مبسوط من نفسه خالص الاخوان مبسوطين اوي باللعبة والشرطة المصرية مبسوطة اوي باللعبة<br />واسرائيل اخر عال وعال العال والقدس شوية شوية بتنتقل الى اسرائيل<br />وكل سنه وانتو طيبين<br />واريد توضيح اللعبة اللي بيلعبوها العيال<br />ايام جمال عبدالناصر الاخوان والشرطة لعبوا مع بعض عسكر وحراميه<br />وبعدين اسرائيل اخد سينا<br />يبقى فايدته ايه اللعب يا ولاد الكلب"
