order = 3
subject = "وداعاً للإعلام"
author = "محمد حسن غنيم"
posted = "2006-09-03"
text = "وداعاً للإعلام<br />وداعاً للرقابة<br />وداعاً للزمن الجميل<br />وكما قال الإمام على رضي الله عنه\"ياأمة ضحكت من أجلها الأمم\"<br />أين الإعلام أين الرقابة<br />وداعاً للقيم<br />بعد انتشار القنوات الفضائية واتساع الساحة الإعلامية وظهور البرامج الإباحية التي شغلها الشاغل الثقافات و العلاقات الجنسية لايوجد غير وداعًاً للإعلام وداعاً للقيم<br />محمد حسن غنيم موقع ميدل ايست<br />منقول<br />هالة الخطيرة!<br />جدل بسبب 'هالة شو'<br />حملة على الإنترنت ضد برنامج هالة سرحان الصادم للوعي ومطالبة بتهذيب موضوعات المضامين الجنسية.<br />ميدل ايست اونلاين<br />القاهرة – من محمد ج. عرفة<br />عندما يحمل برنامج تلفزيوني عربي اسماً غربياً مثل \"هالة شو\"، فإنّ المضمون الذي يجري تقديمه تحت هذه اللافتة قد يأتي في اتجاهات غربية أيضاً وبشكل صادم لوعي الجمهور وربما يكون كفيلاً بإثارة حنقه. يتضح ذلك مع البرنامج الذي تقدمه هالة سرحان والذي يتسلل إلى بيوت المصريين والعرب عبر الفضاء التلفزيوني الصاخب، حاملاً معه شواغل علب الليل وقضايا \"الدروب البطالة\".<br />فقد أظهر تصويت علي موقع \"التصويتات\" على شبكة الإنترنت تصاعد الانتقادات من جانب جمهور الفضائيات لبرنامج \"هالة شو\" بسبب تناوله لموضوعات وصفها متابعون بأنها خادشة للحياء وآخرها حلقة عن محترفات البغاء ومشكلاتهن.<br />فقد وقّع قرابة 200 من الجمهور على عريضة في صورة رسالة موجهة إلى الأمير الوليد بن طلال، رئيس مجلس إدارة \"روتانا\"، وحازم عبد العال، المدير العام لفرع القاهرة للمجموعة، يطالبون فيها بوقف هالة سرحان مقدمة البرنامج، و\"تهذيب مثل تلك البرامج، نظراً لما تعرضه برامجها من قضايا جنسية مخجلة، ولموضوعات مثل \"فتيات\" الليل والدعارة ونشر الثقافة الجنسية، وموضوعات الأفلام الساقطة الخادشة للحياء العام المخالفة للأعراف والتقاليد العربية والإسلامية، وما يصاحب ذلك من مخالفات مثل العروض الراقصة الخارجة والخلاعة وما شابه\"، حسب نص العريضة.<br />وطالب الموقعون على \"عريضة\" بهذا المعنى بوقف هالة سرحان مقدمة برامج \"هالة شو\" و\"السينما والناس\"، بسبب تقديم هذه البرامج التي تصدم جمهور المشاهدين، وآخر هذه \"القضايا\"، حسبما قالوا، عن الداعرات كيف يعملن وكم يتقاضين وكيف يتعاملن مع رجال الشرطة لتركهن وشأنهن.<br />وقال هؤلاء \"في أحد المشاهد تتحدث إحدى الساقطات بأنها تتقاضي عشرة آلاف جنيه (أي ما يقارب ألفي دولار) شهرياً!. تُرى كيف يكون وقع ذلك على الفتيات الفقيرات أو قليلات التدين؟، وأنها تقدم الخدمة بالمجان لرجال الشرطة لتركها تقوم \"بعملها\"!\"، وفق تعبيرهم.<br />وأضافوا محررو العريضة \"السؤال هنا ما الهدف من نشر مثل تلك \"القضايا\" وبهذا الأسلوب المبتذل المخجل؟ مع الوضع في الاعتبار أنّ تلك العروض لا تتعلق شكلاً ولا مضموناً بحرية التعبير\"، مشددين على \"أنّ ما تعرضونه يراه الصغير والكبير وستسألون عنه أمام ربكم\"، وفق تحذيرهم.<br />ولم ينس الموقعون على العريضة أن يذًكِّروا مسؤولي \"روتانا\" أنّ هالة سرحان التي تشغل منصب المدير التنفيذي لقنوات روتانا سينما سبق \"طردها\" مرتين من قبل من \"راديو وتلفزيون العرب\"، ومن قناة \"دريم\" بسبب ما قالوا إنه \"أسلوبها المتدني والمبتذل في عرض برامجها\".<br />لا مانع من الجنس ولكن بحياء!<br />ولوحظ على تعليقات المصوتين على العريضة أنّ بعضهم قال إنه لا يعارض الحديث عن الأمور الجنسية على الفضائيات، ولكن يطالب أن يتم ذلك بحياء وبدون ابتذال كما يحدث.<br />حيث يؤكد أحد الموقعين، واسمه رجب خفاجه، أنّ \"تقديم برامج تتناول موضوعات شائكة مثل الجنس فهذا ليس بالأمر المكروه إذا تم تناول هذه الموضوعات من قبيل التوعية وخلق الاتجاهات التي تستطيع رفض كل ما هو مخالف للشرع والدين، أما وأن تكون مثل هذه الموضوعات تُعرض بلا هدف، بل وتُعرض بأساليب لا ترتقي لمستوى برنامج يشاهده الملايين من الناس فهو لا يحمل من الرسالة إلاّ الفراغ وفي المضمون والمحتوى فهذا ما نرفضه بشدة بشدة بشدة\"، على حد تعبيره.<br />ويقول آخر \"إن كانت (برامج كهذه) تدعي أنها تعالج مشكلات المجتمع فليس معنى ذلك أن تظهر لنا تلك المهازل على البرنامج، كالطبيب الذي يعالج مريض لا يعرض عورته أمام الجميع ولكن أمام من سيساعده في معالجته\".<br />وقد عقّب مشارك ثالث بقوله \"لقد أصبحنا نشعر بالاشمئزاز من تلك البرامج فافعلوا شيئاً يرقى بمستوى هذه الأمة وبمستوى شبابنا، كفي ميوعة وخلاعة\"، فيما يسمي مصوت آخر هذه البرامج بأنها \"غير هادفة وتافهة ومستفزة وقليلة الحياء\"، وفق وصفه.<br />وقد بلغ الأمر ببعض المصوتين علي العريضة أن يعرب عن التهديد والقسم بالله بمقاطعة \"هذه القناة لو لم تتوقف عن هذا الابتزاز، حتى لو دفعنا قوت يومنا\"، على حد ما ذكروا.<br />الفضائيات ووثيقة بكين<br />وكان الأسبوع الأول من أيار/مايو 2006، قد شهد إعداد خبراء التربية والإعلام العرب العاملين بمنظمة اليونيسيف بالمنطقة العربية، مشروع \"ميثاق عربي للإعلام وحقوق الطفل\" المثير للجدل، والذي يعتمد علي مقررات مؤتمر بكين لعام 2002 وبكين +10 لعام 2005، التي تطالب بتعليم الثقافة الجنسية للأطفال والمراهقين. وقالت منظمات عربية وإسلامية حينئذ إنّ تلك التوجيهات تتعارض مع الدين الإسلامي، ومع تقاليد العالم العربي والإسلامي وثقافاته.<br />وتبع هذا قيام عدة قنوات فضائية عربية بحملة إعلامية لتأييد تدريس مناهج الثقافة الجنسية في الوطن العربي بشكل عام ومصر بشكل خاص، اعتماداً على وثيقة منظمة اليونيسيف \"ميثاق عربي للإعلام وحقوق الطفل\". فقد قامت قنوات \"دريم\" و\"إم بي سي\" (MBC)، و\"الحرة\" الأمريكية، بالترويج لهذا المشروع. وفي الوقت نفسه قامت قناة \"روتانا\" بإطلاق حملة دعاية لهذا المشروع عبر الرسائل القصيرة على الهواتف المحمولة، وعبر برنامج جماهيري.<br />وقد بدأت الحملة في مصر بسلسلة رسائل \"دعائية\" على هواتف المصريين المحمولة، وخاصة على الشبكة الأولى \"موبينيل\"، تدعوهم إلى مشاهدة برنامج \"هالة شو\" على قناة روتانا عن الثقافة الجنسية للمراهقين، والذي تقدمه المذيعة هالة سرحان لمدة ثلاثة أيام، وبرنامج \"الحياة\" أو \"لايف\" لنجوى إبراهيم بقناة \"دريم\"، وبرنامج \"كلام نواعم\" و\"آدم\" و\"اليوم السابع\" على قناة \"إم بي سي\"، وبرنامج \"المساواة\" على قناة \"الحرة\". وقد تطرقت هذه البرامج بعامة للعلاقات الجنسية \"الآمنة\" للمراهقين، في ما ذهبت قناة \"الحرة\" الأمريكية إلى حد التطرق إلى مسائل أخرى أبعد مثل الشذوذ الجنسي.<br />واشتكى تربويون حينئذ من خطورة هذه الحملة، كونها تصل إلى الفتيات والشبان المراهقين بسهولة وتتخطى أسرهم وتستعلي على أي رقابة أسرية، حيث تصل للمراهقين عبر رسائل مباشرة مجانية علي هواتفهم النقالة في صورة \"نصائح\" عن \"الجنس الآمن\"، كما تصلهم عبر برامج أسرية جماهيرية على القنوات الفضائية اعتادت الأسرة على مشاهدتها، وكأنه تم اختيارها بعناية لتؤتي ثمارها في تنفيذ أهداف الحملة.<br />أيضاً اشتكى خبراء تربويون من أنّ مروجي هذه الحملة الإعلامية ركزوا على معانٍ أخلاقية، مثل تحذير الشباب من الحمل أو الزواج المبكر، وتحذيرهم من أمراض \"الإيدز\" كهدف نبيل للحملة، في حين جرى الحديث في بعض الفضائيات عن مسائل جنسية بشكل \"فج\"، مثل \"الجنس الآمن\" والإجهاض ضمناً في البرامج.<br />وتأتي هذه التفاعلات في ذروة تحولات إعلامية في القوالب والمضامين يشهدها الواقع التلفزيوني العربي، بدأت مع مطلع التسعينيات من القرن العشرين بظهور الفضائيات العربية، والتي باتت المئات منها تتزاحم حاملة معها برامج ومضامين غير مسبوقة في كل الاتجاهات، بما فيها تلك التي تثير انتقادات واسعة لاتجاهها نحو النزعة الفضائحية ومخاطبة الغرائز، كما يلحظ المراقبون. (قدس برس)<br />محمد حسن غنيم"
