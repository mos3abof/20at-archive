subject = "اعلام في غرفة الانعاش"
author = "شرين"
posted = "2006-07-16"
text = "ماقلته هو قشور عما يعاني منه اعلامنا العربي على الوجه العموم والمصري على وجه الخصوص واان اسفة لذلك فبمجرد مايدردش أحد الأشخاص مع رفيقه فسصبح وجبة جيدة لملء مساحة داخل الجريدة بالاضافة ولامانع من بعض المقبلات التي تزيد من فعالية هذا الخبر هذه نقطة ،النقطة الاخرى هي ان الاعلام المرئي المصري في انحدار تام واسفاه بالفعل فستجد العديد من القنوات الفضائية التي تتخصص في الاغاني وغيرها اما عن الفضائية المصرية والقنوات المحلية فالله يرحمها أما عن قنوات دريم والمحور همل التورتة الاعلامية المصرية الجميلةة لكن التي يفسدها التراب كما يقال فكل ما اريده هو ان تكون هناك نوع من الرقابة الحاسمة على هذه القنوات التي غرضها هو تحطيم أفكار وحماسة الشباب في السير في هذا الطريق ...ارحموا من في الارض يرحمكم من في السماء طالبة اعلامية اذا كان هناك تعليق ارجو مراسلتي عن طريق البريد الالكتروني"
