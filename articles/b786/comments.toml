text = "الباب اللي يجيلك منه الريح سده واستريح<br />وده إهداء لحارس العمارة (البواب سابقاً والدور مان حالياً)<br />إيش تعمل الماشطة في الوش العكر، وده إهداء لكل كوافيرة درجة تالتة لأن في دلوقتي عمليات تجميل وحقن كولاجين تخلي القرد غزال وساعتها ينطبق المثل اللي بيقول (لبس البوصة تبقى عروسة)<br />عندكوش امثال تانية؟!!!<br />كتروا لنا من المثال وحياة غلاوة الموقع..!<br />والأمان سلامة.<br />ويللا باي بقى لحسن كتر السلام يقل المعرفة."
