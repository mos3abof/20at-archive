author = "دة كان زمان"
posted = "2009-11-18"
text = "انتم بتتكلموا عن شعب واحد ايام الملك فاروق وعبد الناصر<br />انتم بتتكلموا عن زمان قوى لما كان السودانى بيقف ويقول حدود السودان الشمالية هى الاسكندرية وحدود مصر الجنوبية هى جوبا فى اقصى جنوب السودان<br />كلا يا اخوان<br />السنوات القليلة الماضية السياسات المصرية كانت فى غيبوبة<br />كنا بنعادى السودان ونشارك فى حصارة علشان الاسلاميون اللى كانوا فى الحكم واللى شاركوا فى اغتيال مبارك فى اديس ابابا<br />بيقولوا ان لنا دور فى تفتيت السودان ونرحب بفصل الجنوب ومشاكل دارفور<br />الصورة مش وردية ابدا مع السودان او سوريا او لبنان او ليبيا او اليمن او حزب اللة او حماس<br />الجميع بيتحاشى مصر وبيبتعد عنها<br />سيبونا من الاحلام الوردية بتاع الفترة الناصرية<br />العرب بيعتقدوا اننا نشارك اسرائيل فى حصار غزة وبنقتل السوادنيون على الحدود<br />السياسة الخارجية بتاعتنا متردية<br />فمش شعب واحد ابدا"
