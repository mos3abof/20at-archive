[[comments]]
order = 0
subject = "راجعة ايامك ... يا قاضي المدينة المنورة"
author = "محمد السيد"
posted = "2006-04-25"
text = "الله يثبتكم يارب ...<br />والله من ساعة ماسمعت عن فض الاعتصام واللي حصل فيه ... والدم فاير جوايا ...<br />كان نفسي بجد أكون هناك ... كنت أقله حأعرف أخد شوية من تاري ... تاري منهم ...<br />من كل العصابة ..<br />العسكر و الحرامية .....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmar@hotmail.com"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619115009/http://masr.20at.com:80/article.php?sid=227"

[[comments]]
order = 1
subject = "الصبر"
author = "مصرى"
posted = "2006-04-26"
text = "لن نترككم نحن معكم ولا بد أن يعرف العالم كله أن الرئيس حسنى مبارك حاكم غير شرعى لمصر مزور للإنتخابات رغم رفض الشعب كله له ولا بد أن يعرف العالم كله أن حق القضاء هو الإشراف على الإنتخابات وأنه أنتزع هذا الحق حتى يتمكن من التزوير ليضمن بقائه فى الحكم إلى أبد الأبدين ولا بد أن يعرف العالم أن ما يسعى إليه من توريث الحكم شيء غير شرعى لأن الحاكم غير شرعى لمصر ولا بد أن يحاكم على ما فعله فى مصر من نهب وسلب وإعتقال لكل من هاجم وجوده المزيف ونحن معكم ياشرفاء مصر فليس بعد التعدى عليكم قوى أخرى وهذا ما يفعله هذا الحقير أن يجعل أبناء مصر عبيد عنده هو وإبنه المختل عقلياً."
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619115009/http://masr.20at.com:80/article.php?sid=227"

[[comments]]
order = 2
subject = "ابن مصر"
author = "sara"
posted = "2006-04-26"
text = "يا سلام عليك ولد الله أكبر عليك انا معاك يا قاضى واحنا كلنا معاك هو دة ابن مصر ربنا معاك احنا كلنا عارفين انى الانتخابات متزورة بس محدش اتكلم كلنا كنا طبعا خايفين اللى كان عارف ومتكلمش يبقى مش ابن بلد ويبقى مش مصرى لكن هو ابن مصر صحيح لكن بجد عايزين نطفى النور علشان كده انا مع حملة طفى النور"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619115009/http://masr.20at.com:80/article.php?sid=227"

[[comments]]
order = 3
subject = "طيب !! ممكن أشوفكم واقفين معاه بكرة الجمعة؟؟وانا معاكم ان شاء الله"
author = "محمد السيد"
posted = "2006-04-26"
text = "أظن جت فرصة بجد .. كلنا نقف وقفة واحدة ...<br />أنا هنا في اسكندرية دلوقتي ...<br />بعد ساعتين في وقفة ومؤتمر في نادي المحامين لدعم القضاة ...<br />وفي القاهرة في مؤتمر مشابه في نقابة الصحفيين ....<br />وبعدها اعتصام لغاية بكرة ... الجمعة .... لمساتدة القضاة ضد حكومتنا النظيفة ونظامنا المبارك ...<br />ياتري لما نقول إننا نحضر ده أو ده ...اسكندرية او القاهرة ؟؟<br />لما نقول نحضر بكرة الاعتصام اليوم كله ؟؟<br />لما نقول نبات في الشارع حتي للي يقدر بس ؟؟؟<br />لما نشوف القضاة الناس المحترمة دي وهي بتتبهدل ...وإحنا كل الي بنعمله إننا قاعدين في بيوتنا نقرا مفالات ونعلق ونتغاظ شوية وبعدين نهدا تاني ؟؟<br />ساعتها ممكن أطلب منكم أشوفكم هناك ؟؟<br />والله بجد ؟؟؟ ممكن ....<br />انا ناوي احضر النهاردة في اسكندرية وبكرة اروح القاهرة ...<br />وده والله ولا حاجة .... بس إحنا نبقي عملنا حاجة ...<br />أي حاجة<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />مش مغيره .... هه<br />mohamedmat@hotmail.com"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619115009/http://masr.20at.com:80/article.php?sid=227"

