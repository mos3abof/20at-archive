[[comments]]
order = 12
subject = "ولاد البلد"
author = "يا مصر يا أرضنا"
posted = "2006-05-02"
text = "فيكى الحرامي والخبيث<br />فيكى اللئيم والبلطجى<br />وصديق شارون<br />وحبيب وبوش<br />والكل راكب ظهرنا<br />والشعب مسكين منكسر<br />م الفجر واقف في الطابور<br />طوابير كثيرة<br />عا الفول وياخد حصته<br />والعيش مفيش<br />ورغيفه معجون بالنكد<br />والهم مزروع في الطريق<br />والشوك كمان<br />ومفيش ركوبة توصله<br />وكلاب سوادها كالظلام<br />أعداد كثيرة<br />في كل ركن من البلد<br />مشيا ببتلهث يا ولد<br />اوعاك في يوم تعترض<br />على....... كلب مسعور<br />ينهشك<br />والعمده يبنى في السرايا<br />يرعى مصالح الكبار<br />ماهما أصل المشكلة<br />حبيب شارون<br />وصديق لبوش<br />والكل ناهب أرضنا<br />ومفيش غفير<br />ولا فيه وزير<br />ما الكل راكب ظهرنا<br />وقانون مفيش<br />وقضاه معانا في الطريق<br />ماهما أصلا مننا<br />ودعاية تلعن أصلنا<br />مش نافع ياابنى عندنا<br />وولاده ترتع أرضنا<br />أصل الطوارئ حكمنا<br />من يوم ما ركبوا ظهرنا<br />و إذا كنا عاو زين ننتصر<br />لازم نراعى ربنا<br />أوعاك تكون خايف ياصحبى<br />ما الفجر أذن يا ولد<br />أوم بيني ننده على النايم<br />والصاحي ناخده عندنا<br />أصل الكلاب دايما بتنعث<br />لما يأذن فجرنا<br />تحية للشيخ أمين أخويا"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619115009/http://masr.20at.com:80/article.php?sid=227"

[[comments]]
order = 13
subject = "أنا عارف السبب"
author = "مصرى"
posted = "2006-05-07"
text = "أنا عارف ليه حسنى مبارك بيعمل كدة فى القضاه علشان دى عقده نفسية عنده بسبب إن ابوه كان حاجب محكمة وكان القاضى بيديله على دماغه لو قال كلمة أكثر من محكممممممممه علشان كده العقدة كبرة وبقت كولكيعة كبيرة قوى ومن يومها وهو بيكره كلية الحقوق زى العما وإبتدأ ينتقم من القضاه وميخليهومش يشرفوا على الإنتخابات بل وخلى كلابه يعتدوا عليهم فى الإنتخابات ثم بعد كده إبتدى ينتقم من الدكتور أيمن نور وبعدين الدكتور نعمان جمعة ثم بعد ذلك الإعتداء على المستشارين وضربهم بالحذاء إللى أولى منهم إن هوه إللى يضرب بيه ولكن أنا لقيت إن الحل إن أحنا نغير الراجل إللى كل مرة بيركب له حته نعل جزمة فى مخه علشان كده مخه طخين قوى وغبى وقلت إننا نوديه المجزر الألى علشان نجيب له إكسسوار لمخه من هناك يمكن يقدر ينسى العقده الكبيرة قوى إللى عنده وما يحاولش إنه يتطاول على أسياده من القضاه والمستشارين ويخليه فى مسح جزم الإمريكان زى الأول أحسن له"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619115009/http://masr.20at.com:80/article.php?sid=227"

[[comments]]
order = 14
subject = "دى قضية مصر كلها"
author = "مصرى"
posted = "2006-05-08"
text = "أعتقد أن الإعتصام حق للإنسان فى دولة حرة ولكن مصر دولة تحت الإحتلال ولننظر كيف كان الزعماء فى عصور الإحتلال لمصر يتعاملون مع المحتل والدفاع عن مصر وعن شرعية وجود المحتل على أرض مصر الغالية وهم جميعاً من الحقوقيين مثل مصطفى كامل ومحمد فريد وسعد زغلول وغيرهم كثير. فنظام الحكم الموجود فى مصر ليس نظام شرعياًلأن الرئيس حسنى مبارك لم يأتى للحكم منذ تولى الرئاسة بإنتخاب الشعب كما ينص الدستور وكان وجوده فى الحكم طوال هذه السنوات بالتزوير وما بنى على الباطل فهو باطل. ثانياً كيف للقضاء أن يرتضى لنفسه هذه الوقفة المستجدية فى دولة محتله كان من المفروض المطالبة بتحرير مصر وليس الإنتظار من المحتل أن يعطيهم حقوقهم التى سلبها منهم الذى هو من وجهة نظر القضاء المتهم الأولى على قتل السادات وكل الأدلة تشير إلى أصابعة الخفية فى ذلك وكان لا بد أن يسقط القضاء شرعية الحاكم فى وجوده فى الحكم. وأيضاً لما أصاب مصر من فساد وتدهور وإخلال بكل مؤشرات الحياة من بطالة وتعليم وصحة وقتله للحياة الديمقراطية لكى يضمن سيطرة على الحكم وهذه نفس سياسة المحتل ولكن الحل الوحيد الذى لا بديل عنه هو الثورة على هذا الفساد وخاصة أن الشعب كله مؤيد لكم وملتف حولكم ولكنه ينقصه القيادة وأنتم القيادة الصالحة التى يتمناها المصريين جميعاً فماذا تنتظرون هل تنتظرون أن يقضى عليكم الحاكم كما فعل فى الحياة الحزبية وبذلك تفقدوا حتى أحترام الشعب لكم لا امل الأن إلا بالثورة والشعب كله معكم وفى إنتظار شرارة البداية على أيديكم يا شرفاء مصر لنطهرها من هذا الفساد المتسرطن"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619115009/http://masr.20at.com:80/article.php?sid=227"

[[comments]]
order = 15
subject = "وشعب عديم السان"
author = "سمير المصرى"
posted = "2006-05-28"
text = "القضاة الذين يدافعون عن اسقلالهم وعن شرف شعب غديم الشرف والسان غاب شعب مصر عن الدفاغ عن مصر غاب شعب مصر بلمشاركه من اجل شرفه ومن اجل كلمه حق اين ذلك الشعب انه تائه انه نائم بلا حراك وكائن الامر لا يعنيه فى شئ الدنيا تولع من حوليه وهو مش موجود...اين الشباب لقد اصبح الشباب تائه مع الدش والاغانى الخليعه القضة يا شعب ليس لهم فى الامر شئ الا انتم فاين انتم منهم انهم تركو منازلهم وتفرغو للدفاع عنا افلا يستحقون وقفه بجانيهم مهما كلف الامر...ولا الشعب خايف ان يقلع ملابسه او يهتك عرضه..اننا بلا كرامه فلزم على الحكومه ان تردعه..اذن لماذا الخوف والجبن ايها الشعب بيعت مصر وجردت من شركاتها ومصنعها وطرد اعمال ..بيعت مصر جمله وقطاعى ولم تجد من يقول لالالا..ولما وجدت الحكومه الشعب ساكت ولم يتحرك زادت فى غبائها واستحكمت ووافق حسنى اليهودى على تاجير سيناء لليهود...اين انتم يا ناس يا هموووووووووووووووواصحو فقو يا شباب ضائع فان الجوع قادم..وتاجير الدوله لليهود قادم...والله انا عمرى ماشفت ولا حشوف دوله للاجار"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619115009/http://masr.20at.com:80/article.php?sid=227"

