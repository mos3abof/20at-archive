subject = "الحكام ولا الشعب"
author = "على"
posted = "2006-04-26"
text = "احنا يا مصريين بصراحه احنا زى العسل بجد احنا ولا لينا راى ولا لينا كلمه مي احنا الحنا الشعب طظ فى الشعب ياعم شعب سيب الشعب فى الاخر بس الدوله بس احنا والله لو عقلناه هنلاقى الشعب هو الاساس ليه لان اى دوله مستقله دلوقتى مش بيبان شعبها ما بيبانش اللى فى حاله الثوره او فى حاله العمليات الاستشهاديه"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619115009/http://masr.20at.com:80/article.php?sid=227"

