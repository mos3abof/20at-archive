[[comments]]
order = 8
subject = "الله معكم يا رجال الامل"
author = "محمد حفنى"
posted = "2006-04-27"
text = "ولا تحسبن الله بغافل عما يعمل الظالمون<br />صدق الله العظيم<br />واللهى المساله مسالة وقت لا اكثر.<br />دولة الطغيان اصبحت كالقطار الذى فقدالمكابح ولم يبق امامه الا الاصطدام, فما يفعله النظام ليس سوى تاخير وقت النهايةبالنسبة له .<br />هذا القطار يزيح كل ما امامه ,<br />\"عليا وعلى اعدائى \"<br />هذا بالضبط ما يقوله النظام<br />انتظروا ياهل مصر<br />, هاااااااانت خلاص"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619115009/http://masr.20at.com:80/article.php?sid=227"

