posted = "2006-04-27"
text = "من زمان مشفتش صوره حلوه زى دى<br />منورها المستشار مكى اهوه<br />بس زعلنى انمبارح لما اتصل بخيرى رمضان على القاهر اليوم و قال هيفضو الاعتصام علشان موضوع دهب<br />ليه بس<br />هنطفى النور<br />و هنقول احنا معاكو<br />يا مكى بس انت تعتصم و احنا معاك"
