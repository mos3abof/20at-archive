[[comments]]
order = 10
subject = "يا اهلينا انضموا لينا"
author = "سمير المصرى"
posted = "2006-04-30"
text = "يوم 11 القادم يوم موقف..يوم حسم ..لابد وان ينضم جميع الناس جميع الشعب امام دار القضاء العالى..لكى يثبت هذا الشعب انه ليس نائم انه صحى من غفوته وله صوت..يسمعه الحاكم والحكومه..انه يوجد لنا صوت ومشاركه اخواننا القضاة الذين يدافعون عن هذا الشعب ..يوم 11 لابد ان يكون يوم مشهود..لا للظلم لا لقانون الطوارىء لا لبيع مصر جهرا امام اعين شعبها لا للتسلط لا للعبوديه لا للحتلال الداخلى ..لا لتصنيع الارهاب..اصح يا شعب مصر وعبر عن رئيك ..كفانا نوم كفانا سلبيه كفانا ياالله نفسى ...ايدك فى اديا نعيش يوم وطنيا..يوم 11 القادم موعدنا اما دار القضاء العالى"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619115009/http://masr.20at.com:80/article.php?sid=227"

