author = "مصرى"
posted = "2009-11-21"
text = "النظام المصرى والاعلام المصرى المتخلف كما يخدع شعبة يريد ان يخدع العالم<br />اولا ما الذى اغضب الجزائريون<br />1 - مقابلة الفريق الجزائرى فى القاهرة برجم اتوبيس الفريق بالطوب وتكسير زجاجة وجرح اللعيبة الجزائريون ونزلوا الملعب وعلى رؤوس بعضهم اربطة وشاش ولم يكتفى مؤلف الداخلية الفاشل بتاليف قصة ان اللعيبة هم اللى عوروا نفسهم وهم اللى كسروا زجاج الاتوبيس بطفاية حريق وقصة فيلم تنفع فى افلام يوسف فجلة ومسلسلات كعبورة المتكعبر<br />2 - الذى اغضب الجزائريون اكثر هو وفى داخل الملعب ارتفعت الهيصة والصفير والصريخ والزعيق اثناء عزف النشيد الوطنى الجزائرى وبعض المصريين داسوا على العلم الجزائرى باقدامهم ومزقوة امام شاشات التليفزيون<br />فطبعا لا بد وان ينتقم الجزائريون لكرامتهم وضربوا المصريين فى الخرطوم<br />وطبعا لن يحدث اى شىء<br />فالعرب كلهم يعرفون الوضع المزرى للمصريين واكاذيبهم الدائمة"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124030139/http://www.20at.com:80/masr/news/14112-2009-11-21-07-07-11.html"

