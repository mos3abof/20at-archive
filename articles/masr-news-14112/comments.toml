author = "ahlawi"
posted = "2009-11-21"
text = "فضح التلفزيون السوداني أمس إدعاءات الإعلام المصري بكشف حقيقة شريط الفيديو الذي أقاموا الدنيا ولم يقعدوها عليه، والذي يظهر شبابا جزائريين يحملون سكاكين ويلوحون بها، وقال التلفزيون أن الشريط قديم وهو ليس مصور في السودان بدليل أن سماء الخرطوم لم تكن بها سحب منذ أن وصل المناصرون الجزائريون إلى غاية إجراء المباراة مساء الأربعاء، عكس الشريط الذي يظهر السحب بشكل واضح.<br />واستغرب التلفزيون السوداني هذا السلوك غير المهني من طرف الفضائيات المصرية بما فيها تلك التي تنتمي إلى الدولة، ووضعها في سياق الحملة التي تقودها الفضائيات المصرية إلى السودان.<br />وقدم التلفزيون دليلا آخر على أن الشريط قديم، وأن الذين يظهرون فيه ليسوا المناصرين الجزائريين الذين دخلوا السودان، ويتمثل الدليل في كون المناصرين كلهم كانوا يحملون الرايات الوطنية ويحملون إشارات تميز للفريق الوطني، بينما لا يظهر ذلك في الشريط إطلاقا."
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124030139/http://www.20at.com:80/masr/news/14112-2009-11-21-07-07-11.html"

