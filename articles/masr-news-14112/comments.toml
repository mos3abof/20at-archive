author = "علي ساحي"
posted = "2009-11-21"
text = "للامانة فقط الشريط الذي يبين شباب يحملون السكاكين و يهتفون /هذا دين محمد هذا جهاد/ صور في الجزائر اثناء اجتياح غزة من طرف الاسرائيليين و هؤلاء الشباب كانو قد تقدمو للسلطات لمنحهم الاسلحة للتوجه لفلسطين و لما رفضت السلطات الجزائرية حملو السكاكين و تظاهرو كما رايتم و لم يكونو داخل ملعب الخرطوم كما روجت القنوات المصرية . و الدليل شوفو لباسهم الشتوي و ما فيهم و لا واحد لابس اخضر و لا واحد حاطط بوندة خضرة على راسو …طبعا مصر مش غريب عليها هذه الاشياء لانها عاصمة السينما و الممثلين …الله يهدي"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124030139/http://www.20at.com:80/masr/news/14112-2009-11-21-07-07-11.html"

