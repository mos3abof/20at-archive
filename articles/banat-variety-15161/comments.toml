text = "ايه يا اخ جيمس انا كل ما ادخل فى مكان الاقيك بتهاجم البنات دا انت فعلا طلعت معقد بمعنى الكلمه<br />وكمان الموضوع ده لو انت مش واخد بالك بيتكلم عن التحرش اللى مش الدعاره التحرش اللى بتتعرض ليه بنات حواء بمختلف اعمارهم دلوقتى من شوية شباب وقح غابت عنهم كل مفاهيم ومبادىء الحياء والدين وبيتحرشوا بالبنات فى الشارع والمواصلات وفى كل مكان بمنتهى الوقاحه ووصل لابشع الصور وده اللى انا عايزه اسميه نوع من انواع الارهاب بالنسبه بالبنات لانه بيسب لهم اثار نفسيه بتتحول لافكار سلبيه بشكل عام عن الشباب مع تزايد عدد حالات التحرش"
