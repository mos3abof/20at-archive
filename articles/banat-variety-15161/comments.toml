text = "انا شايفه من كلام جيمس ان هو بيتكلم عن بنات معينه ومش كل البنات البنات الى بتلبس ديق لدرجه اننا كبنات ما بنقدرش نسدق الى شايفينه و ساعات بقول البنطلون ده دخل فيها ازاى .يعنى بلاش نهاجم لمجرد الهجوم . وعايزه اقوله البنت الى كنت هتتخانق عشانها ممكن تكون مكسوفه ولا حاجه . هى كانت لازم تتكلم عشان ما تكسفكش انت شخصيا .وفيه فعلا بنات يستاهلو الحرق بس ده ما يبررش ان نحط الصالح بالطالح فى كيس واحد وبرضه ما ينفعش اننا نقول خلاص مدام البنت مش محترمه اعمل الى انا عايزه طب راحت فين اخلاق الولد نفسه ما هو كمان لازم يتقى ربنا ويحافظ على نفسه من الشيطان …بس يا جماعه بلاش ننزل بمستوى الكلام للدرجادى انا شايفه ان كتير منكم عنده حق بس فى اتجاهات مختلفه ."
