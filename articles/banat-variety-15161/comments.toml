posted = "2010-02-14"
text = "بصراحة انا بقول راى بس لالاسف فى شخصيات هنا تعبانة فى مخها وبقول حاجة لو بنت محجبة الناس بتتعاطف معاها ولو بنت مش محجبة ولا محترمة نفسها الناس بتقول تستاهل الا بيحصل لها لانها ماحدش رباها ولاليها اهل من اساس وبوجه كلامى لكل بنت بتلبس بادى قصير واندر طالع بره البنطلون الضيق او الجيب القصير ماتزعلوش لما تغتصبم او يتحرش بيكم حد لانكم مالقتوش حد يربيكم بس والعيب مش عيبكم العيب عيب اهاليكم واخواتكم واستغفر الله العظيم من كل زنب عظيم وياست ام جهل استرى نفسك لو لقيتى واحد وحش هتلاقى الف كويس وهتلاقى ربنا بيسترها معاكى امشوا ورا الجماعة الا مش مسلمين وقلدوهم كويس قوى اعملوا اى حاجة هما عاوزينكم تعملوها لانكم مافيش عقل مافيش دين عاوز اعرف ازاى الام بتسيب بنتها تخرج كده حد يقولى فين الغيرة بحمد ربنا انى انا من قرية ومش من مدينة بحمدك يارب انك جعلتنى من قرية علشان مايكونش طبعى من طبعكم ومايكونش ماعنديش نخوة"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309063353/http://www.20at.com:80/banat/variety/15161-2010-02-01-17-56-12.html"

