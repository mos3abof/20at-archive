text = "انا بنت محترمه و افتخر … و خلي جيمس و اللي زيه ينتحر<br />ربنا يشفيك يا بني .. عشان واضح ان نفسيتك تعبانه بجد … و محتاج مصحه نفسيه … دي اقل حاجه تتقالك عشان انا محترمه جدا مش هرد عليك باسلوبك الواطي ده … و واضح جدا انك م الفئه اللي بتعمل كده عشان كده محموق اوي في الدفاع عنهم … وبعدين انت مالك انت النت لابسه ايه ماتخليك في حالك و لما انت بقي بتتكلم علي لبس البنات انا برضه ممكن اتكلم علي لبس الولاد لكن انا مش هقول كده عشان اانا محترمه و بحترم حريه الاخرين و مش بمشي اتفرج ع الناس في الشارع و اقلعهم و البسهم علي مزاجي..و طبعا انت عترف نفسك انهي فيهم .. خليك فرحان بنفسك كده و بمستواك الاخلاقي ده … انا اسفه جدا جدا جدا لكل الناس المحترمه اللي في التوبيك ده لكن الشخص ده ماينفعش ارد عليه احسن من كده"
