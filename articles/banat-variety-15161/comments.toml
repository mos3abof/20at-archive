text = "هو انا يام جهل انتى قولت حاجة على البنات المحترمة ياعبيطة اخواتك يالى اصلا ماعرفش انتى بتفهمى منين انا اتكلمت عن البنات الا بيتحرش فيها بمزاجها وهى موافقة جدا واتكلمت عن المدرس الا مارس مع 18 تلميذة وبمزاجهم وصوروهم من غير مايعرفوا وطبعا ماقدرش اتكلم على اى بنت محترمة وبما انك انسانة مش محترمة اكيد حاسة ان فيكى عيب فانا عازرك ومش هلوم واحدة زيك وبعدين انا بقول لاى بنت محترمة انا مابهجمش المحترمين لانهم طبعا احسن منى ميه مرة وانضف منى ومن ام جهل ومن غيرها كتير وبقول انى عاوز اهدى احترامى وتعظيمى لاى بنت محجبة محترمة عارفة ربنا وماشية بما يرضى الله"
