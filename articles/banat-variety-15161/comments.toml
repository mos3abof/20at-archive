text = "ياجماعة المجتمع كله فيه خللولاد وبنات المجتمع استغفر الله بقا حاجة وحشة اوى ياجماعة ماعدش فيه امان ولاخير ولا الناس بتحب بعضها وماحدش طايق حد انا عارف ان البنات ضعفة ومابيقدروش انهم يعملوا حاجة فى وسط المجتمع ده بس معلهشى ياجماعة مش بقصدكم بقصد البنات الا مالهاش حد يلمها والا انتوا وانا بنشوف منهم كتير دول بيخلوا الكل سواسية لما احنا بعدنا عن تقاليدنا وعادتنا ومشينا ورا الا هما عايشين فى بلدنا بس هما مش من دينا ونسينا نفسنا وعملنا كل حاجة زيهم وايه سبقناهم انا فى مرة بركب عربية من على طريق ورايح القاهرة شوفت واحدة بصراحة قلت دى ممكن تكون اجنبية بادى ضيق جدا وصغير بنطلون ضيق جدا وهيفرقع عليها شعرها اصفر وجسمها ابيض وصدرها مكشوف وقعدت جامبى ماشغلتش بالى لكن شوية ولاقيتها بتطلع مصحف وبتقرا فيه وبما انى من قرية بقا فحبيت اعمل عبيط فقلتلها لو سمحتى ممكن سؤال فقالت ممكن فقلتلها حضرتك مدرسة دين قال لا قلتها هتمتحنى فى دين قالت لا قولتها اصل لبسك مع المصحف يعنى غريب شوى اصل انا افتكرتك ———- وسكت ليه ياجماعة بننسا نفسنا ونمشى ورا غيرنا ونرجع نقول ياريت الا جرا ماكان"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309063353/http://www.20at.com:80/banat/variety/15161-2010-02-01-17-56-12.html"

