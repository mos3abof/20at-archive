[[comments]]
order = 9
subject = "يا اخوانا بلاش هيافه"
author = "مصري"
posted = "2006-05-24"
text = "الأهلي يستحق الفوز و الحكم ما جاملوش...يعني فيه راجل فاهم كوره يطلع يقول مش كل لاعب يتكعبل جوة المنطقة يتحسب لة بنالتي و لا كل لاعب يمسك الكوره بايده جوة المنطقة يتحسب لة بنالتي و بعد كده نسال و نقول بنتبهدل في الماتشات العالميه ليه ... و بعدين هو الاهلي مسؤول عن مشاكل الانديه .... علشان كده احنا في النازل و ها نقضل طول ما الفكر ده موجود"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602125750/http://masr.20at.com:80/article.php?sid=361"

[[comments]]
order = 10
subject = "الكلام ملوش لزمه"
author = "محمد صابر"
posted = "2006-05-24"
text = "يا جدعان الكلام فى الموضوع ملوش لزمه و الناس هتفضل تقول على الفريق اللى بيكسب بيكسب بسبب الحكام لان طبيعة الانسان مبيعترفش بالفشل و بيحاول يعلق غلطاته على اى شماعه و اسهل حاجه الحكاميعنى لو كان الاسماعيلى هوه اللى فاز كان هيتقال عشان الحكام و الحكم عمل كذا و كذا والناس بتظيط فى الظيطه واحد زملكاوى عشان فريقه عمال يتغلب و كرامته مهدوره و كل ما يقابل واحد اهلاوى الاهلاوى يبهدله تريقه يرد الزملكاوى و يقول عشان الحكام ولو العكس كان اللى حصل كان برده الاهلاوى هوه اللى هيقول الحكام فاحسن حاجه ننفض ومنتكلمش فى المواضيع ده لان الاحسن هوه اللى بيكسب فممكن جدا فريق يكسب ماتش ولا ماتشين بسبب حكام ولكن مش معقوله كل الحكام و الاتحاد و الصحفيين و الاعلاميين متفقين للاهلى ضد باقى الانديه واللى يقول غير كده يبقى عبيط و ميتردش عليه"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602125750/http://masr.20at.com:80/article.php?sid=361"

[[comments]]
