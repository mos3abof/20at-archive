author = "هاى شو"
posted = "2006-05-24"
text = "مش معقول ان الحكام على طول بتظلم الاسماعيلى اناشايفةالماتش دة الاهلى هو المظلوم شوف الماتش كويس وانسى انت بتشجع مين واحكم با لعدل عماد متعب ولالاعب الاسماعيلى يستاهل الاانذار وبردوة بركات شوف الماتش تانى واحكم بالعدل"
archived = "2006-06-02"
