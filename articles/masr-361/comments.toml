author = "محمد النقيب"
posted = "2006-05-24"
text = "للاسف مفيش حد محايد في مصر..الاسماعيلي اتظلم..دي حقيقه..الاهلي بيتجامل..دي برضه حقيقه..معاكم ان الاهلي هو الافضل حاليا وانه مكنش هيكسب لو مكنش الافضل..بس برضه اللي حصل في الماتش ده مجامله للاهلي..<br />وارجع اقول برضه مفيش حد محايد.."
