[[comments]]
order = 12
subject = "حسبنا الله ونعم الوكيل"
author = "اسمعلاوي قرف من الظلم"
posted = "2006-05-24"
text = "لحد امته الفريق الي اسمه الجاهلي هيفضل كدا....لحد امته الكوسة وال.....هيفضلوا موجودين<br />في الماتش الاول الحكم اعترف انه ظلم الاسماعيلي...اخدنا ايه؟؟؟؟<br />ودلوقتي الدنيا كلها شايفة الفاسد اللي اسمه عودة واللي عملوا<br />طبعا الاهلوية دا الطبيعي عندهم انهم يكسبوا بأي طريقة عشان كدا هما مستغربين طبعامن اللي حصل وشايفين ان الماتش طبيعي عشان اخدو ضربات الجزاء المقررة ليهم في كل ماتش<br />وسيستمر صياح الجماهير ...العب...يا عودة<br />وليس العب يا اهلي"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602125750/http://masr.20at.com:80/article.php?sid=361"

[[comments]]
order = 13
subject = "عيب يا جمهور الدراويش"
author = "رضوى نبيل"
posted = "2006-05-27"
text = "بعد كل العلاقة الجميلة الي بتربط النادي العظيم النادي الاهلي والنادي الاسماعيلي يحصل كل دة ؟؟؟ طب ليه ؟؟ الدوري انتهى والفوز او الهزيمة ولا هيقدم ولا هيأخر . ربنا يهديهم . هدف محمد عبد الوهاب احلى اهداف المباراة ."
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602125750/http://masr.20at.com:80/article.php?sid=361"

