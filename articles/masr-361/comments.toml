[[comments]]
order = 0
subject = "الاهلي حديد"
author = "DEAD MAN"
posted = "2006-05-23"
text = "اولا ان شفت الماتش وضريتين الجزاء صح ميه في الميه وبركات معملش حاجة للاعيب الزمالك<br />ثانيا مبروك الفوز للاهلي واهم الاسماعيلاوية خدوا ستة رايح وخدوا اربعة جاي زى ولاد عمهم الزمالكوية علشان ميبقاش في حقد بين ولاد العم ثالثا اللي بيقول ان الحكام مرتشين ما يدفع هو كمان ولا الحكام مرتشين بس لناس وناس<br />رابعا الاهلي حديد وانا ركبي حديد<br />الاهلي حديد وانا ركبي حديد"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602125750/http://masr.20at.com:80/article.php?sid=361"

