subject = "أمة تائهة ياولادالحلال"
author = "عادل حسين"
posted = "2006-05-23"
text = "انتهىالمولدوالدراويش تاهوفيه والحكام مغلوبين على امرهم زى اىحدفى المولدلكن كم عددالاهداف وضربات الجزاء الملغاة او المعادة للدراويش انتوا مش مكسوفين من انجولا ومن بلادالافيال وصلواكاس العالم واحناخدناكوزالامم بدعاءالوالدين والخطةالعتيقة مدد مدد شدى حيلك يابلدأفيقوا من التوهان بدل الملايين الى رايحةلاشباه اللعيبة والمدربون الكيعان ونبيكم يسب من الفايكنج قطاع طرق اورباوغجرهابتوع البقر والجبنة وسلمولى على الدورى"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602125750/http://masr.20at.com:80/article.php?sid=361"

[[comments]]
order = 3
subject = "دي جماهير ولا"
author = "احمد"
posted = "2006-05-23"
text = "يستحي قلمي الصاق الوصف المستحق علي تلك الفئة من جماهير الاسماعيلي تادبا مع نفسي وتشجيعا لتلك الطفرة الهائلةمن السلوك الرائع للجماهير المصرية فما حدث من الغوغاء ردده من نطلق عليهم تجاوزا العقلاء رئيس النادي والمدرب المساعد غير الشريف والحكم المساعد ايضا غير العفيف ولا النظيف ولو انهم رجعوا لشريط المباراة لعادوا لما نهوا عنه ولقدموا الشكر للنادي الاهلي الرفض لتعميق جراحهم ولو عادوا لشريط المباراة ونظروا لخيال كلا من بركات ومدعي الموت لتيقنوا انه لم يحدث ثمة احتكاك بين اللاعبين وان لاعب الاسماعيلي يستحق الطرد لادعائه الكادب مع العلم ان التحكيم في المباراة لم يكن له ثمة تاثير ايجابا او سلبا في نتيجتها ويجب علي اتحاد الكرة ان يكون له موقفا ايجابيا في معالجة احداث المباراة واري حرمان تلك الشرزمة من مشاهدة مباراة الاهلي باستاد الاسماعيلية لمدة سنتين ان اردنا القضاء علي احداث الشغب وردع المشاغبين والموتورين من كل الجماهير"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602125750/http://masr.20at.com:80/article.php?sid=361"

