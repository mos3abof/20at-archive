subject = "الفسم للاهلي بالولاء"
author = "محمج عماد"
posted = "2006-05-24"
text = "اقسم بالله العظيم ان اظلم الفريق اللي قدام الاهلي مهما كان(قسم الحكم)<br />نقسم بالله ان نساعد الاهلي بقوانين وكل اللي نقدر عليه(اتحد الكوره)<br />ياجماعه لازم نعترف الاهلي فريق عظيم والاسماعيلي فريق يتيم(الاعلام)"
