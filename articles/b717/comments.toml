subject = "حزب الله شيعي، فهمنا، ولكن ماذا فعلتم لحماس السنية؟"
author = "محمد على حسن"
posted = "2006-08-05"
text = "بقلم: د. محمد صالح المسفر<br />خرج علينا احد الزعماء العرب في وسائل الإعلام يقول: إن بلاده لن تدخل حربا دفاعا عن لبنان أو حزب الله وان زمن المغامرات قد انتهى والسؤال الموجه الى ذلك الزعيم من طلب منكم فخامة الرئيس أن تجهز جيشك وترسله دفاعا عن لبنان أو المقاومة اللبنانية أو المقاومة الفلسطينية؟ إن كل الذي طلب منك ومن زملائك في قمة هرم السلطة السياسية في عالمنا العربي أن لا تقفوا مع العدوان وتعطوه ذرائع ومبررات ليمعن في الحرب ضد الشعب العربي في لبنان وفلسطين والعراق، إن كل المطلوب منكم جميعا اليوم هو الصمت التزاما بالقول المأثور \"قل خيرا أو اصمت\". إن كل كلمة تقولها فخامة الرئيس الكبير تصب في صالح العدو، فمثلا قولكم إن المقاومة اللبنانية تعمل لصالح قوى إقليمية وإنها تقاتل الجيش الصهيوني بموجب توجيه من إيران وسوريا قول فيه تجني على شرعية المقاومة الباسلة. إن هذا قول أميركي بريطاني إسرائيلي ترددونه بوعي أو بدون وعي، والقول بان وقف إطلاق النار يتطلب وجود قوات دولية للإشراف على تنفيذه قول ليس عربيا إلا في كلماته.<br />وراح عراب هذه الأقوال يقول \"يجب مساعدة الحكومة اللبنانية على بسط سيادتها على كل الأراضي اللبنانية\"، ونرحب بهذه المقولة ولكن الأراضي اللبنانية تشمل مزارع شبعا والقرى السبع التي احتلت من قبل إسرائيل على مدى الخمسين عاما من تخاذل الحكومات اللبنانية المتعاقبة وأيضا من قواعد السيادة أن لا يوجد جندي أجنبي على تراب لبنان بما في ذلك القوات الدولية وإذا كانت إسرائيل خائفة من الشعب اللبناني فعليها أن تطلب قوات دولية تعسكر في الجليل الأعلى من فلسطين المحتلة وليس على التراب اللبناني.<br />لقد أرمض مسامعنا بعض المسؤولين العرب بان حزب الله يتلقى أسلحة ودعما ماديا من إيران عبر سوريا ويعبرون عن احتجاجهم عن هذا الدعم السوري الإيراني لحزب الله في مواجهته مع الجيش الصهيوني.<br />السؤال الذي يجب توجيهه لهؤلاء المسؤولين العرب المتخاذلين، لماذا لا تحتجون على تزويد أميركا إسرائيل بكل مكونات القوة عسكريا واقتصاديا وإعلاميا وسياسيا في كل المحافل الدولية، ونقطة العبور للدعم العسكري لإسرائيل بريطانيا بما في ذلك الأسلحة الصاروخية الموجهة بالليزر وهي احدث ما لدى اميركا اليوم. أليست الطائرات الحربية التي تقصف كل لبنان اليوم هي صناعة أميركية وكذلك المدفعية الثقيلة التي تدك قرى ومدن لبنان والمدن الفلسطينية ومخيمات اللاجئين الفلسطينيين في الضفة والقطاع؟<br />هل عميت أبصاركم وبصائركم عن هذا كله ولا ترون إلا ما تقدمه إيران من سلاح لحركة المقاومة اللبنانية دفاع عن لبنان؟ إذا كنتم لا تريدون إيران أن تقدم العون والمساعدة للمقاومة اللبنانية والفلسطينية فلماذا لا تقدمونها انتم أيها القادة العرب وتحرمون إيران شرف الدفاع عن أراضيكم وتشعرون المقاومة إنها في حاضنة عربية. قد يقول بعض السخفاء إن المقاومة اللبنانية كلهم شيعة وأنكم لا تؤيدون المذهب الشيعي ولا أتباعه، ليكن ذلك، لكن إسرائيل في عدوانها لم تفرق بين سني وشيعي وماروني إنها دمرت لبنان من جنوبه مرورا بالعاصمة بيروت الى طرابلس شمالا الى شرقه فماذا انتم قائلون؟<br />نعترف بان معظم رجال المقاومة اللبنانية، ولا أقول كلهم، من الطائفة الشيعية. والسؤال هل ذهب أحدكم يا أتباع السنة للالتحاق بالمقاومة كما فعلتم في أفغانستان والشيشان وأماكن أخرى ورفض طلبكم؟<br />وماذا عن المقاومة الفلسطينية؟ كلهم من أتباع المذهب السني السائد في فلسطين، فلماذا تذبح المقاومة هناك تحت أسماعكم وأبصاركم وأمعنتم في محاصرتها مالا وسلاحا بل حتى ضايقتم وتضايقون الفلسطينيين في عواصمكم العربية، من منكم يا عرب الانبطاح انتشل الفلسطينيين العالقين على الحدود الأردنية السورية العراقية هروبا من الحرب الطائفية في العراق.<br />ونسألكم ما سر تفازعكم على شاشات التلفزة تحضون شعوبكم على التبرع لإخواننا اللبنانيين بالمال والمؤن - وليس لدي أي اعتراض على ذلك إطلاقا، حقا إنهم يتعرضون لعدوان همجي. لكن إخواننا الفلسطينيين يتعرضون لذات العدوان لأكثر من ستة اشهر. هدمت منازلهم وجرفت أراضيهم وقتل شبابهم من قبل جيش العدو الصهيوني ويحتفظ العدو بأكثر من عشرة آلاف أسير فلسطيني ولم تأخذكم الحمية العربية والإسلامية للعمل من اجل إطلاق سراحهم من المعتقلات الصهيونية. أما الجندي الإسرائيلي الاسير لدى المقاومة الفلسطينية فقد قامت قيامتكم وتمارسون التهديد والوعيد على المقاومة الفلسطينية الباسلة من اجل إطلاق سراحه فورا وإلا فان الويل والثبور سيحل بالفلسطينيين جميعهم.<br />نذكركم بان المقاومة الفلسطينية سنية ولم تقدموا لها العون فما عذركم إذا قبلنا بحججكم الواهية أن المقاومة اللبنانية شيعية ولن تمدوا يد العون لهم. ومن هنا فلا حجة لكم بعد اليوم إذا قبلت المقاومتان أي دعم أيا كان نوعه من أي جهة أخرى. نريد أن نذكركم بان المقاومة اللبنانية والفلسطينية لم تطلبا جيوشكم لتحارب نيابة عنهما.<br />كلمة أخيرة: لقد أحرجت المقاومتان جيوشكم وكشف قادة هذه المقاومة تبعيتكم للآخر وتخاذلكم عن الدفاع عن الأمة العربية والإسلامية. والآن لا حاجة لنا بكم إن عاصمنا اليوم من العدوان الصهيو ـ اميركي بعد الله هو المقاومة الباسلة، سدد الله رميهم ونصرهم."
