subject = "اخطرهم وعاض السلاطين"
author = "محمد على حسن"
posted = "2006-07-21"
text = "اقراء واحكم انت بنفسك<br />- أكبر شيخ سعودي يفتي ضد حزب الله -<br />- واسم -<br />- بن جبرين افتى بحرمة الدعاء لحزب الله اللبناني -<br />( الرياض - 18 يوليو 2006) ... أصدر الشيخ الوهابي السعودي عبد الله بن جبرين يوم أمس الأثنين فتوى ضد حزب الله اللبناني، قال فيها انه \"لا يجوز نصرة هذا الحزب الرافضي ، ولا يجوز الإنضواء تحت إمرتهم ، ولا يجوز الدعاء لهم بالنصر والتمكين\".<br />ووجه بن جبرين نصيحة للمسلمين السنة قائلا \"ونصيحتنا لأهل السنة أن يتبرؤا منهم، وأن يخذلوا من ينضموا اليهم، وأن يبينوا عداوتهم للإسلام والمسلمين\".<br />ويعتبر بن جبرين ثاني أكبر مرجع ديني للحركة الوهابية في العالم بعد الشيخ عبدالرحمن البراك. وكان بن جبرين يشغل منصبا عاليا في لجنة الإفتاء الحكومية حتى تقاعده قبل سنين قليلة، وتنشر له وكالة الأنباء السعودية الرسمية (واس) أخباره ومحاضراته التي تتولى وزارة الشؤون الإسلامية تمويلها.<br />وتأتي الفتوى الدينية متناسقة مع التصريحات السياسية المتكررة للحكومة السعودية الأسبوع الماضي والتي حملت فيه حزب الله المسؤولية الكاملة للقصف الإسرائليلي على لبنان. وأكد هذا الموقف وزير الخارجية السعودي سعود فيصل آل سعود المعروف بعدائه الشديد للشيعة في البلاد. وأصدر الوزير قرارات متتالية يحرم فيها المواطنيين الشيعة من العمل في وزارة الخارجية السعودية، حيث لايوجد موظف شيعي واحد في وزارة الخارجية التي يرأسها منذ 31 سنة.<br />ويشهد الشارع السني والسلفي الوهابي في السعودية إنقساما حادا في موقفه تجاه حزب الله، حيث برزت أصوات سلفية لأول مرة تؤيد حزب الله، وبدا أن الفتوى أتت لقطع الطريق على تنامي تأييد الشارع السلفي الوهابي لحزب الله الشيعي.<br />ونشر الفتوى موقع نور الأسلام والذي يديره الشيخ الوهابي محمد الهبدان والمعروف بتأييده لتنظيم القاعدة. وكما جرت العادة فانه ليس من المتوقع نشر الفتوى في وسائل الإعلام التي تسيطر عليها الحكومة."
