text = "عجبت من كلام ساخر لا يصدر إلا من أفاك ماكر ينخر في الدين كالسوس ويتكلم كالمهووس المفروس من تريد أيها الجاهل العجيب إلى ماذا ترمي أيها الساقط المريب كلماتك كلها تعميم جهل وظلم وعليه تصميم تقول الكلمات يكسوها الإصرار وتعيدها ليا وبتكرار قذفت إلينا من قاذروات أفكارك وذيلتها بنتن إقرارك وإني أشك في إيمانك وأتهمك في إتزانك فإن كنت غير مخبول فلست إلا غبي حاقد مسطول لن أكمل فمثلك ليس معه من الدين إلا طعنا في العلماء ورميهم المساخر ووصفهم بالجهلاء فرميت أهل الحق بما انت به أحق فكانت كلماتي إليك عقاب في بداية الطريق لمثلك هي ردا رقيق وأنتظر باقي التعليقات التي سوف تكون عليك الصواعق المرسلات لتدمير أفكارك الهدامات، وهذا عن هذا المخبول.<br />وعن الموضوع فلما نتهم السعودية دائما بالتقصير في الدين لا نقول أنها كمل فيها الدين وتخلصت من العصاة والفساق والملحدين وإنما هي أفضل دولة عربية تطبق الشريعة الاسلامية بلاد دعا لها سيدنا إبراهيم وأحبها رسول الله ودفن فيها أليس لذلك أثر على أن تبقى أفضل ديار الإسلام وحامية جناب شريعة رسول الأنام فهل من دولة كملت فيها صفات السعودية، فكل البلاد فيها من العيوب ما الله به عليم وهذا الموضوع - الفتاوى - منتشر في أوساط المسلمين كلهم أو معظمهم فلما نخص السعودية حقيقة يجب أن نغير نظراتنا لإخواننأ المسلمين في كل بلاد الإسلام ثم ما يميز المسلم هو دينه ومدى تمسكه به وليس موطنه وعائلته وجنسيته .. إلخ، فأتقوا الله وأعلموا أنكم مسؤلون عما تقولون فالله يسأل الصادقين عن صدقهم يوم القيامة-كما أخبر في كتابه الكريم- فكيف بغيرهم فالتفوا حول كتاب الله وسنة رسوله مقتفيين أثر الصحابة الكرام نجوم الإسلام وأنزعوا ربقة التحزب من رقابكم ولا تختلفوا فتنازعوا وتذهب ريحكم وأصيكم ونفسي بتقوى الله<br />أخوكم إسلام"
