subject = "مرتزقة آخر الزمان"
author = "محمد على حسن"
posted = "2006-08-05"
text = "- الحوالي: الدعاء لحزب الله ضد إسرائيل حرام -<br />( الرياض – 6 أغسطس 2006) ... أفتى الشيخ السعودي البارز سفر الحوالي يوم الخميس الفائت بحرمة الدعاء لحزب الله بالنصر او تقديم أ ين نوع من الدعم له في حربه مع إسرائيل.<br />وقال الحوالي عصر يوم الخميس أمام تجمع استقبله في مدينة النماص الجنوبية القريبة من قرية الحولة مسقط رأسه على حدود منطقة عسير والباحة، أنه لايجوز الدعاء لحزب الله بالنصر على إسرائيل.كما هاجم الحوالي الشيعة في السعودية ووصمهم بالشرك. ورغم معاناة الحوالي من جلطة دماغية اصابته العام الماضي وسببت له أعاقة دائمة وشلل جزئي إلا انه مستمر في إصدار الفتاوى.<br />وأكد موقع (أمة الإسلام) الذي يشرف عليه الشيخ علي بن مشعوف أحد منظمي زيارة الحوالي ان الفتوى صدرت بحضور قاضي محافظة النماص الشيخ محمد المهنا، وعدد كبير من مشائخ<br />المحافظة وطلاب العلم فيها ولاقت تأييدهم.<br />وتأتي فتوى الحوالي بعد ثلاثة أسابيع من فتوى مشابهة أصدرها الشيخ عبدالله بن جبرين، الرجل الثاني في الهرم الديني للحركة الوهابية، يحرم فيها الدعاء لحزب الله اللبناني، ويطلب فيه ممن يعتبرهم من المسلمين السنة بتخذيل من ينضم اليهم. وسببت فتوى ابن جبرين ردة فعل عنيفة من علماء المسلمين السنة في العالم حيث رفضها غالبية علماء مصثر وفلسطين والجزائر وسوريا والأخوان المسلمين، ودعوا الى نصرة الحزب بالدعاء والنصرة المادية.<br />كما تسببت فتوى بن جبرين في تصادم مواقف رجال الدين السلفيين والوهابيين، وصرح الشيخ ناصر العمر بوجوب معارضة حزب الله باعتباره عدوا أبديا للمسلين السنة.<br />وأصدر الشيخ السعودي سلمان العودة فتوى مشفرة تؤيد المقاومة بشكل عام بدون ذكر أسم حزب الله، لكنها اشتملت على تكفير مبطن للشيعة. وقال الشيخ فيصل الفوزان بجواز الدعاء لنصرة حزب الله على اسرائيل فقط"
