order = 15
subject = "حمزه الحسين"
author = "الى محمد على حسن الذي شارك هنا بالرد في اعلاه."
posted = "2006-08-03"
text = "اولا ابن جبرين ليس مفتي السعوديه وليس اكبر شيخ فيها وراءيه صدر باسمه وليس<br />باسم المؤسسه الدينيه في السعوديه لذلك فهو راءيه الشخصي كما ان شيوخا اخرين من السعوديه اكثر اهميه من الجبرين اصدروا فتاوى تؤيد من يقف في وجه اسرئيل بل وتنتقد الجبرين لكن الطائفيين في الجهه الاخرى يتعمدون اغفال تلك الاراء<br />ان راءي الشيعه في السنه والذين يسميهم الفقه الشيعي الجعفري بالنواصب ليس<br />بذلك الجمال او البراءه بل ان الشيعه يكفرون السنه ويسمونهم بالنواصب اي الذين يناصبون ال محمد العداء غير ان الشيعه لا يتحدثون عن ذلك علانيه الا بالرمز ويختارون ممارسه التقيه التي هي فرض ديني شيعي فيخفي الشيعه راءيهم<br />الحقيقي في السنه لذلك لا تقم بلوم ذلك الشيخ بتلك القسوه على الاقل هو قال<br />مافي قلبه فعلا وبصراحه فلا تكافىء ايات الله على كذبهم فتظهرهم كحمل بريء بينما<br />الواقع انهم يكذبون انظر الى ايران وحال السنه فيها ولتعلم انه ممنوع في<br />طهران افتتاح مسجد سني ومسموح بالكنائس ومعابد اليهود وتستطيعون التاكد<br />من هذه المعلومه عن طريق البحث ان حال سنه ايران يعطي فكره عن رأي الشيعه<br />الحقيقي في السنه لذلك اقول ان كان ابن جبرين طائفيا فان ايات ايران والعراق<br />ليسوا باقل منه طائفيه بل لعلهم اقبح منه."
