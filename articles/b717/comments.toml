text = "الوهابيه فى خدمه من؟<br />هل فكر الوهابيه يوما ما بمصالح المسلمين الكبرى؟<br />هل فكروا يوما فى التصدى للمطامع الاستعماريه فى بلادنا الاسلاميه؟<br />هل شغلهم الغزو الغربى لبلاد المسلمين؟<br />ماذا قدموا فى مواجهه النفوذ الصليبى والصهيونى فى بلاد الاسلام؟<br />ما هو موقفهم من الولاء للغرب وفتح الابواب امامه ليبسط يديه على ثروات المسلمين وعلى سيادتهم وكرامتهم؟<br />لم يعد شى‏ء من ذلك خفيا على احد، فما ان يفتح المسلم عينيه الا ويدرك ان الوهابيه هم اول خدام الاستعمار الغربى فى بلاد المسلمين..<br />وليس هذا فقط، بل انك لو تتبعت تراث محمد بن عبد الوهاب وقاده الوهابيه الاوائل من بعده فلا تجد فيه اثرا لعماره الارض، واقامه العدل، وانصاف المظلوم، ومكافحه الفقر والجهل..<br />ولا تجد فيه اثرا لتحسين وجه الحياه، وتحقيق التقدم العلمى والاقتصادى والاجتماعى..ولا اثرا للسلم والرخاء..<br />بل لا تجد فيه سوى تكفير المسلمين ورميهم بالشرك، وايجاب قتالهم واستباحه دمائهم واموالهم!!<br />ان كل الذى يشغلهم هو وجود قبر هنا، ومسجد هناك، ورجل يقول: يا نبى الرحمه اشفع لى عند اللّه!!<br />هذا هو شغلهم لا غير، وهذا هو همهم الوحيد الذى انطلقوا تحت غطائه يسفكون دماء المسلمين ويستبيحون المحرمات ويثيرون الفتن واحده بعد الاخرى، ولا يهمهم بعد ذلك ان تكون بلاد المسلمين غرضا للاعداء من مشركين وكفار وصليبيين وصهاينه.<br />هل هز مشاعر شيوخ الوهابيه وامرائهم ما جرى لبيت المقدس، ولمسلمى البوسنه والهرسك ولبنان، كما هزهم قبر سيد الشهداء حمزه بن عبد المطلب الذى كان الصحابه يزورونه ويصلون عنده؟<br />ام اثارهم التسلط الامريكى على منابع النفط فى بلادنا الاسلاميه، كما اثارهم قبر ريحانه الرسول الحسين بن على الذى كان الصحابه والتابعون يشدون الرحال لزيارته وحتى فى زمن الامام احمد بن حنبل كما تقدم نقله عن ابن تيميه؟<br />وهل سيثيرهم الحصار المفروض على الشعب الليبى المسلم بلا حجه وبلا ادنى ذريعه يمكن قبولها، كما اثارهم ما وجدوه من هدايا علقت عند قبر الرسول الاكرم؟<br />ليتنا نجد منهم ذلك او بعضا من ذلك..<br />انها لمن دواعى الاسى ان تنفق كل هذه الاوقات والجهود والاموال والطاقات الفكريه فى الخوض فى سفاسف الامور وتوافه الكلام التى لا ينشد لها الا الجهله والغوغاء والعاطلون من الناس.<br />ان الذى جعل الوهابيه يجدون شغلهم الشاغل فى هذه المواضع عده امور كلها تصدق عليهم:<br />منها: الضحاله الفكريه وضيق الافق.. فهم لا يحسنون شيئا الا هذا النوع من الكلام، ولا تستوعب اذهانهم سوى هذا المدى من التفكير.<br />ومنها: العجز عن فهم الحياه وعن مواكبه العصر.. فهم عاجزون تماما عن التقدم فى البحوث الدينيه والعلميه والاجتماعيه تقدما مقبولا فى هذا العصر الحديث، فينكبون على الكلام البالى والمتهرى فيبالغون فى تعظيمه وتقديسه لكى يجدوا لانفسهم منفذا يطلون منه على هذا العالم المتقدم.<br />ومنها: ضيق صدورهم وامتلا قلوبهم بالحقد وكراهيه الخير وحب الشر لهذه الامه.. فمن تتبع لهجاتهم ونبراتهم المتشنجه والمتوتره وانشدادهم انشدادا فى غير محله وتهورهم فى الخطاب، لمس فيهم الضحاله وضيق الافق والحقد والبغض والهمجيه والتخلف بكل معانيها.<br />ومنها: موالاتهم الصريحه والعلنيه لاعداء الاسلام.. وهذا موضوع لا يحتاج الى بيان وليس هو بخاف على احد، فليس بين فئات المسلمين من يدين بالولاء للغرب كما يدين له الوهابيه، يخضعون له ويتقربون اليه ويدافعون عن عملائه الخونه، وما يزال هذا هو دينهم الذى لا يرتضون له بدلا.<br />ان وجودهم فى بلاد الاسلام فتح ولا يزال يفتح الابواب امام الصهيونيه والصليبيه المعتديه لتنفذ كيف تشاء فى الكيان الاسلامى، فتمزق وتنهب وتدمر وتحاصر وتبسط نفوذها، وهولاء يمهدون لها كل شى‏ء ويساندون اخوانهم الخونه فى كل مكان..<br />انهم الجرثومه الخبيثه التى مهدت للغرب سابقا ان يزرع اسرائيل اللقيطه فى قلب هذه الامه.. وهم الذين ساندوا على الدوام جميع الانظمه العميله للغرب ووقفوا معها بوجه حركات التحرر الابيه..<br />وهم الجرثومه الخبيثه التى تمهد اليوم لتثبيت اقدام المعسكر الغربى فى قلب العالم الاسلامى.. ولتثبيت اسرائيل اللقيطه حتى لا يفكر احد فى ازالتها..<br />وهم الايادى اللعينه التى يحركها الغرب لمواجهه الصحوه الاسلاميه المتصاعده اليوم ومسانده الانظمه العمليه والمنافقه التى تتولى قمع الصحوه الاسلاميه بالنار والحديد.هذه هى حقيقه ما انجزه الوهابيه وما ينجزونه اليوم وما يدينون به لمستقبلهم!!<br />انهم يخشون الصحوه الاسلاميه كما تخشاها اسرائيل، لان مصيرهم اصبح رهينا بمصير اسرائيل"
