subject = "اشمعنى السعوديه؟"
author = "عبدالله مفتاح"
posted = "2006-04-20"
text = "الاختلاف في الفتاوى رحمة ده موضوع مفروغ منه<br />مفيش حاجه اسمها حسب الطلب كله بيفتي بمذهبه وباجتهاده<br />وفي كل مكان كده في اختلاف فقهي<br />مش في السعوديه بس<br />عندنا في مصر المفتي بيقول البنوك حلال<br />والشيخ نصر فريد واصل بيقول حرام<br />مش قضيه يعني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123246/http://www.20at.com/article2.php?sid=717"

[[comments]]
order = 1
subject = "الافتااااااااا"
author = "مسلمه"
posted = "2006-04-20"
text = "الاول عايزه ارد على السؤال<br />الحقيقه لما بيكون عندى سؤال ملح بالجأللانترنت والمواقع اللى متأكده منها ولو انى احيانا مبفهمش كلامهم وباحتاج حد يوضحلى؟؟؟؟؟<br />بس فى حاجات مبلقيش لها اجابات فى كتب الفقه اللى ماليه بيتنا ولا اقدر اسالها فى الانترنت وباقعد افكر لغايه ما دماغى تشت؟؟؟؟؟؟<br />لكن حكايه الافتا اللى بيفتوه الاصحاب ولا شيوخ الفضائيات فمينفعش وخصوصا لو حسيت بقلة ايمان والتزام اللى بيفتى<br />لكن الافتاء له اصول لازم اللى يقوم بيه يبقى فاهم ودارس وعايش مع الناس وحقيقى كتب الفقه على المذاهب الاربعه بتكون كافيه فى اوقات كتير وممكن نستعين بالرأى الايسر طالما كانت الفتوه من ائمه زى الئمه الاربعه<br />اللهم اهدنا الى ما تحبه وترضاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123246/http://www.20at.com/article2.php?sid=717"

[[comments]]
order = 2
subject = "شيخُ حارتنا"
author = "Hades"
posted = "2006-04-20"
text = "شيخُ حارتنا من ذوي الألباب ،<br />تقيٌ ، نقيٌ ، لايُحب الشتم ولاالسباب ،<br />معتدلٌ ، يأمر بالمعروف ، ولايُحب العتاب ،<br />يعقد حلقات الذكر ، ويكتبُ الحجاب ،<br />ينصح الرجل بالصلاةِ ،<br />ويأمر المرأة بلبس الجلباب ،<br />وبأن تُغلق عقلها ، وتُسكّرالأبواب .....<br />شيخنا مسالمٌ ،<br />يجتنب أهل السوء ،<br />متفقه جداً ….. يحمل دكتوراه في الوضوء ،<br />وماجستير في الإستمناء ، وحيض المرأة وتعداد القروء ،<br />ويفتي بالعلوم جميعها ، المسموع منها والمقروء …<br />شيخنا لايُحرّم إلاّ لحم الخنزيروالتدخين ، وشرب الخمرة ،<br />وترك الصلاة ، والضحك ، والنظر إلى المرأة ،<br />ومهووس بالرجل اليمنى والرجل اليسرى ،<br />يتعشى مساءً بتمرة ، ويُفطرصباحاً على كِسرة ………<br />شيخ حارتنا ….<br />يقول بكراهية سماع الأغاني ،<br />يقرأ عن الملل والنحل للشيخ الشهرستاني ،<br />ومعجب بفتاوى الشيخ الزنداني ،<br />مؤمن بالإعجاز القرآني ،<br />ويحفظ المصحف بصماً ،<br />وبالع لصحيحي مسلم والبخاري ..<br />شيخنا معتدل جداً ....<br />لايُعادي سوى الديمقراطية والعلمانية ،<br />ولايلعن إلاّ الرأسمالية ، والإشتراكية ،<br />ويصب جام غضبه فقط على المجتمعات المدنية ،<br />ويُشفق على المرأة الغربية ،<br />ويقول بأن الإسلام وحده الذي إحتكرالكمالية ، والمثالية ، والحرية<br />ومادونه ليس إلاّ وثنية عفنة ، ورجعية إمبريالية...<br />سألته مرّة عن حرية المرأة فقال :<br />\" المرأة تخرج أربع مرّات ،<br />مرّة من عضو أبيها إلى رحم أمها ،<br />مرّة من بطن أمها إلى بيت أبيها ،<br />مرّة من بيت أبيها إلى بيت زوجها ،<br />ومرّة من بيت زوجها إلى قبرها ،<br />ولكن يجب التأكد من موتها قبل ترحيلها...!\"<br />شيخنا \" كتير حبوب \" …<br />سألته ذات يوم :<br />\" شيخي !<br />ماتقول في حد الردة ، وقص زلعوم المرتدين ،<br />وقطع رأس المارقين عن الدين ؟\"<br />قال لي :<br />\" يابني ، لاإكراه في الدين ،<br />إن كفرتَ ، إستتبناك ،.........<br />فإن أصرّيتَ على كفرك مرّغنا وجهك في الطين ،<br />ثمّ وضعناك على الإسفين ،<br />قطعنا منك الوتين ،<br />وفصلنا رأسك عن جسدك في الحين ...\"<br />قلتُ له :<br />\" وماكنت ستفعل شيخي ،<br />إن أردتُ أن أدافع عن فكري ،<br />واستليتُ سيفي ،<br />وقطعتُ رأسك قبل أن تقطع رأسي ؟\"<br />قال :<br />\" لا ، أنت لايحق لك الدفاع عن فكرك ،<br />فإن فعلت حفرت قبرك بنفسك...<br />نأخذ من يدك سيفك ،<br />نُسقطه على رأسك ،<br />ونُخرجه من شرجك ....\"<br />قلتُ ، مارأيك شيخي ،<br />لو عاملتك بمعاملتك ،<br />وأعلنت الحرب على عقيدتك ،<br />ثمّ أضرمتُ النار في ضبابِ لحيتك ،<br />وشرّدتُ القمل الذي عشعش بجلابيتك ؟؟...<br />فقال :<br />\" أنت تعادي بذلك الإنسانية ،<br />وتعلن الحرب على المدنية ،<br />وتحرق مفاهيم الديمقراطية ،<br />وهذا أخطر من القنبلة النووية ...\"<br />قلتُ : \" عظيم شيخي ،<br />ولكن هب أنك دعوتَ إلى دينك رجلاً من أهل الذمة ،<br />فدخل بـ \" دين الحق\" وإلتحق بالأمة ،<br />وأراد أتباع دينه معاقبته ، فوضعوا قنبلة في فمّه ،<br />فهل ترضى بأن يذبحوه ، فييتموا أولاده ، ويُثكلوا أمه؟ \"<br />قال:<br />\" يابني ، ماهذه المسخرة ؟<br />طبعاً لايحق لهم معاقبته ، لأنهم كفرة ،<br />يجب التصدي لهم ودحر من ورائهم من الفجرة ..\"<br />شيخنا جداً مُتسامح ..<br />يُعلن الحرب فقط على من لايريد الدخول في دينه ،<br />يقتله ، يسلبُ أمواله ..<br />ويجعل نسائه ملك يمينه ..<br />شيخ حارتنا يكره المتعصبين بالدين ،<br />سألته يوماً عنهم فقال بأنهم فاسقين ..<br />فقلت : لكنهم يُفجّرون ، يقتلون ، يغتالون ، والوطن يحرقون ....<br />فقال : \" لكنهم معذورين ،<br />ولايجوز شرعاً أن تُسميهم كافرين ...<br />قل عنهم .. غلطانين !!..<br />ونسأل الله أن يحشرهم مع المغفورين ،<br />وأن يرحم المُقطعين ، والمفعوسين ، والممعوسين ،<br />وأن يجعلهم شهداء ، في الجنة خالدين ...<br />لهم الحور العين ...!\"<br />فسألته عن بيوت الضحايا التي دُمّرت ،<br />وأطفالهم التي يُتمت ،<br />ونسائهم التي رُملّت ،<br />فقال \" آه ... ذكرتني بهم .... هؤلاء مساكين ...<br />عند الله مأجورين .\" ....<br />شيخ حارتنا خطيب ليس بالقليل ،<br />لسانه أطول من طويل ....<br />.......... كلماته تشفي العليل ،<br />في خطبة جمعة واحدة فتح من على المنبر القدس ، وإحتلّ تل أبيب ، وإستعاد الخليل !<br />اللهمّ<br />إحفظ لنا علماءنا ،<br />وبارك لنا في شيخ حارتنا الجليل ........<br />www.ladeeni.net"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123246/http://www.20at.com/article2.php?sid=717"

