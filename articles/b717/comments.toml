subject = "الوهابية تقف إلى جانب من ؟"
author = "محمد على حسن"
posted = "2006-08-11"
text = "مع بداية القرن العشرين تأسست دولة آل سعود بقواعد دينية غير مألوفة في العالم الإسلامي ، لقد حاربت قبائل الجزيرة العربية بعنوان كونها مشركة تارة وكافرة تارة وابتعادها عن الإسلام الصحيح تارة أخرى، سالت الدماء كالأنهار، إلى أن استسلمت القبائل المغلوبة على أمرها وتكونت على أشلائها مملكة آل سعود. وفي العراق قام حزب البعث بقتل الآلاف من أبناء الشعب العراقي وقدم خدمات جليلة للقوى العالمية خاصة عندما حارب إيران الشيعية بهدف تقليص نفوذ ثورتها المناوئة لأمريكا ، وفي منتصف القرن العشرين قامت دولة إسرائيل على أنقاض فلسطين التاريخية، شردت وقتلت ألآلاف من الشعب الفلسطيني، حاربت مصر وسوريا و الأردن ولبنان وقتلت ألآلاف من شعوب هذه الدول ، سقط البعث وامسك الشيعة بالحكم في ظل نظام سياسي مضطرب غير مستقر ، إلا أن ال وهابيين السعوديين يقاتلون منذ إزاحة نظام صدام الحكومة الشيعية الضعيفة هناك ، وبينما يفجر مقاتلي حزب الله وحماس والجهاد أجسادهم في الجنود الإسرائيليين يفجر الوهابيون أجسادهم في سوق شعبي يرتاده الشيعة ! وهم يعتقدون جازمين بأنهم سيدخلون الجنة<br />مقاتلي حزب الله والقاعدة: مفارقات مدهشة<br />مئات السعوديون الأشاوس غادروا مدنهم البائسة في مملكة آل سعود متوجهين للعراق بعنوان الجهاد، ليقتلوا الآمنين والأبرياء من النساء والأطفال ، في المقابل وفي نفس الوقت يقاتل جنود حزب الله إسرائيل، يضحون بأرواحهم مستبسلين في قتال أعدائهم اليهود الذين يعتبروا العدو الأول للأمة جمعاء ، يقدموا أجسادهم لتكون حجر عثرة ضد أهداف الكيان الغاصب في لبنان وفلسطين ، هذه التضحيات الكبيرة وبغض النظر عن ما يقال من هنا وهناك عن خطأ حزب الله في حساباته وتقديمه مبررات لإسرائيل لغزو لبنان وتدمير اقتصاده وبناه التحتية وتشريد وقتل شعبه ، إلا أن إسرائيل ليست بحاجة إلى ذريعة، والدولة العبرية عدوة لكل الأمة بسنتها وشيعتها، بإسلامييها وليبرالييها، أن حزب الله يقاتلها بشجاعة نادرة وبسالة عظيمة عجزت عنها جيوش الأمة العربية<br />فتوى في صالح العدو<br />بينما يقف شرفاء الأمة مع حزب الله في حربه ضد الدولة العبرية الغاصبة ، يخرج علماء الوهابية ليفتوا بان حزب الله حزب رافضي لا يجوز مناصرته ، ويفتي صالح اللحيدان وابن جبرين بان حزب الله روافض ومناصرتهم لا تجوز، وليقولوا بان حزب الله وإسرائيل في خندق واحد !!! الظريف أن صحيفة إسرائيلية نشرت فتوى ابن جبرين واللحيدان في الأيام التالية لصدورها، لقد قدمت فتاوى الوهابية خدمات مجانية لليهود وشحنا معنويا قويما ، قالوا على أثره لشعبهم: انظروا حتى رجال دين مسلمين لا يؤيدون حزب الله في قتاله ضدنا<br />الوهابية تقف إلى جانب من ؟<br />أن الوهابية تناصر من يا ترى؟ إن لم يكونوا في صف حزب الله ففي صف من إذن ؟ إذا ما قرئنا بعين فاحصة تاريخ الوهابية سنجد أنها لم تحارب الانجليز واليهود والأمريكان قط ، كل جهادها وجه نحو المسلمين الأبرياء في الجزيرة العربية والعراق وبلاد الشام، لم يفتوا ضد اليهود ، القاعدة التي تمثل إحدى الحركات السلفية الواسعة المعاصرة لم تنفد عمليات ضد إسرائيل، وإنما وجهة أسلحتها وانتحارييها ضد الآمنين في مدن العالم الإسلامي خصوصا في العراق وأفغانستان ، يا ترى هل هناك علاقة بين الوهابية وإسرائيل؟ أسست دولة آل سعود في بداية القرن ودولة اليهود في منتصفه والبعثيين بعدهم بعشرين عاما ، وكلا هذه الأنظمة عاثت في الأرض فسادا وقتلا وتدميرا وجنت بحق شعوب هذه الأمة الجرائم المروعة التي يعجز القلم عن وصفها وإحصائها<br />الوهابيين إلى جانب إسرائيل<br />بينما يقف القرضاوي إلى جانب حزب الله قافزا فوق الخلافات المذهبية والاختلافات العقائدية ، ويعلن الإخوان المسلمين في مصر بأنهم يؤيدون حزب الله وإنهم مستعدون لإرسال أكثر من عشرة آلاف متطوع للقتال إلى جانب قوات حزب الله ، وبينما تخرج المظاهرات المؤيدة لحزب الله في مصر والأردن وسوريا والكويت والبحرين والعراق وباكستان وأفغانستان وإيران واندونيسيا وغيرها من بلدان العالم الإسلامي ، تمنع سلطات آل سعود المظاهرات المنددة بالعدوان الإسرائيلي، وتحظر أية تبرعات أو مساعدات شعبية ، كامتداد لموقفها المندد بحزب الله في بداية الأزمة، ثم يخرج شيوخ آل سعود بفتاوى أن لم تكن مؤيدة لحزب الله فعلى الأقل محايدة وليحثوا عوضا عن ذلك م واطنيهم ومواطني الأمة العربية والإسلامية بعدم تأييده ونصرته لأنه حزب رافضي<br />آل سعود والوهابية وإسرائيل: مصير واحد، خندق واحد<br />أليس هناك إذن علاقة بين آل سعود ووهابيتهم وإسرائيل؟ بينما يناصر حتى فاقدي العقول حزب الله تتخذ سلطات مملكة آل سعود السياسية والدينية مواقف مضادة؟ وفي أي توقيت؟ والحرب مستعرة، ولبنان في اشد الحاجة للمؤازرة والمناصرة من حكومات وشعوب وقوى هذه الأمة التي تعيث فيها الوهابية تمزيقا وتفريقا وتشتيتا، أنها ثلاث أنظمة متضامنة مع بعضها البعض وتتجاذبها المصالح ، لو يأذن الله بزوالها لعاشت امتنا بخير وعافية، البعثيين في العراق والذين ادن الله بزوالهم إلا انه ما يزالوا ينشرون الخراب والتدمير في العراق، واليهود في فلسطين والذين ناصرتهم فتاوى اللحيدان وابن جبرين، والوهابية في الجزيرة العربية والذين بنو دولتهم على غرار اليه ود على جماجم الأبرياء ودماء الضعفاء، أن هذه الأمة لن يستقر لها بنان ما دامت إسرائيل والوهابية تعيث فيها قتلا وتدمير، للأولى، وعقائد وفتاوى ومؤامرات تمزق صفوف الأمة وتمنع ائتلافها لمواجهة أعدائها للثانية ، إلا أن الحق لا بد أن يبزغ في يوم قريب لتعم بأشعته الذهبية أرجاء هذه الأمة المكبلة لينجلي ليل طويل هو ليل الرجعية والقهر والاستبداد إلى غير عودة"
