subject = "وهذا البلد الأمين"
author = "المصري السلفي"
posted = "2006-04-21"
text = "بسم الله الرحمن الرحيم<br />((وهذا البلد الأمين)) أي: مكة<br />قال النبي صلى الله عليه وآله وسلم:<br />إن الإيمان ليأرز إلى المدينة كما تأرز الحية إلى جحرها<br />وفضل بلاد التوحيد السعودية كثير والحمد لله<br />اللهم احرسها من كيد الكائدين وحقد الحاقدين وسائر بلاد المسلمين"
