[[comments]]
order = 14
subject = "حزب الله"
author = "أمين"
posted = "2006-08-01"
text = "عودة العمائم الأمريكية<br />المصدر: الشيخ: شمس الدين<br />2006-08-01<br />لايمكن أن ننسى الدور القذر الذي تقوم به العمائم الأمريكية في تحطيم إرادة الأمة وتثبيط همهما ونشر فتاوى الفوضى داخل أوصالها· لايمكن أن ننسى أنه في الوقت الذي قصفت فيه القوات الأمريكية مصانع حليب الأطفال في العراق وأعلنت وكالات الأنباء العالمية عن موت مليون طفل عراقي في وقت فرضت فيه امريكا حصارا ضد الشعب العراقي فانتشر الجوع والمرض وسط الشعب العراقي··، في ذلك الوقت نجحت العمائم الأمريكية في إشغال الناس بحكم - مشاهدة البوكيمون- وهكذا بمجرد ما تلقت الضوء الأخضر من البيت الأبيض حتى انطلقت العمائم الأمريكية في كل مكان محذّرة من البوكيمون حتى أني أتذكر أن الجمعة التي سقطت فيها بغداد صعد أحدهم، وهو من العمائم الأمريكية غير المعتمدة وبدأ يصرخ في الناس محذرا من البوكيمون وسط دهشة المصلّين الذين كانوا ينتظرون على الأقل الدعاء للمجاهدين بالنصر أو رفع همة الناس· المهم انطلقت الآلة الإعلامية لمشايخ البوكيمون ونجحوا فعلا في إشغال الناس عما يجري في العراق·<br />ثم أطل علينا الشيخ العبيكان عبر قناة العربية مفتخرا بأنه المفتي الوحيد الذي تقوم القوات الأمريكية بتوزيع فتاواه على الشعب العراقي، ثم تفاخر بأنه أول من أفتى بعدم جواز مقاومة الأمريكان وأنه لا مقاومة في العراق وأنها فتوى لم يسبق إليها·<br />وقبل أعجوبة البوكيمون كان للعمائم الأمريكية دور قذر في أفغانستان؛ فلما احتلت أفغانستان من طرف القوات الروسية أقامت العمائم الأمريكية الدنيا ولم تقعدها ونشرت الفتاوى في كل مكان موجبة الجهاد على جميع الأمة، بل فتحت العمائم الأمريكية باب التطوع للشباب· وهكذا سار الشباب من مختلف جهات العالم مدافعا عن الارض الإسلامية ونالت أفغانستان استقلالها ثم استعمرت من طرف القوات الأمريكية واذا بالعمائم الأمريكية تصدر الفتاوى تحرم فيها الجهاد ضد الأمريكان وتحرم التطوع للجهاد إلا بإذن الله· وهكذا اذا استعمرتك روسيا فالجهاد واجب، أما اذا استعمرتك امريكا فالجهاد حرام·<br />أما قصة العمائم الأمريكية مع- القنوت- أي قنوت المصيبة فحدث ولا حرج· ويكفي أن الشيخ سفر الحوالي أصيب بوعكة صحية واذا بالعمائم الأمريكية تطلب من جميع المسلمين إحياء سنية القنوت لأن الوعكة الصحية للشيخ سفر الحوالي تعد مصيبة نزلت بالمسلمين· ولكن موت المسلمين في الصومال جوعا وذبح النساء والأطفال في الجزائر واحتلال العراق والشيشان لا تعد مصيبة نزلت بالمسلمين تستوجب إحياء القنوت·<br />واليوم تطل علينا العمائم الأمريكية من خلال فتاوى مدعومة أمريكيا صادرة على مذهب ''بوش'' والمذهب ''البوشي'' هو المذهب الذي تريد له العمائم الأمريكية أن يحل محل مذهب مالك وأبي حنيفة والشافعي وأحمد، اليوم أصدرت العمائم الأمريكية فتوى تحرم مساندة المقاومة اللبنانية، بل ذهب ابن جبريل إلى تحريم الدعاء لهم بالنصر بحجة أن حزب الله شيعة· وهكذا أدخلت هذه الفتوى البهجة على القلوب الإسرائيلية والحزن على قلوب الذين آمنوا· والعجيب أن العمائم الأمريكية تحرم الجهاد لجانب حزب الله بحجة أنه شيعة، ولكنها تحرم أيضا الجهاد في العراق مع أن قادته سنة، وتحرم الجهاد في أفغانستان مع أن طالبان من أشد الناس تعصبا للسنة· وفي نفس الوقت يفتون بوجوب القتال في الشيشان لأن العدو هو الدب الروسي· ولكن القرآن الكريم يفضح العمائم الأمريكية حينما ينص بوضوح على فرح المؤمنين اذا بلغهم انتصار النصارى على المجوس، بل ويجعل انتصار النصارى هو نصر الله تعالى فما بالك اذا كان المنتصر هو حزب الله ونصر الله قال تعالى في سورة الروم'' ألم 1) غلبت الروم2) في أدنى الارض وهم من بعد غلبهم سيغلبون03) في بضع سنين للّه الأمر من قبل ومن بعد ويومئذ يفرح المؤمنون04) بنصر الله ينصر من يشاء وهو العزيز الرحيم5)·<br />وهكذا جعل الله تعالى انتصار الروم وهم أهل كتاب على الفرس وهم مجوس جعله نصرا من الله تعالى يفرح له المؤمنون· وذلك أن الصحابة كانوا يتمنون انتصار أهل الكتاب على المجوس· وكان كفار قريش يتمنون انتصار المجوس على أهل الكتاب· فما بالك بفتوى تصدرها العمائم الأمريكية تحرم الدعاء لحزب الله، بل تحرم الفرح بنصره على إسرائيل وسينتصر حزب الله ويومئذ يفرح المؤمنون بنصر الله-· لقد قاتل الشعب الجزائري المسلم ضد القوات النازية لأجل تحرير فرنسا تحت الراية الفرنسية لأن الاستعمار النازي كان ظالما، وكان الصحابة يدعون لملك الحبشة بالانتصار على الجيوش الوثنية لأنه ملك عادل·<br />والمقاومة التي يخوضها حزب الله هي مقاومة إسلامية ترفع راية الإسلام فكيف لا يجوز الدعاء لها بخير بحجة أنهم من أنصار أهل البيت؟ فعلى كل مسلم أن يحذر فتاوى العمائم الأمريكية لأنها فتاوى لا تستند في شرعيتها لكتاب ولا لسنة، بل تستند لأوامر من البيت الأمريكي· وقد آن الأوان أن يكشف الناس أن الدم الذي سال في هذا البلد العزيز كانت وراءه أيضا عمائم أمريكية إن بالأصالة وإن بالوكالة·<br />وعلى أبناء الصحوة أن يقفوا مع المظلوم مهما كان دينه وعقيدته ومذهبه· ونقول للعمائم الأمريكية من أعان ظالما سلط عليه والمرء مع من أحب يوم القيامة.<br />الأولى<br />الحدث<br />سياسة<br />اقتصاد<br />أخبار الوطن<br />الجزائر العميقة<br />أحوال العاصمة<br />ثقافة<br />رياضة<br />مجرد رأي<br />فطور الصباح<br />حوارات<br />عالم السيارات<br />روبورتاجات<br />عيادة الخبر<br />اسلاميات<br />الملفات<br />08ماي<br />حفل الخبر<br />الذكرى الـ 15 لتأسيس الخبر بالصور<br />ندوات<br />الإقتصاد<br />الملحق الثقافي<br />منشورات<br />الأرشيف<br />التحرير<br />عن الخبر<br />مجموعة الخبر<br />للإتصال بنا<br />Copyright © 2003 - 2006 El Khabar. Réalisation Biunet. All Rights Reserved"
