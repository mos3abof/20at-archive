text = "بسم الله مظهر الحق ولو كره الكافرون<br />أما بعد....<br />ياشباب \"العاطفة شي\" والأحكام شي تاني.<br />يعني مثلا واحد ماشي بالشارع وحد سب الرسول صلى الله عليه وسلم أمامه \"ماذا سيفعل الرجاء كل يجاوب ويحتفظ بالجواب لنفسه!!\"<br />سبحان الله واحد يقول نبدأ بالكلمة الطيبة<br />وأخر أبعد عنه<br />طيب إذا اي واحد منكم طبعا إلا \"اللاديني لأنه بلا شرف\"<br />ماشي مع أخته أو أمه وحدى لطشها<br />أتسائل عن موقف كل واحد منكم<br />والله ما أتوقع حدى يقول بنصحه نصيحة أكيد راح يبدأ بالضرب حتى ولو نضرب أو يكتفي بالسب.؟؟؟؟؟؟<br />العجب العجاب مع إن الرسول فداه أبي وأمي يجب أن يكون أحب...<br />ولكن من تخاذلنا هذا الحال اللذي نحن عليه.....<br />لذلك أقول للشباب اللذين تسرعوا ورموا فتوى ابن جبرين تروا قليلا<br />هل حرم الشيخ القتال ضد إسرائيل؟؟؟<br />هل حرم الجهاد في العراق أو الشيشان او أفغانستان؟؟؟؟أو أي مكان؟؟؟<br />أليس للعالم أجر حتى ولو أخطأ؟؟؟؟<br />سبحان الله ..... ياشباب الشغلة مو حماس وبس لا لا الدين أكبر من هذا الشي كله.<br />شوفوا أسباب تحريم القتال مع حزب الله<br />وبعدين تعرفوا \"السبب\"<br />وفعلا العجب العجاب<br />أما بالنسبة لحماس لاتوجد أي فتوى بعدم القتال معهم ..وجزى الله ألف خير لشيوخنا<br />اللذين يعرضون نفسهم للأذى في سبيل الله...<br />فصبرا يا شباب قبل الحكم<br />ولمن أراد المناقشة بسبب تحريم القتال معهم...فالرجاء مراسلتي على الإيميل<br />m04m04u@yahoo.com<br />وطبعا الكلام في الإسلام عند الإختلاف فقط نرجعه لنقيسه على القرآن الكريم اللذي نقف عنده....<br />والشكر والسلام للجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123246/http://www.20at.com/article2.php?sid=717"

