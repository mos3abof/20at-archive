[[comments]]
order = 13
subject = "علماء آل سعود يحرمون نصرة حزب الله"
author = "الناصر صلاح الدين"
posted = "2006-07-30"
text = "إن جل ما نخشاه في وسط هذه المعارك الطاحنة التي يقودها رجال المقاومة الإسلامية في لبنان هي الطعنات التي بدأت تسدد من طرف بعض أنصاف العلماء من آل سعود و من والاهم و هي محاولات يائسة منهم للتعلق بأسدال البيت الأسود و التمسح و التبرك بجدرانه الملوثة بدماء الشهداء في كل من فلسطين ، العراق،أفغانستان و لبنان بدعوى أن الشيعة يشكلون خطرا على الإسلام. ولنفرض أن هذا صحيح فهل من الإسلام أن نتحالف مع أعدائنا ضد إخواننا؟ أنتم الآن أشبه بالمنافقين في عهد الرسول عليه أفضل الصلاة و أزكى التسليم و قد قال قيهم الحق سبحانه في محكم كتابه( ألم تر إلى الذين يزعمون أنهم آمنوا بما أنزل إليك وما أنزل من قبلك يريدون أن يتحاكموا إلى الطاغوت وقد أمروا أن يكفروا به ويريد الشيطان أن يضلهم ضلالا بعيدا) 60-65 النساء<br />فاحذروا أن تكونوا من هؤلاء بموقفكم الداعي للتفرقة و الشتات بيد أننا في أمس الحاجة إلى جمع صفوفنا بعد أن تكالب الصهاينة و الصلبيين علينا، فإذا كانت فتواكم لإرضاء بوش فالله أحق أن ترضوه و أنتم العلماء قدوة المسلمين."
archived = "2006-11-02"
