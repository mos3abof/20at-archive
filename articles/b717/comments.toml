[[comments]]
order = 5
subject = "\" إن الدين عند الله الإسلام\""
author = "محمد"
posted = "2006-04-21"
text = "أقول لصاحب كتابة \"شيخ حارتهم\" حسبنا الله ونعم الوكيل<br />تدعوا للادينية حسبنا الله ونعم الوكيل<br />كل كتابتك تنم عن جهل وتعميم<br />طبعا بدعوتك للادينية خراب أصلا فإنا لله وإنا إليه راجعون<br />ما أسفنى أن أحدا لم يرد عليك والتفتوا للسعوديه ومن يشتمون السعودية<br />ياأخوة تجمعوا ولا تفترقوا عليكم بكتاب الله وسنة رسوله فإن من بيننا أناس يدمرون القواعد ويحسبون علينا والله ياأخوة من وفقه الله لمعرفة و إتباع الحق فهو أسعد السعداء كم من أناس تائهون يميلون يمينا تارة ويسارا تارة لا يضبطهم ضابط لأنهم تركوا الشرع وإتباع الهدى . مشكلت هؤلاء الجهلة انهم لم يروا نموذجا للإسلام على أرض الواقع فلنريهم من أنفسنا خيرا فى المجالات تقدموا وابذلوا من أجل دينكم \"ياله من دين لو كان له رجال\" وطبعا لن يعدم الرجال بتمسكم بدينكم لن تحافظوا عليه ولكن هو الذى يحفظم ويزيدكم شرفا ان تكونوا من حملته ومن الذابين عنه أهل الخير كثر وشباب الصحوة بخير ومتفهمين لما يدور والعقبات أمامهم فلنشد على أيدى بعض وحسبنا الله ونعم الوكيل<br />والسلام عليكم ورحمة الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123246/http://www.20at.com/article2.php?sid=717"

[[comments]]
order = 6
subject = "علماء أخر الزمان"
author = "الفارس العربى"
posted = "2006-04-22"
text = "قال رسولنا الكريم صلى الله عليه وسلم0\"أياكم وعلماء أخر الزمان\"أى ان نحذر من علماء(بمعنى ادق الذين يقولون انهم علماء ودعاة)أى لا نسمع الا لمن اجتاز فى العلم بحارا اما من قرأ كتابين وحضر درسبن وتكلم بكلام معسول أجلسناه مجالس العلماء وظهر على التلفاز فهذا هو الخطر الحقيقى المسألة مش مسألة أختلاف الفتاوى المسأله الفتاوى خارجة من من هل هو فعلا شيخ يستطيع الأفتاء من شيخ \"كاجول \" فلا يصح لنا ان نقول ان الفتاوى تعارضت بين شبخ وأخر مدعى المشيخه فلن أصدق ابدا ولم اسمع عن الطيور تمشى على اربع أو البغال تطير - أظن التشبيه واضح-"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123246/http://www.20at.com/article2.php?sid=717"

[[comments]]
order = 7
subject = "انا معك يا ايها الفارس العربى"
author = "احمد"
posted = "2006-04-22"
text = "السلام عليكم فى الاول وبعدانا باقولاك يافرس العرب انى معاك وبضم صوتى لصوتك وباقولاك فعلا فى ناس الاسم مسلمه وبتتكلم فى الدين شىء غريب يوحى بئنظار خطير وهوه انا ديننا فى خطر لا تفهمونى خطاء فائنا اعلم جيدا ان الله هو خير حافظ لاكن المشكه ان فى ناس مش عارفه الموضوع الى بيتناقش فى الدين وبيتكلم عنه وبيدوم لنفسهم الحق ان هما يدفعم عن كلامهم والمشكله اصلا ان هما مش عارفين اذا كان صح ولا غلاط يارجل دا دلوقتى بقى فى مزيعات متبرجات تظهر وهى نصف عاريه وتتكلم عن الدين وليس هذا فقد بال الغريب انها تصطضيف بعض ما يقولون عنهم اصحاب علم فى الدين واذا اتيت للحقيقه هم يصطضيفونهم من اجل ان يتباهون بائنفسهم فى الكلام الذى ليس له معنى ولا اى شىء من الصحه وتجبر الضيف باْْْْئن يقول انت على حق اسلوب غريب والاغرب انه من وسائل الاعلام العربى والاغرب انه من برامج ليس لها علاقه الى بى الفن والتمسيل يارجل دانا كنت هاتهبل بقى هاله سرحان بتتكلم فى الدين داه والله نصيبه ارجو من يقراء هذه الرساله لم يصخر من الاداء فى الكتابه فائنا لست بارعا فى الغه العربيه فائعزرونى اذا كانا يتواجد خطا فى الرساله ولكم الف سلام من كاتب الرساله او خير الختام هوه(السلام عليكم ورحمة الله وبركاته)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123246/http://www.20at.com/article2.php?sid=717"

[[comments]]
order = 8
subject = "الكلام موجه لك ياهدس"
author = "احمد"
posted = "2006-04-22"
text = "لك تحية الاسلام وهيه السلام اتعلم ماهوه السلام السلام الذى ينادى به كل شعوب العالم اتعلم ما هوه السلام السلام هوه من وصى به نبى الاسلام( محمد صلى الله عليه وسلم)وقال افدلكم على شىء اذا فاعلتموه تحاببتم رادو عليه الصحابه قائلين ما هو يارسول الله فقال افشو السلام بينكم السلام اوصى به سيد الخلق نعم سيد الخلق واكررها نعم سيد الخلق اتعلم لماذا لانه الوحيد الذى لقبه شعبه بالصادق الامين اتعلم من هم شعبه شعبه كان فيهم اشد اعدائه اتعلم من كانو اشد اعدئه كان ابو جهل اتعرفه او لا المهم انه كان اشد اعدائه وفى نفس الوقت كان يقول عليه الصادق الامين اتعلم لماذا لانه هكذا حقا اتعلم لماذا لانه كان صاحب اخر رساله دينيه تنزل على الارض ومن بعده انقطع الوحى عن الارض واهل الارض انا اصدقه وكل من يوئمن به يصدقه اما انت فلا اهميه لك فى ان تصدقه ام لا لانك لم تفهم معنى الكلام الذى كان يقوله الا تعلم بانه افضل الناس الذين تكلمو عن سيدنا عيسى وموسى وعن السيده مريم اشرف نساء الارض وقال عنها انها من اول سيدات الجنه وافضلهم الا تعلم انه اتى بالكتاب الذى فيه كل قصص الانبياء وقال لنا ان نؤمن به وبكل الكتب السمويه الا تعلم كل هذا الا تعلم ان ايمان المرء فى الاسلام لا يكتمل الى بائيمانه بجميع الدينات السمويه اذا كنت لا تعلم كل هذا وهوه اقليه فائنت تصبح جاهل لا تعلم شىء عن الدين الذى تتكلم عنه فارجو ان تعلمه فى الاول قبل الاسائه له اما اذا كنت تعلمه ولا تريد تصديقه فهاذه حريتك اما ان تعاديه فهاذه ليست حريتك نعم ليست حريتك اتعلم لماذا لاننى ليس بمقدرتى ان اسيء الى المسيحيه بشىء ولا اليهوديه انا لن انتقد دينك ولاكنى انتقدق انت لانى اذا انتقدت دينك اصبحت غير مؤمن بكل الدينات كما اوصانى سيد الخلق محمد عليه الصلات والسلام)اتمنى من الله ان تكون قد فهمت هذا الكلام اذ قراته وان تحسن نيتك الى الاسلام كماانه لا يسىء اليك فى شىء ولا تلقى بالتهم من غير علم يارجل دالمتهم برىء حتى تسبت ادانته وانت من غير علم تدين انت حقا غريب بلا شك واليك تحية الاسلام وهيه السلام السلام عليك يامن اسئت للاسلام اقولها لك لانها وصيه من سيد الخلق على امته التى كان يريد فيها السلام فاسلام لك ولكل امة محمد عليه السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123246/http://www.20at.com/article2.php?sid=717"

