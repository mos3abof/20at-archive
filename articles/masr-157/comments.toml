[[comments]]
order = 2
subject = "وانا كمان"
author = "باتستوتا"
posted = "2006-04-13"
text = "انا متفق مع كاتب المقال تماما فنحن جميعا نعلم توجهات روزاليوسف فى ذلك الوقت انها تخص جيمى وشلته كما ان كلام الحوار اشعر ان فيه تربص للمرشد وكأن الصحفى يحاروه ليخرج منه بزلات لسان لايًًًٌَُُحاسب عليها احد.<br />هذا الصحفى ظهر فى برنامج العاشرة مساء مدافعا عن موقفه بنشره المقال فى روز وهو موقف يفتقر الى المهنية ويؤكد سوء نية ذلك الصحفى الفلته .<br />عموما زمانه خد الحلاوة من جيمى دلوقت"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072049/http://masr.20at.com:80/article.php?sid=157&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "مهو اصله حيوان"
author = "بومبا"
posted = "2006-04-13"
text = "طالما جريدة رئيس تحريرها خول ابن مره شرموطه لازم تكون ديه النتيجة , و الكلب ده احد اعوانه اللى تجرأ على مرشد الاخوان الرجل العظيم ده"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072049/http://masr.20at.com:80/article.php?sid=157&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "ده المتوقع"
author = "معارضة"
posted = "2006-04-14"
text = "السلام عليكم<br />انا عايز اقول ان ده الي كان متوقع من جريدة روزاليوسف الي اتجاهتها معروفةو كمان المتوقع من المرشد حبه لمصر و لشعبها و الاكبر طبعا حبه لدينه<br />معلش اقول ملحوظه : يا ريت نكون احسن من الي بيفسدوا في البلد و بزوروا الحوارات و دايما نكون اكثر احتراما منهم من حيث الالفاظ الي بنقولها<br />و اخيرا ظهر الحق و ربنا يقضي على الباطل"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072049/http://masr.20at.com:80/article.php?sid=157&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "أرفض تصريحات المرشد"
author = "t_kha"
posted = "2006-04-14"
text = "مش معنى انى عايز اقل ان الاسلام فوق الجميع انى اشتم مصر , ممكن اقول الكلام دا لكن بطريقة محترمة , زى مثلاً اقول ان الدين الاسلامى عند المسلمين هو أول شئ فى حياتهم , وبكدا يبقى رد وفى نفس الوقت ماشتنمش مصر<br />لام أولاً ميانفعش ان القدوة تتلفظ بألفاظ ركيكة لدرجة دى و ثانياً ان مفيش مبرر ابداً انى عشان ابين ان بحب شئ ومؤمن بيه اشتم فى شئ آخر عشان اوضحه<br />أطالب الاستاذ مهدى عاكف بالاعتذار للشعب المصرى و مصر , نحن نحترم نضاله ولا نقدح فى وطنيتة , لكن هناك زلة لسان يجب الاعتذار عنها , وهذا لن يقلل من شأنه , لكنه سيعليه بإذن الله<br />والله المستعان"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072049/http://masr.20at.com:80/article.php?sid=157&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

