[[comments]]
order = 7
subject = "جيش مين اللى يحكم"
author = "عادل تانى"
posted = "2006-11-30"
text = "ياعم عادل الجيش المصرى اللى بيمسك بزمام حكم مصر من سنة 1952 وحكم العسكر حينتهى وتفتح صفحة جديدة فى تاريخ مصر المنيل00 بانشاء اول حكومة مدنية ديمقراطية منتخبة فى تاريخ مصر الحديث وقائد المسيرة الجديدة هو جيمى000تعليمات البيت الابيض موجودة فة مؤسسة الرئا سة مسبقا00وفى مكتب القائد الاعلى للقوات المشلحة المصرية00<br />والشعب المصرى حيطلع افواج زى النمل بيصرخ فى الشوارع ويقول ياحبيبنا ياجمال عايزينك يا جمال00<br />ودى حتبقى بداية النهاية لشعب اعمى لا يحترم مقدراتة ومستقبل اجيالة القادمة اللى راحت فى الكازوزة 00والمصريين اهمه"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073352/http://masr.20at.com:80/article.php?sid=1233"

