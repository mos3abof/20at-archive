text = "و ما نحن فيه هو اكبر دليل . نترك أرضنا و بلادنا للفراعنة كي يحكموها و لا نستطيع حتى التعبير عن ما بداخلنا و كل ما يسعنا هو ان نقول \" إذا حكمنا الطاغية سوف نرحل\" ............<br />أهذا ما نقدر عليه ؟!!!!!!!!!!!!!!<br />حسبي الله و نعم الوكيل"
