posted = "2006-11-30"
text = "ياعادل الجيش ده كان زمان ,,,ايام الرجاله اللى ماتت فىالحرب ,,, الجيش دلوقتى اصبحوا تجار ومقاولين ... ملهمش دعوة بالبلد خالص ,,, وبعدين يا اخى مبارك عامل حسابه كويس<br />الجيش دلوقتى فرحان ب ياميش رمضان والمكافئات والمنح والعطايا يعنى حاجة ببلاش كدة ......<br />رحمة الله على الجيش<br />لا للتوريث ولا لاستكمال المسيرة"
