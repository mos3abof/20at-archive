[[comments]]
order = 5
subject = "مش لازم يا عادل"
author = "فارس_fr"
posted = "2006-11-30"
text = "ياسلام عليك ياعادل هو يعنى اللى خلاه بقدرة قادر ظهر فى حياة المصريين من سنوات بسيطة ومعدودة ميقدرش يديله مليون رتبة عسكرية ,, ياسيدى سهله ,,, لاحظت فى اراء بعض الناس انهم ياعينى مش عجبهم ان جمال على طول مبوز ومكشر ومبيعرفش يتعامل مع الشعب ,, اه يا شعب اهبل ,, امم انتوا عندكم ابوه حسنى اهه الله يقصف عمره بيعرف يضحك ويضحك الناس ويضحككم فىكل خطاب وفى كل مناسبة ,,, وفى الجانب المشرق ,,ضاحك عليكم وواكل حقوقكم ومطلع عنيكم , بس حلاوته انه بيضحك وبيعرف يقول نكت ,, اه يا بلد مرارتى اتفقعت منكم ومن تفكيركم....... يعنى لو بيعرف يضحكناوبيقول نكت زى ابوه عادى يورث البلد مفيش مشكلةيعنى يا ناس فوقوا الله يخرب بيت ابو جمال ........."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073352/http://masr.20at.com:80/article.php?sid=1233"

