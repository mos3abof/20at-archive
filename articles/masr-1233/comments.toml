subject = "اذا كان جمال ميلزمناش"
author = "شيماء"
posted = "2006-11-30"
text = "اذا كان جمال ميلزمناش<br />و مش عاوزين منه حاجة<br />و علي فكرة انا اخذت قرار لو جمال بقي رئيس مصر انا حسيب البلد و اهاجر طالما ال مبارك مش حيسبوها الشعب بقي يسيبها و يبقي حسني و ابنة يأجروا البلد و اهو يبي استكمال لمسيرة الخصخصة."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073352/http://masr.20at.com:80/article.php?sid=1233"

[[comments]]
order = 1
subject = "نشرة اخبار سنة 2015"
author = "اصدر الرئيس جمال مبارك تعليمات الي رئيس الوزراء احمد نظيف لاستكمال مسيرة التحرر الاقتصادي والخصخصة للدولة ان يتم بحث بيع المتحف المصري للبيع للمستثمرين الاجانب وبحث اجراء مناقصة عالمية لبيع اهرامات الجيزة ومدينة الاقصر بالناس الي فيها لمستثمر رئيسي , كما بحث محمود محي الدين وزير الاستثمار اجراءات الشركة الانجليزية المالكة لقناة السويس شراء نهر النيل وكل متعلقاته من ترع ومصارف, كما بحث وزير الاستثمار ايضا اجراءات الشركة الاسرائيلية المالكةلمائتين الف فدان في سيناء لشراء مائة الف فدان اخري جديدة في سيناء لاستصلاحها وتوفير مزيد من فرص العمل للمصريين لدي الشركة الاسرائيلية."
posted = "2006-11-30"
text = "وسلملي علي الاستثمار؟؟؟؟؟؟؟؟"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073352/http://masr.20at.com:80/article.php?sid=1233"

