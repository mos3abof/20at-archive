subject = "مش معقولة"
author = "الذهبي"
posted = "2006-11-30"
text = "مش معقوله ياجماعة ان ابن رئيس الجمهورية يبقي عاطل زينا كدة ومش لاقي شغل .<br />ومادام انه من ابناء العاملين حسب قوانين بلدنا الجميلة وابوه افني (حلوة افني دي) عمره كله في خدمة البلد يبقي لازم نتحمل ابنه كام سنه في الحكم ومفيش مشكله محنااتحملنا كتيييييييييييييييير قبل كدة"
