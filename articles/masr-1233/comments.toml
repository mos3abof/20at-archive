[[comments]]
order = 12
subject = "ممكن نركز حبتين ......"
author = "إبن بهية"
posted = "2006-11-30"
text = "مشروع التوريث مستمر يا شباب .. جيمي في رحلته السريه لأمريكا من ست شهور واللي اتفق فيها مع البيت الأسود على دعم المسيحية الصهيونية بقيادة ماكسيموس اللي جه وراه طوالي بأسبوع من أمريكا ومعاه تفويض بالبطريركيه الصهيونيه وأخد في يومين ترخيص لإقامة خمس كنائس جديده على المذهب المسيحي الصهيوني ، باقول جيمي خلص الاتفاق مع البيت الأسود .. وحصل منهم على الدعم الغير محدود طالما سيكون على خطى الأب الواطي في الحفاظ على المصالح لاصهيونية في المنطقه وبرهن لهم ده فورا بعد رجوعه .. لما سألوه بأن له تصريحات مش عاجباهم .. وسألوه عن رأيه في الصهيونيه ويا ترى هتكون معانا ولا لأ ؟؟؟ برهن لهم فورا بالدليل القاطع والعملي عن طريق دعمه الكامل لماكس ميشيل الصهيوني بتاع المهجر وضرب المسيحيين الأرثوزوكس بالجزمه القديمه ..<br />قريباً جداً ستقرأون في الصحف وفي المنتديات عن أعمال شغب وعنف قال إيه بين النصارى والمسلمين في الإسكندريه أو أسيوط و أي حته .. المهم في هذا الجو الملبد بالغيوم والفتنة الطائفية سيسلم لاشعب كله بكل طوائفه زمام الحكم لمنقذ ومخلص سيأتيهم على حسانه الأبيض ليحكمهم بقوانين الطواريء المعروفه بتاعة مبارك الواطي الأول ... طبعا ما يضرش لو شفنا شوية أعمال عنف وحرق كنايس بين المسيحيين وبعضهم من أتباع البابا شنوده وأتباع ماكس فورت ده بتاع الصهيونية .. ويا سلام لو جماعه حلوين من بتوع السلفيه ولعوا في ضريح ولي من أولياء الله الصالحين ويقولك فتنه بين المسلمين وبعضهم كمان سنه وشيعه ((قال في مصر شيعه قال .. من إمته كان فيه تصنيف للمسلم المصري ؟؟؟)) .. يا ريت نركز شويه في الأيام الجايه .. راح نشوف العجب من الفتن الأمريكانيه التي ينفذها على أرض الكنانه بوبيهات جيمي من بتوع البوبي الكبير العادلي .. يولعوه<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073352/http://masr.20at.com:80/article.php?sid=1233"

[[comments]]
order = 13
subject = "احنا مش عايزينة"
author = "محمد"
posted = "2006-11-30"
text = "أيها الناس:<br />لقد أصبحت سلطانا عليكم<br />فاكسروا أصنامكم بعد ضلال ، واعبدونى...<br />إننى لا أتجلى دائما..<br />فاجلسوا فوق رصيف الصبر، حتى تبصرونى<br />اتركوا أطفالكم من غير خبز<br />واتركوا نسوانكم من غير بعل .. واتبعونى<br />إحمدوا الله على نعمته<br />فلقد أرسلنى كى أكتب التاريخ،<br />والتاريخ لا يكتب دونى<br />إننى يوسف فى الحسن<br />ولم يخلق الخالق شعرا ذهبيا مثل شعرى<br />وجبينا نبويا كجبينى<br />وعيونى غابة من شجر الزيتون واللوز<br />فصلوا دائما كى يحفظ الله عيونى<br />أيها الناس:<br />أنا مجنون ليلى<br />فابعثوا زوجاتكم يحملن منى..<br />واعبثوا أزواجكم كى يشكرونى<br />شرف أن تأكلوا حنطة جسمى<br />شرف أن تقطفوا لوزى وتينى<br />شرف أن تشبهونى..<br />فأنا حادثة ما حدثت<br />منذ آلاف القرون..<br />2"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073352/http://masr.20at.com:80/article.php?sid=1233"

