subject = "ليه لأ"
author = "فقاى"
posted = "2006-12-03"
text = "لماذا كل هذه الضجة على حكم جمال لمصر يا ترى ممكن ينصلح حال البلد مع حكم جمال لمصر ولا يستمر مسلسل الكوفته اوه سورى المحسوبية وتباع البلد بأهلها ونخلص من الدوشة اللى كل شويه بيعملوها<br />أخيرا اريد ان ادعوا لكل المهتمين بحال البلد وبينا ان يوفق البلد الى الصالح لأن الحال صعب صعب .<br />الله وفق الحال<br />سبحان الله و لا حول ولا قوة الا بالله<br />من الوسية قطاع المحكومين<br />فقاى"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073352/http://masr.20at.com:80/article.php?sid=1233"

