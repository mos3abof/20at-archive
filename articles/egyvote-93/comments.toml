[[comments]]
order = 17
subject = "الى الاخ عصام"
author = "مينا"
posted = "2005-12-05"
text = "ا عصام عدد المعتقلين 6 الاف انتا مش بتكلم واحد سنة اولى سياسة<br />والعدد ده مش صادر عن بيان للحكومة لان ده اساسا مستحيل<br />العدد ده مجموع المتغيبين و المفقودين فى بيان صادر عن<br />نقابة المحاماة و نقابة الصحفين ضيف عليهم المتغيبين المفقودين<br />من جماعة الاخوان المسلمين و حركة كفاية وبعض التنظيمات الصغيرة واصبح المجموع كله 6 الاف ( ده بس على اعتبار ان كل المفقودين و المتغيبين فعلا معتقلين لان ممكن يكون منهم ناس ماتوا و طفشوا او اى حاجة تانية حصلتلهم و تسببت فى غيابهم و الحكومة ملهاش اى يد )<br />يا بابا تعالى وفى رمسيس عند جامع الفتح و شوف الاخوان المسلمين اللى هناك بعبروا عن رايهم ولا بيثيروا الشعب<br />وروح جامعات القاهرة الحكومية (عين شمس و القاهرة وحلوان ) وانتا تعرف عناصر الاخوان المسلمين بين الطلاب بيعبروا عن رايهم و لا بيثيروا الشغب<br />وروح مساجد ( 6 اكتوبر وارض الجولف ومسجد رابعة العدوية ) واسمع اللى بيتقال ويتسمع و انتا تعرف انها دعوة صريحة اوى اوى للفوضى و المظاهرات<br />ثالثا و اخير ا ايمن نور لم يعتقل ايمن نور اتحاكم محاكمة مدنية و كمان عادلة والدليل انه طلع براءة<br />يا عصام المعتقل فى القاموس الدستورى مش مهم يبقى فى تهمة و مش مهم يبقى فى قاضى و محكمة و شهود المهم انه يعتقل<br />وده عيب قانون الطوارىء انه بيسمح للاعتقال لمجرد الاشتباه ومفيش لا تهمة ولا محاكمة و لا يعرف المعتقل يقوم محامى للدفاع<br />اقرأ بقية التعليق .."
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044813/http://egyvote.20at.com:80/article.php?sid=93"

