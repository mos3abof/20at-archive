text = "المعتقلين 20 ألف حسب منظمات دوليه ...فيه فرق بين الكلام اللي يقوله صحفي كبير كأحمد رجب وبين كلام تنظيم سياسي قوي له شعبيه كبيره لأن كلام أحمد رجب متنفس للناس الكادحه فقط أماكلام الأخوان فهو يمثل تهديد حقيقي لسلطة الحاكم اللي بيعتبر نفسه لا يخطيء ...فين هو الشغب بتاع الأخوان ؟؟؟؟ الشغب من الشرطه وبلطجية الحزن الوطني وجمال بتاع التزوير بفكر جديد والكل عارف كده كويس...ولا حضرتك بس الي مش عرف؟"
