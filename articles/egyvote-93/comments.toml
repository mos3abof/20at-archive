[[comments]]
order = 6
subject = "الاخ  زائر"
author = "مينا"
posted = "2005-12-01"
text = "لى الاخ زائر<br />اولا انا بشكرك بجد مش هذار على اسلوبك الراقى فى النقد<br />ثانيا الدكتور ميلاد حنا بيقصد بانه عايز يموت قبل ما يشوف مصر دولة اسلامية ( على غرار طالبان فى افغانستان سابقا و العراق حاليا )<br />واشياء من هذا القبيل المعادى تماما لامريكا و المتناحر حتى مع نفسه والمعرف عالميا بمصطلح الارهاب<br />يعنى بمعنى اوضح الدولة الاسلامية اللى الخليفة فيها بدل الرئيس و الدواووين فيها بدل الوزارات<br />واللى يبين صحة كلامى ان مصر اساسا دولة اسلامية حاليا<br />والدليل ان الدستور المصرى على الرغم من تشبعه وتاثره بالدستور الفرنسى الا انه متماشى تماشيا مرنا مع القراءن والشريعة<br />طلعلى تعارض جوهرى بين القراءن والشريعة من جهة والدستور من الجهة المقابلة<br />ثالثا احب اعاتبك صدقنى بحب على اتهامك بالكنيسة بالتواطىء فى الانتخابات<br />لان سياسة الكنيسة تجاه الانتخابات معروفة و واضحة و قديمة وهى سياسة الراى شبه الموحد لكل شعب الكنيسة<br />يعنى مثلا البابا شنودة شايف ان المصلحة( مصلحة الوطن و ليست مصلحة الاقباط فقط ) مع المرشح الفلانى يبقى بطريقة ودية مفهاش اى سلطة كل شعب الكنيسة يرشح المرشح ده<br />ومش معنى ان الكنيسة مختارة مرشح مخالف لرايك او مخالف للمرشح اللى انتا مختاره ده مش معناه ان الكنيسة متواطءة فى التزوير فى الانتخابات او بتدور على مصلحتها<br />رابعا بالنسبة لاقباط المهجر فه<br />اقرأ بقية التعليق .."
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044813/http://egyvote.20at.com:80/article.php?sid=93"

