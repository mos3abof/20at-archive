text = "ين قالك أن أيمن نور لم يعتقل؟ أنت مش عايش في مصر؟ الراجل يا دوب بس فكر يرشح نفسه قضيه وأعتقال علي طول. ده كله رغم أن أيمن نور ليس صاحب شعبيه كبيره لكن الناس أحترمت جرأته ...مين قال نعمان جمعه يمثل تهديد لسلطة الديكتاتور المطلقه؟؟؟ الذي يمكن أن ينافس الديكتاتور فقط هو من يعتقل...مثل الأخوان المسلمين"
