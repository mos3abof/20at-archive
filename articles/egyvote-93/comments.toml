[[comments]]
order = 0
subject = "ده إيه ده ؟؟؟مش كفاية عليك اللي معاك؟؟"
author = "محمد السيد"
posted = "2005-11-30"
text = "لحقيقة ..... كنت محتار في أمره دايما ... هو منتقد لحال الرياضة و حال مسئوليها في مصر ... وجرئ الحقيقة في نقده ,,,, لكن ...<br />وآه من لكن ....<br />كل ما تيجي سيرة الرئيس مبارك علي لسانه .. ييجي كلام إخوانا بتوع السلطة ... حامي البلاد ... الزعيم ... القائد ... رجل السلام ... القائد الملهم ... الزعيم المفدي ... الأب الحنون .... وحاجات من النوع ده .....<br />آه والله ... كل الألفاظ دي بيقولها وأكتر منها شوبير علي مبارك ... تخيلوا !!... طيب يا سيدي إزاي يتسق ده مع كلامك الجميل عن الرياضة وحالها ... ولا دي نقرة ودي نقرة ....<br />أسمعه في مباراة محترمة ... تفوز بيها مصر .... سيل من ايات الشكر و التمسح في الريس وحكومته كلها ....<br />وبعدين معروف إن أي مرشح بينزل علي قايمة الوطني بيكون دافع دفع محترم .... يا تري ليه ؟؟؟ مع العلم إنه معاه اللي ممكن يصلح بيه حال الرياضة في أفريقيا كلها ....<br />أقول لكم مسئولياته ؟؟؟ شوبير بيعمل في الأهرام ..... ونائب رئيس مجلس اتحاد الكورة.. زائد مسئول البرامج الرياضية في أوربت ودريم وياعيني علي البرنامج الملاكي بتاع دريم .....ومعاهم كمان إذاعة إف. إم .....<br />بعد ده كله حيفضي إزاي للدايرة ......<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044813/http://egyvote.20at.com:80/article.php?sid=93"

[[comments]]
order = 1
subject = "ليه يا برادعي بس؟؟؟ تزعل شوبير ليه؟؟؟"
author = "محمد السيد"
posted = "2005-11-30"
text = "لا يا عيني يوم ما البرادعي \" مدير الوكالة الدولية للطاقة الذرية \" أخذ جائزة نوبل ....<br />اسمعوا أحلي تعليق نفاقي رخيص ... من واحد المفروض إنه عنده ضمير ...<br />قال : يا سلام لو كانت تتزحزح شوية .. وتيجي لريسنا وحبيبنا الرئيس محمد حسني مبارك .... يعني جاية غلط للبرادعي وكانوا قاصدين بيها الريس ....<br />يا سيدي حقك علينا ... إحنا نعمل لسيادته ألف جايزة نوبل مش واحدة بس ... طالما إنك شايف كده ....بس متزعلش نفسك ....<br />وبعدين تاني ... انزلوا طنطا واسألوا عن البلطجية اللي حضروا في أول يوم من الانتخابات ... كانوا جايين في حماية الأمن لحساب مين ؟؟؟ أظن لحساب مرشح الحزب الوطني .... ولا إيه ؟؟؟<br />ويا خسارة ... يا ألف خسارة علي كل واحد كسب كرسي برلمان ... مقابل إنه يخسر الناس ...<br />كل الناس ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044813/http://egyvote.20at.com:80/article.php?sid=93"

