[[comments]]
order = 8
subject = "الى الاخ  عصام"
author = "مينا"
posted = "2005-12-02"
text = "نا بشكرك انتا كمان يا عصام على ادبك وذوقك فى الكلام انا حاسس انك انتا الزائر صح ؟<br />اولا احنا ( كمصريين عمتا ) اتعودنا على كلام معين نقوله فى مواضيع معينة بغض النظر عن رصيد هذا الكلام من الصحة و الواقع<br />يعنى مثلا كل ما تيجى سيرة وجود المسيحيين كاقلية فى مصر كدولة اسلامية نقول ده حصل بفضل وجود حرية الاديان فى مصر واعتراف الدستور بحقوق الاقباط والتسامح و الحب بين الديينين<br />ونسيوا او تناسوا ان عدد باباوات المسيحية 119 بطريرك ( زى البابا شنودة حاليا ) اتحبس فى السجون منهم 92 بطريرك بفعل الحكام المسلمين فى العصور الاسلامية وكان اخر مرتين<br />حبس ( البابا كيرلس السادس ) فى دير مارمينا ( ايام عبد الناصر)<br />وحبس (البابا شنودة 42 شهر ) فى دير السريان ) ايام ( السادات )<br />ده غير عدد مش قليل من الباباوات اتقتل واتذبح و اتعذب و لكن انا للامانة مش عارف عدد الذين اتقتلوا دول<br />ده غير بعض الحوادث المشهورة ممكن تكمل قراءة مقالى<br />(قتل 21 فلاح مسيحى فى قرية الكشح فى الصعيد فى عام 1999)<br />يبقى فين الحرية !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!<br />واحنا موجودين فى مصر بفضل الله وحد"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044813/http://egyvote.20at.com:80/article.php?sid=93"

[[comments]]
order = 9
subject = "بقولك ايه يا مينا انت لسه عايش"
author = "زائر"
posted = "2005-12-02"
text = "نا كنت بشوف ردودك فى مواضيع قبل كده<br />هو انت لسه الارهابيين سيبينك<br />انت عبيط يبنى ارهاب ايه وكشح ايه انت لسه مصدق نفسك انتم اللى قتلتم المسلمين فى الكشح انتم سبب البلاوى والمصايب<br />يبنى احمد ربنا على اللى انتم فيه الحكومة مدلعاكم والله العظيم انتم وخدين امتيازات اكثر من المسلمين كفاية ان الكنائس بتعمل رحلات ونادى صيفى وناشاطات والمساجد محظور عليها الكلام ده<br />انتم عيزين واحد زى صدام يلمكوا"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044813/http://egyvote.20at.com:80/article.php?sid=93"

[[comments]]
order = 10
subject = "الى  الاخ  الزائر"
author = "مينا"
posted = "2005-12-02"
text = "نتا طلعت للاسف<br />انسان سطحى و بالامانة ملكش فى اى حاجة<br />مسيحين مين اللى قتلوا مسلمين وفين فى مصر ؟!!!!!!!!!!!!<br />انتا اللى بجد عبيط هات اخوك الصغير ولا اى عيل فى الشارع ولا حتى واحد عبيط وقله<br />ينفع المسيحيين كاقلية يقتلوا المسلمين كاغلبية فى دولة مسلمة؟!!!!!!<br />اللى مش بيشوف الشمس فى النهار يا اما اعمى يا اما مش بيعرف يعنى ايه شمس<br />وعلى اى حال انا مش هجعجع فى الكلام زيك ادينى ايميلك وانا ابعتلك صور ال21 فلاح المذبوحين ده غير الاطفال والنساء وعلى ايديهم اليمين علامة الصليب<br />بس يا ريت ما تعمليش نفسك ناصح و نقولى ده تركيب و فبركة كمبيوتر<br />ثانيا الدولة سامحة لنا بعمل رحلات و انشطة عشان عارفة ان مش وراها اى اتجاهات سياسية<br />الموضوع اجتماعى تماما مش زى المساجد و مع احترامى اللى بتنتهز اى تجمع عشان المظاهرات والزيطة ( انا اسف بس للاسف دى حقيقة )<br />بعدين دلع ايه اللى احنا بناخده من الحكومة انتا بجد اول مرة تتكلم فى السياسة<br />( الاضطهاد الحكومى للاقباط معروف حتى من جميع المسلمين ) و انا بالامانة اول مرة اسمع واحد مسلم بيقول ان الحكومة بتحامى للاقباط<br />يا ابنى انزل الشارع و اقراء الجرايد و احتك بالناس وانتا تتعلم السياسة<br />ويا يا ريت يا زائر نبطل فتى وزيطة و استنتاجات شخصية<br />ثانيا صدام مينفعش يحكم غير حيوانات ( و الذكى يفهم )"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044813/http://egyvote.20at.com:80/article.php?sid=93"

