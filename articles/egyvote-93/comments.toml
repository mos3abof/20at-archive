[[comments]]
order = 14
subject = "الى  الاخوة عصام  وزائر"
author = "مينا"
posted = "2005-12-03"
text = "ولا بالنسبة للاخ عصام الحكومة على الرغم من قلة عدلها الا انها بتعتقل بس مثيرى الشغب والدليل<br />تمتع كل من نعمان جمعة و ايمن نور و طلعت السادات ( كرموز سياسية ) بالحرية مع العلم الكامل باختلافهم الكلى و الجوهرى مع الحكومة ( لكن الاختلاف هنا فى الراى بس<br />تمتع احمد رجب (كرمز اعلامي ) ( فى جريدة الاخبار ) اشرس من يهاجم الحكومة وو الحكم ( مهاهجمة و مبارازة فى الراى فقط ) تمتعه بالحرية<br />تمتع كل من (محمد صبحى وعبد العزيز مخيون وعادل امام اللى اخر فيلم له ( السفارة فى العمارة ) بيهاجم الدولة فى سياسة التطبيع الخارجية مع اسرائيل<br />تمتع كل دول كرموز فنية بالحرية<br />لكن الاخوان المسلمين وحركة كفاية ( على فكرة حركة كفاية حركة قبطية حيث ان المنسق العام للحركة جورج اسحق ) على الرغم من اتفاقى مع اتجهات الحركتين الا انى مختلف معهم فى اسلوب التعبير عن الراى ( اسلوب المظاهرات ) وده سبب فى ان ىالحكومة بتعتبر الاخوان المسلمين جماعة محظورة و كمان بتعتقلهم و تعتقل معاهم كوادر حركة كفاية القبطية<br />يعنى يا اخ عصام الحكومة بتعتقل مثيرى الشغب مش المعارض فى الراى والدين ملوش ا ى دخل فى المسالة دى لانى زى ما انا قلتلك منسق حركة كفاية جورج اسحق اعتقلوه كذا مرة<br />واخيرا بالنسبة ليك يا اخ اعصام عدد المعتقلين 6 الاف مش 20 الف هيجيبوا معتقلات منين يا ابنى<br />اما بالنسبة للاخ زائر<br />اولا اسلوبك المهذب فى اخر تعليق بيختلف تماما عن<br />اقرأ بقية التعليق .."
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044813/http://egyvote.20at.com:80/article.php?sid=93"

