[[comments]]
order = 4
subject = "شوبير ايه اللى انت جى تقول عليه"
author = "زائر"
posted = "2005-12-01"
text = "ى موضوع وجته فى احد المنتديات قبل الاعادة<br />_______________<br />في حين أعرب المفكر القبطي البارز ( ميلاد حنا ) علناً عن تخوفه من الصعود السياسي للاخوان ، وقال : \" لو كانت هذه الانتخابات نزيهة وشفافة لكان الاخوان المسلمون فازوا باغلبية المقاعد\"، في اشارة الى التقارير عن انتشار عمليات التزوير والترهيب والعنف التي مارسها عدد من انصار الحزب الوطني الحاكم .<br />وصرح ميلاد حنا لوكالة فرانس برس بقوله : \" انا ادق ناقوس الخطر لاحذر المصريين من انه اذا ما تسلم الاخوان المسلمون السلطة فان مصر ستصبح دولة اسلامية .. \" ، يقول هذا حتى لو كان وصول الإخوان للمجالس النيابية عن طريق الإرادة الحرة للشعب المصر !!! . وقال بالحرف الواحد : \" اتمنى ان اموت قبل ان ياتي هذا اليوم \". [ راجع العربية نت بتاريخ الاثنين 21 نوفمبر 2005م - 19 شوال 1426 هـ ] .<br />وفي حين اجتمع الأقباط المتصهينون في أمريكا لتشويه سمعة مصر وشعبها المسالم ذوالأغلبيه المسلمة (96%) وتحريض المجرم بوش وحلفائه من الصليبيين الجدد علينا وعلى مصرنا الحبيبة بتهمة الإضطهاد الديني ليجدوا المبرر وفق آمالهم الخائبة لتدمير مصر وشعبها كما فعلوا بالعراق .<br />في وسط هذه الأجواء المشحونة بالحنق على تلك النتائج التي يحققها الإخوان المسلمون في مسيرة الإصلاح المرتقبة ونجاحهم في التعبير عن إرادة الشعب المصري لأول مرة وتوجهاته وأمنياته بالتغيير الحقيقي .. في وسط هذه الأجواء يخرج لنا المرشح أحمد شوبير بعد أن لم يكتفي بالصفر المصري الذي تحقق في المونديال .. ويتجه لزيارة الكنيسة القبطية بطنطا للتترس بها وطلب العون منها فى انتخابات مجلس الشعب ضد مرشح الإخوان المسلمين ... في خطوة خطيرة تفتح الباب للتساؤل عن مدى تورط الكنيسة في لعب أدوار خفية وتحالفات غير نزيهة ضد<br />اقرأ بقية التعليق .."
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044813/http://egyvote.20at.com:80/article.php?sid=93"

