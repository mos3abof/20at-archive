[[comments]]
order = 13
subject = "استادي"
author = "سكون الروح"
posted = "2006-07-28"
text = "ساردد عليكم جملة كان دائما استاد علم النفس بيقولها لنا \" انتم كلكم جميلات كل واحده فيها شي بيميزها بيخليها جميلة ممكن هدا الشيئ انتم ما بتعرفوه فيكم\"<br />و كما هو شائع عنكم انه بنات المغرب جميلات بس هم ما بيشوفوا كده ممكن لانهم اتعدوا الفهم الشكلي للامور<br />و الخلاصة انه الجمال الحقيقي هو جماال القلب و ما اظن انه في شي ممكن يجمل القلب غير الايمان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133931/http://www.20at.com/article2.php?sid=185"

