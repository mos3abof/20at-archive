text = "ياجماعة بصراااااحة انا حلوة اوى وجسمى رائع جدا وبصراحة انا مثيرة جدا وبهتم بنفسى لدرجة مجنونة<br />بس يا خسارة انا خجولة جدا لدرجة تمنعنى انى اعمل علاقة مع ولد صاحبى<br />مثلاا البوى فريند بتاعى او اى ولد زى باقى البنات<br />ونفسى اتخلص من الخجل دا بقى بس موش قادرة<br />نفسى حد ينصحنى"
