[[comments]]
order = 10
subject = "الجمال جمال اللسان"
author = "طماطم"
posted = "2006-03-11"
text = "اولا بجد مرسيى لتعليق واحد معدى بجد فعلا انتة لذيذ ودمك خفيف بجد انا ضحكت جدا على تعليقك . وبعدين الجمال دا شىء نسبى الشكل مش مهم عشان مش هيفضل وبعدين انا شايفة ان جمال اللسان دا اهم من اى شىء لان الانسان اللى يتكلم كلام كويس وجميل ويكون لسانة عف دا افضل من اى شىء لان دا هيكسبة روح وشكل جميل . وبعدين الاخت اللى بتقول انها خجولة انا شايفة ان فى ولاد بتتكسف عنك كتير لا انتى كويسة متقلقيش خالص"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133931/http://www.20at.com/article2.php?sid=185"

