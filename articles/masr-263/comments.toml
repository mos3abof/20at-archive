[[comments]]
order = 1
subject = "العدل اساس الملك"
author = "مجدى اليمانى"
posted = "2006-05-04"
text = "اجلا ام عاجلاستغيب شمسك يا مبارك وبدون رجعه ولكن كل الذى ابغيه ان يرزقنا الله قليلا من الحياة لنرا شمس العدل 0000العدل والله انها كلمه قلما ما قبلها فى هذة الحياة من منا مرة شعر بالعدل فى حياة سواء كان ابن او طالب او موظف او اب او اى شئ انها كلمه افتقدنا معانيها من هول ما نلاقيه ولكن بكل امل وتفاؤل وشوق ولهفه الى غد مشرق نقول ان دوله الظلم ساعه ودوله العدل الى قيام الساعه واعذرونى للاطاله"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192659/http://masr.20at.com:80/article.php?sid=263&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "help"
author = "sara"
posted = "2006-05-05"
text = "يا مجدى اليمانى انت متفائل اوى احنا عمرنا ما هنشوف شمس العدل لانى بعد ما مبارك يموت هيجى جمال ويمسك الحكم وهيمشى بسياسة ابوه طبعا واحنا لسة ورانا شغل كبير علشان نصلح الشباب ونصلح التعليم ونصلح حاجات كثير فى بلا دناونصلح القانون وقبل دة لازم يكون المواطن المصرى ليه قيمة فى بلده وابسط دليل الفلا حين والعمال لانهم مش واخدين حقوقهم فى البلد سيبك من عيد العمال وانى العامل يقدر يرشح نفسه فى الانتخابات المهم حقوق الا نسان اللى احنا مش عارفين نطبقها"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192659/http://masr.20at.com:80/article.php?sid=263&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "مكنش اتعذر و لا كل جزر"
author = "تاخد نفس"
posted = "2006-05-08"
text = "شكرا عل الموضوع الشيق<br />بس طبعا فى لحظه خوف من احمد رجب زى ما انتا قولت ان الفلاح مدى ظهره للجمهور علشان يظهر الزفت مبارك بس طبعا نعذره طبعا كل واحد عنده انه يخاف على حياته خصوصا مع الافعى مبارك .....<br />و انا متابع معظم كاريكاتيرات عمرو فهمى"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192659/http://masr.20at.com:80/article.php?sid=263&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
