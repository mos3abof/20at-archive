subject = "رعياك اسوأ من الصور يا مبارك"
author = "توتى"
posted = "2006-10-06"
text = "عجبنى الموضوع و المشاهد المصورة و لكن فى الحقيقة هناك صور اسوأ بكثير و حالات انسانية تدمى القلوب فى المستشفيات لا تجد العلاج ولا حتى الامل فى موعد قريب للعرض على الأطباء و اجراء الجراحات<br />مرضى الفشل الكلوى و السرطان والكبد اعدادهم فى ازدياد<br />الملوثات فى كل مكان نتنفسها و نشربها و نأكلها<br />الفساد فى كل مكان و تعبير القطط السمان صار مضحكا كوصفا لهولاء الذين كسبوا من خيرات ام الدنيا بدون وجه حق و بالفهلوه و المحسوبيه<br />ان القلب مليىء ومرهق مما نراه و نعانيه<br />حسنا الله و نعم الوكيل<br />اللهم أنشر رحمتك على العباد و عجل بالفرج يارحيم"
