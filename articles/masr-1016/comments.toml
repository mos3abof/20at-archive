[[comments]]
order = 25
subject = "ربنا يرحمنا ومن مبارك يحرمنا"
author = "مروان المصري"
posted = "2006-10-23"
text = "بسم الله الرحمن الرحيم<br />أردت أولا أن أقول لكم كل عيد وأنت بخير ثم أتحدث عن مصرنا العزيز الذي يضيع الآن بين يدي مبارك ورجاله الذين يبيعون مصرا للغرب وأمريكا ...الله يرحمنا ....من فساد الحكم والرأي ....الله يرحمنا ....من ضياع البلد والصاحب....الله يرحمنا ....من الذين يريدون أن يحولوا مصرا إلى حكما ملكيا فهو بجلالة قدرته يريد تولية أبنه من بعد وفاته التي ندعوا الله بتعجيلها .....الله يرحمنا أو يرحمه منا"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125152315/http://masr.20at.com:80/article.php?sid=1016"
