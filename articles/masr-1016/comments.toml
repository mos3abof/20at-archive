text = "يا جماعة فى ايه مالكو متحاملين على الموضوع ليه؟<br />الدستور محتاج فعلا يتعدل<br />لازم يتعدل بعد حادثة اديس ابابا<br />لما العربية اتخبطت الدستور اتخبط هو وفانوس الاشارة اللى ورا ولا زم يروح للسمكرى يتعدل ويرجع وبعدين نبقى نشوف موضوع تطبيقة دا<br />وبسيطة يا جماعة لو عايزين تطبقو الدستو ودوه لاى حداد هايطبقة كويس اوى هايعرف يعنى<br />وبعد ما ييجى من عند الحداد نبقى نوديه للسمكرى يستعدلة تانى لاننا نسينا نكويه قبل ما نطبقة"
