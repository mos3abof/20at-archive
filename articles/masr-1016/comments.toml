[[comments]]
order = 0
subject = "لا لا لا لا لا لمبارك"
author = "معاذ محمود عامر"
posted = "2006-10-04"
text = "الفيلم مؤثر ومؤلم ورأعجبتني الجملة الأخيرة فيه(لا يستأذن عبد من قيصره عندما يريد ثورة)<br />وأحب أن أهدي القيصر هذه الكلمات من الفاجومي:<br />شيد قصورك<br />شيد قصورك ع المزارع<br />من كدنا وعمل إدينا<br />والخمارات جنب المصانع<br />والسجن مطرح الجنينه<br />واطلق كلابك<br />في الشوارع<br />واقفل زنازينك<br />علينا<br />وقل نومنا في المضاجع<br />ادي احنا<br />نمنا ما اشتهينا<br />واتقل علينا بالمواجع<br />احنا اتوجعنا<br />واكتفينا<br />وعرفنا<br />مين سبب جراحنا<br />وعرفنا روحنا<br />والتقينا<br />عمال وفلاحين<br />وطلبه<br />دقت ساعتنا<br />وابتداينا<br />نسلك طريق<br />ما لهش طريق<br />ما لهش راجع<br />والنصر قرب من عنينا<br />النصر أقرب<br />من إدينا"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125152315/http://masr.20at.com:80/article.php?sid=1016"

