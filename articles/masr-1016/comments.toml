[[comments]]
order = 12
subject = "لا لحسنى مبارك ولا لجمال مبارك"
author = "مصرى"
posted = "2006-10-08"
text = "أولاً حسنى مبارك ليس من حقه الإقتراب من الدستور لأنه مزور وليس له شرعية فى الحكم<br />ثانياً الدستور ده ملك الشعب وهوه إللى المفروض يختار المندوبين عنه فى سن الدستور الذى يرعى حقوق الشعب ويحافظ على ممتلكات المصريون<br />ثالثاً الشعب كله بيرفض حسنى مبارك الفاسد وبيرفض إبنه وهما قاعدين من غير شرعية وبإعتراف اللامبارك بتزويره للإنتخابات بيقى لازم كلنا نرفض وجوده فى الحكم ونفرض بنود الدستور التى تمنع هذه المهزلة لتوريث أبن متخلف عقلياً حكم رجال قضاء وحكم الجيش وحكم خبراء مصر وأساتذه الجامعات والشعب بكل طوائفه إبن ليست له أى خبرات إلا نهب البلد وأمر بضرب الشعب بالحذاء فى المظاهرات والطريقة التى يفرضونه بها على الشعب هى طريقة المحتل وليست طريقة إختيار حاكم بالإنتخابات الحرة وترشيح المناسب الذى إختارة الشعب أصلى عيلة مبارك بتعتبر نفسها بتحكم بلد من غير شعب ومن حقهم يعملوا إللى هما عايزينه ولكن الشعب سيتحرك ليس بإرادته فقط ولكن بكبته وحرماته ورفضه لفسادهم"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125152315/http://masr.20at.com:80/article.php?sid=1016"

[[comments]]
order = 13
subject = "الى مبارك و عار عليكم"
author = "Samirium"
posted = "2006-10-13"
text = "انتوا اكبر جاهلين شفتهم فى حياتى لو انت شاب زى الورد وتقول ان احناو الناس دى خونة وعملاء يبقى يا حبيب قلبى ما فيش عميل غيرك يا عبيط واصلا باى حق تكفرنا واضح انك حتى جاهل فى الدين لأ والتانى اللى بيقول نعم للتمديد والتوريث يا عم روح شفلك كلب ي....... انت ياد عبيط ولا عبيط ازاى نمد وازاى نورث هى ناقصة انا شاكك فى حاجه على فكرة الظاهر كده ان القنبلة الذرية لما هتنزل هتنزل على اوضتك انت ولا عزاء للمصريين جميعا (ملاحظة : الحزب الوطنى يعتبر جنسيات اخرى)"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125152315/http://masr.20at.com:80/article.php?sid=1016"

[[comments]]
order = 14
subject = "تعاطفك وحده لايكفى تبرع للجنيه المصرى"
author = "مصرية"
posted = "2006-10-15"
text = "فى شوية اقوال سادت فى عصر مبارك عصر التقدم والازدهاروالازدهار دى حطوا عليهامليون خط اول مثل يقول<br />\"إن شفنا فيل من غير زلومة نبقى نصدق كلام الحكومة\"<br />\"يا واعدنى بالوظيفة كلام فى كلام يا ساقينى البانجو فى البرشام\"<br />\"قال ليه انت ارهابى يا ديك قال له يا تعلب كلنى وبلاش تلاكيك\"<br />\"ايه وزك على الحرام يا خلوصى قال خمسة وعشرين مدرس خصوصى\"<br />\"بعد الفرحة بالبكالوريوس والزهوة جت الوظيفة قاعدة على قهوة\"<br />\"إن كان دولار يا ولية زغرتى وإن كان جنيه غطينى وصوتى\"<br />\"تقولنا مليار ولا عشرين مليار هو حد هيعد وراك يا وزير الدار\"<br />قال يابا علمنى الغباوة قال تزرع البرسيم للحمار وتشترى رغيفك بالدولار\"<br />\"قال مالك تعبان يا وزير قال شامم ريحة تغيير\"<br />\"الجعان يحلم بطابور العيش\"<br />\"إن تاه منك حمار هتلاقيه معلق عند الجزار\"<br />مثل يقال فى البرلمان \"بلا نزاهة بلا امانة لايمنى على الحصانة\"<br />\"وزارة تروح ووزارة تيجى إيه اللى جد عليك يا مليجى\"<br />\"تعال يا جحا واستثمر عندنا قال لا احب اموت موتة ربنا\"<br />\"يا مستثمر ايش جابك بلدنا ووقعك فى الخية قال بختى الاسود ودعى امى عليا\"<br />\"يا داخل الوزارة وليك طلة يا خارج من الوزارة وتنكسر وراك قلة\"<br />\"يا مأمن للحرامى حيسرق اكلك يا مسدق الحكومة سلامةعقلك\"<br />\"ايه اللى نفخ دماغك كدة يا عبد الحى قال كنت بكبر دماغى مع رئيس الحى\"<br />\"قال حكيم القاهرة الكذب اربع درجات متصاعدة:كذب ابيض وكذب رمادى وكذب اسود وبيان حكومة مصر\"<br />قال حكيم مصر:إن تتجه إلى محطةسكةالحديد و تبتاع تذكرة سفر فهذه هى النفس الامارة بالسوء وأن تعدل عن السفر فى اخر لحظة فهذه هى العنايا الإلهية وإن تصدق تصريحات الامان التى يرددونهامن 20 سنة فلك الرحمة والمغفرة ولاسرتك الصبر والسلوان و3000 جنيه<br />إلهى يارب تجعل ال72 مليون مصرى غلابة<br />اقرأ بقية التعليق .."
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125152315/http://masr.20at.com:80/article.php?sid=1016"

[[comments]]
order = 15
subject = "جاهل"
author = "فيكتور النصرانى"
posted = "2006-10-15"
text = "الى الاخ Samirium<br />هذا الجاهل المتعصب الحقير ، واطى من الاخر<br />انت مين انت ، عمال تشتم فى ده وده و تشتم الحكومه تشتم الرئيس<br />وانت بقى يا فالح تطلع ايه ، واد اهبل قاعد على النت لا شغله و لا مشغله وقال ايه البلد مش عجباك ، يا كلب مانت اخرك تروح تعيش فى افغانستان ، تعد فى خيمه وقدامك الجمل والسلاح والاربع حريم وخلاص ، ملكش اصلا انك تعد قدام كمبيوتر يا كافر يا واطى.<br />شكرا لك مره اخرى على هذا التعليق!!!"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125152315/http://masr.20at.com:80/article.php?sid=1016"

