author = "ابومحسن"
posted = "2006-10-18"
text = "انا شايف من تعليقك انك بتتريق على الاسلام<br />واريد ان انوه هنا انه لمعرفة الاسلام يجب اتباع الاتي:<br />دراسة احوال الجزيرة العربية قبل البعثة المحمدية.<br />دراسة السيرة النبوية<br />دراسة احوال الجزيرة العربية بعد وفاة النبي صلى الله عليه وسلم ودراسة تاريخ الخلفاء<br />ويتبين كيف غير النبي محمد صلى الله عليه وسلم احوال سكان الجزيرة من الهمجية والتخلف والرجلية الى الدولة الحضارية وفي اقل من مائة عام كانت تحكم من اسبانيا الى الهند.<br />ارجو ذلك"
archived = "2006-11-25"
