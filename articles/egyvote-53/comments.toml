[[comments]]
order = 0
subject = "معادلة رياضية"
author = "زائر"
posted = "2005-11-24"
text = "شمت + الحق = كرسي مستحق في مجلس الشعب<br />الفقي + الباطل = كرسي مغتصب في مجلس الشعب<br />حشمت - الفقي = حشمت<br />الفقي - حشمت = - حشمت<br />إذن .... الفقي = صفر<br />خسارة يا دكتور الفقي كنت عند مصريين كتير أغلى من كده بكتير، يا خسارة بجد كنت بأقول عليك واحد من الرجال المحترمين في مستنقع الوطني وفي وقت قلت لأ هو آخر الرجال المحترمين بس يا خسارة ولا انت كمان ... الكرسي أغلى من الشرف .... بجد قلبي حزين"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813234012/http://egyvote.20at.com:80/article.php?sid=53"

[[comments]]
order = 1
subject = "كان زمان واحد محترم"
author = "محمد السيد"
posted = "2005-11-24"
text = "ان محترما...........والآن .....؟<br />كان في يوم واحد كنا فاكرينه محترم والأيام أثبتت لنا العكس ......<br />كان في يوم واحد كنا فاكرينه مش زيهم ولا منهم لكنه أثبت لنا العكس .....<br />كان في يوم واحد كنا فاكرينه مفكر وتقدمي وليبرالي وحر ومدافع عن حقوق الناس الغلابة لكن سحر الكرسي أثبت لنا العكس .....<br />كان في يوم واحد كنا فاكرينه مصلح ومثقف ومن طينة غير طينتهم لكن ذهب المعز أثبت لنا العكس ....<br />مصطفي الفقي ... أنا ندمان إني يوم احترمتك .... و مش أنا بس ... دول كل الناس ... حاول تنزل وتشوف الناس رأيها فيك إيه ؟ .... واطمئن تذكرة الطيران بتاعة هجرتك من البلد دي علي حسابنا إحنا ... إحنا الناس .....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813234012/http://egyvote.20at.com:80/article.php?sid=53"

