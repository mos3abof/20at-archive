[[comments]]
order = 2
subject = "علا مش Happy"
author = "عابر القارات"
posted = "2006-07-08"
text = "أنا فعلا مش Happy و للاسف المقالة دى قلبت عليا المواجع و وصلت لحقيقة كنت بحاول أخفيها ورا إبتسامتى و هيه إن أقوى عجز هو العجز عن الاحساس بالسعادة و ده فعلا إحساس قاتل لأنك بتكون زى المسجون جواه فلا أصحاب بيخففوا عنك الاحساس و لا رحلات و لا فسح و لا تغيير جو ممكن يبعد عنك الشعور ده و المصيبة الاكبر إحساسك إن مفيش شئ مادى او معنوى هوه اللى مسببلك الشعور ده و يبقى كده إنتا حطيت رجليك على اول طريق الاكتئاب"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091112/http://masr.20at.com:80/article.php?sid=618"

[[comments]]
