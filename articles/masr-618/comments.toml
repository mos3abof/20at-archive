subject = "عمر نجم"
author = "عمرو"
posted = "2006-07-09"
text = "لعمر نجم قصائد ودواوين وأخرى وهذه القصيدة ليست رائعته الوحيدة وان كانت الأقرب الى قلب العبد لله ، فهناك قصيدة شيش وباب وقصيدة وعدودة للفرح التي أهداها الى أطفال الحجارة في فلسطين العربية بالاضافة الى ديوان صدر بعد وفاته وحمل اسم \"تغريبة عمر نجم\""
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091112/http://masr.20at.com:80/article.php?sid=618"

[[comments]]
order = 4
subject = "هابي ميل"
author = "هوووووووبه"
posted = "2006-07-10"
text = "حلوة يابت , بس عايزه اضيف حاجه هي غم شويه بس حضفها<br />الحته بتاعت جائنا البيان التالي لما هنيدي بيسال<br />الراجل اللي بيسلك البلوعه, هابي نيو ير عليك \" يعني سنه جديدة سعاتك\"<br />ازبهل كدا وفي الاااااخر الفيلم قاله happy new year<br />وكله تمام ياباشا,مشهد متكرررر كتير,ونا ياختي لما ازهق من الكتاب اقول If you want to be happy<br />سك الكتاب وصلي ع النبي"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091112/http://masr.20at.com:80/article.php?sid=618"
