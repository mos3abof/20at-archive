subject = "عصوم"
author = "عصام"
posted = "2006-07-06"
text = "يا سلام يا دعاء موضع جميل<br />بس نصية تبعدى عن الموضيع النكد شوية<br />خليكى انتى لوحدك على جنب<br />مانتى عارفة كفاية النكد اللى عايشينة طول النهار<br />حاول ان تضع ابتسامة على شفء الغير<br />حتى تبتسم لك الحياة (ونقول دة لسة عايش)<br />عصوم<br />مشرف منتدى الترفية<br />بموقع مكتوب دوت كوم<br />essam_ahmed_844@hotmail.com"
archived = "2006-07-21"
