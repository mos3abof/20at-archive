[[comments]]
order = 1
subject = "عرب سلبيين"
author = "لاخوة الافاضل"
text = "بدل ما نعد ندعي على امريكا نحاول نتعلم منهم يمكن ننفع<br />كفايانا سلبية اين ارادة العرب، الكاتب بدات ايجابيتها بمقال، طيب احنا هنعمل ايه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103246/http://www.20at.com/article.php?sid=1568"

[[comments]]
order = 2
subject = "silent musician"
author = "ا جماعه بدل ما نعد نقول يا حسره علينا نحاول نقلدهم لازم ناخد من الغرب الكويس الى فيهم بدل ما ناخد منهم البلاوى الى فيهم واوبرا وينفرى مثل وقصة نجاحها رائعه يبقى ليه مانقلدهاش"
text = "بدلا من ان تلعن الظلام اوقد شمعه<br />وانا رايى ان الاراده هى سر النجاح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103246/http://www.20at.com/article.php?sid=1568"

