subject = "مصري بوند"
author = "من أصبح فيه الفقراء ملوك..."
text = "ماوردش يعني ان ابوبرا عاملة عملية مؤخرا في صدرها عشان تنفشه شوية...أصلها يعني كانت بنت فقرانة ومسلوعة...<br />على اخر الزمن شوارعية فيلادفيا وشيكاغو ومسيسبي بقوا ملويونيرات....تفوا على ده زمن"
archived = "2006-11-02"
