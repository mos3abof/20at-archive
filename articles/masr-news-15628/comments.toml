text = "شايفين حائط عساكر الامن المركزى فى الصورة<br />هؤلاء سبب خراب مصر<br />مليون عسكرى بياكل ويشرب وليس لهم اى لزمة<br />يعنى 10 عساكر افضل من الحيطة دى<br />ولكن العساكر عندنا بيجندوا ببلاش يبقى نكتر منهم ونصرف فلوسنا عليهم بدون اى داعى"
