[[comments]]
order = 1
subject = "لن يطفئوا نور الله"
author = "صايع وقديم"
posted = "2006-01-01"
text = "حط نفسك مكانهم ليهم حق يحاربونا اكتر من كدة اذا كان الأسلام بينتشر غصب عن حبابي عينيهم يبقي لازم يحاربونا اذا كانوا حاسين ان الكنيسة بتاعتهم مبقتش قادرة اساسا انها تلمهم ----- عموما الاسلام كدة كدة هينتشر بمزاجهم او والجزمة فوق دماغهم هينتشر و اعلي ما في خيلهم يركبوة<br />hebo_sherif@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144620/http://www.20at.com/article2.php?sid=172"

[[comments]]
order = 2
subject = "أحيي فيك غيرتك ولكن..."
author = "محمد علي"
posted = "2006-01-01"
text = "لا شك أن الغرب بات يعاني من إفلاس واضح في كل شيء حتى في المجال العلمي و بدات دول نمور آسيا و اليابان في دخول هذا المجال وسحب البساط<br />و لكن يا أخي \" الجزمة فوق دماغهم\" ليست هي طريقة الكلام المناسبة مع تقديري لغضبك من صفاقتهم جرائمهم في حقنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144620/http://www.20at.com/article2.php?sid=172"

[[comments]]
order = 3
subject = "حرص و لا تخونش"
author = "انسان"
posted = "2006-01-02"
text = "من راي ان ده امر طبيعي لان كل دولة لها الحق في سن قوانيها حيث انها لم تضر احد و هم لم يمنعوا الزواج و لكن وضعوا قوانين كما يحدث دايما و هم قد تعرضوا لهجمات من قبل فاخذوا بمبدا حرص و لا تخونش<br />و اتمني اسلوب ارقي من ذلك في التعامل و كتابة التعليقات ايها الانسان المهذب التدين و لا ده بالشكل فقط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144620/http://www.20at.com/article2.php?sid=172"

[[comments]]
order = 4
subject = "عاقل"
author = "عاقل"
posted = "2006-01-03"
text = "كيف باللة عليك تقول ان ها الدين سينتشر بالقوة<br />لاا عزيزى انت ما عم تفهم جد<br />لاان الغرب عنهم تدين والكنيسة تحكمهم دوما وابدا لكن مشكلتهن الاانفتاح الذائد للحرية<br />ومن وين تقول اعداد كتيرة عم تصير بالاسلام عزيزى تاكد اولا قبل ها الاندفاع الاهوج<br />بعرف انها غيرة لانهم افضل منا دوما وابدا<br />ولكن ابحث عن الموضوع عن جد لا من عقلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144620/http://www.20at.com/article2.php?sid=172"

[[comments]]
order = 5
subject = "احييك جدا"
author = "وليد"
posted = "2006-01-03"
text = "اللى الاخ عاقل<br />انا باحييك على كل كلمة قلتها دا الفرق بينك وبين الصايع اللى كاتب فوق قال بالجزمة قال<br />مين يا بتاع انت اللى بياخد بالجزمة هما ولا احنا<br />ياريت يا صايع يكون فى ذوق فى الكلام لان امثالك لازم يفكرو ميت مرة قبل الكلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144620/http://www.20at.com/article2.php?sid=172"

