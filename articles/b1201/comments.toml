subject = "هذا الرجل.."
author = "ايمن"
posted = "2006-09-09"
text = "اولا..الشاب من منظقة البقعه وليس الزرقاء<br />ثانيا .انا لا اشجع مثل تلك الاعمال التي لا تفيد بشيء...<br />انا اعتقد اصلا ان هذا الرجل مدسوس من جهة غربيه...حتى يلهينا عن ما هو اهم..لبنان..العراق..,وفلسطين الجريحه..<br />وهذا الرجل ..اصلا هو سوابق..ولا اعتقد انه مثل هؤلاء الاشخاص يهتمون اصلا بالسياسه.."
