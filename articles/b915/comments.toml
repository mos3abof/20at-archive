text = "نحن لانكرة الشعب الاسرئيلى ولكن نحقدحقداعمى على مايصدرمن الحكومات الاسرائيليةبحق اهلنا تحت الاحتلال بغيرالقدس واللة لن يحدث السلام وستتوارث الاجيال القضيةبكل سلبياتها جيلا بعدجيل السلام لمصلحة اسرائيل احسن من الحرب لوصارسلام اسرائيل حتكون قوة اقتصادية عالمية ونحن ومليارمسلم نشدالرحال للاقصى الشريف للعبادة دون خوف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124653/http://www.20at.com/article2.php?sid=915"

