subject = "مش عارف"
author = "Lost soul"
posted = "2006-06-07"
text = "الموضوع جميل جدا .<br />تحية لجنين الصامدة شاهدة الذل العربى<br />الشاهدة ايضا على تخاذل الاصنام الجاثمة على كراسى الحكم من المحيط الى الخليج.<br />يانازلين على الحمى و ديارة هلا رايتم فى الديار تقلقلى<br />قد طال عزكم فى الهوى و تذللى و من العجائب عزكم و تذللى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124653/http://www.20at.com/article2.php?sid=915"

[[comments]]
order = 3
subject = "روعة البرتقال كما المدينة"
author = "سعيد"
posted = "2006-06-07"
text = "هي ذات الروعة، تنقلها مني سليم<br />وفي ظني هناك المزيد<br />فالمدن كجنين بلا أبواب او مفاتيح لكنها في حالة جنين هي عبارة حصون نرجو ونامل ان تدوم<br />ويحفظ الله مدننا وقرانا واوطاننا<br />فدعو يرعاكم الله<br />باحترام<br />شكرا لكاتبة المقال/ حتما عطر الكتابة لم يطل كل التفاصيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124653/http://www.20at.com/article2.php?sid=915"

[[comments]]
order = 4
subject = "جنين .... ده جنين البطل اللي جاي"
author = "محمد السيد"
posted = "2006-06-07"
text = "جنين ..<br />يمكن تكون أول مرة نسمع عنها يوم حصارها ...اليوم ده . كان الكل بيتكلم عنها كأنها اسطورةة ...<br />كله كان بيردد اسمها كأن أهلها من زمن غير الزمن ...<br />زمن الصحابة .. زمن المجاهدين .. مجاهدين من زمن العزة الإسلامية بتاع زمان ...<br />فاكرين الزمن ده ؟؟<br />لما هارون الرشيد بعث رسالة لقائد الروم ..وبدأها بـ \"<br />من هارون الرشيد إلي نكفور كلب الروم ... \"<br />ياااااااااااه<br />والله فكرتنا بالأيام الجميلة دي<br />يالا ..<br />أكيد راجعة ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124653/http://www.20at.com/article2.php?sid=915"

