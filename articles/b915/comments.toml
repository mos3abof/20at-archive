[[comments]]
order = 7
subject = "أمة جديرة بالهوان"
author = "إن أمة تقتل خيرة رجالها الذين يدافعون عن حرامتها ، ويدفعون من دمائهم من أجل عزتها وكرامتها ، حق لها أن تهون ، بل تسام الهوان صباح مساء."
posted = "2006-06-08"
text = "إن المجاهد يجاهد في الشيشان فلا يقتل ويجاهد في افغانستان فلا يقتل ، ثم يأتي الى بلده ، فيقتل على يد من ينتسب زورا وبهتانا الى الاسلام.<br />كيف يهابكم الاعداء -معشر العرب - وأنتم تقتلون خيرة رجالكم بانفسكم .<br />إن عدو الامة الاول ليس اليهود ولا الصلبيين ، بل هي أنظمة العمالة والكفر ، التى لاتألو جهدا ، ولا تدخر وسعا في حرب الاسلام ، وأهله.<br />تلومون الصهاينة في قتل أهل فلسطين ،وأنت تقتلون خيرة الرجال ، الا تعسا لكم وترحا -يا معشر من رضي بالذل صاحبا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124653/http://www.20at.com/article2.php?sid=915"

