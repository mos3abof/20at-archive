subject = "موضوع رائع"
author = "شخص واحد بس اللي يعرف"
posted = "2006-06-07"
text = "حتة من نشيد بأحبها :<br />هذي جنين مطوقة و محاصرة<br />حلفت تقاتل يا عرب مهما جرى<br />نادت حرسها و كبرت اتجمعوا<br />صيحوا باسم الله خليكم معو<br />و الموضوع تحفة و رائع، برافو يا منى<br />و صورة البرتقال جامدة أوي<br />جبتيها منين؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124653/http://www.20at.com/article2.php?sid=915"

