subject = "كل من هب ودب"
author = "محمد الشافعي"
posted = "2006-10-06"
text = "بارك الله لنا في فضيلة مولانا الشيخ علي جمعة فهو عالم من علماء هذه الأمة الكبار<br />(وموش كل من هب ودب يعمل نفسه مفتي )احترموا التخصص والعلم الحكاية موش بزرميط إلى أولئك الذين يهرفون بما لا يعرفون وأرجو العناية بتعليقي وشكرا"
archived = "2006-11-05"
