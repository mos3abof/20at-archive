[[comments]]
order = 20
subject = "لاحول ولا قوة الا بالله"
author = "وجدي"
posted = "2006-10-07"
text = "لا حول ولا قوة الا بالله تتحدثون عن الدين كأنكم تتحدثون عن مباراة كرة قدم كل يدلي بدلوه سبحان الله فكم انت ياربنا رحيم حيث لم تهلكنا بما فعلنا وعجبا لزمن ينتقد فيه مخرج رجل دين فعجبا لزمن ينتقد فيه فنان اخر من يهتمون بالفتوي فنان اكاد اجزم انه لا يصلي فلو صلي ما امتهن هذه المهنه وعجبا لمفتي يسمح لهذا ان ينتقده دون ان يكون له موقف حازم فلا عجب في هذا اذن لقد رايت ايناس الدغيدي تفتي علي الفضائيه وتعترض علي امور شرعيه وتتحدث في الدين ولا معترض فعجبا لزمن رضي بان تكون ايناس الدغيدي وامثالها يشرحون لنا الدين ورفضوا كلام المفتي . اخيرا انتم تريدون دينا يتماشي مع اهوائكم حسنا فلن يمنعكم احد خذو ما تريدون وردوا ما تريدون ويوم القيامة سوف تعرفون الحقيقه يوم يعض الظالم علي يديه"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105204928/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
