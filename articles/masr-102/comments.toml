[[comments]]
order = 7
subject = "خالد الصاوى"
author = "الشمحطجى"
posted = "2006-04-02"
text = "ولاونى مخنوق وقرفان وطالع... أمى إلا ان الموضوع حرقلى دمى وخلانى اعلق عليه ...<br />بصراحة خالد الصاوى فنان محترم من غير كلام كتير ...<br />بالنسبة بقى لعمنا الشيخ على جمعة ومن غير كلام كتير وبعيد عن شخصه الكريم ... النظام النجس إلى احنا عايشين تحت نير استعمارها للمصريين طوال الخمسين ستين اربع تلاف سنة الى فاتو ...بيلعبو بشيوخ الازهر زى الكورة الكوشت ...<br />وعمنا الشيخ جمعة ماله هو ومال التماثيل وهو من الاساس لسة فى حد بيعبد الاصنام يا مولانا ...!!!<br />بيتهيألى كان من الاولى لعمنا الشيخ انه يفتى بحرمانية عبادة الحكام والملوك ولا بحرمانية اللعب فى صحة الناس والمتاجرة بأقواتهم ولا بجواز قطع ايد اى حرامى شيك يسرق اكتر من خمسين مليون جنيه ويخلع على بلاد بره ...<br />حاجات كتير عايز اقولها وحاجات كتير اولى لعمنا الشيخ انه يتكلم فيها انما يسيب البلاوى الى فى البلد والفساد الى ناهش فى لحمها وعضمها ويمسكلى فى الاصنام والتماثيل يا \"أخى \" كلمة اعتراضية مكونة من ثلاثة احرف اولها قاف وآخرها هاء وفى النص حاء\" !!<br />وربنا يخرب بيت الى وصل البلد للحالة المعفنة دى ...آمين !<br />shamahtagi@hotmail"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120220/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

