[[comments]]
order = 14
subject = "ياصاوى خليك فى شغلك"
author = "حازم زيدان"
posted = "2006-07-10"
text = "ياصاوى خليك فى شغلك انت لما بتروح للدكتور تقوله بشتكى من كذا وكذا ويقولك عندك أنيميا مثلاً بتقوله لا دنا بأكل كثير أنا معنديش أنيميا أنت دكتور متفهمش حاجه وبعدين متخلطش الأمور فى بعض إيه اللى دخل فلسطين والضباط فى فتوى الدكتور هو الراجل قالك انه موافق على اللى بيحصل فى فلسطين أو اللى بيحصل من بعض الضباط الظلمه ، كان من باب أولى تسأل الدكتور عن دورك الأخير فى عمارة يعقوبيان هل اللى أنت بتعمله ده حرام أم حلال أنت فعلا كده بتنشر حاجات فى المجتمع وبتجرأ كل واحد عنده شذوذ أنه يحس أنه مش لوحده فيتجرأ ، أتقوا الله شوية ، والله الكلام ده مش هجوم عليك لكن دفاع عن الدكتور على جمعه اللى كل فتاواه فى الحقيقة فتاوى عصرية ولا أنتو عايزين ترزيه تفصل الفتاوى اللى تعجبكوا ، وبرده بقولك ده مش هجوم عليك بالعكس أنا بحب أنصح أى حد وبقولك أنت واللى فى الفيلم أتقوا الله فى مصر ومتزعلش"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120220/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 15
subject = "توضيح لازم"
author = "خالد الصاوي"
posted = "2006-07-14"
text = "يا جماعة هو احنا ليه في اللحظة دي مش سامعين فتاوى تخص العلاقات باسرائيل التي تضرب الآن العزل في فلسطين ولبنان؟ ليه دلوقتي حالا مش سامعين فتاوى ضد التعامل مع الحكومة الأمريكية اللي بتقتل العزل والفقراء في العراق وأفغانستان؟ ليه مش سامعين فتاوى ضد تعذيب المواطن سواء في أقسام الأحياء الفقيرة أو في لاظوغلي؟ لييييييييييييه؟؟ حد يرد.. هي التماثيل قضية ملحة؟ وايه وجه الحاحها؟ فيه حد شاف حد واقف يعبد تمثال؟! ثم مين قال ان فهم الأحكام الشرعية حكر على قطاع بعينه؟ جابوها منين دي والاسلام بلا كهنوت؟ وايه وجه الحرمانية اللي شايفه الأخ في عملي؟ فتحت الطريق لمين وسهلت ايه؟ انا عرضت شخصية موجودة حوالينا وبينت اللي فيها وأنا أحترم الجماهير بأمييها ومتعلميها أثق في الناس اللي بيكافحوا كل يوم عشان يعيشوا بكرامة وأؤمن أنهم قادرون على التمييز ولا أدعي كالبعض أني أرقى منهم وعيا فأستحل الاستبداد بهم ولا أنصب نفسي وصيا على أحد.. من الواضح أن منا من يكرهون الاستبداد فقط حين يكون ضدهم ولكنهم يحبون ممارسته ضد الآخرين.. وهذه هي المصيبة في رأيي.<br />ومن هذا المنطلق كنت أول من أيد حركة أزهريون من أجل التغيير لأنهم شباب ذكروني بزمن كان فيه الأزهر شعلة للنضال ولسان حال للأمة وهو دوره الأصلي في رأيي المتواضع.. وشكرا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120220/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 16
subject = "العقلانية"
author = "محمد"
posted = "2006-07-20"
text = "بسم الله الرحمن الرحيم<br />العقلانية ياامة محمد ان هاجم المفتي الحكومة ازالوه من منصبه لان من الطبيعي من يهاجمك ستهاجمه فمن الافضل ان يبقي وينشرعلمه وافتاءاته قدر الستطاع وبالله عليكم كفانا جدل ونقد الغير ننظر لانفسنا وأعمالنا اين نحن من برالوالدين ومن صلة الرحم ومن حق الجار ومن حسن الخلق ومن حفظ القرأن وفهمه والاجتهاد في العمل به وهل نحن همنا هم الاخرة ام هم الدنيا لاأحد يجادل في المفتي ولا في الحكومة بل كل يجادل نفسه (( إن تنصروا الله ينصركم))"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120220/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 17
subject = "كفانا تبعية"
author = "نهي الرويني"
posted = "2006-09-07"
text = "رغم أن رأيى قد يكون متأخرا, لكني وددت أن أشارك به. لا أدري سبب كل هذا الهجوم علي الفنان خالد الصاوي لمجرد ابداء رأيه في فتوي دينية و كأنه فعل غير مقبول و \"ليس من اختصاصه\".ففي النهاية فان فضيلة المفتي هو بشر مثلنا جميعا و يحتمل رأيه الصواب أو الخطأ فكلامه ليس منزلا. و لا أعتقد أن هناك أي نص ديني يمنع أي شخص من غير علماء الدين أن يتعدي \"اختصاصه\" ليتفكر في الأمور الدينية و الحياتية بشكل عام؛ فالدين ليس حكرا علي المشايخ والعلماء.<br />أما بالنسبة لفتوي التماثيل, فالأستاذ خالد الصاوي لم يخطىء أو \"يكفر\" عندما طالب بالاهتمام بقضايا أكثر أهمية من تلك المسألة؛ فببساطة شديدة هل الشعب الذي يعيش نصفه أو أكثر تحت خط الفقر سيهتم بامتلاك التماثيل ليزين بيته؟!!!!!!!<br />في النهاية أتمني أن نكف عن تبعيتنا لرجال الدين, تلك التبعية التي تستغلها السلطةلتخدير الشعب باثارة الجدل علي قضايا ليست بذات أهمية كما أن الدين الحق لم يأمرنا بالانقياد الأعمي وراء الآخرين والغاء عقولناحتي لو كان هؤلاء هم رجال الدين أو رجال السلطة.<br />ملحوظة: أود أن أؤكد أننى أحترم ديني و تعاليمه كما أقدر علماء الدين و لكني أرفض فقط التعامل معهم كأن كلامهم منزل و غير قابل للنقاش كما سبق أن ذكرت."
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105204928/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 18
subject = "كلام ضمنى وكلام صريح"
author = "Mr. x"
posted = "2006-09-20"
text = "من خلال تجربتى الشخصية مع أعظم قضية خلافية عالمية شرعا وقانونا (القتل الرحيم), اكتشفت عظم عقل الدكتور على جمعةفمعظم مناظريه قد يكونوا على نفس درجته العلمية أو أعلى, ولكن ثقافته وعقله ليس واحدا مثلهم فلغاته التى سعى لاكتسابها يبدو أثرها فى فتاويه, وهو يربط الفتوى بالدليل سواء نص قرآنى أو حديث أو أثر بما يحملوه من معانى وتفاسير متعددة, يربط ذلك بالعصر الحالى وبلغة وأدوات التقدم والتنمية الحالية أو الجارية وبالعلم أو العلمنة"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105204928/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
