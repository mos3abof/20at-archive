[[comments]]
order = 0
subject = "هذا هو الجهل بعينه"
author = "عبدالله مفتاح"
posted = "2006-04-01"
text = "بدايه ارجو ان يسبق اسم جمعه فضيلة الشيخ او الدكتور وليس جمعه فهو ليس ممن يلعبون معنا تنس الطاوله او حتى (البلي)<br />ثانيا:ما هذه السطحيه التي اصابتنا ؟ ما الذي فعله الدكتور على جمعه حتى تثار كل هذه الضجه؟<br />هل اصبح لدينا 70 مليون مفتي وعالم؟<br />ان كل ما قاله الدكتور علي ان جمهور العلماء حرم التماثيل ويوجد راي في افتى بانها حلال.<br />هل اجرم الشيخ لمجرد انه قال الحقيقه؟<br />هل مطلوب منه ان يكذب او يخفي حقيقة حتى ينال رضانا؟<br />هل نطلب من الدكتور علي جمعة الاستقاله لانه قال الحقيقه؟<br />ان الطلب يجب ان يوجه لاولئك الذين يتحدثون عن الدين وهم لا يعرفون عدد ركعات سنه الفجر.<br />لقد نصب كل منا نفسه مفتيا ووضع كلام الدكتور علي جمعه في ميزان .<br />مع ان الدكتور لم يكفر احدا ولم يطالب بتفريق الزوجات عن ازواجهن (النحاتين)<br />بل ولم يطالب بتحطيم التماثيل فلم كل هذه الضجه المفتعله؟<br />اقول لكم ارفعوا ايديكم عن الدكتور علي جمعة دعوه يعمل ويجتهد<br />70 مليون مفتي ؟ اعان الله الدكتور علي جمعه"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120220/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "جرى ايه يا ناس حتى هنا كمان"
author = "مش مفروسة مقهورة"
posted = "2006-04-01"
text = "جرى ايه يا اخ مفتاح ايه الكلام الغريب اللي انت بتقوله ده مين قال ان فيه حملة ضد الراجل ، هو الواحد لو قال رايه في البلد دي يبقى ملحد وخارج عن الدين ، اتقي الله في دينك هو المفتى ده مش راجل دين برضه ولازم يتدخل ويطلع فتاوى تحرم السرقة والنهب والرشوة والديكتاتويرة اليي في البلد دي ولا هو مفتى عشان حجاب المذيعات وامكانية لبس البنطلون والتماثيل وبس هه<br />وبعدين يا اخي خالد عنده حق وكفاية ان واحد زيه ما شلشل ايده من الليلة يعني كان خاف على اكل عيشه وخلاه في التمثيل بدل مايطلعوا فتوى تحرمه ولا ماينفعش ماهي الدولة كلها بتمثل على بعض<br />ولما هو رجل كويس فين تعاليم الاسلام وحكمه في فساد الحاكم ولا يمكن هو مش عارف ان الحاكم فاسد عموما ربنا يهدي"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120220/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "بلا نيلة"
author = "مصري"
posted = "2006-04-01"
text = "جهل ايه اللي انت جاي تقول عليه بصراحة مش لاقي ابلغ من كلمات الخالد محمد سعد مع الاعتذار عن تغيير المرادفات ماهو لكل مقام مقال، هو الاخ محمد بيشتغل مع امن الدولة ولا حاجة هو الرجل كفر يعني عشان بيفكر في البلد وبعدين ويعني ايه مفتي ما بيفكرش في مصالح الناس كان فين المفتى لما الصحفيات اتضربوا وانتهكت اعراضهم ولا كان فين لما الاف ماتوا في العبارة بلا نيلة"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120220/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "حد جاب سيرة الالحاد او الكفر؟"
author = "عبدالله مفتاح"
posted = "2006-04-01"
text = "انا ضد تمويع الامور ما علاقة الدكتور علي جمعة بالفساد هل اصبح هو المسئول عن انتشار الفساد في جنبات اوساطنا؟<br />وهل نحن بحاجه الى فتوى تحرم السرقات والاختلاس والرشاوي؟<br />نقطة تانيه:في موضوع فساد الحاكم . هل سئل الرجل ولم يجب او اخفى شيئا من علمه؟<br />عند حدوث ذلك يكون من حقنا ان ننتقده اما ان ندخل فتواه الخاصه بالتماثيل في امور فساد حال الدوله؟<br />ما علاقة فتوى تحريم التماثيل بفساد حال البلد؟<br />لماذا الربط بين الفساد وفتوى الشيخ على جمعه؟<br />هل عندما لا نستطيع ان نهاجم المسؤول عن الفساد نهاجم علماء الدين؟<br />وبذلك نكون قد طبقنا المثل (مقدرش على الحمار...)<br />هل فتوى الدكتور علي جمعة بتحريم التماثيل هي سبب البلاء؟<br />ما ارفضه هو الربط غير المشروع بين امرين غير مترابطين"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120220/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

