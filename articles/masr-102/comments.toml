[[comments]]
order = 9
subject = "وين احنا ؟؟"
author = "يارا"
posted = "2006-05-04"
text = "السلام عليكم<br />اول شي بدي اعرف شو صاير ووين احنا عشان يكون مستوى الحوار متدني لهالدرجه ؟<br />بعيد انا مع او ضد او شو هو الموضوع<br />هاد مو شاغلني بقدر مستوى الحوار<br />المفروض انه احنا بنتناقش بقضية معينه<br />كل واحد يحكي فيه وجهة نظره وعلى الباقي يحترم وجهة النظر هاي حتى لو كان بيخالفها وفيه يعبر هو كمان عن وجهة نظره بشكل مقنع ومهذب مو بشتايم ....... الخ<br />هادا اول شي<br />تاني شي بالنسبة لموضوع الفتوى انا طول عمري بعرف انه التماثيل حرام والحكمة اللي كنت اعرفها بعيد عن عبادة الاصنام انه فيها مضاهاة لخلق الله يعني المفروض الله هو اللي بيخلق البشر والحيوانات ويشكلهم باشكال مختلفة ما فينا احنا البشر انه نحاول نشكل هيك تماثيل لانه الله بيوم القيامة راح يأمر الشخص اللي عمل تمثال او رسم صورة فيها روح او هيك شي راح يأمره بالنفخ بهالصورة وطبعا ما راح يقدر<br />كمان بالسعودية وكتير بالدول العربية سمعت انه حرام التصوير الفوتوغرافي او الفيديو الا للضرورة يعني لجواز السفر او الهوية ...... الخ ؟؟ غير هيك حرام<br />لكن سمعت من شي كم سنه فتوى للشيخ عبدالله المنيع عضو هيئة الافتاء بالسعودية ببرنامج تليفزيوني حكى انه التصوير الفوتوغرافي مش حرام لانه بيعكس الصورة اللي الله خلقها الحرمة المقصودة بالتصوير في احاديث الرسول عليه الصلاة والسلام هو مضاهاة خلق الله في رسم او نحت شي تمثال او صورة انسان .... الخ .....<br />والله اعلم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120220/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

