[[comments]]
order = 5
subject = "ماله الصاوي"
author = "بلال"
posted = "2006-04-02"
text = "لا اله الا الله ماله الصاوي الرجل بيقدم افكار محترمة انا شخصيا مبهور بنص اللعب في الدماغ نص قوي وبيقدم نقد لحياتنا ومشكلاتنا العربية، هو حد جاب سيرة المفتي بشر لا قدر الله المفتي مفتي الريس والحاشية واكيد يعني الرجل خايف على اكل عيشه، لكن ياجماعة الصاوي عنده حق لاننا فعلا محتاجين فتاوى تمس حياتنا ومشكلاتنا مش فتاوى تشغلنا عنهم وبعدين ايوة يا اخ مفتاح محتاجين فتاوى تحرم وتجرم الرشوة والسرقة في زمن اصبحت فيه الرشوة هي الاساس والمحترم هو الاستثناء الوحيد ولو مش واخدبالك اقرا شوية في موضوع صفقة عمر افندي او بيع بنك مصر والقاهرة وبلاش افترى"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120220/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

