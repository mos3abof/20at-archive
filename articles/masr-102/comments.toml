[[comments]]
order = 12
subject = "واشمعنى حكم التماثيل .. الإسلام فيه حاجات كتير للتعليق والاستخفاف"
author = "محمد"
posted = "2006-06-01"
text = "الدوران حول حجر \"الكعبة\": تشبه بالوثنية (عكس قضية التماثيل)<br />منع الزواج بأكثر من أربعة نساء للرجل<br />الإجبار على دفع زكاة المال والفطر<br />توزيعات الميراث في الإسلام<br />وخمسة الاف قضية أخرى ...<br />اشمعنى دي بس اللي ماسكينها تشكيك واستهزاء!!<br />أليس التشكيك والاستهزاء من أحكام الشرع - لأن فضيلة المفتى لا \"يفتي\" من مخه..ولكن من أحاديث صحيحة هي الشرع - باسم التمدن والحضارة هو الكفر البواح؟<br />كفر<br />عارفين يعني ايه: الاستهزاء بأحكام الشرع كفر؟<br />خلوا بالكو، وقولوا لغيركو"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120220/http://masr.20at.com:80/article.php?sid=102&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

