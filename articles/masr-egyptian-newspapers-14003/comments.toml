author = "مهندس"
posted = "2009-11-11"
text = "زمان فى كلية الهندسة كنا بندرس مادة اسمها الديناميكا الحرارية<br />والحقيقة انة لن يحدث اى شىء من كل تلك الخيالات ولن تغرق الدلتا ولن يرتفع البحر لان كل شىء كما ذكر فى القران خلق بقدر<br />فلو ذاب الجليد اين تذهب المياة الباردة الناتجة من الذوبان - ستختلط مع المياة الساخنة فى المحيطات عند خط الاستواء وتبرد المياة الساخنة وتنكمش فى حالة برودها ويقل حجمها بقدر الحرارة التى فقدتها<br />وستظل الامور كما هى علية<br />فالطاقة لا تفنى ولا تستحدث ولا تخلق من العدم<br />القران واضح<br />ان كل شىء خلقناة بقدر<br />كل شىء محسوب بقدرة الخالق<br />والعملية كلها دعاية غربية للفزع علشان شركاتها تشتغل وتاخد مقاولات وتقبض فلوس<br />هذا رايى الخاص وقد يكون خطا"
archived = "2009-11-12"
