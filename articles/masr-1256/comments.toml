[[comments]]
order = 3
subject = "فضايحنا بقت عالميه"
author = "المصرى الحزين"
posted = "2006-12-09"
text = "اناشد كل الدول والمنظمات والمؤسسات التى تقوم بارسال المنح والمعونات المقدمه للسراب المسمى \"العمل الاجتماعى والانسانى فى مصر\" بعد الفضائح المدوية والجرائم البشعة والمخزية التي حدثت مؤخراً من قتل واغتصاب الاطفال والمراهقين على يد عصابات منظمه، بل وتتحدث الأرقام إن عدد المشردين تجاوز المليونين من صغار السن بينما الجمعيات الخيرية تنهال عليها المعونات بالملايين فى الداخل ومن الخارج، ولايدرى احد اين تذهب؟، والمسؤولون مشغولون بالاجتماعات والندوات فى فنادق الخمس نجوم بحجة البحث عن حلول ! بينما الضحايا يلقى بهم من فوق أسطح القطارات.<br />محمد زين - القاهرة<br />نقلا عن صفحة اراء حره بموقع bbc ولا تعليق"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065122/http://masr.20at.com:80/article.php?sid=1256"

