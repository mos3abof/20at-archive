subject = "بيركب تاكسي"
author = "مصطفى هاشم"
posted = "2006-12-07"
text = "بصراحة أسامة الباز كان متواضع جدا معي عندما تكلمت معه وبعد اما خلص محاضرته لم يوصله أحد مع ان رئيس الجامعة ونائبه وستشاره معهم سيارات فارهة<br />قلت لواحد صاحبي انه ركب تاكسي فقال لي ان واحد صاحبي رآه مرة في النترو وقال له أسامة الباز لو أردت أي شيء تعال لي مكتبي"
archived = "2006-12-09"
capture_url = "https://web.archive.org/web/20061209002759/http://masr.20at.com:80/article.php?sid=1256"

