subject = "اللهم إجعله هجص"
author = "فتحي"
posted = "2006-12-11"
text = "الدكتور أسامة الباز مش هو مستشار السيد الرئيس طيب ياريت سيادته_الأولاني_ ينصح سيادته التاني باللي بيقوله علشان نصدقه وطبعا مش حنصدقه إلا لما سيادته التاني يبين كرامة في أي حاجة..وصدق الفاروق عمر رضي الله عنه حين قال لا يعجبكم من الرجل طنطنته..يعني اللي كلامه حلو لكن فعله زي مانتوا عارفين ..مش كده ولا إيه؟؟!"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065122/http://masr.20at.com:80/article.php?sid=1256"

[[comments]]
order = 6
subject = "تعليق"
author = "الدشم"
posted = "2006-12-12"
text = "انما انتم حاقدين تكرهون ان تعرفو ان فيه شخصيات محترمه فى الحكومه و عمالين تطلعو اشاعات من غير اساس و ده حرامى و ده شاذ شاذ امال انتو تبقو ايه كل افكاركم واطيه و كلامكم كله جنس ووساخه وافكاركو كلها خارجه من (لمؤاخذه)<br />مهم اصل اللى تفكيره كده بيبص للناس كلها على انها كده.<br />نعم للتوريث ولاستكمال المسيره"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065122/http://masr.20at.com:80/article.php?sid=1256"

