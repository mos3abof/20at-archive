text = "أيوه يا أخ مصطفى هاشم .. وبعدين ؟؟؟ إيه يعني اللي حصل ؟؟؟ هو كان جاي يقرا نشرة أخبار القناه التامنه تشانل تو يعني ولا إيه ؟؟؟ بصراحه يا درش برغم اجتهادك إلا أنه موضوع لا يستحق أن تتعب فيه ولا له .. عموما كتر خيرك وربنا يوفقك ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
