text = "انا بشوف ان السيدات بتسيب العربيه المخصصه ليهم الفاضيه وبتقعد في العربيات التانيه ومرحرحه ومشلتتته كمان ومع ان<br />في عربياتهم المزعومه اماكن للقعاد الا ان كل واحده كسلانه تمشي علشان تركب العربيه المخصصه ليهم<br />جتكم الهم مليتم البلد"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725062833/http://www.20at.com:80/masr/t7kyk/8770.html"

[[comments]]
order = 1
subject = ""
author = "محتار"
posted = "2008-04-14"
text = "الصورة بتقول ان فية مترو حديث ووسيلة نقل حضارية والبيوت اللى وراة فى الصورة ايلة الى السقوط ومن العصر المملوكى ايام طومان باى والسلطان برقوق وسيدى ابو نبوت<br />واكيد الناس اللى عايشة فى بيوت زى دى عايشة على الكفاف<br />مطلوب مترو - اى نعم - ولكن سياسة افقار الشعب المصرى الى حد العوز والفاقة كما ترى فى الصورة<br />سيدى المحترم<br />ما اراة من الصورة انة بعد استسلام السادات فى كامب دافيد وذهابة حاملا كفنة على كتفة الى خصمة فى تل ابيب<br />تم قتلة<br />وتولية بريمر مصرى لينفذ خطة تصفية وتدمير مصر اقتصاديا وعسكريا والغاء الجيش المصرى وتدمير التعليم والصحة تماما كما حدث فى العراق بواسطة بريمر الامريكى<br />نعم كانت مصر الجائزة الكبرى كما صرحوا<br />شكرا بريمر العراق<br />شكرا بريمر المصرى"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725062833/http://www.20at.com:80/masr/t7kyk/8770.html"

[[comments]]
order = 2
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-05-09"
text = "طبعا يا مدام حقك بتطالبى بية و ناسية ان معظم السيدات و الانسات بيتعمدوا يسيبوا عربيات السيدات المخصصة ليهم و يركبوا العربات الاخرى طبعا مش بحثا عن تحرش و لكنها علشان عارفة انها لو ركبت عربية السيدات لما تتشل و رجليها تتقطع مش هاتلاقى واحده تقوم تقعدها لكن فى العربات الاخرى تروح واقفة و مستلوحة قدام شاب و تعيش بقى الدور و تبص له بصات كانها بتقولة كده برضه هاتسيب واحدة تقف و انت قاعد دى اخلاق و لو ما استجابش تبدا فى داء الخدامين البرطمة يعنى<br />يا ريت نخصص لكم نص المترو بس انتوا كمان ترحمونا و ماتركبوش معانا و لا هو لو الراجل ركب عربيات السيدات تفتكروا التحرش و معرفش اية اشمعنى مش بتفتكروه و انتوا راكبين العربيات التانية ؟؟ و لا ده نظام استعباط"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725062833/http://www.20at.com:80/masr/t7kyk/8770.html"

[[comments]]
order = 3
subject = ""
author = "م/محمد احمد عبد القوى"
posted = "2008-05-19"
text = "معلش يا غاده انتى متحيزه جدا لجنسك وشكللك مابتركبيش المترو اساسا احنا فى العربيات بتاعتنا يعنى الرجاله بلاقى ستات كتيره فيها مع ان عربيتاهم بتكون رايقه واحنا زحمه وبنقملهم ونقعدهم عشان البهدله اللى فى العربيات مع ان قانونى طالما لهم عربيات مخصصه مايركبوش عربات الرجاله والا كان العكس صحيح ثم انتم يعنى شايفيين الرجاله دول ايه مجموعه تيوس حيوانتات مفيش حتى ادميه لا يا اخت غاده احنا فى مصر مش فى امريكا ولا اوربا لسه فيه القيم الدينيه والجدعنه المصريه بس انتى قولى لبنات جنسك هم اللى يلتزموا واسالك سؤال<br />لو قالولك رقاصه ركبت عربه المترو والشؤال هوه ايه اللى انتى تتوقعيه وليس ببعيد عنا الراقصه مروه اللى مسمينها مطربه اللى الشباب قربو يفترؤسوها فى حفله وعلى كانت فرحانه وبترد على الاتهامات بكل بحاجه وتقولك دول معجبين<br />متزعليش من يا اخت غاده بس هى ده الحقيقه المره اللى احنا نسينها او مطنشينها"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725062833/http://www.20at.com:80/masr/t7kyk/8770.html"

[[comments]]
