subject = ""
author = "نجلاء"
posted = "2009-06-12"
text = "أنا شخصيا باركب العربية المختلطة لان عربية السيدات بقت غير محتملة كل الستات بترفي وكل واحدة بتفرض رايها بصوت على ودي لابسة كذا وعاملة كذا وكذا وغيبة ونميمة وكل حاجة ده غير الروائح اللي تقلب البطن وشفت بعيني شاب وبنت ركبوا عربة السيدات علشان يعملوا حاجات استحي اني اوصفها لانهم عارفين ان محدش حيكلمهم بعكس العربة المختلطة.<br />بجد عربة السيدات بقت حاجة تقرف."
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725062833/http://www.20at.com:80/masr/t7kyk/8770.html"
