text = "اذن الكمونى هو القاتل<br />سلمنا بذلك<br />يبقى موضوع الثأر للبنت المغتصبة لم يؤخذ بعد واهلها ينتظرون<br />قد يأخذ اهلها الثار بعد اسبوع او شهر او سنة<br />اذن بقى الثأر<br />انتظروا الثأر"
