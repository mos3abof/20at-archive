author = "محسن الشرقاوى"
posted = "2010-01-17"
text = "الموضوع خلاص منتهى<br />الحكومة قبضت على ثلاثة من البلطجية صنيعة الحزب الوطنى ويد الحكومة فى تزوير الانتخابات وضرب المعارضين<br />الحكومة قررت تضحى ب 3 من رجالتها علشان توقف الشوشرة الشغالة حاليا<br />واحالتهم الى محكمة طوارىء<br />وسيحكم عليهم بالاعدام فى ظرف اسبوعين<br />وسيصدق رئيس الجمهورية على الحكم<br />وسيخرج بيان صحفى بانة تم اعدام المجرمين الثلاثة فجر احد الايام ويرسل منة صورة للسفارة الامريكية<br />وخلاص<br />الموضوع منتهى حسب السيناريو بتاع خميس فجلة مخرج الداخلية"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127060322/http://www.20at.com:80/masr/hot-topics/14788-2010-01-07-15-56-29.html"
