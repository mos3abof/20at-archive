author = "الاخ نجيب جبريل"
posted = "2010-01-14"
text = "محامى نصرانى مركب فى زورة زمارة بتصرخ على الفاضى والمليان كلمة حقوق الاقباط - الاخ المحامى بيطالب بتحقيق دولى فى حادثة نجع حمادى<br />فين حقوق المسلمين<br />وفين بتوع امن الدولة لما سايبين واحد بيصرخ ويطالب بتحقيق دولى<br />تحقيق دولى فى اية<br />الولد دة مفروض يتمسك ويتنفخ<br />والا متدلع<br />وكل ما بنت [ *** ] تهرب مع ولد مسلم يقول خطف البنات<br />ما تربوا بناتكم يا كلاب علشان ما يهربوش مع الصبيان وبعدين تقولوا خطف البنات والقاصرات والاسلمة والقرف اللى بتقولوة<br />كل اب مسيحى مش عارف يربى بنتة وسايب بنتة سارحة على حل شعرها وبعدين يقول يا شرطة ويا امن رجعوا بنتى<br />العالم دى لازم نكلمها بدون خجل وبوش مكشوف علشان يتلموا بقى<br />لموا بناتكم وعلموهم الادب والحياء وبلاش صياعة ومسخرة وبطلوا كلمة حكاية بنت مخطوفة دى - هو الولد كان دخل البيت وخطفها من على السرير من حضن امها والا هى راحت لة برجليها<br />اقلية كلها قرف"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127060322/http://www.20at.com:80/masr/hot-topics/14788-2010-01-07-15-56-29.html"

