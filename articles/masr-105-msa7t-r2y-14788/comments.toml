author = "كرومبو"
posted = "2010-01-13"
text = "الحقيقة يا جماعة انا جالي تليفون من البابا كريلس بيقولي تعالى الحقني يا كرومبو فيه واحد ضرب الرصاص عليا<br />الحقني يا كرومبو<br />انا انتقلت فورا الى ناج حمادي وشوفت مكان الحادث ولقيت تلاته في مكان الحادث الاول الانبا صليبا سكرتير البابا كريلس ولما سألته قالي والله يا كرومبو انا بعد ما صليت العشا دخلت انام على طول وبعدين سمعت الرصاص بيضرب فخرجت بس انا ما شفتش حد خالص<br />ولما سألت الشخص الثاني مسيحا افندي خدام الكنيسه قالي والله يا كرومبو انا حضرت العشا للبابا كيرلس وبعد ما اكل قالي روح انت نام بقا وصحيت على صوت الرصاص وانا ما شفتش حاجه يا كرومبو<br />ولما سألت حارس الكنيسه ابو جورج قالي انا معرفش حاجه يا كرومبو مفيش غير عدلي ابادير بتاع سويسرا كلمني امبارح وقالي سلملي على البابا كريلس وبس كل دا اللي حصل<br />ـــــــــــــــ ـــــــــــــ<br />انا عرفت مين اللي ضرب الرصاص على كيرلس لو انت كمان عرفت اتصل بالسفارة الاسرائيلية تكسب خمس تلاف جنيه"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127060322/http://www.20at.com:80/masr/hot-topics/14788-2010-01-07-15-56-29.html"

