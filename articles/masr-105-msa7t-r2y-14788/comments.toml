[[comments]]
order = 18
subject = ""
author = "والبقية ستأتى"
posted = "2010-01-13"
text = "اذا كان مرتكب جريمة القتل بلطجى يفرض اتاوات على الناس كما تروى حكايات الشرطة وانا غير مصدق لاى منها<br />البلطجى والمجرم ليس متعصب لاى دين ولا لة هدف دينى ولا سياسى بل كل همة الفلوس<br />فهل دفع احدهم لة واستأجرة ليقتل ؟<br />ربما — ولكن من هو ؟<br />هل القاتل تنظيم مخابراتى اجنبى لاشعال فتنة ما - واختفى كما اختفى قاتل السياح فى الاقصر من قبل<br />ربما<br />هل جاءت الشرطة بالكمونى رجلهم ليشيل الليلة ويضحوا بة ليشيل القضية ويذبح كخروف العيد !!<br />ربما<br />طالما نظام شرطة طريقتة فى التحقيق التعذيب حتى الاعتراف قسرا فالموضوع غامض<br />رؤوس امنية كبيرة خافت على كراسيها فجاءت بالكمونى ليشيل القضية<br />تلك افكار الوسواس الخناس تلعب فى صدرى<br />ولربما نكون مخطئين<br />وعموما قتل النفس جريمة رهيبة فى الاسلام<br />( ومن قتل نفسا فكانما قتل الناس جميعا ) قال القران نفسا ولم يقل مسلما<br />قتل النفس من المحرمات<br />ايا كانت النفس"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127060322/http://www.20at.com:80/masr/hot-topics/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 19
