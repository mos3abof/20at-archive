author = "رد على كرومبو الاصلي"
posted = "2010-01-17"
text = "انا كرومبو الاولاني<br />ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />انت زعلت علشان خاطر قلت الحقيقة قلت ان العمليات دي من تدبير عدلي ابادير او اقباط المهجر عموما<br />انا اقولك ليه<br />اولا اقباط المهجر سافروا وهاجروا خلاص واخدوا جنسيات الدول اللي راحولها ولا يهمهم مصر في مصر<br />لكن الذي يعنعن جمع الاموال<br />يهمهم حساباتهم في البنوك<br />وهما هناك ششغالين جمع تبرعات من المسيحيين الغربيين<br />ولازم يحصل كده كل شوية علشان خاطر على حس كده التبرعات تزيد وحساباتهم في البنوك تبقى بالملايين<br />شوف يا ابني<br />احسن حاجه تكسب اليومين دول هي جمع التبرعات"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127060322/http://www.20at.com:80/masr/hot-topics/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 25
subject = ""
author = "محكمة امن دولة لماذ"
posted = "2010-01-17"
text = "لماذا احالت الحكومة القضية الى محكمة طوارىء او امن دولة ؟ ولم تجعل المحكمة محكمة جنايات عادية<br />المتهمون بلطجية وليسوا اعضاء فى تنظيم او جماعة ارهابية كجماعة الجهاد او الاخوان مثلا<br />الاخبار تناقلت ان الاعضاء فى مجلس الشعب صرحوا ان الانبا بتاع نجع حمادى كان بيدفع اتاوات للكمونى خوفا على نفسة وكان بيدفع للقاتل ليؤمن الصيدليات التى يملكها مسيحيون<br />وانهم كانوا يدفعون الاتاوات للبلطجى بدون ان يشتكوا للشرطة او الحكومة<br />وقال نيافة الانبا ان الشباب المسيحى خواف وجبان وبيدفع الاتاوات للبلطجية<br />طيب محكمة امن دولة لية - علشان نخبى اى اعترافات او اى اشياء فاضحة امام الرأى العام - عايزين يخبوا اية بالضبط<br />ان البلطجى المتهم هو صنيعة الحكومة وانة اتفق معاهم على تسليم نفسة مثلا مقابل اية ؟<br />فى الصعيد اى مجرم يستطيع ان يختفى فى الجبل سنين دون ان تمسكة الحكومة<br />اية الهمة العالية قوى دى والحكومة تمسكة تانى يوم الجريمة<br />الموضوع فية حاجات كتير مش مفهومة"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127060322/http://www.20at.com:80/masr/hot-topics/14788-2010-01-07-15-56-29.html"

