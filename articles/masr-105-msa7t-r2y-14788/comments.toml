[[comments]]
order = 10
subject = ""
author = "اخرة تدليع الحكومة"
posted = "2010-01-08"
text = "اولا الحكومة بتدلع اقلية العظمة الزرقاء تدليع جامد جدا ودايما بتجيب الحق على المسلم ومش عارف لية<br />يعنى انا مثلا عندى عقار واتى واحد مسيحى لتأجيرة بمبلغ كويس وبصراحة وافقت - فأتى الى الجيران والاقارب ليقولوا لى انت مجنون - ازاى تأجر لواحد مسيحى<br />فقلت لهم وفيها اية - ماهو مصرى زينا<br />فقالوا لى - لأ يا ناصح مش مصرى زينا - دى عند اى خلاف معاة هيروح يشتكى لامن الدولة بتهمة الاضطهاد - انت عايز كل شوية والتانى تشرف عند بتوع امن الدولة وسين وجيم<br />فصرفت نظر وقلت لة سكتك خضراء ابعد عنى<br />الدولة بتدلعهم جامد<br />واى كلب فيهم بيروح امن الدولة كلهم بيقفوا لة على رجل واحدة<br />لو فية حزم كانت المخابرات بتاع امن الدولة جابت النشطاء بتوع اقباط المهجر فى صناديق ونفخوهم هنا فى مصر<br />انما زيادة تدليعهم هتوقع الدنيا فوق راس ابوهم لان الناس قرفانة منهم"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 11
subject = ""
author = "هانى"
posted = "2010-01-08"
text = "اولا اللى بيغلط في قداسة البابا شنودة بركته هتحولك لقرد عشان هو سيدك ياكلب<br />وثانيا ياللى بتقولو ان طفلة واحد اغتصبها انتو اصلا بهايم<br />لان دى واحدة مش متربية ولا اهلها شافوها عشان هى عجلة كبيرة شابه وماشيه مع ولد مسيحى وراحت معاه شقته بمزاجها ومغصبهاش علي حاجة واهل الكلبة دى عملو عمايل كلاب زيهم وقتلو ابوه عايزين ايه تانى مننا دانتو حتى مش مستنين حكومة تعمل اومال احنا اللى ولا حد ساندنا ولا الحكومة الزبالة دى مش واخدلنا حقنا نعمل ايه؟<br />قولولنا نعمل ايه<br />احنا مستنين تعزيات السما لينا ومش عايزين منكم حاجة"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 12
subject = ""
author = "القاتل معروف"
posted = "2010-01-11"
text = "من لة مصلحة فى عمل انفجار واستغلالة عالميا<br />طبعا اقباط المهجر المتعاونين مع اسرائيل<br />وانا لا اسبعد ابدا ان تكون احدى المنظمات القبطية هى التى دبرت ذلك لتهييج الرأى العام العالمى - فطريقة القتل تدل على شغل عصابات محترفة وليس شغل صعايدة بياخدوا تار<br />اسلوب الثأر يختلف عن ذلك<br />دى ترتيب مخابرات اسرائلية واقباط المهجر"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 13
subject = ""
author = "الى المعلق رقم 11"
posted = "2010-01-11"
text = "تكملة تعليق الاخ المعلق رقم 11 (الى هاني)<br />دا ربنا سبحانه وتعالى قالهم نفس الكلام على سيدنا عيسى وستنا مريم<br />قال لهم انهم كانوا ياكلون الطعام<br />واللي بياكل الطعام لازم يروح الحمام<br />يبقى ازاي بقدرة قادر خلوهم الهه وعبودوهم من دون الله"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 14
subject = ""
author = "التكفيريون المسيحيو"
posted = "2010-01-12"
text = "التكفيريون المسيحيون<br />اذهب الى اشد المسلمين تعصبا - مسلم راجع من جواتيمالا مثلا - واسألة ما راية فى السيدة العذراء مريم والمسيح<br />سيقول لك كلاما طيبا جدا<br />ثم اذهب الى اى قسيس مسيحى او قبطى متسامحا جدا ومنفتح ومثقف واسالة عن النبى محمد والقران<br />سيقول لك محمد من الانبياء الكذبة والقران تاليف واخراج مش عارف مين<br />انهم يكفروننا<br />انهم لا يعترفون لا بمحمد ولا بالقران<br />فما هو رد الفعل ؟<br />يقولون عنا متعصبون وهم اشد الناس ظلاما وجهلا<br />يقولون لك انهم لا يحبوننا ولكن هل هم يحبوننا"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 15
subject = ""
author = "المحافظ القبطى"
posted = "2010-01-12"
text = "كلام المحافظ القبطى لقنا قال<br />ان المسيحيين استفذوا المسلمين وبشدة وذلك من خلال<br />1 - ان الشباب المسيحى فى نجع حمادى يتبادل صور على الموبيلات عن محجبات فى وضع جنسى وصورهم عرايا<br />2 - ان صاحب احد دكاكين الملابس امسك بفتاة محجبة او منقبة ونزع النقاب من على وجهها بالقوة بحجة انها سرقت من دكانة شيئا وتبين انها لم تسرق شيئا<br />3 - اغتصاب شاب مسيحى لطفلة عمرها 12 سنة<br />كل دة استفزاز شديد جدا لمشاعر ناس صعايدة دمهم حامى لازم يترد علية وبعنف كمان<br />بصراحة العيال دول كانوا زودوها حبتين فى نجع حمادى وكان لازم واحد يوقفهم عند حدهم اذا الحكومة ما عملتش حاجة"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

