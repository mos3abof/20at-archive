text = "ستتطور الامور وسيتم فرض الحل العراقى ايام الاحتلال الامريكى للعراق<br />الحل العراقى بسيط جدا<br />تهجير تلك الاقلية الى امريكا واستراليا باسرع ما يمكن"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 8
subject = ""
author = "الى هانى"
posted = "2010-01-08"
text = "بركة شنودة هتحولة الى قرد<br />هو اسمة شنودة المبروك وبيسخط الناس قرود - انت اتعلمت فى انها شفخانة ( شفخانة مستشفى علاج الحمير )<br />انت يا ابنى عايش زى الحمار لما تعتقد فى بركات انسان زيك كل يوم بيروح الحمام يعمل أأح ويشخ على نفسة<br />شنودة يزيد عن اى واحد اية<br />بركة اية وجهل اية وتخريف اية<br />هو كل المسيحيين عقولهم بقرى زيك كدة وبيعتقدوا ان شنودة يقدر يسخط الناس قرود<br />يا اخى قحة<br />دى انا كنت فاكر انكم بنى ادمين طلعتوا ولاد كلب تستحقون الدبح<br />اتفو على امكم وعلى المبروك بتاعكم"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

