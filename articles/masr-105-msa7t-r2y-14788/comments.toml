author = "القتل"
posted = "2010-01-07"
text = "كاَن رسَوُل اللَّه صلََّى اللَّه علَيَهْ وسَلََّم يحُدَِّثنُاَ أنََّ<br />بيَنْ يدَيَ السَّاعةَ الهْرَجْ . قيِل : ومَاَ الهْرَجْ ؟ قاَل<br />الكْذَبِ واَلقْتَلْ . قاَلوُا : أكَثْرَ ممَِّا نقَتْلُ الْآن ؟ قاَل :<br />إنَِّه ليَسْ بقِتَلْكِمُ الكْفَُّار ، ولَكَنَِّه قتَلْ بعَضْكِمُ بعَضْاً<br />، حتََّى يقَتْلُ الرَّجلُ جاَرهَ ، ويَقَتْلُ أخَاَه ، ويَقَتْلُ عمََّه ،<br />ويَقَتْلُ ابنْ عمَِّه . قاَلوُا : سبُحْاَن اللَّه ! ومَعَنَاَ عقُوُلنُاَ ؟<br />قال : لَا ، إلَِّا أنََّه ينَزْعِ عقُوُل أهَلْ ذاَك الزَّماَن ، حتََّى"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 1
subject = ""
author = "شنوده هو السبب"
posted = "2010-01-07"
text = "البابا شنوده كان ضابط في الجيش وبقدره قادر بصينا لقيناه رئيس الكنيسة المصرية طبعا دا شغل اسرائيل<br />عمركم سمعتم قبل ما شنوده يجي ان فيه فتنة طائفية في مصر<br />من ايام عمرو بن العاص الى ان جاء الشيطان شنوده<br />اتحدى اذا كان حد يقدر يثبت ان حصلت فتنة طائفية في مصر او مسلم قتل مسيحي او مسيحي اغتصب مسلمه<br />1400 سنه المسيحيين عايشين في سلام الى ان جاء الشيطان شنوده<br />والموضوع كله اصله لا يتعدى 6%<br />عدد المسيحيين في مصر 6%<br />يعني الجنازه حاره والميت كلب"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 2
subject = ""
author = "مسلمة حزينة لما حدث"
posted = "2010-01-07"
text = "تعازي الحارة الي كل اخواتي المسيحين<br />هذا عمل خسيس واجرام واتمني من اللة ان ينال مرتكبوا هذا الحادث عقابهم بالقصاص منهم في ميدان عام واللة العظيم انا في حالة اكتئاب منذ ان سمعت الخبر ولن ارتاح نفسيا حتي يتم القبض علي مرتكبي هذا الحادث"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 3
subject = ""
author = "من ابتدأ !!! ؟"
posted = "2010-01-07"
text = "يعنى شاب مسيحى يغتصب بنت سنها 12 سنة يعنى طفلة<br />يبقى الرد اية<br />واحنا فى الصعيد<br />فية حيوانية اكتر من اغتصاب طفلة<br />طبعا الحكومة لم تفعل شيئا<br />فلعلع الرصاص واشتغل الكلاشينكوف للانتقام<br />لان كل صعيدى عندة سلاح فى بيتة وشوالين رصاص حى<br />يبقى مين اللى ابتدأ فى قلة الادب<br />وبعد ذلك يبكون ويقولوا اضطهاد وفتنة طائفية<br />الناس تمشى صح الاول<br />والحكومة تصحى من النوم والعدل يبقى سريع وفى نفس الاسبوع يصدر حكم مثل كل الدول"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 4
subject = ""
author = "جرائم الشرف"
posted = "2010-01-07"
text = "هناك قصة شاب مسيحى اغتصب فتاة قاصر مسلمة فى وسط الزراعات - تعرفى اغتصاب فى الصعيد معناها اية - معناها عار كبير يلاحق العائلة فلا احد من ابناء العائلات الاخرى يتزوج من بناتهم ولا الاولاد يتزوجون من عائلات اخرى<br />عار فوق راس تلك العائلة لا يمحوة غير الدم - تلك تقاليد الصعيد القديمة - لو كان اتلقضاء حكم على الشاب المغتصب حكما عادلا وصارما كانت انتهت المسائل<br />ولكن الصعايدة لا ينسون التار ولو بعد ميت سنة<br />فالعملية ليست فتنة طائفية ولكن عملية اخد بالتار"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 5
subject = ""
author = "جيمي"
posted = "2010-01-07"
text = "الفتنة منظمة بطريقة عشوائية<br />يعنى أنا فى رأيي أن الفتنة الموجودة حالياً سببها الوحيد هو الأعلام لأنه بيقدم المعلومة من غير تفاصيل فبالتالى مشاعر الأنتقام بتسيطر على الطرف اللى مات له واحد وهكذا ..<br />أهو ده إللي أنا بسميه ( الرصد الأسود) ده عمره ما يكون عمل إعلامي أبداً أبداً أبداً .<br />منهم لله اللي بيتاجروا بالوطن .. منهم لله اللي بيتاجروا بأدواتهم ووسائلهم"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
order = 6
subject = ""
author = "الشحن النفسى العدائ"
posted = "2010-01-07"
text = "امس نشرت وكالات الانباء خبرا عن تدخل اسرائيل فى اعمال منظمة فى امريكا اسمها اقباط المهجر<br />ولو دخلتى يا ست دعاء الى تلك المواقع سوف تقرئى سباب وشتائم فى المسلمين والاسلام<br />سوف تقرئى احقاد مدفونة غريبة جدا<br />حينما يقرأها مسلم يشعر بالغضب والضيق ويشعر ان هؤلاء ليسوا مصريين بل اعداء<br />ان اسرائيل توجههم لعمل فتنة<br />وتلك مصيبة<br />هناك من يتربص بهذا الوطن لعمل فتنة ما<br />ونسى الجميع ما حدث للمسيحيين فى العراق تحت احتلال امريكا وفى وجودها<br />على هؤلاء المشحونين نفسيا ان يعيدوزا حساباتهم فهم اقلية يسهل التخلص منها وعمل مذابح رهيبة لهم ولن تنفعهم امريكا ولا اسرائيل<br />على العقلاء منهم ان يقولوا لهم كفى<br />وعلى الحكومة والقضاء ان يكون سريع ويحكم على المتهم فورا"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112141928/http://www.20at.com:80/masr/105-msa7t-r2y/14788-2010-01-07-15-56-29.html"

[[comments]]
