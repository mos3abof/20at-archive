text = "الصورة اللى فوق المقال فيها صليب اكبر من الهلال<br />ماشى<br />ولكن نسبة الصليب 4 % من السكان و 96% من السكان مسلمين<br />احنا دولة مسلمة ولو عايزين ترسموا صليب يبقى حاجة صغيرة كدة لا ترى باتلعين<br />انما اية القرف دة على الصبح واية الصلبان اللى وشنا - هى ناقصة فقر<br />شيلوا الصليب من الصورة"
