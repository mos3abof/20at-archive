[[comments]]
order = 9
subject = "حيوان (مروان الحصاوي المصري)"
author = "عاشق زنوبة"
posted = "2006-10-26"
text = "مروان المصري إبن الهرمة القرشانة الحيوان فاكر مليون جنيه حاجة كبيرة قوي. معذور جاهل وجعان ويمكن مسطول من إستنشاق عادم الشكمان. فوق يا حمار وصحصح فيه ناس كثيرة بتلعب بأضعاف المبلغ ده قمار كل ليلة في الهيلتون والشيراتون، ومصريين مش خواجات من حيتان النهب بتوع ريسك المبارك.<br />قول يابغل إسترالي لمين بتروح التبرعات السخية دي؟ وبأمارة إيه؟ جالك وابور زلط يحضنك في تالت أيام العيد..حيوان."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117141250/http://masr.20at.com:80/article.php?sid=1091"

