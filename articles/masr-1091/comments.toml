[[comments]]
order = 3
subject = "عيد إيه يا مسلمين؟"
author = "غلبان مقهور"
posted = "2006-10-24"
text = "عيد إيه اللي في أول يوم فيه بيذبح إخوانا في فلسطين والعراق وأفغانستان، وإحنا هنا همنا الكعك والكسوة الجديدة. عيد إيه والمتسلط على المحروسة مش مكفيه نهبة وبعيه للأرض والعرض، لا فاتح معتقلات للسي أي إيه عندنا، بالزمة إحنا بشر بنحس؟<br />عيد بأية حال عدت يا عيد *** بما مضى أم بأمر فيك تجديد<br />أما الأحبة فالبيداء دونهم *** فليت دونك بيدا دونها بيد<br />لولا العلا لم تجب بي ما أجوب بها *** وجناء حرف ولا جرداء قيدود<br />وكان أطيب من سيفي مضاجعة *** أشباه رونقه الغيد الأماليد<br />لم يترك الدهر من قلبي ولا كبدي *** شيئا تتيمه عين ولا جيد<br />يا ساقيي أخمر في كؤوسكما *** أم في كؤوسكما هم وتسهيد<br />أصخرة أنا مالي لا تحركني *** هذي المدام ولا هذي الأغاريد<br />إذا أردت كميت اللون صافية *** وجدتها وحبيب النفس مفقود<br />ماذا لقيت من الدنيا وأعجبها *** أني بما أنا باك منه محسود<br />أمسيت أروح مثر خازنا ويدا *** أنا الغني وأموالي المواعيد<br />إني نزلت بكذابين ضيفهم *** عن القرى وعن الترحال محدود<br />جود الرجال من الأيدي وجودهم *** من اللسان فلا كانوا ولا الجود<br />ما يقبض الموت نفسا من نفوسهم *** إلا وفي يده من نتنها عود<br />من كل رخو وكاء البطن منفتق *** لا في الرجال ولا النسوان معدود<br />أكلما اغتال عبد السوء سيده *** أو خانه فله في مصر تمهيد<br />صار الخصي إمام الآبقين بها *** فالحر مستعبد والعبد معبود<br />نامت نواطير مصر عن ثعالبها *** فقد<br />اقرأ بقية التعليق .."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117141250/http://masr.20at.com:80/article.php?sid=1091"

