subject = ""
author = "موح دالفوبور"
posted = "2009-12-01"
text = "يا أبناء فرنسا غير الشرعيين هذه فرصتكم لتنالوا من<br />وحدة الأمة.<br />لقد أعطاكم النظام المصري الغاشم الظالم المستبد فرصة لتنشروا الفرقة بين أبناء الأمة الواحدة فلا تضيعوها.<br />إذا ضيعتم هذه الفرصة فلن تكون لكم فرصة أخرى لتنشروا الشقاق و النفاق بين أبناء الأمة الواحدة.<br />(وَإِنَّ هَذِهِ أُمَّتُكُمْ أُمَّةً وَاحِدَةً وَأَنَا رَبُّكُمْ فَاتَّقُونِ)(ال مؤمنون:52) فلن تفلحوا لا أنتم و لا النظام المصري الفاسد في تفريق هذه الأمة"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106145203/http://www.20at.com:80/masr/news/14160-2009-11-24-16-06-37.html"

[[comments]]
order = 9
subject = ""
author = "الأخ سليم من فرنسا"
posted = "2009-12-04"
text = "كإبن شرعي لأمة محمد و حر في أن تخطط أناملي كلمات واقعية لما أسمح لنفسي أن ضميري لن يئنبني لأنني لن أتجاز حدود الله أكتبه في هذا المجال فأدرك يا أخي ما جعلني أشارك في هذا المجال بكل إحترام و تواضع إلى العروبة إنتمائ. فلا تعليق في ذالك.<br />كلام لا مكان له فمابالك أنت الذي فتحت و لقد فتحت الثغرة ليتسلل المرض . أمة محمد صلى لله عليه و سلم هي الأمة المسلمة الشريفة و لا أضنها عربية بأكملها.<br />هلائك الذين يدعون بالعروبة يا أخي في لله تدري أن الأعراب أشدهم كفر فمابالك بالحديث الشريف بأننا سواية كأسنان المشط !<br />أقولي قولي و غفر لي و لكم٠"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106145203/http://www.20at.com:80/masr/news/14160-2009-11-24-16-06-37.html"
