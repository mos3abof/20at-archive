text = "الشيء الوحيد و المفزع ايضا هو إستخدام الإعلام و الحصص كبيتك بيثك لإشعال نار البغضاء و إقتراف أفحش الأعمال كإنتهاك الأعراض و تعذيب الجالية الجزائرية في مصر خصوصا التهجمات الخسيسة ضد الطلاب و الطالبات في مصر ما الهدف من ذالك و كيف ستكون ردود فعل المحكمة الدولية بعد إلقاءها تقرير البحثات و شكاوي الضحايا بكل البيانات المفظحة يا لها من مهزلة كأننا في فيلم كابوس القرن."
