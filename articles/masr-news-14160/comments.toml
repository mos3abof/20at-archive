text = "الجزائر ترى ان مصر دولة اقل من ان يعتذر لها<br />حاجة كدة ببلاش<br />فية احد عندة حل تانى<br />والفيفا مع الجزاير<br />شوفوا حل يا بتوع الحكمة والسياسة"
