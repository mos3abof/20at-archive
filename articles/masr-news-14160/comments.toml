text = "بصفة عامة الجهاز الإعلامي المصري تمدد و بالغ إلى حد خطير حرض ثم هدد وبعدعمل على إشهاد الممثلين و الفنانين فنتج عن ذالك نداء للقتل و تحطيم كل ما هو جزائري رغم أن الجزاير صمتت و وفرت العديد من الادلة ضد مصر و حكومتها بما فيه من كلام مسموم من طرف ابن الرئيس و هذا عيب لا مثيل له أقول هذا مع الاسف الشديد بإمتناء للجزاير و لإخوةي المصريون. الشقيقة حياة من باريس"
