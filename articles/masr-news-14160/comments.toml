[[comments]]
order = 7
subject = ""
author = "الأخ سليم من فرنسة"
posted = "2009-11-28"
text = "تحرّشات جنسية تطال الطالبات وتهديدات بهتك اعراضهن • تقول الطالبة سامية محمد العائدة من مصران العشرات من الشباب المصريين يلاحقون الطالبات منذ تاريخ مقابلة الفصل بين الجزائر و مصر ويهدّدنهن بالإعتداءات اللأخلاقية ويرددون في الشوارع على مسامع العام و الخاص وبالضرب على الطبول قائلين \"حنذوئوا الجزائريات، حنذوؤكم قريبا رغما عنكم\" ناهيك عن الكلام البذيئ والتحرشات الجنسية، الأمر الذي دفع بهن إلى جمع أغراضن والإتحاق بذويهن قبل أن يلطّخ شرفهن ببعض أشباه الحيوانات<br />المصريين و كابوس الجزائر:<br />بعد قراءة هذا الخبر غمرني الرعب هل هنالك أبشع و أقبح عند الله عز وجل من إنتهاك حقوق وأعراض المسلمين.<br />مصر أضهرت البغضاء و التحريض المتوحش ضد الجالية الجزائرية و الطلاب و لطالبات اللوات أنتهكة أعراظهم. فالأعمال المتوحشة و الإعتدءات البشعة لن أرضى عنها كمسلم أولتها و كمواطن مصري في بلاد الغربة مع أسفي الشديد لإنتماء إلى هذا الشعب الناكرأتقدم بأعز الأمنيات في هذا اليوم الموقر و طلبي الممنون بأخذ بحق كل من إعتدي عليه بالقانون الدولي و بحق الله عز و جل جلاله<br />الرجاء من الكل السماح"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130025210/http://www.20at.com:80/masr/news/14160-2009-11-24-16-06-37.html"

[[comments]]
