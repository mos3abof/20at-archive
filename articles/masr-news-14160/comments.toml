subject = ""
author = "اعلام الاسمنت"
posted = "2009-11-24"
text = "بتاع الاسمنت عامل محطة تليفزيونية - وساويرس عمل محطة تليفزيون - وبهجت عمل محطة تليفزيون وكلهم اعضاء فى لجنة السياسات الحكومة التى تحكم من الباطن<br />وهؤلاء عملوا حملة كراهية مع الجزائر ومع كل العرب بدون اى داعى<br />ومن شحنهم لبعض الشباب قام بعض الشباب بالهجوم على السفارة الجزائرية وحرقوا علم الجزائر وفى اليوم التالى ردت مظاهرة فى الجزائر بحرق العلم المصرى وطرد المصريين العاملين هناك<br />اذن نحن هنا تحت تاثير اعلام الاسمنت والحديد وساويرس<br />وزهنقول اية"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130025210/http://www.20at.com:80/masr/news/14160-2009-11-24-16-06-37.html"

[[comments]]
order = 1
subject = ""
author = "كلهم كذابونوفاشلون"
posted = "2009-11-24"
text = "الفشل يبدأ من القمة<br />من الذين يجلسون فى المقصورة الرئيسية وحولهم الارزقية وحرامية مصر<br />وينتهى باللاعبون المدللين الذين قبضوا 6 مليون جنية حتى بعد هزيمتهم المنكرة<br />اما الشعب الجزائرى فهو شعب راقى جدا ومهذب ومتاثر بالسلوك الفرنسى وطريقة اللعب الفرنسية واللغة الفرنسية وليسوا بلطجية ولا ارهابيون ولا حرامية ولا فهلوية<br />ماذا نجحنا فية كمصريين حتى ننجح فى الكرة<br />السنا فاشلين فى جميع المجالات<br />واساتذة فى خلق الاعداء<br />وبكلمة خايبة من ابن ولى النعم سلطان البلاد السرمدى ضممنا الى صفوف المناوئين مع قطر وسوريا وايران وحزب اللة وحماس والان الجزائر والمغرب وتونس<br />ودول الخليج تبتعد عننا لاننا قرفناهم من الشحاتة<br />خلونا نشبع من السياسات الحمقاء والكذب على الشعب والناس"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130025210/http://www.20at.com:80/masr/news/14160-2009-11-24-16-06-37.html"

