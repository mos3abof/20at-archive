[[comments]]
order = 3
subject = ""
author = "عبد الله - تونس"
posted = "2009-11-26"
text = "دون مبالغة أشكرك على طرحك هذا المنصف<br />أود أن أشير هنا إلى أن طبيعة جارنا الشعب الجزائري يغلب عليها الإحساس بأن العرب جميعا إخوانه وبالتالي هم أحسن منه ويستحقون الاحترام والتقدير والأهم من هذاجديرون بالثقة. أعتقد أن الأمر قد فرط من عقده وما حدث من افتراءات أدركناه نحن العرب جميعا وأيدتها وسائل الإعلام الغربية في برامجها ومؤسساتها لهو أشد من كل التفاصيل. ليس من السهولة الآن أن نأتني ونقول من يعتذر لمن؟ الأمر صعب للغاية وما حدث في مصر لن يناه الجزائريون ونحن العرب أيضا لأنه أعطى انطبعا خطيرا يقول: لا تثق في المصريين. بالتأكيد هناك الشرفاء لكن أن يصل الأمر إلى التعدي المقيمين في مصر أيضا وانتهاك أعراضهم والتهجم على بيوتهم فهذا أمر يجاوز كل الخطوط لا سيما وأنكم على مرمى عطسة من غزة وقيادتكم تستضيف القتلة. أعانكم الله يا إخواتنا في مصر على نظام حي متعفن"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130025210/http://www.20at.com:80/masr/news/14160-2009-11-24-16-06-37.html"

