subject = "ده كتييييييير جداً"
author = "عمر مصطفى"
posted = "2006-08-28"
text = "العزيزة ولاء/ مش عارف الشكر ينفع مع اللي انتي كاتباه عني ده ولا لأ، لكن انا حقيقي باشكرك جداً، مع إن اللي انتي قايلاه ده باشوف اني لا استحقه اصلاً، وإنه كتير بجد على شخصي الضعيف..<br />لكن كان لازم اعلن شكري ليكي ولكل العشريناتية على الفرصة الجميلة وعلى التقدير الأكثر من كريم<br />عمر مصطفى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132241/http://www.20at.com/article2.php?sid=1153"

