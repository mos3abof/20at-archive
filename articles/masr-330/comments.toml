[[comments]]
order = 3
subject = "اللهم انصرنا على النظام الفاسد"
author = "م.م.ح"
posted = "2006-05-18"
text = "شىء عجيب جداان يستمر النظام الحاكم فى خداع المواطنين وكأنهم لا يسمعون ولا يبصرون مع ان الشعب قد علم كل شىء من الفضائيات(واخيرا والحمد لله لقينا فايدة جامدة لمشروع وصلات الدش) بس انا شايف ان المشكلة الوحيدة ان المواضيع السخنة كلها جت قبل الامتحانات بس ان شاء الله ملحوقة.<br />اما بالنسبة لنواب الاخوان والمعارضة فياريت ندعيلهم علشان ربنا يثبتهم ويقويهم<br />واحب اسلم جدا على اخى(ب) واقوله ربنا يفك سجن صديقك واصدقائنا كلنا<br />وان شاء الله (الاسلام هو الحل شرع المولى عز وجل)"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905012717/http://masr.20at.com:80/article.php?sid=330&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

