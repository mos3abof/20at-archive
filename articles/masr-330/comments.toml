subject = "بتنهار اكيد بتنهار"
author = "ياء"
posted = "2006-05-15"
text = "سبحانك يارب - خلقت ناس وعميت بصرهم وخلقن ناس عمت بنفسها بصيرتها<br />الحكومه الان اصبحت كالثور الهائج الذى يجرى على ارض كلها سكاكين لو وقف حيتعور ولو جرى برده حيتعور<br />نظام غبى عادا كل اطياف المجتمع قضاه ومهندسين واساتذه جامعات ومؤسسات مجتمع مدنى نظام اظهر فشله فى كل شى حتى الكدب مش عارف يكدبه<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905012717/http://masr.20at.com:80/article.php?sid=330&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

