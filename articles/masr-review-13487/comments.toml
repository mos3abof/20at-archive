posted = "2009-09-25"
text = "اقتباس افكار اقتصادية:<br />انتو عارفين ان الحل الوحيد للثراء في مصر هو استهبال الشعب<br />عايز تعمل مليون جنيه<br />تقسمهم على مليون واحد اهبل من شعب مصر وكل واحد يدفع جنيه<br />باختصار<br />صاحب الكتاب دا لو كان سماله اسم ما كنش حد حيشتريه الا قليل<br />لكن جتله فكره جهنميه انه يكتب على الكتاب كتاب مالوش اسم<br />وهو دا سر ان الطبعة الاولى نفذت بعد اسبوعين<br />هو انا معاك ان اسم الكتاب جاذب جدا وينفع للتسويق.. لكن ليه تفترض ان الكاتب سماه كده عشان الفلوس ومش علشان هو فعلا قرر يسميه كده؟؟.. على فكرة الرجل أول حاجة قالها في الكتاب هي تفسيره لذلك الاسم.. ولو حضرتك الكتاب كله لآخره هتعرف انه يستحق الاسم ده، لأنه بيتكلم في كل حاجة وفي مواضيع كتيرة ومختلفة… حتى لو في ناس كتير بتنصب. إلى أننا لازم نفترض حسن النية برضه<br />وعامة حتى لو الرجل فعلا عمل كده عن قصد بغرض انه يبيع الكتاب فأحب أطمنك.. الكتاب مش كلام فارغ ولا حاجة… ده جميل جدا ورائع وأفيد مليون مرة من 22 عدد من جريدة الأهرام اللي الشعب كله بيشتريها عشان ياكل عليها أو يلف فيها سندوتشات فول"
archived = "2009-09-25"
capture_url = "https://web.archive.org/web/20090925165528/http://www.20at.com:80/masr/review/13487-2009-09-17-13-04-03.html"
