text = "حركة مصريون ضد الفساد<br />راديو بكره<br />مكتب أيمن نور، بشارع شريف،<br />حركة صوتي مطلبي،<br />هيئة الدفاع عن قرية \"المريس<br />حركة \"مصريون من أجل انتخابات حرة نزيهة\"..<br />تجربة محاربة الفساد ضد بيع عمر افندي<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــتت<br />مش شريف الدواخلي ولا البراء اشرف"
