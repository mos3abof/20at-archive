subject = "بدل الكلام التافه والموضوعات التافهه"
author = "واحد"
posted = "2006-10-12"
text = "وقفات بعد رحيل رمضان<br />محمد الجابري<br />أيه الاخوة إليكم هذه الوقفات بعد رحيل رمضان<br />الوقفة الأولى :<br />هاهي أيام رمضان قد انقضت ، ولياليه قد تولت .<br />انقضى رمضان و ذهب ليعود في عام قادم ، انقضى رمضان شهر الصيام و القيام ، شهر المغفرة و الرحمة .<br />انقضى رمضان و كأنه ما كان .<br />آيه رمضان ماذا أودع فيك صالحات ، و ماذا كتبت فيك من رحمات .<br />كم من صحائف بيضت ، وكم من رقاب عتقت ، وكم حسنات كتبت .<br />انقضى رمضان و في قلوب الصالحين لوعة ، وفي نفوس الأبرار حرقة .<br />و كيف لا يكون ذلك ؛ و هاهي أبواب الجنان تغلق ، و أبواب النار تفتح ، و مردة الجن تطلق بعد رمضان .<br />انقضى رمضان : فا ليت شعري من المقبول فنهنيه و من المطرود فنعزيه .<br />انقضى رمضان فماذا بعد رمضان ؟<br />لقد كان سلف هذه الأمة يعيشون بين الخوف و الرجاء .<br />كانوا يجتهدون في العمل فإذا ما انقضى وقع الهم على أحدهم : أقبل الله منه ذلك أم رده عليه .<br />هذه حال سلف هذه الأمة فمل هو حالنا ؟<br />و الله إن حالنا لعجيب غريب .<br />فو الله لا صلاتنا كصلاتهم، و لا صومنا كصومهم ، ولا صدقتنا كصدقتهم ، و لا ذكرنا كذكرهم ؟<br />لقد كانوا يجتهدون في العمل غاية الاجتهاد، و يتقنونه و يحسنونه ، ثم إذا انقضى خاف أحدهم أن يرد الله عليه عمله .<br />و أحدنا يعمل العمل القليل و لا يتقنه ولا يحسنه ، ثم ينصرف وحاله كأنه قد ضمن القبول و الجنة .<br />فيا أخي عليك أن تعيش بين الخوف و الرجاء ، إذا تذكرت تقصيرك في صيامك وقيامهم ؛ خفت أن يرد الله عليك ذلك ، و إذا نظرت إلى سعة رحمة الله ، وأن الله يقبل القليل ويعطي عليه الكثير ، رجوت أن يتقبلك الله في المقبولين .<br />الوقفة الثانية :<br />أن لكل شيء علامة ، وقد ذكر العلماء أن من علامة قبول الحسنة أن يتبعها العبد بحسنة<br />اقرأ بقية التعليق .."
