author = "مواطن - غزة"
posted = "2010-01-06"
text = "صراحة الوضع بغزة لو قولتو 100% بدهم يهاجرو عدا أبناء الأجهزة الأمنية والوظائف الحكومية في حكومة غزة بقلكم فيه منو الكلام , وبتقدرو تقولو كمان معهم موظفين الوكالة , غير هيك لو إجت فرصة لأي واحد يسافر مستحيل أنو يترك هيك فرصة , لإنو الوضع مخزي جدا , ولكن يبقى شئ ودافع هو التمسك بالأرض والإيمان بالله عز وجل وهذا ما يجعل أهل غزة مرابطين فيها ومواجهين كل الصعاب , ,<br />اما عن الجدار المصري فانا من المشجعين لذاك الجدار مع إني من أبناء غزة ولكن الجدار سيمنع الأنفاق == غلاء المعيشة + المهدءات + البضاعة إلي مش تمام + خربان البيوت , بتمنى تنزال الأنفاق , طبعا الشعب مش حيجوع أو الأفضل أنو يجوع لإنو لو جاع الشعب راح يثور والثورة هي إلي حتنهي هيك وضع من الحصار و غيره , اما الأنفاق فهيا مشكلة وليس حل والقضاء عليها هو أفضل حل , ,<br />شكرا لكم وأعذورني للأطالة . ."
