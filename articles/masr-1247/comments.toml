subject = "عاري عن الصحة"
author = "مينا عادل"
posted = "2006-12-04"
text = "ايان كان المؤلف فهذة رواية لا تصلح حتي ان تمثل في فيلم ابطالة ممثلين درجة تالتة<br />و انا متاكد 100 في المية انو رجالت الكنيسة ما يعملوش كدة خالص لانهم هما اللي وهبو حياتهم لخدمة الكنيسة و المسيح ... و ده كلو علشان في ناس مش بيعجبها النقاء الروحي بتاع رجال الكنيسة و خاصة الكنيسة المصرية ده كلو من حكومة مبارك.<br />الوهابيين المتطرفين عملين يدفعوا و الناس بتالف .. بس علي فكرة احنا نعمل اللي احنا عوزينوة ... احنا هنا في مصر بلد المسيح قبل الوهبيين و العرب و هنفضل هنا علشان دي بلدنا بلد المسيح."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210950/http://masr.20at.com:80/article.php?sid=1247"

