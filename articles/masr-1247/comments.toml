[[comments]]
order = 32
subject = "قصيدة مساكين وحالكم عدم"
author = "مظلوم"
posted = "2006-12-05"
text = "قصيده جديده اهديها لعمنا احمد فؤاد نجم وكل الشعب المصرى الغلبان<br />مساكين وحالكم عدم والله يا مصريين<br />قولولى شعب اتظلم زى الغلابه دول مين<br />من يوم ما حكم اللافاش كيرى وشيلنا الطين<br />كان قدمه ناشف وعايز حرقه بالبنزين<br />قالوا لفرعون ايه خلاك متفرعن<br />قال طول ماشعبى جبان انا اتجبر واتملعن<br />اقول يمين يقولوا امين اختارناك<br />اقول شمال يقولوا عال احنا وراك<br />لحد امتى حيبقى الخوف مالينا<br />عايشين فى كهف والكون بيتغير حوالينا<br />يا اللى انت طابق على انفاسنا وعامينا<br />يوم ما تحل عنا حيرجع حقنا لينا"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210950/http://masr.20at.com:80/article.php?sid=1247"

[[comments]]
order = 33
subject = "يا عم الريس أيه تملك فى مصر علشان تورثها"
author = "مصري مخنوق من البلد"
posted = "2006-12-05"
text = "يا عم الريس أيه تملك فى مصر علشان تورثها<br />عود للخالق دى مصر أرض الله وهو حارسها<br />أياك والغرور ياما غيرك حكم وراح وتاركها<br />خذها نصيحه مالكش غير مقبرة فى مصر تورثها<br />يا كاتب كلمة الحق قلمك صواريخ وسهام<br />يا قايل الحكمه بين الناس عمرك ما تنلام<br />ويا حارس حدود الوطن أسد عيونه ما تنام<br />أنتم نور عيون الوطن وقلبه وهوى الأحلام<br />ياريح تتمسحى بالأرض حا تاخدى أيه من البلاط<br />ياما ملوك وسلاطين عاشوا و ماتوا وسابوا البلاط<br />وتاجر مشى أعوج وغش الناس ورجع على البلاط<br />وظالم أتعافى على الناس أنزلق ووقع على البلاط<br />صياد أعمى العين نشن سهامه على غزاله<br />فاكر أن المال والجاه نشانهم حيصيدوا غزاله<br />ما بيعرفش إن حسن الجمال موجود فى غزاله<br />بكره يروح المال والجاه يا قرد وتفضل لنا غزاله<br />يوم العيد أول سلام الصبح يكون للأمهات<br />هما مفتاح الحياة والرضا دخولنا الجنات<br />أوصانا الرسول بحديث وذكرهم بالتلاتات<br />هى اللى حملت وولدت يا ويل العاصى ومات<br />ألأوله. عين تبكى بدل الدموع دم من خشية الله<br />الثانية . عين باتت سهرانه تحرس فى سبيل الله<br />الثالثه. عين حسوده زرقا ما تنام تنظر لخلق الله<br />والرابعه. عين حمرا مليها الشرر تعمى بأمر الله<br />يا ريس البحر يا ماسك الدفه المركب بتميل بينا<br />من كتر ظلمك ياريس وعندك تاهت عن المينا<br />يا ما مراكب غرقت بعناد ريسها واللى عمله فينا<br />ياريت يا ريس تسيب المركب لريس بالأمل يعدينا"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210950/http://masr.20at.com:80/article.php?sid=1247"

