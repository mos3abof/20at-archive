[[comments]]
order = 19
subject = "بلد واحد وشعب واحد"
author = "اسامة - إيطاليا"
posted = "2006-12-04"
text = "أما بعد،مصر بلد واحد وشعبها واحد لافرق بين قبطي ومسلم وهذة المهاترات والشتائم المتبادلة تدل علي جهل متأصل فينا،في اختلافات شاسعة بين أهل الشمال والجنوب في ايطاليا في العادات والتقاليد بل واللهجة فاأهل ميلانو علي سبيل المثال لايفقهون لهجة اهل نابولي أما نحن بمصر شعب عريق واحد مها اختلف ديننا والدين المسيحي سمح بطبعة لولا تدخل اصحاب المنافع من القساوسة الذين يمنعون أطفال الاقباط من المشاركة في اعياد اخوانهم المسلمين في المدارس كما كان يحدث معي وانا بالصف الاعدادي،كان لي زميل اسمة مكرم ازورة ويزورني حتي منعة اهلة من زيارتي ومنعوني من زيارتة وقال لي أبونا قال لامي وأبي كفايةزيارة أولاد محمد وخافوا علي مكرم شوية حتي لاينتقم منكم الرب،ولم أفهم الكلام وقتها،القساوسة هم سبب بلاوي هذة الشعب ولا أبرأ الشيوخ من المسلمين الجهلة الذي فسروا الايات علي هواهم،انا أعيش في بلد مسيحي يحترم المسلمين وفية مساجد أينما ذهبت لاننا المسلمين احترمنا انفسنا واندمجنا مع المجتمع الذي نعيش فية وندعوا جيراننا المسيحين لمشاركتنا في اعيادنا ونحن ايضا نشاركهم اعيادهم ولا ضرر ولا ضرار ولم نتقوقع ولم نشعر بأننا أقلية ابدا،من هذا المنطلق ادعو اخواني الاقباط ألا ينغلقوا علي انفسهم بسبب توجيهات القساوسة لهم بل ينفتحوا علي اخوانهم حتي يعرفوا العادات والاعياد الدينية القبطية لاننا جميعا وطن واحد ومصير واحد ورب واحد وآخرة واحدة وجنة واحدة ونار واحدة،أحبكم جميعا"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210950/http://masr.20at.com:80/article.php?sid=1247"

[[comments]]
order = 20
subject = "اقطع ذراعى"
author = "اقطع دراعى إن مكنتش سوزى اليهودية وإللى بتسمى نفسها دشم ساعات وساعات مصرى حتى النخاع هى إللى ورا الموضوعات دى لإنها نفسها تحصل فتنة طائفية فى مصر علشان تضمن إنها تمرر توريث الحكم بدون إعتراض من الشعب وعلشان تنهب براحتها من مصر وهى هيهمها إيه مهى أصلاً بريطانية من أصل يهودى يعنى لا تمت لمصر بصلة ولا ليها أى أنتماء لمصر أو للمصريين بالعكس دى بتقول عليهم رعاع فى الموقع ده وإللى مش مصدق يدخل فى الأراء الحرة ويشوف مسمية نفسها مصرية بجد وكاتبة عن المصريين أنهم رعاع ربنا ياخدها يارب"
posted = "2006-12-04"
text = "حسبى الله ونعم الوكيل"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210950/http://masr.20at.com:80/article.php?sid=1247"

[[comments]]
order = 21
subject = "فين ايام زمان ؟؟؟؟"
author = "رئيس تحرير"
posted = "2006-12-04"
text = "فين ايم زمان لما كان رمضان بييجى وكنا بنعزم عمو رمزى هو واولاده على الفطار وبياكلوا معانا كنافة وطنط ايزيس كانت بتبعتلنا كعك فى العيد وانا كنت باشتغل مع ا / محب علشان ولاده هانى ومايكل اصحابى<br />ليه دلوقتى والنهارده ظهرت المواضيع دى احنا شعب مغيبب ومالوش فى اى حاجة علشان كده ابتدت تظهر حكاية الفتنة الطائفية عايزنا زى لبنان او العراق اتفرجوا على هوجو شافيز وشعبه اتفرجوا على احمدى نجاد وشعبه اللى واقف وراه بحب وبيسانده انا لا اشتركى من انصار شافيز ولا شيعى لكن لازم يبقى فيه عقل ومنطق احنا بنروح فين ووصلنا لايه يا مصريين مسلمين ومسيحيين افيقوا ويارب اغثنا ولا تسلط علينا من لايخافك ولا يرحمنا"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210950/http://masr.20at.com:80/article.php?sid=1247"

[[comments]]
order = 22
subject = "احتمالات الخطف"
author = "مسلم بيشتغل مع مسيحيين"
posted = "2006-12-04"
text = "اولا :<br />من واقع خبرتى مع المسيحيين فى العمل فهم يصدقون كل ما يقال لهم من قبل ابائهم فى الكنيسة دون تفكير او تشغيل دماغ زى مثلا ان جبل المقطم راح فى حتة تانية وكلام غريب<br />ثانيا:<br />اما ام مكريوس كان بيراود البنت دى وماعرفش ياخد منها حاجة فلجأ لخطفها عشان يعمل معاها زى بتاع دير المحرق اللى كان بيغتصب البنات فى الكنيسة<br />او انه لاحظ انها ميالة للاسلام فلحقها قبل ماتسلم وخطفها<br />ياجماعة الاسلام بينتشر بين المسيحيين فى مصر بصورة مرعبة بالنسبالهم ومش عارفيين يغطوا عالفضيحة دى باى طريقة<br />دول بياخدوا الولاد الصغيرين الكنيسة ساعة صلاة الجمعة عشان مايسمعوش خطب الجمعة من خلال مكبرات الصوت ويتأثروا بيها<br />وعشان تصدقوا كلامى اشتروا جريدة صوت الامة وافتحوا اخر صفحة هتلاقوا العناويين دى :<br />- ثلاثة قساوسة يصطحبون عايدة التى اشهرت اسلامها ويحتجزونها 48 ساعة بإحدى الكنائس للنصح والإرشاد !!<br />- ومسيحى يتهم زوجته بالهروب مع مسلم .. والزوجة تؤكد أنها سافرت إلى سوريا لإشهار اسلامها مثل والدها"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210950/http://masr.20at.com:80/article.php?sid=1247"

