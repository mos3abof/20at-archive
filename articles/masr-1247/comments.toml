author = "واحد من الناس"
posted = "2006-12-04"
text = "هاهاها يا عم لو اللي بيتكلم مجنون فاللي بيستمع عاقل مين ده اللي معصوم؟؟؟ يا كابتن احنا بشر و الرب لا يعصم البشر انت شكلك كده أخرك ميكي و تان تان... لا قس و لا شيخ و لا بابا معصوم..فالبشر هم البشر و مصائب بعض رجال الدين المنحرفين هي الدليل على ذلك مش كده وللا اييييييييهه؟"
archived = "2006-12-05"
