text = "لميت ايراد امك يا كسمك<br />يا ابن العرص لما حد يطلع في مظاهره ويستنجد بشارون لازم نهتم يا ابن اللبوه لما واحد يصرخ ويقول يا امريكا فينك لازم نهتم يا ابن الشرموطه يا ابن العرص الحرامي الكبير هيغور هيغور اما المشكله في طايفه بحالها عميله ايه هنقتلها يعني ولا نحاول نتكلم<br />اه بالمناسبه :لميت ايراد امك"
