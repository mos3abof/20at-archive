[[comments]]
order = 11
subject = "الاخ مينا عادل"
author = "فارس_fr"
posted = "2006-12-04"
text = "اظن يا اخ عادل بعد الشتايم اللى تبادلتها انت واخوانى المسلمين هل انت فكرت للحظه انت ولا هم ليه الموضوع ده ايه هدفه ,, ولاد البلد حطواالموضوع ده ليه ,,, والواضح ان الهدف الاساسى منه ,, انك تشتم انت وغيرك منالاقباط ويرد عليك مسلمين ,, يا سيدى الموضوع من اساه تافه ,, وطول عمرنافى مصر حبايب مسلمين ومسيحين عندكم خطط تانية بقى واتجاهات تانيةوتفكير تانى لا تعملوه بره مصربقى \" حلوة دول قبطيه عاصمتها اسكندريه \" واروح اصيف باذن من الكنيسة \" هههههه<br />يا عم عادل فوق واعرف ايه هدف الموضوع وبعدين هسالك سؤال احلفك بايه وحياة المسيح اللى انتى بتعبده تقولى يعنى ايه معصومين من الرب ؟؟؟؟؟؟ ارجوك تشرحهالى واعمل حسابك ان احنا فى سنة 2007 باعتبار ما سيكون<br />يا عادل بدلما نتجمع على مبارك وعصابته وناخد البلد المسروقه من المسيحى قبل المسلم نتفرق ,,, والا انتوا مش عايشين معانا ولا اييييه ؟؟؟؟؟"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210950/http://masr.20at.com:80/article.php?sid=1247"

[[comments]]
order = 12
subject = "يا مثبت العقل والدين يارب"
author = "يبدو أن مشاكل مصر الاجتماعية والسياسيةوالاقتصادية والتعليميةوالصحية وباقي المشاكل المتلتلة هتتحل بذهاب وفاء إلى الإسلام مع ملحوظة أن الموضوع بقاله سنتين بالتمام والكمال!! لكن يبدو أن الهستيريا أصابت الجميع في مصر وكاتب المقال لايعرف أن كل طلب الكنيسة هوأن تجلس معها ضمن جلسات النصح والإرشاد التي كانت تطبق لكن في مكان عن المكان القذر المسمى بأمن الدولة لما هو معروف من ألاعيبهم الرخيصة لكنهم رفضوا وصعدوا الموضوع إلى القاهرة وقد تحقق الأمر عندما لم يستطع الأساقفة التحدث معها لمدة ثلاث أيام ويبدو أن الخبل أصاب الكل ونسوا أنها أعلنت في النيابة أنها مسيحية وستظل وتموت مسيحية لكن نقول أيه بقى في الهستيريا الدينية التي أصابت الكل حتى الصحفيين !!"
posted = "2006-12-04"
text = "أما بالنسبة لموضوعك فبصراحة لا استطيع التعليق عليه بسبب سذاجته الشديدة والمنطق يقول اذا كان المتكلم مجنون فالمستمع عاقل فلا يعقل ان يتم اختطاف البشر عشان يتكرسوا وطبعا واضح أن هناك هدف خفي أراد أن يوصله للقراء عندما كتب عبارة أن الكهنة اشتكوا من كثرة المكرسات لكن مفيش داعي للرد على هذه التفاهات لأننا أرقى من أن نرد عليها.<br />طب فيه سؤال محيرني الأم دي وصلت ليكم إزاي وأيه علاقتكم بالموضوع أساسا؟!"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210950/http://masr.20at.com:80/article.php?sid=1247"

[[comments]]
order = 13
subject = "الي بتاع يا مثبت العقل والدين"
author = "مهدي"
posted = "2006-12-04"
text = "القرع والهجايص يا واطي اللي عاوز تشربه للناس ده شرمطه يعني ايه مشكله وفاء قسطنطين مش مشكله كبيره المفروض نقف عندها؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />يا خول وانا متأكد انك مسيحي واطي دي واحده اجبرت انها تخرج من الأسلام غصب عنها علشان تعيش مع واحد خول زيك بالظبط القسيس اللي كان جوزها كون ان ده يحصل في بلد 95 % منها مسلمين دي مصيبه وفضيحه والمفروض والمشكله الأهم ان المسيحيين هيولعوا في البلد بجد وهما اول ناس هيتحرقوا بس لما تكون البلد اتخربت اتفرج علي المجنون ابن راهب المحرق اللي بيقول دول معصومين من الرب وانت تعرف هما مجانين لحد فين غوروا الله يحرقكم عكرتوا مزاج الواحد"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210950/http://masr.20at.com:80/article.php?sid=1247"

[[comments]]
order = 14
subject = "كل العداوات يرجى مودتها"
author = "مسلم"
posted = "2006-12-04"
text = "اخوانى فى الدين ( المسلمين بالطبع ) تذكروا قول الشاعر كل العداوات يرجى مودتها الإعداوة من عاداك فى الدين<br />انا اتعجب من الاخوه الذين يرددون انه من الممكن ان نعيش مع النصارى أخوة والهلال مع الصليب وهذه الخزعبلات وسبب تعجبى أن الله سبحانه وتعالى قد حكم هذه القضيه منذ أن تنزل القرآن الكريم على خاتم النبيين محمد صلى الله عليه وسلم لقد قال تعالى ( ولن ترضى عنك اليهود ولا النصارى حتى تتبع ملتهم ) وهذه من وجهة نظرى من آيات الإعجازة المعنوى فى القرآن الكريم والتى تتضح وتظهر لنا كل يوم وليله فالنصارى ليسوا لنا بأخوة إذ كيف يحكم الإسلام على تارك الصلاه بالكفر ( فى الرأى الأغلب من الفقهاء ) ومايترتب على ذلك من أحكام اهمها عدم الأكل الشرب مع تارك الصلاه وعدم تزويجه من المسلمه وعدم الصلاه عليه بعد موته وعدم دفنه بمدافن المسلمين وعدم توريثه هذا للمسلم تارك الصلاه فما بالنا بالكفار الذين حكم الله بكفرهم صراحة وليس اجتهادا من الفقهاء فقد قال تعالى ( لقد كفر الذين قالوا المسيح ابن الله ) وقال ايضا ( لقد كفر الذين قالوا إن الله ثالث ثلاثه ) فهل بعد كلام الله من تعقيب فهو العالم سبحانه وتعالى ببواطن الامور وهو اعلم بماتكن به نفوسهم المريضه الضاله من بغض لأهل التوحيد اما الأيه الكريمه ( ولتجدن أقربهم مودة للذين آمنوا الذين قالوا إنا نصارى ) فقد نزلت فى النجاشى الذى كان حاكما نصرانيا عدلا ثم هداه الله للإسلام ومات مسلما وصلى عليه رسول الله صلى الله عليه وسلم كماوردفى كتب السير وأنا لاأسوق هذا الكلام لكى نظلمهم او نعتدى عليهم فديننا لايأمرنا بذلك ولكنه يأمرنا ان نحسن مع من احسن منهم ونعاملهم بأخلاق هذا الدين الساميه اما من ظلمنا منهم او اعتدى علينا فيجب ان نرد الظلم وننصر المظلوم وناخذ على ايديهم ف<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210950/http://masr.20at.com:80/article.php?sid=1247"

[[comments]]
order = 15
subject = "مصر لم تكن فى اى يوم مسيحية"
author = "مصر لم تترك عبادة رع الاة الشمس ولا امون ولا ازيس المقدسة ولا ازوريس وحوريس وكانت معابد الشمس موجودة حينما دخل عمرو بن العاص فاتحا- اذن من كان المسيحيين فى مصر كانوا الرومان واليهود وكانوا جالية فى كل اقليم بدليل انة لم يقابل عمرو بن العاص جيش موحد من الرومان كما حدث فى الشام لم يقابلة جيش موحد عند الحدود بل ان عمرو اضطر ان يذهب الى تلك الجاليات الرومانية فى الاسكندرية والصعيد وميت دمسيس وشمال الدلتا و000000و0000000"
posted = "2006-12-04"
text = "مصر كانت مقسمة اقطاعيات لهؤلاء الرومان واليهود- وبعد هزيمة الرومان تركهم عمرو يجمعون له الضرائب وكانوا مسيحين هاجر بعضهم الى بلادة وظل الباقى يقرفوننا كل شوية<br />طلب عمرو بن العاص بناء مسجد للصلاة فبنوا لة اتباع رع وامون مسجد عمرو على صورة مطابقة فى 90% من معابد الشمس ما عدا المحراب والقبلة والؤذنة<br />ثم قليلا هؤلاء اتباع امون ورع دخلوا فى الاسلام ومع مرور الايام هاجر الكثير من الرومان المسيحين وبقى بعضهم مسيحيا يجمع الضرائب<br />وازداد دخول المصريين فى الاسلام وانتهت عبادة رع وامون ودخل الناس فى دين اللة افواجا<br />اذن نحن المسلمين اولاد الفراعنة ورثنا عنهم اربعين الميت والسبوع والخميس الصغير والخميس الكبير<br />من هم الاقباط - هم بقايا الرومان واليهود<br />ومن لايصدق ينظر فى عيون الاقباط فية فرعونى عيونة خضراء وابيض<br />هم يعرفون الحقيقة ولا زال الناس يقولون عنهم عظمة زرقاء كناية عن الاصل الرومانى واليهودى<br />نحن المسلمين اولاد اتباع رع وامون وازوريس<br />ونحن المصريين حقا - اما هم فاولاد الدخلاء الرومان واليهود<br />والى اللقاء"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210950/http://masr.20at.com:80/article.php?sid=1247"

