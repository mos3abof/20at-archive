text = "متوقعين ايه يعنى سكتم بكتم على رأى اللمبى ومفيش مظاهرات زى بتعت كل مرة والحوارات الفاشلة دى .<br />نيجى بقى لو بنت دخلت الاسلام الدنيا تقوم ومتقعدش والخبر يوصل لبلاد العام سام ويبعتوا اتنين تلاتة من السفارة الامريكية للضغط على الحكومة اللارادية ويتم عودة البنت للكنيسة رغم انفها والله يكون فى عونها بقى.<br />وفى الاخر المسيحين يقوللك احنا مضطهدين؟؟<br />www.cazanoova.blogspot.com"
