text = "بس من الاخر كدة ... انتا شكلك عمرك ما عرفت قسيس ولا حتا شماش ... رجالة الكنيسة ما يعملوش كدة خالص... دول معصومين من الرب<br />بس انا لخصت الاسباب اللي تخلي نسا حقودة علي الاقباط تكت حجات زي دي<br />الوهابيين يا استاذ .. دول ممكن يكنوا دفعوا لاي حد يقول هوا مسيحي و بتاع .. و يقول خزغبلات كمان ...<br />هوا شوف احنا علي راي المهندس عدلي ابادير .. الحل دولة قبطية عاصمتها الاسكندرية ... مع حرية الملاحة في القنال .. و منفذ علي البحر الاحمر و توزع جديد لمياة النيل علشان الدولة القبطية تاخد نصبها, و سطيرة كاملة علي كل الاديرة و الكنايس في مصر"
