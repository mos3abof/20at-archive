subject = "المصيبه"
author = "مهدي"
posted = "2006-12-04"
text = "المصيبه انهم بيتهموا المسلمين بكل شئ قتل ارهاب ياجماعه انتم شفتم المتخلف اللي مسمي نفسه مسيحي عاقل وهو بيقول حكابه ان القساوس معصومين ده جهل وتخلف طيب ياعم العاقل راهب دير المحرق اللي تلاقيك انت ابنه في الحرام معصوم برضه يا جماعه كل ده من تحت راس الأرهابي الكلب شنوده والراجل المجنون المخرف اللي اسمه ابادير يا ريت المسيحيين يعقلوا ويراجعوا نفسهم مفيش حاجه من اللي بيحلموا بيها هتحصل ويعيشوا زي ماهما عايشيين وربنا يرحمنا من التيار التكفيري المتخلف اللي طالع من من الكنيسه واللي هيقابلوا بطبيعه الحال تيار مقابل اسلامي الله يحرقك يا شنوده يا وش الكلب"
