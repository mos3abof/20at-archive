[[comments]]
order = 2
subject = "مايخلق الجبابرة الا العبيد"
author = "محمد احمد على موسى"
posted = "2006-02-14"
text = "لجبن لا يصنع الحرية ولا التردد<br />( لا تخشى الا الله ) انا افضل السكوت عن الكلام فى الظلام كفانا جبن (ان الجبناء والمنافقين اشد غلظة على المؤمنين من الظالمين) تعبير لرجل بسيط يلعن كل يوم الجبناء والحمد لله يستطيع مواجهة الظالم اذا اقتضى الامر ويعلم جيدا انه ليس بجانبه على الاطلاق من منصف سوى الله عز وجل ان المصريين وبحق فئتان ظالم وجبان"
archived = "2006-04-20"
capture_url = "https://web.archive.org/web/20060420055108/http://egyvote.20at.com:80/article.php?sid=0"

[[comments]]
order = 3
subject = "المصنوع لايصنع ؟؟؟"
author = "عباس بن دباس"
posted = "2006-03-18"
text = "لحرية الاشتراكية الديمقراطية الشيوعية الليبرالية الخ... مستوردة نحن لدينا الشريعة الاسلامية لمحمد بن عبد اللة اما ما جاء بة محمد بن عبد الوهاب وغيرة مستورد والمستورد بدون جمارك ( كوسا )ولكوسا حرمها الشرع ؟؟ وحللها من يحب اكل القرع ؟؟والصناعة البريطانية جيدة للمواد والفلذات ؟؟ وصناعتهم لفلذات اكبادنا استنساخ يراد بة تغيير النوع والنسب للاشياء لتحلل المحرم والعكس ؟؟ من استورد فكر بلا جمارك انسان مارق ؟وفكرنا تالريخ طوى الزمان والمكان صفحاتة والقيت في قمامة التاريخ ؟ ومن ينبش الزبالة كثيرون متسببين وملرتزقة واللة يجبر عنهم ااامين اهدنا الصراط المستقيم ؟؟"
archived = "2006-04-20"
capture_url = "https://web.archive.org/web/20060420055108/http://egyvote.20at.com:80/article.php?sid=0"
