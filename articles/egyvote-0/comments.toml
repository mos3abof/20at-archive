subject = "افضل موقع للتعبير عن الحرية"
author = "khaled"
posted = "2005-12-02"
text = "لسلام عليكم ورحمة الله وبركاته<br />احييكم على افضل موقع للتعبير عن الحرية فى مصر هى دى الحرية ولا بلاش وان شاء الله نحتفل قريبا بزوال الكابوس وارساء الديموقراطية الحقيقية بدل الهم اللى الشعب فيه000<br />وفقكم الله"
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234200/http://egyvote.20at.com:80/article.php?sid=0"

