[[comments]]
order = 0
subject = "هوه فى مستشفيات تكفى"
author = "عابر القارات"
posted = "2006-04-22"
text = "السيد الوزير الهمام قال هنلك 6 مليون مختل مصرى طيب ما قالش هيالعجهم إزاى و لا هيعملهم إيه و لا هيجبلهم مستشفيات منين ... طيب بلاش كده و لا كده ما قالش ليه من باب الوقاية خيرا من العلاج إزاى هينقذ باقى الشعب من الاختلال مش يمكن النهارده هما 6 مليون السنة اللى جاية يمكن يكونوا 18 مليون .... طيب حيث إن ما حدش أفتا فى الموضوع ده أنا بقترح لأن إحنا نعزلهم فى الصحرا الغربية مثلا و نقول إنهم قرروا ينفصلوا عن العاقلين (أو فرضا العاقلين) و قرروا يعملهم جمهورية إسمها (خللستان) و يعينوا رئيس ليهم بالأنتخاب (طبعا الديمقراطى لأكثر الأعضاء خللا) و أقطع دراعى أن الدولة دى هتنافس أمريكا فى التقدم بعد 3 أو 4 سنين و طبعا ده لتشابه الرؤوساء فى الدولتين و على الأقل لأنها أنتهجت نهج ديمقراطي ما أنتهجوش كتير من العاقلين"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213955/http://masr.20at.com:80/article.php?sid=213&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "لمن لا يعرف \\\" الدولي\\\""
author = "واحد تاني"
posted = "2006-04-23"
text = "تعددت (الاسماء) و(العقل واحدو) , \"عبده تفيده\" بطل المقال او \"جمال الدولي\" اللى الدكتور قال اسمه على استحياء مش دا المهم, المهم نشوف سوا فلسفة الشارع اللى تبناها هؤلاء الافراد.... انا مشفتش الاستاذ \"عبده تفيده\" بس هحكي عن ذكريات سكندريين كتير مع دماغ \"جمال الدولي\" الطالب السابق بجامعة الاسكندرية, صاحب جردل \"البويه\" الخضرا اللى ممكن (يتحفك) على اى جدار فى اسكندرية بواحده من الشعارات دى :<br />- انتخبوا جمال الدولي لرئاسة الجمهورية<br />- انا بحب ليلى علوي وبكره اسرائيل<br />- اسرائيل ورم خبيث فى جسم الوطن العربي<br />حتى لو كان جدار فيلا المحافظ \"بذات نفسه\" وفى احيان كتير لم يكتفى بالفرشاه والشعارات المكتوبة, اذكر فى احد ايام الجامعة وكانت الكلية كلها مجتمعة خلف مبنى اعدادي لمتابعة بطولة \"الريست\" وقتها ظهر صاحبنا وطلع فوق الطاولة اللى بيلعبوا عليها عشان يقول خطبة عصماء من بتوعه ولما جاله ظابط الحرس يسكته, بص له \"الدولي\" من فوق وقاله بالحرف وبمنتهى (الألاطة) : اسكت انت يا (حيوان) سيبنى اشرحلهم برنامجى الانتخابي وكان ما كان.<br />واذا كان جمال الدولي فشل انه يتابع حملته وقتها الا انه وصل لنا على احد (قهاوي) اسكندرية يحكلنا عن برنامجه الاصلاحى و ازاي ناوي يحل مشكلة البطالة من جذورها, سالته ازاي يا \"دولي\"؟ قالى: هيعت كل الشباب يحاربوا اسرائيل وطبعا كلهم هيموتوا, يقوموا يدخولوا الجنه (عشان شهداء طبعا) وهناك مش هيكون فيه بطالة.<br />لا وكمان ناوي يطالب بترحيل كل الاخوة الصعايده من اسكندرية ويعمل دخولها \"بفيزا\". (دي حوارات حقيقية)<br />فلسفة بيمارسها وهو لابس \"عباية\" صوف خضرا وماسك فى ايده عود اوتاره عباره عن \"اساتك \" –جمع استك- وبيغنى \"العب يا اخضر\" وعنده استعداد يعبر عن وجهة نظره بطرق مختلفة حتى وان كانت اثن<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213955/http://masr.20at.com:80/article.php?sid=213&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "طبق (كماله)"
author = "واحد تاني"
posted = "2006-04-23"
text = "فلسفة بيمارسها وهو لابس \"عباية\" صوف خضرا وماسك فى ايده عود اوتاره عباره عن \"اساتك \" –جمع استك- وبيغنى \"العب يا اخضر\" وعنده استعداد يعبر عن وجهة نظره بطرق مختلفة حتى وان كانت اثناء مباراه \"دولية\" للاتحاد السكندري منقولة على الهواء مباشرة بانه ينزل الملعب ويقف قدام الكاميرا \"بلبوص\".<br />رغم هذه الفلسفة اللاارادية والشعرة المفقودة بين عبقريته وجنونه لا استبعد اطلاقا انى اسمع فى الراديو بكره وانا طريقى للمكتب نبأ قبض (الحكومة) على المختل \"جمال الدولي\" الذى (حاول قلب نظام الحكم) وفى نفس الوقت (قام بتخطيط محكم لسرقة فروع البنك الاهلي\"المصري\"فرع السطان حسين وفرع زيزينيا وفرع المعمورة فى آن واحد)."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213955/http://masr.20at.com:80/article.php?sid=213&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = ",وما بينهما ....شعرة"
author = "حدث في الاسكندرية"
posted = "2006-04-24"
text = "عبقرية وجنون وما بينهما شعرة<br />كانت دايما بتشدني كلماته وانا رايحة المدرسة او رايحة اي مشوار عن طريق القطار لان جدران المحطات كانت هي اكبر مكان للدعايا ليه<br />ياما قرأت له حكم وشعارات .....معظمها بها أراء صحيحة لم ولن يأت بها من حكام العرب<br />وكنت اتعجب كيف لمجنون ان يكون له هذا الرأي ولكني مؤمنة جدا بمقولة انه \"بين العبقرية والجنون شعرة\"<br />بجد بجد الناس دي عباقرة ومحتاجين عناية ورعاية وحنستفيد بيهم والله حنستفيد من أراءهم وافكارهم<br />بدل ما نسيبهم ونلاقي كل يوم جريمة (زي جريمة الأسكندرية الأخيرة)<br />بجد الناس دي من كتر حساسيتهم وتفكيرهم الكتير مش بيقدروا يستحملوا الاهانة والذل اللي احنا عايين فيه علشان كدة عقلهم مش بيستحمل<br />يا ريت نقدر نلحق ...(الشعرة)"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213955/http://masr.20at.com:80/article.php?sid=213&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

