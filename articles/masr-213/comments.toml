[[comments]]
order = 5
subject = "سلامى كل من شارك هنا بحرف"
author = "سمل جلال سودانى"
posted = "2006-04-28"
text = "ثقافة زراعية<br />عبد العزيز محمد عبد الله<br />مفاهيم اقتصادية<br />تطبيق المعرفة (2)<br />المعرفة وخاصة الفنية هي الرصيد والمدخل الهام لاستحداث التنمية واستدامتها وهي الشرط المسبق لوجود الإبداع ولتغيير وجه الحياة.<br />ولذلك ظهرت استراتيجية إدارة المعرفة التي تعمل علي إيصالها لمن يحتاجونها في الوقت المناسب وفي هذا العصر الذي طالما وصف بأنه عصر المعلومات واعتبر البحث العلمي أداة فعالة لحل المشاكل الحقيقية.أي ان البحث العلمي يجب ان يقاد بقوة الطلب عليه وليس بمنطق العرض بمعني ان تتيح التكنولويجا أولا ثم نبحث عن أمر تسويقها والترويج لها.<br />وقد أدي كل ذلك لظهور علم إدارة المعلومات والمشاركة فيها وتطبيقها وهو مثل سائر العلوم يدرس العالم المادي مستخدما تعليل العقل البشري.<br />هناك مكونات للمعرفة تبدأ بالتجارب الحقلية والميدانية وهي تستأثر بجل التكلفة وتمثلها 10 وحدات ثم تأتي عملية تحليل المعلومات الناتجة عن التجارب وتكلفتها 6 وحدات ثم تبويب المعرفة في شكل تقارير ونشرات وتكلف أربع وحدات ويكلف استخدام المعرفة في الإبداع وفي الحياة العملية وحدة لكل منهما.<br />تستقي الأرقام من التجارب الحقلية وهي المادة الخام الأولي والتكنولوجيا تعتمد عليها وعلي الأفكار بالدرجة الأولي وتتم معاملة هذه الأرقام عن طريق الكمبيوتر أو الآلة الحاسبة لتصبح معلومات ويمكن تخزين الأرقام والمعلومات بعد تشفيرها وحفظها بعيدا عن الأعين.<br />وعلي العموم هناك نوعان من المعرفة:<br />أولا: المعرفة الضمنية وهي معرفة تكتسب بالخبرة والمران مثل خبرة مربي النبات أو مدرسي الإحصاء أو مقدرات المرشد الزراعي علي الإقناع أو إحساس الإعلامي بالخبر والمعلومة هذه الخبرات لا يمكن ان تنتقل من شخص إلي أخر وعلي وجه السرعة أنها حصاد السنين ولذلك لا يمكن الحديث عن نقل مثل ه<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213955/http://masr.20at.com:80/article.php?sid=213&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 6
subject = "سلامى كل من شارك هنا بحرف"
author = "سمل السودانى"
posted = "2006-04-28"
text = "سمل جلال وادى حلفا جزيرة كولب بشمال السودان نوبى اصيل<br />أولا: المعرفة الضمنية وهي معرفة تكتسب بالخبرة والمران مثل خبرة مربي النبات أو مدرسي الإحصاء أو مقدرات المرشد الزراعي علي الإقناع أو إحساس الإعلامي بالخبر والمعلومة هذه الخبرات لا يمكن ان تنتقل من شخص إلي أخر وعلي وجه السرعة أنها حصاد السنين ولذلك لا يمكن الحديث عن نقل مثل هذه المعرفة.<br />ثانياً:المعرفة الصريحة الواضحة وهي الموجودة في الكتب والمجلات والنشرات العلمية في شكل مقالات وبيانات ورسوم وجداول ولكن رغم وضوحها وسهولتها إلا أنها تمتنع وابعد ما تكون في الوضوح ويستلزم الأمر فتح فصول دراسية لنقلها ، وهكذا لحدها الاقصي وتنفق الدول المتقدمة علي المعلومات أضعاف أضعاف ما يصرف في البلدان النامية التي تستخف بالبحوث العلمية بينما تهتم بها حتى بعض الدول الخارجة علي الحضارة الإنسانية مثل ما يحدث في بعض مستوطنات الضفة الغربية حيث تنتج البيوت المحمية من الطماطم أكثر من ما تنتجه دولة المغرب ويوجه 5% من الناتج المحلي الإجمالي للبحوث.<br />ومن أهم مراحل المعرفة تحويل المعرفة الفنية إلي معرفة عملية أي الإبداع وهذا يعتمد علي الأفكار وعلي المعلومات وفي المجال الصناعي فان إنتاج غسالة كهر بائية جديدة هو تطبيق للمعرفة ويمكن لقوي السوق ان تقرر نجاحها أو فشلها علي الفور ولكن ينشأ تعقيد أضافي في حالة التكنولوجيا الزراعية لأن هذا الأمر يرتبط بواقع اقتصادي واجتماعي لابد من وضعه في الاعتبار اولاً .<br />هناك دورة في إدارة المعرفة تبدأ باستخلاص المعرفة وتجميعها والتحقق منها. ونحن نفترض ان المتعامل النهائي مع المعرفة الفنية في المجال الزراعي هو المزارع وحده ولذلك نبني كل شئ علي هذا الافتراض ونهمل جملة من المستفيدين من المعرفة الفنية منهم موردي المدخلات الزرا<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213955/http://masr.20at.com:80/article.php?sid=213&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 7
subject = "سلامى كل من شارك هنا بحرف"
author = "سمل جلال سودانى"
posted = "2006-04-28"
text = "سمل جلال الحلفاوى بشمال السودان نوبى<br />وفي الماضي القريب وظفت البحوث الزراعية كل إمكانياتها لتحل مشاكل إنتاج القطن فدخلت في صراع طويل مع أمراض القطن وفي وضع التوصيات العلمية للعمليات الفلاحية تصنيف التربة... الخ ولكن اليوم تغير هذا النمط وتزايد اهتمام المزارع بالعديد من المحاصيل الاخري بجانب القطن وتغيرت بيئة مشروع الجزيرة وتلوثت البيئة وفقدت التربة خصوبتها وكل هذه المستجدات تستدعي فكرا جديدا وتوجه علي هذه الاحتياجات ، بالإضافة للحوار الداخلي الذي يجريه المزارع حينما يواجه التكنولوجيا الجديدة ، مثل: ما هي درجة كفاءتها.. هل يستطيع إدارتها وتعلمها.. كم تكلفتها (مثلاً كم يكلف السماد الجديد ).. هل يستخدمها في كل الحقل أم جزء منه.. كيف يراه الآخرون وهو يطبق الجديد في المعرفة وما هو إحساسه.<br />علي الباحث ان يتغمص دور المزارع ويسأل هذه الأسئلة قبل إنتاج تكنولوجيا جديدة. وبعد ذلك لابد من وجود جهة أخري تضطلع بمهمة إدارة المعلومات وتطبيق المعرفة. وقبل كل شئ لابد ان تضمن الملكية الفكرية للباحث ونصر علي هذا الأمر ، هذه هي الخطوة الأساسية في سبيل تحرير المعرفة في المجلات والنشرات العلمية والمؤتمرات والسمنارات وورش العمل التي ستستقر بها إلي المجال العملي والذي يفيد ويكرس التنمية واستدامتها . ستقوم إدارة المعلومات وتطبيق المعرفة بالربط المحكم بين البحوث وصانعي القرار والمستفيدين من التكنولوجيا وذلك نتيجة لاضطلاعها واستيعابها لمفهوم نقل التكنولوجيا. تعرف هذه الهيئة بان صانعي القرار يهمهم محاربة الفقر وزيادة الإنتاج ويتم التأثير عليهم من هذه الزاوية.<br />بعد ذلك تقوم إدارة المعلومات بتنقية المعلومات الفنية وتنظيمها وتوصيف الواقع وتختار الوسيلة المناسبة لنشرها مثل الصحف ، الفيديو، الإذاعة.. الخ ونتص<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213955/http://masr.20at.com:80/article.php?sid=213&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 8
subject = "سلامى كل من شارك هنا بحرف"
author = "سمل جلال سودانى"
posted = "2006-04-28"
text = "وإذا كانت التكنولوجيا الجديدة قد اتصحت معالمها ( مثل نوع جديد في المبيدات ) فلابد من تطبيقه في حقول رائدة بهدف التنقيح واعتبارها انعكاس حقيقي لما سيكون عليه الأمر بعد ذلك وسيؤدي ذلك لسرعة إقناع صانعي القرار والمستفيدين في وقت وجيز.<br />ان إدارة المعلومات تعرف تماما ان مهمتها هي تحويل المعرفة الفنية من مجرد أرقام ومصطلحات إلي ثروة حقيقية تدخل جيوب المستفيدين فلابد لها من فهم مقاصد صانعي القرار ما يؤرقهم ويثير اهتمامهم وخططهم وبرامجهم المستقبلية وما هو خطابهم السياسي والاتصال الفعال مع المستفيدين من التكنولوجيا الجديدة وتطبيق المعرفة وتحددها في المكان ( جغرافياً) وفي الزمان في شكل خدمات مستدامة وذلك بخلق البيئة المقتدرة حيث تعدل القوانين واللوائح والسياسات ودعم المقدرات الكامنة ومعرفة خبرات المزارعين والمستفيدين من التكنولوجيا وتجاربهم وهكذا نخلق ارض خصبة تتقبل الجديد وتطبق فيها المعرفة وتزدهر .<br />ـ ونواصل ـ<br />ـــــــــــــــــــــــــــــــــــــــــــــ<br />ثقافة صحية<br />عثمان قسم الله<br />طرق عملية لتقليل الكوليسترول والدهنيات<br />تتكون الدهنيات في الجسم من عدة أنواع .... ان أربعة أخماس الكوليسترول تتكون طبيعيا في الكبد والباقي يأتي من الطعام وهي:<br />1- الدهنيات الثلاثية Triglyeerides .<br />2- الكوليسترول Cholesterol وهو نوعان<br />(أ) الكوليسترول الحميد (HDL) وهو الذي يقوم بإزالة الكوليسترول عن جدار الشرايين وينقله إلي الكبد ليتم طرحه.<br />(ب) الكوليسترول السيئ (LDL) وهو الذي يحمل الكوليسترول ويرسبه علي جدار الشرايين ان درجة خطورة الكوليسترول في التسبب في أمراض القلب والشرايين تعتمد علي نوع الكوليسترول المرتفع وكميتها.<br />مستوي كوليسترول اقل 200 ملغم يعتبر جيد مستوي كوليسترول من 200 إلي 239 ملغم يعتبر<br />اقرأ بقية التعليق .."
