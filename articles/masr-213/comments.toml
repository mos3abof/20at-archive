order = 9
subject = "سلامى كل من شارك هنا بحرف"
author = "سمل جلال سودانى"
posted = "2006-04-28"
text = "الإكثار من المأكولات النباتية والخضار وكذلك البقول مثل الحمص والفول والعدس والحبوب كذلك الفواكة بأنواعها بدلا عن أطباق اللحم التقليدية.<br />• احذر وتجنب مصادر الدهن المشبع الخفية مثل الفطائر ـ خلطات الكعك الجاهزة ـ الحلويات ـ المايونيز + الشوكلاتة ـ جوز الهند والمكسرات بأنواعها. لا ضرر من الأعشاب ـ الشاي أو البهارات.<br />نظام غذاء قليل السعرات ( لمرضي السكري ) الإفطار:<br />1/ ربع رغيف اسمر ـ شاي ـ أي اثنين من التالي:<br />بيضة مسلوقة بدون صفار (معدل 3 بيضات في الأسبوع ) قطعة جبن ابيض ( 50جرام) ـ 3 ملاعق فول مدمس ـ 5 حبات زيتون ـ نصف كوب حليب صغير ـ طبق سلطة ـ قطعة لحم باردة ـ أو ما يعادل ربع دجاجة 60 جرام.<br />الغذاء:<br />ربع رغيف اسمر ـ طبق سلطة خضراء ـ ملاعق خضار مطبوخة مثل الملوخية أو السبانخ أو الكوسا أو البامية. الخ مع قطعة لحم صغيرة ( اللحم الأحمر ـ دجاج سمك ) وتقدم اللحوم مشوية أو مسلوقة ـ ربع كوب أرز أو مكرونة أو عدس حبة واحدة برتقال أو موز أو تفاح أو خوخ ـ تجنب العنب.<br />العشاء:<br />مثل الإفطار + حبة واحدة تفاح أو برتقال (هذا النظام مثال فقط حيث يمكن تناول بدائل أخري)).<br />تخفيض الوزن:<br />يجب ان يكون تدريجيا وبمقدار كيلوجرام واحد في الأسبوع يمكن تخفيض الوزن بإتباع طعام يحتوي علي القليل من الدهنيات والكوليسترول ويأخذ كميات قليلة تعطي سعرات حرارية محدودة كما ذكر أعلاه يحسب الوزن المثالي حسب الجدول المبين أدناه:<br />الرياضة:<br />ثبت ان ممارسة الرياضة بصورة دائمة ترفع نسبة الكوليسترول الحميد تخفض من الوزن يتكون البرنامج المثالي من المشي السريع لحوالي 3 كيلو مترا أو أكثر يوميا هذا بالإضافة إلي أنواع أخري من الرياضة مثل السباحة أو ركوب الدراجة الهوائية كما يمكن الهرولة بصورة بطيئة.<br />يمكن قياس شدة التمارين<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213955/http://masr.20at.com:80/article.php?sid=213&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 10
subject = "سلامى كل من شارك هنا بحرف"
author = "سمل جلال سودانى"
posted = "2006-04-28"
text = "التدخين:<br />ويجب الامتناع عنه كليا لان إيقاف التدخين مثبت بأنه يؤدي إلي ارتفاع نسبة الكوليسترول الحميد (HDL) في الجسم.<br />في بعض الحالات فان الحمية الغذائية والرياضة والتشخيص المطلوب بالرغم من ان المريض كان قد اتبع هذه الطرق بصورة كاملة. ففي مثل تلك الحالات يقرر الطبيب حاجتك لاستعمال أدوية مخفضة للكوليسترول.<br />ـــــــــــــــــــــــــــــــــــــــــــــ<br />أكثر من موضوع<br />محي الدين بابكر احمد<br />زيارة من الرئيس أو نائبه للالتقاء في قلب المشروع بالمعنيين بعلاج المشكلات ضمان لنجاح (النفرة) ..<br />من سداد الرأي ان يبدأ المجلس بهذه (النفرة) المعلنة لإعادة الثقة والأمل والنشاط<br />لابد من تأسيس الروابط علي قاعدة متينة لما هو مرجو منها للقضاء علي مشكلة الري..<br />• أمل ورجاء :<br />مع تقديرنا للأحداث الكبيرة التي تشغل اهتمام رئاسة الجمهورية فإننا من منطلق اهتمام رئاسة الجمهورية ومشاركتها المباشرة في إنقاذ وتقويم وتحديث مشروع الجزيرة نأمل ان يحظى مشروع الجزيرة بزيارة كريمة من السيد رئيس الجمهورية أو السيد نائب الرئيس للوقوف علي ما يجري بالمشروع وهو يخطو لبداية تطبيق قانون المشروع لسنة 2005م للدفع والاطمئنان ذلك لاعتقادنا ان رعاية الرئيس ونائبه المباشرة إنما هي البلسم الذي جعل هذا المشروع يقف علي قدميه وهي ما سهل البحث عن مخارج لهذا التدهور وقد بدأت الآن بوادر نجاحها بهذا التكوين الجيد لمجلس الإدارة الذي ينوي إنجاح نفرة عامة في الموسم القادم تستعيد النشاط الذي عرف به مشروع الجزيرة وتكون ضربة البداية لعهد جديد للمشروع يضعه في مكانه اللائق في سلك التنمية والعطاء الاقتصادي الهام الذي هو جدير به.<br />ان زيارة من السيد الرئيس أو نائبه والالتقاء في قلب المشروع بالمعنيين بعلاج مشكلات المشروع وتداولها معهم والذين ي<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213955/http://masr.20at.com:80/article.php?sid=213&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 11
subject = "سلامى كل من شارك هنا بحرف"
author = "samel"
posted = "2006-04-28"
text = "لنجاح النفرة ووضع الأقدام علي نهج ثابت لسرعة التطوير والتحديث التي تقف خلفها بقوة رئاسة الجمهورية منذ بداية خطة الإسعاف التي وفرت وسائل إنجاحها الرئاسة ولولا الاهتمام الصادق والدفع المباشر الذي لعبته خطة الإسعاف من رئاسة الجمهورية لأصبحنا الآن بدلاً من هذا العمل الدؤب في إنجاز القانون وتلمس المخارج بل وهو النشاط الجم في تغيير الحال لأصبحنا نندب ونبكي ضياع مشروع الجزيرة.<br />• وجلس المجلس !!<br />مجلس إدارة مشروع الجزيرة عقد أول اجتماع له بعد تشكيله يوم الخميس قبل الماضي بالخرطوم ومن المقرر إن يكون المجلس قد عقد اجتماعه الثاني يوم الخميس أول أمس وأنا اكتب هذا صباح الأربعاء وباجتماع المجلس السابق واجتماعه اللاحق يكون المجلس قد أطلق البشري وعزمه بان النفرة العامة التي أعلنها في أوساط المزارعين والعاملين استعدادا للموسم القادم قد بدأت وقد حدد محاورها بالفعل (التمويل والمدخلات والجهات التي تنفذ خطتها) ولم يغفل المجلس الموقر دور السادة وكلاء الوزارات المعنية الذين خاطبهم بالمساعدة في بسط وتنفيذ بنود القانون الجديد.. ان من المؤكد ان مجلس الإدارة يمتلك أفكارا وخططاً محكمة للخروج بمشروع الجزيرة من ربقة التخلف التي رزح تحتها سنين عدداً ولكنه يضع الموسم القادم في مقدمة اهتماماته العاجلة لأن نجاحه سيعد برهاناً علي الجدية التي يلج بها إلي ساحة الخلاص من التخلف واستحداث التطوير اللائق بمشروع الجزيرة العظيم.. ان من سداد الرأي ان يبدأ المجلس الموقر بهذه النفرة المعلنة ومن مؤكدات الثقة في المجلس والمزارعين والعاملين وإدارة المشروع ان تنجح النفرة نجاحاً مقدراً لإعادة الأمل والثقة والنشاط في نفوس الجميع بما يهيئ لتثبيت الخطي علي طريق التقدم والتحديث الذي بشر به قانون مشروع الجزيرة لسنة 2005م الذي إذا<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213955/http://masr.20at.com:80/article.php?sid=213&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 12
subject = "سلامى كل من شارك هنا بحرف"
author = "سمل جلال سودانى"
posted = "2006-04-28"
text = "القنوات الصغيرة هذا النجاح الذي يتطلب إتاحة السعة الكافية لانسياب الماء والصيانة الجيدة للأبواب والمنظمات والوفاء بالطلبات المحسوبة حساباً جيداً بلا زيادة أو نقصان.. ان لدي إدارة المشروع والمزارعين ثقة كاملة في كفاءة وزارة الري لتحقيق كل ما هو مطلوب منها في هذا الأمر ولكنهم سوف يظلوا غير مطمئنين لاستطاعة وزارة الري في ان تفعل كل ما تريد إذا لم يتوفر لها التمويل الكافي وهو تخوف ناتج عما ظلوا يعانونه من ندرة السيولة في أوقات الموسم الحرجة وذلك مما يستدعي مجلس إدارة مشروع الجزيرة للعمل المستمر لمواصلة الإمداد المالي وما يفرض ان تفي وزارة المالية وبنك السودان بالتزامها بتوفير الاحتياجات المالية لوزارة الري.. ان مما يبشر بنجاح روابط المياه هذا الحماس المتدفق من المزارعين وهذا الحرص علي ان لا يتسلموا أي (ترعة) دون ان تكون معدة إعدادا كاملاً بالحفر والتطهير وصيانة (الكباري) ومنظماتها ووضع خطة كاملة لإعادة حفر (ابوعشرين) في كل المشروع وتوفير مواسير (الدورانات) بل لابد من العودة لتوفير (مواسير سدود ابوعشرين) ومأخذ (ابوستة) لضبط وتوزيع الماء بالمقاييس المطلوبة..<br />إننا لعلي ثقة ان الجمع المبارك الذي شهدته قاعة الاتحاد يوم الاثنين قد تفرق وهو ممتلئ حماسة وهماً بان لابد من تأسيس الروابط علي قاعدة متينة لتحقق ما هو مرجو من القضاء علي مشكلة الري المزمنة.<br />غرامة بدون مغرم !! :<br />من المؤكد ان عدداً لا يستهان به من (الحواشات) بمشروع الجزيرة يتعرض أما للعطش أو الغرق ومن المؤكد ان مصيبتا الغرق أو العطش يصيبان مزارعي هذه(الحواشات) بخسارة مؤلمة خصوصاً عندما يفاجئهم الغرق أو العطش بعد ان يقوموا بكل العمليات الفلاحية ويكونوا قد صرفوا مبالغ طائلة لإنجاحها ومن المؤكد انه ليس هناك حق في تعويض هذه الخسا<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213955/http://masr.20at.com:80/article.php?sid=213&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 13
subject = "سلامى كل من شارك هنا بحرف"
author = "سمل جلال سودانى"
posted = "2006-04-28"
text = "مصابيح<br />حسن محمد مختار<br />• السلام عليكم ورحمة الله وبركاته .<br />• من لطائف القرآن الكريم نجد أن عدد آيات سورة البقرة (286) آية . وعدد آيات سورة الناس(6) آيات. بقسمة آيات سورة البقرة علي آيات سورة الناس تجد سورة محمد صلي الله عليه وسلم.<br />• أعفيني إعفاءاً شاملا كاملا..كلمة قالتها وهي تدري أنها تدري.. ووقعت تحت المعني ذلك عالم فاسألوه..والبعض يفعل مثل هذا لكن ما أقلهم.<br />• أحيانا كثيرة يكون الكلام صعباً قوله..لكنها المعاني الآتية من رحم الدواخل تقول الكثير.. ذلك لمن يفقه القول.<br />• العيون في دراسة تأكد أنها تقول ما يعجز اللسان عن نطقه.. فهي إذا اتسعت فذلك يعني الدهشة.. وإذا ضاقت وتسبلت فهو الحزن ... وإذا تفتحت وصار( النونو ) كبيرا فهو الفرح.<br />• العلاقة بين الفتاة كجنس لطيف.. والشاب كجنس (خشن) رأينا فيها أنها كصداقة يمكن أن تكون بل وهي مطلوبة لأهميتها.. أما إذا أخذت معني العاطفة وكانت جادة من الطرفين النتيجة هي السعادة المطلوب تحقيقها في حياة العباد.<br />• الشعور بالرضا والسعادة مسألة تكاد تكون نسبية .. فالفرد يشعر بالسعادة حين يرضي كل الأطراف التي حوله .. ويكون مرة آه..ومرة لا عندما يحس بأنه لم يرض أقرب الأقربين له ، كلمات آتية من عمق المعني لديها ..قالتها وهي تشعر بما قالت.<br />• قالت له إحساسي بك وصل إلي نسبة 70%.. قال أود المزيد. ضحكت بدلال وقالت لكل شئ أوان.<br />• قبل الدخول للخروج... ما خاب من استخار. وما ندم من استشار.. هل كل الشورى تقع في خانة الاستشارات ؟ .<br />• تقول الرواية أن السيد جحا عندما باع بيته لآخر.. ترك مسماراً في الحائط وظل يداوم الحضور الراتب يومياَ ليري مسماره. . وكان مسمار جحا سبباً في إعادة البيت له. نظنه مسماراً نافعا.<br />• خارج الإطار...جوهرتي النبيلة... وتبدو الذاكرة م<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213955/http://masr.20at.com:80/article.php?sid=213&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 14
subject = "ده احسن حل"
author = "سمير المصرى"
posted = "2006-04-28"
text = "http://izhabyamubarak.jeeran.com/index.htmlساهموا فى خلع مبارك من الحكم<br />رسالة مفتوحة الى حسنى مبارك<br />السيد/ محمد حسنى مبارك<br />بعد التحية<br />نرجو أن تستقيل أنت و حكومتك فورا و أن تتنازل عن الحكم الى لجنة مؤقتة تتألف من رؤساء الأحزاب و بعض الأعضاء المستقلين بمجلس الشعب لحين تعديل الدستور و اجراء انتخابات حرة مفتوحة يختار الشعب من خلالها رئيس الجمهورية و نائبة و رئيس الوزراء و أعضاء الحكومة<br />و أسباب استقالتك هى<br />أولا: انك تفتقر الى الشرعية فلم تجيء الى الحكم من خلال انتخابات حرة مفتوحة كما أن الظروف التى أدت الى تبؤك السلطة فى البلاد مشكوك بها و مثيرة للجدل<br />ثانيا: انك تخطط لحكم البلاد مدى حياتك عن طريق تزوير ارادة الشعب فى الوقت الذى لا توجد فية وسيلة سلمية متاحة للشعب لتغييرك<br />ثالثا: أنك تخطط لأن تورث الحكم الى نجلك جمال مبارك<br />رابعا: انك خدعت الشعب طيلة 21 عاما باخفائك عنة سببك الحقبقى لعدم تعيين نائبا لرئيس الجمهورية و الذى تبين بأنك كنت تخطط و تعدابنك جمال مبارك ليرث الحكم من بعدك<br />خامسا: انك عرضت أمن البلاد و سلامتها للخطر طيلة فترة حكمك بعدم تعيينك لنائبا لرئيس الجمهورية و كان ذلك بسبب مأرب شخصى لك و هو توريث الحكم لنجلك من بعدك<br />سادسا: انك حكمت البلاد باستخدام أبشع اساليب البطش و التنكيل و الارهاب تحت وطأة و نير الأحكام العرفية و قانون الطوارىء و قوانين و قرارات أخرى كبلت بها الحريات و كممت بواستطها الأفواة بمصر دون مبرر صحيح والتى فرضتها على الأمة لتستعيض بها على انعدام شرعية وجودك و انتهكت بمقتضاها حقوق الانسان و نكلت بخصومك و معارضيك أبشع تنكيلا و هى أفعال مؤثمة و خسيسة أدانتها و شجبتها الحكومات و المنظمات الدولية.<br />سابعا:<br />اقرأ بقية التعليق .."
