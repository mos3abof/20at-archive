text = "بإختصار هذه الافكار والشك في الخالق تاتي لمن نقص عنده الايمان وهي تنبيه له وليست مفخره واما من ناحية نبي الله فهو ماشكش ابدا ذي حكايه ثانيهخالص<br />هذا الحديث ومقارنتك موضوعك المتقطع اساسا وغير مرتبط الافكار<br />مع قصة نبي الله يدل على سطحيت تفكير وعجز القدره العقليه لديك على التمييز فندعوا لك بالشفاء وليس الثبوت"
