posted = "2007-05-10"
text = "فعلا الموضوع ده بيحصل معى كتير .عقلى بيروح لاماكن بعيدة فى التفكير بخاف اصارح من حولى لانى بخاف ليفكروا ان هبقى والعياذ بالله ملحد لكن من فترة وقفت عقلى عن التفكير بجملة دى من الغيبات وفى امور فى الاسلام العقل لا يجوز له التفكير فيها وحولت فكرى الى عجائب الطبيعة وقدرات الله فى الكون انظر فى القرآن لاية وابحث عنها كعلم اجدها كما قالت الاية الاعجازية بسيطة وقليلة الكلام بينما الامر من امامى يحتاج الى مجلدات لشرحه ووصفه .<br />يبقى سؤال : ليه دايما الناس الملحدين لما فكروا الحدوا ؟<br />.اعتقد انهم صدورا العقل لامور اقوى من اداركه وفهمه بها بينما بالنسبة لنا كمسلمين ما يحدث فى تلك الحالة هى دفع النفس الامارة بالسوء ووساوس الشياطين وامواج الفتن من حولنا والتشكيك فى كل شئ والشك اللى بيزيد عن حده اعتقد انه هيبقى كارثة لصاحبه"
archived = "2009-08-28"
capture_url = "https://web.archive.org/web/20090828153725/http://www.20at.com:80/20at/salamo-3lakom/5797.html"

[[comments]]
order = 8
subject = ""
author = "نبضة قلب"
posted = "2007-05-11"
text = "بسم الله الرحمن الرحيم (( ياأيها الذين أمنوا اتقوا الله حق تقاته ولاتموتن الا وانتم مسلمون ))<br />عزيزتى عليكى بقرأه القران بكل استطاعتك لتهدئه صراع نفسك<br />بسم الله (( ان هذا القران يهدى للتى هى أقوم ويبشر المؤمنين الذين يعملون الصالحات ان لهم أجرا كبيرا ))<br />ولأقناع عقلك ابحثى فى الاعجاز العلمى فى القران<br />وأكثرى من دعاء الله تعالى خاصة دعاء النبى (( اللهم حبب الينا الايمان وزينه فى قلوبنا وكره الينا الكفر والفسوق والعصيان واجعلنا من الراشدين .. اللهم توفنا مسلمين وأحينا مسلمين وألحقنا بالصالحين غير خزايا ولا مفتونين … اللهم قاتل الكفره الذين يكذبون رسلك ويصدون عن سبيلك وأجعل عليهم رجزك وعذابك ))<br />دعائى لك اللهم ثبت تلك الفتاه والمسلمين على الاسلام<br />اللهم املا بنور دينك قلبها وبصيرتها وبصرها .. فليس لها سواك تلجأ اليك تثبتها بيقينك<br />وتطمئن فؤادها بوجودك وتهدىء من صراع نفسها"
archived = "2009-08-28"
capture_url = "https://web.archive.org/web/20090828153725/http://www.20at.com:80/20at/salamo-3lakom/5797.html"

[[comments]]
order = 9
subject = ""
author = "مؤمن"
posted = "2007-05-15"
text = "الى كل من يلقي الشيطان بالوساوس في نفسه بالشك في الذات الالهية، ان يتبع النصائح التالية 1 - يجمع اقوال وادلة العلماء عن وجود الله وفيها من اليقين ما لاينكره عقل وارشح لكم هنا كتاب منهاج المسلم \" جزء العقائد \" . 2 - انه من المستحيل ان يوجد شئ الا اذا وجد الواجد، فالعقل الذي ينكر تكون السفينة التي تتالف من بضعة الواح من الخشب وحدها ينكر بالضرورة انشاء الكون صدفة او بلا خالق \" . 3 - من المستحيل ان يتفق اربعة وعشرين الف رجل \" وهم عدد انبياء الله ورسله تقريبا \" في ازمان واماكن مختلفة متباعدة على حقيقة واحدة وهي وجود الله ويكونوا كاذبين. 4 - من ليم يايته اليقين من كل ما سبق وممن سيقرأه في كتب العقائد فليؤمن ايمان من لا يخسر شيئا اذا امن كما قال الشيخ الشعراوي اذا امنا بالاخرة ولم نجدها بعد الموت فلن نخسر شيئا ولكن اذا لم نؤمن وظهر لنا بعد الموت وجود الاخرة فسنخسر انفسنا ومصيرنا الى الابد \" انصح القراء الا يلجا الى ذلك النوع الرابع الا كحل اخير لانه اضعف الايمان وفيه قال الشاعر \" قال المنجم والطبيب كلاهما لاتحشر الاجساد قلت اليكما .. ان صح قولكما فلست بخاسر او صح قولي فالخسار عليكما. … ادعو الله ان يغرس اليقين في قلوبكم وان تعملوا بوصية النبي ( ص ) بالاستعاذة بالله من الشيطان اذا وجدنا ذلك والسلام عليكم ورحمة الله"
archived = "2009-08-28"
capture_url = "https://web.archive.org/web/20090828153725/http://www.20at.com:80/20at/salamo-3lakom/5797.html"

