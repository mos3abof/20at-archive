subject = ""
author = "أحمد ندا"
posted = "2007-05-09"
text = "الاستشهاد بـ(إشارات) المتصوفة وعيونهم الكبار كالغزالي خطير..لا تستوعبه العامة..واللغة لا تحدد إلا المعقولات، ولا سلطان لها على اختراق مدار الروح، واكتشاف عوالمه الباطنية،وحين يمتلك العقل خيط النور، وتستطيع اللغة التعبير، يمكن لنا أن نرسم تصورا ذهنيا للتصوف، وتخطيطا عقليا لحقيقته، وأجساما لغوية للشعور به.<br />فالتعاريف والمصطلحات في كتب التصوف، آثرت الإشارة على العبارة، والذوق الوجداني على الإحساس الذهني، فكل يعبر حسب قدرته على تطويع الدلالة للإحساس الذي يقربه بعبارته..<br />بعبارة أخرى .. أن المصطلح عند المتصوفة لا يعبر عن ماهيته بل عن ماهية باطنية لا تنجلي بمعطيات العقل وحده..<br />حقيقة الشيء هي كل ما يقع، على ما هو واقع عليه، وواقع الحقيقة ما هو حاضر بصورته في خيالنا وإحساسنا، وما هو ماثل أمام إدراكنا المباشر بالحس والعيان، وإدراكنا للحقائق بهذا المفهوم مختلف، باختلاف أشخاصنا المدركة، ومتنوع بقوة أو ضعف إدراكنا للعناصر الجوهرية من العناصر الثانوية من الشيء الواقع مدرَكا، والكفيل بتبيان حقيقة الشيء ومدى تطابقها لذلك المصوَر في الذهن هو في أنظار المناطقة النظر العقلي والاختبار، وإن كان هذا يختلف باختلاف المستكنَه، فمستوى الحقيقة العلمية الموضوعية لا يدرك على حقيقته إلا بالاختبار، ومستوى الحقيقة الغيبية الوجودية هو الكشف، ومستوى الحقيقة المنطقية المفهومية هو التجريد كما ذكر بعض أهل البحث، فالتصوف حقيقة غيبية وجودية…<br />كل ما سبق ..ذكرته وأطلت فيه فحسب .. لتحفظي -الشخصي بالطبع- على الاستشهاد بالغزالي"
archived = "2009-08-28"
capture_url = "https://web.archive.org/web/20090828153725/http://www.20at.com:80/20at/salamo-3lakom/5797.html"

