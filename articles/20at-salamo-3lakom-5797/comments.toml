text = "السلام عليكم<br />شكرا لكم على فتح الباب لهذا الحوار، وهو الأمر الذي كنت وما أزال أحث عليه بدلا من الهروب منه.<br />على الصعيد الشخصي، عانيت كثيرا من الشك، وكانت لي تجربة صعبة، اعتكفت خلالها في صومعتي وأدمنت القراءة والتأمل.<br />النتيجة هي أنني خرجت بيقين تام ولله الحمد، وقررت على الفور الالتحاق بجامعة إسلامية لدراسة العقيدة والفلسفة بالرغم من تخرجي من الجامعة في اختصاص آخر.<br />وبما أني صاحب تجربة، فإني أرى أن تُخصص المواقع الشبابية الإسلامية أبوابا للحوار المفتوح حول هذه القضايا الشائكة، وقد طرحتُ هذه الفكرة على بعض المواقع، ولا أدري إلى أين وصل الأمر.<br />على أي حال، تعليقا على ما ورد، فإن أئمة أهل السنة والجماعة يرون أن المؤمن المقلد عاص، أي لا يجوز أن نؤمن لمجرد كون آبائنا مسلمين، بل يجب على كل مسلم التحقق من عقيدته وتحقيقها حتى يطمئن قلبه بالإيمان.<br />وهذا لا يعني بالضرورة الاطلاع على أعمال الفلاسفة والمشككين، بل أن ينظر كل منا إلى ما في قلبه من أسئلة، ويرى إن كانت ستؤدي به إلى بحار من الشك، ليسأل عنها أهل الاختصاص.<br />من جهة أخرى، فإن جميع الأعلام المسلمين الذين أقحموا أنفسهم في علم الكلام قد خرجوا بنتيجة واحدة، وهي الإيمان الفطري، ومن ذلك قصة الإمام الرازي: \"اللهم إني أسألك إيمانا كإيمان العجائز\"، والذي ندم في آخر عمره على اشتغاله بالكلام والفلسفة ورأى أن النظر في خلق الله هو أقوى دليل على وجوده وعظمته، دون حاجة إلى التفلسف الذي كثيرا ما يؤدي إلى العبث.<br />أما الغزالي، فقد وصل شكه إلى أقصى ما وصل إليه فلاسفة عصره، وانتهى إلى النتيجة نفسها، وهي أن العقل مؤمن بالبداهة.<br />لذا فقد نصح الرسول الكريم ص أصحابه بأن يتعوذوا بالله من الشيطان عندما يجدون شيئا من هذه الوساوس، وذلك لأنها من صنع الشيطان وليست من صنع العقل، ولا أدل على ذلك من كونها مناقضة له في الكثير من أولوياته، وهو ما يعرفه المشتغلون بالمنطق والفلسفة.<br />بالرغم من ذلك، فإننا ننصح كل من يرى أن هذه الوساوس قد خرجت عن حدها المألوف ألا يسكت عنها فيأثم بذلك، بل يفرغ ما في قلبه لمن يتفق الناس على علمه وصلاحه من علماء بلده، وقد يجد أن الحل أبسط مما كان يتصور، مهما بلغ من الذكاء.<br />أما المشكلة هنا فهي عندما يصطدم أحدهم بشيخ جاهل مقلد، فلا يجد منه إلا القمع والتخويف.. ما يؤدي إلى نتائج وخيمة يعرفها الجميع.<br />أخيرا، أقوم حاليا على إعداد عمل تلفزيوني حول شك الإمام الغزالي، وأرجو أن يكون فاتحة لأعمال أخرى، أسأل الله أن تنير قلوب الكثير من الشباب.<br />مع الشكر الجزيل."
archived = "2009-08-28"
