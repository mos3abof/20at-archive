text = "عايز تلحد و تخلي سبب الحادك عدم وجود العدل في الكون و وعايز \\\\\\\\\\\\\\\"ربنا\\\\\\\\\\\\\\\" ينزل من السما يدافع عن الحقوق اللي بتغتصب وبتقول ليه ربنا ماينزلش نبي زي ما نزل على بني اسرائيل أو على أهل جزيرة العرب<br />الحقيقة يا سيد ملحد كلامك عجيب وبيناقض بعضه مبدئيا ياعم العقلاني اللي عايز يفكر بعقله يلغي باه من حياته موضوع المعجزات ده<br />وعايز أقولك ان مش عشان فيه \\\\\\\\\\\\\\\"اله \\\\\\\\\\\\\\\" يبقى لازم الدنيا كلها تعيش في سلام و أمان و محدش يظلم حد ولا حد بقى يموت ولا حد يزعل على حد ولا الناس بقى تتضايق من أي حاجة بقى ,,,,,, والناس تضايق ليه بأة ما هو فيه اله عادل هيظبط الناس والأمور هتبقى في السليم وأنام بقى و أنا حاطط في بطني بطيخة صيفي ما هو فيه عدل والأله موجود<br />اسمحلي أقولك فكرتك عن الأله محدودة و سطحية الى أبعد الحدود لأن الأله يا عزيزي يرسي دعائم العدل في الكون وعلى البشر أن تقوم بتنفيذها وليس على الأله أن يمنع الظلم بل عليه أن يرفعه عن المظلوم ويعاقب الظالم بما ظلم<br />المهم هخليك تعتقد ان دينك هو عقلك والهك هو تفكيرك<br />تسمح تقولي لو واحد مثلا اتولد مختل عقليا فهو بلا دين اذن أو قل بلأحرى بلا اله<br />يا حرام كيف لهذا الرجل أن يعيش و يعبد هذا الأله بداخله… اذن فهو في شريعة الملحد \\\\\\\\\\\\\\\" ألحد الألحاد ذاته \\\\\\\\\\\\\\\"<br />وا الحاداه<br />مش انت بتقول<br />العقل هو الأله و أفكاره هي الدين؟<br />طيب يا سيدي ألا يفكر عقلك أو الهك أحيانا أن تمارس الجنس مثلا<br />أي اله هذا الذي يتدنى لمثل هذه الشهوات الحيوانيه ,,<br />ألا يشتهي عقلك مثلا كام ألف جنيه تشبرق بيهم نفسك<br />ألا يطلب منك عقلك قضاء حاجتك في أقرب مبولة بلدي لما تكون مزنوق ع الأخر<br />أله مين ده يا سيدنا اللي بتحكمه الشهوات و الرغبات هل يتدنى الأله الى هذه الصورة في نظرك<br />ثم هل لو تغير الوضع وكان المسلمون ينعمون بحياة أفضل هل كنت أمنت بالأسلام<br />يبدو من كلامك أنها ليست قضية عدم أيمان بالخالق و انما هي قضية انتماء الى مجتمع ضعيف متفكك مسلوب الحقوق في المقام الأول<br />اززي عقلك يابو عقل ؟<br />على فكرة ماذا لو نمت أو دخلت في غيبوبة مثلا ؟<br />هل لايزال عقلك يدير شؤونك وشؤون العالم وانت في غيبوبتك<br />طمني يا نجم هو انت لو ضربتلك \\\\\\\\\\\\\\\"جوينت \\\\\\\\\\\\\\\" بانجو و طرقعتلك قزازتين بيرة عقلك هيسكر ولا هيفضل على دينه \\\\\\\\\\\\\\\" الألحاد ليس الا\\\\\\\\\\\\\\\"<br />شوف أنا في كلامي معاك مش هحاول أجيبلك أي دليل ديني عشان مترجعش تقول أنا مش م}من باللي انت بتقوله من أساسه<br />أنا بس عايز أسأل سؤال هو مين اللي خلق الخلق ؟<br />هو مين اللي وضع النظام الدقيق ده في الكون قبل ما الكون يتوجد<br />وعلى فكرة نظرية الصدفة والهبل ده موضة وبطلت علميا من زمان اذ<br />انه تم اثبات أنه للكون قوانينه الدقيقة التي لايمكن أن تكون الصدفة أو العشوائية هي محركها الأساسي<br />اذ ان دقة المصنوع تدل على مهارة الصانع<br />اذا سلمنا جدلا \\\\\\\\\\\\\\\" ولله المثل الأعلى \\\\\\\\\\\\\\\" أن الطبيعة هي الخالقة !<br />فأين كانت الطبيعة قبل الخلق ذاته ومن الذي خلقها<br />قوانين الطبيعة ذاتها تؤكد بالدليل و البرهان أنه لكل مخلوق خالق كما أنه لكل مصنوع صانع<br />عالعموم يا عمنا يبدو أن مشكلتك ليست مع الألوهية وماهيتها وانما مع المحيط الذي تعيش فيه<br />شوف يا كابتن أنا عارف انك بتقول الكلام بتاعك ده وانت فاضي من جوه لا انت مؤمن بيه ولا نيلة<br />الحكاية كلها ممكن تكون غيران من حد مؤمن أوي ومش قادر توصل لدرجة ايمانه و ممكن تكون جيت تتعلم شوية دسن قابلك واحد معرفش يفهمك حاجة,,, ممكن تكون ناقم على شخص بعينه و هو ده اللي بيخليك تشوف الدين من خلاله فلما كرهته كرهت معاه الدين ككل أو ممكن تبقى أزمة انعدام هوية سايدة في عصر مش عارفينلو وش من ضهر ولا أول ولا اخر<br />امعن عقلك في الكون وادي بجد فرصة لنفسك وشوف \\\\\\\\\\\\\\\"ربك و ربي\\\\\\\\\\\\\\\" أبدع الخلق ازاي<br />ربنا لا تزغ قلوبنا بعد اذ هديتنا وهب لنا من لدنك رحمة انك أنت الوهاب\\\\\\\\\\\\\\\""
