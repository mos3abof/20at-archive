text = "( سحقا لاله لم نعرفه) عندما يستشري الظلم والاضطهاد والجوع والحنق والغضب الى اعلى مستوياته ,يدان الانسان ويصبر ويجوع ويصبر ويرى اولاده يتضورون جوعا امامه ويصبر ويموت ابنائه امامه ويصبر يدمر بيته ويصبر … الخ انا لا اتكلم عن اناس بؤساء في المريخ لا انا اتكلم عن اناس هنا اخوتنا اقربائنا اخواتنا نعيش بينهم ويعيشون بيننا ربما تختلف المسافات والظروف ولكن يبقى السؤال متى تنتهي امتحانات الله ؟؟؟؟ الهي اعطني جزاء صبري يوما مختلف عن الذي اعيشه ولكن اذا لم تكافئني على صبري لا اؤمن بك ابدا ولا اريد ان اؤمن بك حتى لو كنت حقيقة لا اريد الجنة يوما اريد ان اعيش فقط . بملء الفم اقول (سحقا …) . وشكرا اعذروني"
