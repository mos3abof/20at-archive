posted = "2007-05-09"
text = "فعلا اوقات كتير الواحد مر بالأفكار دي ، بل أنها قد تتردد علينا مرارا وتكرار وهذا يختلف من شخص لآخر طبعاً حسب درجة معرفة وأدراك ومدى ثقافة الانسان ، الذي تدور برأسه هذه الآفكار - سواء كانت شيطانيه تأخذ صاحبها إلي اللاعوده أو غير شيطانيه تِدي بصاحبها للحقيقه - أنا شخصياً لآ أميل لفكرة التكفير اللي بقت عمال على بطال دي أبداً حيث قد يبدي أنسان أفكاره الخاصه في مجلس بطريقة تفهم منها خطأ أو يتم تأويلها أو قد يكون فعلا له أفكار خاطئه قد يتراجع عنها بعد أقامة الحجه عليه والدليل.<br />بالنسبة لمداخلة الكاتب المتميز / أحمد ندا - أولاً مداخلتك قيمه ومتميزه بس أسمح لي أولاً أؤكد لك أني مش من المتصوفه بس في رأيي ان اعلام الفلسفه والفكر الاسلامي زي ابو حامد الغزالي وابن تيميه وابن رشد وابو حيان التوحيدي وابن عطاء الله السكندري و الحلاج و أبن عربي و… غيرهم الكثير سواء اتفقنا معهم ام أختلفنا ، هم في الحقيقه رجال صنعوا التاريخ وشكلوا وجدان هذه الامه الاسلاميه ( بما لهم وما عليهم ) ، يجب علينا أن نأخذ من كل منهم القدر الذي نشاء وفقاً لأفكارنا .<br />هم قدموا للأسلام الكثير وحوربوا بسبب أفكارهم وبسبب الظروف السياسيه التي كانوا يعيشونها في عصورهم …لما مثلته افكارهم تهديداً لعصور الخلافه العباسيه او الامويه او … ومن ثم يجب قراءة كتبهم وأفكارهم في إطار الظروف السياسيه والتاريخيه التي عاشوها.<br />يا سيدي نحن نجلس على مقاعدنا الوثيره وفي هواء التكييف المنعش لنقول هذا أصاب وهذا أخطأ…<br />أخيرأً مقالة رائعه ومداخلات تنم عن وعي أصحابها هدانا الله وإياكم سبيل الرشاد<br />( قل الحمد لله وسلام على عباده الذين اصطفى آلله خير أما يشركون &—64831;59&—64830; أمن خلق السماوات والأرض وأنزل لكم من السماء ماء فأنبتنا به حدائق ذات بهجة ما كان لكم أن تنبتوا شجرها أإله مع الله بل هم قوم يعدلون &—64831;60&—64830; أمن جعل الأرض قرارا وجعل خلالها أنهارا وجعل لها رواسي وجعل بين البحرين حاجزا أإله مع الله بل أكثرهم لا يعلمون &—64831;61&—64830; أمن يجيب المضطر إذا دعاه ويكشف السوء ويجعلكم خلفاء الأرض أإله مع الله قليلا ما تذكرون &—64831;62&—64830; أمن يهديكم في ظلمات البر والبحر ومن يرسل الرياح بشرا بين يدي رحمته أإله مع الله تعالى الله عما يشركون &—64831;63&—64830; أمن يبدأ الخلق ثم يعيده ومن يرزقكم من السماء والأرض أإله مع الله قل هاتوا برهانكم إن كنتم صادقين &—64831;64&—64830; قل لا يعلم من في السماوات والأرض الغيب إلا الله وما يشعرون أيان يبعثون &—64831;65&—64830; بل ادارك علمهم في الآخرة بل هم في شك منها بل هم منها عمون &—64831;66&—64830; وقال الذين كفروا أئذا كنا ترابا وآباؤنا أئنا لمخرجون &—64831;67&—64830; لقد وعدنا هذا نحن وآباؤنا من قبل إن هذا إلا أساطير الأولين &—64831;68&—64830; قل سيروا في الأرض فانظروا كيف كان عاقبة المجرمين (69)) سورة النمل<br />ببساطه جدا مهما تهت في زحمه الافكار ممكن تعرف ربنا سبحانه وتعالى لما تمر بحالة من الضيق أو كرب مهما كنت عاصي بتلاقي نفسك بتقول يارب يارب بالفطره"
archived = "2009-08-28"
capture_url = "https://web.archive.org/web/20090828153725/http://www.20at.com:80/20at/salamo-3lakom/5797.html"

