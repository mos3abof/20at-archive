author = "باحث عن الحقيقة"
posted = "2007-05-09"
text = "الأخت منى، حقيقة كنت أخال أني سأقرأ شيئا مختلف عندما قرأت العنونا وإذ بالموضوع أضعف بكثير من العنوان<br />ففي البداية أوردتي كلاما على لسان مشاركة بإحدى المنتديات لا يوجد فيما أوردتيه أي شيئا يدل على انها تشك بالله، اللهم إلاإذا اعتبرتي هذا الدعاء الذي تطلب به الدعاء من الناس<br />واكاد أجزم أنه لو لا العنوان ما كان أحد فهم علاقة المقدمة بالموضوع<br />الفكرة في حد ذاته فكرة قوية وموضوع كبير أعتقد أنك قمتي بمعالجته بشكل سطحي للغاية<br />أتمنى ان تقروا بأخطائكن وألا تكابروا<br />والمكابرة هذه أخذتها من تعليقات سابقة أوردتها لكم في صفحة الحرب الآن<br />على كل أتمنى لكي التوفيق"
archived = "2009-08-28"
capture_url = "https://web.archive.org/web/20090828153725/http://www.20at.com:80/20at/salamo-3lakom/5797.html"

