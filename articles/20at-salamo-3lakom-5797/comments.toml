author = "نيفين نيفى نوفا"
posted = "2007-05-09"
text = "لما بلاقى نفسى داخله ف دوامه الافكار دى زى اللى بتتكلم عنها منى بفتكر على طول كلمات الصديق رضى الله عنه لما قال :العجز عن الادراك ادراك و البحث فى ذات الله اشراك<br />و لما الرسول يقول :كان الله و لم يكن شىء قبله يبقى نحط فلوستوب و مفيش من اول السطر<br />انا تعمقت ف الفلسفه لفتره بس ساعات كتير يا جماعه الشك مبيوصلش صاحبه لليقين بل ممكن يوصله ورا الشمس اذا كان صاحبه لا يمتللك حجج المنطق و السؤال و الجواب و المناظرات النفسيه اللى ممكن توصله لليقين<br />بس سؤال لمنى<br />يعنى ايه خليل الله ابراهيم الذى امه ..اقصد ايه معنى كلمه امه<br />وعلى فكره يا منى عايزه اعرف بتجيبى الصور التحفه دجى منين<br />صوره الموضوع فكرتنى بصوره موضوع اللوحه"
archived = "2009-08-28"
capture_url = "https://web.archive.org/web/20090828153725/http://www.20at.com:80/20at/salamo-3lakom/5797.html"

