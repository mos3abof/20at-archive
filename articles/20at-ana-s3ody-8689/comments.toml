subject = ""
author = "وائل"
posted = "2008-04-30"
text = "بالرغم من أن موضوع الزواج في سن صغيرة ليس خطأ إذا ما أُخذ في الإعتبار مواصفات وإمكانيات وقدرات كلا من الزوجين فإن توافرت بهم وإلا فلا يجوز . وليس أدل على ذلك من إحصائيات نجاح مثل تلك الزيجات والنادر هو فشلها بل لا تكاد تسمع عن الفشل بها و العكس هو الصحيح في حالات الزواج فيما فوق العشرين عاماً<br />أما أن يعنون للمقال بكلمة أنا سعودي ومضمون المقال مع العنوان كأنه يوجه هذه التهم لكل سعودي فالكاتب هنا غير موفق في إختياره أو لنقل الجهل بدول أخرى تجري بها مثل هذه الزيجات<br />كلمة أخيرة .. لماذا دائماً ما نربط أذهاننا برد فعل الغرب ودائما الحرص على إرضائهم حتى وصل الأمر ببعض الحكومات أنها تتنازل عن ثوابت الإسلام لمجرد فكرة أن الغرب والإعلام الغربي غير راضي عن مثل هذه الأفعال"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630084938/http://www.20at.com:80/20at/ana-s3ody/8689.html"
