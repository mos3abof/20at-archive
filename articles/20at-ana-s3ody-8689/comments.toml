posted = "2008-04-15"
text = "عندما رأيت صورة الطفلين أعلاه ظننت للوهلة الأولى أنها صورة مأخوذة من إحدى حفلات الأطفال التي تقام في المدارس أو برامج الأطفال على سبيل الترفيه — ما هذا العبث؟ فلنفرض أنه حدث حمل — وهناك بعض الحالات التي تبلغ فيها الفتيات في سن صغيرة جدًأ- ستكون الأم الطفلة أم لطفلة أخرى - والولد الصغير اللي بيتكلم عن قدرته على مواجهة المشاكل — أي مشاكل؟!! وهو لسه بياخد مصروفه من أبوه —- هناك الملايين من حالات العنوسة في الوطن العربي — سايبين الناس دي ورايحين تجوزوا العيال؟؟؟!!"
