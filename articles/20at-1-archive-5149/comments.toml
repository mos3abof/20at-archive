subject = "الراجل ده عبقري"
author = "احمد"
posted = "2007-02-07"
text = "لأ فعلا انا إنبهرت من القناة دية حتي من قبل ما تذيع أي حاجة أولا واضح إن الأمكانيات عالية جدا و القناة مسكاها ناس خبيرة عارفة هيا بتعمل ايه ووراهم تمويل ضخم جداجدا جدا لن أي قناة بتبدأمالصفر لازم لها إعتمادات مالية<br />ثانيا:القناة فتحت يوم الأربع جيت عليها قلت اتفرج شوية إنبهرت لما لقيت كمية الإعلانات المهولة دي دي معجزة انه يكون فيه قناة يوم ما تفتح علي طول تبيع إعلانات ...... شوف قناة زي الراي و الرسالة اديهم قنوات مشهورة بس الأعتمادات المالية صفر لأنه مفيش إعلانانات واديهم فاتحين بقالهم سنين"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210045135/http://masr.20at.com:80/article.php?sid=1537"

