subject = "قناه عاديه"
author = "محمد"
posted = "2007-02-10"
text = "قناه عاديه و مفيهاش حاجه جديده غير شغل الجرافيك او الرسوم المتحركه و الموسيقي اماافكار البرامج فهي متكرره والمذيعين بعضهم كويس<br />ونجيب ساويروس مظبط القناه بالفلوس (17 مليون دولار) و عامل شغل علاقات عامه علي مستوي عالي و باين طبعا في الاعلانات<br />اما حكايه القناه مصريه مئه في المئه و قدره الفول و الراجل اللي بيشرب شيشه و بقيه الاعلانات عن القناه فهي اشياء انا مش شايف ان ليها ضروره جامده و تثير عندي علامات استفهام و مع ذلك لا نستطيع الحكم عليها غير بعد وضع الجدول النهائي للبرامج"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210045135/http://masr.20at.com:80/article.php?sid=1537"

