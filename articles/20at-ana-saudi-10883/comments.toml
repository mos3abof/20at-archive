posted = "2009-01-07"
text = "(كلام علمي و جد و عليه ادلة مقنعة) صواريخ المقاومة العبثية اقوى من طائرات الــ f16<br />تخيل ان عم ابو بشلة قرر انشاء فريق كرة قدم<br />و لان الفريق اصلا مكون من زكي مطاوي و عوض جنح و سعدون المعتوه<br />و المدير الفني هو الفشلة<br />طبعا لا يمكن نتخيل ان الفريق ممكن ينجح او يكسب او يدخل الدوري الممتاز<br />عم ابو بشلة حب يعمل دعاية للفريق فكلف شعبان عبد الرحيم انه يعمل اغنية يتحدى فيها فريق الاهلي انه يلاعب فريق ابو بشلة<br />الاهلي قرر يلعب مع ابو بشلة مباراه التحدي (غلطة عمره)<br />طبعا الاهلي فاهم حكمة الكابتن لطيف (الكورة اجوان)<br />بينما ابو تريكة مستلم مرمى فريق ابو بشلة و شغال احراز اهداف هو و اصحابه<br />طبعا فريق ابو بشلة قرر ينفذ خطته في اللعب و بكل قوة<br />فتم رشق ابو تريكة في ظهره بمطواه قرن غزال اثناء اللعب<br />الحكم فكر ينهي المباراه لكن فريق ابو بشلة ضغط عليه<br />و بدا لاعبي الاهلي يخرجوا من الملعب على نقالات<br />و قبل نهاية المباراه بدا بلطجية ابو بشلة في تهديد الحكم لالغاء الـ17 هدف لصالح الاهلي و احتساب اعداد المصابين من فريق الاهلي باعتبارها مكاسب حقيقية على الارض استطاع من خلالها فريق ابو بشلة انه يثبت جدارته و يخرج 7 لاعبين من الاهلي على نقالات و ربما لا يستطيعون اللعب بعد ذلك طول عمرهم<br />ربما استطاع ابو بشلة تكسيح الاهلي و ربما زور النتائج و اخد الكاس تحت تهديد السلاح<br />لكن الحقيقة ان فريق ابو بشلة خسر مباراه كرة القدم و كسب في البلطجة<br />لنفهم من المنتصر و الخاسر في اي لعبة لازم نفهم قواعد اللعبة<br />لو طبقنا هذا الكلام على ما يحدث في فلسطين و طبقنا نظرية د/عبد الوهاب المسيري الذي انفق هو و فريق من الباحثين 25 سنة من عمرهم في كتابة موسوعة عن الصهيونية ليعرفنا كيف نضربها في مقتل<br />نجده انتهى من بحثه بعبارة واحدة لو فهمناها صح و حتى لو كسلنا نقرا موسوعة الصهيونية فاننا نستطيع هزيمة الصهيونية في اقل من 20 سنة (كما تنبا بذلك الشيخ ياسين الذي قرر ان دولة اسرائيل لن تشرق عليها شمس عام و 2027 و عندما راجعه احد الصحفيين في هذا قبل استشهاده رد عليه بانه اكثر تشاؤما من بعض مفكري و قيادات و علماء الصهاينة الذين يشككون في تجاوز الدولة العبرية عام 2017 )<br />نعود الى خلاصة المسيري<br />هذه الخلاصة هي<br />\\\"الصهيوني اتى من انحاء العالم الى فلسطين ليعيش حياه افضل من التي يمكنه ان يعيشها في اوربا و امريكا<br />و ان الصهيوني الذي يقتنع بالفعل ان المقاومة مستمرة و قادرة على ازعاجه مجرد ازعاجه بتهشيم زجاج سيارته او اسماعه دوي انفجار كل مدة من الزمن او ارغامه على المبيت في الملاجئ بعض الايام من كل سنة فان اقتنع الصهيوني ان هذا الوضع سيستمر لا امل في انهائه فانه لا يتردد مطلقا في الهجرة من فلسطين و تركها للابد<br />و على من يريد رصد نجاح المقاومة او فشلها ان يتجنب النظر لاعداد القتلى عندنا و عندهم لان الطبيعي في كل تاريخ الحروب و المقاومة في العالم فان الطرف المستعمر كانت خسائره المادية اقل كثيرا من الشعوب المقاومة<br />و لكن لو اردنا قياس مدى نجاح المقاومة فعلينا البحث عن ارقام اخرى اكثر دلالة<br />ما هي هذه الارقام<br />ارقام الهجرة التي توقفت و التي لم تكن تنقطع قبل الانتفاضة و في فترات هدوئها<br />ارقام الصهاينة الحريصين على التجنس بجنسيات اجنبية بجوار الجنسية السرائيلية رغم ان هذا كان من المحرمات في العقيدة و الفكر الصهيوني لكن الواقع ان ما يقارب ثلث الصهاينة حاليا يحملون جنسيات و جوازات سفر اجنبية<br />ارقام من يقضون الاعياد بما فيها الاعياد اليهودية خارج حدود فلسطين بينما كان اليهود حتى وقت قريب من كل انحاء العالم يقضون الاعياد المقدسة في فلسطين<br />في مقابل ازياد الرغبة الفلسطينية في صلاة العيد في ساحات المسجد الاقصى رغم التهديد ااسرائيلي بالقصف<br />ارقام المتهربين من التجنيد<br />متابعة اعلانات و تسهيلات البنوك الاسرائيلية لشراء عقارات في امريكا و اوربا (فرنسا تحديدا) و بالتقسيط مما يعني اعداد كل مستوطن صهيوني لمكان بديل حالة استمرار المقاومة و ان هذه اصبحت رغبة منتشرة ما بين الصهاينة<br />اعداد من يحملون الجنسية الاسرائيلية اسما بينما يعيشون اغلب اوقات السنة خارج فلسطين<br />الاعفاءات الضريبية و التسهيلات و الخدمات المجانية التي يتم رشوة المستوطنين بها للاقامة في المدن التي تطالها اعمال المقاومة (الصواريخ العبثية كما نقول عنها)<br />و من ضن معايير المسيري لقياس عمر الدولة الصهيونية بحثه في النكتة الاسرائيلية و قد كان له في هذا بحث طريف منه هذه النكتة<br />و من النكات المتداولة في الشارع السرائيلي نكتة تقول<br />طبيب يسال المريض ما مهنتك<br />المريض : كاتب<br />الطبيب: في اي المجالات تكتب<br />المريض : مستقبل دولتنا<br />الطبيب : اذن انت تكتب قصص قصيرة<br />انتهى ما لخصته بتصرف من كلام المسيري في خلاصات بحثه عن نقطة ضعف هذه الدولة وشيكة الزوال<br />هل كلام المسيري مجاملة لحماس او لغيرها من الفصائل<br />هل هو كلام غير علمي و ان الرجل اضاع عمره في اوهام<br />هل قيادات الاستخبارات في امريكا و اسرائيل لا يهمها هذا الكلام و تعتبره فلسفة و كل ما يهمها هو قتل اكبر عدد من الطرف الاخر دون حساب جدوى<br />ليست هذه هي الحقيقة<br />الحقيقة ان الامريكان و الاوربيين و الصهاينة يحسبون الامور بحسابات اكثر فلسفة و تعقيدا مما نتخيل<br />الدليل<br />ايام ازدهار المقاطعة تعرضت شركة كوكاكولا مصر لخسائر فادحة قدرت بثلثي راس المال و نشر هذا في اعلانات رسمية في الاهرام و غيرها<br />و بحسابات الربح و الخسارة كان يجب انسحاب كوكاكولا من السوق المصرية لكن الواقع انه تم دعم الشركة بعدة ملايين لتستمر في السوق المصري برغم الخسائر<br />اي ان هناك حسابات اخرى غير مشروع خاسر او كسبان<br />و لقد قرات مرة مقال مترجم عن انزعاج دوائر الاستخبارات في امريكا و اسرائيل لان المقاطعة حققت اقصى نجاح لها في سلع الاطفال مما جعلهم يخرجون بنتيجة ان الجيل القادم (من كانوا اطفال عام 2000) هو جيل اكثر شراسة و اكثر رغبة في المقاومة في حين ان الجيل الجديد في اسرائيل اسرع مللا من قصة تاسيس الدولة و كفاح الاباء و اكثر تهربا من الجندية و اكثر رغبة في الحياة الرغدة البعيدة عن المشكلات من الجيل الذي اسس الدولة<br />اذن هناك حسابات اخرى<br />غير حسابات الاعلام العربي الساذج الذي يكتفي بتغطية اخبارية سطحية تقول لنا مات عشرة هناك مقابل 400 عندنا و كان النتيجة النهائية للمعارك ستتحدد بعدد القتلى من الطرفين<br />الواقع يقول<br />ان كل اسرة فلسطينية يموت لها طفل او شيخ في فلسطين فانها تزداد تمسكا بالارض (الام الفلسطينية تقول عايزة اموت بجوار اولادي)<br />الاسرة الاسرائيلية التي يتعرض زجاج منزل جيرانها للكسر تفكر بجدية في الهجرة من الدولة المزعومة و لا يثنيها عن قرارها الا وعود السياسيين الصهاينة عن خطط جديدة لنزع فتيل المقاومة او طرح مبادرة عربية جديدة للسلام<br />و قد اثبت المسيري رحمه الله هذا بجداول و احصاءات عن نسب الهجرة و الاستيطان و ارتباطها بمواسم المقاومة و مبادرات السلام او الاستسلام<br />و نخلص مما سبق<br />طائرات الـ f16 اثبتت ان الفلسطينيين نائمين في بيوتهم رغم القصف المستمر و انهم حتى لم يفكروا في ترك المنازل و المبيت في ملجأ او نفق<br />و ان طائرات الـ f16 تدعو الفلسطينيين الى مزيد من الارتباط بالارض و انجاب المزيد من الابناء ليعوضوا من مات بما هو ات<br />صواريخ المقاومة العبثية او الصوتية من وجهة نظر اعلامنا السطحي كل صاروخ منها يبيت مدينة كاملة في الملاجئ و يغلق المدارس لايام و يضطر الصهاينة لتخفيض الضرائب و زيادة الخدمات رشوة للمستوطن الاسرائيلي حتى لا يهاجر و يتخلى عن حلم الدولة المزعومة<br />و في النهاية اختم مقالتي الطويلة التي بدات بالكرة و انتهت بالحرب اختمها بالاسم الذي اطلقته الالة الحربية الصهيونية على المعركة<br />\\\"كسر الارادات\\\"<br />صواريخ المقاومة العبثية اصابتهم بانهيار عصبي<br />فهل كسرت ارادتكم يا اهل المقاومة<br />هل ستتخلى حماس و الفصائل الفلسطينية عن العبث بالصواريخ<br />و هل سيخرج الشارع العربي متظاهرا ضد حماس يقول لها اوقفي هذا العبث<br />اما انا فاقول استمري يا حماس في الــ… الـجــهـــاد<br />أ / محمد سعد حميدة ————— كاتب سياسي مصري"
