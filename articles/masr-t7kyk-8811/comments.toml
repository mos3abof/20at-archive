posted = "2008-05-29"
text = "يا جماعة الراجل بيعرض الموضوع بشكل موضوعي<br />تناول حاجة وجاب اللي ليها واللي عليها<br />وساب الحكم للي يقرأ<br />والشاطر يفهم اللي هو عايز يفهمه<br />واللا احنا ما اتعودناش صحيح على الموضوعات الموضوعية في المواضيع اللي في الموضع ده ."
