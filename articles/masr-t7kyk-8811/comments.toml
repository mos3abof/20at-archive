posted = "2008-04-19"
text = "بتوع اكياس الدم الملوث بتوع لجنة السياسات طلعوا براءة<br />يحيا القضاء العادل<br />اصل لجنة ا لسياسات هدفها التخلص من المرضى والفقرء وكل ا لعالم ا لهم بتو ع الدعم اللى عاملين وجع دماغ لحسنى وابنة<br />يبقى نموتهم واللى ينجح فى تمويتهم بالسم بالاكل ا لمسرطن بالمبيدات هياخد الجايزة وهنحمية<br />واللى ينشر امراض الكبد والسرطان وفقر الدم يبقى بطل"
archived = "2009-08-20"
capture_url = "https://web.archive.org/web/20090820040644/http://www.20at.com:80/masr/t7kyk/8811.html"

