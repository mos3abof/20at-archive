subject = ""
author = "حد معدى وخلاص"
posted = "2008-04-17"
text = "آنا آعرف ناس من التيجانية وحضرت آورادهم ، آقول لكاتب المقال آتقى الله فيما تكتب فمقالتك بها كثير من المغالطات<br />ياريت تسيبوا الناس فى حالهم مدام بيعبدوا ربنا ـ عايزين تهاجموا حد هاجموا الآعلام الداعر وسيل الراقصات من نانسى لهيفا للكتاب العلمانيين لكن سيبوا اللى عايزين يعبدوا ربنا فى حالهم مهما كان إنتمائهم<br />إتقى الله يا عبد الرحمن"
archived = "2009-08-20"
capture_url = "https://web.archive.org/web/20090820040644/http://www.20at.com:80/masr/t7kyk/8811.html"

