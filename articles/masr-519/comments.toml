[[comments]]
order = 17
subject = "عملنا كل حاجة فاضل السنما نحاول نصلحها بقى"
author = "حازم الهواري"
posted = "2006-06-29"
text = "السلام عليكم ورحمة الله وبركاته حقيقة احي محلل الفيلم على تحليله الجيد الغير متحيز وبصراحة كده يا شباب احنا امة طلعت القمر وسحقنا الزمن وخرقنا الارض وحلينا لغز الهرم وكل حاجة عملناها وعايشين بقى في رفيهية والبيضة مش ب75 قرش ولا حاجة والديمقراطية بنرفل في نعيمها وممكن اقول اللى انا عايزه واعمل اللى في راسي بدون ما اتحط في السجن ولا الاعتقال وشورعنا نظيفة وبيوتنا جميلة ومدارسنا فخمة ومستشفيتنا ضخمة ورئيسنا عادل وحكومتنا رحيمة خلاص كل حاجة اتعملت في حاجة ناقصة ؟<br />اه الغلابة اللى زيي اللى انضحك عليهم وقالولهم لودخلت هندسة ولا طب هتبقى حاجة كبيرة والبلد هتفرح بيك وانا زي العبيط خدت هندسة بس مافرحتش بيا البلد رحت الخليج قلت برضه اخونا وهيفرحوا بيا برضه نفس الحكاية شغلونى اه ادونى فلوس اه ونص كرموني اه وعليه الطلاق اه ونص بس برضه في نظرهم عااااااامل بشتغل عندهم<br />مش عارف ايه اللى جاب الموضوع ده شكلى خترفت نرجع لموضعنا<br />اننا عملنا كل حاجة فاضل السيماانا بشجع وبنادي اننا نعمل نادى لمنقذي السيما ومجاهدي السيما ونكرم كل اللى يموت ونعمله شهيد ونلفه في العلم لو مات في سبيل السيماوننسي موضوع العراق وفلسطين وكرمتنا اللى بتدوسها العساكر الانجاس ان كانوا امريكان ولا يهود وننسى اننا قربنا نموت من الجوع فعلا وبلاش ننتقد الوزير الحرامي ولا المسئول المرتشي<br />والله حرام اللى احنا فيه حررررررررررررررررام"
archived = "2006-06-30"
capture_url = "https://web.archive.org/web/20060630045018/http://masr.20at.com:80/article.php?sid=519&PHPSESSID=b0274f2f5e0ddd70ba140af1053a4aa2"

