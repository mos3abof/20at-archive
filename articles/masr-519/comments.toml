[[comments]]
order = 53
subject = "فيلم سوقي فعلا علي رأي ايمي"
author = "سمير"
posted = "2006-11-02"
text = "الفيلم فعلا فيلم سوقي ميعجبش غير بتوع الخضار اللي حاببين يشوفو فيلم علي زوقهم لكن لو هنتكلم علي شباب جامعي او مثقف معتقدش انهم هيقدروا يتحملوا تقل دم الفيلم والطريقة الشوارعية اللي بقي عليها حال معظم افلام السينما ومش هقول كلهالان فيه عندنا الزعيم عادل امام وفيه فيلم زي واحد من الناس وفيه حليم لاحمد زكي الله يرحمه لكن كنت عاوز اسأل فين الممثلين الكبار زي محمد صبحي ومحمود عبد العزيز ومحمود يس وحسين فهمي في الافلام؟ وبقت السينما لسعد الصغير مطرب اسواق الخضار ومصطفي كامل مطرب الميكروباص واللي عاوز يمثل يمثل والموضوع بقي لعب عيال واستخفاف لكن بخصوص شركة السبكي احب اقول ان السبكي نفسه لا يصلح للعمل بالسينما ابدا لانه من عوامل تخريبها وفي النهاية احب اقول الله يرحم فؤاد المهندس اللي صنع لنا السينما النظيفة الجميلة واللي لسة بنشوفها لحد النهاردة وبنستمتع بيها<br />miro_devilboy10@yahoo.com<br />miro_devilboy10@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102195157/http://masr.20at.com:80/article.php?sid=519"

[[comments]]
