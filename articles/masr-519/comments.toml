subject = "احنا مفيش عندنا سينما"
author = "مصري مقيم بدبي"
posted = "2006-06-15"
text = "يا شباب احنا في مصر مفيش سينما خلاص ,اخر الافلام المصرية اللي دخلته ويستاهل هو السفارة في العمارة واعتقد برده اني هدخل عمارة يعقوبيان مع العلم بقالي سنين مدخلتش حاجة لعادل امام نظرا للمستوي السئ بتاع افلامه."
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144306/http://masr.20at.com:80/article.php?sid=519"

[[comments]]
order = 2
subject = "اسمع وخلاص"
author = "برعى"
posted = "2006-06-15"
text = "كان زمان مهمة اضحاك المصريين مهمة صعبة لانهم فى الاساس من يصنع الضحكة ويصدرها لاكن فى الظروف الى بتعشها مصر الان اصبح الضحك وسيلة من وسائل الدفاع الا ايرادى عن النفس<br />كل العالم بتضحك علينا<br />بدل الكبت الى احنا فيى ممكن نضحك على اى حاجة نضحك وخلاص ودى اخر مرحلا<br />لان المواطن المصرى عندما يتوقف عن الضحك<br />تتساوى لدية الحياة والموت فينفجر فى وجوة من تسببو فى تعاستة<br />سبونا نضحك حتى لو ضحك مرضى احسن ما الشعب ينفجر لاننا لوانفجرنا مش هننفجر صح"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144306/http://masr.20at.com:80/article.php?sid=519"

[[comments]]
order = 3
subject = "مصيبة وحلت علينا"
author = "عمرو عبد الكريم"
posted = "2006-06-15"
text = "مصيبة وحلت عليناوهي الأفلام البايظة معظم الفنانين دلوقتي بيسعوا لأخذ الأموال وكيفية تحصيلها الموضوع بقي موضوع ازاي يجمعوا اموال عن طريق لخمة راس عن طريق لحمة راس مش هتفرق المهم ازاي يتحصلوا علي فلوس حتي لو ده علي حساب عقول الشعب المصري وعقول الأطفال اللي هما مسؤلية اهليهم انا بشوف في الشارع بيرددوا اغنية الفيلم هتجوز هتجوز هه لينا حق نفضل زي ما احنايا جماعة احنا اللي صنعناهم واحنا اللي جبنا المصيبة لنفسنا لما رحنا واتفرجنا علي اللمبي وعلي غيره مصيبة وحلت علينا والسبب فيها احنا مش هما وصدق الله ورسوله لن يغير الله ما بقوم حتي يغيروا ما بأنفسهم"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144306/http://masr.20at.com:80/article.php?sid=519"

