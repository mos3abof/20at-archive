[[comments]]
order = 56
subject = "الموضوع اكبر من كده يا جماعه"
author = "ماواا"
posted = "2006-11-04"
text = "السلام عليكم ورحمة الله وبركاته حقيقة احي محلل الفيلم على تحليله الجيد الغير متحيز وبصراحة كده يا شباب احنا امة طلعت القمر وسحقنا الزمن وخرقنا الارض وحلينا لغز الهرم وكل حاجة عملناها وعايشين بقى في رفيهية والبيضة مش ب75 قرش ولا حاجة والديمقراطية بنرفل في نعيمها وممكن اقول اللى انا عايزه واعمل اللى في راسي بدون ما اتحط في السجن ولا الاعتقال وشورعنا نظيفة وبيوتنا جميلة ومدارسنا فخمة ومستشفيتنا ضخمة ورئيسنا عادل وحكومتنا رحيمة خلاص كل حاجة اتعملت في حاجة ناقصة ؟<br />اه الغلابة اللى زيي اللى انضحك عليهم وقالولهم لودخلت هندسة ولا طب هتبقى حاجة كبيرة والبلد هتفرح بيك وانا زي العبيط خدت هندسة بس مافرحتش بيا البلد رحت الخليج قلت برضه اخونا وهيفرحوا بيا برضه نفس الحكاية شغلونى اه ادونى فلوس اه ونص كرموني اه وعليه الطلاق اه ونص بس برضه في نظرهم عااااااامل بشتغل عندهم<br />مش عارف ايه اللى جاب الموضوع ده شكلى خترفت نرجع لموضعنا<br />اننا عملنا كل حاجة فاضل السيماانا بشجع وبنادي اننا نعمل نادى لمنقذي السيما ومجاهدي السيما ونكرم كل اللى يموت ونعمله شهيد ونلفه في العلم لو مات في سبيل السيماوننسي موضوع العراق وفلسطين وكرمتنا اللى بتدوسها العساكر الانجاس ان كانوا امريكان ولا يهود وننسى اننا قربنا نموت من الجوع فعلا وبلاش ننتقد الوزير الحرامي ولا المسئول المرتشي<br />والله حرام اللى احنا فيه حررررررررررررررررام<br />أقول ايه تانى<br />مفيش حاجة تانية اقدر اضيها<br />ربنا ينتقم من الضلمة<br />السيما المصريه ديه مش سيم ده هكس على الشعب المتخلف احلى أفلام هى افم أحمد السقايحميرلاد المتناكه<br />نوعية الافلام دى موجوده عندنا من زمان..والجماهير بتصقف لها ومبسوطه والدليل على الكلام ده الايرادات يا سيدى الفاضل ؟ مفيش فيلم من ا<br />اقرأ بقية التعليق .."
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111171001/http://masr.20at.com:80/article.php?sid=519"

[[comments]]
order = 57
subject = "كس الارض بيبضن على خلق الله"
author = "انا الكس"
posted = "2006-11-04"
text = "• والى : لا لمبارك فى الحكم لا لإبنه المختل عقلياً الفاسد ل...<br />• البورسعيدى : بعد أن إنخفضت شعبيه تونى بلير بسبب قراراته الخاطئة...<br />• مصراوي قديم : رب نازلة ضاق بها الصدر ذرعا و عند الله منها المخر...<br />• إبن بهية : نسألكم الفاتحة على روح فقيد الأمة الأزهر الشريف ...<br />• إبن بهية : يذكر أنه كان في بلاد مصر شيخاً جليلاً مجلجلاً مدجن...<br />المزيد..<br />أضف<br />مصر هتستورد طماطم من ليبيا.. باين كده الطماطم اللي بنزرعها مش مكفية الكوسة اللي في البلد.<br />المجلس القومي.. ابن الحكومة الضال!<br />تحجيم دور أعضاء المجلس<br />فشل صفقة بيع عمر أفندى!<br />العمل علي افشال الصفقة<br />\"لخمة راس\".. والمتفرج المتخلف<br />مثل كل الأفلام التي تعتمد علي افتراض أن المتفرج متخلف حتى يثبت العكس<br />14/06/2006 رامي عبد الرازق - المصري اليوم<br />من أكثر مساوئ انفصال \"الأخوين السبكي\" أنه صارت هناك شركتان للإنتاج بنفس معايير الذوق الرديء واختيار النصوص التي ليس لها علاقة بالسينما أو حتى \"بالجزارة\".<br />أولي كوارث هذا الانفصال هو فيلم \"لخمة راس\" الذي كتبه احمد عبد الله بعد أن تراجع من كاتب نجوم الصف الأول (هنيدي وعلاء ولي الدين رحمه الله) إلي كاتب لمن يحاولون اجتياز الصفوف الخلفية (أشرف عبد الباقي وأحمد رزق وهاني رمزي).<br />الفيلم يدور في قالب هزلي يعتمد علي خليط غير متماسك من كوميديا المواقف والإفيهات، ولكنها مواقف هشة وإفيهات مبتذلة مستوحاة من الأسلوب المسف لبعض الكوميديات الأمريكية التي تعتمد علي أصوات الغازات وا<br />اقرأ بقية التعليق .."
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111171001/http://masr.20at.com:80/article.php?sid=519"

