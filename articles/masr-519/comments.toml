subject = "لا احنا عندنا سينما"
author = "نيفين نيفى نوفا"
posted = "2006-06-20"
text = "و سينما جامده كمان<br />و الدليل ان زى ما فيه لخمه راس و فيه برده عماره يعقوبيان و حليم اللى مجرد مشاهده البرومو بتاعه بيخلينى اعيط<br />و فعلا شركه الاخوه اديب دى(جود نيوز)بتعمل سينما صحبس ارجو الايعتبر رايى دا تضامن مع الاباحيه اللى فيلم عماره يعقوبيان لان انا بتكلم عن التقنيات السينمائيه<br />وزى ما كان فيه ابو العربى و غبى منه فيه و عسكر ف المعسكر<br />كان فيه برده تيتو و حب البنات و السلم و التعبان و سهر اليالى و كتيير<br />و ربنا يرحمنا بس من الؤلفين امثال وحيد حامد و المخرجين امثال شريف صبرى و السينما هتبقى بخير"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144306/http://masr.20at.com:80/article.php?sid=519"

