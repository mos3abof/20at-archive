posted = "2006-11-04"
text = "لخـمـه راس مـجـرد فيـلم بيـجـيـب فـلـوس مـلايـيـن بـتـجـيـب مـلايـيـن وكـفـايـه عليهـم سـعـد الصـغـير لـيه جـماهـير عـدد نجـوم الـسـما كـفايه لو عـمل فيـلم لوحـده ومـش معـاه حـد هـينحج بـردو لحـمه راس فـيـلـم تجـارى مـش اكـتـر يعـنى لمـا اقـول يبـقى النـاس تعـزونى عـشـان كتير من الشـباب بيتـناكـوا فى الشـغـل عـشـان الفلـوس وبيكـونو زى ماهـماوكـلـه بـسـبـب الحـرمـيه ولاد المـتناكـه اللـى وكـليـين البـلد المعـرس الـكـبـير يعـنى لازم تـتـناك بجـد عـشـان نجـيـب فـلوس"
