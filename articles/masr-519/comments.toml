text = "يبدو ان القائمين على صناعة السينما فى مصر يعانون من تخلف مزمن والدليل هو هذا الكم الردىء من ما يسمونه افلام لا تعكس سوى تخلفهم فاصبح الجميع بقدرة قادر كوميديانات قابل ذلك انحدار فى الذوق العام للشعب المصرى فاصبحنا لا نسمع الا الغناء الهابط ولا نرى الا الفيلم الغبىوكان هناك منظومه تسعى لمحو هوية المواطن المصرى وتقديمه فى نيو لوك المتخلف العصرى وانا لله وانا اليه راجعون"
