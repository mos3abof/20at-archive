text = "بعد التحيه اذا اردتم التفرج على لخمة راس يكفي النظر اللى الاخبار على ايةقناة اخبارية مش بس حتتلخم ممكن تتجلط لو في بقيية باقية من الناموس والعروبه اما اذا كان هناك اي ذره من الاخلاق حتتمسح عند الاستماع الى اي فيديو كليب والنظر الى راقصات التعري العربيات المسميات باسماء النجوم والملقبات فنانات وخصوصا كليبات الافلام.....رحم الله العرب جميعا الفاتحة على الكرامة العربيه والاخلاق الانسانيه وشكرا"
