subject = "فعلا صحيح"
author = "بوسى"
posted = "2006-10-11"
text = "الموضوع بجد تحفة ومفيد جدا لكل المصريين والعرب الذى ينظرون للطفل او الطفلة على انهم مجرد دمى لا عقول لهم مما يضعف منهم ومن مهاراتهم فى كبره<br />وهذه هى الكارثة ...."
archived = "2006-11-02"
