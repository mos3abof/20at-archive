[[comments]]
order = 0
subject = "واء .... واء"
author = "سالى"
posted = "2006-10-10"
text = "هو عياط الواد طلع موضوع كبير قوى كده ... طب تعمل ايه فى شعب بيعيط بقاله ربع قرن وامه مش عايزة ترضعه ...<br />مش كده ولا ايه يا نظيف افندى ..<br />بالمناسبة شبكة الموبيل بتاعتنابتسقط كتير لو لاقيت وقت عندك \" ابى تعالى<br />صلحالنا بس ابقى وطى وانتا داخل الحارة عشان انتا مش نظيف بس انتا طويل قوى كمان ....<br />بس الموضوع بصراحة جديد... عايزين منه تانى !!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114526/http://www.20at.com/article2.php?sid=1333"

[[comments]]
order = 1
subject = "مفيد جداً للأمهات"
author = "Serendipity"
posted = "2006-10-11"
text = "موضوع مفيد و جميل يا شريف، أنا بقول ياريت نعمل دعوة لكل الأمهات أو المقبلين على الزواج حتى أنهم يقروه، خاصة و أن معظم الأمهات بيعاملو آولادهم اللي في السن دة و ما فوق و كأنهم بلهاء، و أضيف معلومة أن الإنسان تصل معدلات ذكاءه لأعلى معدلات في سن السابعة، و بعد ذلك تنحدر<br />يارب موضوعك يفيد الناس انشاءالله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114526/http://www.20at.com/article2.php?sid=1333"

[[comments]]
