text = "اقتباس روضة:<br />اقتباس ابومحسن:<br />وزارات ورا وزارت هتعيش على حلمنا<br />و اللي بيجى يادوب مظبوط على قدنا<br />جايز هيجي اليوم والشبكة تيجى إنما<br />تفضل فلوس الشقة ودة شيء بعيد عننا<br />جايز هيجي اليوم والشقة تيجى إنما<br />هتكون سنانك وقعت قربت على 100 سنه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــت<br />فكره يا روضه<br />انا فعلا لما سرشت باسمى لقيت حد كاتب كده من الواضح انه حضرتك<br />ربنا يكرمك رفعت من روحى المعنويه بعد توقف سنه ونصف عن الكتابة<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />معلش انا زي والدك<br />القصيده دي كانت في احد مواضيعك القديمه<br />اصل انا زاكرتي حاده شويه"
