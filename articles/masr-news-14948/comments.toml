posted = "2010-01-19"
text = "في حاجة مش وخدين بالكم منها<br />انا فهمه كويس ان الاخوة اللى حاضروا في المؤتمر في وادى ، والحكومة في وادي<br />لكن عجبنى اعترافهم جميعااااااااااا اااا من اول مكرم ان الاحزاب كلها تستعمل البلطجية والفلوس، وان الحكومة بتعتقل المرشحين نفسهم لو مش عيزاهم زى الاخوان<br />لكن انا فهمه كويس يا معلق رقم 2 ، لانى حضرت انتخابات الشورى وحضرت انتخابات مجلس الشعب 2005 ، فهمه انهم بيحلموا ، لكن انتخابات الشورى اللى فاتت الاعلام فضح التزوير من خلال فيديوهات اتصورت من مواقع امام للجان لموظفي اللجنة وهو بيحط \"كبشة\" ورق في الصندوق<br />وابويا مكنش معار<br />سمونى روضة عشان \" في روضة يحبرون\" سورة الروم<br />شكرا ليكم"
archived = "2010-01-20"
capture_url = "https://web.archive.org/web/20100120002939/http://www.20at.com:80/masr/news/14948-2010-01-18-17-46-13.html"

