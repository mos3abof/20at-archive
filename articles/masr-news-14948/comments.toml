author = "اجدع نكتة"
posted = "2010-01-18"
text = "يا ست روضة هل انت مبتدئة فى السياسة ؟<br />اعلام اية اللى هيراقب الانتخابات<br />اللى هيحصل زى اللى حصل قبل كدة عشرات المرات<br />الحكومة بتنتخب الحكومة واللى هيراقب برضة الحكومة واللى هيعلن النتيجة برضة الحكومة<br />بمعنى ان اعضاء لجان الانتخابات الناس اللى قاعدة فى اللجنة واللى بيفرز الاصوات موظفين حكومة وبينفذوا تعليمات الحكومة<br />واللى واقف على باب اللجنة امين شرطة وضابط بوليس من الحكومة<br />واتوبيسات الشركات والمصانع بتاع الحكومة هتشيل الموظفين الى لجان الانتخابات وهينتخبوا اللى بتقول علية الحكومة<br />واليفط القماش اللى بتتعلق فى الشوارع بتاع الانتخابات نتيجة ان ضابط بوليس او امن دولة بيلف على اصحاب المحلات والدكاكين يجبرهم ويهددهم ان اللى مش هيعلق يافطة تأييد للحزب الحاكم هيتلغى الترخيص بتاعة والمحل او الدكان هيتقفل<br />اعلام اية يا روضة اللى هيراقب<br />على فكرة اسم روضة دة خليجى<br />انت اتولدت فى الخليج لما بابا كان معار او بيشتغل هناك<br />تحياتنا يا ست روضة وبالتوفيق"
archived = "2010-01-20"
capture_url = "https://web.archive.org/web/20100120002939/http://www.20at.com:80/masr/news/14948-2010-01-18-17-46-13.html"

