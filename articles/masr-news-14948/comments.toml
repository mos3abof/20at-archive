text = "وزارات ورا وزارت هتعيش على حلمنا<br />و اللي بيجى يادوب مظبوط على قدنا<br />جايز هيجي اليوم والشبكة تيجى إنما<br />تفضل فلوس الشقة ودة شيء بعيد عننا<br />جايز هيجي اليوم والشقة تيجى إنما<br />هتكون سنانك وقعت قربت على 100 سنه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــت<br />فكره يا روضه"
