order = 0
subject = "عايز افهم وفهمونى"
author = "من الانفار العواطلية"
posted = "2007-02-19"
text = "فى مصر بلدنا مليون عيلة كويسة وناس مبسوطين ومتعلمين وعندهم ارض وكويسين قوى<br />اشمعنا عيلة اباظة<br />ايام سينما اااالزمن الجميل كان فية رشدى اباظة وكان ممثل رائع<br />وكاتب اسمة فكرى اباظة<br />وكاتب اسمة ثروت اباظة<br />وممثل اسمة احمد اباظة<br />ووجية اباظة محافظ البحيرة وعضو الثورة<br />او من الضباط الاحرار ووكيل البيجو<br />و ماهر اباظة وزير الكهرباء السابق<br />واباظة دلوقتى ماسك الوفد<br />وغيرة وغيرة وغيرة<br />ماشاء اللة عليكم<br />بس وبجد مفيش واحد منكم حرامى ولا نصاب<br />ياريت واحد منكم يترشح لحكم مصر"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221031053/http://masr.20at.com:80/article.php?sid=1614"

