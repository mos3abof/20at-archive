order = 1
subject = "المعارضة"
author = "المعارضة الحزبية الرسمية فى مصر معارضة مأجورة و عميلة و خاينة إشترى مبارك ذمتها و توجهاتها و رسالتها بعضمة من الوهلة الأولى. ظهرت حديثا بدلا منها معارضة بطلة جاسورة حقيقية غير رسمية من نوع جديد لم يألفة أو يتصورة مبارك متمثلة فى الإخوان المسلمين وحركة كفاية و أيمن نور وطلعت السادات و رفاقة و أقباط المهجر و إبراهيم عيسى و وائل الإبراشى و رفقائهما و حمدين الصباحى و زملاؤة و عبد الحليم قنديل و عبد اللة السناوى و رفاقة و سعد الدين إبراهيم و الكاتب الكبير حسنين هيكل و الشاعر العظيم أحمد نجم و غيرهم بالإضافة الى مدونات الإنترنت التى تطورت الى إنتفاضة شعبية إليكترونية ضد نظام حسنى مبارك. مبارك فى بادىء الأمر تصور بغرورة إنة بمقدورة سحق هذة المعارضة الشعبية الوليدة كما سحق الكثير من قبلها. المعارضة الجديدة قاتلة فهى تغتال ببطىء مطلوب بغرض الإنتقام و التشفى أفراد أسرة مبارك. هذة المعارضة لا تغتال بالرصاص. إنها تقتل بالقلم . قلم هؤلاء المعارضون الجدد لازع و فاضح و جارح و موجع و ملهب فهو سوط يدمى ظهر حسنى و سوزان و جمال و علاء و عصابتهم بلا هوادة أو رحمة أو شفقة. أوقع زعماء المعارضة الشعبية الأبطال سالفى الذكر خسائر فادحة فى صفوف العيلة مغتصبة الحكم اللى طلعت فافى قوى و لا قبل لها بتحمل الضغوط و التقريع و السخرية و التنكيت عليها ليس فقط لإن صحة أفرادها معتلة أصلا و لكن أيضا لتضخم و تألة ذاتها. فكلما أعطت المعارضة الجديدة قلم على قفا مبارك و عيلتة الممنوعين من الرد بأوامر من أنكل سام كلما سقط فرد من هذة الأسرة اللعينة صريعا للمرض. فى الكام شهر الماضيين أصيبت سوزان بالسكر و الضغط و الذبحة الصدرية و سرطان الكلى بخلاف سرطان الدم الذى تعانى منة. و أيضا أصيب جمال مبارك بالسكر و الضغط و يوشك ب"
posted = "2007-02-19"
text = "اقرأ بقية التعليق .."
archived = "2007-02-21"
