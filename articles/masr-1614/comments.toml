[[comments]]
order = 13
subject = "اخوانى"
author = "عم دهب"
posted = "2007-02-21"
text = "الاخ فارس يغالط نفسه فى غمره دفاعه الدائم عن الاخوان ، ولا اعرف القدره التى يتمتع بها الاخوان فى وضع كل من يؤمن بهم على الحافه طوال الوقت ( حافه الغضب و الغليان ) فهم دائما متحفزون وفى حاله استعداد دائما للانقضاض على كل من يتجرا و يفتح فمه تجاه الاخوان فورا و باقسى الكلمات ودون اى محاوله حتى على اضعف الايمان لكسب هذا المعارض ، كلا انه الهجوم السريع و الحاسم على هذا الحاقد الخائن عميل الحكومه وربما الكافر ايضا هذا بخلاف الشتائم طبعا مما يقطع اى طريق للوصول الى حوار ما ، وصدقنى يا اخى لا فرق عندكم بين من ينتقد بشكل هادىء و محترم وبين من يسب و يخرج عن الاداب ، فالاخوان وكمصدر قوتهم الاول و الاكبر جعلوا من انفسم القائمين على الاسلام الصحيح و الوحيد و الحقيقى فبالتالى اصبح كل من يتعرض لهم بالنقد وكانه تعرض للدين الاسلامى كله وصدقنى ايضا هذا فى حد ذاته اسوا واخطر ما فى الاخوان فبهذا تنعدم تماما اى فرصه للحوار و للحريه و للديموقراطيه ، فمثلا لا معنى ان تقول انك مسلم الى حد ما او انك تؤمن بالاسلام فى اشياء و اشياء بل اما تؤمن بالدين كله ايمان صحيح و قوى و اما انك غير مؤمن ، نفس الحال هنا اما انك مقتنع بالاخوان كقوى اسلاميه اولى وربما اخيره فى الوطن و كبديل وحيد للسلطه واما انك خائن و حاقد وعميل و هذا والاخوان بعيدين عن السلطه فما بالك وهم فعلا فى السلطه وفى يدهم القوه التى تبطش بمن يعاديهم ، الفارق الوحيد بينهم وبين اى قوى حاكمه اخرى انهم بدلا من القبض عليك او حتى قتلك بتهمه دنيويه او قانونيه سيتم هذا بتهمه دينيه فانت يا اخى لا تريد نقلنا الى الحكم الاسلامى الصحيح بل تريد نقلنا الى ما يشبه حكم الباباوات فى روما فى العصور الوسطى ، ومن كلامك نفسه يتضح كل كلامى فانت قلتها ( بلاش يمشي م<br />اقرأ بقية التعليق .."
archived = "2007-02-21"
