subject = "الكابوس القادم"
author = "نخلص من كابوس التوريث الحقير وندخل فى كابوس التعصب والتخلف"
posted = "2007-02-20"
text = "الاخ الى بيدافع عن الاخوان وبيتكلم عن تاريخهم ياريت متجبش سيره تاريخهم لانى تاريخهم زى الزفت واقرا وانت تعرف .<br />اه يعنى 2 دكاتره و3 مهندسين و4رجال اعمال مؤمنيين بفكر الاخوان لكن بص للباقى كل همهم فى السلطه وبس ناس جعانه سلطه وفى منهم الى ولافاهمين حاجه فى الاسلام ولافاهمين حاجه فى السياسه يبقى دول نمشى وراهم ليه حراااااااااااااااااااااااام.<br />هو ياما توريث ياما الجماعه المتخلفه دى تمسك البلد مفيش امل انى الناس الكفء هى الى تمسك البلد"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221031053/http://masr.20at.com:80/article.php?sid=1614"

[[comments]]
order = 6
subject = "كفاية إدعاءات كاذبة"
author = "فعلاً الإخوان المسلمين هم أكفء ناس للحكم وخاصة وأن لهم قاعدة شعبيه عريضة من ابناء مصر ولجان الإنتخابات تشهد على ذلك وطبعاً ده كان قالق مبارك وخلاه جرى على إسرائيل علشان تنقذه والإخوان هما أقرب ناس للشعب بما يقدمونه من خدمات ولم نسمع عن أى تاريخ فاسد لهم سوى ما يفعله مبارك وعائلته بهم ليشوهوا صورهم أمام الإعلام الغربى طمعاً فى مساندتهم لتوريث الحكم لكن الإخوان هم الأكفء وعن جدارة وخلق وطبعاً لا نرى منهم إلا الكفاءات أمثال الدكاترة والمهندسين ورجال الأعمال والخبراء وأساتذة فى كل الجامعات ولأنهم يتقون الله فلهم شعبية كبيرة وأطمئنان شعبى لهم وهذا أيضاً ما يقلق مبارك ويدعى أنهم متصارعين على السلطة ولكن متى حكم الإخوان مصر حتى نكون قاسيين عليهم فى الحكم وعلى فكرة مبارك حين كان يحارب أيمن نور صورة للشعب على إنه فاسد ومزور مع أن مبارك على تزويره يستحق مؤبد فهو لم يترك إنتخابات إلا وزورها وأيضاً حينما كان يحارب طلعت السادات كان يظهره بأنه أهان الجيش مع أن مبارك أهان الجيش والشعب والحكومة والبرلمان والدستور ويستحق أكثر من السجن ولكن الآن لم يبقى أمامة سوى الإخوان المسلمين فهو يكثف جهوده لمحاربتهم والإدعاء عليهم ولكن الشعب هو الحكم وما يفعله مبارك معروف للشعب لضئالة حكم إبنه وكفاءته أمام كفاءة وشعبية الإخوان بالإضافة لتاريخ عائلة مبارك الملوث بالدماء والنهب والعمالة والظلم فهم ليس لهم أى قبول شعبى والشعب كله يرفضهم لفسادهم رغم بقاؤهم فى الحكم بدون شرعية ورغم سعيهم للتوريث المرفوض نهائياً شكلاً وموضوعاً ولا يعترف مبارك بالتداول السلمى للسلطة فكيف لحاكم يحكم بدون برنامج ولا نائب ولا دستور وكل ما يحتمى به عصا وحذاء الأمن المركزى هل يعتبر نفسه حاكم أم كما هو فى نظر الشعب محتل ومرفوض كلية ول"
posted = "2007-02-20"
text = "اقرأ بقية التعليق .."
