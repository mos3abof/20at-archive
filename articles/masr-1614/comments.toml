[[comments]]
order = 7
subject = "لا لمبارك"
author = "منذ ربع قرن وأكثر والحزب الوطنى هو المنفرد ورئيسه هو المنفرد بالحكم ونحن نعلم جميعاً كيف جاء أعصائه أما بالتزوير أو بالتعيين أو بالمحسوبية والصداقة لجمال مبارك وكل الفساد اللى موجود فى مصر أتى من الحزب الوطنى سواء تجارة مخدرات أو قضايا دعارة أو إستيلاء على المال العام أو سرطنة الزراعات بالمبيدات أو تجارة فى السلع الفاسدة أو حصد أرواح المصريين وغيرها كثير"
posted = "2007-02-20"
text = "لماذا لا يكون هناك تغيير ويحكم مصر فئة أخرى لها شعبية لم تأتى من فراغ ولكن من شعور الشعب بالفارق بينهم وبين الحزب الوطنى ولكن ما يحدث هو الدكتاتورية وعدم رغبة الحاكم فى أى تداول سلمى للسلطة ولمقادير الحياة فى مصر التى يعتبر مصر كلها من أملاكه مما أعطاء الجراءة أن يزور فى كل إنتخابات وأن يفرق قانون الطوارئ على الشعب حماية لعرشة ولفساده وفساد عائلته ولتكميم الأفواه لعدم تجرأ الشعب لرفضهم ولكن بعد أن ساءة أمور الحياة فى مصر من فقر وفشل فى التعليم والصحة وكان السبب هم الحزب الحاكم ورئيس أصبح الشعب فى رفض هائل لمبارك وعائلته نهائياً فكيف لرجل أتى للحكم بالتزوير يجرؤ على توريث إبنه الغير مناسب لمصر لو كان إبنه عنده حلول لمشاكل مصر ليه مقدمهاش وهو عمال ينهب فى خير البلد ويهربه بالمليارات بره منين جاب مشاريعه دى لية ميقدمش حساباته الحقيقية للشعب هو وأبوه وأمه أين الشفافية والمصداقية التى يتشدقون بها وهم لا يعلمون عنها شيء<br />لماذا لا يحدث تغيير للحاكم هل كتب مصر بإسمه أو ورثها حتى يورثها مصر للمصريين جميعاً مسلمين ومسيحيين ومن فشل فى حكم مصر فهناك من هو أكفء منه ولا حكر لحكم مصر على مبارك وعائلته والرأى للشعب الرافض لهم الطالب لتغيير حكم فاسد منتهى الصلاحية غير شرعى بحكم الإخوان الذين لم يرى الشعب منهم سيء وكل دعواهم لخير مصر ولك<br />اقرأ بقية التعليق .."
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221031053/http://masr.20at.com:80/article.php?sid=1614"

