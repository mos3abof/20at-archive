author = "كفايه"
posted = "2007-02-21"
text = "مع الاسف رد الاخ لا مش كفايه ليس اكتر من رد شخص متعصب و كان هاين عليه يشتم باكتر من كده لولا بقيه باقيه من دم ، كالعاده معظم رواد هذا الموقع المشبوه من الاخوان و يتظاهرون بالعكس وكانهم من عامه الشعب العادى الذى لا انتماء له و لكنه يا عينى بيحب الاخوان لله فى لله و متعاطف معهم .. وكالعاده الاخوان يقولوا ما ارادوا من افتراءات و تخاريف والكل يصدقهم اما من يتكلم عنهم فهو كاذب مدع"
