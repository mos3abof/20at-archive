author = "إبن بهيه"
posted = "2007-02-20"
text = "أقتبس في تعليقي هنا جزء من مقال للأستاذ المحترم إبن بهيه قرأته في موقع آخر<br />إليكم هذا الاقتباس<br />الأزمة الحقيقية التي تواجهها مصر وليس الإخوان المسلمون وحدهم لا تأتي من الاضطهاد الأمني للإخوان ، فهو قليل وقليل جدا مقارنة بما تعرض له الإخوان في السابق ولكن الأشد والأعنف في رأيي هو الهجمة الإعلامية حيث جند النظام كل أسلحته وأبواقه الإعلامية ضد الإخوان ، لا لشيء سوى رعب النظام من الإخوان المسيطرين على الشارع بلا أي شك في هذا وللأسف ينزلق بعض المعارضين للنظام والإخوان وراء مكتبجية السلطة فيشنون هجماتهم على الإخوان بلا أي مبرر وبعيداً عن الموضوعية ، لقد حصل الجميع على إشارة البدء من لسان صاحب الإشارات رئيس الدولة حين قال بأن الإخوان خطر على أمن مصر ، ولو كان لدى هؤلاء السماسرة قدرة على التمييز لأيقنوا في لحظة من يمثل الخطر الحقيقي على أمن مصر ؟ الإخوان أم الرئيس وسياساته التي عزلت مصر عن محيطها التاريخي والجغرافي وخنقت دورها الإقليمي والدولي وهوت من عليائها لتسقط وسط الدويلات التي لا وزن لها ولا قيمة لا دولية ولا إقليمية.<br />الخطر على أمن مصر يا سادة هو من يدع حدودها عارية أمام العدو من كل الجهات ، الخطر على أمن مصر هو من أفقدها أي دور تاريخي لها في المنطقة وتنازل عن هذا الدور لقوى ودول أخرى كان في القريب يصفها بالرجعية والتخلف (رغم أننا لم نكن نرضى لها ذلك الوصف في السابق) فإذا به يترك لها المجال وحيدة تعربد بتخلفها ورجعيتها الحديثة المطعمة بالبهارات الصهيوأمريكية. الخطر على أمن مصر هو من يريد تحويلها من دولة عظمى في المنطقة الأهم والأخطر في العالم إلى دويلة أو عزبة خاصة مملوكة له ولمن يرضى عنه من ذئاب تنهش جسدها أمام عينيه طيلة ربع قرن. الخطر على أمن مصر هو من فتح أسواقها أما<br />اقرأ بقية التعليق .."
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221031053/http://masr.20at.com:80/article.php?sid=1614"

[[comments]]
order = 9
subject = "هم الاخوان دول كفار يعنى ولا ايه"
author = "فارس_fr"
posted = "2007-02-20"
text = "و كل واحد عنده شوية زبالة فى دماغة ومش عجبه الاخوان يطلع يشتم فيهم !!! ما تقول رايك وخلاص بدون قلة ادب وسفالة ,, محدش فرض عليكم الاخوان او غيرهم ,,, احنا فى وقت المفروض كل القوى تتجمع فيه لاسقاط نظام الواطى مبارك ,, هنقعد نقول الاخوان وحشين والناصريين بيشجعوهم يبقوا وحشين وكل يوم الكلب مبارك ونظامه يعتقل فيهم ,, والله حرام عليكم ,,, كل واحد قاعد على الكيبورد يشتم ويعلق وفيه ناس تانية اعتقلت واتهانت وضاع مستقبلها ومستقبل اولادها ,,, تقدر تقولى ليه ؟؟؟؟ ليه بيخرج فى مظاهرة ولا يعارض ولا يعرض نفسه للخطر من اساسه ,,, مين فيكم ملهوش اصحاب من الاخوان؟؟ مين فيكم يقدرينكر الكفاءات الموجودة فى الاخوان ؟؟ ومش شرط ان كل واحد التزم وبقي بيصلى يبقي اخوانجى ومش عيب انه وجد فى الناس دى الاحترام والتنظيم ولا اقولكم بلاش يمشي مع الاخوان اللى بيصللوا<br />لا لا يمشي يضرب مخدرات وبانجو ا ويدخل سينيمات يتحرش بدينا ويرقص لسعد الصغير ,,, مين الاحق بالانصاف :<br />* ضريبة البانجوا والمخدرات اللى ملوا البلد<br />* ولا الاخوان الوحشين !!!!<br />* ولا العلمانيين اللى غرقونا هبل وهرتله !!<br />* ولا الناس اللى عايشه مع اللى عايشين بتجرى ورا لقمة العيش وهمها زيادة فى المرتب 10جنيه واجازة عيد العمال .....<br />***** قولولنا ياافندية مين اللى عجبكم ممكن يكون عنده الحل ؟؟ مين اللى الشعب كله وراه ونفسه انه يخلصه من حكم عصابة مبارك ؟؟؟<br />اخوانجى , ناصري , وفدى ........ هندى ,, المهم نخلص من الوباء اللى عشش فى جسم البلد بقاله 26 سنة ...........<br />حسبي الله ونعم الوكيل"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221031053/http://masr.20at.com:80/article.php?sid=1614"

