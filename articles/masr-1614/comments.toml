[[comments]]
order = 2
subject = "قبر يلم العفش"
author = "إبن بهيه"
posted = "2007-02-19"
text = "والله لو هيكون فيه إخوان مسيحيين وإخوان يهود وراح يكونوا محترمين في اطروحاتهم كالإخوان المسلمين يبقى إيه المشكله ؟؟؟!!!<br />مش هي دي الديموقراطية والتعديدية ولا إيه ؟<br />هيولك لا للأحزاب الدينية ..<br />يا عم اتنيل على عينك وروح موت بقى ..<br />كل واحد عايز يعمل حزب يعمله ويكتب المباديء بتاعته على كيف كيفه ديني .. غير ديني .. هو حر .. الموضوع راح يمر بعمليات غربلة ومش حيفضل غير الأصلح<br />مما يثير اشمئزازك وقرفك وسخطك على الحالة المزرية التي وصلت إليها مصر في عهد الواطي .. قلة أدب كثير من الذين يسمون أنفسهم مثقفين وسياسيين .. بصراحه قلة أدب زايده عن اللازم كتير أوي أوي<br />يعني لما ييجي شحط ويقولك لازم برنامج الإخوان يكون كذا<br />وييجي شحط تاني ويقولك لازم الإخوان يتحلوا<br />وييجي شحط تالت ورابع وعاشر<br />الله<br />فيه إيه؟<br />هم الإخوان دول مش مواطنين مصريين؟<br />هم الإخوان مش راشدين وعقلاء ويمكنهم عقلهم من وضع البرنامج الذي يرونه؟<br />هم الإخوان مش راشدين وبإمكانهم تقدير موقفهم من حل أو استمرار الجماعه؟<br />طيب ليه الشحوطه دي اللي نازله السوق من غير قرش صاغ واحد واعتمادها على السمسرة بس تحشر مناخيرها في شأن غيرها ؟؟؟<br />مش دي في حد ذاتها قلة أدب ؟؟؟<br />للحرية مفهوم واضح لا لبس فيه .. أنت حر ما لم تضر .. صح ؟؟؟ يبقى المفروض على كل السماسرة اللي جيوبهم فارغه من أي كرسي في البرطمان ((على رأي أختنا الزعيمه)) ولا حتى حفنة ناخبين يجيبوا رجل كرسي .. من حق السماسرة دول يتلهوا على عينهم ويدوروا في شأنهم هم ليصلحوه بدال ما هم نازلين نصايح وإرشادات وأكل في لحم الإخوان .. دي بجد بقت حاجه تقرف .. الناس دي بتسترزق على قفا الوطن للأسف .. مجرد طفيليات قذره لا يهمها مصلحة الوطن بقدر اهتمامها بمصالحها الضيقة القريبة حتى وإن<br />اقرأ بقية التعليق .."
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221031053/http://masr.20at.com:80/article.php?sid=1614"

[[comments]]
order = 3
subject = "كفايه !!"
author = "اينما حل الاخوان جروا وراهم الخراب وهم لا يصلحون لمشاركه الحكم فهم اصلا لا يعترفون بالاخر فهم ساعدوا عبد الناصر ثم انقلبوا عليه فهربوا الى السعوديه الى اوتهم ثم انقلبوا عليها وعادوا تحت حمايه السادات ثم قتلوه فلا امان لهم ولا صديق لهم الا ما يخدم مصالحهم الوقتيه الى ان يفرغوا منه ولا فارق بينهم و بين اى جماعه متطرفه تتخذ الدين شعار لها فقط هم على قدر من الحيله و قدره على التلون و التلاعب"
posted = "2007-02-19"
text = "وعلى الفكره اصل احنا شعب مش بيتعلم الا اما ياخد على دماغه بكره - لا قدرالله - اذا حكم الاخوان و مشوا الشعب بالجزمه هنقول يا ريت اللى جرى ما كان.<br />والسلام عليكم و رحمه الله وبركاته<br />( ولا حتى هذه حرام اقولها طالما انتقد الاخوان فهم اصبحوا فى مكانه الانبياء و انقادهم كفر صريح ، وحسبى الله ونعم الوكيل )"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221031053/http://masr.20at.com:80/article.php?sid=1614"

[[comments]]
order = 4
subject = "لا مش كفاية"
author = "إيه الكلام الغريب إللى كاتباه يا كفاية هما إمتى الإخوان مسكوا الحكم علشان تحكمى عليهم بالشكل القذر ده أولاً يا متخلفة الإخوان دول فى كيان المصريين ولا يمكن تفريقهم عنه لإنهم أكفء من فى شعبها فهم أساتذة جامعات موقرون وهم أطباء وهم مهندسين وهم ظباط فى الجيش وعمرنا ما شفنا منهم حاجة وحشة بالعكس هم أقرب ناس للشعب وهم يساعدونه فى رفض الفساد الذى ينهش فى عظام المصريين جراء حكم مبارك ويقدمون خدمات جليلة للمصريين رغم الحرب التى يقدمها لهم مبارك وحزبه"
posted = "2007-02-20"
text = "ثانياً اللى قتل السادات غير إللى خطط لقتل السادات وطبعاً كلنا عارفين مين إللى ورا قتل السادات وهو مبارك المستفيد الأول من إغتياله ولكن من قتل يقتل ولو بعد حين<br />ثالثاً ياريت تنظرى بعين خالية من الحقد على الإخوان وأحكمى على تصرفاتهم ولا تحكمى على ما يشوههم به مبارك وحزبة لتوريث الحكم فهل تقبلى أن يرث الحكم واحد صايع نهب البلد ورصيده بالمليارات ولامم حوالية شوية صيع زية علشان يتسند بيهم ومصر الغالية مليانة كل الكفاءات دى طبعاً كلنا رافضين الوضع المهين ده لمصر لازم إنتى كمان تكونى مؤيدة للإخوان علشان نخلص من كابوس التوريث الحقير الذى لم يحدث فى أى دولة جمهورية أن يسعى الحاكم ليورث إبنه الأهبل القذز للحكم<br />حفظ الله مصر من كل أذى ومن عائلة مبارك وأخذهم أخذ عزيز مقتدر يارب"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221031053/http://masr.20at.com:80/article.php?sid=1614"

[[comments]]
