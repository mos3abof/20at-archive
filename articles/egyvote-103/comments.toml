[[comments]]
order = 4
subject = "مجلس الحزب الوطنى"
author = "محمد عبد الفتاح"
posted = "2005-12-08"
text = "زب الحكومة ومبارك وابنه بيستقتل على نسبة التلتين يقتل ويبلطج كى يحصل عليها فهذا الحزب يعلم ان مدة صلاحيته انتهت ويجب التخلص منه لذا يحاول بفرد الدراع الحصول على مبتغاه وان كان عاجبكم يا شعب مصر هنمرر القوانين اللى على مزاجنا وهنوافق عليها وهنفوض الرئيس فى كل شئ حتى فى تنظيم جدول الدورى العام .<br />لا افهم لم كل هذا التباته تقل الدم ناس يرفضهم الشعب ويأتوا بكل بجاحة ليقولوا نحن هنا لان الشعب عايزنا يا اخى ملعون الحزب على الحكومة على الرئيس انت عايزينا نسيب البلد ونطفش ولا كمان عشان ينقطع املنا سيادته بيجهز لنا الننوس الصغنن عشان يدلع ويهشتك الشعب على توجيهات وحكم سعادته الانتخابات فى الدائرة اللى انا فيها مزورة بالرغم انها كانت هادية جدا ولكن التزوير فيها بفن صحيح هناك بعض اللجان اغلقت ولكن الاثر الاكبر كان اللعب فى الاصوات ثم يظهر على الفضائية المصرية انسان منافق حقير يقول بالنص والله يقولون هناك بلطجة وعنف ثم نرى مراسل او (مراسلة )القناة الاخبارية يظهر وخلفه الاجواء هادئةانا اعذره لانه مبرمبج على الكذب وينفذ التعليمات لكن ان يصدق ما يقوله تلك هى المشكلة ولكنى اشفق على ابنائه لانهم اما ان يكونوا كذابين مثله او معقدين نفسيا .<br />يا دوله الحزب الوطنى لقد حانت ساعة الحساب بيننا وبينكم والحساب يجمع"
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228233634/http://egyvote.20at.com:80/article.php?sid=103"

[[comments]]
order = 5
subject = "أعتبر نفسي من أبناء مصر"
author = "عندما يكون الوطن هو القيد"
posted = "2006-11-10"
text = "ي ظل دولة قائمة على مركزية شخص و عائلته وفقدان أساس أساسي في الحكم و عدم تداخل السلطات تظل و يظل مجلس الشعب مقيد مأسور مهيمن عليه من قبل رأس السلطة التنفيذية بحكم توظيف المال العام ومنابر الاعلام وعدم استقلال القضاء الذي يعتبر تابعا لنفس الشخص.<br />فلا حاجة لنخدع أنفسنا بمجالس ( مخصية ) يطلع و ينزل نوابها بالمال العام<br />هذه هي حقيقة أوضاع مصر الأبية<br />وشعبها العظيم الذي تم ارغامه على التقاعد وبشكل قسري<br />ومثما قال الكاتب هنا انتخابات لا طعم ولا لون لها ولا نستطيع ان نبني عليها توقعات او أحلام بحكم ما يريده المواطن بل ما يريده رأس الحكم<br />تحياتي"
archived = "2006-12-07"
capture_url = "https://web.archive.org/web/20061207192556/http://egyvote.20at.com:80/article.php?sid=103"
