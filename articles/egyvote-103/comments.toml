[[comments]]
order = 2
subject = "اكيد المجلس هيكون احسن"
author = "مواطن"
posted = "2005-12-04"
text = "كيد المجلس هيكون دوره احسن من الأول والمجلس على فكرة مش ملوش لازمة زي ما بعض المحبطين بيقول لأن لو كان ملوش لازمة كانت الحكومة سابته لأي حد يدخل المجلس له لازمة ولازمة كبيرة كفاية انه بس بيفضح السرقة اللي بيسرقوها . المهم انا رأيي ان المجلس اكيد هيكون احسن لأن فيه دلوقتي 76 واحد يتقوا الله ولو معملوش حاجة اكثر من انهم مش هيفسدوا ده تقدم في حد ذاته بدل ما كان اللي مكانهم واكلينها والعة واملنا في ربنا ثم عشمنا ان الإخوة لا يدخروا وسعا في خدمة هذا الدين وهذا البلد داخل المجلس."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228233634/http://egyvote.20at.com:80/article.php?sid=103"

