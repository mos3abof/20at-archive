[[comments]]
order = 2
subject = "ملخص العبارة المنكوبة..............."
author = "Hutchman"
posted = "2006-02-16"
text = "ملخص العبارة المنكوبة...............<br />يوجد في قوانين البحارة قانون للإنقاذ السفيني – أقصد إن سفينة تنقذ سفينة....القانون ده بينص على:-<br />لو في سفينة(أ) في عرض البحر وبتغرق وطلبت النجدة من سفينة(ب) أخرى ...وحصل إن السفينة(ب) دي أنقذت السفينة (أ)...يصبح كل ما على السفينة والسفينة نفسها ملك أصحاب السفينة المنقذة (ب)..طبعا ماعدا الركاب..<br />اللي حصل بقى...<br />إن السفينة (أ) بدأت تغرق ..وحاول ربان السفينة إصلاحها..لكنه فشل..واتصل بأصحاب السفينة لكي يأخذ منهم الأمر بإرسال طلب نجدة ...لكن طبعا أصحاب السفينة رفضوا...لأنهم لو كانوا وافقوا على ذلك..كان ممكن تسحب ملكية السفينة منهم.....عشان كده الكابتن صلاح ربان السفينة (ب) مر بجانب السفينة الغرقانة من غير ما ينقذها..مع انوا على علم كامل باللي بيحصل للسفينة....<br />طيب صاحب السفينة مدام كده كده هيخسر السفينة ليه ما وافقش على طلب إرسال نجدة...ببساطة لأنه عنده تأمين على السفين بالكامل....يعني الراجل مش خسران ولا مليم من الحكاية دي..<br />اللي خسر...المصريين اللي اغتربوا في السعودية وراجعين بشقى عمرهم..اللي خسر أهالي المفقودين..اللي مش عارفين حتى ياخدوا شهادة وفاة لأقاربهم اللي راحوا ضحايا المهزلة..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154634/http://www.20at.com/article2.php?sid=448"

