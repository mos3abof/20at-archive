subject = "كفايه يا كفايه"
author = "نيفين"
posted = "2006-02-16"
text = "ياما نفسى كنت ابقى معاهم ف الصوره دى<br />خصوصا ان الناس دى بتبين قرفها من اللى حاصل ف البلدخصوصا بعد التعتيم المتعمد على شركاء صاحب شركه السلام و اللى متابع القاهره اليوم هيفهمنى<br />حسبنا الله و نعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154634/http://www.20at.com/article2.php?sid=448"

[[comments]]
order = 4
subject = "اشتراك الاوربت غالي"
author = "أكرم"
posted = "2006-02-16"
text = "على رأي مدام نظيفة القطنة مبتكدبش<br />و انا من على هذه المدنة اطلب من مدام نظيفة ان تمشي بالقطنة شويه على مصر و الا تستخدم المسحوق الشهير ( جنرال ) الذي اثبت فشله في التنظيف و اثبت قدرة فائقة ان يجعل كل من يقف امامه مسحوق كما يبدو من الصورة<br />و مننساش ان القطنة مبتكدبش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154634/http://www.20at.com/article2.php?sid=448"

[[comments]]
