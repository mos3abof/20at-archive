subject = "كله عساكر"
author = "ياء"
posted = "2006-02-16"
text = "هى المظاهره كلها عساكر ولا ايه مفش مواطنين خال<br />مظاهره ضرب فى ضرب يبقى انت اكيد فى مصر<br />لو سئلتك انت متظاهر مصرى تقلى ايه تقلى تقلى بضرب من عسكرى مصرى وعسكرى مصر الله عليه<br />ربنا على الظالم والمفترى وابن -----"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154634/http://www.20at.com/article2.php?sid=448"

