posted = "2009-10-25"
text = "نهاركم اسود<br />انتم عايزين تعطسوا<br />دى قضية امن دولة<br />العطس جريمة تؤدى الى العمل على قلب النظام والانضمام الى جماعة مندسة<br />ممنوع العطس الا فى البيت وفى الحمام"
