[[comments]]
order = 1
subject = "الزبانيه فى قائمه الانتظار"
author = "لم تكن اول من انتهك عرضه ولن تكون الاخير"
posted = "2006-06-07"
text = "طالما ظل هذا النظام المهترىء رابضا على انفاسنا محتميا بتلك العصابه المكلفه بحمايه الرئيس الاله و الاسره المقدسه<br />انها العصابه المسماه بامن الدوله التى تعيث فى مصر قهرا و فى المصريين الشرفاء سحلا فهم مجموعه من الساديين المرضى معدومى الضمير<br />يؤرق مضاجعهم المطالبه بالحريه ويكنون الكراهيه لكل شريف يحلم بغد أفضل لذلك البلد<br />السؤال الان لهذه العصابه<br />هل تعلمون ان ذلك اليوم ات لا محاله يوم يحاكمكم من عذبتم و لكن لم تنالوا من اصرارهم<br />مع خالص احترامى للثائر من اجل الحريه<br />مــــحـــمــد الـــشــــرقـــاوى<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأه يــــــــا بـــــــلـــــــدى"
archived = "2006-09-23"
capture_url = "https://web.archive.org/web/20060923204345/http://masr.20at.com:80/article.php?sid=443&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "حكومة شاذه"
author = "ابو شريف"
posted = "2006-06-07"
text = "بعد إختطاف الشعب المصري من 25 سنة وتسميم افكاره وإغتصابه فكريا بتدمير معتقداته واحلامه ... إكتشفت الحكومة الشاذه أن هناك جيل من الشباب علي وعي وايمان بالحرية والديمقراطية واستطاعوا بقراءة الرأي الآخر كشف زيف أبواق الحكومة المتمثلة في القنوات الرسمية وماتبثه من أكاذيب والصحافة المحلية التي نجحت فترة من الزمان في إخماد الثورة الشعبية بنشر سلبيات الحكومة تارة ونشر النكات السياسية اللازعة تارة أخري مع السماح لشلة الراقصين والفنانين بعرض أفلام (بدعوى الحرية) وانتظر الشعب طويلاً لحدوث تغيير ولكن لاحياة لمن تنادى ، فالإمبراطور العظيم مبارك الأول (عايز يكون فيه ثاني وثالث ورابع) مؤمن بحق الشعب علي الكلام وحقه هو في أن يفعل مايريد ، وعندما فوجئت الحكومة الشاذة بإنتفاضة الشباب المصري ضد الظلم والطغيان والتوريث تذكرت أنها حكومة شاذه فتحولت من إنتهاك الأعراض الفكري الي العملي ( يعني كل الشعب عايزاهم وزراء ثقافه) ولايعلم الإمبراطور العظيم أنه سيجئ يوم أنه سيفقد من لقبه (الإمبرا) وسيصبح فقط ( طــــور )"
archived = "2006-09-23"
capture_url = "https://web.archive.org/web/20060923204345/http://masr.20at.com:80/article.php?sid=443&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "معرفوش يا عم"
author = "سماره"
posted = "2006-06-07"
text = "الهى انت المنتقم ان كنا ضعفاء فانت القوى ان كنا لا نستحق فلا ملجأ لنا الا انت فلا تتركنا فرائس فى ايدى من لا يخافك ولا يخشاك وانتقامك انت لا يضاهيه انتقام<br />حسبى الله ونعم الوكيل"
archived = "2006-09-23"
capture_url = "https://web.archive.org/web/20060923204345/http://masr.20at.com:80/article.php?sid=443&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "اعتذار رسمى"
author = "نيفين ..نيفى ..نوفا"
posted = "2006-06-07"
text = "يا جماعه دا اعتذار رسمى لكل عشرينات<br />و لعبد الله و لهبهوب و لاكرم و للبراءولكل العشريناتيه اللى حبيتهم و اللى جمعنى بيهم الموقع و اوخيرا لمصر<br />بتسالو نفسكم الاعتذار عن ايه<br />و علشان تعرفو بستاذنكم انكم ترجعوا لموضوع الشرقاوى تانى<br />انا بعتذر عن جمله طلعت منى غلط ف حق مصر لما قلت البلد دى معادتش تستحق حد يموت علشانها<br />الجمله دى غلط و بعتذر عنها<br />بعتذر للى ماتو ع الرمله السخنه ف 67<br />بعتذر للى طهرت دماءهم سينا ف 73<br />بعتذر للشهيد اللى مات بيطارد الارهابين<br />بعتذر للشرقاوى و اللى معاه اللى بيضحو علشان نسيب مبدا عيش نمله تاكل سكر<br />بعتذر لمصر البنت الجميله السمرا اللى فارده ضفايرها ع النيل نت دمياط لاسوان<br />اللى شافت كتير و لسه هتشوف اكتر<br />اللى كلها ثقه ف ان ولادها هيجيبو حقها<br />مصر اللى بتتولد من جديد ف ساعه ضلمه ميعلم بيها الا ربنا على راى البراء<br />مصر تستحق كلنا نموت علشانها غصب عن المرشد اللى قال طز<br />عصب عن كلاب السلطه<br />غصب عن ملايين عز و جزمه السادات"
archived = "2006-09-23"
capture_url = "https://web.archive.org/web/20060923204345/http://masr.20at.com:80/article.php?sid=443&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

