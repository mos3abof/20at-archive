[[comments]]
order = 18
subject = "لا انتو فاهمين غلط"
author = "ندا صابر"
posted = "2006-11-19"
text = "انا يا جماعة شايفة ان انتم واخدين فكرة غلط خالص عن الي بيحصل في مراكز الشباب حيث ان الوضع هو اننا بنعيب على الحكام ومش شايفين نفسنا الاول لان العيب مننا احنا علاشان احنا ساكتين على الي بيحصل ومبنعملش حاجة والمفروض اننا نصلح الغلط على فكرة انا اخصائية اجتماعية والمفروض ان لكل نادي من دول اخصائي وليه دور يقدمة على الاقل يحلل الفلوس الي بياخدها كل شهر انا لما ادربت في مدرسة لاقيت ان الاخصائي قاعد يفطر الصبح مع زمايلة وي بيرمي شغلة على طول على اتنين هما المدرس الخاص بالفصل والتربية العملي الي بيروحو ذي حلاتنا كده واناعن نفسي عملت في المدرسة دي حاجات كتير اصحابي نفسهم وطلاب المدرسة اول مرة يلاقو حاجة ذي كده ان طالبة تربية عملي شالت التدريب من دماغها وحطت فيها اذاي تخرج من المدرسة وي هيا اخصئية اجتماعية اشتغلت بجد وخرجت بعد التدريب والطلاب يبكون هما وي الاخصائيين بجد وده لاني اثرت فيهم بجد ولما رحت زيارة بعد التدريب لاقيتاالاخصائيين عملو حالات بجد وقاعدين يشتغلو بجد وبيحللو فلوسهم الي بياخدوها كل شهر فدي يا جماعة صورة عن الي بيحصل الكل رامي حمولة ومحدش بيشتغل او بيعمل الي عليه صح الا بعد مايلاقي التشجيع يلاقي حد بيشتغل بجد فيحث على دمة وي يشوف شغلة بعد كده صح انا عارفه اني طولت اوي وتقلت اوي عليكو ونصيحه مني هي متظلموش حد الا بعد ماتشوفو نفسكو الاول وتحسبوها كويس وبعد كده حاسبو غيركم على اي شئ بعد كده ماااااااااشي سلالالالالالالالالالالالالالالالالالام بقى"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114257/http://masr.20at.com:80/article.php?sid=215&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
