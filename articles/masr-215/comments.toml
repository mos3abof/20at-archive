posted = "2006-04-24"
text = "انا بوافق علي رأي الاخ العزيز عمرو تولدو ان هذا النادي بقي حتة منا خلاص ومنقدرش نستغني عنه او بقينا مدمنين نادي الجزيرة ده اسم الفريق علي فكرة صح يا حودة وكلامك حكم يا اخ عمرو عن موضوع الشيشة برضك"
