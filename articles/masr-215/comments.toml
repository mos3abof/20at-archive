posted = "2006-04-24"
text = "الكرة خلاص لحست دماغي وبقيت مهووس كورة<br />ولو بصينا حنلاقي الكرة في كل حاجة في حياتنا<br />الارض كرة<br />والحياة ملعب كبير<br />والدينا خضرا<br />والحكام خاربنها<br />والشعب بيتفرج<br />والنتيجة في علم الغيب"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524214038/http://masr.20at.com:80/article.php?sid=215&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

