subject = "عندنا احسن من اى نادى تانى"
author = "عمرو تولدو"
posted = "2006-04-24"
text = "والله الجزيره ديه يا ما خدت منا لعب وياما اتعورنا فيها وياما اتكسرنا وياما اتسرقنا بس مش مشكله مكان بنسى فيه كل همومى مش كده يا حوده ولا ايه؟<br />محمود حامد اخويا الصغير<br />الف شكر على الموضوع يا حودا<br />عايزك تكتب موضوع عن مراكز الشباب التانيه اللى بيلعبوا فيه مش باكوره بيلعبوا (بالشيشه)"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524214038/http://masr.20at.com:80/article.php?sid=215&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

