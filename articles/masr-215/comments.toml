posted = "2006-08-18"
text = "بسم الله الرحمن الرحيم<br />اولا عايز اتكلم على موضوع مهم جاد وهو لاعبين كوره القدم فى النوادى فى لاعيبه كتيرجدا مفيش اى مدرب بيدلهم حقهم ليه يترى؟ علشان طبعا الوسطه او بن فولان وبن علان المهم الافضليه للى ملوش فى الكوره مع ان فى النوادى دى ومن غير زكر اسماء ياريت كل المدربين بهتمو بالعبيه الكويه وبس ويصبرو عليهم شويه"
