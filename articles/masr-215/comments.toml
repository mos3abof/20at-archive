[[comments]]
order = 15
subject = "انجز بالونجز تلعب على النجيلة"
author = "ortiga"
posted = "2006-05-15"
text = "انا المكان ده بحبه جدا وكلامك فعلا فكرتنى بحاجات جميلة كتير فى المركز ...بس لى ملاحظة على كلامك.<br />انك ممكن تشترى زمة بتوع الامن الي هما بيبوا قاعدين على حرف الملعب تحت الشجرة على الكراسى الخرزان علشان تلعب على النجيلة بسعر ما بين خمسة وعشرة جنيه...زى زمم كتير مسعرة فى مصر ومعروضة للبيع دائما.<br />انااشتريت زمتهم كذا مرة قبل كدة....هسسسسسسس"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524214038/http://masr.20at.com:80/article.php?sid=215&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

