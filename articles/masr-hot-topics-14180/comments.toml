author = "مفيش مدارس"
posted = "2009-11-28"
text = "فى المنطقة بتاعنتا مفيش مدارس خالص الا العيال بتاع ابتدائى بيروحوا يوم ويقعدوا فى البيت يوم على حسب تعليمات اللواء المحافظ<br />ولكن كل العيال بينتظموا فى الدروس الخصوصية عند المدرس - الفصل كلة بيداوم فى درس خصوصى فى بيت المدرس بيدخلوا عشرين ويخرجوا ويدخل عشرين مكانهم<br />سلموا لى على البية وزير التعليم واللواء المحافظ"
