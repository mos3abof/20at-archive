text = "المدرسه دلوقت مبقاش ليها اهمية زي الأول اصلا ..<br />يعني كل يوم بيدور نفس الحوار بين أمي واخويا الصغير ..* يابني روح المدرسه يابني مدرستك مفهاش الكلام ده * وهو بقى .. مدرسة ايه اللي اروحها دي انتي عايزاني اموت ..<br />بجد موقف لازم يتكرر يوميا في البيت عندنا .<br />. وكله دلوقت بيمشي بالدروس والله في ناس مرتبها كامل من الدروس يعنيالمدرسين زمانهم بيدعوا إن الإنفلونزا دي تستمر.. ههههههه"
