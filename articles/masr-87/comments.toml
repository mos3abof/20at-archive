order = 0
subject = "الفقر ولا الموت"
author = "رويترز"
posted = "2006-03-29"
text = "الفقراء المصريون لا يبلغون عن الطيور المصابة بانفلونزا الطيور<br />من محمد عباس<br />نوى (مصر) 28 مارس اذار (رويترز) - يصر محسن رزق على أنه لم يتبق في قريته<br />أي دواجن بعد وفاة امرأة من القرية بإنفلونزا الطيور قبل أسبوعين لكن صوت<br />الدواجن الذي يعلو من حظيرة مغلقة والمخلفات في فناء منزله يكذبانه.<br />وفي بيت آخر في القرية التي تبعد 30 كيلومترا شمالي القاهرة حيث أعلن عن أول<br />حالة وفاة في مصر بسبب انفلونزا الطيور رفض رب أسرة الاعتراف بوجود بطة كبيرة<br />في الغرفة الأمامية في بيته حيث كان عدة أطفال يلعبون.<br />وقال الرجل وهو يحاول أن يخفي عن الأعين البطة التي يمكن رؤيتها بوضوح \"لم<br />تعد هناك انفلونزا طيور والحمد لله. أعدمنا كل الطيور.\"<br />ويقول الفلاحون في نوى إنهم يعرفون مخاطر انفلونزا الطيور وكيف يمكنهم<br />تجنبها. لكن الفقر يعني أنهم يرفضون إعدام طيورهم الداجنة حتى لو قتل الفيروس<br />اثنين من المصريين وأصاب اثنين أو ربما ثلاثة آخرين.<br />وتكشف جولة قصيرة في بلدة نوى من خلال أصوات وروائح الطيور التي حبست في<br />الحظائر والبيوت أن الطيور التي كانت تتجول عادة في شوارع مثل هذه القرى قد<br />أخفيت رغم حظر تفرضه الدولة على تربية الدواجن في البيوت.<br />وأصدرت الحكومة حظرا بعد اكتشاف فيروس انفلونزا الطيور القاتل في مصر في<br />الشهر الماضي.<br />وقال حسن البشرى من منظمة الصحة العالمية \"هناك حاجة لمزيد من التوعية<br />الصحية. ومعظم الحالات مزارع في أفنية البيوت ولأناس لم يلتزموا حقيقة بتعليمات<br />وزارة الصحة.\"<br />ومع هذا يعرف القرويون جيدا مدى انتشار انفلونزا الطيور وما يتعين عمله<br />لاحتوائها. وقالوا إن الفقر لا الجهل هو الذي يدفع الناس لتربية الدواجن سرا.<br />قالت رجاء مصطفي من سكان القرية \"الكل هنا يعيشون على ا<br />اقرأ بقية التعليق .."
archived = "2006-09-09"
