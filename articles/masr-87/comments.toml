[[comments]]
order = 2
subject = "نريد حلا."
author = "angel"
posted = "2006-03-29"
text = "الحكومة والشعب مشتركين سوافي المأساه دي الحكومة بكدبها الأتعودنا عليه من سنيييييييين وجاية دلوقت تفتكر ان (الكدب خيبه)و(ملوش رجلين) والشعب بجهله اولا وفقرة ثانيا والحكومة كان المفروض بدل متحرق للناس مزارعهم وتشيل ايدها وفاكرة انها خلاص عملت العليها كان المفروض تدي للناس حلول بديلة وتساعد على منع ارتفاع اسعار اللحمة لأن الناس مش حيموتوا من الجوع للأنهم طلما مش حيقدروا يدفعوا فلوس اللحمة يبقى حيكلوا فراخ وخلاص وأهم يموتوا من الشبع اخسن مايموتوا من الجوع....."
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909121225/http://masr.20at.com:80/article.php?sid=87&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
