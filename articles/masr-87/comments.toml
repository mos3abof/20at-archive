subject = "منهم لله"
author = "بلال"
posted = "2006-03-29"
text = "والله العظيم دي بلد سايبه طبعا العيب في الحكومة الغبية اللي بتقول على نفسها الذكية او الالكيرونية منكم لله انتوا السبب في موت الناس اولا لانهم فقدوا الثقة فيكم وثانيا لانهم ماتوا"
