[[comments]]
order = 6
subject = "كيف أصبحت رُبى قعوار مسلمة؟"
author = "شـباب مصر"
posted = "2006-11-04"
text = "كيف أصبحت رُبَى قعوار مسلمة؟<br />رُبَى قعوار<br />كيف أصبحت رُبى قعوار مسلمة؟<br />من أنا ؟<br />رحل جدي مجيد وأخاه نجيب قعوار الى الضفة الغربية ليعشون مع عائلاتهم قرب بحيرة طبريا. ولكن للأسف فقد جاء الاسرائيليون وطردوهم من أرضهم مما اضطروا ليرجعوا الى الأردن عام 1948. سكن مجيد في الزرقاء وأما نجيب فقد سكن في مدينة العاصمة عمان.<br />اشترى نجيب أرضاً في الزرقاء وقطعها الى نصفين متساويين وقال: \"هذه القطعة على اليمين لي وهذه القطعة على اليسار لله\" وبنى كنيسة محلية صغيرة سميت \"الكنيسة الانجيلية الحرة\" تسع 50 شخصاً فقط.<br />لدى مجيد 4 أبناء و3 بنات. واسم ابنه الأصغر داهود وهو الذي قرر ترك بيته من صغره والتغرب في الدنمرك لبناء حياته مما جعله رجلاً غنياً جداً بعد أن امتلك مطعماً ثم بعد فترة صغيرة من الزمن حجز التذكرة الى الأردن لينتقي شريكة حياته، وبالفعل انتقت أمه ابنة عمه – نجيب الذي كان رساماً بارعاً في الالوان الزيتية – وكانت الفتاة جميلة وذكية وعندها أيمان. أما هو فلم يكن متزمتاً في الدين المسيحي.<br />وبعد التزام داهود في دينة المسيحي، توفي جدي مجيد في عام 1986 وأغلقت أبواب الكنيسة. ولكن الله دعا داهود في عام 1985 ليرجع للأردن ويبدأ خدمته وفتحت الأبواب مرة أخرى في عام 1990<br />في عام 1995 تم ترميم الكنيسة وأسس داهود ثلاثة كنائس أخر في مدن مختلفة في الأردن، وتوسعت خدمته في البلد الاسلامي خلال المسيحية<br />إن أمي الآن من الخادمات القويات في الكنيسة الأردنية، وقد أسست مؤتمراً سنوياً لكل النساء في الشرق الأوسط، حيث أن هناك 500 فتاة على الأقل يحضرن هذا المؤتمر، ويطرحن مواضيع حقوق المرأة والمشاكل التي تخوضها في حياتها. بالاضافة الى تدريب قادة الشبيبة وتأسيس البرامج المختلفة للمخيمات. إن<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014956/http://masr.20at.com:80/article.php?sid=1113"

[[comments]]
order = 7
subject = "لعنة الله على القوم الظالمين"
author = "من خير اجناد الارض"
posted = "2006-11-05"
text = "الله اكبر لا ترى مظلوما يطول بكاؤه في حكم عادل ولكن في حكم هذا الطاغية عدو الشعب حسني مبارك قد يموت المظلوم كمداا بل ويأتي بعدها الظالم ويدوس على رقبته وكأنه يقول لا اله<br />اللهم انصف شعب مصر الصبور لان رسولنا قد منعنا من رفع السلاح على الحاكم ولو كان فاسقا طالما انه يتظاهر بالاسلام<br />اللهم اقتل حسني مبارك وأعونه شر قتله وحسبن لله ونم لوكيل"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014956/http://masr.20at.com:80/article.php?sid=1113"

