[[comments]]
order = 1
subject = "تحياتى للطلاب المناضلين"
author = "ياسر ابو عمار"
posted = "2006-11-02"
text = "الف تحية للطلاب المناضلين الذين يسعون الى اقامة نشاط طلابى محترم ،تحياتى للشباب الذى يتحمل الفصل والاعتقال والضرب والحرمان من دخول الامتحانات والاستبعاد من المدن الجامعية من اجل توصيل فكرته الى الناس ورغبة فى اصلاح المجتمع الطلابى الذى تسببت الحكومة فى افساده كما فعلت مع قطاعات كبيرة من مجتمعنا الغلبان ،ارجوك اخى العزيز ان تقارن بين هذا الطالب وزميله الذى يمارس نشاطا طلابيا بالامر حتى يمنع زملائه من القيام بانشطة مماثلة ،او يبيع الجميع للحصول على مكاسب مادية نعرفها جيدًا،او طالب تحول الى بلطجى يقوم بضرب زملائه ارضاء للقيادات الامنية .<br />الفرق واضح بين من يحب الوطن ومن ليه استعداد ان يبيع اقاربه من اجل المنافع .<br />واحب ان احيى كاتب المقال على الاسلوب المتميز .برافو."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014956/http://masr.20at.com:80/article.php?sid=1113"

