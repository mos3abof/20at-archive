[[comments]]
order = 12
subject = "بعد مقتل الزرقاوي.. انضمام المئات للمقاومة، واتجاه لتوحيد فصائلها"
author = "مفكرة الإسلام [خاص]: أثار إعلان الاحتلال مقتل أمير تنظيم القاعدة في العراق 'أبو مصعب الزرقاوي', ردود فعل متباينة في صفوف العراقيين."
posted = "2006-06-12"
text = "فما بين احتفال الرافضة بموته وتوزيع الحلوى والاحتفالات التي استمرت طيلة ليله أمس, إلى توجّه صليبيي العراق إلى كنائسهم صباح اليوم لأداء ما تُعرف بـ'صلاة الشكر', أعلن صباح اليوم الجمعة الشيخ أبو نعمان الأعظمي - قائد عمليات تنظيم القاعدة في منطقة الرصافة ببغداد - في لقاء خاص مع مراسل 'مفكرة الإسلام' قوله: إن أكثر من 200 شاب من أهل السنّة من القاعدين عن الجهاد تطوعوا خلال مساء أمس وصباح اليوم؛ للانضمام إلى القاعدة؛ منهم 30 فدائيًا.<br />وأوضح الأعظمي لمراسلنا, أن المتطوعين وصلوا عن طريق قنوات موثوقة, وطلبوا الجهاد تحت إمرة القاعدة, وسيتم إخضاعهم للاختبار بإذن الله تعالى.<br />ووصف الأعظمي ذلك بأنه ردة فعل من شباب أهل السنّه بعد مقتل 'أبو مصعب الزرقاوي'.<br />وأشار إلى ظهور بوادر خير بانضمام أكثر من فصيل قتالي إلى القاعدة؛ لتعزيز دور المقاومة في العراق.<br />وعمّا إذا كانت هناك غزوة جديده باسم الزرقاوي, قال: كل عملياتنا السابقة واللاحقة تحمل لمسات الشيخ؛ لذا نحن نعتبره حيًا بيننا بكلماته وابتسامته الجميلة, وسنحس بيده على رءوسنا كل مرة عندما يقول: {وَجَعَلْنَا مِنْ بَيْنِ أَيْدِيهِمْ سَدّاً وَمِنْ خَلْفِهِمْ سَدّاً فَأَغْشَيْنَاهُمْ فَهُمْ لا يُبْصِرُونَ}.<br />وردًا على سؤال عن اختيار خليفة للزرقاوي, ذكر الأعظمي أن البيعة واجبة بعد رحيل الأمير, وأضاف: سنبايع إن شاء الله من اختاره الأمير خليفة لنا, دون أن يسميه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124915/http://www.20at.com/article2.php?sid=924"

[[comments]]
