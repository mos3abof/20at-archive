posted = "2006-06-20"
text = "ونعم الرجل والله اللذي اغض مضاجع الصليبين<br />اجد نفسي محقا عندما اخالف الصليبيين<br />واليهود والروافض والمنافقين<br />اللهم اجزي عنا الشيخ ابو مصعب خير الجزاء<br />فقد نكل في الصليبيين والروافض الحاقدين<br />طبت وطاب جهادك وانا والله على فراقك ياابو<br />مصعب لمحزونون<br />اللهم انصر المجاهدين في بلاد الرافدين وفي<br />كل مكان ياقوي ياعزيز"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124915/http://www.20at.com/article2.php?sid=924"

