[[comments]]
order = 15
subject = "الاسلام دينكم"
author = "رائد بغدادي"
posted = "2006-07-02"
text = "يقول الله تعالى (ومامحمد الارسول قد خلت من قبله الرسل أفأن مات أو قتل انقلبتم على اعقابكم ومن ينقلب على عقبيه فلن يضر الله شيئا وسيجزي الشاكرين )<br />أستشهد الامير رحمه الله فزاد الله أمة الاسلام بالالاف من المجاهدين الذين تسابقوا للشهادة<br />عراقَ الخيرِ يا حلمَ الصبايا<br />ويا عشقاً يكابدهُ المَشوقُ<br />سنأتي لمْ نجدْ الاّكَ أهلاً<br />وهذا عندنا عهدٌ وثيقُ<br />نقاتلُ دونكَ الاوباشَ كي لا<br />تُداس كرامةٌ ودمٌ عريقُ<br />لقد سلبوا النخيلَ شموخَ قومي<br />وبرّحَ دجلةَ الزمنُ الصفيقُ<br />فلا طلعتْ على بغداد شمسٌ<br />وفي الظلماءِ تُنتهكُ الحقوقُ<br />فيا عرباً أُهينوا ثم هانوا<br />كأَنكمُ لدى بوشٍ رقيقُ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124915/http://www.20at.com/article2.php?sid=924"

[[comments]]
order = 16
subject = "القضايا والرموز"
author = "مقداد مصطفى"
posted = "2006-07-10"
text = "القضايا لا تموت بموت رموزها لانها تحتفظ بسمة الخلود النسبي اما الرموز فاتهم يقضون نحبهم عاجلا او اجلا, الزرقاوي لم يكن رمز المقاومة في العراق... الشعب العراقي هو رمز المقاومة وضحيتها والشعب الذي لايقاوم المحتل لا يستحق العيش بكرامة, الامريكيون خلطوا الاوراق لكي يحولوا المقاومة الى حركة ارهابية,الارهاب لم يكن موجودا في العراق قبل الاحتلال والارهاب الحقيقي هومايمارسه المحتلون من قتل واغتصاب واعتقال, ما يجري الان في العراق اخطر بكثير ممايشعر به معظم الناس,الحقائق العارية هي كما يلي:<br />اولا: احداث الفتنة بين مكونات الشعب العراقي عن طريق تسهيل ممارسات فرق الموت في التسليح والتمويل والمعلومات الخاصة بالاستهداف اذ يقوم عناصر من الموساد والسافاما بضرب المساجد والحسينيات والمراقد لاثارة غضب الدهماء والرعاع<br />ثانيا:وجود معممين غير عراقيين تلقوا دروسا وتعليمات من المحافل الماسونية في روما وباريس للقيام بالافتاء بارتكاب الجرائم باسم آل البيت وبالاعتماد على نظرية التفويض الالهي وولاية الفقيه المقتبسة من تعليمات الاحبارالمحورة الى اوامر لاتعصى لصدورها من المعصومينالمحشوة في ادبياتهم الثيوقراطية<br />ثالثا: الهدف الستراتيجيي البعيد: تشويه الدين الاسلاميعن طريق ارتكاب الاعمال الوحشية وتنسيبها اليه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124915/http://www.20at.com/article2.php?sid=924"
