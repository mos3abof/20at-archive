[[comments]]
order = 4
subject = "أحـــــــــســـــــــنت يا بــــــــــــوش"
author = "طيف بدر"
posted = "2006-06-10"
text = "أحـــــــــســـــــــنت يا بــــــــــــوش !!<br />نعم ؛ علينا ألا نبخس الناس حقوقهم و لو كانوا كفارا يجاهرون بالعداء للإسلام .<br />نعم ؛ لقد أثبت بوش بامتياز و على الرغم من غبائه المعهود أنه أكثر براعة و احترافا من مخرجي هوليود لأكل ألباب شعبه الأمريكي – الأكثر غباء منه .<br />نعم ؛ إنها الحقيقة و دعوني أقولها بكل صراحة : أمريكا شعب غبي تقوده إدارة جمعت على نحو عجيب بين الذكاء و الغباء<br />أليس هذا الشعب هو الذي نراه يتقافز حول حلبات المصارعة الحرة يهتف بوحشية غريبة لهذه الهمجية و البربرية المنسوبة سفاحا و غصبا إلى الرياضة ؟<br />أليس هذا الشعب هو حفيد السفاحين الذين أبادوا الهنود الحمر و سموهم بالمؤسسين الأوائل ؟<br />أليس هذا الشعب الذي يحزن و يغضب فقط لرؤية جنوده قتلى و جرحى تحت رماح المقاومة العراقية الباسلة غير عابئ بأرواح غير الأمريكيين ؟ و بناء على عدد القتلى و الجرحى بين عصابات المارينز تتحدد شعبية هذا السكير بين الأغبياء و الجهلة و اللقطاء ؟<br />أحسنت يا بوش !! ضربة معلم صحيح !!<br />فالطالبان – حتى لو اختلفنا عليهم - يحققون كل يوم نصرا و تتسع رقعة سيطرتهم داخل أفغانستان ( اللهم سدد خطى من ينصر هذا الدين و اهدهم و أرشدهم )- رغما عن أنوف عصابات المارينز .<br />و مجاهدو المحاكم الإسلامية الصومالية جعلوا مليارات المخابرات المركزية التي صرفت لحثالة السلوليين من تجار المخدرات و القوادين و البلطجية ، جعلوا هذه المليارات هباء منثورا .<br />و الشعب الفلسطيني المرابط اختار منهج المقاومة و الجهاد ضاربا بعرض الحائط رموز الفساد و النفاق و التخاذل ( اللهم سدد خطى حماس و ثبتها )<br />و مرتزقة عصابات المارينز يسقطون كل يوم في بلاد الرافدين و بطرق أشد عنفا و شراسة من سابقتها<br />ماذا يفعل بوش السكير أمام كل هذه المصائب كي لا يبدو في صورة \"عريس الغفلة\" أمام شعبه و لتزداد شعبيته و ليحصد حزبه مزيدا من النقاط و الـتأييد ؟<br />ماذا يفعل بوش السكير بعد افتضاح أمر عصابات المارينز و جرائمها في الإسحاقي و حديثة ؟ ماذا يفعل و فرق الموت القذرة التابعة للمجرم نيجروبونتي بدأت رائحتها تزكم الأنوف ؟<br />لابد من نصر سريع ساخن – على طريقة الوجبات السريعة الساخنة – للفت الأنظار للبطل جورج دبليو بوش محرر البشرية و لإظهار كفاءة و \" شجاعة \" جيش السفاحين و المرتزقة و اللقطاء<br />أنا الآن في انتظار المسمارالرابع من مسامير جحا الأمريكي للتغطية على وساخات أمريكا في المنطقة و العراق<br />المسمار الأول : أسلحة الدمار الشامل<br />المسمار الثاني : كان صدام حسين ( الحليف القديم )<br />المسمار الثالث : أبو مصعب الزرقاوي ( ولا زلت مصرا على كونه شخصية هوليودية )<br />فليكن أبو مصعب حيا أو ميتا ... لا يهمني<br />فليكن أبو مصعب مجاهدا أو مجرما ... لا يهمني<br />فليكن أبو مصعب حقيقة أو خيالا ... لا يهمني<br />المهم أن هناك عدوا مجرما يجاهر لديننا بالعداء و يود أن يفعل بنا ما فعله بالهنود الحمر من قبل ... هذا العدو مادام هو الذي جاء لأرضنا بالشر و البغي و العدوان فيجب إبادته بوحشية و شراسة حتى و لو بقطع الرءوس<br />و هنيئا للصليبيين و الصهاينة و الصفويين المعممين و المنافقين السلوليين هذا العرض الهوليودي الشيق<br />و لعنة الله على القوم الظالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124915/http://www.20at.com/article2.php?sid=924"

