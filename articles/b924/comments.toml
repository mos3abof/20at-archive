subject = "كيف تنصر المجاهدين ؟"
author = "قد يقول قائل إن نصرة المجاهدين -نصرهم ربي وحرسهم - انما تكون بالذهاب الى مواطن الجهاد كالعراق وافغانستان وغيرها من مواطن الجهاد ، أقول نعم هذا صحيح ، ولكن ما اراه نافعا أيضا (خاصة أن كثيرا منا لايحسن استخدام السلاح) أن نصرة المجاهدين انما تكون بالمشاركة الجادة في دعوة الاصلاح وازالة الظلم كل في بلدة."
posted = "2006-06-11"
text = "فأهل مصر يجتهدون في ازالة الفرعون.<br />وأهل الجزيرة يجتهدون في ازالة ال سعود<br />وأهل الاردن يجتهدون في ازالة ملكهم الخائن.<br />وأهل سوريا يجتهدون في ازالة الاسد وجوقته المجرمة.<br />وأهل باكستان يجتهون في ازالة برويز الخائن الغادر.<br />إن ازالة الطواغيت ، واقامة دولة الحق والعدل أكبر نصر للاسلام وأهله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124915/http://www.20at.com/article2.php?sid=924"

