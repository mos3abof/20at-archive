[[comments]]
order = 2
subject = "عن اى وفد تتكلمون"
author = "غراب البين"
posted = "2007-02-12"
text = "لا علاقة لحزب الوفد القديم الذى كان شعبيا وطنيا يقودة اغنياء لمناصرة الفقراء<br />كان يمثل الكرامة الوطنية احيانا ويدافع عنها عاليا<br />وعندما مات النحاس فى زمن اوج عبد الناصر خرجت مظاهرة فى جنازتة تهتف لا ديمقراطية بعدك يا نحاس<br />ولم يكن الامن المركزى اسف القمع المركزى قد اخترع بعد<br />الا ان هذا النحاس وقف فى مجلس الامة بعد تعيينة رئيسا للوزراء من قبل الانجليز وقف يخطب فى حضور الملك قائلا<br />لى امل واحد يا مولاى ارجوا ان تحققة لى<br />هو ان تسمح لى ان اقبل يدك<br />شايفين الاصالة الديمقراطية<br />برضة ممكن هذا الاباظة ان يطلب تقبيل يد احدهم<br />وحينما جاء الوفد الجديد ايام السادات تخصص فى شيئا واحدا هو سب الفترة الناصرية<br />وبيان كل سلبياتها والدعوة الى هدم السد العالى والغاء مجانية التعليم وعودة الطرابيش واللازم منة<br />ارجوكم انسوا تاريخهم الاسود<br />وليغفر اللة لهم ولنا"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073656/http://masr.20at.com:80/article.php?sid=1575"

[[comments]]
order = 3
subject = "اباظه وشركات الادويه الامريكيه ورجل المربى"
author = "ايمن امام"
posted = "2007-02-12"
text = "اباظه ورجل المربى الذى يذهب بصفه دوريه الى اهل النوبه لتحريضهم على افتعال انفصال عن الدوله- كلهم معينون بامر السفاره الامريكيه - حزب الوفد تحول الى جراج للحكومه لكل مخلص مطيع لها لاتجد له مكان فى المناصب الديكوريه- اتعجب من رجال يأكلون اصناف من الطعام لانعرف اسمها ثم يتحدثون عن الفقر فى مصر - وهم من كانو يعتبرون الد ابه فى الحقل اغلى من الفلاح- عائله كلها عينها خضرا ويقولك مصرى - عيله كلها تربيه انجليزيه ويقولك مصرى - ياريت يااخوانا تسألوه عدد ركعات صلاه الظهر كام ركعه<br />ايمن امام"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073656/http://masr.20at.com:80/article.php?sid=1575"

[[comments]]
order = 4
subject = "يا غراب البين"
author = "وفدي قديم"
posted = "2007-02-13"
text = "اسمع يا غراب البين تعليقك كله متناقضات واكاذيب تصف الوفد القديم بانه كان شعبيا ثم تنتقد قيادته مصطفي النحاس الذي تولي الوزارة 6 مرات ولعلمك مئات الالاف اللي مشيوا في جنازة النحاس كان ردا علي المحاولات الناصرية لطمس تاريخ النحاس والوفد وتم اعتقال الوفديين الذين هتفوا للنحاس عند دفنه ومنهم علي سلامة وعبد الفتاح حسن وطلعت رسلان وفؤاد سراج الدين واخوته والشيخ محمد ابو علي وغيرهم ومكثوا في المعتقل 3سنوات هذا هو حكم سيدك عبد الناصر لمجرد هتاف تعتقل 3 سنوات ولعلمك ايضا الامن المركزي موجود من ايام عبد الناصر الدكتاتور الاكبر اللهم العنه وانتقم من اتباعه واذنابه"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073656/http://masr.20at.com:80/article.php?sid=1575"

[[comments]]
order = 5
subject = "عزيزى الوفدى القديم"
author = "غراب البين"
posted = "2007-02-13"
text = "انا مصرى ولست ناصرى واحب عبد الناصر واعتبرة من اشرف رجالات مصر على مر العصور<br />نعم احب ناصر العظيم لا ننى تعلمت فى مدارس ناصر المجانية<br />وتخرجت من جامعات ناصر المجانية<br />وعبد الناصر هو الذى حقق الجلاء للانجليز من مصر رغم تكوينكم للوفد الذى ذهب لمفاوضة الانجليز على الخروج ولكنكم رجعتم ووفدكم بخيبة<br />ماذا حقق الوفد وطرابيشة غير امنية ان يقبل يد جلالة الملك<br />اليست حكومة الوفد هى اول حكومة تتسبب فى هزيمة 1948 وضياع فلسطين<br />الم تكونوا برادع الانجليز<br />الم ترفعوا شعار الاحتلال على يد سعد ولا الجلاء على يد عدلى واقصد عدلى يكن باشا<br />يا رجل اسم الوفد بيدل على اية واية اللى عملة الوفد غير المثل الشهير<br />غطينى يا صفية وصوتى<br />وغطى عبد الناصر الوفد ولم يصوت بل قال ارفع رأسك يا اخى فقد مضى عهد الاستعباد"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073656/http://masr.20at.com:80/article.php?sid=1575"

[[comments]]
order = 6
subject = "لا لتزوير التاريخ يا غراب"
author = "وفدي قديم"
posted = "2007-02-14"
text = "يا غراب البين لازم تثقف نفسك كويس وتقرأ كتير عن تاريخ بلدك لان ثقافة افلام التلفزيون اللي غسلت مخ السذج ما بقتش تنفع لانه لا يصح الا الصحيح اولا مجانية التعليم دي اللي عملها الوفد سمنة50 مجانية كاملة من الابتدائي للجامعه وكان وزير التعليم وقتها د طه حسين وده تاريخ معروف وكانت الجامعات وقتها بمصاريف قليلة ويعفي منها المتفوق وعبد الناصر ابن البوسطجي الفقير استطاع ان يتعلم في هذا العصر هو وشلته الانقلابية وكلهم من اوساط فقيرةثانيا يا جاهل ايام حرب 48 لم يكن الوفد في الحكم بل كان حزب السعديين بقيادة النقراشى باشا وكان قائد الجيوش هو الملك عبد الله ملك الاردن وجد الملك حسين وهو سبب الهزيمة وماذا عن هزيمة سيدك الهالك في 56 و67 واليمن وحرب الاستنزاف وكل حرب خاضها مما ادي الي خراب مصر وبعدين اتفاقية الجلاء اللي وقعها عبد الناصر كانت مخزية لمصر وهي نفس اتفاقية صدقي بيفن التي رفضها الشعب كانت كل الاحزاب قبل انقلاب 52 ترفع شعار الجلاء والوحدة مع السودان وهو ما فرط فيه زعيمك الفاشل في كل شيء واضاع السودان وهو عمق استراتيجي لمصر الي ان انتهت مصر للدكتاتورية ودولة الحزب الواحد والراي الواحد والصحف الحكومية فقط والمعتقلات والتعذيب والخراب التام يابني بلاش تزوير للتاريخ لان ده ارث اسود نعاني منه للان"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073656/http://masr.20at.com:80/article.php?sid=1575"

[[comments]]
order = 7
subject = "تذكر التاريخ"
author = "صقر"
posted = "2007-02-14"
text = "افتكر يا أباظة ومن هو علي شاكلتك ان التاريخ لا يرحم.فكما أعز اقواما ورفعهم وسجلهم بحروف من نور وتسمعهم بأذنك الخبيثةذكراهم حتى الان رغم انهم ماتو منذ سنين والعالم كله يردد اسماءهم بكل فخر مثل الامام حسن البنا والشيخ عز الدين القسام- فانه هو ايضا الذى سيركلك في مذبلته انت والرئيس وحكومة ابنه وهذا الجيل ان لم يتحرك وكفاك ذلة ان الله جل وعلى قال في أمثالك\"مثله كمثل الكلب إن تحمل عليه يلهث أوتتركه يلهث\"وانت في الحالتين تلهث \"وتلحس جزمة الرئيس\""
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073656/http://masr.20at.com:80/article.php?sid=1575"

[[comments]]
order = 8
subject = "الطربوش القديم والقبقاب"
author = "لا زالت لبقبة الطرابيش بقايا معفنة ومحنطة ولنرجع الى مشروع الباشا النحاس المشروع القومى لة"
posted = "2007-02-14"
text = "فنتيجة لسياستة الموالية للاحتلال افتقر الشعب المصرى واصبح 80% منة يمشى حافى تصوروا الشعب لم يجد فى رجلة مداس يلبسة وكنت ترى فى قاهرة المعز ناس كتير ماشية حافية نتيجة الاقطاع والتسلط والجهل<br />وخرج النحاس بمشروعة مكافحة الحفاء<br />وملخص مشروعة جمع تبرعات من الاغنياء والبشوات لشراء قباقيب للحافيين<br />هذا هو النحاس الباشا بتاع القباقيب<br />وجاء عبد الناصر<br />وكان يبنى كل يومين 3 مدارس<br />وبنى مصانع للايدى العاملة<br />وحينما مات لم يكن فى مصر حافى واحد ولم يكن يلبس قبقاب الباشا ولكنة كان يلبس احذية باتا الصناعة المصرية<br />وخرج الذين كانوا حفاة بالملايين وليس بلالاف<br />يودعون الزعيم الحبيب ابن مصر<br />خرج الفقراء وليس الباشوات الاتراك يودعون واحد منهم بكل الحب كما لم يحدث فى تاريخ مصر القديم والحديث<br />ومات الوفديين كمدا بتوع الدستور يا افندينا<br />ويقول النحاس للملك باسلوب نفاق<br />الشعب يحبك يا ولى النعم<br />وفد اية وزفت اية روحوا ادفنوا نفسكم"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073656/http://masr.20at.com:80/article.php?sid=1575"

[[comments]]
order = 9
subject = "لصاحب التعليق السابق غراب"
author = "وفدي قديم"
posted = "2007-02-15"
text = "يا غراب انت ثقافتك محدودة جدا وتلفزيونية ولك حق 55 سنة تزييف اعلامي وغسيل مخ اولا مشروع مكافحة الغلاء قامت به احدي الجمعيات الخير ية السابقة قبل 52 وليس حكومة النحاس يا فالح وده كان موجه للمتشردين في الشوارع وده زي اطفال الشوارع الان اللي عددهم زاد وبعدين زمان كانت كل حاجة برخص التراب وكان الجنيه المصري اقوي من الجنيه الدهب اللي ضيعه زعيمك في حرب اليمن وافقر مصر ثم ان البشاوات اللي بتتكلم عليهم كانوا مصريين ابا عن جد ومصريين للنخاع اكثر منك وكل قادة الحركة الوطنية كانوا من البا شوات مثل احمد عرابي باشا ومصطفي كامل باشا وسعد زغلول باشا وطلعت حرب باشا والنحاس باشا جبت منين ان شاء الله ان دول اتراك اتحدي تجيبلي باشا واحد تركي مانتوا طول عمركم بتزوروا في التاريخ وماسكين الحكم الي الان مبارك هو امتداد طبيعي لحكم المؤسسه العسكرية منذ انقلاب 52 المشئوم واذا سقط هذا النظام ستسقطوةن معه وستداسون بالنعال وتفتح ملفات جرائمكم وايديكم الملطخة بدماء المصريين من قتل وتعذيب ومعتقلات وارهاب كان حكمكم تدمير لمصر اللهم انتقم من امثالكم من المجرمين"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073656/http://masr.20at.com:80/article.php?sid=1575"
