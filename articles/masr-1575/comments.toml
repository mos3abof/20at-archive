[[comments]]
order = 0
subject = "تأجير الوفد مفروش للجنة الوكوسات"
author = "إبن بهيه"
posted = "2007-02-12"
text = "للأسف الشديد مر حزب الوفد كغيره من الأحزاب المصرية بعدة أزمات مفتعلة من الحكومة التي قررت تمويت الحياة السياسية في مصر حتى لا يبقى غير الحزن الوطني ولصوصه على الساحة .. خربها مبارك الواطي وقعد على تلها ، ولما خربت خالص خالص يعني وما بقاش فيه أحزاب خالص وبص الجرو الصغنن في لجنة وكوسات أهله لقي نفسهم عريانين زلط ملط .. قالك نجيب عيلين من بتوع الأحزاب ونطلعهم يبقوا رؤساء للأحزاب ونديلهم كام كرسي في الانتخابات الجاية .. وجه أباظه بعد الحريقة اياها اللي طيروا فيها جمعه عقابا وتأديبا وتربية له لأنه تجرأ ورشح نفسه لكرسي الرئاسة الملكية الملاكي منوفية ((مع الاعتذار لكل إخواننا المنايفة الرجاله .. بس بصراحة مبارك الواطي يعر الكرة الأرضية كلها مش المنايفه بس .. سامحونا)).<br />بصراحة حاجه تكسف لما ييجي رئيس لحزب الوفد من لجنة وكوسات الحزن الوطني وبتعيين من جيمي الكلب .. بجد حاجه تكسف وتخجل وتعر كل الوفديين إن كان لسه فيه وفديين في بر مصر .. عموما حركة إخوانا الاسكندرانية جايه في وقتها وكان لازم الوفديين يتحركوا ويوقفوا المهزلة اللي شغاله دي وتأجير حزب الوفد مفروش بالليلة لجيمي بتاع لجنة الوكوسات عشان يمارس فيه كل أشكال الدعارة السياسية ..<br />عيب يا شباب الوفد تقفوا كده ويطلع لكم حاجات في رؤوسكم كده مش عارف اسمها إيه .. عيب تسيبوا عمليات القوادة والقرننة ........ دي تمر كده وحضراتكم ساكتين .. طبعا حضراتكم عارفين اللي بيسكت في الحالات دي يبقى اسمه إيه .. طبعا أنتم لن تسمحوا لأنفسكم بذلك ولن تسمحوا أن يقول عنكم أحد ذلك .. ولا إيه ؟<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073656/http://masr.20at.com:80/article.php?sid=1575"

