[[comments]]
order = 6
subject = ""
author = "سعوديه وافتخر"
posted = "2009-10-12"
text = "الحمدلله نعمه من الله انك لاتعلم متى اجلك ولو كانت اخر ساعه لي لاقضيتها ساجده لربي عله يرحمني بها يوم العرض وتحت الارض…<br />اما ماكتب من تعليقات فانا استغرب اكثرها هل وصل الجهل بكم لهذه الدرجه؟؟؟من يريد ان يمارس معاصي او يشكي هموم او يبوح بقصه حب اين انت من هذا وملك الموت يقف على رأسك وتنتظر عذاب او مغفره…عش هذه اللحظات بجد مو مزح وتريقه والله غير تبكي باعلى صوتك وتقول يااارب ارحمني اذا جائتني هذه اللحظات.."
archived = "2009-11-02"
capture_url = "https://web.archive.org/web/20091102143021/http://www.20at.com:80/20at/7ayatna/13679-2009-10-11-13-31-44.html"

[[comments]]
order = 7
subject = ""
author = "جيـــمـي إلي سعودية"
posted = "2009-10-13"
text = "أعتقد الى انتى بتقوليه ده حاجة اساسية مش محتاجة كلام<br />ثم أن كاتب الموضوع قال : جميعنا سنصلي ونستغفر ربنا لذنوبنا الكثيييييييرة،.. إنما هناك عمل واحد هو المسيطر على أحلامك .<br />يعنى ما تحسيسناش أننا جهلة ومش بنخاف من ربنا وأنك الوحيدة الى بتخافي منه .. كلنا بنخاف من ربنا وبنتمنى أنه يحسن خاتمتنا … بس أكيد كل واحد وله أحلام نفسه يعملها ."
archived = "2009-11-02"
capture_url = "https://web.archive.org/web/20091102143021/http://www.20at.com:80/20at/7ayatna/13679-2009-10-11-13-31-44.html"

