text = "أسئل الله أن يهدي شباب الاسلآمــــــ ..!<br />وَأطلب من الله أن أقضي آخر ساعه من عمري سآجده أمآمـــــ الكعبه .. فلا سيارات سـَ تفيدني ولا إثاره لحظيه سـِ تسعدني ..<br />فكل هذا زائل .. ووحدهآ مرضاه الله باقيه ..!"
