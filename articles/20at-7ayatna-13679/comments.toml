posted = "2009-10-12"
text = "ولدتك امك يابن ادم باكيا والناس حولك يضحكون سرورا<br />فاعمل ليوم موتك اذا بكوا تكوووون ضاحكا مسرورااااااا<br />اللهم اجعلنا ووالدينا من يلقاك وقد كتبت لهم الجنه بغير حسااااب<br />رحماااااااك ياالله اغفر لنا وتجاوز عن سيئانتا"
