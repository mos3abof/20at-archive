text = "اللي يقرا اجوبة الناس فوق يحس ان الناس اتهبلت .. مافيش 3 او اربع ردود بس هي اللي كويسه اما الباقي فلا حول و لا قوة الا بالله .. ياخونا الواحد فينا مهما كان بتاع بنات و سرمحه و اغاني و ضرب الا انه عارف ان اللي بيعمله ده غلط و لو اتسال سؤال الاخر ساعه ده هايجاوب انه يتمني انه يصلي او انه مثلا يكون قودام الكعبه , لكن اللي نفسها تعزف و لا تبقي ذي فاتن حمامه و لا اللي نفسه يحضر حفلة لعمرو و اللي تعمل رجيم و اللي يشهيص نفسه … بجد … ( جودلك يا جماعه )"
