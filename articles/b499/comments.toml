[[comments]]
order = 17
subject = "الى الشاعر الشعبي المجهول..... اكرم"
author = "sweet_princess"
posted = "2006-03-01"
text = "لا ياعم ماتقلقش انا خلاص لقيت اللي رضي يسلفني وشحنت خلاص عقبالكم اجمعين .<br />بالنسبه للشعر انا بحب نزار قباني وامل دنقل جدابعشق اسلوبهم .<br />بس بحب كمان صلاح جاهين واحمد فؤاد نجم.<br />ولو ما لاحظتش يعني الح اقرا الرباعيتين اللي انا حطيتهم في مقال (موت الكلام علينا لايحق )وابقى قوللي رايك .<br />بس طالما انت خبير كده انا عندي رجاء (طلب يعني )(((احسن ماتعرفش يعني ايه رجاء ويطلع معاك نحو اميه )<br />انا دايخه على قصيدةلا تصالح لامل دنقل وبجد نفسي اجيبها باي طريقه لو موجوده عندك او تعرف حتى الاقيها فين او حتي ديوان الشعر اللي نزلت فيه يبقى ايه اكون شاكره ليك جدا والله .<br />كلمه اخيره :<br />اختياراتك حلوه قوي واسلوبك رائع في الكتابه انت ومصري .<br />ودبدوب كمان ....هه ..عشان مايزعلش."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

[[comments]]
order = 18
subject = "اترى حين افقأ عينيك ثم استبدل جوهرتين مكانهما هل ترى ؟؟؟"
author = "أكرم"
posted = "2006-03-02"
text = "شوفت يا دبدوب ربنا كريم ازاي ؟؟<br />سويت برنسس لقيت اللي يسلفها و انا لقيت حد تاني بيحب امل دنقل<br />اما عن قصيدة لا تصالح فهي اجمل و اشد ما كتب امل دنقل و لا يذكر امل دنقل الا و تذكر قصيدة لا تصالح و اي موقع لامل دنقل لازم تلاقي عليه لا تصالح<br />و اليكم سيداتي انساتي سادتي اسيادي يا سوادي نبذه قصيرة عن قصيدة لا تصالح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

[[comments]]
order = 19
subject = "لا تصالح ( الوصايا العشر )"
author = "أكرم"
posted = "2006-03-02"
text = "اسمها لا تصالح او الوصايا العشر في افتتاحية ديوان اقوال جديدة عن حرب البسوس<br />و حرب البسوس لمن لا يعرفها هي اطول حرب في تاريخ الجزيرة العربية يقال انها حدثت بسبب ناقة و لكن الحقيقة اكبر من ذلك<br />بدات حينما كان كليب بن ربيعه ( من قبيلة بكر و تغلب و كان قائدا للجيش ) و اصابت احد سهامه ضرع ناقة كانت ترعى لقبية تضمر فما كان من وشايه لامراه اسمها البسوس الا ان قام سيد القوم جساس بن مره ( اخته جليلةبنت مره زوجه كليب ) باغتيال كليب انتقامل منه<br />و يتخيل الشاعر في هذه القيدة ان كليب بن ربيعه زحف على صخرة و هو يموت و كتب من دمه هذه الابيات لاخية الزير سالم ( المهلهل بن ربيعه ) و يحضه على الحرب و على عدم التسامح او التهاون في حقه المسلوب<br />و هذه الوصايا العشر موجهه جميعا للزير سالم ( و الحدق يفهم )<br />ملحوظة اخيرة : هذه القصيدة كتبت قبل اتفاقية كامب ديفيد و تعتبر ارهاصه جديدة للشاعر و توقعه للمستقبل بخبرته و ادراكه لزمنه<br />و الان سيادتي انساتي سادتي اسيادي يا سوادي مع القصيدة :"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

[[comments]]
order = 20
subject = "لا تصالح ( الوصايا العشر ) لامل دنقل"
author = "أكرم"
posted = "2006-03-02"
text = "لا تصالحْ!<br />ولو منحوك الذهبْ<br />أترى حين أفقأ عينيكَ<br />ثم أثبت جوهرتين مكانهما..<br />هل ترى..؟<br />هي أشياء لا تشترى..:<br />ذكريات الطفولة بين أخيك وبينك،<br />حسُّكما - فجأةً - بالرجولةِ،<br />هذا الحياء الذي يكبت الشوق.. حين تعانقُهُ،<br />الصمتُ - مبتسمين - لتأنيب أمكما..<br />وكأنكما<br />ما تزالان طفلين!<br />تلك الطمأنينة الأبدية بينكما:<br />أنَّ سيفانِ سيفَكَ..<br />صوتانِ صوتَكَ<br />أنك إن متَّ:<br />للبيت ربٌّ<br />وللطفل أبْ<br />هل يصير دمي -بين عينيك- ماءً؟<br />أتنسى ردائي الملطَّخَ بالدماء..<br />تلبس -فوق دمائي- ثيابًا مطرَّزَةً بالقصب؟<br />إنها الحربُ!<br />قد تثقل القلبَ..<br />لكن خلفك عار العرب<br />لا تصالحْ..<br />ولا تتوخَّ الهرب!<br />(2)<br />لا تصالح على الدم.. حتى بدم!<br />لا تصالح! ولو قيل رأس برأسٍ<br />أكلُّ الرؤوس سواءٌ؟<br />أقلب الغريب كقلب أخيك؟!<br />أعيناه عينا أخيك؟!<br />وهل تتساوى يدٌ.. سيفها كان لك<br />بيدٍ سيفها أثْكَلك؟<br />سيقولون:<br />جئناك كي تحقن الدم..<br />جئناك. كن -يا أمير- الحكم<br />سيقولون:<br />ها نحن أبناء عم.<br />قل لهم: إنهم لم يراعوا العمومة فيمن هلك<br />واغرس السيفَ في جبهة الصحراء<br />إلى أن يجيب العدم<br />إنني كنت لك<br />فارسًا،<br />وأخًا،<br />وأبًا،<br />ومَلِك!<br />(3)<br />لا تصالح ..<br />ولو حرمتك الرقاد<br />صرخاتُ الندامة<br />وتذكَّر..<br />(إذا لان قلبك للنسوة اللابسات السواد ولأطفالهن الذين تخاصمهم الابتسامة)<br />أن بنتَ أخيك \"اليمامة\"<br />زهرةٌ تتسربل -في سنوات الصبا-<br />بثياب الحداد<br />كنتُ، إن عدتُ:<br />تعدو على دَرَجِ القصر،<br />تمسك ساقيَّ عند نزولي..<br />فأرفعها -وهي ضاحكةٌ-<br />فوق ظهر الجواد<br />ها هي الآن.. صامتةٌ<br />حرمتها يدُ الغدر:<br />من كلمات أبيها،<br />ارتداءِ الثياب الجديدةِ<br />من أن يكون لها -ذات يوم- أخٌ!<br />من أبٍ يتبسَّم في عرسها..<br />وتعود إليه إذا الزوجُ أغضبها..<br />وإذا زارها.. يتسابق أحفادُه نحو أحضانه،<br />لينالوا الهدايا..<br />ويلهوا بلحيته (وهو مستسلمٌ)<br />ويشدُّوا العمامة..<br />لا تصالح!<br />فما ذنب تلك اليمامة<br />لترى العشَّ محترقًا.. فجأةً،<br />وهي تجلس فوق الرماد؟!<br />(4)<br />لا تصالح<br />ولو توَّجوك بتاج الإمارة<br />كيف تخطو على جثة ابن أبيكَ..؟<br />وكيف تصير المليكَ..<br />على أوجهِ البهجة المستعارة؟<br />كيف تنظر في يد من صافحوك..<br />فلا تبصر الدم..<br />في كل كف؟<br />إن سهمًا أتاني من الخلف..<br />سوف يجيئك من ألف خلف<br />فالدم -الآن- صار وسامًا وشارة<br />لا تصالح،<br />ولو توَّجوك بتاج الإمارة<br />إن عرشَك: سيفٌ<br />وسيفك: زيفٌ<br />إذا لم تزنْ -بذؤابته- لحظاتِ الشرف<br />واستطبت- الترف<br />(5)<br />لا تصالح<br />ولو قال من مال عند الصدامْ<br />\".. ما بنا طاقة لامتشاق الحسام..\"<br />عندما يملأ الحق قلبك:<br />تندلع النار إن تتنفَّسْ<br />ولسانُ الخيانة يخرس<br />لا تصالح<br />ولو قيل ما قيل من كلمات السلام<br />كيف تستنشق الرئتان النسيم المدنَّس؟<br />كيف تنظر في عيني امرأة..<br />أنت تعرف أنك لا تستطيع حمايتها؟<br />كيف تصبح فارسها في الغرام؟<br />كيف ترجو غدًا.. لوليد ينام<br />-كيف تحلم أو تتغنى بمستقبلٍ لغلام<br />وهو يكبر -بين يديك- بقلب مُنكَّس؟<br />لا تصالح<br />ولا تقتسم مع من قتلوك الطعام<br />وارْوِ قلبك بالدم..<br />واروِ التراب المقدَّس..<br />واروِ أسلافَكَ الراقدين..<br />إلى أن تردَّ عليك العظام!<br />(6)<br />لا تصالح<br />ولو ناشدتك القبيلة<br />باسم حزن \"الجليلة\"<br />أن تسوق الدهاءَ<br />وتُبدي -لمن قصدوك- القبول<br />سيقولون:<br />ها أنت تطلب ثأرًا يطول<br />فخذ -الآن- ما تستطيع:<br />قليلاً من الحق..<br />في هذه السنوات القليلة<br />إنه ليس ثأرك وحدك،<br />لكنه ثأر جيلٍ فجيل<br />وغدًا..<br />سوف يولد من يلبس الدرع كاملةً،<br />يوقد النار شاملةً،<br />يطلب الثأرَ،<br />يستولد الحقَّ،<br />من أَضْلُع المستحيل<br />لا تصالح<br />ولو قيل إن التصالح حيلة<br />إنه الثأرُ<br />تبهتُ شعلته في الضلوع..<br />إذا ما توالت عليها الفصول..<br />ثم تبقى يد العار مرسومة (بأصابعها الخمس)<br />فوق الجباهِ الذليلة!<br />(7)<br />لا تصالحْ، ولو حذَّرتْك النجوم<br />ورمى لك كهَّانُها بالنبأ..<br />كنت أغفر لو أنني متُّ..<br />ما بين خيط الصواب وخيط الخطأ.<br />لم أكن غازيًا،<br />لم أكن أتسلل قرب مضاربهم<br />أو أحوم وراء التخوم<br />لم أمد يدًا لثمار الكروم<br />أرض بستانِهم لم أطأ<br />لم يصح قاتلي بي: \"انتبه\"!<br />كان يمشي معي..<br />ثم صافحني..<br />ثم سار قليلاً<br />ولكنه في الغصون اختبأ!<br />فجأةً:<br />ثقبتني قشعريرة بين ضعلين..<br />واهتزَّ قلبي -كفقاعة- وانفثأ!<br />وتحاملتُ، حتى احتملت على ساعديَّ<br />فرأيتُ: ابن عمي الزنيم<br />واقفًا يتشفَّى بوجه لئيم<br />لم يكن في يدي حربةٌ<br />أو سلاح قديم،<br />لم يكن غير غيظي الذي يتشكَّى الظمأ<br />(8)<br />لا تصالحُ..<br />إلى أن يعود الوجود لدورته الدائرة:<br />النجوم.. لميقاتها<br />والطيور.. لأصواتها<br />والرمال.. لذراتها<br />والقتيل لطفلته الناظرة<br />كل شيء تحطم في لحظة عابرة:<br />الصبا - بهجةُ الأهل - صوتُ الحصان - التعرفُ بالضيف - همهمةُ القلب حين يرى برعماً في الحديقة يذوي - الصلاةُ لكي ينزل المطر الموسميُّ - مراوغة القلب حين يرى طائر الموتِ<br />وهو يرفرف فوق المبارزة الكاسرة<br />كلُّ شيءٍ تحطَّم في نزوةٍ فاجرة<br />والذي اغتالني: ليس ربًا..<br />ليقتلني بمشيئته<br />ليس أنبل مني.. ليقتلني بسكينته<br />ليس أمهر مني.. ليقتلني باستدارتِهِ الماكرة<br />لا تصالحْ<br />فما الصلح إلا معاهدةٌ بين ندَّينْ..<br />(في شرف القلب)<br />لا تُنتقَصْ<br />والذي اغتالني مَحضُ لصْ<br />سرق الأرض من بين عينيَّ<br />والصمت يطلقُ ضحكته الساخرة!<br />(9)<br />لا تصالحْ<br />ولو وقفت ضد سيفك كل الشيوخْ<br />والرجال التي ملأتها الشروخْ<br />هؤلاء الذين يحبون طعم الثريدْ<br />وامتطاء العبيدْ<br />هؤلاء الذين تدلت عمائمهم فوق أعينهم<br />وسيوفهم العربية قد نسيت سنوات الشموخْ<br />لا تصالحْ<br />فليس سوى أن تريدْ<br />أنت فارسُ هذا الزمان الوحيدْ<br />وسواك.. المسوخْ!<br />(10)<br />لا تصالحْ<br />لا تصالحْ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

