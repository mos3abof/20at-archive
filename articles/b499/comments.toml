text = "لاتقل أنفلوانزا الطيور<br />أنفلوانزا المصريين!!!؟<br />أنفلوانزا المصريين!!!؟<br />أنفلوانزا المصريين!!!؟<br />أنفلوانزا المصريين!!!؟<br />أنفلوانزا المصريين!!!؟<br />أنفلوانزا المصريين!!!؟<br />أنفلوانزا المصريين!!!؟<br />مرض اصاب بة الشعب المصري اسمة انفلوانزا المصريين ناتج عن ممكن تكون اشاعة او فرقعة او مصلحة اسمها انفلوانزا الطيور<br />تلك الأنفلوانزا التي ادت الى انهيار و تدهور الشعب المصري داخياً و إهانتة خارجياً<br />انظر إلى اسعار الدواجن بعد ما هدءت عاصفة انفلوانزا الطيور<br />انظر إلى سعر كيلو اللحم<br />انظر إلى البنزبن<br />أنظر ايضا البيض و السكر و الزيت وهذا كما يقولون غيض من فيض<br />أنفلوانزا المصريين!!!؟أنفلوانزا المصريين!!!؟أنفلوانزا المصريين!!!؟أنفلوانزا المصريين!!!؟<br />محمد حسن غنيم"
