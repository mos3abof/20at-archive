posted = "2006-02-27"
text = "يا جماعة مش منطقي ان كل ما تحصل حاجة يقولوا ده عقاب من ربنا<br />يعني لما الاعاصير ضربت جنوب usa قالوا ده عقاب من ربنا وجزاء تصرفاتها مع انه ضرب بلاد امريكا الوسطي الغلابة برضه<br />ولما تسونامي ضرب جنوب اسيا قالوا ده عقاب من ربنا عشان الناس العريانة علي الشواطئ وسياحة الجنس مع ان الاعصار انطلق من اندونيسيا اكبر دولة اسلامية وضرب ماليزيا برضه!!!!<br />واحنا في مصر مع كل كارثة يقولوا ده عقاب من ربنا<br />تبقي اسرائيل بقه دولة مبرووووووكة!!!!<br />مدد<br />حي<br />Dabdoob"
