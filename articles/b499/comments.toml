[[comments]]
order = 5
subject = "و صار يميام الحدائق قنابل تسقط في كل آن و غاب الكمان"
author = "أكرم"
posted = "2006-02-27"
text = "شجوية ( لحبيب قلبي أمل دنقل )<br />لماذا يُتابِعُني أينما سِرتُ صوتُ الكَمانْ?<br />أسافرُ في القَاطراتِ العتيقه,<br />(كي أتحدَّث للغُرباء المُسِنِّينَ)<br />أرفعُ صوتي ليُغطي على ضجَّةِ العَجلاتِ<br />وأغفو على نَبَضاتِ القِطارِ الحديديَّةِ القلبِ<br />(تهدُرُ مثل الطَّواحين)<br />لكنَّها بغتةً..<br />تَتباعدُ شيئاً فشيئا..<br />ويصحو نِداءُ الكَمان!<br />أسيرُ مع الناسِ, في المَهرجانات:<br />أُُصغى لبوقِ الجُنودِ النُّحاسيّ..<br />يملأُُ حَلقي غُبارُ النَّشيدِ الحماسيّ..<br />لكنّني فَجأةً.. لا أرى!<br />تَتَلاشى الصُفوفُ أمامي!<br />وينسرِبُ الصَّوتُ مُبْتعِدا..<br />ورويداً..<br />رويداً يعودُ الى القلبِ صوتُ الكَمانْ!<br />لماذا إذا ما تهيَّأت للنوم.. يأتي الكَمان?..<br />فأصغي له.. آتياً من مَكانٍ بعيد..<br />فتصمتُ: هَمْهمةُ الريحُ خلفَ الشَّبابيكِ,<br />نبضُ الوِسادةِ في أُذنُي,<br />تَتراجعُ دقاتُ قَلْبي,..<br />وأرحلُ.. في مُدنٍ لم أزُرها!<br />شوارعُها: فِضّةٌ!<br />وبناياتُها: من خُيوطِ الأَشعَّةِ..<br />ألْقى التي واعَدَتْني على ضَفَّةِ النهرِ.. واقفةً!<br />وعلى كَتفيها يحطُّ اليمامُ الغريبُ<br />ومن راحتيها يغطُّ الحنانْ!<br />أُحبُّكِ,<br />صارَ الكمانُ.. كعوبَ بنادقْ!<br />وصارَ يمامُ الحدائقْ.<br />قنابلَ تَسقطُ في كلِّ آنْ<br />وغَابَ الكَمانْ!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

[[comments]]
