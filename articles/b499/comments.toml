subject = "هي دي مصر يا اكرم"
author = "Dabdoob"
posted = "2006-02-28"
text = "للاسف يا اكرم<br />لن يشعر احد بامل دنقل ولن يفهمه احد<br />فلا يوجد احد يهتم بالشعر<br />ولعلك تذكر ايام دراستنا<br />هل كان يوجد غيرنا يقرا الشعر ويهتم به<br />بل هل كان هناك من يقرا العربية اساسا<br />زي ما باقول لك دايما<br />مفيش فايدة<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

[[comments]]
order = 7
subject = "ايه يا عم المحبط ؟؟؟"
author = "أكرم"
posted = "2006-02-28"
text = "عايز تذيع هنذيع مش عايز هنزيع برضوا لان احنا ع الهوا اساسا<br />بص يا دبدوب انا بحب امل دنقل و اللي عايز يقرا له يقرا و اللي مش عايز هو حر و اللي عايز يفهم و يعب نفسه شويه عشان يفهم حر برضوا و اللي عايز حاجة كده ع الجاهز هو حر برضه<br />اما عن ان محدش هيفهم امل دنقل فلا و الف لا فاكر لما كنت ان محدش بيفهم محمد منير و طلع ناس كتير بتحبه و بتفهمه<br />و بالمناسبة دي اهدي اغنية برة الشبابيك و اغنية الناس نامت الاي لمنير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

[[comments]]
order = 8
subject = "من قرطاس الكشري لتشت الغسيل حول"
author = "Dabdoob"
posted = "2006-02-28"
text = "من Dabdoob الي اكرم حول<br />انا ماقلتلكش ما تقراش امل دنقل<br />وانت عارف طبعا ان انا برضه باحبه قوي<br />انا بس قلت ان الناس مش هتفهم وده واقع مش احباط وقلت ان الناس برضه مش هتحاول تفهم ولا تقرا وده برضه حقيقة<br />يا بني احنا في مجتمع نصه جاهل والنص التاني امي<br />دي حاجةواضحة زي مااللون الابيض واضح في اللبن...<br />كفاية بقي عشان جالي احباط تحت الباط (تسلخات يعني)<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

[[comments]]
order = 9
subject = "امل دنقل و انفلونزا الطيور"
author = "أكرم"
posted = "2006-02-28"
text = "انا بكتب اشعار امل دنقل بتاعت الطيور عشان نعرف اد ايه يبقا صعب نعيش من غيرهم و نحن فدالك يا طيور الحرية فلو ماتت الطيور ازاي هنقول يا ريتني طير اطير حواليك ؟؟؟<br />و الان مع هذا الفاصل الشعري من قصيدة ( صفحات من كتاب الصيف والشتاء) لحبيب لبي أمل دنقل<br />1 - حمامة<br />حين سَرَتْ في الشارعِ الضَّوضاءْ<br />واندفَعَتْ سيارةٌ مَجنونةُ السَّائقْ<br />تطلقُ صوتَ بُوقِها الزاعقْ<br />في كبدِ الأَشياءْ:<br />تَفَزَّعَتْ حمامةٌ بيضاءْ<br />(كانت على تمثالِ نهضةِ مصرْ..<br />تَحْلُمُ في استِرخاءْ)<br />طارتْ, وحطَّتْ فوقَ قُبَّةِ الجامعةِ النُّحاسْ<br />لاهثةً, تلتقط الأَنفاسْ<br />وفجأةً: دندنتِ الساعه<br />ودقتِ الأجراسْ<br />فحلَّقتْ في الأُفْقِ.. مُرتاعهْ!<br />أيتُها الحمامةُ التي استقرَّتْ<br />فوقَ رأسِ الجسرْ<br />(وعندما أدارَ شُرطيُّ المرورِ يَدَهُ..<br />ظنتُه ناطوراً.. يصدُّ الطَّيرْ<br />فامتَلأتْ رعباً!)<br />أيتها الحمامةُ التَّعبى:<br />دُوري على قِبابِ هذه المدينةِ الحزينهْ<br />وأنشِدي للموتِ فيها.. والأسى.. والذُّعرْ<br />حتى نرى عندَ قُدومِ الفجرْ<br />جناحَكِ المُلقى..<br />على قاعدةِ التّمثالِ في المدينهْ<br />.. وتعرفين راحةَ السَّكينهْ!<br />و عشان دبدوب ميجيلوش احباط اللي فهم يقول فهمت ؟؟؟ و اللي مفهمش يخلي عنده شجاعه و يقول مفهمتش عادي يعني<br />انا عن نفسي قصيدة محمود درويش بتاعت يطير الحمام دي انا مش فاهم تلات تربعها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

[[comments]]
order = 10
subject = "تبقي البطيخة"
author = "Dabdoob"
posted = "2006-02-28"
text = "يا بني هي فزورة مين فهم ومين مافهمش<br />ده شعر يا بني والناس مش بتحب الشعر في المجتمع كله وده واضح<br />اما بالنسبة لامل دنقل فهو شاعر رائع ولكن انا باسال ما جدوي نشر الشعر لمن لا يقراه<br />ده حتي يبقي عامل زي ما تبعت جواب لواحد بال (هيدروسي) مع ان الواحد ده مابيتكلمش غير (حرتوني)<br />اخيرا بقي هاختم بامل دنقل عشان اصالحك:<br />من يمسك بالعملة يمسك بالوجهين<br />والفقراء بين...بين<br />كان معكم Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

