[[comments]]
order = 1
subject = "ناس وناس"
author = "مصري"
posted = "2006-02-26"
text = "حث الرئيس الفرنسي جاك شيراك المستهلكين الفرنسيين على الاستمرار في أكل الدجاج ، قائلا إن تناول الدجاج المطهي لا يزال آمنا برغم تأكيد اكتشاف السلالة القاتلة من فيروس انفلونزا الطيور المعروفة باسم H5N1 في أحد مزارع تربية ديك الحبش (الديكة الرومي) شرقي البلاد.<br />وحذر شيراك مما سماه \"الرعب غير المبرر\" جراء اكتشاف انفلونزا الطيور في فرنسا.<br />وكانت مبيعات الدجاج في فرنسا قد تعرضت لانخفاض حاد خلال الايام الاخيرة، الامر الذي اثار مخاوف من حصول انهيار لقطاع تربية الدواجن في البلاد.<br />وكانت السلطات الفرنسية اعلنت اكتشاف فيروس H5N1 في مزرعة للديك الرومي في شرقي البلاد.<br />وتعد هذه المرة الاولى التي تصاب فيها إحدى مزارع تربية الطيور في الاتحاد الأوروبي حيث اقتصرت الحالات المكتشفة في فرنسا سابقا على طائرين بريين.<br />وقالت وزارة الزراعة الفرنسية إن ديوك الحبش نفقت بمعدل كبير في المزرعة التي تضم 11 الف طائر.<br />يذكر أن فرنسا التي تعد أكبر بلد منتج للحوم الطيور في أوروبا ستبدأ في تلقيح الملايين من طيورها في الفترة المقبلة في إطار جهود مكافحة انفلونزا الطيور.<br />تدريب طوارئ<br />وفي وقت سابق، قامت السلطات في فرنسا بإجراء تدريب لاختبار فعالية خدمات الطوارىء في حال تفشي وباء أنفلونزا الطيور بين البشر.<br />ففي التدريب الذي جرى في مدينة ليون تم نقل اثنين يفترض أنهم من المرضى إلى منطقة معزولة في أحد المستشفيات.<br />وقال رئيس الوزراء الفرنسي دومينيك دوفيلبان أن فرنسا تملك \"واحدة من أكثر الخطط تقدما في أوروبا\" فيما يتعلق بالتعامل مع وباء أنفلونزا الطيور.<br />يذكر أن عشر دول أوروبية على الأقل، أعلنت عن حالات إصابة طيور برية بفيروس H5N1 القاتل.<br />وفي أعقاب التدريب قال دوفيلبان في مؤتمر صحفي إن فرنسا على أتم الاستعداد للتعامل مع تفش محتمل للفيروس بين البشر.<br />وأضاف أن الحكومة قد حصلت على 14 مليون جرعة من العلاج للتعامل مع أي تفش للوباء.<br />ولا يشكل مرض أنفلونزا الطيور تهديدا كبيرا للبشر، وذلك لعدم انتقاله من شخص إلى آخر.<br />لكن الخبراء يخشون من أن الفيروس قد يتطور ويكتسب إمكانية الانتقال بين البشر وعندها سيتسبب في مقتل ملايين الأشخاص.<br />وتقدر قيمة صناعة الدواجن في فرنسا بستة مليارات يورو (أي 7,12 مليار دولار أمريكي). ويقول مسئولون في صناعة الدواجن الفرنسية أن المبيعات قد انخفضت بنسبة 30% منذ الإعلان عن وصول المرض إلى أوروبا.<br />وقد أعلن رئيس الوزراء الفرنسي يوم الخميس عن تقديم مساعدات إضافية بقيمة 52 مليون يورو (أي 61,76 مليون دولار أمريكي) للمزارعين، من ضمنها مليوني يورو (أي 2,37 مليون دولار أمريكي) تم تخصيصها لإقامة حملة عامة لتطمين المستهلكين بشأن أكل الدواجن."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

