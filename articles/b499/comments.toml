text = "يا جماعة ارحموني<br />لما امريكا ضربتها الاعاصير قلتوا ده جزاءها وعقاب ربنا ليها مع انه ضرب برضه دول امريكا الوسطي الغلابة!!!<br />ولما تسونامي ضرب اسيا قلتوا ده عقاب من ربنا عشان الستات العريانة علي الشواطئ وعشان سياحة الجنس مع ان تسونامي انطلق من اندونيسيا اكبر دولة اسلامية وضرب ماليزيا كمان!!<br />واحنا كل ما تضربنا كارثة يقولوا ده برضه عقاب من ربنا عشان احنا عصاة ووحشين علي الاخر<br />الله<br />علي كده اسرائيل تبقي دولة مبروووووكة!!!!!<br />حي<br />مدددددد<br />يا ناس ارحمونا من الكلام ده وفكروا بجد في سبب الكوارث دي<br />وسلام<br />kokorah@maktoob.com<br />Dabdoob"
