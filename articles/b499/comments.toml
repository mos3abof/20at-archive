subject = "انفلونزا النسور"
author = "أكرم"
posted = "2006-02-26"
text = "احنا مخدناش بالنا من حاجة مهمة لو النسر اللي على علم مصر جالوه الانفلونزا مصير البلد هيبقا ايه ؟؟؟<br />اما عن تحليلي المنطقي لانفلونزا الطيور فهي عين و صابتنا بعد الانجازات اللي حققناها في العام المنصرم من خفض معدلات البطالة و اسكان جميع الشباب و اللي مش لاقيين ماوى و ارتفاع الجنيه المصري امام العيش البلدي في بورصه كفر الشيخ و الحياة الحلوة المرفهه اللي احنا عايشنها"
