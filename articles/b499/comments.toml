author = "سامي الفلسطيني"
posted = "2006-02-28"
text = "ومن بين هذه الإجراءات: إغلاق كوبري \"أبو الريش\" في القاهرة حتى إشعار آخر، ومنع عرض أفلام \"دعاء الكروان\" و\"السمان والخريف\" و\"عصفور من الشرق\" حتى زوال الأزمة، والاكتفاء بفيلم \"أفواه وأرانب\"، حيث لم يثبت بعد إمكانية انتقال العدوى للأرانب.<br />كما تقرر أيضا -بحسب \"المنشور\"- منع أغنية \"يا طير الوروار\" و\"يا طير يا طاير\" و\"طير في السما\" و\"الطير المهاجر\" و\"الدنيا ريشة في هوا\"، والتحفظ على الفنانة فاتن \"حمامة\" والمخرج سمير \"العصفوري\" والمؤلف بشير \"الديك\" في مناطق عزل صحي. وأخيرا يعلن المنشور الوهمي عن إلغاء مركزي \"الجناح\" الأيمن و\"الجناح\" الأيسر من جميع تشكيلات فرق كرة القدم في مصر، والاكتفاء بالهجوم من الوسط.<br />شعبولا هو الحل!<br />أما أكثر الاقتراحات طرافة فكانت ذلك الاقتراح الذي قدمه عضو مجلس الشورى (غرفة البرلمان الثانية) الدكتور محمود خضر لأعضاء اللجنة العليا لمتابعة الأزمة بدعوة المطرب الشعبي شعبان عبد الرحيم إلى تقديم أغان لإقناع الناس بخطر إلقاء الطيور النافقة في الشوارع والمجاري المائية.<br />وبرر ذلك بأن \"شعبولا\" كما يطلق عليه، هو الحل الأمثل للوصول إلى البسطاء وتوعيتهم بسبب انتشار أغانيه الشعبية ذات الطابع السياسي أحيانا والتي تعلق على الأحداث الجارية.<br />وفي الوقت الذي كشفت فيه وزارة الإعلام المصرية عن رصد ما بين 100-200 شائعة كاذبة يوميا تقريبا أخطرها شائعة تلوث مياه النيل التي ثبت عدم صحتها، سعى نواب في البرلمان ووزراء لطمأنة المصريين بشأن سهولة حصار المرض والقضاء عليه.<br />فقد أخرج نواب في البرلمان من جماعة الإخوان المسلمين قطع دجاج وأخذوا يأكلونها خلال جلسة لمجلس الشعب الثلاثاء 21-2-2006 أمام وسائل الإعلام، بهدف تشجيع المصريين على أكل الدجاج الذي انهارت تجارته تقريبا. وعقب د. فتحي سرور رئيس المجلس بالقول لهم: \"إللي ياكل لوحده يزور\"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

[[comments]]
order = 12
subject = "بيكفي استهتار بحياة المواطن المصري"
author = "سامي"
posted = "2006-02-28"
text = "مساء الخير للجميع<br />يا حكومة مصر بيكفي<br />كفايه كده<br />مواصلات تعبانه وقطارات تعبنه وطائرات تعبانه وسيارات تعبانه<br />وحياه تعبانه وسفن تعبانه<br />هو المواطن ليس له قيمة في نظركم<br />الى كتى هذا الاستهتار<br />لن يرحمكم التاريخ ابدا<br />منطق البلطجة لن يدوم<br />ومنطق البدي قارد لن يدوم<br />ومنطق الي تفلبوا العبو ايضا لن يدوم<br />افيقوا يا اهل مصر<br />افيقوا مسلمين ومسيحين مصر<br />افيقوا واصرخوا واخرجو في الشوارع وقولو كفى<br />اخرجوا ابصقوا على كل العفن الموجود في الطرقات<br />ابصقوا على الحكومة وعلى الفناين المغرورين<br />افيقوا يا فقراء مصر والله لا مكان لكم في عقول وحسابات حاكميكم ومثقفوكم وفنانينكم كل منهم يبحث عن نفسه فقط<br />لا يعنيه فقراء وضعفاء مصر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

