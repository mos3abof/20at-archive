subject = "الى ...اكرم (الباز افندي )"
author = "sweet_princess"
posted = "2006-03-02"
text = "صلاة النبي احسن .<br />ايه القصيده دي تكونش شكاليطه.<br />الحقيقه انا كنت فاكراها صغيره لاني يعني قريت منها مجرد فقرات صغيره لكن دي اول مره اقراهاكامله .<br />تسلم ايديك بجد .<br />انا مش عارفه اشكرك ازاي والله .<br />ومسيري هفقعك انا كمان قصيده في يوم .<br />وبعدين انت عملت اكتر من حاجه :<br />اولا :<br />قلت معلومات عن حرب البسوس اللي انا كنت اعرف عنها مجرد اسم وبس لكن ما اعرفش عنها اي معلومات وكان نفسي الاقي حد اساله عنها بس جت من عند ربنا انك قلت عليها .<br />ثانيا :<br />كتبت القصيده اللي واضح طبعا انها اخدت وقت لانها طويله .<br />ثالثا :<br />اديتني معلومات عن اقدر اجيبها ازاي .<br />وكمان اسم الديوان اللي نزلت فيه وظروف كتابتها .<br />والله بجد مش عارفه اشكرك ازاي .<br />واخيرا :<br />احب اقوللك حاجه انا رخمه واسالتي ما بتخلصش يعني هتلاقيني كل يوم هطلع لك بحاجه .<br />سلام بقى عشان انا رغيت كتير ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113003/http://www.20at.com/article2.php?sid=499"

