subject = ""
author = "عيب الكلام دا"
posted = "2009-12-14"
text = "يا سعادة الوزير عيب لما تقول هذا الكلام وعيب لما تستهيف وتستهبل الشعب المصري<br />ما حدش سالك اذا كان الرئيس بيدفع ضرائب ولا لا<br />لان خزنة البلد هو اللي بيتحكم فيها سيادة الرئيس<br />مفتاح الخزنة مع سيادة الرئيس<br />ومش عيب لان هو دا المعتاد في بلادنا العربية والاسلامية<br />فسيادة الرئيس مسئول عن هذه الخزنة امام الله يوم القيامه<br />حيدفع ضرائب مش حيدفع ضرائب<br />ربنا حيحاسبه يوم القيامه وكل واحد حر في نفسه<br />( ومن شاء فليؤمن ومن شاء فليكفر انا اعتدنا للظالمين نار احاط بهم سرادقها ان يستغيثوا يغاثوا بماء كالمهل يشوي الوجوه …) سورة الكهف<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-12-16"
capture_url = "https://web.archive.org/web/20091216205211/http://www.20at.com:80/masr/news/14397-2009-12-14-13-16-28.html"

