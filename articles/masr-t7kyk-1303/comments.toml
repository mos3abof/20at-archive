text = "واحد في الفصل الى جنبنا كان واخد برشام وجه وقف فى الطابور .. فقلبت معاه بصراصير وحشرات غريبة .. مسك الى واقف قدامه هراه ضرب وهو بيقول ويصرخ صرصاااار صرصاااار .. طبعاً المدرسة كلها سابت الطابور والإذاعة وأتجهت للصرصاار … والولد ده أترفد تلات أيام يومها .<br />وانا شخصياً كنت بعشق في الطابور لحظة تحية العلم .. العلم كان نضيف وكنت فاكر انه بيسمعنا واحنا بنحييه علشان ماكنش بيتحرك إلا لما بنقول تحية جمهورية مصر العربية .<br />أيام جميلة جداً …"
