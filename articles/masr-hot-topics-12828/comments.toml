author = "متخصص فى المياة"
posted = "2009-08-03"
text = "المياة التى يشربها الناس غير مطابقة للمواصفات التى تنص عليها شروط المنظمة العالمية who للاسباب التالية<br />معظم شركات المياة على مستوى الدولة يديرها رئيس مجلس ادارة عبارة عن لواء سابق فى الجيش اركان حرب ارادوا ان يكافؤوة فنقلوة الى وظيفة مدنية وكرسى مريح يتربح منة ويرتاح شوية ومعندوش اى فكرة عن المية<br />- معظم مياة الشرب فى المحافظات مياة جوفية فيها نسبة الماغنسوم عالية جدا وتتسبب فى الفشل الكلوى والكبدى ايضا ونسبة ملح الماغنسيوم عشرين ضعف زيادة عن النسب المقررة عالميا<br />فى تركيب المواسير فى الشوارع يتم وضع مواسير المياة ملاصقة لمواسير المجارى فيحدث الاختلاط احيانا عند كسر احدى المواسير<br />لنفترض ان المياة التى فى المواسير مياة مجارى فالمفروض ان يحقن فى مياة الشرب نسبة كلور من 1 الى 4 مجرام للجالون لقتل اى ميكروبات او جراثيم فى الشبكة فالكلور يقتل اى ميكروب فى مياة الشرب او المجارى ويطهر المياة تماما<br />ولكن لا احد يهتم بحقن الكلور ولا بالنسب المقررة فيحدث التلوث<br />وحتى لو اختلطت مياة الشرب بالمجارى فالكلور يقتل اى ميكروب او جراثيم موجودة<br />ولكن السادة اللواءات والعمداء مش فاضيين"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805224415/http://www.20at.com:80/masr/t7kyk/12828-2009-08-03-10-53-36.html"
