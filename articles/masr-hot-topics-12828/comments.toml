author = "ليس بالدعاء وحدة"
posted = "2009-08-03"
text = "المفروض ايها السادة بما اننا مواطنين فى دولة فيها قانون ان يقوم السادة القانونيين والمحامين وبما ان الدولة تبيع لنا تلك المياة ولا تعطينا اياها هدية او هبة بل باغلى الاسعار ان يقوم المحامون باخذ عينة مياة وتحليلها فى معمل تحاليل ومعرفة نسب الاملاح فيها ومدى تطابقها مع مواصفات منظمة الصحة العالمية وكذلك الفطريات والميكروبات والاحياء الدقيقة الموجودة فيها ورفع قضية او قواضى فى المحاكم على شركات المياة التى تستهتر بصحة المواطنين<br />من هنا يبقى التصرف قانونى<br />واى مريض بسبب المياة يقاضى تلك الشركات ويحصل على تعويض وتكاليف علاجة<br />انما السلبية هتودينا فى داهية<br />ليتحرك السادة القانونيون والمحامون ويحصلوا على حقوق الناس فى كوب مياة نظيف يدفعون ثمنة"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805224415/http://www.20at.com:80/masr/t7kyk/12828-2009-08-03-10-53-36.html"

