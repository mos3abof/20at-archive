posted = "2009-11-10"
text = "اولا اللى عملين يتكلموا دول هيبقى فى امن مع الفريق بره الاستاد والوفات جوه الاستاد يعنى سيادتكم كلكم عالم بقيقه وبس ولو حد منكم شاف عصايه عسكرى هيطلع يجرى زى الخروووف . فانت كبيركتشجع بصوت عالى على قد ما ربنا يديك منصوت ايكش حتى صوتك يروح خالص ومتعملوش سبع لاجاله بدل ما تقعودا تشيتوه عندك المنتخب الجزائرى نازل فى شيراتون المطار يلا ورينا هتعمل ايه بسلمتك انت وهو"
