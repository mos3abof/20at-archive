author = "احمد السيد"
posted = "2009-11-09"
text = "المصريين طول عمرهم كرمه بس مش هنبقى كرمه مع اللى حرقه علم مصر وتشيرت المنتخب دول مش يستهلوا كرم خساره فيهم هنوريهم اللى عمرهم ما شفوه هيشوفوا جحيم فى الاستاد هنفضل نشجع لحد اخر نفس فيينا وخلى بقى سعدان يورينا مهرته واللهى العظيم لعيبه الجزائر اول ما ينزلوا الملعب هترعبوا هيشوفا اسود بره وجوه تحيا مصر تحيا الرجوله يحيا الشعب العظيم (لكى يا مصر السلامه ويا سلاما يا بلادى ان رما نرمى سهاما)"
archived = "2009-11-13"
capture_url = "https://web.archive.org/web/20091113083205/http://www.20at.com:80/masr/profile/13823--qq-.html"

