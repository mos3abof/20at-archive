[[comments]]
order = 8
subject = ""
author = "بقية التعليق السابق"
posted = "2009-10-30"
text = "وضهرت اول مفاجائة<br />حزام التخسيس ابو اربعين جنية<br />قال انة ب150 ج<br />قلت ماش لما اشوف الاخر<br />وظهرت المفاجائة التانية<br />علشان اشترك لزم اكون اول زبون<br />وطلع شوية ورق وقال عليهم كوبنات<br />وقال دول بتمن تليفون مستعمل<br />قلت اكيد هقول 100 ج<br />خيب ظني الله يهديلة حالة<br />وقال دول ب300ج<br />قلت وانا ماسك نفسي اخر حاجة<br />هعمل بيهم اية<br />طلب مني الصمت لحظة واسترسل<br />بانة مثلا<br />الحزام ب 150ج<br />لينا وكلاء في اكتر من مكان<br />هيعملولك خصم<br />بمعني انهم هيدهولك ب 100 ج كاش والباقي كوبنات<br />لغاية هنا لقيت اعصبي خلاص<br />سبت مكاني وقمت<br />بس الغريب ان كان فية حوالي 60 فرد<br />محدش اتحرك من مكانة غير واتنين قبل مني<br />فقلت لزم اعمل تحذير<br />حتي لايقع احد فريسة لهؤلأ المحتالين<br />اسف على الاطالة<br />واتمني من الله ان اكون قدرت احمي حد منهم<br />مع تحياتي<br />اخوكم احمد من مصر<br />ـــــــــــــــ ــ____________<br />ها انا قد سبقت واخبرتكم"
archived = "2009-11-05"
capture_url = "https://web.archive.org/web/20091105043556/http://www.20at.com:80/masr/places-of-egypt/13823--qq-.html"

[[comments]]
order = 9
subject = ""
author = "تحذير"
posted = "2009-10-30"
text = "ظهرت في الاونة الاخيرة<br />مجموعة شركات لنصب عن طريق النت<br />باسم التسويق المباشر<br />وكدت ان اكون احدي ضحياها<br />الموضوع باختصار<br />ان حد هيدخلك علي الميل ويقولك فرصة<br />انتهزها<br />وهيديلك معاد<br />في المعادي او اي من فروع الشركة<br />وطبعا مش هذكر اسم الشركة<br />علشان سببين<br />الاول ان مافيش لفتة باسم الشركة<br />فا من السهل تغير الاسم {كل اللي هيكلفهم شوية ورق وكرنيهات }<br />والتاني علشان ما يبقاش تشهير لان من الصعب الامساك بدليل على النصاب المحترف<br />المهم<br />رحت وسمعت محاضرة لمدة ساعة ونص لغاية ما دماغي صدعت<br />طبعا بقيت مليونير في لحظات<br />علي حسب كلامه<br />ـــــــــــــــ<br />للتعليق بقية"
archived = "2009-11-05"
capture_url = "https://web.archive.org/web/20091105043556/http://www.20at.com:80/masr/places-of-egypt/13823--qq-.html"

[[comments]]
order = 10
subject = ""
author = "امش ححبك"
posted = "2009-10-31"
text = "عزيزي المعلق السابق<br />فيه اية في القران الكريم بتقول<br />ا<br />بسم الله الرحمن الرحيم<br />وجدنا آباءنا كذلك يفعلون<br />صدق الله العظيم<br />مخيؤ المنطقة ورئيسه في العمل ورئيس المباحث ونائب المأمور والمحكمة والست مدام ليلى ومدام نوال<br />تنطبق عليهم الاية وجدنا ابائنا كذلك يفعلون<br />لكن هما مش فاهمين حاجه خالص ومش فاهمين هما بيعملوا كده لي<br />تعالى بقا عند اللي كانوا بيصيدوا سمك من 30 سنه امارة دبي<br />كبسة ذر الكمبيوتر ويقولك مع السلامة ما عندكش مخالفات<br />لكن حضارة 7000 سنه شوية بهايم بعيد عنك<br />وعلى كل حال انت ربنا بيحبك ان رئيس المباحث ما ودكش كعب دائر وقالك انت عندك مخالفة في اسوان<br />حمدل على السلامه"
archived = "2009-11-05"
capture_url = "https://web.archive.org/web/20091105043556/http://www.20at.com:80/masr/places-of-egypt/13823--qq-.html"

[[comments]]
order = 11
subject = ""
author = "البكاء المر"
posted = "2009-10-31"
text = "انتم عاملين قيمة لحتة مباراة كرة لهتودى ولا هتجيب و حالة البلد زفت فى زفت فى زفت<br />رجعت بعد غربة 30 سنة<br />رخصة قيادة السيارة بتاعتى انتهت ومحتاجة تجديد وانا اسكن حاليا فى احدى مراكز الاقاليم فى وجة بحرى<br />ذهبت الى الشباك الخاص بتجديد رخص القيادة فى مركز المرور - طلب منى عمل شهادة مخالفات من مركز الشرطة<br />اشتريت استمارة وكتبت بيانتها وحطيت عليها الدمغة ودخلت المركز<br />اول خطوة مطلوبة توقيع مخبر المنطقة ولم اجدة فى مكتب المخبرين فقالوا لى تعال بكرة<br />تانى يوم رحت لقيت المخبر وفتش فى دفتر امامة عن اى احكام فلم يجد ووقع وطلب رشوة عينى عينك 10 جنيهات<br />انتظرت البلكومين اى رئيسة فى العمل فوقع الورقة<br />انتظرت رئيس المباحث حتى حضر فوقع الورقة<br />نزلت الى الدور السفلى ووقعت من نائب المامور ووضع ختم النسر<br />الخطوة التالية المحكمة<br />قدمت الشهادة الى مكتب المخالفات وقالوا تعال بكرة<br />اعطونى الشهادة موقعة ومختومة انى ليس على مخالفات وطلبوا الصعود الى اعلى فى الدور الخامس<br />من مكتب الست مدام ليلى ختمت بانى ليس على احكام<br />ذهبت الى مدام نوال لتوقعها من وكيل النيابة وتختمها<br />اخذت الشهادة<br />اول ورقة"
archived = "2009-11-05"
capture_url = "https://web.archive.org/web/20091105043556/http://www.20at.com:80/masr/places-of-egypt/13823--qq-.html"

[[comments]]
