posted = "2009-11-10"
text = "يلا يا شله بتوع تيموس هنا وبتوع عموره هناك وانتى يابت يا شيرين مش جايبه بوسى سمير معاكى ليه . اوعى ياكيمو تلغبط اللى اسبيكى اللى انا عاملوا خليه واقف لحد اخر الماتش …(دى عينه شباب دلوقتى اللى عايزين يولعوها نار يااخى روحوا ولعوا فى نفسيكوا احسن ) احنا عايزين رجاله بحق وحقيق يشجعوا منتخب مصر قبل الماتش وبعد الماتش عشان نبقى رجاله قدام نفسينا وقدام العالم ياخسرتك يا مصر"
