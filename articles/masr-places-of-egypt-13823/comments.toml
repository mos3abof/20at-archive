text = "اقتباس احمد السيد:<br />المصريين طول عمرهم كرمه بس مش هنبقى كرمه مع اللى حرقه علم مصر وتشيرت المنتخب دول مش يستهلوا كرم خساره فيهم هنوريهم اللى عمرهم ما شفوه هيشوفوا جحيم فى الاستاد هنفضل نشجع لحد اخر نفس فيينا وخلى بقى سعدان يورينا مهرته واللهى العظيم لعيبه الجزائر اول ما ينزلوا الملعب هترعبوا هيشوفا اسود بره وجوه تحيا مصر تحيا الرجوله يحيا الشعب العظيم (لكى يا مصر السلامه ويا سلاما يا بلادى ان رما نرمى سهاما)<br />ياسيدى ماتبقاش متفائل قوى كدا ،،، يمكن احنا اللى نترمى بالسهام ،،،، قول بس يارب وخلاص … واحنا مش اول مرة نتلب اتلبينا كثير قبل كدا … ولا ايه ؟؟؟؟"
