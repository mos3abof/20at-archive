posted = "2009-10-27"
text = "موضوع في الجون والي عايز اعرفة لية ديما نلعب دور البطولة لية الكلام بتاع الورد مكنش يوم متشنا هناك ولا لازم نكون احنا بلد الكرم دة ربنا قال العين بالعين والسن بالسن فلاداعي للتعصب نعم ولكن بمثل ما فعلوة بالمنتخب يكون الرد هنا بالمثل وانا عارف اية الي حصل هناك وكم كان المنتخب في حالة يرثي لها قبل المبارة فلماذا نستقبلهم نحن بالورود انا اطالب كل جماهير مصر ان تذهب الي فندق اقامتهم وتهللل لصباح يوم المبارة بالالعاب النارية والشمارخ مثل ما فعلو بنا وتكون الماعملة علي انة خصم وليس حبيب ولا اخ لانهم فعلو ذللك بنا وان شاء الله النصر لمصر"
archived = "2009-10-28"
capture_url = "https://web.archive.org/web/20091028082400/http://www.20at.com:80/masr/t7kyk/13823--qq-.html"

