posted = "2009-10-28"
text = "ممكن اعرف بس اما لاعيبة مصر ماعرفوش يناموا هناك وصبحوا تاني يوم المبارة انغلبوا 3 صفر وبعد كده قالوا احنا احسن منهم ده كلام الجزائرين انا مع حاجة واحدة بس يبقى فيه خطة اننا نوري للشعوب العربية اننا ممكن في اي وقت نبقى وحشين علشان يعرفوا اننا مش شعب يضرب على قفاه ونقول كمان لحد امتى هاناخد فوق دمغنا ونسكت واللي بيطلع يوقل اننا اخوات عرب هو الاخ ممكن يعمل في اخوه كده اشمعنى بيحصل لنا برة بلدنا كده وماحدش بيجبلنا حقنا والاخر مصر تطلع تقول حقكوا علي يا ولادي لازم وقفة مع انفسنا لازم الللاعيبة تعرف انها مبارة رد كرامة ونفوذ سيادة على المنطقة ككل في كل حاجة احنا مش شعب رخيص"
archived = "2009-11-05"
capture_url = "https://web.archive.org/web/20091105043556/http://www.20at.com:80/masr/places-of-egypt/13823--qq-.html"

