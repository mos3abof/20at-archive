text = "انا بحيي الفنانة المتألقة ليلى علوي والفنان المبدع بحق خالد ابو النجا<br />حيث اننا صدقنا انة عمر ونسينا خالد تماما وذلك لطريقتة لاداء الشخصية من جميع جوانبها طريقة الحركة والكلام والاداء .<br />واجمل ما في المسلسل نهايتة حيث انها لم تكن نهاية تقليدية بزواج الابطال مثلا,بل بالعكس النهاية المفتوحة ترفع من مستوى العمل اكثر وتحترم عقل المشاهد.<br />اما بالنسبة للموسيقى التصويرية فأحيي تامر كروان على ما قدمة من ابداع فني حقيقي<br />لان الموسيقى اعطت للمشاهد عمق واحساس اكبر.<br />واخيرا رسالة حب لليلى وخالد ولكل من شارك بهاذا العمل الجميل بقولهم فيها احنا عشنا معاكم في العمل وصدقناكم وتفاعلنا بمشاعرنا وعواطفنا مع قصتكم .<br />وشكرا لانكم اسعدتونا"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203061126/http://www.20at.com:80/masr/review/13814-q-q-.html"
