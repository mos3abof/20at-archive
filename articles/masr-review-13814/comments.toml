posted = "2009-10-26"
text = "ممكن سؤال<br />هو ليه مابقاش عندنا ثقافة الهدف<br />مش شرط في المسلسل ده او غيره .. لأنى بطلت اشوف اي حاجة ليها علاقة بالعربى<br />لأنه اصبح مادة بلا هدف … يعنى الأمريكان بيبعولى الوهم وحلم البطولة .. وانا عارف انه وهم وبالرغم من كدة بشوفه لأنه في الاخر فيه هدف او معلومة او نصيحة عايز يقدمها<br />.. لكن العربى سواء افلام او مسلسلات او اغانى … كله ضاع وماشي ورا الإثارة وهنجيب تكت أدايه وبس ..<br />ياريت يكون فيه مئات من فيلم عين شمس<br />… ياريت"
archived = "2009-10-28"
