text = "ههذا عنوان مقال كتبته عن القضية و تدعيما لكل مصمم مثقف يدعم حقوق الملكية الفكرية (القاهرة والنُعَاس و إعلام بلا إحساس)<br />إن القضية التي أثيرت مؤخرا على صفحات الجرائد و الإنترنت حول قضية محاكاة الإعلانات الغربية و تعريبها – لاحقا بعد الإتِّهام بالنقل الغير قانوني – من قبل مؤسسة عريقة كطارق نور, أو كما قالت العديد من الصحف و المصادر أنها سرقه – عيني عينك – لأعمال إبداعية أجنبية و نقلها بحذافيرها (من حيث السيناريو و الإضاءة وزوايا التصوير و الديكورات و عدد الموديلز الخ) لهو عمل غريب وسيئ للغاية…<br />لقراءة المقال كاملا إستخدم الواصلة كاملة:<br />http://tariqsobh.wordpress.com/2009/08/31/%D8%A7%D9%84%D9%82%D8%A7%D9%87%D8%B1%D8%A9-%D9%88%D8%A7%D9%84%D9%86%D9%8F%D8%B9%D9%8E%D8%A7%D8%B3-%D9%88-%D8%A5%D8%B9%D9%84%D8%A7%D9%85-%D8%A8%D9%84%D8%A7-%D8%A5%D8%AD%D8%B3%D8%A7%D8%B3/"
archived = "2009-09-03"
