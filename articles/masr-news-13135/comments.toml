subject = ""
author = "حسن عبدالله"
posted = "2009-09-01"
text = "يعلم الجميع مدى الاستغلال المادي لجانب الدعاية والاعلان لكونها مصروفات زائدة في حقيقة الامر وتعبر صدقا عن مدى الربح الفاحش الذي تحققه بعض الشركات المعلنه وبالتالي تتنافس شركات الدعاية والاعلان على تبني تلك الشركات … والسؤال هل شركات الدعاية لدينا مبدعة خلاقة … للأسف لا بل قص ولصق … ويدعون الخبرة والمعرفة وقد لمست ذلك بنفسي حيث طبيعة عملي في اتصالات التسويق ونتعامل مع شركات الاعلان..<br />اتصور انه يوجد في عالمنا العربي العديد امثال ( تامر عزب ) بل يمتلكون خيال واسع لا يشطح كثيرا ويتواكب مع تقاليدنا واعرافنا … ولكن لم يجدو فرصتهم … والسبب يكمن في ظهور مثل شركات طارق نور وغيرهم حيث يسيطرون بعلاقاتهم وبالمادة وبكل ما لديهم والآن وبعد ان كشف (تامر) جزء من خفايا اعلانات (طارق) اصبحت هناك كارثة اعلامية على الرغم من ان اصحاب الاختصاص يعلمون ذلك.<br />ما قام به تامر هو امر مطلوب ولكن مع الاحتفاظ بعدم التطرق مباشرة الى شعار شركة طارق نور حتى لا يتحول الامر من مقارنه وكشف الافلاس الاعلاني الى قانونية وقضاء اقتصادي …"
archived = "2009-09-03"
capture_url = "https://web.archive.org/web/20090903045647/http://www.20at.com:80/masr/2khbar/13135-2009-09-01-00-05-14.html"

