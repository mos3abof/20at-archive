author = "حسن عبدالله"
posted = "2009-09-01"
text = "يتبع …<br />اتمنى من جميع احبتي المصممين الهواه ان يفعلوا بالضبط مثل ما فعل اخونا تامر مع التحفظ… فالغرض الاساسي هو التمييز بين الابداع والاقتباس والنقل … عندما آتي برجل اجنبي اوروبي والبسه ( شماغ وعقال ) في دعاية يجب ان يكون شكل الاجنبي اقرب الى الرجل العربي بالاضافة ان يكون هناك شخص من اهل البلد يضبط له اللبس … مجرد مثال<br />الف ياتامر والى الامام فالفكرة الخلاقة تثبت نفسها وانت لم تأتي بشيء من عندك … مجرد نقل للتوثيق فلماذا تغضب يا طارق نور …<br />بدل من ان ترفع دعوى … حاسب نفسك وحاسب موظفيك واعمل ( هندرة ) فكرية لهم … قال \"كريتف\" قال …"
archived = "2009-09-03"
capture_url = "https://web.archive.org/web/20090903045647/http://www.20at.com:80/masr/2khbar/13135-2009-09-01-00-05-14.html"

