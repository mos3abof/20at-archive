[[comments]]
order = 9
subject = "الأسباب"
author = "أسامة"
posted = "2006-12-09"
text = "السلام عليكم ورحمة الله<br />أعتقد يا جماعة إن الأسباب الرئيسية لمشاكل المواصلات دي هي كالاتي:<br />1.السواقين أغلبهم مش بيشتغلوا ويوصلوا الناس علشان ياخدوا ثواب وأجر يعني...وإنما لمجرد المكاسب المادية...ودة سبب مهم جدا... لأن السواق لو بيوصل الناس وهو حاطط في ذهنه إنه كدة بيساعدهم وهياخد ثواب وكدة كان حرص إنه يوصل الناس لأفضل مكان بالنسبة ليهم مش بالنسبة له هو..<br />2.طبعا الظروف السيئة اللي البلد فيها بردو بتخلي السواقين عايزين يدوروا على مصالحهم ومكاسبهم وخلاص ... ولو حتى على حساب الناس... يعني مثلا ميكملوش الخط بتاعهم لاخره وكدة..<br />3.سبب كمان رئيسي ... إن مفيش قوانين حازمة تمنعهم إنهم يغيروا الخطوط أو ثمن الأجرة.<br />وأخيرا أعتقد إن أفضل حل... إن ميكونش في نظام سواقين الأجرة اللي بيشتغلوا لحسابهم الخاص دول...<br />ويكون في شبكة مواصلات (أوتوبيسات و ميني باصات وميكروباصات) تغطي القاهرة كلها وبشكل منظم وأسعار مناسبة...وتكون تابعة لهيئة النقل العام مش لحساب أشخاص..<br />وجزاكم الله خيرا<br />والسلام عليكم ورحمة الله"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065549/http://masr.20at.com:80/article.php?sid=1264"

[[comments]]
order = 10
subject = "لا حول و لا قوة إلا بالله"
