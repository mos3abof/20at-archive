text = "و الله يا جماعة اللي بيحصل ده حرام لكن الحل ان كل واحد مننا يكون ايجابي و يستحمل شوية و ميركبش مع الاستغلاليين دول و يصر على موقفه و يصبر لما يركب بنفس الاجرة المحددة من قبل و اللي يقدر يوصل الامر ده لالعضاء مجلس الشعب المحترمين او لواحد لواء محترم يبقى عمل الليي عليه"
