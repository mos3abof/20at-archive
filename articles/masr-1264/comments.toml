[[comments]]
order = 14
subject = "جايزة حقوق الانسان لسوزان مبارك"
author = "محمد المصرى"
posted = "2006-12-10"
text = "لحد وقت قريب كنت فاكر ان الكوسه والقرع من اهم المحاصيل اللى بتتميز بيهم مصر اما بعد ماقريت خبر حصول سيدة مصر الاولى<br />سوزانكو على جايزة حقوق الانسان من برلين بالمانيا قلت فى عقل بالى بركاتك يا مبارك انت ومراتك حلت على الكره الارضيه بحالها وكنت اتمنى ان سوزان هانم تاخد معاها ( رمضان التوربينى ) وكمان بقية الشله بقو .. وبزازه ... وحماطه والسويسى<br />ليكونوا شاهدين وخير دليل على جهودها هى وجوزها والنحروس الصغير جيمى بيه من اجل الشعب المصرى وحقوق الانسان وبالمناسبه كتبت قصيده جديده اهديها برضه لعمنا احمد فؤاد نجم وجميع الشعب المصرى الغلبان<br />فتح عينك تاخد جايزه<br />مليون جايزه كمان لو عايزه<br />بص يا محسن وانتى يا فايزه<br />ماما سوزان قال اخدت جايزه<br />جايزه لحقوق الانسان<br />المصرى المهرى الكحيان<br />هى وجوزها التور ابو ودان<br />ضحكوا على عقل الالمان<br />سافروا على العاصمه برلين<br />على حسابنا يا مستمعين<br />سايبنا عرايا وجعانيين<br />نستنى معونه واحسان<br />ارجع مصر يا ابن الهرمه<br />وهات القرشانه بنت الصرمه<br />خلى فى وشكوا حبة حشمه<br />دا بكره المستخبى يبان<br />وشوبش يا حقوق الانسان"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065549/http://masr.20at.com:80/article.php?sid=1264"

[[comments]]
order = 15
subject = "دى حاجه تفرس"
author = "dero"
posted = "2006-12-11"
text = "فعلا والله يا محمد الموضوع ده مهم جدا... وانا طبعا زى كل الناس بعانى من الحكايه دى..ولا والجميل ان الموضوع ماوقفش على التقطيع, ده فى موضه جديده عملوها بالنسبة لشارع الهرم..انا كنت راجعه من الدقى فى المترو وجايا اركب من اول الهرم كل لما اقول لسواق ميكروباص حسن محمد او الطلبيه (وطبعا المنطقه دى فى نص شارع الهرم واصلا المنطقه دى هى بدايه التقطيع يعنى لما حد يركب يقوله لحد الطلبيه وبعدين يبدا يحمل تانى) يقولى لا..اسغربت اوى سئلت حوالى 7 سواقين ونفس الرد يقولى لا مشعل(اخر شارع الهرم)..وبجنيه,,يعنى مفيش تقطيع ولو عايزة تركبى سواء نزله مشعل او الطلبيه او حتى بعد شارع واحد تدفعى جنيه ..يعنى لا مفيش تقطيع وهى الاجرة جنيه عجبك عبجك مش عجبك عندك اتوبيس اركبيه..وطبعا انا مسكتش وقولت لسواق هو فى ايه.. ايه اللى انتوا بتعملوه فى الناس ده..قالى والله يا ابله نعمل ايه حطى نفسك مكانى صاحب العريبةعايز ستين جنيه منى فى اليوم والبنزين عليا وانا اللى خسران فى الاخر ..وطبعا الحديث ده اثار ناس كتير تتكلم واحد قال لازم تسعروا الاجرة وكمان هو فين المرور هنا والمحافظه ..واحد تانى قاله المحافظه عارفه وساكته وتالت رد عليه قاله تسعيرة ايه التسعيرة حرام العمليىة عرض وطلب واستشهد بحديث مش فكاره صراحه لانى كنت متنرفزة فاانا قولتله يعنى ايه راح واحد رد قالى استنى يابنتى هو يقصد ان احنا بيتنا يتخرب ..فا انا قولتله ماهو لو انت كل يوم بتنزل تروح شغلك وعشان ترجع بيتك تدقع يوميامش اقل من 5 جنيه يبقى ده اللى حلال.. السواق زهق وقال ها من جى<br />قولتله انا هاجى وهانزل الطلبيه وهادفع نص جنيه وركبت.. ولاقيت كذاحد عمل كده زى ماعملت وركب معايا واظطر السواق يوافق..بس طبعا ده سواق غلبان..ده لو واحد تانى كان ممكن يجب<br />اقرأ بقية التعليق .."
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065549/http://masr.20at.com:80/article.php?sid=1264"

