text = "حتى إننا ندفع أجرتين برضو مش نافع<br />همه مش عايزين يضحكوا علينا<br />همه بياخدوا كذا أجرة بطرق أخرى و اسألوا اللي بيركبوا من الجيزة للهرم :)<br />مرة شرطي مرور شهـــم لقى سواق بيقول للناس طالبية هرم و هو أصلا ماشي لحد آخر شارع الهرم ... فراح موقفه و مركب الناس معاه و قال له نزلهم مشعل<br />مقدرش يتكلم<br />طيب و العمل ... كل واحد ينزل من بيتهم معاه شرطي المرور الخاص به ... !!!!!!!"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065549/http://masr.20at.com:80/article.php?sid=1264"

