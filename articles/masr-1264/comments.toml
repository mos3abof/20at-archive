posted = "2006-12-09"
text = "ويسرخ فى من هو عند الكنبه الاخيرة ليتاخر!! وقد تكون الجالسه فتاة فيقول الولد مفيش مكان فيصرخ ويصرخ طالبا منه اظن الجلوس على حجر الفتاة ليركب المزيد والمزيد.<br />كذلك تحشيرة وارجع ورا يااستاذ ؛خش جوة يااستاذ؛واللى مش عجيه ينزل كانة وزير المواصلات<br />وقتها بصراحة لا املك الا ان اتجاهل الرد عليه؛قائله حسبى الله ونعم الوكيل"
