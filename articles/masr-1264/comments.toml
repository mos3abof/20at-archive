[[comments]]
order = 1
subject = "الكواكب الاخرى"
author = "تلميذة"
posted = "2006-12-08"
text = "تحياتى لكل المتبهدلين فى المواصلات<br />ولكنا اضيف اضافة عظيمة للتعليق على المبهدل في المواصلات واللى مش لوحده واقول<br />اذا لم تذهب الى الاوتوبيس بالثانية مثلا 8 و 6 دقائق وفاتك سوف يفوتك بالتالى القطار الذى مظبوط بالثانية للسفر بين المدن الداخلية وبالتالى سوف تتأخر على الترام اللى في البلد التانية وتوصل شغلك متأخر لانه كله محسوب بالثانيةحتى بين المدن وبعضها يبقى انت فين ؟؟؟؟؟<br />صح عرفت الجواب اللى ينور عليكم<br />ايوه على كوكب تانى خارج مصر الله ينور عليكم<br />وعلى فكرة ديه حقيقة مش اختراع بقوله<br />امضاء تلميذة"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065549/http://masr.20at.com:80/article.php?sid=1264"

[[comments]]
order = 2
subject = "روضه عبد الحميد"
author = "موضوع حساس وواقعى"
posted = "2006-12-08"
text = "لن انسى صرخات الرجال والنساء كبار السن حين يلقى بينا ميكروباص الجيزة عند كليه الزراعة<br />والخناقه التى تحدث حول لازم تدينا ربع جنيه هنركب بيه للميدان او توصلنا<br />بصراحة حاجة تحرق الدم<br />حسبنا الله ونعم الوكيل<br />ولو كانت الاجرة 35 قرش<br />لو ادتلة ربع يستجير مهما قصرت المسافه<br />ولو ادتلة 50 قرش يرجع لى 10 صاغ فحسب!!<br />فعلا بلد بقيت لا تصلح للعيش فيها"
