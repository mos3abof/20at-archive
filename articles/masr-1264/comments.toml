text = "لما تستني كل يوم نص ساعه علشان تلاقي مكيرباص تقدر تقف فيه ويوصلك لحد نص المسافه علشان تستني نص ساعه تانية لحد اما تلاقي واحد غيرة برده تقدر تقف فيهه ويوصلك وتنزل تمشي بعدها حبة برده<br />يبقي انت أكيد في مصر"
