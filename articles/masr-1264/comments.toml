[[comments]]
order = 5
subject = "موضوع كويس وواقعى"
author = "ياسر ابو عمار"
posted = "2006-12-08"
text = "موضوع كويس يا عم محمد،يعبر فعلا عن بعض مشاكل الناس الغلابة اللى كلنا ننتمى اليهم ،ارجو ان نهتم اكثر بمشاكلنا وهمومنا ونحاول القاء الضوء عليها حتى نتمكن من وضع ايدينا على الاخطاء ومحاولة حلها لا ان نعيش فى ابراج عاجية بعيدا عن المشكلات ،بمعنى انه لا يجب ان يكون عندنا انفصام فى الشخصية بين المشاكل التى نواجهها يوميا وبين ما نكتب .على العموم الف سلامة يا محمد وربنا يقومك بالسلامة ،وكله تخليص ذنوب يا سيدى ولا يهمك ."
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065549/http://masr.20at.com:80/article.php?sid=1264"

[[comments]]
order = 6
subject = "فتش عن سوزي"
author = "إبن بهيه"
posted = "2006-12-09"
text = "اشمعنى فيصل والهرم والجيزه يعني اللي بيشتكوا ؟؟؟ طيب حد قالهم يسكنوا في فيصل واسمه إيه ده الطوابق ... مالها الزمالك يعني ؟؟؟ ما تسكنوا في الزمالك ولا المهندسين ... صحيح إنكم ناس وحشه .. هي كل حاجه الحكومه ولا إيه ؟؟؟ يا ابني انته وهو الحكومه فاضيه للكلام الفارغ ووجع الدماغ ده ؟؟؟ قال مواطن وهمومه وقرفه .. آدي اللي ناقص ... يا حبيبي الحكومه عندها أجنده بتاعة مشروع التوريث بتاع الننوس الصغنن بتاع لجنة الوكسات اللي بيلموا فيها الشواذ والشمامين .. والمشروع ده أصله جاي من فوق .. من فوق أوي أوي أوي .. من الراس الكبيره ستهم سوزي الماسونيه اللي جوزوها الأهبل أبو رياله زمان لما حطوها في يطريقه وكانت بتدرس في الجامعه الأمريكيه .. ياه رجعتونا لما كان الولد لسه صغار وولد طيب من ولاد بهيه .. عمكم مبارك العرضحالجي المسكين كان بيشوف الكوته ويتبهدل كده زيكم آخر بهدله عشان يوفرله لقمة العيش والهدمه يروح المدرسه ، الولد كبر ودخل الكلية الحربيه .. وعيون الماسونيه الموجوده في مصر بتفرز الشبان وخصوصا الظباط واللي يعجبهم .. هنياله .. يحطوله بنت ماسونيه متأصله زي سوزي كده في سكته وزي جيهان زمان برضه ((يرجى مراجهة تاريخ السيدتين الحلوتين الأمورتين ونشوف الدور البريطاني في اللعبه وتنفذ الأوامر الماسونيه العليا)) ويوصلوه للعلالي .. العلالي خالص لغاية ما يبقى ريس .. شوف ازاي ؟؟ وبص ازاي بتقع الجرادل بتاعتنا وتوصل رهوان في أول الصفوف وطبعاً لازم تكون وفيه للي وصلها وتبوس الواوا الماسونيه وتطبطب وتدلع الصهيونيه .. أما الحثاله اللي بتقولواعليه الشعب ده .. يغور في داهيه ..<br />قال مشاكل ومواصلات ورغيف عيش وبلا أزرق .. هي الحكومه ناقصه ولا فاضيه للكلام الفارغ ده ؟؟؟ تكونوش فاكرين إنكم شعب بجد ؟؟؟ داهيه لا ت<br />اقرأ بقية التعليق .."
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065549/http://masr.20at.com:80/article.php?sid=1264"

[[comments]]
order = 7
subject = "قضايا للكل"
author = "عمر منطاش"
posted = "2006-12-09"
text = "أنا أرى أنها قضياياللكل ليست لنا نحن كشعب فقط وإنما هي قضية للسائق قبل أن تكون لنا كما ذكر أ. محمد في المقال أنه عندما حزن الناس من رفع الأجرة واعترضوا على ذلك وامتنعوا عن دفع الزيادة فالسائق قد سبقهم بدفع هذه الزيادة في البنزين أو الوقود عامة للسيارة فإننا دائما ما نتكلم ونقول المشكلة على كل سائقي السيارة وللأسف هي ليست قضية السائق ولكن من يتحكم في السائق كما يتحكم فينا السائق والمنتفع هو المتحكم في السائق والمتضرر هو المتحكم فيه السائق ولا زال راتب العامل يكفي لمواصلاته وشراء طعامه في العمل فقط واهي دنيا وعلى المتضرر اللجوء للسير على قدمه والله من وراء القصد ."
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065549/http://masr.20at.com:80/article.php?sid=1264"

