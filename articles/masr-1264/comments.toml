posted = "2006-12-08"
text = "فعلا الموضوع مشكله واقعية فى حياتنا ...<br />مشكله من مشكلات المصريين فى بلدهم ...<br />لكن طبعا بحكم انى مش عايشة فى القاهرة جايز مقدرتش اندمج معاكم اوى ...<br />لكن انا واثقة من اللى بسمعه وبشوفه عن بلدنا المعجزة ان دى اقل حاجة ممكن تكون عندنا ...<br />حسبنا الله ونعم الوكيل .."
