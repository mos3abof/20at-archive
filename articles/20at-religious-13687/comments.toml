text = "أهو المعلق السابق ده شخص منافق<br />هتقولوا إزاى<br />هقولكم أنه بيعادي المصريين بتهمة أنهم بيتعاونوا مع إسرائيل و بيتأمروا علي تهويد القدس .<br />وفي نفس الوقت .. هو داخل يعمل حرب نفسية علشان الماتش بين مصر و الجزائر .<br />ولم يعلق علي الموضوع المنشور من الأساس .. وده إذا نم أنما ينم عن شخص .. التكنولوجيا بالنسبة له مش توصيل معلومة مفيدة .. التكنولوجيا بالنسبة له عبارة عن حاجة بتتيح له يشتم في ده ويقل أدبه على ده بدون أى مبرر .<br />ربنا يشفي ويهدي<br />خد أقرأ ده يمكن ينفعك ويخليك تهدي شوية<br />http://www.20at.com/masr/t7atuf/13697-2009-10-13-09-08-43.html"
