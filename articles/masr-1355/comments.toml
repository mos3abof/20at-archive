subject = "مين دول"
author = "فهد الا سلام البنا"
posted = "2006-12-28"
text = "سال رسول الله متى تقوم الساعة قال علية الصلاة والسلام اذا وسد الا مر لغير اهلة من هولا الذين يتحدثون عن الا سلام صفوت الشريف رمز الدعارة فى مصر واسوا وزير اعلام هو الى منع المذيعات من الا سلام فما ذا تتنتظرون يعنى الثانى لم اسمة زقزوق اية مستنين تا نى لا زم يكون ديل للحكومة اما الا خير اسمة اية مش مهم لا نة ملهوش لا زمة كلهم عملا وخدام لمبارك وواقول لهم لينا لقاء فى الا خرة عند مليك مقتدر وسنقتص منكم امام الله ورسولةوقال الشيخ كشك علية رحمة الله اذا رايتم العلما يتقرب من الحاكم فا تهموة با فسق وحسبنا اللة ونعم الوكيل الواحد خلاص مش قادر على السكوت"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102439/http://masr.20at.com:80/article.php?sid=1355"

