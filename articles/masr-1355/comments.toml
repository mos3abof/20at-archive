text = "إلى الأخ فارس ..<br />زعلان ليه من عدم وجود تعليقات ؟؟؟<br />أصل الموضوع مش محتاج كلام خالص ..<br />لأن الموضوع متفبرك من عشرينات ..<br />هو فيه في مصر حاجه اسمها وزارة للأوقاف ؟ وفيها زير كمان ؟<br />هو عندنا زير أوقاف ؟ أما عشرينات دول جماعه مفتريه ..ومش بعيد محظورين برضه ..<br />هو عندنا أوقاف ؟ طيب هي فين ؟<br />طيب نفوت دي ..<br />إيه علاقة أبو قرنين طوال لغاية القمر بمواضيع زي دي ؟؟؟<br />صلي على النبي يا فارس .. الناس قرفانه من التعليقات أصلا ..<br />بس مش هنسكت في الشارع ووسط الناس وبكره أفكرك ..<br />لك وللجميع تحياتي<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
