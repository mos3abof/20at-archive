author = "نعليمات صندوق النقد"
posted = "2009-11-22"
text = "طيب ما احنا عارفين ان اللى بيحكمنا هو صندوق النقد الدولى الذى كان معروف شعبيا بصندوق النكد الدولى وهو ضد الدعم ومع بيع البنوك والقضاء على القطاع العام وفرض ضرائب باهظة تثقل ظهور المصريين<br />عارفين<br />بسوا الشجاع يلمس رغيف الخبز والبلد تولع"
