author = "يعنى اسرة مكونة"
posted = "2009-11-22"
text = "يعنى اسرة مكونة من 10 افراد الحكومة هتعطيهم 130 جنية شهريا<br />وبعدين بدل العيش ياكلوا ب 130 جنية جاتوة<br />رائع<br />مين صاحب الفكرة الالمعى دة<br />والناس بقى لما تخبز فى البيوت فين البوتاجاز اللى هنخبز بة<br />سلامات سلامات يا سيادة اللواء دكتور المصيلحى بتاع الفنية العسكرية اللى جايين يمسكوك التموين"
