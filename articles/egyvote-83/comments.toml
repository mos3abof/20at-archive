[[comments]]
order = 0
subject = "الإخوان غلبوا"
author = "مستاء"
posted = "2005-11-28"
text = "لمثل هنا في أمريكا ، حيث أعيش حالياًً، يقول \"تستطيع أن تأخذ الحصان إلى الماء و لكن لا تستطيع أن تجعله يشرب\".<br />إيه علاقة المثل ده بالموضوع؟ ببساطة مهما الإخوان تكلموا و ضحوا أجندتهم السياسية و برنامجهم للإصلاح (الذي نشر في أكثر من موضع و معلن على موقعهم على الإنترنت) فإن معارضيعم أو مناقشيهم لا يزالوا يتكلمون عن غياب البرنامج أو يطالبون توضيح الواضح و لو حصل التوضيح يقولون أن هؤلاء يظهرون غير ما يبطنون و لو حلفوا على قفة مصاحف سيقولون أنهم يكذبون. لا أدري هل كتابنا و مفكرونا جادون فعلاً في التعرف على أجندة الإخوان. لدي شك كبير في ذلك.<br />ثم إن السؤال أصلاً نظري للغاية. نحن نتكلم عن الإخوان و كأنهم إستلموا مفاتيح الحكم و البلد تحت أمرهم و بإنتظار تنفيذ برنامجهم. كل ما قي الأمر إن الإخوان ستتاح لهم فرصة أكبر من ذي قبل لممارسة دور \"رقابي\" غلى الحزب الحاكم. أين هم من الحكم؟؟؟"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102031810/http://egyvote.20at.com:80/article.php?sid=83"

[[comments]]
order = 1
subject = "مزيد من الإيضاحات"
author = "مستاء"
posted = "2005-11-28"
text = "ندي سؤال أريد أن أسأله للسيد عبد الحليم قنديل الذي يطالب الإخوان بالمزيد من الإصلاحات.<br />ممكن سيادته يعطينا مزيد من الإيضاحات عن الفشل الذريع الذي أصاب حزبه في المرحلتين الأولى و الثانية؟ الأخبار بتقول أن مرشحيه الخمسين عن الحزب التاصري لم ينجح منهم أحد.<br />و أخيراً أقول له \"ممكن سيادتك تخليك في نفسك\"؟"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102031810/http://egyvote.20at.com:80/article.php?sid=83"

[[comments]]
order = 2
subject = "يعني يعملوا إيه الناس؟؟"
author = "محمد السيد"
posted = "2005-11-30"
text = "نا مع الأستاذ المستاء ... يعني ايه المطلوب من الإخوان تحديدا ؟... جمال حشمت في اتصال مع برنامح العاشرة مساء ... قال لصلاح عيسي .. يعني نبوس راسكم ؟ ... وده رايي كمان ... ما الليبراليين لما حكموا ايام الملك باعوا الدنيا .. والناصريين كتموا الدنيا ... والسادات فتح علي الغرب وخان الدنيا .... ومبارك .. أديكم شايفين ...<br />الإسلاميين لسة محمكوش عشان نعرف رايهم ... لكننا جربنا التانيين وشفنا ... يعني المفروض السؤال يتعكس ... ويكون تخوف الإخوان من حكم الاخرين ؟؟؟<br />علي فكرة ده مش معناه ان عشان التانيين وحشين نختار الإسلاميين .... لكن معناه لو في حد المفروض يتخوف وينشكك هو الإخوان مش العكس ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamdmat@hotmail.com"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102031810/http://egyvote.20at.com:80/article.php?sid=83"

[[comments]]
order = 3
subject = "طيب ماهم اتجربوا قبل كده ونجحوا"
author = "محمد السيد"
posted = "2005-11-30"
text = "بعدين ... الناس جربتهم في المحليات والنقابات واتحادات الطلبة زمان ... وكله بيشهد لهم ... يمكن إحنا عشان لسة صغيرين منعرفش الكلام ده ... لك اسألوا اللي قبلنا عنهم وعن العز اللي جابوه للنقابات ... وفي الجامعة ايام الانتخابات اللي بجد ...<br />إحنا مشكلتنا ... او هم عايزين يخلونا كده ,,,, منعرفش اللي حصل فيخوفونا من اللي جاي ...<br />وبعدين اللي بيتكلم ده فين برامجه أساسا.. سواء مكتوبة أو مقروءة أو حتي معروفة ؟؟ هي برامج التانيين مغرقة البلد يعني ؟ بعكس الإخوان اللي الحقيقة الواحد يشهد لهم برنامجهم موجود...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamdmat@hotmail.com"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102031810/http://egyvote.20at.com:80/article.php?sid=83"

[[comments]]
order = 4
subject = "مطلوب يختاروا يا سياسة يا دين"
author = "مواطنة مصرية جدا"
posted = "2005-12-06"
text = "ستاذ محمد السيد .. مش مطلوب يبوسوا راس حد لكن مطلوب تكفير عن اخطاء الماضي بتغيير جذري في الفكر و التطبيق ايضا .. نحن لا نطلب من الخوان المسلمين ان يعتذروا بكلمتين حلويين للسياسيين لكن ان يختارول دور واحد فقط .. اما سياسة او دين .. المثل الشعبي بيقول صاحب بالين كداب .. السياسة دور الساسة و الدين دور رجال الدين .. المواطنين لا يمكن تقسيمهم حسب العقيدة بين مسلم و غير مسلم و بين مسلم اخوانجي و مسلم غير اخوانجي .. مطلوب برنامج سياسي لا ديني لا عرقي .. مطلوب ان نعيش كلنا في بلد واحد دون تعصب اعمى جاهل .. مطلوب ان نلعب دور سياسي عالمي و ليس ديني تبشيري .. مطلوب ان نعرف الاشياء باسمائها .. مطلوب الا يكون هناك دور معلن و دور خفي نندم عليه في المستقبل .. مطلوب اثبات ان الجميع امام القانون سواسية .. مطلوب اشخاص على وعي ودراسة بالدور السياسي و ليس الديني"
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102031810/http://egyvote.20at.com:80/article.php?sid=83"
