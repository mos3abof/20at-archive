text = "بص لو البنت اللى بتطلب الطلبات دى مش واثقة انها من عائلة متيسرة وهما ذات نفسهم ممكن يجيبوا الطلبات دى عمرهم ماحيطلبوا كده بس برده اكيد حتلاقى بنات بتقبل اللى انت قولت عليه واكيد مش كل البنات زى بعض فى تفكيرهم ومع ذلك برده مش انت اللى تقرر احنا نتجوز مين او منتجوزش مين مينفعش تجبرنا على حاجة ممكن تكون اقل من مستوى اللى انت متقدم لها"
