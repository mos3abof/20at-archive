text = "بص انا حسه كلامك فى هجوم على البنات … كل عايشين وشايفين الواقع والحياه ماشيه ازاى وفى اهالى كتيير عايشه فى اللى احنا فيه وابتقدر الشباب لأن كل بيت دلوقتى فيه الولد وفيه البنت يعنى عايشين تجربة البت والولد …وبعدين ماتحسسنيش ان اهالى البنات كلها اغنيه والولاد دول شحاتين الحياه تعاون وقسمه على اتنين"
