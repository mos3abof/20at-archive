posted = "2010-01-21"
text = "ماينفعش دايما نقول ان المشكلة في أهل العروسة .. لأن دة بيخلي دايما الشباب متواكلين .. الواحد منهم لية بيقول يا هادي و في العشرينات ومش هاين عليه يتعب شوية أو يشتغل شغل اضافي عشان يحسن المستوى اللي هياخد خطيبته فيه !!!<br />وتلاقيه بيطالب دايما البنت بانها هي اللي لازم تقدم تنازلات عشان هو مش عايز يتعب حبتين أو حتى يجي على نفسه !!!!!!<br />كلام صاحب التوبيك والفكر السائد دة هو اللي خلى الشباب دايما عايزين كل حاجة عالجاهز من غير تعب ..<br />أنا مابقولش ندبح العريس .. بس اذا كانت البنت (قبل أبوها) شايفة فعلا انه عامل اللي عليه وزيادة يبقى مفيش مانع من تقديم شوية تنازلات في الطلبات ودة فعلا بيحصل .. بتلاقي أهل العروسة بيساعدوا الشاب كويس قوي لدرجة انهم هما ساعات اللي بيجيبوا الشقة<br />لكن مايبقاش العريس لسه شاب ومعندوش استعداد يتعب عشان يتجوز ونطلب ساعتها من العروسة وأهلها انهم يتنازلوا !!!!!!<br />أبو العروسة هايساعد ليه شاب هو نفسه مش عايز يساعد نفسه ؟؟!!!"
archived = "2010-02-17"
capture_url = "https://web.archive.org/web/20100217090839/http://www.20at.com:80/banat/only-for-men/14846-2010-01-12-17-00-16.html"

