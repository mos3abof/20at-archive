posted = "2010-01-14"
text = "على فكرة دى مش قاعدة عامة ان كل اهالى البنات وكل البنات كدة وان الشباب كلهم بيتقدوا وبيحصلهم كدة فى كتير لما بيجيب الشقة ويثبت فى شغل بردو نلاقية ما ارتبطش ؟؟ لية ؟؟ عشان البناااااااااات الكتير اللى فى البلد يفضل يكلام دى ويعرف دى ولا يتجوز من اساسو وياريت مانعممش ان كل الاهالى بيحبوا يعسروا الزواج الحياة هى اللى بقت صعبة فى كل حاجة والجواز دا قرار عمر عشان كدة مش سهل بين يوم وليلة ولا هى اى بنت والسلام ولا هو اى شاب وخلاص عموما ربنا يوفق الكل لان كل واحد بيعمل اللى علية وفى الاخر دى حياتة وقراراتة (بعد قسمة ربنا والنصيب طبعا)"
archived = "2010-01-15"
capture_url = "https://web.archive.org/web/20100115131149/http://www.20at.com:80/banat/only-for-men/14846-2010-01-12-17-00-16.html"

