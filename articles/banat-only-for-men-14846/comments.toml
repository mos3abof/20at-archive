text = "معلش بقي بس انا شايفه ان السبب في ده الطمع من الناحيتين<br />يعني المفروض الاتنين يبقوا من نفس الطبقه الاجتماعيه<br />لكن كل واحد عايز الاكتر من الي عنده يعني لو الواحد اتقدم لواحده علي حالها زيه اكيد مش هتقولوا هات شقه بخمسين اوضه كفايه خمسه بس<br />لكن هوا رايح لواحده اعلي منه علشان الطمع وهيا عايزه تعيش اكبر من مستواها و مش حامده ربنا<br />و ده فعلا السبب الرئيسي للعنوسه عندنا هنا"
