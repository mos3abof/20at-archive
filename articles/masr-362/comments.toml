[[comments]]
order = 0
subject = "الدوام لوجه الله تعالى"
author = "سعيد سعد"
posted = "2006-05-23"
text = "السلام عليكم<br />لا احد كبير على الموت الدنيا والدوام<br />لله الخالق وحدة يارب ارحمها وارحم جميع موتى المسلمين"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120206/http://masr.20at.com:80/article.php?sid=362&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "الله يرحمها"
author = "عبدالله مفتاح"
posted = "2006-05-23"
text = "اللهم ارحم موتانا واغفر لهم واسكنهم فسيح جناتك<br />اللهم امين"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120206/http://masr.20at.com:80/article.php?sid=362&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "قولى يا حبوبا يا منعشه القلوبا"
author = "نيفين..نيفى..نوفا"
posted = "2006-05-24"
text = "احترمها جدا كفنانه<br />يكفى انها عمرها ما عملت دةر تخجل منه<br />اللهم ارحمها و تجاوز عن سيئاتها و جميع المسلمين"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120206/http://masr.20at.com:80/article.php?sid=362&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "كلنا مسافرين"
author = "حسام صلاح"
posted = "2006-05-24"
text = "كلنا مسافرين الى دار الحق ودار الابد فنحن نعيش مراحله وبعدها المرحله النهايه<br />اللهم ارحمنا جميعا وارحم المسلمون والمسلمات الاحياء منا والاموات"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120206/http://masr.20at.com:80/article.php?sid=362&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "رحمة الله عليها"
author = "مصرية"
posted = "2006-05-25"
text = "اللهم أرحمها وأرحم أموات المسلمين اجمعين وأغفر لناجميعا..اقرؤا لها الفاتحه"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120206/http://masr.20at.com:80/article.php?sid=362&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "بأسم كل الخليجيين"
author = "خالد"
posted = "2006-05-26"
text = "بأسم كل الخليجيين نقدم تعازينا الى الشعب المصري القدير وان يتغمد المرحومة بواسع رحمتةوان يسكنها فسيح جناتة سناء يونس من الممثلات القديرات ونكن لها كل حب وتقدير ولم تشاهد عيني يوماللمرحومة انشاء اللةعمل يخجل عملت بكل مايملي عليها ضميرها واساسيات اخلاقيلتها رحلت لاكن ستبقى ذكرى احترام وتقدير ..."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120206/http://masr.20at.com:80/article.php?sid=362&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "الله اكبر"
author = "نادر فاروق"
posted = "2006-05-26"
text = "الهم صلى وسلم وبارك على سيدنا محمد وعلى اله وصحبه وسلم تسليما كثيرا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120206/http://masr.20at.com:80/article.php?sid=362&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "له فى ذلك حكم"
author = "بحب السيما"
posted = "2006-05-26"
text = "رحلت العملاقة سناء يونس فنانة فنانة قوى وبجد مدرسة فى الأداء السهل الممتع والأداء الكوميدى الجميل و خفة الدم الطبيعية كنت بحبهاممثلة جامده و مقنعة فى كل أدوارهاو تاريخ جميل و ثقافة أحلى بصراحة مش عارف أقول إيه عليها غير إننا إفتقدنافنانة جميلةلكن فنها باق وسيبقى وأنا مش عارف ليه ربنا مايفتكرش اللى مالهومش لازمة من الدخلاء على الفن لكن أرجع وأقول له فى ذلك حكم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120206/http://masr.20at.com:80/article.php?sid=362&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

