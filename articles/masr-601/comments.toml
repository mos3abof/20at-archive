text = "أنا مبستقلش بأي شغلانة لأنى والحمدلله اشتغلت في كل حاجة من أول بياع ذرة علي الناصية مفي محل فراخ وأخر سبع سنين كانوا مع مبلط سيراميك.. لكني حاسس أن حرام الناس دي تقتل جوانا الأمل اللى بيحتضر أصلا<br />حرام تقولي أن ال200 ألأف وظيفة مفيهمش مهندس ولا دكتور ولا حتى مدرس.. شيال وعامل نظافة..<br />بعد أربعتاشر سنة ثانوي بتقولي شيال و ماله"
