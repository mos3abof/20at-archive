[[comments]]
order = 8
subject = "وعود جديدة بتنفيذ الوعود التى سبق الوعد بها"
author = "زيكو"
posted = "2006-07-03"
text = "عندما يقدم مسئول وعدا لا ينفذ طوال ست سنوات، يصعب تصديق انه سينفذه، ومع الرئيس مبارك اعتاد المواطنون على الاستماع إلى وعود، سرعان ما تنسى ليعاد بثها وطرحها، ويريد دهاقنة الاستراتيجية والفكر الجديد أن يصدق الناس وعودا سبق إطلاقها عدة مرات. ففى خطابه بافتتاح الدورة البرلمانية عام 2000 وعد مبارك بزيادة فرص العمل قبلها فى عام 1999 فى الاستفتاء الاستفتائى على الرئاسة وعد بزيادة فرص العمل، وفى برنامجه الانتخابى قبل شهرين وعد بتوفير 4 ملايين فرصة عمل من خلال زيادة الاستثمارات، وفى خطابه أمام افتتاح البرلمان الحالى كرر ذلك. لكنه طبعا يربط كل ذلك بزيادة الاستثمار، والاستثمار يحتاج شفافية والشفافية ضد الفساد، والفساد موجود بكثرة، والنظام الاقتصادى يعوم على الفوضى. والدولة يدها فى أفواه الجميع. وعلى العاطلين انتظار مزيد من الوعود، يطلقها الرئيس ويكررها، ويصدقها.<br />المدهش انه مع كل وعد يقدمه الرئيس تزداد المشكلة وتبدو المسافة بعيدة بين الواقع والوعد، وربما كان على الشعب أن ينتظر عشرات السنين الأخرى حتى يأتى موعد الخطاب أو البرنامج القادم ليقدم نفس الوعود. التى تظل كما هى وعودا غير قابلة للتنفيذ. خاصة أنه لا تظهر أية علامات ولو من بعيد على تغيير طريقة العمل أو الوجوه. الرئيس لم يتوقف عن تقديم الوعود برعاية محدودى الدخل الذين تزداد حالتهم سوءا مع كل وعد، والسبب فشل الاستثمارات وسيادة الفساد والاحتكارات، وغياب الرؤية، وعدم الاعتراف بفشل وفساد الإدارات القائمة على التنفيذ، والتى تتبع الحزب الوطنى الذى يرأسه الرئيس، والحكومات التى يعينها الرئيس، والمسئولون الذين يتبعون الرئيس، ومع هذا الوضع لا يتوقع أن تتحول أى من هذه الوعود على واقع، بعد أن اعتاد الرئيس تقديم وعود، يرددها من خلفه طاقم الدينا<br />اقرأ بقية التعليق .."
archived = "2006-07-06"
capture_url = "https://web.archive.org/web/20060706050834/http://masr.20at.com:80/article.php?sid=601"

[[comments]]
order = 9
subject = "وليه في ناس مضايقة من تعبير عن الراي"
author = "مصرية"
posted = "2006-07-03"
text = "وليه من ساعة اما الموضوع نزل المنتدي وانا حاسس ان في واحد او اثنين من الشباب الحاصلين علي مؤهلات متوسطة مضايقين اوي من شباب مؤهلات عليا بتعبر عن رايها بحرية وبدون اهانة<br />كل واحد حر في الي بيقوله<br />وانا من راي شايف ان في واحدة زادت فيها حبيتين واهانت ناس في المنتدي<br />طب ليه يا حبيتي؟؟؟؟؟؟؟؟<br />الشباب الجامعي مخنوق خالص وبيعبر عن رايه في نظام فاسد<br />طب انتي مالك<br />هو انت مؤهل عالي زيه علشان تقولي له (و فيها ايه لما تشتغل خياطة او شيال )<br />طب وانت مالك؟؟؟؟؟؟؟<br />لو عايزة تشتغلي خياطة روحي اشتغلي خياطة او شغالة او الي يعجبك<br />لكم مش من حقك تهيني شباب زي الورد اضاع عمره في التعليم العالي علشان يشتغلوا خياطين؟<br />وتسخري منهم.....<br />لو البلد عليهم مش ناقصكي انتي كمان.."
archived = "2006-07-06"
capture_url = "https://web.archive.org/web/20060706050834/http://masr.20at.com:80/article.php?sid=601"

