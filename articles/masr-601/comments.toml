subject = "الوطن العربي"
author = "بنت فلسطين"
posted = "2006-07-03"
text = "كنت مفكرة انو احنا بس اللي بنعاني من الظلم والقتل والاضطهاد والتدمير والدم بس الظاهر انو كل الوطن العربي ( 22 دولة) بتعاني من نفس الشي بس بصور مختلفة يمكن القتل والتدمير عندكو مش زي الللي عنا بس عندكو كمان ما بقل خطورة عن التدمير اللي بصير عنا<br />والحقيقة انو كل الوطن العربي محتل من قبل الغرب والمي بتجري من تحتينا واحنا مش حاسين<br />وقوتنا بشبابنا وشبابنا مكبوت محروم مظلوم<br />الله يعوض علينا"
