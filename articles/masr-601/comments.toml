[[comments]]
order = 1
subject = "بمناسبة فرص العمل (مطلوب خياطين)"
author = "وائل"
posted = "2006-07-02"
text = "تعلن شركة (التوظيف الوهمي) عن طلب عمال للعمل لديها<br />1_كفني خياط اول<br />2_وفني خياط ثاني<br />3_وصبي خياط<br />الشروط:<br />يشترط للوظيفة رقم واحد اجادة اللغة الانجليزية والفرنسية والكمبيوتر اجادة تامة مع الحصول علي مؤهل عالي وخبرة 6 سنوات علي مكنة خياطة<br />يشترط للوظيفة 2 و 3 الالمام بالانجليزية<br />وان يكون مؤهل عالي والخبرة ما بين سنتين الي اربع<br />شروط عامة:مؤهلات عليافقط ويفضل الماجيستير والدكتوراة<br />توافر الخبرة<br />يفضل من معه واسطة<br />المزايا :<br />1-عقد سنوي يجدد كل سنه ولا يوجد تثبيت لدينا<br />2- الشغل علي مكن خياطة صيني تعبان<br />3- المرتب 250 جنيه بالحوافر+ الافر تايم يا بلاش<br />وسلملي علي الشهادات والتعليم الجامعي"
archived = "2006-07-06"
capture_url = "https://web.archive.org/web/20060706050834/http://masr.20at.com:80/article.php?sid=601"

