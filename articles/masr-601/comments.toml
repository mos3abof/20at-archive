subject = "الخوف اسمه بكرة"
author = "مهم جداً"
posted = "2006-07-03"
text = "آه يا بلدنا يا بلد الوسايط والكل داس فيها عربي انجليزي فرنساوي والكل أكل البسبوسة فيها وأنا المنقوع في طينك يا بلدناويقولولي خِلقت ربنا<br />يا ربنا يا قادر على كل شيئ ليه خلقتني شجرة تقف علي الطيور والحشرات وتنام في حضني التعابيني وراسي تحت الشمس تاكل وتشرب منها ولما أقول الآه ملقاش غير كلمةبكرة تفرج<br />هو حرام أدوق خيرك يا بلدنا<br />دا الأب الظالم بيسيبه ابنه في خريفه<br />وأنا والله يا بلدنا خايف يجيني اليوم اللي يقولولي فيه إلحق البلد وساعتها أتف عليهم وعليكي"
archived = "2006-07-06"
capture_url = "https://web.archive.org/web/20060706050834/http://masr.20at.com:80/article.php?sid=601"

