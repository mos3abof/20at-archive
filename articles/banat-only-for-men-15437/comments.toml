text = "انا مع ro<br />اولا الاكل طبعا كله غلط وده اهم سبب يعنى مثلا ى لبنان الاكل كله صحى عشان كدة جسمهم من غير مايهتموا او يحافظوا جسمهم مش بيتخن زينا كدة<br />تانى حاجة قله الحركة البنت قبل الجواز بيبقى فى حركة يعنى كليه ولا شغل بمجرد انها تتجوز طبيعى فى الغالب الخروج بيقل فطبعا ده هيؤدى لذيادة الوزن انا شخصيا كنت بخرج كتير وبتحرك وكان وزنى 50 قعدت فترة فى البيت مش بخرج كتير وزنى زاد بقى 57<br />تالت حاجة بردو ان البنت بعد الجواز وراها اهتمامات كتير من شغل البيت للاولاد للزوج ولحاجات كتيييير الراجل مش بيتخن قوى لانه فى حركة مستمرة لانه بيروح الشغل"
archived = "2010-02-25"
capture_url = "https://web.archive.org/web/20100225200702/http://www.20at.com:80/banat/only-for-men/15437-2010-02-22-13-29-56.html"

