author = "ام زياد"
posted = "2010-02-24"
text = "السلام عليكم<br />على فكرة يا جماعة انا موش معاكم خالص<br />انا متزوجة و عندى طفلين 5 سنين و 3 سنين<br />و زوجى مشغول جدا<br />ايوة مرة واحدة زدت فى الوزن علشان الحمل كان ورا بعضة بس اول ما بنتى بطلت الاعتماد عليا فى اكلها بسرعة لحقت نفسى و عملت دايت و رجعت تانى حلوة و صغيرة<br />و كل الى يشوفنى مايدنيش سنى و لا يعرف اساسا انى عندى اطفال<br />لكن الستات لو تخنت بيكون من عدم اهتمام الى حواليها بيها و انها بات مركونة على الرف مابتسمعش كلمة حلوة و لا بتخرج خروجة حلوة و لا بتنبسط<br />فبتعوض الكلام دة بلاكل و دة اكبر غلط<br />لان السعادة فى الزواج عمرها ما بتيجى لحد من نفسها<br />السعادة دية اكتر شىء مكتسب لازم نسعى الية و نجاهد فى الحصول علية<br />علشان كدة انا بقول لكل ست متختخة خلى بالك من نفسك جوزك و لا هيحط فى دماغة منظرك اية ادام الناس بالعكس هيبتدى يبص برة و انتى الوحيدة الى هتتضايق سيبك منة و اتجملى لنفسك"
archived = "2010-02-25"
capture_url = "https://web.archive.org/web/20100225200702/http://www.20at.com:80/banat/only-for-men/15437-2010-02-22-13-29-56.html"

