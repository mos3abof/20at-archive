text = "الكلام ده مش مضبوط على فكره<br />زياده الوزن بتكون اولا من تغيرات فى الهرمونات بالاضافة الى ان العالم العربى نفسة طرق التغذية عنده خطا بنسبة مليون فى الميه<br />من اكل ممتلا دهنيات وسكريات وووووو<br />بالاضافة الى ان المسئوليات الملقاه على عاتق الزوجة والام كثيره جدا تجعلها ليس لديها وقت حتى للنوم<br />يعنى تطبخ وتغسل وتنظف وتاكل الاولاد وتذاكر وتشترى مستلزمات البيت وتكوى ولو بتشتغل كمان ورعاية الزوج ايضا<br />دى اشبة للربوت مش للانسان وعايزينها كمان تبقى مهتمة بنفسها ازاى؟؟؟؟؟<br />اذا اردت ان تطاع فامر بما هو مستطاع"
archived = "2010-02-24"
capture_url = "https://web.archive.org/web/20100224090400/http://www.20at.com:80/banat/only-for-men/15437-2010-02-22-13-29-56.html"

