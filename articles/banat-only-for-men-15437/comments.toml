author = "Bosssy"
posted = "2010-02-22"
text = "ro<br />انا بنت زيك لكن مش معاكى مش معنى اننا ورنا مهام كتيره اكل وشرب ورعايه اطفال و غيره ان ده يبقى فعلا منظرنا اانا مع الرجىال بصراحه ليه حق يبص لغير مراته ويكون عايز يتجوز تانى اصلا لان مشاكل السمنه كمان كتيره حتى فى العلاقه الزوجيه<br />لازم المراه تهتم بشكلها الخارجى جكويس زى ما بتهتم بيبتها واطفال لان ده حق جوزها عليها برده<br />كمان برده على فكرنا من حقنا احنا كمان ان تكون ازواجنا مهتمه بنفسها زينا مش يطلعلوا كشر وغيره…<br />كل ده حقوق لكل من الزوجين 1 +1 = 2"
archived = "2010-02-24"
capture_url = "https://web.archive.org/web/20100224090400/http://www.20at.com:80/banat/only-for-men/15437-2010-02-22-13-29-56.html"

