posted = "2010-02-22"
text = "والله عندك حق<br />وكلامك اكبر دليل على ان البنات اللى بيفضلوا يجملوا في نفسهم ويقولوا دا عشان نفسي .. انا بتجمل لنفسي .. يعرفوا انهم بيتجملوا للشباب وبعد كدا بيتحولوا تحول تام على أساس اانها ضمنت مستقبلها خلاص متعرفش انها بكدا بتدمر حياتها ومبتعفش زوجها عن انه يبص بره<br />حسبي الله ونعم الوكيل في كل انسانة بتعمل كدا وتظلم اهم انسان في حياتها"
