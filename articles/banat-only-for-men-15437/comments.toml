text = "يمكن يا Bosssy لانك بنوتة فمدخلتيش فى تفاصيل الحياة اليومية للزوجة<br />انا كنت زيك كده وبقول مستحيل اعمل زى دول او اكون كده<br />بس جربى تشيلى مسئوليه عائلة بحالها بكل التزامتها صدقينى مش حتلاقى وقت حتى تبصى لنفسك فى المرايه<br />الكلام ده عن تجربه وكل صحباتى معايا فى نفس القصة دى الا اذا كان عندك خادمة مقيمة فى البيت فده وضع تانى<br />او يكون زوجك من النوع المتعاون وده بقى مستحيل دلوقت<br />بجد السمنة والاهمال اللى بيحصل مش بسبب انها خلاص اتجوزت بقى وان كان فى شريحة من البنات كده لكن بجد بتكون بسبب الالتزامات الكثيرة جدا اللى لازم تتعمل يوميا<br />بتحس انها زى اللى مربوطة فى طاحونة حتى لو بتعرف تدير وقتها ازاى مبينفعش بجد<br />وربنا يكرمك ونفرح بيكى قريب وتقوليلنا حتعملى ايه بجد وقتها"
archived = "2010-02-24"
capture_url = "https://web.archive.org/web/20100224090400/http://www.20at.com:80/banat/only-for-men/15437-2010-02-22-13-29-56.html"

[[comments]]
