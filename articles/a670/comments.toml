[[comments]]
order = 2
subject = "معلومات مغلوطة"
text = "من أكبر عيوب ( صدام ) .. أنه جعل كل ثرواته بأسمه / فكان من السهل الحجر عليها .. مثله!<br />لوليد بن طلال :<br />هو الاسم المموه لممتلكات ( دوله ) .. فكل الممتلكات والمدخرات والمسروقات والنهبات تودع باسم<br />أمّا هو لا يعرف من الذكاء سوى ما تعلق من السهر والنساء والخمر والمجون ...<br />فلو حجر يوما على أموال دولة .. فلن ينال الوليد شيء . لأنه شريك لكل مؤسسة مالية عالمية .....<br />هذا الفرق بين ذكاء و ذكاء .....<br />هناك خطأ بالرواتب :<br />( 30000 ريال ) .. للفئات ( ج )<br />( 45000 ريال ) ... للفئات ( ب )<br />( مليون .. ريال ) ... للفئات ( أ )"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022162701/http://www.20at.com:80/article.php?sid=670"
