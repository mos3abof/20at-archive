[[comments]]
order = 1
subject = "ابن زيدون المجنون"
text = "نسمع كثيرا عن الرغبة فى التغيير واستبدال النظم الظالمة دون ان يصاحب ذلك توضيح عن منهجية هذا التغيير واسلوبه وفكره ومبادئه التى يتبناها أعتقد أنه مرحبا بتغيير نحو الأفضل المدروس بعنايةأخذاً فى الأعتبار كل مايحيط بالبلاد وعلاقاتها الداخلية والخارجية ومستقبلها ومايحيق بها من اخطار ولا مرحبا بتغيير فقط من اجل التغيير حتى لانقدم لأعداء الأمة ما يشتهون ."
archived = "2005-02-14"
capture_url = "https://web.archive.org/web/20050214203004/http://www.20at.com:80/article.php?sid=906&amp"

[[comments]]
order = 2
subject = "القاهره الجديده - القطاميه"
text = "اتمنى المشاركه فى تلك الفكره بايجابيه عوضا عن المشاركه فى احزاب المعارضه المتهالكه الموجوده<br />لا ادرى ماالمطلوب منى ولكن انا زهقت وممكن اقلع هدومى فى ميدان التحرير فى سبيل ان نظام مبارك ينتهى وميجددش ولا يورث لجمال صدقونى انا معاكم كده كده خربانه خربانه هيضيع مستقبلى مما هو مستقبل شباب مصر كله ضايع باستثناء 3% طبقه راقيه"
archived = "2005-02-14"
capture_url = "https://web.archive.org/web/20050214203004/http://www.20at.com:80/article.php?sid=906&amp"

