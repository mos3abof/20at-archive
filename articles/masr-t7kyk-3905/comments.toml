posted = "2006-05-08"
text = "تصدقو فعلا عيب عيب اووى كده لما نفضل خمسه وعشرين سنه نضرب على قفانا ومفيش اى تغيير المهم ربنا ياخد الكبير وابن الكبير ومرات الكبير بتاعه العيال محدش يفكر فى حاجه وحشه يا وحشين انا قصدى بتاكل عيال المهم ربنا ياخده ويريحنا من همه وفساده وجشعه وظلمه وامن دولته ويغوور بقا كفايييييييييييييييييييييييييييييييييييييييييييييييييييههههههههههههههههههه"
