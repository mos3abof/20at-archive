text = "الموضوع مالوش علاقه بحسنى أمال الرجال بيتكلم على نظام مين اللى مالوش مشروع وتايه وبيخبط وبيمنع مش نظام حسحسي برضو<br />ولا هيكل بيتكلم عن نظام جينكيز خان<br />واضح ان البيه دبلوم صنايع"
