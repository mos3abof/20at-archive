subject = "!!"
author = "هى الناس اللي بتعلق هنا هبلة ولا ايه ، الموضوع ملهوش أى علاقة باللي جابوا حسني ، ولا لازم في كل موضوع يدخل اتنين تلاته يلطعوا الكلام اللي شكلهم حافظينه ومش فاهمينه دا ، ارحموا اللي جابونا والنبي شوية يا جدعان"
