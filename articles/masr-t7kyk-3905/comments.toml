[[comments]]
order = 3
subject = "ممكن أشوفكم بكرة تاني ؟؟شكلنا مش حنخلص"
author = "محمد السيد"
posted = "2006-05-10"
text = "ممكن اشوفكم بكرة في الاعتصام ؟؟؟ اعتصام إيه ؟؟ انتو متعرفوش ؟؟<br />بكرةالنظام الجميل بتاعنا ...... قرر إنه يحاكم كل قاضي اتجرأ وقال إن الانتخابات كانت مزورة .... وإن الحكومة لعبت فيها واستخدمت فيها البلطجية ....<br />وكان الرد محاكمة إثنين من أنبل و أشجع القضاة عشان يكونوا عبرة ومثل لباقي القضاة .....<br />بكرة أثناء المحاكمة في اعتصام والدعوة عامة لكل الناس .. لأي حد ييجي وميخفش ... أصل البلد دي زي بلدنا إحنا مش بلدهم ...<br />دعواتكم .......<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907035215/http://masr.20at.com:80/article.php?sid=287"

[[comments]]
order = 4
subject = "اه نسيت اقولكم أشوفكم فين ؟؟ المكان يعني ؟؟؟ مش قصدي أنهي ليمان.."
author = "محمد السيد"
posted = "2006-05-10"
text = "المكان ... عند محطة المترو بتاعة جمال عبد الناصر .... أمام نقابة الصحفيين والمحامين .....<br />أنا عن نفسي رايح اللي يحب ييجي معايا ييجي .... أو يقول لحد ييجي ... أو أقل حاجة إنه يتابع اللي بيحصل قي الأخبار بكرة ....<br />ولما أرجع حأحكي لكم إحنا عملنا إيه ...؟؟؟ وهم عملوا معانا إيه ....<br />عشان يخرسوا ... ويسكتوا ... ويسكنوا ... وميجبوش سيرة أي حاجة تاني ...<br />من الآخر عايزينهم يوصلوا للمرحلة اللي كتير من الناس العادية اللي زينا وصلوا لها ....<br />وعشان البلد دي بلدنا إحنا مش بلدهم هما ...<br />عشان دي بلد الطلبة والموظفين والعمال والمهندين والأطباء والصحفيين والمحامين والقضاة .... مش بلد الرؤساء وأولادهم و زوجاتهم \" عشان أكون واضح مش بلد محمد حسني مبارك أو جمال أو سوزان مبارك \" ....<br />كان لازم الناس العادية اللي هي إحنا تقف مع القضاة وترد عنهم الظلم وتحسسهم إنهم مش لوحدهم قدام النظام المستبد ده ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907035215/http://masr.20at.com:80/article.php?sid=287"

