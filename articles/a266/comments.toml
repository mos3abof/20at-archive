subject = "مغترب مصرى فى الكويت"
text = "ياريت يا استاذ احمد تبعت تقولى ازاى بدا بالظبط<br />ووصل للى هوا فيه على الاقل اهوا احسن مننا اخدنا كليات وبنشتغل فى الكويت عند ناس بيكرهوا اى جنسيه الا الامريكى طبعا"
