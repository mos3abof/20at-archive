[[comments]]
order = 11
subject = "الموضوع محتاج للنظر بعقل ...!!!"
author = "sweet_princess"
posted = "2006-03-10"
text = "يا كباتن ويا انسات اللي زعلتوا قوي لما اتريقت وقلت ليه تعمل عمره لواحد كافر ..ايوه كافر .<br />والكابتن اللي زعل قوي لما قلت كده واستشهد بدعاء (النبي عليه الصلاة السلام) لعمر بن الخطاب .. احب افهمك يا كابتن ياللي (اتحمقت) قوي انت وغيرك .. انه ما فيش اي وجه مقارنه بين واحد زي دا وعمر بن الخطاب اللي كان رغم عناده وكفره قبل الاسلام الا كانت ليه مواقف كتير جدا جعلت من( النبي عليه الصلاة والسلام) يتوسم فيه الخير ويدعليه وماكانتش الدعوه ليه لوحده بل كانت كمان( لابوجهل) اللي هو ((ابو الحكم عمرو بن هشام)) ولكن ربنا استجاب منه في دعوته لعمر بن الخطاب فقط والتاني مات على كفره..<br />واللي ميضايقين قوي دول .. زي ما قلنا قبل كده ماتعين واحد مسلم مش قادر يعمل العمره دي افضل من انك تعملها لةاحد كاااااااافر (كافر)وبكده هتاخد ثوابك مرتين ..<br />وبعدين جايين في عز انقلاب الغرب علينا تدعولهم ... طيب اللي زعلانين قوي دول احب اسالهم وحد مكنهم يجاوبني (عملت ايه لنبيك بعد اللاهانات اللي اتعرضلها ..<br />انا اكاد اجزم انكم ما اتحركتلكوش شعرة من رموشكم بعد اللي حصله ..<br />دا انا لما اعترضت لقيتكم هجتم قوي .. كاني اهنت رمز ديني ولا حد مهم مش راجل كل هوايته هي الاستعراض (وترقيص العضلات) ومافيش فيلم بيطلع فيه الا وفيه كام مشهد (عمال يشرب فيهم خمر ولا بيبيصبص لواحده) هو دا قدوتكم .. (((جتكوا القرف)))<br />والله انتوا وجعتوا قلبي ...<br />فوقوا بقى ماتضحكوش الناس عليكم ..<br />صحيح ((( اصحاب العقول في راحه )))."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124006/http://www.20at.com/article2.php?sid=549"

[[comments]]
order = 12
subject = "جاكي شان بيعبد\" بودا \"حاليا"
author = "عقلاني"
posted = "2006-03-10"
text = "السؤال هو: هل اسلام جاكي شان هيكون سبب في اسلام معجبينه! يعني مثلا جاكي شان بيعبد بودا حاليا .واحنا بنحب جاكي شان.وما اتاثرناش بالللي بيعبدة بودا.لأننا بس يهمناافلام جاكي.فرضا ان جاكي تحول من الديانة البودية الي النصرانية.هل تعتقد ان معجبيه المسلمين سيتحولو الي النصرانية!<br />اذا فكرة اسلام جاكي هتكون قدوة لغيرة فكرة منتقدة لنفسها.<br />اما فكرة اسلام جاكي شان عامة.كفكرة.هي جيدة بالفعل لأنك اشتريت نفسا.ودا حصل مع ناس اعرفهم تزوجو من نصرانيات و يهوديات وهدوهم للاسلام وحسن اسلامهم.انا بالفعل اغبطهم لانهم اشترو نفساوكانو سببا في هدايتها.<br />فرضا اني انا جاكي شان.وكنت في هونج كونج حاليا.واستطاع واحد ان يقابلني وقال لي.انا اتيت اليك من الشرق الأوسط لأني معجب بك.سيكون ردة فعلي انا جاكي شان انه\"عادي\" او لن اصدق ان احد قطع هذة المسافة فقط من اجلي وليس من اجل مصلحة ما في البلد ومن ثم بالمرة قال انه سيري نجمة المفضل اللي هو انا.لكــــن. اذا اتي شخص وقال.لقد اتيت اليك من الشرق الاوسط فقط لأعرفك علي ديني.وادعوك لترانا في دولنا.وتري ديننا عن قرب.فقط لتري وليس لتغير دينك.ودعوته من الممكن ان يكون له اثر طيب في نفسي\"جاكي شان\".<br />لا تنسو ان من تصرفات جاكي شان الشخصية تصرفات في منتهي الاحترام.هو يحترم الغير ومتواضع ومتسامح واقرب الي صفاته من المسلم.ولكن نحن المسلمين في دولنا نفتقد الي الاحترام والي التسامح ولا نحترم الغير وهذة حقيقة.اذا اتي سيقول مقوله احد النصرانيات التي اسلمن وكانت تعيش في امريكا واتت لزيارة دولة عربيه وقالت\" وجدت اسلام بلا مسلمين\".<br />اخي الكريم صاحب الفكرة: اليس الأولي ان تنفق من مالك علي الجماعات الوثنية في افريقبا.لقد وجدو انهم يضحون في يوم ما في السنة لا يعرفون لماذا.وشروق الشمس وغروبها عندهم لها صلاه.لا يعرفون لماذا.الشرف عندعم شيئ مقدس.عندما ذهب هناك احد الدعاه عرف ان اجدادهم كانو مسلمين ولكن الذريه التي بعدهم اتت ولم تعرف لماذا تفعل هذة الافعال.هؤلاء اولي بالرجوع لدينهم.وقد سأل الداعي عن طريق احد المواقع ان يتبرع من يستطيع بما يقدر علي ان يبعث هناك حملات من الدعاه.علي ان يدعي الاقربون في ضفاتهم الي الاسلام.كان ذلك في موقع موقع \" اسلام وايه دوت كوم\".<br />انت ذكرتني عزيزي صاحب الفكرة بما حصل عندما مثل ويل سميث دور محمد علي كلاي.وقالو انه اسلم.وبصفتي مسلم احب كل العالم ان يسلم ذهبت الي نت كفي ان ذاك واخذت ابحث عن ايميل ويل سميت لاهنئه علي حسن اختياره وهو الاسلام.وباءت محاولتي بالفشل لعدم وصولي الي ايميله.ومن ثم قد عرفت انه لم يسلم ولكنه ابدي اعجابة بالاسلام.ولكن في النهاية لم يسلم!<br />اتعتقد ان شخصا مشهورا يستطيع ان يسلم بسهولة.مثلا اذا حاول منهم الاسلام فان الاعلام سيتنقلب عليه وادوارة ستقلص.النجم لا يحب ان يتقيد بدين وخصوصا الاسلام.لأنه له حيثيات وقوانين لا يستطيع معها ان يعمل ادوار تليق بالسينيما الامريكية وهي ما يعول عليه معظم النجوم.وبما فيهم جاكي شان.<br />اعتقد ان جاكي شان قد ظهر عريانا في مجموعة من الافلام.وكانت احدها انه قد لعب كونج فو في احد الاسواق دون ملابس.وكانت الحبكة الدرامية تتطلب ذلك.هل تعتقد انه اذا اسلم سيمثل مثل هذا!بالتأكيد لأ اذا سيتقلص فرص عمل الافلام.<br />في النهاية القابض علي الدين مثل القابض علي جمرة.لن يسلم نجم دون ان يتقلص دورة اما لأن الاعلام الامريكي سيكرهه واما سيكون ادواره ثانوية.<br />ارجو الهداية للجميع.وارجو المسلمين ان يثبتو علي دينهم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124006/http://www.20at.com/article2.php?sid=549"

[[comments]]
order = 13
subject = "إلي سوسة المفروسة ثم إلي التعليق"
author = "islam_physics@yahoo.com"
posted = "2006-03-10"
text = "أولا أنا فعلا سعيد جدا اني قرأت تاني تعليق ليكي علي الموقع ده وأحب أوي إني ديما أقرأ تعليقاتك لانها فعلا في منتهي الجمال<br />التعليق<br />اولا من يريد ان يقوم بعمرة لجاكي شان هو قصدة خير وهذا نحترمه فيه<br />وبالنسبة لدعاء النبي فالنبي دعا ونحن لا نعارض الدعاء بل اننا نتمني لكل الناس جميعا الهداية البر منهم والفاجر والمسلم منهم والكافر فلا ضير ان يدخل كل الناس الجنة وأن يهتدي كل الناس<br />ولكن كما قال العقلاني في تعليقة هنا ليس من الضروري والمحقق ان يسلم كل من يعجبون به والدليل عليه اننا مسلمون و نحب جاكي شان ولا ندين بدينه وعليه لا يكون التبرع بأموالنا ووقتنا وجهودنا قبل أن نعيين المسلمين أولا فهم أولي بهذا المال ثم بعد ذلك غيرهم وأدعو لهم كما شئت ولكن أموالك ونفسك لها طريق اخر أولي وافضل وهب أنك فعلت العمرة ولم يسلم وكتب عليه أن يموت علي الكفر ( كما كان أبو جهل ) رغم دعاء النبي له فما تنفعة العمرة وهل تدري أنفعتك ولكنك عندما تعين رجلا مسلماعلي الزواج مثلا أو علي أداء العمرة ( فسواء قبل الله منه العمرة أو لا فلك الأجر طالما اخلصت النية )<br />وأنا اذكرك أيضا بقول الله تعالي لنبيه عندما اجتهد في دعوة الكفار فقال الله معاتبا له ( عبس وتولي أن جاءه الأعمي ... إلي أخر الايات فهذا عتاب من الله له لانه ترك الأعمي المسلم واجتهد مع هؤلاء الكفار فالأولي نصرة المسلمين والبقية بعد ذلك<br />أخوكم إسلام عبد السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124006/http://www.20at.com/article2.php?sid=549"

