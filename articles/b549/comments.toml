subject = "رااااااابنا يشفي...!!!!"
author = "sweet_princess"
posted = "2006-03-09"
text = "بقى صديقك بيعمل عمره لواحد كاااااااااافر (مثل فيلم مطلع نفسه فيه في مكانه قريبه من ربنا والعياذ بالله .. عن طريق ميداليه لو لمست انسان ميت بيرجع تاني للحياه و هيخلد ومش هيموت ,دي صفه من صفات الله وحده )واللي ما يعرفش اقولله ان الفيلم دا اسمه (الميداليه )او ((the meddale)<br />وبعد كده يحب انسان كافر ويتمناله الهدايه ....!!!!! (شيئ غريب ... شيئ عجيب).<br />طيب ما كان يعملها ل انتونيو بانديراس اولى .. لانه عمل فيلم بيظهر فيه المسلمين بشكل محترم ..اسمه المحارب الثالث عشر (the thertenth wariar).<br />ما انا اقولله احسن انه يعين واحد مسلم على اداء العمره(وما اكثرهم يعني ).وما يخافش هياخد ثوابه برضه (ان الله لا يضيع اجر من احسن عملا ..<br />لا اله الا الله ربنا يهديه اللي بيفكر بالسلوب دا هو واللي زيه..<br />وطالما الحكايه افلام من الول بقى<br />يبقى احب اقولله على طريقة ((جعيدي )) في فيلم شمس الزناتي .... راااااااابنا يشقيي."
archived = "2006-11-02"
