subject = "بارك الله فيك"
author = "عبدالله 17 سنة"
posted = "2006-04-29"
text = "و الله العظيم إنتا راجل تمام ة أكثر الله من أمثالك بجد فكرة كويسة جدا و كان نفسى من زمان إن جاكى يسلم علشان بحبو جدا بغض النظر عما يفعل (فيا يا جماعة لا يوجد ما يمنعة قبل إسلامة من إرتطاب المعاصى) و هو فى النهاية من الممثلين المحترمين و إنظروا كم سيكون تأثيره, أنظروا إلى النصف الملىء من الكوب<br />جزال الله خيرا و وفقك إلى عمل الخير و ياريت تدعيلى معالك فى العمرة بالهداية و الثبات و إدعى للمسلمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124006/http://www.20at.com/article2.php?sid=549"

