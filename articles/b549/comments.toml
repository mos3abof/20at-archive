[[comments]]
order = 25
subject = "يا جماعة مش كدة.. ادعو له بالهدايه عايزين نخرجة من الظلمه(جاكى جان)"
author = "العبد لله (اقراء حتى النهايه)"
posted = "2006-03-12"
text = "كيف يصلي رجال من الصين الفجر؟<br />جلس الداعية أمام الشيخ يحكي له تجربته الدعوية ومن حوله مجموعة من جنود الكتيبة الصينية المشاركة في حرب الخليج الثالثة ..<br />وكان الشيخ قد أطرق برأسه إلى الأرض ليصغي باهتمام والداعية يحدثه قائلاً:<br />لقد قدم هؤلاء للمشاركة في عمليات المساندة في شمال المملكة وكان لزاماً علينا نحن الدعاة إلى الله أن ندعوهم إلى الإسلام ونخرجهم من ظلمات الشرك والظلام ومن عبادة بوذا وكونفوشيوس وغيرهما من الأصنام إلى عبادة الله العزيز العلام.<br />وقد وفقنا الله سبحانه وتعالى في مهمتنا فأسلم عدد لا بأس به من هؤلاء وصرنا نعلهم أركان الإسلام وندرسهم واجباته و بدأوا في أداة الصلوات في أوقاتها بعيداً عن قادتهم وكبرائهم ..<br />ولكن المشكلة واجهتهم في صلاة الفجر فعندما علم قادتهم بتجمعهم في خيمة واحدة ليتناوبوا السهر كي لا تفوتهم صلاة الفجر فرقوهم بين الخيام ...<br />فأخذ كل منهم ساعته المنبهة معه لكنها صودرت منه وكلما وجدوا طريقة للاستيقاظ قبيل الفجر لأداء الصلاة في وقتها حاربهم هؤلاء القادة وسدوا عليهم المنافذ والأبواب ... وفجأة توصلوا لطريقة المتحدث للاستيقاظ ..!<br />وإذا بالشيخ ينظر باهتمام أكثر للداعية المتحدث وللجند المحيطين حوله الذين ينظرون إليه بإكبار وإجلال ، وواصل الداعية كلامه قائلاً: \" لقد قرر كل واحد من هؤلاء شرب كميات كبيرة من الماء قبيل النوم لكي يستيقظ للذهاب للخلاء ومن ثم ينظر إلى ساعته ويعلم كم بقي من الزمن لصلاة الفجر فإن قارب الوقت انتظر وصلى وإلا شرب كمية أخرى من الماء..<br />ومع تكرار التجربة مراراً قدَّرَ هؤلاء الكميات المناسبة التي تجعلهم يستيقظون في وقت يكاد يقترب من وقت الفجر، وصار كل منهم يؤدي صلاة الفجر في وقتها ... وعندها نظر الداعية إلى وجه الشيخ فإذا عيناه تذرفان \"..<br />هؤلاء حديثو عهد بإسلام وبلغ حبه في قلوبهم إلى هذه الدرجة ،لماذا يا ترى ؟!<br />لأنهم عرفوا الجاهلية وفسادها ومن ثم علموا الإسلام وسعادته فتمسكوا به..<br />فأين نحن من هؤلاء ؟!!<br />بل منا وللأسف الشديد من لا يصلي الفجر البتة وهو يسمع الأذان مع إن المسجد لا يبعد عنه إلا خطوات ؟<br />ولكن سوف يأتي اليوم اللذي يقول فيه<br />(ياليتني اتخذت مع الرسول سبيلا)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124006/http://www.20at.com/article2.php?sid=549"

