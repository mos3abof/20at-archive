order = 4
subject = "أراء غريبة"
author = "الرحيب"
posted = "2006-03-09"
text = "قرأت أراء عجيبة في هذا الموضوع وليست هي الأولي علي هذا الموقع فأرجو من زوار هذا الموقع القيم التركيز قبل الكتابة لأننا محاسبون علي ما نكتب . ما دفعني لقول ذلك من قال بأنه كيف يقوم هذا الصديق بعمل عمرة لجاكي شان الكافر الذي عمل في فيلمه (كذا كذا) لاحظ أنه كافر أي أنه لا يؤخذ علي ما يفعل فليس بعد الكفر ذنب أي أن ما يفعله في أفلامه وهو كافر إذا قدر الله له الإسلام فكأن أعماله التي قام بها قبل إسلامه لم تكن فالإسلام يذب ما قبله . ثم إني بصراحة أريد أن أسأل صاحب هذا الرد العجيب ألم يكن سيدنا عمر بن الخطاب كافرا ؟؟ ألم يقولوا لو أسلم حمار بن الخطاب ما أسلم عمر ؟؟ وها هو عمر بن الخطاب فاروق الأمة ورمز عدالتها .. لماذا نستبعد الهداية عن جاكي شان ولماذا نضمن ثباتها لأنفسنا ؟؟ لابد أولا من حمد الله تعالي علي نعمة الإسلام وثانيا ألا نسبتعد الهداية عن أحد الكفار بل ونتمناها له وإن أستطعنا لقمنا بعمرة وأثنين لجاكي شان لأن بهدايته سيهدي كثيرين فهو شخصية محبوبة حتي من الأطفال فأرجو التفكير في الأمر بروية أكثر .. اللهم أهدي جاكي شان للإسلام قولوا آمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124006/http://www.20at.com/article2.php?sid=549"

