text = "انا يا جماعه رأي من رأي اسلام انه ممكن يدعي زي ما رسولنا الكريم دعي وزي ماعودنا ندعي لمن علي غير دين الاسلام (الكفره) اللهم اهدي احيائهم واللعن امواتهم. بالدعاء فقط وليس بانفاق الاموال والوقت الا اذا كانت دعوه كتلك التي ينظمها ا/ عمرو خالد حاليا ان يذهبوا الي اوروبا ويناقشوا الشباب فهذه دعوه وليست دعاء.<br />ومن وجهة نظري اخي الحبيب ان تساهم بمالك هذا للشباب اما لتزويجهم او تزويج الفتيات اليتيمات واذا كنت تريد المساعده للوصول اليهم فلي الشرف ان اساعدك اذا كنت تريد.<br />ونفع الله بكم الاسلام وأعزه"
