author = "مارك"
posted = "2006-07-11"
text = "السيد المسيح قال ::تحب قريبك كنفسسك وعندما سألوه من هو قريبى قال لهم (( الذى يصنع رحمه))<br />والرسول الكريم قال : ليس فضل لعربى على عجمى الا بالتقوى<br />وهناك اجيال واجيال عاشت وماتت على الفطره قبل الأديان السماويه<br />فلو كان ذكى شان هذا ببوذيته يصنع رحمه واتقى منى ومنك ترى ما موقفنا امام الله انـــــــــا وانـــــــــــت<br />كفـــــــايه بقــــى"
