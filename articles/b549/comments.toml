author = "با اخي وش ها التفكير يعني بتجي من مصر \"يبدولي انت من مصر\" لسعودية وراحتزاحم المسلميتن وتضيق عليهمة علشان جيكي شان طيب جيكي وش فادك ايش قدملك ايش قدم لمصر ايش قدم للاسلام ."
posted = "2006-07-19"
text = "واعجبني رد واحد من الشياب قال\" المرء مع من احب\"<br />فتقي الله ولا تسمح لعقلاك ان يأخذك بعيداً.<br />وفكر بما فيه نفع لدينك و وطنك<br />اخوكم المبدع من السعوديه"
