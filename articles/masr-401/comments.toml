[[comments]]
order = 3
subject = "التغير لا يأتى من الخارج"
author = "طارق شطا ( المصرى)"
posted = "2006-09-06"
text = "ألاترى يا سيدتى الفاضلة غير النصف الخاوى, ألا توجد أى إجابيات إطلاقا؟<br />إن الله لا يغير ما بقوم حتى يغيرو ما بأنفسهم. فأولا بنا كمصرين أن نركز أولا على تغير جميع التشوهات و التراكمات الأخلاقية المكتسبة و المفروضةو التى كانت نتيجة لإفساد أخلاقييات أجيال كاملة بداء من جيل الثورة المباركة,<br />ما تدعى الية يا سيدتى هو ما عرف بالفوضى البنائة؟ مع تحفظى و رفضى الشديد لهذا المصطلح و الذى بالتأكيد سيؤدى الى خراب مصر.<br />أنا لا أعلم يا سيدتى هل أنت من العملين بالخارج ؟ و إن كنت فظلى كذلك و لا تعودى و دعيينانقوم بالتغيير فى الوقت و بالشكل المناسب فنحن لا نحدر تاريخيا يا سيدتى و لكن نتخلص من أعباء و جراح التاريخ.<br />و زى ما بنقول هنا اللى أيدة فى المية مش زى اللى أيدة فى النار.<br />فالتغير قادم أبيت او لم تأبى و لكن بطريقتنا و بعون اللة و ليس من الخارج.<br />برجاء الا تعممى تحليلاتك برغم جودتها.<br />سلام الله عليك<br />مواطن مصرى"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922154938/http://masr.20at.com:80/article.php?sid=401&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

