[[comments]]
order = 0
subject = "من أنت ؟"
author = "النهى"
posted = "2006-07-27"
text = "عزيزي القارئ إليك هذه الأسئلة وأجب عليها بتأني :<br />1- من خالقك ؟ ومن تعبد ؟<br />2- ما هو كتابك ؟<br />3- من هو رسولك ؟<br />4- من هو حبيبك ؟<br />5- من هم أعداءالله الذي ذكرهم في كتابك المنزل؟ وأعداء أنبيائه؟<br />6- من هم أقرب إليكم أيها المسلمون رحمة وكما تم ذكرهم في القرآن الكريم ؟<br />1- الله ، الله<br />2- القرآن<br />3- محمد صلى الله عليه وآله وسلم<br />4- محمد صلى الله عليه وسلم<br />5- اليهود<br />6- المسيحيون<br />إذا كانت جميع أجوبتك صح فابتسم فأنت مسلم !<br />هل عرفت مغزى هذه الأسئلة عزيزي القارئ ؟<br />الاسلام واحد شهادة أن لا الله إلا الله<br />محمد صلى الله عليه وآله سلم رسول الله<br />هل فهمت عزيزي القارئ ؟<br />اتحدوا أيها المسلمون ولا يحيدكم زارعوا الفتنة ومروجوها عن الحق فقط كلما شت ذهنك وأثارت التعاليق السخيفة حفيظتك وجعلتك تفكر أنك سني أو شيعي 0<br />فاذهب إلى تلك الأسئلة وجاوب عليها لتعلم أنك مسلم فابتسم00!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123315/http://www.20at.com/article2.php?sid=1103"

[[comments]]
order = 1
subject = "التفكير في مسألة التكفير"
author = "أحمد البدري"
posted = "2006-07-27"
text = "بسم الله الرحمن الرحيم والصلاة والسلام على اشرف المرسلين أما بعد فإن فتنة التكفير هذه من أشد الفتن فتكا بالمسلمين وهي تطبيق عملي لقاعدة فرق تسد, ومن ينادي بالتكفير واقع في براثن أعداء الاسلام غير مقتد بسنة النبي صلى الله عليه وسلم لأننا لدينا مثالين عظيمين جدا الاول هو المنافقون الذين كانوا في المدينة لم يشر النبي اليهم ولا مرة بالمشركين ولا الكفرة والثاني كان في المرتدين الذين منعوا الزكاة وهي ركن اصيل من اركان الاسلام ولم نسمع ان حربهم سميت بجهاد المشركين او الكافرين هذا وقد كان النبي قد نفى نفيا قاطعا أن يعود الكفر او الشرك بين المسلمين مرة اخرى فقد قلا (ص) في حجة الوداع : إن الشيطان قد يأس أن يعبد بأرضكم أبدا ولكنه يرضى لما تحقرون من أعمالكم (البخاري) كما أورد أبو داوود في مسنده قول النبي (ص): أخاف على أمتي من بعدي الشرك, قالوا :أتشرك أمتك من بعدك يا رسول الله؟ قال: أما أنهم لا يعبدون شمسا ولا قمرا ولا وثنا ولا صنما ولا نجما ولكن يراؤن بأعمالهم. فلا سلطة إذن لأحد للوصاية على قلوب الناس, وأما ما يستند التكفيريون إليه من آيات أنزلت في الكفرة والمشركين فلا يجوز تأويلها في المسلمين كما قال ابن عباس ناسبا هذه الصفة للخوارج,كما أن حديث تفرق الامة الموجود في صحيح البخاري لم ينص على الكفر الفرق وانما روايته التي ذكرها البرقاني, وعلى كل تفرق اليهود استدعى ارسال الانبياء والمرسلين اليهم وتفرق النصارى استدعى رسالة النبي (ص) فتفرق الامة يكون من علامات الساعة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123315/http://www.20at.com/article2.php?sid=1103"

