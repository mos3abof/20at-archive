subject = "حاخامات السلطان"
author = "خالدالحربي"
posted = "2006-08-04"
text = "لقد افتى الحاخام بن جبرين بمناصرة اليهود عندما شعر بقرب هلاكهم على يد اخواننا المسلمين الشيعه في لبنان وهولايعلم ان بعض المجاهدين في حزب الله من اهل السنه وانهم اخوه لاتفرقهم الطائفيه العمياء والحقد الدفين عند الوهابيه الذين يكفرون جميع المسلمين بدون استثناء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123315/http://www.20at.com/article2.php?sid=1103"
