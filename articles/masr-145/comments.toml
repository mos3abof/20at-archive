subject = "دي كارثة"
author = "meto"
posted = "2006-07-12"
text = "الحكومة ناويه بعد كده تلغي 10 و 5 قروش وما يبقاش فاضل غير 25 قرش المعدني اقل عملة متداولة وهنكون زي بتوع الخليخ وده هيكون قدام شوية بعد الناس ما تزهق من الجنية المعدني"
archived = "2006-09-08"
