[[comments]]
order = 0
subject = "تطور طبيعي مش تهزيق"
author = "نسرين"
posted = "2006-04-11"
text = "أين التهزيق في تحويل الجنيه إلى عملة معدنية؟ هذا أفضل من العملة الورقية ويطيل من عمر النقود. وهذا التطور يحدث في كل البلاد. مثلا في انجلترا حولوا الجنبه إلى عملة معدنية من فترة طويلة، وهو قيمته أكثر من الجنيه المصري.<br />لا يجب أن ننظر إلى أي تغيير بنظرة سلبية ولكن بنظرة موضوعية"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908171853/http://masr.20at.com:80/article.php?sid=145&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "المهم نلاقيه"
author = "نيفين"
posted = "2006-04-12"
text = "اكيد مش مشكله اوى<br />يصغروه يكبروه يحولوه يعوموه<br />الشعب مش هيهتم بكدا<br />الشعب بتهتم انها تلاقى الجنيه اصلا"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908171853/http://masr.20at.com:80/article.php?sid=145&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

