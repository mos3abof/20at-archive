subject = "هل هذه هى تعليمكم؟"
author = "قبطية"
posted = "2007-01-25"
text = "اخوتى الاحباء اللذين لاتعرفون المحبة واللذين لقبوا البابا بالقرد والجحش لماذا تسمحون لانفسكم ان تشتموه وتلقبوه بهذا الشكل المقذذ واذا لقب احدا رسولكم باى لفظ تتعفرتون وتحتجون فهل حلال عليكم الشتيمة بهذا الشكل الفاضح لكم وحرام على الدينمرك وبابا الفاتيكان اى حرية نعبير ؟ فماذا نسمى ما تفعلوه الان ؟سهل جدا ان اشتم وسهل جدا ان اهلهل دينكم ومعتقداتكم ولكن علمنى دينى ان احب اعدائى وابارك لاعنى واصلى من اجل اللذين يسىئون الى ولكن انتم يا مساكين اللذين تطاولتم على البابا ماذا تعلمتم من دينكم ؟ ربى اشكرك من اعماق قلبى كل يوم بل كل حياتى انك جعلتنى مسيحية للاتمتع بتلك الصفات وتلك التعاليم السامية وهنيئا لكم ايها المتطاولون لسانكم الطويل فهل الجنة بتلم اصحاب اللسان الطويل والشتامين وقساة القلوب"
archived = "2007-01-28"
