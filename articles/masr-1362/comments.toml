[[comments]]
order = 28
subject = "ارفعوا أيديكم عن الرموز الدينيه"
author = "مستشار مصطفي عبد الخالق"
posted = "2007-01-16"
text = "اخواني أهل مصر الأعزاء - أناشدكم الله أن ترفعوا أيديكم عن الرموز الدينيه خاصة في مصر - البابا - أو الشيخ - أو غيرهم من رموز الدين يجب ألا يكون عرضه للاستهزاء والسخريه- ولا تفهموا الديموقراطيه بطريقتكم الخاطئه فلو أن الأمر بيدي لحاكمتكم محاكمة القذف والسب العلني ، أناشدمسئولي الأمن بالبلاد أغلاق هذا الموقع الفاسد والذي يقال له - ولاد البلد - لاساءته التي قد تتحول الي فتنة طائفيه لا يحمد عقباها فيما بعد - انتبهوا يا أولوا الألباب .. مع احترامي للبابا وأهل الاديان والقائمين عليها في مصر الحبيبه"
archived = "2007-01-16"
capture_url = "https://web.archive.org/web/20070116161556/http://masr.20at.com:80/article.php?sid=1362"

