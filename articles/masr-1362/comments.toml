[[comments]]
order = 48
subject = "شيخ الازهر يصف"
author = "سوسن"
posted = "2007-01-26"
text = "اللي مش مصدق يكتب في جوجل شيخ الازهر يصف المسلمين بالرعاع الكلام ده جه في جريدة الشرق الاوسط<br />شيخ الأزهر يصف الأمة الإسلامية بـ«الرعاع» و«المنافقين المبتزين»<br />القاهرة: ابراهيم منصور<br />شن الدكتور محمد سيد طنطاوي شيخ الأزهر هجوماً لاذعا على النظام العراقي المخلوع، والجامعة العربية ووصف الأمة الاسلامية بأنها امة «رعاع». وقال في الجلسة الافتتاحية للمؤتمر الخامس عشر للمجلس الأعلى للشؤون الاسلامية الذي يشارك فيه علماء ومفكرون من 70 دولة اسلامية، ان الامة الاسلامية فشلت في الاتفاق على ادانة الغزو العراقي للكويت عام 1990 ورفض الظلم. وانتقد الجامعة العربية قائلا: «كان عليها أن تبعد هذا النظام (نظام صدام حسين) ولكن هناك من أيده، ومن قال.. أنا مالي». وأبدى اسفه في «ان تتحول الأمة إلى منافقين ومبتزين لاعتبارات سياسية».<br />ودافع طنطاوي عن موقفه وانتقاده للأمة الاسلامية قائلاً: «نحن لا ندافع عن الكويت لأننا نريد منها مالاً.. أو لأنني متزوج من كويتية، وانما هي كلمة حق». وهاجم النظام العراقي المخلوع قائلا: «وزير الاعلام في النظام السابق (لم يذكره بالاسم) كان يخرج بألفاظ غريبة من القواميس ينعت بها الآخرين (ربما في اشارة إلى لفظة العلوج التي كان يرددها يومياً محمد سعيد الصحاف). وأضاف أنه «كان يتحدث (الصحاف) بكلام عن التدمير والقوة إلا أنه اختفى فجأة في ملابس أخرى». وعاد شيخ الأزهر يتساءل «هل تكون هذه أمة اسلامية».. وأجاب: «هذه أمة رعاع». وقد سرت في القاعة التي ضمت وفود أكثر من 70 دولة همهمات استهجان ازاء ما تحدث به شيخ الأزهر."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103056/http://masr.20at.com:80/article.php?sid=1362"
