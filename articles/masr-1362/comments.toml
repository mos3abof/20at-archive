[[comments]]
order = 14
subject = "هانى الاعصر راح فى داهيه"
author = "ايمن امام"
posted = "2006-12-27"
text = "ل سنه وانتاطيب ياهانى - ونيجى نزورك فى جوانتانامو- الاخوه الاقباط ها يعتبروا الكلام دا سخريه من البابا - وها يبلغوا ضدك الحاكم العسكرى لقطاع القاهره وها تروح لاظوغلى هاتروح لاظوغلى - وها تطلع على الشجره هاتطلع على الشجره- وطبعا سيكون هناك ممثل عن الfbiوبابا الفاتيكان- وها تطاع تبع تنظيم شيبسى يتحدى الجميع - ياهانى انا متأكد انه مش ها يعدى الموضوع دا بخير عليك - فليس من حقك مهما كنت حسن النيه ان تنقل هذا الكلام ولو كان فى - شريط كاسيت كما تدعى لانك تفتح النار على الجميع - ام انك تعمل دعايه للشريط - بكره فى امريكا يطلع متحدث باسم الخارجيه الامريكيه- ويعلن نبأ القبض على بن الاعصر - وانه تم تحويله الى جوانتانامو - او جوانتا صحيو- اهى جوانتا وخلاص - لم اضحك ولكنى تأملت وتألمت لمقالك - بكره يقولو ان الاخوان المسلمين هما اللى ذقينك على ابوهم شنوده - ويطلع حمدى رزق يكتب منشور من اياهم - يقول فيه الى السيد الرئيس/ لااعلم لماذا تصبر على بن الاعصر وهو يعمل لحساب الاخوان فقد جائتنى رساله على الموبايل تقول - انا فله القله وها اسيب مصر لان هاتى بن الاعصر الارهابى - عدو التنوير يتهكم على البابا - ويقوم بتحريض الريس -قائلا ياريس دول لو سابو البلد - السياحه هاتضيع والدولار ها يختفى والغرب هايزعل منك وشوف بقى لما الغرب يزعل من رئيس - وسيواصل حمدى رزق مقالته قائلا لا يا ريس مش انتا اللى تعمل كده ابدا ابدا - تزعل منك الغرب - ياريس ارضاء للغرب وللبابا بتاع الفاتيكان - الغى الشريعه الاسلاميه وكمان الغى الجوامع عشان تتقدم مصر وبلاش الجوامع والزوايا نحولها الى مساكن تحل ازمه الاسكان / فى اشاعه بتقول ان حمدى رزق راح يعمل عمره اليومين دول مش عارف الكلام دا صح ولاغلط - حاولت اعرف هو سافر على انهى دوله<br />اقرأ بقية التعليق .."
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224338/http://masr.20at.com:80/article.php?sid=1362"

