subject = "حاجة غريبة"
author = "بسمة"
posted = "2007-01-17"
text = "انا مش عارفة ليه كل ما حد قبطي يكتب ا يتكلم عن اى موضوع يخص الاقباط او الكنيسة يتدخل البعض منا المسلمون بتعليقات ما لهاش لازمة وبعدين ده رجل له مكانته وبالنسبه لهم رمز وبيحبوة ويحترموه احنا مالنا والا احنا لازم نحشر نفسنا في كل حاجة و نعمل مشاكل و نبقي كده بنحقق للمتطرفين من الجانبين هدفهم ياريت نحترم كل منا عقيدة الاخر و نكون عندنا لغة حوار متحضرة اما اللى بيلجاوا للشتيمة والسباب فهم ضعاف الحجة فاكرين ان اسلوب الشتيمة فوز وانتصار مع انه في الحقيقة دليل هزيمة وخيبة و جهل"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117211953/http://masr.20at.com:80/article.php?sid=1362"

