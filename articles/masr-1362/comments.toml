subject = "حب البابا"
author = "ان قداسه البابا هو رجل يجمع الكثير من الصفات الجميله التى تجعل اى شخص يحبه"
posted = "2006-12-27"
text = "1-حكمته وقيادته الحكيمه للكنيسه<br />2-لباقته وفصاحته فى اللغه العربيه و الانجليزيه<br />3-وطنيته وحبه لمصر ومن اقواله ان مصر وطنا يعيش فينا قبل ان نعيش فيه<br />4-خفه دمه وبشاشته<br />5-قدرته بل وبراعته فى الكتابه والوعظ فكل كتبه تحببك فى الله وهو ماجعله يحصل على لقب احسن واعظ فى السنه الماضيه<br />6-جراءته وشجاعته<br />7-حتى عندما ينقد فنقده يكون موضوعى وبناء<br />وهذه الصفات اذا توافرت فى رجل دين فلابد ان يكون محبوبا"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224338/http://masr.20at.com:80/article.php?sid=1362"

