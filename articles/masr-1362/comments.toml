text = "اقدم كل اعتزارى لابى وسيدى ومعلمى وقدوتى رغم انف الحاقدين الذين اثبتوا بجدارة عن مكنون نفوسهم الضعيفة عما بدر منهم فى حق قداستك وكانهم ماصدقوا ربنا ينور بصيرتهم وقلوبهم يكفيك ياسيدنا اننا نحبك جدا لانك صورة الله على الارض وهده هى عقيدتنا فيك رغم انف الكارهين لك واقول لكل الحاقدين الضعفاء ان لم يعجبكوا الموضوع فاكرم لكم ولعقيدتكم هو عدم تعليقكم اليست هذه هى الحكمة التى لاتعرفونها وتتهكمون عليها ؟"
