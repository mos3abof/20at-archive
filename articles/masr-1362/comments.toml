[[comments]]
order = 34
subject = "قلة أدب"
author = "معاذ محمود عامر"
posted = "2007-01-18"
text = "بصراحة الناس اللي بتسخر من العقيدة المسيحية دي ناس قليلة الأدب وييجوا بعد كده لما الدنمارك تنشر رسوم يقولوا احترام عقائد الآخرين والمقدسات ومش عارف إيه<br />يعني ازدواجية وحماقة غريبة<br />وبعدين يا أخ يا مسلم انت هو دي مش اخلاق مسلمين انتوا ناسيين ما روي عن الرسول أنه قام لجنازة مارة فقال له أصحابه إنها ليهودي فقال أليس إنسانا؟<br />وللا واضح غن انتوا أساسا حمقى وجهلة ومسمعتوش حاجة عن الحديث ده لأنكم تستقون ثقافتكم الدينية من شرائط الكاسيت وليس من الإسلام الحقيقي<br />وبعدين خلينا نكون منطقيين أي حد عايز يسخر من عقائد الآخرين هيلاقي ثغرة يسخر منها<br />اعقلوا بقى جتكوا نيلة"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235541/http://masr.20at.com:80/article.php?sid=1362"

