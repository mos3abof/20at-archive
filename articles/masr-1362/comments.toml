subject = "من آذى ذميا"
author = "فاعل خير"
posted = "2007-01-20"
text = "أنا والله العظيم حزين من اللي باقرأه من الناس اللي بتودي نفسها في داهية مع ربنا بكلامها اللي مش مسئول قال رسول الله في الحديث لما سئل أومؤاخذون نحن بما نقول يا رسول الله , قال \"وهل يكب الناس على وجوههم أو مناخيرهم في النار إلا حصائد ألسنتهم\". و أذكر أنه هو صلى الله عليه و سلم القائل \" من آذى ذميا فقد آذاني\"<br />و قال تعال \" ولا تسبوا الذين يدعون من دون الله فيسبوا الله عدوا بغير علم \" الانعام 108<br />فمن كان فعلا غيورا على دينه الإسلامي فيتبع تعاليمه الرشيدة الحكيمة التي تكفل للناس حرية العقيدة \" لكم دينكم ولي دين\" \" فمن شاء فليؤمن ومن شاء فليكفر\" \" لا إكراه في الدين\"<br />كما أن من تعاليم الإسلام، دين احترام الناس ، قول نبينا \"أنزلوا الناس منازلهم\" فحينما أرسل إلى الملوك و الأباطرة خاطبهم بألقابهم المتعارف عليها في قومهم ما لم يخالف ذلك شئ من أصول العقيدة فكاتب المقوقس قائلا \"عظيم القبط\"<br />فلا تحجروا على عقائد الناس و لكن إذا كنتم غيورين حقا فتعلموا دينكم حتى تكونوا مسلمين حقيقيين تحملون لواء الدعوة الصحيحةحتى يستفيد منكم الناس أجمعين و اعلمو أن ذلك السباب و الشتم هو معصية لله و اعلموا أن الله هو القائل \"لا ينهاكم الله عن الذين لم يقاتلوكم في اليدن أن تبروهم و تقسطوا إليهم\" و الشتم من الظلم و ليس من القسط.<br />و اعلموا أن هدف المسلمين هو أن يدخلوا الجنة برضى الله وأن يأخذوا الناس معهم إليها بأن يدعون إلى دين الله بالحكمة و الموعظة الحسنة فكو نوا مبشرين و لا تكونو منفرين.<br />هدانا الله و إياكم لما فيه صلاح أنفسنا<br />اللهم اهدنا و اهد بنا و اجعلنا سببا لمن اهتدى.<br />سبحانك اللهم و بحمدك ، أشهد أن لا إله إلا أنت أستغفرك وأتوب إليك"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235541/http://masr.20at.com:80/article.php?sid=1362"

[[comments]]
order = 40
subject = "بابا ابح"
author = "نانى"
posted = "2007-01-21"
text = "ياعم روح انتا وبابا نويل بتاعك ده انا شايفه الموضوع رخم زيك وقلبلي بطني وانا مش عارفه ايه المطلوب اضحك يعني طب هاهاها حالا هنزل اشتري كيلو زغزغه من تحت قال ابن نكته وبعدين انا مال اهلي بابوك ده يلعن ابوك ياشيخ انت احسن حاجه غنيلو بابا ابح<br />اسمعو النكته دي واحد مسلم ساكن فوقه واحد مسيحي فابو المسيحي مات (قولو يارب)فالمسلم طلع عزاه وشغله اغنيه بابا فين. وكمان البابا بتاعهم دا مبيعرفش يقول كلمتين ع بعض كسبنا صلاه النبي لما يطلع يقولي نكت بيعقد يهجس والامبرريا في الامبره ويقولك ابن نكته ده اللي هما فالحين فيه دي هيفا بتعرف تتكلم احسن منو وايه اسماء الملايكه اللي بيقولي عليها دي ياعم اجري بقى كفاياكو تخريف وتخبيط دا انتو اللي يسمعكو في الكنيسه وانتو بتتكلمو يفطس ع نفسو مالضحك دا العيل اللي مكملش سنتين ميصدقش كلامكو بنكله قال البابا ولا يسوى جحش في سوق الحمير"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235541/http://masr.20at.com:80/article.php?sid=1362"

[[comments]]
order = 41
subject = "جايين توقعو بينا ياولا ال.......البابا"
author = "نانى"
posted = "2007-01-21"
text = "اول حاجه لو كان اللي كاتب ده مسيحي يبقى جاي يعمل فتنه والا ايه اللي هيخليه يدخل ع موقع كله مسلمين ولو كان مسلم يبقى عايز حد يطلع روح امو انهارده او حد مابجه وابجني تجدني وبعدين روح اتكلم ع البابا عند ناس مسيحين ولا دي دعوه تبشيريه ولا فاكر نفسك يابن الكلب ياحمار في كنيسه وانامتاكده ان ده مسيحي ميه في الميه وابن كلب ال البابا اول الجحش الحمار البغل الكبه الرخم ابو دم تقيل اللي ميجيش مسمار في جزمتي روح بقى عشان انا لو شفتك هطلع روح امك انت والبابا شحطوطه يلا يابن الكلب من هنا انتا والقرد اللي جايب صورتو دا والله هرجه اقولك ياجماعه عايزينو يمشي<br />يلا معايا صلو ع النبي هههههههههههههه<br />تلاقيه خلع دلوقت"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235541/http://masr.20at.com:80/article.php?sid=1362"

[[comments]]
order = 42
subject = "لا للفقر..لاللبطالة..لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-01-21"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو الوسيلة الوحيدة للتوظيف<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />من الاخر ياناس ده قانون ظالم وسيهدم اركان المجتمع الذي يقوم علي الاستقرار الي مجتمع يقوم علي التعاقد المؤقت, والسكن المؤقت,والطعام المؤقت ثم الي الشارع انت واسرتك ايه الموظف المسكين"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235541/http://masr.20at.com:80/article.php?sid=1362"

[[comments]]
order = 43
subject = "اتقوا الله يامسلمين"
author = "هيثم الذيادى"
posted = "2007-01-22"
text = "بسم الله الرحمن الرحيم<br />انا ياجماعة ليا تعليق بسيط على اخوانى المسلمين<br />فى ناس بتتريق على الاقباط ولاحظت ان فى ناس شتمتهم<br />بصوا ياجماعة اذا كان فى وجهة نظر عاوزين تقولوها للاقباط يبقى تتقال باحتارم<br />وبعدين ربنا سبحانه وتعالى نهانا عن سب غير المسلمين لانهم هيردوا ويشتموا ديننا وفى الحالة دى احنا اللى بنشيل الاثم<br />فياريت بلاش شتايم<br />غير كدة احنا دين السماحة والاخلاق والرحمة بالناس وليس بالمسلمين فقط<br />فبلاش نبوظ صورة الاسلام اكتر ما اعداء الاسلام بوظوها<br />اما كلمتى لاخوانى فى الانسانيه اللى هما الاقباط وغيرهم من غير المسلمين<br />ياجماعة مش معنى ان واحد مسلم اتصرف وحش ودخل شتمكم يبقى الاسلام هو اللى كدة<br />لا<br />زى مافى وحش عندكم فى وحش عندنا<br />انا بقولكم كدة وبستسمحكم اهه عشان محدش يشتم الاسلام<br />حافظوا على مشاعر غيركم عشان نحافظ على مشاعركم-وده مش تهديد ياجماعة- بس احنا مش هنقبل حاجة زى دى<br />واحد شتمكم ردوا عليه هو مش علينا احنا احنا مالناش دعوة<br />وجزا الله من ابتغى رضوانه خيرا وهدانا جميعا<br />سلام"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235541/http://masr.20at.com:80/article.php?sid=1362"

