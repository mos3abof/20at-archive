[[comments]]
order = 30
subject = "المفروض عقولنا أكبر من كده .."
author = "الـواد الإخوانجى"
posted = "2007-01-17"
text = "السلام عليكم إخوانى فى الله المسلمين .. و أهلا بإخوانى فى الإنسانية الأقباط .. و لو فى حد غيرهم حتى .. مش مشكلة .. اهلا بيه برضو !<br />أنا حابب أقول رأيي عشان بس أنا شايف فى كده لغط كتيييييييييييير أثير فى الموضوع ده ...<br />يا جماااااااعة ..<br />تعليقاتكو كلها كانت كأنما الموضوع بيتكلم عن أحد النقط التالية ..<br />1- تقديس البابا..صح أم خطأ<br />2- عقيدة الكنيسة<br />3- البابا و السياسة<br />4- افتنة الطائفية ىف مصر<br />5- التوجهات التناحرة فى الكنيسة المصرية<br />إييييييه يا عم !!!!!<br />الراجل المحرر بيتكلم عن شخصية عامة مصرية .. مش أكتر !!!<br />و كل الفكرة إنه بدل نموذج رجل الدين الراسى أو المتصلب أحيانا ... هو رجل دمع خفيف ...<br />و أنا رغم إنى من الإخوان أهو يا عم .. قريت الموضوع .. و عاجبنى جدا .. و كمان ضحكت على قفشات البابا .. عادى خالص يا جماعة ..<br />يعنى ماهو الناس بتتفرج على friends و بيضحكو عليه .. اشمعنى يعنى قابلين الضحكة من الأجانب و مش قابلينها من المصرى !!!!!<br />لذا أكرر .. الموضوع مالوش دعوة لا بالعقيدة و لا بالسياسة و لا بأى بتنجان ....<br />شخصية عامة .. دمها خفيف ... و بس !!!!!<br />ما تدوش الموضوع صبغة غير اللى هو معمول عشانها.<br />طبعا لا داعى لذكر الأسلوب المحزن و الألفاظ النابية اللى استخدمها بعض الناس هنا - هداهم الله - فى التعبير عن مكنون أنفسهم<br />يا جماعة ... إحنا لو عايزين فعلا نهضة لبلادنا يبقى ما ننساش ...<br />\" إنما الأمم الأخلاق ما بقيت *** فإن هم ذهبت أخلاقهم ذهبوا \"<br />و عنصر الأخلاق ده مافيش دين أو مذهب أو توجه بيختلف عليه<br />فـــــأرجو من الإخوة اللى عبرو بشكل ما يرضيش ربنا يراجعو نفسهم .. و جزاكم الله خيرا !!!"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117211953/http://masr.20at.com:80/article.php?sid=1362"

[[comments]]
