posted = "2007-01-14"
text = "أنا استغربت لما قريت العنوان لإني حسيت إن فيه تهكم على شخصية البابا شنودة ( و هذا لقبه محدش ييجي يقوللي ماتقولش عليه بابا ) و عامة أنا أرفض السخرية من الرموز الدينية احتراما لمشاعر الجميع .<br />و نفسي التعليقات تبقى منطقية مش الناس تخش تشتم و خلاص .. إيه دخل الاسلام و المسيحية و اليهودية في الموضوع .. و كل واحد يخش يكفر التاني .. ربنا يهدي الجميع ونفهم بقى"
