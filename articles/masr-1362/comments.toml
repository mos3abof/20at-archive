[[comments]]
order = 3
subject = "هو ايه المناسبة !"
author = "شريف الدواخلى"
posted = "2006-12-27"
text = "أولاً : أنا مش معاك خالص ياعم هانى فى اضافة قداسته ... أمال علمانية ايه بس ياحج \" لا قداسات لاحد سوى الانبياء \" وطبعا انا مش مع اضافة سماحة قبل ذكر شيخ الازهر \" هو شيخ الازهر طنطاوى \" والبابا شنودة . على طول<br />ثانيا : قالوننا فى كل الحتت اللى اشغلنا فيها لازم يكون هناك مناسبة لاى موضوع .. الموضوع ده ايه مناسبته \" يعنى هو بقى دمه خفيف دلوقتى بس \" الموضوع علاقات عامة قوى يا اعصر \" وحتى لو كده انا ايه المعلومة اللى استفدتها من قراءة موضوع بيقول ان البابا خفيف الظل \" فين الحدث يا هانى .. فين الصراع فى الموضوع \" !<br />ثالثا : الموضوع كله ارشيفى يا هانى فين الشغل بتاعك .. ليه مخدش رأى حد نفسى يحلل الموضوع ده وقيمة ان يكون راس الكنيسة حد دمه خفيف .. والاهم من ده كله انك مخدتش رأى أكتر من حد من جوه الكنيسة ومن براها يؤكدلك الكلام اللى انتا افترضه مع انى عندى مواقف قد اللى انتى كتبتها مرتين بتقول انه حد ناشف جدا وحاد للغاية وكفاية موقفه من ابناء الكنيسة العلمانيين يا عم هانى ولا أيه .. كفاية انه وصفهم بانهم خارجون عن الكنيسة \" ولو بقلبه \" ومش رضى يقابلهم وحتى مقابله الانبا موسى كانت \" كأن لم تكن \" ولو ان العلمانيون طبوا منى عدم نشر تفاصيل المقابلة كنت نشرتها ! عشان عندهم لسه أمل .. المهم ماعلينا .. انتا بقى شفت الموضوع من زاوية واحدة وهى حبك للبابا وكنت حابب تخلى كل الناس تحبه \" حاجة جميلة انك تحب رمزك الدينى .. بعكسنا مثلاً انا لا احب شيخ الازهر ولا احترم ارائه \" بس الغلط بقى انك تزين الصورة أكتر من اللازم امال سبت ايه للى شغالين فى الكنيسة ووواخدين الصحافة تسلية عشان الكنيسة ترضى عنهم \" وانتا قارينى بقى \"<br />رابعا : انا مش الغرض من تعليقى انى اشردلك الموضوع خالص .. احنا زمايل ووانتا<br />اقرأ بقية التعليق .."
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224338/http://masr.20at.com:80/article.php?sid=1362"

