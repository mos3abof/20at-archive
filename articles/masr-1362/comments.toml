posted = "2007-01-12"
text = "البابا شنوده الثالث لك كل الحب والاحترام والتقدير من اعماق قلبى وتمنياتى لك بسنين طويلة وزمنه سالمة مديدة انا من الناس الذى عرفو طريق التوبه والمحبه والتسامح مع الاخر والفضل لقداستةعلى فكرة لم اجد كلام حلو اكتبة هدية اكثر ماء كتب وقال عنة كل معانى التعبير الحلوة اتقالت للبابا لم اجد شى غير انى اقولة انى احبك اعظم حب بعد حب رب المجد ربنا يسوع المسيح ثم انت يا سيدنادامك اللة للجميع"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112163332/http://masr.20at.com:80/article.php?sid=1362"

[[comments]]
