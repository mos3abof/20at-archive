text = "جزاك الله كل خير<br />كلامك مظبوط بس عاوز اصححلك حاجة<br />الاية الكريمة بتقول<br />\"\"لا ينهاكم الله عن الذين لم يقاتلوكم في الدين أن تبروهم و تقسطوا إليهم\"\"<br />والحديث بيقول \"من اذى ذميا فانا خصيمه الى يوم الدين \" والله اعلم<br />شكرا"
