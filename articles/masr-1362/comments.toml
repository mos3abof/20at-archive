[[comments]]
order = 36
subject = "واللهى البابا طلع ابن نكتة صحيح"
author = "مصرية \"مسلمة\""
posted = "2007-01-19"
text = "على فكرة الموضوع حلو والبابا طلع ابن نكتة ودمه خفيف وبعدين احنا كلنا مصريين مسلم او قبطى هنفضل مصريين وزى ما قال الواد الاخوانجى انى الموضوع بيتكلم عن شخصية عامة ودمها خفيف وشخصية بتحب الضحك ودة مش غريب علينا كمصريين اننا اصلا شعب ابن نكتة وبنحب الضحك وكمان كل اللى بيشتم فى المسلمين والمسحيين علشان يعملوا فتنة عايزة اقولوهم خليكم متغاظيين لانى المسلمين والاقباط فى مصر هيفضلوا اخوات وهنفضل يد واحدة ضد مبارك وضد اسرائيل وامريكا وضد اى خاين وعلى فكرة محدش ينسى انى الرسول عليه الصلاة والسلام وصانا على اخونا الاقباط.<br />موسى نبى وعيسى نبى ومحمد نبى وكل من ليه نبى يصلى عليه"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235541/http://masr.20at.com:80/article.php?sid=1362"

[[comments]]
order = 37
subject = "الناس بدأت تفهم !"
author = "أحمد رحال"
posted = "2007-01-19"
text = "و الله كويس إن أسلوب الرد بدأ يتحول شوية لإتجاه إيجابي .. أنا بحس إن اللي بيرد يشتم ده مش مصري أصلا .. ماحنا طول عمرنا مسلمين و مسيحيين و الله عايشين كلنا مع بعض زي بعض .. و نغمة اللعب على أوتار الفتنة الطائفية دي لا يمكن يكون بيشعللها واحد بيحب مصر .. المسيحيين شعارهم المحبة و المسلمين شعارهم السلام .. هييجي منين الخلاف ؟<br />بالنسبة للموضوع نفسه بقى فهو مكتوب بطريقة كويسة .. بس زي ما قولنا مش طالبة ندي مساحة للناس المخربة اللي مش عارف جايين منين و يدخلو يشتما و يجروا .. سواء اللي بيشتم ده مسلم ولا مسيحي فهي إهانة للإتنين , مش كدة برده ؟"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235541/http://masr.20at.com:80/article.php?sid=1362"

[[comments]]
order = 38
subject = "لا للفقر..لاللبطالة..لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-01-20"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو السيلة الوحيدة للتوظيف<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />من الاخر ياناس ده قانون ظالم وسيهدم اركان المجتمع الذي يقوم علي الاستقرار الي مجتمع يقوم علي التعاقد المؤقت ثم الي الشارع انت واسرتك ايها الموظف المسكين."
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235541/http://masr.20at.com:80/article.php?sid=1362"

