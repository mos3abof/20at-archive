[[comments]]
order = 45
subject = "قبطي"
author = "مايكل صفوت"
posted = "2007-01-22"
text = "أولا أنا احترم المسلمين المحترمين و احترم اختيارهم للأسلام ( بالرغم أنة لا يوجد أحد فينا أختار دينه ) ولكن هل يرضي الله أن نسب ونهان بهذا الشكل المبالغ فيه ، و يهان قداسة البابا شنودة و الذي يمثل عندنا مكانة رفيعه وقداسة عالية المستوي و في النهاية المطلوب منا أن نسكت و نتسامح وإلا تعلن الحرب علينا لأننا شتمنا من شتمنا فهل هذا من العدل في شئ ؟<br />أنا سعيد لأن هناك مسلمين مازالوا يدركون أننا أهل و أصحاب و شركاء في الحياة و لكن أعزائي المسلمين أتمني أن تلتمثوا العذر لمن يشتم المسلمين أو يبالغ و يسب الين لأنة متخيل أنة يرد حقه و خاصة أن القداسة التي يحتلها البابا لا تتجزأ عن الدين<br />أخيرا أترفع عن الشتيمة سواء لمن أهانوا البابا أو المسيحين أو المسيحية وذلك لأني مسيحي و ديني دعاني لمغفرة الأساءة لأعدائي<br />مابالكم أنكم أخواتي و جيراني و أصحابي<br />وأعتذر عن الإطالة"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235541/http://masr.20at.com:80/article.php?sid=1362"

