[[comments]]
order = 18
subject = "تحذير"
author = "العلمانيين الجدد"
posted = "2006-12-28"
text = "مناشدة<br />من جبهة العلمانيين الجدد<br />إلى جميع الشعب القبطى الأرثوذكسى المحب لكنيسته والغيور على قيادته الكنسية وبخاصة القديس البابا شنودة الثالث، تناشدكم جبهة العلمانيين الجدد للمشاركة الفعالة معنا.<br />وكما ذكرنا فى البيان الأول الذى أرسلناه أمس، فنحن مجموعة عادية من الأفراد العلمانيين الغيورين والمحبين لكنيستنا القبطية الأرثوذكسية، وقد لاحظنا أخيراً تعرض كنيستنا الى هجوم ومؤامرة داخلية يقودها مجموعة من الأفراد المطرودين والمطاريد، الذين فشلوا فى ايجاد مكان لهم داخل الكنيسة بسبب خطاياهم الكثيرة، فقرروا محاربة الكنيسة من الداخل، وخرج منهم المدعو مكس ميشيل ثم جاء استاذه كمال زاخر ومجموعته المطاريد بتنظيم المؤتمر الفاشل المسمى بمؤتمر الاشكاليات الكنسية، ومن بدء المؤتمر لم يهدأ الهجوم على قداسة البابا ولا على نيافة الانبا بيشوى سكرتير المجمع المقدس.<br />ولغيرتنا على كنيستنا تكونت مجموعتنا من أفراد قلائل فى البداية، ولكن وفى ظرف أيام قليلة إنضم الينا الكثير والكثير من أبناء الكنيسة، وهدفنا الوحيد هو الدفاع عن الكنيسة ضد هذه الهجمة المسعورة، ومساندة قيادات الكنيسة وبخاصة آبائنا المحبوبين قداسة البابا ونيافة الأنبا بيشوى. كما نهدف ان نبين للرأى العام أن العلمانيين فى كنيستنا مازالوا مخلصين لكنيستهم، وليسوا كلهم خونة مثل كمال زاخر وهانى لبيب وأكرم رفعت.<br />لذلك نناشد كل الأقباط من العلمانيين أن ينضموا الينا، ونحن الآن بصدد توجيه بيان مساندة الى الكنيسة والى قداسة البابا والى المجمع المقدس، سنعلن فى هذا البيان أننا نؤيد قداسة البابا ونرفض هذا المؤتمر المشبوه وندينه.<br />كيف يمكنك المساعدة؟<br />يمكنك المساعد بطرق سهلة وبسيطة وهى<br />1 - أن ترسل الينا بياناتك الشخصية (الاسم والوظيفة والبريد الالكترون<br />اقرأ بقية التعليق .."
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224338/http://masr.20at.com:80/article.php?sid=1362"

