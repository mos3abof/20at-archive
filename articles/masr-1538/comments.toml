subject = "فعلا ماتوا فى الحرب"
author = "فارس_fr"
posted = "2007-02-05"
text = "فعلا يارئيس التحرير الرجالةماتت فى الحرب , معدش فيه نخوة ولا رجولة,, وبالنسبة لكلاب الشرطة وقواد الدولة اكيد نهايتهم قربت مع كل الانتهاكات دى . مااعتقدش ان الشعب هيفضل جبان كده ومستحمل انتهاكاتهم دى .<br />كفاية يا ناس كده حرام عليكم , كل واحد يحط اخته ولاامه مكان اللى انتهك عرضها دى , ايه هيكون موقفه .<br />معتقدش ان اىواحد هيسكت على كده . دا قليل ان ما موتهم او مات وهو بيحاول ."
