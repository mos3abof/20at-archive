text = "\" ياعم براء عايزين شغل صحفي الله يرضى عنك كفاية شغل الاستسهال ده مرة تحكيلي عن نزهة نيلية ومرة تكتبلي عن خبر منشور فين انتاجك انت معلش اذا كنت بتكلم في حاجة قد يري البعض انها مش اختصاصي بس ده تعليقي على شغلك \" انا مع كل كلمه قالها الاخ ميدو واضيف على كلامه ان الحاجة ديه من اختصاصى بقى وعشان كده عاوز اقولك انتا كنت عاوز تقول ايه \" الشرطه وحشه .. ما احنا عارفين \" ايه الجديد ومش هاقولك انك بتعتمد على شغل الاخرين لا هاقولك ان الصوره نفسها اعلان للجريده .. ايه الحكايه انتا عندك احسن من كده \" يااما نقد للاخوان يا اما اكدت المصرى اليوم \" نفسى اقرالك \" وقالت مصادر عليمة لـ \" ولاد البلد \" ايوه فين مصادره التى تعد رأس مال اى صحفى وانت تعلم بالاضافة لمجموعه مفرداته !"
