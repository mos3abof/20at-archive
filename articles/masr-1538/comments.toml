text = "ممكن نعرف الحل الاسلامي الاخواني لمشكلة التحرش<br />وعايزين نعرف حل الحزب الوطني لقضية التحرش<br />وكل الاحزاب كل حزب يدرج في برنامجه الانتخابي القادم حل قضية التحرش اللي بتزداد يوم بعد يوم والعملية تحولت من متوالية عددية الى متوالية هندسية<br />وبرضه عايزين نعرف اقتراح وزارة الداحلية لحل المشكلة<br />يعني يا البراء اشرف الموضوع عايز تحقيق صحفي ميداني واسع في حل مشكلة التحرش وتاخد ىراء الناس دي كلها"
