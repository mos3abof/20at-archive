author = "مصرى حتى النخاع"
posted = "2007-02-05"
text = "مع وجاهة كلامك لكن انتا كدة دخلت موضوعين فى بعض الموضوع الاول هوا تعامل ظباط الشرطة واقصد الظباط وبالتالى كل اللى تحتهم من مخبرين وعساكر وطبعا انا متفق معاك ان التعذيب من الظباط ظاهرة وظاهرة كاسحة كمان ومحتاجة حل ضرورى جدا ولو بالقوة<br />اما الحالة دى فهيا حالة عساكر ماخدوش اوامر لكن انا لاحظت ان بعض بتوع الريف لما بيروحوا الحضر المدينة يعنى بيعملوا كل اللى هما نفسهم وغالبا بيكون حاجة تكسف ودة نفس موقف العساكر دول لكن اعتقد انها مش ظاهرة العساكر دايما بيبقوا كلاب لما الاوامر تصدر ليهم"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206022234/http://masr.20at.com:80/article.php?sid=1538"

[[comments]]
order = 17
subject = "دخلت الموضوعين فى بعض!!!!!"
author = "فارس_fr"
posted = "2007-02-05"
text = "يا اخ مصري حتى النخاع ,, انا اقصد -وزى مابراء قال - ان حادثة زى دى مش مستاهله جدال وتحليل نفسي لشخصية اللى عملها هل هو من الريف ولا الحضر , ولا مستاهلة الجدال حول كونها لاترتقى كمادة صحفية زى ما بعض المعلقين مختلفينن مع بعض ,,, هذا كله لا يهمنى , ما يهمنى هو وجود حاثة حصلت من الممكن ان تحث لاختى او لاختك او لاى بنت مصرية واصبحت ظاهرة الاعتداءات والانتهاكات من قطاع الشرمطة لا يمكن السكوت عليها . يعنى خلينا فى اصل الموضوع \" اصبحت الانتهاكات دى ظاهرة يومية ولابد من التصدى لها بشتى السبل \" .<br />وبعد ما نتصدى ليها باذن الله ونسقط نظام مبارك الفاشي كله نبقى نحللهانفسيا ونقول واردى الريف وقاطنى الحضر ونشوف ايه السبب وراء هذه الانتهاكات .<br />هو موضوع واحد اللى اتكلمت فيه بيتهيالى وصلتك وجهةنظرى ."
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206022234/http://masr.20at.com:80/article.php?sid=1538"

[[comments]]
order = 18
subject = "لــــ"
author = "اعتقد يا اخ مصري حتى النخاع , ان الحوادث الفردية لم تحدث فقط من واردى الريف _اللى عندهم كبت - فحادثة عماد الكبير كانت على يد ظابط شرطة , وتعذيب الفتاه للاعتراف بالقتل كانت على يد ظابط شرطة . والاخ اللى اغتصبوه فى طريق الغردقه ده - مش فاكر اسمه لاسف - برده كان ضابط شرطة وكلابه ."
posted = "2007-02-05"
text = "يعنى اذا كانرب البيت بالدف ضارب فشيمة اهل البيت الرقص . اذا كانت القيادات نازلة تعذيب وارهاب فى الناس , فعذرا لامناء الشرطة , وبعدين احنا مش بصدد الجدال على مين اللى غلطان وارد الريف والا ابناء المدينة من اولاد ????? . المهم ان يكون فيه وقفة مع الناس دىوانتهاكاتها لحقوق الناس الغلابة . ولا انت ايه رايك ؟؟؟"
archived = "2007-02-13"
capture_url = "https://web.archive.org/web/20070213141355/http://masr.20at.com:80/article.php?sid=1538"

