text = "انهارده تم الافراج عن الاتنين امناء شرطة إلي حاولو يعتدو على البنت صاحبة المشكلة<br />قرار صادم طيب على أي اساس تم الافراج عنهم<br />وفي نفس الوقت المحكمة عمالة تأجل محاكمة الضابط في امن الدولة المتهم بتعذيب مواطن حتى الموت واعتقد إن المحكمة بالطريقة دي بتدي فرصة للداخلية ومباحث امن الدولة للضغط على اهل القتيل علشان يتنازلو ويا دار ما دخلك شر<br />بصراحة بلد الوساخة والفساد ريحتها طلعت في الشوارع"
