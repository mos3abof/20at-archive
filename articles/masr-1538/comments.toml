[[comments]]
order = 10
subject = "طيب ماشى"
author = "مصرى حتى النخاع"
posted = "2007-02-05"
text = "الاخ براء من الناس اللى عمالين كتابة فى الموقع دة ووراة شوية العالم المجهولة اللى دايما عاوزة شغل مش عارف حاسس انى فى مجلة سمير من الوضع الكرتونى دة ومش بعيد بكرة براء يقول انة يستحق يشتغل فى التايمز بس الوحشيين اللى متطهضين الاخوان مانعينة<br />ماعلينا ؟<br />ياسبد براء الحادثة اللى حضرتك كتبتها حالة فردية ولاترقى لمستوى الظاهرة وبالتالى ممكن ترسم حالة تعجب من مستوى الاخلاق الحالى وتحديدا وارد الريف لانهم بيعانوا من كبت ودى بقى اللى ظاهرة بجد<br />اما الكلام عن مقاطعة الشرطة بيتنهيالى ان تقويم الشرطة اهم<br />ولا اية ؟"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206022234/http://masr.20at.com:80/article.php?sid=1538"

[[comments]]
order = 11
subject = "لــــ \" مصري حتى النخاع \""
author = "فارس_fr"
posted = "2007-02-05"
text = "اعتقد يا اخ مصري حتى النخاع , ان الحوادث الفردية لم تحدث فقط من واردى الريف _اللى عندهم كبت - فحادثة عماد الكبير كانت على يد ظابط شرطة , وتعذيب الفتاه للاعتراف بالقتل كانت على يد ظابط شرطة . والاخ اللى اغتصبوه فى طريق الغردقه ده - مش فاكر اسمه لاسف - برده كان ضابط شرطة وكلابه .<br />يعنى اذا كانرب البيت بالدف ضارب فشيمة اهل البيت الرقص . اذا كانت القيادات نازلة تعذيب وارهاب فى الناس , فعذرا لامناء الشرطة , وبعدين احنا مش بصدد الجدال على مين اللى غلطان وارد الريف والا ابناء المدينة من اولاد الشرمطة . المهم ان يكون فيه وقفة مع الناس دىوانتهاكاتها لحقوق الناس الغلابة . ولا انت ايه رايك ؟؟؟"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206022234/http://masr.20at.com:80/article.php?sid=1538"

[[comments]]
order = 12
subject = "الى الاخ فارس ومن على شاكلته"
author = "ميدو"
posted = "2007-02-05"
text = "انا لست معترضا على ما تقول من تعذيب القيادات للشعب وما الى ذلك كما انى معك تماما فى ان يكون هناك وقفة مع كل هذه الانتهاكات لكن واجبنا كصحفيين ان نشكف المزيد منها او ان نعالج زاوية جديدة فيهاده فعلا يكون دورنا واضافتنا اللى ممكن نقدمها مش نحكي فى المحكي ايه المانع اننا نعمل انفراد تنقل عنه مواقع النت والمصري اليوم اللى الاستاذ براء بيستشهد بيها والا احنا هانفضل ننتظر جهد الصحف الاخري علشان نشتغل على شغلها .. عيب والله"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206022234/http://masr.20at.com:80/article.php?sid=1538"

[[comments]]
order = 13
subject = "الإخوة المعلقين.. إيه رأيكم؟"
author = "البراء أشرف"
posted = "2007-02-05"
text = "بصراحة حاجة غريبة شوية اننا نتخانق واحنا بنتكلم عن بنت مصرية اختنا كلنا تم الاعتداء عليها في المترو.. ونختلف حولين قضية لا يجوز الاختلاف عليها..<br />بالنسبة للإخوة اللي شايفين ان الموضوع مش سبق صحفي.. فهو فعلا مش سبق..ده تعليق على حادث مهم.. واعتقد ان اهميته تجبرنا على نقله والتعقيب عليه وفتح باب النقاش حوله.. وأنا كان دوري هو نقل الموضوع من المصري اليوم وأخذ رأي الدكتور أحمد عبد الله في القضية وفتح باب النقاش.. وهو ماحدث بالفعل.. وده فن من فنون الصحافة كل الدنيا عارفاه ومش أنا الوحيد اللي بعمله في صحفيين كبار بيعملوه..<br />زي مثلا ما صحفي في الدستور يعقب على ازمة الحجاب اللي انفردت بيها المصري اليوم.. وده لا يقلل منه او من المصري اليوم.. لان كل واحد منهم عمل فن مختلف من فنون الصحافة..<br />الاخ شريف الدواخلي..<br />الحقيقة المرة إني مش قادر افهم تعليقات حضرتك.. يعني انت مع ولا ضد.. موافق ولا معترض..<br />اما الاخ اللي بيقول ان الامر مجرد حادثة ولا يمكن اعتبارها ظاهرة.. ماشي يا عم.. خلينا نستنى شوية لحد ماتبقى ظاهرة..<br />الإخوة الكرام..<br />رفقا في تعليقاتكم.. لإن الأمر ابسط من ذلك.. والاتهامات عمال على بطال اعتقد انها ليست في مصلحتي ولا في مصلحة الموقع<br />شكرا<br />البراء أشرف<br />baraa_ashraf1@yahoo.com"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206022234/http://masr.20at.com:80/article.php?sid=1538"

