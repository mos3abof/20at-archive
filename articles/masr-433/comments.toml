[[comments]]
order = 8
subject = "لو لم اكن مصريا"
author = "ابو كرتونة"
posted = "2006-06-05"
text = "بصراحة انا طهقت من البلد بنت الوسخة ديه<br />نفسي اشوف يوم عدل فيها , نفسي احس اني لسه عايش<br />نفسي اشوف كل الشباب التعبان والعاطل شغال وفاتحين بيوت زي كل شباب العالم<br />نفسي يعدي الشهر بدون اما اغلب الاسر بتستلف علشان تاكل<br />نفسي في رئيس ديموقراطي يسمع انتقادات المعارضة بدون زعل وتكسير للعظام والتحرش بالصحفيات,وضرب المتظاهرين,واعتقالهم<br />انا بحسد ديموقراطية اسرائيل<br />علي الاقل رئيس الدولة مظبط شعبه صح<br />لذلك<br />طظ فيك يا مبارك,طظ تانية ليك يا حرامي<br />يا سارق البلد ,يا مجوع الشعب,يا مسرطن الفقراء بغذائك الملوث<br />لو لم اكن مصريا لودت ان اكون اسرائيليا"
archived = "2006-09-24"
capture_url = "https://web.archive.org/web/20060924121451/http://masr.20at.com:80/article.php?sid=433&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "هذا الجرو من ذاك الكلب"
author = "أبو علاء (للأسف)"
posted = "2006-10-18"
text = "عن جمال مبارك<br />هو الكلب بن الكلب والكلب جده ولا خير في كلب مولود من كلب.<br />لا أتمنى أبدأ أن يذهب حسني في هدوء وأتمنى من كل قلبي نهاية مثل نهاية تشاوسيسكو (رومانيا) عندما سحله الشعب وممطوة وبالفيديو قبل أن يطلقو عليه الرصاص هو والسيدة الأولى.<br />نفسي أشوف يوم تشاوسيسكو مصر<br />ياه يا حسني دا شارون جنبك ملاك<br />ياه يا حسني كام جعان عريان وراك<br />طب دالسادات اللى ظلم فينا وخان<br />وعم ناصر اللي خرم كل البيبان<br />وعم عامر اللي اللي حارب عالوراك<br />كلهم ماييجو نقطة من نجاسة جتتك<br />كل المجازر ما تساوي شوفة سحنتك<br />كل واحد منهم كان مفتري وانت كمان<br />الكل بايع في حيطان بلدنا ويشتري وانت كمان<br />لكن أقول الحق<br />ماحد فيهم كان خسيس زيك جبان<br />ماحد فيهم خلى مصر القاهرة<br />كدة تنقهر وأقل من فيجي وقطر<br />وأصغر من سيلان أو جزر القمر<br />والكلمة منها ماتمشى حتى عالغجر<br />مش الأمريكان."
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111125050/http://masr.20at.com:80/article.php?sid=433&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
