text = "أرسل هذا التعليق بواسطة : ابو شريف<br />مطلوب وطن نعيش فيه شرفاء<br />مطلوب وطن بدون حكام اغبياء<br />في الذكري السنوية المريرة لنكسه 67 والتي ضاعت فيها احلامها وتكسر علي صخرتها مستقبلنا ... نفس المأساة تتكرر حكام أغبياء ... تعذيب وسجون .... اعتقالات ... كبت حريات .... حد شاف اللواء محمد عبد الفتاح مساعد وزير الداخلية السابق وعضو مجلس الشعب الحالي علي قناة المحور مع وائل الإبراشي المهدد بالسجن وهو بيقول دي بلدنا واللي مش عاجبه يمشي ... عنجهية المتخلف دي هي اللي جابت النكسة في 67 وعنجهية المتخلف الحالية هى اللي ح تصحح المسار القادم<br />وياحرية فينك فينك كلاب السلطة بينا وبينك"
