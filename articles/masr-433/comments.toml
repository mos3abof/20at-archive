[[comments]]
order = 0
subject = "كلاب السلطة"
author = "مصرية"
posted = "2006-06-02"
text = "خبر صغير فى شريط أنباء قناة الجزيرة ..(رئيسة تشيلى تقيل رئيس الشرطة للتعامل بخشونة مع مظاهرة طلابية)..هذا الخبر..شعرت منه بالحسرة والأسف على ما يتعرض له الشرفاء فى مصر..هذا الخبر جسد أُكثر وأكثر مدى رخص قيمة الأنسان المصرى لدى الكلب الحقير ايا كان من يأمر بالمعاملة المهينة اللاآدمية للمتظاهرين فى مصر..ظنا منهم بذلك أنهم سيسكتوا صوت الحق..وغباء منهم الا يدركوا أن المزيد من الضغط سيولد حتما الأنفجار..وجلالة الأمبرا طوووووووووور الأوحد سعيد ومسرور بالقمع والانتهاك الذى يمارس للحريات والأعراض والقانون طالما ذلك يعزز بقاءه على الكرسى ..(الذى سيكون باذن الله كرسى كهربائى يصعقه هو وعصابة اللصوص التى تحميه)..ان الضغوط التى تمارس من قبل هؤلاء السفلة يوميا على الشعب كفيلة بالحزن والبؤس الذى أصبح حال الناس فى مصر ..وكفيلة أيضا بانفجار البركان والثورة على الظلم لامحالة فى هذا ..حيث يوضع هؤلاء السفلة مكانهم الحقيقى ..فى مذبلة التارخ الأسود..أنتم أحقر الكلمات فى قواميس كل لغات الدنيا..لالالالالالالالالالالا لمبارك وسلالتة...لالالالالالالالالالالا للفساد..لالالالالالالالالالالالا لقانون الطوارىء.. ونعم..نعم..نعم..لتعديل الدستور المصرى..أنتم أحقر الكلمات فى قواميس كل لغات الدنيا..ربنا يخلصنا منكم ونلاقى داهيه ترضى تاخدكم..قولواآآآآآآآآآآآآآآمين"
archived = "2006-09-24"
capture_url = "https://web.archive.org/web/20060924121451/http://masr.20at.com:80/article.php?sid=433&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "مالك بس يا عم ن00ج00م"
author = "الاستاذشيكو"
posted = "2006-06-02"
text = "يا عم نجم بقه هو عشان عمود صغنطوط متنشرش تبهدلنا كده<br />الواحد بيفرح لما اي حد من الزمن الجميل يكتب كلمه حلوة وكلمه خير لهذا البلد<br />حقك علينا يا عم نجم نحن معجبينك وماتزعلش وخلاص 000 خلاص<br />اماالبنت (المصريه ) فانا اتحصرت لما شوفت الخبر بتاع الجزيرة والله وكنت هاعيط من الخجل علي اللي اتعمل في الشرقاوي بس ده معروف عن الزبانيه وديول النظام المصري بس انا باقولهم ان دولت الباطل ساعه (والساعه قربت جدا والله) ودوله الحق الي قيام الساعه<br />كل كدمه في حسد الشرقاوي هى وسام علي صدرة وكل واحد زيه كمان كده"
archived = "2006-09-24"
capture_url = "https://web.archive.org/web/20060924121451/http://masr.20at.com:80/article.php?sid=433&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "اسرائيل ام الدنيا"
author = "نسيت اسمى"
posted = "2006-06-02"
text = "انا اسف على العنوان ومحدش يستغرب انا كاتب ليه العنوان ده لو حضراتكم تفتكروا لما اسرائيل الله يحرقها قررت الانسحاب من قطاع غزة وفك المستوطنات وترحيل المستوطنين على الله يولعوا كلهم المهم وهى بترحل المستوطنين الله يجرقهم تانى عملوا مظاهرات واحتجاجات عنيفة جدا واستخدموا فيها كل شيئ علشان ميطلعوش من البيوت لدرجة انهم كانوا بيضربوا الجنود الاسرائيليين الله يحرقهم بأى شيئ وكل شيئ لدرجة انهم كانوا واقفين فوق المنازل وبيرموا عليهم القاذورات واقسم بالله لما شفت المنظر ده قلت اه لو اللى بيحصل ده كان عندنا كان السحل والضرب فى المليان هو الحل الوحيد ولكن لم ارى ولا جندى يتعرض لاى مستوطن بل بالعكس كان ياخد الامور ببساظة لدرجة انهم جابوا سلالم وطلعوا عليها علشان ينزلوهم كانوا يضربوهم ويدفعوهم ويوقعوا الجنود وكانت جميع الاصابات من الجنود ومفيش ولا اصابة بين المستوطنين الله يخرب بيت ابوهم والله زعلت علينا جدا جدا احنا الشعب المصرى لاننا بصراحة نستاهل معاملة احسن من كده لكن للاسف مش محصلين حتى ربع معاملة الجنود الاسرائيليين الله يحرقهم للمتوطنين الله ياخدهم علشان كده نسيت نفسى وقلت احنا اللى نستاهل اللى بيتعمل فينا وكتبت العنوان اللى فوق ومحدش يزعل منى لما قلت اسرائيل الله يحرقها ام الدنيا"
archived = "2006-09-24"
capture_url = "https://web.archive.org/web/20060924121451/http://masr.20at.com:80/article.php?sid=433&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "انت عايش في البطاطا"
author = "عصام عبدالجواد بورسعيد"
posted = "2006-06-02"
text = "تعذيب ايه اللي انتهي بعد الغير مرحومين هما وأمثالهم صلاح كلب وحمزه أخوة ياسيدي ده منهج يدرس لكل ضابط شرطة مصري الا من رحم ربي وبعدين يا عم احنا المصريين خلاص جسمنا نحس وايه يعني لما تاخد علقة ولا 10ولا100ياعم كلنا لها"
archived = "2006-09-24"
capture_url = "https://web.archive.org/web/20060924121451/http://masr.20at.com:80/article.php?sid=433&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "ملعون"
author = "أبو أسامة"
posted = "2006-06-02"
text = "ملعون ابو الى يزعلك يا عم نجم يلى علمت<br />الشباب ازاى يفضل القلب شباب حكم هيا مش بالسن واللهى لما شوفتك فى المظاهرات زعلت من نفسى اننا مش عارف اشارك وانا شاب<br />وانت بتشارك رغم سنك ربنا يبارك فى امثالك وياخذ الى بالى بالك ويا عم نجم متزعلش علشان احنا بنزعل على شانك<br />لا...........للفساد<br />لا...........للتوريث<br />لا...........للأستعباط"
archived = "2006-09-24"
capture_url = "https://web.archive.org/web/20060924121451/http://masr.20at.com:80/article.php?sid=433&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "ايوه إسرائيل"
author = "سمسم"
posted = "2006-06-03"
text = "هو ده الكلام، لأن الإنسان في إسرائيل بيعامل كبشر وحق ياخده من عين رئيس الوزراة اللي عندهم أهم شخصية في البلد. بس في إسرائيل؟ لا ياسادة في كل دول العالم هما معفيين من شروط الفيزا والإقامة وفي بعضها أو كثير منها العمل، بما فيها دول الخليج الوقتي.<br />وع الكبيرة والصغيرة تلاقي السفير أو القنصل واقف مع اللي له مشكله منهم، ويجيب له حقه من عين العنقاء.<br />علشان كده عمرنا ماحنقدر نخترقهم ونزرع عملاء لينا وسطهم ولو فعلنا العجايب. حيلاقوا عندنا إيه غير البهدلة وقلة القيمة!<br />فهمت ياحسني يا كروديه بنكره صنف أهلك ليه، بغض النظر عن إنك كلب وعميل وجبان وخاين زي الخنزير سلفك!"
archived = "2006-09-24"
capture_url = "https://web.archive.org/web/20060924121451/http://masr.20at.com:80/article.php?sid=433&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "مطلوب وطن"
author = "ابو شريف"
posted = "2006-06-05"
text = "مطلوب وطن نعيش فيه شرفاء<br />مطلوب وطن بدون حكام اغبياء<br />في الذكري السنوية المريرة لنكسه 67 والتي ضاعت فيها احلامها وتكسر علي صخرتها مستقبلنا ... نفس المأساة تتكرر حكام أغبياء ... تعذيب وسجون .... اعتقالات ... كبت حريات .... حد شاف اللواء محمد عبد الفتاح مساعد وزير الداخلية السابق وعضو مجلس الشعب الحالي علي قناة دريم وهو بيقول دي بلدنا واللي مش عاجبه يمشي ... عنجهية المتخلف دي هي اللي جابت النكسة في 67 وعنجهية المتخلف الحالية هى اللي ح تصحح المسار القادم<br />وياحرية فينك فينك كلاب السلطة بينا وبينك"
archived = "2006-09-24"
capture_url = "https://web.archive.org/web/20060924121451/http://masr.20at.com:80/article.php?sid=433&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
