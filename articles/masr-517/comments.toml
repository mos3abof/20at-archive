[[comments]]
order = 0
subject = "ياتري مين حيستقبل الناس جوه غيره ؟؟؟ ممممم ... يلا حمدالله علي السلامة"
author = "محمد السيد"
posted = "2006-06-15"
text = "الدكتور حسن الحيوان ...<br />اسم جميل جدا لإنسان كل اللي اتعامل معاه ... حبه من أول مرة شافه فيها ...<br />كان في استقبالنا جوه في أول يوم ... ضحكته جميلة جدا ... استقبلنا ولا كأنه في بيته ...<br />اتفضلوا ... حمدا لله علي السلامة ... أهلا بيكو معانا في المقر الرسمي ...<br />إنسان في غاية البساطة والطيبة ....<br />تعرفوا الناس المليانين اللي يتحبوا علي طول ... الدكتور حسن منهم ...<br />بس انسوا .... اللي بيقولوا عليه التهم والحاجات الكبيرة دي كلها....<br />أهه الحمد لله المحكمة حكمت له بالبراءة وعقبال كل المعتقلين ... الأحرار ..<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616152857/http://masr.20at.com:80/article.php?sid=517"

[[comments]]
order = 1
subject = "يا بوى يا مصر"
author = "ياسر ابو سمية"
posted = "2006-06-16"
text = "يا بوى يا مصر اما الواحد بيحبك حب،والله باضحك من قلبى كل الاغنية دى ما بتتذاع،بافتكر مصر الحبيبة اللى كلمونا عنها فى المدارس زمان ،فاكرينها ،ايوة .. هى مصر نفسها اللى هى امى واللى نيلها جوة دمى ،واللى حفظونا \"ما تقولش ايه اديتنا مصر قول هندى ايه لمصر ..يا حبايب مصر ،طيب والنبى بذمتكم الدكتور حسن الحيوان الاستاذ الجامعى المرموق والذى يحبه كل من يراه كما قال محمد السيد اذى مصر فى ايه علشان مصر \"الحبيبة \"تحبسه طول الفترة دى ،وواحد زى ده مكانه فى قاعات المحاضرات مع طلابه ماله ومال السجون ،بالله عليكم شفتم حد بيقدر ولاده زى بلدنا الحبيبة .واذا كان يا جماعة غلطته انه فكر يرشح نفسه فى الانتخابات فالحكومة عملت الواجب وسقطته .يعنى مكانش له لزوم الهيصة دى كلها وقلة القيمة .وعندى سؤال محيرنى ،هل الحكومة فاكرة بجد انها لما تحبس واحد هيرجع عن افكاره ؟اذا كانت الحكومة بتفكر بالطريقة دى يبقى معلهش دى تبقى حكومة محو امية مش معلومات ونظيف وكدة يعنى ،نهايته الف مبروك للدكتور الحيوان بالبراءة المستحقة ،والفين مبروك لاهل الشرقية على رجوع الدكتور \"الجدع \"من البعثة ،ومليون مبروك للاخوان على رجالتها اللى يشرحوا القلب."
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619140130/http://masr.20at.com:80/article.php?sid=517"
