text = "يسلمو للموضوع الهام عن الجار<br />• إذا رأيت جارك فتذكر وصية الله به فقد قال الله تعالى<br />\"والجار ذي القربى والجار الجنب والصاحب بالجنب وابن السبيل<br />• لا تؤذِ جارك فقد قال صلى الله عليه وسلم:<br />\"من كان يؤمن بالله واليوم الآخر فلا يؤذِ جاره\".<br />• أحسن إلى جارك فقد قال صلى الله عليه وسلم:<br />\"من كان يؤمن بالله واليوم الآخر فليحسن إلى جاره\".<br />اوص المسلم بجاره وتأمل وصية جبريل لرسول الله<br />فقد قال صلى الله عليه وسلم:<br />\"ما زال جبريل يوصيني بالجار حتى ظننت أنه سيورثه\"<br />دمتم بكل خير"
