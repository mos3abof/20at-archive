text = "المعلومات قيمة وممتازة ومختصرة بشكل شامل<br />عندى سؤال بسيط ..انا مش باكل اى نوع فاكهة خالص وعمرى ف حياتى ما أكلت فاكهة نهائي<br />باكل خضار بسيط وبشرب لبن كتير جدا وباكل مأكولات بحرية تقريبا كل يوم ونادرا لما باكل لحوم ممكن مرة او مرتين فالشهر<br />عايزة اعرف هل في حاجة تعوض الفاكهة وتخسسنى وتمدنى بنفس قيمة الفاكهة الغذائية ؟؟<br />انا رحت لدكاترة كتير بس محدش عنده حل علما ان المشكلة انا مولودة بيها ولما باكل فاكهة بتعب جدا وممكن أصاب بدوخة شدية وانخفاض في ضغط الدم وترجيع وحموضة<br />فارجوكى فيدينى<br />شكرا"
