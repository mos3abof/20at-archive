text = "الفلم ده فوق الرائع و فعلا انا لما شفته كنت خايف و قلت مش عايز اعيش اليوم ده .. بس انا عايز اقول حاجه الافلام الامريكيه مش على طول بتظهر الرئيس بصوره مثاليه .. فيه افلام بتجيب الرئيس \" عبيط \" و افلام بتجيبه خاين , افلام بتجيبه كويس و هكذا .. كل واحد و براحته و فكره النجاه اصلا مأخوذه من قصه نوح لانهم هربوا في \"فلك\" ز اخذوا معاهم انواع الحيوانات … بس السؤال بقى .. تفتكروا لو ده حصل الناس هاتعمل فلك كده و تبيع الكراسي بمليارات الدولارات .. و ايه الموقف ساعتها ؟؟؟"
