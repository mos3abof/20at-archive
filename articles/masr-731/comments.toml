posted = "2006-12-07"
text = "أهذه هى الثقافة ؟؟؟؟ ومن يقول بالحجاب فهو رجعى او ارهابى؟؟؟؟<br />هذا هو الفكر المعكوس لقد تغيرت افهام المسلمين ولكن هل من عودة الى الله ياألف مليون مسلم اما آن لنا أن نتوب أماآن لنا ان نرجع الى الله بالله عليكم ياشباب هيا لنعود الى الله وتذكر دائما الحور العين فى الجنة<br />بالله عليكن يانساء اتقين الله واعلمن أن ما عندالله خير وابقى<br />والله انى احبكم فى الله اخوكم 18سنة"
