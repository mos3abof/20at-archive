text = "سلامى إلى اختى هند وإلى اهل المغرب العربى انا معاكى ياهند انى كل حكومتنا وكل الحكام خائنين لكن المصيبة فعلا انى احنا رغم كل دة بنعمل مسابقات جمال يعنى احنا بجد نروح نلطم او يفتحولنا باب الجهاد ونروح نحارب ماهو ياإما نلطم على خيبتنا ووكستنا او نروح نحارب وهو الإظاهر والله اعلم مافيش فايدة قالها سعد زغلول ومات بعدها"
