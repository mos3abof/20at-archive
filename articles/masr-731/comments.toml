text = "هذه النوعية من المسابقات تمثل نوع من الحرية .. سواء كانت حرية شخصية أو حرية ممارسة حدث عام يشارك في أعداد مختلفة من الناس، وعلى كل من يعترض على مثل هذه المسابقات ألا يشارك فيها وأن يبدي إعتراضه بطريقة مهذبة .. وكفى.<br />وتحية لأنصار ثقافة الحياة .. فالحياة لن تتوقف لوجود المخربين قتلة الأطفال الصهاينة، كما لن تتوقف لوجود أعداء الحياة في بلداننا"
