subject = "اتقو الله 00من الجرح النازف"
author = "فلسطين"
posted = "2006-07-30"
text = "بسم الله اقول يا شباب الاسلام وصبايا الاسلام كونو على حذر من هذه التفاهات الصاقطه بحقكم هائولاء 0الجبناء الصهاينه لايريدون فيكم الانسان الصالح 0انظروا ماذا يحل باهلنا في فلسطين ولبنان والعراق 0هم يريدو ان يصقطو اكبر عدد من البنات التائهات التي تريد البحث عن الشهره وعالم المسمى باافن 0اقول احذرو من هذه المهرجانات الملعونه فانها مطلوبه من العدو والله 0خاصه في مصر العربيه والاردن والجوار العربي كي يبثو السم في عقول هذه البنات التائهات في عالم الحريه المفرطه 000000فيا اخواني واخواتي في الله اتقو الله في انفسكم واحذرو كل الحذر ان تكونو فريسه لهذه الفئه الضاله 0000000ولكم فائق التقدير والاحترام من شباب فلسطين وبارك الله فيكم0وجزاكم الله خيرا"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217235532/http://masr.20at.com:80/article.php?sid=731"

