posted = "2009-08-04"
text = "وطبعا اللي وضع حجر الاساس في الاحتفال هو واحد من اثنين<br />جيهان ـ خوفو<br />او<br />سوزان ـ خفرع"
archived = "2009-08-08"
capture_url = "https://web.archive.org/web/20090808074627/http://www.20at.com:80/masr/2khbar/12839-2009-08-04-08-45-25.html"

[[comments]]
order = 4
subject = ""
author = "بمناسبة هرم خوفو"
posted = "2009-08-04"
text = "قرات كتاب عن هرم خوفو وكيف انهم عندما دخلوا الهرم لاول مرة وفتحوا التابوت فى غرفة دفن الملك لم يجدوا اى جثة لة فى التابوت الصخرى<br />ووجدوا الكهنة قد كتبوا على الجدران ان الفرعون ابن اللة قد صعد بعد الموت الى ابية الذى فى السموات وانة بجوار عرش ابية<br />وحتى الان لم يعثر للفرعون خوفو على جثة<br />الكتاب اظنة لواحد نصرانى اسمة السيسى<br />اية راى اخوانا النصارى فى القصة الفرعونية دى"
archived = "2009-08-08"
capture_url = "https://web.archive.org/web/20090808074627/http://www.20at.com:80/masr/2khbar/12839-2009-08-04-08-45-25.html"

[[comments]]
order = 5
subject = ""
author = "ضرب الودع ووشوش الدك"
posted = "2009-08-04"
text = "السيد الوزير المحافظ ضرب الودع ووشوش الدكر وعرف ان تاريخ وضع حجر الاساس بواسطة الفرعون خوفو كان يوم 23 اغسطس وانة تم قص شريط الافتتاح بتاريخ 23 اغسطس ومع العلم ان اغسطس نفسة لم يكن اتولد ولا ظهر للوجود<br />او ربما قيادة امنية اخبرت السيد المحافظ ان الهرم اعترف واقر فى محضر التحقيقات ان تاريخ البناء كان فى 23 اغسطس<br />او ربما كان 23 اغسطس يمثل للسيد المحافظ تاريخا مهما فلصقة بالهرم كان يكون عيد ميلاد ام الخير او بهانة او تفيدة<br />هو فية احد عارف حاجة ما هو كلة عند العرب صابون<br />ما تحتفلوا وخلاص وابقوا انعزموا فى مطاعم فنادق الخمس نجوم والهطوا على حساب المحافظة فرحة بتاريخ البدء فى بناء الهرم<br />وعلى فكرة للان لم يعرف احد كيف بنى الهرم وهناك 23 رسالة دكتوراة فى استنتاج كيف بنى الهرم ونظريات بنائة وكلها تخامين<br />سيدى المحافظ كل سنة وانت طيب"
archived = "2009-08-08"
capture_url = "https://web.archive.org/web/20090808074627/http://www.20at.com:80/masr/2khbar/12839-2009-08-04-08-45-25.html"

