text = "خوفو … خفرع … منقرع<br />مبارك … جمال … ؟؟؟؟؟؟<br />يا خسارة مات منقرع<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــ<br />مش دودي ام ننوشه ولا دودي حسن"
archived = "2009-08-08"
