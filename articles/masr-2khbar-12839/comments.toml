order = 0
subject = ""
author = "يوم 22 اغسطس"
posted = "2009-08-04"
text = "٢٢ أغسطس عام ٢٤٧٠ قبل الميلاد،<br />هذا التاريخ ليس صحيح<br />لان فرعون ما كنش بيحب الحر وكان بيصيف طول شهور الصيف وفي هذا الشهر دا بالذات دايما بيروح يصيف في الاستراحة بتاعته في المنتزه بالاسكندرية<br />وكان في الشتا بيروح الاستراحة بتاعة امه في اسوان<br />مش احمد الهواري ولا عبدالله الطجاوي"
archived = "2009-08-08"
capture_url = "https://web.archive.org/web/20090808074627/http://www.20at.com:80/masr/2khbar/12839-2009-08-04-08-45-25.html"

[[comments]]
order = 1
subject = ""
author = "الاجهزة الامنية"
posted = "2009-08-04"
text = "مكتوب في الموضوع كالاتي<br />بحضور أساتذة الآثار والتاريخ والأجهزة الأمنية، عن التوصل إلى تاريخ بناء الأهرام<br />طيب وايه دخل الاجهزة الامنية في الموضوع<br />ما هو الاجهزة الامنية يعني مباحث امن الدولة والامن المركزي<br />ايش علاقتهم بتاريخ بدء الهرم<br />وهل تحديد هذا التاريخ بيهدد الامن القومي المصري<br />عجايب والله<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2009-08-08"
capture_url = "https://web.archive.org/web/20090808074627/http://www.20at.com:80/masr/2khbar/12839-2009-08-04-08-45-25.html"

[[comments]]
order = 2
subject = ""
author = "منطقة مبارك"
posted = "2009-08-04"
text = "سمعت طراطيش كلام والله اعلم انهم زي ما عملوا في تمثال رمسيس وودوه ورا الشمس وسمو الميدان ميدان مبارك<br />ناويين ينقلوا الهرم ويسمو المنطقة منطقة مبارك<br />وتم تقديم هذا الاقتراح في لجنة السياسات ووعد نظيف باحضار خبراء من امريكا لبحث عملية نقل الهرم وتسمية المنطقة بمنطقة مباركات الجيزه بدلا من اهرامات الجيزه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-08-08"
capture_url = "https://web.archive.org/web/20090808074627/http://www.20at.com:80/masr/2khbar/12839-2009-08-04-08-45-25.html"

