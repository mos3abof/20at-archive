posted = "2006-10-17"
text = "يا جماعه عيب الكلام ده ده احنا حتى فى رمضان ، صلوا على النبى عليه الصلاه و السلام<br />وبعدين احنا عارفين كلنا ان حكومه السعوديه حكومه معتدله.<br />نعم للتوريث ولاستكمال المسيره"
