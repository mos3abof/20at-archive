[[comments]]
order = 11
subject = "إتصالات آل سعود بإسرائيل قديمة جدا"
author = "توفيق زيدان"
posted = "2006-10-18"
text = "ليه اللف والدوران علاقات آل سعود ومن قبلهم دعاة البيت الهاشمي في أرض الحجاز بالمشروع الصهيوني أوثق من الوثيقة...وفيه مجلدات صدرت حديثا عن متخصصين في الغرب، مش ناصريين ولا شيوعين ولا حاسدين نعمة الخ، بتفضح إتفاق روزفلت وعبد العزيز آل سعود بإقامة وطن لليهود في فلسطين نظير دعم أمريكا لمملكة آل سعود وحمايتها ودعمها.<br />بإستثناء المرحوم فيصل في سنوات حياته الأخيرة كل حكام آل سعود ساروا على طريق تنفيذ المخطط الأمريكي والتمكين لإسرائيل في المنطقة، وبعد التخلص من معارض التطبيع الأوحد مع الكيان الصهيوني وهو الرئيس العراقي صدام، وخلو الساحة من أية قوة عربية وطنية داعمة للقضية الفلسطينية، لم يعد هناك أي لزوم ليستمر آل سعود في الإتصالات السرية والدعم اللامباشر اللامحدود لإسرائيل فجاهروا بالخيانة إسوة بمصر والأردن."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060423/http://masr.20at.com:80/article.php?sid=1049"

[[comments]]
order = 12
subject = "العرب الجرب همه السبب"
author = "المهندس عادل"
posted = "2006-10-18"
text = "ملعون أبو العرب الجرب همه سبب تأخرنا وبيجرونا للخلف. ملناش غير أمريكا وإسرائيل دول همه أصدقاءنا الحقيقين، أنا نفسي أكون يهودي والإسلام ده مش عاوزه ولا المسيحية. وأحسن حسنات السادات إنه صالح إسرائيل، وخلاها طايحة في العرب بدل مننا.<br />نعم للتوريث وإستكمال المسيرة"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060423/http://masr.20at.com:80/article.php?sid=1049"

[[comments]]
