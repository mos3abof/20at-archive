subject = "تدخل واضح"
author = "معلق"
posted = "2006-10-18"
text = "وضح تماما تدخل اطراف من السفارة والمخابرات السعودية لقلب هذا الموضوع الي تهريج رخيص وسب لمصر مثل التعليق السابق والتعليق الذي تم سب مصر ووصفها بانها داعرة وواضح تماما من بعض التعليقات السابقة محاولة التدخل السعودي للزيغ عن الموضوع الاصلي روحوا العبوا بعيد"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060423/http://masr.20at.com:80/article.php?sid=1049"

[[comments]]
order = 14
subject = "ناس في حالهم"
author = "فاطمه الفيفي"
posted = "2006-10-24"
text = "انا ماادري ليش هذه الهجمه علي السعوديه ومع ان السبب معروف بس لانها تطبق الاسلام وهي الوحيده في دول العالم مازالت المرأه فيهامحجبه<br />وعلي العكس المملكه لم تعترف يوما باسرائيل ولم نطبع معها ولن نطبع حتي ولو صدر من البعض ما يثير الشبهه"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060423/http://masr.20at.com:80/article.php?sid=1049"
