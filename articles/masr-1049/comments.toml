[[comments]]
order = 6
subject = "القضيه هي تصفية حسابات"
author = "سعودي يعشق مصر حتى النخاع"
posted = "2006-10-17"
text = "السلام عليكم<br />يأخونا منذ وصول حاكم قطر الجديد الى السلطه وسمتهم الصحافه المصريه حينها (دولة العيال) وهي ماخذه على عاتقها حرب شعواء على العرب جميعا من قناة الجزيره التي اساءت لجميع العرب وعلى رأسهم السعوديه الى دعم حركة الاصلاح المعارضه في لندن بشهادة احد زعمائها العائدين من لندن وبنفسه ذكرها في برنامج اضاءات في قناة العربيه... وكله لأن السعوديه استضافة ابوه الحاكم السابق الشيخ خليفه ال ثاني<br />...برنامج خاص ضد السعوديه لأن ورد في كتاب خطة الهجوم لودوورد. أن امريكا أبلغت السعوديه بموعد الهجوم على العراق لأخذ الحذر من اي صواريخ قد توجه لها من العراق ...ولم يذكر أحد أن القياده الوسطي للجيش الأمريكي الذي يدير العمليات من قاعدة السيليه في قطر<br />فهذه الندوه من هذا الباب حتى يقولوا للعرب انه مش احنا لوحدنا اللي عندنا علاقات مع اسرائيل<br />أذكروا لي دوله عربيه ماطاتهاش يد قطر والجزيره بتاعتها<br />والا نسيتوا يوم طردوا المصريين من قطر والا الصحفي المصري الذي لازال يقبع في سجونهم لانه كتب موضوع اعتقدوا انه يسخر من موزه زوجة حاكم قطر<br />ودمتم لي سالمين وكل سنه ومصر بألف خير ..واستلم شقتي التمليك اللي مافرحتش بيها"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060423/http://masr.20at.com:80/article.php?sid=1049"

[[comments]]
order = 7
subject = "إسرائيل تحرض على إيران وأوروبا تزيد ضغوطها"
author = "د وليد ( سوريا )"
posted = "2006-10-17"
text = "اعتبر رئيس الوزراء الإسرائيلي أن هناك محورا للسلام مع إسرائيل، يتشكل من دول عربية أسماها بالمعتدلة، لمواجهة التهديدات من جانب إيران.<br />وقال إيهود أولمرت بكلمة له أمام الكنيست \"أشعر بالسرور لأن محورا يتشكل من دول معتدلة بالعالم العربي يريد المشاركة في صد نفوذ إيران بالمنطقة\". وأضاف \"التهديد الإيراني لا يستهدف إسرائيل والعالم الحر فحسب وإنما يستهدف أيضا دولا عربية حولنا\".<br />كما رأى أن إيران المسلحة بأسلحة نووية والتي يدعو رئيسها إلى تدمير إسرائيل ستمثل \"تهديدا للوجود\" بالنسبة لإسرائيل، داعيا المجتمع الدولي لمنع طهران من امتلاك قدرات نووية.<br />ويتوجه أولمرت غدا الثلاثاء إلى روسيا ليلتقي الرئيس الروسي فلاديمير بوتين في محادثات تركز على النووي الإيراني.<br />والمحور الأولمرتي هو السعودية ومصر والأردن ودولة الإمارات والكويت وعمان. وهو ضد سوريا وفلسطين ولبنان أولا وإيران أخيرا. اللهم أعز المسلمين وأمحق أولمرت وحلفاءه الأشرار."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060423/http://masr.20at.com:80/article.php?sid=1049"

