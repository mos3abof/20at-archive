text = "خلاص كله عامل علاقات مع اسرائيل واللى فتح الباب مصر بس المشكلة ان اللى كانوا مقاطعين مصر عشان التطبيع بيطبعوا دلوقت الله يسامحه السادات هو السبب والله يحرقه مبارك ما صدق"
