subject = "علشان خطرى شوفو الكلام ده"
author = "حد يقولى مين طارق التايب حد يقولى مين حازم !!!!! حد يقولى مين احمد فتحى حد يقولى مين عمرو ذكى زعلانين علشان مش قولت ابو تريكه وادى كمان ابو تريكه"
posted = "2006-06-12"
text = "ايه طارق التايب ده اللى جاى يعمل مذاد على نفسه ده تعرفو على طول انه كلب للبيع كلب للبيع كلب للبيع واللى خيف من سعره يروح لاعب عمره الا فتراضى انتى فى الكوره بس ارجع وقول ان الزمالك السبب علشان من سنتين هما اللى ادولو الفرصه يبهدل فى لعيبه الزمالك فى متش الزمالك والصفاقصى خلاص بقى طارق التايب دلوقتى لعيب لما يلم لعيبه مش عندها فكره عن الكره هما لعيبه الز!!!!!!!!!! وبعدين جاين بعد سنتين تقولو طارق التايب مزاد الا هلى والزمالك لاعب كره القدم اللى بيحب الكوره لو هيلعب فى نادى درجه تانيه هيلعب انما اللى يحط نفسه فى مزاد يبقى ده مصلحه وفى الا خر الاهلى هو الخسران والزمالك اكتر يا جماعه بصو على الدورى القطرى اللى مش ليه لزمه شوفو اللعيبه اللى فيه مين<br />حرام حرام حرام حرام حرام ......... بجد حرام"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613030029/http://masr.20at.com:80/article.php?sid=470"

