[[comments]]
order = 4
subject = ""
author = "مبتعث"
posted = "2009-02-16"
text = "اخوكم احد ابناء عنيزة.. مبتعث منذ ثلاث سنوات لانهاء الزمالة الطبية في كندا..ما تصدقون اني كنت شبه منقطع عن اخبار وفعاليات فيحاء القصيم حتى قال لي احد الزملاء هنا ان فيه رابط على الانترنت يوصلك بمحطة اذاعية اسمها عنيزة FM ..ما اخفيكم ما كنت متحمس في اول الامر لكن بعد ان استمعت الى بعض برامجها وجد نفسي افتح رابط المحطة اول ما اكون امام شاشة كمبيوتري في اي مكان..عارف ان تعليقس طويل لكن تحملو شوي..على كل حال المحطة تحتاج الى عمل كثير وجهد جبار ولا اشك في ان القائمين عليها يدركون الدور المنتظر منهم في نشر المعرفة ونقل اخبار الوطن في كل مكان الى كل مكان..ايضا التميز مطلوب وانتقاء البرامج ووضوح الطرح وصراحته عوامل تشد المستمع وتجذبه للمتابعة والمشاركة..اهم شيء متابعة فعاليات الوطن في كل مجال وعدم اعطاء الفرصة للانتهازيين باستغلال هذه التقنية..سلامي لاهل عنيزة واهل الوطن كلهم..ابنكم البار/كندا"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105233756/http://20at.com/20at/ana-saudi/11299.html"

[[comments]]
order = 5
subject = ""
author = "متابع"
posted = "2009-02-16"
text = "محطة عنيزة FM تعد فكرة رائعة ورائدة في الوقت ذاته..فهي رائعة بفكرتها الكترونية الفية المتقدمة والتي تمكن من يرغب في متابعتا بالاستفادة من موادها المتنوعة والمفيدة متى ما توفر لديه اتصال بالانترنت او تمكن من الحصول على برنامجها المجاني الذي يمكنه من التقاط بثها على هاتفه المحمول..FM رائدة بسبقها الى هذا النوع الفريد من طريقة الاستفادة من التقنية الحديثة..فحسب علمي انها الاول في المملكة وهذا في واقع الامر يكفي للريادة والسبق ولكن التميز يحتاج من العاملين على هذه المحطة الكثير من الجهد والعمل الدئوب..كل ما اتمناه لمحطة عنيزة FM الاستمرارية والتطور..اعان الله القائمين عليها وسدد خطاهم..والى الاماااااااام"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105233756/http://20at.com/20at/ana-saudi/11299.html"
