text = "ليش الجماعة زعلانين من بعض؟؟؟؟؟؟؟؟؟؟؟؟ !!!!! الموضوع ما يستاهل ..المحطة توها بادية وقدامها طريق طويل الين تثبت وجودها..اللي فيها اللحين مجرد بداية اظن هذا وانا تراي ما ني متابع على طول..طريق الالف ميل يبدأ بخطوة .. والا وش تقولون يا جماعة؟؟"
