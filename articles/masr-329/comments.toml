[[comments]]
order = 0
subject = "فعلاً سيبقى نوره فى الأرض حتى بعد الرحيل"
author = "مصرى"
posted = "2006-05-16"
text = "كيف سينسى الدهر من حفر بصمته على جداره بصلاحه ومثابرته فى عمل الخير لا أملك إلا أن أقول جعل الله أعماله فى ميزان حسناته وعوض مصر بفقده خيراً وأسكنه فسيح جناته أللهم أمين أمين أمين يارب العالمين"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191318/http://masr.20at.com:80/article.php?sid=329&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "لا اله الا الله"
author = "اشهد ان لا اله الا الله"
posted = "2006-05-16"
text = "واشهد ان محمدا رسول الله<br />انا لله وانا اليه راجعون<br />رحمة الله"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191318/http://masr.20at.com:80/article.php?sid=329&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "الجنازة حارة و الميت......؟"
author = "علمانى"
posted = "2006-05-17"
text = "الجنازة حارة و الميت ارهابى قاتل هو السبب فى انتشار الارهاب فى مصر و سيطرة الفكر التكفيرى على مصر و التى منها انتشر الفكر التكفيرى لجميع انحاء العالم و ترحيب الاعلام المصرى الحكومى فى مصر به و بمخترعاته مثل الارهابى محمد متولى الشعراوى و الارهابى محمند حمارة و الارهابى محمد زغلول الحمار لهو دليل دامغ على ان نظام الحكم المصرى هو ابو كل ارهاب فى العالم"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191318/http://masr.20at.com:80/article.php?sid=329&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "انا لله وانا اليه راجعون"
author = "محمد رمضان"
posted = "2006-05-17"
text = "ياااه ... الراجل السكرة ده رحل بالسرعة دي ...<br />والله اذاعي لن تعوضه الشاشة ولا المشاهدون ....<br />انا لله وانا اليه راجعون .."
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191318/http://masr.20at.com:80/article.php?sid=329&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

