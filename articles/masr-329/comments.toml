[[comments]]
order = 5
subject = "يكفيك"
author = "صابر الجمل"
posted = "2006-10-04"
text = "كل حى يموت ولكن القليل منهم من يترك اثرا ويكفيه رحمه الله انه من قدم للمسلمين فضيلة الشيخ محمد متولى الشعراوى داعية عصره رغم انف كل حاقد او حاسد حسبهما الله ونعم الوكيل"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111122701/http://masr.20at.com:80/article.php?sid=329"

[[comments]]
order = 6
subject = "الحمد لله وكفى"
author = "مصطفى"
posted = "2006-10-31"
text = "حسبى الله ونعم الوكيل فى كل حاقد وحاسد للشيخ محمد متولى الشعراوى انزعو الغل الذى فى صدوركم أتقوا الله فى الدعاة السلام عليكم"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111122701/http://masr.20at.com:80/article.php?sid=329"
