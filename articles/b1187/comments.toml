order = 0
subject = "الله المستعان"
author = "خالد النايفة"
posted = "2006-09-04"
text = "السلام عليكم<br />هذا اقل القليل الذي تواجهه نابلس خاصة وفلسطين عامة، ففي كل يوم تقتحم القوات الاسرائيلية المدينة، وتقتل عددا من شبانها وتعتقل العشرات وتعيق المئات.<br />نابلس يحاصرها الاحتلال منذ اول يوم في الانتفاضة، قطع الطرق عليها، ومنع الطلاب من الوصول للجامعات، والتحرش الجنسي بالفتيات، كل ذلك لا يمكن ان يقف عند حد معين... اللهم انتقم من اسرائيل ومن اعوانها امثال دحلان وجبريل الرجوب، وابو مازن.<br />قيادات السلطة الفلسطينية تمر عن الحواجز دون ان يوقفها هم والعاهرات اللواتي يكن معهم \"بدي جارد\" في السيارة.؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125354/http://www.20at.com/article2.php?sid=1187"

