text = "انا وحدة من الي مروا من حجز( بيت ايبا) و شفت كل الي حكيت عنوا ,,,,,, وغير هيك شفت الشباب الي بيستغلوا الحاجز بحجة تمريق السيارة من طريق الجبال و على هذا مبلغ من الفلوس والله يعلمتوخد السيارة من ورا الحجز ولا لأ ................. ما بتمرق على اليهود"
