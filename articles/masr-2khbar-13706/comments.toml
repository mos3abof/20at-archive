text = "يا ريت الاخ المحرر الذي وضع الصورة يضع الصورة كاملة لان عقلي اكمل كلمة مصر بتتـ تكملة غير مهذبة وهذا على اعتبار ان هذا هو الوضع بالبلد الان"
archived = "2009-10-17"
