[[comments]]
order = 5
subject = ""
author = "ستخرج مظاهرة"
posted = "2009-10-14"
text = "جميل جدا<br />طبعا ستخرج مظاهرة من عيال الفيس بوك اللى قابضين كويس وطبعا الامن المركزى هيسمح بخروج المظاهرة<br />وماذا لو استغل بعض المندسين وهم 97 % من الشعب المصرى واستغلوا سماح الامن بالمظاهرة وقاموا بعشرات المظاهرات المضادة<br />المشكلة فى المندسين وهم كتار قوى تقدر تقول كل الشعب"
archived = "2009-10-17"
capture_url = "https://web.archive.org/web/20091017064714/http://www.20at.com:80/masr/2khbar/13706-14-.html"

