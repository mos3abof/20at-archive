[[comments]]
order = 1
subject = ""
author = "حمار غزة"
posted = "2009-10-14"
text = "حملت الاخبار الخفيفة اليوم ان حديقة حيوان غزة لم يكن بها حمار وحشى مخطط<br />فارسلت ادارة الحقيقة لتشترى حمارا وحشيا مخطط من الخارج ففوجئت بان السعر المطلوب ليصل الحمار الى غزة هو اربعين الف دولار<br />فجاءوا باربعة حمير محلية وخططوها بالبوية والالوان خطوطا عرضية فظهرت وكانها حمير وحشية ولكنها فى الحقيقة حمير اليفة<br />وظهرت الحمير المخططة صناعيا والاطفال يمتطون ظهرها وهم يضحكون<br />احيانا البوية بتقوم بعملها"
archived = "2009-10-17"
capture_url = "https://web.archive.org/web/20091017064714/http://www.20at.com:80/masr/2khbar/13706-14-.html"

[[comments]]
order = 2
subject = ""
author = "جون ساركوزى"
posted = "2009-10-14"
text = "اسمة جون ساركوزى ابن ساركوزى رئيس فرنسا شاب حاصل على الثانوية العامة او البكالوريا عايز يورث وفين فى فرنسا<br />المحروس الفرنساوى مسك وظيفة رئيس حى فى باريس<br />وفرنسا وقفت على رجل واحدة وهات يا تهكم ويا شتيمة على جون الفرنساوى<br />وطبعا ابوة كان يقدر يشترى لة شهادة ويؤهلة ولكن - ولكن اية ؟<br />دى فرنسا<br />فرنسا تقدر تشوط ساركوزى وابنة فى الهواء<br />احيانا بتحصل نكت فى العالم تخلينا نبكى على بلاوينا<br />خلينا نتابع جون ساركوزى ونشوف هيعملوا فية اية"
archived = "2009-10-17"
capture_url = "https://web.archive.org/web/20091017064714/http://www.20at.com:80/masr/2khbar/13706-14-.html"

[[comments]]
order = 3
subject = ""
author = "اللواء عمر سليمان"
posted = "2009-10-14"
text = "حاليا على الساحة<br />يوجد رجل مصر القوى مرشح القوات المسلحة اللواء عمر سليمان مدير المخابرات المصرى<br />وهو مقبول امريكيا وشعبيا واى حد ما اسرائيليا<br />وهو يستطيع ان يمسك بالخيوط ويتحكم فى كافة التيارات فى هذا البلد<br />عمر سليمان هو اللاعب الوحيد والباقى دمى واروجوزات"
archived = "2009-10-17"
capture_url = "https://web.archive.org/web/20091017064714/http://www.20at.com:80/masr/2khbar/13706-14-.html"

