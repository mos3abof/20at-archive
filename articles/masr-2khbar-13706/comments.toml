text = "فى الجابون بتاع النسانيس مات عمر بونجو<br />نسنوس عين امة على بونجو ابنة المحروس تولى بعدة<br />بس الجابون دى فين<br />يا خوفى لنبقى دولة الجابون العربية المتحدة<br />ويحكمنا على بونجو"
