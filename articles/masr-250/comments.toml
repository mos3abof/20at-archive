[[comments]]
order = 0
subject = "انتظروا الارهاب الاخطر"
author = "فريد"
posted = "2006-05-06"
text = "انتظروا الارهاب الاخطر وهو ليس ارهاب بسبب الدين او ارهاب لاهداف سياسية , ولكن ارهاب المتعطلين الخريجين الذين لا يجدوا فرص للعمل , فكل الدنياتقول احذروا القنبلة الموقوتة(يعني العاطلين) فهذه القنبلة يا مبارك ويا جيمي ويا ماما سوزان اوشكت علي الانفجار وستطيح بكل شيء الاخضر واليابس وبك اولا"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132539/http://masr.20at.com:80/article.php?sid=250"

[[comments]]
order = 1
subject = "ربنا يستر"
author = "واحدة وخلاص......بس مصرية جدا"
posted = "2006-05-06"
text = "وأنا موافقة على كلامك يا فريد<br />بس مش البطالة بس هي السبب<br />ده فيه حاجات كتير - الراشوة - الكوسة- الأعتقالات وقانون الطواريء - سطحية التعليم<br />وغيره وغيره وغيره......وكل حاجة تخلي الأنسان يحس بالظلم .......وأي حاجة تخلي الأنسان يحس انه مش بيعامل كالأنسان"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132539/http://masr.20at.com:80/article.php?sid=250"

[[comments]]
order = 2
subject = "ارهاب الحاكم"
author = "مصرية"
posted = "2006-05-06"
text = "اذا كانت هناك فئة متطرفه تقوم بعمليات اراهابيه ناتجه عن افكار خاطئة سببها الجهل فما هى الأسباب التى تجعل حاكم يستبد بشعبه ويمارس على ابنائه ارهاب قانون الطوارىء سوى الرغبة حتى الموت فى البقاء فى الكرسى يارب يصبح كرسى كهربائى هو وكل الكراسى الفاسده فى مصر ونخلص منكم عن قريب جمعاااااااااااء"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132539/http://masr.20at.com:80/article.php?sid=250"

[[comments]]
order = 3
subject = "غباء غريب"
author = "مقهورة"
posted = "2006-05-08"
text = "غباء غريب من هذا النظام.. يكرر أخطاءه غير مبالي بالعواقب.. يثير الأحقاد مع البدو كما فعل مع الصعايدة سابقا.. ولا يعرف سوى لغة البطش.. والنتيجة.. العنف الدامي من جديد....... وأين .. في منطقة خطيرة حدودية مثل سيناء!!<br />إنه انعدام الإحساس بالمسؤولية.. وانعدام التفكير لما بعد الخطوة الراهنة.. زهقنازهقنا زهقنا زهقنا زهقنا زهقنا"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132539/http://masr.20at.com:80/article.php?sid=250"

[[comments]]
order = 4
subject = "اللصوص هم السبب"
author = "مصري جعان و عريان و حيينفجر"
posted = "2006-05-10"
text = "لماذا نستغرب ارهاب البعض<br />ما هو رد فعل عاقل تخطف اللقمة من فهمة و يتهم بأنه فكر في مجرد تحريك لعابة عند رؤية الطعام و كله من أجل هؤلاء:<br />أولا: سجله في سرقة أموال الشعب المطحون، فخذ عل سبيل المثال لا الحصر<br />1) توفيق زغلول عضو الحزب الوطني الذي هرب بمبلغ 50 مليون (خمسون مليونا) من الجنيهات المصرية ، طبعا ساعدت في تهريبه مليشيا الحزب الوطني و المسماة زوراً بأمن الدولة.<br />2) عادل مبارك فهمي الذي هرب و معه 375 مليون جنية<br />3) محمود وهبة الذي استولى على 300 (ثلاثمائة) مليون جنية<br />4) مبارك حلمي الذي هرب و معه 500(خمسمائة ) مليون جنية<br />5) حاتم الهواري الذي هرب و معه 700(سبعمائة ) مليون جنية<br />6) ممدوح إسماعيل صاحب عبارات الإعدام الجماعي"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132539/http://masr.20at.com:80/article.php?sid=250"

[[comments]]
order = 5
subject = "محمود وهبة"
author = "محمود وهبة د‏.‏ محمود وهبة"
posted = "2006-05-21"
text = "لقد أكد لي البانكير الشهير محمود عبدالعزيز ان كل من هرب من مصر كان لابد أن يهرب. وقال لي إن كل الأسماء التي نعرفها وننعتها بالهاربين ولصوص البنوك ابرياء وضرب لي المثل علي ذلك بقصة مليونير القطن محمود وهبة والذي أجبروه علي شراء القطن بسعر »500« جنيه للطن من الفلاح ثم أجبروه مرة أخري علي بيعها للمغازل بسعر »350« جنيهاً للطن، وأصبح عليه ان يسدد قروض البنوك التي مولت المشروع بفوائدها فسافر الي أمريكا ورفع دعوي قضائية علي الحكومة"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132539/http://masr.20at.com:80/article.php?sid=250"

[[comments]]
order = 6
subject = "لك الله يامصــــــــر !!"
author = "واحد زهقان من الحكومة"
posted = "2006-05-28"
text = "لك الله يامصر سرقوا خيراتك , زنهبوا ثرواتك وجوعوا شعبك الصامت المسكين<br />الا يكفيهم ما تكدس بحساباتهم فى البنوك<br />الاجنبية - سيذهب الظلمة يوما ما وسيكتب التاريخ عن جرائمهم - ألا يخافون يوم الحساب , يوم تنشر صحائفهم على الملأ ويرى الخلق فضائحهم اما من وازع من دين أو ضمير , الا لعنة الله على الظالمين"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132539/http://masr.20at.com:80/article.php?sid=250"

