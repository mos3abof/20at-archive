[[comments]]
order = 1
subject = ""
author = "اامراة من مصر"
posted = "2009-12-02"
text = "هى امرأة من مصر<br />بتبين ازاى غالبية المصريين الغلابة عايشين<br />ام اشرف وام بيتر وغيرها عايشيين على مورد من غير مصر<br />ام اشرف وام بيتر ولادهم بيشتغلوا فى احدى الدول العربية ويرسلون اليهم مصروف شهرى - يعيشون منة<br />معظم الاسر تعيش على ذلك<br />ام خير مصر فيسرق ويوضع فى بنوك سويسرا"
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204005555/http://www.20at.com:80/masr/profile/14219-q-q-.html"

[[comments]]
order = 2
subject = ""
author = "مشجع شهم"
posted = "2009-12-06"
text = "لن أنسى هذه الحادثة المفجعة لطالما حييت !<br />فإني رجل مصري أسكن في الجزائر و كانت هذه أكبر غلطة في حياتي فبعد المباراة بين الجزائر و مصر بأسبوعين طعنني رجل في إصبعة قدمي اليمنى فبعد أن خزلتني الجزائر بلدي الثاني و مصر بلدي الأول انتقلت للعيش في سورية بلدي الثالث و لغتي الأم و من وقتها إلى حد الآن لم أشاهد مباراة كرة قدم في حياتي و أنا أرجو أن تساعدوني في ايجاد طريقة للانتقام من هذا الرجل الخبيث"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014631/http://www.20at.com:80/masr/profile/14219-q-q-.html"

