author = "ولسة هتشوفوا"
posted = "2009-06-18"
text = "56 حكم اعدام فى شهر واحد<br />ولسة ياما هتشوفوا<br />مش منعتم تدريس الدين فى المدارس والمدرس المتدين القدوة للطلبة فصلتوة او حولتوة الى اعمال ادارية على حسب تعليمات امريكا ولمنع الارهاب<br />وحتى الوعاظ فى الجامع يتم تعيينهم بواسطة امن الدولة<br />يبقى لازم العيار ينفلت لان مفيش قدوة ولا تربية ولا مبادىء<br />اخ بيقتل اخوة وزوجة بتقل زوجها ومهندس بيقتل اسرتة - غابة وحوش كل واحد فيها بيقتل علشان يسرق وينهب ويقتل حتى علشان موبايل<br />ايام الحكم الناصرى الاشتراكى الالحادى كان فية مدرسين ملتحين وكانت عبقريات العقاد زى عبقرية عمر وعبقرية خالد تدرس فى الثانوى<br />دلوقتى بيجيبوا راقصات للطلبة فى المدارس ترقص<br />انتظروا البلاوى جاية من جيل غير متربى"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620065249/http://www.20at.com:80/masr/t7kyk/12403-2009-06-18-12-24-26.html"

