text = "ranran فى حاجات فى كلامى فهمتيها غلط انا ما قلتش ان كل اللى بيشتغلو من البنات عشان مظهرهم ولا الست المعيله ماتشتاغلش انا اللى قصدته من نماذج شفتها كتييييييييير اوى ان فى بنات كتير بتشتغل فراغ هى اصلا مش محتاجه الشغل فى اى حاجه ولا حتى بتشتغل عشان تحقق اى حاجه طموح ولا حاجه بتشتغل عشان زهقانه تقعد فى البيت انا قصدى ان النماذج دى هى اللى بلاش تشتغل وتسيب المكان اللى هتاخده لحد محتاجه بجد واذا كان على انها تملا الفراغ ولا زهقانه فى حاجات كتير تقدر تساعد فيها مجتمعها وتثبت فيها نفسها بردو لو حبت من غير ما تحارب وتجيب وسايط عشان تاخد وظيفه مش لازمها فيها اى حاجه<br />ده قصدى بان اللى مش محتاج الشغل ومش عايزه ما يشتغلش ويسيب المكان لحد محتاجه فعلا<br />وحاجه تانى انا مقصدتش انى احجم دور الرجل فى انه يجيب فلوس وبس دى قضيه تانى حضرتك هندخلى فيها انا قصدى ان اساس البيت فى الدخل هو الراجل مش الست وهو محتاج الوظيفه اكتر عشان هو اللى هيفتح بيت فى الاساس"
archived = "2010-03-05"
capture_url = "https://web.archive.org/web/20100305101402/http://www.20at.com:80/banat/variety/15092-2010-01-28-14-27-01.html"
