text = "صدقيني يا 22roma الاسلام فعلا أقر بتعمير الارض من غير تحديد للجنس .. ودة معناة ان عمارة الأرض مش بس بالعمل لأ بردو بالتناسل و تربية أجيال متدينة وصالحة .. وماينفعش نقول ان دة واجب الست بس هو التربية و الرجل العمل لكسب المال .. لأن ببساطة احنا كدة بنحجم دور الرجل بس ان كل دوره في الحياة هو انه يجيب فلوس ومافيش انسان سوي نفسيا هتلاقيه طالع من بيئة شاعر فيها بحنان وعطف الأم فقط و احساسه ان أبوة كل وظيفته في الحياة هي انه يجيب فلوس !!!<br />معنى كدة ان عمارة الأرض (عمل+تناسل) وظيقة البشر (ذكر+أنثى)<br />دة غير ان ماينفعش أبدا نعمم و نقول ان كل تجارب الستات اللي بيشتغلوا مابيقدروش يكفّوا أسرهم و يهملوهم .. لأن حوالينا في نماذج كتيرة قوي لستات بتشتغل وناجحة في شغلها وبيتها مع بعض وكلنا عارفين ان آخر احصائية في مصر بتقول ان أكتر من 90% من نساء مصر \"معيلات\" .. يائما جوزها مات وهي معيلة .. او معندوش دم وهجرها هي و عيالها فبقت معيلة .. او او .. الأمثلة كتير للي عايز يشوف الموضوع بنظرة موضوعية !!!"
archived = "2010-03-05"
capture_url = "https://web.archive.org/web/20100305101402/http://www.20at.com:80/banat/variety/15092-2010-01-28-14-27-01.html"

