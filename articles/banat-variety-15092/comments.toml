posted = "2010-02-05"
text = "ثالثا مفيش شركة بتاخد واحدة وتشغلها في مكان لمجرد ان مظهرها كويس!!صاحب العمل همه الأول والأخير هو توظيف أقل عدد من المظفين وأكثرهم كفاءة عشان يقلل المرتبات واسألي أي حد بيشتغل في قطاع خاص هتلاقيه بيقولك ان مديره بيطلع عينه فالشغل وانه بيعمل شغل المفروض يقوم بيه 3 معاه فمينفعش أبدا نقول ان صاحب العمل واخد واحدة عشان مظهرها دة كلام غير منطقي أبدا الا لو كنتي بتتكلمي على وظيفة السكرتيرات اللي بيخترها عشان بردو حاجتين كفائتها+مظهرها مش هايجيب يعني واحدة مظهرها كويس و حمارة فالشغل عشان تبهدلّه الدنيا وكمان يديها مرتب!! دة كلام مش مظبوط خالص يعني<br />وأي حد بيشتغل أولا عشان الماديات كلنا بنشتغل عشان نجيب فلوس ونعتمد على نفسنا بعد ما أهلنا تعبوا فينا<br />وبعدين ان مش معاكي الدنيا كلها بتتكلم عن البطالة و ان السبب في دة ان البلد مش قادرة حتى تكفل وظيفة محترمة للخريج فامينفعش احنا نيجي نقول ان شغل البنت هو اللي حجب الفرصة عن الولد واذا كنتي شايفة انهم هم اللي مادوش فرصة للولد يثبت نفسه فدي برده مشكلته ساعتها هو المفروض ينمي نفسه وساعة لما يتفوق عليها صدقيني هياخد مكانها مينفعش نعاقب البنت على كفائتها!"
archived = "2010-03-05"
capture_url = "https://web.archive.org/web/20100305101402/http://www.20at.com:80/banat/variety/15092-2010-01-28-14-27-01.html"

