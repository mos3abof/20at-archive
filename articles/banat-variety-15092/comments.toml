text = "واذا كان البعض شايف ان البنت ابتدت فعلا (نوعا ما) تثبت نفسها و محاولة كتير من جمعيات المطالبة بحقوق السيدات فدة لأن الفتيات والسيدات فعلا ظلّوا فترة كبيرة جدا مهضوم حقوقهم بسبب الضغط اللي ولّده عليها المجتمع الذكوري ..<br />دة حقها اللي يادوب ابتدت تاخده من (سنين) بسيطة جدا أمام (قرون) من القهر .. دة هو العدل<br />وشكرا"
