text = "الموضوع ده كويس جدا عشان هو فعلا سبب اغلب البطاله وماينفعش نقول البلد مطالبه بتوفير فرص عمل للولاد والبنات اذا كان فى كتير من البنات بيشتغلو عشان مجرد الخروج وتفك عن نفسها مش عشان حاجه تانى حتى لو كانت كفؤ فى عملها<br />والشركات اذا كانت بتعين بنات كتير عندها ممكن عشان الكفاءه بس الاغلب بياخها منظر ومظهر حلو للشركه<br />وكمان ماينفعش نقول البنات اتعينو عشان هما اكفأ من الولاد عشان هما اصلا ما دوش فرصه للولد ده انه يثبت نفسه هما ادو الفرصه للبنت وهو لأ<br />ورايي اذا كانت البنت مش فى حاجه ملحه للشغل كماديات مثلا يبقى بلاش شغلها احسن<br />وربنا لما امر بعمارة الارض اه طلبها من الولد والبنت بس كمان كان فى تحديد نوعا ما لمكان كل واحد فيهم المراه المسلمه عملها فى بيتها وولادها هى دى اصعب مهمه اللى قليل اوى بينجح فيها ما هو بناء جيل صالح ده اعمار للارض بردو"
archived = "2010-03-05"
capture_url = "https://web.archive.org/web/20100305101402/http://www.20at.com:80/banat/variety/15092-2010-01-28-14-27-01.html"

