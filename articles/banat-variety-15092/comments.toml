text = "انا معاكى جدا فى الموضوع ده بس يا ترى هيبقى فى استجابه ولا لأه؟؟؟؟؟؟؟؟؟؟؟؟ ؟؟؟؟؟؟؟<br />وبعدين انا شايفه ان الولد اكتر فعاليه من البنت -فى الغالب يعنى-<br />مثلا يعنى لو استغنت بنات كتير عن شغل الوظائف اظن ان ده هيحل جزء كبير من مشكله البطاله عند الشباب وبالتلى هيقدروا يتجوزوا ويفتحوا بيوت وهتقل نسب الانحراف والادمان<br />عموما دى مجرد وجهة نظرى"
