text = "مشكلة البطالة يا لولو مش السبب فيها البنت .. المفروض ان الدولة توفر لكل من الشاب و الفتاة العمل .. وكون ان الدولة مقصرة في دة فدة مش معناه ان احنا نطلب من البنت انها تضحي وتتنازل عن طموحاتها ومستقبلها عشان توفر مكان لراجل !!!!!<br />ثانيا .. اي شركة دلوقتي وخصوصا القطاع الخاص همه الأول و الأخير هو تحقيق المكسب بأقل عدد من الموظفين و الرواتب .. فتلاقيهم دايما بيختاروا الأكفأ لشغل الوظيفة .. سواء ولد أو بنت ..<br />وأنا ضد الفكرة في التوبيك ان طلب الشركات فتيات للعمل يعتبر ظلم للرجل !!!!! هو حقيقي فعلا ان عمالة البنات زادت ولكن دة بسبب تأكد صاحب العمل من كفاءة الفتاة ولباقتها وقدرتها على اثبات نفسها في أي مكان .. والا ماكنش فضل الفتاة عن الرجل لشغل هذا المكان<br />ثالثا .. ربنا أمر الناس بعمارة الأرض .. ولم يقتصر تعميرها على الرجل فقط .. بل أمر البشر جميعهم (ذكر وأنثى) بذلك بالتعمير ..<br />اذا يا جماعة الكفاءة هي الحاكم الأول و الأخير بغض النظر عن اللون أو الدين أو الجنس … و دة هو اللي بيقوله ديننا الاسلامي العادل .."
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122425/http://www.20at.com:80/banat/variety/15092-2010-01-28-14-27-01.html"

