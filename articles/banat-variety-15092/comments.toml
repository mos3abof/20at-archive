text = "وبعدين يا roma بالله عليكي .. انتي ان شاء الله لما تتجوزي وربنا رزقك ببنت .. وكرمها في حياتها و لقيتيها ماشاء الله شاطرة وخها كبير وذكيو وتفوقة في دراستها ما شاء الله وبعد ماتخرجت جتلها وظيفة كبيرة ومحترمة وهتحققلها اللي هي وانتي كانتوا نفسكوا فيه هتقوليلها ساعتها لأ ماتشتغليش عشان في بطالة وان يجي ولد ياخد مكانك عشان تسيبيله فرصة يشتغل بدل ماهو قاعد كدة؟؟!<br />عالعموم دي وجهة نظري وانا بردو بحترم وجهان النظر الأخرى .. لأن مفيش حد زي التاني .. واكلنا مختلفين في أفكارنا وتوجهاتنا .. زكل واحد شايف الصح من وجهة نظرة وشكرا"
