text = "لى تعليق بسيط على كلامكم ارا ان المراة المسلمة تاخز حقها اكثر من اى امراة فى عالم جائوا فى الغرب وعملوا دراسة عن المراة المسلمة والمراة فى الغرب فوجدوا ان حوادث الاغتصاب فى الغرب كثيرا جد الشذوذ كثير جدا المراة تضرب وتعمل وياخز حقها ووجدوا المراة فى الاسلام يوصوا عليها الرجل ويتكفل بها ويعطيها حقها ويحافظ عليها لكن لاسف الغرب لايرضيه ان تكون المراة المسلمة افضل فتكلم عن حقوق الانسان فحقوق المراة فالحجاب فالنقاب لابد وان تتعرا المراة المسلمة لتكون متحضرة وتاخز حقها ولاسف فيكم اناس هم جهل وشياطين بنى ادم وسطكم يريدونكم عراه ليشاهدو اسمعوا والله المراة هنا فى غرب تحقد عليكم وانتم تمشون ورائهم فقط وتقولو نلبس حجاب شرعى كيف حجاب شرعى على بدى قصير وبطلون ضيق وجيب قصير شئ يضحك"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122425/http://www.20at.com:80/banat/variety/15092-2010-01-28-14-27-01.html"

