[[comments]]
order = 1
subject = "مجرد رأي"
author = "انسان من مصر"
posted = "2006-01-24"
text = "الرئيس عندما يلعب ويجا عنوان يشد الذي يقراة فهو يناقش ما عاصرناة و ما ننتظرة مثل هذه الكلمة البغيضة التوريث التي لا نعرف ماذا سيحدث لو تم التوريث فعلا هل سنتحرك ام سنكتم في انفسنا مثلما يحدث في كل مرة هل سنقف مكتوفي الايدي ام سنرد و ماذا سيكون ردنا اهو بالمظاهرات ام بالحرق ام بالصمت ام بماذا ...ما كتبة الاستاذ محمد الدسوقي يستحق علية الاحترام و لكن هناك بعض الكتاب الذين ينقدون الئيس بطريقةلا يحق لهم ان ينقدوا بها لماذا نقلل من شان الرئيس او عائلتة فلننقد الرئيس في حدودالمعقول اذا كنت ضد الرئيس فلتنقدة نعم فكلنا من حقنا ان ننقدة و لكن ... هو الرئيس رمز الدولة مهما حدث و مهما كان ملحوظة شديدة الاهمية في ردي هذا او تعليقي هذا انا لا اوالس او انافق فانا اكتب ما في نفسي و ما يملية علي ضميري و هذا رايي مجرد راي و اللة الموفق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125844/http://www.20at.com/article2.php?sid=324"

[[comments]]
order = 2
subject = "مالنا وماعلينا ..!!"
author = "وليد حجاب"
posted = "2006-01-25"
text = "أنا مع الزميل ( إنسان من مصر ) في رأيه .. ذهب كثيرون هذه الأيام لنقد الرئيس وأسرته ونجلاه بالتهكم والسخرية اللاذعة ..البعض ممن إنتقد كان موضوعياً والكثير أحب أن يُُُظهر مدى تفهمه للسياسة ودرايته العظيمة ببواطن الأمور .. أنا لست ضد ماكتب ( محمد الدسوقي ) ولكن .. أن ضد النقد (عمال على بطال) بمناسبة وبدون مناسبة لمجرد أن يحظى ماأكتب باهتمام القراء لأنه عن رئيس الدولة وزوجته ونجله .. هذا ليس من الدين في شيئ ..<br />وشكراً"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125844/http://www.20at.com/article2.php?sid=324"

[[comments]]
order = 3
subject = "لابــد من الإحترام"
author = "م.بــاســــم"
posted = "2006-01-25"
text = "السلام عليكم و رحمة الله<br />أنــأ مع الزملاء الســابقين في ما قـالوا، لابد أن نباعد بين أهوائنا الشخصية و بين النقد البنــاء ، فنحن اجتمعنا علي أن سيــادة الرئيس قد أخطأ في حق شعبه كثيـرا و بأخطـأء فـادحة ، لكن هذا لا يجعلنا نستهزأ به و بولديــه عمــال علي بطـال . و أيضا بأن نكون منصفين فمثلا أعجبني أن كلا من علاء و جمـال يحضـراالمبـاريـات وسـط جمـاهير الدرجة الأولي و ليس في المقصورة الرئيسية مع كبـار الزوار و لكن هذا لا يمنعني بأن أنتقد أن كلا منهما قد استغل سلطة أبيه بأن يغترف من ثروات البلد بدون وجه حق و بأن يسيطر جمـال علي الحزب الحـاكم بهذا الشـكل الفج.<br />ديننا الحنيف و أخلاقنـا تدعونا لأن لا نهين أي انسـان مهما كان دينه أو جنسه و في نفس الوقت أن لا نسكت علي الفسـأد و الطغيان حتي و لو كان الحاكم نفسه، و هذه معـادلة صعبه ضاعت في زماننا هذا<br />اللهم اهدناو اهد سـائر الأمة الي الطريق المستقيم ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125844/http://www.20at.com/article2.php?sid=324"

[[comments]]
order = 4
subject = "برافو يا ويجا"
author = "نيفين"
posted = "2006-01-25"
text = "انا اكيد مع الزملاء السابقين بس بمناسبه ما كتبه الدسوقى عايزه اقولوكو اخر رساه وصلتنى ف العيد اللى فات<br />الرساله بتقول<br />الرئيس هيثم جمال مبارك نجل الرئيس السابق جمال مبارك و حفيد الاسبق حستى مبارك يهتىء الامه المصريه بحلول عام 2075<br />و يطمئنهم بأن السلطه فى مصر لم و لن تورث<br />كل عام و انتم بخير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125844/http://www.20at.com/article2.php?sid=324"

[[comments]]
order = 5
subject = "صباح الفل"
author = "لور دكاش"
posted = "2006-01-25"
text = "هو ايه النظام يا جدعان يا بتوع التعليقات اللي فوق.. هو احنا في عشرينات ولا موقع الحزب الوطني الديمقراطي.. ايه حكاية إنجازات الرئيس.. وحاسبوا على مشاعر الريس لحسن أصله رهيف قوي.. وآخرتها اللي بيقول كلمة على حاكم ظالم وحرامي طلعتوه كافر.. هو انتو مين بالظبط..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125844/http://www.20at.com/article2.php?sid=324"

[[comments]]
order = 6
subject = "الى الاخوه اللى فوق"
author = "اناطبعا باحترم ذوق واخلاق الاخوه اللى وفق"
posted = "2006-01-25"
text = "بس ياريت حد فيهم يجرب يدخل قسم شرطه واللا اقولكم بلاش مش هايستحملو ، ياريت يجربو يقولو صباح الخير لملازم اول يكون مقريف وماعملش اصطباحه لسه ويشوفو ازاى هايتكلمو كويس عن الطاغوت واسرته اللى ياما اذلو المصريين بدون ذنب ، واكبر اذلال للمصرين هو توريثهم كالمتاع البالى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125844/http://www.20at.com/article2.php?sid=324"

[[comments]]
order = 7
subject = "اللى مش عجبه البيت له اربع حيطان"
author = "اروى الطويل"
posted = "2006-01-25"
text = "ايه يا جماعه زعلانين ليه احنا مبسوطين جدا فى ظل قيادة السيد رئيس الجمهورية وصاحب الضربة الجوية الاولى صاحب الفخامة وله كل الاحترام ربنا يخليه ويبارك لنا فى اياديه الممدودة ويمد فى عمره كمان وكمان مش كفاية انه مخليكوا تعيشوا فى ارض الفراعنة وارضه دا انتوا قليلى الزوق بشكل انا اؤيد واوافق كل قرارات سيادته الحكيمة من اولها لاخرها من اصغرها لاكبرها واؤيد قيادة السيد جمال وبعده بتلاتين سنة هيثم وبعدين ...... لانى لااطمئن على شعبى الا فى ظل قيادته الحكيمه ولان الذكاء ينتقل بالوراثة والغباء أيضا والسٌُُلطة والمنصب وكل كل حاجة فانى اؤيدوبشدة تناقل الرئيس ومن بعده احفاده واحفاد احفاده للسلطة _بفتح السين طبعا_ وسلملى على مصرورجالة مصر *التوقيع* موالسة لسه بتتعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125844/http://www.20at.com/article2.php?sid=324"

[[comments]]
order = 8
subject = "إلى أخوة اللي تحت واللي في النص كمان ...!"
author = "وليد حجاب"
posted = "2006-01-26"
text = "ياسادة يا أفاضل .. قولوا واتقدوا كل ماهو خاطئ واكشفوا كل فعل تم التستر عليه .. انتقدوا كل شئ .. ولكن ببساطة لايجب أن نفقد النقد موضوعيته بأسلوب غاية في السطحية .. ولا داعي لاتهامنا بالموالسة ولا يجب أن يكون تعليقنا على المقال برأي يخالف رأيكم أننا أعضاء بالضرورة في الحزب الوطني .. ولا نقد يبنى على نوايا بل على أفعال تمت تقبل التحليل والمناقشة<br />وشكراً"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125844/http://www.20at.com/article2.php?sid=324"

