[[comments]]
order = 12
subject = "ربنا يعدينا منه علي خير"
author = "nemnem"
posted = "2006-03-16"
text = "والله العظيم احلي كلم واحلي شغل وتسلم ايدك يامحمد يادسوقي بس في حاجه كل الي احنا بنعماله ده واله هيغير اي حاجه والي هما عيزين يعمله هيعمله والي مش عاجبه يخبط راسه في اتخن ميدان وهيقلولك هيه دي الديموقراطيه انا كنت واقف في المظهرا بتاعت انهرده وعجبتني جدا الي انا عاوز اقوله انا احنا مش غلطنين بس ابويا وابوك جدي وجدك هما الي سيبلهم الجام علي البحري وربنا يعدينا منه علي خير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125844/http://www.20at.com/article2.php?sid=324"

[[comments]]
order = 13
subject = "اتقي الله فينا شويا"
author = "NEMNEM"
posted = "2006-03-16"
text = ">> لرئيس مبارك لقي فانوس سحري قام دعكه<br />>> فطلعله منه ابليس<br />>> قاله : شبيك لبيك تطلب ايه؟<br />>> قاله: بص بقي يا عم ابليس انا عملت فى الشعب بتاعي كل حاجه..قوللي<br />>>بقي علي حاجة جديده اعملها !<br />>> ابليس قاله: بس كده..بسيطه..هات ودنك..وش وش وش وش وش<br />>> قام الرئيس قاله: ايه ياعم لعب العيال ده..ده كلام برضه<br />>> قام ابليس قاله: بلاش دي..هات ودنك...وش وش وش وش وش<br />>> قام الرئيس قاله: ايه يا عم ده ...انت شكلك ابليس نص كم ولا ايه<br />>> ابليس قاله : معقول الفكره دي مش عاجباك!!..طب خد دي بقي..وش وش وش<br />>>وش<br />>> قام الرئيس قاله : ياعم انت شكلك كده لا ليك في العفرته ولا<br />>>حاجه..هات ودنك بقي اقولك انا بعمل ايه في الشعب بتاعي....وش وش وش وش<br />>>وش<br />>> قام ابليس وشه اصفر و قاله: يا راجل اتقي الله!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125844/http://www.20at.com/article2.php?sid=324"

