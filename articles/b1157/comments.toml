text = "كنت اتمني ان يموت هذا القرد عمرو خالد ايام مشكله لبنان ، عمرو خالد ده نصاب كبير اوي زي لاخوان جماعة ارهابية مسلحة و هي ألام لكل الجماعات الدينية المتطرفة في الشرق ألاوسط كله و المسؤل ألاول عن نشر التعصب الديني في مصر و لو تمكنت من حكم مصر فسوف تعود بمصر الي ما قبل عصر محمدعلي و سوف تكون الحياة السياسيه و التحول الحضاري أول ضحاياها- كل هذه حقائق يعرفها الجميع و لكن النفاق و ألاتفاق و الخوف و العرف يرهب الكثيريين من كونها متسربله بوشاح الدين . ويكفي دليلا ما قاله النصاب الاكبر ` عاكف` حين قال ` طظ في مصر و أهل مصر و أبو مصر ` ."
