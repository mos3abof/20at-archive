subject = "الى الاخت مؤمنه والحمد لله"
author = "خالد"
posted = "2006-09-24"
text = "ان شاء الله هتحشرى مع عمرو خالد ومع كل من اساء الى الرسول والمسلمين قال الست المؤمنه بتقول ان اختها شافت فى رؤيه ان الانبياء انفسهم بيسلموا على عمرو خالد يا صلاة النبى على العلم والتقوى الانبياء العظماء بيسلموا على عمرو خالد الى الاخت مؤمنه والبنت اللى شافت الرؤيه انا بطلب منك انك تتغطى وانتى نايمه والسلام عليكم ورحمه الله وبركاته"
archived = "2006-11-02"
