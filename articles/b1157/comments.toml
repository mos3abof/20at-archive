subject = ": اختفاء عمرو خالد في لبنان !"
author = "عبد الرحمن الصومالي"
posted = "2006-08-29"
text = "السلام عليكم ورحمة الله<br />أختي سعودية ليس لك حق أن تتهجمي بهذا الشكل المخزي على الداعية الإسلامي عمرو خالد، أرجو أن تتراجعي عن هذا التهجم اللي يعود بضرره على فاعله، إذلم تكن مقتنعة بالنهج الذي يتبعه ا لأستاذ عمرو لممارسة عمله الدعوي ،فعليك أن تبحثي عن غيره ،فهناك العشرات من العلاماء منمن يسلكون سلاكا آخر في الدعوة ويخالفون الأستاذ خالد-حفظه- .اقول لك وباحترام شديد فارض الله واسعة، وإياك والتطاول على الدعاة،فهذا إثم.<br />أسال الله لك وللمسلمين جميعا الهداية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 6
subject = "حرام عليكم"
author = "تامر فؤاد"
posted = "2006-08-29"
text = "لكل من سبقني بالتعليق على موضوع عمرو خالد:<br />اولاً: عمرو خالد ليس في حاجة لأن يدافع عنه أحد لأن انجازاته واعماله تشهد له<br />ثانياً يا مسلمين هذا ليس اسلوب حوار وليس من الاسلام ان ننادي بعضنا بــ يا سعودية ويا مصري ويا كويتية الخ<br />قال تعالى( ولا تنابذوا بالالقاب )<br />ثالثاً: كيف تريدون من الله ان ينصر امتنا وانتم تكنون كل هذا الحقد والكره لبعض<br />ارجوكم راجعوا انفسكم وحاسبوا انفسكم قبل ان تحاسبوا<br />رابعا: ليس ابداً من اخلاق المسلمين ان نسب بعضنا ونقول يا غبي او يا غبية<br />ارجوكم استيقظوا واعتذروا لبعض حتى نخلص النية لله وينصرنا بجد<br />وجزاكم الله كل خير وهداكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

