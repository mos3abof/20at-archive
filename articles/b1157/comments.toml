[[comments]]
order = 4
subject = "أتمنى لكم الهداية"
author = "أبو فادي"
posted = "2006-08-29"
text = "الاخت سعودية : هداك الله للطريق القويم<br />يعني تتهمين الراحلو تسيبن عليه في غيابه<br />هل هذه مواصفات المسلم الصحيح<br />اذا كان لا يعجبك طريقة عمرو خالد في الدعوة فلا تسبيه<br />ولكن اتبعي طريق دعوة يروق لكي و لا تسبي في الناس اعتباطاودون أدلة<br />وان وجدت الادلة فتمني له الهداية<br />وفقكم الله و أعان المسلمين على ما هم فيه من بلاء<br />واستغفر الله العظيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
