text = ")يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ جَاءَكُمْ فَاسِقٌ بِنَبَأٍ فَتَبَيَّنُوا أَنْ تُصِيبُوا قَوْماً بِجَهَالَةٍ فَتُصْبِحُوا عَلَى مَا فَعَلْتُمْ نَادِمِينَ) (الحجرات:6)<br />ادعوكم جميعا الى قراءة النصيحة المكتوبة قبل مشاركتين او اكثر قليلا فهي حقيقة مجردة كم ناديت بها ولكن هذا الاسلول القديم يجدي نفعا دوما بين الاشقاء مع الاسف ودوما ما نجد من يختفي في الظلام ويرمي بفتنته بين الناس ويشاهدهم يتخبطون<br />واقول لكاتب المقال او للسيد/ رئيس جمعية صناع الحياة بجنوب لبنان الموقر<br />عمرو خالد مفكر باحث في احوال الامة فكر واهتدى بمساعدة مستشارين الى فكر صناع الحياة وامنتم به ووجودكم نجاح لفكرته ولخطواته اثابه الله واعمالكم الخيره في ميزان حسناته ربنا يتقبل منا ومنه وسائر المسلمين صالح الاعمال ويرزقنا الاخلاص<br />اخيرا جمعيات صناع الحياة منتشرة بالعالم وهي كيانات ولدت بايمان اصحابها بالفكرة وليست بايدي عمرو خالد ويجب ان تصمد وتخطو وحدها والا لن يكون عمرو ولا جيوش امثاله قادرة على حملها على الاستمرار ولا تحملوا الرجل ما لا يطيق واخيرا اثابه الله بصبره وقدرته الفائقة على العمل والنجاح في ظل هذا الجو والتربص واقول لمن يخالفوه لكم حقكم في مخالفته ولكن تحلوا بالادب والاخلاق فهو داعيه اسلامي ان كنتم مسلمين فلا يصح ان تسئؤا له وان كنتم غير ذلك فاصلاحه ايضا يصبكم بالخير ولا نقبل منكم الاساءة له<br />واستمعوا لمن يناسبكم ولا تعنفوا من تختلفون عنه مادمتم قادرين على التمييز بين الصواب والخطأ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

