[[comments]]
order = 28
subject = "دخت"
author = "maro"
posted = "2006-09-01"
text = "ردا علي الاستاذ الكريم وائل عباس<br />انا الصراحة دحت<br />واضايقت<br />ما بقتش عارف احنا الاخوان متشددين ولا متسيبين<br />ولا ايه نظامنا<br />ابراهيم عيسي يقول فينا حبة مسيحية وبنسامح زيادة<br />وانت تقول عاوزين الحكم<br />يا تري الناس عاوزه ايه بالضبط<br />وبتفتكرنا ايه<br />بقولك انا نفسي تروح اقرب مسجد اخوان وشوفهم وبعدين تعالي قول رايك هنا وانا مستنيك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 29
subject = "لا تعليق"
author = "تسنيم الريدي"
posted = "2006-09-02"
text = "لا حول ولا قوة إلا بالله العلي العظيم ...<br />بصراحة لا ادري اين ادارة الموقع الفاضل من هذه الكلمات من الزوار ...<br />كذلك لي وجهة نظر أحب ان أعرضها ... النقد الداخلي أفضل بكثير من النقد عبر وسائل الإعلام فإن كان الهدف من الموضوع جميل إلا إنه حمل الأستاذ عمرو فوق طاقته وهو بشر مثلنا وأتاح فرصة للتجريح فيه بهذا الشكل ... والله المستعان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 30
subject = "أخلاق الدين"
author = "وفاء &وليد"
posted = "2006-09-02"
text = "الراسل او المرسلة الكرام أيخطئون في رجل سار وراء الدين بمبدأبلغوا عني ولو أية أهذا جزاء رجل تحجبت على يديه الكثير وان لم يكن فهو لديه زوجة وأطفال فهل عندما يتوفاه الله ستعولين أو ستعول أطفاله وتشعرهم بحنان والدهم أتقوا الله ياأخواني في أنفسكم فنحن لانستطيع تخيل شعور اليتم إلا من عاش فيه وليست هذه أخلاق الدين لالمسلم ولاغيره والدين المعامله والكلمة الطيبة صدقة والدعاء ترد عليه الملائكة على الداعي ولك مثله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 31
subject = "كفاية بقي"
author = "معتصم بالله"
posted = "2006-09-02"
text = "ممم و باعدين ؟؟ , يعني انا مش عارف انته اية الكلام اللي قاعدين تتكلموا فيه ده؟؟ , يعني عشان الست سعودية قالت كلمتين خلاص هتخلوا كل التعليقات عن الست سعودية .<br />اولا : ماحدش يجرؤ يقول كلمة وحشة علي عمرو خالد , و انا الحقيقة مش هقعد امدح في ا.عمرو خالد لأن اعماله و انجازاته هي اللي تقدر تتكلك عنه مش انا , و يكفيه شرفا انه اول واحد يدعو للنهضة بعد سنين و سنين من الخمول و التفاهة .<br />ثانيا: بدل من ما تقعدوا تشتموا في عمرو خالد وواحد مناصر ليه فكروا بعقل و قولوا لنفسكوا اية اللي هياخده عمرو خالد و ايه النصب اللي عمله عشان نقول عليه كده؟؟ , هل واحد منكم و منك انتي بالذات يا حاخة سعودية نصب عليكي في ايه , خد منك فلوس؟؟ , اجبرك تلبسي حجاب ؟؟ , و اخيرا اتقوا الله في الراجل ده و ربنا يوفقوا كمان و كمان<br />لمزيد من المواضيع المثيرة زور الاتي:<br />http://moatassembellah.blogspot.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 32
subject = "قال (ص) لاءن يهدى الله رجل على يديك خير لك من حمر النعم"
author = "المجهول"
posted = "2006-09-02"
text = "يا اخوانا ايه اللى احنا عماالين نقوله دةولا اللى انتى بتقوليه يا سعوديه انتى ولا البلد اللى انتى منها ربنا هدا على ايدهم ربع اللى ربنا هداهم على ايد عمروخالدليه كدة بس ليه كدةشوفو من امتى الشباب فى ضياع والبنات فى متاهالراجل دة عمل ايهعنل كتير وشوفو ربنا عمل ايه معاة فى مصر كان بيحضر له اد ايه فى مسجد المغفرة وبعد ما العدد زاد انتقل الى مسجد الحصر ى فى اكتوبر وجت الحكومه المصريه اخرجته من مصر بتاعتهمربنا وقف بجوارة بدلا من كان يسمعه اهل مصر فقط بقى يسمعه الناس فى جميع انحاء العالمصح ولا غلط بزمتك مشهنا فى معجزة يعنى خارج من بلدة مترود والسلام ختام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

