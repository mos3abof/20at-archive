posted = "2006-09-07"
text = "في الحقيقه بتفكروني بإجتماعات الجامعه العربيه دائما غير متفقين ياجماعه الخير اتعلموا من الاتحاد الاروبي ليسوا دائما متفقين ولكن القرار دائما لصالحهم جميعا ثم ما وجه المشكله في اختلاف وجهات النظر انا قآت كل التعليقات واستفدت من الجميع سواء مدح او زم وايضا استشهاد من القرآن الكريم ملاحظتي عليكم البعض بالطبع لا يوجد داعي للسباب لان توصيل وجه النظر يكون بالهدوء و المنطق اخيرا واعتبروها دعوه من اختكم الصغيره تعالوا نحب بعض ونحط ادينا في ايد بعض لان الغزو علينا رهيب جدا وسكرا"
