subject = "هام جدا"
author = "dr wyg"
posted = "2006-09-04"
text = "ياجماعةاناعايزةاقول كلمةحق عمروخالددةفعلاانسان جديربالاحترام يكفى انةاول واحديحمل على عاتقة هموم الامة وآمالهاويبث فى الشباب الحماس بدلا من الثبات العميق الذىكانو فيةوكذلكايضااوحى لهم بافكارتساعدهم على قضاءاوقات فراغهم فى اشياء تنفعهم وتنفع امتهم والاهم من ذلك كلةيااخوانى ان نتعلم فقة الاختلاف وهو ان نختلف مع بعضنا ابعض دون ان يجرح احدنا فى الاخر لية دايما بنهاجم بعض وكل واحدفينالة راى مش عايزحد يعارضةياجماعة طول محنا كدة عمرنا ما هنتقدم خطوة واحدةللامام لانناببساطةسيبين الحاجات المهمةوقاعدين ننتقد فى بعض مش كدة وبس كمان مش عارفين نتوحدوعلى فكرةبقى كلنا بشروبنغلط واللىفينامابيغلطش هودة بس اللى من حقة ينتقد غيرة اما بالنسبةللتعليق على موضوع الاخوان مع احترامىلحريتك فى ابداءرايك الااننى ارىانك ظلمت الاخوان بكلامك دة لانكحكمت عليهم بس من خلال المنظور الاعلامى لهم ولو كنت تعرفهم حق المعرفة ماكنش هيبقى دة رايك فى الختام اتمنى من اللة ان يجمع هذة الامة ولايفرقها ابدا والنيابةعن كل الذين عابو فى عمرو خالداقدم لة اعتذارى واحترامىا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 36
subject = "لكل جواد كبوة!!!"
author = "ابراهيم عمار"
posted = "2006-09-04"
text = "بكل صراحة، أنا من المعجبين وبشدة بعمرو خالد أثناء عرضه لبرنامجه التلفازي الشهير (صناع الحياة)، وكذلك أشاهده كثيراً على قنوات إى آر تي في كلمته القصيرة عن الذين يستخدمون الوصلة في مشاهدة القنوات وأنا هذا حرام وهذه سرقة وإلى ما آخره، ولي عتب عليه، وهو أنه منذ البداية قال بأنه ليس بمفتي، ولكنه في هذه الحالة يفتي، ثم عتبي الأكبر وصدمتي هو عدم خروجه ودعمه الصريح والواضح للمقاومة في لبنان، ربما لأنه ممنوع من ذلك من قبل التلفاز لصاحبه السعودي، ولكن كيف نصنع النهضة بهذه الطريقة؟!!!<br />ثم ما صدمني أكثر الإشاعة وربما الحقيقة التي تقول بأنه تقاضى بعض الملايين مقابل برنامج صناع الحياة ومليون آخر أو شيء من هذا القبيل مقابل برنامج على خطى الحبيب... هذا حقه طبعاً، ولا أحسده، فهو بذل مجهود والتلفاز استفاد، لكن ما بعد البرنامج يجعل الشخص يشك في مدى صدق الرجل ومدى إخلاصه لفكرته؟!!!<br />سبحانك اللهم وبحمدك، أشهد ألا إله إلا أنت، أستغفرك وأتوب إليك..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

