text = "شكرا يااخت نهال على دفاعك عنى ولكن اختلف معكى فىقولك بانى غلط لانى على حق فعلا عمرو خالد الغبى ده واللى بيدافع عنه لان اكيد المتخلفين والاغبياء لازم يدفعوا عن بعض ولا ايه يااخ DESIGNERواولا انالااقول هذا الكلام من عندى بل لى صديقات مصريات كثيرة يتمنون موت عمرو خالد لانه نصاب ينصب على العالم باسم الدين وهو لايعلم شىء اللى بيتمول من الخارج النصاب واللى انطردمن جامعة قبل كده بامر رئيس الجامعة وخلاص"
