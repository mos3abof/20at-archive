[[comments]]
order = 21
subject = "الى الأخ هيكل الأزهرى"
author = "من أجل الانصاف"
posted = "2006-08-30"
text = "عجيب والله أيها الأخ (الأزهرى)، تهجمك على صاحب النصيحة!!<br />أنت تقول \"واحد يدخل مش فاهم اصلا الموقف\"<br />فما دليلك على أنه مش فاهم أصلا الموقف؟ أم أن التهجم على الناس هواية عند بعض الناس؟<br />تقول \"ويقول ان الموقع مش عارف ايه وذئاب وشباب وحاجات اصلا لا تعبر الا عن قلة وعيه\"<br />يا أخى أنت لم تفهم كلامه والله. أعد القراءة بروية واستعذ بالله من الشيطان الرجيم<br />تقول \"لأن دا مش اسلوب نصح اصلا انك تعيب عليا وتقول ان فكرى فيه كذا وكذا وبكده تقولى انت بتنصحنى هيهات هيهات من تلك النصائح\"<br />فهل خص الرجل أحدا بعينه فيما يقول؟ أم أنه حذر من الخوض فى قضايا الدين والدعوة بغير علم بصفة عامة (وهو ما لا تستطيع أن تنكر أنه السمة الغالبة على موضوعات هذا الموقع)؟ فلماذا اذا أخذت الكلام على نفسك أنت؟؟ جاء الاسلام فرقانا للحق وبيانا للباطل، وكان حذيفة يسأل عن الشر كى لا يقع فيه.. قال تعالى (وَكَذَلِكَ نفَصِّلُ الآيَاتِ وَلِتَسْتَبِينَ سَبِيلُ الْمُجْرِمِينَ) [الأنعام : 55]<br />فما هو مفهومك عن النصيحة عموما؟ وما الذى فهمته من تلك النصيحة خصوصا؟<br />تقول \"عاوز اقولك شىء مهم انك من الأولى انك تنصح نفسك لأنك اصلا بتدافع دفاع اعمى خالى من معنى العقل حتى\"<br />أنظروا الى التجريح والاهانة!! انا لله وانا اليه راجعون. عن أى شئ يدافع صاحب النصيحة \"دفاعا أعمى\" كما تزعم؟ ان كنت تعنى ما أشار اليه من تستر البعض تحت اسم سعودى للاساءة للسعوديين فهذا واقع لا يراد من عرضه الدفاع عن السعوديين او غيرهم وانما الاشارة الى مشكلة فى طبيعة الموقع وما يقع عليه. وان كنت تقصد ما أشار اليه على وجه المثال من تطاول بعض الجهال على علماء أهل السنة، فهو واقع أيضا. وان كان يسوؤك أن يدافع عنهم فلمن تغضب أنت وعمن تدافع ان لم تغضب للعلماء ورثة الأنبياء أن يمتهنوا على ألسنة الناس هكذا ويستباح عرضهم وقد قال رسول الله صلى الله عليه وأله وسلم فى الحديث عن الله عز وجل (من آذى لى وليا أذنته بالحرب)؟؟ أيضيرك أن ينصح الناصح للناس أن يتقوا الله فى العلماء؟ ان كنت لا توقر علماء الشريعة وأعلام الأمة فمن توقر؟ لم يقل الرجل أنهم معصومون.. بل كل منهم له أخطاؤه ولا ريب ولكن من نحن لنناقش تلك الأخطاء وكم بلغنا من العلم لنتكلم فيهم؟؟ هل هذه أخلاق المسلمين؟<br />هناك فرق بين النقد \"البناء\" على علم وبصيرة وبين الكلام بالهوى فى حق عالم شرعى! ثم ان الموقع مفتوح لأى أحد يدخل ليضع أى شئ عليه!! بدون حتى اشتراك أو تسجيل أو شئ من هذا! وأول شروط النقد البناء ألا يفتقر لالمام علمى كامل بكافة أبعاد القضية التى يتم مناقشتها من قبل كافة المشاركين فى النقاش. والحكم على الشئ فرع عن تصوره. فأى نقد بناء هذا وأى نتيجة يتوقع أن يخرج بها؟؟<br />أستغفر الله العظيم لى ولكم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

