subject = "عفا الله عما سلف"
author = "mr: designer"
posted = "2006-08-30"
text = "بداية احب ان اوضح ان اسلوبالنقاش اخذ شكلا غير متحضر عندما تحول الامر الي سباب و قذف ما علينا انا اعتذر للاخت سعودية عن ما قلته ووجهته لها من كلام الا انها علقت بشكل مرفوض عن رجل انا اري و ان كان بعض الناس غير مقتنعين بأفعاله ويرونه نصاب او مبتغي الشهرة فهذا ما لا ارضاه ابدا عليه فالرجل كان يحاول جاهدا ان يفعل للامة التي تحولت الي نصف جبابرة يظلم فيهم القوي الضعيف و يأكله و النصف الاخر تحول الي اشباح من شدة ما لا نسمع لهم من صوت او نحس فيهم بحراك فيجب اذن التعبير عن موقفك فالامر عندي كان كجرد انفعال في بداية و انا لم ادخل علي الموقع بالامس و عندما دخلت اليوم و رأيت الردود وددت ان اعتذر عن كلامي و اوضحه حتي لا يفهم خطأ و اعتذر لكل من في الحوار عن كلامي و السلام عليكم ورحمة الله و بركاته"
