[[comments]]
order = 38
subject = "حاجة تخنق"
author = "مؤمنة والحمد لله"
posted = "2006-09-06"
text = "اولا دى مقاله تافهة مش حتهز مكانة عمرو خالد بشعرة اما بالنسبة للكلام بتاع الانسة التى تدعى انها سعودية ولو انى اشك طبعا فى كدة فانا متاكدة انها واحدة ناقمة وحاقدة ممكن تكون مش مسلمة اصلا وممكن تكون من اللى مش عاوزين يسمعو كلمة حق نصيحة ليكى اتق الله ويكفى انك تعرفى ان اخت ليا رات عمرو خالد فى رؤيا والانبياء يسلموا عليه جميعا يا بنتى اتق الله فى كلامك وعموما السب والقذف اللى قلتيه فى حقه ربنا ح يحاسبك عليه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 39
subject = "حسبي الله ونعم الوكيل"
author = "فارس"
posted = "2006-09-07"
text = "الرد لوائل عباس وامثاله .<br />لو اديت لنفسك انت فرصة تفكر قبل ما تتكلم ولو لثوانى كنت هترتقى بنفسك من فصيلة \"الحيو...\" فكر شوية الرجل الى انت بتتكلم عنه منصبش عليك فى حاجه وعلى الاخت العفيفة الطاهرة السعودية .... الا بالمناسبة سوال للاخت السعودية وانااعتقد ان هى مش سعودية ... ولوهى فعلا تبقى شاذة عن القطيع ... السؤال موجه ليكى يا ترى موضة السنة دى ايه فى العبيان \"الزى النسائي الرسم السعودى \" واوعوا حد يضحك عليكم ويقول عليه الزى الاسلامى \" لان اللى هم بيعملوه لا يمت للاسلام بصلة .. يعنى العبيايةبتكون محذقه قوى من على الصدر والارداف ومطرز عليها رقم التليفون والايميل لو فيه ....<br />عذرا لكل السعوديين الشرفاء .... بس هي فعلا تستحق اكتر من كده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

