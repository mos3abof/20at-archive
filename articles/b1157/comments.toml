author = "نجوى ابراهيم"
posted = "2006-09-11"
text = "السلام عليكم ورحمة الله وبركاته.<br />اما بعد ...بصراحة لقد قرأت تعليقاتكم واريد ان اوجه بعض الردود على بعض الاسئلة التى اثيرت فى تلك المناقشة الهامة جدا:<br />اولا بالنسبة للاخت\"سعودية\"واللى اتهمت الاستاذ عمرو خالد انه نصاب ولا يفهم شئ؛هى سألت هو بيجيب الفلوس دى منين وارد عليها بأنه بيعمل شرائط وسيديهات\"لو تعرفى يعنى ايه سيديهات او خلى حد يشرحلك بالصور\"وبيعمل كمان برامج وكان داعية بيعمل محاضرات فى مساجد مصرية وبالتالى فهو له حق الحصول على نسبة من الارباح التى تحصل عليها شركة انتاج الشرائط والسيديهات وكمان البرامج لان هذه البرامج بيتخللها اعلانات كثيرة جدا نظرا لارتفاع نسبة مشاهدة البرنامج وبالتالى فهو له حق فى نسبة من ارباح البرنامج.اما المحاضرات فى المساجد فله عليها راتب عن كل محاضرة يتقاضاه من وزارة الاوقاف.<br />ثانيا عمرو خالد اللى مش عاجبك احسن -فى نظى انا مش معظم الشيوخ السعوديين لان عمرو خالد استطاع ان يقنع عدد كبير جدا من البنات بارتداء الحجاب اما الشيوخ السعوديين اللى مش عندهم حاجة غير ان عدم لبس النقاب حرام فهم لم يستطيعوا اقناعكم بذلك والا لما كانت معظم السعوديات تقوم بخلع الحجاب والنقاب عن وجهها والجلوس بملابس ضيقة للغاية حتى قبل وصول الطائرة او الباخرة التى تأخذهم لاى مكان خارج السعودية ..انتم لم تجدوا من يفهمكم دينكم لذلك قامت واحدة مثلك بسب رجل مسلم مع ان رسول الله صلى الله عليه وسلم -لو تعرفينه حقا- ما كان ليسب حتى اليهود او الكفار بل كان يدعو لهم لانه مسلم حق.<br />اما عن سؤال اخر بخصوص من اين جاء الاخوان باموال الدعاية فكان الرئيس حسني مبارك قد صرف من خزانة الدولة مبلغ حوالى مليون جنيه مصرى لكل حزب لينفق على حملته الانتخابية ولم تقم نسبة كبيرة من الشعب بانتخاب الاخوان بل جاءت اعلى نسبة بعد الرئيس مبارك ل ايمن نور رئيس حزب الغد ثم ل نعمان جمعة رئيس حزب الوفد.اما الانتخابات البرلمانية برضه بياخدوا فلوس من الدولة وحقهم انهم يرشحوا نفسهم عشان ياخدوا اكبر عدد من المقاعد ..ليه بقى فدة مش شغلك واعتقد انه ليس لديك الحق فى التدخل اصلا فى شئون مصر.اما عن ان عمرو خالد ترك مكانه فى لبنان فلبنان ليست بلده وانما مصر هى بلده وعندما تركها كان ذلك لنشر فكره ودعوته للنهضة وليس من اجل الجهاد فى سبيل الله بالحرب.واللى عايز يتكلم يتكلم احسن عن المليون لبنانى اللى تركوا ارضهم وقت الحرب ونانسي عجرم اللى استغلت الحرب فرصه للتواجد بين جمهورها بزعم الحزن وهى متصوره مع والدتها فى الجورنال وهونايمة على كتفها ومغمضة عينيها ولابسة اسود وبتضحك....والمليارديرة هيفاء وهبى ايضا واخيرا جاد شويرى اللى بلده بتولع وبقت خرابة وهو بيجهز لانشاء اول محطة فضائية اباحية فى العالم العربى وبيقول ان مناظر الجنس ارحم من مناظر القتل اللى العرب تعبوا منها....بصراحة كدة ولا شماتة يعنى اللى جرى فى لبنان ده من اللى بيعملوه الفنانين فى الشباب اللى مش لاقى يتجوز.<br />بصراحة ياريت كل واحد يكون فى حاله واللى بيته من زجاج لا يرمى الناس بالحجارة.<br />واقول لعمرو خالد:يا عمرو:دع الكلاب تعوى وقافلتك تسير....<br />صحيح يا اخت سعودية ...مارديتيش على سؤال الزميل عن العبايات السعودية..ايه اخبارها السنة دى؟وايه اخبار البنطلونات الجينز وكمان سؤال من عندى..هما لسة فى ناس شغلتهم انهم يضربوا الناس بالكرابيج عشان يقفلوا محلاتهم ويروحوا يصلوا؟طب الناس دول-بتوع الكرابيج- مش بيصلوا برضه ولا ايه؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 44
subject = "الى كل كثيري الكلام"
author = "ريم بنت السعودية oooooooo"
posted = "2006-09-12"
text = "السلام عليكم يا اختي ,,,,,,,,,,,,, اولا بما اني سعودية لن اقف الا مع الحق فلن ادافع عن الي كاتبة باسم سعودية بل اتبرا من مقولاتها لان مقولاتها سب في الدين واهله ومن قدمو كامثال الداعية عمرو خالد فلا اقول عنهم الا كثر الله امثالهم ولا يحق لاحد كان ان يتكلم عن العلما والدعاة وينهش في لحومهم بغير حق حتى لوكان حق فا انت مغتاب له ........................ ومن هنا يا ختي نجوى انتي ايضا لاتتكلمي عن دعاة السعودية وعلمائها فهم اهل الدين وان كان فيهم شيئ فا الله هو المحاسب ليس نحن فلا ارى دعاة المسلمين سواء مصري اوسعودي الا انهم ان شاء الله على حق وغير هذ ا لا يحق لنا الكلام هل وضحت الرسالة يا نجوى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 45
subject = "رد علي العالمه نجوي"
author = "فتاه مصريه"
posted = "2006-09-13"
text = "اولا انا متفقه مع الاخت التي ردت عليك وهذا ان دل يدل علي حسن الاخلاق<br />ثانيا معلوماتك السياسيه عن الانتخابات وغيرها فيها كثير من المغالطات الكبيره و الغير صحيحه وواضح انك تستقي معلوماتك من مجلات النميمه والجرائد الحكوميه التي غير موثوق في كلامها<br />ثالثا ان اردت ان يحترم الناس كلامك فيجب ان تحترميهم اولا<br />رابعا في الحقيقه نحن في امه عربيه واحده سواء مسلمه او غير مسلمه فيجب ان تكوني اكثر غيره علي الامه بأجمع ولا تكوني متحيزه لمصر وسياستها وشعبها في الباطل لان يا عزيزتي بدايه اي تغير جزري ياتي بمواجهه الاخطاء<br />خامسا جميع الدول العربيه مليئه بما فيها اما كلامك عن الناس اللي بضربوا الستات والرجاله عشان يصلو ا فيجب عليك اولا كعربيه ومسلمه ان تعرفي من هم هؤلاء وما هو تاريخهم و الي ما وصلوا اليه وانا لن اجببك علي هذا الا اذا سأت بنفسك<br />اخيرا ارجوا منك ان يتسع صدرك للكلام وان اردت المناقشه بعقل واحترام ردي علي رسالتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 46
subject = "نستاهل"
author = "سورية"
posted = "2006-09-17"
text = "يا أخوان ويا أخوات :<br />نحنا نستاهل كل شيئ يحدث لنا .لأنني أبطال بالشتيمة على بعضنا أذلاء أمام عدونا الواحد. كل واحد يصلح نفسه من الداخل ،ثم يجلس ويحاول أن يجد الحل لأي مشكلة تمر بهذه الأمة ،بدلاّمن اضاعة الوقت على شتم هذا وسب ذاك .كفانا سخرية من الأعداء.<br />اللهم اهدي أمة نبيك محمد ولا تفرقهم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 47
subject = "عمرو خالد يتاول على الله ورسوله"
author = "خالد"
posted = "2006-09-23"
text = "عمرو خالد بشهاده وجدى غنيم قال ان الرسول وسيدنا جبريل بيمثلوا عمرو خالد قال ان الملائكه سالت حواء اتحبين ادم وقالت لا وهذا لايوجد فى اى كتاب دينى اسلامى عمرو خالد قال ان ابليس عاصى مش كافر بالرغم من الله سبحانه وتعالى قال: (الا ابليس ابى واستكبر وكان من الكافرين) عمرو خالد بيستخدم الاختلاط بين الشباب والبنات بالرغم ان ده ماوردش عن الشعراوى او اى رجل دين فى شباب بتروح تقابل بنات فى محضرات عمرو خالد عمرو خالد بيستخدم الموسيقى فى حلقاته عمرو خالد قال بشهاده بنت ان فى رجل اعرابى قال والله لو حاسبنى الله لاحاسبنه يعنى عايز يحاسب ربنا وحاشا لله وهنالك العديد من الاخطاء الاخرى اللتى لا تحصى وحسبنا الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
