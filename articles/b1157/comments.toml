[[comments]]
order = 8
subject = "..& وفقك الله ايها الإنسـان صاحب النهضة التربوية : عمرو خالد &.."
author = "..& هيكل الأزهرى &.."
posted = "2006-08-29"
text = "وفقك الله أيهاالمربى الفاضل, والله انا فعلا بحبك وبحترمك جدا لانك غير كتير جدا جدا من الدعاة فى وقتنا الحاضر وبتجمع بين الدين القويم والدين المعاصر فعلا معادلة صعبة وشم هنسى ابدا كلمتك الجميلة ( انا نفسى أعمل نهضة ) احب اقولك انت فعلا ماشى على الطريق وبإذن الله هتشرف المسلمين كلهم فى اقرب وقت وبرنامجك اللى اتوقع انه يكون فعلا متميز عن اسماء الله الحسنى اللى هيذاع فى رمضان على شاشة اقرأ ربنا يكرمك بيه ويكون فى ميزان حسناتك ومش هنسى على خطى الحبيب وأهلى اما كانوا قاعدين مش بيفوتوا حلقة منه وفعلا بينهمروا فى البكاء مع احاسيسك النبيلة واحب اقولك مصر فخورة إن فيها انسان زيك يا استاذ عمر خالد وارجوا انك تكون عارف ان دى مسؤولية كبيرة وكل وقت ووقت منتظرين منك الجديد والجميل والمميز كما عودتنا دائما .. وفقك الله . اما عن الأخ على ما اظن اللى شتم بإسم سعودية احب اقولك انك مهما كنت من اى مكان انت مجرد انسان غير فعال فى وطنك مهما كان سعودية او صعيدية حتى لكن احب اقول للعقلاء ان الشخص دا مش مهم لدرجة ان كل واحد يدخل لازم يعلق على كلامه هو فى مخيلته كان عاوز كدا ونجح فعلا ارجوا اننا نكون اكثر عقل وفعلا الأشخاص دى تجاهلها رحمة .. وعن اللى قال ان لازم ننصحها بإحترام وبعيد عن غباء وما شابه هل الجهل فى ادلاء الرأى بيكون نتاجه ايه غير توبيخ واساءة ؟ ... ربنا يوفقنا جميعا الى ما يحبه ويرضاه ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 9
subject = "نصيحة لله"
author = "بسم الله والحمد لله والصلاة والسلام على رسول الله وأله وصحبه وبعد"
posted = "2006-08-29"
text = "اخوتى الكرام، ألم أقل لكم أن هذا الموقع تملؤه ذئاب لا غاية لها سوى تخبيط الشباب من أهل السنة وايقاع بعضهم فى بعض؟<br />لن أسأل عن الغاية والغرض من طرح موضوع كهذا، وان كان هذا سؤال يستحق أن يسأل فى الحقيقة فى هذا الموضوع وفى غيره من الموضوعات على هذا الموقع. ففكرة الموقع ذاتها وأسلوب الطرح لابد معه من وقفة، وأعود اليها لاحقا.<br />ولكن ما أردت الاشارة اليه أولا هو أنه غالبا ما تنكشف القصيدة من عنوانها، فمن أول تعليق فى الموضوع تبدأ دسائس السوء..<br />الكائدون لكم حيلهم القذرة الخبيثة واضحة كالشمس فى كبد السماء ومع ذلك لا نفطن اليها بل نتلذذ بالخوض معهم فى غثائهم وبعضنا لا يكاد يكون له حظ يذكر من علم أو فقه! ولكننا نخوض على أى حال! وهذا بالضبط هو مرادهم والله.<br />ترى واحدا منهم مثلا يدخل تحت اسم (سعودى) أو (سعودية) بالذات - ذلك أن شباب أرض الحجاز على رأس مستهدفاتهم - ثم يضرب كلاما سفيها لا يقصد به الا اشعال غضب عامة الشباب من أهل السنة فى كل مكان، باللعب على مشاعرهم تجاه شخوص بعينهم أو أحداث بعينها، بغض النظر عن الموقف الشرعى الصحيح تجاه هؤلاء الشخوص والأحداث (وهو الموقف الذى يجهله غالبا أكثر الشباب) فيحفزهم ويستثير نقمتهم ضد أرض الحجاز وأهلها وعلماء السنة ومن تحدثوا باسمهم أو انتموا اليهم أو نقلوا عنهم. وربما يدخل واحد منهم ليضرب كلاما خبيثا وهو متنكر بما لا يدع مجالا للشك فى كونه سنيا، ثم يدخل بعد ذلك باسم أخر ليرد على ما كتبه أولا ويسفهه، ليبرهن بذلك على دعواه، ويبث سمومه ضد (الوهابيين) و(أل سعود) وعلماء السنة أئمة الهدى، ويضرب فيمن يشاء كيف يشاء! ولا بأس بأن يضرب بالشعوبية تارة، وبالقومية تارة، وبغيرها من دعواى الجاهلية الظلماء، فاذا ابتلى مسلم بقراءة المحصلة الناشئة من ذلك العبث، لا يخرج الا وقد زاد جهله وضلاله وربما شك فى ثوابته!!<br />لعل بعضكم يظن أنى مبالغ فيما أقول. لا والله. بل أنتم – الا ما رحم ربى - تحسبونه هينا وهو عند الله عظيم! فهل يكب بنى أدم على مناخرهم فى جهنم الا حصائد ألسنتهم؟ ان المرأ لينطق بالكلمة من سخط الله لا يلقى لها بالا تهوى به فى جهنم سبعين خريفا. نعوذ بالله من غضب الله<br />ليس ما أقوله مبالغا فيه أو مغايرا للواقع أو فيه افتراء، فالمتابع منكم لشريط التعقيبات على أى من الموضوعات المسماه بالدينية (بالذات) يجد أنه لا يكاد يخلو موضوع واحد من أن تكون نتيجته وحصيلته كما ذكرت لكم.<br />اخوتى الكرام، لا أوصى بمزيد من الخوض فى هذا الموضوع أو غيره، فالضرر كبير والله.<br />وأناشد صاحب السلطة على هذا الموقع أن ان كنت تؤمن بالله واليوم الأخر، فراقب الله فيما تنشر، واتق الله فى الشباب ولا تبث فيهم الا خيرا وعلما، ولا تعرض فى باب الدين الا كلاما لعلماء الدين المنضبطين الثقات، وامنع التعليق عليه من قبل القراء فليس للعوام أن يعلقوا على رأى عالم من العماء، فذاك تقديم بين يدى الله ورسوله.<br />هذا دين الله يا عباد الله فمالكم لا ترجون لله وقارا؟؟<br />اننى يوم دخلت هذا الموقع أول مرة ورأيت أن هناك قسم للدين، تصورت أن به مواد علمية من محاضرات أو دروس أو خطب أو كتب أو نحو ذلك مما ينفع الناس ويعلم الشباب دينهم، وما أحوجهم اليه اليوم! ولكن صدمتنى عناوين الموضوعات فأكثر الكتبة لا يكاد يكون لهم حظ يذكر من العلم الشرعى، ومع ذلك يخوضون فى أمور الشريعة ويعرضونها للعامة ليخوضوا فيها ويضرب كل فيها بهواه وبمزاجه سهما، فلا حرمة لعالم أو فقيه، ولا حرمة للدين كله فما أسهل الكلام فيه!! يلعبون ويتضاربون وكأنها مباراة كرة قدم أو لعبة يلعبون بها ولا حول ولا قوة الا بالله!<br />فأسألكم بالله عليكم ماذا تفعلون هنا؟ لماذا أنتم على هذا الموقع على هذه المواضيع بالتحديد؟ أتريدون علم الدين وموقف الشرع حقا، على مراد الله ورسوله؟ أم تريدون أن تصنعوا أنتم بألسنتكم ما تجعلونه موقف الشرع؟ ففى أى شئ تخوضون وتتجادلون اذا؟ قديما قال علماؤنا لو سكت الجاهلون لسقط الخلاف. ولكن أى خلاف وأى جدال ولأى غاية؟ هذا السجال والهرف البيزنطى المجرد من العلم والفقه، الى أى شئ يفضى فى النهاية وماذا يعود على قارئه وماذا يريد منه طالبه الذى بدأه فى الأصل؟؟ كل هذه الأسئلة المحورية الأصولية كيف لا نلقى لها بالا ونمضى نصب ما عندنا أيا كان، بعد أن نكون قد حرقنا الوقت الكثير فى قراءة كلام – ومعذرة عن الكلمة الحادة – فارغ أجوف بل وبذئ فى أكثره؟؟ هل يريد صاحب الموضوع أن يثبت لنفسه أنه ليس هناك حق من باطل وأن كل شئ سواء؟ أم أنه يريد أن يثبت أنه ما من أحد من الشباب يفهم شيئا وأن الأمة ليس لها من الثوابت والرواسخ ما يجمعها ويوحدها؟ أم ماذا يريد بالضبط؟؟<br />معاشر شباب المسلمين، لا يكونن أحدكم كالامعة يهرف بما لا يعرف! أمتكم فى حاجة الى رجوعكم للدين وتعلمه، لا تخوضوا مع الخائضين ولا تقولوا على الله بغير علم. أمتكم فى أمس الحاجة الى تسلحكم بالوعى والعلم الشرعى الصحيح، الحد الأدنى الضرورى لحفظ عقيدتكم وأصولكم من رياح الفتن وظلماتها.<br />ليس الرأى فى الدين أيها الأحبة الا لأهل الحل والعقد الذين هم أهل الذكر والعلم، الذين فقهوا عن الله ما أنزل من الوحى. فمن ذا الذى يجرؤ على أن يكذب على الله أو أن يفترى عليه كذبا من حيث لا يدرى؟ من يجرؤ على حمل تلك التبعة يوم لا ينفع مال ولا بنون؟<br />من ذا الذى يجرؤ على أن يقول أن الله يريد كذا وقد أنزل الله فى وحيه أنه يريد خلاف ذلك؟ من ذا الذى يجرؤ على النار والعياذ بالله؟<br />ما معنى أن يمشى رجل بين الناس فى الطريق مثلا ويسألهم عن رأيهم فى فتيا عالم من العلماء أو موقغهم من حكم شرعى أو من قضية شرعية؟!! هل يؤخذ الدين من رأى العوام والجهال؟ لا تسيئوا فهمى اخوتاه فأنا والله أحبكم فى الله، والله يعلم أن هذه النصيحة خالصة لوجه الله تعالى، ما أريد منها الا الخير لشباب أمتنا، ولكن بأى شئ خرجتم من تلك المساجلات العقيمة فى هذا الموضوع وغيره سوى النزاع والتضارب والتنابذ بالألقاب وسوء الأدب، وتمسك كل صاحب رأى برأيه وان كان فاسدا، والأكل فى عرض فلان وفلان بغير حجة ولا سلطان؟ بأى شئ تخرجون غير ضياع الوقت والدين؟<br />ثم أين ينتهى هذا الكلام؟ ما المنتظر أن يتحقق بعد خمسين أو ستين أو تسعين تعليقا وتعقيبا على الموضوع الواحد؟؟؟ مزيدا من الشقاق والتخبط والجهل ؟.. لا حول ولا قوة الا بالله<br />اخوتاه،<br />يا من يقومون على هذا الموقع، اتقوا الله فى عباده وتذكروا قوله تعالى (إِنَّ الَّذِينَ يُحِبُّونَ أَن تَشِيعَ الْفَاحِشَةُ فِي الَّذِينَ آمَنُوا لَهُمْ عَذَابٌ أَلِيمٌ فِي الدُّنْيَا وَالْآخِرَةِ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ)<br />والى من يرومون افساد المسلمين وتشتيتهم ويمكرون بهم السوء أذكركم بقول ربكم (وَلاَ تَحْسَبَنَّ اللّهَ غَافِلاً عَمَّا يَعْمَلُ الظَّالِمُونَ إِنَّمَا يُؤَخِّرُهُمْ لِيَوْمٍ تَشْخَصُ فِيهِ الأَبْصَارُ)<br />والى من يدخلون هنا لخوض غمار الجدال والكلام قاصدين الخير، أقول املأوا قلوبكم بالحق أولا حتى ان أخرجتم ما فيها أخرجتم ما يفيد وما يرضى الله عز وجل وأنتم على يقين من أنه الحق، كلاما تفرحون به فى صحائفكم يوم القيامة.<br />(قُلْ هَـذِهِ سَبِيلِي أَدْعُو إِلَى اللّهِ عَلَى بَصِيرَةٍ أَنَاْ وَمَنِ اتَّبَعَنِي وَسُبْحَانَ اللّهِ وَمَا أَنَاْ مِنَ الْمُشْرِكِينَ)<br />هذا ما عندى والله المستعان<br />أقول قولى هذا وأستغفر الله لى ولكم"
archived = "2006-11-02"
