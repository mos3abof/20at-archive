text = "يا اخت سعودية انا متااكدة انك لستي بسعودية ولهجتك تقول كذ ا بعدين لاتسبي مالا تعرفي الا بدليل واضح امامك وللتستندي لوكالة ... , يقولون ... وهي الاشاعة لان فيها تفرقة بيننا والداعية عمرو خالد ماعليه غبار حتى تناقشين فيه وامثالك لم اسمع احد يسبه بل الكل يثني عليه ................. بعدين ان كان عندك اعتراض عليه تكلمي بهدوء وبا الخطاء الي قاله ......... اما انك تتهجمين وتدعين عليه بصاروخ فهذا ليس ادب منك ارجو ان تصلك الرسالة بعيدا عن الانفعال ..........."
