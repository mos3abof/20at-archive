[[comments]]
order = 51
subject = "ارحمونا بأ"
author = "نشوى جمال"
posted = "2006-10-10"
text = "اولا انا بشكر كل اللى ردوا عن الاتهامات الموجهة للاستاذ عمرو خالد<br />ثانيا انا مش هقول اى كلام عن أ.عمرو لانه مش محتاج ان حد يتكلم عنه ودة لان اعماله هى التى تتحدث عنه<br />ثالثا انا عايزة اقول للاخ خالد ان كل انسان له اخطاء مع انى مش متاكدة من الكلام اللى انت قلته لكن مفيش انسان معصوم وكون ان أ.عمرو يغلط دة شىء طبيعي وعايزة اقول له ان أ.عمرو علمنى انى اوزن الناس بحسناتهم وسيئاتهم وياريت تحاول تقارن بين انجازات أ.عمرو وبين اخطاؤه<br />رابعا بقول لكل اللى مش عايزين الاسلام ينهض حسبنا الله ونعم الوكيل<br />ارحمونا بأ ضيعتونا<br />منكم لله<br />وياريت تشاهدوا اعمال أ.عمرو اللي بيعملها في رمضان السنة دى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"
