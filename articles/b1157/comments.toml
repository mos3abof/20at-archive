subject = "ربنا يهدى"
author = "أخت مسلمة"
posted = "2006-08-29"
text = "كل اللذي أريد أن أقوله ان أي شخص ناجح لازم يكون له أعداء. عمرو خالد جزاه الله عنا كل خير قدم لنا الكثير و أخذ بأيدينا أكثر و أكثر. أدعو له دائما بكل الخير. يا أيها المسلمون أجتنبوا كثير من الظن ان بعد الظن اثم. يا رب يا أستاذ عمرو يكون هداية كل من وجهتهم و أخذت بأيديهم أن يكونو في ميزان حسناتك لأنك سخص محترم و ناجح تريد النهضه و العفه لجميع المسلمين. وفقك الله يا أستادذ عمرو و أعانك علي مشقة الدعوه التي لا تخلو أبدا من العقبات. أسأل الله أن يسهل لك الطريق و يدعمك دائما و يقويك بالأيمان الراسخ في قلبك و عقلك."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

