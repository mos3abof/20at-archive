subject = "..& لدعم مقولة .. الرد مكفول &.."
author = "..&هيكل الأزهرى &.."
posted = "2006-08-31"
text = "السلام عليكم اولا , احب اقولك شىء مهم يا ^ من اجل الإنصاف ^ اولا يا اخى العزيز اقدر كلامك جدا لسبب مهم إنك اخدت كلامى حرفيا بدون تأويل او حتى رواية بالمعنى ودا احب اشكرك عليه جدا , تانى شىء احب اقولك كلام الأخ نصيحة كان كلام عام وانا احب اوضح النقطة دى جدا إنه كان كلام عام يعنى فى الظاهر خالى من اى نية لكن انا بوضح برضه نقطة تانية ان فى كلامه دا نية معينة الله اعلم بيها هى ايه بالظبط ؟ لكن احب اقولك شىء مهم انا مش هخوض فى تفسير تفسيرك لكلامى وهقولك شىء واحد بس انا عن نفسى بنتقد كلامه لسببين اولهما انى حاسس فعلا ان كلامه يقصد بيه شخص و جماعه انا يهمنى انهم يكونوا فى احسن صحة وحال ^ قد يكون الإحساس خاطىء .قد. ^ وتانى شىء ان كلامه كان عام جدا يعنى مفهوش اى شىء يوضح هو يقصد ايه بالظبط وارجوك انت متحاولش تقول نوايا ليه من خلال احساسك وياريت لما يتفضل يدخل تانى يرد بنفسه والسببين دول كفيلين انى انتقده ونقدى كان فيه جفاء دى حقيقة لكنه بناء ومبنى من اسباب مش من فراغ على العموم اشكرك وادام الله لنا العقل والتفقه والفهم الصحيح .. اللهم آمين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

