[[comments]]
order = 18
subject = "احنا عملنا ايه؟"
author = "أمانى"
posted = "2006-08-30"
text = "سلام الله عليكم ورحمته وبركاته<br />انا نفسى اعرف يا انسة سعودية انتى ليه مهاجماه كدة او كل اللى بيهاجموه بيهالجموه ليه اى انسان له اخطاء هو اولال واخيرا بشر واحنا مش بندافع عنه لمجرد انه مصرى بس لا احنا بندافع عنه لانه عمل كتير من اجل المسلمين وحاولى تقارنى نجاحاته باخطائه وانتى تعرفى هو عمل اد ايه<br />وقبل كل شىء قبل ما نسىء لحد لازم نسال نفسنا احنا عملنا ايه للاسلام ؟؟؟؟؟؟؟؟<br />يا ترى عملنا ربع اللى عمله عمرو خالد او غيره قبل ما نقيم غيرنا لازم نقيم انفسنا حتى تستقيم القاعدة<br />واذكرك واذكر نفسى بقول الرسول صلى الله عليه وسلم<br />كل ابن ادم خطاء وخير الخطاءون البتوابون<br />ربنا يعفو عن كل مسلم ويعافينا وينصرنا جميعا<br />اللهم اهدنا واهدى بنا واجعلنا سببا لمن اهتدى<br />سلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

[[comments]]
order = 19
subject = "رجاء : التعليق على اى موضوع للعقلاء واصحاب الآراء الصحيحة وفقط رجاءا ً"
author = "..& هيكل الأزهرى &.."
posted = "2006-08-30"
text = "فى بداية الموضوع عمرو خالد من الناس القلائل جدا الىل عملوا شىء يتحدث عن نفسه ومش محتاج حد يتكلم عن الشىء دا الا وهو إنه داعية عامل بمعنى انه بيدعى الى سبيل ربه بالحكمة والموعظة الحسنة وكمان بيجادلهم بالتى هى احسن مع إنه بيشتغل ويعمل مع الشباب فى صالح الأمة وصالح عزتها وشرفها ورفعتها اولا اللى قال انه اخطا فى موضوع الروسم المسيئة اولا يا اخى او اختى العزيز او العزيزة احب اقولك ان اللى فعلا بيحب سيدنا محمد عليه افضل الصلاة واتم التسليم بيكون حبه دا من خلال اتباع سنته وفهمها كما ينبغى واحياء دعوته التى جاء من اجلها مش بكثرة الإعتراضات وقلم الفهم ككثير من دعاة عصرنا الذين لا يملوا من كلامهم الذى لا يعطى اى فائدة بل لا يجدى اصلا .. تانى شىء احب اقوله إن عمرو خالد مهما قال وغلط هو انسان وفى الحديث الصحيح & كل بن آدم خطاء وكل الخطائين التوابين & اللهم اجعلنا منهم , لكن اننا نقول انه بيغلط ومش عارف ايه فدا شىء ليه مش عليه لأنه فعلا على طبيعته وبكل ارتجالية معانا اثناء كلامه معانا واحب اقول شىء تانى ان واحد يدخل مش فاهم اصلا الموقف ويقول ان الموقع مش عارف ايه وذئاب وشباب وحاجات اصلا لا تعبر الا عن قلة وعيه لأن دا مش اسلوب نصح اصلا انك تعيب عليا وتقول ان فكرى فيه كذا وكذا وبكده تقولى انت بتنصحنى هيهات هيهات من تلك النصائح عاوز اقولك شىء مهم انك من الأولى انك تنصح نفسك لأنك اصلا بتدافع دفاع اعمى خالى من معنى العقل حتى لأنك قولت ان الموقع بيبثت مش عارف ايه كدا على ال سعود والوهابيين انا عاوز اقولك مش دول بشر برضه ولا انت ليك رأى تانى ؟ كلنا عباد الله ولازم نعرف ان الكل واحد سيان زى ما بننتقد انفسنا ننتقد كبار المعروفين امثال ال سعود مدام النقد بناء وفعلا محترم لكن ان الكلام يكون بالشكل دا انا ارفضه رفض تام واحيى صاحب المقالة واقوله انت مادمت على الصح وفعلا راضى عن نفسك لو العالم كله وقف قصادك ولا يهمك دى كلها اغراءات فكرية خادعة ليس الا والله الواحد بيحزن لما يشوف ردود وحاجات زى دى وعاوز اعرفك حاجه مهمة يا ساره بخصوص موضوع سعودية اولا سعودية دى مش بنت دا اكيد وغير كداانى شوفت ليها تعليقات سخيفة جدا ابسط توصيف ليها انها عنصرية لا تفقه فى ادب الإختلاف اى شىء ولذلك احب اقولك ياريت ننتسب لإسلامنا كما يدعونا صح ونطبق قول الله عز وجل & وعباد الرحمن الذين يمشون على الأرض هونا واذا خاطبهم الجاهلون قالوا سلاما & يكفى كلمة سلاما فى وجه سعودية وامثالها .. ربنا يهدينا جميعا والله شىء فعلا يدعوا للإشمئزاز لأن عمر ما كانت علاقة المسلم بالمسلم الإتهامات الكاذبة وتوعرية الحقيقة من الحق وملأها كما نهوى نحن .. ربنا يهديناجميعا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

