subject = "يا سادة نرجو ان تحترموا انفسكم قليلا"
author = "mr : designer"
posted = "2006-08-29"
text = "يا اخ او اخت سعودية لا يصح ان تتكلمي عن رجل حاول بكل ما اوتي من قوة ان ينهض بعزيمة الأمة و شبابها من اجل تحقيق شيء ينفع الإسلام و المسلمين و كفاكم حقدا علي المصريين و علي مصر ان خرج رجلا من شعب مصر حقق كل ما حققه عمرو خالد من انجازات علي صعيد الشباب و انا واحد منهم و نال شهرة لم ينالها شيوخكم و فقهائكم الذين ما عليهم سوي ان يصدروا فتاوي تثبط من همم الناس بدلا من اذكائها مثل ما رأينا في فتوي مساندة الشيعة و التي ردت عليها فتوي مصرية ايضا بابطالها يرحمنا الله من كل الحاقدين و الخونة و الأغبياء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

