author = "سعودية"
posted = "2006-09-01"
text = "شكرا على الردود الجميلة دى ولكن ارجوا ان تفكروا مرة اخرى فى كلامكم على الرجل النصاب ده والا لسوف تبقوا من المنافقين وخلاص وبصراحة انا لابحب اى شخص يتصنع التدين ابدا لمجرد الشهرة هل فكلر هذا الشخص ما هو ثمن شهرته طبعا لا نه ما يهمه هو ارضاء الناس وكسب حبهم ويدخل قلوبهم وذلك عن طريق الدين بالنسبة للمسلمين وارضاء ربنا ودخوله الجنة من وجة نظر عمرو خالد ياجماعة فكروا حد فيكم فكر قبل كده هو بيجيب الفلوس اللى بيتحرك بيها بين الناس من خلال الشرائط والتنقل بين الدول فمن المؤكد بانه بيمول من خلال جة تريد ان العالم العربى يظل متخلفا علشا ن يكلوا هما عيش بالدين حد فيكم فكر الاخوان المسلمون الذين يرمزون للدين ويتظاهروا به مثل عمروخالد جابوا الفلوس اللى نزلوا بيها الانتخابات اللى فى مصر منين اذا كانوا غير منتمين الى اى جهة حزبية عندكم فى مصر لان من المعروف بان الحزب هو الذى يمول الفرد فى الانتخابات فان هذا يعنى بانهم ممولين من جهة معينة حتى يتوصلوا الى المراكز الاعلى ليتوسعوا فى نشر افكارهم ومع الملاحظة اننى اعلم بان الانتخابات تحتاج الى نقود كثيرة ومنهم من استغل اسم الدين للفوز بالانتخابات تحت شعار الاسلام هو الحل فطبعا نسبة كبيرة من المتعلمين والغير متعلمين ذهبوا للانتخابات لينتخبوهم ارضاء لله وللاسلام ومن وجهة نظركم ايه اللى خلى نسبة كبيرة من الاخوان ينزلوا الانتخابات فى موعد واحد الا اذا كانوا مخططين لشى معين يعملوه فى مصر رجاء لاتعتبروا هذا منى تطفل على سياسة بلدكم مصر وكنت اتمنى ان تكون بلدى ولانى انا عربية وبحب مصر فيهمنى امرها وكنت ارجوا من الله بان الدول العربية تتحد للقضاء على اى شى يضر بها وارجوا من العرب بان يفيقوا قبل ما العدوان يسود فارجوا ان كل فرد يقرا ويعرف دينه من خلال القراءة واعمال العقل ولا تستمعون للذين يظهرون على الشاشات واذا استمعتم فشغلوا عقولكم الذى انعم الله بيها عليكم وشكرا وقبل ان انهى نسيت ان اعزى الشعب المصرى فى الكامل والاديب نجيب محفوظ وشكرا جزيلا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123732/http://www.20at.com/article2.php?sid=1157"

