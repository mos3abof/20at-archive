subject = ""
author = "هو ايه اللي حصل"
posted = "2009-04-20"
text = "من مطبخ فتكات الى سوزان بويل<br />هو ايه اللي حصل للموقع يا علي عبدالمنعم<br />مش موقع ولاد البلد دا اللي انا اعرفه<br />يا علي عبدالمنعم قولهم يلغوا التعليقات خلاص ما حدش حيعلق<br />الغوا التعليقات لو سمحتم<br />مع تحيات<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-04-23"
capture_url = "https://web.archive.org/web/20090423061952/http://www.20at.com:80/masr/105-msa7t-r2y/11812-2009-04-20-14-18-59.html"

[[comments]]
order = 1
subject = ""
author = "نضـــــال"
posted = "2009-04-21"
text = "ده علـي أساس أن سيادتك المعلق الأوحد يعنىولا أيه ؟؟؟؟؟<br />بالنسبة للموضوع …<br />ياريت الناس كلها تبقى سوزان بويل ..<br />لأن الناس بتصنع لنفسها جدران للأحلام و تنامي موهبتهم ..<br />لكن فى الحقيقة مافيش أى جدران للأحلام …الى معظمها بينتهى لواقع فى الأخر<br />ومافيش واقع بدون حلم .<br />ياريتنا كلنا زى الأسطورة دى فى التحدى و الصدق و العزيمة<br />وأهم حاجة فى الصبـــــــــــ ـــــــــــــر على المحكم الى أتسبب فى أنتحار شاب"
archived = "2009-04-23"
capture_url = "https://web.archive.org/web/20090423061952/http://www.20at.com:80/masr/105-msa7t-r2y/11812-2009-04-20-14-18-59.html"

