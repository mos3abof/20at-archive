order = 0
subject = "مقال أعجبني"
author = "محمود يوسف"
posted = "2005-12-07"
text = "أعجبني جداً مقال آخر للدكتور صلاح الدخيل على موقع قناة العربية<br />أول خطوات الإصلاح هي رحيل مدعي الإصلاح ...<br />صلاح الدخيل |07/12/2005 م، 10:8 (السعودية)، 7:8 (جرينيتش)<br />ما يحدث من بلطجة في الانتخابات بكل ما فيه من مبالغات قد تبدو للبعض غير أنه في اعتقادي أقل كثيراً مما يحدث في مصر الآن .. وهو والله بشير خير وليس نذير شؤم كما يرى البعض وربما الأغلب الأعم من إخواننا هنا سواء المصريين أو بعض الإخوة العرب العاشقين لمصر والعارفين بتاريخها العريق .. وأما كيف هو بشير خير فهذا واضح جداً لمن تريث في النظر إلى الأمر .. ففي كل الانتخابات الماضية كان الإخوان لا يصلون إلى 4 % من مقاعد البرلمان بسبب التزوير الذي يمارسه الحزن الوطني وعماله على البلاد من إمعات أمن الدولة وجحافلها المدججين والمدجنين أيضاً (ولا يقول أحد أن المعنى في بطن الشاعر .. المعنى واضح وأنا أقصده بعينه.. فهم مدججين بالأسلحة في وجه الشعب .. ومدجنين من قبل الحكومة التي تلقي لهم بفتات الموائد المسروقة المخلوط بالهرمونات التي تنمع نهائياً فقس ديك أو حتى فرخ صغير بينهم) .. ويقولون باستخفاف وخسة أنها ديموقراطية .. وعندما تم تغيير الاختصاصات الوزارية وأسندت الحكومة مهمة التزوير لوزارة العدل ممثلة في القضاة بدلاً من وزارة الداخلية وإمعاتها الدواجن .. بدى واضحاً منذ البداية أن الحكومة والحزن الوطني مقتنعين بدوام الحال لأن كلا الوزارتين تتبعان الحكومة التي هي حزن وطني أصلاً .. بمعنى زيتنا في دقيقنا .. ولم نذهب بعيداً والقضاة أولادنا برضه ولحم أكتافهم من خيرنا والحكومة هي التي تدفع لهم رواتبهم .. لكن غاب عن لجنة سياسات المحروس والسيد والده أن للقضاء المصري تاريخ طويل في النضال من أجل الاستقلال .. وأنه يضم بين عناصره البقية الباقية<br />اقرأ بقية التعليق .."
