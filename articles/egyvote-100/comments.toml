[[comments]]
order = 1
subject = "باقي المقال السابق"
author = "محمود يوسف"
posted = "2005-12-07"
text = "ين عناصره البقية الباقية من شرفاء مصر .. فأسقط في أيدي لجنة سياسات المحروس عندما صدمهم وفاجأهم القضاة بأنهم لا يرتضون على أنفسهم أو ضمائرهم العبث .. فما كان من لجنة سياسات المحروس إلا الرجوع إلى كهنة الحزن الوطني من أمثال هامان الشاذلي وهامان الشريف وبقية الهامانات لديهم لإنقاذهم من الورطة التي وضعهم فيها القضاة .. ولأن ريمة صعب عليها أن تعود إلى عاداتها القديمة ، تفتق ذهن هامانات الحزن الوطني عن تلك العادات الجديدة أو المعدلة لريمة .. وهي ليست مستغربة أبداً على الأمن المصري الذي هو من أخيب أجهزة الأمن في العالم .. فهو عادة على علاقات قوية ووطيدة مع البلطجية وهم يسرحون ويمرحون تحت أعينه ويتعامل معهم دوماً فيترك لهم حرية الحركة أحياناً ويمسكها أحياناً وفق مصالح الباشا الضابط أو المأمور أو رئيس المباحث وهؤلاء البلطجية يعملون طوال حياتهم كمرشدين للبوليس الخائب الرجا منذ عقود طويلة ويقومون بتصريف (بيع) الأسلحة التي يضبطونها بدون ترخيص .. تباع لأصحابها المضبوطة معهم بواسطة هؤلاء البلطجية ويتم استبدالها في محاضر الباشوات بأخرى قديمة لا ثمن لها .. حكاية معروفة جداً في الصعيد وكل مصر .. قصص واقعية رأيتها بنفسي ولدى الكثير ما يثبتها لوزير الداخلية إن كان في مصر زير للداخلية .. إذن هي علاقة غير عابرة كما نرى .. إنها علاقة تاريخية .. ولجوء لجنة سياسات المحروس وهامانات الحزن الوطني إلى تلك العلاقة يعني إفلاسهم وضعفهم أمام الشعب المصري وصمود القضاء المصري وهذا ما يبشر بالخير كما ترون .. وهذا الإفلاس دفعهم إلى التعبير بصورة عملية على ما في نفوسهم المريضة نحو هذا الوطن الطيب .. فهم لن يتركوا الأمر للشعب كي يختار من يمثله ويحكمه .. ولا يريدون إصلاحاً كما يدعون .. لأن سنة أولى إصلاح .. وأول خ<br />اقرأ بقية التعليق .."
