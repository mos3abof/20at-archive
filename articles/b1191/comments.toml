[[comments]]
order = 2
subject = "قطر بمواقفها الصريحة و الجريئة خير من نفاق ثلاثي الشر"
author = "قطر على صغر مساحتها وقلة سكانها ، لها من الجهودالمشكورة في خدمة الامة(سواء صادقة او منافقة -الله اعلم بالنوايا) ما يعادل ما قدمة مثلث الشر للامة او قل مربع الشر اضعافا مضاعفة."
posted = "2006-09-05"
text = "وحسب قطر فخرا وتيها ان منها تصدر قناة الجزيرة التى أرى أنها تعدل قرنا من التخلف والظلام الذي احاطنا به طواغيت العرب ومن خلفهم الغرب الكافر.<br />فا سكتوا عن قطر واميرها ، وانشغلوا بطواغيتكم فلهم من الخيانات ما يربوا اضعافا مضاعفة مالقطر واميرها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143214/http://www.20at.com/article2.php?sid=1191"

[[comments]]
order = 3
subject = "اخشى من اليونيفيل"
author = "هدية"
posted = "2006-09-05"
text = "هذه قوات اليونفيل ما ساقوله عنها لا يحتاج الى محلل سياسي او خبير استراتيجي او عسكري، وانما الهدف من هذه القوات هو منع اي تحرك لحزب الله من اي من الدول المحيطة بلبنان. قوات اليونيفيل هذه هي بمثابة جيش منظم يخدم اسرائيل، وانا اجزم جزما قاطعا أن بين هذه القوات جنود اسرائيليون، واننا عندما نتحدث عن 6000 جندي من اليونفيل يمتد على حدود لا تصل بضعة كيلو مترات، فهذا هو الاجرام بحق الشعوب العربية وشعب لبنان بعينه.<br />ستبدي لك الايام ما كنت جاهلا وياتيك بالانباء من لم تزود"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143214/http://www.20at.com/article2.php?sid=1191"

[[comments]]
order = 4
subject = "من امتي ياقطر"
author = "وفاء &وليد"
posted = "2006-09-05"
text = "قبل كتابة تعليقي اقسم ان كل البلاد العربيه والاسلاميه بلادي ووطنى الذى ولدت فيه هو امي ولكن منذ متى وقطر تنظر للدول العربية المحتله قبل ان تدعم الأمن خارج حدودها فلتأمن العرب من خطر القواعد الأمريكية داخل بلادها يوم رايت العلم القطري للهلال الأحمر القطري في لبنان لم اصدق عيني ولم اكن اعرف ماتنويه قطر تلك الولايه الأمريكيه داخل البلاد العربيه ولا أقصد شعب قطر الحبيب وإنما الحكام الذين يجلبون علي الشعوب الخيبه ككثير من الدول العربية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143214/http://www.20at.com/article2.php?sid=1191"

