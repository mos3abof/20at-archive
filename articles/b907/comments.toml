text = "القرآن موجود<br />اللى عايز يتأكد يفتح المصحف على السورة الثالثة ( آل عمران ) - الآية 39 و يقرا الآية ..أنا ممكن اعمل كوبى للأآية بس مش هاعمل كده علشان تفتحوا المصحف و تاخدوا ثواب..<br />فى معجم ألفاظ القرآن الكريم..هى دى المرة الوحيدة اللى ذكرت فيها كلمة حصورا فى كتاب الله."
