[[comments]]
order = 30
subject = "مفيش حد فاهم حاجة"
author = "dola"
posted = "2006-07-16"
text = "أولاً : كما قال الكتاب المقدس ( فحاشة لي أن أفتخر إلا بصليب ربنا وألهنا يسوع المسيح له المجد والقوى ) فأنا أعلم علم اليقين كما اعلم الحروف وأنا أكتب لكم هذا الكلام فطبيعة سيدي ومولاي السيد المسيح له المجد طبيعة ألاهية لا يدركها أحد وهي أعظم من كل ما كتب عنه فجميع مواصفاته تتكلم وتقول أني أله صنع المعجزات وأقام الموتا وقادر على خلق الكائن الحي من جديد وأنه لا ينزل إلى الدنيا لكي يمرح ويتزوج ويحارب ويلد ويكون أب ويكون جد لانه أعلى من هذا بكثير وأكرم بكثير وكما قال الكتاب المقدس ( من منكم يبكتني على خطيئا) ومعنى هذا أن من منكم يقول لي أني فاعل خطيئا وهذا الكلام ليس في الإنجيل فقط بل فكل الكتب السماوية صاحب القلب الكبير وصاحب العطف العظيم فقال في الكتاب المقدس ( أن نسيت الأم رضيعها أنا لا أنساك )فهل تجد أحن من هذا الكلام والأفعال الذي أوقف الريح برفعة يد واخاف المطر بنظرة عين واخراً أرجوا أن لا يغضب مني أحد فأنا أحب ديني واحترمه وأخاف عليه وأغار عليه فأن الكافر غابد الحجر يحترم الذي يعبده وهو من الحجر فما بالك من أنسان يعتنق دين يعتنقه أكثر من ثلثي العالم من العباقر والمخترعون والجبابرة وأسياد العالم في كل المجالات من وصلوا إلى القمر .............. وشكرأ... A&S"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

