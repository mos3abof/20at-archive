[[comments]]
order = 1
subject = "خواطر"
author = "الزيني بركات"
posted = "2006-06-06"
text = "السلام عليكم<br />يبدوا وان الاخت كاتبة المقال ليس لديها فكرة من قريب او من بعد عن الرواية و لهذه لم تتطرق الى تفاصيلها و حسنا فعلت<br />المهم<br />من وجهة نظري فى الرواية نقطتين اساسيتين<br />اولهما هو محاولة الرواية اظهار الكنيسة الكاثلوكية بانها متسلطة و تحول ان تزين الباطل و تظهره حقا من اجل مكاسب دنيوية<br />النقطة الثانية وهي زواج السيد المسيح من مريم المجدلية و حتى لا يحدث الخلط مريم المجدلية ليست السيدة مريم العذراء و بما ان الفيلم يقول بزواج سيدنا عيسي اذن فهو ليس بإله كما يزعم المسيحيون<br />مما سبق يتضح لنا ان الفيلم يمثل هدما للعقيدة المسيحية فهو يحاول ان يقلص سلطة الكنيسة على من تتخيل هي انه شعبها و يظهر الكهنة و القساوسة على صورة الآفقين<br />و من ناحية اخرى يهدم حجر الزواية فى عقيدتهم<br />و لكن ليس معن هذا ان نهرول اليه على اساس انه طالما يخالف الشريعة المسيحية فانهة متفق مع الشريعة الأسلامية الغراء يجب اولا اخذ رأي المجلس الأعلى للشئون الاسلامية في موقفه من هذا الفيلم<br />شكرا لكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

[[comments]]
order = 2
subject = "لا تعارض.."
author = "محمد الفيومي"
posted = "2006-06-06"
text = "انا لا اري اي تعارض بين الروايه والشريعه الاسلاميه فالروايه تنفي صفه الالوهيه عن السيد المسيح وهذا ما ورد في القران ..كذلك لم يرد في القران اي شيئ عن زواج السيد المسيح ولكن بما انه بشر فماالمانع من ان يكون قد تزوج ؟؟<br />اما عن الفيلم فبعد ان شاهدته اصابني احباط شديد فهو اضعف من الروايه بمراحل بل من الظلم المقارنه بينهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

[[comments]]
order = 3
subject = "الى محمد الفيومي"
author = "إياد"
posted = "2006-06-06"
text = "الأخ محمد الفيومي،<br />السلام عليكم،<br />لقد المني اول ما قلت بأنه لا اختلاف بين الرواية والشريعة الإسلامية،<br />وهنا أقول بأن هناك اختلافا فظيعا بين الرواية والقران الكريم، فقد وصف السيد المسيح علية السلام في الأية ( وكان سيدا وحصورا) وحصورا هنا تعني انه لا يأتي النساء ولا يتزوج وهذا هو معنى الكلمة باللغة العربية وما اجمع عليه المفسرون وهنا تكون الرواية قد خالفت نصا قرانيا صريحا، أرجو تصحيح معلوماتك،<br />والله م وراء القصد."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

[[comments]]
order = 4
subject = "دعاء"
author = "الى الزيني بركات"
posted = "2006-06-06"
text = "الى االاخ الزيني بركات<br />لماذا افترضت انني لم اقرا الرواية ولا اعرف عن تفاصيلها شيء هل تعرفني شخصيا وهل تعرف عني اكثر مما اعرف انا شخصيا؟<br />اما عن كلام حضرتك بخصوص المنشور في الرواية وما تحتويه من اختلاف مع راي الكنيسة فهو منشور من قبل ومعروف ومنشور في لينك مع الموضوع عن تفاصيل الرواية وعرض لها ولكن يبدو ان حضرتك قرات الموضوع بدون تركيز فمررت على اللينكات مرورا سريعا<br />فلا داعي للتكرار مادام هناك من قدم المعلومات ووضعت مع الموضوع<br />شكرا على مشاركتك ولكن ياريت تقرا الموضوع بشكل مختلف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

