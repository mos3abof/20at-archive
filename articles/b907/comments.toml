[[comments]]
order = 7
subject = "تعليق على تعليق دعاء"
author = "الزيني بركات"
posted = "2006-06-06"
text = "السلام عليكم<br />الأخت الفاضلة دعاء الشامي<br />تحية طيبا و شكرا واجبا لك على هذه الطريقة الراقية فى الحوار و اعتذر ان كنت اسئت فى الاسلوب و اقول هنا الاسلوب فقط<br />ولكن دعينا نحلل تلك الكلمات التى قلتها اولا انا بدأت بكلمة يبدوا و هي تحتمل الصواب كما قد تحتمل الخطأ و الحقيقة ما دفعنى الى ذلك الأستنتاج هو ذلك العنوان الذى جذبنى و ما إن دخلت لم اجد اهم ما يمتاز به الفيلم خلافا للعنوان البراق و جدت ارقاما و ابطالا و امر بالمنع غير مبرر فكانت حدتى فى النقد و عموما انا اسف اختى ان اشتدت حدة نقدى على مقالتك<br />اما بالنسبة للروابط فى الواقع انا لم ادخل عليها من الأصل فأنا داخل الى موضوعك انت و ليس للروابط التى وضعتيها فقط الروابط للأستزادة و ليست لمعرفة نقاط اساسية فى الموضوع<br />اخيرا لاحظت خطأ فادحا فادحا فادحا<br />و هو قول ان سيدنا عيسى ورد فى حقى فى القرآن الكريم ان سيدا و حصورا و هذا خطأ لن الذى ورد فى هذا السياق اي انه سيدا و حصورا هو سيدنا يحيى<br />اخيرا اشكر كل من ساهم فى خروج الموضوع بهذا النسق الطيب او عتذر مرة اخرى للأخت دعاء ان رأت هي انى أست<br />السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

