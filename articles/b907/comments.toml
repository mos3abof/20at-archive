text = "]ؤشفني ان تتكلموا بما لاتعلمون،<br />وردت سيدا وحصورا في موقع اخر في الكلام عن المسيح عليه السلام، اتمنى ان تقرءا القران بتمعن،<br />وأن تتوقفا عن خدمة الصهيونية التي صنعت هذه الرواية، والتي عمرها أكثر من عشر سنوات ولكن لم تثر حتى الأن ،<br />اتعجب لماذا"
