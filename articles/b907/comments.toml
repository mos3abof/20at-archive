[[comments]]
order = 24
subject = "شفرة دافنشي حقيقية ولدي الدليل المادي"
author = "شمس الحقيقة"
posted = "2006-06-14"
text = "قرأت كتابا للباحث العربي المصري شاهين حسانين بموافقة الأزهر و دار الكتب و هو \" تفسير رؤيا النبي دانيال\" يؤكد بالدليل المادي الملموس الذي لا يمكن ان يتطرق اليه ادنى شك ان ما جاء في شفرة دافنشي صحيح ما عدا عبادة غير الله الواحد القهار الفرد الصمد ,ولدي حاليا نسخة من هذا البحث العظيم الذي يعتمد على الأدلة والوقائع العالمية التي يعترف بها العالم ويصحح الأخطاء القليلة المتواجدة في شفرة دافنشى علما انه صدر قبل صدور شفرة دافشي ولدي اسئلة<br />* لماذا ذهبت المجدلية للقبر والأجدر ان تذهب العذراء ألا اذا كانت العذراء تعلم ان ابنها آمن في مكان ما نقله اليه الله عز وجل .<br />* لم يكن دافنشي من الجهل او الغباء بحيث يرسم يوحنا مرتين احداحما حليق الذقن على صدره والأخري على يساره مع الحواريين مما يؤكد انها زوجته و على صدره.<br />* يوجد خلط في المسيحية فيعتبر البعض يوحنا هو يحيى ابن زكريا في حين ان هناك في آخر الأناجيل يوحنا اللاهوتي في حين ان التاريخ يؤكد ذبح يحيى ابن زكريا في رقصة سالومي الشهيرة فب حين من يقراء انجيل يوحنا يغرق في معرفة حقيقة كاتب هذا الأنجيل من هؤلاء الثلاثة \" يحيى _ يوحنا المعمداني _ يوحنا اللاهوتي\"<br />اما رأي فكلهم بحيى ابن زكريا وتم اضافة بعض الأحداث وبعض التحريفات عن طريق اليهودوقسطنطين الأكبر في سنة 325 \"ممؤتمر نقية\" حيث ان كتاب تفسير رؤيا النبي دانيال أكد بالوقائع التاربخية العالمية الثابتة و المؤكدة و المتواجدة في كتب تاريخ العلم القديم والحديث و الشرقي والغربي ان قسطنطين الأكبر هو القرن الصفير.<br />واذا تم ضم كتاب تفسير رؤيا النبي دانيال مع شفرة دافنشى ستصمت جميع الألسنة وتراج نفسها في تفكير جاد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

