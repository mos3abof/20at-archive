posted = "2006-06-19"
text = "عندما نطلب حرية الصحافه وحرية كتابة القصص حتي الوهميه لابد انعرف اننا نكتب ما نشاء ان نكتبه ولكن دون تجريح او دون مغالطه في حق الآخرين .<br />فانت تستعجبي جدا منع عرض ذلك الفيلم في بلد مثل مصر الحبيبه.<br />احب ان اقول لك انني شخصيا رفضت ارسال لأصدقائي الصور المسيئه للرسول برغم اطلاعي عليه رؤيتي لها انها صور عاديه جدا وكحد قولك اين الحريه..........<br />نحن في زمن العولمه ولم لن تقدر اي حكومه او جهه منع عرض اي شيء مهما ان يكون"
