[[comments]]
order = 33
subject = "قال تعالي"
author = "كاسبر اسكاي"
posted = "2006-10-23"
text = "بسم الله الرحمن الرحيم آمن الرسول بما أنزل إليه من ربه والمؤمنون كل آمن بالله وملآئكته وكتبه ورسله لا نفرق بين أحد من رسله وقالوا سمعنا وأطعنا غفرانك ربنا وإليك المصير [البقرة : 285] بسم الله الرحمن الرحيم قل يا أهل الكتاب تعالوا إلى كلمة سواء بيننا وبينكم ألا نعبد إلا الله ولا نشرك به شيئا ولا يتخذ بعضنا بعضا أربابا من دون الله فإن تولوا فقولوا اشهدوا بأنا مسلمون [آل عمران : 64] بسم الله الرحمن الرحيم قالوا اتخذ الله ولدا سبحانه بل له ما في السماوات والأرض كل له قانتون [البقرة : 116]"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"
