author = "كمال"
posted = "2006-06-13"
text = "السلام على من إتبع الهدي أرجو أن تكون مناقشاتنا بحثا عن الحق لا لإثبات أني علي صواب وغيري خطأ المهم حصورا جائت في سياق الحديث عن نبي الله يحيي كما بين الأخ ياسر وأنا لا أدري لماذا تمنع مصر الدولة الإسلامية عرض الفيلم كما إنها ستمنع القصة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

[[comments]]
