[[comments]]
order = 26
subject = "على فكرة"
author = "Yahya_Ayash"
posted = "2006-06-16"
text = "بس هو في أمور مهم جدا اننا نتكلم فيها قبل الكلام عن الحاجات الصغيرة دي..<br />أنا شفت الفيلم وقرأت القصة..<br />طبعا الفيلم يصور الصهيونية على أنها حامية الحقيقة في هذا العالم وحاملة المسيحية الحقة..مش مشكلة..<br />القصة التي أوردها الفيلم عن المسيح فيها كذا نقطة:<br />-أولا هي لا تحمل أي قدر من الإساءة للمسيح عليه السلام، وكون المسيح تزوج لا أرى في هذا القول ما يعارض الإسلام، الله تعالى عندما وصف رهبانية بعض النصارى قال عنها أنها مبتدعة، أي أنها لم تكن من سنة المسيح إذن!!<br />ورغم أن هذا ليس دليلا قاطعا إلا أن الفكرة هي أنه ليس لدينا في الإسلام ثم ما يناقض فرض أن المسيح قد تزوج..<br />ولا يعيب المسيح أن يتزوج أصلا ولا تعتبر هذه إساءة!!<br />-القصة المكتوبة تحمل نقدا واضحا للفاتيكان، وللكنيسة الشرقية أيضا، بينما وجدت أنها قد تحولت إلى لمز من طرف خفي في الفيلم..لكن كل ما قيل على أية حال لا يزال في نطاق وجهات النظر التاريخية ولا يبرر أيضا مصادرة الفيلم..<br />ما روي في الفيلم عن طقوس المنظمة الكاثوليكية التي يرأسها ذلك القس ويتبعها الفتى \"عدو الشمس\" لا أستحضر أسماء، قال دان براون أنها جميعا طقوس حقيقية، ومن المعلوم لدى كثير من المطلعين أنه حقيقي أن ثم طوائف كاثوليكية يمارس بعض معتنقيها التعذيب الذاتي، كذا فيما يتعلق بالطقس الجنسي الذي مارسه رئيس رابطة صهيون، والذي لم يرد شرحه وشرح بواعثه في الفيلم، فيما شرح باستفاضة، من البواعث العقدية، ومناسبته وطريقته، في القصة..ربما عرضت هذه المسائل بهذا الشكل في الفيلم لإتاحة عمل مونتاج لهذه اللقطة أثناء المشاهدة العائلية؟..لا أدري في الواقع..<br />الموضوع يطول الحديث فيه، لكن في النهاية لا أرى ما يبرر منع الفيلم أو القصة، ومطاردة من يحوز نسخا منهما بهذا الشكل السخيف، المسيحيين يتداولون فيما بينهم أفلاما وكتبا تناقض الإسلام، وببساطة إذا كان مسلم يتأذى من هذه المواد فعليه ألا يطلع عليها، فلا أقل من أن يمنح غير المسيحيين نفس الحق!!<br />تحياتي.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

