[[comments]]
order = 13
subject = "بيننا و بينك كتاب الله"
author = "د. ياسر نجم"
posted = "2006-06-07"
text = "الى الاخ اياد مرة أخرى...<br />اذا كنت تبتغى وجه الحق من مشاركاتك..فاما أن تأتى لنا برقم الآية و اسم السورة التى ورد فيها هذا الكلام ( كما جئتك انا برقم الآية الوحيدة التى وردت فيها كلمة : حصورا فى القرآن الكريم و قد تأكدت من هذا بنفسى من خلال مراجعة المعجم المفهرس لألفاظ القرآن الكريم ) أو ان تعترف بخطأك و الشجاعة الادبية من شيم الرجال...<br />أما اذا كنت تعاند فقط لاثبات صحة رأيك او أخذتك العزة بالاثم..فأنصحك ألا تشارك فى هذا الموضوع ثانية..أولا: لأن اصرارك على الخطأ سيكلفك الكثير عندما تقف أمام الله عز و جل خاصة و أن الامر يتعلق بكتابه الكريم..ثانيا: لأن منظرك ها يبقى وحش أوى اذا ماجبتش رقم الآية و موضعها فى القرآن.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

[[comments]]
order = 14
subject = "تعليقات تعليقات تعليقات تعليقات"
author = "الزيني بركات"
posted = "2006-06-07"
text = "السلام عليكم جميعا<br />لي بعض الملاحظات اخذها بالترتيب<br />أولا -: الاخت الفاضلة دعاء اولا شكرا على ردك و لازلت مصمما على ان الروابط للأستزادة فمثلا اذا ما كتبت مقالا او موضعا عن حياة رسولنا الكريم صلوات ربي و تسليماته عليه هناك نقاط لا يمكن اغفالها فمثلا لن تقولى عن صلح الحديبية انظر الرحيق المختوم صفحة 117 بما انه تطرق اليه قبلك و عندما نصل الى حادثة الهجرة انظر كتاب السيرة النبوية لأبن هشام صفحة 302<br />الموضوع مكتوب بقلم دعاء .... اذن يجب ان يظهر فيه اسلوب دعاء و من الزاوية التى ترها دعاء<br />ثانيا :- الاخت دعاء ايضا ليتك تمسكت بأسلوبك الطيب فى النقض عندما رددت على الاخ المعارض فليتسع صدرك لكل منتقد و لو كان على غير الحق فأتسأل ما فائدة قولك \" و يا ريت بلاش رغي على الفاضى\" و لو كان تعليقيك توقف عند \"يا ريت تقول لنا منقول منين\" لكن افضل و لأحرجتيه ادبياً<br />ثالثا :- الأخ اياد نفس الملاحظة يجب ان يتسع صدرك لنا جميعا و اخشى ان الرأي بان حصورا ارتبطت بسيدنا يحيى بالاية التى ورد ذكرها 39 من آل عمران هو رأي صحيح<br />فلما بحثت وجدت انه قد روى الطبراني عن أبي أمامة مرفوعا { أربعة لعنوا في الدنيا , والآخرة وأمنت الملائكة : رجل جعله الله ذكرا فأنث نفسه وتشبه بالنساء , وامرأة جعلها الله أنثى فتذكرت وتشبهت بالرجال , والذي يضل الأعمى , ورجل حصور , ولن يجعل الله حصورا إلا يحيى ابن زكريا }<br />مع العلمة ان لفظ \" الكلمة \" المذكور بالاية الشريفة المراد بها سيدنا عيسى ارجوا ان تسأل من طرفك و نسأل من طرفنا نحن حتى نتحقق<br />و نحن جميعا لسنا اعداء و لا ننسى ان هدفنا واحد<br />رابعا :- التعليق الخاص بيسوع لا اجد له مكانا فى هذا الموضوع<br />خامسا :- كتبت ما كتبت ما اصبت فيه فبتوفيق من الله و ما جانبني الصواب فيه فمن نفسي و الشيطان<br />السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

[[comments]]
order = 15
subject = "فين الحجيجه يا خال"
author = "نيفين"
posted = "2006-06-07"
text = "مش قصدى اهزر بس فعلا على راى منير فين الحجيجه يا خال<br />و انا عايزه اعرف سيدا و حصورا فعلا لسيدنا عيسى ام يحيى<br />و انا بعلن و انا مكسوفه من نفسى انى كمان مش عارفاها<br />انا قرات الايه كتير بس مش متذكره<br />يا ريت اللى متاكد يقول و بلاش نفتى فى الدين<br />بالنسبه للموضوع انا شايفه ان طالما الفيلم ينفى الالوهيه عن المسيح طيب ليه بيتمنع عرضه<br />و بعدين ما الام المسيح عمل ضجه و اتعرض عادى مع انه جعل ضعاف النفوس تتاثر بيه<br />و شفره دافنشى بيفكرنى بالضجه اللى اتعملت على حليف الشيطان اللى لحد انهردا مشفتوش و بسمع ان محظور عرضه<br />يا جماعه و دى للمسلمين و المسيحين و انا مسلمه بقول للكل اتاكد من عقيدتك و بعد كدا متخفش تشوف اى حاجه ف الدنيا طالما لا تنافى الاداب<br />الرساله واضحه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

