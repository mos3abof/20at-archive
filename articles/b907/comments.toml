text = "االشكر واجب عبى فصل الخطاب بالنسبه للايه<br />و لكن و الله لا اغتر بعقيدتى بس انت مش معايا ان فيه ثوابت مثلا فى مساله صلب المسيح<br />و لكن انت عندك حق فعلا<br />الاحسن ان الواحد ميضعش نفسه موضع اختبار بالذات فى العقيده"
