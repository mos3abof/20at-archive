text = "اسمعوني لو سمحتوا انا سمعت كتير وقرات عن هاد الفلم بس بصراحه ما شفته لانو لسا مو مسموح في الاردن وعلى الرغم من اني مسلمه الحمدلله بس كتير حابه احضره رغم قناعتي الكامله انو الفلم غلط من اول الحبكه لاخرها وبرضوا بحترم اخواننا المسيحين بكل مكان"
