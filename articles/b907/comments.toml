[[comments]]
order = 18
subject = "الى د. ياسر"
author = "اياد"
posted = "2006-06-08"
text = "د. ياسر:<br />أولا: أمنى أن تضع هذه الأية بين يديك وفي نفس الوقت ان تقرأ الرواية مرة أخرى بتمعن حتى تستطيع فهم وجهة نظري. أي ان تقرأ ما بين السطور وأن تفكر قليلا.<br />ُانيا: أتمنى أن تتوقف عن استعمال اللهجة العامية في كلماتك لأن الله عزوجل قد أنعم علينا بالقرأن مكتوبا باللغة العربية الفصحى وليس باللهجة المصرية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

[[comments]]
