subject = "الى كمال"
author = "اياد"
posted = "2006-06-14"
text = "تسأل لماذا؟<br />لأن مصر دولة اسلامية فعلا، وفيها نسبة كبيرة من المواكنين المسيحيين الذين لهم حقوق وعليهم واجبات عند عيشعم في ظل دولة اسلامية، وكونهم نسبة كبيرة في مصر يجب ان تراعي الدولة مشاعرهم في عدم عرض عذا الفيلم الذي لا يخدم الإسلام ولا المسيحية، ولكنه يخدم الصهيونية،<br />مشكلتكم انكم قراء سطحيون ولا تقراون ما بين السطور،،،<br />هل عرفت لماذا يا كمال؟؟؟"
