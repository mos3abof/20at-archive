subject = "دافنشى كود"
author = "قارىء نهم"
posted = "2006-06-12"
text = "سمعت ان الرواويه ممنوعه فى مصر ولكنى اششريتها هنا فى السعوديه وهى معروضه للبيع فى جميع المكتبات ولحقت اخر نسخه بالعافيه المهم الروايه ممتعه جدا جدا لدرجه انها تسحبك معها الى عالم من الخيال والواقع فى نفس الوقت الاحداث فى الروايه تؤيد بشده وجهة النظر الاسلاميه بالنسبه الى سيدنا عيسى عليه السلام ولذلك فهى تهدم العقيده المسيحيه من اساسها ولعل ذلك هو ماجعل الروايه تهاجم من قبل العالم المسيحى وخاصة مسيحيو الشرق وشكرا ( على فكره اللى عايز نسخه من الروايه يدينى عنوانه ابعتهاله)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

