posted = "2006-06-06"
text = "طيعا الزينى على حق لأن لما نتكلم عن موضوع زى ده يبقى مش بنتكلم عن ايرادات فيلم هنيدى و لا بوحه<br />شهره الفيلم جايه من تطرقه لحاجات مهمه لم تشيرى إليها من قريب او بعيد و إذا كان المعلومات متوفره فى كل مكان يبقى ملهاش لازمه تكتبى و للأمانه أنى بعد ما قريت الموضوع كويس كنت هكتب تعليق مشابه للزينى فى المضمون ان احنا مستنين نتكلم عن القصه الرئيسيه مش إيرادات لكن طبعا الزينى مش من حقه يقول انك متعرفيش او تعرفى ميهمش اللى يهم ان الموضوع كده ملوش مردود كويس و خلاص<br />Ps your Blog is very nice Good Luck"
