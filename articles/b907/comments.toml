posted = "2006-07-12"
text = "ا جماعة عيب التشهير اللي عم تعملوه واللي عم تعتبروه وسيله لتقولو انو دينا دين الكذب والجنس والمنكر انا شخصيا ما رح احضر الفيلم لانو اكيد هوي عبارة عن اسطورة رح يايدها كل اعداء السمو الملكي الكبير لشخص السيد المسيح اللي طبيعته الالوهيه والبشريه المتداخله في سمو عظيم اكبر من عقولهنواعظم من امو نحنا بطبيعتنا البشريه الضعيفه رح نفهمها الفيلو وروايته اسطورة من الاساطير الكتيرة اللي عم تحاول تخلق بلبله وعدم حب وانسجام بين الطوائف بغض النظر عن قبولنا الها او رفضنا"
