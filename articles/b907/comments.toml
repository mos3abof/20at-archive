[[comments]]
order = 10
subject = "يا ريت الاخ اياد مايفتيش بدون علم"
author = "د. ياسر نجم"
posted = "2006-06-06"
text = "الى الاخ اياد<br />يا ريت تتاكد كويس قبل ما تفتى فى القرآن بغير علم.<br />الآية هى الآية 39 من سورة أل عمران و تتحدث عن سيدنا يحيى عليه السلام و هذه هى المرة الوحيدة التى وردت فيها كلمة ( حصورا ) فى القرآن الكريم..و لم يوصف سيدنا عيسى عليه السلام بهذا الوصف و لي فى القرآن الكريم ما يؤكد او ينفى زواجه عليه السلام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

[[comments]]
order = 11
subject = "الاخ اياد.."
author = "محمد الفيومي.."
posted = "2006-06-06"
text = "اعتقد ان الاستاذ ياسر نجم قدسبقني و اوضح مشكورا ان المقصود في الايه الشريفه هو سيدنا يحيي عليه السلام ....<br />وبهذا فا انا اصر علي موقفي انه لا يوجد اي تعارض بين هذا الروايه وبين الشريعه الاسلاميه...<br />التساؤل هو لماذا منع عرضه في مصر في الوقت الذي سمح بعرضه في دول الغرب عامه وبينها ايطاليا معقل الكاثوليكيه ؟؟؟؟...ارضاء لمن الله اعلم..رغم ان الفيلم بالفعل اقل كثيرا من الروايه في المعالجه السينمائيه..<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132536/http://www.20at.com/article2.php?sid=907"

