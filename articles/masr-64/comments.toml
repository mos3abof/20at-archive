[[comments]]
order = 4
subject = "امريكا ياخراشى"
author = "طماطم"
posted = "2006-03-26"
text = "ياجماعه لية بس كده دى امريكا ست محترمة ومؤدبة وهمها مصلحتنا طبعا عشان هية ماما امريكا زى ماقال محمد صبحى<br />هية كل اللى بتعملة انها بتفرق العرب وتوقع بينهم وتدخل فى اللى مالهاش فية وتفرض سيطرتها علينا<br />والله بجد انا ساعات بحس ان ماما امريكا هيجى يوم وتتدخل فى حياتى الشخصية<br />بس مش عارفة ساعتها هعمل اية ياترى اوافق ولا اعترض<br />بس لو قلت لاء ممكن يحولونى مجلس الامن<br />ههههههههههههههههههههه<br />ااااااااااااااااه يادماغى"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022240/http://masr.20at.com:80/article.php?sid=64&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"
