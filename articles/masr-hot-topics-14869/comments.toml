[[comments]]
order = 4
subject = ""
author = "رد على احمد جاد"
posted = "2010-01-14"
text = "منى عامر بتقول انها بتذاكر اول السنه وقبل الامتحانات ما بتعرفش تذاكر<br />احمد صلاح بيقول انه بيذاكر كويس جدا في الحمام واكتشف الموضوع دا بالصدفه انه دخل مرة الحمام ونسي واخد معاه الكتاب<br />حازم عبدالعاطي بيقول انه ما بيعرفش يذاكر الا لما يقلع هدومه كلها تقريبا يعني لامؤاخذه بيذاكر باللباس فقط والموضوع دا جاب معاه نتيجة كويسه<br />والله يا اخ احمد جاد ليهم حق الجزائريين يضربونا بالجزمه<br />يعني يا اخ احمد جاد الشعب المصري 80 مليون ما لقتش غير التلاته المتخلفين دول يا راجل"
archived = "2010-01-22"
capture_url = "https://web.archive.org/web/20100122032440/http://www.20at.com:80/masr/hot-topics/14869--qq-.html"
