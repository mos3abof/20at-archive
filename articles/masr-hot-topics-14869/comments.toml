text = "رد على نادية اولى حقوق حلوان<br />يلا بقا شدي حيلك علشان تخلصي وتبقي بت محاميه<br />بس عايزينك تبقي محاميه كويسه مسلمه تساعدي المظلومين وترجعي حقوق الناس<br />مش تبقي زي شوية الحراميه والنصابين بتوع النقض والادارية العليا"
