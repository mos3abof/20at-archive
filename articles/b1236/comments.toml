subject = "ومين سعيد اصلا"
author = "صحيح اليمن دلوقتي مش سعيد"
posted = "2006-09-29"
text = "بس مهي مصر مش سعيده ولا أغلب البلاد العربيه كلها<br />انا من يوم موعيت على الدنيا معرفش رئيس بلد عربي واحد اتغير من كرس الرئاسه على القبر علطول<br />انا يمنيه واعرف اليمنين كويس مع اني مش عايشه في اليمن دلوقتي بس عشت فيها 18 سنه من عمري<br />المهم ب اختصار الناس بيحبو الرئيس على عبدالله صالح في اليمن ومش بيتمنو رئيس غيره<br />عارفه ليه عشان من يوم ما مسك الحكم محصلش حروب والأماان مهم ل الناس في البلد الرئيس عارف ازاي يتحكم في<br />القبائل وازاي يراضيهم<br />الجهل ل الاسف منتشر في اليمن لان اليمن متحررتش الا من 44 سنه واليمن الشمالي مكنش فيها استعمار عشان كده مستوى التعليم متدني في البلد واغلب الشعب جاهل اصلا ف انتي تخيلي ازاي واحد متعلم بيقود سفينه اغلب طاقمها مش مدربين مظنش السفينه هتتحرك ولا هيفهمو اللي بيقوله<br />اصلا<br />اتمنى تكوني فهمتي نقطتي لانك لو مفهمتيش<br />الرئيس علي عبدلله صالح مع اعتراضي على السرقه والنهب اللي بيحصل لانه اصلا بيضرني انا في المقام الاول<br />ولكنه عبقري عشان منغيره اليمن هتدخل في صراعات القبليه والصراع على السلطه والحرب واغلب الشعب بيملك سلاح وقنابل<br />والمؤتمر حزب معتدل مش متشدد ولا منفتح<br />يعني حزب وسط وخير الامور الوسط<br />اه نسيت مقول نقطه معينه<br />اوعو تفكرو ان الناس دي بتسرق سكيتي لا ده عيني عينك يعني عادي<br />والناس عارفه والمشكله بتحترم الناس بتوع المناصب وبيعملولهم الف حساب والرئيس فعلا ميقدرش يحاسبهم لانه هيسجن كل الحكومه واولهم هو نفسه<br />الناس بس عاوزه تعيش وتاكل وتخزن قات واغلب الناس في اليمن ليها مغتربين يعيشوهم ويصرفو عليهم<br />وبعد ان شاء الله ما اغلب اليمنين يتعلمو والحال يتغير ان شاء الله الاحوال هتتغير ويبقى فيه امل في البلد وفي بلادنا العربيه لان اليمن فيها خير والناس<br />طيبين وبسطاء جدا<br />وربنا يسهل وابقى اعيش لحد اليوم ده"
