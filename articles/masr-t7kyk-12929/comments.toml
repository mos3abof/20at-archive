author = "sweet emo girl"
posted = "2009-08-13"
text = "برأيي المنحوس منحوس لو علئو فوء راسو فانوس<br />ياما صار في حملات من اجل مساعدة الغير وخاصة الناس الفقراء كتير كتير<br />بس في البداية نتحمس وتكون المساعدات للشعب وبعد هيك بتصير مصالح شخصية والله<br />اعلم وهيك دكية …في رمضان<br />مو بس مصر فيها هي النسبة من هاؤلاء الافراد<br />لا بل تعدى ذلك دولا كتيرة حتى المقتدرين باتو لا يستطيعون العيش من كترة الضرائب<br />ولا ننسى في الاردن ما لحق باهالينا من خسائر مالية فأنا بالنسبة الي اهلي خسرو نص مليون …وهاد ولا شي بالنسبة لغيرنا<br />لهيك كل واحد بدو مين يساعدو ليش الحكام ما يقوموا همي باتخاذ القرارات والتعويضات<br />اللازمة لتخطي هذه الازمات الشعبية<br />تحياتي:<br />احلى بنوته ايمو بالاردن<br />لا تقولوا عنا ما لا تعلمون<br />فنحن لسنا الا حساسون متمردو الحس والايمو ليس ديانه انما هو تقافتنا وستايلنا واسلوبنا في العيش فلا تقولو شيئا غير معقول<br />فنحن اجمل ظاهرة تعشق الحس والاحساس<br />باي باي"
archived = "2009-08-15"
capture_url = "https://web.archive.org/web/20090815000242/http://www.20at.com:80/masr/t7kyk/12929--qq-.html"

