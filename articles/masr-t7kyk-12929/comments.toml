[[comments]]
order = 4
subject = ""
author = "بقية التعليق السابق"
posted = "2009-08-30"
text = "اقرؤوا الكلام دا<br />ـــــــــــــــ ـــــــــــــــ ــــــــــــــ<br />كشفت دراسة جامعية أن 100 ألف يصابون بالسرطان سنوياً في مصر بسبب تلوث المياه، وأن أكثر من 35 ألفاً يصابون بالفشل الكلوي، بينهم أكثر من 17 ألف طفل يعانون من أعراض مزمنة.<br />وكانت الدراسة التي أعدها أساتذة الكيمياء التحليلية بكلية العلوم بجامعة المنصورة، وعرض لها الدكتور مجدي خليفة قد أكدت أن نسبة مرضي الفشل الكلوي في مصر ارتفعت في الآونة الأخيرة بنسبة كبيرة، حيث ذكرت بيانات الجمعية العامة لمكافحة الفشل الكلوي أن نسبة الإصابة بالفشل الكلوي ارتفعت بشكل مخيف في محافظات مصر بنسب تتجاوز 500 مريض لكل مليون نسمة، وتتزايد بنسبة 40% سنوياً.<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />نساعد احياء القبور ايه بقا<br />اذا كان الاكل اللي احنا بناكله والميه اللي احنا بنشربها بيجيبوا سرطان وفشل كلوي<br />يبقى ايه لزمته نضحك على دقون الناس ونقولهم رحمة ونور"
archived = "2009-09-28"
capture_url = "https://web.archive.org/web/20090928041717/http://www.20at.com:80/masr/t7kyk/12929--qq-.html"

[[comments]]
order = 5
subject = ""
author = "بقية التعليق السابق"
posted = "2009-08-30"
text = "وبعدين سكان القبور مش خطر<br />اللي اخطر منه عدم توفر العلاج للمواطنين<br />تخيلوا لما الواحد يمرض وما يلاقيش حق الدوا<br />تخيلوا لما اسرة العائل بتاعهم يجيلوا فشل كلوي ويبقوا مش عارفين يروحوا فين ولا يعملوا ايه<br />تخيلوا لما ارمله بتربي ايتام يجيلها سرطان الثدي ومش عارفه تربي ايتام ولا تتعالج<br />يا جماعة مفيش علاج في البلد ـ مصر ما بتعالجش حد<br />اللي معاه فلوس حيتعالج واللي معهوش يروح في ستين داهية<br />دي مشكلة اهم من سكان القبور<br />مصر ما فيهاش علاج<br />العلاج في مصر بالفلوس والدكاتره اصبحوا مستثمرين وجزارين<br />بلا احياء القبور بلا شعارات كاذبه ونصب علني<br />الدولة والناس لازم يتغيروا<br />كده غلط<br />غلط يبقى فيه عادل امام ومنى غبي واحمد حلمي واحمد عز وابو هشيما وهيفاء وهبي وابو تريكا<br />ابو تريكا لما بيعطس بيودوه المانيا بطائرة خاصة يتعالج<br />غلط كده يا جماعة يبقى الناس اللي فوق بيمصوا في دم الناس اللي تحت"
archived = "2009-09-28"
capture_url = "https://web.archive.org/web/20090928041717/http://www.20at.com:80/masr/t7kyk/12929--qq-.html"

[[comments]]
order = 6
subject = ""
author = "بقية التعليق السابق"
posted = "2009-08-30"
text = "وبعدين حنساعدهم حنعملهم ايه يعني<br />ومين اللي حيساعدهم اصلا<br />اللي بتطلبوا انهم يساعدوهم عايزين مساعدة اصلا<br />واللي بيطلبوا المساعدة مين هما<br />وهل يا ترى هما امناء على توصيل هذه المساعدات<br />اشرحولنا ازاي المساعدات دي حتوصل<br />وايه المساعدات اللي حتقدموها لسكان القبور<br />حتبنولهم بيوت مثلا<br />ولا ايه بالضبط<br />في رايي<br />اللي طالب المساعدة مش احياء القبور<br />اللي طالب المساعدة القائمين على المشروع<br />اللي عايز يساعد احياء القبور ما ينساش مرضى الفشل الكلوي والسرطات<br />وحتى مرضى الانفلونزا<br />ما ينساش ان الشعب كله عايز مساعده<br />الشعب كله السلك ضارب عنده<br />الشعب كله عايش على الهوا<br />كباية الشاي بقت بجنيه<br />خلاص الجنيه اصبح قرش ساغ<br />يعني 100 جنيه اصبحت جنيه<br />الـ 100 جنيه ما بتكفيش النهار<br />المفروض نغير اسلوب حياتنا<br />مفيش ممثلين<br />مفيش تجار حديد<br />وغيره وغيره وغيره<br />وبعدين حياتنا كل مشاكلنا حتتصلح<br />في بلد فيها سكان قبور وفشل كلوي وسرطان ناس عايشه بتلعب بالملايين<br />ايه اللي بيحصل دا"
archived = "2009-09-28"
capture_url = "https://web.archive.org/web/20090928041717/http://www.20at.com:80/masr/t7kyk/12929--qq-.html"

[[comments]]
