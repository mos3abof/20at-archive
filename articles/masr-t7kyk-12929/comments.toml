text = "ياجماعة ايه الكلام ده وزارة ايه ونيلة ايه الوزارة يعني سرقة مبيجبش نتيجة للفقير غير الانسان اللي يحس بيه من غير مكاسب ..<br />الناس اللي بتشتغل في جمعيات بعيدة عن منح امريكا بتكون بجد لها دور ومالهاش غير خدمة الناس<br />تصدق واتركها على الله"
