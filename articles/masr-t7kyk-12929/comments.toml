text = "سكان القبور من انجازات الوطنى<br />وفى السياسات ان يجعلوا نصف سكان مصر من سكان القبور الاحياء ونصفهم الاخر من الاموات<br />انا رايىى محدش يساعد احد<br />فية دولة بتلم ضرايب واللى بيشم هواء بيدفع تبقى الدولة تراعيهم واذا لم تراعيهم الدولة يطلعوا ياخدوا حقهم بدراعهم"
archived = "2009-08-15"
capture_url = "https://web.archive.org/web/20090815000242/http://www.20at.com:80/masr/t7kyk/12929--qq-.html"

