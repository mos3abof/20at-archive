subject = ""
author = "مش ححبك 11"
posted = "2009-08-30"
text = "قبل ما نساعد احياء القبور<br />لازم الاول نعمل تحقيق شامل عن سبب هذه الظاهرة<br />ونعرف مين اللي تسبب فيها ونعاقبه<br />وقبل ما نساعد احياء القبور لازم الاسلوب المعيشي والحياتي للناس يتغير<br />يعني مثلا هناك الممثلين يتقاضون بالملايين وعلى سبيل المثال وليس الحصر عادل امام ومنى ذكي واحمد حلمي<br />وفي قطاع اخر فيه احمد عز وابو هشيما<br />ابو هشيما اتجوز بـ 50 مليون جنيه<br />واثناء التحقيق اللي احنا حنعمله حنلاقي ناس كتير اوي اوي زي دول<br />كل دا لا بد من ازالته والقضاء عليه وبعد كده نفكر في حل مشاكلنا<br />1) احياء القبور ومرضى السرطان والفشل الكلوي ومشاكل كتير اوي<br />كل دا حيتحل بعد ما نغير اسلوب حياتنا ونقضي على الناس اللي بيمصوا دم الشعب"
archived = "2009-09-28"
capture_url = "https://web.archive.org/web/20090928041717/http://www.20at.com:80/masr/t7kyk/12929--qq-.html"
