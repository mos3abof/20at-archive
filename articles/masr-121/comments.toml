[[comments]]
order = 0
subject = "صحيح .. اللي اختشوا ماتوا"
author = "sweet_princess"
posted = "2006-04-05"
text = "بقى رايح يتفرج على الكسوف بسلامته ...<br />رايح للشمس يتعلم منها ؟...<br />ولا الصنف البعيد دا ما بيعرفش حاجه اسمها كسوف؟ ..<br />بس ما كنش حد يديله نضاره خربانه يشوف بيها ..<br />عشان نظره يروح ويريحنا بقى ..<br />اعوذ بالله منك يا اخي ...<br />واللي شاكين في موضوع ان جيمي هياخد الحكم يبقى يقابلي ..<br />بس يفكرني الاول هنتقابل فين ...<br />واللي انا عرفته كمان في الايام اللي فاتت .. انه فيه مخططات من زمان لتصفية باقي الاحزاب اللي بتنافس ..<br />زي حزب الغد ..اللي دمروا حياة رئيسه ايمن نور وسجنوه ..<br />وحزب الوفد .. اللي برضه سمعت انهم فضلوا يحقنوا في الحاج نعمان لحد ما سخنوا له الطاسه .. وخلوه دخل الحزب وقلع الجزمه وقعد يشوط فيهم ..<br />غير كدا منع الامن من التدخل لمنع الاشتباكات الا بعد ما تخرب مالطه ...<br />واهي خربت مالطه ..<br />والواضح ان السياسه المتبعه الوقتي القضاء على اي حزب ممكن يكون له صوت في المستقبل ..<br />والدور ع الاخوان .. لسه دوركم جاي ياحلوين ...<br />مش بعيد يدبروا عمل ارهابي ويتهموه في دقنهم ...<br />واخيرا احب اسمع اغنية ..<br />والله وعملوها الرداله ...<br />امضاء ..<br />مفقوعه هانم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071838/http://masr.20at.com:80/article.php?sid=121&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "عقبال ما اى حد تانى يتكسف"
author = "محمد حسن"
posted = "2006-04-05"
text = "الف مبروك يا جماعه فى حاجة فى بلدنا الحبيب اتكسفت بس الواضح انه مفيش حد لا قبلها اتكسف و لا بعدها ناوى يتكسف متحلموش. و اللى مش عاجبة يشوف له بلد تانيةو رئيس تانى. بس بصراحة يا جماعه انتوا عارفين انا مش مستغرب للى بيحص منهم لا انا مستغرب للانامالية اللى احنا فيها. عارف حتقولوا ازاى هما مش حاسين باللى الناس فيه و كدة اقول لكم لا هما حاسين و عارفين الغلط بس مش بيقدروا و يا اخى بص لاحوال كفار مكة على ايام بعثة الرسول الكريم هما كانوا عارفين الحق و كانوا بيكابروا بلاش كفار مكة بسيطة بص على احوالك انت بتبقا عارف انك بتعمل حاجة غلط و عشان يتصلح حالك لازم تغيرها انما مبتقدرشى تسيطر على نفسك صح و سلم لى على شوشو ( ابليس اللى عامل فينا دا كلة )"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071838/http://masr.20at.com:80/article.php?sid=121&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
