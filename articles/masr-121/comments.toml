subject = "مخ تخين"
author = "حائر في دنيا الله"
posted = "2006-04-05"
text = "والله أشعر ان الشمس انكسفت من أفعالنا وعبرت عن نفسها ولكن يبدو أنأحدهم مخه تخييييييييييين لدرجة وحشة ومش عايز ينكفس<br />لأ وهيخلي الشعور دا متوارث للجاي<br />استر يارب"
