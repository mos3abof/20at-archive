author = "مدارس اسمها اية"
posted = "2009-10-05"
text = "فية 16 مدرسة على مستوى الجمهورية تحمل اسم مدرسة جمال مبارك<br />وفسة مدرسة واحدة تحمل اسم محمد علاء مبارك<br />شايفين الولاء والمحبة من الشعب لقيادتة السياسية<br />واللة صورة مشرفة لوعى الناس السياسى اللى بيترجموة لواقع<br />البلد لسة فيها وفاء ———————————————————————————————- من جريدة المصريون"
archived = "2009-10-21"
capture_url = "https://web.archive.org/web/20091021180353/http://www.20at.com:80/masr/ebn-balad/13625-2009-10-05-13-52-55.html"

[[comments]]
order = 1
subject = ""
author = "الناظر زمان"
posted = "2009-10-05"
text = "كان الناظر زمان بيلف على الحصص واذكر انة وجد الاستاذ بيشرح لنا حصة تربية دينية واستاذن الاستاذ ان ياخذ الحصة منة وشرح لنا حضرة الناظر قصص الانبياء - كان ذلك فى الابتدائى وكان هذا الناظر يزورنا فى بيوتنا اى واللة ويتناول القهوة مع الوالد ويشرح لة نقاط الضعف عندى ومع معظم الطلبة كذلك وكان يخطب الجمعة فى مسجد قرب بيتة - كان ازهريا عملاقا ورائعا<br />اما ناظر الثانوى فكان استاذ كيمياء وكان يلبس جزمة كاوتش وةيسير فى طرقات الفصول ويسمع شرح المدرسين واى فوضى فى فصل كان يظهر فجاة والخيرزانة الطويلة فى يدة ورئيس الفراشين شلاطة خلفة<br />وكانت المدرسة الثانوى اثناء الحصص ترمى الابرة على الارض تسمع صوتها<br />كان اداريون من الطراز الاول"
archived = "2009-10-21"
capture_url = "https://web.archive.org/web/20091021180353/http://www.20at.com:80/masr/ebn-balad/13625-2009-10-05-13-52-55.html"

