posted = "2009-10-06"
text = "اكييييييييييد فاكره مدير المدرسة بتاعتى جدااااااااا كان استاذ جودة مصطفى خليل ربنا يديه الصحة و فاكره كمان مدير ابتدائى استاذ فتحى و استاذ زيدان<br />عمرى ما انساهم و لا انسى ملامحهم و لا اسلوبهم الراقي في التعامل مع كامل الحزم و الانضباط و الاحترام<br />فاكره كمان استاذه رجاء العوضي مديرة ثانوى<br />رحمهم الله جميعا احياء و امواتا"
archived = "2009-10-21"
capture_url = "https://web.archive.org/web/20091021180353/http://www.20at.com:80/masr/ebn-balad/13625-2009-10-05-13-52-55.html"

