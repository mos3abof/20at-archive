text = "انا كنت طالب فى مدرسة اسلامية خاصة كان المدير حتى مرحلة الاعدادى مهتم جدا بالتربية الدينية للطالب لكن الحكومة كانت بتحبه قوى لدرجة انه دخل امن الدولة كذا مرة بعدها نسى كلمة اسلامية و افتكر كلمة خاصة علشان كده انا نقلت منها لمدرسة تانية"
archived = "2010-02-24"
