[[comments]]
order = 9
subject = ""
author = "احمد السلامونى"
posted = "2007-12-11"
text = "تمول بعض مخابرات الدول التى لا تريد لبلدنا الخير تلك الاقليات الصغيرة جدا لشغل المجتمع وتخريبة وتجعلة يهتم بامور صغيرة ويبتعد عن الامور المهمة فى حياتة او احداث دربكة وتوتر فى المجتمع وعدم استقرار<br />فى فرنسا ستة ملايين مسلم<br />وفى بريطانيا خمسة ملايين مسلم<br />وهى اقليات كبيرة ولكنها لا تعمل مشاكل للمجتمع البريطانى ولا يشترطوا كذا وزير فى الوزارة منهم او كذا محافظ<br />احنا دلعنا الناس دى اكتر من اللازم<br />وفردنا لهم الحبل جامد<br />الناس دى عايزة تتلم وتتؤدب وتنضرب بالجزمة واللى مش عاجبة يغور فى ستين داهية<br />اية ثلاثة اربعة الاف بهائى فى دولة 80 مليون وعاملين دوشة علشان اية يروحوا فى ستين داهية<br />والدولة نايمة على ودنها واللى بيلعب فى النوبة بتمويل خارجى<br />وكلاب المهجر<br />وخنازير الداخل<br />بقت هوجة<br />الناس دى لازم تتلم ويقفوا عند حدهم<br />قبل ما الشعب يهيج وتحدث فرقعة ومنعرفش عدد القتلى منهم قد اية"
archived = "2009-09-22"
capture_url = "https://web.archive.org/web/20090922201409/http://www.20at.com:80/masr/t7kyk/7767.html"

