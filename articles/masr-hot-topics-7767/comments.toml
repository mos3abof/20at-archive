posted = "2007-12-10"
text = "و الله يا جماعه انا ليا وجهه نظر يمكن متعجبش ناس كتير بس ده رايى الخاص<br />انا شايفه ان الحكومه تدى الناس دى حقوقها من باب اخماد اى فتنه ممكن تحصل و اى تدخل من جهات اجنبيه لان ببساطه الناس دى لو مخدتش حقوقها هتلجا لجهات كلنا عارفينها و الجهات دى هتاخد من الموضوع ده مخلب قط لكل اهدافها و محدش يقوللى عددهم صغير لان الموضوع مش بيبقى ساعتها ف العدد..انا اعتقادى الخاص و الراسخ ان الدين عند الله الاسلام و لا اعترف بدين الا الاسلام و لا يوجد دين غير الاسلام اما المسيحيه و اليهوديه فدى رسالات سماويه و ليست اديان..و فى نفس الوقت بقول الحكومه تديهم حقوقهم و حسابهم عند ربنا"
archived = "2009-09-22"
capture_url = "https://web.archive.org/web/20090922201409/http://www.20at.com:80/masr/t7kyk/7767.html"

