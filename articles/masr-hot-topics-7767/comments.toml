posted = "2007-12-10"
text = "مع ايماني الكامل بحريه الاديان وذلل من قول ربنا تبارك وتعالي (قل يأيها الكافرون لاأعبد ما تعبدون ولاأنتم عابدون ما ابعد ولاأنا عابد ما عبدتم لكم دينكم ولي ديني )صدق الله العظيم فأن اري ان البهائيه كفر باين ولا يستحق معتنقوها اي حقوق او وواجبات فلنتركهم هكذا الا اذا كان بهم مسلمون واعتقوا هذه الخزعبلات فدديننا ينص علي معاقبه المرتد عن الاسلام اي كان ولا اعرف لماذا تقيم بعض منظمات حقوق الانسان الدنيا لمثل هؤلاء فهذا ليس بدبن ولن يكون كفوا ايديم عن هذ الهراء ولا اعرف كيف بهم دكاتره ومهندسون اليس بهم عقول لا تلعبوا بالنار وسيبكم من بهاء والي معها"
archived = "2009-09-22"
capture_url = "https://web.archive.org/web/20090922201409/http://www.20at.com:80/masr/t7kyk/7767.html"

