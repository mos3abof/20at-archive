posted = "2007-12-11"
text = "كما ان لكل انسان عورة يسترها …فالبهائي ة هي عورة ولوثة عقلية ينبغي ان تستر ولا تنشر بل يننبغي ان تموت وتوؤد فالعوار الفكري لا يلتفت اليه ومكانه مزابل التاريخ وهذه العورات ما كان لها ان تظهر الا والامة الاسلامية بهذا الضعف وهذا الهوان …وعلاج هذه الحالة التخريفية المنبثقة من شتات الفكر والتيه …العلم والمعرفة الصحيحة للكتاب والسنة من مصادرهما الاصلية والتي تتمركز الان في الازهر …فما زال ازهرنا بخير ولكنه غير فعال وتفعيله بان يسود الامة شباب فعال على درجة من الوعي والتسلح بالعلم فلا يسمح لمثل هذه الآفات بالظهور لان العلم يدحض مثل هذه الأدعاءات والأفتراءات"
archived = "2009-09-22"
capture_url = "https://web.archive.org/web/20090922201409/http://www.20at.com:80/masr/t7kyk/7767.html"

