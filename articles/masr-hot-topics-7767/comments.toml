posted = "2007-12-09"
text = "البهائيه عباره عن تخاريف ولا تستحق ان تناقش ! واتساءل اخبرونى عن شخصيه وطنيه كانت بهائيه لايوجد بالطبع !!! وهم عباره عن متخلفات الاستعمار الانجليزى فى مصر… وحسنا اغلق عبد الناصر محفل البهائيه فى مصر واتعجب الان يتذكرون انهم بهائيون والبهائيه بصراحه ازدراء للدين الاسلامى الذى يعترف بالمسيحيه واليهوديه اما اختراعات عن البهائيه فذلك كلام فاضى واتساءل عددهم كم فى مصر الف افين من اجل ان نعترف بتلك الخزعبلات البهائيه …احنا موش ناقصين"
archived = "2009-09-22"
capture_url = "https://web.archive.org/web/20090922201409/http://www.20at.com:80/masr/t7kyk/7767.html"

