[[comments]]
order = 13
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-07-22"
text = "السلام عليكم ورحمة الله وبركاته,,<br />من قدرة الله عز وجل انه ينطق لسان الكافر بعذب آيات الايمان وينطق قلب الملحد بقمة التوحيد ,<br />ان الجماعة البهائيون من لاخسرين اعمالاً وذلك لظنهم انهم يحسنون صنعاً باتباعهم الميرزا حسين على كرسول من الله<br />وهذا ر أيي مع كثير التواضع للاسباب الاتية 1- لم تجد ولن تجد أي بهائي يقول قال الله تعالى في الاقدس او الالواح او الايقان فيقول قال حضرة بهاء الله في الاقدس او قال حضرة بهاء الله في الالواح كذا كذا ,,,, الخ الخ شانه كشأن المسيحي فيقول قال البشير متى وقال البشير لوقا …الخ الخ .<br />لتعلم بانهم لن يقولوا قال تعالى الا على ما استشهدوا به من القرأن الكريم ويقولوا قال الرسول محمد صلى الله عليه وسلم في الحديث الشريف كذا كذا …<br />وسبحانك يا رب انتقطهم بالأيمان برسولك وقرائنك انهما منك وحدك وان الاقدس والالواح من حسين على وحاشا ان يكون بهاؤك يارب العالمين .<br />فالى ابد الابدين سيذكرون قال بهاء الله وقال عباس افندي ولن يقولوا قال الله وقال الرسول الا على القرآن والسنة النبوية الشريفة.<br />وبالنسبة الى البهائيون من اصول مسيحية كيف لهم أن يتلوا القرآن وفيه عدم صلب المسيح ع س وفيه توحيد الله بصفاته وسموه عن التجسد والحلول والتشبيه والتجزئة.وهل يأكلون الخنزير كبهائيون وكيف لهم ذلك وهو محرم في التوراة قبل القرآن.( وفي الانجيل ايضا)<br />ولمن يريد الاستزاده زدناه على الايميل التالي:<br />s<br />mall_sun97@yaho o.com"
archived = "2009-09-22"
capture_url = "https://web.archive.org/web/20090922201409/http://www.20at.com:80/masr/t7kyk/7767.html"
