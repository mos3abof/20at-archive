[[comments]]
order = 0
subject = "الضحكه الدامعة"
author = "HopiZ"
posted = "2006-05-28"
text = "المقال فعلا رائع و لمسنى قوى. و فعلا انا خسيت بنفس الاحساس لما شفت يونس شلبى يبكى فى التليفزيون و قعد الموضوع شاغل بالى لوقت طويل. يا ريت اننا نقدر نعمل حاجه للفنان الجميل ده اكثر من الدعاء.مجموعة من مخبيه يقابلوه نيابه عن كل قلب تعلق به. و كل ابتسامة كان هو السبب فيها. وكل طفل تعلم و تربى على بوجى و طمطم.نحاول نجمع تبرعات لمساعدته فى العلاج.<br />شافاك الله و عافاك يا ضحكة الطفولة"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906210658/http://masr.20at.com:80/article.php?sid=378&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "شفاه الله وعفاه"
author = "عبده نصحي"
posted = "2006-05-28"
text = "نسئل الله ان يشفيه ويشفي مرضي المسلمين وان يتوب علينا وعليه وعلي المسلمين جميعا يارب"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906210658/http://masr.20at.com:80/article.php?sid=378&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "يونس شلبى بجد خساره"
author = "عمرو تولدو"
posted = "2006-05-30"
text = "احنا كده ده التكريم لنجومنا<br />نهملهم ونجرى ورا غيرهم اللى بتهز واللى بتبين واللى واللى والللى ....!<br />ربنا يشفيك<br />ولا اقول ربنا يشفى سيد زيان<br />ولا اقول حسين الشربينى<br />ولا اقول جورج سيدهم<br />ولا اقول مين ولا مين ولامين<br />ربنا يشفى الجميع ويشفينا معاهم"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906210658/http://masr.20at.com:80/article.php?sid=378&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "الله يشفيك يا يونس شلبي"
author = "عادل العيوي"
posted = "2006-06-20"
text = "بسم الله الرحمن الرحيم<br />يونس شلبي نعم يونس شلبي<br />كلما سمعت باسم يونس شلبي تهل الدمعه<br />كلما سمعت بصانع الضحكه يشتدحزني<br />نعم يشتد حزني فينونس شلبي اضحك الكثيريين<br />وابكا الكثيريين<br />يونس شلبي قلب بريء قلب صافي<br />فكم وكم اضحكتنا وكم امتعنا وكم ابكنا<br />نعم انه يونس شلبي<br />وانا اقولها للزعيم عادل امام اقولها<br />لماذا تخليت عن زميلك الجدع يونس شلبي<br />وانا والله العظيم احلف غيبا عن يونس شلبي<br />لو انت في مكانه مابيسيبكش يا زعيم<br />لاكن كل واحد بعمل لاصله<br />سعيد صالح وهو في حاله تدهور وفي مرض الله يشفيه<br />ما وقفش عن سماعه التلفون للاطماءنان على يونس شلبي<br />وكثير من الفنانين<br />يونس شلبي اني حزين وحزين وحزين<br />بسماع انك مريض<br />واني فرح فرح بسماع انك تبت الى الله وانك تصلي<br />يونس شلبي اسئل الله ان يغفر لك وان يشفيك<br />ويشفي جميع مرضانا يا الله اسئلك ان تشفي يونس شلبي<br />والسلام عليكم ورحمه الله وبركاته<br />عادل العيوي _ اليمن _ ذمار_<br />titanic_1914@hotmail.com"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906210658/http://masr.20at.com:80/article.php?sid=378&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
