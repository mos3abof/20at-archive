order = 0
subject = ""
author = "CipherZone 1"
posted = "2009-11-08"
text = "الكلام ده وصلني رسالة من جمهور رابطة الزمالك:::<br />يوم مباراة الجزائر لو سألنا أى واحد رايح أستاد القاهرة هو رايح ليه هيرد بمنتهى القوة رايح أشجع مصر<br />لكن لو سألناه إزاى مش هيرد بسرعة هيفكر شوية ويقول هنهز الملعب من صوت التشجيع وبس<br />يعنى هيروح الملعب ويزعق ويرج الملعب وبس كلنا عارفين ده ومدرب الجزائر عارف ده وأكيد عنده الخطة المضادة ولو حطيت نفسك مكان مدرب الجزائر مفيش غير حل وحيد وده غالبا اللى هيحصل<br />قبل المباراة بساعتين أو ساعة ينزل لاعيبة الجزائر تسخن فى الملعب وتستفز الجمهور لدرجة كبيرة والطبيعى إن الجمهور المصرى يسخن جدا واللى نفسة يشتم هيشتم واللى هيحدف بحاجة هيحدف والكل سيتفانى فى أن يجعل المنتخب الجزائرى يندم على اليوم اللى شاف فيه الجمهور المصرى بكده المدرب الجزائرى يضرب عصفورين بحجر واحد<br />أولا يجهد الجمهور المصرى فى غير ما يفيد منتخب مصر<br />ثانيا يتعود لاعبى منتخب الجزائر على صوت وطريقة تشجيع الجمهور المصرى وتقل<br />NEXT"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110021219/http://www.20at.com:80/masr/hot-topics/13938-10-.html"

[[comments]]
order = 1
subject = ""
author = "CipherZone 2"
posted = "2009-11-08"
text = "و أول ماحكم المباراة يصفر للبداية<br />عارفين زى بداية الحروب زمان كدة هجووووم عايزيين زلزال يقوم فى استاد القاهرة ومهما حصل فى المباراه أحنا لازم نكون مع منتخب مصرإحنا جاييين عشان مصر عشان المنتخب نقف جنبه غالب مغلوب إحنا مع المنتخب إحنا جايين نشجع ولاد مصر مش نشمت الجزائرين فينا أكيد يا جماعة منتخب مصر نفسه يكسب ويفرح لأن مكسب وفرحة اللاعبين أضعاف أضعاف الجمهور وكمان فى الخسارة ربنا يكفينا الشر حزنهم أكبر بكتيير من زعلنا إحنا لازم نقف جنب المنتخب طول شوطين المباراه وإحنا متأكدين إن كل لاعب بيعمل اللى عليه والتوفيق من عند الله<br />طب ليه كل ده ؟؟؟؟؟؟؟؟؟؟<br />أقولك !!!<br />أكثر من سبب<br />- تخيلوا معايا المشهد أكيد لاعبى الجزائر هيضربوا لخمة وهيكون من الصعوبة تركيزهم فى المباراة حتى يتعودوا على ما يحدث وحلنى بقى<br />-توفير مجهودنا كمشجعين لوقت المباراة وده أهم وقت<br />-لو حدث رد فعل الجمهور على إستفزازات الجزائريين هيجرى الجزائريين على طقم"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110021219/http://www.20at.com:80/masr/hot-topics/13938-10-.html"

[[comments]]
order = 2
subject = ""
author = "CipherZone 3"
posted = "2009-11-08"
text = "الحكام ويقولوا شوف المصريين بيعملوا فينا إيه فيغيب تأثير الارض والجمهور على الحكام ويحدث تعاطف مع الجزائرين<br />-لازم نقف ونشجع بس إزاى هو ده المهم والتشجيع لما يطلع فى وقته هيكون أقوى بكتيير<br />واحد يسألنى!!! يقوللى ياسلام طيب ماهو أى حد يقرأ الكلام ده هيعرف ناويين على إيه وهنعمل إيه أقوله وفيها إيه ليس من سمع كمن رأى ومهما قلت عن الجمهور المصرى لايساوى عشر ماسوف يراه منتخب الجزائر مع بداية المباراة دى خطة التشجيع ويجب أن ننشرها حتى نواجه منتخب الجزائر بكل قوات الكرة المصرية بشكل منظم ومخطط وفعال شكرا"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110021219/http://www.20at.com:80/masr/hot-topics/13938-10-.html"

[[comments]]
order = 3
subject = ""
author = "AnyWho211"
posted = "2009-11-09"
text = "والله انت عندك حق يا CipherZone 3<br />يا جماعة لازم منستفزش<br />ونعمل اللى عاوزينه بعد ما نكسب<br />على فكره الكلام اللى ف المقاله ده مهم جدًا ولازم يتطبق بحزفيره<br />والله كان نفسى ابقى ف الاستاد بس انا من الناس اللى عندهم ضغط عالى ومش بستحمل<br />اعتقد ان الناس كلها يوم المباراة ف بيوتها بتشترى لب وانا هشترى دوا الضغط<br />اصل احنا عارفين الفصول البايخه بتاعة المنتخب وخايف والله منه<br />وعلى فكره انا اول ما سمعت بمجموعتنا انا قلت الجزائر هتصعد بفرق الاهداف - لا قدر الله - بس اهو كلامى بيتحقق بنسبه 90% على الرغم من ان مباراة الجزائر الاولى فى رواندا كانت زى الزفت وقلنا احنا اللى هنصعد<br />بس الفصل البايخ بتاع مباراة زامبيا والابوخ منه بتاع مباراة البليده…<br />ياااااااااااااا ااااااااااااااا ااااااااااااااا ااااااااا رب نكسب<br />نسنا نفرح<br />نفس الجيل ده يشوف منتخب بلاده ف كأس العالم وانتوا عارفين هنعمل حاجه والله ف كأس العالم لو تأهلانا بأذنك انت يا رب<br />عاوزين نشوف هدف لمصر ف كأس العالم غير ضربة الجزاء لمجدى عبدالغنى<br />واحد جزائرى اشترى كيكة … طلعلوا فيها ابوتريكة<br />يا رب ابوتريكة يطلع لكل جزائرى"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110021219/http://www.20at.com:80/masr/hot-topics/13938-10-.html"

