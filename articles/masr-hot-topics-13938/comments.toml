text = "خبر عاجل لقد اكدت بعض مصادر عن منظمة الصحة العالمية ظهور مرض جديد يسمى بأنفلونزا الجزائريين واكدت انا سبب هذا المرض هو مايحمله المنتخب الجزائرى من رعب بسبب لقائهم مع اسيادهم منتخب مصر ومن اعراض المرض زغللة فى العينين بسبب رؤية الجمهور المصرى طرش فى الودان بسبب صوت تشجيع الجمهور المصرى رعشة فى الاعصاب بسبب هز شباكهم فى اول خمس دقائق شلل نصفى بسبب دخول الهدف الثانى حدوث حالة جنان بسبب دخول الهدف الثالث"
