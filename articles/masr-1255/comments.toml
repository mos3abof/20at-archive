subject = "فيه إيه يا أستاذ جمال يا بدوي ؟؟؟ روق بس واقرا الكلام من تاني"
author = "إبن بهيه"
posted = "2006-12-06"
text = "يقول الأستاذ جمال بدوي في آخر فقره أن معالي وزير العدل قد نجح في إزالة كثيراً من اللبس الذي أحاط بموقفه من النادي .. لا يا أستاذ جمال بل فشل فشلاً مدوياً وأكد تأكيداً صريحاً على أنه قد جيء به لتأديب القضاه كما يتردد على جميع الألسنه اللاعقه لمرارة لاعيش في هذا البلد ليل نهار .. ففي الفقرة قبل الأخيرة يقول الأستاذ جمال بدوي أن الوزير لا يرى للنادي حقاً في الشأن القضائي ، ويرى في ذلك شبهة سياسيه ؟؟؟!!! أي سخف هذا الذي يهذي به عامل مبارك الواطي على رأس القضاء ؟؟؟<br />هل حينما يطالب الإنسان إتاحة الفرصة له لأداء عمله بصورة صحيحة دون تدخل يخرب عمله يكون من الخاطئين ؟؟؟ هل رغبة القضاة في أن يكونوا مستقلين أحراراً دون وصاية من حكومة مبارك الواطي التي تملي عليهم الأحكام فتلغي دورهم وتجعل منهم مجرد دمى في يدها يكونون من المجرمين ؟؟؟ هل يريد منهم مبارك الواطي أن يكونوا مجرد صوره لزوم المنظره ليقال أن عندنا قضاء ..؟؟؟ إنهم لم يطلبوا تغيير مبارك الواطي ولا حكومته ولم يتدخلوا في أي شأن سياسي .. مبارك الواطي هو من يدس أنفه وأنف عماله كذلك لاوزير في الشأن القضائي ويريده أن يكون تابعاً ذليلاً له ولحكومته القذره ..<br />في كل بلد محترم أو ربع أو عشر محترم يكون فيه القضاء سلطة مستقلة لا تخضع في كل شئونها للحكومة كما لدينا ويتمتع القاضي في تلك البلاد بحرية كاملة في أداء عمله حتى ولو كان المتهم أمامه رئيس الجمهورية .. لكن عندنا الوضع مختلف بسبب مبارك الماسوني الواطي الذي يقلد أسياده الأمريكان حيث كلامه شيء والواقع شيء مغاير تماماً .. يعني تلاقيه يتكلم عن ديموقراطيه وبطيخ ولا يوجد بالبلد أي ريحة ديموقراطيه .. لو فاكرين شوية العك والكلام الفارغ اللي مالي الجرايد ده هو الديموقراطيه يبقى مبارك الواطي<br />اقرأ بقية التعليق .."
