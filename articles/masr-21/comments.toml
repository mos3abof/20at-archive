[[comments]]
order = 1
subject = "وعلي اسم مصر"
author = "محمد السيد"
posted = "2006-03-11"
text = "على اسم مصر التاريخ يقدر يقول ما شاء<br />أنا مصر عندي أحب وأجمل الأشياء<br />باحبها وهيّ مالكه الأرض شرق وغرب<br />وباحبها وهيّ مرمية جريحة حرب<br />باحبها بعنف وبرقة وعلى استحياء<br />وأكرهها وألعن أبوها بعشق زي الداء<br />وأسيبها وأطفش في درب وتبقى هيّ ف درب<br />وتلتفت تلاقيني جنبها في الكرب<br />والنبض ينفض عروقي بألف نغمة وضرب<br />صلاح جاهين<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />لسة محدش جاب لي توقيع جديد ؟عايز أغيره ـه ـه ـه ـه ....<br />mohamedmat@hotmail.com"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204904/http://masr.20at.com:80/article.php?sid=21&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

