[[comments]]
order = 3
subject = "يعني انتو بتعندو فيا طب ححطها انا بقي"
author = "هبهوب او هبابه و هوووبه."
posted = "2006-03-17"
text = "قالولي بتحب مصر فقلت مش عارف<br />المعنى كعبة وانا بوَفْد الحروف طايف<br />وألف مغزل قصايد في الإدين لافف<br />قالولي بتحب مصر فقلت مش عارف<br />أنا لما اشوف مصر ع الصفحة بكون خايف<br />ما يجيش في بالي هرم ما يجيش في بالي نيل<br />ما يجيش في بالي غيطان خضرا وشمس أصيل<br />ولا جزوع فلاحين لو يعدلوها تميل<br />حكم الليالي ياخدهم في الحصاد محاصيل<br />ويلبّسوهم فراعنة ساعة التمثيل<br />وساعة الجد فيه سخرة وإسماعيل<br />ما يجيش في بالي عرابي ونظرته في الخيل<br />وسعد باشا وفريد وبقيّة التماثيل<br />ولا أم كلثوم في خِمسانها ولا المنديل<br />الصبح في التاكسي صوتها مبوظُّه التسجيل<br />ما يجيش في بالي العبور وسفارة اسرائيل<br />ولا الحضارة اللي واجعة دماغنا جيل ورا جيل<br />قالولي بتحب مصر أخدني صمت طويل<br />وجت في بالي ابتسامة وانتهت بعويل<br />قالولي بتحب مصر فقلت مش عارف<br />لكني عارف بإني إبن رضوى عاشور<br />أمي اللي حَمْلَها ما ينحسب بشهور<br />الحب في قلبها والحرب خيط مضفور<br />تصبر على الشمس تبرد والنجوم تدفى<br />ولو تسابق زمنها تسبقه ويحفى<br />تكتب في كار الأمومة م الكتب ألفين<br />طفلة تحمّي الغزالة وتطعم العصفور<br />وتذنِّب الدهر لو يغلط بنظرة عين<br />وبنظرة أو طبطبة ترضى عليه فيدور<br />وأمي حافظة شوارع مصر بالسنتي<br />تقول لمصر يا حاجّة ترّد يا بنتي<br />تقولها احكي لي فتقول ابدأي إنتي<br />وأمي حافظة السِيَر أصل السِيَر كارها<br />تكتب بحبر الليالي تقوم تنوَّرْها<br />وتقول يا حاجة إذا ما فرحتي وحزنتي<br />وفين ما كنتي أسجل ما أرى للناس<br />تفضل رسايل غرام للي يقدّرها<br />أمي وأبويا التقوا والحر للحرة<br />شاعر من الضفة برغوثي وإسمه مريد<br />قالولها ده أجنبي، ما يجوزش بالمرة<br />قالت لهم ياالعبيد اللي ملوكها عب<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204904/http://masr.20at.com:80/article.php?sid=21&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "يا خوفى"
author = "ياء"
posted = "2006-03-20"
text = "الخوف ان البلد بعد من نحبها تطلع ما بتحبناش<br />افتكر اغنيه ايمان البحر درويش يا بلدنا يا بلد هو من امتى الولد بيخاف من امه لما فى الضلما تضمو صدقينى خقت منك خفت منك صدقينى<br />والخوف ان الواحد يحس ان غريب فى بلده<br />بلدى وان جارت على عزيزه<br />اهلى وان بخلو عليا كرام<br />yehia2784@hotmail.com"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204904/http://masr.20at.com:80/article.php?sid=21&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "بجد ام الدنيا"
author = "المواااااطن المطحون"
posted = "2006-03-21"
text = "حلوووووه اوي دي<br />أنا لما اشوف مصر ع الصفحة بكون خايف<br />ما يجيش في بالي هرم ما يجيش في بالي نيل<br />ما يجيش في بالي غيطان خضرا وشمس أصيل<br />والله يا جماعة دي ام ادنيا اصل اللى شاف غيرها يعرف قيمتها وقدرها واللى متغرب ومحروم منها يعرف اكتر من اللى قاعد فيها<br />يارب ارجع تااااااني<br />الله يفك سجنك يا مصر اللهم حرر مصر من الإستعمار الداخلي اللهم رد حكمها لشعبها<br />اللهم امين"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204904/http://masr.20at.com:80/article.php?sid=21&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 6
subject = "احبها يهتز قلبى عندما يقال مصر"
author = "نيفين"
posted = "2006-03-25"
text = "دولا مين و دولا مين<br />دولا عساكر فلاحين<br />دولا الورد الحر البلدى<br />دولا خلاصه مصر يا ولدى<br />دولا و لاد المصريين<br />هى مصر ايه غيى نجم و لا بنودى و بيرم و جاهين<br />هى ايه غير حضاره من هرم الجيزه اللى مدوب عمر الزمان(على راى الصبوحه)<br />هى ايه غير ناس سال دمها على ارض الفيروز<br />هى ايه غير شباب زينا يدعو عليها و يلعنو اللى يقول امين<br />هى ايه غير دره الوطن العربى<br />هى ايه غير نن عيوننا كلنا رغم الفساد و الفاسدين<br />ليه قلبتو علينا المواجع يا عشرينات<br />و الله ملف ولاد البلد دا رائع و بيفكرنى بملف الموت"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204904/http://masr.20at.com:80/article.php?sid=21&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

