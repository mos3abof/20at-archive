subject = "رئيس بالعافيه"
author = "مودو"
posted = "2006-05-21"
text = "ياللي انتا غصب عد عين ابونا ريسنا<br />نكوك في سينا وجيت في القلعه تبعبصنا<br />عايز تنكنا نكنا وخلاصنا<br />عايز تنيك غيرنانكهم وعرسنا<br />بس حل عن دماغ راس ابونا<br />خلاينا نغرف طزنا من راسنا<br />يا عيني عليكي يا مدينه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204904/http://masr.20at.com:80/article.php?sid=21&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"
