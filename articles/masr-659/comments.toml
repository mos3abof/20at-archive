order = 1
subject = "ياااااااااااااه"
author = "مراد سعيد"
posted = "2006-07-16"
text = "يااااااااااااااه، هو حضرتك سبت الشقة كلها وقعدت انت والاسرة في اوضة واحدة/ يا راجل سايب الموضوع كله وزعلان من جملة، ومضايق اوي من شوية اقتراحات، المقال بيقول مش هنرمي زبالة، دة على اعتبار ان محدش بيرمي اصلا، وبيقول نكشر على سبيل الاعتراض الصامت، ليه بنيجي في الهايفة ونصدر، ما هو حاجة من 2 يا اما حضرتك - من غير زعل- ليك أسهم في شركة المترو، يا اما موظف في شباك التذاكر، ممكن بقى نص تذكرة"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091233/http://masr.20at.com:80/article.php?sid=659"

[[comments]]
order = 2
subject = "في حياد تام"
author = "معتز"
posted = "2006-07-17"
text = "للأسف احنا معندناش في مصر فكرة الاضراب المنظم او الاحتجاج العام اللي بتشيل وزرات برة اصلا ..<br />وياريت مثلا بنتكلم في احتجاج علي حاجة متخصناش .. لا .. علي حاجة هي من صميم حقنا ..<br />وزي ما سكتنا علي زيادة اشتراكات التليفونات .. والغاء المكالمات المجانية وزيادة اسعار الخواص وتحصيل الأشتراكات كل 3 اشهر وزيادة سعر الدقيقة وتحصيل الفواتير بأثر رجعي ..<br />وزي ما سكتنا علي تحصيل ايصال النظافة مع ايصال الكهرباء ..<br />وزي ما سكتنا علي غلاء اسعار المحمول واحتكاره .. وزي ما سكتنا علي احتكار الحديد وغلاء سعره ..وزي ما سكتنا علي ضرب فلسطين والتحرش بسوريا وغزو العراق وضرب لبنان ..<br />حنسكت علي الربع جنيه بتاع المترو.. يعني هيجت علي دي .. واهو علي رأي البشمهندس مدير جهاز تشغيل مترو الانفاق : ايه يعني ربع جنيه ؟؟<br />بس احب اتساءل ياتري فلوس التذاكر دي كلها حتروح فين ؟؟ ايه الخدمة اللي جهاز تشغيل المترو حيعملها ؟؟ ياتري حيشتري عربيات جديدة تخلي زمن التقاطر أقل ؟؟ ياتري حيركبوا تكييفات داخل القطارات تشتغل بجد بدل المراوح اللي مش بتعمل حاجة غير انها تطلع سخونة من المواتير بتاعتها ؟؟ طلباتنا بسيطة قوي وياريتها بتتنفذ ..<br />ويقولك اصل المترو مفيهوش موارد .. امال يعني توحيد التذكرة اللي حصل من فترة .. مش دخل ؟؟ بلاش .. المحطات بقا فيها من جوة ناس بتبيع اكسسوارات محمول وعطور وشيبسي وورد وميت الف حاجة .. الارضية دي مش بفلوس وده دخل ؟؟<br />بلاش .. اعلانات فودافون اللي مغرقة من برة .. ولا عصام الحضري وهو بيمسك جيرسي .. مش دخل ؟؟<br />اعلانات مستشفي المغربي اللي بتضلم لنا المترو زيادة ما هو ... مش دخل ؟؟؟؟؟؟؟<br />بلاااااااااااااااش .. الا مش المترو ده تبع الحكومة مباشرة .. مش قطاع خاص يعني .. يعني مدعوم م الدولة .. فين ال<br />اقرأ بقية التعليق .."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091233/http://masr.20at.com:80/article.php?sid=659"

[[comments]]
order = 3
subject = "شخص"
author = "يا اخ مراد هو محدش بيكتب حاجه لوجه الله فى الزمن ده لازم يعنى يكون لى مصلحه لا يا سيدى معنديش اسهم فى الشركه ، ولا السيد موظف التذاكر يقبى من بقيه اهلى..."
posted = "2006-07-17"
text = "وبعدين تكشير ايه هى ناقصه تكشير ، وبعدين اصلا احنا كلنا بنيجى فى الهايفه و نتصدر كل اللى تعرف تقاطعه البيبسى و كنتاكى (قبل الانفلوانزا) و بكده تنام مرتاح البال انت ساهمت فى حل المشكله الفلسطينيه ، طب ما دى منتجات ملهاش لزوم اولا و ليها بدائل كثيره ثانيا ،ومش هتاثر على اقتصاد امريكا ولا حتى اقتصاد كفر البطيخ. لكن تيجى تقول نقاطع حاجه مؤثره كله بيقول ياللا نفسى..مثال بسيط بعد ما اتشتم الشعب المصرى كله لو عندك دش و اشتراك ترضى تضحى بيهم فى سبيل مقاطعه الاى ار تى تضامنا مع شعب بلدك انت ؟؟؟؟؟؟؟؟؟"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091233/http://masr.20at.com:80/article.php?sid=659"
