subject = "شخص"
author = "(( لا لا، مش هنرمي الزبالة ولا نبوظ الأبواب، بل نوصي بالتكشير في وجه موظف التذاكر، صحيح هو مننا مش علينا، ))"
posted = "2006-07-16"
text = "الجمله من اولها لاخرها الله ينور يعنى... اولا اما نرمى زباله و لا نبوظ ابواب مهو ده هيعود علينا احنا فى النهايه احنا اللى هنمشى فى الزباله و هنركب عربيات ابوابها خربانه و ممكن تعمل مصايب ، هو انت كده بتنتقم من الحكومه و لا من نفسك و لا من العيشه و اللى عيشينها و لا من مين بالظبط ؟؟؟ مهو الذكاء ده هو اللى جايبنا ورا ، ما تقول واحد يروح تعمل قنبله و يرميها قدام المترو احسن ، هيبقى الضرر اكبر!! وربنا يرحمنا جميعا<br />ثانيا تعالى شوف الناس بتعمل ايه فى موظف التذاكر من غير ما تتوصى : انت يا بنى ادم الفلوس دى وحشه هات غيرها يخرب بيت اللى شغلك الشغلانه دى ، و كأن الراجل جاى بالفلوس دى من بيتهم مش دى فلوس الركاب اللى من عارفين حتى يحافظوا على شويه ورق فى جيوبهم.... مثال اخر مشهور: انت مش عارف انت بتكلم مين يا ابن(....) ( ضع اى شتيمه تفضلها بين القوسين) ده انا ممكن ارميك بره الشغلانه دى يا حيوان...... ومن جهته طبعا يقوم موظف التذاكر برد التحيه بافضل منها فيشتبك مع الراكب و النتيجه هى مزيد من الخناق و البلطجه و العطله لباقى الناس المحترمه الى عاوزه تقطع تذكره بدل ما تنط من فوق البوابه او يرخموا على اى حد معاه تذكره و يدخلوا وراه و ياويل لو قلت لهم لا و كان ده حق طبيعى لهم ( ما عندك الاتوبيس يا اخى ) ، يا سيدى يا ريت كل واحد يبتدى يصلح نفسه الاول وبعد كده يبقى يدور على اصلاح شركه مترو الانفاق."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091233/http://masr.20at.com:80/article.php?sid=659"

