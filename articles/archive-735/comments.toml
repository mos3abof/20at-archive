text = "الوطن<br />\"الوطن تحميه السّواعد و ترويه الدّماء\"،قول يحمل بين حروفه أجمل المعاني و أبرزها.وطني يا أغرودة الأوطان سواعد شبابك حموك،و يا معزوفةً تراقصت حروف اسمك مع الحانها وأنغامها.<br />وطني كلمة تقال،و لكنّها معشوقة بالأثر و الجمال.أردّدها مرّات و مرّات و لا املّ من تردادها.كلمة ذات حبّ و حنان.يا أيّها الوطن،لقد ارويت من دماء شهدائك و أحبّائك و كل من حاول الدّفاع عنك.أيها العظيم،يا ملكاً انحنى له احتراماً و تقديراً الآلاف من السّواعد البنّاءة.<br />يا أرضاً مرويّةً بدماء شهدائك،أنا أستعدّ شوقاً للدّفاع عنك.لا أخشى العدو طالما انا واقفة على أرضك.لا أخشى الصّواريخ و لا الطائرات طالما أنا اتنشق من هوائك.لا أخشى شيئاً أيها البطل،ما دمت أحبك و سأظل أحبّك إلى الأبد.وطني،أيّها الوطن الصّامد أمام غدر الزمان،و الإنسان.يا نور أنار ظلمات حياتي.إنني أحيا للدّفاع عنك و التضّحية من أجلك يا وطني.<br />وطني الغالي لا تخف!!!!!!!!<br />إنّني هنا للتضحية من أجلك،للصمود بوجه كل شيء يريد التخلص منك.<br />سأظل واقفة على أرضك.<br />أيهل الملك،يا وطني."
