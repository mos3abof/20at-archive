author = "الى algeriano"
posted = "2009-10-11"
text = "انت جزائري<br />الفسق والرقص جاءنا من الجزائر<br />عندنا واحدة رقاصه اسمها وردة الجزائرية<br />واحدة من عندكم علمت الشعب المصري الفسق والرقص<br />فما بالك شعب الجزائر الرقاص الا من رحم ربي"
archived = "2009-10-13"
capture_url = "https://web.archive.org/web/20091013073746/http://www.20at.com:80/masr/2khbar/13671-2009-10-11-08-15-22.html"

