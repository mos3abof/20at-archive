author = "المعلق السابق"
posted = "2009-10-11"
text = "الخونة دول موجودين عندكم في الجزائر مش عندنا<br />فاهم يا ابني<br />بص حواليك في الجزائر حتتأكد من كلامي<br />فاكر بن جديد وبومدين<br />روح شوف الخيبة بتاعتكم الاول<br />وادخل على موقع اسمه شيعة الجزائر احسنلك"
archived = "2009-10-13"
capture_url = "https://web.archive.org/web/20091013073746/http://www.20at.com:80/masr/2khbar/13671-2009-10-11-08-15-22.html"

