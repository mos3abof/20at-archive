author = "شوية عيال"
posted = "2009-10-12"
text = "على طول هجوم على الجزائر علشان واحد كتب اسمة الجرينو<br />ما يمكن يكون مصرى وغالبا هيكون مصرى لان الجزائريون لا يقرؤون العربية وانما اهتمامتهم الجرايد والصحف المكتوبة بالفرنسية واهتماماتهم اوروبية<br />وبعدين عيل وغلط<br />نقوم بقى هية ياللة نشتم كلنا وكان بيننا تار بايت او كان الجزائيين بيحاصروا الاقصى وعايزين يقتحموة او يهدوة<br />علشان اية — مباراة كرة قدم مرة نغلبهم ومرتين يغلبونا<br />بالذمة دة مش تخلف<br />صحيح شوية عيال هايفة"
archived = "2009-10-13"
capture_url = "https://web.archive.org/web/20091013073746/http://www.20at.com:80/masr/2khbar/13671-2009-10-11-08-15-22.html"
