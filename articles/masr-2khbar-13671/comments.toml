author = "بسم الله قبل ما تشرب"
posted = "2009-10-12"
text = "قبل ما حد يشرب يقول<br />بسم الله الذي لا يضر شيء مع اسمه في السماء والارض<br />وما هم بضارين به احدا الا باذن الله<br />معلش نحنا في العصر الاسرائيلي<br />ربنا معانا"
archived = "2009-10-13"
capture_url = "https://web.archive.org/web/20091013073746/http://www.20at.com:80/masr/2khbar/13671-2009-10-11-08-15-22.html"

[[comments]]
order = 5
subject = ""
author = "مياة الشرب"
posted = "2009-10-12"
text = "الحكومة فى معظم انحاء مصر تلجا الى الحل السهل<br />— تمد الناس بالمياة الارتوازية يعنى تدق ماسورة 8 بوصة تحت الارض وتسحب مياة جوفية وتضخها للشبكة<br />يعنى مفيش مياة نيل لان مياة النيل محتاجة ترشيح وتريق ومعالجة بالكلور<br />وكلاهما اصبح ملوث المياة الارتوازية ومياة النيل - مياة النيل ملوثة من مخلفات الاسمدة الازوتية والنترات ومياة الابار الارتوازية ملوثة باملاح الماغنسيوم والحديد<br />وكلاهما يسبب الفشل الكلوى والكبدى<br />وانا ادعوك ان تنظر الى قاع براد الشاى الذى تستخدمة بعد فترة من استخدامة فان وجدت فى قاعة ترسبات فهى املاح الكالسيوم والماغنسيوم<br />المصيبة ان الحكومة لا تصرف مليما على مشروعات المياة<br />فكلها معونات من الدول الاوروبية وامريكا<br />وللحصول على كوب ماء نظيف لا بد من معالجة المياة وهذا لم يبدأ فى مصر بعد لان الحكومة مش عايزة تصرف حاجة وتركز كل نفقاتها على الامن المركزى والامن السياسى ومواكب كبار المسئولين والوزراء"
archived = "2009-10-13"
capture_url = "https://web.archive.org/web/20091013073746/http://www.20at.com:80/masr/2khbar/13671-2009-10-11-08-15-22.html"

