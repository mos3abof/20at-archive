author = "الى algeriano"
posted = "2009-10-11"
text = "ثمانية آلاف بيت دعارة في العاصمة الجزائرية لوحدها<br />أثارت الدعوة التي تناقلتها وسائل الإعلام الجزائرية والعربية ونسبتها إلى المحامية فاطمة الزهراء بن براهم بشأن تشجيع فتح بيوت الدعارة لمواجهة ظاهرة اختطاف واغتصاب الأطفال في الجزائر، أثارت ردود فعل واسعة. مُستنكرةً ما أسمتها دعوة المحامية الجزائرية إلى ممارسة الرذيلة علنا. والمحامية (بن براهم) التي لها باع طويل في معالجة مختلف القضايا الاجتماعية قالت: إن تصريحاتها أُسيء فهمها مؤكدة أنها دعت السلطات إلى مراقبة وتقنين بيوت الدعارة السرية المنتشرة عبر ربوع الجزائر حيث تستغل المافيات حاجة العائلات إلى المال فتلجأ إلى إكراه بناتها على البغاء مقابل أثمان بخسة وفي ظروف أقل ما يمكن وصفها بأنها لا ترقى إلى معاملة الحيوانات.<br />ثمانية آلاف في بيت دعارة في العاصمة لوحدها<br />المحامية كشفت عن وجود سبع بيوت دعارة رسمية في العاصمة، أما عدد بيوت الدعارة غير المرخص لها فوصل إلى ثمانية آلاف. تنتشر هذه البيوت في الأحياء الشعبية ومدن الصفيح المحيطة بالعاصمة وهناك من يستعمل شاحنات ومركبات لممارسة مثل هذه الأعمال."
archived = "2009-10-13"
capture_url = "https://web.archive.org/web/20091013073746/http://www.20at.com:80/masr/2khbar/13671-2009-10-11-08-15-22.html"

