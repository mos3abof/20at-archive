text = "أشكر الكاتبة على هذا الموضوع الذي أثار الدهشة و أروى العطشى ونبه على المعالم وأظهر للأمة بريقا لامعا من حضارتها ومدنيتها المعمارية وبالأخص ما ذكر في المقال من عبارة ( مراعاة الضغط الجوي ) وهذا ان دل فانما يدل على اهتمام الأمة وقادتها بالأمس على الحفاظ على الأصالة والريادة أيام الخلافة الأموية …"
