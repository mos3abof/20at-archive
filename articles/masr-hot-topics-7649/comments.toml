[[comments]]
order = 22
subject = ""
author = "karam"
posted = "2007-11-25"
text = "الكاتب مصطفي محمود لما كتب عن كدة اجتهد في نقل ما هو موجود في الكتاب بأسلوب أدبي يقرب المعنى وغاص في الجنة وروي مشاهداته فيه وفي النار وقد يصيب وقد يخطئ لكن الموضوع بهذا الطرح يدخل فى إطار سخرية ليس هذا الموضوع بالذات محله لأن القيامة هى السوط الذى جعل مجرد ذكره يرعب اعداء الدين ويوجل قلوب المؤمنين كما انها أي القيامة هي البلسم الذى ينزل على قلوب الثكالى والمعذبين وينتقم لهم من الظالمين وهي كما قال المولى العظيم - وهو اعلم بما خلق وهو اللطيف الخبير- قال عن زلزلة القيامة ( إن زلزلة الساعة شئ عظيم)<br />إذا جاءت الساعة لا محل يومها لرئيس ولا زعيم و مكرم ولا اباظة ولاغيرهم ممن ذكرت و إن كنت لا أذكر هذه لها انتقاصا لها لكن على سبيل المثال ومن ثم فلا مكان لمانشتات ولا يحزنون ( فلا أنساب بينهم يومئذ ولا يتساءلون . فمن ثقلت موازينه فأولئك هم المفلحون . ومن خفت موازينه فأولئك الذين خسروا أنفسهم فى جهنم خالدون . تلفح وجوههم النار وهم فيها كالحون ) انصح من يتناول هذه الموضوعات ان يتناولها للاعتبار قال تعالى ( وقد نزل عليكم فى الكتاب أن إذا سمعتم آيات الله يكفر بها ويستهزأ فلا تقعدوا معهم حتى يخوضوا في حديث غيره إنكم إذا مثلهم إن الله جامع الكافرين والمنافقين فى جهنم جميعا) أقول قولى هذا وأستغفر الله لى أولا - فأنا أحق بالاستغفار - واستغفر الله لكم بعدها ولجميع المؤمنين والمؤمنات"
archived = "2009-12-12"
capture_url = "https://web.archive.org/web/20091212103125/http://www.20at.com:80/masr/hot-topics/7649.html"

[[comments]]
