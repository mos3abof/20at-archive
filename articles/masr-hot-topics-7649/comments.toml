author = "اكتب اسمك هنا"
posted = "2007-11-23"
text = "من أسماء القيامة في القرآن<br />يوم القيامة قال تعالى : \" لا أقسم بيوم القيامة \"<br />اليوم الآخر قال تعالى : \" إنما يعمر مساجد الله من آمن بالله و اليوم الآخر\"<br />الآخرة قال تعالى : \" ولقد اصطفيناه في الدنيا و إنه في الآخرة لمن الصالحين \"<br />الدار الآخرة قال تعالى : \" تلك الدار الآخرة نجعلها للذين لا يريدون علوا في الأرض ولا فسادا \"<br />الساعة قال تعالى : \" إن الساعة ءاتية أكاد أخفيها \"<br />يوم البعث قال تعالى : \" وفال الذين أوتوا العلم و الإيمان لقد لبثتم في كتاب الله إلى يوم البعث \"<br />يوم الخروج قال تعالى : \" يوم يسمعون الصيحة بالحق ذلك يوم الخروج \"<br />القارعة قال تعالى : \" كذبت ثمود وعاد بالقارعة \"<br />يوم الفصل قال تعالى : \" هذا يوم الفصل الذي كنتم به تكذبون \"<br />يوم الدين قال تعالى : \" مالك يوم الدين \"<br />الصاخة قال تعالى : \" فإذا جاءت الصاخة \"<br />الطامة الكبرى قال تعالى : \" فإذا جاءت الطامة الكبرى \"<br />يوم الحسرة قال تعالى : \" وأنذرهم يوم الحسرة \"<br />الغاشية قال تعالى : \" هل أتاك حديث الغاشية \"<br />يوم الخلود قال تعالى : \" ادخلوها بسلام ذلك يوم الخلود \"<br />الواقعة قال تعالى : \" إذا وقعت الواقغة \"<br />يوم الحساب قال تعالى : \" وقال موسى إني عذت بربي و ربكم من كل متكبر لا يؤمن بيوم الحساب \"<br />يوم الوعيد قال تعالى : \" ونفخ في الصور ذلك يوم الوعيد \"<br />يوم الآزفة قال تعالى : \" و أنذرهم يوم الآزفة \"<br />يوم الجمع قال تعالى : \" وتنذر يوم الجمع لا ريب فيه \"<br />الحاقة قال تعالى : \" الحاقة ما الحاقة \"<br />يوم التناد قال تعالى في قصة مؤمن آل فرعون : \" ويا قوم إني أخاف عليكم يوم التناد \"<br />يوم التلاق قال تعالى : \" لينذر يوم التلاق \"<br />يوم التغابن قال تعالى : \" يوم يجمعكم ليوم الجمع ذلك يوم التغابن \""
