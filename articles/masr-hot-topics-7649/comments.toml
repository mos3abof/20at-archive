text = "ايه يا نفين غلتب عننا مدة طويلة ليه دا انا كنت في انتظارك على نار<br />الموضوع جريء وكفري<br />والاستهزاء بيوم القيامه بهذه الصورة كفر والعياذ بالله<br />وخصوصا تعليق ذكي الدبور<br />اسمعي ربنا بيقول ايه في سورة النجم<br />{‏أزفت الآزفة‏}<br />‏‏{‏ليس لها من دون الله كاشفة‏}<br />‏‏{‏أفمن هذا الحديث تعجبون وتضحكون ولا تبكون‏}"
