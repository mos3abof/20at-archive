posted = "2007-11-24"
text = "هؤلاء يكتبون عن ليلة يوم القيامة<br />مكرم محمد احمد:<br />الجنة وسلالمها فى حالة اختطاف من جماعة بعينها وسأحاول ان أعيد دورها الحقيقي كمنبر لكل الأديان.<br />عبد اللطيف المناوى:<br />السيدات و السادة دعونا نستمع لوجهة نظر جهنم المعارضة في جنة الوطني<br />إبراهيم عيسى :<br />لن تشفع الضربة الجوية لمبارك من حسابة امام ربنا عما فعلة فينا طوال ربع قرن<br />مصطفى بكرى:<br />لماذا يصمت اهل جهنم على خطيئة احمد عز وشاهيناز النجار ؟<br />حمدي رزق:<br />بالوثائق …خطة المحظورة لتجنيد اهل الجنة ضد اهل النار<br />عبداللة كمال :<br />السبيل الوحيد للمحافظة على شرعية جهنم ان يكون عملها على مستوى فكر جمال مبارك<br />متى تتدخل الملائكة لمنع تجاوزات ابراهيم عيسى ضد حوريات الجنة؟<br />محمد الباز:<br />لا البابا شنودة في الجنة ولا الأنبا ماكسيموس في النار<br />حلمي النمنم:<br />الان جاء الوقت ليعرف كل تيار داخل النار قوتة ومكرم نموذجا يستحق الجنة دون حساب.<br />سليمان جودة:<br />لو تاملنا ماحدث منذ 1956 وحتى الان لتقبلنا النار غير متذمرين<br />سعد هجرس:<br />الجماعة الصحفية تتشرزم فى منتصف الطريق بين الجنة و النار<br />مجدي الدقاق:<br />رؤية لجنة السياسات هى الطريق الحقيقي إلى الصراط المستقيم<br />يوسف القعيد:<br />نجيب محفوظ كلفنى بكتابة كلمتة إلى الملائكة وهيكل استفسر منى عن درجة حرارة جهنم."
archived = "2009-12-12"
capture_url = "https://web.archive.org/web/20091212103125/http://www.20at.com:80/masr/hot-topics/7649.html"

