[[comments]]
order = 19
subject = ""
author = "فقير الى اللة"
posted = "2007-11-24"
text = "فى هذا المشهد العظيم<br />يقف الجبابرة والفراعنة والملوك والورثة للحكم والاتباع بتوع المحاكم العسكرية وقمع الشعب ومنتهكى كرامتة<br />يقفوا حاسرين مذلولين<br />منكسى رؤسهم خاسئين جزاء ما فعلوا<br />وينادى صاحب العزة ( لمن الملك اليوم ؟ )<br />فلا يسمع لهم صوت<br />وترد الملائكة<br />الملك للة الواحد القهار<br />فيا هامان ويا فرعون ويا اتباعاهم ان القيامة قريبة جدا<br />وقيل فى الحديث ان قيامة الانسان هى موتة<br />ويومكم قريب"
archived = "2009-12-12"
capture_url = "https://web.archive.org/web/20091212103125/http://www.20at.com:80/masr/hot-topics/7649.html"

[[comments]]
order = 20
subject = ""
author = "Reham Ragab"
posted = "2007-11-24"
text = "نظيف: تطلب الحكومة إسقاط ديونها بما انه يوم الحشر والمسامح كريم!<br />محافظ الدقهلية: هذا وقد تم عرض ملف شححان المياه على الجهات العليا، والحكم على المواطنين بكثرة الاستحمام قريب انشاءالله!<br />مبارك (في التصريح الأول المتأخر): لقد كنا نحاول الإصلاح لاخر لحظة، ولقد أنشأنا من الكباري والمدن الجديدة مايعادل حتة أرض في الجنة، لكن الله لا يتقبل منا! سوف نوسط نظيف قريبا لكنه أقصر من وصول الدعوة!!<br />بوش: هذا وقد وعدت الجهات العليا باستمرار أعمال الإصلاح في العراق، والتي تتطلب وقتا إضافيا رغم استنفاذه في الحياة، والقوات الأمريكية على أهبة الاستعداد للمشاركة.<br />بلير: ياشعب يابن الجزمة، مش عارفين تخلوني لحد اليوم ده؟! ماذا يكون شكلي وأنا أتحاسب وراء هذا العيل الأهبل؟<br />إميل لحود: يارب كنت أنوي تعديل الدستور والمد ثلاث سنوات جديدة، لكي أنقذ هذا الشعب من عذابك، ولكن الجهلة مرضيوش، واادي القيامة قامت والبلد من غير ريس! خلي الحكومة هيك تنفعهم! كلها بجهنم انشاللا!<br />كفاية عليك كدة.. للحديث بقة"
archived = "2009-12-12"
capture_url = "https://web.archive.org/web/20091212103125/http://www.20at.com:80/masr/hot-topics/7649.html"

[[comments]]
