text = "لا ما ينفعش الكلام ده<br />انا رأيي زي الاخ اللي قالك تعرض الاول الموضوع على حد يفتيلك انك ممكن تكتب حاجه زي كده<br />وبرده انا شايف ان الموضوع ما ينفعش نكتب فيه عملا بالقول \" فاتقوا الشبهات\"<br />عشان ما يجش واحد زي اللي كتبلكم ده وقال \" عشان نلاقي حاجه تسلينا لحد ما يجي دورنا\"<br />اكيد يعني اكيد انه مش لذيذ انه يقول كده ولا انتو شايفين ايه<br />وانا شايف برده انكم ترفعوا الموضوع من الموقع لحد ما تستفتوا حد فيه."
