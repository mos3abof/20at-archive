posted = "2007-11-25"
text = "بعترف يا جماعه ان الموضوع جرىء و بعترف انى ضحكت و خصوصا على مانشيت الوفد<br />بس بعترف كمان ان الموضوع فيه شطط شويه زى ما قال احد المعلقين<br />انا مش بحجر على راى كاتبى المقال و اعترف بامتلاكهم الحس الفكاهى و الاسلوب الصحفى بس انتو مش معايا يا جماعه ان انتو بتتكلمو عن يوم القيامه<br />بس لازم اكرر تانى و اعترف الموضوع جرىء"
