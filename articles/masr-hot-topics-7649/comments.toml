subject = ""
author = "اكتب اسمك هنا"
posted = "2007-11-23"
text = "أهوال يوم القيامة<br />يقول الحق سبحانه وتعالى في سورة الحج: “يَا أَيهَا الناسُ اتقُوا رَبكُمْ إِن زَلْزَلَةَ الساعَةِ شَيْءٌ عَظِيمٌ. يَوْمَ تَرَوْنَهَا تَذْهَلُ كُل مُرْضِعَةٍ عَما أَرْضَعَتْ وَتَضَعُ كُل ذَاتِ حَمْلٍ حَمْلَهَا وَتَرَى الناسَ سُكَارَى وَمَا هُم بِسُكَارَى وَلَكِن عَذَابَ اللهِ شَدِيدٌ”.<br />افتتحت سورة الحج بهذا النداء الموجه من الخالق عز وجل إلى الناس جميعا يأمرهم فيه بامتثال أمره وباجتناب نواهيه حتى يفوزوا برضاه يوم القيامة وقوله سبحانه: “إن زلزلة الساعة شيء عظيم” تعليل للأمر بالتقوى، قال القرطبي: الزلزلة شدة الحركة، ومنه قوله تعالى: “وزلزلوا حتى يقول الرسول والذين آمنوا معه متى نصر الله..”.<br />وقال الالوسي: “والزلزلة: التحريك الشديد، والإزعاج العنيف، بطريق التكرار بحيث يزيل الأشياء من مقارها، ويخرجها عن مراكزها.<br />دهشة وخوف<br />والمعنى: يا أيها الناس اتقوا ربكم اتقاء تاما، بأن تصونوا أنفسكم عن كل ما لا يرضيه وبأن تسارعوا إلى فعل ما يحبه لأن ما يحدث في هذا الكون عن قيام الساعة شيء عظيم ترتجف لهوله القلوب وتخشع له النفوس.<br />وقال سبحانه: “إن زلزلة الساعة شيء عظيم” بصيغة الإجمال والإبهام لهذا الشيء العظيم، لزيادة التهويل والتخويف، ثم فصل سبحانه هذا الشيء العظيم تفصيلا يزيد في وجل القلوب فقال: “يوم ترونها تذهل كل مرضعة عما أرضعت”.<br />والذهول: الذهاب عن الأمر والانشغال عنه مع دهشة وحيرة وخوف.<br />أي: أن هذه الزلزلة من مظاهر شدتها ورهبتها أنكم ترون الأم بسببها تنسى وتترك وليدها الذي ألقمته ثديها، وكأنها لا تراه ولا تحس به من شدة الفزع.<br />وقوله سبحانه: “وتضع كل ذات حمل حملها” بيان لحالة ثانية تدل على شدة الزلزلة وعلى عنف آثارها.<br />أي: وترونها أيضا تجعل كل حامل تضع حملها قبل تمامه من شدة الفزع، ثم بيّن سبحانه حالة ثالثة للآثار التي تدل على شدة هذه الزلزلة فقال: “وترى الناس سكارى وماهم بسكارى ولكن عذاب الله شديد”.<br />أي: وترى أيها المخاطب الناس في هذا الوقت العصيب هيئتهم كهيئة السكارى من قوة الرعب والفزع وما هم على الحقيقة بسكارى لأنهم لم يشربوا ما يسكرهم ولكن عذاب الله شديد أي: ولكن شدة عذابه سبحانه هي التي جعلتهم بهذه الحالة التي تشبه حالة السكارى في الذهول والاضطراب.<br />وقت الزلزلة<br />هذا وقد اختلف العلماء في وقت هذه الزلزلة المذكورة هنا فمنهم من يرى أنها تكون في آخر عمر الدنيا، وأول أحوال الساعة.<br />وقال آخرون: بل ذلك هول وفزع وزلزال وبلبال، كائن يوم القيامة في العرصات بعد القيام من القبور.<br />وهناك سبعة أحاديث استدل بها أصحاب الرأي الثاني.<br />ومن هذه الأحاديث ما رواه الشيخان عن أبي سعيد الخدري قال: قال رسول الله صلى الله عليه وسلم يقول الله تعالى يوم القيامة يا آدم فيقول: لبيك ربنا وسعديك فينادي بصوت: إن الله يأمرك أن تخرج من ذريتك بعثا إلى النار قال: يا رب وما بعث النار؟<br />قال: من كل ألف أراه قال تسعمائة وتسعة وتسعين فحينئذ تضع الحامل حملها ويشيب الوليد، وترى الناس سكارى وما هم بسكارى ولكن عذاب الله شديد”، فشق ذلك على الناس حتى تغيرت وجوههم فقال صلى الله عليه وسلم: “من يأجوج ومأجوج تسعمائة وتسعة وتسعين ومنكم واحد، ثم انتم في الناس كالشعرة البيضاء في الثور الأسود، وإني لأرجو أن تكونوا ربع أهل الجنة -فكبرنا- ثم قال: ثلث أهل الجنة- فكبرنا ثم قال: شطر أهل الجنة - فكبرنا”.<br />وعلى الرأي الأول تكون الزلزلة بمعناها الحقيقي، بأن تتزلزل الأرض وتضطرب ويعقبها طلوع الشمس من مغربها ثم تقوم الساعة وعلى الرأي الثاني تكون الزلزلة المقصود بها شدة الخوف والفزع كما في قوله تعالى في شأن المؤمنين “وزلزلوا زلزالا شديدا” فالمقصود أصيبوا بالفزع والخوف وليس المقصود ان الارض تحركت واضطربت من تحتهم .<br />منقول من جريدة الخليج<br />الإمارات<br />9-9-2005"
