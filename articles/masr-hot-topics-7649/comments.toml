subject = ""
author = "سراج"
posted = "2007-11-26"
text = "بصراحة موضوعك خطير جدا يا اخ حربية وابراء للذمة يجب ان انصحك بالاستغفار من هذا الكلام ايه ياعم ايه الكلام ده قيامة ايه وشطط ايه دانت شطحت جامد يا عم الله تعالى يقول يسالونك عن الساعة ايان مرساها فيم انت من ذكراها الى ربك منتهاها والكلام ده موجه للرسول نفسه تيجي انت تقول لي مانشيتات وبتاع مرة تانية ابئى انتبه وما تخشش في حول الغام زي دي ربنا يسامحنا جميعا يلا سلام"
archived = "2009-12-12"
capture_url = "https://web.archive.org/web/20091212103125/http://www.20at.com:80/masr/hot-topics/7649.html"

[[comments]]
order = 24
subject = ""
author = "نيفين نيفى نوفا"
posted = "2007-11-26"
text = "مع ان مش من عادتى انى ارد على حد مش ذاكر اسمه او اسمها بس يهمنى جدا اوضح موقفى<br />انا اقريت ان الموضوع فيه شطط و شطحات خيال جامده و مع اننا فى زمن الفتوى و عايشين ف عصر واحد فتوى و صلحه على راى الاستاذ حمدى قنديل ف قلم رصاص مش عايزه افتى ف الدين و اقول ايه العقاب او الجزاء على كلام زى ده<br />كمان انا قلت انى مش من هواه الحجر على اراء الاخرين<br />هذا يكتب و ذاك يكتب و القارىء اللى هو انا و انت او انتى ناخذ ما نريد و نترك ما لا نريد<br />انا لما اقرا مثلا موضوع زى ده اخد حداثه الفكره و جراه الموضوع و الخروج عن المالوف<br />كون الموضوع شاطح حبتين لا ينفى ابدا كونه جرىء<br />كنت اتمنى اعرف انا برد على مين و مع كل يا ريت اكون وضحت موقفى"
archived = "2009-12-12"
capture_url = "https://web.archive.org/web/20091212103125/http://www.20at.com:80/masr/hot-topics/7649.html"

