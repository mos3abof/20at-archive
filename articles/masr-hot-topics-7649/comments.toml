text = "يعنى بالله عليكم أنا راضى ذمة أى حد فيكم ديه صحافة ، والله يا حربية اللى قالك اكتب ظلمك .. أنا تصورت أن الموضوع فى البداية \" كلام بلوجرز \" .. أيه ده يعنى مش فاهم ، مش عارف ليه يا حربية بحس أنك بكتب فى عالم تانى ، أو لمخلوقات غريبة … لو اعتبرنا موضوع زى ماذا تكتب الصحافة يوم القيامة ؟ يبقى بقى أى حمار فى الشارع يكتب \" تحقيق \" عن ماذا تكتب الصحافة لو مات مبارك ، ولو اسرائيل احتلت مصر ؟ ولو امريكا فرضت هيمنتها على العالم أو … أو …<br />طيب والنبى فى الصحافة أفكار تعتمد على \" أو \" أو الافتراضية … الموضوع خفيف لدرجة القئ بصراحة ."
