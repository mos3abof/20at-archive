subject = ""
author = "عبير العسكري"
posted = "2007-11-29"
text = "السلام عليكم جميعا بجد مش قادرة اقول غير انه موضوع رائع يا سمير انت وحربية وضحتم فكرتم بشكل بسيط وسهل وكله خفة دم وابداع ومش فاهمة تعليقات التكفير دي أصحابها فهموا الموضوع ده ازاي ده انتم وضحتم قصدكم وفكرتكم من بداية الموضوع ولا هو هوجة تكفير وخلاص يا ريت الناس تقرأ تاني الموضوع بهدوء وبأفق أوسع من كدة واللي يعلق يبعد عن موجة التكفير والتشكيك في أراء أو عقائد الآخرين لأن المقصود هو ايضاح كيفية تعامل الصحف المصرية مع الاحداث وافلاس عدد كبير منها وتعاملها مع الحدث علي انه مجرد ملء مساحات أو تكرار سخيف لنفس السياسات العقيمة اللي تتبناها الصحف المباركية أو الحزبية المتجمدة أو بعض صحف الإثارة والتشويق.<br />أعتذر عن الاطالة وفقكم الله وهداكم لما فيه الخير"
archived = "2009-12-12"
capture_url = "https://web.archive.org/web/20091212103125/http://www.20at.com:80/masr/hot-topics/7649.html"

