subject = "الاضحية"
author = "لؤي"
posted = "2006-03-08"
text = "الاضحية هي سنة قبل ان تكون عادة مغربية<br />الا اننا في المغرب اخذناها كشي اساسي من الدين وهذا علط وتضيق علي من لايقدر علي الاضحية وهذه ترجع الي عدم المعرف بالدين الاسلامي فاذاكانت التوعية موجودة فلااشكال لكن غاب العلم فغابت معهالوسطية طبعا هذه العادةترجع بالاساس ان المغارةمتشبثين بتعاليم الدين اوببعض من مظاهرهفانهم يعتبرون ان الاضحية من الين هذه هي كل القص ....."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114339/http://www.20at.com/article2.php?sid=202"

