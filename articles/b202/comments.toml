[[comments]]
order = 0
subject = "نصيحة"
author = "مغربى"
posted = "2006-01-05"
text = "بعتقد انكن بتذيذو فى الحكى عنا ؟؟؟<br />لما ؟ ما بعرف ؟<br />كتير منا المغاربة بنعرف اننا افضل منكم فى كل شى وارقى منكم ومن كل العرب<br />اوكى لكن حق تحكو عنا كتير لعل تقدرو تقلدونا فى بعض الاشياء<br />لكن ما بعتقد باى حال انكن سوف تصلو لنصف ما نحن نصير علية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114339/http://www.20at.com/article2.php?sid=202"

