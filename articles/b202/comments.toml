[[comments]]
order = 4
subject = "مغرب الأحباب"
author = "ابو المهدي"
posted = "2006-05-21"
text = "من مبدأ كلامك انك لست بمغربي<br />في الحكى عنا.. اوكي..ما بنعرف..<br />هذه الألفاظ غير مغربية.<br />اما عن تقليدكم لاينفعنافي شيئ لأن ورائه فقط الإنحراف والحروب و.و.و.و.....<br />وإذا زرت المغرب وهذا سيكون أحسن ايامك<br />فحفظ هذا المثل {إذا رايت او سمعت شيئافي المغرب لا تستغرب}<br />اماعن افضل او ارقى من كل العرب فعليك ان تبحث على طبيب نفسي لعلاجك<br />لأن الكل يعرف مايجري داخل كل بلد عربي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114339/http://www.20at.com/article2.php?sid=202"

[[comments]]
order = 5
subject = "سكون الروح"
author = "مغربية"
posted = "2006-07-28"
text = "و الله انا ما بعرف انتم هنا عشان تتناقشوا او عشان تتخاصموا<br />مش عيب لو نشر مقال يشرح فيه مشكل من مشاكل الدول العربية و احنا هنا عشان نعرف نقط ضعفنا و نقويها عمر الاخطاء ما كانت عيب او شتيمة هي ممكن تكون شتيمة لو ما صلحناها و حكاية احنا احسن من العرب فهدا كلام غير مقبول اي نعم بلدنا المغرب كان من ارقى الدول و التاريخ يشهد على كده فما ننسى الاندلس و حضارتها و يوسف ابن تاشفين و بطولاته و ....و....و..... الخ<br />بس بجد انا ما بعرف ايه سبب الخصام الدائم بين المصريين و المغاربة انا مش حقول نفس كلام اللي سبقوني من الزملاء اننا كلنا عرب و ووطنا واحد لو كان الكلام ده صحيح مكناش حنلاقي هدا التفرق اللي بتشهده الوحدة العربية<br />و ملوش داعي يدخل كل واحد يجلس يجرح في الناس اللي عنده كلمة طيبة يقولها و اللي عايز ينتقد اوكى ينتقد بس بشكل منطقي و مهدب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114339/http://www.20at.com/article2.php?sid=202"
