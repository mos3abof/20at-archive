[[comments]]
order = 6
subject = "يووووووه"
author = "وأنت مال أهلك برضه؟!!!"
posted = "2006-12-13"
text = "نخلص من متعصبي الإخوان في المقال التاني نلاقي أشكالكم المعفنة يا بتوع مبارك؟!!<br />ده ايه الغلب اللي في البلد دي؟!!<br />طيب التانيين معاهم حق، لأن الجماعة فيها ناس محترمة<br />انتوا ايه عذركم؟!!<br />أفهم بس!!<br />ما أنا عرق عندي هيطق<br />آخر طوبة في ربع البرج اللي فاضل تفتت وهتطير<br />روح يا كل حد بيحب مبارك إلهي ... وللا بلاش حسبي الله ونعم الوكيل فيكم<br />لا مش اللي بيحبوا مبارك بس<br />اللي مش بيكرهوه ولا بيحبوه كمان!!<br />ما هو علشان تتطمن إنك بني آدم طبيعي لازم تكون بتكرهه هو واللي جابوه واللي جابهم<br />اللي جابوه يعني اللي خلفوه واللي مسكوه البلد<br />واللي جابهم ولاده و مراته و العملا ورجال الأعمال (الدجالين يعني!) اللي جابهم و بقية الأشكال الـ(تييييييييييييييييييييييت) اللي جابهم!<br />حسبي الله ونعم الوكيل"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190240/http://masr.20at.com:80/article.php?sid=1291"

