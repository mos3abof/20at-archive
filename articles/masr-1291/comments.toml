[[comments]]
order = 9
subject = "التعذيب في مصر"
author = "مي غنيم"
posted = "2006-12-13"
text = "مقدمة المحتويات<br />لقد أصبح التعذيب ظاهرة مستمرة واسعة النطاق في مصر، إذ دأبت قوات الأمن والشرطة على تعذيب المعتقلين أو إساءة معاملتهم خصوصا في أثناء التحقيقات. وفي معظم الحالات، يقوم المسؤولون بتعذيب المعتقلين للحصول على معلومات أو لانتزاع اعترافات منهم، الأمر الذي يفضي أحيانا إلى الوفاة. وفي بعض الحالات، يتخذ المسؤولون تعذيب المعتقلين أداةً للعقاب أو التخويف أو الإذلال، كما تقوم الشرطة باعتقال ذويهم وتعذيبهم للحصول على معلومات أو اعترافات من أقربائهم أو إجبار أقربائهم المطلوبين على تسليم أنفسهم.(1)<br />وإذا كان التعذيب في مصر يستخدم عادة ضد المعارضين السياسيين، فقد صار متفشياً كالوباء خلال السنوات الأخيرة، حيث يكابده عدد كبير من المواطنين العاديين الذين يجدون أنفسهم في الحبس في أقسام الشرطة كمشتبه فيهم أو في إطار تحقيقات جنائية. ولا تحقق السلطات المصرية في الغالبية العظمى من ادعاءات التعذيب على الرغم من أن القانون المصري والدولي يلزمانها بإجراء مثل هذا التحقيق. أما في الحالات القليلة التي تم فيها تحريك الدعوى القضائية ضد بعض الضباط بسبب التعذيب أو سوء المعاملة، فكثيراً ما كانت التهم هينة والعقوبات غير كافية بدرجة لا تتناسب مع الجرم. وقد أدى غياب المحاسبة العلنية والشفافية على هذا النحو إلى ترسيخ مناخ يشعر فيه الجناة بأنهم في نجوة من العقاب.<br />وما برحت الشرطة وأجهزة الأمن تستخدم التعذيب لقمع المعارضة السياسية؛ وخلال العقد الماضي، ذاق الأشخاص المشتبه في انتمائهم لجماعات إسلامية متشددة القسط الأكبر من هذه الأفعال. ومنذ عهد قريب تعرضت أعداد متزايدة من المعارضين العلمانيين واليساريين أيضا للتعذيب على أيدي مسؤولي الشرطة والأمن. ففي مارس/آذار وأبريل/نيسان 2003، على سبيل المثال، قام<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190240/http://masr.20at.com:80/article.php?sid=1291"

[[comments]]
order = 10
subject = "فخورة"
author = "مش مصر إللى ها تبقى فاخورة إن حسنى مبارك بيحكمها لكن حرمية مصر همه بس إللى لو مكنش مبارك الواطى فى الحكم ما كانوش وصلوا للى وصلوا ليه مهو المعلم الكبير إللى علمهم السرقة النهب وبيع البلد والعمالة لليهود والأمريكان ونهب البلد وباع مصانعها إللى مفيش دولة فى العالم حاكمها قدر يبيع املاك الشعب فيها غير الواطى الجعان ده"
posted = "2006-12-13"
text = "ربنا يرحم مصر منه وبكره ينطرد بره مصر وما تخافيش ها يخدك معاه هو الشعب ها يهبب بيكى إيه يا يهودية<br />أنا نفسى أعرف أدوكى جايزة على حقوق الإنسان على إيه وإنت نهبه مصر كلها ولا رشيتيهم بكام حته أثار من أياهم ولو كنتى ناسية افكرك<br />لا لمبارك لا لزوجته اليهودية لا لإبنه المرفوض من الشعب كله<br />نعم للسيد عمرو موسى وبتأييد كامل له"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190240/http://masr.20at.com:80/article.php?sid=1291"

[[comments]]
order = 11
subject = "الدشم \"شوزى\""
author = "سوزان مبارك أمها مسيحية من أصل يهودى. و بالرغم من أن والد سوزان المصرى كان مسلما الا أن سوزان تكرة دين الاسلام كرها فى العرب و المسلمين عامة و فى أبوها خاصة الذى كان قاسيا و بخيلا و غليظ القلب و معتاد الاعتداء بالضرب المبرح على أمها. فى ذات الوقت تأثرت سوزان بالمسيحية أكثر بفضل والدتها و أخوالها الذين غرسوا فى سوزان و شقيقها تونى (منير) الديانة المسيحية. لم تصلى سوزان أو تصوم فى أى مرحلة من مراحل حياتها كما انها لم تقرأ القرأن أو ترتدى أبدا حلى أو سلاسل برقبتها تحمل أيات من القرأن كما تفعل كل النساء المسلمات. وقد شوهدت سوزان فى بعض مراحلها العمرية تؤدى صلاة مسيحية. و بالرغم من ذلك فان الأقباط لم يعانوا من اضطهاد و ظلم و تفرقة و تمييز على مر تاريخهم كما يعانون تحت حكم مبارك الأسود الذى لا يميز بين أى دين و ملة فى القمع و القهر و الظلم."
posted = "2006-12-13"
text = "و بالرغم أن مبارك نفسة لا يصوم أو يصلى بل هو يأتى بكل فاحشة بما فى ذلك الزنا و الخمر و القتل و التعذيب و الاغتصاب و السرقة و النصب و الكذب و الفتن و التجسس و التلصص و تلفيق التهم و التشهير بالمعارضين و الخصوم و حبس الحريات بدون حق و الظلم و القهر و تزوير ارادة الشعب و تضليلة و أكل أموال الفقراء و اليتامى و المساكين الا انة مع ذلك يحرص على أن تلتقط لة الصور و هو يصلى أو و هو بصحبة رجال الدين على الأقل من باب الدعاية. أما سوزان فهى تحرص على الدعاية لذاتها فى كل المجالات الا تهتم بالدعاية لنفسها و لو بالكذب مثل زوجها بأنها مسلمة حريصة على دينها تمارس شعائرة و تخاف اللة. كما لم تشاهد سوزان أبدا و هى تصلى و لم تلتقط لها صور و هى تزور أو تفتتح جامع أو تقف الى جوار أى من رجال الدين بل عرف عنها كرهها الشديد لهم و لايزال موضوع عمرو خالد و غيرة خير م<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190240/http://masr.20at.com:80/article.php?sid=1291"

