[[comments]]
order = 13
subject = "رقاص الساعة"
author = "أحمد مطر"
posted = "2006-12-14"
text = "منذ سنين،<br />يترنح رقاص الساعة،<br />يضرب هامته بيسار، يضرب هامته بيمين،<br />والمسكين، لا أحد يسكن أوجاعه،<br />لو يدرك رقاص الساعة، أن الباعة<br />يعتقدون بأن الدمع رنين،<br />وبأن استمرار الرقص دليل الطاعة،<br />لتوقف في أول ساعة،<br />عن تطويل زمان البؤس، وكشّف عن سكين،<br />يا رقاص الساعة،<br />دعنا نقلب تاريخ الأوقات بهذي القاعة،<br />وندجن عصر التدجين،<br />ونؤكد إفلاس الباعة،<br />قف وتأمل وضعك ساعة،<br />لا ترقص، قتلتك الطاعة،<br />قتلتك الطاعة."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190240/http://masr.20at.com:80/article.php?sid=1291"
