subject = "كل سنه وانتا طيب"
author = "ايمن امام"
posted = "2006-12-12"
text = "كل سنه وانتا طيب- ماتخافش على الحريه وحقوق الانسان كله تمام طالما دينا بترقص فى الشارع وتأكل العيال العنب اللى طلع مخمر خلى دماغهم تضرب - حقوق الانسان ها تبقى بخير - انا شخصيا ايقنت انه لافائده -واصبحت اشعر بأن مايحدث هو غضب من ربنا علينا عشان كده سلط السلطه على الشعب- ويمكن يكون ابتلاء ولكن للمخلصين الذين قضوا مدد طويله خلف القضبان- وانت تتحدث عن حقوق الانسان هم يقولون نعم لحقوق الانسان ولكن من هو الانسان فى عرف السلطه/ ايمن امام"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190240/http://masr.20at.com:80/article.php?sid=1291"

[[comments]]
order = 4
subject = "حقوق مين ياعم"
author = "ياإللى زعلانه قوى علشان الناس بتعترض على حسنى مبارك أحب اقولها"
posted = "2006-12-13"
text = "هو إنتى مزهقتيش من عيشة القصور والتنقل بينها والشباب مش لاقى مكان يتجوز فيه<br />هو إنت مزهقتيش من السفر والترحال والشرينج فى أغلى المحلات والشعب عريان<br />هو إنت مزهقتيش من الجمعيات والوهمية إللى بتنهبى فلوسها وفى النهاية عصابة التوربينى بتغتصب الإطفال وتقتلهم<br />هو إنت بيعتبرى نفسك شرعيه وجوزك شرعى فى الحكم رغم تزويركم للإنتخابات<br />هو إنت خايفه مبارك يسيب الحكم علشان ها ترجعى بلدك تانى والناس تشاور عليكى وتقول بنت التمرجية أهى رجعه قفاها يقمر عيش<br />وجودكم فى الحكم مرفوض من الشعب كله ولم ينتخبكم إى شخص فى يوم من الأيام يعنى أنتوا حكام غير شرعيين يبقى ياريت تتركى القصر فوراً لإن ده ملك للشعب والمكان ده أولى بيه واحد يخاف على مصر مش عميل لليهود وللأمريكان وباع مصر ونهبها فى كرشه<br />مصر حره حره يا مبارك أطلع بره"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190240/http://masr.20at.com:80/article.php?sid=1291"

