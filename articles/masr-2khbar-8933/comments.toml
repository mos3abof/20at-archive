text = "قصيدة شعر عن السيد الرئيس من الشاعر أحمد فؤاد نجم<br />سيدي الرئيس في عيد ميلادك الكام وسبعين<br />كل سنة وانت طيب واحنا مش طيبين<br />كل سنة وانت حاكم واحنا محكومين<br />واحنا مظلومين واحنا متهانين<br />ويا تري يا حبيب الملايين<br />فاكرنا ولا احنا خلاص منسيين<br />فاكر المعتقلين<br />فاكر الجعانين<br />فاكر المشردين<br />فاكر اللي ماتو محروقين<br />فاكر الغرقانين<br />الله يكون في عونك -<br />ها تفتكر مين وللا مين<br />في عيد ميلادك الكام وسبعين<br />بقول لك كلمتين<br />الأوله شيلتنا طين<br />و هل تعلم أن النيل بقي رشاح<br />و الجو أصبح بيئة والعيشة ولعة<br />و الشرفا قلوبهم عالبلد والعة<br />و انت عاملهم مذبحة ولا بتاعة القلعة<br />و الإقتصاد سداح<br />و السرقة بقت كفاح<br />و مصر متاحة بس للسياح<br />و عرض البلد بقي مستباح<br />و الثانية ورتنا الويل<br />دا الخطوة في عهدك بقت ميل<br />و الضحك بقي نواح و عويل<br />و الكوسة؛؛عارف الكوسة؟؟<br />ممكن أقول لك فيها مواويل<br />و الجامعة بقت يا إما كباريه أو دار مسنين<br />و الشباب معظمهم من غير خمرة سكرانين<br />و العلم عز علي المتعلمين<br />و الأساتذة بقم دجالين<br />و القادة بقم طبالين<br />و اديني في الهايف يا حبيب الملايين<br />و الثالثة عارف اليابانيين ؟؟<br />زمان في سنة اتنين و خمسين<br />كان عندنا تروماي و كان عندنا علم و متعلمين<br />و ثقافة و مثقفين و أدبا و علما و فنانين<br />و كانو اليابانيين بالنووي لسه مضروبين<br />و للصدقة مستحقين<br />دلوقتي إحنا فين و هما فين<br />هما فوق و احنا في أسفل سافلين<br />و الرابعة أمن بلدنا بقي تنين<br />>>و المحاكم اتملت مظالم<br />و العدالة بقت كمالة<br />و كلمة الحق في الزبالة<br />و >>أصحابها في الزنازين<br />و الخامسة القطاع العام…عام<br />و الفساد…ساد<br />وفي جتة بلدنا بيرعي<br />أفتكر لجنابك إيه و للا إيه<br />و كل ذكري ليك بدمعة<br />آآآآآآآآه آآآآآآآآه<br />أنا كنت حالف ميت يمين<br />أكملهم لك تمنية و سبعين<br />بس ها كفيهم ورق منين<br />و كل سنة و انت … و احنا طيبين"
archived = "2009-05-02"
