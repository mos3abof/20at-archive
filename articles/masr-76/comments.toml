subject = "إيه الجمال ده"
author = "ابن زيدون المجنون"
posted = "2006-03-28"
text = "اسلوبك وموضوعك وكل كلمة بتقطر روعة وجمال واحاسيس وصلتني تماما لدرجة أني دمعت في النهاية .... بلال فضل أنت كاتب موهوب استمر في عون الله"
