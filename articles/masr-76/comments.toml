[[comments]]
order = 1
subject = "فعلا .. بلال فضل اسلوبه رائع"
author = "انا يعشق اسلوب بلال فضل وطريقته في الكتابه ..."
posted = "2006-04-03"
text = "لكن بستغرب ازاي لسه سايبينه لحد الوقتي ..<br />باييني بقر عليه ولا ايه ..<br />عموما لو جراله حاجه انا ماليش دعوه ..<br />دع الخلق للخالق ..<br />هو فعلا كاتب موهوب واسلوبه جميل ..<br />وبيعرف يقول كويس اللي هو عاوزه .."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112940/http://masr.20at.com:80/article.php?sid=76&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
