text = "سالت احد العالمين ببواطن الامور عن تغيير التوقيت فقال لى الهدف ان الناس تصحى بدرى وتروح شغلها وتوفر كهرباء<br />هاهاها هاهاها هاهاها<br />الموظفين بيروحوا شغلهم الساعة 9 الصبح واراهنك اذا رحت اى مصلحة حكومية والشغل فيها ابتدا قبل تسعة صباحا طول السنة<br />اما اصحاب الدكاكين فبيفتحوا بعد الساعة 12 ظهرا لانهم بيسهروا<br />يبقى تغيير الساعة فايدتة اية<br />الا ان يكون الموضوع موضوع غباء موروث<br />صحيح زمان مصر زمان كانت بتشتغل او يبدا العمل بعد صلاة الفجر اما الان فالعمل يبدا بعد صلاة الظهر"
archived = "2009-08-15"
