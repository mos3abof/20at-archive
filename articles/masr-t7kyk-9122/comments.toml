posted = "2009-07-28"
text = "طيب انا في كلية العلوم جامعة عين شمس اوصل الي المكتب ده ازي بعد التخرج ياريت حد يريد عليا عشان انا فعلا محبط من كميه الدراسه الصعبه في هذه الكلية العريقه و في الاخر الناس تتعتقد انك المفروض تتشتغل مدرس امال كلية تربية موجوده ليه ياريت بجد حد يرد عليا في اسرع وقت ويقولي فين المكتب رقمي 0120061819"
archived = "2009-10-08"
capture_url = "https://web.archive.org/web/20091008001008/http://www.20at.com:80/masr/t7kyk/9122.html"

[[comments]]
order = 3
subject = ""
author = "محمد"
posted = "2009-07-31"
text = "السلام عليكم ورحمة الله وبركاته<br />لكم كل الشكر والاحترام والتقدير خاصة الاستاذ الدكتور سمير نوح<br />احب اعرفكم بنفسي انا محمد خريج كلية علوم قسم جيولوجيا وكيميا بتقدير جيد<br />ابحث عن فرص عمل بمجالي في شركة بترول وبصراحه كلمة بحث قليله جدا علي محاولاتي وجهودي واكيد لكل مجتهد نصيب انا حاليا بعمل مندوب دعايا في شركة ادويه واكيد جزء من طموحي واحلامي حاسس انه ضاع<br />وبصراحه اكتر اتعرض عليا اكون مدرس وادي دروس خصوصيه لكن رفضت لسبب مش هقدر اضحك علي الجيل ال هعمله واعلمه حاجات انا نفسي مقدرتش اعمل بيها<br />لكن المجالات المميزه زي البترول بتحتاج واسطه كبيره وفلوس مش فلوس رشوه<br />علي اد متعلمت من كلية العلوم من دراسه نظري وعملي وحسيت بمتعه في مجال الجيولوجيا الا ان انا ملقتش عمل في تخصصي الحكايه مش بسيطه دي مصيبه<br />انا حاسس لو رجع الزمن بيا ورا مش هدخل كلية علوم<br />انا زي مقلت شغال مندوب في شركة ادويه بتحتاج اسلوب شخصيه في الحوار مش محتاجه حاجه من ال اتعلمته نهائي<br />مش كل كلية هيبقي لها مكتب توظيف وحتي لو اتحقق الحلم مع احترامي لكم المكتب ده هيقدر يستوعب العدد الكبير من الخريجيين ؟ ده رقني 0191780369"
archived = "2009-10-08"
capture_url = "https://web.archive.org/web/20091008001008/http://www.20at.com:80/masr/t7kyk/9122.html"
