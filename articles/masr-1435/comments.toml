[[comments]]
order = 5
subject = "معجزة رودى البرنس البرنس البرنس عبد النبى"
author = "حسام المصرى"
posted = "2007-01-13"
text = "أنا ليا واحد صاحبى خريج هندسة طبعاً انتو فاهمين الهندسة و البلاوى الى بتحصل فيها من كلاكيع الدكاترة الى الميدترم الخ...........<br />المهم الواد أتخرج وبالواسطة اشتغل فى شركة بترول فى البحر الاحمر فى بريمة فى المياة المهم راح المعلم هناك بأعتبار انة مهندز زى الفل كان معاه فى الغرفة واحد تانى أسمه رودى البرنس هو كان فاكرة مهندس زى حالاتة تلف الايام ويعرف ان اخينا رودى دة أساساً خريج صنايع وهو فى الاصل سواق ميكروبااااااااص<br />أيوة سواق ميكروباص وهيشرف علية فى البريمة طبعا صاحبنا ماصدقش ان السنين الى ضيعها فى الدراسة ممكن ان الشركة ماتحتجهاش وممكن تجيب أى كلب من الشارع يشتغل فى مجالة<br />قام الواد جتلة لوثة وقام راجع على القاهرة يوميها وماراحش تانى<br />وواحد صاحبى تانى خريج هندسة راح مقابلة فى مصنع تجميع سيارات<br />الراجل المهندس سئلة تعرف أية عن الكنترول يونيت قالة ماخدنههاش فى الكلية قلة طيب هنبقى نتصل بيك<br />بس خلاص"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127181948/http://masr.20at.com:80/article.php?sid=1435"

[[comments]]
order = 6
subject = "الى ابن بهيه"
author = "نيفين نيفى نوفا"
posted = "2007-01-13"
text = "انا دخلت المدونه يا ابن بهيه<br />وفاهمه ليه معبق على صوره عبد الناصر يوم تشييع الكرامه<br />انا مقدره و محترمه انتماءك الناصرى و انت ناقشتنى فيه قبل كدا<br />و بصراحه انا معاك ف التعليق لان فكره الثقوميه العربيه هى يمكن الحسنه الوحيده لعبد الناصر مع انتقادى لكيفيه تنفيذه ليها بس عندك حق فيها<br />لكن ممكن اعرف ليه معلق على صوره نصر الله بالرجل و بيوم احياء الكرامه<br />؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />لو تحب ترد اكون شاكره"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127181948/http://masr.20at.com:80/article.php?sid=1435"

[[comments]]
order = 7
subject = "الاخت نيفين"
author = "احنا مش بنقسم بعض دا ناصرى ودا اخوانى ودا قبطى ودا مسلم انما احنا كلنا مصريين"
posted = "2007-01-13"
text = "وبنحب مصر بلدنا مهما كانت مايلة<br />مفيش فينا الخاين<br />ولا اللى بيفرط بحبة رمل من رملها<br />وكل واحد ولة قدوة<br />ولو شفتى العيال ولاد البلد فى الشدة<br />قد اية بتوجعهم الكرامة<br />الكرامة غالية قوى ولما بتنجرح بيموت الرجل من القهر الداخلى<br />صدقينى شفت ناس ماتوا كمدا<br />وعبد الناصر رغم كل الاخطاء هو رمز الكرامة<br />وصدام حسين كان مجرم لكن على المشنقة كان اسد<br />زى ادهم الشرقاوى<br />ونصر اللة اية يكون جنب سلاح امريكا والجيش الذى لا يقهر -- انما انتصر<br />مالناش دعوة بالدين والمذهب ولكن الكرامة والرجولة<br />الجبان مهما عمل جبان"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127181948/http://masr.20at.com:80/article.php?sid=1435"

[[comments]]
order = 8
subject = "إلى نيفين نيفى نوفا"
author = "إبن بهيه"
posted = "2007-01-13"
text = "عادة لا أرد على تعليقات الإخوة هنا لأن لكل رأيه لو كان محترماً .. وإن لم يكن محترماً ككثيرين فلا داعي للدخول مع هؤلاء في وصلات ردح سخيفة يجيدونها أكثر مني بكثير والهزيمة فيها محتومة لي ..<br />أختي الكريمة المحترمة نيفين .. بداية لي عدة مدونات .. وأكتب في مواقع أخرى كثيرة ، وعدد من المدونات يشاركني في بعض الإخوة لذا وجب التنويه حتى يمكنك تفهم ما سأقول ..<br />صورة عبدالناصر لا تعبر عن أني ناصري بقدر ما تعبر عن عمق احترامي لهذا الرجل العظيم رحمه الله .. ناصر الذي تآمرت عليه كل قوى الاستعمار والضلال .. هو الرجل الوحيد تقريبا الذي قالت عنه السي أي إيه .. أنه رجل بلا ذلات .. أي أنها نقبت وبحثت وفتشت ولم تجد له ذلات كي تفضحه أمام شعبه .. ناصر الكرامة والعزة والإباء .. يحاسبونه اليوم بعد موته على تفاهات في رأيي مقارنة بما نحن فيه اليوم من بلاء .. طبعا لا أبريء ناصر .. فهو ليس نبياً .. حتى الأنبياء انت لهم هفواتهم إلا المصطفى صلى الله عليه وسلم .. لن أطيل في هذا فالرجل غني عن التعريف كما أنه فوق أية مقارنة مع أي حاكم عربي في العصر الحديث ، وأرجو مراجعة تاريخ الرجل وأرشيف أعداءه الذي أفرج عنه بصورة قانونية مؤخراً كي نرى الأمور بوضوح .. ونعرف من هو عبدالناصر .. لكن ناصريتي هذه يا أختنا الكريمة لا تمنعني مطلقا من الوقوف مع الحق الذي أراه بجانب بالإخوان المسلمين اليوم برغم هوة الخلاف فيما بيننا .. لكني أؤمن إيماناً عميقاً بأن حل ألغاز وفوازير مبارك الواطي وملاعيب شيحه الماسوني سيكون عندهم وحدهم دون أية قوة أخرى على الساحة اليوم ..<br />كما أن لعبدالناصر حسنات لا حصر لها وليست القومية العربية .. القومية العربية والوحدة تحديداً هي أفكار سورية من الأساس والسوريون هم من ضغط على عبدالناصر في مشرو<br />اقرأ بقية التعليق .."
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127181948/http://masr.20at.com:80/article.php?sid=1435"

[[comments]]
order = 9
subject = "مبارك: مصر ليست سورية"
author = "مبارك: مصر ليست سورية"
posted = "2007-01-14"
text = "قال الرئيس المصري حسنى مبارك إن ليس لديه أي خطط للسماح لأبنه الصغير جمال أن يخلفه في تولى الرئاسة<br />وقال مبارك في لقاء مع مجلة نيوزويك الأمريكية إن مصر ليست سورية، مشيرا إلى الرئيس السوري بشار الأسد الذي خلف والده<br />وقد نسب إليه قوله إنه يبحث عن نائب لرئيس الجمهورية ولكنه أضاف أن ذلك أمرا صعبا، غير أنه بصدد دراسة عدة أسماء<br />هذا وينص الدستور المصري على أن يتولى نائب الرئيس منصب الرئاسة لفترة انتقالية في حالة وفاة رئيس الجمهورية<br />غير أن هناك تكنهات واسعة الانتشار في القاهرة أن جمال مبارك يعد لتولى السلطة"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127181948/http://masr.20at.com:80/article.php?sid=1435"

[[comments]]
order = 10
subject = "الى ابن بهيه"
author = "نيفين نيفى نوفا"
posted = "2007-01-17"
text = "اولا اسفه على التاخير ف الرد لكن و الله مكنتش فاضيه ثانيه و طبعا مش محتاجه اقوللك يا ابن بهيه ان فعلا كل مره بنتناقش فيها بتثبت انك على مستوى الحوار يكفى عدم التشدد و قبوللك للراى الاخر<br />ثانيه بالنسبه لموضوع عبد الناصر انا كمان زيك صدقنى مقدرش احجر على انتماءاتك السياسيه لتيار دون الاخر و اوافقك تماما زى ما قلت فى مساله ترسيخ ناصر للكرامه ف عهده و اعترف انه فعلا زى ما قال البعض مازال يحكمنا من قبره و ان الكاريزمابتاعته و جنازته اللى بتعد من اشهر جنازات القرن بتثبت تعمق ارتباط الناس بيه و شعبيته الجارفه رغم ما فضحه الكثيرون و منهم انيس منصور_اللى بعترف انه يمكن يكون متحامل_ما فضحوه من مصائب تمت فى عهده و اشهرها حرب اليمن و مش هتكلم ف عبد الناصر لان يمكن الحاضر اهم من الماضى و ان كانت تبعات الماضى ثؤثر ف الحاضر بشكل كبير<br />و علشان نغلق موضوع ناصر انا معترفه بالوسطيه بمعنى ان للرجل ما له و ما عليه و ان اللى ينكر الحاجات الكويسه يبقى ضيق الافق و اللى يتساهل ف الحاجات السيئه اللى عملها يبقى يستاهل يطلق عليه درويش عبد الناصر زى م بيقولو و لكنى استثنيك من هذا بالطبع"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127181948/http://masr.20at.com:80/article.php?sid=1435"

[[comments]]
order = 11
subject = "الى ابن بهيه"
author = "نيفين نيفى نوفا"
posted = "2007-01-17"
text = "اما فيما يتعلق بحسن نصر الله اسمحلى استوقفك فى بعض النقاط<br />اكيد لا يخفى عليك تشيع نصر الله و لكن ما قوللك فى انه ليس فقط شيعى بل شيعى خمينى و اكيد لا يخفى عليك ما يقره الخمينيون من جهرهم بالسوء فى حق الصحابه و انهم يخصون بمزيد من اللعن و السب ابو بكر و عمر و غثمان و ابو طلحه و الزبير و عبد الرحمن ابن عوف و هم من المبشرون بالجنه و لن اتطرق الى قولهم بمصحف فاطمه و غيرها من المهاترات الشيعيه و لكن اذا كانت هذه هى الخلفيه الدينيه للرجل هل يستحق ما نمنحه له من تمجيد<br />يمكن تقوللى فلندع عقائده الدينيه جانبه و هتفق معاك و لكن<br />ما قوللك فى ما ذكره موقع بازتاب من ان الخمينى استقبل عام 1981 نصر الله و الذى كان شابا يافعا عمره 21 عام وقال له طبقا لما ذكره موقع العربيه نت انه و من معه قادر على اذلال القوى الكبرى فى لبنان و خلال الاجتماع منحه الخمينى اجازه شرعيه لتلقى اموال الزكاه و ناداه بحجه الاسلام الحاج اسيد حسن نصر الله و هو ما كان الخمينى ينادى به كبار علماء الشيعه<br />و الكلام دا موثق<br />و ما قوللك فيما وجهه له الكثيرون من اتهامات اهمها احجامه عن الجهاد ف فلسطين و العراق و تركيزه على لبنان المحرر بالفعل و ما تفعله المليشيات الشيعيه التابعه ليه ف العراق من قتل جماعى للسنه و واحجامه عن التصدى لموضوع الاسرى اللبنانيين و تقبيله يد الخمينى و صوره الخمينى التى تعتلى مكتبه<br />هل القضيه مساله صواريخ دكت العرش الصهيونى ام مساله من هو هذا الرجل لتمنحه و لو تعليق يقول يوم احياء الكرامه<br />ابن بهيه انا اكرر عدم انتوائى الحجر على رايك و لكن احب اعرف رايك اذا لم تمانع"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127181948/http://masr.20at.com:80/article.php?sid=1435"

[[comments]]
order = 12
subject = "الى صاحب تعليق لا اعرف اسمه"
author = "نيفين نيفى نوفا"
posted = "2007-01-17"
text = "الشخص اللى بييقول انى مسالتش ابن بهيه عن صوره عبد الناصر احب اعرفك ان اعتقاد سيادتك خاطىء لانى سالت ابن بهيه ف موضوعات اخرى عن الصوره و موضوع عبد الناصر ناقشناه اكتر من مره يعنى ابن بهيه مش بير د علشان انا بنت<br />يا ريت نرتقى ف الحوار عن الحاجات دى"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127181948/http://masr.20at.com:80/article.php?sid=1435"

[[comments]]
order = 13
subject = "إلى الأخت الكريمة نيفين نيفى نوفا"
author = "إبن بهيه"
posted = "2007-01-17"
text = "أختنا الكريمة نيفين<br />السلام عليكم ورحمة الله وبركاته<br />طبعا أعتبر هذه رسالة خاصة لك وبدأتها بالسلام لأن الموضوع قديم وربما لا يأتي إليه غيرنا ..<br />أرجو مراجعة موضوع بعنوان حوا رمع صديقي الطيب على مدونتي في الرابط التالي ستجدين ردا على كلامك المقدر (أرجو مراجعة الموضوع والتعليقات وتقبلي وافر شكري وتقديري<br />ولإخواننا في عشرينات وافر التحية<br />إبن بهيه<br />http://ibnbahya.blogspot.com/2006_11_01_ibnbahya_archive.html"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127181948/http://masr.20at.com:80/article.php?sid=1435"

[[comments]]
order = 14
subject = "الى ابن بهيه"
author = "نيفين نيفى نوفا"
posted = "2007-01-20"
text = "اولا تحياتى<br />ثانيا مع انى وقتى ضيق جدا وكنت افضل ان تنقا لى الرد هنا و لكنى دخلت المدونه و قرات الموضوع ولكن انت مش معايا انك اطرقت لعبد الناصر و الاخوان و السنه و الشيعه و تاثير الاسرائيليات و انا متفقه معاك ولكن انا اسءلتى كانت بصدد نصرالله و لو كنت جاوبتنى من منظور الدين انا قلت فلندع خلفيه الرجل الدينيه جانبا<br />و مع ذللك لو شايف ان بكدا تكون رديت ساكتفى بهذا و مش هفتح الموضوع تانى<br />وفى الحالتين لك تحياتى و شكرى"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127181948/http://masr.20at.com:80/article.php?sid=1435"

