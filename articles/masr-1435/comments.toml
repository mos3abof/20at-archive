order = 15
subject = "إلى الأخت الكريمة .. نيفين"
author = "إبن بهيه"
posted = "2007-01-21"
text = "أختي الكريمة نيفين .. أشكر لك متابعتك وأعتذر إن لم يكن الموضوع قد استوفى ما أردت .. عموماً سأحاول الرد هنا إن أمكن .. إننا نمر اليوم بمرحلة صعبة جدا في تاريخ أمتنا ولابد لنا من تجاوز أية خلافات مذهبية ونتفق بداية على هذا .. صح ؟ لم يكن هناك في يوم حرباً بين السنة والشيعة في تاريخ الإسلام كله كما تعلمين في حين أن الغرب طحن بعضه طحنا واليوم تجمعوا ضدنا .. أيهما أولى بالتجمع أصحاب الدين الواحد الذي لم يخض أنصاره حرباً منذ الفتنة الكبرى أم ضد بعض أم من مازالت دماء ملايين قتلاهم لم تجف في أوروبا ؟<br />أعلم أن السيد حسن نصر الله شيعي ومرجعيته هو الإمام الخوميني في إيران وأزيدك بأن السيد حسن نصر الله ذهب إلى إيران للدراسة في قم ولم يكمل وعاد إلى لبنان على ما أتذكر لعد عدة أحداث هامة يف لبنان .. أعلم كل هذا وأعلم أيضاً أن الشيعة في إيران تحديدا يعتنقون المذهب الجعفري وهو مذهب معترف به في الأزهر الشريف ويدرس لطلاب الأزهر ومنه أخذ ابن تيمية (من أهم أئمة السنة) ولقد خالطت كثيرا من لاشيعة ولم أجد عندهم ما يزعم البعض من سب الصحابة رضوان الله عليهم وغير ذلك من الأقاويل المضللة لتفريق الأمة .. بالطبع هناك طوائف أخرى متطرفة تسب الصحابة كما في السنة طوائف تدعي أن كل الشيعة كفار ومآلهم إلى جهنم والعياذ بالله .. في دراسة لأحد الباحثين مؤخراً وجد على الشبكة (الإنترنت) أربعين ألف موقع يتناول شأن السنة والشيعة منها ثمانين بالمائة تسمي الشيعة روافض والسنة نواصيب يعني منتهى التطرف والسب والشتم في بعض .. الغريب في الأمر أن سبعين في المائة من هذه المواقع غير معلوم المصدر ولا من وراءه .. يعني لبث الفتنة وخلاص ..<br />الإمام الخوميني رحمه الله عقد مؤتمرا كبيرا إبان الثورة الإسلامية في طهران وحضر هذا المؤ<br />اقرأ بقية التعليق .."
