order = 0
subject = "استمرار في تنفيذ المخططات الماسونية"
author = "إبن بهيه"
posted = "2007-01-12"
text = "شكرا يا أميرة على الموضوع ..<br />وأرجو من الجميع مراجعة بروتوكولات حكماء صهيون وما نتج عن مؤتمرهم من أهداف لكي نعلم أن من يحكمنا ماسوني صهيوني .. ومش عايز حد يتفلسف ويتكلم عن المؤامره ووو والكلام الخايب ده .. مشكلة المؤامرة إننا عرفناها متأخر خالص .. والأغرب إننا برغم علمنا بيها إلا إننا برضه ماشيين وراها زي المهابيل ..<br />في أحد بروتوكولات صهيون بيحددوا ده (بالتحديد يعني) وأدواتهم معروفه . يمكن يكونوا غيروا شويه من التكتيكات لكن الاستراتيجية هيه هيه ..<br />ومبارك الواطي اللي بيصرف على كلاب الحراسه أضعاف ما يصرف على البحث العلمي بيؤكد الكلام ده .. يا ريت نقوف ونحط نعل جزمتنا على راس الحيه .. بس خدوا بالكم من سمها ..<br />تحياتي<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127181948/http://masr.20at.com:80/article.php?sid=1435"

