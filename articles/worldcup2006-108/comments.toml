subject = "حاجة غريبة"
author = "محسن"
posted = "2006-07-06"
text = "الغريب في منتخب فرنسا ان أغلبه من السود<br />بص في الصورة اللي محطوطة كل اللعيبة من السود، واصولهم افريقية<br />حتى زيدان من أصل افريقي عربي<br />هي فرنسا ملهاش في الكورة ولا إيه؟!!"
