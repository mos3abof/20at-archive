posted = "2006-05-15"
text = "الوطن باقى والطفاة الفسدة الى زوال هكذا يقول التارتخ منذ بدء البشرية ونهاية هذة المأساة اقتربت ويوم الحساب قريب فقط علينا ان نحذر من اليأس والاستسلام ونظل متمسكين بمطالبنا ...لالالالالا للفساد ....لالالالالا للتوريث.....ونعم نعم نعم لتعديل الدستور"
