author = "مصرى"
posted = "2008-06-05"
text = "ولية يبقى عندنا تعليم راقى ومتقدم - المفروض ان الدولة تدعم المدارس الخاصة ومش تفرض عليها ضريبة<br />كفاية ان القادر بيروح التعليم الخاص ويسيب مكان فى التعليم العام لطالب فقير<br />ولكن وبما ان الظروف زى الطين وبنروح نشحت رواتب موظفى الدولة من السعودية والخليج يبقى لازم نفرض ضرايب<br />وانا اقترح ان نعلم اولادنا فى الكتاتيب<br />وكفاية انة يعرف يفك الخط"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123162612/http://www.20at.com:80/masr/hot-topics/9269.html"

