author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-08"
text = "و اللة العظيم ما انا بضاحك او مستخف<br />انها للاسف الحقيقة و الكارثة معا<br />فى اسرائيل الدولة العنصرية الصحة و الاسكان و التعليم بالمجان حقا؟<br />و ليس بالشعارات الكازبة التى تردد فى مصر<br />علموا اولادكم فى اسرائيل ارخص من اللى ما يسمى تعليم فى مصر!!!<br />على الاقل هيتعلموا علم حقيقى و ليس شهادات تعلق كديكور فى الحمامات<br />اسرائيل اضمن و احسن و جربوا<br />(اطلبوا العلم و لو فى الصين) حديث شريف!"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123162612/http://www.20at.com:80/masr/hot-topics/9269.html"
