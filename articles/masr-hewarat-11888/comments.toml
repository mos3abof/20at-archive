text = "ذبح الخنازير ليس له جدوى، بسبب الآتى:<br />1- لا توجد حتى الان حالات اصابه فى الخنازير فى مصر<br />2- مصر لا تستورد خنازير من الخارج فليس بالتالى هناك فرصة لنقل المرض لنا<br />3- و الاهم ان الفيروس خلاص بأه بشرى.. يعنى الخوف من الناس دلوقتى مش من الخنازير<br />و كمان فكرة اعدام كل الخنازير كلها أصلا غير واقعى ، التهريب شغال و مش هايعرفوا يقضوا عليها 100 %… سورى يعنى ده قرار …!!!!!!"
