posted = "2009-04-27"
text = "لماذا لا تقوم الحكومة الرشيدة بإعدام كافة الخنازير الموجودة حالياً على ارض مصر<br />للتخلص من أي احتمال لتفشي هذا المرض القاتل ، وكفاية علينا انفلونزا الطيور ؟<br />لقد تم بالفعل إعدام اعداد كبيرة جداً من الطيور في فترات ماضية ، فلماذا لايتم إعدام الخنازير ، ولو حتى مقابل تعويض اصحابها ؟<br />ناهيك عما تسببه هذه الحيوانات من امراض خطيرة ربما اقلها ضرراً مرض الدودة الشريطية<br />و الإسلام الحنيف لم يحرم لحومها إلا لحكم يعلمها الله تعالى ، ويبدو ان مخاطر جديدة لها ستتضح مع تفشي هذا الوباء القاتل على مستوى العالم ، باستثناء الدول الإسلامية التي تتبع<br />شرع الله سبحانه وتعالى .<br />و اعتبروا يا أولي الأبصار …"
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429063426/http://20at.com:80/masr/t7kyk/11888-2009-04-27-13-02-18.html"

