author = "ابومحسن غربة 28 سنه"
posted = "2009-12-30"
text = "رد على جمال فهمي (اخر سطرين في المقال)<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــــ<br />المفروض سيادتكم عضو في نقابة الصحافيين تبقى فاهم لكن يبدو ان حضرتك من فاهم اي حاجه خالص واهي جعجعه وخلاص<br />فيه حاجه اسمها معاهدة السلام بين مصر واسرائيل ولا حضرتك مش دريان<br />معاهدة السلام دي اتفاق قانوني بين طرفين مثل عقد الايجار عندنا<br />فيه نص في عقد الايجار لمصلحة المالك اي اخلال بشروط العقد يعتبر العقد مفسوخا من تلقاء نفسه<br />فالشرط دا موجود في معاهدة السلام وبناء عليه مصر لا تستطيع ان تخل بالاتفاقات والشروط الموجودة في معاهدة السلام<br />والا يعتبر معاهدة السلام مفسوخه من تلقاء نفسها<br />وانتو فاهمين الباقي بقا<br />فبلاش جهل"
archived = "2009-12-31"
capture_url = "https://web.archive.org/web/20091231170844/http://www.20at.com:80/masr/news/14661-q-q-.html"

