author = "ولماذا لا يعبرون ؟"
posted = "2009-12-31"
text = "الاردن وقع اتفاقية سلام مربع مع دولة العدو الاسرائيلى - ومعابر الاردن مع الضفة مفتوحة 24 ساعة ولم يحدث اى منع او اى اغلاق<br />غلق المعابر كليا دفع الناس الى البديل - والبديل هو حفر انفاق<br />ثم ان لمصر وضع خاص مع قطاع غزة<br />فاحتلال قطاع غزة سنة 67 تم والقطاع تحت الادارة المصرية وحماية القوات المصرية وكان مفروض اعادة تحرير القطاع مع تحرير سيناء لان مصر هى السبب فى احتلالها<br />غلق المعابر مع القطاع لة دلالة واحدة تجويع الناس وقتل الاطفال ومساعدة اسرائيل وكراهية كل ما هو اسلامى زى حماس وحزب اللة"
archived = "2009-12-31"
capture_url = "https://web.archive.org/web/20091231170844/http://www.20at.com:80/masr/news/14661-q-q-.html"
