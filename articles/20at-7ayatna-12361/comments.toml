author = "نضال العبودي"
posted = "2009-06-14"
text = "بسم الله الرحمن الرحيم<br />إ<br />تحية طيبة<br />ان مع كل من ينقد شركات الاتصال لأنها وللأسف لم تقدم الخدمات الصحيحة<br />حيث كل ماذكر هو صحيح من رداه الاتصال أو ضعف الاتصال<br />ولكن ايضا نحنن مسؤوليتنا كموطنين وكمنظمات مجتمع مدني بالرصد مثل هذة الحالات"
archived = "2009-06-16"
capture_url = "https://web.archive.org/web/20090616104824/http://www.20at.com:80/20at/7ayatna/12361-2009-06-14-10-34-00.html"

