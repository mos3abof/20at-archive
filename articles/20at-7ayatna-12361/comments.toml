author = "ابو حنين الكريماوي"
posted = "2009-06-21"
text = "الاتصالات حالها حال الخدمات الاخرى البائسه التي تقدمها حكومة الديمقراطيه الجديده الى من ينتبهوا الاخوه الوزراء الى مصالحهم الشخصيه او خدمة الناس…الحال كما هو في الكهرباء والماء والمجاري وكل شي…لقد ظهروا على حقيقتهم والانتخابات على الابواب"
archived = "2009-06-22"
capture_url = "https://web.archive.org/web/20090622103057/http://www.20at.com/20at/7ayatna/12361-2009-06-14-10-34-00.html"
