text = "يا نهار اسود بقت المصري اليوم التي يشيد بها الاخوان كلهم اصبحت فجاة تنزع الاحدث من سياقها ولا هي عشان المرة دي قالت كلام وحش عن الاخوان تبقى كفرت<br />طلوا بقى حكم على الناس بدون وجه حق الاخوان غلطوا ولازم يعتفرا بغلطهم والمصري اليوم اللي مش عاجباكم النهاردة اتكلمت مع أبو الفتوح ومع حبيب ومع الطلبة نفسهم ومحدش منهم قال انه اسكتش الا لافض فوه مرشدالاخوان صاحب الطز"
