subject = "هل الاخوان صادقون؟"
author = "احمد"
posted = "2006-12-28"
text = "لابد ان يعلم الشباب انه من اللمكن ان يخدم السلام دون ان ينضم الى جماعة او غيره فالرسول لم يكن اخوانيا او سلفيا بل كان مسلما واني ارى ان تلك الجماعات التي تزعم انها ستنصر الاسلام ماهي الا وسيلة لنشر الكراهية بين الامة وتفكيكها اكثر ما هي مفككة وهذا مانراه فعلا ولذا وانا اسال هل الاخوان صادقون؟؟؟؟؟؟؟؟؟؟؟؟؟ظ"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231000306/http://masr.20at.com:80/article.php?sid=1293"
