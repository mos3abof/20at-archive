text = "معلش التعليقين اللى فوقى علطول اختنا سلمي والاخ او الاخت التانى<br />يا ريت نعرف الاخوان غلطوا فى ايه ؟<br />يعنى تصريحات كل الاخوان بيقولوا انه كان فقره فنيه استعراضيه ضمن فقرات الاعتصام السلمي المفتوح<br />والجرايد بتقول مليشيات مسلحه !!<br />ممكن نعرف مين اللى غلطان ؟<br />الاخوان علشان اسكتش ؟<br />ولا الجرايد علشان قالت مليشيات مسلحه ؟"
