text = "بعض الذين ينتقدون الإخوان ينطبق عليهم المثل الذي يقول (عدوك يتمنى لك الغلط)<br />و لو قمنا بعمل Zoom-in على وجوه هؤلاء لوجدنا للأسف خطوط و ملامح تشكل لوحة متشابكة الظلال و لكن تعطي انطباعا واحدا و مركزا و هو العداء للإسلام"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231000306/http://masr.20at.com:80/article.php?sid=1293"

