text = "بالرغم ان الاخوان بيتهاجموا كتير وخاصة من الحكومة والمنافقين لها وانا عن نفسي ضد الهجوم عليهم بدون وجه حق لكن الحقيقة اللي جصل والتكذيب سواء من المرشد العام وتنظيمه مبررات ما تدخلش العقل شبه مبررات الحزن الوطني لكل مصايبه و كوارثه وتفسيري وممطن اكون غلط ان الشعب المصري اصبح متفرج ومشاهد علي سيرك كبير الاخوان والحزن الوطني بيتبادلوا الادوار في استعراض للضعف في المظهر والشكل وغيلب الفكر والمنهج والاتنين واخدين البلد علي الفوضي"
