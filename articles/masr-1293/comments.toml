subject = "توضيح من موقع عشرينات"
author = "إدارة الموقع"
posted = "2006-12-21"
text = "تم رفع جميع التعليقات (مؤقتاً) من على جميع الموضوعات المنشورة في الفترة من بداية صفحة \"ولاد البلد\" حتى منتصف ديسمبر 2006 بسبب بعض المشاكل التقنية، وسوف يتم إعادتها كما كانت خلال فترة وجيزة إن شاء الله، ولا يتعلق هذا الإجراء بطبيعة الموضوع."
archived = "2006-12-21"
capture_url = "https://web.archive.org/web/20061221131545/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 49
subject = "الغباء التفكيرى"
author = "أحيانا يظن احد المتحررين فكريا أنه يصيب عين الصواب ويريد ان نعطيه الكلمة حتى ينطق بها أن فعلا حزين لمستوى الكتابة الغير جاد فى هذا المقال"
posted = "2006-12-21"
text = "مع ملاحظة أنى لا ادافع عن المرشد فهو قابل للنقد بشرط عدم الاستهزاء والسخرية<br />يا سيد براء عليكم بتعلم مهنة الصحافة جيدا حتى لا تخرج علينا بمثل هذه المقالات الهزلية"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231000306/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 50
subject = "إنت واحد مش متابع الأحداث"
author = "شعبان"
posted = "2006-12-23"
text = "قرأت مقالات لك كثيرة أعجبتنى .. لكن يبدو أن مقالك الأخير .. كله فبركة.. وفهمت منه إنك عايز تتكلم فى الموضوع وخلاص .. دون متابعة حقيقية .. ولا عندك أصلا دراية بالموضوع .. ويا ريت لو عايز تكتب فى أى موضوع .. تناوله إذا كنت فعلا عايز تعرف الحقيقة إما أن تقرأ بعين المحايد للخصوم .. أو أن تستقى معلوماتك من أصحاب الشأن .. علشان كلامك ده تخريف فى تخريف .. ويشبه بالضبط بالضبط كتاب المجلة والجريدة إياها .. الله يسامحك"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231000306/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 51
subject = "قدر الاخوان"
author = "صلاح شنان"
posted = "2006-12-23"
text = "الذى يتابع وسائل الاعلام الان ويتابع الحملة الموجهة للنيل من هذه الجماعة المباركة ويتابع كل من يتكام فى حق الاخوان ويحاول ان يشوه تلك الصورة الجميلة الاخوان لايجد جديدا فهى نفس تلك الوجوه الكالحةالتى لم نسمع الاهى اثناء كل فترة يتعرض فيها الاخوان لحملات التشويه<br />ولذلك الامر ليس فيه اى قلق لان الوجوه الكالحة والكارهة لكل ما هو اسلامى<br />سوف تظل تتكلم وتنعق بما تسمع ولكن جهلوا هوءلاء الحمقى وغيرهم ان مكرهم سوف يبور وان دعوة الله لن يهزمها المرجفون وقدر الاخوان ان يتسلط عليهم هؤلاء والصبر على هؤلاء وعلى حماقاتهم سوف يميتهم ويزيدهم غيظا"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231000306/http://masr.20at.com:80/article.php?sid=1293"

