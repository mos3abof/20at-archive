text = "الاستاذ براء<br />انت مش بتكلم بادب<br />وانا لا اريد ان اظلم الموقع كن الحقيقة الموقع عامل موضوع تاني<br />واخد اراء الناس اصحاب الموضوع الموضوع باسم الازهر قايد نار<br />والحقيقة موضوع محترم<br />وكفاية بقي شتمة وقلة ادب<br />وده اللينك<br />http://masr.20at.com/article.php?sid=1294"
