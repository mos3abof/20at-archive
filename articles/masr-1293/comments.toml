[[comments]]
order = 3
subject = "وش تسخين !!!"
author = "احمد عبد الحافظ"
posted = "2006-12-13"
text = "أخي الحبيب ( البابور ) وفي قراءة ( الوابور ) كاتب المقال ( السبرتاية ) .. اللي فوق الكابتن براء.. اتفق معاك إن فيه حاجة غلط وإن تصرف شباب جامعة الأزهر _ الساذج _ من وجهة نظري بمثابة تغريد خارج السرب بالنسبة لمارسة الإخوان المسلمين في كل جامعات مصر وفي كل محافظاتها وقراها.. لكن أنا شايف إن الحدث ده ليه دلاله هامة ,,<br />- وهي إن حركة شباب الإخوان في الجامعة حركة مستقلة عن توجيه ( الريموت كنترول ) .. ده اسم برنامج علي قناة سخن يا بابور) اللي صدعونا بيه عمال علي بطال .. فلو قيادات الجماعة بيحركوا الطلبة بالريموت وكل كبيرة وصغيرة بإذنهم وعلمهم اعتقد مكانوش وافقوا علي هذا الفعل الشبابي المتحمس الساذج ..<br />- ثانياً .. حتي متي ستستمر سياسة التسخين ضد الإخوان والتعامل معهم بمنطق إن الإخواني مدان حتي تثبت براءته .. لماذ تحميل الأمور أكثر مما تحتمل .. وما الغريب في أن يكون التصرف مجرد اسكتش جاااااااااااد يا عم براء .. ثم إن العالم خرجوا ببيان وقالوا فيه إحنا بنعتذر عن تصرفنا غير الموفق وسامحونا ..<br />ثالثاً .. تابعت كتابتك واشعر أن لك أسلوب وشاهدت فكرتك الجميلة في الدستور لكني أحب يا جميل أقولك - وللأسف - مقالك بايخ .. ويضعك باقتدار علي بداية الطريق إلي مدرسة ( روزا اليوسف .. لخدمة الأخ جمال وشركاه ) برئاسة الباشمهندس كرم جبر ومدرسة ( البوابير المتحدين ) برئاسة عم المخبر الصحفي حمدي رزق والتي تقوم علي سياسة الحول الصحفي ( بفح الحاء ) في التناول ،، والتهليل الذي يفتقد الموضوعية وهي مدرسة ممكن تكسبك عيش كويس كصحفي فاتكل علي الله واشتغل بابور ... مع إنس مستخسرك !!<br />أما إذا كنت غاوي شهرة علي حساب مرشد الإخوان فأقولك إيه !! يالا ياعم عيش مجتش عليك أكبر منك وبيعملوها ..<br />وأخيراَ .. روح لصحاب الش<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 4
subject = "يا بلد عاوزة الحرق!"
author = "وأنت مال أهلك؟!!!"
posted = "2006-12-13"
text = "ايه يا بتوع التعليقات اللي فوق؟!!<br />المقال ما قالش حاجة غلط<br />برغم إني اتربيت في وسط إخواني و بأحبهم بعيد عن السياسة، إلا إن والله تعليقاتكم خليتني عاوز أقول حاجات قبيحة جدا!!!<br />يا أستاذ مهدي أرجوك أرجوك أرجوك احترم عقول الناس..<br />على الأقل عقولنا احنا .. احنا من جماعتك..<br />منك وعليك<br />بالله عليك توقف عن تصريحاتك<br />أنا والله أحبك في الله<br />لكني أحب ديني أكثر"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

