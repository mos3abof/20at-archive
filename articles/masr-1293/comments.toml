text = "بصراحة يا براء انت الاول كانت بتعجبنى افكارك ولكن وكما قال الاخ \"احمد حافظ \"- اللى يهمنى انك تقرا تعليقه مرة واتنين وعشرة- شكلك حابب تدخل مدرسة البوابير مع اخوك حمدى وكرم زفت حبر ,,<br />ليه التسخين يا براء ليه موجة تشجيع الناس وتسخينهم على كره الاخوان ؟؟؟؟؟ ارجع لعقلك يا براء ..<br />تحياتى لاحمد حافظ رايك ممتاز جداجدا جدا"
