text = "أما لفرقة الدفاع عن الإخوان وخلاص فأذكرهم<br />لا تنه عن خلق وتأتي مثله *** عار عليك إذا فعلت عظيم<br />وخلينا فاكرين إن<br />- طلعت السادات يدخل السجن لتطاوله على الجيش المصري<br />- مهدي عاكف يسب المصريين جميعا -بحجاب وبدون -جيش و غير جيش - ولا يساءل بالمرة<br />ومايصحش الإخوان يفضلوا يقولوالحكومة بترهبنا وهما عايزين يرهبوا كل الناس"
