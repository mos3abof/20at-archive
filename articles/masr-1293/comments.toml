subject = "بالمناسبة ... اللي بيقول إرهاب فكري"
author = "اللي بيقول إرهاب فكري...."
posted = "2006-12-13"
text = "ليه ردود االناس على المقال بو كانت مخالفة ليه تعتبر إرهاب فكري مش تعبير عن الرأي ....بينما كلام صاحب المقال تعبير عن الرأي مش إرهاب فكري....<br />ده اللي اتعودنا عليه منكم ...<br />لو الكلام يوافق رأيكم ... يبقى حرية تعبير..<br />لو موقف مخالف....يبقى إرهاب فكري...<br />لو الراجل اتكلم بأسلوب وحش وسخرية ...تبقى حرية تعبير...<br />ولو ردينا عليه بنفس الأسلوب... نبقى ما بنتحملش النقض"
