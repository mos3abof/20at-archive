[[comments]]
order = 1
subject = "لا نريد مهاترات فى الكلام"
author = "[img]http://img207.imageshack.us/img207/9955/uula6.jpg[/img]"
posted = "2006-12-13"
text = "أكد الدكتور محمد السيد حبيب- النائب الأول للمرشد العام للإخوان المسلمين- رفضه حملات الإثارة والاتهامات التي شنتها بعض الصحف ضد مجموعة من الطلاب في جامعة الأزهر، موضحًا أن ما قام به الطلاب كان مجرد عرض لفقرات تمثيلية داخل المدينة الجامعية.<br />وقال: إن هذا العمل تم بتصرف فردي من بعض الطلاب وأن الإخوان لا يمتلكون ميليشيات مسلحة، ولا يقومون بتدريب أعضائهم على الرياضات العنيفة، مشيرًا إلى معاتبة لهؤلاء الطلاب على اعتبار أن هذا الأمر مرفوض شكلاً وموضوعًا.<br />وأكد أنه من حق الطلبة استخدام كل الوسائل السلمية والقانونية للتعبير عن رفضهم واحتجاجهم لما قامت به إدارة الجامعة من فصل متعسف لبعض الطلاب بدون مبرر، وكان الأولى بإدارة الجامعة ألا تغلق الأبواب، وتسد المنافذ أمام الطلاب لممارسة حقهم في النشاط داخل الجامعة.<br />د. محمد البلتاجي<br />من ناحية أخرى، قال الدكتور محمد البلتاجي- الأمين العام للكتلة البرلمانية للإخوان المسلمين والأستاذ بكلية الطب بجامعة الأزهر- في المداخلة التي قام بها في برنامج على الهواء بقناة الصفوة مساء أمس إن ما قام به طلاب الإخوان من استعراض للمهارات الرياضية لم يكن إلا فقرة من فقرات الاعتصام الذي نظمه الطلاب في الجامعة، ولم يُقصد به مطلقًا استعراض القوة، مشيرًا إلى أن الطلاب قد أصدروا بيانًا يؤكدون فيه ذلك.<br />وطالب الدكتور البلتاجي الطلاب بأن يتحلوا بالشجاعة الأدبية، ويقدموا اعتذارًا عن الرسالة السلبية غير المقصودة التي نتجت عن هذا السلوك، كما أكد أنه لا بد للإدارة الجامعية أن تراجع أسباب قيام الطلاب بالاعتصام وحالة الاحتقان داخل أسوار الجامعة، والتي لا شك أن تزوير الانتخابات<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

