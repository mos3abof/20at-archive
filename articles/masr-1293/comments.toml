text = "اظن انه كان ممكن يا عم براء تقول رايك دون ان تسب المرشد بهذا الشكل الذى لا يرضى احدا ،يا جماعة هل نترك القضية الاساسية وهى ارهاب الطلاب وضربهم من جانب البلطجية بعد شطبهم من الانتخابات وفصل بعضهم واحالة المئات للتحقيق واستبعاد الطلاب والطالبات من المدن الجامعية -ونمسك فى تصريح للمرشد او فقرة عملها بعض الطلاب مع حق الجميع فى رفض الاسلوب ،هل من المنطقى ان نترك المعركة الحقيقية ونلف فى الشارع الخلفى لنبحث عن اى تصريح من هنا او هناك ،بصراحة مسمعناش حد رفض الانتخابات المزورة والاعتقالات والارهاب وضرب الطلبة وفصلهم بنفس الحماس والمتابعة الحثيثة اللى شفناها فى المسالة التافهة دى ،ايوة والله العظيم تافهة لانها حصلت كتير قبل كده والاخوان زى ما هما فى البلد لم يرفعوا السلاح بعد ،ليه بنيجى فى الهايفة ونصدر ،ليه ما نبصش للامور بمنظار سليم ،يعنى نبص للسبب الاول وبعدين لرد الفعل ،ثم ايه السخرية اللاذعة دى فى الحديث عن مرشد الاخوان ؟هى دى برضه الاخلاق اللى لازم يتحلى بيها الاعلاميين المحترمين يا عمنا ؟انا عارف ان قلمك ساخر ولكن هى السخرية لازم تقرن بالاستهزاء من الناس -فضلا عن واحدمن اهم مجاهدى مصر-وتقويلهم مالم يقولوا ،الراجل قال انه اسكتش ،وهو الاسكتش لازم يكون كوميدى ،يا ما عملنا فى الجامعة اسكتشات كنا بنبكى بسببها قبل المتفرجين .<br />يا عالم ارحموا الاخوان من النظرة المنيلة سيئة النية دى ،ليه افتراض الخطا دايما ،والبدء فى كيل الاتهامات بمجرد اصدار مرشد الاخوان اى تصريح حتى لو كان بيكح؟<br />الا يعتبر اعتذار الطلاب كافيا؟لماذا يرتدى البعض النظارة السودة لما يتكلموا عن الاخوان ؟"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

