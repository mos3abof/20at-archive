subject = "حرام ده ظلم"
author = "أحمد"
posted = "2006-12-13"
text = "والله ده حرام وظلم بين يا ناس يا هووو الموضوع كله كان عبارة عن اسكتش ضمن برنامج ثقافى لشباب الإخوان للتنديد بظلمهم وشطب اسمائهم من الجامعه \" وهو ده الموضوع اللى المفروض نركز عليه ونتاوله مش الإسكتش\" وكان الموضوع كله بالمدينة الجامعية وليس امام مدير الجامعه .... أرجوكم هو الأستاذ محمد مهدى عاكلف فاضى للكلام الفارغ ده... الله يعينه كفاية عليه مصائب البلد والأمة الإسلامية ... وارى ان كاتب المقال غير مؤدب فى عرضه مع الأستاذ مهدى عاكف"
