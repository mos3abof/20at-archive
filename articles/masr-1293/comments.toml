[[comments]]
order = 20
subject = "عيب عليك"
author = "محمد حسين"
posted = "2006-12-13"
text = "عيب يابراء معالجة الموضوع بهذه الصورة<br />اناباحترم شغلك لكن هذه المرة انت غير موفق بالمرة بل انك للاسف بتكرر نماذج كتيرة ارادت ان تشتهر بالنيل من الاخوان على مبدأ صديقنا عبد الله الطحاوى الرزق يحب شتيمة الاخوان<br />ويفترض يا عم براء ان تحترم تبررير الرجل ولا يحوز لك كاعلامى سليل اسرة اعلامية عريقة ان تسير فى زيل من استغل هذه الصورة دون ان يتانولها فى سياقها للنيل من الاخوان او لمجرد الاثارة والبحث عن مجد شخصى خاصة وانت تعلم تماما ان جريدة المصرى اليوم وهى التى اثارت الموضوع متخصصه فى انتزاع الاحداث من سياقها لتحقيق السبق الصحفى"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

