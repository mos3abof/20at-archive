subject = "براء براء"
author = "كشاف"
posted = "2006-12-14"
text = "السادة المعلقون ربما اتفهم سر غضب البعض وانتشاء البعض الاخر على طريقة مين معانا ومين علينا خلونا نفكر قليلا<br />اولا السخرية فن عظيم والمقال ينتمي لكوميدي الموقف لم يسب ولم يتهم ويجرح وهو فن شائع قديما وحيثا واين الوعيم الذي لم تنله نغزة قلم او وشاية ريشة ولو عدنا اسعد زغلول مرورا بحسن البنا حتى عبد الناصر واعظم زعماء العالم تعرضوا لهذا الاسلوب من النقد وهو امر حيوي للمجتمع والافكار والاخوان يدخاون مرحلة جديدة وهم من يزجون بالمرشد في الامور السياسية وكان هنلاك اقتراحات بان يظل هذا المنصب في اطاره الروحي ويكون هناك جهازا سيا سيا يقوم بالاشتباك مع القضايا المدنية لكن ان يصدر الرجل الكريم في اتون الصراع السياسي وعندما يجرح تقوم القيامة اذاكان صاحب الفضيلة فاليظل عند الفضائل ملهما للجميع ومعبرا عن الاجماع ولااعلم لو صار الاخوان حكاما ساسيين وتعرض للنقد ماذا سيحدث ملحوظة انا مندهش للاخوة اللي بيشموا المصري"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

