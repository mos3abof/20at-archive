[[comments]]
order = 26
subject = "ربما الحماس الزائد"
author = "حسين عبد الظاهر"
posted = "2006-12-13"
text = "أعتقد أنه من غير اللائق يا براء أن نتحدث عن رجل فى مكانة الأستاذ مهدى عاكف بهذا القدر من السخرية والاستخفاف ، ليس تقديسا لشخص الرجل ، إنما تقديرا لمكانته وعطائه للوطن.<br />قد تتفق أو تختلف معه ومع فكره وهذا حقك ، لكن الرجل أعطى أكثر من ثلاثة و عشرين عاما من عمره فى السجن.. فى الوقت الذى لو احتجز الواحد منا داخل قسم شرطة يخرج مناضلا سياسيا تدبج له المقالات و يهتف باسمه فى المظاهرات.<br />استغرب من قصائد الغزل العفيف التى شدوت بها فى مقال سابق تعتذر لأحد المدونين لأن البعض تطاول عليه فى التعليقات.<br />بينما تهاجم رجل فى مكانة الاستاذ عاكف قضى جل شبابه خلف القضبان ووهب حياته للعمل العام وفق المنهج الذى رأى أن فيه الصلاح للوطن ..وانتصارا للحق وليس بحثا عن مجد شخصي أو مكسب دنيوي!<br />لن أذهب لما ذهب إليه البعض من أنك \"بتسخن\" المواضيع أو أنك بتحاول تحقيق شهرة على حساب الإخوان .. ظنى بك أنك أكبر من هذا، ومعرفتى لك تجعلنى اعتقد انه الحماس الصحفى الزائد ، و الحرص على السخرية من كل شيئ وأى شيئ فى محاولة للخروج على المألوف وتحطيم ما يعتقد أن حواجز.<br />لا أمانع فى ان يكتب المرء مايشاء .. لكن يجب أن ننزل الناس منازلها ونعطى الرموز حقها .. فى وقت قلت فيه الرموز وندرت القدوات."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 27
subject = "برآء ....لن اعيش في جلباب أبي"
author = "حسام"
posted = "2006-12-13"
text = "هكذا منذ أن عرفته منذ اللحظات الاولي يرفض ان يعيش في جلباب ابيه ،براء ذوالجذور الاخوانية \" الجدوالوالد\" لايريد أن يعيش في جلباب العائلة الاخوانية وطريقه في ذلك هو النقد الدائم وربما الجلد أحيانا<br />ونحن متفقون على انه حر تماما فيما يقبل به او يرفضه وان يعيش في جلباب ابيه ام في التيشرت الخاص به لا فرق عندنا ولكن<br />ان تكون الوسيلة هي ان الاخوان مش عجبينه وخلاص بل نادرا جدااا ان يعجبه الاخوان في شئ ويتقبلها على مضض وهنا ينبغي ان اقول ان الفرق واضح وجلي بين المتحامل وبين الناقد وبينهما فروق عديدة .<br />فاليخطئ المرشد_فهو بشر _ الف مرة وهو كذلك مسؤول ولنا ان ننقده كما نشاء فهذا حقنا في حريه التعبير ولكنى اسف اشد الاسف في ان يكون النقد بهذا الشكل وتلك الطريقه<br />التى تخلو من اي قدر من الاحترام لرجل عاش نصف عمره في المعتقلات دفاعا عن الاسلام وعن مبادئ لا يختلف عليها اثنان فحري بنااذا وجدناه يخطئ ان نحترم تاريخه وعطائه وهذا ديننا وتلك اخلاقنا .......اليس كذلك يابرآء"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

