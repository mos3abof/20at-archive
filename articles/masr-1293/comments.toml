text = "ولكن إكتمل المسلسل الذى جرت إليه الدوله ,وأمنها الصحافه الشريفه وغير الشريفه بقصد وعن غير قصد ...<br />وانتهت فصوله السخيفه والمفتعله فى سيناريو مكرر للمره الألف يفتقد للحبكة الدراميه واللمسه الفنيه الراقيه<br />واعتقلوا الطلاب تحت مسمى مكافحه الإرهـاب<br />أتمنى أن أرى مقالاتك وقلمك يدافع عن شرفاء مصر وأبنائها وشبابها ..."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

