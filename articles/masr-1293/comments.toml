text = "انا لا استغرب ذلك من جماعة الاخوان فهم من وقت الي وقت يطلعوا ببدعة شكل و هم الان يحاولون ان يظهروا بعض قدراتهم لتخويف الاخرين كعادتهم .. مهدي عاكف يحاول اصلاح ذلك بس الكذبة بينة جدا يا مهدي يلي قلت طظ في مصر و اللي في مصر !!!! هل انت مسؤل عن كلامك ام مرشد للاخوان ؟؟"
