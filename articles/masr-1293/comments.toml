[[comments]]
order = 10
subject = "صناديق"
author = "أحمد مطر"
posted = "2006-12-13"
text = "هكـذا ..<br />نَصحـو<br />فَيصْحـو فَوقَنـا شـيءٌ مُريبْ .<br />وَعلى الفـورِ يُسمّينا \"الأحبّـاءَ\"<br />وفـي الحـالِ نُسمّيه \"الحبيبْ\" !<br />نَحـنُ لا نسألُهُ كيفَ أتانا ..<br />وَهْـوَ لا شـأنَ لَـهُ فـي أن يُجـيـبْ .<br />ثُـمَّ نغفـو<br />سـائلينَ اللّهَ أن يجعَـلَهُ خيـراً<br />وفـي أحلامِنـا<br />نَسـالُـهُ أن يَسـتجيبْ !<br />نَحـنُ والحَـظُّ ..<br />وحيناً يُخفِـقُ الحـظُّ<br />وأحيانـاً يَخيـبْ !<br />يَمخَـضُ \"الشـيءُ\"<br />فإمّـا هُـوَ ذئـبٌ يَرتـدي جِـلدَ غَـزالٍ<br />أو غَـزالٌ يقتَنـي أنيابَ ذيـبْ !<br />وَهْـوَ إمّـا صِحَّـةٌ تَنضَـحُ داءً<br />أو مَمـاتٌ يَرتَـدي ثَـوبَ طبيبْ !<br />ثُـمَّ نَصـحو ..<br />فإذا الشـيءُ الّذي نَعـرفُهُ..ولّـى<br />وقـد خَلَّفَـهُ مِن فَـوقِنـا شـيءٌ غَـريـبْ .<br />وإذا الشـيءُ العَقيدُ الرّكـنُ هـذا<br />يَمتطـي دبّـابَـةً<br />أفضَـلَ مِـن دبّـابـةِ الشـيءِ النّقيـبْ !<br />وعـلى الفَـورِ يُسمّينـا \"الأحبّـاءَ\"<br />وفي الحـالِ نُسـمّيهِ \"الحبيبْ\" .<br />ثُـمَّ نغفـو<br />سـائلينَ اللّهَ أن يلحقَ بالسّـابقِ<br />فـي وقـتٍ قريـبْ .<br />فـي بـلادِ النّاسِ<br />يأتـي \"الشَّخْـصُ\" مَحمولاً إلى النّاسِ<br />بِصُنـدوقِ اقتـراعٍ ..<br />وبِبُلـدانِ الصّنـاديقِ<br />يَجـيءُ \"الشّـيءُ\" مَحمـولاً<br />بِكيسِ ( اليانَصـيبْ ) !"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 11
subject = "اشمعنــــــــــا"
author = "رئيس تحرير"
posted = "2006-12-13"
text = "السادة الافاضل قبل اى تعليق اوضح لسيادتكم انى لست اخوانى ولكنى انظر الى جماعة الاخوان بكل تقدير واحترام ويكفى ان يكون من بينهم د عصام العريان وغيره<br />ثانيا هل اننا ظالمون واصبحنا نكيل الامور بمكيالين فسبحان الله عندما تقوم وزارة الداخلاية بممارسة ضغوطها وادخال مجموعة من البلطجية داخل الحرم الجامعى لتواجه به الطلاب هذا امر عادى عندما تتراص مجموعات الامن المركزى بلبسهم الاسود المقيت بانتظار اى واحد يخرج من الجامعة ليشبعوه ضربا وترهيبا واذلال ثم يقبض عليه فهذا شئ عادى عندما يشطب اسماء الطلبة المرشحون وتلغى ترشيحهم ويتم انتقاء اسماء معينة بمعرفة مباحث امن الدولة فهذا طبيعى<br />يصبح الطلاب محبطين يائسون من احوال جامعتهم التى تعتبر بروفة قبل حياتهم العملية فيعلنون انهم سيقومون بعمل اتحاد حر يعنى مش عنلعب معاكم ماشى حقهم ورد فعل طبيعى لناس اتظلمت راحت الجامعة الواعدة الرشيدة التى من المفترض ان تكون منارة تشع عدل باعتبارها جامعة اسلامية تعلم الطلاب الدين والفقه والشريعة تفصل هؤلاء الطلاب فكان من الطبيعى ان يقوم الطلاب بالاعتصام موض"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 12
subject = "اشمعنا"
author = "رئيس تحرير"
posted = "2006-12-13"
text = "موضوع الاقنعة ومهارات الكاراتيه يا جماعة الطلبه دى معدل اعمارها من 19 الى 21 عاما لم يصلوا لمرحلة النضج السياسى ولم يعلموا مامعنى ان يقوموا بهذا الاستعراض فقامت وسائل الاعلام مشكورة بتسليط الضوء على الحدث فى رسالة الى الشعب المصرى الذى يتفاعل ويحب الاخوان وقام المنفقين من امثال الشخصيات العامة المكروهه والمعروفة بالنفاق من امثالكرم جبر وغيره بالدعايه المغرضة ودعوة المصريين بالقلق من الاخوان ونحن اذكى من ان ننفعل معهم تركنا الفعل وناقشنا رد الفعل تركنا المصيبة بحرماتن هؤلاء الطلبه من ممارسة حقوقهم وسلطنا الضوء على رد فعلهم يا استاذ براء من الاولى ان تقف الى جانب الحق والعدل وليس ان تتهكم على شخصية يكن لها كثير من المصريين الاحترام والتوقير واخيرا حسبى الله ونعم الوكيل"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 13
subject = "إيه الحلاوة دي"
author = "ياسر فرج"
posted = "2006-12-13"
text = "إيه يا عم براء إيه الحلاوة دي فينك من زمان بس و الله خايف عليك لحسن الإخوان يقطعوا عيشك من الدستور ما هما بالصلاة علي النبي بيمولوه و عملوها يومي و بعدين يا أخي بجد الواحد مش عارف يعمل إيه مع البلاليص دول اللي مش فاهمين حاجة بجد تيجي تشتغل في روز اليوسف تلاقي أحمد عز بيمولها و الدستور الإخوان و الجرائد التانية مببتمولش فمتقبضش لما يطلع عينك فيها طب نعمل إيه<br />كلمني<br />ياسر"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 14
subject = "يا عم براء...بلاش إفتراء !"
author = "واحد معدي"
posted = "2006-12-13"
text = "بلا افترا يا عم البراء على الراجل ...لإن الراجل من الاساس مقلش الكلام بالتحابيش إلي معاليك عمال تضفها للتصريح..<br />مفيش مشكلة إن طلاب في جامعة يلعبو كاراتيه...يعني معاليك متحرقتش ليه لما امن الدولة أطلق البلطجية على الطلبة من كام يوم...<br />يا براء خليك عدل في احكامك..مش عشان تكتب كلمتين ...تجرح ناس محدش قدم التضحيات إلي قدموها لبلادهم وامتهم...يعني صديقك محمد شرقاوي لما مخبر لعب بالورقة في \"لامؤخزة\" قامت الدنيا وعملت هوليلة ..في حين قبلها بكام يوم مات شاب من الاخوان اظن اسمه طارق ..محدش اتكلم عنه سطرين...وبعده بكام يوم مات مهندس من الاخوان في المعتقل ده غير الدكتور محمد الحيوان وكتير غيره ..قدمو للبلد بجد مش تهليل وكلام لمجرد الكلام...<br />والله احسن حاجة يعملها الاخوان طالما مش عاجبين ..إنهم يسيبو البلد تولع لأنها بجد بلد متستهلش...وأهلها اجدع ناس تتكلم ويتصدروا في الهايفة...<br />بصراصحة مفيش فايدة..بلد متستهلش !!!"
archived = "2006-12-16"
