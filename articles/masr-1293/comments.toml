text = "بعض الذين ينتقدون الإخوان ينطبق عليهم المثل الذي يقول (عدوك يتمنى لك الغلط)<br />و لو قمنا بعمل Zoom-in على وجوه هؤلاء لوجدنا للأسف خطوط و ملامح تشكل لوحة متشابكة الظلال و لكن تعطي انطباعا واحدا و مركزا و هو العداء للإسلام"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130010326/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 8
subject = "هل الاخوان صادقون؟"
author = "احمد"
posted = "2006-12-28"
text = "لابد ان يعلم الشباب انه من اللمكن ان يخدم السلام دون ان ينضم الى جماعة او غيره فالرسول لم يكن اخوانيا او سلفيا بل كان مسلما واني ارى ان تلك الجماعات التي تزعم انها ستنصر الاسلام ماهي الا وسيلة لنشر الكراهية بين الامة وتفكيكها اكثر ما هي مفككة وهذا مانراه فعلا ولذا وانا اسال هل الاخوان صادقون؟؟؟؟؟؟؟؟؟؟؟؟؟ظ"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130010326/http://masr.20at.com:80/article.php?sid=1293"
