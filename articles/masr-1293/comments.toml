[[comments]]
order = 35
subject = "براحه على نفسك ياعم براء.. بواسيرك يا سيد"
author = "الصعيدى"
posted = "2006-12-14"
text = "أولاً براء باشا أنت نجحت فى جذب الأنظار لمقالك بس لو عودت نفسك إنك تتجاوز عن مبادئ علشان الناس تشوفك فأقولك نصيحه من دلوقتى .. إللى بيبيع بصاغ لما بيتعرض عليه مليون برضه بيبيع ...<br />كنت أتمنى أن أرى منك تحليل أكثر حياديه يضع الأمور فى نيصابها الحقيقى أنت تعلم الإخوان وتحتك بهم وتعلم معنى كلمه مليشيات ,وأسألك هل 25 طالب من تربيه رياضيه بيلعبوا كراتيه -رغم إعتراف الجميع بالرساله السيئه بتاعتهم وربنا يسامحهم- هل هذه مليشيات يابراء كنت أتمنى عليك أنت تحترم أنت عقل جمهورك .. وتحلل المقال بدون تحابيش يبدو أن هناك من اتفق على تضخيمها وجرها إلى خانه العنف والإرهاب...<br />كنت أتمنى أن تقف بجوار الطلاب المظلومين .. كنت أتمنى أن تحرص على سماع صوت الطلاب وألف من هيدلك عليهم يانجم الصحافه يصحفى يامحترم<br />أما التلفيق والتحوير والتحريف والمبالغه فهذه أصبحت مهنه الرخيص وبتفكرنى بعنوان فيلم للنجمه (لحم رخيص )<br />فهذه أيضاً مهنة رخيصه وعيب عليك...<br />كنت أتمنى أن تنقد أراء المرشد بأدب الصحفى المحترم الذى لايهين رموز مصر ولكن يعترض بشئ ولو قليل من الأدب والعقلانيه والتحليل السياسى<br />لكن وبما إنك اخدت سكه البوابير فبقول لمؤسسه الصحافه الصفراء .. من كل قلبى وبروح رياضيه مبروك عليكم البراء .. صحفى جديد وضبطوله الشعله وعلموه التحبيش بتاعكم علشان نشوفوا كمان كام سنه على رأس تحرير مؤسسه عظيمه<br />وياخسارتك يا رجوله .. وياخسارتك يا أدب"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 36
subject = "قاطعوا \"المصرى اليوم\""
author = "ياسر ابو عمار"
posted = "2006-12-14"
text = "احب اقول للاخوة المحموقين قوى على المصرى اليوم ،ان الجريدة تحولت بارادتها الى مصدر سئ للاخبار وتخصصت فى الاثارة التى كنا نرفضها من النبا والحادثة ،ولكن باسلوب اكثر ضررا على المجتمع،لماذا اصبحت الجريدة تتصيد الاخطاء وتضخم الامور دون اى داع،الم تلاحظوا عدد الكوارث التى لحقت بالبلد مؤخرا بسبب تهور صحفيي الجريدة او اتباع ادارتها اسلوبا مريبا فى معالجة الاخبار بالاضافة الى خيانة الامانة المهنية فى احيان كثيرة ،والامثلة على ذلك كثيرة منها \"تصريحات محمد حبيب حول فؤاد علام،تصريحات فاروق حسنى بشان الحجاب ،واخيرا ميليشيات الازهر المزعومة \".<br />ويبدو ان انتشار الجريدة اغرى العاملين فيها بالمزيد من الانتشار على حساب الحقيقة والامانة الصحفية .<br />ولكن ما حدث مؤخرا من القبض على المئات بسبب تهويل المصرى اليوم لا يمكن السكوت عليه .لذلك ادعو كل من يحب هذا الوطن الى مقاطعة المصرى اليوم لتوصيل رسالة اليها بانه \"عيب\"وان هذا الاسلوب فى العمل لن يجر على اليلد الا الخراب."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 37
subject = "ياعم براء"
author = "ياعم براء انت عارف كويس إن ما فيش ميليشيات ولا كلام فاضي للإخوان..."
posted = "2006-12-14"
text = "يبقى نعتبر المقال ده إيه ..<br />1- محاولة للإثارة<br />2- محاولة لجذب الأنظار<br />كنا بننتقد مجلات مثل روزور يوسف إنها بتتصدر للهيافة ... وإن صحفيين كتير فيها بيثيروا زوبعة على حاجات تافهة ... إنت كدة بقيت زيهم<br />ممكن تكتب وتنتقد انتقاد محترم لبعض المواقف الي انت حاسس فعلا انها ممكن تثير قضية وطنية .... ولكن القضايا التي تكتب فقط للنقد والسخرية ولإظهار أنه لا خطوط حمراء ليدك حتى لو كانت تتسم بالمبالغة الشديدة فأعتقد أنها غير مفيدة"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 38
subject = "القبض على 180 طالب من الاخوان"
author = "قوات الأمن المصرية تعتقل النائب الثاني للمرشد العام للإخوان المسلمين"
posted = "2006-12-14"
text = "في تصعيدٍ جديدٍ وخطيرٍ شنت قوات الأمن المصرية حملة اعتقالات موسعة شملت العديد من قيادات الإخوان المسلمين وعلى رأسهم الرجل الثالث في الجماعة المهندس محمد خيرت الشاطر النائب الثاني للمرشد العام، والمهندس أيمن عبد الغني زوج ابنة الشاطر، والمهندس ممدوح الحسيني وآخرين.وأكدت مصادر الجماعة أن هذه الأسماء هي فقط التي تم التوصل إليها أثناء عملية المداهمة والاعتقال التي بدأت في الثالثة من فجر اليوم الخميس 14/12/2006م وهو ذات توقيت كتابة هذه السطور.الجدير بالذكر أن حملة الاعتقالات الجديدة تتم بعد حملة إعلامية واسعة شنتها أجهزة الإعلام المصرية على جماعة الإخوان المسلمين، متهمةً إياها بالعنف متذرعةً ببعض المشاهد التمثيلية التي قام بها بعض الطلاب في جامعة الأزهر.كما أن هذه الحملة تأتي في أعقاب ثلاثة أيام من الإفراج عن الدكتور محمد مرسي عضو مكتب الإرشاد والدكتور عصام العريان القيادي في الجماعة؛ وهو ما يمثل حالة من النكوص والترجع عن كل الوعود المعلنة من قِبَل النظام المصري لعمل إصلاحات حقيقية في الحياة المصرية.<br />يا رب تكون اتبسط يا عم براء"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 39
subject = "على نار هاديه ...."
author = "محمد جلال"
posted = "2006-12-14"
text = "بعيدا عن الاخ براء ومقاله<br />خلينا نناقش الامور من جذورها ونتاكد من صحة الاخبار وسط المقالات اللى انكتبت هنا وهناك وفي كل مكان<br />هناك ثلاث جهات حللت الموقف<br />الجهه الاولى تتحمس وتنتظر اى \" حاجه سخنه \" تحصل فى البلد علشان تحس ان فيه جديد بيحصل نتكلم عنه ونعمله ضجه بدل حالة الياس والكبت اللى احنا عايشينها<br />ودول يتمثلوا فى المقام الاول من جريدة المصري اليوم ومن امثال اخونا براء<br />الجهه التانيه بتعالج الامور بواقعيه وبحيادية ويتمصلهم كما فى عشرينات اخونا حسام الهندي فى نفس الموضوع بتاع الازهر<br />ناس تالته واكيد كلكم عارفينهم وبلاش نتكلم عنهم لانهم ارخص من اننا نتكلم عنهم<br />ويتمثلهم روز اليوسف ومن والاها .<br />منكرش يا براء ان اسلوبك جامد فى الاستهزاء ويمكن ليك هدف شحصي انك تنمى نفسك فى المجال دا ، ود مش عيب بالعكس ،، لكن يا ريت متنميهوش على حساب حد تانى وخاصة انك عارف ان الشعب بتاعنا مش ناقص هيافه وتضييع عقول ...<br />وتحياتى لكم جميعا<br />جامعة بني سويف"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

