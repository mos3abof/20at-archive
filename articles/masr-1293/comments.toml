[[comments]]
order = 17
subject = "على فكره العنوان قبيح جداً وقليل الأدب"
author = "إبن بهيه"
posted = "2006-12-13"
text = "على فكره يا أخ براء .. يجب أن تلاحظ أمر هام جداً وهو وجوب احترام هذا الرجل لأسباب كثيرة .. كالعلم فهو كما نعلم عنه أنه أحد علماء المسلمين ، والسن فهو كما يبدو في عمر جدك ، والسبب الأهم هو أنك يجب أن تحترم ملايين المصريين الذين يمثلهم هذا الرجل وملايين آخرين خارج مصر إن كنت معتاداً على سب أجدادك وأستاذك .. أرجو أن نتأدب في الحديث مع رجل يمثل ملايين المصريين ولا يعبر عن شخصه هو فقط ككثير ممن نختلف معهم ونسبهم حتى .. المسأله هنا مختلفه .. عندما غضينا جميعاً من الحديث الصبياني الجاهل الذي ذكره قداسة بابا الفاتيكان ، ظللنا نناديه بصاحب القداسة برغم ما اقترف من جرم وبرغم ويقيننا بجهله وما جلبه لنفسه من كره لشخصه إلى أقصى حد تتصوره أو يتصوره هو ، لكن بقينا نناديه بلقبه ليس احتراما له يقدر ما هو احترام لأنفسنا أولاً واحتراماً لملايين من أتباعه .. هكذا تربينا يا براء .. ويا ولاد البلد .. فأين تربيتم أنتم ؟ مش في مصر برضه زينا ولا إيه الحكايه يا أخ براء ويا أولاد البلد؟؟؟<br />على فكره العنوان قبيح جداً وقليل الأدب وتشم فيه رائحة عفن عادل حموده ...<br />طبعا هذا بعيد تماماً عن موضوع مبارك الواطي .. هذا شأن آخر لأن مبارك ينهب هو وعصاباته بلدنا ولا يمكن أن نتأدب مع لص ، إن تأدبنا مع مبارك الواطي فحري بنا أن نتأدب مع من أرسله إلينا ((أمريكا)) أنفع وأكسب منه كثيراً ... للجميع تحياتي ...<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

[[comments]]
order = 18
subject = "يا ترى براء عايش فى دور مين اليومين دول"
author = "مش عارف الأخ براء متقمس شخصية مين اليومين دول .. كم يوم قبل كده عاش لنا فى دور بلال فضل ، وهات يا شتيمة وتعبيرات فارغة ، ظنا منه انه كلما زادت تطاولاتك وخروجك عن الذوق العام .. كلما اقتربت من اسلوب بلال فضل وزاد معجبوك.."
posted = "2006-12-13"
text = "اليومين دول مش عارف هو عايش فى دور مين بالظبط اكيد مش حمدى رزق وللا عبد الله كمال<br />واضح انه دور تالت شعاره ادى شتيمة فى الحكومة مرة وفى الاخوان مرة علشان تظهر انك صاحب قضية ولك قلم لا ينتمى لحزب او اتجاه وان انتماءك الحقيقي للقراء او لذاتك<br />وهذه نظرية مغلوطة لان الانتماء يكون للحق سواء كان مع اى حزب او اى اتجاه ومفيش داعى للشتيمة لمجرد الاثارة وخلاص"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190814/http://masr.20at.com:80/article.php?sid=1293"

