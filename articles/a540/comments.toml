text = "الأخت نونا<br />اولا شكرا يا ست هانم يا اللي وحشناكي<br />ثانيا إزاي تساوي بيني وبين الولد الألضوش غاندي المحطة ده .. حاجة عجب والله<br />ثالثا عيب قوي تقولي وحشتوني زي الست وردة الجزائرية الله يرحمها ويحسن إليها<br />لأان أنا بتكسف لأني متربي تربية محافظة جدا<br />جدا<br />جدا<br />ع العموم أنا جيت أهه ... بس من غير الله يكرمك وحشتوني والذي منه لأني أنا إحساسي مرهف<br />جدا<br />جدا<br />جدا<br />وأخيرا اعذريني إذا كنت غلست عليكي<br />هي دي عمايل دي<br />إخص<br />إخص<br />إخص"
