subject = ""
author = "سماعيلي نور الين"
posted = "2007-01-29"
text = "بسم الله الرحمان الرحيم<br />آسف جدا باعتباري مسلم عربي جزائري ، و أزيدكم أنه لم تروا الأدهش منه ، لن أخبركم لأني أعلم أنه لا يخفى عليكم أخبار بلدنا الحبيب. و أقولها ، الحمد لله ثم الحمد لله الصحوة الاسلامية الغراء بقيادة علمائنا المجاهدين سنزيح كل هذه العقبات. فلا يغرنكم و لا يخدعنكم هذا الغثاء ( لكن نعدعوا الله عز و جل لنا و له بالهداية - آمين يا رب - ).<br />و لا تنسونا في دعائكم و أنتم تقومون فما أحوجنا لذلك. أخوكم نور الدين."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225702/http://20at.com/20at/lifestyle/3139.html"

