text = "عندما تجد كل ما يحيط بك يدعوك لان تكره فمن تحب وكيف تحب…في اعتقادي جل مايسميه الشباب اليوم باسم الحب والغرام…هي اسماء بدون مسمى..فالحب عند الكثير من الفتيات اصبح يعني ح=حساب ب= بنكي..وهدا من حقهن في اعتقادي فعالم اليوم تسوده النزعة المادية الراسمالية يعني ان قيمة الانسان ودرجة قبوله من طرف الاخر اصبحت تقاس بمقدار ما يملك من اموال…اما العلم..الثقافة ..الاخلاق فهي مقاييس ثانوية ."
