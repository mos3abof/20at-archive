text = "اللى هيروح هتطلع عنية ومش هيشوف حاجة غير شوية مهاويس بتصرخ وناس بتزعق بعصبية وامن مركزى لابس ملابس مدنية وقوات جيش باللبس المدنى فى المدرجات والشاويش بيصرخ مصر والعساكر بتزعق وراة مصر مصر وكان مصر مباراة كرة قدم<br />وبعدين التوتر بين اللاعبين شديد جدا و مش هتشوف لعبة حلوة ابدا<br />انصح ان الناس تقعد فى البيت وانا عن نفسى ها استغل قعاد الناس فى البيوت وقلة حركة المرور وها اتحرك براحتى فى الشوارع"
