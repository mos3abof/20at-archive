posted = "2009-11-13"
text = "والله يا ااختى العزيزة بجد احترمت كلامك وعجبنى انك بتفكرى بالاسلوب ده لو بعيدا عن التوترات والشتائم البذيئة والتحرش وخلافة كنت من كل قلبى قولتلك روحى الاستاد<br />لكن انا كنت ناوى اخد مراتى وبنتى معايا لكن فكرت زيك بالظبط كدة واكتشفت ان البيت فى اليوم ده اكرملى بكتير من انى اروح الاستاد<br />وكفاية علينا ان شاء الله بعد ما نصعد ننزل الشارع نفرح مع الناس لان سعتها كله هيكون بيحتفل فا مفيش شتايم مفيش تحرش وخلافة والخ الخ<br />تخياتى"
