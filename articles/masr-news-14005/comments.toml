posted = "2009-11-16"
text = "كما ان النصيحة تعم المسلمين كلهم<br />هل توقف النبى عن دعوة الاخرين حتى يسلم عمه<br />قال تعالى(وذكر فان الذكرى تنفع المؤمنين)<br />فحري بك ان تعرف فقه النصيحة<br />قبل ان تهرف بما لا تعرف"
archived = "2009-12-08"
