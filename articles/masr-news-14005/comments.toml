posted = "2009-11-15"
text = "قال تعالى (وقرن فى بيوتكن)"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073713/http://www.20at.com:80/masr/105-msa7t-r2y/14005-2009-11-11-11-25-16.html"

[[comments]]
order = 26
subject = ""
author = "الى عمرو عبدالبديع"
posted = "2009-11-15"
text = "وقرن في بيوتكن<br />والاقربون اولى بالمعروف<br />شوف النساء اللي في عيلتك الاول وبعدين نسا الجيران<br />وبعدين ابقى تعالى عشرينات قول وقرن في بيوتكن<br />الاقربون اولى بالمعروف وات ذا القربى حقه يعني حقه في النصح<br />سلام"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073713/http://www.20at.com:80/masr/105-msa7t-r2y/14005-2009-11-11-11-25-16.html"

[[comments]]
order = 27
subject = ""
author = "عمر عتريس"
posted = "2009-11-15"
text = "الى هيروحو اصلا للتشجيع فقيط مش هتعرف تشوق خالص لاازمتشترى تذكرة درجه اوله وصتك هيروح وهيطلع عينك ومتعفش بقى هيبقى حر ولا سقعا يارب اللقاء يبقى فى استادى القاهرة"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073713/http://www.20at.com:80/masr/105-msa7t-r2y/14005-2009-11-11-11-25-16.html"

[[comments]]
