text = "سأتمكن من مشاهدة ميدان التحرير قبل وبعد المبارة إذا كنت أشاهد عند جدتي.. أو شارع جامعة الدول إذا كنت أشاهد عن أهل زوجي.. وذلك عند الفوز بإذن الله.<br />يعني عايزه تفهمينا انك من الطبقة العليوي في البلد دي بيت تيتا في ميدان التحرير وبيت اهل جوزك في شارع جامعة الدول<br />ايوه يا عم حد ادك مش زينا احنا بتوع المرج وعزبة النخل<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
