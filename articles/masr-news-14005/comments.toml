[[comments]]
order = 15
subject = ""
author = "مش ناقصة قلة حياء"
posted = "2009-11-13"
text = "أما العشرة أسباب التي تشجعني كثيراً على الذهاب إلى الإستاد فهي:<br />1- أنني سأتمكن من الهتاف والتشجيع والغناء مع المشجعين.<br />2 – أنا من محبي وعشاق كرة القدم بحق.. ولست مجرد واحدة من فتيات الأيس كريم والقبعات الطويلة التي تليق على الملابس اللاتي يحببن كرة القدم لأن زيدان شكله أمور!<br />3- أنا أعرف جيداً قواعد وقوانين اللعبة.. وفاهمة يعني إيه تسلل (وهو لغز الألغاز عند كل الفتيات)!<br />4- أنا متابعة جيدة للدوري المصري، والإنجليزي، والأسباني، والإيطالي، والـChampions league كذلك<br />– نفسي أتواجد خلال هذه اللحظة التاريخية لو فزنا بإذن الله<br />كل الكلام دا زى الفل وانتى انسانة عقالا والله بجد بس بردو فيكى طابع الانثوى الغريب شوى وهو انك بتقولى:سيدات وفتيات أوروبا جميعاً لديهن الحرية المطلقة للذهاب إلى الإستاد والتشجيع مثلهم مثل الرجال والشباب وهن لا يلاقين تحرشات ومضايقات ولا نجد من يعلق على تواجدهن بسخرية… إشمعنى إحنا..اولا دول فى اروبا مش فى مجتمع شرقى زينا وبعض الافكار الجاهلية عند بعض الرجال والنساء"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114140058/http://www.20at.com:80/masr/news/14005-2009-11-11-11-25-16.html"

[[comments]]
order = 16
subject = ""
author = "مش ناقصة قلة حياء"
posted = "2009-11-13"
text = "أريد أن أثبت وجهة نظري أمام زوجي وإخوتي بأنني سيدة قادرة مثلهم على التشجيع والاستمتاع.. إشمعنى هم؟!<br />- (إنتي هتشوفي الماتش فين؟).. أريد أن تكون إجابتي.. (في الاستاد).. القدرة على الذهاب في حد ذاته متعة.>>><br />هو دا عيب البنات كلها فاكرا نفسها انها هتكون ناقصة ..لو ما اسبتتش للراجل انها قادرة على مراعة نفسها ..اثبتيلو بس فى حاجة اهم من الكورة فى مواقف فى حياتك فى اى شى لاكن مش الكورة ونرمى نفسنا فى التهلوكا فى متش زى دا…اختى العزيزه ماتروحيش المتش دا لان هذه المبارة سوف تكووووووووون صعبة جدا ..ومن لا تذهب الى هذه المبارة هتحافظ على نفسها وعلى شرفها وعدم الاحتكاك بهاا ..البنت الصح المؤدبة ماتروحش المتش دا روحى بس اى يوم تانى…تحياتى لكى"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114140058/http://www.20at.com:80/masr/news/14005-2009-11-11-11-25-16.html"

