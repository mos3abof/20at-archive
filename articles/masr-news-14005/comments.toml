posted = "2009-11-11"
text = "ذهاب البنات دعوة صريحة للتحرش<br />فلا تذهبى<br />لانة فى حالة هياج او فوضى او شغب فى الملعب وهذا وارد هيحصل تحرش شديد وهتتمسكى من حتت فى جسمك عمر ما حد مسكها<br />خليكى بالبيت<br />واتفرجى فى التليفزيون<br />ولا تعرضى نفسك لمشاكل مرعبة"
