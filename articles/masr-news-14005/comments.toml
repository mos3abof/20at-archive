text = "اذا كنت عايزة تشوفى الماتش<br />بسيطة جدا<br />روحى زى اى واحد<br />لانة فى البيت ممكن الكهرباء تنقطع زى المعتاد وتبقى معزولة تماما وعلى فكرة انا الكهرباء بتقطع عن المنطقة تلاتة اربع مرات فى اليوم وهاروح الاستاد اتفرج على الطبيعة<br />جمدى قلبك وروحى وهتلاقى بنات كتير هناك<br />واللى يحصل يحصل واللى يعرف ابويا يروح يقول لة"
