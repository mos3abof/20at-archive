posted = "2009-11-13"
text = "كل لاعب وادارى ومدلك ومدرب هياخد بعد الماتش دة 3 مليون جنية<br />يعنى لو عددهم 50 هيكون المبلغ اللى هيحصلوا علية 150 مليون جنية<br />تخيل يا محترم 150 مليون جنية علشان مباراة<br />احنا بلد فقير والا بلد سفية والا بنستعبط<br />القتيل فى حادث القطار اخد تعويض 3 الاف جنية واللعيب هياخد 3 مليون جنية<br />هتروحى تتفرجى على اية - على خيبة بلد<br />150 مليون جنية ممكن يصلحوا اشارات مرور القطارات بدل اللعيبة<br />150 مليون جنية يدخلوا مياة نظيفة ل 10 قرى<br />150 مليون جنية يبنوا 50 مدرسة<br />150 مليون جنية مكافئات اللعيبة بعد المباراة<br />شدى عليا اللحاف وصوتى يا صفية<br />مفيش فايدة"
