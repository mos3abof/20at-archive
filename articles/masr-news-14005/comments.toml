text = "ياحجه والله مش وقت فلسفه الشباب الى بتقول متروحيش ومش عايزين البنات تروح دول شباب ميه ميه وبيتكلم صح بيتكلم فى منطق انكوم بنات زى اخواتهوم عشان حاسين بى الاهانه الى هتحصلكوم هناك والبهدله الى هتحصل كده البنات كلها اتحزرت علننا على النت وعلى القنوات الفضائيه والارضيه الى هتروح بعد كده هيا نظيره على نفسها من الى هيحصلها بسبب الضغوط والعدد المهول الى هيكون موجود والشتيمه والبهدله والتحرش يعنى هيا الى هتبقى عايزه كده من الاخر لآنها اتمنعت وعملت فيها عبدو البورم وبردك هتروح"
