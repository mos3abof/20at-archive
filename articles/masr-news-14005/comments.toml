author = "ختام الكلام"
posted = "2009-11-15"
text = "لو الدولة ممثلة فى ادارة استاد القاهرة ( استاد ناصر سابقا ) عايزة الستات والبنات يذهبوا ليشجعوا تخصص لهم مكان محدد فى المدرجات مربع معين مخصص للسيدات والانسات تماما مثل عربة الستات بتاع المترو ومفيش جنس شاب يهوب هناك ويكون هناك حراسة مشددة وبوابة خاصة بدخولهم وخروجهم<br />كدة التفكير الصح اللى يحافظ على ادمية البنات ويحترم عادتنا الشرقية<br />و طبعا الكوتة بتاع مجلس الشعب بتاع نسبة الستات هتزيد وممكن الستات يطلبوا تشريع بتخصيص اماكن لهم فى الاستاد ووظائف فى الشرطة والجيش<br />العملية عايزة شوية نظام<br />مدير جدع للاستاد فاهم ويقدر ياخد قرار<br />سلام<br />وكفاية بقى واختموا الموضوع على كدة<br />الحاج هريدى الصعيدى - فرشوط"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073713/http://www.20at.com:80/masr/105-msa7t-r2y/14005-2009-11-11-11-25-16.html"

