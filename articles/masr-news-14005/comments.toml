posted = "2009-11-16"
text = "الماتش خلص<br />ولسة عايزة تروحى<br />وجوزك ما ودكيش<br />دة باين علية كسلان قوى"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073713/http://www.20at.com:80/masr/105-msa7t-r2y/14005-2009-11-11-11-25-16.html"

[[comments]]
order = 29
subject = ""
author = "عمرو عبد البديع"
posted = "2009-11-16"
text = "من عمرو عبد البديع الى الكاتب المجهول ا<br />اولا من اخبرك انى لم انصح الاقربون ونساء اهلى وهم جميعا كذلك ولله الحمد<br />ولكن كل اناء بما فيه ينضح<br />ولا ادرى لماذا ضاق صدرك بذكر ايه وبنصيحة قرانية<br />كان اولى بك ان ترد على اصحاب التعليقات الخادشة<br />ولكن (قد بدت البغضاء من افواههم)"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073713/http://www.20at.com:80/masr/105-msa7t-r2y/14005-2009-11-11-11-25-16.html"

