text = "اترضاه لامك الترياق ضد التحرش<br />يعني ا واحد حيتعرض لوحده<br />لو تذكر امه وانها ممكن تكون في نفس الموقف<br />لتراجع على الفور<br />ـــــــــــــــ ــــ<br />اللهم صلي على سيدنا محمد وعلى اله الذي علمنا ذلك"
