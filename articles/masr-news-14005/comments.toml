posted = "2009-11-11"
text = "شوفى تقدرى تروحى الاستاد بس هقولك على حاجات تستغنى عنها<br />اولا نظافة ودنك لانها مش هتبقى نظيفة بعد الماتش ثانيا جوزك هتستغنى عنه خالص لانك هتسمعى حاجات لما تحاولى تخليه يقولك معناها هيطلقك<br />ثالثا انوثتك هتتهان كتير جدا ده لانك هتبقى بين شباب ورجاله كتير جدا واكيد فيهم اللى مش محترم وهيبدا يستهبل ويقل ادبه<br />اقولك اكتر من كده ايه وكمان تستغنى عن حوالى 12 او 14 ساعه يوم الماتش عشان تقدرى تروحى الاستاد فى وقت كويس وتلاقى مكان ماتش زى ده هيبقى صعب على البنات تروحه يا ريت كل البنات تبقى فى البيوت احسن عشان التحرش اللى بقى اسوأ مرض فى بلدنا والله<br />انا بحزن لما اشوف شباب مصر كده بيحاولو يتحرشو بأى بنت وخلاص عموما ربنا معاكى لو قررتى تروحى الماتش بس اعتبريها نصيحة من اخ اوعى تروحى الماتش وحافظى على ودنك وجوزك وانوثتك"
archived = "2009-11-13"
capture_url = "https://web.archive.org/web/20091113013436/http://www.20at.com:80/masr/hot-topics/14005-2009-11-11-11-25-16.html"

