posted = "2009-11-12"
text = "يا امة ضحكت من جهلها الامم<br />مرة فيه واحد قبطي قالهالي اسمه مدحت قلاده<br />والله عنده حق<br />مصر والجوائر في حالة التأهب القصوى من اجل معركة كروية<br />واليهود بيستعدوا لهدم المسجد الاقصى<br />فعلا مدحت قلاده عنده حق<br />يا امة ضحكت من جهلها الامم<br />ليهم حق الاقباط<br />ليكو حق يا زخاري جرجس<br />مصر والجزائر دولتين عربيتين مسلمتين داخلين معركة كروية كبرى"
