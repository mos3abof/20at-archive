order = 36
subject = "يا اخواننا"
author = "سعيد الشربينى"
posted = "2006-12-01"
text = "فى هذه الايامزاد الحديث للأخوة الذين يطالبون بالحكومة الاسلامية؟<br />ولكن الذين يطالبون بها هل يعلمون ماهى الحكومة الاسلامية؟ وماملامحها التى تميزهاعن<br />باقى الحكومات؟<br />فاللحكومة الاسلاميةملامح تميزها عن باقى الحكومات إنهاالالتزام بالامرالالهى بل تعاقد<br />حر. سواء فى قبول قيادة أولى الامر. وليست حكومة ديكتاتوريةالحق. ومن باب أولى دكتاتوريةالباطل.<br />فهى حكومة تقوم على الاجتهاد المبنى على العلم والاخلاص فى تنزيل الحكم الشرعى على الواقع البشرى . انها حكومة بشريةاو مدنية<br />او شورية. لا يهم الاسم؛ المهم ان يفهم الناس ان الحكم الشرعى لاينطبق على واقع البشربصورة تلقائية. بل لابد من اداة بشرية<br />تترجم هذا الحكم الى منطوق واقعى وقانون.<br />انها حكومة العدل والعدالة .العدل فى القانون والعدالة فى الاشخاص فالعدالة هى السمة الابرز لكل رموزها بدءا من إمام الامة الى اقل الولاة وائمة الصلاة؛ لان فاقدالشىءلايعطيه؟ومن هنا لم يكن من المتصور ان يصدق عمرو ابن العاص-ولامعاوية أومن كانوا على شاكلتهم من حكام ذلك الزمان فى دعواهم بالتحاكم الى ماانزل الله وتطبيق الشريعة الاسلامية.<br />ونحن نقول لمن يرفعون المصاحف على أسنة الرماح فى ايامناهذه:من لم يكن منكم عمرو او أبا موسى فليقل لناهأنذا؟<br />ونحن لانعترض- والعياذبالله- على تطبيق الاحكام الاسلامية؛ولكن ليس على يد من كانوا على شاكلة الحكمين ويكفينا رأى كل واحد منهما فى صاحبه؟ والكارثة العظمى هى ان الخوارج المعاصرون قد عبروا عن تلك السذاجة والسطحية الفكرية حينما اعتبروا ان الحكم بما انزل الله امرا سهلا وميسورا؛لانه لااجتهاد مع النص ؛ولان الشريعة الاسلامية واضحة ومدونة فى كتب الفقه.فعن أى يسر وسهولة يتحدثون؟؟؟<br />ومع كل هذا هم لايكفون عن الصراخ كأسلافهم مطالبين بتطبيق الشري<br />اقرأ بقية التعليق .."
