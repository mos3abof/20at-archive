subject = "يا اخواننا"
author = "سعيد الشربينى"
posted = "2006-11-28"
text = "فى البداية ارحب بكل من ابدى رأيه فى الاستاذ محمود جابر<br />ولكن اذا كانت حرية الحوار اتيحت لكل من هب ودب فهنا مربط الفرس؟<br />يجب على كل ذو رأى احترام رأى الاخر حتى يستطيع ان يعى ما يقول وما يقال عليه وله؟<br />اما بالنسبة لكلام أ / محمود جابرفهذا رأيه ولابد ان يحترم واذا كان هناك رأى اخريطرح حتى نستطيع الوصول الى الهدف المنشود اذا كان ذو الرأى له هدف؟ولكن علشان نقول هذا مسيحى وهذا مسلم نحن جميعا ابناء وطن واحد والدين لله فارجوا جميع الاحباب احترام الاخر لاننا جميعا نجتهد من اجل مصر وفقكم الله / اخوكم سعيد الشربينى"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041824/http://masr.20at.com:80/article.php?sid=397&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
