text = "لماذا يقوم الكلب حسنى مبارك بعتقال الاخوان المسلمين انه سفاح يريد ان يتخلاص من الاسلام درجة انه يقوم بقفل المساجد لمنع الحلقات انه يقوم بنع كلام الله هو اصلن مش فالح غير فى الكلام الفاضى مثل الكبريهات والرقصات هو وجمع رؤساء العرب انه يحبس حتى الان الدكتور عصام العريان والدكتور رشاد البيومى الذى يزيد عمره عن السبعين عاما مش هو بس اكثر اعضاء مكتب الارشاد هل هذا يرضى الله اجيبونى منه لله ربنا يخدو و يريحنا منه قولو امين"
