text = "الاخوان بيدوا الحق.. الاخوان بيسحبوا الحق... المسيحيين دول اقلية... المسيحى مواطن من الدرجة التانية...المسيحيين ليهم حق المواطنه.. انتم هتعملوا حساب للاقلية... المسيحيين علمانيين ... متسمعش للكفرة ... المسيحيين خايفين... (كله بيتكلم عن المسيحيين كله بيعلق عليهم ويديهم حق وبعد كده يسحبه منحقهم مش منحقهم ههههههههه جميل البلد بخير ومصر بخير بالعلماء والفتاوى والاخوان واسلامية ... اسلامية....) سلام"
