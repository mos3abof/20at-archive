author = "محمودجابر"
posted = "2006-06-10"
text = "الى الاخ معلش احنا بنفهمها!!!<br />لكن اظن وانوان كان بعض الظن اثمفلا يمنع هذا من ان يكون بعضه صحيح<br />عزيزى/ الذى تفهمهاواعلم ظنا انك من هؤلاء الذين لا عهد لهم غير انهم محترفو ادعاء باطلا فكيف لهؤلاء الذين عجزو طوال الخمسونعاما الماضية ان يثبتو انهم جماعة وطنيه ان يخرجوبهذا الدستور كما ان<br />الدكتور بدوى لميكن يومامن هذه الجماعةوهذه واحدة<br />الثانيةان الجماعةفى هذا الوقت كانت مشغوله بحالات الانشقاق التى ضربتهابفعل السندى الذى قتا المهندس السيد فايز<br />عن طريق علبة الحلوى الذى ارسلها الى بيته فنفجر به ثم احتلاله المركز العامللجماعة واختلاف الجماعة مع صدور القرار179 حول توصيف الجماعة<br />كل هذه الاحداث وغيرها ترجح ان الجماعة كانت مشغولهبنفسها<br />يا استاذ فهامه واقرا تاريخكم الاغبر<br />او اسال الذين ما تزال ايديهم تقطر دم<br />ma_alnor2000@yahoo.com<br />ايضا بسين اقولك ان الحزب الوطنىهو ذالك الديوسالذى رضى بفعلكم السياسى المشين<br />الرجس والنجس كما ان مبارك هو الذى اكمل مشوار السادات فى بيع مصرلكم ولمموليكم الامريكانوما خفى كان اعظم"
archived = "2006-06-13"
