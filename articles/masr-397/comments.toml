[[comments]]
order = 33
subject = "هل اسلامكم دعوه راض الله عنها"
author = "elfateheg"
posted = "2006-08-06"
text = "اين منظور الاسلام الذين تريدونه الخلافه ثلاثون عاما ثم تكون ملكا عضوضا يعض عليه بالنواجز<br />الدوله الامويه دوله مسلمين عرب وليست دوله اسلاميه ناهيك عن مزابحها<br />الدوله العباسيه لاتقل قسوه وضغوه واستبداد وفسوق عن الامويه<br />العثمانيع اسوا سنين حكم حكمت العالم الاسلامى<br />اذن ان النموزج الذى تبحثون عنه وهو لم تعيشه الامه الا ثلاثون عاما<br />الاسلام .... هو الحل كلمه حق اريد بها باطل<br />كيف يكون الحل بايديكم ومن خلال القران<br />القران ينطق عنه الرجال<br />الاسلام يحتاج الى فهم جديد فهم يرتفع بالدين الاسلامى الى القمه التى يرضى عنها الله وهو يحتاج الى فهم قرن عشرينى وليس مفهوم القرن السابع الميلادى<br />اى دستور تبحثون عنه<br />هل سوف تلغى الجزيه على اهل الكتاب وماذا يكون ردك على الايه \" يدفعون الجزيه عن يد وهم صاغرون \" عن يد وهم صاغرون \" زليلون حقيرون \"<br />المراه \" من الدرجه الثانيه فى المواطنه \"<br />الاقتصاد ابالزكاه الليست الزكاه او ساخ الناس<br />يا ساده يا كرام<br />المسلمون ابعد ما يكون عن الدين الحقيقى والاسلام الحقيقى<br />من هذا الرجل الذى يستطيع ان يقنعنا بالدين كحل عصرى للحياه<br />لن يكون حلا سلفيا او اخوانيا او نريد حلا من رحم الدين والاسلام الحقيقى<br />اسلام يحقق الحريه الفرديه والعداله الاجتماعيه<br />دينا يوحد بين ثالوث الفكر والعمل والقول<br />اسلاما يخرجنا من جحر الضب الى دخلناه<br />واسلاماه ومحمداه واحمداه ومحموداه"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117140844/http://masr.20at.com:80/article.php?sid=397&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
