text = "الاخوة الاحباب تعلمت من التجارب ان يكون كلامى موجزا وهذا رأى فى مقاطعة المنتجات الامريكية اكتبه بطريقة زجلية يفهمه كل من اراد حسم القضية: ساعة فى الحلال تكفى ... وبلاش سعات بره<br />وقطعوا العلاقات ومنتجات ............بره<br />بلا شبسى بلا بلوتيكا ...... دى منتجات امريكا<br />صديقة اسرائيل ....الخونة المجرمين<br />عوزين يحتلوا بلدنا....ويتحججوا بالدين<br />وللى اسمه بوش يصرص ...بكلام شمال ويمين<br />ويقول بكل بجاحة.....انا بحمى اسرائيل<br />وحنا كمان بنقول لك.....ياعدوا المسلمين<br />القدس ارض اجدادى....هنفديها لو كان مين<br />القدس ارض اجدادى ....هنفديها لو كان مين<br />اخوكم/ سعيد الشربينى...<br />زجال بلا حدود"
