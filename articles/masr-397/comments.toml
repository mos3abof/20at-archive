subject = "اسلوب سيء جدا في الحوار"
author = "محمود"
posted = "2006-06-20"
text = "للاسف الاسلوب في الحوار سيء جدا بين اتهامات للعمالة مع امن الدولة و بين ان هذا الشخص نصراني ...لا يصح اطلاقا لمجرد ان هذا الشخص يختلف مع فكر احد ان يتهم بهذه الاتهامات و حقيقة السيد محمود جابر في البداية اعتقد انه لم يخطيء فقد قال سوف ادرسها..انا شخصيا اختلف مع فكر الاخوان و اعتبر ان لهم سقطات و لهم مواقف وطنية ...إذا ظللنا دائما لا نرى سوى انفسنا فصدقوني لن ننتقل ابدا خطوة واحدة للامام."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170448/http://masr.20at.com:80/article.php?sid=397"

