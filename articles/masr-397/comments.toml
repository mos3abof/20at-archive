posted = "2006-06-25"
text = "بداية انا وجهتى اسلامية عشان ميطلعش حد من اخونا الاخوان يتهمنى انى حزب وطنى ولا علمانى من المارقين ولايمكن رفعت السعيد وباكتب باسم مستعار نخش فى الموضوع لازم يحصل تغيير جذرى فى الارطار التنظيمى للحركة الذى لم يتغير من ايام الاربعينات لتكون الحركة اكثر ديموقراطية وشبابية واكثر مرونة ولكن بالرغم من سلبيات الاخوان فشعبيتهم كبيرة جداا وباشارة واحدة من مرشدهم بنزل اتنين تلاتة مليون واحد فى الشارع ويخلوها ضلمة على الحاج ابو جمال ولو معملش الاخوان كدهجيمى باشا هيخدنا وراثة وساعتها والله نبقى شعب هفأ اوى يعنى هو واابنه"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170448/http://masr.20at.com:80/article.php?sid=397"

