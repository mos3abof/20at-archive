posted = "2006-06-04"
text = "كل الشكر لكمعلى تقديمكم هذه الوثيقة الهامة والفريدة والجديدة.<br />ورغم اننى كاتب متخصص فى جماعة الاخوان المسلمين غير انى لااستطيع ان ابدى رائىفى هذه الوثيقة دون دراستها ومعرفةىمدى صحتها غير انى استطيع ان اقول ان هذه الجماعة تحتوى من التناقض والبتجانس والتنافر سواء مع نفسها او الاخرين او العالم او الايديولوجيات ما يستحق ان نسميه مراكمة التناقضاتالتى اول لها من اخرحتى انهم كل يوم لهم ولمرشدهم واعضاء مكتب الارشاد لهم من المفاجات مانعجز علىعلى تصديقة فى النهايه تحياتى لكم .<br />ma_alnor2000@yahoo.com<br />محمودجابر"
