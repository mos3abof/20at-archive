[[comments]]
order = 5
subject = "لا بد من إحترام الدستور"
author = "مصرى"
posted = "2006-05-29"
text = "يا أخوانى الدستور لا زم يبقى محترم لأنه عنوان للدولة ومبادئها وكيفية التعايش فيها وأنا أحترم فكر الإخوان المسلمين ولكن لا يعجبنى قنوطهم أحياناً فكيف لأصحاب فكر منظم وتأييد شعبى كبير وترابط كبير فيما بينهم يرتضوا لنفسهم الفساد الموجود فى مصر وأن يعتقل كل يوم أعداد كبيرة ويكون ردهم مجرد إعتراض كلامى لا بد أن يعرف الحاكم قدر الإخوان فى نفوس المصريين وتأييدههم لهم ولا بد أن يعرف الشعب والإخوان أن حسنى مبارك حاكم غير شرعى فالدستور ينص على أن الحاكم يأتى للحكم بالإنتخاب وهو لم يأتى بالإنتخاب ومزور للإنتخابات فماذا تخشون من حاكم محتل للسلطة ناهب لثروات مصر كلها يا أخوانى كل الدول تعاقب مثل هذا الحاكم وتسأله عن فساده ومصر نائمة لم يسأله أحد عن رصيده بالمليارات ومن أين أتى به وهل لو كان جلس فى بيته كان سيصل إلى هذا الرصيد هو وأولاده وزوجته لا بد أن يعاقب على بطالة الشعب وعلى بيع أملاك الشعب لا تتركوه أكثر من ذلك يذل الشعب الذى حملكم أمانة الكلمة فى الإنتخابات الأخيرة التى كان من الممكن أن يكتسح الإخوان كل المقاعد لولا البلطجة والتزوير للحزب الوطنى أرجوا أن تكونوا صوت الشعب وضميره بأمر الله وطاعته"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135629/http://masr.20at.com:80/article.php?sid=397"

[[comments]]
order = 6
subject = "والاقباط برضه يا مصرى"
author = "زنوبه"
posted = "2006-05-29"
text = "يا آخ مصرى<br />مش الاخوان بس اللى مقصرين ناحيةوجود حاكم غير شرعى مغتصب للشرطه ـ كمان الاقباط مقصرين يشتكون آنهم غير موجودين على الساحه السياسيه وفى نفس الوقت لا نسمع صوتهم فى المشاركه الشعبيه تجاه ما يحدث فى مصر المحروسه بل تجدهم آول من يجرى ويختيىء ـ طيب عايزين إيه يعنى نعزم عليكم المشاركه وآستثنى هنا الناشط القبطى جورج إسحاق وهو رجل آكن له كل الاحترام<br />آما شريكنا فى المواطنه المدعوا بباوى الذى آغرق القاهره بلوحه للسيد الرئيس تشبه لوحات مهرجين السرك القومى بالحجم الطبيعى فلا تعليق.<br />نحتاج الى مشاركة الاخوان والاقباط آيضا حتى لا نكرر غلطة عبد الناصر عندما آستبعد الاقباط من مجلس قيادة الثوره ومن هنا بدءات شرارة التمييز الطائفى وتناسينا نحن والاقباط آن الحكومه آيان الحكم الملكى كان بها وزراء آقباط مثل مكرم عبيد<br />مع تحياتى<br />زنوبه"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135629/http://masr.20at.com:80/article.php?sid=397"

[[comments]]
order = 7
subject = "الاخوان وفقدان المشروع"
author = "الاخوان تائهون ولا يعرفون مايريدون ، فمرة مع حسني ومرة ضد حسنى وهكذا كان شأنهم من قبل مع زعماء مصر الهالكين ، فهم في حيرة من أمرهم فهل هؤلاء الزعماء ولاة أمر يتعبد الله بطاعتهم أم مغتصبون يتعين الخروج عليهم ."
posted = "2006-05-29"
text = "غاية الامر إن الاخوان تائهون ولا يعرفون ما يريدون هل يريدونها ديمقراطية واحزاب أم خليفة وخلافة ، أما ماذا ؟<br />لذلك على شباب مصر أن يضرب صفحا عن سياسة الاخوان ولا يعيرهم في هذا الشأن أي أهتمام، ففاقد الشي لا يعطيه ، وليعلم شباب مصر أن حسني مبارك لا تجب طاعته شرعا بل يجب الخروج عليه لانه ارتكب الكفر الصراح البواح وأي شي أعظم من مولاة الكافرين على المؤمنين ، وما كان لبغداد وكابل أن تسقطا لولا خيانة حسني وغيره.<br />لذلك على شباب مصر أن ينضم الى حركة كفاية ويسقط الديكتاتور ويقيم دولة المؤسسات."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135629/http://masr.20at.com:80/article.php?sid=397"

[[comments]]
order = 8
subject = "الإخوان أقدر على تحقيق الديمقراطية الحقيقية"
author = "محمد مصطفى"
posted = "2006-05-29"
text = "كل يوم يثبت الإخوان بالعمل وليس بالقول فقط قدرتهم على تحقيق الديمقراطية لمصر وللمصريين المسيحيين والمسلمين.. والأمثلة علي ذلك كثيرة .. مثل معارضتهم القوية في مجلس الشعب.. ووقفتهم مع القضاة.. وكل هذا يثير الدولة والحكومة الفاسدة التي تحاول التعتيم على نشاطهم وتزج بهم في السجون..<br />على فكرة آخر هتاف هتف به الإخوان كان ..<br />احنا مين .. احنا مين.. احنا كل المصريين.. المسلمين والمسحيين<br />وذلك بدلاً من الهتاف السابق الذي كان يقتصر على ذكر .. احنا الإخوان المسلمين<br />ربنا ينصركم مع قوى المعارضة في القضاء على هذا الاستبداد"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135629/http://masr.20at.com:80/article.php?sid=397"

[[comments]]
order = 9
subject = "لا بد"
author = "من مصر"
posted = "2006-05-29"
text = "فى هذه الفترة نحن فى حاجة إلى إنضمام كل فئات الشعب سواء الإخوان المسلمين أو سواء كفاية أو سواء مصريين أحرار محتاجين إلى كل القوى ولا بد أن نكون كلنا قوى واحدة حتى نكون مؤثرين وبعد الخلاص من هذا الفاسد سوف نتناقش فى كيفية سير الحياة فى القيادة وأكيد الشعب هو إللى ها يختار لكن ميصحش دلوقتى نتناقش فى أمور ممكن أنها تضعف قوتنا وأحنا محتاجين نكون كنا أيد واحدة لأن سياسة حسنى مبارك هى فرق تسد فى المجتمع حتى يستطيع السيطرة على الشعب ولا تكون أى قوى تشكل قلق بالنسبة له وهى نفس سياسة المستعمر ونحن فى حاجة لكل فئات الشعب ولكل الجمعيات ولكل المعارضة علشان نقدر نزيح العدو ده ونطهر مصر منه اللهم آمين يارب وبرضوا ها أقول محتاجين بس قيادة لتنظيم الأدوار وإرادة الشعب هى إللى ها تتغلب اللهم آمين يارب المستضعفين"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135629/http://masr.20at.com:80/article.php?sid=397"

[[comments]]
order = 10
subject = "لا تبالغوا في مراعاة النصارى"
author = "أخواني أهل مصر الحبيبة -حصن الاسلام المنيع - لا تبالغوا في مراعاة النصارى و مشاعر النصارى ، فالنصارى مهما بلغوا فهم أقلية في مصر ."
posted = "2006-05-29"
text = "وليكن جل اهتمامكم بشباب مصر من أهل الاسلام ، فأنتم دولة مسلمة ، ولابد للدولة المسلمة أن تحكم الشريعة شاء النصارى ذلك أم أبوا ، ولا يفهم من كلامي أن أدعو الى ظلهم ، فالظلم عندنا -أهل الاسلام - حرام ، وانما أدعوا الى عدم الاكثراث بهم في تحديد خيارات الدولة العامة ، فليس لهم الا اتباع أهل الاسلام سواء عن طاعة أو أكراه."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135629/http://masr.20at.com:80/article.php?sid=397"

[[comments]]
order = 11
subject = "الاخوان دائما فى الصدارة"
author = "ياسر ابو سمية"
posted = "2006-05-29"
text = "الله عليكم يا اخوان ،والله الواحد مش عارف البلد بتاعتنا دى من غيرهم كان حصل فيها ايه ،لابد ان تسمح الحكومة للجماعة بالعمل العلنى لخدمة البلد والا قل على مصر السلام .هل منطقى يا جماعة ان ناس عندها التصور ده من الفترة دى ويتهمهم بعض المدعين بانهم لا يحملون مشروعا سياسيا او برنامجا للحكم .اطالب كل اخواننا المدعين بالصمت والتقاط الانفاس فالمسيرة لن تتوقف رغم ان البعض يقف لها بالمرصاد ."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135629/http://masr.20at.com:80/article.php?sid=397"

[[comments]]
order = 12
subject = "مشروع الاخوان السياسي"
author = "أطالب الاخ الذي قال أن الاخوان يملكون مشروعا سياسيا واضحا المعالم بتبان هذا المشروع في نقاط محددة 1، 2 ، 3 ..."
posted = "2006-05-29"
text = "وماهي وسيلتهم في تحقيق هذا المشروع ، أهي الانتخابات التي يسيطر عليها الديكتاتور ، أتظن -يا مسكين بأنك سنفوز بانتخابات تجري تحت عين الديكتاتور وسمعه؟؟!!<br />ثم أين الاخوان الان من تحقيق المشروع ،المرحلة الاولى ، الثانية ، الثاثة ؟"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135629/http://masr.20at.com:80/article.php?sid=397"

[[comments]]
order = 13
subject = "الاخ اللي فوق0000"
author = "الاستاذشيكو"
posted = "2006-06-02"
text = "يا عمنا الاخوان المسلمين الفوا كتب في المواطنه وحق الاقليه والدين والدوله والعلاقه بينهم ايه ؟!!!<br />ايه الحكايه فيه مؤلفات كتير للمورشدين السابقين او حتي لاعضاء في الجماعه اللي مش محظورة<br />عاوزين ايه بقه ؟!!!<br />الكلام بتاع الاخوان سواء كان صح ولا غلط او اي فصيل سياسي من اول ايمن نور الي الحزب الوطني كلهم كده علي بعض ينزلوا الانتخابات والناس هي اللي تختار لو فيه نيه كويسه<br />وكل واحد يشرح وجهه نظرة ةيفند وجهه نظر غيرة<br />بااااااقول كلهم حتي لو كان فيه حزب مسيحي مادام الناس اللي عاوزة كده يبقه وماله<br />لو وصل الحال بالناس في مصر انهم ينتخبوا واحد مسيحي وده مش هايحصل ابدا<br />بس لو حصل يبقه هما اللي يستاهلوا اللي هايجرالهم وبكده مش هايكونوا مسلمين علي فكرة<br />سواء كان المسلمين دول اخوان ولا نااااس عاديه ولا غيرهم<br />ومعروف انه مافيش اقليه بيحكم الاغلبيه في اي بلد"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135629/http://masr.20at.com:80/article.php?sid=397"

