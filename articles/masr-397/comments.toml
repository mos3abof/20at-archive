[[comments]]
order = 28
subject = "شكرا لكم جميعا محمود وابن العضو الاخوانى"
author = "محمودجابر"
posted = "2006-07-01"
text = "الحمد لله والصلاة والسلام على اشرف خلقه وآله ومن اتبعهم الى يوم الدين.<br />بدأيتا انا المدعو/محمود جابر الذى اتهمتموه بالمسيحية او النصرانية او القبطية،لايهمفهذه شيمكم وسجيتكم<br />ان تكفروا كل من يختلف معكم وان تتلاعنو اتعلمون لماذا؟؟؟؟؟؟؟؟؟؟؟؟<br />لانه صلى الله عليه وسلم قال فى حديثه:<br />سياتى اخر الزمان قوم يلعن اولهم اخرهم<br />احسب انهم انتم.<br />اصدقائى زعماء الوهم(الاخوانى).<br />البنا قال فى حق السندى واحمد عادل قديما انهم ليسو اخوانا وليسوا مسلمين<br />السندى يحتل المركز العام 1954ويحارب الهضيبى(الذى عينه الملك مرشدا لكم)ثم يقتل السندى المهندس سيد فايزبالدناميت الذى وضعه فى علبة الحلوة وارسله اليه .متى؟؟ فى المولد النبوى الشريف..<br />احب انا اقول لكم ماذا فعل الترابى فى السودان وماذا يفعل الان..<br />اصدقائنا بارك الله فيكم...<br />الذين يسبو النصارى (المسيحيين)<br />اما انهم لا يقتنعون بما يكتبه المرشد عاكف او نائبيه او العريان وابو الفتوح والشاعر .<br />واما ان الذى يكتبه كل هولاء ماهو الا خداع ارجو الاجابة؟<br />شكرا للاخ محمود الذى فهم ما كتبت<br />وبارك الله فى الاخ ابن النائب الاخوانى<br />واقول له حسنا فعل ابوك فقد رباك.<br />اما جوابى على مشروع الدراسة فهذا سوف اكتبه فى موضوع جديد منفصل .حيث اننى بعون الله ربىقد انتهيت من دراسته<br />وشكرا لالاخوة الذين سبونى فقد منحونى حسنات كنت فى اشد الحاجة اليها وما زلت .<br />فهل من مزيد؟؟؟؟؟؟؟؟؟؟؟؟<br />محمودجابر<br />ma_alnor2000@yahoo.com"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117140844/http://masr.20at.com:80/article.php?sid=397&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 29
subject = "مراحل -مراحل"
author = "الاصيل"
posted = "2006-07-08"
text = "الاخوان يتكلمون عن الاقباط كما لو انهم اناس جاؤا من كوكب اخر.ونسوا انهم مصريين ولاد البلد دى.ولا يروا الا انفسهم.هم وبس.وهذا لان الاقباط (المستضعفين دائما)ليس لديهم جهاز سرى للاغتيالات. بما ان الاخوان وحدهم الذين يعرفون الله ولا احد سواهم؟؟؟؟؟؟ فهم يتكلمون باسم الله.انتم تقولون ان الاقباط ليس من حقهم الاعتراض على اى شىء يمنح لهم.ويحمدوا ربهم على اللى هم فيه.ياعينى على النعيم اللى بتوعدوا به المسلمين المصريين .صدقونى .اللى يرضى ان غيره يهان ويسكت بكره الاخوان تلبس الرجاله كمان الحجاب.ياحبيبى انت وهو فيه حاجه الدنيا كلها تعرفها اسمها حقوق الانسان.والوطن ده مش بتاعكم انتم بس .واذا كان الاقباط انزووا فى كنائسهم ولم يقاموا الظلم الساداتى .الان اصبح مافيش مجال الى ده. الان لازم يقاوموا كل فكر وكل كلام ينتقص من حقوقهم .ويدخلوا النضال ضدمبارك وضد الاخوان فى وقت واحد .حتى لا ينفرد الاخوان بالشعب .وقت العمل والجد جه وكفايه تسيب غيرك يحارب لك.ما حك جلدك مثل ظفرك.لان الفاشيه الدينيه لن تترك مجال لاحد بعد ذلك ان يطالب بديمقراطيه بعد ما يقعدوا على المصطبه .ويجزوا رقاب المعارضين.ولكم فى الزرقاوى اسوه حسنه.!!!!!!"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117140844/http://masr.20at.com:80/article.php?sid=397&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

