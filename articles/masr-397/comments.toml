text = "أرجو أن نكون أكثر ثقة بدينا وبالمسلمين ويرحم الله حسن الينا عندمابدأ دعوته من على المقاهى وكان يؤمن أن الشعب فى حقيقته معتز بدينه و لكن يحتاج الىالقائد الشفوق ثم لو وضعنا الأمور فى نصابها يكون انتخاب غير مسلم لرئاسة الدولة أمر مستحيل وانتخابات مجلس الشعب دليل ؛ مع كامل احترامنا لكل مواطن مصرى"
