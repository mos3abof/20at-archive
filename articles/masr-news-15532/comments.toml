text = "انتم بتتظاهروا علشان المسجد الاقصى وضد اسرائيل - يعنى ضد حلفاء النظام وحبايب النظام - هو المسجد الاقصى كان بتاع ابوكم وانتم مالكم - هيسلط الامن المركزى يفرمكم"
archived = "2010-03-03"
capture_url = "https://web.archive.org/web/20100303020400/http://www.20at.com:80/masr/news/15532-2010-03-01-12-35-22.html"

