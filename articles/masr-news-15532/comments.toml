author = "مبتسم"
posted = "2010-03-01"
text = "لما سودت النهار يا استاذ ياللي فوق<br />وليه بس زعلان … علشان تظاهرنا مع الأقصي ضد اليهود ؟!!!<br />يا أستاذ أولا لو مش مصدق انك حتقابل ربنا ويحاسبك علي كل حاجة عملتها في حياتك وكل كلمه قلتها او كتبتها … صدق<br />ثانيا الأقصي ده بتعنا ولا انت ما تعرفش ان مسجد للمسلمين وهو عقيدة مش مسجد في فلسطين والسلام ولا نسيت ان حاكم مصر قبل كده هو اللي حرره من الصليبين .<br />الله يسامحك ويهديك"
archived = "2010-03-03"
capture_url = "https://web.archive.org/web/20100303020400/http://www.20at.com:80/masr/news/15532-2010-03-01-12-35-22.html"

