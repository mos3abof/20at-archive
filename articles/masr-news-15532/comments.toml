author = "الى مبتسم"
posted = "2010-03-02"
text = "انت ناسى ان عدو اسرائيل هو عدو حسنى واولادة<br />واسرائيل بتحارب الفلسطنيين وحماس وحزب اللة وتحاصرهم وتجوعهم<br />يبقى حسنى لازم يشارك فى الحصار ويقفل المعابر ويعمل الحائط الفولاذى واللى يساعدهم يعتقل ويسجن ويضرب<br />يبقى الطلبة دى لازم يضربهم ويطلع ميتين اهلهم<br />فبلاش تفاؤل"
archived = "2010-03-03"
capture_url = "https://web.archive.org/web/20100303020400/http://www.20at.com:80/masr/news/15532-2010-03-01-12-35-22.html"
