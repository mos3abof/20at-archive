[[comments]]
order = 2
subject = "الغضب"
author = "مصري"
posted = "2006-03-03"
text = "(( أقرب ما يكون الشيطان إلى العبد المؤمن لحظة الغضب )) رسول الله (ص)<br />الغضب: هو حالة نفسية، تبعث على هياج الإنسان و ثورته قولاً أو عملاً، وهو مفتاح الشرور و رأس الآثام.<br />بواعث الغضب: قد يكون الغضب منشأ الغضب انحرافاً صحياً، كاعتلال الصحة العامة، أو ضعف الجهاز العصبي، مما يسبب سرعة التهيج العصبي. و قد يكون المنشأ نفسياً، منبعثاً عن الإجهاد العقلي، أو المغالاة في الأنانية، أو الشعور بالإهانة و الاستنقاص، و نحوها من الحالات النفسية التي سرعان ما تستفز الإنسان، و تستثير غضبه. وقد يكون المنشأ أخلاقيا كتعوّد الشراسة، وسرعة التهييج مما يوجب رسوخ عادة الغضب في صاحبه.<br />الغضب غريزة هامة، تلهب في الإنسان روح الحمية و الإباء و تبعثه على التضحية و الفداء، في سبيل أهدافه الرفيعة، و مثله العليا، كالذود عن العقيدة، و صيانة الأرواح و الأموال و الكرامات، ومتى تجرد الإنسان من هذه الغريزة صار عرضة للهوان و الاستعباد، ولكن هذا الغضب يعتبر غضباً محموداً ما دام لله و ضمن ضوابط العقل والشرع، و يعتبر مذموماً إذا أفرط فيه الإنسان و خرج عن الضوابط الشرعية.<br />نستنتج من ذلك: أن الغضب المذموم ما أفرط فيه الإنسان و خرج به عن الاعتدال، متحدياً ضوابط العقل والشرع، أما المعتدل فهو كما عرفت، من الفضائل المشرقة التي تعزز الإنسان، و ترفع معنوياته، كالغضب عن المنكرات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123356/http://www.20at.com/article2.php?sid=338"

[[comments]]
order = 3
subject = "خليك بارد"
author = "مؤمن"
posted = "2006-05-23"
text = "بسم اللة رحمن الرحيم<br />انا لية واحد صحبى كان بيحب بنت كان فترة مرهقة صبوة بعض بعد كدة تحول صحبى الى شخص تانى غريب بسى الى اسوق احال حاجة اكتشفتها فية بعد تغير هوة بارد جدا وحتيت اعصابة فى تلجة اقال حاجة ممكن تروح عندة فى بيت ويعرف انت مستنية تحت بيت يسبك سعتين بعدين ينزل ولكنى فى حد كان مستنية<br />مهم اهم حاجة بتبقة بارد فى كل حاجة يعنى لوعندك مشكلة معينة استغفر ربنة وبتفكرشى فى مشكلة فكر فى اى حاجة تانية وحول تسبت لنفسك اكنى مفيشى مشكلة طبعان صعب فى الاول لكن هتعود على كدة وحدة بوحدة<br />لو ببقشى بارد مشى هتعرف تعيش صدقنى حياة حلوة بسى سبها تجى زى متجى من غير تفكير فى حياة كان فى مسال بقوال بتجى تكلم مع بنت وطلع من كلمة غلط متفكرشى فيها قوال انا لسة بتعلم بتندمشى على اى مشكلة حصلت او هتحصل اعرف انا دة اختبار من ربنة ودة سنت حياة عشان تعيشى لزم تكون بارد وربنة يوفقكم ويرب تكون نصيحةتفدكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123356/http://www.20at.com/article2.php?sid=338"

