[[comments]]
order = 0
subject = "لهبهوب و لكل العشريناتيه دوزن اعصابك"
author = "نيفين"
posted = "2006-02-22"
text = "زمان يا جماعه قرات مقاله كان عنوانها دوزن اعصابى و رغم ان الكاتبه مش معروفه و مش من الكتاب بتوعى اللى بقرالهم على طول استوقفنى العنوان<br />و كملت المقال و كان رائع الكاتبه بتقول دوزن اعصابك بمعنى<br />فى الموسيقى لما نقول دوزن اله الكمان او الجيتار دا معناه خلى الاوتار فى حاله وسط بمعنى<br />متخليش الاوتار مرخيه اوى و لا مشدوده اوى علشان النغمات تبقى مظبوطه مش نشاز<br />و الانسان كده يعنى خليك وسط و خلى مودك وسط متفرحش اوى و متزعلش اوى<br />خلى انفعالاتك وسط<br />بمعنى اخر لا تكن لينا فتعصر و لا صلبا فتكسر<br />و دى نصيحه بيقدمها دايما الدكاتره النفسيين<br />يللا روشته ببلاش اهى<br />ايديكو بقى على الفوزيته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123356/http://www.20at.com/article2.php?sid=338"

