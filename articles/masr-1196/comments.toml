[[comments]]
order = 3
subject = "بلال ونجيب محفوظ .. شنح وزين الدين زيدان"
author = "كابتن بحة"
posted = "2006-11-23"
text = "وفي النهاية بعد عمر طويل سيقول الناس عن بلال فضل أنه صنع سينما جيدة.. بغض النظر عن أن هناك أفلام كانت إيراداتها ضعيفة أو هاجمها الجمهور.. الحساب يجمع في الآخر.. سواء في الكتابة للسينما أو للصحافة..<br />اعتقد انه بعد عمر طويل بإذن الله محدش هيفتكر اساسا من هو بلال فضل .. يراجل بمجرد ما النور يولع فى السينماالواحد بينسي لافيلم كان بيقول ايه .. وده مش فى افلامك انت بس .. فى اغلب الافلام المعروضة اليومين دول<br />ونجيب محفوظ – الله يرحمه – رغم أنه أديب عظيم وكاتب عبقري وحصل على نوبل.. لكنه رغم ذلك لم ينل إجماع الجميع عليه.. وسيظل الناس منقسمين حوله وحول أعماله.. وأنا لا يهمني الإجماع.. والإنقسام حول أعمالك هو دليل نجاح بشكل حقيقي<br />يا عم بلال وحد الله وصلى على النبي فى قلبك ، بتقارن نفسك بنجيب محفوظ ؟! طيب انا راضى ذمتك ينفع نقارن شنح مثلا بزين الدين زيدان ، أو زكى بعرورة برونالدنهو؟!<br />يا اخ بلال رحم الله مؤلفا عرف قدر نفسه"
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195941/http://masr.20at.com:80/article.php?sid=1196"

