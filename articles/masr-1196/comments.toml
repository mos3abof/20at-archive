subject = "عمده سكان مصر الاصليين"
author = "غيبوبه"
posted = "2006-12-07"
text = "ازاى تكون كتاباتك فى الدستور بالروعه دى وانت بتقول انها\" تحت ضغط\" ربنا يستر على الاستاذ ابراهيم عيسى و يفضل يضغط اكتر و اكتر<br />بالمناسبه<br />اكيد زكى الدبور ده احد ذيول عبد الله كوكو المخبر و كرم جبر - يلمهم كلهم قولوا امين<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأمين"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045021/http://masr.20at.com:80/article.php?sid=1196"

[[comments]]
order = 22
subject = "من زكى الدبور"
author = "iهو كل واحد فى البلد دى يقول الحق يخرج الكلاب السعران ترهبة."
posted = "2006-12-09"
text = "البراء احمد صاحب الحوار بلال انعم علية بسبوبة فى الدستور عبارة عن صفحة كاملة مسروق مادتهاملطوشة من الانترنت، حتى صورة البراء فيها عايش دور بلال فضل بشحمة بلحمة بصداغة، بس المشكلة لو كنت اتهمت مصطفى بكرى انة شاذ جنسيا هل كانت ادارة الموقع هاتحذفة؟؟؟؟؟؟؟؟؟؟<br />وبعدين بلال بيشكونى الى اللة،مين يصدق ،ان بلال فضل عارف ربنا طيب يلسى بلال اتقى اللة وعالج نفسك من شذوذك الاول، دا حتى كريم عبد العزيز اتجوز هربا منك."
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045021/http://masr.20at.com:80/article.php?sid=1196"

[[comments]]
order = 23
subject = "رموززززززززززززززززززززز"
author = "رموزززززززززززززززززززززز"
posted = "2006-12-09"
text = "السلام عليكم ورحمه الله يا سادة بلال او حمدى رزق او غيرهم دول كتاب دى حاجه الكاتب لما بيكتب بيبص لو لاقك فرحان بوساخه الطرب يكتبلك امال لو احترمك وكتابلك اللي هو في دماغه بادب انت مش هتتقبله<br />لانكم واخدين علي هبوط الفن المصري صعب العرب يمثلوا فن راقي لالاسباب كونها ان الفن الان جسد عاري فنانه بدرجه عاهرة تجيد ابهاج المنتج والمؤلف والمخرج والبطل ما اظنش بنت محترمه هتمثل مشهد جنس ابدا"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045021/http://masr.20at.com:80/article.php?sid=1196"

[[comments]]
