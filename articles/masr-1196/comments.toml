subject = "المنتفعون"
author = "السيد احمد السيد"
posted = "2006-12-15"
text = "بلال فضل من وجهة نظري هو احد فرسان النفعية في مجال الصحافة استطاع ان يركب الموجة ويحصل علي ما يريد فهو من ناحية المواطن البسيط فارس يقول لا للنظام ويدبج المقالات التي تسب النظام فيتعاطف معه المواطن البسيط ومن ناحية اخري قام بتاليف العديد من السيناريوهات الضعيفة بهدف الربح المادي انا لا يعجبني هذا التناقض<br />باختصار انا لا اصدق بلال فضل عندمايحررويكتب مقاله الذي هو بعرض صفحتين في جريدة الدستور واراه يأخذ اكبر من حجمه."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217235429/http://masr.20at.com:80/article.php?sid=1196"

