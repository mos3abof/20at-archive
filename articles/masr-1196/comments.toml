posted = "2006-12-12"
text = "الخلاصة يا بلا ل انت غلطان انك كلفت خاطرك ورديت على الاقزام 0وللاسف هما من بلدك واحنه عارفين انت اد اية بتحب بلدك00الامل اللى ارسلتة فى الدستور لالاف القراء والبسمة التى صنعتعها لتغسل الهموم والاحزان وشعاع الامل الذى تبعثة بان بكرة احسن00كل هذا كفيل بان تكون واحدا من مبدعى مصر الحداث00تحياتى لك"
archived = "2006-12-13"
