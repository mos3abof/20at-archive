text = "انا طول عمرى اعرف كلمةلا الصادقة الواعيةلكن بلال فضل و ابراهيم عيسى جعلونى ولاول مرة اعرف لا (السبوبة)لا بمعنى النفعية بلال فضل اللى بيكلم على ائمة المساجد انهم ايام حرب لبنان بيكلمونا على المناطق المظلمة الرطبه كان الفارس بيحضر(للوليد الذى طال انتظاره)اول فيلم سعودى"
