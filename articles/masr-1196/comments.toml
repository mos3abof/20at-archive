[[comments]]
order = 0
subject = "اوسكار بلال فضل"
author = "زكى الدبور"
posted = "2006-11-22"
text = "بلال فضل واحد ممن دمروا صناعة السينما فى مصر بالعديد من تفهاتة السينمائية، وقصة صعودة ليست مفاجئة ، فهو تلميذ حمدى رزق فى استغلال الاحداث للقفز للامام ويكفى انة طرد شر طردة من جريدة القاهرة وسالوة لية ؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />ايضا معروف ان لدية ورش عمل لكتابة السيناريوهات يعمل فيها العديد من الكتاب الشباب، ايضا البية الى عاملى فيها وطنى راكب جراند شيروكى بالسائق ويسكن فى فيلا فى المعادى ، وبياخذ 250 الف جنيها فى السيناريو الواحد."
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195941/http://masr.20at.com:80/article.php?sid=1196"

[[comments]]
order = 1
subject = "أيه الحقد ده"
author = "شريف الدواخلى"
posted = "2006-11-23"
text = "بصراحة انا بجد مش عارف إيه الحقد ده .<br />انتا مالك الراجل بياخد كام فى السيناريو وبالمناسبة الرقم غلط !<br />المهم ماعلينا كلامك على استاذى \"بلال فضل \" لا اساس له من الصحة فهو خريج قسم الصحافة باعلام القاهرة ةكان حائزا على المركز الاول فى الترتيب وعشان الجنسية مش اتعين ! يعن كان متفوق ! المهم ماعلينا الراجل قرر انه يخش مجال السنة فدرس الاول \" يعنى مش هيصة \" وادخل نقاية السينمائيين وبدء سكة السيناريو وكان فى الاول متعسر وده عادى وبعد كده فعلا بقى محترف \" قد نختلف معه فى بعض الاراء لكننا لن نختلف أنه موهوب\" بس مشكلته اللى يمكن محدش كتير يعرفها أنه حريص شوية وده حقة طبعا .<br />ومعنى أنه متربع على عرش السيناريو أنه فعلا حد موهوب وجدا كمان والدليل نسبة مشاهدة افلامه ولولا انها ناجحه مكنش خد الارقام الفلكية اللى بياخدها وده حقه لانه بياخد حق تعب وقراية وتفريغ وقت ...<br />بجد أستاذ بلال قد أختلف معك فى الاليات ولكنى لن اختلف مع فى الغايات \" وانتا قارينى بقى \" ! وبجد مش هاقلولكم غير موتوا بغيظيكم !"
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195941/http://masr.20at.com:80/article.php?sid=1196"

