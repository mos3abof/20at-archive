posted = "2006-11-29"
text = "يا جماعة لازم نحترم موهبة كل انسان ... يعنى مثلا النصاب والحرامى موهبين بس موهبة لا مؤاخذة ... وكمان الرجالة بتوع الحكومة موهوبين بس بر دوا لا مؤاخذة ... وبلال بردوا موهوب بس لا مؤاخذة ... بس كل موهبة وليه الامؤاخذة بتاعتها وسلملى على المترو ... صباح الفل ههههههههههههههههههههههههه"
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195941/http://masr.20at.com:80/article.php?sid=1196"

