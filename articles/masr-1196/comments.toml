[[comments]]
order = 18
subject = "رائحة اقدام بلال فضل"
author = "بالوظة"
posted = "2006-11-30"
text = "كان كل العاملين بروز اليوسف ومن بعدها دار الهلال يعرفون ان بلال فضل وصل من شيئين الاول رائحة اقدامة التى لايمكن لادمى تحملها من على بعد عدة كيلو مترات ، والثانى من رائحة سندوتشات الطعمية التى كان يعشقها بلال ، ناهيك عن رائحة عرقة النفاذة نتيجة القمصان الالياف الصناعى التى كان اول من يرتديها بمجرد نزولها( العتبة).<br />سار بلال فضل مع القطيع دفاعا عن اكبر كذبة وهى (التنوير) فى مواجهة قوى الظلام وكان بلال ملكى اكثر من الملك فشتم السعودية وقال عنها بالحرف الواحد فى مقال مكتوب(اطهر ارض وانجس شعب) وبعد سنوات كان خدام لهم فى كتابة السيناريوهات ، وسب فهمى هويدى ،وبعد سنوات انكر ذلك ، وحاول ان يلعب على صلاح عيسى ويركب الموجة ففشل وطرد من القاهرة شر طردة ، ولعن هيكل ولان ينفى ذلك ، وصادق النجوم ليصل لما هو فية الان ، وقال عن مفيد فوزى انة( لم يختتن).<br />بلال فضل رمز لانهيار الفن المصرى وقيم السينما المصرية مثلما ينهار كل شيى فى مصر الان ، واتمنى ان يقول لنا بلال هل صحيح انة سبب طلاق كريم عبد العزيز من زوجتة الاولى بعد ان ظبطتهم معا فى سرير واحد بدون .............الخ"
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195941/http://masr.20at.com:80/article.php?sid=1196"

