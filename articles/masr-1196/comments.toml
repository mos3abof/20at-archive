text = "اعتقدانه لو فيه كاتب المفروض الواحد ينيبه عنه ليفش غله ف الحكومه واللى عاملاه فينا فلا شك ان هذا الكتاب لن يكون الا بلال فضل ..له اسلوب يجعلك تشعر وكانك قاعد معاه ف البدروم ف الضلمه وبتلعنوا فى سلسفيل الحكومه انا فى راى ان ليس هناك احد من الكتاب او الادباء ملا فراغ المازنى رحمه الله سوى بلال المهم اللى خايف منه ان يحدث لبلال مايحدث لمعظم معارضينا فى الوطن العربى الاوهو بعد ما كاتنوا كدة اتقلبوا كدة الدنيا صعبه يا جدعان والنفس امارة بالسوء نسال الله الثبات لبلال مؤذن المعارضة المصرية"
