[[comments]]
order = 14
subject = "شكرا ياحاج براء"
author = "بلال فضل"
posted = "2006-11-29"
text = "ياعزيزي براء شكرا على هذا الحوار الجميل ونشرك له في مدونتك وفي عشرينات ايضا ده أكتر بكتير من حقي<br />وشكرا لكل الذين علقوا عليه بالسلب أو بالايجاب.. اشكر كل من قال في حقي كلاما طيبا واشكر كل من هاجمني لأن أفلامي لاتعجبه وأتمنى أن يكون شاهدها فعلا ولم يأخذ عنها بالسمع وهي فيها الجيد وفيها المتوسط ليست كلها على خير مايرام وهذه هي حال أي كاتب سيناريو في بلادنا من أكبر اساتذتنا إلى أصغر زملائنا.. وكما قال عنوان الحوار الحساب يجمع في النهاية.. على الأقل لي أفلام افتخر أنها اعجبت الملايين مثل ابو علي وكي جي تو وواحد من الناس وصايع بحر والباشا تلميذ وعودة الندلة وخالتي فرنسا.. ولازال لدي الكثير..<br />أما الذين شتموني فشكرا لهم لأنهم زادوا من حسناتي وأنا منذ أكرمني الله ونجحت أصبح من واجبي أن أتقبل كل رأي الناس فيا..<br />ومع أنني لاأتدخل في رأي الناس لكني يهمني تصحيح المعلومات لكي لايظن أحد أنها حقيقية.. اتشرف بزمالة حمدي رزق في مجلة المصور لكنه لم يكن أبدا استاذي لاهو قال هذا ولا أنا قلته.. أنا اساتذتي المباشرون هم محمود عوض وابراهيم عيسى ورجاء النقاش ومحمود السعدني وصلاح عيسى وفهمي هويدي وتلمذتي على أيديهم ليست سرا أبدا بل أنا أفتخر بذلك وهم أيضا كتبوا ذلك وقالوه.. أنا لم أطرد من القاهرة أبدا ولو كان ذلك حدث لكان شرفا لي.. أنا استقلت ونشرت استقالتي في الصفحة الأولى وقد اخترت وقتها أن أتفرغ لكتابة السيناريو بعد أن اكتشفت أن الجريدة كان يقرأها وزير الثقافة قبل الطبع على عكس ماقيل لناعندما ذهبنا للعم فيها.. ومنذ تلك اللحظة وأنا أعاني على مدى سبع سنوات من العرق والتعب والعمل والسعي لاسعاد الناس حتى صرت واحدا من أكبر الكتاب أجرا وهذا يشرفني ويسعدني وبالمناسبة ماآخذه من أجر أعلى مما ذكرت والضر<br />اقرأ بقية التعليق .."
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195941/http://masr.20at.com:80/article.php?sid=1196"

