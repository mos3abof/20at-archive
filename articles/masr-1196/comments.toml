subject = "التغريد خارج السرب"
author = "غيبوبه"
posted = "2006-12-09"
text = "\"ان الله يدافع عن الذين أمنوا\"<br />لن يطال هذا الغثاء قامه عاليه مثل قامتك المؤمن بها شرفاء هذا الوطن من سكانها الاصليين<br />ولن يسىء اليك ذلك القيح الذى يخرجونه من افواههم لعنهم الله و لعنهم اللاعنون"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045021/http://masr.20at.com:80/article.php?sid=1196"

[[comments]]
order = 25
subject = "الاخ الدبور إنتا بينك زنيت على خراب عشك"
author = "واحد"
posted = "2006-12-09"
text = "إنتا مالك إن كان بلال إدا للبراء سبوبه ولا مش سبوبه وبعدين هو هى الدستور بتاعه بلال علشان يدى منها إلى هوه عايزه وكمان إنتا مالك عارف ربنا ولا مش عارف دى حاجه بينه وبين ربنا يا جماعه حد يشيل المعقدين من هنا"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045021/http://masr.20at.com:80/article.php?sid=1196"

[[comments]]
order = 26
subject = "لك الله يا مصر"
author = "خارج نطاق الخدمة"
posted = "2006-12-10"
text = "الأستاذ الدبور المحترم اللي لسعاته طالت واحد وبدون ما يتأكد من صحة الكلام اللي هو بيرميه بيه<br />اسمحلي أسألك سؤال انت تعرف بلال فضل أو تعرف أي حاجة عنه؟<br />سؤال تاني لو ما فيهاش غتاتة جبت منين الكلام والاتهامات اللي انت بتقولها بدون داعي دي؟ وإيه أدلتك على صحتها؟<br />أنا أعرف بلال فضل بطريق غير مباشر وإن كان هو ما يعرفنيش، بلال مش ساكن في المعادي زي ما سيادتك ادعيت، بل ساكن في شقة في عمارة زي بقية الشعب، ثم إن كان ساكن في فيللا ولا حتى في قصر وبيركب أغلى أنواع العربيات مش من حقك تحاسبه طالما إنه ما جابش الحاجات دي بالنهب أو بالسرقة.<br />سيدي الفاضل بغض النظر عن علاقة بلال بربنا اتهامك ليه بالشذوذ أمر خطير جدا ما كانش لازم يصدر منك.<br />يا ريت قبل ما تتهم أي حد بأي حاجة تكون واثق من اللي بتقوله وتقدم الأدلة الدامغة على صحته.<br />وشكرا"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045021/http://masr.20at.com:80/article.php?sid=1196"

[[comments]]
order = 27
subject = "بــــلال فــضــل من الــلــه و نــعـمــه"
author = "ساكن اصلى"
posted = "2006-12-10"
text = "لن تلقى بالحجاره الا الشجره المثمره<br />أستاذ بـــــلال<br />شكرا<br />فأنت المتحدث الرسمى باءسم الملايين من سكان مصر الاصليين"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045021/http://masr.20at.com:80/article.php?sid=1196"

[[comments]]
order = 28
subject = "باحب بلال الصحفى ماباحبش بلال السيناريست"
author = "ريرى"
posted = "2006-12-10"
text = "بصراحة انا مصدومة من الافلام اللى بيكتبها بلال فضل وبصراحة اكتر انا عمرى ما قدرت اكمل مشاهدة اى فيلم من افلامه لما اتعرضت فى التليفزيون يمكن لو ماكنتش من محبى صفحة قلمين وطبعامن محبى جريدة الدستور كان يبقى رايى مختلف<br />المهم انى متاكدة ان بلال بيناقض نفسه<br />وانه متاكد ان قيمته الحقيقية هى كونه كاتب ساخر فى جريدة محترمة مش كونه مؤلف افلام مسلوقة<br />كل هدفى من الكلام دة هو انى مستخسرة بلال فى التفاهة وحاسة انه عنده فكر يقدر يوصله من خلال الافلام الهادفة لرواد السينما اللى هم طبعا اكتر من قراء الصحف"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045021/http://masr.20at.com:80/article.php?sid=1196"

[[comments]]
order = 29
subject = "الرائع بلال فضل ابو عـــشـــق"
author = "غيبوبه"
posted = "2006-12-11"
text = "ورحمه ام ميمى عندك ما تكسف ايدى<br />عندى لك سيناريو لفيلم تحفه هادف جدا و مفيش حد حيجرؤ انه يقول عنه انه فيلم تافه زى اللى بينتقدوا اعمالك<br />الفيلم اسمه \" الضوابط الواجبه الاتباع للنهضه الكبيره \" هوه اسمه كده و الابطال بقى على ذوقك يعنى عزت العلايلى سميحه ايوب و كده يعنى<br />اما القصه بتحكى عن كيفيه القضاء على الضحك لان البهجه زادت اوى فى حياتنا وبقينا بنضحك عمال على بطال<br />على خيبتنا القويه"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045021/http://masr.20at.com:80/article.php?sid=1196"

