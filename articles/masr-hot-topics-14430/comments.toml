subject = ""
author = "محمد مصطفى"
posted = "2009-12-17"
text = "انا مع الاخ زخارى جرجس فى اختياره للمرشد<br />والله زهقنا بقى من شوية المجانين اللى بتمسكوهم الجماعه دى وهى ملهاش اى هدف دينى من اساسه وانا ضد تسميتها وبالعكس كل اغراضها وطموحاتها سياسيه بحته ودنيويه كمان وانا من اشد كارهى هذه الجماعه"
archived = "2009-12-19"
capture_url = "https://web.archive.org/web/20091219135232/http://www.20at.com:80/masr/hot-topics/14430-2009-12-16-14-05-05.html"

[[comments]]
order = 5
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-12-21"
text = "اقتباس محمد مصطفى:<br />انا مع الاخ زخارى جرجس فى اختياره للمرشد<br />والله زهقنا بقى من شوية المجانين اللى بتمسكوهم الجماعه دى وهى ملهاش اى هدف دينى من اساسه وانا ضد تسميتها وبالعكس كل اغراضها وطموحاتها سياسيه بحته ودنيويه كمان وانا من اشد كارهى هذه الجماعه<br />الاخ/محمد مصطفى<br />أشكر لكم ثقتكم الغالية التى اوليتمونى أياها<br />ولكن ي}سفنى رفضى لقبولى زعامة هذا التنظيم الارهابى؟<br />ومرحبا بالانتماء لمصر و ليس الانتماء للشياطين و القتلة و الارهابيين أعضاء العصابة المحظورة"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123081039/http://www.20at.com:80/masr/hot-topics/14430-2009-12-16-14-05-05.html"

[[comments]]
order = 6
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-12-21"
text = "اقتباس زخاري جرجس:<br />انا ارشح الاستاذ ممدوح ذكي زخاري جرجس المحامي بالنقض ليكون المرشد العام للاخوان المسلمين<br />فهو خير من يقود الجماعة في المرحبة المقبلة<br />اولا انا لست بمحام؟<br />ثانيا لا يشرفنى اناكون قائدا لهذا التنظيم الارهابى؟<br />و لكن ممكن علشان خاطر عيونكم ان أفكر فى تولى هذا التنظيم و لسوف أحولى الى تنظيم لآ أخلاقى"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123081039/http://www.20at.com:80/masr/hot-topics/14430-2009-12-16-14-05-05.html"

[[comments]]
order = 7
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-12-22"
text = "اقتباس زخاري جرجس:<br />انا ارشح الاستاذ ممدوح ذكي زخاري جرجس المحامي بالنقض ليكون المرشد العام للاخوان المسلمين<br />فهو خير من يقود الجماعة في المرحبة المقبلة<br />أرشح \"هيفاء و هبى\" لتكون مرشدا للجماعة المحظورة؟<br />و لسوف تغنى أغنية\"جوش العادلى عنى\" \"دة هيدوخنى و يعتقلنى\"؟!!!"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123081039/http://www.20at.com:80/masr/hot-topics/14430-2009-12-16-14-05-05.html"

[[comments]]
order = 8
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-12-23"
text = "أكيد أكيد أكيد؟<br />أنا (المرشد اللى قادم)؟<br />هاهاهاهاهاها<br />بس هتأخر شوية؟<br />أصلىلسة و اقف فى طابور العيش؟!!!"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123081039/http://www.20at.com:80/masr/hot-topics/14430-2009-12-16-14-05-05.html"

