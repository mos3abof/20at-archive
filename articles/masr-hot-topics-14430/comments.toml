text = "اقتباس ممدوح زكى زخارى جرجس:<br />اقتباس حمرا يا زخاري:<br />حمرا اوي<br />دى ام اللى \"أحمر\" منها مفيش و على السكين يا \"مومس\"؟<br />دى \"أمك\" اللى أحمر من (كسها الناتف)مفيش؟<br />و على السكين يا حلاوة يا خول؟"
