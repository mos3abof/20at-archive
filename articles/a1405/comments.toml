subject = "barita007@yahoo.de"
text = "السلام عليكم،<br />تحيا اسامة وتحيا القاعدة،<br />وخلو الناس تحارب ،<br />انتم علي كل حال ما تحاربو و ما ترجعو الكف علي وجهكم رانا نعرفوكم،<br />بلا ماتكلو الحلوف انتم باردين.تخافو من بوش يحبطلكم<br />السروال؟كلو وشربو وحملو الرخس<br />ويرحم باباكم اغلقوفمكم.<br />احنا الجزائريؤن نعرف البياع الموالي الكلاب جيد كانو عندنا في وقت فرنسا الكلبة ،ولاكن الرجال نقاو البتنجال.عنبالهم لي يلبس سروال راجل.رانا نعرفوالسيرة والمسيرة<br />سلام علي الرجال ماشي البنتجال"
archived = "2005-08-06"
capture_url = "https://web.archive.org/web/20050806084517/http://www.20at.com:80/article.php?sid=1405"

