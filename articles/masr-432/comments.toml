subject = "بل الشيطان الأكبر"
author = "ابو شريف"
posted = "2006-06-05"
text = "اصبحت المؤامرات المتحدة الأمريكية الولايات المتحدة سابقا) هي الشيطان الأكبر الذي يأخذ العالم معه الي التهلكه ولكنها مازالت قادرة علي التلون ودغدغة مشاعر الجهلاء بحلو اللسان ولكن من السهل ان تخدع بعض الناس بعض الوقت لكن لن تقدر علي خداعهم كل الوقت مقبرة العراق ستبتلع الكثير"
