subject = "عاجل: عاشق زنوبة في المستشفي"
author = "مخلص أمين"
posted = "2006-07-31"
text = "الأتي هو ما حدث يالتفصيل مع عاشق زنوبة:<br />كما تعلمون فإن عاشق زنوبة معتاد علي السهر في كباريهات شارع عماد الدين و بناء عليه فهو سئ السمعة و جميع جيرانه السكان بالعمارة يكرهونه (مش عمارة يعقوبيان طبعا).<br />أثناء عودته ليلا متدهولا ، مسطولا ، متنيلا علي عينه. قام مجموعة من الشباب بضربه ضربا مبرحا و تركوه عاريا بالشارع للتنكيل به و لكسر عينه أمام المارة بالشارع.<br />قام بعض أصحاب القلوب الرحيمة من أعضاء جميعة الرفق بالحيوان بنقله ألي أقرب مستشفي للحيوانات ، و أثناء نقله (علي عربة كارو طبعا) أخذ يتمتم بكلمات عجيبة من نوعية:<br />- \" حاضر يا زنوبة إن ما وريتك \"<br />- \" بقي دي أخرتها يا زنوبة، تسلطي علي عشاقك القدام \"<br />- \" والله لأجرجرك في المحاكم يا زنوبة و الأقسام و أفرج عليكي أمة لا إله إلا الله \"<br />و أفادت مصادر مضطلعة أن الخلافات كثرت بينه و بين زنوبة في الفترة الأخيرة و لجوئه الي ضرب زنوبة لشكه في سمعتها.<br />كما أكدت ذات المصادر قيام المذكور (عاشق زنوبة) بالعراك مع سيكو الميكانيكي و فشة الجزار و كيمو العجلاتي حيث أخذ المذكورين بمعايرته لتركه زنوبة تفعل ما يحلو لها و تدور علي حل شعرها دون رقابة منه.<br />من الجدير بالذكر أن زنوبة تقوم بإيقاع الكثير من الشباب في شباكها و تقوم بأستهلاكهم ماديا بدعوي أن أبوها مشلول و أمها في المستشفي و أخواتها جعانين في البيت.<br />و قد أفادت التحريات أن من قاموا بضربه هم مجموعة من أقارب زنوبة و عشاقها القدام الذين قاموا بضربه ثأرا لزنوبتهم الأروبة<br />أنت ياد يا بتاع زنوبة لو شفتك هنا هاطلع ميتن أمك"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821064932/http://masr.20at.com:80/article.php?sid=740"

[[comments]]
order = 1
subject = "مؤامرة مبارك وبوش على الكنيسة المصرية ....."
author = "http://ibnbahya.blogspot.com"
posted = "2006-07-31"
text = "أنا قلتها والله من زمان .. من أول يوم طب علينا فيه الماكسيموس الأمريكاني ده .. ويا ريت تروحوا مدونتي وتقرأوا مؤامرة مبارك ماكسيموس وبوش على الشرق الأوسط ... وقال إيه واخد التصريح بتاعه من كوندالزا رايس وجاي حضرته يبشر حضرة جنابه بأرثوزوكسية جديدة على الموضه من بتاعة سيد نعمته بوش أولمرت يعني المسيحية الصهيونية التي يعتنقها بوش وكل البيت الأبيض والمحافظين الجدد في أمريكا وأوروبا وهي منحدرة بقذارة عن اللوثرية بتاعة مارتن لوثر القس الألماني الذي خرب الكنيسة الكاثوليكية في القرن لاسادس عشر .. يعني بسلامته هو وأقباط المهجر الصهاينة عاملين ربطيه على إخوانهم في العقيدة من المصريين الغلابه وبدعم واضح جدا جدا من حكومة مبارك والمكسب طبعا معروف .. اللي يلاحظ هيشوف إن الماكسيموس ده وصل القاهرة من أمريكا بعد زيارة جمال مبارك السرية بشهر واحد يعني العملية متظبطه خالص .. والعجيب إن ماكسيموس بتاعهم ده حصل على خمس تراخيص لخمس كنائس جديدة للتبشير بدعوته الصهيونية والأعجب إن المسكين البابا شنودة بيتبهدل خمسين سنة هو ورفاقه عشان ياخد حتة قصفة ترخيص لترميم كنيسة مش إقامة كنيسة جديدة ؟؟؟!!! وده ياخد خمسه مرة واحده وفي أسبوع واحد ؟؟؟!!! طيب تيجي ازاي إلا إذا كانت مطبوخه مع مبارك وإبنه والبيت الأسود .. يعني جيمي مبارك إبن الواطي دفع الضريبة للبيت الأسود عشان يقبلوه رئيس قادم لمصر .. طيب ده معناه إيه ؟؟؟ معناه يا سادة يا كرام وإخوانا المسيحيين يعرفوا أكتر .. إن الكنيسة الأرثوزوكسية التي هي من أقدم الكنائس في العالم ومازالت على جذورها منذ عام 323م بعد أول مجمع مسكوني في التاريخ الذي عقد في بيقا أو أبيقا أو أبيقيا كما يحلو للبعض نطقها .. ستنتهي في ظرف كام سنه وسيحل محلها كنيسة مسيحية يهودية مبنية على ق<br />اقرأ بقية التعليق .."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821064932/http://masr.20at.com:80/article.php?sid=740"

