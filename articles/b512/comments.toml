[[comments]]
order = 13
subject = "حتى لا تصبح (انطوائي Forever)!"
author = "احمد"
posted = "2006-07-31"
text = "السلام عليكم<br />والله ان الانطوائية مرض عنيد وصعب التخلص منه الا من خلال المرور بتجارب وامتحان لقدرة الشخص على الاندماج مع المجتمع<br />انا اتكلم عن نفسي وفيه صفة الانطوائية الى حد قليل وليس بالكثير وهذه الحالة تكونت عندي بسبب ان المجتمع الذي اعيش فيه لا يعرف الجديه في التفاهم ولايقدر الى عمر ومستوى الشخص الذي يتكلم معه<br />فعندما تناقش معه موضوع علمي او ديني او ثقافي يستهزأ بك ويضحك عليك ويقول لك نحن ليس في وقت المناقشة او الحوار فتكونة لدي صفة الانعزالية عن الاشخاص<br />واتمنى من الله ان تزول عني<br />لانها مشكلة والله لا يستطيع المرء من ممارسة حياته الطبيعية الا من خلال التعاون وتكوين العلاقات الصادقة والحقيقية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134507/http://www.20at.com/article2.php?sid=512"
