subject = "الانسان حيوان ( اجتماعي )"
author = "اكرم"
posted = "2006-03-03"
text = "الواحد بصراحة ميقدرش يعيش من غير ناس و علاقات و ناس بيحبهم يكون احسن<br />و الانسان اللي مالوش اصحاب كتير مش لازم يكون انطوائي ممكن يكون ليه مواصفات خاصة في اصدقائه لان الانفتاح على البحري على كل الناس ممكن يسبب مشاكل اكتر من انه يخلي الواحد كول و روش و لافف و داير<br />و في الاخر احب اقول صورة السمكة دي صورة جامدة طحن بتفكرني بفيلم نيمو<br />و اخيرا الى هبه<br />اخيرا رجعتيلنا بموضوع حلو كتري من المواضيع دي يا شيخة"
