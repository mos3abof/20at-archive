subject = "محدش يخلط"
author = "عبدالله مفتاح"
posted = "2006-03-03"
text = "كثير من الناس بيخلطوا بين الحياء والانطواء<br />يعني الولد اللي عنده حياء من البنات ومش بيقدر يهزر معاهم المجتمع بيعتبره انطوائي ولازم يتفتح على العالم ويتعامل ويسبيه من (الكسوف)<br />ونفس الموضوع ده بالنسبه للبنات<br />اللي عايز اقوله ان اي حياء في محله يبقى محمود ولا يندرج تحت الانطواء<br />واي حياء مش في محله هو ده اللي يندرج تحت الانطواء<br />جعلنا الله واياكم اصحاب حياء فالحياء والايمان قرينان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134507/http://www.20at.com/article2.php?sid=512"

