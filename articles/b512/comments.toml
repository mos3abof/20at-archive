[[comments]]
order = 6
subject = "هل تشعر بالقرف ؟"
author = "مصري"
posted = "2006-03-03"
text = "وصلني قبل عدة أيام عدد يناير 2006 من مجلة هاربرز، تعتبر هاربرز احدى أهم ـ ان لم تكن أهم ـ الشهريات السياسية الليبرالية في الولايات المتحدة ، على كامل صفحة الغلاف الخارجي الخلفي للمجلة إعلان من منظمة العفو الدولية ـ فرع الولايات المتحدة ، الإعلان جزء من حملة إعلانية مكونة من ثلاثة إعلانات ضد مايسمى \"التسليم الغير العادي\" أو \"التسليم غير القضائي\" [Extraordinary Rendition] . أصابني الإعلان بالقرف و أحسست بالخجل و الإهانة.<br />أحد الإعلانات في الحملة ، يبدأ بعنوان \"التعذيب لا مكان له في الولايات المتحدة. لهذا نقلناه الي مصر\"<br />“Torture has no place on American soil. That\"s why we have it done in Egypt.”<br />، نعم هذا هو عنوان الإعلان ، هذه هي مصر اليوم ، حتى يعلم العالم الدور الريادي الذي تقوم به مصر في العهد السعيد. بقية الإعلان تقول: \" تمارس الولايات المتحدة ما يسمى \"التسليم غير القضائي\". حيث يتم خطف ونقل غير قانوني للبعض الي دول أجنبية ، مثل الأردن و مصر، بدون إصدارعريضة اتهام بحقهم ، حيث يتم إستجوابهم في غرف التعذيب. و يتم إحتجازهم في اماكن غير معلومة ، و يمنعوا من حق الاتصال بمحاميهم ، و يعذبوا ، لأعوام عدة في بعض الأحيان. التسليم غير القضائي هو خيانة للقيم و ضد القوانين الأمريكية . يجب أن تتحرك لحماية هذه القوانين و القيم الآن إن أردت أن يعيش أولادنا في ظلها. اطلب من نائبك في الكونجرس فتح تحقيق قضائي مستقل للتحقيق في هذا الأمر، طالب بمحاسبة جميع المسئولين ومنع أي معاملة سيئة في المستقبل\".<br />مرت عدة خواطر في ذهني و أنا أقرأ هذا الإعلان ، المعلومة ليست جديدة ، فالتقارير الصحفية لم تنقطع منذ ما يقرب من العامين ، و جميعها تتضمن مصر كإحدى سلخانات تعذيب السي اى ايه . الجديد هنا هو الإعلان على صفحة كاملة و في عدد من الدوريات المحترمة. لا أدري كم من المصريين بالغرب سيتعمد الآن عدم ذكر بلده الأصلي في أحاديثه مع الآخرين ، كم منهم سيتحدث بفخر عن أصله المصري؟<br />في حديث للسفير المصري في واشنطن \"نبيل فهمي\" نشرته مجلة دير شبيجل الألمانية ، صرح سعادة السفير أنه تم إرسال بعض السجناء الي مصر بإتفاق مشترك بين الولايات المتحدة و مصر ، \"نحن نقوم بالتحقيقات بناء على فهمنا للثقافة [العربية الإسلامية]، نحن لا نعذب احد\" ديرشبيجل 9 ديسمبر 2005.<br />نعم فأنت بالتأكيد عندما تعرف \"ثقافة\" من تعذب تستطيع أن تستخدم نقاط ضعفهم لصالحك ، نشر الكثير عن أساليب التعذيب في أبوغريب و إستعانة الأمريكان بالإسرائيليين لمعرفتهم بـ \"الثقافة\" . هنا يقفز الي ذهنك سؤال .. لماذا إذا لم يتم إرسال هؤلاء المخطوفين الي إسرائيل؟؟ فهم بالتأكيد يعرفون \"الثقافة\" أسألوا أخواننا في فلسطين ، جلادوا الشين بيت يعرفون \"الثقافة\" جيداً، هل رفضت إسرائيل دور مقاول التعذيب و أرتضته مصر؟؟ ثم أن العراق و أفغانستان كلتاهما محتل و بالتأكيد يوجد في كلا البلدين من يعرف \"الثقافة\" فلماذا مصر إذا؟؟ هل يوجد في مجلس الشعب المصري نائب واحد (واحد فقط) يقف و يطالب بتحقيق مستقل كالذي يطالب به الأمريكان حكومتهم؟؟ أم ان السادة نواب الشعب لا زالوا مشغولين بالتصفيق لترشيح الدكتور أحمد فتحي سرورنفسه رئيسا للمجلس ؟<br />العراق به أساتذة في فن التعذيب ـ إسألوا لواء الذئب الشيعي التابع لوزارة الداخلية ـ و العراق بالطبع تحت الإحتلال الأمريكي ، و بالتالي يستطيع عملاء المخابرات الأمريكية متابعة عمليات التعذيب لحظة بلحظة ، لماذا إذا مصر ... لماذا؟؟<br />عندما تفجرت قضية التعذيب بالوكالة ، ظهرت أنباء عن تواجد معتقلات سرية في أوروبا الشرقية ـ الدول الشيوعية الدكتاتورية سابقاً ـ قارن هنا موقف حكوماتنا من موقف الحكومة البلغارية في قضية الممرضات البلغاريات في ليبيا ، فالحكومة البلغارية ، الشيوعية الديكتاتورية سابقا ، تفعل كل ما تستطيع دفاعا عن المواطنات البلغاريات في ليبيا ـ هل تصدق هذا .. حكومة تدافع عن مُوَاطنيها ـ ، لم تقم الحكومة البلغارية مثلا بتعذيب الممرضات لحساب المخابرات الليبية للإقرار بجرم حقن الأطفال الليبيين بالإيدز ، لا لم تقم بهذا والحكومة البلغارية تعرف بالتأكيد \"ثقافة\" الممرضات. هل بدأت تشعر بالقرف أنت ايضا؟؟ إذا أحسست بالإهانة و كان نائبك في مجلس الشعب من المعارضة ، إتصل به ، طالبه بأن يتحرك ، فإن لم يستطع ، فأشرف له أن يكون خارج المجلس من أن يكون داخله. إتصل بنائبك طالبه بأن يتحرك ، لأن مصر لا تستحق هذه الإهانة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134507/http://www.20at.com/article2.php?sid=512"

