subject = "بدون عنوان"
author = "The Dead"
posted = "2006-03-02"
text = "اسمحولى اقول رأيي فى الموضوع ده<br />الانطوائية مرض نفسي إجتماعي يبدأ وينموا فى الصغر ويكوت للأبوين دور كبير في إصابة ولدهما<br />به من عدمه<br />الشخص الإنطوائي من الصعب أن يغير من نفسه ولكن ليس من المستحيل فلقد كنت فى فترة من عمرى وأنا صغيرا إنطوائيا لدرجة كبيرة ولكنى صممت أن أغير من نفسي فى محاولات عديدة ولم أستطع ذلك إلا على مراحل إجتازت فترة زمنية كبيرة والآن أنا سعيد لأننى استطعت فعل ذلك وخرجت من ذلك السجن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134507/http://www.20at.com/article2.php?sid=512"

[[comments]]
order = 1
subject = "انا كنت انطوائيه جدا"
author = "sweet_princess"
posted = "2006-03-03"
text = "انا كنت في فتره من اصعب فترات حياتي انطوائيه جدا في سن من 14 الى 15 سنه ودي قمة سن المراهقه واصعبها لان الانسان مش بيتعرض لتغيرات جسمانيه وبس .....نفسيه كمان .<br />اتقريبا في الفتره دي ماكانش ليا اصحاب او اصدقاء لكن كنت بعوض دا بالقراءه كتير جدا.<br />وكان صعب عليا جدا اني اندمج مع زملائي في المدرسه او اكون صداقات .<br />ولاحظت انه ممكن يسيب انطباع سيئ عند الناس .<br />فبدات اتغلب ع المشكله دي اولا مع اللي حواليا وبدات بوالدتي واخويا وبعدين مع اهلي .<br />واتغلبت عليها بشكل كبير لما دخلت الجامعه وبقيت اجتماعيه اكتر لكن طبعا بحدود.<br />لكن برضه الانطوائيه دي بتعاودني من وقت للتاني بعد الصدمات او لما اتعرض لخيانه مثلا من صديقه واتصدم فيها .<br />وساعتها مابلقاش صديق غير الكتب لانها ما بخونش ولابتكدب ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134507/http://www.20at.com/article2.php?sid=512"

[[comments]]
