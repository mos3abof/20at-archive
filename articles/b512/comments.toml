text = "اخييييييييييييييييرا<br />انتى فين يا روح قلبى و الله يا هبهوب وحشانى و لسه كنت معلقه ف موضوع تانى و بقول الموقع مضلم من عيرك<br />المزكرات حلوه و انا قرات اتنين منها بس هكمل الباقى و الله هى بس مشاغل يا هبهوب<br />المزكرات تحفه و عملتيها و فكرتينى بنفسى و شكللى هتطق ف دماغى و انشر مزكراتى زيك بس المشكله ان فيها اسامى اشخاص و محتاجه وقت للتنقيح<br />عموما هشوف<br />انا بعتللك ايميا ابقى اقرايه يا هبهوب"
