subject = "من أحمد زين"
text = "السلام عليكم<br />يا جماعة أنا آسف للتأخر في الرد ولكن ... كنت اجازة<br />على العموم أشكر جميع الزوار الذين قرأوا المقال ولبعض التساؤلات التي وردت أقول أنه يا جماعة أنا لم أر الفيلم لسبب خاص أنني فعلا ما وجدت في نفسي قدرة على تشجيع هذه الصناعة غير الفنية بما سأدفع من ثمن التذكرة، فضلا عن الأسباب القيمية المعروفة، وفي مقالي القصير هذا لم أكتب عن الفيلم كمضمون وكصورة فيلمية لكنني كتبت عما حول الفيلم وما ارتبط به من ظواهر والحقيقة أننا جميعًا نلوم من يكتب عن فيلم ( مضمون ومحتوى وصورة بصرية) دون أن يراه لكنني أعتقد أنني لم أتحدث أبدُا عن مضمون الفيلم ولكنني تحدثت عما يمكن أن نسميه الشكل وهو ما حول الفيلم، وهذا اتجاه نقدي أحيانًا ما يفيد ويعتمد على قراءة التصريحات حول الفيلم وما أثير حوله من قضايا وأزمات ، بالإضافة لأفيش الفيلم مثلا وإيراداته بالإضافة للظواهر التي تعلقت بالفيلم ... إلخ .. وهذا في الواقع لا يكون غالبا إلا للأعمال الفنية التي تثير ضجة أو تساؤلات او علامات تعجب ، وأعجبني أشرف عبد المنعم الناقد الموسيقي في الأهرام حين كتب مقالا تحليليا لأغلفة الألبومات في أحد المواسم ..<br />وأسأل الله تعالى ان أكون قد أجبت على تساؤلاتكم الكريمة .. وإلى اللقاء في فيلم جديد بدون روبي ولا كوتشينة<br />مع تحياتي"
archived = "2004-08-17"
capture_url = "https://web.archive.org/web/20040817210801/http://www.20at.com:80/article.php?sid=514"

