[[comments]]
order = 24
subject = "جديد الموقع"
text = "يا أخ حرية:<br />إحنا مش ناس هايفين ولا \"فاضين\" زي ما حضرتك بتقول، و إن كان في حد غافل عن المئات و الآلاف إلي بتموت في فلسطين، فدول أكيد مش إحنا، لكن إلي بيروحو يلفوا ورا روبي و أمثالها، و ده إلي كاتب المقال و العاملين في الصحافة النظيفة عموما بيحاولوا يحذروا المتلقي منه !<br />المعركة الإعلامية يا أخي الكريم لا تقل أهمية و خطورة عن الحرب في فلسطين... محاولات التغييب و التتفيه و الإنحطاط بالذوق العام و إثارة الشهوات لدى وقود هذه الأمة(الشباب) لا يقل خطورة (إن لم يكن أخطر) من الحروب إلي على الأرض... ده مش إستهانة بأرواح السملين أو أعراضهم و ممتلكاتهم و حقهم، لكن أن يقتل مئة شخص، ليس كأن يقتل مستقبل \"أمة\" متمثل في شبابها!"
archived = "2004-08-17"
capture_url = "https://web.archive.org/web/20040817210801/http://www.20at.com:80/article.php?sid=514"

