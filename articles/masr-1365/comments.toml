subject = "هذه بداية النهاية"
author = "هذه هى بداية نهاية حسنى اللامبارك وهى تحالف كل قوى الشعب المعارضة وإنضمامها مع الشعب لتصبح القوى التى تستطيع طرد مبارك وإجبارة على التنحى بعد حكم من الفساد والعمالة لليهود والامريكان وبعد بيع مصر لليهود هذا هو الطريق للخلاص من مبارك ولن ينفعه يومها الأمن المركزى ولا زوجته التى تلقى عليه التعليميات والأوامر"
posted = "2006-12-27"
text = "مرحبا بسقوط مبارك وحكم جديد بدستور جديد و"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010736/http://masr.20at.com:80/article.php?sid=1365"

