[[comments]]
order = 5
subject = "ليكن"
author = "مواطن حر"
posted = "2006-12-27"
text = "يجب أن تسعى المعارضة إلى عقد التحالفات خالصة النية بين أقطابها بعيدا عن محاولات الكسب السياسي التي تقوم بها بعض القوى المعارضة ومن بينها حزب الغد الذي يسعى إلى الاستفادة من التقدم السياسي الذي تحققه جماعة الإخوان المسلمين في مصر وهو الأمر الذي يعني أن الحزب سيظل يتسلق على أكتاف الآخرين إلا أنه سيقع عند أول التفاتة من جانب هؤلاء الآخرين تخل بتوازن الغد من فوق كتفهم"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010736/http://masr.20at.com:80/article.php?sid=1365"

[[comments]]
order = 6
subject = "ليس هكذا يكون تعاطي السياسة"
author = "باحث ومترجم صحفي"
posted = "2006-12-27"
text = "في الديمقراطيات الأصيلة يكون التعاطي مع الشأن السياسي من خلال استخدام الطرفين الراغبين في إقامة تحالف سياسي أوراق ضغط أو قوة يملكها كل طرف من أجل إغراء الطرف الآخر في الدخول إلى ذلك التحالف إلا أن الوضع في مصر يختلف حيث أن حزب الغد يعاني من الضعف السياسي مستوى يجعله يمارس ما يمكن تسميته بـ\"الاستجداء السياسي\" أو \"الشحاذة السياسية\" حيث أنه يحاول فقط السير في ظل أية قوة سياسية كبيرة من أجل الظهور في الصورة السياسية وبطبيعة الحال فإن حزب الغد لم يجد إلا الإخوان المسلمين إلا ليتحالف معهم حيث أنهم القوة السياسية المعارضة الأكبر والأكثر تنظيما في الشرق الأوسط والأكثر تأثيرا على مجريات السياسة الداخلية في مصر وبالتالي فإن حزب الغد يحاول أن يدخل في تحالف مع الجماعة من أجل نسب الانتصارات السياسية التي تحققها الجماعة إلى تحالف سياسي يحمل اسمه إلا أنني أعتقد أنه رغم القمع السياسي فإن المواطن قادر على التمييز بين الأداء السياسي للغد منفردا وبين الأداء السياسي لتحالف يكون الغد مكونا فيه لأن الغد في الغالب يلعب دور العنصر المكمل للصورة السياسية لا العنصر الرئيسي أو حتى العنصر الفاعل"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010736/http://masr.20at.com:80/article.php?sid=1365"

