[[comments]]
order = 2
subject = "أختلف معاااك !!"
author = "محمد مصطفى"
posted = "2006-12-27"
text = "بصراحة الاحزاب المصرية اضعف من إنها تدخل مع الاخوان في تحالفات ..لأن أمن الدولة مسيطر على الاحزاب المصرية بصورة كبيرة..وقبل أي تصريح لقيام أي حزب ..لازم أمن الدولة بياخد ضمانات على الحزب إنه مش هيخرج عن طوعه..والاحزاب المصرية كلها ممسوكة من رقبتها بإيد الامن في مصر...ففرص قيام تحالفات بين الاخوان وأي حزب غير قائمة ولو وجدت تحالفات هتكون تحالفات ضعيفة وهشه..<br />وبالنسبة لبعض التعليقات إلي أقراها على ألبية الموضوعات بيتهيألي محتاجة مراجعة من اصحاب الموقع..بمعنى إن في معلقين تعليقاتهم بعيد عن الموضوع زي واحد مثلاً حاطط إعلان عن موقع تاني أو ما شابه من خروج التعليق عن الموضوع الاساسي..<br />وبعض التعليقات فيها طفوليه ومراهقة بصورة كبيرة وبعض الاحيان غباوة وعدم فهم وتضيع للوقت ..زي تعليق واحد كاتب إسمه معاذ عامر ومعلق بقوله \"بالرفاء والبنين \" وبصراحة ده شغل عيال صغيرة مش ناس بتتناقش في هموم بلد غرق في الفساد محتاج مناقشات جادة مش تهريج ..ومحتاج عدم استبعاد أي فصيل سياسي مهما كان..."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010736/http://masr.20at.com:80/article.php?sid=1365"

[[comments]]
order = 3
subject = "أتمنى من الله"
author = "أتمنى من الله عز وجل أن تتحد كل المعارضة الرافضة للفساد وتصبح كلها كتله قوية لمحاربة فساد مبارك وعائلته وإجباره على التنحى لما أوصل مصر له من فساد ونهب وعمالة وقذارة ولننظر إلى المعارضة فى لبنان نجد لها قوة التأثير والتحالف من أجل قضية واحدة وهى سقوط الحكومة العمالة والفساد لماذا لا نكن مثلهم فى قوتنا وخاصة أن فساد مبارك غطى على كل أنواع الفساد فى العالم"
posted = "2006-12-27"
text = "تنمنى سقوط حكم مبارك الفاسد وحكومة إنتقالية بقيادة القضاه الشرفاء لمدة سنتين تتطلق فيها الحريات وتغلق المعتقلات ثم إنتخابات حرة بترشيحات من الشعب وإحترام لرأى الشعب فيها شأننا شأن الدول وليس العبيد كما يتعامل مبارك الواطى مع المصريين<br />الله أخرج مبارك من مصر وذل نفسه وزلزل عرشه اللهم آمين"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010736/http://masr.20at.com:80/article.php?sid=1365"

