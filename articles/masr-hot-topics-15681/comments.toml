capture_url = "https://web.archive.org/web/20100314094143/http://www.20at.com:80/masr/hot-topics/15681-2010-03-09-18-31-29.html"

[[comments]]
order = 1
subject = ""
author = "بنت ولد"
posted = "2010-03-10"
text = "أمل إسماعيل<br />الوظيفة: عاملة بإحدى محلات الملابس<br />الرأي: هو مين البرادعي ده أنا حاسة أني سمعت الاسم ده قبل كده بس مش عارفة إيه حكايته بالظبط وبصراحة شوفت شكله في نشرات الإخبار بس مهتمتش أني أعرف حكايته وأول ما بشوفه بقلب المحطة أصلي بصراحة مش بحب السياسية، ياريت تكلموني أحسن عن أحمد عز أو أحمد السقا ويا ريت نتكلم عن عمرو دياب عشان أنا من عشاقه.<br />البت دي لازم تتعدم بتهمة الغباء السياسي"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314094143/http://www.20at.com:80/masr/hot-topics/15681-2010-03-09-18-31-29.html"

[[comments]]
order = 2
subject = ""
author = "عزرائيل اولا"
posted = "2010-03-10"
text = "بعد عزرائيل ما يشوف شغلة<br />الاوضاع هتتغير وهندخل مرحلة هلامية ودخان وضباب وسحابة سوداء<br />وبعد ما تنجلى السحابة السوداء هنشوف مين اللى على الكرسى<br />وصدق الشاعر<br />بعدما ينجلى الغبار —— سوف نرى فرس تحتك او حمار<br />طول عمر مصر<br />وفى تاريخها كلة<br />محدش عارف مين اللى جاى<br />دى لعبة القدر<br />المهم عزرائيل اولا وسريعا"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314094143/http://www.20at.com:80/masr/hot-topics/15681-2010-03-09-18-31-29.html"

