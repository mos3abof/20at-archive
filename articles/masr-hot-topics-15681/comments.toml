author = "شيماء كامل"
posted = "2010-03-09"
text = "انا شايفه ان الدكتور البرادعي مش مناسب انه يكون رئيس لمصر مش لحاجه الا لانه انسان مسالم جدا ملوش خطه او سياسه محدده حتي في البرامج اللي شوفتهاله ماقلش اي حاجه واضحه"
