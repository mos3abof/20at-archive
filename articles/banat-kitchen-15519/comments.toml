text = "اجزاكي الله خيرا<br />وحبيت اقول طريقه عملي للبيتزا انا ايضا وبتطلع والله تحفه<br />4 اكواب دقيق<br />2 كيس خميرة فورية<br />معلقة ونصف سكر<br />2 عليه زبادي<br />ماء دافئ للعجن<br />الطريقة<br />نضع الخميرة مع السكر في كوب ويزود ربع كوب ماء من الحنفيه وتترك علي جنب حتي تزداد للضعف<br />نضع الدقيق مع الزبادي ويفرك جيدا حتي يتجانسوا تماما<br />ثم الخميرة ثم تعجن بماء دافئ<br />ثم تقطع العجينة 8 دوائر وتوضع في طبق بلاستيك واسع ثم تغطي بكيس بلاستيك وتوضع في الفرن ويفضل ان يكون دافئ لتخمر"
