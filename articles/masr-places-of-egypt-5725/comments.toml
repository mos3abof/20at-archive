text = "أولا الصور بتاعة زمان في منها صور مش في مصر أساسا إنما في إحدى الدول الآسيوية وبعدين دي صور تسيئ إلى مصر مش العكس وبعدين في الصور الجديدة نعمدتوا تقحموا صور لبعض المظاهر السياسية زي الشارع إللي فيه صور الريس عشان تحاولوا تثيروا استياء الناس ويقولوا: آه والله زمان أحلى يعني باختصار المقارنة مش موضوعية أبدا"
