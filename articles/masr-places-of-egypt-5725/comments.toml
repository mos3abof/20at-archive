text = "اجمل صوره الصوره الاخيره اللى بتصور البلد من قوق<br />فكرتنى بجمله قالها عادل امام (البلد دى اللى يشوفها من فوق غير اللى يشوفها من تحت)<br />بس مصر هى مصر<br />رغم كل الحاجات اللى انتو عارفينها و رغم اللى بيحصل و اللى لسه هيحصل<br />هتضل مصر احلى بلد ف الدنيا<br />و هيفضلو ناسها احسن ناس على راى داليدا"
archived = "2010-01-05"
