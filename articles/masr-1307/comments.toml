[[comments]]
order = 0
subject = "ازهر مظهر"
author = "مومو"
posted = "2006-12-15"
text = "يا جماعه شيخ الازهر والمفتي دول اصلا مينفعوش للافتاء وغير بصم دول متاسلمين ملهمش علاقه بالاسلام فاهمين وليه تاخد بكلام شيخ دة والراجل دة معندكم القران الكريم وتفاسيرة القيمه ابحثوا واتكلوا علي الله واخلصوا النيات اما الشيخ الفلاني والعلاني فدة مضيعه وقت لانهم اجهل من اي عاطل بشاركم او حيكم واظن ان اللي بيخد فلوسه من اعضاء لجنه السياسات والمجلس القومي للدعارة والتصدير لازم يكون قواد درجه اولي صح"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030039/http://masr.20at.com:80/article.php?sid=1307"

[[comments]]
order = 1
subject = "أختنا هايدي ....."
author = "إبن بهيه"
posted = "2006-12-15"
text = "أختنا هايدي موضوعك ممتاز وفي محله وهو كما تفضلتي استمرار لسياسة مبارك الواطي الماسونية في تدمير المجتمع ورواسيه الدينية التي نعلم جميعنا أنه لم يخرب الأزهر فقط وإنما اتجه أيضاً لتخريب الكنيسة الأرثوزوكسية بعدما أرسل جروه الصغير جيمي لأخذ المباركة من البيت الأسود على الوراثة في مقابل تدمير الكنيسة الأرثوزوكسية بدعم كامل لكنيسة ماكستون فورت أو ماكس ميشيل أو ماكسيموس الأول والأخير .. هذا دأب الماسونية دوماً في شتى بقاع الأرض .. تدمير الأديان كلها عدا اليهودية الصهيونية التي يتظاهرون بتدميرها وهم يدعمونها سرا كما يعلم الجميع ، المهم هنا أنني أريد تحيتك على وضوعك المحترم وسأحاول التعليق سريعاً على بعض النقاط :<br />بداية موضوعك تحدثت في عجالة عن ماضي الأزهر العريق وما كان عليه من قوة ومنعة ووطنية لسبب بسيط جدا وهو أنه كان مستقلاً وشيخه ينتخبه المشايخ وليس معينا من قبل مبارك الواطي كأي غفير نظامي بنيكله .. وأقول غفير نظامي بنيكله عامدا مستعمداً لأنه تحول إلى مجرد رجل أمن النظام من الناحية الدينية .. في مصر كما يعلم الجميع لابد للحاكم من السيطرة على مؤسستين وحيدتين كي يسيطر ويستبد ويلعن أبو البلد من غير ما حد يكلمه .. المؤسسة الدينية (الأزهر) والمؤسسة لاعسكرية (الجيش) ومبارك الواطي جعل الأزهر مجرد واجهة ودكان لبيع صكوك الغفران للحاكم .. وأما الجيش فمصيبته هو الآخر مصيبه .. فقد حول مبارك الواطي قادته إلى قوادين لنظامه القذر وباتوا جميعهم سماسرة واذهبوا إلى المدن الجديدة والسواحل واظروا كيف أن مبارك الواطي يشتري ذمم وضمائر قواد الجيش بقطع الأراضي والفيلات والذي منه كي يكونوا جزمة في قدمه يدوس بها من يشاء .. والمصيبة أن قواد الجيش عجبتهم الشغلانه دي ورقصوا وفرحوا بيها .. بل أنني قابلت بع<br />اقرأ بقية التعليق .."
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030039/http://masr.20at.com:80/article.php?sid=1307"

[[comments]]
order = 2
subject = "نسألكم الفاتحة على روح فقيد الأمة الأزهر الشريف !"
author = "إبن بهية"
posted = "2006-12-15"
text = "يذكر أنه كان في بلاد مصر شيخاً جليلاً مجلجلاً مدجناً يقال له طن طاوي ، لمع نجمه وعلا علواً كبيراً فيما كان يعرف قديماً بدار الإفتاء .. حيث لم يذكر لنا التاريخ أن عالماً وصل به العلم إلى ما كان عليه السيد طن طاوي الذي تغلب على الكلاشنكوف في سرعة إطلاق الفتاوي الطازجة .. عادة وسبايسي .. فبرع في فنون الإفساء براعة الثعالب .. بل أشد رائحة وغيلا ((مش عارف يعني إيه غيلا .. بس عديها)) لدرجة تسببت في العديد من الحوادث المرورية للسيارات التي كانت تعبر الطريق من أمام دار الإفساء التي يتبوأ فيها مكانة المفسي ..<br />وصل صيت الرجل في الإفساء إلى القوادة السياسية فققرت مكافئته وجعلته يتبوأ ((في خرابة أخرى)) مكانة أخرى عظيمة هي مشيخة الآزهر .. فبهر الرجل بالأضواء والشهرة العالمية ولم يدخر وسعاً في إطفاء لمساته وأفكاره النيرة على المكانة الجديدة التي تبوأها فراح يحسن من أدواته ويجود في الإفساء الذي تطور مع الفيديو كليب وموسيقاه الراقصة إلى مرحلة الضراط .. واستطاع السيد طن طاوي في سنوات قليلة تحويل مشيخة الأزهر إلى مشخخة بدرجة معفن جداً جداً .. وهي مكانة لم يصلها قبله إنس ولا جان ..<br />وتحولت مشخخة الأزهر في العصر الطن طاوي المشحون بالضراط إلى مجرد كتاب سيدنا كعبول في كفر كعبلون بحري .. فتم في عهد الشخاخ الأكبر إغلاق كافة المكتبات والإرساليات التابعة للمشخخة في دول أفريقيا وبعض الدول الأجنبية الأخرى توفيراً للشخاخ والضراط لوقت عوزه .. راجل فهمان طبعاً .. مش يستحق لقب الشخاخ الأكبر برضه ؟ وفي عهد ذلك الشخاخ الأكبر أيضاً تضائل .. تضائل .. تضائل دور الأزهر على كل المستويات والأصعدة ، محلياً ، إقليمياً ، وعالمياً وجلس صاحب الفضيلة المعفنة على تل كتاب سيدنا كعبول يستقبل الوفود الأجنبية التي لم تأت<br />اقرأ بقية التعليق .."
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030039/http://masr.20at.com:80/article.php?sid=1307"

