subject = "ماهوة لو كان فلح في بيتة كان فلح في الفتي"
author = "masry"
posted = "2006-12-16"
text = "ربنا يكون في عون الدكتور محمود جوز بنت فضيلة المفتي اللي مراتة اللي هيه بنت معالي فضيلة المفتي ماتعلمتش ازاي تريح جوزها ولا رباها ابوها على طاعه الزوج و توفير سبل الراحة لة في منزلة<br />والله لا اعلم هل تطلقت منة ام لازال صابرا محتسبا على ما ابتلاة ربة من زوجة غبية جاهلة اتت من بيت لم تتعلم فية من ابوها ولا امها شيء ممن تتعلمة القرويات في الارياف"
