[[comments]]
order = 9
subject = "شعب غلبان و تعبان"
author = "لمصلحه من يتم الإساءه الى صرح عريق كالازهر والاستهانه برجاله بهذا الشكل المكثف"
posted = "2006-12-16"
text = "لمصلحه الجهه التى تريد احتكار الدين الاسلامى فى البلد فلا ترى فى الازهر بتاريخه الكبير الا منافس له.<br />فاتهام علماء الازهر بالعماله للحكومه من ناحيه و اقامه استعراضات بلطجه و ارهاب من ناحيه اخرى<br />فشيخ الازهر يشتم، واما من شتم الدوله واللى فيها فمره لم يقصد و مره لم يقول و مره و مره<br />وكل هذا و الشعب تصفق للابطال المؤمنين احفاد صلاح الدين وهم يحررون البلاد من عدو خطير هو....الازهر!!!<br />حقيقى انتم شعب غلبان و تعبان"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030039/http://masr.20at.com:80/article.php?sid=1307"

