author = "معاكي حق يا هايدي في كل كلمة"
posted = "2006-12-16"
text = "للاسف الازهر راح علمة<br />احمد الطيب خان العلم واصبح يفتي بما يحب الحاكم ويؤضية<br />احمد عمر هاشم بيسب الدين امام جميع الناس<br />طنطاوي بيستني حسني وامريكا يملوه الفتوي<br />علي جمعه ضل من زمان<br />اين الازهر فيهم<br />بل قولي اين الاسلام فيهم"
