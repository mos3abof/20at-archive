[[comments]]
order = 4
subject = "الازهر العظيم"
author = "عادل"
posted = "2006-12-16"
text = "كان الازهر عظيما عندما كان مستقلا .. كان الازهر محترما عندما كانت هيئة كبار العلماء تختار شيخ الازهر من بين علمائها الاجلاء وكانت دار الافتاء من المكانة العظيمة عندما كان المفتي بالاختيار وكان يطلق عليه مفتي الديار .. ماذا تنتظرون من امام الازهر الذي يعينة رئيس الجمهورية وماذا تتوقعون من المفتي الذي يختاره رئيس الجمهورية طبعا يصبح الامام امام السلطة والمفتي مفتي الحكومة وتصبح الفتاوي بالتفصيل ارضاء للسيد الجالس على سدة الحكم .. كنا دائما نسمع \"اذا رأيتم الشيخ يتردد على مجالس السلطان فاتهموه في دينه\" ماذا يحدث عندما يكون مجلس الشيخ هو بيت السلطان وفتاوي الشيخ لمزاج السلطان واراء الشيخ ترجمة لافكار السلطان وهدف الشيخ تثبيت اركان نظام السلطان .. عندها لابد ان تقام صلاة الجنازة على الامام والمفتي حتى ولو كانا بين ظهرانينا احياء يرزقون"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030039/http://masr.20at.com:80/article.php?sid=1307"

[[comments]]
order = 5
subject = "لا احد يشتم الازهر"
author = "ارجوكم لا احد يشتم الازهر ولا مشايخة فهم يعرفون الدين ولكن احيانا تتدخل السياسات الخارجية لتضغط هنا وهناك ومطلوب المرونة وخليك حلو امال ومشى حالك وبلاش شوشرة"
posted = "2006-12-16"
text = "الناس تعرف دينها جيدا وليست فى حاجة الى مشايخ وغيرة والعلم فى الكتاب لمن يريد<br />وفى ديننا ليس بين العبد وربة مشايخ ولا كهنة<br />والعلم مطلوب من المهد الى اللحد كما ينص الحديث فتعلموا دينكم الصحيح- ليس من المشايخ ولكن من الفقهاغء<br />وكبروا مخكم<br />والسلام"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030039/http://masr.20at.com:80/article.php?sid=1307"

[[comments]]
order = 6
subject = "الحاج طنطاوى ..... والنظام !!!"
author = "فارس_fr"
posted = "2006-12-16"
text = "هل من الممكن ان احكم على شيخ الازهر \"طنطاوي \" انه عميل حكومى داخل مؤسسة دينية ؟؟؟ ولم لا فهوا دائما وابدا يدعم الاراء والفتاوى المباركية والسوزانية ودائما ما يدعوا الله ان يطيل عمر اولى الامر المباركين ,,,, فهوا كدابه دائما محب للنظام طوعا او كراهية !! لانه كائ مسئول حاليا يعشق كرسية ولا يرضي عنه بديلا .<br />بالبلدى كده ,, شيخ الازهر او غيره من مشايخ الازهر لم يعد لهم اى دور فى حياة المواطن المصري ,, وتلجأ الناس الان الى \"استفتى قلبك وان افتوك \" ,,,, طنطاوى او غيره لا يقدر ان يقول لا لفتاوى الدعم لنظام مبارك وسوزى ولا يذهب عنه الكرسي ,, وهذا ليس دفاع عن طنطاوى ولكن رثاء للحالة التى وصل اليها الازهرالشريف ومشايخة ,,,ورحم الله الازهر<br />تحياتى لابن بهية"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030039/http://masr.20at.com:80/article.php?sid=1307"

[[comments]]
order = 7
subject = "ابو التساهيل"
author = "الجن"
posted = "2006-12-16"
text = "يحكي انه في بلاد الطرابيش كان يوجد رجل حكيم يدعي ابو التساهيل وكان شعب الطربوشي يحكمه رجل متسلط فأشار عليه ابو التساهيل بحكمة خبيثة ليجعل الشعب يحبه فيأمر الملك الوزير ان يرفع الضرياب فيثير الشعب ويخرج الملك ويلغي الضرايب فيحبه الشعب.. فأمر الملك برفع الضريب فلم يتحرك الشعب فجعل علي كل جسر كمين من يدخل عليه يدفع 10 طروبش فلم يتحرك الشعب فأمر بكمين اخر بعد كل جسر من يدخل الجسر يدفع 10 طربوش ومن يخرج يدفع 10 طربوش فلم يتحرك الشعب ولم يثير فيما استعجب الملك فأمر بكل من يدخل الجسر ويخرج بدفع 20 طربوش وياخد علي قفاه وتنكر الملك وذهب الي احد الجسور فوجد رجل متعصب فذهب اليه وقاله له ماذا بك فقاله مش عارف انا ايه الشغلانه السوده دي بقالي 10 ساعات واقف متعطل المفروض يذودو الناس الي بتدينا علي قفانا ........"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030039/http://masr.20at.com:80/article.php?sid=1307"

