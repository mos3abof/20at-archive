[[comments]]
order = 1
subject = ""
author = "ابو شخه"
posted = "2009-10-13"
text = "ابو شخه مش عاجبه كلام فضيلة الامام الاكبر شيخ الازهر<br />دا حتى عيب عليك<br />يعني مثلا في الجيش لو واحد عميد في الجيش قال حاجه<br />عيب لما رتبه اقل منه تعدل عليه<br />عيب عليك يا اخي عيب<br />عيب لما ما نحترمش علماءنا عيب<br />شيخ الازهر عالم جليل وليس مفتي سلطه كما يتهمه البعض<br />كل من يسيء الى شيخ الازهر من قتلة عثمان وخوارج علي"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018043621/http://www.20at.com:80/masr/2khbar/13695-2009-10-13-08-24-17.html"

[[comments]]
order = 2
subject = ""
author = "الى الحمار"
posted = "2009-10-13"
text = "طيب والله يا حمار ربنا قال في القران<br />وقرن في بيوتكن ولا تبرجن تبرج الجاهلية الاولى<br />يعني يا حضرة الحمار خروج المرأة من المنزل بمفردها تبرج الجاهلية الاولى<br />ايه رأي حضرتك في المنقبات اللي بيخرجوا لوحدهم وبيركبوا المواصلات ودايرين في الشوارع<br />افتينا يا حضرة الحمار<br />المفروض يا حمار قبل النقاب وقرن في بيوتكن<br />يا ليت بتوع قناة الرحمه والناس يقولوا الكلام دا"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018043621/http://www.20at.com:80/masr/2khbar/13695-2009-10-13-08-24-17.html"

[[comments]]
order = 3
subject = ""
author = "الخمار الاسود"
posted = "2009-10-13"
text = "كان بياع خمارات يعانى الكساد فى دكاكين بغداد واتفق مع مغنى صديقة ان يتغنى بالنقاب حتى يقبل الناس على الشراء<br />فغنى قصيدة رائعة عن النقاب بدايتها<br />قل للمليحة فى الخمار الاسود ————————— ماذا صنعت بزاهد متعبد ؟<br />قد كان شمر للصلاة ثيابة —————————- حتى وقفت لة بباب المسجد<br />ردى علية صلاتة وصيامة ————————- لا تقتلية بحق دين محمد<br />فاقبلت النسوة على شراء الخمار وبالذات الاسود حتى نفذت بضاعتة وكانت تلك او اعلانات دعاية فى المبيعات عرفها العرب<br />الحاج هريدى الصعيدى"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018043621/http://www.20at.com:80/masr/2khbar/13695-2009-10-13-08-24-17.html"

[[comments]]
order = 4
subject = ""
author = "بقية التعليق السابق"
posted = "2009-10-13"
text = "ـــــــــــــــ ـــــــــــــــ ـــــــــــــ<br />منذ ظهور الاسلام منذ 1500 سنه كان لا يوجد هذه الاثباتات الشخصية وكانت المرأة تتنقب<br />وعندما جاء الاسلام واخرج الوجه من دائرة العورة وتأكيدا لذلك لا تصح صلاة المرأة الا وهي كاشفة وجهها يعتبر من الاعجاز المستقبلي للاسلام<br />وكما قال الشيخ الشعراوي لان الاسلام دين حضاري فلم يتعارض مع الدولة المدنية الحديثة في اي شيء<br />ومشكلة النقاب هنا مشكلة مدنية امنية لان الذين يطالبون بخلع النقاب متضررين امنيا من هذه الظاهرة<br />فالذين يحثون المرأة على لبث النقاب والتشدد به يسيؤون الى الاسلام لانهم بهذا يجعلونا دينا يتعارض مع المدنية والدولة المدنية<br />فارجو من الاخوة الدعاه في قناة الرحمة والناس يبطلوا جهل<br />والموضوع يطول شرحه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />مع تحيات مش ححبك"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018043621/http://www.20at.com:80/masr/2khbar/13695-2009-10-13-08-24-17.html"

[[comments]]
order = 5
subject = ""
author = "كشف وجه المرأة"
posted = "2009-10-13"
text = "كشف وجه المرأة من الاعجاز المستقبلي للاسلام<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــ<br />لا يخفي على احد ان اي امرأة الان لا بد ان تحمل عدة اثباتات شخصية وعلى سبيل المثال وليس الحصر<br />1) بطاقة شخصية<br />2) جواز سفر<br />3) كرنيه الكلية<br />4) كرنيه النقابة<br />5) رخصة قيادة<br />6) كرنيه العمل<br />الى اخره من الاثباتات الشخصية التي يجب ان تحملها المرأة ومثبت عليها صورتها وبالطبع لا بد ان تبرزها في حالة ما طلب منها ذلك للتحقق من شخصيتها"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018043621/http://www.20at.com:80/masr/2khbar/13695-2009-10-13-08-24-17.html"

[[comments]]
order = 6
subject = ""
author = "النقاب مصرى"
posted = "2009-10-13"
text = "جداتنا من 50 سنة فى مصر كانوا بيلبسوا الملاية اللف واليشمك واليشمك هو النقاب وكان لونة ابيض وعلى شكل الشبكة<br />وصور السيدات المصريات فى مظاهرات ثورة سعد زغلول سنة 1919 كلها باليشمك او النقاب<br />البركة فى قاسم امين ودعوتة لتحرير المراة فسمعت المراة كلامة ولبست المينى جيب والبيكينى ووجدت نفسها مهزاة ومسخرة فرجعت الى لبس جداتها المحترم<br />مش عايزين فلسفة<br />النقاب لبس مصرى اختفى فترة وعاد مرة تانية<br />تماما زى كل شىء ما بيعود لاصلة"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018043621/http://www.20at.com:80/masr/2khbar/13695-2009-10-13-08-24-17.html"

[[comments]]
order = 7
subject = ""
author = "فسادالمشايخ"
posted = "2009-10-13"
text = "شيخ الازهر انتقد المنتقبات وطلب من البنت ان تخلع النقاب فى الفصل<br />ثم مر اسبوع<br />واول امس صرح انة ليس ضد النقاب وانة حرية شخصية وللبنات ان يرتدوة متى شاءوا<br />هو احنا فى شادر بطيخ<br />والا سوق سمك<br />مرة يتهجم على النقاب ومرة تانية يقول لك لا دى حرية شخصية<br />هو الفساد طال مشايخ السلطة<br />والتخبط صار سياسة حكومية عامة<br />على العموم الشعب فقد الثقة فى كل اوباش الحكومة ويقولوا اللى هم عايزين يقولوة والشعب يعمل اللى هو عايزة<br />لا ثقة بين الحكومة والشعب<br />ودن من طين واخرى من عجين"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018043621/http://www.20at.com:80/masr/2khbar/13695-2009-10-13-08-24-17.html"
