[[comments]]
order = 6
subject = "هو سكتناله دخل بــ...؟!!"
author = "واحد معدي"
posted = "2005-11-22"
text = "ولا : انا مش براء ،<br />ثانيا : ربنا يسامحك علشان أنت بتشتم أعز أصدقائي<br />ثالثا : ابقى روح لدكتور نفساوي علشان أنت مش بس عندك انفصام شخصية ، ده انرباع!!<br />رابعا: لما سعادتك مش عاجبك الكلام اللي بيتقال ، ليه بتتعب نفسك و تفتح الاختراع المسمى متصفح الانترنت ، و تاخد من وقت حضرتك \"السمين\" و تكتب الـurl بتاع الموقع و تستنى لما يحمل و بعد كده تقرأ و سعادتك متضايق ، لا و تكلف خاطرك و ترد كمان ..<br />ده ايه التلذذ بالعذاب ده؟!!"
archived = "2007-08-17"
capture_url = "https://web.archive.org/web/20070817122808/http://egyvote.20at.com:80/article.php?sid=24"
