[[comments]]
order = 1
subject = "حاجة ساقعة . . بيبس"
author = "إسلام لطفي"
posted = "2006-02-09"
text = "أنا كان لي عم واحد - رحمه الله رحمة واسعة - وفي يوم دفنه وبعد انتهاء مراسم الدفن وتناول الغداء في الدوار كعادة أهل الريف توجهنا إلى منزلناواحسست بالعطش<br />وطبعاً لأننا (قاهريوا النشأة منوفيو الجذور) لم نستسغ طعم المياه فعرضت على ابن عمي - مقدم بالجيش المصري - ان نبعث من يشتري لنا مياه معدنية وأخرجت النقود واصررت ان ادفع واقسم هو ان يدفع وفي غمرة التسرع والتسابق على الدفع تلعثم كلانا فقلت انا للولد \"هات لنا 15 عصير أي حاجة\" في حين تحمس هو وقال \"لالا هات صندوق حاجة ساقعة احسن علشان لو حد عطش تاني\"<br />طبعاً لم نحس بالجريمة اللي ارتكبناها الا عند صراخ زوجة عمي وهي ترى الولد بيلف بصندوق بيبسي على المعزين المتواجدين داخل المنزل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112841/http://www.20at.com/article2.php?sid=397"

[[comments]]
order = 2
subject = "يالهوي"
author = "sweet_princess"
posted = "2006-02-15"
text = "مامتي كانت رايحه تعزي في زوج واحده زميلتها في الشغل واول ما دخلت وجايه تسلم عليها وكانت معاها خالتي قامت خالتي قالت للست اللي المفروض بيعزوها<br />ربنا يرحمه ربنا يسعده في الاخره ويجعل مثواه جهنم<br />وماما اول ما سمعت كده اتفتحت في الضحك وماقدرتشي تحوش نفسها واستازنت بسرعه لان ساعتها الميت اتقلب مسرحيه كوميديا وكل الناس قعدت تضحك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112841/http://www.20at.com/article2.php?sid=397"

[[comments]]
order = 3
subject = "حماااااااار كبير"
author = "حسونا"
posted = "2006-04-24"
text = "جميل اوى الموقف بتاع يحيا الفخرانى فى العزا<br />وهو ده نفس اغلى حصل معايا فى عزا سيدى رضى الله عنه وارضاهلما شفت خالى وهو عاداتا يهزر معانا وكمدى للغايه اول مشفته فى العزا ابتسمت فى وشه ومقدرتش انى امنع الدحك بس كنت عيل المهم الله يرحم الجميع وحدوووووووووووووووو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112841/http://www.20at.com/article2.php?sid=397"
