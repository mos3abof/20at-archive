text = "انا لما كنت بدرس تاريخ في الكليه كان المدرس بتاعي يهودي كان بيكلمني عن ازاي ان المصرين اليهود اتخدو غدر<br />وان ليهم حق في مصر وحاجات كدا انا مصدقتهوش رحت لبابا وحكتلوه قالي فعلا علي ايام عد الناصر وكدا بس لسه لغايه دلوقتي حازة في نفسيتهم وعايزين يرجعو مصر اه والله ويخدو تراثهم هو اللي قالي كدا المدرس وبيحب مصر جدااااااااااااا اااا وكان بيكلمني شويه عربي ويعلمني شويه عبري ما علينا الحمد لله خلصت التاريخ واداني درجه كويسه جدا"
