posted = "2008-03-04"
text = "موجك هدار يا ياسر دمك ميهون خلفك زلزال سميتو سميح المدهون وانا وكل ابناء حركتنا الناضلة سوف نكون نار علا المحتلين مهما عملو بنا كان في جباليا ولا في جنين اننا الشعب الفلسطيني التائر لا يهتم لما اهتم لهو وهم انذال الدول العربية الكلاب انا فلسطيني فتحاوي اتشرف باصلي وداري انا وانتم يا انذال العرب سوف نرا من الذي يكون اشجع من اليهود في كل ما خلق الله سبحانة وتعالا اننا ابناء الفتح الميامين"
