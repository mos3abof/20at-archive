[[comments]]
order = 42
subject = "الرد على المسحين"
author = "فهد الا سلام"
posted = "2007-01-18"
text = "اولا بقوله مرة تا نية الى مش عا جبة يمشى لا نى البلد دى مسلمين واحنا مش بنجبر حد على حاجة انتو بتقولو ان احنا غزة شوف الغزة عملوا معا كم اية اولا خلصنكم من الر ومان عندما فتح عمر بن العا ص مصر اوصاة سيدنا عمر بن الخطاب ان لا يمس الكناس او اى من الا ديرة هذا هو اسلا منا انا مش بقول تمشوا بس الراى فى الا خر لالا غلبية انا مش بقول انى عربى ما يمكن جدى مصرى واسلم يبقى ملنش حق فى البلد دى وبعدين احنا بنعمل فى النور ولكن انتم الخبس والحقد ظا هر عليكم وعلى ما كل ما هو مسلم احنا بنقراء وبنطلع عليكم ولكن انتم لا احنا اولا بسيدنا المسيح منكم لا نى احنا نقدر المسيح عيسى ابن مريم ونعتبرة قدوة عظيمة فى تا ريخ البشرية ولكن انتم الهتوة وعذبتوة الا سلام دين حق وتسامح وكرم اخلاق ولكن انتم الى ماذا تدعون تدعون الى العرى والا نحطاط لا انكر ان بعض المسلمين الذين فرحوا بديكم بقوا مثلكم وايضا فية مسحين يعرفون الله حق انا مش بتكلم كلام وخلاص والله بتكلم عن فهم ودرية لا نى شغلتنى مسالة اين الحق كثير الا سلا م ام المسحية حكمو عقولكم اقرواء وادرسوا وتحروا الحق من البا طل ونحن لا نكرة احد ولا ندين احد ولكن انتم تردون فتنة وقتال ومرة تا نية ان مش اقصدى انى الى مش عا جبة يمشى من البلد ولكن هى كدة الى مش عا جبة يشوف الى يريحة واخر كلا مى الا سلام باقى بالله عليكم الم تسالوا انفسكم يوما لماذا الا سلام فى انتشر دايما وانتم فى ترجع كاملان الله يهدى من يشاء اى من يشاء ان يعرف اين طريق الهدية وسبحان الذى علمنا وجعلنا مسلميناخوكم فهد الا سلام"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

