[[comments]]
order = 4
subject = "هبل في هبل"
author = "ابو المناسي"
posted = "2007-01-14"
text = "يا جماعه انا عاوزكم ما تنسوش انكم مجرد اقليه عايشه في بلد اسلامي كبير<br />بمعني ان 5 مليون ما يقدروش يفرضو رايهم علي 70 مليون<br />و بعدين اضتهاد ايه و بتنجان ايه ده لو واحد مسلم ربي دقنه و بيروح يصلي علطول يتقبض عليه و يعتقلوه يعني المسلمين همه المضطهدين في البلد دي مش انتم ده اولا<br />ثانيا جميع احداث الفتنه الطائفيه الي حصلت الي بداها المسيحيين نفسم زي موضوع اسكندريه عملتم مسرحيه تتريقو فيها علي القران و المسلمين و لما الناس هاجت عليكو وكانت حتفشخكو اعدتو تقولو احنا مضطهدين و بتاع<br />الموضوع بساطه ان المسيحيين في خطبهم و كلامهم بيغذو روح الاحساس بالاختلاف في اولادهم و بان المسلمين وحشين و حياكلوكم و ابعدو عنهم الخ الخ الخ و الهبل ده كله<br />معتقدين ان لما يعملو كده حيصعبو علي امريكا و اسرائيل فحيساعدوهم علي الوصول للحكم و السيطره علي البلد و الدليل علي الكده الرساله الي بعتوها لشارون بيستنجدو بيه ايم موضوع وفاء قنسطنطين و المؤتمرات الي هاريينا بيها بتاعه مايكل منير الخنزير و الخونه اصحابه<br />انا بؤمن بالمبدا القراني (لكم دينكم و لي دين) بس الموضوع مستفز اويييييييييييي و زاد عن حده و دخل في مرحله الاستهبال<br />حسبنا الله و نعم الوكيل"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117015945/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 5
subject = "بدون انفعال"
author = "ايمن امام"
posted = "2007-01-14"
text = "تعليقا على ما جاء بالمؤتمر/ 1- هل من حق الاقليه ان تصادر حقوق الاغلبيه- بمعنى انه اذا كانت الاقليه ترى بأن هذه الماده تشكل اخلالا بحقوق المواطنه فأن الاغلبيه ترى انها تشكل هويه لدولتها- فأذا ماطرح الامر فى استفتاء شعبى فهل يتصور ان توافق الاغلبيه على الغاء هذه الماده - هل الديمقراطيه التى ننشدها ترى مصادره حقوق الاغلبيه ارضاء للاقليه - ام ان الاقليه ستطالب بعدمطرح هذا التعديل للاستفتاء- واذا ماحدث ذلك الا يعد ذلك تغليب لفئه على فئه بما يتعارض مع الديمقراطيه - وهل يتصور الحزب الوطنى انه اذا ما انساق وراء هذا الفكر المتطرف من الاخر انه اى الحزب الوطنى سيهناء بالاستقرار- 2- ماذا يضير المسيحيين من بقاء هذه الماده - نعم المواطنه هى معيار اساسى لعدم التفرقه- ولكن ما هى الهويه التى على اساسها ستصدر التشريعات عقب تعديل الدستور- بحيث نقول ان هذا التشريع قد انحرف عن المبادىء الاساسيه التى تلتزم بها الدوله - وهل نحن صادقين مع انفسنا عندما نطالب بالغاء هذه الماده 3- هل يوافق الاقباط على اخضاع ميزانيه الكنيسه لقانون اسوه بالازهر وجامعه الازهر - اليس من حق الدوله ان تعرف حجم التبرعات التى ترد الى الكنيسه واوجه صرفها - 4- هل يوافق الاقباط على ان يتم تعيين البابا بقرار جمهورى دون القرعه التى تجرى عند الاختيار- ودون تحديد اشخاص بعينهم من قبل الكنيسه5- هل يوافق الاقباط على ان تكون كافه المطبوعات وخاصه فى مدارس الاحاد تخضع لرقابه الامن وشروط اصدار ايه مطبوعات فى ضوء التشريعات المعمول بها حاليا6- هل يوافق الاقباط على ان يكون البابا موظف عام مثله ومثل شيخ الازهر - اى يجوز عزله وتحويله الى التقاعد- عده اسئله تدور بذهنى ولاتجد لها ردودا من الاخر سوى التلويح بالعصا الامريكيه والتهديد بأثاره النعرا<br />اقرأ بقية التعليق .."
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117015945/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 6
subject = "على الاقباط ..إلتزام الهدؤ.. والعقلانية !!"
author = "محمد"
posted = "2007-01-14"
text = "قبل أي كلام..في حقائق لازم توضع في موضعها..<br />اول هذه الحقائق..هي إن الاقباط اقلية في مصر..شاء أم ابى أي حد..وعلى اقصى تقدير بيقوله الاقباط..هما اقلية ..ده لو هتفترض انهم 15% من المصريين زي ما بيقولو<br />بناء عليه ..مفيش أي اقلية تقدر تفرض إرادتها على الاغلبية..ومحصلتش في اعتى الدول الديموقراطية..<br />ثاني شئ..الاقباط غير مشاركين بالمرة في أي فعاليات سياسية..إلا بعض افراض ..ممكن يعدو على اصابع اليدين..وأغلبهم غير متدين أو غير مرتبط بالكنيسة..وده يرجع لسيطرة الكنيسة على المسحيين في مصر..وبيتم توجههم من الكنيسة بالرموت كنترول..<br />وبناءً عليه..الاقباط في مصر بيلعبو بالنار ..إلي ممكن تحرقهم..والمتضرر الاول منها الاقباط..لأنهم اقلية..<br />ونتخيل مثلاً لو عمل المسلمين زي ما بيعمل الاقباط ..وقاطعو الشركات المملوكة لأقباط..هيقف حالهم...<br />وعليه..الاقباط عليهم انهم يدمجو نفسهم في المجتمع ..بدل شغل الكيجيتو إلي البابا شنوده حابسهم فيه من اكتر من تلاتين سنة..طلع خلال الثلاثين سنة دي اجيال من الاقباط مشوه ومعندهاش قدرة على التفاعل مع مجتمعها ..مرعوبين..وعندهم ذعر من المشاركة..<br />وعن خبرة في مجال التدريس..الطلاب والتلاميذ الاقباط في المدارس المصرية ..بيتم تحذرهم من التعامل مع المسلمين ومصادقتهم..مش عارف ليه..وبالتالي بيطلع اجيال معندهاش قدرة على التفاعل والمشاركة..وبيطلع التلاميذ لمرحلتي الاعدادي والثانوي ..إطوائيين..وعندهم بلاده..ممكن يكونو متفوقين..ولكن غير سويين تربوياً ونفسياً...<br />والدليل إن اغلبهم معنوش قدرة على ادارة حوار جيد إلا من وراء حجب..وتلاقيهم بس عمالين يهللو في منتديات الكترونية ...أو داخل اسوار الكنيسة ..لا أكثر ولا اقل...<br />شاركو قبل ما تنقرضوا يا اقباط ..وبطلو تسمعو كلام دعا<br />اقرأ بقية التعليق .."
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117015945/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 7
subject = "وبصراحه من الاخر"
author = "طارق الوزير"
posted = "2007-01-14"
text = "تابعى كنيسه شنوده هم من يستغلون لفظ قبط<br />وهى لاتعنى مسيحى فقط بزنس للتسويق لاقباط<br />المهجر انهم السكان الاصليين واحفاد الفراعنه<br />فقط والاخرون المسلميين مغتصبون لمصر وهم<br />غرفوا من الاقتصاد حتى الثماله بعد تركهم<br />السياسه وعندالعدوان الثلاثى اشتروا من<br />الاجانب بعد تركهم مصر ممتلكاتهم برخص التراب<br />وكونوا ثروه ضخمه وما اممه عبد الناصر بسيط<br />وهم عوضوه من استثمارات بدول الخليج وليبيا<br />وتوريد الحب ايضا ولن ازيد...وجاء شنوده<br />وهو المسؤل عن اخصاء الاقباط سياسياليصبح<br />زعيما سياسيا..ويستخدم اقباط المهجر(<br />زراع )عسكرى ليلوى الحكومه المصريه ويحاول<br />فرض اشياء مثل الغاءالماده الثانيه وهى فى<br />الاساس للمشرع فى القانون والمضحك انه احتمى<br />بها لكى لاينفذ حكم المطلقيين !!!وتابعى شنوده هم فقط<br />5% والمسيحيين كلهم 7% من جمله الشعب المصرى<br />وحسب الاحصاء الاخير وتلك صدمه لهم وعلى<br />الحكومه نشرها اذااستهبلوا اكثر وهم<br />يستعبطون بعد 11 سبتمبر واخيرا واخيرا<br />اسطوانه وموال الاضطهاد لن ينتهى ابدا لان<br />(مصر القبطيه) فى داخلهم وليست (مصر<br />العربيه الاسلاميه)التى يعيشون عليها"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117015945/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 8
subject = "للعلم"
author = "طارق الوزير"
posted = "2007-01-14"
text = "الاخوين (المستشار جبرائيل والمحامى العالمى نخله) هما وصله بين كنيسه شنوده واقباط المهجر..وسيبكم من حكايه المنظمه المصريه دى كلها ستار للتحرك والشو الاعلامى فى مصر.وتابعوا مواقع المبرشميين ..وهى اتحاد المشرشحين بويسرا بقياده المشرشح عدلى لدماء الشهداء المصريين فى حرب 73واللى قال هولعها فى مصر فى دريم !!!وهيئه الاوساخ بامريكا وفروعها وتضم نخبه من الصيع والمتاجرين بكلمه قبط علما بان مؤسسها كراس قتل من مافيا امريكيه ولن ازيد واخيرا فضائيه بقلظ الشهيره وهى لمهاجمه الاسلام للترويج للمسيحيه الضاله وهى اخر اختراعات البرشمه ..وانا جاهز لاى واحد مبرشم يكذب ما اكتبه"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117015945/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 9
subject = "اصلهم مصرى او اصلهم رومانى"
author = "كلهم بيربوا اولادهم على الانعزالية والعقد النفسية وعدم الاختلاط بالمجتمع والعيش فى اوهام واحلام يقظة مفرطة"
posted = "2007-01-15"
text = "والولد بيحذر من التعامل مع المسلمين<br />فى المدرسة والكلية والمجتمع<br />ولكن حدث فى قريتى شىء عجيب جدا لا تصدقوة<br />انتقلت الى الوحدة الصحية فى قريتى ممرضة نصرانية من المدينة القريبة جدا وزوجها يعمل خياط وسكنوا فى القرية<br />وعندهم ولد صغير عمرة اربع سنوات اسمة ابانوب<br />الاطفال فى القرية فى هذا السن يذهبون الى الكتاب وهو مكان لتعليم القراءة والكتابة وحفظ صور القران الصغيرة<br />والكتاب عملة شاب كان فى الخارج وفية اجهزة كمبيوتر والعاب وبرامج دينية يعنى تقدر تقول حضانة على مستوى قرية<br />ولم تجد الام مكان لابانوب غير الكتاب حتى تعود من عملها<br />كان بيروح الكتاب يلعب بالكمبيوتر ويتعلم الحروف ويصاحب العيال ويلعب معاهم<br />وكبروا العيال<br />ابا نوب ظل نصرانى ولكن بلا عقد بيدخل بيوت القرية لاصحابة وعندة صداقات قوية معاهم وما عندوش مخاوف ولا رعب داخلى موهوم<br />العزلة تؤدى الى الاكتئاب والانتحار والهروب<br />عيشوا عيشة شعبكم وبلاش اوهام كدابة"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117015945/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
