text = "اولا انتم ما صدقتم ان فهد قال كلمة غلط تشبطوا فيها ولا ايه عيب يا حضرات ولا انتوا متعودين على كده تولعوها و خلاص ثانيا انتوا مالكم زعلانين ليه من المادة الثانية يا حبايبى ده المفروض انكم تبوسوا ايدكم وش و ضهر و قفا كمان عشان ان يكون الدين الاسلامى المصدر الاساسى للتشريع فهذا يعنى ان لا مساس بحقوق المواطنة او المساس بدور العبادة المختلفة عن الدين الاسلامى ثم ان امركم عجيب ده انتم واخدين حقكم و بزيادة كمان ولا انتم عايزين تعملوا حاجة غلط و خايفين من ان تقعوا تحت طائلة القانون ايها الحاقدون و لا اعنى بالحاقدون كل الاقباط فلتذهبوا ال اقرب كبانيه و تشدوا على نفسكم السيفون اىىىىىىىىىىى"
