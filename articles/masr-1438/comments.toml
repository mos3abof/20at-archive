[[comments]]
order = 40
subject = "من المهضوم حقه"
author = "احمد"
posted = "2007-01-17"
text = "بسم الل والصلاة والسلام على سيدنا محمد واله وصحبه وسلم اما بعد<br />اذا كان تعديل الدستور فى اى دولة فى العالم لا بد ان يطرح للتصويت او الاستفتا عليه من الشعب فان المادة الثانية من الدستور لا بد ان تكون اول مادة وليست الثانية لعدة اسباب اهمها<br />لا يغقل ان يفرض اربعة مليون خلاص ما تزعلش على اقصى تقدير 7 مليون هويتهم على 70 مليون مسلم<br />انتم لستم مضتهدين نحن المهضوم حقوقهم فى عهدالخراب عهد مبارك لانه دللكم واعطاكم اكثر من مجرد حق مواطن نحن نطلب المساوات هل تعرفوت ان الكنيسة مفنوحة 24 ساعة وتجمع تبرعات بحرية وتوزع على محتاجى الكنيسة اما المسجد فلا والجمعيات الاهلية الاسلامية لا تستطيع جمع تبرعات لمساعدة الارامل واليتامى والمحتاجين من المسلمين هل هذا عدل فى بلد اسلامى؟<br />نقطة اخرى البذائات وقلة الادب فى مواقع القباط ومنتدياتهم ويكفى ما فى البالتوك هل هذا يبنى علاقى سليمة بين شركاء فى وطن واحد"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

