[[comments]]
order = 44
subject = "كلنا مجانين"
author = "الجاهل الاول"
posted = "2007-01-18"
text = "بصراحه<br />ومن الاخر<br />وعشان محدش يزعل سوا مسلمين او مسيحيين<br />الجدل فى المواضيع الدينيه دى مش سهل و مش بالطريقه دى ومش حته الردده هو اللى هيغير الدنيا ، وكمان و من غير زعل - ولا ان حتى زعلتوا اتفلقوا - الكلام ده مش بتاعكو ولا انتو قده ولا تفهموا فيه الكلام ده عاوز ناس علماء و فاهمين و قبل كل شىء عقلاء و محترمين وعندهم استعداد لتقبل الراى الاخر مهما كان و مناقشته ،<br />اما هؤلاء الهايجين دائما امثال مسيحى وليس نصرانى الاحمق الذى يشتم و يسب ظنا منه انه بهذا يدافع عن المسيحيه او الجاهل فهد الاسلام الذى يظن انه اعلم العلماء ويدافع عن الاسلام ، هؤلاء ومن مثلهم من<br />الجهاء<br />المتعصبين<br />الاوغاد<br />الحمقى<br />المضللين<br />فيحسن ان يسكتوا و يتعلموا اولا ثم يتحدثوا باسلوب اكثر احتراما من هذا<br />جاتكم القرف كلكم يا حفنه من المتخلفين<br />عرفتم ايه سبب تخلف مصر ، العيب لهو حكومه و لا حزب و لا كلام من ده العيب فى عقليتنا احنا التى استسلمت للجهل و التعصب و اصحاب المصالح.<br />الفتنه كانت نائمه ، لعن الله ( ولاد البلد ) من ايقظها."
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

