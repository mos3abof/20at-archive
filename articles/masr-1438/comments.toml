[[comments]]
order = 1
subject = "تحيا الهلال مع الصليب"
author = "mado"
posted = "2007-01-13"
text = "تحيا الهلال مع الصليب هود دا الصح مش الاخوة الاقباط الي فاكرنا متربصين بيهم وبنكرهم هما حطين في دماغهم كدا.وعاملين يلعبو علي وتر الاطضهاد والظلم وعدم المساوة ودا غير حقيقي.وهو دا طبعا حال بعض الاقباط مش كلهم.المفروض حكايةديانة الدولة الاسلام دا الطبيعي لكذا سبب واهم واحد فيهم الكثافة السكنية المسلمة.صح.ولا هنسيبها كدا علي البحري مينفعش.وكمان الاقباط طول عمرهم عيشن معنا ايه فرق يعني لما نغير في الدستور اظن دي حاجة هايفة.وياريت الناس الي بتلعب علي وطر الفتنة الطائفة وتأجيج المشاعر ضد المسلمين والمسحين يتهدو شوية. الناس دول من الجانبين. بس بصراحة الجانب القبطي اكتر. وربنا يستر علي مصر.ونفضل ديما عايشن في سلام مسلم وقبطي"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117015945/http://masr.20at.com:80/article.php?sid=1438"

