[[comments]]
order = 33
subject = "الحمير لسه بخير"
author = "مسيحى وليس نصرانى"
posted = "2007-01-17"
text = "اولا نحن مسيحيين ولسنا نصارى لاننا لسنا من الناصرة والناصرة دى يابهايم هى بلد ميلاد الهنا ومخلصنا يسوع المسيح انا ملاحظ ان كل ماتيجى سيرة حقوق الاقباط يحصل هيجان عند الاخوة المسلمين ويبان الغل والكراهية المتخفية خلف الاقنعة المزيفة بالحب والسماحة خخخخخخخخخخ المهم المسلمين يتحدثون عن العنصرية ضدهم وان العالم كله مقلوب عليهم وان ابونا زكريا بطرس بيخيطهم على قناة الحياة وان البابا بندكت حط ليهم حاجة وحشة من ورا وهما حرام عندهم من ورا مع اعتذارى للاخوة الخولات من الخليج وانا باقول اخوة لاننى احترم حقهم انهم خولات يعينى المهم اولا الاخ العبيط اللى بيقول ان تعداد الاقباط 5 مليون هوانت يا روح امك كنت عديتهم ولافى حدحاطط الوهم ده فى دماغكم اعلموا ايها البهايم ان فى مادة فى الدستور تمنع عمل تعداد على اساس طائفى يعنى لم يحدث ان فى احصائية ولا بطيخ وهنفترض ان عدد الاقباط 5 مليون بس شوف بقى الحلاوة تعليم ثقافة فلوس امريكا وعلى فكرة انا عارف ان المسلمين ولا عندهم سماحة ولا حاجة دول خايفين من امريكا تنط عليهم زى العراق كده مش عشان سواد عيون الاقباط واسمحوا لى اقولكم كسم امريكا على كسمكم لان اللى بيحمينا ومخلينا معاكم بقالنا 1400سنة من ساعت ما توغلتم فى العالم زى الايدز هو اللى انتم ماتعرفوهوش هو ربنا اللى بنعبده صح مش اللى بيصلى على نبى قال ايه الله وملائكته يصلون على نبى مجرد بشر ايا كان قدره عندكم وخلوا بالكم انا مباشتمش فيه عشان محدش يزعل انا مجبتش سيرته خالص فانتم احرار فى اختيار مصائركم وعلى فكرو ما بعد الموت ابدية لا نهاية لها فالنعيم ابدى وجهنم ايضا ابدية فانتم احرار الهنا حى بشهادة قرانكم (سلاما له يوم ولد ويوم يموت ويوم يبعث حيا) ايه رايكم بقى اظن ماسهل لغة السفالة وقلة الادب وممك<br />اقرأ بقية التعليق .."
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 34
subject = "الفتح الاسلامى العظيم"
author = "الفتح الاسلامى العظيم بنى حضارة عريقة"
posted = "2007-01-17"
text = "عندما يدخل بلدا يبدأ فى البناء<br />فى مصر بنى مدينة الفسطاط التى هى اصل القاهرة<br />وبنى الكوفة والبصرة وبغداد فى العراق<br />وبنى الرباط والقيروان فى المغرب<br />الاسلام بنى المدن والعواصم<br />وعندما بنى مدن الاسلام لم يكن متعصبابل سمح ببناء كنائس فى مدنة<br />والدليل الكنائس الموجودة فى مصر القديمة<br />الاسلام دين بناء المدن<br />فى كل مكان بنى مدينة وعمر وانشأ<br />وكلة من زكاة المسلمين<br />وحينما فرض عشر الزكاة على غير المسلمين يقولون جزية عايزين يعيشوا سفلقة وببلاش<br />مصر حصن الاسلام<br />وستظل درعة القوية رغم حقد الخنازير"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

