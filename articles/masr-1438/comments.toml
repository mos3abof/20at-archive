posted = "2007-01-17"
text = "أنا مش عارفه اللي انتو فيه دا هبل ولا استهبال كل ما تتكلموا تقولوا اغتصبتم مصر انتوا اكيد مش فاهمين أي حاجه ولا دا من العقد والشراشيب اللي عندكوا ومن قلوبكوا اللي مليانه سواد لذلك اليكم بعض الحقيقه :<br />عدد المسلمين اللي دخلوا مصر كان قليل جدا وظلت نسبة المسلمين قليله وظلوا أقليه لفترات طويله لكن من الطبيعي أن يدخل أهل مصر في دين الله أفوجا (أهل مصر اللي عايشين فيها أصحاب البلد يعني أصبحوا مسلمين يعني هما نفسهم أصبحوا مسلمين واخدين بالكم أصحاب البلد اللي كانوا مسيحيين بقوا مسلمين ....مسلمين ....مسلمين)<br />وطبعا حتي الان وبرغم الظروف الصعبه اللي بتمر علي المسلمين فيه ناس كتير ربنا بيهديهم و بيدخلوا الاسلام وبيعانوا الامرين علشان يظلوا علي دين الحق"
