[[comments]]
order = 52
subject = "الي بنت البلد"
author = "مصري أصيل"
posted = "2007-01-21"
text = "أولا مقالاتك مضروبة وأونطة لأن المسلمين عمرهم ما قتلوا شيخ ولا أمراة ولا طفل ولا راهب لان هذه هي أوامر الرسول محمد صلي الله عليه وسلم فهذا يعتبر اثم عظيم قتل هؤلاء في الاسلام وبعدين ازاي جيش مكون من 4000 رجل مسلم قدر يحول شعب ويغيره من المسيحية الي نور الاسلام الا عن اقتناع بسماحة الاسلام واظن سمعتي عن استدعاء امير المؤمنين عمر بن الخطاب لعمرو ابن العاص وابنه الذي ضرب احد الاقباط واشتكاه الي عمر بن الخطاب فاستدعاهم جميعا وامر القبطي ان يقتص ويضرب ابن حاكم مصر عمرو بن العاص هذه هو عدل وسماحة الاسلام واحترام حقوق الاخر وهو ماجعل المسيحيين يدخلون في دين الاسلام أفواجا وليس الجزية كما تقولين لا نها كانت ميزة كبيرة لهم فقد حمت ارواحهم من التجنيد في جيش المسلمين الاسلامي لان الجهاد في الاسلام لرفع راية لا اله الا الله محمد رسول الله وانتو طبعا ماعندكوش استعداد لكده فالجزية وفرت عليكم هذا الجهد العظيم الذي تحمله المسلمون دونكم زائد دفع الزكاة ولا انتو عايزين تعيشوا وقتها كده مميزين دون اي أعباء وبعدين وجود الاديرة والكنائس القديمة اليالان لهو اكبر دليل علي سماحة الاسلام معكم وحسن تعامله هذا هو السبب الاكبر من تحول أجدادي المصريين وانا أحد احفادهم من ظلام الاديان الاخري الي نور الاسلام هداكي الله وأنار بصيرتك"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122081520/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 53
subject = "الى مصرى أصيل"
author = "بنت البلد"
posted = "2007-01-22"
text = "تعرفوا ايه مشكلتكم أن لما تعرفوا حقيقة ديانتكم تقولوا دا كلام افتراء<br />طيب روح أقرا كتب سيد القمنى وهو مسلم على ما اعتقد وانت تعرف دينك كويس<br />وعاوزة اقولك ان وجود الأديرة والكنائس بعد الغزو الأسلامى لا يعتبر سماحة منكم لا أن دل فهو يدل على قوة ايماننا بالهنا يسوع المسيح ولو ما انت مش عارف روح اقرا عن معجزة نقل جبل المقدم ولا دى برده مش فى تاريخكم او اسال عن المعز لدين الله الفاطمى"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182326/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 54
subject = "ألى السيد مصرى اصيل"
author = "بنت البلد"
posted = "2007-01-22"
text = "هذه مقالة لسيد القمنى ارجو قرائتها<br />طرح السؤال يعنى أن المريض يبحث عن إجابة:<br />د. سيد القمني: عروبة مصر \"عبودية لاحتلال طال أمده أكثر مما ينبغى\"<br />GMT 7:48:34 2004 السبت 14 فبراير<br />ياسر عبد الحافظ من القاهرة: مثلما أوردت وكالات الأنباء وفصلت إيلاف، أمام لجنة شؤون الأحزاب المصرية الآن أوراق حزب يقوم برنامجه على رفض عروبة مصر.<br />وذلك سيبدو غريبا للكثيرين، وغالبية المصريون سيعتبرون هذه الدعوة نوع من الجنون أو الكفر فقد ارتبطت عقيدة الإسلام بالانتماء العربى. أفكار هذا الحزب ليست بالجديدة لكنها عادت هذه الأيام مثيرة جدل صاخب: نحن لسنا عربا بل مصريون، الفتح العربى لمصر لم يكن سوى احتلال، ارتباط مصر بالعرب أدى لتراجعها ونسيانها لقيمها الحضارية. هكذا، يرى المؤيدون لهذه الدعوة أن مصر ضحت بكل تاريخها وخضعت لأفكار محتل سلبها شخصيتها المتفردة.<br />تستحق هذه الرؤى التعرف عليها ومناقشتها والرد عليها بما يغنى القضية الأساسية وهى الهوية الضائعة لكل بلد عربى، تلك التى شوهتها الرغبات الفردية فى إقامة وحدة شكلية تتناسى ما لكل شعب من خصائص وطرق حياة لن يقبلها غيره بالضرورة.<br />د.سيد القمنى مفكر مصرى معروف وقد أجرت معه إيلاف حوارا مطولا منذ عدة أسابيع، وهو واحد من الذين يقولون بأن عروبة مصر \"عبودية لاحتلال طال أمده أكثر مما ينبغى\" وقد شرح هذه الرؤية فى الدورة المنقضية لمعرض القاهرة للكتاب. تصلح رؤية القمنى تلك لأن تكون مانفستو للحركة التى بدأت تضم إلى صفوفها مثقفين من تيارات مختلفة ربما لأنها الحل الوحيد من أزمة<br />خانقة ومهينة تحيط بكل العرب، قد يبدو فى طرحها الآن أنانية ما، غير أن هذا لم يعد مه<br />اقرأ بقية التعليق .."
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182326/http://masr.20at.com:80/article.php?sid=1438"

