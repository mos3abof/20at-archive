[[comments]]
order = 56
subject = "جدل جديد للمفكر المغربى محمد عابد الجابرى"
author = "بنت البلد"
posted = "2007-01-23"
text = "المفكر المغربي محمد عابد الجابري يثير جدلاً جديداً: القرآن الكريم «محرف»<br />الخميس, 28 سبتمبر 2006<br />فجر الدكتور محمد عابد الجابري أستاذ الفلسفة بجامعة محمد الخامس بالمغرب، مفاجأة بقوله:<br />«إن القرآن وقع به بعض التحريف، وأن علماء الإسلام السنة اعترفوا بذلك».<br />وقال الجابري في مقال له بعنوان «ما سقط وقيل عن القرآن»، نشر بصحيفة الاتحاد الإماراتية ونقله موقع العربية نت: «إن جميع علماء الإسلام من مفسرين وراوة حديث وغيرهم يعترفون بأن ثمة آيات وربما سوراً قد «سقطت» أو «رفعت» ولم تدرج في نص المصحف، وأنواع النقص في ذلك كثيرة».<br />وأضاف الجابري في رواية عن عائشة رضي الله عنها، أنها قالت كانت آيات سورة الأحزاب في عهد رسول الله صلي الله عليه وسلم، تبلغ نحو مائتي آية، فلما كتب المصحف لم يقدر منها إلا ما هي عليه الآن، وفي رواية أخري أنها قالت: «نزلت آية الرجم ورضاع الكبير عشراً، ولقد كانت في صحيفة تحت سريري، فلما مات الرسول «صلي الله عليه وسلم» وتشاغلنا بموته دخل داجن «شاه» فأكلها.<br />واستشهد الجابري بنحو ١٣ رواية تشير إلي أن القرآن وقع به نقص وتحريف، قائلاً: «يذكر القرطبي في تفسيره لسورة «التوبة» وعدد آياتها ١٣٠، وفي سياق عرضه للروايات التي تتناول عدم وجود البسملة في أولها رواية جاء فيها «أنه لما سقط أولها سقط بسم الله الرحمن الرحيم معه»، وفي رواية أخري عن حذيفة أنه قال «ما تقرأون ربعها أي سورة التوبة».<br />وأنهي الجابري مقاله المثير للجدل بقوله: «هذا ويعلل علماء الإسلام من أهل السنة ظاهرة سقوط آيات من القرآن بكونها داخلة في معني النسخ ،غير أن علماء آخرين أنكروا أن يكون ذلك من النسخ، وقالوا إن ما ذكر من الزيادة والنقصان في القرآن، يرجع إلي خبر ال<br />اقرأ بقية التعليق .."
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182326/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 57
subject = "الي بنت البلد"
author = "مصري أصيل"
posted = "2007-01-24"
text = "من هو سيد القمني هذا الذي تستشهدي به هل هو عالم اسلامي ام بوق غربي علماني رغم انه اعلن منذ عامين انه ندم علي كل كتاباته واعتزل الكتابة ناقص تستشهدي بسشلمان رشدي وهو مسلم اسما فاذا كان هؤلاء مسلمين اسما فهم خارجين علي الملة والاسلام الحق وبعدين انا ممكن استشهد لك مثلا بكتابات حمال أسعد عبد الملاك واثبت لك من كتاباته ان شنودة بتاعكم شخص اسلوبه ومبادئه كلها غلط في غلط وكذلك كتابات القس ابراهيم عبد السيد الذي رفض ان يصلي عليه شنودة شوفي مفيش حد هايزور التاريخ زي ما بتحاولوا تعملوا فعلي مدي 1400 سنة هي عمر الاسلام في مصر لم نسمع من اي مسيحي مصري اي مقاومة للفاتحين كانت هناك اول مادخل المسلمون مصر مقاومة محدودة من الرومان فقط انتهت في عدة اشهر ورحب اهل مصر بالفاتحين المسلمون لانهم كانو معذبين من الرومان سماحة وسعة صدر المسلمين هي التي ابقتكم انتم وكنائسكم حتي الان ووليس ما تسميه قوة ايمانكم وليس ماتسميه قوة ايمانكم واين كانت قوة ايمانكم لماذا لم تتصدوا ل 4000 رجل فتحوا مصر وعاملوكم بكل انسانية اما القصة الساذجة عن نقل جبل المقطم فهذا من خزعبلاتكم التي للاسف تصدقونها بكل سذاجة والا مكانش حد غلب واستعانت بكم القوي الكبري في العالم لنقل الجبال بهذة الطريقة الظريفة بلاش تخريف ومرة تانية أنقذي نفسك من مصير جهنم وربنا يهديكي لنور الاسلام"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182326/http://masr.20at.com:80/article.php?sid=1438"

