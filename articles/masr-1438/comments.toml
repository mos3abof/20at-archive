text = "فية عندك مشكلة تقول مسيحى<br />ولا انتا كعادة الاخوان غاويين تفتوا وخلاص<br />وبعدين مين قالك ان المسيحيين منعزلين انا ساكن فوق شقتى عائلة مسيحية واحنا اصحاب جدا جدا ووقت الصلاة بروح اصلى فى الجامع وهوا يوم الاحد بيروح الكنيسة<br />على فكرة دة الطبيعى بس اللى مش طبيعى اننا نفرض على الشخص ديانة لانى على حسي مانا فاكر ان ربنا حيحاسب الناس فى الاخرة مش احنا"
