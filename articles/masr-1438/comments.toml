subject = "اين الجزية"
author = "عطشان"
posted = "2007-01-17"
text = "الافندي اللى بيقول دينكم انتشر بالجزية سيبناكم تتكلموا على المسلمين و على الشريعة و على الاخوان كمان و دة يدل على اننا فعلا متسامحين لكن تسامحنا مش معناه انك تتكلم على الاسلام نفسه و ده يدل على تعصبك اما موضوع الجزية يا ابو جهل او يا ام جهل فالجزية اللى كانت بتفرضها الدولة الاسلامية على غير المسلمين اقل بكتير من الزكاة اللى كانت بتفرضها على المسلمين و الزكاة والجزيةكانوا بيتصرفوا على الضمان الاجتماعي والالا انت كنت عايزهم يعيشوا في المجتمع من غير مشاركة فية والا دة طبع نلبش وناخد مصالح لينا ومانفيدش المجتمع اللي عايشين فيه هي دي المواطنة؟ ياعم ياريت ايام الجزية ترجع ده انتم كنتم متنغنغين"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 26
subject = "اقراوا يا مسلمين شوية"
author = "بنت البلد"
posted = "2007-01-17"
text = "بدء الغزو -سنة 638م (2)<br />بعد تسليم بيت المقدس لعمر بن الخطاب، قابله عمرو بن العاص في(الجابية) قرب دمشق وألح في غزو مصر، لغناها وسهولة الاستيلاء عليها ، مؤكدا أنها ستكون قوة للمسلمين إذ هم ملكوها.<br />* الخليفة بن الخطاب يوافق على الغزو- ديسمبر639م (3)<br />وافق الخليفة وهو متردد على سير عمرو بن العاص لمصر، سار عمرو في جيش صغير من أربعة آلاف جندي (4000) حتى وصل إلى رفح وهي على مرحلة واحدة من العريش بأرض مصر، فأتت عند ذلك رسل الخليفة عمر بن الخطاب ، ففطن عمرو إلى ما فيها، فلم يأخذ الرسالة حتى عبر الحدود بين أرض مصر وفلسطين، وبلغ بسيره العريش، وهناك أتى له بالكتاب فقرأه ثم سأل من حوله أنحن في مصر أم في الشام ؟ فقيل له نحن في مصر. فقرأ على الناس كتاب الخليفة الذي يدعوه للمضي إذا كان قد دخل مصر ، أو العودة إذا لم يكن قد دخلها بعد ، فقال: إذن نسير في سبيلنا كما يأمرنا أمير المؤمنين.<br />* هدموا وأحرقوا وخربوا<br />الاستيلاء على بلوز (الفرما) وسقوط حصن بلبيس- يناير 640م (4)<br />وصل العرب إلى مدينة بلوز (برمون بالقبطية-الفرما بالعربية)، في نهاية سنة 639م ، وكانت مدينة قوية بها حصون وبها كثير من الآثار المصرية والكنائس والأديرة. وكانت تعتبر مفتاح مصر الشرقي. فبرز له راهبا البلاد، وهما أبو مريم وأبو مريام، ومعهم الأرطبون القائد الروماني الشهير الذي هرب من الشام ، ودار بين عمرو بن العاص وبين الراهبين حوار انتهى فيه عمرو لإمهالهم خمسة أيام للتشاور ، ولما تشاوروا فيما بينهم اتفقوا على القتال ورفض الجزية او الإسلام ، وخالفوا قائدهم العام المقوقس الذي غادرهم وتوجه إلى حصن بابليون، وخرج الأرطبون والراهبان ومن معهما لقتال المسلمين عند حصن بلبيس، وذلك بعد شهر من الحصار، فانتصر المسلمون وقُتل الأرطبون (5) .<br />اقرأ بقية التعليق .."
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 27
subject = "وكمان مقال علشان عيونكم وقلوبكم تتفتح"
author = "بنت البلد"
posted = "2007-01-17"
text = "هل رحب الأقباط بعمرو بن العاص<br />أشرف عبد القادر<br />ashraf3@wanadoo.fr<br />الحوار المتمدن - العدد: 1472 - 2006 / 2 / 25<br />هذا المقال ليس تأليفاً بل هو تجميع وتلخيص وربط لأهم ما كُتب حول هذا الموضوع من كتابات حول فتح عمرو بن العاص لمصر وما صاحبه من ملابسات، وأنا هنا أعرض حقائق منقولة من الكتب والمراجع التي هي من صميم أطروحة الدكتوراه التي أشتغل عليها والتي تحمل عنوان \"حقوق الأقباط الدينية وعلاقتها بعهد عمر\"، فلقد أوضحت في مقالي السابق \"الأقباط أصل مصر\" بأن كلمة أقباط أو قبطي، تعني مصري يشعر بانتمائه الحقيقي لمصر، القبطي المسلم، والقبطي المسيحي، فالدين أو العقيدة لا يمكن ولا ينبغي أن تغير الانتماء الحضاري للإنسان، فكلمة قبطي تعني مصري، فجميع المصريون أقباط، جزء أعتنق المسيحية وجزء أعتنق الإسلام، كما أوضح ذلك أكثر من مرة وفي أكثر من مناسبة، أحد كبار قادة المسلمين في مصر، خلال الخمسينات والستينات، وهو فضيلة الشيخ أحمد حسن الباقوري وزير الأوقاف الأسبق. لقد تعرض الشعب القبطي خلال تاريخه الطويل إلى أقصى ما يمكن أن يتعرض له أو أن يمر به شعب من شعوب الدنيا كلها، من المرارة والمعاناة والألم، تعرض الأقباط إلى مظلمتين خطيرين هما :<br />1 ـ مسخ الشخصية القبطية وفقدان الهوية والانتماء الحقيقي.<br />2 ـ تزييف التاريخ القبطي وتزويره أو إهماله وتجاهله.<br />لقد فرض على الأقباط التنكر لشخصيتهم الحضارية، ولغتهم وعاداتهم ودينهم بالحول مرة وبالحيلة مرة أخرى. وقع الأقباط بعد ذلك في مشكلة تحديد هويتهم، كما قال محمد حسنين هيكل، في مقال له في جريدة الأهرام سنة 68 وتحت عنوان: \"عن التجربة الديموقراطية في زماننا\":\"إن النظام المصري وقع في مشكلة تحديد الهوية المصرية ولم يستطع لفترة طويلة أن يصل فيها إلى جواب، وا<br />اقرأ بقية التعليق .."
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 28
subject = "مسلم +مسيحى=مصر"
author = "ابن المسيح واخ فى وطن جريح"
posted = "2007-01-17"
text = "اخوتى المسلمين فحقا انى اشعر انكم اخوتى وهذا ما تعلمه لنا الكنيسة قد قرئت كثير من التعليقات الكتوبة بالموقع واعجبت كثيرا بحبكم لدينكم ولكن ضعوا انفسكم فى موقفنا نحن المسيحين فى ظل الانتشار الاخوانى الرهيب فطلابة الازهر مثلا اول ماانقلبوا انقلبوا على اساتذتهم ودعوا على رئيس الجامعة بما تنفر منه الاذن اذن ماذا سيفعل الاخوان بالمسيحين؟ اعتقد انهم سينفذون دعواتهم عمليا فييتمون اولادنا ويرملون نسائنا بالاضافة الى ان عددالاقباط 25% وليس 7او 10% كما تعلن الحكومة فلماذا لاتكون مصر دولة دون مرجعية دينية ؟علما بان الدول المتقدمة هى الدول التى تطبق العلمانية تحيا مصر العلمانية"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

