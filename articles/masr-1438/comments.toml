[[comments]]
order = 37
subject = "نداء إلى كل المصريين ( فقط المصريين )"
author = "أنا عربي مصري"
posted = "2007-01-17"
text = "بسم الله الرحمن الرحيم والحمد لله الذي أنزل الرسالات السماوية على سيدنا موسى كليم الله - عليه السلام - وسيدنا عيسى - عليه السلام - إبن مريم العذراء وعلى أخر الرسل محمد بن عبدالله صلى الله عليه وسلم , أما بعد أولاً أنا أتوجه بكلامي هذا إلى المصريين فقط أبناء رجالات ثورة 1919 م , أبناء رجالات حرب أكتوبر الشرفاء والشهداء , أبناء رجالات كل عصور مصر الحرة الأبية , يا أبواق الطائفية لن تكون مصر عراق أخر أو صومال أخر , يا أبواق الطائفية تذكروا أن ثورة 1919 م كان يعظ بها القساوسة في المساجد ويخطب الشيوخ في الكنائس , يا أبواق الطائفية لقد حارب رجالات مصر جنبًاًإلى جنب في حرب 1984 م والعدوان الثلاثي الغاشم على بورسعيد الأبية التي لم ترتضي أن يدنسها قدم محتل غاصب , وكذلك كان الحال في نكسة 1976 فسقط الشهداء الأبرار ,ثم تلتها حرب أكتوبر المجيدة والتي بدماء شهداء مصر غسلت عار الهزيمة النكراء , يا أبواق الطائفية اللعينة إن مصر ليست هدفاً سهل المنال لكم ولأمثالكم , أخواني وأخواتي المصريين إننا اليوم لن ننحدر إلى هذا الحوار الذي لا يبث إلا رائحة تزكم الأنوف بطائفيتها البغيضة الكريهه إلى قلوبنا جميعاً .<br />أخواني أني لي الشرف في أنني لي أصدقاء نصارى أو أقباط لايهم كماأنني لي كل الشرف والإعتزاز كوني مسلم.<br />لا أعرف ما تلك السيفونية منكم جميعاً في محاولة زرع شقاق فقط من لا شيئ إلا أنكم جميعاً شباب وشاباتً تجرع الكراهيه من نفسه ولا يمكن أن نلقي اللوم على بعض الفئات المنحرفة من الكتاب التي تحاول أن تبرز من خلال بعض النفوس الضعيفة مثل هذا الكلام , فتارة الكلام عن مسلمين محتلين وتارة الكلام عن رومان متمصرين مالكم جميعاماذا دهاكم ؟؟؟؟؟؟؟ .<br />أني أتذكر كيف كان والدي أطال الله عمره يحكي عن ج<br />اقرأ بقية التعليق .."
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 38
subject = "الرد علي النصاري"
author = "مصري فخور انه مسلم"
posted = "2007-01-17"
text = "اولا انتو نصاري و دي مش شتيمه ده اللفظ القرأني الي بيصفكم<br />ثانيا اي حد فيكم لو بيعرف يقرا ياريت يقرا وصيه سيدنا ابو بكر كرم الله وجهه لجيش اسامه بن زياد من انه ما يقتلش شيخ و لا صبي و لا امراه و لا يقتل شاه او بعير و لا يحرق شجره الي اخره و ده مبدا المسلمسن و تاريخيا احنا الجيوش الوحيده في العالم الي معملتش اي مذابح في حروبها<br />ثالثا الاخت الي بتقولك حرقنا و موتنا و عملنا منين مصدر معلوملتك اساسا و هل خوخ مصدر موثوق فيه مانا ممكن االف كتاب اسميه حقيقه النصرانيه في مصر و اقول انكو جزارين و بتاكلو العيال الخ الخ<br />رابعا مادان المسيحيه رساله سلام الخ الخ تقدرو تقولولي ليه بوش الي المسيح بيجيلو في المنام و بيديلو نصايح قتل 700000 مسلم في العراق لحد الوقتي<br />خامسا لو احنا سفاحين و نشرنا الاسلام بالسيف ليه فيه لسه مسيحيين عايشين في مصر لغايه دلوقت كان زمانهم اتفنو<br />سادسا الاخ الي بيقول امريكا بتحميهم امريكا اكتشفت من 600 سنه يبقي بتحميكم من 1400 سنه ازاي<br />ملحوظه:1400 ده عدد اكبر من 600 لو انت مش عارف<br />سابعا الاخ الي بيقولك الصوفيين حرقو الكنايس اساسا الصوفيين دول فئه مبتدعه و ضاله و تنتسب زورا و بهتانا للاسلام و معظمهم حشاشين و خمورجيه و بيعبدو اولياء الله الصالحين و بيحجو للمقامات بتاعتهم و بيدبحو عندها و يطوفو حواليها و كمان بيدعو هم مش بيدعو ربنا يعني كفر و شرك رسمي<br />ثامنا لما الواحد يبدا يشتم علطووووووووول تعرف ان موقفه ضعيييييف اوي و مش عارف يرد فيبدا يعمل دكر عشان يداري علي خيبته<br />تاسعا (و الله متم نوره و لو كره الكافرون)<br />صدق الله العظيم<br />و اخيرا بما ان انا مش حستفاد حاجه لما سيادتكو تتحمصو في جهنم في الدرجه الرابعه او الخامسه مش فاكر فابدعيلكو ربنا يهديكو<br />اقرأ بقية التعليق .."
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

