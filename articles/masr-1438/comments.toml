text = "ان وجودالاقباط/النصارى/المسيحيين فى مصر لهو فائده لبعض المرضى النفسيين من اهل مصر المحروسه فهم فرصه لتفريغ العقد و القهر و الشعور الزائف بالقوه و التقدم<br />فمن حولهم اسرائيل تحكم و تتحكم و تفعل ما تريد و امريكا تسير العالم كما تشاء و اوروبا تتحد و تتفق و دول اسيا تعمل و تتقدم و حتى الدول العربيه وجدت فى هديه السماء الى باطن الارض من النفط ما يساعدها على النهوض و الارتقاء ، الا مصر ، فلا تقترن اخبارها الا باخبار الفساد و الاهمال و التحرش الجنسى<br />فوجد بعض الباحثين عن الامجاد الزائفه ضالتهم فى اقباط مصر فيا فلسطينيين انشغلوا بحربهم مع اليهود و يا ايران انشغلى بازمتك النوويه و نحن هنا فى ارض الكنانه نخوض معركتنا الخاصه ضد الاعداد من اهل البلد الاقباط وما ان نفرغ منها حتى نلحق بكم فى حربكم و نتفوق - فمصر الرياده -<br />فالاقباط وهم الاقل عددا فرصه لاستعراض القوى و تحقيق انتصارات باطله ، ومتى كان العدد عنصر ضعف ( فكم من فئه قليله غلبت فئه كثيره باذن الله ) فالاقباط لا هم الاكثر فقرا و لا هم الاكثر جهلا و لا المسلمين يتميزوا عليهم جسمانيا فى شىء انما الاثنين يتشاركان كل مظاهر القوه او الضعف فى البلد وحتى جغرافيا تجد اختلاط بين الطرفين على امتداد مصر قد تختلف النسبه من مكان الى اخر ولكن لا تستطيع ان تصف مثلا محافظه بالمسلمه او المسيحيه كما فى بلاد اخرى ، اما النغمه السائده الان و التى تصور و كان الاقباط جنس اخر يعيش بيننا فهذا امر غير مسبوق و غير مبرر.<br />ولكنها الرغبه فى خلق عدو ضعيف و تحقيق انتصارات على حسابه ، يجملون بها انفسهم امام ما يلاقونه من هزائم سياسيه و عسكريه حتى علميه امام الغرب.<br />وتدعيما لهذه النقطه تجد بعضهم يحاول ان يحسب الاقباط على الغرب باى شكل من الاشكال فه<br />اقرأ بقية التعليق .."
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

[[comments]]
order = 46
subject = "حوار هابط"
author = "ايمن امام"
posted = "2007-01-18"
text = "كنت اتمنى ان يكون مستوى الحوار مهذبا وليس شتائم بذيئه- ولكننى اعلق الان فقط ردا على الاخت بنت البلد- التى ترى فى نفسها المؤرخ الاوحد - انا مستعد لمناظرتك فى هذا الموقع شريطه ان تلتزمى بالمعايير العلميه للمناقشه- والا تكونى رأيك بناء على استنتاجات - من فكرك - 1- هل غزى عمرو بن العاص مصر ام فتح مصر<br />2- هل تعرض المسيحيين فى مصر للاضطهاد فى الحكم الاسلامى وادلتك التاريخيه على هذا<br />3- هل تعرضت الكنائس فى مصر للتدمير بفعل الخليفه وجيوشه<br />4- هل اجبرالمسيحيين على اعتناق الاسلام- ودليلك<br />5- هل اجبر الباباوات على استبعاد نصوص من الاناجيل المعمول بها ارضاء للوالى<br />6-هل اجبر المسيحيين على تغيير اسمائهم الى اسماء اسلاميه<br />7- كم عدد المسيحيين فى مصر عند الفتح الاسلامى - او الغزو الاسلامى كما يحلو للبعض تسميته<br />8- بماذا تفسرين بقاء كل هذه الملايين من المسيحيين على مدى مئات السنين بعد الفتح الاسلامى<br />9- هل كانو من القوه التى تمكنهم من مقاومه الفاتح او الغازى بعد الفتح او الغزو<br />10- هل هناك وقائع تاريخيه تثبت ان هناك مقاومه استمرت بعد الفتح او الغزو /<br />ياسيدتى الفاضله ارجو ان تشرحى لنا فنحن متشوقين لسماع رأيك ردا على هذه الاسئله ولا تظنى تجاهل الرد عليكى هروب من مواجهتك لان ذلك يعد تضخيما للذات/ ايمن امام"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122081520/http://masr.20at.com:80/article.php?sid=1438"

