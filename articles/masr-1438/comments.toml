text = "من ردك هذا افهم انك قرات المقالات اللى انا ارسلتها وهذا سبب لك حالة من الخروج عن الأدب العام والتلفظ بألفاظ غير محترمة واعتقد ان الدين الأسلامى لا يحث على الشتيمة ولا ايه رائك<br />ممكن تبقى تكتب اسم لك علشان اعرف احاورك كويس"
