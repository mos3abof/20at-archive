subject = "ضربات عباد الرحمن على شبهات بنت البلد وعباد الصلبان"
author = "يسوع عبد الله ورسوله"
posted = "2007-01-26"
text = "قال عز وجل بل نقذف بالحق على الباطل فيدمغه فإذا هو زاهق ولكم الويل مما تصفون<br />بلغنى ما كتبت أيتها الفتاة التى تدعى بنت البلد وأقول وما توفيقى إلا بالله جنت على نفسها براكش<br />ما صحة حديث عائشة رضي الله عنها التي روت فيه أن الداجن قد أكلت من نسخة القرآن التي كانت معها ؟<br />بسم الله والحمد لله والصلاة والسلام على رسول الله<br />أما بعد ،،،<br />كثيراً ما يستشهد أعداء الإسلام للتشكيك في نقل القرآن بحديث عائشة والذي جاء فيه : (( لقد نزلت آية الرجم ، ورضاعة الكبير عشراً ، ولقد كان في صحيفة تحت سريري فلما مات رسول الله صلى الله عليه وسلم وتشاغلنا بموته ، دخل داجن فأكلها ))<br />والحق أن هذا الحديث لا يصح فإما ذكر الرضاع فيه غلط ، وقد أخرجه ابن ماجه ( رقم : 1944 ) وأبو يعلى ( رقم 4587 ، 4588 ) من طريق محمد بن اسحاق ، عن عبد الله بن أبي بكر ، عن عمرة ، عن عائشة .<br />وعن عبدالرحمن بن القاسم ، عن أبيه عن عائشة ، به .<br />قلت : ابن اسحاق صدوق ، ومن كانت هذه صفته فإن حديثه يكون في درجة الحسن بعد النظر الذي يخلص منه إلى نقائه من الخلل ، كذلك هو رجل مشهور بالتدليس مكثر منه ، يدلس عن المجروحين ، وشرط قبول رواية من هذا حاله أن يذكر سماعه ممن فوقه فإذا قال ( عن ) لم يقبل منه .<br />وابن اسحاق له في هذا الخبر إسنادان كما ترى ، وجمعه الأسانيد بعضها إلى بعض وحمل المتن على جميعها مما عيب عليه ، فربما كان اللفظ عنده بأحد الإسنادين فحمل الآخر عليه ، لأنه حسبه بمعناه ، وقد لا يكون كذلك .<br />قيل لأحمد بن حنبل : ابن اسحاق إذا تفرد بحديث تقبله ؟ قال : (( لا ، والله إني رأيته يحدث عن جماعة بالحديث الواحد ، ولا يفصل كلام ذا من ذا )) ( تهذيب الكمال ( 24 : 422 ) .<br />نعم ربما كان يرويه تارةً فيذكر أحد إسناد<br />اقرأ بقية التعليق .."
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182326/http://masr.20at.com:80/article.php?sid=1438"

