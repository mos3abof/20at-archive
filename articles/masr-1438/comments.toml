[[comments]]
order = 30
subject = "مقالات هامة لكل مسلم"
author = "بنت البلد"
posted = "2007-01-17"
text = "اضطهاد الأقباط فى مصر بعد الفتح الإسلامى<br />احمد صبحي منصور<br />قصة هذا البحث<br />1-فيما بين 1977-1980 كنت فى صراع مع شيوخ الأزهر، كانوا يصممون على تغيير ما كتبت فى رسالتى للدكتوراة لأنها تنشر حقائق لا يريدون اظهارها،وأنا مصمم على مناقشة كل المسكوت عنه طلبا لأصلاحه. كان من بين ما أثار حفيظتهم فصل فى الرسالة عن التعصب الدينى ضد الأقباط فى مصر المملوكية بتأثير شيوخ التصوف. أخيرا وصلنا الى حل وسط فى صيف 1980 وبمقتضاه حذفت ثلثى الرسالة، وهما بابان كبيران عن أثر التصوف الدينى والأخلاقى. واكتفيت ببحث آثاره السيئة فى النواحى السياسية والاجتماعية والعلمية والعمرانية..الخ. بمقتضى الاتفاق كنت ملزما بحذف فصل التعصب الدينى لأنه يقع فى الباب الدينى، لكننى احتلت على ابقائه بأن أعدت ترتيب الباب السياسى وأضفت اليه الفصل الخاص باضطهاد الأقباط كأحدى ثمار العلاقة السياسية بين الشيوخ والمماليك. ونجحت فى فرض رأيى على الشيوخ الذين لا يقرأون واذا قرأوا لا يفهمون .<br />2- فى أول كتاب لى \" السيد البدوى بين الحقيقة والخرافة\" سنة 1982نشرت بعض أجزاء رسالتى التى نوقشت ومنها مؤامرة الشيوخ الأحمدية واحراقهم الكنائس المصرية فى وقت واحد. وكنت أول من أماط اللثام على هذه الفاجعة وحققها تاريخيا وأنا الوحيد الذى عرف شخصية المدبر لهذه الحادثة والذى عجزت السلطة المملوكية عن الوصول اليه، اذ كان الرئيس السرى لتنظيم شيعى فشل من قبل زعيمه- السيد البدوى –الولى المشهور حتى الآن - فى قلب نظام الحكم المملوكى فانتقم الاتباع فيما بعد باحراق الكنائس ليوقع الخلل فى الدولة المصرية ليسقطها من الداخل وكاد أن ينجح.<br />3- فى سنة 1984 قررت على الطلبة فى الجامعة عدة كتب من تأليفى كان منها كتابى \" شخصية مصر بعد الفتح الاسلامى\" وعقدت فيه<br />اقرأ بقية التعليق .."
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161332/http://masr.20at.com:80/article.php?sid=1438"

