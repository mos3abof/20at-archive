author = "حوار مالوش لازمه"
posted = "2007-01-23"
text = "معلومه واحده بس النصرانى مش ميسيحى<br />النصرانى ده يهودى عايش على شريعة موسى وى مؤمن ان المسيح جه الارض بس عايش على شريعة موسى اليهودى العادى مؤمن ان المسيح لسه مجاش مستنى المسيح يجى الارض وى النصارى دول كانوا منتشرين فى شبه الجزيرة العربيه فالما النبى كتب القران اتلخبط بين نصارى وى مسيحى فكتب نصارانى بس المسيحى مش نصرانى المسيحى مؤمن ان المسيح جه على الارض وى عايش على شريعة المسيح وى علشان كدة انا مسيحى مش نصرنى وى عليش على شريعة الهى يسوع وعلشان كده بقول انا بحب كل المسلمين حتى الا غلط فيا وى عايزنى امشى من البلد"
archived = "2007-01-27"
