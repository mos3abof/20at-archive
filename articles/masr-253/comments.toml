author = "أعمل لك ايه؟!!"
posted = "2006-05-05"
text = "على فكرة يا جماعة مش كل كلام الأبراج فاضي..<br />خللينا بس نعقلها شوية الأبراج دي فعلا تقسيمة للسنة و هي ثابتة، يعني كل برج بيبقى ظروغه المناخير ثابتة و دي بتأثر على تكوين الجنين، فبيتولدوا ما بينهم صفات مشتركة شوية<br />الهجص اللي في الموضوع \"التنبؤ\" يعني مثلا \"بكرة هتحب ابن .... و قدامك سكة سفر\" و الكلام العبيط ده هو ده اللي كلام فاضي<br />و دختم!"
