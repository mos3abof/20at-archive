posted = "2006-06-19"
text = "الغباء زي الجهل والبطاله من امراض العصر موجود في كل مكان مش بس في مصر زي ماالبعض متخيل ومفيش داعي للتذاكي الجامد اللي بنشوفه من البعض اليومين دول"
