posted = "2006-06-19"
text = "فى مثل بيقوله الصعيده لاولادهم لما يجو يطلعو من البلد ومعتمدين عليه فى كل حيتهم<br />كبر دماغك وطول ودانك وعيش حمار هتلقى نفسك مرتاح"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144242/http://masr.20at.com:80/article.php?sid=514"

