author = "عادل سلامه"
posted = "2006-06-19"
text = "ايه التعليقات الغبية دي - ربنا ادانا المخ والعقل عشان نفكر ونتطور مش عشان نستغبي ونعيش كسالي طول حياتنا _ أصحوا وفوقوا بقي من الغيبوبة دي يا مصرييــن الناس اللي حواليناسبقتنا بسنيــــن"
archived = "2006-06-20"
