[[comments]]
order = 1
subject = "الاستغباء من صفة المصريين"
author = "الطير المهاجر"
posted = "2006-06-14"
text = "انا اسف على العنوان<br />انا عارف ان ناس كتير هتفهمه غلط<br />بس فعلا الاستغباء بقى من صفة المصريين<br />يعنى هما مش اغبياء لكن بيستغبو<br />تلاقى واحد بيكلم واحد بيقوله انت غبى ولا بتستغبى<br />هو مش غبى لكن بيستغبى قرر انه يعيش حمار علشان يريح دماغه<br />بلا قرف هنوجع دماغنا ليه كل شىء بايظ<br />البلد بايظة وما فيش فايدة<br />يا عمى عيش حمار تموت مستور<br />واهى دايرة وبتدور"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144242/http://masr.20at.com:80/article.php?sid=514"

[[comments]]
order = 2
subject = "صعيدى"
