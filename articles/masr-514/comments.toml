[[comments]]
order = 5
subject = "يوبيل غباء يقتل وطن وينحر أمه"
author = "الناصر الأيوبي"
posted = "2006-06-19"
text = "رغم ان زمن الدرس قاربت مدته من ال25سنة إلا إنه معتقد أن الجرس لم يدق بعد...(لايذكرني أحد بأنه لديه مشكله في السمع فهذاليس عذرا),ورغم لعنات العباد بعدحادث العبارة التي تنهال عليه آناء الليل وأطراف النهار مازال يعتقد أنه الربان الأمين ,ورغم مضايقته لعامة الشعب في حله وترحاله مازال يتصور أن القلوب تتسع له ليسكنها0000.ورغم أن النخبة المثقفة -على رغم تشرزمها- نطقت أخيرا بم كان ينبغي ان تبوح به ضد مفاسد سياساته ....مازال يعتقد انه راعي الثقافةوالفنون مازال في الدرس مستمراً ...!!!فمتى يفهم إذن؟؟؟"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144242/http://masr.20at.com:80/article.php?sid=514"

