text = "وأنا كمان والله أول ما قريت العنوان قلت مفيش في عشرينات حد غير منى اللي يكتبه أنا يمكن أول مرة أعلق هنا لكن متابعكم من زمان انتو كويسين اوى خليكو كده على طول"
