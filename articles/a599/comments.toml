[[comments]]
order = 0
subject = "مبادرة طيبة"
text = "بالفعل المشروع فكرته جميلة، ولعلها تكون بادرة طيبة من الحكومة لكي تفهم أن للشباب مشاكل..<br />لعلها تفهم أننا نحتاج إلى مزيد من الاهتمام.."
archived = "2004-09-10"
capture_url = "https://web.archive.org/web/20040910200443/http://www.20at.com:80/article.php?sid=599"

[[comments]]
order = 1
subject = "بنت والسلام"
text = "فعلا مشروع جميل ومفيد ..<br />الفضفضة صح بتريح ..<br />لكن إيه الحل .؟؟؟<br />ياريت لو كان دورات إجبارية للآباء والمربين ..<br />أو إظهار صرخات الشباب بقوة لهم<br />لأنهم للأسف ..<br />يعيشون في عالم آخر"
archived = "2004-09-10"
capture_url = "https://web.archive.org/web/20040910200443/http://www.20at.com:80/article.php?sid=599"

[[comments]]
order = 2
subject = "احمد خان"
text = "انا لما قرات الموضوع هزا بكيت شديدا ليس من اجل الاشخاص الموجودين في الموضوع ولكن على الفتره التي قضيتها في فتره المراهقه لقد عشت فتره مراهقه لم يعيشها احد سوى انا وبعض اصدقائي القدامى انا كنت ادرس في مدرسه اجنبيه طوال فتره الاعداديه والثانويه<br />وكان يوجد لدينا كل شىء وكان امامنا كل الوان الفساد ولم يكن هناك اي شخص يمنعنا فاهلي كلهم مشغولين بلتجاره لقد مشيت في هزا التيار لفتره طويله وفعلت في ما لم يفعله احد ولا يخطر على بال احد وما اشطر الشيطان مع شله الفساد وفي هزه الفتره نزلت علينا مصيبه لم تكن على بال احد منا انزلها الله علينا لكى يرجعنا الى عقلنا ولكن للاسف سجنت بسبب حادثه سنتين كانت حادثه مروعه مات فيها شخصين من اعز اصدقائنا بسبب طيشنا والجنون الحلالل مكان عقلنا بعد ان خرجت من السجن جعلت هدفي هو لقاء الله يوم القيامه وانا مكفر عن ّسيئاتي التى تغطي الجبال<br />انا عايز اوصل لأي اب او ام لا تتركوا اولادكم في هزه السن لكي لا يحدث لهم مثل ما حدث لي وما تقولوش احنا اولادنا احسن مناي اولاد تانيين اصل ابي وامي كانوا بيقولو كده"
archived = "2004-09-10"
capture_url = "https://web.archive.org/web/20040910200443/http://www.20at.com:80/article.php?sid=599"

[[comments]]
order = 3
subject = "مظلومييييييييين"
text = "احنا اظلمنا كثييييييير....<br />ياريت كان في حد يسمعنا واحنا صغيرين .. على الاقل ماكانوش قالوا علينا تافهين ... ياريت يبقى في حاجات زي كدة في المارس يبقى عنوانها الصراحة ...<br />والله ينور على الموضوع بجد"
archived = "2004-09-10"
capture_url = "https://web.archive.org/web/20040910200443/http://www.20at.com:80/article.php?sid=599"

[[comments]]
order = 4
subject = "حاجة واحدة بس"
text = "نور ...<br />عايز اقولك حاجة واحدة بس<br />ان مافيش واحدة بتاخد غير جوزها<br />يعني ربنا اذا كان مقدر انك تكوني مراة فلان حيحصل رغما عن اي حد<br />هيه اقدار وارزاق ومتوزعة<br />ادعي ربنا انه يختارلك الخير<br />وياريت نعرف اخر اخبارك"
archived = "2004-09-10"
capture_url = "https://web.archive.org/web/20040910200443/http://www.20at.com:80/article.php?sid=599"
