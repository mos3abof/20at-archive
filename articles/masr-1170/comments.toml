subject = "ما حدش يكلم أبو السيد ..."
author = "إبن بهية"
posted = "2006-11-16"
text = "الموضوع دمه خفيف ولذيذ وهو فعلاً عمنا سيد أفندي مش عارف مين ده زودها أوي .. والأكاده إنه بيتمسح في القرآن الكريم وكمان صوته عاجبه وبيحاول يقرأ القرآن الكريم بأسلوبه الـ .... أستغفر الله ، ومن تابع بدايات بزوغ نجم أبوالسيد يلاحظ أنه يرتب منذ زمن لهذه النجومية البطيخي .. اتصل صديق لي ذات مرة بعمنا سيد وقال له في أدب شديد يا عم سيد إمام المفسرين إبن سيرين كان يفسر رؤيا واحدة من كل أربعين تعرض عليه ، وكان لا يفسر إلا ما هو واثق أنه أمكنه تعبيره وكان يفسر لأناس يحيا بينهم ويعرفهم معرفة قوية وليسوا من أطراف الأرض كما تفعل أنت وو .. وطبعا قطعوا الخط على صاحبنا ولم يتركوه ليقول له كيف أنه عامل نفسه حنفية ولا ماسورة تفسيرات مكسورة .. عمركم شفتوه مرة واحدة قال لا أعلم ؟؟؟ ما حصلش لأنه حتى اليوم لا يعلم ويصر أنه يعلم وهذا هو الأحمق فاجتنبوه كما قال الخليل بن أحمد .. لكن إن جيت للحق أهو مسلي ولذيذ .. وقد ملأ الفراغ الذي تركه المرحوم محمود شكوكو .. ولو إنه الله يرحمه ترك وراه ألف مهرج عبيط عامل شكوكو من عينة حسني مبارك الواطي وعصاباته اللي نازلين فينا منولوجات تسم البدن من تقل دم اللي جابوهم .. شوف عندك آخر منولوجات جيمي بتاع النووي .. بيقولك إن جيمي ابن العبيطه كان فاكره برنامج عجوة وبلح أبريم .. أهو كله نووي .. مش دي منولوجات والنبي ؟؟؟<br />ولا منولوج صحافة الحكومة اليومين دول اللي نازلة قال إيه تلبيخ في القطط السمان أصحاب جيمي من أمثال أحمد عز عشان يفهموك إنه الواد جيمي نضيف وما لوش دعوة بالحرامية .. طبعا كله عشان عشان ينضفوا صورته الوسخة اللي مليانه هباب من يوم ما خلص دراسته في الجامعة الأمريكية وراح عند أخواله في لندن عشان ياخد كورسات مكثفة في الخيانة والعمالة والماسونية واسألوه الشركات<br />اقرأ بقية التعليق .."
