text = "يا جماعة انا كنت بعمل بحث على جوجل عن موضوع معين وطلعتلى الصفحة دى من ضمن النتائج , قرأت كل التعليقات , بجد عيب اللى بيحصل دا , اللى بينقد بينقد باسلوب وةطريقة لا علاقة لها بالنقد , بجد انا مشمئز من اللى قراته دا , حسيت اننا عمرنا ما هننهض طالما فى ناس كدا , اهدوا يا جماعة عيب"
