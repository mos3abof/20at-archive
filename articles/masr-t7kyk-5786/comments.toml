text = "السلام عليكم مدينة الحب أمشي في شوارعكي وانا أرى الحب محمولا بأكفاني صبو العذاب كما شئتم على جسدي فلا شهود على تعذيب سجاني تلك مطلع اغنية كاظم الساهر مدينة الحب انني أرى الحب كما وصفها ان الحب هو أسمى شيء موجود على وجه الأرض له قوانينه ودساتيره الخاصة به البعيدة عن قواميس الخيانة واللعب بالمشاعر والكذب ولكن ما نشاهده اليوم ليس بالحب فلو كان الحب انسانا لتبرا من ما يفعله الأحبة دون اطالة ازاي نقول على وحدة بتحب واحد وماشية مع غيرو انها تعرف معنى الحب من اساسو انتو كدة بتظلموا بجد الحب ،الحب هو ان الطرفين ميخونوش بعض مفيش حاجة اسمها أحو في الدكة الاحتياطي الحب ميعرفش انتين لأن دستوره بيقول 2 واحد ووحدة لكن مش تلاتة واحد اهو شغال والتاني استبن ياريت يبقى فيه الحب الحقيقي اللي فيه معاني الاخلاص والوفاء والصدق … اين أنت يا نزار لتكتب معاناة الحب واين انت يا كاظم لتغني لآلم الحب … ثانيا الاخ اللي كتب تعليق ووصف كاتب المقالة انو مش صحفي وكلام عيب يعني أحب اقولو ان الموقع ده للشباب لازم يتكلم بلغتو مش بالعربية الفصحى لأن كدة مش حيوصل وبعدين الموضوع لايت جداااااا ميستحملش العربية الفصحى"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725073542/http://www.20at.com:80/masr/t7kyk/5786.html"

