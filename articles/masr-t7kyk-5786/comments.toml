text = "525 كلمه – 3 ولاد و 3 بنات ..و واحده صاحبه التالته .. كلام مرسل ..<br />تلك هى محصله موضوعه \" الخارق \" بالذمه ديه صحافه .. ولا انتا نسيت بدل ما تكتب الموضوع ده فى البلوج بعته الموقع .. والله حرام !<br />بص يا عم الامور .. الصحافه يا حج عباره عن حاجتين \" معلومات + اسلوب تكتب به \" المعلومات ديه بتيجى من كذا حته وركز مش كل كلمه معلومه .. المعلومه هى التى تضيف لى امر جديد \" كقارئ اجهله \" وبتيجى من المصادر او المعايشه المباشره للحدث او بعض الروايات لمن يعايش الظاهره التى تتحدث عنها اذا عجزت عن الاليتين السابقتين ..<br />و المعلومات لازم تكون جديده وموثقه و مكتوبه حلو .. وديه الحاجه التانيه \" الاسلوب \" بصراحه لازم هيكل وسلامه احمد سلامه وانيس منصور \" العيال الصغيره بتاعت الصحافه ديه \" يجيوا يقروا الموضوع ده عشان يتعلموا .. او بلفظ ادق عشان ينسوا الصحافه … انا قريت كتير وقليل فى حياتى يا شيخ انما زى كتابتك ما شفه ,,, ولا هاشوف .. ولو مش مصدق اغسل وشك وشوف انتا كتبت ايه بس<br />- حزن ممزوجة بصدمة .. expression جديد جدا<br />- وإيه دليلك يا معلم .. بجد لغه قهاوى تمام<br />- لكنها خائفة من أن أخلع واسيبها \" تركيب لغوى مبتكر فعلاً<br />- وأنا مش هعمل زيها .. مش ايه يا عم وجنبه ايه ، وديه غير المقدمه كان القلب يحب مرة مش مرتين !<br />- لكن ساعة الجد \"هديها زوغان \" يا راجل انتا سرقت سرقه وهاتجرى ولا ايه<br />- البنات صحابي عرفوني بولد .. اسمها البنات صحباتى .. مش صحابى .. ده لو هاتكتبها بالاسلوب البيئه ده انما المفروض تقولها اتعرفت مع خلال صديقاتى بشاب ..<br />- ما أتعلقت بيه سابني وخلع … خلع ليه هو انتا معتبر البنت جزمه لابسها فى قدمه وخلعها …<br />- كل واحد منهم له فايدة معينة .. اسمها فائده ..ام انه لا تعرف حرف الهمزه !<br />يعنى لو موضوع صغير جدا لم يصل ل600 كلمه فيه كل تلك الاخطاء … الصحفيه و النحويه \" بقول اخطاء \" مش فنيات … يعنى اساسيات …<br />انما لو هانتكلم عن الفنيات فالموضوع اصلا … مش صحافه ولا يقربلها من قريب او بعيد .. هو تقريبا نزل فى الموقع غلط ! ، بجد شكله كده .. يعنى الفكره نفسها لا تصلح للمعالجه والا يبقى نكتب بقى عن الحماه .. والزوجه التانيه ، والخيانه فى الحب ، وتزبيط البنات … الخ .. الصحافه الحقيقيه منك برااااء …<br />ولو افترضنا جدلا ان الفكره ممكن تتعالج .. تتعالج بقال فلان .. وذكرت فلانه .. وكلام \" الفسحه ده \" يعنى تشوف حالات حقيقيه عملت مشاكل فعليه .. حالات مؤثره .. من الجنسين .. و تناقش فى الازمه ديه خبير علم نفس واجتماع يمكن ساعتها الموضوع يكون مهضوم شويه ..<br />اتعلم صحافه الاول وبعدين فكر تمسك قلم .. الصحافه لم ولن تكون مهنه ما لامهنه له !"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725073542/http://www.20at.com:80/masr/t7kyk/5786.html"

