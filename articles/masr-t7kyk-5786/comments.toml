text = "مش عارف لية يا اسطورة ماعملتش بناصيحتي اللي كتبتهالك في الاخر وعلى فكرة فينه ناس كدة من الافضل لهم يروحوا يتنيلوا ويسيبوا الصحافة ويروحوا يرموا عقدهم في اي حتة تانية وتعالى يا حلو<br />هو انت لية مش عايز تعترف بخطأك هو انت غبي ومصر على الغباء<br />اولا - تعريف الصحافه اللى انتا \"فضحت نفسك انك ما تعرفوش \" اصغر صحفى فى الجورنال ده عارفه ..( هو انت ياض فاكر اللي كتبته ده تعريف صحافة بجد انت عبقري فعلا .. ولملعوماتك ده مش جورنال ده موقع نت خدت بالك .. يا شيخ روح … )<br />ثانيا: بلوجر اية اللي انت جاي تقول عليه وانت مش عارف الفرق بين الجورنال وموقع النت روح ياض اقعد في الجورنال الاصفر اللي انت بكتب فيه<br />ثالثا: لكن ساعة الجد \"هديها زوغان \" وبعدين ده مش مصدر مهم قوى عشان تكتب كلامه حرفيا( ياض انت مابتفهمش الموضوع ده لايت ، بقولك حوش لك 5 جنيه كدة من مصروفك وروح هات مجلة الشباب وأقرا الموضوعات اللايت اللي فيها زي ما قالت لك شرين منصور، على فكرة انا حاسس انك متعرفش يعني اية لايت ، هي يعني موضوع خفيف)<br />رابعا: يا استاذ خلع ايه بس .. وايه علاقته بالموضوع( علاقته ان الواحدة لما يتيجي تخلع جوزها مش معناها انها بتخلع فردة جزمة، على فكرة انا بوضحلك لاني مضطر انزل لمستوى ذكائك المتدني)<br />خامسا: بالناسبة بقة للبنات صحباتي.. فيه نوعان من البنات فيه اللي بيقول البنات صحابي ودول يعني تحس انهم بنات تقال كدة وفيه بنات بتحب تبان انها روشة كدة ولذيذة فيتقول البنات صحباتي و مش حلو بدل ما تقول ومش عارفة بدل ما تقول معرفش يعني بنات كدة رقيقة ، واضح انك جيناتك فيها شوية رقة يا اسطورة .. )<br />سادسا: انت شارب حاجة ممكن تقولي يعني اية صحافة يا نابغة عصرك واوانك/ قولي يا قمر وماله لما نكتب عن الحماة والزوجة التانية وأمك وابوك والخيانة في الحب … لما تكون مش عارف يعنى ايه صحافه \" واعترفت بكده \" يبقى انا كلامى صح .. اللى قالك اشتغل صحفى ظلمك ( مستوى ذكائك هنا صفر وانا استحالة انزل لهذا المستوى بجد ح احس اني غبي لو علقت على كلامك خلي ابن اختك يقرألك الموضوع وهو يشرحلك<br />سابعا: موضوع أخذ رأى خبير نفسى واجتماعى عشان ميبقاش الكلام كلام \" فسحه \" فى ساعه ظهيره .. يعنى توثيق للكلام بس انتا مش واخد على كده ( واضح ان اللي اخد الفسحة دي انت علشان كدة سخنت شوية.. يا عم البتاع مش لازم كل الموضوعات تاخد فيها رأي علماء نفس واجتماع وحياة سليم وبشارة تكلا مش لازم .. بجد تعبتني بغبائك<br />ثامنا: الصحافه لم ولن تكون مهنه ما لامهنه له( مش شايف انك عايش في العصر الحجري وبتردد كلام اتقال واتسمع 1000000 مرة ..طيب طالما انا ماجبتش جديد الكلمه حرقت دمك ليه .. ولا عشان جت على الجرح ( الكلام ده تقوله لنفسك ، اعتقد انك بتعمل اسقاط)<br />وبعدين ياض حتقتص مني ازاي يوم القيامة ده انا باخد فيك ثواب وبجهك للطريق الصحيح رينا يهديك يارب ويفك عقدك ويرجعلك عقلك ويهدي نفسك ويخليك تبطل حقد على الناس يا حقود،، وبجد بجد، وربنا انت حاجة تضحك في الزمان ده بس ح اقولك اية عقد بقة والنظام انجب منك الكثير من المعقدين يابني نصيحة بجد روح اتنيل<br />تعالي بقة لكلامك الغريب اللي بيكشف عن شخصيتك المتوترة<br />1- وبعدين انتا فاكر انك لما تقول اى واحد اهبل ح يكتب تعليق اهبل وربنا لاغسله .. اننا كده هانخاف ومش هانعلق .. احنا المفروض قراء ولينا عليك حقوق ..<br />2- اخى الفاضل .. لابد ان تعلم ان حدود النقد المسموح بين الزملاء لابد ان تكون محكومه ببعض الامور الموضوعيه<br />تعليق بقة على كلامك<br />هو انت مرة بتقول انك قارئ ومرة بتقول انك زميل … بجد ولربنا ماليش نفس اعلق<br />ربنا يهديك ويقل من امثالك<br />ربنايخليك تبطل حقد على الزملاء<br />على فكرة والله العظيم تلاتة انا مش كاتب المقال انا مجرد واحد بيقرا لعشرينات من 3 سنين والله العظيم تلاتة مش انا كاتب المقال اللي واضح جدا انه افضل منك لأنه مارضاش( أو مش \"رضي على\" رأيك) يعلق على أسلوبك>;<br />مش ح اقولك روح اتنيل علشان النيلة نفسهازهقت روح ياض اقعد لوحدك وبطل ازعاج"
