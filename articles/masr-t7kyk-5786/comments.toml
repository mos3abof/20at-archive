author = "للأخ بتاع الاسطورة"
posted = "2007-05-08"
text = "الاخ اللي فاكر نفسه اسطورة تعالي ياض يا اهبل شوف كلامك الاول وبعدين ابقي عيب على اساتذتك<br />نشوف بقة يا سيدي كلامك<br />1 - انتا نسيت بدل ما تكتب الموضوع ده فى البلوج بعته الموقع .. والله حرام !( انت عارف بجد حرام عليك انت اللي بتهبله ده ممكن تقولي يعني اية \"بلوج\" اسمها بلوجر يا جاهل .. يا شيخ روح اتنيل)<br />2- الصحافه يا حج عباره عن حاجتين \" معلومات + اسلوب تكتب به \" ( انت جيبت تعريف الصحافة الهايل ده من اين يا قرد، ده انت بتضع مناهج صحافة بقة وبتألف كتب .. يا شيخ روح اتنيل)<br />3- لكنها خائفة من أن أخلع واسيبها \" تركيب لغوى مبتكر فعلاً ( مين قالك ان ده مبتكر جدا.. هو انت اطرش ولا مش بتخرج من بيتك.. يا شيخ روح اتنيل)<br />4- لكن ساعة الجد \"هديها زوغان \" يا راجل انتا سرقت سرقه وهاتجرى ولا ايه ( يا أهبل الكلام ده على لسان المصدر اللي اتكلم في الموضوع .. يا شيخ روح اتنيل)<br />5- ما أتعلقت بيه سابني وخلع … خلع ليه هو انتا معتبر البنت جزمه لابسها فى قدمه وخلعها ( هو انت ما سمعتش عن قانون الخلع ولا انت مش لاقي كلام تقوله يا حثالة.., يا شيخ روح اتنيل)<br />6- لبنات صحابي عرفوني بولد .. اسمها البنات صحباتى .. مش صحابى ( يا اختي يا حلوة بقة البنات صحباتك يا نوغة اسم الله يا قمر .. يا شيخ روح اتنيل<br />7- انما لو هانتكلم عن الفنيات فالموضوع اصلا … مش صحافه ولا يقربلها من قريب او بعيد .. هو تقريبا نزل فى الموقع غلط ! ، بجد شكله كده .. يعنى الفكره نفسها لا تصلح للمعالجه والا يبقى نكتب بقى عن الحماه .. والزوجه التانيه ، والخيانه فى الحب ، وتزبيط البنات … الخ .. الصحافه الحقيقيه منك برااااء ( انت شارب حاجة ياض ممكن تقولي يعني اية صحافة يا نابغة عصرك واوانك/ قولي يا قمر وماله لما نكتب عن الحماة والزوجة التانية وأمك وابوك والخيانة في الحب، يخرب بيت ام اللي قالك تكتب يا اخي او تقرأ حتى .. يا شيخ روح اتنيل<br />8- تشوف حالات حقيقيه عملت مشاكل فعليه .. حالات مؤثره .. من الجنسين .. و تناقش فى الازمه ديه خبير علم نفس واجتماع يمكن ساعتها الموضوع يكون مهضوم شويه( يعني اية الاول يا كوتوموتو حالات مؤثرة، ويا حبيبي انت فاكر كل الموضوعات محتاجة خبير علم نفس واجتماع وعزة كريم والمجدوب بقولك ما كنت تجيب امك كمان تدي رأيها في الموضوع \" انا قصدي يعني ان ناخد رأي الاباء والأمهات وأمك أولهم، اصحى ياض وفوق وبطل الوهم اللي انت عايشة.. يا شيخ روح اتنيل)<br />9- الصحافه لم ولن تكون مهنه ما لامهنه له( مش شايف انك عايش في العصر الحجري وبتردد كلام اتقال واتسمع 1000000 مرة يا ممل يا .. يا شيخ روح اتنيل)<br />اي واحد اهبل ح يكتب تعليق اهبل وربنا لاغسله<br />وخصوصا انت يا اسطورة بس انت فعلا اس طورة وطبعا كلنا فاهمين ass يعني اية وطورة طبعا معروفة<br />واخيرا بجد انصحك نصيحة جامدة موت<br />يا شيخ روح اتنيييييييييييي ييييييييييييييي ييييييييييييييي ييييييييييييييي ييييييييييييييي ييييييييل"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725073542/http://www.20at.com:80/masr/t7kyk/5786.html"

