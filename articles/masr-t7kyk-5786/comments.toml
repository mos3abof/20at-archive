text = "- المدونه اسمها بلوج ..والمدون اسمه بلوجر … لمعلوماتك يعنى واسأل حد كبير يقولك<br />- تعريف الصحافه اللى انتا \"فضحت نفسك انك ما تعرفوش \" اصغر صحفى فى الجورنال ده عارفه .. ده لو اعتبرنا انى اقصده تعريفه .. انما انا اقصد انه اقربلك الصوره بس<br />- التركيب اللغوى المبتكر .. ده منك .. عشان انتا بس بتخترع صحافه جديده<br />- لكن ساعة الجد \"هديها زوغان \" يا راجل انتا سرقت سرقه وهاتجرى ولا ايه ( يا أهبل الكلام ده على لسان المصدر اللي اتكلم في الموضوع .. ومين قالك بقى انك المفروض تنقل الكلام بنفس طريقه المصدر حتى لو كلامه ملئ بالاسفاف هو انتا صحفى بيفهم اللى بكتب ام انه \" ناقل لما يقوله الاخرون دون وعى \" وبعدين ده مش مصدر مهم قوى عشان تكتب كلامه حرفيا<br />- ما أتعلقت بيه سابني وخلع … خلع ليه هو انتا معتبر البنت جزمه لابسها فى قدمه وخلعها ( هو انت ما سمعتش عن قانون الخلع ولا انت مش لاقي كلام تقوله ) يا استاذ خلع ايه بس .. وايه علاقته بالموضوع<br />- لبنات صحابي عرفوني بولد .. اسمها البنات صحباتى .. مش صحابى ( يا اختي يا حلوة بقة البنات صحباتك يا نوغة اسم الله يا قمر .. يعنى وبعدين برضه .. بيدارى ضعفك فى الاسلوب بقله ادبك يعنى ولا ايه .. ماردتيش ليه<br />- انت شارب حاجة ممكن تقولي يعني اية صحافة يا نابغة عصرك واوانك/ قولي يا قمر وماله لما نكتب عن الحماة والزوجة التانية وأمك وابوك والخيانة في الحب … لما تكون مش عارف يعنى ايه صحافه \" واعترفت بكده \" يبقى انا كلامى صح .. اللى قالك اشتغل صحفى ظلمك<br />- موضوع أخذ رأى خبير نفسى واجتماعى عشان ميبقاش الكلام كلام \" فسحه \" فى ساعه ظهيره .. يعنى توثيق للكلام بس انتا مش واخد على كده<br />- الصحافه لم ولن تكون مهنه ما لامهنه له( مش شايف انك عايش في العصر الحجري وبتردد كلام اتقال واتسمع 1000000 مرة ..طيب طالما انا ماجبتش جديد الكلمه حرقت دمك ليه .. ولا عشان جت على الجرح ..<br />ده … اولا<br />الحاجه التانيه بقى ..<br />وضح جدا جدا جدا من اسلوب المتدنى حتى فى الرد انك لا تجيد الكتابه اطلاقا .. وفاكر الصحافه \" فتحه صدر \"مش اكتر … و الدليل على انك ما عرفتش ترد فعلا .. انتا استعضت بكده بنوع من الهروب \" الغير حقيقى \" بسبى او سب اهلى … وهو امر بأى شكل من الاشكال لا يخرج عن انسان مهذب .<br />وبعدين انتا فاكر انك لما تقول اى واحد اهبل ح يكتب تعليق اهبل وربنا لاغسله .. اننا كده هانخاف ومش هانعلق .. احنا المفروض قراء ولينا عليك حقوق .. يعنى لو خايف من تعليقاتنا اتنا اللى ما تكتبش مش احنا اللى ما نعلقش !<br />اخى الفاضل .. لابد ان تعلم ان حدود النقد المسموح بين الزملاء لابد ان تكون محكومه ببعض الامور الموضوعيه .. يعنى انا دخلت علقت – على الموضوع نفسه – وليش صاحبه … تحدثت عن اسلوبك فى الكتابه ولم اتطرق لاسلوبك الشخصى انت .. لانه لا يهمنى من قريب او بعيد ..<br />يعنى انتا محتاج تتعلم كتير قوى قوى ازاى تعرف تنقد .. وازاى لازم تقبل النقد ..<br />و ربنا يعف لسانك شويه .. و سأقتص منك يوم القيامه على كل هذا السباب .. فلا تنسى !"
