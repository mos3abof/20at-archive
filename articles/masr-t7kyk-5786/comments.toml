posted = "2007-05-10"
text = "للاسف الحب اللى اتعلمناه من قصائد نزار و كامل الشناوى و سعاد الصباح و عشناه ف روايات ذهب مع الريح و حذار من الشفقه و جين اير و اللى حسيناه ف افلام نهر الحب و حافيه على جسر الذهب و غيرهم كتير خلاص بقى حفريات<br />حاجه كده من الماضى نفتكرها و نقول لسه فاكر كان زمان<br />اسمحولى قبل ما اعلق على الموضوع اخرج شويه لمنظور اكبر<br />الحب انهارده يا جماعه اختلف<br />كنت من فتره بقرا خواطر ام واحده زميلتى..ست جميله روحا و اسلوبا و بجد لما قرات استغربت اوى<br />الناس كانت بتحب بشكل مختلف فعلا..كانت كاتبه الحاجات دى لوال زميلتى<br />ناس بجد عرفت حب متهيالى عمرنا ما هنعرفه<br />كان عندهم قدره عجيبه ف الربط بين حب الوطن و حب المحبوب..هى بتبقى شايفاه مصر و هو شايفها مصر<br />يمكن علشان عاشو حروب و فترات احنا ما عشناهاش..يمكن<br />رجوعا للموضوع احب اقول فعلا الموضوع دا صحيح و كتير من البنات و الشباب دلوقتى عندهم القدره انهم يحبو واحد و اتنين و تلاته و انا بسمى دا خيانه مزدوجه بل و خيانه ثلاثيه الابعاد<br />و متهيالى اللى بيعملو كده بيكونو للاسف مبيحبوش اساسا او ميعرفوش ايه هو الحب<br />و مقصدش حب يا ليل الصب متى غده بس اقصد الحب بمعناه العادى الطبيعى اللى ابسط و اول قواعده الوحدويه…يعنى حب انسانه واحده لانسان واحد و العكس"
