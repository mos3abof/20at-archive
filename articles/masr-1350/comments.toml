[[comments]]
order = 5
subject = "من شابه الحزب الوطنى فما ظلم"
author = "ليه زعلنين قوى من الضرب طيب هو إللى عمله مبارك فى إنتخابات الرئاسه وضرب المتظاهرين وقتل منهم 11 وقفل لجان الإنتخابات فى وجه المعارضة وخاصة ناخبين الدكتور أيمن نور وجاب كشوفات للناخبين من أيام الفراعنه كان أفظع مئات المرات مما حدث فى الحزب الناصرى"
posted = "2006-12-25"
text = "طيب لما يكون ده سلوك الحكومه هو ضرب الناخبين وتزوير الإنتخابات فى مجلس الشعب وطبعاً الباقى العالم كله عارفه وهو تعيين الكوارع بتوع الحزن الواطى يبقى أكيد إللى يقلدهم مش ها يبقى غلطان<br />لما يضربوا المعتصمين السودانيين من غير رحمه ويقتلوا منهم 30 فى ميدان لبنان من غير لما يحاولوا يحلولهم مشكلتهم ولا يتفهموا معاهم بأسلوب حضارى يبقى أسلوب الهمجية هو السائد<br />لما الحكومة تبدخل وسط الأحزاب زى السرطان لما يدخل الجسم علشان تفتت أى معارضه ولما ما تخليش ليهم أى حق فى عرض فكرهم فى برامج خاصة بيهم فى وسائل الأعلام المرأيه رغم أن هذه الوسائل ينفق عليها من أموال المصريين وليس من أموال الخزى الواطى<br />لما يقتلوا كل الأصوات إللى بتقول لا للفساد ولا لمبارك يبقى لازم يحصل كده<br />وباعدين هو حد شاف أى ممارسه ديمقراطية شريفة فى مصر علشان هما يبقى يحتذوا بحذوها مهو كله تزوير وضرب للشعب واعتقالات وأظن إللى بيحصل للإخوان المسلمين دلوقتى هو أكبر دليل من أعتقالات وتفتيت ليهم علشان يقدموهم قربان لأمريكا يمكن تعيد ليهم ثقتها تانى بعد لما أصبحوا عبء عليها<br />لما نعتقل الطلاب لإنهم بيطالبوا بحقهم فى الديمقراطية فى إنتخابات الجامعة يبقى لازم يحصل فى مصر كده<br />والله لا يغير ما بقوم حتى يغيروا ما بأنفسهم"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108011013/http://masr.20at.com:80/article.php?sid=1350"

