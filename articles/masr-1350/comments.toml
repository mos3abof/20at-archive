[[comments]]
order = 10
subject = "اسرار ضرب المصور"
author = "توفيق"
posted = "2006-12-25"
text = "يا جماعة ضرب مصور الجريدة راجع لان مكتب الجريدة في القاهرة في التعاطي مع الحزب الناصري مغرض فسيد عبد الغني صاحب ما يسمي بجماعة المحامين الناصريين بالنقابة ارسل من قبل مجموعة من الشباب ليشعلوا النيران في الحزب الناصري وتم القبض عليهم وادانتهم وكانت الكاميرا الوحيدة هناك قبل بداية الاحداث هي كاميرا الجزيرة ثم حاول سيد عبد الغني ان يجد له مكانا في امانة القاهرة فسقط منذ ايام، وكان معه في مرشحا ايضا سمير عمر مراسل الجزيرة في القاهرة وقد سقطا، وهما كانا يمثلان طلائع سامح عاشور لفرض بعد نجاحهما علي الحزب ثم ان سيد عبد الغني هو الشقيق الاكبر لحسين عبد الغني مدير مكتب الجزيرة بالقاهرة لذا وجب التنويه فكاميرا الجزيرة يا قوم ليست محايدة ولكنها هنا منحازة والضرب له ما يبرره"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108011013/http://masr.20at.com:80/article.php?sid=1350"

