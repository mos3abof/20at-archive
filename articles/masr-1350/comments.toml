text = "هو أنت مبقتيش تكتبى ليه شعارك القذر<br />لا للتوريث لا لجمال مبارك<br />عايزين حكومة إنتقاليه تعيد للشعب كرامته بقيادة القضاه ثم أنتخابات حرة"
archived = "2007-01-08"
