subject = "اعلقة تفوت"
author = "احلام"
posted = "2006-12-26"
text = "الست مني الشاذلي قعدت تردد بسخرية ان ضياء الدين داوودمن هذا المنبر وكانه جامع العاشرة مساءا مش ها يرشح نفسه تاني لمنصب رئيس وقالتها بسخرية طيب يا حلوة ما اتمطعتيش ليه وفسرتي لنا الئيس بقي له ربع قرن علي ذات المقعد والا وجهتي له نفس الاتهام والا هو تنتقده كل الناس الا واحد بس يا مني هانم و الاستاذ عمرو خفاجة رئيس القناة والمشرف علي برنامجك احنا عارفين البرامج دى كيف تتطبخ وعارفين انكم عاملين زى فقاقيع الصابون للعلم انا لا اعرف الحزب الوطني والا الناصرى والا اعرف ان بلدنا فيها احزاب من اساسه"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108011013/http://masr.20at.com:80/article.php?sid=1350"

