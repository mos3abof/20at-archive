subject = "يا دشم يا إللى أسمك ؟؟؟؟ مبارك"
author = "يا اللى عماله تتنططى فى وسط الموقع علشان تبخى سمك القذر ياإللى اسمك دشم ومرة تلميذه ومرة مصرية بجد وأنت فى النهاية يهودية بجد وكلنا عارفينك ياريت تهدى وتتمرمغى فى النعيم المنهوب من الشعب إللى إنت عايشه فيه قبل لما يرجع لأصحابه من أبناء الشعب"
