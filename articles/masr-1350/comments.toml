[[comments]]
order = 1
subject = "مكنتش هكتب بس مصرية مهمومة"
author = "كوكو الضعيف"
posted = "2006-12-24"
text = "بجد المقال اللى قبلى اللى كتباة مصرية مهمومة هو اللى خلانى اكتب انا هقول حاجة واحدة هو مصور انى قناة اللى اتضرب طبعا قناة الجزيرة طيب هو مكنش فى اى مصور من اى قناة اخرى هناك او من اى جريدة ؟؟؟ طبعا كان فية بس الجزيرة هى عدوة اى حد فى الحكومة او تابع ليها عشان كدة لازم يتضرب طيب فى حلول تانية غير الضرب اة اكيد فى بس مش عند الحكومة المصرية وتابعيها اللى عندهم الضرب لان قناة الجزيرة احنا بنصدقها وحكومة الضرب والاتهامات العشوائية والاتهامات الجهزة سياستها الضرب حتى فى جامعة عين شمس او فى الاقسام او فى المظاهرات او فى مجلس الشعب بيضربو بعض هههههههه على فكرة بلاش تضربو المصريين عشان الضرب فى المصريين حرام قصدى الضرب فى الميت حرام ( انا ميت من زمااااان مع انى لسة متخرج من 3 سنين هههههه)"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108011013/http://masr.20at.com:80/article.php?sid=1350"

