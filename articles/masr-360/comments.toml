[[comments]]
order = 6
subject = "دمت ذخرا للحق"
author = "محرز"
posted = "2006-05-23"
text = "نص الآية<br />{الَّذِينَ قَالَ لَهُمُ النَّاسُ إِنَّ النَّاسَ قَدْ جَمَعُواْ لَكُمْ فَاخْشَوْهُمْ فَزَادَهُمْ إِيمَاناً وَقَالُواْ حَسْبُنَا اللّهُ وَنِعْمَ الْوَكِيلُ }آل عمران173<br />ربنا يتم شفاؤه ان شاء الله<br />انا نفسي اشوف ابنه بعد ما عرفت انه معانا في الكلية، انا في 3 حقوق انجليزي ، ولسة عارف ان ابنه معانا، نفسي اشوف الولد ده عشان اهنيه بإن ربنا رزقه بأب شجاع فعلا ويستحق التكريم."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041735/http://masr.20at.com:80/article.php?sid=360&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "الحمد لله ما زال بمصر قضاه"
author = "احمد"
posted = "2006-05-23"
text = "ان امثال المستشار البسطويسي هم الامل الباقي للامة باسرها لانه قلما تجد الشرفاء اولئك من يبحثون عن الحق دون علة ودون خشية من فقر اوذلة خاصة ونحن نري المجتمع باسره قد انقلب من الدفاع عن المبادئ الي الدفاع عن الاشخاص ومن الدفاع عن العقيدة الي الدفاع عن الفكرة ولكل ذلك نري مصير كل الحركات التحررية الفشل الذريع او الانفضاض السريع واختم بقول ربنا عز وجل (يثبت الله الذين آمنوا بالقول الثابت في الحياة الدنياوفي الآخرة ويضل الله الظالمين ويفعل الله ما يشاء )صدق الله العظيم"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041735/http://masr.20at.com:80/article.php?sid=360&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "تشرفنا"
author = "كيف لا تكون اسطوره فى هذا الزمن الردىء"
posted = "2006-05-24"
text = "كيف لم نعد نستطيع ان نصدق ـ الا بشق الانفس ـ انه لا يزال يوجد من لم يبع نفسه بذهب المعز او يرضخ بسبب وحشيه سيفه<br />سوف يذهب من تطاولوا على هيبه القضاء الى مزبله التاريخ و ستبق سيرتك و رفاقك ابد الدهر نبراسا يضىء الدرب للمظلومين وسعيرا يصطلى به الظالمين<br />شفاك الله و عافاك<br />ايها<br />العز بن عبد السلام<br />اااااااااااااااااااااااااااااااااااااااااااااااه يــا بــــــلـــــــدى"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041735/http://masr.20at.com:80/article.php?sid=360&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
