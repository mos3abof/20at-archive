[[comments]]
order = 33
subject = "الله يحبك يابطل"
author = "خالد- القاهرة"
posted = "2006-06-09"
text = "لك الحب لك الدعاءمن المصرين الشرفاءان الله يحبك فاءصابك الله فان لله حكمة فى ذلك ليظهر لك حب الشرفاء من الشعب لتستمد الهمة والعزم وتواصل الكفاح من اجل مصر وحصن مصر ( القضاء)ليشيع العدل والحق فى الارض امام الطغاة انت اقوى الان بعناية الله لك وحب الناس لك تحية من مواطن مصرى لك واسرتك الكريمة لقد اعزهم الله بك واعز مصر بك والشرفاء مثلك والامل اقوى الان فى قلب المصريين لنعبر العبور الحقيقى الى عهد الحرية التى لايحميها الا القضاء الحر هنيآ لك بحبنا وحب الله وفخر اسرتك وابنائك ."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041735/http://masr.20at.com:80/article.php?sid=360&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

