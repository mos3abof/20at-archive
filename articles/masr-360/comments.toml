subject = "لا تحزن علي ما مضي"
author = "وليد"
posted = "2006-05-23"
text = "الف سلامه يا اخر الرجال المحترمين كما يقال عنك واحب ان اقول لك لا تحزن علي شي مضي واعمل بقول عمر بن الخطاب في قوله \"نحن أمة أعزها الله بالإسلام فإذا ابتغينا العزة بغير الإسلام أذلنا الله \"<br />وانت ان شاء الله واحد من الذين سوف يرجعون حققانا من هذا الغاصب"
