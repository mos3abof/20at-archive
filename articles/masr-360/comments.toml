[[comments]]
order = 40
subject = "مصر تعيش (بالأطهار فقط)"
author = "معاذ محمود عامر"
posted = "2006-06-14"
text = "ياسيادة المستشار, ماأضألنا أمام علو قدر شرفك أنت وشموس العدالة الأخرى, أنت بحق نجم مضيئ،لا بل أنت سماء بألف نجم وألأف الكواكب.اني في العام السادس عشر وانني لأفخر أنني ابن لهذا الجيل الفتي الذي تفتح وعيه على نور الشرفاء أمثالك(العظيمة نهى الزيني,رجل الحق يحى حسين,وجموع القضاة النبلاء الأجلاء). يا سيادة المستشار أهديك أنت وكل من ذكرتهم, كلمات للأستاذ الكبير صلاح عبد الصبور ويقول: \"ونعيش في أيامنا الملأى بوقع خطاك, اذ كنت فرحتنا الكبيرة حين تمسك في يديك الحلم,تنثر منه فوق أسرة الأطفال والمستضعفين,أو في نواحي بيت مصر على رؤوس شبابها المتجمعين,اذ كنت تجعلهم يمدون الرقاب وتشرئب عيونهم نحو السماء, ويمد حبل الأمنيات لكي يصيد الشمس من عليائها, حتى لنطمح أن نقسم نورها قطعا على أحبابنا, ونعيد ما طمر الزمان وأخلفت عدة السنين, ونعيش في أيامنا الملأى بصورتك التي عاشت على أهدابنا..... \""
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041735/http://masr.20at.com:80/article.php?sid=360&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

