author = "أحمد المحامي"
posted = "2006-07-23"
text = "من القضاء الواقف ألي القضاء الجالس ربح البيع ياأستاذناقيلت لصهيب بالأمس وقد ألقى ثمراتًَ في يده وضحى بنفسه من أجل الحق ونقولها لك اليوم وقد أستغنيت عن الدنيا وزخرفها من أجل الحق فأعانكم الله ووسدد خطاكم والسلام"
archived = "2006-12-15"
