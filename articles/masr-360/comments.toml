[[comments]]
order = 22
subject = "إن الله يدافع عن الذين ءامنو"
author = "على كمال الشبراوى"
posted = "2006-05-31"
text = "إعلم معالى المستشار ان من اراد طريق الحق فليعلم ان الطريق ليس مفروش بالورود فرسول الله إتهم بالكذب والجنون رغم أنهم لقبوه بالصادق الأمين فلا تحزن فإن الله ليس غافلا عما يعمل الظالمون وأقول لأبنائك طلبة الحقوق يا حراس العدالة القادمون ستحملون أمانة أبت الدنيا وكل جبال الأرض أن تحملها فطوبى لكم لو سرتم على درب أبيكم وأرسيتم بين الناس الحق والعدل ولم تخشوا أحد إلا الله وختاما 000والذين ءامنو واتبعتهم ذريتهم بإيمان ألحقنا بهم ذريتهم"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041735/http://masr.20at.com:80/article.php?sid=360&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

