subject = "{الَّذِينَ قَالَ لَهُمُ النَّاسُ إِنَّ النَّاسَ قَدْ جَمَعُواْ لَكُمْ"
author = "والله الكلمات لا توفيك حقك ولا حق من مثلك من اطهر رجال مصر"
posted = "2006-06-05"
text = "لكن نقول ان الفرع الطيب لازم يكون من جذر طيب<br />ولو كل الناس كانت تربي اولادها مثل ما فعل والد سيادة المستشار لكان عندنا الان بالبلد طبقة كاملة مثلة<br />الف سلامة ليك يا اعز الناس<br />والف تحية لوالدك ووالدتك وزوجتك العزيزة<br />الذين ساهموا في دعمك وتثبيتك على الحق طوال سيرتك العطرة<br />واكيد بنشوف بكرة اولادك معانا بالغربة لانهم اكيد مش حيطيقوا يعيشوا في الوساخة اللي وصل ليها مستوى التعامل مع اعدائك"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041735/http://masr.20at.com:80/article.php?sid=360&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

