author = "أبو أسامة"
posted = "2006-05-24"
text = "ان هذا الرجل يمثل صوت الحق فى زمن الظلم<br />الذى نعيشه فايذأهذا التاريخ الذى قراته عنه لااملك الا ان ادعوا الجميع للوقوف معه<br />وان لم نقف معه فسوف تكون النهاية فلا تخشوا الا الله وارسل الى الجميع هذين البيتين من الشعرمن الله على بهمابعد قرأتى للموضوع .<br />أخى .<br />اجهر بصوتك يا فتى<br />لا تبقى فى الظلمةضوأخافتا<br />سيحرقوك ويغرقوك ان بقيت صامتا<br />فالى متى سيظل صوتك ساكتا<br />لا................للظلم<br />لا...............للتوريث<br />لا...............للأصتعباط"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041735/http://masr.20at.com:80/article.php?sid=360&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

