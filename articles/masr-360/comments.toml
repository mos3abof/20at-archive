[[comments]]
order = 43
subject = "للشرف رجاله"
author = "محمود"
posted = "2006-09-07"
text = "سيدى قاضى القضاه<br />ان القاضى عندما يجلس للحكم فى قضية انما يحكم بقضاء الله<br />فلا تحزن سيدى من زبد البحر فانهم باذن الله زائلون<br />واهديك سيدى قصيدة احمد نجم<br />عليا الحرنكش يا ريس مبارك<br />في عصر مزركش ملون بنارك<br />لابايعك وأبايع حكومة حمارك<br />ملعون أبو اللي يقاطع قرارك<br />نهاره مقندل وليله مبارك<br />فهمبك وهجص وطلع في ديننا<br />أكيد هو طالع يشاهد جمالك<br />جمالك مبارك سوزانك سوزاننا<br />يامحلا حصارك لمصر اللي جالنا<br />نسيمها في عصرك بيشوي في بدنا<br />أؤيد وأبايع فخامة جلالتك<br />وأيد أي واحد بيمسح ريالتك<br />ولأنك سر باتع هاننسى هبالتك<br />فأقعد ياريس ودلل حمامتك<br />حمامة السلام حمامتك<br />سلامة الحمامة وسلامتك يا ريس<br />ياريس حمامة ياريس كويس<br />على تل مصر ياريتك تهيص<br />خرابة فسيحة عليها تمتيس<br />وأأمر تطاع فشعبك مفيص"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041735/http://masr.20at.com:80/article.php?sid=360&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

