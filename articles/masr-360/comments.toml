author = "ماجده سعيد - كاتبه"
posted = "2006-05-28"
text = "نعم أعرفه...!<br />أعرف أنه صوت الحق الذى طال انتظارناله.<br />أعرف أنه من الذين بصدق فيهم قوله عز وعلا :\"ومن المؤمنين رجال صدقوا ماعاهدوا الله عليه \"<br />أعرف أنه صوت مصر الحقيقى الذى علا فوق كل نشاز من أصوات النفاق والكذب !<br />شفاه الله وعافاه ،ووفقه هو وصحبه الكرام."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041735/http://masr.20at.com:80/article.php?sid=360&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 20
subject = "كلنا 0000البسطويسي"
author = "الاستاذشيكو"
posted = "2006-05-28"
text = "هذا الرجل يستحق منا كل تقدير هو ومن معه من الشرفاء ووالله لو انا منه اقدم استقالتي وارشح نفسي رئيس الجمهويه وهايكسب ان شاء الله وكفايه انه ماخدش حاجه لنفسه<br />مش زي غيرة دخل ابنه وكيل نيابه بالعافيهولا استفاد من الفساد اللي في السلطه<br />كلنا معك ومع الشرفاء في هذا البلد"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041735/http://masr.20at.com:80/article.php?sid=360&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

