posted = "2006-05-27"
text = "عايزين تحرجوا النظام اللي من ساعة الازمه ما بدأت و هو سايب كلابه في الصحافه القوميه يشنعوا على القضاه انشروا سيرة المستشار هشام في كل مكان و في كل الصحف المستقله و الحزبيه عشان الناس تعرف الفرق الحقيقي بين العظماء امثال المستشار هشام و كلابهم المنتشرين في كل مكان و كابسين على نفسنا ياكشي ينكشفوا و يمكن ستحوا و يحلوا عننا"
