[[comments]]
order = 38
subject = "شرف مصر"
author = "علاء البراز . محام حر"
posted = "2006-06-13"
text = "في زمن عز فيه الرجال و تكاد مصر تحتضر يظهرأمل مصر في البسطويسي وصحبه الاطهار ليثبتوا للعالم أن مصر علي قيد الحياة وأن ما تمر به البلادمحنه طارئة . وأقول له لاتحزن يا سيادة المستشار الجليل و من معك ، ان اللوم الذي وجه اليكم انما هو وسام علي صدركم،والحمد لله أنكم لم تحصلوا علي وسام من هذا النظام لأن حملة أوسمة هذا النظام انما هم معه في مذبلة التاريخ .و تحضرني مقولة : و في بلدي كانوا يقيمون الحدود علي اللصوص ولم يقم فيها الحد الا علي شخص واحدشريف لأن اللصوص كانوا مشغولين باقمة الحدود .يا سيدي اذا كانت الاحكام تصدر باسم الشعب فان الشعب و هو الاصيل في الحكمقد قضي في هذه القضيه بادانة نظام الحكم كله .يا سيادة المستشار الطاهر مصر تضعك في القلب منها ونحن نفخر أن هشام البسطويسي ابنا بارا لمصر"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041735/http://masr.20at.com:80/article.php?sid=360&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

