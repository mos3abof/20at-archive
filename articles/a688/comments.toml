[[comments]]
order = 10
subject = "مكسوفة"
text = "أحب أقول للأخ المدايق والمخنوق<br />إن صاحب المقال أكيد مش كان قصده يعمل إعلانات على الأماكن الوحشة أعوذ بالله<br />هو نيته خير وبيقول كدة من باب التأكيد والوثائق بس وعشان كل الناس الي في مصر عارفة ، وأنا بنفسي كمان شفت ناس بتاكل في مول كبير مش في مطعم صغير ورا الباب<br />وكمان اللي عايز يفطر مش مستني اعلانات عشرينات عشان يفطر ، اللي مش بيخاف من ربنا بياكل في بيته حتى مش فارقة معاه<br />أرجو إنك متزعلش نفسك ومتكونش مضايق وربنا يسعدك<br />والموقع دا موقع كويس ومتدين ومش بيشجع الناس على الفطار ، مش أكتر من إنه بيبين السلبيات<br />وكل سنة وانتو طيبين"
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025110743/http://www.20at.com:80/article.php?sid=688"
