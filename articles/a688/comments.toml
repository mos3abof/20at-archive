subject = "مخنوق متضايق مهموم"
text = "بصراحة شدني العنوان جدا جدا جدا<br />قلت ادخل اشوف<br />لم اجد غير اعلانات عن الاماكن اللي واحد مفطر يستطيع ان يروح هناك ويفطر براحته بس في نقطة ناقصة عايزين نعرف الاسعار أمال ايه علشان تكون الامور على بينة<br />وسلم لي على مدفع الافطار ."
