[[comments]]
order = 1
subject = "مكسوفة"
text = "المقال طبعًا حلو ومثير ومرتب تسلم<br />لكن يعني ايه شيوعين كرملين ؟؟؟؟<br />أنا بيتهيألي والله أعلم من معلوماتي إن دي أسامي أماكن في روسيا ؟؟؟؟<br />ياريت تنوروني ، وإيه دخلها بمصر واللي بيفطروا ؟؟<br />ومفروض أي حد مش مسلم يراعي مشاعر المسلمين وياكل في بيته ، والعيب مش عليهم ، على اللي بيفتح مطاعم ويعمل أكل في النهار وللأسف حتى ممكن يكونوا الطباخين مسلمين<br />مادام مصر بلد إسلامية يبقى لازم كل اللي مش مسلمين يراعوا كدة وياكلوا في بيوتهم<br />وعلى رأيك هي فعلا فضيحة بجلاجل ، أنا مرة كنت في مول وشفت عيلة واخدة ترابيزة في ركن بعيد ومستخبين وبياكلوا ، طبعن خمنت إنهم ميكونوش مسلمين ، طيب لما انتو متدايقين أوي كدة لأن كل الناس بتبص لكم وبتبص لأكلكوت ماتاكلو في بيوتكم<br />ناس عيزة تتمنظر بقى تقول إيه<br />كلهم في الآخر نهايتهم مستشفى ونزلة معوية لأن ناس كتير كانت جعانة وبصت عليهم<br />ههههههههههههه<br />ربنا يشفيهم بجد على رأيك من (الهبل) :))<br />مرة تانية :) تسلم :)"
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025110743/http://www.20at.com:80/article.php?sid=688"

