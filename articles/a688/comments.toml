[[comments]]
order = 3
subject = "وائل عباس"
text = "البتاع ده اللي اسمه افطر ايت<br />خدوا الايميل بتاعي وحطوه في قايمة المراسلات ما اعرفشي منين<br />مع اني لا شيوعي ولا عمري رحت هناك<br />مينيمام تشارج اربعين جنيه ليه<br />هو انا ابويا حرامي وباع القطاع العام<br />ولا واخد قرض من البنوك بدون ضمانات<br />ولا انا باشتغل منادي سيارات<br />ولا باشحت في الاشارات<br />المضحك انه جالي اول يوم في رمضان ايميل اعلان عن برنامج رمضان<br />وفي ذيل الاعلان وهو بالانجليزي طبعا<br />انه بمناسبة شهر رمضان لا نقدم الخمور الا للاجانب<br />طبعا اترميت على الارض من الضحك<br />خلاص يعني جت على دي ..."
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025110743/http://www.20at.com:80/article.php?sid=688"

