author = "من يعدل الدستور !!؟"
posted = "2010-03-07"
text = "هو الدستور دة هبة او منحة من الرئيس للشعب - وقت ما يحب يغيرة يغيرة ووقت ما يقول لا يبقى لا<br />هل نحن على كلام الخديوى توفيق لاحمد عرابى<br />ما انتم الا عبيد احسانتنا<br />هل صحيح نحن عبيد احسان سيادة الرئيس بتعديل الدستور<br />والا الشعب هو مصدر السلطات وهو اللى يحط الدستور اللى يناسبة<br />انا ضد البرادعى فى طلب التوقيعات واطلب من البرلمان او المزلقان ان يطلب تغيير الدستور وتصحيح موادة لتتطابق مع نصوص حقوق الانسان فى الامم المتحدة والحرية والديمقراطية"
archived = "2010-03-09"
