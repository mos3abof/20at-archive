author = "سفاهة"
posted = "2009-11-25"
text = "كان اولى بالسفية الذى امر بتلك الاموال الى هؤلاء الارزقية ان يحولها الى الفقراء والمعدومين وما اكثرهم فى بلد مملؤوة بالفقراء والجوعانين<br />كان من الممكن ان يحولها الى اليتامى واطفال الشوارع والارامل ومن يجلسون للتسول<br />كان من الممكن ان يصلح بها شبكة مياة قرية نائية تشرب من المجارى<br />ولكنها السفاهة والحمق والجهل والزهايمر<br />لو كانت من فلوس ابوة - ماشى مقبولة - ولكنها من فلوس الغلابة دافعى الضرائب والجمارك فى المطارات"
archived = "2009-11-29"
