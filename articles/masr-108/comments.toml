[[comments]]
order = 3
subject = "كفاية كلام عن التوريث عايزين بديل"
author = "مصرى"
posted = "2006-11-05"
text = "زهقنا كلام عن التوريث ..باختصار عايزين الآتى : اسماء بديلة لديها الاستعداد والامكانيات لتحمل مسئولية حكم مصر ، قانون انتخابات يسمح للجميع بالترشح وممكن يكون بينهم جمال مبارك ايه يعنى المشكلة،عدم تدخل الداخلية فى الانتخابات. هذا هو ما يجب ان نتكلم فيه .. وبعدين كل اللى بيتكلموا عن التوريث عندهم حد يقدر يحكم مصر .. قالوا أى اسم بديل .. فيه حد يقدر يشيل المسئولية بس يكون أدها."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117203054/http://masr.20at.com:80/article.php?sid=108&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
