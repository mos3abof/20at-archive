[[comments]]
order = 0
subject = "كله ماشي ..."
author = "sweet_princess"
posted = "2006-04-02"
text = "والله انا مابقيتش اشك انه هياخدها بعد ابوه ..<br />بس المشكله هنا ...<br />هل سيتبع السيد جمال نهج السيد الوالد ام انه سيكون اسوأ..<br />ماحدش عارف ..<br />لكن برضه فيه شيئ تاني ..<br />ياتري احنا كشعب مصري هنسكت على توليه الرياسه بعد ابوه ؟ ..<br />ولا هنتحرك ونعمل حاجه ؟!!!!!!!!<br />سؤال مش عارفه اجابته<br />لكن برضه سواء هو او غيره من الحاشيه العمليه برضه (في بيتها )<br />واهي ليلى زي سونيا"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211246/http://masr.20at.com:80/article.php?sid=108&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "حوار حر"
author = "عمر حجاج"
posted = "2006-04-10"
text = "مما لاشك فية ان جمال بنسبة مليون المية ولا يوجد من يقف في طريقة فالاحزاب كلها فساد وهم جماعة منفعين واصحاب مصالح وعلي سبيل المثال يتكلمون علي تداول السلطة وكل رئيس حزب قابض علي الكرسي عشرين سنة او اكتر والصحفيين معظمهم مرشد مباحث مثل رفعت سعيد وصلاح عيسي الدي تحول من معارض كبير الي مؤيد كبير وكل عناصر المعارضة مخترقة وعلية فالطريق مفتوح وبسهولة ومبروك عليك يا جمال من شعب نصفة منافق ونصفة مرتشي"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211246/http://masr.20at.com:80/article.php?sid=108&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

