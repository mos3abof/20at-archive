[[comments]]
order = 42
subject = "لا حول ولا قوة الا بالله"
author = "دة اول مرة اكتب"
posted = "2006-11-14"
text = "بس كان لازم اكتب واقول الي في نفسي<br />الموضوع جميل جدا من حيث طريقة عرضة الساخرة<br />بس عمرها ما هيكون في حاجة عدلة في البلد طول ما احنا اعدين نطلع من الموضوع ونخش في موضوع ومحنش عارفين احنا عوزين نقول اية<br />احنا مش عارفين نتكلم مع بعض بأسلوب حر ونضيف<br />حتى في موقع حر<br />ازاي عوزنا نكلم العالم الي برة دول<br />انا مش مستغرب ان مفيش حرية في مصر<br />علشان احنا منعرفش يعين اية حرية تعبير<br />فكرين ان الحرية هي الشتيمة وقلة الأدب<br />ودة عمرها ما كانت حرية تعبير عن الراي<br />انا مش جياعلم حد حرية التعبير عن الرأي<br />بس أتمنى اني اشوف مواضيع زي دة بس مشفش تعليقات زي دة<br />ولو كلامي معجبش حد بلاش يقرأ الكلم"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121222840/http://masr.20at.com:80/article.php?sid=706"

