[[comments]]
order = 4
subject = "إلى السادة الهنود"
author = "واحد طوارئ"
posted = "2006-07-25"
text = "السيدات والسادة الهنود<br />تحياتنا وقبلاتنا<br />بلغنا من قراءة هذا الخبر أننا فزنا بجائزة التوافق الدولي ورغم عدم علمنا للأسف بمعنى التوافق الدولي ده إلا أننا ننظر لجائزتكم بعين الشك والريبة .ونعتذر عن عدم قبولها لأسباب منها أنها أولا جائزة هندي يعني مضروبة حسب ثقافتنا الواسعة الشاسعة (الفزيعة) التي اكتسبناها طوال ثلاثين عاما من الحكمة والراس الكبيرة .لدرجة اننا أعدنا ترتيب التاريخ وفق حقائق كنا عمشانين عنها .منها أن مجرد وصف شخص أنه هندي فيعني أنه غبي وحمار وجاهل أحمق (آه والله) وبصراحة كدة مش مصدقين إنه كان فيه واحد عظيم غسمه غاندي كان في الهند وحررها لوحده من الانجليز ولا فيه حد إسمه نهرو بتاع عدم الانحيازاللي عملت لنفسها شخصية وسط المعسكرين الشرقي والغربي .. يعني من الآخر .إحنا مانعرفش عنكم حاجة.. يبقى نقبل منكم الجايزة دي ليه... ثانيا بقى وده الأهم إن رئيسنا المحبوب طوال تلاتين سنة وهو مهري جوايز من كل حتة .. حتى السما بتنزل علينا جوايز بفضله .. انتم مش شايفين الجوايز اللي عمالة تنزل على لبنان وبغداد وفلسطين .. أهي دي من فضلة خير ريسنا المحبوب... فمش معقول بقى نقعد نلم في الجوايز الفسكانة بتاعتكم ودي عايزه لها مشوار طويل ريسنا في غنى عنه .. وبصراحة بقى احنا خايفين لو الريس خطف طيارته لحد عنكم يقوم يحصل له زي ما حصل لمعاوية ولد طايع بتاع موريتانيا .. ونضيع إحنا بقى... فعلشان خاطرنا سيونا مشكورين نلقط رزقنا من هنا أو هنا .. من حوالينا يعني.. غيشي معونة وإيشي جايزة بيع العراق والوشاية بيه..وإيشي جايزة فتح قناة السويس والمطارات للأمريكان يدغدغوا اخواننا في العراق.. وإيشي جايزة بيان إدانة حزب الله وتك الصهاينة يعربدوا في لبنا بس بمقابل طبعا ..الحكاية مش سبهللة .. ليه هو إحنا ولا م<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121222840/http://masr.20at.com:80/article.php?sid=706"

