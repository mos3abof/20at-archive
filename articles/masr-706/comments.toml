subject = "طالب"
author = "أنسان مصري"
posted = "2006-10-26"
text = "أهلاااااا يخويا انا واحد من المصرين فكرهم ولا نستهم المهم أنا طالب طالب حجات كتير انا سني 21 سنة في البكرليوس المفروض أنا بورسعيدي أبن عن جد معرفش أعيش في حتي تنيا غير بورسعيد فكرها ولا نستها من صغري بحلم أكون ظابط حلم طفل زي باقي الأطفال مدخلتهاش عشان أنا بورسعيدي مطولش عليكو انا الوقتي بفكر في حاجي وحدة اني أخلاص وغور من البلاد ديه زي إي واحد مع أن كل واحد بيحب البلد دية مسألتش نفسك السياح والأجانب بيدفوا فلوس عشان يجو هنا وحنا بنمشيي ليه عشان البلاد ديه معدش بتعتني المهم أن طالب عدل أنصاف أقول لك زي مألك الشيخ محمد متولي الشعروى رحمت الله عليه لوكنا قدرك يعينك الله علينا ولو كنت قدرنايعيننا الله عليك وكل شيءوله أخر أنسان"
archived = "2006-11-21"
