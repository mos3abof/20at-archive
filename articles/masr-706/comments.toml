posted = "2006-07-25"
text = "خلاص جددون عرفنا ان كل العبر فيه<br />عرفنا ان هو فيه كل الحاجات اللى انتوا عايزين تقولولناانها فيه و مافيهوش كل الحاجات اللى انتوا عايزين تعرفونا ان هى مش فيه<br />انا اسف انى اقول الكلام ده بس انا بحس ان اللى بيطلع يعيب فى الريس يا اما عاوز شهره او عاوز يثبت انه جرىء او اى حاجه غير الموضوع اللى بيكتب زى العيال المطربين بتوع اليومين كل واحد ينزله سينجل او ربع البوم يطلع يعيب فى عمرودياب ليه عشان هو وحش و لا عشان عاوز شهره او عاوز يثبت انه جرىء و الكلام ده<br />أسف انى اقول الكلام ده و اللى كاتبه صديق شخصى عزيز بس بمنتهى الصراحه<br />موضوعك قمه فى الزباله يا حماده<br />try again my friend"
