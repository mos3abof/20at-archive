subject = "نانسي طبعا"
author = "صايع وقديم"
posted = "2006-01-01"
text = "سؤال غريب طبعا حبيبة الملايين نانسي عجرم كفايه حنانها كفاية طيبتها كفاية انها مش بتخبي علينا حاجة (واخد بالك من دي) و عندها احساس بالشباب العربي و نفسها انها تدلعهم و تديهم جرعه حنان<br />الله يتوب عليها و علي الأقفاص اللي زيها<br />hebo_sherif@hotmail.com"
