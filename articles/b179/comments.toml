[[comments]]
order = 3
subject = "ماما حبيتي"
author = "مامانويل علي فكرة ده موضوع جميل ليه صح منخترش كل عام شخصية نسائية كان لها دور ايجابي في في العمل الاجتماعي والخيري ونكون هي ماما نويل"
posted = "2006-01-01"
text = "وانا اقترح ان تكون شاهنياز النجار مامانويل هذا العام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115952/http://www.20at.com/article2.php?sid=179"

[[comments]]
order = 4
subject = "مامانويل حلال"
author = "انا سعيد جدا بهذا الاقتراح واتمني ان نقوم بطرح هذا الفكر وتحليله فبابا نويل حرام لطنه مسيحي ولكن الحقيقة ان ما يقوم به بابا نويل هو منهج اسلامي يجب تطبيقه"
posted = "2006-01-01"
text = "ولماذا لانبحث عن شخصية في التاريخ الاسلامي كانت تلعب هذا الدرو مثل سيدنا عمر بن الخطاب او عمر ابن عبد العزيز او غيرهم<br />واما عن الشخصية النسائية فانا ارحب بذلك وارشح زينب الغزالي لتكون هي ماما نويل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115952/http://www.20at.com/article2.php?sid=179"

[[comments]]
order = 5
subject = "eggz"
author = "عبده نصحي"
posted = "2006-01-02"
text = "وماله لهو عيب ولهو حرام وكمان نعمل اغنيه بالمره بدل بابا اوبح تبقي ماما اوبح .. ايه دا يا جدعان الموضيع النار دي انا حاسس انه فيه كرتونه بيض وقعت عليا لما قريت الموضوع دا .. يا شيخه روحي امسكيلك كتاب احسلك وذاكري بدل ما تضيعي وقتك في الحاجات دي .. ويجعلوا عامر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115952/http://www.20at.com/article2.php?sid=179"

[[comments]]
order = 6
subject = "غباء"
author = "طاهرة"
posted = "2006-01-03"
text = "انتو كل حاجة عاوزين تقلدوها منهم لية ؟<br />علشان احسن مننا<br />وافكارهم انضف من افكارنا بكتيييييييير<br />ما تسيبوهم فى حالهم يعنى شجرة الميلاد وبابا نويل دى حاجات بتاعتهم لية يعنى التقليد الغبى دا<br />ماكل واحد يبص لنفسو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115952/http://www.20at.com/article2.php?sid=179"

