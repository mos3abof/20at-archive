order = 1
subject = "لا يجوز"
author = "ماياا"
posted = "2006-01-01"
text = "لا يجوز لاان بابا نويل قديس لدى مسيحى العالم كلو ؟؟؟؟؟ فلما بدكم التقليد منهن هن حق لهن لان هيدا عيدهن وسنتهن الجديدة وبابا نويل وشجرة الميلااد هيدى تبعهن هن وحدهن ولاا تشاركوهن هيك"
archived = "2006-11-02"
