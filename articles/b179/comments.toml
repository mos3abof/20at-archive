text = "صح طاهرة كلامك مضبوط<br />المفروض اللى يتكلم عن الكلام دا المسيحين بس اللى هنا لان الغرب مسيحى وهما زى اللى هنا مع بعض وبيعيدو سوا لولا اختلاف التوقيت<br />يبقى انتى يا ايمان مالكيش دعوة بفكرة ماما نويل دى خالص"
archived = "2006-11-02"
