text = "انا امشي مشيه شبابيه منذ الصغر وعندما كنت طالبة في الثانويه كانو يعتقدون بانني من الجنس الرابع حتى عندما اتحدث تتحدث يداي قبلي ولكن كنت اخاف الجلوس لوحدي لان بعض الفتيات تريد التحرش بي وكنت اصفي النيه واحاول ان اقنعهم بان ذلك يجعل عرش الرحمن يهتز وما نقول الا حسبي الله ونعم الوكيل على هؤلاء الغرب<br />شكرا لك استاذ ناصر على هذا الموضوع وهذه الانامل"
