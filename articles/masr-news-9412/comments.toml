posted = "2008-06-23"
text = "اولا المسيحين موحدين بالله والي يعتنق المسيحية مش بيعتنقها للمسيحيين وانما لله نفسه واهلا بعادل امام مسيحي او غير مسيحي واحنا اصلا الفيلم ده بالنسبه لينا زي اي فيلم لان مصر اصلا فيها حرب طائفيه ولسه والاحتلال هيكون افظع وشوية العيال بتوع الفيس بوك ده يروحوا يشوفوا بلاعه يدفنوا فيها لان المتنصريين اصلا مش محتاجين حد يهاجمهم وياريت بلاش الرعب ده من المسيحية"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202181505/http://www.20at.com:80/masr/news/9412.html"

[[comments]]
