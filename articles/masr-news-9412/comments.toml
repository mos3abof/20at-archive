author = "مسلم"
posted = "2008-06-23"
text = "بسم الله اولاء عادل امام دة ميخصنيص فى شى لكن مين خالد الجندى دة والله لو ان الله نهانا ان نتهم احد لا تهمت خالد الجندى وليس عادل امام بالردة حرام عليكم والله ان احنا نفكر باهيافة هو عادل امام دة بقى خلاص مصلح اجتماعى متشفوا افلامة فى السبعنيات العرى والا بتذل وبعد كدة نعملة بطل قومى ومصلح فعلا شعب متخلف وربنا لسة هيورينا من غضبة اكثر طول مفية فى الدنيا منافقين من امثال خالد الجندى وعادل امام خالد الجندى دعية الى الفسق والفجور وليس دعية اسلامى وعادل امام شغلة وكلامة وكله حرام فى حرام اليس التمثيل حرام عارف ان انتوا هتلقوا الف طريقة علشان تحللوة بس والله العظيم حرام حرام حرام"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202181505/http://www.20at.com:80/masr/news/9412.html"

[[comments]]
order = 1
subject = ""
author = "مش البراء اشرف ولا شريف الدواخ"
posted = "2008-06-23"
text = "التمثيل والصحافة والدين ثلاث قطاعات مثل مقبل الزبالة تماما<br />اي واحد يشتغل ممثل واي واحد يشتغل صحفي واي واحد يشتغل بتاع دين<br />مع ان التمثيل فيه حاجه اسمها معهد التمثيل ومعهد الفنون المسرحية والصحافة في كليات اعلام والدين فيه كليات متخصصة في تعليم الدين<br />يعني مثلا عادل امام دا خريج زراعة ايش علاقته بالتمثيل سوى البلطجه وقلة الادب<br />تماما زي الصحافة فيه ناس اشتغلوا صحافيين بلطجه خريج اي كلية وعاطل عن العمل ممكن يشتغل صحفي<br />وكذلك الدين محاسب دكتور ضابط سابق ممكن يشتغل بتاع دين ويكسب حلو اوي اوي يعني البابا شنوده دا ضابط سابق وبقى رئيس الكنيسة المصرية<br />وعمر خالد ووجدي غنيم محاسبين ودخلوا في الدين<br />فلازم الدولة تهتم بهذه القطاعات المؤثرة لابد اقتصارها على المتخصصين فقط<br />لان بصراحة التلت قطاعات دول هما سبب بوظان الدولة"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202181505/http://www.20at.com:80/masr/news/9412.html"

