author = "مش ححبك"
posted = "2008-06-23"
text = "عادل امام مش مهم<br />المهم ازاي الاخوانجي يوافق ان ابنه اللي المفروض مربيه تربية دينية يتجوز بنت واحد زي دا<br />تخيلوا لما بنت تتربى وتلاقي ابوها في مشاهل وسخه في السينما وافلام يسرا خير شاهد<br />بنت زي دي حيبقى شكلها ايه<br />ولما الاخوانجي مش عارف يربي ابنه ما له هو ومال الدولة وحسني مبارك<br />ما يشوف الخيبه اللي هو فيها<br />اذا ما كنش عارف يحكم ابنه يبقى حيحكم بلد ازاي"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202181505/http://www.20at.com:80/masr/news/9412.html"

[[comments]]
order = 4
subject = ""
author = "يا ولة"
posted = "2008-06-23"
text = "هل تعرفون قصة ايزيس الام والاب ازوريس والابن المقدس حورس<br />التثليث المقدس عند الفراعنة وحكاية الشرير ست<br />وكيف جمعت ايزيس الام قطع جثة ازوريس الاب واحيت الميت<br />هى اصل الديانة المصرية<br />بقايا الوثنية الفرعونية<br />ماهو التشريع فى المسيحية ؟ لا يوجد تشريع<br />ماهى قوانين الميراث والزواج - لا شىء<br />ديانة مجرد شوية نصائح لا تنفع فى الحياة الدنيا ولا تتفق مع طبيعة البشر<br />اليهودية ديانة لان فيها تشريع<br />ان المسيح هو عبد اللة ورسولة<br />لقد كفر الذين قالوا ان المسيح هو اللة"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202181505/http://www.20at.com:80/masr/news/9412.html"

