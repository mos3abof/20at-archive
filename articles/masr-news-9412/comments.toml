[[comments]]
order = 7
subject = ""
author = "ابو نور2005"
posted = "2008-07-07"
text = "السلام عليكم<br />اخى الشيخ خالد راجع نفسك كويس واتقى الله فما تقوله<br />اما بالنسبه لعادل هذا عمل يسى لك انت شخصيا وللاسلام العظيم اتقى الله<br />بالنسبه للنصارى فهم يعلمون لنهم يعبدون خروف ولم يعبدو الله ولم تكونو موحدين يوم واحد والدليل التثليث فى عقيدتكم<br />والله اعلم بما يخفى لنا هذا الشيطان الذى يقول عنه نفسه مسلم فى مسرحيه الزعيم عمل نفسه اله والدليل الصفات التى كانو يغنون بها مثل اسماء الله الحسنى واكيد فى كتير شافو هذا الكلام سيبو الاسلام للاهله<br />اما بالنسبه لهذا الفلم كان ولا بد ان يعلق عليه الازهر وياخذ موافقه منه والدليل الفلم الذى رفض الازهر ازاعته المصير<br />هذا ما اعلم والله تعالى اعلى واعلم"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202181505/http://www.20at.com:80/masr/news/9412.html"
