posted = "2006-09-04"
text = "صحيح ان اهل مكه ادرى بشعابها<br />ولكن ديننا يقول \"وأمرهم شورى بينهم \" وهذا الامر يخص نساء المسلمين كافة , كما ان الله عزوجل برحمته وحكمته لم يفرق بين الرجل والمرأة خاصة فى ادآء النسك والفروض، وهذه من اجل الشعائر الاسلاميه التى سنها الله عزوجل على الرجل والمرآة ، واكثر ما يتمناه المسلم والمسلمة هو رؤيه بيت الله الحرام ، فلماذا التميييز ؟!وردا على قول \" الرجال قوامون على النساء \" قوامه الرجل تلزمه بمراعاة طبيعتها ومشاعرها فهى مسئوليه سيسأل عنها وليست تشريفا."
