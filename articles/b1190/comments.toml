subject = "شي معيب على الاسلام"
author = "المرأة تذهب الى الأسواق وتذهب الى كل مكان ولايوجد من يحرم ذلك اذا كان بإذن وليها واليوم يفاجؤنا فقهاء التحجر بمثل هذه القرارات المتحجرة وكأن المرأة مخلوق مختلف مستثنى ليس له حق في الخطاب الإلهي في القرآن والتكليف الشرعي وكأن المرأة شيطانة متهمة لايأتي منها الا الفساد ."
posted = "2006-09-05"
text = "والله عيب على هؤلاء أن يكونوا واجهة للمسلمين لأنهم رمز التخلف والجمود هل تأتي المرأة من اخر الدنيا لتمنع من الصلاة في حرم الله بداعي مزاحمة الرجال .اتقوا الله في المسلمين يابدو الصحراء."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124207/http://www.20at.com/article2.php?sid=1190"

[[comments]]
order = 9
subject = "إنه مقترح... وليس قرار... أرجوكم تحروا الدقة"
author = "باحث عن الحقيقة"
posted = "2006-09-05"
text = "الموضوع يقول \"جاء القرار الجديد بمنع صلاة النساء في الصحن المخصص للطواف بالكعبة\"، وفي جزء آخر يقول \" فقد أثار قرار الرئاسة العامة لشؤون الحرمين استبدال الموقع الحالي المخصص للنساء في صحن المطاف بالمسجد الحرام بمكة المكرمة لأداء الصلوات بموقعين آخرين في الدور الأرضي يقعان في الشرفة الشمالية ويطلان مباشرة على الكعبة المشرفة بعيدا عن الزحام\"<br />وأحب أن اوضح أنه لم يصدر قرار بعد بهذا الشأن، وهو مجرد مقترح قدم من لجنة خاصة لدراسة الوضع بالنسبة لكيفية تفادي الزحام في صحن الطواف وتنظيم مصلى النساء.<br />وأرجو للمرة المليون أن تتحروا الدقة في صياغة المواضيع... شتان بين القرار والمقترح<br />وأمتنع التعليق على الموضوع ذاته احتجاجا على تكرار الأخطاء المهنية بالموقع."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124207/http://www.20at.com/article2.php?sid=1190"

[[comments]]
order = 10
subject = "ماذا تبقى"
