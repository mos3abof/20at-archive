posted = "2006-09-05"
text = "ليس من العيب ولا من الحرام التنظيم في الحياة الإسلامية التي باتت الفوضى مرتعاً لتلك الحياة المكبوتة...<br />لكن الخطأ كل الخطأ بترك كل الفوضى في الحياة الإسلامية والإتيان على الكعبة لمنع صلاة النساء فقط في صحن الكعبة فلماذا يسمح لهن بالطواف إذن يا منظمي الحياة الإسلامية..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124207/http://www.20at.com/article2.php?sid=1190"

[[comments]]
order = 11
subject = "الحقيقة انها قرار بناء على اقتراح"
author = "ابن الخليج"
posted = "2006-09-05"
text = "أخي الباحث عن الحقيقة<br />تعجبت من كلامك.. ولك أن تقرأ الخبر الأصلي وأنه قرار صادر من الرئاسة العامة لشؤون الحرمين الشريفين.<br />حيث نشرت الصحف وكذا \"المدينة\" السعودية وهي أول من أثارت الموضوع الخبر ونصه: \"قررت الرئاسة العامة لشؤون الحرمين الشريفين استبدال الموقع الحالي المخصص للنساء في صحن المطاف لأداء الصلوات بموقعين آخرين في الدور الأرضي يقعان في الشرفة الشمالية ويطلان مباشرة على الكعبة المشرفة بعيدا عن الزحام\".<br />وللتأكد راجع صحيفة \"المدينة\" يوم الجمعة 1 شعبان 1427 - الموافق - 25 اغسطس 2006 - ( العدد 15829).<br />وأتمنى منك ألا تقدح أحد بعدم التوثق من المعلومة وألا تتكلم على هذا الموقع الرائع.. فكل من فيه يحاولون التأكد مما ينشر ولا ينشرون أي كلام بدون توثيق.<br />ولك كل الشكر والتقدير لغيرتك على موقع الشباب العربي \"عشرينات\"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124207/http://www.20at.com/article2.php?sid=1190"

[[comments]]
order = 12
subject = "همسات"
author = "ياريت لأولاد حارتنا يتعبوا شوية و مينقلوش الأخبار نقل مسطرة"
posted = "2006-09-05"
text = "و للأخور اللي بيقولوا أن ده حرام<br />ياجماعة العملية عملية تنظيم فقط مش أكثر و إللي راح يحج أو يعتمر هيشوف المهازل من عملية الاختلاط تخيل أنك تصلي قدام أو جمب أمرأة تركح و تسجد كيف<br />أما في المدينة فالزيارة غير ممنوعة بالعكس متاحة لكن في أوقات معينة بحيث يكون للنساء فقط و هذا ما يصونهم و يصون الرجال في نفس الوقت<br />و همسة أخري لمن يبدأوا بالشتم و السب فستقفوا بين يدي الله عز و جل و تسئلون عن سببابكم لمشايخ السعودية فهم أهل علم و فضل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124207/http://www.20at.com/article2.php?sid=1190"

[[comments]]
order = 13
subject = "شكرا لغيرتك.. ودعنا نتفق على أنه \"اقتراح\""
author = "ابن الخليج"
posted = "2006-09-05"
text = "أخي الكريم الباحث عن الحقيقة<br />لنتفق سوياً أنه اقتراح..<br />ولكن: هل توافق عليه أنت؟؟ ام تعترض؟ سجل رأيك الآن للتأريخ.<br />الأمر الأخر إذا كنت أنت متخصص في الإعلام فأين ذهبت منك فكرة \"بالونات الإختبار\" التي تستخدمها جميع القطاعات الرسمية والأهلية لمعرفة رد الفعل.<br />وانا لم أقدك فيك ابدا بل أشكرك من أعماق قلبي لاعتزازك بالموقع والعمل المهني.<br />أتمنى لك التوفيق..<br />ولك مني كل الشكر والتقدير على غيرتك على \"عشرينات\"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124207/http://www.20at.com/article2.php?sid=1190"

[[comments]]
order = 14
subject = "لا تصدقوا الشائعات"
author = "محب الله ورسوله"
posted = "2006-09-05"
text = "السلام عليكم<br />أخي كلامك غير صحيح بأن الطواف للنساء ممنوع إلا في أوقات مخصصة ..<br />فأنا دائما أطوف ومعي أمي أو أختي عااااادي<br />وليس هنالك أوقات للنساء وأوقات للرجال في ذلك !!<br />رجاء أخي تحرَّ الدقة في ما تقول وتكتب فذلك محاسب عليك .. ولا تنسى أنه لديك ملائكة عن يمينك وعن شمالك يكتبون حسناتك وسيئاتك ..<br />الله يهديك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124207/http://www.20at.com/article2.php?sid=1190"

[[comments]]
order = 15
subject = "الاحرى بهم منع الاختلاط في الاسواق"
author = "وطن"
posted = "2006-09-06"
text = "كان الاحرى بهم ان يمنعوا الاختلاط في الاسواق الخارجية لمكة وفي المجمعات التجارية السعودية التي يبيع في بعض اسواقها الكثير من الرجال واحيانا رجال يبيعون الملابس النسائية؟؟وحتى في مستشفيات السعودية التي بات الاختلاط فيها ضروريا ومقلقا..فلما لا تطبق هذه الشرائع على كامل الارض السعودية ولماذا يتم تحديد مكة المكرمة قبلة المسلمين جميعاوهي بيت الله لكل عباده رجالا ونساءا..لم يحدث ذلك في عهد المصطفى صلى الله عليه وسلم..رغم كل شيء..فكيف تصدر هكذا فتوى لا سند لها من السنه؟؟..وعموما ارى ان الفتوى كان لابد ان تصدر على اتفاق من كافة العلماء المسلمين في بقاع الارض وليس من علماء وفقهاء السعودية وحدهم دون غيرهم وكأن الاسلام والحج والعمرة قد جعلت لهم دون غيرهم من عباد الله..فنحن امة واحدة..مصيرنا وشرائعنا واحده..والدين يسر وليس بعسر ولا يجب حرمان المرأة المسلمة من حقها في الطواف او حتى الصلاة عند مقام ابراهيم عليه السلام..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124207/http://www.20at.com/article2.php?sid=1190"

[[comments]]
order = 16
subject = "رفقا بالقوارير"
author = "الدكتور"
posted = "2006-09-08"
text = "يا اخوانا معقوله في مسلم يكون بجوار الكعبه جاء اليها طائفا أو مصليا متعبدا وهيفكر ينظر نظره محرمه الى سيده مسلمه جاءت الى اطهر مكان على وجه الارض لتعبد الله يا ايهاالمتحكمون من الرجال في النساء رفقا بالقوارير فالنساء ليسو دنس لتبعدوه عن صحن الحرم وتذكر ان لك ام واخت وزوجه وبنت لهن الحق في العباده والتقرب الى الله مثل الذكور تماما وتذكر يا أخي متعة ولذة الصلاه في الصحن قرب الكعبه ولا تستكثرها على اخواتك المسلمات وفقنا الله جميعا لما يحب ويرضى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124207/http://www.20at.com/article2.php?sid=1190"

[[comments]]
order = 17
subject = "احترام مكانة المرأه"
author = "سالي"
posted = "2006-10-01"
text = "اتمنى من المسؤلين احترام تواجد المرأه في ارض الحرم وهوليس للرجال فقط وتعزيز مكانتها لانها الام والاخت والخاله والعمه والجده والزوجه والابنه فمن قصدالاذيه يوما فكانما اذى كل هذه الخصوصيات.فهذا بيت الله الحرام للجميع دون العنصريه فالويل لمن يمنع من الصلاه فيه والتحكم بالعبادات.وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124207/http://www.20at.com/article2.php?sid=1190"

[[comments]]
order = 18
subject = "خذو الحقيقة من أهلها"
author = "البنن"
posted = "2006-10-03"
text = "خذالحقيقة يا أبا جهل فأسمك يدل على تفكيرك ,وضيق عقلك وصدرك وقلة علمك وفهمك .<br />أن هذه الفكره جائت مجرد إقتراح وليس قراراً تم تنفيذه,فأنا من أهل مكه وأهل مكه أدرى بشعابها ,والإقتراح لمصلحة المرأة ولترك الحرية والمكان المناسب لها في وقت الزحام من الحج أو العمرة وليس منعها من الجلوس مطلقاً وجريدة \"المدينة\"نشرت هذا الخبر لتستطلع آراء الناس فيمالوتمت الموافقه علية ونجد هناك من أيد هذا الرأي من النساء أنفسهم بسبب ضيق المكان وأنه سوف يبدل لهم بمكان أوسع في الدور الأول .<br />وأخيراً هذه الفكره لم تتم الموافقة عليها وسيبقى الحال كما هو علية .<br />فلا يتشدق أحدمن أمثال أبا جهل على أبناء الصحراء والبدوا فهم أحرص منه على عرضه, وأحرص من غيره على حرمة الحرمين الشريفين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124207/http://www.20at.com/article2.php?sid=1190"
