text = "وحيد حامد كاتب كاذب و مخادع وبدل ما يقرفنابافكارة المسمومة يروح يشوف اهلة في قرية بني قريش شرقية سايبهم يشحتوا<br />1-لة اخ لسة خارج من السجن في قضية بانجو<br />2-أخوة الثاني متوفي و اولادة بيشحتوا في البلد<br />3-لة اخت مطلقة وليس لها اي عائل سوي قراطين تزرعهم ورث من امها<br />وابوة و امة ماتوا ولم يحضروا جنازاتهم وماتوا وهم غاضبين علية ، بعد دة كلة جاي عامل واعظ ."
