posted = "2006-01-15"
text = "انا مش شوفتش الفيلم لانى عايش برة مصر حتى لو عايش جواها مش حاشوفة لان من الاعلام يبان ان الفيلم بيحارب الناس اللى بدقون و ان كل اللى بيلبسوا عباية بيضة و يربى ذقة خلاص بأة ارهابى و الناس تخاف منة<br />كمان لفت نظرى فى الفيلم ان فية واحد بذقن بيستخدم سيف طب فين احترام العقوا هنا؟؟؟ هو فية حد انهاردة لسة بيستخدم السيوف و لا عايزين يبينوا اننا متأخرين و خلاص كلام فارغ و افلام عبيطة و سينما واقعة"
archived = "2006-11-02"
