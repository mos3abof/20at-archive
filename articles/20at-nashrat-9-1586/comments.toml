subject = "قدييييييمة !!!"
author = "بوصراحة الفيلم تعبان وقديم"
posted = "2006-01-16"
text = "وحيد حامد ...بيكتب فى المكتوب نفس الحال بالنسبة للبراء<br />ولامؤخزة بقى احترام عقل إيه إلى إنت جاى تقول عليه ...انا لامؤخزة بقالى فى الدنيا كتير وشوفت إرهابيين ومتطرفين ..مشفتش حد فيهم لابس جلابية بيضة ع الفرازة ولا ماشى فى الشارع بسيف ولا سنجة !!<br />وفى عز ما كانت إمبابة بيضرب بيها المثل فى الامور دى مظهرش حد طلع بسيف ولا سنجة وعمل العمايل دى ...<br />حنان (مصر المستباحة) فكرة اتقتلت تمثيل ...وبس<br />الفقرا والاغنيا او الفوق والتحت ... موضوع حرقه وحيد حامد كتابة وتكرار ...<br />سيما اونطة ...!<br />وبطلو مبالغات بقى وكلام مجعلص !!"
