text = "و سينما مفلسة لا تتكسب إلا بالعري و الجنس البهيمي أو بالإفتراء على المسلمين<br />أين الدراما المصرية المتخلفة من الدراما السورية التي تفوق الوصف و تعالج أزمات الأمة بموضوعية؟<br />حسبي الله و نعم الوكيل<br />و المصيبة أن يأتي بعض المفرطين و المفرطين ليهاجموا عمرو خالد الذي يقدم إعلاما إسلاميا حقيقيا"
