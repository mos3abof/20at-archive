author = "little artist"
posted = "2006-01-22"
text = "يا جماعه الفيلم كالعاده الممله الى اتعودنا عليها بيصور المسلمين بانهم ارهابيين مسلسلاتنا وافلامنا عرفت تضحك علينا كويس وصدقنا ان المسلمين هم الارهابيين وبالتالى بقينا بنهرب من الاسلام<br />الاسلام اللى هو السلام ونحن قوم اعزنا الله بالاسلام فان اردنا العزة بغيره اذلنا الله<br />يا جماعه ياريت تفكروا تفكير منطقى شويه وتعرفوا من هم الارهابيين<br />وللاسف الشديد ان السينما المصريه لم تصبح سينما هى مجرد فيلم تجارى صنع للكسب عن طريق المشاهد الى انتوا عارفينها وللاسف الممثلين المصريين لا يستطيع احد منافستهم فى تلك المشاهد<br />كل معايير الفن اختفت من السينما المصريه<br />والدراما المصريه فى اسوا عصورها على الاطلاق كل همهم قلة ادب او تشويه صورة الاسلام امام العالم كله طيب مش عاجبهم الاسلام مسميين نفسهم مسلمين ليه وبعدين اتفرجوا على المسلسلات التاريخيه المصريه كده حتحس انك بتتفرج على مسرحيه وبدل ما تبكى يخلوك تضحك تحس ان واحد بيسمع مفيش اى احساس<br />وانا فعلا مع الاخ الدراما السوريه راااااااااااااائعه بمعنى الكلمه دراما حقيقيه دراما تصنع نهضه فنانيها يصح اطلاق عليهم لقب فنانين واوضح امثله مسلسل الظاهر بيبرس والعبقرى عابد فهد عرف يمثل بيبرس بجد ومن اول بداية المسلسل لا توجد حلقه لم ابك فيها وشوفو الفرسان فى المسلسل والخيول والسيوف والمعارك تحس انك عشت فى الزمن ده بجد واحساس الممثلين وتعبيراتهم ورقة التصوير فعلا المسلسل ده رائع وتحس انه عقلك مقتنع بيه وكمان ملوك الطوائف والحور العين وصلاح الدين فعلا الدراما السوريه على القمه لكن احنا ممثلينا مش فالحين فى حاجه غير قلة الادب وفى انهم يجيبوا واحد لابس جلابيه وعنده دقن طويله وعمال يضرب ويهد ويقتل وكان هو ده الاسلام<br />وبعدين كفايه علينا ايناس الدغيدى التى جعلت الدراما المصريه فى القاااااع<br />ولا حول ولا قوة الا بالله."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131308/http://www.20at.com/article2.php?sid=262"

[[comments]]
order = 18
subject = "عقدة الخواجه"
author = "الظاهر اننا اتعودنا نبص بره ونتحصر على نفسنا"
posted = "2006-01-23"
text = "الاستذة مصرين على السورييين<br />اولا دى مقارنة بين سينما السوريين وتليفزيون مصر موش بين الدراما التليفزيونية للبلدين<br />وبعدين بدال ما نبص لسوريا ونمصمص شافيفنا<br />ندور على مصر نتكلم ف ايه اللى موش عاجب فيها بالظبط وايه اللى لازم يتصلح موش نسيبها بايظة ونفضل نتفرج على غيرنا وهما بيتطوروا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131308/http://www.20at.com/article2.php?sid=262"

[[comments]]
order = 19
subject = "كلمه للبراء و احمد حكيم و كالعاده عجبنى تعليقك يا مصرى"
author = "نيفين"
posted = "2006-01-25"
text = "ااولا للبراء انت مشروع ناقد متميز بيعجبنى نقدك جدا و بيفكرنى بنقدى اللى بحتفظ بيه ف درج المكتب و مش بنشره لان اتجاهى اكتر للشعر لكن انا مستغربه لاعجابك بوحيد حامد و صدقنى و صدق احمد الحكيم لان فعلا وحيد حامد افلس فنيا و توقيت الفيلم فاشل<br />كمان ان مصر ترمز ليها البطله فعلا فكره قتلت تمثيلا<br />البرومو بتاع الفيلم خلانى عاوزه اشوفه و دلوقتى بصراحه حاسه انى مليش نفس اشوفه<br />و بالنسبه للمصرى حلوه اوى لا تجادل ا لا تناقش يا اخ على<br />و بلاش يا جماعه المسلسلات السوريه لانها بجد بتفكرنى بالدراما المصريه بتاعتنا التى تسير حاليا فى طريق النهايه<br />ربنا يستر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131308/http://www.20at.com/article2.php?sid=262"

[[comments]]
order = 20
subject = "كفاية أن الجمهور لم يذهب لهذا الفيلم الهايف"
author = "عبدالله"
posted = "2006-01-25"
text = "وليه لم يتكلم وحيد حامد عن العري اللي بنشوفو بالزفت كليب مثلا . هو وحيد حامد فاكرنا عبط مثلا علشان يضحك علينا بأفلامه الموجهة ضد ديننا وضد عادتنا وتقاليدنا ؟!! يعني وحيد حامد هو رجل الإستقامة ... وإلا نور الشريف وإلا يسر ... الله يرحم أفلام نور الشريف ويسرا أيام شبابهم والبوس والمايوهات والخلاعة ... يبقي نور الشريف رمز للتحضر والمسلمين الملتحين رمز للتخلف والتأخر ؟!! يا سلام علي وحيد حامد وهو وسط الفنانين وكل واحد منهم ماسك بيده كاس الخمر وباليد الثانية السيجارة ... وجايين بيتكلموا ضد اللي بيقولوا لاإله إلا الله محمد رسول الله ... والحمد لله تعالي الفيلم فشل في دور العرض ولا في واحد عبره. وأنا بقول لوحيد حامد :\" كفاية يا وحيد العيال الصغيرين اللي كنت بتضحك عليهم بأفلامك كبروا وعرفوا الحقيقة والله يرحم البوس والعري والمايوهويات اللي في أفلامك وأفلام غيرك ... والفيلم بتاعك كان في ذيل القائمة وعقبال كل الأفلام اللي ضيعت وقتنا علي الفاضي \""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131308/http://www.20at.com/article2.php?sid=262"

