[[comments]]
order = 24
subject = "نهايات"
author = "شريف المهدي"
posted = "2006-04-12"
text = "نهاية الفيلم.....<br />الاهم من اننا نقول هى نهاية متوقعة ولا لأ ....<br />فعلاااا ديه نهاية واااقعية يعنى باختصار دة الواقع اللى ماحدش بيحب يصدقه ... مش لازم تكون النهايات زى ماتعودنا عليها<br />لان الحياة مافيهاش نهايات قاطعة وحلول لكل المشاكل وسعات كتير الشر هو اللى بيفضل ودايما اللى بيتأذى الناس اللى<br />مالهاش ذنب ..... اما عن الاجابة على السؤال ...<br />بالنسبالى انا النهاية كانت متوقعة .<br />النهاية غير تقليدية بالفعل .<br />* نهاية عم جابر عميش \"نور الشريف\" نهاية طبيعية جدا لكل نصاب او محتال .. ونور الشمس استفزت دموعي للانهيار .. انت جامد اوي يا عم جابر<br />* نهاية الهجام \" عمرو واكد \" اختفى بسرعة ولم نشعر به .<br />توقعنا انه يلاقي مصيره بعد ذلك اما انه يتوب او انه ينتقم او ان محمد ياسين ووحيد حامد قصدوا بها نهاية مفتوحة للمشاهد بحيث انه ممكن لأي حد يتوقع انه تاب او انه هينتقم والمشوار لسه طويل .<br />بس عمرو دوره انا بعتبره انه master seen الفيلم . بمعنى انه لا يمكن الاستغناء عنه .واقوى shot فيه اعلان الحد عليك بالشرع وقطع يد السارق .. وأقوى منها جدا كلمتك للشيخ ريشة وهي :<br />\"دي ايدي اللي ضربتك \" ياريت نفهمها كلنا ..ان تطبيق الشرع الاسلامي عند ريشة ليس لانك هجام وسارق بل بالعكس لانك ضربته واهانته ..بدليل ان ريشة اعتنق الخلية للانتقام لشعوره بالاهانة منك .<br />دور جديد جدا وشخصية فالجر ممتازة متواجدة في الحي المصري الشعبي .<br />* نهاية حنان \" منى زكي \" .. نهايتها غير متوقعة .. الانسانة الطيبة \"الغزال\" الطيبة ..الخير كله ..تموت ... فعلا هي دم الغزال البريء ليست لها علاقة بأي شيء . ضحية الشرطة<br />* نهاية الشيخ ريشة الطبال \" محمود عبد المغني \" دور اكتر من رائع .. ممثل جيد هيكونله شأن ..نهايته ايضا غير متوقعة ..أن مثال شر الاخوان و الارهاب لا يزال عايش وسطنا .<br />وتحية لوحيدحامد المبدع اللي فعلا قاصد يقول حاجة من ورا ده ان بلدنا لسه فيها مثال للشر عايشين الى الان .<br />الموسيقي عمر خيرت .. أبدع فأبدع فأقنع وأمتع كل من يشاهد الفيلم ويستمع لتلك الموسيقى الصارخة المنددة للتنظيم بكل العواطف الجياشة . بحييك يا استاذنا يا كبير على الموسيقى الرائعة .<br />ديكوباج الفيلم ملوش حل غير مقيد بوقت ولا زمن .. وده جميل ومفيد للبناء الدرامي للفيلم .<br />وشكرا<br />تحياتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131308/http://www.20at.com/article2.php?sid=262"

