[[comments]]
order = 9
subject = "الكاتب . . . قابض ؟؟؟؟؟"
author = "أحمد حكيم"
posted = "2006-01-16"
text = "لا يحق لي أن أشكك في ذمة أحد ، لذك أعتذر عن عنوان المقال ، و لكن - و الله - لقد خطر في بالي ذلك !<br />إن الذي يعتبر البطلة رمزا لمصر يعتبر إنسانا في ( سنةأولى سذاجة) !<br />ثم إن الفيلم فيه الكثير من الكذب المتعمد و الأحداث الضعيفة دراميا!<br />مثل طريقة انضمام الطبال للجماعة . . . !<br />لو كان اي طبال يستطيع دخول هذه الجماعة لما أنهكت الأمن عشر سنوات و لما عجز أمن الدولة عن اختراقهم لسنين !<br />ما الذي تستفيده الجماعة من انضمام طبال لهابحيث تجعله أميرا للجماعة ؟<br />و التركيز على القبض على الطبال في نهاية الفيلم و كأنه هو محور الفيلم !<br />موضوع تطبيق الحد . . . !<br />لم نسمع بأنهم فعلوا ذلك . . . ! حتى في أقصى حالات الكذب عليهم ! ! !<br />كل هذه أخطاء ساذجة . . . جعلتني أشعر بأن الفيلم ( سبوبة أكل عيش للمنتج و الممثلين )<br />أما أكثر ما أضحكني في المقال فهو : دم واحد لثلاثة غزلان!<br />و لكن هذه العبارة هي التي جعلتني أتأكد أن الكاتب (على نياته ) مش قابض ! ! !<br />أيها الأخ العزيز . . .<br />إنت فعلا ناقد ؟ بتتكلم جد ؟<br />سلم لي على دم الغزال . . . !"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131308/http://www.20at.com/article2.php?sid=262"

[[comments]]
order = 10
subject = "للأستاذ أحمد الحكيم"
author = "البراء أشرف"
posted = "2006-01-16"
text = "طبعا رأي حضرتك على عيني وراسي، لكن اسمح لي أن أختلف معك في جزئه هامة في تعليقك.. ليست تلك التي تراني فيها ساذجا لأن ذلك من حقك.. لكن تلك التي ترى فيها الفيلم مجرد سبوبة.<br />واضح جدا من كلامك أنك منحاز لصورة الإسلاميين في السينما، وفي هذا الفيلم خصوصا.<br />وأنا كذلك بالمناسبة، لكن الفرق هو أن تفهم أن هناك فرقا بين السينما والواقع، فليس المطلوب من المؤلف هو أن يصور لك الأحداث كما تحدث بالظبط، لكن أيضا يعمل عقله ويترك لخياله مساحة ليقدم في النهاية الصورة التي يريدها والتي تحتوي رأيه.<br />ووحيد حامد ليس مؤلفا واقعيا (بالمعنى الحرفي للكلمة) لكنه معروف برأيه الصارخ في أفلامه التي يشاهدها الجمهور وهو يعرف أن صاحبها يعاند الحكومة ويكره الإخوان والإسلاميين.<br />طيب يا استاذي أنا أرى أن حنان فعلا كانت صورة لمصر بتفاصيل كثيرة أعتقد إنك ستتذكرها لو كنت شاهدت الفيلم، وهو بالمناسبة ما أكده المؤلف في حديث منشور في أحد الصحف ( أعتقد المصري اليوم) وبالتألي فهذه النقطة لم أكتشفها أنا وحدي وبالتالي أيضا لا أتحمل سذاجتها وحدي.<br />في الحوار المنشور أيضا للكاتب يقول أنه يقدم في فيلمه نماذج لبشر يضيع دمهم هدر، وهو ما يجعلنا نكتشف أنه دم واحد وثلاثة غزلان بالفعل (البلطجي-عميش-حنان) وبالتالي فإن كوني على نياتي لا أتحمل مسؤليته وحدي لكن ربما يشترك وحيد حامد معي في الصفة ذاتها..<br />على كل حال أنا يشرفني أن أكون على نياتي وألا أكون صاحب أي نوايا سيئة.. لكن ما أتأكد منه وأعرفه جيدا عن وحيد حامد إنه ليس على نياته ابدا.. وشاهد أفلامه وستنتهي للنتيجة ذاته..<br />على كل حال أيضا رأي حضرتك أحترمه، لكني أردت أن أبين لك بعض النقاط التي ربما تكون هامة ..<br />وشكرا<br />البراء أشرف<br />كاتب المقال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131308/http://www.20at.com/article2.php?sid=262"

[[comments]]
order = 11
subject = "ناس منتهي الهبل والعبط"
author = "النقد دة من عندي"
posted = "2006-01-17"
text = "الارهاب صنعة اعلامنا وصحافتنا<br />ناس تدعي الابداع ويقولوا ان المشاهد اللي فيها عري قال اية موظفة ويقولك نور الشريف انا قدمت مشاهد جريئة جريئة علي مين بالظبط علي حرام ربنا حرمة لما ينام في فيلم الحفيد فوق مرفت امين ويقعد يفترسها بوس طبعا كلكم مكسوفين من الكلام يبقي الفيلم اية بقي مش عارف سيادتة لما ربنا يسالة انت عملت كدة لية حيرد يقول اية لا معلشي كنت بابدع والدور موظف والكلام اللي اشتغلونا بية<br />يسرا من غير كلام بطلة في الهجس<br />مني حرام تبقي في صفوف هؤلاء النجوم من وجهة نظرهم طبعا الله اعلم ممكن تبقي نجمة زيهم بمفهمهم<br />وحيد حامد افلامة سطحية ومش عارف يعالج حاجة قلي عالج اية علي مدي السنين الطويلة اللي فاتت ولا حاجة لا ينفع تحارب الفكر بالسلوب السطحي العبيط اللي بيقولة في افلامة طبعا شباك التذاكر ينساة لان الناس هرشت انة بيبع كلام ويضحك عليهم علشان الفلوس وبس<br />لا ويقولولك انا ضد مسطلح قصدي مصطلح السينما النظيفة طبعا هما ضد لما راجل يسمح لمراتة تنام مع واحد قدام الملايين وتتباس وتتحضن واللي بالي بالك يبقي عايزها نظيفة ازاي لا لازم تبقي وسخة بالمعني الرهيب<br />كل واحد يحط جنس في فيلمة اعرف انة ضعيف لانة بيخاطب الغريزة علشان ينجح لا ويقولوا ينقلوا الواقع هو الواقع جنس طيب احنا بندخل التواليت كليوم لية مش بينقلوا الواقع دة<br />ناس زفت بجد<br />انا بحب افلام محمد سعد عارفين لية لانة مش فيها قلة ادب وجنس مش مصدق شوف وقلي<br />ويجا زفت كلة جنس واقع ياعم<br />فتح عينيك تجربة كويسة مفيهاش جنس ادخلة وبالش دم الحمار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131308/http://www.20at.com/article2.php?sid=262"

[[comments]]
order = 12
subject = "اعتذار"
author = "أحمد حكيم"
posted = "2006-01-17"
text = "الأخ الأستاذ البراء . . .<br />منك لله يا أخي . . . طلعت كمان مؤدب و ابن حلال . . . و لذلك سأضطر للاعتذار عن أي اسلوب استفزك . . .<br />و لن أطيل في التعليق سوى في شئ واحد . . .<br />يا أخي . . . يا عزيزي . . .<br />وحيد حامد عارفينه كويس . . .<br />ومن الدلائل على أننا نعيش في زمن أغبر . . . أن نجد كاتبا ( طيبا ) مثلك . . . يظن أن هذا الوحيد حامد كاتب ناضج . . . و عنده آراء . . . الخ . . .<br />يا أخي . . .<br />روح اتفرج على كام مسلسل سوري . . . اتصرف عليهم عشر اللي اتصرف على أفلام وحيد حامد . . . و انت تعرف يعني إيه عمق . . . و يعني إيه إسفاف !<br />يعني إيه البحث عن الحقيقة . . . !<br />و يعني إيه تزييف الحقيقة . . . !<br />يعني إيه عمل فني . . . !<br />و يعني أيه عم لصاحب غرض !<br />أكرر التحية و الاعتذار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131308/http://www.20at.com/article2.php?sid=262"

