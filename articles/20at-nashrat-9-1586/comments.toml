order = 13
subject = "ينصر دينك"
author = "انا معاك معاك معاك يا استاذ ناس منتهى الهبل و العبط انت بصراحة كلامك كيفنى اوى اوى ربنا يقدرك دايما على قول الحق حتى كلامك على محمد سعد اللى ناس كتير بينتقدوة بردو صح انا معاك اوى فى كلامك علية انا واحد من الناس باحبة جدا جدا و باخوش لتفرج على الفيلم و انا مستريح و باخد معايا اختى كمان لانى واثق انها مش هتشوف حاجة وحشة او حاجة اخاف عليها منها"
posted = "2006-01-17"
text = "يارااجل دة الافلام الجنبية و اللة اصبحت انضف من الافلام العربى انضف بكل ما حملت الكلمة من معنى و انا مسؤل على الكلام دة<br />لو خلاص مش قادرين يقدموا حاجة نضيفة خلاص مايؤذيناش بالارف و الوساخة اللى عمالين يبلونا بيها دة حسبنا اللة و نعم الوكيل"
