subject = "دم البتنجان"
author = "مصــegyــري"
posted = "2006-01-20"
text = "\" لا تجادل ولا تناقش يا اخ علي\"<br />هي مش المفروض النغمة دي خلاص قدمت<br />اقصد نغمة الاسلاميين المتطرفين و \" امير الجماعة\" و الحوارات اللي اثبتت انها فكسانة<br />خاصة بعد ان اثبت الاخوان في الانتخابات ان فيه اسلاميين مسالمين وهم الغالبية في مجتمع الاسلاميين .<br />اللي عايز اقوله ان فكرة تخويف الناس من الاسلاميين عبر السينيما اصبحت قديمة و غير مناسبة الا لفترة التسعينيات المنصرمه<br />يبقى فيلم زي ده دلوقتي .. ايه لزمته .. الله اعلم !!<br />و بصراحة فكرة منى زكي اللي عاملة فيها مصر دي ... مش عارف ابلعها يا استاذنا !!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131308/http://www.20at.com/article2.php?sid=262"

