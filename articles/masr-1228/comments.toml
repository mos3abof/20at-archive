[[comments]]
order = 0
subject = "جميل يا عجم"
author = "نيفين نيفى نوفا"
posted = "2006-11-29"
text = "مقال حلوكالعاده و جديد يا عجم<br />انا عن نفسى كل مره بقف فيها ادام الاهرامات زى اول مره<br />نفس الرهبه و الانبهار و الهشه الممزوجه بالخوف و احساس عميق اول بالوطن و بالخضاره و بمعنى كلمه مصر و ترديد لعباره على اسم مصر التاريخ يقدر يقول ماشاء<br />انا سمعت عن موضوع العجائب الجديده و انا واثقه ان الاهرام فيها سواء دى حمله ليها وزن و لا لا<br />و برشح قصر الحمراء<br />و تمثال الحريه"
archived = "2006-12-11"
capture_url = "https://web.archive.org/web/20061211114821/http://masr.20at.com:80/article.php?sid=1228"

[[comments]]
order = 1
subject = "هي الأهرامات لسه ما اتباعتش ...؟؟؟ كويس والله"
author = "إبن بهية"
posted = "2006-11-29"
text = "ياهـ ... هي لسه موجوده الأهرامات دي ؟؟؟ طيب الحمد لله أن مبارك الواطي لسه ما باعهاش ... ربك يستر .. وبعدين عجايب إيه اللي هيعملوها جديد ؟؟ أعتقد يمكن استبدال سور الصين العظيم بالجدار العازل في فلسطين المحتله .. ده أعجب العجايب في الزمن الأغبر ده .. لما ييجي لص قاتل إرهابي ويبني حيط في وسط بيتك ويقولك عشان أستخبى فيها منك .. يا حرامي والله مش هينفع معاك ولابد من يوم يجيلك أولاد بهية ويحرقوك جوه السور بتاعك ده ..صبرك يا عبيط يا صهيوني .. عيبك يا صهيوني إنك مش بتقرا تاريخ وما تعرفش يعني إيه بهية وأولاد بهية .. غرك الكلاب الألاديش اللي بيحكموا دلوقتي وبينفذوا أوامرك ...لأ يا أهبل راجع تاريخ بهية كويس ولملم عصابتك واخرج من فلسطين أظن شققهم في روسيا وأوروبا كلها وأمريكا لسه على حالها مستنياكم قبل ما تتحرقوا في فلسطين ...ده مش حلم والله يا طابور خامس .. دي حقائق تاريخيه ما فيهاش جدال بالمره ... ذاكروا تاريخ الأول<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-12-11"
capture_url = "https://web.archive.org/web/20061211114821/http://masr.20at.com:80/article.php?sid=1228"

[[comments]]
order = 2
subject = "ااااااااااااااااااه يابن بهيه"
author = "تايه فى بلاد الله"
posted = "2006-11-29"
text = "ولاد بهيه زمان غير ولاد بهيه دلوقت يابن بهيه! زمان كان فى نخوه وشهامه زمان كان فى محمد كريم وكان فى احمد عرابى زمان كلمة الازهر كانت مسموعه فى ارجاء الدنيا زمان كان فى عبدالله الشرقاوى والشيخ السادات (مش السادات بتاعنا)زمان كان فيه عبدالله النديم وكان فى عبد الناصر(بس ده بتاعنا) زمان ولاد بهيه ماكنوش بيخافو من بندقية الانجليز اليوم بيخافو من عصايةالامن المركزى طب والله العظيم بيخافو يعدو من قدام باب اى قسم شرطه --- انا مش بقول كده علشان اثبط الهمم (ال يعنى فى همم)ولا علشان تيأس من الكتابه عن ولاد بهيه لا والله انا ماقصدتش غير انك تفوؤ من الحلم الجميل احسن يتحول لكابوس كئيب بهيه ولادها غايبين بهيه ولادها تايهين جايز يعدى جيل ووراه جيل ويجيىءابن بهيه الاصيل بس مش فى ده الجيل"
archived = "2006-12-11"
capture_url = "https://web.archive.org/web/20061211114821/http://masr.20at.com:80/article.php?sid=1228"

[[comments]]
order = 3
subject = "انا سمعت انها اتخصخصت"
author = "ابو سيف قويسنا"
posted = "2006-11-29"
text = "الله عيك يابو عجم بس هيفضلو يتوهو لحد منصحا في يوم وندور علي الاهرمات وبرضو هنلاقي عندهم الرد جاهز انتا ناسي ان في كل بطولة مصر بتلعب فيها بكون في مجموعة الموت وفي كل مشكلة ان الموضوع يا جماعة تافة لحد متولع يا عم ربنا يحمي مصر"
archived = "2006-12-11"
capture_url = "https://web.archive.org/web/20061211114821/http://masr.20at.com:80/article.php?sid=1228"

[[comments]]
order = 4
subject = "قصة حمار"
author = "Rody star"
posted = "2006-11-29"
text = "قالو للحمار هو انت لية حمار قالهم اصل ربنا خلقنى حمار<br />بقى يا عالم الحمار يعترف انه حمار و احنا مش قضرين نعترف اننا بنىادم .......<br />احنا مش ممكن هنعترف بدة ابدا احنا عاوزين نقع اكثر من كدة اية مش قاضرين نعمل دعايا لنفسنا رغم اننا عندنا الى يخلينا اغنى البلاد بس تقولو اية فى العقول الضلمة دة مش دعاية وتصويت وبس لا دة حتى ملكة جمال العالم كان فيها بنت من عندناو احنا ما حولناش حتى نجيب سيرة ملكة جمال مصر انها فى مسابقات ملكان كمال الكون و لا حتى قولنا هو<br />يبقى بقى اية مين الاحسن احنا و لة الحمار....................................................................................................................................... لا تعليق"
archived = "2006-12-11"
capture_url = "https://web.archive.org/web/20061211114821/http://masr.20at.com:80/article.php?sid=1228"

