text = "يا شباب ياريت الأساليب الغير أخلاقيه دى فى أخواتنا و أمهاتنا بيتابعوا الموقع دا ياريت نراعى دا وياريت نغير ما بأنفسنا لعل الله يرحمنا ويصلح حالنا"
archived = "2006-06-27"
