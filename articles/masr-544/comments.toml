[[comments]]
order = 9
subject = "كس ام اللي جبتك يا حسني"
author = "اليائس"
posted = "2006-07-20"
text = "واللة لو تعرف نهايتك يا ابن المحضر يا كلب ما كنت تعمل اللي انت بتعملو يا عدو اللة وعدو الشعب اللة يلعنك في كل كتاب وكل دين اللة ينتقم منك علي كل شاب مش لقي شغل ولا لقي يتزوج اللة يلعنك ويلعن اللي جابك وماك علينا واولهم المعرص السادات اللي خلاك نائب لة وجاب لنا مصيبة مش رئيس منك للة يا عدو اللة لنا لقاة في الاخرة وستحاسب امام اللة يا قذر يا ابن الحرام"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908165847/http://masr.20at.com:80/article.php?sid=544"
