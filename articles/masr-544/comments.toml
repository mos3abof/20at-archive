[[comments]]
order = 7
subject = "سب والعن بس بلاش ألفاظ جنسية"
author = "محب آل محمد"
posted = "2006-06-26"
text = "السلام عليكم<br />كلنا دمنا محروق على الآخر<br />وكلنا نفسنا نشوفه في قفص زي صدام<br />بس بالله عليكم يا شباب بلاش الألفاظ البذيئة دي<br />يعني قول اللي انت عايزه بس بلاش استخددام الألفاظ الجنسية<br />لأنها قبل أن تأذي مبارك فهي تأذي قارئها وقائلها"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152338/http://masr.20at.com:80/article.php?sid=544"

