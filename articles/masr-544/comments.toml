[[comments]]
order = 2
subject = "هانيبال يحدد من هو الغبي"
author = "هانيبال"
posted = "2006-06-25"
text = "الغبي هو حسني مبارك ابن المرة المعرصة .. حيث انه يرفض تعيين نائب لرئيس الجمهورية رغم ان ده عادي جدا وكل رئيس او ملك في الدنيا كلها بيسيب وراه ولي للعهد او نائب ما عدا مصر .. طيب ليه حسنية الشرموطة مرعوبة من فكرة النائب ليه ليه ليه ؟؟ هو بصحيح ليه خايف من الموت للدرجة دي ؟؟ تفتكرو ان فيه رئيس في العالم كله( بما في ذلك رئيس الانفار ) ممكن يكون بالغباء ده ؟؟ هو فيه حد بيخلد فيها يا حسنية ؟ ده كله فاني يا عرص ولو مش مصدق قولي فين ابوك وفين امك وفين كسمك وفين صدام حسين والملك حسين ( بمناسبة كلمة حسين يعني ) وفين شارون وريجان وبقية الاصدقاء اليهود والامريكان .. اييييييييييييه دنيا .. ما تجاوب يالا مش عايز ليه تعين نائب .. انت ناسي ان سنك 89 سنة بعد التخفيض يعني كلها كام متر وتقلب العداد .. طيب والبلد مين اللي هايمسكهالما ربنا يكرمك زي ما كرم السادات ( مع الاعتذار لطلعت السادات ) .. اظن هاتقولي جمال وكده .. قديمة يا خول .. كان غيركم اشطر .. صفوت الشريف بتاع المخابرات النجس اللي ساندكم هو كمان كوعك منه والسكة والخول الصغير ابن امه يروح يمص في ذب احمد عز وانت فاهم وانا فاهم والشعب فاهم .. وتصبح عل خازوق قادر يا كريم .<br />عم ابو امك هانيبال"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152338/http://masr.20at.com:80/article.php?sid=544"

[[comments]]
order = 3
subject = "اضمه لهانيبال"
author = "سمير المصرى"
posted = "2006-06-25"
text = "بصراحه الولد ابن الجدع ابن الشعب الواد الجدع اللى كتب احسن كلمه ..هانيبال يسلم فمك والله مليش تعليق احسن منك لكن بيت شعر صغير<br />تسلم يا حسنى وتسلم بضانك<br />يلى العصر منور بنارك<br />تسلم يا حسنى وتسلم حممتك<br />حممتك سلمتك<br />علاء جناحك والشعب ناحك<br />تقوم من النوم تلقيه امامك<br />سلطان زمانك<br />وسبنا احنا شعب شعب معرص ورثاه عصابه<br />ونهباه ديابه..اه يابا اه يابا<br />من على بابا..وكفايه كدة مش حكمل"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152338/http://masr.20at.com:80/article.php?sid=544"

[[comments]]
order = 4
subject = "حاجة زفت"
author = "ee"
posted = "2006-06-25"
text = "اى انسان ممكن يقول رأية ودى حاجة كلنا نحترمها بس يا ريت بأسلوب حضاري اكتر من كدا كون انك تقول رأيك بالأسلوب دا دليل على انحطاط القيم والاخلاق اللى وصلنا ليها حتى لما نجى نقول رأينا مش عارفين نبقى بنى ادمين"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152338/http://masr.20at.com:80/article.php?sid=544"

[[comments]]
order = 5
subject = "وش البيضان"
author = "كركم"
posted = "2006-06-25"
text = "ورى كل مكتب حكومي هتلاقي صورةالغبي<br />يامصر يلا قومي كفايه كده والنبي<br />لحد امتى يابلدي هتفضلي تتربربي<br />مختار ودافنشي دول ناس من زمان<br />ما شافوش سحنه سيادته على كل الحيطان<br />عارف لوشافوا صورته كان اطلقوا العنان<br />وعملوا تمثال كبيييييير اسمه وش البيضان<br />وكس ام حسني مبارك"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152338/http://masr.20at.com:80/article.php?sid=544"

