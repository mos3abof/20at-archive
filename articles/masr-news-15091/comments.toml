text = "انا عايز واحد يشرح لى ازاى رئيس شركة فى مصر يبقى مرتبة مليون وربع المليون جنية فى الشهر ورئيس الجمهورية رسميا مرتبة 6000 جنية<br />رئيس الشركة دة على انهو كادر<br />وفى المالية اسمة اية الكادر دة<br />والشركة دى بتكسب كام وراس مالها كام مليون علشان تدفع مرتب لرئيسها مليون وربع فى الشهر<br />احنا فى انهو بلد<br />هى مصر بقت امريكا والا انا مش عارف<br />هم بيقسموا فلوس الشركات على بعض<br />اذا كان المدرس بيمتحن فى الكادر ويطلع عين اهلة علشان ياخد مرتب 300 جنية<br />فى اى قانون فى دولة مصر مرتب رئيس شركة حكومية يصل مليون وربع المليون جنية شهريا"
