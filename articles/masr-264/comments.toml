subject = "ايه"
author = "ربيع"
posted = "2006-05-04"
text = "ايه الحقد الطبقي بتاعكم ده<br />لو مكنش رئيس الجمهوريه هيقعد في قصر امال هيقعد فين علي شط النيل<br />ولو مكنش هو اللي يقعد في قصر امال مين اللي يقعد احنا<br />جتنا نيله في حظنا الهباب"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117142948/http://masr.20at.com:80/article.php?sid=264&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "كل واحد لية يوم"
author = "محمود ياقوت"
posted = "2006-05-16"
text = "لاحول ولا قوة الا بالله كل ظالم ولية نهاية بس البلد دى سلبية ومينفعش السكوت على اللى بيحصل دة حكومة كلها فاسدة باللى ماسكها لية منفكرش ان احنا نقوم بثورة زى جمال عبد الناص مثلا او ما شابة ذلك ونعيد بناء الحكومة وبعدين هيا الحكومة بقى ليها لازمة من بعد ما خصخصو تلات تربع البلد مبقاش فى حاجة يحكوموها دول باعو البلد ناقص يبيعو الشوارع ويبعونا"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117142948/http://masr.20at.com:80/article.php?sid=264&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

