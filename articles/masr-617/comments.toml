[[comments]]
order = 0
subject = "وليه لا؟"
author = "اصيل"
posted = "2006-07-08"
text = "وليه لا؟اذا لم يكن 1000مصرى حته واحده يموتوا فى حادثه العباره ويعالج الموضوع بمثل هذه السطحيه.وكأن الضحايا كانوا 5 بس فى عين العدو.ماهوصاحب العباره من اعضاء المجلس وتم تسريبه بره البلد .ثم طظ المرشد ثم جزمه السادات.ومجنون كنائس اسكندريه وباقى مجانين بلادنا نبقى ليه نستغرب ان يحدث هذا .بل سيحدث العن من هذا .فاستعدوا لذلك حتى لا تقعوا من المفاجأه على قفاكم.عندما وقعت حادثه المترو فى اسبانيا ولم يكن يتعدى عددالضحايا الثلاثين .كانت مناحه فى اسبانيا وذهب الملك والملكه والحكومه كلها.الى محطه المترو المنكوبه واعلن الحداد.بصراحه ناس محترمه .والحدق يفهم. علشان كده لغوا قانون البلطجه!!!!!!!!!!!!!"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010925/http://masr.20at.com:80/article.php?sid=617"

[[comments]]
order = 1
subject = "ما بين الطظ والطظ طظ كبير"
author = "ابو سهيله"
posted = "2006-07-10"
text = "الطظ الاولانية بتاعة الاخوان دي عيب عيب قوي لانها م الاخوان وتتفرشلها الجرايد وممكن يعملولها ندوات وبرامج لأن الموضوع كبير ازاي يقول طظ<br />اما الطظ التانيه ففبيتها اتنين وطني واحد طظ في واحد وقاله طظ وده زعيم الطظيظه في البلد وكبير الحزب اللي قال للشعب كله اكبر طظ في التاريخ<br />فمظنش ان الفقي يقدر يعمل حاجه لانه مشكوك في عضويته اصلا وهو اللي قال للقضاء طظ برضه بس بطريقه غير مباشره<br />ومعلش يا فقي منجيلكش في طظ"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010925/http://masr.20at.com:80/article.php?sid=617"

[[comments]]
order = 2
subject = "لغة الأختزال"
author = "مارك"
posted = "2006-07-10"
text = "المفروض ان احنا ندرس لغة الأختزال اللى بيتعامل بيهاالناس المسؤلين نظرا لوقتهم الثمين وساعتها حنلاقى ان الموضوع شيق وجميل على النحو التالى:<br />ط = طاب مساؤك يا أخى الكريم<br />ظ = ظريف منك ان تتحفنا بحديثك العظيم<br />فبها ايــــــــه بقى<br />ياريت تشـوف حيدفعولى كام على التحليل ده- بزمتك مش استحق<br />مارك"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010925/http://masr.20at.com:80/article.php?sid=617"

[[comments]]
order = 3
subject = "اسمع سيد حجاب"
author = "ابوبلطه"
posted = "2006-07-10"
text = "سلوا قلبى وقولوا لى جوابا * لماذا حالنا اضحى هبابا<br />لقد زاد الفساد وساد فينا * فلم ينفع بوليس او نيابه<br />وشاع الجهل حتى ان بعضا * من العلماء لم يفتح كتابا<br />وكنا خير خلق الله صرنا * فى ذيل القايمة وف غاية الخيابا<br />قفلنا الباب احبطنا الشبابا * فادمن او تطرف او تغابى<br />ارى احلامنا طارت سرابا * ارى جناتنا اضحت خرابا<br />وصرنا نعبد الدولار حتى * تقول له انت ماما وانت بابا<br />وملياراتنا هربت سويسرا * ونشحت م الخواجات الديابه<br />ونهدى مصر حبا بالاغانى * فتملؤنا اغانينا اغترابا<br />وسيما الهلس تشبعنا عذابا * وتشبعنا جرائدنا اكتئابا<br />زمان يطحن الناس الغلابة * ويحيا اللص محترما مهابا<br />فكن لصا اذن او عش حمارا * وكل مشا اذن او كل كبابا<br />ودس ع الناس اوتنداس حتى * تصير لنعل جزمتهم ترابا<br />امير الشعر عفوا واعتذارا * لشعرك فيه اجريت انقلابا<br />وما نيل المطالب بالطيابه * دى مش دنيا يا شوقى بيه دى غاب"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010925/http://masr.20at.com:80/article.php?sid=617"

