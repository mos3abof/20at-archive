subject = "طظ فيكم جميعاً وطظ في المعلم بتاعكم حسني مبارك .."
author = "http://ibnbahya.blogspot.com/"
posted = "2006-07-11"
text = "طبعا ده وضع طبيعي بين نواب حرامية جاء بهم حرامي مصر الكبير .. شيخ منسر الحزن الوثني مبارك الملعون .. طبعا ده هو الأسلوب المناسب لناس زي دي جات بالتزوير غصب عن الناس ورغم أنف الجميع .. أنا مش عارف الفقي ده بالذات شايف نفسه ازاي دلوقت ؟؟؟ يا ترى بتبص في المراية يا فقي ؟؟؟ يا ترى شايف نفسك نضيف ؟؟؟ ولا انته يا سي عبدالأحد والاثنين والأربع فاكر نفسك نائب وزعيم أغلبية كمان ؟؟؟ يالا ما هو عصر الطظ .. طظ فيكم جميعاً وطظ في المعلم بتاعكم حسني مبارك ..<br />http://ibnbahya.blogspot.com/"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010925/http://masr.20at.com:80/article.php?sid=617"
