[[comments]]
order = 0
subject = "الغربال لا يحجب الشمس"
author = "الداودي"
posted = "2006-05-29"
text = "لقد أصبح أمر امريكا مفضوحا لم يعد الشعب العربي المسلم مغفلا الى هده الدرجة الكل ينتظردمار امريكا ليس على يد أحد ولكن على يد قاداتها.لقد حفروا في كل مكان , وهاهم اليوم يقتربون من تلك الحفر فهنيئا للمسلمين على صبرهم الطيل حتى تنتحر أمريكا وقد كانت رقبة الظالمين بأيدينا طوال هده المدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152613/http://www.20at.com/article2.php?sid=867"

