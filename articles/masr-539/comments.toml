[[comments]]
order = 4
subject = "دنشواى ايه وخره ايه؟"
author = "واحد من البلد"
posted = "2006-11-08"
text = "أحه يا دنشواى احه<br />يا اللى الانجليز ناككوا فى طيازكوا<br />والله انتوا بلد متناكه<br />مش عارف ايه اللى خلى البلد المتناكه دى تنزل على النت<br />يا خى (قحه) بالصعيدى<br />أحوه باللاسكندرانى<br />احه بالبلدى"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117144219/http://masr.20at.com:80/article.php?sid=539&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

