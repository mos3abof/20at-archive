subject = "دنشواى رمز الوطنية"
author = "saadholy"
posted = "2006-06-28"
text = "أشكركم على هذا المجهود الرائع و الإنجاز الضخم فى عرض تاريخ من أنتنا يغفل عنه الجيل الجديد وتوقفت لحظة محاولا نسخ هذه الصور على جهازى ولم أفلح ولكن فى الحقيقة يجب أن نعطى الشباب فرصة للتعرف على تاريخ الوطن"
