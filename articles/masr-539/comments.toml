subject = "مصر حبيبتى"
author = "ايمان محمد"
posted = "2006-06-19"
text = "شكراا على هذة الصور الرائعة من داخل متحف دنشواى (خلتنى أحس انى زرت المتحف دة فعلا) و أتمنى عرض صور أخرى لباقى المناطق فى مصر الحبيبة."
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621212643/http://masr.20at.com:80/article.php?sid=539"

