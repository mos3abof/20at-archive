[[comments]]
order = 0
subject = "دنشواي ..... آآآه ه ه يا بلد المصريين بجد"
author = "محمد السيد"
posted = "2006-06-18"
text = "إيه الجماااااااااال ده ...<br />الصراحة من أحلي الصور اللي نزلتوها يا ولاد البلد ...<br />الصور بتتكلم بجد والله .... منظر الفلاحين ... الفلاحات .... المحكمة ...<br />متظر الحادثة كلها ممكن تتخيله زي ماهو من الصور بس ....<br />حتي التماثيل فيها ناقلة الحدث بجد .....<br />منظر الفلاحين وهم بيبكوا علي اللي مات .. والبيوت محروقة .... منظرهم وهم متجمعين في الحكم ... منطر الجنود وهم بيضربوهم ....<br />ياااااااااه ... الظلم وحش بشكل يا جماعة ...<br />طلم الزمان ده ... ما يفرق شئ عن ظلم اليومين دول<br />مش قلت لكم ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621212643/http://masr.20at.com:80/article.php?sid=539"

