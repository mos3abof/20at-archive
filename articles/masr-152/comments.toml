subject = "الازوزة في الكازوزة"
author = "سوسو"
posted = "2006-04-14"
text = "الازوزة في الكازوزة والعبارة في الدوبارة ونظيف في الوزارة وبابا في الرياسة وابن بابا في الوراثة وسوزان اخر شياكة والفلوس في البنوك والبزنس للتيوس والبوليس عندة اوامر اضرب الشعب المعارض اللي بيقول كفاية احنا وصلنا للنهاية مش بافول الازوزة في الكازوزة والعبارة في الدوبارة"
