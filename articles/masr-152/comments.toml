[[comments]]
order = 2
subject = "مبارك رئيس مصر المثقف"
author = "مصري مش عايش في مصر"
posted = "2006-04-15"
text = "انا بصراحة اتخنقت جداً من تصريحات مبارك ديه طيب لو كان زي ما هو بيقول ان الشيعة ولائهم لإيران علي الاقل ديه دولة مسلمة مش زيك يا مبارك انتمائك للصهاينة والامريكان انا نفسي اعرف هو مش مكسوف من نفسه وهو بيتكلم عن الولاء والانتماء حرام عليك يا اخي ضرب العراق كان بيحصل من القواعد الجوية المصرية ودعوتك لزيارة اليهود والمساعدات الامريكية اللي بتأكلوها وقناة السويس والضرائب ....الخ انت السجل بتاعك مشرف وفي الاخر بتكلم برده علي فكرة انا مسلم سني بس مخنوق منه اويييييييييييييييييييييي."
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911192118/http://masr.20at.com:80/article.php?sid=152&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

