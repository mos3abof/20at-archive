subject = "كس امك يا خول يا منيوك"
author = "اللي عاوز ينيكك"
posted = "2007-01-30"
text = "كس امك يالوطى يا خول يا منيوك يا شرموط<br />ياللي ابوك بيدخل فيه زبي<br />يا شرموط يا واطي<br />تفوه على طيزك الوسخة واطي شرموط قحبا حقيييييييييييييييييييييييييييييير<br />واطييييييييييييييييييييييييييييييي<br />منييييييييييييييييييييييييييييوك<br />مفتووووووووووووووووووووووووووووووح<br />خوووووووووووووووووووووووووووووووووووول<br />لووووووووووووووووووووطي<br />تعال مصه من فوق لتحت ياخول<br />والله حخلي امك تقعد تصمصص بيه يا شرموط<br />كس امك"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042609/http://masr.20at.com:80/article.php?sid=1453"

