[[comments]]
order = 1
subject = "واغوثاه من جهل يأس كل طبيب من علاجه"
author = "إنسان عادي"
posted = "2007-01-16"
text = "أشد بلاء نزل بهذة الأمة ذات المليار من الأنفس أن تجعل أملها كله بشخص واحد، وتشتط مجانبة لكل منطق ودين وعقل وعرف وتغدق على شخصه صفات أقلها مستحقة لأولي العزم من الرسل إن رضيت عنه ردحا أو ما يخجل إبليس ذاته إن بغضته..وبين الفريقين جمهور غفير يردد ما لا يعرف على الحقيقة والعيان ويوغل في الضلال.<br />لا أعرف عمر خالد لا شخصا ولا صورة وما سمعت له وعندي القرضاوي يرضي جوانب أبحث عنها للتفقه بأمور الدين..ولكني والله أستحي أن أعيب عمر خالد فيتعلق بعنقي أمام من لايغفل شاردة ولا واردة.<br />أقول هذا لأنه لن يدهشني لو صحت إتهامات كاتب المقال تماما، فكم خيبت الأيام على مدى العقود الخمس التي عشتها ظني بمن أحسنت الظن فيه وبمن أسأت على السواء، لا والله ما أكسبتني لا الأيام ولا الدرجات العلمية تجربة كافية ليصدق حدسي دوما.<br />ماذا لو كان الشيخ عمرا كما زعم؟ وماذا إن كان من الأبرار؟ السؤال المطروح ما رسالة الشيخ؟ وما ثمارها لو نفذت؟ وأهم من ذلك لو غاب شيخنا عمر عنا أو إحتجب أيظلم نهارنا ويفسد رشدنا و نضيع من بعده؟ مهلا يا قوم إن هو إلا رجل منكم..أوتي شيئا من العلم..لا العلم كله..وما أوتيتم من العلم إلا قليلا.<br />فلنتوسط ونحكم العقل قبل المدح أو القدح، والسلام عليكم."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042609/http://masr.20at.com:80/article.php?sid=1453"

