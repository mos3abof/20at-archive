subject = "ولاد ابادير"
author = "مهدي"
posted = "2007-01-21"
text = "هاهم اولاد ابادير العجوز النجس المتهتك الذي لايصمد في اي مقابله وينزل شتيمه في اي حد جدع يا عم المسيحي انتم ولاد كلب انتم لما زوجه قسيس اسلمت (وفاء) قلتم ان الضباط قالوا انهم ظبطوها انتم شويه انجاس ولاد كلب معندكوش كرامه"
archived = "2007-01-31"
