[[comments]]
order = 7
subject = "الأخ مهدي تحية طيبة"
author = "جمعة الدمرداش"
posted = "2007-01-21"
text = "الأخ مهدي تحية طيبة<br />إنت والنبي عايز تعمل زي الخنزير الرداح اللي قبلك؟ معلهش يعني ممكن توضح لي غرضك من لعن سنسفيل الأقباط هنا؟ أرجوك تفهمني ونوضح ليه؟ أنا أعرف إنه فيه قيادات قبطية كثيرة مرتبطة للنخاع بأجندات أجنبيبة أمريكية صهيونية..وإن في ظل خيابة النظام المصري وعمالته وتفاهته بتجد آذان أكثر من صاغية من قطاع واسع من إخوانا الأقباط..ده أمر يلام عليه بالدرجة الأولى نظامنا الخايب العميل اللي بيقتل في المواطنين روح الأمل والوطنية والإنتماء...وبيتيح لأعداء مصر الخارجين كل الوسائل للسيطرة عليها وجعلها ذيلهم للأبد-<br />وبالنسبة للحلوف المعلوف القذر ما مفيش أسهل من الخوض في سيرة أمك وحريمك..لكن وقتها أبقى من عينتك إياها..روح غضب الله ولعناته عليك."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042609/http://masr.20at.com:80/article.php?sid=1453"

[[comments]]
order = 8
subject = "الي الأخ جمعه"
author = "مهدي"
posted = "2007-01-21"
text = "انت بجد كتمتني بردك ده انا مش عارف اقول ايه بس للمره الألف هما بجد مخلوقات مستفزه والصبر اللي انت متمسك بيه صبر زياده عن اللزوم<br />ثانيا يا سيدي خش اي كليه هتلاقي جيتوهات قذره من المسيحيين يا سيدنا مفيش بلد في الدنيا يطلع مواطنيها يستنجدوا بالعدو الأول للبلد دي زي ما استنجدوا بشارون ولا امريكا والموضوع كان يعدي علي خير بذمتك يا مؤمن لو طلعت مظاهره تستنجد بأبن لادن في قلعه الليبراليه زي امريكا كان الموضوع ده هيعدي يا عم للمره الألف انت محترم بس هما بجد..وللمره الألف كون ان في امرأه مسلمه زي وفاء وبنتين الفيوم او الشهيد مصطفي مشعل اللي قتلوه لما دافع عن واحده ست هما استأسدوا عليها ولاد الزنا ولا قسيس دير المحرق تفتكر دول ناس دول خنازير انا اتفهم انهم يستأسدوا بأمريكا بس كون مظاهره تطارد واحده ست محجبه زي ماحصل في الأسكندريه لا مش موضوع ضغط سياسي وصدقني في وقت من الأوقات التعصب هوه عين العقل والطائفيه احيانا في التعامل مع الكلاب دول شئ منطقي"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042609/http://masr.20at.com:80/article.php?sid=1453"

[[comments]]
order = 9
subject = "مهدى وجمعة ؟"
author = "حلوة التمثيلية اللى عملتها..."
posted = "2007-01-22"
text = "وبعدين مسيحيين اية..واللة العظيم انا مسلم سنى<br />لية بشتمكم لانكم انتم والجماعة الارهابية بتاعكم عاوزين تخدعوا الناس البسطاء فى مصر وتفهموهم انكم ملايكة وان الحكومة المصرية شياطين والحقيقة انكم والحكومة شياطين بس هما شبعوا وانتوا لسة<br />واللعب بالدين حاجة خطيرة وبتستغلوا انا الشعب المصرى جاهل جدا فى الدين وعمالين تضحكوا عليهم زى موضة الاسدال ؟؟؟؟؟<br />من فين بتجبوا الاختراعات دى مش فاهم<br />مرة تانية لو اقدر اتحالف اللحظة دى مع الشرطة والمكم كلكم ياخوانجية على السجن كنت عملت والكلام دة بالمنسابة كمان لالاخوان المسيحيين المتعصبين<br />البلد دى حلها فى الشعب نفسة مش فى المجاميع الانتهازية دى<br />ودمتم"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042609/http://masr.20at.com:80/article.php?sid=1453"

