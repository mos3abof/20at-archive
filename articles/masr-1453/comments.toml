text = "كانت بتتناك فى المهندسين بخمسة جنية وانتا ابن حرام وابوك اللى هوا اصلا مش ابوك خول بيتناك من طيزة<br />عرفت الاخبار الجديدة دى<br />جمعة ابعد طيزك شوية امال عامل بس فيها اخوانى كس امك على كس ام الاخوان<br />كل خولات زيك بالظبط"
