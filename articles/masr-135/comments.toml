posted = "2006-06-10"
text = "لورئيسناالسيد محمد حسنى مبارك يعلم ان كلكم راع و كلكم مسؤول عن رعيته و علم ان وما خلقت الجن والانس الا ليعبدون لتغيرت نظرته للدنيا واستعد للقاء ربه لكل اجل كتاب فاذا جاء اجلهم لا يستاخرون ساعةولا يستقدمون اللهم اهده بجلال قدرتك وعظيم سلطانك اللهم احسن ختامناجميعا واهدنا لما تحبه وترضاه انك لا تهدى من احببت ولكن الله يهدى من يشاء اللهم اهده لما تحبه وترضاه"
