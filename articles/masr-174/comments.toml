[[comments]]
order = 138
subject = "احنا بنحب الجزمه"
author = "papakimos"
posted = "2006-06-02"
text = "بصراحه ومن الاخر احنا خدنا علي الجزمه اللي فوق راقبينا من سنين طويله من اول الاحتلال لغايه العصر الحجري لدرجه اننا لو فيش جزمع علي رقبتنا بنشتريها من وكاله البلح ونحطها فوق الرؤوس مش هاممنا غير اللبس والشعر والمكياج وسوسو وتوتو وشوشو ومادي وشادي وحادي بادي مفيش مره فكرنا لو اننا نتعلم من حد قريب او بعيد طول ما كل ما تحصلنا مشكله نغنيلها عمرنا ما هننفع كان شايل الوانو كان شايل كراسته - حتي بتوع البقر بيشتمو الرسول - دا حتي احمد ذكي غنينالو وتامر حسني عملنالو مظاهره وقلنل يحي العدل لما خد سنه مع ايقاف التنفيذ - عدل ايه يا شويه بشر.<br />في النهايه وباختصار لا يغير الله ما بقوم حتي يغيروا ما بانفسهم<br />اخوكم انا ومتنسوش العيش والحلاوه دا لوعرفتوني هكون فين"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005959/http://masr.20at.com:80/article.php?sid=0"

[[comments]]
order = 139
subject = "مبارك شعبي مصر"
author = "امير"
posted = "2006-06-03"
text = "علي فكرة انا ماقصدش حسني مبارك انا اقصد ان ربنا بارك الشعب ده من زمان<br />في الحقيقة انا دلوقتي خارج مصر وديه اول مرة ادخل الموقع ده وبصراحة عجباني الحماسة بتاعتكم<br />بلاش كلام سلبي وخلينا نبص للايجابيات يمكن تكون قليلة جدا لاكنه موجودة والدليل هو الموقع ده ويمكن يكون الموقع ده هو الشرارة اللي هاتولع نيران التغيير في مصر<br />عايز اقولكم انا كنت فعلا زعلان وانا خارج منها معرفش لية مع انه مالقيتش منها حاجة كويسة غير الوسايط و\"فوت علينا بكرة يا سيد\" لاكن الناس غلابة من كل اللي شافوة حتي اللي كان عايز يترشح انتوا قولوا اية اللي حصل لايمن نور ونعمان جمعه علي فكرة انا مش في اي حزب لاكن انا في حزب حب مصر اللي شفته موجود هنا في كل الناس اللي مش مصريين قبل المصريين والكل بيطلق عليها \"ام الدنيا\"<br />طولت عليكوا بس حاولوا تحموا الموقع ده علشان مايتقفلش أو تتحط علية لافته \"تحت التعديل للابد\" وان شاء الله نشوف مصر جديدة بجد لاني فعلا بجد وحشاني مصر وكل المصريين<br />عايز اقولكوا انه كل المصريين بيحبوها من غير مايعرفوا في البلد اللي انا فيها كل الجنسيات مش عايزه ترجع بلدها وزهقانين منها لاكن المصريين بس هما اللي بيحلموا امتي يرجعوها<br />سامحوني طولت عليكم<br />والله معكم"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005959/http://masr.20at.com:80/article.php?sid=0"

