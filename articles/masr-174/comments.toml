[[comments]]
order = 19
subject = "لابد للعقلاء من تدبر"
author = "مواطن مصرى"
posted = "2006-04-17"
text = "يا عقلاء الوطن مسيحين و مسلمين أنتبهوا سيناريو لبنان و من بعدها العراق قادم إليكم بخطى متسارعة أرجوكم أفيقوا و همسه فى أذن إخوانى فى الوطن الأقباط و هم أصل مصر إنتبهوا و أطردوا الشيطان القادم من خارج حدودنا بإسم أقباط المحجر و هم و الله لا ينتمون لأى ملة و دين و ينفخون فى النار لتحترقوا أنتم و هم هناك يتفرجون عليكم و هم جالسون على حجر أعداء مصر من الصهاينة و المتربصين أرجوكم لا تسمعوا إليهم فأنتم اللى إيديكوا فى النار و الذين سوف تحترقون فيها وحدكم إذا ما تأججت فلن ينفعوكم و لن تحرك أمريكا التى يستقون بها ساكنا فهم بالنسبة لها مرتزقة همهم الوحيد الأستفادة من الألامكم ليقبضوا دولارات العمالة فمصابكم هو مصاب المسلمين و الذى وصاهم رسولهم خيرا بأقباط مصر بالخصوص و من يتعدى عليكم فإنه لم يتبع قول رسوله و أخيرا أنا لا أدعى أنكم تعيشون فى الجنه الموعودة و لكن أن كان لكم مشكلة فلا تستقوا بأعداءنا و لكن دعونا نناقشها و لكن لا تتوقعوا أن تحل بسهولة فهى مشكلة من كم المشاكل المتلتله على رؤوس المصريين و لكن إصبروا كما يصبر المصريون جميعا مسلميهم و أقباطهم على الفقر و الفساد و البطالة و و و و ... و أخيرا أناديكم لا تشعروا بالقوة لأن ماما أمريكا ستحميكم فليست مصر هى السودان و ستكونون أنتم وحدكم أول من يدفع الضريبة من دمائكم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

