[[comments]]
order = 77
subject = "رحم الله عمر"
author = "احمد"
posted = "2006-05-05"
text = "احسب والله اعلم بان كاتب هذا المقال لم يرد السخرية من الناس ولا من احوالهم بل يريد ان يعكس حجم المعاناة التي يواجهها الناس صبح مساء بينما الراعي ومن حوله يدندن ليل نهار بعبارة ( من اجل محدودي الدخل ) الذين لا يصل اليهم اي شيء فكل شيئ تبتلعه بطون الكبار وان وصلهم شيء فالفتات الذي زهد فيه الكبار لامن اجل سواد عيون محدودي الدخل ولكن زرا لرماد في العيون وانك حين تطالع مثل هذه الصور تترجم على ايام عمر الذي ارقته احوال الرعية فلم يغمض له جفن ولم يهدأ له نوم ولم يكتف بتقارير حاشيته عن الرعية - الصادقة طبعا لانها من حاشية اختارها عمر على اساس مبدأ الكفأءة والتقوى لا كتلك التي اعرفها انا وانت الان - فقام يتفقد احوال رعيته ليلا وبينما هو كذلك مر بامرأة حولها اولاد يبكون وامهم جالسة امام قدر على النار فسألها- ولم تكن تعرف من هو - عن سبب بكائهم فاجبته بانهم يتألمون من شدة الجوع فسألها وماذا بالقدر ؟ فقلت : لاشيئ سوى الماء يغلي احتال به فيظنونه طعاما ينتظرون نضوجه ولايزالون كذلك حتى ينهكهم التعب فيناموا ثم اردفت جوابها قائلة : اين امير المؤمنين ؟ تولى امرنا ولم يرعنا عندئذ هرع امير المؤمنين الى بيت مال المسلمين فحمل زيتا ودقيقا على ظهره ثم جاءهم وأبى الا ان يعد لهم الطعام بنفسه فأطعمهم حتى شبعوا ففرحوا ومرحوا ثم غلبهم التعب فناموا فما كان من المرأة الا ان قالت له بعد ان رأت صنيعه لأنت اولى بالخلافة من عمر فقال لها : وهل تعرفين عمر فقالت : لا عندئذ كشف لها عن هويته . وهو القائل : لو ان بغلة ( !!! ) بالعراق تعثرت لسألت عنها :.< ًُُُلُُُم > بكسر اللالم وفتح الميم< لم> بفتح اللام وسكون الميم تمهد لها الطريق ياعمر . خليفة كان يخشى ان سأل عن حق حيوان في طريق ممهدة فما بالك بمن س<br />اقرأ بقية التعليق .."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113207/http://masr.20at.com:80/article.php?sid=228&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

