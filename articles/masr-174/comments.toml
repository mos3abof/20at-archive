[[comments]]
order = 122
subject = "انتم فعلاً ولاد البلد"
author = "أحمد عبد الله"
posted = "2006-05-25"
text = "بالرغم من إن عمري ضعف عمر أي حد فيكم بس انتم أكبر وعندي أسبابي منها مثلاً إني وكتير من جيلي كنا بنقول : خلينا ناكل عيش ياعم وبلاش وجع دماغ لأن البلد بايظة أوي والنتيجة طبعاً كانت المعاناة اللى انتم بتعيشوها دلوقتي ياشباب يارجالة قوي يا ولاد بلدي المحروسة لو مافيش جهاز يحلل كل كلمة وكل حرف كتبتوه يبقى على بلدنا السلام.نقطة أخيرة أحب أتكلم فيها نتيجة تكرارها في كتاباتكم بخصوص التمديد والتوريث (أنا لا مع ولا ضد) لكن هنقول كلنا لبعض سؤال واحد هو: أنا مستفيد إيه؟ يعني لو التوريث هيخلينا نتعلم مجاني ونستفيد من تعليمناونفيد بلدنا بيه... يبقى تمام ولو التوريث هيديني فرصة للعلاج الآدمي مجاناً أو بأسعار في المتناول.. يبقى أهلاً بيه ولو التوريث هيخلق فرص عمل لكم بعد التخرج مباشرة تمكنكم من تحقيق طموحاتكم (برغم ان احنا أيام السادات كان قدامنا فرص عمل حتى قبل ما نتخرج )يبقى لازم نؤيده ولما نلاقي وسيلة مواصلات آدمية تناسب الفقير قبل الغني يبقى ربنا يخليكو لناولما مصالحنا تمشي من غير رشوةوإكرامية وهشك بشك يبقى احنا معاه ولما نروح قسم الشرطة نرفع صوتنا وناخد حقنامن غير ما نكلم عمو أو خالو أو أبيه فلان يبقى يحيا التوريث لما نبطل نشرب بانجو عشان محتاجين كامل قوانا العقلية نبني بيها مستقبلنا اللى شايفينه قى ننزل كلنا نعمل له توكيلات في الشهر العقاري ولما نبطل نحل أزماتنا بالعصاية بدون تحليل لأسباب ودوافع (زى الفتنة الطائفية الخايبة و العبارة وإضطهاد بدو شمال سيناء اللي بينتقموا من الحكومة بأي وسيلة متاحة يبقى ألسطه التوريث ولما ولما ولما....لغاية لماالقيامة تقوم. كعلش وجعت دماغكم بس بجد عجبتوني."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005959/http://masr.20at.com:80/article.php?sid=0"

