text = "موضوع حلو طحن ... و خد منى النفس ده من أخوك و شده على سيدرك .... مره كنت واقف على محطه أتوبيس فى رمسيس و كان الجو حار طبعا و الدنيا زحمة و كانت فى واحده ست قاعدة و بترضع إبنها الصغير و طبعا غير مبالية باللى رايح و اللى جاى و المهم واضح إنها كانت منتظرة الاتوبيس بقالها يجى 8 ساعات و طبعا مقدرش أأكد للأنى كنت منتظر الأتوبيس بقالى 6 ساعات بس ... المهم مرة واحد هبت من قاعدتها وواضح إن الأتوبيس جه بتاعها لاقيتها زى الغزال شالت الواد على كتفها و رمت زكيبه كانت شيلاها على الكتف التانى و من هول الفرحة و عدم تصديقها إنها أخيرا هتروح بيتها طلعت تجرى ورا الأتوبيس و نسيت لا مؤاخذه تدخل \"فردة ثديها\" و عايزكم بقى تتخيلوا المنظر - أسف طبعا على الالفاظ اللى ممكن تكون غير لائقه لكن فعلا ده اللى حصل ... و هأنزل أعمل دماغ و أجيلك أحكيلك على اللى شفته"
