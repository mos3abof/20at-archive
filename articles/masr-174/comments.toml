subject = "اخدوا صاحبى منى"
author = "ياء"
posted = "2006-05-12"
text = "مكتوبالك يا محمد يا سيد<br />على فكره محمد اتاخد من قلب ميدان رمسيس اخدوه من جوه الجامع اه من جوه الجامع<br />محمد اخد 15 يوم حبس (يعنى الامتحانات راحت عليه )<br />منهم لله اخدو صاحبى منى<br />فى نشيد كنا بنسمعوا مع بعض كان بيقول<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com"
