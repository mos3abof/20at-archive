[[comments]]
order = 24
subject = "بلاش افتكاسات"
author = "طبعا اللي بتقولوه افتكاسات ..صلاة ايه يا اخواننا اللي هنحضرها معاهم .."
posted = "2006-04-18"
text = "انا مش فاهمة ايه سبب المشكلة ..مش الحكومة قال مجنون؟!يبقى مجنون<br />الناس حواليا في الشارع كلهم مسيحيين ..اغلب جيراني مسيحيين و كلهم ناس زي الفل ..الرخم منهم رخم زي اي مسلم بيضايقك ..يعني الواحد مش واخد باله من ان فلان مسلم او مسيحي<br />بالعكس انا ليا جيران مسيحيين بيعجبني فيهم التزامهم -اللي بيناسب دينهم- بناتهم عمرهم ما اتاخروا بره ..لبسهم محترم جدا..ناس في حالهم .زو المناسبات اول ناس يخدموا و يفرحوا لك و في الأزمات أول ناس يقفوا جنبك ..متعقدوش الأمور ..ليه عايزينا نمثل على بعض ...كفاية ابتسامتك لجارك او اتصال تليفوني تهنيه بمناسبة عنده او حتى تزوره لما يبقى تعبان ..أوتزوره يا اخي من غير سبب<br />بالكم..انا كنت امبارح راجعة من السفر ..في السوبر جيت ..جه حظي اني قعدت في كرسي جنب سيدة عجوزة مسيحية ..و بالصدفة ابنها كان معاها ..لما جيت اقوم له علشان يقعد مكاني جنب والدته الست رفضت بشدة و قالت هو ابني وانتي بنتي..بس ميصحش راجل يقعد جنبك وخصوصا اننا راجعين بالليل ..ولما اختكم نامت كالعادة صحيت لقيت نفسي نايمة على كتفها وهي كل شوية تعدل لي راسي اللي زي القلقاسة ..تخيلوا بقى لو كنت ركبت جنب راجل غريب!!<br />وانا ماشية وصتني ارجع البيت بسرعة علشان امي تتطمن عليا..<br />يا اخواننا الدنيا ابسط من كده بين المسلمين و المسيحيين"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

