[[comments]]
order = 103
subject = "شوفتوا تهمة ال 360 واحد"
author = "تهمتهم انهم اهانوا الرئيس و عطلوا المواصلات..."
posted = "2006-05-13"
text = "يا خى ....أو أو على رأى اتنين من اصحابى فى طرة دلوقتى و واحد تانى فى الاستقبال من يوم الخميس اللى فات .كلهم كانوا دايماً يقولا ياخى او او دى و كنت بقولهم عيب يا جماعة ...دى بتاعت الاسكندرنية بس ..و اى حد تانى فى مصر لو قالها تبقى عيب و انتم موش اسكندرانية ...بس انا دلوقتى بقولها اهوه ياخى او او...<br />على فكرة يا جماعة ...صدام بيتحاكم على احداث الدخيل و الباشا بتاعنا برضه ساجن 360 واحد فى نص ساعة لمجرد انهم هزقوه على حد وكيل النيابة ...و حرمهم من عائلاتهم..و حرم الطلبة منهم من امتحاناتهم ...يعنى الناس دول هضيع عليهم سنة من عمرهم علشان بس هزقووا امه...يا ابن...<br />انا معنديس حاجة اقوله للأسف لانى موش متعود اشتم...فا أرجوكم لو فى حد لسانه زفر شوية يظبطتلنا القعدة و يعيد تعليقى ده بأسلوبه بقى الفصيح .<br />ياااا أخىىى أو أو"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223546/http://masr.20at.com:80/article.php?sid=306&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 104
subject = "الطغاة الى زوال]"
author = "مصرية لن تفقد الامل"
posted = "2006-05-13"
text = "لو دامت لغيرك ما اتصلت اليك .. هؤلاء الاغبيه معتقدين انهم مخلدين فى الدنيا ولكن مكان خلودهم الوحيد فى مذبلة التاريخ وجهنم وبئس المصير فى الآخرة باذن الله الفساد الذى افشوه فى مصر سيدفعون ثمنه غاليا هذه الصور المحزنة والمخذية ستنقلب عليهم وعلى كل من سمحت له نفسه من ان يسير معهم فى ركب الفساد والمحزن ان نرى جنود مصر من الشرطة او الامن المركزى او اى جهه كانت هم المعتدون على ابناء وطنهم اين الضمير لدى قادة هؤلاء الجنود كيف تسمح لهم انفسهم باعطاء الأوامر لارتكاب هذه الافعال الوحشية ضد ابناء الوطن وهم حماته اين الرجولة والمرؤة فى هذه الصورة البشعة واين الديمقراطية الى يتغنى بها الزعيم الأوحد فى كل المناسبات وبرغم القبح والبشاعة لهذه الصوره الا ان الشىء الايجابى فيها انهم يحفرون قبورهم بايديهم ...هيا زيدوها عمقا حتى تتسع لكل هذه العصابة ولو ان حتى تراب مصر اشرف من ان تدفنوا فيه وقبل ذلك ياله من حساب لكم لكل ما ارتكبتم فى حق هذا الشعب ان كل من طالته هذه الايدى القذرة انما هو وسام شرف على جبينه لانه وقف فى وجه الطاغية وقال لا انهم يضعون المسامير الاخيره فى نعوشهم والنهايهة اقتربت والنصر دائما وابدا للشعوب"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223546/http://masr.20at.com:80/article.php?sid=306&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

