[[comments]]
order = 210
subject = "سلاح مصدي"
author = "سما مصر"
posted = "2006-07-30"
text = "يا سلاح مصــدي أمـتـي تعــــدي<br />فوق الحـــــدود وترد ارضـــــي<br />يا ســـلاح مصدي<br />م اللي اشتــــــراك بفلوس وطنــــا<br />و يارت رمـــاك لأ دا أنت ضـدي<br />يا سلاح مصدي<br />نفض غبــــارك بين نهــــارك<br />بــدد ظــــلام الليـــّل وعــدي<br />يا سلاح مصدي<br />بادفــــع ضـرايب واّكل عجـــايــب<br />علشــــان نجـيبــــك وأنت تصـدي!!<br />يا سلاح مصدي<br />أوعــاك تقـــولي مـــش لاقـــي راجــــل<br />لشهـــادته عاجـــل من أصل جــــدي<br />يا سلاح مصدي<br />يا ملـــــوك طـــوائف مـن أهـل طـائـف<br />باعــوا القضــــية وقت التحـــــــدي<br />يا سلاح مصدي<br />انســـــي الجيـــوش وانســـــي الكـــروش<br />فـــوق العــــروش تـت..اك وتـجــــري<br />يا سلاح مصدي<br />20/7/2006<br />القاهرة-مصر<br />منصور"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065020/http://masr.20at.com:80/article.php?sid=0"

