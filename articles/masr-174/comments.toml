text = "لما انتو بتقولوا انكو اولاد البلد يا الباقي من اولاد مين اعتقد انكو فيكو غرور وبعدين على اي اساس وضعت نفسك انك ابن البلد و متقول انت مين صراحة ولا انت خايف يبقى الجبن من شيم ولاد البلد ولا الشجاعة في الرأي مش طبعك انك تتكلم من ورا ستاره و تحدف اي حد بالطوب و تجري بغض النظر مين بتحدف عليه الطوب لازم تحافظ على رأيك و شجاعتك اذا كنت من ولاد البلد و متكنش جبان وعيل و تضرب و تجري يا ابن البلد"
