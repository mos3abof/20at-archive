text = "ايه القذارةاللي بقت في الحكومة ديه انا حاسس ان الناس اللي بتضرب دول يهود او كفار او قوات احتلال حرااااااااااااااااااااااااااااااام عليهم اللي بيعملوه في الشباب المصري ده يا جماعة ازاي ده بيحصل وقوات الامن ديه اهالينا يعني اخواتنا وقريبنا اكيد كل واحد فينا ليه اب او اخ اوقريب ظابط ولا عسكري حتي إزاي الكلام ده بيحصل حاجة تجنن الوضع في مصر سئ جداً واتمني من الله ان يتحسن"
