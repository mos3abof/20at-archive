posted = "2006-05-02"
text = "أولا احب اقول انى انسانة بتعشق البلد دى وبتعشق كل ذرة من ترابها<br />لكن ده مابقاش وقت كلام...<br />اذا كنتم فعلا عايزين تعملوا حاجة يبقى كفايانا كلام ويلا نبدأ من دلوقتى<br />المشكلة انى دايما نفسى اعمل حاجة اخدم بيها بلدى مع العلم انى لسه فى تانية ثانوى بس مش عارفة ايه اللى ممكن اعمله<br />او بمعنى ادق قدامى حاجات كتير اوى مش عارفة المفروض اعمل ايه ولا ايه..ّ!!!"
