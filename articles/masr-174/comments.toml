text = "لازم اقول اني بحبها علشان مش هقدر اقول غير كدة هو انا شوفت منها اية غير الاهانة والزل وقلة الاحترام وقلة القيمة والمعاملة الوسخة ومفيش كلمة اقل من كدة علشان اقولها شباب بايز وبنات فسدانة وامهات مطنشة واب مكبر دماغة والناس بتضحك علي بعضها كفاية علينا نشوف روبي وبعدين كفاية انها بتبسط الريس وبعد كده تقولي احبها طبعا بموت فيها"
