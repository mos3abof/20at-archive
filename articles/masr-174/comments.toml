[[comments]]
order = 215
subject = "البيان العاجل"
author = "حماده"
posted = "2006-07-30"
text = "اليكم هذا البيان العاجل<br />الداعية الإسلامى عمرو خالد فى بيان موجز له بموقعه على النت تحدث عن دورنا كأفراد شعوب مغلوب على أمرها إزاء تلك المجزرة ، ثم خاطب الجيوش العربية مندداً بسلبيتها إزاء ما يحدث لإخواننا ، ثم تكلم عن دور هيئات الإغاثة الدولية ، وكل أصحاب الضمائر ... فإلى البيان ...<br />1. إننا نؤمن أن الله سبحانه وتعالى هو المالك القادر المطلع ينصر المظلومين وينتقم من المعتدين ولذلك فإن أول ما نملكه الآن كشعوب عربية ومسلمة أن نبتهل إليه سبحانه أن يغيث المنكوبين، وأن ينتقم من المعتدين. وإننا نوقن أنه سبحانه يستجيب إذا رفعت الأمة بأكملها أيدي التضرع إلى الله، وتابت إليه توبة نصوحا، ولجأت إليه بصدق وإلحاح، فهو القادر أن ينتقم من المعتدين الظالمين، وينصر المستضعفبن. وإن واجبنا الأول الآن هو التضرع إلى الله بالدعاء وخاصة في وقت السحر. \"فدعا ربه أني مغلوب فانتصر، ففتحنا أبواب السماء بماء منهمر، وفجرنا الأرض عيونا فالتقى الماء على أمر قد قدر.\"<br />2. ونحن نرى الطائرات الإسرائيلية تدك قرى ومدن ومدارس ومستشفيات البلد المسالم لبنان، فتقتل نساء وأطفالا، وتستبيح آراض مسالمة، كنا ننتظر رؤية الجيوش العربية والطائرات العربية والصواريخ العربية تدفع الإعتدء الذي يقع على الأرض العربية. فإذا لم تتحرك هذه الجيوش والطائرات والصواريخ، فما هي الحكمة من وجودها إذن؟ ومتي ستتحرك إن لم يكن الآن؟ \"وما لكم لا تقاتلون في سبيل الله والمستضعفين من الرجال والنساء والولدان الذين يقولون ربنا أخرجنا من هذه القرية الظالم أهلها واجعل لنا من لدنك وليا واجعل لنا من لدنك نصيرا\".<br />3. إننا نؤكد جميعا مسلمين وغير مسلمين في كافة أنحاء الأرض أننا في انتظار قيام الهيئات الإغاثية المتخصصة بمد خطوطها فورا دون<br />اقرأ بقية التعليق .."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065020/http://masr.20at.com:80/article.php?sid=0"

[[comments]]
order = 216
subject = "عار يا حكام العرب"
author = "مواطن مصرى يحب البلد والوطن العربى"
posted = "2006-08-01"
text = "عـــار يــا حكام العـــرب !<br />كفاكم شجب و بكاء .... كفاكم خوف و غباء<br />تائهون ..متخبطون أم مفسدون و خائنون .<br />مقاومون أم خائفون .. ولا أصبحتم مستفيدون ..!<br />نسيتوا قصص البطولة و الكفاح .... و بدلتوها بالعولمة و سياسة الأنفتاح ..!<br />بوش و رايس ...أصحابكم و هنية و نصر الله ..... أرهابكم<br />عبيد أمريكا من غير كرامة و لا ديــن .. و أسرائيل شغالة بتعمل فيكم أســا فــيــن !<br />عايزنها بس بورصة ورقصة و هبشة ... و سديتوا و دانكم .. عن أى صرخة<br />عـار يا حكام العرب ...انتم اصبحتوا فعلا مصدر الجـــرب"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065020/http://masr.20at.com:80/article.php?sid=0"

[[comments]]
order = 217
subject = "نابليون قالها زمان"
author = "هشام"
posted = "2006-08-01"
text = "اهدى هذة القصه لحكامنا وحكام العرب علهم بفيقوا ويعلموا اين هم عند اسيادهم الاميركان والصهاينه بعد كل هذا الولاء الكامل : ف احدى غزوات نابليون كانت ف بريطانيا صعوبه ف غزوها فقام احدالضباط البريطانين بخيانه بلده وعمل على امداد نابليون بالمعلومات وعندما تحقق النصر بفضل هذا الضابط الخائن لبلده وقف نابليون يريد ان يكافئه فقال له ماذا تريد اطلب ماشئت مال سلطه ارض كل شيئ تحت امرك فقال الضابط انا فقط اريد ان اصافح نابليون انظروا وتأملواجيدآ ماذا قال له نايليون ( ان يد نابليون لاتصافح الا الشرفاء ) هل وصلت الرساله ايها العملاء الخائنين للوطانكم اتمنى ان تكون وصلت"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065020/http://masr.20at.com:80/article.php?sid=0"

