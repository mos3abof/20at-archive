[[comments]]
order = 41
subject = "العلمانية هي الحل"
author = "sherena_alex"
posted = "2006-04-24"
text = "العلمانية هي الحل وأقصد العلمانية أن تكون كل الأديان مسموح بها في الدولة ومافيش حاجة إسمها الدين الرسمي للدولة تصبح الدولة كأنها عالم به كل الطوائف وكل الأجناس وكل الملل والمذاهب وهذا هو الواقع بطبيعة الحال لكن غير معترف بحقوق سوى المسلمين في هذا البلد اللعين لذلك فالعلمانية هي الحل للإنسان المصري سواء كان مسيحي أو مسلم أو يهودي أو بوذي أو حتى ملحد وغير مؤمن بالله.وتكون الحرية والعلمانية هي دين الوطن ودين كل إنسان بينه وبين ربه له حرية الإعتقاد ولا أحد يحاسبه عليه سوى الله وللعلم حتى لا يثير الجهلة الكلام الغبي العلمانية لا توجد لها مصدر في المسيحية ولا في الإنجيل لأن الإنجيل دين الآخرة والزهد في الدنيا وليس مصدرها الإسلام وإن كان الإسلام يهتم بالجسد في الدنيا وحتى في شكل جنته الجنسية لأن العلمانية مصدرها الإنسانية البحتة أيها الجهلاء"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005959/http://masr.20at.com:80/article.php?sid=0"

