subject = "أنا بحب مصر"
author = "ميدو"
posted = "2006-05-23"
text = "أولا انا بجد بجد انا بحب مصر جدا مش لأنها ام الدنيا ولا لأنها راعية الغلابة أو راعيه الفرق الهابطة ولا عشان خاطر هيا بتدلع شبابها بالشقق المدعمة ام 30 الف جنية مقدم ولا عشان خاطر الرغيف أبو شلن اللى الواحد ممكن يقف بالاسبوع على الحديد عشان يشتريه وبرغم انه بيوصل لغايه الشباك ويلاقى الفرن شطبت عادى مش مشكلة المهم انها ادتنا الفرصة وحاولنا ولا عشان خاطر المواصلات اللى الواحد ممكن ينتظر بالساعة على المحطة عشان خاطر الاتوبيس ابو ربع جنيه لألألألألألأ<br />ياجماعة الموضوع فى أنى بحبها هو ان مصر اتفرضت علينا فلازم نحبها احسن نتعب جدا لأنى والله أنا تعبت من اللف على السفارات<br />محمد 0122628610"
