subject = "يلا بينا"
author = "رنا"
posted = "2006-06-19"
text = "لفت انتباهى الموقع لان اسمة مصرى قوى. كان زمان الواحد بيتكسف يقول انة من مصر بس بعد ما قرات تاريخناو خاصة مذكرات انور السادات \"البحث عن الذات\" و تاريخ غيرنا لقيت ان ناس كتير قوى ضحوا بحياتهم علشان نعيش احرار بكرامة. مصر فيها خير كتير علشان كدة طول عمرها مطمع لغيرها. صحيح فى حاجات مش عجبانى بس مفيش حد مرتاح فى بلدة. مصر فيها شباب كويس و ان شاء اللة بيكم و بيهم حنقدر نعمل حاجات كتير بس لازم نخلص من عقدة الخواجة."
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144102/http://masr.20at.com:80/article.php?sid=0"

