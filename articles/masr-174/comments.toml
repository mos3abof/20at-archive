[[comments]]
order = 66
subject = "أقباط المهجر"
author = "محمد"
posted = "2006-04-29"
text = "يا اخواننا المشكلة إن الناس من الجانبين أتغيروا كتير عن زمان. أنا شخصياكنت في صغري في مدارس راهبات و طول عمري ليا أصحاب و جيران و زمايل مسيحيين و عمرنا ما كنا بنكره بعض. المشكلة أننا حبايب على المستوى الفردي و لكن على المستوى الجمعي بنكره بعض كره العمى. و ده شيء لازم نشوف له حل. ماننكرش إننا كمسلمين بنسمع كلام غاية في السلبية عن المسيحيين (و ليس عن الأقباط لأننا كلنا أقباط بمعنى مصريين) و لا أشك لحظة أن المسيحيين بيتكلموا عنا سلبياً و إلا نفسر إزاي حالة الغل الشديدة و الإحساس غير الطبيعى بالظلم اللى بيولد إنفجارات عندهم على الفاضى و المليان.<br />أما عن أقباط المحجر فحدث عنهم و لا حرج. أنا يا إخواننا عايش في أمريكا من فترة و حاتنقط من الكذب و الصيد في المياه العكرة اللى الجماعة دول بيقوموا بيه هنا في أمريكا و خصوصاً في القنوات الصهيونيه. شيء مقزز.<br />من سنه لقوا أسرة مصرية مسيحية مقتولين في بيتهم. بعدها الجماعة دول فضلوا يولولوا في وسائل الإعلام (قبل حتى التحقيقات ما تتفتح) و فضلوا يشنعوا عن الإسلام و إزاي إنهم هربوا من الإضطهاد في مصر و الإضطهاد جاء وراهم لأمريكا. حتى لما المسلمين راحوا يعزوهم طردوهم شر طردة و اتخانقوا معاهم. و لما التحقيق أثبت إن القاتل إتنين أمريكان بدافع السرقة ما سمعناش منهم كلمة إعتذار واحدة.<br />لكن الحق يقال، في مسيحيين في منتهى الاحترام وولاد ناس جداً. و بالمناسبة معظم المحترمين متهم ما عاشوش في مصر كتير.<br />المهم، لازم حوار بين المحترمين من الطرفين."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

