[[comments]]
order = 79
subject = "انتبهواايهاالمصريين"
author = "مصرية"
posted = "2006-05-06"
text = "فى الواقع الموضوع اكبر من الهلال والصليب الموضوع هووضع بذور فتنة طائفية قى مصر انها احدى الحلقات فى سلسلة المخطط الصهيونى المدروس لغزو الوطن العربى عن طريق اضعافه وتفتيت نسيج كل دوله فيه على حده كما يحدث الآن فى العراق عدد من سقطوا نتيجة هذا الصراع اكثر ممن سقطوا نتيجة الاحتلال الذى يقوم بدور المتفرج على تحقيق اهدافه دون بذل اى مجهود وما يحدث بين الفصائل الفلسطينية الآن جزء آخر من هذا المخطط ومن قبلها سوريا ولبنان والسودان والبقية تاتى فلايجب ان نسمح نحن المصريين بتحقيقهم لهذا الهدف لأن مصر هى الحلم الأول هى ارض الميعاد ولنجعلها ارض الميعاد لهلاكهم وهلاك احلامهم بتماسكنا تعاشنامعا نسيج واحد بحب وود كما كنا دائما فهذه النغمة النشاذ دخيلة علينا من قوى الشر الخارجية وساعدتها قوى داخليه تريد الهاء الشعب بقضايا اخرى غيرالقضايا المصيرية التى تمس مستقبل وحياةالمصريين"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

[[comments]]
