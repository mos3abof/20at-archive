[[comments]]
order = 98
subject = "تفاصيل الخبر"
author = "ياء"
posted = "2006-05-12"
text = "قررت نيابة أمن الدولة العليا في وقت مبكر من صباح اليوم حبس ستة وستين من إخوان الإسكندرية خمسة عشر يوماً بتهمة التظاهر والشغب وذلك علي خلفية التضامن مع القضاة المحالين للتأديب أمس .<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com<br />كانت قوات الأمن قد ألقت القبض علي المئات من الإخوان المسلمين الذين توافدوا من كل محافظات مصر لمساندة القضاة والتضامن معهم كما قامت بسد جميع المنافذ المؤدية إلي دار القضاء العالي ونقابة الصحفيين المصرية لمنهم من التفاعل في هذه المذبحة"
archived = "2006-09-05"
