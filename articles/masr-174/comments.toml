text = "بسم الله الرحمن الرحيم<br />انا مش هتفلسف ولااقول مصر ..مصر عشت مصر حرة مستقرة<br />لما الاجانب جم يحتلونا كانو ارحم علينا منهم عارفين لية<br />لانهم كانو بيتحكمو فى شئ واحد وهو الفلوس او مصلح اقتصادية زى القناة وغيرها<br />لكن لاسف الا محتلنا دلوقت بينهب ويسرق ويبيع ويقتل ويحكمك فكريا وعايزك طول عمرك ولاتعرف تبص وراك ولا اقدامك كل الحكاية باختصار دى بلدنا لو غرقت هتغرق بينا والمستقبل مش بتاعنا بتاع اجيال الله اعلم بيها فااحنا بنشوف وهنشوف العذاب حرام غيرنا يشوفة"
