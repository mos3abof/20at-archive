[[comments]]
order = 157
subject = "انا بحب مصر"
author = "احمد محمد وجيه محمد"
posted = "2006-06-14"
text = "كلنا بنحب مصر بس كل الناس بتكره بعضها فى فرق لما نتكلم عن ارض مصر وفرق لما نتكلم عن الناس الى فى ارض مصر الناس بقت مش بتحب بعضها ومش كلهم ناس وناس طبعا بس الفكره ازاى الناس تتغير من ناحيه بعض ودى مستحيل ارض مصر على مر العصور ارض الخير كلو ومص ام الدنيا زى ما بنقول بس احنا الى خلينا مصر وحشه عارفين ليه على شان احنا مش بنحب بعض وكل واحد بيفكر فى نفسه وبس حد فكر فى يوم فى حد غير نفسه اكيد طبعا لا عارف الى بيسرق وينزل مواد فسده ويئكل الناس مواد ضاره مفكرش فى يوم انو سايب وراه جيل ولادو ممكن بكره يكلو من الاكل ده صح عارف انا متخرج السنادى مثال لشاب كان نفسه يكافح ويبداء حياته زى كل الشباب الى على القهاوى الى فى يوم كان امل بكره فى حماسه النهرده انا بقيت واحد من الشباب دى وعارف بعد التعليم والدراسه دى كلها والمصريف بتاعت الدراسه اتسويت بمين اتسويت بالبلطجى عارف ليه على شان انا بعد معاه على القهوه منين احنا بنقول بنعلم الشباب ومنين الشباب مش لاقى شغل الشغل النهرده بقى بالوسطه والكوسه احنا بنبنى ونهدم مره وحده وبهدم شباب المستقبل وبنقول بكره وبكره هيكون اوحش طول مالدنيا كده ومصر حكمها وسياستها على كده وفيه كلام كتير عاوز اقوله بس كده كفايه انا طولت الكلام اوى شكرا على الموقع ده"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005959/http://masr.20at.com:80/article.php?sid=0"

