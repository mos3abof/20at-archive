author = "ابو اسامة"
posted = "2006-07-13"
text = "مع احترامى لكل الأخوة الى علقوا على الموضوع لكن يجب ان يعرفوا انه لايوجد اى تعارض بين حديث صحيح ونص قرأنى اى عندما يقول السول عليه الصلاة والسلام(من أذى<br />زميا فانا خصيمه الى يوم القيامة)<br />فهذا يدل على ان الله سبحانه عندما يذكر<br />النصارى او اليهود فى اياته فهو ادرى بهم<br />وهو الذى يحاسبهم وليس لنا ان نحاسب احدا<br />فالله سبحانه هو الموكل بحساب الخلائق فلا<br />تنصبوا انفسكم الهة وتفتون بغير علم<br />وليس منا احديستطيع يدعى انه سيدخل الجنة<br />او يدعى على احد انه سيدخل النار فاتقوا<br />الله فيما تقولون واعلمواا انما نبيكم قد جأ رحمة للعالمين فانشروا دينكم بالتسامح والرحمة وامشوا على خطى نبيكم تهتدوا<br />فقد كان يزور جاره اليهودى والذى كان يؤذيه وقد كان ذلك سببا فى اسلامه فهذا<br />ما يريده منكم نبيكم ايها الشباب فهل<br />نبيكم لم يكن يعلم بهذه الأيات<br />انصحكم باتباع سنة نبيكم وعدم الأنجرار ورأ هذا التعصب الأعمى الذى يريده لنا اعدأهذه الأمة لكى تسود الفتنة ."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

