[[comments]]
order = 68
subject = "واعمراه"
author = "قدورة"
posted = "2006-04-30"
text = "ياصاحبي الباحث عن الجنة وليس الديموقراطية بلغنا الله وإياك ما نصبو اليه . ولكن هل تعتقد ياصديق أن الفاروق لم يكن يبحث عن الجنة حين أعطى العهد العمري لنصارى القدس؟ وماذا تقول في وصايا الرسول بتأمين أهل الكتاب ، وعدم الاعتداء عليهم.<br />يا إخوتي لنفهم صحيح الدين ، ولنتذكر أن أفضل الخلق أجمعين صلوات الله عليه لم يأمر بقتل آمي الكنائس ولا هدمها. إنهم إخوتنا في الوطن ، لهم دينهم ولنا ديننا<br />وتذكروا دوما أنه على مدار القرون الأربعة عشر ومصر كلها نسيج واحد بمسلميها ومسيحييها، وانتبهوا - مسلمين ومسيحيين - حتى لا نكون دمية تحركها أصابع الصهاينة ، ولك الله يا مصر."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

[[comments]]
order = 69
subject = "اصحوا ...فوقوا"
author = "مخلص مصرى"
posted = "2006-05-01"
text = "الموضوع مش سهل ابدا ياجماعة<br />الموضوع فية يد خفية خارج مصر<br />وطبعا كلنا عارفينها<br />هدفهم هو 1ـ تفتيت الوحدة الوطنية وقيام فتنة طائفية وحرب اهلية .<br />2ـ سلب امان مصر بالتفجيرات اللى حصلت اليومين اللى فاتوا دول<br />الموضوع مش سهل ابدا ابدا ابدا<br />فكروا كويس شوفوا التوقيت اللى جاء فية تفجيرات دهب .....فى الليلة اللى قبل عيدتحرير سيناء<br />هل اللى حصل صدفة ؟ ولوكان صدفة السنة دى ..... هل كان صدفى السنة اللى فاتت ؟؟؟؟"
archived = "2006-09-03"
