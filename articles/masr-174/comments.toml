[[comments]]
order = 13
subject = "ياريت تقدرو تنشروها"
author = "محمد ابراهيم ممتاز"
posted = "2006-04-10"
text = "تبدا القصة بمباراة للكرة الخماسية فى دورة رمضانية لكرة القدم تقوم بتنظيمها شركة كوكاكولا وفى المبارة قبل النهائية يلعب فريق اعجوبة مصر جمال مبارك وشقيقة ولكن الفريق المنافس يبدو انة كان من غير سكان الارض فلم يفهمو انة يلاعبو اعجوبة العصر الذى رغم معرفة الجميع بمدى ولكن فلنعد لحكايتنا فالحديث عن اعجوبةالعصر يمتد لزمن طويل اعجوبة با اما من جهلو مقامة وتلاعبو بة هو واخية بالرغم من محاولات منكان يدعا بقاضى الملاعب (مثل قضائنا العزيز) الذى اضاف عشرة دقائق للشوط الاول وخمسة عشر للشوط الثانى فكان من الازم تدخل البطش الحقيقى فى هيئة رجل يرتدى الملابس المدنية ويحمل اجهزة الاسلكى علامتهم المميزة ويتحدث لمدير هاؤلاء الجهلة بقدر الاعجوبة ويرتعد المدير عند علمة بما قد يحدث لة اذا فاز على الاعجوبة حتى لو كان ذلك فى مباراة ترفيهية فيقوم بسحب افضل لاعبية وانزال شخص يقدر من يواجة فيقوم بتسجيل هدف ولكن فى مرمى فريقة ويتسبب فى ضربة جزاء على نفسة لتنتهى اطول مباراة فى الكرة الخماسية بفوز الاعجوبةويشهد على هذه الواقعة الكابتن ربيع ياسين والكابتن محمد رمضان الذى اراد ان يبداء فى الذهاب للاحماء قبل نهاية المباراة بخمس دقائق من الوقت الطبيعى للمباراة ولكن الكابتن ربيع ياسين ابن محافظة بنى سويف الذى يعرف قدر الاعاجيب يخبرة بالانتظار فمازال الاعجوبة متاخرا بهدف<br />تعود هذة القصة الى رمضان عام 1998<br />مع خالص تحياتى وتمنياتى بالنشر<br />محمد ابراهيم ممتاز<br />وبعد ماقرئاتم هذة الوقائع هل يمكن ان تخبرونى كيف يمكن منع كارثة توريث الحكم"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005959/http://masr.20at.com:80/article.php?sid=0"

