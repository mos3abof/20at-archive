[[comments]]
order = 53
subject = "مراجعات"
author = "حسام الزعبلاوي"
posted = "2006-04-26"
text = "اولا نحن نستنكر ما حدث وسوف يحدث ما دام ليس هناك حل حقيقي لهذة المشكلةولكن من يتحمل الاستفزاز المقابل من الاقباط وارويها لكم<br />1- في احداث وفاء قسطنطين ماذا كان هتاف الاقباط( يا امريكا فينك فينك امن الدولة بينا وبينك)<br />2-اثناء الاحتفال يقداس عيد القيامة منذ يومين وفي حضور شخصيات مصرية رسمية والسفير الامريكي ألم تلاحظوا ان مستوي التصفيق للسفير الامريكي فاق كل التوقعات عندما اتي ذكر اسماء الشخصيات التي حضرت القداس فما معني هذا؟<br />3-تحدي البابا شنودة علانية الدولة والقضاء في حكم محكمة القضاء الاداري الاخير وقال مانصة ليس هناك قوة علي وجة الارض تجبرني علي تنفيذ الحكم فانا الذي امثل الاقباط وهذا يدل علي الدور السياسي للكنيسة كممثل للاقباط<br />4- مناداة الاقباط بعلمانية الدولة وفصل الدين عن السياسةوالغاء البند رقم 2 من الدستور المصري الخاص بالشريعة الاسلاميةفي تحد صارخ للغالبية من المصريين ولكن عند اصدار محكمة القضاء الاداري لحكمها الاخيريتم تحدية لانة يخالف معتقداتهم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

