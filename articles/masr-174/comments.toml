posted = "2006-05-28"
text = "انا اول مرة ادخل الموقع ده وبالصدفة البحتة , لاني بصراحة ما بدخل اي موقع على النت .... لكن بجد واضح انو محترم جداااااااااا<br />عشان كده نفسي اكون صديقة دائمة للموقع<br />وانشاءالله حكون مواظبة دايما اني اقرأ كل اللي بتكتبو ...بالزات المواضيع اللي بتخص البنت المسلمة زي\"الحجاب\" او حتى موضوع الاديان كلهاو الاختلاف او المشترك بينها لاني بحب اقرأ بهاي المواضيع<br />\"بحبكوووووووو\"<br />اختكم منار<br />سلام مؤقت"
