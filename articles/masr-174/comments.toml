posted = "2006-07-28"
text = "قريت تعليقات كتير من اللى كتبها زوار الموقع وكلام ولاد البلد المؤسسين للموقع اولا زكرتم انكم بسطاء يعنى زى اغلبيه الشعب المصرى بالرغم من اسامى الاماكن اللى تخض واللى ما اتاحليش الحظ انى اسمع عنها اوحتى اشوفها من بعيد يعنى بصراحه انتم مش زى اغلبيه الشعب المصرى المطحون زى ما قال منير المهم بصرف النظر عنكم ولاد البلد بجد بياكلو فول وطعميه وبيروحو عند زيزو النتن المهم برده مصر بخيرها وعندى امل فى ربنا تتغير الاوضاع ونعيش بجد زى ما بنحلم وعمار يا مصر"
