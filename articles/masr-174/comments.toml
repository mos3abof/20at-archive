author = "منار"
posted = "2006-05-30"
text = "السلام عليكم:<br />عفكرة قرأت التعليقات اللي كانت قبلي بخصوص اخوة مصريين بيحكو عن مشاكل اللي بتمر فيها مصر , والوضع الصعب اللي بجد عايشاه , واللي شوفت بعض أشكالو لما كنت فيها....<br />بس صدقوني كل واحد منكم كمصري... لازم يكون فخور جدا أن ليه وطن وعايش فيه و بيدو هويتو مهما كانت الظروف اللي بيمر فيها صعبة .... مسيروالحق هو اللي يظهر .. وانا شايفة ان الموقع ده هو البداية .. مع كل الشباب الواعي والمثقف اللي مشارك فيه كل ده بيدل ان حبيبتنا مصر لسه بخير .."
