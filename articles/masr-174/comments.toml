[[comments]]
order = 48
subject = "يا عم انت وهوه أصحوووووا ...... فوئوا ....!!!!"
author = "MORSHDY مستشار منتدى المحترفين الفضائى"
posted = "2006-04-25"
text = "يا جماعه .... انا من المنوفيه ... شبين الكوم ... قرية ميت خاقان<br />والقريه دى نصفها مسيحيين<br />وكان زمان فى خلافات وضرب ناار بين المسلمين والمسيحيين لدرجة ان اسم القريه زمااان كان اسمها ((الملّتيــن))<br />المهم ... احنا دلواتى كمسلمين فى ميت خاقان<br />مافيش اى خلافات ابدااااااااا<br />لكن فى نقطه عاوز اوصلهالكم<br />هى ان مهما حصل ومهما يجرى<br />لن يطمئن لك أى مسيحى<br />فكيف ستطلب دخولك للكنيسه؟<br />أنا أراهنكم جميعا<br />ان من يدخل منكم الكنيسه وبالذات اللى فى الاسكندريه<br />على الفور سيتم اعتقال اى شخص يدخل او حتى يطلب الدخول<br />وانا عندى حل كويس<br />انه يتم التحدث مع شيييخ<br />ويأتى معكم للكنيسه<br />ويكون فى شلة كبيره مسلمين<br />ونعرض عليهم الحب المتداول لدينا<br />ونطلب الدخول معهم للكنيسه<br />وبكده ميخافوش ولا يقولوا اننا عاوزين نهاجمهم<br />لاننا شلة ... مش فرد طالب يدخل<br />وكمان معانا شيخ او شيوخ<br />اى خدمه؟<br />سلامات يا جدعان<br />MORSHDY<br />pc_haking@msn.com<br />www.mohtarefen.com/vb"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

