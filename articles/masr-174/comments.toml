[[comments]]
order = 225
subject = "قصيدة للشاعر العراقي:- أحمد مطر :- هديه لكم من بغداد"
author = "السومري /بغداد"
posted = "2006-08-04"
text = "لافتة لأحمد مطر: أي قيمة<br />أحمد مطر<br />02-08-2006<br />أي قيمة لجيوش يستحي من وجهها وجه الشتيمة. غاية الشيمة فيها أنها من غير شيمة<br />أي قيمة<br />للشعوب المستقيمة<br />وسجاياها الكريمة<br />في بلاد هلكت<br />من طول ما دارت على آبارها<br />مثل البهيمة<br />واستقلت<br />وأساطيل العدى فيها مقيمة؟!<br />أي قيمة<br />للقوانين العظيمة<br />وهي قفاز حريري<br />لذي الكف الأثيمة وأداة للجريمة<br />أي قيمة<br />لجيوش يستحي من وجهها<br />وجه الشتيمة<br />غاية الشيمة فيها<br />أنها من غير شيمة<br />هزمتنا في الشوارع<br />هزمتنا في المصانع<br />هزمتنا في المزارع<br />هزمتنا في الجوامع<br />ولدى زحف العدو انهزمت..<br />قبل الهزيمة؟!<br />أي قيمة<br />لرؤى التجديد<br />والأوطان في قبضة (أولاد القديمة)؟!<br />أي قيمة<br />لأولي الأمر<br />طوال العمر<br />والأوطان لولا أنهم عاشوا،<br />لما صارت يتيمة؟!<br />أي قيمة؟!<br />باطل هذا التساؤل<br />وطويل دون طائل<br />لم تعد في هذه الامة<br />للقيمة قيمة!<br />بلغ الرخص بنا<br />أن نمنح الأعداء تعويضاً<br />إذا ما أخذوا أوطاننا منا.. غنيمة!"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065020/http://masr.20at.com:80/article.php?sid=0"

