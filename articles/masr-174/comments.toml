text = "وشوش النالس حكتيات فيها الفرح و فيها اهات<br />فيها اللى ما بيتسى و فيها اللى عدى و مر و فات<br />الموضوع تحفه يا ايهاب<br />حلو صحيح بس قديم بالنسبه لى<br />انا من هواه الموضوع دا بس فى محطات السكه الحديد<br />ف فتره من حياتى كنت متعوده اسافر بالقطار<br />و الله على الفرجه على الناس ف المنحطات<br />القطار الواحد بس يا جماعه بيضم ال3 طبقات بتوع المجتمع(دا على اعتبار ان الطبقه المتوسطه لسه موجوده و ما انقرضتش)<br />جربو ف المحطات و هتدعولى"
