[[comments]]
order = 92
subject = "آه يا بلد .......لا مش بس آه دي آآآآآآآآآآآآآآآآآآآه"
author = "اخت حد انتوا تعرفوه كويس"
posted = "2006-05-12"
text = "طبعا بتسالوا دي اخت مين اخت مين؟؟؟؟؟؟؟؟<br />انا اخت حد قارفكم تعليقات بس المفروض تكونوا لاحظته غيابه المرة دي عن التعليقات خاصه انه كان مزهقوا دعوات لحضور الاعتصام<br />ايوة هو ...صح اللي انت بتقوله يا اللي بتقرا..... ده حتي الاخ اللي اسمه مش شغلك فوق لسه جايب سيرته<br />اخويا هو اللي كان شكله هيغير تعليقه بس ماغيرهوش ....اخويا هو محمد السيد \"لا للتمديد لا للتوريث\"<br />انا عارفه انه واحشكم بس والله ما منعهوش عنكم غير الشديد القوي اللي هو الامن او بمعني تاني معتقلات الامن<br />ايوة اخويا مشرف عند حبايبنا هناك ....اتاخد مع اللي اتاخدوا<br />متقلقوش عليه بكرة يرجع ويحكيلكوا علي كل حاجه حصلتله... بس بالله عليكم متنسهوش في الدعاء<br />اه كنت هانسي اللي يقدر يروح يوديله عيش وحلاوة يروح ..اصل اخويا اصلا بيحب الحلاوة"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223546/http://masr.20at.com:80/article.php?sid=306&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 93
subject = "آه يا بلد .......لا مش بس آه دي آآآآآآآآآآآآآآآآآآآه"
author = "برضه اخت الشخص اللي انتوا تعرفوا كويس"
posted = "2006-05-12"
text = "رساله نفسي توصل لكل فرد فيك يا وطن من اصغر فرد لاكبر فرد...........نفسي اقول انهم مهما عملوا فينا......ومهما كانت الضريبه اللي هندفعها من وقتنا او جهدنا او حتي- احيانا كتير اليومين دول - من دمنا.. مش هنسيب الياس يتسرب لنا ..مش هنيأس يا بلدي ..مش هنلومك ...مش هنكرهك.........لو ده تمن حبك يا بلدي هقدمه عن طيب خاطر ..ولو هيه دي الضريبه هادفعها وكلي رضا .....<br />لما سمعت اللي حصل وشفته وبعدين لما عرفت اللي حصل لمحمد اخويا<br />لقيت نفسي بافتكر حاجه واحده لافتات احمد مطر اقروها ويا رب تعجبكم<br />الحاح<br />-ما تهمتي؟<br />- تهمتك العروبة<br />- قلت لكم ما تهمتي؟<br />-قلنا لك العروبة<br />-يا ناس قولوا غيرها أسألكم عن تهمتي .ليس عن العقوبة<br />صباح هذا اليوم<br />أيقظنى منبه الساعه<br />وقال لى : يا ابن العرب<br />قد حان وقت النوم<br />مسألة مبدأ ..!<br />قال لزوجه: اسكتي .<br />و قال لابنه: انكتم.<br />صوتكما يجعلني مشوش التفكير.<br />لا تنبسا بكلمةٍ أريد أن أكتب عن<br />حرية التعبير !"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223546/http://masr.20at.com:80/article.php?sid=306&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

