posted = "2006-07-18"
text = "اريد ان أسال اذا كنتم دعاة للحرية كما تقولون وتحبون مصر بحق هل يمكن لكم ان تقولون لنا عن برنامج او هدف موقعكم وهل له هدف بحق ام ان المقصود منه اتاحة الفرصة للسب واللعن ونشر الاراء الغريبة .. ولو ديمقراطية موقعكم بجد ومش من نوع ديمقراطية الوصول للهدف ممكن اعرف وبكل صراحة كم يكلفكم هذا الموقع ومن اين توفرون مصادر تمويله .. بجد انا لا اقصد اي شيئ بس حابب اعرف لو امكن"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010639/http://masr.20at.com:80/article.php?sid=0"

