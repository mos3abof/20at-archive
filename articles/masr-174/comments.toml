subject = "we need to think first"
author = "Abdou Ali"
posted = "2006-04-25"
text = "dear all;<br />it seams that we still can't get into the point of absorbing the other, meaning that if i disagree with you, automatically i'm your enemy, but hey why don't we just listen to each other and if i don't like your idea discuss it with you and try to convince you with mine, and if you still not convinced, you still have your own opinion and i have mine, no hate or hard feelings. i think if we understood this concept of disagreeing, we'll be able to solve our problems, not just that it's either you're with me or againest me, just like george bush !!!!.<br />as for the praying in the church thing, i don't think it's a problem, but from all the opinions that were posted here, i think to satisfy all opinions we should ask a shiekh about it, and see what he'll say, but i don't think it's suitable to go to churches and do our prayr there, even omar ibn elkhattab didn't allow it when he opend el quds, but we can just visit them there, and congratulate them for their holiday. we shouldn't let the west do us apart, we're always one nation and we'll always be inshaa allah.<br />abdou ali<br />chicago, U.S.A"
