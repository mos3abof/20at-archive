subject = "بحبكم بجد"
author = "سامي عبد الحكيم احمد فضل"
posted = "2006-05-13"
text = "بحبكم وبحب مصر بحب ترايها بحب سمائها بحب نيلها بحب قلوب ناسها بحب المسكين والغلابة بحب الجدران بحب هوائها بحس انا مخلوق ليها وهي مخلوقة لية هي امي وابوي ياريت ندعي كلنا في صلاتنا مسلم او مسيحي خلينا مصر وتراب مصر يارب وخليها للمخلصين والي يحبوها والي عايزين يدوها ويدوا ناسهاواهلها واخيرا سلمولي علي مصر علشان انا متغرب بعيد عنها ادالي 3سنين وانتوا كمان وحشتوني بس جايلكم مش هطول اشوفكم علي خير يا ولاد بلادي"
