text = "بصراحة وبدون مجاملة انتم خليتونى متفائل جدا بمصر ولو انى متاكد بانى لن اعيش لارى التغيير المنشود عشان خلاص انا فى العد التنازلى زى ما بيقولوا<br />لكن انتم شوية شباب وشابات ادعوا الله ان يحفظكم ويرعاكم لمصر وانتم كمان بتكتبوا وبتقولوا اللى ما بيقدرش يقوله اجدع واحد عامل نفسه وطنى.<br />على بركة الله يا شباب ويا شابات ويا امل مصر والامة"
