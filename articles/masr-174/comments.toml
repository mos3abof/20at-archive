posted = "2006-05-12"
text = "كل ده علشان حسنى مبارك ما اتحكمش على قتله للرئيس السادات على أيدين القضاه وعلشان ما أتحكمش على وجوده فى الحكم بدون إنتخاب وعلشان تزويره للإنتخابات وعلشان أستيلاءه على ثروات مصر ولأنه ملقاش حد يرده ويصده ويطرده لكن نهايته سودة فى مصر بس محتاجين تكون إيدينا فى إيد بعض ومحتاجين قيادة القضاء لينا وبتوفيق الله سنقضى على هذا العجوز الطاغى"
