subject = "كل ظلم وله نهاية"
author = "واحد كان مصرى"
posted = "2006-05-12"
text = "مش هايستمر الوضع كده لازم يدوق الدكتاتور الكبير كل إللى سقاه للشعب من ظلم وإستبداد وأهو صدام حسين أكبر مثال على الطغيان كانت نهايته وبرضوا على أيد القضاء وإللى بيعمله حسنى مبارك علشان يقضى على آخر نفس للشعب وبعد كده يبقى ضمن إن الشعب كله مات لكن مصر برضوا ولادة وكلنا أبطال ومصر عمرها ما ها تموت لكن ها تكون مقبرة للطغاه"
