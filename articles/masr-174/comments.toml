text = "والله ان شفت النظر بحباب عنيا لما الوحد اتشل , انا لما كنت في الحفله التنكريه اياها متنكره في صوره 'نهي الزيني \" احبطتوني يتكم القرف فيك وفي اللي زيك مش عارفه اقول ايه<br />\" البلد دي رايحه في داهيه\" نوفا<br />\"لا للتمديد ...لاللتوريث\"...محمد السيد<br />\"مفيش فايدة\"....©دبدوب<br />ولا ه الاولي بسهوله ضيعوا الرواح...<br />والتانيه غول ابن غوله حار علينا وراح...<br />ووالتالته هيه المهوله تلتقيها مراح...<br />والاوله آه ..والتانيه آه...والتالته آه.....\"بيرم التونسي\"."
