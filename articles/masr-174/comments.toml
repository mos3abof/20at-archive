[[comments]]
order = 183
subject = "مصر التى فى خاطرى"
author = "أبو ابراهيم"
posted = "2006-06-25"
text = "أخوتى السلام عليكم ورحمة الله وبركاته :<br />ارجو الانتباه للنقاط التالية:<br />- التركيز على الدين الاسلامى والدفاع عنه بشكل دائم يعطى الإيحاء بأنه دين متهم دائماًوهذا غير صحيح وشواهد تسامحه فى التاريخ وفى الوقت الحالى ونصوص آياته واحاديث نبيه صلى الله عليه وسلم 0لاحصر لها<br />- الباس أى حادث بين مسلم ومسيحى لباس الدين خطأ كبير والتواء غير مبرر فنفس الحادث بنفس ظروفه يمكن ان يتكرر بين مسلم ومسلم ومسيحى ومسيحى.<br />- المسيحيين قدراتهم الاقتصادية فى مصر ومواقعهم المالية تزيد بنسبة كبيرة جدا عن المسلمين وهذاأمر معروف من زمن هناك وتساندهم الكنيسة فى ذلك و مصاعب وغلاء معيشة على المسلمين أكبر بحكم العدد.<br />- شكوى المسيحيين من قلة أو عدم التمثيل السياسى بدعوة اضطهاد الحكومة المصرية(الإسلامية) لهم كلام مرسل غير صحيح لأن الحكومة المصرية تضطهد المسلمين ايضاً والسجون ملاأى حالياً بالمسلمين الذين يريدون حق الإنتخاب وحق ا لترشيح ، ورغم تحكم المسيحيين اقتصاديا فى كثير من الموارد إلاّّ أنهم اساسايحجمون عن المشاركة اسوة بالمسلمين هذا امر ينضم تحت المواطنة وليس بسبب الدين.<br />- انتشار الأصولية المسيحية فى العالم الغربى وخاصة امريكاوتطبيقاتها الغازية والظالمةلدول العالم الإسلامى تحت مسميات زائفة كنشر الحرية والديموقراطية أغرى رؤوس المسيحية فى مصر بالتطلع لكسب سلطةاضافيةعلى المسلمين المنتزعة سلطاتهم أصلا واصابهم بحساسية زائدة وفائقة تجاه أى تصور اسلامى جديد يطرح على الساحة والمبادرة بالهجوم عليه بالطريقة الامريكية المعتادة وهل ننسى هجوم امريكا على حكومة حماس المنتخبة ديموقراطيا وعلى انتخاب نواب الأخوان فى البرلمان المصرى.<br />واخيراً لى رجائين عند الجانب المسلم والجانب المسيحى ؟<br />أما الجانب المسلم فأقول لكل اخوتى<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

[[comments]]
order = 184
subject = "احباب مصر"
author = "مكرم مصرى"
posted = "2006-06-28"
text = "جزاكم اللة كل خير على الشعور الطيب من كل مصرى على التعليق ولكن ما هو الحل هل الكلم والكتبة والمظاهرت هل هو الحل ؟؟ انا عشيت وكونت عشك مصر وحبيتك يامصر من كل قلبى,عشيت فيكى اجمل ايام عمرى مع انهاقصيرة ولكن الشعب الطيب من اول خروج الملك وهو يصدق كل واحد ومصر شعب يحب ان يصاقف يصقف حلو,عبد الناصر ,مسيو انورو وحتى كدب مصرعلى بابا طبعان عرفين الطيار حسنى وهو ولا طار بس هو طار باعقل المصرين حتى العام الا فات فى شهر 7 فى كل مكان وحارة وشارع صورة حسنى حتىالاحزاب ولكن انظر معى اذا كان امين شرطى يوقف حى يابقة رايس ج يعمل ايةكلنة بنضحك على بعض مصر ام الدنيا واحسن بلد لماذا والجزاير يقول احسن والتونسى يقول احسن والسعودى وجميع العرب لان الجميع واحد وكل ريس ذى الاخرحتى الملك وكل بلد نفس الاشكال على بابا والاربعين يعنى الحكومة وكل الشعوب وحد الجوع والمرض وبدون عمل كف كف مش بس مصر نحنو واحد مسلم مسحى وحد ممكن هذ غضاب من اللة وهى الحقيقة لان الان ليس فى اسلام بقلب حق فعلن هو غضاب من اللة,,بس اللة الرحمن الرحيم ,نزل عليك الكتب بالحق مصدقا لما بين يدية وانزل التورئة والانجيل وقال ولو شآء اللةلجعلهم امة وحدة ,, وقال من عمل صلحا فلنفسة ومن اساء فعليها وربك بظلم للعبيد,,هل فىشك فى هذ ـ كونت فى اخر فرح لو احد سئلنى من اين انت فاسرع واقول مصرى ولكن الان مش عرف بعد ما شوفت مصر او ناس مصر الكل نسوة فى حرب 73 من مات هو حسن وخليل وجرجس ووهبة ومحمد ومرقص ماذا حصل الان وكل فرد وراء حزب كذب وكل ما قتر الاحزاب ذاد الفوضة والحرمية وفوق كل هذنقول مصر وليس نقول شعب مصر والتجار والوازير ورئيس الحزب و,, وهل امين الشرطة هل هو مصرى لا هو تجار كل شئ فسد ظهر فى مصر للاسف ماذا اقول يا احباب البلد ارجو ان نقراء<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010639/http://masr.20at.com:80/article.php?sid=0"

[[comments]]
order = 185
subject = "بسم الله الرحمن الرحيم"
author = "smsm"
posted = "2006-07-02"
text = "دعاء<br />اللهم إني أستغفرك لكل ذنب<br />.. خطوت إليه برجلي<br />.. أو مددت إليه<br />يدي<br />.. أو تأملته ببصري<br />.. أو أصغيت إليه بأذني<br />.. أو نطق به لساني<br />.. أو أتلفت فيه ما رزقتني<br />ثم استرزقتك على عصياني فرزقتني<br />ثم استعنت برزقك على عصيانك<br />.. فسترته علي<br />وسألتك الزيادة فلم تحرمني<br />ولا تزال عائدا علي بحلمك وإحسانك<br />.. يا أكرم الأكرمين<br />اللهم إني أستغفرك من كل سيئة<br />ارتكبتها في بياض النهار وسواد الليل<br />في ملأ وخلاء<br />وسر وعلانية<br />وأنت ناظر إلي<br />اللهم إني أستغفرك من كل فريضة<br />أوجبتها علي في آناء الليل والنهار<br />تركتها خطأ أو عمدا<br />أو نسيانا<br />أو جهلا<br />وأستغفرك من كل سنة من سنن<br />سيد المرسلين وخاتم النبيين<br />سيدنا محمد صلى الله عليه وآله وسلم<br />تركتها غفلة أو سهوا<br />أو نسيانا أو تهاونا أو جهلا<br />أو قلة مبالاة بها<br />أستغفر الله .. وأتوب إلى الله<br />.. مما يكره الله<br />قولا وفعلا .. وباطنا وظاهرا"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113207/http://masr.20at.com:80/article.php?sid=228&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

