subject = "اسأل مجرب"
author = "واحدة وخلاص......بس مصرية جدا"
posted = "2006-05-06"
text = "صدقني احلى دماغ تعملها<br />بضم صوتي لصوتك يا إيهاب<br />جربوا انزلوا الشارع واتفرجوا ...حتشوفوا العجب<br />انا شخصيا لما بشوف الحجات دي دايما بيبقى عندي تعليق واحد بس (هم يضحك وهم يبكي)<br />وبستغرب من قدرة الشعب المصري على التكيف مع اوضاع (غير آدمية بالمرة)<br />طب والله الشعب المصري ده ملهوش حل (عبقري وحيفضل عبقري طول العمر) .. ومتنسوش ان بين العبقرية والجنون (شعرة) .. وربنا يسترها معاه<br />مقالك حلو قوي يا إيهاب والصورة رائعة وعاجبني تعليق الأخ مجدي<br />و.......خلي الدماغ صاحي.......سلام"
