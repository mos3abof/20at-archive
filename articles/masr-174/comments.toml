posted = "2006-08-02"
text = "عيزين نعمل يوم نعترض فية كلنا ونتوقف كلنا عن العمل والبيع والشر يوم اعتراض على احوال مصر احنا بنشتغل مفيش حد من البلد بياكلنا من جيبة مفيش حد حاطط صباعة فى عنانا احنا الى بناكلهم من فلوسنا ودخلنا لازم اعتراض على الاحوال نوئف الاقتصاد ولو يوم واحد .<br />ولازم نرجع للدين ولد و بنت الدين هو السلام بنا احنا فقدين احترمنا لبعضنا يا مصرين لازم نتحد و متسمعوش لكلام المدسوسين الى بكتبو تعلاقات غير الواقع المصرى الاليم و الشباب المستريح الى عايش فى السهر والمخدرات علشان يتوه علشان البلد تكون كويسة لازم نفهم بعض ونعرف كلواحد عايز اية لازم نقبل بعض على عيوبنا و بعد كة نغير فعيوبنا علشان تكون ميزة يارب يصلح حالك يامصر يارب يجمع الشباب على كلام الله يارب نتلائ فى طريق واحد يوحدنا منتفرئش زى محمد بن عبدالله معرف يجمعنا يارب يجمعنا تانى على كلمة لا اله الا الله سيدنا محمد حبيبنا رسول الله ."
