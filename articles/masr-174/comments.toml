author = "احمد المصرى"
posted = "2006-05-15"
text = "ايوه مصرين وبنحب مصر بس مش كلمه<br />لا فعل وانت كمان بتحب مصر<br />وماتقوليش ماعرفشى ولو فعلا مابتعرفشى<br />هاقولاك اذاى تعرف اذاكنت بتحبها ولا لاء<br />صحيح مصر فيها كتير حرميه سارقين فلوسها سارقين علمها سارقين حتى احلامها<br />لاكن داه مش زامبها ايوه مش زامبها<br />انا واحد متخرج من فتره مش طويله<br />ومتواظفتيش وعارف انى لو فضلت (100)سنه كمان مش هاتوظف لاكن<br />ايه زامب البلد صدقنى المشكله فى ان حاميها حراميها<br />بس هى دى المشكلهوبعدين دول البلاء بتاع البلد دى فلازم كل بلد يبقى ليها بلاء فائرضى بنصيبك وتسكت خالص اه اسكت خالص"
archived = "2006-06-15"
