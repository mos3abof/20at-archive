[[comments]]
order = 38
subject = "مصر بلد حسنى مبارك وإبنه وزوجته"
author = "مصرية"
posted = "2006-04-22"
text = "أنا لم أعد أشعر بإنى مصرية فلم يعد لوجودى قيمة فى بلدى الرئيس وزوجته وإبنه يهمشون الشعب لدرجة أن الشعب شعر أنه ليس فى بلده ولكنه مستأجر فى بلد حسنى مبارك، متى كان للشعب والشباب رأى يحترم فى بلده أبسط شيء الإنتخابات الأخيرة وتزويرها الذى قضى على أمال الشباب أبسط شيء ما نراه حدث للدكتور أيمن نور لأنه رشح نفسه أمام الحاكم أين رأييى فى الجامعة أين رأييى فى أوضاع الفساد فى البلد لقد وقف شاب أمام الرئيس بوش وإنتقد سياسته بحرية فأين أنا هل أستطيع أن أقول أن الرئيس يقتلنى ويهمشنى ويقضى على شباب مصر حتى يفرض عليهم إبنه حاكماً وهم يرفضونه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005959/http://masr.20at.com:80/article.php?sid=0"

[[comments]]
order = 39
subject = "ربنا يهدينا"
author = "بيبو"
posted = "2006-04-22"
text = "سلام الله عليكم و رحمته و بركاته الموضوع غريب جدا و الفكرة ساذجة جدا ازاي ندخل نصلي في الكنيسة علي العموم المفروض اعامل المسيحي بطريقة محترمة و كويسة في نطاق ما امرنا به الاسلام و اقول للناس المفروض انهم مسلمين اللي بيقولوا ان الاخوة المسيحين بالنسبة لهم افضل من المسلمين اتقوا و راجعوا ديناكم اخوة اه و لكن ذلك من خلال الالتزام بما امرنا به الاسلام قال تعالي \" ياايها الذين ءامنو لا تتخذوا عدوي و عدوكم اولياء تلقون اليهم بالمودة و قد كفروا بما جاءكم من الحق \" فالمفروض علي المسلم ان يكون اخوه المسلم احب اليه من اي شخص اخر و اكرر لابد من احترام الاخوة المسيحين وفقا لما امرنا به الاسلام و شكرا"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

