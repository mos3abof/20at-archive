text = "اولا انا بهنء اولاد يلدنا اللي اكيد اتكلموا من قلبهم علي الكلام ده الجميل اللي بيدل علي ان فعلا البلد فيهاناس بتحبهاتخاف علي ارضها نفسها تخدمها لكن مش عارفة وثانيا احب ان اقول لكل من عبروا عن شعورهم نحو مصر انتوا بتحبوا مصر حتي اللي قالوا مش عارفين بيحبوها ولا لا انا بقواهم انتوا بتحوها لكن الشيء الوحيد اللي بيحسسكوا ان انتوا تكرهوهاهو انكم اغلبيتكم يعني بيحبوا نفسهم وكمان انكم شايفين تخلف مصر وتقدم البلاد الاخري لكن انا بنصح ولاد البلد انهم لا يتركوا مصر ويفضلوا تحت سماؤها وعلي ارضها ولا يتخلوا عنها في وقت الشدة لان دي مصر وعلي فكرة انا بنت وانا صغيرة عندي 13 سنة<br />وخبك يا مصر"
