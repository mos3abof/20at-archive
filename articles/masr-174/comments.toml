[[comments]]
order = 95
subject = "نقف وقفه رجاله"
author = "ضد الحكومة"
posted = "2006-05-12"
text = "ربنا يكرمك يا محمد و يرجعك لعشرينات بالسلامه و بجد انا شايف ناس زهقانه و اتخنقت من الظلم خلاص بس المشكله ان احنا بنتكلم و احنا قاعدين في بيوتنا راكبين عربيه الاعتقلات بمزاجنا و احنا قاعدين نتكلم علي النت احنا لازم كلنا نتحرك الشعب كله يتحرك الشباب كله يتحرك نعمل زي محمد و لو اعتقلنا و اضربنا و لو متنا بس منفضلش قاعدين كده الامن و النظام لو شاف 70 مليون مصري بيقولو لأ و واقفين وقفه رجاله مصريين بجد مش حيقدر يعمل حاجه عايزين نشجع بعض و نقف ضد الظلم ونكلم الناس و نخليهم هما كمان يقفوا في وش الظلم لازم نصحي<br />و كفايه كده عشان متزهوش<br />و لغايه اما محمد يرجع يا ريت تبقي توقيعتنا في التعليقات<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223546/http://masr.20at.com:80/article.php?sid=306&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

