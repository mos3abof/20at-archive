text = "اللي بيحصل ده نتيجة طبيعية لأن الأخوة المسيحيين بيتعلموا في الكنيسة إزاي يتعاملوا مع المسلمين وإزاي يكرهوهم وإزاي ميبينوش الكره ده .<br />الدروس دي بتتدرس في الكنايس صدقوني، انا مستغرب ليه مع ان طول عمري جيرانا في البيت والشارع مسيحين وطول عمري خالتي فوليت زي ما كنت باسميها باحبها اكتر من خالتي زينب"
