subject = "تحت السطور"
author = "ياء"
posted = "2006-05-13"
text = "مصر حبلى و اللى ف بطنها ولد<br />ولد طول بعرض بحلاوة<br />في عينيه بريق<br />وف دمه خفه<br />مخلوطة بحبة شقاوة<br />مصر حبلى<br />ومش هبله<br />واللى ف بطنها<br />واد ع الفرازة متنقي<br />دمه زي العسل<br />وخالي م الغباوة !!!<br />منقول<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223546/http://masr.20at.com:80/article.php?sid=306&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 107
subject = "صعيدي وعجبي"
author = "ابو علي"
posted = "2006-05-13"
text = "عليا النعمة اللي حصل ده يوم الأربع الأسود ما يرضي اي كافر علي وجه الأرض<br />وكمان شوية البلطجية ولاد الكلب اللي تبع الحزب الوسخ دول علي طول لما بتتزنق الحكومة علي طول تجيب شوية ولاد الكلب الي بيكسبو بهتافاتهم دي<br />وكمان ايه اللي عملتوه للنسوان يا ولاد الكلب في المظاهرات دي ؟<br />والله ليهم حق في اي دولة يدونا بالجزم علشان سعادة مبارك بيه الراجل الحلو<br />واحذر الكل ان البلد ان شاء الله هتولع عن قريب بس استنوا لما الطلبة تفضالكو وانتو موش عارفين يعني ايه الطلبة ؟<br />وكمان استنوا لما ربنا يكرم الصعايدة ويفوقو من الضغط اللي هما محطوطين فيه من الشرطة العميلة<br />واقولهالكو عمر مصر ما كانت مبارك ولا عمر مبارك كان مصر<br />واعجبي"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223546/http://masr.20at.com:80/article.php?sid=306&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

