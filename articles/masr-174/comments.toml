[[comments]]
order = 58
subject = "ربنا يستر على مصر"
author = "أمنية"
posted = "2006-04-27"
text = "واللهي بعد ما قريت التعليقات وخصوصا الآراء المتعصبة دينيا قلت ربنا يستر عليك يا مصر، كل واحد شايل سيفه وعامل لي مفتي وهو تلاقيه مش عارف اللف من كوز الدرة في الدين، لا وإيه كمان ؟ دول بيفتوا في دين المسيحيين كمان وبيقولوا إنهم بيتعلموا في الكنيسة إزاي يكرهونا، طب إيه رأيكم بقى إني كنت باحضر مع صاحبتي المسيحية دروس الأحد من غير ما تعرف الراهبة إني مسلمة وكنت باروح معاها عشان هي كانت بتكسل وكانت أمها بتعزعل منها فكانت بتطلب مني إني أروح معاها عشان ما تزهقش وعشت في الكنيسة فترة طويلة مع صديقتي أمارس ما تمارسه وشفت هم عاملين إيه فعلا من جوه كنايسهم، فعلا هم أصل مصر الطبيعة البشرية المسالمة والحب بلا حدود وتعاليم المسيح الجميلة ولا يأتون على ذكرنا كمسلمين أبدا ولا ليهم علاقة بديننا، ولما عرف القسيس بعد فترة إني مسلمة قال لي لازم أقول لأهلي وآخد إذنهم اني باروح الكنيسة مع صاحبتي، مع إني بطريقة تفكيركم العنصرية المتطرفة أبقى لقمة سهلة بالنسبة له عشان ينصرني، لكن ماحصلش وفعلا استأذنت أهلي ووافقوا اني أروح مع صاحبتي ..وللأسف لما حبيت أدخلها الجامع وأوريها دور العبادة بتاعتنا شكلها إيه من جوة طردنا حارس الجامع وقالنا ياللا يا عيال من هنا أنا لسه كانس الجامع .<br />شفتم الفرق يا مسلمين ...ده غير اننا بنعلم ولادنا انهم كفرة وهيروحوا النار وانهم أعداء للمسلمين وانهم بيحلموا يموتونا وكل الخرافات اللي مالية الدنيا...تفتكروا ثقافة الكره بتولد إيه؟ أكيد كره..عايزين يعني المسيحين يفضلوا يحبونا واحنا نازلين فيهم تقتيل ودبح واعتداءات وتحجيم لمواطنتهم وتهميش لدورهم السياسي والعلمي وغيره وغيره<br />لو كانت بلدنا بلد محترمة كانت الفرص تروح لذوي الكفاءة بغض النظر عن الدين لكن للأسف شعب عنصري تحكمه حكومة عنص<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

[[comments]]
order = 59
subject = "ناصر 56"
author = "لبا يوجد رد ابلغ من كلام الله عز و جل"
posted = "2006-04-27"
text = "بسم الله الرحمن الرحيم(ياايها الذين ءامنو لا تتخذوا عدوي و عدوكم اولياء تلقون اليهم بالمودة و قد كفروا بما جاءكم من الحق )<br />بسم الله الرحمن الرحيم<br />(قاتلوا الذين لا يؤمنون بالله و لا باليوم الآخر و لا يحرمون ما حرم الله و رسوله و لا يدينون دين الحق من الذين اوتوا الكتاب حتى يعطوا الجزية عن يد و هم صاغرون، و قالت اليهود عزيز ابن الله و قالت النصارى المسيح ابن الله ذلك قولهم بأفواهم يضاهون قول الله كفروا قاتلهم الله أنى يؤفكون، اتخذوا أحبارهم و رهبانهم أربابا من دون الله و المسيح ابن مريم و ما امروا إلا ليعبدوا إلها واحدا لا إله إلا هو فأني يؤفكون)<br />ربنا بيأمرك تقاتل مش تصلى معاهم<br />انتوا نسيتوا دينكم ولا انتوا اساسا ما تعرفوهوش<br />يا استاذ وائل عباس<br />انا بحترمك جدا و الله لكن يا ريت تثقف نفسك فى الدين شويه و ما تنساش ان معركتنا الاصليه هيا الجنه مش الديموقراطيه"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

