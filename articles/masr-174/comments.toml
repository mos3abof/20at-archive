[[comments]]
order = 27
subject = "وزارة شعبولا.... أيييييه !!"
author = "مصري"
posted = "2006-04-18"
text = "عجيب أمر وزارة الداخلية فى مصر فقد تضخمت أدوارها حتى استوعبت أحوال الوطن كله !! رغم أنها وزارة تعتمد على أفراد غير مؤهلين طبقا لدراستهم سواء كانوا ضباطا أو جنودا للتعامل مع مشاكل - الهيئات والأفراد - التى لا علاقة لها بأمن الوطن أو المواطن وربما صارت كذلك نظرا لتغير الأهداف التى ترسم وتحدد سياسة الوزارة التى إنشغلت بحماية أمن الحاكم ورجاله فى كل مكان كانوا على حق أم على الباطل , خدموا الشعب أم أهانوه .<br />المهم تحقيق الهدف ونظرا لأن الحكومة لاتملك عقلا فكان لابد أن تملك عضلات ولأن النظام لايملك قدرة على إستيعاب الشعب وتحقيق متطلباته الرئيسية بعد خمسين عاما من الانفراد بالحكم فكان لابد أن يمارس قهرا واستكباراً على أبناء الوطن .<br />ولأن الحاكم إعتمد تزوير إرادة الشعب فى تأمين إستمراره وتآكلت شرعية وجوده فكان لابد من إهمال الدستور والتلاعب بالقانون فى تعامله مع مواطنيه وكانت كل تصرفاته بعيدة عن القانون وروح القانون .<br />وهكذا صارت وزارة الداخلية أكبر وزارة تعتمد لها موازنة - بإجماليات - دون تفاصيل معلومة ولو حتى لأعضاء مجلس الشعب ضمن موازنات أخرى مجهولة التفاصيل تغيب عن المتابعة من أجهزة الدولة الرقابية مثل موازنة مؤسسة الرئاسة وموازنة القوات المسلحة فى عصر صارت التفاصيل عن كل شئ فى الدول المحترمة معلومة ومنشورة .<br />حتى عرفنا مثلا أن بوش حصل على رواتب فى عام 2005 بلغت - طبقا لتقرير صدر من البيت الأبيض - 618694 دولار وفرضت عليه ضرائب على الدخل بلغت 187765 دولار وتبرع بمبلغ 75560 دولارا لعدد من الجمعيات الخيرية ذكرها التقرير !!<br />ألا يستحق الخبر علامة تعجب بل علامات .<br />فى المقابل أقامت مصلحة السجون بوزارة الداخلية حفلها الترفيهى الخامس لرفع المعاناة عن كاهل النزلاء ورفع روحهم المعنو<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

