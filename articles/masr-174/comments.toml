[[comments]]
order = 84
subject = "أغيثوا مصر"
author = "ياء"
posted = "2006-05-11"
text = "مش عارف النظام ده عايز ايه<br />فلوس مهو اخد عايز كمان ياخد ويغور<br />سلطه بقالو اكتر من 25 سنه كاتم على نفسنا<br />النهارده كان يوم فوق الوصف انا رحت معرفت اخرج من محطه القطار فى رمسيس ولما خرجت شفت نوعين من الناس ناس بتضرب ( عساكرنا الغلبانه ) وناس بتضرب ( شعبنا المغلوب على امره )<br />للحق كان فى ناس يامه<br />للاحق كان فى امن يامه يامه يامه ( غير الامن قلى موصلش )<br />سمعت انهم مكنش عندهم النيه انهم يقبضوا على احد<br />النهارده كان ضرب ثم ضرب ثم ضرب الخ-الخ -<br />انا قلبى وجعنى كفايه كدا انا رايح انام<br />واحلم بمصر تانيه غير مصر مبارك<br />مصر الخير مصر تكون بشعبها قلى بيحبهاجنه وخيرها غنا<br />قادر يارب ترفع عنا الظلم وتاخد الظالمين<br />yehia2784@hotmail.com"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223546/http://masr.20at.com:80/article.php?sid=306&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

