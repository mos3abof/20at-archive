[[comments]]
order = 2
subject = "رجاله وولاد بلد بجد"
author = "عشرينات.........ولاد البلد"
posted = "2006-03-14"
text = "هتكلم الاول وبعدين اقولك انامين وهتعرفوني<br />انتم رجاله بجد( طبعا بنات وولاد) بلاش عنصريه ...........<br />وولاد بلدكمان ونص وتلات ترباع<br />كلامكم بيهز الكل وبيحرك في قلوبهم المشاعر والاحاسيس والذي منه<br />ودي بلدنا<br />واحنا للي هنغيرهاوبايدينا وايدين الكل<br />وهنتكلم وهنقول اللي في نفسنا واللي هقيولنا لأ هيتيجي ناس تانيه ولاد بلد بجد<br />وهيتكلموا عشان يغيروا لبلد<br />بس في لحظة حسيت ان احنا اللي لازم ننزل ونحرك الناس ونديهم كلامنا ونخليهم يقرأوه<br />لو الناس سلبيين مش نقولهم انتم ولاد...<br />والبلد هتضيع يا ابن ال...انتا وهوا...<br />لأ والف لأ .........لازم احن اللي نغير ونكون ايجابيين اوي واوي اوي بلا حدود<br />لما قرات في موقعكم كلامكم وان بره مصر..عجبتوني اوي وقلت اخيرا طلع ولاد بلد بجد...<br />وكل مره كنت بقرأ حاجه لواحد منكم بضحك واقول......<br />والله في امل يا بني......<br />بس لازم نشتغل وتشتغل يا ابني وتحرك الناس....<br />وبما اني في الجامعه....قلت ليه محركشي شباب لجامعه..<br />هوا اه في ناس بتخاف من التيارات السياسيه عموما ويقولك خايف علي نفسي وتقديري ومذاكرتي وغيره...<br />بس لازم الناس دي تفووووووق....<br />عشان كده عملت اسرة باسم موقعكم وسميتها بولاد البلد .....وعشرينات كماان...<br />ولما قرات الصفحة دي دلوقتي...<br />قلت ياللاا نكمل شغل الاسرة ونعمل اشتقاق زبكم ونطلع اسرة مشتقه....<br />هما صحيح الاتنين مش مصرح بيهم ...<br />ولحسن حظي انا اللي جيت في الايد واتحقق معايا وقال اييه....ناويين يحولوني مجلس تاديب.........<br />ااااااااااه...لا طز والف طز......<br />هيا معلشي كلمه سخيفه شويه بس اااااااه ..دي بلدنا....<br />وبالمناسبة السعيده دي اعلن ان اسرة احنا ولاد مصر او ابلد لما نتفق.....<br />هتنط<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005959/http://masr.20at.com:80/article.php?sid=0"

[[comments]]
order = 3
subject = "كلنا بنحب مصر"
author = "عشرينات ... ولاد البلد ... MISHMISH"
posted = "2006-03-22"
text = "بجد .. نقدر نقول دلوقتى احلامنا بدأت تتحقق ..<br />او بمعنى أصح .... أحلامنا بدأت تتفجر ..<br />يااااااااه .. الواحد كل لما يفتكر انه فى مصر يحاول ينسى تانى .. بس الواقه بقه يا شطار ..<br />هى الدنيا كده .. وبما اننا فى الدنيا الى هى كدها يبقى لازم نغيرها وحاليا ممكن يكون سلاحا القلم ..<br />وعلى رأى واحد أعرفه :<br />وساعات بحس بأني موجة عاتيه<br />جت في لحظة من العدم<br />وسعات بحس باني نسمة<br />تلغي م الكون . طعم الألم<br />مع أنى أضعف م الورق<br />وقت ما يحزة القلم<br />واتمانلكم من كل قلبى ان ربنا يوفقكم ويوفقنا احنا كمان ..<br />احنا فى كلية تجارة وبرده على رأى واحد صاحب بس واحد تانى غير الاولانى :<br />احنا من كليةتجارة<br />والتجارة في الادارة<br />والادارة في العبارة<br />والعبارة في الدوبارة<br />والدبارة من التجارة<br />والتجارة مش شطارة<br />انما حبة حظوظ<br />وانا عارف إنى طولت عليكم بس اعمل ايه سلاحى بقه هوه القلم .. لازم الواحد يعيش فى الدور شوية ولا عادل امام احسن مننا يعنى ... المهم هسيبكم مع سؤال الحلقة ؟<br />؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />النفوذ بيجيب فلوس<br />والفلوس تجيب نفوذ<br />والنفوذ يجيب غلاوة<br />والغلي جزمة عساكر<br />عالرقاب تضغط تدوس<br />والغلا قانون طوارئ<br />حاجة طابقة عالنفوس<br />اة يا مصر لو تقولي<br />يبقي مين ابن التيوس؟<br />اوفكم بعدين<br />MISHMISH<br />AHMEDBASHA_MISHMISH@HOTMAIL.COM"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005959/http://masr.20at.com:80/article.php?sid=0"

[[comments]]
order = 4
subject = "بص يا باشا"
author = "هبهوب او هووووبه اشمعني انتوا يا عني ؟؟"
posted = "2006-03-22"
text = "انا قلت قبل كدا ابن \" التيوس \" دا فين<br />فين يا حلوين<br />راجع تعليق \" مادا لو تنح الريس \"<br />اوف حتلاقي التيوس والكلب وكل اللي يجي علي بالك يا مسمس \" بتفكرني بواحد غالي \"<br />ما علينا<br />حديكوا شعر بمناسبه التجاره في شكاره عم متقال<br />مع ملاحظه يكمن حزف \" احمد \" واستبدلها<br />\"بزاك\"<br />محــــاسبة الإدارة أرهقتني<br />بإعداد القـــوائم و البنود<br />و تحليل التفاضــــل في قرار<br />لتحديد العـــوائد للعقود<br />وتخصيص المـوارد بانتظام<br />و إنتاج المراحل و الوعود<br />رئيس القسم أحـمد ذو المعالي<br />يشجـــعنا على بذل الجهود<br />و إعمال القرائــــح في قضايا<br />معالجة القروض لدى الوعود<br />أســـاتذة المحـــاسبــــة اتفاقا<br />يشير أريبهــــــم لــــربا النقود<br />وادعولي يا بشررررررر."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005959/http://masr.20at.com:80/article.php?sid=0"

