author = "واحدة وخلاص ......لكن مصرية جدا"
posted = "2006-05-11"
text = "مش عارفة اقول ايه<br />هو في ايه ؟<br />امتى وفين وازاي وليه ولحد امتى ؟<br />مش عارفة<br />بس كل اللي انا حاسة بيه اني بقيت غريبة<br />مش ممكن تكون دي مصر<br />لأ مش دي مصر .... مش دي مصر<br />انا عايزة مصر اللي انا عارفاها اللي قريت تاريخها وعشت ناسها واتولدت وحبها مزروع جوايا.<br />ولا عمري قلت آآآه من حالي ...<br />لا عمري قلت آآآه من فقر ...<br />لا عمري قلت آآآه من مرض ..<br />لأني كنت عايشة في مصر ....<br />حبها بيغنيني .....<br />وطيبة ناسها وأمنها بيشفيني...<br />بس دلوقتي انا مش في مصر ....<br />بدور حواليا مش لاقياها....<br />بدور عليها ....مش موجودة....<br />مصر أختفت .... مش لاقياها.....<br />بس انا مش حسكت ....<br />حدور عليها....لغاية ما ألاقيها ..... وترجع تاني ...عروسة بهية....<br />سلام الله عليكي يا مصر .. يا رب تسلمي من كل شر..."
archived = "2006-09-05"
