text = "رغم الجراح رغم الموت الذي يتربص بنا في كل لحظه ؟؟؟ لازلنا نحلم بغد أكثر أشراقا ؟ والحلم حق مشروع ؟ ولكن<br />القتله والسفاحين يحاولون مصادرة هذا الحلم ؟؟؟ ولكن سنبقى نعمل وسنبقى نحلم وسيكون الغد هو الاجمل ؟<br />أحلم .... بحياة ..... أفضل<br />أحلم .... بمستقبل ... أجمل<br />أحلم ..... أ حلم<br />أن أصحوا ..... كل صباح<br />وينموا زرعي<br />وتدور طواحين<br />المعمل<br />أحلم ........ أحلم<br />بشعاع ....... عيون<br />العشاق<br />بضحكات ..... الاطفال<br />برغيف ...... الخبز<br />بكلمة ....... صدق<br />تكون هي<br />البلسم<br />أحلم .... أن .... أكون<br />طير حمام<br />ويعم ... السلام<br />الاشمل<br />أحلم ...... بأنهار ... الخير<br />تفيض عطاء<br />ويغني البلبل<br />ولا<br />ُيقتل<br />أحلم .... بنظرات .... عيون<br />الاحباب<br />تكحلني ....... ومن فيض<br />فرحي<br />تتكحل<br />أحلم ....... بريشه<br />بقطعة قماش<br />بسقف ... من سعف ... نخيل<br />أجعله<br />مرسم<br />أحلم ...... أحلم<br />أحلم ..... أن اسمع<br />صوت المذ ياع<br />يشدوا بصوت .... الموسيقى<br />لايذكر ..... أعداد القتلى<br />والجرحى<br />وأنهار ...... وبحيرات<br />ألدم<br />أحلم ... ببناء يعلو<br />وليس .. بجدار ... بقذائف<br />الموت العبثي<br />يهدم<br />أحلم ......... أحلم ..... أحلم<br />أليس من حقي<br />أن .... أحلم<br />أحلم<br />بكأس ..... حليب<br />بكسرة ...... خبز<br />بعهد ....... أقطعه<br />على نفسي<br />ولا<br />أندم ؟؟؟<br />أحلم ..... أن الاعراب<br />قد شبعوا<br />من سبات النوم<br />وتداعوا ..... للحق<br />دعاة ....... سلام<br />دعاة ...... وئام<br />هو<br />الاجمل<br />اقرأ بقية التعليق .."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065020/http://masr.20at.com:80/article.php?sid=0"

