text = "السلام عليكم و رحمة الله و بركاته<br />كنت أظن دائما ان من يؤذي هذا الدين من اصحاب الأراء و الاقتراحات الفاسدة من الفاسدين و المنحليين اخلاقين أو الكارهيين للاسلام.............<br />يعني من الأخر ساقطين الدين<br />أما ما رايته من اقتراح الصلاة المشتركة<br />ان قد يكون ايضا ساقط العقل أحمق<br />و لا حول و لاقوة الا بالله<br />و اخيرا اسال صاحب أو صاحبة هذا الاقتراح<br />\" انت متربي فين يا ابني؟؟؟؟؟؟؟؟؟؟؟!!!!!! \""
