author = "السلام عليكم ورحمة الله وبركاته"
posted = "2006-04-21"
text = "للشيخ عبد العزيز بن عبد الله بن باز (رحمه الله تعالى)<br />السؤال : نرجو التفضل بإرشادنا إلى أهم كتب العقيدة ؟<br />الجواب : أهم كتب العقيدة وأعظمها وأنفعها القرآن العظيم فهو أهم كتاب وأصدق كتاب وأعظم كتاب وأشرف كتاب ، فعليك أن تعض عليه بالنواجذ وتكثر من تلاوته من أوله وآخره ، فكله عقيدة وتوجيه إلى كل خير وتحذير من كل شر ، فاقرأه بتدبر وعناية ورغبة في العلم واستقم على ما دل عليه قولا وعملا وعقيدة تجد فيه كل خير من أوله إلى آخره من الفاتحة إلى {قُلْ أَعُوذُ بِرَبِّ النَّاسِ}<br />تأمل ذلك الكتاب العظيم وأكثر من تلاوته وتدبر معانيه ، ففيه بيان العقيدة التي رضيها الله لك ورضيها للمؤمنين ، ثم بعد ذلك عليك بكتب الحديث الشريف كالصحيحين وغيرهما ، ثم كتب أهل العلم المعروفين بالعلم والفضل والعقيدة الصحيحة ككتب شيخ الإسلام ابن تيمية ، ومنها [العقيدة الواسطية] و[التدمرية] و[الحموية] و[منهاج السنة] و[مجموع الفتاوى] ، و[عقيدة ابن أبي زيد القيرواني] وشرح ابن أبي العز [للعقيدة الطحاوية] فهو شرح مفيد .<br />ومن ذلك كتب ابن القيم رحمه الله فهذه كتب طيبة ومفيدة ، ومنها كتاب [فتح المجيد] للشيخ عبد الرحمن بن حسن ، و[كتاب التوحيد] للشيخ الإمام محمد بن عبد الوهاب ، و[كشف الشبهات] ، و[ثلاثة الأصول] له أيضا ، ومنها [الدرر السنية] المشتملة على فتاوى علماء نجد .<br />وأوصي طلبة العلم في ابتداء طلبهم أن يحفظوا كتاب الله عز وجل أو ما تيسر منه ، وأن يحفظوا [كتاب التوحيد] ، و[كشف الشبهات] ، و[ثلاثة الأصول] و[العقيدة الواسطية] فهي مختصرة في بيان التوحيد بأقسامه الثلاثة ، والعقيدة السلفية ، وهذه هي العقيدة التي دعا إليها الشيخ الإمام محمد بن عبد الوهاب رحمه الله وهي عقيدة السلف ،<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903171249/http://masr.20at.com:80/article.php?sid=174&PHPSESSID=5cf0aaf05c0d14593afeacd73a0630dc"

