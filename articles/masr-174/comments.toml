[[comments]]
order = 196
subject = "رساله هامه"
author = "محمد بن اسناعيل"
posted = "2006-07-17"
text = "رسالة إلي الشيخ عبد الرحمن السديسي 1:<br />بسم الله الرحمن الرحيم<br />من محمد بن إسماعيل<br />(\" لو وضع الشمس في يميني والقمر في يساري على ان اترك هذا الأمر ما تركته حتى اظهره او اقتل فيه \").<br />أقسم بالله العالى العظيم. أقسم بألله العالى العظيم . أقسم بألله العالى العظيم. أقسم بألله العالى العظيم<br />سبحانه وتعالى ربنا جلى و عالى. لقد تجلى لي الله سبحانه و تعالى فى الملأ الاعلى فى كوكبه الذى يسكن فيه. اربع مرات في مكان واحد و اربع مرات بلبس عظيم لبس ملك مختلف فى كل مره وكلمني مرة كلمتين في اذني و اشار لي على ذاته بيده الكريمة مرتين.<br />ولقد تجلى الله العزيز الحكيم إلي والدتي ثلاث مرا ت و هي تعيش في مصر. و ارني ربي السميع البصير ليلة القدر.....فتعلمت منها. و سأقصها عليكم إن شاء الله فيما بعد. وفى اى يوم هى ليله القدر وهى ليله هادئ وساكنه وفيها قمرا<br />- الأية (\" ما كان لبشرا ان يكلمه الله إلا وحيا او من وراء حجاب \")<br />و أنا كنت من وراء حجاب و امي كذلك.<br />- الأية (\" يهدي الله لنوره من يشاء \")<br />وان شاء الله أهديكم في بعض الذي تختلفون فيه.<br />أطلب من حضرتكم الإستماع لي و لا يصدنكم الشيطان عني فاستمعوا لي و وانصتوا لي لعلكم تعقلون.<br />لقد علمنى ربى ايات كثيره فى القران الكريم اوضحها لكم فاذا كنت كذبا فعلى كذبى وان كنت صادقا يصبكم بعض الذىيعدكم ربى . تشاورا وتحاورا لعلكم تعقلون واشرونى توكلت على الله نعمى المولى ونعمى النصير<br />أشهد ربي على انني أبلغتكم الرسالة :<br />أريد ان تحملوا معي هذه الرسالة جميعا حيث ان القيامة قريبة والامة الإسلامية غافلة, نائمة و ضائعة.<br />وانتم تعلمون ذلك جيداياايها الذين امنوا تجمعوا ورابطوا واثبتوا احبكم الله اعزكم الله نصركم الله<br />مع العلم انى لا ادعى النبوة<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010639/http://masr.20at.com:80/article.php?sid=0"

[[comments]]
