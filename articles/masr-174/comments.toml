[[comments]]
order = 162
subject = "مات الرئيس"
author = "عبدالعزيز جويدة"
posted = "2006-06-17"
text = "شعر عبدالعزيز جويدة<br />ماتَ الرئيسْ<br />وهَوى سُليمانُ الحكيمُ<br />وكلُّنا كالجنِّ نَخدُمُهُ<br />ونَرفُضُ أن نُصدِّقَ<br />أنَّهُ قد ماتْ<br />ماتَ الرئيسْ<br />حامي الحِمَى<br />وسليلُ عصرِ المعجِزاتْ<br />هو ميِّتٌ مِن بعضِ أعوامٍ مَضتْ<br />حاولتُ أُقنعُهُمْ بذلكَ إنما ..<br />هَيهاتْ<br />الكلُّ يَرفضُ أن يُصدِّقَ<br />أنَّ جبَّارًا كهذا قد يَموتْ<br />صُورُ الرئيسِ على الحوائطِ<br />في الميادينِ الفسيحةِ<br />والبيوتْ<br />أنا كنتُ أعملُ في بلاطِ المُلكِ لكنْ<br />عندما أودى سُليمانُ الحكيمْ<br />قطعوا لساني<br />أجبروهُ على السكوتْ<br />وبرغمِ أني عارفٌ<br />مِن أن هذا العرشَ<br />أشبهُ بالضريحْ<br />صُوَرٌ أراها ذُيِّلَتْ<br />ببديعِ آياتِ المديحْ<br />\" حامي الحِمَى ، والقائدُ الأعلى<br />في ثورةِ التسطيحْ \"<br />نَوعُ مِن الزيفِ الصريحْ<br />وجَميعُ رُؤساءِ الدولْ<br />يَتحدثونْ<br />ويُناشِدونْ<br />وبكلِّ حزمٍ يَرفضونْ ..<br />موتَ الرئيسْ<br />ويُؤكدونْ<br />أن الخبرْ ..<br />مَحضُ افتراءٍ أو جُنونْ<br />أ هناكَ رؤساءٌ تموتُ مِن العربْ ..<br />يا كاذبونْ ؟<br />سَلَّمتُ أمري للذي خَلقَ الوجودْ<br />وأنا بوجهِكَ سيِّدي دومًا أُحدِّقْ<br />هذا سُليمانُ الحكيمُ أمامَنا<br />هو ميِّتٌ لكنَّ فردًا لا يُصدِّقْ<br />هو جالسٌ<br />وعصاهُ لا تَهتَزُّ في يَدِهِ<br />وأحيانًا يُحَملِقْ<br />والجالسونَ على الموائدِ كلُّهُمْ<br />قد جاءَ يَسعى للتملُّقْ<br />يَتحدَّثونَ عنِ التعاونِ ،<br />والتبايُنِ ، والتطرُّقْ<br />وهناكَ آلافُ الخُططْ<br />خَمسيَّةٌ ، مِئويةٌ ، ألفيَّةٌ<br />وكلامُهمْ عَذبٌ وشَيِّقْ<br />هذا سُليمانُ الحكيمْ<br />يأتي عليه الدورُ ضِمنًا في الكلامِ<br />وليسَ يَنطِقْ<br />لكنَّنا بالطبعِ نَفهمُ ما يُريدْ<br />فإذا بكلِّ الحاضرينَ يُصفِّقونْ<br />وأنا أُصفِّقْ<br />كانَ الحكيمْ<br />وجهًا لوجهٍ فوقَ كُرسيٍّ أمام<br />اقرأ بقية التعليق .."
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144102/http://masr.20at.com:80/article.php?sid=0"

