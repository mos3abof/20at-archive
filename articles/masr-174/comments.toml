text = "مصر حلوة طول ما فيها ولاد البلد _ مش انتو بس _ انزل السيدة زينب وباب الشعرية وبولاق ابو العلا والحسين والازهر جو الحارات والدروب القلب لسه مليان حلاوة ولاد البلد بالرغم من ارتفاع كل شئ في سعره الا انها لم تصل لارتفاع حلاوة ولاد البد بنتعلم كل يوم من نفسنا واللي بيحصل لكن النتيجة النهائية صفر مش بايدينا ولا بايدي ولاد البلد بايدي غيرنا وبرضة صابرين ونتمني مصر كلها تصح من القلب زي ولاد البلد مش ولاد الـ ....."
