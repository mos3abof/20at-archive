[[comments]]
order = 71
subject = "تابع..."
author = "بنت البلد دى..!!"
posted = "2006-05-02"
text = "ثانيا احب ارد على الاخت اللى بتقول ان المسلمين بس هما اللى بياخدوا حقوقهم فى البلد دى<br />عايزة اقولك لو اننا فعلا بناخد حقوقنا امال ليه نص البلد فقرا<br />هو مش برضه احنا الاغلبية؟<br />وليه النص التانى مضطهد<br />ومافيش ادل على كلامى من اللى بيحصل للاخوان المسلمين......<br />لو انك فكرتى مرة تحبى البلد دى مش هتحسى ابدا انك مسيحية لان كلنا واحد<br />انا ليا اصدقاء مسيحييين<br />وبرغم كل اللى بيحصل الفترة دى بالذات<br />الا ان الكل لازم يعرف ان المقصود تفريقنا من الرباط اللى ارتبطنا بيه من ايام سعد زغلول وغيره<br />انصحك انك تحاولى تغيرى نظرتك دى وتعرفى ان مفيش فرق بين مسلم ومسيحى ويهودى<br />الفرق موجود بس بين اللى بيحب البلد واللى مش بيحبها<br />بين اللى بيعمل عشانها واللى بيسعى لخرابها........"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005959/http://masr.20at.com:80/article.php?sid=0"

