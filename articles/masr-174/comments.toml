subject = "مصر التى نحبها"
author = "احمد"
posted = "2006-06-12"
text = "مصر البلد الوحيد فى العالم و التاريخ التى على مواطنيها كل الواجبات والالتزامات التى من الممكن تخيلها و ليس لهم فيها اى حقوق حتى لو كانت حقوق الحيوانات فى دول العالم الرابع وان فتحت نافذة صغيرة لممارسة ما قد يسمح بة الفرعون فقد يكون فخ واسألوا د/ ايمن نور اين هو الان و باى تهمة ساذجة لا يصدقها طفل صغير فما بالكم بشعب حتى حق احترام ذكاء البشر عند ادنى درجاتة غير موجود انهم يستخفون بعقولنا الى اقل من عقول الحيوانات المتخلفون العقليون جاهزون اتحمل كل المصائب صاحب العبارة غير مسؤل- همة الى مش عارفين يركبوا العبارة - وقائمة البلاوى اكثر من ان يحتويها الموقع للاسف مصر التى نحبها ارض وسماء وموقع ونيل اما الوطن فهو غير موجود الوطن محبوس فى القصر الجمهورى وفى جيوب الوريث واصدقائة اللصوص"
archived = "2006-06-15"
