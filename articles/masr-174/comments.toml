posted = "2006-06-20"
text = "الحزب الوطنى بتاع الاصلاح باماره<br />بلع الاصلاحات الدستوريه<br />بلع 1000 شهيد بتوع ممدوح سليمان<br />دعك القضاه ببالجزم<br />الفساد اصبح ظاهره تويدها حكومه الحزن الوطنى النضيف مين ده هو فين هناك بخ نكته<br />بصراحه اعضاء الحزب الوطنى دول مليشيا وشويه ناس هفق بيدوا شرعيه لنظام فاسد<br />النادى الاهلى دافع عن جمهوره ضد جزمه مرتضى منصور<br />والحزب الوطنى بلع جزمه طلعه السادات على قفا الحزب الوطنى واين تنظيمه احمد عز<br />ليه الطناش ايه السبب لان العند مع طلعت حيخلى طلعت يطلع ورقه يا اما طلعت قبض التمن<br />وياهل طظ انتم لطظ وطظ لكم"
