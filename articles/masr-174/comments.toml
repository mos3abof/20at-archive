[[comments]]
order = 203
subject = "حاجة حلوة خالص ...حاجة حلوة موووووت...."
author = "اللى :كان بيحب مصر"
posted = "2006-07-21"
text = "من ساعة ما شفت مواضيع الماجيستير و الدكتوراه عندنا فى الجامعة (بتتغير) بأوامر (الأمن) عشان فيها مواضيع علمية متطورة .....<br />ومن ساعة ما دخلت الجيش و شفت الضباط بياخدوا رسائل الدكتوراه فى الهندسة بالأقدمية وهم لا يعرفون أى حاجة من حتى أساسيات الهندسة اللى بتدرس لطلبة إعدادى هندسة....<br />ومن ساعة ما شفت سعر البنزين يغلى 30% فى ليلة....<br />ومن ساعة ما عرفت ميزانية وزارة البحث العلمى التى لا تساوى ميزانية رسالة دكتوراه فى كثير من الدول....<br />ومن ساعة ما شفت نواب الإخوان اللى فلقوا دماغنا عشان يدخلوا (المجلس) ساكتين وعادى و القوانين فل الفل بتمر و كله فى السليم....<br />ومن ساعة ما لقيت الأزهر ساكت على البارات اللى بتنتشر فى كل حته فى مصر و ساكت على صناعة و تجارة الخمور و ساكت على الإعلام (العارى)....<br />ومن ساعة ما لقيت واحدة عايزانا نتسمى بأسامى أمهاتنا...ده حتى محصلش فى أمريكا...!!!<br />من الساعة دى....بطلت أحب مصر.... و غن شاء الله هاهاجر و أسيبها للناس اللى لسة عايزين يحبوها.... وابقوا ورونا بقى هاتعملوا فيها غيه (غير الكلام الحمضان طبعاً)...."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065020/http://masr.20at.com:80/article.php?sid=0"

[[comments]]
order = 204
subject = "هذا الموقع"
author = "من وجهة نظرى أن هذا موقع حكومى يعمل من أجل دراسات و إستطلاعات الرأى العام..."
posted = "2006-07-21"
text = "مفهوم طبعا لصالح مين...<br />وإلا ...القائمين على هذا الموقع يقولوا لنا ايه الفائدة من الآراء و التعليقات و الإستقراءات...؟! إذا كنتوا فعلاً عايزين الناس تحب مصر ما تسمحوش لحد يشتمها بشكل (مقنع) جداً على الموقع بتاعكوا...!!!!!<br />وبعدين مين بيمول موقع بالمستوى ده...؟! وايه مصلحته...؟! على قد ما أنا شايف ما فيش إعلانات تجارية على الموقع بالرغم إنه أكيد بيعمل Traffic عالى....<br />إلى كل من يشارك هنا...لا تقل رأيك بصراحة....فهم يحاربوننا بمثل هذه المواقع"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065020/http://masr.20at.com:80/article.php?sid=0"

