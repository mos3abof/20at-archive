text = "البلد كويسه واحسن من غيرها ايه يعنى اتخرجت ومش لاقى شغل ايه يعنى معييش فلوس ايه يعنى بنام من غير عشا ايه يعنى مش عندى لبس كويس ايه يعنى بستلف علشان اقعد على النت ايه يعنى شاب يكون عنده سكر وضغط .... ايه يعنى ان مصر متهرب فلوس خارجها حوالى 300 مليار دولار ايه يعنى الاغنياء يحترموا والفقراء ينداسوا ايه يعنى وايه يعنى وايه يعنى"
