subject = "بنحبها ونص"
author = "سارة نجيب"
posted = "2006-06-21"
text = "بصراحة مينفعش نقول اننا بنكره البلد دي يعني تجيبها كده تجيلها كده هي كده هتحبها يعني هتحبها بالذوق بالعافية ولو ادعيت انك مبتحبهاش طب قولي ليه كلنا حايلنا اكتئاب من اللي بيحصل فيها والحب ده بيكبر لو لو اتأكدت في نفسك حقيقة انه مصر ليست مصر مبارك وابنه وعيلته وحاشيته لا مصر للمصريين والبلد مش بلدهم ولا من حقهم يعملوا ما بدا لهم<br />المهم اليوم وبالحظ وبالصدف جوجل نشن حدف ودخلت الموقع ده يسلم ايدكم يا احلى ولاد بلد بجد جميل جدا وفكره رهيبه ان شاء الله يبقى في قمه المواقع :)<br />اجابة السؤال بس مقولتش ليه ايه الجايزة<br />ابن التيوس هو اللي شاف اللي بيحصل في البلد وقعد ساكت وقال زي هاني رمزي في وجهة نظر مفيش فايدة<br />شكرا على الموقع الجميل"
