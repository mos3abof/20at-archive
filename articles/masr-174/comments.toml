text = "انا كنت حاسس انه خلاص مفيش فايدة الشباب الى المفروض يغير البلد مغيبين عقله بنانسى وهيفا وما اشبه لكن لما لقيت موقعكم بالصفة حسيت بالأمل بيتولد من جديدوعلشان مطولش عليكم عندى اقتراح بس بعد ما انضم ليكم وهوان البلددى عمرها<br />ما هتتغير بانتخاباتطول ما على راسها الحزب الوثنى ليه احنا منعملش الأنتخابات دى عن طريق الموقع بحيث ان الديرة توسع اكثر من ال2_3 مليون منافق ومستفيد وموالس الى انتخب حسنى ليه منرشحش ناس متفق عل نزاهتها مثل القضاةو غيرهم او نعمل جمع تواقيع من المصريين الرافضين لحكم مبارك ونرسل به لقناة الجزيرة لتزيعه على الملأ واظن ده من الحلول العملية التى يمكن ان نستفيد منها فى احراج النظام الله يحرقة"
