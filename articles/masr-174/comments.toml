text = "انا اول مره ابعت لكم واود ان اكون مشارك مغاكو اى حاجه نتنفث فيها فى البلد دى بس ليه راى اى حد على موقعكوا المفروض ميشتمش على مصر بلدنا مهمه تكون احنا شباب بنتسامر مع بعض لكن لما نيجى للجدالواحد ميستحملش شتيمه على نفسه ودى بلدنا يارجاله المهم انا باحييكوا ع المجهود الجبار الى بتعملوه اود ان اكون مشارك معاكوا باى طريقه مهما تكون وانا فى الانتظار والسلام عليكم ورحمه الله وبركاته<br />ميدو المصراوى"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065020/http://masr.20at.com:80/article.php?sid=0"

