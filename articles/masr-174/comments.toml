subject = "بعشئك يا ام الدنيا"
author = "منار"
posted = "2006-05-28"
text = "انا فلسطينية من القدس, طول عمري بسمع عن مصر وسط كل الوضع الصعب اللي بنعيش في من ظروف بتعيشها بلدي... بحبها قوي وزرتها مرتين بسسس مشتقتلها قوي قوي قويي ...ونفسي ارجعلها تاني وبجد اول مرة زرتها حسيت بغيرة نفسي يكون عندي زيكم ارض حرة , وهوية تخصني, وعلم بلدي يدفيني.. ويا رب تفضل مصر دايما حرة يا رب..<br />بحبكووووووووووووووووووووو"
