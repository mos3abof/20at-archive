[[comments]]
order = 0
subject = "واحنا كمان"
author = "واحدة معدية"
posted = "2006-05-23"
text = "اهم ما فى الموضوع انك شرحت شوية هم يقاوموا الرقابة والاستبداد الحكومى فى الصين وغيرها ازاى، وعقبالنا بس اكتر من كده، نفسى شعبنا يستقل عن الحكومة ولا نبقى معاهم ولا ضدهم نخلق حياتنا فى بلدنا بعيد عنهم لغاية مايلاقوش لهم مكان، واول حاجة ممكن نبتدى بها بتهيألى هى صناعة نظم معلوماتية اهلية بعيد عن رقابتهم واستبدادهم واحتكار الشركات الامريكية .. ربنا يوفق اى حد بيفهم فى البلد دى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150318/http://www.20at.com/article2.php?sid=842"

[[comments]]
order = 1
subject = "عزيزي الاستاذ مصعب"
author = "عابر سبيل"
posted = "2006-05-23"
text = "الاستاذ مصعب لو من الممكن اذا تكرمت ان تزودني بمصدر علمي على الميل الخاص بي للرجوع اليه والاستزادة في هذا الموضوع، حيث اني اقوم بإعداد بحث اكاديمي في هذا الموضوع ولكم جزيل الشكر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150318/http://www.20at.com/article2.php?sid=842"

