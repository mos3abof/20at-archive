[[comments]]
order = 0
subject = "أثقل من جبل أحد"
author = "معتــز"
posted = "2006-05-17"
text = "إن القصر في حد ذاته ليس عيبا وحتى إن سيدنا عبد الله بن مسعود كان ضئيلا حتى كان الريح تتلاعب بقدميه إذا صعد النخل فقال النبي صلى الله عليه وسلم عن قدمه إنها أثقل من جبل أحد في الميزان يوم القيامة أو كما قال صلى الله عليه وسلم<br />لكن أكيد لو هناك أسباب علمية تؤدي إلى ذلك فياريت تعالج"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903172022/http://masr.20at.com:80/article.php?sid=335&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "ولله في خلقه شئون"
author = "نبيل علي خليفة"
posted = "2006-05-17"
text = "من منا يختار يوم مولده او والديه او حتى اسمه .<br />إن الله جل شأنه هو الخلاق العظيم يخلق ما يشاء فلا تجزع يا أخي ولا تحزن وكلا منا يسر لما خلق له .<br />مقاله ممتازة من صحفية المستقبل مع تمنياتنا لها بدوام النقدم والرقي ."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903172022/http://masr.20at.com:80/article.php?sid=335&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "يخلق الله ما يشاء"
author = "سهام"
posted = "2006-05-18"
text = "بسم الله الرحمان الرحيم<br />دائما نرى انا القصير لا يحب ان يكون صديقا لطويل ونفس الشىء بالنسبة لطويل وتكون معاملتهم محدودة فيما بعضها<br />ولكن من راي ان الاخلاق هي التي تحكم ليس قصير القامة اوالطويل"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903172022/http://masr.20at.com:80/article.php?sid=335&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "كله بقى عادى فى عهد حسنى بيه"
author = "catch me if you can"
posted = "2006-05-19"
text = "الواحد مبقاش مستغرب من اى حاجه يسمعها لان بقى دا عادى فى عصر المعجر حسنى بيه والاولاده المفروض يكت فى المطار على باب مصر يعنى جمهوريه حسنى وشركاه القصر والطول دا حاجه بتاعت ربنا بس اكيد فى عوامل الميه الملوثه والاكل الى شغالين نطحن فيه دا<br />وربنا ياخدك بالى فى بالى"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903172022/http://masr.20at.com:80/article.php?sid=335&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

