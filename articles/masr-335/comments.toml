[[comments]]
order = 5
subject = "ايه ذنبي ايه .. انا قصير كدة ليه"
author = "رضوى نبيل"
posted = "2006-05-25"
text = "ليس عيب ان اكون قصيرا لكن العيب ان اخجل يوما لاني قصير ،واي حزن منك او خجل لكونك قصير القامة يكون اعتراض على امر الله وهذا اكيد يا اخي ما لا ترضاه . مقاله اكثر من رائعة ، مع تمنياتي بالتوفيق للصحفية هايدي نبيل."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903172022/http://masr.20at.com:80/article.php?sid=335&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

