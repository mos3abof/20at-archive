subject = "الناس بقت هايفة جدا"
author = "ايما"
posted = "2006-06-15"
text = "النس بقت هايفة طول ايه وقصر ايه المهم النفس والاخلاق والشخص الناس بتتعامل معر روح شخصية مش طويل وقصير ونبى انتوا ناس فاضية فعلا الغرب ليهم حق يدوسوا علينا بالجزم لاننا ناس هايفة ومظهرية"
archived = "2006-09-03"
