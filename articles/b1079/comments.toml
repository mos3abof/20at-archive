subject = "رائع وإلى الأمام"
author = "ابن الخليج"
posted = "2006-07-16"
text = "أختى \"هبة الله\" موضوعك جميل جداً لكن هل من الصحيح أنه يمكن أن تأسلم الحياة بدون تعقيد؟<br />وإذا حدث ذلك هل هو صحيح؟ وإن لم يكم فما هو الشي المفترض ان يحدث؟<br />ويبقى السؤال: هل الحياة هي الأساس؟ أم الإسلام؟<br />اتمنى من الجميع المشاركة؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123524/http://www.20at.com/article2.php?sid=1079"

