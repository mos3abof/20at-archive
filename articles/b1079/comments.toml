[[comments]]
order = 2
subject = "حتى الدعاة"
author = "سارة"
posted = "2006-07-16"
text = "هودة اللى مرجعنا لورة طول محنا هنبقى كدة هنبقى متخلفين اكتر واكتر يعنى اعدين متمدحوا فى المغنين والممثلين وحين على الدعاة وتقولوا ان موضيعهم متككرة وانهم بقوا فى كل القنوات لحد مباينا نمل منهم دة كلام شيطانى انا بس بقول للى قالوا كدة اتقوا للة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123524/http://www.20at.com/article2.php?sid=1079"

[[comments]]
order = 3
subject = "حتى الدعاة"
author = "سارة"
posted = "2006-07-16"
text = "تانى حاجة يا استاذة هبة مش المفروض انك تتكلمى عن الموضوع بالطريقة دى او بمعنى اصح بالطريقة السطحية دى انا نفسى افهم يعنى اية الكلمة اللى انتى قولتيها (عجائز الدعاة) اظن انها كلمة وحشة اوى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123524/http://www.20at.com/article2.php?sid=1079"

