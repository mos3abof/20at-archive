subject = "منطق ساذج أو سذاجه غير منطقية"
author = "عابر القارات"
posted = "2006-04-13"
text = "أرجو أن أفهم شيئين محيرينى جدا .. أولهما أن الصحفيين ينتظرون الفرج القريب على يد ما أسموه \"وعد\" الرئيس و سؤالى هو ما هو هذا الوعد و هل الحرية و الديمقراطية تحتاج الى وعد!! و كأنكم تصورون الرئيس و كأنه إله يمنح و يمنع فإذا وعد فلتهلل السماء و لترقص الارض و لتزغرد أم عبده ... يا إخوانى الصحفيين لماذا تستجدون ما هو حقكم و حق حتى من هو لا يعمل بمهنة البحث عن المتاعب و أقصد المواطن البسيط الذى من حقه أن يشتكى و يرفع صوته إذا رأى حقه يسلب أو رأى لص ينقض على ماله أو مفسد يعيث فى الارض فسادا متجبر بحصانه أو بمنصب .... الشئ الثانى الذى لا أفهمه عندما يظهر فاسد فى أى مؤسسه صحفية لماذا كل سنين الصمت حتى ينفضح أمره بعد أن أهدر و حول و وهب و سهل الاستيلاء على مليارات الشعب المطحون الغلبان الذى إذا حسبت ما سلبه المفسدون خلال فقط العشرون عاما الماضية لأذهلتكم روعة الصدمة لأن على الأقل كنا قد غطينا جزءا من ديوننا المتلتلة فلماذا لم يرتفع صوتكم عندما رأيتم اللص و الذى ينتمى أليكم يسرق و ينهب متجبرا بأنه رئيس أحد المؤسسات الصحفية الكبرى!! لماذا ترقعون أصواتكم الأن مطالبين بمزيد من الحرية فى التعبير ألم يكن الأجدر بكم أن تكشفوا السرقة المكشوفة عينى عينك أصلا للغفير قبل الوزير !!! .... مجرد أسئلة تحيرنى"
