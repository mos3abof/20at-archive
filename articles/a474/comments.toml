text = "عجبي فعلا على راي صلاح جاهين<br />يا ابن الحلال منك له<br />تجاهلتم فتاوى كبار العلماء ممن لهم اثرهم واحترامهم<br />ولو بحثتم وراء الفتاوى لوجدتم اسانيد من القران والسنة !!!!!!<br />مش واحد يقوللي قلبي وعقلي !!!<br />ونسي ان هذا يسمى الهوى<br />لا ينطق عن الهوى ان هو الا وحي يوحى !!!<br />اذا كنت متخبطا ومحتارا بعقلك وقلبك وجاءك الحق فهل تنكره علشان قلبك مش مطاوعك ولا عقلك مش مستوعب !!! ثم مين قال لك انها شهادة اصلا !!! هي الشهادة كده سبهللة !!! ملهاش قواعد ولا شروط !!!<br />كل واحد قاعدلي على كيبورد ييجي يخترعلنا اسلام جديد !!!"
