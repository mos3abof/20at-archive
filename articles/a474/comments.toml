text = "أخي الفاضل المحرر<br />جميع الوصلات اللتي ذكرتها هي لموقع اسلام اونلاين<br />وهذا الموقع غير محايد ولا يعرض كل الاراء<br />والموقع تموله مشيخة قطر والشيخ القرضاوي وانت سيد العارفين والعارف لا يعرف<br />كنت اتمنى اضافة مزيد من الوصلات لمواقع مختلفة باراء مختلفة حتى يكتسب الموضوع المصداقية وليس احادية النظرة<br />لاحظ ان كل الفتاوى نسخة كربونية لفتوى القرضاوي اللذي لن ينشر الموقع طبعا فتوى تعارضه !!! والا التمويل يضيع عليهم ..."
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814125748/http://www.20at.com:80/article.php?sid=474"

