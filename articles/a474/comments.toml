text = "الأخت نونا المجنونة<br />بارك الله فيك<br />على شعورك الطيب بالنتماء لدينك<br />و جزاك الله خيرا على النصيحة<br />ولكن لي تعقيب<br />أولا : الحديث الذي قلته صحيح<br />ثانيا : أنا لا أسخر من ديني<br />و إنما هو كلام غير مباشر لتوضيح فكرة معينة<br />و لا يجوز لأي فرد مهما بلغ شأنه ان يسخر من دينه<br />أو نبيه صلى الله عليه وسلم"
