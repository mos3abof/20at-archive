[[comments]]
order = 3
subject = "مصـ( الخير )ـعب"
text = "السلام عليكم و الرحمة<br />و الفراخ و اللحمة<br />المهم ...<br />أنا أول مرة أفرح كده<br />أخيرا لقيت حد بيشجع الجماعة!!<br />قال رسول الله ( ص ) :<br />\" من أراد بحبوحة الجنة فليلزم الجماعة\" ...<br />بتقولوا ايه؟!<br />ايه؟!!!<br />الانتحار حرام!<br />ما هو أصلووووو..<br />يا ناس ماتدقوش بقى<br />مش هاتفرق<br />الدين يسر برضه<br />المهم انه جماعة<br />مش كده وللا ايه<br />كان معكم عبر الأثير:<br />\" الإمام البحبحاني بن بحبوحة\"<br />مؤلف كتاب :<br />\" الماحي في جميع النواحي \"<br />و صاحب القاعدة الفقهية:<br />\"سيبك انت وخلي عنك خالص\"<br />مع تحيات المهندس بن عمير<br />مهندس العمليات المستحيلة!!!"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814125748/http://www.20at.com:80/article.php?sid=474"

[[comments]]
