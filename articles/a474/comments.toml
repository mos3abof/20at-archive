subject = "نونا المجنونة"
text = "سلام عليكم يا جماعة<br />اخ مصعب يعني اتريقت علي سلام ربنا و اتريقت علي حديث انت الي كاتبة والله شاكة انه حديث اصلا<br />نهرج ماشي بس مش في دينا و كمان تحية الاسلام عيب نعمل فيها كده<br />ده انت بتزعل لو حد لتريق عليك تقوم تتريق علي تحية الاسلام و كلام الرسول عليه الصلاة و السلام؟؟؟؟؟؟؟؟"
