subject = "مصـ( الخير )ـعب بجد المرة دي"
text = "يا \" فلسطيني \"<br />العلماء اللي حضرتك كتبت أسمائهم<br />على عيننا و راسنا من فوق<br />و لكن انتوا ليه دايما معتبرين ان هم دول<br />العلماء الوحيدين في العالم؟!<br />دول بيمثلوا تيار واحد فقط من التيارات العاملة<br />للإسلام , وليس كل التيارات<br />و دي قصة التعليقات لوحديها مش هتكفيها<br />لأنها قصة كبيرة جدا<br />و اللي انت قلت عليهم غلماء<br />\" بيقولوا فتاوى مبيحة \"<br />علماء ليهم وزنهم برضه<br />و بعضهم لا يمثل أي تيار<br />و بعضهم بيمثلوا تيارات أخرى<br />و ما ينفعش نقتنع بفكرة :<br />\"الرأي هو ما أرى<br />و الباقي على ضلال و<br />هالك ومخلد في النار\"<br />برجوا منك يا أخ \" فلسطيني \"<br />تروح تراجع ألف باء العلوم الشرعية مرة أخرى<br />و بالذات \" فقه الاختلاف \"<br />و \" شروط الاجتهاد \"<br />و \" من تجوز له الفتوى \"<br />و اتق الله فيما تكتب!!!<br />ترقبوا البيان التأسيسي للحلف الالكتروني الفظيع!"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814125748/http://www.20at.com:80/article.php?sid=474"

