[[comments]]
order = 43
subject = "كده برده يا ياسمين!!!!!"
text = "الحقيقة يا جماعة ركن التعليقات انقلب إلى ساحة حوار و أدى الى إنقسامات كثيرة نحن في غنى عنها, فنحن الآن نتطرق لمواضيع و قضايا أخرى تماماً.<br />الموضوع أساساً كان بيتكلم عن الإنتحار الجماعي فجأة الموضوع إتقلب إلى العمليات الإستشهادية أو الإنتحارية ( في رأي الأخ فلسطيني ) و دخلنا في فتاوى لشيوخ و علماء السعودية المتشددين و هي كما ذكر قبل ذلك إتجاه لمدرسة واحدة فقط للفقهاء .<br />يا جماعة المفروض التعليق بيكون متعلق بالموضوع مش أي كوسة, الأراء اللي عرضتوهاجيدة مع إني بعارض طريقة المخاطبة و أسلوب الكلام اللي بتوجهوه لبعض, إحنامش في مجلس الشعب!!!<br />بس طبعاً أن بضم صوتي لهذا الحزب الجديد!<br />و بعدين كتر خيرك يا ياسمين, كان مالها المواضيع الحلوة بتاعة الموضة و الديكور و الذي منه...جميلة و زي الفل, و لا عاجبك كده إللي حصل بين الناس!!!<br />تعملي موضوع زي ده و تسافري و لا من شاف و لا من دري!<br />أنا خايفة تعملي موضوع ( كيف تنتحر جيداً ؟!) بعد رسائل المنتحرين و الإنتحار الجماعي, مين عارف ؟؟؟؟؟!"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814125748/http://www.20at.com:80/article.php?sid=474"
