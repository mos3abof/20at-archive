subject = "مصـ( الخير )ـعب"
text = "تحياتنا للمعلم الكبير بيرو<br />و احنا تلامذة سعادتك في التعليقات<br />و ربنا يكرمك ويخليك للأمة العربية<br />و ما يحرمناش من عشرينات اللي جمعنا<br />بسعادة سيادة باش حضرتك يا فندم<br />تابعك المطيع<br />مصـ( الخير)ـعب<br />مهندس العمليات المستحيلة"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814125748/http://www.20at.com:80/article.php?sid=474"

