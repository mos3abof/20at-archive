subject = "بيرو"
text = "إنتحار جماعي .....!!!!<br />يا سلام عليكي يا ياسمين ده أنت المفروض تاخدي نوبل في وسائل إنقاذ الشعوب ...<br />إنتحار جماعي يا سلام يا جدعان ...أخيرا لقيتها....<br />هو ده الحل ....هو ده الطريق,,,,<br />موش هوه المهم ان المنتحرين يكونوا مجتمعين علي شيء واحد....<br />الناس اللي في بالي مجتمعين علي أتنين .....<br />1- ظالمن قوي<br />2- الناس كلهااااااااااااااا بتكرهم جدا<br />نصيحة مني ليهم جربوا الانتحار الجماعي ...<br />حل مفيد ولذي ومرضي ....لينا علي الاقل...<br />ياتري عرفتوا انا بتكلم عن مين....<br />حكام الدرجة التالتة طبعا ......!!"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814125748/http://www.20at.com:80/article.php?sid=474"

