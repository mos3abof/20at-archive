[[comments]]
order = 20
subject = "الحلف الالكتروني الفظيع..................... مصـ("
text = "مستر \" فلسطيني \"<br />كيف تتجرأ على علماء المسلمين<br />و تصف فتاواهم بالـ\"مبيحة\" ؟!<br />يا جماعة التفجيرات الاستشهادية<br />شرعاً سليمة مائة بالمائة..<br />و في نقطتين عاوز أقولهم:<br />(1) يقول تبارك وتعالى في آخر آية من سورة العنكبوت:<br />( و الذين جاهدوا فينا لنهدينهم سبلنا وإن الله لمع المحسنين )<br />العنكبوت : 69<br />يعني يوم ما الدنيا \" تعصلج معانا\" و علماء<br />الإسلام يبقوا محتارين في أي أمر من أمور الفتوى<br />نسأل الناس دي لأنها هي اللي بتجاهد في الله<br />(2) الناس اللي صعبان عليها \" المدنيين الإسرائيليين\"<br />هسالهم سؤال:<br />انت و عيلتك تعملوا ايه مع العيلة اللي جنبكو لو<br />جاءت و خدت منك بيتك بالعافية و بيحاولوا يطردوك منه<br />مع العلم ان مش كلهم بيحاربوا , بعضهم جاي يقعد بس<br />و هو عارف ان ده حقك ؟<br />ها , يعني ما جاوبتونيش!<br />على العموم سلام<br />ترقبوا البيان التأسيسي<br />للحلف الالكتروني الفظيع........!!!!!!!!!!!"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814125748/http://www.20at.com:80/article.php?sid=474"

[[comments]]
order = 21
subject = "فلسطيني"
text = "صف اسرائيل ؟؟؟<br />مين اللي في صف اسرائيل ؟؟؟<br />انت اكيد مش انا !!!<br />قبل ما تكتر في الكلام انت او غيرك ونحاوب تعمل ارهاب فكري ومانشوفشي وشك والكلام الفارغ ده اقرا لو سمحت:<br />فتوى ابن عثيمين :<br />فأما ما يفعله بعض الناس من الانتحار بحيث يحمل آلات متفجرة ويتقدم بها إلى الكفار ثم يفجرها إذا كان بينهم ، فإن هذا من قتل النفس والعياذ بالله . ومن قتل نفسه فهو خالد مخلد في نار جهنم أبد الآبدين كما جاء في الحديث عن النبي صلى الله عليه وسلم . لأن هذا قتل نفسه لا في مصلحة الإسلام لأنه إذا قتل نفسه وقتل عشرة أو مئة أو مئتين لم ينتفع الإسلام بذلك فلم يُسْلِم الناس بخلاف قصة الغلام وهذا ربما يتعنت العدو أكثر ويوغر صدره هذا العمل حتى يفتك بالمسلمين أشد فتك . كما يوجد من صنع اليهود مع أهل فلسطين فإن أهل فلسطين إذا مات الواحد منهم بهذه المتفجرات وقتل ستة أو سبعة أخذوا من جراء ذلك ستين نفراً أو أكثر فلم يحصل في ذلك نفع للمسلمين ولا انتفاع للذين فجرت المتفجرات في صفوفهم . ولهذا نرى أن ما يفعله بعض الناس من هذا الانتحار نرى أنه قتل للنفس بغير حق وأنه موجب لدخول النار والعياذ بالله وأن صاحبه ليس بشهيد<br />فتوى الشيخ عبدالعزيز آل الشيخ مفتي السعودية :<br />أما ما وقع السؤال عنه من طريق قتل النفس بين الأعداء – أو ما أسميته بالطرق الانتحارية - : فإن هذه الطريقة لا أعلم لها وجهاً شرعياً ، ولا أنها من الجهاد في سبيل الله ، وأخشى أن تكون من قتل النفس ، نعم ؛ إثخان العدو وقتاله مطلوب ، بل ربما يكون متعيناً ؛ لكن بالطرق التي لا تخالف الشرع<br />فتوى الشيخ صالح الفوزان :<br />لا يجاهد المسلمون إلا إذا كان لهم قوة فإن النبي قد نهى عن القتال في مكة لأنهم لو جاهدوا في مكة وهم في ضعف سُحِقوا بأيدي أعدائهم - أَلَمْ تَرَ إِلَى الَّذِينَ قِيلَ لَهُمْ كُفُّوا أَيْدِيَكُمْ<br />فتوى الالبانى :<br />العمليات الانتحارية حرام لأنها مغامرة بالحياة<br />ويقول الشيخ العثيمين ردا على من يستشهدون بقصة الغلام :<br />إن من المعلوم أن الذي تسبب في قتل نفسه هو هذا الغلام لا شك ، لكنه حصل بهلاك نفسه نفع كبير آمنت أمة كاملة ، فإذا حصل مثل هذا النفع فللإنسان أن يفدي دينه بنفسه ، أما مجرد قتل عشرة أو عشرين دون فائدة ، ودون أن يتغير شيء ففيه نظر بل هو حرام ، فربما أخذ اليهود بثأر هؤلاء فقتلوا المئات والحاصل أن مثل هذه الأمور تحتاج إلى فقه وتدبر ونظر في العواقب وترجيح أعلى المصلحتين ودفع أعظم المفسدتين ، ثم بعد ذلك يقدر كل حالة بقدرها<br />العثيمين :<br />في إجابة له على سؤال حولَ رأيه في العمليات الانتحارية «رأيي في هذا أنه قاتل لنفسه، وأنه سيعذب في جهنم بما قتل به نفسه، كما صح ذلك عن النبي صلى الله عليه وسلم، لكن الجاهل الذي لا يدري وفعله على أنه فعل حسن مرضي عند الله أرجو الله سبحانه وتعالى أن يعفو عنه لكونه فعل هذا اجتهادا، وإن كنت أرى أنه لاعذر له في الوقت الحاضر لأن هذا النوع من قتل النفس اشتهر وانتشر بين الناس، وكان على الانسان أن يسأل عنه أهل العلم، حتى يتبين له الرشد من الغي. ومن العجب أن هؤلاء يقتلون أنفسهم مع أن الله نهى عن ذلك وقال (ولا تقتلوا أنفسكم إن الله كان بكم رحيما). وكثير منهم لا يريدون إلا الانتقام من العدو على أي وجه سواء كان حلالا أو حراما، فهو يريد ان يشفي غليله فقط، أو يروي غليله، ونسأل الله أن يرزقنا البصيرة في دينه والعمل بما يرضيه إنه على كل شيء قدير<br />الشيخ عبد المحسن العبيكان :<br />منذ زمن وأنا أفتي بتحريم العمليات الانتحارية وليست الاستشهادية كما يسميها البعض فهي تسمية خاطئة، وثار حينها الكثيرون، ولكنني ما زلت متمسكاً برأيي بأن مثل هذه العمليات محرمة، ولا توجد أدلة تؤيدها لا من كتاب ولا من سنة. فهذه النفس يملكها من خلقها فكيف يُقدم المرء على قتل نفسه برغم الآيات الواضحة (ولا تـقتـلوا أنفسكم). وقوله تعالى (ولا تلقوا بأيديكم إلى التهلكة). علماً بأن الجهاد من العبادات، والعبادات توقيفية، الأصل فيها الحظر والمنع إلا مادلّ دليل صريح على مشروعيته، ولم يكن هناك دليل على تلك المشروعية وإنما الأدلة التي ذكرناها تمنعه<br />محمد ناصر الالبانى :<br />العمليات الانتحارية في الزمن الحاضر الان كلها غير مشروعة وكلها محرمة اما ان تكون قربة يتقرب بها الى الله فهي ليست اسلامية اطلاقا<br />الشيخ صالح الشيخ :<br />الوسائل لها احكام المقاصد بشرط ان تكون الوسيلة مباحة. ليست كل وسيلة تصل الى المقصود تبيح المقصود و نقول هذا باطل لان هذه الوسيلة باطلة. وهناك وسيلة تخترعها العقول لتبرر الغايات وهذا خطأ. نخشى ان يكون المنهج التكفيري يمشي في الناس<br />الشيخ الالبانى :<br />المسلم لا يصل اليه الامر ان يفكر في الانتحار فضلا على ان ينفد فكرة الانتحار. فمن ينتحر هذا بالغالب لا يكون مؤمنا ولا نقو<br />Read the rest of this comment..."
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814125748/http://www.20at.com:80/article.php?sid=474"

