text = "نسيتوا كمان الانتحار الجماعي الفلسطيني حيث ينتحر الفلسطيني بتفجير نفسه احيانا بدون ان يقتل حتى معزة ثم تاتي اسرائيل فتهدم بيته وبيت اهله والبيوت اللي جنبهم كمان على اللي فيها وده الانتحار الجماعي ايضا باسم الدين الاسلامي حاشا لله وما نسمعشي غير الفتاوى المبيحة للانتحار فقط على انه جهاد مع ان فيه فتاوى اخرى تحرم هذا النوع من الجهاد للالباني والفوزان والعثيمين والعبيكان لكن دي ما بتتسمعشي ......"
