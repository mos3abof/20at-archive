[[comments]]
order = 7
subject = "حسبنا اللة ونعم الوكيل"
author = "جند الاسلام"
posted = "2006-11-18"
text = "السلام عليكم اولا ثم ربنا يكون في عون المسلمين لانهم هم المقهورين بس هم الي بيعتقلهم هم الي مش لقي ياكلو هم الي مش لقين شغل ولا مسكن هم ال المظلومين في دولة يطلق عليها دولة مسلمةعلي فكرة اخر احصائية للبطالةبتقول اني نسبة البطالة عند المسلمين 80 في المية اما الضالين فلا توجد عندهم بطالة اساسادة حرام حرام يبقي المسلمين مش لقين ياكلو والمليارات بتصرف علي الكورة والفنانين والمطربين وغيرها من سفاسف الامور ربنا ينتقم منة رئيس العصابة اللامبارك ويعذبة دنيا واخرة زي اما معذب المسلمين ومضيعه مواخيرا حسبنا اللة ونعم الوكيل"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095336/http://masr.20at.com:80/article.php?sid=1174"

[[comments]]
order = 8
subject = "طظ فينا .."
author = "إبن بهية"
posted = "2006-11-18"
text = "يا خرابي .. يا لهوووي .. كل ده ؟؟؟ دي عبارات ممكن نسمعها من حبايبنا النايمين في العسل وبيقروا جرايد الحكومة وبيتفرجوا على تليفزيون عمو صفوت (أيوه مازال تليفزيونه حتى لو رحل .. وفاء منا يا أخي .. انته مالك؟) طبعاً قضية كل دقيقتين دي والخمسين مليار ده كله في الهجايص .. يعني ده اللي ظاهر للعيان والعميان وما خفي في بطن الحوت أفظع وأنكى .. طبعاً الحوت (حسونة بركوته) اللي بيصرح قال ويقولك سيحاسب ويعمل وينيل .. يا عم اتلهي حاسب نفسك انته الأول وقلنا المليارات اللي متربع بيها إنته وعيلتك دي في تصنيف أغنى أثرياء العالم جاتلك منين ؟؟؟ من المعاش اللي سابهولك عم مبارك كاتب المحكمة أبوك يا واطي ؟؟؟ وجدو يا جيمي .. أظن مش محتاج يا جيمي تعمل الحبتين بتوعك دول للناس عشان تحسسهم إنك واحد منهم .. يعني بلاها سواقة العربية في مصر الجديدة والوقوف في إشارات المرور زي الغلابة .. بلاش يا بني أحسن ولد من أولاد بهية يهفك عيار يجيب أجلك .. أنا مش خايف عليك طبعا حشا وكلا .. أنا بس خايف على الولد الغلبان اللي هيطخك أحسن يحسبوك عليه راجل .. قصده .. كفاية يا جيمي تعرف الناس بتاريخ جدك الطويل في النضال أمام المحاكم لكتابة عرض حال دمغة بقرش صاغ لأي واحدة عايزة نفقة ولا طلاق .. ولا أبوك الواطي ما بيجيبش سيرة جدو قدامك خالص ؟؟؟ طبيعي لأنه واطي وناسي أصله ..<br />بقى بذمة المسلمين والنصاري واليهود وحتى السيخ والهندوس وعبدة أبوالهول والهرم حد يصدق أن حسني الواطي إبن عم مبارك كاتب المحكمة العدمان الغلبان اللي كان بيكمل عشاه نوم يبقى معاه المليارات دي ؟؟؟ طيب منين ؟؟؟ من مرتبك يا واطي ؟؟؟ فهمنا منين .. لا عيلة ورثتها ولا شركة سابهالك الوالد ولا حتى كشك بيبيع خرده زي أحمد عز اللي عايز يفهمنا رغم أنف العالم أن مليارات<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095336/http://masr.20at.com:80/article.php?sid=1174"

[[comments]]
order = 9
subject = "يا ولاااااااااد الللللبوبيييييي"
author = "مواطن حقود أبوالفقر"
posted = "2006-11-19"
text = "أنا دكتور بشرى بعالج البشر اللي في الشعب (قصدي دكتوراللي ما يستهلوش) باخد في الشهر 250 جنيه بالحوافز و الذى منه و باخد في الليلة اللى با أبيتها في المستشفى 8 جنيه...طيب ايه اللى ناقصني بقه علشان ابقى مش مبسوط....رحت أشتري جاكت للشتاء لقيته ب 300 جنيه... يعني مرتب 40 يوم...سهلة...ولغيت فكرة الجزمة..و البلوفرات و الحاجات دي... هل تفتكروا اني زعلان... لأ يا جماعة لأنا هاتنقط بس...لما يبقى حال الدكاترة كده أمال بقيت الناس ايه... و نستثني وكلاء النيابة و الميكانيكية و السمكرية لأنهم خرجوا من دائرة الفقر... الميزان مقلوب.... يا ريتني كنت سعد الصغير أو حتى بياع العنب... و يا ريت مراتي دينا...مش هوه ده اللي ماشي ...احنا شعب حقير و متخلف و نستاهل اللي بيجرالنا ..خلاص بقه ما تتكلموش يا كلاب."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095336/http://masr.20at.com:80/article.php?sid=1174"

[[comments]]
order = 10
subject = "ماشي بدون قدم"
author = "ماشي بدون قدم ...مسنود علي العدم"
posted = "2006-11-19"
text = "Thursday, November 16, 2006<br />الساعة الحادية عشر قبل منتصف الليل<br />أنظر بملل الي كل ما حولي في الغرفه<br />كل شيء حولي يبعث على الاكتئاب<br />او هذا على الأقل ما أشعر به<br />ربما لو كنت معي لأختلف الأمر كثيرا<br />أحاول أن أوجدك في أي شيء من حولي<br />لأقاوم ذلك الشعور الممض بالأفتقاد الذي يسيطر علي<br />فاتذكر كلماتك . .. ابتسامتك ..عيناك ..لاتعزى بهم قليلا<br />فاجد انني بالرغم مني قد زدت من شعوري بالحنين اليك<br />ثم يحدث أجمل ما قد يحدث لي في يومي كله<br />حيث استطيع ان اصل اليك و تصل الي<br />و نتحدث قليلا<br />تتحدث الي بكلماتك التي تتخلل روحي<br />و تلمسني من رأسي الي أخمص قدمي<br />و تنقلني بها الي عوالم اخرى غير ذلك العالم<br />الذي أجبرنا فيه على الا نكون معا<br />أتخلص من رتابة يومي وخمود روحي<br />لأخلق نفسي في الف عالم لا يربط بينهم<br />شيء سوا أننا معا دائما<br />فأكون مرة أميرة من القرون الوسطى و تكون انت ملكي<br />مرة اخرى أصبح سندريللا و أنت الامير الثري الذي<br />سيبحث عني و يجدني لنعيش معا في سعادة أبديه<br />بل أخذتني في مرة أخرى على جوادك و أنطلقنا معا<br />وسط الخضره و انا احتضنك مستمدة منك الأمان<br />بينما الهواء يداعب وجهي<br />أدرك لسويعات قليلة معنى أن أستمد الأمان منك<br />و أن أكون أقوى بك<br />و أن أرى نفسي أجمل و أذكى ..<br />بعدما كنت أراني بائسة جديرة بالشفقة<br />أن يتخلل الحماس الي روحي اليائسة<br />فيصبح لي<br />مئات الاحلام<br />و تواتيني الآف الأفكار<br />تبتدأ و تنتهي و أنا معك<br />تلك الرغبه في الحياة ..<br />معك و بك و لك<br />و لكن ينتهي كل هذا سريعا<br />لأجد نفسي مرة أخرى وحدي دونك<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095336/http://masr.20at.com:80/article.php?sid=1174"

