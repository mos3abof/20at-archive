[[comments]]
order = 2
subject = "عن أية مليارات مهدرة"
author = "الفلاح الفصيح"
posted = "2006-11-17"
text = "الحقية أنكم دائما معش السادة تنظرون للجانب المظلم من الموضوع<br />يأيها السادة ألم يكن يجدر بكم أن تقيموا الأفراح وتحتفلوا بأننا فى المركز ال73 وليس فى المركز الأول يأيها السادة توجد 72 دولة قبلنا فى هذا المدمار<br />المهم يا ناس إحمدوا ربنا وإشكره هو فيكم حد بينام من غير عشاء ياناس إتكسفوا على دمكم أيه يعنى كام مليار إتسقت وإنتم مال أهلكم هى كانت بلد أبوكم ولا كانت بلد أبوكم<br />هو الرئيس مش محتاج يعيش هو والحاشية بنت ........<br />إلا حواليه أيه يعنى عمر أفندى تم تقيمه بمليار وإتباع بنص مليار أيه يعنى هو نص مليار هتزعنا من الرئيس وأولاده والحاشيه إلا حواليه<br />أيه يعنى مليارات سرقت من البنوك أيه يعنى مقتل 1200 مواطن غرقا على يد صاحب العبارة الأشهر ممدوح إسماعيل لطالما أنه قد دفع التعويضات الواجبه طيب بالله عليكم يا نكار الجميل هو الواحد منهم لو عاش قد ماعاش كان هيجيب 300 ألف جنيه يا عالم عيب عليكم<br />هو أنتم جاحدين النعمة ليه لنقارن أنفسنا ببنجلاديش ألسنا أحسن منهم وإرتريا والصومال<br />المهم يا جاحدين إتقوا الله وأدعو لعمى حسنى الله يهديه ويبارك فيه ويخليه لنا هو وإبنه الرئيس القادم ."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095336/http://masr.20at.com:80/article.php?sid=1174"

[[comments]]
order = 3
subject = "وايه يعني تعالوا اتفرجوا على المهازل في دمنهور"
author = "عبقرينو"
posted = "2006-11-17"
text = "عندنا في دمنهور تم هدم ميدان الساعة في وسط البلدوالذي لم يمر على انشائه عام واحد بتكلفة 2 مليون جنيه للبناء و الله أعلم كم للهدم وتم استبدال اعمدة كهرباء وكابلات بقيمة 120 مليون جنيه في شوارع رئيسية كانت منورة اصلا و مش محتاجة استبدال و تدخل السيد المحافظ (لواء أمن الدولة سابقا) عادل لبيب في خطة مشروع تجديد شبكة المياه بدمنور ليخربها و يدمر كل الخطط الموضوعة رغم عدم وجود تمويل كافي و قام بتدمير أسفلت المدينة بدون وجود ميزانية للرصف ثم تركها مفتوح بطنها ليبدأ رحلة تخريب جديدة في الإسكندرية و أهو مال مالوش صاحب"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095336/http://masr.20at.com:80/article.php?sid=1174"

