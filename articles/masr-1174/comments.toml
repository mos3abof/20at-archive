order = 0
subject = "لك الله يا شعب مصر"
author = "توتى"
posted = "2006-11-16"
text = "لك الله يا شعب مصر فان خيرات البلد يتحكم فيها ساكنى قصر العروبه و كبار المسئولين عفوا الناهبين<br />اما الشعب الغلبان فيزداد فقرا على فقر و هما على هم<br />و اذا ضاقت بك الدنيا لا تقل يارب عندى هم كبير بل قل يا هم لى رب كريم<br />فليرحمنا الله برحمته و ليعجل بالفرج اللهم امين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095336/http://masr.20at.com:80/article.php?sid=1174"

