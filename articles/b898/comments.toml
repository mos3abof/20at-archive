subject = "ردا على المعاق ذهنيا ونفسيا المصري"
author = "كلمة حق"
posted = "2006-06-05"
text = "انت متخلف والموضوع في زاويه وانت في زاويه اخرى فقط انت احببت تسجل حقدك وكرهكاعمل في بلدك ولا تعتمد على الاخرين لو كنت مرغوبا فيك ومرحبا بك وكنت تحمل مؤهلا محترما وعلما نافعا لاكرموك وكرموك لكنك عاله نكره متسول اكيد راح تهان وتطرد كالكلاب وطظ فيك وفي اللي يتحمسلك من الحاقدين والخونه امثالك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144325/http://www.20at.com/article2.php?sid=898"

[[comments]]
order = 1
subject = "أحمد تحياتي القرمزية وأصدق امنياتي"
author = "summer"
posted = "2006-06-05"
text = "أولا احترام أدبيات الحوار امر مهم جدا ثانياالتهجم على السعودية دائماعادة من لم يتشرفوا بالانتساب عليها<br />واتمنى من الاخ المصري عدم التدخل فيما لايخصه او التطاول على اهل السعودية وان يكتفي بالنظر في عيوبه ولسانه<br />واصلا احمد العمودي اصدق منك لانه قدم خبر موثوق المصدر وانت تتحدث من بنات افكارك<br />عموما الى الامام (((أحمد)))ولاتهتم باشباه الناس فمواضيعك رائعة وجذابة ومعبرة<br />ويكفي ان اهل بلدك يحبوك ويقدروك واما غيرهم فهم احرار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144325/http://www.20at.com/article2.php?sid=898"

[[comments]]
order = 2
subject = "من مصر للأخوه السعوديين"
author = "الفارس العربى"
posted = "2006-06-05"
text = "أحب ققول أن فى واحد حاقد فوق ومتخلف معلق على الخبر تعليق سخيف وبعدين الأخوة اللى علقوا على الخبر بيقولوا انه من مصر ...! مع انى قاريت التعليقات ولم اجد اشاه الى بلدة واحنا فى مصر بنحب اللأخوه اللى فى السعودية لعدد اسباب<br />الحب فى اخوة الأسلام<br />أهل بلد الرسول الكريم صلى الله عليه وسلم<br />بلد الحج والعمرة<br />دمائنا واحده<br />يعنى مش لازم نسب بعض على النت<br />ولا ققول<br />فى ما يبدوا ان هذا الذى يحدث فى أجتماعات الجامعة العربية ووزراء الخارجيى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144325/http://www.20at.com/article2.php?sid=898"

[[comments]]
