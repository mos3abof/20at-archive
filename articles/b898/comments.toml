[[comments]]
order = 4
subject = "اهل العقول براحه"
author = "ابو عبد العزيزـ السعودية"
posted = "2006-06-06"
text = "بسم الله الرحمن الرحيم<br />وبه نستعين على بعض الشياطين<br />انت يامن كتبت تعليقك بهذا العنوان(مافيش فايدة؟ ) من الظاهر في تعليقك انك قد قطعت على نفسك عهداان تسيء الى الأخرين وتوصمهم بما ليس بهم بطريقة مستهجنه وشاذه وبمثل رخص و سفاهة ماخطته وسطرته يداك وعقلك الذي ينضح بما يعتمل في نفسك المريضة .. لا شفاها الله<br />ولا نستبعد انك مريض أكل الحقد والبُغض منك كل مأكل فلترأف يا مخلوق بنفسك.<br />اعلم ياهـذا<br />ان بعض ماذكرته لانخالفك فيه ففيه سطر يحتوي على جزء بسيطامن المصداقيةولكنك اخذت تتخبط كمن اصابه مس من الشيطان ولفيت الردلفاتسعون درجه لتظهر ماتبطنه من الحقدوالكراهية للسعودية<br />اعلم ياجاهل ان المقيم والأجنبي يحسده المواطن على مايتمتع به من السعاده والأنبساط والحرية التي لايحلم بهاحتى في بلدة الأم رواتب مغريه لايحصل على جزء منهادكاترة في وطنه فهنالك اعداد لاتحصى ولاتعد من الأجانب والمقيمين ممن قد تم تنصيبهم في وظائف محروم منها المواطن السعودي ولايتمكن من الحصول عليهاقطعيا<br />وعندنامثل يقول صاحبه<br />( عنز البدو تحب التيس الغريب )<br />ففي الحكومةوفي الشركات والمؤسسات الأهليه خاصةتجد انه قد تم توظيف عدد لايستهان به من الأجانب والمقيمين في مناصب ووظائف لايحلمون بالحصول عليهاوبمرتبات شهريه خيالية ربما قد تقضي انت وعدد من صنفك عشرات السنوات من عمركم لتتمكنو من جمع راتب ثلاثة شهور مما يحصلون عليه فهنالك من يستلم عشرون وثلاثون وخمسون ومائة الف ريال شهريا ياجاهل هذاغير الأتاوات التي يحصلون عليها والمكافأت والهدياء والتذاكر والسياره والسكن والعلاج المجاني وغيره الكثير من المميزات وهم في الأساس لايستحقونهاولو رحلوالى بلادهم فلن يحصلون ولا على عشرهاهذاان حالفهم الحظ<br />ياهـذا<br />لقد ظهر لي مماورد في تعليقك جهلك المطبق وهرطقتك وحسدك وحقدك<br />ياهـذا<br />ان الأجنبي والمقيم يعامل في السعودية احسن بدرجات وليس بدرجه واحده من المواطن ولديه حريه كذلك ومميزات لايمتلكها المواطن نفسه<br />ياهـذا<br />السعودية كثر فيها الفسادالأخلاقي والخلقي والسرقات وغيره الكثير اتعرف ياجاهل ان احد الأسباب الرئيسية هو تواجد كم هائل من الملايين المملينه من الأجانب والمقيمين<br />الذين كثيرامنهم جاز له بيع شرفه وكرامته وضميره ومبادئه لحصل على وظيفة او اموال بطرق ملتوية وغير شرعية<br />ففئة منهم تخصصت في السرقة والنصب والأحتيال والأختلاس والأجرام والأعتداء على الأخرين وهتك الأعراض<br />وفئة تخصصت في تهريب وترويج المخدرات والممنوعات بكافة اشكالها والونها ليسترزق منها ولايهمه الأضرارالتي يتسبب بها للبلد اولاهلها<br />وفئة منهم<br />محتالين وسحرة وساحرات ومشعوذين ومشعوذات ولوطيين وقوادين وقودات وعاهرات<br />ياهـذا<br />لانستبعد ابدا ان احدالأسباب التي ادت بك الى ان تكره السعودية ومواطنيهاوتحقد عليهم ربما قد يكون تمكنك من الحصول على عمل بالسعودية ولكنك لم توفق بسبب سؤوء سـلوكك وقد ارتكبت جريمة ما<br />وتم القبض عليك وطردك شـر طرده ومنعك من الدخول اليها مرة اخرى<br />اوانه لم يحالفك حظك العاثر لردائته وبأت محاولاتك المتعدده على مدى سنوات بالفشل وذلك للحصول على عمل اوظيفة بالسعودية<br />اوان احد اقربائك او اصدقائك قد تعرض اثناء عمله بالسعودية لمشكلة ماامابسبب ارتكابه لجريمة اوغيره من المخالفات وتم طرده<br />ياهـذا<br />هنالك ملايين البشر من معظم ارجاء المعمورة وعلى مدى سنوات يتمنون ويدعيون الله ليل نهار ان يرزقهم بعمل اوظيفة في السعودية<br />ياهـذا<br />لن اتمكن من تزويدك بأحصاء لأعداد من يعملون من الأجانب والمقيمين بالسعودية وان كان هنالك احصاء فهو غير صحيح نهائياويتم التستر عليه لأسباب كثيره<br />ياهــذا<br />هنالك اعداد كثيرة جدا من الأجانب والمقيمين<br />اتخذو السعودية ولسنوات عديده وطن ثاني لهم واصبحو لايستطيعون ان يستغنون عنها ومنهم من قد تم منحه الجنسيه واستقر بها(نساء ورجال)<br />ياهــذا<br />ماذكرته لك هنافي هذا التعليق وعلى عجالةهـومجرد نتاتيف (اي نقاط على حروف ) وفيض من غيض<br />فحاول ان تجد لك مرتع آخر لتتمكن من نفث سمومك به وتجنب ذكر السعودية واهلها بشر ياجاهل فاأنت ممن انطبق عليه المثل الذي يقول صاحبه<br />( قبحها الله من عقول تتربع في رءوس عجول)<br />وفي الختام<br />ارجو من الأخوان نشرتعليقي كاملا وعدم حذف اي حرف منه ليتمكن هذا الجاهل ومن هم من شاكلته من الأطلاع عليه والحصول على بعض المعلومات التي ربما قد خفيت عليهم ولايعرفونهافربما قد يستفيد مع اننا لانتوقع ذلك ونرجو من الله بان يهديه او ان يخلصنا منه ومن اشكاله الحمقى والمغفلين<br />تفضلوجميعا بقبول اجمل تحياتي وتقديري والقائمين على هذه المجله خاصة<br />طبعا استثني الجهال والمعتوهين<br />ابو عبد العزيز<br />انت احد من يحلم بالحصول على وظيفة في السعودية<br />وربما انك قد<br />وفي الختام<br />( قبحها الله من عقول تتربع في رءوس عجول)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144325/http://www.20at.com/article2.php?sid=898"

