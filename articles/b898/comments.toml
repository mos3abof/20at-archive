subject = "اخى الفارس العربي"
author = "summer"
posted = "2006-06-05"
text = "اخلى الفارس العربي تحديدنا لهوية الكاتب من خلال لغته (عاوز، بيتهيالي،طز)ونحن ايضا نحب المصريين ونحترمهم ولكن لانسمح لااحد بان يغلط علينا او على (الاستاذ احمد العامودي) والحوار له اسلوبه بعيدا عن التهجموالشتم<br />اشكرك اخى على اسلوبك الراقي"
