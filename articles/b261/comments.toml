[[comments]]
order = 0
subject = "انا متفائل"
author = "عبدالمنعم شحاته عفيفي بطحيش"
posted = "2006-01-15"
text = "الحمد لله انا دائما متفائل في احدي الايام كنت اجلس علي مكتبي والله هذا حدث<br />وعندما اجلس علي مكتبي لااقوم الابعد ثلاث ساعات من العمل ولكن فجاءة زهقت وتركت المكتب وخرجت وكان المكتب في الصاله ولااحد معي وذهبت الي احد اصدقائي كنت مكتئب الاادري لماذا فلما عدت الي المكتب حاولت افتح الباب فوجدت ان وراؤة شيء يحجزة فتحته بشدة فاذا بي اجد قطع من الاسمنت الثقليه واقعه من السقف علي المكتب فسبحان الله الذي الهمني ان اترك المكتب وكتب لي عمر جديد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134527/http://www.20at.com/article2.php?sid=261"

