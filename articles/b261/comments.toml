subject = "زوجي يقول دالك"
author = "مجيدة"
posted = "2006-02-08"
text = "كل من عرفتهم يقولون انهم يستبشرون خيرا بي الا زوجي فهو يقول انني شام عليه في الايام الاخيرة بينما كان العكس فيما مضى<br />تصورو انه لا يقول لي صباح الخير ويتسلل من الفراش حتى لا نلتقي صبحاويخرج للعلم عندما تزوجنا كان يعمل بالاجرة اما الان له تجارته الخاصة به لوحده"
