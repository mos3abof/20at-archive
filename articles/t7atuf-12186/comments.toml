text = "Quoting ممدوح زكى زخارى جرجس:<br />ياسيدى الفاضل<br />هذا القاتل كان ضابط أمن دولة فاسد و فاشل؟<br />يعنى الدولة و أمن الدولة تخلصوا منة و من قذارتة؟<br />تفتكر هذا الفاسد عندة اى نوع من انواع الضمير ليتعذب؟<br />بلاش تفاهة و تخاريف علشان خاطر ربنا"
