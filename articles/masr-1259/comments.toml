[[comments]]
order = 8
subject = "ربنا ينتقم منك يا مبارك يا حقير"
author = "مصري"
posted = "2006-12-07"
text = "حسني اللامبارك الواطي العميل الجبان طول عمره كاذب ومخادع , منوفي بخيل وحقير , الواطي ده مش بيسيب مناسبة الا ويكمل خداعة بتصريحات قالها من 25 وعشرين سنة فاتت, وبالمناسبة يا مبارك الواطي فين 4,5 مليون فرصة عمل يا كاذب, ولو الحكومة بتقول انها وفرت 800 الف فرصة عمل , طيب ليه انا او اخويا او صحاب اخويا وصحابي وصحاب صحابي بل والحي بتاعي كله لسه مشتغلوش لحد دلوقتي يا كاذب يا حقير يا عميل الامريكان واليهود .<br />ربنا ينتقم منك وانشاء الله الشعب يصحو من غفلته ويقوم عليك انت وابنك الشاذ (جمال برايز) واصحابه (الاربعين حرامي)."
archived = "2006-12-09"
capture_url = "https://web.archive.org/web/20061209002625/http://masr.20at.com:80/article.php?sid=1259"

[[comments]]
order = 9
subject = "كنت بكره الارهابين لكن الان؟؟؟؟؟؟؟؟"
author = "شاب عاطل"
posted = "2006-12-07"
text = "اسئلة ولكم الاجابة عليها....<br />1)ماذا يفعل شاب تخرج بعد عناء وسهر ولم يجد فرصة عمل لكي يستطيع ان ياكل لقمة عيش ويساعد والديه في مواجهة الحياة الصعبة؟؟<br />2) ماذا يفعل شاب لم يجد فرصة عمل وزملائه اصحاب النفوذ والمال يشترون الوظائف بالواسطة والمحسوبية؟؟؟؟؟<br />3)ماذا يفعل شاب وبلده تباع قطعة قطعة وللاجانب والمصانع تخرب ثم تباع بحجة الخصخصة والمصمصة, ويشرد الاف العمال تحت مسمي المعاش المبكر؟؟؟؟<br />4)ماذا يفعل المواطن سواء الشباب العاطل او الموظف المطحون في مواجهة الغلاء في كل شيء من طعام وشراب وملبس وحتي الادوية؟؟؟؟<br />5) ماذا يفعل شابعندما لا يجد عملا او مال او فرصة للحياة؟؟؟<br />ولهذه الاسباب كنت بكره الانسان الذي يضحي بحياته سواء بالانتحار او بوسائل اخري كنت اكرها ولكن للصبر حدود وحدود, ولا يستطيع اي انسان ان يتحمل اكثر واكثر من طاقته , فاذا كان الحديد يلين؟؟ فما بالك بالانسان الذي خلق من لحما ودم؟ فالصبر حدود يا مبارك ."
archived = "2006-12-09"
capture_url = "https://web.archive.org/web/20061209002625/http://masr.20at.com:80/article.php?sid=1259"

[[comments]]
order = 10
subject = "عانس"
author = "عانس"
posted = "2006-12-07"
text = "البطالة يعني عنوسة للصبيان والبنات<br />ما الناس حتتجوز منين من غير شغل طيب اما يبقى لا شغل ولا جواز ولاعيال ولا اهلي طايقني بعد مبقيت28 ولسه قاعدة لهم<br />واخويا 35 وقاعد راخر<br />يبقى الاكتئاب شوية على القرف اللي احنا شايفينه<br />وتفتح الدش تلاقي ناس معاها فلوس بالهبل يعني حتى لو انت راضي بقاليلك<br />لازم تتنمرد<br />دي حاجة تقرف<br />جته القرف اللي كان السبب"
archived = "2006-12-09"
capture_url = "https://web.archive.org/web/20061209002625/http://masr.20at.com:80/article.php?sid=1259"

[[comments]]
order = 11
subject = "سوكا هي الحل"
author = "مكتئب"
posted = "2006-12-07"
text = "سيبك من كلام الصحفيين اللي مش جايب همه ده لأنهم بياكلوا عيش علي قفانا ولما تكون مكتئب اذهب مشوار مع سوكا بشرط أن يكون علي الدائري والجو يكون ممطر وانت هتشعر بالفرق الكبير جدا جدا وهترجع ميه ميه<br />ملحوظة هامة جدا سوكا دي عربية صغيرة بس جميلة جدا المهم ان مشوار سوكا ده تعمله علي الأقل مرتين في الأسبوع وانت مش هتشعر بالاكتئاب بعد كده خالص لأنك بالتأكيد مش هتكون موجود بعد كده علي ظهر الدنيا<br />المهم ما تنساش تتشاهد قبل ما تروح مع سوكا المشوار الجميل ده ... إن لله وإن إليه راجعون"
archived = "2006-12-09"
capture_url = "https://web.archive.org/web/20061209002625/http://masr.20at.com:80/article.php?sid=1259"

[[comments]]
order = 12
subject = "الكتابة"
author = "محمد"
posted = "2006-12-07"
text = "ممكن حالة الإكتئاب تكون ناتجة عن كبت مشاعر معينة و إهمالها لفترة طولية<br />أعتقد إن الإنسان اذا عبر كل مشاعرة و عدم الشعور بالذل أو ضغط من المجتمع حين يكتب سيكون أقل عرضة للإكتئاب و أكثر ثقة بالنفس . الحية السريعة و عدم الإهتمام بالمشاعر و التركيز على الماديات يكون من أهم أسباب زيادة معدلات الإكتئاب في المجتمع"
archived = "2006-12-09"
capture_url = "https://web.archive.org/web/20061209002625/http://masr.20at.com:80/article.php?sid=1259"

