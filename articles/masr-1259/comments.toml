[[comments]]
order = 15
subject = ":@ مبارك مش عاميل :@"
author = "Rody star"
posted = "2006-12-10"
text = "مين قال ان مباك عاميل مبارك مش عاميل يا جماعة دة امريكا و اسرائل هم الى عمله عند مبارك........... لية نقول ان مباك و اطى و الله حرام علينا كدة هنظلم كل و اطى فى البلد و الاكثر اننا ممكن نظلم الكلمة اصلا .......... منين الى قال ان المنوفى بخيل دى صفة انتسبة علىالمنايفة بسسب و احد بس طبعا عارفين مين بابا مباك ........انا كل الى نفسى فيه انى اسئل الست ماما سوزان و اعرف منها هى عايشة مع الرجل دة ازاى ؟؟؟؟<br />ليه بس تقول على بابا انه كذاب .........<br />انت مش عارف ان الكذاب بيروح النار يعنى نسيبة فى الدنيا نطلع نلقي و رانا و رانا و لا عيب يا و لا دة ما تظلموش الصفات الحلوة دى مع بابا مبارك بس لو سمحتوا توصلو لبابا اعجابى الشاديد و الذى يعبر بالشكل و الروح و الدم و بكل جرارحى ............فى جملة بسيطة<br />يا بابا مبارك اتفـــــــــــــــــــــو عليك"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214065447/http://masr.20at.com:80/article.php?sid=1259"
