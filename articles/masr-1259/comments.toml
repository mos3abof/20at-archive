[[comments]]
order = 0
subject = "عنوان التعليق"
author = "البراء"
posted = "2006-12-07"
text = "بارك الله فيكم على هذا الموضوع القيم ، لقد قرات للدكتور هندى عده مرات من قبل على عدد من المواقع وله باع طويل فى استشارات النت<br />وحقا جاءت الجمله الاخيره فى الصميم تكاد تشعر ان الاكتئاب هو الصفه المشتركه الان بين الناس فى بلادنا اللهم الا فى بعض التجمعات الشبابيه او المناسبات الاجتماعيه حيث الموقف يفرض نفسه بقليل من المرح<br />ولعلنا نلاحظ اقبال الناس خاصه الشباب على اى شىء يدعو للضحك و المرح الوقتى فاى فيلم كوميدى من الدرجه الثالثه يلاقى نجاح و اقبال وله جمهوره ، كما نرى عديد من الشباب (يتمحك) فى اى مناسبه او فرصه للمرح فهذا فرح اخو زوج بنت خالى و هذه خطوبه بنت عم زميلى فى الجامعه الذى لم اره منذ 3 سنوات و هذا فيلم لممثل سمج قدم مثله 5 او 6 افلام من قبل على نفس النمط .... المهم انها مناسبه قد تحمل قليل من المرح والسلام."
archived = "2006-12-09"
capture_url = "https://web.archive.org/web/20061209002625/http://masr.20at.com:80/article.php?sid=1259"

[[comments]]
order = 1
subject = "الوسط .. الوسط .. الوسط .. .."
author = "إبن بهيه"
posted = "2006-12-07"
text = "الموضوع جميل .. مشكورين عليه .. ومشكور يا أستاذ البراء على تعليقك الطيب .. أما عن الاكتئاب والمكتئبين والكآبه التي صارت أحد أهم سمات الشخصية المصريه .. أهم أسباب الاكتئاب في رأي العملاق عباس محمود العقاد ورأيي هو المادية .. يرى الأستاذ العملاق أن الإنسان الغير مؤمن بالله يكون كالريشة في مهب الريح ولا يجد له أرضاً صلبة يقف عليها ، فهذه الأرض هي إيمانه بالله ، ويصدق كلام العملاق عندما تراجع الدراسات العالمية حول الانتحار وأسبابه في دول العالم المختلفه .. في رأيي أنه توجد علاقة طرديه مباشره بين الاكتئاب والمادية .. أي كلما زادت مادية الإنسان كلما زادت فرص تعرضه للاكتئاب .. فقد خلق الله سبحانه الإنسان ووضعه في منطقة وسط بين الروحانية والمادية ، الرواحنية تجذبه إلى الأعلى ليسمو فوق الماديات ولكنه لا يجب أن ينفصل عنها تماما ، والمادية تسحبه إلى الأسفل .. إلى حيث الأرض والطين الذي خلق منه .. يحيا الإنسان بين هذا وذاك في تناغم واتساق لو أنه استطاع المحافظة على موقعه في الوسط فلا يبالغ في البعد عن الماديه كثيراً لدرجة تخرجه من إنسانيته ليقترب من مواقع الملائكة في الأعلى وتضيع معالمه كإنسان فلا يفيد ولا يستفيد منه أحد على الأرض ، وبطبيعة الحال لا يجب على الإنسان ترك نفسه للقوة الساحبة إلى الأسفل .. إلى الأرض فيغوص فيها ويصير مجرد حفنة تراب لا قيمة لها ..<br />تلك هي المعضلة الحقيقية للبشر على هذه الأرض ومتى استطاعوا البقاء في منطقة الوسط سلموا ونجوا من كثير من مشكلات التعب النفسي التي تظهر حين يغادر الإنسان هذه المنطقة إن صعدواً أو هبوطاً .. فغلبة الروحانيات أكثر من اللازم تقربه من عوالم ليست من حقه ولم يخلق لها ولا تنسجم مع ما جبله الله عليه من صفات بشرية وهذه معاناة التطرف الروحاني لأص<br />اقرأ بقية التعليق .."
archived = "2006-12-09"
capture_url = "https://web.archive.org/web/20061209002625/http://masr.20at.com:80/article.php?sid=1259"

