[[comments]]
order = 6
subject = "نصيحه للشباب لزوال الهم والاكتئاب"
author = "مفيش فايده"
posted = "2006-12-07"
text = "كل ماعليك هو ان تحضر كرسى خشب متين ويكون معك حبل طوله مترين ويفضل يكون (سلبه) وقف بكل هدوء وبدون تردد وعلق جزء من طرف الحبل فى السقف وليكن مكان النجفه وتظل واقفا فوق الكرسى لمدة دقيقتين على الاقل ثم تفكر وبهدوء وبدون انفعال فى مستقبلك الذى ضاع وفى المجهول الذى ينتظرك اما ادمان البانجو او السجن فى قضية شيكات لعدم سداد القرض ده ان اخدته اصلا او الشتات فى بلاد الله الواسعه ده ان عرفت تجيب تمن عقد العمل ---- الحل فى ايدك انت-- ضع الحبل حول رقبتك واعقده جيدا ثم بحركه سريعه اقفز لاعلى وانطر الكرسى من تحت قدمك --- وعندها ستحل كل مشاكلك وستجد نفسك فى عالم اخر ربماافضل من عالمنا هذا"
archived = "2006-12-09"
capture_url = "https://web.archive.org/web/20061209002625/http://masr.20at.com:80/article.php?sid=1259"

