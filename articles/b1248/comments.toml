subject = "كله تمام"
author = "فارس مصري"
posted = "2006-09-21"
text = "الحمد لله كله تمام فى تايلاند عقبالك يا مصر لم تفوقى من اللى انتى فيه وتثورى على حكم الطاغية مبارك وعصابته !! بس امتى ولا ازاى !! دا ماشاء الله عليه عامل حسابه كويس وماكل الجيش ومعيشه فى نعيم !! هو اهبل ولا حاجه دا عسكرى برده ......<br />حسبي الله ونعم الوكيل فى مبارك وعصبته ,, اللهم اخسف بهم الارض اللهم احشرهم مع فرعون وقارون وهامان ... امييييييييييييييييييين"
