[[comments]]
order = 8
subject = "عاش عزوز عدو العربيه .."
author = "إبن بهيه"
posted = "2006-12-10"
text = "اللهم أخزي شوشو ... مش عارف ليه كده حاسس بأن الأخ الكريم خالد ولأخ الكريم هاني والأخ الكريم برضه عزوز إبن عمي سليمان واحد .. كلهم واحد .. أصلي عارفه من زمان بيحب يتابع كل كلامه لدرجة أنه يحفظه عن ظهر قلب .. لأ ويتابع أي كلمه تقال عنه أو حوله ويبقى فرحان أوي .. وفرحان أكتر لما يناقشه حد في كلامه .. صح يا أستاذ عزوز ؟؟؟ إحنا مش بنكرهك أنا ولا أخونا فارس .. بس بنكره قناة العربية اللي انته بتحبها مووووت وده سبب خلافنا معاك .. بدليل أنني لم أرد على كلامك في حق قناة الناس ما ليناش صالح بيها .. دي قناه محترمه وتؤدي واجبها المحترم ومهما كان مشايخها فهي عندي وعند كل المصريين مسلمين ومسيحيين أحسن من قنوات البرورنو بتاعة وليد بن طلال العريانه اللي بتخرب بيوتنا ومجتمعاتنا .. وتعمدت أن أذكر لك مسيحيين لأنهم برضه زينا مسلمين وطناً كما قال مكرم عبيد باشا ولهم نفس تقاليدنا وعاداتنا وما يقبلوش إنها تتلخبط برضه .. ولا ليك راي تاني ؟؟؟ بطل محلسه لقناة العربيه الصهيونية وأوعدك أكون أول واحد يتظاهر في الشارع رافعا راية الحب لك يا عزوز .. عاش عزوز عدو العربيه .. عاش عزوز عدو العربيه ..<br />مبسوط يا عم ؟؟؟؟<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201115/http://masr.20at.com:80/article.php?sid=1268"

[[comments]]
order = 9
subject = "يا حبيبتى يا عربية"
author = "فارس_fr"
posted = "2006-12-10"
text = "اظن كلام ابن بهية اللى انادايما مؤيد له يا اخ خالد مش محتاج تعليق من حد .,, ياريت تعيد قراءة المقال وقراءة التعليقات كويس ,, وبعدين ابقى اشتمنا زى ما تحب ....<br />مبحبش قناة العربية ولا ابواقها ,, وبحب قناة الناس ومشايخها ,,,, ايه العيب فى كده ؟؟؟؟<br />تحياتى لابن بهية"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201115/http://masr.20at.com:80/article.php?sid=1268"

[[comments]]
order = 10
subject = "اسلوب طة حسين"
author = "كل واحد عايز ينشهر شوية ويبقى لة سعر بين الكلاب يقوم يشتم فى الدين فى المشايخ"
posted = "2006-12-10"
text = "فى القرأن والعصر الجاهلى وهو اجهل من دابة<br />قبل كدة واحد كان اسمة طة حسين واظنة كان واحد زقة او جمعية تنصريية عن طريق مراتة اصل ابوها كان قسيس كبير راح هاجم الدين وانشهر وقالوا مش عارف مين اللى قال انة عميد الادب العربى<br />المهم كل حاجة لها مقابل وبيقبضوا كويس من السفارة اياها والجمعيات التبشيرية وكلة بتمنة<br />واضح رجاء لا تعطوهم اهتمام"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201115/http://masr.20at.com:80/article.php?sid=1268"

[[comments]]
order = 11
subject = "واحد و120 الف"
author = "مصرية مهمومة"
posted = "2006-12-10"
text = "تحياتى للجميع<br />سيدى الكاتب لست ضد دعصام العريان وهو واحد من قلة من الاخوان الذين اكن لهم الاحترام وفى بداية اعتقاله دافعت عنه حتى ظن احدهم انى من الاخوان<br />ولكن<br />الا يستحق 120 الف معتقل سياسى فى مصر الحديث عنهم والدفاع عن حقوقهم<br />تلك المهمة التى اتمنى على الجزيرةالقيام بها وليس الحديث عن د عصام<br />مصرية مهمومة"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201115/http://masr.20at.com:80/article.php?sid=1268"

[[comments]]
order = 12
subject = "محمد سالم"
author = "انت قرايت الموضوع يابن بهيه انت وفارس وبعدين علقتوا ولا العكس الي حصل"
posted = "2006-12-11"
text = "انت جبتم منين ان الراجل بيمدح العربيه<br />شوف ياسيدي سليم عزوز ضد الاعلام الممول سعوديا لانه اعلام فاسد لا يخدم الا ال سعود واستمرار حكمهم<br />وبالتالي هو اكيد ضد قناة العربيه العميله<br />وعتابه علي قناة الجزيره ده عتاب ونقد المحبين<br />وبصراحه رغم عدم اعجابي بتغطيات الجزيره لبعض الاحداث في مصر الا انها مازلت الافضل والاجرا والاكثر موضوعيه ولكننا كنا ننتظر منها اكتر من هزا<br />ولكن هم لهم حساباتهم الخاصه خصوصا وهم يتعرضون لتضييق ومضايقات مستمره... والنظام الجاكم ل يتردد في اغلاق مكاتب الجزيره او حتي وقف بثها علي القمر المصري ازا ما تجاوزت سقف معين في تغطياتها<br />علشان كده هم اشبه بمن يمشي علي حبل مشدود تحكمه مجموعه من التوازنات والمصالح"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201115/http://masr.20at.com:80/article.php?sid=1268"
