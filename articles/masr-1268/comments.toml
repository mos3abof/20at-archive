[[comments]]
order = 0
subject = "سياسى اه دينى لاء"
author = "ashraf"
posted = "2006-12-09"
text = "المقال جميل ورائع بس الصاروخ الارض جو بتاعك يااستاذ سليم صاروخ فشنك --- كلامك فى السياسه جميل ورائع ولا غبار عليه انما مش عشان دافعت عن عصام العريان خايف لاحسن نقول عليك متعاطف مع الاخوان -- لاء ماتخافش من ايام ماكنت بتكتب فى جريدة الاحرار ايام الهالك فرج فوده واحنا عارفين انك علمانى متعصب ومع ذلك نحترم قلمك السياسى -- مالهاش لازمه الحته بتاعة مشايخ قناة الناس دى لان الامر هنا مش سياسه لاء ده دين وانت للاسف مش اهل انك تتكلم فى حاجه ذى كده خليك فى السياسه احسن"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201115/http://masr.20at.com:80/article.php?sid=1268"

[[comments]]
order = 1
subject = "نورتنا يا سي عزوز"
author = "إبن بهيه"
posted = "2006-12-09"
text = "يادي عزوز .. فيه إيه يا ولاد البلد .. هو يعني يا مخبرين من بتوع لاظوغلي زي رزق وعبدالله كمال وجبر ونيله يا عزوز ؟ هي خلاص الدنيا خلصت حواليكم وما فيش ناس تانيه أحسن ؟ أنا مش معترض على الأخ عزوز كعزوز ولكني معترض لأن السيد عزوز باين عليه حاول الكلام في كل القنوات ولأنه المسكين شكله مش فوتوجينيك أبدا فكل القنوات بتخاف تطلع الخلقه ديه على شاشتها .. طبعا ده خلاه شغال ليل نهار خبط في القنوات وبس .. يعني يدور على أي موضوع أو يتكلم من غير موضوع زي دلوقتي .. من ناحيه بيهاجم القناه لأنها هي في رأيه السبب في سجن العريان ومن ناحيه تانيه عايزهم يهتموا بالعريان ويكملوا عليه .. ما تتهد يا أخ عزوز .. ثم مالك انته ومال قناة الناس ؟؟؟ أظن دي مش زي الجزيرة ولا عندهم فيصل القاسم اللي حفيت عشان يستضيفك مره .. اتهد بقى بلا نيله ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201115/http://masr.20at.com:80/article.php?sid=1268"

[[comments]]
order = 2
subject = "الي ابن بهية"
author = "هاني"
posted = "2006-12-09"
text = "الاخ ابن بهية مش واضح له ملة وعلي كل نحن نشكر الاستاذ سليم عزوز علي موقفه في الدفاع عن الحريات حتي فيما يختص بخصومه السياسيين، وبعدين مقال عزوز متخصص في الاساس في النقد التلفزيوني ثم انه فيصل القاسم استضافة اكثر من مرة وظهر عشرات المرات في الفضائيات المختلفة من الايه ار تي الي الحوار الي المستقلة الي غيرها من القنوات التلفزيونية وانا شاهدت في كثير من المرات ولم اجد ان شكله كما قال ابن بهية<br />وبدلا من ان يهاجم ابن بهية الناس عمال علي بطال عليه ان يعرف تاريخهم الاول فسليم عزوز وانا متابع مقالاته من زمان ليس من جماعة لاظوغلي. وعليك يا ابن بهية ان تعلم انه كان شديد الهجوم علي حزب العمل لكن لما الحزب تم تجميده انبري للدفاع عنه في الاحرار بشكل اورده مجدي حسين في مذكراته<br />وسليم عزوز يختلف يا ابن بهية مع الاخوان لكنه كثير الدفاع عن حقهم في الحرية وقد هاجم سجن المرحوم حسن الحيوان واغلاق جريدة افاق عربية<br />ومن يتابع الكاتب يعلم انه وان علمانيا لكنه مدافع شرس عن الحريات<br />والله خايف لتكون انت يا ابن بهية من الجماعة العصافير وعاوز تشبه الرجل علي الفاضي"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201115/http://masr.20at.com:80/article.php?sid=1268"

[[comments]]
order = 3
subject = "يا ريت نفكر بموضوعية شويه .."
author = "إبن بهيه"
posted = "2006-12-10"
text = "يا أخ هاني أنت للأسف لم تفهم كلامي عن السيد عزوز .. فلم أصفه بأنه لاظوغلي ولا حاجه .. راجع كلامي من تاني .. وأما موضوع الأخ عزوز وهجومه على قناة الجزيرة ، فبرغم تحفظاتي الشخصية على قناة الجزيرة إلا أنني أعتبرها واحدة من أهم القنوات ويجب عدم التشكيك فيها بصورة جماهيرية كما يفعل السيد عزوز أعزك الله .. فالعاقلون دوماً يتوخون الحذر من التشكيك في بعض الجهات وبخاصة أنها تتمتع بموثوقية عالية لدى الكثيرين والتشكيك بها يضر بالجميع أكثر مما يضر بهذه القناة أو تلك .. وعمك عزوز اللي بيتكلم عن الجزيرة كده وعامكل نفسه حامي حمى الحريات تلاقيه سمنتين على عسلين مع قناة العربية الصهيوأمريكية أو العبرية كما يجب أن تسمى هي وموقعها ورئيسها الماسوني عبدالرحمن الراشد (السعودي) .. يعني الحكاية مش نزاهة ولا يحزنون من عمك عزوز بقدر ما هي فلحسه فارغه متعود عليها .. وكان أولى به أن يهاجم قناة العربية الماسونية التي تدعي أنها حرة .. هي كده فعلا حره وسوا ومونتكارلو وهاآرتس ومعاريف ... عرفت ليه أنا زعلت منه ؟؟؟ أنا ما فيش بيني وبينه شيء أ:ثر من ذلك .. لو وضعت قناة الجزيرة في الميزان مع كل القنوات العربية سترجح كفة الجزيرة برغم ما لنا عليها من ملاحظات موضوعية .. لكن لو حطيت قناة العربية حبيبة عزوز والتي تنشر له باستمرار مقالات على موقعها وووو ... لو حطيتها في كفة وعشر قنوات إسرائيلية سترجح كفة قناة العربية في خدمة الصهيونية والماسونية أكثر من قنواتهم هم .. بس كده .. هو ده الخلاف بيني وبين سي عزوز وأظن من حقي أزعل من واحد بيدعم ويناصر الطابور الخامس الإعلامي في بلادنا ولا أنا غلطان يا سيد هاني ؟؟؟ لك وللجميع تحياتي ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201115/http://masr.20at.com:80/article.php?sid=1268"

[[comments]]
order = 4
subject = "فى الجون يابن بهية"
author = "فارس_fr"
posted = "2006-12-10"
text = "والله يا بن بهية دايما بتتحفنا بارائك ,,, بالذات رايك فى قناة العربية ,, الحمد لله ان لسه فى ناس صاحية فى البلد . بالنسبة للى اسمه زعزوع ياريت متتكلمش عن الدين وعن المشايخ لانك وكما هو واضح للجميع علمانى ,, فمن الاحوط لك انك متتكلمش فى الدين ولا عن المشايخ ,,,<br />والعب بعيد عن هنا !!!!"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201115/http://masr.20at.com:80/article.php?sid=1268"

[[comments]]
order = 5
subject = ".. وتابعه قفه"
author = "خالد"
posted = "2006-12-10"
text = "\"زعزوع\"؟ كيف يتسني التعامل مع كاتب محترم بهذا الاسلوب المتدني من واحد يدعي انه يدافع عن الاسلام الذي قال نبيه ان المسلم - الحقيقي مش المزيف - ليس بطعان ولا لعان ولا فاحش ولا بذئ<br />زعلان قوي يا اخوي علي الهجوم علي قناة الناس، وخرجت تبايع ابن بهية علي المنشط والمكره، فهل قناة الناس هي الاسلام وهي الاختلاف مع اسلوب بعض الدعاة بها وهو فظ وبشع هو خلاف مع الدين<br />المشكلة اننا في زمن لم يهتم التيار الاسلامي فيه بالتربية، فكان ان خرج علينا ابن بهية وتابعه بهذه المسخرة باسم الدفاع عن الاسلام. كل المقال المدافع عن شخص مسجون لم يشفع لكاتبه ولم يتذكر المسلم العفيف تابع ابن بهية الا انه علماني يهاجم قناة الناس كأنها بيت الله الحرام<br />يا حزني علي الاسلام"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201115/http://masr.20at.com:80/article.php?sid=1268"

[[comments]]
order = 6
subject = "شرف لى ان اكون تابع لواحد فاهم من ولاد بهية"
author = "فارس_fr"
posted = "2006-12-10"
text = "بيتهيالى انت مقراتش المقال كله ,, الكاتب الكبير الفذ المحترم اللى انت بتدافع عنه ده كان نص كلامه اللى انت غضيت بصرك عنه \"عندما استمع الي شيوخ قناة الناس أتصور ان القيامة قد قامت، واننا دخلنا النار. اعتقونا لوجه الله! \"\" ... اذا كنت تقول من انا لكى اتكلم عن كاتبك المقدس ,,فمن هو لكي يحكم على مشايخ قناة الناس باى وجه حق يحكم عليهم ,, وهل اسلوب (اعتقونا لوجه الله ) ده هو الاسلام فى نظرك ,,, وانك لم تطاول على وتشتمنى هو ده الاسلام ,, بتنتقد فعل وان تقوم به ,,, لو تلاحظ تعليقى كويس وتقراه تانى انااثنيت على كلام ابن بهية عن القناةالعميلة \"قناة العربية \" انت مش عاجبك راينا احنامفرضناهوش عليك ده اولا .<br />ثانيا : كان ردي على كاتبك المقدس لتهكمه وسخريته من مشايخ قناة الناس ,, باى وجه حق يسخر منهم ,,,,, اقرا تعليقي كويس واقراالمقال تانى ,, وبعدين ابدا اشتم من تانى ......."
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201115/http://masr.20at.com:80/article.php?sid=1268"

