text = "الموضوع ان في ناس في حياتنا ماشيين بقوة الدفع هما دول اللي لما يركبوا او يمشوا ممكن يشوفوا واحده يقوموا متجوزنها<br />ناس مقتنعين بحكاية الحب من اول نظرة<br />وهي نظريه انا مش عارف اثبت صحتها ولا قادر انفيها<br />بس انا شايف ان رابطة الزواج اللي هي علاقه عظيمة جدالا تتم لمجرد ان واحد شاف واحده حس انه منجذب ليها<br />الموضوع اكبر من كده والزواج بالطريقه دي انا ضدها اصلا"
