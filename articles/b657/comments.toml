subject = "سواق الاتوبيس ذات نفسه"
author = "m_a_6001"
posted = "2006-04-22"
text = "السلام عليكم انا سواق التوبيس هذه المرة ولم اكن راكب بهى ولاكن المشكله انه اوتوبيس لاطفال فى الكجى تو يعنى بيبيهات صغير لاكن هيه مش منهم هيه اوحت طفله منهم شوفتيها مره واحده فى الاول وبعد كيده ماشوفتهاش خالص الى بعد سنه تقريبا لاكن الباقى كله كان كلام بسمعه عنها هيه ان جيتوم للحق هيه جميله وعلى خلق ممتازذادنى احترام لها ولما قربتلها اكتر عرفت عنها كل شىء تقدر تقول على بنت بتحبها او نفسك تكون شريكت حياتك عشت مع نفسى قصة حب جميله لها من غير ما هيه تعرفنى ولا انا اكلم حد عنها وكنت بجد اتمنى مازلت بتمنى من الله ان هيه تكون زوجتى وحبيبتى التى تمنيتها فى حياتى او كنت ابحث عنها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134056/http://www.20at.com/article2.php?sid=657"

