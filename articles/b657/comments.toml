[[comments]]
order = 9
subject = "المرادى باخرة"
author = "أخو الريس(سابقاً)"
posted = "2006-04-05"
text = "موضوع خفيف وجميل<br />بس أنا ليا موقف فى نفس النطاق بس المرادى مش فى أتوبيس.. المرادى فى باخرة من باخرات الرحلات الخاصة بتاعت ماسبييرو - القناطر .. الرحلة عائلية جدا .. وجوهها جميل .. الطريق ساعة ونص لحد القناطر .. وصلت الرحلة للمرسى.. فى النزول ينتظر كل منا باقى أفراد عائلته .. أنا منتظر أى حبيبة قلبى .. فجأة لقيت بنت نازلة من الباخرة .. بس خلاص .. هى ده .. المهم الرحلة برنامجها خلص .. وغحنا الوقتى فى طريق العودة ..قبل الإنتهاء من طريق العودة خدت كلمت أمى حبيبة قلبى وشاورتلها عليها وإحنا فى الباخرة .. ماما طبعا رائدة فى العمل الإجتماعى .. راحت وبالطريقة عرفت أصلها وفصلها وجاية الرحلة مع مين .. والحكاية والرواية والتفاصيل .. المهم خلصت الرحلة .. سألت احد القائمين على الرحلة يسألى عليهاعن طريق زوجته.. الراجل سأل ورد عليا بعدها بأسبوع .. والحمد لله إتأكدلى من بعض النقاط التى طلبت منه التأكد منها.. والحمد لله طلعت كلها موجودة ما عدا حاجة واحدة .. والحمد لله محصلش نصيب .. وأبدلنى الله االآن بمن هى خيراً لى منها .. ولكن لم تكن هذه المرة فى باخرة ولكن كانت إثناء إنتظارها لإستقلال تاكسى بعد مغادرة فرح إسلامى فى إطار من الأسرية .. وأدعولنا بالتيسيييييييييييير ..<br />أنا شايف إن الطريقة المثلى فى الزواج هى المشاهدة فى جو ىمن الأسرية أو العائلية لأن - فى وجهة نظرى - شايف إن ده أفضل من زواج الصالونات .<br />أخو الريس (سابقاً)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134056/http://www.20at.com/article2.php?sid=657"

[[comments]]
order = 10
subject = "اتوبيس حبنا...."
author = "هووووبه...هبهوب...هبه"
posted = "2006-04-05"
text = "فاكره ياوليه الاتوبيس اللي جمعنا ...<br />فاكره يارجل .. فاكر انت لما بصيت علي قفايا<br />عشان تعرف شعري طويل ولاه لاه ...<br />فاكر ياوليه<br />ايه كات ايام عيد جوزنا الاول قضيا هفي ميكوباص<br />ووعيد جوزنا التاني قضناه في ميترو عشان قصه<br />حبنا الفظيعه تكون صوره لمن تسول له نفسه<br />ويفتكر يجوز ..<br />\"ياماما ..دوا الصلع اهوه\"<br />بس خلاص ياوليه<br />انتي كبرتي وشعرك وقع ...<br />روحي وانتي طالق<br />لاه..لاه...لاه حرام عليك \"يااسطي\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134056/http://www.20at.com/article2.php?sid=657"

[[comments]]
order = 11
subject = "لسان مجروحة"
author = "aroundu_4"
posted = "2006-04-05"
text = "ماذا تنتظر ..<br />لتغرِسَ السيفَ الأخير<br />لتموت الدموع على وسادتي<br />ويرسِمُني الضمور<br />ألستَ الأمير ..<br />من يحترفُ الرجوعَ ليرتكب الرحيل<br />وأنا الحمقاء<br />التي دللّتكَ من دون النساء<br />وعطّرت الهواءَ .. لترشفه عبير<br />وأنا الصمتاء<br />تجرَحُني في الصباحِ<br />وفي المساءِ تستجدي الخرير<br />يُعجبُكَ البكاءَ<br />وتقولُ وجهكِ بالدموع النازحاتِ ..<br />كهمسِ الطيور<br />تستعذبُ ألمي<br />والضحكة الشمّاءَ<br />وزوبعة الغرور<br />تأتي متى تشاءُ<br />لتقطف روحَ الربيعِِ<br />فتنزف كل الزهور<br />تأتي كما الرياح<br />تُدمرُ حلمَ الورودِ<br />تبعثِرُ كل البيوت<br />أحضنُ طعنتكَ لعلّي أموت<br />يُسافِرُني الوجود<br />ثم تعود<br />تعاودُ كسري<br />وتشربُ كأسا وتُهدي الجمود<br />تتركني بركنٍ<br />أظلُ وحيدةً<br />بين الهدايا وبين البريد<br />ويوم جديد<br />ألعنُ نفسي<br />من عشقِ غدرِكَ<br />وكذبِ طُهرِكَ<br />وزيف الوعود<br />أرمِمُ بعضَ نفسي<br />للمرةِ القادمة<br />ينسالُ لونُ ندمٍ<br />على الشفةِ المُرغمة<br />يرويكَ دفءُ صبرٍ<br />ودموعٌ حالمة<br />استعذبُ الجرحَ<br />وقصيدة ولع<br />بأوراقي المُفحمة<br />تكتبُ بذات السكين<br />وألمي بعد .. لم يستكين<br />من مرةٍ فائتة<br />وعيني رغم هطول الضوء مُظلمة<br />تتغلغلُ في ثناياي لمسَتُكَ الباردة<br />بضحكةِ ظفرٍ .. وثقةٌ مُفرطة<br />كالأمسِ<br />ككل المراتِ السابقة<br />أسلمُ مُدني للجيوش الماجدة<br />لتقتل شعبي وتستبيح الأفئدة<br />وكلمةً أودعتَها البارحة<br />بقهرٍ جارحة<br />تقولها ثانية<br />لتكون القاضية<br />وأموت ألما وما زلتُ حانية<br />أقبّلُ الهموم الآتية<br />وأجرعُ نفسَ الطعنةِ المُضنية<br />ما عاد بوجعي شطر آخر<br />وما عادت لُعبَتُكَ كما هيّ<br />’ إني الغالية ‘<br />تقولُها كعباراتِ الصباح البالية<br />إن عدتَ فأحسن القتلَ<br />وإن ترحل<br />فإن جراحاتي باقية<br />نقلاً عن موقع هريدي...<br />أرسلوا لنا لتعبروا عن مشاعركم.....<br />http://groups.yahoo.com/group/aroundu_4/"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134056/http://www.20at.com/article2.php?sid=657"

