[[comments]]
order = 7
subject = "احنا بتوع الأوطوبيس.."
author = "حسن الهيثمي"
posted = "2006-04-04"
text = "باعتبارالحافلة،مكان عمومي يلتقي فيه الجنسين معا،طبيعي أن تقع فيه نظرات الإعجاب من الطرفين، والمهم هوأن تكون النية صادقة،المشكل في نظري-ليس هنا- المشكل فبمايقع على متن تلك الاوطوبيسات هو تلك الأفعال الشنيعة التي يقوم بها بعض ضعاف النفوس، حيث تلتصق الأجسادو تختلط الأنفاس، في حالةالاكتظاظ،والعتب على شركات النقل وعلى المسؤولين الذين أطلقوا لهاالحبل على الغارب.لتفعل في المواطن ما تريد..هذايقع بالمغرب..واسألوا طلبةالرباط والبيضاءو غيرهما من المدن الجامعية..لتقفواعلى حقيقة مرة.عودعلى بدء،على الذي وجدأم أولاده بواسطة هذه الوسيلة،أن يردد معها{احنابتوع الاوطوبيس..}المهم هوأن يرحل المرء عن هذه العزوبيةالقاسية..التي أعاني منهاكغيري من الشباب..تعددت الأسباب والزواج واحد.وأسال الله لكل عروسين أن يجمع بينهما في خير..كماجمع بينهماعلى مقاعدالدراسةأوفي العمل أو..في الأوطوبيس.والسلام elhitmi1@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134056/http://www.20at.com/article2.php?sid=657"

