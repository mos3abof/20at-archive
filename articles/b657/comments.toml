text = "ففكر يعمل بيه إيه<br />يشرب عصير قصب و لا يركب الأتوبيس فقال :<br />أنا لو ركبت الأتوبيس هيبقي في حل من إثنين<br />يإما هقف أو هقعد<br />لو وقفت مش هيبقي في أي مشكلة<br />لكن لو قعدت هيبقي في حل من إثنين<br />يإما هيقعد جنبي راجل أو تقعد جمبي ست<br />أنا لوقعدت بجانب راجل مفيش مشكلة<br />لكن لو قعدت بجانب ست هيبقي في حل من إثنين<br />لإما هنعجب ببعض يإما مش هنعجب ببعض<br />لو مأعجبناش ببعض مفيش مشكلة<br />لكن لو أعجبنا ببعض هيبقي في حل من إثنين<br />يإما هنتجوز يأما مش هنتجوز<br />لو مإتجوزناش مفيش مشكلة<br />لكن لو إتجوزنا هيبقي في حل من إثنين<br />يإما هنخلف يأما مش هنخلف<br />لو مخلفناش مفيش مشكلة<br />لكن لو خلفنا هيبقي في حل من إثنين<br />يإما هنخلف ولد أو بنت<br />لو خلفنا بنت مفيش مشكلة<br />لكن لو خلفنا<br />ولد هيبقي في حل من إثنين<br />يإما هيستقيم أو هينحرف<br />لو إستقام مفيش مشكلة<br />لكن لو إنحرف هيبقي في حل من إثنين<br />يإما يدمن أو مش هيدمن<br />لو مأدمنش مفيش مشكلة<br />لكن لو أدمن هيبقي في حل من إثنين<br />يإما هيبقي معاه فلوس أو معهوش<br />لو كان معاه فلوس مفيش مشكلة<br />لكن لو كان عايز فلوس هيبقي في حل من إثنين<br />يإما هيسرقني أو هيقتلني<br />لو سرقني مفيش مشكلة لكن لو قتلني ..<br />.. يقتلني ؟؟!!!!!!!!!(<br />لا ياعم أنا أشرب عصير قصب أحسن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134056/http://www.20at.com/article2.php?sid=657"

[[comments]]
order = 14
subject = "انواع القلوب"
author = "امير الاسكندرية"
posted = "2006-04-11"
text = "قلب يحب: تتمنى ان يكون من يحبه هذا القلب هوانت لتهنأ به أبد الحياه<br />قلب يحن: تتمنى ان تلمس حنانه ورقته وخوفه عليك وان تعيش في حنانه للابد.<br />قلب مغرم: تتمنى غرامه ان يكون في هواك حتى لا يذهب بعيدا وتشتاق له كل يوم.<br />قلب مهموم: يشغلك همه حتى تدخل جوفه وتعيش همومه....فقد يكون لديك الحل.<br />قلب مجروح: ما أصعب ان تهرب منه وتجده وراءك ينتظر اقل فرصه منك ليهجم عليك ويسكنك؟<br />قلب حاسد: هو قلب تتمنى ان لا يراك ولا تراه ......اما يعديك بحسده.......او يحسدك فلا تسلم منه.<br />قلب حقود: هو القلب الذي لا يجد من يدخله لانه مظلم طوال العمر ولا يعرف سوى القلوب الميته<br />قلب ماكر: هو القلب الذي اختارك وحدك وبعد ذلك تجد فيه عدة قلوب يلعب بها ويضحك عليها.<br />قلب خبير : تتمنى خبرته في الحياه ولكن تخاف تجاربه فقد ترسب في احدى محطاته ولا تصل اليه.<br />قلب طيب: ترجو ان تناله ولكنك ترى انه ينال الجميع ولا يحرم احد من زيارته وسكناه<br />قلب ولهان : كثير ما يعذب صاحبه لانه لا يصبر عن الشكوى وقليلي ما يرتاح ليرتاح صاحبه.<br />قلب سعيد : وهذا قلب مؤقت فقط ...... يظل خائف اكثر ماهو سعيد ان يفقد السعاده في احد الايام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134056/http://www.20at.com/article2.php?sid=657"

