posted = "2006-09-09"
text = "إذا كان هناك حب من أول نظرة فإنها خرافة ابتدعتها السينما المصري<br />ولكن من واقع خبرتي<br />اسمة اعجاب من أول نظرة<br />وهناك اختلافات شاسعة واضحة صريحة بين الحب و الإعجاب<br />بالرغم من موضوع المقالة الأكثر من الرائع إلا ان العنوان ممكن ان يكون سذاجة شباب مصر؟؟؟؟؟؟؟؟<br />ليس تقليل من شأن الحب<br />كيف أحب انسانة لااعرف عنها اي شيء<br />وهذا هو حال كل الشباب<br />50 مليون روميو في بلدك يابلدي<br />السبب مش في الشباب السبب في الفراغ!!!!!!!!!<br />محمد حسن غنيم"
