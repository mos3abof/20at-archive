[[comments]]
order = 1
subject = "حكاية مطار أمبابه و هيثم"
author = "مناضل انترنتى قديم"
posted = "2006-04-03"
text = "السلام عليكم ورحمة الله و بركاته<br />يا سلام على هيئة النقل العام انا هاحكيلكم حكاية هيثم صاحبى و هو شاب و لا كل الشباب قيمه و سيما<br />ولابس بنطلون جينز و كاوتش من باتا ماركة أديداس ألوان فسفوريه و لأنه من والد الذوات و ساكن فى المهندسين أو المعلمين أو الصحفيين مش فاكر بالتحديد<br />فهيئة النقل العام موفره لسكان المنطقه ديه خدمة التنقل بالهليكوبتر بدلا من الأوتوبيس و الخدمه ديه بتنطلق و كلام فى سركم من مطار أمبابه<br />المهم عمنا هيثم أبو شعر برتقالى طبعا صبغه زى النجم أبراهيم سعيد وكنوع من التميز صبغه برتقالى مش أحمر و مركب عدسات أخضر برسيمى مخلاياه عامل زى فانوس رمضان اللى مستورد من الصين<br />شاب أمور و مطمع لكل البنات لكن هو عايز حب غير تقليدى<br />المهم و كالعاده رايح شغله فى القريه الذكيه لأنه مبرمج و بدل من زحمة محور 26 يوليو ركن عربيته الفايف باى فايف امام عربية الفول اللى واقفه فى مدخل مطار امبابه<br />وقال أخد طياره هليكوبتر زى باقى خلق ربنا علشان أحس بمعناة الناس المهم ركب الطياره و طارت بيه الطياره وفجأه و بدون أى مقدمات لمح من جانب زجاجه الطياره اللى ضد الرصاص مشهد عجيب<br />شاب راكب مينى باص وبجواره فتاه غايه فى الرقه و الأدب و حاول يكلمها على طريقة عشرينات و لكن فجأه البنت صرخت فى وجه الشاب و طبعا لأن أحنا شعب بنحب المجاملات<br />الشاب ده كل علقه من المينى باص كله ومن عربية الأمن المركزى اللى تصادف مرورها فى الجانب الأخر من الطريق لتأمين موكب الدكتور أحمد نظيف رئيس الوزراء<br />اللى ساكن فى الشيخ زايد و لأن صاحبى هيثم شاب شهم صرخ فى الطيار وقاله اركن على جنب لازم ننزل نساعد الشاب ده فسماع أقذع الألفاظ من ركاب الطائره واحد يقوله عايز الحق ماتش الجولف فى بيفرلى هيلز و<br />التانى يقوله عايز الحق عرض الدولفين فى مدينة الانتاج الأعلامى ففكر قليلا ثم سأل الطيار أنت معاك براشوت قاله ايوه قاله خلاص انا هانزل فقاله الطيار ممنوع لان هذه المنطقه موبؤه بأنفلونزا الطيور<br />فقال للطيار اتصرف قاله انت هاتقرفنى ليه رح ضارب على المينى باص صاروخ دمره تماما إلا الشاب الجرىء الذى كلم البنت فخرج مسرورا لانه نجا من الموت مرتين الأولى من بين براثن الركاب وعربية الأمن المركزى و الثانيه لأنه<br />نجا من الصاروخ و هو بيجرى وقعت عليه دجاجه مصابه بالأنفلونزا و من وقتها وهذا الشاب المسكين يرقد فى حقل ليمون لعل و عسى<br />ومن وقتها قرر صاحبى هيثم ان لا يتزوج بهذه الطريقه العبيطه و ان يختار شريكة حياته بطرق أخرى أكثر تحضرا بدلا من الهبل ده<br />سؤال أخير المينى باص اللى فى الصوره ده انا حاسس كده انه خط رقم 27 بتاع المطار - عبد المنعم رياض"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134056/http://www.20at.com/article2.php?sid=657"

[[comments]]
order = 2
subject = "ياعينى على علب السردين ام عجل"
author = "Kranshy"
posted = "2006-04-03"
text = "كنت راكب الاتوبيس وفجاة واحدة جت اعدت جمبى ....<br />هى ..لأمش هى .. لأ هى..<br />هى دى اللى حلمت بيها يوم الاتنين اللى فات بعد صلاة الجمعة ايوة هى ...<br />وفجأة اتقلب الباص لجنينة كبيرة .. والدبان بأة فراشات رقيقة بتطير حوالينا .. واصوات الماتور بتاع العربية الخربان بأة واحد من اكتر السمفونيات رومانسية<br />بدأت ابصلها وقررت اكلمها<br />قولت الواحد يطلع من اولها جدع ويحاسبلها أل يعنىا نى كريم وانها لو كلمتنى مش هحرمها من حاجة<br />\"خد ياعم انا والابلة .. خلاص انا حاسبتلك\"<br />قولت كدة للكمسرى وانا خايف انها ترفض<br />بس على العكس لقيتها ضحكت وبقمة الرومانسية قالتلى شكرا<br />طرااااخ....<br />دة صوت الاتوبيس لما وقف وبقدرة قادر لقيت نفسى برة انا اخر حاجة فاكرها انى كنت قاعد بس بمجرد ما وقف كل حاجة طارت وانا طرت معاهم<br />البنت .. هى راحت فين<br />لا لا مش هتضيعى منى انا لسة دافعلك دم قلبى<br />بصيت عليها فى كل حتة لقيتها فى اخر الشارع جريت وراها وقولتلها لو سمحتى<br />بصتلى بطريقة غريبة وكأنها اتحولت ولقيتها بتقولى انتة مين<br />أنأمين اية انا اللى كنت لسة راكب معاكى الاتوبيس<br />بصتلى من فوق لتحت وقالتلى انا مبركبش غير تكس<br />لا اكيد مكنتش بحلم<br />قولتلها انا لسة محاسبلك انتى نسيتى ولا اية<br />محسابلى مين هتمشى ولا الم عليك الناس كهلم<br />يالهووووووووووووووووووو...<br />مكملتش الكملة وطبعا الشعب المصرى كله ساعتها خدتة الرجولة والشهامة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134056/http://www.20at.com/article2.php?sid=657"

