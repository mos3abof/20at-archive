subject = ""
author = "مش البراء اشرف ولا شريف الدواخ"
posted = "2008-07-03"
text = "عبله الكحلاوي بتعرف ترسم عندها مرسم حر في بيتها اللي في المقطم<br />مبروك عليه يا شعب مصر<br />الف مبروك يا شعب مصر امن مركزي وجعانين<br />مبروك للغرقانين مبروك للمحروقين مبروك للمعتقلين مبروك للمسجونين مبروك للصايعين.. الف الف مبروك يا شعب مصر<br />واحنا متشكرين اوي يا استاذ منير اديب على المعلومات الهايلة دي اللي اتحفتنا بيها<br />يا سلام يا استاذ منير اديب عبله الكحلاوي رسامة… الله يا استاذ منير اديب<br />والطريف ان بنت الحاج عبدالفضيل بتقولك (ميرسي).. طلعت خواجايا من فرنسا<br />يعني شكرا بالفرنساوي<br />يظهر ان بنت الحاج عبدالفضيل بأه باين عليها مدارس لغات خالص<br />معلش باه احنا عندنا في عين شمس والمطرية ما فيش مدارس لغات<br />يلا بأه حظنا كده"
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715130001/http://www.20at.com:80/masr/t7kyk/9513.html"

