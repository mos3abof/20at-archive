author = "مش ححبك"
posted = "2008-07-03"
text = "النبي محمد صلى الله عليه وسلم بعث نبيا ومعلما ومرشدا وهاديا صلوات الله وسلامه عليه<br />وجاء بالمنهج (القران والسنه)<br />اللي بيحب النبي محمد صلى الله عليه وسلم يمشي على القران والسنه<br />ينصر القران والسنه<br />ما يعدش يغني ويمدس<br />لان مهما قلنا في النبي محمد صلى الله عليه وسلم لن نوفيه حقه<br />وحق النبي محمد صلى اغلله عليه وسلم اننا نتبعه صلوات الله وسلامه عليه"
archived = "2009-07-15"
