author = "سلومة"
posted = "2009-04-30"
text = "نتبرع لية —— هؤلاء الناس الزبالين عندهم ملايين —- لان مشروع تربية الخنازير حاجة كدة ببلاش — مفيش لا علف ولا تغذية ولا اى تكلفة - لان الخنازير بتاكل الزبالة والوساخة وكل القاذورات وكل اللى بيعملوا صاحب المشروع انة بيشترى دكر خنزير وكم انثى خنزير وبيتكاثروا بطريقة غريبة اكتر من الارانب وبياكلوا ببلاش وبيناموا فى العراء والقذارة وبعدين صاحب الخنازير بيبيع الخنزير الكيلو ب 5 جنية لحم حى قبل الدبح<br />وطبعا لا يدفعوا ضرايب ولا ضريبة مبيعات ولا اى حاجة خالص"
archived = "2009-05-02"
capture_url = "https://web.archive.org/web/20090502102916/http://www.20at.com:80/t7kyk/11928-2009-04-30-13-04-49.html"

[[comments]]
