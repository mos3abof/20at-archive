subject = ""
author = "مصطفى سالم"
posted = "2009-05-01"
text = "فرصة عظيمة للدولة المصرية للتخلص من العشوائيات<br />- فبعد ذبح الخنازير والتخلص منها يجب اعادة المربين الى قراهم الاصلية فى صعيد مصر ليشتغلوا بالزراعة ويتركوا جمع الزبالة لشركات متخصصة - فمعظم عائلات مربى الخنازير فى مقالب الزبالة قادمين من قرى ونجوع تتبع محافظة اسيوط واستوطنوا مقالب الزبالة وبنوا عشش يقيمون فيها مع الخنازير وكانت منظمة اقباط المهجر تستغل وضعهم المزرى وتنشر صورهم وهم فى وسط الزبالة وكان الدولة اجبرتهم على الاقامة فى هذا المكان - بل ان الناشطين من بتوع المهجر كان يعلق تلك الصور فى الكنائس الامريكية ويجمع تبرعات على ذلك الوضع<br />- نعم ان للدولة المصرية ان تتخلص من تلك المناظر الكئيبة وترحل هؤلاء الناس الى مواطنهم الاصلية وتنتزعهم من وسط الزبالة فهم اصبحوا يشكلون حزام عشوائى خطر حول القاهرة"
archived = "2009-05-02"
capture_url = "https://web.archive.org/web/20090502102916/http://www.20at.com:80/t7kyk/11928-2009-04-30-13-04-49.html"

[[comments]]
order = 2
subject = ""
author = "ابو السعود"
posted = "2009-05-02"
text = "احد مربى الخنازير صرح بان لحم الخنازير هو المصدر الرئيسى للحوم اللانشون والبلوبيف<br />اية القرف دة<br />فين الدولة<br />يعنى بناكل لانشون من لحم الخنازير - اللة يقرفكم<br />ابيدوا هذة المزارع واحرقوها بجاز وسخ —- شىء لا يصدق اللانشون والبلوبيف مصنوع من لحم الخنازير - يا نهار اسود - ولية لا - مالفساد منتشر فى كل مكان ولا حد بيراقب واذا كان بيراقب فبيقبض قرشين رشوة ويسكت<br />انا قرفان جدا"
archived = "2009-05-02"
capture_url = "https://web.archive.org/web/20090502102916/http://www.20at.com:80/t7kyk/11928-2009-04-30-13-04-49.html"
