subject = "احسن تعليق"
author = "أرسل هذا التعليق بواسطة : مش لازم"
posted = "2006-11-05"
text = "يا جماعة ما تخدوش الامور بهذا الشكل الشواذ دول ناس المجتمع جنى عليهم زي المعاقين بالضبط ما لهمش ذنب انهم طلعوا شاذين<br />علشان خاطر الحكومات بتحاول ترفع من روحهم المعنوية بهذه المسابقات زي المعاقين تماما ليهم العاب رياضية واولمبياد وخلافه<br />خلي عندكم شوية رحمه<br />ــــــــــــــــــــــــــــــــــــ<br />دا احسن تعليق في التعليقات اللي فوق فعلا لان مفيش حد فرحان انه شاذ الشاذ اصبح شاذ لان المجتمع جنى عليه وجعله شاذ ولازم يبقى فيه رحمة بهؤاء الشاذين<br />ولو انتوا طلعتوا شاذين تحبوا الناس تقول عليكم كده<br />وفي الغرب بيعملولهم نوادي خاصه ومجتمعات خاصة علشان خاطر يتعايشوا فيها بسلام"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015008/http://masr.20at.com:80/article.php?sid=1117"

[[comments]]
order = 33
subject = "يا ريت نفوق ونعرف منين نبدأ .. البداية بتغيير مبارك وكل نظامه بالكامل"
author = "إبن بهية"
posted = "2006-11-05"
text = "استضافت الإعلامية اللامعة منى الشاذلي عدداً من فقهاء القانون المصري ومعظمهم شاركوا في وضع ذلك الدستور المسمى بدستور 71 ، قال جميعهم ذات القصة من أن أنهم كانوا في لجنة شكلت لوضع الدستور وبالفعل وضعوا دستوراً جيداً كان من المفترض أن يطرح للاستفتاء عليه وتم تقديمه إلى السادات ولكن الدستور تمت إعادة صياغته مرة أخرى وطرح بهذه الصورة المهترئة وتمت الموافقة عليه بالطبع بواسطة السادات وزمرته فقط وقيل أن الشعب وافق.<br />المهم في سؤال آخر للأساتذة واضعي ذلك الدستور الذي تقطع إرباً بعد وضعهم له ، ما الفرق في المواد بين هذا الدستور وما وضعتموه ؟ قالوا لا يوجد فرق .. لا يوجد أصلاً مقارنة فهذا الدستور مختلف تماماً عما وضعناه. في سؤال ثالث ، ما رأيكم في هذا الدستور ؟ الرد هو لا يصلح أصلاً ليسمى دستوراً. بس خلاص انتهى كلام أساتذة القانون وجاء الدور علينا لنتكلم نحن لأننا نحن المعنيين بهذا الدستور المخطط والكاروهات.<br />ومن باب أنني مواطن مصري ومعني بهذا الدستور أرى أن لا حاجة لنا أصلاً بدستور في الفترة الحالية لسبب بسيط جداً وهو أنه غير مستخدم ولا محترم ، لا من مبارك وعصاباته ولا من المحاكم التابعة لمبارك والتي ليس بها قضاة مصريون من بتوع نادي القضاة الغلابة ولكن قضاة محاكم مبارك بها قضاة عشر نجوم يستاهلوا الحرق في ميدان التحرير بعد كل حكم يحكموه ظلماً وعدواناً على عباد الله .<br />المهم أن الحديث عن الدستور في بلاد معطل فيها الدستور أصلاً منذ عقود طويلة بفعل قانون مبارك (الطواريء) يعتبر نوعاً من العته والبعد عن الموضوعية في رأيي ، ففي البداية لابد أن يكون لدينا نظام سياسي محترم يمكنه أن يحترم الدستور والقانون ، لنتخلص أولاً من مبارك وعصاباته كخطوة أولى وأساسية نحو تحرير ونهضة مصر ، ثم يلي ذلك ت<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015008/http://masr.20at.com:80/article.php?sid=1117"

[[comments]]
order = 34
subject = "تغيير النظام الفاسد أولى من تغيير الدستور"
author = "إبن بهية"
posted = "2006-11-05"
text = "تزايد الحديث كثيراً عن الدستور في الآونة الأخيرة ولاسيما بعد تعطف وتكرم وتلطف الزعيم المزعوم لمصر حسني مبارك ومنح مصر فرصة لتغيير المادة 76 لتكون راكبة عليه وعلى إبنه بالتمام والكمال ، واشتد الحديث عن الدستور فيما تلى ذلك من الأيام إلى وقتنا هذا ، وأنا في رأيي أن هذا الكلام عن الدستور والتغيير ليس هذا وقته بالمرة ، عن أي دستور نتحدث ؟! أي دستور يريدون أن يعدلوه ؟! أية مادة تلك التي يريدون تصحيحها؟! إبني في المرحلة الإبتدائية يقول أن نص المادة 76 بعد التعديل المباركي صار أحلى من جوابات حراجي القط لزوجته التي فضحها الشاعر عبدالرحمن الأبنودي الله يسامحه. لكن إبني دارس الآخر دارس الروضة يرى أنه لا مجال اليوم للحديث عن دستور وبطيخ قبل تغيير النظام الفاسد بكامله.<br />منذ أشهر استضافت الإعلامية اللامعة منى الشاذلي عدداً من فقهاء القانون المصري ومعظمهم شاركوا في وضع ذلك الدستور المسمى بدستور 71 ، قال جميعهم ذات القصة من أن أنهم كانوا في لجنة شكلت لوضع الدستور وبالفعل وضعوا دستوراً جيداً كان من المفترض أن يطرح للاستفتاء عليه وتم تقديمه إلى السادات ولكن الدستور تمت إعادة صياغته مرة أخرى وطرح بهذه الصورة المهترئة وتمت الموافقة عليه بالطبع بواسطة السادات وزمرته فقط وقيل أن الشعب وافق.<br />المهم في سؤال آخر للأساتذة واضعي ذلك الدستور الذي تقطع إرباً بعد وضعهم له ، ما الفرق في المواد بين هذا الدستور وما وضعتموه ؟ قالوا لا يوجد فرق .. لا يوجد أصلاً مقارنة فهذا الدستور مختلف تماماً عما وضعناه. في سؤال ثالث ، ما رأيكم في هذا الدستور ؟ الرد هو لا يصلح أصلاً ليسمى دستوراً. بس خلاص انتهى كلام أساتذة القانون وجاء الدور علينا لنتكلم نحن لأننا نحن المعنيين بهذا الدستور المخطط والكاروهات.<br />ومن باب<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015008/http://masr.20at.com:80/article.php?sid=1117"

