posted = "2006-11-29"
text = "انم ليه مستغربين من مشاركة مصر فى ملكة جمال المخنثات يا جماعة دى نتيجة طبيعيه جداً لاهدار كرامة الانسان المصرى و ضياع حقوقه الانسانية و الشرعيةمن قبل الحكومة الفاسدة فأذا كان الوطن بهين ابناءه فلماذا لا يهينون الابناء اوطانهم من فضلكم انظرو الى كم الفساد والفقر الموجود فى البلد شوفو العشش التى يسكن فيها الفقراء شوفو المياه الملوثة والطعام المسرطن شوفو القهر و الاستبداد السياسى الذى يعانى منه المواطن المصرى عندئذ سوف تدركون لما يبيع الناس اوطانهم و دينهم ولكنى على ثقة بأن هذة الغمة سوف تزول بأذن الله بشرظ أن لا نكف عن الحوار و النفد"
