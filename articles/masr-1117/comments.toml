subject = "الى مش مهم اللى مش مهم"
author = "مسلم مصرى"
posted = "2006-11-09"
text = "معلش فكرنى جريدة المصريين اللى انتا جايب منها الخبر دى بتبيع اية ؟<br />احة نص جرايد البلد كلام فاض وكذب وانتا عاوز تشتم مصر كلها علشان جريدة زبالة<br />اما كلامى عن الاخوانجية فالاخ اللى بيقول انهم قضوا نص عمرهم فى السجبن علشان يبلغوا رسالة لاطبعا دول قضوا نص عمرهم علشان هما بلطجية<br />واللى عاوز يبلغ رسالة يروح الازهر يتعلم ويبقى قفية مش كل يوم واحد دكتور ولامهندس ولامدرس ولاصنايعى ربى دقنة وجاى يفتى فى الدين يحرم ويحلل بمزاجة<br />من الاخر مصر مش حتكون زى السعودية ريحوا بالكم ويااخوانجية وروحوا السعودية علشان اللى زيكم هناك<br />اسمهم منافقيين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015008/http://masr.20at.com:80/article.php?sid=1117"

