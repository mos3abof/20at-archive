subject = "شوفوا غيرها"
author = "طليعة الاحتضار"
posted = "2006-11-23"
text = "شوفوا غيرها حكاية التعليقات هذه البلد بتقع وبتنهار والله العظيم والتعليقات تجعلكم اشبه بمن اخذ قلما على قفاه ثم قال اى بعد 25سنةوكن اللى رزعه القلم عدى مرحلة الفعل الفاضح الشاذ ومش قادر اتخيل هو ايه بالضبط المهم ان احنا لسه بنقول اى على القلم اللى كان على القفامن 25سنة<br />ثم ان مسالة مسابقة الشواذ هذه اغضبتكم ونحن شعب شاذ بكل المقاييس (ولا اقصد شذوذ جنسى طبعا وان كان موجودغالبا)ولكن اقصد الشذوذ الفكرى والعاطفى ......الخ يايادة افيقوا اصبحنا خارج التاريخ والحياه اما ان نتحول الى بشر لهم عزم الانبياء واما هو الاحتضار ما رايكم البحث عن حلول وتحديد شكل وموعد لمعركة حقيقية فاصلة تعيدنا الى الحياة والتاريخوليكن هذا موضوع للبحث والسلام"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015008/http://masr.20at.com:80/article.php?sid=1117"

