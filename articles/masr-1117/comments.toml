posted = "2006-11-07"
text = "لأ لأ \"احه جدا هو كل اللي ما يعجبوش حاجة ينسبها للاخوان<br />طيب علي الحلال انا ما شفت احسن من الاخوان ودول ناس اخر جدعنه اينعم انا مش من الاخوان لكن الاخوان ناس ما فيش زيهم في البلد اللي نصها تعريص الاخوان ناس نضاف ناس ولاد بلد مش حراميه ونصابين زي ال0000فيها ايه واحد اخ محترم بيرفض الفجور والفسوق اللي بيحصل من معرصين بيقولو انهم مصريين دايرين على حل شعر امهم في بلاد برة ويقولو ديمقراطيه وحريه حريه ايه يا معرصين الناس دي بقر شوفو نهج البي والصحابه مش نهج الغجر الذين يدعون الحضارة اخوكم علي المصري almasre100100@yahoo.com"
