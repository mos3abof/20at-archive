[[comments]]
order = 73
subject = "قصيدة غزل"
author = "بن الملوح"
posted = "2006-12-02"
text = "يا حسني يا حرمنا أفرح واتهنا ***<br />واطلع من دورة وادخل على تانيه<br />محناش حسدينك لكن عرفينك *** هتاكل لوحدك ومش هتعبرنا<br />سوزي معاك وجيمي وراك<br />*** وشعبك خدامك<br />عاوز تحكمنا طيب ما يخالف ***<br />عاوز تلهفنا طيب أكلنا<br />كل يوم بيمر وشك بيكرمش ***<br />بتا كل أيه عرفنا<br />بتاكل أيه عرفنا<br />بتاكل ايه عرفنا<br />لا نؤخذه انتهت القصيدة ولم يرد حسني لأنه عنده ميعاد مع وزير الزباله في رحلة بحث عن لقمة العيش ........ رئيس مكافح"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073240/http://masr.20at.com:80/article.php?sid=1117"

