subject = "جرى اية يا بلد"
author = "سيبوها لله"
posted = "2006-11-26"
text = "جرى يا استاذ جمال هوا كل اللى بتفكروا فية الجنس وبس فكروا فنفسكوا ومشاكل البلد اللى انتوا عايشين فيها والا هوا معتش فية دم خالص وانا شوفت صورة البنت المصرية دى وسيبوها حسابها عند اللة خالقها كبير وفكروا فنفسكوا وبعدين من قلة المسابقات رايحة تشترك فى دى انا مش عارفة اية اللى بقى بيحصل حسبى الله ونعم الوكيل هيا عايزة تشتهر بس هيا بدأت غلط والموضوع كلة غلط وبعدين المشاهير خدوا اية يعنى من الشهرة كلنا ولاد واحد وجت عشان تعمل حاجة لنفسها قلبت الدنيا والبلد معاها على حاجة ملهاش اى لازمة ومش هترتاح لا فدنيا ولا فاخرة وبكرة تفتكرونى لان محدش هسيبها فى حالها واحنا عاوزين نعمل ونعمل وكدا كفاية اوى علها لانها متستاهلش حتى ان انا اتكلم عليها او اتعب قلبى معاها وانا عن نفسى هكبر دماغى من الحوار دا على الااااااااااااااااااااااااااااااااااااااااااااااااااااااااااخر<br />وشكرا"
