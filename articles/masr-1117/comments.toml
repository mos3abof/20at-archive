author = "خلي بالكم يا جماعة لازم نكون ناس متحضرين يعني مش معنى ان الموقع مفتوح وبينشر اي تعليق ان انا اشتم واسب"
posted = "2006-11-07"
text = "انت حضرتك بتقولي هي فين المصرية دي يا روح امك<br />انا جبتلك الخبر اللي وصل مصر عن طريق وكالات الانباء موجود فوق.<br />وانا عايز اعرف ايش دخل الاخوان المسلمين بهذا الموضوع.<br />الاخوان المسلمين لم يتعرضوا الى هذا الموضوع لامن قريب ولا من بعيد ولا الموقع (ولاد البلد) من مواقع الاخوان المسلمين<br />يبقى ليه انت بتقول (كفاية يا اخوانجية يا زباله)<br />الاخوانجية مش زباله الاخوانجية ناس اصحاب رساله عايزين يبلغوها للناس وفي سبيل هذه الرسالة كل واحد فيهم قضى نص عمره في السجن."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015008/http://masr.20at.com:80/article.php?sid=1117"

