text = "فى الحقيقة الكلام كتير بس فين اللى يسمعنا ربنا يتولانا برحمتة.احلى حاجة سمعتها ان مصر هتستورد الطماطم من ليبياعلشان الطماطم اللى بنزرعهامش مكفية الكوسة اللى فى البلدلا حول ولا قوة الا باللة العلى العظيم.احنا الشباب لا حول لنا ولا قوة احنا عايزين اللى يوجهنا الى الطريق الصحيح.شعار الحكومة اليومين دول(قلبى معكى يا مصر وجسدى وسلاحى مع اسرائيل) ان للة وان الية راجعون وشكرا بكالريوس اعلام السنة الرابعة"
