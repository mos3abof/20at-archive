posted = "2006-12-03"
text = "معاة حق اللى كاتب التعليق رقم 25 فعلا انتو كلكم داخلين تشتمو فى الحكومة لية هية الحكومةحتروح تمسك رقبة كل واحد بيغلط ولا حتروح تدور على كل الشواذ اللى فى البلد وتقتلهم ولا كل حاجة نعلقها فى رقبة الحكومة و عيب الكلام دة يتقال عن مصر حرام عليكم مصر تستاهل ناس احسن منكم يتكلمو عنهاو مهما حملتو تشوهو صورتها عمركو ما حتقدروا ابدا و شكرا"
