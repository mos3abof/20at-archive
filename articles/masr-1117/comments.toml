text = "دائما كنت اعتقد ان الامة بشكل طبيعي ان تتفاخر باشياء علمية تكنلوجية لتنافس من هم اكثر تقدما منها لكن التنافس على شيء من هذا النوع انة لخزي ان اعتقد انكم خير الامم حضارات وان تثبتوا عكس ذلك انا كفلسطيني اقطن دولة اسرائيل ارى في سياسة الدوولة العبرية انه لو حدث مثل ذلك عندنا في اسرائيل لكانت القيامة قامت على روؤس الحكومة ومن قبل من من قبل المتدينين اليهود (החרדיים)افلا تكون او يكون في دولة اسلامية كعندكم اعتراض لدى الحكومة لنبذ تلك الظاهرة الملعونة اهل مكة باعتقادي ادرى بشعابها واللة الموفق"
