[[comments]]
order = 43
subject = "الى الاخ اللي فوق"
author = "مش مهم"
posted = "2006-11-06"
text = "المصريون ـ خاص : بتاريخ 29 - 10 - 2006<br />في مسابقة تعد الأولى من نوعها، أعلنت تايلاند رسميًا عن مشاركة مصر في الجولة الأخيرة من منافسات مسابقة اختيار ملكة جمال المخنثات جنسيًا والتي تقام في بلدة بتايا الشاطئية.<br />وقالت اللجنة المنظمة للمسابقة إن مشاركة مصر تأتي مع دول أخرى من المكسيك وأمريكا وأستراليا وماليزيا والفلبين واليابان، وإن المتسابقين من تلك الدول قدموا لتايلاند بعد تصفيات أجريت في بلدانهم.<br />وقد رصدت اللجنة 10 ألاف دولار للفائز أو الفائزة بلقب ملكة جمال المخنثات جنسيًا. وقد قدم المتسابقون رقصات عارية في ملهى تيفاني في تايلاند، الذي يعد أكبر ملهى في العالم للمخنثات جنسيًا. وحسب برتوكول المسابقة سيتم رفع علم مصر وعزف السلام الجمهوري والنشيد الوطني في حال حصول المتسابق المصري على الجائزة.<br />ــــــــــــــــــــــــــــــــــــــ<br />لازم تعرف يابابا ان الاخوان المسلمين حصلوا على خمس مقاعد البرلمان رغم تزوير الحكومة للانتخابات.<br />ولو فيه انتخابات حرة حيفوزوا بكل المقاعد. سواء رضيت او لم ترضى ان كنت مسلم شيوعي او مسيحي قبطي مش مه."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015008/http://masr.20at.com:80/article.php?sid=1117"

