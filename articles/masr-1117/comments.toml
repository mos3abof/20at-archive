author = "شيماء"
posted = "2006-11-04"
text = "السلام عليكم..<br />هل سيتحول الفساد والإفساد في الأرض عادي بـــالنسبة لنا؟؟ هل ضاعت الأخلاق والقيم<br />وصــــــــار التمييع هو الأسلوب المتبع<br />لحكوماتنا الموقرة؟؟ وتشغيـــل أسطوانة<br />الدنيا ربيع والجو بديع ومفيش فسـاد ولا<br />حد مات هتفضل شغالةوهنفضل أحنا بنسمعها؟<br />لحد ما يكون عادي كل شئ عــادي.. عـادي<br />أخـتك يهتك عرضها عادي، أخوك يتفرج على<br />أفــلام إباحية ويشرب مخدرات عادي ما كل<br />الشبـاب كدة، وللأسف الفــساد دخل بلادنا<br />واحدة واحدة والناس نايمة، نتيجة لحملات<br />التنويـــــم المغنطيسي للمبادئ والأخلاق<br />والقيم اللي بتعملها وسائل الإعلام، فكم<br />نـــرى في الأفلام شاب سارق وشمام وزاني،<br />وفاشل وفي كل العبر لكنه صاحب قلب أبيض<br />ويخرج المشاهدين متعاطفين معه، وحبين<br />هذه الشخصية..<br />تبًا لبلدًا لا تحق الحق ولا تبطل باطل..<br />وكم من ملك رُفعت له علامات.. فلما علا مات<br />الله المنتقم.."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015008/http://masr.20at.com:80/article.php?sid=1117"

