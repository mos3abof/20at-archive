[[comments]]
order = 22
subject = "حرام عليكم انتم واتقوا الله فينا"
author = "رامي"
posted = "2006-11-03"
text = "الحوادث الفردية اللي زي دي بتستخدمها فئات لأجل مصالحها الشخصية<br />الموضوع ده قذر ووصمة عار وصورة قذرة عن مصر والمصريين واتقوا الله فيناولازم ينحذف<br />أي عربي دخل وقرا الموضوع تفتكروا هيقول ايه؟<br />ده مجرد ان كاتب في الموقع كتب موضوع عن افطار بعض الشباب السعودي في نهار رمضان دخلك اخوة سعوديين وقلبوا الموضوع وقالولكم \"كارهينا يا شعب القذارة .. يا شعب الصراصير يا مصريين يا جاعنين ياولاد بلد الرقاصات\"<br />مفيش عقل ولا دماغ بتفكروا بيها أبدا!!!!<br />مجرد جزم في أمخاخكم؟؟؟؟<br />انتم بتضروا مين ولا بتدنسوا صورة مين ولا الفايدة من ورا ده كله ايه في الأخر ربنا ينتقم منكم؟<br />تنتقدوا الحكومة؟ .. طب متنتقدوها لكن بعقل شوية<br />والكاتبة الفالحة تقولي نشيد مصر وننظم مسابقات .. مسابقات ايه اللي بتتنظم!!!<br />هي البلد بيتنظم فيها مسابقات شواذ؟!!!<br />دول كانوا اندبحوا واتعلقت روسهم علي أبواب القاهرة؟<br />والله منا عارف أقول ايه .. المصيبة انكم مصريين وعارفيين مجتمعكم كويس .. طبعامجتمع مش مثالي لكن عمرنا ما وصلنا للدرجة اللي نتكلم فيها بالطريقة دي ونفتح فيها موضوع زي ده .. المصري متدين بالفطرة ومصر بلد الأزهر .. اتقوا الله شوية<br />بنقول علم مصر يترفع ونسمع النشيد الوطني .. ليه ان شاء الله أولمبيات الدولة مشتركة فيها بشكل رسمي ولا واحدة يمكن يكون لها أصل مصري وعايشة بره ودخلت فيها .. هل ده معناه انها ممثلة عن مصر ونشيد مصر وعلم مصر؟؟؟<br />انتم بتتكلموا ازاي بس!!!<br />ده حتي مسابقات ملكات الجمال واللي بتمثل مصر فيها فده بيتم بشكل صغير وعلي الضيق وعن طريق شركات مش زي دول العالم الباقية<br />فما بالكم بواحدة شاذة خارجة في مسابقة خارجية<br />وبعدين اللواط منتشر في الدول الخليجية ومدارسها بشكل رهيب .. هل حد من أولاد البلاد دي لجأ لكتابة مقال<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015008/http://masr.20at.com:80/article.php?sid=1117"

[[comments]]
order = 23
subject = "المتعوس في بلاد الروس"
author = "إبن بهية"
posted = "2006-11-04"
text = "يصلح هذا العنوان ليكون اسماً لمسلسل فكاهي من تلك الكوميديا السوداء التي يقدمها الفنان المحترم جداً محمد صبحي .. بدأت أحداثه في موسكو منذ يومين حين صرح الزعيم المزعوم لمصر حسني مبارك إلى إحدى الصحف الروسية بأنه نصح الرئيس الروسي بوتين بأن يرشح نفسه لفترة رئاسة ثالثة .. ونصحه بألا يرضخ لمن يطالبه بالرحيل ... طبعاً تاني يوم قامت الدنيا ولم تقعد حتى اللحظة ... صدرت في اليوم التالي كل الصحف الروسية تسب وتشتم وتهزأ في المهزأ أصلاً المتعوس بتاعنا.<br />الصحف الروسية شتمت مصر في شخص المتعوس رئيسها العميل لأنه بالإضافة إلى أنه عميل فهو حمار بعيد عن السامعين .. مش كنت تذاكر أي كتاب مطالعه روسي قبل ما تتنيل على عينك وتفضحنا بغباوتك اللي سايقها علينا منذ عينك السفير الأمريكاني نائباً للسادات بواسطة ذلك الفاكس الشهير الذي شاهده الملايين على الفضائيات منذ أسابيع ؟؟؟ نازل تشويه في سمعة مصر برة وجوة ليه كده ؟؟؟ .. والله إنه حقاً تشويه كبير لسمعة كل المصريين لأن الصحف الروسية نزلت فيه بهدلة وسب وشتيمة ووصفته ضمنيا بالحمار من غير ما ترسم ديله طبعاً من أجل اللياقة السياسية لكن الديل كان باين بوضوح شديد في كل كلمة كتبت عن ذلك التصريح الحصاوي.<br />ألم تجد أيها الزعيم الحصاوي في زمرة العصابة التي تسميها حكومتك أي بني آدم فهمان ((ربع لبه)) يفهمك أن الدستور الروسي لا يعطي رئيس الجمهورية الحق في الترشيح لأكثر من فترتين ؟؟؟ فخفخامة جلالة العبيط رايح يستعبط هناك برضه في روسيا ويغير لهم المادة 76 ولا إيه ؟؟؟؟ واضح أن الزهايمر عامل عمايله معاه وبقى زي حمار الحكومة لابد من لطشه عيار في راسه عشان يرتاح ويريحنا كمان من غباوته وصهينته وعمالته.<br />الواطي دخلت معاه السلوك في بعضها فراح ملخبط ما بين الدستور المص<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015008/http://masr.20at.com:80/article.php?sid=1117"

