[[comments]]
order = 0
subject = "البعد عن منهج النبي صلى الله عليه وسلم"
author = "ابومحسن"
posted = "2006-10-18"
text = "البعد عن منهج النبي صلى الله عليه وسلم هو الذي اوصلنا الى هذه الحالة والحل هو العودة لمنهج النبي صلى الله عليه وسلم وللاقتناع بمنهج النبي يستلزم دراسة<br />اولا: حال الجزيرة العربية قبل البعثة المحمدية.<br />2) دراسة السيرة النبوية.<br />3) دراسة حال الجزيرة العربية بعد وفاة النبي وتاريخ الخلفاء.<br />وذلك لنرى ان النبي محمد بعث لناس همج لا ماضي لهم ولا حاضر ولا مستقبل كيف غيرهم صلوات الله وسلامه عليه وجعلهم خير امة اخرجت للناس وفي اقل من مائة عام اصبحت هذه الامة تحكم من اسبانيا الى الهند.<br />والكلام في هذا الموضوع يطول شرحه والمكتبة الاسلامية موجوده لمن يريد ان يبدأ"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105055330/http://masr.20at.com:80/article.php?sid=1066"

[[comments]]
order = 1
subject = "ادعية ضرورية للعودة الى الله"
author = "ابو محسن"
posted = "2006-10-18"
text = "ادعية في القرآن الكريم مرتبة حسب ترتيب المصحف الشريف<br />الرقم الاول هو رقم السورة والرقم الثانى هو رقم الاية<br />ربنا تقبل منا انك انت السميع العليم (2/127) ، وتب علينا انك انت التواب<br />الرحيم (2/128) ، ربنا اتنا في الدنيا حسنة وفي الاخرة حسنة وقنا عذاب النار<br />(2/201) ، ربنا افرغ علينا صبرا وثبت اقدامنا وانصرنا على القوم الكافرين<br />(2/250) ، ربنا لا تؤاخذنا ان نسينا او اخطانا (2/286) ، ربنا ولا تحمل علينا<br />اصرا كما حملته على الذين من قبلنا (2/286) ، ربنا ولا تحملنا ما لا طاقة لنا<br />به واعف عنا واغفر لنا وارحمنا انت مولانا فانصرنا على القوم الكافرين (2/286)<br />، ربنا لا تزغ قلوبنا بعد اذ هديتنا وهب لنا من لدنك رحمة انك انت الوهاب<br />(3/8)، ربنا انك جامع الناس ليوم لا ريب فيه ان الله لا يخلف الميعاد (3/9)،<br />ربنا اننا امنا فاغفر لنا ذنوبنا وقنا عذاب النار (3/16)، اللهم مالك الملك<br />تؤتي الملك من تشاء وتنزع الملك ممن تشاء وتعز من تشاء وتذل من تشاء بيدك الخير<br />انك على كل شيء قدير (3/27) ، تولج الليل في النهار وتولج النهار في الليل<br />وتخرج الحي من الميت وتخرج الميت من الحي وترزق من تشاء بغير حساب (3/27) ، رب<br />هب لي من لدنك ذرية طيبة انك سميع الدعاء (3/38)، ربنا امنا بما انزلت واتبعنا<br />الرسول فاكتبنا مع الشاهدين (3/53)، ربنا اغفر لنا ذنوبنا واسرافنا في امرنا<br />وثبت اقدامنا وانصرنا على القوم الكافرين (3/147)، ربنا ما خلقت هذا باطلا<br />سبحانك فقنا عذاب النار (3/191)، ربنا انك من تدخل النار فقد اخزيته وما<br />للظالمين من انصار (3/192)، ربنا اننا سمعنا مناديا ينادي للايمان ان امنوا<br />بربكم فامنا (3/193)، ربنا فاغفر لنا ذنوبنا وكفر عنا سيئاتنا وتوفنا مع<br />الابرار (3/193) ، ربنا واتنا ما وعدتنا على رسلك<br />اقرأ بقية التعليق .."
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105055330/http://masr.20at.com:80/article.php?sid=1066"

[[comments]]
order = 2
subject = "عفواً سيد أبو محسن"
author = "الخولي"
posted = "2006-10-18"
text = "سيد ابو محسن شكراً لك على هذا الكلام الجميل الذي تفضلت به، لكن سيدي العزيز أستسمح عذرا فهذا الكلام يمكن أن نضعها تحت أي عنوان وأي موضوع ، وهو منهج رائع لا غبار عليه، لكن ما هي العلاقة المباشرة بينه وبين هذا الموضوع المنشور على وجه الخصوص. مرة اخرى لك كل الشكر"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105055330/http://masr.20at.com:80/article.php?sid=1066"

[[comments]]
order = 3
subject = "الى الاستاذ خولي"
author = "ابومحسن"
posted = "2006-10-18"
text = "الاسلام منهج حياه كامل يا استاذ خولي والموضوع عن الطلاق ولو كان فيه دين عند الناس ما كنش وصل امر الطلاق الى هذا الحد وانا يا اخي بشتغل موظف في محكمه في احدى الدول العربية تتصور ان فيه واحد عريس جه يطلق عروسته وهو لسه ما استلمش قسيمة الجواز من المحكمة تتصور هذا وكل هذا هو البعد عن منهج الله وسنة النبي محمد صلى الله عليه وسلم ولازم تقرأ حياة الصحابة في المجتمع المدني وشوف الجواز والطلاق كان ايامها ازاي"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105055330/http://masr.20at.com:80/article.php?sid=1066"

