[[comments]]
order = 5
subject = "خليها على الله"
author = "مهتمه"
posted = "2006-10-19"
text = "والله اعتقد ان مسألة اللقب ، عانس ولا مطلقة ولا خالعة مش فارق كتير لكن المهم ان الانسان يكون طائع لله ، عانس طائعة جميل ، مطلقة طائعة قدر الله ومما شاء فعل ، خالعة طائعة جزاها الله خيرا ، الامور دي اقدار ولا راد لقضاء الله ، لكن المهم انها تسأل نفسها انا علاقتي بربنا عاملة ازاي ؟ والباقي بقى تسيبه على الله"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105055330/http://masr.20at.com:80/article.php?sid=1066"

[[comments]]
order = 6
subject = "المجتمع زي الرصيف وسخ وعايز يتكنس"
author = "معاذ"
posted = "2006-10-19"
text = "للأسف المجتمع ينظر للمرأة بطريقة مزدوجة لا خلاف فيها<br />بالنسبة للطلاق فان الناس ينظرون للمطلقة باعتبارها مجرمة وأنه لابد كان فيها عيب كبير جعل زوجها يتركها, ولا يفكر أحد أبدا أن الزوج يمكن أن يكون غير متناسب معها أو أنه هو المعيب<br />الأدهى من ذلك أن الفتاة التي تفسخ خطبتها أكثر من مرة ينظر لها هي أيضا على أنها معيبة لأنها لم تتم لها خطوبة وكأن الخطبة لا تحتمل الا الزواج, مع أنها شرعت لمحاولة التقرب بين العروسين فان لم يتقاربا أو وجدا أنهما متنافرين فلابد أن يفسخا خطبتهما<br />أما بالنسبة للعنوسة فللأسف المصريون ينظرون في الغالب للفتاة التي تعدى عمرها الخامسة والعشرين على أنها عانس مع أن هذا السن هو السن المثالي للزواج<br />لذلك تضطر المرأة المقهورة في كثير من الأحيان الى الزواج برجل لا ترضاه ولا تشعر معه بأي توافق أو أي ميل ناحيته<br />وبعد الزواج اذا صارت الحياة جحيما معه تجد نفسها غير قادرة على اتخاذ قرار الطلاق اما لأن الرجل يرفض أن يتركها بالمعروف وهي طبعا لا تحب اللجوء للمحاكم خوفا على سمعتها, واما لأنها تخاف أن تحمل اللقب العظيم (مطلقة) لأن هذا اللقب كما قلت يجعلها دائما امرأة فاجرة لم تستطع الحفاظ على بيتها وبالتالي يصير الزواج ساعتها مستحيل<br />وفي الحقيقة هي دائرة مفرغة من القمع والقهر ضد المرأة في كل ألأطوار عمرها."
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105055330/http://masr.20at.com:80/article.php?sid=1066"

