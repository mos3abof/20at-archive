[[comments]]
order = 40
subject = "كس امك يا ليثي اقصد كيمو العجلاتي"
author = "عادل"
posted = "2006-10-09"
text = "شوك يا عجلاتي يا بن الحمار انت مهما غيرت اسمك فانت معروف من اسلوبك الوسخ ولو كان عندك ذرة وطنية ومصرية يا معفن انت كنت رديت علي الكلب العربي اللي اسمه الطرابلسي وهو بيسب مصر وبيقول عليها شحاته وبيحاول الانتقاص من دورها في الحرب مع اسرائيل لكن امثالك من الخونة واللي بيلعقوا احذية العرب عشان بينكوك بالفلوس انت وامك بس كنت بحسب عندك ذرة وطنية لكن هيهات للخولات العبيد اللي زيك اللي بايعين نفسهم وعرضهم لشوية الاعراب اللي طول عمرهم ماحبوا مصر وده اللي غايظكم من البطل السادات اللي كان بيشوف مصلحة بلده اولا صعب ان خول زيك تكلمه عن الكرامة وحب الوطن احنا عندنا مصر اولا ومصر فوق الجميع والارتباط بهؤلاء العرب المتخلفين يجرنا للخلف ودي كانت نظرة الزعيم الوطني سعد زغلول الذي كان بيقول علي العؤب صفر زائد صفر يساوي صفر اما انت المهم مصلحة طيزك الواسعة بس يا لوطي ياخول واخيرا السادات سيدك وكس امك علي كس ام العرب الحاقدين"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 41
subject = "لأ عدلات مش دول محور تهاجمي"
author = "ليفي معاذيير"
posted = "2006-10-09"
text = "المرة عدلات دي داخلة مزاجي قوي وفعلا يهودية أصيلة برافو يا عدلات. بس يا روحي النهاردة مصر ودول خليج فارس والسعودية والأردن وإسرائيل أصبحهم حلف ضد سوريا وإيران والفسطينين، بمعني إشتمي دول التطرف دي وسبيكي من الحلف المقدس بتاعنا ده، دي آخر التعليمات.<br />طبعا السادات كان صديق إسرائيل الوفي وكل إسرائيل علية زعل لما مجرم إسلامبولي مجنون موت بطل سادات، لكن يا حبيبتي إسرائيل عبرت عن وفاءها بإصرارها بإعدام قتلة سادات، وكمان برعاية إسرته وأقاربه كويس جدا جدا جدا جدا جدا جدا.<br />دلوقتي النهارده بعد عدوان خسن نصر الله على دولة إسرئيل المسالمة بقت السعودية ولأردن ودول خليج فارس كله ومصر محور واحد بلاش تهاجمي دول دي عدلات إحنا نحتاجهم دلوقت..فاهمة؟<br />بالنسبة للولد إرهابي عجلاتي كيمو إحنا نتصرف معاه كويس ويروح معتقل ويتأدب.<br />ياريت كل ناس فكر زي إنتي عدلات وزي أنا كان عالم كويس كتير أصبح نهارده."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

