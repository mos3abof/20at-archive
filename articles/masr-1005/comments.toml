text = "اسمع ياله ياخول بالوراثة ياعجلاتي يانجس انت حكم الشرع فيك وفي أمثالك انه يلقي بك من فوق جبل حتي الموت الكلام مع عيل متناك ابن متناكة زيك بيسترزق من اي عربي لوطي معروف من زمان حب العرب للغلمان الكلام مع النجاسة اللي زيك انحدار وتدني و أكيد طبعا انت مش مصري مصر مافيهاش خولات بيشتموا بلدهم أمشي يا حشرة يا واسع الدبر وعاشق الزبر اتفوو عليك وعلي كس امك وعلي كس امام العرب من عاشقي دبرك الشواذ الحاقدين علي أسيادهم المصريين ومش عايز أكلم أمك تاني"
