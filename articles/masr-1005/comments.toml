subject = "شكرا لأبو شعلان"
author = "كيمو العجلاتي"
posted = "2006-10-08"
text = "يسلم بقك أستاذ أبو شعلان وفرحتي الأكبر إنك كويتي، ربنا يكثر أمثالك من الوطنين في الخليج كلها وبلاد الحرمين، ويقصف عمر الخونة العملاء من حكامنا الجبناء وذيولهم ومريدين الذيول زي الخنثى إياها.<br />تحليلك سليم وعميق وعلمي ومنطقي متسلسل وجذاب، صدقني يسد عن البقلاوة والقطايف اللي كنت ناوي أحلي بيهم..ألف شكر ليك."
