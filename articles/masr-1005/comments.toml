[[comments]]
order = 56
subject = "سلامات كبيرات عدلات أغا خنثى"
author = "أبو عنتر الحموي"
posted = "2006-10-11"
text = "ليك تعرفي يانسل الصرامي والزابين المقطعة..من بضاعتك عندي مخازن وحواصل ووير هاوسز كثير. بس ما بريد وسخ تمي لإنك أذل من إنك تخليني أغلط على مصر ككل يعني. هلا عرفنا إنك ما بدك لا العرب ولا الإسلام اللي جاي بطريق العرب! مضبوط هالحكي؟<br />وبدك تكوني فرعونية؟ تمام يا عدلات؟ وبتزعمي إن الفراعنة علمونا حروف الهجاء و حاجات كثير \"علمتكم كلكم من اول الحروف الهجائية الي معظم قوانينكم واشعت بحضارتها الضاربة في اعماق التاريخ وبنورها علي عقولكم المتخلفة\" ، حلو والله لو صدقتي وجبتي مصدر علمي أو تاريخي يؤيد هالكلام...ما في!!!<br />وبعدين شو حكاية السبع تلاف سنة حضارة وأكثر الخبراء كرما في تقدير عمر حضارة الفراعنة بيقول ألفين سنة ق.م فقط لا غير..شو حضرتك برضو خبيرة آثار وحفريات ولا شو؟<br />ما علينا خليهن نص مليار سنة حضارة بعمر الأرض شو فضل منها من علم نافع لليوم بستخدمة المصريين أو غيرهن يعني؟ بس قوليلي على حاجة واحدة فقط. الصينين مثلا عندهن حضارة عشر تلاف سنة..ولسه عندهن طب الأشعاب والإبر الصينية ومؤلفات في فنون الحرب بتدرس لليوم في الأكاديميات، وما سمعنا منهن هالوقاحة والتبجح!!<br />وبعدين عدلات لما إنتن شعب صلب وخلاق ومقاوم وصاحب قوة صحيح، ليش كل الأمم إستعمرتكم وإستعبدكم، آثار الفراعنة من هرم ومعابد آثار إستعباد وعبادة للحاكم بغض النظر عن جنسة، لو حضارة الفراعنة أصيلة صحيح ما إستعبدكم اليونان والفرس والرومان وما حرركم وعملكم بشر غير العرب، بعدين الفاطمين من شمال أفريقيا ما حكموكم مئات السنين، وبعدهن ايوبيين والمماليك والترك والفرنسين والإنجليز واليوم الإسرائيلين..بقدر أقول ومعي حق وبرهان إن شعب مصر قطيع مسالم سهل لقياد للي بده يحكم، بس ما راح قولها اليوم والكل بيعرفها. يعني بلا جعدنة وفشخرة فاضية. وبعد<br />اقرأ بقية التعليق .."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 57
subject = "الي ابن قوم لوط الحموي الطرابلسي"
author = "سيدكم عادل"
posted = "2006-10-14"
text = "شوف يابن قوم لوط انت سواء سميت نفسك الحموي او الطرابلسي او المتناك مش مهم هذا هو ردي الاخير لكي مش عارف اكلمك علي انك مرة ولا نص رجل ما علينا طول عمركم حاقدين علي مصر بسبب التفوق الحضاري الشامخ والكاسح اذا قورنت بالاقزام من أِشباه الدويلات أمثالكم قديما وحديثا شوف يا خول العرب انت كانت الدول الأخري تتطمع في استعمار مصر لانها ارض ذهب وخير وحضارة ونيل وزراعة فالفراعنة هم أقدم حضارة في التاريخ واول من زرع وراجع معلوماتك يابوجهل وكل من حاول الطمع في استعمار مصر هزم وطرد في النهاية شرطردة بقادة مصر القدامي أمثال أحمس وتحتمس ورمسيس الثاني اما أ،تم رغم ان بلادكم التي هي تاريخيا منبع قوم لوط طول عمرها جدباء وايش ياخد الريح من البلاط وعند الفتح الاسلامي وبالمناسبة انا لا ارفض الاسلام ولكن ضدالعروبة العنصرية في مسلمين كويسين كتير في باكستان وأندونسيا وماليزيا لية التعصب للعروبة انتم بالنسبة لنا زي أي دولة أخري محمدعلي باشا والخديو أسماعيل عندما بنو ا مصر الحديثة تطلعو الي اوربا ولم ينظروا أليكم لأانكم كنتم وقتها ولازلتم قمة في التخلف مصر اضافت للاسلام والمسلمين الكثير من عهد عمرو بن العاص من اول أنقاذ المسلمين في مجاعة عام الرمادة بخيرات مصر الي الانتصار علي الصليبيين والتتار بجنود مصر الذين هم خير أجناد ألارض كما قال الرسول الكريم علاوة علي أنها الدولة الوحيدة التي ذكرت في القران مرات عديدة فهي مباركة من الله وهذا كله من أسباب حقدكم وفي العصر الحديث أذا قارنت مصر باي دولة عربية فستجد الفرق شاسع اولا مصر تاني دولة في العالم بعد بريطانيا دخلتها السكك الحديدية عام 1852 كنتم وقتها تركبون الدواب مصر بها جامعات من 200سنة من ايام محمد علي طب القصر الع<br />اقرأ بقية التعليق .."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
