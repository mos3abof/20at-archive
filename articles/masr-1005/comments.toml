subject = "إخرسي عدلات يا صهيونية"
author = "مؤيد الطرابلسي"
posted = "2006-10-09"
text = "يا كس إمك يا عدول*****يابن المنيوكة المهبول<br />لأنيكك عرضا مع طول*** وأفسخ طيزك يا مهبول<br />كس إمك من أكل الفول****أحمر من عنين الغول<br />ياخنثي شو عم بتقول****وتخرف يابن الدلدول<br />ساداتك خاين مسطول***ناكه \"بيغن\" نيك يطول<br />ليك يابن الشرموطة سماع بقى، كس إمك المعفن على إم السادات، شو يابن المومس، لما ساداتك حقق بقى كل هالإنجازات الوهمية..ليش الشعب جوعان وفقير ومعثر وبده يهرب من البلد؟ ليكي عدلات مين محتاج مين؟ ومين اللي بيشتغل خدام عند مين؟ لشو عم تهربي من الأجوبة وتردي بس بطيزك الواسعة؟ ماشايف لوطي وخنثى غيرك لشو كل هالناس عم تكذب وإنتي لتقبريني صادقة؟ كل هالناس ياللي بتلعن أبو السادات حمير وإنتي وحدك بتفهمي؟ ما معقول..وبعدين هلا عشيقك ليفي قالك على التعليمات لا تزعلي رؤساءك بالموساد وتسببي أزمة.<br />وكمان إنتي وإمك من الشكوى المقدمة عاليه من المواطن عويس عويجة العربجي عم يتخلوا الحيوانات تبعوا تنيكن..ليش ما رديتي..أكيد الكلام صحيح..شو إنتي وإمك ما عاتقين زب إنسان ولا حيوان بالإضافة إن خالك هو أبوك,,تفوه على أصلك الواطي يا صهيونية.<br />لاتتمسحي بالمصريين الشرفاء هادول على العين والراس لكن الصهاينة زيك وزي السادات ومبارك كرامتهن تنداس..تحية للإستاذ الليثي والله جدع إبن أصول."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 43
subject = "ناكح عدولة أم طيز مبلولة"
author = "أحمد عز الدين"
posted = "2006-10-09"
text = "إيه يا متناكة يا عدولة مش حتبطلي تخاريف وتهجيص وكلام الحيوانات عشاقك وعشاق أمك؟ لاشتم تعرفي تشتمي ولا كلام له معنى بتقولي..أكبر لوطي هو إنت واللي خلفوكي من زنا المحارم. والمعلم جمعة أبو شاطور الجزار(جار السوء المذكور في القصيدة)<br />بشهادته وحلفانه قال لنا مشكور إنتي إيه يا طواشي ياخنثى..حتنكري؟ أما تندب في كسك قنبلة نووية من التقال قوي بتوع أمريكا.<br />بقيتي مصووحة تفتكري كل من كتب هنا يبقى كيمو اللي هتك عرضك وخلاكي وإنت بنت الشراميط مسخرة وفرجة وتسلية للصايمين. السادات يابنت الشرموطة طول عمره جبان وعميل وطالب شهرة، ده حتى في المنصة اللي إتعدم فيها مات من رعبه بالسكته القلبية- عقبال عندك- أول ما شاف الشهيد الإسلامبولي جاي ناحيته..إخرسي حمارة رغاية..وهو في القوات المسلحة شد جواب لفاطمة رشدي عايز يشتغل في فرقتها..وطول عمره كان جاسوس على الضباط الأحرار وفي الحرس الحديدي. بالنسبة لحرب إكتوبر محدش ينكر شجاعة وبسالة المقاتل المصري وقتها وعبقرية الفريق الشاذلي ربنا يديه الصحة، إنما السادات تآمر مع كيسنجر على النصر ده وضيعة وتسبب في الثغرة وحصار الجيشين وفي النهاية خرجت إسرائيل منتصرة سياسيا وعسكريا..حتعملي تاريخ لوحدك يا كس أمك؟ يا تردي على النقاط المذكورة يا تخرسي ملينا تشليقك وطيزك الواسعة هو قوي ويعدي فيها المرور كله."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 44
subject = "الي الكلب الطرابلسي المخنث"
author = "سيدك عادل"
posted = "2006-10-10"
text = "اسمع يا حشرة يابن الخول انت مصر عمرها ماكانت جعانة ده لان فيها نهر النيل وقناة السويس و بترول وغاز علاوة علي انها اكبر بلد سياحي عربي الفقر والجوع ده عندكم من زمان في بلاد الشام فطول عمركم منطقة طاردة للسكان وعندكم اكبر نسبة مهاجرين في امريكا الاتينية تروحوهناك كعادتكم تتناكوا وتبيعو زوجاتكم وبناتكم زي ما بتعملوا مع الخليجيين بالضبط مصر ضيعت نفسها وشبابها عشان قضيتكم في 4حروب مع اسرائيل وانتم مش عايزين تحاربوا او تحرروا نفسكم تعالي يا مصر حاربي لنا لكن كس امكم السادات البطل عارف ملة امكم الخاينة واهتم ببلده وتحرير ارضه عشان كده بتكرهوه روحو في ستين الف داهية وبعدين قولي انت من اي دويلة بالظبط عشان اعرفك تاريخكم القذر وتاريخ كس امكم المفشوخ يامنتن مصر حضارة سبعة الاف سنة وطول عمر اسمها وتاريخها المشرف معروف مش شوية دويلات مقامتش غير بعد اتفاقية سايكس بيكو من عشرات السنين فقط عمر ما كان في دولة في التاريخ اسمها سوريا او لبنان او الاردن او فلسطين بعكس مصر لها اسم وكيان محدد من الاف السنين والوحيدة اللتي ذكرت في القران 14مره واحب اعرفك ان معظم المصريين مع السادات وبيتمنوا ايامه ترجع ومعظم الردود السابقة مع السادات باستثناء الخول الكبير كيمو العجلاتي اللي بيغير اسمه وبينزل باسامي مختلفة وهو زيك بالضبط لوطي وعايز اي حاجة تدخل في طيزه المهم اللي يديه فلوس انتو خسارة الكلام مع انصاف الرجال اللي زيكم واخيرا كس ام ام امك ور وح العب بعيد يابن الخول وشوفلك زبر في طيزك انت وامك بدل ما تتطاول علي ستك وتاج راسك مصر"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 45
subject = "فاشخ احمد عز الين واسم شهرته كيمو العجلاتي"
author = "عادل"
posted = "2006-10-10"
text = "الاول اخبار طيزك الواسعة ايه سمعت ان جالك زهري وسيلان وايدز وبعدين العرب اللي كلنو بيدوك فلوس عشان ينيكوك هايقرفو من طيزك طب هاتعمل اية وهاتاكل منين ممكن تشغل كس امك اكتر مسكين ما علينا اسمع يابن الحمار السادات استطاع ان يستغل الانتصار االعسكري الغي كامل اللي تحقق في حرب 73 بانه يكمله بالمفاوضات ويرجع سيناء كاملة لمصر بعد ماضيعها الهالك عبد الناصر وده انجاز تاريخي تقدر تقولي لو عمل زي سوريا ورفض المفاوضات كان عمل ايه اهي الجولان لحد الان محتلة رغم ادعاء سوريا الكاذب انها انتصرت ازاي ماعرفش ودي عبقرية السادات الان سوريا بتبوس جزمة اسرائيل عشان تفاوضهاواسرائيل بتتكبرعليها وتقول لا اللي يرجع ارضه يبقي خاين يابن الغبي ياعجلاتي عشا ن كده العرب كارهين السادات لانهم بيكرهوا مصر وشوف الكلب الطرابلسي وتعليقه اللي بينضح كره وسب في مصر انت احسن لك تروح تعالج طيزك الاول اللي بتاكلك عيش وكسامك علي كس ام ام ام العرب الحاقدين امشى ياوسخ يا جزمة في رجليهم واهتم بوطنك الاول ومش عايز ابص لكس امك تاني"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 46
subject = "حمارة بت حمارة خنثى عدلات"
author = "مؤيد الطرابلسي"
posted = "2006-10-10"
text = "يا كس إمك يا عدلات ****** بنت النيك بين الإخوات<br />بيغن ناكه للسادات *******مع كارتر يابن الخولات<br />شو سينا فيها قوات؟******مصرية- يابن القحبات؟<br />فيها الدولي عدى وفات******متحكم روحة وجيات<br />الإسرائيلي يا عدلات ******حاكم مصرك بمعهدات<br />سيناء صارت ماخورات****ترمح فيها الشرموطات<br />شو تجعدن نسل الفسوات***وإمك مومس للخوجات<br />عم تردح نفس الردحات****و تلعب نفس الحركات<br />نفسك ما تشبع نيكات *****من كيمو وزبه هيهات<br />خلى قعرك يا عدلات****** ترمح فيها مقطورات<br />ما يكفيكي هاللي فات*******بدك زب الحيوانات<br />هلا جعدني وخرفي على كيفك يا خنثى لشو الكلام عليه جمرك، الكل عم بيتضحك عليكي وعلى إمك زليخة الصهيونية. شو بتعرفي عن بلاد الشام وحضارة الشام من فينيقين وعموريين وكنعان وإلا هكسوس يابنت الحيوان؟ لأريحك كسك وطيزيك أنا من لبنان، لبنان الصغير ياللي مرغ أنف سيدتك إسرائيل بالتراب والوحل يابنت الدلو والسطل.تلاتة وتلاتين يوم ورغم مساندة حكومتك العميلة وأمريكا والسعودية والأردن..ما طلع من أمر إسرائيل شي النوب.<br />شو بتجدعني يا شرموطة..أي أربع حروب خاضتها مصر علشان العرب؟ قولي لنعرف؟<br />ليكي ما راح أسب في الشعب المصري ولا أي شعب عربي بتاتا..كل الهجوم على الشرموطات عينتك إنتي يا صهيونية وحذاء للصهيانة، لوين معظم الشعب المصري مع خط السادات الخياني..وما شايف غيرك هون عم بيرد وياريت بمنطق وحقايق لأ بردح تعلمتيه من إمك، أنا شايف شرفاء مصريين هون هتكو سترك..وفشخوا طيزك..ومن حمو ضربهم فاكراهن كيمو ناكح إمك..إسمعي يا شرموطة مصر كلها كيمو..وكلهم بينيكو طيزك ويتفوا فيها."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 47
subject = "عدولة ديدي عايز زب حديدي"
author = "كيمو العجلاتي"
posted = "2006-10-10"
text = "الشرموطة الخنثى عدلات بنت المومسات اللي خالها لسة بينط على أمها زليخة سايقة في الهبل خالص ونازلة ترمي اللي فيها على ولاد الناس.<br />كس أمك كس أمك كس أمك كس أمك.....كس أمك كس أمك عمالة تردد ليل نهار، طب ما كل الستات ليهم كس...آسفين نسينا إن أمك ليها كس وزب كخنثى زيك...بس يعني ده مفهوم للقراء من السياق برضة القراء مهماش بهايم زيك يا عدولة..دول ولاد حلال ولودا من زواج شرعي ومتربيين ووطنيين وعرب..مهماش لاسمح الله زيك من الحرام وزنا المحارم مش كده يا ديدي عايزة زب حديدي؟<br />بصراحة زوديتها يا صهيونية مالك إنتي ومال مصر؟ إتكلمي عن بلدك إسرائيل أولى يا صايعة يا لمامة. إحنا جزء من العرب لايتجزء وكل جزء من الكيان العربي مالوش قيمة لوحده..إطلعي إنتي منها يا أم الشراميط وإحنا نرجع سمن على عسل. إحنا ما حاربناش علشان العرب قالولنا نحارب ولكن حاربنا عن أمننا القومي وإستقلالنا..ماعدا تمانية وأربعين يا أم أربعة وأربعين اللي خضناها مع ست دول عربية تانية في فلسطين وإنتهت بالنكبة لأهل فلسطين..مصر لم تحارب أبدا من أجل العرب..ولا عند أمك معلومات تانية..قولي؟ والفلسطنينين وقتها ودلوقتي كانوا عايزين سلاح ومش جيوش بلاش تهجصي وتخلي عرب تانيين بدل ما يلعنو كس أمك الخنثى يسبوا في مصر علشان كسك المعفن.<br />الحقيقة أنا مليت تشليقك وجهلك ومن الساعة دي مش حأرد عليكي لأنك مالكيش وجود ونكرة. عاملة إيه القطارات في طيزك..حلوة فكرة إنك تأجيريها كمحطة للقطارات دي..ولا أحسن زي ميناء لحاملات الطائرات الأمريكية اللي عندنا..ومنها بتنطلق للعدوان على الدول العربية. السادات خان سوريا قبل وأثناء وبعد الحرب..وما حصل ليه فتات لا مكان للسيادة فيه..وسيناء منزوعة السلاح يا مرة..تسرح فيها إسرائيل وتمرح وتدفن فيها نفايتها النووية. وبتر<br />اقرأ بقية التعليق .."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 48
subject = "هلا عدلات الفرفورة"
author = "أبو عنتر الحموي"
posted = "2006-10-10"
text = "عفا شباب ما قصرتم مع بنت النعال عدلات خريات هاي، شو رأيكم كل يوم بعد الإفطار نجي لهون ونبلش ضرب قباقيب على راسها، ونفش خلقنا فيها بعد يوم عمل مجهد؟<br />وينك إستاذ كيمو الله يخليك لاتفل وتروح وتترك هاي المخصية سليلة الطواشي والأغوات لتفكر حالها ربحت وتروح لرءوساءها بالموساد تطلب علاوة وإنجاز مهمة. عارف إنك قرفان منها أصبر وما صبرك إلا بالله يارجل. يعني إن إنت ماكشحت هالخرا بعيد مين بده؟ كل واحد أولى بتنظيف شوارع بلده من هيك قذارة.<br />هلا يا قذرة يا عدلات يا أحط المخلوقات، ليش العرب بدن يحسدوكن ويحقدوا عليكن يا عرة النسوان؟ شو عندكن ماشاء الله ينحسد؟ خليها على الله بلا فضايح؟ ليكي يا خنثى بعينك ما راح نغلط على مصر ولا شعبها الأصيل العربي مثل ما إنت بدك لكن عليكي بس.<br />طيب عدولة يعني مادام العرب يرجعوكن لورا يابنت الخرا ليش عم تتمسحوا بصراميهن؟ لشو؟ ما إنتن سايبين العرب من أربعين سنة..وريني التقدم والرخاء اللي خذتوه من إسرائيل وأمريكا؟ وإلا بدكن كمان أربعين سنة لتعملوا طنجرة طبيخ مصرية. بعدين المساعدة الأمريكية للقمح والسلاح تعرفي مين بدفعها؟ إيه السعودية. وقسما بديني ما أكره زي آل سعود وحكام الخليج العملاء. طيب شو عاجبك بالسادات الداعر ياللي مرته جيهان كانت مركوبة من كل الرؤساء بما فيهن كارتر، بس القذافي وحده ما ركبها ولذلك حاربه السادات..حكومة مصر ما أقول الشعب أقذر الحكومات وما جازت إحسان العرب إلا بالتآمر ونكران الجميل..في حدن أعطى مصر مثل العراق مال وسلاح وحارب معكن برجاله..إسألي الفريق الشاذلي يحكيلك عن بطولة العراقين وقت عبور القنال..وشو طياراتهم سوت في إسرائيل حبيبة قلبك. لأ ما راح جيب سيرة إمك النوب لشو لأعيد حكايات معروفة؟"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 49
subject = "سيبوكم من الحثالة دي"
author = "مصري بالسعودية"
posted = "2006-10-10"
text = "رجاءا يا شباب إهملوا التفاهة عدلات والا إسمها إيه لأنها بذيئة اللسان حاقدة وصهيونية وأجندتها واضحة ومكشوفة عايزة توقع العرب في بعضهم، فاكرانا زيها حمير.<br />ما تضيعوش صيامكم ووقتكم عليها وخلوها تقول مهي بتكلم نفسها ويفرحها إن حد يرد عليها.<br />رمضان كريم يا إخوان."
