[[comments]]
order = 52
subject = "يابنت الكلب يا عدلات"
author = "مصري بالسعودية"
posted = "2006-10-10"
text = "شفتم القباحة والإنحطاط بتاع الوسخة الشردوحة دي؟ أكيد الولية دي داعرة ساقطة بنت زواني، كل كلامها ناكك وناكوك وبفلوس من العرب، طب إنتي فلوسك بتاخذيها منين من الصهاينة أشرف؟<br />فعلا إنت ساقطة آه لبنان شاركت في حرب ثمانية وأربعين والقاوقجي بطل مشهور. ياريتك يا عدلات تاخذي بنصحيتك وتنظفي إنت طيزك اللي هي بقك الوسخ برضة وله نفس الإستخدامات لزباينك. يا كحيانة يا جربانة يا جعانة فقر وقرف وعنظزة فاضية وجهل محصلش وعمى مزمن بتكلم عن المواخير الوسخة ومصر إيه بقت بفضل السادات ومبارك؟ زمان كان شارع الهرم بس وللي معاه فلوس ومحصور بفضل اللي زيك بقى عندنا مليون شارع هرم روحي شوفي البحر الأحمر.<br />أنا عارف اللي عاجبك في نظام السادات مبارك إيه..حكاية إباحة زواج اللواطين زيك وتقنين الدعارة، قوليها وريحي روحك. إنا مش كيمو تصدقي وإلا إحشي قعرك الأهرامات..إنت صفر ونكرة ومش لاقيه شعل إلا تأجري طيزك..وفاكرة كل الناس واطية زيك..إيه يا شلق خذوهم بالصوت..لعنة الله على أصلك..معهلش يا جدعان ديه أخلاق المومسات بلا مواخذة..وكل إناء بما فيه ينضح ودي مليانة بعيد عنكم خرا تفوه عليكي!"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

