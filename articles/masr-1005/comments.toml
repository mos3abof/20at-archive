subject = "مراتي عدولة إنت طالق!"
author = "المصري العربي السكندري"
posted = "2006-10-17"
text = "أنا مش العجلاتي يا عدلات يا مراتي..إيه بقيتي مسروعة من العجلاتي وتشوفيه في كل حته..آسف على الخضة يا زوجتي العزيزة..أنا عارف إنك حامل في السابع دلوقتي..والحامل يكون خلقها ضيق، بعكس كسك وطيزك طبعا يا عدلات. مين إنتي يا صهيونية يا غجرية يا بنت النورية الغزية لما تقولي ده مصري وده محروم من الإنتماء لمصر؟ غطي طيزك الأول وبعدين قولي ده راسه مكشوف؟<br />عايزنا نصدق إنك مصري وطني ومسلم وولاء كس أمك لأمريكا ولإسرائيل اللي نازلين ذبح في المسلمين والعرب في كل حته؟ وإذا كنا معرصين مخنثين ديوثين زيك ونقول \"برافو ماما أمريكا هايل طانط إسرائيل..العرب يستهلوا الذبح!\" نبقى في عين كس أمك مواطنين مصريين صالحين..وإلا فنحن يعني ما نعجبش؟ أي منطق ده يا مره يا وسخة؟ إنتي اللي لازم تثبتي مصريتك وإسلامك وعلمك وشادتك لغاية دلوقتي ما جاوبتيش على سؤال واحد من غير قباحة من لغة أمك...روحي وإنت طالق بالثلاثة يا خنثى يا شردوحة يا معفنة يا مدمنة أحلام يقظة وآمال. عاشت مصر حرة عربية..الله أكبر والنصر للعرب والمسلمين."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 63
subject = "مراتي عدولة إنت طالق!"
author = "عمر الحوراني"
posted = "2006-10-17"
text = "شو وليك عدلات يا شرموطة كام واحد إنتي متزوجة لكان؟ هلأ صار فبنا نقدمك للمحاكمة بتهمة تعدد الأزواج..ضربة تخلع رقبتك ولاه..هيدا زنا يا سليلة الزنا والخنا والعهر الفرعوني الإسرائيلي..شو بده القبضاي أبو عنتر الحموي هلأ يساوي؟ ليك مين أبو الجنين؟ هو ولا المصري العربي؟ ولا نفسك ما عارفة؟ عقوبتك الرجم حتى الموت وبعدين الحرق بالزيت الخام وارد الكويت.<br />كس إمك شو إنتي بقتي مصر؟ يعني لما نسب إمك بقى نسب مصر؟ مصر فيها اللي بينحط على الراس، وأمثالك اللي ما يصلح غير مداس يا بنت الأنجاس والأرجاس..ناكوكي بفرنك نحاس..كس إمك صهيونية لوطية خنثى كافرة."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 64
subject = "للعاهرة عدولة الوسخة"
author = "ميشيل نجار"
posted = "2006-10-17"
text = "كيمو يا سيد الشجعان<br />تسلم يانور الريحان<br />وسيكو زهر البستان<br />وأبو عنتر راعي الحصان<br />والمصري العربي كمان<br />بأحيكم من لبنان<br />أهلا ومرحى يا إخوان<br />أهلا شرفتوا الميدان<br />شرشحوا عرض الجبان<br />عدولة وش السعدان<br />إمها مركوب الحيوان<br />إحمار وبغل وحصان<br />رمحوا بكسها بالمجان<br />كسها مبسوط وفرحان<br />وبيعصر مني البيضان<br />والبغل بيرهز حردان<br />في كسها وجلده عرقان<br />وهات الدوشكا ياسمعان<br />والباروده يا سليمان<br />والكلاشينكوف مليان<br />والكاتيوشا على القزان<br />وأضرب صحي لي الجيران<br />ليشوفوا إم الخنثان<br />وعدولة المومس كمان<br />شرموطات الأمريكان<br />وإسرائيل بنت السخلان<br />عم بتشردح للعربان<br />وكسها من خيرن مليان<br />ذل المصري الدهر وهان<br />لولاهن يابن الجربان<br />حنا طعمينا الجوعان<br />من أهلك يابن الجيفان<br />أصلي عربي من عدنان<br />وحضارة أهلى كنعان<br />مو فرعوني من السودان<br />ملعون أصله في القرآن<br />خاين بايع للإخوان<br />جاجة في الحرب وجبان<br />وبيهرب مثل النسوان<br />هيدي المصري يا حيوان<br />كلب و خنزير وطفران<br />في الخرا مثل الجعران<br />ويطير عالي بالعنان"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 65
subject = "شهادة طبية:د. جواد نطاح"
author = "دكتور بيطري بحديقة حيوان الجزيزة"
posted = "2006-10-18"
text = "والله يا سيد المصري العربي السكندري، إنت مجبر بالنفقة على المتناكة عدلات حتى تخرا إبن الحرام اللي في بطنها المنفوخ واللي كل الفحوص اللي أجرتها عندي في العيادة بتدل على إن الجنين من ذوات الأربع، إما حمار أو بغل أو شئ من هذا القبيل، لكن المدهش إن صور الأشعة فوق الصوتية والمقطعية، بتبين حاجة زي الزلومة في وجة الجنين العجيب ده؟ مع العلم إن محمدين محمد خليفة حارس الفيل بجنينة الحيوان، تقدم من سبعة أشهر ببلاغ ضد حرمكم المصون لنواجدها بوضع غير لائق وجنسي مع الفيل\" حمال\" بعد غروب الشمس وفي غير أوقات الزيارة الرسمية. وعليه فليس ضروريا أبدا إجراء فحوصات DNA لنفي الأبوة وإثبات جريمة الزنا بين الفيل \"حمال\" والمجرمة عدلات عدولة بنت زليخة. عقوبة عدلات الرجم حتى الموت بميدان رمسيس، أما الفيل فيكتفى بشد أدنه اليسرى وتوبيخه، وأخذ تعهد خطي منه بعدم معاودة هذة الأفعال الشاذة."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

