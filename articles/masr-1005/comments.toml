[[comments]]
order = 13
subject = "لعدولة المتناكة"
author = "سيكو"
posted = "2006-10-03"
text = "عدلات الشرموطة بنت المنيوكة المفضوحة المفسوخة المقعورة على زب عبد إسود زنجي زي معرص أمك السادات الداعر الخاين الكافر الديوث..تحية من كل زبار الدنيا الطبيعة والإصطناعية ليكي يا عدولة يا مخبولة يا مخلولة.<br />فيا بنت الشرموطة زليخة بنت خنت بنت خنيث بنت مخنت بن خول بت متناك بنت مفضوح بنت شرموح بنت شرشوح بنت النضير..مش بس غبية بالتاريخ يابنت ذوات الأربع كمان ما تعرفيش جغرافية فلسطين اللي سرقها أهلك يا صهيونية؟ تعرفي حدود صحراء النقب يا عضاضة الأزبار ومعشوقة أير الحمار؟ أم الرشراش إتخذث في حرب ثمانية وأربعين...وأتحدى كس إمك تثبتي العكس..ولو جبتي مصدر واحد يقول غير هذا الكلام...أقبل كل وصف تقوليه عليا..وحأخرس خالص..وإن كنت على حق وصادق وأنا فعلا كده..يبقى كل اللي وصفتك بيه حقيقي..عدل يا خوجاية يا حمارة يا رغاية...تفوه في كسك المبهوق.."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 14
subject = "رحم الله السادات"
author = "msh"
posted = "2006-10-03"
text = "ياسيكو بصراحة مش عارف أنت راجل ولا حرمةلكن عموماأنا لايمكن أنزل لهذا المستوى من الردح اللاأخلاقى لأن هذا من صفات الضعفاء والتافهين وبعدين إحنا رجاله مصريين ورجاله أوى وأنت أو إنتى والدنيا كلها عارفة كده بس أنتم بتكابروا وعلى فكرة أنا أعرف أشتم وعندى حاجات تبكيكم لكن نحن أرفع وأسمى من أى ردح قذر........... وبرضة كل سنة وأنتم طيبين ورمضان كريم"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 15
subject = "صلوا على الحبيب"
author = "المعلم شكل"
posted = "2006-10-03"
text = "وحدوه يا خوانا وقولو أعوذ بالله´من الشيطان الرجيم..إحنا كلنا أهل..إيه ياعادل الردح ومومس..وإيه يا معلم سيكو وإيه يا msh..صلوا على الحبيب المصطفى.<br />السادات وغار لجنهم وبئس القرار والمثوى..لازم ننبشه تاني؟ ويا سي msh يا إما إنت مخدوع بالسادات أو إنك ولا مؤاخذة لسه صغير وعشتش أيامه....هو خلف لنا غير الفسدة والحرمية والمرتشين والتبعية لأمريكا ولإسرائيل؟ خليك مع الله يا أخي.<br />ويا عادل كلام المعلم سيكو صحيح ..أم الرشراش فعلا إستولى عليها بن جوريون في حرب فلسطين...<br />وبعدين قد إيه تعرف السادات؟ كنت زميله؟ تعرف مين واسطته لدخول الجيش؟ والفتره اللي قضاها هناك؟ تعرف إن كان في عمره قاد سرية؟ ولا يعرف يقرا خريطة عسكرية؟ يابني مش عيب إنك تجهل أشياء..إنما العيب إنك تدعي علم ما لا تعلم ولا تحسن. تعرف هو خدع مين في حرب رمضان وبعدها..مش إسرائيل لأ..سوريا شريكتنا في الحرب..وتعرف مين اللي تسبب في ثغرة الدفرسوار؟ هو برضة؟ ومين اللي ترجى العرب يرفعوا حظر النفط عن الغرب؟ هو برضة. أرجوك إنته وmsh ترجعوا لمصادر ذات مصداقية..بدل ما تبهدلوا العرب عمال على بطال..العرب أعطونا كثير قوي زمان..والسادات هو اللي فرق شمل العرب بعد ما تجمعوا في حرب رمضان معانا. رمضان كريم."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 16
subject = "كلام من الشهد يا معلم شكل"
author = "كيمو العجلاتي"
posted = "2006-10-04"
text = "عليك نور يا معلم شكل وربنا يزيدك من العلم والتقوى، ده كلام الرجالة ولاد البلد المجدع. وبالنسبة للمدعو msh أو عادل لا فرق البادي أظلم، ورد الظلم حق شرعي. بمعنى إنك بدفاعك عن الكافر الملعون السادات تكون خرجت عن دائرة الإسلام وتسقط حرماتك. وإن كان في هذة الحالة دمك حلال فعرضك وشتمك أهون الضرر، والله أعلم. إن كنت فعلا ولدت على الإسلام، فعليك من جديد التبرأ من الكفر الذي إقترفته، وإسأل عالما في الدين عن طرق تكفير ذنبك، وعليك الدخول في الإسلام من جديد ونبذ النفاق ليصبح لك من الحرمات المكفولة للمسلمين دمك ومالك وعرضك..والسلام على من إتبع الهدى، وسلام علينا نحن المسلمين."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 17
subject = "سيكو المتناكة"
author = "عادل"
posted = "2006-10-04"
text = "من اسمك الداعر قرفان اكلم شرموطة بنت متناكة زيك يا سيكو يام كس مفتوح للي يدفع المهم تاخدي فلوس وخلاص من العرب اللي عمرهم ما اتمنوا خير لمصر يلعن ابوكي مرة وسخة بنت كلب انتي وكل اصحابك المومسات السادات انجازاته كل الشعب عارفها وبيترحم عليها باستئناء العرب الجرب اللي عايزنا احنا بس اللي نقاتل لحد اخر جندي مصري وهما يتفرجوا علينا يلعن ابوكى بنت كلب مومس وانتي وكل اللي بينيكوكي وانا ماعنديش وقت اضيعه مع كس امك وكفاية ان اسمك سيكو وخلي كسك ياكلك يابنت المتناكة"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 18
subject = "الي العجلاتي كيمو"
author = "عادل"
posted = "2006-10-04"
text = "بطل تكفير للشرفاء المسلمين المؤ منين ياعجلاتي وما دليلك ان السادات كافر الاتعلم ان من كفر مسلما فقد كفر وواضح من كلامك ومن اسمك الذي اخترته لك انك انسان سفيه"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 19
subject = "قليل من العقل"
author = "كيمو -- اللى مش عجلاتى"
posted = "2006-10-04"
text = "الى صديق الكفاح كيمو العجلاتى كان واجب عليك تسال على صاحبك كيمو حاف ولا انت هانت عليك العشره؟يالا مش مهم ؟على العموم الحمدلله جت سليمه وخرجونى بضمان محل اقامتى-- المهم انا شايفك متحامل قوى على الرئيس السادات( رحمه الله وجميع اموات المسلمين)وفى نفس الوقت عاجبك قوى كلام المعلم شكل(حفظه الله)طب ماتسمعونا صلاة النبى كده وتكلمونا شويه عن الزعيم الخالد (ابو خالد)رحمه الله ولا انت والمعلم بتاعك مش شايفين التاريخ غير بعين واحده؟فيجب على من سلك مسلك الانصاف وتنكب عن طريق الاعتساف ان يقول الحق ولا يخاف @ والحمدلله اننى لست ناصرى ولاساداتى ولامباركى ولاجمالكى كمان ؟ على فكره لو المعلم شكل هو اللى علمك الصنعه يبقى دى دقنى لوفلحت"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 20
subject = "الله يرحمك"
author = "محمد حسن"
posted = "2006-10-04"
text = "هو في زي السادات الله يرحمه كان راااااااااااااااااااااااااااجل<br />وعملنا كرامه في كل حته<br />الدور والباقي على اللي ماسك دلوقتي"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 21
subject = "تحية لعادل بن العادلة بين الزناة"
author = "سيكو"
posted = "2006-10-04"
text = "حذاري يابن تافة الأعاجم*** وإلا نال عرضك كل قاسم<br />أعادل إن أمك من مجوس*****لها ولع بإتيان المحارم<br />تأدب يا بن خالك دون شك***لعتت من الجحاجح والأكارم<br />يدب لخدر أمك يعتليها****أخوها العلج في ليل الفواحم<br />وجدك قائم بالباب هاجت***به الشهوات في شبق مهاجم<br />يناقل بين قائمتيه قهرا*****وينغط في خلاء نغط كاظم<br />وفاض به الغرام فلم يبالي****مقولة ناصح أو لوم لائم<br />فألوج في إست أمك نصف إير**فصاحت كله يابن الأشائم<br />وهاج الجار جار السوء هذا***فأقبل نحو ثالوث الغواشم<br />وألقمها هزيل الأير راحت*** تعاصره بفيها عصر ظالم<br />تعاورها الثلاثة ينكحوها *** تراوح فوقها فعل الحوائم<br />وأمك جودها بالعرض أضحى**يصاغر عنده جودا لحاتم<br />تقلب طرفها من فرط شوق***لأير مثل أعواد اللهاذم<br />وتعدل بين طراق لديها**** كجور سدوم في غبش وعاتم<br />لهذا إسمك المنحول زورا**برغمك يابن ساعية الأراقم<br />حذاري ويل أمك أن تثرني**فتعلم هجمة الصيد الضراغم<br />عفوت اليوم عنك عن إقتدار**نجوت بجذع أنف منك راغم"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

