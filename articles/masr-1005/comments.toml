subject = "fresh meat"
author = "حذاري يابن تافة الأعاجم*** وإلا نال عرضك كل قاسم"
posted = "2006-10-10"
text = "أعادل إن أمك من مجوس*****لها ولع بإتيان المحارم<br />تأدب يا بن خالك دون شك***لعتت من الجحاجح والأكارم<br />يدب لخدر أمك يعتليها****أخوها العلج في ليل الفواحم<br />وجدك قائم بالباب هاجت***به الشهوات في شبق مهاجم<br />يناقل بين قائمتيه قهرا*****وينغط في خلاء نغط كاظم<br />وفاض به الغرام فلم يبالي****مقولة ناصح أو لوم لائم<br />فأولج في إست أمك نصف إير**فصاحت كله يابن الأشائم<br />وهاج الجار جار السوء هذا***فأقبل نحو ثالوث الغواشم<br />وألقمها هزيل الأير راحت*** تعاصره بفيها عصر ظالم<br />تعاورها الثلاثة ينكحوها *** تراوح فوقها فعل الحوائم<br />وأمك جودها بالعرض أضحى**يصاغر عنده جود لحاتم<br />تقلب طرفها من فرط شوق***لأير مثل أعواد اللهاذم<br />وتعدل بين طراق لديها**** كجور سدوم في غبش وعاتم<br />لهذا إسمك المنحول زورا**برغمك يابن ساعية الأراقم<br />حذاري ويل أمك أن تثرني**فتعلم هجمة الصيد الضراغم<br />عفوت اليوم عنك عن إقتدار**نجوت بجذع أنف منك راغم"
