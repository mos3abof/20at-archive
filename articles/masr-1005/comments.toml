[[comments]]
order = 2
subject = "نعم كان بطلا"
author = "ابن النيل"
posted = "2006-10-03"
text = "رحمك الله يا سادات اعدت لنا سيناء بالانتصار في الحرب والسلام معظم الخل السياحي ياتي من سيناء وبترول سيناء واعادة فتح قناة السويس واعادة تعمير وبناء مدن القناة وكل هذا ضيعه الاحمق عبد الناصر اللي كان مالي البلد معتقلات وتعذيب وسلخانات وهزائم كان الشعب قد نسي كلمة معارضة واحزاب ايام عبد الناصر وان ممكن الصحافة تنتقد الحكام وكان تصور هذا ايام اللي قبله ضربا من الجنون الاسعا كانت رخيصة ايام السادات كان كيلو اللحمة بجنيه ويومها قامت مظاهرات سنة 77 وهم يقولون سيد مرعي يا سيد بيه كيلو اللحمة بقي بجنيه شوفو دلوقت الكيلو ب40 جنيه المدن الجديدة كلها عملها السادات زي 6اكتوبر والعاشر من رمضان مترو الانفاق اللي عمله السادات عودة الناس للدين كان في عهد السادات ايام عبد الناصر مكانش في واحدة محجبة في مصر ولا واحد يجرؤ يربي لحيته زائد لم يدعي اي شخص انه حدث تعذيب في عهده بعكس عهد عبد الناصر ومبارك وكان عارف قيمة مصر كويس قوي وعارف العرب كويس طول عمر العرب بيحقدوا علي مصر ويتمنوا لها الخراب والفقر ولذلك السادات كان ينظر لمصر داخليا اولا وكانت نسبة النمو وصلت 9% لكن غلط وتسرع في اعتقالات الشهر الاخير من حياته الا ان اكبر غلطة غلطها السادات هي تعيين حسني نائب له لان حسني ده كان ولايزال مصيبة علي البلد اخرت مصر وكسر نفس المصريين رحمك الله يا سادات وغفر لك"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 3
subject = "الف رحمه ونور على روحك"
author = "سعيد غريب سليمان"
posted = "2006-10-03"
text = "أرسل هذا التعليق بواسطة : ابو اسلام<br />:انا مواطن عمرى 47 عام طول عمرى اسافر واقدح حتى ابنى مستقبل لااولادى بنيت منزل مكون من اربع طوابق وكنت اعيش انا واولادى فى المنزل فى الوراق وجاء المدعو حمدى عبد العزيز عامرواخوتة ببناء ثلاث ابراج سكنية بدون عمل خوازيق ولا دراسة ولا جسات للارض بارتفاع ثلاث عشر طابق مخالفين لكل قوانين البناء بناء على تقرير مركز البحوث والتفتيش على اعمال البناء من سنة 2001 وانا اقدم شكاوى لجميع المسئولينفى البلد اكثر من 200 شكوى وتلغرافات لرئيس الجمهورية حتى اصغر موظف فى محافظة الجيزة وقابلت محافظ الجيزة السابق المستشار محمود ابو الليل واصد قرارات ولاكن بدون تنفيذ ولا يوجد متابعة لتنفيذ القرارات وتم تحرير عدة محاضر ولا فائدة ويتم التحايل على القوانين وارسلت للرقابة الادارية مشكورة قامت بالمعاينة وتم ارسال القضية للنيابة العامة فى سنة 2003 وارسلت للنيابة الادارية وعملت قضية وارسلت للنيابة العامة بخصوص المسئولين فى مجلس مدينة الوراق وتم اخذ اقوالى فى النيابة منذ ثلاث سنوات والاى الان لم يتم عمل اى شيء لاان بناء هذة الابراج مخالفة تسببت فى اضرار جسيمة فى عشرة منازل ومنهم منزلى كثر فى الكمرات وشروخ نافذة فى الحوائط والعمدان وهبوط فى الارضية فى الاربع طوابق كل ذالك تم بالرشاوى داخل مجلس مدينة الوراق اصحاب الابراج معهم محامين يتحايلون على القوانين ويساعدوهم فى ذالك بتوع مجلس المدينة والى الان لم يتم التوصل لنتيجة وتركت منزلى خوفا من الانهيار على اولادى واسكن فى سكن قريب من المنزل واصحاب الابراج يعملو على محاربتى فى عمل محاضر كيدية لكى اكف عن الشكاوى واخرها هم واقارب لهم اتفقو مع جزار يتعامل معهم محلة امام العقار الذى اقيم بةقا م بالتعدى علية بالضرب هو وابية واخية<br />اقرأ بقية التعليق .."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 4
subject = "الى ابن النيل"
author = "مطلوب فوري"
posted = "2006-10-03"
text = "يا ابن النيل القرأن واحد مفيش شك لان ربنا حفظه (انا نحن نزلنا الذكر وانا له لحافظون) ولكن هناك تفسير وتأويل لهذا القرأن.<br />يعني مثلا في سورة البقره هناك اية تقول ان الله يأمركم ان تذبحوا بقره عند الشيعة البقره هي السيدة عائشة وهذا مذكور في تفسير الشيخ الشعراوي راجع شرايط الشيخ الشعراوي في تفسير هذه الاية.<br />والجبت والطاغون معناهم ابو بكر وعمر.<br />من اجل هذا انا اعترضت على مقولة اننا والشيعة قرأننا واحد والصحيح<br />هو ان القرأن واحد في كل الملل لا يوجد قرانين<br />ولكن كل ملة تفسر القرأن على هواها واغراضها وبناء على تفسير وتأويل القرأن لا يوجد اي التقاء بيننا وبين الشيعة"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 5
subject = "دكتور في النفاق حضرتك؟"
author = "كيمو العجلاتي"
posted = "2006-10-03"
text = "إتق الله يا د.محمود عمارة أفندي..وراع الشهر الفضيل..وأحترم مشاعرنا كمسلمين وصائمين..ولا تفسد صيامنا بجعلنا نذكر المقبور السادات بما يستحقه..ولا يليق بنا أن نلعن في هذا الشهر...كل البلاء مرده لصاحبك السادات..ونحن نجني ثمار غرسه اللامبارك..فإتق الله..ولا تكن للخائنين خصيما..وكفى من القلادة ما أحاط العنق ولن أزيد..اللهم بدد المنافقين وأسيادهم."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 6
subject = "رحم الله السادات"
author = "msh"
posted = "2006-10-03"
text = "ياعم ياعجلاتى ضيعت صيامك . وانت حظك حلو علشان إحنا فى رمضان وإلا زى حضرتك ماقلت كان هيكون فيه كلام ثانى. السادات فى غنى عنك وعن أمثالك ويكفيه فخرا أنه هو السبب فى أن تكون أنت وأمثالك لديكم الجرأة على ماتقولون ولوإستمر زى سلفه الله يرحمه كان زمان أمثالكم فى المعتقلات"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 7
subject = "رحم الله السادات كان رجل بعيد النظر"
author = "msh"
posted = "2006-10-03"
text = "إن أكبر عيوب أنور السادات أنهأثبت للعالم أجمع أن العقلية المصريةبعيدة النظر على خلاف العرب الذين لاينظرون إلا تحت أقدامهم فلايرون إلا أصابع أقدامهمال.... وهم يعرفون لقد عز عليه أن يخرج من مصر بطل يحرر أرضه وشعبه وكان أملهم أن نظل مقهورين لتظل يدهم عليا علينا كما يفعلون من الفلسطينيين وكان الرجل فى طريقه لحل القضية الفلسطينة من مركز قوى ولكن فى هذه الحالةلن يجدوا قضية يزادون بها حتى الفلسطينيون أنفسهم إنساقوا وراء أكازيب عربية وهم الآن يدفعون الثمن غاليا دماء وشهداء ولم ولن يحصلوا على 10؟% مما كان سيكسبونه لو إتفقوا مع السادات الله يرحمه... وأخيرا أن ألتمس العذر كل العذر لهم لأنه كان سابقا لعصر فاستحق الحق العظيم عليه وهذه هى مصر دائما فى مرمى العقد والحاقدين...وسيظل هذا الرجل يدرس للأجيال القادمة... رحم الله أنور السادات رغم أنف الجميع لك الله يامصر ولك الله ياسادات ياإبن مصر البار ..وكفاية علشان رمضان كريم وكل عام وأنتم بخير"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 8
subject = "لاتنبهروا"
author = "ايمن اما م الحكيم"
posted = "2006-10-03"
text = "السلام عليكم- تعليقل على المقاله المنشوره اليوم - ارى ان كاتبها منبهر بالسادات الى حد كبير- والى سيادتكم تعليق على هذا الانبهار الذى ليس له محل<br />اولا - معاهده السلام التى تتغنون بها ليل نهار - ماذا فعلت فى مصر1-بموجب هذه المعاهده تحولت مياهخليج العقبه من مياه اقليميه الى مياه دوليه2- تغاضت المعاهده تماما الحديث عن ( ام الرشراش) وهى ارض مصريه تسمى حاليا ميناء ايلات - فهل تركتها المعاهده كهديه لاسرائيل - 3- من الدى اختار مبارك نائبا لرئيس الجمهوريه - اليس السادات هو من اختاره نائبا له - فكيف اذن تنبهر بالسادات وق ارتكب كل هذه الاخطاء القاتله واخطرها الخطاء الذى لايغتفر - ايمن امام/"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 9
subject = "الي ايمن امام"
author = "عادل"
posted = "2006-10-03"
text = "ام الرشراش هذه ضيعها عبد الناصر ائر هزيمة 56 بعد احتلال اسرائيل لسيناء فقد اشترطت للانسحاب حرية المرور في خليج العقبة وانشاء ميناء ايلات علي ارض ام الرشراش المصرية ولم ينطق عبد الناصر بكلمة فميناء ايلات تم انشاؤه في عهد بائع الارض والعرض عبد الناصر وطبعا لازم يسمح لهم بالمرور في خليج العقبة عشان الميناء يشتغل السادات حاول اصلاح جرائم عبد الناصر في حق مصر بالنصر وعودة الارض وليس بالاغاني والعنتريات الكاذبة"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

