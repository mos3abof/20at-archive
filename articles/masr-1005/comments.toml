text = "التلاته العن من بعض ... ومصر تستحق قائد حقيقي وليس هؤلاء الاقزام الطغاه<br />بطلوا نفاق ياعالم عبد الناصر ايه والسادات ايه ومبارك ايه<br />احنا مش هنبطل عبادة الاشخاص دي<br />ياتتكم القرف"
