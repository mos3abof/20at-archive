text = "إسمع ياله أو يابت وإلا الله أعلم بيك إيه، بزيادة وقاحة وحمورية، إنت لا عربي ولا مسلم وده واضح من أول رد ليك، ندعو الله إنك تحشر مع السادات ومبارك وصديقك الحبيب فاروق حسني. إنت لو رجل تقول إنت مين وفين، وساعتها يظهر مين الخول واللوطي، أوكي!<br />اللهم إني صايم."
