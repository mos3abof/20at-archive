[[comments]]
order = 11
subject = "إخرسي"
author = "سيكو"
posted = "2006-10-03"
text = "الستmsh ( مارينا شارون هوشع) فاكرة إنها بالردح بتاع غانيات الموانئ الإسرائيلية حتغير الحقائق..وحتسوق لنا جيفة حليفهم السادات على إنها fresh meat ..خلاص كليه إنتي لوحدك..إحنا محرم علينا الخنزير...ياولية. وإن كنت برضه المدعو عادل لازم تتداري خجلا من جهلك وحموريتك لأن \"ام الرشراش \" راخت أيام فاروق.. يا عدلات أو مارينة....كبسة مش كدة. عاملة مسلمة قال على مين يابنت زليخة؟"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 12
subject = "سيكو الهبلة"
author = "عادل"
posted = "2006-10-03"
text = "اسمعي ياولية يا يا عبيطة انتي هو ايام فاروق كانت اسرائيل احتلت سيناء ولا كان ت حرب 48 في سيناء يابو جهل انت ثم ازاي اسرائيل هاتستعمل ميناء ايلات الا اذا عدت في خليج العقبة طبعا وده كان فاتحهلهم عبد الناصر علي طول جزمة السادات انضف منك يا مومس يا معفنة"
