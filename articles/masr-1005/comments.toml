[[comments]]
order = 50
subject = "للمتناك الطرابلسي الحموي"
author = "فاشخك عادل"
posted = "2006-10-10"
text = "بتقول انك من دويلة لبنان اللي ما حد كان يسمع عنه قبل سنة 1923 وعمر ما كان في تاريخيا دولة اسمها لبنان وللان سوريا مبتعترف بيها كدولة مستقلة ومش راضية تعمل سفارة فيها لانها محتلاكم ونايكاكم واكيد لنت اتناكت من 55 ظبط مخابرات سوري وطول عمركم ماخور العرب وبيت الدعارة العربي وخاصة الخليجي اللي نايكين نسوانكم ورجالتكم علي العموم بلاش فضايح اسمع يا خول العرب انت من امتي ياكس امك كان لبنان بيشارك في الحروب مع اسرائيل في 48و56و67و73 اما حرب حزب الله الشيعي بتاعكم فليست حرب لبنانية ولا الحكومة اللبنانية ساندته والجيش اللبناني قعد يتفرج انما كانت حرب ايرانية بالوكالة ومعظم المراقبين والرؤساء والملوك العرب قالوا كده علي العموم طز في كس امكم كلكم انتوا العرب ولتحيا مصر اللي علمتكم كلكم من اول الحروف الهجائية الي معظم قوانينكم واشعت بحضارتها الضاربة في اعماق التاريخ وبنورها علي عقولكم المتخلفة روح يا خنيث نضف طيزك كويس عشان تسترزق بعيد انت وكس امك وختاما كس ام ام ام ام امك عل كس ام ام العرب احنا نفخر بمصريتنا فقط يلعن ابوكم ولاد ستين الف شرموطة"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

