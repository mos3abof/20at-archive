[[comments]]
order = 23
subject = "مرحى مرحى بخ بخ سيكو"
author = "كيمو العجلاتي"
posted = "2006-10-04"
text = "بخ بخ أيها الشاعر المفوه النطاسي العبقري ولا فض فوك الدهر كله..وجعل الله هام مبغظيك من المجوس مدعي الإسلام موطئا لنعليك..وصقت إبن المراغة فأجدت الوصف..وسبرت غوره سبر خبير فطين معاين أريب..وهتكت حجب وسجف حاول أن يتوارى بها عن الناظرين...لحاه لله من وغد زنيم ووقود بإذن الله لسقر. إذن فهذا أصله ونتاجه من أقبح سفاح وأبغضه..فلا غرو ولا عجب أن يتعصب لكل عبد زنجي زنيم مثله..فليس أقوى من رابطة الدم..ولو بين الكلاب.<br />أرى بن الأراذل يشرق بلعابة ويأخذه الخناق ويزبد فعل من مسه السعار..فإضربه -أبيت اللعن- وأوجعه حتى يرجع عن باطل رضعه مع حليب السفاح..لعن الله الكاذب الديوث وسيده المنوفي ربيب الفقاح.<br />ولأخي كيمو حاف أقول كفارة..وماهي القصة والعبارة؟"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 24
subject = "اتفوه عليكو"
author = "خساره اكتبه"
posted = "2006-10-04"
text = "بغض النظر عن الانتماء للسادات او لغيره كاتب هذه الابيات انسان منحط لا يصح له صوم ان كان مسلم واكثر التعليقات على هذه الصفحه لاتستحق الا كلمه واحده اتفووووووووووووووووووه"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 25
subject = "الي منيوكتي سيكوس"
author = "نايكك عادل"
posted = "2006-10-04"
text = "بقي ما طمرش فيكي الازبار اللي بتاخديها دي كلها قاعدة تشرشحي وبرده لسه عايزة تتناكي ياكس امك صحيح لبوة بنت مرة متناكة بس انا قرفت من كسك انتي وكس امك ابقي نضفيه كويس ولا اخليه ياكلك"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 26
subject = "الي اللوطي كيمو العجلاتي"
author = "عادل"
posted = "2006-10-04"
text = "انا عارف كويس انك خول واخرك تشوفلك خرابة انت والمتناكة سيكو عشان حد ينيكوا ويكيفكو بس انا مش فاضي للاوساخ المتناكين اللي زيكم اتفو عليكم عقولكم في طيازكم ولاد شرموطة صحيح"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 27
subject = "يابن الشرموطة يا عدلات أنا مالي؟"
author = "كيمو العجلاتي"
posted = "2006-10-04"
text = "لكن يابن ستين مومس جبت أنا سيرت أمك المعرصة..وبعدين إيه حكاية اللواط معاك...عمري نكتك..يامعفن يا حيوان..الإستاذ سيكو قال اللي يعرفه..وعنده حق تعرف ليه؟ لأن أصلا نكاح الأقارب بينتج جيل يا مشوه يا غير سليم جسديا..وفي حالتك إنت يا خنيث..ده سفاح محارم من الدرجة الأولى وبمراجعة حالتك إنت معتوه وأكيد كلام الدكتور سيكو مضبوط..أبوك يا إما خالك أو جدك يا مجوسي...ردح أمك إحنا عارفينه يابن زليخة..كس أمك عامل زي الموصلات العامة متاح للجميع إنسان وحيوان,,,,"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 28
subject = "أعوذ بالله"
author = "ياسر"
posted = "2006-10-04"
text = "أعوذ بالله ... الله يلعن الشيطان<br />أرجو من الإدارة أن تحذف كل تلك التعليقات الخارجة عن كل حدود الدين الأدب والأخلاق<br />اتقوا الله ياجماعة واستعيذوا بالله من الشيطان<br />تعالوا نختلف لكن بأدب<br />خلينا راقيين متحضرين .. خلينا مسلمين<br />ده احنا حتى في رمضان .. ورمضان كريم<br />أرجوكم توقفوا ... أو استكملوا الحوار لكن بأدب ويكفي أن يذكر كل طرف الحقائق التي يؤيد وجهة نظره<br />أرجوكم أرجوكم<br />فليس المسلم بالشتام ولا اللعان<br />ومرة أخري أرجو من الإدارة حذف تلك التعليقات الخارجة من (محضر الجلسة) بلاش فضايح .. دي حاجة والله تكسف !!!"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 29
subject = "خلاص يارجالة إنسوا عدلات القبيحة"
author = "جعلص الدنانيري"
posted = "2006-10-05"
text = "إيه يا مرة يا عدلات يا وسخة يا شلق أنا مش محرج عليكي كلام الرجالة خالص يابنت الفرطوس. حسك عينك أسمع لك صوت يا معفنة أحسن وديني أرمي يمين الطلاق عليكي. مرة قبيحة صحيح. معهلش يا رجالة حقكم علي، أنا حأربيها أم لسان طويل بنت زليخة. ورمضان كريم يا معلم سيكو."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 30
subject = "كيمو العجلاتي الشاذ الخول"
author = "عادل"
posted = "2006-10-06"
text = "يا جماة احب اعرفكم ان كيمو العجلاتي والمره سيكو وجعلص الدنا نيري هم كلهم شخص واحد هو كيمو الخول وهو لسان امه وسخ ونفسه واراؤه شاذه زيه و بيدخل المواقع دي تحت اسم كيمو العجلاتي ويقعد يهبل باي كلام ونفسه يتعرف علي اي واحد وحبذا لو كان عربي الجنسية عشان يتناك منه بالفلوس وهو غاوي يتناك في الخرابات وعلامته المميزه العجلة بتاعتة كل ماحد يقابلة يقوله هاسبقك علي الخرابة بالعجلة وتعالي حصلني بسرعة عشان طيزي بتاكلني كيمو يا عجلاتي كس امك احمر انا ما بنيكش عيال خولات زيك ولا فاضي لابوك وامك عيلة وسخة صحيح ماجبتش رجل عالج نفسك وطيزك الواسعة عشان انا قرفان منك ومن كس امك"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 31
subject = "إيه يا عدلات ده اللي عندك"
author = "كيمو العجلاتي"
posted = "2006-10-06"
text = "يعني يا عدلات يللي خالك وجدك ناكوا أمك زليخة..مين حيصدقك يا بهيمة؟ إعرفي الأول حكاية أم الرشراش يا شرموطة يا متخلفة عقليا..وإتكلمي الأول؟ مانتي فالحة إلا تعيدي كلمات أمك طيزك وكسك وزبورك...شوفي إزاي الأستاذ سيكو والعبد لله فضح أهلك..بصور بيانية مبتكرة..حافلة بالصورة والحركة...ووضح تفاهتك للخلق..شوفتي يابنت زليخة عينتك الجاهلة اللي مش متربية إلا على المجاري هي وحدها اللي بتحب السادات.<br />مش قلنا إنك نتاج سفاح خالك مناخيم وجدك بيجن مع أمك زليخة؟ علشان كده تخلف كس أمك العقلي وأكيد الجسدي وإنت أكيد خنثى وده مخليكي بتردحي للرجالة..لا يا شرموطة..ثلاثة بالله العظيم ما أنا سيكو ولا جعلص اللي كتبوا هنا ولا أعرفهم..يامتخلفة عقليا..ياخنثى..تعلمي للكلام يا عدلات."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 32
subject = "العجلاتي كيمو الخول"
author = "سيدك عادل"
posted = "2006-10-07"
text = "شزف يا خول يا لوطي انت انت خسارة الكلام معك لانك مش رجل ولا نص رجل حتي لكنك خنيث ومن عائلة وسخة وعلي فكرة انا اهرف ناس ناكوك فعلا السادات كل المصريين بيترحموا عليه وعلي ايامه وانجازاته يشعر بها كل المصريين اللي بيفكروا بعقولهم مش بطيزهم زيك اللي يعارض عودة سينا للوطن او يتكلم علي انجاز العبور ووضحتلك هبلك وانت بتتكلم علي خليج العقبة وبتقول ان السادات سمحلهم انهم يعدوا فيه رغم انهم بيستعملوه من الخمسينات والستينات ايام الهالك عبد الناصر والا مكانش يشتغل خليج العقبة مايعارضش السادات الا العرب الكلاب اللي عايزين نحارب لاخر جندي ويستمر الفقر والخراب لمصر وبعدين يعايروا مصر بالفقر وهم يستفيدوا من ارتفاع اسعر البترول ويزدادو غني كس امك علي كس ام العرب كلهم يا بغبغان يا لوطي زيهم وانت ماش وراهم عشان بينيكو طيزك بالفلوس العربية وبالمرة امك تتناك وتنبسط وانت وعيلتك الوسخة تكسبو فلوس يابو عجلة روح يابن اللبوة شوفلك خرابة بعيد اتفو عليك وعلي كس امك عيل خول ابن شرموطة"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 33
subject = "سيبك من الخنثى عدولة عدلات دي سكة"
author = "جمعة أبو شاطور الجزار(جار السوء المذكور في القصيدة"
posted = "2006-10-07"
text = "الله يا معلم سيكو يا جن! إنت شغال في مباحث الآداب وإلا إيه؟ إزاي عرفت التفاصيل دية كلها؟ يا مولانا ربنا غفور رحيم وأنا أيامها كنت طايش وهايج زي التور ومستعد أنيك حتى الحيط..وزليخة بنت خنيث أم الأبعد عدولة عدلات..مرة لبوة وتعز النيك قوي ولا تحب إلا تلاتة أربعة مع بعض..واحد في طيزها واحد في كسها وواحد في بقها الواسع وزبر في كل إيد. ده حتى فيه شريط فيديو تلاقية عند الواد شلظم بياع الجرنال على الناصية في أول الوايلي الكبير وإنت داخل بجوز جنيهات ببال وسيكام توب كواليتي.<br />مقدرش أقولك إن كان أبو عدولة عدلات خاله ولا جده بيجن دية مسألة إختلف فيها الفقهاء بتوع الوايلي، هما حبوا يلصقوه فيه أنا، لاكن على مين صاحبك واعي ومفتح، وبعدين يا معلم سيكو يا مجدع مين عايز خنثى زي عدلات مش عارفة روحها ذكر ولا أنثى؟ المهم بالمختصر المفيد نظرا لأنها مخصية شيطاني كده، وليها بزاز وكس ودلدول يجي ربع سنتمتر، ألحقوناها تشتغل طواشي في معية جمال إبن النطع السادات، وكانت فرجة له وللخولات بتوعة وكانت بتكسب كويس يعني بأمانة محدش يمص إزبار زيها في القارة كلها آه، وطيزها وكسها مميمهم الزباين التمساح والحوت. قام بقى لما إتعدم السادات على الهوا بقت صايعة لاشغلة ولا مشغلة..والنهاردة شراميط تايلاند وصالونات المساج مسحوها خالص..تفهم تبقى ليه هيه قبيحة وسليطة كده، من غيظها وحقدها وحسرتها وأملها الإبليسي إن جيمي مبارك يستخدمها في معيته، لاكن بعينها دي تخينة قبيحة فشلة وليها ريحة. دي شهادة مني وإقرار مقدم لسيادتكم بدمغة وعرض حال."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 34
subject = "شباب عدولة هاي صهيونية"
author = "مؤيد الطرابلسي"
posted = "2006-10-07"
text = "ليكي كس إمك ولاه عدولة عدلات شو شرموطة بنت قحبة وبنت حرام، شو العرب ناكينها لإمك يا خنثى؟ وشو يعني ما دفعوا؟ إمتى مصر حاربت عن العرب ولاه بنت القشف والجرب؟ قولي لأشوف علميني؟<br />مصر ليكي طول عمرها عايشة من الشحاذة..فتحي كسك وسع المجيدي وشوفي منيح؟ هلا مصر ما بتارحب من أربعين سنة..ليش شعبها الطيب الأصيل جوعان وأولاده عم بيهربوا للخارج؟ إنقبري ليكي إنت مانتي مصرية إنت صهيونية من تل أبيب..عم بتوقعي الناس ببعضهم..إنحرقي يا خنثي وإدفني حالك ببيت ميه..ملعون أصلك."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 35
subject = "تظلم لريس الجمهورية من عدلات وأمها زليخة"
author = "عويس عويجة العربجي"
posted = "2006-10-07"
text = "سيادة الرئيس ملاذ العدالة وحامي حقوق العباد تحية طيبة وبعد/<br />أنا المواطن عويس عويجة من سكان المطرية، صنعتي عربجي أعمل في نقل الحاجيات، لاحظت من فترة إن صحة الحمار والبغل والحصان اللي حيلتي في تدهور مستمر، وبدت تظهر علي البهايم عادات غريبة زي تدخين السجاير، وإلا كل ما نمر على خمارة ألاقي البهايم وقفت هناك وما تتحرك بألف كرباج، وكمان كل ما تمر واحدة ست تخينة ألاقي البهايم تجري وراها..وعايزة أعوذ بالله..سيادتك عارف. وبهايمي عقال أمالتك يا ريس متربية على الأصول زي أنجال سعادتك. بعد البحث والتحري إتضح إنه المدعوة عدولة عدلات وأمها زليخة بيعملوا إغراء للبهايم الطيبة وبيستغلوهم لأغراض جنسية وبيصوروا معاهم أفلام كمان، أرفق منها 20 نسخة تم الحصول عليها من السوق السوده. أنا من محبي سيادتك ياريس وسميت بهايمي على إسمك وإسم أنجالك. أرجو من سيادتكم التحقق وعقاب الجناة، وكذلك إعادة عصيان الهاون اللي سرقوها وبيحشوها لا موآخذة في..........هم.<br />كاتبه<br />خلف الله خليف العرضحالجي<br />ساقط إعدادية"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 36
subject = "الي مؤيد الطرابلسي ابن اللبوة"
author = "سيدك وتاج راسك عادل"
posted = "2006-10-07"
text = "اسمع يا شامي يا معفن انت مصر عمرها ما كانت شحاتة ودايما كانت بتصرف عليكم انت واهلك عشان كده ياغبي بتسموا الفلوس المصاري لانها كانت بتيجي لكم من مصر العمالة للصهيونية دي طبع اصيل عندكم والا ماكانش الشعب الفلسطيني نصه واخد الجنسية الاسرائيلية وماعندوش استعداد يتنازل عنها والب باقي نصهم جواسيس وبيبلغوا الاسرائيليين عن تحركات المقاومة والسوريون معروف بيعهم للجولان لاسرائيل وبقالهم 35سنة مااطلقوش رصاصة يلعن ابوك لابو العرب كلهم انتو حاقدين علي مصر عشان السادات البطل رجع لنا ارضنا احنا اللي عملناكم بني ادميين فاهم ياكس امك يا متناكين من<br />الاسرائيليين كل يوم وما تقدروش تردوا غير في الاعلام بس لان معظمكم عملاء بعد كده ما تتطاولش علي اسيادك المصريين وعلي ستك مصر يا حثالة يا خول ياشوية اعراب ولاد وسخة واخيرا اللي يلعنك يا عجلاتي كيمو يا خول جبتلنا صاحبك اللوطي يتجرأ علي مصر ولاد شرموطة صحيح"
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 37
subject = "إعتذار للإخوة العرب عن بذاءات عدولة بت الزنوة"
author = "طارق الليثي"
posted = "2006-10-08"
text = "تحية للسيد أبو شعلان من الكويت، أشكرك من قلبي لأنك ركزت الضرب في الساقطة بنت الساقطة الصهيونية عدلات عدولة بت الزنوة، عاجباني قوي بنت الزنوة دي لأنها مطابقة لحال عدلات. إحنا كمصريين كعرب ومسلمين على المستوى الشعبي بنؤمن بضرورة التلاحم والوحدة بين أبناء الأمة العربية من محيطها الى خليجها. ذيول وخدام الصهيانة اللي عدلات الخنثي اللوطية نفسها تشتغل بوق ليهم ومحدش معبرها، هما اللي بيغرسوا في بعض ضعفاء النفوس من المصريين هذا الفكر الشيطاني السام، وده فكر رعاه وتعب علية سيدها الكلب السادات الخاين العميل الواطي وخليفته اللامبارك الدلدول.<br />أنا وكل شريف مصري بأعتذر ليهم عن بذاءات الشرموطة بنت القحبة والزنوة عدولة عدلات وأؤكد إن مصر لا يشرفها وجود اللي زيها على ترابها الطاهر. تحية إعزاز وإجلال للمقاومة وللشعب الفلسطيني الباسل وإعذرونا إنا بنخذلكم وحكومتنا أكبر متآمر عليكم والله كشعب ما في إيدنا حيلة، وكذلك تحية إكبار للسيد حسن نصر الله ولكل من سانده في سوريا وإيران ومن الشعوب.<br />إخرسي يا عدلات بنت الزنوة فضحتينا وعرتينا يابنت الوسخة ربنا ياخذك لجنهم مع السادات."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
order = 38
subject = "الرئيس البطل صدام حسين تأريخ جديد مشرف"
author = "أبو شعلان الكويتي"
posted = "2006-10-08"
text = "يكتب التاريخ المنتصرون مقولة بدأت مع بداية التأريخ , و استمرت تؤرخ للمنتصرين تاريخ يكتبونه كما يشاءون , و يحذفون منه قصصاًُ و مواقفَ و حوادثَ من خسروا الحرب أو حتى معركة من الحرب , قد يزوِّرن الحقائق أو يقلبون الأدوار بين الخير و الشر , ويصنعون قصصاً لا يعرفها إلا خيالهم الواهم , لكنها حقيقة فقط لأنهم هم المنتصرون .<br />الحرب الجنونية المتوحشة التي شنها العدوان الأمريكي ضد شعب وتاريخ العراق و الأمة العربية , و التي خسر السيد الرئيس صدام حسين أولى معاركها ونتج عنها أن احتل الأمريكان عاصمة الدنيا بغداد , و لكن الأغبياء الأمريكان بعد أن احتلوا العراق , و لأنهم لا يفقهون شيئاً عن التاريخ أرادوا أن يطبِّقوا مقولة التاريخ يكتبه المنتصرون فصورا الأسرى العراقيين و العراقيين المتوحشين الذين نهبوا المؤسسات و الوزارات و المتاحف , و حتى أنهم أرادوا أن يشوهوا صورة السيد الرئيس صدام حسين و تصويره بمنظر الجبان الذي يختبئ و يهرب من الأمريكان عندما تم اعتقاله , و لكن ولسوء حظهم و عملهم فإن الحقيقة لا بد أن تظهر و لم تطبق مقولة التاريخ يكتبه المنتصرون لثلاثة أسباب حسب رأيي هي :<br />أولاً – إن الأمريكان انتصروا في معركة واحدة و لم ينتصروا بالحرب لأنها لم تنته بعد و لم تُكتب فصولها الأخيرة , و أغلب الظن إن انسحاب الجيش العراقي من المعركة لعدم تكافؤ القوى ظنه المجرمون إنه انتصار .<br />ثانياً – إن الأمريكان انتصروا في معركة واحدة , و لذلك لم يستطيعوا امتلاك أدوات التأريخ من مؤرخين و مفكرين و دور نشر ومطابع و سبل الانتشار التي باتت اليوم سهلة و ميسرة و بأقل التكاليف بحيث أنها تمكن أي شخص من عرض وجهة نظره حتى لو تناقضت مع وجهة نظر البلاط الحاكم الذي كان سابقاً يكتب التاريخ كما يريد .<br />ثالثاً – إن الأمريكان ا<br />اقرأ بقية التعليق .."
archived = "2006-10-24"
capture_url = "https://web.archive.org/web/20061024011814/http://masr.20at.com:80/article.php?sid=1005"

[[comments]]
