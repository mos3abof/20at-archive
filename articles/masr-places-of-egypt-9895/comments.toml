author = "اكتب اسمك هنا"
posted = "2008-08-18"
text = "ده شاطئ عجيبة اللى انت شفته دلوقتى … والذى لا يقارن من قريب او بعيد بشاطئ عجيبة الذى زرته أنا منذ 17 عام<br />الآن عجيبه اصبح عجب العجاب اصبح توجد به شماسى والناس بتنزل تستحمى وتعوم فى الشاطئ مع انه شاطئ صخرى ومش بتاع عوم وزمان كان المكان ده فاضى تماما غير انك تزور الشاطئ ومتنزلش فيه يعنى مزار سياحى بس اخر مرة زرت الشتطى من سنتين صعب عليا حاله بعد الأهمال اللى وصله والرائحة الكريهة المنبعثه منه … وحسبى الله ونعم الوكيل"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105141825/http://20at.com/masr/places-of-egypt/9895-2009-06-10-17-55-10.html"

