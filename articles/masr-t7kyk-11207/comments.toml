author = "دبي - نادية سلطان"
posted = "2009-02-06"
text = "اكد اللواء خميس مطر المزينة نائب القائد العام لشرطة دبي خبر إلقاء القبض على الملياردير المصري نبيل البوشي صاحب شركة “اوبتيما جلوبال هولدنج لتداول الاوراق المالية” ومقرها دبي بتهمة النصب واعطاء شيكات من دون رصيد.<br />وقال اللواء المزينة ان البوشي موقوف في دبي لافتا الى ان التحقيقات جارية معه في شأن البلاغات المقدمة ضده والتي وصلت حتى الآن إلى قضيتين، مشيرا الى انه في حال طلب السلطات القضائية المصرية له لاتهامه في قضايا اخرى داخل مصر فان طلب استرداده يكون عبر النيابة العامة.<br />وأوضح انه لن يتم تسليم البوشي لأي جهة إلا بعد الانتهاء من القضايا الموجودة عليه في دبي وقضاء مدة العقوبة التى سيحكم عليه بها وذلك وفقاً للاتفاقات الموقعة والاجراءات القانونية المتبعة في هذا الشأن ومن بعدها يتم تسليمه لجهة طلبه بناء على ملف الاسترداد الخاص به ومن خلال الجهات الرسمية المختصة في دولة الامارات.<br />وكان النائب العام المصري المستشار عبد المجيد محمود اعلن امس في القاهرة انه طلب من السلطات القضائية بدولة الامارات العربية المتحدة تسليم نبيل البوشي لاتهامه بتلقي اموال بلغت في جملتها 37 مليون دولار امريكي من مواطنين مصريين بزعم توظيفها واستثمارها في نشاط تجارة الاوراق المالية مقابل عائد شهري الا انه استولى على تلك المبالغ وامتنع عن ردها والفوائد المستحقة عليها حيث تلقت النيابة العامة المصرية حتى يوم امس الاول نحو 48 بلاغاً ضده من ضحاياه داخل مصر وجميعهم من رجال الاعمال والتجار المصريين.<br />وقال النائب العام المصري في بيانه انه يتم حاليا إعداد ملف استرداد المتهم لارساله الى السلطات القضائية الاماراتية في غضون الايام المقبلة، لافتا الى ان هناك تعاوناً قضائياً قانونياً بين الدولتين في هذا الشأن.<br />وذكر النائب العام المصري ان واقعة نصب الملياردير تفجرت الاسبوع الماضي بعد ان ألقت شرطة دبي القبض على المذكور اثناء محاولته مغادرة مطار دبي متوجها الى لندن بعد ان حرر شيكا من دون رصيد لسيدة اماراتية بمبلغ مليون درهم وتنازل لها عن شقة فاخرة يملكها في دبي وسيارة فاخرة ايضا كما تقدم احد رجال الاعمال المصريين والمتعاملين مع البوشي بتقديم شيك من دون رصيد آخر للسلطات الامنية في دبي بقيمة 5.12 مليون دولار مما ادى الى استمرار اعتقاله.<br />وأكد المستشار عبد المجيد محمود في بيانه انه تبين من خلال التحقيقات مع ضحايا البوشي ان هناك أعداداً كبيرة من المودعين لدى شركته من طبقات اجتماعية مختلفة من رجال اعمال وتجار وفنانين ورياضيين وسياسيين ومستثمرين خليجيين من الامارات والسعودية ايضاً، لافتاً الى انه من المتوقع ان يصل حجم المطالبات المالية عليه لأكثر من نصف مليار دولار إلا ان ذلك لم يتأكد بعد، مشيراً الى ان لشركة البوشي مقار في مصر ودبي ولندن ويتعامل مع بورصات عالمية كبيرة.<br />وفي تفاعل لقضية البوشي أذاع برنامج القاهرة اليوم على تلفزيون “الاوربيت” على مدار يومين لقاءات مع عدد من ضحايا الملياردير نبيل البوشي الذين اكدوا في اتصالات هاتفية مع البرنامج من مصر والسعودية والامارات انهم أودعوا مبالغ كبيرة لديه وان هناك تعاملاً معه منذ سنوات وكان يمنحهم ارباحاً شهرية تتراوح بين 20 الى 30 % على إيداعاتهم الا انه توقف عن السداد منذ شهر رمضان الماضي.<br />ونفت سيدة مغربية تدعى “ح . ب” في اتصال من المغرب كانت متزوجة من البوشي منذ 9 أشهر وطلقت منه منذ شهر فقط اتهامات الضحايا لها انها وراء فقدان اموال البوشي بعد ان اشترى لها ثلاثة قصور في المغرب وباريس ومصر وشقة على نيل القاهرة وانها استولت على ما يقرب من 80 مليون دولار من امواله بموجب توكيل عام وقالت انها زارت البوشي في محبسه في دبي يوم 23 من شهر يناير/ كانون الثاني الماضي وحرر لها ورقة يبرئها من هذه الاتهامات وأرسلت نسخة من الورقة الى البرنامج وقررت انها مقابل هذه الادعاءات سوف تتقدم ببلاغ ضد البوشي لأنها مودعة لديه مبلغ 200 ألف دولار الا ان بعض الضحايا كذبوا اقوالها ايضا واكدوا انها تلقت تحويلا منه منذ ايام بمبلغ 300 ألف دولار على احد البنوك وان شقة النيل تبلغ قيمتها ب 3 ملايين جنيه مصري ولاتزال مسجلة باسمها.<br />كما اجرى عمرو اديب مذيع البرنامج اتصالا مع المحامي المصري سمير صبري الموجود في دبي حالياً والذي اكد انه حضر لدبي موكلا عن 6 ضحايا مصريين واماراتيين تصل ايداعاتهم لدى شركة البوشي إلى عشرات الملايين من الدولارات. ولا تزال المفاجآت تتوالى في قضية البوشي الا ان المؤكد انه موقوف خلف القضبان في سجن دبي."
