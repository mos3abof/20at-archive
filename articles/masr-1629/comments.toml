[[comments]]
order = 1
subject = "لكم اخطأتم"
author = "ايمن امام"
posted = "2007-02-23"
text = "اسيدتى الفاضله كلكم اخطأتم<br />انتى اخطأتى فى حق نفسك بقبولك الزواج سرا من هذا الرجل دون ان تعلم زوجته فهذا حق له = وكان اولى به لو كان رجلا بمعنى الكلمه ان يخير زوجته بين الاستمرار فى الحياه الزوجيه والجمع بينك وبينها وبين الانفصال= ولكنك انسقتى وراء رغباتك ولم تفكرى ولو للحظه واحده فى كونها علاقه زوجيه مفترض لها الاستمرار وليست علاقه عابره ليلهاو ليلتين== انتى اخترتى لنفسك ان تبقى فى الظل =تماما كاعشيقه= فليس لك الحق ان تتزمرى من هذا الوضع == انا اكاد ان اجزم انك كنتى وراء تسريب خبر زيجتك للزوجه الاولى ==<br />اما زوجك فأنه لايرغب سوى فى اشباع رغبات جنسيه = وتحقيق الرغبه الدفينه فى كل رجل بالجمع بين عده زوجات=<br />اما الزوجه الاولى فلها دور فى هذا فأهمال الزوج وعدم الاهتمام به== والحجه التى لاتتغير == انا اهتم بأولاده وهذا يعد اهتماما به هى فريه تحاولن بها الدفاع عن قضيه خاسره لانكن وبمجرد ان ترزقن بطفل تتحول مشاعركن الى التوحد للطفل ويتحول الرجل الى مصدر تمويل فقط = وبالتالى فهو يبحث عن الخليله= التىتعوضه عن الوحده نعم الشعور بالوحده فى داخل اسرته التى قد يتجاوز عددها طفلان او اكثر= اعرف اسرا كثيره تحول فيها الرجل الى شىء فى الاسره لايمثل وجوده او عدم وجوده شىء = بهيمنه المرأه واستقطابها للاطفال= والنتيجه= فشل = ايمن امام"
archived = "2007-02-24"
capture_url = "https://web.archive.org/web/20070224105627/http://masr.20at.com:80/article.php?sid=1629"
