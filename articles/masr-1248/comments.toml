[[comments]]
order = 4
subject = "ذكريات وشجن"
author = "أسامة- إيطاليا"
posted = "2006-12-04"
text = "أما بعد, طرح الموضوع بهذة الطريقة وبهذة البساطة جعلني أعود بأيام الثانوي والنطرات ذات المعني والابتسامات الخفيفة التي كنا نتبادلها مع حبيبة القلب وكانت تكفينا لنصارح بعضنا بما تكنة القلوب والطريق الذي نسلكة ذهابا وأيابا من والي المدرسة ولو تأخر احد منا عن موعدة نعلم بالضرورة أين سنلتقي عند الدخول أو الخروج،وأشياء أخري كثيرة لن يتسع المجال لها،المهم يكفي نظرة أو همسة للتعبير عن مكنون القلب،ولما ذهبناللجامعة كنا نتلاقي يوميا بالمواصلات ومن يأتي قبل الآخر يحجز أقرب مقعد للثاني وعلي مقاعد قاعة المحضرات كنا دائما بجوار بعض لم تقل لي احبك ولم اقل لها أعشقك،كانت الكلية بجميع صفوفها تعلم أننا نحب بعض ولما حانت لحظة الزواج تقدمت لآهلها بشبكة متواضعة وكان عليا ان انهي فترة الخدمة العسكرية ثم ابحث عن عمل لاتزوج ورفض اهلها وانفطر قلبي وقلبها ورحلت بعيدا بحبي الي ايطاليا وتزوجتٌُِِ هي بصديق لي كان يعلم بحبنا وتزوجت انا ولكن قلبي مايزال ينبض بحبها ولم تراني وتحاشيت رؤيتها طوال سنوات عدة واتصلت بي بعدما علمت بطلاقي فلم افتح لنا مجال وكانت أخر كلمات ولم تقول لي احبك ولم اقل لها أعشقك،أين انتم اليوم من الحب."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205211001/http://masr.20at.com:80/article.php?sid=1248"

[[comments]]
order = 5
subject = "خربوكى يا مصر"
author = "مظلوم"
posted = "2006-12-04"
text = "الجرائم البشعة التى وقعت فى مصر مؤخرا والتي ارتكبتها عصابة من المشردين باغتصاب وقتل أطفال الشوارع بطرق بشعة وصلت لدرجة إلقائهم أحياء من فوق اسطح القطارات المسرعة!! هذه الجرائم وأعداد الضحايا الكبيرة، لو حدث هذا فى بلد يحترم آدمية الإنسان لقامت الدنيا ولاستقال وزير الداخلية فورا بل والحكومة كلها ولان وزير الداخلية فى مصر مشغول بما هو اهم من فض المظاهرات بالقوة والأمن السياسي وحبس المعارضين، فكل ما يحدث خلاف ذلك لا يعنيه والدليل انه على بعد امتار من مكتب سيادته بوسط القاهرة يوجد اكبر تجمع للمشردين ومراهقين من الجنسين يعيشون حياتهم على الارصفه بل تفاصيلها والفتيات منهم يحملن اطفال رضع.<br />سلوى الكيال- القاهرة<br />نقلا عن صفحة اراء حره بموقع bbc<br />فضيحه ومصيبه بكل المقاييس ولو كان للمصريين تمن لقامت الدنيا على راى الاستاذه صاحبة الرساله ولكنهم عبيد الاحسان فى عزبة الحراميه والسفاحين عليه العوض ومنه العوض"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205211001/http://masr.20at.com:80/article.php?sid=1248"

