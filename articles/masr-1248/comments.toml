[[comments]]
order = 0
subject = "جوليو .. ورومييت .. لا تقتلوا .. شكسبيرنا .."
author = "إبن بهية"
posted = "2006-12-04"
text = "يا جماعه أنا حاسس كده إننا بنتسرق كل يوم .. لأ مش قصدي مبارك الواطي وعصاباته اللي ناهبين البلد .. أنا قصدي حاجه تانيه خالص .. إحنا بنتسرق في ثقافتنا .. بنتسرق في حضارتنا .. بنتسرق في مشاعرنا .. بنتسرق في عواطفنا .. التي بدأنا نثير إشكاليات عويصة حول طريقة التعبير عنها ، تلك الإشكاليات التي تجاوزتها الأمم منذ قرنين .. خلونا نتكلم بهدوء شويه .. هو إحنا مكتوب علينا إننا لازم نمشي في نفس الطريق اللي مشيوا فيه وجابوا آخره ولقوه ضلمه زي ما بنسمع كل يوم ف يصحافتهم من الفشل الإجتماعي التام تقريباً ؟؟؟<br />معظمنا قرأ في فترة من حياته رائعة شكسبير روميو وجولييت وعاش لحظات ذلك الحب العذري الجميل .. وأكثرنا زارته تلك النشوة يوماً ما .. روميو كان روميو وجولييت كانت جولييت ، فلا روميو كره صورة جولييت الجميله الوديعه ولا جولييت تمردت على حالتها ورفضت أن تعيش كعصفور جميل تحت جناح روميو .. لم يكن روميو ينتظر أن تبادره جولييت بالاعتراف بحبها .. هو من تسلق الأشجار وتكبد المشاق ليصل إليها في عليائها .. وبقيت على هذه الحالة العالية في عقله وقلبه .. يا ترى لو أن جولييت هي التي تدحرجت من عليائها تلك وبادرته هي بحبها كان يمكن لروميو أن يموت من أجلها ؟ أو كان حتى شكسبير كتب القصة من أساسها ؟<br />تلك كانت الحياة عندهم قبل قرنين .. حب عذري جميل .. رجل يسعى ويدنو وامرأة تتعفف وتتمنع ولا تنطقها ربما أبداً ولا أقول تبادر أولاً .. كان الرجل عندهم يشعر بهذا الحب بوسائل أخرى غير صوتيه ماديه منطوقه وكان الجميع سعداء إلى أن تبدل الحال وعملت المحافل الماسونية على زعزعة هذا الكيان الأسري في الغرب لتفسيخ المجتمع الكاثوليكي فأقنعو جولييت بأن تتروم فترومت وتورمت وصارت منتفخة كالبالون بدعوى حقوقها المسلوبة لدى روميو ا<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205211001/http://masr.20at.com:80/article.php?sid=1248"

