text = "انا شايف انه مش لازم ان البنت او الولد يصرح الاول<br />ممكن اوى ان يكون الحب دا اتولد بعد مثلا ما اتعرفوا على بعض فى اى مكان مش بغرض الحب يعنى وبعد كدا كل واحد منهم بدا يحس ان الطرف التانى مهتم بيه غير اى حد تانى و يبداو يقربوا من بعض اكتر وييجى الحب كدا من الطرفين مش لازم واحد يعترف يعنى او يصرح لانه الحب يعنى حاجه كدا نقدر نقول عليها بين القلوب ملناش يد فيها يلا بااااااااااى"
