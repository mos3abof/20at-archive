posted = "2006-12-05"
text = "السلام عليكم و رحمة الله و بركاتة<br />في رأيي اهم ما يميز المرأة حياءها , و هو اللؤلؤ الباقي في زمن الفالصو , فالشكل يتغير و الظروف تختلف و المعايير تتبدل و لكن اياكي اختي و حياءك الذي قد يضيع منك بدعوي حرأية الرأي و حرية المرأة و وقتها تعرفين قيمته و تترحمين عليه و تدعينه فيأبي ان يعود لمن تخلت عنه.<br />دمتم بخير"
