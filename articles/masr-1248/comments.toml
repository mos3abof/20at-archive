[[comments]]
order = 2
subject = "الحب الحقيقي الذي يكون في صمت"
author = "باربي"
posted = "2006-12-04"
text = "ندما تحب الفتاه ولم تصرح فهذا حب من طرف واحد وهذا اصعب واقوي انواع الحب مثل ما يقول خالد عجاج \"اصعب حب\"لانه حب مكتوم فيه تعب وشد للاعصاب لانها ممكن تراه يقف مع فتاه اخري فسوف تشعر بجنون او تراه يتحدث في التليفون او.....ومن اسباب صعوبته ايضا انها ترسم له صوره في خيالها وممكن تكون صوره غير صحيح وممكن تكون صحيحه ولكن قليل ما تكون صحيحه لانها تحب والحب اعمي وفي تلكه الفتره تتضيع منها فرص كثيييييييييييره"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205211001/http://masr.20at.com:80/article.php?sid=1248"

