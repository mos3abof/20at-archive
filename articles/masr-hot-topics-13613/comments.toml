text = "انا عن نفسى كنت فى المرحلة الابتدائيو و الاعدادية كنت اجلس فى الامام لكن فى الثانوية احببت الجلوس فى الخلف حيث الضحك و المسخرة و الرغى و النوم ة اللعب بالموبيل و الهزار"
archived = "2009-12-30"
