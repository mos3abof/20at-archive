text = "السلام عليكم ورحمة الله وبركاته<br />بصراحه موضوع مرره حلو بالنسبه لي انا كنت دائما نفسي اجلس في الصف الثاني وكانوا دائما يحطوني في الصف الاول لاني ما كنت مرره طويله في الابتدائي لكن في المتوسط والثانوي تحقق حلمي والحين صرت دائما اقعد في الصف الثاني او الثالث"
archived = "2009-10-06"
capture_url = "https://web.archive.org/web/20091006044210/http://www.20at.com:80/masr/t7kyk/13613-2009-10-04-12-54-24.html"

[[comments]]
order = 1
subject = ""
author = "زمزم"
posted = "2009-10-04"
text = "انا منذ صغرى بقعد امام فى اول دسك فى النصف فى المرحله الابتدائيه واولى اعدادى وتانيه بس ثالثه بداءنا نقعد فى اخر دسك وكانت القعده ممتعه جدا وظل ذلك حتى ثانوى بس هذا مش كان يمنع اننا كنا متفوقين وبنتناقش مع المدرسين اما دلوقتى فى الجامعه بقعد امام علشان العدد كبير ومش هفهم حاجه"
archived = "2009-10-06"
capture_url = "https://web.archive.org/web/20091006044210/http://www.20at.com:80/masr/t7kyk/13613-2009-10-04-12-54-24.html"

