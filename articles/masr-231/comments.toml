[[comments]]
order = 0
subject = "هذيان"
author = "عم دهب من مدينة دهب (ميكى)"
posted = "2006-04-26"
text = "السلطة فقدت عقلها و أصحبت تهذى و يبدو أن مختلا عقليا قد هاجم وزارة الداخلية و جلس على كرسى وزيرها و هو يحرك الامور الان بحشد المدرعات و الحيوانات التى تشبه فى شكلها الخارجى الى حد كبير البشر و التى موطنها الأصلى معسكرات الامن المركزى و تأكل الروث و المخلفات حشدها مقابلة حفنة من الشرفاء و الجدير بالذكر أن الشعب اللامبالى يتفرخ و لا يبالى و كأن الصراع يدور فى تشاد مثلا أو مدغشقر !!"
archived = "2006-05-04"
capture_url = "https://web.archive.org/web/20060504180857/http://masr.20at.com:80/article.php?sid=231"

[[comments]]
order = 1
subject = "العيب مش عليهم"
author = "مصرى"
posted = "2006-04-26"
text = "العيب على حسنى مبارك إللى ناسى حتى هو بيحكم أنهى دوله جشع المال والسلطة والنفوذ وفكرة التوريث المجنونة جعل منه حيوان لا يستطيع أن يدرك أن وجوده فى الحكم لخدمة الشعب وليس أن يجعل الشعب كله عبيد عنده الوزراء ما هم إلا عرائس فى مسرح العرائس وهو وإبنه وزوجته الذين يحركونهم ولو أردنا الإصلاح فلابد وأن نبدأ بكبيرهم ونحطمه فهو سبب الفساد ونذكر أن الفساد دائماً فى رأس السمكة"
archived = "2006-05-04"
capture_url = "https://web.archive.org/web/20060504180857/http://masr.20at.com:80/article.php?sid=231"

[[comments]]
order = 2
subject = "كفاية"
author = "معارضة"
posted = "2006-04-27"
text = "الصراحة وزير الداخلية جاب اخره معانا مش كفاية انه مش سايب حد لغاية اما وصل للقضاة كمان و ياريته بيحافظ على الامن لأ ده كل يوم و التاني تفجيرات و مشاكل<br />بجد كفاية واحد غيره كان استقال من زمان و لو مستقلش كا اقيل من الماسك البلد لكن لا ده ولا ده بيهمهم الشعب"
archived = "2006-05-04"
capture_url = "https://web.archive.org/web/20060504180857/http://masr.20at.com:80/article.php?sid=231"

[[comments]]
order = 3
subject = "راح نبقى"
author = "دقت ساعة الحق"
posted = "2006-05-02"
text = "نرفض احنا نموت قولوله راح نبقى<br />فارضك والبيوت راح نضحى ونموت<br />شعب مصر اتكلم وافتكر صلاح جاهين<br />دا اللى ما يتكلم يا كتر همه<br />وعجبى"
archived = "2006-05-04"
capture_url = "https://web.archive.org/web/20060504180857/http://masr.20at.com:80/article.php?sid=231"

[[comments]]
order = 4
subject = "دى قضية مصر كلها"
author = "مصرى"
posted = "2006-05-08"
text = "أعتقد أن الإعتصام حق للإنسان فى دولة حرة ولكن مصر دولة تحت الإحتلال ولننظر كيف كان الزعماء فى عصور الإحتلال لمصر يتعاملون مع المحتل والدفاع عن مصر وعن شرعية وجود المحتل على أرض مصر الغالية وهم جميعاً من الحقوقيين مثل مصطفى كامل ومحمد فريد وسعد زغلول وغيرهم كثير. فنظام الحكم الموجود فى مصر ليس نظام شرعياًلأن الرئيس حسنى مبارك لم يأتى للحكم منذ تولى الرئاسة بإنتخاب الشعب كما ينص الدستور وكان وجوده فى الحكم طوال هذه السنوات بالتزوير وما بنى على الباطل فهو باطل. ثانياً كيف للقضاء أن يرتضى لنفسه هذه الوقفة المستجدية فى دولة محتله كان من المفروض المطالبة بتحرير مصر وليس الإنتظار من المحتل أن يعطيهم حقوقهم التى سلبها منهم الذى هو من وجهة نظر القضاء المتهم الأولى على قتل السادات وكل الأدلة تشير إلى أصابعة الخفية فى ذلك وكان لا بد أن يسقط القضاء شرعية الحاكم فى وجوده فى الحكم. وأيضاً لما أصاب مصر من فساد وتدهور وإخلال بكل مؤشرات الحياة من بطالة وتعليم وصحة وقتله للحياة الديمقراطية لكى يضمن سيطرة على الحكم وهذه نفس سياسة المحتل ولكن الحل الوحيد الذى لا بديل عنه هو الثورة على هذا الفساد وخاصة أن الشعب كله مؤيد لكم وملتف حولكم ولكنه ينقصه القيادة وأنتم القيادة الصالحة التى يتمناها المصريين جميعاً فماذا تنتظرون هل تنتظرون أن يقضى عليكم الحاكم كما فعل فى الحياة الحزبية وبذلك تفقدوا حتى أحترام الشعب لكم لا امل الأن إلا بالثورة والشعب كله معكم وفى إنتظار شرارة البداية على أيديكم يا شرفاء مصر لنطهرها من هذا الفساد المتسرطن"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120759/http://masr.20at.com:80/article.php?sid=231&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
