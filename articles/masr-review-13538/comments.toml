subject = ""
author = "صالح مرسى متطوع"
posted = "2009-09-27"
text = "اولا صالح مرسى متطوع بالاعدادية يا غبى وترقى من اومباشى الى شاويش الى باش شويش ثم الى مساعد ضابط اللى هو صول بخشبة على كتفة ثم ترك الخدمة واكمل الدراسة من منازلهم وكان غاوى قصص ارسين لوبين وشرلوك هولمز وعندة خيال واسع فى قصص المغامرات والمخابرات<br />وكل اللى كتبة شوية هراء لا يمت لعالم الواقع بصلة وبعد اذاعة رافت الهجان ضحكت اسرائيل علينا للصبح<br />وطبعا القصص دى تنفع لاثارة المراهقين وهى ساذجة فنيا وغير مترابطة واحداثها مسروقة من قصص عالمية"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014636/http://www.20at.com:80/masr/review/13538-2009-09-27-11-57-34.html"

[[comments]]
order = 1
subject = ""
author = "غباوه ولا استظراف"
posted = "2009-09-27"
text = "ياريت تبطل استخفاف<br />اولا صالح مرسى خريج آداب فلسفه وبعدها اتجه للبحريه وعمل فيها ضابط مساعد<br />ثانيا دى مش شطحات.. بعض الكتاب بيزود تفاصيل على ا لقصه الحقيقيه لدواعى امنيه<br />ثالثا<br />ايه علاقه اللى انت بتقوله باللى كاتب المقال بيقوله<br />ارحمونا من الغباوه"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014636/http://www.20at.com:80/masr/review/13538-2009-09-27-11-57-34.html"

[[comments]]
order = 2
subject = ""
author = "صالح مرسى"
posted = "2009-09-27"
text = "قصص الصول بحرى على المعاش صالح مرسى<br />اولا صالح مرسى مش ضابط ولا كان فى المخابرات دة كان حتة صول او مساعد فى القوات البحرية وتقاعد بعد خدمة صف ضابط طوال عمرة وكتب القصص دى<br />صحيح كان فية عمليات عسكرية بطولية وهجومية لابطال البحرية زى عملية ايلات واغراق الحفار فى دكار وهذا كان هجوم مباشر<br />اما قصص الجواسيس فدى واسعة قوى وشطحات خيال"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014636/http://www.20at.com:80/masr/review/13538-2009-09-27-11-57-34.html"

[[comments]]
order = 3
subject = ""
author = "قصص وهمية"
posted = "2009-09-27"
text = "اولا الاستاذ هيكل لمح الى حكاية الهجان دى وقال انها وهم وخيال<br />مش عايزين ندخل فى اذهان الناس بطولات وهمية لا اساس لها فى الواقع - احنا شعب تعبان وقدراتنا محدودة ونفسنا قصير وملناش فى الحاجات دى<br />احنا لنا فى الفتة ومحشى البدنجان<br />ولو عندنا استخبارات مكنش اليهود نزلوا فى البحر الاحمر وفككوا الرادار وصوروا عملية الفك بالفيديو وحملوة على الهيلوكوبتر وخدوة اسرائيل<br />بلاش عنتريات وقصص كدابة وموسيقى تصويرية والعيش فى دنيا الوهم والخيال"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014636/http://www.20at.com:80/masr/review/13538-2009-09-27-11-57-34.html"

[[comments]]
order = 4
subject = ""
author = "كان هناك جواسيس"
posted = "2009-09-28"
text = "نعم كان هناك جواسيس لاسرائيل فى مصر فى مرحلة بناء قواعد حائط الصواريخ وتم كشفهم وحضر بعد الناس الذين اعرفهم عملية اعدامهم رميا بالرصاص<br />وكانت هناك بطولات رائعة للمخابرات المصرية فى حماية الاسرار العسكرية وتامين الجبهة وتضليل اسرائيل<br />هناك اناس فى الظل ابطال تعبوا وسهروا فى حماية اسرار القوات وتحركاتها<br />وتلك القصص اعظم بكثير مما يتخيل اى انسان ولم يتم اذاعتها<br />ولكن قصص المسلسلات والنسوان والخمر والسهرات والسفريات وناس بتستخدم اجهزة لاسلكية فى ايطاليا وكان ايطاليا مفيش فيها شرطة ولا حكومة كما راينا فى المسلسل الاخير فهذة اوهام لاشخاص مرضى"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014636/http://www.20at.com:80/masr/review/13538-2009-09-27-11-57-34.html"

