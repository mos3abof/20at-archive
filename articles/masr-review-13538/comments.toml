posted = "2009-09-30"
text = "كلام صح يا احمد<br />المسلسل دة الوحيد الكنت متبعاه فى رمضان<br />لكن اخر حلقة حسيت ان النهاية بتوحى لمسلسل هايف وى<br />عمل زى الجاسوسية دى لازم نهايتها تكون قوية ومؤثرة"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014636/http://www.20at.com:80/masr/review/13538-2009-09-27-11-57-34.html"

[[comments]]
order = 7
subject = ""
author = "ممدوح زكى زخارى"
posted = "2009-10-03"
text = "الاستخفاف بغباء الاعداء هو أول مسمسار فى أمن و حرية الوطن؟<br />خاصة عند الكتابة عن بطولات (مصرية) حقة؟<br />ملحوظة: عند الكتابة فى بداية كل مسلسل اوفيلم جملة( من ملفاتالمخابرات العامة المصرية)؟!!!<br />ثق ان هذا هونعم النفاق و الكذب و الرياء؟ و الغرور!!!<br />\"المخابرات العامة المصرية\" لا تخرج ابدااية معلومات عن أبطالها مطلقا؟"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014636/http://www.20at.com:80/masr/review/13538-2009-09-27-11-57-34.html"

[[comments]]
order = 8
subject = ""
author = "ممدوح زكى زخارى"
posted = "2009-10-03"
text = "[quote name=\"تخاريف\" مسلسلات رمضان\"انها سبوبة كل عام ؟ و رمضان كريم<br />حكاية مفبركة ظ بس لابد ان تكون أستخفافا ب\"أسرائيل\" و أفتخارنا بعبقرية شباب \"مصر\" التائهةفى الخارج؟<br />ثم تفاجأ با هذا المصرى التائهة ما هو الا (بطلالالالالالا لالالالالالالال الالالالالالالا ل ا) و عبقرينا و خير مضلل لغباء أجهزة المخابرات(الاسل رائيلية) الغبية؟!!!<br />(الخلاصة) تخاريف لهبر فلوس الدولة تحت مسميات (الوطنية) و (البطولة) و (التضحية) و(العبقرية) فى حرب الجاسوسية؟<br />ملحوظة: جميع أبطال مسلسلات \"الجاسوسية\" فى مصر دائما ما كانو(صيع) و فاشلين و بتوع نسوان؟ او (نسوان) ساقطات و بغايا و بائعات هوى<br />؟"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014636/http://www.20at.com:80/masr/review/13538-2009-09-27-11-57-34.html"

