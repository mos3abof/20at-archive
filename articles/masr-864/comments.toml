[[comments]]
order = 0
subject = "دى مش شرطه دى شوربه"
author = "غيبوبه"
posted = "2006-08-31"
text = "بكفاءه منقطعه النظير تقوم اكاديميه مبارك(برضه)للامن باعداد الزبانيه لمواجهه أعداء الوطن من المطالبين بالحريه و العياذ بالله<br />اما بالنسبه للعقد و الكلاكيع اللى عند السواد الاعظم منهم فالداخليه مش السبب.... السبب الحقيقى ان أهاليهم ناس واطيه معرفوش يربوهم<br />لكن السيد حبيب العادلى فده يا جماعه بصراحه ملاك أبيض بجناحات وحنين<br />و النعمه الشريفه و يارب اعدم الحكومه كلها لوكنت بأكدب"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903063307/http://masr.20at.com:80/article.php?sid=864"

[[comments]]
order = 1
subject = "الفاجومي"
author = "عاشق مبارك"
posted = "2006-08-31"
text = "عليا الحرنكش يا ريس مبارك<br />في عصر مزركش ملون بنارك<br />لأبايعك وأبايع حكومة حمارك<br />ملعون أبو اللي يقدر يقاطع قرارك<br />نهارك مقندل وليله مبارك<br />فهمبك وهجس وطلع في روحنا<br />اكيد روحنا طالعة تشاهد جمالك<br />جمالك مبارك وسوزانك سوزانا<br />يا محلا حصارك لمصر اللي جالنا<br />أؤيد وأبايع فخامة جلالتك<br />وأؤيد أي واحد بيمسح ريالتك<br />ولأنك سر باتع حننسي هبالتك<br />علي تل مصر يا ريتك تهيص<br />خرابة فسيحة عليها متيس<br />وأأمر تتطاع فشعبك مهيس"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903063307/http://masr.20at.com:80/article.php?sid=864"

[[comments]]
order = 2
subject = "انسى ياعمرو"
author = "مصرى متغرب"
posted = "2006-08-31"
text = "انسى ياعمرو فاكر المقولة الشهيرة دى<br />انا باقولكم انسى ياشعب مصر لان بعد كل الى بيتقال على ضباط الشرطة هاتفضل هى رغبة الشباب رقم واحد وهايفضل الطابور الطويل من خريجى الثانوية العامة قدامها واحتمال يزيد لحد مايوصل ميدان مبارك (رمسيس سابقا) وعلى فكرة الشرطة مش بس هما الى زبالة لا انا حاسس ان الشعب المصرى مجرد مايبقى صاحب سلطة او صاحب قرار يبدأ يذل فى الى قدامة لحد ما يقضى مصلحتة منة والدليل ان ضباط الجيش كمان زى اخواتهم الحلوين بتوع الشرطة حتى الصف ضباط حتى العساكر القدام !<br />تصورو ياحضرات العسكرى الى كل ضباط الوحدة و صف ضباطها كمان قاعدين يذلو ويهينو فية مجرد مايجى عسكرى تانى احدث منة يعمل معاة الى اتعمل فية<br />وابعدونا عن الميرى ونروح للموظف الى فى مكتبة لانك محتاج لة يقعد يذل فيك وقدامك حل من اتنين اما تكيشة واما تسمح له يزعق ويهينك ويتحكم فيك لحد مصلحتك ماتخلص<br />وهكذا ياحضرات الى ان تصل الى العامل يعنى من وزير الداخلية الى اقل فرد فى شعب مصر المحروس<br />هى قاعدة الى اعلى منك او لك عندة مصلحة لازم يذلك ويهينك لان الى اعلى منه مطلعين عين اهلة وانت وشطارتك بقى مع الى اقل منك او لهم عندك مصلحة وان كان لك عند (....) حاجة قلة ياسيدى<br />مش احنا الفراعنة يعنى لازم نتفرعن<br />مافيش فايدة مافيش امل"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903063307/http://masr.20at.com:80/article.php?sid=864"

[[comments]]
order = 3
subject = "إزاي تهينوا الملاك الوديع؟؟؟؟؟"
author = "يا جماعة انتوا بتتكلموا في تجاوزات كبيرة آه إنما الأدهى من دا إن واحد صاحبي كان دخل كلية الشرطة وطلع منها مع إن أبوه لواء ولما سألته عن السبب قاللي بلاش أقوللك ولما أصريت اضطر إنو يقوللي إن السبب الرئيسي إن بتوع سنة رابعة اللي هما المفروض بيتعينوا صف ضباط على باقي الفرق محدش يقدر يجرؤ يقوللهم تلت التلاتة كام والسبب الرئيسي اللي ذكره قاللي إنهم بيتعمدوا يدخلوا على بتوع سنة أولى وي..... ويزبطوهم يعني إيه يا عم المستقيل من الكلية قاللي يعني يزبطوهم لما قلت له انتا بتقصد اللي أنا فهمتو منك ده؟ قاللي والله العظيم إنه بيحصل."
posted = "2006-08-31"
text = "وطبعاً اللي فهمتو منه واتأكدت منه بعد كده إن التزبيط زي الاغتصاب وجميع الأفعال المشينة الأخرى اللي بتتصل بيها.<br />وأكيد طبعا السؤال الطبيعي هنا هوا مفيش حد يقدر يشتكي أو يعترض أو خلافه؟ قالي إنتا بتهرج؟ دول ياكلوه أكل يا عم ومش بعيد ينطرد من الكلية بشده قلم صغيرة على مذكرة محبوكة.<br />منتظرين إيه من واحد اتزبط قبل كده أو على الأقل كان بيزبط؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903063307/http://masr.20at.com:80/article.php?sid=864"

[[comments]]
order = 4
subject = "وصف الر سول"
author = "ابو اسامة"
posted = "2006-09-01"
text = "ان هؤلآ الذين يتباهون بذيهم الذى يذيدهم<br />حقارة ووضاعة قد وصفهم النبى صلى الله عليه<br />وسلم فى حديثه الشريف(أتدرون من الأحمق<br />فقالوا يارسول الله الأحمق من باع أخرته بدنياه فقال بل الأحمق من باع آخرته بدنيا غيره)وهكذا يتضح لنامن قول افضل البشر<br />ان هؤلآ لايذيدون عن مجموعة من الحمقى الذين<br />باعوادينهم واخرتهم بل وشرفهم كما قال الأخ<br />فى التعليق السابق فهم كبار رتبهم بلا كرامة ولا شرف وصغارهم مجموعة من الجهلآ<br />لايعرفون الا الطاعة العمياء واوسطهم مجموعة من المرتشون الذين هم اساسا منتهكوا القوانين و اغلبهم من مروجى المخدرات واححضروا اى فرح من رتبهم ستجدون كافة انواع المخدرات التى يقبضون على الناس بسببها اى حاميها حرميهاوهذه<br />هى اقل صفاتهم ناهيك عن استغلال السلطة والنفوز فى اذية خلق الله."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903063307/http://masr.20at.com:80/article.php?sid=864"

