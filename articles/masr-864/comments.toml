[[comments]]
order = 6
subject = "سيبوا مبارك يطور مصر"
author = "ليفى معازيير"
posted = "2006-09-02"
text = "سيبوا مبارك يعدل ويطور فى مصر ده لولا مبارك كنتوا رحتوا فى شربة ميه لانه حاكم عادل وعاقل وشوفوا جيرانكم اللى بيحكمهم المجانين حصل لهم ايه حروب اهليه وتفجيرات وسيارات مفخخه والاف بتموت كل يوم ولاحد معبرها.. الشعب المصرى فى امان مع مبارك ياجدعان"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903063307/http://masr.20at.com:80/article.php?sid=864"

[[comments]]
order = 7
subject = "يا ليفي معارييف إنتا و لا معازيم"
author = "سعد اليتيم"
posted = "2006-09-02"
text = "الكابتن معازيير باين عليه من اللى بيتظبطوا على رأى أخونا اللى وصف بدقة اللى بيحصل فى أكاديمية مبارك لعلوم التظبيط ... المهم سييك من الأهبل بتاع معارييف ده و فعلا بالرغم من إنتماء \"متظبطى\"الشرطة للشعب ده أسما فقط لكن أكل العيش و البعد عن البهدلة هما اللى بيخلوهم يقوموا بجدارة بدور كلاب الحراسة الأمناء على مستقبل السلطة"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903063307/http://masr.20at.com:80/article.php?sid=864"

[[comments]]
order = 8
subject = "نداء من تل ابيب"
author = "ليفى معازيير"
posted = "2006-09-02"
text = "الى الاخ بتاع التظبيط انا مش عارف انت ليه شايل هم التظبيط على راسك مع ان كل انسان حر فى مؤخرته .. وبعدين ليه العرب مابتغيرش نظرتهاللجنس ليه تعتبره عيب مع ان اجمل مافى الوجود الجنس انه التصاق الارواح قبل الاجساد.. وانا اتكلمت عن عهد مبارك وقلت انه افضل مرحله سياسيه واستقرار وامن ورخاء لكن ان يريد الشعب كله ان يصبح مليونيريه هنا يبدأ التفكير الغلط عند الشباب ومن عمل بجد وتفكير سليم سيصبخ من الاغنياء لكن اللى قاعد فى بيتهم وبيقر على العالم عمره ماحيلاقى ياكل.. وانا بنصح الشباب المصرى ان يهاجر الى اسرائيل ففرص العمل كتير وهناك نعاملكم بكل احترام"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903063307/http://masr.20at.com:80/article.php?sid=864"

[[comments]]
order = 9
subject = "إلى بتاع تل أبيب"
author = "مواطن مصري"
posted = "2006-09-03"
text = "إحنا بنكره مبارك مش عشان إن أمن مصر أي كلام وبس أو انه أهان المصريين أو أي شيء تاني<br />بس بنكرهه عشان مصر كان ممكن تكون اقوى ألف مره من غيره<br />إحنا بنكره مبارك عشان اخرنا خطوه عن طرد الكلاب من فلسطين<br />بكرهه عشان لو سبناه حنتأخر أكتر وأكتر عن تتطهير الأرض من النجاسه<br />من الأوساخ من الخنازير<br />تعرف لما بنزرع قطعة جلد من واحد في جسم واحد تاني بتعيش أسبوع وبعدين بتموت وتسقط<br />وهو ده بالزبط وضعكم وهو ده بالزبط مصيركم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903063307/http://masr.20at.com:80/article.php?sid=864"
