[[comments]]
order = 6
subject = "مثلث برمودا..مصاصوا الدماء"
author = "مصرية"
posted = "2006-05-23"
text = "مصر يحكمها الأن مجموعة من القراصنة الهم الأكبر لكل واحد منهم الفوز بأكبر قطعة من الكعكة...ويطلقون التصريحات والبيانات المبتذلة المضللة الكاذبة التى لا تنطلى على جاهل أوأحمق ..ويقود هؤلاء القراصنة ثلاثى الشر الذى يغرقنا فى دوامة ..كدوامات مثلث برمودا ...وسبحان الله يصادف أن هذا الثلاثى يحملون أسماء هى نقيض أعمالهم ..رأس المثلث طبعا الزعيم الأوحد مبارك ..وأين البركة ؟؟؟؟؟ كل الكوارث الطبيعية ..والأقتصادية..والأجتماعية .......الى آخر طقم الفساد والأفساد الذى حل على مصر فى عهده المجيدوهو مصمم بكل قواه حتىآخر نفس فى عمره الطبيعى والأفتراضى أن يجثم على أنفاس الشعب المصرى حتى آخر نقطه فى دمه...الضلع الثانى..نظظظظظظيف ( والله نكته).. نظيف يقود ببراعه طقم القراصنه والفاسدين ومصمم على المضى قدما حتى آخر نقطه فى دم الشعب المصرى...أما الضلع الثالث وهولا يقل أهميه ...حبييييييب العااااادلى(كمان نكته)...لأنه لامحبوب ولا عادل ..مهمته الوحيده حمايه كراسى السلطه من بطش أبناء الشعب المصرى الأرهابى ..الى آخر نقطه (طبعا من دم الشعب المصرى.)وطبعا هذا يجعله الحبيب والعادل..فى عيون أسياده وهذا يكفى لبقاءه فى كرسيه...ماذا نتوقع من هؤلاء القراصنه ومصاصوا الدماء اذا قال المصريون لهم لالالالا...الذى يحدث الآن يقرب من نهايتهم ان شاء الله... أنتم أحقر الكلتمات فى قواميس كل لغات الدنيا... لالالالالالالالالالالالالالالالالالا لمبارك وسلالته ...لالالالالالالالالالالالالالالالالالالالالا..للفساد..لالالالالالالالالالالالالالالالالالالالالالالالالالا ...لقانون الطوارىء ..ونعم..نعم..نعم..لتغيير الدستور"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911192439/http://masr.20at.com:80/article.php?sid=354&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

