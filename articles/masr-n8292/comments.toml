[[comments]]
order = 0
subject = "الكذب المباح"
author = "أبو أسامة"
posted = "2006-05-21"
text = "ان الكذب مباح فى حالتين فى الحب والحرب كما تقول المقولة الشهيرة وبما ان الدولة ليست فى حالة حب بعد معادتها للجمي بما فيهم القضاة فأنها فى الحالة الأخرى وهى حالة الحرب كما شهدنا على الفضائيات حكومة تحارب شعب فأفق ايها الشعب انهم قد اعلنوا عليك الحربوسيقتلوك حرقا او غرقا"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911192439/http://masr.20at.com:80/article.php?sid=354&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "حمرة الخجل"
author = "حدوته مصريه"
posted = "2006-05-21"
text = "كل هؤلاء الدكاتره حصلوا على شهادتهم العلميه من دول ديمقراطيه سواء اوربيه او امريكيه وخلال سنوات دراستهم اطلعوا عتى معنى ممارسه الحريات ولكن عندما يجلسون على كراسى السلطه يلقون بكل ما تعلموه فى سلة المهملات الم يسمع سيادته عن المواطن البريطانى المعارض للحرب عتى العراق الذى كان يقف كل يوم امام مجلس العموم رافعا لافتات ضد الحكومه وبلير ولا يستطيع احد ان يصفه بالبلطجى والا كان الرائ العام والصحافه اجبروه على الاستقاله0 من اين تاتيهم الجراه ان يرددوا اكاذيب وهم امام شخصيات عالميه وسياسيه و وكالات انباء ايدعم مهذا بقي لكم ثلاثين عام تتحدثون عن مواسير دعمكم المسدوده لمحدودى الدخل هو سيادتك ما تعرفش ان انتخباتكم المزوره حضرها عشره في المئه فقط وبقيه الشعب رفض المشاركه في هذا المسلسل لانه لا يثق فيكم عيب قوى شكلكم امام العالم مش لطيف"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911192439/http://masr.20at.com:80/article.php?sid=354&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "ولا حد"
author = "ياء"
posted = "2006-05-21"
text = "اولا مش لازم نصدق حد فيهم<br />تانى حاجه ياريت احمد نظيف يعرف ان الشعب مستعجل واتخنق خلاص<br />ثالثا لو احنا شعب بلطجيه ياريت الاستاذ احمد ياخد المدام والاولاد ويروح اى حته تانيه<br />ياريت ياخد معاه مبارك واسرته بالمره<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911192439/http://masr.20at.com:80/article.php?sid=354&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "هو كده و اللي مش عاجبه"
author = "مطحون المصري"
posted = "2006-05-22"
text = "لا ادري من اي مكان هبط علينا هذا النظيف..لا طلعه بهيه ..لا خفه دم .. يحمل الجنسيه الكنديه لمن لا يعلم .. يتحدث كلاما ما انزل به الله من سلطان كأنه يريد الحجر على الشعب و صوت الشعب جلهم بلطجيه و هم يضربون...جعل المجني عليه هو الجاني...قلب الحقائق ذلك الطامع في عرش مصر.<br />لكي الله يا مصر<br />أنا ان قدر الاله مماتي<br />لن ترى الشرق يرفع الرأس بعدي"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911192439/http://masr.20at.com:80/article.php?sid=354&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

