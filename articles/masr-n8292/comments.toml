posted = "2006-05-23"
text = "ليس على المريض حرج يا شباب فحكومتنا من كثره الكذب فقدوا القدره على السيطره على ما يقولون أوما يوعدون به الشعب الغلبان المغلوب على أمره الشعب الذى هو أيضا أصبح يصدق ويلهث خلف كل ما تقوله الحكومه تقدارو تقولو يئس على أمل انهم يصدقوا القول فى يوم من الايام أو أنهم تعودا وتكيفوا مع تصريحات الحكومه أو أنه ليس أمامهم غير التصديق<br />وفى الاخر كله بيكدب وبس"
