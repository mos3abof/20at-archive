subject = "هبله ومسكوها طبله"
author = "فكري"
posted = "2006-05-24"
text = "السيد نظيف ( اشك في ذلك الاسم)<br />ينطبق عليه المثل القائل هبله ومسكوها طبله هل هذه تصريحات لرئيس وزراء اكبر بلد عربي كلامه اهبل وعبيط مش عارف دة اخد الدكتوراه بتاعته من عند جحا ولا ايه<br />وبعدين سحر العقربه كونداليزارايس خلاه يقول الخايب دة امال لوكان واقف امام بريجيت باردو حيقول ايه صحيح طويل واهبل وعمار يا مصر دايما كده ماينفعش فيكي الا العبيط ويبقي رئيس وزراء<br />وربنا يستر"
