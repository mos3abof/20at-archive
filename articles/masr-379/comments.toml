[[comments]]
order = 0
subject = "بحبك يا بلادي ...لا مش أنا بس ولادك كلهم بيحبوكي ..برضه"
author = "محمد السيد"
posted = "2006-05-27"
text = "وأكثر من 650 معتفل من الإخوان صامدين برضه ..<br />والاف الجماعات الإسلاميه اتهد حيلهم برضه ..<br />وملايين البشر العادية اللي مش قادرة تطلع صوتها بره برضه ...<br />لكن مش حنبطل .... برضه<br />وبرضه بأقولهالكم .....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216143345/http://masr.20at.com:80/article.php?sid=379&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "قلبي معاكم وعملي كمان"
author = "محمود باشا"
posted = "2006-05-29"
text = "ربنا يوفقكم يا رجالة<br />قوبنا كلها معاكم ، انتم صحيتوا فيا حاجات كتير كانت قربت تموت<br />قلبي معاكم وانا في الغربة ، واوعدكم ابقى معاكم علطول بقلبي وبايدي ، انا في السعودية ، لو اقدر اعمل اي حاجة قولولي عليها ومش هتاخر.<br />محمود باشا"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216143345/http://masr.20at.com:80/article.php?sid=379&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "انا عايز اعمل حاجه"
author = "الاستاذشيكو"
posted = "2006-05-30"
text = "انا عايز اكون مع اخوتي في الكفاح ضد الحراميه واللي وكلينها ولعه<br />انا عاز اعمل اي حاجه قولولي اعمل ايه000<br />اللي في المعتقل مش احسن مني<br />ولا بيحبو البلد دي اكتر مني<br />انا منها 00000 وهما منها<br />كلنا فداك يا مصر"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216143345/http://masr.20at.com:80/article.php?sid=379&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "حاجة تقرف"
author = "ابو شريف"
posted = "2006-05-30"
text = "اللي يشوف الراحة التي كان عليها نجم النجوم في السجن والهارب من التجنيد صاحب النية الحسنة الذي لايعرف ان فيه قانون تجنيد في البلد والمظاهرات التي قام بها الشباب للإفراج عنه وتكاليف اللافتات الاعلانيه ... واللي يشوف زبانية جهنم وهما بيعذبوا أصاحب الرأي الحر ومحاكمة القضاء وقانون الصحافة لايجد سوى كلمة واحدة للحكومة<br />جتكوا القرف"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216143345/http://masr.20at.com:80/article.php?sid=379&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
