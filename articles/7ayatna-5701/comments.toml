text = "والله ياجماعة حصلت حاجة غريبة جدا انا صاحبة اول رد فوق بعد ماكتبت الرد ده وقعدت عادي على ماسنجري لقيت صاحبتي بتكلمني وبتقولي نتيجة التتبع بتاعتك طلعت وموبايلك مع واحد اسمه فلان الفلاني ورقمه ورقم بطاقته وعنوانه دلوقتي باخلص الاجراءات وهيرجعلي خلاص ان شاء الله<br />الف حمد وشكر ليك يارب<br />اتمنى كل اللي كتبوا هنا برضه موبيلاتهم ترجعلهم"
