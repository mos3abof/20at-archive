text = "أنا طبعا موبايلى اتسرق بس بطريقه مختلفه شويه لانى انا اللى اديت الموبايل للحرامى بايدى<br />شخص طلب منى انه يتكلم فى الموبايل فأديته موبايلى وما أخدتش بالى منه لمده ثوانى وطبعا اتفاجات ان الشخص مش موجود قدامى<br />فاتعلمت طبعا انى ما اعملش خير فى أى حد واعترف طبعا ان دى كانت طيبه زياده شويه منى<br />وطبعا كل اللى قدرت أعمله أنى حرقت الشريحه لكن الموبايل ما رجعش"
archived = "2009-05-21"
capture_url = "https://web.archive.org/web/20090521081755/http://www.20at.com:80/7ayatna/5701.html"

