posted = "2007-05-03"
text = "الكارثه اللى اكتر من ثمن الموبيل و ذكرياتك مع كل cover كنت بتشتريه و الرنات و الكليبات هى الارقام اللى اتحدى ان يكون اى حد فينا فكر ياخد احتياطه و يسجلها ف نوته<br />و كل ما كان يتسرق من اى حد من اصحابى موبايل كنت اجرى اجيب نوته و اسجل فيها الارقام اللى على الموبايل بتاعى<br />بس هما نمرتين تلاته و ازهق<br />التكنولوجيا علمتنا ال[ *** ]ل<br />بس بينى و بينكو راحه برده<br />يعنى تجيب النوته و تقعد تمقق عينيك و تدور و لا تضغط ضغطتين و الموضوع ينتهى<br />اللهم احفظ موبايلاتنا<br />جمعاااااااااااا اء جمعاء"
archived = "2009-05-21"
capture_url = "https://web.archive.org/web/20090521081755/http://www.20at.com:80/7ayatna/5701.html"

