author = "ادم المهدى"
posted = "2007-05-03"
text = "كان يوما عصيبا جداا بالنيبة لى حيث توقفت حركة المرور يومها لانى قد سرق منى موبايلى فى الميكروباص فرحت ايال جميع سائقى الميكروباص و جميع ضابطى المرور ، و ظللت ابحث اسبوع كامل عنه ، و بالنسبة للاسماء فكان فى زاكرة جهازى اكثر من 2000 اسم من دول مختلفة فكانت بالنيبة لى انقطاع بالعالم الخارجى و الداخلى ايضا<br />اما تجربة صديق لى عندما فقد موبايله راح يتصل به فرد عليه شخص بكل تهكم و قال له صاحبى لو سمحت اللى معاك ده موبايلى فرد عليه اللص : عفوا اللى كان موبايلك و راح صديقى يقول له و النبى راجعه و ابوس ايدك و لكن بلا جدوى<br />www.ademelmahdy.blogspot.com"
archived = "2009-05-21"
capture_url = "https://web.archive.org/web/20090521081755/http://www.20at.com:80/7ayatna/5701.html"

[[comments]]
order = 4
subject = ""
author = "شرين منصور"
posted = "2007-05-04"
text = "السلام عليكم يااه يا استاذ محمود فكرتني بالغالي اول ما جبت الموبايل جبتو بالعافية لأن بابا كان مش مقتنع بيه وطبعا اقنعتو وانا في اولى كلية وفعلا جبت الموبايل من برة مش من مصر وكان 3310 وكنت بحبو حب جنون كانت احدث الرنات عليه ومهتمية باللوجو اللي عليه برغم ان الناس كلها كانت بتشتكي من اني احيانا لما بتعصب برميه وهو الوحيد اللي بيمتص غضبي بس لما حد يجي يعمل فيه اللي بعملوا بقولو انت عارف المثل الي بيقول انا ادعي على ابني واكره اللي يقول امين اهو انا كدة وكنت فرحانة جدا بالموبايل وعدت السنة وجينا على اخر السنة وكنت حاطة الموبايل بتاعي في الشنطة وسيباها مع انتمتي وصحبتنا عشان كنت بكلم وحدة في حاجة على جنب وافاجا ان صحبتنا دي قامت كانت بتجري اول ما بصيت بصيت على الشنطة لقتها مرمية في نص الشارع اللي جوة مجمع جامعة اسكندرية وبفتح الشنطة ملقتش الموبايل ويوميها زعلت عليه زعل كأنو واحد من عيالي زي ما بيقولو لأني مش بحب السرقة وبتعصبني جداااااا المهم عملت الاجراءات الازمة وبلغت لكن فينك يا موبيلي وطبعا حل عليا العقاب من بابا لغاية ما جبلي موبايل تاني 3310 نفسو على بداية الامتحانات بالرغم اني غيرتو لكن بجد وحشني جدااااااا 3310 وحشتني يا موبايلي .."
archived = "2009-05-21"
capture_url = "https://web.archive.org/web/20090521081755/http://www.20at.com:80/7ayatna/5701.html"

