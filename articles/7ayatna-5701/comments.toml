text = "اعرف حكاية غريبة جدا لواحد صاحبي لما اتسرق منه الموبايل في كافيه في العاشر من رمضان وبعد ما فقد الامل انه يرجع واشتري واحد جديد اتصل به ابن خالته الضابط في قسم شرطة الموسكي او السيدة تقريبا عشان يقوله ان الحرامي اتسرق ومعاه موبايلك!!!!!<br />اتاري الحرامي راح يبيعه في عبد العزيز بس ماكانشي معاه فاتورة فشكوا فيه وبلغوا القسم الي بيشتغل فيه ابن خالة صاحب الموبايل!!!<br />وسلام<br />Dabdoob"
