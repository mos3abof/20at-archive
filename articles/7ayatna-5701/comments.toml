text = "كانت الساعه 7صباحا عندما كانت افكر اروح بى الموبيل ولا لاء الى قصر المنتزه بالاسكندريه للعب الكوره ويارتنى مارحت اتسرق منى شنطيطى وكان فيها ثلاث تيلفونات من النوع 5320 الجديد 3110 وتلفون مش كده يعنى<br />3310 وملابس اصحابى وملابسى وبطاقه والقيزا والشنطه كلها اخذها اذى معرفش"
