subject = ""
author = "منى عبد المنعم"
posted = "2007-05-02"
text = "انا برضه من اكتر الناس اللي ضيعت موبيلات واصحابي بيتريقوا علياوبيقولولي اي مغفل لازم يتسرق بس باجاهد اهو عشان ارجع اللي اتسرق والاجراءات اللازمة بقالي سنة باجري عليه اهو ياموسهل ، اللي اتسرق مني ده بأة بطريقة مختلفة عن اللي فوق دول كنت ماسكاه في ايدي وماشية في الشارع ( مع العلم كنت حطاله سلسلة الامان وكانت طويلة ولفاها على ايدي) المهم عدت جنبي فيزبا فيها واحد سايق وواحد وراه اللي ورا ده بأة اللي لطش الموبايل من ايدي بس وهاتك ياجري ومافيش فايدة طبعا دول حرامية برضه والكار كارهم هنقاطعهم فيه ، على فكرة جاتلي حالة نفسية بعديها طول مانا ماشية في الشارع باحس برعشة في ايدي وبعدين بتتقفل"
archived = "2009-05-21"
capture_url = "https://web.archive.org/web/20090521081755/http://www.20at.com:80/7ayatna/5701.html"

