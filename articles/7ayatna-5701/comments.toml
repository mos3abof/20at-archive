posted = "2007-05-09"
text = "من المرات المهمة اللي اخذت فيها موقف عجبني اني اكتشفت ضياع الموبيل أول ما نزلت من الميكروباص، روحت متصل باخويا الكبير وبلغته وطلبت منه يتصل بالتليفون ولو حد رد عليه يزعقله جامد -لأني مكنش عندي قدرة علي الزعيق وكنت خايف ابوظ الخطة- ويفهمه انه ظابط وان الموبيل ده بتاع اخوه، ورحت واقف في غمره مكان ما نزلت لغاية مالميكروباص لف من رمسيس ورجع تاني وأول ما الميكروباص هل عليا رحت فاتح الباب بقوة وباصص للسواق جامد وقايله فين التليفون؟؟؟ راح قايلي اهو اتفضل!!!!!!! ورحت راجع البيت وانا فرحان قوي"
archived = "2009-05-21"
capture_url = "https://web.archive.org/web/20090521081755/http://www.20at.com:80/7ayatna/5701.html"

