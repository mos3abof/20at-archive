[[comments]]
order = 2
subject = "لو كان سيقى معى ما احتجت للقلم...يا ميت ندامه على الاخلاق و القيم"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-23"
text = "دى بمناسبه جمعاء يا اكرم..<br />انا بقى احلى افتكاسه لفتت نظرى(ايام ما كان عندى نظر)<br />كان لينا واحد زميلنا مخنوقين منه شويه قررنا نعمل فيه مقلب تمام<br />فام ولادالحلال (اللى هما زمايلنا برده)بتصوير ورق عليه صورته و تحتها هذا الشخص مريض و متغيب و عود يا باسم الام تبكى بحرقه و الاب يذرف الدموع و ساعدونا يا ذوى القلوب الرحيمه<br />و جه صاحبنا الكليه و شاف دا و فهم وعينكو ما تشوف الا النور(دنا اختك يا سلطان دنا اختك مين)<br />فضل مخاصم الكل ييجى تيرم كامل"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210250/http://masr.20at.com:80/article.php?sid=68&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "جمعاء 2"
author = "كرميلينو"
posted = "2006-03-25"
text = "معلش يا جماعه عشان اتكلمت عن السوق و مكلمتش عن الجامعه اصلي علاقتي بالجامعه كانت علاقة مش و لا بد<br />كنت اكتر ايام بروحها هي ايام الامحانات مع اني كنت في كلية هندسه ( الواحد مش عارف كنت بينجح ازاي ؟؟ )<br />الواحد كان بيشتري ورق الدروس اللي المعيدين عاملينوه و كان بيصور اي ورقه مع اي زميل و طبعا لان الناس كانت عارفه اني بجمع ورق اي معيد كنت مصدر المحبين جميعا<br />حتى ان واحد صاحبنا لقاني بشتري ورق عنب فتوسل اليا انه ياخده يصوره مني<br />المهم راحت الايام دي يا مين يلايمني عليها<br />بس من غير امتحانات و حياتك و كتر الشطه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210250/http://masr.20at.com:80/article.php?sid=68&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "مقلب"
author = "سوسة المفروسة"
posted = "2006-03-26"
text = "كان معانا واحد رخم قوي وبصراحة غبي بس صمام و بيرتب على طول ..طلع معانا رحلة الاقصر و اسوان .العيال خلوة نايم و كلموة في التليفون وقالوله :احنا ادارة الفندق لو سمحت احنا بنسيق السنترال ممكن تحط التليفون في كيس بلاستيك وماتجيش نحيته لحد مانخلص عشان مايكهربكش ..راح زي العبيط عامل كده فصوروه جنب التليفون اللي في الكيس و فضحوه في الدفعه كلها<br />عشان يحرم يرتب ع الدفعه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210250/http://masr.20at.com:80/article.php?sid=68&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "يااااااااااه فكرتونى"
author = "طماطم"
posted = "2006-03-26"
text = "والله كانت ايام جميلة اووووى بس انا كنت بروح الجامعه بس عشان افك على نفسى شوية اصلى انا بزهق على طول المهم انا عمرى ماحضرت محاضره وكنت بعتمد على صحابى فى الورق والكلام دا والحمد لله نجحت بس ازاى مش عارفه<br />انا بقة كنت دايما لما اروح الجامعه احب اروك كافترية الجامعه اوووووى مش عارفه لية بس تقريبا بحس براحه هناك ومرة كنت باكل بطاطس وصحابى شافونى ومن ساعتها بقة اسمى بطاطس اى رايكم اسم حلو مش كده<br />وتصور لما روحت اخد الشهاده من الكلية لاقيت اسمى فيها بطااااااااطس تصورو الجامعه دى مش بيستخبى فيها حاجة خااااالص<br />بس كانت ايام جميلة على الاقل ارحم من البطاله اللى احنا فيها"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210250/http://masr.20at.com:80/article.php?sid=68&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 6
subject = "مستقبل ابيض زي الفل ان شاء الله . دوسي بنزين"
author = "whitecat"
posted = "2006-03-30"
text = "ينهار اسود. بجد ربنا يبشركو بالخير طمنتوني على مستقبلي المشرق. انا لسه سنة تانية وقدامي اربع سنين وتلاتة ماجستير وبقول \" يارب\" اذا بي اتفاجئ بكلامكو المتفاءل عن الي جاي.<br />\" يا قلبي يا كتاكت ياما انت شايف وساكت\""
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210250/http://masr.20at.com:80/article.php?sid=68&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 7
subject = "ياما نفسي اخلص منها"
author = "مقهور"
posted = "2006-03-31"
text = "والله يجماعه انتم خلتوني اتشجع واكتب عن العيشة الريقة بتاعتي في الكليه من اول اوله لحد ان شاء الله ما أخلص فيها<br />هو الصراحة مفيش سنه عدت الا وكنا ايه حاطين ايدينا على قلبنا بس نجحنا صيحي صيفنا سنه بس مش المهم المهم النتيجة اجدع حاجة بقى والله الصحبة بس انا نويت اني هنتقم من الدكاترة انا وزمايلي وبدانا التدريب على ضرب الجزم من مستوى القاعدة لحد قذائف القلل من كاتيوشا اليد وكمان عملنا كمائن وضربنا الكوماندوز وحددنا الاماكن الي هتم فيها المهاجمة بس يارب ننجح في الحطة ودعواتكم"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210250/http://masr.20at.com:80/article.php?sid=68&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"
