[[comments]]
order = 0
subject = "جمعاء"
author = "كرميلينو"
posted = "2006-03-23"
text = "انا اعلق اذن انا موجود<br />قبلك المرة دي يا هبهوب ( اول تعليق ده بيبقا دايما رخم عشان كده محدش بيتجرأ و يكتب اول تعليق ) بس معلش انا هعلق الاول<br />فكرتوني بالجامعه<br />لسه كنت هناك من اسبوعين بلم خلجاتي منها و اسحب ورقي<br />كان شعوري جميل لما اخذت شهادة الثانوية العامةو شوفت صورتي الطفولية اللي كانت فيها<br />حسيت اني كبرت و بقيت راجل يقدر يشيل مسئولية<br />شيل و انا اشيل<br />شيلني و اشيلك<br />فتح دماغك يا بيه<br />يا بخت من نفع و استنفع<br />ده القاموس بتاع السوق<br />السوق اللي بيبلع كل المرتجفين و المرتعشين<br />فكرتوني بالجامعه و نستوني السوق<br />يلعن ابو السوق يا جدع<br />يعني تبا لك ايها السوق"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210250/http://masr.20at.com:80/article.php?sid=68&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

