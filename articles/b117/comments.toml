[[comments]]
order = 1
subject = "لأ ،، افحمته"
author = "من الاخوان"
posted = "2005-12-20"
text = "استفزني ، كما استفز الكثير من مؤيدي جماعة الاخوان المحظوظة مقال الكاتب عبد الله كمال في روزا اليوسف<br />وسبب الاستفزاز لمحبي الجماعة واعضائها ليس واحداً ، فعبد الله كمال الذي اعتمد في نقضه لبوسة نائب الاخوان على الشتيمة والادلة الخاطئة والتحليلات العجيبة جعلت الجميع لا يقتنع بكلامه ، ولو انه كان تكلم باسلوب انظق وارقى مجملاً نصيحته بباقة حب وعرفان بجميل الاخوان لكانت لاقت كلماته وموضوعه أثراً آخر في الاخوان وصفوفهم .<br />لكن مقال الكاتب عبد الجليل الشرنوبي كان الأكثر استفزازاً لي ، رغم اني أتشرف بأني أحد أبناء هذه الجماعة المباركة<br />سبب الاستفزاز انه لم يقنعني من بداية المقال لآخره بسبب وجيه لهذه البوسة<br />وكعادتنا كمصريين يلط الأتاذ الشرنوبي أسلحته على فكرة الموضوع وكأنها قضية تافهة ، بل زاد على ذلك أنه تطرق لنفس اسلوب كمال الذي ضايقنا جميعاً وهو رمي الكرة في ملعب الآخر والسخرية على كلامه<br />وحتى لا أطيل ، أقول ، أننا بحاجة إلى رداً من مكتب الإرشاد وليس من كاتب أفاق عربية الهزيلة<br />وإلى الشرنوبي أقول : ليس بهذه المقالات تعلمنا أن نرد على مايطرح أمامنا من شبهات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114448/http://www.20at.com/article2.php?sid=117"

