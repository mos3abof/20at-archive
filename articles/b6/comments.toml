[[comments]]
order = 4
subject = "اقرئي التاريخ"
author = "ررر"
posted = "2006-07-05"
text = "اقائي التاريخ ياأخت<br />أرسل هذا التعليق بواسطة :<br />من قالت أن لاأحد يمكن أن يكون كعمر المختار رحمه الله؟ اقرئي التاريخ واقرئي جيدا على مصطفى بن بوالعيد الجزائري وماذا قال عنه الجنرال دوغول لعنه الله ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142339/http://www.20at.com/article2.php?sid=6"

[[comments]]
order = 5
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-18"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142339/http://www.20at.com/article2.php?sid=6"

[[comments]]
order = 6
subject = "تنوية"
author = "عصام احمد العبيدي"
posted = "2006-09-20"
text = "تاريخ جهاد شيخ الشهداء عمر المحتار لا جدال فيه لاكن و هناوجب التنوية لبعض الاخطاء التي وردة بالمقال.و ادعو الكاتب و القراء لقراة كتاب((عمر المختار، نشأته وجهاده من 862 إلى 1931م. الجماهيرية,مركزجهاد الليبيين ضد الغزو الايطالي, 1983م، ص 38. عقيل محمد البربار وآخرون،)) ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142339/http://www.20at.com/article2.php?sid=6"
