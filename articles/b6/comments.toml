[[comments]]
order = 2
subject = "الاشاوس"
author = "غالى الحربى"
posted = "2006-05-10"
text = "ان ما شدنى فى قصت كفاح جد من اجدادى بطل من ابطال العرب والمسلمين انة كافح من اجل حرية شعبةفي يوم تعتبر فية الكلمة جريمة وما شدنى اكثرعندما ارى صورته مع جنود الاحتلال الاطالي كل الشعب العربى والمسلم يعرف صورة وخلد اسمة لكن هل من ضهروا مع فى الصورة من المحتلتلين يعرف احد عنهم شى ماتوا وما ت معهم حتى اسمائهملكن جدى عمر المختار محفور فى قلوبنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142339/http://www.20at.com/article2.php?sid=6"

