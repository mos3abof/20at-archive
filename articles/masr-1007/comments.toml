posted = "2006-10-09"
text = "معروف يا اخى ان هذا الموقع ممول من الجهات اياها ، وهذا واضح من كم الانفاق على الموقع ، واهداف هذا الموقع السوداء معروفه وواضحه ، وما يروج له واضح ، وتوجهاته وطبيعه مواضيعه تفضح سياسته، فلا داعى للجدال ومادمتم تعلمون.<br />نعم للتوريث ولاستكمال المسيره."
archived = "2006-10-30"
