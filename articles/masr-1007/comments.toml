[[comments]]
order = 19
subject = "لا طبعا ومليون لا"
author = "من مصر المقروفة"
posted = "2006-10-08"
text = "الست إللى عماله تكتب بكل لغات العالم وبتقول نعم لجمال مبارك ها أٌقول لها القرد فى عين أمه غزال لكن جمال مبارك مرفوض من كل الشعب علشان الشعب عايز إنسان كفء يصلح ما أفسدته عائلة مبارك وينهض بمصر وأعتقد أن كل آل مبارك أصبحوا عملة خاسرة عند الشعب ومرفوضة من أفعالها المشينة من نهب البلد ومن بيع المصانع والشركات وتسريح العمالة ومن كذبهم المتواصل على الشعب ومن تزوير الإنتخابات ومن تهميش الشباب ومن الفقر والفساد وأعتقد أن الإبن الذى تربى فى قصور الشعب المنهوبة وعلى يد هذا الدكتاتور لن يختلف حكمه عن حكم أبوه بالإضافه إلى فساده الذى يعلمه الطفل الصغير قبل الشيخ الكبير وبعدين ده يا دوبك ينفع يبقى موظف صغير فى أى شركة أو يرجع للبنك إللى كان بيشتغل فيه ويريحنا من خلقته فى مصر وياريت يأخذ أمه المجنونه معاه علشان مصر كلها تنظف فى هذه العائلة القذرة ولا ومليون ومليون لا لجمال مبارك ونعم وكل النعم لعمرو موسى أو الإخوان المسلمين أو الدكتور سعيد العريان وليسقط حسنى مبارك وذيوله وحثالته إلى الأبد"
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030075515/http://masr.20at.com:80/article.php?sid=1007"

[[comments]]
order = 20
subject = "معروف"
