[[comments]]
order = 21
subject = "توريث أيه"
author = "مصرى"
posted = "2006-10-09"
text = "إيه يا دشم توريث إيه هو إنت كرسى ولا كنبه ده شعب وبلد وديمقراطية وإين خبرات هذا الصغير حتى يفرض نفسه وبدون أدنى مقارنه بينه وبين الكفاءات هو إمتى الصغير أتدرج فى السياسة يعنى من موظف بنك أتزرع قيادة وعمرها ماحصلت فى أى دولة إن قيادات الأحزاب تزرع بالتعيين وبعدين مافيش أى قبول شعبى ليه وبعدين تاريخ العيلة مرفوض من الشعب دى مجرد تهيؤات ليه ولن ينالها لأن كفاءات مصر جاهزه ومعدة مش محتاجة تفصيل ولا تمثيل والظاهر أن العيلة دى من كثرة لما قعدت فى كرسى الحكم بدون شرعية أعتقدوا أنهم ممكن يورثوا الحكم ونسوا أن مصر جمهورية وإن مهما عملوا إرادة الشعب أقوى والشعب كله بيقول لا ولا تنسوا النار التى تحت الرماد"
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030075515/http://masr.20at.com:80/article.php?sid=1007"

