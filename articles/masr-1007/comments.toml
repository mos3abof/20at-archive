[[comments]]
order = 23
subject = "لا للتوريث لا لجمال مبارك نعم للتغيير بقيادة جديدة"
author = "عايز حقى فى بلدى"
posted = "2006-10-18"
text = "لا للتوريث لا لجمال مبارك نعم للسيد عمرو موسى ، الدكتور أيمن نور ، الدكتور عصام العريان ، المستشار هشام البسطويسى نعم للطهارة والشرف والكرامة ولا للذل والفساد والتوريث<br />قاعدين ليه يا عيلة مبارك ما تقوموا تروحوا كفاية علينا وعليكم بقى أتقرفنا منكم هو لا زم يعنى نهاية المسلسل القذر المعروفة لحكام مصر تحصل ليكم علشان نرتاح منكم"
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030075515/http://masr.20at.com:80/article.php?sid=1007"
