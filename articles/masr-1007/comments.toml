[[comments]]
order = 7
subject = "لا لجمال مبارك"
author = "مصرى"
posted = "2006-10-03"
text = "يا أصدقائى أنا مش برفض جمال مبارك علشان فيه عداء بينى وبينه أنا عمرى ما شفته إلا فى الصور أو التليفزيون لكن أنا برفضه لأن فيه حديث عن الرسول عليه الصلاة والسلام ما معناه أن إللى يولى حد ولاية شيء وفيه حد أكفء منه بتحرم عليه الجنة وطبعاً مصر ولاده وفيه 70 مليون أكفء من صاحبنا يعنى حرام علينا نتخطاهم ونولى الشئ ده للحكم وكمان لأن جمال مبارك لم يتدرج فى السياسة وبدون خبرات يعنى من موظف بنك يبقى رئيس جمهورية يا قلبى لا تحزن طب إزاى وفين السيد عمرو موسى وفين المستشار هشام البسطويسى وفين الدكتور سعيد العريان وفين الإخوان المسلمين هيه حضانة وهو ها يبقى رئيسها دى بلد وشعب العملية مش سايبة<br />بس لازم كل قوى الرفض تتجمع على الرفض التام قبل لما المصيبة تحصل ونلاقى نفسنا بقينا من أملاك المحروس الصغير ويؤول ملكية البلد كلها بكفائتها ليه<br />أنا شايف أن 5 لغات مش كفاية لازم نقولها له بكل لغات العالم علشان يعرف ويحس أننا رفضينة ومش عايزينه والفعل أهم من الكتابة لازم يكون فيه رفض حركى شامل وأعتراض كامل على هذه الأوضاع الغريبة فى بلد مليئة بالكفاءات والخبراء"
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030075515/http://masr.20at.com:80/article.php?sid=1007"

[[comments]]
order = 8
subject = "يا رب والنبي خلصنا"
author = "معاذ محمود عامر"
posted = "2006-10-03"
text = "امبارح دخلت على موقع المبادرة ووفعت باسمي<br />العدد معقول بما ان المبادرة لسة جديدة ومتعملهاش دعاية قوية من رأيي<br />بس بصراحة أنا فكرت كل اللي وقعوا دول لو اتطلب منهم ينزلوا الشارع للتظاهر أو الاعتصام ضد التوريث يا ترى هينزلوا<br />مش متأكد<br />بصراحة المعارضة على النت أسهل بكتير من الشارع<br />ومفيهاش ضرب ولا بهدلة<br />الحل الأوحد في النزرول للشارع<br />لازم نحتشد بعدد ضخم مش هقول 100 ألف<br />بس على الأقل 30 ألف واحد<br />ودول سهل يتجمعوا من الحركات السياسية الموجودة(الغد على الوفد على الاخوان على الناصري على التجمع على الكرامة والوسط وكفاية)<br />بس الناس للأسف توحدها في الشارع مستحيل أو بلاش مستحيل لكن صعب جدا ومحتاج تعب أكتر من مقاومة التوريث ذاته<br />بس عموما ربنا يسهل"
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030075515/http://masr.20at.com:80/article.php?sid=1007"

[[comments]]
order = 9
subject = "تحية لعادل بن العادلة بين الزناة"
author = "سيكو"
posted = "2006-10-04"
text = "حذاري يابن تافة الأعاجم*** وإلا نال عرضك كل قاسم<br />أعادل إن أمك من مجوس*****لها ولع بإتيان المحارم<br />تأدب يا بن خالك دون شك***لعتت من الجحاجح والأكارم<br />يدب لخدر أمك يعتليها****أخوها العلج في ليل الفواحم<br />وجدك قائم بالباب هاجت***به الشهوات في شبق مهاجم<br />يناقل بين قائمتيه قهرا*****وينغط في خلاء نغط كاظم<br />وفاض به الغرام فلم يبالي****مقولة ناصح أو لوم لائم<br />فأولج في إست أمك نصف إير**فصاحت كله يابن الأشائم<br />وهاج الجار جار السوء هذا***فأقبل نحو ثالوث الغواشم<br />وألقمها هزيل الأير راحت*** تعاصره بفيها عصر ظالم<br />تعاورها الثلاثة ينكحوها *** تراوح فوقها فعل الحوائم<br />وأمك جودها بالعرض أضحى**يصاغر عنده جود لحاتم<br />تقلب طرفها من فرط شوق***لأير مثل أعواد اللهاذم<br />وتعدل بين طراق لديها**** كجور سدوم في غبش وعاتم<br />لهذا إسمك المنحول زورا**برغمك يابن ساعية الأراقم<br />حذاري ويل أمك أن تثرني**فتعلم هجمة الصيد الضراغم<br />عفوت اليوم عنك عن إقتدار**نجوت بجذع أنف منك راغم"
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030075515/http://masr.20at.com:80/article.php?sid=1007"

