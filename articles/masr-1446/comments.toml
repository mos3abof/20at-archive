[[comments]]
order = 17
subject = "النصر للإسلام .. مهما فعل الحاقدون."
author = "Drsalah_hanie"
posted = "2007-01-29"
text = "للأسف أن المصريين أصبحوا لايريدون إسلاما كما انهم أصبحوا راضين بحياة الذل والمهانة التى يتعرضون إليها كل يوم بدءا من المواصلات إلى رغيف العيش مرورا ببعض الضرب والاعتقال والسحل .........<br />الرسول يقول فيما معناه \"استوصوا بأهل مصر خيرا فإن جندها خير أجناد الأرض\"<br />وهؤلاء -زبانية الحكومة- يستوصون بهم ضربا وسحلا وشتما ومهانة وذلا كل يوم.<br />ثم نتهم الشرفاء من أبناء الوطن -الذين اعتقلوا وعذبوا وماتوا من التعذيب بدءا من سجون عبد الناصر حتى اليوم- نتهمهم بشتى أنواع التهم والنقائص والعيوب .!!<br />هل هناك أحد يضحى بنفسه وماله وراحته لأنه يهدف للوصول للحكم!!<br />هذا الكلام لايصدقه عاقل .<br />فغاية الإخوان هو تحكيم الإسلام الذى فيه صلاح الدنيا والدين وهذه الغاية الكبرى هى التى جعلتهم يصبرون أمام كل هذا التنكيل الذى يلقونه ليل نهار وأمام هذا التشويه المتعمد لهم ولأفكارهم.<br />ياناس إنها ليست حربا للإخوان بل هى فى حقبقتها حرب على كل من يتوجه وجهة إسلاميه.<br />إن أمريكا وحلفائها من الحكام العملاء لايريدون أن يعود الإسلام للصدارة من جديد لأنهم يعلمون أن نجاح الإسلام فى أى دولة خصوصا مصر سيجعل العالم كله يرى رقى وعظمة الإسلام وسيجعل الناس فى بقية الدول الإسلامية فضلا عن الدول غير الإسلامية فى المطالبة والسعى لحكم إسلامى مشابه وهذا مايأرق أمريكا وإسرائيل ويجعلهم يقفون بكل قوتهم أمام أى مشروع إسلامى وليد.<br />وقد رأينا بأعيننا عمليات التضييق على حكومة حماس المنتخبة ورأينا أيضا مطاردة المحاكم الإسلامية فى الصومال من قبل أمريكا بعد أن وجدت حجم التأييد الشعبى لها.<br />وهذه هى سنة الله :<br />من يعمل لدينه ,من يعمل للإسلام -مهما كان اسمه إخوان,سلفى,...حتى لو لم يكن له صفة-فإنه يحارب وتثار حوله الشائعات والأكاذيب ويطارد ويحاك<br />اقرأ بقية التعليق .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042359/http://masr.20at.com:80/article.php?sid=1446"

