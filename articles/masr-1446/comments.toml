subject = "روضه عبد الحميد"
author = "فعلا يااستاذ منيرحالمواطن البسيط مبقاش عارف يفتح الشبك ولا يقفل الشباك؛ يقولوا للشباب اللى عندهم طاقة يجب تفريغها؛ يقولوا لهم اوعى ايدك والريموت كنترول ؛اقصد السياسه؛والواد يروح ينحرف ويجوز عرفى او يشرب ويشم ويبقى سلبى ويقولك على التعديلات الدستوريه دستور يااسيادنا؛ تقوم الحكومة ترجع تانى تسن قوانين وتسعى لدراسة اسباب الجواز العرفى!!ومكافحة المخدرات!! ورفع الوعى السياسى لدى الشباب!!"
posted = "2007-01-24"
text = "يعنى يعملوا ايه لا كدة نافع ولا كدة نافع!! الطريف ان كلة منفد على بعضة؛يعنى الزواج العرفى من اسباب البطالة والبطالة جية من انهيار الاقتصاد وانهيار الاقتصاد جى من الفساد ووزراء البيزنس ووزراء البيزنس جية من الكوسة والكوسة بتيجى منين من الهواء الملوث فتبقى كوسة مهووسة؛ وعجبى"
