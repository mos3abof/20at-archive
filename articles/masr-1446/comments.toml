[[comments]]
order = 25
subject = "لماذا لا نتحد"
author = "الفلسطيني"
posted = "2007-02-07"
text = "الي الأخة الفضلاء كنت أرجو ان نكون كالنا أكثر عقلانية و أن يتقبل منا الآخر. فالأخ رزق مثلا يكره الاخوان لأنهم اخوان مع انهم فصيل أصيل في هذا الوطن طالته السجون و المعتقلات و انت تفرح لأن العالي فتح لهم السجون و المعتقلات دون أن تسأل نفسك كم من برئ فتحت له هذه السجون و كم من مجرم تاجر بقوت هذا الشعب و دمه هو الآن حر طليق يركب بحذائه فوق رؤؤس المصريين و كم من صحفي فاسد تاجر و ابتز بالكثير من القضابا دون سند أو دليل و كم من محب لهذا البلد غيب عن اهله.<br />ان كراهية النظام لا تعني كراهية الأفراد بقدر ما تعني كراهية أغكار عفنة اتت علي الأخضر و اليابس و لم تجد من ناصح فالكل يسبح بحمد الرئيس و كأن الرئيس نبي مرسل معصوم من الخطأ. كنت أود ممن يسبون الاخوان كلما سنحت لهم فرصة أن يتركوا لهم الفرصة ليافعوا عن أنفسهم و خير دليل علي ذلك برنامج \"حالة حوار الذي لا يجد شيء الا سب الاخوان دون ان تجد احدا من الاخوان يدافع او يرد الحجة باختها.<br />البلد ليس بلد الاخوان وحدهم و لكن بلدنا جميعا و يجب أن نستفيد من كل فصيل فيها للعمل من اجلها فلا مبرر اذن لاحتكار السلطة من قبل مبارك و ابنه فالسلطة المطلقة مفسدة مطلقة و انظروا الي ماوصلت له بلادنا و كيف هر ترتيبها بين الدول انتم تعرفون لمذا؟ انه الاستبداد السياسي."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209042713/http://masr.20at.com:80/article.php?sid=1446"

