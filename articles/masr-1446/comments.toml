text = "الموضوع سهل وبسيط وبعيدا عن اية تعقيدات<br />احنا السبب فى كل شىء بيحصل لنا لاالامن يستطيع سجن كل الشعب ولاالرئيس يستطيع تقمييم كل الافوة ابدءبنفسك واعرف انت رايح فين وعايز من الدنيا اية كرامة ام ذل ومهانة وكن لك مبادئك السليمة واعلم انك عايش عمر واحد فقط"
