posted = "2007-02-15"
text = "على فكرة انا ولا من الاخوان انا مسلمة ومصرية بس عايزة اسال سؤال انتوا بتشتموا فى الاخوان اكنهم بجد هما اللى ناهبين البلد روحوا شوفوا مبارك اللى مدوخناورا لقمة العيش وفى الاخر بنغمس لقمة العيش بالذل قبل ما حد اصلن يتكلم عن اى حاجة نورح فى الاول نشوف مبارك واللى عامله فى البلد"
