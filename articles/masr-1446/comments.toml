subject = "بحب مصر"
author = "شمس الاسلام"
posted = "2007-01-23"
text = "السلام عليكم هذا السلام للمحترمين فقط اولا بغض النظرعلي اي موضوع بتتكلموا فيه ان الشتائم اللي الحضرات المحترمين اللي قالوهاهذا يعبر عن البيئة اللي جايين منها ودول لايصح ان اي حد يسمع لهم في اي موضوع لانهم مش فاهمين حاجة.ولوفاهمين علي الاقل يعبروعن رايهم ويحاولو يقنعوا الباقي بكل ادب واحترام.اما عن الموضوع لا عايزين الوطني ولا عايزين الاخوان احنا عايزين حديحافظ علي شرفنا ويحافظ علي بلدناومايكنوش حرامية ويحاولويطبقواشرع ربنا"
archived = "2007-01-25"
capture_url = "https://web.archive.org/web/20070125230419/http://masr.20at.com:80/article.php?sid=1446"

