text = "ما يحدث من اعتقالات في صفوف المعارضة المصرية ولصفوة علماء مصر هو اهانة للانسانية وانتهاك فاضح لحقوق الانسان التي يدعي النظام الحاكم حمايتها.....يبدو انها صفارة النهاية فقد سبق ان اعتقل السادات قبل نهاية عهدة معارضية...ولن ازيد ...نداء للسيد الرئيس باسم الحق أطلق صراح المعتقلين"
