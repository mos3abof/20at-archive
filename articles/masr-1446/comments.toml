[[comments]]
order = 27
subject = "سبحان الله !!"
author = "رزق"
posted = "2007-02-07"
text = "الاخ نعم انه العجب<br />مهو انت مجبتش حاجه جديده هى هى حجه الاخوان الواحده الوحيده ، يا عزيزى من لا يطبقون الاسلام فى شىء معروفين وواضحين و لكن المصيبه فيمن يدعون التدين وما لهم الا اهداف ومصالح سياسيه لا تختلف عن اى حزب اخر ، حاجه كمان برضه انت بتتكلم بنفس الاسلوب المكرر اياه والتلميحات بان من يتكلم على الاخوان ما هو الا (حاقد) على الاسلام على حد قولك ، لم هذا الخبث و سوء النيه وهو يعنى لو حد عاوز يقول حاجه تانيه حد هيحاسبه.<br />الاخ العزيز فلسطينى<br />الجميل فى حديثك ان الفقره الثانيه منه ترد على الفقره الاولى ولكن لو عكست الادوار فالمتحمسين للاخوان يروهم معصومون من الخطا تماما و حتى اذا حدث خطا فهو اما بحسن نيه و غير مقصود او مؤامره من النظام ... الخ ما تعيب به الحكومه موجود بصوره اشد فى الاخوان فعن اى شىء تتحدث."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209042713/http://masr.20at.com:80/article.php?sid=1446"

[[comments]]
order = 28
subject = "هريدي واعتقالات الإخوان"
author = "خالدشداد"
posted = "2007-02-08"
text = "فية اية اية المشكلة انتو شوفتو الأخوان قاعدين علي الحكم الصبح ربنا يخلي الريس احنا عايزين نعبد ربنا ونشتغل ونعلى ونعلي بلدنا ونضمن ان شاء اللة مستقبل كويس لولدنا دة كتير دة مبالغ فية احترام الأدمية هو الأسلام بكل معانية عايزين منخفش من الأكل والمية والحكومة وبكرة عايزين ننام من كتر الهموم مبقاش فية نوم عايزين نبقي بشر ياتري مين هيدينا المطالب دي اخوا حكومة بولس التاني كلها اسامي ومش عجباني يخونا قولو يارب بصو للسما شوية بقي وخليها بسيطة علشان انا اتكلكعت منكم ومن كلامكم التخين دة انتو كنتو بتاخدو كام في الأنشاء وانتو صغيرين دي حاجة .........."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209042713/http://masr.20at.com:80/article.php?sid=1446"

