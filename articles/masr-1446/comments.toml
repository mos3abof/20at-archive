subject = "فل عليه ..... ورد عليه"
author = "Samirium"
posted = "2007-01-15"
text = "أبو رزق حبيب ألبى انت واللى قالك برافو واللى بيشكر الشرطة الىلى بتغتصب الرجالة اللى زية بخشبة صباح الفل يا رجالة اسف على الشتيمة-يا نسوان- فل عليكوا .... ورد عليكوا يا معلمين بالله عليك لو انت نفسك جالك ظابط وعمل فيك اللى عملوة فى عماد الكبير بتاع بولاق هتقول شكرا يا شرطة احيييييييه على رجالتك يا مصر انتوا ايه ما عندكوش دم اهو عماد دة ولا اخوان ولا نيلة دة يا عينى سواق ميكروباص ملوش فى الطور ولا فى الطحين يعنى لا مؤاخذة كده ما تجيش تتكلم فى حاجه انت مش فاهمها وتعملى فيها وطنى اوى وبتحب بلدك على الأخر علشان امثالكم هما اللى بيخلونا نغتصب وتضيع كرامتنا طبعا الكلام اللى انا قلته ده على اساس انك مواطن عادى مش امن دولة جاى بتصيع علينا يعنى ..... وسلملى على البتنجان يا تاج راسى"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192223/http://masr.20at.com:80/article.php?sid=1446"

[[comments]]
order = 8
subject = "الاخوان"
author = "رزق"
posted = "2007-01-16"
text = "اخى اشرف منصور<br />كنت اتمنى ان تسال مهدى عاكف و زبانيته الذين يتشدقون بالدين ليلا نهارا بدلا من ان توجه السؤال لى<br />نقطه كمان ليس معنى كلامى اننى اؤيد الاعتقالات و التعزيب و لم اقل هذا ، كل ما اتمناه هو ظهور طرف تانى و ثالث و رابع ولا هو يعنى يا الحكومه يا الاخوان ، والاخوان ساعدوا عبد الناصر فى الثوره ثم اختلفوا معه ثم اعادهم السادات لمواجهه الناصريين و الشيوعيين شانهم شأن الجماعات الاخرى التى قتلته فى النهايه ، وها هم يهادنون الحكومه من ان الى اخر تبعا لمصالحهم ، بل اعلنوا فى اكثر من موضع انهم على استعداد للاتفاق مع امريكا ، لا افهم لماذا تامنون لمثل هؤلاء و تعطوهم عقولكم و تدافعون عنهم بهذه الاستماته."
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192223/http://masr.20at.com:80/article.php?sid=1446"

[[comments]]
order = 9
subject = "الاسلام الصحيح هو الحل"
author = "اشرف منصور"
posted = "2007-01-17"
text = "اخي رزق<br />انا لايهمني شئ في هذه الدنيا سوى ان يسود شرع الله على هذه الارض ليس تفضلا مني ولكنه امر من الله بهذا وسنحاسب جميعا امامه علي ذلك فلن يحاسبنا بشر ايا كان والجنة والنار حقيقة والذي يملك حق ادخال اي مخلوق في اي منهما هو الله سبحانه<br />اخي اري في ردك الكلام مرسل وغير مؤيد بشئ انما هو كلام مما نسمعه من الاخرين<br />ونحن دائما ننقد فقط الاخوان خطأ ومبارك خطأ ثم نصمت ولانضع حلولا<br />الموضوع ضخم وكبير وليس باليسير<br />والنتيجة تبعا لذلك اشد خطورة فليس بعد الموت من دار الا الجنة او النار والكل سيموت الا هو سبحانه فهل نفيق مما نحن فيه ونبحث عن النجاة ويقول لنا الرسول صلي الله عليه وسلم ( تركت فيكم ما إن تمسكتم به لن تضلوا بعدي ابدا كتاب الله وسنتي ) او كما قال فمن تمسك بماجاء في هذا الحديث فهو الفائز اي كان وسأكون اول من يسير في دربه طاعة لله وطمعا في جنته واملا في النجاة من ناره<br />فاأين ياتري من تتوفر فيه هذه الصفات في زمننا الحالي فكر قليلا وستعرف حتما"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192223/http://masr.20at.com:80/article.php?sid=1446"

