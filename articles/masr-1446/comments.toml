[[comments]]
order = 0
subject = "مبادىء قانونية/ قد اسمعت لو ناديت حيا"
author = "زمان في كلية الشرطة ما كانوش بيدرسوا قانون ولما جه جمال عبدالناصر قال لازم يدرسوا قانون في كليةالشرطة علشان خاطر الضابط يبقى رجل قانون ويطبق القانون."
posted = "2007-01-15"
text = "لذلك نتوجه بالنداء الى السيد حبيب العدلي ويذكر رجال الداخلية انهم رجال قانون: وللتذكرة ارفق مبداين قانونيين هامين:<br />___________________________________<br />من المقرر أن البلاغ عن جريمة لا يكفي وحده للقبض على المتهم وتفتيشه وتفتيش مسكنه أو متجره بل يجب على الشرطة أن تقوم بعمل تحريات عما اشتمل عليه البلاغ فإذا أسفرت تلك التحريات عن توافر دلائل قوية على ما ورد بالبلاغ ، فعندئذ يسوغ لرجال الضبط في الحالات المبينة في القانون أن يقبض عليه وتفتيشه<br />ـــــــــــــــــــــــــــــــــــــــ<br />إن أصل البراءة يعتبر قاعدة أساسية في النظام الإتهامي-----، لا ترخص فيها، تفرضها حقائق الأشياء وتقتضيها الشرعية الإجرائية وحماية الفرد في مواجهة صور التحكم والتحامل، بما يحول دون اعتبار واقعة تقوم بها الجريمة ثابتة بغير دليل حاد قاطع يبلغ مبلغ الجزم واليقين ولا يدع مجالاً لشبهة انتفاء التهمة أو الشك فيها ، ودون ذلك لا ينهدم أصل البراءة،"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192223/http://masr.20at.com:80/article.php?sid=1446"

