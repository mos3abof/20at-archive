author = "رزق"
posted = "2007-01-30"
text = "يا اخى اشرف منصور انا طبعا لست ضد الحكم بشرع الله و اكيد لا يوجد عاقل يرفض الحكم بشرع الله ، انا ضد الاخوان فى حد ذاتهم كجماعه ... ومع الاسف كلامك (المرسل هو الاخر بالمناسبه) هو دليل على نجاح الفكره التى يروج لها الاخوان بأن من يخالفهم فقد خالف شرع الله ؟؟؟؟ والسؤال هنا لماذا ؟؟؟ من اقامهم على شرع الله ؟؟؟ وكما ترى يا صديقى كم الهجوم الذى تعرضت له لمجرد انى تجرات و فتحت فمى وقلت انى ضد الاخوان فبالله عليك كيف و الحال هكذا نامن ان يحكم الاخوان حكم ديموقراطى ، ما دليلك على هذا سوى كلام كلام يا يؤيده اى فعل بل على العكس تماما وردود هذا الموقع خير دليل على كلامى اذا كنت تطلب دليل ، طبعا انا اتحدث اليك كشخص محترم يتحدث حديث العقلاء و المتحضرين و يسعى الى الاقناع او الاقتناع وهذا هو ما يجب ان يكون فتحيه لك اولا واخيرا رغم كل ما نختلف عليه ، ومن ناحيه اخرى اقول للاخ العزيز Samirium اطمئن يا اخى لست امن دوله داخل يصيع عليكم بل انا مخابرات عامه و هناك احتمال ان اكون من الموساد والعياذ بالله !!!"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042359/http://masr.20at.com:80/article.php?sid=1446"

