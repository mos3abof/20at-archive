[[comments]]
order = 2
subject = "الوصول الى جهازها كالوصول الى حقيبتها"
author = "خلف"
posted = "2006-02-01"
text = "الفكرة يمكن النظر اليها من حيث هي على انها جديدة ، اي من<br />حيث اسلوب التخاطب مع الغير .<br />لكن طالما انها زميلة في العمل وانت تكلمها ، فما المانع من<br />ان تصارحها مباشرة وتسالها هل هي مخطوبة ام لا؟ فاذا كانت<br />الاجابة انها غير مخطوبة فاسالها عن بيتهم ثم اطرق الباب<br />واطلبها من اهلها .<br />امور الزواج في الاسلام صريحة واضحة ولا بد فيها من المواجهة<br />المباشرة ، وهذا ما قلته مرارا في ردودي على كثير من المداخلات<br />، فهو امر مشروع وانت لا تعمل حراما في السؤال والخطبة .<br />فهل هناك فرق بين ان تضع لها ورقة عليها هذه الاسئلة في<br />حقيبتها وما فعلته على جهازها الخاص بها؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114902/http://www.20at.com/article2.php?sid=369"

