author = "جيمي"
posted = "2009-12-22"
text = "إخوان 2009 … ماعملوش أي حاجة غير أنهم يتقبض عليهم .<br />إخوان 2010 … سوف يحيطها الفساد والمؤامرات من كل جانب، من داخل الجماعة وخارجها.<br />لأن فى توقعي أن حد زي محمد حبيب أو أبو الفتوح هيحاول قدر الإمكان أنه يستعيد ما سلب منه أو اللى هو حاسس بأنه سلب منه (لو أستمر الوضع كما هو عليه)… وهيضربوا فى بعض وكل واحد يطلع اللى عنده للتانى ويبقى جو مليئ بالمشاحنات والضغائن وهيحصل إنشقاقات بين الإصلاحيين والمحافظيين وهتبقى ( درمغة).<br />يعني من الآخر … هيبقوا نسخة من اللى حصل وبيحصل دلوقتى فى مجموعة شباب 6 أبريل، سابو كل حاجة وأنقسموا وفضوا نفسهم للخناقات ، هما دول إخوان 2010 بكل بساطة"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224115736/http://www.20at.com:80/masr/hot-topics/14515--2010-.html"

