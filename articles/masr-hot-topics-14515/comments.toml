author = "هذة هى الانتخابات"
posted = "2009-12-22"
text = "طالما فية انتخابات واصوات ومفيش تزوير يبقى الكل يرضى<br />العملية مش اشخاص بنحبهم او نكرههم<br />العملية عملية اغلبية تريد هذا<br />احترموا الديمقراطية<br />وكل واحد يعمل زى ما بيحصل فى الدول النضيفة - يهنىء التانى<br />واللى حاصل انهم كلهم دكاترة ومثقفين جدا وغالبيتهم اساتذة فى الجامعة"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224115736/http://www.20at.com:80/masr/hot-topics/14515--2010-.html"

