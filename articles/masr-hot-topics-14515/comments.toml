author = "السؤال المهم"
posted = "2009-12-22"
text = "هي جماعة الاخوان المسلمين مخترقة من<br />1) الامن المصري<br />2) المخابرات الاسرائيلية<br />3) المخابرات الامريكية<br />عارفين يعني ايه مخترقه ولا مش عارفين<br />يعني ليهم عملاء جوا الجماعة مندسين جوا الجماعة في صورة اخوان وما حدش عارفهم<br />هو دا السؤال المهم"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224115736/http://www.20at.com:80/masr/hot-topics/14515--2010-.html"

[[comments]]
