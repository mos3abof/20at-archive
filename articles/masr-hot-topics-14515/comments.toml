subject = ""
author = "امال فين المرشد"
posted = "2009-12-29"
text = "الاخوان المسلمين قالوا ان فيه مرشد جديد<br />ومستنيين وما احدش اعلن اسمه<br />ايه هو المرشد الجديد سر من الاسرار العسكرية الخطيره واللي اعلانه حيبقى مفاجأه حتكسر الدنيا<br />حيعمل ايه اكتر من اللي عملوه اللي قبله<br />سجون ومعتقلات وامن دوله وتعذيب وقرف وخوف وقلق ورعب<br />80 سنه اخوان ما شفناش حاجه غير السجون والمعتقلات<br />يلا يا خويا اعلنوا اسم المرشد ((( القنبله )))) اللي حيكسر الدنيا"
archived = "2010-02-23"
capture_url = "https://web.archive.org/web/20100223235803/http://www.20at.com:80/masr/hot-topics/14515--2010-.html"
