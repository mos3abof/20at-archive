[[comments]]
order = 0
subject = "لا حول ولا قوة الا باللله"
author = "ديمة"
posted = "2007-01-18"
text = "الموضوع جدي جدا ياها يدى ولقطة مهمة بس ساريت تكلمى بقى المعلمومة اللى قتليها ايه السبب فعلا سوء استخدام ولا فى صفقات فاسدة سواء فى الاجهزة او الغاز الذى يتم توزسعه، اسعى ورا الموضوع"
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120213056/http://masr.20at.com:80/article.php?sid=1462"

[[comments]]
order = 1
subject = "الفوضى الخلاقة"
author = "اليس لكل شىء عمر"
posted = "2007-01-18"
text = "سلندر الغاز او انبوبة البوتاجاز تمثل الوجة القبيح للصناعة المصرية الرديئة<br />وممكن ان تنفجر او تسرب غاز تقتل بة اسرة كاملة<br />فى العالم المتقدم والمتخلف تختبر تلك بضغط هيدروليكى لمعرفة مدى تحملها<br />وتختبر المحابس ومنظمات الضغط دوريا<br />اما نحن فلا محاسبة ولا شكوى وكلة ماشى بالتساهيل<br />اذا تضرر مواطن وقدم شكوى ورفع قضية على الشركة المسؤلة عن تللك الانابيب<br />وقام القاضى بالحكم بتعويض المواطن بمبلغ يقسم ظهر الشركة فانها ستخاف وتجود انتاجها وتهتم بالجودة<br />يااخى المواطن لا تكن سلبى اذا حدثت مشكلة<br />وارفع قضية واطلب حقك<br />اما اذا كان المسؤلون يريدون التخلص من الشعب المصرى لاغراض تحديد النسل فذلك امر وارد<br />وربنا يصلح الاحوال"
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120213056/http://masr.20at.com:80/article.php?sid=1462"

[[comments]]
