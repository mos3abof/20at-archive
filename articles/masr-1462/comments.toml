subject = "هم يبكى و هم يضحك"
author = "نيفين نيفى نوفا"
posted = "2007-01-20"
text = "حسيت و انا بقرا المقال انى فتحت صفحه الحوادث<br />و التعليقات تحفه بصراحه و ضحكتنى"
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120213056/http://masr.20at.com:80/article.php?sid=1462"

[[comments]]
order = 5
subject = "وقام الجيران بإلإنقاذ"
author = "دسوقى"
posted = "2007-01-21"
text = "قد يبدو تعليقى بعيد عن الموضوع, بس من الملاحظ إن 90% من التدخلات للإنقاذ من الجيران أو الاهالى, مش بس فى حوادث الغاز لكن فى كل الحوادث.<br />ده فى دليل على شهامة المصريين بس إحيان كتير التدخل الجاهل يؤدى الى تفاقم الحادث.<br />يعنى لا قدر الله و تسرب غاز فى شقة و حاول الجيران كسر الباب فنتج عن السر شرارة الغاز حيولع و يتحول الحادث الى حريق ممكن يموت اللى كانو فى الشقة و اللى بينقذوهم و ناس تانية ماهاش فى الموضوع."
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121172212/http://masr.20at.com:80/article.php?sid=1462"
