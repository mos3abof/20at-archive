subject = "ريكو"
author = "ريكو"
posted = "2007-01-19"
text = "حد عنده أغنية أنابيب بتاعة ريكو وياسمين عبدالعزيز أنابيب واللي لحنها مسروق من أغنية عبدالحليم أنا فين جتلي منين"
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120213056/http://masr.20at.com:80/article.php?sid=1462"

[[comments]]
order = 3
subject = "الحل هو اننا نرجع للطشط والبابور"
author = "مصرية"
posted = "2007-01-20"
text = "خلاص يا جماعة علشان نتفادى حوادث الغاز المتسرب يبقى الناس متدخلش الحمامات اصلن او نشيل السخانات ونرجع لطشط والمية المتسخنة على البابور ولو الانبوبة بتاعتهالوتجاز بتنفجر يبقى نشيل البتوجاز ونرجع للبابور او ممكن منطبخش اصلن ولا على البابور ولا على بوتجاز اصلى كدة ولاكدة الناس مش لاقيه تاكل فمالوش لازمة البابور والبوتجاز.ولو الناس هتموت فى حوادث العبارة يبقى الناس متسافرش اصلن حتى لو مش لاقين شغل ولو هتموتوا عن طريق حوادث القطرات يبقى ماتسفروش برة محافظتكم يعنى خليكوا فى بيوتكم احسن لكم علشان لما تموتوا تبقى دى بجد موتة ربنا ويقدروا يقولوا قضاء وقدر"
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120213056/http://masr.20at.com:80/article.php?sid=1462"

[[comments]]
