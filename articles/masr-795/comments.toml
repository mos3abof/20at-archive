[[comments]]
order = 5
subject = "_"
author = "زنوبه"
posted = "2006-08-12"
text = "آتفق مع الرماح<br />لا نستطيع آن نلوم فرح ـ بل اللوم كل اللوم على الاعلام والقائمين عليه بما يبثونه فى عقول الناس لنشر الفرقه بين المسلمين وإضعافهم إما بالافساد الخلقى آو بشيوخ فتاوى إسلام العفاريت آو بإلصاق تهم بين طوائف المسلمين وبعضهم البعض.<br />الصوره الحقيقيه بدءات تضح للجميع<br />ومرحبا بالاخوه فى الله من إيران.<br />ملخوظه: يوجد شيعه فى مصر والكثير منهم مقيدون بنقابة الساده الاشراف وفى مجلس النقايه نفسه يوجد آعضاء من الشيعه المصريين. من آشهر الشيعه المصريين آخ فى الله يملك سلسلة سوبر ماركت شهيره جدا جدا على مستوى الجمهوريه ودائما ما تسمع القرآن الكريم فى الاذاعه الداخليه للسوبر ماركت عند الذهاب للتسوق ـ بيبيع بسعر الجمله ـ وفى وقت الاذان يذيعون الاذان المعروف لدى آهل السنه. فقط وجب التنويه ولست متآكده إن كان هو نفس الرجل الذى يملك توكيل السيارات الشهير فى مصر آم هو تشابه آسماء"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065121/http://masr.20at.com:80/article.php?sid=795"

[[comments]]
order = 6
subject = "كمالة لكلام زنوبة"
author = "محب جعفر الصادق؛ حفيد أبي بكر"
posted = "2006-08-17"
text = "السوبر ماركت الشهير اللي تقصده زنوبة هو أولاد رجب؛ وعايز أضيف إن أهل السنة كلهم مش المصريين بس بيحبوا آل البيت؛ لكن الفرق إن أهل السنة مابيسبوش الصحابة وكمان حبهم لآل البيت والصحابة لا يسقط بشرية الاثنين بأنهم عباد صالحون وتقاة ولكن يخطئوا ويصيبوا وليسوا مقدسين كالأنبياء، بينما يؤمن الشيعة بأن آل البيت معصومين كالأنبياء، بل أفضل من الأنبياء باستثناء سيدنا محمد؛ أما الأحاديث التي أوردها شاتم فرح فهي من أحاديث الشيعة وليست في كتب السنة، وهناك أحاديث ضعيفة وموضوعة في كتب السنة يستشهد بها الشيعة، أما قتلة الحسين رضي الله عنه فنسطيع معرفتهم من ندائه في جيش ابن زياد قبل مقتله \"يا فلان ألم تكتبوا لي أنه قد أينعت الثمار فاقبل علينا فإنما تقبل على جند مجندة \"."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065121/http://masr.20at.com:80/article.php?sid=795"

[[comments]]
order = 7
subject = "وحده مصريه ايرانيه"
author = "بعيدا عن مسأله السنه و الشيعه"
