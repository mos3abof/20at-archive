[[comments]]
order = 0
subject = "لا اهلا ولا سهلا بايران"
author = "فرح"
posted = "2006-08-10"
text = "مش هطول عليكم<br />سمعتوا كلمة حسن نصرالله امبارح اللي ذاعتها كل القنوات الاخباريه نقلا عن تلفزيون المنار لم يستشهد ابدا وهو في خضم دفاعه عن الشرف العربي والاسلام اقول لم يستشهد باي حديث عن الرسول الكريم صلى الله عليه وسلم ولم يذكر كلماته صلى الله عليه وسلم التي هي كفيله بان تجعلنا كلنا فداء للدين والوطن وبدل ذلك اكتفى بمقولات امامهم رضي الله عنه.<br />هل يعرف أحدكم أصل مبدأ الشيعه الاصل عندهم أن الوحي نزل خطأعلى سيد الخلق أجمعين وكان المفروض ينزل على سيدهم على كرم الله وجه<br />هل سمعتم الآذان في مساجدهم يقال أنهم استبدلو جمله أشهد أن محمد رسول الله بجمله أشهد أن على رسول الله وان كانت الاخيرة لست متأكده منها<br />هل علمتم أن علمائهم الغير أجلاء يتفانون في سب النبي صلى الله عليه وسلم<br />وبعد كده تقولوا اهلا بالشيعه والنبي اتوكسوا."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065121/http://masr.20at.com:80/article.php?sid=795"

[[comments]]
order = 1
subject = "الي فرح"
author = "بلال"
posted = "2006-08-10"
text = "الاذان في مساجدهم< بيضيفو> بعد اشهد ان محمد رسول اللة اشهد ان علي ولي اللة فقط ولا خطاء في ذلك فعلي كرم اللة وجهة هو من اولياء اللة ثم انهم لا يسبو الرسول ثم ان العلماء اجمعوا علي عدم تكفيرهم والوقت الان لايسمح ببحث الخلاف السني الشيعي الوحدة الان اهم ثم نبحث اخطاء او ذنوب الشيعة"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065121/http://masr.20at.com:80/article.php?sid=795"

[[comments]]
order = 2
subject = "لا للاكاذيب"
author = "الفارس"
posted = "2006-08-10"
text = "المدعو فرح الكذب علي المسلمين والادعاء المغلوط عليهم اكبر حرام الشيعه عمرهم ما سبوا الرسول وكيف يسبونه وهم يعتبرون انفسهم اهل بيت الرسول ثم انهم في الاذان يشهدون ان لا اله الا الله وان محمد رسول الله ويضيفون وان علي ولي الله ولا يمكن لاحد ان يكفرهم ماداموا قد نطقوا بالشهادتين وقد افتي الازهر بان مذهبهم وهم الجعفريه وهم الاغلبية والزيدية من الممكن التعبد به وهذه الدعاية السيئة عليهم ورائها الوهابين السعوديون المتحالفين مع الصهاينة والامريكان وهم دعاة تفرقة وفتنة بين المسلمين أخزاهم الله"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065121/http://masr.20at.com:80/article.php?sid=795"

[[comments]]
order = 3
subject = "فرح انتى الجهل"
author = "المدعية فرح او المدعى كلاهما واحد قبل ان تحدفى الناس بالطوب اقرى واجلسى معهم اولا اهل الجهل والمدعين امثالك لايعرفون غير السمع والطاعة ربما سمعتى من الحلفاء امثالك ان الشيعة غير عباد وهل انتى تعتقدى بالفرض انهم عباد لسيدنا على هل تعلمين من هو سيدنا على فقال الرسول الكريم (انامدينة العلم وعلى بابها ) وقال ايضا (جعل الله ذريتى فى صلب على )فاذا كنتى جهلاء فهذا شئنك اما الافتراء على اهل الشيعة فهذاسفة يعود الى الوهابين التى انتى منهم ولاملامة على قاتلى سيد الشهداءومن الامة الشيعيةخرج نصرالله وجنود الله الذى يتشرف الانسان بالحديث معهم الفرق بين السنة والشيعة جاء من ناس امثالك لايعلمون ويرفضون الاطلاع حتى يتنور عقولهم ودخلوا فى التوريث المتخلف فى النقل عن بعضهم البعض كان الاولى بك ان تسالى اولا من هم وما مذهبهم والى ماذا يدعون وما الفرق بين الشيعى والسنى ولكن سكبتى حقائق غلط فى غلط بجهل واساءة ادب لااطلب منك محبتهم ولكن اطلب منك فهم الامور بعقل الحوار والمناقشة لابالطريقة القديمة التى كانوا يخزنها فينا الجهلة وتحيا الشيعة واهل رسول الله ومحبى اهل البيت الشرفاء ومحبى رسولهم الكريم ومحبى اهل البيت واختم قولى بقول رسولى الشريف العظيم حين قال (انامن الحسين والحسين منى )ولااؤمن بنظرية سنى وشيعى كلة فى عباءة سيدنا النبى موحد بالاسلام ومحبى فقط لسيدنا الامام واهل بيت رسول الله اللى كان الوهابيون يريدون قتلهم بعد سيدنا النبى ومازالوا يحقدون على من يعشق اهل البيت اما الشيعة فما زالوا شئت ام ابيتى يحبون النبى والامام على واهل بيت رسول الله واختم قولى اهلا ثم اهلا بايرانرافعى راية الاسلام فى هذا العصر المخزى ولاعزاء للجهل يا فرح تنورى بالعلم قبل ان تحدفى الناس بالطوب وارفضى الجهل وعلمى نفسك و"
posted = "2006-08-11"
text = "اقرأ بقية التعليق .."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065121/http://masr.20at.com:80/article.php?sid=795"

