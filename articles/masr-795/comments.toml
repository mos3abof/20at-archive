text = "ما الذى يضمن بان لن تستبدل خطر و نفوذ اسرائيلى باخر غيره ايرانى؟؟<br />ولا تقل لى لا ايران مسلمه زينا..اليس الحكام العرب اللى مش عاجبينكم مسلمين ايضا"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065121/http://masr.20at.com:80/article.php?sid=795"

[[comments]]
order = 8
subject = "لا للحرب"
author = "حازم نسخة"
posted = "2006-08-20"
text = "اهلا وسهلا ومرحبا بعودة العلاقات نتمنى ترجع لاننا مسلمين ولايوجد فرق بين مسلم وشيعى ونرجومن اهل الشيعةوالسنة الى نبذ الفرقةوينتشر الفكر السليم لمعنى الشيعةمحبى سيدنا الامام ومؤمنين برسالة سيدنا النبى فلقد ذهبت فى عمرة وكانوا اكثر الفئات هناك حبا لسيدنا النبى اما من يخاف من مكانتهم الموعودة لانهم اصبحوا حملة راية الاسلام"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065121/http://masr.20at.com:80/article.php?sid=795"

[[comments]]
order = 9
subject = "كتاب الله وسنة نبيه محمد"
author = "رحال"
posted = "2006-08-21"
text = "اولا اقول لفرح بارك الله فيك وهداك للحق ثانيا الردود التي اقرائها للبعض لاتستند لكتاب الله وسنة رسوله بل هي اراء واقاويل وإلا كيف يدافعون عن قوم جعلوا لقاتل عمر الفاروق ضريحا مكتوب عليه ضريح ابو لؤلؤه رحمه الله ويزوره كثير من الشيعه الضلال كيف ندافع عن قوم اعلن الحرب على الله ورسوله اليس سبهم لصحابة الرسول رفضهم لسنته اليس سبهم لام المؤمنين عائشه رضي الله عنها عداء لال البيت اقول اتقوا الله في انفسكم وارجعوا لكتاب الله وسنة نبيه محمد صلى الله عليه وسلم"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821105049/http://masr.20at.com:80/article.php?sid=795"

[[comments]]
order = 10
subject = "التوحيد"
author = "رحال"
posted = "2006-08-21"
text = "ان حرب اليهود والنصارى حرب على الاسلام والاسلام من عند الله ومحمد عليه الصلاة والسلام اخبرنا بالنصر عليهم والله تعالى يقول ان تنصروا الله ينصركم ***ونصر الله يكون باتباع كتاب الله وسنة نبيه المصطفى والتمسك بالتوحيد وعدم التهاون في اي امر شركي وبدعي . واقول ان الخلاف مع الشيعه ليس خلاف مذهبي كما يعتقد البعض هداهم الله وانما الخلاف خلاف عقائدي فهم عقيدتهم شركيه بمعنى الكلمه واذا لم تصدقوني ارجعوا لمعتقداتهم هل توافق سنة محمد عليه الصلاة والسلام وهل توافق الكتاب وتذكروا ان دعوة الرسل كانت دعوة توحيد ونبذ الشرك قال الله تعالى (وما خلقت الجن والانس إلا ليعبدون) ومعنى يعبدون يوحدون فكيف ندعوا للوحده مع الشيعه هداكم الله وهم يكذبون بالقران والسنه ولايغرنكم الضاهر فهم والله اخطر من اليهود والنصارى انضروا ماذا يفعلون بالسنة في العراق نسال الله ان يرجع امة محمد لكتابه وسنة نبيه عليه الصلاة والسلام والسلام عليكم ورحمة الله وبركاته"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821105049/http://masr.20at.com:80/article.php?sid=795"

[[comments]]
order = 11
subject = "اتق الله يا رحال"
author = "مجاهد"
posted = "2006-08-23"
text = "الاخطر علي المسلمين امثالك من خدم ال سعود ودعوتهم القذرة الوهابية اعدل يا رحال وقل الحق اكثر من يذبحون في العراق هم الشيعة كل يوم نقرأ عن سيارة مفخخة في النجف وكربلاء تقتل الزوار الشيعة ويقوم بهذا العمل الجبان امثالك من المكفرين المدعومين بفتاوي مشايخ السعودية اتباع الحكام حاليا الشيعة اكثر ناس يحاربون اسرائيل والكل يعرف هذا وهم ياكاذب اكبر حلفاء للفلسطينيينالاسحقا لعملاء بني سعود"
archived = "2006-08-27"
capture_url = "https://web.archive.org/web/20060827134258/http://masr.20at.com:80/article.php?sid=795"

[[comments]]
order = 12
subject = "الظلم حرام"
author = "نوران"
posted = "2006-08-29"
text = "ليه الظلم علي اخوانتا الشيعه وهو مفيش حد بيقتل وبيفجر الا الشيعه كلنا ماقين علي ان الله واحد ورسوله خاتم الانبياء وفي اكتر من الميثاق الغليظ اللي كل سني وشيعيه والعكس بيتفقوا عليه في اكتر من تكوين اسره بين السني والشيعيحرام الظلم علي الشيعهوكلنا بنحب الرسول وال بيته والصحابه"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025434/http://masr.20at.com:80/article.php?sid=795"
