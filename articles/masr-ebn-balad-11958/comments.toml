subject = ""
author = "مسعود عبد السلام"
posted = "2009-05-04"
text = "افضل حاكم فيهم وافضل حكم كان حكم محمد على باشا الكبير رحمة اللة فقد بنى نهضة مصر الحديثة وارسل البعثات الى اوروبا وبالذات فرنسا وكانت مصر فى عصرة تسبق اليابان فى التطور وبنى جيش مصر الحديث وقضى على المماليك ونظام الجباية بواسطة الملتزم القبطى واسس دوواين الحكومة العصرية<br />اما اسوأ العصور فهو عصر الخديوى اسماعيل الذى اغرق البلاد فى الديون مثل ما فعل النظام الحالى وصرف تلك الديون على مشاريع عديمة الانتاجية وجعلت البلاد لقمة سائغة للاحتلال والتدخلات الاجنبية<br />نعم عصر اسماعيل ومبارك هو عصر القروض الاجنبية والتدخل الدولى فى شئون البلاد عن طريق البنك الدولى او التدخل السافر وكلاهما اتسما بالفساد"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519052227/http://www.20at.com:80/ebn-balad/11958-2009-05-04-14-21-22.html"

[[comments]]
order = 3
subject = ""
author = "جيـــــــــــــــمي"
posted = "2009-05-04"
text = "وليه ما يكونش أحسن حكم عاشته مصر فى عهد محمد على باشا .. الباشا الكبير<br />أشمعنا يعنى مبارك ؟؟؟!<br />على الأقل محمد على .. ساهم في أنشاء نهضة تعليمية وصناعية و حربية و أحدث ثورة ثقافية .. كان عايز مصر تتقدم بجد وكانت بتتقدم بالفعل<br />ماكنش عايز الشعب يبقى جاهل .. وفتح له مدارس وسفر الشباب لغاية اوروبا علشان ياخدوا الخبرة فى المجالات الصناعية والزراعية و التعليمية بل و الصناعات الحربية .<br />مبارك بقى عمل أيه ؟<br />كوبرى مبارك<br />مدينة مبارك<br />مركز شباب مبارك<br />مشروع مبارك كول الى فشل نسبياً .<br />مصنع مبارك<br />مساكن مبارك<br />حزب مبارك<br />نظام مبارك<br />معتقلات مبارك<br />و اللهم زد وبارك على قصر مبارك وولاد مبارك ونظام مبارك وكله كله يارب يبقى مبارك .."
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519052227/http://www.20at.com:80/ebn-balad/11958-2009-05-04-14-21-22.html"

