author = "جيـــــمي"
posted = "2009-05-05"
text = "يا عمنا أيه أخوان و أيه بتاع بس<br />فمثلاً يصف عبد الناصر (واحداً من أكثر زعماء القرن العشرين إثارة للجدل) .. طب مهو كدة فعلاً .. سواء فى أيجابياته او سلبياته .<br />انا مش شايف ان كاتب المقال كان منحاز فيها .. و أعتقد ان الكاتب قال( لكن نفس هذه السياسات فسرها البعض بشكل سلبي) .<br />اى انه لم يفسرها هو على لسانه .. لنى أشك انه قد يكون من المعاصرين لعهد جمال عبد الناصر .<br />وفعلاً فيه ناس غريبة اوى<br />يعنى لو كان الكاتب ذكر اتفاقية كامب ديفيد بس كجانب سلبى اكتر منه أيجابى كان هيتقال عليه انه مش محايد<br />واديه قال حرب اكتوبر .. برده مش عاجب<br />فتحوا مخكوا شوية بقى يا ناس ..<br />وعن نفسى مش شايف اى كلمة جت على لسان الكاتب"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519052227/http://www.20at.com:80/ebn-balad/11958-2009-05-04-14-21-22.html"

[[comments]]
order = 13
subject = ""
author = "نديم السويسي"
posted = "2009-05-05"
text = "بقية تعليق رقم (10)<br />وكشأن كل الأخوان يظل الرئيس الراحل أنور السادات اكثر من يثنون عليه من حكام مصر لما أتاحه لهم من حرية وحركة لذ ا ليس غريباً بأن الكاتب بدأ مقاله عنه بأنه(يعرف ببطل الحرب والسلام) ولعدم طول فترة حكم السادات مقارنة بعبد الناصر لم يجد الكاتب من إنجازاته سوى حرب أكتوبرالتي وصفها بأنها ( أكبر حرب على إسرائيل) ومفاوضات السلام ولم يذكر سلبية واحدة للسادات ثم ينهي الفقرة بأنه أغتيل على يد (مجموعة إرهابية) وكما ذكر تاريخ وفاة عبد الناصر ذكر أيضاً تاريخ وفاة السادات ولكن بتعبير أكثر تأثراً وعزاءاً (ليتوفاه الله عن عمر 61 عاماً) كما لو أن الله سبحانه وتعالى توفى السادات وعبد الناصر توفي فقط وكما أنه من المهم أن نعرف عمر السادات ابلطبع ولكن ليس مهماً أن نعرف عمر عبد الناصر ، ثم ما المهم في ذكر اسم الرئيس مبارك كاملاً سوى الرغبة في اجترار السخرية من القراء .إنه لمن المؤسف عدم الحيادية في مثل تلك الموضوعات و محاولة توجيه آراء القراء لما يميل له فكر الكاتب فحسب."
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519052227/http://www.20at.com:80/ebn-balad/11958-2009-05-04-14-21-22.html"

[[comments]]
order = 14
subject = ""
author = "نديم السويسي"
posted = "2009-05-05"
text = "يبدو أن كاتب المقال (إخواني) صرف وذلك يتجلى تماماً في الجزأين المتعلقين بالرئيسين الراحلين العظيمين (جمال عبد الناصر) و (أنور السادات) فلم يقم كاتب المقال بوضع معلومات عامة عن أهم ما حدث في فترة حكم كل منهما كما فعل مع باقي حكام مصر وإنما أصر على تشويه الأول وتمجيد الثاني فمثلاً يصف عبد الناصر (واحداً من أكثر زعماء القرن العشرين إثارة للجدل) و على الرغم من ذكر بعض (إيجابيات) حكمه إلا أنه وصفها بأنها (كان لها وجهها السلبي) وبدأ يشرح سلبيتها بأسلوب لم يخل من الوصف الغير المحايد كما وصفه بالـ(عنترية ) وطبعاً لا يفوته ذكر ن[ *** ]ة 67 ولا يفوته أهم تهمة لا يمل الإخوان من ترديدها وعلى حد تعبيره (في ظل أوضاع سياسية غير مستقرة، نكل فيها بمعارضيه وأودعهم السجون العسكرية القاسية، خاصة الإخوان والشيوعيين) ثم ينهى المقطع بإنه ( توفى في 28 سبتمبر) ."
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519052227/http://www.20at.com:80/ebn-balad/11958-2009-05-04-14-21-22.html"

