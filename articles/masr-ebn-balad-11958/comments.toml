text = "طبعا عصر محمد على باشا كان الافضل لانه قام بنهضه زراعيه باقامه القناطر الخيريه وانشاء الترع فى جميع انحاء مصر فلماذا لا نقوم الان بانشاء الترع فى الصحراء الغربيه والشرقيه التى تتعدى مساحتها 75% من مساحه مصر وخاصتا بعد ردم كثير من الترع فى الجيزه والقليوبيه ونتمنا ان نشاهد فى عصرنا هذا تقدما ولا نريد تقدم لانفسنا انما نريد مشاهده بلدنا هذا من افضل بلاد العالم لنفتخر بها؟؟؟؟؟؟؟؟"
