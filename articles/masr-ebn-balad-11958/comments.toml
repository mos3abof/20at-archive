text = "رغم ان فتره محمد على شهدت تقدم اقتصادى و عسكرى الا انها تراجعت فى مجال الحريات و العداله<br />الا انها ليست بالسوء بتاع ظلم و جبروت عبد الناصر<br />انا شايف ان محمد نجيب لو كان كمل كانت هتبقى احسن فتره فعلا لعقله و وطنيته<br />و طبعا فتره سيد سيد مرفوع فيها الشعار<br />ان لم تستطع ان تستفيد بضرر الاخرين فضر الكل لمجره المتعه"
