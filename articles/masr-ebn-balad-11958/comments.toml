posted = "2009-05-04"
text = "ولا بد من الوصول وان طال السفر ———————- كل نفس ذائقة الموت<br />ولن يوقف عزرائيل قوات الامن ولا الحرس الخاص ——— فاذا جاء اجلهم لا يستعجلون ساعة ولا يستاخرون<br />كلة مكتوب<br />وكل نفس بحساب<br />والكفن ليس لة جيوب<br />اما ان يتجاهل الانسان الموت فمصيبة<br />يحكى ان احد المواطنين اهدى احد الحكام العرب سلحفاة فلما سالة لماذا السلحفاة ؟ قال لة يا طويل العمر ان السلحفاة تعيش 400 سنة فرد الحاكم ضاحكا ادى احنا هنشوف ان كان كلامك كذب والا صدق<br />ادعوا لحكامنا بالهداية والتوفيق<br />ربنا يوفقهم ويبعد عنهم بطانة السوء"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519052227/http://www.20at.com:80/ebn-balad/11958-2009-05-04-14-21-22.html"

[[comments]]
