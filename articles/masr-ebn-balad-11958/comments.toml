posted = "2009-05-15"
text = "شعب من الغنم<br />الشعوب فى امراضها تصاب بامراض الغنم<br />حدثنا التاريخ انة عندما احتل هولاكو زعيم التتار بغذاد كان جنديا من التتار يتجول فى شوارع بغذاذ فوجد مجموعة من الناس واقفين فصرخ فيهم — لا تتحركوا من اماكنكم حتى اذهب واحضر سيفى واتى لاقتلكم هل تفهمون ؟ وذهب الجندى التترى الى معسكرة واحضر سيفة وعاد بعد ساعة فوجدهم واقفيت فى اماكنهم كما قال لهم لم يهرب منهم احدا وكانهم كانوا مقيدين فقتلهم بسيفة ومضى<br />ما اشبة اليوم بالبارحة<br />شعوب واقفة فى مكانها تنتظر الذبح ولا تهرب ولا تقاوم<br />شعوب مصابة بمرض الاغنام<br />شعوب ماتت من زمان يحكمها ميت او مومياء"
