subject = ""
author = "مزيكا"
posted = "2009-05-04"
text = "من العيب أن نسب حكام الدول العربية ونتهمهم بالخيانة والندالة وألفاظ تقلل من شأن قائلها، وتدل على جهله الشنيع بالتاريخ.<br />بدون عبد الناصر ما كان باستطاعة مصر::<br />إنشاء السد العالى<br />عودة قناة السويس لمصر والثروة الطائلة التى تديرها على البلاد<br />إعطاء أراضى للفلاحين بعد عصر السخرة<br />تحرير الدول العربية من براثن الاحتلال، والجزائر وليبيا خير مثال<br />وأمور كثيرة أخرى…<br />أما عصر الخديو إسماعيل، فالديون التى تحدث عنها أحد المعلقين هى ناتجة عن العهدين السابقين له ( عباس وسعيد)<br />فجميع كتاب التاريخ المصرى يؤكدون أن عهد إسماعيل استمراراً لعهد جده محمد على وليس تدهوراً."
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519052227/http://www.20at.com:80/ebn-balad/11958-2009-05-04-14-21-22.html"

