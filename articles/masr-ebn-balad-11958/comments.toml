text = "طبعا ثورة 23 يوليو قائمة على الندالة بقيادة المجرم جمال عبدالناصر<br />واول من مارسوا معه رذيلة الندالة الرجل الذي ساعدهم واستظلوا بظله وهو اللواء محمد نجيب<br />جمال عبدالناصر خزاه الله وبسببه تحول الشعب المصري الى اتعس شعوب الارض<br />ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />مش ححبك"
