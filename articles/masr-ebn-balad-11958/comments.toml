text = "الى العزيز زخارى<br />حكام مصر من الفراعنة معروفين<br />منهم الاسرات الليبية اى القادمين من ليبيا<br />او الاسرات الحبشية اى القادمون من الحبشة<br />او الغزاة الحيثيون الرعاة القادمين من شمال العراق<br />او البزينطيين اللى هم الاتراك<br />فترات ضئيلة جدا تعد بعشرات السنين حكم فيها المصريون انفسهم<br />اقرأ التاريخ يا زخارى"
