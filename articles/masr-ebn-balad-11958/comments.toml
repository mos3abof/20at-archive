subject = ""
author = "مخيمر السيد"
posted = "2009-05-05"
text = "حكم ضباشة<br />اغفلتم الرئيس ضبش فى الحكم والادارة - فهناك كتاب يدرس فى اقسام الادارة اسمة الضباشة والطناشة<br />فضبش شخصية شعبية مصرية تجدونة فى جميع الادارات بيوقف الامور ويعقد المسائل على الجمهور<br />اما الطناش فبيقول لك عدى علينا بكرة يا سيد - وعندة اقتناع سائد فى المصالح الحكومية ان اجدع مشكلة تحل بالطناش<br />فازمة الاسكان مثلا يتم تطنيشها فتحل شعبيا بالعشوائيات<br />وازمة المرور يتم تطنيشها فيموت كل يوم العشرات على الاسفلت<br />وهكذا وهكذا<br />فالرئيس ضبش موجود فى كل ادارة ومصلحة حكومية وشعارة هو الطناش هو الحل"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519052227/http://www.20at.com:80/ebn-balad/11958-2009-05-04-14-21-22.html"

