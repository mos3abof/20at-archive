[[comments]]
order = 24
subject = "لنكن اكثر موضوعية"
author = "ياريت كلنا احنا كمان نعمل شوراي هماهنكي نيروهاي إن"
posted = "2005-12-22"
text = "ياجماعة احنا ليه لازم لما نيجى نحكم على حد بنحكم على بمنتهى التحديد يعنى يا امانقبله كله يا اما نرفضه كلة وفيها ايه لو خدنا منه احسن ما فيه وتركنا اللى ما ينسبناش فيجب ان ناخذ ما ينفعنا حيثما نجده اولا\" انا اختلف مع الاستاذ الفاضل براء مع انى ماعرفوش على عنوان الموضوع فالراجل (نجاد ) لا فرق ولا زعزع ولا ساد ولا حاجة ثانيا\" : ليه احنا دايما\" مش مصدقين ان في حد ممكن يجرؤ على ان يتحدى امريكا واى حد يعمل كده حتى لو كان نيته سليمة نقول عليه بق وجعجاع مع ان معروف ان ايران دولة قويه اقتصاديا\" وعسكريا\" جدا وماهم حاجة ان اهلها شرسين جدا\" في الدفاع عنها احنا خوفنا ( احنا العرب يعنى ) من امريكا شىء مالوش اى داعى ولا مبرر فالقوة الامريكية خرافة مكتوب عليها صنع في الولايات المتحدة ( made in usa ) الامريكان منظمين وعارف هما عاوزين ايه وحطين خطط بيمشوا عليها لمدة 200 سنه جيه يعنى مثلا\" ملف دخول العراق محطوط في الادراج منذ 1970 وخلال الفترة دى قعدوا يعملوا افلام في هوليود كلها بتطلع البطل الامريكانى المدافع عن المثل والشجاع الذى لا يقهر والجيش الامريكانى الذى لا يقهر لانه بيستخدم اسلحة محدش يعرفها ولا سمع عنها وقعدوا يلعبوا على كده ويعمقوا الفكرة دى فى نفوسنا لحد ما صدقنا الكدبة لكن امريكا قويه باقتصادها مش بيجيشها لانهم جبنى ولاد 60* 70 اما بقى الاقتصاد الامريكى فلاسف( صنع في الخليج )استثمارات ببلاين الدولارات في امريكا وفوق ده كله كل الشرق الاوسط مستهلكين جيدين للمنتجات الامريكيه بمختلف انواعها يبقى ليه بقى ميعملوناش على اساس ان احنا زبائن ,, اما بالنسبة لنجادى فلو حتى كان فيه عيوب الدنيا كلها فميش ولا هايجى رئيس خالى من العيوب ولكنه عيوبه مقبولة (على الاقل احسن من ناس تانية ) اما ماتردد عن تصريحاته فانا مش شايف فيها حاجة غلط خالص اسرائيل فعلا\" لازم تتلغى من على الخريطة ومافيش حاجة اسمها محارق اليهود ودى دعاية كاذبة يبقى الراجل غلطان في ايه واى حد يقول دبلوماسية ومش عارف ايه اقوله انه ما سلب بالقوة لا يرد الا بالقوة م احنا بقالنا 30 سنه ماشين على الدبلوماسية خدنا ايه غير انهم هايتسلوا علينا دولة ورا دولة وبعدين الكيل بمكيالين دبلوماسيه؟ رجوع وعدم اصنياع اسرائيل لاى قرار دولى دبلوماسية؟ ولا موقف حازم يبقى ليه احنا كمان مناخدتش موقف حازم ولا خايف لو طلبنا بالحق يقولوا علينا ارهابين ما بقت موضة زى المنيى جيب اى حد يحاول ياخد حقه يبقى ارهابى واللى بيتعمل في فلسطين وفي العراق وغيره وغيره وغيره ( على رائى محمد صبحى في مسرحية الجوكر ابو خطوة وغير ابو خطوة وغيره وغيره ) ده مش اسمه ارهاب ياجماعة قصارالقول كلنا كده محتاجين شوراي هماهنكي نيروهاي إنقلاب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

