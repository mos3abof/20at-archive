[[comments]]
order = 47
subject = "أهل مكة أدرى بشعابها !"
author = "أحمد"
posted = "2006-01-04"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم جميعا اخوتي الكرام ورحمة الله وبركاته ,,<br />أولا أحيي الأخ الكريم كاتب المقال ..<br />ثانيا , وكرد على الاخوة الذين سئلوا عن الشيعة والصحابة .. يا اخوان اذا أردنا أن نعرف حقيقة الشيعة أو حقيقة السنة فعلينا أن لا نرجع لما يقوله السني المتعصب عن الشيعي , أو الشيعي المتعصب عن السني .. بل أن نرجع لما يقوله العلماء الكبار من كلا الفريقان عن مذهبه , ما يقوله العالم الشيعي الكبير عن مذهبه , وما يقوله العالم السني الكبير عن مذهبه , والا لكثرت الافتراءات من كلا الجانبان ولما وصلنا الى أي نتيجة اللهم الا المزيد من الكره والضغينة بين ابناء الدين الواحد ...<br />لأعرف عن نفسي , أنا شيعي .. ولدي خلفية بسيطة عن مذهبي ..<br />نحن لا نكفر صحابة رسول الله صلى الله عليه وآله وسلم .. بل نحترمهم ونجلهم , ولكن خلافنا مع اخواننا السنة هو أننا لا نعد الصحابة المصدر الرئيسي الذي نأخذ منه ديننا , بل نأخذه عن الامام علي بن أبي طالب لأننا نعتقد أنه هو الأفضل من بين الصحابة ولدينا العديد من الأدلة على ذلك من القرآن الكريم ومن السنة النبوية المطهرة .. وأنا لست هنا لأعمل ( دعاية ) لمذهبي , بل لأرد بعض الشبهات التي قيلت عن مذهبي ( الجعفري الاثناعشري ) ..<br />أما بالنسبة لمن يسب الصحابة أو غيرهم , فالرد عليه يكون من الامام علي بنفسه , وذلك حينما قال لأصحابه (( كرهت لكم أن تكونوا شتامين لعانين ... )) وذلك حينما كان يسير لقتال معاوية وأهل الشام وسمع بعض أصحابه يظهرون الشتم واللعن لمعاوية وأهل الشام فمنعهم من ذلك ..<br />هذا هو نهج الامام علي الذي يروي الشيعة والسنة أن رسول الله صلى الله عليه وآله وسلم قال فيه (( أنت مني بمنزلة هارون من موسى الا أنه لا نبي بعدي )) ..<br />أحب أن أنوه لمسألة تاريخية , وهي أنه كما أن هناك العديد من الأبطال السنيين التاريخيين الذين يحترمهم السنة والشيعة , فانه أيضا هناك ابطال تاريخيين شيعة يحترمهم كل من السنة والشيعة مثل الشاعر والبطل الذي حارب الروم وأسر عندهم وهو ابوفراس الحمداني وابن عمه الذي غزا الروم أربعين غزوة ! وهو سيف الدولة الحمداني أيضا أحد أكبر علماء النحو في تاريخنا الاسلامي وواضع علم العروض الخليل بن أحمد الفراهيدي وغيرهم كثير ...<br />أخيرا يا اخواني الكرام أدعوكم لقراءة الكتاب القيم \" المراجعات \" وهو عبارة عن مناظرات ورسائل غاية في اللطف بين فضيلة شيخ الأزهر الشيخ سليم البشري رحمه الله , وسماحة السيد شرف الدين رحمه الله , وسترون مدى الاحترام الكبير المتبادل بين العالمان الكبيران , سترون كيف يخاطب أحدهما الآخر ب ( يا شيخي -- يا سيدي .. ) سترون مدى التواضع ومدى الشفافية التي يتناقشان بها , كيف يستأذن كل منهما الآخر عند السؤال , وكيف يعتذر كل منهما للآخر عن أي تقصير .. وأخيرا ستستفيدون جدا من بحر المعلومات التي ستملأ أعينكم من خلال هذان العالمان الكبيران رحمهما الله .. أمل من كل قلبي أن يسود مثل هذا الاحترام بيننا جميعا شيعة وسنة ...<br />عذرا على الاطالة وعلى أي خطأ ...<br />والحمدلله رب العالمين والصلاة والسلام على أشرف الأنبياء والرسلين سيدنا ونبينا محمد وآله الطاهرين وصحبه المنتجبين ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

