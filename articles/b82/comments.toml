subject = "اخربيان يا امه الاسلام"
author = "المجاهد المصري"
posted = "2006-01-14"
text = "قال ابو بكر الصديق رضي الله عنه وارضاه ما تركت امه الجهاد حتي ضرب عليها الزل والخزي والعار صدقت يا صديق رسول الله تركنا الجهاد فضرب علينا الزل والخزي والعارتغتصب نساءنا وتنتهك حرماتنا والزل يلاحقنا حتي في اقواتنااتقوا يوا ترجعون فيه الي الله فلجهاد الجهاد خير وسيله لنا للقضاء علي اعداء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 89
subject = "فلنمنحه الفرصة كاملة"
author = "مصري مقيم بالسعودية"
posted = "2006-01-15"
text = "أشكر كل من تناول الموضوع بموضوعية وحياد<br />وأحب ان اعلق بأن نجاد هو شخص لايمثل نفسه ، وانما يمثل فكراً وعقيدة لدى الشعب الايراني ، فالخميني منذ اتى إلى ايران اعلن بوضوح موقفه من قضية فلسطين فأغلق السفارة الاسرائيلية وحولها لأول مرة على مستوى العالم العربي والاسلامي إلى سفارة لدولة فلسطين ..<br />كما انه سن سنة حسنة بتخصيص يوم للقدس ، حيث اختار الجمعة الأخيرة من شهر رمضان يوماً للتضامن مع الشعب الفلسطيني ..<br />كما فتح الباب للمناضلين الفلسطينيين بفتح مكاتب لهم داخل ايرات ..<br />واطلق شعاره المدوي (اسرائيل غدة سرطانية يجب أن تستأصل من الوجود) ..<br />كما أن الخميني ايضاً رفع شعار البراءة من المشركين في موسم الحج للتضامن مع الشعب الفلسطيني ليعلن الحجاج موقفهم من هذه الدولة اللقيطة ..<br />ونجاد من الواضح انه يسير على هذا النهج .. وتصريحاته لحد الآن ليست قشرية وإنما هي مصاغة بدقة ومصداقية ..<br />فالتصريح الأول تحدث عن محو اسرائيل من الوجود ، وهو شعار سابق للخميني ..<br />ثم صرح بعد ذلك بكذب مايشاع من تعرض اليهود للمحارق النازية .. ثم طالب الغرب على فرض صحة ما يشاع بأن يتحمل المسؤولية كاملة تجاه ماقاموا به ضد اليهود ..<br />ثم صرح من مكة المكرمة والمكان له خصوصيته المقصودة .. وقال على الغرب أن يخصص أرضاً لليهود في بلدانهم ليقيم اليهود عليها دولتهم ، لأن الغرب هم من هجروهم إلى فلسطين ..<br />ثم عاد وصرح من ايران بأن ايران على استعداد للمساعدة لإرجاع اليهود إلى أماكنهم الأصلية في الغرب وترك فلسطين للشعب الفلسطيني ..<br />من هذا كله أقول أن هذه التصريحات وضعت الغرب في مأزق .. فإذا كانوا يعتقدوا بصحة المحرقة فهم من نفذها وعليهم ان يقوموا هم بتعويض اليهود والاعتذار إليهم ..<br />ثانياً : إذا لم يعترفوا بذلك فإن قضية المحرقة تصبح كذبة ملفقة ساهموا مع الصهاينة بترويجها من اجل تبرير ما يقوموا به من تنكيل وقتل بالشعب الفلسطيني ..<br />أخيراً : الكلمة للشعب الأوروبي ليحكم على مظلومية اليهود أو جريمتهم هم بحق اليهود فليختاروا أحد الامرين ، وكلاهما مر .. لذلك أجد أن أحمدي نجاد ليس بظاهرة صوتية كما وصفه البعض .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 90
subject = "نجاد من الداخل"
author = "كمال من مصر"
posted = "2006-01-15"
text = "الأخ مصري تحية ليك موضوعك عجبني اوي ومعلوماتك جميلة وفعلا الراجل ظاهرة تستحق التأمل ومثل ما قلت لازم نعطي الراجل فرصة<br />انا عاوز اتكلم عن بعض اللي سمعته عن نجاد في داخل ايران من التلفزيون والصحف<br />1- الراجل ماقبلش ياخذ بيت مخصص ليه من بلدية طهران لما كان رئيس البلدية واكتفى ببيته المتواضع الى يومنا هذا.<br />1- قام بمنح راتبه عن منصب رئاسة بلدية طهران للفقراء . واكتفى براتبه عن محاظراته في الجامعة.<br />3-منع تعليق صوره او طبعها على ميزانية الدولة .<br />4- أمر بازالة السجاد الفاخر من المكاتب الرئاسية .<br />5- يمتلك سيارة من نوع بيجو موديل 77 ودائما يركب في تنقلاته قبل الرئاسة النقل العام وشوهد يركبها بعد الرئاسة .<br />6- ليس لديه حساب مصرفي وانما لديه حساب ينزل فيه الراتب الشهري فقط .<br />7- لم يستخدم الدعايات المعتادة في حملته الانتخابية واكتفى بترويج نفسه عن طريق المحاظرات والخطابات الشعبية .<br />8- ملابسه البسيطة التي لم تتغير حتى بعد توليه منصب الرئاسة .<br />اخيرا كان الشعار الذي روج من قبل انصاره في الدعاية الانتخابية كان:<br />( انا من جنس الناس )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 91
subject = "رد اول"
author = "السلام"
posted = "2006-01-15"
text = "في البداية ارغب بالقول باني قد قمت بقراءة المقال مصادفة و انا ابحث في الانترنت و قد اخذني الفضول على متابعة القراءة و الانتهاء بالتعليقات التي انتهى بها المقال و قد تفاجأت من ان هذه التعليقات قد ابتعدت عن المضمون الاساسي و هو الرأي في مدى مصداقية اوى مدى قدرة الرئيس احمدي نجاد على الوفاء بهذه المواقف التي ينادي بها الى حوار او لعله تقاذف في الهواء بين من هو على حق و من هو المتشدد السني ام الشيعي و لقد تفاجأت بالكلام القاسي و العبارات الجوفاء ضد الشيعة و التي اعتقد ان اصحابها لم يخرجوا بها هكذا من تلقاء انفسهم بل قد استمعوا لها من غيرهم كما هو الحال بالنسبة لبعض الاخوان الشيعة الذين يرددون عبارات جوفاء ضد بعض الاخوان السنة و ان كانوا في الاساس لا يدركون حجم و وزن هذه العبارات على مستوى التوافق الاسلامي بين المسلمين ان اكيد شيعية و هذا يبدو واضح في حملي على البعض منكم و ما ورد في بعض تعليقاتهم و لكن قبل كوني شيعية ان بحرينية عربية مسلمة و الى هذا يعود الانتماء الاولى بالنسبة لي و اجد في اقوالكم بعد و تناقض كبير بين الواقع الذي اعيشه فانا اعتبر المنطقة التي اسكن بها عالم عربي مسلم مصغر عن العالم العربي المسلم الكبير الذي نعيش فيه ففي هذه المنطقة تعيش مختلف الطوائف و الاعراق بشكل جميل فهناك من الطوائف الشيعة و السنة و الهندوس و المسيح و لدينا عدد كبير من العجم و الهنود و بعض الاخوة العراقيين و المصريين و اللبنانيين و كذلك هناك بعض الاقلية من الاخوة السودانيين والاردنيين و كذلك هناك اقلية صغيرة من الالمان و الفرنسيين و لم اشهد يوما خلافا وقع بين احد منهم لذا ارجومن ان تخرجوا من ما اقوا ان المشكلة ليست في انتماءاتنا بل في مدى توافقنا معها و مع غيرها من الانتماءات فكل شخص منا قد يكون معرض الا الاصطفاف في مجموعة من الانتماءات<br />و عذرا اذا كان هذا الكلام في غير محله الا انهذه اول محاولة لي في الرد<br />و شكرا على تحملي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

