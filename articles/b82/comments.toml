subject = "حماس كثير و نضج سياسي قليل"
author = "علي ياسين"
posted = "2006-01-14"
text = "رغم ما قله الرئيس الايراني الجديد \" نجاد \" من عبارات قوية أظهرت حماسة هذا الرجل لمواجهة الصعاب و مواجهة اعدائه ،و مثل هذه التصريحات يعجب بها كثيراً من الناس .. و لكن أقول كيف تظهر كل هذه الانتقادات الداخليه لبلاده و للدول الأخري و علي رئسها الولايات المتحده و اسرائيل و لم يمضي علي توليه هذا المنصب المفاجئ علي حد قول البعض وقت قليل ..و أقول ايضا نعم هذا ما كان يجب ان يكون من كثير من الدول العربية و لكن لا بد من الحنكة في التعامل مع الأمور أكثر من ذلك .. و كيف يقول انه لا يستشير أحد في قراراته ان دل هذا فانما يدل علي عدم النضج السياسي .."
archived = "2006-11-02"
