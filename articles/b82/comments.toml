[[comments]]
order = 75
subject = "أخي رعد عبودي"
author = "عبدالله"
posted = "2006-01-12"
text = "المية تكذب الغطاس ... ياما سمعنا شعارات كتيرة عن الخميني وأنه مفخرة للعالم الإسلامي وحكم الخميني سنين ولم نري منه أي فائدة وياما هدد أميريكا بكلام ببلاش فماذا فعل لأميريكا ... ولما قرأنا كتب الخميني وجدناه يقول كلاما ضد رسالة الرسول محمد ووجدناه يسمح بلمس الطفلة الرضيعة بشهوة من باب التمتع ... وراح ولم نستفد منه بشئ سوي الكلام والشعارات.<br />وطلع علينا صدام حسين وأخذ يسب ويهدد إسرائيل وأميريكا ووقفنا وصفقنا وهللنا وطلع اللي يقول صدام ده مفخرة للعالم العربي والإسلامي وبالآخر ترك صدام إسرائيل وتهجم علي بلد مسلم وهو الكويت ... وراح صدام ولم نستفد منه شيئا .<br />وجاءنا أخيرا أحمد نجادي وأخذ يهدد ويتوعد إسرائيل زيه زي غيره وبدأ البعض يصفق ويهلل له وقالوا هذا الرجل مفخرة للعالم الإسلامي ... وأنا أقول المية تكذب الغطاس ... وكفايانا عبط فإنسان يسب يكره صحابة الرسول ويكره زوجات الرسول فكيف سيوفقه الله تعالي ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

