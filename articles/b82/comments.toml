[[comments]]
order = 71
subject = "الديمقراطية تعلو"
author = "يوسف مصطفى"
posted = "2006-01-11"
text = "أيا كانت تصريحات الدكتور/ نجاد فلا يجب أن ننسى شيء فى غاية الأهمية ألا وهو أنه تقريبا الرئيس المسـلم الوحيد الذى يأتى إلى منصب الرئاسة بإنتخابات كاملة الشرعية و بإختيار حقيقى من الشعب الذى يمثله.... الشعب الإيرانى ، وهو الأمر الذى يجب أن يحترم فإيران من وجهة نظرى هى العدو الأول و الأخطر للغرب و خاصة الولايات المتحدة لهذا السبب و هو أنها الدولة الإسلامية الوحيدة التى تطبق الديمقراطية و بنجاح و هى بذلك تمثل خطر داهم على الغرب بأنها تعد نموذج لكل الشعوب الإسلامية التى تريد حقا تفعيل الديقراطية و هو الأمر الذى يهدم بالتبعية الإنصياع الأعمى و الإستسلام الكامل لكل ما هو غربى و أمريكى ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 72
subject = "كلام ببلاش مش هيخدعني"
author = "عبدالله"
posted = "2006-01-12"
text = "يا سلام علي التصريحات اللي ببلاش ... ياما سمعناها منذ أن جاء الخميني وبعدين إيه النتيجة؟ النتجية أن إيران تفتخر بمساعدتها لأمريكا اللي بتسميها إيران الشيطان الأكبر في قتل وسحق مسلمو أفغانستان ... إيران فخورة أنها ساعدت أميريكا في القضاء علي بلد إسلامي فقط لأن هذا البلد بلد من أهل السنة والجماعة ومش بلد شيعي.<br />يا سلام علي أحمد نجادي وتصريحاته اللي ببلاش وفاكر هناكل منها.<br />أي بلد ده اللي هينصره الله تعالي وهم يقولون إن الرسول قصر في أداء وأنا سامع واحد من علمائهم في إيران يقول عن النبي ما يلي :\" سامحك الله يا رسول الله أنت سبب بلبلة هذه الأمة لأنك لم توصي\" ... بالله عليكم هذا دين؟!!<br />هو كل واحد عايز يلعب علينا قام ورمي كلام ببلاش علي إسرائيل ورحنا نجري وراه ... مش صدام قال أكثر من الكلام ده علي اسرائيل وسحقه لأميريكا بعدين ساب إسرائيل وغزا الكويت ورجع صدام المصريين بتوابيت ...<br />واشمعني أحمد نجادي اللي مسموح له يقول هذا الكلام ؟ ليه الضوء الأخضر دايما مفتوح له هو ؟ عملت إيه لإيران لإسرائيل منذ عهد الثورة غير الكلام البلوشي ... وآخرتنا تفتخر بمساعدتها لأميريكا في القضاء علي بلد مسلم زي أفغانستان. طيب خلونا نتكلم بالحقائق : إيران فيها من 15 إلي 20 لإيراني مذهبهم سني هل سمعتم واحد منهم أصبح مسئولا في الحكومة أو صار ليه كلمة وهو في بلده ... لا .. طيب ليه ؟ لأنه مسلم سني وليس شيعي ... ده واحد إيراني سني يقول أن الحكومة الشيعية في إيران تقتل علماء السنة الإيرانيين وشفت بعيني الصور ... يا خويا بلا خيبة .. خليه يكون راجل ويرسل جيوشه اللي تعد بالملايين لمحاربة إسرائيل ... هو الكلام هينففع بإيه.<br />إيران كل همها سب صحابة النبي والإعتداء علي زوجات النبي ... ده كل همها ... قلوب سوداء كالفحم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 73
subject = "مع احترامي يا أخي يوسف مصطفى ليك"
author = "عبدالله"
posted = "2006-01-12"
text = "مع احترامي وتقديري ليك يا أستاذ يوسف ولكن بصراحة مفيش لا ديمقراطية في إيران فعلماء إيران ومراجعهم الشيعة هم اللي بحركوا الرأي العام فلو قال المراجع للشيعة انتخبوا نجادي وإلا راح تخونوا آل البيت راح كل الشيعة يختارون نجادي وهكذا ... المراجع هم اللي بختاروا الرئيس ويهددوا الشعب إذا لم تنتخبوا فلانا فإن آل البيت سيغضبوا عليكم ...<br />وإليك الدليل أخي يوسف : الشيعة في العراق في حرب ولم يهتموا في الإنتخابات فما كان من المرجع الشيعي السيستاني إلا وأصدر فتوي تناقلتها الصحف الشيعية في إيران أن الذي لا يصوت في الإنتخابات سوف يذهب ٌإلي النار فما كان من الشيعة إلا أنهم صوتوا خوفا من النار وطبعا اختاروا الذين اختارهم مراجعهم ... مفيش ديمقراطية ولو كان في ديمقراطية لوجدنا للإيرانيين السنة صوتا يسمع في إيران ولكنهم مواطنون درجة مليون تحت الصفر لأنهم مش شيعة مع أنهم مواطنيين إيرانيين وأعدادهم بالملايين ولكن لا كلمة لهم لأنهم مش شيعة... يبقي فين الديمقراطية ؟!<br />وتقبل احتراماتي : أخوك عبدالله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

