subject = "زوبعة في فنجان"
author = "مسلم"
posted = "2005-12-16"
text = "الشيعة ظاهرة صوتية ، ورئيسهم هذا خير مثال لذلك ، أما الواقع فهي نفعية برغماتية بعيدة عن المثل والاخلاق .<br />فياشباب الاسلام لاتغتروا باقوال هذا ، فلن<br />يعدوا الكلام الى الافعال.<br />وإن كنتم في شك مما أقول فانظروا الى موقفه من الاقليات في بلاده (وما ثورة الاهوازيين عنا ببعيد) وخاصة أهل السنة في ايران<br />وانظروا الى مواقفه من العراق وافغانستان<br />وكيف ساعدت بلاده الامريكان الكفرة في احتلال البلاد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 6
subject = "كلام فاضي"
author = "من اول حاكم ورئيس ايراني ونحن نسمع نفس الاسطوانه سنمسح اسرائيل من الخارطه و سندمر الشيطان الاكبر و و و.."
posted = "2005-12-16"
text = "وفي النهاية بيعزموا وفد اسرائيلي ويستضيفوه في طهران.. كلام فاضي..<br />هذا غير فضيحت ايران في شرائها الاسلحه من اسرائيل<br />وغير دعمها للامريكان بالعراق وافغانستان<br />فوقوا من احلامكم ومتصدقو اي كلام تسمعوه..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 7
subject = "معك حق يا مصباح وليس معك الحق يا مسلم"
author = "شرقاوي"
posted = "2005-12-16"
text = "لا احد ينكر أنه لا يوجد تطرف ديني شيعي في إيران بعكس البلاد السنية،<br />ولا أحد ينكر أن إيران دولة ديموقراطية،<br />ولا أحد ينكر أن أمريكا و أسرائيل هما الأعداء اللدد لإيران ،<br />و حتى لو كانت مجرد جعجعة فنحن العرب مفتقدينها."
