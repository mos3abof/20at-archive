subject = "هذا الشبل من ذاك الاسد"
author = "ابو احمد"
posted = "2006-01-14"
text = "نعم هو القائد الاسطورة الذي كنا نحلم بة انا كنت في ايران في ايام فوزة في الانتخابات لقد رائيتة شخصيا وهو يلقي خطابة الاول في الصحن الرضوي عند مرقد الامام الرضا(ع) ورائيت الحشود ملتفه حولة ورائيت تواضعة الكبير (انضرو الى ملابسة بل انضرو الى حذائةانه حذاء الفقراء ذو خيطان ينحني ليربطة عند خروجة من اي مكان<br />ولقد سمعت هذه الكلمات من امام جمعة الاهواز (عندما اقتربت امريكا من ايران اكثر انعم الله علينا بقائد مثل نزاد)<br />ومن قال ان نجاد لا يستشير احد فهو مخطىء انه يعتبر نفسه احد جنود السيد القائد علي الخمنائي...<br />وايران يوجد بها مجلس شوري لا يوجد مثلة حتى في امريكا نفسها التي تدعي الديمقراطية...<br />(ان الله متم نورة ولو كرة الكافرون)<br />تحياتي لكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

