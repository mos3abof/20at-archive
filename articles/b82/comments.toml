subject = "إلي الأخ أحمد دعدوش"
author = "عبدالله"
posted = "2006-01-14"
text = "سمعنا كتير أوي أوي أوي من تصريحات الخميني ضد إسرائيل وضد أميريكا وصفق الكثيرون لهذه التصريحات وسنين وسنين وسنين ... وآخرتها ما أخذنا من هذه التصريحات ... ولا حجاة مجرد كلمات يقولوها الخميني والبعض يصفق له .<br />والآن جاءنا أحمد نجادي بتصريحات وكلام وشعارات فكالعادة أخذ البعض يصفق ويسميه حامي الحمي وهو كله كلام في كلام في كلام وبكرة هنشوف إيه اللي هيعمله نجادي غير الكلام والمية تكذب الغطاس ... أحمد نجادي وبلده مشغولة في سب صحابة الرسول وسب زوجات الرسول لدرجة أن أحد علماء الشيعة يقول بأعلي صوته أن الله قال للرسول محمد لولا علي ابن أبي طالب ما خلقتك يا محمد .... ولقد سمعت هذا الكلام بأذني ولم يخالف هذا العالم الشيعي واحد من الشيعة ... إيه الكلام الفاضي إزاي هينتصر بلد يتكلم هكذا عن الرسول الكريم صلي الله عليه وآله وسلم ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

