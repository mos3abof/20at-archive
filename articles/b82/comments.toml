[[comments]]
order = 66
subject = "لماذا نروج لأمريكا"
author = "هشام"
posted = "2006-01-09"
text = "يبدو أن أمريكا تدفع جيداً لمن يكتب مثل هذا الكلام الذي هدفه الوحيت اسكات اي شيء ينطق اي شيء كما لا يجب عن أمريكا..!َ<br />صحيح الكلام مش مبين هدفه الحقيقي.. لكن كما يتضح لي أنك تتهجم على الرئيس الايراني الجديد..<br />أظن انك تفضل اسامة بن لادن أكثر منه .. ليش ؟<br />لأن بن لادني يعطي الذريعة لأمريكا في مهاجمة الدول العربية<br />أما هذا فهو لا يعطيها الذريعة التي تتمناها اكثر منهم..<br />لم يدمر العرب الا العملاء الاردنيين والكويتيين<br />لعنكم الله. وفضح أعمالكم<br />والله انكم اكثر خطراً على العرب من اليهود أنفسهم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

