[[comments]]
order = 9
subject = "إيران أكبر خديعة"
author = "محمد علي"
posted = "2005-12-17"
text = "لن أتطرق إلى العقيدة الشيعية التي تسب أصحاب رسول الله و أمهات المؤمنين<br />و لكن إيران بدأت تتلاعب الآن بمشاعرنا و حديثها عن إسرائيل في نفس الوقت الذي تقوم فيه بالتعاون مع أمريكا في العراق و ذبح أهل السنة بواسطة فيلق الغدر و ذبح العرب الأحواز في الأحواز لأنهم عرب على الرغم من أنهم شيعة مثلهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 10
subject = "بلاش طائفيه"
author = "حمدي"
posted = "2005-12-18"
text = "الاخوه اللي بيتكلموا عن العقيدة الشيعيه او المسلمين الشيعه عايز اقولهم ان الشيخ يوسف القرضاوي قال بالحرف الواحد<br />الخلاف بيننا وبين الاخوه الشيعه ليس خلافا علي اصل من اصول الدين اي ليس خلافا عقائديا بل خلاف في امور فرعيه والشيخ الغزالي قال كلام بنفس المعني<br />يعني انتم هتعرفوا اكتر من الشيوخ الكبار وانت بقيتوا كلكم علماء<br />ولا ده كلام اسيادكم من السلفيين التكفريين<br />اللي كفروا العالم كلها ماعدا اللي علي منهجهم وافكارهم المتخلفه الهمجيه<br />اما مواقفهم السياسيه فيكفي ان الثوره الاسلاميه لما قامت اغلقوا سفارة اسرائيل ووعملوها السفاره الفلسطينيه ودعموا كل الحركات القلسطينيه المجاهده واسالوا حماس والجهاد الاسلامي واسألوهم وشوفوا هبقولوا ايه<br />وطبعاحزب الله المجاهد الدي قدم المئات من المجاهدين الشهداء الشيعه ولا انت مش شايفنهم شهداء لانهم شيعه يمكن برده انت الواحد يتوقع من امثالكم اي شئ<br />اما حكاية انهم وقفوا مع الغزو الامريكي للعراق حاجه تضحك واالله العظيم ... ليه هي البوارج الامريكيه عدت من قناة السويس الايرانيه<br />ولا الطائرات الامريكيه انطلقت من المطارات السعوديه و لا الايرانيه<br />ولا القواعد العسكريه اللي موجوده في الحليج انتقلت لايران<br />وجنود الاحتلال الامريكي دخلوا من الحدود العربيه ولا الايرانيه<br />حسبي الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 11
subject = "أخي حمدي"
author = "محمد علي"
posted = "2005-12-18"
text = "لا أحد ينكر بطولات حزب الله في جنوب لبنان و أنهم قدموا شهداء<br />و لا أحد يمكنه الجزم بتكفير من يشهد أن لا إله إلا الله و أن محمدرسول الله مع أنهم يكفرون الصحابة و على رأسهم أبو بكر و عمر و عثمان و السيدة خديجة و حفص<br />و انالا أرى فرق بين المتسلفين التكفيريين و الملالي في إيران فكلاهما متطرف وتخريبي و اعلم أن صدام و القذافي رددا الشعر في فلسطين فهل نحترم هذين المخبولين؟ أم أنك يا أخي لم تعلم بما حدث في الجادريةو اليد الإيرانية المتورطة فيها؟ أم أنك لا تعلم بأمر قوات غدر التي شاركت الأمريكان في تدمير الفلوجةو إبادة أهل السنة؟<br />و اعلم يا أخي أنك لو سألت أي سيستاني عن رايه في الشيخ القرضاوي ( حفظه الله و ثبته على الحق) سيقول عنه تكفيري و وهابي !! و اسألهم عن رأيهم في الإخوان المسلمين سيقولون الإخوان الوهابيين<br />سؤال بسيط... لماذا لم يدعموا المقاومة الإسلامية العراقية الشريفة0 ولا تقول لي الزرقاوي...هذه الشخصية الهوليودية) أو على الأقل يصنعوا حزب الله آخر في العراق<br />نصيحة أخيرة ... شاهد قنوات الفرات و الفيحاء على النايل سات و تعلم ما معنى الطائفية و الشعوبيةو الإتهامات السخيفة بأن قتلة الحسين (عليه و أهل بيته سلام الله )هم أهل السنة و أن أهل السنة يحتفلون بقتل الحسين و يكرهون عليا ( كرم الله وجهه)<br />لماذا تستمر إيران حتى اليوم في احتلال جزر الإمارات؟<br />العلاقة العدائية بين الكيان الصهيوني و إيران علاقة مصالح متقاطعة و رغبات توسعية ليست أكثر واسأل صبحي الطفيلي الأمين العام السابق لحزب الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 12
subject = "حماس و الحهاد"
