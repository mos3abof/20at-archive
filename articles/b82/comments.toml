subject = "إلى حسن من المغرب"
author = "محمد علي"
posted = "2006-01-21"
text = "و توتة توتة خلصت الحدوتة<br />الله يكرمك بلاش كلام البنات المراهقات اللي بيدوروا على فتى الأحلام بتاعهم ده<br />الصهاينة يا محترم بنوا دولتهم على دمنا و أرضنا<br />الصهاينة يا محترم خرجوا من لبنان زي الكلاب تحت ضربات المجاهدين في حزب الله<br />الصهاينة يا محترم خرجوا من غزة و بإذن الله من بقية فلسطين بضربات المجاهدين الفلسطينيين<br />الصهاينة يا محترم خرجوا من مصر بضربات رمضان-أكتوبر و مدخلوش مصر تاني إلا من بعد أمثالك فتحوا لهم الباب<br />و لعنة الله على أتباع ابن أبي سلول"
