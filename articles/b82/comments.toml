subject = "خليكوا كل ما واحد يمشي يطبل تمشوا وراة"
author = "ابو نظارة"
posted = "2005-12-22"
text = "والله احنا شعوب عندها خلل عقلي ونستاهل اللي يجرالنا كل مايجي واحد فاكر ان الحكاية كلمتين هيقولهم والبهوات زي الاستاذ براء بيسقفوله نلبس احنا في الحيطة علي طول ، ودي لعبة قديمة عملها عبد الناصر وخدنا علي قفانا للصبح وعملها فينا صدام لامؤاخذة حسين وادية مفضوح فضيحة المطاهر يوم طلوعة علي المعاش واية \"لايف\" ياباشاوانا موافق لو رأي الغلبية في الصفحة ان الكلام دة ماشي يبقي ماشي بس بعد ما ايران ما تأخد علقة حلوة محدش يوقلي الاسلام في خطر فماذا انت فاعل ؟ لان الحج نجاد والاستاذ براء هما اللي هيودوا الدين والمسلمين في توكر<br />والسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 22
subject = "اين تقع توكر ؟"
author = "ابو نظارة"
posted = "2005-12-22"
text = "إلي كل اخواتي في الله الذين احبهم فيه واريد ان اهديهم إليه؟<br />اود ان اوضح ان توكر ليست منزلة في الجنة؟<br />توكر من الدول الاسلامية ؟<br />نعم<br />تقع توكر في الجزء الخرب من العالم ويحدها من الشمال اسيا ومن الجنوب افريقيا ومن الغرب المحيط الاطلسي ومن الشرق كعب الغزال يا متحني بدم الغزال<br />وهي تشتهر بإنتاج الفتاوي الشرعية والكسكسي والمهلبية ، ويبلغ عدد سكانها حوالي 40 مليون شهيد مات منهم 10 مليون فقط في الحرب بين المسلمين والمسيحين و10 مليون في الحرب بين اليهود والمسلمين و10 مليون في الحرب بين البوذيين والمسلمين اما ال 10 مليون الاخيرة لما كل الحروب حصلت ولا العرب ولا المسلمين خدوا حاجةفي الاخر مات 7 مليون منهم بالسكتة الدماغية والباقي راحوا مارينا يصيفوا هناك .<br />سفارة توكر في كافة ارجاء المعمورة<br />مرسوم عليها مصحف وسيفين ومكتوب تحتيهم واعدوا<br />فأعدوا نفسكوا علشاب عشرينات هينظم رحلة لتوكر<br />وتوكر علي خير<br />ابو نظارة بفرام جديد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

