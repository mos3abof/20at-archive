[[comments]]
order = 13
subject = "الي الاخ محمد علي"
author = "حمدي"
posted = "2005-12-19"
text = "الاخ/محمد<br />انا الذي اعرفه ان المنهج الجعفري الاثني العشري هو المنتشر في ايران وهو الاقل تطرفا من بين المدارس الشيعيه التي وجدت علي مر المراحل التاريخيه ... وكان يدرس في الازهر الي وقت ليس بالبعيد<br />وانا لن اخوض في مسالة مقولاتهم في الصحابه وعصر الفتنه لانها مسائل شائكة يجب تركها للعلماء ولايتطرق اليهاالعوام و لانني بصراحه لا اصدق كثيرا من الكلام الذي ينسب للشيعه<br />لكن هناك تطرفا موجودا بالتاكيد علي الطرقين لكن هناك حقائق لا ينبغي تجاهلهاخلقت هذا التطرف<br />الظلم والاستبداد يخلقان التطرف **********<br />هل تلوم بعض العراقيين الشيعه اذا تطرفوا في مواقفهم وقد تعرضوا للاضطهاد لعقود من الزمن علي يد صدام وزبانيته ...... ماذا تتوقه ممن فقد عائلته او انتهكت كرامته و اغتصبت زوجته او اخته وسط صمت عربي يصل الي حد المباركه<br />اما كلامك عن الافعال المنسوبه الي فيلق بدر فلمادا تصدقها بسهوله بينما لا تصدق بوجود الزرقاوي ؟<br />وذا افترضنا جدلا صحتها فان منظمة بدر ليست كل الشيعه وهناك السيد مقتدي الصدر وجيش المهدي الذي قدم التضحيات ومازال موقفه صلبا وعنيدا مع الاحتلال<br />ولمادا في لبنان استمع الي السيد صبحي الطفيلي ولا استمع الي السيد حسن نصر الله الذي قدم ابنه شهيدا<br />*** اما مسالة جزر الامارات فالخلافات الحدوديه موجوده بين كل الدول العربيه<br />وبمناسبة القنوات الفضائيه ::: ياريت كده تعقد مقارنه بين القنوات للمموله سعوديا وبين القنوات الايرانيه<br />وتشوف الفرق في احترام عقلية المشاهد *** وياتري الاباحيه والانحلال جاي من قنوات سعوديه ولا ايرانيه<br />وياتري مين المنافق--- الي اعلامه بيتفق مع المهج اللي بيدعو ليه -- ولا الي لايسمح الابرؤيه واحده في اعلامه وما يعرفش في الحريه الا حرية الفيديو كليب .............<br />اللهم وحد المسلمين وجنبهم الفتن يارب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 14
subject = "آمين آمين آمين"
author = "محمد علي"
posted = "2005-12-19"
text = "اللهم وحد صفوف المسلمين و اجعلهم يتعاونون على البر و التقوى لا على الإتم و العدوان<br />كلمات نجاد أصابت كبد الحقيقة حتى لو كانت صادرة للإستهلاك المحلي و السياسي... و أنا لا ألومك في انبهارك بالنموذج الإيراني لعظم الفارق بين صناع القرار الإيراني و أقزام القرار العربي (أنا كانت من أحلامي أن أعيش في أرض إيران الثورة يوما ما... و لكن بعد الحرب على العراق سقط هذا الصنم الفارسي كما سقط الصنم الصدامي) و لكن كل معلوماتي عن التعاون الإيراني الأمريكي في العراق أستقيهامن محطات التلفزة الإيرانية و العراقية المدعومة إيرانياو مواقعهم على الشبكةالدولية<br />\" لولا الدعم الإيراني لسقطت أمريكا في مستنقعات العراق و أفغانستان \" هاشمي رافسنجاني<br />إن مصطلحات مثل الوهابية و النواصب لم يعرفها العراقيون سنة و شيعة إلا بعد دخول آل الحكيم إلى أرض العراق قادما من بلاد فارس و كما سمعت من أحد أصدقائي الأحوازيين الشيعة : إن الفرس يعانون من روح تعالي عنصرية لا تقل عن العنصرية البيضاء في أوروبا إلا أن الفرس غلفوها بحب آل البيت... و بهذه الفرية يقتلون العرب الأحوازيين و يهجرونهم مع أنهم يشتركون معهم في المذهب الإثناعشري لا لشيء إلا لأنهم عرب متمسكون بلسانهم العربي و زيهم العربي<br />المشكلة ليست أن الإيرانيين شيعة فهناك من الشيعة الشرفاء في العراق و لبنان أمثال مقتدى و الخالصي و نصر الله و لو أنك متابع للأمر العراقي من بدايته لوجدت تمعضا من جانب الخالصي و مقتدى من ناحية التدخل الإيراني في العراق العربي<br />لا فرق بين العنصرية التركية المغلفة بالإسلام في أواخر الدولة العثمانية و هو ما عجل بزوالهاو العنصرية الفارسية المغلفة بالإسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 15
subject = "رد علي الاخ محمد"
author = "حمدي"
posted = "2005-12-19"
text = "اخي العزيز محمد .....<br />* تخيل معي لوان مسلما شيعيا قال .... ان الطغاه القذافي وصدام قتلوا شعوبهم وانهم يمثلون طغيان اهل السنه وان هذا الاستبداد ليس غريبا علي اهل السنه الذين ساندوا معاويه الذي الذي استبد بالحكم ووقفوا ضد الحسين الذي اراد لهم الحريه والكرامه ( رضي الله عنهما)<br />****اتأمل معي اخي العزيز اين الحق والباطل في هذه الجمله؟؟؟؟؟؟؟؟<br />اظنك تتفق معي ان هذه الجمله فيها من المغالطات اكثر من الحقائق-- انها نوع من الباس الحق بالباطل والتدليس علي الناس<br />--- وبصراحه هدا ما يحدث عندما ينعكس الوضع ويتحدث السنه عن الشيعه وخير مثال علي ذلك منتديات الساحه السياسيه في موقع الساحه<br />• من حقك مثلا ان تتهم الجلبي او غيره بالعماله لكن ليس من حقك ان تلبس الموضوع صبغة دينيه طائفيه وتقول انه يمثل الشيعه وان هذا يمثل فكر الشيعه ومنهجهم<br />• انه نوع من استدعاء النزعه الطائفيه بدون داع وفيما يخدم اعداء الامه ويبعدها عن اهدافها ويشتت قواها<br />• من حقك ان تنتقد الايرانين وان تتهمهم بالعنصريه ولكن ليس من الحكمه ان تربط الموضوع بكونهم من الشيعه<br />• لماذا تصبح اخطاء المسلمين السنه اخطاء حكام فقط وافراد او حكومات لكن عندما يخطأ الشيعه يصبح ذلك لانهم شيعه ولان العيب في منهجهم<br />• لماذا نستدعي من التاريخ والفقه الاسلامي ما يخلق الفرقه والشقاق ولا نستدعي ما يعزز الوحدة والاتفاق<br />• سبحانك للهم وبحمدك نستغفرك ونتوب اليك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 16
subject = "كلمة أخيرة"
author = "محمد علي"
posted = "2005-12-19"
text = "أولا أنا سعيد بهذه المناقشة التي أحسبها بإذن الله راقية و محترمة مع الأخ حمدي ( جمعنا الله على البر دائما)<br />بالفعل أسلوب التعميم ضعيف و خائب و ليته يختفي من عقولنا ( مع أني لم أستخدمه يا حمدي!! )و أصارحكم بأني أتمنى أن يعيش السنة و الشيعة في وفاق متعالين على هذه الخلافات فكيف لنا نحن المسلمين نعيش مع النصارى و غير المسلمين في ود و وئام وهم يختلفون معنا في ذات الله ولا يحدث نفس الشيء بين السنة و الشيعة و خلافهم دون ذلك؟ و إن كنت أعترف إني لا أتحمل كلامهم القاسي و الغير مبرر في حق أصحاب رسول الله (صلى الله عليه و آله و صحبه و سلم )<br />ياليت لو أن هناك أخ أو أخت من الشيعة يقرأون هذه الصفجة يمدون لنا يد العون عن صدق و نية صالحة لنعيد ترتيب بيتنا الإسلامي و لا نجعل فتنة حدثت منذ 1400 عام تعكر حياتنا اليوم... نريد تعايش حقيقي لا حلولا مسكنة و مؤقتة و مجرد ابتسامات و كلام حلو امام الكاميرات<br />اللهم تقبل منا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

