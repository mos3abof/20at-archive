[[comments]]
order = 77
subject = "سلام قولا من رب رحيم"
author = "الجزائري"
posted = "2006-01-13"
text = "السلام عليكم ورحمة الله اما بعد ان المتصفح لتاريخ اليهود او امريكا يلاحظ ان كليهما لم يقدما للعالم باسره والمسلمين خاصة ما يحمدان عليه وبالتالي لا حاجة لنا بمعرفتهما. ليس دلك جهلا بهما لكن معرفتنا لهما تفوق معرفة اي امم اخري لاننا نحن المسلمين الاكثر استهدافا . لكن المشكل المطروح ليس مدي جدية تصريحات نجاد او مدي اقتناعنا بهاانما المشكلة ما هي الطريقة المثلي لتوحيد صفوف المسلمين لنصرة الاسلام والتصدي للعدو اللدود امربكاواليهود باستثناء الثرثرة .واخيرا سلام قولا من رب رحيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 78
subject = "لعلكم تستيقضون"
author = "الجزائري"
posted = "2006-01-13"
text = "السلام عليكم اما بععد اقدم لكم قصيدة المهرولون . الى كل من يعبد امريكا لعله يستيقض ويعبد الواحد الأحد لا اله الا هو سبحانه عما يصفون/سقطت آخر جدران الحياء.<br />و فرحنا.. و رقصنا..<br />و تباركنا بتوقيع سلام الجبناء<br />لم يعد يرعبنا شيئ..<br />و لا يخجلنا شيئ..<br />فقد يبست فينا عروق الكبرياء…<br />-2-<br />سقطت..للمرة الخمسين عذريتنا..<br />دون أن نهتز.. أو نصرخ..<br />أو يرعبنا مرأى الدماء..<br />و دخلنا في زمان الهرولة..<br />و و قفنا بالطوابير, كأغنام أمام المقصلة.<br />و ركضنا.. و لهثنا..<br />و تسابقنا لتقبيل حذاء القتلة..<br />-3-<br />جوعوا أطفالنا خمسين عاما.<br />و رموا في آخر الصوم إلينا..<br />بصلة...<br />-4-<br />سقطت غرناطة<br />-للمرة الخمسين- من أيدي العرب.<br />سقط التاريخ من أيدي العرب.<br />سقطت أعمدة الروح, و أفخاذ القبيلة.<br />سقطت كل مواويل البطولة.<br />سقطت كل مواويل البطولة.<br />سقطت إشبيلة.<br />سقطت أنطاكيه..<br />سقطت حطين من غير قتال..<br />سقطت عمورية..<br />سقطت مريم في أيدي الميليشيات<br />فما من رجل ينقذ الرمز السماوي<br />و لا ثم رجولة...<br />-5-<br />سقطت آخر محظياتنا<br />في يد الروم, فعن ماذا ندافع؟<br />لم يعد في قصرنا جارية واحدة<br />تصنع القهوة و الجنس..<br />فعن ماذا ندافع؟؟<br />-6-<br />لم يعد في يدنا أندلس واحدة نملكها..<br />سرقوا الابواب, و الحيطان, و الزوجات, و الأولاد,<br />و الزيتون, و الزيت, و أحجار الشوارع.<br />سرقوا عيسى بن مريم<br />و هو ما زال رضيعا..<br />سرقوا عيسى بن مريم<br />و هو ما زال رضيعا..<br />سرقوا ذاكرة الليمون..<br />و المشمش.. و النعناع منا..<br />و قناديل الجوامع...<br />-7-<br />تركوا علبة سردين بأيدينا<br />تسمى (غزة)..<br />عظمة يابسة تدعى (أريحا)..<br />فندقا يدعى فلسطين..<br />بلا سقف لا أعمدة..<br />تركنا جسدا دون عظام<br />و يدا دون أصابع...<br />-8-<br />لم يعد ثمة أطلال لكي نبكي عليها.<br />كيف تبكي أمة<br />أخذوا منها المدامع؟؟<br />-9-<br />بعد هذا الغزل السري في أوسلو<br />خرجنا عاقرين..<br />وهبونا وطنا أصغر من حبة قمح..<br />وطنا نبلعه من غير ماء<br />كحبوب الأسبرين!!..<br />-10-<br />بعد خمسين سنة..<br />نجلس الآن, على الأرض الخراب..<br />ما لنا مأوى<br />كآلاف الكلاب!!.<br />-11-<br />بعد خمسين سنة<br />ما وجدنا وطنا نسكنه إلا السراب..<br />ليس صلحا, ذلك الصلح الذي أدخل كالخنجر فينا..<br />إنه فعل إغتصاب!!..<br />-12-<br />ما تفيد الهرولة؟<br />ما تفيد الهرولة؟<br />عندما يبقى ضمير الشعب حيا<br />كفتيل القنبلة..<br />لن تساوي كل توقيعات أوسلو..<br />خردلة!!..<br />-13-<br />كم حلمنا بسلام أخضر..<br />و هلال أبيض..<br />و ببحر أزق.. و قوع مرسلة..<br />و وجدنا فجأة أنفسنا.. في مزبلة!!.<br />-14-<br />من ترى يسألهم عن سلام الجبناء؟<br />لا سلام الأقوياء القادرين.<br />من ترى يسألهم عن سلام البيع بالتقسيط..<br />و التأجير بالتقسيط.. و الصفقات..و التجار و المستثمرين؟.<br />من ترى يسألهم عن سلام الميتين؟<br />أسكتوا الشارع.. و اغتالوا جميع الأسئلة..<br />و جميع السائلين...<br />-15-<br />... و تزوجنا بلا حب..<br />من الأنثى التي ذات يوم أكلت أولادنا..<br />مضغت أكبادنا..<br />و أخذناها إلى شهر العسل..<br />و سكرنا.. و رقصنا..<br />و استعدنا كل ما نحفظ من شعر الغزل..<br />ثم أنجبنا, لسوء الحظ, أولاد معاقين<br />لهم شكل الضفادع..<br />و تشردنا على أرصفة الحزن,<br />فلا نم بلد نحضنه..<br />أو من ولد!!<br />-16-<br />لم يكن في العرس رقص عربي.<br />أو طعام عربي.<br />أو غناء عربي.<br />أو حياء عربي.<br />فاقد غاب عن الزة أولاد البلد..<br />-17-<br />كان نصف المهر بالدولار..<br />كان الخاتم الماسي بالدولار..<br />كانت أجرة المأذون بالدولار..<br />و الكعكة كانت هبة من أمريكا..<br />و غطاء العرس, و الأزهار, و الشمع,<br />و موسيقى المارينز..<br />كلها قد صنعت في أمريكا!!.<br />-18-<br />و انتهى العرس..<br />و لم تحضر فلسطين الفرح.<br />بل رأت صورتها مبثوثة عبر كل الأقنية..<br />و رأت دمعتها تعبر أمواج المحيط..<br />نحو شيكاغو.. و جيرسي..و ميامي..<br />و هي مثل الطائر المذبوح تصرخ:<br />ليس هذا الثوب ثوبي..<br />ليس هذا العار عاري..<br />أبدا..يا أمريكا..<br />أبدا..يا أمريكا..<br />أبدا..يا أمريكا.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 79
subject = "بعد التخاذل العربي.."
author = "أحمد دعدوش"
posted = "2006-01-13"
text = "عزيزي الكاتب:<br />هذا المقال سبق أن نشرته في الليلة نفسها التي أطلق فيها نجاد تصريحاته الأخيرة، وتنبأت فيها بخروج مثل هذه الكتابات، وكانت تنبؤاتي في مكانها:<br />بعد التخاذل العربي.. هل يفعلها نجاد؟<br />على خطى رئيس الوزراء الماليزي السابق محاضر محمد الذي فعلها قبل انتهاء ولايته ببضعة أيام، يمضي الرئيس الإيراني الجديد محمود أحمدي نجاد في خطوة أكثر جرأة، ليعبر بكل صراحة عن كل ما يجول في خاطره حول دولة الكيان الصهيوني، ضاربا بعرض الحائط الاحتلال الأمريكي لجاره الغربي، ومعلنا صحة التنبؤات المتشككة في نوايا التيار المحافظ الذي عاد للتو إلى الواجهة.<br />تصريحات نجاد الأخيرة أعادت إلى ذاكرة المواطن العربي المقموع بعضا من ذكريات الصمود التي أكل عليها الزمان وشرب، خصوصا وأن الخطط الاستراتيجية العربية لم تعد تكتفي بالصمت والاستسلام، بل أثمرت سياساتها الحكيمة بالسعي لاسترضاء أكثر الحكومات الصهيونية تطرفا، والتي أتبعت مجازرها في صبرا وشاتيلا بمجزرة جنين كوسام شرف تذكاري على صدر الانتفاضة، ثم ثنّت بقتل أحمد ياسين وعبد العزيز الرنتيسي وياسر عرفات، لتؤكد للعرب جميعا أنها لا تعترف بأية خطوط حمراء تتشدق بها دبلوماسية الحكماء.<br />بالأمس أعرب نجاد عن حلمه بمحو إسرائيل من الخارطة، فهب العالم أجمع في مسرحية لم تعد تضحك أحدا حتى المتسكعين على أرصفة نيويورك ومونتريال، واليوم يشكك علناً بالهولوكوست الذي يجب على كل آدمي الإيمان بحقيقته كي تكتب له الحياة، ثم يدعو ألمانيا والنمسا اللتان صدّرتا حثالة العالم إلى أرض المسلمين لإعادة احتوائهم في بلادهم الديمقراطية.<br />لم تمض إلا ساعات قليلة حتى خرج رؤساء الغرب ليرغوا ويزبدوا، وليصرح كوفي أنان بصدمته مذكراً بقرار الأمم المتحدة بعدم المساس بأكذوبة المحرقة، وليعلن البرادعي أن صبر الوكالة الدولية للطاقة الذرية قد نفد أمام استهتار إيران، ثم تتوالى تصريحات شيراك وميركل وبيرلسكوني وشالوم والناطق باسم البيت الأبيض، ليعبروا جميعا عن الاستياء الكبير أمام هذه التصريحات غير المقبولة، والتي ستزيد من عزلة إيران وعدم تمكنها من \"دخول\" المجتمع الدولي، على اعتبار أنها تعيش خارجه! اللهم إلا إذا فهمنا المجتمع الدولي على أنه اختزال للمجتمع الإنساني في العالم الغربي الذي لا يشكل أكثر من 20% من سكان العالم!<br />ليت شعري بماذا يتهامس دهاة العرب في هذه اللحظة وهم يتقلبون على عروشهم؟ وبماذا يفكر عرّاب \"إسراطين\" الذي نادى جهرا بأمثال هذه الأقوال قبل أن يرفع الراية البيضاء؟ وبماذا سيرد فطاحل عملية السلام اللاهثون لتطبيق خارطة الطريق عندما يسابقهم نجاد إلى عدم الاعتراف بالكيان الذي يسعون لاسترضائه والتفاوض معه؟<br />أغلب الظن أن تبدأ التصريحات العربية من صباح الغد لتندد بهذا المارق الخطير، وأن ينبش أعلام الصحافة الأفذاذ تاريخ إيران العدواني، وأن يستنجد الطابور الإيراني الخامس بجزمة العم سام علها تطأ رؤوساً قد أينعت وحان قطافها.<br />سيدي نجاد، لا تنتظر منا شيئا، فنحن مشغولون حالياً بإعدام صدام في محاكمنا الديمقراطية المحتلة، وبقمع الناخبين المصريين في شوارعنا الإصلاحية، وبتراشق التهم السورية اللبنانية، فابحث لك عن مخرج يؤمن لك ولشعبك السلامة، لأن ساعة المهدي المنتظر لم تحن بعد!"
archived = "2006-11-02"
