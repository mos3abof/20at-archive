[[comments]]
order = 35
subject = "رد على الأخ محمد علي"
author = "حيدر"
posted = "2005-12-27"
text = "السلام عليكم.. أخ محمد<br />السياسة المنافقة هي السياسة التي تتبعها معظم الدول العربية امام القضية رقم واحد للأمة العربية والتي هي السرطان الذي ينهش في جسم الأمة العربية... تحت العرب التهينا وللأسف بالثرثرة وتصدى اخواننا في فلسطين ولبنان ويساندهم المد والعون من المؤمنين الحقيقيين في جمهورية ايران وتج هذا المد بالانتصارات التي بدت اظهر يوما بعد يوم ابتداءً بتحرير الجنوب والاتسحاب الاسرائيلي... واما ما تسميه بـ ((فيلق ....)) فللأسف نحن نقيم بسماع الفضائيات المأجورة التي تحاول تفتيت الدين الاسلامي الحنيف وتفتيت الوحدة في العراق وهي استمرارا للخد الذي بدأت به أميركا....."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 36
subject = "أخ حيدر"
author = "محمد علي"
posted = "2005-12-27"
text = "أنا لم أبرئ يوما العرب من تخاذلهم تجاه قضايا المسلمين و كلامي واضح<br />و لكن هذا لا يبرئ ساحة إيران مما فعلته بالعراق... يعني كلهم سعوديون و علمانيون و صفويون في سلة مهملات واحدة بالنسبة لي<br />أما جرائم فيلق الغدر الشعوبي الفارسي فأنصحك يا أخي بقراءة تقرير الديلي نيوز عن وزارة الداخلية العراقية و كان التقرير قد صدر قبل أيام من فضيحة الجادرية...و يكفي موقف الصولاغ عند افتضاحه... ولا تطلب مني أن أصدق هذا الأراجوز الشعوبي و لا أجد نفسي مبالغا إن وصفته بالصدامي الصفوي<br />أخ حيدر...<br />انا مسلم \"سني\" و لكني أتبرأ من موقف الحكام العرب الأقزام المحسوبين على السنة و من موقف الحزب الإسلامي العراقي في العراق<br />فكن يا أخي عادلا لا تتعصب لشخص لمجرد انتماؤه لنفس المذهب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

