[[comments]]
order = 26
subject = "خلاصة كلامي"
author = "حمدي"
posted = "2005-12-22"
text = "ستجد في العالم العربي والاسلامي ثلاث فرق<br />ا- مسلمون وعلماء من السنه يرون ان الشيعه علي باطل ويرون انهم اما فاسقين او كافرين<br />2- مسلمون وعلماء من الشيعه يرون ان اهل السنه علي باطل ويرون انهم اما فاسقين او كافرين<br />3- مسلمون وعلماء من اهل السنه والشيعه يرون ان الخلاف بين السنه والشيعه ليس خلافا عقائديا يخرج احد الطرفين من الدين<br />وان ما يجتمعون عليه اكثر بكثير مما يختلفون عليه<br />ومن امثال هؤلاء من علماء السنه الشيخين الفاضليين الشيخ يوسف القرضاوي والشيخ محمد الغزالي<br />ومن علماء الشيعه الشيخ الفاضل محمد حسين فضل الله<br />..... وانت من حقك انت تختار اي من هذه الفرق لتتبع منهجهم وتتحمل مسئولية اختيارك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 27
subject = "اعتصموا بحبل الله جميعا ولا تفرقوا"
author = "مى عبدالهادى"
posted = "2005-12-23"
text = "ولماذا ننتقد بعضنا بهذه القسوة وكأننا أعداء ولسنا اخوة فى الدين ولماذا نتصيد لبعض الأخطاء ونشن حرب شنعاء ضد بعضنا سواء كان من نختلف معه سنى أم شيعى فهو فى النهايةمسلم والله وحده من يحاسب وهو وحده العالم بذات الصدور ولايجوز لمسلم عاقل أن يساعد فىانقسام المسلمين الى طوائف وخصوصا فى الوقت الراهن وهناك عدو حقيقى يعمل الآن فى الخفاء وسيظر فى الوقت المناسب بشكل أوضح فأرجوكم يا أخوتى فى الله (لا تفرقوا لا تفرقوا لا تفرقوا)وأتمنى أن نركز جهودنا فى تطوير أنفسنا وتقوية صفوفنا وتنمية بلادنا حتى يحترم المجتمع الدولى كلامنا ولا تهضم حقوقنا بمنتهى البساطةونحن لانفعل شىء سوى التراشق بالإتهامات الجوفاء والعمالةمع أمريكا وإسرائيل,\"ثبتكم الله وأنار بصائركم\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

