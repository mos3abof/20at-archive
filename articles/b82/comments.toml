text = "أما الحركات الإسلامية المجاهدة في فلسطين فكان الله في عونها بعد غدر الأنظمة العربية بها و لا ألومهم فيما يفعلون<br />يا مقلب القلوب ثبت قلوبنا على دينك و قنا الفتن ما ظهر منهل و ما بطن"
archived = "2006-11-02"
