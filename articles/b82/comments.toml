author = "محمد علي"
posted = "2005-12-24"
text = "أما إخواننا الشيعة فأنا لي فقط عتاب واحد عليهم و هو تحقيرهم لأصحاب رسول الله و أمهات المؤمنين ( رضوان الله عليهم ) و خاصة الخلفاء الثلاثة الأوائل و السيدة عائشة و السيدة حفص<br />أما إيران فأنا أعارض سياستها ... فسياستها القوية في فلسطين و لبنان جعلت جموع المسلمين يحبون إيران و ينظرون إليها بإجلال و أمل<br />و لكن للأسف اتبعت سياسة أخرى منافقة في العراق و أفغانستان و الأحواز و خاصة في العراق حيث تقوم ميليشياتها بكل ما هو سافل ضد العرب عامة ( و نذكر ما حدث من جانب قيلق الغدر ضد الزعيم العربي مقتدى الصدر ) و ضد أهل السنة خاصة ( و نذكر ما حدث في الحادرية و الفلوجة و بمعاونة القوات الصليبية الأمريكية )<br />صدقوني ... على الرغم من أنه لا يوجد شيعة هنا في مصر إلا إني أتمنى أن يعيش المسلمون سنة و شيعة في ود وئام تماما كما يعيش المسلمون مع غير المسلمين بلا مشاكل تذكر<br />اللهم وحد صفوفنا و كلمتنا و أرنا الحق خقا و ارزقنا اتباعه و أرنا الباطل باطلا و أرزقنا اجتنابه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

