subject = "هذه هي عقيدتنا في الصحب الكرام و الآل الأطهار"
author = "مسلم سني"
posted = "2005-12-27"
text = "قال أبو بكر الصديق ( رضي الله عنه ):<br />أكرموا محمدا في أهل بيته<br />و كان ( رضوان الله عليه ) عندما يذهب لزيارة أخيه علي بن أبي طالب ( كرم الله وجهه ) و زوجته الزهراء فاطمة ( عليها السلام )- كان يداعب الحسن ( عليه السلام ) قائلا : حسن شبيه بالنبي ... لا شبيه بعلي<br />و كان علي و فاطمة ( عليهما سلام الله ) يضحكان<br />هذه هي العلاقة بين أصحاب رسول الله و أهل بيته كما أؤمن بها في عقيدتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 34
subject = "رد على ابو ((زوبعة في فنجان))"
author = "حيدر سادر"
posted = "2005-12-27"
text = "تتكلم على موقف ايران من احتلال العراق...قبل ذلك انظر الى موقف بلدك الذي قد يكون ساهم بشكل فاعل في ذيح العراقيين بعد الحرب.... امريكا رحمة ونقمة... رحمة لإزاحتها فرعون العصر والطاغوت الذي جثم على صدور العراقيين الوطنيين والمخلصيين لبلدهم وحتى غير ذلك ونقمة بما تحاول زرعه في بلدي العزيز وكانت حرب ظالم مع ظالم فالجلوس اولى"
