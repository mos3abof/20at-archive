text = "اتمنى ان ياتي حاكم عربي مثلك يارب ارزق العرب بحاكم شرات نجاد واديم حكم نجاد مائة عام بس اطلب منك شئ واحد فقط تشوف حل مع دولة الامارت العربية المتحدة وترجع لها جزرها لان دولة ايران ليست بحاجة لتلك الجزر وهى اغنى واكبرمن التمسك بتلك الجزر دون سبب وان كان هناك سبب نامل التصريح به علنا حتى يتم التعرف عليه وايجاد حله لهذه المشلكة التي بقائها دون حل تزعز المنطقة وتجعلها غير مستقرها فهذه نصيحة لك يا شيخ الايرانين الحقيقي وصاحب الشجاعة القوية التي لا تقهر انك نعم نشمي وابن اصول يعتنز بك شعبك"
