[[comments]]
order = 83
subject = "ليتنا نتعلم"
author = "حسام"
posted = "2006-01-14"
text = "بسم اللة الرحمن الرحيم الاخوة الاعزاء شكرا اولا للاهتمام بالامر لكن نحن انتقلنا من الموضوع الاساسى الى الطافية فباللة عليكم ام تفرحو لو هاجمت اى دولة امريكا واسرائيل واللة انا احب ان اسمع هوجو تشافيز وهو ينتقد الطاغوت امريكا اليس حريا بنا نحن العرب ونحن اهل السنة ان يكون عندنا زعيم مثل نجاد يعبر عن شعور الناس السنا نتهم اذا هاجمنا اسرائيل بتهم الاساة لدولة صديقة ان نجاد بكل المعاير رجل شجاع ام نحن ففى اصدقاء الكيان الصهيونى ان نجاد عندما صرح بنقل اسرائيل والمحرقة المزعومة خرج علينا الاشاوس قائلين ان المحرقة حقيقة تاريخية وعلى فرض ذلك فالذين حرقهم الالمان فما ذنبنا نحن وهم متكفلون بالتعويض وليس نحن ولا حول ولا قوة الا باللة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

