[[comments]]
order = 62
subject = "من اين لك هذا يا ابا صالح ياقدسي"
author = "قلب محب من العراق"
posted = "2006-01-08"
text = "لاحول ولاقوة الا بالله.<br />كم تمنيت ان تكون الردود موضوعية وان تجمع الشمل وان لاتفرق ولكن ابا صالح ابى على نفسه الا ان يكرر مايقوله ضعاف العقول ممن تصدوا للإفتاء وهم ليسوا اهلا له فباتوا يكفرون المسلمين فمن اين جئت بهذهِ الفرية بأن الشيعة من اصل يهودي هل لديك دليل واحد على ماتقول انا اتحداك ، والأمر الثاني الشيعة خانوا العرب ام العرب خانوا الله قبل شعوبهم فمن اين كانت الطائرات تقصف العراق ومن اين دخلت الجيوش الغازية للعراق هل جاءت من الفضاء الخارجي ام من بلدانكم التي تدعي حماية الدين والذب عنه ،الشيعة هم ثورة العشرين وهم الصدرين وهم ثورة 1991 وهم كل الشهداء الذين رقوا اراجيح الموت كي تنعم هذهِ الأرض بالحرية الشيعة هم العراق والعراق هم الشيعة ولايوجد احد على الأرض يستطيع الغائهم اما قولك بالخيانة فمن خان من ، صدام اولى بأن يوصف بهذا الوصف فهو من خان شعبة فقتل منه ماقتل وهجر منه ماهجر وعذب منه ماعذب واهدر خيراته وحطم اماله بالنهوض بسياساته الرعناء والحمقاء اما نحن فلا مع صدام ولامع امريكا والله سبحانه وتعالى يقول ( الظالم سيفي في الأرض اقتص بهِ واقتص منه ) فتعالى الله عز وجل من سخر امريكا لإزاحة صدام وكابوسه المقيت عن صدر هذا الشعب الطيب الصابر ، وسيعلم الذين ظلموا اي منقلب ينقلبون ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 63
subject = "وجهه نضر"
author = "محمد حسن"
posted = "2006-01-08"
text = "من المستحيل ان يضهر مثل هذا الزعيم في الاوساط العربيه اللتي تمتد من المحيط الى الخليج00<br />هل ابت النساء العربيات ان تنجب مثل ذا البطل 00<br />ام ماهي المصيبه التي وقعت بالامه العربيه في ان يكون لهم امثال هذا<br />00 من يكون السبب 0 ومن يكون المسول ين في وصول الامه العربيه الى هذا الانحطاط الذي ساد كل بيت عربي 000لم يعد العربي اصلا يفتخر بانه من اصل عربي 00<br />لماذا ياخير امه اخرجت للناس 0<br />الا تعلمو ان زعماءكم هم السبب الذي اوصلكم الى هذا الحد المخزي<br />انما يحدث في الاوساط العربيه يتمثل بما جنوه حكامها المرتزقه0<br />من يجرؤ من العرب على سب او رفع شعار او هتاف ضد امريكا او اسرائيل<br />تقوم القيادات العربيه بقمعه بكل ماتمتلك من وسائل الاسلحه من اجل ارضى قرده البشر 000<br />ياليت من حكام العرب ان تقمع الفساد مثل ما تقمع من قام ضد امريكا0<br />ان الزعما العرب اصبحو الان يعبدو البيت الابيض 0 لو ان نمله اتت من امريكا وضاعت عليها الطريق وامريكا علمت بذالك لقامت القياده العربيه بالنزول الى الميادين جالبه معهااكثر من 5000 جندي بحثا عنها 0<br />لماذا يازعما العرب اصبحتم تخشو امريكا ولا تخشو من هو خلقكم وخالق امريكا<br />لماذا لا تخافون الله فيما اوصلتم به شعوبكم ودينكم اللتي وضعت الثقه بكم وانتم وضعتم الثقه ببوش ورايس<br />اين ذهبتم بما جاء به رسولكم ولماذا لاتطبقوه وهو خير هدى منزل 00<br />ولماذااصبحتم تطبقو الدساتير والقوانين الاتيه من هناك مع المبوث الامريكي 0<br />وكيف اصبح السفراء الامريكيين في البلدان العربيه هم من يمسكون زمام القياده في الشئون الداخليه000"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

