text = "السلام عليكم<br />\" الحق يعلو ولا يعلى عليه \"<br />إن الرئيس الإيراني هو من الأشخاص القلائل في العالم الإسلامي القدرين على ايصال أقوالهم إلا العالم الغربي المتكبر وذلك لما تمثله ايران اقليميا ودوليا.<br />فليقل الحقائق كما يجب وكما هي ولا يخف في الله لومة لائم ."
