subject = "عن ابي هريرة قال: كنا جلوسا عند النبي ص فأنزلت عليه سورة الجمعة (وآخري"
author = "ben_mokhtar@maktoob.com"
posted = "2006-01-14"
text = "عن ابي هريرة قال: كنا جلوسا عند النبي ص فأنزلت عليه سورة الجمعة (وآخرين منهم لما يلحقوا بهم) قال: قلت من هم يارسول الله وفينا سلمان الفارسي ، وضع رسول الله ص يده على سلمان ثم قال: \" لو كان الإيمان عند الثريا لناله رجال أو رجل من هؤلاء \"<br />حدثنا عبدالله بن عبدالوهاب حدثنا عبدالعزيز أخبرني ثور عن ابي الغيث عن ابي هريرة عن النبي ص \" لناله رجال من هؤلاء \"<br />((صحيح البخاري كتاب تفسير القرآن ح4518"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

