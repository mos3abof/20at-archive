text = "إخواني الكرام,هناك فرق كبير بين صدقية وموضوعية هذا الرجل العظيم والتي جاءت في تصريحاته ,وبين نفاق صدام والقذافي , ومن أمثلة مصداقية نجاد تمسكه بالبرناج النووي النافع لبلاده , أمابالنسبة لصدام ومعمر , فالأول قدأذعن لمطالب الغرب في تدمير أسلحته قبيل الحرب عليه , وناهيك عما فعله في جيرانه قبل ذلك , وأما الآخر فلقد سلم أسلحته لأمريكا , بلاضافة الى خيانته لشعبه في قضية الأطفال الأبرياء .<br />فشتان بين الثريا (نجاد) والثرى (صدام , القذافي )"
