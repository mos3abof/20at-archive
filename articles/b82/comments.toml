text = "للاسف المسلمون تخلفو الى درجة ان دول الاخرى تهزء منها الامم (اخوتي السنة بما تجيبونني لو سالتكم او سالكم الله يوم القيامة مادا فعلتم لاخوتكم الفلسطينيين و........؟’ستقولون حتما اننا دافعنا عنها من الشيعة المخطئين ؟(مع ان العدو هم اسرائيل وامريكا وهده الحرب التي تشنونها على الشيعة هي في مصلحة الاعداء فكرو قبل ان تتكلمو قبل ان تندمو يوم لا ينفع الندم"
