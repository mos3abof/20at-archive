[[comments]]
order = 95
subject = "متى سنفهم نحن العرب"
author = "محمد طه"
posted = "2006-04-29"
text = "لم ارى امة استغبيت بحكامها كأمة العرب.فالحمد لله الذي اعزنا باخوان لنا في الدين; والتاريخ والتراب و الجوار. كاحمدي نجاد والمجاهدين في فلسطين و كل مكان..الذين يمسحون ذل الامة التي ابتغت العزة بالهوى والاعتراف بالصهاينة المزروعين عنوة بين ابناء المنطقة الشرعيين.واسئلوا التاريخ ان كنتم تفقهون..يتحدت احدهم في تعليق عن المرابطيين و الموحديين و هو لا يفقه شيئا لا في التاريخ و لا الاستراتيجيا ولا علم المستقبل..المرابطون و الموحدون حكموا الاندلس قرونا’والموحدون وحدوا المغرب العربي و الاندلس في امبراطورية اسلامية قوية حفظت الامةمن الغزاة و الاعداء.على اي مهما اختلفنا نحن المسلمون سنةاو شيعة فنحن مسلمون و الاتحاد بيننا واجب...يجن ان نحل مشاكلنا المذهبية و التاريخية التي تنزف في جسد الامة منذ قرون بحوار مكثف وارادة ونية صافية بين كل ابناء الامة الحقيقين..ممن يبغون لهاالخير و الصلاح والسلام.<br />فاللهم 1000شيعي و شيعي و 1000 ايراني و ايراني و لا صهيوني 1 سرطان اخطبوطي مسموم.\"افقهي يا امة العرب\"وكوني مسلمةلااعرابية منافقةكحكامك من الكويت الى \"آل سعود\".<br />و السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 96
subject = "تغير الخطاب والهدف واحد"
author = "بلاد الحرمين ..سعودي..."
posted = "2006-05-04"
text = "بسم الله.. خطاب ايران على عهد الخميني السطره على البلاد العربيه المسلمه وسماها بالفتوحات الاسلاميه ولكن في وقتها وجد الرادع الان تغير الطاب بازاله اسرائيل وكلنانعلم مدى عجزايران عن ذاللك لبعدها وعمق الفلسطينيين فيها واذا الخطابات تحرر فلسطين فابشروو بالخطابات العربيه ولكن هدف ايران لم يتغير وهو بناء هلال شيعي رافضي ولكن اقول عدوواحد هو اسرائيل كافي فلاناتي بعدو اخر كايران وايضا من سابع المستحيلات ان تصل ايران لاهادفهامادام اراقبنا تعانق الهواء .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 97
subject = "التالي مع نظام الملالي"
author = "حميد"
posted = "2006-05-09"
text = "بدلا من العبث باموال الشعب الايراني وتبديدها على السلاح النووي الاجدر بنجاد ان ينفق هذه الاموال على بناء مساكن للمعدمين الايرانيين والجميع يعلم قبل بضعة اسابيع ضربت هزة خفيفة لايران لم تتجاوز الاربع درجات ادت الى دك اربعين قرية ناهيك الى كون ايران منطقة زلازل مما تشكل خطرا على برنامجها النووي اضافة الى اعطاء ذريعة لامريكا وحلفائها بمزيد من التدخل في المنطقة.لذا ارى ان من الاصلح للسيد نجاد ان يولي اهتمامه بمشاكله الداخلية والكل يعلم ان في ايران اكثر من مليون لقيط يجوبون الطرق والازقات وياملون حل لذنب لم يقترفوه فهل ينصفهم السيد نجاد ونظام الملالي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 98
subject = "الوحدة الاسلامية شعار الجمهرية الأسلامية الايرانية"
author = "أبو مهدي"
posted = "2006-06-20"
text = "بسم الله الرحمن الرحيم<br />اللهم صل على محمد وآل محمد<br />الشيعة في كل مكان مظلومون من قال انهم يقتلون اهل السنة وهم الذين يدعون اى الوحدة.<br />ايرن الدولة التي تدافع عن المسلمين كافة وخير دليل اعتبارها القضية الفلسطينية هي القضية الأساسيةوالمركزية<br />ايران لم تتورط بقتل اي سني بريئ .<br />وبالنسبة لردود الأخوة<br />فأنا أشكر الأخ حمدي على انصافه بشأن الشيعةوالأخوة المنصفون.<br />بعض الردود:<br />أهل مكة ادرى بشعابهاأنا شيعي<br />ونحن لا نِؤمِِن بتحريف القرآن ولا نسب احدا ولا كننا نذكر حقائق تاريخية مثلا:<br />معاوية قد حارب امام زمانه وهو الامام علي عليه السلام.الحقيقة التاريخية لاتعني الشتم.<br />التقية ليست الكذب بل هي عدم الفصاح عن الامر الذي يسبب خطورة على الشخص او على الجماعة<br />وفي الاخير نجاد رجل ولا يوجد مثله في حكام العرب المنافقين والعملاء لأمريكا واسرائيل ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 99
subject = "الله اكبر"
author = "ميمو من مصر"
posted = "2006-07-15"
text = "الراجل ده الوحيد الذي يستحق ان يدعي راجل بين حكام المسلمين حتي وان كان شيعي ففي الحرب يكفي كلمه لا الاه الا الله حتي ننضم تحت لواؤه و ردا علي من يقول انه (بق كبير) فيكفي انه يتفوه بكلمه الحق التي تناسيناها في زحمه الحياه ويجبن اي حاكم ان يرددها و تعليقا علي رساله كلام فاضي اذكرك بان هذا ما فعله السادات قبل حرب اكتوبر,والي كاتب( ؟؟؟؟)هذا ما يفعله بالفعل ولم يتجرء اي حاكم عربي ليتفوه بنصف كلمه من كلامه فقد حقق الايمان بلسانه وهذا وفقنا لكلام رسولنا<br />وفي النهايه ادعو الله ان يجمعنا تحت رايه الجهاد وان يرزقنا الشهاده(اقترح كتابه سن المعلق مع كل تعليق)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

