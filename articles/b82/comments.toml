text = "لماذا تتهاجمو على الشعيه يا استاذ محمد على هل ليس لدينا اى مشكله نحن المسلمين؟ هل نسيت اسرائيل ؟ وما تفعل به المسلمين شعيةكانت ام سنه ؟هل نسيت مساعده ايران له اخوانانا فى فلسطين ؟ هل تعرف انا غالبية حماس والجهاد ان لم نقول كلهم من اخواننا السنه ؟لماذا ؟لماذا؟ كفا يا اخ المسلم ..........انظر من حولك انظر ماذا يجرى به العراق و فلسطينوالشبشان و افغانستان.......هل احمدى نجاد او اى مسلم اخر قال الحقيقه سوف ينتقد كامه من المسلمين؟ لماذا نخاف من اسرائيل ؟ ..........اخ محمد على تذكر محمد الدره"
