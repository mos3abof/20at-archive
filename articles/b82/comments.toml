[[comments]]
order = 1
subject = "اقرؤا التاريخ"
author = "إذا قرأنا تاريخ حكام المسلمين سنجد من كان شديدا على رأيه مستمسكا به، لا يستشير أحدا غيره، ولا يفقه من السياسة غير الجدال مثلما يفعل نجاد، والنتتيجة كانت أن أغرق محمد ابن تومرت المسلمين في بحر من الدماء راح ضحيته 80 ألف مسلم من المقاتلين في صفوف دولة المرابطين."
posted = "2005-12-14"
text = "وكان محمد بن تومرت يريد أساسا أن يحمل الناس على الصواب حتى إن كانت الأوضاع غير مواتية، وبالإكراه، كما إن حبه للجدال وخوضه فيه جعله يتبنى أفكارا خاطئة مثل ادعائه أنه المهدي المنتظر.<br />وبعد أن حارب عل بي يوسف ابن تاشفين أمير دولة المرابطين، وقتل من قتل من المؤمنين، قامت دولة الموحدين على أنقاضها. ومن اسم دولته يتضح لنا أنه كان يعتبر أن المنتمين له من الموحدين أما غيرهم فليسوا كذلك.<br />أخشى ان يكون نجاد ابتلاءا كهذا الابتلاء.<br />واقرؤا التاريخ.. فإنه فقه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

