posted = "2005-12-16"
text = "الاخ اللي بيقول علي نفسه مسلم بلاش الكلام الطائفي ده عن الشيعه وده كلام السلفيين التكفريين اللي ملهمش شغله الا تكفير المسلمين وسبب رئيسي في تخلف المسلمين<br />اما الاخ اللي بيقول ان كان هناك وفد اسرائيلي في طهران فعايز اقوله<br />ايه التردد بتاع قناة زووحل للاخبار اللي بتجيب منها الاخبار علشان نبقي نسمعها معاك!!!!!"
