text = "إن الشيعة من أصل يهودي وهم الذين افترقو عن الإسلام كما افترقت اليهود من قبل إلى إحدى وسبعين فرقة كما أخبر النبي محمد صلى الله عليه وسلم وهم الذين حرفوا الإسلام وأولوا النصوص وهم أشد علينا عداوة من اليهود والنصارى وإن أمريكا لاتخشى من الشيعة فهم الأداة لها لضرب المسلمين وما نراها واقعا في أفغان إستان والعراق خير شاهد فلولاهم لما وطىء الأمريكان بلاد المسلمين فعلينا ألا نخدع بنا نسمع وأن نتمسك بما جائنا من الكتاب والسنة وما كان عليه الصاحبة رضوان الله عليعم وعلى رأسهم الخلفاء الأربعة أبوبكر وعمر وعثمان وعلي رضي الله عنهم أجمعين<br />والسلام على من اتبع الهدى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 51
subject = "الله ينصر هذا الزعيم"
author = "محمد حسن اللكومي"
posted = "2006-01-06"
text = "الله اكبر00الموت لامريكا 00الموت لاسرائيل اللعنه على اليهود00 النصر للاسلام000 ياشباب الامه نحن اليوم نعاصر ونواكب الشر القادم من دول الشرق واسرائيل خاصه0 والواجب علينا الوقوف الى جانب هذا الزعيم الاسلامي مهماكان الثمن فلا تفوتنا الفرصه في وجود مثل هذا الرجل العضيم0 اقسم بالله ان لهذا الرجل شان عضيم في هذا العصر0 الذي طاغت عليه امريكا وساد عليه بوش 0<br />ان الله تعالى اصطفى هذا الزعيم ليكون ان شاء الله الزعيم الاسلامي الذي يقود العالم<br />باسره ويتم على يده تحرير القدس والعراق<br />وافغنستان 000<br />ادعو اخواني الشباب الى الاستعداد لمواجهه الغزاه0 ومقاطعه بضائعهم00<br />قال تعالى 0 كم من فئه قليله غلبت فئه كثيره بئذن الله000 صدق الله العضيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 52
subject = "الصرخه في وجه الغزاه"
author = "محمد حسن"
posted = "2006-01-06"
text = "اتمنى ان اعيش في بلاد ايران الابيه الشريفه في قياده الزعيم الاسلامي الحر احمدي نجاد 0 بالنسبه لنا نحن العرب نحضى بزعما استحي ان اقول هم قاده شعوب يقطنها كم مسلمين 0 رؤسا يمشو على منهجيه البيت الابيض وعلى ماتقرره كوندليزا رايس لقد اصبح رؤسا الدول الاسلاميه يلهثون وراء بوش كلكلاب الظائمه لقد باعو الدين بكف دولارات اين ذهبتم بمنهجيه الرسول الاعضم اين انتم بمواقف الزعيم الايراني ااتخذتم اليهود سند لكم في مواجهه اخوانكم كحزب الله وسوريا وحماس اف لكم يامن تسمون انفسكم حكام للعرب00 اما انت يا نور ايران فهنيئن لشعب انت قائده وهنيئن للشعب الايراني على هذا الزعيم000"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 53
subject = "يا حرام"
author = "رشاد المستغرب"
posted = "2006-01-06"
text = "والله يا حرام عليكم ...... منو معاجبكم نجاد .. لشو ؟ مين معاجبكم الملك عبدالله وحسني مبارك اللي عاملين صلح مع الفاسقين مع حطب جهنم الا وهم اليهود (اسرائيل) او معاجبكم زين العابدين بن علي ومعاوية ولد الطايع اللي كل شهر بيعزموا المسؤولين الاسرائليين والامركيين على مائدتهم او معاجبكم السعودية و قطر لانهم فاتحين مطاراتهم لسلاح الجو الامريكي اي الاسرائيلي ام مصر اللي من خلال قناتها مرت السفن والبوارج وحاملات الطائرات لتقصف العراق او الكويت اللي فتحت حدودها اما الجنود الامريكان ليدخلو العراق او معاجبكم ابو مازن الذي يلاحق المقاومين الفلسطينيين او وعاجبكم معمر القذافي الذي خطف المناضل الشريف موسى الصدر .......... هؤلاء كلهم معاجبينكم بس حسن نصرالله الزعيم العربي الوحيد الذي رفعلكم رؤوسكم كلكم يا عرب منو معاجبكم لشوو.... وبشار الرئيس العربي الشريف .... واحمدي نجاد الذي يؤدي دوره ودور جميع الرؤساء العرب والذي حتى ماسمح للطائرات الامريكية المرور بسماء ايران(خاتمي) وهو الرئيس الوحيد الذي يساند الشعب الفلسطيني وكل رؤساء العرب نايمين منو معاجبكم .... لشووووووو ... يا حرام عنجد يا حرام ... ما هي المشكلة انو ما في شعب متل الناس ليكون في رؤسا متل الناس ... ما فيي الا ههههههههههههههههههههههههههههه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 54
subject = "فين المشكلة؟"
author = "رنا"
posted = "2006-01-06"
text = "هو انتم ليه حولتم الموضوع لخلاف بين الشيعة والسنة ؟<br />الاسلام هو الاسلام مادام رضا ربنا هو هدفك وسنة نبيك هى طريقتك!<br />انا شايفة ان نجاد مقالش حاجة جديدة .....كلنا عارفين ان اسرائيل المفروض تتمحى من على الخريطة وان هما هولوا قوى فى موضوع الهولوكوست واحنا نفسنا بنقول الكلام ده بيننا وبين بعضنا<br />لكن اللى يتحسب له انه قال الكلام اللى بنقوله فى سرنا فى العلن .....يعنى ارادته هى ارادة شعبه ودى حاجة احنا مفتقدنها فى السياسات العربيه!<br />وكمان مننساش ان خلفيته البسيطة بتخليه اقرب للناس يعنى عنده مصداقية فى بلده....وده برضه مش موجود عندنا<br />احنا محتاجين واحد زيه عشان يقودنا روحيا وداخليا قبل ما نهتم بعلاقاتنا مع امريكا واسرائيل .......لأن مش المهم البلاد التانية شايفانا ازاى ......المهم احنا شايفين نفسنا ازاى!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 55
subject = "نجاد... والزعماء العرب"
author = "د. مجدي"
posted = "2006-01-06"
text = "تصريحات الرئيس نجادي تذكر بحقيقة اسرائيل فهي دولة قامت نتيجة احتلال أراضي الغير بالقوة الأمر الذي حظره ميثاق منظمة الأمم المتحدة ، بمعنى أنها دولة غير شرعية قامت بالمخالفة لأحكام ومبادئ القانون الدولي وهو ما يستدعي من كل المتشدقين بالشرعية الدولية أن يعملوا على وضع تصريحات نجادي موضع التطبيق ، ولكن يبدو أن الغرب يقصد شرعية دولية غير التي وردت في القانون الدولي ! وهذا ليس بغريب ، ولكن الغريب أن يكون الزعماء العرب - بمفهوم الزعامة في مخيلتهم المتخلفة - أول من ينتقد هذه التصريحات ... عجبي !"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 56
subject = "هذا هو صلاح الدين"
author = "محمد حسن"
posted = "2006-01-07"
text = "اتسال كثيرا لماذا احب هذا الرجل ذوي الروح القويه ولماذا ادهش الناس باسلوبه الحكيم وجلب قلوب الناس حوله000<br />في بلادي هنا اليمن اصبح الناس يفتخرو بان يكون لهم زعيم كهذا 000<br />ان الحادثه تكمن في ضهور هذا الزعيم هو انه من تلاميذ الامام الخميني رحمه الله عليه الذي اتخذ القران الكريم الدستور الاعلى في ايران ان الامام الخميني استطاع ان ينشا جيل يحملون الثقافه القرانيه لقد ربى في قلوب الايرانيين غرس الاخاء والتضحيه في مواجهه اعدا الاسلام000<br />ان شاء الله سوف نقتدي بهذا الزعيم الاسلامي في تحرير الاراضي العربيه ولم شمل الاسلام00<br />الله اكبر000الموت لامريكا000الموت لاسرائيل اللعنه على اليهود000 النصر للاسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 57
subject = "الرد على صالح القدسي"
author = "محمد حسن"
posted = "2006-01-07"
text = "الاخابو القدسي لاتتكلم بما ليس لك علم ولا تتدعي بانك عارف بما حدث<br />انصحك بان تتطلع على الكتب التي تسميها بالشيعه ولاتصدق بما يقولنه الوهابيون عملا الامريكان ولاتصدق اي شخص انضر الى الحقيقه بنفسك والله يسامحك على التيق اللذي كتبته<br />لانك بكلامك هذا تثير الفتنه في اوساط الشباب وتخدم اليهود والامريكان من حيث لاتشعر0<br />مره اخرى انصحك بالاطلاع على الواقع<br />وانضر الى من قامو مع الغزاه الامريكان واليهود 0 او اليسو العرب من الذي تكلم بحرف واحد يستنقد فيها امريكا على الحرب الموجهه ظد الاسلام000<br />فكل الزعما العرب خدمو امريكا بكل الوسائل والطرق 000<br />ان الزعما العرب هم من ذلو الاسلام والمسلمين هم من نقضو كتاب الله المجيد ورا ضهورهم واتخذو اللذين من دون الله اربابا000"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

[[comments]]
order = 58
subject = "اتفقنا ان نختلف"
author = "آية"
posted = "2006-01-07"
text = "يا جماعة مادمنا لا نتفق نحن فيما بيننا كمسلمين ولا نتقبل بعضنا فكيف نطالب اليهود بتقبلنا!؟<br />انا اشكر كاتب المقال وبغض النظر عن الردود السخيفة وغير الموضوعية، احمدي نجاد رجل شريف راجعوا ثروته وقارنوها بثروة رؤسائنا العرب!!! المسألة ليست مسألة سني وشيعي وبصراحة لم اسمع بحياتي عنصرية ضد الشيعة الا من السلفيين السعوديين والتكفيريين في مصر ولبنان والامارات والبحرين والعراق كلها اماكن المذاهب تحترم بعضها لكن السعوديين مشكلتهم مع نفسهم قبل ان تكون مع الشيعة!! لأنهم اعتادوا ان لا يتقبلوا أحد.<br />نجاد الله يحميك آمين<br />ولمن يدعون بأن الشيعة يكفرون الصحابة ويكذبون باسم التقية أقول اتقوا الله واذا كنتم أكثر اسلاما من الشيعة فلتكفوا ألسنتكم عن قول ما لست واثقين منه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130430/http://www.20at.com/article2.php?sid=82"

