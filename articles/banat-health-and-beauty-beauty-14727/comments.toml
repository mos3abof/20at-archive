text = "طبعا عايزه اقول انا مكسوفه من نفسى تانى علشان انا اول مره اشوف باب بنات الجامد ده<br />بس معلش ملحوقه يا عشرينات<br />عايزه بس اسال هدير كام سؤال كد<br />اولا بشكرهاعلى الموضوع الجميل ده<br />و اسئلتى اولا هى مش موضه من فتره ان الروج يكون نفس درجه التحديد<br />و من فتره برده يا هدير ظهرت امينه شلبايه ف البروجرام بتاعها بلوك غريب شويه كانت حاطه روج فوشيه على ميكاب بنى اوكسيديه و قال متستغربوش التونسى هو اللى حاططلى الميكاب ده و قاللى هيبقى موضه الايام الجايه<br />هى الموضه دى انتهت خلاص و لا لسه<br />معلش يا هدير جاوبينى اصل الواحد بقى مشغول و معدش up 2 date"
