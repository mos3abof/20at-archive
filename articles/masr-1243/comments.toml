order = 0
subject = "تعليقى موش هايلاقى من يقراه"
author = "عبد المنعم المصرى مقيم بالمهجر"
posted = "2006-12-03"
text = "قبل سؤال وزير الصحة لازم نعرف لمصلحة من ان تستشرى الامراض فى مصر ؟؟<br />يبدو اننا فعلا ننسي بسرعة والاهم من كدة اننا عارفين كويس ايه اللى بيحصل ومع ذلك انا ها افكركم لو كنتم صحيح نسيتم او تناسيتم<br />اولا نسبة المصابين بامراض الكبد تتجاوز 70فى المءة من الشعب المصرى ومع ذلك لم يجرؤ واحد مسؤول ان يقول الحقيقة ؟؟<br />يا جماعة مصر مستهدفة مستهدفة مستهدفة وبلاش ندفن رؤوسنا فى الرمل وهيطلع واحد مسؤول او موش مسؤول ويقول دايما فيه اللى بيقول مؤامرات ,, ايوة شباب مصر مستهدف وهذه الامراض هى نوع من الحرب البيولوجية اللى بتستخدمها اسرائيل بواسطة عملائهافى مصر وحاولوا تفتكروا قبل كام سنة لما انتشرت حالة الغثيان اللى بيصيب الفتايات فى سن المراهقة واتضح ان كان وراه اسرائيل وتم التعتيم على الموضوع ونفس الشيئ بتستعمله لاصابة الفلسطينيات بالعقم وهم بيمتلكوا القنابل الذرية والفلسطينيات بينتجوا القنابل الذرية [بضم الذال ] وطبعا اسرائيل موش عاوزة تدخل فى حرب معلنة الان مع مصر وتعلم ان من يدافع عن تراب مصر هم ابنائها عشان كدة تتفن فى حربها البيولوجية بالف وسيلة ووسيلة لاصابة ابناء مصر بامراض لا يمكن علاجها والدليل عملية تسميم ياسر عرفات يعنى دول ناس بيعرفوا يخططوا لعيد وازاى يوصلوا لاهدافهم باى طريقة ويساعدهم فى هذا تاكدهم ان النظام الحالى غير مهتم بصحة المواطنين وانه سعيد ان يموت منه كام مليون علشان يخفف العبئ على النظام والموضوع ده موش بس بالنسبة لصحة المواطنين وكفاية دا وصل الامر حتى للمحاصيل الزراعية واصبح حتى القطن المصرى من اردأ الانواع فى العالم ودا له قصة تانية يطول شرحها ومادام النظام مطمئن وبياكل من المستورد ما بيهموش صحة المواطن , فاى استجواب سيفيد ؟؟<br />الاول امنعوا السب<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073501/http://masr.20at.com:80/article.php?sid=1243"

[[comments]]
order = 1
subject = "رحلة علاج..زراعة كبد"
author = "mohamed"
posted = "2006-12-03"
text = "السلام عليكم<br />قصه واقعيه لمعانات المرضى من هذا المرض الذي لم يترك فقيرا ولا غنيا.<br />ذهبت انافي رحلة علاج اليمه بكل معاني الالم مع احد اقربائي كمرافق له في اجراء عملية زراعة كبدفوجدت الاتي:<br />1-ثمن العمليه باهظ جداااااااااااا<br />2-عدد المرضى اكثرهم من المصريين بالاضافه الى مجموعه صغيره من العرب والمسلمين من جنسيات مختلفه<br />3_عدد الوفيات كثير مع نجاح بعض العمليات<br />ملاحظــــــــــــــــــــــــات<br />1_لا يذهب الى هذه العمليه الا المقتدر بعد بيع كل ما يملك.<br />2_دور السفاره المصريه يقتصر على الاختام\"بالنسبه للوفيات\" حيث يتم شحن الجثمان على نفقته الخاصه الخالصه او المنتهيه بسبب سعر الجراحه دون تدخل السفاره بالشحن<br />مادور الدوله.؟فين امولنا اللي بتكلها الحكومه منا حرام على امكم يا غير كده بجد امتا نغير النظام الوسخ نظام الوسطه وامحسوبيه امتا حنشوف مصر دوله حره<br />ملحوظه اخيره:<br />اطالب بعمل احصائيه بهذا المرض وعمل خطه لمكافحته."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073501/http://masr.20at.com:80/article.php?sid=1243"

[[comments]]
order = 2
subject = "وضع غير طبيعى"
author = "سامح"
posted = "2006-12-03"
text = "فى قريتى 95% من حلات الوفاة تحدث بسبب امراض الكبد<br />متوسط العمر هو 40 عاما<br />فى حالات الفحص الغالبية تحمل الفيروس لامراض الكبد بى و سى<br />عندنا وحدة صحية تعمل بأمكانية حلاق صحة يجيد القراءة والكتابة<br />لا يوجد دواء ولا رعاية وكأننا فى زمن الظاهر بيبرس<br />الناس تموت وهم شباب<br />المنشات الحديثة هى مكان لمباحث امن الدولة<br />وكأن هؤلاء الفلاحين المرضى الغلابة يهددون امن الدولة-------تصور<br />فى الدول الاخرى مبحث امن الدولة تطارد الجواسيس والعملاء وليس الفلاحين الذين يجند اولادهم فى الامن المركزى<br />الامية منتشرة بكثافة والمدرسة الوحيدة موجودة منذ جلالة الملك فاروق رحمة اللة ان كانت تجوز لة الرحمة<br />الكهرباء دخلت القرية بعد السد العالى فى وجود الرئيس السادات طيب اللة ثراة<br />75% من الشباب ليست لهم اعمال ثابتة ولا يمكنهم تكوين اسرة<br />انتشرت عملية تدخين البانجو حيث تتولى شبكات يقودها لواءات شرطة على المعاش عمليات التوزيع والتوريد على ما حسبما سمعت<br />اين الحكومة من كل ذلك انا اتهم الاجهزة التنفيذية مثل المحافظ وحاكم المدينة والعمدة عن كل ذلك<br />ان القيادات السياسية بعيد عن كل ذلك فى امريكا حاكم الولاية هو المسئول عن كل المشاكل وليس رئيس الولايات المتحدة<br />فى بلدنا الاجهزة التنفيذية لا تعمل لانها غير منتخبة وانما يأتون بضابط احيل للتقاعد مكافأة لة عن خداماتة السابقة ليتولى العمل المدنى الذى هو بعيدعنة تماما<br />القيادة السياسية ناجحة بكل المعايير ولكن المشكلة فى الاجهزة التنفيذية وهذاهو المهم<br />عندنا حالة اسهال تشريعى فكل مشكلة لابد وان تحل بقانون وهذا هو الوهم بعينة واسلوب العجزة<br />والسلام"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073501/http://masr.20at.com:80/article.php?sid=1243"

[[comments]]
order = 3
subject = "التعذيب فى اقسام الشرطه قصيدة (يا داخل قسم العادلى)"
author = "محمد المصرى"
posted = "2006-12-03"
text = "القتل والذبح فى المصريين اشكال والوان<br />المصرى يا جماعه ملهوش تمن وملهوش تسعيره<br />والدليل التعويضات 3000ج لللقتيل و500ج للمصاب واهله ما يصرفوش الملاليم دى الا بعد ما يطلع دين ابوهم!<br />المهم حتكلم معاكم على موضوع حقوق الانسان فى مصر وهو ملوش اى حقوق اصلا والتعذيب فى اقسام وسجون العادلى اكبر دليل وبعد الفضيحه لانتهاكات الاعراض والتعذيب اللى اتصورت صوت وصوره سواء فى الشوارع والميادين او داخل اقسام الشرطه العادلى مش لاقى المجرم حاجه يقولها الا كلام خايب ميصدقوش عيل صغير يعنى مثلا<br />لما ظهر الظابط بتاع قسم الهرم وهو نازل بالاقلام على وش وقفا متهم وسط ضحكات وتعليقات الشراميط زمايله قالوا ان الظابط اعصابه خانته واضطر يعمل كده علشان المتهم ده اعتدى على عيل صغير جنسيا ووالد الطفل بكى بشده امام الظابط فاضطر ان يضرب الجانى تعاطفا مع ابو الضحيه! طيب ايه لزمة القانون لو كان الحق بالدراع المهم التعذيب موجود والجزارين شغالين الله ينور! فكتبت قصيدة ( يا داخل قسم العادلى) على وزن اغنية( يا رايح صوب بلادى) ياريت تعجبكم<br />ياداخل قسم العادلى...وركبك تخبط من خوفك<br />ودع اهلك احسن يا جميل... مره تانيه مش حتشفوك<br />يا عصايه فى الطيظ يا تعليق رجلين انت يا حلو وظروفك<br />العادلى جبان كلب وحيوان جزار انما على كيفك<br />امناء ظباط شراميط خولات شغلتهم دبح الناس<br />حتقول يا عياط حتقول يا صواط انسى دا مفيش احساس<br />لك يوم يا حبيب يا ملك التعذيب تشرب من نفس الكاس<br />والنكته يا بيه بيقولوا قال ايه دا فى مصر حقوق انسان<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073501/http://masr.20at.com:80/article.php?sid=1243"

[[comments]]
order = 4
subject = "بلاش هالكلام البايخ"
author = "محمد رافد (فلسطيني من القدس المحتلة)"
posted = "2006-12-03"
text = "إلى الأخ عبد المنعم، كلامك الحقيقة غريب جدا كإنه الحكومة الإسرايلية ما لهاش شغل غير إنه تقتل المصريين.. خلينا نفكر بشوية موضوعية: شو راح تستفيد إسرائيل (حتى ولو اتفقنا فرضا إنها بتكره العرب كلهم وبتحب تقتلهم) من حرب بيولوجية ضد مصر (خصوصا إنه مصر هي شريك مهم بالنسبة للسياسة الإسرائيلية - الأميركية المشتركة في المنطقة)؟ إللي بيشغل بال الإسرائيليين بالفترة هذه هو الصواريخ الفلسطينية والمقاومة اللبنانية والبرنامج النووي الإيراني ، ولو حبت إسرائيل بالفعل تجرب أسلحة بيولوجية جديدة أكبد كانت تستهدف بالأول الفلسطينيين إللي هم أعداءها المباشرين (تنساش يا أخوي محاولة اغتيال خالد مشعل سنة 97 من قبل الموساد في عمان). ولذلك بدي أترجى الأخ الكريم (وللأسف كتروا الناس من أمتاله في البلدان العربية) إنه يتخلى عن هالكلام السخيف إللي ما بيدخلش العقل أبداً ، عشان كل نظريات المؤامرة هذه ما لهاش فايدة وقيمة غير التهويل والتخويف وتكبير شأن العدو الصهيوني إللي بتحتاج مواجهته للصبر والتأني والعقل السليم.. وبما إنه الجبهة الخارجية بدها جبهة داخلية متماسكة خلي الحكومة المصرية أولا تقوم بالواجب وتتحمل مسؤولياتها وتتغلب على كل المشاكل البيئية والصحية إللي هي السبب الحقيقي في كل هذه الأوباء."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073501/http://masr.20at.com:80/article.php?sid=1243"

