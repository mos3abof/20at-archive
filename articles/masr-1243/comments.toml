text = "تحيه كبيره للصاحيين من أولاد بهية .. فورا هرشوا التعليق الشاذ .. طبعا دي حكايه قديمه كتبتها عشرات المرات عن الآلاف من الصهاينة العرب الذين جندهم الموساد للشوشرة المنظمه على أفكار المتحاورين العرب والمصريين بهدف البلبله وخلاص ... راح تلاقي منهم كتير أوي على موقع العربيه نت ... والموقع يعطيهم حريتهم تمام التمام مع أنه عارف من أين يأتي التعليق بوسائله لاتكنولوجيه .. لما واحد مذيع محترم ((مهند الخطيب .. فاكرينه؟)) اعترض على الخط الصهيوأمريكي لقناة العربيه راح عبدالرحمن الراشد الماسوني ((صحفي سعودي مقيم في لندن وله صور منشوره من داخل المحافل الماسونيه)) المهم الراشد ده طرد مهند من المحطه كلها والبقية تأتي فما كثر المتزمرين في هذه القناة من ذلك الخط الصهيوأمريكي الذي أنشئت لأجله خصيصاً .. المهم أنا سعيد جداً بأولاد بهيه اللي بيهرشوا الكذاب ويقفلوا عليه السكه .. يالا يا مان شوفلك موقع تاني تكون الناس فيه نايمه<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073501/http://masr.20at.com:80/article.php?sid=1243"

[[comments]]
order = 9
subject = "لا حياة لمن تنادي"
author = "محمد رافد (فلسطيني من القدس المحتلة)"
posted = "2006-12-03"
text = "لكل الإخوة إللي هاجموني بكل ألوان الشتايم والمسبات.. بديش أحكي معاكوا عن الشيء إللي بيسموه (حرية التعبير) أو (إحترام الرأي الآخر) لأنه مبين الحقيقة إنكم مش متعودين عليه ، ولذلك بكل صراحة مافيش فايدة بالمرة من أي نقاش معاكوا.. بس لاحظوا قديش ابتعدتوا عن الموضوع أصلا ويا ترى شو هي الوسيلة إللي فعلا تخلينا نقدم الشفاء والمساعدة للإخوان الغلابا إللي مرضوا ويمكن راح يدفعوا حياتهم ثمن للتقصيرات الحكومية (زي ما كتبوا عدد من الإخوة من ذوي العقل والبصيرة في تعليقاتهم).. لمعلومتكوا أنا مش من هدول إللي بتسموهم (العرب الصهاينة) وكمان مش من هدول إللي بيسهروا ليل ونهار عشان يخشوا المنتديات ويتدخلوا بكل صغيرة وكبيرة.. بس صدفة زاغت عيني ودخلت على هالموقع وعجبتني اساسا المواقف إللي أشرت إليها من قبل وإللي أقل ما يمكن القول عنها إنها من نسج الخيال.. يا شباب (إعقلوا وتوكلوا) عشان كل (طق الحنك) ضد إسرائيل - حتى وإن كان صحيح - مش حيأدي لأي نتيجة.. أنا شخصيا بما إني ساكن بالقدس المحتلة ومجبور أعيش جمب اليهود ولو غصبا عني صرت آمن بمبدأ إسمه (الصمود) إللي هو على فكرة من الثوابت الفلسطينية المتفق عليها ، يعني لا بد نصمد على أرضنا ومبادئنا ونحارب بالحنكة والدهاء السياسي مخططات العدو.. بس عن جد كل الكلام إللي حكيتوا من قبل (لا يسمن ولا يغني من جوع) وكله يمكن للاستهلاك المحلي وعشان تحسوا حالكوا أبطال مغاوير بينما الحقيقة يمكن تكون العكس تماما.. بعدين كل الاتهامات الباطلة إللي حكيتوها عني ما بتكسر بخاطري بالمرة لأني كنت متوقعها اصلا.. (خلاص! زهقت من الموضوع وبعاود بتمنى للكل النجاح والتوفيق والسلام!)"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073501/http://masr.20at.com:80/article.php?sid=1243"

[[comments]]
order = 10
subject = "تحياتى لكل تعليقاتكم"
author = "تلميذة"
posted = "2006-12-05"
text = "تعليقا على تعليقاتكم ايها السادة الكرام<br />موضوعنا الاساسي هو موضوع الحكومة ولكن خرجنا من الموضوع ودخلنا في موضوع الاخ الاسرائيلى اللى عامل فلسطينى او الفلسطينى المأسرل ما تفرق كتير معى اخى عندك حق وانا الحقيقة ولا مع الحكومة في موت الشعب ولا مع ان اضخم ان اسرائيل سايبة الدنيا كلها وقاعدة على راى عادل امام تمضى _ توقع يعنى _على اطباق تسمم بيها الشعب المصرى بالذات لان ده وهم الناس الفاضية وهما للاسف الاسرائيليين مش فاضيين كما قال الاخ اللى اتهمتوه انه اسرائيلي وليكن فهو شجاع انه دخل وياحلوته انه يعرف لغتكم وانتم ما تعرفوش لغته هى ديه الثقافة على حق _اعرف لغة عدوك _ ما تجرأ حد منا ليذهب لتعلم اللغة العبرية ورغم ذلك ح تلقى معظم الاسرائيلين يتكلمون الفرنسية والانجليزية والعبرية والعربية بدون ترتيب فنحن دائما نمسك في الهيافة ونترك المواضيع الاساسية بالنسبة لموضوع الحكومة فيناسبها انتهاج مسلك القضاء اول باول على الكبار ليتمكن الصغار الجدد من امتلاك الشقق والمواد الغذائية وده اسلوب علمى متحضر من الحكومة ليه بقى ؟فكروا معايا وشوفوا نسبة العيال اقصد الانجاب قد ايه بتاع تشليون عيل سايبين في كل مكان زى القطط اللى سارحه كل واحد عنده كوم عيال وده ليه عشان حرام نوقف النسل ماشي سابتكم انتم تنسلوا وهى تنسل في لحمكم جيبوا عيال وناخد اللى وصل الاربعين وبكده يبقى في تعادل انمائي لمستوى الحياة ككل اللى مشى ومات مع السلامة اللى جاى مكانه له عمر افتراضى برضه وبكده خلصوا المشكلة من عندهم اول بأول وبدل ما تنبح صوتها بتحديد النسل عشان توعية قومية والخ وناس عمالة سيول نيجرا عيال جه واحد ذكى واقترح الموضوع بتاع الوباء ده واحد خبيث وسرب الوباء وقال خليهم بقى يخلفوا وقعد يضحك ماهم مش ح يطولوا كتير وبكده<br />اقرأ بقية التعليق .."
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210013721/http://masr.20at.com:80/article.php?sid=1243"

[[comments]]
