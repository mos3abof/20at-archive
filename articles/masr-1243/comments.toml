subject = "يا خساره والف خساره"
author = "المصرى الحزين"
posted = "2006-12-10"
text = "فضايحنا بقت عالميه<br />أرسل هذا التعليق بواسطة : المصرى الحزين<br />اناشد كل الدول والمنظمات والمؤسسات التى تقوم بارسال المنح والمعونات المقدمه للسراب المسمى \"العمل الاجتماعى والانسانى فى مصر\" بعد الفضائح المدوية والجرائم البشعة والمخزية التي حدثت مؤخراً من قتل واغتصاب الاطفال والمراهقين على يد عصابات منظمه، بل وتتحدث الأرقام إن عدد المشردين تجاوز المليونين من صغار السن بينما الجمعيات الخيرية تنهال عليها المعونات بالملايين فى الداخل ومن الخارج، ولايدرى احد اين تذهب؟، والمسؤولون مشغولون بالاجتماعات والندوات فى فنادق الخمس نجوم بحجة البحث عن حلول ! بينما الضحايا يلقى بهم من فوق أسطح القطارات.<br />محمد زين - القاهرة<br />نقلا عن صفحة اراء حره بموقع bbc ولا تعليق<br />09/12/2006<br />هنا لندن bbc<br />أرسل هذا التعليق بواسطة : المصرى الحزين<br />http://news.bbc.co.uk/hi/arabic/talking_point/newsid_6165000/6165003.stm<br />09/12/2006"
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214183615/http://masr.20at.com:80/article.php?sid=1243"

