subject = "أم الدنيا سابقاً"
author = "هشـام غنيـم"
posted = "2006-12-10"
text = "أولاً أنا من فاقوس - شرقيه<br />بلد النائب د / فريد إسماعيل<br />والنـائب م / إمام حسن منصور<br />بارك اللهم فيهم وجعلهم زوخاً لهذا الوطن<br />أما بعد ...<br />حسبى الله ونعم الوكيل<br />حقيقة الأمراض فى مصر مفزعه جدا جدا<br />الماء الملوث الذى تسبب فى امراش الكلى<br />والفشل الكلوى و والحصوة<br />والهواء الملوث الذى تسبب فىأمراض الصدر<br />والسرطان<br />الأكل الملوث الذى تسبب فى أمراش الكبد<br />كل شىء ملوث<br />حتى أصبح الشعب ملوث نتجة .....<br />:( للأسف<br />اللهم لا إعتراض<br />اللهم لا إعتراااض<br />اللم لا إعترااااااض"
