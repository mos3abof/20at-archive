subject = "نفسى"
author = "محمد"
posted = "2006-12-07"
text = "انا بقلها بحرقة نفسى الشعب يفوق ويعرف ان عدوة الحقيقى مش اسرلئيل وامريكا وغيرهم دول واضحين لينا وعارفين نوياهم اية لاكن المهم نعرف ان حكوممتنا هى العدو الكبر هى اشر حكومة على وجة الارض هى من تريد ان نموت جميعا ويبقى الاشخاص الخونة وما يوسف والى ببعيد فقد سلهم كثيرا فى موت الشعب المصرى الذى يضع يدة فى جيبة ويقول انا مالى يبقى نصيحةللشعب فوق واذا كنت انتة نجيت من المرض بص لاولادك لو ابنك مرض حاتعمل اية ياخى قوم واتحرك وخليك ايجابى بقى كل لن يصيبنا الا ماكتب اللة لنل صدق اللة العظيم"
archived = "2006-12-10"
