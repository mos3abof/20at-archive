[[comments]]
order = 6
subject = "قتلانا يومياً بسبب حكومة الواطي اكثر من قتلى العراق والسودان والصوال"
author = "إبن بهية"
posted = "2006-12-03"
text = "تابعت بالأمس برنامج الإعلامي المحترم وائل الإبراشي على قناة دريم في برنامجه الحقيقه ، كان محور البرنامج دماء المصريين التي تبيعها حكومة مصر رخيصة جداً لكل من يدفع في عهد الواطي حسني مبارك.. حادثة الساحل الشمالي التي سحق فيها شاب سعودي متهور ومخمور عائلة من خمسة أفراد وتم تهريبه وتسفيره إلى السعودية دون حساب أو مسائلة من أحد وبيد المسئولين المصريين المرتشين في حكومة مبارك ، والحادثة الثانيه التي راح ضحيتها 11 قتيل و40 جريح معظمهم معاق هرب منفذوها المتسابقين (مصري وقطري) على طريق المطار دون مسائلة ولا حساب من أحد من المسئولين المرتشين في نظام مبارك .. لو طالعت الصحف المصرية اليومية وأحصيت القتلى والجرحى من المصريين على الطرقات التي نهبوا أموال صيانتها ستجد أعداداً من القتلى والجرحى تفوق تلك التي في العراق والسودان معها ، ليس ببعيد منذ يومين فقط حادث الخمسين قتيلاً وجريحاً بطريق القاهرة أسيوط وقبله فقط بأسبوع كان نفس العدد تقريباً والغريب في الأمر أن الحادث الأخير هذا كان كثيراً من ضحاياه في طريقهم إلى القاهرة لتسلم جثث ذويهم من القصر العيني ، وبدلاً من تسلم حثث ذويهم في عادوا هم جثثاً هامده .. ما أرخص دماء المصريين في عهد مبارك الواطي ..<br />منذ يومين أيضاً قرأنا التقرير الشهير الذي جاء فيه أن عدد مرضى الفيروس الكبدي الوبائي سي بلغ رقماً خيالياً 20000000 – عشرين مليون مريض في مصر بالفيروس سي ينتظر أكثر من نصفهم الموت خلال العامين القادمين .. ناهيك عن عدة ملايين أخرى مصابة بالفشل الكلوي وبحاجة إلى غسيل كلوي مرتين أسبوعياً ولا تجده فتتألم حتى الموت في عهد السيد حسني مبارك الذي أقسم برأس أبوه ليظل جاثماً على صدورنا حتى آخر أنفاسه ليسد الطريق على أي بني آدم يمكن أن يسأل ببراءة ألسنا<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073501/http://masr.20at.com:80/article.php?sid=1243"

[[comments]]
order = 7
subject = "رد على محمد رافد الذى يدعى انه فلسطينى"
author = "عبد المنعم المصرى مقيم بالمهجر"
posted = "2006-12-03"
text = "طبعا من الواضح انك اسرائيلى او من العملاء اسرائيل لانك بتاكد بذكاءك الذى لا ينطلى على احد انك 100% يهودى ,ولازم تعرف ان الصهاينة لهم طريقتهم فى الوصول لاهدافهم ولو كنت فلسطينى حقا فانت لا تعرف تاريخ عدوك,الصهاينة يا سيد محمد رافد ليس لهم عهود ولا يهمهم اتفاقيتهم مع مصر ولا غير مصر شوف تاريخهم من اول مؤتمر عقد فى بال بسويسرا برئاسة تيودور هرتزل سنة 1794 ان لازم يكون لهم وطن قومى واختاروا فلسطين يا فلسطينى ومن عام 1794 الى عام 1947 تاريخ الموافقة على تقسيم بلدك وهم لم يتوقفوا عن التآمر على كل من تسول له نفسه التصدى لمخططهم , نرجع لموضوعنا صحيح فيه اتفاقية صلح بين النظام المصرى واسرائيل ولكن هل تستطيع ان تثبت لى او ليغيرى ان الشعب المصرى راض عن هذه الاتفاقية ؟؟ بالتاكيد لا وحتى النظام المصرى متاكد من هذا ولكن نظرا لحالة التردى التى وصل اليها العرب عامة ومصر خاصة فلا يجرؤ احد عن إعلان الحقيقة وهى ان اسرائيل بؤرة فساد وهى كالسرطان الذى يصيب الجسد ويظل يعمل فى صمت حتى يظهر فجاة واحدةويموت المصاب ,, هذا ما تفعله اسرائيل بتاعتك يا سيد رافد وانا ما زلت مصر على انك اسرائيلى ولست فسطينيا لان حتى عملاء اسرائيل فى فلسطين لا يستطيعون التصريح بمثل ما قلت , ولو كنت فلسطينيا لعلمت كيف مات ياسر عرفات ولو كنت فلسطينيا لعرفت كيف تستخدم بلدك اسرائيل الحرب البيولوجية ضد نساء فلسطين حتى يصبن بالعقم لان اسرائيل تعلم انه على المدى البعيد لو استمر النمو الفلسطينى على ما هو عليه فسوف يختل التوازن الطيبوغرافى فى عدد السكان الفلسطنيين مقابل كل المتهودون وليسوا بيهود ,, انت لا تعرف اى شيئ فى سياسة عدو العرب اسرائيل لن ترضى بدلا غير سيطرتها على كل الامة العربية وتعتقد ان هذا وعد تورا<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073501/http://masr.20at.com:80/article.php?sid=1243"

