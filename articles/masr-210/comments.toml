subject = "شكرا"
author = "أمير"
posted = "2006-04-22"
text = "شكرا للأستاذ محمد و لأولاد اليلد، و متشكرين عالمقال ده، و كمان تحية أخيرة عالمقال لأنه فعلا حلو، و أتمنى أن يعود بلال للكتابة الصحفية فى المصرىاليوم مرة أخرى، لأن هى جريدة كويسة وهو كاتب رائع"
