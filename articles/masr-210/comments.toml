subject = "كنت هنفجر يا بلال"
author = "غلباوى"
posted = "2006-04-25"
text = "العاده ..ف الصبح بدرى بوم الأربعاء نزلت أجيب الدستور<br />أقلب شمال يمين .. مفيش صفحه قلمين طيب فين رسومات عمرو سليم .. لقيته كاتب مقال وقف فى زورى شويه كده و قلب عليا المواجع<br />كنت هنفجر .. بقى مفيش بلال و مفيش عمرو سليم ؟!!<br />بس طمنتى يا على الثنائى و رجوعه<br />بعد ما كنت هنفجر .."
