text = "اولا مرسي لاستاذ محمد ع اخبارنا وع جهوده في الحصول ع المغلومات من فم صاحبها ثانيا بالتوفيق لبلال وان شاء الله يكون مسلسل ممتع للجميع"
archived = "2006-05-24"
