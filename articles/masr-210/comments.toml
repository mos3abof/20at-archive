text = "انا من سنة 95 وانا قارىء لبلال فضل فى الدستور قبل ما تقفل لحد لما قفلت بقيت زى المجنون كائنى بدور على الغريب المهم راحت الايام وجت وانا افكر انت فين ياعم مصر لحد لما لقيت اسمة على احد افيشات الافلام موجود لطمنت وبعد كدة المفاجئة الكبرى عودة الدستور مرة اخرى وتيجى تعتذر دا أنا قتيل قدام الدستور لو بلبل بطل يكتب"
