[[comments]]
order = 2
subject = "بحبك"
author = "مصرى"
posted = "2006-04-23"
text = "بجد يا بلال اتعودنا نشوفك فى جريدة الدستور كل اسبوع<br />انت جزء من شى جميل قوى<br />يا ريت تفضل فيه علطول<br />وبعدين مين غيرك هيمنح اوسكار الموالسة<br />واعتقد ان لسه غى ناس كتير عايزين يحصلو على الاوسكارز"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213918/http://masr.20at.com:80/article.php?sid=210&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "بلال الدرة الأخيرة في عقد الساخرين المصريين"
author = "ياسر محمود إسماعيل"
posted = "2006-04-25"
text = "قد تختلف مع بلال في كثير أو قليل، و لكن لا تملك إلا أن تحبه لأنه ساخر مصري عبقري كأسلافه من الساخرين العظام الذين أسسوا مدرسة السخرية الثائرة و المحفزة، و تحبه أكثر لأنه يكتبك: يكتب انكساراتك و افكارك و احلامك كأنه أنت. و أنا أرى أنه يجب أن يدرك أنه لم يعد يملك رفاهية التوقف أو الراحة. ببساطة لأننا - كوطن في مفترق طرق و امام مستقبل سياسي مجهول كالثقب الأسود - في أمس الحاجة لكل من ينير مشعله و يمتشق قلمه أمام كل هذا العبث."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213918/http://masr.20at.com:80/article.php?sid=210&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "بص يا بلبل"
author = "ايمن"
posted = "2006-04-25"
text = "بص يا بلبل انا دايما اقرا الدستور اسبوعيا لكن الاسبوع اللي فات كان ناقصها الطعم واللون بتاعك - الاسبوع ده قبل مااشتريها بحثت عن قلمين ولما لقيتها اشتريتها - الدستور يعني - ماتحرمناش منك"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213918/http://masr.20at.com:80/article.php?sid=210&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "هذا هو بلال فضل"
author = "Dabdoob"
posted = "2006-04-25"
text = "بصراحة انا لي راي في بلال فضل هو انه كاتب كويس لكن ليس الي درجة عظيم كما يقولون ده غير اني معترض علي اسلوبه السوقي جدا في احيان كتيرة ويمكن حد يرد علي ويقول ان الناس بتتكلم كده فاقول له ان مش كل حاجة الناس تقولها لازم نكتبها .<br />اما عن كونه كاتب سينمائي فرايي ان بيركز دايما علي ان شخصياته تكون مختلفة وفريدة وشعبية جدا لكن السيناريو في الغالب بيطلع متفكك في الغالب وناقصه حاجات كتير زي مثلا فيلم صايع بحر كان ممكن يكون فيلم كويس جدا معتمد علي شخصياته لكن بلال فضل ظل طوال الفيلم يبحث عن عقدة غير موجودة ثم قام بحلها في نهاية الفيلم بالنهاية السعيدة جدا!!!!!"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213918/http://masr.20at.com:80/article.php?sid=210&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 6
subject = "بلال فضل لغز محير"
author = "مخنوق من أزهي عصور الحريه قصدي الحرامية"
posted = "2006-04-25"
text = "انا قريت اخر مقاله لبلال في المصري اليوم وقال الراجل انه هيعتكف لانه بيكتب مسلسل ندعيلعه بالتوفيق ويارب ميطلعش زي علي سبايسي وامثاله لاني بصراحه لما اقرأ مقالاته في الدستور والمصري وبعدين اشوف افلامه اقول ايه ياعم التناقض ده ماهو انا شايف ان افلامه كلها سطحيه وتفاهه زي الافلام اللي موجوده وبعدين اقرأ المقالات اقول والله الراجل ده امتداد لعمنا السعدنى الله يديله الصحه فياعم بلال لو كان المسلسل من نوعيه افلامك فارجع عن اعتكافك وخليك في المقالات وسلم لي ع الفنان عمرو سليم"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213918/http://masr.20at.com:80/article.php?sid=210&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

