[[comments]]
order = 3
subject = "و أسباب استقالتك هى"
text = "أولا: انك تفتقر الى الشرعية فلم تجيء الى الحكم من خلال انتخابات حرة مفتوحة كما أن الظروف التى أدت الى تبؤك السلطة فى البلاد مشكوك بها و مثيرة للجدل<br />ثانيا: انك تخطط لحكم البلاد مدى حياتك عن طريق تزوير ارادة الشعب فى الوقت الذى لا توجد فية وسيلة سلمية متاحة للشعب لتغييرك<br />ثالثا: أنك تخطط لأن تورث الحكم الى نجلك جمال مبارك<br />رابعا: انك خدعت الشعب طيلة 21 عاما باخفائك عنة سببك الحقبقى لعدم تعيين نائبا لرئيس الجمهورية و الذى تبين بأنك كنت تخطط و تعدابنك جمال مبارك ليرث الحكم من بعدك<br />خامسا: انك عرضت أمن البلاد و سلامتها للخطر طيلة فترة حكمك بعدم تعيينك لنائبا لرئيس الجمهورية و كان ذلك بسبب مأرب شخصى لك و هو توريث الحكم لنجلك من بعدك<br />سادسا: انك حكمت البلاد باستخدام أبشع اساليب البطش و التنكيل و الارهاب تحت وطأة و نير الأحكام العرفية و قانون الطوارىء و قوانين و قرارات أخرى كبلت بها الحريات و كممت بواستطها الأفواة بمصر دون مبرر صحيح والتى فرضتها على الأمة لتستعيض بها على انعدام شرعية وجودك و انتهكت بمقتضاها حقوق الانسان و نكلت بخصومك و معارضيك أبشع تنكيلا و هى أفعال مؤثمة و خسيسة أدانتها و شجبتها الحكومات و المنظمات الدولية.<br />سابعا: انتشر الفساد فى عهدك بصورة لم يسبق لها مثيل و ضمت زمرتك الحاكمة عناصرجاهلة و فاسدة و مجرمة سجلها قذر و ولائها منحرف تركت لها و لنجليك علاء و جمال و حفنة من اللصوص مما يطلقون على أنفسهم رجال أعمال الحبل على الغارب ليسرقون أموال الشعب و يعيثون فى أرض الكنانة فسادا كما انك استسلمت لرغبات و أهواء زوجتك سوزان وجشعها و بذخها وعشقها للظهور و الاستعراض وا لتكبرو التحكم و السيطرة فتدخلت بدون وجة حق فى شؤن الحكم و قامت باهدار أموال الشعب و اضاعتها علىالاحتفالات والرحلات و المهرجانات و المؤتمرات و المشروعات الفاشلة التى لا طائل من ورائها اللهم الا اشباع هوسها بذاتها و كانت قد أقامت مهرجانات و احتفالات افتتاح مكتبة الآسكندرية التى أرادت أن تكون هرم سوزان و التى دعت اليها ملوك و رؤساء دول العالم و هى احتفالات فاقت فى تكاليفها و بهرجتها الاحتفالات التى اقامها الخديو اسماعيل بمناسبة افتتاح مشروع قناة السويس مع الفارق بين أهميتة و بين مشروع سوزان الذى كلف خزينة الدولة الخاوية مئات الملايين من العملات الصعبة<br />ثامنا: انك غير كفء كما انك تفتقر الى المؤهلات الأساسية الواجب توافرها فى رئيس جمهورية يمكن أن يقود بلد نامى الى الازدهار و التقدم فقد انهار الاقتصاد فى مصر فى عهدك و وصلت معدلات البطالة الى أكثر من خمسين بالمائة كما توقفت معظم الوحدات الاقتصادية فى البلاد عن العمل و تدنت الدخول الحقيقية لأبناء الشعب و أصبح توزيع الدخل فى مصر الأسوأ فى العالم و تفاقمت المشكلة السكانية و انهار مستوى التعليم و تفشى التلوث وانتكست الصحة العامة و ارتفعت معدلات الجريمة وساد الفكر السلفى و قويت شوكة الارهاب كما سيطرت البلطجة على مجريات الامور بالبلاد بعد أن جعلت أمن الوطن و المواطن هو أمنك أنت و عائلتك فقط و بعد أن خربت قطاع العدالة بسبب افسادك لة ليكون مجرد أداة فى يدك تضرب بها معارضيك و خصومك.<br />تاسعا: انك عالة و عبء على أبناء الشعب اذ انك تكبدهم اموالا لاطاقة لهم بها و هى تفوق ميزانيات التعليم و الدفاع و الصحة مجتمعة للانفاق على مخصصاتك و مصروفاتك و امنك الشخصى و تنقلاتك و أمن و تنقلات نجليك و زوجتك و جعلت مقدار و تفاصيل هذة الاموال سرا لا يعلمة أحد سواك و كانها أموالك الشخصية التى ورثتها عن والديك و تكون بذلك قد جعلت من نفسك قدوة و مثالا يحتذى بهما موظفى الدولة فى اهدار المال العام<br />عاشرا: انك تنتهج و تنفذ سياسة خارجية فاشلة لم تنهى حتى الان حالة الا سلم و الا حرب التى تهدد أمن البلاد و تزعزع استقرارها كما أن سياساتك الخارجية أدت الى التباعد بين مصر و حلفائها فى الغرب و أشقائها فى الوطن العربى بما أثر سلبا على المعونات و المساعدات التى تتلقاها مصر منهم فى الوقت الذى لم توجد سياساتك الفاشلة بديلا لتلك المعونات و المساعدات كما ان سياساتك لم تحقق برغم استمرارك فى الحكم فترة تناهز الربع قرن الاكتفاء الذاتى المنشود فى الغذاء أو فى رأس المال أو فى أى شىء<br />لذلك، نهيب بك أن تستقيل فورا من منصبك كرئيس لجمهورية مصر العربية حتى نجنب الامة المصرية تبعات و ويلات استمرارك فى حكمها<br />اضغط هنا لتشاهد الموقع الانجليزى"
archived = "2009-02-11"
