subject = "بعد التحية"
text = "نرجو أن تستقيل أنت و حكومتك فورا و أن تتنازل عن الحكم الى لجنة مؤقتة تتألف من رؤساء الأحزاب و بعض الأعضاء المستقلين بمجلس الشعب لحين تعديل الدستور و اجراء انتخابات حرة مفتوحة يختار الشعب من خلالها رئيس الجمهورية و نائبة و رئيس الوزراء و أعضاء الحكومة"
