subject = "كوووووووووسه"
author = "الموضوع ده بيفكرنى بالمقولتين الشهيرتين"
posted = "2006-04-01"
text = "\"يا بلدنا يا عجيبه فيكى حاجه محيرانى نزرع القمح فى سنين تطلع الكوسه فى ثوانى\"<br />المقوله التانيه:<br />\" لو نهر النيل اتقلب صلصه مش هيكفى الكوسه اللى فى البلد\""
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015845/http://masr.20at.com:80/article.php?sid=104&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "زنجولا كاتب القصيدة الاصلي"
author = "noha"
posted = "2006-04-01"
text = "كان مفروض علي الاقل تبلغني قبل ما تاخد القرار بنشرها لان مش انا صاحبت القصيدة .. كمان المفروض تذكر اسم كاتبها احقاقا للحق ... مش انا الي كتبت الكلام ده لان معنديش موهبة الشعر لكن زنجولا صاحب القصيدة و علي الاقل لازم تذكر في العنوان كأقل اعتذار له<br />انا عارفه انك اتصرفت بحسن نية و بجد شكرا انك اهتميت تقرا في مدونتي و كمان تهتم تنقل منها لكن اعطي كل ذي حق حقه .. زنجولا صاحبها مش انا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015845/http://masr.20at.com:80/article.php?sid=104&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 3
subject = "شفتو اخر طبخه كوسه ف البلد..فينك يا مصرى تشوف"
author = "نيفين"
posted = "2006-04-02"
text = "امبارح ف القاهره اليوم طلع علينا عمرو اديب بالخبر التالى<br />اثبت تحليل الصندوق الاسود ان السبب وراء غرق العباره السلام هو القبطان(اللى مات)لانه مبعتش اشارات استغاثه<br />ملحوظه 1:ملحوظه 2 :المركب السلام دى كانت هتتكهن كمان شهر تقريبا<br />ملحوظه 3:لا تعليق<br />ملحوظه 4:ااااااااااااااااااااااه يا بلد"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015845/http://masr.20at.com:80/article.php?sid=104&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

