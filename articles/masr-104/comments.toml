[[comments]]
order = 6
subject = "سيادة المحافظ"
author = "حبيب"
posted = "2006-04-10"
text = "سيادة محافظ الفيوم فى زياره لجامعة الفيوم عندما راى الفتيات يرتدين الحجاب تكرم سيادته وقال ايه ده ده منظر مش حضارىابداامال فين البنطلونات والجيبات والبلوزات العريانه والمهم ان سيادته اسمه محمدنفسى اعرف بس الراجل ده اتعين محافظ للفيوم ليهمع انه من يوم تعيينه ولم يفعل شيئاللبلدالطرقات الداخليه والخارجيه وكله حديقولى مين توسط لتعيينه محافظ للفيوم ولما هو مش هيشتغل يروح يروح بيتهم بقى احسن"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015845/http://masr.20at.com:80/article.php?sid=104&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

