order = 0
subject = "بس فى حاجه"
author = "طماطم"
posted = "2006-03-26"
text = "المشكلة مش فى انك ازاى تلم الناس المشكلة فى ان الناس خايفة اى حد عايز يدخل فى مظاهرة بيخاف عشان قبل مايدخل بيتهوم هيدخل المعتقل مفيش ديمقراطية وبعدين المظاهرات فى الدول التانية بتقدر تطلع بنتيجة لاكن احنا هنا بنزعق وبس<br />ولا حياه لمن تنادى<br />وفى حاجة جميلة اوى عشان احنا طبعا عدد السكان كتير فدا طبعا مكتر الامن المركزى<br />بجد عساكر مفيش عندهم مخ ابدا متبرمجين على الضرب بس سبحان تلاقيهم طلعو منين متعرفش<br />مرة واحده تلاقيهم قدامك<br />وبعدين الشعب تعبان اخرة لقمة عيشة وبس<br />لانه فقد المصداقية فى كل حاجة خلاص مبقاش يصدق حد<br />غير نفسة ولونة ساعات بيشك فى نفسة<br />مصر خلاص ضااااااااااااااااااااااعت<br />واحنا بالتالى ضعنااااااااااااااااااااا"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210440/http://masr.20at.com:80/article.php?sid=75&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "لا ياجماعة"
author = "مخ مخ"
posted = "2006-03-31"
text = "لا ياطماطم<br />مصر لسة ماضعتشى<br />واحنا لسة مضعناش<br />بس انا فى راى ان المشكلة مش فى الحكومة.الحكومة دى مش من برة مصر الحكومة دى من مصر..........والناصح يفهم<br />مشكلة مظاهرة المليون<br />كل الى اتقال الاول دة صح بس لازم نضيف حاجة مهمة جدا<br />ان الشخص المتظاهر دة لازم يكون عامل الى علية فى عملة وبيتقنو حتى لو كان العمل دة بسيط جدا<br />وبالتالى المعادلة تكون<br />انا بعمل الى علية كويس جدا وعاوز مردود دة<br />كرامة احترام<br />والشخص دة مابيتنزلش عن حقو بسهولة<br />وبتالى بنوصل لشخص عندو القدرة انو يتظاااااااااااااااااااااااهر"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210440/http://masr.20at.com:80/article.php?sid=75&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

