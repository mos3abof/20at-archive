subject = "وشهد شاهد من اهلها"
author = "ميدو"
posted = "2006-10-11"
text = "الموضوع ده بيكشف حقيقة العلاقة بين المسلمين والاقباط فى مصر بعيدا عن الرسميات التى حاولت ادارة الحفل جاهدة الالتزام بها ولكن فضحتها عدسة هذا الصحفى بل وكلمة البابا شنودة من ان الوحدة الوطنية لن تتحقق بمجرد حفل افطار سنوى فى رمضان<br />امر اخر اريد التنويه عليه وهو جميل ان نلبى دعوة اخواننا الاقباط لحضور حفل افطار ولكن الذي يدعو للحسرة والتالم مما وصل البه حال المسلمون فيما بينهم ان يلبى شيخ الازهر دعوة الكنيسة ولا يلبى دعوات العديد من الجهات الاسلامية خاصة اذا كانوا اخوان مسلمين وحسبنا الله ونعم الوكيل"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061438/http://masr.20at.com:80/article.php?sid=1036"

