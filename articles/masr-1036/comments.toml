[[comments]]
order = 11
subject = "ولو قدنا صوابعنا شموع"
author = "كيرلس"
posted = "2006-10-13"
text = "عارف ياعم احمد لوقدنا صوابعنا شمع مافيش فايده ..ناس صايمه وناس فاطره مش من ادب الضيافه نسيبهم ياكلوا براحتهم؟؟؟والا نقعد نبحلق فيهم...والا ناكل لقمه ونقوم ونحرجهم..أما من جهة ترابيزات امن الدوله حضرتك جاى تفطر والا جاى تبحلق فى الترابيزات؟؟؟بذمتك ما كان قدامك اللى يكفيك وزياده!!!ومش مكسوف وانت بتكتب الكلام ده؟؟!والله انا مكسوفلك ياراجل....وعموما حقك علينا انشاء الله رمضان الجاى نعمل بنصيحتك...وكل سنه وانت طيب...بس ما تبقاش تبحلق فى الترابيزات تانى<br />كيرلس"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061438/http://masr.20at.com:80/article.php?sid=1036"

[[comments]]
order = 12
subject = "حضرتك صحفى"
author = "كيرلس"
posted = "2006-10-14"
text = "انت عارف يا هوارى الساعه كام دلوقت الساعه اربعه الصبح ..بصراحه مش عارف انام من ساعة ما قريت اللى انت كاتبه ده !!!..حضرتك صحفى؟؟ لو كنت صحفى يبقى لهم حق فعلا يطالبوا بعدم حبس الصحفييين..مش بس كده ..دا اذا كانت الصحافه بالشكل ده الله يخرب بيت اللى يزعل منكم ياراجل علشان لمايبقى صحفى مش عارف يقول كلمة مجامله لناس جاملوه وعزموه على الفطار ..ويطلع يتكلم عليهم بالشكل ده انشالله يكونوااكلوه عيش وجبنه ...انشالله يكونوا فرشوله حصيره!!!ما حدش قالك اتفضل ياسعادة الباشا؟!!!...كل سنه وانت طيب؟؟؟وبعدين ماله النظام؟؟؟لما يبقى الفاطر على ترابيزه..والصايم على ترابيزه...الوزرا على ترابيزه ...ورجال الأمن على ترابيزه...والصحفيين على ترابيزه...انت عايز ايه؟؟؟؟وبعدين يا اخى بصلة المحب خروف زى ما بيقولوا ؟؟والعين القنوعه شبعانه ؟؟؟ما بالك باللى كان قدام سعادتك وواضح فى الصور اللى انت صورتها بنفسك قدام عينيك اهيه؟؟؟وبعدالفطار الناس كلها مع بعض بتتكلم وتتسامر...انت عايز ايــــــه؟؟والمصيبه فى الكورال اللى وراك ..ايوه يابو حميد ايوه يا هوارى ...اعد ياباشا؟؟؟فيه ايه؟؟واهانات للكبير والصغير ...خلاص انطلق ديابها على غنمها؟؟؟والا الأكل كان نى( مش مستوى )...معدة سعادتك ما هضمتوش؟؟؟انا عايز حد منصف من اللى حضرو المأدبه يرد عليك!!!!..ويسمع الكورال اللى شغال وراك ده ايه اللى اتعمل علشان نحتفل بسعادتك؟؟؟...ونفسى ياحضرات الساده الأفاضل كل واحد يبص ويشوف ويفكر قبل مايرد على اى كلام يتقال ..بصوا للصور اللى مقدمهابنفسه واهى قدامكم اهيه...كل جماعه على ترابيزتها..مش دى اداب الضيافه؟؟كل مهنه مع بعضها..مش دى ابسط قواعدالتنظيم؟؟انت مش بتعمل صفحه للحوادث وصفحه للوفيات واول صفحه لرمز الدوله واهم الأحداث ؟؟؟والا انت عام<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061438/http://masr.20at.com:80/article.php?sid=1036"

[[comments]]
order = 13
subject = "تعليق ميدو"
author = "كيرلس"
posted = "2006-10-14"
text = "أرسل هذا التعليق بواسطة : ميدو<br />الموضوع ده بيكشف حقيقة العلاقة بين المسلمين والاقباط فى مصر بعيدا عن الرسميات التى حاولت ادارة الحفل جاهدة الالتزام بها ولكن فضحتها عدسة هذا الصحفى بل وكلمة البابا شنودة من ان الوحدة الوطنية لن تتحقق بمجرد حفل افطار سنوى فى رمضان<br />معلش استحملونى......نفسى اعلق على كل واحد كتب فى الموضوع ده لاكن طبعا مش معقول......انما الا البابا شنوده؟؟؟؟اللى مكتوب فوق ده تعليق الأخ ميدو...واحب اقول لميدو ولكل ميدو لن تجد مثل هذا الرجل ثانيـــــة.....ولا مثل رجلكم الموجود حاليــــــا......لما لهما من خلق كريم وعقليه ناضجه وقلب كبير وخوف على مصلحة هذا البلد.....ومش حقولك ابقى تعالا قابلنى لأنى يمكن اسبقهم لأنى وفيت خدمه لاكن خلى الهوارى يصورلكم الصفحه دى........ وبارك الله فى الهوارى وامثاله............<br />كيرلس"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061438/http://masr.20at.com:80/article.php?sid=1036"

