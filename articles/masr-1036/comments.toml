[[comments]]
order = 17
subject = "الأخ العزيز مصراوى صميم"
author = "كيرلس"
posted = "2006-10-15"
text = "الأخ العزيز مصراوى صميم<br />انا معاك انه شئ مثير للأشمئزاز فعلا بل والشعور بالمراره والأسى ولكن ليس من اجل عدم وجود الفاكهة على بعض الموائد كما تقول ولكن على عدم وجود الوفاء داخل القلوب وعلى النفوس الضعيفه التى تبحث عن الهفوات كى ما تجعل منها قصص وحكاوى ، سؤال من فضلك..وانت تدعى انك مصراوى صميم كما تقول.. يعنى راجل ريفى وشعبى ،هل عندما تذهب الى وليمه تنظر فيما حولك من اطباق؟؟؟عيناك تبحث فى زواياالموائد؟؟ان ما كتب لهو اكبر دليل على نية مبيته للبحث عن حجج واهيه لضرب كل ما هو جميل بين الأخوه...الم تسمع بان المحبه تستر كل العيوب..الا تعرف ان العين البسيطه عين نيره؟؟؟ان ابسط اداب المائده ان لا تنظر الا لما قدم لك...اليس كذلك؟؟؟وابسط اداب الضيافه ان تشكر المضيف على ماقام به نحوك مهما كان بسيطا؟؟وابسط اداب التعامل ان تعتذر بلباقه عندما لا تكون راغبا فى الحضور؟؟؟وابسط امثلة المصراوى الصميم (( بصلة المحب خروف))...مش كده والا ايـه يامصراوى ..................<br />أما بقى عن رفع الأدان ...انت أمرك غريب قوى هوه احنا اللى بنرفع الأدان برضه؟؟؟دا كلام تقوله....وعموما أسفين جدا يامصراوى عما سببناه لك من اشمئزاز...اما انك تطالبنا بأن احنا عشان خاطر سعادتك نلغى مشاعرناونلغى صداقتنا...دا شئ انت لا تملكه...وان كنت حضرتك لا تستطيع ان تشعر بصدق المشاعر فهناك الملايين نشعر بمحبتهم لنا ويشعرون بمحبتنالهم ...رغم انف المغرضين...ولن تفرقنا عنهم اراء فرديه ..وعايز اقولك ياما قضينا رمضان مع اصدقائنا فى المدرسه وف الشغل ..وياما لعبنا كوره على الأضواء الكاشفه..وياما كنا بنفضل طول النهار مع اصدقائنا فى العمل من غير اكل او شرب مش عشان صايمين رمضان..وانما مراعاة لمشاعر الصايمين...وعلى اى حال انشاء الله السنه ال<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061438/http://masr.20at.com:80/article.php?sid=1036"

