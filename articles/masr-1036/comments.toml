author = "كيرلس"
posted = "2006-10-16"
text = "اظن دا سؤال مش فى محله ابدالأنه مفهوم من سياق الحديث أننا أصدقاء من الأزل بل اننا احباء واوفياء وان كان هناك اقلية حاقده تكره حتى نفسها فهناك اغلبية محبة وفيةأصيلة تعرف اننا اقرب الناس اليها مودة وان منا قسيسين ورهبان لا يستكبرون ..أغلبية تجرى الينا ونجرى اليها فى وقت الشده ..تستر ضعفاتنا واخطاؤنا ان أخطأنا ونستر عيوبها وضعفاتها ان هى أخطأت (( فالورد هى تلك المشاعر النبيلة والفياضه التى بيننا والعليق هى تلك الهفوات التى نغفرها ونتغاضى عنها كى لا تعكر صفونا)) لعلك تدرك وتفهم اننا جسد واحد له روحان لا يستطيع احد فصلهما الا بتمزيق ذاك الجسد الذى يضمناســـــويا...هلا ادركت؟؟؟؟؟؟؟؟<br />سؤال لسعادتك ليتك تجيب عليه بشجاعه :<br />هل نظرت الى الصور المعروضه؟؟؟لقد تم تصوير الموائد الخاصه بالوزراء وعليها الطعام والشراب فى حين تم تصوير باقى الموائد وهى فارغه بعد ان تم رفع الأطعمه من فوقها ...ولا تقل انه تم تصويرها قبل وضع الطعام عليها لأن بقع الطعام ظاهرة على المفارش؟؟؟؟؟انظر جيدا الى الصور المعروضه؟؟؟؟؟؟؟؟اليس ذلك من اجل طمس الحقيقه ولغرض بنفس يعقوب؟؟؟؟؟<br />مجرد ملحوظه لا حظتها وانا اتابع للمره المائه تلك التعليقات لأقف على سبب واحد معقول يجعل الكاتب يكتب هذه الكلمات؟؟؟؟؟؟؟؟؟؟؟؟ولم اجد الا انه لغرض فى نفس يعقوب...ولكن من اجل محبتنا لك وللجميع ..ومن اجل نقاء نفوسنا..ولا تتعجب من ذلك فاننا اذا كنا قد اوصينا بمحبة حتى الأعداء.. الا نحب الأخوة والأصدقاء خاصة وان غالبية منهم شرفاء نبلاء...لم ننتظر منك شكر على محبتنا..وايضا لم نتوقع منك اهانة لكرم ضيافتنا..سامحك الله<br />كيرلس"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061438/http://masr.20at.com:80/article.php?sid=1036"

