[[comments]]
order = 22
subject = "لاتغضب"
author = "اشرف"
posted = "2006-10-20"
text = "الاخ العزيز :كيرلس احييك على وطنيتك الجياشه وحبك لبلدك واهل بلدك وارجو الا تغضب لبعض التعليقات واعلم ان الهدف من الموضوع هو ليس الاستهزاء من مائدة الوحده الوطنيه بقدر ماهو خيبة امل لما يمر بحال المسلمين والا قباط فى هذا البلد --فكم كنا نتمناها مائدة وحده وطنيه شعبيه خاليه من اى رسميات -- وانا متاكد ان الكاتب لم يقصد السخريه من نوعية الطعام او ماشابه ذلك بل المقصود ان تكون مائده واحده بدون ترتيب للكراسى والترابيزات حتى تكون رمزا للوحده وعلى كلا -- فليس حفل افطار اوغداء هو ماسيعبر عن تلاحم امه مضى عليها الف وربعمائة عام وهى فى رباط مقدس - فنسال المولى سبحانه وتعالى ان يجنب مصر الفتن ماظهر منها وما بطن انه الولى على ذلك والقادرعليه"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061438/http://masr.20at.com:80/article.php?sid=1036"

[[comments]]
order = 23
subject = "مجرد راى فقط!"
author = "واحد معدى ومش فارق معاه"
posted = "2006-11-01"
text = "مع الاسف موقعكم هذا يشجع على التعصب و الكراهيه الى ابعد الحدود ، ويكاد يكون هناك شله او اتنين مسيطرين على مجريات الاحاديث و المواضيع ، بحيث تكون المواضيع موجهه الى اشياء محدده و للترويج لاراءاو افراد بعينهم ، وواضح جدا ان اى راى مخالف يقابل بالسخريه و السباب ( الخارج تماما عن حدود الادب فى اغلب الاحيان ) ، اما والحال هكذا فاقترح ان يتحول هذا الموقع الى موقع خاص ويكون المشاركه فيه عن طريق التسجيل ، ويتم التسجيل وفقا للشروط التى يرتضيها اصحاب الموقع و مؤيديهم.<br />ولكن ان تجعلوه موقعا مفتوحا يدعى القائمين عليه دعم الحريات و تكون النتيجه هذا ( التحرش اللفظى ) الذى قلما يخلو منه موضوع ، فهذا قمه التناقض فى رايي اذ ماذا تركتم لمن تنتقدوهم فى هذه الحاله وانتم تمارسون سياسه قمعيه ولكن عن طريق النت هذه المره.<br />اعرف ان كلامى هذا سيقابل بالسخريه و التعليقات المعتاده ، ولكن اعلموا ان الاناء بما فيه ينضح فان كنت ترد بالسباب فهذا يرجع الى مدى سلوكك و التزامك الخلقى و الدينى قبل كل شىء ، فالسباب لن يضيرنى فى شىء ، ولكنه كلام اخرجته و سيحسب عليك و ستحاسب عليه.<br />وانى لاتعجب من وجود تعليقات قد تورد على رد فيه مثلا الاساءه للدين الاسلامى ، فتجد من يرد يقول فيما معناه (واسف للتعبير): كله الا الدين الاسلامى يا ابن الوسخه !!!<br />كيف ؟؟؟ كيف يا اخى يتفق دفاعك عن الدين مع ترديدك لمثل هذه الالفاظ القذره ، كيف وانت تدافع عن الدين تكون اول الخارجين عليه و على تعاليمه ؟؟؟؟"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061438/http://masr.20at.com:80/article.php?sid=1036"

