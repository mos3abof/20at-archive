subject = "إلي القاضي: فضحتنا كفاية"
author = "قاضي زميل"
posted = "2006-05-19"
text = "الزميل الفضل \" القاضي \"<br />يبدو أنك غير أهل للرد على سيادة نائب الدولة الفاضل.<br />فأنت كأغلب أرباب الدفعات التكميلية عندنا لا تعلم شئ عن التاريخ القضائي.<br />يا زميلي إن هيئة قضايا الدولة هي و بحق أعرق و أعظم الهيئات القضائية و لو عاد بي الزمن لوددت الإلتحاق بهاحتى لا أضار من جهل أمثالك من القضاة و من أفعا أمثال مكي و بسطاويسي التي فضحتنا.<br />أترك الشرفاء من السادة مستشاري قضايا الدولة في حالهم حتى يتمكنوا من أداء مهامهم الرفيعة و الخطيرة من أجل مصر و شعبها.<br />و يكفي ما آل إليه القضاء بسبب جهل أمثالك.<br />إذا كنت لا تعلم فلا تتكلم حتى لا يحرجك أستاذتك الهظماء من مدرسة الهيئات القضائية \" هيئة قضايا الدولة\""
