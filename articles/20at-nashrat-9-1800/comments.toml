subject = "بالجزمة"
author = "مصري"
posted = "2006-02-21"
text = "لقد بدأت مرحلة عقاب صوت الأمة علي الدور الذي لعبته في انتخابات الرئاسة والانتخابات البرلمانية حيث فضحت التزوير وكشفت زيف الحياة السياسية ورفعت سقف الحرية وكانت ـ ومازالت ـ سيفا مسلطا علي رقبة الفاسدين والمزورين والمزيفين. إن ما يحدث الآن يتمشي مع التهديدات التي هددنا بها بعض المسئولين من قبل حيث قالوا بالحرف الواحد: اصرخوا وأفرغوا ما في صدوركم حتي تنتهي الانتخابات الرئاسية والبرلمانية قولوا كل ما لديكم ولكن بعد الانتخابات سنعاملكم بالجزمة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145609/http://www.20at.com/article2.php?sid=477"

