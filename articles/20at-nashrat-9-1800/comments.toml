order = 23
subject = "هيئة قضايا الدولة اعرق الهيئات القضائيه"
author = "المستشار الجمهورى"
posted = "2006-05-20"
text = "ومن حيث انه متى كان ما تقدم فإن تحديد المقصود بعبارة \"اعضاء الهيئات القضائية\" فى تطبيق احكام الفقرة الثانية من المادة (24) من القانون المذكور لا يمكن ان يأتى بمعزل عن تحديد قصد الدستور من عبارة\"اعضاء من هيئة قضائية\" الورادة بالمادة(88) منه، و هو ما يمكن استخلاصه مما ورد متعلقا بهذه الهيئات باحكام الفصل الرابع من الباب الخامس من الدستور و من الاعمال التحضرية لها حيث يبين ان الدستور بعد ان قرر ان السلطة القضائية مستقلة و تتولاها المحكام على اختلاف انواعها و درجاتها اشار الى الهيئات القضائية فى ثلاثة مواضع على النحو التالى:<br />الاول: و قصد به تمييز بعض جهات القضاء عن جهة القضاء العادى التى تضم المحكام على اختلاف انواعها و درجاتها ، و هو ما ورد بالمادة (172) من ان مجلس الدولة هيئة قضائية مستقلة و يختص بالفصل فى المنازعات الادارية و فى الدعاوى التأديبية و يحدد القانون اختصاصاته الاخرى ، و ما ورد بالمادة (174) من ان المحكمة الدستورية العليا هيئة قضائية مستقلة قائمة بذاتها فى جمهورية مصر العربية ، و مقرها القاهرة.<br />الثانى: وبمقتضاه قوض الدستور القانونى فى تحديدالهيئات القضائية و اختصاصاتها و تنظيم طريقة تشكيلها و شروط و اجراءات تعيين اعضائها و نقلهم (مادة 167).<br />الثالث: و يقضى بوجود مجلس اعلى يقوم على شئون الهيئات القضائية يرأسه رئيس الجمهورية على ان يبين القانون طريقة تشكيله و اخنصاصاته و قواعد سير العمل فيه و ان يؤخذ رايه فى مشروعات القوانين التى تنظم شئون الهيئات القضائية(مادة 173).<br />و يبين مما سلف ان الدستور لم يتناول بالحصر و التحديد كل ما يعتبر هيئة قضائية و انما خول القانون هذا التحديد ، يؤيد ذلك ما ورد بمحاضر اجنماع اللجنة التحضيرية للدستور ( لجنة نظام الحكم – الاجتماع الثالث عشر بتاريخ 2761971 و الاجتماع الرابع عشر فى 28/6/1971) بشأن الضمانات الدستورية للقضاة وتحديد المقصود بالهيئات القضائية ، اذ ظهر اتجاه الى تحديدها فى الدستور بمسمياتها: القضاء العادى و النيابة العامة و مجلس الدولة و ادارة قضايا الحكومة، و النيابة الادارية، بيد انه عدل عن هذا الاتجاه تقديرا بان العرف لم يجر به ، بحسبانه من الامور المتروكة للتشريع العادى كما يبين ان الدستور قنن قيام المجلس الاعلى للهيئات القضائية-دستوريا- و الذى كان قائما قبل صدور الدستور و ذلك بموجب قرار رئيس الجمهورية بالقانون رقم 82 لسنة 1969 و من بين اعضائه رئيس المحكمة الدستورية العليا، رئيس محكمة النقض،رئيس مجلس الدولة، رئيس هيئة قضايا الدولة و رئيس هيئة النيابة الادارية.<br />و تنفيذا لتوجيهات الدستور فى هذا المجال اصدر المشرع قوانين بإعادة تنظيم كل من السلطة القضائية و الهيئات القضائية المختلفة على الترتيب التالى تاريخيا:<br />- قانون السلطة القضائية رقم 47 لسنة 1972 متضمنا النص فى المادة (1) منه على ان مجلس الدولة هيئة قضائية مستقلة تلحق بوزير العدل.<br />- قانون المحكمة الدستورية العليا رقم 48 لسنة 1979 مقررا بالمادة (1) منه ان المحكمة الدستورية العليا هيئة قضائية مستقلة قائمة بذاتها فى جمهورية مصر العربية.<br />- القانون رقم 10 لسنة 1986 بتعديل القانون رقم 75 لسنة 1963 فى شان تنظيم ادارة قضايا الحكومة متضمنا النص فى المادة (1) على ان هئية قضايا الدولة هئية قضائية مستقلة تلحق بوزير العدل.<br />- فبعد ان اشار تقرير لجنة الشئون الدستورية و التشريعية عن مشروع القانون المذكور الى العبء الواقع على ادارة قضايا الحكومة ، اضاف انه لمواجهة هذا العبء و ضمان الحيدة فى ادائه على الوجه الاكمل كان من الواجب على الدولة ان تكفل لهذه الادارة من الاستقلال ما كفلته لسائر الهيئات القضائية الاخرى و ان توفر لاعضائها الضمانات اللازمة التى تمكنهم من اداء عملهم باطمئنان و من ثم رؤى استبدال عبارة\"هيئة قضايا الدولة\" بعبارة \" ادراة قضايا الحكومة\" و نص المشروع على ان هيئة قضايا الدولة هيئة قضائية مستقلة تلحق بوزير العدل و ان هذا الالحاق لا يمس استقلال الهيئة و لا ينطوى على معنى التبعية انما قصد به تحديد المسئول عنها سياسيا .<br />- القانون رقم 12 لسنة 1989 بتعديل بعض احكام القانون رقم 117 لسنة 1958 بإعادة تنظيم النيابة الادارية و المحاكمات التأديبية \"مادة 1 النيابة الادارية هئية قضائية مستقلة تلحق بوزير العدل\" .<br />- قد تضمن تقرير لجنة الشئون الدستورية و التشريعية عن مشروع القانون المذكور انه لمواجهة ما يقع على النيابة الادارية من أعباء ، و ضمانا للحيدة فى ادائها للرسالة المنوطة بها على الوجه الاكمل كان من الواجب على الدولة ان تكفل للنيابة الادارية الاستقلال كما كفلته لسائر الهيئات القضائية و ان توفر لاعضائها الضمانات اللازمة التى تمكنهم من اداء عملهم بحيدة و اطمئنان، و تاكيدا لاستقلال النيابة الادارية حرص المشروع على النص بالمادة(1) على انها هيئة قضائية مستقلة تلحق بوزير العدل.<br />- و حيث ان المستخلص مما تقدم ما يلى :-<br />(1) ان مصطلح\" الهيئة القضائية \"فى النظام القانونى المصرى ان هو الا اسم جنس تندرج تحته عدة انواع ،منها جهات تمسك بزمام العدالة و تنفرد على وجه الاستقلال بالفصل فى القضايا على أسس موضوعية وفقا لقواعد اجرائية تكون منصفة فى ذاتها، بما يكفل الحماية الكاملة لحقوق من يلذون بها و اخصها المحكمة الدستورية العليا و محاكم جهتى القضاء العادى و الادارى بمختلف درجاتها و منها جهات قائمة بذاتها و هى و ان لم يعهد ا"
