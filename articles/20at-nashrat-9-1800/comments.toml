text = "من المفروض ان القضاه يحاكمون الريس ده لمايقدمه مجلس الشعب للمحكمه بس بدل مجلس الشعب فى جيب الريس فلا حياه لمن تنادى فلما يحصل تذوير فى الانتخابات عشان يفوزوا ناس ويخسروا ناس يعنى فيش اى راى للشعب فمش هتفرق بقى حريه القضاه او اى حاجه يا جماعة يحزننى ان اقل اننا شعب ملناش لزمه فى الدولة الحزب الوطنى بيعمل الى هو عايزه مسيطر على المحكمة والصحافة ويسرق وينهب ويغيروا فى نظام التعليم والضرائب والمرتبات ويخدوا الى هما عايزينه من الدوله ومحدش يقف قصدهم يعنى احنا لازم يبقى لينا دور mona_mohamad10@yahoo.com"
