subject = "من القضاه مغفلين"
author = "samx6"
posted = "2006-06-01"
text = "الباب الثالث عشر في ذكر المغفلين من القضاة من كتاب اخبارالحمقي و المغفلين<br />ابو الفرج الجوزي<br />قاضٍ لا يميز بين المدح والهجاء‏:‏ عن ابن الأعرابي قال‏:‏ خاصم أبو دلامة رجلاً إلى عافية فقال‏:‏ المتقارب‏:‏ لقد خاصمتني غواة الرجال وخاصمتهم سنةً وافيه فمن كنت من جوره خائفاً فلست أخافك يا عافيه فقال له عافية‏:‏ لأشكونك لأمير المؤمنين قال‏:‏ لم تشكوني قال‏:‏ لأنك هجوتني‏.‏<br />قال‏:‏ والله لئن شكوتني إليه ليعزلنك قال‏:‏ لم قال‏:‏ لأنك لا تعرف الهجو من المدح‏.‏<br />عافية هذا هو ابن زيد القاضي ولاه المهدي القضاء على بغداد‏.‏<br />قاضٍ عزل نفه‏:‏ قال‏:‏ حدث عبد الرحمن بن مسهر قال‏:‏ ولاني القاضي أبو يوسف القضاء بجبل‏.‏<br />وبلغني أن الرشيد منحدر إلى البصرة فسألت أهل جبل أن يثنوا علي فوعدوني أن يفعلوا ذلك وتفرقوا فلما آيسوني من أنفسهم سرحت لحيتي وخرجت فوقفت له فوافى وأبو يوسف في الحراقة فقلت‏:‏ يا أمير المؤمنين نعم القاضي قاضي جبل قد عدل بينا وفعل وصنع وجعلت أثني على نفسي فرآني أبو يوسف فطأطأ رأسه وضحك فقال هرون‏:‏ مم تضحك فقال‏:‏ إن المثني على نفسه هو القاضي‏.‏<br />فضحك هرون حتى فحص رجليه وقال‏:‏ هذا شيخ سخيف سفلة فاعزله فعزلني‏.‏<br />الأمير أخر الجمعة‏:‏ عن علي بن هشام أنه قال‏:‏ كان للحجاج قاضٍ بالبصرة من أهل الشام يقال له أبو حمير فحضرت الجمعة فمضى يريدها فلقيه رجل من العراق فقال له‏:‏ يا أبا حمير فأين تذهب قال‏:‏ إلى الجمعة فقال‏:‏ ما بلغك أن الأمير قد أخر الجمعة اليوم فانصرف راجعاً إلى بيته فلما كان من الغد قال له الحجاج‏:‏ أين كنت يا أبا حمير لم تحضر معنا الجمعة قال‏:‏ لقيني بعض أهل العراق فأخبرني أن الأمير أخر الجمعة فانصرفت‏.‏<br />فضحك الحجاج وقال‏:‏ يا أبا حمير أما علمت أن الجمعة لا تؤخر‏.‏<br />لا يفرق بين العم والخال‏:‏ قال المدائني‏:‏ استعمل حيان بن حسان قاضي فارس على ناحية كرمان فخطبهم فقال‏:‏ يا أهل كرمان تعرفون عثيمان بن زياد هو عمي أخو أمي‏.‏<br />فقالوا‏:‏ فهو خالك إذن‏.‏<br />قال ابن خلف‏:‏ وسقط الذباب على وجه قاضي عبدان فقال‏:‏ كثر الله بكم القبور‏.‏<br />قال ابن خلف‏:‏ قال بعض الرواة‏:‏ تقدم رجلان إلى أبي العطوف قاضي حران فقال أحدهما‏:‏ أصلح الله القاضي هذا ذبح ديكاً لي فخذ لي بحقه فقال لهما القاضي‏:‏ عليكما بصاحب الشرطة فإنه ينظر في الدماء‏.‏<br />قال أبو الفضل الربعي‏:‏ حدثنا أبي قال‏:‏ سأل المأمون رجلاً من أهل حمص عن قضاتهم قال‏:‏ يا أمير المؤمنين إن قاضينا لا يفهم وإذا فهم وهم قال‏:‏ ويحك كيف هذا قال‏:‏ قدم عليه رجل رجلاً فادعى عليه أربعة وعشرين درهماً فأقر له الآخر فقال‏:‏ أعطه قال‏:‏ أصلح الله القاضي إن لي حماراً اكتسب عليه كل يوم أربعة دراهم أنفق على الحمار درهماً وعلي درهماً وأدفع له درهمين حتى إذا اجتمع ما له غاب عني فلم أره فأنفقتها وما أعرف وجهاً إلا أن يحبسه القاضي إثنا عشر يوماً حتى أجمع له إياها فحبس صاحب الحق حتى جمع ماله فضحك المأمون وعزله‏.‏<br />حلف الجار بدل المتهم‏:‏ وعن أبي بكر الهذلي قال‏:‏ كان ثمامة بن عبد الله بن أنس على القضاء بالبصرة قبل بلال بن أبي بردة وكان مخلطاً فاستدعت امرأة إلى ثمامة على رجل أودعته شيئاً ولم يكن لها بينة فأراد استحلافه لها فقالت‏:‏ إنه رجل سوء فيحلف ويذهب حقي ولكن استحلف إسحاق بن سويد فإنه جاره فأرسل إلى إسحاق واستحلفه‏.‏<br />قاضٍ يحكم بالقرعة‏:‏ وحكى أبو الخير الخياط عن بعض أصحابه قال‏:‏ دخلت تاهرت فإذا فيها قاضٍ من أهلها وقد أتى رجل جنى جناية ليس لها في كتاب الله حد منصوص ولا في السنة فأحضر الفقهاء فقال‏:‏ إن هذا الرجل جنى جناية وليس لها في كتاب الله حكم معروف فما ترون فقالوا بأجمعهم‏:‏ الأمر لك قال‏:‏ فإني رأيت أن أضرب المصحف بعضه ببعض ثلاث مرات ثم أفتحه فما خرج من شيء عملت به قالوا له‏:‏ وفقت‏.‏<br />ففعل بالمصحف ما ذكره ثم فتح فخرج قوله تعالى‏:‏ ‏\"‏ سنسمه على الخرطوم ‏\"‏ فقطع أنف الرجل وخلى سبيله‏.‏<br />شاهد واحد يثبت نصف الحق‏:‏ وبلغنا أن رجلاً قدم رجلاً إلى بعض القضاة فادعى عليه بثلاثين ديناراً وأقام شاهداً واحداً فقال القاضي‏:‏ إدفع له خمسة عشر ديناراً إلى أن يقيم الشاهد الآخر‏.‏<br />ما معنى السدس‏:‏ وحكى فقيه من رفقائنا قال‏:‏ حضر عندي أمين من أمناء القاضي فسألني عن فريضة فيها سدس فقال‏:‏ ما معنى السدس قلت له‏:‏ من الدينار ثلاثة قراريط وحبة وسهم من ستة أسهم هذا هو السدس فقال‏:‏ أكتبه لي حتى أعرفه قلت‏:‏ والله لا أكتبه لك‏.‏<br />في ذكر المغفلين في الكتاب والحجاب أخطأ الكاتب فكانت جريمة‏:‏ حدثني حماد بن إسحاق قال‏:‏ كتب سليمان بن عبد الملك إلى أبي بكر بن حزم أن أحص من قبلك من المخنثين فحصف كاتبه فقال أخص فدعا بهم فخصاهم‏.‏<br />وقد رويت لنا هذه الحكاية على غير هذا الوجه وأنه خصاهم لأنه كان غيوراً فإذن لا يكون تصحيفاً‏.‏<br />الكاتب الأحمق‏:‏ وعن الحسين بن السميدع الأنطاكي قال‏:‏ كان عندنا بإنطاكية عامل من حلب وكان له كاتب أحمق فغرق في البحر شلنديتان من مراكب المسلمين التي يقصد بها العدو فكتب ذلك الكاتب عن صاحبه إلى العامل بحلب بخبرهما‏:‏ بسم الله الرحمن الرحيم إعلم أيها الأمير أعزه الله تعالى إن شلنديتين أعني مركبين قد صفقا من جانب البحر أي غرقا من شدة أمواجه فهلك من فيهما أي تلفوا قال‏:‏ فكتب إليه أمير حلب‏:‏ بسم الله الرحمن الرحيم ورد كتابك أي وصل وفهمناه أي قرأناه أدب كاتبك أي إصفعه واستبدل به أي اعزله فإنه مائق أي أحمق والسلام أي انقضى الكتاب‏.‏<br />وعن عبد الله بن محمد الصوري قال‏:‏ رأيت سهل بن بشر الكاتب يوماً وقد نعق غراب أبقع على حائط صحن الدار فضاق صدره وقال‏:‏ هاتم البواب فجيء به فقال‏:‏ لم تركت هذا الغراب يصيح ها هنا فقال البواب‏:‏ أيها الأستاذ وأي ذنب لي أنا أحفظ بابي وليس هذا ممن يدخل من الباب فيلزمني جنايته فكيف أستطيع منعه من الصياح فقال‏:‏ قفاه فما يصفع صفعاً عظيماً إلى أن شفعت فيه‏.‏<br />شهادتكم بيوم الفطر تؤدي إلى عقابكم‏:‏ وعن أبي علي النميري قال‏:‏ تراءينا هلال شوال فأتينا سوار بن عبد الله لنشهد عنده فقال حاجبه‏:‏ أنتم مجانين الأمير لم يختضب بعد ولم يتهيأ ولئن وقعت عينه عليكم ليضربنكم مائتين انطلقوا فانصرفنا وصام الناس يوم الفطر‏.‏<br />لا تقبل شهادة الأحمق التقي‏:‏ وعن أبي بكر النقاش قال‏:‏ قيل لعبد الله بن مسعود القاضي‏:‏ تجيز شهادة العفيف التقي الأحمق قال‏:‏ لا وسأريكم هذا ادع يا غلام أبا الورد حاجبي وكان أحمق فلما أتاه قال‏:‏ اخرج فانظر ما الريح فخرج ثم رجع فقال‏:‏ شمال يشوبها جنوب فقال‏:‏ كيف ترون أتروني وعن أبي أحمد الحارثي قال‏:‏ كنت أعاشر بعض كتاب الديلم فسمعته مرة يحلف ويقلو‏:‏ والله الذي لا إله إلا هو أعني به الطلاق والعتاق‏.‏<br />القائد ثور وامرأته بقرة‏:‏ قال‏:‏ وكتب مرة بحضرتي تذكرة بأضاحي يريد تفريقها في دار صاحبه وقد قرب عيد الأضحى فكتب‏:‏ القائد ثور امرأته بقرة ابنه كبش ابنته نعجة الكاتب تيس فقلت‏:‏ يا سيدي الروح الأمين ألقى إليك هذا فلم يدر ما خاطبته به وسلمت منه‏.‏<br />رسالة إلى صديق‏:‏ وكتب إلى صديق له‏:‏ كتبت إليك هذه الكلمات يا سيدي وربي أعني به قميصي من منزلك الذي أنا أسكنه وقد نفضت الدم من قفاك المرسوم بي وليس وحق رأسك الذي أحبه عبدي من نبيذك الذي تشربه شيء فوجه إلي على يدي هذا الرسول فإنه ثفة أوثق مني ومنك‏.‏<br />قال أبو أحمد‏:‏ وبلغني عن بعض قواد الديلم أنه قال‏:‏ كاتبي أحذق الناس بأمر الدواب والضياع وشري الأمتعة وما فيه عيب إلا أنه لا يقرأ ولا يكتب‏.‏<br />وعن عبد الله بن إبراهيم الموصلي قال‏:‏ نابت الحجاج في صديق له مصيبة ورسول لعبد الملك شامي عنده فقال الحجاج‏:‏ ليت إنساناً يعزيني بأبيات فقال الشامي‏:‏ أقول قال‏:‏ قل فقال‏:‏ وكل خليل سوف يفارق خليله يموت أو يصاب أو يقع من فوق البيت أو يقع البيت عليه أو يقع في بئر أو يكون شيئاً لا نعرفه فقال الحجاج‏:‏ قد سليتني عن مصيبتي بأعظم منها في أمير المؤمنين إذ وجه مثلك لي رسولاً‏.‏<br />أطلق الحمار أعزك الله‏:‏ وجد في بعض الكتب أن قدامة بن زيد وجه غلاماً له إلى قطربل ليبتاع له شراباً وأركبه حماراً فمضى الغلام وابتاع له الشراب فلما صار إلى باب قطربل عارضه صاحب المصلحة فضربه وأراق ما معه وحبسه فاتصل الأمر بقدامة فكتب إلى صاحب الخبر‏:‏ بسم الله الرحمن الرحيم جعلت فداك برحمته فإن صاحب مصلحتين قطربل قويا على غلام لي فضرباه خمسين رطلاً من تقطيع الزكرة فرأيك أعزك الله في إطلاق الحمار مصاباً إن شاء الله عز وجل‏.‏<br />رسالة إلى طبيب‏:‏ وكتب بعضهم إلى طبيب‏:‏ بسم الله الرحمن الرحيم ويلك يا يوحنا وامتع بك قد شربت الدواء خمسين مقعداً المغص والتقطيع يفتل بطني والعينين والرأس فلا تؤخر باحتباسك عني فسوف تعلم أني سأموت وتبقى بلا أنا فعلت موفقاً إن شاء الله‏.‏<br />عملت يا طبيب بوصفك فلم يفد‏:‏ وصف حجاج بن هرون الكاتب لحنين النصراني علة به فأمره أن يؤخر غداءه ويأخذ في آخر الليل دواء وصفه له فكتب إليه حجاج من غد‏:‏ بسم الله الرحمن الرحيم وأتم نعمته عليك شربت الدواء وأكلت قليل كسرة واختلف أحمر مثل السلق مغصاً فرأيك في إنكار ذلك على بطني فعلت إن شاء الله‏.‏<br />رسالة مختصرة إلى صديق‏:‏ وكتب بعضهم إلى صديق له‏:‏ بسم الله الرحمن الرحيم وجعلني الله فداءك لولا علة نسيتها لسرت إليك حتى أعرفك بنفسي والسلام‏.‏<br />رسالة اعتذار‏:‏ وكتب المتوكل إلى محمد بن عبد الله يطلب فهداً فكتب إليه‏:‏ نجوت عند مقام لا إله إلا الله وصلى الله على سيدنا محمد فديته إن كان عندي مما طلبته وزن دانق لا فهد ولا نمر فلا تظن يا سيدي إني أبخل عليك بالقليل‏.‏<br />وكتب معاوية بن مروان إلى الوليد بن عبد الملك‏:‏ قد بعثت إليك خزاً أحمر وأحمى‏.‏<br />نحن في خير ولكن قتل أكثر الأسرة‏:‏ وكتب رجل من البصرة إلى أبيه‏:‏ كتبت إليك يا أبت نحن كما يسرك الله عونه وقوته لم يحدث علينا بعدك إلا كل خير إلا أن حائطاً لنا وقع على أمي وأخي الصغير وأختي والجارية والحمار والديك والشاة ولم يفلت غيري‏.‏<br />وكتب أبو كعب إلى منزله كتاباً عنوانه‏:‏ من أبي كعب يدفع عنوانه في عياله إن شاء الله‏.‏<br />رسالة من ولد ملك‏:‏ وكتب بعض ولد الملوك إلى بعض‏:‏ استوهب الله المكاره فيك برحمته أنا وحق جدي رسول الله الذي لا إله إلا هو أحبك أشد من جدي المتوكل فقد بلغني أنه قد جاءك من النبيذ شيء كثير كثير شطراً وأنا أحبه شديد شديد شطراً آخر وبحياتي عليك ألا بعثت إلي دستجة أو خمس دبات أو ستة أو سبعة أو أكثر جياد بالغة وإلا فثلاث خماسيات ولا تردني فأحرد موفقاً"
