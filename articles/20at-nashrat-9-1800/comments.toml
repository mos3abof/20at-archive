text = "فرنداى ووكا فى الدزرتس لوللى ..فانى فى لف جريتنج مشعلل .<br />اذا انت سكرفت فى الف عاشقا ..رممت حزين الهارت فى ايفرى محفل .<br />تدارين لفا ان ذا هارت و انما .. ثرو الايس ان يور فايس ذى ات كليرللى .<br />ساقضى حياتى فيثفاللن للفها ..و سانشيمولن فرى ليتل التحمل .<br />و لفى بج فرى بجن بليف مى ..<br />ادندنه لونلى و فيرى جويفلى .<br />الفك لفان فى البللد مساره ..<br />و هارتى ماى دارلينج سريع الترنبل.<br />فهومى ايجبت و هومك لندنن ..<br />و بيتويننا الدستنس فايرى مطول ."
