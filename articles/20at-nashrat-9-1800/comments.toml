subject = "الى السيد نائب الدولة"
author = "القاضى"
posted = "2006-05-19"
text = "بالمناسبة هذه مجموعه من القرارات الجمهورية بعزل بعض من السادة اعضاء هيئتكم الموقرة<br />1- لتشريع رقم 191 لسنــة 2003 نشر بتاريخ 24 / 07 / 2003<br />بيان التشريع :<br />بشأن عزل السيد / ...............- النائب بهيئة قضايا الدولة .<br />بصمة التشريع :<br />محمد حسنى مبارك - رئيس الجمهورية<br />2-لتشريع رقم 209 لسنــة 2003 نشر بتاريخ 21 / 08 / 2003<br />بيان التشريع :<br />بشأن عزل السيد/ ...............النائب بهيئة قضايا الدولة .<br />بصمة التشريع :<br />محمد حسنى مبارك - رئيس الجمهورية<br />و هذه العقوبة لا يعرفها القضاة يا معالى الفقية و من ثم فلا تتحدث بما لا تعلم مرة ثانية<br />و انا احسست من كلامك بصراحة انك تغير جدا من القضاة لانك واقف امام المنصة و هم جلوس طب ما ده امر طبيعى لانك محامى للحكومة و تتساوى تماما مع اى محامى اخر من المحامون و هذا تطبيقا لمبدا المساواة بين الخصوم يا استاذ ده اذا كنت تعرفه و لا يوجد لمعاليك ميزة عن غيرك من الخصوم الاخرين و كونك نائبا عن الدولة لا يضفى عليك اى ميزة اخرى زيادة عن الخصم الطبيعى و هذا تطبيقا لمبدا خضوع الدولة للقانون و من ثم فلا مبرر لغيرتك الشديدة من القضاء الجالس و الدليل على غيرتك هو قولك (وده ليه تعرف عشان انتم اوسخ جيل من اجيال القضاه ويا الف خسارة لما الحمير يقعدوا على المنصه وهما مش بيفهموا حاجة ) و هو ابلغ دليل على كونك مشتاقا للجلوس على المنصة و لكن اعلم يا استاذ ان اولى شروط القضاء هو العلم و انت تفتقده و ثانيها هو الاخلاق و رسالتك دالة عليك و من ثم فارضى بما قسمة الله لك و اقنع بمكانك مع القضاء الواقف و اعلم بان السادة المحامون على ما فيهم فانهم لم يتردوا الى مثل ما انحدرت فيه نفسك فارضى و لا تكن من الساخطين و السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145609/http://www.20at.com/article2.php?sid=477"

