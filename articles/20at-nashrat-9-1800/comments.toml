subject = "الى السيد الفاضل نائب الدولة"
author = "القاضى"
posted = "2006-05-19"
text = "الاخ الفاضل المسمى بنائب الدولة تحية طيبة و بعد اولا احييك بتحية القضاة المحترمين و هى السلام عليكم ورحمة الله و بركاته و ثانيا فسوف اتجاوز عن اساءاتك لانها فى الاساس لا تدل على الهيئة القضائية كمؤسسة و انما تدل على اخلاقك الرفيعة و بذاءاتك يا محترم حجة عليك لا لك و اعتقد ان اولى اخلاق القضاة هى احترام الذات و عفة اللسان و للاسف سعادتك لا عندك احترام و لا عفة و من ثم لا تثريب عليك لا نك لاتعد من القضاة اساسا بيد ان كونك لا تنتمى الى القضاة لايسمح لك بالسب و الشتم على اساس ان كونك بنى ادم اساسا يمنعك من هذا الا اذا كنت تنازلت عن صفتك الادمية و استبدلتها بصفات البهائمو انا اربأ بعاضاء الهيئات القضائية ان ينخرطوا فى هذا المسلك المشين و من اجل هذا كله احب ان افتح معك حديثا متواصلا باذن الله على هذه الصفحة من اجل الاستفادة بعلمكم الغزير يا معالى النائب الجمهورى و استهل البداية بالاتى \"-<br />اولا :- طبعا سعادتك سيد العارفين ان كون ريئس الهيئة صديق النائب العام ده لا يعد حصانة لان العبرة بالنص و ليس الصداقات فضلا عن ان لا النائب العام و لا ريئس الهيئة لهم صفة الدوام .و بالتالى تعليمات النائب العام ممكن تغيرها بتغييره و بصدور تعليمات اخرى<br />ثانيا :- لا احب ان اذكر معاليك بان اخر فضيحة لحضراتكم كانت القبض على احد اعضاء هيئتكم الموقرة بتهمة انتحال صفة وكيل نيابة الهرم بالقاهرةو تم القبض عليه تلبس و اذا لم تكن تعلم فاقراء الجرائد و السؤالف يا معالى النائب اذا كان سعادتك بتقول للناس انك النائب الجمهورى فلماذا تنتحل صفة وكيل نيابة فى جميع معاملاتك.<br />ثالثا :- مساءلة ضرب القضاة فى الانتخابات و اهانتهم فلا اعتقد ان احدا سلم منها فى جميع الهيئات القضائية لان فى الاتنخابات مكوناش معلقين على رؤوسنا بيان بانتمائنا الى اى جهة و بالتالى كلنا امام الناس قضاة و الاهانة العشوائية يا معالى النائب لا تفرق بين قضايا الدولة او القضاء<br />رابعا :- مسالة ان اعضاء القضاء يغيرون من علمكم فهذه و الله حجة البليد و لا تستحق الرد بالطبع فى كل هيئة اناس اكفاء و محترمين و لا يشتغلون بالسب و الشتم لانهم متفرغين للقانون و اذا ما ناظروا احدا كانوا لهم الند بالند و اعتقد ان معاليك ليس منهم لان الشتم يا صديقى دليل ضعف الحجة<br />خامسا :- كونك افضل الاعضاء من الناحية المهنية امر مشكوك فيه لان فى كل هيئة الكفء و الضعيف و لا تقل لى ان هيئتك الموقرة قد خلت من الدفعات التكميلية لان ذلك امر يكذبه الواقع و القانون و اذا كنت ناسى دفعات جمال بك اللبان تفكرك .و لكن للحق و الامانة فان الهيئة انتهجت فى السنوات الاخيرة مبدا تعيين دفعات للاوائل فقط و هو منهج محمود يحسب لها كما يحسب لمجلس الدولة و ان كان لا يعنى ذلك انه لم يعد هناك مجال للتكميلى لانه موجود .<br />سادسا :- اما عن كونى لا استطيع الرد على خبرات حضراتكم الفذة فانا بشخصى الضعيف ادعوكم الى فتح اى نقاش حول اى قضية قانونية تختارونها بانفسكم فلعل و عسى انهل من علمكم المزعوم .<br />سابعا :- احب ان اوجه التحية الى السيد المسمى بنائب الدولة 2 لانه فى معرض رده على ماذكرته كان موضوعيا و للحق انا اشاطره الرأى فيما قاله عن العيوب الواردة فى قوانين الهيئات القضائية اما الاخ المسمى بنائب الدولة1 فلا اعتقد انه يستحق اساسا هذه التسمية لان اخلاقه تدل على كونه نائبا عن دولة من دول العالم السادس.<br />و اخيرا :- يا عزيزى النائب المحترم الشتام اذا كنت انت بقدراتك الفذة الخارقة بتطعن على احكامنا الغبية و بتكسب الطعن تحب تقولى يا ذا القدرات الفذة مين اللى بيحكم فى هذه الطعون و بيلغى الاحكام الغبية بتاعتنا مش همة نفس القضاة الموصوفين بانهم اوسخ جيل من القضاة . يا عزيزى الوساخة هى ما فعلته من تدنى اخلاقى ينافس دناءة الخنازير و عيب عليك ان تدعى شرف القضاء و انت بعيد عنه بعد الارض عن جو السماء ففضلا عن افتقادك ابسط قواعد العلم على الاقل بقانون الهيئة التى تعمل بها فانت تفتقد الى الحد الادنى من الالتزام الاخلاقى فضلا عن بذاءة اللسان.<br />و اخيرا يا عزيزى انا لست من الدفعات التكميلية يا معالى النائب و انما محاور سعادتك حاصل على الليسانس بتقدير جيد جدا مع مرتبة الشرف و الماجستير فى القانون و اعد حاليا للدكتوراة . و سلام على من اتبع الهدى"
archived = "2006-11-02"
