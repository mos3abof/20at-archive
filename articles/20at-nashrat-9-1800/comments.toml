[[comments]]
order = 8
subject = "لا قضاء بدون هيئة قضايا الدولة"
author = "بالعقل والمنطق"
posted = "2006-03-12"
text = "بصراحة لو لم يتضامن شيوخ القضاه مع زملائهم مستشارى قضايا الدولة ويستفيدوا من خبراتهم وقوتهم لن يفعلوا شيئا ويجب ان ينسوا الغيرة الموجوده بين الجهتين فليس معنى ان اعضاء هيئة قضايا الدولة اكثر علما وثقافه ان يتخذ بعض القضاه موقفا منهم فنائب الدولة تم تعيينه بمعيار يقوم على الكفاءة والتفوق اما وكيل النيابة تم تعينه بالواسطة وشتان بين الاثنان فهيئة قضايا الدولة وحدها تملك المعرفة القانونية والفهم الصحيح للقوانين فهى اقدم هيئة قضائية واعضائها انتقوا على اساس الكفائة والتفوق وهم اعضاء هيئة قضائية عريقة وعظيمة وهى اكبر وافضل الهيئات القضائية على الاطلاق الا ان بعض الحاقدين او الجهلاء ينكرون عليها ذلك لغيرة وحقد دفين لشعورهم بتفوق اعضاء الهيئة عليهم فى كل المجالات وانا ادعوهم لتخطى هذه الامور الصغيرة والاتحاد من اجل صون القضاء وحريته وهيئة قضايا الدولة هى الام التى يلتفت حولها ابنائها من الهيئات الاخرى وعلى هؤلاء الحاقدين فهم ذلك ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145609/http://www.20at.com/article2.php?sid=477"

[[comments]]
order = 9
subject = "ياجبل مايهزك ريح"
author = "ابن المنسبين الاشراف"
posted = "2006-03-14"
text = "ياجبل مايهزك ريح ياقضاة مصر الشرفاء ماهزكم ريح الغدر والمذبحه القائمه ضدكم والله منصورين باذن الله ياشيوخ القضاه يااشراف قولا وفعلا ونسبا حصانة المولى عز وجل فوق كل الحصانات الصناعيه فوق حصانة كراسى البرلمانات الوهميه اصحاب النفوذ والكراسى عمر الكرسى مابيدوم يااصحاب النفوذ والبطش راعوا ضمائركم وربكم واين قسمكم بالله عز وجل لتكونوا عادلين 0<br />مايهزكم ريح ياقضاة العداله الاشراف والشرفاء فقط 0<br />العباره غرفت وصاحبها متمتع بالحصانه لاانه مش صاحبها لوحده اصحاب النفوذ شركاؤه العباره السلام 98 وكاترين وماخفى كان اعظم وعمر افندى والبيزنس اللى ورا عمر افندى عايزين تسيطروا على الفضاة الشرفاء علشان مفيش احد يحاكمكم ياظلمه<br />كفايه مذابح منكم لله يااصحاب النفوذ حتى العداله بتذبحوها كمان<br />منكم لله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145609/http://www.20at.com/article2.php?sid=477"

[[comments]]
order = 10
subject = "القضاء وقضايا الدولة"
author = "مواطن من شعب مصر"
posted = "2006-05-03"
text = "لو لم يتحد القضاه فى مطالبهم مع زملائهم مستشارى هيئة قضايا الدوله وسائر الهيئات القضائية لن ينالوا شىء يا ساده ان القضاه يفعلوا كل ما يفعلون من اجل المال وزيادة المرتبات فقط لاغير ويحاولون تفتيت الهيئات القضائيه و استبعادها حتى يلتهموا الكعكه وحدهم - على حد اعتقادهم - ونسوا انه توجد هيئة عريقه وشريفه هى اعرق الهيئات القضائيه هيئة قضايا الدولة والتى تملك الكثير من الكوادر القانونية والقضائيه المخترمة ولكن كيف يتحد المعارضين من القضاه معها وهم اول من اهانها واحدهم هذا البسطويسى الذى كتب فى اى تقاريره انه لايعترف بقضائيه هيئة قضايا الدولى وانها جهة تنفيذية تابعه للحكومة ونسى القانون والاحكام الدستوريه وان اعضاء الهيئة اشرف منه ومن امثاله الصغار وتم تنبيه هو وزميله حسام الغريانى ولكن كما قال المثل الشعبى اللى فى داء مش بيبطله واصبح هذا الفاسد المرتشى الحقير بطل فى نظر بعض الناس لمجرد انه عارض الحكومة وانا متاكد انه يتمنى لو يقبل حذاء مستشار بهيئة قضايا الدولة لكى يقف الى جواره هو والفاسدين امثاله والذين هم عار على القضاء ورجاله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145609/http://www.20at.com/article2.php?sid=477"

[[comments]]
