text = "زملائي الأفاضل،<br />تلقيت بامتنان بالغ قبول الأخ الفاضل القاضي لدعوتي للحوار، و إن كنت قد توقعت من سياق حديثه عن \"مبدأ خضوع الدولة للقانون\" و \" دائرة توحيد المبادئ بالمحكمة الإدارية العليا \" أن سيادته من أعضاء مجلس الدولة، فهو من قضاة المشروعية الأفاضل.<br />و إذا كان لي أن أعرفك بنفسي سيدي، فأنا عضو بقسم المنازعات الخارجية بهيئة قضايا الدولة و الذي يرأسه معالي المستشار رئيس الهيئة، و اختصاصي هو تمثيل جمهورية مصر العربية أمام المركز الدولي لتسوية منازعات الاستثمار بواشنطن التابع للبنك الدولي بالأمم المتحدة و محكمة العدل الدولية. و إذا كان أحداً منكم هو من المهتمين بالقضاء و التحكيم الدوليين، فأنا على يقين أنني قابلته من قبل.<br />هذا، و قد سبق لي العمل بأحد أقسام القضاء الإداري بالهيئة أمام الدائرة الثانية بمحكمة القضاء الإداري برئاسة المستشار أحمد شمس خفاجي نجل المستشار الفاضل شمس يك خفاجي نائب رئيس هيئة قضايا الدولة الأسبق رحمه الله، و هو رجل فاضل أكن له كل احترام و إن كنت أختلف معه في الرأي في بعض الأمور.و لي من مجلس الدولة أصدقاء عدة، معظمهم من السادة مفوضي الدولة. كما أنني أيضاً على معرفة جيدة بمعالي المستشار جمال بك دحروج حيث عملت معه بصفته مستشار لوزير الطيران المدني في إحدى القضايا الدولية الشهيرة التي أقيمت ضد جمهورية مصر العربية ممثلة في وزارة الطيران المدني و وزارات آخرى و كنت نائباً عن الدولة فيها، و لا زلت أتردد عليه في مكتبه بين الحين و الآخر، و إن كنت أعلم انه ليس لديه شعبية بين أعضاء مجلس الدولة.<br />و أشير إلي أنني أشاطرك الرأي فيما قلته حول ثقافة الاستعلاء المتفشية في الوسط القضائي ( و هو ما يطلق عليه الأدباء \" نعرة السلطة \" )، و في تقديري أن مرد ذلك يعود إلى الاعتقاد السائد بأن السلطة ـ و ليس العلم ـ هو مصدر القوة في الوسط القضائي. و أبلغ دليل على ذلك زعم بعض زملاؤنا في النيابة العامة بأن أعضاء الهيئات القضائية الأخرى أقل شأناً منهم لأنهم \" مبيحبسوش \" !!!. و يكون ردي عليهم دائماً أن أمين الشــــرطة \" بيحبس \" فهل هو أعلى شأناً من القاضي المدني مثلاً، فيلتزموا الصمت دون تعليق.<br />و إذا كان هذا هو الأمر بالنسبة لجميع أعضاء الهيئات القضائية الذين لا يملكوا سلطة الحبس، فإن الوضع بالنسبة لهيئة قضايا الدولة أكثر سوءاً، ذلك لأن جمهور المتقاضين لا يرى فيهم سوى خصم عنيد فيما يحضره من جلسات، و هو ما يذكرني بموقف النيابة العامة عندما يعالج اختصاصها درامياً فيظهر لنا وكيل النيابة كشخص قاسي بشع لا يفعل شئ سوى أن يطالب بتوقيع أقصى العقوبة على أي متهم حتى و لو كان بريئاً ( حسب قصة الفيلم ).<br />فأغلب الناس سيدي لا يعلم ما يعانيه نائب الدولة حتى يجمع المستندات و المعلومات من الجهات الإدارية ذات الصلة بالقضايا التي يباشرها ليس بهدف الدفاع عن الدولة بقدر ما هو بهدف التوصل إلي الحقيقة لنقلها في إطارها القانوني الصحيح إلى منصة القضاء، كما لا يعلم أيضاً أن طبيعة القضايا التي تكون أحد الأشخاص الاعتبارية العامة طرفاً فيها ـ سواء المنظورة أمام القاضي المدني أو القاضي الإداري ـ دائماً ما تكون المستندات قاطعة الدلالة في الدعوى تحت يد الجهة الإدارية و ليس المدعي، فها نحن نثبت للمدعي دعواه و على الرغم من ذلك لا يفهم دورنا.<br />ليس هذا فحسب، بل أن إذا ما قدرت هيئة قضايا الدولة عدم الطعن على أحد الأحكام الصادرة ضد الدولة، فإن من صدر الحكم لصالحه يتصور أن ذلك راجعاً إلى تقصير من الهيئة و ليس لمذكرة رأي حررت انتهى فيها العضو المختص إلى عدم الطعن و أن قراره هذا ملزم لأية جهة إدارية مهما علا شأنها.<br />كذلك، فإذا أبديت دفعاً شكلياً مثلاً دون إبداء دفاع موضوعي، فيرد المدعي ذلك إلى تقصير من نائب الدولة المباشر للدعوى، في حين أن حقيقة الأمر هي وجود ملحوظة ليست للنسخ على ظهر مذكرة الدفاع تفيد أحقية المدعي فيما يطلبه في دعواه و من ثم وجب الاكتفاء بإبداء الدفع الشكلي بهدف تنبيه المدعي حتى يصحح شكل دعواه فيكسبها خاصة إذا ما كان هذا الدفع متعلقاً بالنظام العام بحيث يجوز للمحكمة أن تقضي به من تلقاء نفسها.<br />و الأكثر سوءاً أن هناك بعض الزملاء من المشتغلين في الحقل القضائي لا يفهم حقيقة هذا الدور، بل يسرف في التعامل بشكل غير لائق مع الزملاء من أعضاء الهيئة فينتهي الأمر بـــ \" خناقة \" من التي نسمع عنها و تؤدي في النهاية إلى إلحاق الضرر بالعضوين إذا ما تعاظمت الأمور و وصلت إلى رئاسة كل هيئة من الهيئات التي ينتموا إليها.<br />و لكل هيئة ما يؤرقها في عملها و منها مجلس الدولة، فالزملاء في هيئة مفوضي الدولة دائمي الشكوى من أن بعض الناس تنظر إلى عملهم باعتباره لا ينفع و لا يضر بحسبان أن تقرير مفوض الدولة بالرأي غير ملزم لأية جهة و يتناسوا دور هيئة مفوضي الدولة كقاضي تحضير، فهو و إن كان رأيه غير منهي للخصومة، إلا أن دوره الإيجابي في توجيه الخصومة له أثره البالغ في كشف حقيقة ملابسات الدعوى فيما بعد أمام المحكمة.<br />و أخيراً أجدد دعوتي لزميلي الفاضل نائب الدولة 1 لنبدأ الحوار البناء بعيداً عن التعصب الأعمى، فنتبادل الخبرات و ننهل من معرفة بعضنا البعض.<br />و بالنسبة لوسيلة الحوار الأكثر خصوصية كما أقترح زميلي القاضي، فأنا أقترح أن تكون عبر البريد الإليكتروني على أن ترسل الرسالة من أحدنا إلي الاثنين الآخرين عن طريق الـ Forward، فإذا بعثت أنا مثلاً برسالة إلى أحدكم أبعث بنسخة منها للآخر و يرد كلٍ منا بنفس الطريقة. و أتصور أن هذه هي أفضل طريقة تضمن خصوصية الحوار من ناحية، و لا تلزم وجودنا في نفس الوقت أونلاين حتى لا نعطل بعضنا البعض. ( و أشير هنا إلى الاختراع المسمى بالإحصائية الشهرية التي يلتزم كلٍ منا بها ).<br />و حتى أزرع النواة الأولى لحوار بناء، فسأفصح أنا أولاً عن بريدي الإلكتروني و المكون بدايته من أسمي، الأمر الذي قد يتعرف معه أحدكم علي خصوصاً معالي نائب الدولة 1 الذي أتوقع أنه من جزئيات أو كليات الجيزة، و مع ذلك فهذا هو عنوان بريدي الإلكتروني:<br />AsserHarb@Walla.com<br />أنتظر منكم سوياً رسائلكم على بريدي الإلكتروني المبين أعلاه، و إذا تعرف أحدكم علي فليتصل بي يا سادة.<br />نائب الدولة 2"
archived = "2006-11-02"
