order = 26
subject = "حوار الهيئات القضائية"
author = "نائب الدولة 1"
posted = "2006-05-21"
text = "زولائى واخوانى الاعزاء كم انا ممتن - وبحق - لما وصل اليه حال الحوار بيننا وادعوكم وكافة اعضاء الهيئات القضائية الى نبذ الامور التى تفرق ولا توحد الكيان القضائى المصرى وان يعلم الجميع ان الهيئات القضائية سواء وبسواء وان اقترح نشر هذه الثقافه من كل عضو بيننا الى زملائه فى هيئته القضائيه والتى هى خيط ضمن نسيج نتمنى له الرفعه والاستقرار ودوام الهيبه ادعو الجميع الى نبذ الكراهية والحقد والذى اتمنى ان يكون انعدم فيما بيننا ونرى ما هو المقترح الحقيقى للنهوض بوضع الهيئات القضائيه واستقلالها واوافق زميلى القاضى المحترم فيما قرره من قصر التحاور فيما بيننا واقترح ان ندخل الى شات روم هو يحددها كلا منا باللقب الحالى القاضى ونائب الدولة ونائب الدوله 2 وادعوا الله ان يكون حوارنا هذا بدايه للاتحاد بين الهيئات القضائيه وقد نتبنى تلك الفكرة وننفذها وننال احترام بعضنا البعض والاخرين لنا واذا كنت يا زميلى العزيز القاضى تقول انك احد اعضاء مجلس الدولة وانا اكن لذلك المجلس كل الاحترام والتقدير الا انه لاول مرة اجد عضو من مجلس الدوله يتحدث عن هيئة قضايا الدوله كما تحدثت بحكم انها الهيئة الام التى خرج من رحمها مجلس الدوله عام 1646 الا اننا اتفقت ثلاثتنا على نسيان ما كان وبدانا صفحة جديدة وانا فى انظار ردكم باهتمام كبير<br />نائب الدولة"
