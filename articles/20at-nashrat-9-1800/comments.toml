subject = "قضاة الشرف والامانه"
author = "ابن المنسبين الاشراف"
posted = "2006-03-07"
text = "الساده/المستشارين الشرفاء<br />بقلوب عامره بايمان الله عز وجل بكل الحب والوفاء ندعو لكم بالتوفيق والتصدى لاعداء العداله والشرف والامانه 0<br />ان ينصركم الله فلا غالب لكم0<br />العادل هو الله واقسمتم يمن الله على الحق والعداله0<br />الجبار هو الله وهو قدير بجبروته ان يهزم اعداء الحق والعداله 0<br />الله اكبر والنصر لكم باذن الله<br />الله اكبر الله اكبر الله اكبر"
