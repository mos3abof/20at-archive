subject = "فالنبدأ الحوار البناء"
author = "نائب الدولة 2"
posted = "2006-05-20"
text = "معالي نائب الدولة 1 و سيادة القاضي الجليل،<br />السادة الأفاضل،<br />أتوجه إليكم بكل الشكر و الامتنان على كلماتكم الرقيقة في حق ما كتبت، و أشير إلى أن خلقكم الكريم هو الباعث وراء إعادة الأمور إلى نصابها فيما يتعلق بحواركم سوياً، فحسن خلقكم و رفعة سماتكم طغت على كل خلاف في الرأي.<br />و ها أنا أمد يدي إليكم سوياً لنفتح معاً حواراً بناءاً يعود علينا بالنفع بدلاً من الحديث في أمور لن تجدي، فكلنا مهمومون بوضع الهيئات القضائية حالياً، و كلٍ منا يسعى إلي توطيد استقلالها بطريقته و فيما يخصه، و إن اختلفنا في الوسيلة مع زملائنا من القضاة إلا أننا لا نقف صامتين كما يتصور البعض، فقانون السلطة القضائية و قانون هيئة قضايا الدولة و قانون مجلس الدولة و قانون النيابة الإدارية جميعهم مطروح على مائدة الحوار.<br />و أشير في هذا الصدد إلى أن مشروع تعديل قانون هيئة قضايا الدولة موجود فعلاً بمجلس الشورى و يتضمن تعديلات عديدة تشبه التعديلات التي أوردها مشروع قانون السلطة القضائية الذي يتبناه نادي القضاة، و كان قد تقدم بهذا المشروع النائب المستقل عبد المنعم العليمي عضو مجلس الشعب الأسبق رحمه الله.<br />كما لا يخفى عليكما سوياً أنه قد تم عقد عدد لا بأس به من الفاءات مع المختصين بالحزب الوطني و إدارة التشريع بوزارة العدل و تشكيل لجنة مشتركة من السادة مستشاري مجلس الدولة و مستشاري هيئة قضايا الدولة لبحث تعديل قانون الهيئة و المجلس لتحقيق ما تسميه وزارة العدل بالعدالة الناجزة فيما يتعلق بمنازعات الدولة و الأفراد، و قد نشر ما انتهت إليه هذه اللجنة من تعديلات على موقع الحزب الوطني الديموقراطي بحسبانها من التعديلات الموضوعة في برنامج الحزب.<br />فهل نكف عن سن سيوفنا لنتبارز بسبب أمور نرغب جميعاً في تعديلها ؟<br />لكم مني أسمى آيات التقدير و ارق الأمنيات<br />نائب الدولة 2"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145609/http://www.20at.com/article2.php?sid=477"

