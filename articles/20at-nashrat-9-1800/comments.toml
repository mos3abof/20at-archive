text = "تأجيل محاكمة المستشار وشريكيه تجار المخدرات بالإسكندرية<br />الإسكندرية أشرف حجاج:<br />أجلت محكمة جنايات الإسكندرية قضية ضبط 3.3 كيلوجرام هيروين مع ثلاثة متهمين بينهم مستشار بمجلس الدولة لجلسة 22 أغسطس القادم لحضور مندوب مديرية الأمن المسئول عن الجراج مع استمرار حبس المتهمين الثلاثة..عقدت الجلسة برئاسة المستشار علي عرايس بعضوية المستشارين محمود خلف وبهاء خيرت وسكرتارية ممدوح رفعت.<br />كانت مباحث المخدرات بمديرية أمن الإسكندرية قد نقلت معلومات حول النشاط الإجرامي للمتهمين سالمان حسن نصير \"ميكانيكي\" ومحمد مسلم سليم سلمي \"سمسار\" في الاتجار بالمواد المخدرة وهما من بدو جنوب سيناء وأنهما قادمان بكمية كبيرة من الهيروين للقاء أحد عملائهما فتم عمل كمين عند كوبري العامرية حيث تم ضبط المتهمين بالسيارة 123060 ملاكي القاهرة ومعهما كمية من الهيروين وداخل تجويف باب السيارة ومعهما المتهم الثالث المستشار تامر محمد محمد أبوزيد مندوب التفتيش الفني بمجلس الدولة بالقاهرة الذي أنكر في باديء الأمر علاقته بالسيارة وأن معرفته بالمتهمين بغرض شراء قطعة أرض وقبل رفع الحصانة عنه اعترف بأنه مستأجر السيارة من أحد مكاتب التأجير بالقاهرة وأن حالة الإعياء النفسي التي صاحبته وقت واقعة الضبط تسببت في عدم إدراكه لأقواله فتم استئذان المجلس الخاص للشئون الإداري بمجلس الدولة الذي وافق علي رفع الحصانة عنه وأمرت النيابة بحبس جميع المتهمين.<br />..و في إعادة محاكمة مستشار المنصورة المتهم بالرشوة:<br />شهادة عضو الرقابة الإدارية وخبير الأصوات 15 أكتوبر<br />كتب - فتحي الصراوي:<br />أجلت محكمة جنايات القاهرة أمس قضية إعادة محاكمة مستشار المنصورة المتهم بالرشوة هشام عبد الباقي والمحكوم عليه بالمؤبد و3 من شركائه لجلسة 15 أكتوبر القادم لسماع شهادتي خبير الأصوات وعضو الرقابة الإدارية وفض الأحراز.<br />عقدت الجلسة برئاسة المستشار عبد الله أبوهاشم وعضوية المستشارين سعد مجاهد ونبيل عبد الحق بحضور طاهر الخولي رئيس نيابة أمن الدولة العليا وأمانة سر طاهر محرم ووائل عبد المقصود وأيمن القاضي.<br />طالبت النيابة في جلسة أمس باستمرار حبس المتهمين وطلب الدفاع سماع أقوال المتهمين الصادر حكم بإعفائهم من العقوبة لاعترافهم..كما طالب بفض الأحراز والاطلاع عليها وسماع شهادة عبد المنعم الليثي سكرتير الجلسة الخاص بالمستشار المتهم."
