[[comments]]
order = 12
subject = "السيد المحترم المتعصب لهيئة قضايا الدولة"
author = "القاضى"
posted = "2006-05-18"
text = "اعتقد من حديثك المتطاول انك احد اعضاء الهيئة الموقرة المسماة بهيئة قضايا الدولة و التى هى فى الاصل قلم قضايا الحكومة و التى لولا مذبحة القضاة ما كانت انضمت الى مجتمع الهيئات القضايئة يا سيدى الحديث لا بد و ان يكون له اسس اما عن كونها اعرق هيئة قضائية فلا اعتقد ان انشاءها سابق على انشاء المحاكم فلا تتحدث بما لا تعلم اما عن اتهاماتك لسيدك و سيد القضاء المصرى استاذنا البسطويسى فهذا ابلغ الاثر على كونك لا تستحق شرف الانتماء الى القضاة و انك فعلا محامى حكومة و لا تستعر من مهنتك يا سيدى و اعتقد انه من الاولى بكم فى هيئة قضايا الدولة ان تبحثوا فى كيفية تقوية استقلالكم ده اذا كان عندكم استقلال لانه حتى الوقت الحاضر مازالت لا توجد لكم حصانة و يستطيع اصغر محامى عام بالنيابة ان يقبض على اكبر راس فى هيئتكم الموقرة و بالتالى فانا ادعوكم الى قراءة قانونكم الخاص من اجل لحس حذاء الحكومة لتعديلة و اعطاءكم اى حصانة و الدليل على ذلك قرارات العزل التى تذخر بها الجريدة الرسمية يا عالم حد فى الدنيا شاف قرار يصدر بعزل المستشار/........... المستشار بهيئة قضايا الدولة ده حتى شكل القرار وحش ارجو ان اكون وضحت لكم حجمكم الطبيعى و فى النهاية يا سيدى السلطة القضائية فى من مقصورة على القضاء العادى و مجلس الدولة و ما عدا ذلك قبض الريح و اتحداكم لو وقف احد منكم ذات وقفة نادى القضاة و السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145609/http://www.20at.com/article2.php?sid=477"

[[comments]]
order = 13
subject = "عندما تتحدث قضايا الدولة يصمت الباقين"
author = "نائب الدولة"
posted = "2006-05-19"
text = "الى من يزعم انه قاضى وهو لا يعلم شىء عن القضاه ولا القضاء اذا كنت قاضى انا نائب للدولة وسوف اعلمك ما لم تعمله ايها الضعيف - معذرة لااقصد ضعيف البدن وانما اقصد ضعيف الفهم والادراك والتفكير - هيئة قضايا الدولة انشأت عام 1875 اى قبل انشاء المحاكم الوطنيه فى 1883 اى قبلكم بثمانى سنوات فانا مطلع على التاريخ القضائى فى مصر اكثر منك اما عن كون الهيئة كانت تسمى بقلم قضايا الحكومة فعندك كل الحق فهذا مسماها فعلا وما العيب فى ذلك ولكن اعضائها كانوا وقتها يسمون بالمستشار الملكى وكان المستشارى الملكى مقدم فى البرتكول عن القاضى ولك ان تتاكد من ذلك من كتاب تاريخ القضاء للعلامة السنهورى استاذ القانون الاول فى مصر والذى كان عضوا بالهيئة وكان القضاه يتمنون التقرب لزملائهم من قضايا الدوله اقصد المستشاريين الملكيين لانهاء مصالحهم فى الدوله وعقب قيام الثورة تغير المسمى الى ادارة قضايا الحكومة وسمى اعضائها بالمستشار الجمهرى كانت له نفس الميزات والحصانات اما ما تزعهمه من عدم وجود حصانة لاعضاء الهيئة وهى حجة العبط والتافهين احب اعرفك ان الحصانه واحده فى كل الهيئات القضائيه بموجب قرارات النائب العام الكبير بتاعكم وانه لا يجوز الاذن بالقبض على عضو الهيئة الا بعد استئذان النائب العام شخصيا على الرغم ان القانون اشترط فقط استئذان محام عام الا ان النائب اصدر تعليماته انه لا يتم الاذن الا منه شخصيا واسال فى المكتب الفنى بتاع النائب العام هتعرف يا غلبان وان النائب العام صديق شخصى لرئيس الهيئة ولا يتخذ اى اجراء من قبيل تللك الاجراءات الا بعد استئذان معالى رئيس الهيئة علاوة على ان الحصانه ديه مجرد شكل وعمر المجلس الاعلى لاى هيئة ما رفض الاذن بالقبض يعنى حصانه زى قلتها واحنا كلنا متساوين فى الحصانه من تعسف الشرطة وحينما نحب نحرر محضر باى قسم شرطة بيكون عن طريق مذكرة مكتوبه ولا نتناقش فيها ولا يجوز سؤالنا امام الشرطة او النيابه الا بعد استئذان النائب العام وبالتالى فالحصانه واحد ومتساويه يا خفيف ودور على حجة تانيه تحب اعرفك انا اننا احسن منكم لاننا اتعينا بنفس الاداه وهى القرار الجمهورى ونشرف على الانتخابات ونحمل لقب عضو هيئة قضائيه بس نفرق عنكم فى اننا متفوقين عنكم فلا نعرف المقبول وكلنا اساتذه فى القانون والدليل اننا بنكسب اى نزاع بينا وبنكم البسطاويسى اللى انت زعلان عشانه ده مبيفهمش حاجة لما طلع تقريره البيضان اللى قال انه شايف اننا مش اعضاء هيئة قضائيه والدليل انه اخد تنبيه هو والغريانى بعدها تعرف ليه ولا اقولك - هقولك يا مشمش عشان بعد التقرير اجتمعت دوائر محكمة النقض واجمعت على خطا هذا التقرير وعدم تكراره الا انه هو والغريانى اصدروا تقرير مماثل فتلبوا التنبيه بالشفاء وبعدين اهو اخد لوم بعد ما ممثل انه بيموت عشان ياجل المحاكمة ومعرفش ومش احنا اللى بنقول انه مش بيفهم ده انتم اللى ادتيلوا تنبيه وبعدين لوم يعنى بتاكدوا انه حماااار واللى يتطاول على الهيئة ده جزائه . اما بالنسبه للاستقلال احنا يا مشمش عندنااستقلال اكتر منكم وبنامر الحومة مش العكس واللى بنقوله للحكومة بتنفذه وبيخافوا مننا اكتر منكم وكفايه احكامكم الغبيه اللى بنطعن عليها وبنكسبها دايما وده ليه تعرف عشان انتم اوسخ جيل من اجيال القضاه ويا الف خسارة لما الحمير يقعدوا على المنصه وهما مش بيفهموا حاجة وتبلوا الناس باحكامكم الزبالة وكفايه انكم الهيئة القضائيه الوحيدة اللى اضربتم فى الانتخابات واتهزءتم بغباءكم واهو زميلك اضرب امام ناديه والداخليه عارفه الفرق بينا وبينكم وبيتعمدوا يضربوكم بالجزمة وكفايه انه زميلكم اللى حب يعمل عنتلر اتاخد منه سلاحة واضرب امام الناس واتسحل وقلعوة البنطلون وراح المستشفى بالكلوت الله اعلم اللى تم فى البوكس كمان . وجاى تقولى قضاه ده احنا اللى بنستعر منكم انا دلوقتى لما بروح فى مكان بوضح الفرق بين قضايا الدوله والقضاه عشان الناس متخلطش بينا بصراحة شكلكم بقى زباله . اتلموا شويه واعرفوا اننا اسيادكم وجزمة نائب الدوله برقبه اكبر راس فيكم وكفايه اننا محترمين ومحدش بيهزءنا ولا بيضربنا فى الشارع ولا بنستنجد برئيس الجمهوريه ونقوله احنا مظلموين واحنا مش محامين حكومة يا حمار انا رقباء على الحكومة والدنيا كلها عارفه كده الله يخرب بيتكم الناس اللى مش بتفرق بينا بيفتكروا اننا هيئة واحده وجيرانى بيسالونى صحيح انتم بتتضربوا وتتحبسوا من الشرطة بقيت افهمهم انه من احنا دول ناس تانيه نفسهم يكونوا سياسيين وان شاء الله هيتعزلوا كلهم ناقص بس اقولك يا مشمش اننا غير قابلين للعزل يا تعباان وروح ذاكر قانون قضايا الدولة على السى ديهات اللى الوزارة وزعتها علينا وهتعرف احنا مين ولا يمكن مكنش معاك تشتريها ابقى تعلالى فى الهيئة بوس جزمتى وانا اعلمك يا خوووول"
archived = "2006-11-02"
