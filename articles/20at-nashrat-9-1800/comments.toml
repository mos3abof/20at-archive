text = "حكم المحكمة الدستورية<br />تعيين كل من رؤساء اللجان العامة و اللجان الفرعية من اعضاء الهيئات القضائية<br />حيث ان السيد الدكتور رئيس مجلس الوزراء طلب بكتابه المؤرخ 29/1/2004 تفسير الفقرة الثانية من المادة (24) من القانون رقم 73 لسنة 1956، فيما نصت عليه من ان \" و يعين كل من رؤساء اللجان العامة و اللجان الفرعية من اعضاء الهيئات القضائية......\" و ذلك تأسيسا على ان هذا النص قد أثار خلافا فى تطبيقه<br />بعد الاطلاع على الأوراق و المداولة<br />حيث ان السيد الدكتور رئيس مجلس الوزراء طلب بكتابه المؤرخ 29/1/2004 تفسير الفقرة الثانية من المادة (24) من القانون رقم 73 لسنة 1956، فيما نصت عليه من ان \" و يعين كل من رؤساء اللجان العامة و اللجان الفرعية من اعضاء الهيئات القضائية......\" و ذلك تأسيسا على ان هذا النص قد أثار خلافا فى تطبيقه، فقد قررت محكمة النقض فى طعون مجلس الشعب ارقام 957،797،222،234،223 لسنة 2000 ان هيئة قضايا الدولة ، و هيئة النيابة الإدارية هيئتان قضائيتان فى مفهومه ، و سايرت الاتجاه ذاته محكمة القضاء الإدارى فى حكمها الصادر بجلسة 17/10/2000 فى الدعوى رقم 85 لسنة 55 قضائية، بيد أن محكمة النقض عادت و اتخذت منحى مغايرا بما قررته فى الطعنين الرقيمين 949،959 لسنة 2000 حاصله ان الهيئتين عينهما ليستا من الهيئات القضائية التى عنتهما المادة (88) من الدستور، و انما فرعان من فروع جهات الادارة التابعة للسلطة التنفيذية ، ممثله فى وزراة العدل، و خلصت ترتيبا على هذا النظر الى بطلان اجراءات الانتخاب التى تمت تحت اشراف اعضاء من هاتين الهيئتين.<br />و اضاف طلب التفسير ان توحيد تفسير ذلك النص له اهمية بالغة لتعلقه بالشروط الواجب توافرها فى اعضاء اللجان التى تشرف على عملية الاقتراع، وو جوب صحت%E"
archived = "2006-11-02"
