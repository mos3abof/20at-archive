order = 25
subject = "السادة الزملاء الافاضل"
author = "القاضى"
posted = "2006-05-21"
text = "السادة الزملاء الافاضل تحية و احتراما .<br />حقيقة انا احب ان اتناسى ما سبق و استجيب تماما لدعوة اخى الفاضل نائب الدولة2 لفتح حوار بناء حول القضايا ذات الاهتمام المشترك و بداية اوضح لزميلى نائب الدولة1 انه هو من بدا بقذف المستشار البسطويسى برسالته المعنونة مواطن من شعب مصر و التى رددت عليها صراحة فقام هو بفعل ما فعله و الامر واضح اعلاه .<br />ثانيا بالنسبة لسؤاله عن سر الكراهية فلا اعتقد انها موجودة فعلا و ان كنت اعترف صراحة بوجود الكثير من الحساسيات تجاه اعضاء الهيئات القضائية الاخرى و لك فى هذه النقطة كل الحق ولعل مرجع ذلك هو شيوع ثقافة الاستعلاء بغير وجه و غياب ثقافة قيمة المؤسسات ودليل ذلك يا سيدى ما وصفته لهيئة قضايا الدولة بكونها اعظم الهيئات و اعرقها و غير ذلك .<br />و الحق ان شيوع هذه الثقافة هو مرجع التعصب الاعمى الذى نشهده حاليا و الواقع ان المؤسسة القضائية فى مجملها لا تقوم الا بتوازن الهيئات المندمجة داخلها وصولا الى تحقيق غايتها و هى اقامة العدل فى المجتمع<br />من اجل هذا فانا ادعوكم الى نقل الحوار على نحو يكفل خصوصية اكثر من هذا و ادعوكم لاختيار الطريقة و الوسيلة التى ترتضونها و ليكن مثلا بريفت شات او غيرها و لتكن هذه فرصة لتعزيز التبادل العلمى بييننا للاستفادة من الخبرات المشتركة و اخيرا فاننى ادعوا السيد نائب الدولة1 الى نسيان ما سبق و ادعوه بكل مودة الى المشاركة الفاعلة و اذا كان سيادته غير نادم على ما تلفظ من حوار فاننى اسف جدا لما ذكرته فى حق هيئتكم الموقرة و انا فى انتظار اقتراحاتكم .<br />اما عن شخصى الضعيف فانا انتمى الى مجلس الدولة و ليس القضاء االعادى و الذى دعانى الى الرد على معالى الزميل ليس التعصب للقضاء العادى او نحوه و انما ما تعلمناه من ليبرالية التفكير فى مجلس الدولة و لكم منى كل تحية و احترام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145609/http://www.20at.com/article2.php?sid=477"

