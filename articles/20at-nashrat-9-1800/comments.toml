subject = "الى السيد الفاضل نائب الدولة"
author = "القاضى"
posted = "2006-05-19"
text = "اما بخصوص التنبيه المزعوم يا معالى الفقيه فاحب ان اقول لك ان احكام المحكام العليا فى نظامنا القانونى ليس لها الا القيمة الادبية و ليس لها قوة الزامية يا معالى الفقية لاننا لا ناخذ بنظام السوابق القضائية و مفاد ذلك ان القاضى لا يلتزم باحكام محكمة النقض و الادارية العليا حتى و ان كان ذلك بالمخالفة لاحكام توحيد المبادئ او الدوائر المجتمعة و بالتالى يا استاذ فان مخالفة الاحكام المستقر عليها لا يعد خطا مهنى جسيم يستوجب المسائلة كما لا يصلح اساسا لبطلان الحكم بدعوى البطلان الاصلية ليه ؟ لان النظام القانونى يا استاذ كما قلنا لا يعترف بالسوابق القضائية و غاية ما تبلغه احكام المحاكم العليا من قيمة هى القيمة الادبية و التى لا يتم على اساسها مخالفتها لهذه الاعتبارات و الحالة الوحيدة التى تتقيد بها المحاكم بالاحكام السابقة هى احكام المحكمة الدستورية العليا ليه ؟ لا نها حجة على الكافة يا استاذ بنص القانون و من ثم لا يجوز مخالفتها فهمت يا عزيزى و بالتالى لا صحة لما تقوله من ان التنبية كان بسبب هيئتكم الموقرة و اخيرا بعد ان رددت عليك سهامك فلا اعتقد انك كفؤا لى من الناحية الفقية و انا استئذنك فى ان تنيب عنك واحد من زملائك يكون لديه الحد الادنى من العلم القانونى لكى استطيع مناظرته لان الاستمرار فى الرد على اخطائك القانونية يجعل مستواى فى هبوط و السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145609/http://www.20at.com/article2.php?sid=477"

