text = "لك التحية يا نادى القضاة<br />ازمة مصر معروفة وهى ان الرئيس مبارك طاغية ظالم هو وحاشيتة القذرة التى اغرقت مصر فى المبيدات المسرطنة وسرقة المال العام وقانون الطوارى وتجويع الشعب والبطالة ومساندة امريكا وبيع القطاع العام<br />المشكلة ان مبارك يظن انة يحكم شعب ميت<br />لا يدرك هذا الاحمق ان الشعب لن يصمت الى الابد<br />اصمدوا يا اشرف من فى هذا الوطن من اجل مستقبل اطفال مصر<br />من اجل تخليص مصر من مبارك المزور هو وحزبة الوطنى الحقير000000000000000"
