subject = "السيد الاستاذ/ نائب الدولة 2"
author = "القاضى"
posted = "2006-05-20"
text = "حقيقة الامر لا استطيع ان اخفى اعجابى بمقدار ثقافتك القانونية - وان كان لى عليها بعض الملاحظات بخصوص ما اوردتموه - او بترفع اخلاقك الحميدة فى الحوار و هو ما عهدناه دائما من رجال القانون خاصة من اشتغل منهم بالشان القضائى فلك منى التحية بيد اننى احب ان الفت نظر معاليك الى ان السيد نائب الدولة1 هو من تطاول فى البداية و انتحى منهجا على غير ما الفه رجال القضاء بالاساءة اولا و بالتجهيل القانونى ثانيا مما استوجب الرد عليه و للحق اقول اننى حزين جدا الى المستوى الذى تردى فيه فى حواره خاصة ان الصفحة المنشورة على الموقع متاحة للجميع و ليست حديثا خاصا مما قد يزعزع الثقة العامة فى رجال القضاء الامر الذى ينعكس سلبا على الجميع خاصة فى مثل ما نمر به حاليا و احب ان اشير تحديدا الى اننى اكن كل الحب و التقدير لزملائى فى الهيئة و اثمن كثيرا مقدار مهامهم الجليلة و اذا كان السيد نائب الدولة1 يفخر بان السنهورى باشا كان عضوا فى الهيئة و نحن نفخر بانه كان رئيس مجلس الدولة فيكفيكم فخرا ان استاذنا الجليل الدكتور عوض المر كان عضوا فى هيئتكم الموقرة .<br />و ختاما لك منى كل سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145609/http://www.20at.com/article2.php?sid=477"

[[comments]]
order = 20
subject = "أيها القاضي الفاضل"
author = "أيها القاضي الفاضل،"
posted = "2006-05-20"
text = "ترفعت عن الهوى و التعصب فأحققت الحق و أزهقت الباطل، هذا ولله ما تعودناه من زملاؤنا القضاة.<br />جنح زميلي عن السلوك القويم فأخطأ في حقك، و ها أنا أعتذر لك عما فعل.<br />فليعود كلٍ منا إلى أداء دوره في محراب العدالة، فينكب على ملفات قضاياه ليعلي كلمة الحق في مواجهة الباطل.<br />علمت أن لك ملاحظات على ما أوردت، فهل لي أن أعرفها و لو بإيجاز؟ عاهدت نفسي ألا أضيع فرصة للاستزادة من علم أي من الزملاء المشتغلين في الحقل القضائي، فمد يدك لحوار مثمر بناء سيعود علينا سوياً بالنفع.<br />و أخيراً لك مني شكراً و سلاماً و احتراماً،<br />نائب الدولة 2"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145609/http://www.20at.com/article2.php?sid=477"

[[comments]]
order = 21
subject = "اوافق على الحوار"
author = "نائب الدولة 1"
posted = "2006-05-20"
text = "السلام على من اتبع الهدى زملائى الاعزاء سواء معالى نائب الدولة 2 او سيادة المستشار القاضى الجليل احب ان اخبركم بأن السيد القاضى الزميل هو من بدأ باهانتى حينما قرر اننا علينا ان نلعق حذاء الحكومة لنيل الاستقلال واننا ليس لنا حصانه ولسنا اعضاء هيئة قضائيه واننى بغير من القضاء الجالس ... ولن ارد عليك باسلوب سمج وانا اعتذر عن الالفاظ التى تلفظت بها فى حوارى على الرغم اننى لست نادما عليها الا اننى اتوق الى الحوار مع السيد القاضى المحترم وسوف اتابع هذه الصفحة يوميا لمعرفة الرد من جانبه ولاستمتع باسلوب معالى النائب 2 الشيق والذى اعجبنى بشدة واتمنى لو ان يكون سائر اعضاء هيئة قضايا الدولة مثله بل سائر اعضاء الهيئات القضائية ولنبدأ صفحة جديدة ونتناظر الحجة بالحجة والبرهان بالبرهان وانا على اتم الاستعداد لذلك واتمنى موافقتكم ولننسى افعال الصغار التافهة ونتحدث كأعضاء هيئات قضائيه محترمين ولنا هيبتنا ووقارنا .<br />احب فى البداية ان اوجه الشكر الى معالى نائب الدولة 2 واتمنى ان اصل الى جزء ولو بسيط من علمكم الفياض وادعو الله ان يبارك فيكم ويزيدكم علما .<br />ثانبا بالنسبه للعزيز القاضى المحترم اود ان اسالك سؤال صريح قلما يسأل فى الاوساط القضائية بشكل علنى ... لماذا تكرهوننا يا سياده القاضى الجليل ؟ لماذا تنشب الغيرة بيننا؟ لماذا تحاولون اقصاءنا وابعادنا عنكم بالكره والحقد ؟ لماذا نفرق بين سائر الهيئات القضائية كما لو كانت حضارات متنازعة؟ ما المشكله لو تعاملنا سويا باحترام متبادل وود وصدق ؟<br />هل فى نظرك ممكن لرجل الشارع العادى ان يفرق بين اى هيئة من الهيئات القضائية؟<br />ما تحدثت عنه بشأن عضو الهيئة الذى انتحل صفه عضو نيابه اخبرك باننا كرهنا هذا التصرف واداناه جمعيا وان كان يثور بشأنه الشكوك حول صحه ما جاء به فعضو الهيئة ينكر ذلك تماما ويقرر بان عضو النيابه على خلاف شخصى معه وافتعل ذلك بالتواطؤ معضابط الشرطة لجعل الواقعه فى صورة حالى تلبس ولا داعى لذكر الامور المشينة التى تسىء الينا ...<br />اقسملك بالله انه حال تعينى كنت اكن كل الود والاحترام لرجال القضاء العادى ولم اكتشف كراهيتكم لنا الا قبل كل انتخابات وانت عارف السبب وبلاش نتكلم فيه عشان احنا على النت ...صدقنى هيئة قضايا الدولة تملك من الحيدة والاستقلال ما لاتملكه سائر الهيئات القضائية الاخرى واحب اخبرك بشىء... انت قلت اننا بنقف امامكم على قدم المساوة وده مزعلنا ...<br />احب اعرفك ايها الزميل ان هناك فرق بين السيد نائب الدوله وبين الخصم الذى ينوب عنه فمثلا انا لو كنت احضر عن رئيس الجمهوريه بصفته فى دعوى مرفوعه عليه من احد المواطنين فان التساوى امامكم ليس بينى وبين الخصم وانما التساوى بين رئيس الجمهوريه والخصم ..فنيابتى عن الجهة الاداريه بقوة القانون فلا يملك اى مسئول بالدوله الحضور امام المحكمة فى قضيه مرفوعه عليه بصفته والمحكمة لا تقبل حضوره ولا يملك مهما علا شانه توجيهى اثناء مباشرة الدعوى فانا اباشر الدعوى بكل ذمه وامانه وبشكل مصادف للقانون وليس لهوى الجهات الاداريه فاننا لا نتلقى تعليمات من اى مسئولا مهما علا شانه وتبعيتنا لوزير العدل هى ذاتها تبعيتكم له مجرد تبعية اداريه وليست فنيه فلا يمكن لوزير العدل او غيره توجيهى لتحرير مذكره على نحو معين لانه ليس لنا مصلحة شخصيه فى الخصومه ولا نتاثر مثلا بخسارة دعوى او كسبها فالحالتين عندنا سواء بسواء فكيف نكون محامين للحكومة كما ذكرت؟<br />ارجو ان تراجع قانون الهيئة وتتحدث مع احد اعضائها فى شئونها لتعلم عنها اكثر...<br />سيدى اننا زملاء على قدر متساوى من المراكز %"
