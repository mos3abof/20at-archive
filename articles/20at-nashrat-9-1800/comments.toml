subject = "هيئة لا يعلم عنها احد"
author = "sampoochie"
posted = "2006-06-01"
text = "في البداية احب ان اشكر الزميل نائب الدولة- احب ان اذكر جميع اعضاء الهيئات القضائية اننا بيننا فاصل مشترك اننا جميعنا خريجي كليات حقوق تعلمنا القانون بأضعف مستوي موجود و الواحد بيفتكر انه لما اتخرج اتعلم احسن حاجة في العالم و لما ربنا فتح عليه و اتعين في هيئة قضائية يتعالي علي الناس و لا يذكر كيف والده تعب لما علمة و وفره المصروفات - ان كان هناك تعالي من شخص علي اخر فليس في العلم انما في الجهل من يكون اجهل من الثاني ان العدالة يجب ان يقوم عليها اشغاص اقرب الي الملائكة لان ضميرهم هو الذي يصوب اهوائهم - و من يطمع في الدنيا يكون متعصبا و ناهم في الجمع ما بين السلطة و المال و في اخرته يتم سؤاله و يقف موقف الحصره و الندامة \" فلا يخرنك سلطان او مال و اطع الله و تواضع حتي يعزك الله \"<br />اني ليس فقية او شيخ انما ابغي ان اوضح لك ان هذا الصراع ما بين القضاه و هيئة قضايا الدوله يجب ان لا يكون كذلك و هذا كالاتي:<br />ان قضايا الدوله نشات قبل نشأه القضاء المنظم في وضعة الحالي اذ منذ عصر محمد علي باشا انشأ اول هيئة قضائية سميت جمعية الحقانيه و هي نشأت في 1842 و تحولت الي مجلس الاحكام و هو المجلس الذي كان له شأن في عصر سعيد باشا و اسماعيل باشا و هو يعتبر هيئة استئنافية علياو كانت جمعيه الحقانية بها نواه قضايا الدولةو كان رئيس القلم في ذلك الوقت واحد كبراء مصر غير مؤكد اسمه حتي الان ثم اصبح لهذا القلم دور مهم و اساسي في عصر اسماعيل باشا و احب ان اذكر ان اسماعيل باشا في الوقت السابق عن خديويته و هو امير كان يرأس هذا المجلس و هو الذي نظم و هيكل هذا القلم علي امل ان يدافع عن مصالح الخديوي و هو الذي ظهر جليا في تحكيم بونابرت الا ان موقف مصر كان ضعيف جدا و ذلك كالعاده حتي تاريخة و قضي ضد الحكومة المصرية ثم تغير المسمي لقلم قضايا الحكومة ثم قضايا الدولةو لا ننسي ان من ضمن العاملين بهاسعد باشا زغلول واحمد امين و غيرها من الزعماء و المعاصرين و من ضمنها الدكتور عصمت عبد المجيد- و لا يخفي ان من ضمن اعضاء هيئة قضايا الدولة الكثير من حملةدرجة الدكتوراه و الماجستير .<br />و ان اصبحت تلك الهيئة في الظل و لا يراها الا كل حاقدالا اننا نعمل في صمت و نجاهد مع الجهات الادارية لمعرفة الحقيقة و التقصير من جانبها و نحقق دفاع الدولة و لا يخفي ان من بين المتقاضين اصحاب النوايا السيئة الذي يجاهدو لسرقة المال العام سواء بالتعويض علي ذات الضرر اكثر من مره او عدم دفع الضرائب او من يقومو بسرقة الخدمات التي تقوم بها الدولة مثل المياه و الكهرباء و الهيئة تقف لهم بالمرصاد و تدعي امام مجلس القضاء الموقر و الذي يوافق في اغلب احكامة علي وجهة نظر الدولةو يقضي بما يطلبه و يظهر هذا جليا امام المحكمة الادارية العليا و محكمة النقض و اعضاء تلك المحاكم يقدرون دور الهيئة قدرا كبيرا لاسيما ان كبر السن يعطي الحكمة للعقول المظلمةو تقدير اصحاب المجهود و لا يقدر اصحاب الصدف و المطامع<br />ابغي ان اعرف ردكم علي هذة الرساله<br />سامح احمد رضوان"
