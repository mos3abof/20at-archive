subject = "\"كفارة يا سيادة المستشار\""
author = "نائب الدولة 2"
posted = "2006-05-19"
text = "بداة، يلزم أن أقول \"كفارة\" لسيادة المستشار أحمد مكي على براءته مما نسب إليه من تهم. و أضيف إلي كلام زميلي معالي نائب الدولة المحترم ما يلي:<br />هيئة قضايا الدولة هي الهيئة القضائية التي ناط بها القانون حماية المال العام و الدفاع عن شرعية الحكم و الإدارة في الدولة، فأسند إليها ولاية النيابة القانونية عن الدولــة بسلطاتها قاطبة أمام القضاء في الداخل و الخارج..‏ فهي ـ و بحق ـ حائطاً قانونياً منيعاً لصد كل معتدٍ على المال العام أو غادر بمصالح مصر و شعبها.‏<br />ينظر ضمير المجتمع إلى هيئة قضايا الدولة و يجلها.. فهي دوما خصما شريفا‏ و حكماً عادلاً.. تستقل دون غيرها بتقدير متى تدعي الدولة ومتي لا تدعي‏.. فلا تزج بالناس إلي ساحات المحاكم ظلما أو تدفع حقا ليتحقق به ظلم‏..‏ فإذا فرض عليها الدفاع‏ لمصلحة عامة تستقل وحدها بتقديرها وفقاً لأحكام الدستور و القانون..‏ فلا تنطق إلا عدلا وصدقا‏..‏ فتربأ بنفسها عن اللدد في الخصومة ولا تتسبب في تأخير الفصل في الخصومات..‏ و إن شرعت في جمع المعلومات و المستندات من الجهات الإدارية ذات الصلة بمناسبة دعوى تباشرها.. فهي تلتزم بالحيدة و التجرد فتجمع ما للدولة و ما عليها لتنير به الطريق أمام منصة القضاء ‏..‏ و إذا ما صدر حكم لصالح أحد المواطنين.. فهي تهب لاتخاذ ما يلزم نحو تنفيذه طبقاً لما قضي به.. فتعطي كل ذي حقٍ حقه.. و تمسك بزمام قرارها بعدم الاستشكال في الأحكام إلا في الحالات المقررة قانوناً.. فلا تضع عقبة في سبيل التنفيذ‏..<br />و من ثم فإن تلك الهيئة العريقة تسهم ـ على النحو المتقدم ـ بقدرٍ لا يستهان به في سير العدالة، فإذا ما توقفت عن أداء واجبها أختل حتماً ميزان العدل بين الدولة و الأفراد و اختلطت السلطة بـ \"السلاطة\" و بات المال العام مستباحاً دون حامٍ أو حارس و تخلخل النظام و تداعى الاستقرار في الدولة دون مدافعٍٍٍ عن شرعية الحكم و استقرار النظام و تقدمت مصلحة الفرد بلا منازع على مصلحة الجماعة..<br />و من جماع ما تقدم بات متعيناً إضفاء الصفة القضائية على هيئة قضايا الدولة و أعضائها لما يسهموا به في سير العدالة على النحو المتقدم.<br />و السؤال الذي يطرح نفسه الآن:<br />هل يستأمن الشعب مستشاري و أعضاء تلك الهيئة العريقة فيوكل إليهم مهمة حماية أمواله العامة و الدفاع عن مصلحته العامة بينما لا يستأمنهم على أداء واجبهم الدستوري بحيدة و تجرد حال رئاستهم للجان الاقتراع؟<br />أبادر و أقول أن الإشراف على عملية الاقتراع ليس عملاً قضائياً بطبيعته بل و أن عملية الاقتراع ذاتها ليست خصومة قضائية بالمعنى الفني الدقيق.<br />و من ثم فإن الإشراف على عملية الاقتراع لا يتطلب أن يقوم به قاضٍ ممن أسند لهم القانون سلطة الفصل في الخصومات بل أن كل ما في الأمر أن يكون القائم على الإشراف له من الضمانات و الاستقلال ما يضمن حيدته و تجرده.<br />و يؤيد ما تقدم، أن معظم دول العالم التي تحترم مواطنيها تسند مهمة الإشراف على عملية الاقتراع إلى غير أعضاء الهيئات القضائية و منها على سبيل المثال لا الحصر فرنسا و الولايات المتحدة الأمريكية.<br />و من ثم فإن إشراف مستشاري و أعضاء هيئة قضايا الدولة على عملية الاقتراع هو عمل صحيح بحسبان أن تلك الهيئة العريقة هي من الهيئات القضائية التي أناط بها الدستور و القانون رئاسة لجان الاقتراع لما يتمتع به أعضائها من ضمانات و حصانات أهمها عدم القابلية للعزل.<br />و أخيراً أود أن أشير إلى أن الممارسة العملية قد أثبتت أن مستشاري و أعضاء هيئة قضايا الدولة قد أدوا واجبهم الدستوري في الإشراف على عملية الاقتراع بكل شرف و نزاهة، فلم ترصد في حق أي منهم أية مخالفة، وذلك على خلاف ما حدث في بعض اللجان التي ترأسها أعضاء السلطة القضائية على نحو ما تردد على بعض القنوات الفضائية و الجرائد المعارضة.<br />هذا، كما أنوه أيضاً إلى أن سائر قوانين الهيئات القضائية و على رأسها قانون هيئة قضايا الدولة و قانون السلطة القضائية بهم من العوار التشريعي ما يمس استقلال أعضائها، إلا أنه و لحين تعديل هذه القوانين فلا يصح أن نحاول النيل من مستشارين أجلاء أدوا الأمانة في ضوء ما أتيح لهم من امكانات و ما بسطه لهم النظام من سلطات."
