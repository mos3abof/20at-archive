subject = "كويس"
author = "انا بايد كلام الاستاذ وائل والاستاذه مني"
text = "لانه فعلا البنت هي التي تجبر بعض الشباب علي النعاكسه<br />فرساله لكل البنات ان يكونون محترمين في مشيتهم ولايتكمون بصوت علي اوتضحك وان تنظر الي الارض<br />والي الشباب فيتقي الله فيما يفعلون وان يدافعون عن البنات من الشباب الاخر<br />سلام<br />MIDO_ABCARINO@HOTMAIL.COM"
archived = "2006-11-02"
