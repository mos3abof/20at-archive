text = "ده مش سـلام ، ده اسمه استسلام ، لا تطبيـع مع كيان طفيلي على المسلمين ، أتوا بالقـوة واغتصبوا أرض المسلمين ، أهانوا المقدسات الاسلامية ، وبعد كل ده تقوللي تطبيـع !!"
