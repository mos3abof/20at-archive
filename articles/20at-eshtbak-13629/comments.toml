text = "يعني ايه تطبيع وسلام مع ناس من يوم ما ربنا خلقهم وهما ما وراهومشي حاجة يعملوها غير أنهم يخططوا ازاي يتخلصوا من العرب ويسيطروا على العالم<br />دول قوم اهانوا كل الرسل واذوهم<br />وبعدين لما يبقوا ينفذوا هما السلام صح نبقى نطبقه احنا<br />العرب معروف عنهم انهم شعب مسالم ويحب الخير بس اللي يعادينا نعاديه واللي يحاربنا نحاربه والبادي اظلم"
