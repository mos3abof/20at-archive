[[comments]]
order = 1
subject = "يا عم سيبك000 دي عالم معفنه"
author = "الاستاذشيكو"
posted = "2006-06-05"
text = "انا بس عايز اعرف الاستاذ سلامه واجع دماغه مع الحكومه ليه بس ؟!!!!<br />الكلام كله للحكومه وكان الحكومه هى اللي بتدي الاحزاب او جماعه الاخوان الحريه والديموقراطيه<br />الكلام ده ماينفعناش ده من الاخر كده والعمليه اساسا مش مستحمله اي حاجه من الحكومه دى حكومه تتقن الكذب اما اللي قبليها كانت بتكذب بغشم<br />يجب ان يكون الكلام يا استاذ سلامه موجه الي كل الناس مش للحزب الوطني المعفن لان الموضوع بايد الحزب الوطني كان قطع رؤس المعارضه اي معارضه وعلقها علي باب مجلس الشعب وبعد كده تقلي الحزب عايز يغير ده كلام يا راجل<br />كل واحد ليه حق لازم ياخده كله واما لا يطالب باي حاجه اساسا علي الاقل هايكون معاه حجه للاجيال القادمه انه معرفش يعمل حاجه عشان النظام كان فاسد ومستبد"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904062214/http://masr.20at.com:80/article.php?sid=452&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
