author = "بناءا على طلب الامن"
posted = "2009-12-02"
text = "تم اغلاق وردم البلاعات بناءا على طلب الامن خوفا من ان يختبىء فيها ارهابى يقتل رئيس الدولة او احد الوزراء اثناء مرورة وكذلك تم تقطيع جميع الاشجار من الشوارع خوفا من يختفى فيها قناص وتحويل القاهرة الى صحراء ليس فيها شجرة واحدة"
archived = "2009-12-04"
