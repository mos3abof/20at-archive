subject = "كيف تصبح داعية فى48 ساعة"
text = "1-لاتتعب نفسك بالعلم الشرعى فذلك يعطلك سنوات طويلة وأذا<br />اعترض عليك احد قل انا داعية ولست عالم والرسول قال بلغوا<br />عنى ولو أية<br />2=ابتعد عن القضايا الشائكة التوحيد/الشرك/الآضرحة/<br />البدع /الجهادوعليك بالقصص اللطيفة والمؤثرة ومحاسن الآخلاق<br />3-لاتصنع لنفسك أعداء وجامل الجميع بالعدل الفنانين/الآخوان المسلمين /الشيعة<br />الصوفية/ النصارى/العلماء/الحكومات<br />4-اهتم بمظهرك وكن حليقا ناعما وان كان لابد من لحية فلتكن خفيفة مزركشة<br />وللمرأة الحجاب الحديث بألوانة المبهجة ولا نتسى المكياج ولا ان تجعلى حاجبيك على الشعرة وكلة فى سبيل اللة وفى سبيل الدعوة<br />5-انسى كل ايات الوعيدوالنار وأسماء اللة الجبار/القهار<br />وأذكر فقط أيات الوعد والجنة وأن اللة الرحمن / الرحيم<br />6-عليك بأسلامة كل شىء فهناك غناء اسلامى /تمثيل اسلامى /اختلاط اسلامى /قبلة اسلامية /رقص اسلامى<br />7- ان يكون لك اتباع من الشباب المتخنفس لآنهم سينشرون أسمك بين الشباب مثل أ/الفيشاوى مخرج البورنو كليب الآسلامى<br />-تدرب على تنويع وترقيق الصوت والتشويح والآداء الكوميدى<br />8-انشر الآشاعات بأنك مضطهد ومحارب ولا تنيى ان تنفى ذلك علنياحتى لا تغضب احد راجع رقم3<br />9-اذا لم تنجح لآن هناك منافسين اكثر منك خبرة بكل ما سبق<br />فلا تيأس وعليك الأتفاق مع قناة تلمعك وتكون لهم أستثمار ناجح<br />أخيرا أستغفر اللة وكن متبعا وأبدا بنفسك وأسرتك فمن نجح فى<br />ذلك وقليلا ما هم اولئك ربحوا"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417072059/http://www.20at.com:80/article.php?sid=63"

