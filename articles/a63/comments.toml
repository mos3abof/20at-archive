subject = "شاب عرف عنه الخلق والسمت الحسن"
text = "الاخبار لمجرد انها تنال من شاب عرف بستقامته وتدينه وأعني هنا احمد الفيشاوى ،أقول بدلا من أن تقوم بمثل هذا الأمر كان حرياً بها أن تكفي نفسها عناء البحث عن قضيه اخلاقيه تطنطن حولها واعتقد ان الساحه مليئة بالساقطين من المغنين والمغنيات والفنانين والفنانات الذين يظهرون عفنهم الأخلاقي ولا يخفونه،ويفسدون عقول واخلاق ابنائنا ومجتمعنا عموماً،كان حريا بهم تتبع وفضح روبي وما ادراك ماروبي كان حريا بهم مناقشة ظاهرة العري والتفسخ في الكلبات الغنائيه حتى جاوز السيل الزبى مع نجلاء ويا قلبي لا تحزن........"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803122051/http://www.20at.com:80/article.php?sid=63"

[[comments]]
order = 8
subject = "شاب عرف عنه الخلق والسمت االحسن"
text = "هذه ليست قضيه عابره تدور حول اي شخص بل هي محاوله مفضوحه لضرب الفضيله في والانتقاص من أصحابها وتشويه صورهم وخاصه من ينظر الشباب كقدوات،كأن من يحث على الاخلاق يعد خطراً قوميا يجب أن يتخلص منه ويحارب،إن هذا والله لعجب عجاب.أدعو هؤلاء ان يتقوا الله في ما يكتبون وأذكرهم بقوله تعالى {{ يا أيها الذين آمنوا إن جاءكم فاسق بنبأ فتبينوا أن تصيبوا قوما بجهالة فتصبحوا على ما فعلتم نادمين }} سورة الحجرات،كما ثبت عن النبي صلى الله عليه وسلم أنه قال : ((من ذب عن عرض أخيه بالغيبة , كان حقا على الله أن يعتقه من النار )) ."
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803122051/http://www.20at.com:80/article.php?sid=63"

