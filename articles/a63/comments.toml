subject = "أخطر شىْ..!!!"
text = "أن الواحد يفتكر نفسو هو اللي فاهم كل حاجة وإنه عنده كفاءة للحكم على الأشخاص وهو علي عرشه الوهمي.<br />أستاذى المحترم ياللي مش عاجبك (عمر خالد)الشاب المجتهد اللي مش قاعد تحت مكتبه(زي سعادتك) بيكتب رأيه بقلة ذوق في الناس التانية.<br />ولا عاجبك (أحمد الفيشاوي) ولا قناة (إقرأ) اللي هما مهما كان لينا عليهم ملاحظات كتير... مازالو بردو أحسن الموجود في وقتنا ده وربنا يهديهم أكتر إنشاء الله.<br />ويهديك كده أنت كمان وفرجها عليك عشان ما تعدش تشتم في كل الناس كده عمال على بطال"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417072059/http://www.20at.com:80/article.php?sid=63"

