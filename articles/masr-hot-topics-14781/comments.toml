[[comments]]
order = 4
subject = ""
author = "الى الغزاوى"
posted = "2010-01-07"
text = "يا اخى فية زملاء من غزة بيشتغلوا فى الخليج ومتخصصين فى اللحام وقطع المعادن<br />الموضوع مش صعب<br />وممكن القطع داخل النفق بغاز الاكسجين والاستلين<br />كما اخبرك انة يمكن اللحام تحت الماء<br />صدقنى دة جدار خايب<br />والعيال بتوع الانفاق هيتصرفوا معاة كويس<br />لان كل حاجة لها نقطة ضعف والخط الخايب مش هيبقى اقوى من خط بارليف ولا جدار برلين<br />هيتصرفوا<br />وهيقطعوا الحديد تحت الارض فى النفق"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127195932/http://www.20at.com:80/masr/hot-topics/14781-2010-01-06-15-22-54.html"

[[comments]]
order = 5
subject = ""
author = "كاره الفيس بوك"
posted = "2010-01-08"
text = "الفيس بوك والهاي فايف وغيرهم من الشبكات الأجتماعية التي تتيح للجميع معرفتك ومعرفة أصدقائك واهتماماتك وتوجهاتك وتفاصيل حياتك الشخصية واليومية والموسمية ..<br />لا يقنعني أحد إنها مجرد وسيلة للتسلية يدفع القائمين عليها عشرات الآلاف من الدولارات ليتيححوا للمستخدمين التقارب …<br />لابد من وقفة صارمة مع الفيس بوك .. لانه تعمق كثيرا بمجتمعنا وبكافة الأعمار .. والله اعلم ما القادم من ورائه ."
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127195932/http://www.20at.com:80/masr/hot-topics/14781-2010-01-06-15-22-54.html"
