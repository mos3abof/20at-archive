author = "غزاوي"
posted = "2010-01-06"
text = "يا بتاع الاكسجين والجدار الخايب ,<br />بتفكر امريكا بتصرف الملايين عشان حتة عامل انفاق عندنا يخترقو بسهولة<br />عشان اطمنك انه الاكسجين ما بيشتغل تحت الأرض<br />ثم انه غير الجدار في مضخات مياه بحر كبيرة وضخمة رح تنضخ لتسقط جميع الأنفاق<br />يعني دي حاجة لازم تفهمها منيح<br />وتصبحون على وطن"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107091039/http://www.20at.com:80/masr/hot-topics/14781-2010-01-06-15-22-54.html"

[[comments]]
order = 1
subject = ""
author = "موالاة اليهود"
posted = "2010-01-06"
text = "طبعا ادارة يهودية او موالية لليهود<br />ولكن صدقونى هذا جدار خايب<br />طبعا مصر لا يمكن ان تتراجع لان الممول امريكى والفكرة اسرائيلية ويهم النظام المصرى ان يرضى الامريكان واليهود ولا يهم الاخرين ان يغضبوا او ان ينفلقوا<br />وطبعا الجدار جدار خايب وسهل قطعة واختراقة ولن يفيد شيئا اطلاقا<br />يستطيع اى عامل لحام محترف بطورش قطع واسطوانة اوكسجين واستلين ان يقطع ام الجدار فى نصف ساعة<br />الموضوع مش صعب وفكرة خايبة قوى<br />واى فنى يقدر يقطع ابوة والانفاق هتستمر اذا لم يفتح المعبر"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107091039/http://www.20at.com:80/masr/hot-topics/14781-2010-01-06-15-22-54.html"

