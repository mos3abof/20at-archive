text = "احنا لم نختلف فى النهاية لوقرات آخر التعليق لعلمت اننى معك ..لأنه لن ينسلخ..من جلده...وديله عمره ماينعدل أذن احنا متفقين..لالالالالالالالالالالالا للقرصان وعصابته وسلالته..لالالالالالالالالالالا ..للفساد.. ونعم ..نعم..نعم..لثورة الجيش والشعب من اجل الأصلاح..اللهم اجعل هذا اليم قريب..آآآآآآآآآآآآآمين"
