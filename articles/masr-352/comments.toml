text = "منتهى الوقاحه والبجاحه الحركات التمهيديه التى يقوم بها جلالة مالك البلد من أجل ولى العهد ...وكأن الناس حمير مش فاهمه اللعبه ...يارب ما توعوا تتهنوا بيوم واحد كمان فيها ...وتندفسوا فى نار جهنم كلكم..قرفنا منكم ومن أشكالكم العكره ..ومن وجوهكم السوده زى أيامكم..أمنيه حياتى أن أرى هذا الحقير مع عصابته وهم محكوم عليهم بالأقامة الجبرية فى أفقر مكان فى مصر ويعيشم بأقل دخل فى مصر يعنى صفر.. ويمشوا يشحتوا فى الشوارع ..ويناموا فيها..ولا يلاقوا حد يحسن عليهم<br />وساعتها بس حندعى لهم بطول العمر..حتى يعيشوا فى المر والعذاب ..أنتم أحقر الكلمات فى قواميس كل لغات الدنيا...لالالالالالالالالالالالا لمبارك وسلالته..لالالالالالالالالالالالالالالا للفساد..لالالالالالالالالالالالالالالالالا لقانون الطوارىء....ونعم..نعم..نعم..لتعديل الدستور ...ربنا يخلصنا منكم ونلاقى داهية ترضى تاخدكم...قولواآآآآآآآآآآآآآمين"
