author = "ابن بلد"
posted = "2006-05-23"
text = "مرحبـــــا صاحبت السمــو انا مواطــن مصري فرحان بيكي وبقولك اهلا بيكي امبراطوره للشعـب المصري اللي يستحق ضرب الجزم علشان سايب البيه خطيبك وابو البيه خطيبك والوليه حماتك يبيعو ويشترو فينا<br />كاننا بهايم عند اللي جابو اهاليكـــــم يا ولا د الكب يا كفـــــــره بيعتو البلد فاضل ايه يا بهايم يا ولاد البهايم هتبيعونا في مزاد علني في سوق العبيد مرمطو كرامه مصر في التراب<br />وخلتنونا نعرس لامريكا ولاسرائيل يا ولاد الكلب يا خديجــه يا جمال ورحمه ابويا ما هينفعــك دا انتي شكلك مش مصريه اصــلا وعمرك سمعتي عن اتوبيس ولا طابو عيش ولا يعني ايه بهدله موصلات<br />وانتا يا جيمي مش عايزينك يا كلب يا ابن الكلب زهقنا من ابوك واللي جاب ابوك جوعتونــــــــاا يا كفره<br />ومش هتاخد مصــر علشان خلاص معدش في مصــر مصر راحـت ابوك مش هيسبلك حاجه تورثها البلد خلصـت خلاص ومبقاش فيها الا شويه متسولين اللي هما احنــــــــا<br />انا عندي 25 سنه وكل طموحي بقي اننا اسافر واروح بلاد الغربه واسيب اهلي وناسي وامي وابويا بسببك يا جمال انتا وابوك<br />يا رب ابعت ارهابي يفجر نفسه فيهم ونخلص<br />يا رب مفاعل ديمونه يولع وكلنا نموت ونخللللللص<br />بس المهم تموت معانا مش تتطفش بطياره علي بلدك انجلترا يا ابن الانجليزيه<br />وعلي فكره يا جيمي حتي لو اتجوزت كلنا عارفين ان انتا :كده كده هومالكش في ال ...<br />وعلي راي عادل امام ,,,,, مبتعرفش !!!!"
