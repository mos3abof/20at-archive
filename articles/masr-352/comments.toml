[[comments]]
order = 14
subject = "أصله سايق الهبل"
author = "مصرى"
posted = "2006-05-22"
text = "أصلة سايق الهبل ومش لاقى حد يوقفه عند حده لا زم يا جماعه يكون فيه رد فعل على كل تصرفاته الهابلة ولازم كل صحف المعارضة يكون لها رجوع على أى حاجة مش من حقه بيعملها لأن السكون علامة الرضا وطالما إحنا ساكتين يبقى يعمل إللى هو عايزه ياخوانا أبوه مش ملك ومصر مش عزبة وإللى بيعملة أبنه ده شيء غير قانونى أولاً لأن ابوه غير شرعى فى الحكم وماجاش بالإنتخابات زى الدستور لما قال وثانياً لإنه مزور فى الإنتخابات وثالثاً لأن الشعب كله بيكرهه هو وإبنه والساحرة الشريرة زوجته يبقى إزاى نسكت لازم كل الصحف المعارضة تتكلم عن عدم شرعية إللى بيعملة حسنى مبارك وإبنه والإخوان المسلمين إللى هما أملنا كله لازم يكون ليهم وقفة مع الإهبل ده ياإخوانا ده معندوش أى كفاءة وفين الخبراء بتوع مصر الأكفاء منه مئات المرات علشان ده يقعد وجايب المحروسة المتخلفة بتاعته معاه دى مش عزبة وبعدين الأهم من كل ده ده مؤتمر للتطبيع مع إسرائيل هو جايب المحروسة علشان الناس ما تلتفتش للمهم وهو تطبيع العلاقات مع إسرائيل ولازم يكون لينا وقفة إحتجاج كبيرة على هذا المؤتمر لأن ده إهانة للمصريين والفلسطينيين يا خوانا الواد وأبوه فاكرين مصر مافيهاش حد ها يحاسبهم على كل إللى بيعملوه وهو جايب حبة المقطيع بتوع المؤتمر علشان يعمل معاهم بزنس هو وولاده لكن لا زم نوقفه عند حده لأن فرعون لم يتفرعن إلا لما مالقاش حد يصده"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182534/http://masr.20at.com:80/article.php?sid=352&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 15
subject = "عمنا جمال"
author = "طارق حسن"
posted = "2006-05-22"
text = "فى مقال فى جريدة الاسبوع للرائع عمرو سليم قال ان احد المفسرين الاجلاء قال انه يتتابع على حكم مصر اربع رؤساء الاحرف الاولى من اسمائهم تكون كلمه جامع<br />وبما ان الاسم الاول هو جمال عبد الناصر<br />والثانى انور السادات<br />والثالث محمد حسنى مبارك<br />فقد تهكم الاخ عمرو سليم وقال ان الرابع لابد ان يبدا بحرف ع<br />ومع ايقانى الكامل بان الرئيس القادم ليس عمرو سليم ولا عمرو خالد<br />فانى ابشركم بالاسم القادم وهو عمنا جمال<br />واستغل هذه الفرصه واقدم نقوطى بمناسبه الخطوبه السعيدة للراجل الى ناقطنا كلنا فى كل المناسبات<br />وبعد النقوط الحار دة احب اسمع اغنيه المولد"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182534/http://masr.20at.com:80/article.php?sid=352&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

