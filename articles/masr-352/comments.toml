text = "الحل الوحيد لك يا جيمى لفض الاشتباك بيتك وبين رفض الشعب لك هو اعلانك لميثاق شرف مع الشعب المصرى بنوده محددة وواضحة..تلبى فيها مطالبه..<br />1- التخلى عن الجنسية الامريكية واليهودية وأعلانك الأخلاص لجنسية الفقراء المصرية<br />2- التبرؤ بشكل كامل وتام من كل أفراد عائلتك..وخصوصا الوالد الغير محترم.. ومن كل الجرائم التى ارتكبوها طوال عهدهم الغابر..وايداعهم السجون بعد محاكمة علنية..<br />3- اعادة كل أموال الشعب المسروقة فى الداخل والخارج..الى خزائن الدولة الخاوية..وتجريد الأخ علاء وأمثاله من كل ممتلكاتهم ومصادرة أموالهم وثرواتهم التى كونوها من دماء المصريين<br />4-أدانة كل من سرق الشعب المصرى وفضحه با لأسم<br />5- انهاء قانون الطوارىء وتعديل الدستور المصرى بما يطالب به الشب<br />6-الأفراج عن المعتقلين السياسيين واغلاق هذا الملف الأسود الى الأبد<br />7-انهاء الفساد والمحسوبية وتطهير أجهزة الدولة من عملاء والدك ( السابق طبعا بما أنك سوف تتبرأ منه)<br />8-حل مجلسى الشعب والشورى والحزب الوطنى والتعهد باقامة أنتخابات نزيهه<br />9-وضع استقالتك أمام مجلس الشعب الجديد لقبولها فور أخلالك بأحد هذة الشروط...<br />10-أعلاء سيادة القانون والكل سواء أمامه<br />أذا قبلت هذه المطالب مستعده أنتخبك رئيس لمصر ..لكن ده معنا أنك تسلخ جلدك على يد هندى أحمر ..وللأسف أحبابك الأمريكان خلصوا عليهم...وعندنا فى مصر مثل مشهور بيقول.. ( ديل الكلب لا ينعدل)..أنتم أحقر الكلمات فى قواميس كل لغات الدنيا..لالالالالالالالالا للقرصان وسلالته وعصابته..لالالالالالالالالالالا للفساد ..لالالالالالالالالالالا لقانون الطوارىء..ونعم..نعم..نعم..لتعديل الدستور..اللهم قرب من يوم الخلاص..قولوا آآآآآآآآآآآآآمين"
archived = "2006-09-05"
