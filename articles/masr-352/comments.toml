[[comments]]
order = 1
subject = "الاستهبال السياسي"
author = "عبدالله مفتاح"
posted = "2006-05-21"
text = "بجد مينفعش البلد تتورث دي جمهوريه ميصحش ابدا ان الاب يديها لابنه ده استهتار بالشعب كله واهانة كبيرة جدا لينا<br />مجلة الشياب في عددها الاخير جايبه تحقيق عن جمال مبارك قال ايه الشباب بيقولو انهم شافوه مع لميس انسان بسيط مش متكلف ورائع كان نفسي اعرف الشباب دول جايين من المريخ<br />بصراحه حسني مبارك في شباب بتحبه لغاية دلوقتي يمكن حاسين بعشرة بس جمال مباك اجمع الكل على انه بغيض<br />مجلة الشباب ابتدت تمهد عقبال الباقيين<br />هنفضل احنا نقول ونقول لغاية لما نلاقي جال على راسنا كلنا<br />ولا للتمديد...لا للتويث...نعم لتعديل الدستور"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182534/http://masr.20at.com:80/article.php?sid=352&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

