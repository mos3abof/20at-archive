[[comments]]
order = 24
subject = "خسارة ...هو ده اللى قدرته عليه"
author = "نعمت"
posted = "2006-05-23"
text = "الف خسارة يا بلد.... هوانتم بقى اللى روعة وهايلين وفاهمين؟؟<br />انا لا ادافع عنها .. ولكن هل يعرفها احدكم فعلا ليتكلم عنها بهذه الطريقة وهذه الألفاظ (بس هل ياترى هو اول من دفس ) ( قاعده في الصف الاول ...قال يعني البت بتفهم قوي..طب شوفوا منظرها في الصورة اللي فوق التعليقات على طول...بقه ده منظر واحدة لاقطة اي حاجة م اللي بيتقال<br />ما هي لو بطلت الاوكسجين اللي بتضرب بيه شعرها ده يمكن كانت فهمت حاجه) ....<br />انا اعرف عنها انها خريجة جامعة اميريكية .... لست ادرى اى تخصص ولكنها متفوقة وحاصلة على نتائج مرتفعة وده من قبل الخطوبة ... زمايلها بيعتبروها شخصية قوية جدا ....ومرحة ومتعاونة .... وده برضه من قبل الخطوبة<br />اللى اعرفه ان سب الناس وقذفهم حرام ... وعيب ...<br />واعتقد ان ده اللى جايبنا ورا ... طق حنك على الفاضى ..... وهجوم لمجرد الإختلاف<br />مع ان القرآن فيه آيه بتقول : لا يجرمنكم شنئان قوم ان تعدلوا اعدلوا هو اقرب للتقوى<br />هى تصلح له زوجة .... ؟؟ هم ادرى بأحوالهم<br />هو يصلح رئيس جمهورية ؟؟؟ احتمال ..ولكن اكيد ليس بالطريقة التى ينوون زرعه بها.. اقول ذلك لإنه شخص دارس ويمارس .. ( هو ايضا خريج جامعة اميريكية)<br />لهما ان يحضرا مؤتمر دافوس .... نعم.. كثير من الشباب حصل بالواسطة على كارت صحافة وذهبوا للفرجة ... فاشمعنى هم يعنى؟<br />من حقها تجلس فى الصف الأول ؟؟ اومال يعنى حيوقفوهم فى الآخر ..مادامت كوسة لكل من هب ودب .. يبقى كل واحد وشطارته<br />هل كان اى واحد فيكم مكانه واثبت انه لن يستغل هذا الجاه والسلطان .. ولن تغريه الشهرة والسلطة والقوة ... لا اجد من يستطيع الجزم بذلك<br />طيب نعمل ايه ؟؟؟ هذاحوار آخر ...طوييييييييييييييييييل"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182534/http://masr.20at.com:80/article.php?sid=352&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 25
subject = "لا"
author = "لا"
posted = "2006-05-23"
text = "منقول<br />:سيدي الرئيس .. أنت جبان<br />أراك تلتصق الآن في مقعدك الوثير، وتثبّت عينيك على الشاشة الصغيرة، وترتعش يداك وهما تتعّرقان حول سمّاعة الهاتف، وقد جاءك صوتٌ من أحد كبار الكبار يطمئنك بأن كل الأمور على ما يرام، وتمام يا أفندم، فقواتك الباسلة، يا صاحب الضربة الجوية الأولى، اخترقت بشجاعة منقطعة النظير جيشاً عرمرم من شباب صغير ومرهَق من السهر استعدادا للامتحانات، ثم لبى نداء قضاته الشرفاء.<br />كانوا عشرة على الرصيف، وجنودك الأبطال أكثر من تسعمئة يحاصرونهم. القانون يقول بأنه يتم القبض على مخالفيه، ثم يُعْرَضون على النيابة. أما قانون الجبان فيطلب من كل ثلاثين أو أربعين كلبا محاصرة مواطن واحد، ثم القائه أرضا، وركله بشدة في كل أنحاء جسده حتى يتورم، وتنفجر من مساماته دماء حمراء قانية.<br />أراك هاربا في ايطاليا أو ألمانيا أو المغرب أو شرم الشيخ، وأتحداك أن تخرج في موكب مخترقا شوارع العاصمة ولو كنت في حماية أمريكا واسرائيل وكل كلابك الذئبية المفترسة.<br />أقدم اعتذاري الشديد لكل الطيارين الأبطال الوطنيين الذين رعتهم سماء مصر في السادس من أكتوبر عام 1973، وأقول لهم بأن هذا الرجل ليس منكم وليس مِنّا.<br />لعلك كنت تستلقي من الضحك على غضروفك الذي آلمك عندما بلغك نبأ تحرش ضباطك وجنودك بفتيات مناضلات أصغرهن أكثر منك شجاعة، وأعمق حبا للوطن، وأقرب لروح السماء منها لتراب الأرض.<br />انتقدتك كثيرا، وكتبت عنك ما ظننت أنه يفجر الماء من الصخر، ولكنني هذه المرة أحمل لك رسالة من سبعين مليونا من المصريين، ومعهم ستة ملايين مغترب منعهم ظلمك أن يدلوا بأصواتهم في الانتخابات الأخيرة خشية أن يكون الوعي قد أصابهم، والخوف من زائر الفجر قد زال عنهم في الغربة.<br />الرسالة التي أستطيع أن أختصر لك فيها ربع قرن من حكمك ا<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182534/http://masr.20at.com:80/article.php?sid=352&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

