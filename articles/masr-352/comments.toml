[[comments]]
order = 22
subject = "طريقك مدفوس مدفوس مدفوس يا براء"
author = "نيفين.نيفى .نوفا"
posted = "2006-05-23"
text = "براء<br />يمكن هنا انا شويه معاك<br />علشان كدا نبقى بنتكلم فى امور الدوله<br />بص هو مش غريب انها تحضر او تتواجد مع جمال باعتبار ما سيكون<br />ما هى ممكن (لالا قدر الله)ف يوم من الايام سيده مصر الاولى<br />بس بغض النظر عن كل دا انت كده طريقك مدفوس قصدى مسدود يا براء اهللك عايزينك يا ابنىو الله خايفه عليك تتدفس انت ف النهايه ف مدفس ما و محدش يعرفللك طريق<br />طيب محمد السيد و عارفين لو هنوديله عيش و حلاوه هيودوها فين<br />لكن انت مدفسك شكله هيبقى من اللى من طراز الداخل مفقود و الخارج مولود(دا لو فى خارج اصلا)؟<br />يالله ربنا معاك"
archived = "2006-09-05"
