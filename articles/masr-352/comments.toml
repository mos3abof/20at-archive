text = "لما نبطل كلمه وانا مالي نبقي ندور علي حقنا ومين الاجدر بالرياسه وبعدين الطريق مفتوح لجمال باشا علشان يركب العرش ويدلل رجليه يا ناس اصحوا بقي خلاص البلد خربت ولا اقول لكم وانا مالي"
