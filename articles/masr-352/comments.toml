text = "لا و قاعده في الصف الاول ...قال يعني البت بتفهم قوي..طب شوفوا منظرها في الصورة اللي فوق التعليقات على طول...بقه ده منظر واحدة لاقطة اي حاجة م اللي بيتقال<br />ما هي لو بطلت الاوكسجين اللي بتضرب بيه شعرها ده يمكن كانت فهمت حاجه<br />يالله ما هي مصر ناقصة هبل...كابتن كرة قدم و بتحضر دافوس...والله صبرتي و نولتي يا مصر..بالشفا"
