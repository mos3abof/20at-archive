text = "ياأخ البراء اشرف طالما انت دفست نفسك فى موضوع يخص البيه الكبير يبقى شكلك كده عاوز تندفس لك كام سنه فى اى مدفس قصدى معتقل وخللى بالك لو اندفست محدش هيعرف يطلعك من المدفس وللعلم الدفس مسئولية كل دافس وعلى المدفوس مراعاة اضرار الدفس !!! وهتوحشنا والله ياالبراء ربنا يسهل والغيبة متطولش"
