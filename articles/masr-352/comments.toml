[[comments]]
order = 10
subject = "فضيحة جديدة لمصر فى الأمم المتحدة"
author = "aroundu_4 ( Towards Light )"
posted = "2006-05-22"
text = "فضيحة جديدة لمصر فى الأمم المتحدة<br />تكتمت الصحف المملوكة لنظام الديكتاتور البائد حسنى مبارك وكذلك إعلام الريادة عن نشر نتائج الإقتراع على عضوية المجلس الأعلى لحقوق الإنسان التابع للأمم المتحدة والذى أقيم السادس من مايو بمقر الجمعية بمدينة نيويورك بالولايات المتحدة.<br />نتيجة التصويت كانت فضيحة مدوية بكل المقاييس ولاتعادلها فضيحة أخرى سوى فضيحة صفر الأوليمبياد. ففى مجموعة أفريقيا تنافست سبعة عشر دولة لإختيار ثلاثة عشر ة دولة فقط من بينهم.<br />الدول المتنافسة هى مصر ، الجزائر ، الكاميرون ، جيبوتى ، الجابون ، غانا ، مالى ، موريشس ، كينيا ، مدغشقر ، المغرب ، نيجيريا ، السنغال ، جنوب أفريقيا ، تنزانيا ، تونس وزيمبابوى. على الرغم من كثرة أعداد المقاعد المعروضة للعضوية ، ثلاثة عشر، مقابل العدد المتقدم ، سبعة عشر، إلا أن مصر أخفقت بجدارة وحلت فى المرتبة الأخيرة بالتساوى مع كل من مدغشقر وتنزانيا ولكل منهم صوت واحد فقط. الدولة الرابعة التى لم يحالفها الحظ كانت كينيا وحصلت على تسعة أصوات.<br />جاءت غانا فى المرتبة الأولى وحصلت على 183 صوت وتلتها زامبيا بـ 182 صوت والسنغال بـ 181 صوت. أقل الدول التى فازت بالعضوية كانت نيجيريا برصيد 169 صوتا لاغير.<br />وعلى مستوى القارات الأخرى فشلت اليونان فى الفوز بمقعد عضوية عن القارة الأوربية بعد عن حصلت على 117 صوتا وكذلك البرتغال التى حصلت على 122 صوتا ، كما فشلت نيكاراجوا وفنزويلا فى الفوز بالعضوية عن امريكا الجنوبية وحصلت كل منها على 119 و 101 صوتا بالترتيب.<br />وفي هذا السياق طالب مركز الجنوب لحقوق الإنسان بالتحقيق في فضيحة ترشيح مصر للمجلس الدولي لحقوق الإنسان. وأكد المركز انه تلقي باستياء بالغ نبأ حصول مصر علي صوت واحد في الجمعية العامة للأمم المتح<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182534/http://masr.20at.com:80/article.php?sid=352&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

