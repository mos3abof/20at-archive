[[comments]]
order = 7
subject = "خبيها من الحسد"
author = "ياء"
posted = "2006-05-22"
text = "بص يا جمال يا اخوياانا ليا كام نصيحه ( اخويا ايه انا عشريناتى وانت 000 ) جمال يا عمى ( مناسبه )<br />1- والله يا واد وعرفت تنقى والله ياواد خدت السنيوره<br />2- المفرود يا حبيبى تخبيها من الحسد<br />3- ميصحش تخرج معاها على طول لوحدكم عشان كلام الناس خد ماما معاك بعد كده او اخوها الصغبر ( حاسس ان هى ضغيره )<br />4 -اوعا ماما تزعلها ( شغل حموات )<br />5- هى ثروه الاموره قد ايه ( سؤال سخيف )<br />6- عايزينك تشد حيلك وتجيب حسسس صغير نلعب بيه ذى ما حسسس الكبير بيلعب بينا<br />7- روح ياشيخ ومتجيش تانى<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182534/http://masr.20at.com:80/article.php?sid=352&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

