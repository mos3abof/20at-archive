posted = "2006-05-22"
text = "يا جماعة مصر اصلا لم ترشح للعضوية في مجلس حقوق الانسان ، يمكنكم ان تتطلعوا عي الصفحة المخصصة بانتخابات هذا المجلس في موقع الامم المتحدة ، و الحمد لله اننا ما اترشحناش لان المجلس الجديد في اليات رقايبة لوضعية حقوق الانسان في دول العالم و خاصة الدول الاعضاء فء المجلس ... ربنا ستر مش لازم العالم يشوف غسيلنا المغسول بالدم"
