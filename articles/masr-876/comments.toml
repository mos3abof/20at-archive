subject = "يااااا ليفى (وإخوانه)"
author = "زنوبه"
posted = "2006-09-04"
text = "يا ترى يا ليفى إنت وإخواتك معانا فى الموقع النهارده بآسمائكم الحقيقيه واللا بآسماء مستعاره (ليفى معازيير) ـ منتحلين آنى إسم النهارده علشان توقعوا الناس فى بعض؟<br />مين يا ترى؟؟!!<br />نفسى آسمع تعليقك الحلو على الموضوع ده يا ليفتى بس بدون آسماء مستعاره<br />يعنى خلينا واضحين مع بعض آحسن وحلوين وبلاش حركات اليهود دى ـ وما تخافش حنكلمك مصرى بالمفتشى."
archived = "2006-09-10"
