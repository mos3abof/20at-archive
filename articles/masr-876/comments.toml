[[comments]]
order = 4
subject = "جزمه عن جزمه تفرق"
author = "نيفين نيفى نوفا"
posted = "2006-09-07"
text = "ف المره الاولى كانت الجزمه دليل ادانه اما ف المره التانيه كانت دليل براءه<br />كان هذا للعلم<br />نتكلم شويه جد بقى<br />ليس كل ما يلنع ذهبا<br />و اللى مش فاهمنى هوضح<br />انا قصدى مش علشان طلعت السادات متبنى قضايا الموتطن الكادح الغلبان نقوم نسقفلو و خلاص<br />لان بصراحه سياسه البلد دى علمتنى مصدقش حد بسهوله<br />و ف القضيد دى بالذات محدش يقدر يجزم(من الثقافه الجزميه برده)الحقيقه ايه<br />و سواء الراجل اللى ف الصوره دى برىء و لا مذنب ففى الحالتين دى مصيبه<br />لانه لو مذنب و طلع فدى كارثه و لو برىء فعلا فدى كارثتين لان كدا بيتاكد لنا ان البلد دى مفيهاش قانون"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173940/http://masr.20at.com:80/article.php?sid=876"
