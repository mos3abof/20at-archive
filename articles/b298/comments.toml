posted = "2006-01-21"
text = "الباشمهندس اللي عايز الطاقية عشان يدبح الطواغيت<br />كلمتين ...اولهم... الدبح مش حل الطواغيت ( اهو السادات اهوه) .. بس ممكن يكون الدبح حل لتفويق الشعوب ( مش بيقولوا الحرب بتفوق )<br />تانيهم .. لو هتفضل مستني الطاقية عشان تغير .. شكلك كدة هتستنى كتير<br />اعتقد اصدق رد شفته في الموضوع ده<br />هي الراجل اللي هيحرق الطاقية اول اما يلاقيها ..."
