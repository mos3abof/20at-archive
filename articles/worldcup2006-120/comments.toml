[[comments]]
order = 12
subject = "الحقيقة باختصار"
author = "نور"
posted = "2006-07-12"
text = "ماحدث هو أن ماتيراتزى قام باستفزاز زيدان طوال المباراة والتجاوز فى اللعب دون أى تدخل من الحكم لحماية زيدان ، وهو لاعب مشاغب وعنصرى وسىء السمعة أصلا ، المهم أنه فى دقيقة الطرد قام بشد زيدان من فانلته وامساكها لثوانى بطريقة مستفزة وكأن يريد قطعها ، فالتفت اليه زيدان فى غضب وقال ( اذا كنت تريد الفانلة يمكننى اعطائها لك بعد المباراة ) يعنى التهكم والسخرية منه أنه سيشرف بأخذ فانلة زيدان ،وبالطبع اخطأ زيدان هنا بالدخول فى مباراة كلامية مع شخص مستفز مثل ماتيراتزى لم يسكت بالطبع ، وقال لزيدان على الفور ( أنت مسلم قذر ، اعطيه لأختك العاهرة !!)<br />وبالطبع ما كان زيدان ليتحمل سب دينه وشقيقته بهذه الفجاجة وهو العصبى أصلا !! فحدث ما حدث !"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075113/http://worldcup2006.20at.com:80/article.php?sid=120"

