[[comments]]
order = 22
subject = "زيدان زيدان جننتونا فيه"
author = "سمر"
posted = "2006-07-16"
text = "كلكم خليتو زيدان البطل الي دافع عن المسلمين زيدان بذات نفسه قال انا مسلم لا امارس الشعائر الدينيه وهو قد سما ابنائه باسماء اجنبيه وهو يقول انه يعتز انه فرنسي ولا نراه يذكر عروبته او انه جزائري زيدان عصبي بطبعه لذلك عندما وقع بمشاده كلاميه مع اللاعب الايطالي رد عليه بالضرب كما فعل مع اللاعب السعودي سابقا وبغض النظر لما قاله الايطالي لكن زيدان لم يفكر بالاسلام والمسلمين عند شتم الايطالي له وهذا لو كان الايطالي قد وصفه بالمسلم القذر لكن زيدان ضربه لانه احس بالاهانة بنفسه وليس باهانةالمسلمين والاسلام وحتى لو كانت الاهانة لكلب زيدان لرد بالضرب لان زيدان احس بالاهانة وجهت اليه فقط<br />ولا يهمني ما فعله زيدان المهم ان المدافع الحقيقي عن المسلمون ايها الشباب هم المجاهدون في العراق وفلسطين الحبيبه ولبنان و افغانستان والشيشان كشمير...الخ"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075113/http://worldcup2006.20at.com:80/article.php?sid=120"

