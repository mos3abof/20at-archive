posted = "2006-07-13"
text = "ماعلاقة الأكراد بما يجري, اترك الأكراد وشأنهم فأنت والله لم تكن يوما من الأيام تعيش في هذا البلد الا بعد أن دافع الأكراد عنها. ألاتخجل من نفسك أن ترد الجميل بهذه الأخلاف الشائنه, والله أنك لاتخجل."
archived = "2007-12-08"
