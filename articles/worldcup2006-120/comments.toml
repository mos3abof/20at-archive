subject = "كل عربى إنسان محترم"
author = "rawa"
posted = "2006-07-13"
text = "كل عربى انسان هو محترموانا من وجهه نظرى شايفه ان ما فيش داعى لتعميم الاسائه لاى شخص سوى للعاب الذى استفز بكلامه ويدان مما دفعه للقيام بهذا التصرف ومن الواضح لكل شخص ان تاريخ زيدان الكروى يتحدث عنه فهو لاعب انسان محترم ومحبوب من كل الشعوب عربيه كانت او اوروبيه فلا غبار عليك يا زيدان حتى اذا ادانه لجنه التحقيق فيجب علينا كأهل له ان نؤازره وهذا بالطبع من شيم العرب"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075113/http://worldcup2006.20at.com:80/article.php?sid=120"

