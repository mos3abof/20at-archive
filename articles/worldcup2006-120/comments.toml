author = "mohssin berrimi"
posted = "2006-07-13"
text = "تاريخ كأس العالم<br />جدول مباريات كأس العالم - ألمانيا 2006<br />بالصور: اليوم الأول لكأس العالم<br />نتائج المباريات<br />ألمانيا تحصد المركز الثالث بالفوز على البرتغال 3-1<br />ألمانيا وإيطاليا في نصف النهائي<br />الارجنتين تفوز على المكسيك 2-1 في الوقت الاضافي<br />انجلترا تتصدر المجموعة الثانية بعد التعادل مع السويد<br />تونس والسعودية تخسران وتودعان المونديال<br />البرازيل بطلة المجموعة السادسة تليها استراليا<br />الأرجنتين تتصدر المجموعة الثالثة<br />غانا تتأهل مع إيطاليا للدور الثاني لمونديال ألمانيا<br />تأهل فرنسا مع سويسرا للدور الثاني<br />تأهل البرتغال والمكسيك في المجموعة الثالثة<br />كواليس المونديال<br />يوم سياسي في كأس العالم<br />كيلنسمان راض عن اداء اللاعبين<br />بيليه ضد مشاركة روني في كأس العالم<br />نجاد: قد اشجعكم بالدور الثاني<br />متفرقات<br />مشاهدة المونديال مفيدة للرجال!<br />رونالدينيو أفضل لاعب في العالم مجددا<br />مارادونا يسعى لتدريب منتخب الارجنتين<br />مؤتمر لمنع العنصرية بين المشجعين<br />إيران تحظر الشعر الطويل في كرة القدم<br />جنوب أفريقيا تستضيف نهائيات 2010<br />ماكلارين سيقود منتخب انجلترا<br />بالصور: مران كوميدي لملوك السامبا في معسكرهم<br />بالصور: قرعة كأس العالم بألمانيا<br />مواقع خارجية متصلة بالموضوع<br />الفيفا<br />الموقع الرسمي لفريق المنيا<br />الموقع الرسمي لفريق السويد<br />بي بي سي ليست مسؤولة عن محتويات المواقع الخارجية<br />أخبار أخرى<br />زيدان يعتذر ولا يشعر بالندم<br />فيدرير بطلا لويمبلدون للمرة الرابعة<br />فيفا تعلن عن تشكيلة \\\"منتخب كأس العالم\\\"<br />| ما هي خدمة RSS؟<br />بودولسكي تألق واحرز هدفي المانيا<br />حجزت المانيا موقعا لها في الدور ربع النهائي في كأس العالم بعد ان فازت على السويد بهدفين مقابل لاشيء.<br />واحرز المهاجم الالماني لوكاس بودولسكي الهدف الاول لفريقه بعد اربع دقائق فقط من بداية المباراة، ثم اضاف هدفا ثانيا في الدقيقة 12 من نفس الشوط اثر تمريرة متقنة من زميله ميروسلاف كلوزه.<br />ولم تقف معاناة لاعبي الفريق السويدي في الشوط الاول عند تقدم الالمان بهدفين، بل زاد حكم المباراة البرازيلي كارلوس سيمون من الضغوط عليهم بطرد تيدي لوسيك بعد حصوله على الانذار الثاني في الدقيقة 35.<br />وتأكد السويديون ان اليوم ليس يومهم عندما اضاع نجمهم هنريك لارسن ضربة جزاء في الشوط الثاني، اذ سدد الكرة بعيدا تماما عن مرمى المانيا لتذهب معها احلام مشجعي السويد في تغيير نتيجة المباراة خاصة وان فريقهم لعب الشوط الثاني كله بعشرة لاعبين."
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075113/http://worldcup2006.20at.com:80/article.php?sid=120"

