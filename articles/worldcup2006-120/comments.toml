[[comments]]
order = 15
subject = "لماذا كل هذا؟؟؟"
author = "محمود سمرة"
posted = "2006-07-13"
text = "يا ترى لو كانت العملية عكسية...<br />هل كان من الممكن أن يتم تحميل المسؤولية لزيدان؟؟؟ أم أن الجميع كان سيقول لحظتها أن ماتيراتزي عنيف ولا يلتزم بالأخلاق الرياضية...<br />ولكن أنه زيدان!!!<br />هل نسي الجميع لحظة أن داس زيدان على اللاعب السعودي في مونديال 1998؟؟؟<br />أنا لا أكره زيزو،،، ولا أحب ماتيراتزي، ولكن أقول أن زيدان لاعب مثل باقي اللاعبين في العالم...<br />يتعرض للضغط في الأوقات الحرجة،، وأمر الاستفزاز وارد في مثل هذه المباريات..<br />وبرأيي الشخصي أعتقد أن زيدان وقع في الفخ."
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075113/http://worldcup2006.20at.com:80/article.php?sid=120"

[[comments]]
order = 16
subject = "ايطاليا تفوز بكأس العالم"
author = "mohssin berrimi"
posted = "2006-07-13"
text = "فازت ايطاليا ببطولة كأس العالم لكرة القدم 2006 اثر تغلبها على فرنسا بضربات الجزاء الترجيحية مساء الاحد.<br />وكان الوقتان الاصلي والاضافي قد انتهيا بتعادل الفريقين بهدف لكل فريق.<br />وطرد الحكم اللاعب الفرنسي زين الدين زيدان في الدقيقة 20 من الوقت الاضافي بعد اعتداء قائد المنتخب الفرنسي بالضرب بدون كرة على المدافع الايطالي ماتيراتسي.<br />وقد صد حارس المرمى الايطالي كرة خطرة من رأس زيدان الذي قفز في الهواء للقاء كرة سينول العرضية في الدقيقة 13 من الشوط الاضافي الاول.<br />كما اضاع اللاعب الفرنسي ريبيري هدفا محققا داخل منطقة جزاء ايطاليا في الدقيقة العاشرة من نفس الشوط اثر تسديدة قوية خرجت الى جوار القائم الايسر للحارس الايطالي.<br />وبعد اضاعة الهدف مباشرة خرج ريبيري من الملعب ليحل محله المهاجم تيريزيه.<br />الوقت الاصلي<br />وقد انتهى الوقت الاصلي لمباراة فرنسا وايطاليا في نهائي مونديال المانيا 2006 بالتعادل بهدف لكل فريق.<br />واجرت ايطاليا التغيير الثالث والاخير لها في الدقيقة 86 من المباراة حيث لعب النجم ديل بيرو بدلا من كامورانيزي.<br />مونديال ألمانيا 2006 - شارك برأيك<br />وقد لعب الايطالي بيرلو كرة قوية من ضربة حرة مباشرة في الدقيقة 77 ولكنها ضلت طريقها الى المرمى الفرنسي بسنتيمترات قليلة.<br />وحصل الفرنسي ديارا على الانذار الثاني لفريقه والثالث في المباراة في الدقيقة 76 اثر لعبة خشنة مع المهاجم الايطالي توني.<br />وقد لعب النجم الفرنسي - الجزائري الاصل زين الدين زيدان كرة عرضية في الدقيقة 75 من المباراة من ضربة حرة مباشرة ولكنها مرت من امام مهاجمي المنتخب الفرنسي الى ضربة مرمى.<br />وسدد الفرنسي تيري هنري كرة قوية من داخل منطقة جزاء المنتخب الايطالي في الدقيقة 64 إلا انها اصطدمت باقدام المدافعين.<br />وقد الغى حكم المباراة هدفا لمنتخب ايطاليا في الدقيقة 62 بسبب التسلل.<br />وفي محاولة لتنشيط اداء المنتخب اجرى المدرب الايطالي تغييرين في الدقيقة 61 حيث خرج المهاجم توتي وحل محلة دي روسي كما خرج بيروتا وحل محله اياكونتا.<br />وشدد المنتخب الفرنسي هجماته على نظيره الايطالي مع انطلاق الشوط الثاني من المباراة النهائية لمونديال المانيا 2006.<br />وقد اصيب النجم الفرنسي فييرا في الدقيقة 56 حيث تم استبداله باللاعب ديارا.<br />وسقط اللاعب الفرنسي ميلودا في منطقة الجزاء في الدقيقة 53 من المباراة اثر تدخل من مدافع ايطالي قبل ان ينفرد الاول بالمرمى الايطالي.<br />واقتربت فرنسا من احراز هدفها الثاني في الدقيقة 50 من المباراة اثر غزوة سريعة من اللاعب تيري هنري إلا ان الدفاع الايطالي تصدى لكرته العرضية.<br />الشوط الاول<br />وقد تعادل منتخبا ايطاليا وفرنسا بهدف لكل فريق في الشوط الاول للمباراة النهائية لبطولة كأس العالم لكرة القدم 2006.<br />وداعا فرنسا 2006! (أسوشييتدبرس)<br />وتقدمت فرنسا بهدف من ضربة جزاء احرزه زين الدين زيدان في الدقيقة السادسة من المباراة.<br />في حين تمكن المنتخب الايطالي من احراز هدف التعادل في الدقيقة 19 بمرمى فرنسا برأس النجم ماتراتسي الذي تصدى بنجاح لكرة عرضية من ضربة ركنية.<br />وكادت ايطاليا ان تحرز هدفا ثانيا في الدقيقة 36 إلا ان العارضة تصدت لكرة المهاجم الايطالي توني الرأسية.<br />وحصل اللاعب الفرنسي سانيول على البطاقة الصفراء الثانية في المباراة والاولى لفريقه في الدقيقة 11 اثر لعبة خشنة ضد الايطالي فابيو جروسو.<br />وكانت البطاقة الصفراء الاولى من نصيب اللاعب الايطالي زامباروتا في الدقيقة الخامسة بسبب لعبة خشنة ضد اللاعب الفرنسي فييرا.<br />وقد اصيب النجم الفرنسي تيري هنري في الدقيقة الاولى من المباراة اثر اصطدامه بالمدافع الايطالي كانافارو إلا انه تلقى العلاج وعاد مرة اخرى الى المباراة.<br />واقيمت المباراة في الاستاد الاوليمبي بالعاصمة الالمانية برلين.<br />وادار اللقاء الهام الحكم الارجنتيني هوراشيو اليزوندو.<br />ارسل هذا الموضوع لصديق نسخة سهلة الطبع<br />اقرأ أيضاً:<br />الصحف الفرنسية: ما سر تحوّل الملاك الأزرق<br />إلى شيطان<br />اولمرت يواجه جبهات متعددة بعد أسر جنديين أسرائيليين<br />تفجيرات لندن:<br />صورة حية ترسمها رسائل قراء بي بي سي"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075113/http://worldcup2006.20at.com:80/article.php?sid=120"

