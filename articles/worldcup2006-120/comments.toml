[[comments]]
order = 2
subject = "برافو زيزو"
author = "معاذ السيد الصاوي"
posted = "2006-07-11"
text = "كل التقدير والإحترام لزين الدين زيدان الذي ألقى بكأس العالم وراء ظهره مقابل الدفاع عن كرامته فهو ابن العرب ولو ان العرب آخر من يعلم وهو صنيعة فرنسا التي استثمرت فيه ليكون أحد ابطالها،مرة ثانية مبروك زيزو كأس الكرامة وعلى قول الشاعرعنترة :<br />لا تسقني ماء الحياة بذلة<br />بل فاسقني بالعز كأس الحنظل<br />ماء الحياة بذلة كجهنم<br />وجهنم بالعز أطيب منزل"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075113/http://worldcup2006.20at.com:80/article.php?sid=120"

[[comments]]
order = 3
subject = "الكرامة اغلى من كاس العالم"
author = "مقداد مصطفى احمد"
posted = "2006-07-11"
text = "في خضم المجازر التي تحدث في وطنناوكانها خبزنا اليومي لا نهتم بكرة القدم كثيرا ...ولكننا تابعنا المونديال على الشاشات لافتقارنا الى وسائل الترفيه لا بسبب الفقر المادي ولكن بسبب الفقر الذهني والمنطق الانساني لدى الدمى التي فرضتها علينا امريكا رؤساء ومسئولين...نعم لجأنا الى المونديال في بيوتنالان الشوارع خالية وتفوح منها رائحة الدم...انا شخصيا كنت اشجع البرتغال التي ظلمها الحكم كثيرا,ربما من باب انها لم تنل كاس العالم ولا مرة على الرغم من مهارات لاعبيها...الضربة التي وجهها زيدان الى اللاعب الايطالي هي اغلى ضربة راس في العالم وقد ارتحت لها نفسيالان الايطاليين رعاع في طباعهم بصورة عامة وهم لا يختلفون عن اولاد الشوارع في البلدان العربية ويتميزون باطلاق الشتائم البذيئة والكلمات النابية عندما يرون انفسهم اقزاما امام الخصم ولعل اعدام شيخ المجاهدين الشهيد عمر المختار خير دليل على همجيتهم وعنجهيتهم... كرهوا زيدان لا لفرنسيته ولكن لاصله العربي ذلك الاصل الذي يحاول شيوخ الوطاويط وخفافيش الظلام اجتثاثه من ارض الرافدين وتحويلها الى جمهورية العراق الفارسية الكردية... تفسير بسيط لمشكلة تدوخ الدوائر الصهيونية في امريكا...الكرامة اغلى من كاس العالم"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075113/http://worldcup2006.20at.com:80/article.php?sid=120"

