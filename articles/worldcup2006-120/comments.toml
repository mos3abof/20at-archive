[[comments]]
order = 0
subject = "كاس العالم فيفا الكاس وفيفا الصفحة"
posted = "2006-07-10"
text = "للامانة انا حبه احيي كل فريق عمل صفحة كاس العالم.. انتوا بجد صفحة جامدة جدا وتألقتوا جدا بجد في فترة كاس العالم دي.. كل الانشطة اللى قدمتوها والموضوعات وطريقة العرض كمان كانت هايلة جدا.. وختاما بالموضوع ده.. يكفي اقول انى مش من هواة الكورة ولسمعة الصفحة الكويسة كنت بدخل اقرا الموضوعات.. وكنت بخلص الموضوعات مستمتعه بجد.. اتمنى ليكو التوفيق اكتر من كدة كمان يارب<br />مش عارفة بعد كاس العالم ايه اللى هتقدموه بس انا مستنيه اتابعكو"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075113/http://worldcup2006.20at.com:80/article.php?sid=120"

