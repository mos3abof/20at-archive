subject = "بأعتذر عن تدهور الوضع بالشكل ده"
author = "بنت الشاطئ"
posted = "2006-06-27"
text = "بنت الشاطئ مجموعه مش فرد وكلنا بنكتب بنفس النيك نيم<br />وانا رئيسة المجموعه دي عشان كده انا بس اللي باكتب بدون ترقيم ومكنش فيه داعي لتدخلك بالشكل ده وافتكري دايما ان<br />( من تدخل فيما لا يعنيه سمع ما لا يرضيه)<br />وباعتذر باسم المجموعه كلها لكل الاعضاء ولاداره الموقع عن اللي حصل"
archived = "2006-06-27"
