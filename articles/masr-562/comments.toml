[[comments]]
order = 10
subject = "اللهم إشفها و أعفوا عنا و عنها"
author = "عابر القارات"
posted = "2006-06-24"
text = "بالرغم من تحفظى على إتخاذ فتاة مريضه شفاها الله و عافاها كموضوع يتسم بالسخرية فمرضها لا ذنب لها فيه (و لربما كان أبوها المزعزم هو سببه الاساسى كما هو السبب فى مرض 10 ملايين مصرى غيرها) و لكن ربما تكون هذه حاله واحدة و إن تعمقنا و فهمنا الامر على حقيقته لأدركنا العجب و لإلتبس علينا الامر فلا ندرى من هو العاقل و من هو المريض العقلى ... فمثلا من يقتل البشر المسالمين فى عقر دارهم بمبيدات مسرطه أليس هو مريض سادى يتلذذ بأوجاع الناس و متبلد الادراك و الشعور فلا تذرف عينيه دمعه واحدة على اى من ضحاياه و يستمر فى الظهور بكل تبجح فى الحياة السياسية و على شاشات التلفاز!! ... اليس من يقول أن مصر لا يوجد بها من يخلف رئيسها الماضى و الحالى و المستقبلى هو مريض بجنون العظمة و يرى الخمسة و سبعين مليون هم أطفالا لا يزالون يبللون ملابسهم!! اليس من يبيع الاصول الثابتة للشعب و التى دفع بسببها من لحمة و دمه و عمره بأبخس الاثمان أليس مصابا بجنون السرقة !!! و النماذج كثيرة و كثيرة على من هم عقلاء بالمظهر و شديدى الجنون بالجوهر لو كنا نرى و ندرى"
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626150824/http://masr.20at.com:80/article.php?sid=562"

