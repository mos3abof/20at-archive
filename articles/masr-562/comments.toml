posted = "2006-06-25"
text = "يا شباب.. إحنا فعلا كنا في وضع حرج، لإننا لا نملك صورة للبنت، وحتى لو كانت عندنا لم نكن نملك حق نشرها، وبالتالي بحثنا عن صورة معبرة، ولم نجد إلا هذه الصورة، وعلى العموم سنقوم بتغييرها، لكن نؤكد أننا لم نكن نقصد أي إساءة بنشر صورة فتاة مخمرة، فهي تقريبا صورة البنت الوحيدة التي تظهر معها صورة السيد الرئيس.. وقبل أن تنقدونا على الصورة.. هاتوا لنا صورا أخرى يظهر فيها الرئيس مع بنت من ابناء بلده..<br />راسلونا على:<br />weladelbald@yahoo.com"
