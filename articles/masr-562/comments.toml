[[comments]]
order = 6
subject = "صورة بايخة اوي"
author = "مصري مقيم بدبي"
posted = "2006-06-24"
text = "انا مع د\\ياسر الصورة بايخة اوي وملهاش مكان طالما ليس لها علاقة بالمقال, المهم اوضاع مصر الإقتصادية في النازل وده طبعاً بفضل القيادة الحكيمة, بس انا عندي سؤال مهم اوي هل احنا محتاجين نغير الرئيس ولا نغير دماغنا؟ يعني المشكلة هي في شخص مبارك ولا في العقلية المصرية, طبعاً هو ليه دور في القمع والانهيار الاقتصادي والاعتقالات ووو...الخ, بس مبارك مبيقولش لموظف الحكومة افتح الدرج بتاعك وخد رشوة, مبيقولش للمدرس استغل التلاميذ ومتقولش حاجة في المدرسة علشان تديهم دروس خصوصية, مبيقولش لسواق التاكسي أنصب علي السائح, مبيقولش حاجات كتيرة سلبية في مجتمعنا ,مش عارف هل لازم نغير من انفسنا الاول أو نتشارك كلنا في التغيير والوقوف ضد الفساد بكل انواعه."
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626150824/http://masr.20at.com:80/article.php?sid=562"

