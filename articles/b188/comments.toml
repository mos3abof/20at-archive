text = "لااااااا انا مع الدلوووعة<br />احنا البناااات بنمووووت فى الوسيم الامور الجميل العسول حاتم فهمى<br />اشكرك يادلووووعة على كلامك الجميل لية وانا كمان بحبك ياحاتم فهمى اوى ويمكن اكتر من دلوعة كمان بشوية<br />ومتزعليش من الواد اللى معلق كلام عبيط فوق دا اصلى هو وكل الولاد متغاظين منو لانة احلى منهم بكتيييييييير<br />باى باى واوعى يا انت تغلط فى حبيب البنااات حاتم فهمى"
