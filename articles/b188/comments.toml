order = 0
subject = "أهلا بالكسل ........إن وجد"
author = "في الكلية كنت أصحو غصب عني لأن كليتى كانت عملية و كانت دايما عندنا أبحاث أو مشاريع أو امتحانات كل شوية فبالعافية أو بالذوق لازم أصحي أما الايام اللي فيها محاضرات فبالطبع ماكنتش بحضرها مش لاني في السرير لكن لأني بكون في الشارع بعمل الأبحاث ."
posted = "2006-01-03"
text = "أما الآن بعد أن اشتغلت برده الدنيا مش وردي فالعمل يجبر الإنسان أن يصحو غصب عنه خصوصا لما تعرف انك ليك عدد محدود من أيام الأجازات و خصوصا لما يكون عندك مدير بيعد عليك كل تأخيرة و كل يوم غبته. على العموم أنا برده لما بلاقي فرصة أأنتخ بأنتخ في البيت و أنام خصوصا في أيام البرد القارص اللى احنا فيه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115012/http://www.20at.com/article2.php?sid=188"

