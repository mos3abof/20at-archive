[[comments]]
order = 11
subject = "صباح اسكتلندا الدافئ"
author = "المهاجر"
posted = "2006-01-22"
text = "والله موضوع جميل تخيلو انه خلاني احب الشتاء مع اني كنت واخد منه موقف بسبب ارتباطه بالبرد والدراسة وكده. لكن الموضوع اعاد تريب اشياء جميلة جدت على الواحد. لما سافرت اسكتلندا كنت خايف من البرد ولوحدي ومن الغربة صعبة تخيلوا لما كمان تكون برد. بس الصراحة كان اجمل شتاء مر علي. بغض النظر ان مافيش شتاء ولابرد بجد سوى بالشارع لانه كل مكان به تدفئه مركزية والناس لابسه صيفي. لكن فكرة تحويل هذا الفصل وتقسيمه الى مواسم من قبل الناس وعمل مهرجانات للتلج في الشوارع هي اجمل ما في الموضوع. اكتشفت كمان انه رغم انه الحرارة ممكن تكون تحت الصفر بس والله ادفا من جو مصر في عز البرد. هناك البرد حنين مش بيدخل في العضم. الحاجة الاهم اني كنت حاطط السرير جنب الشباك اقوم وشوف الرياح والتلج وانام تاني. اما عن رائحة البرودة في الشارع فما اقولكش منعشة جداا نفسك تعبيها في ازايز.. وكل دا كوم والشتاء في بيت جدتي الله يرحمها في مصر دا كوم تاني..واظن ان كتير يا اما فقد الموضوع ده او في ايده بس مش واخد باله منه..وهو يوم الخميس في بيت الجدة وانت قاعد على الكنبة بتشوف مسلسل الساعة سابعة وخالتك وللا جدتك جايبالك الكيكة السخنة والشاي..الله يرحمه شتاء جميل راح وراح معاه شتاء اسكتلندا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115012/http://www.20at.com/article2.php?sid=188"

