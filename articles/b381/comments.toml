[[comments]]
order = 0
subject = "ايس كريم ف ديسمبر"
author = "نيفين"
posted = "2006-02-05"
text = "علميا المفروض ف الشتا تاكل حاجات ساقعه علشان تحس بالفا ة وف الصيف سخنه علشان تحس ببروده<br />و علشان كدا اجمل وقت للايس كريم<br />عز البرد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112504/http://www.20at.com/article2.php?sid=381"

[[comments]]
order = 1
subject = "الزبون دائما على حق"
author = "أكرم بس"
posted = "2006-02-05"
text = "نيفين على حق لان لما الواحد ياكل حاجات سقا الجسم بيحاول يفرز حرارة عشان يعادلها مع حرارة الجسم و من هنا يأتي الدفء<br />و بعدين انا بحب الشتا جدا<br />لان في الصيف الواحد مبيبقاش طايق هدومه و بيبقا مالهوش حل و التكييف بيجيب امراض<br />اما الشتا فيا سلام البس تقيل و هتلاقي الجو جميل و كل واحد حر و كل واحد باحساسه بالبرد و عود جلدك على اللبس ترتاح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112504/http://www.20at.com/article2.php?sid=381"

[[comments]]
order = 2
subject = "؟؟؟؟"
author = "توتا"
posted = "2006-02-06"
text = "بس معلش دا ميمنعش ان فى ولاد فى الجامعة بتستهبل علشان تلفت النظر ليها<br />بس هما حرين يكونو بيتكتكو من البرد وبعدين يخدولهم دور محترم من الانفلونزا<br />يلا باى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112504/http://www.20at.com/article2.php?sid=381"
