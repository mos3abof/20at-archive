[[comments]]
order = 1
subject = ""
author = "مش فاهم"
posted = "2008-09-04"
text = "البنت دى بتشتغل اية بالضبط بياعة ملابس جاهزة<br />والا بتشتغل فى فندق فى الشرم<br />وابوها فين<br />هل يثبت الطب الشرعى ان البنت دى عذراء والا من بتوع الفنادق<br />وازاى البنت دى تهدد الرجالة بشومة حتى لو كانت بنت وزير الداخلية مش عميد هى بنت دكر والا مسنودة على مين فى الفندق - ضابط امن مثلا"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202161221/http://www.20at.com:80/masr/news/10006.html"

[[comments]]
order = 2
subject = ""
author = "احمدابوصالح"
posted = "2008-09-04"
text = "امال البنت بنت الجزمة دية عملة دوشة لية وعمالة تسب وتسخت فى الناس ورب الناس ومحدش هممها على اية كل دة ولية كل دة ولية السب والشتايم دة كلها وخليتى الراى العام كلة عايز يعرف بنت مين الكلبة دية التجرءت وشتمت رب البشر وجبروتها للدرجادى محدش قادر يقف قدمها فى الاخر تتطلع بتكدب فى كمل حاجة ومش مهم تكون بنت عميد ولا حتى بنت كلب المهم الحساب وتتعاقب على الافعال القذرة دية وسبها بالدين لازم تعرف ان اللة حق ولابد من الحساب وبلاش كل واحد ولا واحدة فى البلد دية يعمل اللى على مزاجة بدون رادع"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202161221/http://www.20at.com:80/masr/news/10006.html"

