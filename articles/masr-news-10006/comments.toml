posted = "2009-02-03"
text = "المشكلة مش فى البنت ولا فى الالكتريك شوك اللى معاها المشكلة الأكبر انها سبت لفظ الجلاله والناس وقفه بتتفرج يعنى اصلا الناس فى الشارع ولا عندهم دين ولا حياء حتى ربنا بيتسب واكنها حاجه عديهفعلا الدين لله والوطن للجميع وعمار يا مصر"
archived = "2010-02-02"
