[[comments]]
order = 5
subject = ""
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-06"
text = "و اللة وزارة الداخلية و رجالها مساكين من القله المنحطة التى تدعى انها من ابناء السادة صفوة رجال و زارة الداخلية الشرفاء<br />مصر ما زالت بها من الناس المحترمة الكثير و على رائسهم ضباط الشرطة من عمداء و لواءات شرفاء و لاد ناس محترمة و من تربية و نشاءة و بيئة محترمة<br />حرام عليكم بلاش ظلم للناس المحترمة ضباط الشرطة سواء كانوا(عمداء ) او (لواءات) او حتى لسة شباب من صغار الضباط<br />و الله العظيم دة حرام فى حق هؤلاء الشرفاء!"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202161221/http://www.20at.com:80/masr/news/10006.html"

[[comments]]
order = 6
subject = ""
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-06"
text = "زمان كان على بابا و الاربعين حرامى عندما يدخلون المغارة ليسرقوا من الذهب و المجوهرات و الالماظ و الياقوت كانوا يقولون (افتح يا سمسم) و احمدك يا رب؟<br />اما اليوم و فى هذا الزمان المقلوب فكلمة السر لاى نصاب او حرامى او مجرم او حتى بنت من المومس الشراميط اياهم فهى انا(بنت عميد) او انا (بنت لواء)<br />و اشكرك و احمدك يا بلد!!!<br />يجب و قف هذة الفضائح علشان ربنا يرأف بحال البلد المسكينه دى<br />و اللة المستعان"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202161221/http://www.20at.com:80/masr/news/10006.html"

