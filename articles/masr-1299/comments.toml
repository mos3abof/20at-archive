text = "اتمني تقولوا لنا ازاي نشوف الفيلم مش تكتبي لنا بس يا ست اميرة و بعدين انا حاسس ان مجموعة العمل اصحابك من خلال كلامك عنهم لو سمحت خلي بالك يا اميرة اوعي تقعي في الاخطاء اللي بيقع فيها اكبر صحفيين مصر و ربنا يوفقك ."
