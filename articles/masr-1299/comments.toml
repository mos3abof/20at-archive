subject = "شرف للعلام العربى"
author = "ميدو"
posted = "2006-12-14"
text = "شرفتى الاعلام العربى بافكارك وموضوعاتك الهادفه حيث لمستى نقاط ضعف لدى كل العلاقات الرومانسيهالدائرة فى محيط الشباب والكبار ايضانقاط لا يعلم كل اصحاب هذه العلاقات متى وكيفابدأت؟ ومااسبابها؟ ولماذا ينتهى هذا الحب الجارف بهذه الطريقه البلهاء؟ وعلى الرغم من تحليلك للفيلم الا انهالمست افكارناعبرالموقع ربمالاننانحتاج دائمامن يفكرناويعرفناسلبياتنابطريقه صريحه وواضحه..............شكرا"
