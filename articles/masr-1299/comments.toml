subject = "وصف محايد كالعادة"
author = "we2am"
posted = "2006-12-14"
text = "اعجبني جدا ترتيبك للمقال..وصفك للفيلم و اهتمامك به كتجديد حقيقي في السينما..وخطوة نحو صناعة الافلام القصيرة الروائية..ثم تعريف بصناع الفيلم..مما يدل علي اننا سنقرأ وصفا يراعي اخلاق المهنة..<br />اعجبني انك وصلتي ان المخرج لايريد اجابات علي اسئلة بقدر تجسيد الحالة..و تأكيدك انها التجربة الاولي..<br />فعلا..انا عشقت الفيلم..واضح ان المجموعة نجحوا سويا..وكاتبة المقال نجحت في ايصال روح العمل.."
