[[comments]]
order = 15
subject = "تقرير المنظمه لم يكن منصفا"
author = "حمدي"
posted = "2006-11-11"
text = "انا اري ان التقرير لم يكن عادلا في تقييمه<br />فهل يعقل ان دوله مثل ليبيا ليست وارده في التقريربينما توجد مصر<br />نحن نشتم مبارك ونظامه يوميا علي صفحات الانترنت فهل يستطيع شاب ليبي ان يكتب كلمة نقد واحده في حق القذافي<br />وانا هنا لا احاول ان اجمل وجه النظام القبيح في مصر والنظام البوليسي الذي يحكم مصر... لكن ان يذكر التقرير دولا ويركز عليها ثم يتغاضي عن دول اخري فهذا ليس عدلا<br />اما بالنسبه الي الدول العربيه الاخري المذكوره في التقرير وهبي السعوديه وتونس وسوريا<br />فالنسبه الي تونس هذه من اكثر الدول قمعا للحريات في العالم وليس في الشرق الاوسط<br />وسوريا لالاسف مازالت تمارس قمعا شديدا بحق المعارضين<br />اما السعوديه فهي دوله متخلفه خارج سياق التاريخ لاينفع معها تقييمات ولا غيره"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014023/http://masr.20at.com:80/article.php?sid=1130"

[[comments]]
order = 16
subject = "نريد حلولا ريحونا من حكامنا"
author = "عربي يحتاج الحرية والكرامة"
posted = "2006-11-11"
text = "أصبحت السلطة لدى الحكام العرب هوى ومزاج ومتعة ورفاهية وأموال يتمتعون بها وجيوش يتحكمون بها مسخرة فقط لخدمتهم ولحمايتهم هم وأفراد عائلتهم الأموال ملك لهم الحكم لهم الأمر لهم لا صح ألا الذي يقولونه ولا حكمة ألا التي ينطقون بها ولا رأي ألا رأيهم ولا فكر ولا عقل يفكر ألا هم لا أحد يفهم أويعقل ألا هم أستغفر الله عملوا من أنفسهم كاالألهة لا يجب أن تمس بأذى ولا أحد يقترب منها ولا يجب ألا الخنوع والخضوع لها لأنها هي رازقنا وحافظنا وراعينا وأملنالانسيرألا بأمرها ولا نعيش من دونهاز كل حاكم عربي يبقى معنا يحكم حتى الموت ولولا الموت لبقي ألى قيام الساعة ولاكن ماباليد حيلة ولكن أيضا بعد الموت لاننتهي فبعد موت صاحب الجلالة المعظم أو صاحب الفخامة القديس الأعظم يأتي أبن الملاك الطاهر من ذرية القديس الطاهر ليبقى معنا ألى الأبد ياله من حظ رهيب هذا الذي يوجد لدينا من غير تعب حاكم على الجاهز يأتي فورا بعد موت أبية القديس من دون تعب لا أنتخابات ولا وجع رأس ولا أي دوخة في أحسن من كدة أخبروني بالله عليكم"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014023/http://masr.20at.com:80/article.php?sid=1130"

[[comments]]
order = 17
subject = "محدش واخد باله"
author = "مصرى"
posted = "2006-11-12"
text = "ليه دايما الدول الاسلامية اكتر نسبة دول فيها قمع للحريات انا عايز اعرف هل هما بيظلمونا بتقريرهم ولا ده صح وطبعا الكل شايف وعايش معانا وعارف انه صح<br />ورغم ان فى دول او بتتبع اديان اخرى بس بردك مش بنسبتنا كل مرة ايه السبب"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014023/http://masr.20at.com:80/article.php?sid=1130"

[[comments]]
order = 18
subject = "نريد توضيح يا اخ حمدي"
author = "واحد وخلاص"
posted = "2006-11-12"
text = "هذه الفقره وردت في تعليقك<br />اما السعوديه فهي دوله متخلفه خارج سياق التاريخ لاينفع معها تقييمات ولا غيره<br />حرام عليك بأه بلد الحرمين ومهبط الرسالة الخاتمه متخلفة يا راجل يا طيب وخارج سباق التاريخ"
archived = "2006-11-27"
