[[comments]]
order = 4
subject = "قطرى يشترى كرة المونديال ب 2.4مليون دولار"
author = "فارس_fr"
posted = "2006-11-08"
text = "اشترى القطري الشيخ محمد بن حمد آل ثان كرة القدم التي لعبت بها المباراة النهائية لبطولة كأس العالم 2006 بألمانيا بمبلغ 2.4 مليون دولار وذلك في مزاد خيري أجري في العاصمة القطرية الدوحة بحضور كوكبة من نجوم العالم من رياضيين وسياسيين.<br />وستعرض الكرة في أكاديمية التفوق الرياضي بالدوحة \"أسباير\" خلال دورة الألعاب الآسيوية الخامسة عشرة التي تستضيفها العاصمة القطرية من الأول وحتى 15 ديسمبر/كانون الأول المقبل.<br />كان نهائي كأس العالم 2006 قد جرى في العاصمة الألمانية برلين في التاسع من يوليو/تموز الماضي وجمع بين منتخبي إيطاليا وفرنسا حيث فازت إيطاليا بركلات الجزاء الترجيحية.<br />حسبي الله ونعم الوكيل ... اليس المسلمون اولى بهذه الاموال ...<br />نقلا عن موقع الجزيرة"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014023/http://masr.20at.com:80/article.php?sid=1130"

