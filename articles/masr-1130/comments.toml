[[comments]]
order = 19
subject = "التوضيح"
author = "حمدي"
posted = "2006-11-12"
text = "السعوديه اذا كان المقصود بيها انها بلد الحرمين ومهبط اخر الرسالات السماويه و تقع بها مكه والمدينه احب البلاد الي قلب رسول الله ..وانه ليس بها موضع قدم الا وطاه صحابي<br />فهي من هذه الناحيه احب البلاد الي قلبي .. وهي علي راسي من فوق وماقدر اقول ربع كلمه عنها الا بكل خير<br />لكن يااخي انا اتكلم عن طبيعة نظام الحكم والحياة السياسيه فقط لا غير... فارجوكم لا تخلطوا الامور .. فليس معني انتقادنا لوضع معين قائم في دولة ما اننا نتخذ موقفا عدائيا من هذه الدوله او غيرها بل اننا نحب الخير لها ولاهلها<br />ونريد لكل الدول الاسلاميه ان ينصلح حالها خصوصا مصر والسعوديه لانهما بمثابة القلب من العالم الاسلامي"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014023/http://masr.20at.com:80/article.php?sid=1130"
