subject = "حرية"
author = "ايهاب"
posted = "2006-11-08"
text = "علمونى أمسك قلم<br />وأحفر فى بطن الصفحة<br />شق الحرف مشوار القرار<br />علمونى أمسك بفأس اللأ<br />وأطوى فدادينى إخضرار<br />علمونى.......<br />زى زرعة<br />بعد ما يلح السؤال<br />بعد نَز الميه مالحه<br />ع الجبين حدوته<br />يا ما قولنا<br />مَيتين طيبة<br />يا صاحيين بالكلام<br />لجلُ ما نولى الوجوه للطين<br />ونهبط فى الزحام<br />محفورين بالذل فوق<br />نهر المواجع<br />لجل مانعيش رمز تافه<br />ع الرخام"
