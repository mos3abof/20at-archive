author = "هند دره"
posted = "2006-11-08"
text = "اول حاجه المدونين اللي انقبض عليهم..كانوا في مظاهره..مش اخدوهم من بيوتهم لأنهم كانوا بيدونوا..الا عبد الكريم ..دا كان واحد مدايق شويه ناس عنده في البلد..وما علينا<br />الحكايه مش محتاجه تهويل.. بس محتاجه تتلم وتتلحق.. يعني ناس تقف للحكومه ضد اي محاولات للتحجيم من حريه التعبير ع النت<br />وايوا في مباحث وناس بتشتغل معاهم تخصصهم..المواقع الالكترونيه..وموجود رقابه فعلا ع اللي بينشر ولما بيحبوا يعرفوا حد بيعرفوه..<br />الموضوع محتاج وقفه جامده وبس"
