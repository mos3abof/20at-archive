subject = "علاء سيف الاسلام"
author = "مش مهم"
posted = "2006-11-07"
text = "القبض على علاء أحمد سيف الأسلام و 14 آخرين<br />Submitted by Manal on Sun, 07/05/2006 - 13:47.<br />تم القبض على علاء أحمد سيف الأسلام مع 14 آخرين (شبان و بنات) من بينهم أيضا وائل عباس أثناء مظاهرة اليوم.<br />تحديث قائمة بأسماء المتجزين في قسم السيدة زينب<br />علاء أحمد سيف الأسلام<br />كريم الشاعر<br />أسماء علي<br />ندى القصاص<br />رشا عزب<br />فادي اسكندر<br />أحمد عبد الغفار<br />أحمد عبد الجواد<br />من أفرج عنهم:<br />سارة عبد الجليل<br />ياسر عباس محمد<br />محمد عواد"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014023/http://masr.20at.com:80/article.php?sid=1130"

