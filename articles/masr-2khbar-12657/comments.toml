author = "مصري بالسعوديه"
posted = "2009-07-15"
text = "فعلا السفارات المصريه في الخليج هي ملجأ لموظفيها ويأكلون في قته محلوله من دمنا نحن المصريين العاملين في الخليج والمستشار العمالي عبارة عن موظف ارزقي يسترزق من مكانه يعني يعمل سبوبه ويكون نفسه على حساب المتاجره في مشاكل المصريين يعني بالعربي يقوم ببيعهم لصاحب العمل والسؤال اوجهه للمستشار العمالي بالرياض واقول له لماذا تم رفع الحظر عن مكتب البيئه ( مخططون ومعماريون ومهندسون ) بعد فرضه بأسبوعين وهو من أسوأ الاماكن التي يمكن العمل بها بالسعوديه ولماذا تعطي الفرصه لمدير المكتب وهو للأسف مصري الجنسيه لأكل حقوق العاملين به وتساعده على اضاعة فرص العمل منهم وادخال عمله صعبه للبلد ولجميع العاملين بالسفاره حق الرد"
archived = "2009-07-16"
capture_url = "https://web.archive.org/web/20090716142645/http://www.20at.com:80/masr/2khbar/12657-2009-07-15-07-57-06.html"

