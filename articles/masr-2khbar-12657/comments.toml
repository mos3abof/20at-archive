subject = ""
author = "السفارات المصرية"
posted = "2009-07-15"
text = "فى الخليج وبمنتهى المرارة السفارات المصرية اقل وصف يمكن ان توصف بة انهم شوية انطاع وانطاع جمع نطع والنطع هو الهلف او الشخص الفداوى صاحب القفا الطويل<br />فهم فى الصفوف الاولى فى اى حفلة يدعون اليها فى الفنادق فيذهبوا هم وزوجاتهم علشان يلهطوا ويربوا كروش سوبر ولغد تحت الذقن<br />ومعظمهم بيشتغل فى تجارة العقارات والتسهيلات وامور البيزنس وبيربط مع الشخصيات الخليجية يشاركة فى فندق او قرية سياحية او اى مشروع تجارى ينفع العيال<br />ومعاملتهم للمصريين فى تلك الدول زبالة فحتى لو وصل مصرى صاحب مشكلة الية هيشخط فية ويقول لة اية اللى جابك هنا مقعدتش فى بلدكم لية<br />وينظرون الى المصريين بتعالى وكانة قنصل الوز<br />تروح تجدد الجواز الصبح يقول لك تعالى استلمة بعد عشر ساعات تقعد تلف فى الشوارع الحارة لغاية ما تستلمة وانت جاى من اخر حدود الدنيا<br />مطلوب غربلة لهؤلاء الناس<br />بل اننى ذهبت مرة لتوثيق شهادة فى قنصلية دبى فاوصانى موظف كبير فيها ان احمل هدية كدة اجبارا لموظف فى وزارة الخارجية فى مصر كان السبب فى سفرة الى دبى<br />الموضوع شيلنى واشيلك وراعينى قيراط اراعيك خمسين قيراط<br />الفساد رهيب رهيب"
archived = "2009-07-16"
capture_url = "https://web.archive.org/web/20090716142645/http://www.20at.com:80/masr/2khbar/12657-2009-07-15-07-57-06.html"
