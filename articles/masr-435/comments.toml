[[comments]]
order = 6
subject = "صفقة مضروية"
author = "مش فاكر"
posted = "2006-06-03"
text = "لما واحد زي عمرو زكي ياخد 16مليون جنية تصوروا بقة حازم وجمال حمزة وعبدالحليم ومعتز اينو حياجيلهم نفس يلعبوا..<br />وانا اغرف ان الاهلي ماوافقش على المبلغ ده علشان خاطر ابوتريكة (شوفتوا الاهلي بيراعي مشاعر لاعيبه ازاي\".<br />كمان للأخ اللي بيقول ان وكيل اعمال اللاعب التونسي هو اللي نفض للأهلي احب اقوله ان الباشا وكيل الاعمال كان عايز يقابل حسن حمدي اللي مارضيش يقابله ورفض وقالة بالحرف الواحد : \"كلامك مش معايا مع عدلي القيعي\" وانا لا املك صلاحية اني اشتري لاعبون او اتفاوض باسم النادي\" .<br />اما الياشا مرتضى منصور اللي عايز يعمل اي حاجة والسلام ومش فالح في اي حتة فهو اللي قام بالمفاوضات مع وكيل الاعمال بنفسه وكأن لا يوجد مدير كرة او مدير فني او لجنة شئون لاعبين بنادي الزمالك ولك واحد يجيب اللي هو عايزة..<br />انا من هنا بوجهة تهمة إهدار مال عام لمرتضي اللي عاوز يعمل نفسه عاشق للزمالك وصاحب الصفقان الناجحة والمنتقم من الاهلي اللي مطرقعه 5 مرات وراء بعض.<br />وفي النهاية بقول لجمهور الزمالك \" البس عمروزكي اللي مافلحش مع نادية،وبعدين لية يعني 16 مليون بتوع اية ..<br />حرام عليك بجد يا مرتضى أسلوب الـ3 ورقات اللي بتعمله في نادي محترم زي الزمالك ."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135354/http://masr.20at.com:80/article.php?sid=435"

[[comments]]
order = 7
subject = "زملكاوى صميم"
author = "احمد محمود السنى"
posted = "2006-06-04"
text = "اولا انا للاسف زملكاوى صميم ثانيا للاسف بحب مرتضى منصور جدا بس ليا عتاب كبير جدا على مرتضى منصور حرام عليك تدفع كل المبلغ ده فى عمرو ذكى وعمال تقول خزينة النادى خالية وقولى والنبى نجوم الفريق تعمل ايه مش من المنطقى انى كل اللعيبة تكون اسعارها متقاربة ولا نار الغيرة هيا ايلى عليها الدور انا بقالى كتير مفرحتش عاوز افتخر انى انا زملكاوى فهل ممكن انى ده يحصل ولا مكتوب علينا نسمع كلام وبس i love you zamalik mortada"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135354/http://masr.20at.com:80/article.php?sid=435"

[[comments]]
order = 8
subject = "زملكاوى صميم"
author = "احمد محمود السنى"
posted = "2006-06-04"
text = "انا نفسى يا مرتضى تلم شمل كل الاعضاء ايلى بيكرهوك قبل ايلى يحبوك وتخلى كل واحد يقول رايه ويكون رايك انت الاخير احتراما لكل الاعضاء انت هنا رئيس قلعة كبيرة يا ريت كل حاجة تكون بالاغلبية كدة عمرك ما هتخسر عضو واحد وعامل كل واحد فى النادى باحترام من اصغرهم لاكبرهم انا اقسم لك بالله انا بحبك ومقدرش اتخيل نادى الزمالك من غيرك انت ليه ناس كتير بيكرهوك انا عاوز كل الناس يحبوك وفكر شوية فى صفقة عمرو ذكى انا فعلا فرحان انى عمرو ذكى هيكون من نصيب الزمالك بس انا متاكد انى عمرو هيكون فى الزمالك لواحده حاول تقرب اللعيبة من بعض وكون ليهم اب العبرة مش فى الصفقات العبرة فى البطولات وعندك مثال حى نادى ريال مدريد اغلى نجوم العالم وبدون اى بطولة الموسم ده دى نصيحتى لك يا مرتضى من ابنك احمد محمود السنى اقل عباد الله واكبر مشجع للزمالك"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135354/http://masr.20at.com:80/article.php?sid=435"

[[comments]]
order = 9
subject = "بحبك يا زمالك"
author = "احمد عيادي"
posted = "2006-06-04"
text = "انا احد محبي ومشجعي الزمالك ارجو من ادارة نادي الزمالك ان تعيد لنا مدرسة الكورة في النادي واخراج اللاعبين من ابناء النادي والنظر للناشئين ولو كلفهم الـ 11 مليون جنية أظن أن هذا المبلغ كافي ان يخرج ناشئيينمن مدرسة الكورة بالنادي والبحث في النوادي والمدن والقرى والنجوع المصرية جميعا عن لاعبين جدد أمثال \" رضا عبد العال \" وغيرهم كثير وذلك بدل من انتقال لاعبين ليس عندهم انتماء للنادي وكل همهم جمع الفلوس والطرقعة وبس ، رجاء ان يصل كلامي ال السيد الاستاذ / مرتضي منصور رئيس النادي او اي رئيس للنادي بعدة"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135354/http://masr.20at.com:80/article.php?sid=435"

