posted = "2006-08-02"
text = "اهلا بعمرو زكى فى الزمالك بلد الكورة, والرجالة, ونتمنى التوفيق للزمالك علشان نقفل السنة الاهلوية الحاقدين, والله العظيم لو كان عمرو فى الاهلى لكان يوم القيامة قامت, وماأدراك ماالاعلام الاهلوى الحاقد"
