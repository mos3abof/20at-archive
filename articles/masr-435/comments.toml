posted = "2006-07-08"
text = "انابقول مبروك للزماللك لصفقة عمرو زكى وان عمرو زكى لعب متميز جدا وانا بحبه وكان نفسى وهو فى انبى يجيى الزماللك هو ومجدى عبد العاطى واسامه حسن وعبد الحميد<br />حسن وعبد الغنى وصاروخ وكان نفسى يرجع عبد الحميد بسيونى واحمد عيد عبد الملك وعبد الستار صبرى"
