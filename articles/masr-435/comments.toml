subject = "عن عمرو زكى"
author = "خالد الالفى"
posted = "2006-09-01"
text = "نا اهلوى بس بحب الزمالك المفروط اى واحد يحترف فى اى دوله هو عوزه انا كله بيفيدالمنتخب الوطنى والله<br />المفروط الومالك يرجع عوزين نتفرج على كره من الزمالك ولاسماعيلى انا احت الاهلى فى الاخر عشان مش تقول عشان هو اهلوى بس نفسى اللومالك يرجع للعهدوصح اناخالد الالفى"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122439/http://masr.20at.com:80/article.php?sid=435&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 34
subject = "بحبك ياعمرو بكل لغات العالم"
author = "اسماء همام"
posted = "2006-09-19"
text = "الكابتن اللي بيقول ان عمرو زكي كان بيلعب مصارعة روماني ولما اتزنق حسن مجاهد الله يرحمه في راس حربه جابه انا كنت عايزه اقوللك وهي ده حاجة تعيب عمرو زكي بالعكس طبعاَ وخاصةَلما يكون متفوق وموهوب في الكورة .<br />نيجي بقى لحتة انه عنده رشح في ركبته قوللي ازاي يعني يقدَر يلعب ويتحمل على ركبته وهو عنده رشح بأي منطق وكمان اللي اكد انه ماعندوش رشح بعد ماسافر لألمانيا الكابتن حسن شحاته لمّا لعبه ال120 دقيقة في ماتش اعتزال الكابتن هادي خشبه"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118123408/http://masr.20at.com:80/article.php?sid=435"

