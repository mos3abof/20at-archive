subject = "عمرو ولا أبو تريكة"
author = "محمدين"
posted = "2006-06-22"
text = "ياعالم مش فاهمه حاجه<br />أبو تريكه مين دا أفشك أى والله أفشك<br />وبالأماره هو حد شافه أمام الأسبان ولا فى اليابان<br />هذا الأفشك فى مباراة أسبانيا معملش ليه زى ما بعمل هنا مع الفرق السكة إلا بقيت سكة بفعل فاعل أى والله بعل فاعل<br />وبمناسبة إن عمرو كان لاعب مصارعة<br />ياريت مصر كان فيها كام واحد زيه وبالمناسبة ياأخ طارق حسن سلم لى على الزئبقي بركات واللهو الخفى حسن مصطفي والله يرحم أيام ماكان أحمد ناجي بيعيط قبل ماتشتروا لاعبي المنتخب كله<br />وسلم لى على الحكام ياشيخ من أول محمد فاروق لحد العبيط عبد الرؤوف .<br />وربنا يا طارق ماتيحرمك من العبط."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122439/http://masr.20at.com:80/article.php?sid=435&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

