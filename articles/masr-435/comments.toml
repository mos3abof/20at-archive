[[comments]]
order = 2
subject = "بشرى سارة"
author = "طارق حسن"
posted = "2006-06-02"
text = "بشرى سارة لكل مشجعى الزمالك ان عمرو ذكى عندة رشح فى الركبه وان الاهلى انسحب من الصفقه بعدما كان انتقال عمرو للاهلى خلصان بمعنى اصح الزمالك لبسه<br />يتبقى سؤال لما يكون دة سعر عمرو ذكى الا يساوى ابو تريكه خمسين مليون<br />معلومه اخرى عمرو ذكى كان لاعب مصارعه رومانى بنادى المنصورة جابه الله يرحمه حسن مجاهد لفريق الكرة لانه مكنش لاقى راس حربه والله حقيقه"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135354/http://masr.20at.com:80/article.php?sid=435"

[[comments]]
order = 3
subject = "مبروك للزمالك"
author = "محمود صباح"
posted = "2006-06-02"
text = "بغض النظر عن انى اهلاوى او زملكاوى ولكنها صفقة مميزة فعلا للزمالك وللاخ طارق حسن اللى واضح انه اهلاوى يااستاذ طارق الاهلى منسحبش علشان عمرو عنده رشح ولا حاجة الكشف اللى عملة عمرو زكى فى المانيا اثبت انه سليم ولكن اسباب انسحاب الاهلى من الصفقة اولا السعر الاهلى قال عليه كبير ومبالغ فيه طيب اكوتى الموسم الماضى الاهلى دفع فيه اكتر من 11 مليون جنيه الحاجة التانية المندوب بتاع النادى الروسى هو اللى نفض للاهلى حسب تصريحة ان الاهلى عاملة معاملة سيئة علشان كده الراجل سابهم ومشى وراح للزمالك يعنى الاهلى مسبش عمرو زكى بمزاجة الحاجة التالتة بقى وهى الاهم ان لو الاهلى هو اللى كان اخد عمرو زكى كان قلب الدنيا والصحافة فضلت تكتب عن عنتر ولبلب والاقلام اللى عمال يديها لبلب لعنتر وان عمرو زكى لعيب اسطورة واحسن لعيب فى الدنيا لكن طالما راح الزمالك يبقى لعيب عرة ومصاب واى لاعب فى مصر احسن مكنه وان الزمالك لبسة . لا حول ولا قوة الا بالله"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135354/http://masr.20at.com:80/article.php?sid=435"

