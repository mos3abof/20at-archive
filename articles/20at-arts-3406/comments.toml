text = "تابعني على مدونة (آل ياسر) : http://alayasser.maktoobblog.com<br />زوبعة مفتعلة تلك التي أثارتها بعض الأبواق المعروفة بجهلها المطبق وضحالة ثقافتها وتفكيرها، وانجر وراءها العديد من الناس لأسباب ودوافع تراوح بين هدف سياسي للطعن في كل ما يقوم به الآخر، أو اتباع دون معرفة وتقصي، فشدت الرحال للتظاهر في رام الله يوم السبت 10/03/2007، وصيغت البيانات الرنانة وامتلأت بالتواقيع والأسماء، وبدأت مواقع بعينها تبث العناوين المحذرة من الظلام والجهل والتخلف والعهود الطالبانية وغيرها من الصفات التي أرادوا لها أن تقض مضاجع المواطن الفلسطيني العادي ليثور خوفاً على تراث موهوم، وبحثاً عن تقاليد الأجداد المهانة، والهوية المفقودة!<br />قرار صائب لا لبس فيه ولا غبار عليه بحماية أطفالنا في المدارس من قصص لا تليق بهم صدر في شهر فبراير شباط الماضي بالتخلص من كتاب \"قول يا طير\" من مكتبات المدارس، حيث أنه ليس من المنهاج، ومكتوب بلغة عامية، والأهم أنه يحتوي على ألفاظ وكلمات خارجة عن كل حدود الحياء خاصة بالنسبة للأطفال، ولم يكتب بالأساس للمدارس والأطفال وهو ما أكده مؤلف الكتاب \"كناعنة\" نفسه بقوله تعقيباً على زوبعة الجهلة قائلاً:\" إن هناك سوء تفاهم، فالكتاب بالأساس ليس للأطفال، فهو يدرس على مستوى الماجستير والدكتوراه، وأنا شخصياً درّسته كمساق في الفصل الماضي لطلبة الماجستير في جامعة بيرزيت\".<br />دون أدنى شك أن للمؤلفين الحق في طباعة ونشر كتابهم، والترويج والدعاية له، وتسويقه في المكتبات، وترجمته لكل اللغات، لكن أيضاً من حقنا أن نحمي أطفالنا من قصص لا تليق بهم أو بعقولهم وادراكهم، وبصراحة مطلقة أقول لا ينبغي أن تعتبر تراثاً من الأساس، فأي تراث هذا الذي يمتليء بقصص الفحش وزنا المحارم، والتحريض على السرقة والقتل والدماء؟ وهنا يجب التفريق بين الحق الثقافي للمؤلف والحق المجتمعي في حماية الأخلاق، والحفاظ على الموروث الشعبي الأصيل الجميل، فالتراث، أي تراث، هو نتاج وحصيلة تجارب طويلة مريرة ترفض الطالح وتثبت الصالح، وتترك لنا خلاصة الخبرات عبر السنوات.<br />عودة لموضوع زوبعة الجهلة من الأبواق والتي تصدرها الناطق بالفسق والجهل جمال نزال ليصدر بياناً من بياناته المسمومة اياها يوم 05/03/2007 وأجزم أنه لم يكن حتى قد قرأ الرواية حينها، فما ساقه من شرح لها هو تماماً بالكلمة والحرف ملخصها الذي تنشره دور النشر والتوزيع حولها، ليسوق كماً هائلاً من الترهات التي تنم عن نوعية نادرة من الجهل والتخلف الفكري تستحق فعلاً الدراسة كظاهرة إنسانية فريدة من نوعها ليقول فيما قال: \"أن أهل فلسطين الذين قصوا على أطفالهم روايات قصص\"قول يا طير\" التي أحبوها سيشعرون الآن بأن حكومة حماس تأخذهم إلى حيث لم يأتوا و في مكان مرت منه حركة الطالبان عام 2001عندما قصفت بالمدافع أماكن تاريخيه فيها أبنية عمرها 3 آلاف عام مما أثار اشمئزاز دول العالم الإسلامي كلها. ودعت فتح الفلسطينيين إلى قراءة الكتاب وإنقاذه والدفاع عن هويتهم الوطنية التي تسعى الحكومة لطمسها بعمليات جراحية ظالمة فيها خطر \"الطلبنه\" وتأتي عقلية لا تعترف بحق الفلسطينيين بالتميز عن باقي الشعوب الإسلامية على أساس البعد المحلي المجسد بالتراث\".<br />لم يتأخر الشيء المسمى ياسر عبد ربه في مساندة رفيق الجهل والتخلف فصرح بدوره في اليوم التالي 06/03/2007 قائلا في تكرار ببغائي غريب لما قاله سابقه في الجهالةً: \"ان هذا الاعدام يرقى الى مستوى الجنون الطالباني الذي نسف 'تمثال بوذا' في افغانستان، رغم قيمته التاريخية والفنية. واعتبر ان هذا التفكير الذي ينتمي الى ممارسات محاكم التفتيش في القرون الوسطى، مؤشر خطر على محاولة القضاء على التنوع الثقافي والأدبي الفلسطيني، وهو تدمير ممنهج للتراث الوطني الديموقراطي والانساني الفلسطيني، ويجب ان يتم التصدي له وان يلقى كل ادانة\"<br />لحق بركب ناطق الجهل والتخلف مجموعة أخرى من أصحاب العقول النيرة الرشيدة، يجمعهم شيء واحد: أنهم لم يقرأوا الكتاب ولا محتواه، فكتبوا المعلقات في التراث الفلسطيني الذي حفظه الكتاب من الضياع، وروعة قصص جداتنا، وهويتنا وموروثنا ووطنيتنا ولهجتنا وقصصنا وطفولتنا، بل وصل الأمر لاعتبار أن ما فيه من قصص هي موروث ما قبل قبل الميلاد، وأنها تعود الى نحو ثلاثة الاف او اربعة الاف سنة وقد جاءتنا من السومريين والأكاديين ونقل بعضها عن الفراعنة، ليعتبره آخرون \"من أمهات كتب التراث الفلسطيني\" وهو الذي يحوي فقط 45 خرافة!<br />في ظل هذه الحملة الإعلامية غير المسبوقة وجهت مجموعة من المفكرين والمثقفين والأدباء رسالة لمحمود عباس وهنية دفاعاً عن الكتاب التراثي الكبير، وقد حملت الرسالة أسماء وتواقيع شخصيات لها احترامها في المجتمع الفلسطيني وقعت وبكل أسف في حبائل نزال وعبد ربه وتسرعت في موقفها، فبدلاً من التأكيد على حق المؤلف والكاتب في نشر ما يريد، ووضع الكتاب الصحيح في المكان المناسب، وحماية أطفالنا من بذيء القول، خلطوا الأمور بعضها ببعض في تخبط واضح وكان نص الرسالة كالتالي:<br />السيد رئيس السلطة الوطنية محمود عباس المحترم<br />السادة أعضاء المجلس التشريعي المحترمون<br />ارتكبت وزارة التربية والتعليم عملاً مريعاً وخطراً، أثار عاصفة من الذهول والاستنكار في أوساط مختلف فئات الشعب الفلسطيني ومثقفيه ونخبه، من خلال قراره بإعدام كتاب (قول يا طير) وما فيه من حكايات \"نص نصيص\" \"جبينة\" \" الشاطر حسن\" \"الطير الأخضر\" \"بقرة اليتامي\" وأربعين حكاية شعبية أخرى للكاتبين د.شريف كناعنة و د.ابراهيم مهوي، وذلك بناء على قرار أصدرته وزارة التربية والتعليم يقضي بإعدام جميع نسخ الكتاب، ومنع استخدامه وقراءته في جميع المدارس الفلسطينية بذريعة \"وجود ألفاظ تخدش الحياء\".<br />الكتاب الذي تعرضت نسخه للحرق، هو كتاب أكاديمي علمي يعد من أمهات كتب التراث الشعبي، ترتقي فيه صورة المجتمع وعاداته وتقاليده وثقافته منذ ثلاثة أو أربعة آلاف سنة، فيما الحكايات الشعبية المختارة في الكتاب جزء من إرث حضاري مشترك مع شعوب العالم .لقد حصلت فلسطين قبل عامين على جائزة التراث الشفوي على مستوى العالم كله، وذلك عبر هذا الكتاب بالذات الذي جعل \"الأونيسكو\" تعتبر أن المحافظة على التراث الفلسطيني هو من مهمة جميع شعوب العالم قاطبة.<br />تبرز حكايات الكتاب ملامح ثقافة شعبية تمتاز بقيمة فنية وجماليات السرد باللهجة الفلسطينية الشعبية، وقد دفعت أهم دور النشر العالمية التابعة لجامعة \"بيركلي\" لإصداره وتوزيعه، وحفزت دول ومؤسسات عالمية لترجمته إلى خمس لغات حتى الآن. ويستخدم الكتاب لتدريس مساقات على مستوى الماجستير والدكتوراه في جامعة هارفارد العريقة.<br />وشكل الدافع الأساسي لاختيار الحكايات عرض صورة موضوعية نابعة من أرض فلسطين وتراثها الإنساني، كاشفة الجذور التاريخية لتشكل الأساطير والحكايات الشعبية، ومن أجل الحفاظ على فن قصصي نسائي كان واسع الانتشار في فلسطين التاريخية.<br />من الذي يمتلك حق محاكمة هذا الإرث الإنساني.؟ من يجرؤ على إخضاع التراث للتنقية أو التنظيف؟ لا أحد يملك الحق في أن يأتي بعد آلاف السنين لإسكات وإلغاء هذا التراث الإنساني.<br />وزارة التربية والتعليم أخذت على عاتقها محاكمة التراث والحضارة بمسوغ ( خدش الحياء) الذي يبعث على رثاء المستوى الثقافي لمؤسسة تربوية عريقة.<br />إن قرار الإتلاف أو الحرق يكشف جهل القائمين بحقيقة الجهد العلمي المبذول في الكتاب، وبمغزى ووظيفة ودور التراث في الثقافة الوطنية. ويسلط الأضواء على تبني أوساط متنفذة في المؤسسة الفلسطينية لمنطق محاكم التفتيش المتناقض مع مبدأ التعدد وحق الاختلاف. ثمة خوف حقيقي من الأفكار المتزمتة التي لسان حالها إقالة العقل ومحاصرة كل انفتاح على الحضارة الإنسانية، وكل نزوع عقلي إلى الجديد وكل غوص هدفه استخراج الموروثات الثقافية. ما زال ماثلا في كتب التاريخ \"محرقة العلوم والكتب المترجمة\" التي نظمها المتزمتون وانتهت بدخول حضارتنا العربية الإسلامية عهد الانحطاط والظلام، فهل سيقودنا حارقو (قول يا طير) إلى تلك العهود الغابرة؟<br />نحن الموقعين أدناه نطالب بما يلي:<br />* نرفض ونستنكر بشدة قرار وزير التربية والتعليم بإتلاف كتاب (قول يا طير).<br />نطالب بتشكيل لجنة تحقيق مستقلة ومساءلة ومحاسبة كل الضالعين باتخاذ وبتنفيذ هذا القرار الفضيحة وفي مقدمتهم وزير التربية والتعليم الدكتور ناصر الدين الشاعر.<br />نطالب بإسناد حقيبة التربية والتعليم في حكومة الوحدة الوطنية القادمة إلى كفاءة أكاديمية مستقلة، ومهنية تضع حدا لمحاكم التفتيش الجديدة، وتحافظ على ثقافتنا الوطنية دون تعسف ظلامي أو جهل غير مبرر وعدم تسخير جهاز التربية والتعليم لأغراض حزبية وفئوية ضيقة.<br />نطالب المراكز والمؤسسات ومنظمات المجتمع المدني الاضطلاع بدورها في الدفاع عن تراثنا الثقافي والحضاري الذي يتعرض لمؤامرة التغييب والتصفية.<br />محمود درويش، حيدر عبد الشافي، إياد السراج، يحيى يخلف، محمود شقير، محمد سليمان، جميل هلال، روز شوملي، ناصر القدوة، سمير حليلة، سعد عبد الهادي، اردا مارياروسيان، د. المتوكل طه، ليانا بدر، فاروق وادي، إبراهيم نصر الله، عادلة العابدي، د. نادر سعيد، وليد أبو بكر، جمال زقوت، فيصل حوراني، طلال عوكل، إبراهيم المزين، زكريا محمد، هاني المصري، خالد درويش، حسن البطل، صالح رأفت، عائشة عودة، حسن خضر، سمير شحادة، سوسن مروة، أحمد عبد الرحمن، مهند عبد الحميد، محمد الطراوي، د.عصام سعيد، شادية الحلو، سميح عبد الفتاح، عبد الكريم عطيفات، خالد حوراني، غسان زقطان، فيحاء عبد الهادي، عطاف يوسف، عوض أبو عرمانة، عدي الهندي، تيسير محيسن، نائلة عايش، رجب أبو سرية، يونس الجرو، أشرف العجرمي، هاني حبيب، مروان عبد الحميد، خالد جمعة، رياض الحسن، محمد الشرافي، علي حسين، صلاح عبد الشافي، إبراهيم عبد العزيز، رباح مهنا، ريم فضة، أحمد صبح، أحمد داود، أحمد مجدلاني، منذر عامر، شهاب محمد، جهاد صالح، ميسر أبو علي، زعل أبو رقطي، مهيب البرغوثي، حيدر عوض الله، خليل شاهين، توفيق أبو غزالة، ماجد كيالي، جهاد الرنتيسي، باسم برهوم، عامر بدران، وفاء عبد الرحمن، محمود أبو هشش، سميح خليل، رناد القبج، صالح مشارقة، وليد الناظر، رياض مشعل، أكرم سمحان، جوني خوري، جورج قهوجي، حاتم الدويكات، وبسام مجج.<br />لم يكتف أمثال عبد ربه ونزال بسيل الأكاذيب والتلفيقات والتباكي على التراث الضائع بل عمدوا لتسيير مظاهرة في رام الله دفاعاً عن تراثهم الضائه الذي وصله سيف محاكم التفتيش يوم 10/03/2007 وخرج الرجال والنساء يحملون نسخ الكتاب يطالبون القاصي والداني بقراءته، ولنقرأ سوياً بعض الألفاظ التي وردت في هذا الكتاب التراثي الذي يراد لأطفالنا أن يدرسوه في مدارسهم، مع مراعات التحذير الوارد في مقدمة هذا الموضوع حيث أنه لابد من نشر الألفاظ كما هي لمعرفة طبيعة ما ورد في الكتاب، وإن اعترض أحد على نشرها فمن باب أولى أن يعترض على وجود الكتاب على رفوف مكاتب مدارسنا!<br />من هذه الألفاظ:<br />ص 67:<br />الله يلعن أبو اصحابك شو دينها هاي؟<br />ص 68: يلعن ابو اصحابها! والله العظيم لاقعد أشخ فيها. قام قعد يا حبيبتي وشخ بقلبها<br />ص 70: لمّن رجع ابنها من الحج تغشم عليها وافتكرها مرته. فسألها عن إمه قالتله: إمك ماتت وهيها مدفونة بحديقة القصر. لمّن نامت مع إبنها حبلت وصارت تتوحم وقالت لإبنها: يا ابن الحلال جيبلي قطف حصرم من عند الجيران.<br />ص 97:<br />آه يا ابن ال[ *** ]، علقت، شو أساوي فيك؟<br />ص 179:<br />يلعن أبوك على أبو اللي ناسبك واعطاك بنته.<br />ص 181:<br />والقحبة بنت عمك.<br />ص 204:<br />قالها الجمل قاعد بلوك. قلتله اطعمني، مقبلش. يشن عليّ، حطيت ورقة القرنبيط على [ *** ]تي. قام خمشني. يوكل ورقة القرنبيط ويوكل [ *** ]تي. قالتله: كل شي فداد فداك، غير بيظاتك وخصاك.<br />سيخرج علينا البعض بحجة أن هذا هو موروثنا الإجتماعي وأمانة النقل توجب أن ينشر كما هو، ليكن لكن ذلك لا يعني إطلاقاً أن يحفظ ويدرس لأبنائنا، وأي تراث هذا الذي يتحدث عن زنا المحارم وبأقذر العبارات، وأي عقل سيقبل أن ينقب ويبحث هؤلاء عن البذاءة لحفظها لنا كتراث مقدس لا يمس، وهل تراث فلسطين يقتصر على هذه العبارات والقصص؟<br />سيقول آخرون أن هذا انتقاء واجتزاء لعبارات وألفاظ بعينها لا تشمل كل القصص والخرافات وأقول أن عبارة بذيئة واحدة كفيلة باعتبار الكتاب لا يصلح للأطفال لأنه وكما يقول أديب الأطفال (أحمد المصلح): \"يحوى الوجدان الشعبي الفلسطيني تراثاً جديراً بالاهتمام، الأمر الذي يفرض علينا أن ننقب عن الجانب الإيجابي فـيه وتقديمه لأطـفالنا، لمساعدتهم على تكوين شخصـيتهم الاجتماعية والثقافية ضمن تطورها السليم والمكتمل\"، ويؤكد (هادي نعمان الهيتي) في هذه القضية أن \"في الحكايات الشعبية ما يمكن أن يصلح للأطفال، ومنه ما ينبغي إبعاده عنهم، لما يحمله من أضرار، ومنه ما يمكن إعادة كتابته في مضمون وشكل قشيبين\"، وما سبق هو مقتطفات وردت في بحث مطول لتيسير المغربي حول أدب الأطفال.<br />ظلامية جهل تخلف عودة للوراء كانت هي ادعاءات جمال نزال وعبد ربه وباقي الجوقة من \"الفهمانين\" الحريصين على تراث وأخلاق شعبنا، وهو ما أكده الناطق بالجهل والفسق مرة أخرى جمال نزال في مقال نشرته له يوم 12/03/2007 بعض المواقع المرتبطة بأولياء نعمته أمنياً، وبأسلوب لغوي ركيك ومبعثر مليء بالأخطاء الفادحة التي لا تليق بتلميذ في الصف الأول، تحت عنوان \"\"قول يا شيخ\" اخرس يا طير .. انهض يا حسن … إنهم يذبحون الهدهد\" ليثبت جهله التام بمعنى التراث والأخلاق، ولا عجب فهو خريج مدرسة لا تعير للأخلاق اهتماما، وابن نهج لا يفرق بين الصالح والطالح، ونتاج لجيل من الفساد والافساد يدافع عنه باستماتة، وإليه ولكل من تنطع للدفاع عن اللا أخلاق أقول:<br />هل يقبل أحدكم أن يمسك بالكتاب ليقرأ لبنته أو أخته مثل هذه القصص والعبارات والألفاظ؟ أتحداكم أن تفعلوا! فكيف تريدون لأطفالنا أن يدرسوها؟ وأي وجه هذا الذي تحملونه لمعارضة قرار يحفظ أخلاق أطفالنا؟ وأذكر من قال أنه تربى في المساجد بأن حركته التي ينطق باسمها سبق وأن طالبت قبل 3 سنوات بسحب الكتاب إياه من الأسواق، وأذكره بأن حركته المختطفة من قبل من يمثلهم سبق وأن قامت بإحراق الكتب ومنعها ولم يحرك ذلك في رأسه الفارغة شعرة، وللتذكير أسوق ما كتبه عبد الكريم زيادة/رئيس ديوان تربية رام الله قائلاً:<br />للحق أقول إن كتاب قول يا طير والذي اعدم بطريقة القتل الخطأ والتي لا تغتفر لم يكن بسبب فكر سياسي معين كما يحلو للبعض أن يتغنى وإذا وصف البعض إن وزارة طالبان أعدمت نص نصيص وأحرقت قول يا طير فأن وزارة طالب أول السالفة سحبت رواية الأسيرة للكاتب والروائي صافي صافي المحاضر في جامعة بير زيت عم1997 وهي رواية تحافظ على الموروث الثقافي والحضاري والإنساني والمادي لفترة معينة علما بأنها تحتوي بعض الألفاظ التي استخدمت في تلك الحقبة والتي ما زال البعض يستخدمها.<br />علما بان تلك الرواية كانت مهداة من اتحاد الكتاب لوزارة التربية والتعليم العالي التي قامت بتوزيعها على المدارس من ثم سحبتها بحجة وجود الفاظ تخدش الحياء .<br />ومالحق بكتاب الكاتبة زينب حبش طريق السعادة الذي حرقت جميع نسخه قبل عامين جميعها تشير إلى أن سياسة الوزارة سابقا ولاحقا ضد الألفاظ التي لا تناسب طلبتنا دون اعتبار الوضع السياسي الراهن او(خروج عنقاء الدمار من الرماد) كما يدعون.<br />لما سبق ألقول أن خدش الحياء غير مسموح به في المدارس حتى لو كان مسموحا في مجالس الأعيان والنواب ومجالس الشعب والوزارة فضابطة الألفاظ في المدارس للطالب والمعلم يجب إن تبقى.<br />يقول الكاتب د.عصام شاور حول الكتاب:<br />\" قبل أن يثار الجدل حول ذلك الكتاب لم أكن قد قرأته ولكن من شدة المديح رحت ابحث عنه حتى وجدت نسخة منه باللغة الانجليزية وبعض القصص المتناثرة باللغة العربية على الشبكة العنكبوتية , ولكنني صدمت حين علمت أن الكتاب لا يحوي أكثر من 45 خرافة , فقلت في نفسي ألا اقلل من قيمة الكتاب لصغره , فربما يكون الإعجاز في نصوصه , ربما يكون هناك الإبداع والعلوم والأدب , فبدأت بالقصة الأولى وهي بعنوان \" طنجور , طنجور \" وهي باختصار تتحدث عن امرأة تلد طنجرة , وتقوم تلك الطنجرة بسرقة أموال الشعب وتأتي بها إلى أمها والتي تسر بما تفعله ابنتها الطنجرة من عمليات نصب واحتيال على البشر , إلى أن تأتيها طنجرتها العزيزة وفيها \" براز\" البشر فتحرم السرقة ليس شعورا بالذنب ولكن لأنها اكتفت بما سرقته من الملكة من مجوهرات وذهب ولا حاجة لها ب \"المخلفات البشرية \" , فهذه بداية الكتاب الذي يدافع عنه المدافعون , الدرس الأول اذن هو كيف تسرق الناس , فهل السرقة من عادات الشعب الفلسطيني ؟؟ هل طرق النصب والاحتيال ما نفخر به ونحتفظ به في مدارسنا , هذا فضلا عن بعض الكلمات التي تخدش الذوق السليم .<br />وكما يبدأ كتاب \" قول يا طير\" بخرافة الطنجرة \"الحرامية\" ينتهي بخرافة الشيخ المحتال \" أبو علي وأم علي \" حيث تدور القصة حول رجل لا يعمل فتحثه زوجته على كسب رزقه من المقابر أيام الخميس , ويستعين على عمله بكتاب الله عز وجل وهو لا يقرأ ولا يكتب ويكتفي ذلك الرجل بمسك المصحف و\"يهمهم\" وكأنه يقرأ القرآن فيجود عليه المتواجدون في المقبرة بما تيسر , ثم ما يلبث ذلك الرجل المحتال أن يدعي علم الغيب وما في الأرحام حتى يصطفيه الملك ليكون مرشده ويتنبأ له بكل صغيرة وكبيرة وتنتهي القصة دون أن يكشف أمر ذلك المحتال , ومن خلال هذه القصة لا شك أن نظرة الأطفال نحو قارئ القرآن سوف تكون مخيفة , كما أن الطفل سيعرف أن حبل الكذب أطول مما كان يتصور , وان لا عقاب لمجرم ولا عقاب لمحتال .<br />ولم تقتصر خرافات الكتاب على تبسيط أمر السرقة والاحتيال ولكنها تعدت ذلك إلى حدود تقشعر لها الأبدان وتنفر منها النفوس السليمة , ولا اعلم كيف يمكن لأحد أن يحكي قصة أمير يتزوج أمه وينجب منها أو ملك يحاول أن يتزوج ابنته , وكذلك فان بعض القيم انهارت من خلال خرافات \" قول يا طير \" فالتضحية بالولد والأخ هي من الأمور العادية , فمثلا : زوجة الأب خوفا من عقاب زوجها لأنها أكلت \" الكرشة \" تذبح ابن زوجها وتطعمه إياه, وأخت الولد الذبيح هي التي توقع أخاها من اجل أن لا تعاقبها زوجة أبيها , والأب يأكل ابنه المطبوخ , وعظام الولد في نهاية القصة تتحول إلى طائر اخضر يقتل زوجة أبيه ثم يقتل أباه ثم يعود إلى هيئته الأولى سليما معافى ليعيش مع أخته في هناء , فأي صور مقززة أكثر من تلك ؟؟؟<br />كما انه في قصة أخرى تقدم الأم ابنها \" للغولة \" لتأكله حتى تنجو هي وزوجها من شر \" الغولة \" , ليقتلوها في نهاية القصة ويعيشوا سعداء مع بعضهم رغم فقدانهم فلذة كبدهم .<br />طبعا من خلال القصة يدرك القارئ أن لا فرق بين \" الغولة \" والبشر في ذلك الوقت , فكلاهما يقتل الأطفال ويأكلهم إلا أن البشر ربما يحبذون أكل الأطفال بعد طبخهم .<br />هذه بعض المواقف في كتاب يمتلئ بسفك الدماء وزنى المحارم والتضحية بالأحباب , وغيرها من الأمور الفظيعة .<br />من خلال ذلك يتضح أن كتاب \" قول يا طير\" بعيد كل البعد عن الصفات التي أسبلها عليه من لم يقرؤوا ربما الكتاب , ولو قرؤوه لكان لهم رأي آخر .<br />أما بالنسبة للذين يدعون أن تلك الخرافات تعود إلى ثلاثة أو أربعة آلاف سنة فأعتقد أنهم ما علموا أن القرآن لم ينزل على محمد (ص) إلا منذ ما يقارب أل 1400 سنة , كما أن بارودة حسن وحسين التي استعملاها في الصيد لم تكن معروفة إلا منذ عدة مئات من السنين فقط , فالقول بالتأليف هو أمر مضحك للغاية .<br />والغريب أن يترجم كتاب الخرافات إلى عدة لغات , فان كانت قيمة الكتاب كما يدعي البعض تكمن في اللهجة العامية فلم الترجمة إذن ؟؟؟ وماذا ستكون نظرة الغرب إلى قوم يرسخون في عقول صغارهم قتل الآخرين , واستحلال المحارم , وينشئونهم على الطباع والأخلاق السيئة .<br />مما كتب في بحث تيسير المغربي أقتبس التالي:<br />كلمة لا بد منها<br />فإلى المتباكين الآن على (بوذا) الفلسطيني من الاعتداء، (بوذا) الفلسطيني لا يحتاج إلى تسطيح واستغلال حزبي ضيق لصالح المواقف السياسية، لأن (بوذا) وهم، أما الحقيقة، فإن تراثنا الفلسطيني بخير، وهو يحتاج إلى العاملين بإخلاص وجد ومثابرة، وطريق الذين اهتموا بالحكايات والقصص الشعبية الفلسطينية، وعنوا بجمعها وثوثيقها، وإعادة كتابتها قصصاً للأطفال مستلهمة من هذه الحكايات لا زال مشرعاً، ومن هؤلاء: فايز الغول، نمر سرحان، علي الخليلي، عوض سعود عوض، جميل السلحوت، عبدالله عيشان، عبد الفتاح أبو معال، منعم حداد، عبد اللطيف البرغوثي، نجيب نبواني، وروضة فرخ الهدهد، وتوفيق زياد، عمل البعض في صمت، وبجهود ذاتية متواضعة، ولم ينتظر إشهاراً سياسياً، فمن أراد أن يعمل فها هو الطريق…<br />إن قرار سحب الكتاب من مكتبات المدارس يستحق الشكر والثناء، ويستحق الدعم والمساندة، فإن تراجع عنه وزير التربية والتعليم ورضخ لابتزاز عديمي الأخلاق من الجهلة الحاقدين، فهو ومع كل الاحترام لا يستحق منصبه ومركزه، وعليه الاستقالة منه فوراً دون ابطاء، فأخلاق أطفالنا ليست برهينة في يد الغوغاء وأبواق الجهل والبذاءة، ومصيرهم مستقبلهم لا يرسمه اشباه الرجال من أتباع مدرسة الخمسة بلدي، وتراثنا لا يقبل أن نقدس السيء ونترك الجيد.<br />هذا ليس بتراثنا ، وهذه ليست أخلاق جداتنا، وهذا ما لا أرضى لأبنائي أن يسمعوه أو يكرروه، وإن كان كذلك أقول وبوضح شديد تباً لهكذا تراث نخجل ونتوارى منه، لا أن نمجده ونضعه في مصاف المقدس كما يريد من انعدمت أخلاقهم.<br />د.إبراهيم حمّامي DrHamami@Hotmai l.com<br />13/03/2007<br />مع حكاية كاملة من تراثنا المزعوم!<br />ابو اللبابيد<br />الراوية:وحدوا الله<br />الحضور: لا إله إلا الله<br />كان هون هالملك، هالملك مالش غير هالبنت. يوم يوم مرته حطت راسها وماتت. دار يدوّر يدوّر بدّه يتجوز. بِدِيْ يحكي بهاي، يحكي بهاي، ما يعجبش. ما حليش بعينه، قال، ولا اجا عباله إلا بده يتجوز بنته. صار يفوت عالبيت، تقوله: \"يابا\" يقولها: \"تقوليش يابا. قولي يا ابن عمي\" . : \"يا يابا! يا ابن الحلال، أنا بنتك!\" قالها: \"لأ. مافش نتيجة. خلص\".<br />يوم، ودّا ورا القاظي. قاله: \"يا قاظي، شجرة ربيتها، أطعمتها وأسقيتها، بتحلّ إلي والاّ لغيري؟\" قاله: \"بتحل إلك\". القاظي سحب حاله وروح، وهظاك راح جابلها هالسيغة، وجابلها بدلة، وبده يوخذها.<br />لبست هالذهبات، ولبست هالبدلة، وتطقمت . اجا أبوها المغرب. لمن شافت البنت إنه أبوها بده اياها من كل ولا بد، راحت عند متاع اللباد. قالتله: \"خذ مصاري قديش بدك، وقيسني واعملي ثوب لباد يغطيني كلي لاجريّ وإيديّ، بس يبينوا خشومي وثمي وعيوني. وبكره بدي اياه يكون خالص\". قالها: \"طيب\".<br />راحت هاي جابت ثوب هاللباد وحطته بهالخشة اللي بحد باب هالدار وسكرت عليه. ولبست هالذهبات وتطقمت، وقعدت بهالسهلة. اجا أبوها المغرب. قالتله: \"يابا\". قالها: \"تقوليش يابا. قولي يا ابن عمي\". قالتله: \"طيب يا ابن عمي. استنا تأطلع لبره شوي عبيت الخارج\" – حيشا السامعين. قالها: \"إسا بتنهزمي\" .<br />قالتله: \"لأ. أربط الحبل بإيدي وكل نتفة بتهز الحبل بتعرف إني موجودة\". تطلعت، في حجر كبير بقاع هالدار، ربطت الحبل بالحجر وربطت أساورها بالحبل وراحت عالخشة لبست ثوب هاللباد وقالت: \"يا من قصدوك!\" طلعت بهالليل ومشيت. هو صار كل نتفة يهز هالحبل يسمع الأساور تخش يقول: \"بعدها هون\". صارت الدنيا نص الليل، قال: \"والله غير أقوم افقدها\". لاقى هالحبل مربوط بالحجر، والأساور فيه. هاظا عدّد على هالحصان، وتخفى وركب وطلع يدوّر عليها. هاذيك طلعت. ما لحق إلا هي طالعة من المدينة وبرّا. لحق هاظا، صار يدور. لحقها. شافته، عرفته لبدت بعرق هالشجرة. هو ماعرفهاش، فكرها زلمة.<br />قاله: \"ما شفتش هالبنت مرت من هون، وصفها من وصفها؟\" قالتله: \"يا عمي، الله يخليك، خليني بحالي. أنا مش قادر أشوف قدامي\".<br />دشرها. وهو مشي بدرب، وهي خلته تراح، ومشيت بدرب ثانية. ظلت هون تنام وهون تقوم تأجت على مدينة ثانية. اجت على هالمدينة، من جوعها اجت تحت قصر دار الملك. اجت عبدة دار الملك كتّت هالسدر ، اجت هاذيكا مدت على توالي هالأكل وتوكل. شافتها العبدة، رجعت.<br />: \"يا ستي تع شوفي، في عجيبة تحت الدار عمّال بوكل من توالي السفرة\".<br />قالتلها: \"روحي نادي عليه، خليه ييجي لهون\". قالتله: \"تعال لعند ستي، بدهن يشوفوك\". اجا، طلع عالقصر. : \"شو مالك إنت يا عمي؟ إنت إنس والا جن؟\" قالهن: \"والله يا عمي أنا إنس، خيار الإنس. بس الله خلقني هيكا\".<br />قالوله: \"شو بطلع بيدك تشتغل؟ شو بتعرف تساوي؟\" قالهن: \"والله ما بعرف أشتغل إشي. بقدر بهالمطبخ أقشر راس بصل، أناول غرظ، هيك شي\".<br />حطوه يشتغل بهالمطبخ، وصاروا: \"وين راح أبو اللبابيد؟ وين اجا أبو اللبابيد؟ شو! كيفوا عليه. وقعد عند هالعشي بهالمطبخ.<br />يوم من هالأيام، صار [ *** ] بهالمدينة. انعزموا دار الملك. المغرب، بدهن يروحوا يتفرجوا.<br />: \"يا أبو اللبابيد، تروح معنا تتفرج عال[ *** ]؟\"<br />قالهن: \"لأ. أنا الله يساعدني، لا بشوف [ *** ] ولا إشي. إنتو بدكو تروحوا، الله يسهل عليكو. أنا بقدرش أروح\".<br />هاذولا راحوا دار الملك، وراحوا العبيد. ما ظلش غير أبو اللبابيد بهالدار. خلتهن توصلوا عال[ *** ]، راحت شلحت ثوب هاللباد ولبست هالبدلة اللي جابتها معاها وراحت عال[ *** ]. يرقصوا بالدور. يمّ تناولت هالمحارم ورقصت، رقصت تنها شبعت وطلعت ما حدا عرفها لا منين اجت ولا وين راحت. رجعت، لبست ثوب هاللباد، وكعبشت بجنب هالقصر ونامت. روّحوا هالعبيد من ال[ *** ]، صاروا يرفسوه.<br />: \"الله لا يقيمك! نايم هونا؟ لو اجيت شفت هالبنت اللي اجت رقصت وما حدا عرفها وين راحت؟\"<br />أول يوم هيك. ثاني يوم هيك.<br />روّحت مرة الملك لابنها قالتله: \"يا يما لو تصيرلنا هالبنت أطلبلك اياها، هاللي بتيجي عال[ *** ]، ما حدا يعرف ولا وين بتروح ولا وين بتيجي\".<br />قالها: \"يما لبسيني أواعي بنت وخذيني معاك، وإن حدا سألك قولي هاي بنت أختيى جايه لعنا ظيفة وجبتها معاي تتفرج\". قالتله: \"طيب\".<br />لبسته، وأخذته معاهن.<br />خلتهن توصلوا، وشلحت ثوب هاللباد ولحقت. فاتت عال[ *** ]، رقصت تشبعت وطلعت. لا حدا عرفها منين راحت ولا اجت. رجعت لبست ثوب هاللباد، ونامت.<br />ثاني يوم ابن الملك قالهن: \"إنتو روحوا عال[ *** ]\". وهو راح لبد باب دار ال[ *** ] ورا الباب. اجت هاي نزلت على هال[ *** ] رقصت وبعدين سحبت حالها وطلعت. يمّ هي طلعت من الباب، وهو مشي وراها. ظل وراها من ورا لورا تنها وصلت دارهن. وصلت على قصرهن، فاتت لبست ثوب هاللباد، وكعبشت بجنب هالقصر ونامت.<br />قال: \"أخ! إسا هي ساكنه بداري وعامله حالها عجيبة\". ماحكاش.<br />قام الصبح قال للسراري اللي بطلعوله الأكل، قالهن: \"اليوم ما حداش منكو يطلعلي الأكل. اليوم بدي أبو اللبابيد يطلعلي الغدا وأتغدى أنا واياه\".<br />: \"يا سيدي، منشان الله! بغدرش. حالتي بتقرف. كيف بدك توكل معاي؟\"<br />قاله: \"إنت بدك تطلعلي الغدا، وأتغدى أنا واياك\".<br />عملوا هالغدا. سقوله هالسدر، حمّلوه لأبو اللبابيد. طلعت تتعكوز لحد نص الدرج، عملت حالها إجرها فكزت : \"دخلك يا سيدي! مش قلتلك بغدرش أحمل\".<br />قاله: \"بدك تظل تجرب وتدب سدوره تنك تصل لهون إنت بحالك\". ثاني سدر طلعت توصلت لقرص هالدرج، فكزت إجرها، طُب!، والا هي داببته.<br />ثالث سدر ظلت تتعكوز من هون لهون تنها وصلت. حطتله هالسدر. سكر هالباب.<br />قاله: \"تعال أقعد أتغدى أنا واياك\".<br />: \"يا سيدي اطلع كيف حاليت، بتقرف مني\".<br />قاله: \"لأ. أقعد، بدي أتغدى أنا واياك\".<br />قعد يتغدى هو واياه. قام بن الملك طال هالسكينة وقال لثوب هاللباد هيك. قاله: \"إشلح ثوب هاللباد. إسا إحنا إلنا قديش ندور مين هلي بتيجي عال[ *** ] وإنت عندي هون بالقصر\".<br />شلحها ثوب هاللباد. نادى عإمه. جابوا القاظي، عقدوا العقد. نادى المنادي: \"أربعين يوم ما حدا يوكل ولا حدا يشرب إلا من دار الملك\".<br />عملوله هالفرح، وجوزوه إياها.<br />وهاي حكايتي حكيتها، وعليكو رميتها"
