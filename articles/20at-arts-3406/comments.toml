text = "ها الكتاب فاضح بمعنى الكلمة ومما جاء فيه<br />حطيت ورقة القرنبيط على [ *** ]تي، قام يخمشني يوكل ورقة القرنبيط ويوكل [ *** ]تي، قالتله كل شيئ فداك فداك، غير بيظك واخصاك! صفحة 204<br />اه يا ابن ال[ *** ]، علقت، شو اسوي فيك\" صفحة 97<br />والقحبة بنت عمك صفحة 181<br />هذا جزء من الكلام والمخفي اعظم"
