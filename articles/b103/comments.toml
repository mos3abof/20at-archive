subject = "اين موهبة عمرو دياب"
author = "محمد رضوان"
posted = "2006-08-04"
text = "اين هى موهبة عمرو دياب هو اولا لايلحن ولا بيكتب ولا بيوزع اغنية بيعتمد على فنانين اخرين هم الى عملوة شوفو نجوم العالم بيعملو اية مايكل جاكسون ولا كريج ديفيد ولا برنس بيكتبو ويلحنو ويوزعو كل اغانيهم ثانيا صوتو عادى واقل من العادى وانا قريت تعليق واحد قال عمرو دياب احسن من عبد الحليم معلش الى كاتب التعليق دة قدرتو على الاحساس بالنغم والصوت ضعيفة جدا عبد الحليم لو كان موجود فى هزا العصر وهزة العولمة كان باة من اكبر الفنانين فى العالم لان صوتو معجزة ومميز لابعد الحدود عمرو دياب انا حضرتلو حفل وصوتو كان زى مطربين الافراح البلدى وطبعا تعديلات الاستوديو بتعمل عميلها عمرو دياب مش فنان حقيقى لكنو احسن السيئين فى زمن اختفى فية الفنانين الحقيقين"
archived = "2006-11-02"
