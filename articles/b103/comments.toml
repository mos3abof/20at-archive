[[comments]]
order = 0
subject = "و بعدين؟؟؟؟"
author = "ميرهان"
posted = "2005-12-17"
text = "المشكله ان الواحد مش بيفكر قبل ما يختار اهتماماته بمعنى<br />ايه الفايده اللي هاتعود عليه لما اعرف اخر نيولوك لمطرب او مطربه؟<br />هاتقولولي علشان نكون معاصرين للاحداث او نتسلى ماشي كلام جميل, بس ما يبقاش شاب او بنت كل حياتهم و تفكيرهم في شخص مشهور و يلبس زيه و تعمل تسريحيتهاو يعلقوا صورهم و ينزلوا رناتهم مش ممكن الهوس يوصل لكده<br />و لو افترضنا ان الناس دول من المشاهير عملوا حاجه لنفسهم طيب ما تعمل انت كمان انفسك حاجه بدل ما تكون تابع لهم<br />و لما تختار لنفسك هدف تحققه في حياتك يا ريت يكون هدف له قيمه هدف يستحق انك تفني ساعات عمرك عليه<br />هدف ما تتكسفش من ربنا لما يسالك افنيت عمرك في ايه؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />و ارجوا ان ما حدش يزعل لاني قلت رأي صريح من غير تجريح في اي حد<br />دكتوره ميرهان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

