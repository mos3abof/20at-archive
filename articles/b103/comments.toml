[[comments]]
order = 63
subject = "إذا أتاك عدوك من الخلف فعلم أنك بالمقدمة"
author = "محمد السقا"
posted = "2006-01-12"
text = "مش عارف ايه كم التعصب اللى فى التعليقات ده انا حاسس اننا على موقع للارهابيين عمر الفن والغنا ما كانوا حرام او تفاهه الفن يشكل وجدان الشعوب ومهما كان حوالينا من ماسى مش هنبطل غنا وسماع غنا وعلى صوتك بالغنا ام عمرو دياب فهو ظاهرة تستحق الدراسة<br />أولا أشكر صاحب الرد اللي أنا كاتبه فوق لانه وفر علي شرح كتير<br />ثانيا رح أحكي عن عدة نقاط دار حولها جدال كبير<br />هناك من بتعتبر أحاسيس الشباب تفاهة ؟؟؟ ليه؟؟ طب إحنا مش لاقيين حاجة بالدنيا تعبر عننا غير الأغاني دي وده من حقنا<br />واللسي بيقول الله يهديكم وكانو إحنا كفار بقوله ألله يريح الإسلام من أمثالك دينا دين يسر وانت تعسر كل شيئ جميل بالحياة حتى أغنية جميلة تريد حرماننا من سماعها يا أخي خلي عندك دم والله عيب نتهم أنفسنا بالتفاهاة لانو كلنا بنسمع أغاني دون إستثناء وأم كلثوم وعبد الحليم بزمانهم شو بيفرقو عن عمرو بزماننا ؟؟؟؟<br />أما الذي يشتم جيل كامل من الشباب فلن أرد عليه نحن الشباب أكبر من النزول لمستواه وأنا طالب جامعة ورب عمل ولدي مسؤوليات أسرية أأديها كل يوم وبرضو بسمع عمرو لحتا أريح أعصابي<br />وعموما جيانا هاد هو جيل الوعي الحقيقي والحرية والعمل والتكنولوجيا وهو اللي رح يعمل يحقق اللي جيل المانشتات العريضة والدين المزيف والديموقراطية الكذابة ما قدر يعمله<br />وبالنسبة لموضوع عمرو يستحق الجدل أم لا بقول::::<br />ححكيلكم إيه خلاص منو شا يفين<br />من غير ما قولكم أكيد إنتو عارفين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

