text = "اولا:أحب أن أهنيءالفنان المصري عمرودياب علي الالبوم الجديد(كمل كلامك)وكل البوماته السابقه لانها مميزه جداوتعبرعن احساس وشعور الشباب في جميع الدول العربيه والاوربيه لانه فنان عالمي بدليل حصوله علي جائزه (الميوزيك اورد)وغيرهامن الجوائز ،،،اماعن بعض التعليقات التي قرأتهاعن عمردياب فيوجدمنها التعليقات السخيفه التي تدول علي الغيره والحقد علي الفنانيين المصريين المعرفيين في العالم لان ذلك ايضايدل علي ان الفنانيين في باقي الدول العربيه لم يسمع بهم احد برغم شهرتهم في بلادهم ...؟؟؟ولكن كل شيء مصري اصلي والمصري دايما يكسب"
