subject = "ليه كده"
author = "عبد الله اسماعيل"
posted = "2006-06-07"
text = "ليه كده ليه تعقدو الامور بالشكل ده المشكلة انكو تعرفوا ان عمرودياب ملك الفن واغانيه اجمل اغاني وشخصيتو قوية وجذابه وهو متسامح واخلاقوا اجمل من اخلاق اي مغني بس دايما بتحاولوا تشوهو صورتو مع ان ما فيش زي كده انسان هوا انسان بكل معنى الكلمة كمان تيجو تقولوا انحطاط شباب مجرد ما سمعتو باحد الشباب يتكلم عن عمرو او يحاول يقلد شخصيتو وتعملو فيها قصص وروايات ليه كدة تعرفوا حاجة اني لما كون تعبان ومش طايق نفسي الجألعمرو واغانيه اللي اتطلع الهم من القلب كفاية كده حرام عليكو حرام الاشاعات اللي تطلعوها عليه انتو وبعض الصحفيين اللي ما حدش من معجبين الفنان الملك معبركم انتو مجرد موهومين ومعاقين نفسيا حد منكم يعرف نفسو كده الله يعينكم على تفكيركم المفلس من المنطق مش حقول غير كده وتحية لمعجبين ملك الحب واتمنى تكونوا عند حسن ظن فناننا الكبير فيكم بس كده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

