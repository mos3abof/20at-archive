subject = "ويا مين بالظبط !!!!!!!!!!"
author = "مستاء"
posted = "2005-12-17"
text = "كل يوم عشرينات تنزل تنزل تنزل لغاية ما ........ الأخ اللي قال وياك ياعمرو هوه عمرو ده من ضمن الناس اللى هايقودونا للجنة لما نسمعه ولا عمرو حامل لواء الجهاد ضد الكفار ولا هوه عمر عبد الكافى ولا مين يا جماعه أنا مش عارف هوه مواضيعكوا بقت سطحيه ليه ومالنا احنا ومال عمرو والعقال والدولاب والنص التاني الناس مش لاقيه تاكل ولا تلبس والواحد الل عارف نت عارفه من اللحم الحى بس آخر كلام عندكم العقال والجنز والدولاب والزوجة التانيه هما الشباب البيكتبوا الكلام ده بياخدوا بالدولار صح أكيد عشان كده سهله عندهم حاجات كتيره ياعم مين يقدر يجيب شريط عمرو وماتقولش اشتر العادى اهتموا بقى مش الواحد كان بياخد منكن معلومه نطلع من الموقع بحرقة الدم وماتضايقوش من صراحتى وامسحوها لو تحبوا بس المهم انها وصلت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

[[comments]]
order = 6
subject = "يا رب أهدي عمرو دياب"
author = "شرقاوي"
posted = "2005-12-17"
text = "في رأيي أن ميرهان معها حق و أن محمد علي ليس معه حق (معلش يعني) فمن قال لك أن الفرد إذا كان مهندس أو طبيب فأنه يشترط أن يكون محترماً فالكثير من الأطباء و المهندسين المنحطين بل ويمكن أغلبهم ؛فمنهم من يكتب الدواء الغالي للمريض ولا يكتب الرخيص مع أنه نفس الجودة ولكن عشان خاطر الرشاوى اللي هيأخذها من شركات الادويةوكل عى حساب المريض الغلبان . ما علينا نرجع لموضوعنا \" أحنا لازم نشتري شريط سامي يوسف عشان نشجع الفن الراقي الهادف \" ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

[[comments]]
order = 7
subject = "موضة قديمة جديدة متجدده"
author = "واحد معدى"
posted = "2005-12-17"
text = "يا أخونا الاعجاب بمطرب أو مطربه و التشبه بيه ده مش جديد و قديم قدم البشرية فالشباب للاسف تايه مش لاقى القدوة الحسنة اللى يقتدى بيها ... فالشباب التايه أختار هؤلاء التافهين اللى أسمهم فنانين علشان يقتدى بيهم و طبعا هوه سبب نفسى بحت فالشباب مثلا شايفه فى واحد زى عمرو دياب شاب وسيم جاء من قاع المجتمع الاقتصادى و الاجتماعى حتى أصبح معشوق الجماهير و تفتح له ابواب السفارات و الحفلات و تفتح له عقول و قلوب الجهله من الشباب فالشباب فى الحقيقة يحسده و يريد ان يصبح مثله فقط فى ضربة الحظ اى بدون اى مجهود حقيقى او طموح واقعى يريد ان يربح المليون بين يوم و ليله ... المهم الخاسر الاكبر هو الشباب و الذى لا يعود عليه أعجابه بعمرو أو بزيد أى منفعه ألا منفعه المنتجين و مروجى النغمات و منظمى الحفلات و الشباب السفيه ضائع بين أخر ألبوم لهذا أو أخر نغمه لذاك .... و دمتم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

