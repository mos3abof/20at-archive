subject = "معلش احنا بنتكلم برده"
author = "حسام"
posted = "2005-12-18"
text = "يا جماعه الموضوع بسيط مش مستاهل كل الردود والخنقات اللى انتوا عملنها دى<br />بالنسبه للا خوه اللى بيقولوا ان ده تفاهه ان الواحد يسمع عمرو دياب<br />مفتكرش ان فى مشكله ان الواحد يصلى ويصوم ويقرأ قرأن وفى نفس الوقت هوه انسان ولزم بيكون ليه وقت يستمتع ويحس بنفسه بأى طريقه هوه يشوفها بشرط متغضبش ربنا ومفتكرش ان الواحد لما يعد يسمع أغنيه لعمرو دياب او غيره كلامها عداى وبسيط وكلام متداول بينا يبقى فى كده اى مشكله بدام ده مش حيعطله عن عباداته<br />اما بالنسبه لعمرو دياب كمعنى فمنكرش انه مطربى المفضل وهوه من احسن المطريبن بس مبحترمش فيه انا مبيحترمش جمهوره اللى بيحبه فى كليباته الى عاوز يقلد فيها الغرب دون انه يرجع لاصول وعادتنا الشرقيه ودينا<br />اخر حاجه عاوز اقولها ان الموضوع مش كبير للدرجه دى شريط عمرو نزل وسمعته واشتريته<br />الناس عندها اللى مكفيها ودى بتبقى حاجه عابره وبتسلى مش اكتر الا بقى الناس اللى فاضيه ومعذورين برده حيعملوا ايهههههههههه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

