order = 131
subject = "عمرو دياب والصراحه"
author = "****الظل****"
posted = "2006-08-07"
text = "على فكرة انا كنت بشرب شاى وانا بقرأ تعلقاتكم فبرد منى عارفين ليه ....؟<br />عشان انا احترت من كلامكوا ليه كل الخلافات دى انا هقولوكوا حاجه انا بحب عمرو دياب جدا جدا فوق ما يتخيل اى شخص دى حاجه وانا بتكلم بصراحه....!<br />بس انا ممكن الخص كل التعليقات دى فى كلم سطر ويارب تكونوا فهمتوا قصدى ........<br />اول حاجه بما اننا اتكلمنا عن الموضوع ده وهو عمرو دياب وكل التعليقات اللى اتقالت ليه وعليه دا معناه انه مطرب رائع وفنان بمعنى الكلمه ومغنى ناجح بدون شك وهو بصراحه يستحق الشهرة وانى الواحد يعجب بيه فى كل حاجه كصوت واللوك والالحان والكلمات وكل حاجه يعنى من الاخر كله على بعضه فظيييع يعنى محصلش يعنى اللى قال انى المصريين دول تافهيييين مش بيفهم لانه عديم التفكير وكمان فى حاجه انا عايز اعرف احنا ليه متكلمناش عن محمد فؤاد ولا كاظم ولا منير ولا اى مطرب اشمعنا عمرو دياب لانه فعلا يستحق اننا نتكلم عنه ونختلف فى الاراء والتعليقات. بس فى حاجه مهمه ودى اللى عايز اوضحها من كل الكلام اللى قولته انا مش هنحاز لعمرو ولا هنحاز لحد .... ايه هى الحاجه المهمه دى؟ انى اللى بيسمع اغانى وعنده مطرب مفضل لييه زى عمرو دياب يبقى لازم يكون بيصلى وموظب عليها ويكون بقرا قران وبيصوم وبيقوم بكل الفرررض اللى عليه لانى فعلا الدين يسر مش عسر يعنى زى ما احنا بنحب نسمع اغانى عمرو دياب برضه لازم نسمع قران ونكون بنصلى وكدة وزى ما بنتابع اخبار عمرو دياب لازم نتابع اخبار المسلمين فى كل مكان فى الارض وندعيلهم يعنى بمعنى اخر منخليش حاجه تيجى على حساب حاجه لازم الاتنين يكونوا موجودين عشان الواحد ميحسش بكت من اى ناحيه وكدة انت بترضى ربنا وبترضى نفسك ............................ !<br />وعلى فكرة الشريط بتاع عمرو دياب (كمل كلامك) شريييط تحفه رائعه من تحف عمرو دياب المتعدده والرساله دى بوجهها للكل وارجوا انى مكونش ازعجت حد ولا ضايقت حد وشكرا على الموضوع الشيق ده وياريت يكوووون رايى عجبكوا واللى عايز يكلمنى بجد ويكون صديق ليا انا على الايميل ده<br />manydiab@hotmail.com<br />السلام عليكم ****الظل****"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

