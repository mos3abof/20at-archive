posted = "2006-06-02"
text = "لحد امتى هنسيب ودانه للحاقدين<br />الى كل الى بينقضو النجم الاوحد عمرو دياب<br />الى كل من يحب النقض لمجرد النقض<br />هل سمعت عمرو دياب<br />كم مره<br />هل سمحته بأزن المحب ام المستمع ام المعارض ام الحيادى<br />عمرو مطرب كاااااااااااامل<br />صوت قوى بجد<br />نفس طويلللللللللللللللل<br />مظهر مقبول بل وجزاب<br />ذكى ولديه هدف<br />حتى فى تصوير اغانيه رغم كل الاقاويل<br />فا كليباته خاليه من العرى<br />ارجو ان يأخز وضعه الحقيقى<br />عمرو رغم كل شئ مضطهد<br />يدفع ضريبة النجاح المستحق حقد من الاخرين<br />الى الامام يا عمرو"
