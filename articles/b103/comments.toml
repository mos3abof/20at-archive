[[comments]]
order = 70
subject = "مطرب بحبه"
author = "عمرو دياب مطرب رائع و رهيب بدون شك....و ألبومه الأخير \"كمل كلامك\" جميل جدا...كلمات و ألحان على أعلى مستوى..و المحتوى الموسيقى جديد و رائع...و الألبوم فيه تنويع راقى بالمزج بين الموسيقى الأسبانية و العربية و موسيقا الجاز بدون أن تفقد الأغنية الروح الشرقية و أيضا موسيقا الصلصا الهادئة زى أغنية \" أيوه أنا عارف\" فضلا عن الأغانى على المسوم الشرقى الخالص زى \"و حكايتك إيه؟\"...الألبوم جميل من فنان موهوب و رائع...."
posted = "2006-01-16"
text = "لكن ليه كم التعصب ده فى التعليقات؟<br />هى دى بقت العلاقة بين الأخوة العرب؟<br />ثم الناس اللى مش عاجبها الموضوع و بتتهم الموقع بالتفاهة مش ملاحظين إن فى ركن كامل بالموقع إسمه \"فنون\" يا ريت الكلام يكون مسئول شوية...و عيب إن يبقى كل اللى واحد يقدر يعلق بيه إنه يتهم كل المصريين بالهيافة!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

