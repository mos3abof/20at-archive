author = "رشـــــــــــــــ المصرى ــــا"
posted = "2006-10-12"
text = "اكيد بلا شك ان عمرو هو الافضل ودة مش من فراغ واعماله تشهد على كده واكيد المكانه الى هو فيها موصلش ليها من فراغ اكيد بعد نعب ومجهود ولو هو فعلا مش فدها مكنش استمر ده كلو وهو فيها من غير ميهزو اى حاجه ومش معنى ان الشباب مهتم يبقى تافه احنا فى مجتمع واحد ولازم نهتم بكل الى فيها دين فن علوم ثقافه كل حاجه وختما ان عمرو ظاهر ة تستحق الكلام عنها ومش كلامى انا ولا انت كلمه هو واعماله هو تكفى تعبر عنى"
