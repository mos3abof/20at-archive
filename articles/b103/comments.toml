subject = "الموضوعيه"
author = "يا جماعة بالراحة شوية . الأخوه و الأخوات الملتزمين و الملتزمات : أنا طبعا مقدرة كلامكم و معناه و عارفة قد إيه انتوا بتتضايقوا لما بتلاقوا القدوة في المجتمع ناس بالفعل لا تفيده و لكن لماذا لا نأخذ المواضيع بعقلانية أكثر من هذا لماذا نتطرق للأسباب التي جعلت من عمرو دياب نجم يتهافت و راءه الشباب و يقلدونه بهذا الشكل حتى نستطيع تقديم نماذج لها نفس البريق للمجتمع و لكنها تفيد المجتمع و تقدم قدوة صحيحة له. و في النهاية كل إنسان به الخير و الشر و به المساوئ و المحاسن و حتي إذا كثرت المساوئ فليس من العدل ألا نذكر المحاسن."
posted = "2005-12-19"
text = "أرجو منكم التطرق لتحليل الأسباب التي جعلت من عمرو دياب نجم دون التجريح فيمن يتبعوه و دون النزول بمستوى الحوار حتى لا يقال أن العرب و المسلمين فوضوين يحكمون على الأشياء بدون موضوعيه.<br />و جزاكم الله خيرا"
