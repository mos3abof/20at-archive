subject = "هنخبي ليه"
author = "سايكو"
posted = "2006-01-15"
text = "\"هنخبي ليه\" حقيقة ويعرفها كل واحد فينا ، عمرو هو رقم واحد دون شك والحديث عنه او عن ابداعاته يحتاج اكثر من صفحة ،هو فعلا تحب ان تسمعه لمجرد انك عايز تسمعه وتحبه لمجرد انك عايز تحبه وتكرهه ساعات وتضايق ساعات اخري بسبب نيو لوك عمله او بسبب اغنية مش قد كدة او كذا أو كذا....لكن في النهاية تجد نفسك تفتش عن شريط له او سي دي مابين حاجياتك المتراكمة علي مكتب غرفة نومك او دولاب اغراضك كي تسمعه... لانه بأختصار شديد وبدون مبالغة يجبرك علي ان تعود له ، لانه يشعرك بأحساس ما تارة ونقيضة تارة اخري وهكذا تجد نفسك امام شخصية محيرة الي حد ما ولكنها محببة الي نفسك الي حد بعيد...."
