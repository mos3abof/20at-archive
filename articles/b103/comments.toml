posted = "2006-09-15"
text = "هو فعلا عمرو دياب كويس جدا بس انا نفسى مبحبش ادى لواحد الاهتمام الجامد ده علشان فى ناس لما بتاخذ الاهتمام الكبير بتتغر فى نفسها وحنا شيفين بتوع الكره بيعملو ايه لما بيخدو الثقه الكبيره من النادى نفس النظام مع المغنين برضك طيب انا عايز اعرف لو فى واحد من الجمهور اللى بيعشق بالفعل الفنان والاسطوره عمرو دياب وهو اسطوره فعلا والله العظيم انا بحبه محتاج لمبلغ من المال مثلا للعلاج عمرو دياب او غيره من النجوووووووم مثل مصطفى قمر ومصطفى كامل وايهاب توفيق ...والخ ممكن يساعدوا الشخص ده اللى بيعشقهم بالفعل وبكرر تانى انى اكبر واحد بيحب عمرو دياب والله العظيم سلاااااااااام"
