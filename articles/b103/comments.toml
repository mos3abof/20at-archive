text = "يا جمااااااااااااعه فى حاجه مهمه اوى تأكد انى عمرو ديااااااااااب ده اسطورة محدش اخد باله منها عارفين ايه هى ...............................................................!!!!!!!!!!!! والله ما هتتخيلوا هههههههههه والله انا نفسى مش مصدق بس دى الحقيقه<br />اكيد طبعا عايزن تعرفوا هااااااا<br />هقولوكوا .....<br />هو اننا عمالين نتكلم فى الموضوع ده الخاص بعمرو دياب شوفوا من امتى<br />من 17/12/2005<br />الى 07/08/2006<br />تخيلوا يعنى بقاله 8 شهوووور دى كفايه اوى اوى انى عمرو دياااااااااااب مطرب خاااااااااااااارق للطبيعه انا عارف انى زودتها بس غصب عنى اعمل ايه<br />ويا عالم هبفضل لحد امتى نتكلم فيه انا عن نفسى مش عايزة ينتهى هههههههه اصلى الباشا باشا يا جماعه"
