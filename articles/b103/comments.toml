[[comments]]
order = 12
subject = "كلام منطقي"
author = "Dabdoob"
posted = "2005-12-18"
text = "انا ملاحظ ان كل التعليقات كلها من المسلمين الملتزمين الذين يعبرون عن رايهم الشخصي في ان هذا انحطاط وتدني ان نقدم موضوعا عن عمرو دياب .<br />واليهم اقول ان الموقع مفتوح لمختلف التوجهات وليس من حق احد ان يصادر حرية احد في اختيار الموضوعات التي يراها مناسبة له.<br />اقول ايضا ان الموضوع عن عمرو دياب فلماذا تقراوه وترسلوا تعليقاتكم . اتركوه لمن يحب سماع الاغاني .<br />وفي النهاية احب ان اقول انني اميل الي وجهة نظركم ان عمرو دياب لا يستحق كل هذه الضجة والهوس .<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

[[comments]]
order = 13
subject = "استفزاز"
author = "مهندسه مروه"
posted = "2005-12-18"
text = "بصراحه انا بطبيعتى او طبيعه شغلى بدخل على الموقع ده عشان انه موقع بيفيدنى فى معرفه اخبار الدنيا و عمرع مافكرت ابعت تعليق على حاجه غير مره احده على احنا فى تل ابيب<br />ولما لقيت كل التعليقات دى على موضوع عمرو دياب استفزيت ايه التفاهه دى كل الماسي الى احنا فيها دى و الانهيار الى فى البلد الى ما حدش حاسس بيه و الى طبعا حضرتكم مش حاسين بيها زعلى فكره انا صغيره و مش معقده بس انا شليفه ان التعليقات دي استفزاز"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

