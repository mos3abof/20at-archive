text = "أنا عايزة أقول رأى فى الشريط أناسمعتهلكن مثل كل مرة لا افهم شئ اغانى عمرو دياب دايماًمتشابهه و اللحان قريبة من بعض و ممكن تعدى عليا سنة لحد ما أفهم أغنية و أحبها أنا راى أن منير أحسن منه بكتير كلامه منوع و ليه هدف و لا يمكن تحتار أنت حابب الغنية و لا لآ لأنك أكيد حتحب أغانيه"
