[[comments]]
order = 16
subject = "عمرو دياب و بس"
author = "نيفين"
posted = "2005-12-18"
text = "مع الاحترام للجميع و منهم طبعا الاستاذ الفاضل و اللى بقدره قد ما بحبه و احترمه و كمان المطرب الهايل سامى يوسف بس عمرو ظاهره لن تتكرر و دى مش هيافه زى ما البعض معتقد انا مثلا عمرو بالنسبه لى مش بس اغانى لا دى زكريات بتتراكم جوايا مع كل البوم ليه انا بحبه جدا و اعتقد ان حتى اعداء عمرو بيحبوهزو بالمناسبه الالبوم الجديد تحفه و هايل و بنصح احباء عمرو انهم يشتروهز"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

[[comments]]
order = 17
subject = "لازم تسمع غيرك"
author = "مين قال ان سماع عمرو تفاهة ومين قال ان دة تسطيح للامور ومين قال ان اللي بيسمعة بياخدوا بالدولار ومين قال ان الموقع تابع لاسلام اون لاين يبقي لازم كلام في الدين خلط غريب"
posted = "2005-12-18"
text = "كل بني ادم عندة مشاكلة اللي مش لازم يقول عليهااللي بيقول تسطيح مبتحبش تتفرج علي الكورة وتشجع الاهلي ولا الزمالك انت استفدت اية ولا افدت الناس باية نفس الموسيقي فية ناس حللوها وفية ناس حرموها معني ذلك متفرضشي رايك علي غيرك ومين قالك ان الناس اللي بتسمع عمرو مش متابعة اخبار المسلمين في العالم انتم لية بتعتبروا اللي بيسمع اغاني كانة كافر بدل ماتنصحة باسلوب محترم تتهمة بانة سطحي وهايف وبيقبض بالدولار اسال نفسك قبل غيرك انت نفعت الاسالم باية ونفعت غيرك باية قل ملتتهم الاخرين<br />الحكاية مش عمرو دياب الحكاية حكاية ازاي تحترم فكر غيرك وتقول رايك من غير تجريح انا عارف ان فية اولويات للكلام بس برضة الموقع اتاح العالاقات والفنون فاذا كان مش عاجبك متردش ولا تتكلم فية ولا هو التجريح شيء اساسي عندنا انت يا تري بتدخل علي الجزيرة مثلا علشان تتابع اخبار العالم والمسلمين كل يوم انا باسمع عمرو دياب وبادخل كل يوم لان دة اقل واجب اعملة اني اعرف المسلمين عاملين اية لازم تختار الاسلوب الكويس لمناقشة افكار الاخرين انت تعرف ان الشيخ الغزالي كان بيسمع موسيقي دة مش عيب ولو عيب وحرام ارجع لموقع اسالام اون لاين حتلاقيهم ليهم في الفن وبيناقشوة باحترام بمرجعية دينية مش عيب راقرا راي الدكتور يوسف القرضاوي مثلا في الغنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

