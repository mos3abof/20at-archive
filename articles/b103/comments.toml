text = "السلام عليكم<br />انا من محبين عمرو دياب .<br />بالنسبة للموضوع هو افضل ام لا نعم من افضل المطربين حالا بمصر وليس احسنهم يوجد ايضا هانى شاكر ومحمد فواد وغيرة<br />الصفة المميزة لعمر دياب هى<br />انة يقوم بالدعاية طوال العام لشريطة الجديد من خلال الجرائد مثلا عمرو دياب يستعد لشريطة الجديد او انتهى من تاليف وتلحين وغناء بعض الاغنيات فينة ومن ثما ينتظر الناس شريطة من العام للعام وحساسية عمرو دياب لمواضيع وكلمات اغانية هى الحب والعاطفة عند الشباب والناس الذين افتقدوا لها بالوقت الحالى ولهذا هو نجاح عمرو دياب مع احترامى للجميع المطربين بمصرنا الحبيبة وتحياتى للمطرب الجميل عمرو دياب"
