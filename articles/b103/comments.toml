text = "انا من اشد المعجبين بالاسطوره عمرو دياب لانه فنان ذكي وموهوب قدر يوصل قلوب الناس بسرعه من خلال كلمات اغانيه الحلوه والحانه العذبه واحساسه العالي وهو ده المهم انو يوصل احساسه للناس بطريقه راقيه لكن انا مش معه ظاهرة الهوس بالمطربين و نخليهم شغلنا الشاغل احنه لازم نعمل موازنه وندي كل حاجه حقها يعني منخليش سماع الاغاني و حياة المطربين و تصرفاتهم تبقى كل هدفنه يعني لازم نفكر بحاجات اهم تفيدنه و تفيد الناس وده ميمنعش اننه نسمع اغاني ونستمتع بيها"
