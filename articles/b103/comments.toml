text = "لا اريد ان اقول ماذا عمل عمر لامته ...فقط ماذا عمل لمصر ...ماذا اخترع ... هل يؤثر ان كان حي او ميت ..ماذا سيذكره التاريخ ..هل هو راضي ان جاءه الاجل الان عن انجازته .. ماذا سيقول يوم الحساب ..<br />انصحه بالاعتزال .. والتوبة ..وان يقوم بعمل مصنع صغير يدر عليه ربح حلال ويشغل فيه الغلابة .. ويتبرع منه لله ..لعله يكفر عما صنع ... والله المستعان..<br />ادعو لله ولشباب الامة بالهدايا ..ارجو ان يقرءها عمر"
