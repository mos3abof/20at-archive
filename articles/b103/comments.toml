[[comments]]
order = 2
subject = "نعم للفن الجميل ولكن"
author = "بحق يعتبر عمرو دياب من انجح فنانين هذا الجيل ولي عدة نقاط اعتقد انها فيها شيء من المنطق"
posted = "2005-12-17"
text = "نجح عمرو دياب لحسن سلوكة فيما اعتقد في حياتة الشخصية فلم نرة مثلا في اوضاع مخلة او يشرب الخمر او حتي السجائر وهو شخص رياضي ولم نسمع سوي كلام من الحاقدين علية انة مريض باليدز وما الي ذلك<br />لو تتبعت كلماتة فلن تجد اسفاف او كلمات تثير الغريزة بل هي كلمات سهلة وبسيطة تصل الي الناس وتعبر عن هذا الجيل وليس ذلك عيبا كما يعتقد البعض فليس هذا جيل ام كلثوم وعبد الوهاب<br />النيولوك هل هو عيب لا اعتقد في ذلك لانة يضيف طالما احترم العرف والتقاليد<br />هو شخص يقولون انة ذكي مستبعدين موهبتة الذكاء مطلوب ولكن ذكاء باال موهبة لا يسبب النجاح طيلة هذا الوقت<br />ولكن<br />كليبات عمرو الرقص فيها ليس مقبول<br />كل كلام عمرو في الحب وماشابة فالحياة ليست حب فقط<br />ومن يهاجمة للاسف يحاول تجاهل نجاحة ليس في مصر فقط بل في الوطن العربي لماذا الهجوم علية هو بالذات لم نري عمرو ينتقد احد من زملاءة والكل ينتقدة<br />فلو لو كان عمرو بال موهبة تستحق النجاح هل كان يمكن ان يسال فية احد بالطبع لا النقد ينال من الناجحين وليس من الفاشلين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133158/http://www.20at.com/article2.php?sid=103"

