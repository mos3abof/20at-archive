text = "جربت 3 افلام باستخدام نظارة الثري دي , الاول كان فلم My Bloody Valentine 3D وكان التجربة فاشلة بالنسبة لي لان لقطات الثري دي كانت معدودة وان كانت مثيرة تلبي غايتها ,,<br />التجربة الثانية لفلم اطفال ولكني جربتها باستخدام نظارة ورقية وفي تلفزيون البيت وعلى الرغم من ان الفلم كان ثري دي بمعنى انك تستطيع ان ترى الفلاتر الحمراء والزرقاء لكن الفلم كان باهتا ايضا ,,<br />التجربة الناجحة كانت في فلم افاتار حيث عشت تجربة الثري دي فعليا طوال الساعتين مدة عرض الفلم , ولم امل ابدا او اصب بصداع كما يدعي البعض,, حتى الترجمة العربية كانت على طبقة كانها تطفو على سطح الفلم ,, المكان : سينما رييل في دبي مول , قد يكون فلم افاتار بداية عهد افلام الثري دي الحقيقة ,,"
archived = "2010-02-28"
capture_url = "https://web.archive.org/web/20100228153152/http://www.20at.com:80/20at/lifestyle/15023--3d-.html"
