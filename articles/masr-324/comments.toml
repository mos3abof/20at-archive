[[comments]]
order = 7
subject = "ولسه ياما"
author = "احمد صلاح"
posted = "2006-05-20"
text = "كان يا مكان في يوم 29-11-2005 قبل يوم الإنتخابات بيوم كنت في المحل اللي انا شغال فيه ... الوقت بعد العصر .. جالي حوالي 20 شخص منهم ظابط في امن الدوله ورئيس قسم المباحث في المركز علي المحل والكل لابس ملكي دخلوا عليا المحل .. فين صاحب المحل ( الظابط ) مش موجود اسمك ايه قلتلو اسمي .... اه انتا ابن الأستاذ .... طيب ياالا تعالا معانا قلت حاضر هقفل المحل ( المحل اتبهدل بهدله ) نزلوا الحاجه معايا نزلوها والبنى ادمين اللي قدام المحل واقفين يتفرجوا عليا وفتحين بقهم استنه حد يتكلم .... سكوت .. طيب قفلت المحل سريعا وجدت المحامي بتاعي هو بيته جمب المحل نزل سريعا وقاله علي فين ياباشا قلب ابعتلي ابوه او صاحب المحل وخمس دقايق بالظبط وهيكون في البيت ... اتاري البيت ده .. ( معتقل برج العرب ) 55 يوم مش 5 دقايق اترحلنا انا والناس الساعة 11 علي معسكر قوات الأمن ومن هنا ويوم السبت الساعة 9 الصبح اصح ياللا علشان هتترحلوا واترحلنا علي برج العرب وقعدنا هناك 50 يوم بالتمام والكمال وشكرا ادي الحريه ذنبي ايه .. اني ابن راجل صالح ومبيسبش ركعه ربنا يجعله في ميزان حسناتنا"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917010822/http://masr.20at.com:80/article.php?sid=324"

[[comments]]
order = 8
subject = "لـــــــــــــيــــه!!!؟؟"
author = "ضاع العمر يا ولدى"
posted = "2006-05-20"
text = "لما هوه كده وكلكوا حلوين ليه ساكتين!!؟؟<br />ليه ماحديش شاف اشكالكوا فى ولا مظاهره!!؟<br />حلوة مصمصة الشفايف والتمنى<br />مافيش حاجه هتيجى تمنى<br />دى زى حرب التحرير<br />والمرة دى المعتدى والمظلوم ولاد بلد واحده<br />يا ريتنا كنا زى العراق على الاقل كنا هنبقى عارفين بنضرب فى مين<br />وعارفين ومحددين عدونا كويس<br />ليه مانعتبرهاش حرب تحربر من شوية حراميه وقطاع طرق<br />لسه ما آن الاوان اننا نفوق ونقف وقفه واحده<br />كلنا ننزل الشارع<br />شعب اوكرانيا افضل مننا فى ايه لما خرجوا كلهم ووقفوا مع المعارضه لما خلوا رئيسهم يجرى ويهرب من البلد<br />مافيش حاجه بتيجى سهل ولا فيه تمن يندفع<br />شوية شباب شغيره انضربوا واتهانوا واتحبسوا!!<br />دفعوا التمن<br />يبقى لو البلد رجعت تبقى الفرحه بتاعتهم<br />ملكهم..!!<br />انتوا هتدفعوا ايه عشان لما البلد ترجع عشان تقولوا انكوا لكم حق تفرحوا<br />او لكم حق فيها<br />اتنيلوا على خيبتكوا."
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917010822/http://masr.20at.com:80/article.php?sid=324"

[[comments]]
order = 9
subject = "لا وقت للدموع التي لن تجيئ"
author = "الدوامة"
posted = "2006-05-21"
text = "المطالع للساحة المصرية على الوضع السياسي يستشعر دون أدنى مجهود مرهق مدى الملهاة التي يعيشها هذا الشعب والذي بدا انه يتأهب لاسترجاع وعيه بعد طول تناول جرعات متكررة (لطالما إعتاد عليها وألفها) من المغيبات والجرعات المذهبة للوعي والعقل والفكر .والعجيب بلا ريب أن الذين يتولون ارتكاب هذه الافعال مع هذا الشعب المسكين المستكين لا يقلون عنه جهلا وتخلفا وإن زادوا عليه وزايدوا طمعا وجشعا وطغيانا وظلما وسلبا ونهبا ..الأمر الذي يدعو للتأمل بغير عمق .حيث سرعان ما ستطفو على صفحة الفكر مدى الخضوع والخنوع والتسليم الذي يبديه الشعب تجاه جلاديه وظالمية وطواغيته ومغيبيه عن وعيه ومصفديه في أغلال القهر والضياع..إن الذاكرة التي طالما حملت في حناياها ومضات برق لئلاءة ومحطات مضيئة تصور مراحل كفاح هذا الشعب ضد المستعمر الغاصب الأجنبي بما كان يمثله ويتددج به من قوة حقيقية باطشة لم ترهب الشعب ولم تفت في عضده أو استنفاره (ذاتيا) للمقاومة وعدم الراحة أو الاستكانة إلا بدحره وإجلائه عن تراب الوطن... فما باله إذن يبدو هزيلا ضعيفا مثيرا للشفقة أمام بضعة أو حفنة من المرتزقة محدثي سلطة ونعمة لا تاريخ لهم ولا أنساب لهم ولا حق يؤيدهم ولا شرعية تساندهم ولا هم يفقهون وليس لهم من القبول شئ...فكيف وهم بيدهم مقاليد كل شئ يمنحون ويمنعون .والمنح لأنفسهم وذويهم ومن يسير في ركابهم.والمنع لغيرهم من عامة وخاصة هذا الشعب المسكين...أضاعوا تاريخه ودمروا حصون العزة والأنفة فيه..وأذلوا كبرياءه..وأفشوا السقم والمرض والفقر والجهل والتخلف والهوان في رجاله ونسائه وشبابه وأطفاله..ولم يرتضوا حتى رأوه قابعا في ذيل الأمم ينظر اليه القطاء ومن كانوا أوباشا لا تاريخ لهم ولا حضارة إما نظرة المتعطف المانح .أو نظرة المتشفي المانع..ذهب شموخ ه<br />اقرأ بقية التعليق .."
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917010822/http://masr.20at.com:80/article.php?sid=324"

