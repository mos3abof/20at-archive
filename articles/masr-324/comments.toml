subject = "لالالالالالالالالالالالالالا"
author = "«اللي هيقول الحق سيضرب بالحذاء»"
posted = "2006-05-15"
text = "سنقول دائما الحق<br />ولهم الشباشب<br />ولن نتوقف<br />وسنقوم بثورة<br />وسننجح فيها<br />لا<br />بانقلاب<br />وهاناخد الحكم<br />ياااااااااااااااة<br />كماااااااااااااان<br />هانحاكم الحكومةالسابقة<br />اجمعين<br />لا عيب<br />بلا ش خوازيق<br />طق طق طق طق<br />( دة صوت خبط على الباب على فكرة )<br />يانهار اسود<br />امن الدولة<br />لم ياعم الورق دة<br />قصة جديدة"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917010822/http://masr.20at.com:80/article.php?sid=324"

