[[comments]]
order = 11
subject = "لعنه الفراعنه"
author = "نظره حائره"
posted = "2006-05-21"
text = "هل ما نحن فيه من قهر وذل ممكن أن يكون لعنه من الفراعنه لاننا فرطنا فى حريتنا وكرامتنا ومصرنا الحبيبه ورضينا أن يحدث هذا فينا هل هو غضب من الله علينا لبعدنا عن الدين وما أمر به الله سبحانه وتعالى أم ماذا لقد أصبحنا كالمجنون الذى لا يعلم من هو ومن أين أتى فنحن ننتقل من السىءالى الاسوء من عاطف عبيد لنظيف ومن مبارك الاب لمبارك الابن يعنى أحمد زى الحج أحمد حسبنا الله ونعم الوكيل"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917010822/http://masr.20at.com:80/article.php?sid=324"

[[comments]]
order = 12
subject = "الموت انتظارا"
author = "تلك الشبكه العنكبوتيه التى تتحكم فى مصائر اكثر شعوب العالم تعرضا للاذلال الم يحن الوقت ان ننهض للدفاع عن مستقبل ابناءناو التخلص من هذه الشرذمه و الفساد الذى ينخر فى جسد مصر المخروسه المغتصبه المكبله"
posted = "2006-05-22"
text = "هل ترضى بأن يلاقى ابنك ما لاقيته على ايدى احط مخلوقات الله<br />هل ترغب فى حياه كريمه لهم<br />هذا لن يحدث وسترى فلذه كبدك و هم يبصقون فى وجهه و يدوسونه بأحذيتهم و ابنتك و هى تغتصب و ينكل بها من هذه الحيوانات و لن تحرك ساكنا<br />قم للدفاع عن ابناءك ايها الخانع الضعيف الذليل لن يتغير شىء و انت ساكن منتظرا لما لن يأتى ابدا معتمدا على ان يهب الاخرون للتغيير بينما انت تشاهد او فى احسن الحالات مكتفيا بالدعاء<br />ااااااااااااااااااااااااااااااه يابلــــــــــــــدى"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917010822/http://masr.20at.com:80/article.php?sid=324"
