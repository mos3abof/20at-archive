order = 5
subject = "ضيعنا حقك يا بلد"
author = "شيرين"
posted = "2006-05-20"
text = "يعنى ايه اللى مش عاجبه يهاجر او يخرس خالص \" ضيعنا حقك يا بلد لمل بلعنا لسانا ،ضيعنا حقك يا بلد لما خفنا على عيالنا ، ضيعنا حقك يا بلد و نستاهل اللى يجرالنا ، ضيعنا حقك يا بلد لما انحنينا و الواطى على ، لما وقفنا نتفرج لغاية ما الرخيص غلى ، لمل صبرنا على طعم حبك و ابدا ما حلى ، لامتى يا بلد هنكتم صرخة الوليد ، لامتى يا بلد هنفضل نايمين مانشوفش الفجر الجديد ، لامتى يا بلد هنبقى صايمين و مايجيش العيد السعيد"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917010822/http://masr.20at.com:80/article.php?sid=324"

