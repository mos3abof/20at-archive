author = "جيمـي"
posted = "2009-10-27"
text = "أنا شايف ان المشكلة مش هتتحل بتقديمه الإستقالة من عدمه<br />وهتتكرر تانى وتالت ورابع .<br />متاكد من أن الحل يكمن فى وجود رقيب ( جاد ) على العمال و الموظفين .. مش بس فى السكك الحديد .. لكن فى القطاع العام كله .لأن لو فيه رقيب عليه ماكنش هيسيب مكانه لأى سبب من الأسباب وخاصة أنه عارف أن ممكن تقع كارثة لو مافيش حد فى البلوك .. ووقعت فعلاً .<br />ثانياً .. توفير كافة سبل الحياة الكريمة لموظفى القطاع العام .. علشان لما يغلطوا نعرف نحاسبهم<br />لكننا مانجيش نقول لواحد أنت ماكلتش ليه ونحاسبه على كدة وهو معهوش اكل أساساً .. لكن هو تلاقيه كان ماشي بدري علشان يلحق ميعاد الشغلانة التانية ولا حاجة … وأنا متأكد أنهم هيكتشفوا ده الأيام الجاية أنه كان رايح شغله التانى … وهتشوووووفوا"
archived = "2009-10-29"
capture_url = "https://web.archive.org/web/20091029003658/http://www.20at.com:80/masr/t7kyk/13844-2009-10-27-12-49-58.html"

[[comments]]
