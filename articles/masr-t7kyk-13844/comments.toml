[[comments]]
order = 4
subject = ""
author = "المحاكمة اولا"
posted = "2009-10-27"
text = "طبعا ليس خطا منصور<br />ولكن خطأ من وضعة فى هذا المنصب وعلى هذا الكرسى<br />دة رجل متدلع مولود فى بقة معلقة دهب لان اهلة محتكرين استيراد السيارات الامريكانى ماركة شيفرولية وكل عربية بتخش مصر بياخد عمولة 5 % من تمنها وهو قاعد فى بيتهم<br />ازاى هيحس بشعور عامل تحويلة قاعد فى منطقة مهجورة بمرتب لا يكفى لشراء الخبز<br />او عامل بيشغل بوابة مزلقان او بيفتح ويقفل سيمافورات<br />كم مرة الوزير دة زار كشك تحويل قضبان تحويل مسارات القطارات وقعد مع الناس بتوع الهيئة العمال البسطاء يسمع مشاكلهم<br />عايش فى برج عاجى بيقابل الكبار فى صالات الفنادق ويعمل اعلانات بالملايين فى التليفزيون عن الانجازات الوهمية<br />الهيئة عايزة ولاد الهيئة المهندس اللى ابتدأ يركب عربية الدريسة ويمشى يفحص فلنكات السكة تحت القضبان من اسكندرية لاسوان<br />المهندس بتاع ورش الهيئة اللى بيركب اقراص الفرامل ويعمل عمرات فى محركات الجرارات ويصرخ من عدم توفير قطع الغيار<br />ولاد الهيئة هم اللى لازم يشغلوها<br />مش يجيبوا واحد راسمالى ولا لواء من الجيش متقاعد يمسكوة مصر للطيران والتانى السكة الحديد والثالث قناة السويس<br />فية ولاد الهيئة<br />ولازم هم يشغلوها"
archived = "2009-10-29"
capture_url = "https://web.archive.org/web/20091029003658/http://www.20at.com:80/masr/t7kyk/13844-2009-10-27-12-49-58.html"

