subject = ""
author = "طرد لمص الغضب"
posted = "2009-10-27"
text = "لم يستقيل<br />جريدة المساء اليوم فيها تاكيد منة شخصيا انة لن يستقيل وسيستكمل مسيرة الاصلاح<br />والحقيقة ان الرجل وهو من رجال الاعمال صرف من خزينة الدولة 8 مليارات جنية فى 3 سنين ليحولها من هيئة سكك حديد مصر الى اسم جديد<br />نعم نجح منصور شيفرولية بتاع لجنة السياسات فى تغيير اسم هيئة سكك حديد مصر الى<br />هيئة السكة الصفيح<br />او هيئة سكك حضيض مصر<br />وكل دة ب 8 مليار جنية صرفهم على رش عربات القطار بشوية بوهية والوان صفراء<br />وطبعا تمت اقالتة بسبب واحد<br />هو انقاذ مؤتمر الحزب الوطنى القادم<br />اذن الرجل لم يستقيل ولكن تم طردة من اجل انقاذ مؤتمر الحزب الوطنى<br />وعقبال طرد فاروق حسنى"
archived = "2009-10-29"
capture_url = "https://web.archive.org/web/20091029003658/http://www.20at.com:80/masr/t7kyk/13844-2009-10-27-12-49-58.html"

