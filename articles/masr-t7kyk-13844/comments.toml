text = "الحقيقة هو كان المفروض يتعاقب وبعد كدة يتطرد علشان يكون عبرة لكل شخص ذو سلطة .. أصلا هو مش خسران أي حاجة يه \" مع منصور أنت في أيد أمينة \" طب ليه الأيد الأمينة دي مش موجودة في المواصلات الحكومية مع إنه نفس الشخص …؟؟؟؟؟!!!"
