text = "انا شايف ان اللي حصل ابتداءا من موقف د. مفيد شهاب ود. زكريا عزمي الى استقالة منصور ما هو الا تمثيلية هزلية من اجل اصلاح صورة الحزب الحاكم امام الشعب ومن اجل ان تكون هذه من احد الدعاية في الانتخابات القادمة ان الحكومة بقى عندها دم والوزراء يستقيلوا لما تحدث كارثة"
