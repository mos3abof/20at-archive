author = "وائل الغزاوي"
posted = "2009-10-27"
text = "اذا شعر منصور بالمسئولية عن حادث القطارين المتصادمين فهذا في حد ذاته شئ يحسب له واذا قدم استقالته فهذا شئ جيد ايضا لكن هل ستنتفي مسئوليته عن الحادث هل ستصبح مسئوليته وعلاقته السببية لحدوث الجريمة منتفيه بسبب الاستقالة وقبولها<br />توجد قاعدة قانونية معروفة تربط بين العلاقة السببية والضرر بمعنى ان ابسط الفعل ورد الفعل<br />فهو الفاعل مما لاشك فيه وليس هو فقط بل كل العاملين في قطاع النقل الروس الكبيرة اقصد<br />يجب محاكمة المفسدون في مصر محاكمة عادلة على مرئ ومسمع الجميع"
archived = "2009-10-29"
capture_url = "https://web.archive.org/web/20091029003658/http://www.20at.com:80/masr/t7kyk/13844-2009-10-27-12-49-58.html"

