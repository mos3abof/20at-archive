subject = "فين التعابين ..طيب و هو فين الظابط"
author = "نيفين"
posted = "2006-05-23"
text = "الجوامع كتير و الائمه مفيش<br />هى دة المشكله<br />و الائمه يا جماعه زنبهم ايه ما هما لو اتكلمو خلاص سكه اللىىيروح ميرجعش<br />مش كده و لا اييييييه"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122335/http://masr.20at.com:80/article.php?sid=359&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

