subject = "والله معاك حق"
author = "زقزوق"
posted = "2006-05-22"
text = "والله برنس يا عم نصر، المسألة دي فعلا بقت مهزلة، الواحد بيتعب عشان يلاقي جامع يسمع فيه كلمة عدلو ولا يصلي ورا واحد بيعرف يقرا..."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122335/http://masr.20at.com:80/article.php?sid=359&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "اللهى ربنا ياخدهم"
author = "journalista"
posted = "2006-05-22"
text = "انا بقى حكايتى منيلة ومهببة ....<br />لأنى فى المكان الى انا عايشة فيه كان فيه مسجد فيه مجموعة من الدعاة الجدد ..<br />كانوا ماشاء اله عليهم بجد ...<br />ورمضان الى من 3 سنين دا ...<br />كانتالناس بتجيلهم من حت بعيدة جدا ..<br />لأنهم بيستمتعوا بالصلاة وارهم والتهجد الى الناس فيه أصلا بتبقى نايمة كانت الشوارع بتتقفل فيه ...<br />بجد كانت ايام رائعة<br />خدوهم وحبسوهم ...<br />وكمان ايه<br />سفروهم بالعافية .....ربنا يخدهم<br />\"وَمَنْ أَظْلَمُ مِمَّنْ مَنَعَ مَسَاجِدَ اللَّهِ أَنْ يُذْكَرَ فِيهَا اسْمُهُ وَسَعَى فِي خَرَابِهَا أُولَئِكَ مَا كَانَ لَهُمْ أَنْ يَدْخُلُوهَا إِلَّا خَائِفِينَ لَهُمْ فِي الدُّنْيَا خِزْيٌ وَلَهُمْ فِي الْآخِرَةِ عَذَابٌ عَظِيم\"<br />صدق الله العظيم"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122335/http://masr.20at.com:80/article.php?sid=359&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

