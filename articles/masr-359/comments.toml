[[comments]]
order = 4
subject = "ازيك يا نوفا ..."
author = "هووووبه مش شغلك وهبهوب سابقا"
posted = "2006-05-23"
text = "تبادل كيبوردات يا اختي دا كمان ولاه ايه ؟؟<br />علي العموم السمك بيعرف يعوم \" علي راي معرفش مين مش فاكره ؟؟؟\"<br />ولزيزه الصوره دي \" غيظه يعني \""
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122335/http://masr.20at.com:80/article.php?sid=359&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "ربنا يهدى"
author = "والله هى المشكله انه ازاى راجل محترم بيقول على نفسه انه بيعرف فى الدين يقبل يبيع دينه عشان بسلمته الريس"
posted = "2006-05-24"
text = "يعنى مثلا كان فى شيخ كان بقولكوا كان تحب تسمع له الخطبه كلامه رزين وخطبه جميله لدرجه انه كان اكبر تجمع فيه رمضان للمصليين<br />مكملشي يا اخويا والراجل اتقلب وبقى حبيب الحكومه ولما يعرف ان حد بيقول عليه كده يبلغ عنه امن الدوله اللهى ربنا ينتقم من كل ظالم فيهم"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122335/http://masr.20at.com:80/article.php?sid=359&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "مدينة نصر, خلاص عدت"
author = "ابو مدينة من نصر سيتي"
posted = "2006-05-28"
text = "مدينة نصر من اسبوعين كانت الناس تأتي إليها لتسمع الخطب فيها, اي مسجد كبير ستجد فيه خطبة جيدة. مرة واحدة (من اسبوعين) الخطباء كلهم اتحركوا من اماكنهم بأمر من الأوقاف. الليلة اللي قبلها, تقرر (فجأة) ألا يطلع المنبر أحد غير امام المسجد. فجأة لقيت نفسي حيران أروح فين ؟. أسيب مدينة نصر و اروح لحد برة ؟ و لا أسيب الجمعة بفتوى عدم اللغو؟"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122335/http://masr.20at.com:80/article.php?sid=359&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "غصب عنك هاطلع"
author = "الاستاذشيكو"
posted = "2006-05-28"
text = "انا من الارياف من كفر الشيخ اة والله منها المهم كان عندنا واحد امام وخطيب بارك الله فيه وعشان كان راجل دوغري والناس حباة قامت الحكومه نقلاه بعيدددد<br />عارفين بعيد فين طبعا<br />المهم الحكومهجابت واحد من بتوع اليومين دول لا هو عارف الحلال من الحرام وكل كلامه ممكن ويجوز وكلام مبهم ولما يتزنق يقول علينا طاعه ولي الامر علي طول ولما الناس زهقت قالته بلاش تخطب الاسبوع ده من باب التغيير قال لهم لاااااااااا هاطلع غصب عنكم<br />وجاب الظابط وخلاه يطلع والراجل اللي قله بلاش تطلع رااااااااح في الكزوزة"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122335/http://masr.20at.com:80/article.php?sid=359&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "تونس 0000خبر سخن"
author = "الاستاذشيكو"
posted = "2006-05-28"
text = "الخبر ده انا لسه سمعه طازة<br />تيس العابدين اااسف زين العابدين بتاع تونس عمل الجوامع الالكترونيه وكل واحد هايروح الصلاة ياخد معاه كارت عشان يخش الجامع والكارت للخمس صلوات بس والجمعه ليها تصريح خاص اللي هايكون برة البلد اللي الكارت بتاعه يعني في بلده تانيه جوة تونس مالوش ان يخش الجامع اللي قريب منه ولما سالوا وزير الداخليه قال لازم العمليه تتنظم الدخول والصلاة مش فوضه<br />وكل الناس لازم تصلي 5 صلوات توفيرا للوقت 0<br />الموضوع ده بجد وبدا تطبيقه في بعض المدن التونيسيه زي عندنا ما هايبدءو في الاذان الموحد"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122335/http://masr.20at.com:80/article.php?sid=359&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
