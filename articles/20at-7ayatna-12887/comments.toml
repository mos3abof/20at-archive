author = "النفاق"
posted = "2009-08-09"
text = "نفسي اتخلص من كل المنافقين اللي عايشين معانا، احرقهم، النفاق ده بجد حاجة وحشة اوي، ليه فيه ناس كده على طول بينافقوا، هما لو يركزوا في شغلهم حيبقوا كويسين واحسن من لما ينافقوا مديرينهم وكل اللي حوليهم<br />اللهم ما احمينا من شر المنافقين"
archived = "2009-08-26"
capture_url = "https://web.archive.org/web/20090826171347/http://www.20at.com:80/20at/7ayatna/12887-2009-08-09-15-46-10.html"

