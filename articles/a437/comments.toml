text = "كله اللي أعرفه عن أحمد نظيف انه هوه اللي خلي الdslب150 جنية في الشهر وعلشان كدة حبيته قوي ...<br />لكن بما انه بقي رئيس للوزراء فهو كيد هيغليه 50 جنية بس وعلشان كدة انا فرحان...!!!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926225112/http://www.20at.com:80/article.php?sid=437"

[[comments]]
order = 5
subject = "بيرو"
text = "لا يا جماعة خلينا نتكلم بجد ...<br />فعلا التغيير ملوش لازمة لو فضل مجرد تغيير أسماء علي طريقة شالو الضو جابو شاهين ...<br />الموضوع محتاج تغيير أفكار وسياسات واساليب ادارية ...<br />الحكاية أكبر من كدة...!!<br />وخصوصا اني حاسس ان الناس فعلا بقت مخنوقة قوي ...<br />موش طايقة بعضها او بمعني اصح موش طايقة حتي نفسها....<br />تحياتي للحكومة الجديدة وتمنياتي ان تحقق ما فشل الاخرون فيه....<br />وتحذير اخير ....الشعب المصري تعبان ....احذروا ان يغني لكم قريبا ....<br />مانتوش لاعبين..!!!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926225112/http://www.20at.com:80/article.php?sid=437"

