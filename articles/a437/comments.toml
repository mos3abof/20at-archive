[[comments]]
order = 11
subject = "جديد الموقع"
text = "إيه يا اخوانا !<br />ايه شعب *** دي؟ الشعب المصري شعب فطرته سليمة و واعي و فاهم بدليل كمية النكت إلي بتطلع في أي موقف و بتدل على وعي و فهم المواطن و إن كان صبور و ساكت و باله طويل... لكنه مش شعب كل شغلته يتأمر و مبيعجبوش العجب زي ما الأخ قال...<br />لكن الصبر له حدود... و قت ما تتقفل من كل ناحية الناس مش حيهمها اللقمة و حتقول ماهي بايظه بايظه و تقلب الدنيا عليهم... يعني هي أول مرة شعبنا يعملها؟<br />*** تم حذف الكلمات بواسطة مشرف الموقع بعد حذفها من التعليق الأساسي.."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926225112/http://www.20at.com:80/article.php?sid=437"

[[comments]]
order = 12
subject = "هل هو نظيف فعلا"
text = "طبعا انا فرحت لما عرفت ان الماسوف على وزارته ح يطلع معاش لانه كان اكبر رئيس وزراء فشار وواضح ان الصنف اللى كا بيشربه كان بيقلب معاه بهلاوس اقتصادية لكن لما عرفت ان عم رابسو الشهير بنظيف ح يمسك الوزارة افتكرت شبكة المحمول الثالثة اللى ما اتعملتش عشان الوزير قال ان الوضع لن يسمح بتقدم شركات عالمية للشبكة الثالثة للمحمول ( الشبكة الثانية للمحمول فى السعودية تقدم للعطاء فيها ثلاثون شركة منهم ساويرس وفودافون )وطبعا اعطى التردد بتاع الشبكة الثالثة لساويرس وفودافون تفتكورا ان العملية كانت ببلاش ولا عشان ساويرس دمه خفيف انا اذكر ان رئيس الوزراء الوحيد اللى الجرايد قالت عليه انه نظيف اليد لما تم ترشيحه كان كمال الجنزورى وعليه ياريت يحكوا لنا رئيس الوزراء الجديد كان عنده كام مليون قبل الوزارة وبعد الوزرارة بقى عنده كام ولما يسيب رئاسة الوزراء ح يوصل لكام عشان ما نحسدش بس ونرقيه من العين ."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926225112/http://www.20at.com:80/article.php?sid=437"

[[comments]]
order = 13
subject = "ضمير"
text = "اتفق معك فى الصورة الكاريكاتيرية التى تصاحب التغيير نفسه ولكن توجد نقطة اختلاف جوهريه فى الطرح فليس من الضرورى ان يكون رئيس الوزراء خبير اقتصادى بالمعنى الاكاديمى للكلمة فمن المفترض ان يكون ضمن الوزراء وزير اقتصاد بل والاكثر من ذلك ان تخصص نظيف نفسه هو ورقة الاقتصاد الاكثر ربحيه فى العالم وهى الورقة التى دفعت الكثير من الدول الى المقدمة.اكرر اتفاقى معك فى المشهد المضحك لحياتنا السياسية الا انى اردت التوضيح ليس اكثر حتى لا تصبح كلماتك تأكيدا لصورة نمطية يجب الا تبقى..فادارة فريق من المتخصصين برؤية واضحة وبمنهج سليم_لا اقصد نظيف تحديدا- افضل من متخصص على طراز عاطف عبيد"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926225112/http://www.20at.com:80/article.php?sid=437"

[[comments]]
order = 14
subject = "تغيير يا تغيير"
text = "الكارثة بقى أن عاطف عبيد هيتعين مستشار في الرئاسة وهيبقى برضو مسؤول عن الملف الاقتصادي اللي الأخ نظيف مالوش دعوة بيه خالص .. يعني كارثة الاقتصاد المصري مستمرة مع تدعيم موقف جمال مبارك الطامح للوراثة الجمهورية لأن نظيف من رجال لجنة السياسات التابعة له .. (يعني من رجالته) ... يعني تغيير إيه اللي انت جاي تقول عليه يا نظيف<br />بالمناسبة هل فيه علاقة بين نظيف وغسيل الأموال ... ولا أي غسيل وشغل الأتوماتيك"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926225112/http://www.20at.com:80/article.php?sid=437"

