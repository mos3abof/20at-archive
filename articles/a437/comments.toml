[[comments]]
order = 7
subject = "بيرو كمان وكمان"
text = "تصدقوا فكرة ايه رايكم نجرب اننا نعيش من غير حكومة ...بلا وجع دماغ ....<br />هي الحكومة ايه غير قلق ومشاكل ...واصلا الشعب المصري شعب ***<br />مبيعجبوش العجب وعلي طول معترض ومتنرفز وموش مدي اي فرصة لاي حكومة تعمل اي حاجة كويسة<br />فعلا يا جماعة الحل اننا نعيش من غير حكومة ..<br />يعني هما اجدادنا الاوائل كانوا عايشين ازاي<br />الفكرة جبارة قوي ... خدوا بس اسمعوني هاقولكم ...<br />بتقولوا عليا مجنون ...الله يسامحكم ...<br />*** تم حذف الكلمات الموضوع مكانها هذه العلامة بواسطة مشرف الموقع لخروجها عن الآداب العامة"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926225112/http://www.20at.com:80/article.php?sid=437"

