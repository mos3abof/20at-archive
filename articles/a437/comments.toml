[[comments]]
order = 3
subject = "منقول"
text = "نظيف سابع رئيس وزراء في عهد مبارك وهو أصغرهم سنا. كما أنه أول رئيس للحكومة غير متخصص في الشئون الاقتصادية منذ عام 1987. وشغل نظيف منصب وزير الاتصالات في حكومة عبيد منذ تشكيلها عام 1999.<br />وولد نظيف في القاهرة في يوليو 1952، وحصل على بكالوريوس الهندسة من جامعة القاهرة عام 1973، ثم حصل على ماجستير في الهندسة الكهربائية من الجامعة نفسها قبل أن يكمل دراسته في كندا؛ حيث حصل على دكتوراة في هندسة الكمبيوتر من جامعة ماكجيل عام 1983.<br />وقبل توليه منصبه الوزاري عمل نظيف أستاذا في كلية الهندسة بجامعة القاهرة، ثم مديرا تنفيذيا لمركز معلومات مجلس الوزراء، ثم أشرف على مشروع الرقم القومي وعلى مشروع إدخال الكمبيوتر في الإدارات الحكومية."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926225112/http://www.20at.com:80/article.php?sid=437"

