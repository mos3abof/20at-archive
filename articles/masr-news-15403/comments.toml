text = "عندما حدثت ازمة رغيف الخبز كلف الجيش والشرطة بانتاج رغيف العيش وجلب القروض بالمليارات واعطاها لمافيا الاستيراد والحرامية فاستوردوا اقذر واردىء انواع القمح فى العالم واغرق البلد بأرغفة سوداء لا تصلح لعلف الحيوانات<br />واهمل انتاج القمح المصرى ورفع سعر السماد الكيماوى على الفلاح المصرى فقسم ظهرة وتوقف عن الانتاج<br />نظام فاشل متخبط اسهل حاجة عندة اخذ القروض واعطائها للمليشيا بتاع الاستيراد ولا يفكر فى الانتاج ابدا<br />نظام منبطح على بطنة<br />البرادعى ربما ينقذ شيئا"
archived = "2010-02-22"
