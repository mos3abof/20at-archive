[[comments]]
order = 1
subject = ""
author = "ملاحظتين"
posted = "2009-12-20"
text = "لي ملاحظتين على الموضوع بعد اذنكم<br />الماحظه الاولى<br />(ولاد البلد) التقت معتز الطالب بالفرقة الثالثة كلية الألسن جامعة عين شمس، لتعرف معه حكايته مع أنفلونزا الخنازير..<br />اين التقت به ولاد البلد وايه سبب التعارف بين الصحفي ومعتز<br />المفروض يتكتب مكان اللقاء وسبب التعارف<br />الملاحظة الثانية<br />صورة الموضوع<br />صورة الموضوع لا تمت بصلة من قريب او بعيد عن الموضوع<br />وسلمولنا على عبدالله الطحاوي"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223072934/http://www.20at.com:80/masr/interviews/14480-qq-.html"

