[[comments]]
order = 1
subject = "لا"
author = "لا"
posted = "2006-06-03"
text = "وا سوأتاه و إن غفرت<br />تقديم لكتاب لم أجرؤ على إكماله..!!<br />فتوى بإهدار دم من يمارس التعذيب<br />ترويض العبيد<br />ماذا لو ناديت بقتل خمسة أمريكيين في بلادنا مقابل كل عراقي يقتل؟<br />أبو جهل و أبو لهب.. وحمالة الحطب<br />بقلم د محمد عباس<br />وا سوأتاه و إن غفرت..<br />كان هذا هو عنوان المقال الذي أحاول إكماله منذ شهرين فلا أستطيع.<br />كنت خجلا من نفسي، من مواقفي ومن مواقفكم يا قراء، فأنا و أنتم من فصيلة أولئك الذين قالوا: اذهب أنت وربك فقاتلا إنا ههنا قاعدون، و أنا و أنتم ارتضينا أن نغش أنفسنا لنفرق بين عدو بعيد وقريب أشد عداوة، ربما يكون وصف جمال عبد الناصر – عليه من الله ما يستحقه- لهذا القريب وصفا صحيحا ، عندما قال وهو يواجه اليهود – مهزوما ومحاصرا - في فلسطين، أن العدو الحقيقي ليس في حيفا و تل أبيب و إنما في دمشق وعمان والقاهرة. ونحن نزيد عليه باقي العواصم جميعا.<br />كنت خجلا من نفسي ومنكم ومن الأمة ومن العالم ومن التاريخ..<br />كنت خجلا وقد أدركت أن كلاب النار من ملوك ورؤساء وشيوخ وفقهاء قد حاولوا تشويه الدين كي يحارب ضدنا، فانطلق كلب منهم يسمي المجاهدين خوارج ، وعوي كلب بأنهم الفئة الضالة، ونبح ثالث يحذر اليهود والنصارى من الإسلام إذا ما أصر الغرب على تطبيق الديموقراطية .. لأن الإسلام هو اختيار الناس وهو الذي سينتصر، وراحت باقي كلاب النار تلوي عنق الدين لتحرم الجهاد ، ليس في دمشق والرياض والقاهرة حيث الشبهة والالتباس، بل في بغداد، حيث يوجد مصدر وحي إسلامهم الأمريكي.. لعنهم الله.. وحتى قال أحد الكتاب ساخرا:<br />- الحمد لله أن لم يكن عند الفيتناميين فقهاء كفقهائنا يحرمون عليهم قتال الأمريكيين، ولو كان عندهم مثل أولئك الفقهاء ما انتصروا أبدا..<br />خجلت من ك<br />اقرأ بقية التعليق .."
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912043214/http://masr.20at.com:80/article.php?sid=419"

[[comments]]
order = 2
subject = "بلا رئيس - - آمين"
author = "أشرف حسن"
posted = "2006-06-22"
text = "أنا أضع نفى مكان هذا الرجل وجدت نفسى قد مللت هذه الوظيفه ألا يفكر فى الله فى الموت والحساب لماذا خاف عمر إبن الخطاب أن تعقر بعير فى طرقات العراق أن يسأله الله لما لم تمهد لها الطريه تخيلوا حيوان وليس إنسان كيف يفكر مبارك فى الرد على الله أو على الأقل على التاريخ أو على صوت الضمير إذا كان هناك ضمير حى مبارك أرجوك إرحل وعلى رأى نجاة أسألك الرحيلا وبسرعه"
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912043214/http://masr.20at.com:80/article.php?sid=419"

[[comments]]
order = 3
subject = "بلا رئيس - - آمين"
author = "أشرف حسن"
posted = "2006-06-22"
text = "سؤال إلى كتاب وفقهاء ومفكرى ومبدعى ومؤلفى وعارضى مصروأصحاب المكلمات الشهيره التى أصموا آذاننا منهاألايوجد منكم زجل واحد يتساوى بالمرأه التى قالت لعمر إبن الخطاب إتقى الله ياعمر ألا يوجد من يقول لمبارك وعائلته أصحاب العزبه - مصر - إتقوا الله أم الصبر أفضل حسب نصائحكم التى لا تقدم ولا تؤخر أنا أقولها لكم ولمبارك وعائلته إتقوا الله وإرحلوا أرجوكم"
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912043214/http://masr.20at.com:80/article.php?sid=419"

