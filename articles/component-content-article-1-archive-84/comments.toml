subject = "روسيا"
text = "الله يعطيك العافية<br />مقالة جميلة<br />ممدوح"
archived = "2004-07-01"
capture_url = "https://web.archive.org/web/20040701041646/http://www.20at.com:80/article.php?sid=156"

[[comments]]
order = 5
subject = "جزاك الله خيرا"
text = "جزاك الله خيرا أحوي مسعود على المقال المفيد ونقول لك إننا محتاجين جدا لمزيد من الفتاوي الشبابية والمواضيع المفيدة<br />والله لايحرمنا منك"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018204717/http://www.20at.com:80/article.php?sid=156"

[[comments]]
order = 6
subject = "arrawye1@hotmail.com"
text = "أتعلم ياأحمد!أنا أشعر أن المسألة تجمع في عدة نقاط من إمتلكها إستطاع أن يصنع بها ما يريد0<br />موهبه,وكل منا موهوب<br />عزيمه0<br />إصرار0<br />وتفكير سليم0لجأ إلى الإستخبارات,لقد أحسن الإختيار وماأدراك مالإستخبارات هناك في إسرائيل,مهما إختلفت الطرق في جلب المعلومات وأين ما وصلت بشاعتها أنت تخدم الدولة الحلم في النهايه0<br />فكيف برسام عربي يمتلك النقاط التي في الأعلى ويخدم بها الوطن الحقيقه؟؟؟"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018204717/http://www.20at.com:80/article.php?sid=156"
