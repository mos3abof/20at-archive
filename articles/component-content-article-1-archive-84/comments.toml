[[comments]]
order = 0
subject = "جميل بالفعل"
text = "موضوعاتك جميلة يا أحمد... بيميزها حداثة الموضوعات، الشمولية، التميز في العرض....فإلى الأمام دوما."
archived = "2004-07-01"
capture_url = "https://web.archive.org/web/20040701041646/http://www.20at.com:80/article.php?sid=156"

[[comments]]
order = 1
subject = "احمد نصر الدين"
text = "شكرا اخي الكريم و\"نفسكم\" معانافي الموضوعات القادمة بإذن الله.. فنرحب بإقتراحاتكم في الموضوعات القادمة او حتي المشاركة في اعداد موضوعات من خلال المعلومات.. سواء من خلال جهدكم في البحث او من خلال تواجدكم في البلدان وما تعرفوه من معلومات ترونها جديرة بالعمل عليها."
archived = "2004-07-01"
capture_url = "https://web.archive.org/web/20040701041646/http://www.20at.com:80/article.php?sid=156"

[[comments]]
order = 2
subject = "الراجل مصري من بورسعيد"
text = "اندهشت جدا لاصرار الأهرام على استيراد رسام كاريكاتير اسرائيلي للرسم على صفحاتها وكأن رسامين الكاريكاتير ناقصين في السوق المحلي ، وكان بيزيد اندهاشي كل ما قرأت عن ارتباطه بالجيش الاسرائيلي والمخابرات ، لكن يبدو إن الأهرام فهمت أنه طالما ابن بورسعيد فهو واحد مننا ويمكن يطالب بحقه كصهيوني في استقلال بورسعيد وضمها للكيان الصهيوني .."
archived = "2004-07-01"
capture_url = "https://web.archive.org/web/20040701041646/http://www.20at.com:80/article.php?sid=156"

[[comments]]
order = 3
subject = "العمالة"
text = "العمالة<br />أنواع<br />هناك عميل بالسليقة.<br />هناك عميل الانه مزاجه أن يكون عميل.<br />هناك عملاء طلاب دنيا وكراسى ((وما أكثرهم )).<br />خالددرويش"
archived = "2004-07-01"
capture_url = "https://web.archive.org/web/20040701041646/http://www.20at.com:80/article.php?sid=156"

[[comments]]
