[[comments]]
order = 9
subject = "عاهرات دخلاء على الفن"
author = "واليدوووف"
posted = "2006-05-26"
text = "بإختصار شديد أنا منزعج جدا من مسألة هوجة إعتزال من أطلق عيهم فنانين وفنانات هذا الزمن الأغبر يا جماعة السينيما سينيما واللى مش فاهم ده ما يوحعش دماغناحتحجب حتنيل على عين اللى خلفوها وبعدين همه قدموا إيه للسينيما العاهرات دول وخلينا معاهم للأخر لو إكتشفوا فجأة إن الفن حرام ولازم يتنيلوا على عين اللى خلفهوهم ما يتنازلوا عن الفلوس اللى خدوها من الفن ويبتدوا نضاف زى ماهمه مقتنعين ولا همه عايزين يكملوا بفلوس الفن الحرام وفلوس حفلات المجون والجنس عند الأمراء و الشيوخ العرب و نصيحة منى إن أفضل حاجة للجماعة دول تجاهلهم تماما والله دول همه اللى ودوا السينيما فى داهيه ولسه وكمان عايزين يعملوا سينيما بمواصفات خاصة بيهم والله قلة أدب لما نلاقى العاهرات من أمثال حنان ترك وشاكلتها عايزين يعملوا فن سينمائى بمواصفات تتناسب مع إتجاهتهم الجديدة بلاش وساخة بقى وسيبوا الفن لأهله وإنتوا عارفين كويس إنتوا دخلتوه من أى أبواب ولو مش عاجبكم الفن دلوقتى ياريت ترتاحوا وتريحونا خالص وتتفرغوا للحفلات القذرة فى أحضان الشيوخ العرب وتريحونا من أشكالكم كاتكم نيله سلام"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

[[comments]]
order = 10
subject = "ليست الأخيرة فى القائمة السوداء"
author = "بحب السيما"
posted = "2006-05-26"
text = "إنضمت حنان ترك إلى القائمة السوداء لأعداء الفن فن السينيما الجميل مش اللى همه فاكرينهوأنا عايز بس أسألهم سؤال إنتوا عايزين إيه من فن السينيما فى مصر مش كفايه أفلامكم اللى أسات للسينيما المصريةوأنقصت من رصيدها السينمائى نفسى بس أعرف حنان ترك وجيلها قدموا إيه للسينيما المصرية غير إنه جيل عايش على أمجاد سنيما الستينات والسبعينات والله إنتم دخلاء على هذا الفن وفاهمين الموضوع غلط ولما بتقرفوا من حياتكم الخاصة اللى عملتها ليكم النجومية من حفلات قذرة وتنازلات مدفوعة وليالى حمراء للى يدفع تمن النجمه بتفكرواتعتزلوا وتتحجبوا لكن مش علشان السنيما لكن بسبب حياتكم الخاصة القذرة وأنا والله من فترة كبيرة مش بتفرج على أفلامكم السطحية وأدائكم السخيف وثقافتكم المنعدمهو مكتفى بالسينيما الأمريكية السينيما بجد مش الهلاوس اللى إنتوا بتعملوهاو نصيحة أخيرة أو دعاء أتمنى إن ربنا يستجيب ليه ياريت كل الجيل ده يتحجب ويعتزل بس بلاش فكرة التمثيل بالحجاب وتقعوا فى بيوتكم وكفاية الفلوس اللى إنتوا عملوتها من السنين اللى فاتت سلام"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

[[comments]]
order = 11
subject = "الحجاب..فعلا منتهى اللذة"
author = "نيروز"
posted = "2006-05-26"
text = "اولا مبروك لحنان ثانيا وهي مترتبة ع اولا ليه بنقول مبروك لحجاب واحدة علشان دا فريضة وهي نفذتها اذن فهي بتبقي فرحة فرحة للمتحجبة بزيها الجديد وفرحة لاختها المسلمة اللي شيفها بيه الحجاب فعلا منتهي اللذه لانك خافي عن الناس حاجة انت بس اللي بتشفها ومن جاز له ذلك وبس عمر الحجاب ما كان معناه اني عندي مشاكل فتحجب يمكن ربنا يفكها لا لازم يكون ع اقتناع ودا اللي هيبان مع الايام في حجاب حنان هل هي فعلا بتجرب وتشوف رد الفعل ولما تجرب وتلاقي نفسها محصورة في دائرة معينة من الاعمال السنمائية هتسيب فرض عشان شغلها ولا هي فعلا مقتنعة وبالفرض دا _اتمني ذلك _ بالنسبة لسؤالك سيدي الفاضل عن شغل حنان من وجة نظري لازم حنان تمثل وفيها ايه محجبة هما مش بيقولوا سينيما نظيفة _مع علمي التام بخبايا الكلمة دي _ يستحملوا بقي وانا شيفة ان ناس كتير قوي بتتحجب مش بس الفنانين بيتهيئلي كده ان ع سنة 2050السنيما هتبقي بالرسوم المتحركة لان بجد الاسلام بينتشر وبقوة والحمد لله زربنا يزيد ويبارك ويثبت كل مؤمن"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

