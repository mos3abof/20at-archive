text = "كل ده تمثيل فى تمثيل كل واحده تطلع تقول انا لبست الحجاب زى الحاجه سهيررمزى طالعه تقول انا هرجع امثل وحجاب ايه اللى لبساه ده لا وايه مكياج كامل داهنه بيه وشها (سايبس ) ربنا ياخدهم جميعا من اول سهير لغايه منا شلبى ووفاء عامر وحنان ترك وكل اللى عايزين يخربوا عقول الشباب بالافكار الغلط عن الدين"
