posted = "2006-05-29"
text = "اتمنى ان يكون حجاب الاخت حنان نابع من قلبها وايضا يكون حجاب عن التزام بمعنى الحجاب الاسلامي وليس مجرد وضع قطع اقمشة ملونة لمجرد ان تلفت انتباه الاخرين ليس الا ولكن ليكون لطاعة الله سبحانه وتعالى واريد ان تعلم الفنانة الجميله اني معجبة جدا بها وكمان انها تشبه بنتي يمنى وعمرها الانست سنوات واتمنى ان تقبل تعليقي هذا"
