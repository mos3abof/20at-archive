text = "كل الأراء دى نسيت حاجة مهمة حنان حرة تعمل الى هى عايزة لازم نفرق بين أحنا عايزين أيه و صاحب الشأن ،هى بتقول أنا حتحجب و أمثل هى حرة مش من حق حد يحرف نواياها و يدعى حاجات عليها لأن فى الأخر محدش حيتحاسب مكان حد"
