text = "بعيدًا عن الكلام الفارغ اللي دخل فيه المتناقشين من التشكيك في فرضية الحجاب , وسب العلماء والدعاة...<br />المهم ، مبروك لحنان على الحجاب ويارب يكون حجاب خلق ومظهر زي ما حسيت من كلامها في \" البيت بيتك\" ...<br />وبعدين مين اللي قال إن الحجاب يمنع الفن ... على رأي حنان السينما الإيرانية قائمة على الحجاب ومن السينمات الناجحة جدًا<br />على العموم ربنا يعجل بهداية للجميع وخاصة بنات وشباب الجيل ده منى ومنة وداليا وغيرهن<br />ونصيحة ... بلاش حجاب عبير صبري ... يعني ممكن نخلينا مع منى عبدالغني"
