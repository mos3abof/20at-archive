author = "القاضي"
posted = "2006-05-28"
text = "الى الأخ اللي مش عاجبه ان اسم الداعية المتميز و المحترم والمثقف والناجح عمرو خالد يكون جنب الداعية بتاع الأرياف ابو اسحاق الحويني -اللى قاعد جنبى دلوقت مايعرفهوش- احب اقوللك انالسنة هى التمسك بأخلاق النبي صلى الله عليه وسلم ومراعاة حرمة أعراض المسلمين وخصوصا لوكانوا دعاة الى الله ينشرون دينه بينعباده ويحببونهم فيه وليس يخوفونهم منهو ويعلمونهم ان الاسلام لحية وازار قصير وعود سواك-مع اننا لاننكر انها من السنن-ولكن فوق انت وشيخك وبصوا حواليكم حتلاقوا الدنيا اتغيرت وياريتكوا تحققوا عشر اللي حققه عمرو خالد لين الله"
