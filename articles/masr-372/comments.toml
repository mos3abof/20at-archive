subject = "يجب ان نفكر بواسطة اللغة"
author = "هشام الروداني"
posted = "2006-11-19"
text = "بسم الله الرحمن الرحيم وهو كدالك الرحمن الرحيم نتمنى ان يكون هدا الرد صائب وفي محله ولكل من له تعقيب ان يرد على هدا الاميل تحت شكرا...... dvmmar@hotmail.com<br />الحجاب؟ حنان ترك؟ مصر؟ الفن ؟<br />اخواني في الله ادا كنا نريد الحديث في هدا المجال لابد ان نعرف معنى الحجاب في الاسلام والكيفية التي جاء بها فما اصبحنا نراه اليوم ليس ما كان عليه حجاب الاولين او يمكن ان اسطلح عليه حجاب الموضة اي انه لم تعد له المكانة الرقية التي كانت للحجاب في ما مضى اما فيما يخص الاسلام والحجاب فقد جاء الاسلام والحجاب معا بحيث الاول يكما التاني والعكس وبتالي اقر الاسلام الحجاب للمراءة لستر العورة التي تعتبر فتنة امافيما يخص الاسلام والفن فنلاحظ كذالك ان هناك نوع من التحميس بشكل وجيز ودالك لمافيه من جمال ولكن تلك القيمة التي كانت للفن والتي حددة في الجمال لم نعد نلاحظها في هده الايام ودالك لسعي معظم هؤلاء الفنانين لاشفاء مكبوتاتهم الغريزية وبالتالى يغب التفكير وما يمكن ان نقوله هو اننا لا نعي افكارنامدركة في الواقع الا عندما نمنحها شكلها الموضوعي....<br />وحنان ترك بالنسبة لي فنانة في المستوى المطلوب بحيث لا نرهاالا في الادوار المطلوبة التي تليق بمكانتها الاجتماعية والشخصية وموضوع حجابها لن يتير اشمئزاز النفوس والله يوفقها انشاء الله شكرا لكم اخوكم هشام"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215040606/http://masr.20at.com:80/article.php?sid=372"

[[comments]]
order = 83
subject = "عيب عيب عيب"
author = "أحمد العدوي"
posted = "2006-11-22"
text = "يشعر الإنسان بالاشمئزاز والتقزز والقرف من التعليقات السخيفة التي يكتبها بعض الفارغين الذين لا خلاق لهم ولا قيم لديهم دعوا الخلق للخالق واتقوا الله في عباده وتذكروا قوله تعالى:\"إن الذين يحبون أن تشيع الفاحشة في الذين آمنوا لهم عذاب شديد في النيا والاخرة والله يعلم وأنتم لا تعلمون\" وتذكروا قوله سبحانه:\"إن الذين يرمون المحصنات الغافلات المؤمنات لعنوا في الدنياوالآخرة ولهم عذاب عظيم\". وأرجو القائمين على الموقع أن يتقوا الله أيضا فلا ينشرون تلك التعليقات الشائنة الجارحة المبتذلة الخادشة للحياء حيث يتصفحها مراهقون ومراهقات ونساء شريفات عفيفات وغلا فانتم شركاء في الاثم. هدانا الله جميعا."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215040606/http://masr.20at.com:80/article.php?sid=372"

