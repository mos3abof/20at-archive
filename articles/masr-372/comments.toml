subject = "قا فلة التا ئبات"
author = "فنا نا ت مصر"
posted = "2006-05-28"
text = "اناملا حظة كدة ان معظم الفنا نات المعتزلات بس من مصر وعمرى ما سمعت عن فنانة معتزلة من دولة اخرى مع ان زى ما بيقولوا مصر بلد الفن والجمال وياترى اية هوة السبب فى ان المعتزلات بس من مصر يمكن والله اعلم علشان بلد الازهر ولا احد يعلم مين الى علية الدور فى الا عتزال والحجاب لكن كلة خير من عند ربنا وصورة مشرفة لفنانات مصر وربنا يقوى ايمانك يا حنان كمان وكمان واشهدكم انى احب كل المسلمين والعلماء الا جلاء والمشا يخ الى بيعر فونا طر يق الخير واشكركم وادعوا لكل بنات المسلمين بالهداية والحجاب"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

[[comments]]
order = 36
subject = "ألف بركة يا حاجة حنان"
author = "حسنين"
posted = "2006-05-28"
text = "يا رب يا رب يهدى كل المسلمات...<br />أما بالنسبة للشخصية التالية فى الحجاب فإنى أتمنى أن تكون هيه (سيدة مصر الأولى) الست سوزان هانم مبارك<br />فهى أولى بالحجاب من الفنانات..<br />وإذا سأل أحد عن العلاقة بينها وبين الممثلات فالإجابة بسيطة وهى: (الكل بيضحك على بعضه يا معلم) الفنانة تصلع على الشاشة تقول أى كلام ..والست هانم تتطلع بردة فى جمعيات المرأة والهيافة إياهة تقول نفس الكلام.<br />حقوق المرأة .. سلامة الوطن .. الأخلاق ..<br />كله بيضحك على كله.. يا سيدى صلى صلى"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

[[comments]]
order = 37
subject = "من بحب السيما إلى لبنانية"
author = "بحب السيما"
posted = "2006-05-29"
text = "قرأت تعليقك المطول على الموضوع بصراحة اللى إنتى كتبتيه لفت نظرى لكن أحب أقولك إننا مش جيل مبهور بالسينيما الأمريكية على الرغم من إنها سينيما خارج المنافسة أنا معاكى إن فيه سينيما أوروبية جيدة وتجارب خارج نطاق السينيما الأمريكية تستحق الإشادة لكن تظل السينيما الأمريكية هى الأفضل رضينا أم أبينا من حيث تعدد موضوعاتهاو قوة وضخامة إنتاجها و أنا مش ضد السينيما العربية و المصرية خاصة بالعكس السينيما المصرية منذ بدايتها وحتى فترة ليست بالبعيدة قدمت العديد من الأفلام تظل علامة فى تاريخ السينيما المصريةمين يقدر ينسى البداية و الأرض وباب الحديد واللص والكلاب والزوجة الثانية و ليلة حساب السنين للعبقرى شادى عبد السلام وغيرهم الكثير وأفلام عاطف الطيب رحمه الله المدهشة وأخرها ليلة ساخنة وغيره لكن أنامش فاهم الجيل الجديد اللى دخلوا الوسط الفنى ده عايز إيه بالظبط؟ وبعدين إحنا قبل ما نناقش رأينا فى حجاب الفنانات لازم نكون صرحاء مع أنفسنا هل إحنا جمهور بيعتقد وبيؤمن بأن الفن عموما حرام ولا لا ولما معظم التعليقات مؤيدة لحجاب الفنانات طيب ليه معظم الناس بتتفرج على أعمالهم طالما هيه حرام والغريبة إننا ما زلنا بناقش موضوع اللى هو الحجاب وهو موضوع غير أكيد مدى فرضيته من عدمه المهم انا قصدى إننا مش لازم نقحم الدين فى الفن ولازم نتخلص من الإزدواجية المرضية اللى عندنا السينيما حرام ونروح نتفرج عليها الفيديو كليب حرام ومسخرة وتلاقى كل الناس بتتفرج عليها المشكلة أكبر من إعتزال أو تحجب ممثلةالمشكلة فيناوأنا شايف إن الكبت الجنسى اللى بتعانى منه أمتنا هو اللى مسبب المشاكل دى كلها- لبنانية السينيما فن جميل أجمل ما فيه الحرية فى تناول أى موضوع لكن إننا نحط شروط وقيود على الفكر واللبس تبقى حاجة تانية غير السين<br />اقرأ بقية التعليق .."
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

[[comments]]
