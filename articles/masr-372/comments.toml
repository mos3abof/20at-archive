subject = "خير والله خير"
author = "عبدالله مفتاح"
posted = "2006-05-25"
text = "جميل جدا ان فنانه تتحجب ودي خطوة جريئه من اي فنانه تستحق عليها التحيه<br />واظن انها لو انضمت لهناء ثروت وشمس البارودي يكون افضل يا اما تاخد بالها من ادوارها اوي<br />بس بجد خطوة رائعه واظن ان في الطريق منى زكي<br />هذا والله اعلم<br />لا للتمديد.. لاللتوريث...نعم لتعديل الدستور"
