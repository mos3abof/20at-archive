[[comments]]
order = 50
subject = "ربنا معاكى يا حنان"
author = "هاله"
posted = "2006-06-01"
text = "ربنا معاكى يا حبيبتى ويثبتك على حجابك ان شاء الله ومتحزنيش من اقوال البعض اللى لم يخافو ربهم وهم يكتبونها وكل اللى بطلبه منك انك تفكرى مره واتنين قبل الخوض فى التمثيل وانا مثلك هذه الايام ولكن مع اختلاف نوع الحجاب فانا والحمد لله ارتديت النقاب وسمعت تعليقات اشد من تلك اللتى تسمعينها ادعيلى انا ايضا بالثبات"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

[[comments]]
order = 51
subject = "عجبي"
author = "محمود زين العابدين"
posted = "2006-06-03"
text = "استغرب كل هذا الاهتمام والهرج والمرج بسبب حجاب انسانة مسلمة، اين هذا الانفعال و اللغط من النقد والتجريح عندما كانت حرمات الله تنتهك بأسم الفن وحين كانت تظهر القنانة المحجبة أوغيرها من الفنانات المحجبات في مشاهد اقل مايمكن ان يقعله المنتقدين للحجاب أنهم يحجبوا هذه المشاهد عن ابنائهم لانها تخالق الذوق السليم والفطرة السليمة التي نادت بها جميع الاديان. ارجو من جميع الاخوة ان ينشغل كل منهم بنفسه ويهتم بما قدمه ليوم الحساب يوم لاينفع نفس الاعمله. يجوع الشعب الفلسطيني وتنتهك اعراض اخواتنا في العراق وافغانستان وكشمير ولاتهتز شعره في اجسادنا، ونثور ونغضب وتعقد الندوات والبرامج في مهاجمة انسانة محجبه، عجبي!!"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

