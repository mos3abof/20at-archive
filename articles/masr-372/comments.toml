posted = "2006-05-31"
text = "ربنايثابتها وهى فعلا خطوة كوبسة بس الحلو ميكملش بصراحه مينفعش الحجاب مع التمثيل لان التمثيل حرام فى حد زاده وهو مش هينفعها فى الاخرة لو هى مش عارفه هو حرام ولا حلال اقعدي بمفردك فكري هل الله راضى على ذلك ام لا وسوف توصلين لما يحبه الله وربنا يهديكى اكتر واكتر"
