author = "ماتسيبوا الناس في حالهم مااللي عايز يتحجب مايتحجب واللي مش عايز مايتحجبش والاسلام معامله قبل مايكون مظهر احنا بس كده فالحيين نشغل نفسنا بالتفاهات وياريت فعلا كل واحد في مهنته يفكر هو ممكن يغير ايه او يضيف ايه ويقدر يعمل ايه علشان الناس تفوق من اللي هي فيه علشان ربنا يخلصنا من اللي احنا فيه"
