text = "مااااااااااااااااااااء<br />ها... شو ... الله يسمعنا الأخبار الطيبة<br />قال \"حنان ترك\" تحجبت<br />وعشان إيش<br />ترضي ربها وترجع لدينها وتقول لربنا<br />\"يا رب أنت أهم عندي من كل أفلامي ومسلسلاتي وشغلي\"<br />أااااااااااااااااااه<br />طب شو بخصوص مسلسل الشهيدة وفاء إدريس؟؟؟<br />الجواب بتلاقوا عند المحجبة \"حنان ترك\""
