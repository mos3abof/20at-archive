subject = "بارك الله فيكي"
author = "مناره الهدي"
posted = "2006-05-28"
text = "انا سعيده جدا بسماع هالخبر الرائع و ربنا يثبتك ويزيد من ايمانك ونلاقي ان حجابك بيزيد للافضل دائما وان تثيتي علي قرار اعتزالك للفن لمدي الحياه ولا تكوني كفنانات لبسن الحجاب واعتزلن ثم عادوا الي التمثيل مره اخري لاني فعلا بحبك برغم اني اراكي في البرامج فقط لاني والحمدلله لا اشاهد المسلسلات والافلام **ربنا يثبتنا جميعا*** واتمني ان تكوني الافضل عند الله دائما .<br />وبارك الله فيكي وان شاء الله نسمع عن حجاب واعتزال فنانات اخريات قريبا...<br />ربنا يثبتنا جميعا ويرينا الخير حيثما كان"
