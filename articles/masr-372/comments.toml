author = "مؤمن من آل فرعون"
posted = "2006-05-28"
text = "بصراحة يا جماعة، أنا ما كنتش ناوى أكتب أى تعليق بس باذكر الإخوة اللى غيروا الموضوع ودخلوا فى نقاشات جانبية وبدأوا حرب شعواء ضد بعضهم تحيزا لداعية أو لآخر مع احترامى وتقديرى لكل منهما وجميع علماء المسلمين الأجلاء، فلكل واحد دوره، وإن قصر فى ناحية من وجهة نظر البعض فقد أجاد فى أخرى والمفترض أن يكمل كل منهم الآخر لا أن ينفيه. وأنا أظن أن من قواعد الإسلام الذهبية أن كل الناس يؤخذ من كلامهم ويترك إلا النبي صلى الله عليه وسلم، فلا تقديس ولا عصمة لأحد، بل نحسن الظن بالناس وخاصة الدعاة ونحسبهم جميعا مجتهدين وندعوا الله أن يجمع على الحق قلوبهم وأعمالهم. باقول فى الآخر للمتحاربين اتقوا الله ولا تتعصبوا لأحد ولكن تعصبوا لله ولدينه، ولتتعاونوا على الخير وليعذر بعضكم بعضا.<br />كفـــــــــــــــــاية حروب ماليهاش لازمة<br />اللى عايز يهاجم حد بدل ما يهاجم داعية بيقدم نوع من أنواع الخير،(حتى ولو هو مش شايفه خير فى نظره بس هو خير) يروح يهاجم حد من بتوع الهيافة والهبالة والفساد.<br />اتقـــــــــــــــــوا الله<br />وكفــــــــــــــاية حـــــــــــــرام<br />(أمة محمــــــد صلى الله عليه وسلم فيـــــــن؟)<br />(واعتصموا بحبل الله جميعا ولا تفرقوا واذكروا نعمة الله عليكم إذ كنتم أعداء فألف بين قلوبكم ......)"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

