[[comments]]
order = 22
subject = "الاخ عبد الرحمن . خلي بالك"
author = "إلى الاخ عبد الرحمن"
posted = "2006-05-28"
text = "السلام عليكم ورحمة الله وبركاته<br />اخي العزيز ... لقد اقرنت<br />اسم اسحاق الحويني العالم الشيخ الفاضل<br />مع ما البتاع ده اللي اسمه عمرو خالد<br />وده اجحاف وتقليل من شأن العلامة<br />أحد أعمدة السنة في مصر أبو اسحاق الحويني<br />وطالما بتحب اسحاق الحويني<br />يمكنك ان تسأله عن حكم الشرع في<br />خرافات وخزعبلات وأباطيل عمرو خالد<br />وما هو الفرق بين العالم ... والمنظرجي<br />ومن يتاجر باسم الدين ...<br />احذر ...... السم في العسل"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

[[comments]]
order = 23
subject = "دعوة للتأمل"
author = "السلام عليكم* انااهنئ حنان على ما قررته واتمنى ان يبارك الله لها ويرزقها الثباااااااااات واتمنى من الله الا تخذلنا كما خذلتنا الاخريات * وبالنسبة لتلك الهوجة التى تفزع البعض من كمية الردود فهذا من باب الفرحة ولا قلق منها فهى عادة كل الناس ان رأوا فرحا سارعوا بالمشاركة بالحضور وبالمال ان استدعى الامر هذا وكذلك فى الحزن * وهذا من طيب النفس* وطلبى ممن هو قريب من حنان ان يشدد على الثباااااات فانا والله نصدم لما نسمع ان احداهن عادت للتمثيل اوتقديم البرامج * وانا ارى فى هذا نوعا من النكوصصص حيث اننا قد خرجنا من دائرة الهزل والعبث الى الامور الجادة التى تعنى بالممات الذى يقولون عنه انه الحقيقة الوحيدة فى الحياة * ومن هنا استوحى اهمية ما هو حنان مقبلة علية وسطحية العبث الذى اشبعنا منه على مر200سنة* نعم عبث فقوموا بعمل مقارنة بين ما انتجته الجامعات والمدارس منذ خلقها الله وبين ما رأيناه من الفن* اعنى ما هو الذى قدمه الفن لينافس العلم فى الاهتمام والله كما هو مشاهد من الترصص امام السينمات وعمارها وخراب المكتبات* وبين ما غيره العلم فى البلاد التى كانت تسمى بالمتخلفة فى سنوات معدودة وبين ماغيره الفن فى رؤوس الشباب الذى نعانى من من ويلاته والذى شهد اهل العلم ان من اسباب تدنى المستوى الاخلاقى وغيره من المستويات من الفن الحديث * اما القديم (الابيض والاسود)فيكفى ان تتقزز من كثرة الراقصات فيهاوجميعها التى لوكانت بالالوان لوقف شعر الرأس وندى الجبين واصاب العين الحول ولا ار يد من احد ان يبرر لى ظهور هذاالرقص اساساوعلاقته بالقصة اواهميته للمشاهد*وان ارادت حنان او غيرها العودة وكانت نيتها اصلاح المجتمع(تلك الحجة التى يستخدمها اهل الفن فى تبرير ما يقدموه*واحصوا لى ما اصلحوه منذ ولد الفن)فهناك طرقا"
posted = "2006-05-28"
text = "اقرأ بقية التعليق .."
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

