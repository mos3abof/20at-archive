[[comments]]
order = 5
subject = "بلاش فزلكة"
author = "انا كمان اتمنى انها تبقى ملتزمة في حجابها زى منى عبد الغني مثلا . و في رأيي ان حجابها ده مؤشر كويس لأن هيحط السينما في الاطار اللى المفروض تكون فيه و ان الفن يحقق الهدف منه بجد على الاقل الفن اللى هتقدمه حنان و حلا و اللى زيهم اللى ان شاء الله هيزيدوا في المستقبل."
posted = "2006-05-25"
text = "أما بقى لشباب المنتديات اللى حضرتك بتقول انهم كل اللى يهمهم امتى معاد عرض المسلسلات و اللقاءات فأنا كنت عايز ادعوا حضرتك بس للمنتدي بتاع حنان ترك اللى على الموقع بتاعها علشان تعرف ان من شهر تقريبا و هما بيناقشوا الموضوع بتاع حجابها ده بشكل جامد جدامن غير ما يعرفوا انها ناوية على الموضوع ده .<br />الموضوع بدأ باستفتاء هل من عضو من المنتدى و بعدين بقى خد عندك التعليقات و الاراء كانت سخنة على الاخر لدرجة ان المشرف على الموقع بعت رسالة للناس علشان يهدوا اللعب شوية يعنى الناس مش تافهين اوي زى مانت فاهم يا أخ ياللى هتحرر فلسطين"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

