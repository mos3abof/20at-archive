[[comments]]
order = 1
subject = "ربنا يهدي"
author = "سوسة المفروسة"
posted = "2006-05-25"
text = "ربنا يثبتها .فالمجال اللي هي بتشتغل فيه ده ما بيسبش حد في حاله يا اما بيرجع و بيتقلب 180 درجة .زي سوسن بدر وفريدة سيف النصر..ده غير الزفة اللي عملوها للزفتة (ميرنا المهندس) زي ماتكون حررت فلسطين لما قلعت الحجاب...ده غير اللي بيتنازلوا شوية شوية.و اللي بيشوف عبير صبري في البرنامج بتاع (هالة زرقان) على روتانا هيعرف قصدي<br />اما الفنانة اللي انا متوقعاها قريب متهيالي: (اثار الحكيم) رغم انها محترمة في ادوارها و التاريخ بيقول ان اللي بيتحجبوا في الغالب هم الممثلات اللي بيكونوا اقل احتراما لانهم بالفطرة بيبقوا قرفانين من نفسهم و م اللي بيعملوه<br />و بتطبيق المبدا ده يبقى (منة شلبي ) ياما ربنا يهديها يا اما تخفي في ستين سلامه..انا بصراحة ما بطيقهاش"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

