[[comments]]
order = 13
subject = "المهم أن تجد السلام الذي تبحث عنه"
author = "لبنانية"
posted = "2006-05-27"
text = "أنا معك بأن حجاب فنانةٍ ما ليس خبراً مصيرياً بحد ذاته وليس انتصاراً للإسلام في معركته مع الغرب ولن يقدم أو يؤخر شيئاً في مأساة الشعب الفلسطيني أو العراقي أو كل الشعوب العربية أو الشعوب المغلوبة على أمرها في أنحاء المعمورة ولن يكون عاملاً ذا شأن لا من بعيد أو من قريب في الحراك الذي يشهده الشارع المصري (أخيراً بعد سبات طويل). الخبر شخصي بالدرجة الأولى، خاص بالفنانة نفسه، وهو شعبي أيضاً، نظراً للعلاقة الوثيقة والتلقائية التي تنشأ بين الشعب وأي شخص مشهور، سواء كان سياسياً أو نجماً سينمائياً أو أديباً معروفاً... وهي علاقة ليست حكراً فقط على شعوبنا \"المتخلفة\"، بل نجدها في أكثر الدول تطوراً، وما عليك سوى أن تتابع البرامج الأمريكية أو الأوروبية التي تشمشم أخبار النجوم بأدق تفاصيلها وتشغل بالها بما لبسته الممثلة الفلانية أو العلانية أو مع من تخرج أو من هو أبو طفلها أو حتى ما نوع الملابس الداخلية التي ترتديها، وفي هذا انعكاس لهوس الجمهور نفسه بهذه الأخبار! ففي هذه المسألة، نحن لسنا استثناءاً غبياً أو متخلفاً. المسألة إذاً طبيعية، لما لحياة النجوم على الشاشة وخارجها من سحر خاص يستقطب المشاهد القابع في منزله والذي يرى في النجم شخصاً مثله، لكنه في المقابل يعيش حياة، حقيقية أو متخيلة تحاكي أحلام المشاهد وخيالاته.<br />حنان ترك من تلك الشخصيات الجذابة التي نجحت في استقطاب الآراء، معها أو ضدها، وهي بشخصيتها الملتبسة والمتناقضة مثيرة للاهتمام ربما أكثر من غيرها من بنات جيلها، وبذلك استقطبت هذا الانتباه الجماهيري والإعلامي. أما أن 90% من أعضاء منتديات حنان على النت قد سروا بحجابها، فذلك طبيعي، فالتلفزيون والسينما أصبح جزءاً من حياتنا اليومية، سواء كنا متدينين أو غير متدينين، وجميع الناس يتابعون ا<br />اقرأ بقية التعليق .."
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

