[[comments]]
order = 60
subject = "حجاب ولا ......؟"
author = "فيصل المراقب"
posted = "2006-06-20"
text = "ليس المظهر الخارجي هو الحد الفاصل بين العفة والنقيض...فكم من امرأة غير محجبة نراها تجسيدا متكاملا للشرف والاخلاص وكم من امرأة محجبة غرقت في بحر الرذيلة والفسوق.زام حكاية الفنانات المحجبات فأني لا اراها الّا تسويق لبضاعة خاسرة فلو كانت الفناة تنوي فعلا التوبة والتحجب لما ملات الصحف مقابلات عن انبعاث روح رابعة العدوية في جسدها الذي امتلا من السوائل المنوية ومن عشرات الرجال....لشد مالفت نظري ان العاهرة سهير رمزي تصًرح بان توبتها وتحجبها قرار لا رجعة فيه لان الله تعالى هداها الى نور الايمان والتقوى وبعد مرور زمن نرى سهير تكسر قرارها لتعود الينا بحجابها وبمكياجها وابتسامتها السكسيه وبصدرها المفتوح ليظهر نهديها بشكل شهواني ترافقه ابتسامة ساقطه وكأنها تقول تعالوا واركبوني ايها العشِاق....من الممكن ان اصدق ان الشمس تشرق من الغرب ولكن لا اتمكن من ان اصدق ان كس سهير يتوب عن النيك لان من شبً على شيء شاب عليه...اخيرا عادت التائبه سهير الى عالم النيك المحجب والشرمطه الشرعية والتطوبز التقي<br />ترى هل نحن اغبياء الى هذا الحد؟ياسهير ما هي اخبار شبكة الدعارة التي كنت تشرفين عليها ؟وهل في النيه ان تدشني مشروعا اكثر مدنية للقوادة والسمسرة تحت اشراف كسك الوسخ الذي مزقته ازباب<br />اقرأ بقية التعليق .."
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

[[comments]]
order = 61
subject = "إلى فيصل المراقب"
author = "نبيلة"
posted = "2006-06-26"
text = "أنا مأعرف اشفيك على الفنانة سهير رمزي.. يمكن غيران منها لأنها أحلى من زوجتك القبيحة.. اش سوتلك عشان تقول عنها هالكلام؟ اختشي على دمك.. عيب عليك تقول هالكلام على وحدة ما تدري اش نيتها ولا تدري ليش رجعت.. وما تدري, يمكن الله سبحانه وتعالى غفر لها معظم ذنوبها.. هل أنت على علم يعلاقتها بربها.. ثانيا هي راح تقدم عمل محترم في رمضان الجاي وانا متأكدة أنك راح تشوف مسلسلها.. لو انت رجال شريف كان ما قلت هالكلام القذر يا قليل الأدب"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

