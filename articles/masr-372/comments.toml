[[comments]]
order = 54
subject = "مبروك حنان"
author = "rasha"
posted = "2006-06-05"
text = "خبر جميل حجاب الفنانة الجميلة حنان ترك والحقيقة ان اجمل كلام سمعته من فنانه اتحجبت كلام حنان وهيه بتقول الموضوع بسيط مبروك يا حنان وخلاص.<br />الف مبروك يا حنان<br />ويا رب كل الفنانات يتحجبوا ،وان كان اغلبهم عارف ان الحجاب فرض لكن مش قادرين ياخدوا قرار باختيار رضا الله وتطبيق فرضه عن حبهم للشهرة والعمل الفنى اللى الغريب انهم بيعتبره ان الفن رسالة طيب ازاى الرسالة توصل بطريق ، التبرج والقبلات والرقصات علشان توصل هذه الرسالة الحميدة ايها الفنانون والفنانات بتغضبوا الخالق فين الرسالة كدة ويتعلموا الشباب منك اى رسالة ، يا حرام بتضعوا انفسكم فى غضب ربنا علشان توصلولنا الرسالة؟.لازم نعترف ان الفن، اصبح اغلبه وسيلة للترويح والترفيه فقط<br />وللاسف هذا الترويح جاء بما يغضب الخالق.<br />اتمنى ان تكون حنان فاتحة خير ليس للحجاب فقط انما للاعمال المحترمة والهادفة والتى قدمت حنان الكثير منها<br />حنان انسانة صادقة وبتاخذ قراراتها وهى مقتنعة وعلى ثبات وممكن تغير كتير.<br />وبالمناسبة استمرار حنان فى التمثيل افضل من اعتزالها انا مستغربة من اللى عايزنها تعتزل يعنى تمثل وتظهر بالتليفزيون وهيه من غير حجاب طيب ليه لما تلبسه تختفى وتختفى من ايه هى عملت الصح وطبقت الفرض ليه ما تكملشى اعمالها بالحجاب وتكون قدوة لبنات تانية يمكن يلبسوا<br />،الحجاب زيها<br />والله انا شايفه اللى المفروض ما يظهروش على الشاشة الغير محجبات،وحنان ممثلة موهوبة واعمالها مميزةيعنى وجودها مكسب للفن فى مصر وخصوصا وهى محجبة هنكون اعمالها مقنعة اكثر للشباب<br />ويا رب مسلسلاتنا فى مصر وبرامجنا وافلامنا ما<br />،يكونش فيها فنانات متبرجات<br />ويا رب ربنا يهديهم كلهم ويلبسوا الحجاب،علشان الاسرة المصرية المحترمة تقدر تفتح ، التليفزيون من غير ما تاخذ ذنوب.<br />اقرأ بقية التعليق .."
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

