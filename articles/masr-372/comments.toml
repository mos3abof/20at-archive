subject = "انا من منتدى حنان ترك"
author = "كازانوفا"
posted = "2006-05-26"
text = "السلام عليكم<br />اولا احب اوضح لحضرتك يللى كتبت المقال زى منتوا هنا مهتمين بالبلد والنقد الجامد قوى ده احنا كمان مهتمين بالبلد والناس اللى فى بلد وانا العضو اللى نزل الاستفتاء فى المنتدى بتاع حنان ترك والحمد لله انها تأثرات بالاستفتاء اللى حصل على المنتدى الرسمى ليها اللى هيا اصلا كل مواضيعها ومقالاتها عليه هو.<br />وبشكر موقعكم وبشكر حضرتك لأظهار مثل هذه المواضيع المهمة زى بقية المواضيع الاخرى."
