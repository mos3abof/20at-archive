[[comments]]
order = 18
subject = "الموضوع كبير يا شباب"
author = "عارف"
posted = "2006-05-27"
text = "الموضوع بسيط احنا امة مهزومة وفاكرين ان كل الخير فى الشكل المنتصر اللى هو الغرب وده المعيار عندنا اللى يخالفه يتكسف من نفسه . لاكن فى حاجة بتحصل جوة يمكن جوة البيوت صوت بينتشر وبيشكل شكل جديدعلينا قديم بيننا للحياة علشان كده بيظهر فجاة يمكن حتى يكون جوة النفس حوار مع القران مع الله .لاكن النتيجة مفاجاة حتى على الشخص نفسه بتطلع فى شكل اعتراض , مفاجاة , ثورة ويمكن تحدى والكل بيسقف لان الكل حيران مبين الصوت الاعلامى العالى صوت المنتصر والصوت اللى جوة صوت منى انا من جواية بيقول انى عندى حضارتى وراحتى وجمالى بل وحياة حقيقية جميلة ومنطلقة مع صاحبها مع ربى . يمكن الفرحة لاننا بنحس انه انتصار جديد من جوة لبرة . الغريب اننا كلنا عارفيين ايه اللى بيحصل جوة كويس يعنى \"اريين على فقى واحد\"<br />يمكن....."
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

[[comments]]
order = 19
subject = "مبر وك يا حنونة يا كايدة العزال"
author = "الى المد عوة المهزاة البدوووف"
posted = "2006-05-27"
text = "مبروك ياحنونةاولادى فرحوا جدا بخبر حجابك وكانت خطوة اعطتهم ثقة بانفسهم فى عصر امتلا بالفتن والمغريات فى القنوات الفضائية واصبحنا نخاف على اولادنا من مشاهدة الفضائيات والاسلام يجب ما قبلة وربنا بيقبل توبة التائبين وغفور رحيم وياريت تقدمى لاولادنا اشياءاسلامية مفيدة وخصوصاان اللوبى الصهيونى هو وراء الاعمال السينيمائية الهايطة وارد على الحاقدين على حجابك بانهم جبناء لم يذكروا اسماءهم ولوكان عندهم شجاعة يقولوا اسماءهم وعناوينهم ولكنهم جبناء من حزب الشيطان الا ان حزب الشيطان هم الخاسرون وواضح من اسلوبهم انهم منحطون اخلاقيا وعاهرات فسيرى على بركة الله ياحنونة ودعواتنا بالثبات"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

[[comments]]
order = 20
subject = "أشهدكم أنى احب الله والرسول والصحابة و عمرو خالد وأبو أسحاق الحوينى"
author = "خالد عبد الرحمن"
posted = "2006-05-27"
text = "الحمد لله ان حنان ترك اتحجبت واعبال باقى بنات الامة<br />ولاكن المشكلة<br />1_ ان تتوقف عند هذه القطعة من القماش وبذالك تكون ارضت نفسها<br />2_ الاسلام حجاب وعبادة واخلاق ومعاملات<br />ارجو من كل البنات الا يتوقفو عند مثل هذا الحجاب لنهن يعلمن انه ليس بالحجاب الذى فرضه الله<br />وارجو ان يكون لبسهم للحجاب لله مش لئرضاء أنين نفسى وان يتقو الله فى الشباب وان يساعدوهم على العفة لا على اطلاق النظر وتاذنا والسفاح<br />ربنا يتوب علينا وعلى عصاة المسلمين"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

