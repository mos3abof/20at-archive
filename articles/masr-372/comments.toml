posted = "2006-05-29"
text = "حنان اتحجبت....طيب ومالو<br />حلا اتحجبت ..الف نهار ابيض<br />ايه يعني ماهي بوسي كل سنة بتروح تحج ..وتقريبا كمدا والله اعلم فيفي عبدة كمان<br />الاسلام موش بغطاء الراس او بكام ركعه الاسلام دين خلق ومعاملة<br />مامليون الف واحدة بمصر متحجبه ...وبردو ماشية على حل شعرها<br />ومليون واحده موش متحجبه واقرب مايمكن لتعاليم الاسلام<br />ياناس فوقوا بئا ...لا بحجاب حنان ولا بحجاب غيرها<br />حينعدل حال البلد وحال العرب وحال المسلمين<br />اعرفوا الاول دينكم وطبقوا تعاليمه كونوا قدوة حسنه<br />الدين معاملة...الدين معاملة الدين معامله<br />الناس احرار..يلبسوا يقلعوا كل واحد حر"
