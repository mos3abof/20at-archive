[[comments]]
order = 30
subject = "اتق الله ايها النكر ة"
author = "من تلا ميذ العلا مة عمر خالد"
posted = "2006-05-28"
text = "لقد ابتليناهذا الز مان بان نهاجم بعضنا البعض ونسينا عدونا الاكبر ونسينا التحديات الكبر ى التى تواجة الا سلا م والمسلمين وحصرنا الا سلا م فى مجر د اللحية والجلباب الا بيض لقد عشت فى اوروبا 20 عاما لاننى مضطهدة فى بلا دى انا وزوجى الداعية وكنت اخاف على بناتى من بلا د اوروبا والكفر وكنت ادعو الله ليلا ونهارا ان يحفظ اولا دى فى هذة البلاد كما حفظ موسى فى بيت فر عون واذا باستاذنا الجليل عمر خالد يظهر على شاشة التلفاز باسلوبة السهل التلقائى وياخذ بيد الشباب الضائع ويضعة على اول خطوات الالتزام وكثيرا من المشايخ اصحاب اللحى ولكن اسلوبهم منفر للشباب ( مع العلم انا منتقبة من 25 سنة وزوجى الداعية ملتحى ) ولقدادرك اعداء الا سلام فى الداخل والخارج خطر هذا الا سلوب الجديد فى الدعوة ومدى تاثيرة على جذ ب الشباب فبادروا باخراجة ونفية من مصر لينفض عنة الشباب ولكن ويمكرون ويمكر الله والله خير الماكرين انتشر ت دعوة الا ستاذ عمر خالد واصبحت عالمية وكان سببا فى التزام الكثير والكثير من الشباب فى العالم العربى والاوروبى بعكس الكثير من المشايخ الا جلا ء انحصر ت دعوتهم فى تعليم شروط الحجاب ونواقض الوضوء وتصيد الا خطاء للداعين الى الله واشغلهم الشيطان بذلك عن عدوهم الا كبر والجهاد واقامة الخلا فة الاسلا مية فالحذر الحذر من التر كيز على مهاجمة المسلمين فصر ح الا سلا م شامخ وكل من يقدم حجرا ليساهم فى بناء هذا الصرح الشامخ فقد ساهم فى الدعوة وليس من الادب ولا اخلاق الاسلام ان نشهر بالداعين الى الله على شاشات الانترنت كما ان اسحاق الحوينى ليس الله حتى لا نقرن اسم عمر خالد مع اسمة"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

