author = "لميس"
posted = "2006-05-27"
text = "أسأل الله أن يتقبل حجاب حنان ترك والمهم أن تكون خطوة بعدها خطوات وقربة تتلوها قربات وأناشد بحب كل الذين يقرأون هذا التعليق ان ينصاعوا لنور العقل والمنطق وأ يخلصوا فى البحث عن الحق<br />بالله عليكم يا أحبائي متي قدمت صابرين رسالة وفادت أمتها عندما كانت ترقص وتغني وتفسد فى الأمة بأفلامها أم بعد ان تابت واصبح لها رسالة تدعوا فيها الى العفة اي هاتين الشخصيتين سيكون فى جانب الموحدين والدعاة<br />ولكن عزائي الوحيد فيمن يشكون فى أنفسهم وفي دينهم الى الآن أرسل لهم هذه الآية الكريمة لتقطع أمنياتهم<br />بسم الله الرحمن الرحيم<br />إِنَّ الَّذِينَ كَفَرُوا يُنْفِقُونَ أَمْوَالَهُمْ لِيَصُدُّوا عَنْ سَبِيلِ اللَّهِ فَسَيُنفِقُونَهَا ثُمَّ تَكُونُ عَلَيْهِمْ حَسْرَةً ثُمَّ يُغْلَبُونَ وَالَّذِينَ كَفَرُوا إِلَى جَهَنَّمَ يُحْشَرُونَ \"سورة الانفال آية 36<br />أرجوا من الذين يستهزأون بالحجاب ان يكفوا فهو إستهزاء بعقولهم قبل ان يكون بأمتهم ودينهم"
archived = "2006-07-04"
capture_url = "https://web.archive.org/web/20060704142720/http://masr.20at.com:80/article.php?sid=372"

