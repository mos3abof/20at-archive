[[comments]]
order = 14
subject = "اين مشاركة القائمين على الموقع اولا من كنس الشوارع ؟؟؟؟"
author = "مصرى أصيل"
posted = "2006-11-23"
text = "اخوانى القائمين على الموقع تحيه طيبه لكم جميعا . موضوع شيق ومهم جدا ان نساهم جميعا فى ذلك . ولكن البدايه منكم انزلو الشارع واكنسو وبعدين اطلبو الدعم من شباب وشابات مصر وستجدون كل العون . وبعدين يوجد مواضيع اهم من النظافه للشوارع وهى نظافة العقول والارواح . وانتم تعلمون ماهى وجميع الساده رواد الموقع ايضا . ويمكننى شخصيا ان اقوم بهذا العمل بمفردى لو وجدت الدعم اللازم من موافقات حكوميه مناسبه ودعم مادى وخلافه .<br />يعنى الموضوع باختصار استثمار .<br />هل تساعدونى فى ذلك ؟؟ ارجو الجواب . وجوابكم سيكون هو البدايه او النهايه لنظافة شوارع مصر .<br />وممكن تقومو بحمله لمنع الاتجار بالمخدرات والبانجو والدعاره فى كل مناطق مصر .<br />هو ده الكلام الاولى والاهم ."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215040209/http://masr.20at.com:80/article.php?sid=547"

