text = "مش عارف ايه الفكرة الغريبه دي<br />كنس شوارع ايه؟<br />الشوارع مش هتنضف<br />اظن ان الفكرة مش حيوية خالص<br />ولو فكروا في حاجه تانيه مفيده هيكون احسن<br />وعلى كل محاولة يتحقون عليها التحية"
