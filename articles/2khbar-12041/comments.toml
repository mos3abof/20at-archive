text = "كما انى اعتب على دكتور حبيب قوله بان مصر و ايران ضم محاور مؤثره فى المنطقه فببساطه لا يمكم مقارنة دور مصر بدور ايران ان وجد لها دور من الاساس فمصر لها دور استراتيجى معروف و لها موقف متوازن فتحتبر حلقة الوصل بين الدول الغربيه و دول الشرق الاوسط اما ايران فمن المعروف موقفها العدائى للغرب و ان رأيها فى قضايا المنطقه هو رأى مهمش و لا يعتد به على الاطلاق و ارى ان رأى الدكتور حبيب لا ينم الا عن جهل سياسى و انصح الاخوان بأن تنتقى المتحدثون بأسمها و ذلك حفظا لتاريخها السياسى و الذى اهتزت سمعته بفعل مثل هؤلاء<br />صديقكم المخلص كدتور بنيامين كوهين مزراحى"
archived = "2009-05-14"
capture_url = "https://web.archive.org/web/20090514135015/http://www.20at.com:80/2khbar/12041-2009-05-12-08-41-48.html"

