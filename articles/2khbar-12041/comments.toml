author = "benjamin cohen"
posted = "2009-05-13"
text = "و كالعاده يأتى الاخوان المسلمين باحكام مسبقه على الاداره الامريكيه و ان اتفقت مع جماعة الاخوان حينما اعطوا حكم مسبق على ادارة بوش و فعلا تحققت نبوئتهم لكنى اختلف معهم فى حكمهم المسبق على ادارة باراك اوباما و اللتى تختلف عن سابقتها فى الحكمه فى اتخاذ القرارات و الشفافيه الى حد كبير و اعلانها احترام العالم العربى و الاسلامى و هو ما لم يحدث من قبل من الادارات الامريكيه السابقه لكن فى نفس الوقت اتوجه برأى لجماعة الاخوان و هو ان هذه المنطقه تضم طوائف مختلفه سواء طوائف فكريه او طوائف دينيه و مثلما توجهت الاداره الامريكيه الحاليه بخطابها المعبر عن الاحترام للعالم الاسلامى فأرى انه من الواجب على جماعة الاخوان ان تظهر بعض الاحترام للطوائف الدينيه و الفكريه المخالفة لها و ان يتخلوا عن نظرياتهم القائله بأفضليتهم على غيرهم و انهم هم وحدهم من يمتلكون الحقيقه المطلقه و ان كل من خالفهم الراى هو مخطىء و ارى انه فى ظل هذه الاداره المعتدله يجب عليهم ان يخرجوا من عزلتهم و ان يتعاونوا مع غيرهم و ان يعلموا جميعا ان الحل الحقيقى لمشكلة الشرق الاوسط يكمن فى تعاون جميع الاطراف"
archived = "2009-05-14"
capture_url = "https://web.archive.org/web/20090514135015/http://www.20at.com:80/2khbar/12041-2009-05-12-08-41-48.html"

