[[comments]]
order = 2
subject = "الحقيقة"
author = "وائل عباس رئيس تحرير جريدة الوعي المصري"
posted = "2006-09-02"
text = "يطلق البعض على المرأة المتعددة العلاقات الجنسية ( حتى وإن لم تكن تتاجر بجسدها ) العديد من النعوت التى يقصد من خلالها الإشارة اليها بنوع من التحقير والدونية ، خاصة أن المجتمعات الشرقية المتمسكة بالدين فى ظاهر حياتها لا تقبل أن تكون للمرأة حياتها الخاصة بها ، فهى تتدخل فى أدق شئونها ، وتدس أنفها فى أكثر أحوالها خصوصية ، خوفا من أن تتمرد هذه المرأة على الأعراف والتقاليد التى يقوم عليها كيان المجتمع الذكورى الذى بنى على أجساد النساء وهياكلهن العظمية . وفى المقابل ، نجد أن الثقافة السائدة فى مجتمعاتنا لا تستهجن تعدد العلاقات الجنسية للرجل ، بل تشجعها وتشيد بها ، ولا يمكننا أن نخلى مسؤولية الدين ( الإسلام خصوصا ) من هذا الأمر ، فله فيه دور لا يمكن إنكاره ، خاصة عندما أباح للرجل تعدد زوجاته ( وإمائه ) وألزم المرأة بمعاشرة رجل واحد حتى ينفصلا سواء بالطلاق أو بموت أحدهما . من حقنا أن نتسائل ونمعن فى التساؤل وراء الحكمة من إباحة تعدد زواج الرجل ، وفى المقابل - على الرغم من أن هذا الأمر ليس مطروحا على الإطلاق - من حقنا أن نتسائل بالضرورة عن الحكمة وراء إلزام المرأة بمعاشرة رجل واحد فقط . أنا بالطبع ضد تعدد الأزواج بنفس القدر الذى أرفض به تعدد الزوجات ، ولكن المشكلة تكمن فى أنه لا يوجد مبرر عقلانى يقف خلف إباحة التعدد للرجل وتحريمه على المرأة . يدعى البعض أن السبب وراء ذالك يكمن فى أن تعدد زواج الرجل لن يؤدى إطلاقا إلى إختلاط للأنساب ، بينما تعدد زواج المرأة سيؤدى بالضرورة إلى عدم معرفة الوالد الحقيقى للطفل ... حجة مقنعة ...أو لنقل .. غش مقنع ... اليس كذالك ؟؟!!! ما أسهل أن يغلف الغش والكذب وقلب الحقائق بغشاء من المنطق المهترىء سريع الإستهلاك !! .. حسنا ، إذا كان تعدد زواج المرأة سيؤدى إ<br />اقرأ بقية التعليق .."
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114249/http://masr.20at.com:80/article.php?sid=846"
