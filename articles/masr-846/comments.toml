text = "يعنى إنت إتكيت على الجرح ـ بس مش فاهمه زبيبة الصلاة على جبهة كاشير آولاد رجب مضايقاك فى إيه؟؟!!!<br />آقول لك على حاجه تضايق آكثر : سكان عين شمس والمرج اللى بقى معاهم قرشين وراحو يسكنوا فى مصر الجديده.<br />آآآآآآه يانى"
