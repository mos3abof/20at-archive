subject = "لو كانت بنته مكنش سامحلها بالكلام في برنامجه"
author = "واحد حاسس إني بلده بتدهور"
posted = "2006-05-28"
text = "أنا متأكد إني أسامة منير لو كانت عنده بنت مكنش سامحلها بالكلام في البرنامج. و لا أعتقد أن أي بنت أو ولد محترمين و متربيين ممكن يرفعوا السماعة و يحكوا اللي بيحكوا. بالشكل دا بلدنا بتنحل و بناتنا في ضياع أكتر من مهما ضايعينز مش كلهم طبعاً لكن الأغلبية. يا أسامة منير خاف ربنا و على بنات الناس من إغراءك لهم بصوتك المعسول."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113642/http://www.20at.com/article2.php?sid=439"

