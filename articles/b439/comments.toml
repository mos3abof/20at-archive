posted = "2006-02-14"
text = "يا جماعة عيشوا طفولتكوا بالطول و العرض و بلاش كبت و بعدين في فترة اسمها المراهقة و سموها كده لانها بترهق الاب و الام بس و لازم نعيشها برضوا و بعدين بقا كل سنةو انتوا طيبين خلوا الناس تاكل عيش<br />انا عمري مسمعت برنامج الاخ اسامة دى بارادتي الحرة بس انا شايف ان البرنامج ده متنفس لكتير من المراهقين خليهم يعيشوا عشان لما يكبروا يبقى فيه عندهم ذكرى حلوة ( او وحشة مش مهم ) المهم ان في ذكريات و احب اهدي اغنية ذكريات لعمرو دياب لكل اللي معندهمش ذكريات"
