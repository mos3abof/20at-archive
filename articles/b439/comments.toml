subject = "ابو العريف"
author = "محمد"
posted = "2006-02-16"
text = "فعلا كتير بحس انه ابو العريف..عامل زي الشيخ عزوز بيعرف كل حاجة<br />اللى عايز يسأل مفروض يسأل شخص قريب منه<br />شخص يعرف عنه كتييييييير<br />عمو اسامة منيل ده اقصد منير يعرف كل حاجة في كل حاجة..انا بحسده على معلوماته القيمة اوي...وكمان بحسده على كمية الهبط والهبل اللي بيشوفها كل يوم من معجبيه ومعجباته..لول<br />اكيد هتقولوا انا حاقد عليه عشان هو مشهور وانا لأه..بس د مجرد رأي..وكمان هو مشهور بين مين؟؟..كل اللي بيحبوه في الهجايص...اشوفكم على خير"
