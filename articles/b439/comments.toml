author = "إنجى _ الأسكنرية"
posted = "2006-03-08"
text = "والله أسامة منير ده أنسان محترم جدا و آرئه دى فى جزء منها ناتج من تجاربه الشخصية و الجزء الآخر من عادتنا و تقاليدنا و أنا أستفادت جدا من البرنامج ده لأنه بيعرض تجارب الشباب و بيتحدث عن قضايا مختلفة فى الحب و أوقات بحب أكتب آراء أسامة منير لأنها بتفدنى جدا و بتخلينى أزاى أعرف أتصرف فى مواقف معينة و أكيد يا جماعة كل واحد فينا مر بتجربة بيحتاج فيها لنصيحة شخص عنده خبرة فى الحياة و انا شايفة أن أسامة منير مابيشجعش ع الفساد زي ما ناس كتير بتقول لكن هو كل اللى بيعمله انه بيقدم النصيحة المناسبة لأى مشكلة بيسمعهامن غير ما يخرج عن عادتنا و تقاليدنا"
