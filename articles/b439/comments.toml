subject = "لذيذ اوي"
author = "شريف"
posted = "2006-05-24"
text = "يا جماعه زعلانين ليه من اسامه منير دا يعتبر سمكري العواطف عامل برنامج بيشتغل به البنات والبنات فاضية مش وراها حاجه وهو فاضي . من ضمن المواقف بنت اتصلت به بتقوله انا صاحبي بيحبني وبيطلب منها حاجات وهي مش عايزه تعملها فبتضطر انها تعملها عشان متزعلهوش يقوم يرد عليها يقولها لا لا لازم تكوني مقتنعه بالشئ اللي بتعمليه بالله عليكم رد بيحل مشاكل ايه وبتاع ايه وقال ايه عاطفي مع انه شكله مش عاطفي خالص شكله كان بيشتغل صبي في ورشة عربيات سمكري يعني . فطور نفسه بقي سمكري عواطف . ولا تعليق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113642/http://www.20at.com/article2.php?sid=439"

[[comments]]
