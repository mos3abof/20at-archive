subject = "للرد على دودو"
author = "أحمد"
posted = "2006-02-15"
text = "أنا معاكى ان فى شباب كتير عايزين حد يكلمهم وينصحهم ويحللهم مشكلهم بس اللى أنا معترض عليه وأظن ان الناس اللى كتبوا فوق دول ومنهم مريم كاتبة المقال ان يكون حل هذه المشاكل على الهوا ..<br />وسؤال يا ريت إجابه عليه.....<br />هو مين أسامة منير ده ولا خريج إيه علشان يحل للناس مشاكلها المفروض الواحد لما يستشير حد يختار حد فعلا يعرف يرد رد صحيح دكتور نفسى مثلا."
