subject = "مختلفة في الرأي"
author = "دودو"
posted = "2006-02-14"
text = "انا مختلفة مع هذه الاراء لاني اعتقد ان هناك شباب كتير محتاجين حد يسمع وبقدر مشاعرهم، فغالبا ما نجد الاهل ترفض هذه المشاعر فيلجوء الي صحابهم اللي بيكون في نفس سنهم تقريبا وبالتالي نفس التفكير واعتقد ان هذا البرنامج ينفس عن مشاعرهم لان الانسان في كثير من الاحيان يحتاج الي التحدث مع من لا لم يعرفه لانه لا ينفافقه"
