text = "انا معاكو انو دا غلط ان اي واحد كده يعمل برنامج والشباب تقعد تكلمه وتحكي مشاكلها بس في حاجه مهمه اللي بيعمل كدا مش لاقي حد يسمعه او مش لاقي حد يقولله كلام يريحه فبيضطر انو يلجا للاسلوب دا عشان حل مشاكله والخيبه التقيله انهم بيقولو مش مشاكل دي فضايح في بعض الاحيان واللي اختشو ماتو"
