subject = "يادى اسامه منير"
author = "نيفين"
posted = "2006-02-14"
text = "و الله موضوع اسامه منير دا قتل بحثا<br />اللى عايز يسمعه يسمعه و اللى مش عايز براحته<br />انا شخصيا ساعات كتير بسمعه حسب المود و الظروف<br />قاعد تفكرنا بحاجات حلوه يا اكرم<br />فكرتنا بقصيده بيقيس شكرا لكم و فكرتنا بحاجات عمرو القديمه التحفه زى ذكريات بس انا برشح للناس النهارده ف عيد الحب فيروز طبعا<br />مثلا اغنيه انا لحبيبى<br />اسمعوها و مش هتندمو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113642/http://www.20at.com/article2.php?sid=439"

