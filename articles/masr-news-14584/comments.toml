posted = "2009-12-25"
text = "اعلنت منظمات اوروبية مقاطعتها للسياحة فى مصر والدعوة الى مقاطعة المنتجات المصرية بسبب حصار وتجويع غزة وبناء حائط مبارك الفولاذى العظيم لمحاصرة مليون ونصف فلسطينى<br />الخبر نشرتة جريدة الشروق<br />وطبعا الحكومة المصرية لازم تتراجع ويطلع تصريح زى دة<br />واضح ان السياسة المصرية بتهبل اليومين دول<br />وهناك شحن للراى العامى العربى ضد المصريين بسبب الحائط الفولاذى ومن الممكن ان يتاثر العاملين المصريين بالخارج فى الدول العربية"
archived = "2009-12-26"
