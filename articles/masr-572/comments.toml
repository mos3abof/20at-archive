[[comments]]
order = 7
subject = "حرب 48"
author = "miro salah"
posted = "2006-06-27"
text = "بصراحه انا فكرت في حاجات كتير بس أول حاجه خطرت علي بالي اني اكون سنه 48 بالتحديد عشان أمنع بأي شكل صفقه الاسلحه الفاسده اللي أدت لهزيمه الوطن العربي وعلي فكره لو كان العرب انتصروا في حرب 48 كان اتغير مجري التاريخ تماما ومكانتش اسرائيل تقدر تتحكم فينا ولا حصلت حرب 73 وكان جالنا ناس مخلصه تحكم البلد وقامت دوله اسلاميه ومكانش فيه موقع اسمه عشرينات لانه مكانش هيلاقي حاجه يكتبها لان البلد كانت هتبقي في أحسن حال"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628194819/http://masr.20at.com:80/article.php?sid=572"

[[comments]]
order = 8
subject = "زمن صلاح الدين"
author = "A"
posted = "2006-06-27"
text = "فكرة رائعة وأسلوب تناول متميز لكن يفتقر إلي تعدد الآراء نوعا ما بالإضافة إلي وجود فقرة غير مترابطة منطقيا هي التالية:<br />حلم الوجود في زمن الرسول موجود عند الكبير قبل الصغير في مجتمعاتنا، والسبب هو إننا أصلا فاقدين القدرة على التغيير، وحتى لو عندنا قدرة.. تلاقينا فاقدين الثقة في قدرتنا.. على العموم ده مش رأيي لوحدي.. ده رأي بسام أحمد.. واللي قال ببساطة.. أنا عايز أفضل موجود في زمني.. ولو لقيت شرخ الزمن.. هقفله!<br />حسب الفقرة يفترض ان يكون راي بسام هو انه يريد العيش في زمن الرسول للسبب المذكور وليس انه سيقفل شرخ الزمن.<br />عموما أفضل العيش في زمن صلاح الدين لأن أوضاع الأمة الإسلامية في هذه الفترة كانت شبيهة بأوضاعها الحالية ونجح صلاح الدين في تحقيق حلم الوحدة والنهضة بعد عناء، وددت أن أعيش زمنه بجواره لأستلهم تفاصيل نجاحه وأطبقها علي واقعي المحبط عله يتغير."
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628194819/http://masr.20at.com:80/article.php?sid=572"
