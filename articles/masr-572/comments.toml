[[comments]]
order = 1
subject = "اشرخ الزمن ....ماشرخوش ليه؟؟؟؟"
author = "deroooo"
posted = "2006-06-26"
text = "موضوع مترقع يا اميرة وزى العسل؟؟؟<br />بس بجد سؤال حلو اوى..طول عمرنا بنتفرج على الافلام الاجنبيه ويجيبولناالات اختراق الزمن وهما بقى بينقلونا على مزاجهم يا ما يودونا للماضى بتاعم اللى هو الكاو بوى!! او زمن مارلين منرو العظيمة!! ...او يا اما بقى يخدونا لمستقبلهم اللى شافيين انه فيه انهم هايبقوا اسياد الكون ده وان هما اللى هاينقذوا العالم من كل حاجه وانهم تقريبا اللى عايشين لوحدهم على كوكب الارض !!..حاجه غريبه والله... ما علينا نخلينا فى موضوعنا انا شايفه بقى انه كل واحد فينا فعلا ممكن يكون له راى فى حكاية الزمن والتاريخ ده ..انا عن نفسى نفسى اقعد ادخل واخرج فى التاريخ زى منا عايزة وكل ماتحصل حاجه وحشه التاريخ بيذكرها لينا كمسلمين او عرب او مصريين اروح للزمن ده واغيرها وامسحها على طول وكأن شيئاً لم يكن ..والله ياريت تبقى حاجه جميله اوى ..واخدها بالمرة قياسه معجبنيش الزمن ده اغير ..يا سلااااااام ياريت بجد"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628194819/http://masr.20at.com:80/article.php?sid=572"

