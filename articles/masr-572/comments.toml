[[comments]]
order = 3
subject = "انا لختلف تماما"
author = "اسماء"
posted = "2006-06-26"
text = "انا راى مختلف تماما حيث اننى اختار هذا الزمن الذى ولدت فيه وراضيه عنه جدا، مش بس انى عارفه ان ربنا مقسم لكل واحد نصيبه وانه مهما اتظلم من الناس والحكام فهو ياخذ حقه كامل سواء فى الدنيا او فى الاخره،لا كمان ع الرغم من الظلم الى بنشوفه فى كل وقت من كل مسؤول الا ان ربنا بيضع لنا الكثير من الاشياء التى تلهمنا الصبر زى الشباب الذى نراه يبذل كل ما بوسعه ليحسن حال مجتمعه وكذلك محاولات القضاه الان، ع الرغم انى عارفه انهم مش هيخدوا حقهم لكننى اعتقد ان الوقت هيجى الى نعيش فيه فى حياه بجد( كريمه)،اما عمن ياملون لو كانوا موجوديين فى عصر النبى فمن منا لايريد ان يتمتع برؤيه الحبيب(ص)، المشكله بس ان الحياه مكنتش هتبقى حلوه اوى زى مهما متوقعيين لانهم من الممكن ان يكونوا من الكفار،ولو كانوا هيسلموا مع الرسول فلا تنسوا ان الرسول(ص)تعرض لايذاءء شديد جدا جدا جدا فمن الممكن ان يتخلوا عنه فى ذلك الوقت ولا يصبروا مثل ما نحن صبريين الان وختاما ان شاء الله كل المحاولات التى تحدث هذه الايام ستغير وان لم نشهد هذا التغيير فسيشهده غيرنا ولا مانع من ذلك"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628194819/http://masr.20at.com:80/article.php?sid=572"

[[comments]]
order = 4
subject = "مش عارف"
author = "وليد"
posted = "2006-06-27"
text = "أولا السلام عليكم يا شباب.<br />بجد دي أول مرة أدخل الموقع ده و بجد أكثر من رائع .<br />أما لو جينا نقلب التاريخ بصراحة هاكون طماع شوية لأني عايز أكون موجود من بدء الخليقة و للأبد مش علشان أنا باحب الحياة للدرجة دي بس كنت عايز أشوف حاجات كتير و أغير حاجات كتير يعني مثلا كنت هانصح أبونا آدم ميخرجناش من الجنة بدل النار اللي احنا عايشيين فيها حاليا و كنت أشوف الأنبياء بعد أبونا آدم علشان أرسخ إيماني و أساندهم لأنهم قدوة لينا احنا مفتقدينا الوقتي و كنت عايز أشوف الفراعنة و أحافظ على علمهم اللي لو شافوا تخلفناالوقتي كانوا تبرأوا مناو كنت عايز أشوف رسولنا الحبيب و أتعلم يعني ايه قائد و إمام و سياسي و اجتماعي كل ده في شخص واحد و أقول للأجيال اللي تيجي ازاي اجتمعت كل الصفات دي في رجل واحد بدل ما احنا بنشوف قادتناالله يسامحهم على اللي بيعملوه فينا و مفيش حد منهم فيه أي صفة من الصفات دي و كنت عايز أشوف كل الحضارات الأخرى اللي كانت في بدايتها أيام ما كانوا بينقلوا علمهم منا و همه فين الوقتي و احنا فيين و كنت عايز أشوف الثورة المباركة و ضباطها الأشرار معلهش قصدي الأحرار و أنصح كل اللي مشى وراهم و أقول له بلاش دول بيضحكوا علينا و كل كلامهم كذب بس يا خسارة ماكانش حد هيصدقني وقتها و بعدين أشوف زمن السادات و أقابله بس تعرفوا كنت بجد و الله هاحترمه جدا لأنه راجل وطني و مكنتش هاخليهم يغتالوه عارفين ليه مش علشان أنا باحبه قوي لأ ده لأني مكنتش عايز النائب بتاعه يعمل فينا اللي بيعمله ده و كنت هافكره بالآخرة هههههههه ( تصوروا أنا عايز أعيش من أيام أبونا آدم ) و عايز أفكر حبيبنا بالاخرة بس ده مش تناقض لأني كنت عايز كده بس عارف ان فيه آخره بس الظاهر هو ناسي الآخرة دي خالص ."
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628194819/http://masr.20at.com:80/article.php?sid=572"

