[[comments]]
order = 0
subject = "صح بس صعب اوى"
author = "ديمة"
posted = "2006-05-30"
text = "انا معاكم ان الغش حرام طبعاواحساس زفت انك تتعب وتحس انك متمميز جوه اللجنة وبعدين ببساطة تلاقى كتاب مفتوح او ورقة متمررة على اللى قاعدين معاك وتبقول كلكم واحد، بس انا شايفة ان كلام الشيخ صثر عن اى حد فى مكان وغش فى امتحان مرة هو شغل حرام كلام صعب اوى، لأن فعلا ممكن واحد يكون عاقد النية على الغش فى كل حاجة وهو كده انسان فاسد بالفطرة وممكن واحد يكون ذاكر بس ضعف قدام نفسه مرة واخد سؤال من اللى جنبه، والاهم ان اى من الاتنين كان يعرف فى اللحظة دى مايقوله الشيخ انه حتى لو اجتهد فى عمله الجديد فهو حرام عليه، الا يعتبر ائم غير مقصود"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123717/http://www.20at.com/article2.php?sid=876"

[[comments]]
order = 1
subject = "مش عارفه"
author = "مسلمه"
posted = "2006-05-30"
text = "السلام عليكم يااحلى عشرينات<br />انا كمان طالبه فى جامعة القاهره لكنى لا ابيح الغش ابدا<br />الا اذا<br />اه الا اذا كان تذكير بمعلومه ساعات بنكون بس محتاججين للمفتاح بس اول الخيط<br />لكن انام واقول انا هاغش لا حتى ضميرى يا نبنى جامد اوى<br />وكمان البرشام والحاجات دى غلط خالص وكمان لو اتقفشت ممكن يترفد نهائى صاحبها<br />يا عم احنا اهه بنذاكر ونقول يارب<br />يارب انجح انا واخويا وصحباتى كلهم<br />يارب ينجح كل اللى بيتعب وبيذاكر وعايز يتعلم لله<br />يارب ينجح كل المسلمين<br />يالا باى اروح بقى اذاكر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123717/http://www.20at.com/article2.php?sid=876"

[[comments]]
order = 2
subject = "الموضوع بحاجة الى ايمان"
author = "محمد النجداوي"
posted = "2006-05-30"
text = "حتى بستطيع المسلم تخيل انهُ لن يغش في الامتحان فإنه بحاجة الى ايمان صادق.<br />وانا طالب جامعة و الحمد لله ما بغش تحت اي سبب... و هذا يؤدي زيادة الجهد المبذول في الدراسة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123717/http://www.20at.com/article2.php?sid=876"

[[comments]]
order = 3
subject = "فارس النيل"
author = "انا النهارده كان عندى امتحان اكونومى وطبعا مكتبتش ولا كلمه من مجهودى"
posted = "2006-05-30"
text = "ليييييييييه<br />لان التعليم اصلا غلط من اساسه<br />لكن من ناحيه الحكم انا باقر ان الغش حرام طبعا<br />بس هنعمل ايه بقى؟؟<br />الضرورات تبيح المحظورات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123717/http://www.20at.com/article2.php?sid=876"

[[comments]]
order = 4
subject = "الشرع لا يتجزء"
author = "فاطمة"
posted = "2006-05-30"
text = "السلام عليكم ورحمة الله وبركاته:<br />أحبتي في الله إن ما نحن نهدف إليه هو إسلام بدون تزيف،وكيف نكون هذا ونحن نبيح أبسط الأمور وهي الغش،<br />نعم الشرق لا يتجزء،فقد قال رسول الله صلى الله عليه وسلم\"من غشنا فليس منا\"وهذا ما نبتغيه،<br />أرجو منك أخي الطالب أختي الطالبة،وقفة لحظة مع النفس،وتذكري ماذا بعد النجاح والتفوق،الذي بني على الغش سوف تصبح،أو تصبحي طبيب فاشل أو مدرس أو مهندس غير متمكن من مهنتك ألا تدري لماذا لأنها جاءت بالغش فتذكر اليوم الذي تقف فيه أمام مسؤال وأنت صاحب التقدير المرتفع،ولا تستطيع الإجابة أو إثبات الجدارة التي تليق بالتقدير العالي،وتذكر قبل هذا وقفتك أم الله تعالى،أتحب أن يراك الله أم يجعل بينك وبينه حجاب،<br />تذكري وإجتهد،وأعدك إن التفوق شيء سهل وهين ولا يحتاج سوى العمل له بالجد والمذاكرة،<br />يلا نعقد صفقة رابحة مع الله بألا نعود لمثل هذه التجارة الكاسدة مرة أخرى.<br />معلش طولت عليكم بس لأني أحبكم في الله وأخشى عليكم من عذابه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123717/http://www.20at.com/article2.php?sid=876"

[[comments]]
order = 5
subject = "الغش حرام"
author = "مي"
posted = "2006-06-12"
text = "انا من نحيتي بقول ان الغش حرام لان ليه واحد يذاكر طول السنة و يتعب و يبذل مجهود و واحد تاني طول الليل و النهار عمال يلعب و في الاخر يجي يجيب درجة زي اللي ذاكر<br />مش معقول ! انا جبت السنة دي 99 بس في واحدة صحبتي جابت 96 بس المدرس اللي كان و اقف علينا يعتبر غششها كل المتحان انا اتفرست اوي و حتى لو هي مبسوطة بالدرجة دي لازم تعرف ان دة مش بمجهودها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123717/http://www.20at.com/article2.php?sid=876"

[[comments]]
order = 6
subject = "الذى انغش وانحش هو ولى الأمر"
author = "مارك"
posted = "2006-07-14"
text = "قبل ما نقول دا حرام ودا حلال لابد ان نعرف الشئ اولا<br />فما هــو الغش<br />الغش ايها الساده هو افساد الشئ وتقديمه فى غير حقيقته مثلا بوضع الماء على اللبن، او تقديم شئ فاسد انتهت صلاحيته على انه معبأ حديثا وهكذا...........<br />وبالقياس فان ما يحدث فى الأمتحانات ليس غشا على الأطلاق لأن كلنا نعلم ان الطالب يذهب الى المدرسه ليجلس على الدسك( هذا اذا لا قدر الله ووجد دسك يصلح) او اذا وجد الطالب فى الفصل اساسا ولم يترك فى الحوش طوال النهار ثم يعود الى بيته اخر النهار وكنت فى يا شاطر الشطار كنت فى المدرسه وراجع منها زى.....مافيش داعى<br />المهم دا طبعا عشان يروح الدرس او المجموعه اويشترى الملذكرات او..........<br />وبكده يبقى اللى خده الطالب هوه عيـــن الغش ......يبقى لما يجى يقدمه آخر الســنه ما نقلش دا غش ...لأن هوه دا اللى خده الطالب طول السنه فقدمه بدون تغييراو تبديل فى مواصفاته..وييبقى الى اتغش واتحش هوه ولى الأمر الغلبان اللى قطع من جتته عشان المحروس او المحروسه يجوا يمددو جنبه فى البيت....الله يرحم زمان وايام زمان لما كان الأب يسأل ( العيال فين ) يقولوا فى المدرسه --يقول الحمد الله ---النهارده الواحد يقول العيال فين..يقولوا فى المدرسه ..اول كلمه يقولها( الســترمن عندك يارب)<br />حد مكدبنـــى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123717/http://www.20at.com/article2.php?sid=876"

[[comments]]
order = 7
subject = "ماينفعش مكان عب عال"
author = "مارك"
posted = "2006-07-14"
text = "يا ســاده هاتــــــوا<br />- طالب متخرج من كلية الحقوق وخدوه من ايده دخلوه المحكمه بعد التخرج ( يتوه وسط الزحمه) عايز من 5-10 سنين تانيين على الأقل مش عشان يترافع لأ عشان يعرف يروح المحكمه لوحده ليه ميتعلمش شغله ايام الدراسه ؟؟؟؟؟؟<br />- طالب من كلية الزراعه وقولوله ايه اللى مزروع فى الأرض ده يقول على الرز قلقاس ....( كان بيعمل ايه طول الأربع سنين خمس سنين )<br />- طالب من كلية الهندسه متخرج يبنى عماره تقع على راس اللى فيهاتانى يوم<br />طالع من الكليه ليه وهوه مش مهندس ...<br />- طالب متخرج من كلية الطب بعد سبع سنين لوفتح بطن العيان ميعرفش يقفلها تانى رغم الآلات والمعدات الله يرحم ايام ما كان الدكتور يقول للعيان قول اه (ويكتبله الدوا ) ما بيقولوش ليه للعيان دلوقت قول آه!!!!!!!!!!<br />- طالب من كلية التجاره مايعرفش الأصول من الخصوم يقولك الخصوم همه الناس اللى ما بيحبولناش الخير ... اى والله دا اذا كان يعرف يجمع من غيير اله حاسبه او اذا مجمعش الباقى من القروش على الجنيهات<br />- اسمع الراديو كده او التلفزيون حتلاقى من والى - اللى ييجروووووووو وابور زلط مش قادرين يجرو رجليهم.. اما بتاع الدبلوم حسره علينا ياحسره علينا...ريه وسكينه ما يرضوش يشغلوه مكان عــــــب عال....<br />وتقول العيــال بتتتتتتتتغش<br />يقدر ولى امر يعرف ابنه كان فى الجامعه والا لأ ؟؟؟؟ حضر والا محضرش؟؟؟؟؟ طب يتابعه ازاى....فيه كام الف طالب فى المدرجات بيحضرو المحاضره ..يقدر دكتور يعرف دا مين والا دا مين....<br />طب انا راضيكم مين اللى بيغش النهارده ومين اللى بيتغش...قولوا انتوا بقى..مش انتوا اللى عاملين استفتا....والله دا حرام....؟؟؟؟؟؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123717/http://www.20at.com/article2.php?sid=876"
