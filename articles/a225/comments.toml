text = "بلاش والنبي تعليقات على طريقة حلو وننتظر المزيد ، ما هو كل الموضوعات اللي بتنزل في عشرينات حول .. يا رب ينزل موضوع وحش علشان نخلص من المجاملات دي بقى"
