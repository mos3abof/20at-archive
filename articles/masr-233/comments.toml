subject = "من هم القضاة"
author = "محمد محمد محمد"
posted = "2006-05-15"
text = "القضاة هم عمد وقوام اى مجتمع ولذلك ونتجيه طبعيه لذلك يكون السيد رئيس الجمهوريه هو الرئيس الاعلى لنادى القضاه ومن اجل ذلك لايمكن عقل تصور الاعتدات التى تم على خير رجال الدوله (القضاه)"
