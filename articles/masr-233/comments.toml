[[comments]]
order = 20
subject = "القضاة فى المصيدة"
author = "كريم شوقى"
posted = "2006-06-08"
text = "يبدوا ان السادة القضاة قد دخلواالمصيدة ولا حدش سمة عليهم فالمتعارف علية ان من يدخل هذة المصيدة الشريفة يدخل رغما عن انفة وانف واذن وحنجرة الى جا ولا بلاش الطيب احسن اصل احنا بقة عندنا الجبن فى الجينات ولكن يبقى لنا الدرس المستفاد وهو ان القضاة قد عرفوهم على حقيقتهم وهؤلاء قضاة يعنى مش اى حد واذا كان الى بالى بالكوا يقدروا يشتروا مفتى فمن المستحيل ان يكون بوسعهم شراء حميع القضاة ولو امتلكوا كنوز الارض من سرقة نفر نفر فى الشعب الغلبان وربنا يجعل كلمنا خفيف خفيف عليهم لحسن التخمة مدوخاهم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022700/http://masr.20at.com:80/article.php?sid=233"
