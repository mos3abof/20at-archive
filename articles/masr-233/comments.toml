[[comments]]
order = 3
subject = "نحن ليس فى تل ابيب..بل فى قلب اسرائيل"
author = "سمير المصرى"
posted = "2006-04-28"
text = "المشهد يوحى اليك انك فى تل ابيب ..ولكن والله نحن فى مصر اللى كانت مصر والله يرحم شعبك يا مصر ..الشعب النائم على امرة الشعب العبيط< بلظاء العظيم> الشعب اللى نائم فى ثبات عظيم ولا يحرك له ساكن ..انا مش عارف ايه اللى جرى للناس وكائن الحكومه وضعه مخدر فى المياة ..دة انا قولت اذهب الى الازهر يوم الرسوم الموسيئه للرسول الكريم عليه الصلاة والسلام ..وفى الازهر لم اجد حركه واحده اللهم قله هتفت بعض الهتفات الساخنه..ولكن كانت هناك جحافل من الشرطه وكئنهم ريحين يحربو اخوات حسنى مبارك_ اسرئيل طبعا_ حتى الشعب رفض انه يدافع عن دينه ودين امه ودين ابوةةةة..ايه ده احنا عيشين مع مين بلظبط احنا بندافع عن مين عن شويه نائمين ..وعلى راى الشاعر العظيم احمد فؤاد نجم لما قال..ليله فض العتصام..والله مش فرقا معانا ولا هريه بدنا ولا وجعا بضننا..والضرب فينا مقوله والسجن لينا طوله دى عصابه واسمها دوله ...واخيرا الله يرحمك يا شعب مصر اللى مصر اتباعت امام اعين شعبها ولم يتحرك والاسعار بقت نار ولم يتحرك والشرف ينضرب فى اصدق الناس واحكمهم القضاة ولم يتحرك ..متى يتحرك هذا الشعب"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022700/http://masr.20at.com:80/article.php?sid=233"

[[comments]]
order = 4
subject = "ده احسن حل"
author = "سمير المصرى"
posted = "2006-04-28"
text = "ساهموا فى خلع مبارك من الحكم<br />رسالة مفتوحة الى حسنى مبارك<br />السيد/ محمد حسنى مبارك<br />بعد التحية<br />نرجو أن تستقيل أنت و حكومتك فورا و أن تتنازل عن الحكم الى لجنة مؤقتة تتألف من رؤساء الأحزاب و بعض الأعضاء المستقلين بمجلس الشعب لحين تعديل الدستور و اجراء انتخابات حرة مفتوحة يختار الشعب من خلالها رئيس الجمهورية و نائبة و رئيس الوزراء و أعضاء الحكومة<br />و أسباب استقالتك هى<br />أولا: انك تفتقر الى الشرعية فلم تجيء الى الحكم من خلال انتخابات حرة مفتوحة كما أن الظروف التى أدت الى تبؤك السلطة فى البلاد مشكوك بها و مثيرة للجدل<br />ثانيا: انك تخطط لحكم البلاد مدى حياتك عن طريق تزوير ارادة الشعب فى الوقت الذى لا توجد فية وسيلة سلمية متاحة للشعب لتغييرك<br />ثالثا: أنك تخطط لأن تورث الحكم الى نجلك جمال مبارك<br />رابعا: انك خدعت الشعب طيلة 21 عاما باخفائك عنة سببك الحقبقى لعدم تعيين نائبا لرئيس الجمهورية و الذى تبين بأنك كنت تخطط و تعدابنك جمال مبارك ليرث الحكم من بعدك<br />خامسا: انك عرضت أمن البلاد و سلامتها للخطر طيلة فترة حكمك بعدم تعيينك لنائبا لرئيس الجمهورية و كان ذلك بسبب مأرب شخصى لك و هو توريث الحكم لنجلك من بعدك<br />سادسا: انك حكمت البلاد باستخدام أبشع اساليب البطش و التنكيل و الارهاب تحت وطأة و نير الأحكام العرفية و قانون الطوارىء و قوانين و قرارات أخرى كبلت بها الحريات و كممت بواستطها الأفواة بمصر دون مبرر صحيح والتى فرضتها على الأمة لتستعيض بها على انعدام شرعية وجودك و انتهكت بمقتضاها حقوق الانسان و نكلت بخصومك و معارضيك أبشع تنكيلا و هى أفعال مؤثمة و خسيسة أدانتها و<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022700/http://masr.20at.com:80/article.php?sid=233"

