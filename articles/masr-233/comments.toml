[[comments]]
order = 9
subject = "يا اهلينا انضموا لينا"
author = "سمير المصرى"
posted = "2006-04-30"
text = "يوم 11 القادم يوم موقف..يوم حسم ..لابد وان ينضم جميع الناس جميع الشعب امام دار القضاء العالى..لكى يثبت هذا الشعب انه ليس نائم انه صحى من غفوته وله صوت..يسمعه الحاكم والحكومه..انه يوجد لنا صوت ومشاركه اخواننا القضاة الذين يدافعون عن هذا الشعب ..يوم 11 لابد ان يكون يوم مشهود..لا للظلم لا لقانون الطوارىء لا لبيع مصر جهرا امام اعين شعبها لا للتسلط لا للعبوديه لا للحتلال الداخلى ..لا لتصنيع الارهاب..اصح يا شعب مصر وعبر عن رئيك ..كفانا نوم كفانا سلبيه كفانا ياالله نفسى ...ايدك فى اديا نعيش يوم وطنيا..يوم 11 القادم موعدنا اما دار القضاء العالى"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022700/http://masr.20at.com:80/article.php?sid=233"

[[comments]]
order = 10
subject = "عملوها الأسووود"
author = "د.فارس الخياط"
posted = "2006-05-01"
text = "المستشار العظيم والبطل/زكريا عبد العزيز رئيس نادي قضاة المحروسة ومعه كل قضاة مصر الشرفاء وعلي رأسهم المستشارين الجليلين/هشام البسطاويسي و محمود مكي رجعونا تاني لزمن الأبطال اللي تصورنا في يوم من الأيام من شدة الاكتئاب واليأس والحسرة انه مش راجع تاني.<br />كان نفسي كل إنسان يشوفهم وهم خارجين من باب محكمة النقض والله زي الأسوووود ماشيتهم وشجاعتهم تخلي أي إنسان مات من جواه بسبب الحسرة والكمد والعجز والقهر والفقر وكل الأمراض المباركة يرجع تاني يغني ويغني وينطرب قوي وهو بيقول مصر يا ما يا بهية يموا طرحة وجلابية الزمن شاب وأنت شابة هو رايح وأنتي جايه.<br />صحيح يا ولآد علي رأي الشيخ إمام وعمنا أحمد فؤاد نجم هتفضل مصر ولادة وفيها الطلق والعادة برغم القلعة والزنازين وحشود الأمن المركزي وصباح الخير علي الورد اللي فتح في جنايين مصر صباح الخير علي قضاة مصر."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022700/http://masr.20at.com:80/article.php?sid=233"

[[comments]]
order = 11
subject = "أنا عارف السبب"
author = "مصرى"
posted = "2006-05-07"
text = "أنا عارف ليه حسنى مبارك بيعمل كدة فى القضاه علشان دى عقده نفسية عنده بسبب إن ابوه كان حاجب محكمة وكان القاضى بيديله على دماغه لو قال كلمة أكثر من محكممممممممه علشان كده العقدة كبرة وبقت كولكيعة كبيرة قوى ومن يومها وهو بيكره كلية الحقوق زى العما وإبتدأ ينتقم من القضاه وميخليهومش يشرفوا على الإنتخابات بل وخلى كلابه يعتدوا عليهم فى الإنتخابات ثم بعد كده إبتدى ينتقم من الدكتور أيمن نور وبعدين الدكتور نعمان جمعة ثم بعد ذلك الإعتداء على المستشارين وضربهم بالحذاء إللى أولى منهم إن هوه إللى يضرب بيه ولكن أنا لقيت إن الحل إن أحنا نغير الراجل إللى كل مرة بيركب له حته نعل جزمة فى مخه علشان كده مخه طخين قوى وغبى وقلت إننا نوديه المجزر الألى علشان نجيب له إكسسوار لمخه من هناك يمكن يقدر ينسى العقده الكبيرة قوى إللى عنده وما يحاولش إنه يتطاول على أسياده من القضاه والمستشارين ويخليه فى مسح جزم الإمريكان زى الأول أحسن له"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022700/http://masr.20at.com:80/article.php?sid=233"

