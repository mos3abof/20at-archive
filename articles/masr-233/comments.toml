[[comments]]
order = 7
subject = "الى أخى العزيز طووظ"
author = "عابر القارات"
posted = "2006-04-29"
text = "الى أخى طووظ أنتا بتتسأل هل القضاء المصرى بيتسم بالنزاهه؟؟ و أنا أسألك و هل كل الاطباء يحترمون شرف المهنة!! و هل كل المهندسين غير مرتشين و متلاعبين بمهنتهم!! و هل يوجد مهنة لا تجد فيها اللص و تجد فيها الشريف!! أنا معك فى تسائلك و أزيد عليه أننى أعلم بالفعل من بعض معارفى المحامين المرموقين أنه بالفعل يوجد قضاة مرتشين و الحمد لله أنهم بالفعل قلة و ربما أقل نسبةمقارنةبأى مهنة أخرى و لكن لا بد ألا ننسى الاتى و ربما نتسأل أيضا!! ما هى نسبة فساد الحكومة أو بسؤال أخر ما هو نسبة صلاح الحكومة (إن كان هناك ما يمكن أن يطلق عليه صلاح أو عبد الفتاح) أليس من المفترض أن و بإتباع مبدأ \"عدو عدوى هو صديقى\" و للاسف أصبحت السلطة هى عدوتنا اللدود أليس من الاحرى أن نساند القضاه و خصوصا أنهم الفئة الوحيدة التى قالت للحكومة لا بوضوح و وقفت وقفة رجل واحد بإستثناء الفئة الفاسدة منهم شهود الزور و التزوير فى الانتخابات و الذين أزعجهم النور كخفافيش الظلام !! أليس من الاجدر أن نساند كل صوت حر شريف!!"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022700/http://masr.20at.com:80/article.php?sid=233"

