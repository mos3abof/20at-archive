[[comments]]
order = 0
subject = "ليلة من ليالي الاعتصام"
author = "مصرية"
posted = "2006-04-28"
text = "ليلة من ليالي الاعتصام<br />كنت معهم في ذلك المكان ، أتحدث اليهم وأنا لا أعرف عنهم أي شيء ، لا اسم ولا عنوان ، لم يجمعني بهم في تلك اللحظة سوى شعورنا بضرورة مساندة القضاة<br />و مشاركتهم في اعتصامهم حتى ينالوا- استقلالهم الذي هو استقلال لمصر- و ترد كرامتهم . ولا تسألني أية كرامة تلك التي سترد ، بعدما ضرب القاضي - رمز العدل- بالجزمة<br />على دماغه و بالتحديد على جبينه - التي لم يحدث لها في يوم من الايام أن ذلت أو \" طاطت\" لأي كائن كان - تلك الرأس المرفوعة و التي ستظل مرفوعة مهما حاول الظلمة<br />- وأحسب أن جميعنا يعي من هم الظلمة - بوسائلهم القذرة أن يجعلوها خاضعة ذليلة ..<br />كنت معهم مساء يوم الخميس 20/4/2006 قبل سويعات من انقضاض الأمن عليهم , كان عددهم لا يتجاوز العشرين ، ولكني رأيت فيهم و في شجاعتهم شعب مصر كله شعب مصر<br />الذي تمنيت وأتمنى في كل لحظة أن يفيق من سباته العميق و يقول كلمة حق واحدة لوجه الله. لم يقترفوا جرما سوى جلوسهم على الرصيف المقابل لنادي القضاة في عز البرد ،<br />و رفعهم علم مصر و لافتات تعبر عن مساندتهم للقضاة..<br />و هنا أسأل نفسي - علما بأني لست عضوة في أي نشاط سياسي - و أسأل كل من تسول له نفسه بمجرد التفكير \" بفكرة كدة ولا كدة \" لماذا يضحي أي شخص من هؤلاء<br />بنفسه و ينام في العراء؟؟؟ بالتأكيد ليس لأنه ميت في دباديب النوم في الشارع ، ولكنه في الحقيقة -التي شهدتها عيناي و لامستها نفسي- في الحقيقة يفعل كل ذلك لانه ميت<br />في دباديب حد تاني أعظم بكتير ، حد تاني كلنا<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022700/http://masr.20at.com:80/article.php?sid=233"

[[comments]]
order = 1
subject = "أحلى ما فى المشهد"
author = "عابر القارات"
posted = "2006-04-28"
text = "أحلى ما فى المشهد هو الغياب التاااااااااااام للشعب المصرى!!! أنا أعتقد فعلا أن الشعب أصيب بحالة من اللامبالاة الشديــــــــــــــــده جدا و أصبحت كل أماله منحصرة فى أن يشرب نفسين شيشة على القهوة أخر الليل و يتابع مباريات الكرة طول الاسبوع و بس .... الشعب فقد الامل فقد القدوة فقد القائد فقد الطريق تاه و من يجده يرجى الاتصال بأجداده رحمهم الله أحمد عرابى و سعد زغلول القاطنين فى 51 شارع \"المصرى\" - \"مصر القديمة\" أو أن يعيده الى موطنه الاصلى \"المتحف المصرى\" بالتحرير و العاقبة عندكم فى المسرات"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022700/http://masr.20at.com:80/article.php?sid=233"

