[[comments]]
order = 7
subject = "حب لنبي صلى الله عليه وسلم"
author = "حميد راشد سيف الدرعي"
posted = "2006-01-04"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم ورحمة الله وبركاته أيها الأستاذالعظيم عمرو خالدأفشي السلامة للأهلك كيف حالك أيها الأستاذ المشارق والمغارب وستعيش إن شاء الله بعمر طويل على الخير وسنة النبي صلى الله عليه وسلم\" وكلام سيبقى من فمك الراقي في كل مكان من مشارق الأرض ومغاربها عن سيرة النبي صلى الله عليه وسلم\" أناحميدراشد سيف الدرعي أريدك ان تساعدني في أمر والامر كيف لي أن أحافظ على سنة النبي صلى الله عليه وسلم وايضا أن أحافظ على حبه وصلاتي وتسبيحي وتوكل على الله حق التوكل انا بداية الأسبوع أبدا سنة النبي صلى الله عليه وسلم\" ولكن يأتي يوم بعد يوم فتأتي الشهوات في دهني وأتك سنة النبي وعندما اقوم لصلاة واصلي وأنا كسول كيف لي أن أفعل ذلك أيها الأستاذ عمروخالد لقد اعجبني البرنامج على خطى الحبيب ارجوك إدعي لي بالخير وأن يساعدني المولى جل جلا له ويعطني صوت الشيخ عبد الرحمن اليسديس حفظه الله وأن يعطيني العلم مثل ما أعطاك ويجلني أن افعل ثم أقول المقصود من هذا الكلام انا احيانن أقول ملا أفعله أرجوك إني اليك طالب مهما كان الشخص ولو كان الشخص غنيا وله العلم أرجوك هذه مقولة يا حسرة من ليس لديه سيرة النبي صلى الله عليه وسلم\"<br />فإنها سيرة النبي تفتح القلوب وترجو رحمة الله وتجعل العبد يجع لله الواحد الأحد لو سمحت هل لديك فكرة عن هذا الموضوع أيها الأستاذ عمرو خالد غن شاء الله سيكون وسيرة النبي جعلت اللحظة التي كنت اريدها وهي أن أكون من إخونه وأن أكون من أهل القرآن الكريم وان أكون بجوار النبي صلى الله عليه وسلمأرجوك غني أتوسل إليك أن تجد الحل لهذا الموضوع وارجوك إدعي لي بالخير والنجاح في هذه الحياة وانا إبن الشيخ طحنون بن زايد آل نهيان وأفشي السلام إلى عظيم العلماء الدكتور الشيخ عبد الرحمن السديس خاصا وقل له إني أفعل مثلك في التجويد وترتيل القرآن الكريم ودما أسمع له في السيارة وأي مكان وعندما يرى أحد من اصدقائي أو إخواني يقول لي مذا تسمع في المسجل والوكمان أقول لهم إني أسمع أجمل الأصوات صوت عبد الرحمن السديس وأقول لهم أيضا انا السديس هو من فاز في جائزة دبي الدولية للقرآن الكريم وسيبقى إن شاء الله من أحسن الأصوات ايها الاستاذ العظيم عمرو خالد ساعدني على هذا الموضوع في أقرب يوم إني أحبك في الله والعظيم الأساتدة والمعلمين جميعا انت والأستاذ عبدالله إبراهيم السوهاجي فإن سألت عنه فسلم عليه ارجوك واخبره حميد الدرعي يسلم عليك غنه يسكن في مصر والمنطقة السوهاجي سا عطيك رقمه002045779 هذا رقم مصر فسلم علي ا فقل له إني أحبك في الله يا أستاذي أستاذي عمرو خالد غني أهنئك الحج حجا مبرورا وسعيا مشكورا وذنبا مغفورا إن شاء الله وأهنئك بالعيد الأضحى المبارك كل عام وأنتم يا أهل مصر بخير ودمتم بخير والسلا عليكم ورحمة الله وبركاته لا إله إلا الله."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143750/http://www.20at.com/article2.php?sid=83"

[[comments]]
order = 8
subject = "عمل للاسلام"
author = "$عاشقة الجنة$"
posted = "2006-01-07"
text = "السلام عليكم ورحمة الله وبركاته جزاك الله كل خير على كل ماتقدمه لنا انشاء الله ستكون من اهل جنات الفردوس الاعلى فمن يخبر اية من ايات الله اية واحدة يدعو له كل الكون من مخلوقات في داخل الارض وفي البحار والمحيطات من اسماك و حيتان و... ونمل ونحل وووووو....<br />فما بالكم من يدعو و يخبر ايات ويدعو الناس باسلوب حسن انا شخصيا لقرد تغيرت وغيرت حياتي بعد برنامج على خطى الحبيب 360 درجة واصبحت اخطط لحياتي تخطيطات واحلام اكبر مني وفي الحقيقة لا يوجد شي مستحيل الا يستحق الاسلام ان نفعل شي من اجله لقدتعب رسول الله احسن خلق الله وامهات المؤمنين و الصحابة الايستق الاسلام ان نفعل ولو بشي بسيط فانا شخصيا قررت ان اعيد دراسة الثانوية بعد حصولي علىشهادة معهد فنون متوسط وبتقدير جيد جدا و كنت من الاوائل فقررت بعدهزا البرنامج الرائع ان اطور من نفسي وادرس جامعة في المجال الذي احب هندسة ديكوروادرس دراسات عليا ثم ادرس دراسات اسلامية واعرف للعالم الغربيو العربي ما هو الاسلام ثم علم تغزية واعرف للناس ماهو الغذاء من القران فالقران بحر من العلوم بس لو نركز فيه قليلا ثم تصميم ازياء للمحجبات والتي ليست متحبة ستتحجب من بعدها ثم اقيم مركز متكامل في هذه المجالات وغيرها وعندي احساس ويقين بان الله سيوفقني في ان اعمل نهضة واصلح في الارض واعمرها واكون قدوة لامهات المؤمنين وخاصة امنا خديجةهل اذا عملت كل هذا ساكون متميزة ويختارني الرسول ويكون راضي عني بعد الله سبحانه وتعالى اللهم امين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143750/http://www.20at.com/article2.php?sid=83"

