subject = "تعليم الغرب"
author = "اختك في الله"
posted = "2006-02-05"
text = "استاذي الفاضل عمر خالد ارجو منك نبذة عن حبيبنا ورسولنا الكريم محمدصلى الله عليه وسلم باللغة الانجليزية حتى استطيع ان ارسلهالاي شخص اجنبي لكي يعلموا بأن رسولنا الكريم هو رحمة للعالمين ومعلم البشريه وانه الصادق الامين وخاتم الانبياء والمرسلين واحب خلق الله ممكن ذلك استاذي سوف انتظر رسالتك لي عن هذا الموضوع. لاني للأسف لا اجيد اللغة الانجليزيه ولكن عندما ترسل لي نبذة عن حياة رسولنا الكريم سوف اعمل على ارسالها الى الاجانب بواسطة الشات ان شاء الله ولك جزاك الله الف خير عن رسولنا الكريم.<br />اختك في الله"
