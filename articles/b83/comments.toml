text = "السلام عليكم ورحمة الله وبركاته<br />والصلاة والسلام على رسول الله صلى الله عليه وسلم<br />عندي سؤال لاستاذي المحترم:<br />كيف اخدم ديني الاسلامي في ظهور هذه التطورات التكنلوجيه ؟<br />والحمدلله رب العالمين<br />والسلام عليكم ورحمة الله وبركاته"
