[[comments]]
order = 26
subject = "بارك الله فيك"
author = "محمد محمود احمد فتح الله"
posted = "2006-07-05"
text = "انا اشكرك جداًكثير يا استاذ عمرو خالد على هذا البرنامج الرائع الطيب والله العظيم انا لما كنت بقرا السيرة النبوية في الكتب ما كنت افهم شي ولما سمعت البرنامج على خطى الحبيب والله فهمت كل حاجه بارك الله فيك يا استاذ عمرو خالد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143750/http://www.20at.com/article2.php?sid=83"

