subject = "طلب الانضمام الي فرقة صناع الحياة بالمغرب"
author = "حسناء"
posted = "2005-12-14"
text = "السلام عليكم ورحمة الله تعالي وبركاته<br />في الحقيقة انا بحمد ربنا اني اخيرا عترت علي موقع يعرفني ان هناك فرقة صناع الحياة بالمغرب واتمني منكم ان تستقبلوني عندكم فاننا اتمني من الله ان يساعدني من خلالكم علي فعل الخير للناس ولبلادي فارجو مكنم ان تقبل طلبي هدا ولكم مني جزيل الشكر وانا في انتضار ردكم علي والله المستعان"
