author = "نسيم"
posted = "2006-04-13"
text = "بسم الله و الاستعانة بالله و لا الله الا الله .<br />ان الله لا يبدل ما بدي قوم حتى يغير ما بانفسهم.<br />شكرا لكم على افاداتكم القيمة اساتدتي .<br />بعون الله ثم عونكم تمكنة من تسطير اهدفي و التمكن من اضهار النجاح.<br />اليوم عمري 26 سنة و اسكن الجزائر .<br />لكن احتاج الى الزواج .. فهل تساعدوني على العيش مع زوجة مسلمة.<br />و الله لا يضيع اجر المحسنين.<br />و الصلاة و السلام على حبيبي رسل الله ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143750/http://www.20at.com/article2.php?sid=83"

[[comments]]
order = 21
subject = "على خطى الحبيب"
author = "فاتحة ///// المغرب"
posted = "2006-04-21"
text = "السلام عليكم ورحمة الله وبركاته وصلى الله وسلم على الرحمة المهداة عليه الصلاة والسلام. صراحة ما اضن ان برنامجا كهدا في حاجة لتعليق لانه فوق كل تعليق يكفي انه يحكي عن حبيبنا وسيدنا محمد عليه وعلى اله الصلاة والسلام.والاجدر اتباعه واتباع خطاه وسيرته. وانا فعلا اتساءل ما الدي سيقدمه لنا الاستاد عمرو خالد رمضان القادم انشاء الله ؟ مادا بعد السيرة العطرة ؟ مادا بعد الرحيق المختوم؟ الا الله سبحانه وتعالى...وفقك الله ياأستاد عمرو والهمك السداد وحسن الاختياروالله ندعو لك ولامثالك من الدعاة من قلوبناان يجازيكم الله خيرا عنا وعن الاسلام. وناسف جدا لما نراه هده الايام في وسط الدعاه من اختلافات سلبية وفتن واللهم قنا شر الفتنة ولاتحعل الهم مصيبتنا في ديننا امين.<br />وأخير احب ان ابلغك تحيات الصغير عمر (خمس سنوات) هو على فكرة يحبك بشكل عجيب مند ان كان ابن 6شهور...وكلنا نحبكم في الله.<br />والسلام عليكم ورحمة الله وبركاته وصلي اللهم وسلم وبارك على سيدنا ومعلمنا وشفيعنا محمد عليه الصلاة والسلام وارزقنا اللهم الحياة على خطى الحبيب... امين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143750/http://www.20at.com/article2.php?sid=83"

