subject = "السيرة العطرة"
author = "mareia"
posted = "2005-12-20"
text = "اولا اشكر كل من ساهم في تقديم هذه الملحمة الانسانيةو اظهارها بهذه الصورة الرائعةو احب ان اوجه شكر خاص الاستاذ عمرو خالد على مايبذله في سبيل الارشاد و الاصلاح و جزاه الله عنا الف خير و اتمنى ان يصل تعليقي هذا له لانني لم اتمكن من الوصول اليه عبر موقعه الخاص<br />و الحقيقة نحن احوج ما نكون لتتبع سيرة الحبيب بكل تفاصيلها لتنظيم حياتنا لانه القدوة و السراج لنا<br />لقد عشنا لحظات سعيدة و غالية مع هذه السيرة و التي اتمنى ان تطبع على سيديهات و كاسيتات لتتاح لنا بشكل اوسع<br />مع شكري الكبير للاستاذ عمرو و كل من ساهم في اعداد البرنامج و مزيدا من العطاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143750/http://www.20at.com/article2.php?sid=83"

