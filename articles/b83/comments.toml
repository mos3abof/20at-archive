subject = "لا لا ها نة رسولنا الكريم"
author = "التا ئب الى اللـــــــــه"
posted = "2006-02-18"
text = "انى شاب كنت عاصى الى الله واعترف بذنوبى ولكننى تا ئب الى الله وقد حزن قلبى وبكى على اسائة الدنما رك للرسول صلى الله عليه وسلم فقد فعل الرسول من اجل المسلميين الكثير والكثير فى سبيل نصرة ديننا الا سلام ونحن نحترم جميع الرسل ولا نقبل ان يهان الى رسول على الارض وذلك لان ديننا الحكيم امرنا بذلك فنرجو من الدنمارك اومن اى بلد اخرى عدم التعرض والا ساءه للرسل وللمقدسا ت الا سلا ميه لان هذا المساس يغضب محبيين رسول الله ويغضب كافه المسلميين واستغرب على الدنمارك وسؤال يلح بعقلى وهو لماذا تسيئون الى الرسول محمد وانتم لا تعرفون شىء عن سيرته واتمنى ان تحسنو التفكيير ولا تنظرون للمسلميين نظره با نهم ضعفاء لا ن بداخلهم بركان غضب لو تفجر سيحرق من يسىء للاسلام ولرسولنابنيران الغضب وتوبوالى الله فا ن الله يقب التوبه جزاناالله واياكم ووفقنا لما يحبه ويرضى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143750/http://www.20at.com/article2.php?sid=83"

