[[comments]]
order = 24
subject = "شكر لله وتقدير لاستادنا الجليل عمر خالد"
author = "فاطمة الزهراء"
posted = "2006-06-14"
text = "السلام عليكم ورحمة الله وبركاته<br />انا والله العظيم افخر باني مسلمة وان ربنا بعت لنا شخص نحبه كل الحب في الله وهو عمر خالد كما افتخر اني من المغرب ومن هدا المنبر اعرب لكل المسلمين في كل بقاع الدنيا ان المسلمين المغاربة والله يغيرون على الدين ونتمنى ان نصل لاعلى المراتب بديننا وان تصبح كل الدول المسلمة والعربية لحمة واحدة بارك الله فيكم ياصناع الحياة في كل بقاع الدنيا<br />ومعا نصنع الحياة على خطى الحبيب لنلقى الحبيب في جنة الرحمان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143750/http://www.20at.com/article2.php?sid=83"

