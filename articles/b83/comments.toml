text = "بسم الله الرحمان الرحيم اما بعد فالسؤال موجهالى فظيلةالاستاز عمرو خالد يا اخي ويا حبيبي فى الله السؤال لمازا تحلق لحيتك بما انا العلماء استدلوا على انها واجب ومادليلك على زالك وشكرااااااااااااااااواجوا ان يكون الجواب سريعا"
archived = "2006-11-02"
