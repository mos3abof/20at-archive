text = "بسم الله الرحمان الرحيم والحمد لله رب العالمين اما بعد ان رسولنا شهد العالم علي عضمته وحسن اخلاقه فهو النور الدي ارسله الله ليخرج عباده من ظلمات الجاهلية وما ادراك ما ظلمات الجاهلية انعدام الحقوق بانواعهالكن الرسول جاء ليعطية للانسان حقوقه كاملة وعلي اكمل وجه ولكن هل يجوزلهده للانسان ان يتعدي علي اعطاه الحق في البقاء وضمن بقاءه كما انه يومن بالرسل جميعا اكتر منكم لذلك عليكم بردالاعتبار لمن اعطي للانسان حقوقه والله المعين"
