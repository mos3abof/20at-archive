subject = ""
author = "الجهل ثم الجهل"
posted = "2009-12-02"
text = "فى دولة بقى لها 40 سنة بتتكلم عن المثتثمرين<br />فى دولة قيها 200 الف مهندس متخرجين من كلية الهندسة<br />فى دولة فيها 8 الاف مدرسة حكومية و6 الاف مدرسة خاصة<br />وفيها 12 جامعة<br />دولة بكل هذا الحجم تستورد كمامات وكمان كمامات ملوثة<br />تشخروا والا اشخر انا لوحدى<br />هى الكمامة تكنولوجيا معقدة ومحتاجة معامل طاقة ذرية وابحاث معملية وعقلية علمية فذة<br />تستوردوا الكمامة لية<br />لية الحاج عبد الرزاق والحاج مخيمر واخونا جرجس ميعملوش حتة ورشة صغيرة تنتج كمامات مصرية وتكفى البلد<br />هو خلاص احنا وقعنا فى قبضة مافيا الاسيراد والمستوردين وكل حاجة نجيبها من برة<br />وعايزين تطلعوا المونديال<br />على خيبة اهلكم<br />بتستوردوا كمامات ملوثة بالسرطان والبدنجان وتعيطوا زى النسوان<br />اللة يرحمك يا عبد الناصر انت وعزيز صدقى لما قلتم احنا مش هنستورد واللى عايز حاجة يعملها جوة بلدة<br />ادى اخرة الاستيراد والبيزنس"
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204005519/http://www.20at.com:80/masr/hot-topics/14224--qq-.html"

