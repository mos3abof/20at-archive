[[comments]]
order = 3
subject = ""
author = "صحفيين بياكلوا عيش"
posted = "2009-12-06"
text = "انا واحد عايز افهم ايه فايدة الموضوع اللي كاتباه يا اخت دعاء ؟؟ هل انت شايفة ان البرادعي مع كامل تقديرنا ليه يصلح يراس دولة بحجم مصر ؟ خبرته ايه في مصر اصلا؟ يعرف مين فعلا؟<br />بس واضح انك فاهمة و مش عايزة تورطي نفسك في التهليل للبرادعي و لكن جمعتي شوية قصاصات و عملتي موضوع متناسية الهدف منه عشان لقمة العيش و لازم تكتبي .. امال هتقعدي كده اسمك صحفية و مبتعمليش حاجة !!<br />ان كنت تتقي الله في نفسك اكتبي في يومياتك كزوجة فشئون اجتماعية و رحم الله امرئ عرف قدر نفسه"
archived = "2010-01-03"
capture_url = "https://web.archive.org/web/20100103172212/http://www.20at.com:80/masr/hot-topics/14274--qq-qq.html"

[[comments]]
order = 4
subject = ""
author = "متضحكش قوي كده"
posted = "2009-12-06"
text = "لما تعرف تكتب اسم الجلالة صح ابقى اتكلم<br />خلي الشيعة ينفعوك .. الشيعة اللي بيشتغلوا لصالحهم بس مع انهم في دولة اسمها لبنان او العراق .. حلال ليهم يورطوا كل الشعب في حرب هم وحدهم اللي هيفوزوا فيها و كل الشعب يتحمل الخسارة .. و حرام لبلدك انها تحمي حدودها كاجراء مشروع و قانوني حفاظا على سيادتها<br />رغم ان مصر و لا النظام تسبب في الكذب اللي بتردده ، امال حماس جوعت مين وورطت مين هي كمان ؟"
archived = "2010-01-03"
capture_url = "https://web.archive.org/web/20100103172212/http://www.20at.com:80/masr/hot-topics/14274--qq-qq.html"

[[comments]]
order = 5
subject = ""
author = "هاها ها ها ها ها"
posted = "2009-12-06"
text = "مين اللى ساعد امريكا فى احتلال العراق - البرادعى والا اللى كان فاتح مطاراتة وقناة السويس للسفن الامريكية<br />مين اللى حاصر غزة وجوعها غير بسلامتة وحزبة وحكومتة<br />ومين اللى بيعادى حزب اللة علشان بيقاوم اسرائيل<br />ومين حبيب اسرائيل فى المنطقة<br />ومين اللى بيدى غاز لاسرائيل ببلاش<br />ما بلاش نفتح المواجع<br />وانتم كلكم خونة لانكم بتدافعوا عن الشيطان<br />نحن مع البرادعى"
archived = "2010-01-03"
capture_url = "https://web.archive.org/web/20100103172212/http://www.20at.com:80/masr/hot-topics/14274--qq-qq.html"

[[comments]]
order = 6
subject = ""
author = "مش هيحصل"
posted = "2009-12-07"
text = "مش هيحصل ان البرادعى او غيرة هيحكم لان الدستور متفصل على مقاس الذرية المباركية - متفصل على مقاس احد اولادة - يبقى كلة عبث<br />طبعا كل واحد بيعمل لمصلحة ذريتة من بعدة<br />وانا ها اورث التوك توك للواد بنطة ابنى وفيش احد هيركبة غيرة"
archived = "2010-01-03"
capture_url = "https://web.archive.org/web/20100103172212/http://www.20at.com:80/masr/hot-topics/14274--qq-qq.html"

[[comments]]
order = 7
subject = ""
author = "ترشيخ البرادعي"
posted = "2009-12-08"
text = "اولا احب اقول اننا شعب مهرج لان اللي حيكسب الانتخابات حسني مبارك لان الحكومة هي اللي حتجري الانتخابات وهي اللي حتفرز الاصوات وهي اللي حتقول النتيجة وهي كل حاجه وهي اللي حتقود الحملات الاعلاميه فكل دا تهريج وصرف فلوس كان يجب ان تصرف على المرضى والايتام في مصر زي تماما الفلوس اللي بتتصرف على المنتخب كان الاولى بها الايتام والمرضى<br />ثانيا الحكومة هي اللي امرت بترشيح البرادعي علشان خاطر ترفع من شانها لما حسني مبارك او جمال مبارك يهزم البرادعي يعني عملية نصب عايزه تثبت ان حسني مبارك حيهزم شخصية كبيرة اوي عالميه<br />وخلي الحكومة كده تلعب بفلوس الايتام ومرضى الفشل الكلوي والسرطان<br />العبي يا حكومة واعملي انتخابات يا حكومة وضيعي وقت وفلوس الشعب<br />ولذلك ارجو من كل افراد الشعب مقاطعة هذا التهريج ولا احد يذهب الى اي انتخابات لا مجلس شعب ولا رئاسية"
archived = "2010-01-03"
capture_url = "https://web.archive.org/web/20100103172212/http://www.20at.com:80/masr/hot-topics/14274--qq-qq.html"

