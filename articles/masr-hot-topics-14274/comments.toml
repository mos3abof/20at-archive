[[comments]]
order = 0
subject = ""
author = "حدودة"
posted = "2009-12-06"
text = "انت عارف لو طلع نظيف باشا وقال انا هرشح نفسى هيدولوا بالجزمة<br />و هيطلعوا فيه العبر على الرغم من انه دلوقتى الرجل المدلل و الابن الفاضل<br />لا وكمان الاخوان غير شرعيين انا مش هدافع عنهم بس انتوا مش شيفين غير شرعيين<br />جمده شويه انا عاوز اعرف مين اللى شرعى فى البلاد كلها اظاهر انكم نسيتوا اننا فى مجتمع علمانى لا يمت للدين او للشرع بصله فكله عكس الدين واتجاهاته عكس اتجاه الدين بل بيحارب الدين و فى واحد امريكى قلها لما واحد مسلم قتل 14 جندى امريكى قال الخوف من المؤمنين وليس المسلمين<br />ااااااه و الله قلها كده بالفم المليااااااااان انت عارف ده معناه ايه انهم عوزنا نبقى مسلمين منعرفش حاجة فى ديننا<br />بص اللى هيجى بفكر بعيد عن الدين قريب لليهود والامركان هو ده رئيس مصر القادم هى دى الحقيقة المره اللى محدش عاوز يصدقها لا ويطلعوا يتكلموا على الوطنيه و العروبه وطنية ايه وعروبة ايه<br />هسألكم سؤال من يوم ما اكبر واحد عايش فى العالم الوطنى او العربى اخد منهم ايه؟؟؟!!!<br />ولا حاجة صح قول صح علشان مفيش إجابة تانية<br />تيجى نغير السؤااااال<br />الاسلااااام عمل ايه عندما كان فى مجده وعزة؟؟؟<br />اسبكم تجوبوا<br />سلام"
archived = "2010-01-03"
capture_url = "https://web.archive.org/web/20100103172212/http://www.20at.com:80/masr/hot-topics/14274--qq-qq.html"

[[comments]]
order = 1
subject = ""
author = "عشرينى"
posted = "2009-12-06"
text = "اقتباس جيمي:<br />هما دول أساساً كتاب حد بيحترمهم فى مصر كلها .<br />دول من نوعية الكتاب الى بتكتب من أجل المادة وينتهجون ثقافة الوصولية ، ولا يعلمون شيئاً عن الكتابة لأجل مبادئ وأهداف وأفكار هادفة تبث عبر مقالاتهم للقراء .<br />دول كتاب لا يؤخذ بكلامهم، والحمد لله أنا مش بنفع الصحف الحكومية بشلن ولا حتى المعارضة غير المحترمة<br />وانت مالك انت يامحمد ياجمال انت صحفى يعنى علشان ترد على اساتذة اكبر منك بالطريقة دى روح ناك"
archived = "2010-01-03"
capture_url = "https://web.archive.org/web/20100103172212/http://www.20at.com:80/masr/hot-topics/14274--qq-qq.html"

