text = "اقتباس صحفيين بياكلوا عيش:<br />انا واحد عايز افهم ايه فايدة الموضوع اللي كاتباه يا اخت دعاء ؟؟ هل انت شايفة ان البرادعي مع كامل تقديرنا ليه يصلح يراس دولة بحجم مصر ؟ خبرته ايه في مصر اصلا؟ يعرف مين فعلا؟<br />بس واضح انك فاهمة و مش عايزة تورطي نفسك في التهليل للبرادعي و لكن جمعتي شوية قصاصات و عملتي موضوع متناسية الهدف منه عشان لقمة العيش و لازم تكتبي .. امال هتقعدي كده اسمك صحفية و مبتعمليش حاجة !!<br />ان كنت تتقي الله في نفسك اكتبي في يومياتك كزوجة فشئون اجتماعية و رحم الله امرئ عرف قدر نفسه<br />صحافيين بياكلوا عيش ولا بياكلوا بطاطس<br />ممكن تقولنا انت بتشتغل ايه وبتاكل عيش ولا بتاكل جاتوه"
