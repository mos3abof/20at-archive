posted = "2009-12-28"
text = "تغير الحكم فى مصر من نظام عسكرى الى مدنى اى مبارك الى البرادعى او اى انسان شريف لن يحل مشكله النظام الحاكم فى مصر ليس مبارك وحده فى سده الحكم وانتم تعلمون جيدا من هم حكامها وايضا المواطن البسيط يعلم من هم وكيف لايعرف وهم يسلطون سياط العذاب عليه ويعرف سبيل النجاه لا اله الا الله محمد رسول الله ان فرعون وهمان وحنودهما كانوا خاطيئن وتعرفون الخاطئ هو الذى يخطئ بقصد لا يخشون الله ولا يقيمون حدوده ولا يامرؤ بالعدل وكان الشعب هو الضحيه يارب الحاكم الى ياتئ ليس البرداعى ولا مبارك ولا حول ولا قوه الا بالله"
archived = "2010-01-03"
capture_url = "https://web.archive.org/web/20100103172212/http://www.20at.com:80/masr/hot-topics/14274--qq-qq.html"

