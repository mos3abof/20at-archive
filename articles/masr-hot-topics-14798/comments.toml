[[comments]]
order = 3
subject = ""
author = "منى أبوالحسن"
posted = "2010-01-11"
text = "يبدو اننا اعتدنا شتيمة الحكومة بصرف النظر عن اختلاف المواقف.. زي ما اعتدنا أشياء كثيرة ليس لها ما يبررها في أحيان كثيرة..<br />اللي أفهمه ان مصر هي البوابة اللي من خلالها بتدخل سواء من فوق الأرض أو من تحت الأرض كل ما يمد غزة بأساسيات الحياة طول عمرها.. بالتأكيد مش اليهود همه اللي بيمدوها باللي مخليها عايشة لحد النهاردة تحت الحصار الإسرائيلي المستمر.. دي نقطة<br />النقطة التانية، انه برضه اللي أفهمه ان اللي يحتاج بيتي علشان يعدي من خلاله لمصلحة له، يبقى لازم يحترم صاحب البيت وأحقيته في معرفة وترتيب كل شيء للضيف، لكن مش يفرض شروطه ومزاجه عليا وكمان يشهر بيه لما أرفض أسلوبه الوقح ده.. وتوصل الحكاية ان واحد من ولادي كمان يموت بسبب الليلة دي كلها.. ماهو شريان الحياة واحد واتنين دخلوا وخرجوا بدون أي مشاكل ولا حد حس بيهم، وغيرهم آلاف المساعدات المعلنة أو الخفية.. يبقى الهيصة دي كلها على حاجة تانية غير المساعدات بقى!<br />اعقلوها يا بشر!"
archived = "2010-01-14"
capture_url = "https://web.archive.org/web/20100114080236/http://www.20at.com:80/masr/hot-topics/14798-q-.html"

