[[comments]]
order = 1
subject = ""
author = "احسان"
posted = "2010-01-10"
text = "والله يا جالاوي انك من اشرف الناس وعري اكتر من بعض العرب<br />لا تزعل ولا تحزن من الي شفته فهذا زمن العجايب يا صديقي<br />تأتون من اخر الدنيا ومن كل الدنيا ببعض الأمل لأهلنا المحاصرين ونحن -المتحكمين بنا- من يمنعكم من الدخول<br />سبنا الله ونعم الوكيل ماذا بقي ؟! اين الشرفاء !!!!<br />ايها البارك ويا ابا الغائط ويا ابواق الحكومة من ينتهك سيادة مصر ومن ينتهك سيادة الدولة على جزء من ارضها ما يسمى بإسرائيل وليس اهل غزة، من يدخل المخدرات لمصر هي ما يسمى باسرائيل وليس المجاهدون في غزة و قائمة الخطايا تطول كفاكم تسفيها لعقولنا يا خائنين"
archived = "2010-01-14"
capture_url = "https://web.archive.org/web/20100114080236/http://www.20at.com:80/masr/hot-topics/14798-q-.html"

