[[comments]]
order = 1
subject = "نداء الى المرشد العام للاخوان المسلمين"
author = "شعب مصر"
posted = "2007-02-22"
text = "يرجى التكرم بالايعاز لاعضاء مجلس الشعب بتقديم استقالتهم والانسحاب من اي معترك سياسي وتحويل الجماعة الى جماعة للامر بالمعروف والنهي عن المنكر كالجمعية الشرعية وجمعية انصار السنه وخلافه<br />وكفاية سجون<br />كفاية معتقلات<br />كفاية بهدله<br />لان فيه ناس تانية بتنضر غير الاخوان المسلمين في هذه العملية ناس ابرياء ليس لهم اي ذنب.<br />ونحيطم علمًا بأن ما بدأ فيه الرئيس المصري الان حصل لكم<br />ايام الملك فاروق<br />ايام جمال عبدالناصر مرتين<br />ايام السادات<br />وها هو يتكرر بنفس السيناريو ايام حسني مبارك<br />من 60 سنه وما فيش اي نصر تحقق<br />لذا يرجى تنفيذ مطالبنا عاليه"
archived = "2007-02-23"
capture_url = "https://web.archive.org/web/20070223034858/http://masr.20at.com:80/article.php?sid=1627"

[[comments]]
order = 2
subject = "هو فعلاً شخصية"
author = "الدكتور عصام العريان شخصية قيادية غير عادية وتحمل الكثير من المعتقلات من أجل مصر ولا يمل المتحدث إليه من حديثة وثقافته ووسع أفقه حفظة الله ورعاه"
posted = "2007-02-22"
text = "لم يكن الإخوان المسلمين فى يوم من الأيام عنيفين ولا وضعوا أحد فى السجون ولا المتعقلات بل هم الذين عانوا من الإعتقال كثيراً من إجل الشعب حفظهم الله ورعاهم من الأذى"
archived = "2007-02-23"
capture_url = "https://web.archive.org/web/20070223034858/http://masr.20at.com:80/article.php?sid=1627"

