subject = "انتوا السبب"
author = "احمد"
posted = "2006-07-02"
text = "صدقوني السنما وراء الفساد اللي موجود في عصرنا هذا يعملك فيلم يعالج قضيه و يبين كل المييقات اللي بتحصل في العالم و يوريك ازاي الواحد ينام مع وحده و ازاي تعاكس وحدة و ازاي تشم و ازاي تصيع و بعد كده يقوللك فساد و يجيبوا الممثلين في التلفزيون و المخرجين يكلموا علي الدين و يعطوا رايهم في قضايا هما السبب فيها مثل ايناس الدغيدي مثلا راعيه الجنس يا ناس حرام عليكوا كفايه نفاق"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705084535/http://masr.20at.com:80/article.php?sid=595"

