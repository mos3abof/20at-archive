[[comments]]
order = 4
subject = "اللى على راسه بطحة"
author = "ابو اسامة"
posted = "2006-07-02"
text = "بقى الأخوة المسئولين سالوا الفنانين عن<br />اذا كانت اسمائهم الى وردت فى الفيلم ولا<br />لأ ما هو اللى على راسه بطحة بيحسس عليها<br />وبالتأكيد دى مش عاوزة سؤال وهما ادرى<br />باللى عملوه ولو على اللى عملوه عاوزله 100فيلم وعلى فكرة مع ان الفيلم بيكشف الفساد الا انه بيساعد على الفساد الأخلاقى<br />ودى احد عيوب السينما المصرية ومش عارف<br />الفساد هنلاحق عليه منين ولامنين الله يكون<br />فى عونك يا بلد.<br />لا...................للفساد<br />لا...................للتوريث<br />لا...................للأنحلال"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705084535/http://masr.20at.com:80/article.php?sid=595"

