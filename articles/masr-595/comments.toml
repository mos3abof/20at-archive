[[comments]]
order = 0
subject = "فسسسسسسسسسس"
author = "عابر القارات"
posted = "2006-07-02"
text = "عمارة يعقوبيان كما قرأت عن الفيلم هو تجسيد للواقع المرير الذى نعيش فيه و مع ما قرأت عن إجادة الفنانين لادوارهم و براعة المؤلف فى تصوير الشخصيات فلى ملحوظه على هذه النوعية من الافلام فبالرغم ان من الظاهر هو تعرية الفساد و المفسدين إلا ان له غرض باطن ألا و هو التنفيث عن الكبت الذى يعيشه المواطن لكى لا يبلغ حد الانفجار و إلا لما كانت سمحت الدولة اصلا بعرض هذا الفيلم و الدليل محاربة جرائد مثل الدستور و صوت الامه و المصرى اليوم و غيرها من وسائل الاعلام التى تنشز عن غناء كورس الحكومة"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705084535/http://masr.20at.com:80/article.php?sid=595"

