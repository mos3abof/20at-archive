subject = "والله زمان يا سلاحى"
author = "zerocall"
posted = "2006-07-02"
text = "على ما اعتقد ان الاستاذ عادل امام كان يقصد ان الاقبال من الجمهور مش عشان انه فن جميل وبس انا اعتقد ان الاقبال ده بتلاقيه فى برنامج اختراق وبرامج الصحفى المختفى من شاشة التليفزيون المصرى حمدى قنديل او اى برنامج يوجه نقض وهجوم على الحكومة المصرية يعنى من الاخر حاجة تشفى الغل اللى جوانا كلنا يا مصريين من حال البلد من الاخر اضعف الايمان نلاقى حد يتكلم بلسانة حتى لو كان على شكل فيلم..مش كده ولا ايه...<br />zerocall"
