order = 0
subject = "سهلة"
author = "سوسة المفروسة"
posted = "2006-03-26"
text = "فى حتت الارض الصحراوية اعمل شارع صغير و ابني فيه قناة تلفزيونية محندقه لم فيها كل الرقاصات و العاريات و مساحين الجوخ و اعملك كام مسلسل على كام اغنية و طلع اشاعة بايخة على نفسك انك ذو ريادة في المنطقة و ان القناة بتاعتك تثبت بالدليل القاطع على تفوقك الثقافي و التاريخي على كل اصحاب الاراضي المجاورة مع ان الحاجه الوحيده اللي بتثبتها هي خيبتك التقيلة<br />اشتريلك مركب محندقه كده و ماتقلقش من مصاريفها (هي اصلا عربيه كارو و احنا قيفناها) و حملها بتاع 100-200 قول 1000 راس ولو غرقت باللي فيها ماتقلقش (ما هي باسم واحد تاني)وساعتها ناخد حتة م الارض الزراعية ونعمل عليها ملعب كورة و نعمل دورة بين ابطال الساحات الشعبية عشان الناس تنسى<br />و لو في اي يوم من الايام احتجت فلوس اجر كام بلطجي يترصدوا العربيات الرايحة و الجاية يلموا منهم اتاوات اللي فارق شعره ع الشمال 3 جنيه وع اليمين 6 جنيه و اللي ماعندوش ياخدوا منه 20 جنيه في اطار المشروع الحضاري الذي تقوم به من اجل استيراد تند من الخارج لتحمي بها صلعته من الشمس الحارقة"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170948/http://masr.20at.com:80/article.php?sid=72&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

