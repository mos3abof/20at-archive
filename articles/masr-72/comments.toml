[[comments]]
order = 2
subject = "المستثمر الصغير"
author = "أيمو"
posted = "2006-03-31"
text = "شوف ياسيد<br />الارض الزراعية تأجرها بس مش لمدة طويلة وريعها تستصلح بية الارض الصحراوية طبعا هاتستخدم الترعة فى الرى وبعد ايجار الزراعية ماينتهى تزرعها سيادتك وتبيع الصحراوية لاى مستثمر عربى .. وبعد كدة العائد تنضف بية البحيرة وتعملها مزرعة سمك. والمحجر والمنجم يستحسن تبيعهم للحكومة دلوقتى وتشترى دماغ سعادتك المتكلفة. ودمتم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170948/http://masr.20at.com:80/article.php?sid=72&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
