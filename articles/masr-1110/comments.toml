[[comments]]
order = 4
subject = "شوفوا الواطي حسني .. بقى أضحوكة العالم"
author = "إبن بهية"
posted = "2006-11-01"
text = "الحيوان حسني مش مكفيه هنا رايح يعرنا بره .. في روسيا الصحف كلها بهدلت اللي جابوه ومازالت لليوم التالي على التوالي .. عارفين السبب ؟؟؟ لأن الحمار الواطي إبن الواطي صرح بأنه يطالب الرئيس الروسي بعدم الإنصياع للمطالبين برحيله .. وقال إيه بيطالبه بالبقاء في منصبه .. طبعا الدنيا خربت وبهدلوه الحمار ... الغبي الواطي حسني مبارك فاكر إنه في القاهرة مش في موسكو ... كنت اتوكس واتنيل على عينك وبلاش خبل .. داهية في خلقتك القذرة.<br />مشهد آخر يا شباب من جامعة القاهرة اليوم .. تمنى من الله أن تكون بداية شرارة لثورة شعبية تعم بر مصر كله اللي بقى لا معقول على رأي الأستاذ فهمي هويدي في هذه الصفحة ... الأمن نازل طحن في الطلبة بتوع الإخوان من سبع ساعات ولغاية دلوقت الساعة 12 مساءً ومازال الطحن مستمراً على عهدة برنامج العاشرة مساءً في دريم ، لسة جايبين صور طازه من هناك متصوره بالموبايل لأن الصحافة ممنوعة تدخل بأمر أمن الدولة الحيوان الجبان عميل الأمريكان ...<br />ادعو معايا يا شباب تكون بداية شرارة تولع في البلد كلها وبدال ما ييج الحيوان الواطي حسني مبارك من موسكو يبعتوله عيلته القذرة على هناك ولا يروح على النيجر زي بتاع موريتانيا من شهور ... يا رب ما تكمل 2006 قبل ما نخلص من الواطي حسني مبارك وعصاباته .<br />إبن بهية<br />www.ibnbahya.blogspot.com"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014944/http://masr.20at.com:80/article.php?sid=1110"

[[comments]]
order = 5
subject = "يا رب يا ابن بهية"
author = "مش لازم/ خوفا من امن الدولة"
posted = "2006-11-02"
text = "يا رب يا ابن بهية نخلص من الحيوان دا يا ابن بهية نخلص من البقره الضاحكه (لافاشكري) تصدق بالله يا ابن بهية اول كارثة واجهت حسني مبارك انه طلع شبه البقره الضاحكه بتاعة اعلان لافاشكري والشعب كله فضل يألس عليه دا لو كان راجل محترم وعرف ان البلد بتألس عليه كان ساب البلد ومشي لكن طلع جبله ما عندهوش احساس.<br />وكذب على الشعب كانت ولاية الحكم مرتين بس<br />خلاها مرة واحدة آل يعني الواد عنيه مليانه اوي واهو قاعد للمرة الخامسة.<br />هو راح روسيا والصين لانه فلس خلاص عايز ييضحك على الشعب قال ايه عايز يعمل منطقة صناعية روسية الرئيس الأهبل. خلاص فلس وعايز يشوفله نصبه جديدة على الشعب.<br />تتصور زي ما انت عارف اسرائيل عايزه تلغي معاهدة السلام وترجع تحتل سينا تاني والاقباط عايزين يقسموا مصر دولتين وامريكا عايزه تمنع المعونة عن مصر والبلد في حالة نار والحمار سايب كل ده وعايز يورث ابنه الحكم. ما شفتوش حمار اكبر من كده<br />نصيبنا مع بطل حرب اكتوبر<br />والاغنية اللي موجوده في موضوع روضه اللي الشباب غناها اغنية مهمة جدا تعكس الوضع الاليم والمأساوي اللي البلد وصلت اليه وهو الغاء الزواج او انتهاء الزواج واهي كارثة جديدة اطلت براسها في شوارع وسط البلد شباب وقف مجموعات يتحرش جنسيا بالنساء.<br />والحيوان عايز يورث ابنه<br />ــــــــــــــــــــــــــــــــــــ<br />تصدقوا بالله انا غيرت اسمي المستعار عشرين مرة خوفا من الكلاب المسعورة بتاعة امن الدولة"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014944/http://masr.20at.com:80/article.php?sid=1110"

[[comments]]
order = 6
subject = "الحل هو اكمال مسيرة عمر بن العاص"
author = "ابومحسن"
posted = "2006-11-02"
text = "كل مشاكلنا مرهونة بالعودة الى كتاب الله وسنة رسول الله خلي بالكم ما تضيعوش وقتكوا كتير مفيش غير منهج النبي محمد صلى الله عليه وسلم واكرر النبي محمد صلى الله عليه وسلم كانت بلده اسمها (جزيرة العرب) ويستلزم هنا دراسة احوال اهل الجزيرة العربية قبل البعثة المحمدية (كانوا ناس همج لا ما ضي لهم ولا حاضر ولا مستقبل) وبعث الله فيهم النبي محمد صلى الله عليه وسلم (ويستلزم هنا دراسة السيرة النبوية)<br />وبعد وفاة النبي محمد صلى الله عليه وسلم وانتهاء مهمته العظيمة يستلزم دراسة احوال جزيرة العرب بعد النبي محمد صلى الله عليه وسلم وتاريخ الخلفاء لنرى كيف حول النبي محمد صلى الله عليه وسلم هؤلاء الهمج الى اكبر دولة حضارية عرفها التاريخ وفي اقل من مائة عام وصلت دولتهم الاولى ومن اسبانيا الى الهند.<br />وانا بقول الكلام دا لان واضح ان احوانا نحن الشعب المصري مشابهة لاهوال اهل الجزيرة العربية قبل البعثة المحمدية (احنا المصريين اصبحنا ناس همج لا حاضر لنا ولا مستقبل) ولكن لنا ماضي هو الاسلام يا ريت نرجع لماضينا ونكمل مسيرة عمر بن العاص"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014944/http://masr.20at.com:80/article.php?sid=1110"

