[[comments]]
order = 9
subject = "حسبنا الله ونعم الوكيل"
author = "بحب بلدي"
posted = "2006-11-02"
text = "نفسي في يوم الحكومة تصحي وتوب توبه نصوحه انا مش عارفه هما هيتعظوا امتي كفانا ظلم واسي اقسم ان دموعي سالت علي اولئك الشباب ماذا يفعلون لو فكروا في لحظه ان دول عيالهم واخواتهم وولاد ناس من دمهم وبلدهم مش هيحصل كل ده حرام ......حرام الشباب بيعملوا كده عشان بيحبوا البلد فوق يارئيسي وشيل الغمامه من علي عينك احنا بنحبك وهما بيحبوك ولما بيعملوا كده هما بينصحوك ونبقي عاملين زي النعامه لو مفكر ان ده هيقضي عليهم بالعكس هيزيدوا لحد الانفجار وبكره هنشوف وبرده بحب بلدي ولو شغلت بالخلد عنها لنازعتني في الخلد نفسي"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014944/http://masr.20at.com:80/article.php?sid=1110"

[[comments]]
order = 10
subject = "كانت لنا هناك يوماً ايام"
author = "مواطن مطحون زى كل الشعب"
posted = "2006-11-02"
text = "تقرير جيد يا روضه وواضح ان انتى مهتمة بجامعة حلوان وده حاجه جيده جدا خصوصا ان جامعة حلوان بعيده عن دائرة الاعلام ،، ربنا يوفقيك<br />انا من خريجى جامعة حلوان واشهد هنا للدكتور عبدالحى عبيد انه شخص بغيض جدا ويكره الاسلامين بشكل غير طبيعى واى نشاط يحمل اى طابع اسلامى الدكتور من اشد الاعداء واظن انه اخد المنصب بعد ما تأكد امن الدوله من ولاءه الاعمى لهم وانه مازال عينه على ترقيات جديده فبيكمل فى قمع اى نشاط طلابي<br />وهناك موضوع اخر هام جدا وشائك جدا ياروضه لو قدرتى تعملى فيه تقرير وهو التنصير فى جامعة حلوان فالتنصير هناك قوى جدا جدا وفى مكان فى الجامعة اسمه الكنيسه هتلاقيه عند مدرج اتنين كده وهتلاقيهم بيوزعوا ورق وفى قساوسه وراهبات قاعدين معاهم ولو فاكرة قصة زينب المصرية كانت فى جامعة حلوان بارضو<br />ولو تعملى مقارنه بين تعامل الامن وادارة الجامعة مع التنصير ومع الاسلامين هتلاقيه تعامل غريب جدا يعنى انا شخصيا ايام الجامعة اخدت ورق من بتاع التنصير وكلمت ظابط امن دولة وقلتله الحق اللى بيحصل قالى ونعملة ايه يعنى سيبهم<br />وموضوع القساوسة والرهبان ده عجيب بارضو وطبعا بيمنعوا بتوع التيار انهم يجيبوا شيوخ المسجد مفيش غير شيخ الاوقاف وكان لا يفلح فى اى شيئ ولا حتى انه يأذن للصلاة - كل الكلام ده ايامى طبعا يعنى من 3 سنين كده -"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014944/http://masr.20at.com:80/article.php?sid=1110"

[[comments]]
order = 11
subject = "كلاب الدولة"
author = "رئيس مصر القادم"
posted = "2006-11-02"
text = "هى حكاية حرب وتار بنا وبين الاستعمار<br />اه يا مصر واه يا مصر لسه فيكى كلاب وقصر<br />انهارده مبنى رئيس الجامعة بكرة مبنى الكلب الى بيحكمالكلب الخاين العميل هو والكلاب الى معاه ولاد الكلب الى باعه البلد لليهود والامريكان دلوقتى بيبيعو الشعب بس يا خسارة الشعب مافهوش حاجة تنفع للبيع علشان مش لاقى ياكل<br />بس يا تر رئيس الجامعة رتبته ايه<br />اكيد مش عميد لان كل كلية اقصد كل قسم له عميد اكيد رتيته لوا امن دولة ومتنكر اقصد كلب من كلاب الدولة.كلمة اخيرة<br />يا مبارك لم كلابك بكرة الثورة هتكسر بابك"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014944/http://masr.20at.com:80/article.php?sid=1110"

[[comments]]
order = 12
subject = "تاني"
author = "بدر الراوي"
posted = "2006-11-10"
text = "عايز اسال سؤال صغير .. هوة الموقع دة بتاع اخوان مسلمين ... اصل ملاحظ ان كل الردود تجريح ومحدش رد بعقلانية كلة بيشتم حتي الي رد بهدوء حسيت انة مش مناصف او علي الاصح في الكفة التانية ... يا ريت يكون في ردود مناصفة ويكون في الردود نوع من الادب ... وبلاش ننسي ان رسول الله ما امن بة من امن الا لخلقة وسماحة نفسة .. وتذكرتلك المرأة التي كانت علي غري الاسلام ورفع عنها حملها وسار بجوارها رغم انها طوال الطريق كانت تسبة . .. كامة اخير اغضب ومثلي الكثير عندما اري من ييدافع عن الاسلام هم من يحولوا اغراقة في اليم .. وافضل ما سمعتة من رجل قال عندما اجد ظالم لا ادعو علية بل ادعي لة بالهداية"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014944/http://masr.20at.com:80/article.php?sid=1110"

[[comments]]
order = 13
subject = "روضه عبد الحميد"
author = "معاك حق اخ بدر الراوى"
posted = "2006-11-11"
text = "للاسف دة مش بيسىء للاخوان المسلمين فحسب وانما للمسلمين ككل؛<br />لانه ليس المؤمن بلعان ولا فاحش ولا بذىء ؛ولكنهم للاسف يخالفون ذلك كله.<br />النقطه الثانيه التى اختلف معاك فيها هو من ادعى ان الموقع روادة هم من اخوان فحسب؟ اولا موضايع الموقع متنوعه بما يكفى ثم ان منها من يخالف فكر الاخوان اصلا ؛ولكن لانه راى حر يتم نشرة.<br />وليس معنى ان من يعترض ويشجب ويستنكر هم الاخوان ؛الانطباع ذلك جاء سبب خلو ساحات الاحداث الا منهم ؛ولكن مؤخرا ظهرت كفايه معهم ."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014944/http://masr.20at.com:80/article.php?sid=1110"
