subject = "بلد اللوبية والفاصوليا والمخلل"
author = "احمد محمد"
posted = "2006-11-02"
text = "ماذا ننتظر من حسني مبارك الرجل الديكتاور والذي يريد ان يورث البلد لابنة ويريد اسكات كل مطالب بالحرية اي كان اتجاهاته سواء اسلامية او غيرة ولكن المشكلة عندهم ان الاخوان قوة كبيرة فى البلد وهم يخافون منها ولذلك يحاربها فى كل مكان المدرسة الجامعه المنزل الشارع اي انتخابات فيها الاخوان تكون مشكلة للنظام الفاسد الذي يخشي انكشاف الحقيقة للناس لمعرفة اخطائهم وسرقة اموال الدولة"
