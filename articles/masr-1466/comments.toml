subject = "قصدك شعار الحرمان"
author = "الحكومة مش هنا"
posted = "2007-01-20"
text = "ناس بتستورد وناس بتبيع بالسعر اللى هى عايزاة<br />الحكومة ملهاش دعوة باى حاجة اطلاقا<br />غير دخل قناة السويس وبتصرف منة على الامن المركزى ومباحث امن الدولة والسجون<br />تقاطع اية<br />احنا فى غيبوبة<br />سلم لى على المترو"
archived = "2007-01-21"
