subject = "وبعدين"
author = "انتهت الهوجة وزى اى هوجة"
posted = "2007-01-19"
text = "ومات السادات<br />وطلع الف سادات<br />ومات الميت<br />ولا عزاء للسيدات<br />وكيلو اللحمة بقى بميت جنية<br />طظ فش حرنكش بيقرقش قرقوشة<br />يارب يهنى سعيد بسعيدة"
