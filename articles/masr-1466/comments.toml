[[comments]]
order = 5
subject = "لا للفقر..لاللبطالة..لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-01-21"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو السيلة الوحيدة للتوظيف<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />من الاخر ياناس ده قانون ظالم وسيهدم اركان المجتمع الذي يقوم علي الاستقرار الي مجتمع يقوم علي التعاقد المؤقت ثم الي الشارع انت واسرتك ايه الموظف المسكين."
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121190408/http://masr.20at.com:80/article.php?sid=1466"

[[comments]]
order = 6
subject = "يا عيني عليك يامصر .. احنا غلابة قوي"
author = "الامير الوحيد"
posted = "2007-01-21"
text = "هانفضل تعبانين كده كتير ؟؟؟؟ يعني مافيش فايدة زي ما عمنا سعد باشا قال من زمان ؟<br />الغلا في كل حاجة .. والكراسي واللي فوقها لا تتغير ..بل بتزيد جشع وسرقة ونهب وعلى أعلى المستويات .. أقول على اعلي المستويات .. طبعاً عارفين المقصود ايه .. طيب والحل ؟ نروح بلد تانية .. نسيب كل حاجة لهم .. طبعاً لا .. طيب ايه الحل ؟انا لا اعرف .. لكن الناس قريباً هاتجد الحل من نفسها ..وهايكون مش انتفاضة حرامية مثل اللي قبله ماقال .. ولكن ............."
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121190408/http://masr.20at.com:80/article.php?sid=1466"
