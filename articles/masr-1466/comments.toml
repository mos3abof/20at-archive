subject = "ايد على ايد تسقف"
author = "جمال الجزار"
posted = "2007-01-19"
text = "قبل ما نسخن الشعب على اشياء يجب عدم العبث بها 00 يجب ان نتحرى الدقة فالششعب يريد حياة مرفهة بدون ان يكد لذا يجب ان نحيى اولا شعار المقاطعة للسلع الت زاد سعرها عن الحد المسموح بدلا من نلقى بكل التهم على الحكومة 00 هى الحكومة هتعمل اية ولا اية<br />الرحمة ياشعب ابدأ بنفسك اولا ثم حاسب الحكومة فلنحيى معا شعار المقاطعة"
