[[comments]]
order = 0
subject = "أحمد"
text = "\"استمتعنا بيوم ميلادنا، وأرضينا ربنا، ورددنا على المتشددين عملياً لا نظرياً\"..<br />خاتمة جيدة جدا لموضوعك<br />لكن بداية الموضوع لا تتحقق للجميع على السواء قليلين من يقضون ايام ميلادهم بين باقات الورد ومكالمات الأصدقاء، شخصيا اقضيه بين اكوام الورق ومكالمات التليفون لا للتهنئة بدر ما هي للعمل<br />لكن إلى الأمام موضوعاتك جيدة في المعالجة وتدعو دائما لأمل وجديد ومفيد"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035914/http://www.20at.com:80/article.php?sid=222"

[[comments]]
order = 1
subject = "راسكولينكوف"
text = "لا اعرف من اين يتحفنا الشيخ ابن باز بهذه الآراء الغريبة التي لا علاقة لها بروح الدينومن الرائع ان يوضح الموضوع الآراء الاخرى في هذا الموضوع للشيوخ المستنيرين<br />وكالعادة موضوعاتك لذيذة وبتثير زوايا مختلفة حتى لو كان الموضوع في الاصل تقليدي"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035914/http://www.20at.com:80/article.php?sid=222"

[[comments]]
order = 2
subject = "دكترة بيقوللك إصحي يا بيه"
text = "أنهي روح الإسلام ديه يابني التي تقبل بعادات من بلاد الكفر وتقول من أين يأتي ابن باز بهذه الفتاوي ...<br />أولاً. ابن باز شيخ جليل ولا يمكنك حتي بعد مائة عام أن تكون واحد في المائة من علمه<br />. ثانياً .قال رسول الله صلي الله عليه وسلم \\\"من أحب قوماً حشر معهم\\\" وقال \\\" من تشبه بقوم حشر معهم\\\" أو كما قال"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035914/http://www.20at.com:80/article.php?sid=222"

[[comments]]
order = 3
subject = "salamaaaaa@hotmail.com"
text = "السلام عليكم ورحمة الله وبركاته نسال الله ان يرزقنا الطموح والهمه العاليه وان يجعل هدفنا رضاه والفوز بالجنه كل انسان يحب مثله الاعلى ويقلدة في كل شيء فلماذا لا نفعل هذا مع النبي صلى الله عليه وسلم ولماذا نحارب اهل العلم الذين شهد لهم معظم الناس بالصلاح وفي النهايه اقول دع ميقول يقول ويوم القيامة تجتمع الخصوم"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035914/http://www.20at.com:80/article.php?sid=222"

