text = "نصيحه<br />اتقى الله فيما تكتبى<br />بتحتفلى برحيل سنة من عمرك وقربك للموت والحساب<br />ومين الشيخ المولوى دة ؟؟ ومين الشيخ جعفر ؟؟<br />عايزة تعرضى مسألة تبقى بدليل قاطع من كتاب وسنة بفهم السلف الصالح مش فلان وفلانة<br />لكن بتتعبى اهواء<br />والشيخ فلان والولى علان دة سبب الضلال والانحراف عن المنهج الصحيح لأهل السنة والجماعه فى الاصل<br />ودة اللى اخبرنا النبى صلى الله علية وسلم انها من اشراط الساعه<br />انا لله وانا الية راجعون<br />جهل بين والاسوأ الجدال بغير علم وتقديم ادلة باطلة لتدعم الباطل<br />الله يهديكى"
