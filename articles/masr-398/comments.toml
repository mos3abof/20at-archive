text = "للتذكرة فقط أن الله لعن ايضا الكاذب والمنافق والمفسدون فى الأرض..أنتم أحقر الكلمات فى قواميس كل لغات الدنيا..لالالالالالالالالالالالالالالالالا لمبارك وسلالته..لالالالالالالالالالالالالالالالالا للفساد لالالالالالالالالالالالالالالا لقانون الطوارىء..ونعم..نعم..نعم..لتعديل الدستور..ربنا يخلصنا منكم .. ونلاقى داهيه ترضى تاخدكم..قولواآآآآآآآآآآآآآمين"
archived = "2006-09-05"
