[[comments]]
order = 3
subject = "مبارك حبيب الملايين"
author = "حمكشة العاطل"
posted = "2006-05-31"
text = "بالاحضان يا مبارك يا حبيبنا<br />يلي كل يوم بتسعدنــــــــا<br />يلي كل الشباب شـــــــغالة<br />يلي عبرت بينا الــــــحاضر<br />وتخطط لينا الـــــــمستقبل<br />كفاية نفاق بقي<br />مبارك يا مجوعنا ومعرينـــا<br />مبارك يلي كلابك بدوس علينـا<br />مبارك يا مسرطن غذائنـــــا<br />مبارك يا سارق فلوسنــــــا<br />مبارك يا مشرد شبابـــــنـا<br />مبارك يا مخصخص بلدنــــــا<br />مع تحيات الشاعر الجميل(حمكشة)"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120113/http://masr.20at.com:80/article.php?sid=398&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

