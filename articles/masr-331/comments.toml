text = "الله ينور عليك يا براء موضوع جميل<br />واضح ان الأخطار التى خطرت على بالك كتير أوى<br />بس كلها متعلقة يا بالوالد أو الوالدة أو رئيسك فى العمل أو رئيسك فى الدولة أو الحكومة .. مفيش حاجة متعلقة بحكومة المستقبل فى البيت ؟<br />ماذا خطر ببالك تجاه خطيبتك ؟ وحياتك الزوجية فى المستقبل؟ قل .. بلاش تتكسف ، وللا خايف؟!"
