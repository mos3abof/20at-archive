[[comments]]
order = 7
subject = "فكرتونا ليه"
author = "مش عيب تقلبوا علينا المواجع"
posted = "2006-05-17"
text = "انا خطر على بالى اسيب بيتنا لانه يتسم بالكائبه<br />وخطر على بالى انى اسيب كليه صحافه واروح اشوف لى حرفه عدله استنفع من وراها<br />وخطر على بالى ان البلد دى مش اسوء من غيرها كله زبااااااااااااله<br />وخطر على بالى لما سمعت ان تركيا الى كانت اسلاميه بقيت علمانيه وبترفض الحجاب انى اروح اولع فيها بجاز وسخ"
archived = "2006-09-04"
