posted = "2006-05-25"
text = "اول ما يختر ببالى الان هو ان اضرب كل عسكرى امن مركزى على قفاة<br />وان اكتف ماما سوزان واطفى فى وجهها اعقاب السجائر<br />وان اعمل فى قناة الجزيرة واشاهد الاستاز محمد حسنين هيكل<br />وان اترك كلية التجارة لالتحق بكلية الاعلام<br />وان اعدم كل اغانى تامر حسنى<br />واهم شيىء خطر على بالى ان اسقى شيخ الازهر سيجارة بانجو وااخذ منه اعترافات عن حقيقة راى الدين فى ما يقولة من فتاوى"
