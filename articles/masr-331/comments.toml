text = "موضوع جميل جداً وكاتب أكتر من رائع وتعليقات تحفه.<br />انا لسه جدسد فى الموقع واول حاجه أقرأها للبراء بس اوعدكوا ان مش أخر مره وانى اتابع على طول .<br />على فكره عنوان التعليق منقول مش انا اللى مألفه ولا حاجه انا يادوب أقرأ بس.<br />أزرع يا بلد البطيخ فى أرضك ..يطلعلى قرع طارح عليمي ..لوكان نيلك يا مصر صلصه..مكنش كفى الكوسه اللى فيكي"
