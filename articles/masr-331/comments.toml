[[comments]]
order = 3
subject = "It is so dangers"
author = "مش شغلك .."
posted = "2006-05-16"
text = "بيخطر عل بالي كلماتك بيخطر علي بالي نظراتك \"\"<br />دي اول حاجه خطرت علي بالي وانا بقره المقال ....<br />ابتدي من التفوله زيك اممممممم<br />خطر عل بالي مره ومش حتتكر ان كل اللي يجيب كحك هو اللي فالح \"عشان طبعا علامه حمرا يعني مميزه \".. جبتها وانا صغننه وكنت فرحاااااااانه<br />خطر علي بالي وانا في الاعدادي ازوغ \"تنح\" من فسحه الصلاه بحجه قال ايه ريحه الشربات معفنه في حين ان انا بقالي شهر مبغيرهاش ؟؟؟ \"متنحش \"..<br />خطر علي بالي في الثانوي امممم ما بلاش الحمد لله عشان الاخطار متكترش خشيت اولي بس وتانيه مع ماما \" مش خوفا من الفتنه لاه بس اصل لسه حلبس واروح المدرسه ..\"<br />الكليه يا اخطار العالم اتحدووووووا ولاه بلاش<br />خلينا في الموقع لما اخش عليه بيخطر علي بالي اني ارجع ..<br />بحس بقرف , بس بحبه عشان بحس ان في ناس صاحيه وبتحب البلد \"ولا للتمديد لا للتوريث...\"<br />..وكمان بحبه عشان سكارلت ,<br />اممممم سكارلت ...لما تخطر علي بالي سكارلت بفتكر نفين طبعا<br />, يا لبني لو جت بت سميها \"فريده \"مش عايزه حظها يبقي وحش زي ,لو جبتي ولد سميه \" سيف \",<br />كان في عصفور قلبه صغير رشيه صغير حلمه يرفف بره السور كان انسان من طير من نور كان بيدور علي يخضر قلب الناس القاسي البور ...دي نوفا .واخيرا كاتب المقال<br />\"براء \" مش عارفه اقول ايه بس لو جت بت سميها \" ابرار \",<br />\"وخطيره انتي عندما تبتسمين \" \"علي راي معرفش مين مش فاكره ....."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904062300/http://masr.20at.com:80/article.php?sid=331"

[[comments]]
order = 4
subject = "رائع كالمعتاد"
author = "ولاء الشملول"
posted = "2006-05-16"
text = "احساسي الصادق بموهبتك الصحفية من اول مو ضوع قرأته لك يا براء لم يكذب...الصحفى الموهوب له شكل مختلف...وانت كذلك...<br />لكن...دعنى اخبرك\"سرا\" مما \"خطر\" على بالي ...خطر على بالي انى ارسل رسائل تهيديد ووعيد بالويل والثبور وعظائم الأمور...لرئيس السابق كى اعكنن عليه عيشته واسود لياليه واوريه النجوم فى عز الظهر!....وخطر ايضاً انى اروح الشغل من غير ما اغسل وشي...وتبقى عينيا حمرا...عشان اوريه العين الحمرا...!<br />لكن اوعدك يا براء انى لما اجى احتفل بنجاحى القادم...سارسل له كارت اعرفه فيها اخبارى السعيدة التى ستحزنه كثيرا!<br />وخطر فى بالى كتيـــــــــــــــــر قبل كده...انى لما اشوف ضابط وحواليه عساكر او امناء شرطة واقفين بعربية البوليس اروح عليهم واسالهم: انتو بتعملوا ايه هنا؟ معاكو بطاقة؟<br />كما خطر فى بالي اني ارسل ايميل لجورج بوش اقول فيه ان رئيسي\"السابق\" هو العقل المدبر لعمليات بن لادن...وان اسامة بن لادن دا الوجه الظاهر للراس الكبيرة..اللى هى المخفى المديــــر..وان الشغل فيه تجارب اسلحة نووية عشان يفجر المكان على خيرة الله...ونتفجر كلنا..!<br />وكفاية اخطار كده....شعان دماغى فيها اخطااار فى اخطااار..."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904062300/http://masr.20at.com:80/article.php?sid=331"

