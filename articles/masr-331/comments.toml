[[comments]]
order = 8
subject = "مش قلتللك اسكارليت مبقتش سكارليت يا مش شغللك"
author = "نيفين..نيفى..نوفا ..اسكارليت"
posted = "2006-05-20"
text = "ااااااااااااه يا مش شغللك<br />فكرتينى ليه<br />على فكره لبنى مجابتش لا سيف و لا فريده جابت مللك يا ستى و بالنسبه لساره بلاش دلوقتى لنعيط يا مش شغللك و منعرفش نقول البقين للبراء(بالحق انا بعتللك ايميل يا مش شغللك)<br />هقوللك ايه انت عارف من غير ما اقول<br />راااااااااااائع يا براء كالعاده<br />و ازا كان على اللى خطر على بالى كتييييييير (واخدالى باللك يا مش شغللك)<br />خطر على بالى كذا مره انى البس ولد و انزل اقعد على القهاوى المنحدره جدا و وسقف و اقول واحد قهوه و صلحو<br />و بيخطر على بالى كتير ابقى ف طليعه المظاهرات(مع الاحترام لمبدا عيش نملع تاكل سكر)<br />بيخطر على بالى كتير افتح الباب على كل مدير و مديره ف شغللى و اقوللهم مع احترامى لحضراتكو وفارق السن انتو مبتفهموش اى حاجه<br />نفسى ابعت جواب لكل مسئول(كبييييييييير)فى البلد دى و اقوله فيه كلمه واحده طز فى حضرتك<br />بيخطر على بالى اخد اول طياره على امريكاو اروحللبت اللى فى بالى(وخدالى باللك يا اللى ف بالى نفسى اشوفك موت)<br />بيخطر على باللى اقف ف التحريرو اقول ربنا على المفترى و المتجبر و الل خد محمد السيد و اللى معاه<br />بيخطر على بالى انزل بليل اروح اللسان فى راس البر و اقعد على الصخور جنب البحر و ارمى الدنيا كلها بالشغل بالمششتيربمشاكلى بمشاكل اصحابى بمشاكل البلدبعشرينات ورا ضهرى<br />ياااااااااه يا براء<br />اقوللك حاجه<br />الموضوع تحفه"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904062300/http://masr.20at.com:80/article.php?sid=331"

