[[comments]]
order = 1
subject = "لذيذه"
author = "طماطم"
posted = "2006-04-01"
text = "والله الحكومه بتاعتنا دى لذيذه اوووووووى بس اللى انا مستغربه منه ازاى بتطلع كده من كل مطب والتانى وبسهوله وبسرعه<br />عن نفسى اتعلم منها بجد عشان انا بقع فى مطبات كتير ومبلاقيش حل<br />وبعدين انا كنت بصراحه متوقعه انهم يقولو ان العباره كان عندها فصام زى بتاع \"بنى مزار\"<br />بس توقعى طلع غلط اصلى خيبة اوووووووى مش زى حكومتنا ربنا يخليها"
archived = "2006-05-25"
