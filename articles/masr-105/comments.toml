text = "يا جماعه انتوا ليه متضايقين ده حتى فيه تقدم واضح في اداء الحكومه ..على الاقل المره دي ماطلعش القبطان مختل عقليا ولا كان عنده انفلونزا الطيور...شايفين الشفافية..شايفين...لو شايفين غمضوا عينيكم ..عيب كده دي برضه بلدكم و مش مفروض تنكشف على حد"
