[[comments]]
order = 3
subject = "الله اكبر"
author = "سعيد احمد"
posted = "2006-04-02"
text = "السلام عليكم<br />انا مش عارف ليش هكد الزعماء العرب مسنهترين في روح النسان اوفي كرامة النسان متعودا ديما يا ناس اني اشهدكم واشهد الله اني بريئ من كل الظلام العرب الزعماء العرب ولله انهم ظلام لما واحد مثل الكذافي بيقتل اربعن شخص عشين بيحتجو على شتم الرسول محمد صلا الله عليه وسلم\"لما واحد مثل البقره الضاحكه حصني مبارك الله لا يبارك فيه الخاين الجابن العبد لشهواتو الكلب لامريكا واسرائيل ايش همي لما يموت كمين مليون واحد من مصر الحيبيب المهم يشبع شهواتو ومحدش يقرب الى شهواتو لما واحد يقرب الى شهواتو هناك يصير قتل وضرب في القنابل ولصوريخ وضرب في الطيران اذا حد قرب الى شهوات اي زعيم عربي ان كان في الاردن او مصر او الكويت او لبيا او في كل دول الوطن الحيبيب الله يوخد كل الزعماء العرب اخد عزيز مقتدر الله يورينا يوم فيهم الخون الجبناء العباد الى شهواتهم وليس عباد الى الله نعم انهم عباد شهواتهم الخون<br />اخيرا الله يرحم جميع اموات هذه السفينة اللهم من منهم مسيئا فتجاوز عن سيئاته ومن كان منهم محسنا فزد باحسانه اللهم ارحم جميع اموات المسلمين واخر دعوانا ان الحمد لله رب العالمين(وصلى اللهم على سيدنا محمد وعلى اله وصحبه اجمعين)وسامحونا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015902/http://masr.20at.com:80/article.php?sid=105&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 4
subject = "الله الله ...الى الامام يانظيف"
author = "sweet_princess"
posted = "2006-04-03"
text = "فعلا يا ابو الكباتن .. انت اثبت انك اسم على مسمى في كل شيئ ..<br />نضفت جيوبنا .. وبيوتنا ..<br />وخليت الحكومه انضف م الصيني .. بس لسه مش عارفين قبل وبعد غسيله ...<br />روح الهي ربنا يخرب بيتك انت وكل اللي سمحوا للحيوان صاحب العباره بالهرب .. وبعدين جايين تتهموا القبطان الغلبان اللي ماحدش عارف عنه اي شيئ لحد الوقتي ..<br />ربنا ينتعنا منكم بالسلامه بقى .. عشان خلاص ..<br />على راي الست فيروز ... الغضب الساطع آت<br />بس يارب ييجي وانا لسه على قيد الحياه واشوف نهاية كل ظالم اخد منصب في البلد دي ونهبها اكتر ماهي منهوبه .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015902/http://masr.20at.com:80/article.php?sid=105&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 5
subject = "الهارب"
author = "نهي أيمن"
posted = "2006-04-03"
text = "نا جالي الشلل خلاص من الحكومة الفقرية بتاعتنا دي، إللي كل واحد فيها يهمل حاجة غلط بس لة ضطر يتسند علية بيكون عندة يقين انة هيهرب من غير أي مشاكل<br />يظهر كدة و الله أعلم انهم بيشربوا الحكومة حاجة أصفرة. و زمان ممدوح إسماعيل قاعد منعد برة و دم الضحايا الغلابة في رقبتة الله يخرب بيت زكريا عزمي إللي هربة برة و يولعوا في نار جهنم همة الجوز !!!"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015902/http://masr.20at.com:80/article.php?sid=105&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 6
subject = "ااااااااااااااااااااه يا بلد"
author = "نيفين"
posted = "2006-04-03"
text = "انا اتكلمت عن دا امبارح قبل عشرينات فى موضوع الكوسه فى بلادى بوصف دا احدث طبخه كوسه ف البلدعلشان اللى معرفش يعرف<br />شيلو الليله للقبطان اللى (مات)و حطو تحت مات 10000000000000000 خط<br />و انا كتبت دا و هكتبه تانى<br />ملحوظه1:ازاى القبطان مبعتش نداء استغاثه اذا كانت النداءات اتلقطت ف موانى اجنبيه<br />ملحوظه2:المركب دى كان قدامها شهر و تتكهن<br />ملحوظه3:على راى عمرو اديب وزير النقل دا هل بينام بليل ضميره مستريح<br />ملحوظه4:و الله يا سويت و لا الف اغنيه للست فيروز تطفى نارنا<br />ملحوظه5:اااااااااااااااااه يا بلد"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015902/http://masr.20at.com:80/article.php?sid=105&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"
