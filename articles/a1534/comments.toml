author = "ولا ايه فرق بين الخلافة و النظام الحالي؟ ساطان يحكم كل الدول الاسلامية و بعد الفنوحات يملك العالم"
text = "بصوا و شوفوا حوايكم هل النظام الحالي قادر يحل و يحكم و يطور و يحسن من البلد و لا ؟ قادر يخلينا مش من العالم الثالث حتقولوا الاتحاد قوة حاقول لما نعرف نتفاهم و نسمع بعض و ده واضح لبين الافراد في بلد ليه الحال بقي لما يكون معاه بلاد تانية و بعدين حكاية الفرب اللي بيتصدي للاسلام ابتدي يعمل كده امتي بعد حادث 11 سبتمبر يبقي مين اللي ابتدي<br />تعلمت أن هناك طريقتان ليكون لديك أعلى مبنى.. إما أن تدمر كل المباني من حولك، أو أن تبني أعلى من غيرك.. اختر دائماً أن تبني أعلى من غيرك"
