[[comments]]
order = 40
subject = "رأي متواضع"
author = "الله بالنسبة لموضوع الخلافة , كل المعلقين تكلموا على شقين ..."
text = "الاول هوالدولة الاسلامية الموحدة , لن أقول عن هذا سوى ان كل الحدود الحالية وضعها الغرب في سايكس بيكو , و اليوم ما يفعله الاستعمار هومحاولات للمزيد من التفتيت كما يحدث في السودان و ربما العراق و ربما لبنان و ....<br />و الثاني هو تطبيق شريعة الله في الحكم...<br />و هذا يمكن تطبيقه سواء في دولة اسلامية موحدة او في كل دولة على حدة , و لكن الواضح جدا ان كل الانظمة العربية الفاسدة تحاربه ( طبيعي ساعتها مش هايبقى فيه قمار ولا خمور و لا ملاهي ليلية ولا ..)<br />و النقطة الاضافية هي نقطة الفتوحات ,<br />و لنتذكر معا ان رسول الله - ص - اول ما بدأ بدأ بأرسال الرسائل الى ملوك الامبراطوريات يدعوهم للاسلام , ولا اعتقد ان التاريخ ذكر ان المسلمين في فتوحاتهم فعلوا مثلما فعل التتار او الصليبيون أو الامريكان أو ...<br />هنا الفرق بين الفتح و الاحتلال , هو رفع راية لا اله الا الله , و ليس علم دولة كذا او الحاكم الفلاني ...<br />و الفتح في حد ذاته هو - كما ادعت امريكا مع العراق - ازالة النظام الغير مسلم و الذي قدصار يحول بين الناس و بين الدخول في الاسلام (ربما اعلامياتشويهيا , و ربما قسريا , و كلاهما موجود حاليا وواضح في العالم كله)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

