text = "الخلافه الاسلاميه الحقه هي خلافه سيدنا عمر رضوان الله عليه ثم يليه عمر بن عبد العزيز - فأذا صلح الخليفه اي عرف العدل وطبقه علي نفسه اولا انصلح كل شيئ في الامه الاسلاميه لان العدل اساس الملك - لو كل حاكم عربي تمثل ولو بخمس عدل هؤلاء الخلفاء لانصلح حالنا - اللهم اصلح حال حكامنا اللهم امين"
