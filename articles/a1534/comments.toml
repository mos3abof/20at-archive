text = "يقول الله تعالى انما المؤمنون اخوة ويقول رسول الله صلى الله عليه وسلم المسلم اخو المسلم و على هذا المبدا ارجو ان يكون حوارنا و ان كان هناك مشاركين من غير المسلمين فنرجو منهم الموضوعية<br />وعشان نسخن ايه رايكم في هذا الحديثا الصحيح<br />(تكن النبوة فيكم ما شاء الله ان تكون ثم تكن فيكم خلافة راشدة ما شاء الله ان تكون ثم يكن فيكم حكما عضودا #جبري او وراثي# ثم تكن فيكم خلافة راشدة ثم سكت) او كما قال"
