subject = "رد على \"لا حول ولا قوة الا بالله\""
author = "ايز تصفي امة الهمج من الي زيي?!"
text = "خطاب ارهابي اصيل يعكس حقيقة امثالكم وما يمكن ان ينتظر البشرية اذا تحكم امثالكم بها فكل من يرد عليكم اعمى وغبي ولا يستحق الرد عليه عموما المراقب لتاريخ البشرية يرى بوضوح ان التطرف والفاشية الى مزبلة التاريخ ولنا عبرة في النازية وعموما انا لن اكتب او ارد على بذاءاتك انت واخوانك المجانين وسايبلكم الموقع تحلموا فيه ببرج ايفل وبيزا وبيج بن"
archived = "2006-11-02"
