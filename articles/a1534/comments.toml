[[comments]]
order = 42
subject = "متى الإسلام في الدنيا يســــــــــــود"
author = "تى الإسلام في الدنيا يســــــــــــود"
text = "قال هرقل وهو على إنطاكية لما قدمت منهزمة الروم:<br />ويلكم أخبروني عن هؤلاء القوم الذين يقاتلونكم... أليسوا بشراً مثلكم؟قالوا بلى. قال فأنتم أكثر أم هم؟ قالوا بل نحن منهم أضعافاً في كل وطن. قال فما بالكم تهزمون؟ فقال شيخ من حكمائهم:( من أجل أنهم يقومون الليل ويصومون النهار ويوفون بالعهد ويأمرون بالمعروف وينهون عن المنكر ويتناصفون بينهم، ومن أجل أننا نشرب الخمر ونزني ونركب الحرام وننقض العهد ونغضب ونظلم ونأمر بالسخط وننهى عما يرضي الله ونفسد في الأرض). فقال هرقل: ( لئن كنت قد صدقتني ليرثن ما تحت قدمي هاتين) ، وهكذا كان...هذه شهادة عدوكم لكم أيها الإخوة بالخيرية، فهلا اشتاقت أنفسكم لأن تكونوا سادة على عرش الوجود.<br />إننا نريد أن تقر أعيننا- ولو للحظات قبل أن نموت- برؤية الخلافة الإسلامية ، ونرى أعلامها ترفرف على المشارق والمغارب ونرى ظلالها الوارفة تملأ الدنيا عدلاً وحقاً ونوراً وهدى.<br />إننا لفي شوق عظيم لذلك اليوم الذي يفتح الله فيه على المسلمين روميه \" روما \" معقل النصرانية في العالم , والتي بشر رسول الله - صلى الله عليه وسلم - بفتحها بعد فتح القسطنطينية , وقد فتح الله القسطنطينية \" استانبول \" على يد الأمير والسلطان العظيم \" محمد الفاتح \" الذي مُدح في الحديث المعروف : ( لتفتحن القسطنطينية , فلنعم الأمير أميرها ولنعم الجيش ذلك الجيش ) وقد كان السلطان الفاتح يتجهز لفتح روميه بعد فتح القسطنطينية , مما جعل أوروبا كلها تعيش في قلق ورعب وفزع دائم , ولم يهدأ لها بال حتى توفي قبل اتمان مشروعه العظيم , وأبلغ دليل على هذا الرعب والهلع الذي أصاب أوروبا هو: أن كنائس أوروبا عامه وروما خاصة ظلت تدق أجراسها لمدة ثلاثة أيام متصلة فرحاً بموت ذلك السلطان المسلم العظيم.<br />ألا فاعلموا أيها المسلمون:<br />أن السبيل لكل هذا العز هو تطبيق شرع الله في ارض الله على عباد الله,<br />أي إقامة ( الخلافة الإسلامية)."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 43
subject = "كلمة من القلب"
author = "أيها المسلم الغيور على دينه وأمته, انظر كيف وصف الله تعالى الأمة الإسلامية بقوله: (كنتم خير أمة أخرجت للناس). وهذا يعني أن الأمة أرادها الله أن تقود الأمم الأخرى, وتحمل لها الرسالة, وتُوجه العالم لتنقله من الظلمات إلى النور."
text = "ولكن نراها اليوم ممزقة مغلوبة ذليلة مقلدة تلهث وراء الأمم الكافرة ألا يؤثر فيك, أيها المسلم, هذا الواقع المخزي, ألا يُحرك فيك شعور المؤمن ونخوة المسلم, لترفض ما أراده لك الكافر, وتسعى لتتبوأ المنزلة التي أرادها الله لك.<br />فانفض عنك أخي المسلم غبار اليأس وثق بأنك إن كنت مع الله كان الله معك: (ولينصرن الله من ينصره).<br />واخلع عنك رداء الأنانية واعلم أن مصلحتك الحقيقية هي التضحية في سبيل الله, ما عندكم ينفذ وما عند الله باق. واقلع عن كل تبعية لاي فكر غير الفكر الإسلامي, وتحدّ أفكار الكفر ولا تسكت.<br />وضع يدك بيد الفئة المؤمنة العاملة المخلصة لإعزاز هذا الدين,<br />فالعمل الفردي لا يُنتج.<br />والعمل لا يكون لأجل العمل فقط, بل لأجل تحقيق غاية واضحة محددة وهي استئناف الحياة الإسلامية من جديد عن طريق إقامة دولة الخلافة الإسلامية فالعمل لها فرض فرضه الله علينا بل هو تاج الفروض."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 44
subject = "اشتقنا الى هذه الوقفات.. وقفات العز"
author = "ان الروم يخوّفون به صبيانهم"
text = "كان البطّال رأس الشجعان والأبطال، وكان من أمراء الشاميين، وطليعة جيش مسلمة بن عبد الملك، وقد أوطأ الروم ذلاً وخوفاً.<br />حكى عن نفسه هذه القصة فقال:<br />اتفق لي أن أتينا قرية ( في بلاد الروم ) لنُغير ، فإذا بيت فيه سراج و صغير يبكي ، فقالت أُمُّه : اسكت أو لأدفعنَّك إلى البطال ، فبكى فأخذته من سريره وقالت : خذه يا بطال ، فقلتُ : هاتِه<br />عبد الرحمن المقدسي<br />بيت المقدس الاسير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"
