[[comments]]
order = 23
subject = "سبحان الله"
author = "ينما نتكلم عن عودة الخلافة تجد كل علماني ينبري في سب الخلافة ويذكرنا دائما بما حدث من أحداث تحدث في الممالك وخاصة لو طال عمرها لأكثر من 1000 عام ثم يأتي لى أي واحد بنظام حكم لم يكن فيه أحداث وخاصة النظام العلماني الحقير - وهذا أقل وصف له- لأنه يدعي الديمقراطية وهو بعيد كل البعد عنها فالنظام العلماني يضمن حرية الكفر لا حرية الرأي وما رأيناه منه في عصرنا الحالي لأكبر دليل على دكتاتوريته والأمثلة كثيرة سأذكر بعضها:"
text = "- حرب الجزائر فقد اختار الجزائريون مرشحيهم الاسلاميين ولكن علمانية الجزائر ألغت الانتخابات بفعل القوة (يعني بالسيف).<br />- منع الحجاب في تونس وتركيا ليه؟؟؟ مش العلمانية تعني الحرية للجميع؟؟ نعم ولكن حرية التبرج وليس حرية الحجاب.<br />- منع الحجاب في مدارس فرنسا مع إنها كما يقولون بلد الحريات فضاقت الحريات على حجاب المسلمات<br />والأمثلة على هذا كثيرة جدا<br />ثم من قال أننا ننشد خلافة مثل خلافة الحجاج أو من شابهه نحن ننشد خلافة صحيحة على نهج السنة النبوية والقرآن الكريم.<br />والأخ الياباني اللي بيقول إن احنا أمة همج<br />والله الامه الهمج هي اللي بتعبد أمبراطورها وهو إنسان مثلهم بياكل ويشرف ويسكر ويتخذوه إلاه والأمة الهمج هي الامة اللي بتعبد الحجارة والحيوانات.<br />أما الأمة التي تعبد الله وتمجده وتنزهه عن النواقص فهي أعظم أمه على وجه الأرض"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

