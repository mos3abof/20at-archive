text = "عموما يبدو ان كلمة الهمج كان لها وقع سئ عليك وأنا قصدتها بمعنى مجازي فأعتذر عن الاساءة وجرح مشاعرك<br />اما بخصوص الادلة فأن كنت لا تستطيع رؤية احوالكم المزرية واستشفاف اي شئ منها فاعتبرني فشلت في ان اخرسك مع اني سعيد بالتسامر معك فلا اخرس الله لك صوتا<br />فوكوياما من بيروت"
