[[comments]]
order = 6
subject = "امة الكرام"
author = "ذا اردت الدليل القوي فانظر الى حالك وحال شعبك وامتك وتأمل واذا لم تستطع الى ذلك سبيلا فأحيلك الى شيخ الازهر محمد سيد طنطاوي الذي اعلن في وقت سابق ان المسلمون أمة من الرعاع وهذا كلامه الذي سجلته الفضائيات وعاد هو لينكره لما هاج عليه الناس"
text = "اما مسألة ان حضرة جنابك اصدرت فرمانا انه لن يعلق احد على كلامي فهذا لا يهمني في كثير او قليل فأمثالك من اصحاب العقول المصمتة لا سبيل الى الحوار معهم<br />اما بالنسبة للاخ صاحب التعليق الاخير \"كونوا احرار اولا\" فانا متفق معك تماما في الرأي ولكن اسفي انك ستجد من يتهمك باثارة النعرات والفتن بين ابناء الامة الواحدة واتهامك بانك رافضي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 7
subject = "النقد"
author = "ولا انا لست حاكم كى اصدر فرمانا وهذا سخرية منك لا اكثر تدلل على انك لا تفكر بعقلك بل بعاطفتك فلسانك يسبق عقلك ."
text = "عندما قلت لن يعلق احد على كلامك بسبب انك تتعامل مع الاخر بسخريه واستعلاء لا افهمه وطلبت منك الدليل كى نعلق على كلامك اما السخريه فلن نرد لاننا لن نتعامل معك با سلوبك .<br />اما دليلك بمقوله شيخ الازهر فان قالها فهو ومقولته لا يهمنى امرهما وهذا رأيه وشأنه فقط انا لم اعترف به شيخا للازهر والادله يعرفها الجميع .<br />لكنك وصفت عقلى بالمصمت فما دليلك ؟<br />نرجو منك رجاء اخير تعامل معنا با حترام اكثر كى نقبلك ونقبل كلامك ولاتسخر فى المرة القادمه واخرسنى بأدلتك وفى المرة القادمة قل لى دليل موثوق به وليس شيخ الزهر قال ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 8
subject = "تعقيب"
author = "ليك انظر الى حالك وحال شعبك ايضا"
text = "ما ذنبى انا وغالبيه المسلمين المحترمين فى وجود قله همجيه على حد وصفك ؟<br />فمثلا ايعنى وجود سارق مسلم ان المسلمين لصوص وان الاسلام دين للسرقه ؟!<br />ثم سعادتك قلت حالك أتعرفنى وتعرف حالى ايضا انت بذلك تدعى علم الغيب من اخبرك انى همجى اعطنى الدليل ؟<br />ملحوظه : كلمة (احيلك ) تدلل على اننى متهم فى قاعة محكمة او فى قسم شرطة وشكرا لسعادتك على سعه صدرك لسماع كلماتى الهمجية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 9
subject = "لحوم العلماء مسمومة"
author = "ال الإمام الحافظ ابن عساكر: (اعلم يا أخي وفقني الله وإياك لمرضاته، وجعلنا ممن يخشاه ويتقيه حق تقاته، أن لحوم العلماء مسمومة، وعادة الله في هتك أستار منتقصيهم معلومة، فمن أطلق لسانه في العلماء بالثلب، ابتلاه الله قبل موته بموت القلب)."
text = "جاء في رحلة ابن الصلاح وتاريخ ابن النجار في ترجمة يوسف بن علي بن محمد الزنجاني الفقيه الشافعي قال: حدثنا الشيخ أبو إسحاق الشيرازي رحمه الله، عن القاضي الإمام أبي الطيب أنه قال: كنا في حلقة النظر بجامع المنصور ببغداد، فجاء شاب خرساني يسأل عن مسألة المصرَّاة، ويطلب الدليل، فاحتج المستدل بحديث أبي هريرة رضي الله عنه الثابت في الصحيحين وغيرهما، فقال الشاب، وكان حنفياً: أبو هريرة غير مقبول الحديث؛ قال القاضي: فما استتم كلامه حتى سقطت عليه حية عظيمة من سقف الجامع، فهرب الناس، وتبعت الشاب دون غيره، فقيل له: تب؛ فقال: تبت؛ فغابت الحية ولم يبق لها أثر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 10
subject = "تسالي"
author = "اما السخريه فلن نرد لاننا لن نتعامل معك با سلوبك .\""
text = "\"كى نقبلك ونقبل كلامك\"<br />استعمالك للنون هل هو من قبل التفخيم او انك تتكلم نيابة عن جماعة? فهل انت اميرهم?<br />ثانيا عيب الا تعترف بشيخ الازهر مع انك لم تذكر ادلتك على عدم اهليته يا صاحب العقل واماكلمة احيلك فليست مرتبطة بالمحاكم حصرا فأنتم تستخدمونها في العديد من حواراتكم ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 11
subject = "حلوة تسالى دى"
author = "كرا لسؤالك هذا الرقيق وسوف اجيبك اولا انا لا اعظم نفسى فلست مغرورا"
text = "واستخدامى للنون لانى اتكلم بالنيابه عن غالبيه من الهمج الذين هم امه من الهمج وهذا<br />وصفك لنا ودليلى عندما قلت (انظر لحالك وحال شعبك )اى انك لاتتحدث عنى فقط بل امه الهمج<br />ومن الطبيعى ان اتكلم بالنيابة عنهم لانى منهم همجى على حد وصفك<br />اما بالنسبة لشيخ الازهر فغالبيه المسلمون يعلمون ما اقوله لقد احل الربا والغناء ومنافقته للسلطه<br />والحاكم وذهابه للندن بعد تفجيرات لندن ليعلن تجريمه لما حدث ولكن ما يحدث من امريكا فى العراق لايهم<br />وما يحدث من اليهود فى فلسطين لايهم اهذ شيخ للمسلمين ؟<br />ولكنى الاحظ انك تقول امتك شعبك حوراتكم تستخدمونها استخدامك لكاف الخطاب ذلك يعنى انك غير مسلم او غير عربى .<br />وكلمه احيلك لم اسمعها الا فى اقسام الشرطه ولم اسمع مواطن همجى مثلى قالها لى ولكن حتى<br />لا نتطرق الى موضوعات فرعية اخبرنى بأدلتك على اننا امة من الهمج وقلتها لك اخرسنى بالادلة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 12
subject = "تسالي 2"
