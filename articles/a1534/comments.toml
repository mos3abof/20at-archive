subject = "لا حول و لا قوة إلا بالله"
author = "لكابتن بتاع \"مالت عليكم\""
text = "الأخ الكريم الكاتب للتعليق إلي مش عاجبك, أسمي و أعلي من إنه يرد علي شخص زيك و أنا مش هادخل معاك في مهاترات فارغه لأن الكلام معاك منتهي قبل ما يبدأ<br />لكن أتضررت للكتابه علشان تشوف حاجه واحده \"ده لو بتشوف أساساً\" أمة الهمج إلي وصفتها دي هي أمه كريمه و أمه عزيزه جداً و لها الخلافه رغم أنف لأمثالك و هاتوصل لأستاذية العالم رغم كل البييتخطط ليها<br />و لو شايفها أمة الهمج فهي لأنك شايفها من منظورك و لو مش فاهم ... علشان فيها إلي زيك ودا واقع متطريين لقبوله<br />لكن لو علينا كنا صفنيها من ال.....<br />ويا ريت لو الموضوع مالكش فيه ما تدخلش فيه<br />و شكراً علي سعة صدرك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 3
subject = "تأكيداً للأخ صاحب موضوع باريس"
author = "ن لي أخ فاضل مثل صاحبك هذا"
text = "ففي أحد الحوارات بيننا أكد لي فرحه الشديد أن روميه لم تفتح \"بعد\" و كنت مندهشاً من كلماته فكيف له الفرحه بأن أحد البقاع الأرض لم تفتح !!!<br />ولكنه إستطرد قائلاً : حديث سيدنا رسول الله عند حفر الخندق عندما واجه الصحابه صخره مستعصيه, فقام سيدنا رسول الله بضرب الصخره فإذا بها تفلق شيئاً ما و يقول أشرف الخلق فتحت قسطنطينيه\"تركيا\" , ثم يضربها صلي الله عليه و سلم ثانياً و يقول :فتحت روميه\"روما\".<br />وما ينطق عن الهوي<br />ويستكمل حديثه قائلاً وقد نال محمد الفاتح شرف فتح قسطنطينيه مع كل ما واجه من عناء ... ولكن روميه لم تفتح بعد....؟؟<br />وهذا أمل لنا بأن أحدنا أو أحد أبنائنا سيفتحها و لا مجال لشك عندنا في هذا<br />و لا تزال الأمه بخير مادام بها هؤلاء الرجال الذين يحملون علي عاتقهم حال و مستقبل أمتنا<br />تقبل الله منا و منهم و جزاهمخيراً علي نواياهم الساميه رزقنا الله الشهادة علي أعتاب الأقصي<br />أخوك /أحمد عمر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 4
subject = "ماذا لو عادت الخلافة"
author = "ماذا لو عادت الخلافة؟"
text = "يتمنى عدد محدود من المسلمين عودة الخلافة معللا ذلك بالاوضاع السيئة والمعاناة التى يعيشها قطاع كبير من المسلمين فى شتى أرجاء المعمورة .<br />لقد اصبحت الخلافة حلم يراود بعض المسلمين فقد سرح هؤلاء بفكرهم فى عدل وورع الخلافاء الراشدين وباتساع الدولة الاسلاميه فى عهد بنى اميه وبوصولها لاقصى اتساعها فى عهد العباسيين حتى وصلت لحدود الصين شرقا والبلقان غربا والقوقاز شمالا واواسط افريقيا جنوبا بوجود الاندلس .<br />واستمرت الخلافه تنظم حياة المسلمين فى عهد العثمانيين وضمت اراضى جديدة للدولة الاسلامية ويعتبر عصر العثمانيين باستثناء النهاية السيئه له من العصور التى ساهمت فى بقاء دولة الاسلام قوية صامده لمدة زادت عن الخمسة قرون برغم الضربات القوية التى وجهت لها وقد تناول التاريخ هذه الفترة بشكل سئ ، ثم انتهت الخلافة على يد اليهودى مصطفى كمال اتاتورك عام 1924 وتفككت الدولة العثمانيه الى مانراه اليوم من دول واشباه دول تحيا فى ظل الهيمنة الامريكية.<br />نحن لا ننكر وجود مساؤى وعيوب فى فترة الخلافة باستثناء عهد الخلفاء الراشدون من اهمها :<br />1- فساد الخلفاء وانشغالهم باللهو والمجون وحياة الترف كما حدث فى العصر الباسى الثانى .<br />2- توريث الحكم للابناء الذى نعانى منه اليوم والذى بدأ فى عهد الامويين .<br />3- تفتت وتفكك الدولة الاسلامية ودائما ما يكون فى نهاية كل عهد خلافة او عند حدوث غزو خارجى كما فى التتار والصليبين.<br />4- ظلم واستبداد الخلفاء وحكام الولايات وهو مابدا واضحا جليا فى نهاية الحكم العثمانى.<br />برغم هذه المساوئ فانها لا تشكل نقطة فى بحر ما يحدث اليوم من انصياع كامل للغر ب وموالاتهم على حساب المسلمين وغيرها من الكوارث .<br />ولكن دعونا نسرد مزايا الخلافة :<br />اولا وحدة الدولة الاسلامية :<br />- بين عشية وضحاها تجد الدول الاسلامية المتفرقة شرقا وغربا متحدة فى دولة واحدة يحكمها خليفة المسلمين بالحق والعدل .<br />- تجد المليار ونصف المليار مسلم فى دولة واحدة ليسوا عرب او فرس او اوربيين وانما مسلمون .<br />- تصبح مساحة الدولة الاسلاميه فى اقصى اتساع لها اكثر من 22 مليون كم مربع اى ضعفى مساحة اوروبا .<br />ثانيا ظهور قوة الدولة الاسلامية وتأثيرها على مختلف البلدان :<br />من الناحية الاقتصادية :<br />- يمتلك المسلمون منابع النفط فتتاح لهم الريادة على مختلف البلدان الاخرى ،كذلك تنمو وتزدهر الصناعة لامتلاك العرب عصب الصناعة النفط وفى ظل وفرة من الموارد المعدنية والخامات الاخرى<br />- تتوسع تجارة المسلمين ويزداد تحكمهم بالتجارة الخارجية لامتلاكهم اغلب الممرات والمضايق الاستراتيجية منها قناة السويس ومضيق البسفور والدرنديل وباب المندب ويصبح البحر الاحمر بحيرة اسلامية<br />- ضخامة الاراضى الزراعية بشكل كبير وتنوع المحاصيل ما بين شتويه وصيفية وتواجد المحاصيل النادرة من بن وكاكاو وشاى وحمص جوز الهند .....الخ ، وبهذا يحقق المسلمون الاكتفاء الذاتى بل ويصدروا للدول للاخرى .<br />من الناحية العسكرية :<br />مع وحدة الدول تتوحد الجيوش بكل جنودها وعتادها فى جيش واحد قوى هذا بالاضافة لامتلاك المسلمون القنبلة الذرية والصواريخ عابرة القارات تخيل مدى قوة هذا الجيش ؟<br />من الناحية الإجتماعية :<br />ظهور مبدأ المساواة بين المسلمين بعد أن كان مغيبا بسبب المحسوبية والمجاملة وبالتالى تتاح الفرص للكفاءات فى شتى مجالات الحياة للظهور مما يحقق تنمية وتقدم مؤكد .<br />عزة الاسلام وكرامة المسلمين وعودة الحقوق المسلوبة:<br />- يصبح المسلم عزيزا قويا فى بلده وخارجها لن يتعرض للأذى والمهانة فخلفه دولة الاسلام بأكملها .<br />- يرتفع قدر وقيمة المسلمين فى كل انحاء المعمورة ليس بسبب قوتهم فقط وانما بسبب عودتهم لكتاب الله فتظهر هيبه الاسلام فى قلوب اعدائه .<br />- عودة الحقوق المغتصبة للمسلمين بدأ من القدس الشريف والشيشان والبوسنه وغيرها من الحقوق المسلوبة .<br />عودة الفتوحات الاسلامية :<br />تبدأ الفتوحات الاسلامية مرة اخرى بعد ان توقفت فى اواخر الدولة العثمانية بسبب مطامع الدول الاوربية الاستعمارية التى لازالت مستمرة حتى يومنا هذا ، وبالتالى تزداد رقعة الدولة الاسلامية وينتشر الاسلام بقوة الدعوة لا بقوة السلاح كما يدعى البعض .<br />ولكن بالرغم من تعدد مزايا الخلافة وتأكد اثرها على المسلمين الا ان دعاة العلمانيه والليبرالية لا يحبذون فكرة الخلافة لا عتقادهم بانهما مقيدة للحريات وسبب الجهل التخلف الذى نحياه اليوم وهؤلاء لايعلمون ان البعد عن كتاب الله هو سبب المصائب التى تحياهها الامة الاسلامية حاليا ، فمثلا لم تفلح القوانين الوضعية فى منع السرقه والزنا وغيرها من المحارم بل لقد استفحلت هذه المحارم وقويت شوكتها اما لو طبقت شريعة الله فسيتوقف سيل المحارم التى ينهش فى جسد الامة .<br />خلاصة القول لا بديل عن الخلافة الاسلامية لنا ، الخلافة املنا فى حياة كريمة تصحح اوضاعنا الخاطئة فى ظل فقدان الهوية الاسلامية ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

