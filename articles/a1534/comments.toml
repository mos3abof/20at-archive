[[comments]]
order = 27
subject = "حريه الرأى"
author = "رجوا من الاخ المحترم صاحب مقال سبحان الله الا يسخر من الاخر عندما ذكر اليابانى واقواله لان هذا فكره ورأيه وقد حاولت معه بكل السبل من اجل اقناعه بأن الامه الاسلاميه امة عظيمة وان كانت الان تعانى من الضعف والتخلف لقد طلبت منه الادله عندما ذكر اننا همج والحق يقال اننا لم يتعصب لفكره فقد قالها لى انه لن لم يقنعنى فهو فشل كما انه اعتذر فى النهايه لى وكنت اتمنى ان يعممها لتشمل كل المسلمين ولكنى كنت اعتبر نفسى صوتا لكم وانا اعتبر اعتذاره عن هذه الكلمه اعتذار لكل المسلمين ."
text = "وفى النهاية فانى متفق معك ومقتنع بكل كلمة قلتها فالعلمانيون كذلك اللا دينيون خطرهم على الاسلام كبير وينبغى ان ننتبه لذلك .<br />اما بالنسبه لحريه العقيدة ففى بلاد الغرب يضعون نصب اعينهم الاسلام يحاولون صده بكل الطرق ومنع انتشاره فبدأوا بالحجاب والله يعلم كيف سينتهوا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 28
subject = "و كان حقا علينا نصر المؤمنين..!"
author = "خطاء بشعة مقززة وقع فيها كثير ممن كتبوا التعليقات...أمر مؤسف جدا.. بدأ المهزلة ذلك المتكلم عن أمة الهمج....جهل فظيع..و عصبية قذرة..و ربنا يهديه."
text = "أما غير كده فقد أخطأ الكثيرون/<br />*الاعتقاد فى عدم عودة الإسلام قويا عزيزا هو هزيمة نفسية مخيفة..و لكن لا نلوم على عدم رؤية المستقبل جيدا إذا كان الماضى أصلا لم يتم فهمه..إن ذلك القائل بأن الخلافة انتهت مع مقتل الحسين هو يرتكب جريمة كبرى ضد التاريخ و ضد أمته...إن هذا لم يستطع قراءة التاريخ إطلاقا..و للأسف الشديد ليس وحيدا..وقع فى الأخطاء أيضا ذلك المتكلم عن الجمهورية الإسلامية فى إيران..واحسرتاه أراهن أن هذا الشخص لم يقرأ كتابا واحدا محترما عن الشيعة أو عن تاريخ الشيعة أو عن الخومينى..و أخيرا أدعو كل أخ غير متعصب للاستماع للداعية المسلم الرائع الدكتور راغب السرجانى و بالمناسبة هو دكتور فى طب قصر العينى<br />محمد صبرى-القاهرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 29
subject = "الرد على اللى فوق ده"
author = "ولا إنت مغرور كأنك جاى تحاسب الناس و بعدين تقول مين الصح و مين الغلط"
text = "ثانيا كفاية بقى فتنة و تفريق بين المسلمين,كل ما واحد يتكلم عن إيران تلوثوا السمعة بكلامكم عن الشيعة ..كفاية بقى<br />ثم إيه علاقة راغب السرجانى بالموضوع؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 30
subject = "الرد على الأخ بتاع الفتنة"
author = "ولا/ الإشارة للدكتور راغب مجرد نصيحة و دعوة مش أكتر"
text = "ثانيا/ أنا مش مغرور أنا بقول رأيى بس بحاول أقيس على قيم ثابتة و محترمة..<br />و مصر على كل أرائى..التاريخ الإسلامى عظيم بل هو الأعظم بين تراث جميع الأمم<br />و النظرة بانتهاء الخلافة الإسلامية العظيمة عند مقتل الحسين رضى الله عنه هو الجهل بعينه شئت أم أبيت..بل هو من أقذر الأفكار التى ابتليت بها أمة الإسلام<br />من مؤامرات العلمانيين الذين لا هم لهم إلا تشويش العقيدة و هدم الشريعة و تزييف الحق و تهميش الدين عن حياة المسلمين...و أنا ولا بتاع فتن و لا حاجة ولكن موقفى من الشيعة ثابت و إنت يا أخى مش عشان الدعوة إلى عدم الفرقة تقوم تدى الناس نموذج إيران للدولة الإسلامية أو تدعو للتقريب مع مذهب الشيعة الاثناعشرية.<br />و أخيرا أدعوا الله أن يوفقنا للحق و يرزقنا اتباعه.<br />م.صبرى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

[[comments]]
order = 31
subject = "هل الخلافه الاسلاميه نظام سياسي ام اتجاه ديني"
author = "سم الله والسلام عليكم"
text = "يا ساده يا افاضل بالله عليكم تعلموا لغه الحوار<br />يا ساده نظام الخلافه بدأ بعد وفاه الرسول صلي الله عليه وسلم اي ان يكون هناك من يخلف الرسول في اداره شؤن الامه الاسلاميه فقط . اذا الخلافه هي نظام سياسي يجمع امه الاسلام تحت رايه الخليفه . ويقوم الخليف بتعيين ولاه لكل قطر . ويقوم الوالي بأدره القطر او البلد . وبذلك تكون الخلافه الاسلاميه مجرد نظام اداري سياسي . وهذا النظام الامركزي في اداره الاقطار كان نظام ناجح والتاريخ خير دليل علي ذلك . وعندما انقسم المسلون واستقلت الاقطار بدا الانهيار ولن اطيل فالباقي معروف . اذا لاعيب في اي نظام سياسي يجمع الامه الاسلاميه شريطه تحقيق العدل والمساواه والحريه والسلا م ختام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

