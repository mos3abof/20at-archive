[[comments]]
order = 25
subject = "الخلافة كالصلاة لابد من اقامتها"
author = "لخلافة -اخواني - ليس أمرا لنا فيه خيار ، بل هو أمر حتمي واجب ، والخلافة المقصودة هي خلافة النبوة ، بمعنى اقامة شعائر الدين وحراسة بيضة الاسلام الذي هو دين لا ينفك عن أمة."
text = "وعلى كل مسلم أن يجتهد ويضع يده بيدي أخية لاقامة دولة الشريعة التى يتفيأ ظلالها كل المسلمين.<br />ودولة الاسلام - دولة الخلافة - التي نجد في اقامتها ، ليست هي تلك الدولة النمطية التى تؤله حاكمها ويجثم على صدرها أبدا الدهر ، لا والف لا بل هي دولة عصرية تقوم على دستور مكتوب وعلى فصل للسلطات ، واستقلال القضاء ، وحرية القول والعمل.<br />أنها دولة المؤسسات ، ودولة المجتمع المدني ، تقوم على حكومتين : حكومة ولائية همها الخدمات للمواطنين ، وحكومة مركزية همها الدفاع والدعوة<br />أنها : الولايات المتحة الاسلامية ، فمتى نراها واقعا ؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

