[[comments]]
order = 21
subject = "لا تكن انت جشعا"
author = "نك بذلك الكلام تدعى ان الاسلام انتشر فى مصر وغيرها من الاقطار التى فتحها المسلمون بحد السيف هذا كلام غير صيحيح وله ادله من واقع الحياة فلو ان الاسلام انتشر بحد السيف كما تدعى لتركه المجبرون عند ضعف الدوله وعادوا اليه عندما تقوى وهذا لم يحدث."
text = "كما ان الدين الاسلامى يدعو الى حريه العقيدة كما فى الايه \"لا اكراه فى الدين قد تبين الرشد من الغى\"فأنت حر طالما هذا اختيارك وعندما فتح المسلمون الاقطار المجاورة يدعون الىالاسلام ويبينون مدى احترامه للانسان ومساواته بين المسلمين فيقبل عليه الاخر بقوة الدعوة لا بقوة السلاح .<br />وبالنسبهلفرنسا وغيرها فما المانع فى دخول فرنسا وغيرها من البلادطالما ان المسلمون لايرتكبون ما يغضب الله ولا يسفكون الدماء ولكن مايحدث للمسلمين اليوم من ذل ومهانه وتحليل دمه عند غير المسلم وهو ما يحدث فى الشيشان وافغانستان والعراق و و و وما حدث فى البوسنه ستأتى الخلافه يوما ما ليس حاليا اطمئنوا ايها المنافقون لان المسلمين يخالفون شرع الله والله لايغير ما بقوم حتى يقبلوا هم على التغيير ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141601/http://www.20at.com/article.php?sid=1534"

