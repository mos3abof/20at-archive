author = "شيخ الازهر"
posted = "2009-11-05"
text = "المجرم فى قاعة المحكمة يرتدى ما يشبة النقاب و مفيش احد فى المحكمة اجبرة على خلع القناع علشان يشوف تعبيرات وجهة ويتعرف علية ورغم انة مجرم<br />لية يا مولانا<br />لانهم بيحترموا الحرية الشخصية وحتى لو كان قاتل<br />هى دى الحضارة<br />الاخ هلال بتاع التعليم العالى شاف الصورة<br />والاخ الزقزوق شاف الصورة<br />فية حاجة اسمها الحرية الشخصية"
archived = "2009-11-09"
capture_url = "https://web.archive.org/web/20091109184416/http://www.20at.com:80/masr/news/13924-2009-11-05-07-53-30.html"

