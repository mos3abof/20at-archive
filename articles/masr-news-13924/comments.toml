author = "امة الله المصرية"
posted = "2009-11-06"
text = "المجرم جذب حجاب مروة رحمها الله تعالي فالتف حولها من المارة غيرالمسلمين الالمان لانقاذها و قاموا بتسليمه معها للشرطة و مقاضاته بل وصدر حكم ضده فقتلها<br />كم فتاه في مصر تتعرض لشد حجابها و تمزيق ملابسها و محاولة الاعتداء عليها في الطرق العامة و خاصة الاعياد<br />وتستغيث و لا تغاث و تسمي الصحافة هذا بتحرش و هو اعتداء و هتك اعراض<br />و لا يمسكه المارة او يسلموه لشرطة او تتم محاكمته<br />كانت مروة محظوظة لانها ليست في مصر<br />جعلتموها رمزا للاسلام في بلد البلطجية فيه كل يوم يسيئون اكثر للاسلام<br />اري ان علي طريقة المثل البلدي اللي يقول لمراته ياعورة الناس تلعب بيها الكولرة و اللي يهتك ستر بنات بلده الاغراب يقتلوهن في قاعات المحاكم<br />هههههههه وعايزين تنتصروا علي اسرائيل؟"
archived = "2009-11-09"
capture_url = "https://web.archive.org/web/20091109184416/http://www.20at.com:80/masr/news/13924-2009-11-05-07-53-30.html"
