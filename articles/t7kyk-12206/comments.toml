author = "االحمير والكلاب"
posted = "2009-05-28"
text = "هى بس خنازير<br />يا ابويا ما احنا اكلنا حمير واكلنا لحم قطط ولحم كلاب<br />واكلنا قمح علف الحيوانات<br />واكلنا خضروات وفاكهة مرشوشة بمبيدات مسرطنة<br />اصل احنا شعب ما لوش اصحاب - يعنى حاجة كدة ملهاش لزمة<br />اللى يموت يموت واللى يعيش يعيش<br />واحنا مالنا<br />سألوا الاخ جحا<br />يا جحا مش عارف اية فى بيتك قال لهم مدام بعيد عن مش عارف اية يبقى خلاص<br />من الاخر<br />نحن لا نأكل اللانشون ولا البسطرمة ولا الهمبرجر ولا الكباب ولا الكفتة نحن نأكل الفول المدمس"
archived = "2009-05-29"
capture_url = "https://web.archive.org/web/20090529195553/http://www.20at.com:80/t7kyk/12206-2009-05-27-13-39-00.html"
