text = "ولو حبيتي كمان .. فبحكم شغلي في الجامعة أنا أعرف دكتورة نفسية شاطرة قوي .. و دكتورة كبيرة كمان .. لو حبيتي اديكي رقمها و مكان عيادتها فأنا تحت أمرك ..<br />ربنا معاكي و مع كل البنات .. أحنا والله في زمن أخبر .. ربنا يحفظنا جميعا وكل بنات المسلمين يا رب .."
