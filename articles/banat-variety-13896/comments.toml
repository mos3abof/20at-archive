text = "انا اول مره اكلم حد ف الموضوع ده بس انا فعلا حصلى كده وانا صغيره اوى ف ابتدائى مثلا 0من عمى الاصغر(اخو بابا مره ومن عمى برده بس ابن عم بابا مره -التنين قد بعض) وانا دلوقتى ف الجامعه مع انى انا على قدلا من التدين واحفظ القران لكن ده اللى حصل وكنت بحسب انا انا لوحدى اللى حصلى الموضوع ده وفعلا بلوم نفسى كتيييييييييير اوى وحصل معايا ده كذا مره كان بيكتبلى الواجب سعات ويجيبلى حاجات حلوه مره تانيه لغاية وانا ف اعدادى عرفت ايه اللى بيحصلى بطلت اتكلممعاه حتى وبقى سرى المؤلم يصاحبنى كالظل بس انا دلوقتى متقدملى واحد كويس ومتدين اوى واهلى موافقين عليه وانا كمان بس انا خايفه اكون مش عذراء حد يقولى اعمل ايه تعبت بجد"
