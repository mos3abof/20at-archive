text = "ميرسى ليكى بجد يا<br />ran ran<br />وجيمس و ليكو كلكو يا جماعه لوقفكوا جنبى<br />بجد انا نفسى فعلا اروح لدكتوره نفسيه بس اولا انا ما عنديش الجرأه الكافيه لده ولا ان اروح لدكتورة نساو ثانيا انا بابا وماما بيقلقوا جدا لو اتأخرت ف الجامعه شويه وانتى فين وروحتى فين 0 ولا كمان عندى الجرأه انى اقول للشخص المتقدملى مع انى عارفه انه شخص متدين وف قمة الاحترام<br />يلا0000 انا فعلا مش قدامى غير انى اسيبها على ربنا هو اللى عالم بيا<br />انا اسفه ان كنت وجعت دماغكو بهمومى بس انا فعلا اول مره اكلم حد ف الموضوع ده 000ميرسى ليكو مره تانيه"
