subject = "ردا على الاخ"
author = "ذكريات فتاه"
posted = "2006-02-01"
text = "اللى كاتب انه مش مصدق ومش عارفه ايه وانت ايه اللى تاعبك؟؟ اكيد عشان انت ولد مش عايز تحس بالذنب ان فى رجال بيعملوا فى بنات ايه<br />ثانيا انا اعرف بنات كتير اوى على النت حاكولى نفس الحكايات وممكن هى تكون جابت المعلومات بالطريقه دى مش عايزة اقولك انه فى افظع من كده كمان اوك؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

[[comments]]
order = 33
subject = "هى فعلا مشكلة كبيرة اوى"
author = "ريرى"
posted = "2006-02-02"
text = "اهلا بيكم<br />انا كنت عاوزة اعلق على الموضوع دة لانه بجد بيضايقنى كتير لان البنات هى المظلومة فيه مش الولد والبنت هى الى بيتنظر ليها بشكل وحش وبتتعذب حتى من اهلها لان ماحدا بيقبل المشكلة دى ابدا والمشكلة الاكبر ان الولد مابيتحاسب ولا بيتاخد عليه اى خطوة لكن البنت المظلومة هى الى بتتحاسب ومالهاش اى دنب بسبب نظرة المجتمع ليها ولانها ماتقدر تتجوز بعد كدة وانا بقول ياريت نظرة المجتمع تتغير وخصوصا بالنسبة لفتاة مالهاش اى ذنب وشكرا اوى على الموضوع دة بجد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

[[comments]]
order = 34
subject = "ارحمينا يا استاذه هبه ربنا يكرمك"
author = "منير"
posted = "2006-02-02"
text = "ليا بعض الملاحظات السريعة<br />اولا : اشعر ان الشمحطجى مش شمحطجى ولا حاجه بس هو متخفى ورا الاسم ده لان النقد بتاعه وان كان فيه عبارات مسيئة الا انه ينم عن شخصيه فاهمه<br />ثانيا : اخ براء(فى نظرى) لم يدافع عن كاتبة الموضوع يا اخ (لا مؤاخذه )وان كان الظاهر ذلك ولكن ان دققت فى الكلام ستجده طعن فى موضوعها وانتقاد بس بذكاء احسده عليه؛ فقد امتعنا اخ براء بموضوعات جميله وليس مثل هذه الموضوعات الغير ناضجه<br />ثالثا : موضوعات الاستاذه هبه فقدت مصدقيتها الا اننا نشكرها عن المجهود الوحيد الذى قامت به وهو تجميع المعلومات من الشرق ومن الغرب وحتى من تحت الدولاب..<br />رابعا اريد الاستفسار عن عمر وخبرة كاتبة الموضوع ؟؟؟هل تؤهلها للكتابة مثل تلك المواضيع بحيث يكون الهدف الأفادة وتوجيه القارىء مثلمايحدث فى صفحات اسلام اون لاين ؟؟؟ام ان الكاتبه مذنؤه فى كلمتين ونفسها تعمل طرقعة<br />عموما البحر القذر لا يأتى الابأسماك ميته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

[[comments]]
order = 35
subject = "حرام عليكم"
author = "ضحيه ومعذبه"
posted = "2006-02-04"
text = "ياجماعه انتوا بتتكلموا فى جوانب الموضوع سيببين الاصل ليه بتهربوا من الموضوع انتم مش متصورين العذاب اللى البنات دى فيها ليه مش قدرين تتصورى ان انت ممكن حد ممن بتحبهم يكون فيالمشكله لوحستوا بان ممكن حد يحصل ليه كده من علتكم هتقدروا تفهموا مش متصور ان بنت تقول على نفسها كده لانها هى المظلوما دايما ذنبها ايه فى ذيب بياخد اغلى حاجه عندهادول اطفال حرام تجرحوا فيهم بكلامكم كفايه اللى هما فيه حد سال نفسه لو حب وحده وواجهته وقالت له انا كده دى مش قاليلت الادب انها تعترف ليك هتعمل ايه غير انك تظلمها او تقف جنبها ؟ اسال نفسك لو اختك بعد الشر منهم هتعمل ايه هتضربها ليه البنت هى المتهمه دايما حرام عليكم حرام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

