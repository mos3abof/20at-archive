[[comments]]
order = 78
subject = ""
author = "ranran"
posted = "2010-01-01"
text = "أنا معيدة بكلية العلوم و ليا شوية معلومات في الموضوع دة ..<br />ولو سألتي اي دكتورة هاتقولك انها بتقابل حالات لبنات كتير فقدوا عذريتهم عن طريق الخطأ .. كالحوادث و الاغتصاب أو بعض انواع الرياضات العنيفة أو ركوب العجل او الحصان لفترات كبيرة .. أو الصدمات أو الوقعات العنيفة اللي بتعمل رض في الغشاء جامد اللي ممكن تسبب قطعة .. أو نتيجة عدم المعرفة و ممارسة العادة أو المياه الشديدة في الحمامات .. و هكذا ..<br />ولو سألتيهم هايقولولك كمان ان الكشف بيبين اذا كان الغشاء اتقطع نتيجة السير غير المظبوط والعياذ بالله كالزنا مثلا و الاتتصال الجنسي أو نتيجة حاجة من الحاجات اللي قولتهالك فوق دي ..<br />دة غير ان الشرع أحل في مثل حالات الغتصاب و الكلام دة ان البنت تعيد غشاء البكارة الى وضعه الطبيعي قبل الزواج وبدون علم الزوج .. وانا دي والله يا جماعة سمعتها من شيخ كبير كمان ..<br />ممكن يا sadness تستشيري دكتورة و مفتي كمان في موضوعك دة .. مش أي شيخ ولا حتى داعية .. لازم يكون مفتي ..<br />و ياحبيبتي ماتلوميش نفسك .. واستعيني بربنا في انك تعدي المحنة دي .. وأنصحك كمان انك تحاولي تزوري دكتورة نفسية تعينك و تساعدك .."
archived = "2010-01-16"
capture_url = "https://web.archive.org/web/20100116001005/http://www.20at.com:80/banat/variety/13896-2009-11-02-12-21-29.html"

[[comments]]
order = 79
subject = ""
author = "ranran"
posted = "2010-01-01"
text = "بصي يا sadness<br />انا ليه رأي في الموضوع دة و ممكن كمان يكون مختلف عن اللي الأخوات الفاضلات قالوه .. هاقولك ليه ..<br />أولا انا مع ان ممكن البنت تروح لدكتورة تكشف عليها ..بس ماتكونش لوحدها لازم يكون معاها أمها .. دة لان للأسف في عيادات امراض النسا ممكن لو روحت لوحدك وكمان مفيش في ايدك دبلة يتبصلك هناك بصة تجرحك .. دة غير ان الكشف دة لازم تعمله دكتورة شاطرة عشان ماتازيكيش وهي بتكشف عليكي من غير ماتقصد ..<br />تاني حاجة .. حتى لو لاقدر الله البنت اكتشفت انها مش عذراء نتيجة تعرض حيوان ليها فا أنا مش مع ان البنت تقول لخطيبها و تفضح نفسها وربنا ساترها .. هاتقوليلي انه كدة كدة هايعرف بعد الجواز .. هاقولك ان ساعتها طبعا ماتقوليلهوش انك خبيتي عليه .. لكن ممكن تقوليله انك وقعتي وانتي صغيرة أو انك وانتي صغيرة من غير ماتعرفي كنتي عادي في التويلت و الميه كانت شديدة .. او اي حاجة من دي ..<br />أنا عارفة ان منكم ممكن مايبقاش معايا في الكدبة دي .. بس اذا كان ربنا عالم انك مظلومة وان المجتمع نفسه بيدين الضحية قبل مايدين الجاني .. يبقى ايه حكم الشرع في الحاجة دي غير ان البنت تخبي وماتفضحش نفسها .."
archived = "2010-01-16"
capture_url = "https://web.archive.org/web/20100116001005/http://www.20at.com:80/banat/variety/13896-2009-11-02-12-21-29.html"

