text = "بجد بجد الموضوع دا مؤلم وانا مش بعرف انام بسببه انا تقريبا حصل معايا حاجة زى دى وانا عندى تقريبا 6 او 5 سنين كان خالى ومكنتش اعرف هو بيعمل فيا ايه وبعد كده بحاول سنتين كان ابن عمى ومكنتش فاهمة هو بيعمل ايه وكبرت وبعد كده وانا فى اعدادى بدأ مدرس الرياضيات فى الدرس الخصوصى يعمل معايا كده واول مرة هربت منه ورحت تانى مرة وحاول يعمل معايا برده بس مكنتش بروح له و مقولتش لاهلى على اى حاجة من دول وانا دلوقتى مخطوبة ومعرفش انا عذراء ولا لا وخايفة جدا من الموضوع ومش عارفه اقول لخطيبى على اللى حصل دا ولا لا بجد محتارة ومش عارفة اكلم حد فى الموضوع وعايزة اقول لخطيبى ومش عارفة اذا كان صح ولا لا يا ريت حد يرد عليا"
