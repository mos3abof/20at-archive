[[comments]]
order = 15
subject = "ولكن اين الحل"
author = "BATISTUTA"
posted = "2006-01-11"
text = "نعلم ان الظاهرة منتشرة بدأت تفوح منها روائح كريهة ولكننا لسنا بصدد الحديث عن انها ظاهرة وانها شئ سئ وحقير هذا كلام لا طائل ما يهمنا هو الحل ماذا نفعل كى نواجه هذه المشكلة مادور المؤسسات الدينية والتربوية والاهم منهم الاسرة يجب ان يكون طرح الموضوع من اجل ايجاد حلول جادة لا من اجل طرح موضوع يناقشه مجموعةمن القراء ممكن مثلا ان ينتهى الموضوع ماهو الحل من وجهه نظرك لتلك المشكلة او اسئلة اخرى وموضوع البنات واسمهم يهم من المهم المشكلة لذا ارجوا من بعض المعلقين لا يركز مقاله حول الاسماء فهى لا تهم ويفكر فى مواجهة المشكلة من خلال عرض افكاره فى صوره مقال وعموما عشرينات لم يعد كما كان انه كما قال احد القراء ينحدر تدريجيا ليس كما فتحته لاول مرة لقد حدث تغير جذرى فى الموقع ولكن للا سف ليس للا فضل حتى الشكل العام للموقع تغير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

