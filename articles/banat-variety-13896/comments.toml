text = "انامستغربه اتوا مكذبين ليه ؟احنامثل النعامه اللي تدفن راسها بالرمل هالكلام واقع ومعاش بشكل دائم واسالوا الاطباء وغيرهم انا عانيت من هالموضوع والنتيجه اطباءنفسيين وادويه مهدئه وكوابيس مرعبه بس ربي منتقم جبار دعيت الله يوريني فيه قوته ويصيبه بفشل كلوي وربي استجاب دعائي لاني مظلومه لازم يكون فيه جمعيات تحل هالمشاكل لان التعب النفسي كبير وموكل الاسرمتفهمه زي اسرتي والاهمال اكبر عدو خاصه من قبل الامهات فندائي ايها الامهات لاثقون لابقريب ولابجار ولاحتى خال اوعم لانهم ذئاب تعيش بييننا تنتظرالانقضاض على فريسه لاحول لها ولاقوة واتمنى لوكان ختم الموضوع برائي شرعي حتى يكون اثراء اسال الله العظيم ان يكفي نسائنا وبنات المسلمين امثال هؤلاء"
