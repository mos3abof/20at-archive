text = "السلام عليكم انا بنت زى زيكم بس الحمد لله ما حصلش كدة ابدا معايا لان ماما وبابا مش كانوا بيخلونى العب مع اولاد نهائى وحتى ماما كانت بتقولى وانا صغيرة ربنا يخليهالى لو حد لعب فى الهدوم بتعتك او عمل اي حاجة او حضنك اوباسك غير بابا وانا صراخى وعيطى وعلى صوتك ولو ما عرفتيش يا حبيبتى قولى ليا وانا هتصرف وثانيا والله اعلم حسب معلوماتى ان غشاء البكارة لا تولد بهى البنت لكنة ييكبر معها لما تبلغ ودة حسب معلوماتى وشكرا والله اعلم"
