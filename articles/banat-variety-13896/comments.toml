author = "شهد"
posted = "2006-09-12"
text = "الموضوع فعلا خطير ومهم وموجود ومن زمان وبيحصل كتير وبيكون سبب فى عقد ومشاكل نفسية خطيرة بتاثر على حياة ومستقبل الطفل اللى بيحصلة المصيبة دى ..انا بشكر الاخت هبة على انها فتحت الابواب المغلقة على انحرافات بتحصل فى المجتمع لازم ناخد بالنا منها بداية من الاهل واهمية متابعتهم لاولادهم وتوعيتهم بطريقة ذكية تناسب صغر سنهم...واحب اقول للاخ شمحطجى انت غريب جدا واسلوبك اغرب وتعليقك مرفوض وعندك كلمة كويسة قولها مش عندك اسكت وروح الحق اصحابك على القهوة شيشوا والعبوا على المشاريب احسن."
archived = "2006-11-02"
