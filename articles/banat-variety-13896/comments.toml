text = "السلام عليكم ورحمه الله وبركاته الصراحه هذا موضوع ينبغى التحدث فيه للاهميتها البالغه الخطوره ولكن لا ينبغى يا اخت هبه ان نتعرض لهذا الموضوع بهذه الالفاظ لانها تحمل معانى كتيره وخطيره مما يجعل اصحاب النفوس الضعيفه من الخوض فى هذه التجربه المريره فارجو منك ان تتقى الله فى مثل هذه الموضوع الهم اغفر لى ولكم والسلام عليكم ورحمه الله وبركاته"
