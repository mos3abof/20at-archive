text = "احب اقول ان الموضوع ده خطير جدا ولكن فى حل للموضوع ده؟ معتقدش ان ليه حل<br />و الاستاذه(هبه) ناقشت فى موضوع مهم موجودفى مجتمعاتنا والاستاذ (الشمحطجى)<br />نازل كلام مالوش اى لازمه وبيحلف بالطلاء انه مش داخل الموقع تانى لو حد قال له انه مضايق منه وانا مش بغلطه ممكن يكون كلامه فيه شئ من الصحيح.<br />وياريت الاستاذه(هبه)تكتب موضوعات هامه تانيه<br />شكرا:<br />لاصحاب الموقع ."
