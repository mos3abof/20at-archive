text = "أرجوكي يا دكتور توضحي أكتر إزاي البنت تفقد غشاء البكارة ومع ذلك بتكون مازالت عذراء؟؟؟ ويا تري الكلام اللي قالته الأخت ranran بالنسبة لموضوع إن ممكن يكون فقدان البنت لغشاء البكارة حصل بسبب حادث أو رياضة أو مجرد إندفاع زايد للمياه هل الكلام ده مظبوط ولو واحدة فقدت عذريتها نتيجة اغتصاب هل زوجها ممكن يفرق ما بين إنها فقدت عذريتها عن طريق حادث عارض أو عن طريق اتصال جنسي؟؟؟؟اقتباس free- minds:<br />انا دكتورة نسا يا بنات بخصوص الاستاذة sadness عذرية البنت مش الغشاء بس يا آنسة بمعنى اضق انت عذراء حتى و انت تعرضتي لقطع الغشاء ، الحالة الوحيدة التي تصبح البنت فيها غير عذراء هي حالة الاتصال الجنسي تمام يا بنات ، بمعنى أدق أن حتى الزوج لن يدرك تمزق الغشاء لانه مش لازم يشوفة انما بيبقى باين الي مارسة الجنس قبل كدا فحتى لو مفيش غشاء و اتجوزت اي بنت هتبقى في ليله الدخلة زي اي بنت عذراااااااااااا اء مفهوم كلامي يا بنات و انا هحاول اساعدكوا ديما و لو حد عندة استفسار يسألني و انا تحت أمركو انتوا زي بناتي"
