subject = "الاغتصاب"
author = "emad"
posted = "2006-01-30"
text = "ان هذه الاحداث كلها من الاغتصاب يكون فاعلها مريضاً نفسيا وهذه من الحالات النادرة وهي من ضمنها الشذوذ الجنسي وهي ظاهرا منتشرا في آخر الزمان وهو زمنا ادعوا الله ان يرحمنا جميعا لاننا في الاخر ما بين جنة ونار هذه من المشكلات التي ليس لها حل لانها جزريا تكون متخفيا ما بين مقربين واقارب وليس كما تتفضلون الانتباه للبنت فغالبا ما يكون المغتصب هو من اهل البيت فعلى من تنتبه وهو من اهل البيت فالمشكلة هي من المغتصب نفسه يجب الانتباه من الاهل في طريقة التقرب للبنت من اي شخص كان لانه غالبا ما يكون من الاهل واي استفسار عن حالة كهذه فانا دكتور نفساني متخصص بالحالات هذه والجواب مجانا على اي سؤال علي الايميل Emadmnofi@hotmail.com على الله ان يعطينا حسن الخاتمة وشكرا"
