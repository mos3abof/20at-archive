author = "rrea"
posted = "2010-01-01"
text = "[quote name=\"الحيران\"]السلام عليكم ورحمة الله وبركاته<br />والله الموضوع شائك ويستحق التوسع بشكل كبير وذلك لما يوجد من تكتم عن هده المواضيع الجد هامة في حياة من تعرضو لهدا الإعتداء<br />أنا أريد أن أتزوج من فتاة تعرضة للإعتداء وقد نتج عن دلك حمل والدي انجبته وتخلت عنه بضغط كبير من الأهل إلا أني أجد إعتراض كبير من المجتمع<br />أريد حلا<br />[/quot<br />للاسف المجتمع بيعارض عشان لسه مش قادر يستوعب ان البنت فى اغلب الحالات بتكون مظلمه بيفضل انه يرمى المشكله عليها وخلاص عشان ما يوجعش دماغه بمشاكل تانى اكبر لو واجه المشكله الاصليه<br />انا من رايي انك تصر على البنت مادام هى محترمه وعلى خلق وانك واثق ان اللى حصلها من غير ارادتها واذا كان الناس هتقف ضدك فتره هينسو ويقتنعو بعدين لما يشوفو اد ايه هى كويسه<br />والله انا مش بقول الكلام ده عشان انا بنت انا بشوفه من جهه العدل واللى وصى عليه الاسلام كمان ان من ستر مؤمنا ستره الله يوم القيامه"
archived = "2010-01-16"
capture_url = "https://web.archive.org/web/20100116001005/http://www.20at.com:80/banat/variety/13896-2009-11-02-12-21-29.html"

