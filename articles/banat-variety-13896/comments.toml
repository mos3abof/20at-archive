text = "اختي العزيزة الدنيامبقاش فيها خير اولا انا هبدا واقولك انتي غلطي غلطة كبيرة انك قلتي لاختك بس لانك بكدا لا اخدتي حقك انك سبتية يفلت بعملتة , واختك معصوبة العينين لانها بتحبة و اللة اعلم اية الظروف اللي خلتها توافق رغم انها عارفة باللي حصل بينكم و محولتش حتي تتاكد, المهم احنا مش عايزين نبكي علي اللبن المسكوب انتي دلوقتي لازم تفكري في نفسك لان اختك هي اللي اختارت و احييكي بجد علي شجاعتك انك قولتيلها والا كنتي هتفضلي طوول حياتك ندمانة ان اختك ضحبة سكوتك بس دلوقتي دا اختيارها فانا بقولك كدا كدا حياة اختك علي بيت من ورق عشان مفيش غلط بيتبني علي غلط ويطلع صح ابدا, فكري في نفسك ازاي تثبتي انك شريفة ةانك تم الاعتداء عليكي بواسطة الحيوان دا , دا اللي المفروض تفكري فية متسيبوهوش يدمر حياتك و يفلط بعملتة وزي مقالت الاخت زينا دا تحدي حياتك واستعيني باللة وانشاء اللة هينصرك"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227193843/http://www.20at.com:80/banat/variety/13896-2009-12-24-12-26-21.html"

[[comments]]
order = 70
subject = ""
author = "الدنيامبقاش فيها خير"
posted = "2009-12-26"
text = "السلام عليكم<br />بجد موضوع خطير جدا<br />انا مش عارفة اقول اي ابن عمي عمل كدا فيا وانا صغيرة وكنت بضايق منة بس مش قادرة اتكلم ولا اقول حاجة ومش فاهمة حاجة ولما كبرت وفهمت اتصدمت والصدمة الكبيرة ان اختي الاكبر من كانت بتحبو وهو كمان واتقدم لها وماما كانت رافضة ولما اتجرات وقولتها اللي حصل منة قالتلي انتي بتضحكي عليا علشان مش موافقن علي الجواز وعاوزني ارفضة ومصدقتنيش وانا مندمتش اني قلتلها علشان اكون خليت ضميري نحوها وفعلا تم الجواز وهو لما بيكامني ولا كانة عمل فيا حاجة وانا صغيرة وببقي مش طايقاه وف نفس الوقت هو زوج اختي مينفعش ابعد عن اختي ومحددش حاسس باللي انا في مشكلتي انة لو حد عرف ان ابن عمي اللي هو دلوقتي جوز اختي اللي عمل في كدا مش انا بس اللي هتضرر ددا اختي وبيتها وعيالها وربنا يعوضني خيير ان شاء الله<br />هما دول الرجالة الشرقيين هي د ي العادات والتقاليد هي دي الاصول هو دا الدم واللحم الواحد"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227193843/http://www.20at.com:80/banat/variety/13896-2009-12-24-12-26-21.html"

[[comments]]
order = 71
subject = ""
author = "Ziena"
posted = "2009-12-26"
text = "للأسف الى شوفتة و عرفتة عن الموضوع ده فتح عنيا على جريمة بشعة بتحصل حولينا كل يوم و كل لحظة و محدش واخد بالة إن إحنا كده بندمر نفسنا و مجتمعنا لأن المرأة هى نصف المجتمع و هى التى تربى النصف الأخر … حرام و الله الى بيحصل ده<br />أنا عندى بنت صغيرة و أنا دلوقتى حموت من الرعب عليها<br />عموماً … أنا بنصح كل بنوتة تعرضت للجريمة دى أنها متستسلمش للهزيمة البشعة دى ولازم تخلاج روحها من العقدة دى يعنى…<br />لو هاية شاكة أنها بعد الشر مش بنت تروح لدكتورة و تحكلها و تتأكد<br />و لازم تشوف أقرب حد ليها و لحياتها و تحاول تقولة أو تحكى لحد يعنى لازم تشرك معاها حد و مبيقاش أبداً لوحدها و تتحدى الألم و التعب عشان طعمهم وحش أوى خصوصاً و محدش حاسس بيها و بألمها … يعنى لازم يكون عندك إصرار و عزيمة تطلعة نفسك من اللى أنتى فية عشان دى حياتك أوعى تسبيها تبوظ عشان أى حد حقير حيوان<br />أنا عارفة أن الكلام أسهل بكتير من الفعل بس لازم تعرفوا أن ده تحدى عمركوا يا تكسبوا يأما الحياه كلها بلا فايدة<br />ربنا يوفق الجميع"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227193843/http://www.20at.com:80/banat/variety/13896-2009-12-24-12-26-21.html"

