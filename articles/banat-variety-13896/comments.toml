text = "ف بنات بتتكلم وف بنات لا ويمكن اللى هى جبتهم بيتكلموا عادى مجتمعنا اتفتح وبقات الحجات ديه عادى زى ما بيتكلموا عن الجنس عادى بردوا البنات اتكلمت كده يعنى مخدوش 50 جنيه علشان يتكلموا وبردوا اللى عايز يعمل موضوع بيعرف كل حاجه عنه والبنات اللى اسمها كامل زى اللى معترض انهم قالوا اساميهم يعنى هو اسمهم هما بس كده هيتعرفوا يعنى مثلا لا طبعا لان الاسماء كتيره ومتكرره والموضوع بجد جامد بس فظيع يخلينا نخاف من اللى حولنا"
