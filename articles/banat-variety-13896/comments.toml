[[comments]]
order = 0
subject = "الشمحطجى"
author = "إيه يا حاجة هبة ...براحة علينا شوية الدنيا مش عتمة كده ...زائد كما انتى جبتى شوية البنات الكسر دول منين ...متقولليش من كارفور ..يعنى لامؤخزة فى ده السؤال ...هى إلى بيتعمل فيها الى اتعمل فيها ده بيبقى ليه نفس تحكى و تهرتل كده مع الناس ... طيب لقيتى واحدة طيب التلاتة الى باقين جبتيهم منين اللهم بقى انهم اسسو جمعية و سموها جمعية \" المُغتَصَبات الصغيرات \"و انتى روحتى فى مقر الجمعية و عملتى معاهم تحقيقك إلى لامؤخزة مش داخل دماغى إنك لقيتى العدد ده من البنات الى اتعرضو للاغتصاب وهما صغيرين..."
posted = "2006-01-01"
text = "يا ست هبة لامؤخزة فى الكلمة المجتمعات الى اظنك عايشة معانا فيها مجتمعات مكتومة بمعنى ان الكتمان هو سيد الموقف فيها وشعار \"إكفى على الخبر ماجور \" هو الشعار السائد فيها ...فإنتى لامؤخزة متجيش و تقوليلى انك لقيتى تلات ولا اربع بنات اتعرضو للمحنة دى ...أقولك سورى يا طنط ...أنا مش مصدق !!!<br />و جود باى بقى .. و ربنا يستر على ولايانا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

[[comments]]
order = 1
subject = "رفقاً بمن ألمَ به المٌصاب"
author = "aroudu_4"
posted = "2006-01-01"
text = "لا ينبغي بحال من الأحوال اننتهكم علي صاحبة التقرير لأنها حقا ظاهرة اجتماعية موجودة واقول ( الشمحطجي )<br />هذا ليس من اللائق نسف الموضوع او تكذيبه لمجرد انك توهمت ان هناك من لا يستطيع ان يتكلم صحيح ان<br />الكثير من المجتمع تغلب عليه صفة الكتمان ولذلك لانعدام الثقة في الآخرين ولأسباب أخري<br />حقا هذا الصمت المٌطبِق فيما بيننا ينبغي ان يزول لتتكشف لنا الحقائق بأكملها.ونصيحتي إلي أي فتاه<br />كان قدرها ما كان ان لا تتنتقم من المجتمع في نفسها وتعزف عن الزواج مثلا بل تتجه الي التربية السليمة<br />كي لا يحدث إلي احبائها ما قد يحدث .وان تحاول كل فتاة ان تصارح من تثق بهن كي لا يٌترك هذا الشخص<br />يفعل باخري ثم باخري ....ولكم في ذلك الفتاة الباكستانية التي حصلت علي وسام الشجاعة من مؤسسة دولية<br />لمجرد انها استطاعت تقديم من اغتصبها للمحاكمة .واسأل الله ان يرفق المجتمع بمن اصابها المٌصاب ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

[[comments]]
order = 2
subject = "موضوع مهم"
author = "يا جماعة الموضوع ده مهم جدا و الله و أنا مبسوط أنه بقت الناس بتتكلم عنه بمنتهى الصراحة لأن التكتم فيه مصيبه كبيرة . فانعدام الثقافة الجنسية الصحيحة عند الناس و خصوصا الشباب يسبب لهم اضطرابات أو حب استطلاع و للأسف غياب الضمير يجعلهم ينتهزون فرصة وجود بنت صغيره لا تعرف عن الأمر شيئا و لانتهاز برائتها في أغراضهم الدنيئه."
posted = "2006-01-01"
text = "و لعلم الأخ الذي ينكر وجود هذه الحالات أود أن أقول له أنها موجوده بالفعل و للأسف كثيره و لكنها مختفية في صدور هؤلاء البنات اللاتي يخفن من الفضيحة و من اتهامات المجتمع الظالم الذي بالطبع سوف يترك الجاني و يلوم الضحية."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

[[comments]]
order = 3
subject = "اتقوا الله"
author = "سلام عليكم"
posted = "2006-01-01"
text = "ما شاء الله عليكي يا هبه موضوعك رائع..لأكن لي اكتر من تعليق عليه<br />1- رغم انتشارالظاهرة اللي بتتكلمي عنها فأنا في رأيي برضه انك بتكرري غلطة موضوع اسرار البنات .و هو انك بتتكلمي عن ظاهرة تحوطها الكتمان و السرية , ومثل هذه الاسرار لا تبوح بها الفتاة و لو حد السيف على رقبتها ,فمن أين اتيت بتك الاعترافات ,اللهم الا اقتبستها من مواقع أو مجلات أوبرامج تدفع 50جنيه للفتاة كي تعترف بما لا رأته و لا سمعته ولا حدث لها اصلا<br />الخلاصة انيمع الاخ اللي مش مصدق ان الوضع بهذه السهولة انك تجمعي هذاالعدد من الفتيات المغتصبات و يعترفن لك بهذه السهولة<br />2- ولكن على اي حال الظاهرة منتشرة بالفعل حتى أكاد أظن انها اصبحت إدمان لدى من لا ضمير ولا دين لهم ..خاصة مع الصغيرات ممن لا يعلمن حقيقة ما يفعل بهن , ويخافن ان يخبرن أهاليهن بشيء<br />3- ادارة الموقع ..هل من المقبول ان تبقواعلى التعليقات الحقيرة و السافلة و المنحطة على موضوع \"أسرار البنات\"؟!على موقع مثل عشرينات ؟؟؟هل عشرينات موقع للشباب الملتزم أو موقع اباحي ؟؟؟!<br />4- وتعجبت ايضا من كم الشتائم السافلة والقذرة على الموضوع ..بالاضافة الى ان احدهم ترك ايميله لمن يحب ان يمارس أو تمارس الزنا معه ..و هو على استعداد كما يقول لأن يخبرهن بإذا ما كانت عذراء ام لا ..ويختم كلامه قائلا\" لا شيء يضيع عندي\"<br />حرام عليكم ..على الاقل انتم عندكم القدرة تحذفوا التعليقات و الشتائم المنحطة دي ..ولكن اذا ابقيتم عليها فهل تتحملون وزرها ووزر من قراها ؟<br />اتقوا الله يا عشرينات ....اتقوا الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

[[comments]]
order = 4
subject = "الشمحطجى"
author = "دخلت على الموضوع بتاع اسرار البنات و ليه ملاحظات يا ريت كاتبة المقال تحطها فى بلها التحقيقات الجاية"
posted = "2006-01-01"
text = "1- اسامى البنات كاملة و ده من نحيتين خطأمهنى يعنى واحدة اسمهابسمة خالد لو ده اسمها الحقيقى بقت فضيحة و لو مش اسمها الحقيقى بقت كدبة و الموقفين غلط !!<br />2- الاسلوب جارح إلى حد كبير و داخل فى تفاصيل ملهاش لازمة مش هتفيد القارئ ولا كاتبة المقال هتستفاد مهنياً من كمية التفاصيل دى<br />3- الواحد اكتشف انه اخلاقة عالية قوى بعد ما قريت التعليقات على موضوع اسرار البنات \" ده انا ملاك \" و ربنا يكرمنى<br />4- الاخوة الافاضل القائمين على الموقع يا ريت تحللو السنتات ( أقصد القرشين<br />)الى بتقبضوها من إدارة الموقع و تهتمو شوية بتنقية التعليقات وواضح ان مفيش ديسك مان كويس عندكو يدسك الشغل ( متقولليش ان البراء و عبد المنعم بيدسكو لأن ده هيكون تهريج لأن الديسك شغلانة كبيرة قوى عليهم ) احترامى ليهم ...انتو محتاجين حد يهتم شوية انه يصحح و يقوم و يعلم بدل العك الى بتعملوه ده<br />5- نقطة اخير انا رجعت للتعليق بعد غياب طويل وحيرة اكتر ولو حد مضايق ممكن مخطيش الموقع ده تانى و عليه الطلاق لو فى إجماع من ادارة الموقع و من الزوار انى قليل الادب و مدخلش على الموقع صدقونى وبحلف بالطلاق ما هدخله تانى ...!!<br />و سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

