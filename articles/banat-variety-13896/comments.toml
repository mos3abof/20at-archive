posted = "2010-01-05"
text = "أنا حاسة بيكي جداً لأن حصلي نفس اللي حصلك تقريباً بس مش من ابن عمي لأ ده من أخويا اللي اكبر مني بـ3 سنين ومش مرة واحدة لأ ده كذا مرة وانا في الأول مكنتش فاهمة إن دي حاجة غلط أو حرام أو ممكن تضرني لأني كنت صغيرة ولكي أن تتخلي إني مش قادرة اتكلم عشان خايفة علي والدي و والدتي وفي نفس الوقت مجبرة اتعامل مع أخويا عاااادي جداً كأن مفيش حاجة حصلت وهو ولا حاسس بحاجة وزي ما يكون مش فاكر أصلاً هو عمل فيا إيه والكارثة إني معرفش إذا كنت عذراء ولا لأاقتباس الدنيامبقاش فيها خير:<br />انا مش عارفة اقول اي ابن عمي عمل كدا فيا وانا صغيرة وكنت بضايق منة بس مش قادرة اتكلم ولا اقول حاجة ومش فاهمة حاجة ولما كبرت وفهمت اتصدمت والصدمة الكبيرة ان اختي الاكبر من كانت بتحبو وهو كمان واتقدم لها وماما كانت رافضة ولما اتجرات وقولتها اللي حصل منة قالتلي انتي بتضحكي عليا علشان مش موافقن علي الجواز وعاوزني ارفضة ومصدقتنيش"
archived = "2010-01-16"
capture_url = "https://web.archive.org/web/20100116001005/http://www.20at.com:80/banat/variety/13896-2009-11-02-12-21-29.html"

[[comments]]
order = 89
subject = ""
author = "جيمس"
posted = "2010-01-06"
text = "على فكرة يامن اسمك ranran تسمحيلى اقولك انك انسانة جاهلة اساسا ومعقدة لانك اصلا مش فاهمة غير انك تنتقدى الناس وخلاص ياجماعة انا بقول وجهة نظر بالنسبة لاى راجل ولو انا غلطان قولولى انى غلطان انا بقول ان اى راجل فى العالم لو بيعاشر بنت لاول مرة هيعرف ازاى انها مش بنت بنوت طبعا مش هيلاقى غشاء البكارة فطبعا هو مش دكتور طب شرعى علشان يعرف ان البنت ماكانتش فى حالة معاشرة مع رجل وانه من حاجة تانية وبقول للدكتورة ممكن توجهى احسن من كدة لو انتى دكتورة وبتكلمى صح مش تقولى الزوج مش هيعرف ان غشاء البكارة مش موجود يابنات انا رجل وبقولكم الرجل اول حاجة بيدور عليها هى الدم ومالقاش الدم بتبقا فيه مشكلة ولو كان عنده صبر بياخدها ويروح لدكتورة تكشف عليها لانه بيقول ممكن الدم يكون هربان منها علشان مثلا خايفةوالدكتورة هى بقا وحسب مايحس ضميرها ياتفضح البنت ياتستر عليها لو كلامى غلط ياجماعة قولولى"
archived = "2010-01-16"
capture_url = "https://web.archive.org/web/20100116001005/http://www.20at.com:80/banat/variety/13896-2009-11-02-12-21-29.html"

[[comments]]
order = 90
subject = ""
author = "ranran"
posted = "2010-01-07"
text = "تاني حاجة .. الفكر المتخلف اللي منتشر بين الشباب دة و انه يحصر عفة و عذرية البنت في مجرد غشاء هو الجهل بعينه .. لأن لكل من الشاب و الفتاة عذريتهم .. وهم اللذين لم يمارسوا الجنس من قبل ..<br />فاذا كانت الافكار المتخلفة الرجعية تضع الفتاة في قفص الاتهام و الشك لمجرد ان الزوج مالقاش دم يوم الدخلة .. فيبقى دة مجتمع متخلف و غير عادل !!!!<br />ولأنك فاكر انك فاهم كل حاجة .. أحب أقولك ان لما انت أو اي راجل يجزم ان زوجته غير شريفة لمجرد انه اكتشف دة ليلة الدخلة و مش هايرتاح غير لما يوديها لدكتور عشان يسمع منه مايرضي غروره يبقى أقوله انه مش فاهم حاجة لأن في أنواع من الغشاء دة لا يتأثر حتى بالممارسة الجنسية ..<br />بس أقول ايه .. الحق مش عليكو لكن الحق عالتعليم و التربية اللي ادت الحق للولد و فهمته انه عشان معندوش حاجة تكشف اذا كان مارس الجنس قبل الزواج يبقى مفيش مشكلة !!!!<br />بص لكلامك الاول يا أخ جيمس .. كلامك معناه ان الولد مش مشكلة يمارس الزنا طالما انه معندوش حاجة تثبت كدة<br />وزي مانتو يا شباب بتدو لنفسكو الحق في انكو تتجوزوا بنات من غير تجارب.. أظن ان البنات كمان من حقهم انهم يخدوا رجالة محترمين و شرفاء"
archived = "2010-01-16"
capture_url = "https://web.archive.org/web/20100116001005/http://www.20at.com:80/banat/variety/13896-2009-11-02-12-21-29.html"

