text = "ملاحظة اخيرة من العبدلله بعيدا عن قضايا تحالفات الأخوان وهوسهم بالسلطة وما الى ذلك من اراء ثورية موضوعية -بالتقلية -ألا تلاحظون ياشباب النيل با حماة الجيل يامن ترون أن الأخوان علموانا الذل والهوان أن أحد منكم لم يستطع كتابة أسمه -ولوأسمه الأول -على ماكتبه من تعليق خسارة فعلا ان ندعى البطولة والرجولةثم نتخفى خلف أسماء مستعارة أو بواسطة تصبحوا على خير يا حماة الوطن"
