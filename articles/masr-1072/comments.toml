[[comments]]
order = 0
subject = "الإخوان الجبناء"
author = "كفاية"
posted = "2006-10-19"
text = "طريقة تعامل الإخوان مع نظام مبارك ساهمت فى زرع الرعب والخوف فى قلوب الشعب المصرى . منظر الطالب الإخوانى وهو يضرب على قفاه من الأمن فى الجامعة تكرر فى كل جماعات مصر وخصوصا مع بداية العام الجديد ، كان هذا هو أسلوب الأمن لزرع الرعب فى نفوس الطلاب الجدد مع بداية كل عام منذ سنوات عديدة ... استسلام طلاب الإخوان لإهانات الأمن زرعت الرعب فى قلوب الآخرين .. أسلوب الإخوان كان يعتمد على إقناع الأعضاء بأن تحمل إهانات وإعتقالات النظام هو جهاد وسيأتى الوقت الذى سيواجهون فيه النظام .. عاش أعضاء الإخوان على أمل أن يوم الخلاص من النظام والتمكين للإسلام قادم قادم وكل ما عليهم هو الصبر وطاعة القادة .. قادة الإخوان نظموا آلاف المظاهرات استنفذوا فيها طاقات الشباب ، وكانت هذه المظاهرات هى وسيلة لتفريغ طاقة الغضب لدى الشباب .. أمن الدولة كان يشجع مظاهرات الإخوان على أساس أنها وسيلة لتفريغ غضب الإخوان وأيضا وسيلة لتخويف الآخرين .. وكان مشهد الإخوان والأمن مشهد كوميدى فالإخوان يهتفون والأمن يراقب ويضحك ولكى يكتمل الفيلم كان الأمن يعتقل بعض المتظاهرين ... وبهذه الطريقة الجهنمية استمر نظام مبارك 25 سنة وسيستمر نظام جمال 30 سنة أخرى .. بالأمس صرح نائب مرشد الإخوان بتصريح يفهم منه أن الإخوان لن يتحركوا إلا إذا تحرك الشعب !! وهذا التصريح موجه لجمال مبارك ومعناه أن الإخوان لن يتحركوا لمنع التوريث !!!!! يا ترى لمصلحة من هذا التصريح !!!<br />لمصلحة الإخوان أم لمصلحة جمال أم لمصلحة مصر .......<br />ما كان مبارك ليستمر 25 سنة بلا أسلوب الإخوان القائم على تفريغ طاقة الشباب فى المظاهرات .. وما كان التوريث ليتم لولا تقاعس الإخوان وتحججهم بأن الشعب كسلان !!!<br />ولكن هل تشهد الأيام القادمة مفاجأة من العيار الثقيل ويصحو الشع<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061355/http://masr.20at.com:80/article.php?sid=1072"

[[comments]]
order = 1
subject = "نسيتو إنتخابات الرئاسة"
author = "عصام"
posted = "2006-10-19"
text = "الإخوان على استعداد تام للتحالف مع النظام لو كان هذا فى سبيل مصلحة الجماعة . كبر وضخامة حجم الجماعة جعلتهم يفكرون مليون مرة خوفا على الجماعة . قبل إنتخابات الرئاسة باعو الجميع واتفقوا مع النظام والنتيجة كانت سماح النظام لهم بالترشح لمجلس الشعب . والآن يغضوا الطرف عن التوريث مقابل بعض المكاسب .. أسلوبهم لن يتغير وعلى رأى إلى قال الى متغطى بالإخوان عريان .. الأمل الآن فى شباب الإخوان أن يفيقوا قبل فوات الأوان وينظموا مظاهرات ضد التوريث إما إذا سمعوا نصيحة نائب المرشد بيتك بيتك ستضيع مصر وستضيع الإخوان"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061355/http://masr.20at.com:80/article.php?sid=1072"

