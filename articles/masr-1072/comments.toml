[[comments]]
order = 7
subject = "الإخوان خبراء فى الولولة"
author = "المثل بيقول ( الى تعرف ديته اقتله ) وأمن الدولة عارف ديتكم عشان كده بيديكم بالجزمة . لا أفهم ماذا تفعل جماعة الإخوان لأعضائها حتى يتقبلوا كل هذه الإهانات !؟"
posted = "2006-10-20"
text = "هل هذا هو الإسلام الذى تفهمونه ؟<br />هل الإسلام يأمرنا بأن نتخلى عن كرامتنا ؟<br />هل الإسلام يأمرنا بهذا الخنوع ؟<br />أين الخلل ؟<br />بمجرد إنضمام أحد الشباب للجماعة تراه قد تعلم البرود ، المشكلة أنه يعيش فى حرب وهمية بينه وبين الأمن !! من الذى يخدع هؤلاء المساكين !!؟<br />مصر ليس بها أحزاب والإخوان فى بدايتها ضمت علماء كبار جدا أمثال الغزالى والقرضاوى وشىء طبيعى جدا أن يكون عدد أفرادها ومؤيديها بالملايين ولكن من غير الطبيعى أن تستمر الجماعة بنفس الأسلوب منذ 20 سنة ، مظاهرات وإعتصامات ، وتضحيات وهمية ليس لها أى مردود ..<br />هل تعرفون أين الخلل ؟<br />الخلل فيكم .. المشكلة أنكم تسجنون أفضل شباب مصر فى سجنكم وهؤلاء الشباب لو تحركوا لغيروا وجه البلاد فى أيام ..<br />جبهة الدفاع عن الأستاذ محمد حماد ضد هجوم الإخوان عليه<br />لسنا بلطجية أقلام كما تدعون ، نحن مصريون نرفض التوريث والإخوان معا ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061355/http://masr.20at.com:80/article.php?sid=1072"

[[comments]]
order = 8
subject = "الاخوان لم يوافقوا على التوريث"
author = "ياسر ابو عمار"
posted = "2006-10-20"
text = "الله ينور يا دكتور ضياء ،ويا ريت كل المثقفين او اللى بيدعوا الثقافة يكونوا بنفس النزاهة عندما يكتبون عن الاخوان ،واحب اقول لجميع الاخوة الذين يصطادون فى الماء العكر ،يا جماعة ،الاخوان لم ولن يوافقوا على التوريث ،لو قرات تصريحات الدكتور حبيب بشكل من الاريحية وعدم اخذ موقف مسبق هتعرف -لو حبيت -ان الراجل بيقول للشعب المصرى اتحركوا ،الاخوان لوحدهم مش هيقدروا يعملوا حاجة ،اما ان الكل يروح يشرب عصير قصب ويقول ان الاخوان موجودين وهيمنعوا التوريث فهو ده اللى مرفوض ،لازم الكل يتحرك ،اما ان الاخوان يكونوا المسئولين لوحدهم عن مقاومة التوريث فهذا امر غير معقول او مقبول ،التوريث لن يتوقف الا لو تحرك الشعب المصرى كله ،الدكتور حبيب احب انه يقول المعنى ده ،علشان ما حدش يبنى احلام فى الهوا ،اما انه الاخوان وافقوا على التوريث فهذا امر مرفوض ولم يقله اى واحد من الاخوان فضلا عن قادتهم ،ارجوكم افهموا كلام الناس وبلاش مزايدة الله يكرمكم ،احسن الواحد قرب يتجنن من بعض الاخوة اللى لابدين فى الدرة للاخوان ،ينتظرون اى تصريح فيروح رازع الكلمتين اللى عنده على الجهاز ببواسطة كلمة \"لصق \"دون النظر الى القضية او الموضوع ،المهم اشتم يا جدع فى الاخوان ،وكان الشتيمة فى الاخوان هى الطريق الى تحرير الاوطان من الذل والاستعباد الذى تعيش فيه ،احب اوجه سؤال اخير؛ لما الاخوان وافقوا على التوريث امال تسمى القاء الدكتور العريان ومرسى وغيرهم فى السجون لغاية دلوقتى ايه ،واعادة اعتقال الدكتور حسن الحيوان تسموها ايه ،والمطاردات اللى كانت مع بداية رمضان واغلاق المكتبات الاسلامية والاستيلاء منها على بضائع بالاف الجنيهات تبقى ايه ،استراتيجية للتغطية على الاتفاق اللى ابرمه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061355/http://masr.20at.com:80/article.php?sid=1072"

[[comments]]
order = 9
subject = "الأخوان هم سبب أنفلونزا الطيور"
author = "خالد أحمد"
posted = "2006-10-20"
text = "دائما ما كانت تستفزنى التعليقات النص كم التى يطلقها الأخوة أياهم-أولاد- رفعت السعيد- عندما تأتى سيرة جماعة الأخوان المسلمون فتجدهم يتعاملون معها بطريقة ال--تلهيك وتجيب اللى فيها فيك وألا فليخبرنى أحدهم سواء من الناصريين أو اليساريين أو اللبراليين متى كانت هناك وقفة وطنيةفى سبيل هذا البلدولم يكن الأخوان فى مقدمة الصفوف معرضين أنفسهم وأولادهم وأرزاقهم للخطر الأن وعلشان حبة عيال صار الأخوان هم سبب الهم والغم الذى تعيشه مصر وهم المتحالفين مع النظام أوهم الذين روضوا الشعب على القبول بالأستبداد عموما ماذا سننتظر أن يقول من تربوا على مقالات عادل حمودة وكرم جبر حمدى رزف غير هذا 00"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061355/http://masr.20at.com:80/article.php?sid=1072"

[[comments]]
order = 10
subject = "تعصب كالعاده"
author = "مظلوم"
posted = "2006-10-20"
text = "كعاده من يتحمس للاخوان ، تجده متعصب جدا لهم ولفكرهم (الذى ليس بالضروره الفكر الاسلامى الصحيح) ولا يقبل الجدل و النقاش مع ان الدين الاسلامى نفسه اباح النقاش والاختلاف فى الراى<br />فمثلا عم خالد احمد ماذا غير الاخوان فى مصر وماذا اضافت عن هؤلاء الناصريين أو اليساريين واللبراليين الذى تتكلم عنهم ، فقط صوتهم اعلى ، يمتلكون موارد ماليه ضخمه (لا تفهم من اين) ولا تقل لى وحياتك تبرعات اهل الخير ممن يعملون على رفعه الاسلام ، فهذا كلام غير مقنع وساذج<br />انا لا اقرا لعادل حماده ولا كرم مثلثات ولا حمدى زفزف هذا (هو مين ده اصلا!) ولكن يعنى هو اللى يعترض على الاخوان كفر ، مع الاسف هذا ما نجح فيه الاخوان بامتياز ، ان يجعلوا من انفسهم صوره الاسلام الصحيح فكل من خرج عليهم فقد خرج عن الاسلام اذا فهو كافر.<br />وبالنسبه لنقطه التضحيات الاسطوريه التى تتشدق بها هذه ، ليس كل عدو عدوك فهو بالتالى صديقك ، يعنى مثلا صدام حسين كان طاغيه باعتراف القريب قبل الغريب ، فهل هذا يعنى بالضروره ان بوش الذى اطاح به هو رمز العدل و السلام؟؟؟ فاذا كان الاخوان يعادون الحكومه فهذا لا يعنى ابدا ان يكون هذا لصالح الشعب."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061355/http://masr.20at.com:80/article.php?sid=1072"

