subject = "للمدافعين عن الإخوان"
author = "تضحيات الإخوان التى تتحدث عنها لم نرى لها أى تأثير على أوضاعنا المهببة فى مصر . بل نتذكر جيدا أن الإخوان هادنوا النظام أيام إنتخابات الرئاسة وهذا حدث قريب جدا ويتذكره الجميع . هل يمكن أن نسألك سؤال واضح وصريح :"
