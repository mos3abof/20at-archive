text = "كفاية هجوم على الإخوان يا مأجورين من اليهودية أم الشاذ المدمن أسألوا أنفسكم ماذا قدك لكم مبارك أو زوجته المجنونة أو إبنهم الشاذ المدمن غير النهب والفساد والمحسوبية والقمع والإرهاب لمدة 26 سنة ثم يحاولون توريث الحكم للإبن الفاسد إسألوه رصيده أصبح كام مليار وجابهم منين هو ولا أبوه ولا أمه ولا أخوه كل إللى بيعملوه ده علشان يقضوا على آخر صوت لرفض الإبن والدفاع عن أرض مصر الغالية أسألوا أنفسكم متى وقف الإخوان لصد هجوم العائلة القذرة اللامباركية عليهم بالإرهاب كما يفعلون بهم ولكنهم يحاربون بإظهار حقيقة فساد مبارك وعائلته ومحاولتة لتوريث الحكم للمختل عقليا الشاذ المدمن أسألوا أنفسكم كيف أصبح حال المصرى فى عهدهم الفاسد لتعرفوا من وراء الهجوم على الإخوان أسألوا أنفسكم ما الفرق بين حال مصر الأن وحال مصر أيام الإحتلال الإنجليزى لتعرفوا أنه لا يوجد فرق فالمصرى يضرب بحذاء مبارك وإبنه وينهب هم لا يختلفوا كثيراً عن أى محتل بعد أن أصبح وجودهم فى الحكم بالتزوير والإرهاب ياشباب مصر أفيقوا لهذا المسلسل الحقير من أفساد مصر ليورثوا الحكم للحقير والمختل"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061355/http://masr.20at.com:80/article.php?sid=1072"

[[comments]]
order = 16
subject = "ولا تحسبن الله غافلا عما يعمل الظالمون"
author = "مجدى اليمانى"
posted = "2006-10-21"
text = "بسم الله الحق 00قال رسوله الله صلى الله عليه وسلم (ان الرجل يقول الكلمه لا يلقى لها بالا تلقى به فى جهنم سبعين خريفا )الى اخوانى الاعزاء وكل من يتهكم على الاخوان بانهم السبب فى جبن الشعب اى شعب هذا او ليس من قال عنه الشعراوى فى الكلمه التى قالها بمناسبه نجاة السيد الرئيس من محاوله الاغتيال فاكرين 00حكومه وحزبا ومعارضه ورجال 0000وشعبا اسفا ان يكون سلبيا000اود ان اسئل عن مجمل عدد الضحايا الذين قدمتهم احزاب المعارضه والحركات السياسيه فى مصر وعدد شهداء الاخوان ومعتقليهم00انا ما قولتش انهم ما فيش غيرهم على الساحه ولكن انظرو لهم ولغيرهم من القوى السياسيه المعارضه ستجدون الفرق الشاسع ولا اعتقد ان كل من كتب التعليقات السالف ذكرها من العلمين ببواطن الامور حرام تضيعو 80سنه كفاح من اجل هذ البلد هباء منثورا واخيرا لكى الله يامصر"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061355/http://masr.20at.com:80/article.php?sid=1072"

[[comments]]
order = 17
subject = "إلى الأستاذ مجدى اليمانى"
author = "م.عبد الحميد"
posted = "2006-10-21"
text = "قمنا بعمل استبيان على قبول الشعب المصرى لإبن الرئيس أو لأحد مساعدى الرئيس وكانت النتيجة كالآتى .<br />3 % مؤيدون<br />97% معارضون<br />السؤال الثانى الذى سألناه للمعارضين هو هل لو وجدوا مظاهرة ضخمة ضد التوريث هل سيخرجون ويشاركون فيها .<br />النسبة التى أحابت بنعم :<br />70 %<br />والباقى أيدوا المظاهرة ولكنهم لديهم أسباب تجعلهم لا يستطيعون .<br />* ملحوظة : سوف نوقف حملتنا على الإخوان حتى نتأكد من خلفيات تصريح نائب المرشد )"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061355/http://masr.20at.com:80/article.php?sid=1072"

[[comments]]
order = 18
subject = "حقائق عن الحملة على الإخوان"
author = "م.عبد الحميد"
posted = "2006-10-21"
text = "هناك مئات من الجماعات التى تعمل من خلال شبكة الإنترنت لمنع التوريث لنجل الرئيس أو لأى من مساعدى الرئيس . ونحن جماعة من ضمن هذه الجماعات لا ننتمى لأى حزب أو جماعة وإن كنا فى السابق من المؤيدين بشدة لتولى جماعة الإخوان الحكم للأسباب الآتية :<br />1 - قام نظام مبارك بتدمير مصر تقريبا ، وبعد زوال هذا النظام سنحتاج لجماعة قوية تتصف بالأمانة لتولى مسئولية إنتشال البلاد من هذا النفق المظلم الذى أوصلنا إليه مبارك .. لقد قام نظام مبارك على مبدأ إفساد الآخرين لضمان بقائه فى السلطة ، لهذا السبب كما نرى جميعا فجميع قيادات الجهاز الإدارى وقيادات الشرطة قيادات فاسدة وهم يأخذون مرتبات وحوافز كبيرة جدا تصل إلى 400 ألف جنيه فى الشهر الواحد فى الوقت الذى لا يجد ملايين الشباب عمل ب100 جنيه فقط فى الشهر ، لذلك فبعد زوال هذا النظام ستقابلنا مشكلة رهيبة ألا وهى هؤلاء المفسدين الذين يديرون الدولة . وعليه فنحن نؤيد تولى جماعة الإخوان للحكم خصوصا فى السنوات الأولى وذلك لأن لديهم من الكوادر الشريفة ذات السمعة الطيبة ما يمكنهم من إعداد نظام جديد لإدارة البلاد يعتد على وضع الرجل الكفء الأمين فى المناصب الإدارية العليا .<br />2 - السبب الثانى الذى يجعلنا نؤيد الإخوان هو حجم تضحياتهم خلال الثمانين عاما الماضية وهذا يذكر لهم ...<br />إذن لماذا قمنا بحملتنا تلك ؟<br />بدأت حملتنا تلك بعد بيان نائب المرشد وكذلك بعد إطلاعنا على حوار أحد الإخوان المنشقين مع المهندس الشاطر ومن خلال خبرتنا نستطيع أن نؤكد صحة هذا الحوار .. أى أن حملتنا لم تكن موجهة إلى الإخوان كجماعة بل إلى نائبى المرشد على أساس أنهما يتحكمان تقريبا فى القرار الإخوانى ...<br />ولقد توقفنا عن الحملة مؤقتا حتى نتأكد من تلك المعلومات التى تقول أن نائبى المرشد قد اتخذا<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061355/http://masr.20at.com:80/article.php?sid=1072"

[[comments]]
order = 19
subject = "من يسب الاخوان .. لصالح من"
author = "ابراهيم سامي فلسطين"
posted = "2006-11-02"
text = "السلام عليكم<br />احبتي في الله كان الأحرى بكم قبل ان تفكروا في سب الأخوان وشتمهم ان تفكروا كيف تعملون لخدمة هذا الدين ونصرته... واتعجب كيف سلم من السنتكم اليهود وامريكا ولم يسلم اخوانكم منكم ...<br />ولا ادعي العصمة لأحد كما لا انكر على احد ان يعترض وان يخطئ غيره فضلا عن ان يقدم له النصيحة وليس السب والطعن والشتم فهذا ليس من ديننا ولا اخلاقنا<br />والسلام"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061355/http://masr.20at.com:80/article.php?sid=1072"
