text = "جميله اوى مجموعه السينريوهات اللى تفضلتى بتخيلها بس اجملها او اكترها توافق مع العصر الحالى عصر العولمه هو ان لشهراذاد عاشق يعشقها وتعشقه وهو اللى حيقوم بالمهمه بس على فكره وانا بقراء هذه السيناريوهات مش عارف ليه تذكرت قصه كلينتون ومونيكا"
