subject = "بغداد"
text = "كنا سابقا نقول ان الفساد ياتينا من الغرب ، ولكن دعونا نتامل الواقع اليوم قبل ان نلقي بمشاكلنا على الاخرين،بل ان غالبية القنوات الغربية هي افضل بكثير من الكثير من قنواتنا الفضائية العربية،فلماذا نضع اللوم كله على ساقطات وجدن من يروج لهن ونترك هؤلاء المروجين.<br />اتمنى ان نوجه الخطاب لهم وليس للعاريات لان الخطاب معهن دون جدوى.<br />فخاطبوا المسؤلين يرحمكم الله.وشكرا..اخوكم من العراق كريم الجعفري"
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025230351/http://www.20at.com:80/article.php?sid=127"

