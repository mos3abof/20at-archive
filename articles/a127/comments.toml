[[comments]]
order = 5
subject = "الشمحطجى__ shamahtagi@hotmail.com"
text = "يا عم الحاج انا سبق و قلت ليكو سيبو الناس فى حالها تاكل عيش<br />و الى مش عاجبه مايتفرجش... ثم انت مزعل روحك ليه خلو الناس تنبسط و تفرفش هى راح تبقى ضنك من جميع النواحى<br />انت تعرف هز الوسط الى مش عاجبك ده بيكسبو من وراه كام ..كتييييير<br />و قال زعلانين علشان خط الوسط بتاع الاهلى مهزوز<br />\" مع ان هز الوسط هو الى بيجيب فلوس فى الزمن ده\"<br />زائد كمان العالم الى فنانين بجد زى ما أنت بتقول نقول ليهم \" الى بيته من ازاز ميحدفش الناس بالطوب\"<br />زائد الى يكتب موضوع زى ده لازم يبقى ليه دعم بالصور و الادله.... ورينا ياسيدى !<br />و لما انت بتهاجم العرى تقوم حاطط صورة عنتر هلال و هو راسه عريانه بالشكل الفظيع ده..!<br />يا راجل عيب !!!<br />و مرحب بأى رأى حر جرئ على الميل بتاعى"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053734/http://www.20at.com:80/article.php?sid=127"

[[comments]]
