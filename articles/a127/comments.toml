subject = "النورى"
text = "يعنى ايه لمؤاخذة جمعية تحريض النساء على الفضيلة دى هيا نسوانا يعنى ماشية تتشخلع فى الشوارع يا راجل عيب عليك كده ، هو يعنى علشان كام بت لابسين بديهات فى الشوارع ،على كام استرتش على كام سبنش بنطلون وحاجات فوق السرة او قبلها بنص متر كل ده شىء عادى ومريح للنظر كمان انما نسوانا اشرف من الشرف حتى لو كنت كل ما تمشى ولا تركب مواصله تلاقى اتنين لازقين فى بعض بسريسيون برضه اشرف من الشرف ويا كده ييحصل لك زى ما حصل للبغبان الرخم لو حبيت تعرف ايه اللى حصل له اتصل بيا"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053734/http://www.20at.com:80/article.php?sid=127"

