author = "نيفين نيفى نوفا"
posted = "2007-06-09"
text = "طول عمرى و لحد دلوقتى كل ما بيتذاع فيلم شارع الحب و ييجى المشهد بتاع اغنيه نعم و حد يقول (منعم مش هيقدر يغنى بدون مايسترو)و يطلع عبد الحليم بتعبيراته الحزينه و طريقته الشهيره ف الكلام و يقول (خلاص يا جماعه متتعبوش نفسكو…)بسال نفسى ساعتها هو مش كل فرد ف الفرقه معاه نوته بيمشى عليها و لا المايسترو وظيفته انه يعطى اشاره البدء لكل فرد على حده<br />و هل لو اتعمل بروفه نستعيض ساعتها عن المايسترو و لا لازم<br />و مع انى بحب الموسيقى عمرى ما فكرت ادرسها فياريت يا مروه لو عارفه تقوليلى و لو اى حد دارس يرد عليا"
archived = "2009-05-05"
capture_url = "https://web.archive.org/web/20090505164254/http://www.20at.com:80/klam-rosas/6214.html"

