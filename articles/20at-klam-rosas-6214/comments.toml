text = "مهما مرت السنين على رحيل العندليب فلن ينسا احد ابدا اغانيه العاطفية المصحوبه بالشجن فعندما ارى اغنيه نعم يا حبيبى نعم ابكى من شدة تاثرى بها ومدى احساس العندليب فى ادائها امنيتى الحقيقية ان اكون خليفة العندليب وان اغنى فى الاوبرا المصرية فانا صاحب صوت جميل يشبه الى حد ما صوت العندليب بس مش عارف اوصل لحد علشان يسمع صوتى فهل من مجيب انا من محافظة دمياط رقم التيلفون 057690985"
