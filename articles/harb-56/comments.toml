subject = "معك يا منقذ العرب يا سيدى حسن نصر الله"
author = "احمد عمر"
text = "انا مع السيد حسن نصلر الله قلبا وقالبا اسرائيل معها قوه كبيره لكن السيد حسن نصر الله معه ما هو اقوى وهو الجبار القاهر المعز المذل الله سبحانه وتعالى (ان ينصركم الله فلا غالب لكم)"
archived = "2006-09-03"
