[[comments]]
order = 28
subject = "لماذا بكى السنيورة و لم يبك حسن نصرالله ..."
author = "ur tunisian brother"
text = "لم تكن دموع السنيورة تمثيلية ابدا بل كانت معبرة إلى درجة رهيبة فهذا السياسي ينتمي إلى مدرسة تعتمد في اتخاذ قراراتها إلى العلاقات الديبلوماسية و القوانين الدولية و كان و صول السنيورة لهاذا المنصب و كل ماقام به إلى حد الأن من إنجازات على المستوى الداخلي و الخارجي في لبنان بناءا على هاته القواعد فظن مخطأا انه كرئيس حكومة دولة صغيرة واقعة في منطقة تجاذبات بإمكانه ان ينجح ببعض الديبلوماسية ان يحقق السلم لبلده و بالتالي سيقوم إنجازات اقتصادية الخ الخ الخ و يصبح في الأخر زعيما لبنانيا تاريخيا ( إن بعض الظن إثم ) و لكن مع هذه الحرب الاخيرة تبين لهذا المسكين انه في الحقيقة مجرد اداة بين مختلف اللاعبين الحقيقيين في لبنان و الشرق الاوسط ( سوريا , امريكا , فرنسا ,....) و ان ما يمكن ان تقوم به مجموعة من مقاومي حزب الله هو اكثر تاثيرا من علاقاته الديبلوماسية او من حنكته السياسية ... و للاسف اكتشف السنيورة هذه الحقيقة متاخرا إذ راى انه ليس بإمكانه انتاج اي ضغط لا على الدول العظمى و لا على المؤسسات الدولية في حين ان صمود بضع شباب في الجنوب البناني يمكن ان يغير كثيرا من القرارات الدولية و من مواقف الدول نفسها ... و لذلك نجد ان نصرالله لم يبك لان حساباته منذ الاول كانت قائمة على مقدار اسلحته و اعتماده كان على صمود شبابه… ..<br />abdoumbarek@yahoo.fr"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903114650/http://harb.20at.com:80/article.php?sid=56"

