[[comments]]
order = 35
subject = "لقد اصبح سؤالكم لا معنى له"
author = "مارك"
text = "اليوم وبعد الحمد لله ماانتصرنا على العدو الغاشم وضحكنا عليه وسبناله نص بيروت بس ودمرنا معنوياته لأنه كان فى الحقيقه عايز ياكل الكعكه بحالها لاكن على مين دا حنا اديناله درس عمره ما حينساه وعلى فكره النص اللى خده احنا سبناهوله بمزاجنا يعنى احسن حد يفكر كده والا كده..دااحنا برضه اللى هوه!!!!!!!!!!!!!يا ناس حرام عليكم ..طول ماحنا ما بنعترفش بأخطائنا وبهزميتنا مافيش فايده..عمرنا ماحنا نافعين...شوفوا اسرائيل رغم كل البهدله اللى بهدلتها للبنان الا انها شكلت محاكمه لقادة الجيش بتاعها لأنهم قصروا فى اداء عملهم..واعترفت بالثغرات اللى حصلت..ولا تتورع فى محاكمة من تثبت ادانته او تقصيره فى خلال هذه المحاكمه..واحنا بقى نعمل ايه؟؟؟!!ندور على مبررات واهيه...وادعاءات مايصدقها طفل فى الروضه...واكاليل زهور ورايات وتيجان وانتصارات!!منين!!! تعالوا نقعد بلاش نتحاكم...بلاش نحقق ونجازى كل مخطئ...بلاش..تعالوا نشوف انهزمنا ازاى..وليه..وامتى..وفين نقط الضعف..وفين نقط القوه..وازاى نتلاشى الأخطاء دى فى المستقبل...تعالوا نشوف من عليه الدور؟؟؟؟؟؟ونحافظ عليه ازاى..احنا خدنا على اننا نكدب الكدبه ونصدقها..لحد ما عملنا زى جحا..جحا مره قال للعيال اللى عاملين له دوشه عشان يخلص منهم ..عارفين ياولادالراجل اللى فى اخر البلد..قالوله ماله قال لهم بيوزع لحمه ببلاش..العيال صدقت ويجروا والشاطر اللى يقول للتانى لحد البلد كلها ما بقت تجرى فى الشارع سال جحا ايه ياناس فيه ايه..قالوله الراجل اللى فى اخر البلد بيورع لحمه ببلاش...جحا قال الله طب مايمكن الحكايه بصحيح وطلع يجرى ورا الناس علشان يلحقله حاجه...انتوا عارفين ضربنا اسرائيل علقه ما يخدهاش حمار فى مطلع...واوعوا تفكروا انهم نزلوا بيروت يعنى بيروت سقطت ((لا قدر الله )) حتشوفوا حنعملكم فيهم ايه...عمر الحرب ماكنت كده ابدا فى اى تاريخ من تواريخها..الحرب دراسه وهندسه وتكتيك وامكانات..ثم اتكال وليس تواكل..الطالب اللى مش مذاكر مستنى ايه..ربنا ينجحه..الله ليس بظالم..لابد ان يكون هناك اسباب يستحق عليها النجاح..ولابد ان يكون قد اعد نفسهاعداد جيدللنجاح..........<br />......المهم تعالوا ندرس اللى حصل واللى جرى ونشوف ازاى نعالج اللى حيحصل نتيجة اللى حصل........والله يعز عليه بلادى واوطانى وما نحن يه ولاكنى اقر واقع ليت الجميع يقرونه ..واعرض علاجا ليت الجميع يعمل به...وارجعوا الى مقالاتى منذ بدأية هذا الموضوع وستجدونها تحققت بالحرف الواحد..وياريت نخلى بالنا من اللى جاى ...................<br />مارك"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903114650/http://harb.20at.com:80/article.php?sid=56"

