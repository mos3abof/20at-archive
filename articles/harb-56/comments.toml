[[comments]]
order = 13
subject = "اما زال في الأمة متعصبين لا يفقهون كلام الرسول"
author = "alia du sud liban"
text = "الى المتعصبين والطائفيين في كل انحاء العالم ادعوكم لتقوى الله وغشيته......ان الوقت الذي نحن فيه حساس جدا\\\" ويتطلب وقفة المسلمين بعضهم الى جانب بعض .......لا تستحق المقاومة هذا التحجر الفكري عند البعض بل تستحق الدعاء والوقوف جنبها ودعمها بما نقدر عليه ......وما المشكلة في انها من المذهب الشيعي ..!!!!!ان الله دعا اهل الكتاب الى كلمة سواء فكيف بالمسلمين.....وخاصة الشرفاء منهم والمؤمنين...فلنتقي الله ولنعلم اننا واقفون يوم القيامة للحساب وسنسأل هل نصرنا اخواننا في لبنان وفلسطين والعراق اما ....انشغلنا في خلافتنا ودعينا على بعض عوضا\\\" ان ندعي لبعض........ايها الغافلون عن كلام نبيكم الذي طلب منا ان ننصر الاسلام والمسلمين....اين انتم من نظرته اليكم يوم القيامة......ايها المتعصبون لا تستمروا في غييكم وحقدكم على الشيعة مهما اختلفتم معنا في الأراء واجبكم الأن ان تنصروا المقاومة ........ثم لا اعلم كيف تسيطر عليكم افكار الغرب التي تزرع الحقد في نفوسكم وهو انه لا يجب نصرة حزب الله لانه شيعي ومدعوم من ايران .......يا للعجب اترفضون ان تقف الدولة الاسلامية الى جانبنا فقط لانها دولة شيعية لماذا ايها(بعض السنة هداكم الله ) لا تقفون بوجه السعودية الداعم الاول لأمركا...انا لا اريد ان ازيد الفرقة بيننا لان سيد المقاومة علمنا ان الله لا يقبل منا هذه التصرفات ولا يرضاها....ان اريد ان نتوحد لنصرة حزب الله لنفرح قلب رسولنا بنا ونخزي الأعداء وندحر الصهاينة عن ارض فلسطين ( ملاحظة اخيرة حماس من اخواننا اهل السنة والداعم الوحيد لها هم نحن الشيعة!!!!! فاستيقظي يا امة استيقظي وتذكري ان لنا رب واحد كتاب واحد كعبة واحدة تجمعنا كل سنة وان نبينا محمد واحد والخلافات لا مكان لها بيننا."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903114650/http://harb.20at.com:80/article.php?sid=56"

