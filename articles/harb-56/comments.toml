subject = "لماذا لو سقطت قريبا القاهره"
author = "ابن الجليل"
text = "لماذا اخترتم هذا العنوان الذي يدل على هزيمتكم وخوفكم ورعبكم انتم فقط اهل الكلام واهل الفتاوى التي تاتي غطاء للجرائم ضد الاسلام اي اسلام انتم اي عرب انتم لاي طائفه تنتمون اين كرامتكم اين انتم يا اهل كلمة الله اكبر ام انتم ذللتم انضرو الى اوروبا فهي تخرج في الملايين للتظاهر اما انتم فعدد سكان مصر 80 مليون لا يخرج منكم سو ى القليل وتحصرون داخل الازهر وتندس كرامتكم وتضربون بالنعال ان النصر ات باذن الله وليس من بلادكم بلاد الخيانه لقد اجتاحها نابليون فالشعب اللبناني ليس بحاجه لكم فاستمرو في سباتكم العميق مع بقرتكم الضاحكه التي تقودكم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903114650/http://harb.20at.com:80/article.php?sid=56"

