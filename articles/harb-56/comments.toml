[[comments]]
order = 33
subject = "شالو الدو وجابو شاهين"
author = "مارك"
text = "ما اروعنا فى الكلام..ومااسهل ان نضع على رؤسنا اكاليل النصر وهى تيجان من اشواك..بيروت محاصره..والضرب من البر والبحر والجو..والخسائر تتوالى امام عيوننا..ونحن نتبارى احاديث النصر ورايات الأبتهاج..اى نعامة هذه التى تدفن رأسها من الصياد فى الرمال..يا ساده ان بيروت تنهار والغرب يلهو ويتشدق بوقف اطلاق النار الذى لن يحدث الا ونحن جثة هامده..والشرق يغنى ويتباهى تارة ..ويتشاجر ويتناحر تارة..ويتباكى ويتظاهر اخرى..ثم نقوم بعمل استفتاء ماذا لو انهارت بيروت؟ولحفظ ماء الوجه نضيف (لا قدر الله)..الله يعين من يسعى..يقوى من يعمل ..ولكنه لا يعين متقاعس متخاذل..ولا يساعد متهاون متكاسل..لن يوقف الغرب اطلاق النار الا وبيروت جثة هامده..هل عندكم شك!!!!لن تسكت اسرائيل ..وبعدهاتفاوضنا وتشطب الألف واللام...هل تعرفون قصة الألف واللام..انه الفرق بين الأنسحاب من اراضى عربيه والأنسحاب من الأراضى العربيه؟؟!!...لنقف وقفة رجل واحد لاسنى ولا شيعى..لا مسلم ولا مسيحى..وانما جنود ذاقوا مرارة الحرب ..ولتكن اول ضربه لأسرائيل هى وحدة الكلمه..ثم طلقة مدفع واحد من الجميع تقسم ظهر البعير ..فهل استوعبنا الدرس ..والا لسه مفاوضات واجتماعات ..واللى نبات فيه نصبح فيه ..كفايه كلام..حان وقت العمل..وهل وجود قوات دوليه انتصار..والا زى زمان شالو الدو وجابو شاهين؟؟؟!<br />مارك"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903114650/http://harb.20at.com:80/article.php?sid=56"

