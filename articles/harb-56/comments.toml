[[comments]]
order = 23
subject = "وما نيل المطالب بالتمنى ولكن تؤخذ الدنيا غلابا"
author = "مارك"
text = "هل نحن حقا لا نعرف نتيجة الحرب؟؟ مصيبة ان دخلنا حربا بدون اعداد او استعداد!!!وانكى واشد اننا لا نعرف نتيجة هذه الحرب!!<br />كيف لا تعلمون نتيجة الحرب ونحن نبحث عمن يوقف اطلاق النار؟؟؟؟كيف لاتعلمون نتيجة الحرب ونحن نتعجل قوات حفظ الأمن لسرعة الأنتشار؟ كيف لا تعلمون نتيجة الحرب وهناك ثلاثة مليارات من الجنيهات يحتاجها لبنان لأعادة تشييده كما يحتاج الى ثلاث سنوات لأتمام هذا التشييدحسب تقديرات الخبراء العسكريين؟كيف لا تعلمون نتيجة الحرب وهناك الآلاف من الضحايا؟؟ كيف لا تعلمون نتيجة الحرب وقد دخلت قوات العدو الى احد مدن لبنان واخذت من ارادت وخرجت ؟؟كيف لا ندرى نتيجة الحرب وقد دمر جيش العدو كل طرق الأمداد بين لبنان وجاراتها؟؟ كيف لا ندرى نتيجة الحرب وقد شك الكل فى الكل وسب الكل الكل وخون الكل الكل؟؟ كيف لا ندرى نتيجة الحرب ونحن غير قادرين على تجميع كلمتنا؟؟؟<br />لقد دخلنا حربا بلا دراسه..بلا تخطيط..بلا اعداد..بلا استعداد..بلا ترابط..وكنا نتمنى ان نجدبصيص امل نخدع انفسنا به ولو الى حين ولكن لعن الله الدش والقمر الصناعى الذان حرمانا حتى مجرد خداع انفسنا......<br />كفانا طبل وزمر ولنتذكر:<br />وما نيل المطالب بالتمنى ولكن تؤخذ الدنيا غلابا<br />مارك"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903114650/http://harb.20at.com:80/article.php?sid=56"

