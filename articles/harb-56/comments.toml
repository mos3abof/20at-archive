subject = "ماذا لو"
author = "نيفين نيفى نوفا"
text = "لو سقطت بيروت اللى هيحصل كالتالى<br />بعد البكاء الشديد<br />و استدعاء تاريخ الصهيونيه الاسود بدايه من وعد بلفور مروراببحر البقر و دير ياسين و مذابح الاقصى و و و<br />و بعد تذكر بغداد<br />و اليوم الاسود بتاع تمثال صدام<br />و بعد كام يوم ف حزن و مظاهرات فرجه على الجزيره ا<br />اللى هيحصل كالتالى<br />صمت تام<br />يعنى هنلاجع لحياتنا<br />و هندوب ف المشكلات<br />و هنعضيف لذكرياتنا السودا يوم جديد<br />و هو يوم سقوط بيروت"
