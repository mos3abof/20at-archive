[[comments]]
order = 1
subject = "إن تنصروا الله ينصركم"
author = "مؤمن"
text = "بسم الله الرحمن الرحيم.<br />من رأيي كمواطن لبنباني و من الجنوب.<br />أقول:<br />إنطلاقاً من عقيدة الجهاد و ملحمة الإمام الحسين(ع) لو استشهدنا جميعاً فإنّه إنتصار الدم على السيف.<br />نحن أولاد موسى و عيس و محمّد وعلي الحسن و الحسين و أصحاب محمّد(ص).<br />و إن كان لبنان يعدّ من الدول الجميلة في العلم العربي إلا أنه لم و لن يخسر شرفه و كرامته.<br />إن دخلت إسرائيل فنحن لا نبالي لا بالعذاب ولا بالموت لكنهم يخافونزفقتالنا قتال عقائدي لكن قتالهم دنيوي. لهذا فإنهم لن يستطيعوا تخطي الشريط الحدودي لأننهم هناك لن يجدوا حزب الله فقط يقاتلهم."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903114650/http://harb.20at.com:80/article.php?sid=56"

[[comments]]
order = 2
subject = "نحن معا الحق"
author = "اسامة السعدونى"
text = "نحن معا الحق دئما ومعا حزب اللة فى وجة العدو الصهيونى ولابادة الكيان الكيان الصهيونى من الشرق الاوسط واذا تكلمنا عن قوى حزب اللة نجدة اقوى بكثير من جيوش وعداد دول متقدمة بالنسبة لامكانيتة وحدودة فماشاء اللة هم لهم الغلبة والنصر ومن مصر نتمنى لهم النصر والثبات كما اتمنى لهم التوفيق اكتر مما هم علية الان"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903114650/http://harb.20at.com:80/article.php?sid=56"

[[comments]]
order = 3
subject = "شو هالعنوان الحقير و المشبوه"
author = "العمى يلي يعميكم يا عرب"
text = "\\\"سقطت بيروت\\\" بعيدة عن رقابكم و رقاب اسيادكم و للمعلومية فأن بيروت صمدت بوجه العدو الصهيوني عام 1982 مدة ثمانين يوما فما بالك اليوم عام 2006 و بوجود قيادة صلبة للمقاومة على رأسه المناضل حسن نصرالله.<br />نرجو التوضيح ما اذا كان دور هذا الموقع دعم المقاومة أو دس السم بالعسل. و قد لاحظت أن بعض التعليقات ذهبت بإتجاه نقاشات مذهبية عقيمة و تافهة و مشبوهة جدا"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903114650/http://harb.20at.com:80/article.php?sid=56"

[[comments]]
order = 4
subject = "دعونا نقاتل معكم"
author = "عبدالله"
text = "ألا إن حزب الله لهم الغالبون هذه فرصة يرجى السماح للشباب المسلم الحر بالخول والانتشار في جبال لبنان والهجوم الجماعي على القرده والخنازير فإني أعرف أن في شبابنا قوة وحيله لا توجد عند شعب مسجون دعوهم ينتشروا وسترون ليس فقط جنوب لبنان يتحرر بل فلسطين بأكملها فقط دعوهم يدخلون وخاصة الشباب الشجاع من اليمن ومن مصر ومن شباب الجزيرة العربيه وسترون عجائب قوة الله في الصهاينه لا أدري هل سيسمح الاخوة المجاهدين في حزب الله والنصرة لنا جميعا سنة وشيعه ومهما صار فنحن جسد واحد كل له وظيفة وأخيرا أسأل الله أن ينصركم عاجلا غير أجل ويدحر فلول الاوباش عن أرضكم وسيكفيكهم الله ."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903114650/http://harb.20at.com:80/article.php?sid=56"

[[comments]]
order = 5
subject = "ربنا يحميها .."
author = "abougafar"
text = "وأن سقطت بيروت لا قدر الله فقد سقطت قبلها الرياض والقاهرة وعمان فى محك القيادة لهذه المنطقة الموبؤة بداء عشق العروش وان كانت قرابينهم مقدرات شعوبهم.!!وأن سقطت (لاقدرالله)..فقد سقطت بغداد بفعل فاعل.الخرطوم تنوءمن أقليات تفتت أوصالها؟؟دمشق مكممة القول والفعل مقدشيو تستضيف أديس أبابا رغما\\\" عنها ..وأن سقطت (لاقدر الله) فقدسقطت عواصم أخرى من ألذاكرة العربية..دعونا نتكاتف أن لا تسقط الأمة كلها من الخريطة الكونيةالمستعرةالأنياب على كل ماهو اسلامى وعربى ..<br />أدعوا معى ربنايحميها ويحمى أمتنا جميعا\\\""
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903114650/http://harb.20at.com:80/article.php?sid=56"

[[comments]]
order = 6
subject = "لن تسقط بيروت و لا لبنان الحبيب"
author = "بنت مصرية"
text = "إن شاء الله لن تسقط بيروت مادامت تجري في عروقنا الدماء العربية و لن يستطيع عدونا الغاشم اشعال الفتنة بداخلنا فنحن في مصر بالرغم من أننا ليس بيننا شعية كثيرون إلا أننا كلنا مع حزب الله لأنه يدافع الآن عن إعلاء كلمه الله و حتى تكون كلمة الله هي العليا و كلمة الذين كفروا السفلى و والله الذي لا إله إلا هو إنى لأتمنى أن يفتحوا لنا باب الجهاد حتى نذهب هناك و نقاتل أعدائنا مع إخواننا من حزب الله و حتى نعيد لأمتنا كرامتها التى أهدرت بأيدي حكامنا العملاء . نصر الله إخواننا من حزب الله و الذين معهم و رزقنا جميعا الشهادة في سبيله"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903114650/http://harb.20at.com:80/article.php?sid=56"

