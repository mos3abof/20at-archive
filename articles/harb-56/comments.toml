text = "نحن كشعب عربي بشكل عام و كشعب لبناني بشكل خاص ضد هذا العدوان الإسرائيلي الغاشم, وإن شاء الله نحن ننتظر نصراً مؤزراً من عند الله, رغم أننا تكبدنا خسائر فادحة في صفوف المدنيين وإنه لجرح كبير, إن دل على شيىء فإنما يدل على أن العدو قد أخفق في عملياته العسكرية, فبات يستهدف المدنيين بحجج لا تبرر.. ولكننا نترقب النصر إن شاء الله على يد قادة أقوياء صادقين مع أنفسهم لا يشعلون النار في بلادهم.. بل هم رجال ما زلنا نبحث عنهم إلى يومنا هذا كأمثال صلاح الدين...."
