text = "بين صدام و حسن نصر الله لان نصر الله عنده ميليشيات مش جيش نظامى و يقدر يستدرج الحيوانات لحرب شوارع تبهدلهم و تطلع عينهم و تجبرهم على الإنسحاب و\\\"لو\\\"دخلوا بيروت حيحصلهم زى ما حصل للامريكان و مش حيقدروا يوصلوا لحسن نصر الله لانه ليه شعبية كبيرة و تنظيم كبير و ما حدش حيخونه و حيجبرهم على الإنسحاب"
