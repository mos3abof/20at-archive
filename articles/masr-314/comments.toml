subject = "خليك فى الحمام يا كيمو"
author = "الجن"
posted = "2006-05-19"
text = "القصيدة فعلا لصلاح جاهين ياحاج كيمو وانا رايى تخليك فى الحمام"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910174042/http://masr.20at.com:80/article.php?sid=314&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "الى كيمو العفريت"
author = "ولاء الشملول"
posted = "2006-05-20"
text = "القارئ الصديق كيمو..<br />ترجو أن تعود إلى ص 193 من ديوان \"أشعار العامية المصرية\" للمبدع الراحل صلاح جاهين الطبعة الثانية الصادرة فى 1993 من مركز الأهرام للترجمة والنشر...لتتأكد بنفسك من صاحب القصيدة...<br />أما بيرم التونسي فله أعماله المبدعة الكثيرة..لكن ليس منها هذه القصيدة...وهو استاذ صلاح جاهين بالمناسبة...<br />صحيح... من هو صلاح شاهين الذى ذكرته فى كلامك؟؟؟.....<br />الى مش مشغلك..<br />الحمد لله انا بخير..."
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910174042/http://masr.20at.com:80/article.php?sid=314&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "ناديت"
author = "محمود"
posted = "2006-06-20"
text = "ناديت بأعلى صوت و لا جاني رد<br />ناديت على ديمقراطية ماتت<br />و تنمية غابت و عدل تنحى و سياسة تاهت<br />ناديت بأعلى صوت و لا جاني رد<br />على شعب الفقر ذله و الجوع كسر دهره<br />على شعب كان له زمان صوت يرد<br />ناديت بأعلى صوت و لا جاني رد<br />يا ترى هم اللي فقدوا السمع و لا أنا اللي فقدت النطق"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910174042/http://masr.20at.com:80/article.php?sid=314&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

