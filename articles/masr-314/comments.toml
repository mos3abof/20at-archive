[[comments]]
order = 0
subject = "اممممم لو انتي اللي في بالي ..."
author = "مش شغلك ..."
posted = "2006-05-15"
text = "انا وانا صغننه ايام ما كنت \"بغسل رجلي قبل ما انام \" خير اللهم ما اجعله خير قريت قصه كدا في كوكتيل 2000, وخدت جايزه فضيه باين عن \"العيد \" حاجه كدا مش عارفه احساس ان الاسم مشابه او انتي حد قريب , حاجه كدا<br />لو انتي بلاش تكتبي تخاطيف يا بنتي<br />برطحي براحتك في الموقع دا.<br />لو مش انتي الغباء ركبي سمحووووووووها .<br />ولكل بقي يعني هي جات علي القولون بس والكبد والكليه و ...و ...علي اسم مصر ."
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910174042/http://masr.20at.com:80/article.php?sid=314&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "صاحبة الذاكرة الحديدية\\\"مش شغلك\\\""
author = "ولاء الشملول"
posted = "2006-05-15"
text = "نمسك الخشب يا (مش شغلك)...ذاكرة زى الفل...<br />انا فعلا فزت من قبل بجائزة رجل المستحيل الذهبية...من سلسلة (كوكتيل 2000) عن مقال بعنوان : من أوراق شابة حزينة...كانت عن حرب العراق وليس العيد...<br />شكرا لتذكيري بالمناسبة السعيدة...فتمثال رجل المستحيل الذهبي يزين مكتبى حتى الآن ...عقابلك فى جائزة اكبر"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910174042/http://masr.20at.com:80/article.php?sid=314&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "شكرا ياولاء"
author = "مقضيها نت"
posted = "2006-05-16"
text = "شكرا ياولاء على المقالة الجميلة دى وفكرتينا بالشاعر الجميل صلاح جاهين . وبخصوص يوم الاستفتاء انا كنت فى أجازة فى مصر وحضرت وشفت المهزلة اللى كانت عند النقابة واللى لو حصلت فى أى مكان الدنيا تنقلب اما احنا فى زمن الحرية ! فعلا احنا فى زمن الحرية لكن مش لينا الحرية للحكام والنظام واتباعهم يعنى الحرية ل 2% من الشعب المصرى أما ال 98% بصراحة دول ملهمش لزمة عاملين وجع دماغ للنظام وطلباتهم مبتخلصش الاحسن على رأى عمنا ابو النجوم فى قصيدة بوتيكات قال<br />هتقوللى الفقرا ومشاكلهم<br />دى مسائل عاوزة التفانين<br />أنا رايى نحلها ربانـــى<br />ونموت كل الجعانــــــين<br />وشكرا ليكى"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910174042/http://masr.20at.com:80/article.php?sid=314&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "علي اسم ادهم..."
author = "مش شغلك.."
posted = "2006-05-16"
text = "شوفي يا حاجه ولاء انا افتكرلك حاجه بقلها قرن ..<br />تسالني اكلتي ايه امبارح اقولك \"مش فاكرة\" وحتلاقي الكلمه دي في بقي \"يعني فمي\"زي اللبانه ...علي العموم تشرفنا يالولوه ..بالحق ايه اخبار القولون؟؟؟؟ .."
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910174042/http://masr.20at.com:80/article.php?sid=314&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "بسيطه"
author = "ياء"
posted = "2006-05-17"
text = "لو على قولونك بس مش مشكله<br />المشكله فى قلوب 70 مليون واحد<br />المشكله مش فى تعب واحد او 2 المشكله ان مصر نعبانه<br />حد عنده علاجها ؟<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784.blogspot.com<br />yehia2784@hotmail.com"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910174042/http://masr.20at.com:80/article.php?sid=314&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "دامت لمين"
author = "محمد دسوقى"
posted = "2006-05-17"
text = "اقول لكل ظالم هذين البيتين من الشعر<br />هب أن قد ملكت الارض طرا<br />ودان لك العبادفكان ماذا<br />أليس غدا مصيرك جوف قبر<br />ويحنو عليك التراب هذا ثم هذا"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910174042/http://masr.20at.com:80/article.php?sid=314&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "هذه القصيدة لبيرم مش لشاهين"
author = "كيمو العفريت"
posted = "2006-05-18"
text = "هذه القصيدة التي افتتحتي بيها مقالك لبيرم التونسي مش لصلاح شاهين.. لكن الاهم منها هو إحساسك بيها..<br />كنت حاسس وانا بقرا بقيت مقالك إني عايز أدخل الحمام.. مش لان كتابتك وحشة.. ولا لإن عمرو سليم حكى قصته مع بطنه بالغازات من يوم تولي حكومة عاطف عبيد الحكم.. ولا لأن سيرة البعداء جابت لي إسهال.. ولا لإني حاسس إن العيشة في مصر صارت أكل ودخول حمام وبس..<br />أنا عايز أدخل الحمام لأني فعلا مزنوق"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910174042/http://masr.20at.com:80/article.php?sid=314&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
