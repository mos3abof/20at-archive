subject = "الشيخ امام شيخ الفقراء"
author = "ابو على المقدسى"
posted = "2006-06-18"
text = "لهذا العظيم اجمل التحيات وامجد يخر راكعا امام عظمه اهاته وتنهيداته وانغامه المعبره عن عمق الانسانيه المتاصله بهذا المبدع العربى مناره كل التقدميين العرب وةستبقى الحانه واغانيه مهماز لكل بناء عربى سليم واساس متين لدوله العداله العربيه القادمه يوما ما؟؟؟؟ ----التوقيع ابو علي المقدسى-فلسطين-القدس الشريف-ابوديس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153143/http://www.20at.com/article2.php?sid=932"

[[comments]]
order = 9
subject = "عشاق الشيخ إمام في كل مكان"
author = "مريم - مراكش - المغرب"
posted = "2006-06-23"
text = "و نحن اطفال غنينا بقرة حاحا، أكيد لم نفهم مغزاها لكن مع الوقت ادركنا ان الثنائى الشيخ و نجم يغنون آلام و آمال كل العمال، كل الطلبة،كل الوطنيين.<br />مع الوقت تربت آذاننا على لكلمة و اللحن الهادف تعلمنا التمييز بين الفن الهادف و \"الفن\" التجاري.<br />مات الشيخ لكن اغانيه لن تموت و بذلك سيبقى حاضرا معنا دائما."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153143/http://www.20at.com/article2.php?sid=932"

[[comments]]
order = 10
subject = "كان ممكن يقول إيه دلوقتي؟؟؟"
author = "مهند"
posted = "2006-06-29"
text = "يا ترى لو لسه الشيخ إمام عايش كان ممكن يقول إيه في عهد المبروك المبارك؟؟؟ طبعاً عمنا أبو النجوم بيقول لكن ميكرفونه مات الله يرحمه .. عشان كده الراجل (نجم) مش طالع له حس لأن كلامه المغزول بعرق المصريين السكر مقفول عليه وعلى شوية غلابه .. الله يرحمك يا شيخ إمام ويخليلنا عمنا الكبير أبو النجوم وعم كل النجوم .. ويا ريت يسمعنا صوته دلوقتي .. والله عارف إنه حيجلجل ويملا مصر كلها .. بس هو يتكلم ويقول ويسجل .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153143/http://www.20at.com/article2.php?sid=932"
