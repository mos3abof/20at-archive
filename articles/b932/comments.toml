text = "ماد اقول...فعلا كل الكلمات لا تكفي.فقد اكتب كتابا.عن عشقي لشيخ امام ومع دلك لا استطيع ان اعبر عن دلك .لكن كلمت تقدير من كل هؤلاء رفاق و لاءخوان تكفي لدالك كله...شكرا جزيلا لك شيخ امام"
