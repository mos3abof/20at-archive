text = "فعلا يسحقوا ان يكونوا عشاقا لهذا الوطن فاحمد نجم والشيخ امام حققا ثنائية في حب الوطن لم يحققها احد وذلك بفضل كلمات نجم الرائعة التى تتوافق تماما مع المواطن المصري البسيط ضد الغش والنفاق وسياسة قطع اللسان المتمثلة فى حكومتنا المصونة000"
