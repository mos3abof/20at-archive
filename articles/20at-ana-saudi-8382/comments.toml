author = "نونا"
posted = "2008-03-03"
text = "بالعكس تماما انا اعتقد انها طريقة لتوصيل صوتنا الى هناك .. حكوماتنا لم توصل صوتنا و لا اي حد فينا وصل صوت المسلمين ، هؤلاء ابطال يحاولون بما لديهم يعني تخيل كم دنمركي يعمل في هذه الصحف او المواقع سوف يقف لحظة تفكير مع نفسه لماذا فعل هؤلاء الشباب هذا الشي و دفاعا عمن ؟<br />هذا ليس غباء هذه احدى الوسائل و اللي عنده مقترحات احسن يقول<br />بس ياريت محدش يقول نروح نفتح باب حوار !!! فتحتوا في المرة الاولى و رد عليكم باحلى حوار و هو نشرها في 17 جردية من جردية وحدة ؟؟<br />لازم نفهم منطق هذا الزمن و هو منطق القوة و الثبات على الرأي و اظهار الراي بقوة و ثقة مش نروح نبوس جزمهم عشان يحاورونا و هما الغلطانين..<br />حياهم الله و انا لو كنت اعرف مثلهم اهكر كنت هكرت .."
archived = "2010-01-16"
capture_url = "https://web.archive.org/web/20100116180537/http://www.20at.com:80/20at/ana-saudi/8382.html"

