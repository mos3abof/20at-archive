text = "اين كان الامن والحرس ؟<br />ربما كانوا بيأمنوا موكب وزير المكون من 6 الاف سيارة<br />او كانوا بيلموا الاتاوات من السواقين فى الكمائن<br />او متأهبين لمظاهرة ستقوم فى ميدان التحرير<br />وبعدين يطلع فاسوخة ويلقى خطابا زاعما ان مصر بلد الامان<br />يا اخى قحة"
