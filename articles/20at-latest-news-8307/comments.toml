posted = "2008-02-24"
text = "يقول الحق تبارك وتعالى اتبعوا من لا يسالكم اجرا وهم مهتدون<br />وكان لنا في رسول الله اسوة حسنة<br />صلوات الله وسلامه عليه هو وال بيته الكرام وصحابته كانوا ينفقون على الدعوة الى الله<br />كان كل واحد فيهم ليه عمل وكان ينفق على الدعوة من عمله ونخص بالذكى ابو بكر وعثمان<br />اما الان الدعوة اصبحت بزنس"
archived = "2010-01-21"
