text = "يعنى مش بالذمة هم يستاهلوا الفلوس دى ؟ على الاقل بيدعوا الى الله الدور والباقى على بنات الليل اللى بيقولوا عليهم مطربات وبياخدوا قدهم عشر مرات وحسبنا الله ونعم الوكيل"
