author = "ابومحسن"
posted = "2008-05-21"
text = "كتاب الكبائر الشهير للشيخ الذهبي الذي اورد فيه 80- كبيرة من كبائر الذنوب<br />يبدو وللاسف ان الشيخ الذهبي قام بتاليف ذلك الكتاب لكي ينتبه المسلمون وينتهون عن هذه الكبائر<br />ولكن العكس هو الصحيح المسلمون كلهم يطبقون هذه الكبائر ليل نهار وكأنها اصبحت من توافه الذنوب<br />ونخص بالذكر 1) الزنا والعياذ بالله<br />2) اللواط<br />3) اكل الربا<br />4) عقوق الوالدين<br />وغيره كثير<br />فتصحيح صورة الاسلام يقع على عاتق المسلمين انفسهم وذلك باجتناب الكبائر اولا<br />اول خطوة على الطريق الصحيح 1) اجتناب الكبائر الموجودة في كتاب الشيخ الذهبي<br />2) اتباع منهج النبي محمد صلى الله عليه وسلم واريد ان اقول هنا<br />وحتى نعرف قدر النبي محمد صلى الله عليه وسلم يستلزم قراءة كتاب عن حال الجزيرة العربية قبل الاسلام<br />ثم بعد ذلك نقرأ السيرة النبوية الشريفة وحي حياة النبي خلال عمر الدعوى 23 سنه تتلمذ على ايده ال البيت والصحابة<br />ثم نقرا كتاب عن حال المسلمين بعد رحيل النبي محمد صلى الله عليه وسلم وكيف انطلق المسلمون الى فتح الشرق والغرب وهزموا الفرس والروم ووصلت دولتهم من اسبانا الى الهند في اقل من 100 سنه<br />اللهم صلي وسلم عليك يا رسول الله يا خاتم النبيين يا امام المرسلين نشهد انك قد بلغت الرسالة واديت الامانة ونصحت الامة وكشفت الغمة وتركتها على المحجة البيضاء لا يزيغ عنها الا هالك<br />فيا اخواني الاحباء اول الطريق تصحيح المسيرة اجتناب الكبائر"
archived = "2009-07-30"
capture_url = "https://web.archive.org/web/20090730235004/http://www.20at.com:80/masr/t7kyk/9128.html"
