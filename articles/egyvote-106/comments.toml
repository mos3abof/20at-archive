[[comments]]
order = 2
subject = "حامل في توأم بلاوي .."
author = "مهنــــــــد نايم فــغمده"
posted = "2005-12-06"
text = "رسالة إلى المسئولين عن هذه الصفحة .. ارجوكم احذفوا صورة الفقي .. كل ما بادخل موقعكم باحس إني عايز ارجع .. حرام عليكم .. تعبت من شكله .. وكمان صورة المبارك .. مش كفاية كل شوية ناطط لنا في كل حته نروحها .. ورا كل عسكري صورته .. ورا كل موظف صورته.. غيه خايفين ننسى شكله المبطرخ ده يعني واللا إيه حكايتكم معايا .. بقيت عامل زي الحوامل كل شويه ترجيع ترجيع .. قرفتكم ..؟؟ صح ؟؟؟ طيب شيلوهم بقى عشان ما أفضلش أرجع كده في كل تعليق جاي .."
archived = "2006-09-26"
capture_url = "https://web.archive.org/web/20060926074637/http://egyvote.20at.com:80/article.php?sid=106"

