subject = "إبتسامة مصر"
author = "محمد حسن غنيم"
posted = "2006-06-12"
text = "إبتسامة مصر ما تتنسيش<br />عندما تجد المقاهي مليئة بالشباب وكل كلامهم الرنات و الماسدجات و البنات يجب ان تبتسم لإن إبتسامة مصر ما تتنسيش<br />عندما يستضيف التليفزيون (راقصة) لتتحدث عن تاريخها الفنى و إنجازاتها اليلية لازم تبتسم لإن هي دي مصر<br />عندما تجد ان 90% من الشعب المصري يستخدم الإنترنت للشات و سماع الأغاني ابتسم هي دي مصر<br />عندما تجد ملايين من الشباب قدوتهم و مثلهم الأعلى عمرو دياب و روبي ابتسم انت في مصر<br />عند قرآة كل الصحف و الجرائد العالمية و مشاهدة جميع القنوات الفضائية لا تسمع ولا ترى إلا فضائح مصر من سرقة و قتل و وعود و همية يجب ان لا تنسى الإبتسامة المصرية<br />عندما تكون هناك 10قنوات تليفزيونية تهتم بالفن و الفنانين ولا قناة واحدة دينية، أو، علمية لازم تبتسم دا إبتسامة مصر ما تتنسيش<br />عندما تجد تزوير في الإنتخابات و يزعموا انها ديموقراطية يجب ان تبتسم هي دي إبتسامة مصر<br />*عندما تقرأ عشرات الحوادث من السرقة و مثلهم من القتل يومياً يجب عليك الإبتسامة انت فى مصر<br />عندما (تضحك) عليك شركة الاتصالات و(تشفط) كل اللي في جيوبك ابتسم هي مصر<br />عندما تسافر دولة غير مصر و تجد شعبها يتمتع بنعمة الآدمية افتكر الإبتسامة المصرية<br />عندما تسمع عن مريض بالسرطان و غيره بالفشل الكلوى ابتسم هى دى إنجازات وزارة الزراعة المصرية<br />عندما تجد سرقة السياح في مصر عيني عينك من حقك متنساش الإبتسامة المصرية<br />عندما تركب السيارة الامريكى وتأكل (الهمبورجر) وتشرب (البيبسى) ثم تؤيد المطالبة بمقاطعة المنتجات الأمريكية ...أنت مجنون تعيش في مصر.<br />في إحدى القنوات الفضائية استضاف مذيع شباب داخل حرم الجامعة مؤيدون حركة كفاية حيث المظاهرات و الزوبعة الكذابة و لكن الكارثة مش الم<br />اقرأ بقية التعليق .."
