posted = "2006-06-20"
text = "احنا فى اذمه محتاجين ثوره فى الاخلاق واضمائر محتاجين نحب البلد دى بجد لاذم ندرس الاخلاق فى المدرسه علشان ميبقاش عندك حرامى ولامرتشى ولانصاب الحل يبدا من الاول وعليه العوض فى الى راح"
