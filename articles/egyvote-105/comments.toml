subject = "رسالة مفتوحة إلى قائد الإنقلاب العسكري المصري"
author = "محمد عبد المجيد"
posted = "2006-03-13"
text = "وسلو في 12 مارس 2006<br />﻿رسالة مفتوحة إلى قائد الإنقلاب العسكري المصري<br />دعني أولا أقبّل يديك الطاهرتين اللتين كانتا ترتعشان ردحاً طويلا من الزمن من هول رجفة غضب تمس جسدّك المتماسك دائما وأنت تراقب عن كثب من ثكنتك العسكرية، ومن خيمتك، ومن منزلك، وخلال متابعتك لأغلظ وأقسى لصوص العصر وأكثرهم فظاظة وبجاحة ووقاحة وهم ينهبون مصرك ومصرنا الطيبة الصابرة تماما كما فعل البغداديون في المتحف القومي عندما داست أحذية اليانكي فوق بلاد الرافدين.<br />لا أعرف أين أنت الآن، ومع من تتحاور، وكيف قضيت ليلتك، ومن هم زملاؤك الأبطال الذين ينتمون لذلك الجيش الوطني العظيم صاحب أسطورة حرب الاستنزاف والعبور؟<br />كنت وزملاء الغضب تتحاورون عشرات المرات، وتلتقون في أماكن مختلفة، وتشاهدون ضعفنا، وقلةَ حيلتنا، وتفرقَنا، وأحزابنا الهشةَ، ومعارضينا الوطنيين الذين لم يحركوا شعرة واحدة في ربع قرن، بل لا أبالغ إن قلت بأنهم منحوا هذا الطاغيةَ شرعيةً دستورية في تفرقهم وشجارهم وأولويات العمل الأناني الذي جعلهم أوهن من بيت العنكبوت في معارضتهم لأعفن الأنظمة الفاشية في تاريخنا الحديث.<br />إن أكثر الحركات المعارضة شعبية وهي ( كفاية ) لا تستطيع أن تجمع ثلاثة آلاف معارض لمدة ساعتين في قلب عاصمة الملايين الذين لا يختلف اثنان منهم على كراهيتهم لمن أوصل بلدهم لذلك العمق من القاع.<br />لعلك انتظرت مع زملائك سنين عددا، وحمل لك فجر كل يوم أملا كاذبا أننا قادرون على الغضب، وأن روحا مصرية معبئة بالكرامة ومفعمة بنفخة سماوية ستسري فجأة في ملايين من المهانين والمعذبين والمضطهدين والجوعى والعاطلين عن العمل والباحثين عن سكن كريم والعارفين تفاصيل عملية النهب المنظَم لوطنهم الغالي والرافضين للطاغية وابنه والمتألمين للظلم الواقع على عشرات ال<br />اقرأ بقية التعليق .."
archived = "2006-09-27"
