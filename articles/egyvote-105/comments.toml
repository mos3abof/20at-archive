[[comments]]
order = 1
subject = "طيب ممكن نرد عليه بجد ؟؟؟دعوة للرد علي الحزب والحكومة ؟؟"
author = "محمد السيد"
posted = "2005-12-05"
text = "علا هي دي مصر يا أسماء ....<br />علي العموم ... في النهاردة ... الثلاثاء وقفة احتجاجية في نقابة الصحفيين .... يا ريت كلنا نكون فيها....<br />يا ريت بجد يكون في عدد مننا محترم ... علي الأقل نقول إننا بنتحرك ومش بتوع كلام بس......<br />الثلاثاء .... الساعة 6 ومستمرة لغاية 8 ... في شارع رمسيس ... وسهل جدا نروح كلنا هناك .....<br />اللي مش عارف الطريق ... يركب المترو خط حلوان ... وينزل محطة جمال عبد الناصر ... وهناك حيلاقي نقابة الصحفيين والمحامين ...<br />والله السكة سهلة جدا .... وآمنة جدا كمان والتواجد مفتوح لكل الناس .... ممكن نتقابل هناك ؟؟؟ ونكون رجالة بجد ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-27"
capture_url = "https://web.archive.org/web/20060927161054/http://egyvote.20at.com:80/article.php?sid=105"

[[comments]]
order = 2
subject = "مين الواد المصرى ده ؟"
author = "على"
posted = "2005-12-05"
text = "السؤال اللى لازم نسأله لنفسنا ... مين الظابط ده ؟ ... هو من مصر و للا من إسرائيل ؟ ... و للا من عالم تانى ؟<br />الراجل ده مصرى ... معلش على كلمة راجل دى بس نعمل أيه ؟ ...<br />أنا بتخيل أن فى ظالم مفترى بيظلم الناس و يفترى عليهم ... بس هو لوجده معندوش رجالة ... تفتكر كان ممكن يظلم ... ها ها ها ... ماهو طول ما فى اللى بينصر الحق الحق ينتصر له ... بس مين بقى الباشا ده ؟<br />الظابط الأبهة ده ( يد النظام ... أو على رأى شيخنا كلب النظام ) هو مصرى ... ممكن يكون أخويا ... أو جارى ... أو بالأدهى صحبى ... و بيشتغل أوسخ و أدنى مهنة فى التاريخ ( --- ) بالأجر .. و أنا فين بقى من الكلام ده ... بقول معلش ربنا يهدى ... و أقعد معاه باليل نهزر و نضحك ... قشطة عادى يعنى<br />يا جماعة ... لو المشكلة فى حسنى و صفوت كانت أتحلت من زمان ... المشكلة فينا ... الشر بين أظهرنا ... الشر فى قوات شرطة من أخوتنا و أحبابنا بتعمل للنظام اللى هو عاوزه ... أصلها خايفة منه ... و مش خايفة من مالك الملك و بتقول لأ لربنا و مبتقولش لأ للظلم.... الشر فى قضاة من أخوتنا و أحبابنابتقول لأ للحق و مبتقولش لأ للظلم ... للضرائب ... للنيابة ... عايزين سلطة وجاه .... و خايفين من الفقر ... مش خايفين من ربنا ... طب ألبسوا بقى يا حلوين ...<br />كلمة أخيرة , لن يغير الله ما بقوم حتى ...<br />شاطريين :)))"
archived = "2006-09-27"
capture_url = "https://web.archive.org/web/20060927161054/http://egyvote.20at.com:80/article.php?sid=105"

