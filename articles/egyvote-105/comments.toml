subject = "طهقانه من الحريه والديموقراطيه"
author = "مروة الابياوى"
posted = "2005-12-12"
text = "ما انا فتنقل عمليه توزيعى الاغنيه من المثاليه الى الواقع المريراسمع كده لما تلاقى الشرطى سلاحه فى ايده يجرى ورا الصصحفى وكانه طريده يبقى انت اكيد اكيد فى مصرولما الصحفى الحر يفكر فى مصيره هيلاقى نصيبه سجنه و موته بكتيره يبقى انت كيد فى مصرالصحفى فى عينه ملاك والشرطى هو الهلاك الصحفى يقوله ياشرطى<br />عايز اقول رايى بحريه والشرطى يقوله بشرطى متقولش رايك علانيه خليها فى سرك يابن مصر"
