[[comments]]
order = 10
subject = "أوعي تخافي يا أسماء .."
author = "مهند"
posted = "2005-12-06"
text = "أ لأ .. لأ ومليون لأ .. مش ممكن تكون دي مصر .. دي غابة والكلاب فيها سارحه .. كما قال عمنا بيرم رحمه الله .. أفاعي متسيبه .:. من غير رفاعيه .:. ودنيا مترتبه .:. ترتيب فلاتيه ... مش هي دي مصر يا أسماء .. دي حكومة الحزن الوثني .. حكومة مبارك الجبان المختبيء وراء هؤلاء البلطجية .. ويقولك الحزن الوثني بيستأجر بلطجيه .. طيب ليه وهو الحزن الوثني ناقص بلطجيه .. ده كله بلطجيه .. هو اساس البلطجه ورئيسه شيخ المنسر .. والأكاده بيجهزلنا بلطجي صغنن يمسك مملكة الغابة بعد ما ينفق الريس الكبير .. تبقى دي مصر ازاي يا أسماء ؟؟؟ لما المـعَّرص فى فرقة فنانين يحكم .. وفوقه أعرص وفى المسرح بيتحكم .. يبقى عليه العوض فى الفن يا جدعان .. ويبقى حل الفساد والخبص والتعريص .. نجيب سرور كان بيتكلم على المسرح والفن .. بس الحكايه قلبت بغلب وغم .. وبقت البلد كلها تعريص .. بس برضه مش هي دي مصر يا أسماء .. مصر الغلابه الطيبين الشقيانين .. ودول المعرصين على كل لون .. وأعرصهم كبيرهم أبو التعاريص .. لأ .. لأ .. مش هي دي مصر يا أسماء .. مصر راجعه بعد غربه .. راجعه بإيدين ولادها وبناتها الطيبين الشقيانين .. في إيدهم ورقه صغيوره وحبة فول ونص رغيف .. وفي الأتوبيس متشعلقين .. زحمه وخنقه وريحة عرق الغلابه .. هي دي مصر يا أسماء .. خايفه يا أسماء من الكلب ده ؟؟؟ قولي آه .. حاسس إنك خايفه .. طيب وخايفه ليه ؟؟ ومن إيه ؟؟ وعلى إيه ؟؟ فيه إيه تاني حنبكي عليه يا أسماء ؟؟ لا لقمه ولا هدمه ولا عيشه ولا حتى فتفوتة كرامه ؟؟؟ باقي إيه تاني ؟؟؟ أوعي تخافي يا أسماء ..<br />مهند muhannadsalah@yahoo.com"
archived = "2006-09-27"
capture_url = "https://web.archive.org/web/20060927161054/http://egyvote.20at.com:80/article.php?sid=105"

[[comments]]
order = 11
subject = "يا ريتني كنت معاهم .... فين ؟؟... في نقابة الصحفيين طبعا....."
author = "محمد السيد"
posted = "2005-12-06"
text = "نا لسة جاي من وقفة الصحفيين .... انا بأحب أسميها وقفة ....<br />إنما هي الحقيقة كانت مظاهرة ... ومظاهرة محترمة كمان .......<br />العدد كان جميل جدا ... والناس تفاعلت معانا في الشارع و كتير منهم شاركنا ومشي معانا .....<br />لمانقارن يوم زي النهاردة بأول مظاهرة لكفاية مثلا ... العدد تضاعف أضعاف مضاعفة ... والناس اتكسر عندها حاجز الخوف بفارق كبير عن الأول ...<br />العجيب إنك كنت تلاقي الفرحة علي وجوه الناس العادية اللي في الشارع ... وكأنك بتسمع منهم : يا ريتني كنت معاكم !!! .....<br />وياتري اللي مجاش معانا النهاردة ... بيقول كمان .... يا ريتني كنت معاهم؟؟؟<br />لا للتمديد ... لا للتوريث... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-27"
capture_url = "https://web.archive.org/web/20060927161054/http://egyvote.20at.com:80/article.php?sid=105"

