subject = "ماما سوزان فين؟!!"
author = "قذائف الحق"
posted = "2005-12-06"
text = "طبعاً في ناس بتسأل عن ماما سوزان راعية المرأة المصريةو عن دور المجلس القومي للمرأة.<br />و عن رافعات لواء الدفاع عن المرأة<br />\"منى رجب , طوسون و اقبال بركة و أيناس الدغيدي و أخريات\"<br />يا جماعة الناس دول مهمتهم الاساسية الدفاع عن حرية العري و عن سيدات الاعمال و مصالحهم<br />و هدفهم الاسمى الدفاع عن البظور \"وقف ختان الاناث\" و ليس الدفاع عن العقول<br />و طبعأً مكانهم المناسب في مزبلة التاريخ<br />مع ماري انطوانيت و إيرما لادوس"
