[[comments]]
order = 13
subject = "هذه ليست مصر للأسف"
author = "وليد"
posted = "2005-12-06"
text = "مصر ليست كذلك<br />مصر هى الأتى<br />اخلع ملابسك إنك بالمباحث ... ثم تقيد ثم تضرب الى ان تنزف ثم تربط بكرسى من يديك واخر من قدميك ويجلس على كل كرسى احد الابطال الاشاوس<br />ويبدأ الصعق<br />هل جربت ان تصعق ؟!!<br />ثم يسكبون عليك الماء الساخن.... ومن بعده الماء البارد<br />وما بين ركلة وضربة<br />ياتى الصعق<br />... أنت لم تنطق بعد ؟<br />ليس لديك ما تقول ؟<br />سنشحذ همتك الأن<br />أحضروا له الخاذوق....<br />يبعدون بين ساقيك ويضعون العصا فى شرجك<br />تكلم الأن<br />ليس لديك ما تقول ....<br />ياتى أحدهم ليخرج العصا ويحاول وضع عضوه ........<br />انتهت هذه الليلة<br />القوه فى بير السلم ( امن الدولة الاسكندريه ) او فى الدور الرابع تحت الارض ( جابر بن حيان )<br />وفى الليلة القادمة يبدأ المسلسل من جديد<br />نسيت ان اقول انهم عفيفى اللسان<br />يسبون الله والدين والام والاب وفقط<br />لا يتطاولون اكثر من ذلك<br />اسماء انتى وقعتى فى ناس كويسه<br />شكلهم اخوان ...<br />لانهم طيبين قوى"
archived = "2006-09-27"
capture_url = "https://web.archive.org/web/20060927161054/http://egyvote.20at.com:80/article.php?sid=105"

