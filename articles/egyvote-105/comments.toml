[[comments]]
order = 4
subject = "حسبنا الله ونعم الوكيل"
author = "علياء"
posted = "2005-12-06"
text = "سبنا الله ونعم الوكيل<br />الظاهر ان اللي اتعرضت له اسماء ده هو مصير أي بنت بتشتغل في الصحافة لأن هي دي حقوق المرأة عندنا في مصر اللي دايما يتكلموا عنها ، وهو ده الإهتمام الكبير بالمرأة اللي خلاهم يعملوا المجلس القومي للمرأة !!!!<br />أنا بشتغل في الصحافة الإلكترونية وأمي كل يوم توصيني بوصية....<br />\" اوعي يا بنتي تكتبي حاجة على الحكومة ,, اوعي يا بنتي دول ..... حايبهدلوكي البلد خلاص .... حسبنا الله ونعم الوكيل ... اكتبي أي حاجة بس مالكيش دعوة بالسياسية \"<br />وده كلام ام خايفة على بنتها من الديمقراطية والفكر الجديد ....."
archived = "2006-09-27"
capture_url = "https://web.archive.org/web/20060927161054/http://egyvote.20at.com:80/article.php?sid=105"

