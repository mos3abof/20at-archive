[[comments]]
order = 19
subject = "كيف تقنع المصريين بأن لهم كرامة؟"
author = "محمد عبد المجيد"
posted = "2005-12-12"
text = "#65279;ألَمْ يكن من الأفضل أن أضع عنوانَ مقالي: كيف تُقنع الكرامةَ بأن للمصريين حقاً فيها؟<br />أعود للمرة الرابعة أو الخامسة للكلمة التي فجّرها في أذني صديقي المحامي الأوروبي الذي استفسرت منه عن سبب طرد شرطة بلده لمجموعة من المصريين بطريقة مُهينة، فقال لي وكأنه يضع سراً في بئر عميق لا قرارَ له: لأن المصري من دون خلق الله كلهم الذي لا تدافع عنه حكومته تحت أي ظرف وضد أي امتهان لكرامته!<br />في كل دول العالم يتقدم الزائرُ لضابط الجوازات بجواز سفره، فيشكره الضابط ولو كان ممتعضا، أما في مصر فأنت تقدم جواز سفرك قائلا: شكرا، ليس من قبيل التطرف في التمدن، ولكن المساحة المخصصة لكرامتك في التعامل مع الآخرين لا تسمح لك بأكثر من هذا، بل قد تشكر أمينَ الشرطة لأنه ألقى في وجهك هويتك الشخصية دون أن يصطحبك معه بتهمة اللاتهمة!<br />لو أنك في مركز قوة، أمنية أو مالية أو إدارية، وأعتدت أن تصفع أحدهم على قفاه في كل يوم عشر مرات دون أن ينبس ببنت شفة، ثم قررت بعد عدة سنوات أن تخفض عدد الصفعات إلى خمس فقط، ما الذي سيحدث؟<br />أغلب الظن أن المصفوع سيقدم لك عميق شكره، وربما يُحَدّث الآخرين عن لطفك وكرمك وطيبة قلبك!<br />ولكن إذا كنت في مصر وتقدمت من المصفوع محذرا إياه، ومُنبّهاً لضرورة الحفاظ على كرامته، ثم عارضاً عليه مقارنةً بحقوق الآخرين في الجزء الآخر من العالم، ومستنهضا هِمّتَه، ومُحَرّضا نوازع الخير في نفسه للتمرد على الواقع، فإن الكارثة والفاجعة والمصيبة ستدهشك، وربما يغشى عليك من هولها وصدمتها!<br />إنّ صاحبنا سيغضب منك لأنك ذَكرّته بكرامته، وحاولت تعكيرَ صفو لذة الذل واستعذاب الهوان التي تبلغ شدتها ومُتعَتَها وبهجتها كلما مَنَحَته أمْنا وسَكْينة وحماية في ظل سلطة يُقَبّل حذاءها، وتمد في روحه، وتمَنّ عليه أنْ تركته<br />اقرأ بقية التعليق .."
