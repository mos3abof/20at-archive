[[comments]]
order = 0
subject = "يا فندى..... العب غيرها"
author = "مصرى ابن بلد"
posted = "2006-07-10"
text = "مصطفى بكرى كان العدو اللدود لك ايام غزو العراق عندما كنتم عبيدا لبوش واكاذيبه حول اسلحه الدمار الشامل حتى تم تدمير العراق واحتلاله !! انت يا فندى<br />من المتأمريكين ولا تنسى ان بكرى من حطم اصنام الاهرام الذى كان بوقا لترويج اسلحه الدمار الشامل!!!! العب غيرها يا متامرك"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091151/http://masr.20at.com:80/article.php?sid=631"

[[comments]]
order = 1
subject = "مرحبا بالمارينز"
author = "منتصر"
posted = "2006-07-10"
text = "طبعاالاستاذ فندي يقصد مصطفي بكري وانا في حل عن الدفاع عن بكري .ولكن لست في حل عن التحدث عن فندي معيد كلية الاداب انجليزي في قنا في الثمانينيات والذي هاجر الي امريكا وفتحت له طاقة القدر هناك والذي وصفة الميرازي في الجزيرة وامام سيادته عندما كان يدافع عن الغزو الامريكي للعراق . بان هذا التعاطف والدفاع مفهوم من د . فندي باعتباره واحد من الامريكين . ووالله لم ينطق فندي ولم يدافع عن نفسه وضرب الطناش<br />فاذا جاء العيب من اهل العيب ما يبقاش عيب . واعتقد ان كل من درس لهم في اداب قنا يعرفونه ويعرفون عقليته وانتهازيته"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091151/http://masr.20at.com:80/article.php?sid=631"

