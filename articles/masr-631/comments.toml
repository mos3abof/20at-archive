[[comments]]
order = 3
subject = "مين الكداب ده"
author = "ابو اسامة"
posted = "2006-07-10"
text = "يا اخى شبعنا كدب ومتفكرشى ان الناس معندهاش عقل وانك ممكن تتوههم انك اذكى<br />منهم والدليل انك كداب بسيط قوى وهو<br />ان الحكومة نفسهابتقبض من مال الشعب<br />يبقى الجميع بيشتغل عندالشعب يبقى انت وهماوالحكومة خدامين للشعب ويا ريت تبطل<br />تتذاكى لأن فيه الأذكى منك انت بتتكلم عن<br />شعب مش عن شخص يبقى اكيد فيه الاف اذكى<br />منك يا غبى"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091151/http://masr.20at.com:80/article.php?sid=631"

[[comments]]
order = 4
subject = "عبارات مقززه"
author = "خالد الحسيني"
posted = "2006-07-11"
text = "قد يكون لي و لغيري بعض التحفظات على الاوضاع في مصر و لكني لا استطيع هضم لي الكاتب للحقائق فليس بالضروره كون الصحفي يتقاضى راتبه من الدوله ان لا ينتقدها و كأن الكاتب يدعوا جميع الصحفيين الذين يرتبطون بعلاقه مع الحكومه من اي نوع ان يلتزموا الصمت التام لان الحكومه تدفع رواتبهم بالرغم ان الكاتب من الذين فلقونا سابقا بحرية الصحافه في الغرب و ان البي بي سي على سبيل المثال تمولها الحكومه البريطانيه و مع ذالك فلصحفييها مطلق الحريه ان ينتقدوا اوضاع الدوله كما يشاءون و امثله كثيره في الغرب من هذا النوع و ان هناك فصل تام في الغرب بين حقوقك كمواطن على الحكومه وبين ممارسة دورك السياسي في النقد و ابداء الرأي فكيف ترفع شعارات الحريه و تطالب بالخنوع كما ان عبارات الكاتب التي من نوعية البغاء السياسي و التلبس بفعل فاضح في بير السلم و النوم في احضان الحكومه مساء فاري انها فضلا عن انها لي صارخ للحقائق فهي الفاظ و عبارات اعتقد انها مقززه و عفوا انها لا تليق بكاتب يفترض فيه ان يرتقي بذوق القاريء"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091151/http://masr.20at.com:80/article.php?sid=631"
