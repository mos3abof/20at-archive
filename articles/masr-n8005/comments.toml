[[comments]]
order = 0
subject = "شحات ناشيء"
author = "كرميلينو"
posted = "2006-03-23"
text = "الشحاته دي ظاهره مؤلمه فعلا<br />ازاي واحد يمد ايده و يقول انا عايز اكل و لا عايز فلوس<br />الواحد لما بيكون مسلف واحد فلوس بيبقا مكسوف يقوله ردها تاني الا لو طول عليك اوي و طنش<br />اما بقا عن شحاتي المفضل او شحات كل يوم فهو ولد في منتهى البؤس ( او هكذا اظن ) كما كان يظن خالد كساب بالولد اللي كان بيذاكر تحت المطر في شارع طلعت حرب<br />الشحات هو فتى السايبر<br />بيخرج كل يوم من بيتهم شايل شنطة مدرسة تقول فيها قنبلة نووية ( كبير طحن ) و شايلها يا ولداه على كتفه<br />الولد مبيروحش المدرسة بيروح السايبر كل يوم من الساعة 9 الى الساعة 2<br />طيب بيجيب الفلوس دي منين ؟؟؟<br />ده السؤال اللي كنت بسأل لنفسي<br />فضلت انخرم وراه لحد ما عرفت انه بيشحت بينزل الصبح يلقط رزقه في الزحمه و لو الفلوس خلصت بينزل يلقط رزقه من المنطقة اللي خوالين السايبر<br />بمنتهى المسكنةو البؤس الحقيقي ( مش تمثيل ) بيألف قصه عشان يجيب فلوس يقعد بيها على النت<br />يلعن ابو النت يا اخي اللي تخلي الواحد يشحت و يلعن ابو الفيفا<br />و يلعن ابو الظروف اللي خلت ولد صغير يهرب من المدرسة و يروح السايبر"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022216/http://masr.20at.com:80/article.php?sid=62&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 1
subject = "شحات و مد ايديه و كسر خاطره حرام"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-23"
text = "انا بقى الشحات بتاعى ولد صغير تحفه بييجيلى كل ما بروح اشترى ايس كريم<br />(حته و النبى اصلى مفطرتش يا ابله)<br />ة اكيد لوالظهر يبقى متغداش و لة العشا يبقى متعشاش ..بيمشى حاله يعنى<br />انا برده نخورت وراه لحد ما عرفت انه ابن بواب العماره اللى جنب محل الايس<br />كريم.و لانى بموووووووووووووت ف الايس كريم ..بجيب له دايما واحد معايا كل ما بشترى..<br />شفتوش هبل اكتر من كده<br />يللا كله بثوابه"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022216/http://masr.20at.com:80/article.php?sid=62&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "حرام عليكم"
author = "فلسطيني"
posted = "2006-03-24"
text = "حرام عليكم تحكو هيك عنهم .. لانه في كتير منهم ما لاقيين ياكلو بجد .. نفسي كل واحد فيكم يحط نفسه مكان هدا الشحات و يحكيلي شو شعوره ؟<br />بعدين إللي ببيع كلينكس أو بسكويت عشان يترزق هدا مو شحات ..<br />الله يبعتلهم و يبعتلنا و يغنينا عن حاجة الناس .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022216/http://masr.20at.com:80/article.php?sid=62&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

