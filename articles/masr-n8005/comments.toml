[[comments]]
order = 4
subject = "دول شحاتين غلابة"
author = "rskishe"
posted = "2006-03-25"
text = "دول نصابين أو شحاتين غلابة لكن احكيلك عن واقعة حصلت قدامى تدخل أسرة بنعش ميت لصلاة العصر للصلاة على الميت بعد صلاة العصر و كالعادة قبل الصلاة على الميت يسأل هل هناك من غير راض عنه فهنا يصرخ رجل أنا دا حرامى و ابن ونصاب دا كان سالف منى ألفين جنيه وما جابهم وهنا يضطر المصلين أنهم يلمو علشان يفكو ضيقة مسلم وياخد الراجل الفلوس ويمشي وتبدأ الصلاة على الميت وبعد الصلاة ينتظر أن يأخد أهل الميت المرحوم ولا أحد ياتى فننظر في النعش نجد مخدة علشان تعرفو أنكم بتلعبو مع مبتدأين لسة"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022216/http://masr.20at.com:80/article.php?sid=62&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 5
subject = "الرحمااااااااااة"
author = "مي حمدي"
posted = "2006-03-25"
text = "ميصحش ابدا تكتبوا<br />\"\"الشحاتة\" هي إختراع مصري، تملك مصر حقوق الملكية الفكرية الخاصة به، ولا تنازعها دولة أخرى في تفوقها \"الفظيع\" في هذا المجال..<br />ولأننا اخترعنا الشحاتة، فمن الطبيعي أن نعمل على تطويرها وابتكار أفكار جديدة في المهنة المصرية العريقة.\"<br />عيب أوي وميصحش....يعني لما حد مش مصري حيقرأها يقول علينا ايه....ارحمونا بأه أرجوووكم واعرفوا قيمة بلدكوا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022216/http://masr.20at.com:80/article.php?sid=62&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 6
subject = "لية يا اخت مى"
author = "طماطم"
posted = "2006-03-26"
text = "بجد الموضوع دا فكرنى بفيلم عادل امام المتسول فيلم كان جميل اووووووووى<br />هوة يعتبر احسن تعليق على الموضوع<br />وبعدين يااخت مى انا شايفة الموضوع مش بيتهكم على بلدك دا بالعكس بلدك هية اللى بتتهكم علينا<br />لو وفرت شغل للناس دى مكنش دا حصل وبعدين لما بلدنا تقدرنا نبقى نقدرها<br />وياريت تهدى اعصابك شوية دا مجرد موضوع<br />وسيبنا ننفس عن نفسنا شوية كفاية خنقة"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022216/http://masr.20at.com:80/article.php?sid=62&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 7
subject = "نفسوا بس من غير تجريح"
author = "مي حمدي"
posted = "2006-03-27"
text = "انا معرفش الاخت طماطم مصرية أم لا....بس عموما انا مش ضد النقد البناء ومش باقول ان مصر خالية العيوب... بس انا ضد التجريح أو الاساءة إليها....كلام زي دا انا في وجهة نظري انه ميصحش يتكتب...وكل واحد حر في رأيه....<br />وشكرا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022216/http://masr.20at.com:80/article.php?sid=62&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 8
subject = "مصريه"
author = "طماطم"
posted = "2006-03-27"
text = "ايوه يامى انا مصرية بس انا شايفة ان الموضوع نفيهوش اى تجريح لانة موضوع واقعى فعلا يعنى اللى كتب مجبش حاجه من عنده ودا مجرد موضوع وبتناقش فية مش اكتر<br />ولما انتى شايفة ان كل واحد حر فى راية<br />لية بتهاجمى الموضوع<br />عموما متزعليش مصر دى جنه ولا تزعلى"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022216/http://masr.20at.com:80/article.php?sid=62&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 9
subject = "غسيلنا الوسخ"
author = "كرميلينو"
posted = "2006-03-28"
text = "كانوا بيقولوا زمان محدش يفتح بقوا على مصر لان ده بيسيء سمعتنا و ده بيعتبر نشر لغسيل مصر الوسخ او بمعنى اصح بنشرد لنفسنا ( تقولش احنا مش مشتشردين )<br />اما جاليا في عالم بسموات مفتوحة و مفيش حاجة تستخبى لازم ننشر غسيلنا حتى لو كان وسخ عشان نتكسف شويه و نحس على دمنا و نحاول ننظفه<br />امال مدام نظيفه هتلاقي شغل ازاي ؟؟<br />و القطنه مبتكدبش"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022216/http://masr.20at.com:80/article.php?sid=62&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 10
subject = "مش جنة... بس مش نار!"
author = "مي حمدي"
posted = "2006-03-30"
text = "يا ستي انا مقلتش ان مصر جنة بس هي مش نار برضه...وفي رأيي نار مصر ولا جنة الغربة..زواللي يسافر حيعرف...انا لفيت الدنيا بس شايفة انه مفيش زي مصر...ومفيش حاجة تساوي كباية الشاي اللي الواحد بيشربها وسط أهله...<br />انا مش بهاجم حد...هما حرين يقولوا رأيهم وانا كمان وانت وكل واحد حر.. والاختلاف في الرأي لا يفسد للود قضية...انا بس شايفة انه فيه حدود خصوصا في حاجة يقرأها غير المصريين..."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022216/http://masr.20at.com:80/article.php?sid=62&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"
