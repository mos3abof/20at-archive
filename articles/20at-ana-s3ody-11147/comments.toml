posted = "2009-02-19"
text = "اخى الكريم , احب ان اعرفك بان المصريين جميعا يغارون من المنايفة , وكلهم كانو يتمنون ان يصبحو منايفة , لان المنايفة بالفعل هم انجح واحسن واذكى ناس والجميع يتمنى ويحلم بان يصل لما وصل اليه المنايفة"
archived = "2009-08-20"
