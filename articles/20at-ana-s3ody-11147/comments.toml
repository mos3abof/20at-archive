posted = "2009-06-12"
text = "ههههه على فكرة أنا منوفى …<br />بس بجد احنا مش كدا ..<br />الناس بتتكلم عن المنايفة كأنهم نوع من البشر ..<br />لكن والله فيهم ناس شده فى الطيبة والكرم وانا منهم طبعا<br />لكن كل مكان فى الصالح والطالح ..<br />والى أظهر موضوع المنايفة وحشين بالصورة دى…<br />هو الجيش …<br />عامة موضوع جميل بالتوفيق دايما..،"
