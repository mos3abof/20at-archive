posted = "2009-10-01"
text = "هو الموضوع وصل لننسى انتم بتقدموا ايه بالضبط وما هو هدفكما<br />ما هى القيمة المضافة لوجود هذا الفيديوا بالمقاله<br />ولا هو أى حاجه وخلاص<br />عيب عليكم يا عشرينات<br />شيل الفيديو ده ربنا هيحسبكم عليه"
archived = "2009-10-02"
