author = "فارس _fr"
posted = "2006-11-25"
text = "للاسف يا دشم,, انت انسان .... مش هشتمك زى مانت شتمت ,بس هقولك راعي ضميرك لو كان لسه عندك شوية منه ,,, مسيرة ايه اللى بتتكلم عليها ,,, والا انت بتتبع مبداخالف تعرف ,, عايز تخالف اراء الناس عشان تتشهروتتعرف ,, بيتهيالى وسيلة دنيئة ,مش الى هى يا دشم ,, ولا هو ده رايك فعلا ,,ان احنا عشنا25 سنة من الانجازات ,ومن ثم نعم للتوريث واستكمال المسيرة ....<br />لا للتوريث ولالاستكمال الفطيرة"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129043725/http://masr.20at.com:80/article.php?sid=1181"

