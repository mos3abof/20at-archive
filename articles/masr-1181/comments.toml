subject = "الظلم ياتي بالخوف"
author = "المنكوب المظلوم"
posted = "2006-11-22"
text = "ذا امر طبيعي لرئيس دول ظلم ويظلم الشعب عرب فترة حكمة التي طالت لانه يعب جيدا انه كل شعب مصر بما فيهم الحكومة التي معه تكرهه ولن تظهر خلال ذلك لان اكل عيشهم من رضي الرئيس<br />واني من المظلومين اقول<br />( حسبي الله ونعم الوكيل فيك يا مبارك انت وكل ممن ظلمو الشعب المصري الطيب الصبور ) ولك هناك صبر سوف ينفد كما فعل الظباط الاحرار اللي هم مش احرار ( لانه حررو انفسهم وازلو الشعب ) واصعب شيء هو الاغتناء بعد جو"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129043725/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 15
subject = "كم ذا بمصر من المضحكات ولكنه ضحك كالبكاء"
author = "ميدو"
posted = "2006-11-22"
text = "انا متاكد ان اللى بيدافعو عن الرئيس ومش عايزين حد يشتم جنابه ( مع التاكيد علي رفضي لاي لفظ خارج او نقد جارح ) زى الاخت حنين والا الاخ فارس ناس اكيد مرتاحه فى عيشتها ومش حاسة بدمعة السيدة اللى قاعدة جنب الحيط بتشكي ظلم النظام لربنا والا الراجل بتاع شركة النظافة اللى بيقضي اغلب يومه فى الزباله وكمان الظاهر انهم صغيرين فى السن والاكيد انهم اتولدوا ويمكن يموتوا فى فترة الحكم المباركة ؛ ياناس فوقوا بشر ايه اللى نسيبه يعملنا حقل تجارب لمدة 25 سنة وواجهتنا فى العالم ايه اذا كان سيدنا ابو بكر قال لما مسك الخلافة الاسلامية اذا رايتمونى على حق فسادوني واذا رايتمونى على باطل فقوموني رضي الله عنك يا صديق"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129043725/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 16
subject = "الاعمار بيد الله"
author = "مش عارف"
posted = "2006-11-22"
text = "ياريس ر بنا يديك طول العمر ... بس انت مش شايف ان العملية بوخت ؟ والناس كفرانة منك ومن عيلتك ؟ انتمم ما انتوش حاسين باللى فى البلد واللا ايه؟ وان كنتم حاسين يبقى ماعندكوش دم ...كفايه بقى عليك انت وعيلتك ولن يغفر الله لكم ابدا ما قدمتوه لمصر وللمصريين من فقر وذل انت ورفاقك .. انسيتم انه يوجد اله سيحاسبكم ام انكم من الكافرين وهذاهو الارجح !! انا عارف ان مافيش حاجة بتحوق فى جتتكم لكن عذاب الله شديدومصيركم اسودانت والهانم واولادك ياكفره"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129043725/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 17
subject = "مستمر"
author = "الدشم"
posted = "2006-11-22"
text = "ومازالت الشتائم مستمره( واللى هينوبنى منها جانب ) ، ومازال التعصب ضد اى راى مخالف مستمر ، ما المشكله يا دعاه ( حريه الراى ) فى ان يكون هناك اراء مخالفه لارائكم الحاقده الحانقه دوما<br />وادعاؤكم المستمر بانكم اهل العلم و الدرايه واللى يخالفكم يكون جاهل ومش عايش فى البلد دى ،<br />واضح طبعا انكم يا حرام بتعانوا فعلا فى مصر ، بدليل قعدتكم ليل نهار قدام النت سواء كان النت ده فى بيوتكم او قاعدين فى مقهى نت و فى الحالتين العداد شغال مما يدل على انكم من محدودى الدخل فعلا و المظلومين فى البلد!!!<br />و طبعا الرد جاهز انها البطاله اللعينه اللى مقعدانا قدام النت ، طيب لو فيه عدد يعانى من البطاله فاضعافهم يعملون (ولا كل الناس دى عايشه ازاى) يا تنابله، عاوزين حكومه تعلمكم و توكلكم و تشغلكم وتجوزكم كمان ، يا كده يا متعجبش البهوات<br />نعم للتوريث ولاستكمال المسيره."
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129043725/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 18
subject = "الحمد لله احنا مش زيكوا:P"
author = "Freedom Mamia™.mwatn masry"
posted = "2006-11-22"
text = "انا بحمد ربنا و الله اني مش عايش في قاهرة المعز عشان الذل الل بيشوفوه كل يوم من الريس انا عايش في اليكس بس يوم ما الريس يجي .... احيه علي كده هيصة بقي و البلد واقفة مووت و يا ويله اللي بيفكر ينزل من بيته يوميها مش ده موضوعنا بس انا عاوز اعرف حاجة وهيا : ان اللي بيعمله الريس ده اكيد مش جاي من فراغ دي ولا مؤاخذة بيسموها عقدة نقص او ممكن تسميها خشي برضه ايوة امال ايه الريس بيتكسف يبين وشه للشعب ماهو مينفعش برضه ريس و معاه مليارات تملي بنوك سويسرا و يمكن اوروبا كلها يحط علي وشه منخول فبيضطر اسفا انه يستخبي و مش حنسي يوم كنت فيه في مدينة الرحاب (يوم ما بسلامته راح يفتتح المدينة) آل ايه الريس جاي في هليكوبتر و وسع يا جدع الريس جه هوب طلعت أوت و الظاهر انه ملحقش الهليكوبتر (عاملين تمويه عشام يعرفوا فيه نالس كخة مستهدفينه ولا لأ) المهم جه بعديها بساعتين يجي عشرين غربية سوداااااااااا و محدش يعرف هوة في أنهي فيهماسف لو طولت بس انا قصدي حاجة واحدة بس ان الجبن ده يا جماعة مش جي من فراغ لأ ده عارف انه عامل بلاوي سودااااا للدرجة دي (الريس المذكور آنفا هوة الريس متقال بتاع الفراوليه)"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129043725/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 19
subject = "بالراحة شوية ع الشاب يا جدعان"
author = "سعيد بدوي"
posted = "2006-11-23"
text = "لماذا كل هذا الهجوم على شخص الرئيس العزيز ،واحد يقول انه حيوان التاني يقول فاسد، آخر يقول كلب وبين من ينعته بالفساد، وعدم الاخلاق، ومن يظلمه بقوله انه ما عندهوش دم انه قاعد على قلب الناس 25 سنه وما حدش طايقه، وناس تتهمه بالعمالة وأخرون بالخيانة، ومن ينعته بالحرامي، حرام على كل واحد منكم ، با اخواني هذا لا يليق برجل مثل مبارك، اجمعوا شتائمكم وسبابكم منذ ربع قرن مضى، وضاعفوها أضعافا مضاعفة، ثم زيدوا عليها جل اللعنات التي نزلت على ابليس من السماء والارض، منذ بدء الخليقة وحتى الآن، ثم أضيفوا عليها قطرة من لعاب كل مطحون، أو مقهور في هذا البلد، ولتلقى بجانب مقره في مصر الجديدة، وانتظروا صحف الغد،،،>>> مصرع مبارك باسفكسيا الغرق في ظروف غاممضة"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129043725/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 20
subject = "للي عايز يعرف ليه بنقول مبارك واطي ..."
author = "إبن بهية"
posted = "2006-11-23"
text = "أستغرب والله بشدة من أولائك الذين يدافعون عن الواطي القذر مبارك .. طيب على أي أساس هم يستندون ؟؟؟ لا إنجازات داخلية ولا خارجية .. بلاش إنجازات يا سيدي .. يقعد ويتنيل على عين اللي جابوه ويبطل نهب وسلب وسرقة في البلد هو وعصاباته ... لكن تقول لمين .. ناس نايمه ومش دارية بحاجه .. أعتقد أن الفعاليات الجديدة والنصائح والتدريبات التي أعطيت أو لقنت للحزب الواطي (الحزن الوطني) منذ عشر سنين قد أتت أكلها .. أيامها حصل الواطي إبن الواطي جيمي مبارك وبعض قوادات الحزن القذر على تدريبات في بلاد بره على كيفية إعداد جيل جديد موالي لهم عن طريق عمليات غسيل لامخ المنظمة ... طيب نغسل مخهم ازاي يا مستر فورد وإعلامنا الناس كرهته وبطلت تصغي له ومن ناحية أخرى الجزيرة مبهدلانا يا مستر؟؟؟ راح عمك الخواجة مخترع لهم فكرة جيل المستقبل وجمعية المستقبل وشوية الهمبكة اللي عملوها دي .. يعني الشباب يتجمعوا عشان يدرسوا الكومبيوتر اللي هو رخصة السير اليوم في أي عمل .. وآدي النتيجة واضحة ..<br />لا أعتقد يا ولاد بهية إنكم مش فاهمين أو فاهمين ومطنشين .. كل ده لأ .. مشكلتكم أنكم متغمين شوية .. يا ريت كل واحد يشيل الأيادي القذرة التي تغطي عينيه ويبحلق كده في البلد كويس .. شايف إيه يا مان ؟؟ مش حضرتك مان برضه زي ما بيعلموكم الأيام دي ؟؟؟ طبعا حضرتك يا مان لسه صغنن وما شفتش تصريحات الواطي حسني مبارك زمان من خمسة وعشرين سنة لأنك كنت لسه ما اتولدتش خالص .. ممكن ترجع لأرشيف الأهرام وتبص الواطي كان بيقول إيه عشان تعرف هو واخدنا لفين ... قبل ما يركب الكرسي أيام ما كان صوفي أبوطالب رئيس مصر المؤقت بصفته رئيس مجلس الشعب كان المتعوس حسني بيقول إنه رافض هذا الكرسي .. بعد يومين من المحايلة والمناهده مهاه .. قال إيه يا خويا قبل بس<br />اقرأ بقية التعليق .."
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129043725/http://masr.20at.com:80/article.php?sid=1181"

