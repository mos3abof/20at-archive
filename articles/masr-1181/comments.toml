subject = "احنا نستاهل"
author = "مبقوق"
posted = "2006-11-21"
text = "احنا الشعب المصري نستاهل اللي بيحصل فينا لاننا شعب جبان وبنتشطر علي بعض بس يا اخوانا في شعب يحكمه واحد ربع قرن ويقولهم حافضل احكمكم لاخر يوم في حياتي وكمان حيورث المحروس بالذمه مش احنا شعب جبلات شوفوا شعب رومانيا عمل ايه في الحاكم لما فسد هو والبطانه بتاعته ولا الفلبين ولا بولندا ولا الارجنتين قوموا ثوروا ده البيضه بقت بجنيه والبصل بخمسه جنيه والشباب اللي مش لاقي شغل وفي نفس الوقت البلد بتتنهب والمليارات بتتهرب من بطانه مبارك يا شعب ياهبل قوموا فوقوا منتظرين ايه فوقوا فوقوا"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129043725/http://masr.20at.com:80/article.php?sid=1181"

