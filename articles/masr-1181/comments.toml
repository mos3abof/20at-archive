[[comments]]
order = 0
subject = "في موريتانيا (فــال) حلو خالص"
author = "إبن بهية"
posted = "2006-11-19"
text = "إبن بهية<br />أستغرب من قلة التغطية الإعلامية لموضوع الانتخابات البلدية الموريتانية رغم خطورة الموضوع .. فهو ربما يكون حلقة (بايلوت) في مسلسل التغيير العربي والإسلامي .. بروفة يعني .. آه لو نجحت تجربة إخواننا الموريتانيين وأتت بحكم ديموقراطي محترم سيكون بكل تأكيد (فال كويس أوي أوي) .. أقصد الإثنين كويسين طبعاً رئيس الحركة العسكرية (المباركة حتى اليوم) العقيد علي ولد محمد فال ، وبرضه فال كويس أوي أوي (من باب الفأل الحسن) لينا في مصر لو أكرمنا ربنا بحفنة عسكر تسري في عروقهم دماء حارة وانتزعوا البلد من براثن النظام الحاكم بأمر مش عارف مين .. تعلمنا قديماً أن الانقلابات والحركات العسكرية في أي بلد في العالم تأتي كنتيجة منطقية لجملة من الأسباب .. تتوفر كل هذه الأسباب في بلدنا الحبيب مصر منذ أكثر من ثلاثين عاماً ويزداد تركيزها كل يوم حتى باتت معتقة جداً لدرجة شديدة المرارة وشديدة العطن والعفن ..<br />لقد أعياني البحث كثيراً في سر عدم قيام أي حركة عسكرية انقلابية في مصر حتى الآن برغم كل ما تعانيه من آلام ومشكلات داخلية وخارجية بسبب ذلك النظام البغيض ؟؟؟ مليارات المليارات تنهب كل يوم وأهل مصر تقطعت بهم السبل في شتى بقاع الأرض طلباً للقمة العيش التي قلما يجدوها ويلعقون كرامتهم اتقاء عضة الجوع التي لا ترحم .. وفي المقابل تجد القطط السمان تزداد تخمة ورفاهية تصل إلى أبعد حدود السفه التي يمكن معها أن يصل مصروف قطيط صغير (قطقوط صغنن) إلى ما يوازي مصروف حي كامل من أحياء القاهرة الفقيرة .. دماء المصريين باتت مهدرة بعد أن أهدرت كرامته وأمسى لا قيمة له ولا ثمن يذكر ..<br />يموت المصريون يومياً في البر والبحر والجو بلا ثمن ولا مسائلة حتى من باب تكريم الإنسان .. يموتون على الإسفلت من جراء سرقة ونهب مليارا<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085556/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 1
subject = "يا محلا فزعة ظباطنا الأحرار .."
author = "إبن بهية"
posted = "2006-11-19"
text = "كان يوماً صاخباً من تلك الأيام التي تأتي حبلى بالأحداث مالئة الدنيا ضجيجاً وصراخاً وزغاريد ودموع .. هكذا كان اليوم بالنسبة لي على الأقل ، في مصرنا الحبيبة أتحفنا فخفخامة جلالة مبارك بواحد من خطاباته الملتوتة التي لا تأتي بجديد سوى محاولاته المستميتة للحفاظ على الكرسي له ولمن بعده من العائلة المباركية ، فور انتهاء وصلته المملة راح كثيرون يحللون ويفندون بأدب ورقة حائمين حول الحمى فقط دون ملامسة لتلك الفقاعة الخاوية التي يتحصن داخلها فخفخامة جنابه .. ليس احتراماً له لا يستحقه بتاتاً بتيتاً ولكن احتراماً وتقديراً لذاتهم من المرمطة على أسفلت معتقلات مصر المحروسة.<br />من المحللين من قسم الخطاب إلى ثلاثة أجزاء اقتصادي ، داخلي ، وخارجي ولا أدري على أي أساس قسمه هكذا ومنهم من قسمه إلى أربه ومنهم من مر عليه مرور اللئام ساجداً لكل كلمة مما نطق به فخفخامة جلالته ولو أنه كلام خايب ولا معنى له لكن هكذا دور هؤلاء اللئام المرسوم لهم من أسيادهم في الحكومة ممن وضعوهم في مقاعد رؤساء تحرير الصحف الحكومية في روزاليوسف ودار الهلال وغيرهما ، الشاهد أنا لم أجد في خطاب فخفخامة جلالته أي كلام جديد سوى إصراره على المكوث فوق صدورنا إلى أن يريحنا منه عزرائيل كما قال هو بنفسه والله .. لقد وعد بأنه مستمر إلى آخر نفس .. البعض يسميها صراحة ولكني أسميها وقاحة من فخفخامة جلالته واستهبال إلى أبعد حد.<br />فالوقاحة واضحة في ضربه بعرض الحائط بكل توسلات الشعب الجائع له بالخروج من حياتنا بالتي هي أحسن وأما الاستهبال ففي حديثه عن نيته تعديل المادة 76 من الدستور وكأن هذا الدستور مما ورثه في الغرفة التي تركها له المرحوم عم مبارك العرضحالجي كاتب المحكمة المسكين الذي ربما يتألم في قبره اليوم لما يلاحقه من لعنات الشعب .. يع<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085556/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 2
subject = "بيكره القضاه"
author = "بيكره القضاه والمحامين علشان بيفكروه باللى كانوا بيعملوه فى أبوه لو ماقلش كلمة محكمة عدل لما يدخلوا المحكمة يعنى عنده عقدة نفسية منهم علشان كده بينتقهم من القضاه والمحامين"
posted = "2006-11-19"
text = "أنا نفسى أعرف هو قرفان على طول من الشعب كده ليه ودايماً ببص للناس شزراً كده ليه علشان يعنى الشعب فيه ناس كفاءات أحسن منه ومن أبنه الأهبل<br />80 سنة وعايز يقعد لغاية آخر العمر هو لسه فى عمرك بقية ده أنت عايش فى الأوفر تايم<br />يا عم روح شوفلك تربة تلمك ده إللى قدك بيشخ على روحه وبيمشى على كرسى متحرك وأنت بتعافر مع عزرائيل ربنا يخدك يارب ويريحنا منك بقى كفاية علينا قرفك"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085556/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 3
subject = "الحرامي ليس له إلا ضرب الجزمة"
author = "إبن بهية"
posted = "2006-11-19"
text = "على فكره أنا من سنين طويلة أوي لا باسمع ولا باحب حتى أشوف صورة الواطي حسني مبارك .. الخطاب اللي قرفونا بيه زي العادة سمعت مقتطفات منه على قناة الجزيرة وتعليقات وتحليلات كالعادة فلا يمكن أن أتحمل ثقل دم ذلك العتل مطلقاً .. أقسم لكم بالله العظيم أنني صادق فيما أقول .. لا أتمكن أبداً من النظر إليه ولا رؤية وجهه القبيح لا هو ولا إبنه ولا حكومته القذرة وذيولها .. الموضوع مش عيب فيا ولا إني ما باعرفش أعارض وأختلف .. لأ بدليل أن لي أصدقاء حميمين من كل التيارات ويعرفون عني أنني أكثرهم تسامحا مع الجميع .. لكن الموضوع مع تلك العصابات المباركية مختلف .. أنت هنا لست مختلفا في الرأي كما يظن البعض .. أنت هنا أمام حرامية .. نصابين ..مصاصي دماء الغلابة والشعب .. كيف يمكنك النظر إليهم دون أن تخلع حذائك ؟؟؟؟ ازاي يعني ؟؟؟ ليه ما فيش دم عندنا خالص ... الكلام ده باوجهه لمن يتحزلق ويعتقد أننا نتهجم على الواطي مبارك وعصاباته ولا نعرف أن نختلف في هدوء ... يا عمنا الخلاف والاختلاف شيء وإنك تكون منهوب ومسلوب ومسروق وضايع ومتنيل على عينك شيء آخر .. يعني واحد خطف بيتك وكسره وحبسك جواه ومانععنك اللقمة وحصل هو على كل ما في البيت وتيجي تقولي اخلاف رأي ووجهات نظر .. ما هو برضه الحرامي اللي عمل كده في بيتك وجهة نظره أنه كده .. أيوه هو كده بالقوة .. وحضرتك يا طيب يا مؤدب وجهة نظرك أنه بيتك وحقك .. هل يمكن أن تقف وتناقشه بهدوء وتطلب منه في عطف وحنان أن يشرح لك وجهة نظره فيما اغتصبه منه .. وتتحايل عليه عشان يديك حتة لقمة من بيتك ؟؟؟؟ تيجي ازاي يعني ؟؟؟ طيب هو لو البعيد بيتفاهم وعنه أصلا استعداد للتفاهم كان لهف البيت منك يا عبيط ؟؟؟ يا ناس فوقوا وبطلوا التوهاناللي انتم فيه ده ... عمر الحرامي ما يتفاوض ولا يمكن<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085556/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 4
subject = "قاعد على قلبنا"
author = "توتى"
posted = "2006-11-19"
text = "ابشروا يا اهل المحروسه لقد تفضل رئيسنا المبارك مبارك و تنازل تحت ضغط من كل شعب مصر و قرر ان يظل كاتم على انفاسنا حتى اخر نبضه فى قلبه و اخر نفس من انفاسه<br />شفتم تضحيه و وفاء اكتر من كده لهذا الشعب الذى لا يعجبه العجب<br />و اذا كان هو قد اقترب من الثمانين فهو لابد وان يضمن لابنه ان يبقى فى الحكم مده ضعف مدته معنا<br />و من اجل هذا لا مساس بالماده 77 من الدستور بتاتا<br />و اللى موش عاجبه ارض الله واسعه<br />ليس امامنا الا انتظار الفرج من عند ربنا<br />اللهم انشر رحمتك على العباد و عجل بالفرج يا ارحم الراحمين"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085556/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 5
subject = "مبروك عليك البلد يا مبارك"
author = "فارس_fr"
posted = "2006-11-20"
text = "\" أجمع نواب الشعب والشوري علي أن الخطاب التاريخي للرئيس حسني مبارك في افتتاح الدورة البرلمانية الجديدة.. يعد علامة فارقة في مسيرة الإصلاح السياسي. حيث وضع الرئيس أسس التعديلات الدستورية ل 30 عاماً قادمة. \"<br />تخيلوا انه عامل فى حسابه 30عام قادمة -الراجل هيعمل للبلد ايه اكترمن كده ده كفايه انجازات ال25 سنة اللى فاتم ,,, الله يعينكم بقى استحملواكمان 30سنة يمكن ربنا يعدلها من عنده .....<br />للاسف بوالصدفة البحته غيرت المحطة على قناة العربية والفضائية المصريةاحيانا لسماع الخطابالعالمى للسيد الرئيس المبارك -الله لا يبارك فى صحته - المهم انه كالعادة3/4من الاعضاء اللى فى المجلس والله اغلبهم كان نائم وان لم يغلق عينه فهوا فاتحها ونايم برده ويصحى على التسفثق وخلاص ولا هو فاهم حاجة ,,, واستوقفنىكلمة للسيد الرئيس \" اللامركزية فى التعامل مع مواد الدستور \" طب بالله عليكم الفلاح او الراجل البسيط يفهم الكلمة دى معناها ايه او حتى اعضاء المجلس وارهن اذا كان مبارك نفسه فاهمها .. يمكن الوحيد اللى فاهمها اللى كتب له المقال ...<br />عموما مبروك علينا 30 سنة قادمة من الانجازات<br />السطور الاولى منقولة من الجمهورية ...!!"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085556/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 6
subject = "تحيا مصر"
author = "نيفين نيفى نوفا"
posted = "2006-11-20"
text = "عجبنى اوى حاجه لفت نظرى ليه عمرو اديب ف القاهره اليوم<br />فاكرين يا جماعه ايام موضوع العباره الحكومه غطت عليه بايه<br />برافو عليكم<br />بانفلونزا الطيور<br />و دى اللعبه<br />بقدره قادر تتزامن التصريحات الناريه (المقصوده)لفاروق حسنى مع خطاب الرئيس الهام و المنتظر<br />حكمتك يا رب<br />بسالحكومه بتحسبها كدا<br />الحسبه غلط و جت اوت المره دى<br />لان وقع كلام الرئيس كان صعب شويتين على اسماعنا<br />بقى قاعد لحد اخر نفسس<br />و الله دا احنا اللى نفسسنا اتقطع<br />ربنا يديه الصحه"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085556/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
order = 7
subject = "خرابة فسيحة عليها تميس وأأمر تطاع فشعبك مفيص"
author = "أبو عمر"
posted = "2006-11-21"
text = "أولا كل الشكر والتقدير للصحفي إللي كاتب الخبر وثانيا ألوم بشدة جموع المواطنين والذين يمثلون الشعب المصري وبصراحة معنديش كلام أقوله إلا القصيدة دي فهي أكثر تعبيرا من أي كلام... عليا الحرنكش ياريس مبارك .. في عصر مزركش ملون بنارك<br />لأبيعك وأبايع حكومة حمارك.. ملعون أبو اللي يقدر يقاطع قرارك.. نهاره مقندل وليله مبارك فهمبك وهيص وطلع في ديننا..<br />أكيد هو طالع يشاهد جمالك جمالك جمالنا سوزانك سوزاننا.. يامحلا لمصر اللي جالنا<br />نسيمها في عصرك بيشوي ف بدنا.. أأيد وأبايع فخامة جلالتك وأأيد أي واحد بيمسح ريالتك.. ولأنك سر باتع هننسى هبالتك فأقعد ياريس ودلدل حمامتك.. حمامة السلام حمامتك ياريس سلامة الحمامة وسلامتك ياريس<br />ياريس حمامة ياريس كويس.. على تل مصر ياريتك تهيص خرابة فسيحة عليها تميس<br />وأأمر تطاع فشعبك مفيص.."
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129043725/http://masr.20at.com:80/article.php?sid=1181"

[[comments]]
