subject = "الى بن بهية"
author = "طليعة الاحتضار"
posted = "2006-11-23"
text = "انا من المصريين الذين تنحسرعنهم الحياة بالتدريج فى هذا البلد بفعل سياسات هذا الشىء وبفعل العولمة وما بعد الحداثةوقد حدث هذا فى كل مراحله التاريخية السابقة<br />فهل يصر على ان يلاحقنا بعد الاحتضار فى المراحل القادمة النى اصر على ان يبداها<br />حتى اخر انفاسه والله لكانى ارى رواية خريف البطريرك راى العين واقعا متجسدا علما بانى تعبت كثيرا حتى افهمها وهاهو يفسر لى ما عصى على من فهمها ارجوكم اقرءوها حتى تروا حجم المصيبةالتى تعيشون فيها<br />بالنسبة الى ابن بهية :انا غير محترف نت ومدونات ولكن ان كنت انت من ذكرك هيكل فى حديثة فى قناة الجزيرة فانى اهنئك ان ذكرك مثل هذا الرجل وان كانت التهنئة متاخرة (وفيفا الماتشو)يعنى عاش الفحل وهى جملة مذكورة فى رواية خريف البطريرك"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129043725/http://masr.20at.com:80/article.php?sid=1181"

