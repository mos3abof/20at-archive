subject = "التزام الادب"
author = "محمدأغا"
posted = "2006-11-25"
text = "ارجو من السادة المتحاورين التزام الادب وعدم الخروج عن اللياقة فنحن مسلمين وطنين لايمكن ان نطلق السنتنا بهذه التفهات \"وهل يكب الناس على وجوههم فى النار الا من حصاد السنتهم\" ويمكننا التعبير عن الراى فى حدود الادب والالتزام بتعاليم الاسلام وادابه نعم نحن فى غاية النكد والخنقة ولكن يجب التزام حدود الله...."
archived = "2006-11-29"
