text = "ربنا ينتقم منه عن قريب يا رب ونشوفه زي السادات مقتول , الحرامي اللص ابن الكلب<br />سارق البلد هو وعصابة الاربعين حرامي بتوعه.<br />يا رب خلصنا منه بقي , والشعب خلاص جاب اخر."
