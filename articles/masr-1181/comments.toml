subject = "غلط"
author = "حنيين"
posted = "2006-11-21"
text = "اسفة انتم خلتونى اقول كلام وحش اكيد انا مش بحب للريس حاجات كتير واكيد بردوا فيه مميزات بردوا كتير النقد بيكون بالذوق مش بالكلام الجارح او قلة الادب كدة انت شتمت استفدت ايه مغيرتش حاجة شتمت وبس يا ذكى لاكن متنسوش انه بشر وحتى لو غلط من منكم هيكون رئيس مصر ولا تغلبه هذة الاغرائات<br />اقول قول عيسى عليه السلام( من كان منكم بلا خطيئة فليرمه بحجر )"
