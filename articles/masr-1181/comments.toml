text = "اولا:اظن ان نسبةالمهمومين بحال البلدالى اولئك الجبلات الغلابة الذين لم يشعروا حتى الان بحجم الكارثة نسبة ضئيلة جدا وللاسف هم الذين يرجحون الكفة لصالح الانهيار الذى اصبح كالنار فى الهشيم واظن ان لسان حال البلهاء من اهالينا يقول نموت نموت ويحيا الدكش<br />وكذلك فان الدكش يخرج من غرفة عمليات (مصر)ولسان حاله يقول الحمد لله العملية نجحت احنا اضطرينا نضحى بالوطن والشعب علشان تعرف نعيش قطيعة محدش بياكلها بالساهل وعجبى"
