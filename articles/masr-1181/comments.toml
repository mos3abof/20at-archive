[[comments]]
order = 29
subject = "واضح"
author = "واضح يا دشم أنك ومبارك وجهان لعملة واحدة وأنك مش عايزه حد يشتم فيكم رغم كل إللى عملتوه فى مصر يعنى عايزين تسرقوا وتنهبوا وتزوروا وتبيعوا مصر لحسابكم والشباب يبقى فى بطالة وبعدين تعايروه بالبطالة بتاعته وبعدين عايزة استكمال لأنهى مسيرة بالظبط وتوريث إيه ده إللى بتختمى بيه كلامك القذر هو أنت لسه فيكى نفسك علشان تتكلمى وبعدين القرد فى عين أمه غزال وأنت شايفه أن أبنك يصلح للحكم علشان تكملى النهب والفساد والشعب إللى بيعانى من حكمكم خلاص شبع فساد وياريت تستكفى باللى نهبتوه وتعرفى أن الشعب خلاص جاب جاز ومش طايقككم"
posted = "2006-11-25"
text = "أحب بس أعرفك أنك علشان أنجليزية والإنجليز كانوا بيبصوا للشعب على أنه عبيد فإنت فاكره أن الصورة دى لسة موجودة وأنك بتحكمى عبيد لا يا هانم أبناء الشعب كلهم أكفء من أبنك وأحق منه بقيادة مصر وأحمدى ربنا أن الشعب بيشتمكم لغاية دلوقتى بس وياريت تكتبى بإسمك الحقيقى وتسيبك من المسميات الغريبة إللى بتسمى نفسك بيها مرة الدشم ومرة مصرية مطحونة ومرة مصرية بجد وكل أرائك مرفوضة وقضيتك خسرانه"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129043725/http://masr.20at.com:80/article.php?sid=1181"

