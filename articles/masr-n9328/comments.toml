subject = "هناك فرق كبير قوى"
author = "فيه فرق السما للأرض بين أم المصريين سيدة مصر الأولى نهى الزينى التى نبتت من تراب مصر الغالى وتربت على العقيدة والمبادئ المصرية وبين نفايات السوق الأوروبية تربية التمرجية التى لا تعرف إلا النهب والفساد والتعالى وفرض إبنها موظف البنك الكحيان على الشعب أل إيه رئيس ياخى دى بجد عايزه الحرق وفعلاً إسم سيئة مصر الأولى ينطبق عليها"
posted = "2007-01-04"
