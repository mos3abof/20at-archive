subject = "أمى الغالية"
author = "أمى نهى الزينى أتشرف بك أم للمصريين جميعاً ولكنى أتمنى أن تجهرى أكثر بقضية مصر كلها وهى تزوير الإنتخابات ففيها خلاص لمصر بعد إثبات عدم شرعية مبارك فى الحكم للتزوير ولتكن قضية الشعب كله التى بها نسقط حكم مبارك الفاسد"
posted = "2007-01-02"
text = "أنت سيدة مصر الأولى التى نتشرف بها قدوة لكل الشعب فإنت نواة صالحة نتمنى أن تنبت بها أرض مصر الخصبة<br />اللهم ولى علينا خيارنا ولا تولى علينا شرارنا اللهم آمين"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071238/http://masr.20at.com:80/article.php?sid=1395"

