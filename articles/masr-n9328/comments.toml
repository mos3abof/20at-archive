text = "ليفى شيعى ههههههههههه حلوه يا زلمه ..هل وصل الانحدار الفكرى بالمصريين الى اعتبار اليهود اساس لكل بلاء .. ان اليهود هم بناة الحضاره الفرعونيه وهم بناة الحضارة العالميه الجديده .. واتمنى من مصر ان تصل الى ما وصلنا اليه نحن اليهود من رفعة وازدهار .. وسلم لى على الشيعه"
