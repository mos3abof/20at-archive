[[comments]]
order = 24
subject = "الى مى و ابن بهيه و محمد سالم"
author = "نيفين نيفى نوفا"
posted = "2007-01-04"
text = "اولا الى مى انتى بتقولى علشان منخوضش ف اعراض الناس انتى بالفعل خضتى و اقرى موضوعك تانى و انتى تلاقيكى خضتى كذا مره<br />دا رايك و لا حجر فكرى على الاراء<br />بس اكيد الف باء صحافه هى احترام خصوصيات الاخرين حتى لو كانو سيئين و لتا هتتحول لصحافه صفرا<br />انا قبا كدا لما كتبتى بموضوعيه حييتك<br />لكن يا مى كدا و حششششششش<br />و ابن بهيه ارجوك<br />انت عارف انى بحترم عقليتك و كتي من القراء كدا<br />يبقى ليه برده نخوض ف خصوصيات الناس<br />خدسجه و لا منى و لا سلوى و لا اى واحده يتجوزها و لا يخطبها جمال ذنبه ايه تسمع الكلمتين دول<br />خليك موضوعى و انتقد سياسه الراجل بلاش خصوصيات الناس<br />و الله ده حرام يا جماعه<br />بالنسبه لمحمد سالم انا شايفه انك تنصح نفسك<br />معلش اسمحلى<br />لما انت بتنوه لنا عن ليفى كنت ارحمنا من الكلام اللى قلته ف تعليقك عن صدام<br />و لا ينصحون الناس بالبر<br />معلش انت ضايقت ناس كتير ع الموقع"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224733/http://masr.20at.com:80/article.php?sid=1395"

[[comments]]
