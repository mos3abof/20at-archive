text = "والعتبة قزاز والسلم نايلون فى نايلون<br />وكلة كلام فى كلام<br />والعبارة فى الدبارة<br />يابويا اضربها حجرين وانسى<br />تابع اخبار المخلل والقرع العسلى والبدنجان الرومى<br />اية رايك فى حتة جبنة قديمة وشوية فول اخضر وتقعد تحت الشمس تتشمس فى امشير<br />وفى الختام<br />طاطى راسك طاطى انت فى بلد ديمقراطى"
