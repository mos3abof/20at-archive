text = "الحضارة المصرية لم يبنها غير المصريين لانهم كانوا يعتبرونكم نجس لا تلمسون معابدهم ولا مقابرهم<br />واذا قلتم كذبا انكم بنيتم لنا الهرم<br />فلماذا لم تبنوا لكم ولو هرم نونو فى فلسطين<br />ليفى ---كان العلق نفع نفسة"
