posted = "2007-01-02"
text = "انتبهوا ياجماعه وخلوا بالكم .... اللي كتنب باسم ليفي هو نفسه اللي اتكلم عن الشيعه<br />وطبعا المقصود هو ان نبتعد عن الموضوع الاصلي ونتبادل الشتائم ....بيجرب مره يستفزنا بانه اسرائيلي<br />ولما الناس تجاهلته وحسنا فعلوا .... حاول ان يدخل من السكه الطائفيه.......تجاهل هؤلاء هو الاسلوب الناجع... وانا علقت فقط حتي لا يقع احد في خدعة هذا المغفل<br />وتحيه للمستشاره نهي الزيني"
