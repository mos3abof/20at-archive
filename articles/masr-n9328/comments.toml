[[comments]]
order = 26
subject = "ربنا يهدينا كلنا ويخلصنا من الجبن والنفاق."
author = "ليفى - من تل ابيب"
posted = "2007-01-04"
text = "ليه فترة طويلة عامل خواجة من وسط تل أبيب وفيكم اللي صدق، وفيكم اللي مش عارف يقول إيه. حضراتكم كلكم على عيني وراسي، ولكن يا حبايبي وتاج راسي الكلام يبقى في الآخر كلام وبس. بقالي أكثر من سنة بحالها وسطيكم وباقرا اللي بتقولوه وتكتبوه، وأعترف إن كثير من اللي قريته معقول وفي الصميم. طيب هو الحل إيه؟ فيه حل؟ ومين اللي راح يحل مشاكلنا طالما إحنا ملناش دعوة بحاجة خالص؟<br />قرفت من نفسي ومنكم وأنا عمال أستفزكم تعملوا حاجة غير الشتيمة، هو إسرائيل يا أذكياء مش ضامنة مصر في جيبها؟ ناقصه دعاية سنكوح زي أنا؟ ربنا يهدينا كلنا ويخلصنا من الجبن والنفاق."
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224733/http://masr.20at.com:80/article.php?sid=1395"

[[comments]]
order = 27
subject = "يا أغلى النساء"
author = "عندما تشتد ظلمة الليل يأتى نور الفجر وأنت يا أمى نهى الزينى نور الفجر فى ظلام تتخبط فيه الذمم وتسقط فيه الضمائر ليظل الليل دامس وتموت الضمائر فأنت يانور رفض الفساد ولم يكتم شهادة الحق"
posted = "2007-01-04"
text = "كل عام وأنت بألف خير والله لو بأيدى كنت رشحتك ملكة للحق والضمير ولكنى أرشحك أمى الغالية"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224733/http://masr.20at.com:80/article.php?sid=1395"

[[comments]]
order = 28
subject = "ليفى - من تل ابيب"
author = "ليفى"
posted = "2007-01-05"
text = "الزلمه اللى سمى نفسه ليفى من تل ابيب بدى احكيلوا ماتتشطر على اسيادك لان مابيشرف اليهود يكون واحد مثلك يهودى احنا اسياد العالم ونحرك الكون باصبع واحد وبدى احكيلوا لو فى مصر يهود مثل زمان كان حالكم افضل بكثير ومن يوم ماليهود سابوا مصر اتخرب بيتكم لانكم مابتعرفوا لافى الاقتصاد ولافى السياسه ولا فى الحرب ما بتعرفوا الا فى المظاهرات وحرق اعلام امريكا واسرائيل"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224733/http://masr.20at.com:80/article.php?sid=1395"

[[comments]]
order = 29
subject = "معلومة عن جماعة ليفي"
author = "اليهود ينتجو (82 % )من الفيديو كليب"
posted = "2007-01-06"
text = "وأفهم يا فهيم<br />بس اللي قال اليهود بدو من سينا لفلسطين ضحكني<br />ياخي اليهود جايين من اثيوبيا واوكرانيا وكثير من الدول<br />يعني ما بتجمعهمش قومية وحدة"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224733/http://masr.20at.com:80/article.php?sid=1395"

[[comments]]
order = 30
subject = "ليفى - من تل ابيب"
author = "ليفى"
posted = "2007-01-06"
text = "مين قال ان اليهود من بدو سيناء .. ان اليهود هم سكان الجزيره العربيه الاصليين .. من فلسطين الى مصر الى ارض الحجاز.. يعنى كل بلادكم هى فى الاصل بلد اليهود..ثم هاجر البعض منا الى اوروبا وعدنا الى فلسطين ارض الميعاد ..عدنا لنعيد حضارتنا التى رسمها لنا التلمود"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224733/http://masr.20at.com:80/article.php?sid=1395"

[[comments]]
order = 31
subject = "فعلاً أمى"
author = "أنا دشم وليفى"
posted = "2007-01-07"
text = "أنا دشم وأنا فعلاً ها أختار المستشارة نهى الزينى سيدة لمصر الأولى لإنها أجدر بهذا اللقب وكمان هاأختار السيدة زات الرداء الأزرق إللى كانت مرمية على الأرض فى صور الضرب يوم التضامن مع القضاه وكان الأمن المركزى مش راحمها وعمال يسحبها لغاية لما ملابسها كشفت عن جسدها رغم أنها مصرة على مبدأها وهو التضامن مع القضاه أحيي كل أمرأة مصرية ترفض مبارك وعائلته الحقيرة وإبنه المدمن الشاذ الذى لا يصلح لأى شيئ سوى لأن يكون حرامى وحسبى الله ونعم الوكيل<br />كل عام ونساء مصر الشريفات كلهم بخير وربنا يهدى النساء الغير شريفات علشان يبقوا كمان بخير وربنا يبعد سوزان مبارك وعائلتها كلها عن مصر"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224733/http://masr.20at.com:80/article.php?sid=1395"

[[comments]]
order = 32
subject = "الي نيفين"
author = "محمد سالم"
posted = "2007-01-08"
text = "اولا: انا وجهت نصيحه للجميع حتي لا نبعد عن الموضوع الاصلي ....لو النصيحه مش علي مزاجك ... مش مشكله يمكن غيرك ياخد بيها ...انا فصدي الخير مش اكتر<br />ثانيا : اذا كان رايي في موضوع صدام لم يعجبك ...كنت تقدري تناقشيني في مكان نفس الموضوع ..مش هنا واحنا بتنكلم عن السيده الفاضله نهي الزيني<br />خلينا نتفق علي نهي الزيني ونختلف حول صدام... ايه المشكله<br />انا من حقي اعبر عن رايي مادام لا اجرح في احد او سيء الادب مع احد...وانا عمري ما بدات بغلط في مناقشتي مع اي حد..<br />الاختلاف مش بالضروره شيء سلبي احيانا بيكون ايجابي وضروري<br />اخبار الماجستير ايه ... وابقي سلميلي علي هبهوب<br />ياله باي"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112163708/http://masr.20at.com:80/article.php?sid=1395"

[[comments]]
order = 33
subject = "شاهيناز المزورة هزت مصر بالملايين"
author = "مجاهد شرارة"
posted = "2007-01-08"
text = "الأستاذة كاتبة المقال<br />ما كتبتيه عن شاهيناز النجار عار تماما من الصحة<br />فهذه المرأة \" الحديدية\" دفعت من الأموال لتنجح في الانتخابات الكثير وهذا ثابت في تقارير منظمات المجتمع المدني التي راقبت الانتخابات حتى وصل الصوت الانتخابي الواحد الى 200 جنيه مصري في انتخابات الاعادة ..<br />ومعلوم ان شاهيناز ليست من أهل دائرة المنيل ولا تسكن بها وأتت على هذه الدائرة بالباراشوت ..ويكفي يا استاذة أن تعلمي أن رجال أمن الدولة تعاونت مع شاهنياز تعاون تام حتى اوصلوها للفوز .. فليس لديها تاريخ سياسي أو حزبي ... وكان جل اهتمام الامن ان يسقط مجدي حسين ونجحوا بفعل التجاوزات التي قدم بها مجدي حسين طعن على هذه النتائج وهذه الانتخابات ...<br />ما أقوله أن شاهيناز نجحت بالتزوير المعنوي .تزوير ارادة الشعب بدفع الملايين<br />وللعلم أن هذه الدائرة بها مناطق تحت خط الفقر أمثال الجيارة وابو السعود ومنطقة المنيل القديم وقامت شاهيناز بمعاونة من أمن الدولة باستخراج بطاقات انتخابية لهؤلاء الناس وكان ثمن الصوت في الجولة الاولى 50 جنيها وبالفعل اتاني رجل مسن وحالته يرثى لها يطلب مني خمسون جنيها بعد أن أدلى بصوته وعندمااستغربت سؤاله قال لي هناك من طلب منه الادلاء بصوته للدبابة(رمز شاهيناز) والساعة(رمز فتحي جليد) وسيعطيه خمسون جنيها ....<br />أرجو التدقيق في المعلومات والسعي الحثيث وراء الحقيقة ...<br />للعلم<br />لست عدوا للمرأة ولا لوصولها اعلى المناصب<br />لكنني عدو للتزوير والنصب ...<br />لذلك اشكرك لأنك وضعت رمزا يستحق كل تقدير مثل المستشارة نهى الزيني"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112163708/http://masr.20at.com:80/article.php?sid=1395"

