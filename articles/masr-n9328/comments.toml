[[comments]]
order = 18
subject = "الى سيدة مصر"
author = "ihab ahmed"
posted = "2007-01-03"
text = "لو اردنا ان نعلم السيدة التى مثلها الفنان محمود مختار فى تمثال نهضة مصر فلن تكون هذه السيدة غير د-نهى الزينى<br />فلقد راينا فيها السيدة المصرية فى شجاعتها وقوتها وصلابتها فانعم بها من ام اضائت للمصريين جميعا درب الكرامةوالحرية<br />واما بالنسبة لانضمامها للاخوان ام لا فان الاخوان قبل ان تكون جماعة فهى فكرة وشجرة مغروس بذرتها فى صدر كل من عرف الشرف والكرامة والدفاع عن الحق والتضحية من اجله"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071238/http://masr.20at.com:80/article.php?sid=1395"

[[comments]]
order = 19
subject = "إحنا في زمن المسخ"
author = "لما نبقي في الزمن اللي إحنا فيه ده"
posted = "2007-01-03"
text = "زمن ترقص فيه الكلاب و تلعق الاسود جراحها زمن دينا و نانسي و سعد الصغير زمن التوربيني و عز و إسلام نبيه زمن ممدح إسماعيل زمن الفساد و المفسدين زمن يتوراي فيه الشعب و شرفاء الامة و يسطع نجم مفسديها و لصوصها و سفاحيها فقلما وجدنا من هم في هامة و شرف و كبرياء السيدة العظيمة نهي الزيني<br />يا سيدتي كل سنة و إنتا و مصر و شعبها المخلص النبيل بخير و سلامة"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071238/http://masr.20at.com:80/article.php?sid=1395"

