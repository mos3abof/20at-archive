[[comments]]
order = 36
subject = "صدام لم يكن صلاح الدين في حروبه ... ولم يكن طومان باي عند اعدامه"
author = "الي نيفين ... نوفا .....من محمد سالم"
posted = "2007-01-18"
text = "* انا لم اري في الطريقه التي كتبت بها عن صدام قسوة بقدر ماكان فيها حقائق كادت ان تضيع وسط التعاطف الشديد مع مشهد اعدام صدام ..وكذلك النبره الطائفيه التي ارتفعت وتيرتها ...وهي في رايي اخطر ما يهدد امتنا في الوقت الراهن وتعادل في خطورتها وجود المحتل علي اراضينا...ان لم تكن اخطر في تاثيرها<br />** اما عن التوقيت ... فطرق الحديد وهو ساخن هو افضل الطرق للتاثير فيه.......لوكانت العمليه تتعلق بفرد ..لراعينا المشاعر وانتظرت التوقيت المناسب ولكني اعتقد ان في حالة مصير امة تنقلب عندها الموازين ليصبح الديكتاتور بطلا ...فالوضع مختلف هنا<br />**وازيدك من الشعر بيت ( علشان عارف انك بتحبي الشعر )....... واقولك بصراحه رغم قسوة كلامي ...ان انا كرهت صدام اكتر بعد موته .... لانه افسد الامه في حياته ....وحتي موته كان فتنه وافساد للناس<br />*** فالرجل لم يكن صلاح الدين الايوبي الذي حقق الانتصارات التي تجعلنا نتغاضي عن قسوة حكمه مثلا ...بل العكس الرجل لم يتاسد الا علي الدول الاسلاميه مثل ايران والكويت....وكانت النتيجه حروب عبثيه راح ضحيتها الالاف من المسلمين الذي لم تصورهم الكاميرات عند موتهم حتي نتعاطف معهم.....ولا يغفر له هنا مايقال عن النوايا الحسنه له لان القائد ينبغي ان يتوقع ويحسب ردود الفعل والحسابات الدوليه حتي لا تنتهي الامور ان يستغل اعداء الامه اخطاء الرجل بذكاء بالغ وتكون النتيجه اختلال ارضه وشعبه بعد ان قدم لهم الذريعه والحجه<br />**** ولم يكن ايضا طومان باي عند هزيمته فلقد كان مكروها من شعبه لبطشه وتجبره فانفض الناس من حوله ووجدوا في سقوطه وهزيمته نجاة لهم من براثن الظلم والطغيان .... اما طومان باي هذا الشاب النبيل الذي احبه الناس فلقد التف الناس من حوله لا صراره علي الدفاع عن بلده وقد اسر ف<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103310/http://masr.20at.com:80/article.php?sid=1395"

[[comments]]
order = 37
subject = "البطل طومان باى"
author = "طومان باى كان نائب للحاكم البطل الغورى"
posted = "2007-01-19"
text = "الذى خرج لمقابلة الاتراك فى مرج دابق<br />البطل الغورى كان عندة 70 سنة وظل يقاتل حتى سقط تحت سنابك الخيل<br />وتقدم الاتراك الى القاهرة<br />لم يهرب النائب بالذهب والمجوهرات<br />وحصن طومان باى القاهرة وقاتل حتى هزم<br />وامسك بة الاتراك<br />وشنقوة على باب زويلة<br />وظلت جثة البطل معلقة ثلاثة ايام<br />هذا رجل دافع عن مصر<br />لة كل الاحترام فى التاريخ<br />تحية لك طومان باى<br />رغم حقد الاقلية المريضة نفسيا التى تكرهك<br />تحية للشهداء الابرار على مدار التاريخ<br />وشهداء مصر فى سيناء<br />لهم الجنة والخلد<br />وانا لمنتصرون"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103310/http://masr.20at.com:80/article.php?sid=1395"

[[comments]]
order = 38
subject = "يلا يا ليفى امشى من هنا"
author = "مصرية"
posted = "2007-01-19"
text = "تحية للمستشارة ولامى نهى الزينى واللهى حضرتك فعلا تستحقى لقب ام المصريين وسيدة مصر الاولى عن جدارة .<br />وبالنسبة لليفى من تل ابيب اوعى تجيبى سيرة المصريين على لسانك ولو هتقولى على التلمود انا عندى كتاب اسمه\"الكنز المرصود فى قواعدالتلمود\"بيحكى تاريخكم البشع والقذر والكتاب دة نادر وانا قدرت احصل عليه باعجوبة والكتاب دة اختفى من مصر لانكم اخذتوا كل طبعات الكتاب ولمتوها علشان محدش يعرف تاريخكم الاسود وعلشان تكملوا باقى المسكنة بتاعتكم وتبينوا انكم المظلومين ويلا يا شاطرة خليكى فى تل ابيب بتاعتك ومتدخليش هنا تانى علشان الواحد مش ناقص قرف ومش طالبة معانا انى كل يوم نشوفك فى الموقع ."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103310/http://masr.20at.com:80/article.php?sid=1395"

