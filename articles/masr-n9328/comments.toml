[[comments]]
order = 9
subject = "كل عام وهي بألف خير ..."
author = "إبن بهيه"
posted = "2007-01-02"
text = "أنا لا أعترض مثل غيري على وضع اسم شريف محترم كالمستشاره نهى الزيني بجانب آخرين نعرف ثمن شرفهن .. لسبب بسيط هو أن الحياة بها الطيب والخبيث ومصر بقعة من هذه الحياة .. ولابد أن يكون بها طيب وخبيث .. هذه سنة الحياة .. لكن اعتراضي على فعل الهز نفسه ((هز مصر)) والسقوط به إلى مستوى خصر راقصه ((طلعت ولا نزلت رقاصه بضاعتها جسدها))<br />ولا رأي سعادتكم إيه؟؟؟<br />أما السيدة الموقره المستشارة نهى الزيني ((كل عام وهي بألف خير)) تستحق من عشرينات أكثر من موضوع وحدها بدون شريك معها، حتى لو كان مثلها في الشرف والأمانة ..<br />وكل سنه وكلنا أحسن من كده ... ومصر محرره ...<br />للجميع تحياتي<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071238/http://masr.20at.com:80/article.php?sid=1395"

[[comments]]
order = 10
subject = "نصيحه لخديجه ..."
author = "عمو إبن بهيه"
posted = "2007-01-02"
text = "طبعا لم أعلق على من تتوق إلى أن تكون السيدة الأولى حتى لا نخوض في أعراض الناس بغير علم .. بس النصيحه واجبه .. ونصيحتنا لها أن تحذر ولا تفرط في الهوس بمجاورة الكرسي الهزاز بتاع الرياسه .. وما تنسيش يا خدوجه أن من طلب يدك واطي إبن واطي وماسوني إبن ماسوني قذر<br />يا ريت يا بنتي تهربي من المصيبه دي وتنفدي بجلدك عشان مش هتلحقي .. صدقيني مش هتلحقي .. وخليكي فاكره الكلمتين دول .. اللي هما .. عريسك واطي إبن واطي وراح يوطيكي معاه مش حيرفعك زي ما انتي متصوره .. برضه الواطي واطي يا بنت الناس .. والكلمه التانيه .. مش هتلحقي ويمكن يتحرق قلبك النونو على أولادك بدري .. خديها من قصيرها وانفدي بجلدك أحسن ..<br />عمو إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071238/http://masr.20at.com:80/article.php?sid=1395"

