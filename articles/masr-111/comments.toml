subject = "هوه نص الليل بقى الساعه كام دلوقت"
author = "سنووايت"
posted = "2006-04-04"
text = "مش عارفه انا احيان كتير بتاخر بره البيت مع صحباتي بس مش اكتر من 11 بالليل لان بعد كده مفيش مكان نروحه<br />انا لما بقارن بيني دلوقت وبيني زمان بقعد اضحك لاني كان اكتر وقت بتاخر فيه بره كان الساعه 3 العصر<br />كل الي عايزه اقوله اني معتقدتش ابدا ان بنت حرة هتقبل انها تهين نفسها واهلها اللي وثقوا فيها وتعمل حاجة غلط التاخير دايما بيكون خارج عن ارادتها لظروف شغل او شوبينج او مسرح وشكرا<br />وربنا يتصرف فيه بقى عم قاسم امين ولا ايهّ!"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211325/http://masr.20at.com:80/article.php?sid=111&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

