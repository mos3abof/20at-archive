[[comments]]
order = 0
subject = "فكرتوني بالذي مضى"
author = "عبدالله مفتاح"
posted = "2006-04-02"
text = "كنت مرة في التحرير حوالي الساعه 12 بالليل(شتاء) دخلت شارع طلعت حرب ولمحت وانا داخل بنتين (مش محجبتين)العربيه بتاعتهم واقفه وهما واقفين محتاسين.<br />المهم مخدتش في بالي ودخلت اضيت مشواري في الشارع وانا خارج بعد نص ساعه حوالي لقيت العربيه لسه واقفه والبنيتن واقفين شكلهم غلبان اوي بصراحه صعبوا عليا<br />اكسفت اعرض خدماتي وكنت همشي لولا ان حاجه جت في نفوخي خلتني اقول لحسن واحد شرير يعرض مساعدتهم .انا ضامن نفسي وهما في ورطه.<br />واول مبصيت عشان اتكلم يادوب بقول اساعدكم؟<br />كانت واحده فيهم قالت الكوتش فضى تعرف تغيرة؟<br />ولاني مش عندي خبرة في اعمال السمكرة او الميكانيكا(غير الميكانيكا بتاعت ثانوي اللي في رياضه 2)<br />قلتلها هجرب<br />وكانت اول مرة امسك(كوريك) وافك عجله ولقيت العجله اتفكت وركبرت العجله التانيه؟( الموضوع سهل اوي )<br />المهم اول ما خلصت تركيب العجله ناولت البنت (الكوريك) وقبل ما تقول كلمة شكر كنت مشيت بس سمعت صوتها بتقول (جزاك الله كل خير)<br />روحت وانا مبسوط ان حد دعالي من قلبه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211325/http://masr.20at.com:80/article.php?sid=111&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "انا اخري بره اليبت 8"
author = "sweet_princess"
posted = "2006-04-02"
text = "ماما ماعندهاش حكاية التاخير برا البيت لبعد 8 ...<br />والا لو اتاخرت نص ساعه بس .. بتبهدلني ..<br />ودي حاجه على قد مابحس انها بتخنقني شويه ... الا انها بتسعدني في نفس الوقت لاني بحس قد ايه هي بتخاف عليا .. والحقيقه هي معاها حق في كل دا ..<br />وفعلا انا لو مكانها هتصرف بنفس الاسلوب ..<br />لكن لو هتاخر بره البيت طبعا لازم يكون اخويا معايا ..<br />وخصوصا اما بحب اشتري هدوم .. بخرج من العصر ومابرجعش الا على الساعه 11 ...<br />وطبعا بدب مع اخويا ميت خناقه عشان بيبقى عاوز يروح وانا بسوق فيها بقى ..طالما هو معايا ..<br />وكل مره يحلف مايجيش معايا .. وفي الاخر يسحب نفسه زي الشاطر وييجي .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211325/http://masr.20at.com:80/article.php?sid=111&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

