[[comments]]
order = 17
subject = "قال بعد المغرب قال.."
author = "مش مهم"
posted = "2006-09-26"
text = "مفيش بنت تخرج بعد المغرب .. يا سلام انتو تروحوا تنامو ياكتاكيت عالساعة سبعة عشان عندكو مدارس بكرة.. فى ايه يا جماعة هو اى بنت تسهر تبقى بنت مش كويسة بطلوا تفرقه عنصرية بقى.. حرام عليكو يعنى لو بنت فى حالها و الوقت متأخر ماكم و مالها الناس تقعد تجيب فى سيرتها و الله اعلم بظروفها.. و اللى يقللك تأخر البنات خلل فى المجتمع.. طب اشمعنى البنات؟؟ فى ولاد بتسهر للفجر و متقليش و شغل و بتاع.. هنعمل ايه مجتمع هيفضل طول عمره منغلق و بيتهم البنت فى كل حاجة.. ربنا معانا.."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118183131/http://masr.20at.com:80/article.php?sid=111&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

