subject = "بنات وسط النهار"
author = "هوووبه او هبهوب"
posted = "2006-04-03"
text = "انا ابويا متبرع بيا.....<br />والله العظيم بيثق ثقه عمياء بس اقول ايه لازم يخاف بردوه<br />مش يسافرني لوحدي والله العظيم لوحدي من الفرنجه لمصر<br />وعديت علي فرنسا لما دخت كل دا ليه يا \"دادي \"<br />لازم تتمرمطي علي الرغم من ان سني سعتها تحت العشرين<br />نقول ايه ولاه ايه<br />ولاه الصب واي اللي لولا ستر ربنا كان زماني في ههالرم<br />اقول ايه<br />ايه<br />ابويا."
