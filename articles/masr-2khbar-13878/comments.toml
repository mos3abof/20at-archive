author = "حروف اللغة العربية"
posted = "2009-11-01"
text = "حروف اللغة العربية تستخدم فى الكتابة بلغات اخرى زى اللغة الفارسية فى ايران ولغة الاوردو فى باكستان والهند فى بعض الولايات زى كشمير وكذلك افغانستان<br />يعنى من المغرب العربى على شواطىء الاطلسى وحتى حدود الصين و افغانستان الناس بتكتب حروف عربى<br />فمن الطبيعى ان يستخدم الناس لغتهم فى متابة عناوين مواقعهم ولكنى ارى انها انعزالية ولا تعمل اتصالات جيدة مع بقية دول العالم"
