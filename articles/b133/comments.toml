text = "الكلام ظريف و خفيف والله 000<br />و المشكله أن الكلام ده ماشى فى الواقع فمثلاً انا اعرف ناس اصحابنا بعيد عنكم من مدينة نصر بينزلوا من البيت الساعه 10 يوم الخطاب المهبب ده عشان يلحقوا ميعاد الساعة 12 و بيوصلوا فى حدود 2 , 2 و نص وفى احسن الحالات بيوصلوا 1و نص<br />فبصراحه حاجه تقرف"
