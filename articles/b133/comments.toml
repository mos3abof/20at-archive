[[comments]]
order = 1
subject = "عجبني ده"
author = "أنا"
posted = "2005-12-21"
text = "سي دي عمرو دياب الجديد<br />هو: ما توسع يا حمار، هو انا لازم اخبطك عشان تتعلم تسوق<br />هي: اهدى شوية يا تاكي، انت عارف الشارع كله واقف<br />هو: سيبك إنتي يا سوسن، انا اللي مصبرني المناسبة السعيدة، بابا كان هيروح فيها لو كان اتقلش<br />هي: وهو بسلامته يقدر يخطب من غير وجوده، هي الخطبة تحلى إلا بوجود الأكابر<br />هو: عندك حق، وولاد الأكابر كمان، هو احنا شوية في البلد<br />عمرو دياب: حفظت كل كلامك صم.. تحب أسمع؟<br />ـــــ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102105100/http://www.20at.com/article2.php?sid=133"

[[comments]]
order = 2
subject = "بسلامته .... الله يـريـ......ـــنا من سلامته"
author = "محمد السيد"
posted = "2005-12-21"
text = "الله ينور عليك يا أنس يا ابني ..<br />خلي بالك أصلي سيادته بيخطب دلوتئي ...<br />تخيل أسرة عمي كلها ... مراته وبناته حاولوا يتفرجوا علي سيادته وقعدوا أدام التليفزيون .... وعصروا علي نفسهم لمونة ...<br />لكن الحقيقة كافحوا ... استمروا أكتر من نص ساعى بسمعوا لسلامته تخيل ...<br />ربنا يكون في عون أعضاء مجلس سلامته ... من اول يوم كده ياخدوا طريحة تعذيب بالشكل ده ... وعايزينهم يشوفوا لنا مصالح بعد كده .... ده كفاية عليه سلامته<br />في صحة سلامته ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102105100/http://www.20at.com/article2.php?sid=133"

[[comments]]
order = 3
subject = "صحيح !! نسيت أسألك عن سلامته ؟"
author = "محمد السيد"
posted = "2005-12-21"
text = "صحيح ... أنا نسيت أسألك .<br />إنت قصدك مين بـ\" سلامته \" ؟؟؟<br />يعني بتتكلم عن شخص معين ولا واحد بتحبه ولا علي اي واحد ؟؟<br />أنا مفهمتش ممكن توضح ؟؟<br />وابقي طمني عليه ..... و علي سلامته<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102105100/http://www.20at.com/article2.php?sid=133"

