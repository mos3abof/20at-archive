[[comments]]
order = 8
subject = "رمضان اتى .. والقلب هفا"
author = "ريم بنت السعوديةoooooooo"
posted = "2006-09-08"
text = "الحمد لله رب العالمين والصلاة والسلام على اشرف المرسلين نبينا محمد وعلى اله وصحبه اجمعين llllllll اولا كل عام وانتم بخير اللهم اتمم علينا شعبان وبلغنا رمضان ثانيا نصيحة لكم وانصح نفسي قبلكم لاني مقصرة ان نجعل رمضان للعبادة يعني ضعو لكم برنامج وقت لقراة القران لعل ان نختمه ولو مرة و وقت التراويح لا تفوتوها اخواني اخواتي وانا انصح نفسي قبلكم لاني افوت بعض الشيئ لكن كل رمضان نقول سنجتهد ويمضي بنا العمر وكل يوم يذهب تطوي من عمرك والاخوات ايضا اكيد بينشغلون في الطبخ والنفخ غير الي ترجع من الجامعة او الدوام تعبانة ومالها خلق ,,,,,,,,, يعني لو تحضرين لك بعض الاشياء من الان مثل لف السمبوسة وتحضير بعض المعجنات يعني تكون في الفريزر جاهزة للقلي فقط حتى ماتاخذ بعدين من وقتك او تصنعين الشيره من الان لكامل الشهر حتى لايفوت الشهر وانتي بالمطبخ الله يغفر لنا ويسامحنا ,,,,,,,,,, تلك مقترحات فقط وانا والله ماسويت منها شيئ لكن اقدمها لاخواتي في الله لعل ان نستفيد من رمضان ........................... اما المسلسلا ت وما ادراك ما المسلسلا ت ....... ما اقول اتركوها صعب لان امامك التلفاز والريموت لكن في وقت التراويح ضعوها على التراويح المنقولة اما من المسجد الحرام او غيره كل يوم سوف تحسون براحة ايمانية عودو انفسكم على ان وقت التراويح مافي البيت الا صوت القران والدعاء والخشوع خاصة مع الشيخ السديس امام<br />اقرأ بقية التعليق .."
archived = "2006-10-30"
