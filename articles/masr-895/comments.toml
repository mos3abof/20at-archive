[[comments]]
order = 0
subject = "يا تيترات مسلسلاتك يا رمضان"
author = "نيفين نيفى نوفا"
posted = "2006-09-07"
text = "الملاحظ دايما ان اجمل ما ف مسلسلات رمضان مؤخرا التيترات<br />المسلسل بيبقى فاضى جدا بس التيتر بيبقى حلو جدا زى تيتر مسلسل يسرا بتاع العام الماضى<br />وزى من كام سنه مسلسل حديث الصباح و المساء<br />فيا ريت السنه دى نلاقى مسلسلات افضل علشان زهقنا بقى<br />كمان يا ريت نور الشريف كمان يرحمنا السنه دى من طلته البهيه لانه بقى بيعيد نفسه بشكل ملحوظ و مفقوس<br />بالنسبه للعندليب و السندريللا يا ريت ميتعملش تلاهى ف مسلسل العندليب على سعاد حسنى و العكس صحيح ف السندريللا لان الناس مش هبله<br />و يا ريت نلاقى مسلسلات حلوه من طراز مساله مبدا"
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030040455/http://masr.20at.com:80/article.php?sid=895"

[[comments]]
order = 1
subject = "بدل ما نتفرج نصوم بقى"
author = "د. مصطفى"
posted = "2006-09-07"
text = "أعقد أنه من الأحسن لنا بدل ما نتابع عشرين مسلسل في رمضان أن نراعي الشهر الفضيل ونتعبد ونتفرغ لعمل الخير وصلة الرحم دا أفضل من المسلسلات الى الواحد بعد خمس دقائق من تيتر النهاية مش بيفتكر إيه الى حصل في الحلقة دي وأنا عارف ناس من كتر ما شافوا مسلسلات في رمضان ( أحيانا لنفس الممثل ) اختلطت عليهم الأحداث حتى أنهم أصبحوا مش فاكرين الموقف دا بتاع أي مسلسل ، أعتقد أن حمى المسلسلات في رمضان هي وسيلة من وسائل شياطين الإنس بعدما صفد الله شياطين الجن ( المردة) يعني إحنى إلى بنخترع لنفسنا حاجة نضيع بيها صيامنا"
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030040455/http://masr.20at.com:80/article.php?sid=895"

