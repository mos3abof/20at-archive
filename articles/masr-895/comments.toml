[[comments]]
order = 33
subject = "وأنتهي رمضان فما أخذتم من المسلسلات ؟"
author = "عبدالله"
posted = "2006-10-23"
text = "الحمد الله تعالي أن أكرمنا بشهر رمضان ... والان بعد أن انتهي شهر رمضان فهل أستفاد من شاهد المسلسلات بهذه المسلسلات ... لو كانت مشاهدة المسلسلات تقدم الأمم الاسلامية لأصبحنا في مصاف الأمم المتقدمة من كثرة ما تشاهد الأمة من هذه المسلسلات ... نحن أمة أعزهاالله بالاسلام وليس بالمسلسلات .. لذلك عندما ابتغينا العزة من غير الاسلام أذلنا الله تعالي ... ولكن ما يزال باب التوبة والعودة إلي الله تعالي مفتوح وبالتالي تكون العزة لنا بفضل وإذن من الله تعالي .<br />بالمناسبة: أخواني وأخواتي من مصر الحبيبة لا يجوز الحلف بغير الله تعالي فحتي لو تعودتم علي عبارة \" والنبي \" فلا يجب الاستمرار بها فالعادة ليست عذرا للاستمرار في الخطأ... وإن لم تصدقوني فاسألوا علماء الاسلام بهذا الصدد .."
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030040455/http://masr.20at.com:80/article.php?sid=895"

