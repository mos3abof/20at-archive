[[comments]]
order = 9
subject = "افضل من المسلسلات"
author = "ابومحسن المصري"
posted = "2006-09-08"
text = "أعمال فاضلة في شهر رمضان<br />هذه بعض الأعمال الفاضلة التي ينبغي على المسلم الاجتهاد في فعلها في هذه الليالي المباركة نسأل الله أن يعننا وإياك على أداءها ومن هذه الأعمال :<br />أولاً : الصوم<br />ثانياً : القيام<br />ثالثاً : الصدقة<br />رابعاً : قراءة القرآن<br />خامساً : الجلوس في المسجد حتى تطلع الشمس<br />سادساًً : الاعتكاف<br />سابعاً : العمرة في رمضان<br />ثامناً : تحري ليلة القدر<br />تاسعاً : الإكثار من الذكر والدعاء والاستغفار<br />عاشراً: صلة الرحم<br />أولاً : الصوم<br />قال صلى الله عليه وسلم : ( كل عمل ابن آدم له الحسنة بعشر أمثالها إلى سبعمائة ضعف . يقول الله عز وجل : إلا الصيام فإنه لي وأنا أجزي به ، ترك شهوته وطعامه وشرابه من أجلي ، للصائم فرحتان ؛ فرحة عند فطره ، وفرحة عند لقاء ربه، و لخلوف فم الصائم أطيب عند الله من ريح المسك ) [أخرجه البخاري ومسلم] .<br />وقال صلى الله عليه وسلم : ( من صام رمضان إيماناً و احتساباً غفر له ما تقدم من ذنبه ) [أخرجه البخاري ومسلم] .<br />لا شك أن هذا الثواب الجزيل لا يكون لمن امتنع عن الطعام والشراب فقط ، وإنما كما قال النبي صلى الله عليه وسلم : ( من لم يدع قول الزور والعمل به ، فليس لله حاجة في أن يدع طعامه وشرابه ) [أخرجه البخاري] .<br />وقال صلى الله عليه وسلم : ( الصوم جنة ، فإذا كان يوم صوم أحدكم فلا يرفث ولا يفسق ولا يجهل ، فإن سابه أحد فليقل إني امرؤ صائم ) [أخرجه البخاري ومسلم] .<br />فإذا صمت ـ يا عبد الله ـ فليصم سمعك وبصرك ولسانك وجميع جوارحك ، ولا يكن صومك ويوم فطرك سواء .<br />ثانياً : القيام<br />قال صلى الله عليه وسلم : ( من قام رمضان إيماناً واحتساباً ، غفر له ما تقدم من ذنبه ) [أخرجه البخاري ومسلم] .<br />وقال تعالى : ( وعباد الرحمن الذين يمشون على الأرض هوناً وإذا<br />اقرأ بقية التعليق .."
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030040455/http://masr.20at.com:80/article.php?sid=895"

