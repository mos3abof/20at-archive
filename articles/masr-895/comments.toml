text = "عندما ياتى شهر رمضان قد تكون سلسسلت الشياطين فما لنا ان نشاهد المسلسلات ونصلى ومالنا ان نجلس ايضا على النت فعندما نضيع الوقت امام التليفزيون نضيعه فى عبادة الله الصلاه وقيام الليل والعمل لارضائه سبحانه وتعالى"
