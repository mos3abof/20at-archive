subject = "هو انتوا مش هاتبطلوا"
author = "بسمه"
posted = "2006-09-17"
text = "برغم اني مش معجبة ولا مشاهرة لهالة سرحان واعترف انها مش خفيفة علي القلب لكن عايزة اعرف ازاي مستواناانحدر لدرجة الشخص او الشخصة اللي بيجمعوا توقيعات ضد هذة المذيعة وكان المشكلة وحلها اتفه ما يكون طيب ما نفس الموضوع اتذاع علي قناة ال ام بي سي و الاخت اوبرا قالت هي وضيوفها البدع بصراحة انتوا شوية ناس تافهة وما عندكوش مشاكل يا ريت تجمعوا التوقيعات لشيء مفيد ينفع ملايين المصريين والعرب اللي نسبة كبيرهم دخلة اليومي دولار يعني ما يعرفش مين هالة سرحان لانه من اساسة ما عندوش تلفزيون بطلوا بقي ودتونا في داهية بسطحيتكم حسوا بقي بالناس الغلابة اللي مش عارفة تاكل وتشرب وتتعالج وتعيش عيشة محترمة من غير ذل ولا جوع ولا حرمان مش تقولواللي هالة سرحان داهية تاخذكم"
