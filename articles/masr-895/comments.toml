[[comments]]
order = 26
subject = "عاجل الى الاخ وليد فتحي"
author = "ريم بنت السعودية"
posted = "2006-10-03"
text = "يا اخ وليد \\\\\\\\ الدين النصيحة وانا كمسلمة احب اوجهك انك اخطات حينما حلفت بالنبي وهذا لايجوز بل شرك والمشرك خالد مخلد في النار والحلف عبادة كغيره من العبادات لاتصرف الا لله الي خلقك وانا اخاف عليك من النار فاقبل نصيحتي ولا تحلف الا بالله فقط وشكرا"
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030040455/http://masr.20at.com:80/article.php?sid=895"

[[comments]]
order = 27
subject = "رد عاجل للأخت ريم"
author = "وليد فتحى"
posted = "2006-10-09"
text = "الأخت ريم تحية طيبة و بعد<br />اولا لا يمكنك بأى حال من الاحوال ان تتهمينى بالشرك بالله سبحانه و تعالى<br />وذلك لأننى لم احلف بالنبى اى اننى لم اقل مثلا والنبى انا فعلت كذا وكذا<br />بل قلت لفظ دارج فى مصر وهو \"والنبى\" وهو معناه التوسل او الطلب<br />وانا لا أقبل نصحيتك لأنى لم اخطأ اساسا<br />وانا على يقين انك تعرفين اللهجة المصرية و طريقة المصريين فى الكلام جيدا<br />فلا تجعلين من نفسك داعية اسلامية بالكذب"
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030040455/http://masr.20at.com:80/article.php?sid=895"

[[comments]]
order = 28
subject = "شكرا"
author = "ريم من السعودية"
posted = "2006-10-10"
text = "والله يا اخ في الله وليد انا لا اعرف نيتك ولا مقصدك لكن حبيت انبهك حتى لايجيئ في اعمالي يوم القيامة والواو واو قسم يعني مابعده مقسم به ------ وانا لا ارى ذ لك الا بالمسلسلات اما المجتمع فانا اعرف مصريين اهل خير لا ينطقون بتلك الالفاظ 000000 وانا اسفة ان ازعجتك وانا ايضا لم اتهمك بالشرك انما اوضح عقوبة الحالف بغير الله -------- وغفر الله لك انا ما ادعي انني داعية لا وانا مقصرة 0000 انما حبيت انبهك وشكرا ===="
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030040455/http://masr.20at.com:80/article.php?sid=895"

