text = "بصراحة انا شايفة ان فعلا في كتير مننا عندة هوس بالمسلسلات.<br />انا كنت في الثانوية و بتفرج علي خوالي 4 مسلسلات في رمضان,و تلتربع البرامج و مكنتش بحب الموضوع دة مش علشان بتعطلني عن المزاكرة لكن عشان كنت افضل اقضي ان شاللة عشر رمضان مع قرايبي كصلة رحم لكن قرايبنا منفضين لينا و احنا بقينا برضة منفضين ليهم .<br />عن نفسي حاتابع مسلسل خالد ابن الوليد -ان شاء اللة -لو كان ميعادة حلو,و حاستقر علي باقي المسلسلات بعد بدء رمضان بيومين."
