[[comments]]
order = 3
subject = "الرحمة يا جدعان"
author = "ياسر ابو عمار"
posted = "2006-09-07"
text = "الرحمة يا جماعة شوية ،هو رمضان ناقص 20 مسلسل ،غير الافلام والبرامج والاعلانات والتترات والاغانى والكليبات والمسابقات والحفلات ومباريات الكورة والمسرحيات ،يا لهوىىىىىى امال الناس المفروض انها تعبد ربنا امتى يا بشر ،ولا هى العبادة مش مطلوبة قوى فى رمضان السنة دى باعتبار اننا خارجين من حرب لبنان يعنى والناس متضايقة ولازم نرفه عنها شوية ،ارحمونا ابوس ايديكم من المكر السنوى ده ،وانا بقول للبنى ادمين اللى بيضيعوا وقتهم فى الفرجة على الكلام الفارغ ده ،بقى ده كلام ؟انتم عاقلين والنبى انكم تضيعوا عمركم اللى هتتسالوا عنه دقيقة بدقيقة امام الهبل ده ،احترموا رمضان يا جماعة ."
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030040455/http://masr.20at.com:80/article.php?sid=895"

[[comments]]
order = 4
subject = "التمسح فى القاصرات القبطيات"
author = "التمسح فى القاصرات القبطيات"
posted = "2006-09-07"
text = "التمسح فى القاصرات القبطيات<br />GMT 8:37:34 2003 السبت 19 يوليو<br />عبد الله كمال<br />لو أننى أعيش خارج مصر، وقرأت ما كتبه الدكتور سليم نجيب، أحد أقباط المهجر، مقرونا بصفته الحالية كأستاذ للقانون فى كندا وبصفته السابقة كقاض، لصدقته وربما سقطت فى فخ الخديعة .. وتصورت أن هناك تحريضا عنصريا منظما يتم فى هذا البلد، وأن القاصرات القبطيات لا يستطعن أن يقبضن على دينهن، وأن الناس فى هذه الدولة يختطفون الفتاة قبل أن تبلغ سن الرشد.. لكى تتحول عن عقيدتها وتؤمن بغيرها إجبارا «!!»<br />لكننى والحمد لله أعيش فى مصر، وأرى بعينى ما يجرى فى بلدى، لا أطالع وقائعه من خلال البريد الإلكترونى، ولا أعرف ما يدور فيه من شرنقة بعيدة ومعزولة، ولا أضيف إلى ما أسمعه خيالات غير حقيقية، ثم أبدأ فى الكتابة عن كل هذا وكأنه وقائع ثابتة وموثقة لا تقبل النكران .. ولا أتوقف عند هذا الحد .. بل أوجه نداءات صاخبة إلى رئيس الجمهورية وأطرح فى أسى مفتعل على الجميع تساؤلا عجيبا عنوانه «أين ضمير مصر؟».<br />ضمير مصر لم يضع، ولسنا فى حاجة إلى خطب رنانة أو بلاغة إنشائية لإثبات ذلك، فوعيها الليبرالى قائم، وروحها المتسامحة ثابتة، ومبادئ حرية العقيدة راسخة فى وجدانها ويعبر عنها سلوك مواطنيها فى كل لحظة، ولا شك أن مقالا هنا أو هناك لن يؤثر فى هذا السياق الحضارى الممتد تاريخيا والضارب بجذوره فى أعماق السنين. لكن تفجير بعض القضايا المختلقة من فراغ يطرح تساؤلات عديدة حول صدق ونزاهة نوايا بعض الأصوات، فيما إذا كانت تريد فعلا أن تشارك فى بناء هذا الوطن .. أم أنها تصر على أن تقذف بلادها بالطوب من خارجها.. بدعوى حماية العقيدة الدينية التى لم تمس من الأصل.<br />هناك خطأ منهجى أساسى وثابت فى طريقة تعامل بعض الأصوات<br />اقرأ بقية التعليق .."
archived = "2006-10-30"
capture_url = "https://web.archive.org/web/20061030040455/http://masr.20at.com:80/article.php?sid=895"

