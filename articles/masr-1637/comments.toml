[[comments]]
order = 15
subject = "هى ناقصه"
author = "نيفين نيفى نوفا"
posted = "2007-02-24"
text = "متهيالى ان ابشع تهمه بالاضافه الى الجاسوسيه هى ما قام به هذا الشاب لانه بيخون دينه<br />و بعدين محدش يقوللى حريه فكريه<br />الله يخرب بيت المدونان لو هتوصلنا لكده<br />محدش يقوللى انه مش فاهم لانه كبير و اكيد و مكلف و يعرف الصح من الغلط<br />و لو هو ف مرحله شك يخليها لنفسه لحد ما ينضج و يوصل لليقين مش ينشرها ف مدونته و يمل فتن و قلائل ف الشعب المصرى اللى مرجعيته من يوم ادم ليوم القيامه مرجعيه دينيه<br />دا اسمه كلام فارغ"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 16
subject = "لي راي"
author = "لماذا فعل هذا الشاب الازهري هذا الكلام"
posted = "2007-02-24"
text = "لانه مثله مثل اي شاب عايز يتجوز ويشتغل وياكل ويبقى معاه فلوس.<br />وطبعا مثله مثل اي شاب ابصر فوجد الطريق مضلم امامه ووجد امامه همس الشيطان (الاقباط متحدون) يقولون له شبيك لبيك كل شيء بين اديك بس لينا شرط واحد هو الاساءة لدينك ونبيك وكل طلباتك مجابه.<br />وخلي بالكم فيه واحد مسلم بيشتغل مع الاقباط متحدون برضه اسمه صلاح الدين محسن مسلم وبيسيء لدينه ونبيه من اجل المال القبطي"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 17
subject = "حرية بالشكل ده مرفوضه"
author = "BATISTUTA"
posted = "2007-02-24"
text = "الرجالة اللى مصريين ان الحكم تفصيل وان الموضوع مش سب الاسلام وان الحكم تفصيل انتم بتضحكوا علينا ولا على نفسكوا اغلب المعلقين واضح من كلامهم انهم قرأوا مقالات للشخص ده يعنى عارفين بالظبط هو قال ايه وسب ولا لأ .<br />اما موضوع سب رئيس الجمهورية فإلصاق الرئيس فى هذه القضية تقديس له ودى حاجة مرفوضه لان الرئيس مجرد موظف مش عاجبه الكلام يسيب الحكم للى يقدر عليه .<br />شئ تانى لحبايبنا بتوع حرية التعبير ينفع اسب امك واقولك دى حرية تعبير ."
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 18
subject = "صلاح الدين محسن..وحقيقته"
author = "طارق الوزير"
posted = "2007-02-24"
text = "هذاللاسف الشديد قد يتخيل البعض انه خريج جامعه !ولكنه دبلوم تجاره عمل فى محل بويه اتلسع دماغه وكتب كتابات فى الممنوع<br />لينشهر !..المهم كان الاعتقال حلالا لمثله ! حتى خرج من مصر عن طريق المبرشمين متحدين !الذين يسعدون بكتاباته لانها على هواهم وهو ملحد كما اعلن يعنى معندوش دين ! ويكتب مستغلا اسمه الاسلامى ليهاجم الاسلام !وما يضحكنى انهم استضافوه فى المبرشمون متحدين وعجبا وصفوه بالمفكر الكبير والفيلسوف والاعجب انه قال ان له دراسات اكاديميه! هههههههه بصراحه الموقع دده مبرشم ويضحكنا بنماذج ! وعدلى المشرشح دماغه لاسع قوى وفيوزه ضارب ويجعلنا نضحك على كلامه ..وابن محسن بيسترزق ورزق الهبل على المجانين"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 19
subject = "ملعون"
author = "خالد"
posted = "2007-02-24"
text = "ملعون أبو الدين اللي يكون السبب في إهدار الحريات.<br />ملعون أبو الدين اللي يخدوه الحكام الظلمة وسيلة لكبت الحريات<br />ملعون أبو المجتمع اللي يطلع نمازج زي اللي قريتها .<br />ملعون أبوك يا قاضي ياللي حكمت علي كريم<br />ملعون أبوك يا كريم إذا كانت قال الكلام ده فعلا."
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 20
subject = "ملعون 2"
author = "خالد"
posted = "2007-02-24"
text = "طالما إن الردود تنشر بدون رقابة<br />خليني أقول دي فرصة<br />الدين الإسلامي هو أسوأ دين في العالم<br />الدين الإسلامي إنتشر و مستمر بحد السيف<br />الدين الإسلامي يجب أن يحول إلى متحف التاريخ<br />المستقبل كله للدين المسيحي ولو بعد مئات السنين حيجي ناس غيرنا بتقرأ و تفهم و تعقل و تتحرك.<br />الدين الإسلامي متحف عفن و قذر"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

