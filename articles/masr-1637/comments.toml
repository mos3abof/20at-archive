[[comments]]
order = 11
subject = "أجمل شيء أصبح"
author = "أجمل شيء أصبح فى هذا الموقع أن المدونين والناقدين لهم هم شخص واحد هنيئا لكن هذا ليس رأى المدونين الأصلين فى الموضوع ونحن نعرف أن الحكم على هذا الشاب نتيجة لسبة لمبارك وليس هناك أى أزدراء للأديان ولكن لكى يسببوا الحكم ويشغلوا ويعطوه أهمية"
posted = "2007-02-24"
text = "لماذا لم يحكموا على من سرطن الشعب<br />لماذا لم يحكموا على من أغرق 1350 مصرياً فى العبارة<br />لماذا لم يحكموا على من زوروا الإنتخابات لضمان بقاؤهم إلى الأبد<br />لماذلم يحكموا على من سب الأديان فى مجلس الشعب<br />لماذا لم يحكموا على من تاجر بأكياس الدم الفاسدة وفلاتر غسيل الكلى ومنظمات الأنابيب الفاسدة التى تسببت فى موت الكثير<br />الحكم تفصيل وحسبى الله ونعم الوكيل"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

