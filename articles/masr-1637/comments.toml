[[comments]]
order = 26
subject = "ملعون يا خالد"
author = "فهد الا سلام"
posted = "2007-02-25"
text = "بسم الله الواحد انا قرايت المو ضوع وكنت مش عاوز اعلق بس استفزنى هذا الكلب الهالك وليس الخالد ان كنت تنتمى الى اى دين فليس هذا الذى تفعله اخلاق اى دين واحب انى اقولك ان الا سلا م با قى الى ان يرث الله الا رض ومن عليه دة ان كنت تعبد الله والاسلام لا تهزة اقويل حماء مثل اقويلك والا سلام لهو رجالة اما عن تعليقات بعض الا خوان فانا اختلف كثير معهم يا اخوان القوى ليس با لسب والشتيمة انةاء بالدليل والله اتحدى ان يكون شخص من الذين يشتمون على الا سلام ان يكونا تعرفو عليه او قراوا ان قدر النبى لا يعرفة الا الله ومن يحب النبى انت يا من تسب النبى هل تعرفت الى ماذا يدعو انة يدعو الى الحب والسلام والى عبادة الله الواحد الا حد ولكن ماذ نفعل لكم يا شيطان الا نس هذا قدرنا معا كم ودايما الحق محارب اما عن عبد الكريم هذا انا مش عارف اية الى خله عمل كدة مع انة فى الا زهر اكيد فية حا جة غلط وادعو مع ذلك ان حد يكلامة ويقنعة انة ير جع للصواب وان يتقى الله وان رفض يطبق عليه شرع الله"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 27
subject = "رسول الله"
author = "فهد الا سلام"
posted = "2007-02-25"
text = "اللهم صلى على سيدنا محمد عدد من صلى علية وصلى على محمد عدد من لم يصلى علية وصلى على محمد عدد حباب الرمال وعدد قطرات المطر وصلى يارب على سيدنا محمد صلاة تر ضية وير ض بة عنا ان الله وملا يكتة يصلون على النبى فيا ايها الذين امنو صلواء علية وسلموا تسليم هذا هو قدر رسول الله عندنا نحن رجال محمد بن عبد الله صلى الله علية وعلى اهلة وصحبة وليس اصحاب النفوس الخا وية من ليس لهو ماض ليس لهو حاضر"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 28
subject = "الى المدعو خالد"
author = "طالما انت مسيحي ابوك ليه ما سمكش اسم مسيحي بطرس مثلا ولا جرجس"
posted = "2007-02-25"
text = "روح اسأل ابوك ليه سماك خالد على اسم خالد ابن الوليد<br />لان ابوك في قراره نفسه كان مسلم بس كان بيغالط نفسه وحب يوصيك وصية وهو مش قادر يقولها علشان خاطر كده سماك خالد على اسم الفاتح الاسلامي العظيم خالد بن الوليد<br />روح يا ابني اعمل بوصية ابوك وروح الازهر واشهر الاسلامك<br />بلا المسيح ابن ربنا<br />بلا مريم مرات ربنا<br />فوق لنفسك بقاواقرا صورة الاخلاص<br />قل هو الله احد الله الصمد لم يلم ولم يولد ولم يكن له كفوا احد"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 29
subject = "ضحكتنى"
author = "يا سيدى انت بتقوله سورة من القرآن اللى هو كافر فيه اسأله بناء على ايه المسيحية هتنتشر ؟"
posted = "2007-02-25"
text = "انا عمرى ما شفت واحد دخل المسيحية عن اقتناع غالبا بيكون فقير بعكموه فلوس بيكون نكرة بيخلوه مشهور انما عن اقتناع بالدين المسيحى فدى نكته والله الا ايه لا زمتها منظمات التبشير اللى بطول وعرض البلد فكانت الناس اعتنقت المسيحية بدون الكلام ده زى ما بيحصل مع الاسلام اللى بيعتنقه بيبقى فكر كتير ما شفتش شيخ ادى لواحد مسيحى فلوس وسفره لى بلد اجنبى وخلاه يحصل على حق اللجوء السياسى لانه مضطهد وخايف على حياته وبعد كده ياخد الجنسية واخدلى بالك يا خلود المسيحية هتسود فى احلامك ان شاء الله"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 30
subject = "حاجة كمان يا خللود"
author = "BATISTUTA"
posted = "2007-02-25"
text = "المسلمون فى نهايه حكم لااندلس ايه اللى حصلهم ايزابيلا وفرناندو عملو فيهم ايه افتكر يا خللود .<br />المسلمون ايام الحروب الصليبية لما الجماعة الصليبين حماه الصليب اللى انت مؤمن بيه دخلوا بلاد الشرق خصوصا بيت المقدس برضه عملوا ايه يا خللود الظاهر كانوا جايين ياخدوا شوية بخور وتوابل عربية وراجعيين .<br />المسلمون فى البوسنه فى كوسوفا فى الشيشان فى افغانستان فى الفلبين فى العراق دلوقتى ...إلخ<br />ياترى الصرب والامريكان الانجليز والروس دول ايه مش اتباع الصليب زيك.<br />طبعا انا مذكرتش فلسطين لان دول يهود ولا كشمير لان دول هندوس .<br />يبقى مين اللى دموى وسفاك دماء يا امور؟<br />لو عرفت الحل الصيحيح ابعته لصندوق بريد عدلى ابادير يمكن يصدق ."
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

