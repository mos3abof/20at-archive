[[comments]]
order = 0
subject = "وللة الامر من قبل ومن بعد"
author = "زهرة الرمان"
posted = "2007-02-23"
text = "الشباب فى سن يسمح لهم بتقبل اراء وافدة او مستشرقة حاقدة تجعلهم ينساقون ورائها مؤقتا حتى يتبين كذبها فيعودون الى الاسلام اشد قوة واشد حماسا<br />والحكم على اراء شاب ايا كانت منفلتة وغاضبة هى حكم ظالم علية بالسجن اربع سنوات كان من الحكمة ان يترك هذا الشاب لمن هم اكبر سنا ليعقلوة ويفهموا منة تلك النزوة الغاضبة او اليائسة<br />الم نرى شبابا فى قمة الغضب والحنق يسب اباة اما سب الدين والرسول فحماقة كبرى ويجب ان يستتاب عليها ويترك حال سبيلة<br />اما كلامة عن شخصية عامة كرئيس الدولة او خلافة فذلك حق اى مواطن فرئيس الدولة ليس شخصية دينية ولا مقدسة وسياستة قابلة للانتقاد ولو باساليب جارحة فلقد انتهى عصر قانون السب فى الذات الملكية القديم<br />ومن لا يحب النقد علية ترك تلك الوظيفة العامة والجلوس فى بيتة مكرما وتركها لغيرة ممن يقبل النقد والشتم احيانا<br />الحكم بسجن ذلك الشاب عن اراء ولو مشتطة ومنحرفة دينيا غير مقبولة اطلاقا وقد تكون تلك الاقاويل من تاليف اجهزة الحكم المتخلفة لادانتة ووضعة خلف القبضان لانتقادة سلطة غير شرعية وغير قانونية تحكم ذلك البلد الذى هوى الى اسفل درك من الضياع والانحطاط الاخلاقى والسياسى"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 1
subject = "المبرشمون اوساخ وغجر..هم السبب"
author = "طارق الوزير"
posted = "2007-02-23"
text = "والد المتهم طلب تطبيق الحد عليه وتبرأ منه وايضا وصفه انه (نسناس )والاهم ان والده اتهم المخرف والمشرشح عدلى ابادير وهو مايسمى بزعيم اقباط العالم -انه المسؤل عن انحراف ابنه لكونه كان ينشر له بل سجلوا له حديث فيديو وصفوه بالمفكر والفيلسوف !!! والمتهم فى العشرينات وموقعهم معروف ان عباره عن قاذوارات تكتب فى الاسلام ! وهجوم فاضح على اشقائنا السعوديين وهم يقصدون فى الاساس الاسلام والكعبه المشرفه. ومؤتمراتهم يشارك فيها الايباك والصهاينه كادانيل بيبس ومعروف الاجنده المشبوهه التى يعملوا من اجلها بل ان الموساد مخترقهم وجوزيف العطار الجاسوس الكندى مثال ...رحم الله السادات كان قد اصدر قرارا جمهوريا بالايتولى منصب فى وزاره الثقافه ملحد او شيوعى ! ومن يعتقد اى رأى يخالف معتقدات وثقافه المجتمع وطبيعه المصريين المتدينه ان يحتفظ به لنفسه ولا ينشره ! وانتقاد رئيس الجمهوريه له حدود والتزام والا فقدت المعارضه اصولهاومصداقيتها ...وصدق فيلسوف قال: للحريه التزام ! وايضا السادات: للديمقراطيه انياب.....وبعض اقباط المهجر يريدون مصر دوله بزرميط يريدون بهائيه وعبده شيطان و شواذ وفى موقع (المبرشمون متحدون) نجد كلامهم الساقط..لانهم ساقطين اساسا حاملى جنسيه اجنبيه ولائهم للامبرياليه الصهيونيه الارهابيه العالميه امنيهم ان يصبح الاسلام فى مصر فلكلور.. لكن هيهات انهم مبرشون فى عقولهم وقلوبهم..وهناك بعض الكتاب المسلميين اسما فقط يدعون انهم ليبراليين لكنهم متمركسين فارغى العقول تركوا مهنتم الاصليه ليكتبوا ويعزفوا !فمن يدفع اجره العازف ؟ وهناك ايضا بعض الهامشيين من الطابور الخامس يعملون كومبارس"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 2
subject = "حقوق الانسان والسخريه من الاديان"
author = "ايمن امام- المنظمه العربيه لحقوق الانسان"
posted = "2007-02-23"
text = "لايعنى اطلاقا كوننا ننادى بحقوق الانسان - ان نطلق الامور على اعنتها- دون رقيب ودون حدود- فهذه ليست حقوق ولكنها فوضى وفتن- ومحاوله الصاق او التلميح بكونه قد سب رئيس الجمهوريه - هى محاوله لاصباغ سمه الوطنيه على امثال هذا الرتد - نعم لحقوق الانسان - نعم لحريه العقيده نعم لحق الانسان فى التعبير عن ارائه وفكره ولكن اى رأى واى فكر- ماقاله هذا الملحد- لايعتبر فكرا ولكنه هوس اصيب به- اعتب على منظمات حقوق الانسان التى سارعت للدفاع عنه- انها ترسخ فكره سيئه عن هذه المنظمات - هذه المنظمات يجب ان تعى انها تعيش فى مجتمعات شرقيه لها سقف اخلاقى لايستطيع اى من كان ان يتجاوزه- هذه المنظمات - لاتشكل السواد الاعظم من ناشطى حقوق الانسان- وبمعنى ادق كون هذه المنظمات تعمل فى مجال حقوق الانسان- وكونى اعمل فى ذات المجال لايعنى - انها تعبر عنى كعضو فى المنظمه العربيه لحقوق الانسان وحسنا فعلت منظمتنا عدم الانسياق وراء تلك الكنتونات المشبوهه- اكررها - اننى بشخصى المتواضع الذى لايملك من الامر شيئا - سوى ان يعلن انه يربأء بنفسه من تلك المنظمات المشبوهه- سواء فكريا او هيكليا- ولكل من لايعرف ان له الاوان ان يعرف========================<br />الكثير من هذه المنظمات تدار بنفس عقليه اداره الحكم فى مصر===================<br />مجموعه مسيطره لاتتجاوز اصابع اليد الواحده=========<br />تفرض اجندتها على كل من ينتسب اليها ==========<br />فهى شبيهه الى حد كبير بالاحزاب التى توافق عليها الدوله============<br />طالما ان الدوله قد ضمنت == ان هذه المنظمات لن تخرج عن المربع المنشأه من اجله====== لذلك ارجو من الساده القراء ان لاينخدعوا فى هذه المنظمات====<br />بقيت كلمه وهى ليست دفاعا عن المنظمه العربيه لحقوق الانسان التى اشرف بالانتماء اليها =====<br />اقرأ بقية التعليق .."
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 3
subject = "هؤلاء يلزم محاكمتهم هم من افسدوه"
author = "متجول بين الاخبار"
posted = "2007-02-23"
text = "وسأذكر فقط المصريين بالولاده والمسلمين اسما<br />وهم أحمد صبحى منصور - وأولاده محمد – شريف-امير- حسام – سامح – منير –<br />وعثمان محمد على – عمرو إسماعيل-<br />محمد البدرى- صلاح محسن- اشرف عبد القادر<br />واخيرا من يزيد لتنوير الشباب بكتابات المفضوحين امثال هؤلاء المطلوب محاكمتهم قبل النسناس وان ذكرت من يدعوا انهم مصريين ومسلميين اسما"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 4
subject = "مصرى وفاهم"
author = "الى بتاع تعليقات غريبه"
posted = "2007-02-23"
text = "لماذا لاتوضح اسمك بصراحه!وشيخ الازهر والمفتى ننتقدهم لكن بأدب وهم ليسوا مقدسين مثل سيدك المقدس !ولا يوجد كهنوتيه فى الاسلام ولا قدسيه لبشر. ولكن كتابات هذا الولد الصايع كانت تعجب المواقع الساقطه التى تروج للمسيحيه بسب الاسلام.. اما حكايه التعديلات الدستوريه والكلام الفاضى دى خليهالك ..وملعون ابو مدون يكتب كلام ساقط عن الاسلام. فاهم يا بتاع الارهاب. ولا عاوزين مصر بزرميط زى مابيقول الاخ طارق الوزير وتعليقه واضح وفى السليم والف شكر لك يا استاذ طارق"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

[[comments]]
order = 5
subject = "تحية إلى القضاء المصري الشامخ"
author = "طيف بدر"
posted = "2007-02-24"
text = "يوما بعد يوم يثبت القضاء المصري استقلاليته و شجاعته و نسأل الله عز وجل أن يديم هذه النعمة و أن يحفظ لنا قضاة لا يخشون إلا الله<br />اليوم صدر الحكم العادل على الزنديق المارق المرتزق من الخونة القابعين في الغرب الملتحفين بالمسيحية و هي منهم براء والذي جعل مدونته تطاولا على دين الله بالكذب و الاحتيال و الحقد السلولي الدفين و لا أعلم لماذا يدافعون عنه و لو سب أحدهم أو تعرض لإهانة ما سكت و ما رأى في ذلك \"حرية رأي و تعبير\"... أم أن الإسلام هو الرخيص و إهانته هو بوابة الثراء والارتزاق من أموال الأعداء و نفوذهم ؟<br />بالطبع هناك من سيستاء مما أقول... اعتبروها \"حرية الرأي و الكلمة\"أم أن هذه الحرية ليس لها إلا شكل واحد ؟<br />اللهم ارحمنا من خلقة بني سلول<br />http://alayasser.maktoobblog.com/?post=221551"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082106/http://masr.20at.com:80/article.php?sid=1637"

