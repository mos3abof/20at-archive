order = 0
subject = "لا تحرمينا من كتاباتك"
author = "أكرم"
posted = "2006-03-05"
text = "ليا كل الشرف اني اول من يعلق على هذه الخواطر الرائعه و دلوقتي اادر اقول ان مصر لسه بخير<br />اولا : احب اقول ان هو ده التعليم في مصر طالب الهندسه ( اللي هيهد العمارات مستقبلا ) قصدي هيبني المجتمع بيقول ان في شجرة مكرونه و الكليه منه بريئه<br />ثانيا : التعليم برضه افرز لينا طالبه بتدرس علم اجتماع و عندها اكيد قناعه ان فيه علم جدير بالدراسه اسمه علم اجتماع فبدل ما الدوله تهتم بالكليات النظريه المهمة اللي في الاساس من المفروض انها بتصدر لنا جيل من الصحفيين و المثقفين و مربين المجتمع و بدلا من ذلك فهي صنعت لنا كليات قمة عملية ( طب و هندسه و صيدلة ) و كليات قاع ( تجارة و حقوق و اداب ) و الله يرحمه مصطفى كامل و سعد باشا كان زمانهم خريجي كليات قاع دلوقتي<br />ثالثا : اللي بيقولوا احنا متاخرين ليه ؟؟ ااقولهم لاننا اهتمينا بدراسه العلوم العملية و اهملنا العلوم النظرية ( الاقتصاد و ادارة الاعمال و علم الاجتماع و علوم اللغات ) حتى وصلنا لمجتمع يتكلم بلغة السوق عايز كده مهي اصل العملية كمياء او 1+ 1 = 2 و ليس لها حل في ح و حتى وصل استاذ الاقتصاد الاشتراكي د. عاطف عبيد لمنصب رئيس وزراء بيع مصر و احمد نظيف بتاع معهد اللاسلكي رئيس وزراء توريث مصر<br />و في الاخر بقول انا خريج كليه هندسه ( عملي يعني ) بس لو كان عندي حرية اختيار كنت دخلت اداب علم اجتماع بس للاسف مبتأكلش عيش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144006/http://www.20at.com/article2.php?sid=525"

