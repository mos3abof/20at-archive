author = "اكتب اسمك هنا"
posted = "1999-11-30"
text = "هذه هي الحداثة التي يبشروا بها و بها يصعقون في كل مكان<br />حداثة السب و القذف في حق المقدسات و أقدس المقداسات التي يريدون تدنيسها كما تدنست عقولهم و قلوبهم و أفكارهم<br />إنها حداثة تحليل الزنا و اللواط و الخمر و الإعتصاب و التحرش و الإباحية المطلقة حتى نصير كالبهائم ليس لنا ميزان قيم كما يردون و إهانة الرموز الوطنية و إثارة الفتنة في البلاد الفتنة النائمة لعن الله من أيقظها<br />إنها الحداثة و إذا سمعتم بها أيها المغاربة المسلمون الأوفياء فاعلموا أنها الحداثة التي تريد منكم الكفر بالإسلام و الرب و النبي محمد صلى الله عليه و سلم و النيل من رمز الأمة و إهانة إمارة المؤمنين بدعوى الحرية<br />إنها الحداثة التي أخدت من الحدث حروفه و مضمونه أعزكم الله<br />و لله العزة و لرسوله و المومنين و إنني لأنتظر اليوم الذي سوف ينتقم الله لرسوله و دينه و أوليائه و ما أقربه من يوم فيا رب عجل حتى يكونوا عبرة لمن يعتبر"
