[[comments]]
order = 4
subject = "قصيدة مساكين وحالكم عدم"
author = "مظلوم"
posted = "2006-12-05"
text = "قصيده جديده اهديها لعمنا احمد فؤاد نجم وكل الشعب المصرى الغلبان<br />مساكين وحالكم عدم والله يا مصريين<br />قولولى شعب اتظلم زى الغلابه دول مين<br />من يوم ما حكم اللافاش كيرى وشيلنا الطين<br />كان قدمه ناشف وعايز حرقه بالبنزين<br />قالوا لفرعون ايه خلاك متفرعن<br />قال طول ماشعبى جبان انا اتجبر واتملعن<br />اقول يمين يقولوا امين اختارناك<br />اقول شمال يقولوا عال احنا وراك<br />لحد امتى حيبقى الخوف مالينا<br />عايشين فى كهف والكون بيتغير حوالينا<br />يا اللى انت طابق على انفاسنا وعامينا<br />يوم ما تحل عنا حيرجع حقنا لينا"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210727/http://masr.20at.com:80/article.php?sid=1249"

[[comments]]
order = 5
subject = "عبد الله كمال فى النار .. ألف مبرو ..مبروك يعنى"
author = "«مجلة تتنازل عن القيم والمبادئ الإسلامية.. وتتخذ مسلكا أدى إلى تهتك فى العقيدة.. وتلعب دورا خطيرا فى بلبلة الثقة والشعور الإيمانى لدى جمهور أمة المسلمين.. وتقلد المستشرقين والزنادقة.. ولديها اتجاه ثابت فى ترويج الأباطيل.. وغرام جانح للسير فى الممنوع ومجابهة تعاليم الإسلام»."
posted = "2006-12-05"
text = "إن كان رجل قال هذا الكلام فانا اتفق معه"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210727/http://masr.20at.com:80/article.php?sid=1249"

[[comments]]
order = 6
subject = "لا تعليق"
author = "عبد المنعم المصرى مقيم بالمهجر"
posted = "2006-12-05"
text = "من الواضح ان كاتب هذا المقال افاق كبير<br />كل من ذكرهم فى نظره القاصر لا يفقهون شيئ وهو ابو العريف اللى ما فى احد زيه فى مصر . واستغرب اكتر من المشرفين على الموقع بعد ان بدا ينتشر ويشتهر بسرعة فاقول لهم .<br />الا تراجعوا ما يكتب امثال هذا السيد ؟؟<br />إذا كنتم تريدون ان تكونوا منارة للراى الحر فاعلموا ان عنصرا مثل هذا يجب ان يتم استئصاله وعدم النشر له لانه يصيبنا بالغثيان من كلامه الفارغ وفاكر ان كلامه هيغير نظرة الشرفاء للشرفاء ..<br />لن ارد عليك باكثر من هذا فانت حاقد واكيد فاشل وامثالك سيصلون بالمجلة اقصد روز اليوسف الى الهاوية فالافضل ان يتم استبغادك من المجلة وان تغلق جميع المواقع الباب فى وجهك حتى ينكسر قلمك المسموم"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210727/http://masr.20at.com:80/article.php?sid=1249"

[[comments]]
order = 7
subject = "مر العزيزة لي وطن"
author = "رموزززززززززززززززززززز"
posted = "2006-12-05"
text = "يا شباب مصر اجمل مافي الحكايه ان الشعب نايم اما يصحي هكلمه اعداء مصر هم الحزب الوطني الاخوان المسلمون حركه كفايه حزب التجمع حزب الكرامه الاحرار وكل احزاب المعارضه اما اليهود والامريكان مجرد ممولون لاصدقائهم من الجبهات المتصارعه"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210727/http://masr.20at.com:80/article.php?sid=1249"

[[comments]]
order = 8
subject = "ما بآش الا الواطى"
author = "واحد مصري"
posted = "2006-12-06"
text = "الواد دة بتاع روزاليوسف قلبل الادب و سافل و بيتطاول على اسيادة و اسياد اللي جابوة للمكان اللي هو فية<br />يا عم كمال انت اخرك مساح جزم لمبارك الواطي و كمان بتتطاول على اسيادك مشعل و هنية هي حصلت يا حقير<br />دة ان ما تساويش شعرة في حتة تحتانية<br />في الوقت اللي انت قاعد في التكييف اللي اشتراهولك جمال الاخوان المسلمين بيدافعو عن شرف الامة<br />الا ان حسبي الله و نعم الوكيل فيك و في امثالك"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206223208/http://masr.20at.com:80/article.php?sid=1249"

