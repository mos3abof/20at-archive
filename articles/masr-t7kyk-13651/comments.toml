text = "الضرب مش عندنا بس ولا هو موضة مصرية<br />رئيس وزراء بريطانيا العظمى ايام الحرب العالمية التانية المرحوم تشرشل كتب مذكراتة وقال فيها ان المدرسين البريطانيين كانوا بيضربوة لغاية ما هروا جلدة وشبعوة ضرب لانة كان تلميذ بطىء الفهم شوية<br />صحيح بريطانيا حاليا مفيش فيها ضرب ولكن كان موجود فى العالم كلة فى فترة بس طولت عندنا شوية<br />ويا بخت من بكانى وبكى عليا ولا ضحكنيش وضحك الناس عليا"
