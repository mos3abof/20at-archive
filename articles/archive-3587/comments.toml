order = 3
subject = ""
author = "سعوده"
posted = "2007-04-13"
text = "أولا الصور لا تظهر..<br />ظاهرة العنف بالعالم العربي جد معقدة و لا يمكن تفسيرها من منظور واحد فقط، فليست هي ظاهرة اقتصادية فقط<br />أي أن سبب هو الجوع و الفقر و البؤس…ثم لا يمكن أن نقول انها فكرية أو ثقافية فقط…ناجمة عن فكر متشدد و فقط<br />فأسباب هذه الظاهرة جد معقدة و خيوطها متشابكة…و بالتالي فلا يجب أن نلخضها في القرقوبي أو اليأس من الحياة<br />ي مناطق أخرى هناك انتحاريون أغنياء و لديهم جنسيات غير عربية و لا يتعاطون القرقوبي…<br />الحديث عن العنف يجب أن يشمل عنف الدولة، و الاستغلال، و النصب و الاحتيال، و تجبر أمريكا و انتشار الفساد ووووو<br />قمثلا لماذا يقل العنف في بلد خليجي مثل الامارات أو دول اسكندنافية الخ…و يكثر في دول العالم الثالث…؟<br />قد يكون السبب الفقر و الفساد السياسي و الاخلاقي و الاجنماعي الخ…<br />فلتكن نظرتنا الى ما يحدث حولنا شمولية و متفهمة لخيوط الظاهرة…"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602055109/http://www.20at.com:80/archive/3587.html"
