[[comments]]
order = 0
subject = "زهور"
text = "(صرخه )<br />تفرجوا ياعالم لتعرفوا انو الاسلام كرم المراءه وانه بريء من ظلمها)<br />سنعمل حتى يرفع الظلم عن المراءة ولنبدء بأنفسنا"
archived = "2004-09-09"
capture_url = "https://web.archive.org/web/20040909152324/http://www.20at.com:80/article.php?sid=595"

[[comments]]
order = 1
subject = "شذا"
text = "يجب علينا تحرير المرأة الاامريكية والاوروبية من الظلم الامريكي والاوروبي عليها.. الا تعتقدون هذا؟!!!<br />سبحان الله يدعون انهم يريدون تحرير المراة عندنا من الظلم ونساؤهم يعانون ويلات لا تعانيها المرأة المسلمة.<br />فعلا باب النجار مخلع"
archived = "2004-09-09"
capture_url = "https://web.archive.org/web/20040909152324/http://www.20at.com:80/article.php?sid=595"

[[comments]]
order = 2
subject = "رنا"
text = ".. (منقول من ساحة حوار إسلام أون لاين)<br />الذي يدعون انهم يحمون حقوق المراة؟!<br />ام اننا لا نسمع اصواتهم القبيحة الا فيما يخص المراة المسلمة؟!!!<br />انا اقترح ان يتم عمل برنامج وثائقي عن معاناة المرأة الامريكية<br />والاوروبية يحوي كل التفاصيل ليعلم الجميع من المظلوم حقا؟هل اهي<br />المراة المسلمة ام الغربية...<br />وياريت لو تمت ترجمته لاكثر من لغه.!<br />ويهمني طبعا ان تقرأ بنات المسلمين هذا الكلام حتى لا ينساقوا وراء<br />الادعاءات الغربية الكاذبة ويطالبن هن الاخريات بمساواتهن مع<br />الرجل وهن لا يعرفن معنى المساواة الحقة اصلا.<br />و"
archived = "2004-09-09"
capture_url = "https://web.archive.org/web/20040909152324/http://www.20at.com:80/article.php?sid=595"

[[comments]]
order = 3
subject = "لمبة محروقة"
text = "مش عارفة ليه الموضوع دا دحكني أوي<br />هههههههههههههههههههههه<br />إيه مسمعوش عن اللي يضربك اضربه<br />واللي يرشك بالمية رشه بالدم<br />لازم ياخدوا ثقافة الكياس السودا مينفعش كدا<br />الستات مظلومين أوي برا يا جماعة<br />الحمد لله ان احنا جوا<br />وسلامتك يلي في بالي"
archived = "2004-09-09"
capture_url = "https://web.archive.org/web/20040909152324/http://www.20at.com:80/article.php?sid=595"

[[comments]]
order = 4
subject = "خان"
text = "اناأريد ان انقد على المقدمه الي بدات بيها الدكتور شرين :<br />ليش احنا كل شىء في حياتنا متعلق بلمغنيين والممثليين ليش لما ضربتي المثل قلتي مغنيه فرنسيه كزا وضربها زوجها كزا وقام قتلها كل ده عشان تجزيبي انتباه ......طيب ما تخدي حاجه عربي زي الفنانهّّّّّthekraf الي قتلها زوجها<br />بس عموما المقاله كويسه ومهمه لحد ما في صدق او لا تصدق<br />انا اسف جدا على اللغه العربي حقي مو منيح"
archived = "2004-09-09"
capture_url = "https://web.archive.org/web/20040909152324/http://www.20at.com:80/article.php?sid=595"
