text = "موضوعك حلو يادعاء بس انا قصه الفيلم مش عاجبانى وزى ما حبيبه قالت يعنى ايه واحد يطلع مراته من سرير واحد تانى وبعد كده يرجعلها خلاص الرجوله بقت زى الكفار خلصت من زمان وبالنسبه للمنتج مش عشان هوه عايز يطلع وجوه زفت جديده يبوظ دماغ الشباب اللى هيه اساسا بايظه وضاربه كفااااااااااااا اااااايه لعب بدماغنا وحسبنا الله ونعم الوكيل"
archived = "2010-02-21"
