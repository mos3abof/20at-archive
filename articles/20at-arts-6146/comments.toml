posted = "2007-06-03"
text = "بجد دي احسن حاجة قريتها عن الفيلم كل الناس قالت كلام عايم وخلاص او كلام من غير معنى حتى مفيش حد قال انه سيء بس فعلا واضح الجواب بيبان من عنوانه بس انا مستغربة ازاي واحد يطلع مراته من سرير واحد تاني ويرجع لها تاني والله الرجولة راحت"
archived = "2010-02-21"
capture_url = "https://web.archive.org/web/20100221090301/http://www.20at.com:80/20at/arts/6146.html"

