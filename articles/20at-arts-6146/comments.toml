author = "نيفين نيفى نوفا"
posted = "2007-06-03"
text = "كلامك صح يا دعاء و احنا اتعودنا ن السينماو صناعها الاعزاء بيفاجئونا كل صيف بعدد لا باس به من الافلام اللى بسميها انافلام المره الواحده لانها لا تحتمل ان تشاهد لاكثر من مره الا لما تتحفنا بيها ال art سينما و تفرض علينا مشاهدتها عشرات المرات الا من ينقذ نفسه و يغير القناه<br />ون هذا حال السينما حاليا اللهم الا عدد قليل جدا من الافلام اللى لا يتعدى باى حال اصابع اليد"
archived = "2010-02-21"
capture_url = "https://web.archive.org/web/20100221090301/http://www.20at.com:80/20at/arts/6146.html"

