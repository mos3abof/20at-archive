author = "اكتب اسمك هنا"
posted = "2007-06-28"
text = "بجد كان فيلم في منتهي … السخافه ولولا اني فاهم ان الشباب دول لسه جداد كنت حكمت عليهم بالاعدام علي طريقة _ولا ما علينا_ … بس احمد فلوكس بجد ممكن يبقي ممثل هايل… والولد اللي عمل جورج محتاج تمارين صوت بسرعه… اما التالت فمش عارف انا كرهته ك ممثل ولا كشخصيه ف الفيلم … وارجو ان الناس ما تحكمش علي الممثلين دول مهما كان دي اول حاجه ليهم … وكان ليا استفسار صغير… هيا المطربه اللي كانت بتظهر اكتر من الابطال دي _ رغم ان صوتها بجد جميل_ كانت قريبة مين ف الانتاج … ويا ريت صاحب القصه والمخرج ما يعملوش كده تاني… وف النهايه انا عايز 15 جنيه حق تذكرة السينما…"
archived = "2010-02-21"
capture_url = "https://web.archive.org/web/20100221090301/http://www.20at.com:80/20at/arts/6146.html"
