author = "عابرسرير"
posted = "2008-10-27"
text = "كل رجال الاعمال اللى دخلواالحكومة زادت ثرواتهم بشكل رهيب نظير الامتيازات والاعفائات لغاية مبقوا يتخانقوا على السرقة كل واحد عاوز اكتر من غيرة والنتيجة طبعا ضياع البلد ومستقبلها الاقتصادى والسياسى ولو الجريمة دى حصلت فى مصر كان من زمان اتدفن الموضوع مع الجثة بس الجريمة حصلت فى دبى وفى ظرف ساعات وبمجهودات مخابراتية امريكية اوروبية تم الكشف عن القاتل الماجور وبكدة احراج للنظام فى مصر انة يدارى عضومهم فى الحزب والدولة عن ايدين العدالة الدولية والا بكدة يعتبر النظام برمتة محل خطر من ماما امريكا والشرق الاوسط الجديد"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807091612/http://www.20at.com:80/masr/t7kyk/10330.html"

[[comments]]
order = 10
subject = ""
author = "برضة"
posted = "2008-10-27"
text = "احمد عز ليس سمسار عقارات كهشام<br />ولكنة حرامى - احمد عز حرامى ومحتكر<br />الحكومة اليابانية بنت شركة حديد الدخيلة وقدمتها هدية للحكومة المصرية وبعدين الحكومة المصرية باعتها لاحمد عز واعتراض اليابان ازاى تعطى هدية والحكومة تبيعها لواحد راسمالى - ولية احمد عز لا يستورد مصنع جديد من اليابان ويسيب بتاع الحكومة الهدية<br />احمد عز تقدم لخطبة الحسناء نانسى عجرم تحت بند صراع رجال الوطنى على البنات الحلوات واستحواذهم وضمهم الى حريم الوجاهة الوطنية ولكنها رفضت والرجل لم يقتلها<br />شوية شوية<br />الدنيا رايحة فين محدش عارف<br />فى السماء غيوم كتيرة"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807091612/http://www.20at.com:80/masr/t7kyk/10330.html"

[[comments]]
order = 11
subject = ""
author = "محمدحسنى مبارك الحقانى بتاع ال"
posted = "2008-10-27"
text = "اناميهمنيش هشام طلعت مصطفى وقضيتة اللى هى تصفية حسابات واختلاف على تقسيم سرقات - بس الخوف من اللى نازل ببراشوت على كرسى ابوة وعامل فيها منقذ للبلد والعبور الى المستقبل من تحت صخرة المقطم وحواجب صفوت الشريف بتهز بالموافقة وبيرقص على اللحن ناس قابضة التمن مقدما من اللى تحت زى العمد وشيوخ البلد حتى امين التنظيم ومؤلف واحد ابطال فيلم سوزان تميم الفلم الذى استغرق تاليفة وتصويرة فى عدة بلدان خمس سنين -احمد عز على فكرة اتقدم لخطبة نانسى عجرم قبل سنتين واداها خاتم الماض هدية قيمتة نص ارنب امريكانى وتفت فى وشة وادتلة سكة"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807091612/http://www.20at.com:80/masr/t7kyk/10330.html"
