posted = "2008-10-26"
text = "كلبة و راحت فى ستين مليون الف داهية؟<br />و اية يعنى؟<br />بطلها ضابط شرطة ابن كلب فاسد مفصول من الخدمة لانة و سخ و ابن عيلة بنت كلب و ستين و سخة؟<br />زج بهشام طلعت مصطفى لتبرئة نفسة القذرة<br />قضيتك بايظة يا هشام و هتطلع برائة باذن اللة<br />شدة و تذول و<br />امتحان و تجربة من عند اللة<br />المؤمن دائما منصاب<br />برائة يا هشام<br />و صدقنى<br />اللة معك"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807091612/http://www.20at.com:80/masr/t7kyk/10330.html"

