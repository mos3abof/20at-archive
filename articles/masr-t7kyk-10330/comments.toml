posted = "2008-10-26"
text = "الواد بلية بتاع الخردة بصماتة و اضحة على هذة الجريمة؟<br />هشام ورط فى هذة القضية؟<br />هى مين هذة العاهرة الداعرة ممتهنة (اقدم مهنة فى التاريخ)<br />بلاعة الرزيلة!<br />ما العلم مليان موزز من كل دول العالم؟<br />ملقيش غير دى ال[ *** ] المومس السكند هاند المستعملة و اللى مفوتة موتور؟"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807091612/http://www.20at.com:80/masr/t7kyk/10330.html"

[[comments]]
order = 8
subject = ""
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-26"
text = "كل هذا الضخيب من اجل مقتل غانية مومس؟<br />ياعالم هذة القضية مدسوسة على الرجل المسكين(هشام طلعت مصطفى)<br />القانون يقول(الشك لصالح المتهم)<br />قاعدة قانونية! ليعلمها الجميع؟؟؟<br />القضية من الناحية القانونية بها من الثقوب ما يكفى لتبرئة(هشام طلعت مصطفى)<br />و اننتظر حكم القضاء!<br />و(أرحموا عزيز قوم زل)<br />رحمكم اللة و رحمنا ايضا"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807091612/http://www.20at.com:80/masr/t7kyk/10330.html"

[[comments]]
