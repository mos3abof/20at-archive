text = "ابحثوا عن الواد روميو الحبيب بتاع الخردة؟<br />الواد بلية و دماغة العالية؟<br />هو اللى لفقها ليك يا هشام<br />بصماتة و مصالحة تخلية يعمل فيك اكثر من هذا؟!!!و ذاك كمان و كمان؟؟؟<br />أنا و من بعدى الطوفان<br />و افهموا يا عالم!!!"
