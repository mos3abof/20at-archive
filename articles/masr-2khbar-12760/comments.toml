author = "ااقول لكم"
posted = "2009-07-27"
text = "انتهى التعليم فى مصر على الاقل لاولاد الموظفين والفقراء والطبقة المتوسطة انتهى تماما<br />اولا مجموع الثانوية العامة لا يهم الطبقات الغنية فاولادهم حتى وان حصلوا على 50 % من درجات المجموع فهم سيدخلون كليات الطب والصيدلة فى دول شرق اوروبا وامريكا ويمكنكم ان تتاكدوا من نقابة الاطباء والمهندسين على عدد الملتحقين بالنقابة كل سنة من الحاصلين على مؤهلاتهم من الجامعات الاجنبية وحتى الهندية والباكستانية<br />ويبقى هنا وزير التعليم العالى يقلل عدد الملتحقين بالطب والصيدلة من اولاد الفقراء داخل مصر<br />تبقى هناك طبقة بين البين التى يلتحق اولادها بالجامعة الخاصة فى مصر برسوم سنوية تصل حتى 60 الف جنية فى السنة<br />يعنى لا مكان للفقراء واولاد الموظفين والفلاحين والتجار الصغار<br />انتهت كل الهيصة القديمة بتاع طة حسين وجمال عبد الناصر<br />ليس امام الفقراء غير الازهر الان يتعلموا فية وكليات الازهر وينضموا الى طوابير العاطلين<br />وسلم لى على الواد كسبرة المفتح بتاع تطوير التعليم<br />سلام يا كسبرة"
archived = "2009-07-29"
capture_url = "https://web.archive.org/web/20090729021119/http://www.20at.com:80/masr/2khbar/12760-2009-07-27-08-32-47.html"
