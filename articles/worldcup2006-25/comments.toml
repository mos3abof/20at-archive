text = "واحد مش عارف يكتب لغة عربية اساسا بيتريق علي واحدة كاتبة تعليق هو انت يا فالح مش ملاحظ ان اللي انت بتعمله ده تمحيك بالخربشة يا بني انت مراهق ولسه صغير"
archived = "2007-12-08"
