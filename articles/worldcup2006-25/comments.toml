[[comments]]
order = 5
subject = "j7uj7uj"
author = "j7j77"
posted = "2006-06-19"
text = "بدايتها أنها سوف تكون ممتعة إلى أقصى الحدود.<br />الكثير من الفرص الضائعة لمنتخب إيطاليا، ولكن أخيراً جووووووووول، الحمد لله، أستطيع الآن الإطمئنان على فوز الفريق، ولكن فرحتي لم تكتمل، ولأن المنتخب الكوري عنيد جداً ولا يرفض الهزيمة بسهولة، فجأة جاء الهدف الثاني في المباراة، لكن داخل شباك إيطاليا.<br />يتعادل الفريقان، وتمر الدقائق بسرعة، وتتسرب المباراة من يد وقدم المنتخب الإيطالي وتصل للوقت الإضافي حتى اللحظة الحاسمة... الهدف الذهبي، أسوأ إختراع في تاريخ كرة القدم والذي لا يصلح مع ضعاف القلوب بالطبع.!<br />وبالفعل يقضي الإختراع الأسوأ على أحلام الفريق الأفضل، وكذلك آمالنا. ويخرج الفريق الكوري متوجاً بالنصر، ويعود الإيطاليون"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074211/http://worldcup2006.20at.com:80/article.php?sid=25"

