[[comments]]
order = 1
subject = "نيفين نيفى نوفا"
author = "متفكرونيييش"
posted = "2006-06-11"
text = "متفكرونيش اصل المونديال اللى فات دا كان حزين خصوصا بعد خروج ايطاليا<br />كان يوم و كنت انا و اخويا عندنا انتحانات تانى يوم و كنت ف ايد المذكرات و ف ايه بطاطس و لو تفتكرو الجون دخل فى ايطايا خطف و على غفله فعلا<br />اللى فاكراه خير اللهم اجعله خير انى كنت بقول لاخويا خلاص قربنا الماتش يخلص و نروح نذاكر بسعاده و قبل ما اكمل الجون دخل<br />المذكرات وقعت منى<br />و اخويا البطاطس وقعت منه بردا<br />اتصدمنا اولا<br />بصينا لبعض ثانيا<br />انا عيطت ثالثا<br />عارفه هبل<br />بس اصلى بعشق تيكم ايطاليا و اسبانيا موت يا هبهوب ياللى زعلانه منك<br />لا رديتى<br />و لا بعتى ايميل و انمتى عارفه انى زعلانه"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614235154/http://worldcup2006.20at.com:80/article.php?sid=25"

[[comments]]
order = 2
subject = "عشم ابليس في الجنه"
author = "محمد المصري"
posted = "2006-06-14"
text = "تفتكروا اننا هنعدي التصفيات الحزينه بتاعت كأس العالم امتي لما يكون معانا السودان وبنين والصومال وناميبيا و منتخب جزر القمر (اللي مسمعتش عنه قبل كده) ولا ممكن يكون فيها كلام بردو ده احنا يا عالم من سنه 90 مدخلناش يعني 16 سنه يعني العالم كله زمانه نسي ان فيه دوله اسمها مصر من ايام ماكان حسام حسن لسه طالع من الناشئين بأمراه ضربه الجزاء بتاعه هولندا اللي مصر لحد دلوقتي بتتكلم عليها مه مجدي عبد الغني"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614235154/http://worldcup2006.20at.com:80/article.php?sid=25"

[[comments]]
order = 3
subject = "بطلو فكس بائا"
author = "ابراهيم نور"
posted = "2006-06-18"
text = "بنت اه ديه الي بتعراف كوره اصلان مافيش بنت بتصحا بدرى حتي لو صحيت يبئا تعميل حاجه موفيده تغسل المواعين بتاعت ماتش بليل ماهو يتعمل كيدا يتنزل تتفرج عليه في الأهوا عرفتي ممتيك كانت مستغربا من أه .<br />غير كدا احنا عيزين نعراف اه اليحسال فى المونديال ده اما هتحكي عن زكرياتك فنا المونديال اليفات بيفكرنى ب(ولا بلاش) . نهاية الكلام حسني اسلوب الكتابه و نئى مواضيع كويسا وى حسنى خطيك اول مارا اشوف حد خطو وحيش فى الكمبيوتر"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074211/http://worldcup2006.20at.com:80/article.php?sid=25"

[[comments]]
