[[comments]]
order = 0
subject = "يعني إيه أفشل لاعب ؟؟"
author = "محمد السيد"
posted = "2006-07-07"
text = "بس أظن - أظن يعني - إنه مفيش حاجة اسمها أفشل لاعب ...<br />أظن تقصدوا أفضل لاعب ؟؟؟<br />\\\"بعدها سيغيب زيدان عن الكادر لتختفي الظاهرة الكروية الأبرز الذي توج كأفشل لاعب في العالم ثلاث مرات أعوام 98، 2000، 2003، بالإضافة إلى الكرة الذهبية كأفضل لاعبي أوروبا عام 98 \\\"<br />معلش لو فيها غلاسة يعني ..<br />وبرضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074804/http://worldcup2006.20at.com:80/article.php?sid=109"

