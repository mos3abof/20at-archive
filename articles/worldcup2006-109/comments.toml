subject = "زيدان البطل"
author = "العلمي ابراهيم"
posted = "2006-08-10"
text = "الابطال دائمايتالقون في الملعب خاصة على ارضهم . فهناك بعض اللاعبين اوالاغلب منهم من يفقد مهارته عندما يبقى له عاما او عامين على الاعتزال ويبقى على كرسي الاحتياط اما زيدان فبقى اسمه ولعبه و مهاراته ورفع منتخبه الى النهاية . وشكرا."
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074804/http://worldcup2006.20at.com:80/article.php?sid=109"

