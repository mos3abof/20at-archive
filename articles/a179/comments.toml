subject = "بصراحة مندهش"
text = "مقال جميل لقلم موهوب ...وبصراحة لم اتخيل أن تلك العين والقلم الناقد هما نفس العين والقلم الساخر لبطله\"مذكرات بنوته\"...موهبة جيدة وقلم رائع"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814004153/http://www.20at.com:80/article.php?sid=179"

[[comments]]
order = 1
subject = "جميل يا رغداء"
text = "اجمل ما في هذا المقال هو تساؤلاتك الاخيرة<br />وفقك الله يا حبة القلب<br />عروس الاقصي"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814004153/http://www.20at.com:80/article.php?sid=179"

[[comments]]
order = 2
subject = "نتدبر"
text = "لن اقول المقال رائع ..فهو اكثر من رائع ..بينما النتيجة الأهم مسألة عودة اليهود إلي اوطانهم .. هذه النتيجة المدهشة التي حولتها القومية العربية إلي ازمة بسببها قامت اسرائيل..علينا ان نعيد كل مقدمات الصراع فقد نجد النتائج سهلة وواضحة وطيعة كمقالك ياست رغداء"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814004153/http://www.20at.com:80/article.php?sid=179"

