text = "انقرضت فترة من الزمن ثم عادت ليلة الحنة بقوة مع ايام الغلاء وفقر الناس بهدف جمع النقوط لمساعدة العريس والعروسة وكانها جمعية تدفع لى نقطة ادفع لك نقطة<br />واخر فرح حضرتة جمع العريس مبلغ 3000 جنية من الاقارب والاصدقاء واولاد الحتة<br />وليلة الحنة عادة مصرية فى كل قرى مصر سواء فى ريف بحرى او الصعيد<br />وعقبالى يارب<br />اتزوج واعمل ليلة حنة"
