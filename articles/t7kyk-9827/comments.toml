text = "وفي مدن القناة السهر على السمسمية ؟ واضح ان اللي كاتب المقال ده بيخرف أو بيألف عشان يملى المقال كلام وخلاص , الكلام ده انقرض من الإسماعيلية وبورسعيد والسويس ومعدش موجود هنا اصلاً من زمان ..<br />ياريت بس عشرينات تشوف مستوى التحقيقات وتتأكد من اللي فيها .."
