author = "fba"
posted = "2009-04-28"
text = "حلوة بلادى السمرة بلادى - وانا على الربابة با اغنى واقول تعيشى يا مصر<br />الانتماء الوطنى زاد عندى جدا بعد قراءة المقالة - رائع جدا<br />العروسة عندها 45 سنة وسبق لها الزواج مرات — تكاليف الفرح 9 مليون دولار اى 45 مليون جنية مصرى —- والمهر 10 مليون دولار اى 60 مليون جنية مصرى —- ومؤخر الصداق 20 مليون دولار اى 120 مليون جنية مصرى<br />المأذون لبنانى من طائفة الشيعة مذهب العروسة وكتبوا الكتاب فى بيروت بعيد عن الضرايب المصرية<br />الرجل العريس رجل عصامى ولة ملف فى الضرائب وبيدفع الضرايب على داير المليم<br />اما راس مالة فمن بركة دعاء الوالدين ومكاسبة فربنا طرح فيها البركة<br />شايفين المصريين الاصلاء اللى بيتمتعوا بفلوسهم<br />حلوة بلادى السمرة بلادى — وانا على الربابة با اغنى واقول حلوة بلادى السمرة بلادى"
archived = "2009-04-30"
capture_url = "https://web.archive.org/web/20090430042924/http://www.20at.com:80/masr/t7kyk/11898-2009-04-28-13-00-28.html"

