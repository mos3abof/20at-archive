text = "كلما سمعت الكلام عن فرح هيفاء وما فية من إسراف، يقفز الي ذهني صورة قارون وقد أنبهر الناس بأمواله وبذخة في الحياة وكم منهم تمني أن يكون من حاشيتة أو معة…<br />ولكن أين ذهب قارون وأموالة ؟<br />لو أجبت عن السؤال لشعرت بالراحة ورأيت الصورة بمقياسها الطبيعي؟"
