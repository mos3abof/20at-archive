text = "ابو هشيمة — مواليد 75 وخريج تجارة 96 وابوة ضابط شرطة وعمل فلوسة من تجارة حديد التسليح وعندة شركة بتتاجر فى حديد التسليح<br />- يعنى اللى عايز يغتنى يشتغل فى الحديد والاسمنت وي[ *** ]ب ملايين ويتزوج فنانة لبنانية<br />- انما تقوللى تسافر برة وترجع بشوية برايز يشتروا شقة فى حارة سد فليس لة اى لزمة<br />- التجارة فى حديد التسليح والاسمنت - خدوا بالكم دة طريق النجاح"
