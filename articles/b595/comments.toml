text = "أمي الحبيبة .... من ابنك حبيبك , اللى مكانش بايده لحظة يسيبك<br />أخبارك ايه ؟ واحشاني يامه .... وكلكم واحشيني ,<br />وعاملة ايــــــه ؟ دا البعد عنكم ... والله غصبن عني<br />يمكن بعيـــــــــــــــــــــــــــيد عنكم اوي , لكن قريــــــــــــــــــــــــــــب منكم اوي<br />والدنيا مهما فرقتنا ... عايش بقلبى فى حضن بيتنا , ما بعدني غير حكم القوي"
