[[comments]]
order = 0
subject = "يارتني ما فتحته"
author = "هبهوب , هبه , هوبي"
posted = "2006-03-20"
text = "قولي يا بت يا هبه النشيد اللي كنتي قرفاني بيه وانتي صغيره \"\"<br />بالكلميتين دول ماما لسه مكلماني من يومين كدا وبتقولي قولي النشيد بتاعك اللي هو \" امي يا لحنا اعشقه ونشيدا دوما انشده واظل اظل اردده \"<br />بس دلوقتي بقي يا بطه غيرته<br />بقي \" لسوف اعود يا امي اقبل راسك الزاكي \"<br />بس كقايه كدا لحسن هعيط بجد اهي ... اهي<br />معلش يا جماعه اصلكوا مش عارفين يعني ايه بطه بالنسبه لي<br />وعشان كدا بهديها الابيات دي \" ومعرفش بتاعت مين \"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134702/http://www.20at.com/article2.php?sid=595"

[[comments]]
order = 1
subject = "الابيات"
author = "هبهوب او هبه صاحبه اول زفت"
posted = "2006-03-20"
text = "قالوا: أتى العيدُ بالأفراح، قلت لهم:<br />بالعيد نفرح لكنّ الأسى غلبـا<br />لما أتى العيدُ بشّرت الفــؤادَ به<br />فاستبشر القلب لكن الأتين أبـى<br />يا ويح نفسي التي ما بين فرحتها<br />وبؤسها ترقبُ النورَ الذي احتجبا<br />تبادل النـاسُ يا أماه تهنئــة<br />وكل معنًى للفـظ الفرحـة انقلبا<br />أهلا وسهلاً لمن يأتي نردّدها<br />وماردُ الحزن في أعماقنــا وثبا<br />أوّاه أوّاه يا أمـّـاه من ألــم<br />ما زلت أكتمه في خاطري لهبا<br />أوّاه من حالنا في البيت حين بكى<br />ثغر الصباح ومعنى نوره اضطربا<br />أوّاه من فرحة القلب التي اتّخذت<br />سبيلها في محيطات الأسى سَرَبا<br />يكاد يقتلني شوقي الكبير إلى<br />سماع صوتك صوتًا لحنُه عذْبا<br />لمّا تنادين باسم يزدهي حلمٌ<br />به أرى كل ما ينأى قد اقتربا<br />لولا سكينة إيــمان بخالـقنا<br />بها نسكّن وجداناً إذا انتحــبا<br />لأبصر الناس من آثار حسرتنا<br />شيئًا عظيمًا، ومن أحزاننا عجباً<br />يقينُنا مكّن الصبرَ الجميلَ لنا<br />ومدّ للقلب نحو الخالــق السّببا<br />أمّاه، صبرُك في الدنيا غدا مثلاً<br />فما رأيناه فـي درب الجراح كبا<br />كذلك الأمّ يلقى قلبُها عنَتاً<br />من الحياة، ولولا الصبرُ لأنشجا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134702/http://www.20at.com/article2.php?sid=595"

[[comments]]
order = 2
subject = "نفسي اعيط ........."
author = "sweet_princess"
posted = "2006-03-21"
text = "ااااااااااااااه .. هئ ..هئ ..هئ .<br />انا اكتب الكلام الاول وبعدين ابقى اخد لي جنب واعيط براحتي .<br />بس عندي رساله لمامتي :<br />حبيبة قلبي ماما ..<br />ربنا يخليكي ليا يا حبيبتي وما يحرمنيش منك ابدا .<br />ربنا يجازيكي يا حبيبتي كل خير على تحملك وصبرك علينا(انا واخويا) وعلى كل المجهود اللي بتبذليه عشاننا .<br />ااااااه نفسي امسك ايدك وابوسها (بس انتي في شغلك الوقتي ) بس اول ما اشوفك .. مش هقول انا هعمل ايه ..<br />واخيرا يا حبوبتي انتي مش عارفه اقولك ايه بجد انتي وكل ام اتجملت عشان اولادها (انا ببعت لك بيج بوسه ).. قد كده...!!!<br />واخيرا انا بهديلك اغنية محمد منير (صوتك)..هي صحيح اغنيه عاطفيه وكان بيغنيها لحبيبته بس (اناما عنديش حبيبه غيرك يا قمر)..<br />صوتك وسط القلوب انا بعرفه..<br />صوتك مليون كمنجه بيعزفوا ..<br />صوتك ارق من النايات ... صوتك غنا مالي السكات ..<br />صوتك مافيش اي شعر.. يقدر حبيبتي يوصفه..<br />وسلام بقى عشان الحق اعيط قبل ما اروح الجامعه.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134702/http://www.20at.com/article2.php?sid=595"

[[comments]]
order = 3
subject = "ملف في الجووووووووووون"
author = "مجنون رسمي"
posted = "2006-03-21"
text = "بصراحه الملف جامد جدا جدا جدا<br />وكل المقالات اللي مكتوبه رائعه وتستاهلوا عليها بوسه كمان ............<br />بس المقال اللي اتاثرت بيهااوي وعيطت وانا بقراه<br />مقال ايه محمد<br />اللي اسمه اسفه يا ماما انا معنديش دم<br />ربنا يعينك ويعينكم جميعا والقلب داعيلكم<br />شكرا لكل اللي اعدوا الملف<br />بداية من شيرين لانها الكبيره وهايدي والبراء وعاطف وكان في واحد كمان من عمان مش فاكر اسمه<br />ربنا يبارك فيكم يارب<br />مجنون رسمي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134702/http://www.20at.com/article2.php?sid=595"

