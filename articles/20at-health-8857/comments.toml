subject = ""
author = "ابن فلسطين"
posted = "2008-04-29"
text = "ماشاء الله تبارك الله عليهم , هدول هما الفلسطينية , الحمد لله بنصنع العقائد والمعجزات والمستحيلات (طبعا كل شئ بمشيئة ربنا سبحانو وتعالى) والحمد لله الفلسطينية ما رحوش مكان بالعالم كلو إلا وعمروه وبنو فيه وأعطوه من خبرتهم , وطبعا الأردن أكبر دليل , لكن<br />كل الناس ناكرين جميلنا وفضلنا عليهم , يوكلوا خرة , شو مستفيدين هما , لما بغلطوا علينا دليل كبير على قهرهم وغيظهم الشديد منا"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105211443/http://20at.com/20at/health/8857.html"

