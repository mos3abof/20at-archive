text = "السلام عليكم ورحمة الله وبركاته , عيني عليكو باردة يا حبايبي الفلسطينيين , وإنتوا أي دولة بتروحوها بالعالم كلو بترفعو راسها<br />مثال على هيك الأردن , مين غيرنا إحنا الفلسطينيين رفع راس الأردن الحقيرة , والشعب الأردني ناكر جميلنا وكل يوم بسبونا<br />وبشتمونا , والحمد لله على كل حال : ارفع راسك إنتا فلسطيني , والله إحنا مرفوع راسنا غصب عن العالم كلو …"
