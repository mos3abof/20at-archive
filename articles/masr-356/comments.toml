[[comments]]
order = 0
subject = "لو لم اكن نيفين لوددت ان اكون فوزى"
author = "نيفين..نيفى..نوف"
posted = "2006-05-23"
text = "يا سلام ايه الجمال دا<br />يعنى بيخدم الناس<br />و بيشتغل<br />و بيعمل سبوبه (على راى موضوع السبوبه لاتزال فى جيبى؟)<br />و بيحضر الاعتصام<br />و بيفش غله ف صور البيج بوس<br />يا سلام<br />يا دماغك يا فوزى<br />هو دا الشغل<br />مش تقولولى مششتير ووجع دماغ<br />و لا ايه يا مش شغللك"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043950/http://masr.20at.com:80/article.php?sid=356&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "خساره يا بو الليل"
author = "محمد النقيب"
posted = "2006-05-24"
text = "للاسف مدونة ابو الليل واقفه من فتره..بس فوزي موجود في كل حته وبكذا موديل..يا ريت كنت تحط عنوان المدونه بتاعة ابو الليل هنا مع المقال .."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043950/http://masr.20at.com:80/article.php?sid=356&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "لا ياسي فوزي"
author = "الاستاذشيكو"
posted = "2006-05-26"
text = "شوف بقه اللي زي المعلم فوزي ده انا ماحبش اعرفه لانه معاهم معاهم عليهم عليهم ومات الملك وعاش الملك ده مش بيرضه يخدم الظباط والعساكر ليه يا فوزي عشان مابيتفعوش يعني لو بيدفعوا كان فوزي حابيبناباعنا ليهم ده اللي مكتوب في المقال انا ااااااااسف لازم الانسان يكون عندة مبدا واحد مايغيروش"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043950/http://masr.20at.com:80/article.php?sid=356&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
