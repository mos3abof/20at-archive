author = "القط الأزرق"
posted = "2009-02-13"
text = "بالأول الى متى سنبقى كذلك ؟؟؟<br />ألم يحن الوقت لنعطي الشواذ حقوقهم ؟؟؟<br />متى سنرى كتاب عربي يتحدث عن الشواذ كما هو الحال في الدول المتحضرة و المتطورة ؟؟؟<br />كفلنا تخلف ورجعية ؟؟؟<br />في المقالة كلمات مثل (ممارسة جنسية خاطئة ) و (معاشرة خاطئة ومنحرفة) و (الحد من حالات اللواط بين الاطفال) ؟؟؟<br />و من نحن لنحدد ما هو سوي وما هو غير سوي ؟؟؟<br />هل خطر ببال أحد أن هاؤلاء الاطفال يمارسون الشذوذ لأنهم شواذ ؟؟؟<br />هناك في الحياة ملذات كثيرة فبدل أن نختار منها ما نحبه يأتي المتدينون ليضعون الحواجز و القوانين و يفسدونها ؟؟؟<br />فلنتحرر يا اخوتي فلنتحرر ؟؟؟"
archived = "2009-05-06"
capture_url = "https://web.archive.org/web/20090506222444/http://www.20at.com:80/nashrat-9/11275.html"

