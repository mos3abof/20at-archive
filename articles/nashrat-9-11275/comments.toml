text = "انا اشوف ان الكتاب عااادي مافي اي شي جديد لاكن المشكله مو في الكتااب المشكله في المجتمع الي مو راضي يتطور يبيون كل شي على مزاجهم وانا اشوف ان وداد لوتاه هي الحل للمجتمع يمكن يكون على يده وانا انا تمنى ذلك وانشالله يتطور المجتمع ونعيش احسن مايكون واتمنى التوفيق من الله والله الموفق"
