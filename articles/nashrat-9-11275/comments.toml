text = "السلام على من إتبع الهدى ، يا جماعة مش عيب الواحد يتعلم الصح من كتاب أحسن ما يتعلم الغلط من فيلم كدا وكدا ( فاهمني طبعا ) ، عموما بردو كان المفروض الست دي تسمع كلمة شكرا أحسن ماتسمع تهديد ، هي يعني عاوزة إيه غير صالح المسلمين"
