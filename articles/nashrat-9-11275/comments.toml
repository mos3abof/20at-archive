text = "مرحبا احبابي<br />مسروره جدا ان فيه عقليه بهذا الشكل في مجتمعاتنا لانها هي من ستمسك بيد اخواننا واخواتنا لطريق الصح ومو خطأ ان الواحد يتعلم بس الخطأ انو يمنع هذا الكتاب حتى مايخسرو في السنما والمواقع الاباحيه اللي خلفت لنا قطط تدافع عن الشذوذ<br />انا لله وانا اليه راجعون"
