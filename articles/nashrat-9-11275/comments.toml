text = "السلام عليكم شباب وبنات اول شيء حبيت اقول هذا حال الدنيا صح ولا غلط كلامي مارد الانسان انه يتعلم هاذي الامور وبيطبقها ان شاءالله ولازم نتعلم الامور موعيب على مااعتقد ولا حرام هاذي ثقـــــــــــــ ـــــــــــــــ ــــافه يالع[ *** ] حلو الواحد يتعلم اذا كان بيزوج مع احتــــــــــــ ـــ ـــــــــــــرامي للجميع وبس مشكوريـــــــــ ــــــ ــــن تحياتي لكم اسيــــــــــــ ـــ ـــــــــــــــ ــــــل"
