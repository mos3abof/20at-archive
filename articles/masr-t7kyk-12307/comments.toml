author = "شوية عيال اسكندرانية"
posted = "2009-06-08"
text = "بتوع اسكندرية بيقولوا على كل سكان مصر فلاحين<br />يعنى يا اما تكون اسكندرانى يا اما تكون فلاح - وبيقولوا بصراحة الدكتور الفلاح او الواد اللى جاى من الفلاحين - واحيانا بيتنازلوا شوية ويقولوا على الناس بتوع القاهرة دول من مصر<br />انما الدنيا كلها عند العيال الاسكندرانية فلاحين وصعايدة وفاهمين نفسهم انهم من اصول رومانية او جنس تانى<br />وطبعا الفلاحين بيردوا عليهم بكلام موجع زى جملة سعيد صالح الشهيرة<br />كنت فين يا بنت<br />كنت ب … يابابا<br />فيرد ابوها<br />طيب يا بنت ابقى خدى امك معاكى"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726235302/http://www.20at.com:80/masr/t7kyk/12307-2009-06-08-11-11-58.html"

[[comments]]
order = 1
subject = ""
author = "كلام"
posted = "2009-06-08"
text = "فى العصر الحديث<br />محمد على التركى بنى مصر الحديثة<br />والفلاح الاميرلاى احمد عرابى القادم من قرية فى الشرقية جاب لنا الاحتلال البريطانى<br />والفلاح الكنوليل جمال عبد الناصر القادم من قرية فى اسيوط جاب لنا النكسة واحتلال سيناء<br />وفلاح ميت ابو الكوم جاب لنا الانفتاح والجماعات المتشددة<br />و<br />وكل البلاوى التى حلت بمصر من هؤلاء الفلاحين<br />الجروبات دى معاها حق<br />عيال فهمت الفولة"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726235302/http://www.20at.com:80/masr/t7kyk/12307-2009-06-08-11-11-58.html"

[[comments]]
order = 2
subject = ""
author = "فلاح قرارى"
posted = "2009-06-08"
text = "انا فلاح ابن فلاح ابن فلاح حتى الفرعون منقرع<br />واحد اجدادى ضربوة على قلبة علشان يسخروة فى بناء الهرم او كوم الحجارة اللى الفرعون هيتمدد فية بعد عمر طويل<br />الفلاح المستكين اقدم شخصية منسحبة فى العالم ويقول لك ببلاهة وانا مالى<br />الفلاحين والقادمين من الارياف هم سبب بلاوى وخراب مصر فى العصر الحديث<br />لو ضربت فلاح على بطنة مهما وصل من رتب والقاب هيخر مش فية دود<br />عندما قامت ثورة العسكر سنة 1952 سال رئيس الوزراء البريطانى ايدن هل الذى قام بالثورة تركى او من اصول تركية فقالوا لة انة من اصول سودانية يقصدون محمد نجيب فقال ايدن معقول برضة مش مش من اصول فلاحين<br />هؤلاء الفلاحون لا يصلحون فى الادارة اطلاقا<br />انهم مجرد عبيد فى نفسيتهم وان ظهروا غير ذلك<br />احثوا لنا عن مماليك جدد او اناس من اصول محترمة"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726235302/http://www.20at.com:80/masr/t7kyk/12307-2009-06-08-11-11-58.html"

