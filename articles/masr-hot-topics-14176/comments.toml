author = "اللحم ودول العالم"
posted = "2009-11-25"
text = "معروف ان تربية الحيوانات والمواشى مثل الاغنام والبقر والجاموس جارى القضاء عليها الان بواسطة الحكومة والحزب الوطنى واننا بعد فترة قصيرة سوف نرى البقرة والجاموسة والخروف فى حدائق الحيوان فقط<br />فقد تم القضاء على الاصلاح الزراعى ومزارع تربية العجول ومزارع تسمين الماشية واصبحت وزارة الزراعة وزارة شرفية يديرها وزير استقراطى رئيس حزب تعليمة كلية الحقوق اى محاميا وليس زراعيا ولا يعرف شيئا عن زراعة اللفت ولا طبيخ الكرنب<br />وطبعا البديل هو استيراد اللحوم<br />وطبعا جميل ان نكون مثل دول الخليج نستورد كل شىء من الابرة للصاروخ ولا ننتج شيئا غير البترول مع الفارق انهم عندهم بترول واحنا عندنا مجارى<br />يستوردون اللحم الاسترالى حيا ورخيص<br />نعم نستورد الغنم الاسترالى الرخيصة ونضعها فى مزارع فى الصحراء اسبوع او اسبوعين ثم نذبحها عندنا<br />تماما مثل ما يفعلون فى دبى<br />ولا داعى لاستيراد اللحوم المجمدة التى هى فاسدة فى الاصل ومعفنة<br />ولغاية ما يبان ان للبلد دى صاحب او حكومة"
