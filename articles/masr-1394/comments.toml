subject = "التوريث ماشي حتى في روسيا"
author = "شندويلي"
posted = "2007-01-21"
text = "مبارك ينصح بوتين بعدم التخلي عن السلطة<br />ياعم بوتين اعقل**** ها تسيب السلطة ليه<br />ما انا ربع قرن قاعد**** حصل لي بس ايه<br />دا الكرسي يا ابني جنة**** للي بيقعد عليه<br />تبقي البلد ف ايدك **** مفتوحة ولا البوفيه<br />تغرف وتملا جيبك*** وجيوب ولاد الايه<br />وتخدم اصدقائك**** ف أميركا والاليزيه<br />اطلب من بوش فترة **** وها يخسر يعني أيه<br />دا كريم وايده فرطة**** بس انت اضحك عليه<br />قل له ان الفودكا ملكه**** والكافيار والفيليه<br />قل له ان الغاز بتاعه**** ما تعزش شيء عليه<br />قل له أنا قاعد بحسك**** ومصيرك بين أيديه<br />ابعت نظيف بتاعك**** فهمه ها يقول له ايه<br />يقول له بوتين عاوز**** الى يطبطب عليه<br />لو شايفه فاتح بقه**** على حد م الجيران<br />اعمل نفسك مطنش**** خليه ياخد الامان<br />وبعدين اعمل منظر**** يعني تطلع بيان<br />دي أمور أنا مجربها****وبأعملها من زمان<br />تبقي انت واحد منا**** وتنضم للخلان<br />ياخسارة دا انت نونو**** لسا ف سن الشباب<br />ليه تترمل في عزك**** وتسيبها للكلاب<br />لو فيه عندك عيال**** يبقالها الف باب<br />دا السلطة البعد عنها**** بدون الموت عذاب<br />ها تبقى ايامك صعبة**** وتشوف النوم سراب<br />أنا ناوي اخدها دايركت**** من الكرسي للتراب<br />بس انت اديني رنة**** وانا ابعت لك سرور<br />ترزي لكن معلم**** أيده تتلف ف حرير<br />دا حجة ف المغالطة**** ومكلمة في الزور<br />يعمل م الحق باطل**** ويسمي الضلمة نور<br />في سهرة واحدة منه**** ها يظبط الامور<br />لو كان دستوركو عاصي**** يحلبه لو حتى تور<br />مجلة الإعصار"
