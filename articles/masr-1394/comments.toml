[[comments]]
order = 1
subject = "مش معني هو يعني ؟ هو ابن البطة السوداء"
author = "المواطن المطحون"
posted = "2007-01-01"
text = "ومش معني هو ما يورث الحكم عن ابيه, كل حاجة في مصر بالوارثة , ابن القاضي بيتعين قاضي وابن الضابط بيشتغل ضابظ , وابن الدكتور بيتعين دكتور , مخلاص مصر اصبحت بالوراثة مش بالاحسن والاجود .<br />انصح احمد درويش وزير التنمية الادارية بدل ان يعمل قانون عبيط بيشيل فكرة التعيين الدائم من الحكومة ليجعله مؤقت ,انصحه بعمل قانون التوظيف الوراثي فهاذا هو واقع مصر , وانصح فتحي سرور ان يقترح تعديل اسم جمهورية مصر العربية الي( جمهورية مصر الوراثية)."
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071146/http://masr.20at.com:80/article.php?sid=1394"

