[[comments]]
order = 12
subject = "ربنا يهدينا كلنا ويخلصنا من الجبن والنفاق."
author = "ليفى - من تل ابيب"
posted = "2007-01-04"
text = "ليفى - من تل ابيب<br />ليه فترة طويلة عامل خواجة من وسط تل أبيب وفيكم اللي صدق، وفيكم اللي مش عارف يقول إيه. حضراتكم كلكم على عيني وراسي، ولكن يا حبايبي وتاج راسي الكلام يبقى في الآخر كلام وبس. بقالي أكثر من سنة بحالها وسطيكم وباقرا اللي بتقولوه وتكتبوه، وأعترف إن كثير من اللي قريته معقول وفي الصميم. طيب هو الحل إيه؟ فيه حل؟ ومين اللي راح يحل مشاكلنا طالما إحنا ملناش دعوة بحاجة خالص؟<br />قرفت من نفسي ومنكم وأنا عمال أستفزكم تعملوا حاجة غير الشتيمة، هو إسرائيل يا أذكياء مش ضامنة مصر في جيبها؟ ناقصه دعاية سنكوح زي أنا؟ ربنا يهدينا كلنا ويخلصنا من الجبن والنفاق."
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224346/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
order = 13
subject = "هو إيه"
author = "حكم إيه وعيلة إيه وهباب إيه أولاً العيلة دى غير شرعية فى الحكم لإنهم مزورين وخاينين الشعب يبقى وجودهم أصلاً لا يطلق عليه حكم لكن نقدر نسمية أحتلال لكرسى الحكم بدون شرعية أو سطو على الحياة السياسية"
posted = "2007-01-04"
text = "وبعدين الدستور ماقلش إن إللى يحكم مصر يجيب عيلته والخدامين بتوعه والحراس يحكموا معاه ده يعتبر غير شرعى وتقصير ودى صفة المحتل إنه بيحكم بمجلس حكم علشان يضفى لنفسه شرعية بالعافية<br />وبعدين ولا مبارك ولا مراته ولا إبنه ليهم أى قبول شعبى وكلهم مرفوضين من الشعب يعنى يجيب مراته يجيب إبنه هو عايز يعمل لنفسه رهبة أل يعنى جايب الرجاله بتوعه يخوفوا الناس لكن ده كله كلام فارغ وهو غير شرعى فى الحكم وقريب جداً ها يخرجوا برة مصر وهانتحرر فى فسادهم<br />وبعدين يعنى إيه يجيب إبنه حتة العيل ده من موظف صغير فى بنك يعينة رئيس لجنة سياسات وبعدين رئيس جمهورية فى بلد فيها 4 أخذوا جائزة نوبل عن جدارة وفيها أساتذة جامعات أقل بحث ليهم كان ليه تأثير فى الأبحاث العلمية وهو المحروث خبرته إيه إن شاء الله ياريت يفصح لنا عن خبراته ولا عن رصيدة وجابة منين ولا عن رأس مال مشاريعه والبزنس بتاعه بصراحة بقى مصر بالنسبة ليهم هى البقرة إللى بيحلبوا شعبها وعايشين على مص دمها لكن بجد كفاية عليهم كده وإن شاء الله ها يخرجوا منها قريب قوى فما جاء بالباطل باطل باطل باطل<br />اللهم ولى علينا خيارنا ولا تولى علينا شرارنا اللهم آمين"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224346/http://masr.20at.com:80/article.php?sid=1394"

