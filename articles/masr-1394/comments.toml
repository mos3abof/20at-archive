author = "عزرا بروفينسكى!"
posted = "2007-01-05"
text = "يا عم ليفى صدقى قلت لهم الكلام ده بدل المره الف وساعات كنت بدخل ارد بعديك يمكن باى اسم كان ييجى على بالى ساعتها بس كنت بقول فكره واحده ان اسرائيل مش خلاص يعنى قاعده مجنده عملائها اللى بيعرفوا عربى عشان خاطر يكتبوا رد هنا و لا هناك.<br />بس هى الحكايه كلها انهم كانوا مبسوطين لكده و حاسين ان لهم اهميه لدرجه ان اسرائيل بتدور وراهم ، هما كانوا محتاجين يصدقوا ده ، وصدقنى فى ناس هتتصدم من كلامك ده و يمكن يحاولوا يكدبوك و يقولوا لا برضه انت اسرائيى و النجمه اهيه<br />دى عالم تعبانه واذا كانوا اصلا معتبرين ان فى واحد (او واحده الله اعلم) بيدخل يرد ساعات باسم الدشم ان دى سوزان مبارك !!! عمر حد شاف هطل اكتر من كده.<br />ومش بعيد يطلعونى انا كمان شارون و بكتب لهم من وانا فى الغيبوبه.<br />ارحـــمنا يا رب"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224346/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
order = 15
subject = "مصدوم"
author = "اخوكم"
posted = "2007-01-05"
text = "حقا صدمت فى اول كلام الاخ ابن بهيه فانى متابع لمقالاته منذ فتره و معجب بها الى ان قال هذه الجمله الشنعاء التى اعتبر فيها موت الطاغيه صدام لسعه ساخنه تلقاها فى يوم العيد.<br />انا متاكد من امانه الاخ ابن بهيه ومتاكد من انه لو كان يعبش فى العراق ايام حكم الطاغيه السوداء هذه لما قال هذا الكلام<br />يا اخى ماذا يحزنك فى موت من قتل الاف من اخوانك فى العراق اما فى مقابر جماعه او فى عمليات تجريب لاسلحته الكيمائيه الحقيره التى لم ترفعها الا فى وجه شعبه<br />ماذا يحزنك فى موت من القى بالاف من خيره شباب العراق فى حرب لا طائل منها امام ايران<br />ماذا يحزنك فى مقتل من ترك شعبه يموت جوعا بينما يملا هو وعائلته من اللصوص خزائن اموالهم<br />ماذا يحزنك فى مقتل من تسبب فى طردوتهجير العديد سوا طواعيه او مرغمين الى بلاد الله الواسعه منها مصر الكنانه<br />ماذا يحزنك فى موت من غزا الكويت الشقيق و تسبب لهم فى كوارث اثارها باقيه حتى اليوم مع سوء علاقات بين الشعبين الشقيقين لا يعلم الله متى تنصلح<br />ماذا يحزنك فى موت من سب بلادك ورئيسك حتى وان اختلفتم عليه<br />ماذا يحزنك فيمن كانت اوامره يفوق احكام المحاكم حتى وان حكم على فرد بالاعدام<br />ماذا يحزنك فيمن اضطهد كل من خالفه سوا فى العرق او العقيده او الراى حتى وان كان من اهل بيته<br />ماذا فعل صدام للعرب و العروبه حاول بنا النووى انما حاول ذلك لمجده الشخصى وعلى حساب نهضه و رفعه الشعب العراقى<br />حاول ضرب اسرائيل كنت تعالى وانظر لصواريخه الخاويه التى كانت تتحطم على الهواء قبل ان تصيب اسرائيلى واحد اتعرف لماذا؟ لانه جبان يا اخى الكريم يخاف ان يقتل اسرائيلى واحد انما فعل هذا لكسب العامه من العرب ليهللوا له ويحزنوا لموته كما حزنت انت<br />يا اخى الكريم سوا قتلوه الامريكان او قتلوه الشياطين لما<br />اقرأ بقية التعليق .."
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224346/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
order = 16
subject = "صدام الاسد"
author = "صدام عاش اسد"
posted = "2007-01-05"
text = "ومات اسد وسيعيش فى ذاكرة التاريخ<br />من بنى جامعات العراق الحديثة<br />من علم الشعب الجاهل<br />من كان يوزع الطعام على الاسر لا فرق بين اى مذهب<br />مين اللى كان موفر الوظائف<br />ستندمون وستندمون<br />ولا يمكن ان تروا اى خير من العمم واللحى المعفنة"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224346/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
