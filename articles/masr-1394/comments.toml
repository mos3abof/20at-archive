subject = "ليفى - من تل ابيب"
author = "ليفى"
posted = "2007-01-06"
text = "صدام كلب<br />وتعالوا نعمل حسبه كم مسلم قتل فى العراق وايران ( 2مليون ) وكم يهودى قتل و لاواحد.. لكن العرب بتحب اى واحد يشتم اسرائيل حتى لوكان بيضحك عليكم زى ياسر عرفات والاسد وحزب الله وكلهم كدابين وباعوا القضيه وقبضوا ملايين والشعب العربى بيهتف باسمهم وهو ميت من الجوع"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224346/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
order = 18
subject = "بل كلب"
author = "اخوكم"
posted = "2007-01-06"
text = "من هذاالذى يتحدث بنى الجامعات !! والله انتم يا عرب اغبياء يفتكرون ان كل ما يفعله رئيس مثل صدام انه فضل منه ، ان اسوا الدول فى العالم يبنى فيها الرؤساء جامعات ايها الخائن ، اسرائيل بها افضل جامعات ايها الجاهل فماذا تقول عنها ، كان يوزع الطعام !! اى قول احمق هذا اكان يمشى بعربه و يوزع منها الطعام على الناس هههههه ، ان التعصب الاعمى لا يجعل الناس تميز ما تكتب"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224346/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
order = 19
subject = "هى فيه العيلة"
author = "دشم"
posted = "2007-01-07"
text = "الصراع الموجود على الحكم فى مصر مبقاش بين مبارك وبين المعارضة ده بقى بين مبارك وبين أبنه إللى بيسافر خلسة لأمريكا علشان تديله الموافقة وعمال يهمش أبوه فاكر إنه ها يلاقى قبول من الشعب إللى عارف فساده ونهبة وقذارته والصراع أيضاً بين سوزان مبارك إللى عمالة تدور لنفسها على نصيب كبير من الكعكة المنهوبة أقصد يعنى مصر وطبعا الكل عارف إن سوزان مش مصرية وهى إنجليزية من أصل يهودى يعنى معنى كده إن مصر بتتدحرج لإحتلال يهودى علشان ترضى أسيادهاإللى معتقدة إنهم ها يسندوها لكن كل إللى هى بتحلم بيه ها ييجى على مافيش لأن الشعب كله رافضهم وبكرة ها تطرد وترجع بلادها تانى ومصر ها تنضف من فساد العيلة القذرة إللى ما فيش حد أسوأ منهم حكم مصر<br />حسبى الله ونعم الوكيل"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224346/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
order = 20
subject = "ليفى - من تل ابيب"
author = "ليفى"
posted = "2007-01-07"
text = "بقى سوزان من اصل يهودى وعايزه اليهود يحتلوا مصر ههههههههههه ماهى تلاتين سنه فى الحكم وما شفناش احتلال يهودى لمصر ..يعنى انت كداب .. وحكاية اليهود دى يافطه بيرفعها كل المفلسين للضحك على شعوبهم الغلبانه والمشكله ان الاغبياء زيك بيصدقوا .. ياحبيبى مصر من يوم ماعملت معاهدة السلام وهى بخير وامان والشعب ارتاح من الحرب وبلاوى الحرب اللى جابت الخراب والدمار لبلدكم ايام عبدالناصر والضباط المجانين .."
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224346/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
order = 21
subject = "لكل شئ حدود إلا الغباء ( مار ليفي من تل ابيب )"
author = "سعد الشاذلي"
posted = "2007-01-07"
text = "البهيم ده اللي مسحور قوي ومهووس بحكاية ليفي شخلع ده إما إنه حمار أو ناقص عقل أو ماما بتاعته بتديه مصروف زيادة يضيعه في مقاهي الإنترنت في كتابة الكلام الحامض بتاعه. خلاص يعني مبارك وأولمرت مش لاقيين وسيط غيره بينهم وبين المصريين واليهود!<br />إتكسف ياحمار..اليهود كلامهم مختلف ويعتمد على المبالغة في الإطراء والمديح على اللي عايزين منه مصلحة..فاهم قصدي؟<br />يعني لو يهودي حضرتك كنت أكدت بالحق والباطل على إنصهار مصير ومصالح الشعبين وتوافقهما على مدى العصور...دي لغة اليهود..إنما حضرتك نازل ردح للمصريين وبتقولهم إنهم حمير ..الخ، ومتوقع إنهم يقولو آمين.<br />أتوقع واحد إبن حلال حب يساعدك تتخلص من جنانك وحموريتك فكتب الكلام المعقول اللي رد الأخ عزرا عليه مشكورا، ولكن لأن القباحة والحمورية طبعك الأصيل ضيعت الفرصة..لعنة الله على كل مدع كذاب."
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224346/http://masr.20at.com:80/article.php?sid=1394"

