subject = "الى فارس"
author = "نيفين نيفى نوفا"
posted = "2007-01-13"
text = "و الله يا فارس اخيرا لقيت حد موافقنى ع الراى دا<br />وبعد ما الست لميس الحديدى (المعروفه انتماءاتها الحزبيه الواضحه)جابت جمال و سالته و قال انه لايسعى للحكم و الحكايه اتعقدت اكتر و الناس قالت اكيد مطبخينها سوا<br />مع ان المنحنى التاريخى لحكم مبارك لا يحمل بادره امل لاى فرد من عائلته المقدسه<br />عموما ان غدا لناظره قريب"
