[[comments]]
order = 7
subject = "ليه مزعلين نفسكم"
author = "عبد المنعم المصرى مقيم بالمهجر"
posted = "2007-01-03"
text = "يا جماعة الخير انا باقلى مدة موش باكتب عندكم لكن بالصدفة شدنى الموضوع رغم حالة الاكتئاب اللى عندى من ساعة ما دبحوا صدام حسين الله يرحمه وليس الان وقت التعليق على هذا الموضوع<br />خلينا فى موضوع التوريث بس يهمنى ان دايما تكون عينينا مفتحة على كل الاحداث<br />ما تستعجلوش بالاحكام على اناس بمعنى<br />لو عرفتم الاجابة على هذا السؤال قد ترتاح اعصابكم شوية ؟<br />السؤال هو من اول شخص فكر فى توريث الحكم فى الدول العربية الجمهوريات ؟؟<br />اكيد اللى هايقول الاسد واللى هايقول القذافى واللى هايقول على عبد الله بتاع اليمن واكتركم هايقول حسنى مبارك لانه كما هو معروف ان مصر هى الرائدة دائما فى المشارع الهدامة ؟؟ اليس كذلك<br />لوكانت اجابتكم اى واحد ممن ذكرتهم فى السؤال فكدة انا آسف كلكم سقطتم فى الامتحان<br />الاجابة لصحيحة اول من فكر فى توريث الحكم هو الراحل صدام حسين فعلا ولهذا عليكم ان تتعظوا اين صدام الان واين من فكر فى توريثه الحكم ؟؟ لقد رحل الوارث قبل الموروث<br />هكذا حال الدنيا امال اسمها دنيا ليه<br />لانها ما بتستقرش على حال<br />والباقى انتم تعرفوا ايه قصدى منه<br />تصبحوا على خير"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071146/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
order = 8
subject = "دى بجاحة"
author = "بجد الواحد ماشفش بجاحة بالشكل ده"
posted = "2007-01-04"
text = "لما إللى مسمى نفسه رئيس جه للحكم وأيديه ملوثه بدماء السادات<br />لما جه وعينه ها تطلع على الكرسى وقال أنه هاقعد فترتين قبل لما يقول البرنامج بتاعى كذا وكذا وقبل لما يغير فعلاً الدستور ويخلى مدة الحكم فترتين<br />لما ما يحترمش الدستور إللى قال إن الحاكم ييجى للحكم بالإنتخاب وهو جه للحكم بالترشيح ولم ينتخب يبقى باطل ولا مش باطل<br />لما يزور كل الإنتخابات علشان يفضل لابد فى الكرسى للأبد يبقى باطل ولا مش باطل<br />لما يجيب كل المجرحين أصحاب السوابق من تجار مخدرات وأصحاب قضايا دعارة لنواب قروض ناهبين البلد ويعمل منهم مجلس شعب علشان نظام شيلنى وأشيلك يبقى ده واحد قلبة على مصر<br />لم يجيب أبنه من موظف بنك يوجد منه الآلاف ولا يفقه شيء ويزرعه قيادة فى حزب حاكم علشان هو إبنه وعايز يورثه الحكم فى دولة كرم العالم أبناءها وهو لا يملك أى خبرات يبقى ده واحد قلبة على البلد ولا على الشعب<br />لما ينهب مصر ورصيده بالمليارات والشعب جعان ومسبش حاجة معملش فيها بزنس علشان يتربح على حساب الشعب يبقى ده قلبة على الشعب<br />لما ولاده شوية العيال اللى أقل واحد فى الشعب ربى عياله أحسن منهم يمتلكوا كل المليارات ده وكل المشاريع دى هل أى حد فى شباب مصر عنده اللى عند جمال ولا علاء يبقى ده حاكم عادل ولا حرامى<br />لما مراته عماله تنهب فى فلوس جمعيات وهمية لرعاية الأطفال والنساء وأحوال الأطفال فى تشرد يعنى لما يبقى أكثر من 2 مليون من ولا الشعب أبناء شوارع دول ها يطلع منهم جيل شكله إيه وتروح تهادى بآثار مصر علشان تحصل على جوائز تمجدها وهى مش دافعه حاجة من جيبها تبقى دى مخلصة لمصر ولما تسافر وتروح وتيجى وكله على حساب الشعب وتجتمع بالوزراء وتلقى عليهم الأوامر ولما المتظاهرين يتضربوا بأحذ<br />اقرأ بقية التعليق .."
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071146/http://masr.20at.com:80/article.php?sid=1394"

