[[comments]]
order = 24
subject = "البنك الدولي"
author = "البنك الدولي : مصر فى المرتبة 165 بين 175 دولة من حيث جذب الاستثمارات وفى المركز الاول من حيث الفقر"
posted = "2007-01-18"
text = "تقرير التنافسية الدولية : مصثر فى المركز 63 و تونس فى المركز 30 و الامارات فى المركز 32<br />فريدوم هاوس : مصر فى ذيل قائمة الحريات السياسية و المدنية<br />منظمة الشفافية الدولية : مصر رقم 70 بين 146 دولة من حيث الشفافية .. و الفساد يمثل 69% من جملة المعاملات الاقتصادية فى البلاد<br />مجلة الايكونوميست : مصر حصلت على 4.3 من 10 فى الديمقراطية<br />جامعة شنغهاي : لا توجد اى جامعة مصرية بين افضل 500 جامعة فى العالم<br />دراسة جامعية امريكية : مصر تنتج 375 كتابا سنويا و اسرائيل تنتج 4000<br />الفيفا : جنوب افريقيا حصلت على 15 صوتا لتنظيم كأس العالم 2010 و المغرب 10 اصوات و مصر ... صفر<br />مراسلون بلا حدود : مصر فى المركز 133 بين 168 دولة فى حرية الصحافة و تسبقها موريتانيا و افغانستان<br />الامم المتحدة : الفقر فى مصر ارتفع بنسبة 7% بعد موجة الغلاء الاخيرة و 23% من الاطفال الفقراء توقفوا عن التعليم<br />الجمعية الافريقية لامراض الكبد : 12 مليون مريض بالالتهاب الكبدي فى مصر<br />المشروع القومي لمكافحة السرطان 100 الف مريض بالسرطان سنويا<br />التقرير الاستراتيجي العربي : مصر رقم 75 بين 87 دولة فى اواضاع المرأة<br />الامم المتحدة : 100 الف طفل شوارع فى مصر<br />كل دي مصايب فى مصر دة غير حاجات تانية كتير اكيد كلنا عارفنها<br />وتحيا مصر يا عم"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235108/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
order = 25
subject = "التعليق"
author = "الدشم"
posted = "2007-01-18"
text = "الدشم عادت من جديد للدفاع عن الحق<br />ويعود مهللي الرئيس مرة أخري للقول \"عدل.. غير.. إحنا معاك\" ياسلام بقى محلل الإيكونومست هيقول عدل غير احنا معاك واضح ان الكاتب الكداب شاف خبر هنا و لا هنا و ضاف عليه شويه كدب من اللى بيسموها الصحفيين النصابين توابل على الموضوع كى يجذب القراء وكل ده عشان يدارى على حقده و كرهه للرئيس وهو يعنى جمال مبارك عمل لكو ايه و لا شوفتم منه ايه وحش ايه عيبه غير انه ابن الرئيس<br />نعم للتوريث ولاستكمال المسيره"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235108/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
order = 26
subject = "إيه اللي دخل ابن اليهوديه بيننا"
author = "مراد المصري"
posted = "2007-01-18"
text = "لاحظت التعليق المكتوب من خنزير يدعى ليفي وكمان بيقدم لنا نصيحه! وبيلسن على فلسطين وحماس! السؤال هو منذ متى والخنازير لها صوت؟ وكمان ده موضوع خاص للمصريين والعرب ليه يورط نفسه ويتكلم عن جمال وحسني؟ ولا عشان هم زنب لإسرائيل وبيستفيدو من رزالتهم ع الشعب الغلبان واللي يستاهل اكتر من كده عسان سكوته اللي ما لهوش معنى؟؟"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235108/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
order = 27
subject = "لالن يكون فبعد الليل نهار ."
author = "صفاء"
posted = "2007-01-19"
text = "اولا علشان يقول سوف يورث او لايرث لازم يكون هناك اشياء نعتمد عليها فى تنحيهم وحاسبتهم واسترجاع اموالنا من هذاالكابوس فماذا اعددنا لهذا فالجميع داخل اللكهوف يتكلمون وبس لايقدر احد ان يقول بم ماذا اعددنا لهذا اليوم من يقول فينا انا راجل وسوف اوريكم العدل كيف يحكم لااحد فوق القانون كما يحدث فى الصغير الذى يحاسب اذا جنية بيتبهدل هو واهلة ده بلد بحالها اتسرقت ومحدش قال امسك حرامى الخوف والجبن سيطر على الجيع من هذا البعبع العجوز وابنه الهايف يببقى ازاى نقدر نقول يورث او لايورث فالجميع جبان لقد حولوا الشعب الى جبان يتحكم المجرمين فى قوتة واملاكه ولا يقدر احد ان يقول الحقوا حرامى اتسرقنا لازم مااخذ بالقوة لايسترد الابالقوة قولى تو صحينا وقالوا حسنى مات ما العمل ما الاجراءات التى سوف تتخذ مجلش الشعب ومجلس الشورى سينتخبوا مين من هم البذين ينفعوا يحكموا مصر لانعرف عنهم حاجة وبالضغطعلينا سوف نلاقى انفسنا فى البئر الذى حفر لنا لاننا لمنتكاتف ونخطط لمستقبنا وربنا يولى منا الاخيار ويبع عنا الفجرة واتمنى من ياتى بعده يكون راجل بصحيح وينتقم لنا السهينة والامريكان وتعود شركات مصر لمص ويعمل الشباب وتعمر المدن لولاد مصر وتزرع الارض لشعب مصر وبترول مصر لمصر اللهم انصر نصر عزيز مقتدر"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235108/http://masr.20at.com:80/article.php?sid=1394"

