[[comments]]
order = 4
subject = "اوافق على جمال- بشروط"
author = "ايمن امام"
posted = "2007-01-02"
text = "اوافق على جمال مبارك بشروط/ ان يعيد الاموال المنهوبه لمصر/ ان يحاكم كل المتهمين فى التعذيب على غرار محاكمه صدام حسين - يعنى يجيب قاضى كردى -ان يحاكم يوسف والى - ان يقضى على البطاله - ان يضع تشريعا يعاقب كل من يتطاول على الدين الاسلامى - ان يسمح بأنشاء احزاب بدون لجنه الاحزاب اياها- ان يخضع الانتخابات للقضاء فقط سواء لجان رئيسيه او فرعيه-ان يخضع بطلان عضويه عضو مجلس الشعب للقضاء وليس لسيد قراره - ان يخضع الاجهزه الرقابيه فى الدوله لرقابه القضاء - ان يجعل شيخ الازهر والنائب العام بالانتخاب-وليس بالتعيين- ان يضع معايير اخلاقيه للفن وخاصه السينما - ان يمنع تعيين العسكريين سواء شرطه او قوات مسلحه فى المناصب المدنيه- هذه هى الشروط سواء كان جمال او غيره هذا مااحلم به - طبعا 90% من هذه الاحلام لن تتحقق- وبالتالى فأننى سأظل احلم- حتى الموت / ايمن امام"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071146/http://masr.20at.com:80/article.php?sid=1394"

[[comments]]
order = 5
subject = "مش ممكن"
author = "أولاً لنتحدث بالعقل فليس بيننا وبين جمال مبارك سابق ثأر ولم يغتصب أحد من أهلى ولكنى أرفضه فى الحكم للأتى:"
posted = "2007-01-02"
text = "أولا جمال مبارك ليس مصرياً خالصاً فأمه إنجليزية من اصل يهودى يعنى معنى كده أننا هانكون محتليين لليهود<br />ثانياً جمال مبارك لا يملك أى خبرات فهو زرع فى الحزب الوطنى وبدون إى خبرات أكثر من أنه إبن مبارك وهذا لا يحدث فى أى دولة فى الحالم أن قيادات الأحزاب تزرع ولكنها تتدرج لإكتساب الخبرات<br />ثالثاً جمال مبارك نهب مصر كلها ووصل رصيدة ل 60 مليار دولار يعنى جابهم منيين غير من نهب المصريين ومص دمائهم يبقى إزاى ها يكون قلبة على الشعب<br />رابعا جمال مبارك لو عنده أى حلول لمشاكل مصر التى هو وعائلته كلها سبب فيها كان يقدر يحلها لكن هو عايز بس النهب والفساد ويكمل مسيرة الدكتاتورية<br />خامسا جمال مبارك تربى وترعرع على يد أكبر دكتاتور عرفه العالم وفى بيت الدكتاتورية فكيف سيكون غير دكتاتور وأنظروا إلى نظرات عينية كلها كراهية للمصريين وكأنهم رعاع كما تطلق عليهم السيدة والدته سامحها الله<br />سادسا الشعب كله يكره العائلة كلها ولن يتقبل أى وجه منها<br />سابعا يوجد من هو أكثر خبرة مثل السيد عمرو موسى والشاطر والعريان وغيرهم وكلهم كفاءات جاهزة وذات خبرات وضحوا بحرياتهم فى المعتقلات من أجل مبادئهم ودعوتهم للإصلاح الحقيقى<br />يبقى ياريت جمال مبارك يبطل يتنطط ويعرف قد إيه الشعب قرفان منه ومش عايزه هو لو كان قلبة على مصر كان يرجع بلده إنجلترا لإنه مزدوج الجنسية ويريح المصريين كلهم منه وحسبى الله ونعم الوكيل مليون مرة فى العيلة دى ويارب ريحنا منهم كلهم<br />اللهم أخرجهم من مصر أزلاء اللهم ذل مبارك كما أذل الشعب كله أنت المعز المذل اللهم أمين يارب العالمين"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104071146/http://masr.20at.com:80/article.php?sid=1394"

