subject = "بيض الهند"
author = "كرملينو"
posted = "2006-03-28"
text = "انا قلت قبل كده يا ابيض يا اسود<br />اللون الرمادي ده مبحبوش<br />يا جماعه الراجل محمد مغلطش و لا قال الابيض حرام و لا الاسود هو الحل<br />نهاركوا ابيض<br />بس الاسود حشمة على راي منى و مبيحبش شريك لى راي هوبا<br />و الابيض شفتشي خالص و يشف و يصف و حالته حاله يعني لازم تعمل الانثى احتياطاتها قبل اللبس<br />اما بقا عن نفسي ااقولكوا الصراحة<br />انا اخدت عهد على نفسي ما البسش لا ابيض و لا اسود<br />لانهم بصراحة بيتوسخوا بسرعة و انا شقي موت و ممبطلش حركة عشان بوسخ هدومي<br />و كانت امي و انا صغير بتهريني ضرب لما اوسخ هدومي<br />عشان كده اعقدت<br />حد عنده دكتور نفساوي حلو و سره مستريح يفك كلاكيعي ؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114932/http://www.20at.com/article2.php?sid=627"

