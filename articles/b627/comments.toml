subject = "امممممممممم"
author = "هبابه او هوبه او هبهوب"
posted = "2006-03-27"
text = "ما انتو عندكوا مراسلين في لندن اهو<br />لو عايزين تتبنوني انا موجوده<br />بس لاه انا بحب اكتب تعليقات اكتر<br />ما علينا<br />الابيض<br />اسم علي مسمي يا بشر<br />انا كنت في لحظه عايزه البس فستان ابيض زي بتاع حنان ترك في بدايه التتر<br />وراجعوا \" ابيض واسود \"هنا في الموقع<br />لديد<br />بس الاسود ....... امممممممم يا دي الاحباط<br />اخيرا ما له\" الاسماريكه \"<br />بحب اللون الاسمره دا موووووووت فيه اصاله كدا \" عندي عقده نقص \"<br />سلام يا \"ابيضيكه\"."
