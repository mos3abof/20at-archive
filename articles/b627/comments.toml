subject = "بين الابيض و الاسود محتاره و الله"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-28"
text = "على راى غنوه بين الاهلى و الزماللك محتاره و الله<br />لا<br />محتاره ايه يا نيفى الاهلى حديييييييييييد<br />و الله يا جماعه اللون البيض دا لة اتكلم هيقةا انامش زى الفريك<br />و بحب الشريك<br />لانه ميتلبسش لوحده<br />ارتبط بطيبه القلب (القلب الابيض)و التفاؤل(سنه بيضا)<br />لكن الاسود<br />ياااااه يا هبهوب<br />يا روحى عليه<br />لون فخور ميقبلش شريك<br />ة ربطوه الناس بالحزن و السحر<br />بس هيفضل مللك الالوان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114932/http://www.20at.com/article2.php?sid=627"

[[comments]]
order = 5
subject = "الف وجه للقمر لجويدة"
author = "هبهوب القمور"
posted = "2006-03-28"
text = "شعر للقمر معرفش يابت يا نوفا ممكن زيك كدا اهو يابت<br />بس امممممم ممكن ليها معني تاني برده هو بعيد بس قريب<br />حفقعك شعرين ومتسالنيش بتاع مين التاني وسلامي يا قمر ب سفي طور<br />\"البدر \"المره د ي<br />شعر فاروق جويدة<br />في كلّ عام<br />تشرقين على ضفافِ العُمرْ<br />تنبت في ظلامِ الكونِ شمسٌ<br />يحتويني ألفَ وجهٍ للقمرْ<br />في كلّ عام<br />تشرقين على خريفِ القلبِ<br />يصدح في عيوني صوتُ عصفورٍ<br />و يسري في دمائي نبضُ أغنيةٍ<br />و يغزلنا شوقنا المجنون أوراق الشجرْ<br />في كلّ عام<br />تشرقين فراشةٌ بيضاء<br />فوق براعم الأيام<br />تلهو فوق أجنحة الزهرْ<br />في كلّ عام<br />أنتِ في قلبي حنينٌ صاخبٌ<br />و دموعُ قلبٍ ذابَ شوقاً ... و أنكسرْ<br />في كلّ عام<br />أنت يا قدري طريقٌ شائكٌ<br />أمضي اليكِ على جناحِ الريح<br />يُسكِرني عبيرك<br />ثم يتركني وحيداً في متاهات السفرْ<br />في كلّ عام<br />أنتِ في عُمري شتاءُ زوابعٍ<br />و ربيعُ وصلٍ<br />و ارتعاشاتٌ يُدندنُها ... وترْ<br />في كلّ عام<br />أنتِ يا قدري مواسمُ فرحةٍ<br />تهفو الطيورُ الى الجداولِ<br />تنتشي بالضوءِ أجفانُ النخيلْ<br />و ترتوي بالشوقِِ أطلالُ العُمر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114932/http://www.20at.com/article2.php?sid=627"

[[comments]]
order = 6
subject = "الاقمار الراحله"
author = "هبهوب المنور"
posted = "2006-03-28"
text = "أي المواجع أبكي كلها ألمي<br />أي الجراح أداوي كلهُنَ دمي<br />أي الدروب يواري دمعَ متعبةٍ<br />باتتْ مع الحزن والتسهيد والسقم<br />ما أشرقتْ شمس يومٍ أو بدا قمرٌ<br />إلا دماها كنهرٍ جارف ٍ عرم<br />هذي هي الأمة ُالثكلى بفارسها<br />تبكي على خالدٍ ترثي لمعتصم<br />تسائل الليلَ عن فرسان ِنهضتِها<br />في أي درب ٍمضَوا في حالك ِالظلم<br />قالتْ بَـنِيَّ وما لي عنهُمُ جلدٌ<br />أنسامُ روحي فؤادي مهجتي حُلُمي<br />دمي دموعي جراحي حُرقتي حَزَنَي<br />قهري انكساري اغترابي وحدتي ألمي<br />يا أمُ فرسانُكِ الأبرارُ قد رحلوا<br />مع الصباح ِوحلوا عاليَ القمم<br />يا أمُ فرسانـُكِ الأبرارُ قد سكنوا<br />في جنة الخلدِ بين الحورِ والخدم<br />همْ جهزوا الخيلَ بعد الصبح ِفي عجلٍ<br />ليلحقوا بطريق ِالعز والشمم<br />يا أمُ قد رحلَ الفرسانُ فاصطبري<br />وكفكفي الدمعَ للرحمن فاحتكمي<br />يا أمُ إنْ رحل الفرسانُ فارتقبي<br />للثأرِ من خائن الأوطان والذمم<br />يا أمَّنا شهداءُ الحق جسرُ دمٍ<br />إلى الحياة وما ينهار جسر دم<br />بالأمس ِودع يحيى صامتًا ومضى<br />إلى الجنان جسوراً غيرَ منهزم<br />وبعده سار محيي الدين يتبعهُ<br />أحيا بهمتِهِ ما ماتَ من همم<br />وعادلٌ وعمادٌ أوقدا شعلاً<br />نوراً لأمتنا ناراً على الصنم<br />وفارسُ القدسِ محمودٌ يعلمهم<br />أنَ الفوارسَ تأبى الضيمَ إن تُضم<br />وذا صلاحُ أميرُ الركب قائدُهم<br />أبو الكتائبِ شيخُ البأسِ والفهم<br />وفارسُ الفكر إبراهيم ملهمُهم<br />حازَ البطولة َمن سيفٍ ومن قلم<br />فرسانُ أمتِنا أركانُ نهضتنا<br />أعلَوا مبادئـَنا وضاءة َالقيم<br />ما سار منهم شهيد ٌ أو قضى بطلٌ<br />نــادتـه جـنــاتُ خـلـدٍ عندنا أقم<br />تمضي الأسودُ على آثارِهم زمراً<br />فليس يخرج منها غيرُ مستهم<br />همْ أسمعوا العالمَ النومانَ صرختـَنا<br />وقبلهم كان عنا الخلقُ في صَمَم<br />كانوا هُمُ الحُلُمَ المرجُوَ في غدنا<br />ما كانَ أجملَ ذاك الوعدَ من حلم<br />يا أمُ أنت التي ربيتـِهم أبداً<br />على الكرامة والأمجاد والشيم<br />يا أمُ أنت التي علمتهم أبداً<br />ألا يهونوا إذا وقعُ الوطيس ِحَمِي<br />أتعجبين بأن جادوا بأنفسهم<br />وأنت علمتهم أعلى ذرا الكرم<br />فشيعيهم إلى الجنات راضيةً<br />وزغردي أمَّنـَا في الركب وابتسمي<br />وعطريهمْ وغني في مواكـبـِهم<br />فليس عرسٌ بلا عطرٍ بلا نَـغـَم<br />وزوديهمْ دعاءً حانياً ورضىً<br />لولا دعاؤك ما ساروا على الحمم<br />قولي لهم يا بـَنِيَّ الخلدُ موعـدُنا<br />وحسبـكـم يا بَـنِـيَّ الخـلدُ في الِنعـَم<br />يا أُمَّـنَا أنت بالتوحيدِ واحدة<br />في الهم ِواحدةٌ في الفرْحِ في الألم<br />ما أرقَ الهندَ والشيشانَ من كدرٍ<br />أجـابتِ الشـــامُ إنـي منـه لـم أَنــَم ِ<br />أو أطلقتْ صرخةً في الصين ِباكية<br />تجيـبُها صرخاتُ الحزن ِفي الحرم<br />ومصرُ تحكي عن القوقازِ نكـبـتـَـهُ<br />والقدسُ جاورتِ البلقانَ في الخيم<br />لا.. لست ِوحدَكِ بالأحزان ِمفردةًًًًًً<br />هاتي من الحزن ِشيئاً عنكِ نقتسم<br />حتامَ صمـتـُـك يُزكي نارَ حيرتِـنـا<br />ماذا بخلدِكِ يا خنساءُ من كلم<br />حتى إذا خرجتْ عن صمـتِـها ومَضَتْ<br />تـُـكـلمُ الناسَ فاضتْ أبلغُ الحكم<br />واللهِ ما جئتُ أبكي عندهم جزعاً<br />ولا اعتراني لهم شيءٌ من الندم<br />لكنني كنتُ أشتاقُ اللقاءَ بهـِمْ<br />قبل الوداعِ وقلبي للقاءِ ظمي<br />قولوا لهمْ أمُّكُمْ جاءتْ تودعُكُم<br />بزغـرداتِ فــؤادٍ مـثـقـلٍ وفـم<br />قولوا لهم أيها الفرسان فانتظروا<br />خطوَ العجوز ِاعتراها الوهنُ في القدم<br />قد أثقلتها السنونُ السودُ فانكفأتْ<br />تمشي الهوينى تقاسي وطأة َالهَرَم<br />يتيمة ٌمنذ دهرٍ رهنُ وحـدتـِها<br />شريدة ٌوهْي كانتْ درةَ الأمم<br />تسيرُ فوق جمارٍ من أسى كبدٍ<br />محرقٍ بجمارٍ من لظى الحمم<br />يا أمُ أقمارُنا غابتْ مودعةًًًًًً<br />وأعجزتْ بضياها سطوة َالقلم<br />وهكذا ترحلُ الأقمارُ صامتةًًًًًً<br />وتتركُ الكونَ يشكو حلكـة َالظلم<br />جميع الطبع واتزيع لدي فضائكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114932/http://www.20at.com/article2.php?sid=627"

