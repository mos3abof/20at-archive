text = "الأبيض داخل المنزل فقط أما خارج المنزل فلا يصح للعاقلة الرشيدة الملتزمة المطيعة ذات العقل الناضج والفهم السليم والإمتثال لأوامر الله وسنة رسوله صلى الله عليه وسلم أن ترتدى الزى الأبيض ففيه من الفتنه ما فيه وتفهم كلامى هذا من يكون لديها قدر من العلم ولا تنساقوا وراء الشبهات المزينة والمزخرفه بكلام ليس من ديننا ولا من سنة نبينا صلى الله عليه وسلم"
