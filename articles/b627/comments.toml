subject = "الاسلام رحمة"
author = "فلسطينية"
posted = "2006-03-30"
text = "سلام لكم جميعا أخ محمد الدين دائما رحمة ولايوجد كل هذا التعقيد في الدين فبدل من النظر الى لون اللباس المطلوب ابيض او اسود فيجب النظر الى الهدف او المعنى منه والشروط الدينية المتوفرة فيه فأن ارتدي الجلباب وبجميع الوانه ضمن الشروط الاسلامية من فضفاض وغيرها ولكن ما يخيفني هو طرق الناس في عرض الاسلام كأنه شبح يريد حرمان الناس من كل شي واذا كنت تركز على لون الذي يجب إرتداء المسلمات له فأنا اركز على عرض الصورة الجميل والحقيقية للاسلام على من لم يشعر بعد بلذة الاسلام وشعوره الجميل الذي يريح القلب والنفس ويرضي الله عز وجل وليغفر الله لنا جميعا"
archived = "2006-11-02"
