[[comments]]
order = 5
subject = "مساء الخييييييييييييير"
author = "نيفين..نيفى ..نوفا"
posted = "2006-03-26"
text = "و لا ننسى حبايبنا اعز الناس حبايبنا<br />العندليب<br />يارب لكل جرح ساحل و انا جراحاتى بغير سواحل<br />كل المنافى لا تبدد وحشتى مادام منفاى الكبير بداخلى<br />نزار<br />كلماتنا فى الحب تقتل حبنا<br />ان الحروف تموت حين تقال<br />نزار<br />عام سعيد عام سعيد انى افضل ان نقول لبعضنا حب سعيد<br />سعاد الصباح<br />بالحق يا بشر<br />هبهوبتى<br />انا لحبيبى و حبييبى الى<br />جاره القمر فيروز<br />love is a very big question mark<br />للاسف شاكيرا<br />كأنه مصطفى اللى قابلته سنه 67<br />كأن كل كلمه بتخرج منه بتدخل لقلبى لعروقى<br />اثار الحكيم فى المسلسل الاذاعى فين عيونك يا نوال<br />مهما اتغيرت الثوابت متتغيرش الله الوطن القيم<br />نور الشريف نفس المسلسل<br />لماذا نحب لماذا نحس لماذا نعيش بلا طائله<br />ميخائيل نعيمه<br />و مين نكون ان بعنا يومنا و ماضينا<br />و ليه نعيش اذاكانش بكره يراضينا<br />و ازاى ننام من غير ما نحلم ببكره<br />و بكره دا منين ييجى الا بايدينا<br />المال و البنون(بصبح يا اكرم او بمسى)<br />الحب رغم قسوته هو الاحلى<br />و الصداقه رغم ندرتها هى الاغلى<br />العبد لله(انا اه)الشمس طالعه ف كل يوم<br />هو كده طبع الحياه<br />عمرو دياب<br />الحياه اكله نحط فيها اللى يعجبنا و نشيل منها اللى مش عايزينه<br />اغلى بشر<br />قلوب قلوب خاليه لافيها خير و لا شر<br />و قلوب كتير غاويه تجرح كتير و تضر<br />و ابو الجليب صافى<br />دافى و لسانه مر<br />الكنج منير"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021833/http://masr.20at.com:80/article.php?sid=43&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 6
subject = "و لسه و لسه"
author = "نيفين..نيفى ..نوفا"
posted = "2006-03-26"
text = "الحب بئر نشرب منها كثيرا و لا نقع فيها الا مره واحده<br />مصطفى امين<br />ايه يا نيفين<br />عبد الله مفتاح<br />محدش بيموت م الحب و محدش بيهون عليه نفسه<br />صديقه<br />احببتها و ظننت ان بقلبها نبضا كقلبى لا تقيده الضلوع<br />احببتها فاذا بها سراب خادع ظمأو جوع<br />كامل الشناوى<br />u say the best when u say nothing at all<br />poy zone<br />بدون المرأه انت وحيد و بها<br />انت اكثر وحده<br />انيس منصور<br />قليل من العقل يحمى القلب احيانا<br />عبد الحميد جوده السحار<br />يا رب طلعنا من الدنيا دى على خير<br />عمرو خالد<br />اه يا بلد<br />مصرى<br />الحرقه و الفرقه و الغرقه<br />الزمبه ف البمبه الذريه<br />فبدال ما نطق يا وله لا نضحك<br />و الضحك دا مزيكا كهربا على ميكانيكا اضحك ع الشيكا بيكا<br />السندريللا<br />كم من زهره عوقبت<br />لم تدر يوما ذنبها<br />ابراهيم ناجى<br />ان الله جميل يحب الجمال<br />رسول الله (ص)<br />تحاببنا<br />و نحب<br />و سوف نحب<br />شاهد قبر لزوجين بريطانيين<br />وخدالى باللك يا هبهوب"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021833/http://masr.20at.com:80/article.php?sid=43&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 7
subject = "حلوه يا بت يا نوفا"
author = "هوووووبه او هبهوب"
posted = "2006-03-26"
text = "الموضوع الاصلي فتح كل اتوتوجرافات العالم<br />فضفضه<br />المهم يا ختي ايه بقي , لديد بتاعك ده<br />واخر حته دي مخصوص عملتلها مدكرات بس غيره صالحه للنشر , غير للبنات \" نبوه خالتو اتحققت بس للعكس \"<br />هعملها بلج مخصوص واقولك عليه انت والبت سويت<br />عشان ناخد راحتنا<br />كتبت جزين وباقي السلسه في طريقها<br />ملاحطه انا كتبت الحته دي هنا عشان لا عارفه اتلم عليكي ولاعلي سويت<br />منفضني انتو الاتنين \" اي يا منخيري ايه التراب دا \"<br />يلا سلام يا بشر ."
archived = "2006-05-25"
