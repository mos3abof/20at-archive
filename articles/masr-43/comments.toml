text = "\" الدين يسر طحن برده \", \" اتشي \"<br />كرمله , كرملنيو , اكرم<br />\" كلنا هذا الشخص المبعد \" ,\" خلي ايامك حب في حب \"<br />نفونتي .<br />\" اللي يجي بالساهل بيروح بالساهل \"<br />جده سويت .<br />\" مش رايحه الحفله \"<br />سويتي.<br />\" متغربين احنا \"<br />ابراهيم ........<br />\" البلوج بتاعك ايه عشان ببقي غبيه \"<br />هبه في لحظه سطل.<br />\" اه يا بلد \"<br />مصر كلها .<br />\" ابعدي عني دوقتي , يا خبر لسه في حد بالطيبه دي , هاتي بوسه , منك لله \"<br />هند اختي باختلاف الزمان والمكان .<br />\" وحشاني \"<br />بطه<br />\" بالحق , يا بشر \"<br />هبهوب"
