[[comments]]
order = 11
subject = "كلام .... والسلام"
author = "واحد تاني"
posted = "2006-03-30"
text = "- انا هقول كلمتين ومش عايز لماضة<br />الضيف احمد<br />- انني لا اوافقك على كلمة مما تقول, لكنني سادافع حتى اخر قطرة من دمي عن حقك في ان تقوله<br />فولتير<br />- ( مش معقول )..( مش معقول )..( مش معقول )<br />رئيس دولة ... لحظة اغتياله<br />- الشعب .... الشعب يا جمال الشعب<br />- متخافش يابابا دا شعب ياكل الزلط<br />- الزلط.... الزلط ياجمال الزلط ... علاء لازم ياخد توكيل الزلط<br />رئيس دولة ... لحظة هروب الروح منه<br />- الى احمد ابراهيم القاطن بدير النحاس(هى فين دى؟)... لا تاكل الدجاج الذى طلبته (Delivery) , الدجاج فيه (سومون) قاتل<br />حكمدار العاصمة<br />- خد( أووتى) و( أووت) عيالي يا (عابهادي)<br />دياب – الارض<br />- عشان كنا رجاااااله ..... ووجفنا وجفة رجاله<br />محمد ابوسويلم - نفس الارض<br />- كل واحد ياخد بالو من لغاليغو .... لغاليغو !!! جبتيها منين لغاليغو دى ؟<br />واحد من المشاغبين – فى مدرستهم<br />- واحد مصاحب على علوكة وايمن كوخه ... عايزا يطلع ايه ؟ عضو مجلس شعب؟<br />المثل الاعلى لشباب مصريين كتير<br />- أنا شاب لكن عمري ألف عام<br />وحيد... لكن بين ضلوعي زحام<br />خايف ولكن خوفي مني أنا<br />أخرس ولكن قلبي مليان كلام<br />عجبي !!!!<br />واحد محترم – جاهين<br />- روتانا سينما: اوعى تغمض عينك لحسن (تتظرف على قفاك)<br />تخيل! واحد داخل بيتك وجوه تلفزيونك و جاي يقل ادبه عليك<br />- دي فرصة نديفة الصراحة<br />نفس البنى ادم<br />بنتولد, مش عارفين كما زرعة خضرا ف ارض طين<br />بنتولد, متلهفين على كتف اب وصدر ام مرتاحين<br />واسمنا ف درب الحياه بنى ادمين<br />واحد ملك- منير<br />- ليه يابن ادم حياتك .... تحياها غصب<br />قافل عينيك وبغماها ... عاصبها عصب<br />دا اللى خلق الالام ... جعل الدوا والطب<br />حقق ... ودقق , وسط الزحام هتلاقي مين يتحب<br />واحد تاني<br />Sometimes to see the light<br />اقرأ بقية التعليق .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021833/http://masr.20at.com:80/article.php?sid=43&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 12
subject = "wait for me"
author = "سنووايت"
posted = "2006-04-01"
text = "الحياة أبسط من كده بكتير<br />واحد صحبي متعرفهوش زعل أوي لما عرف اني قلت عليه صحبي -- صحيح ايه صحبي دي<br />وما الدنيا إلا مرسح كبير<br />قالها سمير غانم لما عمل نفسه يوسف بيك وهبي<br />تكلم انت في قلبي<br />محمد صبحي لما قالها للجمهور ضحك وبعد شوية حد قالها لأيمن نور وضحك عليه<br />الكباب الكباب لنخلي عيشتكو هباب اخت البترول البترول لنعيشلكو دايما في الدور<br />الاولى عادل امام والتانية ماما امريكا<br />ايها الشمس لا تغربي قبل ان تشهدي أن حبي لها خالد كخلودك<br />واحد مغفل مشفش خسوف الشمس<br />داحنا هنريحووووووووووووكي يا شابة<br />لا مش رايا وسكينة دي وزارة الزراعه المصرية وهيه بتستورد مواد مسرطنه من ميت سنة<br />كل مرة اشوفك فيها يبقى نفسي أه أه أه<br />ايوه هوه قالها قبل ما يتحبس<br />عايزه الايدين تعلي وايدين لفوق تصلي وعيون صاحية تخلي بالها من ارضها<br />هوه هوه برضه قبل ما نعرف انه هربان من التجنيد<br />انتي بتقبضي كام؟<br />اخر عريس اتقدم لي<br />السطووووووور تحت بعديها والنبي يا اختى كنت فاكرها سنبوكسات<br />سنية وعرفه الشواف<br />على فكرة يا عم واحد تاني دير النحاس دي سالت لك عليها طلعت في السيدة زينب وطبعا مش مشكله انك ما تعرفش هيه فين<br />لكن الكارثة انك تغلط في قول ماثور من بتاع اللمبي باشا<br />تصحيح الجمله على علوكه واشرف كوخه مش ايمن وشتان بين ايمن واشرف وكل سنة وانت تيبيين وصبح صبح يا عم الحج"
