subject = "اللي يجي ع الولايه ميكبش"
author = "كرميلينو"
posted = "2006-03-22"
text = "1- اغسل يديك قبل الاكل و بعده<br />2- لا تشرب الويسكي بدون ثلج<br />من نصايح المدرب للاعبي المنخب قبل كأس العالم ( من كتاب صور مقلوبه لاحمد رجب )<br />3- ايه معن دنيتنا و غاية حياتنا<br />اذا بعنا فطرتنا البريئة الرقيقة<br />و ازاي نبص لروحنا جوا مرايتنا<br />اذا احنا عشنا هربانين م الحقيقي<br />سيد حجاب<br />4- و لو ان كل كلب عوا القمته حجرا<br />لكان مثقال كل حجر بدينار<br />راجل بيفهم بجد<br />5- القطنه مبتكدبش<br />مدام نظيفه"
