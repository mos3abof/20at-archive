posted = "2006-05-14"
text = "بسم الله الرحمن الرحيم اهلا بكل الهواره والهماميه بالخصوص احسن ناس على مستوى الكره الارضيه تحيه خاصه لكل ابناء القبيله الهماميه فى مصر والصعيد وجميع الدول العربيه من الهوارى ابوشبيب يعنى اللدايده شرق غرب قبلى بحرى اى حد عنده تعليق انا جاهز للرد فى اى وقت ولاميل بتاعى matrix_matrix010"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021833/http://masr.20at.com:80/article.php?sid=43&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 15
subject = "هور يا بو الهواره"
author = "الهوارى ابو شبيب"
posted = "2006-05-14"
text = "هور يابو الهواره هيدى الدنيا واسرارها قلب الشاب بيركض ركض البنت بتمشى غنداره<br />من العمر عشقنا جمعه يوم الجمعه تلاقينا دقو القلبين بسرعه صار السبت وحبينا<br />لاحد عاضوء الشمعه قبال الروج تعشينا<br />تانين الساعه تسعه صوت الارزق جمعنا<br />تالاتا زورنا القلعه عدراج قلبك عدينا<br />رابعه روحه رجعا بشاطىء صيدا اتمشيتا<br />خاميس مسحنا الدمعه وما لحقنا اتهنينا لتمرئت ها الشمعه بسرعه معرفنا ليل من نهارا وهور يابو الهواره اهدى سلامى الى الهوارى البنانى عاصى الحلانى"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021833/http://masr.20at.com:80/article.php?sid=43&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 16
subject = "الابراج واسرارها"
author = "الهوارى ابو شبيب"
posted = "2006-05-14"
text = "فتحنا الابراج بمفتاح وشوفنا شو مخبا فيها<br />برج الحمل مابيرتاح الثور همومه ناسيها<br />جوزاء بيزرع نجاح السرطان بيجنيها<br />اسد فى عنده افراح للعذراء مخبيها<br />ميزان بيعلا بجناح عقرب زحف مقضيها<br />يحطو بايد القوص سلاح الجدى بيتساور فيها<br />الدلو بيجنى الارباح الحوت يوقع بخصاره"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021833/http://masr.20at.com:80/article.php?sid=43&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

