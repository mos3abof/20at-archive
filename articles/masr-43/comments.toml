author = "insert"
posted = "2006-03-20"
text = "رب الكيبورد و الماوس...<br />في جمل في النص حلوة أوي أوي ..<br />بس أنا حبيت أضيف أوتوجرافاتي الشخصية :<br />- نعيب زماننا والغلط راكبنا .. و لو نطق الزمان لنا شتمنا!<br />- © بعض حقوق النشر و الغسيل و المشابك محفوظة و متنشفة! ©<br />© 2060 ©<br />- مصر التي في خاطري و في بقي .. أحبها من كل روحي و اللي بيجري في عرقي!<br />دي كانت أوتوجرافاتي ، اوتوجرافات صاحبي بقى :<br />- غراء فرعاء مصقول عوارضها .. تمشي الهوينى كما تمشي نانسي عجرم<br />- لا تنه عن خلق و تأت مثله .. عار عليك إذا فعلت جامد أوي<br />مش فاكر حاجة تاني دلوقتي .. بس أول ما هأفتكر هأجيب على طول"
archived = "2006-05-25"
