[[comments]]
order = 2
subject = "حبة حلوين قوي"
author = "Dabdoob"
posted = "2006-03-21"
text = "الموضوع عاجبني قوي عشان كده هاضيف حبة<br />انت عارف انت بتكلم مين<br />اي حد بيتخانق<br />أيوه وجني (جنيه يعني)<br />اي مسلسل بيتكلم عن اسكندرية<br />الناس بقت وحشة والاخ بيحارب اخوه<br />كل الناس بتقول كده<br />علي العموم السمك بيعرف يعوم<br />اكرم وكل اسماؤه اللي هارينا بيها<br />انت يساري وبعيد عن الدين<br />عبد الله مفتاح<br />انت اكيد يساري<br />عبد الله مفتاح<br />صدقني اليساريين ملوا دماغك<br />برضه عبد الله مفتاح<br />الاسلام ديمقراطي<br />الديمقراطيين<br />الاسلام اشتراكي<br />الاشتراكيين<br />الاسلام راسمالي<br />الراسماليين<br />الاسلام مش كده خالص<br />ال(مش كده خالصين)<br />يا نينة<br />عماد حمدي<br />مفيش فايده<br />سعد زغلول<br />فعلا مفيش فايده<br />انا Dabdoob<br />ونرجو ان تكونوا قد استمتعتم<br />وسلام<br />Dabdoob"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021833/http://masr.20at.com:80/article.php?sid=43&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
