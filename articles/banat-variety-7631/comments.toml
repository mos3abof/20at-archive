[[comments]]
order = 6
subject = ""
posted = "2007-12-24"
text = "المهم يا جماعة عدم إطلاق الأحكام المطلقة على فترة الخطوبة لآنى والله قلقت فعلا فالمفروض أن يتفهم كل طرف طيعة المرحلة التى يمر بها لإجتيازها بنجاح فالخطوبة فترة جميلة لا تخلو من المسئولية فى إعداد منزل جميل وبسيط وتحقيق تفاهم بنسبة معينة بين العائلتين مش بالضرورة توافق كامل وكبير وكمان مش لازم البنت أو الولد تقارن أوى بين فترة الحب الرومانسية الخاصة قبل الخطوبة وبعدها وكما مش تبص مرة واحد أو هو كمان للطرف التانى وكأنه أول مرة يشوفه ويعرفوا ولازم يدعوا ربنا دايما أنه يوفقهم ويتمم فرحتهم وقرآنهم على خير وربنا يوفق كل المخطوبين واللى لسه بسرعة يتخطبوا ويسعدهم بالزواج يارب."
archived = "2009-04-26"
capture_url = "https://web.archive.org/web/20090426171733/http://www.20at.com:80/7ayatna/7631.html"

