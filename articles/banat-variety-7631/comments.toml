text = "والله الموضوع فعلا واقعي ودة هو الحال مع اغلب الناس<br />ودية حاجة غريبة كل يومين الولد ولا البنت يخطوبوا ويفسخوا الحمد لله انى لحقت نفسي واتجوزت."
