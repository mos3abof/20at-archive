text = "يااااة علي الخطوبة فعلا في ظاهرة غريبة اوووي دلوقتى ان الناس بيكون عندها ممل وفتور بس الواحد منا بيقول بكرة الوضع يبق تمام ويصبر نفسة علي اية معرفش"
