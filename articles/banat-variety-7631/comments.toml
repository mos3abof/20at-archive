posted = "2007-11-29"
text = "الحاجات دى فى الاول وفى الاخر نصيب يعنى مش قاعده ان كل المخطوبين مش مرتاحين<br />وعلى فكره انا مخطوبه بقالى سنه لواحد كنت بحبه من قبل الخطوبه بسنه وعايزه اقولكو ان انا بحبه دلوقتى ومبسوطه اكتر من الاول الف مره<br />وياريت بس طلب كل الى يقرا كلامى يدعلنا ربنا يجمعنا على خير ويعجلنا بالفرح"
archived = "2009-04-26"
capture_url = "https://web.archive.org/web/20090426171733/http://www.20at.com:80/7ayatna/7631.html"

