text = "انا مخطوبة من خمس شهور بعد قصة حب سنتين واتحدينا ناس كتير ومشاكل كتير عشان نكمل واتخطبنا من اول يوم اتكلموا فيه وقبل حتى حفلة الخطوبة وانا فى جحيم نكد ومشاكل اكتشفت انى بتعامل مع انسان غير اللى كنت بتعامل معاه الاول تماما اختلاف تام حاسة انى مبقتش بحبه انا بحب الشخص الاولانى اللى كان بيعاملنى كويس وبيحبنى وبيخاف عليا لكن ده لا ومش عارفة اعمل ايه"
