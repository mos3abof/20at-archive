author = "sara"
posted = "2009-12-20"
text = "والله صح جدا انا كنت بحب واحد ايام الجامعه واول ما اتخرج اتخطبنا بجد اتغير تماما بقى شغال انتى فيكى عيوب لحد ما كرهنى ف نفسى وبجد انا بقيت عصبيه اوى وحاسه انى بقيت اوحش ف شخصيتى بس المشكله انه كان يعرف بنت قبلى لمده شهرين ومرتاحوش وسابها وعرفنى المهم البنت دى لسه بتبعتله انها بتحبه وانها مستنيه اليوم اللى تتفركش فيه خطوبتنا ويرجعوا لبعض انا بكرهها جدا وهى عنده ع النت وكل ما اقله يمسحها ميرضاش لحد ما قلتله انه لسه بيحبها عند معايا وقالى هكلمها انا عاةواه يعرف انه لو عمل كده انا هفركش الدنيا لاى مستحملش الخيانه نفسى حد ينصحنى"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123075602/http://www.20at.com:80/banat/variety/7631-2009-11-04-14-39-16.html"

