text = "انا مع الحرية و التعبير عن الراى و تقبل الراى الاخر لكن الحرية مش معناها ابدا التطاول على ربنا و الاديان السماوية ايه الحرية فى كدا!!!!! انا ساعات بادخل على مدونات من دول والله الكلام يعف عن ذكره اللسان الواحد ما يقدرش يكمل سطرين قراءة فيها لانك ببساطة بتحس اتك بتاخذ الاثم معاهم و فى الاخرما بيقولوش حاجة جديدة او ذات قيمة. كل الافكار اللى الواحد عاوز يقولها يقدر يوصاها بدون التطاول على ربنا و الاديان مش هوا دا الابداع يعنى دا قررررررررررف"
