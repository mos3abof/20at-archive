text = "يادكتور الهنا طردوك من بص وطل ، طردوك من اسلام اون لاين بسبب فضايحك الجنسيه وعهر الشياب الي كنت عايش فيه دلوقتي جي موقعنا علشان تنصب شباكك على بنات العشرين ياكزنوفا ،، بجد حاجه تقرف ماتغور فاكر نفسك شاب في العشرين ، مش كفايه الوساخه والقرف الى كنت عامله في موقعك واصطياد الضحايا من خلال الاميلات وتحقيق مصالحك الشخصيه والهدايا والابتزاز انت مابتشبعش ، حتى الجامعه بتاعة الزقازيق حتتفصل منها يابتاع الفياجرا ، والله لو لقيتك لسه بتكتب هنا حابلغ عنك اصحاب الموقع علشان يخلصونا من شرك وقرفك"
