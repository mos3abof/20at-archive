text = "سبحانك ياربي .. اصبحت حماية الانظمه و تطور الدول تقوم على حجب المواقع ط<br />خلو الناس تتنفس وتتكلم بيكفي نوم وسكوت ,, وبعدين لما احمدي نجاد يقفل مدونه ولا اتنين لكم كاتب ما على رايك يا أحمد صاروا يكتبوا بالانجليزي …<br />على كل حال لم يعد الوضع كما هو عليه .. لان الشعوب اصبحت مشحونه لاعلى درجة ومتخمه من انظمه الدكتاتوريه والقمع واخراس الافواه بالتخويف<br />ختاماً التكنولوجيا خيراً للشعوب المحبه للحريه وشراً للحكومات قامعة الحريه<br />بيقولوا: رب ضارة نافعه .. خليهم هما و بعض دول الخليج يشبعوا حجب مواقع واحنا نتشبع غيظ ونحقن انفسنا لانفجار بات قريبا<br />جدا<br />جدا<br />تحياتي .. والموضوع مثير للاهتمام<br />لينا<br />sleepingangel_w l<br />hotmail.com"
