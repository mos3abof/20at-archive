text = "ليس من الحرية في شيء التطاول على الذات الإلهية بحجة المعارضة السياسية لنظام ما<br />إن الذين يفعلون إنما يكشفون عن وجوههم البغيضة المنافقة فحقدهم على الإسلام لا على نظام حكم<br />لقد دافع جابر عصفور وكيل الوزارة حينها عن الكاتب المغمر الذي أراد أن يشتهر فتطاول على الذات الإلهية وعلى<br />محمد رسول الله صلى الله عليه وسلم دافع عنه بحجة أن الكتاب أدب محض وإبداع وخيال ، فلما قيل له مارأيك<br />أن تكتب رواية وتجعل فيها شخصية خيالية تدعى حسني مبارك بغيضة وتصب عليها سخريتك ؟<br />ألن تحال على محكمة أمن الدولة أو محكمة عسكرية وجم وحار جوابا …"
