text = "\"\"\"\" في يناير عام 2005 تم الحكم بالسجن على المدون والصحفي الإيراني \"اريش سيجارتشي\" بأربعة عشر عاما لإدانته بجرائم معاداة الدولة الإيرانية وسب الخميني، وتم إطلاق سراحه في 17 مارس 2005 \"\"\"\"\"<br />شهرين كتييييييير دا إيه النضام الدكتاتوري ده … و إيه يعني لما واحد يسب واحد ,,,,, عادي …<br />'\"\"\"\" والذي تم سجنه مرتين من نوفمبر 2004 إلى يناير 2005، ثم إلقاء القبض عليه مرة أخرى في فبراير2005، وذلك عندما عجز عن دفع الكفالة، \"\"\"\"<br />كتيير برده …<br />كانوا لازم يدفعولوا الكفالة كمان"
