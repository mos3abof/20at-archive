posted = "2006-06-28"
text = "السيد عمر المحترم<br />شكرا على ردك الراقى اما عن تاريخ وتراث الأقباط فى مصر فالسبب الرئيسى فى عدم معرفة السواد الأعظم من الشعب المصرى اى تفاصيل عنه يرجع الى حذف ذلك التاريخ من المناهج الدراسيه عن عمد ومحاولة طمس كل ما هو قبطى وكان مصر قبل الاحتلال العربى لم يكن لها وجود."
