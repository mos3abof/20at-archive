[[comments]]
order = 18
subject = "إشادة وتوضيح"
author = "واحدة قبطية من هنا"
posted = "2006-07-15"
text = "اولا احب اشيد يا جماعة بمستوى الحوار الراقي هنا ..<br />واجاوب على بعض النقاط ..<br />طبيعي ان المقال يكون فيه بعض الامور غير الدقيقة .. لان الفترة التي شهدت الخلاف بين الراحل المتنيح الاب متى المسكين وبين قداسة البابا شنودة لم تتضح بعد وتعود إلى التاريخ الحديث .. ولن تتضح كل الامور إلا بعد وفاة طرفيها كما عودنا التاريخ ألا يتضح ويظهر إلا بعد وفاة ابطاله ..<br />كما ان تاريخ الكنيسة القبطية المعاصر والقديم غائب تماما عن المصريين ولا احد يعرف من المسلمين أي شيء يذكر عن تاريخ واحدة من اقدم الكنائس ةاعرقها في العالم والتي كانت تحمل على كتفيها ولازالت حضارة عريقة .. ذلك التاريخ لمن لا يعرف مليء بالكنوز والتفاصيل التاريخية التي تحمل وجها آخر لمصر ..<br />وكان بالحري ان يدرس ذلك التاريخ في المدارس كما درسنا جميعنا التاريخ الاسلامي ليس في مصر وحدها وانما في كل الدول العربية!!!<br />أما بالنسبة للجدل الدائر بشأن مسألة الغزو او الفتح ..<br />المشكلة ان المصادر المتاحة للمصريين عامة في مصر مصادر غير محايدة بعد محاولات ابعاد المصادر المحايدة تماما .. ولكن طبقا للتعريف المنطقي فالجيوش التي تدخل بلدا ما ليست بلادها وتعين عليها حاكم يحكمهاوتطبق قوانينا لم تعرفها تلك البلاد فان هذا بحكم المنطق وبدون اي خلفيات تاريخية يسمى غزو ..<br />ولكن لاخوتنا في الوطن ولنا ,, دعونا يا جماعة نتفق .. لنلغي استخدام الكلمتين .. لا غزو ولا فتح .. دعونا نقول دخول وخلاص ..<br />دخول العرب مصر ..<br />ونلتفت لما هو أهم ..<br />اما بالنسبة لسؤال الاخ الذي تساءل عن سر عدم صلاة البابا على ابونا متى بعد وفاته .. فالسبب الحقيقي هو الحالة الصحية المتدهورة للبابا الذي كان وقتها في ألمانيا ثم أمريكا لاجراء عمليات جراحية."
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

