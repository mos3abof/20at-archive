text = "نرجو من الافراد احترام الالفاظ لان البابا شنوده مهتم بالكنيسه كما انه ايضا مهتم برهبنا والرهبان والدليل على ذلك نشر اديره فى كل العالم وانت تقول لايهتم باكنيسه عيب عليك اما بالنسبه لعلاقته با لاب متى المسكين اذا كنت مملواء بالمشحنات فانه ليس الا احتلاف فى الراي وليس ايه خلاف يخص الكنيسه"
