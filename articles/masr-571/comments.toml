subject = "mata"
author = "omar"
posted = "2006-06-27"
text = "ذنوبه انا كمسلم احترمت كل ما كتب واحترمت من ذكرمن اسماء سعت الي الله والله وحده سيحاسبهم علي قدر اعمالهم اما من يريد ان يحكم مع الله في قضيتهم او يوجه اليهم كلمات لاتليق بهم فهوشخص موتور ان لم نلقي له بالا ولم نرد علي يهزي به سيعرف انه سفيه اما عن الاخ القبطي الذى انت علي وشك معه فاقول له ان مسيحي الشر ق هوالافضل اخلاقا مقارنه بكل مسيحي العالم وان البابا شنوده اعماله تشهد له ويحتاج اي مدح والي الله مرجعنا جميعا مسلم متغرب من 16 عام"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200040/http://masr.20at.com:80/article.php?sid=571"

[[comments]]
