posted = "2006-06-27"
text = "أولا الخلاف بين البابا شنودة والراحل العظيمالأب متى خلاف فكرى ومنهجى وليس شخصى أو عقائدى.<br />ثانيا الخلاف تم استيعابه وحله بعد زيارة البابا لدير الأب متى عام 96<br />ثالثا التشكيك فى وطنية البابا وولائه لمصر غير منطقى بالمرة راجع موقفة من زيارة القباط للقدس وغيرة من المواقف المعروفه.<br />اخيرا كلمة للأخت صاحبة اول تعليق ليس من طبيعة الأقباط الرد باسائة أو سب على اى مقال مكتوب بلغة محترمة فصححى مفاهيمك<br />تحياتى للجميع"
