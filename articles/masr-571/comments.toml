text = "الرجاء من الاخوه المسيحيين ارسال اكبر قدر من المعلومات باسلوب بحثي حول هذا الموضوع انا كمسلم لااعرف الكثير عن التاريخ القبطي الذي هو جزء من تاريخ مصر واعتقدانه تقصير لااعرف لماذا نحن كمسلمين نريد ان نعرف وانتم كمسيحيين تحيطون الموضوع بهاله من القدسيه الانطواءيه لااعرف ولكن ما اعرفه عن التاريخ القبطي لايتعدي معلومات عامه"
