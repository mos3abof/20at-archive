[[comments]]
order = 20
subject = "ليس تاريخ مزور"
author = "أبو علي"
posted = "2006-07-22"
text = "يا جماعة في قاعدة علمية تقول البينة على من ادعى..منين ادعيتوا ان تاريخ العرب في مصر مزور؟ ايه الدليل على كده و ليه افترضتوا كده؟؟ و لو ده صحيح ممكن تقدمولنا التاريخ الحقيقي؟ بس مدعم بالمصادر التاريخية و ليس الملفقة, لان انا ممكن اوي ادعي ان الأقباط غزاة جاؤوا مع جيوش الرومان و فرضوا المسيحية علي المصريين و معظمهم أصوله رومانية و يونانية, و أدلل على كده بتمسك الأقباط حتى الان بالأسماء اليونانية و الرومانية مثل جورجيوس و باسيلي و غيره, أنا بس باوضح ان الاتهامات الجزافية سهلة أوي. عموما أريد توضيح بعض الحقا~ق:<br />1- المؤرخين العرب من أكثر الناس أمانة في نقل الوقا~ع التاريخية بأدق التفاصيل التي لم يعهدها المؤرخين قبلهم بشهادة وول ديورانت صاحب قصة الحضارة و الدليل على ذلك أنهم نقلوا كا الأحداث سواء الجيدة أو حتي المسيئة لتاريخ الاسلام مما صدر عن بعض الحكام الطغاة و مثال ذلك ذكرهم لفترة اضطهاد المسيحيين في عهد المعز لدين الله علي ما أعتقد, فلو أرادوا الكذب لما ذكروا ذلك<br />2- العرب و علي عكس ما تعتقدون هم الوحيدون الذين أرخوا للكنيسة القبطية و مثال ذلك رعاية الخليفة الفاطمي الحاكم لأحد القساوسة حتى يضع كتاب أسماه تاريخ البطاركة الأقباط و هو المرجع الوحيد لدى الكنيسة اليوم عن تاريخكم و قد نشر الأهرام مقتطفات منه منذ شهر تقريبا و يمكنكم الرجوع للدكتور يونان لبيبل رزق في ذلك<br />3- بالنسبة لتاريخ المسيحيين فهو جزأين, جزء يلي الفتح العربي و فيه صار الأقباط ضمن بقية الشعب المصري و قد لأرخ العرب لتاريخ مصر منذ تلك الفترة و الأقباط جزء من هذا التاريخ و أخبارهم وارده فيه. أما الفترة التي سبقت الفتح العربي فتأريخها مسؤولية الأقباط أنفسهم فلماذا يلام العرب علي عدم تدوينها و لم يكونوا قد جاؤوا أصلا؟<br />اقرأ بقية التعليق .."
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

[[comments]]
order = 21
subject = "أين الاضطهاد؟"
author = "أبو علي"
posted = "2006-07-22"
text = "الي الأخوة المسيحيين اللذين يتكلمون عن الاضطهاد:<br />1- نفهم أن لديكم تاريخ مكتوب عن فترة الاضطهاد الروماني و في سانت كاثرين رأيت غرفة للجماجم تقولون أنها لضحايا الاضطهاد الروماني, فأين ما يعادل ذلك من الاضطهاد العربي عندكم؟ و هل في تاريخكم محاكم تفنيش كالتي نصبت لعرب الأندلس من أجل اجبارهم علي المسيحية أو القتل؟<br />2- معظم كنائسكم اليوم مبنية في عهد الاسلام<br />3- هناك قصة شهيرة عن القبطي الذي ضربه عمرو بن العاص (والي مصر) لأن فرسه سبق فرس عمرو رضى الله عنه فسافر القبطي للمدينة يشكو لأمير المؤمنين عمر رضى الله عنه, فما كان منه الا أن ارسل في طلب عمرو و أمر القبطي أن يضربه قصاصا منه. و بصرف النظر عن الحكم فما أظن القبطي تحمل عناء السفر لمدة تزيد عن شهر ليصل للمدينة يشكو من مجرد ضربتين كرباج الا لأنه يثق بعدل المسلمين<br />4- ضريبة الجزية عند المسلمين هي مبلغ بسيط يدفعه غير المسلم نظير دفاع الدولة الاسلامية عنه و في المقابل ألغى العرب كل الضرائب التي كان الرومان فرضوها و كذلك ظل المسلمون يدفعون الزكاه و لم يأمروا المسيحيين بدفعها.<br />أخيرا فقد اختار مسلموا الأندلس الموت أو الفرار بالدين عن التنصر, و أنتم تقولون ان أجداجكم أسلموا لأن الجزية كانت كبيرة, بصراحة اللي يبيع دينه كي لا يدفع الضرائب يبقي مش مهتم ولا مقتنع بدينه أصلا.<br />لقد حكم المسلمون البلقان 500 سنة و مع ذلك لم يجبروا أحدا علي التحول للاسلام و ظل اليونان و الصرب و معظم البلغار نصارى, و كذلك حكم المسلمون أرمينيا و جورجيا حوالي 700 سنة و مازال كلهم نصاري, فلماذا نصارى مصر اللي هايوقاعو من قعر القفة و نضطهدهم؟ أنتم اخوتنا في الوطن و ديننا أعطاكم حرية الاختيار و الحساب على رب العالمين"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

