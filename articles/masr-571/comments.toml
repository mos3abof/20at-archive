text = "أعلم يا أبى أنك الأن فى مكان ليس فية حزن ولا أكتئاب وأعلم أن قدسك الأ تصلى من أجلك المسيئين إليك فقد كنت تفعل وأنت بالجسد فكم وكم وأنت بالروح فى الفردوس مع السيد المسيح . يا أبى هل يهتز الهرم من طفل أو شاب يظن أنة قادر أن يخدشة!فليسامح الرب كل من أساء اليك وخصوصاً بعد أنتقالكم إلى السماء منتصراً جاعلاً جميع أبنائك فخورين بك متمنين أن تنتهى حياتهم مثل قداستكم فحقا يا ابى كما قال الكتاب \"أنظروا الى نهابة سيرتهم وتمثلوا بهم\""
