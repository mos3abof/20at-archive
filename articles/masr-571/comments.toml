subject = "إلى الأخ مواطن قبطى"
author = "عربى"
posted = "2006-06-28"
text = "تتحدث عن رقى التعليقات و أدبها و عدم الإساءة, ثم تصف الفتح العربى بالاحتلال !!!<br />ادرك تماماً إننى لو حاورتك من هنا لبركة الصبح فلن تفهم الفارق بين الفتح و الغزو أو الاحتلال..خصوصاً إنه يكفى للغاية هرولة المصريين نحو ( الفاتحين ) المسملمين هرباً من بطش الحكم الطاغى الذى استبد بهم....<br />لكن على الأقل لا تنسى أن من تصفهم بالمحتلون هم أجدادنا....أى انهم هم نحن.!!<br />أى انك تسبنا نحن !!<br />هل فهمت الآن ؟!"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

