author = "واحد قبطى"
posted = "2006-11-06"
text = "كل من البابا كيرلس رجل الصلاة<br />والبابات شنودة رجل التعليم والفكر الواعىو<br />والاب متى المسكين الراهب المحب لكنيستة<br />كلا خدم كنيستة بما اعطاة اللة من حكمة وعلم فكلهم اولاد الكنيسة<br />المصرية المسلمة يجب ان تقرأى الانجيل حتى تفهمى مالا تعريفية عن محبة الله لنا<br />فمحبة الله لنا جعلتنا نحبكم دون النظر<br />لاعمالكم هل تعلمى اننا فى كل قداس نصلى<br />لكل العالم وانتم قبلهم<br />لا ان نطلب من اللة ان ييتم اطفالكم وان<br />يشرد نسائكم وغير ذللك مما نسمعة<br />وشكرا"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

[[comments]]
order = 37
subject = "تحيه للجهد المبذول للتعريف بالاب متي المسيكن"
author = "ايهاب رشدى شاب قبطى"
posted = "2006-11-20"
text = "فى البدايه احب ان اشكركم على الجهد المبذول للتعريف بالاب متى المسكين واسمحوا لى بمشاركه بسيطه الا وهى الاب متى المسكين قمه روحيه على مستوى كتباته اللاهوتيه مثل اوغسطين وجيروم وايضا قمه على مستوى كتبته العامه فهو اذا مفكر قبطى مصرى مهموم بمشاكل الكنسه والوطن فى ان واحد اما بخصوص الخلاف بينه وبين الباباشنوده لابد ان يعلم الجميع ان الخلاف هو مجرد خلاف فى تفسيربعض الامور اللاهوتيه ونحن كمسيحين يوحدعندنا مساحه كبيرهمن الحريه لمناقشه اللامور اللاهوتيه وذلك ما تم بين القمتين البابا شنوده الثالث والب متى المسكين وهذا باختصار شديد ولكم منى جزيل الشكر"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

