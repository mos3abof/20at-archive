[[comments]]
order = 31
subject = "الى الأخ ابو على"
author = "zzazzo"
posted = "2006-09-30"
text = "الأخ أبو على<br />تحيه طيبه و بعد<br />انا مقدر موقفك كمسلم ولديك الولاء الكافى لدينك الكريم واحترامك الفائق له واللذى قد يخفى عنك حقيقة تزوير التاريخ و أن الأقباط غير مضطهدين أو لم يضطهدوا من قبل.<br />فعليك ان تضع نفسك محلى انا كمسيحى مصرى<br />كيف تقول ان الأقباط غير مميزين عنصريا عن المسلمين و خصوصا فى مصر داخل الحرم الجامعى وداخخل الهيئات و المصالح الحكوميه و العسكريه<br />معاملة القساوسة المتعنته من قبل المسلمين فى مصر<br />المذابح من حين لآخر بدون وجه حق<br />الا تذكر يا اخى العزيز حداث الكشح<br />وتعتيم الدوله على الأحداث و كأن شيئا لم يكن ايضا احداث الأسكندريه<br />حين خرج ذلك المعتوه أو المجنون \" كما ادعت الدوله \" بسيوف متنقلا من كنيسة لأخرى قاصدا المسيحييين لأغتيالهم عامدا متعمدا<br />وارجو ان تعلم ان الذى اقوله اشياء ملموسه بل محفوره فى قلب كل قبطى و كالعاده قامت الدوله بالتعتيم على كل شيئ ولا حياة لمن ينادى<br />اكتفى بذلك لعدم تقليب المواجع واخيرا اشكرك على لباقتك و احترامك لدينك و للأخرين."
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

[[comments]]
order = 32
subject = "شهد شاهد من اهلها"
author = "JNAYNAN"
posted = "2006-10-02"
text = "يكفينى كتعقيب على معاملة الاقباط فى مصر الرد ببعض النقاط :1- ما قاله الكاتب الكبير د/ طارق حجى بان العرب بطبيعتهم لا يقبلون قبول الاخر 2- يذكر التاريخ المحايد ان القبطى كان يطلق عليه عضمة زرقة وذلك بسبب ان الحكام كانوا يامروا كل مسيحى بان يحمل صليب ثقيل جدا برقبته فصارت عظام الرقبة تزرق 3- بحثا عن قتل اللغة القبطية تم اصدار قرار بقطع السنة الاقباط والقائها فى النيل البقية كثيرة ولكن اكتفى بذلك وادعو كل مسلم لقراءة هذا القول للمسيح رب المجد \"مملكتى ليست من هذا العالم \" فلا تخافوا فنحن لانسعى يا سيدى كاتب هذا المقال للدولة او السلطة ولكننا نصلى من اجل الرؤساء خلال القداس الالهى"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

