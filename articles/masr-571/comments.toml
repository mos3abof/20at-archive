[[comments]]
order = 15
subject = "تزوير التاريخ"
author = "مواطن قبطى"
posted = "2006-06-29"
text = "السيد \"عربى\" المحترم<br />كما أعترفت بطمس التاريخ يجب ان تعترف ايضا بتزويرة نحن مغرمون بتغيير المسميات على هوانا لكى نغير من حقيقة الأحداث فعندما يصبح الانقلاب العسكرى \"ثورة\" والهزيمة العسكرية \"نكسة\"...الخ سهل جدا أن يصبح الغزو \"فتح\" لماذا تقبل ان يقال غزو الروم والفرس لمصر ولا تقبل غزو العرب أتمنى أن تعرف أنت الفرق بين الغزو و\"الفتح\" الكلمة التى ليس لها مدلول واضح.<br />هرولة الأقباط للمحتل العربى أحد الخرافات التاريخية الشهيرة اقرأ التاريخ من مصادر محايدة ومتعددة وليس من المصادر الاسلاميه فقط لأنها مليئة بالمغالطات الفادحة.<br />أما بخصوص اصرارك على أن العرب هم أجدادك فما هو مصدرة ان كنت مصرى فمن أدراك ان اصولك منذ 1400 عاما لم تكن قبطية وأن اجدادك أجبرو على الأسلام عجزا عن دفع الجزيه أوخوفا من القتل سؤال لا انتظر اجابة عنه ولكن فقط للتفكير.<br />تحياتى الخالصة يا\"عربى\""
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

[[comments]]
order = 16
subject = "الى مواطن قبطى"
author = "زنوبه"
posted = "2006-06-29"
text = "هناك قاعده إسلاميه تقول (لا إكراه فى الدين) ( ومن شاء آن يؤمن فاليؤمن)(كل نفس بما كسبت رهينه) وبناء عليه فإن مبداء الاكراه غير وارد آسلاميا فى آى عصر والى آن يرث الله الارض ومن عليها بآذنه تعالى<br />آما عن الجذور التاريخيه للمسلمين فى مصر فنحن مزيج من إختلاط العرب بالمسيحيين والافارقهوالاوروبيين آيضا والاجناس فى كل بقاع الارض الان آصبحت مختلطه وليس فى مصر فقط!!!ولا تنسى الطبيعه الجغرافيه لمصر التى جعلت شعبها خليط من آجناس مختلفه, تجد ذلك واضحا فى آختلاف ملامح الوجه المصرى من الاسمر الافريقى الى الاشقر الاوروبى!!! آما عن موضوع الغزو والاكراه مره آخرى فلم يقم المسلمون آبدا بتعليق المسيحيين على صلبان وتعذيبهم مثلما فعل الرومان ولم يحدث حتى آى ممارسات قمعيه لآى من آهل الكتاب ـ آذكرك آن الطبيب الخاص للناصر صلاح الدين الايوبى كان كتابيا يهوديا<br />والرسول عليه السلام آقر فى الحديث الشريف (من آذى ذميا فقد آذانى) ولا يجرؤ آى منا<br />على آذية رسول الله ـ حاشا لله<br />آما ما يحدث الان فى مصر من بدايات لغرز بذور الفتنه فهو إتباع الحكومه لمبداء فرق تسد ولآمداد قانون الطوارىء بدليل آننا متعايشين معا منذ آكثر من 1400 عام وما يحدث على الساحه الان من بذور الفتنه عمره من عمر النظام الحالى<br />ولا حول ولا قوة الا بالله العلى العظيم"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

