posted = "2006-11-02"
text = "قل لى لماذا لم يستطع الهك العظيم ان يدافع عن نفسه عندما بصق عليه اليهود وضربه احدهم القلم على وجهه ثم قفاه ثم اقتاده كاخروف العيد وصلبه يا عينى الهك مسكين اشتغل يصرخ على الصليب الهى الهى لم تركتنى فينا المحبة النصرانية الكاذبة مما يحدث لاطفال العراق اين هى من قوا يسوع فى انجيل متى \"لاتحسبوا انى جئت بالسلام انما جئت بالسيف \" \"جئت لالقى النار على الارض وما اريد من ذلك الا اشتعالها\""
