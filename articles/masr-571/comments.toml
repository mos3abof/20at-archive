[[comments]]
order = 29
subject = "الحقيقه فين ( مذكرات الاب متى)"
author = "مواطن قبطى"
posted = "2006-09-03"
text = "ارسل هذا التعليق للاخت زنوبه يقول القرأن ياأيها الذين امنو لتجدن اشدالناس موده ورحمة ( بكم) الذين قالوا انانصارا وذلك لان منهم قسيسين ورهبانا (ولاخوفا عليهم ولاهم يحذنون) يعنى عارفين اولها واخرها واود ان اعرفك كلام القرأن كويس فى عكس هذه الايه حيث يقول القرأن فى موضع اخر فى سورة التوبه ياأيها الذين أمنو قاتلو الذين لايئمنون بالله وليوم الاخر ولايحرمون ماحرمه الله ورسوله ولايدينون بدين الحق من الذين أوتو الكتاب ( اليهود والنصارا) حتى يعطون الجزيه عن يدا وهم صاغرون (أزلاء) قولى لى ياخت زنوبه كيف تفهمى هذا الكلام هل يريد الله جذيه (اموال) بدلا من انسان يأتى اليه اوهل الله هذا اله ضعيف لايقدر ان يهلك الذين لايطيعونه فيرسل لهم المسلمون ليقاتلوه حتى يسمعوا الكلام وهل خلق الله امه المسلمون لكى يكونو بمثابة الات قتل وتعزيب لمن لايعرفون طريقه ولايؤمنون به اله ياخت ان اراد الله ان يذهق نفس فانه يذهقها لايحتاج الله القوى والمشهودله بالقوه فى قرأنكم فى الاسماء الحسنى الى انسان من خليقته حتى يتصرف فى امر يقدر الله فاعل كل المعجزات ان يفعله والا فكيف يكون اله وهو لايقدر على فعل شىء من اسهل مايمكن له وهو الله اذا اراد الله هلك مدينه فانه يبعث زلزال بسيط لمده بسيطه يميت باللاف فى لحظه واحده لايحتاج الله الى انسان ليحل محله ولايحتاج الى شىء لان ( الله ) يقول الكتاب المقدس ( هلك شعبى لعدم المعرفه ) بلسان الله نفسه ؛ ملحوظه (ينبغى التدقيق فى قرأة الكتب ) واستعمال نعمه كبيره اعطاها الله لكل انسان وهى (العقل) وربنا يديم الحوار الراقى والاستدلال بالمرجعيه من الكتب وليس الغوغاء . .؛"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

