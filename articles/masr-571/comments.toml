[[comments]]
order = 23
subject = "نغمة الاضطهاد..نغمة المتسولين"
author = "الأندلسى"
posted = "2006-07-29"
text = "أرى بعض الأصدقاء النصارى لا يروقهم أبدا أن يقولوا أنه بمجرد فتح المسلمين لمصر هرعوا إليهم لينقذوهم من ظلم بنى جلدتهم الرومان!!!<br />ـ بل ويشككوا فى مصادر التاريخ ويقولون أن مصادر العرب غير محايدة ...<br />ــ حسنا ما رأيكم أنى لن آتيكم بمصدر محايد ..سآتيكم بمصدر مسيحى قبطى أرثوذكسى يؤكد هذه الحقيقة...إنه<br />يوحنا النيقوسى حيث يقول<br />إن الله الذى يصون الحق لم يهمل العالم ..وحكم على الظالمين ولم يرحمهم لتجرئهم عليه وردهم إلى يد أبناء إسماعيل(العرب المسلمين) ثم نهض المسلمون وحازوا كل مدينة مصر....وكان هرقل حزينا ...وبسبب هزيمة الروم الذين كانوا فى مدينة مصر وبأمر الله الذى يأخذ أرواح حكامهم ...مرض هرقل ومات ...وكان عمرو بن العاص يقوى كل يوم فى عمله ويأخذ الضرائب التى حددها ولم يأخذ شيئا من مال الكنائس ولم يرتكب شيئا ما سلبا أو نهبا وحافظ على الكنائس طوال الأيام .<br />يوحنا النيقوسى:(تاريخ مصر ليوحنا النيقوسى) ص 201 ,220<br />ترجمة ودراسة: د/ عمر صابر عبدالجليل طبعة القاهرة سنة 2000 م .<br />ــ من الذى يكذب على التاريخ ومن الذى يزوره؟؟؟"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

[[comments]]
order = 24
subject = "غزواً .. أم فتحاً ؟!"
author = "مصري .. وفقط"
posted = "2006-08-03"
text = "يدور تساؤلاً في مداخلات الأصدقاء .. أنسمي دخول العرب مصر غزواً .. أم فتحاً؟! حتى قالت إحدى الفاضلات دعونا نسميه \"دخولاً\" وخلاص.<br />وفي رأيي أن الأشياء يجب أن تسمى بأسمائهاوإلا فنحن نكذب على أنفسنا وعلى أنفسنا نكذب.<br />فدخول العرب مصر هو \"غزو\" وفقاً لأي معايير شئت عزيزي القارئ .. حتى لو إفترضنا أن العرب أكرموا أهل البلاد من قبط وغيرهم ، فمثلاً من الثابت تاريخياً أن نابليون بونابرت قد أحسن إلى المصريين كثيراً بل وإمتدح الإسلام عندما غزا مصر في نهايات القرن الثامن عشر، فهل نسمي دخوله مصر فتحاً أم غزواً؟!<br />أما بخصوص تاريخ \"يوحنا النقيوسي\" الذي قدم لنا أحد الأصدقاء إقتباساَ مقطوع الأوصال منه فيقدم لنا صورة مختلفة تماما عما أراد صاحبنا أن يقوله عن مجازر ومحارق إرتكبها العرب الغزاة ضد القرى والمدن التي قاومتهم فيقول مثلاً \" ثم دخل المسلمون نقيوس واحتلوها ولم يجدوا أحد من المحاربين وكانوا يقتلزن كا من وجدوه في الطريق وفي الكنائس، رجالاً ونساءً وأطفالاً ولم يشفقوا على أحد وبعد الإستيلاء على المدينة ساروا إلى أماكن أخرى ونهبوها وقتلوا كل من وجدوا.... ولنصمت الآن فإنه لا يستطاع الحديث عن الإساءات التي عملها المسلمون حين استولوا على جزيرة نقيوس في يوم الأحد الثامن عشر من شهر جنبوت\"<br />هذه عينة بسيطة جداً مما ذكره يوحنا النقيوسي (الذي عاصر الغزو العربي لمصر) أما ما ذكره صديقنا الأندلسي فهو يعبر عن سياسة عمرو بن العاص مع الكنيسة بعد أن استتب له الأمر بخضوع مصر لسلطانه.<br />ويذكر لنا المؤرخون أيضاً كيف تم خطف الآلاف من الفتيات المصريات على أيدي الجيش العربي الغازي وكيف تم بيعهن كسبايا وجواري في قصور وخيام العرب في جزيرتهم وقد أرسل كبير القبط يطلب من عمر بن الخطاب يطالبه برد السبايا على أن يدفع ج<br />اقرأ بقية التعليق .."
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206224129/http://masr.20at.com:80/article.php?sid=571"

