subject = "أنبوبة حبنا"
author = "سنووايت"
posted = "2006-04-11"
text = "مش عارفه انا كل الحاجات القديمة دي بتحسسني بالانتماء انابييييييييييييب وجردل القهوجي الباعه الجائلين اللي ليهم نغم وصوت معين بحس معاهم بعطر زمن قديم عارفين الذكريات اللي ليها صوت<br />كان ليه واحد زميلي ساكن في الدور الارضي ودايما بيشتكي من صوت بياع الانابيب اللي بيعدي بالليل كل يوم الساعه 12 بالليل يزعجه الصوت ويفضل يخبط تحت شباكه وميعرفش ينام اخيرا قرر يناديه ياخد منه انبوبة يمكن يحل عنه ويروح يخبط في مكان تاني المفاجاه ان الولد قاله هروح بقى اجيب لك انبوبة اصل اللي معايا دي فاضية وراح ومرجعش من ساعتها 0"
archived = "2006-05-25"
