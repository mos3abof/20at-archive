[[comments]]
order = 0
subject = "سيادة المحافظ"
text = "بلا كلام فاضي بلا قلة حيا<br />مدن جامعية مختلطة<br />إخص الله يخيبكم موقع أبيح صحيح<br />فين الموضوعات الشريفة العفيفة بتاعت لا للاختلاط نعم للمخدرات ... أأأأ لا مؤاخذة قصدي نعم لإشارات المرور<br />إخص إخص إخص"
archived = "2004-06-22"
capture_url = "https://web.archive.org/web/20040622154901/http://www.20at.com:80/article.php?sid=238"

[[comments]]
order = 1
subject = "غاندي البلد .."
text = "هو الأخ سيادة الدكتور الوزير الدكتور الاستاذ المحافظ عايز إيه بالظبط ..<br />إزاي يا أفندي يا محترم تتريق على الاختلاط مش أحسن من الكبت اللي ناس فيه ..<br />تعرف أنت بتفكرني بمين .. فاكر يونس شلبي في فيلم مدافع نافارون لما كريك دوجلاس دخل عليه الخندق لقاه بياكل فول حراتي .. قال له هات واحدة .. رد يونس وهو بيطبطب عليه ويربت على كتفه قائلاً في أبوة طاغية: \"يا كريك يا ابني إللي مالهوش .. الحكومة أهله\" ..<br />بس ..<br />آه نسيت .. الموضوع جرئ شوية يا حاجة شيرين .."
archived = "2004-06-22"
capture_url = "https://web.archive.org/web/20040622154901/http://www.20at.com:80/article.php?sid=238"

[[comments]]
order = 2
subject = "سيادة المحافظ"
text = "يونس دوجلاس ايه وشيرين شلبي ايه ومجدي يونس ايه ونافرون حراتي ايه ومدافع الفول ايه<br />انت شخص تعبان وانا مش هقدر أرد عليك لأن زي ما قالوا أجددنا زماااان<br />على كوبري عباس ماشية وماشية الناس<br />امش امشي امشي<br />إخص إخص إخص"
archived = "2004-06-22"
capture_url = "https://web.archive.org/web/20040622154901/http://www.20at.com:80/article.php?sid=238"

[[comments]]
order = 3
subject = "غاندي البلد .."
text = "لا مؤاخذة في السؤال يا سيادة المحافظ:<br />هو الفنان القدير أحمد عبد العزيز في فيلمه الأخير Matrix الجزء التاني كان واخد دور إيه؟!..<br />أ.رصاصة.<br />ب. أفعى.<br />ج. ولاعة.<br />د.طفاية حريق<br />أرجو الإجابة سريعاً عشان الامتحان بكرة .. ولسه الورق بيتصور.. والواد فاروق لسه ما كتبش المحاضرات"
archived = "2004-06-22"
capture_url = "https://web.archive.org/web/20040622154901/http://www.20at.com:80/article.php?sid=238"

[[comments]]
order = 4
subject = "الموضوع جرئ"
text = "نعم الموضوع جرئ ولكن يجب مناقشته .. كما أرجو التركيز على دول أخرى بهااختلاط ودول لا اختلاط فيها .. ممكن لو تعملوا سلسلة عن حال الجامعات العربية<br />عبد الله - مصر"
archived = "2004-06-22"
capture_url = "https://web.archive.org/web/20040622154901/http://www.20at.com:80/article.php?sid=238"

[[comments]]
order = 5
subject = "موضوع يلخبط"
text = "الموضوع مش جرئ قد ما السؤال مهم جدا انت مع الاختلاط ام مع الفصل العنصري بين الجنسين .. ، وبصراحة الاختلاط بيطور شخصية الانسان جدا .. وطبعا احنا كلنا ضد العلاقات الجنسية بشكل إباحي .. لكن ما هو الحل .. بصراحة موضوع يلخبط"
archived = "2004-06-22"
capture_url = "https://web.archive.org/web/20040622154901/http://www.20at.com:80/article.php?sid=238"

[[comments]]
order = 6
subject = "رأي الاسلام هو الصواب"
text = "الاختلاط يطور شخصية الانسان من اية ناحية تقصد؟<br />رأيي أن الاختلاط يؤدي الى مزيد من الهيافة و التفاهة بين الشباب،وليس له فائدة تذكر<br />اذا اردنا الحل الحقيقي نرجع الى الاسلام.ورأي الاسلام واضح في هذا الشأن"
archived = "2004-06-22"
capture_url = "https://web.archive.org/web/20040622154901/http://www.20at.com:80/article.php?sid=238"
