[[comments]]
order = 2
subject = "لو كان سيفى معى ما احتجت للقلم ..يا ميت ندامه على الاخلاق و القيم"
author = "نيفين نيفى نوفا"
posted = "2006-08-10"
text = "كنت ناويه من نص الفيلم اقول ف التعليق ليه يضحكنى او يبكينى ما هو دا العادى من الشباب انهردا لكن فعلا كنت هبكى لما سمعت العباره الاخيره و هى ان الطفل العربى بيقرا 6 دقايق خارج منهجه الدراسى<br />و من فتره جه ف برنامج شبابيك اسئله دينيه للشباب من عينه ما هى اركان الاسلام و فرائض الوضوء و الشباب معرفوش يجاوبو<br />يعنى جهل سسياسسى و دينى و ثقافى و و و ووووووو<br />عارفين ليه ؟<br />لان هى منظومه والحده يا جماعه القسساد السياسسى يعقبه جهل يعقبه مرض يعقبه فقر<br />لما الفسساد يعم الجهل يعم و الذوق الفنى ينحدر و الانحدار الرياضى يكون نتيجه طبيعيه<br />يعنى نسسمع سعد الصغير و نقرا كتاب الف نكته و فريقنا القومى يدخل كاس العالم على 2090 ان شاء الله<br />و بيحضرنى هنا مقوله مصطفى بكرى<br />قيم تتفسخ<br />وطن تذروه الرياح<br />سفينه تتجه نحو الغرق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132143/http://www.20at.com/article2.php?sid=1132"

[[comments]]
order = 3
subject = "محمد حسان والتكفير"
author = "محمد حسان والتكفير"
posted = "2006-08-10"
text = "انهال العشرات من المصريين بالضرب علي امام مسجد في محافظه بورسعيد شمالي البلاد لانتقاده حزب الله لبنان .<br />وقالت صحيفه \"المصري اليوم\" المصريه اليوم ان امام المجمع الاسلامي الكبير في مدينه بورفواد بمحافظه بورسعيد ويدعي الشيخ محمد حسان فوجي‌ء بعد انتهاء خطبه الجمعه امس بعشرات المصلين ينهالون عليه ضربا وركلا حتي نزف الدم منه وانه لم ينقذه من بين ايدي المصلين الا رجال الامن.<br />واوضحت ان الشيخ حسان \"انتقد حزب الله مروجا لفتوي لرجل دين سعودي عن حرمانيه نصرته الامر الذي اثار المصلين الذين هددوه بالقتل ان عاد للمسجد مره اخري\".<br />واشارت الصحيفه الي ان هذه الواقعه هي الثانيه خلال اسبوع واحد التي تحدث في مصر التي يتمتع فيها حزب الله لبنان وزعيمه حسن نصر الله بشعبيه كبيره."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132143/http://www.20at.com/article2.php?sid=1132"

[[comments]]
