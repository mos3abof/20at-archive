subject = "حسبى الله و نعمة الوكيل"
author = "ايثار"
posted = "2006-09-19"
text = "اكيد ده هيبقى حال الامة الغربية طول ما الشباب بالمنظر ده.. ولا فن و لا سياية ولا جغلاافيا و اجابات كلها ثقة حتى الناس الكبار فى الفيلم.. اكيد يبكينى يضحكنى ده ايه.. و خصوصا احر عبارة.. 6 دقائق سنويا.. عالعموم من الخر مبروك يا نانسى عرفك كل الناس حتى الست المنقبة اللى تقول مش بهتم بالفن و تلاقيها مبتفتحش التلفزيون اصلا.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132143/http://www.20at.com/article2.php?sid=1132"
