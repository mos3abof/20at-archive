posted = "2007-11-13"
text = "النانو تكنولوجى اهم مجال بالنسبة لنا جميعا وانا سمعت ان فى جامعة يابانية سوف تنشأ فى مصر بالتعاون مع الحكومة اليابانية وهى متخصصة فى تعليم النانو تكنولوجى فما تفاصيل انشائها ومتى يتم بدء التعليم بها لانى اريد الالتحاق بها وللعلم لا سبيل للعرب للتخلص من الهيمنة الغربية الا بالعلم واهم افرعه الان النانو تكنولوجى"
archived = "2009-09-23"
