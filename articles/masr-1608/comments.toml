[[comments]]
order = 2
subject = "كوكو"
author = "كوكوكوكوك"
posted = "2007-02-18"
text = "قبْــلِ مــا ْ .. نبدأ كلامنــا<br />فــِ الـدِّيانــة وسيــن وجيــم ..<br />كلِّنــا ْ..لازم نسمِّي ..<br />بسم ِ أمريكا العظيم<br />كلِّنــا ْ .. لا ّزم نقـدِّم للإلّهــة ــ<br />تحــتِ رجليهــا القويــة ..<br />واحنــا بنبــوس ِ الأيــادي ــ<br />قربــان ولاء<br />كلِّنــا ْ .. لازم نطـاطــي وْ .. نتقي شرّ الإلهـــة<br />كلِّنــا ْ .. نسجـــد لهـــا<br />( غيَّــرْ قِبْلِتــك للغـــرب ..<br />واحمــد واشكــر<br />سبِّــح .. سبِّــح )<br />بسم ِ أمريكا العظيم<br />درسنـــا اليــوم عن مبــادئ ..<br />الديــانــة الأمـريكيـــة<br />الديــانــة الأمـريكيـــة هيَّ إنِّ الربــة تطلــب ..<br />واحنــا كـلِّ ما علينــا بدون تـردد نبتسم ..<br />ونقـول لهـا \" أمـر ِك مُطـــاع<br />مانتـــوا عارفيــن \" أمـريكيــة \" ..<br />كلمــة مشتقــة أسـاســاً من لغتنــا ..<br />هيَّ \" أمـــر ِك \"<br />الديــانــة الأمـريكيـــة هيَّ إنِّ الربــة تقتــل ..<br />واحنــا ندفــن<br />هيَّ إنِّ الربــة تبنــي نار نيرانها فــِ العــراق<br />هيَّ إنِّ الربــة جنــة للي يسجــد<br />انتهــى الدرس ِ يا ســادة ..<br />ممكــن آخد كــام ســؤال<br />أيـــوة قـــول<br />ــ هــوَّ ليــه أمريكــا ربِّ مـشْ إيـران ؟<br />ــ مش إيــران أو غيــر إيــران ..<br />هيَّ أمريكــا لْـوَحِـدْهــا تمتلــك مليــون صفـــة ..<br />تعلــو بيهــا عن إيــران أو غيــر إيــران<br />هيَّ أمـريكــا القويــة ..<br />هيَّ أمـريكــا القـديــرة ..<br />هيَّ أمـريكــا العليمـــة والخبيـــرة والكبيـــرة ..<br />هيَّ أمـريكــا اللي شــاءت أنْ يكـــون ..<br />لازم يكـــون<br />ــ ميـــن رســولهـــا ؟<br />ــ مـش رســول لأ دُول رســل ..<br />اقرأ بقية التعليق .."
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221031739/http://masr.20at.com:80/article.php?sid=1608"

[[comments]]
order = 3
subject = "؟؟؟ ؟؟ ؟"
author = "عم بطوط"
posted = "2007-02-18"
text = "العيب فى افكارنا الباليه العيب فى الاسم اللامع للدكتور فلان و الباشمهندس علان وفلان و علان قد يكونا عاطلين ولا عمل لهم ولا هم على مستوى يؤهلهم بالعمل فى تخصصهم انما هو الاسم عشان البطاقه و الكارنيه و الكارت والتفاخر فى الجلسات العائليه واما ييجوا يتجوزوا !!!<br />طبعا فى ناس لا يهمها كل هذا الكلام و تحاول ان تجتهد فى اى مجال وضعتهم الظروف فيه و لكن برضه ولم لا يدرس الانسان ما يحب ؟؟؟"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221031739/http://masr.20at.com:80/article.php?sid=1608"

