subject = "اية معنى الصورة اللى فوق دى"
author = "مش عارف"
posted = "2007-02-18"
text = "مش عارف اية الصلة او اللى يربط بين الصورة بتاعة الناس اللى فى القهوة دى وبيشيشوا وعلاقتها بالموضوع ومعتقدش ان دول شباب يعنى علشان اربط بينهم ولاانتى اتزنقتى فى صورة وحطيتى دى وخلاص ارجو زكر السبب"
archived = "2007-02-21"
