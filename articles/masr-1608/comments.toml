[[comments]]
order = 5
subject = "لما تتحرر مصر راح تحتاج لكل إيد عشان التنمية الحقيقية"
author = "إبن بهيه"
posted = "2007-02-19"
text = "موضوع جميل يا ولاد البلد<br />شكرا يا رشا<br />العمل مهما كان لا يمكن أن يعيب صاحبه إلا إذا كان غير شريف فقط والشرف معروف للجميع ومش محتاج أي توضيح<br />يعني عمي علي اللي ماسك في إيده مقشه ورايح جاي ينضف في الشارع من النجمه وبيقبض في آخر الشهر كام جنيه يسد بهم بعض رمق أبناءه هو عندي وعند كل شريف في الكون أطهر وأعظم وأكرم من رئيس جمهورية حرامي مثلا<br />ده حتى عند ربنا كده برضه عم علي أفضل من رئيس لجنة وكوسات نصاب ورئيس منثر وحرامي ولا إيه؟<br />أما حكاية العمل في التخصص والكلام ده فهذه رفاهية لا تتوفر لأمثال ولاد بلدنا الغلابه اللي مبتليين بعصابات حاكمه البلد بأوامر أسيادها الصهاينه .. ممكن نفكر في الرفاهية دي لما ربنا يخلصنا من مبارك الواطي وعصاباته وتتحرر مصر من السيطره الصهيوأمريكية بقوادة عميلهم مبارك الواطي<br />ساعتها بقى نبقى عايشين في بلدنا بجد وندور على التخصص اللي راح يكون مطلوب للتنمية والتقدم والرخاء الحقيقي مش رخاء الألبندا والحركات والنصب بتاعهم يف الجرايد الصفرا الحكومية داهيه فيهم وفي صحفهم<br />شكرا مرة أخرى على الموضوع<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221031739/http://masr.20at.com:80/article.php?sid=1608"
