author = "ليه الشعب المصري أناني وطماع"
posted = "2006-05-30"
text = "الفيديو كليب مولع نار<br />** الاهلي اخذ الدوري<br />** ابراهيم سعيد رجع التدريب<br />** صفقات بالملايين للعيبة الكورة<br />** الحمد لله تم حمايةمسئولين عبارات السلام اللي كانوا ح يروحوا ف داهية بسبب شوية مسافرين<br />** تم الافراج عن تامر حسني<br />** هروب اباطرة رجال الأعمال بمليارات مصر<br />** القبض علي ام باتعة بتاعة الفجل علشان زادت التسعيرة قرش صاغ (حرامية بنت كلب)<br />** اخر اخبار الفنانين واللعيبة يتم نشرها<br />بذمتكم ياشباب عايزين ايه اكتر من كده قانون طوارئ لازم يكون موجود علشان الحكومة تحمينا من نفسنا مش رئيس الوزراء قال اننا شعب لايستحق الديمقراطية .. دكتور نظيف فلازم ينظف أدمغة الشعب المصري<br />** ايه يعني لما الشعب يتم اسرة فيها ايه<br />** فيها ايه لما تمنعنا امريكا من زراعة القمح ونزرع كنتالوب مكانه علشان مانقدرش نرفع راسنا ... فيها ايه<br />** فيها ايه لما الريس يحكمنا 25 سنة مش احنا برضه جمهورية ملكية الحكم فيها ابدي<br />** فيها ايه لما جمال يستلم مكان ابوة ... هو مش الوريث<br />** فيها ايه لما القضاء والشعب المصري يعجز عن سؤال الوزير يوسف والي عن قضية المبيدات المسرطنه طبعا احنا وصلنا 75 مليون لازم يموت النصف<br />** فيها ايه لماالحكومة تعجز عن ايجاد وظيفة شريفة وسكن مناسب وعيشة كريمة لمواطنيها ... مش مهم ده كله المهم انها بتحاول<br />مصر يامه يابهيه يا ام الطرحة وجلابية<br />الزمان شاب وإنتي شابه<br />هو رايح وانتي جايه<br />مصر فيكي حاجة محيراني<br />نزرع القمح ف سنين<br />تطلع الكوسة في ثواني<br />وعجبي"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

