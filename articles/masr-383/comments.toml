posted = "2006-05-28"
text = "عندما اسمع هذه الانتهاكات وبهذه الوحشية<br />ضد المواطينين الابرياء , اصاب بقرف شديد من حكومتنا النظيفية , فالمواطن الذي انتهكت اعراضه بهذه الوحشية ماذا يفعل بعد ان سحل في الارض وضرب ,اكيد انه سيحاول ان ياخذ حقه, ولا احد يلومه ساعتها اذا تحول الي قنبلة بشرية ارهابية<br />فانا لن الومه علي ذلك لان النظام بتعنا يستحق ذلك"
