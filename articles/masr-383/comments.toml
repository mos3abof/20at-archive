posted = "2006-05-28"
text = "على فكرة عمر البلد ماهتتعدل مادام فى شلة زى وحيد عصرة العامل انة عارف كل حاجة وهو مش عارف اى حاجة وبيهاجم اىحد ضد الحكومة وضد جمال لانة هبط على روز اليوسف من فوق وليس لانة عبقرى انة عبداللة كمال وهذا تومى امة جيرى هو كرم جبر يا ناس هل انتم ام الشرقاوى كل شعب مصر يعلم انكم كدابين ونحن نكرهكم ولا نحب ان نراكم فى اى مكان لانكم تلعبون لعبت التبشير للتوريث لذلك سقطت روز اليوسف بعد الكبار عال حمودة جاء الاقزام"
