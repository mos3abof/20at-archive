[[comments]]
order = 14
subject = "كسم مصر"
author = "هانيبال"
posted = "2006-05-28"
text = "على فكرة انا مش امن ولا حاجة .. واللي اقدر اقوله هو ان كلمة مصر دي كلمة سخيفة طعمها مر علقم وريحتها بقيت على ايد الفلاحين العبيدبتوع المنوفية والغربية وغيرهم من بلاد الدلتا اللعينة زي فسية الكلب .. انافعلا بقيت بكره الكلمة دي .. يا ساتر .. انا بقترح اننا نغير الكلمة دي ونختار اسم جديد من الفلكلور الشعبي زي فتحية مثلا او فوزية او تركية .. وممكن نسميها اسم على الموضة زي حبيبة مثلا او شهد .. وممكن كمان نختار اسم يناسب الهيمنة الامريكية على طيازنا زي كاترين او كريستينا .. المهم بلاش كلمة مصر دي .. انا فعلا كرهتها .. ياي سوفاج .. او سوهاج"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

[[comments]]
order = 15
subject = "كلنا عايزين حقنا"
author = "احمد امين"
posted = "2006-05-28"
text = "انا مواطن مصر مقهور مثل كل المصرين لكنى من طبقه متوسطه ومعايه شهاده متوسطه ومش عارف اقول انابحب مصر اد ايه مش عايز اقول شعارت بس فعلا مصر احسن بلد فى العالم بشبابها الى زى الشرقاوى والشاعر وغريهم كتير علشان كده فى امل ان احنا ناخد حقنا بس منغير منقف نتفرج انا اول مره بشترك فى مظاهره ضد النظام وغيرى كتير بس شايف ان النظام بيطبش مش عارف يعمل حاجه بطالب كل مصرى شريف ان يقف اما الفساد الى موجود فى مصر وميخفش لان ولو خاف مفيش حد حايخد حقه . الى الشرقاوىوكل المعتقلين بكافيه ميولهم السياسيه مصر لن تنساكو وستظلون رمز لكفاح مصر ضد الاستعمار المباركىصمدو حتى النهايه . مصر فى روحى ودمى لاللتمديد... لاللتوريث.....نعم لتعديل الدستور المصرى حسبى الله ونعم الوكيل واسف على ركاكه تعليقى"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

