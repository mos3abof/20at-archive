[[comments]]
order = 19
subject = "الف اه ياجدع لما الزمن بيخيب ....... والسبع يصبح اسير الكلب ولا الديب"
author = "فادي اسكندر"
posted = "2006-05-29"
text = "الف اه ياصاحبي ........ الف اه ياجدع لما الزمن بيخيب ....... والسبع يصبح اسير الكلب ولا الديب<br />اه ياصاحبي .. احساسي بالعجز رهيب . مش عارف اعمل ايه .... كنا سوا طول الوقت ..... كنت بتخاف علينا ....... كنت اخ واب وصديق وجدع .<br />حتي واحنا خارجين سوا من السجن في نفس الكلبش انت اللي كنت بتشجعني ..... ودلوقت مش عارف اشوفك حتي<br />اصمد ياصاحبي انت اجدع منهم كلهم ... انت ارجل من مجموعة الخصيان اللي عذبوك .... هما لو مش خصيان فعلا مكنوش عذبوك التعذيب البشع ده<br />متخفش ياصاحبي مش هانسيبك<br />مستنيك ياصاحبي عشان تقف جمبي في المظاهرة ونهتف سوا<br />مستنيك ياصاحبي عشان تمسك ايدي في المظاهرة وتقول يسقط يسقط حسني مبارك<br />مستنيك عشان تقول عمر السجن ماغير فكرة ... عمر القهر مااخر بكرة"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

