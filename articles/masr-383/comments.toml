subject = "كلنا عاوزين حقنا"
author = "لور دكاش"
posted = "2006-05-27"
text = "مش قادرة بجد أحبس دموعي ، ولا قهري ويأسي وإحباطي..<br />شرقاوي !! مكنتش أعرف والله ان شرقاوي هو اللي باع البلد وسرق فلوسها في جيبه، ولا ان هو اللي عمل من أهله شوية الحرامية نجوم مجتمع وأصحاب بلد، ولا انه هو اللي سايب أمريكا تنتهك في عرضه وعرضنا من سنين، ولا ان هو اللي باع قضية ومناضلي فلسطين، ولا ان هو اللي بيمص في دمنا بقاله 25 سنة، ولا ان هو اللي جاب للبد الوكسة المستعجلة.<br />لكن ما دام عرفت ان هو اللي عمل كل ده، يبقى يستاهل مش بس اللي حصل له، لكن يستاهل يتقطع 70 مليون حته، كل مصري ياخد منهم حته، مش علشان يحتفظ بذكراه، لكن علشان يتأكد انه غار في داهية..."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

