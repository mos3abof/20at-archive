[[comments]]
order = 7
subject = "محمد السيد ارجوك قول و متسكتش"
author = "نيفين..نيفى نوفا"
posted = "2006-05-28"
text = "ايه دا احنا فين<br />فى سجن ابو غريب و لا ف جوانتانامو<br />لا احنا كده اكيييييييييييييد مش ف مصر<br />و الله الحروف ما هى ظاهره ادامى من العياط<br />شباب مصر يتعمل كدا فيهم من شويه كلاب لا احنا كدا بنظلم الكلاب<br />ايه دا<br />امبارح ف القاهره اليومشفت اغنيه معموله للشهيد عبد الخالق نبيل اللى استشهد ف اشتباكات مع المتطرفين فى دهب و قلت كلمه محدش وافق عليها بس لازم اقولها دلوقتى<br />البلد دى معادتش تستاهل حد يموت علشانها<br />و اللى مش موافق يقوللى ازاى نعوض الشرقاوى و اللى معاه عن الانتهاكات البدنيه و النفسيه دى<br />حرااااااااااااااااااااام و الله العظيم حرام<br />لا شرع و لا دين و لا منطق<br />حسبى الله و نعم الوكيل"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

