[[comments]]
order = 23
subject = "العبيدو السيد"
author = "طلوع الفجر"
posted = "2006-05-31"
text = "سياتى يوم تشرق في الشمس بعد الفجرعلى هذا البلد ليكون يوم جديد وعصر جديد لهذا البلد يوم نتنفس فى الحرية ويسود العدل بين الناس ولكن يكون هناك فرق بين الشرقاوى والشاعروبين الحرامية الى متى نظل كا العبيدفى وطن لاغنياء كل شى مباح وللفقراء ممنوع نحنة نشعر باالحسرة والمرارة على هذا الوطن نحن نستنجد برب العالمين وبالرسول محمد الامين ص ان ينقذ هذا البلد من الظلم والقهر العين"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

[[comments]]
order = 24
subject = "مصر الشرقاوى"
author = "سندريللا"
posted = "2006-05-31"
text = "مش انت اللى اتهانت يا شرقاوى مصر كلها اتهانت اى واحد مننا كان ممكن يبقى مكانك هيجى اليوم يا شرقاوى وتاخد وناجد كلنا بطارنا من الكلاب<br />من هنا ورايح يا جماعه هيبقى شعارنا مصر الشرقاوى<br />تحيا مصر<br />يسقط حسنى وكلابه"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

[[comments]]
order = 25
subject = "لا لشرقاوى زمان!!عايزين شرقاوىينادينا بخلق الاسلام"
author = "emadpopa"
posted = "2006-05-31"
text = "بسم الله الرحمن الرحيم<br />طبعا كلنا زعلنين من اللى حصل لمحمد الشرقاوى وكريم الشاعر<br />لية؟<br />لان كل اللى حصل انهم اتخدوا باسلوب غير متحضر وغير لائق(ضرب واهانة ....) وكتير<br />مافيش حد يرضى بكدا بس حد يقولى الحكاية اللى كتبها من افعال مشينة تخدش الحياء وكثير من الالفاظ اللتى لاتستحسن القارىء فى شىء<br />سب وشتائم<br />انا عايز اعرف انت قابل ان كل مصر تعرف انك بتتشتم وكمان فرحان وبتردد اللى حصل خلى (دا صبر ياأخى) اية الفايدة لما نتعامل على اساس (الاساءة يقابلها الاساءة)<br />قال تعالى (إِنَّهُ مَن يَتَّقِ وَيِصْبِرْ فَإِنَّ اللّهَ لاَ يُضِيعُ أَجْرَ الْمُحْسِنِينَ)سورة يوسف<br />وقال تعالى ( وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجاً )سورة الطلاق<br />سؤال مهم انا لازم اتعاطف مع محمد ومحمد متحمس باثارة الشتائم<br />لا يامحمد اذا كان هذا منقول عنك وكان على لسانك وهذا هدفك<br />سمى فساد الطبع الذى قد يكون فى نيتك الخلاص منة (وفساد الطباع يُخْرِبُونَ بُيُوتَهُم بِأَيْدِيهِمْ )سورة الحشر<br />خلاصة يابن البلد حسن الخلق اللى مش لاقينة فى السلطة لازم يكون فينا"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

[[comments]]
order = 26
subject = "الاستاذ مش واخد باله"
author = "فادي"
posted = "2006-06-04"
text = "ياسلام بقي هي كل المشكلة انهم اتاخدوا باسلوب غير متحضر<br />هو حضرتك مش واخد بالك انهم اتاخدوا بدون ذنب اصلا... حضرتك مش واخد بالك انهم بيتحقق معاهم قدام جهة غير شرعية .. حضرتك مش واخد بالك انهم خدوا 15 يوم بدون تحقيق اصلا....... حضرتك مش واخد بالك اننا عايشين في ظل نظام غير شرعي اصلا ..<br />وبعد كل ده تيجي تكلمني عن عبارات بذيئة قالها الشرقاوي .<br />والله انا مش لاقي حاجة اقولهالك غير ...<br />- لله الامر من قبل ومن بعد<br />- اللهم لا تؤاخذنا بما فعل السفهاء منا"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

[[comments]]
order = 27
subject = "دلع ملوش معنى"
author = "ساخ"
posted = "2006-06-27"
text = "مش كل واحد يجيب صورة تعزيب نصدقة<br />احنا عاوزين مصر بلد الامن والامان<br />عشان نعيش فى خير وسلام<br />وحرام الى انتو بتعملوة فى البلد<br />الرجاء فك هذا التنظيم وكفاية الى عملتوة فى الشعب<br />كل حاجة كفاية<br />انتو مش عايزين تشتغلو حاجة كفاية<br />او عايزين الشهرة كفاية عليكم كدة"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

[[comments]]
order = 28
subject = "جرس التليفون"
author = "سامش"
posted = "2006-06-27"
text = "عفوا قد آتيت يوما ربما يخطا الانسان قبل المجىء<br />فانا قد بنيت الحق نورا وعرفت ان الشمس مصباح يضىء<br />فانا قد زرعت الشوك يوما بين احضان الورود يحتميها<br />فانا قد قتلت العمر سهوا عفوا لا تلمنى ان حين<br />قد رايت اشجار تموت تحت اقدام الجنود<br />قد عرفت اشياء كثيرة حين تولد الاطفال تحت اكوام الحجارة<br />قد اتانا زمان خوف حينما تغرب الشمس ثم يعاودها الحنين<br />هذا موضع يغرب فية النور تبلع الارض الاشجاريورث الجبن<br />عفوا قد اتيت يوما ربما ايقنت ان هذا موضع ترحالى<br />ساذهب من حيث تاتى قطرات الماء<br />تتراجع كل الاشياء المرئ%"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

[[comments]]
order = 29
subject = "قلوبنا معكم يا أبطال مصر"
author = "محمد ابو خالد"
posted = "2006-07-11"
text = "مصر انتفضت اخيراً وصرخت في وجه الظلم والطغيان، مصر دائماً هي فاتحة الثورات<br />استمروا يا ابطال مصر في الصمود والنضال<br />فإن تحررت مصر تحرر كل الوطن العربي<br />قلوبنا معكم<br />محمد ابو خالد<br />السعودية"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"
