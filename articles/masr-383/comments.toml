subject = "عايز وطنى"
author = "صا بر"
posted = "2006-05-28"
text = "اللة عليك يا شرقاوى انت وكريم الشاعر وعم كمال خليل وندا وابن النجمة محسنة توفيق وكل الابطال اللة معاكم وشعب مصر معاكم انت عايز حقك واحناء عايزين حقناء فى هذاء الوطن الذى يصرخ من شدت الظلم من القهر من السرقة من غلاء الاسعار لماذا نقهر ويسحل كل صاحب راى اوفكر اويطالب بالحرية هل هذا هو الفكر الجديد اذا كان هذا الفكر الجديد لاوالف لالالالالالاتعبناء الحرية لزعيم الغد الكتور ايمن نور والحرية للصديق كريم الشاعر والشرقاوى وعم كمال خليل وكل الابطال واللة معك ياشرقاوى وياعم ولا يهمك افتكر محمد ابو سويلم وافتكر ادهم الشرقاوى وان اللة مع الصابرين"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

