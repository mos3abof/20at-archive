[[comments]]
order = 3
subject = "نفسي أحكي لكم عن جوه وحكايات جوه لكن للأسف عندي امتحانات"
author = "محمد السيد"
posted = "2006-05-27"
text = "أقول لك إيه ؟؟؟<br />والله يا دعاء إحنا اتمسكنا في الخميس الأول 11/5 ولمااتأجلت المحاكمة للخميس اللي بعده 18/5 كنا كلنا لو طلعونا يوم الأربع بالليل . كناحنروح عشان نحضر المحاكمة ..<br />اللي جوه والله أحرار أكتر من اللي بره ..<br />اللي جوه مش هاممهم يعملوا أي حاجة ومستعدين لأي نتيجة ...<br />اللي جوه يا دعاء ... مش حاسين دلوقتي بأي خوف أو قلق ...<br />اللي جوه ... ولاد البلد بجد ... ولاد البلد دي ...<br />أنا لو أحكي لكم ...!!<br />اللي طلعوا يوم الخميس اللي فات ... كانوا زعلانين ازاي وهم بيسلموا علي اللي قاعدين ....<br />انا عايز أكتب لكم كل حاجة ... ولو ممكن أقابل أي حد أحكي له علي اللي جوه ...<br />أنا عايز أحكي عن سمير وإسلام والسيد وأشرف وناااااااااااس كتير إنتو متعرفوهاش.... لكن البلد دي حتحفظ لهم جميلهم ...<br />قضيت معاهم أحلي 15 يوم في حياتي ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043545/http://masr.20at.com:80/article.php?sid=383"

