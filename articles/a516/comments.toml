text = "للأستاذ \"أبويا\"<br />الحب مش معناه انك تقتنع بأفكاره أبدا لأن الإسلام أصلا بيحض على الاستقلال بالشخصية ولكن مش معنى الاستقلال انك بتكرهه .. حاول تقنعه بالحسنى و إذا لم يقتنع خلاص بس ما نتعاملش معاه وحش , ونفتكر كلنا موقف أول سفير في الإسلام \"مصعب بن عمير\" مع والدته لما هددته إنها تقتل نفسها لو ما سابش دين الإسلام فرد عليها وقالهاإنه بيحبها وبعدين لما أصرت قالها أصر على موقفه و لكن بأدب و بحب وفي الآخر اقتنعت برأيه وما خسرهاش ..."
