[[comments]]
order = 37
subject = "من اسلام اون لاين"
text = "ربما تضحكون من أبي المتعلم الجاهل الذي من فرط حرصه علينا \"من المعلومات التي لا يجب على الفتاة أن تعرفها\" كان يمنع الروايات والمجلات والقصص بكافة أشكالها؛ حتى إنني ذهبت إلى المكتبة معه ذات يوم فجذبتني مجلة ميكي واشتريتها فما كان منه إلا أن تأفف عند الكاشير.<br />وعندما عدنا إلى البيت ضربني علقة لن أنساها، ولم يمنعه في فورة غضبه أن يكسر رأسي لأنني عصيت أمره إلا أمي التي أرسلت له المجلة ليتصفحها، فلما هدأ قليلا تحدث عن أنه يحبنا ويريد الخير لنا؟! فدخلتُ غرفتي غير مقتنعة وأغلقت الباب وقضيت تلك الليلة أحتضن المجلات التي كرهها أبي دون سبب. وقد ظل يسألني فيما بعد عما استفدته من هذه المجلات فكنت أحضّر نفسي للإجابة المصطنعة"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018090227/http://www.20at.com:80/article.php?sid=516"

[[comments]]
order = 38
subject = "لو فكرنا شويه"
text = "ازاى اصلا فى حد يقدر يكره ابوه<br />هو اصلا ايه وابوه ايه هما فى الاصل حاجه واحده<br />يعنى هو الكل وانا جزء منه<br />ازاى اكره نفسى<br />لو فكرت فى كل الحاجات الى عملها علشانك وبيعملهاوهيفضل يعملهايبقى ازاى تكره<br />صحيح ممكن نختلف ممكن ميبقاش فهمك بس مهما عمل فهو قصده مصلحتك وبيعمل كده علشان خايف عليك<br />عارف ليه خايف عليك؟<br />ببساطه علشان انت عمره ايوه هو ضيع عمره فيك حياته بتدور حواليك<br />وصعب اوى اوى انه يشوف عمره بيضيع<br />عارفه ان كلامى ممكن بيقى غريب شويه<br />بس انا عايزة كل حد مش بيحب ابوه يفكر فيه لأعايزاه يحسه بقلبه وبكده عمرك ماهتقدر غير انك تحبه وتحبه اوى"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018090227/http://www.20at.com:80/article.php?sid=516"

