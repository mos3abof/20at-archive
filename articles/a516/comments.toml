subject = "فلسفة"
text = "فيه فكرتين بيحكموا العالم ... فكرة تقديس الأب ودي بتنتمي لها المجتمعات الأبوية واحنا كل المجتمعات الشرقية منها .. ودي بتتميز بالايمان بالله فالربط بين الأب والرب موجود فعلا في الثقافة الانسانية .. وتتميز أيضا بأنها مجتمعات محافظة وتقليدية وتزدهر فيها قيم الأسرة<br />المجتمعات الغربية أقرب لتطبيق نظرية فرويد القائلة بقتل الأب : لن تنجح إلا إذا قتلت أباك داخلك (معنويا بس) واستطعت تجاوزه وتحقيق ذاتك ... الغرب تجاوز الفكرة دي وادعى إنه قام بقتل الله (اعوذ بالله) أو أنه تجاهل وجوده وأسس للفكرة العلمانية .. ودي مجتمعات الحداثة وانت عارفها وعارف أمراضها كويس ...<br />لكن بصراحة مطلوب نحقق شئ منها هو سر النجاح : السماح للابن بتجاوز ما حققه الأب .. خطوة للأمام حتى ننجح ..."
archived = "2004-08-10"
capture_url = "https://web.archive.org/web/20040810133738/http://www.20at.com:80/article.php?sid=516"

