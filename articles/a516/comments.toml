text = "السلام عليكم و رحمة الله و بركاته<br />\" حب الأب من حب الرب \"<br />ياااااااااااااااه جملة مؤثرة جدا<br />من العبقري الذي قالها؟<br />بجد يا براء أنا حبيتك جدا<br />\" يعلن المتحدث الرسمي<br />باسم الحلف الالكتروني الفظيع<br />مصعب الخير<br />أنه يحب الكاتب المميز بعشرينات<br />البراء أشرف جابر\"<br />ترقبوا البيان التأسيسي للحلف الالكتروني الفظيع!!!"
