text = "ايه ياجدعان ارحمونا النفاق مش للدرجه د صاحبكم وماله ودي فيها ايه لكن الشغل وامانه النقد تلزمكم بالوضوعيه والحياديه ياهل النفاق تراجعوا عنساحه عشرينات المقدسه....................<br />وعلي الرغم من كده الموضوع حلو ياعم براء بس ياريت<br />كنت تغوص شويه في .................<br />بسم الله الرحمن الرحيم<br />أيها السادة مديري الموقع<br />أيها الجمهور الكريم<br />و أنتم يا أبناء جمهورية \" معلقين بلا حدود \"<br />إننا اليوم أمام ظاهرة \"غريبة\"<br />و إنني أطالب هيئة القضاء العليا<br />للمواقع والأحلاف الالكترونية<br />أن تتدخل لحل هذه القضية الـ\"غريبـ\"ـة<br />القضية باختصار ودون لف ودوران<br />أصل أنا راجل دوغري بخش في الكلام<br />من غير مقدمات طويلة زي مالناي التانية بتعمل<br />أصل ده حاجة وحشة<br />المهم :<br />نحن نطالب برفع قضية تعويض على<br />الأخ \" غريب \"<br />لأنه اتهمنا بالنفاق وشكرا ...<br />نصيحة يا أخ غريب<br />\" بطل كلام كتير أصله بيجيب تهتك في الرئة \" !!!<br />ترقبوا البيان التأسيسي للحلف الالكتوني الفظيع!!!"
