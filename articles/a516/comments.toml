subject = "عالم فاصلة"
text = "انتوا مالكوا فاصلين كده ليه؟ 4/3 التعليقات مالهاش أي علاقة بآراء أصحابها في الموضوع المطروح أو السؤال إلي جه في آخره...<br />على أي حال، أنا باقول إن حب الإبن لأبوه ده حب مكتسب مش فطري ولا واجب.. عايز ابنك يبرك؟ بره انت الأول..الإنسان بيتولد و معاه غريزة حب أبنائه، لكن العكس غير صحيح!<br />سيدنا عمر رضي الله عنه قال\" عققت ابنك قبل أن يعقك\"... جبتوا منين بقى \"حب الأب من حب الرب\" دي؟؟<br />أنا شخصيا كانت بتعدي عليه أوقات بحس فيها اني بكره أبويا.. و أمي و إخواتي كمان.. مقدرش أقول بشكل مطلق اني بكرهم، لكن ده إحساس أنا جربته في أوقات كتير، و عندي يقين إن همه السبب في وجود الإحساس ده أو اختفائه.. أنا اتولدت صفحة بيضا، و همه إلي كتبوا عليها و ملوها.. و إلي همه كتبوه هوه إلي حيرجعوا يقروه على مر السنين... و فاقد الشيئ لايعطيه.. على الأقل للي حرمه منه !"
archived = "2004-08-10"
capture_url = "https://web.archive.org/web/20040810133738/http://www.20at.com:80/article.php?sid=516"

