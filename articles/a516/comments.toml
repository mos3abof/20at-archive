subject = "مصـ( الخير )ـعب ... المتحدث الرسمي باسم الحلف !!!"
text = "يا جماعة<br />أعلن بصفتي المتحدث الرسمي<br />باسم الحلف الالكتروني الفظيع<br />أن \"بيرو\"<br />شخصية منفصلة عن شخصية<br />\" البراء أشرف \"<br />و هذا على مسئوليتي المفوضة لي من قبل الحلف<br />و ننذر كل من تسول له نفسه إطلاق إشاعات مغرضة<br />بأنه يعرض نفسه للمسائلة القانونية<br />أمام لجنة الأحلاف و الأحزاب الالكترونية<br />- التي ستعترف بنا قريبا إن شاء الله -<br />و نذكر هنا أن التعليق الذي كنت قد كتبته<br />كان من باب الدعاية للحلف<br />و قد تم الاعتذار رسميا<br />للكاتب المحبوب<br />\"البراء أشرف\"<br />ووعدناه ألا نسمح بحدوث هذا الخطأ مرة أخرى<br />سواءا له أو لأي كاتب آخر في<br />\" عشريناتنا \"<br />هذا وبالله التوفيق ...<br />ترقبوا البيان التأسيسي للحلف الالكتروني افظيع !!!"
archived = "2004-08-10"
capture_url = "https://web.archive.org/web/20040810133738/http://www.20at.com:80/article.php?sid=516"

