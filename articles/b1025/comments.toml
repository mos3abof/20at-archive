subject = "حرية الكامه فى حربة رغيف العيش"
author = "مارك"
posted = "2006-07-14"
text = "اننا نقول مالا تفعل ونفعل مالا نقول ولهذا عليناان نفهم ما نقول ولا نقول مالا نفهم، كماان علينا ان نعلن ما بداخلنا وليس ان نعلن مالا نبطن، وقبل الكل علينا ان نحرر لقمة العيش لأن فى حريتها حرية الكلمة. وحرية رغيف العيش هى فى وحدة الكلمة ووحدة الكلمة هى فى وحدة الصف ووحدة الصف هى فى وحدة الفكر، ووحدة الفكر هى فى وحدة الأراده ووحدة الأراده هى فى صدق الكلمه. فاولا واخرا صدق الكلمه، فمتى نكون صادقين فى كلمتنا، متحدين فى ارادتنا ، نظهر ما نبطن ، ونفعل ما نعلن؟!!!!"
