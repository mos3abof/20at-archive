[[comments]]
order = 5
subject = "محمود عباس"
author = "ابن البلد"
posted = "2006-07-12"
text = "لو قلبنا صفحات التاريخ، وغصنا في أعماق الأحداث، ودرسنا الشخصيات التي كان مكانها مزابل التاريخ، وحللنا رموز السقوط السياسي، ما وجدنا شخصية واحدة وقفت ضد شعبها بشكل علني مباشر وعلى طريقة \"على عينك يا تاجر\"، فحتى أعتى العملاء والجواسيس والخونة كانوا يغلِّفون أفعالهم بشعارات الوطنية، ويجملونها بالكلمات والعبارات التي تظهرهم كأحرص الناس على الشعب والوطن والحقوق، ويكذبون ويتلونون باسم السياسة والواقعية.<br />ما تشهده فلسطين اليوم فاق كل توقع، وعباس هذا تفوق على كل من دخلوا مزابل التاريخ، فهو ضد شعبه بوقاحة سياسية منقطعة النظير، يجرمه ويحقره ويحمله مسؤولية أنه يذبح بأيدي جلاديه الذين يستقبلهم عباس بالأحضان والقبلات، ويصر كل يوم على تسجيل مخزية جديدة في سجله الأسود الممتد من عام 1968 وحتى اللحظة، مردداً أكاذيبه المفضوحة وبطريقة تمثيلية لا تليق إلا بأقدم مهن التاريخ.<br />قد يعتبر البعض أن هذا تهجم وقدح وذم شخصي، لكن لحظة: عبّاس هذا يعتبر نفسه رئيساً للشعب الفلسطيني ومتحدثاً باسمه، ويحق لأصغر طفل فلسطيني أن يحاسبه ويحاكمه، فنحن لا نتكلم عن حياة شخصية تخصه، كعلاقاته الزوجية أو تصرفاته مع أبنائه أو عادات تدخين أو غيرها، لكن عن أقوال وأفعال مشينة مخزية يقوم بها أمام الشاشات وعلى مرأى ومسمع من العالم بأسره تخص شعباً بأكمله، والأهم أن هذا ليس تجنياً عليه فسجله الأسود يشهد عليه، ولهذا سأسمي الأمور بمسمياتها دون مواربة أو مجاملة.<br />لماذا هذا الكلام في هذا التوقيت بالذات؟ سؤال مبرر، ويبرر الإجابة عليه ما تفوه به عبّاس ظهر اليوم، ناطقاً باسم أسياده في تل أبيب، مردداً وبالحرف ما قاله صباحاً وزير الامن الداخلي في حكومة الإحتلال افي ديختر مع فارق أنه استخدم اللغة العربية بدل العبرية، مطالباً الفصائل الفلسطينية التي تحتجز الجندي الاسرائيلي باطلاق سراحه، ووقف اطلاق الصورايخ باتجاه اسرائيل، مقابل ماذا يا ترى؟ مقابل \"ان هناك وعود اسرائيلية باطلاق سراح اسرى ممن امضوا عشرين سنة وما فوق ونساء واطفال في حال اخلاء سراح الجندي الاسرائيلي حيث سيتم ايضا اطلاق سراح النواب والوزراء ورؤساء البلديات المعتقلين اضافة الى انسحاب اسرائيل من غزة\"<br />لم يفت عبّاس كعادته أن يتباكى على الآخرين كما فعل في خطاب العقبة الشهير ومن بعده لقاء البتراء الأشهر ليقول اليوم: \" اننا معنيون بحل القضية سلميا ونعمل كفصائل وسلطة ودول عربية سيما مصر لعودة الاسير سالما الى أهله\"<br />كما فعل في لقاء البتراء عندما عانق وقبل بيريز وأولمرت ودماء شعبنا لم تجف بعد، لم يتذكر اليوم أن عشرات الشهداء والجرحى سقطوا بالأمس بأوامر من رفيق الأحضان والقبلات والذي وعده أيضاً وعوداً أخرى مضيفاً \" وقال اولمرت حينها انه عندما نلتقي سيتم اطلاق سراح عدد من الاسرى\"، ما هذه الثقة المطلقة في الجلاد والمجرم؟<br />الوعود تلك التي لم ينفذ منها إلا القتل والإرهاب تضاف لوعود عبّاس نفسه بالأمن والأمان، شعاره في حملته الإنتخابية، والتي تناساها جميعاً في سبيل ضرب خيار الشعب الذي أسقط برنامجه عملياً يوم 25/01/2006، ليحاول بعدها الالتفاف بكل الطرق على هذا الخيار، بداية عن طريق سحب الصلاحيات، مروراً بالتلويح بمنظمة التحرير الفلسطينية التي سعى جاهداً للقضاء عليها، وانتهاءاً بالمتاجرة بالأسرى عبر استفتاء غير دستوري ولا قانوني مستغلاً اياهم لتحقيق مآربهم الخبيثة، الأسرى الذين يتنكر لهم اليوم لعاطفته وحنانه المفرط تجاه الأسير المسكين الذي يجب أن يعود لأهله، ولا ننسى أنه وبوصف عباس مختطف وليس أسير، ربما حتى لا يثير غضب تل أبيب قبلته الأولى والأخيرة.<br />عبّاس الذي تحول إلى حاكم بأوامرتل أبيب، وخلق مؤسسة جديدة لا وجود لها إلا في مخيلته أسماها مؤسسة الرئاسة، رغم أن هناك رئيس للسلطة وليس مؤسسة، المهم هذه المؤسسة المفترضة جمع فيها عبّاس حثالات الشعب الفلسطيني ممن سقطوا في الانتخابات أو ممن تورطوا في قضايا فساد أو مجرمون من قيادات الأجهزة القمعية، ليعين منهم ممثلين وناطقين باسمه ومندوبين ومستشارين، ليزيدوا صورة شعبنا تشويهاً بعد تشويههم له طوال سنوات أوسلو العجاف!<br />يحق لنا أن نتساءل ونسأل عبّاس الذي يخرج كل يوم مجرِّماً شعبنا بحجة الصواريخ والذرائع، أن نسأله:<br />- هل في القانون الأساسي الفلسطيني ما ينص أن هناك حسابات خاصة لرئيس السلطة يستقبل فيها عشرات الملايين دون رقيب أو حسيب؟ أليست ميزانيته هي من بنود ميزانيات السلطة التي تخضع للرقابة ومن خلال وزارة المالية؟<br />- ألم ينشر عبّاس قوات حرسه على المعابر في عملية قرصنة على صلاحيات الحكومة بحجة حماية المعابر؟ بالتالي لماذا يغلق معبر رفح وتحت أي ذريعة يا حامي الحمى؟<br />- رفض عبّاس القضاء على الفلتان، كما رفض اليوم إعلان حالة الطواريء للدفاع عن قطاع غزة أمام الهجمة الإرهابية لجيش الإحتلال، وانتقد قرار وزير الداخلية، والسؤال ما هي مهمة عشرات الآلاف من العناصر المسلحة إن لم تكن حماية الوطن والمواطن؟ أم أن قراراتك لنشر القوات لا تكون إلا نكاية كما فعلت للرد على قرار انشاء القوة التنفيذية<br />- ماذا فعلت للأسرى غير المتاجرة بهم؟ هل تعلم يا عبّاس أن عدد الأسرى تضاعف في عهدك الميمون من 6000 أسير إلى 12000 أسير، وللمعلومية هذا قبل الانتخابات التشريعية الأخيرة.<br />- هل يا ترى الأسير المجرم الذي كان يجلس في دباباته منتظراً الأوامر لقتل أبناء شعبنا أغلى عندك من أسرانا؟<br />- هل لديك أي شعور واحساس من أي نوع لتعانق قتلة شعبنا بعد كل مجزرة، ولتثق بوعودهم الكاذبة؟<br />الأسئلة كثيرة ولا حصر لها، ونتيجتها الوحيدة أنك تقف في خانة أعداء الشعب، وبأنك فقدت كل كرامة وشرف واحساس، وهذا ما لايقلقك على الأرجح فقد ارتضيت ذلك الدور، ولن ألومك فقد سقطت وهويت إلى مزابل التاريخ.<br />اللوم كل اللوم هو على من يحترم أمثالك ممن أجرموا بحق شعبنا وحقوقه، ولذلك أقول الحق مش عليك يا عبّاس!<br />تحضرني قصيدة نزار قباني \"المهرولون\"، والتي أختار منها بعض الأبيات:<br />سقطت آخر جدران الحياء<br />وفرحنا..<br />ورقصنا..<br />وتباركنا بتوقيع سلام الجبناء<br />لم يعد يرعبنا شىء<br />ولا يخجلنا شىء<br />فقد يبست فينا عروق الكبرياء..<br />سقطت..<br />للمرة الخمسين .. عذريتنا<br />دون أن نهتز.. أو نصرخ<br />أو يرعبنا مرأى الدماء<br />ودخلنا فى زمان الهرولة<br />ووقفنا بالطوابير كأغنام أمام المقصلة<br />وركضنا .. ولهثنا..<br />وتسابقنا لتقبيل حذاء .. القتلة<br />جوعوا أطفالنا خمسين عاما<br />ورموا فى آخر الصوم الينا<br />بصلة..<br />تركوا علبة سردين بأيدينا<br />تسمى (غزة)...<br />عظمة يابسة تدعى (أريحا)..<br />فندقا يدعى فلسطين<br />بلا سقف ولا أعمدة<br />تركونا جسدا دون عظام<br />ويدا دون أصابع<br />لم يعد ثمة أطلال لكى نبكى عليها<br />كيف .. تبكى أمة<br />أخذوا منها المدامع ؟؟<br />بعد هذا الغزل السرى فى أوسلو<br />خرجنا عاقرين<br />وهبونا وطنا أصغر من حبة قمح<br />وطنا نبلعه من غير ماء<br />كحبوب الأسبرين !!...<br />بعد خمسين سنة<br />نجلس الآن على الأرض الخراب<br />ما لنا مأوى .. كآلاف الكلاب !!<br />بعد خمسين سنة..<br />ما وجدنا وطنا نسكنه<br />الا السراب.<br />ليس صلحا..<br />ذلك الصلح الذى أدخل كالخنجر فينا..<br />انه فعل اغتصاب !!...<br />ما تفيد الهرولة؟<br />ما تفيد الهرولة؟<br />عندما يبقى ضمير الشعب حيا<br />كفتيل قنبلة<br />كم حلمنا بسلام أخضر<br />وهلال أبيض<br />وبحر أزرق<br />وقلوع مرسلة<br />ووجدنا فجأة أنفسنا فى مزبلة!!<br />من ترى يسألهم<br />عن سلام الجبناء ؟؟<br />لا سلام الأقويا القادرين<br />من ترى يسألهم ؟<br />عن سلام البيع بالتقسيط<br />والتأجير بالتقسيط<br />والصفقات...<br />والتجار.. والمستثمرين؟<br />من ترى يسألهم؟<br />عن سلام الميتين..<br />أسكتوا الشارع<br />واغتالوا جميع الأسئلة..<br />وجميع السائلين...<br />وانت تقف ضد شعبك وهو يسجل ملاحم البطولة والعزة والفخار، وأنت تصفه بالحقير والمجرم ومعطي الذرائع، وأنت تتباكى على الآخرين دون أن تتأثر لسقوط أبناء شعبنا، وأنت تردد أقوال سادتك فتقول المختطف والصواريخ وغيرها، وأنت تبطل قرار اعلان الطواريء للدفاع عن الوطن، وأنت من أنت، أقول لك عليك من الله ما تستحق يا عبّاس أنت وباقي عصابتك، لا وفقك الله ولا سدد خطاك، وأضيف لا يشرفنا أن يكون أمثالكم بيننا، فمكانكم حجز لكم في ....... مزابل التاريخ."
