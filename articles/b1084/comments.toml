subject = "؟"
author = "مسلمه"
posted = "2006-07-17"
text = "الحقيقه فيه مواقع كتير بتقدم خدمة الافتاء بس لازم الواحد بس ما يسمع الافتى اللى لازم تكون مقرونه بالنصوص القانيه والاحاديث يحكم عقله برضوا<br />انا عن نفسى باسال فى المواقع دى لكن لما باكون مستعجله باسأل اخى فى الله \".. المصرى\" ومره سألت ورد على عبد الله مفتاح بس المهم انى اقتنع وانى احس اللى بيفتى قارى وفاهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124350/http://www.20at.com/article2.php?sid=1084"

[[comments]]
order = 1
subject = "وعليكم السلام"
author = "هووووووبه"
posted = "2006-07-17"
text = "والله يا بشر كل واحد وشخصيته , انا مثلا بحب وجدي غنيم موووووووووت , وكل واحد وحر في الشيخ بتاعه المهم قال الله وقال الرسول طالما قالوها خلاص , بس الفرق في الاسلوب , اما لو جيتي علي المواقع الاسلاميه فبتسهل كتيررررررررر, خاصه لما تكون من جهه موثوق فيها.يعني مش اي موقع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124350/http://www.20at.com/article2.php?sid=1084"

[[comments]]
order = 2
subject = "الاحسن ooقناة المجد 0000 الفضائية"
author = "ريم بنت السعودية"
posted = "2006-07-17"
text = "نصيحة لكم تابعو احسن برنامج افتاء ليسو شيوخ فقط بل حاصلين على الدكتوراة وعلماء معروفين وذ لك عبر قناة المجد الفضائية في برنامجooooo الجواب الكافي ooooo والذ ي يعرض يوم الاحد بعد صلاة المغرب بتوقيت مكة ويوم الجمعة بعد صلاة الجمعة من مكة المكرمة فهو جدا راااااااااائع000000000000 في زمن انتشار الفضائيات وكثرة المفتين الذ ين لم يحصلو ولا على شهادة علمية فانصحكم به لانه يختار علماء سنة موثوق بهم وفي نفس الوقت هم باكبر جامعات سعودية وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124350/http://www.20at.com/article2.php?sid=1084"

[[comments]]
order = 3
subject = "مصادري الشخصية"
author = "معاذ محمود عامر"
posted = "2006-07-18"
text = "المسائل الدينية أحلها وحدي لأن أساسا أزهري ودرست الفقه الاسلامي جيدا جدا والذي لا أعرفه أطلع عليه في كتب الفقه المفندة المفصلة بالأدلة من القرآن والسنة الصحيحة فقط ولا أنظر الى الآراء التي بلا دليل لأنني لي عقلي المستقل الذي أمرني الله باستخدامه,هذا بالنسبة للنسائل التي تخص العبادات, أما بالنسبة للمسائل الفكرية فأستخدم فيها عقلي ومعرفتي بالقرآن الكريم وبعض الآراء التي أثق فيها من المفكرين كالأستاذ جمال البنا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124350/http://www.20at.com/article2.php?sid=1084"

[[comments]]
order = 4
subject = "رد"
author = "محسن التركي"
posted = "2006-07-19"
text = "الحمد لله<br />والصلاة والسلام على رسول الله<br />أمابعد...<br />فأن مايقال حدثياُ من الشباب حديثي الإلتزام بأن الكل يؤخذ من قوله ويرد نقلا عن أحد أو بعض الأمامه صحيحا.<br />أماالخطأهو في من يأخذ ويرد واجب أن يرجع الأمر إلى مختص كلا في مكانه والله أعلم والسلام عليكم ورحمه الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124350/http://www.20at.com/article2.php?sid=1084"

[[comments]]
order = 5
subject = "الدين نصيحة"
author = "رحمة محمد"
posted = "2006-07-28"
text = "بسم اللة الرحمن الرحيم<br />الاسلام دين النصيحة والفضيلة وكل من قال كلمة خير فى سبيل اللة ونصح هدة الامة فى هدا الزمن الاخير كانت لةوكل قلب مسلم يعلم اين الخطاوالصواب بالعقل انا احب اناسمع للداعية عمرو خالد والشيخ الفضيل نبيل العوضى جزاهم اللة الف خير وجعل اعمالهم فى ميزان حسناتهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124350/http://www.20at.com/article2.php?sid=1084"
