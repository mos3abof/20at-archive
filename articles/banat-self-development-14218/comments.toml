subject = ""
author = "thuthu"
posted = "2009-12-31"
text = "- حافظي علي التواصل بالعين فلا تجعلي الخجل يغلب عليك طوال فترة التعارف لدرجة عدم معرفة ملامح وجهه، اصحبي التواصل بالعين بابتسامة خفيفة، واحذري من الوصول إلي مرحلة البحلقة.<br />- اجعلي تليفونك معك، دائما ففي حالة أردتي استشارة أو نصيحة صديق، يمكنك الدخول إلي الحمام والقيام بمكالمة الصديق<br />اكتر حاجتين مسخره<br />التانيه فعلا صاحبتى عملتها وكانت تتصل وتسالنى<br />اللى جامد بقى احذرى الوصول لمرحله البحلقه دى"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106150008/http://www.20at.com:80/banat/self-development/14218-2009-12-02-12-33-25.html"

