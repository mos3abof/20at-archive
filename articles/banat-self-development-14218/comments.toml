author = "basma218"
posted = "2010-01-02"
text = "امم عرفين ايه الجديد اسرقى موبيله و انتى تعرفى كل حاجه عنه<br />من غير مقابله العمل دى ده ولا التحقيق<br />امم وممكن تشوف نظراته لناس ازاى بيبصبص ولا ايه نظامه لبسه كده يعنى المكان اللى هيعزمك فيه و طبعا خليه يختار هو المكان بس عن طريق غير مباشر مثلا انك مبتخرجيش كتير او هو خبره عنك كده يعنى بس بجد الموبيل ده ممكن يعرفك عنه كل حاجه حولى تتفرجى عليه بصانعه لطافه لان كل الاسئله ممكن يكون مصتنع فى الرد عليها<br />وربنا معانا بقى"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106150008/http://www.20at.com:80/banat/self-development/14218-2009-12-02-12-33-25.html"

