text = "اقتباس arar:<br />بجد بجد دي اسئلة في غاية الروعة ومهمة جدا ومفيدة<br />بس الي عوزة اعرفة ازاي اعرف انة صريح ولا كذاب؟<br />شكرا كتييييييييييييي يييييير<br />انا ممكن اساعدك بشكل بسيط في النقطة دي و اديكي شوية ملاحظات شخصية و يارب تنفعك<br />اولا: ادعي ربنا دايما يوفقك معاه للخير.. هتتفاجئي و انتي قاعدة بمواقف او احاسيس تبينلك حاجات كتير قوي<br />ثانيا:الكذاب بيميل للمبالغة..يعني ممكن تحسي من كلامه انك قاعدة مع باتمان اما الصادق فبيرد ردود منطقية و مثبته<br />ثالثا:الكذب ملوش رجلين..الحاجه اللي تشكي فيها سيبي الموضوع و ارجعي افتحيه من زاوية تانيه..هتذهلي قد ايه الكدابين مهما كانو ناصحين..اغبيا<br />رابعا:حاولي الله يخليكي تحتفظي بذاكرتك القويه في القعدة و اول ما تخلصي تحكي كل اللي حصل لحد قريب منك غالبا اخ او اب او ابن خالة المهم واحد و واحدة و الهدف هو جمع اكبر كمية معلومات لتأكيد او نفي المعلومات اللي قالهالك :)<br />اخيرا:صدقيني ده مش كلام كل البنات عندهم الحاسة السادسة بس للاسف بنعطلها يا اما بسبب الحب او الطمع فاياكي تلغيها ساعتها و اي نقطة مشكوك فيها ادي نفسك فرصة كمان معاه تتأكدي<br />واخيرا<br />تأكدي<br />الكذب ملوش رجلين"
