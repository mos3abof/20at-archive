text = "بس انا مرت بي تجربة تعارف و كنت مكسوفة جدا و متكلمتش غير علي قد السؤال اللي هو بيسئلو و كان رايه فيه اني انطوائية و محصلش نصيب بس للاسف دى طبيعتي مع الناس كلها سواء رجال او سيدات مش عرفة اه الحلو اللي كانوا بيجولي من قبله كنت برفض من غير مشوفهم بسبب هذا اللقاء"
