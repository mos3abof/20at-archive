subject = ""
author = "Do2do2a"
posted = "2009-12-24"
text = "اقتباس منى:<br />الاسئله دى فعلا مفيده قوى,بس ادخلها ازاى وسط الكلام بحيث المقابله ماتقلبش على تحقيق او حوار صحفى؟؟<br />السلام عليكم<br />معلش الكومينت بتاعك لفت نظري قوي لان صاحبتي القريبة مني كانت بتقولي كده<br />وهقولك قلتلها ايه و يارب يظبط معاكي زي ما ظبط معاها<br />بصي يا ستي<br />انتي ممكن تفتحي الحوار من اول نقطة تحسي انه مهتم بيها حتى من غير ما يتكلم<br />مثلا<br />سمعتي ان منصبه كوةيس في شغله ابتدي بالكلام عن شغله.. وده اللي غالبا بيحصل لانه موضوع عام و ممكن تسألي باسلوب ظريف انت مبسوط في شغلك؟ بتحبه؟ طب لو مكنتش طلعت كذا كنت بقى هتحب تطلع ايه؟<br />الردود بتاعته هتديكي لمحة كبيرة عن شخصيته و دماغه<br />الذكاء بقى<br />انك تاخدي ردوده هو و تخرجي منها باسلوب رقيق و بسيط و بسذاجة اسئلة اعتراضية في وسط الكلام او تفتحي منها موضوع تاني و تسيبيه يتكلم وهكذا الشغل ممكن ينفد على زمايلك في الشغل صحابك برده و لا دول حاجة و دول حاجة و منها على اصحاب طفولتك و منها على انت واخواتك اصحاب و لا علاقة اخوية و منها طب مين اقربلك بقى باباك و لا مامتك في التفكير؟ و منها على طب لما بتروح من الشغل او بتبقى في اجازة بتحب تعمل ايه؟<br />وهكذا"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106150008/http://www.20at.com:80/banat/self-development/14218-2009-12-02-12-33-25.html"

