text = "والله افدتمونى كتييييييييييير<br />بس على ما اعتقد ان الاسئله دى ممكن تتسئل بس ف اوروبا والدول المتقدمة<br />احنا هنا ف مصر يا بنات<br />يعنى مش كتير مننا ممكن تروح تقابل واحد برة وتتعرف عليه علشان ييجي يخطبها<br />ياريت مواضيع تناسب عل ىالاقل الاغلبية"
