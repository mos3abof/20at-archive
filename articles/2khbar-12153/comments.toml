author = "ابومحسن غربة 27 سنه"
posted = "2009-05-24"
text = "لا فيه فايدة باتباع منهج النبي صلى الله عليه وسلم<br />الفلاح والنجاح في هذه الدنيا ليس باتباع ايمن نور ولا باتباع اي احد الاالنبي محمد صلى الله عليه وسلم<br />وعلشان خاطر نعرف مين هو النبي محمد صلى الله عليه وسلم يستلزم قراءة كتاب عن حال الجزيرة العربية قبل الاسلام لنتعرف كيف كان يعيش العرب في حالة همجية جاهلية<br />ثم بعد ذلك يستلزم قراءة كتاب عن السيرة النبوية ومدتها 23 سنه لنتعرف على منهج النبي صلى الله عليه وسلم وكيف تربى اهل الجزيرة العربية على هذا المنهج<br />المرحلة الثالثة يستلزم قراءة كتاب عن حال المسلمين بعد انتهاء مهمة النبي صلى الله عليه وسلم وكيف هزموا الفرس والروم وكيف انطلقوا الى فتح الشرق والغرب وفي اقل من 100 سنه كانت الدولة العربية من اسبانيا الى الهند<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />اللهم صلي على محمخد وال محمد كما صليت على ابراهيم و على ال ابراهيم وبارك على محمد وعلى ال محمد كما باركت على ابراهيم وعلى ال ابراهيم في العالمين انك حميد مجيد"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527183317/http://www.20at.com:80/2khbar/12153-2009-05-24-07-16-28.html"

