author = "اى واحد"
posted = "2009-05-24"
text = "يا ابنى اللعب مع الكبار خطير<br />اخرتها يا قتيل حادثة طريق يا مشنوق انتحارا يا واقع من بلكونة<br />وكل حاجة بوقتها<br />ارجع بلدكم المنصورة واتزوج واحدة من بلدكم وسيب جميلة وعيش حياتك بعيدا ان كنت تريد ان تعيش<br />انما تتنطط فى اوروبا وتلقى خطابات وتزور محافظات الصعيد وبحرى فهذا خطر عليك<br />سعد باشا زغلول قال مفيش فايدة وغطينى يا صفية وصوتى<br />واظن انة من الصحيح ان تقول يا سى ايمن مفيش فايدة غطينى يا جميلة وصوتى"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527183317/http://www.20at.com:80/2khbar/12153-2009-05-24-07-16-28.html"

