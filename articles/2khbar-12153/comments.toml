[[comments]]
order = 3
subject = ""
author = "فرعونى حديث"
posted = "2009-05-24"
text = "زمان علمونا<br />ان نظام الحكم الفرعونى هو نظام هرمى او شبة الهرم<br />قلة تجلس فى القمة قمة الهرم او المجتمع تتمتع بكل المميزات وليس عليها اى اعباء وقاعدة مجتمع او هرم عريضة تقع عليها كل الاعباء وليس لها اى مميزات<br />هتغير النظام الفرعونى الهرمى دة ازاى يا سى محسن<br />النظام الاسلامى لا يمشى مع النظام الفرعونى<br />الاسلام عدل<br />وهنا قلة تتمتع بكل المميزات وليس عليعا اى اعباء وقاعدة عريضة عليها كل الاعباء وليس لها اى مميزات<br />مفيش فايدة<br />نرجع زى اجدادنا زمان<br />نخللى الحاكم فى العاصمة يعمل اللى هو عايزة سواء كان تركى او مملوكى او انجليزى ونقعد احنا فى بلادنا كل يوم نبص على مستوى النيل ونزرع اللى يكفى بيتنا بس وبعد كدة تولع"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527183317/http://www.20at.com:80/2khbar/12153-2009-05-24-07-16-28.html"

[[comments]]
