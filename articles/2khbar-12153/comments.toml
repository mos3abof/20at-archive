text = "الى مدام/نورة<br />صباحية مباركة يا عروسة<br />ازى [ *** ]ان الليمان معك؟<br />كم زوج كان لك كل ساعة بالسجن<br />علشان كدة عرفت انا لية ان مدام /جميلة هربت منكى<br />جميلة لا تقترب النساء فى الفراش يا(نورة)"
