author = "ايمن نور"
posted = "2009-05-24"
text = "يا زخاري لو مسكت رئيس جمهورية<br />حسمحلك بالسفر الى اسرائيل يا زخاري<br />يلا بقا شد حيلك معايا انت واهل اسكندرية<br />بين شطين وميه عشقتهم عنيه يا اهل اسكندرية<br />واول ما ابقى رئيس جمهورية على طول حشيل اسمك من على القايمه السودا اللي ممنوعه من السفر<br />وعد يا زخاري وسلملي على مرقص عزيز وقوله طيزك حمرا"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527183317/http://www.20at.com:80/2khbar/12153-2009-05-24-07-16-28.html"

