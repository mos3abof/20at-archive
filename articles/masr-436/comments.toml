[[comments]]
order = 0
subject = "مش كده خالص"
author = "عبدالله مفتاح"
posted = "2006-06-01"
text = "لاني بحب احطم بعض المعتقدات اللي بدايقني<br />فانا بحاول مفكرش في العين دي خالص ومش بقلق نفسي بيها خالص<br />لان ضغطي بيعلى لما اسمع الناس تنسب كل حاجه للحسد لا انكر الحسد طبعا بس مش اي حاجه نرجعها للحسد<br />اعملوا معروف"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072605/http://masr.20at.com:80/article.php?sid=436&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "عنيه حلوة اوى"
author = "نهى"
posted = "2006-06-02"
text = "بخاف من الحسد اوى و الله بش بصراحه انا مؤ منه بيه جدا عشان انا عنيه حلوى اوى وكل ما حد يشوفنى يبدى اعجابه بيه جدا وانا خيفه عليهم خالص ربنا يستر بس بجد الموضوع ده حلو جدا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072605/http://masr.20at.com:80/article.php?sid=436&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "الحسد مذكور في القرآن"
author = "نبيل خليفة"
posted = "2006-06-02"
text = "اخذتنا الصحفية وتجولت بنا من خلال المترو والجامعة وعشنا من خلال مقالهامفردات الحسد وعين الحسود .<br />ولقد جاء ذكر الحسد في الكتاب والسنة ومن منا لا يؤمن به فمن لا يؤمن به فقد كفر بالكتاب والسنة استغفر الله العظيم .<br />ولكن العاقل من ابتعد عن الدجالين والمشعوذين فهم اداة لسلب قوت الناس الطيبين السذج من عامة الشعب .<br />مقالة طيبة لصحفية نتمنى لها مستقبل باهر<br />حيث تأخذنا في كل مقالة الى اشياء تمر امام اعيننا ولانلقي لها بالا .<br />مع تحياتي للقائمين على الموقع"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072605/http://masr.20at.com:80/article.php?sid=436&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "مجربها"
author = "كنت باخذ درس عند مدرس و كل مرة يبص على نضارتي و يقول دي جميلة جدا - و في مرة و هوه بيقول كده اتكسرت في ايدي من غير اي مقدمات ."
posted = "2006-06-02"
text = "و كمان فيه اشياء كثيرة بس مش فاجرها قوي.<br />عموما دايما الواحد يقرا المعوذتين و ايه الكرسي و ربنا يحفظنا دميعا يا جماعة"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072605/http://masr.20at.com:80/article.php?sid=436&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "العين الحسود"
author = "القليصي"
posted = "2006-06-03"
text = "بسم الله الرحمن الرحيم اخواني المصرين تحيه طيبه لكم,,,,, العين والسحر مصدق فحذرو من يعض الناس الحسودين فان حاجات كتير حصلت لي ولغيري هنا في اليمن"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072605/http://masr.20at.com:80/article.php?sid=436&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "نصيحة"
author = "رضوى نبيل"
posted = "2006-06-03"
text = "علشان تتجنب اي موقف محرج من دول لا تبدي رايك في حاجة زي مثلا ...الله الشنطة دي حلوة قوي ...لان لو حصل اي حاجة للسنطة هتلزق عليك ان عنيك وحشة وانك حسوووووووود. ولو حد طلب منك ابداء الراي في حاجة قول مثلا مش مش مهم الحاجة المهم اللي جايبها ."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072605/http://masr.20at.com:80/article.php?sid=436&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
