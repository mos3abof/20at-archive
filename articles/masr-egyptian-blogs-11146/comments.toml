posted = "2009-02-01"
text = "السيد الوالد توفاة اللة قبل ظهور الرقم القومى — وعندى شهادة وفاة معتمدة وعليها ختم النسر واضح<br />اخى الصغير مطلوب دخولة الجيش لتأدية خدمة العلم او الخدمة العسكرية<br />السيد مندوب التجنيد طلب شهادة القيد العائلى المميكن ضمن الاراق<br />تقدمت الى مركز الرقم القومى لاستخراج الشهادة<br />حكومة ذكية بقى<br />طلب منى السيد الموظف شهادة ميلاد رقمية حديثة للسيد والدى الذى عندى لة شهادة وفاة<br />ازاى استخرج شهادة ميلاد لواحد ميت وفى ذمة اللة ومات قبل حكاية الرقم القومى<br />ودوخونى السبع دوخات<br />ولفيت ولفيت وجالى اكتئاب ومرض نفسى<br />وفكرت انى اغتال السيد مدير مركز الرقم القومى<br />وفى النهاية<br />طلعت شهادة ميلاد لواحد ميت لزوم طلبات الحكومة الذكية شهادة ميلاد بالكمبيوتر وشهادة وفاة بالكمبيوتر وقيد اسرى بالكمبيوتر بعد شهرين<br />على مسئوليتى الخاصة كس ام الحكومة الذكية"
archived = "2010-01-05"
