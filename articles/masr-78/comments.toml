[[comments]]
order = 1
subject = "بصى يا ست الكل"
author = "عابر القارات"
posted = "2006-03-27"
text = "بصى يا ست الكل أنا هأقول ببساطه حاجتين أول حاجه إن من ساعة الثورة الميمونه و اللى عمرها يزيد عن 54 سنة نصفهم عكها إثنين واحد إسمه عبد الناصر و التنى السادات أما الثالث فده عكها عك يفوق ما حققه سابقيه لأنه ببساطه قعد و رنخ و فخد حوالى نصف عمر الثورة اللى الهى يتقصف عمر اللى قاموا بيها و من سار على دربهم يا قادر يا كريم فأنا طبعا ما عشتش من أول الثورة الميمونة لما قامت بس أنا مش محتاج أعيش من أولها لأنى شايف أخرها و الحمد لله و أخرها طبعا و إنتم سيد العارفين التى: إذلال كرامة المصريين-سيادة قانون الطوارئ و لا غير سواه-فساد نخر فى عضم النظام و السلطه حتى نخاع النخاع و بتبجح- الانسان المصرى الغلبان ديته سمكة فك مفترس فى وسط البحر- بيع الاصول الثابته اللى الشعب بياكل منها عيش بحجه توفير السيوله بدل ما يبدوأ بالتنمية للموارد المتاحة بيبيعوا الشعب هدومه زى بالظبط العواطلى اللى بيبيع لا مؤاخذه ملابسه الداخليه و الناس تشوف عدم المؤاخذه عورته و بيقول ده أفضلى من الشغل و البهدله جاتكم سيوله فى دمكم يا بعده - الوزارة الوحيد الى شهدت إزدهار مطرد و مشجع و يفخر بيه كل مصرى هى وزارة الداخلية و ذلك لأنها بتقول بدور الفنان الشامل فمشكلة سياسية تلاقى الوزارة متواجده بقوة و هاتك يا طيخ و طيخ و تكسير عضم و قتل زى ما حصل فى الانتخابات من تشجيع البلطجية .. كارثة إجتماعية زى بتاعة العبارة تلاقى الوزارة متواجده بنفس القوة و الامن المركزى بيعزق فى أسر الضحايا كأنه أول بينفض سجادة - أما فساد العائلة و الاصدقاء و المحاسيب فحدث و لا حرج - أما الفقر المدقع و اللى خلا الحكومة نفسها تعترف بإن 16 مليون تحت خط الفقر و اللى أقطع دراعى و من اللى بشوفه كل يوم فى الشوارع و الحوارى بتوعنا أن الخط ده كبس على الاقل<br />اقرأ بقية التعليق .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210535/http://masr.20at.com:80/article.php?sid=78&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

