order = 14
subject = "مبارك عليكم"
author = "حسن الجمال"
posted = "2006-09-04"
text = "مبارك عليكم مبارك مبارك<br />باصبح عليكم فى يومكوا المبارك<br />وفى عيد ميلادك حاقوللك مبارك<br />وفى يوم جوازك حاقوللك مبارك<br />ولو يخطبوكى حاقوللك مبارك<br />ولو عينوكى حاقوللك مبارك<br />مبارك مبارك برأيك تشارك<br />يلون سنينك ويسعد نهارك<br />مبارك مبارك مبارك ياعين<br />مبارك خليفه لصدام حسين<br />مبارك وربك يبارك خطاك<br />وياخدك وياخد اميركا معاك<br />وابنك وصفوت ومن كان وراك<br />لأن احنا بيك او معاك موكوسين<br />مبارك مبارك مبارك ياعين"
