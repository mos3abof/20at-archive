[[comments]]
order = 9
subject = "رئيس طراز أول"
author = "مصرية"
posted = "2006-05-27"
text = "ريسنا المعتق رئيس من الطراز الأول فى كل شيء ..بداية من التصاقه المرضى فى كرسى الرآسة..ومرورا بالفسادوالأستبداد والقمع والقهر والسرقة..والأقتصاد الذى يلفظ<br />أنفاسه الأخيرة..وتحويل مصر من دولة منتجة ومصدره الى دولة مستهلكة ومستوردة وانهيار مؤسسات الدولة من السرقة والفساد ..وافساد التعليم بجعله تحت هيمنه شلة الجهله من أقاربه والمقربين اليه..البطاله ..عدد أصحاب الملايين ..وعدد أصحاب الملاليم ...تزييف الانتخابات للبقاء فى الحكم حتى النفس الأخير ..التطاول على القضاة شرفاء مصر..كل هذا يسجل فيه أرقام قياسية تؤهله للتسجيل فى موسوعة جينيس.. ..25عاما وهو يسير بخطى واثقة وثابته..لأمتصاص آخر نقطه من دم الشعب المصرى...تحت حماية قانون الطوارىء...وكلاب الشرطةمن أعوانه...لا أعرف رئيس دوله نجح هذا النجاح الباهر طوال هذه المده فى هذا العصر..انه فى حالة حرب مع شعبه..وفى حالة تحدى مع الزمن..ممايجعله مثيرا للشفقة والضحك والاشمئزاز..78عاما ولا نرى ولو شعرة واحدة بيضاء ..أو بوادر للصلع فى رأسه العبقرى ..العجوز المتصابى يذكرنى بالممثلات المتصابيات وحتى هن لهن العذر لأن رأس مالهن التمثيل ..فما عذر هذا القبيح ( ولا أقصد الخلقة ولكن الخلق) ماعذره .. فى أن يصرف مال الشعب أيضا على ترميم شكله ومظهره ..المانيا من أجل عظامه وسمعه.. أسبانيا من أجل نظره..وفرنسا من أجل دمه وأحشائه..هل مرتب رئيس جمهورية شريف يكفى لكل ذلك .. والله لا يكفى لطاقم make up من اللىبيحطه على وجهه كل يوم وباين زى الشمس ..عشان يحاول يظهر بيه.. ومحاولات التصابى وال new look ..وعدم لبس الكرافه ..ومن ورائه شله الفسده الوزراء يقلدوه لأن معظمهم عمره الأفتراضى خلص والباقى أنتهى تاريخ صلا حيته والأصغر منهم يحلم بالبقاء حتى الموت..فعلا انهم<br />اقرأ بقية التعليق .."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043340/http://masr.20at.com:80/article.php?sid=78&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "مبارك فى سطور"
author = "المواطن مصرى"
posted = "2006-06-15"
text = "علشان انت بتحب مصر نقف ونقول انك ابن مصر ياولاد البلد مشوفتوش الشعب قال ايه<br />لزعيم البلد تاريخك يشرف شعب هذا البلد<br />بدله ميرى وطيران وعبور وسياسه وقتصاد حريه لمجتمعات سلام تجنولوجيا اوعو تكونو مفكرين ان دى اوهام بلادنا حره ونزيهه<br />وبنشكر كاتب الصين مع انه مسبقناش يامصريين دحنا صحيين وعرفين مبارك يبقه مين دهوه ده زعيم البلد ووراه جمهور البلد"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043340/http://masr.20at.com:80/article.php?sid=78&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

