[[comments]]
order = 3
subject = "اللي حصل و اللي جرا لا ينكتب و لا ينقرا"
author = "كرميلينو"
posted = "2006-03-28"
text = "على رأي جدتي واحد اكلنا المش و واحد علمنا الغش و واحد لا بيهش و لا بينش<br />ده رأي جدتي ( غير المتعلمة في مدارس ) عن الحقبة التاريخية التي عاشتها مصر ( و ستظل تعيشها ) مادام الاحوال هيا هيا<br />و على رأي منير في رائعته ساح يا بداح شريط قلب الوطن مجروح<br />طول العمر العسكر عسكر<br />بس الناس<br />الناس كانت ناس"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210535/http://masr.20at.com:80/article.php?sid=78&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "يا جدعان حرام عليكوا"
author = "والله الريس دا مش عارف عاوزينه يعملكوا ايه اكتر من كده ......."
posted = "2006-03-28"
text = "الحمد لله عيشين فى رفهايه مطلقه ...<br />الفلووووس كتير اوى ...<br />المواصلات فاضيه جدا ....<br />الشباب بيجوز عند 40 سنه بس .....<br />الناس كلها شغاله وبتقبض على قلبها ...<br />متسيبوا الراجل فى حاله..<br />دا الراجل يا عين امه ... مجوز ابنه لغايه دلوقتى ....علشان هم مفيفكرش غير فى شعبه ....<br />ولا انتوا والله شعب ميستحق....."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210535/http://masr.20at.com:80/article.php?sid=78&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

