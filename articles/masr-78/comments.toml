subject = "\\\"حمايه\\\" يعني الحمو بتاع انا"
author = "هووووبه جمال"
posted = "2006-03-28"
text = "لا بقولكواهو الا حماي مش كفايه جوزتوني ليه بالعافيه<br />وقبلت مش عايزه اقولكم ابنوه مجنني قد ايه روح ياشيخ<br />الهي وانت جاهي تتفسح انت وحماتي اللي تشل في عباره<br />نضيفه كدا وتقع بيكوا<br />ياباي انا حلحقها منك ولا من ابنك اوووووف<br />انا عايزه اطلق \"وكل مصر\" منك يااخي"
