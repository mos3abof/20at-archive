order = 0
subject = "ياسلام سلم ياسلام"
author = "مبارك يبحث مع أولمرت.. تحريك عملية السلام"
posted = "2006-06-04"
text = "قمة شرم الشيخ تناقش توصيل المساعدات الدولية للفلسطينيين<br />يستقبل الرئيس محمد حسني مبارك اليوم بمدينة شرم الشيخ ايهود اولمرت رئيس الوزراء الإسرائيلي لبحث تطورات الأوضاع علي الساحتين الفلسطينية والإسرائيلية.. يتناول اللقاء الذي يعد الأول منذ تولي اولمرت رئاسة الحكومة الإسرائيلية عددا من القضايا المتعلقة بعملية السلام بين الفلسطينيين والإسرائيليين والجهود المبذولة لتحريك عملية السلام بين الجانبين وإمكانية استئناف المفاوضات بينهما.<br />كما يتناول اللقاء مسألة المساعدات الدولية للفلسطينيين وأموال الضرائب والجمارك الفلسطينية التي تحتجزها إسرائيل لمواجهة الظروف المعيشية والأوضاع المتردية التي يعيشها الفلسطينيون.<br />ومن المقرر أن يطلع اولمرت الرئيس حسني مبارك علي نتائج زيارته الأخيرة للولايات المتحدة.<br />تعد هذه المباحثات فرصة قد تمهد الطريق لعقد قمة ثلاثية بين الرئيس مبارك واولمرت والرئيس محمود عباس \"أبومازن\" رئيس السلطة الوطنية الفلسطينية.<br />وتأتي زيارة اولمرت لمصر في إطار الجهود التي يبذلها الرئيس حسني مبارك لإحياء عملية السلام في الشرق الأوسط."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906101250/http://masr.20at.com:80/article.php?sid=445&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

