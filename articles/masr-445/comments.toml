[[comments]]
order = 2
subject = "طبعا حرية"
author = "ابو شريف"
posted = "2006-06-07"
text = "بتعترض علي ايه يا عم بلال طبعا فيه حريه<br />** حرية ان تموت بالضغط او بالفقر واو من الغيظ<br />** حرية الانتحار عند التفكير في مستقبلك لو كنت شاب<br />** حرية أن تتذكر ان لك دستور يحفظ لك حقوقك<br />** حرية ان تكون لص مسئول تحت الحماية او مواطن شريف تحت خط الفقر<br />** حرية أن تقول حسبي الله ونعم الوكيل<br />مش عاجبك الحريات دي كلها"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906101250/http://masr.20at.com:80/article.php?sid=445&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

