[[comments]]
order = 12
subject = "مطر"
text = "قصيدة أحمد مطر عن الحجاب في فرنسا<br />قمر توشحَ بالسَحابْ.<br />غَبَشٌ توغل, حالماً , بفجاجِ غابْ.<br />فجرٌ تحمم بالندى<br />و أطل من خلف الهضابْ.<br />الورد في أكمامه.<br />ألق اللآلئ في الصدفْ.<br />سُرُجٌ تُرفرفُ في السَدَفْ.<br />ضحكات أشرعةٍ يؤرجحها العبابْ.<br />و مرافئ بيضاء<br />تنبض بالنقاء العذبِ من خلل الضبابْ.<br />من أي سِحرٍ جِئت أيتها الجميلهْ ؟<br />من أي باِرقة نبيلهْ<br />هطلت رؤاك على الخميلةِ<br />فانتشى عطرُ الخميلهْ ؟<br />من أي أفقٍ<br />ذلك البَرَدُ المتوجُ باللهيبِ<br />و هذه الشمسُ الظليلَهْ ؟<br />من أي نَبْعٍ غافِل الشفتينِ<br />تندلعُ الورودُ ؟<br />- من الفضيلَهْ.<br />هي ممكنات مستحيلهْ !<br />قمر على وجه المياهِ<br />َيلُمهُ العشب الضئيلُ<br />وليس تُدركه القبابْ.<br />قمر على وجه المياه<br />سكونه في الاضطراب<br />وبعده في الاقترابْ.<br />غَيب يمد حُضورَه وسْطَ الغيابْ.<br />وطن يلم شتاته في الاغترابْ.<br />روح مجنحة بأعماق الترابْ !<br />وهي الحضارة كلها<br />تنسَل من رَحِم الخرابْ<br />و تقوم سافرة<br />لتختزل الدنا في كِلْمتين :<br />( أنا الحِجابْ ) !<br />الحُسْنُ أسفرَ بالحجابِ<br />فمالها حُجُبُ النفورْ<br />نزلت على وجهِ السفورْ ؟<br />واهًا ...<br />أرائحة الزهور<br />تضيرُ عاصمة العطورْ ؟<br />أتعف عن رشْفِ الندى شَفَةُ البكورْ ؟<br />أيضيق دوح بالطيورْ ؟ !<br />يا للغرابة !<br />_ لا غرابهْ .<br />أنا بسمة ضاقت بفرحتها الكآبهْ.<br />أنا نغمة جرحت خدود الصمت<br />وازدردت الرتابهْ.<br />أنا وقدة محت الجليد<br />وعبأت بالرعب أفئدة الذئابْ.<br />أنا عِفة و طهارة<br />بينَ الكلابْ .<br />الشمس حائرة<br />يدور شِراعُها وَسْطَ الظلام<br />بغير مرسى<br />الليلُ جن بأفقها<br />والصبحُ أمسى !<br />والوردة الفيحاء تصفعها الرياح<br />و يحتويها السيل دَوْسا.<br />والحانة السكرى تصارع يقظتي<br />و تصب لي ألما و يأسا.<br />سأغادرُ المبغى الكبيرَ و لست آسى<br />أنا لستُ غانية و كأسا !<br />نَعلاكِ أوسعُ من فرنسا.<br />نعلاكِ أطهرُ من فرنسا كلها<br />جَسَدًا ونفْسا.<br />نعلاك أجْملُ من مبادئ ثورةٍ<br />ذُكِرَتْ لتُنسى.<br />مُدي جُذورَكِ في جذورِكِ<br />واتركي أن تتركيها<br />قري بمملكةِ الوقارِ<br />وسَفهي الملِكَ السفيها.<br />هي حرة ما دامَ صوتُكِ مِلءَ فيها.<br />وجميلة ما دُمتِ فيها.<br />هي مالَها من مالِها شيء<br />سِوى ( سِيدا ) بَنيها !<br />هي كلها ميراثُكِ المسروقُ:<br />أسفلت الدروبِ ,<br />حجارةُ الشرفاتِ ,<br />أوعيةُ المعاصِرْ .<br />النفطُ ,<br />زيتُ العِطرِ ,<br />مسحوقُ الغسيلِ ,<br />صفائحُ العَرباتِ ,<br />أصباغُ الأظافرْ .<br />خَشَبُ الأسِرةِ ,<br />زئبقُ المرآةِ ,<br />أقمشةُ الستائِرْ .<br />غازُ المدافئِ ,<br />مَعدنُ الشَفَراتِ ,<br />أضواءُ المتاجرْ .<br />وسِواهُ من خيرٍ يسيلُ بغيرِ آخِرْ<br />هي كلها أملاكُ جَدكِ<br />في مراكشَ<br />أو دمشقَ<br />أو الجزائِرْ !<br />هي كلها ميراثك المغصوبُ<br />فاغتصبي كنوزَ الاغتصابْ .<br />زاد الحسابُ على الحسابِ<br />وآنَ تسديدُ الحسابْ .<br />فإذا ارتضتْ..أهلاً .<br />و إنْ لم ترضَ<br />فلترحَلْ فرنسا عن فرنسا نفسِها<br />إن كانَ يُزعجُها الحجابْ"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018165108/http://www.20at.com:80/article.php?sid=648"

