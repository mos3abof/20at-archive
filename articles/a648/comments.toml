subject = "قلا عن إسلام اون لاين ..!!"
text = "\"سنيت\" الفرنسية: سأواصل الدراسة حليقة الشعر<br />باريس- هادي يحمد- إسلام أون لاين.نت/11-10-2004<br />سنيت ترتدي الحجاب في كل مكان ما عدا المدرسة<br />قالت الفتاة الفرنسية سنيت دوجاني -15 سنة-: إن قرارها الاختياري بحلق شعرها احتجاجا على منع إدارة مدرستها من دخولها بغطاء للرأس، يعد \"أشرف ألف مرة\" من نزعها للحجاب، مؤكدة عزمها مواصلة الدراسة حليقة الشعر حتى نهاية العام الدراسي الحالي، فيما عبر والداها عن مساندتها في هذه الخطوة، في لقاءات خاصة مع \"إسلام أون لاين.نت\" الإثنين 11-10-2004.<br />وفي خطوة غير مسبوقة بالمدارس الفرنسية كشفت الفتاة الفرنسية من أصل تركي يوم 1-10-2004 أمام وسائل الإعلام عن رأسها الخالي كلية من الشعر؛ واعتبرت أن هذه الخطوة جاءت احتجاجا على منعها من الدخول محجبة إلى مدرستها \"لويس باستير\" بمدينة إستراسبورج.<br />ولا تزال تواصل سنيت دوجاني التردد على مدرستها بمدينة إستراسبورج بشمال فرنسا حليقة الشعر.<br />وأوضحت سنيت أنها ستمضي في قرارها الدخول حليقة الشعر إلى مدرستها \"حتى النهاية\"، وقالت: \"بالنسبة لهذه السنة الدراسية سأواصل حتى النهاية التمسك باختياري التوجه للمدرسة حليقة الشعر، أما بالنسبة للسنة القادمة فلا أعرف بالضبط قراري النهائي فربما تكون وجهتي مدرسة خاصة أو ربما أتحول إلى الدراسة في بلجيكا القريبة من منطقة الإلزاس الفرنسية\".<br />وعبرت سنيت عن قناعتها التامة بقرارها قائلة: \"أعتقد أن قيامي بحلق شعري مرة واحدة خير ألف مرة من الذنوب التي سأرتكبها يوميا حينما يرى الناس شعري\"، مضيفة: \"الأمر الوحيد الذي أشعر به (بعد حلق الشعر) هو أني مختلفة عن الأخريات، وبالرغم من ذلك فأنا لا أشعر بالإهانة لأن الذين منعوني من اختيار ثيابي هم الذين يجب أن يشعروا بالإهانة\".<br />وأضافت قائلة: \"لم يتركوا (إدارة المدرسة) لي أية خيار آخر؛ فقد عزلوني منذ اليوم الأول لقدومي بالبندانا (غطاء صغير للرأس) في قاعة خاصة، ولم يسمحوا لي بالدخول إلى الفصل مع بقية زملائي\".<br />وتابعت سنيت، التي تدرس في فرع علوم اقتصاد الاجتماع بالسنة الأولى من المرحلة الثانوية: \"عندما حاججت الناظر بأن هناك فتيات أخريات يلبسن البندانا، قال لي: إنه يفرق بين البندانا للموضة والبندانا للدوافع الدينية\".<br />لا ضغوط عائلية<br />سنيت تكشف عن رأسها أمام المدرسة ووسائل الإعلام الفرنسية (صورة أرشيفية)<br />ونفت سنيت أن تكون قد تعرضت لأي ضغوط من والديها قبل أن تحلق شعرها قائلة: \"هذا قراري وحدي وبداية هذه الفكرة بالنسبة لي انطلقت عندما وقفت أمام المرآة ألعب بشعري.. يومها كان بداية شهر سبتمبر (الماضي) ومع الأيام الأولى من العودة للمدرسة\".<br />وأضافت: \"يومها قررت أمام الضغوط التي لقيتها من إدارة المدرسة حلق شعري، وشرعت في حلقه وطلبت من أمي أن تساعدني\".<br />أما عن موقف زملائها من هذه الخطوة فأوضحت سنيت أنها تلقى مساندة كبيرة من زملائها في الدراسة حيث تقوم الفتيات كلما دخلت المدرسة بالالتفاف حولها وإشعارها بأنها ليست وحيدة وأن هناك من يساندها.<br />ما الفرق؟<br />وتساءلت سنيت في ختام اللقاء عن موقف فرنسا من الحريات الدينية وقالت: \"(حركة) طالبان أجبرت النساء على لبس الحجاب، والحكومة الفرنسية تجبرهم على خلعه.. فما هو الفرق بين الاثنين؟!\"، مضيفة: \"الانتقادات التي توجه للنساء المسلمات (في الدول الإسلامية) من قبل البلدان المتقدمة تتحدث عن إجبارهن على البقاء في البيوت، (وفرنسا) بمنعها الفتيات المسلمات من ارتداء الحجاب ستدفع المسلمات إلى البقاء في البيوت\".<br />مساندة عائلية<br />والدها حكمت، الذي جلس بجوار ابنته يساندها في اختيارها قال: \"أن تفعل حراما واحدا مرة واحدة خير من أن تفعل الحرام كل يوم\"، مضيفا: \"أنا أساند ابنتي في أي قرار تتخذه حتى ولو كان اختيارها نزع حجابها\".<br />وأوضح أن \"ما فعلته سنيت كان خيارها الشخصي ونحن الوالدين ليس لنا أن نجبر ابنتنا على أي خيار لا تختاره، ومثلنا في ذلك الرسول صلى الله عليه وسلم الذي ترك لأهل بيته دائما الخيرة فيما يعملون؛ ما دام الأمر يتعلق بالتمسك بالإسلام\".<br />أما والدتها مريم فقالت: \"لما طلبت مني ذلك (أن أقوم بحلق شعرها) لم أمانع في المرة الأولى حين وجدت أن هذا خيارها، ولكن بعد لحظات تركتها وشعرت بأن زلزالا تحت أقدامي\"، مضيفة: \"لقد تذكرت النساء المحلقات أيام الحرب العالمية الثانية وكيف فعلت النازية بالمعتقلات من النساء اليهوديات وغيرهن\".<br />ويقول مراسل \"إسلام أون لاين.نت\" في باريس: إن قصة سنيت أثارت حالة من الجدل داخل الساحة الفرنسية، وأحدثت وقعا كبيرا في الشارع الفرنسي بعد استضافتها يوم 10-10-2004 في أشهر البرامج الحوارية \"لا يمكن أن نرضي الجميع\" الذي<br />Read the rest of this comment..."
