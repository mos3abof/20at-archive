[[comments]]
order = 2
subject = "نقلا عن اسلام اون لاين"
text = "في تصريحات لجريدة لوموند الفرنسية اليوم السبت 2-10-2004 قالت والدة سنيت: \"لي 5 أبناء، وسنيت هي الفتاة الوحيدة بينهم.. طريقتها في التصرف تؤلمني، وشعرها المحلوق مرعب تماما\".<br />وأضافت \"الأمر يذكرني بصور المعتقلات أثناء الحرب العالمية الثانية، ولكن عندما يتعلق الأمر باختيارها لا نملك إلا أن نساندها\"."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018165108/http://www.20at.com:80/article.php?sid=648"

[[comments]]
order = 3
subject = "نقلا عن اسلام اون لاين"
text = "في تعليقها على الواقعة قالت فاطمة الزهوي رئيسة الرابطة الفرنسية للنساء لـ\"إسلام أون لاين.نت\" السبت: كنا لا نرغب في أن يصل الأمر إلى هذا الشكل من الاحتجاج \"المتطرف نوعا ما\" (حلق التلميذة المسلمة لشعرها)، ولكن يمكن فهم ما يجري بأنه شعور بالإحباط تجاه إمكانية نجاح أي حل وسط ولو كان متمثلا في حجاب خفي اقترحته الفتاة (البندانا) ورفضته المدرسة.<br />واتفق عبد الله ميلسون المسئول عن لجنة \"15 مارس\" المساندة للمحجبات في مدينة ستراسبورج مع الزهوى، قائلا: \"الحادثة تبين درجة اليأس التي تمكنت من بعض الفتيات المحجبات اللاتي يردن أن يتممن دراستهن كما يردن في الوقت نفسه احترام تقاليدهن الدينية\".<br />وقد تشكلت لجنة 15 مارس -وهي لجنة غير حكومية- من عدة شخصيات وجمعيات مسلمة وغير مسلمة بهدف العناية النفسية ومساعدة الفتيات المحجبات اللاتي يتعرضن للإقصاء بفعل قانون يمنع الحجاب في المدارس الحكومية تم تطبيقة مع بداية العام الدراسي الحالي في سبتمبر 2004.<br />وتابع ميلسون في تصريحات لـ\"إسلام أون لاين.نت\": \"إننا في لجنة 15 مارس نتابع مشكلة الفتاة سنيت منذ حوالي شهر تقريبا وهو تاريخ عودتها إلى المدرسة، وقد زارتنا عدة مرات، معلنة أنها ترفض التخلي عن حجابها، وأنها اختارت أن ترتدى البندانا، غير أن إدارة المدرسة تشددت في منعها حتى من لبس الحجاب غير الظاهر (البندانا)\".<br />وأوضح ميلسون أن سنيت قالت في المرة الأخيرة التي حضرت خلالها إلى اللجنة: إنها ستقوم بقص شعرها كلية احتجاجا على \"الظلم\" الذي يلحق بها وبغيرها من المحجبات في مدارسهن."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018165108/http://www.20at.com:80/article.php?sid=648"

