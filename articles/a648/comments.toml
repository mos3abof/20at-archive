text = "قولي لهم ..عفوا لن ارحل ..هذا وطني ..هذه ارض الله ..بلادالله ...سأعيش هنا ..وأموت هنا ..وسيبقي حجابي رمزا لله ...رمزا للحق ..وطنا آخر ألبسه علي رأسي ..أذوب فيه ..أعيش داخله ...وطنا آخر غير فرنسا ..وطنا لا يسلب مني الحرية ..لا يقتل روحي ..لا يسجنني ..<br />سيظل حجابي وطن ..!!<br />وصلاتي وطن ..!!<br />حتي المحراب وطن ..أسجد فيه وأركع ..وأقابل فيه الله ..من ذا يمنعني عن ربي ..؟؟؟<br />أتراها فرنسا قادرة أن تفعل ..؟؟<br />يا من شوهتم كل وطن ..أبعدوا ايديكم عني ..لأقول بحرية ..لا إله إلا الله ..في كل وطن ..!!<br />بيرو"
