[[comments]]
order = 8
subject = "كفاية كلام"
author = "مواطن مغموم"
posted = "2006-12-25"
text = "كفاية كلام وكفايةخناق على الفاضي والمليان ومفيش حد عايز يبني البلد ويعمرها حرام ياناس شبعنا كلام وخلافات هو مفيش عندنا الا الأخوان وعملوا ايه وهـيعملوا ايه لمايحكموا ولما.. ولما.....كفاية افلاس ان المفلسين والفاشلين هم من لايقدموا حلول لمشاكل البلد.أين نحن من الصين الدكتاتورية هل منعتهم الدكتاتورية من التقدم على دول كثيرة من العالم لا وألف لا وهم الأن يحاولوا فتح أبواب بسيطة للحرية.يعنى احنا لا طلنا عنب الغرب ولابلح الصـين وكفاية كلام"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224829/http://masr.20at.com:80/article.php?sid=1346"

