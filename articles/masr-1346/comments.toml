[[comments]]
order = 1
subject = "جماعة ترفض العنف على طول الخط"
author = "واحد من الاخوان"
posted = "2006-12-23"
text = "الاخوان يرفضون العنف على طول الخط ،هل ترى دليلا على ذلك اكثر من ان الجماعة لم تتهم بانهاتشجع او تحرض على العنف فى تاريخها ،وان من اتهم فى قضايا عنف كان بدون معرفة الجماعة ،انا شايف ان ده اكبر دليل على ان تلك الجماعة الصامدة التى تحمل اعضاؤها القتل والتعذيب والتشريد والفصل من العمل والتضييق فى الرزق والفصل من بعض الاعمال والتحويل الى اعمال ادارية واغلاق الشركات والمصانع ،هى خير مثال على الصبر والتحملفى سبيل العقيدة والهدف ،ثم انه الا تعتقدون معى ان الاخوان كان يمكن ان يستجيبوا لعنف الدولة ويردوا على بعض الاستفزازات الامنية ،انا شخصيا شاهد على رفض الجماعة اقتراحات كتير بالتصعيد من اعضائها لما استشهد اكرم الزهيرى ومسعد قطب وغيرهما .<br />هل الاخوان اللى رفضوا العنف ساعتها هيردوا على عنف الدولة عن طريق 20 طالب تربية رياضية ؟بالعقل كده ده كلام ؟"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224829/http://masr.20at.com:80/article.php?sid=1346"

[[comments]]
order = 2
subject = "عندما يصبح الحليم حيران"
author = "Drsalah_hanie"
posted = "2006-12-23"
text = "ربنا ينتقم من النظام ورموز النظام ورجال النظام الذين أهلكوا الشعب وأكلوا ثرواته بعدما عذبوه جسديا ومعنويا ونفسيا تارة بالاعتقالات وتارة بالتعذيب وأخرى باللهث وراء رغيف العيش والقائمة تطــــــــــــــــــول.<br />ثم يتهمون من يحاول أن يصلح ماأفسدوه وأن يعيد للمواطن بعض من كرامته التى أهدرت يتهموهم بالارهاب والتخلف والهمجية.<br />ولاأقول إلا حسبنا الله ونعم الوكيل فى الظالمين."
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224829/http://masr.20at.com:80/article.php?sid=1346"

[[comments]]
order = 3
subject = "كلام عقلاء"
author = "فى المانيا ام العلمانية حزب رئيسى هو الحزب الديمقراطى المسيحى ولم يقل احد ممنوع عمل حزب على اساس دينى"
posted = "2006-12-23"
text = "وانا اقترح ان يتقدم الاخوان لوضع نهاية لكل ذلك الجدل بعمل حزب اسمة الحزب الديمقراطى للاخوان المسلمين<br />حلوة دى يبقوا زى المانيا وانتهت المشكلة<br />وكاننا ملناش شغلة ولا مشغلة الا الجماعة دى<br />يا اخوانا ناقشوا مشاكل الناس<br />البطالة والفقر واطفال الشوارع وامراض الكبد وعنوسة البنات<br />ارحمونا من الندوات اياها"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224829/http://masr.20at.com:80/article.php?sid=1346"

[[comments]]
order = 4
subject = "حج ممزوج بدم المعتقلين"
author = "ياسر ابو عمار"
posted = "2006-12-23"
text = "تحياتى للوفد الصحفى اللى راح \"يحج \"على نفقة الدولة واسالهم ليه السنه دى بالتحديد ؟اكيد الكل عارف انه بسبب اخلاصكم فى اشعال موضوع الازهر والقاء الطلاب و15 من قيادات الاخوان فى السجن ،بالهنا والشفا كل الوجبات اللى اكلتوها هناك ،وربنا يتقبل منكم الحج ان كان فعلا حج فى سبيل الله مش مغموس بدم الشاطر وعز الدين وياسر عبده وصهيب الملط وغيرهم من معتقلى الاخوان .ربنا موجود وكبير ومحدش هيهرب منه ،هتروحوا فين ؟؟؟"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224829/http://masr.20at.com:80/article.php?sid=1346"

