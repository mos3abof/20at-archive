text = "احب أسئل سوال لماذاالعنف قرين الاخوان السلمين؟وهل أعمال النظام الحاكم ومايستخدمةمن أساليبه الحقيرة من إعتقالةوسياسةتجويع الشعب علىسبيل المثل القائل جوع الكلب يتبعك ليس من قبيل العنف أرجو من الاخوه الاجابة وشكرايا اعوان النظام"
