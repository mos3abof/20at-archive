[[comments]]
order = 10
subject = "لا للعنف"
author = "فهد الا سلام البنا"
posted = "2006-12-26"
text = "بسم الله انا بس الى عاوزة انى الحكومة تعمل حرية فى الراى وتا خد راى الناس فى الا خوان وانا واثق انى الا خوان برضة هتكتسح الحكومة لا نى النا س تعبت من الدكتتورية والا ستباددولية الحكومة خا يفة كدة من الا خوان الا انها عا رفة ان ليه وجود كبير فى الشارع واتحدى ان كل الى بيتكلمو عن الا خوان ومعارضية هم من المرتزقة اصحاب المنا فع يا ريت نجرب وندخل فى الدمقر يطية الصحية والحكومة والحزن الوطنى يخلى النا س تشركة الحكم بغض النظر عن الا خوان المسلمين وحسبنا الله ونع الوكيل"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224829/http://masr.20at.com:80/article.php?sid=1346"

