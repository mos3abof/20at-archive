[[comments]]
order = 12
subject = "من الضحية"
author = "احمد على"
posted = "2006-12-26"
text = "فى احداث الازهر الاخيرة نظرنا الى المظهر الخارجى واذا نظرنا الى المظهر الجوهرى سنجد ان الاخوان بنوابهم -اقصد المدعين انهم يدافعون عن الاسلام- اخطاوا خطا شديد ووقع الطلاب ضحايا اخطاء الاخوان وقياداتهم المستبدة التى يعتبرعا الناقضون السياسيون (الخائنة) فالاخوان اشد مكرا من اسرايئل والتاريخ خير شاهد - اغتيال السادات - ولكن الاخوان اصبحوا يمثلون حزبا فى الوقت الحاضر مع انهم مرفوضون من قبل الحكومة فهم العدو الاول للحكومة"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224829/http://masr.20at.com:80/article.php?sid=1346"

[[comments]]
order = 13
subject = "الاخوان"
author = "المصرى"
posted = "2006-12-26"
text = "الاخوان هم العدو الاول للنهضة والتقدم ، والحكومة طوال الزمن ما كانت مستبدة ولكن هناك من هو عدو الوطن ويجب ابادته وبالنسبة للطلاب المعتقلين فهم يجب ان يجازوا باشد من ذلك ، واعتصامات الطلاب كلها لعب عيال ، ولماذا لم يتحرك الاخوان عند غرق العبارة ، فيجب ابادة الاخوان جميع ، والحكومة بقيادة مبارك افضل نت يبيد هؤلاء الاغبياء"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224829/http://masr.20at.com:80/article.php?sid=1346"
