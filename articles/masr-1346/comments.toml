[[comments]]
order = 6
subject = "منهج الاخوان سلمي"
author = "كل عام وأنتم بخير"
posted = "2006-12-24"
text = "من ثوابت الاخوان أنها جماعة سلمية وتؤمن بالتغيير السلمي ولا تقر العنف بتاتا ، وان أى حديث غير ذلك لا يمت للحقيقة بصلة ، وأحب ان أقول للسيد فؤاد علام وتاريخه طبعا معروف ، ان من يمارس العنف والارهاب هو النظام لا غيره<br />مارأى الباشا فيما جري في الانتخابات البرلمانية الاخيرة من قمع وتزوير وبلطجة مارسها النظام ومليشياته ؟<br />ما رأى الباشا فيما اتخذه النظام من اجراءات استثنائية بتأجيل الانتخابات المحلية ؟<br />ما رأى الباشا فيما مارسه النظام وما يمارسه على مدي السنوات الاخيرة من شطب وتضييق على الطلاب وتزوير لارادتهم ؟<br />هل أساليب الزج بالسجون والقمع واضطهاد الأبرياء اسفرت عن نتائج ؟<br />اذا كان الباشا يتسائل عن حقوق الأقباط وموقف الاخوان للمرأة أدعوه الى قراءة أدبياتهم بانصاف لا بعين أمنية باطشة ومزورة للحقائق ؟"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224829/http://masr.20at.com:80/article.php?sid=1346"

