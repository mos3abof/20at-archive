author = "انتا اتهمتنى بالهمجية ......... اة تقصد هيا دى الموضوعية اللى بتتكلم عليها"
posted = "2006-02-02"
text = "بص يابنى ادم السعودية كلها شعب واسلرة حاكمة متخلفين لية بقى<br />1- انتم تمارسون الازدواجية فى حياتكم يعنى تحرص على الصلاة واظهار التقوى ولكن معاكسة النسوان ووضع افلام الفنانات العرية المعدة سلفا عن طريق سعوديون ببرامج الفوتوشوب لاباس فيها وحين اقول الشعب اقصد ان الامر هو بالتاكيد ظاهرة ليس فرد ولا اثنان بل قل جزء مهم جدا من المجتمع السعودى حتى ان النسوان السعوديات الراغبات فى علاقات مع الشباب تعلم علم اليقين انها ليست علاقة عابرة لكن حتما ستنتهى بالجنس<br />2-انتا لماذا تذهب الى مصر ولماذا الان التركيز على لبنان والمغرب وماذا كنت تفعل فى اوروبا الاجابة واحدة هيا ....... الجنس ارجوك لاتقل لا والا لماذا تصويت السعوديون فى ستار اكاديمى وملكات جمال لبنان وفى المواضيع الفنانات هوالاعلى......... لا اقول انك تمارس الجنس فبالتاكيد فى السعودية اناس محترمون ومتقون بلاشك ولكنى اتكلم عن ظاهرة<br />3- لماذا الاسرة الحاكمة واقول لان الدولة فى السعودية تمارس سياسة الضحك على النفس يتفاخرون باعلى معدل تبرع لفلسطين وهم يعلمون علم اليقين ان معدل الانفاق على ستار اكاديمى اعلى بكثير من تبرع فلسطين<br />2- لانهم يبثون روح الغرور فى المواطن السعودى بعدم كشف العيوب واظهار امور غير صحيحة تماما كما كانت مصر فى الستينات<br />اخيرا استطيع ان اسبك امرمط بيك الارض لكن اريدك ان تفكر فى هذا الكلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

