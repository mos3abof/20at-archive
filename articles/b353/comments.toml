[[comments]]
order = 19
subject = "لا أحد يسب حكومتنا الشريفه الكريمه"
author = "اليك يا المصري"
posted = "2006-03-02"
text = "وسمحت ياالمصري التزم حدودك ونحن أطهر دوله في العالم والحمدلله وأفقه دوله في الدين. والصراحه انا زرت مصر انتم عندكم ناس جدا جهال حتى المعامله ماتعرفون تتعاملون.ومن ناحية التبرع هذا ليس تفاخر بأموالنا بل يكون قدوه للذي لم يتبرع وهذا ماتعلمناه بالدين والحمدلله نحن نتبرع احسن من الي ماتبرع. وبعدين تقول حنا شعب نتغرغر باموالنا حنا شعب غير مغرور بل هذا طبعنا لاننا ابناء عز والحمدلله وانت اتحس انه حنا شعب مغرور لانك انت تغار منا. والحمدلله نحن شعب واثق من نفسنا وليس شعب مغرور ونحن شعب محترم ومثقف وليس شعب عند كل مطعم رقاصه مثلكم يا المصريين ونحن شعب ليس وراء الجنس بل انتم يالمصريين وراء الجنس شعب كله ثنائي ثنائي يعني شاب وفتاه وهذا ما تسميه بالحريه وهل كان في عصر النبي صلى الله عليه وسلم ثنائي. وياالاجانب اصلا مالكم دخل في مملكتنا هذا الموضوع يناقش الاعزب السعودي فقط ليس الاجنبي الي مو عاجبه يرجع لديرته و احترموا البلد<br />الي معيشكم بعد فضل الله سبحانه. الحمد لله على العافيه والنعمه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 20
subject = "الى السعودى اللى فوق"
author = "واحد مصرى"
posted = "2006-03-02"
text = "السلام عليكم......<br />الى الأخ السعودى أرجو منك الا تتكلم عن المصريين أجمع بهذه الصوره لأن كل بلد فيها الصالح وفيها غير الصالح أو الفاسد وليس كل المصريين فى شارع الهرم وهذه الأماكن الفاجرة يوميا ولا حتى 10 % من الشعب المصرى بل قله منحرفه وربنا الهادى ولاتقل انكم شعب اغنياء وهذا الكلام اللى مالوش لازمه لأن الغنى غنى النفس والغنى بالأخلاق التى لاتشترى بثمن وبخصوص انك بتقول اللى مش عاجبه النظام يرجع بلده<br />أولا ربنا هو الذى يرزق العباد مش سيادتك<br />ثانيا هؤلاء الشباب الذين يعملون فى المملكه يقدمون لكم خدمات نافعه لكم ويأخذون مقابل عنها ولم يطلبوا العمل عندكم بل أنتم الذى تطلبوهم<br />ثالثا ربنا يهديك وتبطل غرور مثل كثير من العرب وليس المصرى ولا السعودى ولا الكويتى ولا القطرى ولا ...............<br />والسلام عليكم ورحمه الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

