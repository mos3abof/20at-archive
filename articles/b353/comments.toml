[[comments]]
order = 4
subject = "الحمد لله على نعمة العقل"
author = "و الله يا اخي الفاضل انا لا محموق و لا حاجة"
posted = "2006-01-30"
text = "بس الحمد لله ربنا اكرمني بعلق افكر فيه وما اسمحش لاي حد او اي موقع لا عشرينات و لا غيره انه يضحك عليا بمقالاته<br />و انا بس حبيت اقول لاخوانا في عشرينات عن رايي في طرحهم و اطلب منهم تفسير عن طريقة الطرح دي و انتقاءهم للمواضيع بتعاتهم<br />يا ريت محدش يقلب المواضيع لسب و شتم ، احنا اخوات و مافيش داعي للسب بينااتقوا الله و اعرفوا انه كل كلمة هنتحاسب عليها<br />لا يسخر قوم من قوم<br />استغفر الله العظيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

