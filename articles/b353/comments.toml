[[comments]]
order = 24
subject = "الى الكاتب (الى الغير محترم akg"
author = "T"
posted = "2006-06-05"
text = "1- أنت تتكلم و كأن كل مصلي يعاكس و دخلت قلب كل إمرأة و كشفت عن نواياها.<br />2- أنت تشبه مصر (الي هي بلدك) و البلاد العربية الأخرى على أنهابانكوك مثلا، وأن الذهاب الى أي مكان للجنس فهذا تفكير ضحل و يعكس عن ما تفكر فيه انت دائماًو يتضح ان تقريبا كل العالم عندك معمول للجنس و الرذيلة.و التصويت الأعلى لأن السعوديين يمتلكون المادة التي لا تمتلكها أغلب الدول العربيةليس إلا.<br />3- لا الأسرة الحاكمة ولا غيرهم يستطيعون أن يتحكموا فيما يصرفه السعودي.و أي أحد يساعد أخيه الفلسطيني أو المصري أو أي عربي أكيد يفتخر، و السعودية خيرها على كل المسلمين و العرب و هذا معروف من الكل.<br />4- أنت من نفسك تقول أنكم كنتم هكذا أيضاً في الستينات. السعوديين من أكثر الشعوب مناقشة لقضاياها، مثال (الحوار الوطني) فالكل يعرف من هم و من يمثلون.<br />أخيرأ.. أستطيع أن أسبك امرمط بيك الأرض لاكن أريدك ان تفكر في هذا الكلام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 25
subject = "(للعائلات فقط)! نعم ونعم"
author = "مصرية .. سعودية"
posted = "2006-06-14"
text = "للاخوة المصريون أقول<br />هل توافق على بقاء عائلتك التى هىاختك او والدتك او زوجتك في مكان ترفيهي يعج بالشباب ؟؟<br />\"إن كل ما ناقض الشريعة فهو باطل\".<br />قال ابنُ مسعودٍ –رضي الله عنه-: «إنَّها ستكون أمورٌ مشتبهات، فعليكم بالتؤدة، فإنَّ الرجل يكون تابعاً في الخير، خير من أن يكون رأساً في الضَّلالة».<br />ومن جادل بلا حُجَجٍ وأعرَضَ عن النصوص ومشى مع رأيه وهواه كما يفعله كثيرٌ من المتكلّمين فهو من المذمومين<br />اتقوا الله فيما تخطه اقلامكم .. والسعودية بلد خير وامن وامان بلد الحرمين الشريفين قبلة المسلمين وهى التي تطبق شرع الله كما يستوجب.. فلماذا تريدون لهذه البلد الفتنة والاختلاط والفسوق ..<br />كل الحب للملكة العربية السعودية ولشعبها الكريم ..<br />مصرية درست وتتلمذت حتى الثالث الثانوي على ايدى معلمات سعوديات فاضلات كريمات بأخلاقهن وعلمهن ودينهن .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

