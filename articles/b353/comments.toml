[[comments]]
order = 31
subject = "هراااااااااااااااااااااااااء"
author = "سعودية بكل فخر000ٍٍٍٍ"
posted = "2006-09-10"
text = "اتمنى ان تطرح موضوعات ارقى من هذه00<br />والذين قاموا بالسخرية من السعودية واهلهااقول لهم بما انكم تعدون انفسكم شرفاء ونزهاء لهذه الدرجة لوكان لديكم ذرة نزاهة لكانت اساليب تعليقكم ارقى من ذلك ولستخدمتم اسلوب النقد البناء ومن حيث انكم تظنون في قرارة انفسكم انكم تخدموننافنحن لم ندعوكم لذلك وان حدث ذلك فلن تتكرموا علينابدون مقابل بل على العكس من خدماتكم هذه((تلموا على ألوبكم آآآآآد كده))واحب ان أاوكد ان اكبر دليل على علو السعودية استهدافها وتقصي عثرات فئة من ابنائها(فئة وليس المجتمع بأسره)ونشر هذه العثرات ومن المعلوم والمعروف ان كل ناجح تتقصى عثراته واماالذي هو دائما عاااااااااثرفلن يكون الاهتمام به قدر الاهتمام بالناجح لانه وبكل بساطة متعثر دوما0000000<br />واحباأوضح بما انكم تقولون بان السعوديون هم اكثر المشجعين لقنوات الفسق والضلال الذي غالبا انتم من تكونون وراءهاان السعوديون يمكن ان يكون لهم عثرات ولكن تفوقها الانجازات ففي احصائية اكد ان مجموع ابتكارات طلاب وطالبات السعوديةيفوق عددهاابتكارا وابداعات طلاب وطالبات الدول العربية مجتمعة ولكم واااااااافر الشكر0<br />*انني اقصد في هذا التعليق كل من سولت له نفسه بالتشكيك في عادات وتقاليد اهل بلاد الحرمين كما ااوكد ان اهل هذه البلدة التي وجهت لها تعليقي ليسوا جميعهم برداءة سلوك من فامو ا بالتهجم على السعودية0"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

