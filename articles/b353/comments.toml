text = "السلام عليكم<br />انا مصرى واخى يعمل بالمملكه ولكن مع كثرة شكرة فى النظام فى كل شئ فيها من مرور ونظافه شوارع والجو الدينى الطيب الذى تفتقده كثيرا من الدول العربيه تظل فعلا مشكلة اماكن الخروج للعوائل وانا مع هذا النظام الاسلامى السليم ولكن لابد من وفرة اماكن ليس بالكثير ولكن تكون متاحه ومتنفس للعزاب فهل كل زنبهم انهم عزاب والله لوكانت تكاليف الزواج مقدور عليها لوجدتهم متزوجون كلهم وترى كل الاماكن عوائل وشكرا............"
