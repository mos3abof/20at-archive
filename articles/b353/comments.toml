[[comments]]
order = 0
subject = "في ايه يا جماعة"
author = "الملازم"
posted = "2006-01-29"
text = "انا عايز اقول حاجة وياريت تتقبلوها برحابه صدر<br />انا بصراحة بحس ان الموقع يتناول المواضيع ذات العلاقة بالسعودية بنبرة هجوم او سخرية على العادات اللي فيها اللي هي في مجملها عادات اسلامية وعربية اصيلة, اي نعم هناك بعض التشدد لكن مع هذا التشدد القليل فالوضع افضل من لبنان مثلا كفاية ان الاذان لما بيأذن في السعودبة المحلات بتقفل عشان الصلاة فيا جماعة المفروض نمدح ونحترم هذه التقاليد الاسلامية والعربية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 1
subject = "بتعملوا كده ليه ؟؟؟"
author = "السلام عليكم"
posted = "2006-01-29"
text = "اولا بصراحة تامة أنا ما قرأتش الموضوع عشان انا فعلا \" قرفت \" من اسلوب عشرينات في تناول كل ماهو سعودي ، مالكوا يا كتاب عشرينات ؟؟؟<br />انتوا بتشوفوا بعين واحدة و لا ايه ؟؟؟<br />بتتكلموا في الاخلاق و عاملين نقاد على العالم و اخطاؤه ..<br />حد قالكوا احنا عايزين اي حاجة بتنقد البلاد العربية ؟؟؟ حد قالكوا احنا مخنوقين اوي و محتاجين نفش في اي حكومة ؟؟؟؟<br />حقيقي نفسي افهم المنطق بتاعكم<br />أما ثانيا بقى ، فياريت تكونوا \"حياديين \" في مواضيعكم و تتناولوا كل المواضيع المطروحة على الساحة مش بس المواضيع \"اياها \" اللي بتسبب حساسيات و مشاكل و فلان يسب فلان و المواطن الفلاني يسب مواطن البلد الفلاني هل اسلوب الطرح ده عشان بس يكون عدد زوار الموضوع كبير ؟؟؟<br />و ثالثا و الاهم ، انا من امبارح بطلب زي غيري بتناول موضوع سب النبي صلى الله عليه و سلم ، و تناول التحركات اللي حصلت في العالم الاسلامي ، و ما حبتش اني اسئ الظن فيكم و اقول انه انتوا مش قادرين تيجوا على نفسكوا و تكتبوا حاجة كويسة عن السعودية اللي على المستوى الشعبي و الحكومي عملت اجمد حاجة !! و انابعيش في الخليج و قرات عن ردود فعل شعبية و رسمية في الخليج ما حصلتش في اي بلد تاني ما تخلونيش و غيري نظن الظن ده و اثبتولنا العكس رجاء<br />شكرا ليك يا اخ الملازم انا فعلا قرفت من المواضيع بتاعة عشرينات و اعتذر عن الكلمة دي لو كانت جارحة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 2
subject = "الى من يهمة الامر"
author = "واحد كارة ام السعودية"
posted = "2006-01-30"
text = "عاوز اسال سؤال واحد السعودية دى اكتر بلد متخلف فى العالم وهما بيجملوا نفسهم بفلوسهم ...........<br />لية بقى احنا نتكلم عن المتخلفين دول مش كفاية بنشوفهم فى ام الدش ليل نهار<br />اما الاخ اللى محموق على السعودية وبيكتب اشعار عن السعوديين<br />خش البالتوك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

