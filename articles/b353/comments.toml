text = "السعودية بلد طيب ، فيه خيرات كثيره ونعم انعم الله بها على هذا البلد لاتعد ولاتحصى ، وشرف الله اهلها بخدمة الحرمين الشريفين ، وليس الهرمين وشارعهما ، او المراقص الليلية ، او او او ."
