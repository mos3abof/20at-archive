[[comments]]
order = 6
subject = "مينفعش ي جماعة"
author = "الملازم"
posted = "2006-01-30"
text = "فعلا يا محمد السعودية والخليج عموما ناس عندهم عادات عربية واسلامية اصيلة اتحدى اي حد فيكوا انه ينزل اي دولة خليجية ويلاقي هناك شارع زي شارع الهرم لا وعلى العلن كمان وبعدين في حاجة انا من اول معرفت هذا الموقع لم اقرا ولا موضوع يهاجم الفسق في لبنان بل شغله الشاغل النيل من العادات العربية في الشعودية مع اني سمعت ان هذا الموقع تابع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 7
subject = "أضحك ببلاش"
author = "أكرم بس"
posted = "2006-01-30"
text = "و الله أنا ضحكت على التعليقات أكتر من الموضوع<br />بالنسبة للموضوع هو مضحك لأني مش عارف ليه اللي كتبه ما قالش ان هو رئيس جمعية الدفاع عن العزاب<br />من استطاع منكم البائة فليتزوج و من لم يستطع فعليه بالصوم فهو له وجاء<br />و مادام العزاب بيتعذبوا أوي كده يتجوزوا يا سيدي ( هيتظبطوا و الله )<br />اما التعليقات فهي مضحكة أكتر لاني حسيت اني في ماتش كورة او في متدى بيكلم عن الكرامة العربية و سقول الدم العربي و الحاجات دي<br />يا جماعة احترموا الرأي و الرأي الاخر<br />و سلملي على قناة الجزيرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 8
subject = "sehs"
author = "إلى الأخ اللى بيقول : ما يتجوزوا وخلاص"
posted = "2006-01-30"
text = "جبت التايهه يابن الإيه<br />مش عارف من غير الحل المعجزه بتاهك ده كنا هنعمل إيه!!!!!!!!!<br />إنت ساكن فى أنهى كوكب؟<br />أصل عندنا نحن سكان كوكب الأرض شارع جامعة الدول العربيه الممتد من أحمد عرابى لشارع السودان ( أقصد البلاد العربيه الممتده من الخليج إلى المحيط ) عندنا أزمة زواج مشكلتها : التكاليف و العادات<br />و أنت جى تقول : ما يتجوزوا و هيتظبطوا و كلام أهبل من ده<br />ربنا يشفى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 9
subject = "ياللي كاره ام السعودية"
author = "akg"
posted = "2006-01-30"
text = "انت لما تحب تحكم بالتخلف أول علم نفسك الموضوعية بالكلام تقول ادخل البالتوك ليه؟<br />هو السعودية كلها اجتمعت بالبالتوك ؟؟؟؟؟<br />اللي صادفتهم جزء من مجتمع والمجتمع ينقسم الى افراد يختلفون بالاخلاق والفكر والثقافة<br />زي مصر مثلا فيه ناس (الحمد لله على نعمة العقل ) وغيره يمثلون بلد حضاري وعقلية مثقفة<br />لكن لو ماعرفت مصري غيرك كنت قلت ان مصر بلد همجي شعبه يتكلمون بما لا يفقهون<br />وهنا مربط الفرس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 10
subject = "حبيبي يا نبي"
author = "سلااااااااااااااااام عليكم"
posted = "2006-01-31"
text = "اسمحولي مافيش حتة نناقش فيها اللي بيحصل من اساءة لنبينا الكريم من الدنمارك<br />فانا هكتب تعليقي هنا ..<br />يا ريت نقاطع كلنا المنتجات الدنماركية و نحفز بعض و ننشر الرسائل المحفزة لبعضنا و نشد على ايد بعض عشان الموضوع يستمر<br />اليوم هو غرة السنة الهجرية الجديدة .. كل سنة و انتوا طيبين .. يا ترى هنقدم لنبينا محمد صلى الله عليه و سلم هدية بسيطة بالمناسبة دي و لا لأ ؟؟؟؟<br />اعتقد انها سهلة جدا .. نلتزم بحبة و طاعته و تقليده<br />و نقاطع و نستمر في حملتنا ضد الاساءة للنبي في كل مكان ...<br />و يا ريت تكون ردة فعلنا حضارية زي المقاطعة و بعث ايميلات و رسائل و مسجات محترمة .. احنا مش متطرفين و لا يمكن سلوكهم الشائن يخرجنا من اخلاقنا...<br />كل سنة و انتم طيبين بمناسبة السنة الهجرية الجديدة<br />كل سنة و الاسلام و ابناءه اعزه و اعداءه اذلة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 11
subject = "ولا يهمك"
author = "نفس صافية"
posted = "2006-01-31"
text = "السلام عليكم ابو العينين .<br />يا اخويا الكريم انا فهمت مشكلتك وانت ما فهمت سبب النكد اللي انت عايشو<br />تعال عندنا في الغربية وسيب الرياض وانت تعيش مبسوط ، مو قصدي الرياض مو حلوة ، طبعا لا لكن انا اقدر اعيش فيها لكن انت لا طبعا .<br />تعرف ليه ؟<br />اسمحلي انت عايش في المنطقة الوسطى وعاداتك بعيدة عن عاداتهم ولهجة كلامهم واسلوب تعاملهم ، يعني ما راح تفهمهم ولا تقدر تفهمهم ويفهموك ـ فأحسن شي تجي هنا في الغربية جده مكة ـ حتنبسط اكيد عشان عاداتنا هنا قريبة من عادات مصر وراح تلاقي جو يناسبك وكفاية عليك ابحر تنسيك المنتزهات الشبابية اللي تخليك تصرف اربعين ريال لليموزين<br />وبيوت حلوة وراقية ، بس لا تدور بيت في احياء قديمة تتعب فيها تعال في المناطق الحضارية الراقية وانت ترتاح .<br />ولو ما لقيت بيت الله يحييك عندنا وفي عيوننا اخويا الكريم<br />*** حسبي الله ونعم الوكيل على كل من يسيء للرسول صلى الله عليه وسلم من الدنماركيين وأذنابهم ***"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 12
subject = "يا سلام"
author = "السلام عليكم"
posted = "2006-01-31"
text = "اخواني كيف حالكم<br />اول شئ التحدي اللي فوق ،، تحدي ايه ؟؟ و بعدين لما جيتوا تحللوا .. ياترى الحاجات اللي تحللت هل كانت موجودة في زمن الرسول ؟؟؟<br />مش هو ده منطق التحريم و التحليل يا اخي ،، فلكل زمن ظروفه و سن القوانين في اي مكان يحدث في اطار محدد ... كل بلد يقيس الامور و يحاول يسن القوانين اللي في مصلحة البلد و احيانا بتكون قوانين خطأ ،، بتحصل عادي ..<br />اخجل ان اسألك سؤال بس سأسألك اياه عشان هو نمط سؤالك \"تحديك \" ...<br />انته بتاكل بملعقة ؟؟؟؟؟ هو الرسول صلى الله عليه و سلم كان ياكل بمعلقة و لا بايده ؟؟؟؟؟<br />على فكره انا مش مستني رد على سؤالي عشان انا مش مقتنع بالسؤال هو بس تحدي لصاحب التحدي ؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 13
subject = "حكيم و نص"
author = "كل سنة و انتوا طيبين يا طيبين"
posted = "2006-01-31"
text = "اخوي حكيم انا معاك فيما قلت ،، بس للاسف احس انه في بلداننا لا ننقد نقد بناء ، نحن دائما نسخر من انفسنا و من الاخر على حد سواء ..<br />بس للنقد اسلوب ، و النقد اذا كان الهدف منه اصلاح الاخطاء و تحسين الامور فسيظهر بصورة مختلفة تماما عن النقد الذي يأتي مليئا بالسخرية و الاستهزاء ..<br />لانه النصح بالكلمة الطيبة و بالتي هي احسن ، يعني اي انسان لو نصحته بطريقة سواء فيها عصبية او صريخ او فيها استهزاء او احتقار بالتأكيد لن يسمع منك بل ستحصل مشكلة .. هذا شئ طبيعي و معروف ..<br />فاتمنى انه موقع عشرينات ينقد و ينقد و ينقد بس ينقد صح ن ينقد كل شئ في العالم بشكل صحيح و محترم و لائق ..<br />و كل سنة و امة محمد صلى الله عليه و سلم بعزة و نصرة و حب و خير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 14
subject = "أخي تحدي التحدي من ياسلام"
author = "السلام عليكم"
posted = "2006-01-31"
text = "انا اولا اعتذر لو كان كلامي زعلك ، ان شاء الله ما يكون زعلك<br />انا حسيت انه في سؤالك محاولة لاثارة المشاكل بطرح سؤال بطريقة بدت لي ليست منطقية و انما هجومية.. فأنا اعتذر مرة اخرى<br />و شكرا على اسلوبك اللائق جدا في ردك الثاني بارك الله فيك<br />و شكرا انك حاولت ترينا الجهة الاخرى من العملة لاني فعلا لم اعش الوضع هذا<br />هذا رد سريع لاني اضطر اقطع النت الان و اعدك اني ارد عليك مخصوص قريبا ..<br />السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 15
subject = "اخي يا سلام من تحدي"
author = "السلام عليكم ورحمة الله وبركاته"
posted = "2006-01-31"
text = "أولاً اشكرك على الاعتنذار لي وغن كان لا يوجد إعتذار بين الأخوة في لا الإسلام فكلنا أخوة. لكن هذا الموقف يدل علي طيب خلقك. وهذا ما انشده في كل مسلم. فانا فقط أريد أن نتناقش دائما بالحجة والمنطق في قضايانا وان يكون الهدف من نقاشاتنا دائما الوصول إلى المصلحة وحل مشاكلنا والا نرد بلا منطق ونلجا للسباب كما أري في كثير من التعليقات على هذا المنطق .فكنم يحزنني هذا الأمر. لأني اعلم أن هناك الكثير ممن يقرؤن هذه التعليقات وبينهم غير مسلمين فماذا سيقولون عنا . ونحن يجب أن نكون قدوة لغيرنا ونماذج تعبر عن حقيقة المسلم. وأخيرا كل عام وسنه هجرية جديدة سعيدة عليك وعلى كل اخواني في الاسلام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

[[comments]]
order = 16
subject = "الى التحدي من يا سلام مرة اخرى"
author = "السلام عليكم"
posted = "2006-02-02"
text = "اخي الفاضل ، اردت ان اضيف تعليق لسبب واحد و هو انني وعدتك بان ارد قريبا على النقاط اللي قمت بطرحها<br />بس الان استميحك عذرا ،، انني لا استطيع<br />فبعد المقال التي اضافه الموقع بعنوان \" للرسول رب يحميه\" فانني ليس باستطاعتي التعليق على اي مقال في هذا الموقع .. و لا اريد ان اتعب نفسي بقراءة مقالاتهم ان كانوا يتعاملون مع قرائهم باسلوب كالذي فرضوه في مقالهم المذكور<br />فرصة سعيدة التحدث معك يا طيب ..<br />اللهم انصر رسولك و وفقك خطى من ينصروه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133841/http://www.20at.com/article2.php?sid=353"

