[[comments]]
order = 6
subject = "الناس معادن"
author = "فلان"
posted = "2006-06-20"
text = "شاعر عقر اعتقد انه المرحوم فؤاد قاعود بيقول :<br />اعوذ بالله من النهازة والنهاز<br />من كل اعرج ضمير عمل الشرف عكاز<br />نفوس صايبها العفن بس الوجوه برواز<br />اعوذبالله من الكدابة والكداب<br />من كل طاووس مخبى تحت ريشه غراب<br />فالواالايدين اللى تتمد للخسيس تنعض<br />صنف الحدادى يدادى وفى الفرص ينقض<br />انا قلت اصل الخلايق معادن والزمن فراز"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121832/http://masr.20at.com:80/article.php?sid=136&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
