[[comments]]
order = 0
subject = "مسلمه"
author = "مسلمه"
posted = "2006-04-06"
text = "طبيعى جدا امال الحكومه يعنى هتقول ايه ولا شيفروليه يعنى<br />الحمد لله انهم مقالوش ان اللى كانو راكبين العباره هما السبب؟؟؟؟<br />حسبى الله ونعم الوكيل فى كل من ظلمنا<br />اللهم لا تهلكنا بما فعل السفهاء منا<br />اللهم ارحم موتنا وارحم موتى المسلمين اللهم توفنا وانت راض عنا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525020719/http://masr.20at.com:80/article.php?sid=136&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 1
subject = "الضمير"
author = "كريمة"
posted = "2006-04-06"
text = "نفسى أعرف صاحب الشركة والقبطان ده بيناموا على المخدة بليل ازى وطوق دم أكثر من 1000غارق حول رقابهم ولا ضميرهم مرتاح حسبنا الله ونعم الوكيل فيهم"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525020719/http://masr.20at.com:80/article.php?sid=136&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "إلى الأخت كريمه"
author = "حسين"
posted = "2006-04-07"
text = "كنت بس عاوز أوضح لسعادتك حاجه ..<br />الأخ القبطان مش بينام بليل بس...<br />دا مقضيها نوم صبح و ليل و ضهر و عصر كمان..<br />لأن ببساطه ... القبطان مات!!!!<br />و الخبر موجود فى نفس ذات الموضوع اللى بتعلقى عليه !!!!<br />و السلام عليكم و رحمة الله و بركاته"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525020719/http://masr.20at.com:80/article.php?sid=136&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 3
subject = "حسبى الله و كفى"
author = "مناضل انترنتى قديم"
posted = "2006-04-10"
text = "السلام عليكم و رحمة الله و بركاته<br />يقول تعالى الذين إذا اصابتهم مصيبة قالوا إنا لله و إنا إليه راجعون<br />و لا نملك إلا أن نقول لأهل الضحاياإن لله ما أخذ و لله ما أعطى و كل شىء عنده بأجل<br />ولحكومتنا الرشيده حكومة رجال الاعمال لا نقول إلا قوله تعالى<br />و لا تحسبن الله غافلا عما يعمل الظالمون إنما يؤخرهم ليوم تشخص فيه القلوب و الأبصار<br />و لشعب مصر العطيم لا أقول إلا كما قال تعالى<br />إن الله لا يغير ما بقوم حتى يغيروا ما باتفسهم"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525020719/http://masr.20at.com:80/article.php?sid=136&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 4
subject = "تصحيح"
author = "مناضل انترنتى قديم"
posted = "2006-04-10"
text = "ورد خطا فى تعليقى قوله تعالى<br />و لا تحسبن الله غافلا عما يعمل الظالمون إنما يؤخرهم ليوم تشخص فيه القلوب و الأبصار<br />و الصحيح هو<br />و لا تحسبن الله غافلا عما يعمل الظالمون إنما يؤخرهم ليوم تشخص فيه و الأبصار الايه 42 سورة أبراهيم"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525020719/http://masr.20at.com:80/article.php?sid=136&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

