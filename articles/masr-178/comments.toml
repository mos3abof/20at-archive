[[comments]]
order = 2
subject = "إين حقى يا حاكم طظ"
author = "مصريى"
posted = "2006-04-22"
text = "زار الرئيس المؤتمن<br />بعض ولايات الوطن<br />و حين زار حـيّـنـا<br />قال لنا :<br />هاتوا شكواكم بصدق في العلن<br />و لا تخافوا أحدا .. فقد مضى ذاك الزمن .<br />فقال صاحبي حسن :<br />يا سيدي<br />أين الرغيف و اللبن ؟<br />و أين تأمين السكن ؟<br />و أين توفير المهن ؟<br />و أين من يوفر الدواء للمريض بلا ثمن ؟<br />يا سيدي<br />لم نر من ذلك شيئا أبدا .<br />قال الرئيس في حزن :<br />أحرق ربي جسدي !!!<br />أكل هذا حاصل في بلدي ؟!!<br />شكرا على صدقك في تنبيهنا يا ولدي<br />سوف ترى الخير غدا .<br />و بعد عام زارنا<br />و مرة ثانية قال لنا :<br />هاتوا شكواكم بصدق في العلن<br />و لا تخافوا أحدا .. فقد مضى ذاك الزمن .<br />لم يشتكي الناس..<br />فقمت معلنا:<br />أين الرغيف و اللبن ؟<br />و أين تأمين السكن ؟<br />و أين توفير المهن ؟<br />و أين من يوفر الدواء للمريض بلا ثمن ؟<br />معذرة سيدي..<br />و أين صاحبي حسن؟؟"
archived = "2006-08-19"
capture_url = "https://web.archive.org/web/20060819030329/http://masr.20at.com:80/article.php?sid=178"

