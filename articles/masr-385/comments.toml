[[comments]]
order = 14
subject = "نجوم مصر يتالفون فى كان"
author = "علشان احنا مع بعضينا : صح بس فى الخيبة وبس ونبقى متجمعين فى مهرجانات كان وفى العرى والفضايح لكن فى مهرجانات اسرائيل وامريكا لقتل الفلسطينيبن والعراقيين ساعتها نبقى نايمين والنبى مش دى وكسة تقيلة."
posted = "2006-06-20"
text = "لا والشيخ عادل امام شيخ عمارة جانكيزخان رايح يمسك ايد الاخ هيثم ويقول ولا اللى واقف يلقى خطبة نصر اكتوبر :اليوم تم ميلاد نجم جديد مش دى وكسة وخيبة بدل مايقول اليوم تم ميلاد صلاح الدين اللى هيحر فلسطين من ايدى الغاصبين رايح يقول الكلام ده. ولا اما تيجى للى يقول ان اللى كتبوا الردود دى ارهابيين الارهابيين والاخوانجية مش فاضيين لهلس السينما . ويعينى على سينمتنا اللى بخير والله ما شفت خير اكتر من العرى والسفالة اللى كانت فى فيلم عمارة وسخينكان . ان كان يافنانين ويامنتجين فلوسكم مدايقاكم وفروها للى يعرف قيمتها حاجة ارف على راى المثل: الفلوس مع التيوس والمثل اللى بيقول : يدى الحلق للى بلا ودانز<br />ومحدش بيبص علينا: فعلا ولا عمر السينما الاجنبية هتبص عليكم الا اذا لبست الممثلات فساتين عارية اكثر من كده وهما عايزين ايه غير انهم يشوفوا عوراتنا احنا يامسلمين واحنا عملين زى الهطل اللى بيجروا ورا اى حاجة وخلاص السنه دة الموضة فى الافلام والاغانى العرى نعمل زيهم ونعرى جسمنا من غير تفكير . وعلى العموم فى الاخر ارجع واقول صحيح فضحنا وكسفنا فى كل مكان لكن ربنا قادر يهديكم"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122347/http://masr.20at.com:80/article.php?sid=385&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 15
subject = "الانحلال الاخلاقي و الديني"
author = "بنت مسلمة مصرية"
posted = "2006-07-01"
text = "عجبني معظم الآراء لانها بتتكلم بفهم وحب للدين وللعروبة ولكن يا جماعة لا بد من استخدام ألفاظ مهذبة مهما كان انفعالنا ولا ننسي اننا مسلمين والمسلم هو من سلم المسلمون من لسانه ويده فيجب ان نعبر عن رأينا بكل جرأة ووضوح و أتاسف لاني لم ادخل في الموضوع بعد......<br />الناس دول فاكرين نفسهم ممثلين هما فعلا كده ولكن ممثلون بلا اخلاق بلا دين ارادوا ان ينتقلوا الي العالمية دون النظر الي مصدر هذه العالمية انهم الغرب الذين يحاولون دوما افسادنا عن طريق ديننا فاذا اردت ان تكون عالمي متحضر حقق هذا بالسفالة وقلة الدين لا بالعلم والجهد هذا ما حاولوا غرسه في عقولنا علي مدار السنين شئ فشئ واندهشت من المقالات الكثيرة التي تشجع علي الفسوق والتخلي عن الدين باعتباره تخلف فالزمن تغير ولا يصح ان يستخدم في حياتنا حقيقة صدمت بهذا الكلام.......<br />و بالنسبة لعمارة متخلفان فهو فيلم وقح لا اكثر وقد خدع الناس بقوله انه يحل المشكلات الاجتماعية هو في الحقيقة يعرض المشكلات ولكن تم استخدام الرواية بكل وقاحة و جرأة كبيرة لا تتناسب وهذا من اجل الوصول الي العالمية...........<br />ونهاية باقول لعادل امام نفسي اشوفلك فيلم لا يحتوي علي مناظر سافلة اه حقيقة نسيت هذا سيجعل الناس يتهموني بالتعقيد والتخلف لمجرد رفضي الصريح لهذه المشاهد<br />يا استاذ عادل باين عليك مش عارف ان ثلاثة لا ينظر الله لهم يوم القيامة اولهما اشيمط زان لاقتراب اجله<br />فارجوك ان تتوب الي الله في شهورك الاخيرة واحب اقولكم يا جماعة اني مش سيدة ناضجة ولا حاجة انا فتاة عندي 15 سنة"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122347/http://masr.20at.com:80/article.php?sid=385&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 16
subject = "والله يستهلو العرب كل ده"
author = "العرب والتفكك"
posted = "2006-07-23"
text = "صل ما العرب فى غفله<br />كل ما العرب فى تفكك<br />كل ما كـــل واحدوى حاله<br />كل ما مش العرب مترابط مع بعض<br />كل رئساء العرب كل واحد خايف عاى السلطاه<br />يبقى احنا نستهل<br />حسبى اللهع فيكم ياملك العرب والله يوم القيامه سوف ترون انتم خيفين على ايه ديه دنيا المفرود ان نفكرفى الاخره والله انا زعلن عاى العرب<br />العراق فلسطين الشيشان لبنان افغنساتان<br />والله يرحم العرب العزاء اليوم يجب على كل منا ان يصلى صلاء العذاء على العربد"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122347/http://masr.20at.com:80/article.php?sid=385&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

