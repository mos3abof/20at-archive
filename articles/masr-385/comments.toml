[[comments]]
order = 12
subject = "بدون روتوش"
author = "المهزلة"
posted = "2006-06-01"
text = "خذ بالك من فلوسك<br />قال ايه افلام<br />خد عندك<br />الفيم اللى زى حليم متكلف ملايين علشان يجيب ملايين وبرضة الفليم التانى اللى زى عمارة يعقوبيان متكلف ملايين علشان يجيب ملايين برضه<br />كل ده الملايين تتجاب فى مصر لكن فى كان تجيب مليم او اتنين مليم على اكثر تقدير<br />وكل اشتغالات عم عماد اديب والبساط الاحمر واغنية عبده كل ده علشان الملايين بتاعت مصر والعرب<br />والنبى مانتوا مش مكسوفين على دمكم والسينما الاجنبية جايبه فيلم زى دافنشى كود او مهمه مستحلية حاجه تكسف فى الدعاية والاعلان والاخراج والانتاج و مش عوزين الناس تعيب على اللمبى وعوكل و حتى الفلييمين بتوع الحاج اديب<br />انا لو عندى الفلوس دى اديها للى يستحقها من الناس زى العراق و فلسطين او مرضى سرطان الاطفال<br />و المثل الشعبى بقول ايه اللى عنده فلوس بتحيرة يجيب حمام ويطيروه<br />لا للتمديد لا للتوريث لا للتزوير ( اى حاجه يعملها النظام ده لا ليها انا غاوى شكل للبيع) ولا للعبط"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122347/http://masr.20at.com:80/article.php?sid=385&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

