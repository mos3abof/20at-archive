[[comments]]
order = 8
subject = "التوريث من اجل التحديث"
author = "مشروع ارهابي خريج جامعة وعاطل"
posted = "2006-05-28"
text = "احمد زكي:ابن احمد زكي, عادل امام:ابن عادل امام,محمودعبد العزيز:ابن محمود عبد العزيز......... وهكذا التوريث في اهل الفن<br />في الجامعات( الدكتور:ابنه دكتور)(الموظف:ابنه موظف متعين معاه)<br />وفي القضاء(القاضي:ابن في سلك النيابة, وكيل النيابة :ابنه وكيل نيابة...وهكذا<br />قيس علي ذلك في كل احوال البلد الوسخة بنت الكلب الي عايزة الحرق بجاز, لاننا رضينا ان نسكت علي حقنا الضائع من زمان فتمادوا في الظلم حتي ركبونا ولاد الكلب.<br />هذا النظام الظالم يعد العدة للتوريث لان حمكشة الكبير قارب علي الموت ,فلذلك يجب تحضير حمكشة الصغير دلوعة امه يحضر للنهبه الكبيرة كنز علي بابا الي ورثه من ابوه علشان نشوف 25 سنه اخري من العذاب تحت ايدي عملاء اليهود والامريكان<br />وسلملي علي التوريث يا حمكشة يا كبير...."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122347/http://masr.20at.com:80/article.php?sid=385&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "وكسة"
author = "مواطن مصري مفقوع"
posted = "2006-05-29"
text = "فيلم حليم اتكلف ملايين ، ملايين تكفي لإنتاج عشرة أفلام جيدة المستوى ..<br />نريد أن يخبرنا منتجو الفيلم كم مليوناً صرف عليه ، لينتهي به الأمر \"خارج\" المسابقة الرسمية؟ .. ألم يغنوا علينا يوماً بانه سيكون أول فيلم مصري يمثل مصر في كان ، وتمثيل يعني مسابقة رسمية ومنافسة على السعفة الذهبية ، مش عرض في البانوراما وكان الله بالسر عليما؟<br />وللي محروق على فنانيننا وبيقول ربنا يخليهم.. ربنا يخليهم لما يبقوا فنانين ، وعيب علينا جداً لما يبقى عندنا سينما من قرن كامل من الزمان ، وتصبح سينمانا كلها من أسيادنا عبدالحليم وسعاد حسني وعادل إمام استهلاك محلي..وبعد كدة نجري كعادتنا ورا المبررات من أول الدين للسينما النظيفة لصامويل إتو!..<br />وإذا كانت أموال إسعاد يونس وعماد الدين أديب لا تبال بتغيير الفكر السينمائي والفني المصري للأفضل .. ففي ستين داهية..ومحدش ضربكم على إيديكم وقال لكم اصرفوا ملايين على أفلام مش حتجيب همها.."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122347/http://masr.20at.com:80/article.php?sid=385&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

