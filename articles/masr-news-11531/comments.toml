author = "اكتب اسمك هنا"
posted = "2009-03-11"
text = "انسكب الماء يا ولدى<br />هو حسن البنا لم يسمع فى قبرة عن جماعة تبادل الزوجات فى القاهرة المحروسة فى حكومة رجال الاعمال المنافية للاخلاق<br />حسن البنا - هيعمل اية فى الفساد اللى وصل للركب<br />والفقر الرهيب اللى خللى الناس تبيع بناتهم للاثرياء العرب يستمتعوا بهم فى اجازتهم تحت مسمى الزواج<br />اية يا حسن يا يا بنا<br />البلد كلها مهدودة هتبنى فيها اية<br />لا الفيلم ولا حسن البنا ولا حتى حسن نصر اللة ولا حتى سيدنا الحسين يقدر يعدل الحال المايل<br />هو وحدة اللة اللى يقدر"
archived = "2010-01-02"
