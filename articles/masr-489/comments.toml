[[comments]]
order = 1
subject = "والله ياريتكم كنتو شفتوها..الواحد كان شوية وينزل يهتف ولا يعمل مظاهرة"
author = "محمد السيد"
posted = "2006-06-09"
text = "أنا شفت الحفلةعلي قناة الجزيرة مباشر ...<br />الحقيقة كانت حكاية .. حاجة مفيش بعد كده ... آدي الفن والحفلات ولا بلاش ...<br />وعشان نعلي ونعلي ونعلي ... لازم نطاطي نطاطي نطاطي ..... يا .....<br />ده كان كلامهم . ولقتني بأردد وإخواتي معاهم .....<br />بس بجد كانت عايزاكم ....<br />بس إنت كنت قاعدة فين ياهبة .. ممممم.. يلا مش مهم !!!<br />عموما خيرها في غيرها ..... وطبعا عارفين بعدها حنقول إيه ؟؟<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192840/http://masr.20at.com:80/article.php?sid=489&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "إنها عصابة .آه والله .عصااااااابة"
author = "محمد السيدَ"
posted = "2006-06-09"
text = "كتب هذ الموضوع : الأستاذ أحمد الزعيم<br />هل توجد حكومة على وجه الأرض تقتل وتنزع الانتماء والولاء لكل ما هو إسلامي من قلوب أفراد شعبها ...<br />نعم ...<br />ما هي ...<br />إنها الحكومة المصرية .<br />هل توجد حكومة على وجه الأرض تبقى ما يزيد عن ربع قرن ولم تحل أي مشكلة واجهتها بل والأدهى هو ازدياد أعداد هذه المشكلات .... نعم ...<br />ما هي ..<br />الحكومة المصرية .<br />هل توجد حكومة على وجه الأرض ظلت عشرات السنين تبحث عن حل لمشكلة البطالة ولم تستطع حلها ...<br />نعم ....<br />ما هي ....<br />الحكومة المصرية .<br />هل توجد حكومة على وجه الأرض ظلت عشرات السنين تبحث عن حل لمشكلة إسكان الشباب ولم تستطع حلها ...<br />نعم ...<br />ما هي ...<br />الحكومة المصرية .<br />هل توجد حكومة على وجه الأرض يظل وزرائها وقياداتها في الحكم ما يزيد عن ربع قرن ...<br />نعم ...<br />ما هي ...<br />الحكومة المصرية .<br />هل توجد حكومة على وجه الأرض عندما تنادي بالتغيير الجذري تقيل وزير إعلامها وتعينه رئيساً لمجلس الشورى الخاص بها ... نعم ...<br />ما هي ...<br />الحكومة المصرية ...<br />أمّال التغيير لو مكانشي جذري كان راح فين ... كان زمانه بقى رئيس الجمهورية .....!! .<br />هل توجد حكومة على وجه الأرض يكون نائب رئيس حزبها متهماً في قضايا فساد ورشوة ...ومع ذلك تتمسك به بل وترشحه في الانتخابات ويسقط سقوطاً مدوياً ...<br />نعم ...<br />ما هي ...<br />الحكومة المصرية .<br />يا أخي ... إن هذه ليست حكومة ...<br />أمّال نطلق عليها ؟<br />... يا أخي إنها عصابة ... !!!<br />و برضه<br />لاتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192840/http://masr.20at.com:80/article.php?sid=489&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

