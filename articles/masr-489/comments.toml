[[comments]]
order = 6
subject = "د. محمد عباس ينعي الزرقاوي"
author = "ربح البيع أبا مصعب"
posted = "2006-06-11"
text = "وما ودعك ربك وما قلى<br />لا شيء يعزيني سوى أن تلك هي إرادة الله و أن عمر شهيدنا وحبيبنا لم يكن ليزيد لحظة أو لينقص لحظة..<br />ويخفف ألمي أنني منذ شرفت بالسماع عنه لم أصدق فيه شانئيه.. وكنت أدرك تماما أن من يسبون الرسول هم الذين يقولون عن أسد العراق الأقاويل.. وكنت مدركا من اللحظة الأولي إجرام أولئك الذين راحوا يحاولون تلويث أعظم أبطالنا.. و على رأسهم أسامة بن لادن و أيمن الظواهري و أبو مصعب الزرقاوي رضي الله عنهم ورضوا عنه.. وكنت مدركا كذلك نفاق أولئك الذين حاولوا التفريق بين ساكنيْ الجبل العظيمين في أفغانستان وبين أسد الله في العراق..<br />وكنت مدركا على الدوام أنهم كاذبون و أن واجبنا ألا نصدقهم..<br />إن صدّقناهم في أبي مصعب فإن علينا أن نصدقهم أيضا فيما يقولونه عن القرآن الكريم وعن الرسول العظيم ( صلى الله عليه وسلم)..<br />ألم يقولوا عن الذكر الحكيم أنه أساطير الأولين؟!<br />ألم يقولوا عن الرسول صلى الله عليه وسلم – حاش الله – أنه مجنون؟!<br />فأولئك و أولئك هم الذين يسبون أبا مصعب.. ويحاصرونه بالاتهامات الباطلة وبالأكاذيب .. وهم الذين يرمونه بدائهم ثم ينسلون.. ولو أننا صدقناهم فيما يقولونه عن أبي مصعب.. لكن من المنطق أن نصدقهم فيما سواه.. ولوجب علينا بنفس المنطق الشيطاني بعد أن نصدق أكاذيبهم عن الرسول الأعظم صلوات الله وسلامه عليه أن نكفر – معاذ الله- بما أنزل عليه.<br />نعم: و أوصيكم يا قراء بالحذر الحذر من الوقوع في براثن آلة الكذب الشيطانية الفاجرة التي تقود خطى إعلام الغرب كله.. كذب يجعلني أتساءل في دهشة: هل يمكن للشيطان أن يضاهيهم لا أن يتفوق عليهم؟!..<br />أوصيكم.. فإن تصديق الكذب كبيرة من الكبائر ربما لا تختلف عن الكذب نفسه.. لأنه لا يصدق الكذب<br />اقرأ بقية التعليق .."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192840/http://masr.20at.com:80/article.php?sid=489&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "ياأيها الذين آمنوا لم تقولون مالا تفعلون"
author = "سمسم"
posted = "2006-06-11"
text = "بسم الله الرحمن الرحيم..<br />إن الحمد لله, نحمده تعالى ونشكره, ونتوب إليه ونستغفره, ونعوذ بالله من شرور أنفسنا وسيئات أعمالنا, من يهده الله فلا مضل له , ومن يضلل فلا هادي له, ونشهد أن لاإله إلا الله وحده لاشريك له, له الملك وله الحمد يحي ويميت وهو على كل شيء قدير..<br />ونشهد أن نبينا محمدا عبد الله ورسوله,أرسله بالهدى ودين الحق ليظهره على الدين كله,فبلغ الرسالة وأدى الأمانة ونصح الأمة وجاهد في الله حق جهاده,قدوة الأولين والآخرين,وإمام الأنبياء والمرسلين,وخاتم النبيين, صلوات الله وسلامه عليه وعلى آله وصحبه أجمعين,صلاة وسلاماً دائمين إلى يوم الدين.<br />أخي الكريم لنصرة أخيك في الوطن والعروبة، ولا تنظر ما إتجاهاته الحزبية ومنطلقه الإيدلوجي، طالما كان من المدافعين عن حياص هذا الوطن، ولا تخدع بقوم خانوا آمانات الوطن وتحصنوا بشرم الشيخ وماما أمريكا، ومع هذا يقولون إنا مسلمون. لا والله ما هم بمسلمين وهم مشاركون بكل دم عربي ومسلم سفح:( ِإنَّ الَّذِينَ يُؤْذُونَ اللَّهَ وَرَسُولَهُ لَعَنَهُمُ اللَّهُ فِي الدُّنْيَا وَالْآخِرَةِ وَأَعَدَّ لَهُمْ عَذَاباً مُهِيناً ).<br />انطلق لنصرته ولا تنتظر..ولاتكن ممن يقولون مالا يفعلون..قال تعالى: (ياأيها الذين آمنوا لم تقولون مالا تفعلون*كبر مقتا عند الله أن تقولوا مالاتفعلون).<br />انطلق بالفعل والقول أخيك ولتعلم أن ماحدث قضاء الله وقدره..لعله خيرا في صحوة الأمة وإيقاظها من غفلتها..<br />والله إن الجرذ الحقير اللا مبارك الصهيوني لأذل وأحقر من أن يعتقل الشعب كله، أو أن يقتله كله، إن هو يستغل مواضع الضعف الإنساني فيكم وغريزة حب البقاء وطلب السلامة، ليستعبدكم وهو العبد نسل أحط العبيد.<br />إياك أخي العربي الأبي أن تعد وعدا أو تقول قولا ولاتفي به,أو ان تقول عن نفسك<br />اقرأ بقية التعليق .."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192840/http://masr.20at.com:80/article.php?sid=489&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "اللهم مغفرتك!"
author = "سمسم"
posted = "2006-06-13"
text = "وماذا أفعل ياشقيقة الفؤاد؟ وعذرا إن كنت غير من أظن؟ أخشى ما أخشاه أن يكون أبناء ست البرين الساداتي، ومرجانة وسوزي قد دجنوا كباش الأمة وجعلوها نعاجا جميعها، أم تراهم جعلوا أحرار الأمة عبيدا وقطينا؟<br />أين الأبطال فيكم كخالد الإسلامبولي وعبود الزمر؟ أأعقمت نساء مصر أن تلد أشباههم؟<br />أم تنتظر الأمة أن يقيض لها زرقاويا جديدا؟ ليس من تراب هذه الأرض؟ والذي نفسي بيده لو ظهر فيكم ما أقام إلا ساعته وتسلمونه لإبن مرجانة أولسيده سفيه البيت الأسود. أأقسو عليكم بحكمي؟ والله لايأمن الرجل اليوم أن يشي به من هو صلبه، ومن هو لحمه ودمه، خربت الذمم والضمائر فحتام ننتظر؟ حتى ينزل علينا كسفا من السماء لنعلم أنا لن ننصر إن لم نتحرك؟<br />قلبي مفعم بالألم وباليأس القاتل، ولا أعرف من أين أبدأ؟ أأحارب الخوف المستحكم فيكم أم شقيقه الجهل؟ أم تلك الحلاليف المنوفية؟<br />ماذا أفعل؟ إن سكت قتلني القهر وإن صرخت قتلني أنني أصرخ بواد غير أنيس، اللهم مغفرتك!"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192840/http://masr.20at.com:80/article.php?sid=489&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

