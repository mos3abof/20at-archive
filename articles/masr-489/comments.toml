text = "شاعر شريف شجاع شرح لى معنى بشاعة الخضوع<br />لكل الآلهة التى نصنعها نحن العرب فقال:<br />أبشع من إنك تنزع ضلع وليدك تاكله وتشبع إنك تخضع ، الشاعر ده أسمه محمود جمعة وأنا دلوقت مش عارف ألاقيه فين علشان نكمل لكم القصيدة"
