[[comments]]
order = 4
subject = "كفى نواحا"
author = "سمسم"
posted = "2006-06-10"
text = "وماذا بعد ياسادة؟ غنينا ورقصنا وبكينا وأبكينا من رآنا عيانا ومن على شاشات التلفاز من عرب ومن أعاجم، حتى متعهد فرض التحرر على المسلمين بالقوة بشبوش بوش رآه، فماذا بعد؟<br />لست من أنصار أيمن نور، وحقيقة شككت فيمن يقف وراءه بداية، وحسبته نادلا أمريكا آخرا، ولكن عندما آراه يحكم عليه بخمس سنوات مجرمات، ويرمى من نظام أقل ما يقال عنه إنه الخيانة والقذارة والعمالة، بأنه عميل أمريكي، أضطر قهرا لتغير فكرتي عن الرجل، وأستغفر الله وأحوقل وأطلب العون من المعين. عندما يسجن هو ويعذب، ووغد مزور مثل تامر حسني، يحكم عليه بسنة يقضيها بزنزانة خمس نجوم، أقول ما أطول ليلنا يا إخوان.<br />لن يستيقظ ضمير معدوم الضمير، ولن تعطون حقا لم تنتزعوه بأيديكم عنوة وتدفعون فيه ثمنا غاليا من الدماء.<br />لاتعولوا كثيرا على هبة يقوم بها العسكر ينصرونكم، فلقد رأيتم مافعلوا مرارا، وستذوقون على أيدهم أعظم الجور إن أفلحوا، لاينقذ النخاس من نخاس.<br />تعانوا فيما بينكم جمعا إخوانا وناصريين وكفايين وكل إتجاه، ولا يهم من يلي القيادة، ليلها الأخبر، جالدوا الطغاة الجبناء وأصدقوا الله وستنصرون بإذن الله."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192840/http://masr.20at.com:80/article.php?sid=489&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

