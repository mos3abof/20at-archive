[[comments]]
order = 0
subject = "كله بيقول كده"
author = "انا سمعت ان اول من اكتشف امريكا كان بحار مسلم ؟؟؟؟"
posted = "2006-01-15"
text = "في حلقة احمد منصور من برنامج بلا حدود<br />يا تارى هل المعلومة صحيحة"
archived = "2006-11-02"
