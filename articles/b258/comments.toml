[[comments]]
order = 1
subject = "تصحيح للأخ \"كله بيقول كده\""
author = "واحد معدي"
posted = "2006-01-15"
text = "الذي أعرفه و قرأته من مصدرين مختلفين أنه لم يكن مسلما واحد ، بل كانوا عشرة !!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144602/http://www.20at.com/article2.php?sid=258"

[[comments]]
order = 2
subject = "لا يجوز"
author = "المحترم"
posted = "2006-01-15"
text = "لا طبعا والف لا<br />اللى اكتشفها هو كرستوفر كلمبوس<br />وللسادة اللى بيالفو ويقولو ان مسلم او 10 لا كدب طبعا<br />بطلو تزوير فى التاريخ بقى<br />كفاية<br />بتكدبو لية<br />طب هتزورو التاريخ<br />؟؟؟؟؟؟؟؟؟<br />قال من مصدرين قال ياعم روح كدا<br />على العموم هبل براحتك ولا حد هيصدقك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144602/http://www.20at.com/article2.php?sid=258"

[[comments]]
