author = "واحد معدي"
posted = "2006-01-15"
text = "جزاك الله خيرا يا عم \"المحترم\" على أسلوبك \"المحترم\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144602/http://www.20at.com/article2.php?sid=258"

[[comments]]
order = 4
subject = "يعم انتوا مضايقين ليه انا اللي اكتشفتها يا سيدي"
author = "عبده نصحي"
posted = "2006-02-04"
text = "ايه يا شباب بتتخانوا ليه علي مين اللي اكتشفها طب يا ريتوه ما اكتشفها ايا كان مين اللي اكتشفها اهي موجوده وخلاص"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144602/http://www.20at.com/article2.php?sid=258"

[[comments]]
