subject = "المغضوب عليهم و الضالين"
author = "على الدين"
posted = "2007-01-29"
text = "الكريسماس ده مش بتاعنا ومش لازم نحتفل بيه ، كل ده بس مش اكتر من تقليد غبى للنصارى اللى هما التانيين بيقوموا بتقليد اغبى للغرب للى بيستقووا بيه ده و عاوزين يتمحكوا فيه و خلاص."
