subject = "العشوئيات"
author = "اية اللى جاب الكريسماس جنب العشوئيات"
posted = "2007-01-01"
text = "العشوئيات هى دليل فشل الخطط بتاع السادة وزراء الاسكان<br />ارجعوا لخطط المساكن الشعبية فى الستينات<br />انسوا مصايف الساحل الشمالى اللى اتصرف عليها مليارات"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115349/http://masr.20at.com:80/article.php?sid=1389"

[[comments]]
order = 1
subject = "فية اية ؟"
author = "مصرى حتى النخاع"
posted = "2007-01-02"
text = "ياجماعة بتوع الموقع كل همهم فى الدنيا يوريلك الحياة فى مصر وحشة اد اية ومش بعيد يحاول بالايحاء ان الاخوان هما الحل حاجة تقرف ياعم طز فى الاخوان بتوعكم دول وعاز الاخت يمنى اللى تعبت نفسها فى الموضوع التافهة دة تقوللى نحلها ازاى بدل الموضوعات المكررة دى<br />جاتكم القرف"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115349/http://masr.20at.com:80/article.php?sid=1389"

[[comments]]
order = 2
subject = "انت زعلان ولا فرحان"
author = "الهندي"
posted = "2007-01-03"
text = "الاستاذ حتي النخاع ممكن احنا نسالك سوال<br />انت ممكن تطرح علي الموقع افكار والموقع يعملها وطلاما انك بتكرة الاخوان وبتحب مصر<br />فانت بالتاكيد انسان وطني او حزن (بالنون ) وطني اه رايك ممكن يكتبوا عن الصحة الي خربت ولا عن العيش الي مش لاقينة ولا عن التعليم العالي او الوطي او عن التعديلات الدستورية الجديدة انت شايف<br />ممكن نختار اه<br />انا عارف ممكن نتكلم عن الاقتصاد العال (نسبة الي شركة العال الاسرائيلية) ولا عن الامن المستتب (اقصد المستبد ) ولا اقول لك ممكن نكتب عن الاسثمار والفشار ولا عن الزراعة اه الزراعة عن البلد الي بتصدر بصل والكيلو عندها ب 4 جنية اه<br />اتفضل ممكن اه تختار<br />اوعي تزعل ممكن تتصل بصديق بس يكون نظيف او شريف او جمال او كمال او او او ولا اقول لك خلاص اختار"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115349/http://masr.20at.com:80/article.php?sid=1389"

[[comments]]
order = 3
subject = "الهندى؟"
author = "مصرى حتى النخاع"
posted = "2007-01-03"
text = "تصدق يا( هندى ) عندك حق طب ولية<br />ماتيجى نتكلم عن سيدك مهدى ونخلية ييجى يضربنا بالجزمة زى ماهوا عاوز جايز نفوق ولا تعالى نعمل عرض قتالى فى فنون الكراتية اهو ممكن نخوف الشرطة واذا مخوفنهاش نقلبها حرب اهلية وعلى فكرة ساعتها الجعان حيشبع لو شافكم بتعملوا عروض<br />اقولك حاجة ياهندى اللة يلعن الاخوان الارهابيين على حسنى مبارك وحكومتة ؟<br />اية رايك انتا فى فاروق الباز امبارح وافكارة لتطوير مصر ؟ الراجل امبارح قال بدك ماتوجع دماغنا بمشاكل مصر ساهم فى حلها ولا اية ؟؟؟؟؟؟؟؟<br />اسف انى بكلمك مانتا ( هندى )"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115349/http://masr.20at.com:80/article.php?sid=1389"

[[comments]]
order = 4
subject = "اتلم يابتاع الاخوان"
author = "جمال فاروق"
posted = "2007-01-03"
text = "الاستاذ هندى واضح انة من الاخوان وعلى طول اول حاجة فكر فيها الربط بين الاخ اللى مش عاجبة فكر الاخوان وبين الانتماء للحكومة التعيسة او زى ماسمها الحزن الوطنى وبين الاسرائيليين<br />يااخى هيا دى ديمقراطية الاخوان ؟<br />اللى يختلف معاكم يبقى على طول خاين<br />فى اعتقادى الشخطى الجماعة دى حتتدمر من الناس المنتمين ليها ومش فاهمين فكرها الجيد"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115349/http://masr.20at.com:80/article.php?sid=1389"

[[comments]]
order = 5
