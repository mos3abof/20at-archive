text = "خليكم حلوين<br />وما تلعبوش مع القطة لتخربشكم<br />هاى"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115349/http://masr.20at.com:80/article.php?sid=1389"

[[comments]]
order = 6
subject = "كفر من سب الاخوان"
author = "الاخ مصرى حتى النخاع انت اللى جبته لنفسك بحديثك عن الاخوان و كما قال لك الاخ الاخرانى لا تلعب مع القطه (الذئب) والا خربشتك."
posted = "2007-01-05"
text = "فهذا هو اسلوب الاخوان يا عزيزى خلينا قطط لحد ما تيجى الفرصه ونبقى ذئاب ، وسلم لى بقى على الحريه واحترام حقوق المواطن المصرى وكل هذا ما هو الى سلم ليصل بالقطط للمرحله الذئبيه المنتظره.<br />مره تانيه خلى بالك"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115349/http://masr.20at.com:80/article.php?sid=1389"

[[comments]]
order = 7
subject = "عندك حق"
author = "مصرى حتى النخاع"
posted = "2007-01-05"
text = "واللة عندك حق<br />ماهو اصل الشعب المصرى طول عمرة صيدة لية بقى الاخوان الارهابيون ميفكروش يتسلقوا سلم الدين للحكم<br />بس على فكرة الاخوان الارهابيون دول واللة حيكونوا العن من اى حاجة مرت على مصر دول ياعم شوية نصابين على مدعيين دة غير المرشد بتاعهم اللى عندة برانويا عظمة<br />وربنا يرحمك يامصر ياحسن بلد فى الدنيا"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115349/http://masr.20at.com:80/article.php?sid=1389"

[[comments]]
order = 8
subject = "كفر من سب الاخوان"
author = "ولو انى مكنتش احب انك ترد على يا اخ مصرى لان فى هنا عالم ضاربه هيقولوا : اه دول اتنين متفقين او ان ده تنظيم سرى معارض للمعارضه!! او اننا واحد بس اهبل و داخل عمال يكتب و يرد على نفسه !"
posted = "2007-01-05"
text = "عادى مهو اللى يمشى ورا اللى عاوز يجيب اندونيسى يحكم مصر لا تستعجب على تفكيره اى شىء"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115349/http://masr.20at.com:80/article.php?sid=1389"

[[comments]]
order = 9
subject = "انفلونزا الطيور"
author = "فية ناس اسمها جاك وجون وزعبلة وطويل ونخلة - اول ما يسمعوا كلمة اخوان -تجيلهم انفلونزا الطيور"
posted = "2007-01-06"
text = "ياعم الاخوان قالوا مائة مرة انهم مش عايزين يحكموا لان اللى بيحكموا برضة مسلمين"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115349/http://masr.20at.com:80/article.php?sid=1389"

[[comments]]
order = 10
subject = "المصريين اهما"
author = "حنا بشاى ....... ولبن"
posted = "2007-01-06"
text = "جاك وجون دول مش مننا حتى اسمائهم بقت كلها زى اسماء الاجانب عشان هما بقوا عارفين ان مصيرهم فى الخارج خلاص مش فى البلد دى ، وبعدين انت بتتكلم باسم الاخوان بمناسبه ايه والله باين عليك انت اللى عندك انفلوانزا الطيور و باين عليك كتكوت اساسا"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115349/http://masr.20at.com:80/article.php?sid=1389"

