posted = "2005-12-05"
text = "حد يقول لي إيه العلاقة بين العنوان والموضوع ............<br />ده كان تعليق والدي لما قرأ المقال ده ... والحقيقة أنا معاه .....<br />نفسي عشرينات يقدموا لنا المثل ويمشوا وراء رأينا في حاجة لما نقولها .....<br />مثلا صورة القاضي وعنوان المقال ...<br />وده كمان.... اضربوا لنا المثل ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
