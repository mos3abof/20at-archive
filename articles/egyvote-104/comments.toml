subject = "عندهم حق"
author = "ولاء"
posted = "2005-12-05"
text = "علا القضاة عندهم حق ان يتبروا من لاخوان ، كفاية الي بيحصل لهم من قوات الامن لانهم بس طالبوا النزاهه وتعديل الدستور وفكانت النتيجة 76 لصالح التعديل والاخوان.<br />وبعدين يعني هم قدؤين علي الامن المركزي علشان يقدروا علي امن الدولة"
archived = "2006-12-07"
