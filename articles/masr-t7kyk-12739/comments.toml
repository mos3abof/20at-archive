subject = ""
author = "محروس النمس"
posted = "2009-07-24"
text = "الانظمة الديكتاتورية فى دنيا العرب تثير الاسى<br />فالشاويش على عبد اللة صالح بيعد ابنة للتوريث ويتشبس بالكرسى سيقسم اليمن قريبا الى شمال وجنوب وشمال شمال وجنوب جنوب وحوثيين وزنجبار وغيرة وغيرة وغيرة<br />والسيد اللواء البشير بتاع اللة اكبر والعصا التى يهش بها على غنمة ليس لة اولاد لا بنات ولا ذكور ومتشبس بالحكم وجارى تقسيم السودان الى جنوب وشمال ودارفور وشرق السودان<br />والسيد العقيد القذافى وولادة العشرة قذاف الدم او تفاف الدم وسيف الاسلام وغيرة وغيرة حولوا ليبيا الى سويقة وبيجهزوا انفسهم للتوريث وكلهم عايز حتة من ليبيا يحكمها<br />شفتم الهنا بتاع الديكتاتورية<br />لا يتركوا البلد الا مقسمة ومجزاة<br />زى دكتاتور مصر السابق<br />كانت مصر والسودان دولة واحدة قسمت الى دولتين مصر دولة والسودان دولة<br />وكان الملك فاروق اسمة فاروق الاول ملك مصر والسودان<br />يا ترى يا فاروق يا ملك مصر والسودان كم بلد هتفتت فى حكمك وهتبقى كم دولة"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725133808/http://www.20at.com:80/masr/t7kyk/12739-2009-07-23-09-58-17.html"

[[comments]]
order = 11
subject = ""
author = "معنى الشجاعة"
posted = "2009-07-24"
text = "ان تكون عسكرى وتعصى امر عسكرى فالمصير سنوات فى السجن الحربى<br />ام ان تفكر فى تمرد فاكيد الاعدام هو الحكم المخفف<br />والذين قاموا بالانقلاب كانوا يعرفون انهم بنسبة تسعون فى المائة سيعلقون فى حبال المشنقة ولكنهم حملوا رؤوسهم على اكفهم وخرجوا<br />هل كانوا مجانين<br />مهاوويس<br />لا مباليين<br />وطنيين الى درجة انهم يتقبلون الاعدام برحابة صدر<br />الم يتوقعوا الفشل مثل عرابى<br />كان من الممكن ان يتخل الجيش البريطانى ويقبض عليهم<br />حقيقة كانوا شجعان وشجعان جدا<br />ومغامرين ومغامرين جدا<br />ونجحوا<br />وزير الحربية كان حيدر باشا وهو قريب الملك وكان لا احد يصدق انهم سينجحوا<br />لو فى مصر اناس بشجاعتهم لتكرر الانقلاب<br />ولكن الشجاعة مش متاحة لكل واحد ليحرر وطنة من الاحتلال"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725133808/http://www.20at.com:80/masr/t7kyk/12739-2009-07-23-09-58-17.html"

[[comments]]
order = 12
subject = ""
author = "ولا عزاء للثورة"
posted = "2009-07-24"
text = "ثورة اية ما خلاص<br />زى هوجة عرابى<br />وموجة مظاهرات 1919<br />برضة حركة الضباط فى 52 كانت هوجة وخلصت<br />خلصت مع ضرب الطيران المصرى على الارض فى 67 والهزيمة المنكرة<br />والطيران انضرب على الارض لان الطيارين الاكفاء راحوا اشتغلوا محافظين وسفراء وواحد طيار كفء زى وجية اباظة ساب الطيران وعمل محافظ للبحيرة<br />انتهت بتقسيم الوظائف المدنية على السادة اللواءات فاصبح المحافظ وحاكم المينة ورئيس الحى ورئيس المؤسسة ومدير مكتب الوزير كلهم لواءات سابو ا الخدمة واتوا للوظائف المدنية<br />انتهت الثورة فى يونيو 1967<br />ونحن الان فى الحقبة الامريكية<br />والفكر الجديد<br />والشباب الناهض<br />انتهت الثورة من زمان<br />وارجوا الغاء الاحتفال بعيد الثورة<br />بل احتفلوا بعودة الاقطاع والراسمالية وبيع الاقتصاد للاجانب<br />انتهى كل الفكر الثورى<br />ولا عزاء"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725133808/http://www.20at.com:80/masr/t7kyk/12739-2009-07-23-09-58-17.html"

