text = "يا خسارة يا جلالة الملك<br />العبيد بتوعك ضحكوا عليك واخدوا منك الحكم واستعبدوا الشعب المصري كله<br />شوية كلاب كانوا عبيد عند جلالتك ما ينفعوش حتى خدم في القصر الملكي<br />اتفوووووووو عليكم ونخص بالذكر الكلب اللي في الصورة دا والكلب اللي بعده<br />والكلب اللي بعد بعده"
