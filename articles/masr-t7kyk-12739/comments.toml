order = 0
subject = ""
author = "االاخوان المغفلون"
posted = "2009-07-23"
text = "الاخوان المغفلون يشتمون الثورة عمال على بطال<br />اصطدموا بكل الانظمة ولا يتعلمون ابدا<br />حينما حاربوا فى فلسطين عام 1948 وابلوا بلاءا حسنا وصمدوا فى قتالهم ضد اليهود وسببوا خسائر فادحة لهم وكادوا ان يعصفوا بدولتهم قام قائد الجيوش البريطانية فى الشرق الاوسط باخبار الملك فاروق بضرورة قتل مرشدهم العام حسن البنا فارسل الملك حرسة الحديدى واغتال حسن البنا<br />وقامت الثورة<br />واراد الاخوان فرض وصيتهم عليها<br />وانحازوا الى محمد نجيب ضد عبد الناصر واصطدموا بالثورة مرة اخرى وحاولوا اغتيال عبد الناصر فتم تصفيتهم بعد محاولة اغتيالة<br />ثم جاء السادات فا استغل غباءهم وجندهم لمحاربة الناصريون والشيوعيين ليحمى الكرسى الذى يقعد علية وحاربوا مع السادات بغباء ثم اعتقل زعماء حركتهم ورماهم فى السجن فقتلوة<br />اما النظام الحالى فقد استغل الاخوان المغفلون احسن استخدام فهو يعتقلهم ويفرج عنهم ثم يعتقلهم ثم يفرج عنهم ليوهم الغرب انة لا خيار غيرة غير وصول هؤلاء الاخوان الى الحكم كما فى غزةوان النظام المصرى هو فى الحكم او بعدة الاخوان ثم سيستغل ذلك فى موضوع التوريث<br />اما جمال مبارك واما الاخوان<br />بديل كرية امام الشعب<br />وهذا سيحدث"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725133808/http://www.20at.com:80/masr/t7kyk/12739-2009-07-23-09-58-17.html"

[[comments]]
order = 1
subject = ""
author = "التطور"
posted = "2009-07-23"
text = "انتهى حكم فاروق والجنية المصرى يساوى 4 اربعة ونصف دولار ويشترى اربعة جرامات من الذهب<br />وانتهى حكم عبد الناصر والدولار يساوى ثلاثة ونصف دولار ويشترى 3 جرامات من الذهب<br />وانتهى حكم السادات والريال السعودى ب 18 قرش والجنية بدولارين ونصف ويشترى جرامين من الذهب<br />واليوم<br />الدولار ب بحوالى خمسة ونصف جنية وجرام الذهب ثمنة مائة وخمسون جنية<br />شفتم الاصلاح الاقتصادى اوصلنا الى اية<br />من غير فلسفة ولا كلام<br />الارقام بتتكلم<br />تحبوا نتكلم عن مديونية مصر فى الحكام السابقين والان<br />ربنا يستر"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725133808/http://www.20at.com:80/masr/t7kyk/12739-2009-07-23-09-58-17.html"

[[comments]]
