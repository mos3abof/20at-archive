subject = ""
author = "منه الله"
posted = "2009-07-23"
text = "اليوم ده بيفكرنى بجدتى الله يرحمها لما كانت بتحكيلى عن القلق اللى كانوا عايشيينوا جدىو زملائه(الضباط الاحرار و اعضاء مجلس قيادة الثوره) و ان جدى كان قلقان خدتى حتصرف منين علشان البيت وقتها كل الفلوس اللى فيه مكنتش تكمل جنيه واحد و حاجات تانيه كتير لو كتبتها محدش حيحسها غيرى علشان انتوا مش عايشين معانا… عارفه انه المطلوب انى اقول راى فى سلبيات او ايجابيات الثورة( و هى كتيييييييييير) و لكن انا متاكدة انه عند ذكر الثوره مش اول حاجه بتيجى فى بالى يوم الاجازه او فيلم رد قلبى<br />ارجوكوا متتفهوووش من مجهود ناس بجد بجد كانت شايله روحها على كفها"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725133808/http://www.20at.com:80/masr/t7kyk/12739-2009-07-23-09-58-17.html"

[[comments]]
order = 3
subject = ""
author = "دوار العمدة"
posted = "2009-07-23"
text = "حكى جدى عن فرحتة بالثورة قال<br />كان العمدة يجلس امام دوار العمدة فى الشارع تحت ظل شجرة جميز وحولة حاشية النفاق<br />وكان كل فلاح يعدى علية ان ينزل من فوق الحمارة ويخلع نعلية ويجر حمارة ويمشى حافى حتى يعدى من امام العمدة<br />وكانت لا تجرؤ اى امراة او بنت ان تعبر امام حضرة العمدة<br />كان العمدة يستغل الفلاحين بطلبهم بمواشيهم لحرث ارضة بالمجان<br />كان الانسان المصرى مستعبدا وذليلا ولا قيمة لة<br />اعاد عبد الناصر الكرامة للانسان المصرى<br />ارفع راسك يا اخى فقد مضى عهد الاستعباد - تلك صرخة عبد الناصر الشهيرة واستعباد الانسان المصرى من الاستعباد الداخلى<br />ارفع راسك يا اخى فقد مضى عهد الاستعباد<br />كنا هنبنى وادى احنا بنينا السد العالى<br />3 مدارس تبنى يوميا<br />الاف المصانع والاف فرص العمل<br />يا ناصر<br />انت اين"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725133808/http://www.20at.com:80/masr/t7kyk/12739-2009-07-23-09-58-17.html"

[[comments]]
order = 4
subject = ""
author = "االحلم والكابوس"
posted = "2009-07-23"
text = "ابتدات ثورة يوليو بحلم شعبى كبير<br />خروج الاحتلال الانجليزى وتحرير الدول العربية المحتلة كانت جامعة الدول العربية مكونة من 7 دول فقط<br />وبناء مصر القوية الحرة الكريمة<br />وابتدات الثورة بالخطايا<br />محكمة الثورة محكمة الثورة بقيادة الصاغ جمال سالم والصاغ السادات او الصاغ محمد انور السادات وحكمت على الاخوان وعلى عبد القادر عودة بالاعدام<br />وانتهت الثورة بهزيمة 1967<br />واليوم<br />اليوم اية<br />زفت وقطران وهباب وسيطرة الفساد وراسمال الحرامية على الحكم<br />اليوم<br />ينتظر الناس عودة الملك فاروق او ابنة لينتشلهم من الوضع البائس واليائس الذى اوصلهم اياة مجموعة من الضباط المتخلفين عقليا بتوع الثانوية العامة ب 45 % واجسام البغال<br />ضاع كل شىء<br />ولا امل<br />حتى ولو نزل ملك من السماء مفيش اى امل<br />اضاعوا كل شىء حينما حولوا المملكة المصرية الى عزبة خاصة"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725133808/http://www.20at.com:80/masr/t7kyk/12739-2009-07-23-09-58-17.html"

