[[comments]]
order = 0
subject = "يا كداب"
author = "مشروع ارهابي"
posted = "2006-06-18"
text = "علي راي الاغنية الي بتقول(الكداب بيروح النار وانت بتكدب ليل ونهار)<br />تنطبق هذه الاغنية تماما علي سيادة الرئيس وحكومته النظيفية التي تثبت كل يوم انها ليست مع محدودي الدخل وانها جاءت لمحاربة الفقراء الذين هما غالبية شعب مصر<br />كل يوم بيغني علينا الرئيس ويقول<br />(اتعهد بالمحافظة علي الدعم,وحماية محدودي الدخل,وانشاء المصانع لتوفير فرص العمل,وحماية امن واستقرار الوطن) كل يوم بنسمع الاغاني البايغة ديه ونشوف عكسها<br />فالطبقة المتوسطة اختفت تقريبا<br />والفقراء زادوا واصبحوا الغالبية<br />والاقتصاد في انهيار<br />والبورصة راحت عليها<br />والفساد نهر في كل شيء<br />والبطالة تفاقمت وازداد اعداد العاطلين خاصة حملة المؤهلات الجامعية وضياع سنوات عمرهم علي الفاضي<br />واصبحت مصر اكبر البلاد التي بها عنوسة<br />الخلاصة كل حاجة انهارت في عصر عمنا الكبير مبارك اطال الله في عمره لكي تزيد سيئاته<br />واقوله كلمة اخيرة<br />يا كـــــــــــــــــــــــــداب"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620061640/http://masr.20at.com:80/article.php?sid=533"

[[comments]]
order = 1
subject = "الله يرحمك يافاروق"
author = "صباح"
posted = "2006-06-18"
text = "إيه ياجماعة هو ده مش زمن الحمير؟ هو أنهنو الأحمر حمارنا ولابوش؟ الإتنين ماركة نهق خمس نجوم.<br />والله يا أستاذ دياب أسرة محمد علي كل مساوئها كانت بتعد قمة الصلاح والوطنية قياسا بدولة المنايفة.<br />أنا جدي كان ضابط في الحرس الملكي، وياما كنت أشوفه مقهور وهو بيسمع الأكاذيب الي قالوها على الملك فاروق، جدي الله يرحمه قال دايما طايش آه، سكير لأ، خاين ألف لأ، وطني ألف وطني، وده عاده مرة تانية بيومين قبل ما يتوفاه الله.<br />أقله فاروق مارح جاب الإنجليز عندنا، زي السادات والكلب التاني ماجابم أمريكا وإسرائيل، ووقته كان لنا ديون على إنجلترا، مش عايشين من الشحاته والبهدلة من الي يسوى ويسواش، فين ده وفين العيشة في مملكة المنايفة، ربنا يخلصنا منهم آمين."
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620061640/http://masr.20at.com:80/article.php?sid=533"

[[comments]]
order = 2
subject = "الاخت اللي اسمها صباااااااح"
author = "الاستاذشيكو"
posted = "2006-06-18"
text = "الاخت صباح حسستني ان ايام الملك فاروق العربيد بلاش السكير كانت الحاله حلوة والفلاحين كانوا واخدين حقهم والدنيا ايام فاروق كانت جميله ومكنش فيه اقطاعيين ومكنش فيه فساااااااااادوالدنيا كانت سهلااااااااةوكويسه وبنت ناااااس<br />ونست ان اسود ايام كانت ايام الاعضاء اللي قاموا في مجلس الامه يعملوا قانون للحفاااااة في مصر عشان الناس مكنتش لاقيه لامؤخذه الجزمهولا حتي شبشب !!!!!! والله ايام مبارك هباب وطين فوق دماغ الغلابه والوطنيين ده صحيح بس مش معني كده ان ايام الملك فاروق كانت ايام الهنا كله بلاش نفاق وكدب والنبي العمليه مش ناقصه<br />كفايه الكدابين الكبار اللي موجودين عندنا بلاش يبقي الكلام للكدابين بس كدب ملكي بدل الكدب الجمهورى مع ان احنا عايشيين في بلد ملكي مش جمهورى وده غصب عني وعنك وعن الشعب المصرى<br />انهاااااااا ملكيه بايظه مش جمهوريه سليمهوسلملمي علي الطماطم"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620061640/http://masr.20at.com:80/article.php?sid=533"

[[comments]]
order = 3
subject = "aswad aswad"
author = "abw omar"
posted = "2006-06-18"
text = "الاستاذ الفاضل جمال محمد حسني نظرا لحاله الديمقراطيه الخارجه عن ارادتكم المتمثله في الانترنت وماشابهه من ادوات العولمه ومن هذا الموقع اعلن رفضي التام اناوافراد اسرتي المكونه من خمسه افراد انا المسؤل امام الله عنهم نعلن جميعا رفضنا التام لك كحاكم وكمسؤل عنا امام الله وذلك لعدة اسباب<br />1ـ عدم اهليتك وعدم امتلاكك لاي مهارات يمتلكها اي فرد ليكون حاكما انت رجل عادي او اقل<br />2ـ انت غير سياسي بالمره وكان هذا جليا في زياتك الاخيره لواشنطن والتي ضربت بالاراده الشعبيه عرض الحاءط وانا لااريد حاكم منقاد تابع وهذا من حقي.....<br />3ـ سوء اختيارك لسيده مصر الاولي والدليل على ذلك موافقتها عليك كزوج مع الفارق السني الرهيب وان لم تصدق فانظر الي زوجات من وريثوا من قبلك سيده سوريا الاولى ـ الاردن ـ المغرب لتعرف الفارق<br />4 ـ الكراهيه التراكميه الواقعه عليك كشخص وعلي اسرتك كأسرة حاكمه من جميع المخلوقات في مصر من انسان وحيوان ونبات وذلك بسبب انجازات المخضرم والدك<br />طوال ربع قرن من الذمان طهق فيها الانسان في مجال الاسكان والتعليم والصحه وجميع المجالات اماعن الحيوان والنبات فيكفيهم حكم والي ليجعلهم ينطقون ليقولو لالالا<br />5 ـ اذكر لي ميزه واحده واحده ليس اكثر وسأتحول الي كبار مؤيديك فأن لم تجد فأرجوك حل عنا<br />6 ـ ان لم تتراجع عن هذه الرعونه فحسبنا الله ونعم الوكيل<br />لقد راعيت العقلانيه فيما كتبت دون الميل لاي اتجاه لاالاتجاه العلماني الذي انت من وجهه نظره لاشيئ لانك مش عارف اي حاجه فيااي حاجه<br />ولامن الاتجاه الديني الذي الله وحده يعلم ماذاانت فيه<br />وحسبناالله ونعم الوكيل"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620061640/http://masr.20at.com:80/article.php?sid=533"

[[comments]]
order = 4
subject = "شكرا أستاذشيكو"
author = "صباح"
posted = "2006-06-19"
text = "حضرة الاستاذشيكو الفاضل/<br />أنا لا شفت المرحوم الملك فاروق ولا أنا النهارده من الأعيان ولا عندنا باقي أطيان وخدم وحشم. أنا من أرض مصر ومعرفش غيرها، وولائي لمصر والبلاد العربية، للأوطان مش للأشخاص. نسبة النص في المية الي هم الإقطاع أيام الملك فاروق، كانت رغم كل مايشاع عنها وطنية مقارنة بأقطاع النهارده.<br />مين الي ماسكين البلد غير الحرامية والمرتشين والفاسدين، ومن على راس العصابة من قطاع الطرق؟ مش ريسنا المفروض إنه فلاح، ولا حتطلعوه كمان سليل باشوات وأصل وحسب؟ الأصل غلاب والواطي يفضل واطي ولو قعدوه على مية مدنه. مش معنى كده أنا بأعيب في الفلاحين، معاذ الله، أنا بأعيب المنافقين الكذابين من سنة سبعين لغاية النهارده.<br />لو قامت النهاردة ثورة وأزيح الحلوف مبارك بإذن الله، تقدر تقولي حنعرف إزاي ننظف الوساخة المتراكمة دي؟ وإلا فاكر سيادتك إن الفساد حيموت بحش راسه؟ الفساد زي السرطان، تعالجه من هنا يطلع من حته تانية. لازم إستئصاله يعنى، وده معناه بحر من الدماء، نقدر إحنا على كده؟ حيسمح لنا من القوى الأجنبية إنا ننظف؟ بلاش أقول نبني أو ننظم، من مصلحة كل الأطراف إننا نبقى جهلة، ويضحكوا علينا بأننا إحنا فراعنة وبنيننا الهرم، كويس خالص إحنا بنيننا إيه النهارده؟ بالعكس أنا شايفه إنا بنهدم ما بناه غيرنا، وآخرها شركة سيد للأدوية الي عملها فاروق العربيد بتاع القمار والستات."
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620061640/http://masr.20at.com:80/article.php?sid=533"

[[comments]]
order = 5
subject = "إنجازاته"
author = "أهم إنجازات اللامبارك"
posted = "2006-06-20"
text = "1. نهب ثروة مصر وإذلال شعبها<br />2. بيع بترول مصر لأمريكا لمدة عشرين سنة آتيه بربع الثمن لإرضائها وكلما شعر بغضب أمريكا عليه يظهر إكتشاف جديد للبترول يجعل أمريكا تلهث لوجوده مرة أخرى<br />3. فتح الغاز الطبيعى لأسرائيل بدون حساب<br />4. تهريب أثار مصر للخارج ليرضى عنه الغرب<br />5. الإفراج عن عزام عزام لصالح إسرائيل<br />6. بيع القضية الفلسطينية لصالح إسرائيل على حساب فلسطين<br />7. التوقيع بين العرب حتى يظهر بصورة المصلح الإجتماعى لتشعر أمريكا بأهمية وجوده<br />8. السماح ببيع الأسمنت والحديد لإسرائيل لبناء الجدار العازل<br />9. الموافقة على المزرعة الإسرائيلية فى سيناء<br />هل رأيتم كيف يحكم هذا العميل مصر"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072654/http://masr.20at.com:80/article.php?sid=533&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "اهم إنجازاته"
author = "1. الشراكة مع إسرائيل وتوسيع نفوذها فى مصر"
posted = "2006-06-21"
text = "2. إتفاقية الكويز<br />3. محرقة بنى سويف بسبب فساد حكمه وحكومته<br />4. غرق العبارة وتهريب الجانى بسبب حكمة الفاسد<br />5.محرقة الأطفال فى الأسكندرية بسبب إهمال الحكومة الفاسدة<br />6. تهميشة للشباب وبطالته حتى يقضى على أى وجود له ليتمكن من توريث الحكم للمتخلف إبنه<br />7. تحويل مصر إلى دولة منبوذه بين الدول بعد أن كان لها موقع السيادة فى المنطقة"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072654/http://masr.20at.com:80/article.php?sid=533&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "اهم إنجازاته"
author = "1. بيع أملاك مصر بدون توكيل من الشعب للفسدة من حوله ولم نرى أى مشروعات جديدة بديلة"
posted = "2006-06-21"
text = "2. تهريب أموال مصر للخارج فى حساباته السرية هو وأسرته والفسدة من حوله<br />3. سرطنة الشعب بالمبيدات الحشرية بسبب فساده"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072654/http://masr.20at.com:80/article.php?sid=533&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "اللامبارك ومشروعاته الفاسدة"
author = "كل شيء في عصر اللا مبارك فاسد فاسد فاسد"
posted = "2006-06-24"
text = "انتخابته فاسده, انجازاته فاسدة, مشروعاته فاسدة<br />اللامبارك الحقير الخائن العميل ابن العاهرة , سيظل هو وابنه الشاذ في الحكم الا اذا قمنا بثورة شعبية عليه وعلي زبانيته الكلاب البلدي , لنزيله هذا السرطان للابد من التاريخ ولندخله مزبلة التاريخ"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072654/http://masr.20at.com:80/article.php?sid=533&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "كفاية مبارك الحقير وحزبه اللاوطني"
author = "عاطل مؤهل جامعي"
posted = "2006-06-24"
text = "كل شيء وكل انجاز في عهد هذا اللامبارك العميل الخائن الجبان الخسيس الواطي<br />سارق البلد هو وابنه الشاذ جمال العميل الصغير والعاهرة سوزان حرمة المصون سيدة الحرامي الاولي , اكلي اموال اليتامي وسارقي معاشاتهم, واكلي لحوم البشر بغرق العبارة , اولي علينا ان نقوم بثورة عليهم قبل ان يفنوالشعب<br />كفاية فساد,كفايةسرقة,كفاية فقر,كفاية بطالة,كفاية ماكولات مسرطنة<br />كفاية مبارك العميل وحزبه اللاوطني"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072654/http://masr.20at.com:80/article.php?sid=533&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

