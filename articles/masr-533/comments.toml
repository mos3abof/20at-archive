order = 13
subject = "الحقوناااااااااااااااااااااااااااااااااااااااااااااا"
author = "سمير المصرى"
posted = "2006-06-24"
text = "اتباعت مصر جمله وقطاعى من العميل الامركى وابنه اتباعت مصر امام اعين شعبها ولم يتحرك اتباعت مصر لسرائيل ولم يتحرك هذا لشعب واخيرا وبدون حرب 26\\6\\2006 اجر حسنى الامبارك قناة السويس للامريكان بدون مااحد يكتب كلمه ولا حتى يقول اف او اح كل شئ باعوه حتى الجامعه الامريكيه باعوها لاخوات حسنى مبارك اليهود لكى يرفرف علم اسرائيل على ميدان التحرير وغيرة وكل يوم شركه تباع تحت اى مسماى ايش خسران وايش جربانه وايش حمرانه...فين الشعب من اللى بيحصل فين الناس فين مجلس سيد قرارة هى الدوله راحت فين طب حد يقدر يقولى ليه امركا جات قناة السويس تحت اسم الاشراف عليها..واحد خبيث يرد ويقول علشان حسنى خايف على الشعب من الحرب فاحضر امريكا اليهم بدون حرب ههههههههههه يا شعب قوم وحس وانهض ودافع عن بلدك ودافع عن كرمتك ودافع عن دينك ودين امك ودين ابو الشعب كله"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072654/http://masr.20at.com:80/article.php?sid=533&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 14
subject = "اعتقال الشباب"
author = "نهي"
posted = "2006-06-25"
text = "عجبني أوي التعليق بخصوص ان مبارك يعتقد انة سوف يقضي علي أصوات المعارضين اذا وضع كل الشباب في السجون ، و لقد ذكرني هذا بفيلم شئ من الخوف عندما قال عتريس إقتلوا الشيخ ، إقتلوا الدهاشنة كلها.<br />لن يستطيع مبارك أو الخداميين إللي تبعة أنهم يسجنوا البلد كلها. صحيح التغيير دائما بياخذ وقت طويل و جهد لكن لو الناس عندها اصرار و عزيمة بإذن الله ربنا هيقدرنا علي تخليص بلدنا من زفت مبارك دة إللي معندوش ذرة ضمير"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072654/http://masr.20at.com:80/article.php?sid=533&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 15
subject = "لك الله يا مصر"
author = "مصرى دمه محروق"
posted = "2006-06-25"
text = "يا جماعه اناعايزاوضح حاجه بيسطه وهى إن مبارك لا حول له ولا قوة الأن الرئيس الحقيقى للبلاد الأن هو جمال والحاشيه الفاسده المتمثله فى كمال الشاذلى -صفوت الشريف-فتحى سرور وان فعلا كان أكرم لمبارك أنه يعترف أنه أصبح خيال مآته أحسن من أنه يفضل كدة ياكل و يشرب من دم الشعب . لك الله يا مصر .يا شباب ياريت نحاول نغير ما بأنفسنا لعل الله يتقبل منا ويزيح هذة الغمه أو على الأقل يعفوا عنا يوم العرض"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072654/http://masr.20at.com:80/article.php?sid=533&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 16
subject = "الشاذ يحضر للوراثة"
author = "مخنوق"
posted = "2006-06-26"
text = "تأملوا نظرة عنيه فى الصورة أنها نظرة مدمن شاذ كل إنجازاته أنه إبن الحاكم القذز العميل ولا يملك شيء سوى ذلك بالمقارنة بشباب مصر الذى يشعر بمأساة مصر على أيدى هذا المجرم وأبوه"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072654/http://masr.20at.com:80/article.php?sid=533&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
