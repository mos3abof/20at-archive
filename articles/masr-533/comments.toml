[[comments]]
order = 12
subject = "سباك مؤهل جامعي"
author = "مشروع ارهابي"
posted = "2006-06-24"
text = "شوفوا اخر انجازات اللامبارك<br />ففي اخبار تنفيذ برنامجه الانتخابي لتوفير اللا فرص عمل للشباب فقد وقعت الحكومة المصرية اتفاقية شراكة مع الصين لانشاء مدينة للحرفين تتضم( سباكين,نجاريين, حدادين) يعني من الاخر مدينة للحرفين<br />لكن هذا ليس المهم<br />المهم هو ان المدينة ليست مخصصة للحرفين من اصحاب المهنة لكن هي مدينة لاستيعاب الشباب العاطل خريجي الجامعات والمعاهد العليا يعني تدريب تحويلي<br />يعني الشاب ذاكر وطلع دين اهله في مصاريف وتعب الليالي في الامتحانات علشان في الاخر يصبح سباك مراحيض بمؤهل بكاللريوس تجارة مثلا . او نجار عفش ليسانس حقوق وهكذا.......<br />ويروح الشاب لحماته ويتقدم لخطيبته ويقولها :<br />حماته:عرفني بنفسك......<br />الشاب:احمد وحاصل علي بكاللريوس تجارة بامتياز<br />حماته:عندك شقة<br />الشاب: ايوة<br />حماته:فين<br />الشاب:في مدينة الحرفين<br />حماته:فين المدينة الغريبة ديه<br />حماته:ومش معني المدينة ديه<br />الشاب:علشان اناشغال فيها<br />حماته:شغال محاسب في شركة والل مصلحة حكومية والل فاتح مشروع خاص<br />الشاب:شغال سباك...............<br />حماته: كسمـــــــــــــــــك"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072654/http://masr.20at.com:80/article.php?sid=533&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

