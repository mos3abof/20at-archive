[[comments]]
order = 7
subject = "مثال لشاب بيئة"
author = "في مرة قابلت شاب بيئة ريحته تقرف و لابس حظاظة و هاري شعره جيل و لما اتكلمت معاه عرفت انه صبي ميكانيكي كان بيصلح عربية في عز الشمس و لسة راجع ملحقش ياخد شاور و رجع للبيت جري لامه و اخواته اليتامي عشان يتغدوا سوا عدس اصفر مطبوخ علي البابور و بعد م اكل و حمد ربه دخل استحمي في الطشت و دهن شعره جيل و حط برفان مضروب و نزل ياكل درة عالكورنيش"
posted = "2006-05-15"
text = "**قصة قصيرة من تأليفي<br />ياريت فعلا نلغي كلمة بيئة من قاموسنا او يمكن الكلمة لسة ليها استخدام في حالة مختلفة ... ممكن نستخدمهامع الشاب ابن الناس اللي نزل بعربيته الجديدة عالزيرو و حاطط برفان بمليون جنيه يعاكس البنات بنات الناس قوي جدا اللي لابسين محزق قدام النادي<br />و قس علي ذلك ... في امثلة اخري كتير للشباب البيئة فعلا"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

[[comments]]
order = 8
subject = "الاخت العزيزة مي"
author = "بالطبع لم تقصدي التهكم علي طبقة بعينها و انما كنت تقصدين التهكم علي التقليد الاعمي و اهتمام الشباب بالمظهر علي حساب الجوهر أو ربما قصدت فقط كتابة موضوع خفيف مصحوب بأغنية كوميدية و بالرغم من ذلك فقد اعتمد رصدك للظاهرة علي الشكل الخارجي فقط دون التركيز علي جوهر الامور مما جعل بعض الجمل تبدو كما لو كنت تتهكمين علي طبقة معينة مثل جملة \"بصي أهم حاجة ع التي شيرت أو القميص.. لو داخل جوا البنطلون اعرفي فورا إنه بيئة ومبيعرفش يلبس كمان\" لانها ترتبط بطريقة حياة معينة مثل الحياة في الريف مثلا او الاحياء الشعبية اكثر من ارتباطها بنوعية الشباب المقصود بالموضوع و أيضا جملة \"أما لو حظك وحش وقربتي منه فممكن تشمي ريحة البرفان واللي غالبا هيكون مضروب\" و جملة \"ركزي قوي ع الجزمة الكوتش\" أما جملة \"وتقدري تميزي كل الأفلام اللي كان فيها البطل أقل ما يقال عنه جربوع ونضف في آخر الفيلم\" فهي القشة التي قسمت ظهر البعير حيث تأتي من الكلمة الشهيرة \"محدثين النعمة\" و كأن الثروة و النضافة يجب أن تظل قاصرة علي فئة معينة من المجتمع. بالاضافة للعديد من الجمل الاخري الجارحة للكثير من الشباب المثقف المتعلم محدود الدخل او الطبقة العاملة الفقيرة التي يشغلها اهتمامها بالحصول علي قوتها اليومي عن متابعة أحث خطوط الموضة التي تتغير كل فترة قصيرة لعلنا نتذكر منذ ثلاث سنوات ان لبس تي شيرت نص كم فوق قميص بكم كان اقصي درجات البيئة ثم اصبح موضة لذوي الذوق الرفيع و عندما انتشرت الموضة عادت مرة اخري لدائرة الناس البيئة."
posted = "2006-05-15"
text = "اما بالنسبة للذوق المتدن في الافلام و الاغاني فهو غير مرتبط بفئة معينة لان المجتمع المصري كله يستمتع باغاني بهاء سطان و يشاهد فيلم اللمبي و مع ذلك فلم تذكري في موضوعك النموذج المقصود بالفن الراقي هل هي اغاني ع<br />اقرأ بقية التعليق .."
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

