subject = "كل إناء بمافيه ينضح"
author = "AHSD2000"
posted = "2006-06-04"
text = "أسلوب سخيف جدا للتريقه على طبقه الشباب الكادح المعدوم في البلد.<br />مش ذنب الولد ان اهله حرموه من التعليم لقله ذات اليد.<br />ومش ذنبه انه اتجه للعمل في وقت كنت بتخرجي لدريم بارك مع المس بتاعت الكلاس.<br />ومش ذنبه ان مقدرته الماديه بتجبره على شراء برفان رخيص وملابس من شارع الشواربي وواقف يعيش حياته ويتنفس شويه امل على احد الشوارع.<br />على فكرة الواد اللي مسمياه بيئه وهو واقف على الشارع مش ممكن يفكر يوقف مع بنت من طبقتنا لانه عارف انها عاليه فوق ومش من نصيبه.فياريت تسيبيه في حاله وكفايه عليه اللي هو فيه.وعيشي انت مع الشاب الروش ابو نضاره شيك وعربيه اخر موديل ولابس لبس من داليدريس.بس افتكري حاجه مهمه........<br />لو الظروف اتعكست هترضي يتكلم هو عن البنت البيئه؟؟<br />اخوك د/احمد"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182634/http://masr.20at.com:80/article.php?sid=326"

