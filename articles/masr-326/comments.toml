text = "الموضوع مش تافه….مش ده اللي معظم البنات بيتكلموا فيه؟؟<br />عجبني وصف مي للشاب اللي من النوع دة<br />ومالوش علاقة بالفقر والغنى<br />علاقته بالذوق العام<br />الشاب لو مستحمي ولو بصابون مواعين<br />وشعره قصير وضوافره قصيرة ونظيفة<br />وهدومه مغسولة ومكوية<br />وجزمته متلمعة مش مهم تكون ماركة<br />ومافيش داعي للحظاظة وطوق الكلاب اللي في الرقبة<br />ومافيش داعي للزيت والجيل والعطور المضروبة<br />المهم ان تفوح منه رائحة النظافة<br />ودي مش محتاجة اكتر من ماء وصابون<br />وكمان عجبني وصف اناناس للبنت اللي من نفس النوع<br />بس عيب جدا التجريح في شخص مي<br />واللي بيحب مصر لازم يكون راجل في مظهره ويكون ابن بلد بجد<br />وزي مابيلاقي وقت يسمع اغاني هابطة ياريت كمان يلاقي وقت<br />يقرا ويثقف نفسه بشوية برامج جادة في الفضائيات"
