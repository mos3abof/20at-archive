text = "ليه يا مى الموضوع دا<br />و دلوقتى بالذات و بعد اللى كلنا قراناه ف موضوع اه<br />ايه الموضوع دا<br />و ايه التعليقات دى<br />يا جماعه مش بقول يبقى الموقع كله نكد بس بقول فيه موضوعات light احسن من كدا<br />و بعدين يا مى لو هنناقش الموضوع نظرتك لشياكه ولد او الحكم هو vulgar و لا لا سطحيه جدااااا<br />لا للتمديد<br />لا للتوريث<br />نعم لتعديل الدستور"
