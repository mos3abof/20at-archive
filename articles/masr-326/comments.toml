author = "متظلموش الاخت مى الاخت مى شكلها اساسا كانت ساكنه فى ابو اتاته وربنا كرمها بواحد مغفل واجوزها وسكنها فى م نصر ولا مصر الجديده فعلشان كدا هيا مخنوقه من جوها القديم وذى ماذكر اخ تعليق فى الموضوع عن نوع الصابون الى البيئتين بيستحموا بيه فهيا كانتتا بنوع الصابون الوحش مى اعقلى ياشاطره واعرفى ان فى ناس مثقفين وكتاب على مستوى بيدخلو الموقع ده يعنى باختصار مفيش فرافير هنا علشان حد يغضب عليكى بس فى ناس محترمه ليهم انهم يخافوا على اصحابهم ولا ايه رايك يا اخت مى يام كدش"
