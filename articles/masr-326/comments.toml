[[comments]]
order = 17
subject = "انتوا مضايقين كده ليه ولا الكلمه جات على الجرح"
author = "Ahmad"
posted = "2006-05-16"
text = "اولا مي ماكنتش بتتكلم على التفرقه بين الطبقات او كانت بتتريق على طبقه معينه بعينها .هيا كان قصدها على ناس معينه احسن حاجه تتقال عليهم انهم بيئه والحكايه دي مش مرتبطه بالفقر او الغنى فالمكانيكي بيكسب كتير وممكن يلبس اغلى لبس لكن تيجي تبص لشكله هتلاقيه تعبان خالص ومايقدرش دكتور الجامعه مثلا يتكلم او يتناقش معاه او ينزل لمستواة الفكري.<br />والدليل على كده ان اغلب الشعب المصري مش غني بل حالته تعبانه لكن هتلاقي الطبقه الوسطى مليانه ناس جميله وشيك حتى لو مش معاها فلوس كتيرالعبره بالدماغ والفكر والاحساس.<br />مي كان قصدها على ناس غريبه بتلبس بطريقه غريبه تقرف وبتكلم بطريقه اغرب ولو كل واحد فكر يقول الحق هيلاقي ان اغلب الناس دي بتفكر بطريقه همجيه خلي مثلا واحده حلوة تعدي من جنبهم واسمع المعاكسه عامله ازاي منتهى القرف وياسلام بقى لو البنت صدتهم يبقى حلت عليها اللعنه وهيشتموها باوسخ الالفاظ اللي يعاقب عليها القانون وكلكوا عارفين ان ده بيحصل وييجي بعد كده واحد يقولي معلش دول فقرا فقرا ايه ونيلة ايه ممكن تكون بتفهم كويس وفقير في نفس الوقت .<br />وهيا معاها حق فعلا في وصف لبس الناس بالشكل ده لأن دي سمتهم في اللبس لحد مابقت علامه مميزة ليهم اي نعم في شواذ بس الغالبيه مش كده .<br />وطبعا مانقدرش ننكر ان شكل الانسان بيحدد مستواه الفكري قبل المادي ومش لازم يكون ده مرتبط بالفلوس .<br />هيجي واحد ويقولي والناس الغلابه دي اللي مش لاقيه تاكل تلبس حلو ازاي زي الاغنياء وازاي تتابع صرعات الموضه عشان ماتكونش بيئه هقوله انت مافهمتش جوهر الكلام لأن ماحدش قال كده وماحدش قال لازم تبقى غني عشان تلبس كويس بس ايه المانع لما تكون راجل على قد حالك ومكافح وفي نفس الوقت شكلك يكون شيك والشكل الكويس مرتبط بالشخص واحساسه بالجمال مش<br />اقرأ بقية التعليق .."
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

[[comments]]
order = 18
subject = "عبد الله مفتاح انت شارب حاجه"
author = "فادي محمد"
posted = "2006-05-16"
text = "انا كل اللي ضايقني منك كلمتك ان البنت اللي تمدح الولد فيه عيب في شخصيتها لكن الولد اللي يمدح البنت عادي.<br />وانا اضايقت لأني ماعرفش حاجه اسمها ولد وبنت السجاير وحشه تبقى وحشى للكل مش للولاد حلوة وللبنات وحشه..<br />لازم تنضف مخك شويه وواضح ان العيب في شخصيتك انت"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

[[comments]]
