[[comments]]
order = 30
subject = "البنت الموبيأ"
author = "أناناس"
posted = "2006-05-16"
text = "تعرفوا بقى البنت الموبيأ، اشمعنى يعني يا حرام الشباب اللي بنلطش فيهم؟!<br />دي في بنات موببأ والله أكتر وخصوصاً بعد ما بقى تقليد الهدوم النضيفة أسهل حاجة.. بس برضه الحدق واللي بيفهم بيلاحظ...<br />البنت الموبيأ زمان كانت حاجة ودلوقتي قدرت تتنكر شوية وتندمج بس برضه الحلوة بتتكشف<br />أولاً التشدق باللبانة، والأكل وبقها مفتوح وصوت وشكل الأكل في بقها يقرفك منها ومن اللي بتاكله اللي غالباً بيكون بواقي لحم كلاب جوة رغيف حوواشي أو طعمية متحمرة في زيت عربيات.<br />الصوت العالي في الكلام وتلاقي كل الخلق حواليها سمعينها وعرافين حكايتها وأصلها وفصلها، ما هي شرشوحة بقى بعيد عنكم.<br />وتلاقيها برضه بتشوح يمين وشمال بإيدها.<br />والصوت يخرم ودنك مع التركيز على حرف التاء اللي طبعاً اسمه عندها تشه، زي تشفاح، تشامتشم، حاتشيم، والقاف اللي بقى كاف وهكذا<br />بالنسبة لريحة العرق برضه مقلكوش تقرف تقرف تقرف وكأنها بترش إزازة بارفان عرق كاملة قبل ما تنزل وتعرق أصلاً... وكله كوم وجمال الظوافر كوم تاني... والبنت بقى بالذات بتتعرف من ظوافرها على طول<br />تلاقيها بقى يا إما معضعضاهم وطول الوقت حطة إيدها في بقها ومدياها، يا إما مطولاهم والوساخة اكوام اكوام جواهم، ومش بعيد تكون حاطة مانيكير اللي بتقول عليه بلغتها (مونوكير أو إكلادور) وغالباً بيكون لونه، فوشية، نبيتي، فضي، أورانج وطبعاً بنتسيبه لغاية لما يقشر علشان شكلها يبقى أبيأ.<br />طبعاً الرجل... مقشفة ومشققة شوية، ودلوقتي في الكعوب الخشب الكبيرة اللي تلاقي الواحدة من دول لابساها وصوابع رجليها باظة منها وماشية تكركع على الأرض.<br />في حاجات تانية كتييييير أوي حبقى اكمل بعدين"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

