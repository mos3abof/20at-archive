[[comments]]
order = 48
subject = "الناس كلهم بيئة واحدة"
author = "مفيش فرق ابداً ما بين الفقراء في البيئة"
posted = "2006-05-23"
text = "والأغناء في البيئة<br />فكلهم بيئة فعلاً ...<br />وهذا هو حال شباب الأيام ده ..<br />إذا كان الأغنياء يقصدون ان شباب الفقراء<br />بيئة ويسكتون لانها تعمل في معناها ( بيئة وسخة)<br />فأنا أرى أيضاً أن أولاد الأغنياء وأولياء أمورهم بيئة وسخة أيضاً ...<br />وهم في البيئة سواء .<br />وأولاد البيئة الوسخة الأغنياء..<br />يفعلون تماماً مثل ما يفعلون أبناء البيئة الوسخة الفقراء بزعمهم ...<br />مثال .........<br />الجيل والفازلين ... يستعملونه أولاد البيئة الوسخة فقراء وأغنياء على السواء<br />مع اختلاف الكمية والنوعية ..<br />الحظاظة ... يلبسها أولاد البيئة الوسخة فقراء وأغنياء .. مع اختلاف نوعية الجلد<br />والشكل والسعر ..<br />وكذلك أولاد الأغنياء البيئة الوسخة<br />يلبسون حضاضة في رقبتهم كالكلاب أيضاً وفي أيدهم .. بس هي يمكن مش بتعمل ريحة<br />علشان ولاد البيئة الوسخة الأغنياء بيستحمو كتير وبيغيروا الحظاظة لانهم عندهم اكتر من عشر اشكال ليها معلش الفقير لانه فقير معندوش إلا واحدة فقط علشان بتعفن من ريحة العرق ومن الميكروباص ومش بيقعد في التكييف<br />المهم إنهما كلهم بيئة وسخة ...<br />طريقة الكلام والتشويح والكلام بالأيدي<br />ولاد الأغنياء البيئة الوسخةوالفقراء<br />يشتركون في هذه النقطة أيضاً .<br />فالبيئة الوسخة فقراء يتحدثون بأيدهم<br />من نوع البلطجة وانه مش هامة حاجة في الدنيا<br />وأولاد الأغنياء (البيئة الوسخة ده برضوا)<br />يتحدثون بأيدهم في الحوارات نوعاً من تأكيد الذات وبلاغة الحوار وتقليداً منهم لشباب البيئة الوسخة الفقراء ..<br />نقطة كمان<br />الشاب البيئة الوسخة الفقيرة .<br />هتلاقيه كمان كل شوية بيفرد التي شيرت بتاعته أو القميص اللي لابسه.. وعمال كل خمس دقائق يتأكد إن شعره لسه ملزوق في رأسه مطارش ولا حاج<br />اقرأ بقية التعليق .."
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

