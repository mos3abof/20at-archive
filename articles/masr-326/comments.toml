[[comments]]
order = 33
subject = "مهلا يا شباب"
author = "من غير اسم"
posted = "2006-05-18"
text = "مهلا يا شباب..في ظني أننايمكننا العيش بطريقة أفضل اذا تعلمنا أن نحسن الظن، واذا احسنا الظن في مي، فسنرى أنها لم تكتب هذا المقال إلا لتحدثنا عن ظاهرة انتشرت بين شبابنا وهي \" التقليد الأعمى\" فهذه الهيئة اصبحت صورة لكثير من الشباب اعتقدا منهم انهم يواكبون العصر، فهم يحاكون النماذج الغربية الغبية على اسا انهم اهل التقدم ولا يعلموا أنهم يرمون الينا بأقبح ما عندهم..وربما للشباب الحق في ذلك فهم لا يجدون ما يحكاونه في اوطاننا العربية،ولعلهم بذلك يوجودن لآنفسهم كيان يشهد له الجميع بأنه صاحب اليد العليا على هذه الأرض.. وفي ظني أن مهمتنا هو توعية الشباب باهمية كونه عربيا ، وان نوجد له نماذج عربي يفخر به ويحاكيه"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

