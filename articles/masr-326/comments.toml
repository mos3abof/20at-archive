[[comments]]
order = 11
subject = "اسفاف من ولاد البلد"
author = "د . محمود"
posted = "2006-05-15"
text = "بصراحة عيب على موقع ولاد البلد يتكتب فيه حاجة زى دى على فكرة انا من قراء الموقع من زمان ولكن لا اعلق على المكتوب فيه من أراء ولكن هذا الموضوع مستفز لانه بصراحة مثال صارخ لما يعانية المجتمع المصرى من طبقية وتفرقة بين المواطنين .<br />يعنى لو حضرتك مثلا من سكان مصر الجديدة ولا المهندسين ولا جاردن سيتى ولا اى منطقة وسألتى واحد أو واحده انتى منين وقالت لك مثلا من الجيارة او القلعة او شبرا الخيمة شوفى نظرتك هتقى ازاى ولو الشخص اللى انتى بتسأليه قالك انه من التجمع الخامس او مدينة الرحاب او من اى منطقة راقية ( حسب مواصفاتكم ) شوفى النظرة هتكون ازاى وانا بعتبر الشخص اللى ينظر النظرة دى هو اللى بيئة بل وبيئة ......ولا بلاش عيب عليكم ياولاد البلد خليكم ولاد بلد بجد"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

