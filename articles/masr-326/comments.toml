author = "حضرتك تقصدي بالشاب البيئة الشاي الفقير اللي معندوش بارفان اصلي و بيحط برفان مضروب و لا الشاب الفقير اللي علامه علي قده و ميعرفش يسمع هارد روك و بيسمع شعبان عبد الرحيم ولا يمكن تقصدي الشاب الفقير المطحون اللي اتخرج و مش لاقي شغل و بيحاول ينسي همومه بالسنكحة في الشارع او يمكن الشاب اللي المجتمع مقدرش ينمي حسه الفني من خلال تعليم محترم يفهمه ان الجوهر اهم من المظهر و النظافة من الايمان .... حضرتك تقصدي مين في دول"
