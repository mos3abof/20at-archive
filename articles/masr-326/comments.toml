subject = "مممم"
author = "لور دكاش"
posted = "2006-05-15"
text = "عنوان الموضوع جذبني، بس التنفيذ جه معاكي أوت يا مي.. وحسيت كأنه تريقة على طبقة معينة، لا يعني عدم انتمائنا ليها اننا نحتقرها.<br />وعلى الرغم اني للأسف ساعات بنجرف وأوصف ناس معينة بأنها بيئة، لكن بجد دي حاجة جارحة جدا، وإذا كنا مش هنعرف نتقبل شباب زينا.. وعايشين معانا في بلدنا وبيشاركونا نفس الهم، يبقى عيب علينا قوي..<br />أنا بصراحة نفسي نلغي كلمة بيئة من قاموس الشباب.. إيه رأيكم ؟"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

