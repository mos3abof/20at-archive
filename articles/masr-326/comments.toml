subject = "شوية جدية"
author = "ياريت شوية جدية"
posted = "2006-05-16"
text = "تعرفه بيئة ولا مش بيئة ولا أصلا تعرفه ليه أيه المهم في كده؟<br />لما نحب ننوع للناس بره السياسة مش معنى ذلك نرميهم في مواضيع سامحوني لو قلت تافهة<br />وكمان لو الموضوع ده بالنسبة لنا مهم يبقى مفرقناش كتير عن متظاهري تامر حسني"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

[[comments]]
