text = "بعيد عن الموضوع وبعيد عن الكتابه والاسلوب انا عايز اقول ان في حاجه بتدايقني جدا جدا جدا جدا<br />مش عارف ليه؟ يمكن عشان انا متخلف مثلا؟<br />الحاجه دي اللي هي بنت تمدح في جمال ولد وتمدح عادي جدا يعني تقول مثلا (تحفه او بحبه اوي او بموت فيه او خطييييير عنية جوهرة ....الخ)<br />طبعا واحده هتقول لي اشمعنه الولاد من حقهم يمدحوا واحنا لا انت بتمبلك ثقافه ذكوريه هي اللي بتخليك تدايق لكنه امر عادي<br />وانا ارد واقول اللي عايزة تمدح ليها انها تمدح براحتها بس اظن انها نقطه سودة في شخصية البنت اللي شايفها انها حاجه عاديه<br />لا للتمديد لا للتوريث نعم لتعديل الدستور"
