subject = "انتوا ياللي بتتريقوا على البنت المسكينه"
author = "محمد صابر"
posted = "2006-05-16"
text = "انتوا ياللي بتتريقوا على البنت المسكينه ماتنضفوا دماغكوا بقى وتبطلوا شتيمه وقلة ادب.<br />لو انتوا كان عندكوا بقايا مخ كنت عرفتوا انها مش بتتكلم عن الطبقات وعن الفقرا والاغنيا بس واضح ان اغلبكوا مش بيعرف يفهم جوهر الكلام ومعناه الا اذا كنتوا من العالم اللي هيا بتنقدهم"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

[[comments]]
order = 21
subject = "لموا نفسيكوا شويه"
author = "احمد المصري"
posted = "2006-05-16"
text = "ياريت ياجماعه تكونوا متحضرين وتحترموا اراء الناس وتبطلوا قله ادب والناس اللي بتقول ان الموضوع مش مهم احب اقولكوا انه مهم لأني بتخنق من الناس دي عشان بتدخل في كل حاجه وهما اغبيا اساسا وعشان مش بيعجبهم العجب ودايرين تريقا على خلق الله مع ان مناظرهم تقرف"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

[[comments]]
order = 22
subject = "المؤمن كيس فطن"
author = "المؤمن كيس فطن بمعني انه المفروض يعرف يكتب ايه و ميكتبش ايه لان الكتابة دي مسئولية يحاسب عليها مش نزهة خلوية خصوصا لو في موقع له تأثير واسع علي الشباب ... و المؤمن كيس فطن بمعني ايضا انه لو حب يوصل معلومة معينة يبقي لازم يعرف يوصلها ازاي من غير ما يثير استياء الناس و تناولك للموضوع كان بعيد كل البعد عن الكياسة و الفطنة و للاسف جوهر الموضوع اختفي تماما بسبب استخدامك لاوصاف غير لائقة و مهينة ووقعتي في نفس المطب اللي وقع فيه مرشد الاخوان لما قال طظ في مصر مكانش يقصد و كل الناس ممكن تقولها بس مش شخص في الموقع دا و في الظروف دي يقولها"
posted = "2006-05-16"
text = "نصيحة متكابريش و اتعلمي من الخطأ اللي كل الناس اجمعت انه خطأ و نحن في انتظار موضوعات جديدة منك بفكر جديد بس مش زي بتاع الحزب الوطني"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

[[comments]]
order = 23
subject = "موضوع زبالة"
author = "سامي"
posted = "2006-05-16"
text = "و مشعارف الناس اللي بتدافع عنه محموقة اوي كدة ليه هي ناقصة قرف و بعدين ماالزبال اللي اسمه تامر حسني بيحط جيل و بيلبس حظاظات و بيمثل افلام فاشلة ماقلتوش عليه بيئه ليه مع ملاحظة اني كابتكلمش عن نفسي علشان مايطلعش كلب يقول اني متضايق علشان الكلام جه علي الجرح و الكلام العبيط ده"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

[[comments]]
order = 24
subject = "بالراحه عليا يا فادي"
author = "عبدالله مفتاح"
posted = "2006-05-16"
text = "بص يا فادي انت شكلك بتقرا الكلام بسرعه لاني<br />اولا:مقلتش ان الولد لما يمدح جمال بنت يبقى عادي مقلتش كده خالص واقرا كلامي مش هتلاقي اني قلت كده<br />ثانيا:انا بردو لسه عند كلامي ان البنت يعيبها انها تسرف في مدح جمال الولد (بموت فيه او بحبه مووووت ....)<br />وان كنت انت شايف ان ده طبيعي ان البنت تقول كده يبقى انت حر بس انا كمان حر في قناعاتي<br />ثالثا: انت بتقول على ان العيب في شخصيتي واني لازم انضف مخي شويه ماشي يا سيدي هحاول انضف مخي شويه بس انت متزعلش نفسك اوي كده<br />يلا يا عم ان كان كلامي دايقك حقك عليا بس لو دايقك تاني كلمني بالراحه عشان نعرف نرد على بعض باسلوب شيك انت شايف التعليق اللي فوقي في الفاظ ازاي وانا محبش مستوى كلامنا يبقى كده<br />لا للتمديد ...لا للتوريث... نعم لتعديل الدستور"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

[[comments]]
order = 25
subject = "اللي كتب الموضوع ملوش جوهر اصلا عشان نبص عليه"
author = "محمد اسلام"
posted = "2006-05-16"
text = "ياجماعه احب اقول اني مع Ahmad ومي وان في ناس كتير هتضايق عشان هتاخد الكلام على نفسها مع ان كلمه الكلام جه على الجرح مافيهاش شتيمه او حاجه الا ان الاخ اللي كتب الموضوع اللي اسمه \"الموضوع ملوش جوهر اصلا عشان نبص عليه \"اظاهر خدوا على نفسوا وقل ادبه اوي لما رد على احمد وعشان كده يستاهل الشتيمه اللي اتشتمها"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

[[comments]]
order = 26
subject = "مع اني بتكلم عربي لكن برضوا مافهمتوش كلامي"
author = "Ahmad"
posted = "2006-05-16"
text = "الناس اللي نازله تريقه على كلامي احب اقولكوا انكوا اغبيا لأنكوا مافهمتوش حرف من اللي كتبته ولا فهمتوا مجمل كلامي اللي معناه ان الطبقات كلها واحد وان مش الفلوس او الطبقه هيا اللي تخليني احكم على الشخص او شكله واكدت على ان الشخص مش مهم يكون معاه قد ايه عشان يكون ابن ناس في شكله او كلامه يعني كلام كلنا متفقين عليه واذا كنت شتمت الاخ اللي اسمه ايه فده عشان هوا قل ادبه في الاول يعني مش من الباب للطاق"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

[[comments]]
order = 27
subject = "مهلا يا أحباب"
author = "عمرو إبراهيم"
posted = "2006-05-16"
text = "السلام عليكم<br />بداية استغربت من وجود هذا الموضوع فى قسم أولاد البلد.<br />ولكن ما ساءنى فعلا هو الأسلوب الذي وصلت إليه التعليقات، والألفاظ المستخدمة.<br />لماذا كل هذا الحنق والاندفاع والتراشق بالألفاظ المحترمة وغير المحترمة؟؟!!<br />لماذا لا نتعلم فن التحاور والمناقشة بالحسنى؟<br />لماذا تتجرف - بسهولة جدا - نحو البذاءة اللفظية؟<br />مهلا يا اخوانى مهلا"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

[[comments]]
order = 28
subject = "الاسلوب... لم يوصل للمعنى المطلوب"
author = "واحدة وخلاص"
posted = "2006-05-16"
text = "من الواضح ان الكاتبة كانت تقصد المعنى اللي موجود في الاغنية بس هي ما عرفت توصله صح<br />اما المعنى اللي موجود في الاغنية فهو بيتريق على حال الشباب الان...وعلى نوعين-فقط- من الشباب موجود بينا دلوقتي معتمدين اعتماد كلى على المناظر<br />نوع بتاع بابي جلي دي ومامي جابتلي دي اللي بيبقى ( مصروفه اليومي) يكفي اكل وشرب ولبس عيلة كاملة فقيرة لمدة شهر كامل معاه فلوس ومش عارف قيمتها لانه متعبش فيها وم عارف يعمل بيها ايه غير انه يتمنظر على اللي اقل منه.<br />ونوع تاني بيبص له ونفسه يبقى زيه وبيحاول يقلده وخلاص ومايعرفش ان ربنا عطى كل واحد مميزات وعيوب مختلفة عن غيره<br />والنوعين دول معندهمش شخصية لان تربيتهم كانت غلط<br />وللأسف مجتمعا بقى فيه نسبة كبيرة من النوعين دول"
archived = "2006-06-02"
capture_url = "https://web.archive.org/web/20060602084523/http://masr.20at.com:80/article.php?sid=326"

