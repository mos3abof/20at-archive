subject = "انا شاب بيئة"
author = "احمد"
posted = "2006-05-18"
text = "اختي العزيزة مي<br />للاسف بعد ما قريت مقالك اكتشفت اني شاب بيئة فانا للاسف مهندس موقع و بادخل القميص جوة البنطلون وجزمتي معفنة من الخرسانة و بحب اكل وسط عمالي و بحب اسمه سعد الصغير و شعبان عبد الرحيم بس بحب مصر بجد و بحب تراب مصر واحنا احسن شباب العرب و هذا ليس كلام و لكن عن خبرة و احتكاك بيهم علي الاقل احنا فعلا بنحب بلدنا من قلبنا بجدو نفسنا تبقي احسن بلاد العالم و هذا لن يحدث الا لو تواضعنا شويةوبطلنا تريقة علي خلق اللة"
