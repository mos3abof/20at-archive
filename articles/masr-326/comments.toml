[[comments]]
order = 61
subject = "ايااااااااااااااااااام سوده"
author = "محمد الفيومي"
posted = "2006-06-06"
text = "والله دي فعلا ايام سوده ومهببه بهباب اسود ومنيل...<br />ايه اللي انتي كتباه ده؟؟<br />هل وصل بنا الحال لان يكون مقياس التمييز فيما بيننا هو موضع القميص بالنسبه للبنطلون ..؟؟ هي دي مشاكلنا دلوقتي..؟؟<br />هي دي النصايح العظيمه للست مي مبعوثه العنايه الالهيه لانقاذ فتيات المجتمع الراقي من ابناء (البيئه) ؟.....<br />ان ما كتبتيه يدل بما لايدع مجالا للشك انك نتاج بيئه معينه..فعلا كل منا ابن بيئته ....<br />تصدقي ان انا بيئه لاني قريت موضوع بيئه زي ده من كايبه هي بنت ذات البيئه...<br />منك لله يا مااااااااااجد"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182634/http://masr.20at.com:80/article.php?sid=326"

