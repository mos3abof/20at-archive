subject = "سلمت ايدك الاتنين يا قطوب"
author = "مجاهد شرارة"
posted = "2006-04-26"
text = "بصراحة مكنتش اعرف انك سياسي محنك ...شفت محنك دي ...جامدة:)))))<br />فعلا الحكومة دي بتهييس على الآخر وتقريبا كده خلااص وصلت لحالة يرثى لها ....وقريبا هاتحصل كابسة ويتلموا جميعا ونخلص منهم ومن قرفهم"
