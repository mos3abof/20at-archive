[[comments]]
order = 6
subject = "إلا القضاء يا فاقد الشرعية"
author = "مصرى"
posted = "2006-04-30"
text = "إلا القضاء يا من أزل الشعب وأهين بوجودك فى الحكم ليعرف العالم كله أنك حاكم مرفوض من الشعب ولم تكن فى يوم من الإيام حاكم بإرادته ولتعلم أن هذا القضاء هو الذى سيحاكمك على كل أفعالك منذ إغتيال السادات وتقلدك الحكم ونهبك وفسادك إرحل الشعب كله لا يريدك تراب مصر الطاهر سيلفظ جسدك بعد وفاتك فهو لا يأوى الحاكم العميل الخائن"
archived = "2006-05-05"
capture_url = "https://web.archive.org/web/20060505063011/http://www.masr.20at.com:80/article.php?sid=226&PHPSESSID=01ad9ae3da9e03113b768ff0b0c87618"
