[[comments]]
order = 0
subject = "يا ليتنى فى شجاعة القضاه"
author = "نفس بشرية"
posted = "2006-04-25"
text = "أتمنى أن أكون فى نصف شجاعة القضاه الشرفاء فيالحظ من وقف فى وجه حاكم ظالم و قال له قف أيوه الطاغوت عند حدك قف و لا تتمادى فى طغيانك فأن كنت أنت حاكم على هذه البلاد فويلك من رب البلاد و العباد , و بالفعل أوافقك الكاتب الكريم فى ما قاله عن حاكمنا و من يحمونه فهم فى حالة تخبط و يبدو جليا أن السيد الرئيس إختار أن يقضى البقية الباقية من حياته الفانية فى طغيان و ظلم و قهر لشعبه فهو لا يقدر فى هذه السن المتقدمة على أن يبادر بأى مبادرة إصلاحية لا يدرى الى ما قد تفضى فربما تفضى الى نتائج عكسية و ينهار نظامه المهترأ أصلا و (يتبهدل) على أخر أيامه و بعد الشيبة دى و أقصد الشيبة المصبوغه فى الثمانين من العمر فقرر أن يلتزم الأحوط و يبقى الأحوال كما هي عليه و يبقى على سدة الحكم حتى أخر قطرة من قطرات ماء تغسيلة فى كفنه و هو بذلك لا يدرى أنه يترك لإبنه (طبعا بالإضافة للميراث الطائل) ميراثا أخر من الفوضى و الإحتقان على جميع الأصعده السياسية و الشعبية و الاقتصادية و الإجتماعية و يبدو أنه بالفعل لا يحب جمال ليترك له هذا الخازوق المغرى"
archived = "2006-05-05"
capture_url = "https://web.archive.org/web/20060505063011/http://www.masr.20at.com:80/article.php?sid=226&PHPSESSID=01ad9ae3da9e03113b768ff0b0c87618"

