archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131721/http://www.20at.com/article2.php?sid=406"

[[comments]]
order = 17
subject = "مادخل هذا في ذاك00"
author = "جوووووووود"
posted = "2006-09-10"
text = "لقد دمج في هذا الموضوع(الموت)بين الاغاني والاناشيدوهذا دمج جائر حيث ان ما تتكلم عنه الاغاني (غالبا) يكون مجرد غناء ولاهدف منه علاوة على ذلك الغناء يكون مصحوب بآلات مسيقية لاتجلب سوى الهم وخلق جو من الكآبة اما الاناشيد فكثيرا ماتكون اهدافها سامية واقرب مثال على ذلك نشيد(فرشي التراب)الذي يذكر الانسان بالمرحلة البرزخية ويزيد من همته ومسارعته للاعداد لهذه المرحلة 000ولكم شكري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131721/http://www.20at.com/article2.php?sid=406"

[[comments]]
order = 18
subject = "اخ جديد"
author = "مصطفى"
posted = "2006-09-14"
text = "السلام عليكم<br />يا جماعه انا شايف ان كل واحد مننا كاتب تعليق لمجرد انه تعليق على موضوع موجود فى منتدى والمشكلة اننا ناسيين اساس التعليق واية مضمونة ومضمونه ان الموت هوة الشىء الوحيد الواقعى والحقيقة الوحيدة اللى فى حياتنا فا المفروض لما نيجى نتكلم عليه يكون كالمنا علية بالطريه الصح وكون اللى حط الموضوع دة ليه ذلات فا دة مش مشكلة المهم احنا عملنا اية لما قرينا الموضوع او سمعنا الأغانى دى واية اللى عاد علينا<br />بس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131721/http://www.20at.com/article2.php?sid=406"
