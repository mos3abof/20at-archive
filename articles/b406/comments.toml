text = "انا مش عارفه الاخ اللي فوق مش فاهم ايه بالظبط؟ الموت علينا حق وانا شايفة ان معنى الاغاني اللي فوق المقصود منها الاغاني اللي بتحكي عن الموت او بتذكره بغض النظر عن كونها دينية او مجرد اغاني وبعدين الموت هو هو بالعكس ان شايفة ان الملف هايل جدا واكثر حاجة عاجباني كمية التنوع في المضمون بجد برافو عليكو يا عشرينات ودايما عايزين حاجات كده"
