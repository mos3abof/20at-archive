subject = "مع عدم الامؤاخذه"
author = "عبده نصحي"
posted = "2006-02-07"
text = "انا شايف ربط كلمه الموت مع كلمه اغاني ليس في محله وكمان الصوره للهياكل وهي بتعزف مش في محلهاااااا علي الاطلااااااق بصراحه انا مش عارف الموقع بيتناول موضوع الموت من اي وجه نظر عشان انا كدا توهت بجد لقيت الاخت مريم كاتبه عن افلام الموت قولنا ماشي نعلق وبعدين ادخل اغاني الموت الاقي اناشيد واغنيه لكاظم ايه التناقض دا بقي طالما جبتوا اناشيد يبقي انتوا بتتكلموا عن الموت من وجه نظر دينيه اسلاميه ياريت حد يوضحلي ويقولي هيه العلامه فين D:"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131721/http://www.20at.com/article2.php?sid=406"

