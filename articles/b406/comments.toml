[[comments]]
order = 15
subject = "علمتموني الصبر و التشبث بالحياة من أجل العمل و العبادة"
author = "عزيز"
posted = "2006-06-13"
text = "قبل دخولي إلى موقعكم هذا كنت في حالت من الحزن و الأسى وذلك بعد أن فاتتني مبارات إجتياز إمتحان في مادة السميائيات بسبب عدر فوق الطاقة، فعندما وصلت إلى الجامعة متأخرا بساعة طلبت من الأستاذة أريد أن أجتاز الأمتحان و قد تأخرت لسبب ... (شرحت لها كل شيء) لكنها ابت أن تسمح لي بإجتياز الإمتحان. فدهبت إلى كتابة شعبة اللغة العربية و آدبعها فلم أجد أذن صاغية بل ووجهت بالطرد فؤصبت بحالت نفسانية منهارة ليس من أجل الإمتحان وإنما من شدة إستغرابي من البشر الدي كانت من اختصاصاته إيجاد حلول لمثل هذه الحالات لكنه على عكس ذلك يواجهة الطلبة بجبروة و تكبر فبالله ما الطريقة التي يجب أن أواجه بها هذه التصرفات أو بالأحرى هذا القوم. لكن مقعكه هذا خفف علي من هذه المحن<br />شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131721/http://www.20at.com/article2.php?sid=406"

[[comments]]
