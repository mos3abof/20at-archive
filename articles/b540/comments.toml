text = "الشاب اليوم ولابتاع جيش ولا غيره أخره(المصاصة مع حبظلم بظاظة والشيكولاته مع حمو وطفاصه السينكرامونه فى اللمونة والفسفس فى الحمبلاظة وقطقط ضرب كتكت وفرفور ضرب زعرور وزعرور اشتكىشحرور ان زعرور ضربه وفرفور اتعاور على السحور وتوتو بيحب ماما والمزوت فى البنزين ومينا قلص وكلمنى على الماسير والساعة وام الجنازير وقلة أدب فى الجرنال وحماده وأمه مرات الصرصار وأبوى قالى لا قلت له حاضر وكمانقالىخلاص قلت لا قالى ليه قلت له لآه ه ه قالى ليه قلت له ستين لآلآلآلآ وطلعت حوارات ان حماده بتاع مخدرات وبص بقه هقولااااااااككككككككك ان الواد ده بيحبككك و شحرور طلع مغرور ووووووووووووووووووووووووووووووووووووووووووووووووووووووووووأم الجنازير بتسلم على الجماهير وقبل ما أنسى هاى ولا باى أى حاجةوخلاصبقه ه ه ههههههههههههههههههههههههههههههههه"
