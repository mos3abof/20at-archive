[[comments]]
order = 16
subject = "الشباب إيد واحدة"
author = "رعد"
posted = "2006-05-02"
text = "إيه يا شباب ما تخفو على تامر و هيثم ,انتو بتتكلمو عنهم كأنكم البوليس الحربي مش كأنكم شباب و فاهمين الدنيا ماشية إزاي, كلنا فدا مصر و اي بلد عربي وقت الشدة, لكن الخدمة العسكرية الشكلية دي و اللي انتو عارفين كويس انها بتتقضى هبل في هبل , فكل اللي بيحصل شوية تمارين عسكرية نص كم مجتش حتى زي تمارين الكشافة و الباقي نوم و انتظار للضابط عشان لما يمر و شوية ناس رذلة تعد تخنؤك عال فاضية و المليانة يعني ممكن موضوع الجيش ده يتلم في 8 أسابيع مش طالبة سنة و 2 , و كمان احنا ناسيين ان كل ولاد الكبار بيقضو الجيش في العجمي أو في مارينا فبركة يعني و بعدين أنتو الكاتب مش عاجبو ان هيثم غنى لمصر و مدخلش الجيش ,طب عل أقل هيثم غنى لمصر و من قلبه و موضوع الخدمة العسكرية كلنا بنتخنق منه ,هل معنى ده ان احنا مبنحبش بلدنا و تبؤو كذابين لو قولتو ان في حد فيكو بيروح يستلم ورديته العسكرية بإبتسامه, و موضوع الحرب غير الخدمة العسكرية , روحو ازعلو مالناس البيروقراطية اللي كرهونا في التعليم والجيش و الشرطةوالشغل و دمرو احلامنا روحو دورو عالناس اللي بتهف المال العام عيني عينك بدل ما انتو بتتشفو في ولدين محبوسين بيشوفو أيام جوه الحبس مبيعرفش طعمها إلا اللي اتحبس قبل كده, ربنا يسامحكو و لا يحبسلكو غالي و افتكرو اد ايه اغانيهم مسيرها تنسيكم هموم اليوم او تفكركم بذكرى حبيب غايب ....خلونا إيد واحدة لو ممكن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112554/http://www.20at.com/article2.php?sid=540"

