subject = "شيء محزن"
author = "مقال رائع رائع رائع حقا ان هؤلاء الشباب قدوة سيئة جدا جدا لغيرهم وهم مثال علي النفاق المنتشر في المجتمع الان ولكن السئ و المقلق في الموضوع هو دفاع الشباب وخاصا الفتيات عنهم فهل معقولة انهم يدافعوا عن اشخاص تهربوا من خدمة بلدهم ( اصل الكلام كان سهل في اغانيهم الوطنية و لكن في التنفيذ قول يافكيك )"
posted = "2006-03-07"
text = "و قد يدافع بعض الشباب قائلا ان البلد ليست في حالة حرب ولكن تأكدوا انة حتي اذا حدثت ظروف اضطرارية فمن تخلي عن بلدة في السلم لن يفكر فيها في الحرب<br />و اللة يرحم ابي و اباء كثيرون غيري ممن ممن اضاعوا الكثير من عمرهم في الدفاع عن هذة البلد و تحريرها حتي تصل لامثال هؤلاء الشباب"
