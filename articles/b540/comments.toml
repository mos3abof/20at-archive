subject = "مأساة ما بعدها مأساة"
author = "على بن حمد العيسى"
posted = "2006-03-08"
text = "بسم الله الرحمن الرحيم والسلام عليكم وأسعدالله أوقاتكم في طاعته أمل بعد أردت الافصاح عن رأيى (الجيش هو اليى هايحميكم يوم الحرب هو النصرة والكرامة والدليل بص لسيدك النبى صلي عليه الله قوى الجيش النتيجة الناس بتهابه وكمان تحترمه أما دلواقتىبص الشباب بيسخروا من بعض بقا حاجة عيب أينعم المعاملة سيئة بس برده مين اليى هايحمى البلد مش برده كده )حبااااايبى أحب أأأقول حاجة هاتعجبكوا (الجيش ده جيشنا والبلد ديه بلدنا.وحرب راحت وحرب جات وحرب جات وحرب راحت. شكل الدنيا ديه حروب واليى غيظنىان الشعوب فكرة ان ما ليها فى الحروب . بس ده برده مش غريب لما نلاقى الدنياجروب مال العربى مش معروووب وكمان دايما محجوب قوم يا عربى قوم ده انت سلاحك القدوم وأأأوعى تحس انك محروم في أي ساعة من القدوم .قومى قومى يا بلاد أصل العربى ما لي هاد الا رب العباد ) أما الشباب الفافي يروح يخلى نفسه راجل ويبقى يتكلم فاهمييييييييييييييييييييين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112554/http://www.20at.com/article2.php?sid=540"

