subject = "و إشمعنى أنا"
author = "أنا تامر حسنى"
posted = "2006-03-08"
text = "يا جماعه أرجوكم أنا بكتبلكم الايميل ده من طره و فعلا بكيت لما قريت كلامكم عنى ... يا جماعه و إشمعنى أنا ... يعنى شفتم مره إبن وزير و لا إبن مسئول كبير دخل الجيش ... الجيش ده للحثالة و عامة الشعب بس ... أنا شخصيا أعرف إبن مسئول كبير أحييت له حفلة خطوبته و إتصاحبت عليه و بعدها قالى أنه كان شغال فى شركة بترول طول فترة التجنيد بمرتب 2500 دولار و المخله بتاعة هدوم الجيش كانت تحت السرير عنده فى البيت و حتى ما عرفش إمتى رجعوهاله الجيش يعنى دخل من الجيش و خرج منه على سهوه و هوه مش حاسس ... يبقى ليه بتلومونى ... أسف بتلومونى دى بتاعة الزميل عمرو دياب اللى بأشك أنه ورا الخابور اللى انا فيه ده عموما حبيت أبين وجهة نظرى و ربنا يفك عننا جميعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112554/http://www.20at.com/article2.php?sid=540"

