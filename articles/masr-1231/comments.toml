text = "بيتهيالي يا اخت بسمة سياسة الاعتقالات والتعذيب اللى فى السجون ,, وقانون الطوارئ اللى ساري فى مصر ميخليش اى حد لا يقدم خطاب ولا كلمة ولامؤتمر ولا لقاء ,,, مستنية ايه من الاخوان لوحدهم ,, عنى البلد انتى قسمتيها اخوان وحزب وطنى ,,, اذا مكنش كل الطوائف تقف امام فساد الحزب الوطنى ,,, ولا لازم دايما الاخوان هم اللى فى المقدمة هم اللى مليين المعتقلات والسجون ,,,, \"<br />\" لا يغير الله ما بقوم حتى يغيروا ما بانفسهم\"<br />مستنى تعليقك ياابن بهية .<br />فى مثل مصري بيقول\" اخوان لوحدها متسقفش \" ايوه \"ايد لوحدها متسقفش \" ,,,,<br />ارحموا الاخوان !!!!!"
