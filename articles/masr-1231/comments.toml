text = "القرن القادم هو قرن الله لان الناس فى اخر 100سنه جربوا كل حاجه من شيوعيه وقوميه والحاد وعلمانيه..لذلك الاسلام قادم لاشك فى هذا ...االاسلام الوسطى المتسامح الذى يقبل الحوار مع الاخر ..الذى يقبل المواطنه والحريه....الاسلام قادم بقوه والاخوان قادمون...الله اكبر ولله الحمد"
