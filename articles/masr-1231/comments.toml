subject = "الشعب صاحى نام اتى؟"
author = "مصرى حتى النخاع"
posted = "2006-12-01"
text = "ياراجل داخل تفوق الشعب وانتا بتكذب ؟<br />مين قال لك ان جمال مبارك مدمن ؟<br />مين قالك ان سوزان مبارك يهودية ؟<br />هوا الاسلام علمنا اننا لما نختلف مع شخص نطلع علية اشاعات بدون وثائق<br />ياكذاب مصيرك لربك<br />اما الاخوان فمين قالك ان الشعب مؤيد لهم انتا بتتكلم عن مصر ولا لبنان اذا لبنان عجباك قوى روح هناك وشجع نصر اللة الشيعى او زور ايران بالمرة<br />الشعب المصرى قادر يخلص نفسة من غير اخوان ولا يحزنون"
