[[comments]]
order = 3
subject = "كلمتين فيهم الشفا .."
author = "إبن بهية"
posted = "2006-11-30"
text = "شوفوا .. بصراحه كده وبكل وضوح .. زي ما بتقول أنغام .. أنا باسمع أغاني أهو يعني مش إخواني .. وكمان عاشق لناصر العروبه يعني عرونبي ناصري .. يعني بتحرقني حتة الكرامه أوي ... شوفوا بقى .. لو وقف أي ذيل من ذيول عصابات مبارك الواطي على ذيله لن يغير رأينا فيهم بأنهم أكثر فساداً مما قال الدكتور المحترم يخيى الجمل .. لأنهم لصوص .. حراميه .. والأكثر من ذلك أنهم عملاء لأمريكا وإسرائيل في المنطقه ... ومن ناحية البرنامج السياسي اللي دوشونا بيه وأن الإخوان ليس لهم برنامج سياسي واضح ... واضح أوي إنهم بيقلدوا كلام العبايط بتوع الحزن الوطني لأن للإخوان برنامج واضح ومعلن وممكن أي نفر يشوفه على موقعهم على النت .. طيب ممكن نشوف برمج العالم التانيه اللي مسحجها نظام مبارك الواطي (أقصد بقية الأحزاب) التي تحولت إلى دكاكين ومجرد صحيفه صفرا بتجيب قرشين للقائمين عليها وخلاص .. يعني أكل عيش ... عرفتوا ليه الناس من كل التيارات وأنا أولهم رحنا مع الإخوان حتى لو ناصريين .. لأننا وجدنا عندهم تنظيم وترتيب وإداره وبرنامج .. والأهم أننا وجدناهم رافضين للنظام العمباركي العميل وزعمائهم يملأون المعتقلات القذره بتاعة مبارك الواطي .. لو بصيت للأحزاب التانيه تلاقيها إما مواليه في الباطن للحكومه أو مسترزقه من ورا شوية الهمبكه بتاعتها دي من غير فعل حقيقي واعي وواضح ... يعني الحكايه برضه أكل عيش إلا الإخوان اللي بيصرفوا من قروشهم القليله التي يجمعونها من بعضهم .. الإخوان معظمهم أساتذه في الجامعات وأناس محترمه وعقول متفتحه لم نراها في غيرهم واللي عايز دليل زيي زمان ما كنت بادور على دليل يحاول يقرب مهم ويفهم الإخوان بجد وبنية صافيه وقلب مفتوح مش يمشي ورا كلام علي الدين هرار ده زمار الحزن الوطني المعروف أبو عشر أصفار .. ط<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073329/http://masr.20at.com:80/article.php?sid=1231"

