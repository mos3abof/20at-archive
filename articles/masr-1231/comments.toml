[[comments]]
order = 9
subject = "أما آن لنا أن نعيش مثل غيرنا"
author = "Drsalah_hanie"
posted = "2006-12-01"
text = "أولا أشكر كاتب المقال \"أبو حميد\" وأتوجه بالشكر الخاص والحب لأخويه\"ابن بهيه\".<br />وأقول إن الاخوان _ورغم شعبيتهم الكبيره وقوتهم التى يستمدونها من الشعب_من أبناء مصرنا الغاليه إلا إنهم لايستطيعون بمفردهم مواجهة نظام مستبد مثل النظام المصرى الذى تقدر أعداد \"أمن الدولة فيه\" بحوالى 500,000<br />لذا فحتى يحدث تغيير يجب أن يتحد الشعب كله فى مواجهة الفساد والظلم .<br />لماذا أصبح الشعب المصرى سلبى لهذه الدرجة وهو من أعظم الشعوب. يبدو أن مصر مستهدفه منذ زمن طويل بمخططات جعلت المصريين على مدى 50 عاما راضين بالفساد بكل أشكاله, راضين بحياة الذل والاهانه.<br />أنا عندما أركب الاتوبيس كل يوم للذهاب إلى الكليه وأرى المهانه التى يتعرض لها إخوانى من البهدله حتى نصل الى أماكن عملنا أقول فى نفسى:<br />هل يستحق الشعب المصرى الأبى الطيب كل هذه المهانه!!<br />هل تستحق مصر_التى أوصى النبى صلى الله عليه وسلم بها وبأهلها_كل هذا الظلم والاستبداد؟!<br />ثانيا: أقول إن إلقاء التهم وتشويه صورة الاخر سهل ولكن إثبات ذلك صعب خاصة إن كان من يشوه صورتك هى الدولة بما تملكه من قوة ومن صحافة وتليفزيون وغيرها من وسائل الاعلام المختلفه لذا فأنا أعذر من يتهم الاخوان المسلمين ,لأنهم لايملكون من الادوات التى يستطيعون بها توضيح أهدافهم أو الدفاع عن أنفسهم فى الوقت الذى يمتلك فيه النظام كل أنواع القوة والتأثير والذى يوجهها إلى ألد أعدائه وهم الاخوان المسلمون فالرئيس مبارك من الممكن أن يجلس مع الجميع -حتى مع إيهود أولمرت- ولكنه لايطيق أن يتحاور أو يتفاهم مع الاخوان.<br />وأنا على فكره لست من الاخوان ولكنى عاملتهم وأحسبهم على خير وعندما أجلس مع أحدهم أعلم فعلا أنه مهموم بما يحدث للبلد من ظلم وقهر.<br />لذا أتمنى أن نكون إيجابيين حتى نعيش فى خير وحريه<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073329/http://masr.20at.com:80/article.php?sid=1231"

