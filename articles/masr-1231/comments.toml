text = "ياريت تقرا تعليق ابن بهية وراية فى الاخوان واللى انا بضم صوتى لصوته وصوت اى انسان شريف يجد فى الاخوان الترتيب والنظام والاحترام ,,, مش البلطجةوقله الادب ....<br />عزيزى سواح ياريت تقرا تعليقه كويس ,, ويالى بتتكلم على البرامج هو وضحلك نقاط معينة ,,, وانت لو قرات تعليقى كويس هتلاقينى اتكلمت على تكافؤ الفرص بين الاخوان وبين الحزب الوطنى ,,,<br />الحزب الواطى الحاكم له كل الصلاحياااااااات والنفوذ ,, دعايات ومؤتمرات وبرامج تبث فى التلفاز ,,,,, وانظر ال الاخوان انظر الى الوسائل المتاحه لهم ؟؟؟؟؟؟؟؟؟<br />فكرا وادينى رايك"
archived = "2006-12-05"
