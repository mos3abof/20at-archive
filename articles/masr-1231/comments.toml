subject = "العبوا مع بعض من غير خناق"
author = "بسمة"
posted = "2006-11-30"
text = "ممكن اعرف مين في مصر عنده خطاب0 بقي لي سننتين متابعة اللي بيحصل مش شايفة اي خطاب الاخوان شعارهم الاسلام هو الحل ماشي وبعدين طول الوقت في وسائل الاعلام كلام هو هو اللي بيقولولة اجدادنا رؤساء الاحزاب الدايت كلام عن الديمقراطية تداول السلطة حرية الراي و طول الوقت رغي ان الحزن الوطني فاسد ومزور وبلطجي ونهبوا مصر و التعذيب وكل الحاجات معروفة للقاصي والداني ما هي الاضافة وبعدين من غير نتظير ده اي حد معمي علي مصر يومين كفاية يبص في وشوش الناس وهو يعرف الكارثة اللي احنا عايشنها من عقود ايه هو برنامج الاخوان بالتحديد من غير ما يشتغلونا وحكاية محدود الدخل اللي الحزب هارانا بيه انا لللاسف اري ان الاخوان نسخة مكررة من الحزب الوطني بس في شكل ديني دول لسه في خطاب الرئيس الاخير ظهروا علي حقيقتهم عاصفة من التصفيق الحاد واعد والنبي يا ريس لغاية اخر نفس يعني موافقين علي ان الرئيس يقعد الي ما شاء الله قال ايه الحمدالله كده بقي الوريث ما جاش وقته بالذمه ده منطق احنا شعب مضحوك عليه الاثنين زي بعض عايزين السلطة وبس ويولع الشعب دول حتي ما بيظهروش اللي في اللي يخصهم يعملوا مظهرات و هات يا فضائيات وتحليلات في الجرايد ولكن لما حاجة ما فهاش مصلحة ليهم تبقي معارضة حنينه وبالها طويل و بعدين انتخبات ايه يا عالم اذا كان اللي شاركوا 20 في المية من المقيدين في جداول الانتخبات والباقي بتفرج علي المشهد احنا مش ناقصين كفاية الهم اللي احنا فيه"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073329/http://masr.20at.com:80/article.php?sid=1231"

