[[comments]]
order = 11
subject = "الي الاخ سواح"
author = "شيماء"
posted = "2006-12-01"
text = "السلام عليكم و رحمة الله و بركاتة<br />الي الاخ الفاضل / سواح<br />بعد ردودك في موضوع صاحب الفضيلة و الموضوع دة شايفة ان مازال رفضك للاخوان قائم بقوة. في الواقع انا مقدرش الومك علي دة كل واحد له حرية تأييد من يريد و رفض من يريد و صدقني بعد الي حصل في فلسطين بعد انتخاب حماس خلاني افقد الثقة في اي حد يصل للسلطة, و صدقني بردة مقدرش اقول ان البلد حتكون افضل لو مسك الاخوان الحكم لكن رغم كل دة الاخوان افضل الموجودين و انت قولتلي في تعليق سابق انك رافض فكرة افضل الموجودين طيب قول فكرة تانية , نعمل ايه مع شعب صامت مش قادر ياخد موقف. انا قولتلك في الموضوع السابق ان مصر بتمر بمرحلة عدم نضج سياسي و بالتالي فكل الاحزاب عندها مشاكل او لنقل معيبة. هل في الحاله دي اروح اختار حزب من برة و انتمي اليه .<br />يا استاذي الفاضل هي مش ملابس لو معجبنيش في مصر اشتري من برة. دي احزاب سياسية مينفعش نستوردها. بالتالي احنا مقيدين بالموجود حاليا و الاخوان افضل الموجودين.<br />ثم اني ضد اهدار طاقتنا في اننا نحارب بعض انا رأيي ان في عدو اساسي و اول هو الاولي بطاقتنا و جهودنا و هو النظام الحاكم و حزبة و بعد منخلص منهم و يستلم اخر زمام الامور ايا كان اخوان و لا غيره نختبر سياستة خلال سنة او سنتين مطلعش كويس نغيره بس يا خوفي ليجي علينا وقت و نعمل زي اندية مصر كل سنة يجيبو مدرب جديد هههه.<br />ثم ان الاخوان فعلا فيهم كتير كويسين زي دكتور محمد جمال حشمت بتاع دمنهور . مش قادرة اقولك صدمة اهل دمنهور لما اعلنوا فوز مصطفي الفقي. و للاسف مصطفي الفقي من اكبر مثقفي مصر يعني لما امثاله يتحالفو مع الوطني يبقي قول علي بلدنا يا رحمن يا رحيم.<br />ثم اني شايفة مرشح الاخوان عن دائرتي هو اكثر الناس مساعدة للشعب و شايف طلباتهم.<br />احنا ندعي الاول ان<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073329/http://masr.20at.com:80/article.php?sid=1231"

