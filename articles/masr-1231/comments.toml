subject = "منك للة ياريس"
author = "جمال عبد الناصر"
posted = "2006-11-30"
text = "منك للة ياريس بس فى الاخر انك عندك حق مش عارف تعمل اية علشان الناس مش راضية تسمع انت واللة ريس عندك حق فى كل ال بتعملة انك خايف عليهم وهما مش عرفين حاجة وانا معاك بس انك واخد شوية من الاخوان هما ممكن يكونو على حق فى كل البيعملوة انت خسرت حاجة انك مسمعتش كلام الشعراوى عندما قلك بلاش انتة تمسك الدولة بس انت تقدر تستحمل وبلاش الناس تاكل انت مش مبصوت انت ممكن تكون فى قلوبهم ممكن تفتح مصنع وتسمية مصنع العوطلية علشان يحبوك وكل عامل يقبض مرتب كويس وكمان حوافظ انت معاية ممكن انت حبيبى واللة العظيم انتى على حق سلملى على الحرامى التانى مستغربش هو ابنك جمال وكلة ولعة بس الشعب عارف كل حاجة هو ساكت بس القلوب بتتكلم جوة الحق نفسك قبل جمال مايسمك هو مش ابنك لكن ممكن يعملها حرص منة ممكن ققلك حاجة لا الة الااللة محمد رسول اللة"
