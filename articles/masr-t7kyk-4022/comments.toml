[[comments]]
order = 49
subject = "رفع الحصانة عن النائب طلعت السادات بتهمة إهانة القوات المسلحة ا"
author = "كوكو الضعيف"
posted = "2006-10-06"
text = "ههههههههه دة اقل واجب يا عم الشريف دة لسة هتشوف حجات عجيبة ممكن تطلع ليك شهادة انك مجنون وهربان من المستشفى وممكن تكون هربان من الجيش او مزور اصوات الناخبين او انك ميت اصلا مش موجود هههههههه يا عم طلعت انت والنبى مجنون اية اللى خلاك تتكلم بس وتتكلم عن الفساد واحمد عز وجمال مبارك واغتيال السادات انت مش عارف ان اللى بيتكلم فى البلد دى مجنون ونغير حصانة ومزور وجاسوس وشاذ يا عم طلعت ربنا يديك الصحة فى السجن جمب حبيبك ايمن نور وياريت انت كمان متدخلش المستشفى او مقدما اللة يرحمك يا واحد من الناس الكويسة مع السلامة ( ويذكر أن النائب طلعت السادات أبن شقيق الرئيس الراحل أنور السادات كان قد زعم في أحاديث تليفزيونية‏,‏ أخيرا‏,‏ أن الرئيس الراحل أنور السادات أغتيل في حادث المنصة منذ‏25‏ عاما نتيجة مؤامرة شارك فيها حرسه الخاص‏,‏ وبعض قادة القوات المسلحة‏.‏ هههههههههه وبعض قادة يعنىمش كل القوات المسلحة دة كلام الاهرام ههههه يا جماعة من غير لف ودوران انتو عايزين تتخلصو منو خلاص ارموة للغولة فى حدائق الشيطان او ارموة للغول فى مصر طبعا انتو عارفين مين الغول كلهم غول والشعب حميرررررررررررررررر لازم الغول يكلهم"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105204744/http://masr.20at.com:80/article.php?sid=404"

[[comments]]
order = 50
subject = "كوكو"
author = "كوكو"
posted = "2006-10-08"
text = "في عيد ميلادك الكام وسبعين<br />كل سنة وانت طيب<br />واحنا مش طيبين<br />كل سنة وانت حاكم<br />واحنا محكومين<br />واحنا مظلومين<br />واحنا متهانيين<br />وياتري يا حبيب الملايين<br />فاكرنا وللا احنا خلاص منسيين<br />فاكر المعتقلين<br />فاكر الجعانين<br />فاكر المشردين<br />فاكر اللي ماتو محروقين<br />فاكر الغرقانين<br />الله يكون في عونك - ها تفتكر مين وللا مين<br />في عيد ميلادك الكام وسبعين<br />بقول لك كلمتين<br />الأولى<br />شيلتنا طين<br />الجو أصبح بيئة والعيشة ولعة<br />و الشرفاء قلوبهم عالبلد والعة<br />و انت عاملهم مذبحة ولا بتاعة القلعة<br />و الإقتصاد سداح<br />و السرقة بقت كفاح<br />و مصر متاحة بس للسياح<br />و عرض البلد بقي مستباح<br />و الثانية<br />وريتنا الويل<br />دا الخطوة في عهدك بقت ميل<br />و الضحك بقي نواح و عويل<br />و الكوسة<br />عارفالكوسة<br />ممكنأقول لك فيها مواويل<br />و الجامعة بقت يا إما كباريه أو دار مسنين<br />و الشباب معظمهم من غير خمرة سكرانين<br />و العلم عز علي المتعلمين<br />و الأساتذة بقوا دجالين<br />و القادة بقوا طبالين<br />و اديني في الهايف يا حبيب الملايين<br />و الثالثة<br />عارف اليابانيين<br />زمان في سنة اتنين و خمسين<br />كان عندنا تروماي و كان عندنا علم و متعلمين<br />و ثقافة و مثقفين<br />و أدباء و علماء و فنانين<br />و كانوا اليابانيين<br />بالنووي لسه مضروبين<br />و للصدقة مستحقين<br />دلوقتي إحنا فين و هما فين<br />هما فوق و احنا في أسفل سافلين<br />و الرابعة<br />أمن بلدنا بقي تنين<br />و المحاكم اتملت مظالم<br />و العدالة بقت كمالة<br />و كلمة الحق في الزبالة<br />و أصحابها في الزنازين<br />و الخامسة<br />القطاع العام....عام<br />و الفساد.....ساد<br />وفي جتة بلدنا بيرعي<br />أفتكر لجنابك إيه و للا إيه<br />و كل ذكري ليك بدمعة<br />آآآآآآآآه آآآآآآآآه<br />أنا كنت حالف ميت يمين<br />أكملهم لك تمنية و سبعين<br />اقرأ بقية التعليق .."
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105204744/http://masr.20at.com:80/article.php?sid=404"

