[[comments]]
order = 67
subject = "الفساد فى طنطا"
author = "السيد البدوى"
posted = "2006-12-06"
text = "الفساد عندنافى طنطا بقى للركب ضباط شرطة نسوانها بتتناك وتنلهم شرايط و cd وعادى خالص .<br />ضباط شرطة المرور بيمدو اديهم لسواقين الميكروباص علشان ياخدو منهم فردة 5 جنيه كل يوم عادى خالص.<br />ضابط شرطة يتمسك وهو بيسرق تساجيل السيارات وميحصلوش حاجة عادى خالص .<br />ضباط امن الدولة وعلى راسهم يسرى الشناط يقوا ادبهم على النسوان فى الشارع ويرفعوا عنهم الحجاب بغرض التفتيش عادى خالص .<br />دكاترة الجامعة يعينوا ولادهم معيدين وهما مبيفهموش حاجة عادى خالص .<br />دكاترة اتلجامعة بينيكوا الطالبات الشراميط داخل الحرم الجامعى عادى خالص<br />الفساد فى المحليات بقى للركب عادى خالص<br />الموظفين بيروحوا الشغل الساعة 10 صباحا ويمشوا 12 ظهرا عادى خالص<br />الموظف ياخد منك 5 جنيه على الامضاء و 10 على الختم و عشرين علشان يسهلك المسائل ميعقدهاش وكلك نظر يا غلبان عادى خالص<br />الشوارع المتكسرة والمرور الملعبك والعيشة الخرة عادى خالص<br />مفيش تعيين وكمان بيعطلونا لما نيجى نعمل مشاريع صغيرة ويطلعوا عنينابهدلة ورشاوى ومشاوير علشان حتة ورقة وسخة اسمها الرخصة عادى خالص<br />ولما تيجى تركب عداد الكهربايفشخوا الى جابوك طلبات وطلوع فوق ونزول تحت وفى الاخر العداد ميركبش الا بعد 15 يوم علشان الموظف طيزو بتاكله ومهوش فاضى عادى خالص<br />كس امك يا مبارك وكس ام المصريين اللى سايبينك لحد دلوقتى تنيك فينا وتبعبص فى اللى خلفونا .<br />_______________________________________<br />اللهم خذه اخذ عزيز مقتدر<br />اللهم انه طغى علينا فانتصر<br />اللهم انا وكلناك عليه فكن لنا عونا وسندا فى فى هذا الغم والهم يا رب العلمين .<br />اللهم امته محروقا او مشنوقا او غريقا اللهم عذبه فى نارك دنيا واخرة<br />_______________________________________<br />السيد البدوى"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041849/http://masr.20at.com:80/article.php?sid=404&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
