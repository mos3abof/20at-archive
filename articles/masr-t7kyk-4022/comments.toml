[[comments]]
order = 52
subject = "العرب جرب"
author = "كوكو الضعيف"
posted = "2006-10-10"
text = "نكتة سياسية<br />الرئيس الأمريكي جورج بوش عازم رئيس الوزراء البريطاني توني بلير على<br />العشاء<br />وبعد العشاء إجتمعوا بالصحفيين ...<br />أحد الصحفيين يسأل :<br />على ماذا إنتهت محادثتكم ياسيادة الرئيس ، وعلى ماذا إتفقتما ؟<br />الرئيس الأمريكي يجيب :<br />إتفقنا على قتل 14 مليون مسلم وطبيب أسنان واحد \" !!!<br />الصحفيين يتسابقون ويتدافعون على السؤال الذي يليه :<br />ولماذا طبيب الأسنان بالذات ؟؟؟<br />الرئيس الأمريكي يضحك ويهمس بأذن توني بلير قائلاً<br />ما قلت لك أنه محد بيهتم بالـ 14 مليون مسلم"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105204744/http://masr.20at.com:80/article.php?sid=404"

[[comments]]
order = 53
subject = "في آخر النفق نور يا بهيه"
author = "أنس علي"
posted = "2006-10-13"
text = "أولا أنامسمعتش عن المدونين إلا من خلال الجزيره وبرنامج تحت المجهر وعرفت من ساعتها إن الشباب المصري لسه بخير وأناكواحدمنكم ياولادمصر أتمنى تقبلوني كعضو فعال معاكو واتمنى من ادارة الموقع تراسلني وتبلغني ازايأقدر أكون واحدمنهم بجد لأني خلاص اتخنقت منه هووابنه...........سلام للجدعان"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105204744/http://masr.20at.com:80/article.php?sid=404"

