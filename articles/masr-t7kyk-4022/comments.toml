subject = "يافرحتنا بيكم"
author = "محمد الجمل"
posted = "2006-05-31"
text = "لم أعلم بالمدونين الا قبل يوم واحد من حلقة الجزيرة. أتعرفت على الموقع(ولاد البلد)من تحقيق في جرنال\"المصري اليوم\"الرائع. لم أتمالك نفسى من فرط التأثر والحماس من فرط بسالة التعبير وبساطته وتلقائيتة.<br />ماهى فكرة المدونون؟ ومتى بدأتم؟ وكيفية التواصل معكم؟ وايه اللى ممكن نعمله علشان ندعمكم؟<br />أنتم بتقولوا اللي نفسنا نقوله. بس عايزين نعمل حاجه لها معنى معاكم.<br />كتابتكم رائعة.. والموقع رائع.."
