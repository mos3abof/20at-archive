[[comments]]
order = 29
subject = "هى دى الحقيقة وانبى اقروها"
author = "كوكو الضعيف"
posted = "2006-06-29"
text = "إلتفت الأسرة حول فراش الزعيم وهو يلفظ أنفاسه الأخيرة .... قال الزعيم بصوت ضعيف<br />ولكنه حازم فى نفس الوقت<br />حسنى: كلكم موجودين<br />سوزان: أيوه ياحسنى ... أنا جنبك أهه ... وأدى جمال وعلاء ... قمرين دول ولا<br />عينين<br />حسنى: طب إسمعوا اللى حقوله كويس<br />جمال: سامعينك يابابا ... إتكلم<br />حسنى: مصر دى كنز ياولاد ... إمكسوا فيها بإيديكم وسنانكم ... بنسرق فيها بقالنا<br />سنين وسنين ولسه بتدينا<br />علاء: هيا دى البركة اللى بيقولوا عليها يابابا<br />حسنى: أيوه يابنى .... ربنا يبارك لكم ولعيالكم فيها ... ودلوقتى إسمعونى<br />علاء: إنته على الهوى يابابا ... إتكلم<br />حسنى: أنا مش مديون لحد ياولاد ... يعنى أى واحد يصيع عليكم ويقول لكم أبوكم كان<br />مستلف منى فلوس تفوا فى وشه على طول<br />علاء: إطمن يابابا ... حرامى على حرامى ما يلعبش<br />حسنى: أنا سيبت لكم ياولاد اللى يكفيكم إنتوا وعيالكم وعيال عيالكم ويفيض ...<br />فلوس متلتلة متتعدش .... مش حقول لكم حافظوا عليها وبس ... لآلآلآلآ ... زودوها<br />كمان وكمان لجل ما روحى ترتاح وأنا فى تربتى<br />جمال: هيا الفلوس اللى إنته عملتها يابابا دى بتسميها فلوس .... شفنى أنا وعلاء<br />حنعمل إيه .... ولا صحيح حتشوفنا إزاى .... عموماً ما تقلقش<br />حسنى: ودلوقتى إسمعوا وصيتى ....... الحكم لأولاد مبارك ... لازم أول ما جمال يحلف<br />اليمين تغيروا إسم مصر وترجعوه زى ما كان زمان أيام الملك فاروق والملكة نازلى<br />(المملكة المصرية)<br />جمال: مفهوم يابابا ... خش فى اللى بعده<br />حسنى: الجيش والشرطة والأزهر ... أوعوا واحد من التلاته دول يخرج عن طوعكم أبداً<br />علاء: مفهوم برده ... اللى بعد<br />اقرأ بقية التعليق .."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720130644/http://masr.20at.com:80/article.php?sid=404"

[[comments]]
order = 30
subject = "حرية التعبير.......ماذا بعد..؟"
author = "احمد فتحى"
posted = "2006-09-01"
text = "إنه لجهد محمود ماتقوم به المدونات والصحف الحزبيه والمستقله من رصد للأحداث وكشف للحقائق ومطاردة وفضح للفساد والمفسدين ونقد لآداء الرئيس والحكومه ولكن يبقى السؤال :وماذا بعد؟ لقد استنزفنا من الزمن مايزيد على 25 عاما ونحن على هذا المنوال دون أن نتقدم خطوه واحده للأمام ، هل رضينا وقنعنا بإحدى ثمار الديمقراطيه التى قطفوها لنا من شجره مزروعه فى غير ارضنا وأوهمونا بأن هذه هى الديمقراطيه؟ لنزرع نحن الشجره بأيدينا لتكن كل ثمارها لنا وكفانا لهوا بتلك الثمره التى تدعى حرية النعبير ولتكن افعالنا سابقه لأقوالنا ، وإذا عبرنا فلنعبر عما نريد أن نفعل لا عما نريد أن يكون ولتكن اولى افعالنا الاتفاق على اتخاذ خطوه فاعله تنقلنا الى المربع التالى لغرس تلك الشجرة بأيدينا نحن ، الامر ليس بالمستحيل ولتكن لنا فى تجربة شعب جورجيامثال وأمل عندما اعتصم الشباب حول البرلمان لما يزيد على الاسبوع حتى أسقط الرئيس ادوارد شفرنادزه ونظامه.<br />وتاريخ مصر السياسى يخبرنا بأن أنظمتها الحاكمه لم تتغير مطلقابطرق سلميه وانما بطرق انقلابيه وغالبا دمويه واحيانا قدريه ولسان حال النظام يقول انه لا امل فى صلاح او اصلاح وانما التكريس للتوريث بالفساد والافساد لذر الرماد فى عيون القوى المحتمل مناوئتها وربط مصيرها بمصير النظام ووريثه وقد تم بناء القاعده البشريه بالمواصفات المطلوبه لهذا الغرض ولم يتبقى إلا القاعده الدستوريه والقانونيه التى جلبوا لها اختصاصى المحكمه الدستوريه للقيام بتلك المهمه، لذلك لم يعد امامنا الكثير من الوقت لنضيعه فى طرح ونقد وتنظير ، فلنفعل كما فعل الجورجيون ما سمى بثورة الورود، وليتجمع الشباب فى التحرير والشوارع الجانبيه المحيطه بمجلس الشعب بالآلاف دون هتاف رافعين لافتات السقوط للنظام ويظلوا على حالهم هذا<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182522/http://masr.20at.com:80/article.php?sid=404"

[[comments]]
order = 31
subject = "البتاع"
author = "احمد الشاطبى"
posted = "2006-09-04"
text = "(مقتبس من الشاعر احمد فؤاد نجم )<br />يالى فتحت البتاع<br />فتحك على مقفول<br />لان اصل البتاع واصل على موصول<br />فاى شىء فى البتاع الناس تشوف على طول و الناس تموت فى البتاع فيبقى ليه نقفلوه و ازاى حتفتح بتاع فى وسط ناس بتقول بان هذا البتاع جاب الخراب بالطول<br />لان حتة بتاع<br />جاهل غبى مخبول<br />امر بفتح البتاع<br />لان كان مسطول<br />و بعد فتح البتاع<br />جابو الهوى المنقول<br />نكش عشوش البتاع<br />وهد كل قصول<br />و فات فى غيط البتاع<br />قام سمم المحصول<br />و خلى لون البتاع<br />اصفر حزين مهزول<br />ادى الى جابوه البتاع<br />جاب الخراب مشمول<br />لان حتة بتاع<br />مخلب لراس الغول<br />باع البتاع بالبتاع<br />و عشان يعيش علطول<br />عين حرس للبتاع<br />و برده مات مقتول<br />و ناس تعيش بالبتاع<br />و ناس تموت بالفول<br />وناس تنام على البتاع<br />وناس تنام كشكول<br />(ابحث عن البتاع . . . . ولسه البتاع موجود ربنا يخلصنا منه على خير)"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182522/http://masr.20at.com:80/article.php?sid=404"

