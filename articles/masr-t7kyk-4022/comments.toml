[[comments]]
order = 4
subject = "انا فخورة جدا بالبلوجرز"
author = "ده السد العالمي مش هزار"
posted = "2006-05-29"
text = "انا أول مرة أتعرف علي البلوجرز كان من خلال الوثائقي لقناة الجزيرة الصراحة فرحت جــــــــــــــــــدا ان في شباب كده وخاصة في مجال السياسة<br />لان كنت متصورة ان الشباب يا اما انقسم قسمين قسم ماشي مع عمرو خالد والمشاريع تبعه ومشغول بيها وقسم ضايع تماما وكنت بقول هو مفيش شباب يهتم بالواقع اللي بنعيشه الوثائقي بث في الأامل جدا بجد بشكل غير عادي لاني مهتمة جدا بالسياسة والقضايا والبرامج التحليلة ومن اكتر من مصدر ومعرفش حد الصراحة مهتم بيها او اللي بيحصل دلوقتي مهتم بيه فأنا نفسي أشراك البلوجرز اهتماماتي وادون زيهم واعبر علي اللي جوايا بدل ما اقعد واقول انا مخنوقة انا نفسيتي تعبانه وعلي فكرة انا مهتمة بمجالات الحياة معظمها السياسة والدين والثقافة والعلم والحياة الغجتماعية وبالمشاريع أيضا .. لكن التعبير والكلام قليل جدا لما بلاقي حد يناقشيني في السياسة او يناقشي اصلهم بيخافوا قوي ولما بس اقول حاجه يقولوا لي شكلهم هيقبضوا عليك عشان عبرت بس عن راي في موضوع ما ...... زي ما قلت لكم بقيت اصحابي في ناس منهم اصلا مهتم بعالم الأاشياء فقط اللي هو اللبس والعربيات ووو<br />وهناك من مهتم بالزواج ومتي سيتجوز وعالم الماديات<br />وهناك من مهتم بالدين فقط<br />وهناك من يهتم بالمشاريع فقط والنهضة القليل القليل من وجدتهم يهتموا بالسياسة .....<br />كانت مجرد فضفضة ......<br />فين أقرأ للبلوجرز"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025513/http://masr.20at.com:80/article.php?sid=404"

[[comments]]
