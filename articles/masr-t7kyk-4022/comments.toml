subject = "السلطه الخامسه ..."
author = "هوووووووووووبه"
posted = "2006-05-29"
text = "كويس اني اول واحده اعلق ايه دا الظاهر اني بهيه فعلا واخدالي بالك يااللي في بالي,وعلي فكره بقي ولاد البلد اكبر \" مجمع للتدوين \". بس الحلقه كانت لزيزه<br />دا تاني برنامج تطلعوا فيه بعد\" سهرايه\" ولون كنت متوقعه اشفكو في \"خلف الاسوار\" بس مش مشكله متعوضه.<br />الحته النكته بتاعت الست اللي كانت عامله تدعي لحسني \" يارب يخليك لينا يارب دا انت حبيبنا انت راجل سكره والسلام عليكم ورحمه الله وبركاته \"<br />لو لحظتوه الرجل الاجنبي قال \" بلج \" يلا اتعلموها بقي دي هيدي يلا باي ."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025513/http://masr.20at.com:80/article.php?sid=404"

