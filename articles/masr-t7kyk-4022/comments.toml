text = "تحيه وتقدر وشكر الي الكاتب الساخر كوكو انا استمتعت حقا بما كتبته واستمر في الكتابه وعليك ان تعرف يا صديقي ان ما تكتبه هو نوع من انواع الفن وانواع الفن متنوعه وكثيره انا اتنبأ لك بمستقبل باهر وانصحك بقراء الشعر العامي وعندك كثير من الشعراء مثل صلاح جاهين و احمد نجم وغيرهم و اتمني لك التوفيق والنجاح واري شئ جيد لك قريبا ولك حريه الاختيار فهناك شخصيات تشجع علي الكتابه في المجتمع الدولي ايضا وشكرا"
