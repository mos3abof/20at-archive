[[comments]]
order = 56
subject = "بعلو الصوت لكل المصرين"
author = "كوكو الضعيف"
posted = "2006-11-03"
text = "بعلو الصوت هنتكلم ان شاء اللة نموت هنتكلم الحظة دى واجبة علينا وفرض مين يرضى يفرط يوم فى العرض وان شاء اللة نموت هنتكلم وعشان منبصش يوم فى الارض ولا نسلم هنتكلم بيحتلونا وبيذلونا وبيحويجونا ويجوعونا ويشبعونا استنساخونا ومسخونا وعولمونا ومن اصولنا بيجزورونا تعبونا غيبونا كتعمونا عزبونا اغزونا فقسونا لخبطونا وتاريخناشطبونا دينونا وجنينونا وعويدونا على المعونا وهتفنا فى الجهاد لا الة الا الله والنهاردة احتجنا لله يا محسنين لله لو كنا فى بعض ما بنحسش تتمس الارض متتمسش مش فارقة كتيررر دى لعبة قديمة ومفهومة خلونا كدة فسابع نومة وتصبحو على خير وهتفنا فى الجهاد لا الة الا الله والنهاردة احتجنا لله يا محسنين لله ؟؟؟"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105204744/http://masr.20at.com:80/article.php?sid=404"

