[[comments]]
order = 7
subject = "كلام 00كلام"
author = "الاستاذشيكو"
posted = "2006-05-30"
text = "انا مش عارف ليه فيه نغمه كده بين الشباب ان كل واحد لوحده هو اللي بيقرا في السياسه وده مش عيب بس اللي عيب ان يكون كل واحد حاطط في دماغه انه بيفهم في السياسه والباقي لاء0000ليه هي كمياء<br />يا جماعه كلنا وغيرنا من الشباب اللي خايف ع البلد دي يحب يسمع اصل المستقبل ماعدش فيه غير كده<br />الحمد لله مافيش شغل عدل ولا معووج<br />ولو فيه يادوب يعيش الواحد لوحده<br />والبلوجرز كلنا لازم نقف وراهم<br />وهما لازم يوجهونا علي فعل اللي يخدم القضيه بتاعتهم وبتاعتنا<br />ولازم كلنا نلتزم معاهم<br />من الاااااااخر كل واحد يعمل اللي عليه<br />مش بس نقرا وخلااااااص<br />لازم نتشارك كلنا في الاراء والافكار<br />ونحاول نفعلها كل واحد في منطقته<br />متهيالي هو ده هدف البلوجرز<br />نشر الوعي بين الشباب وفضح المسئولين اللي نايمين في العسل واللي واكلينها ولعه<br />لازم نعمل حاجه<br />بلاش الكلاموالنبي بس"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025513/http://masr.20at.com:80/article.php?sid=404"

