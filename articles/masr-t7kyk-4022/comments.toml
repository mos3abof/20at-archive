order = 11
subject = "\\\"بقرة حاحا\\\" لاحمد فؤاد نجم"
author = "bazemus79"
posted = "2006-05-30"
text = "ناح النواح والنواحة<br />على بقرة حاحا النطاحة<br />والبقرة حلوب<br />حاحا<br />تحلب قنطار<br />حاحا<br />لكن مسلوب<br />حاحا<br />من أهل الدار<br />حاحا<br />والدار بصحاب<br />حاحا<br />وحداشر باب<br />حاحا<br />غير السراديب<br />حاحا<br />وبيبان الدار<br />حاحا<br />واقفين زنهار<br />حاحا<br />وف يوم معلوم<br />حاحا<br />عملوها الروم<br />حاحا<br />زقوا الترباس<br />حاحا<br />هربوا الحراس<br />حاحا<br />دخلوا الخواجات<br />حاحا<br />شفطوا اللبنات<br />حاحا<br />والبقرة تنادى<br />حاحا<br />وتقول ياولادى<br />حاحا<br />وولاد الشوم<br />حاحا<br />رايحين فى النوم<br />حاحا<br />البقرة انقهرت<br />حاحا<br />وقعت فى البير<br />حاحا<br />سألوا النواطير<br />حاحا<br />طبت وقعت ليه<br />حاحا<br />وقعت م الخوف<br />حاحا<br />والخوف بيجى ليه<br />حاحا<br />من عدم الشوف<br />حاحا<br />وقعت م الجوع ومن الراحه<br />البقرة السمرا النطاحه<br />ناحت مواويل النواحه<br />على حاحا<br />وعلى بقرة حاحا"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025513/http://masr.20at.com:80/article.php?sid=404"

