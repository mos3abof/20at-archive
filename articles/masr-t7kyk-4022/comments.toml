[[comments]]
order = 21
subject = "ماما سوزان"
author = "رجالة لا ينقصهم غير ملابس الحريم"
posted = "2006-06-16"
text = "انا رجل من مصر او كنت رجل من مصر ااما الان انا نصف رجل والنصف الذى امتلكة ممكن ان يتغير عندما ابدل ملابسى الى ملابس الحريم والسبب ان البنت زى الولد مش كمالة عدد على راىء الاستاذة صفاء ابو السعود واللاستاذة ماما سوزان مبارك التى تحكم للنساء وتتحكم فى الرجال فهى دائما تتكلم عن المراءة والطفل والمراءة والطفل مثلما لا يوجد فى مصر الا المراءة التى تحتاج الى حقوقها ولاكن من الرجال وبصفتها زوجة مبارك فهى طبعا مثل ابنها جمال وعلاء لبد ان تضع انفها فى اى شىء داخل مصر فتفرغة الى المراءة واخذت المراءة كل حقوقها والرجل تراجع عن كل حقوقة واصبحت المرءة تتزوج وتخلع وتملك الشقة وتضرب وتحتفظ ب الاولاد وتكسب فى الكوتشينة بدل الولد الولد دة كان زمان ارجو من السيدة الفاضلة ماما سوزان ان تتكلم عن اى شىء جديد لنها بجد قديمة جدااااا زى جوزها العجوز اللى بيسبغ شعرو ويعانى على الرجالة اللى مش رجالة والستات اللى بيخدو كل حاجة عشان سوزان فى ضهرهم واحنا مين يقف جمبنا احنا الدفيعة اللى بندفع فى الشقة والشبكة والعفش والمكياج والدهب و قاعة الفرح والعربية وكل شىء واحنا برضو اللى بندفع فى الاخر ان هما بيطنططو علينا (كبرنا الحمار بقولت حا )"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620143946/http://masr.20at.com:80/article.php?sid=404"

