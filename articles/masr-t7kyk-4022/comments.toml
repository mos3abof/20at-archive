[[comments]]
order = 58
subject = "نجيب من الاخر"
author = "WASSIM"
posted = "2006-11-11"
text = "(وسارعوا الى مغفرة من ربكم)<br />نحن ننتظر الفرج والفرج لن ياتى بدون عمل الى متى سنتكلم دون عمل هنعد نكلم لغاية امتى احنا بنشتم حسنى مبارك لية<br />واحد بيسرق ومش لاقى حد يوقفلة عاوزينة يتقى اللة هو عندة حق احنا الى غلطنين<br />احنا نستاهل الحرق والخزوقة وفى معلومة هقولها للة(حسنى مبارك بيستورد جمبرى من فرنسا لعيلتة عائلة جهنم ب 7 الاف يورو فى الاسبوع الفلوس دى لو حسبناهم لسنة واحدة تقريبا تعدى مصر خط الفقر<br />وبعدين هنقعد نكلم كتير البلد مش هتصلح بالكلام دة سيدنا محمد قعد 23 سنة فى الدعوة حسنى قاعد كل دة بيعمل ايييييييييييييييييييييييييييية<br />عايز حد يرد عليا انا متابع"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041849/http://masr.20at.com:80/article.php?sid=404&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

