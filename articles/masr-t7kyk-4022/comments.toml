posted = "2006-11-15"
text = "اولا - فى حلقه امس من برنامج هو فى ايه استضاف البرنامج هذا المفيد فوزى كى يتحدث عن السبق الصحفى بلقائه بقاتل المصريين صاحب العباره السلام<br />وقد تفضل مشكورا هذاالعفن الذى اشماذ من مجرد ان اسمع اسمه<br />فقدتفضل هذا القذر وبكل وقاحه ان يصف المصريين باا لقطيع المصرين الغلابه قطيع؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ قطيع ايها السافل القذر.<br />ثانيا - انت مجرم فى لغه القانون لانك متستر عن مجرم هارب .<br />ثالثا- لا تدعى انك تعلم كل شى بل انك وقح مجرد شخص مقذذ وقذر...<br />سوال اوجه الى هذا القذر من انت حتى تصف هولاء الغلابه بهذه الصفه ايها الوقح؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2006-12-15"
