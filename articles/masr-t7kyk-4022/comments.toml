[[comments]]
order = 41
subject = "الفاتيكان عندما يصبح الجهل تزيف للحقيقة"
author = "كوكو الضعيف"
posted = "2006-09-15"
text = "حتى ماما الفياتيكان كمان بيتكلم دة لسة جاى من سنة هما عرفين ان الاسلام مفيش حد بيحمية لان الدول الاسلامية مفيهاش رجالة حكام رجالة هل من العقل ان نهين نحن الملمون المسيحيون او سيدنا عيسى علية السلام هل من المعقول ان نكون مثل اى حمار او جاهل زى الدنمارك او الفاتيكان او غيرهم عموما انتو ديما اللى بتبدتو بالغلط عشان انتو بتحبو الغلط ولازم تتشتمو وتتهزقو عشان تسكتو انما طول ما احنا سكتين وحكمنا خايفين والازهر مش قادر يتكلم لازم نستحمل كل يوم شتيمة ومهانة وعلى فكرة كل يوم او كل فترة هيكون فى جديد ويا مسلمين متصدقوش اللى بيتقال ان المسلمين بيرفضو الاهانى وان السفراء لابد ان ينسحبو من الفاتيكان كل دة كمان عش ايام هيتنسى الرسول هيتنسى والاهانة كمان زى ما نسينا اللى فاتتتتتتتتتتتتتتتتتت ولسة الجاى اكتر هقولوكوم حاجة غريبة جدا جاهل الفاتيكان بيقول ان الاسلام حضر بالسيف طيب اسمعو يا حماعة وخلو عقلوكم ه واللى يحكم<br />1 السيف الصليبى هو اللى دمر هيروشيما ونجازاكى 2سيف الصليب هو اللى دمر فيتنام وافغانستان والعراق والجاى كتير 3 الصليبين هما اصحاب الخيانة الكبرى واسئلو الحملة الصليبية وكل اعوانك خانوك يا ريتشارد 4 الصليبين هما اصحاب الضحكة الصفراء واصحاب المصالح وهما اللى بيصنعو السلاح وهما اللى بيعملو الحرب عشان يبيعو سلاحهم اللى فى المخازن 5 اكبر معمل تصنيع سموم فى العالم فى اسرائيل 6 اللى يقبل ان دينو يهان يكون انسان جبان ومحصلش كمان انسان ان ليا اصدقاء مسيحين بس يظهر ان المسلمين بيحبو ميغلطوش فى حد زيادة عن الزوم بابا الفايكان جاهل او بيعمل جاهل طبعا انا مقدرش اشتم لانى بخاف على شعور المسيحين اللى بيفرحو جدااااا والاسلام بيشتم عموما انا قولت اللى عندى والباقى على ربنا وعلى المسلمين"
archived = "2006-09-21"
capture_url = "https://web.archive.org/web/20060921110853/http://masr.20at.com:80/article.php?sid=404&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

