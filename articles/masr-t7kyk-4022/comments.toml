[[comments]]
order = 61
subject = "ينهار اسود"
author = "koko"
posted = "2006-11-15"
text = "اعتصام ٢٥٠٠ عامل بالإسكندرية احتجاجاً علي دخول المدير المسجد بالحذاء<br />كتب الإسكندرية ـ نبيل أبوشال<br />اعتصم حوالي ٢٥٠٠ عامل بشركة ليسكو الخزفية بمنطقة برج العرب صباح أمس احتجاجاً علي دخول المدير «ألماني الجنسية» مسجد الشركة بالحذاء وقيامه بركل أحد العمال المتواجدين بقدمه.<br />وأعلن العمال عن بدء إضراب مفتوح عن العمل حتي يقدم المدير الألماني اعتذاراً ويرحل، ويتم تشكيل نقابة عمالية للمطالبة بحقوقهم، لم يستجب العمال لمفاوضات المدير الإداري للشركة ومدير شؤون الأفراد، وتمسكوا بمطالبهم وأكدوا أنهم لن يغادروا الشركة حتي يتم تحقيق مطالبهم.<br />وأكد بعض العمال أن هذا العامل يدعي محمد جمعة عبدالغني وأنه تم إلقاء القبض عليه، بينما قال مصدر أمني لـ«المصري اليوم» إن العامل سيعود فور تحرير بلاغ بما حدث وإنه تم تفريق نصف العمال وجار التفاوض لاحتواء الأزمة.( برة ارضنا وبيعملو الللاهما عايزينو انما كمان ج والارض هما خلاص عارفين ان احنا ملناش دين ومفيش رجالة ولا مسلمين وطبعا فى الاخر الموظف هو اللى هيطلع غلطان عشان كان فى الجامع ودةكل وعشان هنخاف من المانيا وسفرة المانيا والعلاقات ومش خايفين من ربنا واللى يقدر يعملو فينا انا عن نفسى مقدرش اعمل حاجة غير انى عرفتكم انى معترض وعرفت الحكومة اللى هيقرو الخبر دة انكم مش رجالة عشان بتعتقلو المصريين وسيبين اللى بيدوس على دينكوم بالجزمة"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041849/http://masr.20at.com:80/article.php?sid=404&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 62
subject = "حرااااااااااام"
author = "المواطن المطحون"
posted = "2006-11-15"
text = "والله حرام عليهم وحرام علينا, حرام عليهم اللي هما بيعملوه فينا ده , الكبير بيسرق وينهب والصغير واقف جعان ومحتاس وبيتعلم الصنعه عشان لو جتله اي فرصه قدامه مايستناش زي ما اتعلم من عمو الكبير اللي كل ما يطلع في اي حديث ولا لقاء يقول بما معناه \"هجيبلكو منين يا ولاد ال......\" وحرام علينا زي ما كتير منكو قالو ان احنا ساكتين علي شويه عالم حراميه ماسكينا واحنا واقفي نتفرج , دا لو حد شاف واحد بيضرب بالجزمه من ظابط ولا امين شرطه حتي يقول الججمله الشهيره اللي الشعب المصري كله بيعشقها \"وانا مالي\".... والله كفايه بقه سبناهم يسرقوا كتيييير واحنا واقفين نتفرج لأزم نعمل حاجه اي حاجه عشان ناخد حقنا بقه.. حرام كفايه.<br />واتمني من المدونه الجميله دي انها تقبلني عضو معاكو يا رب"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041849/http://masr.20at.com:80/article.php?sid=404&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

