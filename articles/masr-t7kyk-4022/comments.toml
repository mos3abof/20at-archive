[[comments]]
order = 18
subject = "الوحيد الذى يمكنة الكلام بدون رقابة والذى يمكنى التغير السريع نام"
author = "ههههههههههههه"
posted = "2006-06-03"
text = "الوحيد الذى يمكنة الكلام بدون رقابة والذى يمكنى التغير السريع نام فى بحر الماضى ايام حسنين باشا ومحمدين بية وانا مش عارف لية الى الاستاذ محمد حسنين هيكل انت من افضل من تكلم ومن افضل من نحترم كلامة ولكن نحن الان فى عام 2006 وليس ايام الملك والخديوى لماذا لا تتكلم عن حال مصر الان ام انت خائف نحن نريد قائد لنا على الاقل فى الرىء وانت لها انسى الماضى الماضى فات وكلم معنا عن الان والمستقبل الغير مشرق تكلم معنا عن الاعتقالات تكلم معنا عن الاسعار تكلم معنا لانك معنا فى نفس البلد انا الان اتكلم مع نفسى وانا ادعو كل الناس الى ان يسمعو فرد واحد يتكلم عن ما بداخلنا انا علمة اليوم فقط بهذ ا الموقع وكلمت واذا ارتوم ان اشترك معكم فانا معكم ولاكن ماذا سيحل بوالدى الكبير فى السن انا اسف انا مش بحب مصر او بمعنى اصح الظلم اللى فى مصر فى كل مكان يا استاذ هيكل انت تتكلم فى الظلام ومن الظلام عن ماضى فارجو ان تتكلم من النور عن الظلام فى الحاضر ولك جزيل الشكر"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025513/http://masr.20at.com:80/article.php?sid=404"

[[comments]]
order = 19
subject = "هههههههههههه"
author = "وطواط"
posted = "2006-06-05"
text = "السلام عليكم ورحمة اللة وبركاتة السلام على شعب نائم ولا يريد ان يستيقظ وعلى حكومة تعلم ان الشعب لن يستيقظ حتى عندما يضرب على قفاة وهذا بسيط هذة الايام واتمنى ان يكون على القفا فقط السيد احمد عز عضو مجلس الشعب ورئيسى لجنة تقصى الحقائق داخل المجلس الموقر سيد قرارة (مجلس الشعب) ومالك الجوهرة للسيراميك وعز الدخيلة والغز للحديد والصلب وغيرهما كثيرا (اتضرب بالجذمة ) لماذا لانة يملك 40 مليار جنية وهو لايتخطى ال 35 ولانة يملك قطعة ارض كبيرة فى سيناء بل كبيرة جدا واخذ المتر ب5 جنية يعنى ثمن شراب معفن ولانة من رجال الحزب الظالم تم نسيان او انهاء الموضوع بدون تحقيق فقط ادانو عاطف السادات او عصمت السادت الذى قاما بضربو بالجذمة ونسسسسسسسسو تماما انة يملك 40 مليار جنية بدون اى وجة حق او انة يملك ارض ببلاش ارجو من السيد المحترم المبجل الباشا البية احمد افندى عز ان يقوم بانشاء مصنع للجزم عندما يضرب بة مرة اخرة لا يوثر فى وجة معالية الغالية ويجعلو عامر يا حرامى باشا وربنا يستر على السادت وعلى وائل الابراشى رئيسى صوت الامة وعلى الاستاذ مجدى رئيس المصرى اليوم من السجن لانة فقط تكلمو كلام ليس اكثر انا باختصار خايف عليهم لحسن يحصلو ايمن نور او نعمان جمعة او نعلم انهم متخلفين عقلين ويوجد لهم شهادات معاملة الاطفال"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025513/http://masr.20at.com:80/article.php?sid=404"

