[[comments]]
order = 26
subject = "بالجزمه"
author = "مضروب بالصرمه"
posted = "2006-06-28"
text = "مصر ام الدنيا<br />مصر كنانه الله<br />مصر المحروسه<br />مصر المضروبه<br />الملعون سنسفيل ابوها<br />الصابره على الكلاب المبوءه<br />مصر المسكينه<br />تمخضت العقليه المصريع موضات كثيره والفظ كثيره بدا من القضاء الواقف والقضاء القاعد ثم القضاء المنبطح على بطنه<br />ضباط مخدرات يتاجروا بالمخدرات حاميها حراميها<br />ضباط اموال عامه اشتغلوا نصابين وبلطجيه<br />حماه القانون يضربوا القانون بالجزمه<br />يضربوا الغلابه المطحزنين بالجزمه بى يعلمونا الادب اصل اكتشفوا ان الشعب كله نسوان ومخنثين<br />غرقت الباخره طظ فى البلد وعلى الجزمه<br />باعوا عمر افندى بالملاليم طظ<br />باعوا الحديد لاحمد عز طظ ميهمش ماهو شايل الحزن الوطنى وشايل البلد على كف عفريت<br />الحديد 3500 وايه يعنى طظ<br />الاسمنت ولع طظ<br />الدروس الخصوصيه خربت بيوتنا مش احسن بدل ما الولاد يطلعوا جزم<br />الخصخصه باعت البلد وايه يعنى<br />اسكت يا كلب ايه فهمك فى السياسه<br />ممدوح مهيص بالعباره وايه يعنى بالجزمه<br />مرتضى منصور يرفع الجزمه<br />طلعت السادات عمل فيلم على احمد عز اقصر واحد فى الحزب الوطنى ومعاه احمد نظيف اطول واحد فى الحزب الوطنى<br />لمؤاخذه كلهم حراميه يتخانقوا على حاحا طظ فيكم<br />المرشد الطاهر العفيف اللسان طظظ مصر والمعارضه بالشرع والدين<br />البلد ساكته على الجزم<br />اصل احنا مش ناس ده احنا جزم<br />شعب حكمه المماليك العبيد 1000 سنه علونا الشخر والنخر والبع.......<br />كافور الاخشيدى ده عبد مخصى حكمنا<br />احمدوا ربنا بيحكمكم مبارك واهله<br />المشكله مش فى مبارك واهله<br />ولا شله مبارك ولا المنتفعين من مبارك<br />ولا الحكومه الخايبه<br />ومجلش الشعب التافهه الدلدول<br />ولا المحافظين الحراميه<br />ولا شله جمال وعز وشويه الصيع<br />كل دال نتج مصرى اصيل<br />العيب فى تركيبتنا الوسخه<br />العيب فى سلوكنا المريض<br />احنا اصلا<br />اقرأ بقية التعليق .."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720130644/http://masr.20at.com:80/article.php?sid=404"

