subject = "يا مصر يا بهيه"
author = "elking"
posted = "2006-05-29"
text = "يا مصر يا بهيه<br />سرأوكي الحراميه<br />نهبوكي الوطنجيه<br />حشوكي طعميه<br />ضربوكي بالدخليه<br />وفشخوكي بالخارجيه<br />وطحنوكي في الصبحيه<br />و اتغدوا بيكم في الضهريه<br />وأغتصبوكي في الفجريه<br />ورموكي للبلطجيه<br />وولعوا فيكي بفتن طائفيه<br />و اعتقلوا اخوان ميه ميه<br />وبعد ده كله بيأولوا<br />بنحبك يا بهيه<br />ههههههههههههههههههههههههههههههههههههههه"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025513/http://masr.20at.com:80/article.php?sid=404"

