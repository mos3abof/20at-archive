subject = "ايه السخسخه اللي حطت عليكو دي ...."
author = "هووووووبه"
posted = "2006-06-22"
text = "قلمك حسونه يا بت يا دودو زي الصوره ,علي فكره انا سمعت حكايه زي كدا مشابه لحد كبيره لحكايه الحاجه دي ,<br />الشاعر قال يا فالح ليس السعادة في المال وانما تؤخذ الدنيا سنطوطشن."
