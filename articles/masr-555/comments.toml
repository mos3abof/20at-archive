[[comments]]
order = 7
subject = "شيء اسمه الاستهبال"
author = "قلم جاف"
posted = "2006-06-24"
text = "لا شك أن ما قلتِه صورة من صور الخرافة.. لكنه ليس الوحيدة .. وهناك خزعبلات وممارسات للخرافة مسكوت عنها وعليها دون سبب واضح..<br />فوجئت بالست هيام الشاذلي تطلق على نفسها لقب دكتورة وأنها تعالج بما تسميه هي الطب التكاملي..دون أن يقول أحد للست ثلث الثلاثة كم ، أو تسألها نقابة الأطباء كأي نقابة محترمة يفترض بها الغيرة على المهنة من الأدعياء والجهال..<br />شيء اسمه الاستهبال المجتمعي الإعلامي ، الخيار والفاقوس في مواجهة الخرافة..<br />مفيش فايدة.."
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626150822/http://masr.20at.com:80/article.php?sid=555"
