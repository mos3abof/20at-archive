order = 0
subject = "مهي دي الحقيقه"
author = "عبدالله مفتاح"
posted = "2006-06-22"
text = "طيب مهو الحقيقه ان في حسد وفي سحر وفي مس<br />العيب مش الايمان بان الحاجات دي موجوده<br />العيب ان كل حاجه نرجعها للحاجات وننسى ان في علم وفي طب"
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626150822/http://masr.20at.com:80/article.php?sid=555"

[[comments]]
order = 1
subject = "ردود فعل"
author = "انسان حقيقى"
posted = "2006-06-22"
text = "تانى اصطدام بردود الفعل العكسية القوية ..<br />عندما شاعت فى مصر والدول العربية ظاهر الدجل والشعوذة وشغل العفاريت اضطر المثقفون الى رفض الفكرة من اساسها بكل ما فيها من صواب وخطأ وانا اعذرهم فى ذلك بالتأكيد ،، ولكن مهلا هذا لا يتفق مع التفكير الهادئ المتزن والنظرة الدينية والتاريخية فالسحر والمس والجان موجودن بكل تأكيد ولكن كما قال اخى عبد الله تواكل البعض على هذا وعدم اللجوء الى العلم والطب هو الكارثة الحقيقية ،، مثلما هى كارثة ايضا ان ننكر ما هو مثبت فى كتاب الله.<br />وعلى كل حال المقال عجبنى جدا<br />ولكم الشكر"
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626150822/http://masr.20at.com:80/article.php?sid=555"

