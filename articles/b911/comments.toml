[[comments]]
order = 1
subject = "رب الشعر والألم"
author = "معاذ محمود عامر"
posted = "2006-06-15"
text = "بدر شاكر السياب رب الشعر والألم, نعم,الألم, السياب شاعر ذو تفرد واضح في شعره لغة وموضوعا, لغته المتميزة الصعبة في بعض الأحيان, هي بداية اتصالك بالنص الرائع, فالسياب غزير في وضع المعاني والتعبيرات الثرية الفريدة التي تشي بتمكن واضح في أغوار اللغة العربية, فغنائيته طاغية على النص بحيث لا يمكن لك وأنت تقرأ أن تتوقف لشئ ما, اذ أنك قد تفقد الخيط السحري الذي يرتقي بك ـ بعد الفراغ من القصيدةـ الى آفاق سماوية بلا تعقيد, الى عوالم شعرية تأملية بارعة التكوين والتجميع والتأليف, عناصرها الواضحة, الغربة والألم والحنين الدائم للعشق, عناصرها جيكور والخليج والمطر, بالطبع المطر, غرام السياب الأول والأعظم. أما المحتوى فهو ذو اتساع بحيث يشمل الذات والآخر في محاولة للبحث عن الانسان الحقيقي . من أروع أعماله من وجهة نظري المومس العمياء التي يقول فيها:\"أتريد من هذا الحطام الآدمي المستباح , دفء الربيع وفوحة الحمل الغرير مع الصباح, ودواء ماتلقاه من بذل وسأم واكتداح\". ومن أعماله الرائعة أيضا \"غريب على الخليج\"التي كتبها في الكويت ويقول فيها:\"اني لأعجب كيف يمكن أن يخون الخائنون, أيخون انسان بلاده, ان خان معنى أن يكون, فكيف يمكن أن يكون\". وقصيدة \"النهر والموت\" ويقول فيها: \"بويب يابويب, أود لو غرقت فيك ألقط المحار, أشيد منه دار\". للمراسلة : mizo_bns2011@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131959/http://www.20at.com/article2.php?sid=911"

[[comments]]
order = 2
subject = "سفر أيوب"
author = "رائد بغدادي"
posted = "2006-06-16"
text = "السياب ذلك الرمح العراقي النازف الذي أبكى المرض قصائده حتى لم يعد هناك مايقال عن وجعه الطويل ...هانحن قد عدنا الى أيام المدرسة الاولى حين كنا نغني كلمات السياب التي قالها حين كان طالبا في الجامعة وهو يرى كيف تحتضن الجميلات ديوانه وتتسابق على حفظ أشعاره<br />ياليتني اصبحت ديواني<br />لأطير من صدر الى ثان<br />قد بت من حسد اقول له<br />ياليت من تهواك تهواني<br />أوتعرفون من السياب أنه رائد الشعر الحر<br />ونحن أن تكلمنا عن السياب يقف الكلام حين نتذكر قصيدة(( سفر أيوب)) والتي يقول فيها<br />لك الحمد مهما استطال البلاء<br />ومهما استبدّ الألم<br />لك الحمد، إن الرزايا عطاء<br />وإن المصيبات بعض الكرم<br />ألم تُعطني أنت هذا الظلام<br />وأعطيتني أنت هذا السّحر؟<br />فهل تشكر الأرض قطر المطر<br />وتغضب إن لم يجدها الغمام؟<br />شهور طوال وهذي الجراح<br />تمزّق جنبي مثل المدى<br />ولا يهدأ الداء عند الصباح<br />ولا يمسح اللّيل أوجاعه بالردى<br />ولكنّ أيّوب إن صاح صاح:<br />لك الحمد، إن الرزايا ندى<br />وإنّ الجراح هدايا الحبيب<br />أضمّ إلى الصّدر باقاتها<br />هداياك في خافقي لا تغيب<br />هداياك مقبولة. هاتها<br />أشد جراحي وأهتف<br />بالعائدين:<br />ألا فانظروا واحسدوني<br />فهذى هدايا حبيبي<br />جميل هو السّهدُ أرعى سماك<br />بعينيّ حتى تغيب النجوم<br />ويلمس شبّاك داري سناك<br />جميل هو الليل أصداء يوم<br />وأبواق سيارة من بعيد<br />وآهاتُ مرضى، وأم تُعيد<br />أساطير آبائها للوليد<br />وغابات ليل السُّهاد الغيوم<br />تحجّبُ وجه السماء<br />وتجلوه تحت القمر<br />وإن صاح أيوب كان النداء:<br />لك الحمد يا رامياً بالقدر<br />ويا كاتباً، بعد ذاك، الشّفاء<br />ولاتنسوا ...غربة الروح<br />ولاتنسوا... غريب على الخليج"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131959/http://www.20at.com/article2.php?sid=911"
