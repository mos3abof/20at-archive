[[comments]]
order = 0
subject = "الله ربى"
author = "مسلمه"
posted = "2006-04-14"
text = "حقيقى شكرا على النصائح الهامه<br />بس مقولتش لما مش هاركب عربيه ولامترو طب هاركب ايه اتوبيس؟؟؟؟؟تبقى كارثه؟؟؟<br />طب هروح الكليه ازاى ؟؟ الحقيقه الفايده الوحيده من كده اننا نبطل نتعلم ال يعنى احنا فى الكليات بنتعلم<br />امشى جنب الحيط ولو ناصح تمشى على الحيطه احسن هههههههههههههه<br />اللهم اتنا فى الدنيا حسنه وفى الاخرة حسنه وقنا عذاب النار<br />اللهم لاتهلكنا بما فعل السفهاء منا ..... وانتم اكيد عارفين السفهاء دول"
archived = "2006-04-21"
capture_url = "https://web.archive.org/web/20060421160600/http://masr.20at.com:80/article.php?sid=159"

[[comments]]
order = 1
subject = "قاهرة المعز الجميلة"
author = "سنووايت"
posted = "2006-04-16"
text = "انا كمان عندي خلطة سحرية بجد علشان تعيش فيها \" حبها\" حب زحامها وناسها وشوارعها حب كوبري قصر النيل وامشي عليه وقت الغروب - دوب في ميادنها - احمل ذكرى حلوة لكل حته فيها هتلاقي الحب جواك بيقهر كل حاجة بايخة - وبعدين دي مدينتك يعني بتحمل لها في قلبك ذكريات بداية كل الاشياء جواك اول مرة رحت المدرسة مشيت في الشارع ده اول مرة خرجت مع اصحابك اول مرة خرجت في معاد مع البنت بتاعتك وكنت بتتلفت يمين وشمال احسن حد يشوفك هوه انا اللي هفكرك بقى - سيبك من كلام اخينا اللي فوق وحبها من جديد"
archived = "2006-04-21"
capture_url = "https://web.archive.org/web/20060421160600/http://masr.20at.com:80/article.php?sid=159"

[[comments]]
order = 2
subject = "ولكن ؟؟؟ وآه من لكن يا براء"
author = "محمد السيد"
posted = "2006-04-18"
text = "والله الموضوع عجبني جدا ........ وكنت ناوي أعلق عليه ...<br />خصوصا لأني من اللي اتبهدلوا في البلد دي .... وبعدما كنت متهني في اسكندرية ات;تب عليا ادرس فيها ...<br />لكن؟؟؟<br />البراء مزودها علي الاخر في كلامه ... وحاجات كتير مش عارف ازاي ناشرها هنا عادي كده ...<br />يعني في \"وأنا مالي\" يقدر يكتب اللي عايزه .... لكن في ولاد البلد ؟؟<br />يعني أحنا رفضنا صورة خطيبة جمال مبارك وأيدنا كلامكم .... يقوم ينشر حجات زي دي ...<br />أنا اسف علي كلامي ده . بس ده من حبي ليكم .. كلكم ... ومن حبي للموقع ده ...<br />وربنا يبارك فيكم ويجمعني بيكم في الجنه<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-04-21"
capture_url = "https://web.archive.org/web/20060421160600/http://masr.20at.com:80/article.php?sid=159"

