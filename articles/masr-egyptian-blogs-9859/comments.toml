text = "للاسف الشديد سمعت هذا التعليق الذى كتبتة ليكمون عنوانا لمهازل هذة الفئة التى تمتهن ما يطلق علية الفن حاليا و سابقا كان يسمى الدعارة<br />هذا التعليق سمعتة من مواكن لبنانى؟ما رايكم؟؟؟<br />اتفق معة<br />لتكون فنان هل يجب عليك ان تكون سافل و قليل الادب و طويل اللسان؟<br />بالطبع لالالالالالالال الالالالالالالا ل الالالالالالالا ل الالالالالالا و مليون الف لالالالالالالال الالالالالالالا ل الالالالالالالا ل الالالالالالالا ل الا<br />الادب فضلوة على الفن و العلم<br />و اهههههههههههههه ههههههههههههههه ههههههههه يا بلد"
