author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-01"
text = "(رمضان كريم) و كل سنة و مصرنا الغالية منهوبة و مسروقة و من سيئىء الى اوسخ<br />كم من اعداد مهولة لتلك المسماة مسلسلات؟<br />و كم من اجور دفعت لهذة الحثالة القذرة المتمسحة بالفن و تمتهنة<br />يا حرام للاسف الشديد تحول شهر رمضان من شهر للتعبد و الصوم الى شهر للسرقة و النهب<br />بل اصبح و اللة يسامحنا جميعا الى شهر للرقص و الفجور و النصب و تفريغ خزائن الوطن المنهوبة من القليل القليل المتبقى؟<br />جميعنا يعرف انة فى شهر رمضان المبارك تجنزر و تحبس الشياطين و العفاريت؟ و الحمد للة<br />اما فى شهر رمضان المعظم فى مصر ؟!!! فقد اصبح شهر انطلاق اللصوص و الحرامية و النصابين و المغنواتية و المشخصاتية و الغوازى<br />اختشوا على دمكم يا حثالة المجتمع المصرى يا متمسحين بالفن و ما انتم الا —————————————————————-ظ!!!<br />ما انتم عارفين انتم فى الحقيقة اي’<br />سامحكم و سامحنا اللة<br />اجر المشخصاتى او حتى الغازية عن احط ما يسمى بالمسلسل لا يقل دخلا عن دخل رواتب الوزراء جميعا فى الحكومة المصرية؟<br />(حسب تقارير الجهاز المركزى للمحاسبات)<br />ما تيجوا نتحول جميعا الى مشخصاتية و غوازى و هذا اقل الايمان<br />اللة يسامحنا و يرحمنا جميعا<br />كل سنة و انتم طيبين(رمضان كريم)"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150908/http://20at.com/masr/egyptian-blogs/9859.html"

