author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-09-05"
text = "شفتم التفاهة و العباطة و الغباء و السرقة و الاقتباس و حتى احط عمليات النهب و السطو على جيبوبنا و عقولناو بطوننا الخاوية؟متمثلة فى الغرف من خزينة الدولة و الحكومة المصرية المسكينة و سكبها و ضخها الى تنظيم اللصوص و الحرامية اللى ممتهنين الفن؟<br />و ما هم الا مجموعة من حثالة المجتمع المنحط عبارة عن مشخصاطيةو عوالم و غوازى و حاجات كدة كتيرة الواحد موش عارف يسميها اية؟ (علشان كلها اسماء و صفات قذرة تليق بهم صفة و نعتا)<br />قال اية؟ قالوا انهم فنانين؟ يا و كستى عليكى يا مصر و على العار اللى بيقولو انهم فنانيين الحقوة بك!يا مصر يا مسكينة؟<br />لقد اصبح شهر رمضان المبارك احسن سبوبة جاتوة للحرامية النصابين دول اللى بيقولوا انهم فنانيين ؟ و ما هم الا احط حثالة كفت علينا من قاع المجتمع؟!!!!!<br />معلش يا رمضان يا كريم حظك كدة؟(دايما المؤمن منصاب) و مسروق و منهوب<br />(وكل سنة و مصر بخير) رمضان برضة طول عمره كريم مع لصوص و حرامية الفن المنحط<br />و سلملى على التليفزيون؟و مسلسلاتة الهايفة؟<br />مع الاعتذار ل(الواد بلية و دماغة العالية)<br />و اهههههههههههههه ههههههههههههههه ههههههههههههههه ههههههههههههههه يا بلد؟!!!!!<br />و عجبى"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150908/http://20at.com/masr/egyptian-blogs/9859.html"
