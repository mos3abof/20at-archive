text = "لا علاقة بين الحج والأنفلونزا . مما رأيت في الحج هذا العام أن كثير من الناس كانوا يلبسون كمامات واقية أثناء تأدية الشعائر , وربك بيحفظ من خرج من بيته راجيا رضى ربه . وكل سنة وكل الأمة بخير ."
