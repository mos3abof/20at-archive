order = 0
subject = "نسيتي فلم جامد"
author = "أكرم"
posted = "2006-02-06"
text = "final destenation<br />باجزائه الثلاثة و هو يتحدث عن الموت الذي يطارد الابطال و يضعهم على قائمة و هم يحاولوا التخلص من الموت<br />اهتمام الغرب بفلسفة الحياة التي تقلوم فلسفة الموت نشأت بعد أحداث 11 سبتمبر لمقاومة العمليات الانتحارية من وجهة نظرهم و اللي بنسميها استشهادية<br />في جملة مهمة في فلم سو ( saw ) لما الرجل السادي ( غير النمطي ) كان يحاول ان يقنع احد ضحاياه بان خلاصه من القيد لن يتم الا بأن يجد المفتاح المزروع خلف عينيه فاما ان يفقد بصره و اما ان يفقد حياته و ترك له اداه وحيده و هي السكين<br />و في نفس الفيلم في جزئه الاول اضطر البطل لكي يتخلص من قيده ان يقطع قدمه لكي يعيش و ينقذ اطفاله<br />انهم يتحدثون عن فلسفة الحياة و نحن نتحدث عن الموت و هذا هو الفرق بيننا و بينهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114709/http://www.20at.com/article2.php?sid=407"

