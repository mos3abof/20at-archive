[[comments]]
order = 2
subject = "كلام كبير وحوارات"
author = "عبده نصحي"
posted = "2006-02-07"
text = "انا شايف انه مقال ظريف بس بيحاول يبين ان تناول الافلام الاجنبيه لموضوع الموت افضل بشكل او باخر من تناول الافلام العربيه لنفس الموضوع وذكرت الاخت مريم امثله من افلام عربيه وافلام اجنبيه حول موضوع الموت وبعدين رد الاخ اكرم وباين عليه من احد المؤيدين لنظريه المؤامره اللي بتقول انتوا حصابه انتوا كلوكوا حليا ولا ايه وبتفسر اي حاجه يقوم بيها الغرب ومن ضمنهم امريكا علي انها موجهه للمسلمين فبيقول كلام كبير اوي انه اهتمام الغرب بفلسفه الحياه التي تقاوم فلسفه الموت نشأت بعد احداث 11 سيبتمبر لمقاومه العمليات الانتحاريه من وجه نظرهم واللي بنسميها استشهاديه بصراحه انا توهت اولا غريزه الحياه موجوده في كل بني ادام وانه ربنا خلقنا عشان نعبده وعشان نعيش ونعمر الكون الي ان ياتي اجل كل منا فغريزه الحياه او حب الحياه مفطور عليه كل بني ادام مش الغرب وحدهم عشان كدا حرم الله الانتحار وهناك فتاوي بكفر المنتحر اذن نتفق علي انه حب الحياه فطره وبالنسبه للانسان الكافر فتجده اشد الناس علي الحياه كما قال تعالي \"ولتجدنهم احرص الناس علي حياه والذين اشركوا\" وكمان ايه\" ود احدهم لو يعمر الف سنه وما هو بمزحزحه من العذاب ان يعمر \" دا لان الكافر لا يؤمن بما بعد الموت يعني الحياه الدنيا هي كل شئ بالنسبه ليه دا فريق من الكفار نرجع تاني لنقطه تانيه ليه الانتحار يعد برده كفر وليه فيه من الكفار بينتحر بالرغم من اني قولت انه الكافر نفسه يخلد في الارض في ظاهر الكلام هتقول دا تناقض لكن لو دققت مش هتلاقي اي تناقض نمسك اول نقطه ليه حرم الله الانتحار لان الانتحار او قتل النفس بما حرم الله دليل علي القنوط من رحمه الله واستعجال الاجل ودا دليله \" لا يقنط من رحمه الله الا القوم الكافرون \" اذن فالانتحار دليل علي القنوط والياس من رحمه الله لذلك حرم الله الانتحار لعله القنوط والياس طيب دلوقت ليه الكافر بينتحر في حين انه نفسه يخلد لسبب بسيط جدااا او لعده اسباب منها ان الكافر لا يؤمن بوجود اله يلجاء اليه عند الحاجه لا يؤمن بوجود رب ينفعه ويضره لذلك مع تعرضه للمحن يقنط ويكره الدنيا باللي فيها دا سبب السبب التاني العكس بمعني انه الكافر بما بيحوز علي كل متاع الدنيا ومش عارف يعمل ايه تاني لا يجد للحياه طعم كل ما يعوز يعمل حاجه يعملها فباتالي بتفقد حياته اي طعم والدليل علي كلامي ارتفاع نسبه الانتحار في سويسرا مثلا بالرغم من انهم اغنياء وكل ملذات الدنيا عندهم المهم دا كان رد بسيط وبايجاز بعض الشئ عن نقطه اهتمام الغرب بفلسفه الحياه والكلام الكبير دا نيجي لنقطه تانيه برده في تعليق الاخ اكرم تعريفه لكلمه السادي اللي ذكرتها الاخت مريم حين وصفت الالعاب بالساديه بيقول الاخ كريم الرجل السادي غير نمطي بين قوسين بيفكرني بعادل امام لما كان بيقول انا احب اضيف نقطه مهمه جدا هي كانت رقاصه وبترقص اولا كلمه سادي او ساديزم ومنها ساديست بالانجليزيه وتعني التلذذ بتعذيب الاخرين او التلذذ بالم الاخرين ولها علاقه قويه بالمواقف الجنسيه يعني التلذذ جنسيا بالم الاخرين او المعامله القاسيه جنيسا وهكذا اما كلمه غير نمطي جابها منين مش عارف او لربما هو مش عارف يعني ايه كلمه نمطي اساسا المهم ما طولش عليكم قول طاول الافلام الاجنبيه بتقسم لتصنيفات منها مثلا كوميدي ومنها اكشن ومنها رومانس ومنها اجتماعي ومنها رعب من ضمن تصنيفات الرعب افلام بيطلق عليها افلام دمويه ودي مسموح لمرحله سنيه معينه انه تشوفها لانها عنيفه دمويه لدرجه طييين ومن امثلتها فيلم SAW اللي ذكرته الاخت مريم وفي الحقيقه بيطلقوا اسم slasher movies علي النوعيه دي من الافلام وفيه افلام pshyco يعني بتقوم علي معالجه امراض نفسيه مثلا بس من خلال فيلم اكشن او بوليسي وهكذا من الافلام دي فيلم seven او الخطايا السابعه بصراحه انا مش عارف بحب الفيلم دا ليه المهم في نهايه التعليق البسيط دا ادعو الله ان يتوب عليا وعليكوا ويحينا حياه هنيه ويرزقنا موته سويه ويحسن ختامنا اميننننن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114709/http://www.20at.com/article2.php?sid=407"

