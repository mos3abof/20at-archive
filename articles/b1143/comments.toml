order = 0
subject = "اعتبرة شىء"
author = "بيدو نت"
posted = "2006-09-25"
text = "من عالم الأشباح, يُنكرُنا البشر<br />ويفر منّا الليل والماضي ويجهلنا القدر<br />ونعيش أشباحًا تطوفْ<br />نحن الذين نسير لا ذكرى لنا<br />لا حلم, لا أشواقُ تُشرق, لا مُنى<br />آفاق أعيننا رمادْ<br />تلك البحيرات الرواكدُ في الوجوه الصامتهْ<br />ولنا الجباه الساكتهْ<br />لا نبضَ فيها لا اتّقادْ<br />نحن العراة من الشعور, ذوو الشفاه الباهتهْ<br />الهاربون من الزمان إلى العدمْ<br />الجاهلون أسى الندمْ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112514/http://www.20at.com/article2.php?sid=1143"
