[[comments]]
order = 2
subject = "الحجاب...رغم أنف الحاقدين"
author = "Drsalah_hanie"
posted = "2006-11-26"
text = "لقد أصبح كل من يدافع عن الاسلام أناس همج متخلفين متعصبين متزمتين رجعيين وكل من يهاجم عقائد المسلمين ودينهم هم أناس مثقفين مفكرين مبدعين متنورين.!!!<br />أصبح الجانى مجنى عليه والعكس بالعكس وأصبح إلصاق كل نقيصه بالاسلام ومن يحملون هم دينهم أمرا طبيعيا بل ومشروعا وعندما تهم بالرد تصبح من المغضوب عليهم من وجهة نظر العلمانيين اللى همه المثقفين وكأنهم النخبة المنتقاة وعصارة المجتمع الميمونة مع أن دورة حياتهم معروفه للجميع:<br />سفالة وقلة أدب على الاسلام ورموزه ـــــــــــــــــــ ثم الحصول على أوسمة الرضا من \"الشيطان \"وأتباعه من الأنس ــــــــــــــــــــــ ثم إلى مزبلة التاريخ.<br />(ملحوظه: هذه المزبله من أقذر وأوسخ مزابل التاريخ وهى معده خصيصا لكل من يتهكم على الاسلام ورجال الاسلام معتبرا ذلك هو القربان الاسمى للشيطان الرجيم).<br />ولانامت أعين المنافقين<br />والعلمانيين .<br />قولوا أمين.<br />امين<br />وأقول للأخت اللى فوق إن الحجاب فريضة وإن لم نغضب لأوامر الله تعالى فماذا سوف يبقى لنغضب عليه.<br />ثم إن الأخوات لم يفعلوا شيئا حراما أو منكرا بل فعلوا شيئا أعتقد أنه سيحسب لهم فى ميزان حسناتهم فبالتأكيد لن يأخذوا ذنبا على مافعلوه والانسان الذى لايتحرك ويفعل شيئا عليه أن يؤيد ويشجع من يفعل لا أن يثبطه .<br />وأخيرا اقول لك إن تصريحات العلامه\"فاروق\"ليست حوارا شخصيا بريئا مع صحفيه فى جريده ولكن هذه التصريحات هى امتداد لسلسلة الهجوم على الحجاب ابتداءا من فرنسا والدول الاوروبيه ومرورا بتونس واتهاءا بمصر ...<br />والبقية تأتى ...<br />وإلا فلم لم يصرح بما قال إلا فى هذا التوقيت بالذات وبعد مرور 19 سنه خدمه فى ثانوى ..أقصد فى وزارة الثقافة."
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130120510/http://masr.20at.com:80/article.php?sid=1210"

