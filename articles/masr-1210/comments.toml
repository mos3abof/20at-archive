author = "الحجاب فريضة"
posted = "2006-11-26"
text = "هقول ايه تااانى غير كلمة اتبضنت لان البيض غلى اليومين دول والناس بطلت تشتريه كفايه يعنى ان البيضة بقيت ب75 قرش وقابلة للزيادة والنقصاان محسسنى انى فى البورصة ..ارحمونا بقى ... انا باطالب بدخول البيض فى البورصة لان الناس محتاجة تاخد اسهم كتير ... حرام مصر تبقى بالصورة دى فعلا احنا دولة اسلامية وعيب نقول كده... الحجاب فريضة وجميع الناس تحتمها بالجزمة .. ومتنسووش البيض ..يالا سلام"
