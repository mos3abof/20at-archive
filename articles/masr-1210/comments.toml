subject = "مش حاجة تفرح"
author = "واحدة محجبة والله العظيم"
posted = "2006-11-26"
text = "مش عارفة ليه اتخنقت جدا من منظر البنات اللي طالعين في مظاهرة علشان يحاربوا في معركة وهمية.. يا ستي هو انتي كان حد قال لك اقلعي الحجاب علشان تقولي مش هقلعه.. بجد لحد امتى هنبقى زي القطيع مطرح ما يودونا نروح.. وكل ما نبدأ نفوق لقضايا بلدنا يشغلونا بالتفاهات..<br />والله يا بنات لو كانت هبتكم دي ضد الفساد والاستبداد مش ضد واحد كان بيقول رأيه.. أكيد كنا هنفرح بيكم أكتر."
