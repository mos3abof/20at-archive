[[comments]]
order = 3
subject = "هم يبكى و هم يدحك"
author = "الجنرال المصرى"
text = "مين دول الى يوحوا يحاربوا دول خايفين من الهواء تقولى يروحوا يحاربوا من امتى الكلام دة و بعدين بصوا لكل واحد منهوم كرشة قد اية و عندهوم امراض الدنيا احنا مش عايزين بس غير يسيبونا فى حالنا و احنا نتصرف بس من غير اعتقالات"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830142131/http://harb.20at.com:80/article.php?sid=93"

[[comments]]
order = 4
subject = "حلم من احلام اليقظة."
author = "صقر العرب"
text = "الزعماء العرب قبل ان ابدء في التعليق اقول اين هم حكام العرب اصلا وهل للعرب حكام؟<br />اقول حلم من احلام اليقظة تمر على الانسان وهو يتخيل ان الخنازير تحولت في لحظة اسود لها ازير. من المعروف ان الخنزير ليس له غيرة حتى على زوجته وبهذا تمثل نواب الغرب على العالم العربي فهم خنازير ولكن على صورة بشر ليس عندهم نخوة ولارجولة ولايعرفون للشرف حدود هؤلاء هم نواب الغرب على العرب( حكام العرب المحكومين).<br />فهل يترجى ممن ليس له غيرة ان يتحول في يوم من الايام ذو شرف رفيع ورجولة. لقد اصبح هؤلاء اضحوكة ليس امام شعوب العرب بل امام شعوب العالم اجمع واصبحوا نكت يتداولها الناس في المقاهي والطرقات : يقول احدهم هل مرت بك نعامة تضع وجهها بين جناحيها قال لا ولكن ليش تضعراسها بين جناحيها قال:لاان ريشها منتوف . هؤلاء هم حكام العرب ان كان للعرب حكام. اما ان يحركوا الجيوش ليقاتلوا اعداء العرب فهذا بعيدا ولايجوز لنا نحن العرب ان نحلم به ليس يقظة ولكن في النوم."
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830142131/http://harb.20at.com:80/article.php?sid=93"

[[comments]]
order = 5
subject = "هي ناقصه"
author = "عزت بحري"
text = "يا خويا انته عايز تدخل على حزب الله حفنة من الخونة والله كان يلزم كمان أنو تنده للمقبور ملك الأردن يا اخي هما بينفعوا غير للكلام وللذل"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830142131/http://harb.20at.com:80/article.php?sid=93"
