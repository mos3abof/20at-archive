[[comments]]
order = 0
subject = "اين جيش لبنان"
author = "وليد"
text = "بسم اللة الرحمن الرحيم<br />صدق اللة العظيم<br />ولاكن اين جيشك يا لبنان<br />هل يوجد بلد بدون جيش<br />اللهم انصر المقاومة الاسلامية<br />ووحد العرب امام هذا العدوان<br />الملعون"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830142131/http://harb.20at.com:80/article.php?sid=93"

