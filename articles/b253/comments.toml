subject = "بوس الصورة تطلع حلوة"
author = "peasful girl"
posted = "2006-07-02"
text = "أولا : السلام عليكم و رحمة الله و بركاته<br />طلما اعتبرنا القبلة دليل على المحبة و لكن في السياسة القبلة تعبر عن المصلحة ... عرفات مثلا مصلحته مع الكل سواء فلوس أو تحرير علشان كده باس الكل ... بس الناس الذين نادرا يقبلون هم الأقوياء ... أسود السياسة ... حكام العالم ... معندهمش مصلحة مع حد بس الكل عنده مصلحة معاهم .<br />أرجو أن تظل القبلة عندنا تعبير عن الحب و الاحترام و الوفاء و لا تتحول قريبا إلى مجرد سياسة ... و الله المستعان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125149/http://www.20at.com/article2.php?sid=253"

