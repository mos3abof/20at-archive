[[comments]]
order = 1
subject = "الذين يتخذون الكافرين أولياء"
author = "زائر"
posted = "2005-11-21"
text = "قال تعالى: \" بشر المنافقين بأن لهم عذابا أليما . الذين يتخذون الكافرين أولياء من دون المؤمنين . أيبتغون عندهم العزة فإن العزة لله جميعا\".[النساء138و139]<br />هذا نص حوار نائب المرشد العام للإخوان المسلمين لقناة الجزيرة<br />محمد خيرت الشاطر [متابعاً]: في دائرة وادي النطرون إحنا بندعم مرشح قبطي هناك في مواجهة الوزير اللي موجود مرشح الحزب الوطني، المرشح القبطي مرشح مستقل.<br />أحمد منصور: وادي النطرون وزير الزراعة المرشح فيها.<br />محمد خيرت الشاطر: آه وزير الزراعة إحنا بندعم مرشح قبطي هناك مستقل إتصل بينا ونسقنا معاه ووافقنا على دعمه بشكل واضح وبالتالي مش قاعدة إن إحنا ما بندخلش في كل دوائر الوزراء أو الشخصيات الكبيرة.<br />أحمد منصور: بخصوص المرشح القبطي ما طبيعة العلاقات والتحالفات بينكم وبين الأقباط؟<br />محمد خيرت الشاطر: نحن على قناعة إنه لابد من تمثيل الأقباط في الحياة السياسية، شأنهم شأن أي فصيل آخر موجود في المجتمع المصري بغض النظر عن قضية الدين إنما إحنا بنتكلم عن قضية مصر الآن وقضية نهضة مصر وبناءها بعد حالة التخلف الشديدة وبعد تفشى مثلث التخلف والفساد والاستبداد اللي موجود وبالتالي نحن نرى إنه كل القوى لابد أن تكون موجودة وممثَلة وعلاقتنا بالأقباط علاقات صحية ومستمرة وليست وليدة هذه الأيام وليست مرتبطة بالانتخابات وده أمر بيأمرنا به ديننا أصلا.. يعني المسألة مش مسألة تكتيك ولا مسألة سياسة كما يحاول البعض أن يروج وهمّ الأقباط اللي اتصلوا بينا، إحنا في الانتخابات السابقة تعاونا مع الأستاذ منير فخري عبد النور وتركنا دائرة الوايلي أو دعمناه فيها وهذه المرة أيضا نفس الموقف وكذلك في دائرة وادي النطرون ولا مانع لدينا من التعاون مع أي مرشح قبطي أو أي مرشح من أي قوى سياسية أخرى أو من أي فصيل آخر<br />اقرأ بقية التعليق .."
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013043333/http://egyvote.20at.com:80/article.php?sid=20"

[[comments]]
order = 2
subject = "دى مصيبه سودا"
author = "زائر"
posted = "2005-11-22"
text = "زاى نقبل تتدخل ناس ملهاش كلمه ولا ليهم أمان ناس مفتريه بتقتل فى الأبرياء و بتسرق أموالهم و بتساند غيرها من الحقراء اللى زيها فى مثل هذه الأشياء و أكثر .<br />طيب إزاى هنديهم الأمان إذا كان هم بيجرى فى دمهم الخيانه و كرههم للدين الأسلامى و تتطاولهم على الحبيب المصطفى سيدنا محمد (ص) فى الأعلام و الجرائد و الكتب و غيرها؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />و لو النهارده سمحنالهم بالمراقبة الله أعلم هيطلبوا بأيه تانى و اللى يعيش ياما يشوف و بالذات إن البجاحه شىء عادى عندهم.<br />و بعدين هما المصريين قاصرين و مش هيقدروا يرقبوا ويديروا نفسهم ؟<br />وللا هو مسمار جحا عايزين يدؤه فى بلدنا مصر عشان تكو العراق رقم 2 و غيرها من البلاد المسلوبها سواء منها أو من أعوانها فى الكفر و الفساد و السلب والنهب وغييييييييييييييييره"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013043333/http://egyvote.20at.com:80/article.php?sid=20"

