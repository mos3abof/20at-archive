[[comments]]
order = 0
subject = "السقا مات"
author = "أكرم يتنفس الصعداء"
posted = "2006-02-05"
text = "اولا موضوعات الموقع بدأت ترجع تاني لعشرينات شباب النت المثقف و الروش الدارس لفن الاعلام و الهاوي بدون فزلكة و لا فرض رأي عن رأي<br />ثانيا ادعو كل اصدقائي اللي بيحبوا يقروا ( وهم قليل ) ان يقروا روايه السقا مات و اللي مبيقروش يشوفوا الفيلم بطولة عزت العلايلي و فريد شوقي<br />فلسفة الموت دي من اهم الفلسفات في الوجود و لازم الواحد يعرف ان الموت علينا حق بجد و يستعد له ( ان شا الله حتى يلاعب اوغندا )<br />مره واحد سأل النبي محمد صلى الله عليه وسلم متى الساعه ؟؟ فقال له ( بأبي انت و امي يا رسول الله ) و ماذا اعددت لها ؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114359/http://www.20at.com/article2.php?sid=385"

