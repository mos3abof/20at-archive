posted = "2006-12-06"
text = "و ماذا عن جرائم اعتصاب وة قتل الاطفال<br />ماتذا عن اطفال الشوارع<br />ماذا عن جنون الاسعار اللى خلى الناس بتصوت ف كل وسائل الاعلام<br />ماذا عن الاعتقالت الفوريه<br />ماذا عن الداخليه و انتم فاهمين قصدى<br />ماذا عن التعديلات الدستوريه المزعومه<br />ماذا عن شركه الفرسان و سرقه الناس و الهرب خارج البلاد بمنتهى السهوله<br />و تقولولى اتهان<br />لا فعلا ميصحش<br />ميصحش خالصصصصص"
