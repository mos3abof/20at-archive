subject = "لية كده يعنى بقى"
author = "إللى كاتب إن الشيعة ها يدوروا على الشعوب بعد لما مشاكلهم تخلص أحب بس اقولهم دى خيبة قوية وتحليل عبيط ليك لأن الشيعة قوتهم كلها تقف فى وجه الفساد وهما فعلاً ممكن يحاربوا بس الحكام العملاء علشان يخلصوا الشعوب المقوفة منهم لكن كفاية إن حسن نصر الله علم الحكام الخونة إزاى الدفاع بيكون عن البلد ضد العملاء والفاسدين وياريت إللى كاتب التعليق اللى فوقى يبطل يفتى ويشوه الصورة علشان يضمن رضى الكلب الكبير عنه ويفضل قاعد يشم ريحة رجلية النتنه إللى فى عز حرب نصر الله ضد اليهود كان عمال يحبط فيهم ويقوى فى إسرائيل"
posted = "2006-12-11"
text = "حسبى الله ونعم الوكيل ونصرك الله على الفساد يا حسن نصر الله وياأيران الغالية"
