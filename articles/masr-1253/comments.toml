[[comments]]
order = 3
subject = "بقلم حمدى رزق"
author = "«المصرى اليوم»"
posted = "2006-12-06"
text = "زمان كانت الكوكاكولا لا تدخل بلدتنا الوادعة، إلا في حالتين، واحد بيطلع في الروح، فيسألوه: نفسك في إيه؟ فيرسم الرجل في الهواء قد امرأة مثيرة، يفهم منها «إزازة كوكاكولا»، كانوا يسمونها «كاكولا» تخففاً لحرج الحالة.<br />الثانية، أن يكون خروف الضحية ملكوما، والكاكولا كانت علي أيامنا بتفك اللكمة، قبل اختراع الطب البديل - أقصد الطب البيطري - خلاف ذلك لم نعتد شرب الكاكولا، وكان دخولها داير الناحية فألاً سيئاً، جنازة في الطريق.<br />استنكفت من رئيس الوزراء الدكتور أحمد نظيف، أن يدلل علي انتعاشة الطبقة الوسطي بزيادة استهلاك الكوكا، قال رئيس الوزراء لروزاليوسف: «في تركيا قابلت صدفة نائب رئيس مجلس إدارة الشركة العالمية لـ«كوكاكولا»، وتعمدت أن أسأله: هل متوسط استهلاك الفرد في مصر من «الكوكاكولا» زاد؟ فرد الرجل: زاد بنسبة ١٧ في المائة!».<br />يعقب رئيس الوزراء: لا تستطيع أن تقول إن هذا معدل يخص الأغنياء وحدهم، الغني هيشرب كام إزازة، الأغنياء عندنا ٥.٠%، وبالكتير ٢%، إذن هذا مؤشر يخص الطبقة الوسطي!<br />بصراحة خفت علي الطبقة الوسطي من شرب الكوكا، وأحسست أن ما تبقي من الطبقة الوسطي بعد الخصخصة أجله قد حان، وأن زيادة الطلب علي الكوكا نذير شؤم، ودعوت الله في سري أن يخلص الطبقة المنكوبة من هذا الإدمان، الذي تمكن منها، رغم تعدد المشروبات الغازية في السوق.<br />فات الدكتور نظيف أن يسأل نائب رئيس الشركة العالمية: «صاروخ ولا كانز.. ؟»، لأن الطبقة الوسطي عندنا تفضل الكولا في عبوة الصاروخ، أما النص في المائة فيفضلها «كانز»، والبعض يفضلها دايت، وأحيانا لايت، نكاية في الطبقات اللي تحت.<br />ولأننا شعب في الكازوزة، فإنني أنصح رئيس الوزراء بأن يكلف الدكتور عثمان محمد عثمان وزير التنمي<br />اقرأ بقية التعليق .."
archived = "2006-12-08"
capture_url = "https://web.archive.org/web/20061208025023/http://masr.20at.com:80/article.php?sid=1253"

