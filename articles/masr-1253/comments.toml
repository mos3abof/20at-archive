subject = "حسن نصر الله"
author = "شيماء"
posted = "2006-12-06"
text = "السلام عليكم و رحمة الله و بركاتة<br />انا عندي حل للخلاص من جوز الشباشب قصدي الجزم و الولية الي وراهم. احنا نقترح علي حسن نصر الله يجي اعارة لمصر كمعارض سياسي يعني نشوفله عقد عمل كمعارض في مصر و ان شاء الله حال البلد حيتغير يأما بقي يستنسخو منه واحد لصالح مصر طالما ال 80 مليون مصري مفهومش حد عارف يفتح بقه.<br />تحياتي"
archived = "2006-12-08"
capture_url = "https://web.archive.org/web/20061208025023/http://masr.20at.com:80/article.php?sid=1253"

[[comments]]
order = 11
subject = "الاخوة اللي زعلانين من الصورة"
author = "شيماء"
posted = "2006-12-06"
text = "يا جماعة انتو زعلانين من الصورة و هي يدوب في موضوع ممكن كمان متبصوش عليها امال انا اعمل ايه اللي الفردة الكبيرة صورتة في وش مكتبي في الشغل طول اليوم, يعني انتحر و لا اعمل ايه و كل مبص فيها ابقي عاوزة ارجع. دلوقتي بس عرفت امراض المعدة اللي عند المصريين دي من ايه."
archived = "2006-12-08"
capture_url = "https://web.archive.org/web/20061208025023/http://masr.20at.com:80/article.php?sid=1253"

[[comments]]
order = 12
subject = "عنوان التعليق"
author = "البراء"
posted = "2006-12-07"
text = "من الواضح يا اخ او اخت دشم ان هذا موقع معارض ، فلماذا الاصرار على معركتك الخاسره هذه ، بالاضافه الى انك تدعى انك تتعرض للشتائم فى حين ان ردودك لا تخلو منها فى بعض الاحيان ، فمن هو الذى يناقض نفسه الان.<br />ومن ناحيه اخرى ارى ان التجاهل هو الاسلوب الاكثر فاعليه - واكثر احتراما ايضا - فى التعامل مع مثل هذه الردود سواء من هذا الدشم او من غيره.<br />فاذا كان يؤمن حقا بما يعتقد فيه فهذا شأنه ولكن ان نشن ضده موجه من الشتائم يستغلها وامثاله للظهور بمظهر الضحيه فهذا فى صالحه و ليس العكس.<br />ارجو ان اكون قد اوضحت وجهه نظرى<br />والسلام عليكم."
archived = "2006-12-08"
capture_url = "https://web.archive.org/web/20061208025023/http://masr.20at.com:80/article.php?sid=1253"

[[comments]]
order = 13
subject = "استفسار"
author = "مريم"
posted = "2006-12-07"
text = "ممكن اعرف يعني اية كلمة دشم..و لماذا المقصود بها السيدة سوزان مبارك...و بعدين انا بقرا لابن بهية كتير...و وجدت ان في تعليق من احد الافراد بيقول : انتو متعرفوش مين ابن بهية دة...ولا مين اللي وراه و مين اللي معاه...هو مين بقة ابن بهية دة كمان...احسن يطلع امن دة كمان او واحد من اتباع السلطة...مع اني شايفة انو راجل محترم جدا و تعليقاته تعتبر اكثر من رائعة...فبرجاء الافادة"
archived = "2006-12-08"
capture_url = "https://web.archive.org/web/20061208025023/http://masr.20at.com:80/article.php?sid=1253"

[[comments]]
order = 14
subject = "كلام بعضه صحيح"
author = "قلم جاف"
posted = "2006-12-07"
text = "أعتقد أن هذا يسير في إطار الشرشحة البيروقراطية لكل من هو معارض ومختلف ..<br />ومع ذلك ، فعادل حمودة هو الوحيد الذي يستحق المقاضاة في كل هؤلاء .. فعناوينه فعلاً أقرب إلى الشتائم والتهييج والتشنج ، ومع ذلك يحظى بحماية من المؤسسة الصحفية الحيزبون ذات جريدة الـ500 نسخة ، في الوقت الذي يتم وضع كل المنتقدين على أسس سليمة من العقل والمنطق مع البيه حمودة في سلة واحدة ويعاملون كأنهم شتامين!<br />البيروقراط يستغلون تجاوزات البعض لإرهاب الكل .. ألا هل قد بلغت؟"
archived = "2006-12-08"
capture_url = "https://web.archive.org/web/20061208025023/http://masr.20at.com:80/article.php?sid=1253"

[[comments]]
order = 15
subject = "ن"
author = "اسئلة ولكم الاجابة عليها...."
posted = "2006-12-07"
text = "1)ماذا يفعل شاب تخرج بعد عناء وسهر ولم يجد فرصة عمل لكي يستطيع ان ياكل لقمة عيش ويساعد والديه في مواجهة الحياة الصعبة؟؟<br />2) ماذا يفعل شاب لم يجد فرصة عمل وزملائه اصحاب النفوذ والمال يشترون الوظائف بالواسطة والمحسوبية؟؟؟؟؟<br />3)ماذا يفعل شاب وبلده تباع قطعة قطعة وللاجانب والمصانع تخرب ثم تباع بحجة الخصخصة والمصمصة, ويشرد الاف العمال تحت مسمي المعاش المبكر؟؟؟؟<br />4)ماذا يفعل المواطن سواء الشباب العاطل او الموظف المطحون في مواجهة الغلاء في كل شيء من طعام وشراب وملبس وحتي الادوية؟؟؟؟<br />5) ماذا يفعل شابعندما لا يجد عملا او مال او فرصة للحياة؟؟؟<br />ولهذه الاسباب كنت بكره الانسان الذي يضحي بحياته سواء بالانتحار او بوسائل اخري كنت اكرها ولكن للصبر حدود وحدود, ولا يستطيع اي انسان ان يتحمل اكثر واكثر من طاقته , فاذا كان الحديد يلين؟؟ فما بالك بالانسان الذي خلق من لحما ودم؟ فالصبر حدود يا مبارك ."
archived = "2006-12-08"
capture_url = "https://web.archive.org/web/20061208025023/http://masr.20at.com:80/article.php?sid=1253"

