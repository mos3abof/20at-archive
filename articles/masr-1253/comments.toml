author = "يادشم الكلاب أمثالكم شتيمته واجبة وتعتبر وسام على صدر من يشتمكم وهو إنتى هامك إنك تقعدى فى الحكم رغم إنك مش مصرية ورغم رفض الشعب ليكم أنت وأبنك الشاذ المدمن وجوزك المريض بالزهايمر إللى عمره دلوقتى 82 سنة ولسه عايز يقعد لأخر عمره وناسى إن العقل بيفنى قبل القلب وهو دلوقتى بقى بيخرف زيك بالظبط يا أحقر الخلائق إرحلوا عن مصر حتى تراب مصر سيلفظكم بعد دفنكم فيه"
