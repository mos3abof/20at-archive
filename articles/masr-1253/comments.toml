text = "ده اذا لو اى حد اتشتم من حقه يرفع قضيه، فده على الاقل يعنى سواء كان رئيس او غيره ، ايه المشكله ، مزعلين نفسكم اوى كده ليه ، والعينه ماهى باينه فى الموقع ده ، ومش مهم ان حد يتشتم فى سبيل راى مقتنع بيه ، ومش مهم اتشتم على رايى فى انه نعم للتوريث ولاستكمال المسيره<br />نعم للتوريث ولاستكمال المسيره."
