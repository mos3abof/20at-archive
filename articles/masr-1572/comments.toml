subject = "يا عم حزين"
author = "انت قريب الدكتور سليمان حزين ؟"
posted = "2007-02-11"
text = "والا ايش جاب لجاب<br />بقى يا سيدى الحكومة مش عارفة ان الحالة للناس جيم<br />حكومة معذورة نصفها من حملة الجنسية المزدوجة<br />يبقى هتبص للشعب اللى طالع لسانة من اللهث والجرى وراء لقمة العيش المرة<br />الاخوان حارقين .. الحكومة لية وشاغلة نفسها بيهم وبلقاءات ابو عباس اللى كل اسبوع هنا ومطلوب للمقابلة وعاملينة شغلتنا ومشغلتنا<br />يا ناس شوفوا مصالح الناس بكرة هتموتوا وما حدش هيعبركم ولا حتى هيمشى فى جنازتكم<br />وهتبقى جنازة جربانة ومقشفة والزغاريد هتملى البلد<br />فاهم ياعم حزين وخليك مع اللة لتموت وانت فى عز شبابك من القهر"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218072902/http://masr.20at.com:80/article.php?sid=1572"
