[[comments]]
order = 0
subject = "الاسماعلية"
author = "طارق صلاح"
posted = "2005-11-20"
text = "كد لنا الاستاذ طارق صلاح الصحفي ان المؤشرات الاولبة للنتيجة ان النتائج الاولية بمدينة الاسماعلية ان الدائرة الثانية علي وشك ان تشهد عملية الاعادة بين صبرى خلف الله \"اخوان \" وبين محمود عثمان وطني على مقعد الفئات فى حين يشهد مقعد العمال صراع عائلي بين سعيد شعيب واحمد منسى<br />اما الدائرة الثانية من الاسماعلية والتي تشير النتائج الاولية الى فوز مرشح الاخوان ابراهيم الجعفرى<br />بفارق 5000 الاف صوت عن مرشح الوطنى محمد رحيم<br />وبينما تشهد المنطقة الثالثة اعادة بين صلاح عبدالغنى وحمدى اسماعيل علي مقعد الفئات وبين احمد ابو زيد ومنى نوفيل على مقعد العمال"
archived = "2007-08-17"
capture_url = "https://web.archive.org/web/20070817045546/http://egyvote.20at.com:80/article.php?sid=30"

