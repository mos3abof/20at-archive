[[comments]]
order = 3
subject = "انظر  ةلا تبكي"
author = "راحت عليك يا ديمقراطية"
posted = "2005-11-20"
text = "شرات من الانتهاكات قامت بها قوات الامن ضد الناخبين البسطاء وكان من ضمن انتهكات حقوق الانسان ما قام به الامن في دمنهور من احتجاز اكثر من 50 شخص كما هو وارد فى هذا التقرير مركز ابو حمص<br />التعذيب:<br />1. هيثم سعيد<br />2. حمدى كمال<br />و ذلك على يد الظابط امن الدوله بكفر الدوار و يتم الان عمل التقرير الطبى<br />و ملحزطظه عبد القوى رئيس مباحث كفر الدوار عذب اخوة من ابو حمص<br />مركز حوش عيسى<br />المعتقلين :<br />1. رزق يوسف عبد الله<br />2. عماد رشاد حميد<br />3. ابراهيم الشريف<br />4. احمد ابراهيم<br />المصابين<br />1. احمد عبد الهادى<br />2. ابراهيم عبد الله<br />3. احمد سعيد بدوى ( قطع باوتار الرجل )<br />4. احمد عبد المجيد الصعيدى ( عشر غرز و ارتجاج فى المخ)<br />مركز ادكو و رشيد<br />المعتقلين :<br />1. محمد بندق<br />2. محمود هرموشى<br />3. محمد القبلى<br />المصابين<br />1. حسن العزازى<br />2. احمد معتوق( طعن نافذ فى الرئه وفى العنايه المركزة)<br />مركز دمنهور :<br />1. شحاته ابراهيم صقر<br />2. احمد برادة<br />3. محمد مصباح<br />4. حذيفه القويعى<br />5. احمد رشدى<br />6. احمد عبد الكريم<br />7. طارق حشمت<br />8. عمرو كمال<br />9. خميس ابو ريه ( عضو منظمه حقوق الانسان )<br />10. خالد القمحاوى<br />مركز ابو المطامير<br />المعتقلين:<br />1. ايمن ذكرى<br />2. مصطفى الحفناوى<br />3. سلامه ظلط<br />مركز المحموديه<br />المعتقلين<br />1. عادل عبد الوارث<br />2. عمر احمد<br />3. كريم العريان<br />مركز كفر الدوار<br />1. صبحى السقا<br />2. اكرم احمد منصور<br />3. هيثم سعد ( تعذيب)<br />4. احمد رجب عيد<br />5. يوسف جلال<br />6. عبد اللطيف صبحى<br />7. السيد صبحى<br />8. طه احمد طه<br />9. حمدى كمال عيد ( تعذيب و نقل الى المستشفى )<br />10. احمد الفخرانى"
archived = "2007-08-17"
capture_url = "https://web.archive.org/web/20070817045546/http://egyvote.20at.com:80/article.php?sid=30"

