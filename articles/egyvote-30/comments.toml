subject = "خسارة الطوب والزجاج"
author = "ابو حمادة الاسكندرانى"
posted = "2005-11-28"
text = "يف يودع اهالى دمنهور الفقى بالطوب والزجاج..ياخسارة الطوب . كان ممكن يستفيدوا بة فى اى اعمال معمارية..وياخسارة الزجاج. كان ممكن الاستفادة بة بارسالة للحزب الوثنى لتعبئتة بمياة النار استعدادا للانتخابات القادمة واهى تبقى بجميلة ."
archived = "2007-08-17"
