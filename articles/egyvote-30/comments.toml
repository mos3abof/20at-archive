[[comments]]
order = 8
subject = "نتائج الإخوان"
author = "زائر"
posted = "2005-11-21"
text = "لتقرير النهائي للجولة الأولى من المرحلة الثانية<br />13 نائبًا للإخوان.. و41 إعادة في المرحلة الثانية<br />رغم ما شهدته الجولة الأولى من المرحلة الثانية للانتخابات التشريعية من تدخلٍ سافر من قِبَل الحزب الوطني الحاكم مدعومًا من الحكومة لتحويل نتائج المرحلة الثانية لصالح الحزب الحاكم بعد النتائج الكبيرة التي حققها الإخوان في المرحلة الأولى، وتأكيد النتائج الأولية للمرحلة الثانية بأنها تحمل فوزًا كبيرًا لمرشحي الإخوان، ورغم ما شهدته هذه الجولة من استخدام كافة أساليب البلطجة والبطش- مما نتج عنه وجود أول حالةِ قتلٍ في هذه الانتخابات- فإنَّ النتائج جاءت في صالح الإخوان، الذين حققوا المكسب في 13 مقعدًا منها 7 مقاعد بالإسكندرية وحدها، واثنان بالإسماعيلية واثنان بالغربية وواحد بالبحيرة، وواحد بالقليوبية.<br />كما يخوض الإعادة يوم السبت القادم 26/11/2005م بشكل نهائي 41 مرشحًا، معظمهم بمحافظة الغربية والبحيرة والفيوم، وفيما يلي أسماء الناجحين والذين سيخوضون الإعادة ومَن لم يحالفهم الفوز:<br />أولاً: الناجحون<br />محافظة الإسكندرية (7)<br />1- د. حمدي حسن (فئات) مينا البصل.<br />2- حسين محمد إبراهيم (العمال) مينا البصل.<br />3- محمود عطية (فئات) دائرة كرموز.<br />4- صبحي صالح (فئات) دائرة الرمل.<br />5- المحمدي سيد أحمد (عمال) دائرة الرمل.<br />6- صابر أبو الفتوح (عمال) دائرة باب شرق.<br />7- مصطفى محمد مصطفى (عمال) دائرة المنتزه.<br />محافظة الإسماعيلية (2)<br />1- د. حمدي إسماعيل (فئات) بدائرة التل الكبير.<br />2- م. صبري خلف الله (فئات) قسم أول الإسماعيلية.<br />محافظة الغربية (2)<br />1- م. عبد الحليم هلال (فئات) بدائرة سمنود.<br />2- م. سعد الحسيني (فئات) بندر المحلة.<br />محافظة القليوبية (1)<br />1- د. محمد البلتاجي (فئات) عن دائرة قسم أول شبرا الخيمة.<br />م<br />اقرأ بقية التعليق .."
archived = "2007-08-17"
capture_url = "https://web.archive.org/web/20070817045546/http://egyvote.20at.com:80/article.php?sid=30"

