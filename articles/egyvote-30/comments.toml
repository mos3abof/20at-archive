[[comments]]
order = 10
subject = "ديل الديموقراطية ما يتعدل"
author = "عبد الرحمن جادو"
posted = "2005-11-21"
text = "لطجية الحزب الوطنى هى وجه النظام الحقيقى الذى كان يحاول اخفاؤه بالتعتيم الاعلامى الموجه عبر الصحف القومية العقيمة المليئة باقلام الموالسين وكدابين الزفه , واتجه النظام مستخدما الدجل السياسى والشعوذة الاعلامية ودعمهم بالخطاب الديموقراطى الذى يتعامل به مع المواطن عبر اليات حديثه للديموقراطيه الا وهى السنج والمطاوى والسيوف ويرجع الفضل فى ذلك الى السادة البلطيجة ,هذا النظام الذى انتقل من تجنيد حملة المباخر والموالسة الى حملة السيوف والسنج وتلك هى دعائم الديموقراطية, تلك الديموقراطية التى يقوم بها بلطجية مصر لنقدمها الى بلطجية العالم ممثلة فى امريكا والغرب الذى لا يكل ولا يمل عن انتقادنا فها نحن نرسى قواعد ديموقراطية البلطجة تلك التى اقتاد بها حكام مصر بحكام امريكا واسرائيل , بل ارى ان ما يناله شعبنا لا يقل ضراوة عما يلقاه شعوبنا العربية المحتلة , يبقى ان اوجه رسالة لهذا النظام , رسالتى اقرنها بدعوات المظلومين والمعتدى عليهم ,رسالتى اقرنها بدعاء الألاف من ابناء دمنهور ,اقرنها بدعوات كل من سلبت ارادته على يد بلطجية مصر ,رسالتى اقرنها بمشاعر الساخطين من ابناء الوطن ,بمشاعر ابناء الدقى ومدينة نصر ودمنهور , رسالتى الى كلاب السلطة تلك الرسالة هو ان ندعوا كما دعى نبينا صلى الله عليه وسلم اللهم انا نشكوا اليك ضعف قوتنا وقلة حيلتنا وهواننا على الناس انت رب المستضعفين وانت ربنا الى من تكلنا الى قريب يتجهمنا ام الى عدو ملكته امرنا , اللهم ان لم يكن بك علينا غضب فلا نبالى ."
archived = "2007-08-17"
capture_url = "https://web.archive.org/web/20070817045546/http://egyvote.20at.com:80/article.php?sid=30"

[[comments]]
order = 11
subject = "الحزب الوثني الديقراطي"
author = "زائر"
posted = "2005-11-22"
text = "لحزب الوثني الديمقراطي<br />الحزب الوثني الديمقراطي<br />دايما عالي عالي مقامه<br />لكن سلوكه دايما واطي<br />الحزب الوثني عديم الذوق<br />يلعب تمللي ف الصندوق<br />بيسجنني وانا المسروق<br />وان قلت لأ أبات مشنوق<br />أو اعيش وانا حالق شنباتي<br />الحزب الوثني كلام ف كلام<br />مشروعه عبادة الأصنام<br />متعهد حفلات حكام<br />بيسوقنا زي الأغنام<br />وريحته أسوأ من شراباتي<br />الحزب الوثني ف كل مكان<br />من مراكش لباكستان<br />وعنيه ف كفاية والإخوان<br />مرة دخلت البيت نعسان<br />لقيته قاعد ويا مراتي<br />الحزب الوثني قليل الدين<br />محتلنا زي فلسطين<br />خلى عيشتنا زي الطين<br />وجنوده داخلين حطين<br />ساعة ما يواجهوا مظاهراتي<br />الحزب الوثني جمل وهلال<br />يكسب برجال الأعمال<br />نحاوره يدخل فينا شمال<br />وسرقة الصوت عنده حلال<br />من أحيائي ومن أمواتي<br />عبدالرحمن يوسف<br />www.arahman.net"
archived = "2007-08-17"
capture_url = "https://web.archive.org/web/20070817045546/http://egyvote.20at.com:80/article.php?sid=30"

