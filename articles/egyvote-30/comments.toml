text = "خير ظهر الحق فعلي الرغم من التصريحات الرنانة للدكتور مصطفي الفقي بانه لن يقبل منصب بالتزوير الا ان الواجب الذي قام به الوطني والامن من الدكتور الفقى كان بصراحه اكبر واجب من جرعات القتل والاختناق نتيجة القنابل المسيلة للدموع . ولكن الله لا يضيع اجر من احسن عملا حتي ينجح الدكتور جمال حشمت باكتساح منقطع النظير حيث حصل حتي الان على 26 الف صوت مقابل 5 الاف فقط المكرمين من الوطني الحبيب"
