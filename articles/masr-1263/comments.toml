[[comments]]
order = 8
subject = "الصورة حقيقية بس مش هى المشكلة الوحيدة"
author = "ياسر ابو عمار"
posted = "2006-12-09"
text = "الصورة المرفقة اعتقد انها بالفعل حقيقية واذكر -والله اعلم-انها لاحداث جامعة عين شمس السنة الماضية لما تم الاعتداء على احدى الطالبات من جانب محمود عبد اللطيف قائد الحرس ،واعترض الطلاب وخلال وقفتهم امام مقر قيادة الجامعة -اقصد ادارة الجامعة يعنى -ما هو انتم عارفين انه لم يعد هناك فارق الان بين الجامعة والامن ،المهم ما اريد قوله انه ليست الازمة فى الصورة او الاعتداءات التى اصبحت جزءا رئيسيا فى سيناريو حياتنا اليومية بل الازمة فى استكانتنا العجيبة والمريبة نحو ما يحدث .هل تتخيلون انه يمكن ان يحدث اى اصلاح من اى نوع فى ظل هذا الهوان والقابلية للتلطيش التى تحدث مئات المرات يوميا ؟اعتقد انه صعب قوى."
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 9
subject = "نضفوا خرابة العروبه .. طيب رشوها مبيدات ..."
author = "إبن بهيه"
posted = "2006-12-09"
text = "شكرا يا أحمد على هذا المقال .. كلامك صح .. كلنا بنحييك على قدرتك على الكتابه وهروبك من قاعدة الكلب ، التي أرى أنها لم تتغير شكلاً وإن تغيرت موضوعاً فصار لدينا عواء يملأ الدنيا في روزاليوسف ودار الهلال وغيرها من الصحف الحكومية بعدما رموا فيها سلالة جديدة من الكلاب التي ربوها في لاظوغلي من أمثال رزق وعبدالله كمال وجبر والدقاق وكل النباحين اللي زيهم وحتى اللي هربوا من القفص أو بالأحرى رموهم بره القفص كعادل حموده وغيره وغيره .. إذن الشكل الكلابي للقاعده موجود والحالة الكلابيه موجوده وماليه الدنيا نباح برغم موت المضمون في العصر الكلابي الذي نحياه .. عصر مبارك الواطي الماسوني .. كثرة الكلاب التي تنهش في جسد بهية جعل المواضيع كلها عاديه حقاً ولكن الغير عادي هو ما سيأتي قريبا جداً حين يعض البني آدمين من أولاد بهيه كل الكلاب ديه وعلى رأسهم الكلب الكبير الوولف المسعور المزعور اللي ساكن في خرابة العروبه .. عارفه يا أحمد ... أيوه .. هو ده ابن الـــ ...... هو سبب حالة السعار اللي ماليه البلد من تلاتين سنه ...<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

