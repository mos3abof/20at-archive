[[comments]]
order = 5
subject = "أنظروا إلى الصورة"
author = "شوفوا الصورة وأنتم ها تعرفوا إيه السبب إللى مخلينا كده شوفوا العسكرى بيضرب كام واحد وكلهم واقفين رغم أنهم لو تجمعوا عليه ها يقضعوه حتت لكن الإستضعاف هو إللى مخلينا كده وهو إللى طمع الفسدة يعملوا فينا كده الشعب أكثر منهم وهو صاحب الحق فى بلده دول ملهمش شرعية فى الحكم نتيجة للتزوير فى إنتخابهم ونتيجة لرفض الشعب ليهم يبقى الدور علينا أحنا علشان نتحرك ونرفض الفساد شوفوا حسن نصر الله والمعارضة فى لبنان بتعمل إيه لمجرد إنتهاك حقوقها فى البرلمان وشوفوا الشعب كله بينتهك حقوقه وتيجى واحدة بجحة مجنونة زى الدشم \"سوزان خره\" علشان تحبط الشعب وتقولهم مفيش فايدة ونعم لإستكمال مسيرة النهب والفساد وهية ها يهمها إيه لاهى مصرية ولا يهمها مصر كلها إلا لنهبها هى وعيلتها كلهم يا جماعة دول زبالة معفنة ولازم تتكنس من مصر قاعدين مستنيين إيه تشموا رحتهم المعفنة وتهشوا الدبان إللى عليهم أصحوا وأخرجوا للشارع هو ده الحل الوحيد الشــــــــــــــــــارع لرفض الفساد والإعتراض بصوت عالى وفضح فسادهم إن الله لا يغير ما بقوم حتى يغيروا ما بأنفسهم"
posted = "2006-12-08"
text = "لو سمحتوا محدش يعبر الولية المجنونة إللى إسمها دشم وفاكراننا مش عارفين إسمها الحقيقى"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

