[[comments]]
order = 11
subject = "ياريتك ما كتبت يا احمد"
author = "فارس_fr"
posted = "2006-12-09"
text = "بالرغم من ان مقالك ممتاز وفكرنا بحقائق كتييير هى مش غايبة عنناالا انه محبط شوية ,,, متتصورش قد ايه تعبت لم شوفت الصورة لو نلاحظ ان عسكرى واحد بيضرب في مجموعة من الشباب اللى خايف منه جدا والظاهران بقيه العساكر قاعدة تهوش من بعيد وخايفين ينزلوا ارض الجهاد ,, يا ترى العيب في مين فى مبارك ونظامة وعساكره ولا فى الشعب اللى راضي بكل حاجة وسكات شوفوا لو كل واحد حط اخته ولا امه ولا اخوه حتى مكان الشخص اللى بينضرب ده تفتكروا كان هيعمل فى العسكري ايه بيتهيالى انه كان هياكل العسكرى ,, كل واحد بيقول يلا نفسي ,, لك الله ياوطن .<br />كلمة حق للدشم الواطية اللى كل يوم تطلع لينابتعليق وتهرب من المواجهة ,, ابنك لن يكون رئيسا لمصر وان شاء الله هتخرجوا منها زي ما دخلتوا يا كلاب البلد ,,,,,<br />لا للتوريث ولا لاستكمال المسيرة"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 12
subject = "بلال ...والجتة الحلال"
author = "مستعد"
posted = "2006-12-09"
text = "إيه ياحاج أحمد بلال ... ما كانشي العشم منك ولا كان العشم فيك... الصورة دي اللي لطعت تحتها مقالك الناري وفي رواية أخرى النارينج .. لوكانت في إيد واحد تاني ربع وزنك كان قلب بيها الدنيا أو حتى قلب السرير اللي نايم عليه... صورة زي دي في الفصيلة يعني خدها المرحوم مصطفى كامل وهو بكامل عياه وضعفه ووحدته وطار على برة وفضح الانجليز وصحا الانايمين كلهم... لكن انت وما أدراك من أنت المدجج بىلات التيكرز والفاكسات وقلمين وخالتي فرنسا وغيرها لا ينوب هذه الصورة إلا مقال عيان أكتر من العيا اللي كان فيه مصطفى كامل ... لا ياحاج أحمد بلال ..إنت الرسالة وانت الأمانة وأنت القلم وانت الحجة وأنت الصحوة وأنت المنبه وأنت الموقظ لهمم الناس والشعب الأهطل اللي بيشم بانجو من غير بانجو ... شفت ياباشا لبنان وجمال لبنان وحلاوة لبنان ..مئات الألوف بإشارة واحدة يتجمعوا ويحتشدوا ويعتصموا ..وبغشارة واحدة يصلوا ورا واحد على غير مذهبهم علشان يثبتوا الوحدة وعلى الجانب الاخر تحتشد الحومة والسنيورة ووراهم حكومات وسنيورات وورا اللي وراهم حكمة السيد الرئيس ان اللي بيحصل ده من حكيم لأن حكيم راح الأمم المتحدة يغني لنوبل ... شوف الحراك ..مش انت بتحرك رجليك وتفتكر ده الحراك ... سيبك من حكاية التهديد دايما بالانقطاع عن الكتابة لأن ده معناه الاندفاع ورا خالتي فرنسا ومهرجان السيما وبحب السيما... عمر ما مصطفى كامل هدد بالانقطاع ابدا ولا احمد عرابي ..فعيب لما ينقطع الحاج احمد بلال عن تبليغ الرسالة وعن تأدية الأمانة وعيب لما يتركنا على محجة سوداء ليلها كنهارها ...نهارك ابيض ..تعالى خد لك بق شاي"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 13
subject = "حزين بحق"
author = "قلم جاف"
posted = "2006-12-09"
text = "حزين بحق عندما أجد من لا يزال يدافع عن البيروقراط وسيطرتهم على الاقتصاد وأحوال العباد ..<br />هل هي مازوكية وتلذذ بالتعذيب؟ من باب :<br />حقك على عيني..<br />يا \"بيه\" يا نور عيني..<br />لجل الوفا بديني..<br />اسرقني تاني كمان..<br />خربوا المحلة الكبرى وقعدوا على تلها ودفعوا العمال المسالمين للإضراب.. وفي الوقت نفسه هناك كتاب يدافعون عن ملكيتهم لمصر والمصريين!<br />لماذا لم يصرخ أحد في الصحافة عن التحالف بين اليسار والبيروقراط والتوافق بينهم على استمرار بقاء القطاع العام كله عزبة بيروقراطية يديرها موظفو الحزب ، بينما اتفتحت الجاعورة قد كدة على مجرد توافق في مسألة واحدة بين الإخوان ونفس الحزب البيروقراطي..<br />تجربة صغيرة : ادخل إحدى اقطاعيات القطاع العام .. يمكن تغير رأيك..<br />وسك على البك!"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 14
subject = "الكلاب والمستضعفين"
author = "عبد المنعم المصرى مقيم بالمهجر"
posted = "2006-12-09"
text = "منذ بدات اطالع ما يكتب هنا .فى النهاية توصلت الى حقيقتين وارجو انلا يغضب احد منى . الاولى انه بالفعل هو تشخيص سليم 100% واصبح لا يخفى على احد لا فى مصر ولا خارجها والحقيقة الثانية والمرة فى نفس الوقت اننى لا حظت انه لا يوجد بالفعل من يريد التغيير بمعنى ان الكل ينتقد بدون حراك فعال .. واعتقد اننى ذكرت هنا منذ فترة ان الحق لا يوهب لصاحبه ولكن على صاحب الحق انتزاعه بالقوة وما اكثر وسائل القوة المتاحة . اولا ان النظام يعرف جيدا طبيعة المصريين وكثيرا ما يدغدغ عواطفهم بحجة ان القرار يجب ان يكون من الداخل ؟ ولا ادرى عن اى قرار يتكلمون ؟؟ يعنى التغيير من الداخل لكن اكتشفت انه لن يحدث تغيير لا من الداخل ولا من الخارج فالمسالة مصالح وبس وبمعنى شيلنى وأشيلك .. كيف هذا ؟ النظام لم يستشعر فى اى لحظة وجود رغبة حقيقية ممن يعترضون على تصرفاته وبالتالى فهو مستمر فى تحدى كل من يتكلم ويعترض سواء بالتهديد والوعيد وهو ما يحدث حاليا وسواء باستقطاب المعترض لو كان ذو اهمية معينة وبعرض بعض الفوائد الشخصية حتى يخرس لسانه وينضم الى حظيرة المؤيدين او على الاقل ينسحب من المواجهة ويربى اولاده احسن من غيره وستستمر الساقية فى الدوران الى مالا نهاية .. وانتظار تغيير من الخارج فايضا كونه مرفوض شكلا وموضوعا من المصريين فان فى الخارج من عرف طبيعة المصريين من خلال احاديث وتطمينات المسؤولين عن البلد بان المصرى املا له بطنه او جيبه يكون وديعا وبالتالى حتى من لم يعرف المصريين نتيجة سوء ادراكه اصبح يفهمهم من مصرى آخر وعليه يستخدم الخارج بعض من يعتقدوا انهم محظوظون برضى الخارج عليهم وهذه خدعة كبرى يقع فيها من يتعامل معهم وربما يدرك حجمه الحقيقى فى نظر هذا الخارج واعنى به<br />اقرأ بقية التعليق .."
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 15
subject = "إلى الأستاذ عبدالمنعم - المصري مقيم في المهجر"
author = "إبن بهيه"
posted = "2006-12-09"
text = "كلامك صح طبعا .. بس الناس اللي انسحقت سنين وسنيت تحت جحافل مصاصي الدماء من قوات الأمن وبوبيهات مبارك الواطي الماسوني يلزمهم وقت عشان يفوقوا من حالة الإغماء التي يعيشونها والكلام اللي حضرتك شايفه هنا برغم مرارته إلا إنها مرارة رائحة النشادر الكريهة حتى يفوق الجميع ويستيقظوا من حالة الإغماء تلك ... صبرا أخي عبدالمنعم .. غدا لناظره قريب وأقرب مما تتصور سيثور الشعب كله على ذلك الائن العميل الذي باع البلد هو وعصاباته للصهاينة ... بس الكلام في البدايه مهم زي عمنا الفاجومي ما قال<br />دور يا كلام على كيفك دور .:. خل يبلدنا تعوم في النور .:. ترمي الكلمه في بطن الضلمه .:. تحمل سلمى وتولد نور .:. يكشف عيبنا ويلهلبنا .:. لسعه بلسعه نهب نثور ... دور يا كلام على كيفك دور .. دي بداية الفوقان في أي بلد يا أستاذ عبدالمنعم .. ربك ييسرلنا الحال ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 16
subject = "عايزة تربى ابنها"
author = "مصريةمهمومة"
posted = "2006-12-09"
text = "تحياتى استاذ بلال<br />ذكرتنى بايام احاول ان انساها ايام من الظلم والاضطهاد دون سبب فبعد ان تم لهم ما ارادوا فى انتخابات الاتحادات الطلابية رجعت لمسئولة منهن وسالتها عن سبب ما يحدث من رفض لاستلام الاوراق واعاقات واهية من نوعية الختم مش واضح اختم تانى وصور تانى وكدة<br />قالت السيدة المسئولة وانا مالى ده سياسة دولة اتهمتها بانها مسئولة بتكييف تلك السياسات لما يرضاه ضميرها فقالت وانا مالى انا عايزة اربى ابنى روحى انتى غيرى السياسات ده فتسائلت صديقة مع امن الدولة يعنى فقالت لالالالالاالامر اكبر من ذلك مع الريس وذهبت بعد ان طلبت منها تحدد لى ميعاد<br />بس بصراحة احنا نستاهل اكتر من كدةمادمنا نسكت على ضياع حقوقنا"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 17
subject = "إلى مصرية مهمومة"
author = "أحمد بلال"
posted = "2006-12-10"
text = "شكرا لكل من علق على الموضوع<br />شكرا أستاذة مصرية مهمومة<br />كل ما ستناليه من طلب تحديد الموعد هو اتهام من أمن الدولة بمحاولة قلب نظام الحكم<br />أو رصاصتين بتهمهة إنك حاولتي تزعجي سيادته<br />مصريه مهمومة و أعتقد أننا كلنا في الهم سواء<br />لا يستأذن عبد من قيصره حين يريد ثورة<br />هذا هو الحل"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 18
subject = "يكفينا قول لا اله الا الله محمد رسول الله وحسبن الله ونعم الوكيل"
author = "ربنا يستر"
posted = "2006-12-10"
text = "بسم الله الرحمن الرحيم<br />\"قل نار جهنم اشد حرا \"<br />\"يوم يعض الظالم على يديه \"<br />صدق الله العظيم<br />خلى اللى ينهب ينهب ويقول يا ريت بس المصيبه ان اخنا هنتحاسب على سكوتنا لان السكوت علامه الجبن فى ظل هذه الظروف"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 19
subject = "شكرا استاذ احمد"
author = "مصرية مهمومة"
posted = "2006-12-10"
text = "لا يستأذن عبد من قيصره حين يريد ثورة<br />هذا هو الحل<br />تلك كلماتك<br />ولكن هل يرى احد ان الثورة او حتى الكلام سيفيد فى شعب نام ويحلم فى نومه بعصا الجلاد........<br />سيدى تكلمت كثيرا وكانت النتيجة الوحيدة هى انى اكاد افقد احلامى مرات ومرات....<br />تحياتى للجميع<br />مصرية مهمومة"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 20
subject = "فاضل خطوة"
author = "أحمد بلال"
posted = "2006-12-10"
text = "أستاذة مصرية مهمومة<br />ياريت تتابعي أخبار إضراب 27 الف عامل بالمحلة عشان تعرفي إننا لسه صاحيين<br />و فاضل على النصر خطوة"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 21
subject = "ايجاز هايل يا احمد..و هل ممكن يا روضه"
author = "نيفين نيفى نوفا"
posted = "2006-12-10"
text = "انا شايفه ان مفيش ايجاز و لا تلخيص لوضعنا الهباب على راى البراء الا البرجراف الاخير من المقال<br />و بقول لروضه هل لسه عندك امل<br />يعنى ممكن انا كمان اقول<br />اذا الشعب يوما اراد الحياه فلابد ان يستجيب القدر<br />و لابد للظلم ان ينجلى و لابد للقيد ان ينكسر<br />الابيات دى قالها شاعر مات ف عز شبابه لانه لو كان كمل مكنش قالها<br />اقولكم نحاول نتفاءل<br />و دى فرصه اسلم على روضه و اقولها صباح الخير ان كان صباحا او مساء الخير ان كان مساءا"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 22
subject = "أنظروا كيف"
author = "أطفال مدارس صغيرين قابلتهم المذيعة فى أعتصامات لبنان وسألتهم أنتم جايين المظاهرات ليه قالولها جايين نسقط السنيورة ومش عايزين امريكا ولا إنجلترا تحكمنا"
posted = "2006-12-11"
text = "ياريت نشوف قيادات مصر الشريفة ها تقول إيه لما المذيعة تقابلهم فى وسط الفساد إللى الشعب غرقان فيه ده وفى وسط السجود لإمريكا واليهود والتسبيح بحمدهم وفى وسط حاكم قاتل فاقد للشرعية لتزويره لكل الإنتخابات وفى وسط مجلس شعب لا يضم إلا الفسدة وتجار المخدرات وفى وسط بيع مصر لليهود وبيع المصانع والشركات وهى أملاك الشعب وفى وسط البطالة وعايز بمنتهى البجاحة يورث الحكم لإبنه الشاذ القذر ولا مراته إللى نهبة مصر وقال بيدوها جايزة لحقوق الإنسان والنبى دى عايزة شبشب فوق دماغها وصفية زبالة تتحط فيها هى وعيلتها كلهم الله آمين<br />ياترى ها نستنى كثير حسن نصر الله المصرى"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 23
subject = "حاجه عجيبه"
author = "المهاجر"
posted = "2006-12-11"
text = "لما ذكريا باشا عزمى بيقول الفساد بقى للركب وهو فى بؤرة صنع القرار واتخاذه ومراقبته فماذا فعلت طيلة هذه السنوات يا معالى الباشا الكبير قوووووووووى انتم بتضحكم على مين علينا ولا على انفسكم ولا هوه مجرد شىء لزوم الشىء وسلملى على الديوان<br />حاجه تقرف يقتل القتيل ويمشى فى جنازته"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201345/http://masr.20at.com:80/article.php?sid=1263"

[[comments]]
order = 24
subject = "دمااااااااااااء رخيصة"
author = "عمرو المصرى"
posted = "2006-12-13"
text = "موضوعك جميل جدايابلال بس ياريتالناس تفوق قبل فوات الاوان واللة انا خايف فى يوم من الايام نعانى مئسات لبنان او فلسطين او او لازم نقول لا لازم ضميرنا تصحى ياريت منخفشى من القدر فا القدر من عند اللة وليس من عند مباااااااااارك الحيوان الى بيبيع ارضو عارضو زى عوااااااااااد فوقو يناس عواد باع ارضو احزان مواطن مصرى"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214429/http://masr.20at.com:80/article.php?sid=1263"
