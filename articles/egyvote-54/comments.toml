[[comments]]
order = 0
subject = "أول متطوع"
author = "أول متطوع"
posted = "2005-12-07"
text = "ا شباب انا قلتها قبل كده مليون مره .. الكلب إبن الكلب حسني مبارك وشوية المعرصين اللي معاه زي الشاذلي وصفوت الغير شريف (المعرص بشهادة دولية) وكل الخولات مش هيسيبوا الحكم إلا بالدم .. والله ما هيحرر مصر من الكلاب دول غير الدم .. مبسوط يا حسني يا إبن العرص .. منين الملايين دي يا إبن الكلب .. أبوك كاتب جربان كان بيقف قدام المحاكم يكتب عرايض .. وعايزينه يسيب الحكم .. أحه ... عشم إبليس .. الكلب ده مش هيمشي غير على جثث المصريين وخلونا نشوف .. قال ديموقراطية إبن الشرموطه .. شوية خولات حاكمين البلد وبيساعدهم شوية الخولات بتوع الداخلية .. وخلصنا .. والله ما فيه فايده غير الدم .. الدم .. الدم .. يالا يا شباب مصر لو كنتم عايزين بجد تعيشوا في حريه .. لازم مصر تولع عشان تهروها من الفساد والتعريص واللي يموت يموت .. واللي يعيش بعدها يبقى بكرامه .. كفاية مسخره ... كسمين أمك يا حسني مبارك يا عرص وكسمين أم الخول بتاع الداخلية حبيب الخولات ... انبسط بقى يا حسني .. عايزها كده ؟ خليها دم في دم لما نشوف آخرتها مع كسمين أمك يا إبن الزانية ..<br />awalwahed11@hotmail.com"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044008/http://egyvote.20at.com:80/article.php?sid=54"

