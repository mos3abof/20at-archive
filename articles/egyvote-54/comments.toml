text = "لكلام ده لابن الكلب المتناك اللي بيغلط في سيده حسني مبارك. يابن الجزمة الخول ده سيدك اللي حاميك وقانيك ومن غيره زمانك انت واللي زيك بتتناكوا من الامريكان......لم نفسك وكسمك وكسمين اللي يغلط عليه \"<br />ديه رد كلام واحدسافل وضيع لكن لو عنده ابسط درجات الاحترام يعرف ان حسنى مبارك جرثومة لابد من سحقها وكل من ولاها وخاصة هذا الشخص الوضيع السافل المنجط<br />لكن اكرر اكرر اكرر لا بد من اغتيال حسنى مبارك ولابد من التحرك بسرعة"
