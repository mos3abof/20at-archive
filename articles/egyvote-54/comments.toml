subject = "ابن كلب مين اللي بيغلط في سيده حسني مبارك"
author = "مصري بجد"
posted = "2007-01-19"
text = "لكلام ده لابن الكلب المتناك اللي بيغلط في سيده حسني مبارك. يابن الجزمة الخول ده سيدك اللي حاميك وقانيك ومن غيره زمانك انت واللي زيك بتتناكوا من الامريكان......لم نفسك وكسمك وكسمين اللي يغلط عليه"
archived = "2007-04-11"
capture_url = "https://web.archive.org/web/20070411105346/http://egyvote.20at.com:80/article.php?sid=54"

