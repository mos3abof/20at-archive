posted = "2006-04-26"
text = "يا جماعة يا ريت نقرأ تاريخ كويس ونعرف مين الناس اللى احنا نقدرهم ..<br />سؤالى : هل أضافت حركةالاخوان المسلمين شيئا للاسلام ؟<br />والله الذى لا اله الا هو لقد سمعت بأذنى من ينتسب الى تلك الجماعة وهو يحاول ان يثنى أحد الأخوة عن اطلاق لحيته ويقنعه بشتى الطرق أن يقوم بحلقها ... فهل ذلك يرضى الله ورسوله ؟؟ ولا حول ولا قوة الا بالله العلى العظيم"
