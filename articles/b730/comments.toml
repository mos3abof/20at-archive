subject = "مش عايز احب محبوباتكم"
author = "ابو سارة"
posted = "2006-07-31"
text = "ازاى نبحث على الحق *طبعا مش عارفين *ليه -احنا لما نشوف ممثل ادى دور فساد و اغراء ثم حصل على الشهرة -مفيش احد ينتقد او حتى ينسحب من ساحة الفساد -لا احنا نصف صاحبها بالنجم و نقدسه و كاننا لا نملك فى قلوبنا حب تغيير المنكر و دلك اضعف الايمان -فحبدا لو نترك تعضيم عادل و عبيد و الجندى و يسرا و غيرهم ممن اباحوا لانفسهم لقطات المخجلة باسم الفن و ليكن فى قلوبنا محبة العلماء و الصالحين فهؤلاء هم النجوم لو كنتم تعلمون....."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130418/http://www.20at.com/article2.php?sid=730"

