[[comments]]
order = 9
subject = "براحة"
author = "أم عزت"
posted = "2006-10-23"
text = "السلام على من أتبع الهدى وامن بالله و رسولة<br />واحدة واحدة على البنت يا جماعة هي ممكن تكون مش عارفة ممكن تكون بتسمع الكلام اللي بتقال لها عنافي الكنيسة<br />بس يا قبطية انتي عرفتي الإسلام عشان تقولي إننا في وهم<br />انت حتى متعرفيش المسيحية<br />عموما مشكورة على شعورك انك تدعي لنا و انا كمان بادعيلك و ربنا يا رب يهدينا جميعا للحق و يثبتنا عليه"
archived = "2006-11-02"
