[[comments]]
order = 0
subject = "عن أى منتقبات تتحدث"
author = "بيبو"
posted = "2006-10-22"
text = "بص يا عم شرارة انتا عرضت الموضوع بشكل حيادى لحد كبير ورائع تحسد عليه .. ماشى<br />انما بقى نص .. لا تلت تربع المنقبات اللى ما شيين فى الشارع والله عازين الحرق<br />\" انا مش ضد النقاب \" انا والله بموت فيه ويكفى اننى لن ارتبط الا بمنتقبه بأمر الله<br />ولكن هل من تمشى مكشوفه الايدى أو القدم او يغطى نقابها مجرد رقبتها \"وبالذات لو كان مزركش ولامع ولافت للنظر \" أو نص وجهها باين او خطها 2 كيلو مسكرة وكحل فى عينيها أو تأخد اى صورة من صور التبرج .. وهذا بالمظهر والادهى هو انعدام الحياه فتجد صوتها عال بداع وبدون داع و تختلط بسفور بالرجال بحاجة وبدون وهؤلاء ليسوا منتقبات ورب الكعبه<br />لانها لاتعلم قدر التاج الذى يغطيها<br />فان كنت تقصد هؤلاء فهم لايستحقون سوى الدعاء لهم بالهداية لانهن ضالات مضلات ..<br />اما من تلبس النقاب الصحيح \" مش شرط الاسود .. انا مش سلفى ولا طايقهم ! المهم انه يكون بلون داكن مش ملفت ويغطى جسدها كله .. وتعلم انها كذلك تستحق ان نطلق عليها تسير على درب أمهات المؤمنين .. لتحشر معهم .ز ولعن الله كل من قال على النقاب انه عادة بدوبة او ليس من الاسلام .. فاخلاف بين وجوبه واتسحبابه مش انه بره الاسلام .. ماعلينا ..<br />فإذا كنت تقصد الصنف الثانى فهم يستحقون منا كل احترام ام الصنف الاول فهم يستحقون منا ضرب النعال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123239/http://www.20at.com/article2.php?sid=1380"

