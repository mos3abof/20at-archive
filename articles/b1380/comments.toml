[[comments]]
order = 3
subject = "تعم حقوقهن مهضومة"
author = "رنا"
posted = "2006-10-22"
text = "ارى بالفعل ان حقوقهن مهضومة خصوصا ان كانت مقرونة بآراء احدى فقيهات الازهر بخصوص النقاب والتي اعتبرته انه لا ضرورة منه لان التقاب يجعل البعض بستغله من اجل بعض الاغراض الغير شريفة..ناسية ان الخطأ ليس في النقاب وانما من اتخذه ساترا لتلك الاغراض.<br />بالنسبة لي لا مشكلة لدي اطلاقا مع المنتقبات بل على العكس احيانا كثيرة بت اعتقد ان النقاب هو الحجاب الشرعي وليس فقط غطاء الرأس والجسد.<br />والله الموفق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123239/http://www.20at.com/article2.php?sid=1380"

