subject = "الحمد للة"
author = "السيد مرسي مخيمر"
posted = "2006-10-22"
text = "الحمد للة فانا ار نسبة المنقبات في ازديات والحمد للة وكذالك الشباب اللذين اطلقوا اللحي اما موضوع ان هناك منقبات اخلاقهم ليست بمستوي النقاب فلعيب ليس في النقاب بل فيهم فالامام علي رضي اللة عنة يقول - اعرف الحق تعرف اصحابةفلابد من المنادة بتحسين اخلاق المنقبات الاتي ليسوا علي خلق بدل من نزع النقاب واللة الموفق"
