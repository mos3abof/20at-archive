subject = "الى كل من علق بالايجاب او الرفض"
author = "فتاة مصرية"
posted = "2006-10-25"
text = "انا لا اعرف لماذا جميعكم منشغلين بهذه القضية الىالدرجة هذه سواء (النقاب او الخماراو اللحية اوالحجاب او الجلابية البيضاء ) اذا كانوا فرض او سنة او ليست حاجة من الاصل او عادة سواء بدويةاو اوربية انا كمصرية مسلمة من وجة نظرى ان كل فرد يعمل اللى هو شايفه صح عن طريق ثقافته الدينية سواء من القرآن او من كتب اخرى او عن طريق المفتين وكل فرد يعمل اللى شيفه صح ولاينظر لغيره وكل فرد يبقى فى حاله وليس له علاقه بغيره من الافكار وهذا الكلام هو الذى امشى به فى حياتى عموما ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123239/http://www.20at.com/article2.php?sid=1380"

