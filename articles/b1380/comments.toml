subject = "الى رافض"
author = "مسلم مصرى"
posted = "2006-10-30"
text = "بص ياعم رافض الموقع دة بتاع اخوان سلفيين بتوع السعودية ودول ولاد ستين كلب كل كلامهم كذب وعاوزين يدسوا السم فى العسل مش عارف واحد لبست النقاب حست براحة واتانية بتتكلم عن الملايكة المنقبات والاشرار من بقية البشر وواحد بيفتى ان المهم انها تكون لابساة غامق وغيرة وغيرة هيا موجة وعدت على مصر قبل كدة كتير والبهوات مسيرهميزهقوا من التشدد المتخلف بتاعهم دة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123239/http://www.20at.com/article2.php?sid=1380"

[[comments]]
order = 17
subject = "الحمد لله"
author = "طالبة ازهرية"
posted = "2006-10-30"
text = "اولا السلام عليكم ورحمة الله وبركاته<br />ثانيا انا والحمد لله منتقبة ولا اجد فى النقاب اى صعوبة اما بالنسبه الى خلق المنتقبة فانا من رأى ان اولا تكون انسانة على خلق وعلى قدر احترم ماتضعه وان تكون حفظة كتاب رب العالمين وان يكون يديها وكل جسمها ماعدا عينيها متغطين فهو فعلا النقاب هو اللبس الشرعى الذى يجب على كل مسلمة اتباعة ففيه تشعر المرأة بالثقة بنفسها وان لاحق لاحد ان يراها الا محارمها فقد فهى محرمة الرؤيه للرجال الاجانب عنها فالنقاب ليس بغمامة ولا بجهل فهو زى فيه صون لكرامة المرأة ومحافظة عليها واخيرا احمد ربى اننى كنت لابسة النقاب فى الاول باذن والدى ليس باقتناع كامل منى اما الان فقد عرفت مكانة النقاب والحمد لله وشكراااااااا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123239/http://www.20at.com/article2.php?sid=1380"
