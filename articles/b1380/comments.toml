[[comments]]
order = 10
subject = "الى قبطية"
author = "عاوزك معانا فى الاسلام"
posted = "2006-10-23"
text = "فكرى كمان مرة فى دينك علشان انا كمان عاوز لكى الهدايه<br />مش عاوزه لينا لهدايه واحنا كمان بنحب كل الناس وعايزنك معاناز<br />بس خدى بالك ان ممكن العمر ينقضى وانتى بتعبدى بشر وخايفه تفهمى معنى الاهوت علشان الكنسية بتقولك انه سر من اسرار الرب وكمان نفسى تبطلوا حقد على اليهود مش هما اللى صلبوا المسيح _(الشبيه عندنا)_ علشان يخلصوكم من الخطايا هما عملوا كده علشان هو عاوز كده مش برضه اله مغلوب على امره مش قادر يخلص العباد من ذنوبها الا لما اليهود يعملوا فيه كده<br />صح الكلام ياست قبطيه و لا انا جبت حاجه من عندى كله من عندكم و حته الصليب ديه كفايه بقى لانى المسيح لم يامر بعبادته ولكن قال ايه شايف الملك شاف فى المنام المسيح وبيقول له اعبد الصليب خليه طريقك من امتى الرويا بتعتبر امر للدنيا كلها<br />صحصحى و اعى تعملى نفسك مش وخده بالك من التحريف اللى عندكم وخليكى فى دينك لغايه لما ربنا ياذن ان يهديك يارب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123239/http://www.20at.com/article2.php?sid=1380"

[[comments]]
order = 11
subject = "النقاب والحجاب"
author = "رافض"
posted = "2006-10-23"
text = "النقاب والحجاب والبالطووكل هذه المظاهر التي تسمى اسلامية ليس لها علاقة بالانسانية , انها ببساطة تعني ان المرأة بضاعة تباع وتشترى كالبطيخ , انها تعني ان المرأة ليست انسان , انها تعني عدم الثقة بالمجتمع الذي يحيط بهذه الفتاة لانهم كلهن وحوش وذئاب ينتظرون الفرصة الملائمة لينقضوا عليها ز انها ليست حرية شخصية على الاطلاق لانها تعني عدم الثقة بالاخرين وفي ذلك تعدي على الاخرين . الايمكن ان يوجد بين هؤلاء الاخرين من هو انسان بمعنى الكلمة ولاخوف منه ؟ ام اننا يجب ان نفترض ان الجميع وحوش بمن فيهم ذلك الرجل الصالح ؟البشرية وصلت الى الفضاء والقمر والكواكب الاخرى , البشرية تفكر بمستقبل الاجيال القادمة بينما نحن لايزال يعشعش في تلافيف دماغنا الحلال والحرام ..والعيب وعدم الثقة والخوف من المجتمع وكان الانسان يجب ان يعيش كما يريد له الاخرون وليس كما يريد هو . كفاكم ركضا وراء الغيبيات والحور العين وانهار الخمر واللبن والعسل . عيشوا حياتكم ودعوا المراة تعيش حياتها .كل هذه المظاهر الحجاب والنقاب و... ليس لها علاقة بالاسلام . ولكن اذا كان هناك من يعتقد انها من روح الاسلام فليتركها ويترك الاسلامالمرتكز على المظاهر والازياء وليس على الروح والجوهر والمضمون . هل تريدون ان تقولوا ان النراة المحجبة هي المراة الصالحة والنقية وان كل من عداها من النساء قذرات والى جهنم ؟ انا شخصيا اعتقد ان العكس صحيح . المجتمعات لاتبنى على الحجاب والتنقاب وانما تبنى على الفكر والثقافة والعلم . دعوا هذه السخافات وعودوا الى عقولكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123239/http://www.20at.com/article2.php?sid=1380"

[[comments]]
order = 12
subject = "الى الاستاذ رافض"
author = "بنت الهيثم"
posted = "2006-10-23"
text = "حضرتك قلت ان النقاب والحجاب مش من جوهر الدين ممكن يكون فعلا النقاب مش من جوهر الدين ويكون فعلا عادة بدوية وذلك بسبب الطبيعة البدوية وطبيعة المكان لكن...... الحجاب لا اعتقد انه مش من الدين والا... ماكنش نزل الحجاب فى الديانات الثلاثة( مش معنى ان المسيحيات واليهوديات لا ترتدين الحجاب انه لم ينزل عليهم والدليل انه لايمكن لهم الصلاة فى الكنيسة او المعبد بدونه كذلك الراهبات اللاتى هن يعبرن عن قمة التدين والروحانية لدى الاخوة المسيحين لابد ان تجدهن مرتديات الحجاب) هذا اول شئ<br />ثانيا حضرتك قلت ان ده يعتبر تعبير عن عدم الثقة فى المجتمع الذى يحيط بنا لان فى ناس فيهم صالحين زى حضرتك مثلا طب احنا كامسلمات هنمشى نقول الاخ ده فاضل والاخ ده سئ .......الحجاب نفسه مش غلط لكن ممكن بعض اخواتى المرتديات للحجاب تنظر له نظرة اخرى كانوع من انواع الموضة اواى غرض تانى غير اللى نزل علشانه ...... كمان علماء الازهر كلهم من زمان قوى قوى ومن قبل الازهر كمان محدش قال انه مش فرض ( انا قلت علماء الازهر لان المفروض ا نهم اهل العلم الدينى اى الذين قاموا بدراسة قواعد الدين والمفروض مانخدش كلامنا او فتوانا الامن العلماء الدارسين)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123239/http://www.20at.com/article2.php?sid=1380"

[[comments]]
order = 13
subject = "أختي لبست النقاب فاقرؤا قصتها .."
author = "عبدالرحمن"
posted = "2006-10-24"
text = "نحن أسرة لم تكن تعرف النقاب أبدا أبدا أبدا ... وأختي كانت محجبة وقد أرادت أن تلبس النقاب مرة واحدة لظرف معين ثم تخلعه ... فلبسته مرة واحدة وعند انتهاء هذا الظرف خلعته وكان الظرف أخذ تقريبا نصف ساعة ... وبعد أن خلعت أختي النقاب أخبرتني عن الراحة النفسية التي شعرت بها عندما لبست النقاب ومدي شعورها بالراحة النفسية والثقة بالنفس وشعورها بالاحترام ... ومع مرور الوقت شعرت أختي بحاجتها للبس النقاب بعد أن شعرت فيما شعرت فيه من أحساس بالراحة النفسية ... مع العلم أننا أسرة لم تكن تعرف النقاب ولم نطالب به ولكنه كان اختيار أختي ... والآن أختي لبست النقاب بعد شعورها هذا ... وكانت والدتي قد لبسته قبلها... النقاب مع الوقت سيصبح مألوفا ويصبح شيئا عاديا بإذن الله تعالي ... وإلي مزيد من طاعة الله تعالي عسي الله تعالي أن يفرج علينا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123239/http://www.20at.com/article2.php?sid=1380"

