author = "مسلم عربى"
posted = "2006-10-22"
text = "السلام عليكم جميعا, مداخلتى هنا ليست للتحدث عن الحجاب,لأن المرأه المؤمنه ادرى بالحقيقه !! ولكني سأذكر حديثآللنبى عليه الصلاة والسلام ينطبق على المدعو بيبو أو ريرى , لايهم !!بعد اعلانه لما اسماه :الوهابيه( وليس الاسم من الاسلام ) ويقصد أهل السنه وكرهه لهم_ قال خير البشر \"وينطق فيكم الرويبضه,قالواوماالرويبضه يارسول الله ؟؟ قال : التافه يتكلم فى أمر العامه\"0"
