[[comments]]
order = 5
subject = "__ الى قبطية مصرنا __"
author = "..& هيكل الأزهرى &.."
posted = "2006-10-22"
text = "السلام عليكم ورحمة الله وبركاتة .. اسلامنا يا قبطية مصرنا اولا غير مسؤول عن تصرف متبعية دا لو انتى تعرفى يعنى ايه دين ويعنى ايه مدينين .. تانى شىء ممكن اعرف حضرتك تقدرى تقولى ايه فى مدى التغالط الموجود فى تاريخ سيدنا المسيح عليه السلام ؟؟ .. تقدرى تقوليلى هل انجيل برنابا دا منكم ولا لا وتاريخ ميلاد سيدنا المسيح اللى مدون فيه زى اللى مدون فى لوقا الإصحاح ولا لاء .. تقدرى تقوليلى لما اناجيلكم - بدون اى تجريح ويعلم الله صدق نواياى- يبقى فيها عدم دراية حقيقية بتاريخ مولد سيدنا عيسى عليه السلام يبقى ازاى هتاخدى عقائد صحيحة منهم ومعاملات ؟؟؟ .. ارجوكى فكرى صح واقعدى بكرة كدا بالليل واقفلى قوضتك عليكى وبصى للسماء وتخللى عن كبريائك وقولى يارب ورينى الحق سواء كان على ما انا عليه او فى اى شىء تانى وبصدق نية إن شاء الله ربنا هيرشدك للطريق الصحيح .. ارجوا من الجميع عدم التعصب دا رأى ليها لا يشمل الا رأيها ومحبش نخليه حديث ساعه ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123239/http://www.20at.com/article2.php?sid=1380"

[[comments]]
order = 6
subject = "الى الاخت القبطية المصرية"
author = "اخ مسلم مصري"
posted = "2006-10-22"
text = "انا مش هعلق على موضوع النقاب لانى ما قرتهوش ومش ناوى لانه حريه شخصية باحته وكل حاجه فيها الحلو والوحش زى ما فى بنات مش لابسه حجاب وكويسه فى بنات لابسه نقاب ومش كويسه والقصص دى بقت قديمه اوى انما الجديد اللى استفزنى للتعليق هو الاخت القبطيه اللى بتدعيلنا بالهدايا ومش هعمل زى المراهقين واقعد اشتم فيكى وفى دينيك واهليك وناسيك والكنيسه واقعد اشرشح بفضايح الكنيسه اللى على كل لسان وكده لاننا كبرنا على الكلام ده بس هقوليك تعليق وهو وانا صغير سألت السؤال ده لابويا وقولتله هو مين اللى قال اننا اللى صح والمسحين هم اللى غلط ومين اللى قال ومين قال ومين قال زى اى طفل صغير وطبعا ابويا رد عليا زى اى اب كبير : اخرس ايه اللى انت بتقوله ده انت اتجننت و و و و و<br />وقعد السؤال يلح عليا لغاية ما جبت كتاب لمحمد قطب اسمه مذاهب فكرية معاصر واتكلم فيها عن الالحاد والشيوعية والمسيحية والاسلام والكلام كان مقنع جدا بالنسبة لى طبعا المنطقى انه كلام واحد مسلم فيكون متبنى وجه نظر الاسلام فقريت فكلام وقصص الالحاد وقصص التنصير والنصرانية وفى الاخر عرفت معنى كلمة الاستاذ سيد قطب انه مسلم عن اقتناع وليس بالوراثه مثل كثير من الناس<br />وعرفت قيمة الاسلام مهما كان مشوه وكان المسلمون هم اضعف الناس فى هذا الوقت ولكن اللهم لك الحمد على نعمة الفهم والذكاء الذى ارشدنى الى دين الاسلام<br />ربنا يهدي اللى مش فاهم ومش عايز يفهم ومش عايز يفكر انه ممكن يكون هو اللى محتاج هدايه<br />تحياتى لمجهوديك لنشر معتقداتيك ( رغم اختلافى العقائدى فى هذه المعتقدات )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123239/http://www.20at.com/article2.php?sid=1380"

