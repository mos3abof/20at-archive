subject = "عايشين في الحقيقة الحمد لله"
author = "علي"
posted = "2006-10-23"
text = "الاخت مصرية قبطية ..<br />هوا سيادتك بتدعيلنا ان ربنا يهدينا وينور بصيرتنا ؟؟؟<br />طيب انتي بنفسك بتقولي<br />بنعمة رب المجد يسوع المسيح<br />مش مكسوفة وانتي بتقولي على بشر انه اله ورب ؟؟؟<br />المسيح عيسى ابن مريم بتعبدوه ؟؟؟<br />سبحان الله<br />ربنا يهديكي يا بنتي<br />ربنا يهديكم وينور بصيرتكم ويوريكم الطريق والنور الحقيقي"
