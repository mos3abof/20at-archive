[[comments]]
order = 0
subject = "كنا رجاله و وقفنا وقفة رجاله"
author = "عابر القارات"
posted = "2006-04-13"
text = "المصيبة إن الشعب لسه بيغمره الجبن و ماشى جنب الحيط و يمكن تحت الحيط كمان و طبعا بالرغم من المواقف المشرفة التى لا يمكن إنكاره من بعض أعضاء هيئات التدريس (و طبعا أكيد ليس منهم من ينتمى للحزب الحاكم) لكن أغلبية أعضاء هيئة التدريس هم من فئات الشعب فبالتالى برضه مشيين تحت الحيطه و نظام و أنا مالى أنا عاوز أروح لعيالى ببطيخه و رغفين عيش !!! و سايبين الأمن يتعامل معاهم و كأنهم فراخ فى قفص و كل يوم الفرارجى يمد إيده ياخد واحد من الفراخ و يدبحها و لا تسمع غير (بكبكاك بكبكاك بكبكاك كاك كاك) و يروح يدبحه الفراخه و هكذا كل يوم... أنا متصور أن لو هما فعلا ناويين و حاسيين بقوتهم و أنهم بيحملوا قوة العلم كانوا تانى يوم بدون حتى إعلان يتوقفوا عن أداء دورهم تلقائيا و مفيش عضو من أعضاء أى خيئة تدريس يدخل أى محاضره حفظا على هيبة و وقار العلماء .... لكن تقول إيه رحم الله أيام كانت الكرامة هى الخبز و الهواء"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908170046/http://masr.20at.com:80/article.php?sid=164"

