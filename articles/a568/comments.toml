text = "من مقال وائل عن الدكتور زغلول النجار<br />بقلم : وائل عباس<br />عضو وحدة الصحافة الالكترونية<br />نقابة الصحفيين المصرية<br />wa2el3abbas@yahoo.com<br />زغلول النجار ... يستكرد أمة المليار<br />وهندريك شون لم يشفع له ترشحه لجائزة نوبل<br />سمعت اشاعة على الانترنت مفادها ان جريدة الاهرام قررت عدم نشر مقالات زغلول النجار فان صدقت هذه الاشاعة فالف شكر لجريدة الاهرام ودعوني استعير عبارة كررها احد الشخصيات في فيلم عادل امام الارهاب والكباب وهي عبارة: في اوروبا والدول المتقدمة .<br />يحكى انه في اوروبا وامريكا والدول المتقدمة كان يوجد عالم اسمه جان أو يان هندريك شون<br />Jan Hendrick Schon من اصول المانية هذا العالم هو مخترع الترانزيستور العضوي واللذي من المنتظر ان يحل محل دوائر السيليكون الالكترونية ويعتبر طفرة في مجال ما يسمى النانو تكنولوجي والنانو هو وحدة قياس من الملليمتر هذا العالم اتهمته شركة لوسنت تكنولوجيز Lucent Technologies بفبركة معلومات علمية وتزوير نتائج تجارب اجراها في معامل بيل الشهيرة Bell Labs التابعة للشركة وساعدت مجلة كريستيان ساينس مونيتور Christian Science Monitor في كشف هذا العالم المدعي<br />وقد سبقت هذه الحادثة حدث مماثل في معمل لورنس بيركلي الوطني Lawrence Berkeley National Laboratory عندما فصل فيكتور نينوف Victor Ninov بسبب تزويره لتجربة ادعى فيها العثور على عنصرين فيزيائيين جدد يضافان الى الجدول الدوري<br />ومعامل بيل من المعامل اللتي غيرت التاريخ في عام 1940 عندما اثبت العالم راسل اول Russell Ohl ان السيليكون شبه موصل للكهرباء وهو ما نتج عنه تكنولوجيا الترانزيستور اللتي نعيشها حاليا واللتي بواسطتها استطيع الكتابة اليكم الان ... وقد حقق علماء بيل لابس حتى الان سته من جوائز نوبل في العلوم<br />وهندريك شون هو صاحب نظرية الغبار الرمادي وهو اول من حذر من استيلاء الانسان الالي على الارض ومحاربته للانسان وعلى نظرياته اقيمت افلام مثل الماتريكس وترمينيتور باجزائه الثلاثة<br />واثنى على اعماله العلمية ولي عهد بريطانيا بل وكان مرشحا لنيل جائزة نوبل ولكن في امريكا واوروبا والدول المتقدمة الكذب مالوش رجلين<br />فقد تم طرد شون من معامل بيل وسحبت مجلة ساينس ستة من ابحاثه وسحبت جامعتة المانية منه شهادة الدكتوراة بل وقام البي بي سي بانتاج فيلم تسجيلي عن تزوير شون وكذلك فعل التلفزيون الياباني !!! يعني تشريد ليس بعده تشريد ... ولم نجد من يقول ان العلماء لحومهم مسمومة ...<br />والان نترك اوروبا وامريكا والدول المتقدمة ونعود الى بلادنا الحبيبة بلاد طفش منها احمد زويل وفاروق الباز ومجدي يعقوب وخلت الساحة لعالم عصره واوانه زغلول النجار !!!<br />وزغلول النجار اصبح له الان موقع خاص على الانترنت ما زال تحت الانشاء وهذا الموقع ليس لا سمح الله لعرض المادة العلمية وافتكاسات واكتشافات زغلول المبهرة ولكنه لبيع شرائط خرافات النجار ...<br />يعني يا حاج زغلول عاوز تتكلم في الدين البسلك عمة واعتلي احدى الشلت وافتي زي ما انت عاوز ماهو خلاص الدين ما بقالوش حرمة وكل من هب ودب بقى شيخ من عنده علم كالقرضاوي يلعب بعلمه الثلاث ورقات وحتى من ليس له علم كعمرو خالد حمر خدوده وطلعلنا في التلفزيون ... ما جاتشي عليك انت كمان يا زغلول بقى ...<br />لكن عاوز تتكلم في العلم يا حاج زغلول يبقى تحترم العلم والناس اللي بتكلمها ... يعني يبقى فيه مصداقية ... يعني تقول جايب كلامك منين وفين وامتى ومين ... لان العلم يعني الدقة ... وما ينفعش معاه شغل الشلت اللي انت اتعلمته في الدول العربية اللي بتروح تضحك فيها على الغلابة وتلهفلك قرشين ... فانا اعترف ان الفهلوة اختراع مصري اصيل ... وشيخنا فيها هو زغلول النجار !!!<br />قديما كان علماء المسلمين متفقهين في الدين وكان فقهاء المسلمين متفقهين في الطب والفلك والحساب والكيمياء ولهذا كانت لهم انجازاتهم العلمية المشهود لها في كل دول العالم حتى يومنا هذا ... اما الان فعلماء الدين لا ناقة لهم ولا جمل في العلم حتى ان واحد مثل بن باز افتى باهدار دم من يقول بان الارض كروية تلف حول نفسها !!!<br />ورجال العلم المفترض فيهم العقلية العلمية الصرفة والامانة في النقل وجدوا ان الدروشة تكسب اكثر خاصة من فلوس النفط واللي بيدفعوها فاطلقوا لحاهم واطلوا علينا بوجوههم العكرة من الفضائيات يقصون علينا قصص ما انزل الله بها من سلطان ... فهذا يقول اكتشف العلماء في المانيا مثلا كذا وكذا ... ولا يورد في حديثه اسم العالم اللذي من المفترض ان يذكره ثلاثيا واسم الجامعة او المعمل او المعهد العلمي وتاريخ الاكتشاف واين نشر ... الخ مما يفعله العلماء المحترمين !!!لكن لا عزاء للامانة العلمية !!!<br />طبعا اغلب القراء هنا مسلمون وكلنا طبعا<br />Read the rest of this comment..."
