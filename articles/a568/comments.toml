[[comments]]
order = 38
subject = "الموسيقى حرام"
text = "1- الأمام أحمد أبن حنبل قال الموسيقى حرام<br />2- الأمام المالكى قال الموسيقى حرام<br />3- الأمام الشافعى قال الموسيقى حرام<br />4- الأمام أبو حنيفة قال أن الموسيقى حرام<br />ثانية ثانية<br />الأمام أبن حزم قال الإنشاد حلال .... بس برضه الموسيقى حرام<br />و الأغرب أنهم قالوا أن المغنى سفيه ترد شهادته<br />سؤال الأخير ... مين بقى قال الأن الأغانى حلال ؟<br />عموماً أقرأوا الآتى<br />أدلة التحريم: و منها...<br />الدليل الأول<br />قال تعالى : \"\" و من الناس من يشترى لهو الحديث ليضل عن سبيل الله بغير علم و يتخذها هزواً اولئك لهم عذاب مهين \"\" ( لقمان : 6 )<br />قال الواحدى و غيره أكثر المفسرين على أن لهو الحديث فى الآية المراد به الغناء.<br />قاله ابن عباس و ابن مسعود.. وهو قول مجاهد و عكرمة.<br />وروى عن ابن مسعود أنه قال : و الله الذى لا إله غيره ( هو الغناء) – يعنى لهو الحديث .<br />الدليل الثانى<br />من السنة : فعن حديث أبو مالك الأشعرى فى الأشربة قال: (( سمعت رسول الله صلى الله عليه و سلم يقول(( ليكونن من أمتى أقوام يستحلون الحر – بكسر الحاء- و الحرير و الخمر والمعازف و لينزلن أقوام إلى جنب علم يروح عليهم بسارحة لهم يأتيهم- يعنى الفقير- لحاجة فيقولون ارجع إلينا غداً فيبيتهم الله ويضع العلم و يمسخ آخرين قردة و خنازير إلى يوم القيامة )) .<br />وجه الدلالة منه أن المعازف هى آلات اللهو كلها لا خلاف بين أهل اللغة فى ذلك – أنظر إغاثة اللهفان ( ص 26) الجزء الأول – و قوله (( يستحلون)) : أى أنها كانت حراماً فاستحلوها.<br />الدليل الثالث<br />عن أبى هريرة – رضى الله عنه- عن رسول الله صلى الله عليه و سلم : (( يمسخ قوم من هذه الأمة فى آخر الزمان قردة و خنازير )) قالوا يا رسول الله أليسوا يشهدون أن لا أله إلا الله و أن محمداً رسول الله ؟ قال : (( بلى .. و يصومون و يصلون و يحجون )) قيل فما بالهم . قال (( اتخذوا المعازف و الدفوف و القينات , فباتوا على شربهم و لهوهم فأصبحوا و قد مسخوا قردة و خنازير )) . – إغاثة اللهفان ج1 - .<br />الدليل الرابع<br />و قوله تعالى : (( و ما كان صلاتهم عند البيت إلا مكاء و تصدية )) – الأنفال : 35 –<br />قال أبن عباس , وابن عمر , وعطية , ومجاهد , و الضاحك , و الحسن , و قتادة : المكاء هو الصفير , و التصدية هى التصفيق ."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018104141/http://www.20at.com:80/article.php?sid=568"

[[comments]]
order = 39
subject = "من كتاب الرحيق المختوم"
text = "قال رسول الله صلى الله عليه وسلم‏:‏ ‏(‏ما هممت بشيء مما كان أهل الجاهلية يعملون غير مرتين، كل ذلك يحول الله بيني وبينه، ثم ما هممت به حتى أكرمنى برسالته، قلت ليلة للغلام الذي يرعى معي الغنم بأعلى مكة‏:‏ لو أبصرت لي غنمي حتى أدخل مكة وأسمر بها كما يسمر الشباب، فقال‏:‏ أفعل، فخرجت حتى إذا كنت عند أول دار بمكة سمعت عزفًا، فقلت‏:‏ ما هذا‏؟‏ فقالوا‏:‏ عرس فلان بفلانة، فجلست أسمع، فضرب الله على أذنـى فنمت، فما أيقظني إلا حر الشمس‏.‏ فعدت إلى صاحبي فسألني، فأخبرته، ثم قلت ليلة أخرى مثل ذلك، ودخلت بمكة فأصابني مثل أول ليلة‏.‏‏.‏‏.‏ ثم ما هممت بسوء‏)‏‏.‏<br />أترك الأمر لأولوا الألباب و لا حول و لا قوة إلا بالله ."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018104141/http://www.20at.com:80/article.php?sid=568"

