text = "انا لا افهم لماذ نحن العرب بنعمل من الحبه قبه<br />مش حننسى قضية 11 سبتمبر حصل ايه مات 3000 امريكي مع السلامه في ستين داهية اعتقد ان ما حصل في 9 ابريل اكبر منها بكثير وهو احتلال وطن عربي هو العراق ومتل عشرات الالوف من العرب والمسلميين والمسيحيين في العراق ما حصل في جنين كان اكبر<br />لماذا لا نهتم بدمنا العربي اكثر<br />ونهتم بانساننا العربي اكثر :: اان الاوان لكي نفوق ونبحث عن جرحنا النازف في كل مكان<br />هل يسال عنا الشعب الامريكي الابله الذي لا يعرف شيء عن العالم<br />افيقوا معشر الشباب وشكرا"
