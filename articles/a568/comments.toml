[[comments]]
order = 20
subject = "منى أبو الحسن"
text = "السلام عليكم و رحمة الله و بركاته...<br />وصلتني رساله من إحدى الصديقات بعنوان \"حكم الغناء\"، و فيها تحريم تام لكل أنواع الغناء و الموسيقى بشكل عام بما يتضمن الأغاني الإسلامية التي تغنى على الدفوف، و حيث أن معلوماتي تفيد بخطأ ما جاء في الرسالة، فقد رجعت إلى بعض الكتب لبعض العلماء الأجلاء كالإمام أبي حامدالغزالي و كتابه \"إحياء علوم الدين\" و كتاب \"الفقه على المذاهب الأربعة\" للشيخ الجزيري، و رأيت أن أفيدكم معي بالحكم الصحيح الذي اتفق علية الأئمة الأربعة و علماء الإسلام المشهود لهم بالعلم و الفقه...<br />سأرسل للموقع نسخة مصورة للصفحات الوارد فيها رأي الإمام الغزالي، و عليهم نشره جزاهم الله خيرا إن شاء الله...<br />ملاحظة: فيما يختص بالأحاديث الصحيحة للرسول الكريم (صلى<br />الله عليه و سلم) و الوارد فيها تحريم المعازف، فقد رجعت<br />إلى معاجم اللغة العربية لإيضاح ما المقصود بكلمة<br />المعازف و قد وجدت الآتي:<br />المعازف: آلات العزف \"\"الوترية\"\" كالعود و الطنبور.<br />و قد سأل الشيخ محمد الغزالي رحمه الله عن هذا التحريم و<br />علتة فقال (بما معناه) أن علة تحريم الآلات الوترية<br />(المعازف) يرجع إلى أنها كانت تعزف في مجالس الخمر و<br />الغواني و الرقص المحرم، أما العزف على هذه الألات في حد<br />ذاته \"فحسنه حسن و سيئه سيئ\" و الله أعلم."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018104141/http://www.20at.com:80/article.php?sid=568"

