[[comments]]
order = 11
subject = "وائل عباس"
text = "حقيقة ما اجده في الموسيقى الغربية لا اجده في موسيقانا العربية برغم حاجتنا اليه<br />وهو السياسة<br />فخلال حرب فيتنام ابدع فنانو موسيقى الروك اعتراضاتهم على الحرب وصاغوها في قالب موسيقي سمي بالبروتيست روك مثل بوب ديلان وجيمي هندريكس<br />وغني بروس سبرنجستين اغنية مولود في امريكا لاقتل الرجل الاصفر<br />واعضاء فريق البيتلز تنازلوا عن لقب سير اللذي اعطتهم اياه ملكة انجلترا بسبب موقف انجلترا من حرب فيتنام ونجد فريق مثل سيكس بيستولز وهم اول من اخترعوا البانك روك يغني اغنية لعن الله الملكة ولا يرميهم احد في المعتقلات<br />وكريس دي بيرج غنى للثورة على الاحتلال البريطاني لايرلندا في اغنية ريفولوشان واغنية الرياح الشرقية وغيرها<br />وفريق كرانبيريز غنت مغنيته الرائعة دولوريس او ريوردان كان الله في عونك يا ايرلندا انهم قتلوا ابي ولم يقتلوا كبريائي<br />حتى مادونا غنت اغنية الحياة الامريكية وبها تلميحات كثيرة عن غزو العراق<br />وعارض الحرب صراحة فريقي يو تو وديكسي تشيكس"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018104141/http://www.20at.com:80/article.php?sid=568"

[[comments]]
order = 12
subject = "وائل عباس"
text = "وهنا اقدم مجموعة اغاني مقترحة لكي تعرفوا كيف يغني العالم مشاكله بينما نغني نحن لنصفنا الاسفل فقط !!!<br />جورج مايكل: اقتلوا الكلب Shoot the Dog<br />بوب مارلي: Get Up, Stand Up<br />يوسف اسلام او كات ستيفنز: ملاك الحرب وقطار السلام<br />فريق الميتال ايارن ميدين: Aftermath<br />جيمس براون بتاع I feel good اللي غنى مع حكيم: Get Up, Get Into It, Get Involved<br />فريق رولينج ستونز: اعطني مخبأ ومحارب الشوارع<br />جيمي هندريكس مخترع موسيقى الهيفي ميتال: الحرية وهيي جو وبندقية الية وابطال الحروب<br />جون لينون عضو البيتلز السابق: تخيل و بطل الطبقة العاملة و لا اريد ان اكون جنديا واعطوا السلام فرصة وكريسماس سعيد انتهت الحرب<br />ار اي ام: نهاية العالم كما نعرفه It's the End of the World as We Know It<br />يو تو: اللاجيء ويوم الاحد الدموي<br />بوب ديلان: بوابات عدن واسياد الحرب والحرب العالمية الثالثة<br />ستينج: لن يعلمنا التاريخ شيئا وهذه الحرب وعالم واحد لا ثلاثة<br />واخيرا بينك فلويد: شجاعة ان تكون بعيدا عن المرمى واعيدوا الجنود والجندي كليج وكلاب الحروب وعودة الابطال واماه واحلام ما بعد الحرب ونحن وهم"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018104141/http://www.20at.com:80/article.php?sid=568"

