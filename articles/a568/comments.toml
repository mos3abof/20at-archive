subject = "سامي الفلسطيني"
text = "مساء الخير للجميع<br />الى فرنسا العلمانية<br />اليك يا فرنسا يا زعيمة الحرية والعدالة والمساواة والديموقراطية<br />لماذا منعت حجاب المسلميين<br />وهو فرض عليهم كالصلاة والصيام , ومن يقول غير ذلك اما جاهل او منافق او حاقد على الاسلام<br />الحجاب فرض ولكن النقاب زيادة في التدين والتقرب الى الله مثل قيام الليل ليس فرض<br />لكن مشكلة المسلميين ليس لهم اب ينادي ويدافع عن حقوقهم ان ما فعلته فرنسا لم تفعله اسرائيل عدوتنا التي تحتل ارضنا<br />والله العظيم لو تقدمت مراة لترشح تفسها لانتخابات الكنسيت الاسرائيل من فلسطينيي 1948 وكانت محجبة لسمح لها بدخول الكنيست ولن تتخذ ضدها اي اجرء<br />ولكن هذا ان دل على شيء انما يدل على حقد فرنسا على الاسلام منذ قديم الزمان تعمل فرنسا على سلخ الاسلام من قلوب ابنائه منخلال مركزها الثقافية ومن خلال سفاراتها<br />ومن خلال مؤسساتها الخيرية والتبشيرية<br />حتى الذين يسافرو الى فرنسا من ابناء العرب والمسلمين يحاولو عمل غسيل مخ له<br />الا ننسى جرائم فرنسا في الجزائر وفي سوريا ولبنان الم يقم جنود بطل فرنسا شارل ديقول هذا القزم الهارب بتقطيع اذان وايدي والسنة اعضاء الشعب السوري في جريمة ليس لها مثيل لكننا نحن العرب دوما ننسى ماضينا وتاريخناوحتى جغرافيتنا نسيناها وملاناالياس الذي لا يرخم كل من يستسلم له<br />مع تحياتي samii666@hotmail.com"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018104141/http://www.20at.com:80/article.php?sid=568"

