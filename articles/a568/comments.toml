text = "مساء الخير للجميع<br />يا شباب يا شباب<br />ارجوكم اذا كنت انا مخطىء وجهوني وانصحوني<br />انا مقياسي للرجال في الحياة من خلال مسالتيين الاولى ان يكون هذا الرجل انجز للبشرية شيء اسعدهامثل مخترع الكهرباء والهاتف وغيرها<br />امثال احمد زويل واديسون وغيرهم<br />والثانيه من خلال فتوحاتهم وتحرير اوطانهم امثال صلاح الدين وعز الدين القسام ومصطفى كامل وعمر المختار وغيرهم من الرجال<br />فاين انت يا وائل عباس من هؤلاء<br />اين انت<br />انت بتاع حكي وبس انت بتاع كلام وبس انت مهمتك تشويه الناس دون ان توجهم للطريقة الاصوب<br />اتقي الله<br />يا زائل ان كان اسمك وائل"
