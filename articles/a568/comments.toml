[[comments]]
order = 26
subject = "بيرو ومرمر"
text = "ما زلت عند قولي<br />مرمر مصرة ان انا غلطان ومش باعترف بغلطي<br />مع اني وضحتلها ان اللي هي بتسمعه ده هيافة وسطحية وقشرية دينية<br />لان الدين لم ولن يكون ابدا باللفظ ولكن الاعمال بالنيات ولكل امريء ما نوى<br />لكن يظهر انها من المتدينين الجداد بتوع عمرو خالد<br />رأيي في عمرو خالد كاملا منشور في مقال على الانترنت للي يحب يقراه<br />كذلك رأيي في عمر عبد الكافي مثير الفتنة الطائفية<br />ورايي في المشايخ المرتشين من ال سعود والوهابية السعودية لنشرها في مصر خاصة مع وجود من يسطحون الجو لاي مفاهيم<br />واحنا شعب طيب اي واحد ضارب دقن بنصدقه على طول من غير ما نشغل مخنا<br />استاذ بيرو اكيد انت لا تعارض ان الشيخ الشعراوي لا يعلى عليه وان المسافة بينه وبين اقرب واحد اليه مسافة شاسعة<br />فهم بالنسبة له اقزام<br />استاذة مرمر<br />فيه كتاب بيتباع في الاوتوبيسات عن اخطاء الصلاة<br />الكتاب تافه جدا وسطحي وقشري وغير مفيد<br />والكتاب متاثر جدا بالوهابية السعودية بهيافتها<br />لدرجة انه مثلا بيحرم ان الناس تسلم على بعض بعد الصلاة لانها في راي الوهابية ... بس ... بدعة<br />شفتي الهيافة<br />كذلك انا متاكد ان الشريط اللي سمعتيه لا يختلف عن ذلك فواضح انه يركز على منطوق القول ويغلب النقل على العقل<br />والحمد لله اللذي اوجدني في بيت متدين قبل هوجة التدين الحديثة والاسلام المستورد من الخليج<br />الحمد لله ان عندي اربعة تفاسير مختلفة للقران والكتب التسعة للاحاديث كاملة<br />الحمد لله انني لم احتج يوما لاخذ ديني عن شريط كاسيت او محطة فضائية<br />ولما الشريط تشوفيه انتي حلو مش بالضرورة اني اوافقك على كلامك !ّ!! مش كده ولا ايه ؟؟؟<br />استاذ بيرو<br />الناس اللي انت بتدافع عنهم دول وانت فاهم وانا فاهم<br />بيطلعوا علب فاضية مكتوب عليها من بره مسلم<br />والعلب دي سهل تتملي اي حاجة بعد كده<br />تطرف او ارهاب او بدع او شركيات او تصوف ... الخ<br />وده لان الناس دي مش بتركز على تاسيس وتاصيل المستمع في الدين<br />بيركزوا فقط على القشور<br />لان الاسلام عمره ما يختزل في الحجاب ومرواح الجامع<br />وانت عارف ان فيه دول بحالها بيصلوا بالخرزانة<br />ومع ذلك ابعد ما يكونوا عن الاسلام في تصرفاتهم<br />ورحم الله الامام محمد عبده<br />عندما قال وجدت الاسلام في الغرب ولم اجد مسلمين<br />وعندنا وجدت مسلمين ولم اجد اسلام<br />دينهم يقول السلام وعندهم الف اسطول<br />وديننا يقول الجهاد وعندنا الف مسطول !!!<br />وده رايي الشخصي باعرضه ومش بافرضه على اي حد<br />فبلاش حد يحاول يفرض رايه الشخصي المحض الناتج عن خبراته هو وتجاربه المحدودة الخاصة في الحياة عليا<br />ويا استاذ بيرو<br />مش اي حد يعوم ضد التيار<br />المهم يكون عنده هدف وعارف هو بيعمل ايه وليه<br />مش كده ولا ايه ؟؟؟<br />ولما التيار يكون مسف وهايف وسطحي واخرته سودة يبقى العوم ضده شرف ...<br />وائل عباس<br />عضو وحدة الصحافة الالكترونية<br />نقابة الصحفيين المصرية<br />يمكنكم قراءة مقالاتي في : عرب تايمز - ديوان العرب - شباب مصر - صوت الشعب - الاتجاه االاخر - مركز باحث للدراسات الفلسطينية - بحزاني - ملتقى الحوار العربي - السفيرة - نقطة حوار البي بي سي - جماهيرية ... الخ"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018104141/http://www.20at.com:80/article.php?sid=568"

