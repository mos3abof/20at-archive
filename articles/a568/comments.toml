[[comments]]
order = 35
subject = "إلى وائل مقفل بترباس عباس"
text = "السادة جريدة عرب تايمز:<br />أرجو تكرمكم بنشر الرد التالي على الأخ وائل عباس( مقاله عن زغلول النجار ) عملا بحرية الرأي والرأي الآخر التي تنتهجونها .<br />الأخ وائل عباس :<br />لست أدري من أين ابدأ معك !! هل أبدأ بأسلوبك الفذ في ركاكة العبارات وافتقار ما تسميه مقالا إلى الحد الأدني من شروط الكتابة الصحفية ؟ أم أبدأ من عدم الموضوعية التي يتسم بها ما تسميه مقالا؟<br />عموما لن أطيل عليك فأنت في كلا الاتجاهين أثبتَّ فشلاً ذريعاً فعلى صعيد اللغة العربية بصراحة أنت خير مثال لتدهور مستوى التعليم في مصر ، أما عدم الموضوعية فهو تهجمك وتطاولك على الأشخاص بطريقة فجة تنمُّ عن حقد غير مبرر.<br />ولست هنا بصدد تفنيد ما كتبت فأنت لم تأتِ بشيء يستحق التفنيد ولكن سأضعك أمام مرآة تبين لك مدى ضآلة أسلوبك في الطرح ، ولذلك سآخذ عينات من كلامك الغث وألحقه بردي.<br />تقول :<br />\" لكن عاوز تتكلم في العلم يا حاج زغلول يبقى تحترم العلم والناس اللي بتكلمها ... يعني يبقى فيه مصداقية ... يعني تقول جايب كلامك منين وفين وامتى ومين ... لان العلم يعني الدقة ... وما ينفعش معاه شغل الشلت اللي انت اتعلمته في الدول العربية اللي بتروح تضحك فيها على الغلابة وتلهفلك قرشين ... فانا اعترف ان الفهلوة اختراع مصري اصيل ... وشيخنا فيها هو زغلول النجار !!!<br />قديما كان علماء المسلمين متفقهين في الدين وكان فقهاء المسلمين متفقهين في الطب والفلك والحساب والكيمياء ولهذا كانت لهم انجازاتهم العلمية المشهود لها في كل دول العالم حتى يومنا هذا ... اما الان فعلماء الدين لا ناقة لهم ولا جمل في العلم حتى ان واحد مثل بن باز افتى باهدار دم من يقول بان الارض كروية تلف حول نفسها !!! \"<br />أقول لك بدوري : ورغم أني لا أحب الشيخ ابن باز صدقت ذلك أو لم تصدق ، فأنا أتساءل ما هو مصدرك ومن أين جئت بهذا الكلام عن ابن باز وأين الدقة التي تطالب بها زغلول النجار؟!<br />ثم تقول :<br />\"ومثال على ذلك ايضا ما يدعونه على رمسيس الثاني بانه فرعون موسى لان الاية الكريمة قالت ما معناه ننجيك ببدنك ... وتجاهل هؤلاء كل التفاسير الشهيرة للقران وفسروا الاية بان مومياء رمسيس الثاني هي اللتي نجاها الله لنا لنشاهدها في المتحف المصري بميدان التحرير !!! \"<br />فأقول لك : سواء اتفقنا أو اختلفنا مع ادعاء البعض عن فرعون موسى فإن جميع المفسرين مع إجلالي وتقديري لهم كالقرطبي والبغوي وغيرهم ليسوا هم نهاية علم التفسير ولن يقتصر عليهم وحتى تقوم الساعة، ومن رحمة الله بالأمة أن النبي عليه الصلاة والسلام لم يفسر القرآن حتى لا يثبت التفسير والاجتهاد على تفسير النبي الذي كان يناسب عقول الناس في ذلك الزمان قبل أربعة عشر قرناً .<br />وتقول :<br />\" لكن ما يريد زغلول النجار توصيله لنا هو ان الله جل وعلى بعد ان شق القمر ... ما عرفشي يلحمه تاني كويس !!! استغفر الله العظيم ولا حول ولا قوة الا بالله !!!\"<br />فأقول:<br />هذا هو أسلوب السوقة والرعاع في تحريف كلام الخصوم ، وأنظر إلى فجاجة الاستنتاج رغم ما أتبعته من استغفار لتحاول الضحك على الذقون بتقواك المزيفة .<br />وتقول :<br />\" طبعا كل ما سبق كان تريقة ولكن الحقيقة المرة هو ما حكاه زغلول من احداث يقول انها وقعت في محاضرة في جامعة كارديف بانجلترا وان البرنامج التليفزيوني كان على البي بي سي !!! تصوروا !!! زغلول النجار بيستكرد امة المسلمين بحالها !!! امة المليار !!! ومحدش بيرد عليه ولابيقول له اختشي يا راجل على دمك وبطل فشر ونخع ومعر ... لو كانت لك بقايا من تاريخ علمي كان الاولى بك ان تحافظ عليها وتموت بكرامتك بدل ما تموت بفضيحة !!! الهي وانت جاهي تفضح الراجل ده فضيحة هندريك شون قادر يا كريم!!! \"<br />فأقول:<br />ما هذا الإسفاف ؟ وما أسلوب ( الولايا ) والظاهر أنه لا ينقصك إلا أن تخرج صدرك وتدعو !!!<br />وتقول:<br />\" حد فيكم سمع عن استروخ ده منين وفين وبيبيع ايه ؟؟؟ واسمه استروخ كده زلط ملط من غير لا اب ولا ام ؟؟؟ يخرب بيت امانتك العلمية يا زغلول !!!\"<br />فأقول : لا تعليق فهذا استمرار للغة العوالم .<br />وتقول: \" فهذا والله علم لا ينفع حذرنا واستعاذ منه سيد الخلق في حديث شريف شهير!!! \"<br />فأقول: غريب أمر هذا الحديث (الشهير ) الذي لم تكتب نصه أو حتى رواته ، يا للأمانة والدقة التي تطالب بها زغلول النجار!!!!<br />وتقول:<br />\" فقديما قيل ان الارض مسطحة واستند من قال على القران الكريم ثم عندما اكتشف انها كروية ايضا استند من قال الى القران ثم قيل انها بيضاوية فتراجع المتراجعون وكله برضه من القران ما هذا العبث ؟؟؟ ... هم لا يدركون انهم بذلك يعبثون بمصداقية القران ذاتها !!!\"<br />فأقول:<br />لا تخف يا حبيبي فالقرآن محفوظ بوعد من الله تعالى ولن يحتاج للغة العوالم للدفاع عنه ، وكما أخبر عليه الصلاة والسلام بقوله \" لا تجتمع أمتي على ضلالة \" .<br />Read the rest of this comment..."
