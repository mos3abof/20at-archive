author = "مش مروة عبدالفضيل ولا عبدالله"
posted = "2008-05-18"
text = "وبعد زيادة المرتبات 30%<br />وزيادة الاسعار 200%<br />المصريين حرموا يعملوا اضرابات تاني<br />حرمنا يا سيادة الرئيس بس شيل الـ 30% ورجع الاسعار زي ما كانت يا سيادة الرئيس<br />يا سيادة الرئيس انت زودت المرتبات 30%<br />دا للي عنده مرتب<br />لكن يا ريس فيه ناس ما عندهاش مرتبات ولا ما عندهاش دخل حالص يا ريس<br />حرمنا نعمل اضرابات يا ريس<br />توبا"
archived = "2009-11-28"
capture_url = "https://web.archive.org/web/20091128123650/http://www.20at.com:80/masr/hot-topics/9097.html"
