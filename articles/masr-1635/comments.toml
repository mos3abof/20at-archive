[[comments]]
order = 5
subject = "سعر الكرسى كام"
author = "لى استفسار عن سعر الكرسى الكبيرررر اللى سيادته قاعد عليه"
posted = "2007-02-24"
text = "استفسار عن السعر فقط لانى شخصيا لا اريد ان اكون مكانه لانه سيسال امام الله عن كل فرد فسيطول حسابه ..رحم الله ايمن نور من هذا الكرسى اللعين ( وعسى ان تكرهوا شىء وهو خير لكم) ...<br />لا اريد سعر رقمى للكرسى لكن اريد فقط ان تفكروا هل اى مبلغ يستحق ان تكون مسئول امام الله عن كل فرد فى هذه الامه<br />مهما غلا سعر الكرسى فهو رخيص<br />فلا تبحث عن الكرسى ايا كان لكن ابحث عما سياتى لك من ورائه"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082920/http://masr.20at.com:80/article.php?sid=1635"

[[comments]]
order = 6
subject = "الى ابن بهيه"
author = "نيفين نيفى نوفا"
posted = "2007-02-24"
text = "بالنسبه للموضوع انا بتفق مع رايك<br />يروحو يدوروا على راس الافعى بدلا من زيلها<br />و بالنسبه للتعليقات اللى اتمسحت من موضوعات كتير انا كنت كتبت تعليق ردا على ما كتبنه ف موضوع عبود الزمر<br />هل رايته و اثرت عدجم الرد ام انه قد تم حذفه فيما حذف من تعليقات<br />فى الحالتين سواء اثرت الصمت او لم تراه ارجو الرد<br />و تقبل شكرى"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082920/http://masr.20at.com:80/article.php?sid=1635"
