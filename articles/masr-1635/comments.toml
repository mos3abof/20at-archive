[[comments]]
order = 0
subject = "4300 ج مصري يجيبوا كام كيلوا بصل؟؟؟"
author = "إبن بهيه"
posted = "2007-02-22"
text = "هذا الموضوع وبتلك الأرقام المتواضعة التي أقصى ما وصلت إليه هو ممبلغ 4300 جنيه مصري كمرتب شهري يعني أن معاليها مسكينة وشحاته ويجب مساعدتها<br />4300 ج م يجيبوا كام كيلوا بصل الأيام دي؟<br />أنا مش باكسر مجاديف ولا حاجه بس الهوامير بينهبوا المبلغ ده وقدامه ست سبع أصفار .. دوروا على دول وسيبكم من بتوع الأتوبيس الشحاتين من باب توفير الجهد لما هو أهم .. هذا رأيي الشخصي الذي لا يمكن أن يعيب الموضوع بأي حال طبعا .. لكم تحياتي<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082920/http://masr.20at.com:80/article.php?sid=1635"

[[comments]]
order = 1
subject = "كوسة ستان"
author = "عاطل"
posted = "2007-02-22"
text = "جمهورية كوسة ستان كل شىء مباح<br />وحتى الليالى الملاح وتوريث الانجال وترقية الازواج والاستيلاء على اموال القصر والارامل والمساكين<br />فى عصر الانفتاح والانشكاح والعولمة والماسونية كل شىء مباح وقانونى<br />الرشوة اسمها تفتيح مخ<br />الواسطة اسمها تسليك امور ومسائل<br />نهب المال من المؤسسات اسمة بدل اجتماعات<br />التهرب من الضرائب للقادرين اسمة تمشية حال وشيلنى واشيلك ويابخت من كان النقيب خالة<br />عزيزى لا يوجد امل غير الحرق<br />ربما بعد النيران نتطهر جميعا من الخطايا<br />ونصبح مثل خلق اللة<br />ان اللة لايصلح قوما حتى يصلحوا انفسهم<br />صدقت يارب"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082920/http://masr.20at.com:80/article.php?sid=1635"

[[comments]]
order = 2
subject = "دولة جمهورية كوسة ستان العربية المهلبية ( مصر سابقا)"
author = "المواطن المطحون"
posted = "2007-02-23"
text = "اليكم اخر اسعار وظائف دولة كوسة ستان الان:<br />البترول بخمسين الف جنيه<br />السلك القضائي باربعين الف جنيه<br />الشرطة والحربية بخمسة وربعين الف جنيه<br />الكهرباء بثلاثين الف جنيه<br />الجامعة بعشرين الف جنيه مع الاكراميات<br />اما وظائف القطاعات التعبانه في الحكومة فتتراوح ما بين خمسة الاف جنيه الي خمسة عشر الف جنيه<br />تحذير: الاسعار هذه غير شاملة ضريبة المبيعات والاكراميات والمنح والهدايا لزوم الكسكسة , والاسعار ايضا تتغير طبقا لاسعار العرض والطلب , وايضا باسبقية الحجز والواسطة .<br />رئيس الحرامية احمد نظيف<br />وزير الكوسة والمهلبية احمد درويش<br />وزيرة الابتدائية عائشة الكيلاني"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082920/http://masr.20at.com:80/article.php?sid=1635"

[[comments]]
order = 3
subject = "زفة المتطاهر"
author = "وهذة الزفة والسمك لبن تمر هندى والاهتراء الواضح فى بنية المجتمع دة مسئولية مين"
posted = "2007-02-23"
text = "امنا الغولة<br />والا شيخ الحارة اللى ما بيبخرهاش ويرقيها من العفاريت والعين الصفرا<br />والفوضى الشاملة فى زفة المتطاهر مين اللى بيرتبها اظن عفركوش ابن برطكوش<br />كلة من عدم التبخير وعدم عمل حجاب يلبسة المحروس<br />يا شيخنا يا شيخ بين كراماتك وارقى البلد اللى ركبتها العفاريت واقرأ الصمدية وسورة ياسين يمكن العفاريت تطفش والا ربنا ياخدهم والبلد تنضف شوية<br />وربنا يجعل كلامنا خفيف"
archived = "2007-02-25"
capture_url = "https://web.archive.org/web/20070225082920/http://masr.20at.com:80/article.php?sid=1635"

