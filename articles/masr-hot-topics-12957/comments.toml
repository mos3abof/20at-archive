subject = ""
author = "ادفع للمحتاج"
posted = "2009-08-17"
text = "انت ممكن تشوف واحد ساكن في بيت كويس ولابس كويس، بس ممكن تكون ظروفه وحشة حتقولي ازاي؟؟ .. شوف يا سيدي ممكن تكون واحدة ست جوزها سابها او توفي وليس لها مصدر دخل ثابت او مناسب طب نسيبها تنحرف؟<br />كمان راجل مريض لا يستطيع العم والانفاق على اسرته<br />شاب والده توفى وسابه بمعاش صغير<br />حالات كتييير لازم نفكر ازاي نساعد المحتاج اللي مش بيطلب معاونة من حد هو ده اللي بيكون يستحق المساعدة بجد"
archived = "2009-08-21"
capture_url = "https://web.archive.org/web/20090821085455/http://20at.com:80/masr/t7kyk/12957-2009-08-17-06-17-10.html"

[[comments]]
order = 1
subject = ""
author = "فى الصورة"
posted = "2009-08-17"
text = "مواطن يطعم 10 دجاجات فى الصورة اعلاة يعنى بيبيع 10 بيضات فى اليوم ب بخمسة جنيهات يعنى 150 جنية فى الشهر<br />وبما ان السيد وزير التنمية الادارية قد صرح بان خط الفقر هو 120 جنية فى الشهر<br />يبقى الراجل ساكن القبور هذا من طبقة الاثرياء وسياخذ منة الضريبة العقارية وضريبة الدخل وضريبة المبيعات على اساس كم جثة بيدفنها فى اليوم وبياخد مبلغ قد اية فى الدفنة وبما انة ليس لدية دفتر محاسبة فسيدفع غرامة قدرها 3000 جنية"
archived = "2009-08-21"
capture_url = "https://web.archive.org/web/20090821085455/http://20at.com:80/masr/t7kyk/12957-2009-08-17-06-17-10.html"

[[comments]]
order = 2
subject = ""
author = "فى الخطة القادمة"
posted = "2009-08-17"
text = "فى الخطة القادمة سوف يتم الانتهاء من سكان المقابر وذلك بعمل شبكة مياة للقاطنين وسط المقابر وسيموت نصفهم من مرض التيفوئيد والنصف الاخر بالفشل الكلوى بعد ان يشربوا من شبكة المياة التى تسحب من المجارى مباشرة<br />وسيتم اخذ قرض من البنك الدولى لتنفيذ تلك الشبكة المهمة فى البنية الاساسية<br />الحل سهل خالص"
archived = "2009-08-21"
capture_url = "https://web.archive.org/web/20090821085455/http://20at.com:80/masr/t7kyk/12957-2009-08-17-06-17-10.html"

[[comments]]
order = 3
subject = ""
author = "شعوب حية"
posted = "2009-08-17"
text = "افغانستان<br />العراق<br />الصومال<br />اسرائيل<br />الاكراد<br />شعوب حية<br />اذا عجزت عن التغيير بالكلمة بتغير بالقوة ودى معناة الحياة<br />العراق نسبة الامية صفر فى المية وليس عندهم 9 ملايين عانس ولا عشرة ملايين مريض بالكبد<br />العراق لا تشرب من المجارى<br />الشعب المتخلف عقليا هو الشعب الجامد المستكين الخانع كالشاة امام الجزار"
archived = "2009-08-21"
capture_url = "https://web.archive.org/web/20090821085455/http://20at.com:80/masr/t7kyk/12957-2009-08-17-06-17-10.html"

[[comments]]
order = 4
subject = ""
author = "رد على المعلق السابق"
posted = "2009-08-17"
text = "الحمد لله على نعمة الامن<br />الحمد لله اننا مش زي العراق<br />الحمد لله اننا مش زي افغانستان<br />الحمد لله اننا مش زي الصومال<br />نايمين في المقابر صحيح بس الحمد لله على نعمة الامن<br />يا اخي الكريم انا بحمد ربنا على نعمة الامن<br />مش عيب اننا اتذكر البلاد اللي انهار فيها الامن والناس عاشت في رعب وفزع وخوف زي العراق وافعانستان والصومال<br />اللي نايم في المقابر ربنا انعم عليه بنعمة الامن"
archived = "2009-08-21"
capture_url = "https://web.archive.org/web/20090821085455/http://20at.com:80/masr/t7kyk/12957-2009-08-17-06-17-10.html"

[[comments]]
