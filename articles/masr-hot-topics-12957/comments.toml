subject = ""
author = "احمدوا ربنا"
posted = "2009-08-17"
text = "احمدوا ربنا على نعمة الامن<br />مفيش فتن طائفية زي العراق<br />مفيش عصبية قبلية زي افعانستان<br />الواحد ينام في اي حته بس الحمد لله على نعمة الامن<br />وربنا وهبنا في مصر الامن المركزي والامن العام وامن الدولة ومديرية الامن<br />الحمد لله على نعمة الامن"
archived = "2009-08-21"
