author = "امن اية يا ابو شخة"
posted = "2009-08-17"
text = "دى شعب طوال حياتة تحت الاحتلال والخنوع والذل<br />تضربة على قفاة يحترمك<br />عمرة فى حياتة ما ثار ولا رفض ولا حتى اتخانق مع عسكرى<br />دى شعب عامل زى الفراخ البيضة<br />تقوم تقول امن وامان دة اسمة جبان"
archived = "2009-08-21"
capture_url = "https://web.archive.org/web/20090821085455/http://20at.com:80/masr/t7kyk/12957-2009-08-17-06-17-10.html"

[[comments]]
