subject = "وداعا للاحزاب فى مصر"
author = "دكتور عاطف احمد على"
posted = "2006-07-05"
text = "قولولى اين القناة الشرعية التى نعبر بها عن ارائنا حرام على احزاب مصرما تفعله فى اعضائها وفى النهاية الحكومة هى السبب نعيب زماننا والعيب فينا وما لزماننا عيب سوانا<br />عضو قديم بحزب الوفد<br />نجع حمادى قنا"
