subject = "مشاهد تقليدية"
author = "م . ن"
posted = "2006-06-01"
text = "أصبح مشهد تقليدى للغاية رؤية الأحزاب متفرقة و مشتتة داخلياً ...من حزب الأحرار للغد للوفد يا قلب لا تحزن ! و طبعاً أصابع الحكومة واضحة وضوح الشمس فيها ..ناهيك عن الأحزاب الورقية التى قتلت نفسها بنفسها...<br />انتظروا فيلم هندى جديد عن حزب الوفد فى المرحلة القادمة"
archived = "2006-09-05"
