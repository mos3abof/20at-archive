subject = "تعليق وخبر منقول"
text = "أحب أن أنوه أولاص أن مشكلة الثراء الفاحش مقروناً بعدم التدين وعدم وجود هدف في الحياة السبب الرئيسي لهذه الحادثة :<br />وقد نشر موقع قناة العربية هذا الخبر.. أنقله لكم بالنص عن محاولات المجتمع السعودي مداواة آثار الحادث:<br />إثر تزايد المشاكل الاجتماعية التي سببتها الهواتف الجوالة المزودة بآلات التصوير في السعودية، قررت بعض المناطق والإمارات إلزام أصحاب قصور الأفراح بتعيين حارسات أمن تنحصر مهمتهن بشكل رئيس في منع إدخال أي مدعوة أو ضيفة تحمل جوال مزود بكاميرا إلا بعد حجزه.<br />وتأتي مثل هذه الخطوة في أعقاب إحجام الكثير من النساء عن الذهاب إلى صالات الأفراح بسبب انتشار الجوالات المزودة بكاميرا مع المدعوات اللواتي يقوم بعضهن بتصوير النساء دون علمهن، والتي يتم في بعض الأحيان بيعها أو استغلالها للنشر على صفحات الإنترنت.<br />وقد ذكرت صحيفة \"الرياض\" في وقت سابق أن هيئة الأمر بالمعروف والنهي عن المنكر(جهاز حكومي مستقل يقوم على تطبيق الأداب الاسلامية العامة) بالطائف وضعت ضوابط مشددة لقصور الأفراح والقاعات والاستراحات الخاصة بالمناسبات بمنع دخول أجهزة الجوال المزودة بكاميرا .<br />وجاء في التعميم الصادر عن الهيئة أن لتلك الجوالات \"خطورة ومساهمة كبيرة في هتك أعراض المسلمات الغافلات أثناء تواجدهن بالأفراح والحفلات والمناسبات وذلك من قبل بعض ضعيفات النفوس اللاتي يقمن بتصويرهن وهن غافلات وفي غاية زينتهن وبعد ذلك تنشر تلك الصور وتفسد المجتمع والأسر\".<br />وقد عبر عدد من النساء عن ارتياحهن لذلك القرار بهذا الشأن والذي جاء ضمن العديد من الضوابط التي وضعتها هيئة الأمر بالمعروف مع بدء موسم الأفراح في الصيف.<br />أما في مكة المكرمة فقد تم اتخاذ خطوة جديدة لمنع النساء المدعوات من حمل جهاز الجوال المزود بكاميرا، والطريقة الجديدة تمثلت في كتابة تحذير واضح على رقاع الدعوة من حمل الجوال الكاميرا مع التوضيح بأن القاعة ستقوم بالتفتيش وسحب جوالات النساء المزودة بكاميرا، من خلال العبارة التالية \"ملاحظة هامة: سوف يتم تفتيش وسحب جوالات النساء المزودة بكاميرا\".<br />وقد لاقت هذا الطريقة ارتياحا لدى الكثيرين كما أوضحت صحيفة \"الوطن\" السعودية حيث ذكر لها أحد الشبان المقلبين على الزواج أنه \"ينبغي على أصحاب الحفل الحرص الشديد، والتنبيه على المدعوين بخطورة حمل فتياتهم للجوالات ذات الكاميرا، وأيضا ينبغي أن تكلف إحدى العاملات بقصر الأفراح بموضوع الجوالات ومراقبة المراهقات حتى لا يحدث ما لا تحمد عقباه\".<br />تجدر الإشارة إلى أن قصة الفتاة الخليجية التي تم تصوير عملية اغتصابها من قبل شبان في مدينة الرياض قد أثارت حفيظة الشارع السعودي، مما أدى إلى انطلاق نقاشات وجدالات حادة حول مسألة انتشار الجوالات المزودة بكاميرا، والممنوعة بشكل قانوني في البلاد."
archived = "2004-08-25"
capture_url = "https://web.archive.org/web/20040825102019/http://www.20at.com:80/article.php?sid=460"

