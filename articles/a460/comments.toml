subject = "من رويتر"
text = "قالت وزارة الداخلية السعودية إن رجلا<br />أعدم بحد السيف في العاصمة الرياض اليوم الأحد لمحاولته اغتصاب امرأة في منزلها.<br />وأضافت أن الرجل ويدعى عدنان الشهراني كان ثملا عندما اقتحم عنوة منزل<br />المرأة وطعنها في رقبتها بسكين وهددها بقتل طفلها.<br />وقالت الوزارة إن الجاني \"لم يتمكن من الفعل بها لمقاومتها له. وقد اعترف<br />شرعا بجريمته وأنه فعل ذلك بسبب شربه للمسكر.\" ولم تذكر الوزارة جنسية<br />الشرهاني لكنها قالت إن له سجلا جنائيا.<br />وبهذا وصل عدد الذين نفذ فيهم حكم الإعدام في السعودية هذا العام إلى<br />تسعة. وفي العام الماضي أعدم 52 شخصا على الأقل في المملكة بينما كان عددهم 45<br />فقط عام 2002."
archived = "2004-08-25"
capture_url = "https://web.archive.org/web/20040825102019/http://www.20at.com:80/article.php?sid=460"

