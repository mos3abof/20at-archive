posted = "2006-05-30"
text = "فعل أفعل فاعل مفعول<br />وهنا أحمر ليس أسمأو لون و لاكن فعل أحمر على وزن أفعل أي زاد حمورية<br />مثلاُ حمار حمر أحمرٌ<br />ولذلك خط أحمر يعني خط الحمورية بل الأحمر و هو خط الحكومة<br />فهو يقصد أننا لا يمكن أن نقترب من الحكومة لأنة خط الحمورية"
