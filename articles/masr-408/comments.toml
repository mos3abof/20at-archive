author = "a3mw"
posted = "2006-06-01"
text = "مرتين دورت على الخط الاحمر وتجاوزه ولم اصل اليه المرة الاولى اعلان الريس قطع العلاقات مع كوستاريكا لنقلها سفارتهاالى القدس والتهديد بقطع العلاقات مع اىدولة تنقل سفاراتها الى القدس ونقلت الدول سفاراتها وطبعا فيه خط الثانية ايام طيارة لوكربى صرح فى حديث صحفى عن تسليم المتهمين الليبيين ان لاتوجد اتفاقية تسليم المتهمين بين الدولتين أمريكا وليبيا وانه لو مكان العقيد لن يسلمهم وبعدها بأيام سلم محمود ابو حليمة من مصر للامريكان فعرفت الخط انه مؤخرة الغولة"
archived = "2006-09-10"
