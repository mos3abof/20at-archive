[[comments]]
order = 9
subject = "خط أحمر من الرئيس"
author = "مصرية"
posted = "2006-05-30"
text = "الخط الأحمر الذى يقصدة الأمبراطور الأوحد..الغير مبارك ..هو الخط الذى يتعدى فيه أى مواطن مصرى ويعترض على أفعاله الدنيئه من السلب والنهب والأستبدادوالقهر ..وقانون الطوارىء ..وتخطيطه لتوريث الحكم للمحروس ابنه..والأحمر منه هو أعتقاده أنه يلعبها بحرفنه..هو وشلة المنافقين والأفاقين من المتمرغين فى نعيم هذا الفساد..والأكثر حموريه..اعتقاد هؤلاء الفسدة أنهم خالدون..أيها الفسدة أنكم تقتربون من النهاية الحتمية لكل هذا الظلم والأستبداد..أنتم تعيشون آخر أيامكم ...والبركاااااااان قادم لا محاله..ووقتها سترون ليس فقط خط أحمر ..سترون جهنم الحمراء وستحترقون بنار الظلم الذى أغرقتم فيه مصر وشعبها..أنتم أحقر الكلمات فى كل قواميس لغات الدنيا..لالالالالالالالالالالالا لمبارك وسلالته..لالالالالالالالالالالالا للفساد..لالالالالالالالالالالالا لقانون الطوارىء.. ونعم..نعم..نعم..لتعديل الدستور...ربنا يخلصنا منكم .. ونلاقى داهيه ترضى تاخدكم .. قولوا آآآآآآآآآآآآآآآمين"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173926/http://masr.20at.com:80/article.php?sid=408&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "كذاب"
author = "كان بيقول أن اللعب فى الدستور شيء خطير جداً علشان محدش يطالبة بتغيير الدستور وقال أنى يوم لما أحب أضحك على الشعب ها أغير الدستور وهو دلوقتى بيغير الدستور والمبادىء بس عملى يعنى بذل المصريين مع أن القانون حفظ السيادة للمصرى وبيحاول يورث إبنه الحكم مع أنه فى نظام حكم جمهوريى وبيمنع المظاهرات مع إنها حق للشعب فى التعبير عن رأيه يبقى فاضل إيه معملوش خلى بس فى الدستور إللى ينفعه ويخليه طايح فى الشعب"
posted = "2006-05-30"
text = "يا شباب ده حول مصر لدولة عبيد علشان يطيح زى ما هو عايز وصدقونى خير مصر كثير بس هو نهبه هو الفسدة من حوله شوفوا إنجازاته تحويل مصر إلى دولة إقطاعية وسيطرة رؤوس الأموال ومحاولة توريث الحكم وإزلال الشعب كلها عكس مبادىء الثورة وده علشان ملقاش حد يقف ويقوله لا هو إحنا مستنيين إيه يمكن فاكرين أنه ها ييجى شعب يدافع عن المصريين غير شعبها ولا يتحط فى المعتقلات غير ولادها لازم يا جماعة نحارب الفساد ونعرف إن ده عقاب لينا على صمتنا على فساده وحسبى الله ونعم الوكيل أللهم أذل مبارك ويزال ملكه ويطاح بعرشة ويذل نفسه يارحمن يارحيم اللهم آمين"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173926/http://masr.20at.com:80/article.php?sid=408&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 11
subject = "نسل الحمير اللامبارك!"
author = "قاتل الكلاب"
posted = "2006-05-30"
text = "\" ربِّ لاتذر على الأرض من الكافرين ديارا إنك إن تذرهم يظلوا عبادك ولايلدوا إلا فاجرا كفارا \"<br />سيرهبهم وسيسلط الله عليهم من بين أيديهم ومن خلفهم سيزلزلهم الله<br />وسيعلم الظلمون أي منقلب ينقلبون.<br />ستكون عاقبة الداعر اللامبارك كعاقبة سلفه المنوفي الديوث، ولن تغني عنه كل رجال السي أي إيه ولا الموساد، ولاتلامذتهما التنابلة كعمرو سليمان.<br />شاء الله لمصر أن تكون كنانته بأرض الإسلام، وأن تحوي سهامه الثاقبات، وما مسها طاغية بسوء إلا قصمه الله وجعله عبرة ونكالا."
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173926/http://masr.20at.com:80/article.php?sid=408&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

