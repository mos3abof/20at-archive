posted = "2006-05-30"
text = "باين ان كل اللي في الموقع زمالكاويه ولا ايه!!!!<br />ماله الخط الاحمربس عاملكو ايه مش كفايه ان النصايب كلها محطوطه وراه<br />ده حسنى ايه مش مبارك متغاظ من الخط الاحمر اصل انا اعرف انه زمالكاوي ايوة ايوة صدق انته لسه هاتبحلق 0000 ايوة الريس حالنبوحه زمالكاوي 0000<br />الخط الاحمر اللي مقصود هوة خط الجون<br />ومافيش حد هايجيب جون في حسني<br />ممكن حد يجيب جون في الرااااااااااس الكبيرة<br />ممكن<br />انا مسحت الخط الاحمر يا ابو دماغ كبيرة<br />وريني هاتعمل ايه بقه<br />واجري علي الله<br />وانت كمان امسح الخط دهمن سجلاتك<br />عشااان دي بلدنا كلنا"
