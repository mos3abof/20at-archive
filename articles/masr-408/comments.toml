subject = "اه يا بلد"
author = "نيفين..نيفى..نوفا"
posted = "2006-05-30"
text = "و الله يا جماعه بحسدكو كلكو انكم لسه قادرين تسخروا و<br />عارفه ان التعليقات ظاهرها السخريه بس بتخفى وراها الم<br />بس حتى دا مش قادره اعمله من ساعه ما قرات موضوع الشرقاوى تانى<br />معدتش قادره اضحك<br />معدتش قادره اهزر ف التعليقات زى زمان<br />الاشياء بتفقد معناها ادامى<br />ثوابت و قيم كتير بدات تهتز<br />معدش شىء واضح<br />و لا شىء صريح<br />و لا شىء اكيد<br />لم يعد يبقى الا حبى للبلد<br />حتى دا بقيت خايفه عليه<br />متزعليش يا هبهوب لو ملقيتينيش معلقه فى مواضيع كتير<br />و الله مليش نفس"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173926/http://masr.20at.com:80/article.php?sid=408&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 16
subject = "مولد سيدي الأحمر"
author = "ابو شريف"
posted = "2006-05-30"
text = "مش عارف ليه لما سمعت عن الخط الأحمر ده افتكرت واحد مجذوب لابس طرطور علي راسه وجلباب واسع قوي بس كله مرقع وحاطط علي صدره أغطيه البيبسي وعامل فيها قائد عسكري ... أحمر أيه يا أحمر ماخلق ربنا كان فين الخط الأحمر ده لما طيارة مصر للطيران وقعت في امريكا وفيها خيرة ظباط مصر<br />كان فين الخط الاحمر ده والمبيدات المسرطنة نهشت جسم الشعب المصري<br />كان فين الخط الاحمر ده وانت بتنفذ كل حاجة بتطلبها منك امريكا<br />كان فين الخط الاحمر ده وبدأت حكمك الميمون (نسبة للقرد ميمون) بحادثة خطف الباخرة إكيلي لاورو وإعلانك الشهير إنك مش قد أمريكا<br />علي فكرة الخط الأحمر الوحيد الموجود هو الخط اللي عندك اسفل ظهرك ... عرفته"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173926/http://masr.20at.com:80/article.php?sid=408&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 17
subject = "الشيء لزوم الشيء"
author = "غاوي بهدلة"
posted = "2006-05-30"
text = "مرة كان في مؤتــمر طبي منعقد في دولة أجنبية<br />بعد المؤتمر أجتمع واحد أمريكي و وواحد فرنسي وواحد مصري و كل واحد قعد يتكلم عن إنجازاته<br />الأمريكي : إحنا كان عندنا في أمريكا واحد ما بيشوفش رحنا عملنا إيه ؟؟<br />جبنا قطة و دبحناها و خدنا عنيها و زرعناهم للراجل<br />إللي واقفين أستغربوا قالولوه : و بيشوف كويس<br />الأمريكي : يوووه دا بيشوف إللي ورا الشمس<br />راح جه الفرنسي و قال إحنا كان عندنا واحد كبده تعبان فجبنا قطة و دبحناها وخدنا كبده و زرعناه للراجل<br />قالوله : و بيشتغل كويس<br />قالهم الفرنسي : يوووه دا بيهضم الزلط<br />قام المصري قال : أحنا بأه كان عندنا واحد مخة بايظ رحنا شيلنا مخة و حطينا بدالة جزمة<br />قالوله : أيه داا و شغال كويس<br />قالهم : يوووه , دا بقي رئيس وزراء عندنا دلوقت"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173926/http://masr.20at.com:80/article.php?sid=408&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

