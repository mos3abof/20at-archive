subject = "عليا الحرنكش"
author = "مصرى للنخاع"
posted = "2006-05-29"
text = "عليا الحرنكش ياريس مبارك<br />فى عصر مزركش ملون بنارك<br />لابايعك وابايع حكومة حمارك<br />اكيد هوه طالع يشاهد جمالك<br />جمالك مبارك سوزانك سوزانا<br />يامحلا حصارك فى مصر الى جالنا<br />نسيمها فى عصرك بيشوى فى بدنا<br />فهمبك وهجص وطلع فى دينا<br />اؤيد وابايع فخامة جلالتك<br />وايد اى واحد بيمسح ريالتك<br />فاقعد ياريس ودلدل حمامتك<br />حمامه السلام حمامتك ياريس<br />سلامه الحمامه سلامتك ياريس<br />ياريس حمامه ياربس كويس<br />على تل مصر ياريتك تهيص<br />خرابه فسيحه عليها تمتيس<br />وامرك مطاع فشعبك مفيص"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173926/http://masr.20at.com:80/article.php?sid=408&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

