subject = "عرفت مكانه"
author = "المقاومه والصمود"
posted = "2006-07-24"
text = "انا بقى عرفت مكانه<br />الخط الاحمر دا موجود فى اربع مناطق فى مصر اولا منطقه مصر الجديدة وبالتحديد القصر الجكهورى وثانيا فى شرم الشيخ مبارك الجهه المقابله لسستة بنطلون سيادته وثالتا فى منطقة التفاح الامريكانى اللى بياكله سيادته ومتربى عليه<br />اما المكان الرابع فى شفايف كونداليزا اللى نفس سيادته هتطلع عليها"
archived = "2006-09-10"
