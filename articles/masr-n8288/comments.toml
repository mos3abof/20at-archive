[[comments]]
order = 5
subject = "شعب تعبان"
author = "تفاعل كيميائي"
posted = "2006-05-21"
text = "الشعب المصري اسوا شعب شفتة في حياتي برغم اني مصري لكن بحس انة بيسيب المشكلات الكبيرة و يبص علي الهيافات اللي المجتمعات الحضارية التانية نسيتها من زمان.<br />الشعب بيحب التفاهات لاننا تافهين.<br />عادل امام مين و احمد زكي مين عملو اية للبلد دول<br />ولا حاجة ضحكو عليكو ز خدو منكم فلوسكم في السينما و خدو منكم وقتكم في التليفزيون بس احنا كدة مش هنتغير"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622151236/http://masr.20at.com:80/article.php?sid=350"

[[comments]]
order = 6
subject = "سينما مش تافهة"
author = "السعيد المصرى"
posted = "2006-05-21"
text = "سينما<br />ادب<br />مسرح<br />تلفزيون<br />عندما تتحدث عن هؤلاء<br />يأتى اليك ويحدثك صديق<br />اية التفاهة دى<br />طب عن ماذا نتحدث<br />بجانب المظاهرات و الاحتجاجات<br />لابد من وجود شئ للتنفيس يا صديقى<br />وعن طريق الفن نستطيع التغير<br />او نجنى بعض او جزء من التغيير<br />ليس الفن كلة تافها يا صديقى"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622151236/http://masr.20at.com:80/article.php?sid=350"

[[comments]]
order = 7
subject = "الصياعه ادب مش هز افلام..."
author = "مش شغلك..."
posted = "2006-05-21"
text = "اه يا ختي ناقصه اصلها , بقولك ابعتي الافلام والكوره والشورت والفانله في اميل<br />عشان اشوفهم , يا بتني دا بصوت حاليا اهي اهي منك لله فكرتيني لييييييييه .<br />حاجه بقي\" للولوه \" يالولوه يا بنتي انا بيعجبني فيك بصرف النظر علي اني قريتلك قبل كدا , انك بتكتبي وبتعلقي في نفس الوقت لاه وايه بتخشي باسمك الاصلي مبتعمليش زي ناس تاني قفشاهم نفر نفر<br />وشم----وشمال يمين انتي في السليم .<br />وحمد الله علي السلامه يا ختي."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622151236/http://masr.20at.com:80/article.php?sid=350"

