[[comments]]
order = 1
subject = "من عير كسوف"
author = "جمال المجنون"
posted = "2006-06-10"
text = "الخواجة بيجو وأبو لمعة وفؤاد المهندس وحكايات محمود ونكت إسماعيل يس، كلها أسماء وشخصيات تعودنا أن نستمع إليها، وإذا لم يحالف البعض الآخر الحظ وفاته الميعاد أو منعوا عرضها واستبدلوها بتلك المسلسلات الرمضانية الماسخة فقد تستمع إلى حكايات وإفيهات الوالد والوالدة وتهكمهم على طريقة الخواجة بيجو المعروفة في نطق اللغة العربية المكسر التي يصر على الحديث بها ولكنه مازال متمسك بلكنته اليونانية الصرف..<br />وكذالك إلى الـ\"نخع\" والحكايات الغريبة التي يصر أبو لمعة على سردها في كل القعدات رغم إن \"الفشر\" واضح والكذب مفضوح إلا أنه لا يكف عن إلقائها ونحن أيضا لا نكف عن الضحك عليها..<br />زمان كنا نرى الوجوه لا تكف عن الضحك ويمكن ندمع من كثر الضحك وإحنا مش فاهمين ونسأل نفسنا\"همه الناس دول بيضحكوا على إيه؟\"<br />ودلوقتي وبم إننا كبرنا ودخلنا الجامعة وخلاص بقينا بنفهم سبب السخسخة من الضحك عرفنا قيمة أبو لمعة مع انه كذاب وعرفنا وطنية الخواجة بيجو مع انه خواجه.<br />وولاد البلد فكروا في طريقة يخففوا بها من أزمة أيام الامتحانات وجوها الخنيق ويطروا ع الشباب شوية وقلنا نفكركم بحلقات الخواجة بيجو وأبو لمعة...<br />وشكرا جمال"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613030151/http://masr.20at.com:80/article.php?sid=492"

