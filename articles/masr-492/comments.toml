subject = "مش كدا و لا اييييييه"
author = "نيفين نيفى نوفا"
posted = "2006-06-15"
text = "و الله يا جماعه كان فيه زمان حاجات كتير تاهت مننا او تهنا منها<br />كان زمان بييجى برنامج على الشباب و الرياضه ف السهره كان اسمه نهار و ليل ف عز الليل<br />و كان برنامج دندنه برده زمان احلى<br />حاجات كتير قديمهبشتاقلها اوى و بحنللهاجدا<br />بس فى الاخر<br />تستمر الحياه بين ابتسامه و اه"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628195718/http://masr.20at.com:80/article.php?sid=492"

