[[comments]]
order = 12
subject = "الإخوان المظلومون دائما"
text = "نستغرب كثيرا من تحامل البعض على الإخووان المسلمون كبرى الحركات الإسلامية والذي وصل غلى درجة أشبه بتحميلهم المسئوليةوكانهم هم الذين قتلوا ياسين و الرنتيسي وطبعوا مع العدو!!!!!!!!!!!إلى هؤلاء أقول:<br />انظروا إلى حجم الضغوطات التي تمارس ضد الإخوان في مصر و العالم ، هم لا يستطيعون العمل أو الإجتماع إلا تحت سطوة الأمن و سيف الاعتقال؟<br />ياعاااااااااااالم ..يا اخوااااانا: اللي ايده في المية مش زي اللي ايده في النار<br />الإخوان يعملون في ظروف استثنائية بالغة السوء،و من العدل الاَ نحكم عليهم الاّ حين ينالوا فرصتهم الطبيعية<br />ثم لم الإخوان فقط مطالبون بالتحرك؟ لم لا يتحرك كل المسلمون على اختلافهم ؟<br />شيئا من الإنصاف يا سادة.. و كفانا تجريحا للأشخاص والهيئات ..اللي فينا مكفينا ."
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053906/http://www.20at.com:80/article.php?sid=146"
