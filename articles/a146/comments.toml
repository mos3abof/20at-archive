[[comments]]
order = 0
subject = "ام علي"
text = "بسم الله )من المومنين رجال صدقوا اللهالشهيد الرنتيسي نجم يضيء ليلنا الحالك ذلا و هونادماء ستظل حية نابضةماتوا و صنعوا الحياةو نعيش لنصنع الموتاسال نفسك يا عربي تعيش لماذا؟ما الفرق بينك و بين أي صهيوني أو أمريكيشهيدنا هنيئا لك الجنةو الويل لنا"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053906/http://www.20at.com:80/article.php?sid=146"

[[comments]]
order = 1
subject = "الرد من الخارج"
text = "قد لا تستطيع عملية جهادية عسكرية أن تشفي صدور قوم مؤمنين.. الحل الوحيد في حال خارجي..يقدم لحماس الدعم من خلال حكومات تسير علي نهج حماس..وفعلا متي سيتحرك الإخوان المسلمون..متي ؟؟لا حول ولا قوة إلا بالله"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053906/http://www.20at.com:80/article.php?sid=146"

[[comments]]
order = 2
subject = "السيستاني وعاكف ( لافرق اذن ("
text = "لا شيئ سوى جماعة بثقل جماهيرى يستطيع ان يحرك الجبال.لكنها تكبل نفسها بفكر المرجعيات الشيعيه وهو فكر يحمع بين القدرة على البناء والهدم فى نفس الوقت.لم استغرب من تصريح المرشد العام الذى تباهى بشهيده وشهيد الامة الشيخ احمد ياسين..فالشيخ وبتعبير المرشد العام كان قائد الاخوان المسلمين فى فلسطين..ورحل الشيخ ورحل من تبعه وبقيت تصريحات المرشد العام الحماسية.اعتقد ان جماعه لا تستطيع ان تدافع عن نفسها ولا تستطيع ان ترى قوتها- التى لا ينكرها احد-لا يجب ان ننتظر منها شيئا سوى ان تعتق مريديها من جمود مرجعيات يكفيها ان تحافظ على الصلوات الخمس فى مواعيدها. استشهاد الرنتيسى اما شهادة ميلاد جديدة للاخوان المسلمين واماشهادة وفاتها"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053906/http://www.20at.com:80/article.php?sid=146"

[[comments]]
order = 3
subject = "ولاد ال............."
text = "قتلو الرنتيسي لأنه كان عايز حماس تتعاون مع القاعدة وحزب الله.. قتلو الرنتيسي لأنه كان مجاهد اكثر منه سياسي..قتلوا الرنتيسي لأنه لا توجد حكومات عربية تملك أي رد فعل..قتل الرنتيسي لأنهم يعلمون أن الحكومات العربية ستحجب اي رد فعل."
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053906/http://www.20at.com:80/article.php?sid=146"

[[comments]]
order = 4
subject = "الإخلاص أولاً"
text = "اخوتى الاعزاء<br />السلام عليكم ورحمة الله وبركاته<br />الاخلاص هو الحل، فليجدد كل منا نيته فى عمله ، حتى ولو كنت اسكافيا أو كناسا، فليخلص كل منا فى عمله، بداية من أكبر راس فى الدولة، حتى أصغرها، و نتذكر ان أعمالنا سيشهدها الله و رسوله و المؤمنون، و لاداعى للشعارات الكذابة، فليس بهذا وقت الكلام، بل العمل هو الاساس، و لا تنسي أن المؤمن القوي خير من المؤمن الضعيف، و القوة فى هذا العالم، هى قوة العمل، ولا اقصد بذلك أن يمسك كل منا سلاحه ويذهب لفلسطين ليفجر نفسه، بل أقصد ان كل منا على ثغرة من ثغور الاسلام، فليجاهد كل منا فى مقر عمله، و يخلص لله وحده ، وهو على كل شئ شهيد"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053906/http://www.20at.com:80/article.php?sid=146"

[[comments]]
order = 5
subject = "بلا مثيل"
text = "ماذا يمكن ان نفعل؟...<br />لا شيء .. صدقوني لن نفعل شيئا<br />ليست المرة الاولى وليس الرنتيسي بحال كياسين القائد والمؤسس وراحت دماء ياسين لتصفع أقفية الحكام الخونة الذين انعدم لديهم أي شعور إنساني وأصبحوا أسوأ من السوء<br />ولتصفع وجوهنا غير الكريمة الخائنة ولتلج داخل كل محصنة تستبيحها بلا مجيب<br />نحن ندغع ثمن جهلنا وتخلفنا وغفلتنا التي بلا مثيل"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053906/http://www.20at.com:80/article.php?sid=146"

[[comments]]
order = 6
subject = "لا تجرحوا الأشخاص"
text = "نعتذر عن حذف المشاركة التي أخطأت بحق أشخاص وأسرة الموقع تتمنى من الجميع الحفاظ على الانتقاد بأسلوب حضاري ينبع من قيمنا وثقافتنا الإسلامية<br />أسرة موقع عشرينات"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053906/http://www.20at.com:80/article.php?sid=146"

[[comments]]
order = 7
subject = "ياسر فتحي - الإسكندرية"
text = "بسم الله ولا إله إلا الله والله أكبر<br />اللهم ألحقنا بكتيبة الشهداء وهيئنا لهذا الشرف يارب العالمين<br />اللهم امين .<br />أقترح عمل \" مدرسة المجاهدين - صلاح الدين - الرنتيسي _ محمد<br />الفاتح \"<br />هذه المدرسة هي أكادمية المجاهدين مادام الدور الأول هو إعداد<br />النفس وتربيتها فليخرج هذا الدور من حيز التعبير الأدبي إلي<br />الإنتاج العملي مدرسة واضحة المعالم من حيث<br />- القرآن الكريم \" حفظ وفهم ودراسة \"<br />- اليرة النبوية<br />- الأحاديث النبوية<br />- دراسة فقه الجهاد<br />- التربية بقيام الليل والأذكار<br />على أن تكون لهذه المدرسة وفقا لكل مستي أوظرف أو من يتطيع أن<br />ينفذها مع نفسه أاو محيطه أو مع أاحد الدعاة أو من يراه مساعدا<br />له في ذلك<br />- مع الإهتمام بالتربية العملية بتشكيل لجنة حقيقية امناصرة<br />فلسطين والإتصال باسر الشهداء وحركات المقاومة<br />- الإهتمام بمن يرعي هذه المدرسة من العلماء والدعاة وذوي الخبرة<br />لتكون مدرسة فعلية<br />- لا يشترط فيها دعوة جماهيرية وإنما بناء الفكرة على أساس البذل<br />والعمل والتربية ولو أان تكون للملتزمين فحسب .<br />- يفضل أن تكون محددة العدد مسبقا حتي تؤتي ثمارا جيدا<br />- الهتمام بالتفكير الإبداعي والإبتكاري وعدم الإقتصار على الافكار<br />والوسائل المعتادة"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053906/http://www.20at.com:80/article.php?sid=146"

[[comments]]
order = 8
subject = "حكامنا خونة"
text = "بلا جدال ولا يختلف على ذلك أحد وكلهم بلا استثناء<br />حد معترض؟... مستحيل...<br />لكن صدقوني كلنا سننسي بعد أيام قلائل .. فرصة وأنت سخن شوف تقدر ازاي تجاهد بمالك على الأقل وانوي كدة هتقدر تطلع كام في الشهر ... لدعم المقاومة<br />من فضلكم فعل إيجابي"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053906/http://www.20at.com:80/article.php?sid=146"

[[comments]]
