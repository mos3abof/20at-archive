[[comments]]
order = 10
subject = "السيستاني وعاكف..وعجبي"
text = "ينفع كده؟؟ ينفع نقول \"شهيده\" ينفع نقول \"مريديها\"؟ ينفع نقول \"استشهاد الرنتيسى اما شهادة ميلاد جديدة للاخوان المسلمين واماشهادة وفاتها؟ ده حتى لو هم كده.. ينفع احنا نبقى كده؟ نحلل ونحكم ونعلق ونغلط.. ونسيبهم في الملعب لوحدهم؟ هي دي \"لعبتهم\" هم بس ولا ايه؟ واحنا بأه الجمهور الحكيم.. عجبي!"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053906/http://www.20at.com:80/article.php?sid=146"

[[comments]]
order = 11
subject = "عبد العزيز الرنتيسي"
text = "\"آن للشرفاء إذن أن يبذلوا كل جهد مستطاع ليحطموا قيود الواقعية المهزومة، لقد آن لهم أن يعملوا مخلصين كي تتبوأ أمتهم العريقة المكانة التي تليق بها بين الأمم\"."
archived = "2004-05-06"
