subject = "رحم الله المهندس"
text = "يعني يا ياسر عايز تعمل مدرسة مجاهدين وماتعملش فيهاحتى تعليم شيل سلاح؟؟ بأه ده اسمه كلام؟ يعني لما يكون امام العدو هيعمل ايه؟ هيكبر؟؟ الله يرحم عياش.. ويتقبله من الشهداء"
archived = "2004-05-06"
