author = "عكاشة"
posted = "2009-05-23"
text = "الراجل الفلاح دة بتاع ميت غمر او قرية متواضعة مليانة حمير وجحوش لا يصلح لتولى قيادة نادى راقى زى نادى الزمالك<br />الفلاح الفصيح دة اللى فلت من المحرات وتسريح الغنم فى بلدهم ونجح فى التعليم يصلح لتولى نادى او الساحة الشعبية فى بلدهم انما نادى الزمالك لا والف لا والا هيجيب عالية واطية وهيحول النادى الى زريبة او دوار<br />ارجع يا مرتضى بلدكم واقعد على شط الترعة وخللى احلامك متواضعة شوية<br />امثالك هم اللى ودوا البلد فى داهية وعملوا عشوائيات فى كل مكان"
archived = "2009-05-24"
capture_url = "https://web.archive.org/web/20090524235608/http://www.20at.com:80/t7kyk/12151-2009-05-23-12-17-23.html"

