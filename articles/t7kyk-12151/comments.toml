author = "simsim from jeddha"
posted = "2009-05-25"
text = "الى عكاشه<br />اولا واضح جدا من طريقتك انك فلاح ومش فلاح عادى لا انت فلاح قرارى وعشان انت فلاح هتعرف يعنى ايه قرارى<br />ثانيا<br />ابتداء من رئيس دولتك لاصغر موظف فيها ومرورا على اهم قيادتها وعلماؤها وشيوخها فلاحين<br />عيب اوى ان يكون رفضك لمرتضى انه فلاح لانه لو كان ده السبب فيكفيه فخرا وهكون انا اول المؤيدين<br />وشكرا"
archived = "2009-05-28"
