subject = ""
author = "عكاشة"
posted = "2009-05-26"
text = "صحيح انا فلاح قرارى وابن الارض ونبتها وفلاح ابا وجدا الى ايام منقرع<br />ولكنى فلاح حاصل على شهادات عليا فى هندسة الطاقة وعملت مع معظم الشركات العالمية فى شرق العالم وغربة وعدت الى القرية منبتى ولحمى من طينها وطلقت الهندسة وعدت الى الفلاحة فى اخر العمر<br />والفلاح يا صاحبى لا ينفع ادارى<br />ولا ينفع فى قيادة اى شىء<br />علشان كدة طوال عمرنا بيحكمنا مملوك اجنبى ومستعمر<br />الفلاح بيقول كلام وحكم على الناى والارغول ولكنة كلام اى كلام لا يضر ولا ينفع<br />الفلاح المصرى تقنى مهنى يجيد عملة بس انما ادارة - لا<br />وانا من بلد الفلاح مرتضى<br />واقول انة ما ينفعش<br />لانة فلاح مهياص بتاع كلام"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100622/http://www.20at.com:80/t7kyk/12151-2009-05-23-12-17-23.html"
