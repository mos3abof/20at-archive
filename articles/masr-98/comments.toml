[[comments]]
order = 5
subject = "اخوانجى مخنوق من الاخوان"
author = "ابو محجن"
posted = "2006-04-03"
text = "السلام عليكم ... انا شايف ان الجماعه فيها مشاكل مزمنه من الداخل ولازم نعالجها وظهرت مشاكلها دى للناس اللى بتقرا وبتفكر .....(المناهج بتعانى من قلة الافق وعدم الشموليه فيها اصلا ) الافراد يتعاملون داخل الصف وكأنهم ماكينه_ كنا سلبيين فى مواضيع لابد ان نتحرك من أجلها مثل (حادثة العباره _موت السودانيين_موت 8 فى الانتخابات_ قطار البحيره_الاعتقالات لافراد السعب سواء كانو اخوان او غير اخوان )الاخوان كمعارضه سياسيه فهى ضعيفه تحتاج لتطوير (السؤال خرجت مظاهرات ضخمه السنه الماضيه وتم اعتقال1500 فرد من اجل الاصلاح) فكم محاضره اعطت داخل الصف لتفهيم الفرد المسلم ما هو الاصلاح السياسى _.......ننادى بالديقراطيه فهل نحن بالفعل عندنا ديقراطيه ؟؟؟؟؟......يا جماعه انظروا الى انفسكم وانظروا الى المجتمع وانظروا الى كلمة الامام البنا (عالمية الدعوه)فهل نحن على الطريق لا اريد منكم غير التفكير والله الموفق"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023018/http://masr.20at.com:80/article.php?sid=98&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

