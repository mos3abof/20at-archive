subject = "جيل النصر"
author = "مراد"
posted = "2006-05-01"
text = "العالم يشهد بأن الإخوان المسلمين هم أفضل جماعة على الإطلاق وهم الوحيدون الذين يصلحوا أن يستلموا دفة القيادة وسيكون قريبا بإذن الله العزيز ليحققوا آخر أهدافنا كمسلمين وهو (( أستاذية العالم )) وأكرر أنتم طلاب وطالبات الإخوان الحاليين أنتم جيل النصر ."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023018/http://masr.20at.com:80/article.php?sid=98&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

