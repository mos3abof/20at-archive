[[comments]]
order = 7
subject = "ميدو"
author = "عباس الأبيض ملك البودرة"
posted = "2006-07-16"
text = "حيلك حيلك يا عم ميدو إيه قصايد الشعر اللى بتقولها فى عمك مبارك و ثلثين الشعب مين اللى بيؤيدوا مبارك دول؟؟ أنتا يمكن بتتكلم عن شعب زامبيا يمكن و لا النيجر و خلاص بقى الاكل و الشرب و النوم هما أقصى طموحاتنا طيب ما البهايم يبقى أحسن مننا ما هى بتاكل و تشرب و بتنام و بالها رايق عننا يعنى أحسن حال مننا و بعدين انتا بتتكلم و كأن مبارك ده مخلد يعنى هيعيش الى يوم القيامة يا عم ميدو مبارك سلم نمر من زمان و بيدور البلد بالتليفون دلوقتى و يمكن كمان سنة و لا سنتين و يمكن أقل من كده و أكيد هيجيى اليوم ده زى ما أجدادنا و إحنا ما هنودع و نركب الخشبة طيب ساعتها هتمدح فى مين يا عم ميدو عاوزين نشم نفاسنا بقى الله يكرمك أنتا و مبارك فى ليلة واحده الشعب ده تعب قوى من مبارك و نظامه و ليه لأ ما نحاولش نعمل زى أوروبا و نعيش زيها يعنى إحنا مثلا بهايم و هما بنى أدميين يا با الحاج دا كل العالم أكل وشنا كل الخلق بقت بتقارنا دلوقتى بالهند و ماليزيا و تايلاند اللى كانوا أصلا عايشين فى الكهوف و عندهم مشاكل داخلية و حروب و بلاوى زرقه لكن بينهضوا و مش عاوزين لامؤاخذه يفضلوا مرنخيين فى الوحل و بلاد بتنهض و تفوق و بلاد فيها واحد إسمه ميدو عاجبه قوى مبارك يا جدع كفاية بقى ده إنتا جيبتلى إسهال"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

