[[comments]]
order = 11
subject = "نداء إلى جميع السوريين"
author = "المياسة"
posted = "2006-07-16"
text = "ناصر السهلي<br />هذا النداء العاجل الذي أوجهه للقيادة والشعب السوريين يعتمد على مصادر إعلامية غربية أعرفها معرفة شخصية، آملا أن تصل إلى أصحاب العلاقة.... وبالسرعة القصوى....<br />العدو الصهيوني يحضر من خلال تحشيد صامت لمواقف غربية وعربية لشن عدوان على الجمهورية العربية السورية وذلك في محاولة لإختبار الموقف الايراني الذي أعلن بأنه سيقف مع سوريا حال تعرضها إلى عدوان... هذا الموقف الصهيوني أخذ الضوء الاخضر الامريكي وبعض الدول الاوربية تحت تسمية \"عملية جراحية دقيقة\" تهدف إلى إيصال رسالة مزدوجة للقيادة السورية والايرانية ولقيادات فلسطينية معينة...<br />إنني أوجه هذا النداء بالحذر واليقظة من المناورات التي يقوم بها العدو الصهيوني ... وقد حصلت صباح هذا اليوم السبت 15 يوليو من أحد الزملاء الصحفيين وهو مراسل وكاتب متجول... وخلال حديثنا إستطعت معرفة بعض ما حصل عليه الزميل من معلومات بالصدفة... والمتابعة... وكان هذا الاعلامي قد تعرض في السابق لحملة تنصت من قبل أجهزة إستخبارات وتم جرجرته إلى المحاكم الدانماركية ليبوح بمصادره التي رفض رفضا قاطعا البوح بها...<br />إننا حين نوجه نداءنا للأخوة في سوريا فمن محبتنا لعروبتنا ولهذا الشعب العربي الذي لا نريد أن يصيبه أي مكروه من خلال غدر تجهز له قوات العدو وبصمت عربي متواطؤ مع بعض الدوائر الغربية....<br />عاجل ... عاجل... أيها السوريون الحذر ثم الحذر الرجاء من كل الأخوة الذين يتلقون هذا النداء إخبار أكبر عدد ممكن لعلنا نستطيع ايصال هذه الرسالة التحذيرية إلى أكبر عدد من الناس"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

[[comments]]
order = 12
subject = "نقلاً عن سيد يويف"
author = "المياسة"
posted = "2006-07-16"
text = "فلتتواروا خجلا....جتكم ستين نيلة<br />سيد يوسف<br />تمهيد<br />كان لكاتب هذه السطور مقالا بعنوان غزة تعرى الجميع ،وتلقى كاتبه مداخلة من إحدى الأخوات الفضليات جاء فيها بالنص \" في هذه الأيام عندما أفكر بعروبتي أحس بالخجل<br />لما يحدث للأمة من نكبات وعندما أفكر بأبطال الصمود في العراق فلسطين وغزة الرباط<br />أشعر بالفخر بأنني عربية\"<br />مفارقات مؤلمة<br />السيد حسن نصرالله قدم ابنه شهيدا فى حين هناك حاكم عربى يقدم ابنه وريثا للحكم رغم أنه عبث بالدستور الذى أقسم بالمحافظة عليه.<br />السيد حسن نصرالله يجاهد الصهاينة ولا يلوث يده بمجرد السلام عليهم....فى حين أن هناك حكاما عربا يقبلون ويستقبلون بالأحضان رؤساء الكيان الصهيونى.<br />السيد حسن نصرالله يستخدم ما لديه من صواريخ وإمكانات محدودة ويقهر بها بله يذل جيوش الصهاينة ومن وراءها من دول...فى حين أن جيوش بعض الحكام العرب تقف كحائط صد للدفاع عن بنى صهيون.<br />السيد حسن نصرالله يقول للصهاينة إن العمق بالعمق وإن زمان الاعتداء بلا رد قد انتهى ..فى حين أن هناك حكاما عربا مات أبناؤه واستقبل القتلة من بنى صهيون بعد مقتلهم بيومين .<br />السيد حسن نصرالله يغامر بحياته من أجل رد العدوان الصهيونى..فى حين أن هناك حكاما عربا يغامرون بشعوبهم وبمقدرات بلادهم من اجل الدفاع عن بنى صهيون.<br />السيد حسن نصرالله وقف فى نفس خندق الفلسطينيين فى مأساتهم فى غزة وأسر جنديين صهيونيين فى حين صمت بعض الحكام العرب بل طالب بعضهم برد الجندي الصهيونى الأسير<br />السيد حسن نصرالله يقف متضامنا مع فلسطين وحماس فى حين تم طرد ممثل حماس بمصر بدعوى الحفاظ على حياته!!!<br />ولأمر ما- وكأنه توارد خواطر- تتفق ثلاث دول على ترديد الأجندة الأمريكية من أن حزب الله يغامر ويدخل فى مغامرات غير محسوبة الم<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

[[comments]]
order = 13
subject = "رساله الى نفسي"
author = "مواطن فى الطريق الى غزه"
posted = "2006-07-16"
text = "قولك ازاي احكم البلد<br />1 ـ تطبيق الشريعه الاسلاميه بكل ما فيها<br />2 ـ الغاء الضريبه واستعاضه دخلها عن طريق الذكاه والموارد الشرعيه المحدده<br />3 ـ العمل بنظام رءيس الوزراء المنخب مع قليل من الصلاحيات لي كرءيس دوله<br />4 ـ نظام الدوله اسلامي ىرأسمالي<br />5 ـ تعيين قاضي في كل مركز شرطه للفصل في النزاعات بين المواطنين بشكل سريع علي ان تكون الشرطه جهاز تنفيزي تابع للقضاء دون وزاره للداخليه<br />5 ـ الغاء وزاره السياحه والاستعاضه عنها بمركز استعلامات علي اعلي مستوي بجميع المطارات المصريه لارشاد الزوار والعمل علي عدم استغلالهم بعد الاعلان عن مصر خاليه من الكحل<br />6 ـ ادخال الاقباط في العمليه السياسيه للاستفاده من حزب قوي يدعم الحركه السياسيه ويساهم في التنميه<br />7 ـ قانون عمل يوفر دخل مناسب ومكاسب مناسبه<br />8 ـ الغاء الخدمه الالزاميه من الجيش<br />9 ـ العفوا التام عن مبارك ومنافقيه لاعطاء الجميع فرصه للمساهمه الفعاله<br />10 ـ تنفيز عمليه عسكريه علي الصهاينه وستسمي عمليه يوم القيامه سادخل بخيره اجناد الارض وسأتوقف عند حدود 67 لاني لااريد اباده لاحد حتي اليهود<br />ايه رأيك تنتخبني ولاتكمل مع سيدك مبارك"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

[[comments]]
order = 14
subject = "احنا شعب غلط"
author = "ابو شريف"
posted = "2006-07-16"
text = "الأساتذه اللي قدموا قصيدة شعر في العصر السعيد اللي احنا عايشينه والتي وصلت نتيجتها النهائية في أننا شعب غلط يحكمة واحد صح أريد ان اسألهم كيف نكون بلد نملك اراضي زراعية من أجود الأراضي ولدينا مياه ولدينا أمطار ولدينا أيدي عاملة رخيصة ومشتاقة للعمل وبعد ذلك نستورد القمح من السعودية ... كيف ان نكون دولة بها بترول وغاز طبيعي وقناة سويس وجميع أنواع المعادن وبعد ذلك نمد ايدينا بالسلف ... كيف يكون العامل المصري يأخذ راتبه بالجنيه ( وما أدراك مالجنيه ) والمنتج المصري يباع اغلي من الأجنبي .... كيف يكون القميص والبنطلون المصري أرخص من اللبناني مع أن العامل الليناني يقبض بالدولار وأيضاً لايوجد مواد خام في لبنان ... واما في الشأن الداخلي فالمصري لايختار من يحكمه ... الرئيس يحكمنا من 25 سنة ( جمهورية ملكية ) ومجلس الشعب يتم تزوير انتخاباته ورئيس الوزراء يختارهم الرئيس والوزراء يختارهم الرئيس ( رئيس الوزراء ستارة بس ) بالنسبة للعلاقات الخارجية فنحن اصبحنا منفذين للأجندة الدولية مثل السكرتير مع مديره ... وفي النهاية آآآآآآآآآآآآآآآآآه يابلد"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

[[comments]]
