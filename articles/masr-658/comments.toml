[[comments]]
order = 27
subject = "لاتعليق"
author = "ميدو الأصل"
posted = "2006-07-18"
text = "إخواني وأخواتي<br />أنا لاأطيل في الكلام نحن جميعا نتحدث عن أفعال مبارك وحده وننسي أنفسنا فعلا أنا معاكم مبارك خلاص أصبح عميل لأمريكا وحامي إسرائيل في المنطقه ولكن ليست تلك القضيه التي نتناقش فيها هناك ما هو أهم مبارك خلاص أصبح علي ديكة الاحتياطي في دول العالم مثل قطعة الشطرنج وبلاأصح مثل عسكري الشطرنج قيمته في مكانه فقط أما هو ليس له تأثير الإ بجيشه ممكن يترقي ويكون وزير في حالة واحده بس الإستعانه ومساعدة جيشه ولكن هو غبي وإستعان بتفكير خارجي ليحركوه كما يشأون إنني بالفعل لا ألوم عليه ولكن ألوم علي الأخوه الذين أبدوا رأيهم فمنهم من هو مازال متمسك بالدفاع عن مبارك وهذه مصيبه ولكن إنني متأكد أنهم مازالوا صغار السن لايدركون ما يقولون أما الذي يقف ضد مبارك نعم أن معهم ولكن ماذا فعلنا هل نقف من بعيد وننقض هذا ونسب هذا ونمدح هذا ؟ طبعا لابد وأن نقف علي الاقل في مواقفنا اليومي نعامل ضمرنا ونعامل ربنا لأنه سبحنه وتعالي قال في كتابه العزيز بسم الله الرحمن الرحيم \"إن الله لايغير ما بقوما حتي يغيروا ما بأنفسهم\" صدق الله العظيم فنصيحتي لكل الأخوه أن نبدأ بأنفسنا وأتمن أن نأخذ هذا الكلام علي محمل الجد وانظروا اليه من الناحيه القرأنية لأنه منزل من عند الله وصدقوني سنجد الفرج القريب لكل أمورنا<br />وتقبلوا خالص تحياتي"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

