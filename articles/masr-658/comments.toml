subject = "مع مبارك"
author = "مع مبارك"
posted = "2006-07-16"
text = "مبارك رجل حكيم محب لمصر و لا يستمع لاصوات السفهاء، و هو يتحمل الكلام و النقد في مقابل حماية مصر، انتم يا من تريدون أن تستمتعوا باصوات الرصاص و الانفجارات و لا تتحملون تبعات احلامكم، عند اول مشكلة ستفرون وتهربون من أرض المعركة لانكم هناك بعيدا حيث الدولارات."
