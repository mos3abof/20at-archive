author = "سمير المصرى"
posted = "2006-07-18"
text = "لم يسلم مسلم او مسيجى من يد الكلب وابنه ابن الكلب لم يسلم المسيحيون ايضا من تلاعب ابنه فى الكنيسه ووقوفه مع واحد تعينى امريكى وبامر من امريكا فى الكنيسه المصريه >> حتى الدين لم يرحمه اولااد الكب لكن قبل تغير حسنى واتباعه يجب تغير الشعب كله مسلم و مسيحى لانه شعب بهايم لايوجد فيهم واحد بيفهم الا الاستاذ المحترم ابو الكرامه العرابيه ابو الشرف العربى كله عمر موسى ربنا يخليك يا استاذى لمصر فقط وليس لشعبها لانهم ناس متستهلش ..انهم رضو بلزل والهوان من الرئيس والحكومه مصر اتباعت اما اعين هذا الشعب وما زالت تباع ولم يتحرك كلب واحد من هذا الشعب..مصر اتباعت ولم يصحى هذا الشعب رفعو الاسعر وضمرو الخضار وضربو الثروه الداجنه ونهبو الكهرباء والمياه ولم يتحرك شعب ابن مرة وسخه ..وزات البله طين عندما ادان الكب بل الكلبين اتباع امريكا ادانو شرف الامه الممثل فى حزب الله ادانوووووه ..وساعدو اسرائل على ضرب حزب الله لاكن لالا..والف لا..لم احتمع حسنى وبوش ضدهم لاينفعهم شئ لان الله معهم ..الله معهم يا حسنى الله مع الاسلام اللى انت متعرفوش يا يهودى يا ابن الكب انت وحكومتك وشعبك المنيك ..اصح يا شعب وفوق من النوم"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

[[comments]]
order = 29
subject = "انتم بقى اللى رجاله؟"
author = "مصرى"
posted = "2006-07-18"
text = "خلى حسنى يعلن الحرب على اسرائيل. اول ناس مش هاتخلع شوية الجهلة المتخلفين اللى بيشتموا فى الموقع الاهبل ده . يا شويت بهايم مصر لو دخلت حرب هاتبقى لوحده محدش عنده استعداد يقف معانا وها ننضرب بالجزمه ذى ما حصل فى 67 واوسخ كمان علشان الحرب مش مع اسرائيل لوحدها. احنا لو حربنا دلوقتى ها نتفرم هانحارب اسرائيل وامريكا بريطانيا وكل ديولهم وهانبقى لوحدنا ومحدش ها ينفعنا . يبقى نعمل فيها عناتر ولا نفكر بالعقل . الحرب كده كده جايه بس كل حاجه ليها وقتها يا شوية بقر"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

[[comments]]
order = 30
subject = "اللي هيقول نص كلمه على مبارك هدمرله جهازه"
author = "ريـــــــــعــــــــوـوـوـو"
posted = "2006-07-18"
text = "الاخوة المصصريين اللي عامليين نفسهم بيفهموا سياسه ودموعهم هتنزل على الفلسطينييين لو مبارك وبيقولوا انهم عايششين فى فقر وـ وـ احب اقولهم ان مفيش اي شعب فى العرب عايش العيشه اللى موفرها مبارك سيبك انتا وهو من فلوس الخليج والحوارات دي دول اعفن شعب قولي بقى البطاله ومش عارف التعليم مبهدل وغيره وغيره اقولك ان امريكا نفسها 20 فى الميه من شبابها بيعانوا من البطاله وهي كلمه واحد كفايه انكم عايشين فى امان وبتصحى الصبح بتلاقي ابوك وامك واهلك سالميين غيرك مش لاقي كده واللي فاكر نفسه عنترة يروح يحارب اهي فلسطين مش بعيده 8 ساعات بعربيتك<br />انا هدخل على الموضوع ده تاني عاوز الأقي واحد افشخله ديك ام جهازه"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

[[comments]]
order = 31
subject = "بس يا أهطل"
author = "مواطن مصرى مغترب"
posted = "2006-07-18"
text = "الاخ الاهطل ريعو اللى عايش فى أمان و إطمئنان أكيد و أنتا صغير كانت العيال بتلزقك على قفاك فى المدرسة و بتأخد منك السندوتشات علشان كده لما كبرت عرفت النعمة الكبيرة نعمة الامان و المهم إنتا إستخدمت نفس أسلوب البلطجه اللى بيستخدمها أسيادك و عاوز تدمر جهاز اللى هيخالفك فى الرأى و ينتقد سيدك و تاجك راسك و اللى معيشك فى أمان يا أضبش الامان ده على حساب كرامتك و طبعا دى كلمة عاوزه شرح طويل لأمثالك و أكيد مش هتفهمها لأنها كلمة صعبة و مش بتتفهم لكن بتتولد مع الانسان يعنى تخيل كده الموقف ده معايا تخيل إن فى واحد بلطجى قالك أنا هأجى أغتصب أختك أو أمك كل يوم و هأجى كل يوم أخد الفلوس اللى معاك بس فى المقابل هأسيبك تعيش فى أمان أكيد طبعا واحد زيك هيوافق على الصفقة دى و مش كده و بس ده أنتا هتتوسل إليه أنك تتفرج عليه و هو بيغتصب أمك أو أختك .... مش بأقولك و إنتاصغير كنت بتتلزق على قفاك و العيال بياخدوا منك السندوتشات فى المدرسة"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"
