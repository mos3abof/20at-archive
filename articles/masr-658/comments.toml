text = "رجاء من الأخوة الذين يستخدموا الشتائم البذيئة أن تتذكروا اننا كمسلمين لايجب أن نستخدم هذا الاسلوب في التعليق ليس لآننا غير معترضين ولكن ليكون تعليقاتنا أكثر استفادة وبنائة ونتعلم اسلوب احترام رأي الاخرين دون التعرض للاخر لمجرد اختلاف وجهات النظر ....أعتفد أن القيم الدينية والاخلاق المصرية والعربية في اندثار نتيجة لعوامل عديدة لسنا بصددها الان ...ولكن ارجو ان يرقفع مستوي التعليق ياشعب الحضارة"
