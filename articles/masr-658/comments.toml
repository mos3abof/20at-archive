[[comments]]
order = 16
subject = "ياعيب الشوم عليك ياسيد حسن"
author = "المياسة"
posted = "2006-07-16"
text = "ايه اللي عملته يا استاز حسن...احنا ناقصين..غلطان حضرتك جدا جدا<br />وش هذا الله يهداك..تبي تودينا في هوشه يا حسن..انت غلطان وايد وايد<br />تبغى الخراب انت..لا لا ..انت غلطان مره مره<br />آش عملت يا حسن..ابغيت انروح بمصيبه...غلطان برشه برشه<br />يا زلمه شو صاير فيك..والله غلطان غلطان كثير كثير<br />ايش هذا اللي سويته يا حسن..انت بعقلك..لا..لآ..غلطان خيرات خيرات<br />الكلمات لوزراء الخارجيه العرب اطال الله في اعمارهم..هكذا رجوله والا فلا..<br />ما هذا يا حسن نصر الله..تختطف جنود اسرائيليين لمبادلتهم بآخرين لبنانيين وعرب,,,<br />اعتقدت انك( لا تشرب) كونك احد رموز المقاومه واحد رموز الدين... انت تتحدث عن دوله جاره صديقه تسعى الى السلام وتسعى انت الى العنف<br />الى متى تستبيح اسرائيل فتقصف مطاراتها واحيائها وابريائها..الى متى وانت تعيث في الارض فسادا...<br />اقترح انشاء صندوق خاص لاعادة تعمير اسرائيل ..فليشمر الشرفاء عن سواعدهم ..<br />الامير صلفاخ بن عبد العزيز...كم يا باشا..كم مليون...خمسين..قليل طال عمرك اخواننا الصهاينه تحت احتلال بحري بري جوي وانت تتبرع بخمسين بس..<br />ايوه يا سعادة الباشا..كم ..مصر تتبرع بخمسه واربعين..المهم متأكد انها من جيب الريس... عشت يا ريس<br />ايوه يا زلمه ..كم ..كويس سبعه واربعين..ارفع بعدها اسعار المحروقات عشان تعوضها...عمل الخير يخلفه رزق كثييييير<br />ايوه يا اخينا ..ايوه... اخينا خزن بقات عال العال وحيتبرع بتلاتين مليون .. تلاتين مليون..معلش خصخص كم قطاع ترجع لك التلاتين ميه وتلاتين...<br />رفعت اعمال القمه العربيه الطااااااااارئه...<br />انت يا نصر الله بدأت بالعدوان ...وستعرف اننا دول عربيه لا تقبل القهر والظلم ..ولا نامت اعين الجبناء..وحدودك يا اسرائيل من النيل الى الفرات..<br />فؤاد حيدر<br />صنعاء<br />cardi<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

