[[comments]]
order = 3
subject = "انتم بتتكلمو ازاى"
author = "الفرعون الصغير"
posted = "2006-07-15"
text = "بســــــ الله ــــــــم<br />ايه يا جماعه انتم بتتكلمو ازاى حرام عليكو والله حرام ايه الراجل عمل ايه لكل دا اأة فى فساد فى البلد اة فى كوسه اة فى كل حاجه<br />بالعقل كده رئيس الجمهوريه مسؤال عن ايه<br />السيايه الداخليه للبلد والسياسه الخارجيه<br />لو شوفنا السياسه الخارجيهاللى الرائيس مسؤال فيها مسؤليه كمله لوحده حنلاقى الاتى<br />ان مصر الحمدالله حفظها الله تتمتع بسمعه جميله بين كل الدول والحمد الله<br />نشوف السياسه الداخليه اللى مسؤليه فيها على الشعب والرئيس (الحكومه)<br />نشوف باقه حنلاقى فساد فى كل جه<br />تعليم تلاقى داخليه تلاقى زراعه تلاقى تعليم عالى ميضرش القوى العامله يبقه داخلنا فى الكوسه ويسلام باقه على الاسكان<br />كل دا تحت بند الشعب والحكومه يبقه الرئيس فين باقه طيب بالله عليكم لو السيد الرئيس دا مات والله حتقولو فين زمان اللى فات والله حتقولو كده يا جماعه انامرة سألة واحد كبير (سائق تاكسى ) قولته ايه رايك لو مصر باقه دولة اسلاميه تتبع المنهج الاسلامى فى كل شئ قالى يا بنى انتا متعرفشى البلد دي ماشيه ازاى<br />يبقه كل واحد عاجبه الكلام والكلام على مزاجه يقول كده<br />على فكره اللى انا ملاحظة فى الموقع وبكل امانة انه بيعتمد على عجرفه وانعدام كامل للعدله فى طرح المواضيع يا جماعه يا ريت مش كل واحد يعلق اخطأة على شماعة الرئيس او اخطأغيره<br />ارجو ذلك<br />شكراا"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

[[comments]]
order = 4
subject = "أمال نلوم مين يا عم الفرعون"
author = "عابر القارات"
posted = "2006-07-16"
text = "الى أخى الفرعون الصغير (و لو أن لم أكن أتخيل أن يكون لى أخ من الفراعنة) فى تحليلك الشيق حاولت أن ترفع اللوم عن السيد الرئيس و هذا فى حد ذاته أمر يستحق الاحترام و ذلك فى سياق تقبلنا للرأى الأخر و لكن فى تحليلك أغفلت الاتى:<br />1 - فرقت بين الرئيس فى جانب و الشعب و الحكومة فى جانب أخر و هنا أسألك هل الرئيس منفصل عن الحكومة!! هل الشعب فعلا هو الذى يدير الشئون الداخلية حتى يمكن لومه؟؟؟ أقولك لك أيضا الاجابة كلامك ممكن أن يكون صحيحا لو كانت الحكومة منتخبة فبذلك يكون الشعب هو صاحب الكلمة فى وجودها من عدمه لكن فى حالتنا فى مصر التى لا هى تتبع النظام الرئاسى كما فى أمريكا مثلا و حينها نقول عليه إدارة و ليست حكومة و لا هى تتبع النظام الوزارى كما هو الحال فى إنجلترا مثلا و لكن فى مصر نتبع النظام البطيخى أى أن الرئيس يعين الوزراء بدون أى أساس للتعيين بمعنى من يرى الرئيس و الرئيس فقط هو و الجهات السيادية الاخرى أنه يصلح هو الذى يعين فبذلك أصبحت مصر حقل تجارب و أصبح كل من هب و دب ممكن يصبح وزير سواء بيفهم أو ما بيفهمش سواء عنده خبرة أو وزير تحت التمرين و بذلك لا يمكن إعتبار أن الشعب قد تدخل من قريب أو بعيد فى أى أختيار من أى نوع و الأصح أن نتبع أى من النظامين سالفى الذكر<br />2- هل تعتقد أن الرئيس قد أصبح مسئولا مسئوليه كامله عن الملف الخارجى !! هذا الافتراض خاطئ و يدين الرئيس أكثر مما يمجده و يثنى عليه و ذلك لسبب بسيط و هو أن الانفراد بالقرارت سواء الخارجية أو الداخلية من سمات الديكتاتورية و هذا ما ننفيه طبعا عن رئيسنا المحبوب و لسبب أخر و هو إفتراض أن العوامل الخارجية منفصلة تماما عن الشئون الداخلية و هذا إفتراض خاطئ أخر لأننا نعيش فى وسط عالم إذا عطس فيه بوش تأثرت أسعار البنزين فى ترينيداد<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

[[comments]]
order = 5
subject = "سامحونا يا عرب .. إحنا متباعين ...."
author = "http://ibnbahya.blogspot.com"
posted = "2006-07-16"
text = "إنه أمر طبيعي وغير مستغرب ما يحدث من النظام المصري الخائن .. الموضوع منتهي يا جماعة .. حسني مبارك وعصابته باعوا البلد من زمان وقبضوا العمولات من الصهاينة الأمريكاني .. الموضوع منتهي .. العجيب أن إخواننا في الدول العربية عاتبين علينا .. طيب ليه تعتبوا علينا وإحنا أصلا متباعين يا جماعه .. يا إخواننا العرب .. إحنا عبيد في سوق النخاسة .. لا تلومونا على شيء لا نقدر عليه .. حسني الكلب باع البلد وباع الشرف وخلصت .. ولو كان فيكم قوة لسألناكم المساعدة كي نتخلص من ذلك الخائن وعصابته ... تعرفوا يا رجاله أن نظام مبارك ورجال أعماله الكلاب والعصابات التي تسرح وتمرح في البلد عملوا إيه طول ربع قرن حكمه الكلب ؟؟؟ باعوا آلاف المصانع والمزارع والبيوت والشركات لليهود ... يعني بعد كام سنه كده هييجي اليهود عندنا عشان يعيشوا في ملكهم .. وبعد كام سنة كمان هنبقى زي إخواننا الفلسطينيين .. بس يا ترى ساعتها راح نعمل إيه ونروح فين ؟؟؟ حد فكر في السؤال ده ؟؟؟؟ بيع يا ريس .. بيع يا كلب .. ربنا يهدك ويهدم ملكك ويشرد أهلك ويهتك عرضك .. إذا كان عندك عرض أصلاً يا عرص<br />http://ibnbahya.blogspot.com"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

[[comments]]
order = 6
subject = "مصر & مبارك = ONE"
author = "midoo El masry"
posted = "2006-07-16"
text = "سلمت اناملك ويداك يا فرعون...<br />اللى ما يعرفش يقوول عدس احنا فاكرين ان مصر أوروبا ولا أمريكا فيها كنوز ومحرومين منها.. يكفى انك يا مصرى بتأكل وتنام وتعيش .. بص حواليك يا أعمى شوف المجاعات اللى حواليك.. ياأخى لو مبارك حرامى زى ما بتقول يعد أطهر وأحسن حرامى.<br />على الاقل حامى مصر بسياسته الخارجية.. وكل مشاكل العرب . هو أول من يسؤل ويستشار.. يا جماعة مبارك احسن من غيره..<br />والله أحسن من غيره.. انا نفسى بصراحة نعيش عصر السادات وبس وما ينفعنا واحد غير السادات وبس.. يا جماعة ثلثى الشعب المصرى عاوز مبارك وبيحبة.. مشكلة الاقليةهم مسؤولون عنها..<br />(مواطن مصرى يحب مصر ويحترم عقلية مبارك)"
