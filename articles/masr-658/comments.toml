[[comments]]
order = 21
subject = "أهلا يا أبو شريف"
author = "تحية خاصة لأبو شريف"
posted = "2006-07-16"
text = "إن كنت أبو شريف اللي في بالي فأنا جدا سعيد إن ربنا هداك وبطلت تسبيح بحمد السادات الكافر وخليفته الأكفر. وإن كنت واحد تاني ندعو الله يهدي خلقه لما فيه مصلحة مصر والأمة العربية.<br />ياسيد أبو شريف فعلا إزاي بلد زي الهند كانت لعهد قريب بلد المجاعات بقت مصدرة للقمح والغلال؟ والهند أراضيها ضعيفة الخصوبة وسكانها تعدادهم مليار؟ ياريت بدل منروح نستورد المسرطن من إسرائيل نتعلم منهم. في جامعة القاهرة وحدها أعرف من برفيسور زميلي فيه أكثر من أربعين بحث مركونة على الرف كلها تبحث في إمكانية كفاية مصر لنفسها من إنتاج القمح بمدة أقصاها ثلاث سنين، لكن الريس رفضها كلها وطارد الباحثين وسود عيشهم. يبقى سياسة تجويعنا وربطنا بأمريكا ومعونة القمح سياسة عليا للدولة. وده ينطبق على كل مصادر الإنتاج في البلد. سؤالي ليك ماهي إذن الخيانة العظمى؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

