[[comments]]
order = 23
subject = "من القلب"
author = "يا مبارك بقولك من القلب كفاية إللى عملته وياريت تحترم سنك وتحترم رغبة الشعب الرافض لك وتترك الحياة السياسية فأنت فاشل ونحن لسنا فأران للتجارب حتى تجرب فينا فسادك ألم يكفيك ما نهبته من مصر هل ستأخذه معاك فى القبر ألم يكفيك الجاه والسلطان والعز الذى تعيش فيه من أموال الشعب المسكين ألم يكفيك التخلف الذى ننحدر إليه كل يوم فى عهدك البائس لن أقول لك أعد ما نهبت لمصر فمثلك لا يملك الضمير لفعل ذلك ولك سأقول كفاية عليك هذا ولترحل غير مأسوف عليك ولنغلق هذا الصفحة السوداء من حياتنا وما بيننا وبينك هو حق الله ودعاء الشعب عليك اللهم تقبل يارحمن يارحيم"
posted = "2006-07-17"
text = "ً"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

[[comments]]
order = 24
subject = "حصاد مصر في عهد مبارك"
author = "حصاد مصر في عهد مبارك"
posted = "2006-07-17"
text = "الأحوال المالية ديون : إجمالي 614 مليار جنيهالفقر : 35% من الشعب تحت خط الفقر,أقل من1 دولار في اليومنقود مهربة : 300 مليار دولار خرجت من البلاد<br />الجنيه المصري : الدولار= 85 قرش سنة1981م و 6 جنيهات سنة 2005<br />مالأحوال الصحيةالسرطان : تضاعف 8 مرات .أعلى نسبة في العالم الذبحة الصدرية :20 % من الحالات شباب تحت الأربعين البلهارسيا : أعلى نسبة في العالم السكر : ‏7‏ ملايين .. ‏10 %‏ تقريبا من عدد السكان إلتهاب كبدي : 13 مليون.. 20 % من الشعب فشل كلوي : أعلى نسبة في العالم شلل الأطفال : موجود في 6 دول في العالم فقط منهم مصرالإكتئاب : ‏20‏ مليون مواطن أمراض نفسية ( أخرى) : ‏6‏ ملايين<br />التدخين : 80% من البالغين مدخنين التلوث : أعلى نسبة في العالم...تلوث للهواء ومياه الشرب والتدهور في التربة والمناطق الساحلية..خسائر 30 مليار جنيهالانفاق الحكومي: 10 دولار للفرد سنوياًالأحوال الاجتماعيةالقضايا : 20 مليون قضية بالمحاكم ..أقدمها من 38 عام حتى الاّن البطالة : 29% من القادرين على العمل..حوالي 5 مليون شاب<br />الانتحار : 3 اّلاف محاولة سنوي<br />اًحوادث الطرق : 6 آلاف قتيل سنويا و 23 الف مصاب الطلاق : 28%العنوسة : 7 مليون عانس .. 4 مليون فوق 35 عامالهجرة : 4 ملايين مهاجر : 820 ألفاً من الكفاءات و 2500 عالم في تخصصات شديدة الأهمية.. 6 ملايين طلب هجرة للولايات المتحدة وحدها سنة 2005الأُمية ( الحالية) : 26% من الشعب المصريالأُمية ( المستقبلية) : 7% من الأطفال لا يدخلون المدارس ..غير الهاربين بعد الدخولالتعليم : دروس خصوصية ، كتب خارجية ، جامعات خاصة للربح فقط عمالة<br />الأطفال : نصف مليون طفل أطفال الشوارع : تقربر الأمم المتحدة : 100 ألف طفل عشوائيات : 45% من الشعب يسكن العشوائيات<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011024/http://masr.20at.com:80/article.php?sid=658"

