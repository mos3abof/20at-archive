posted = "2009-05-11"
text = "السلام عليكم<br />مع احترامي للكاتبة والع[ *** ] للمكتوب عنه<br />انضمام المدعو للمنار يوضح أنه يبيع كلمته لمن قد هلل له وقال عنه هذا سيدي<br />نفسي يعطى أي كاتب أو صحفي مدعي من هؤلاء سلاح ونقوله حارب<br />ويورينا البطولات<br />لو كان من هلل له وقال عنه أنه سيده رجل بحق لكان دافع عن فلسطين في آخر دكة<br />مش جبان وعايزنا احنا الي نحارب وبيغني على المعابر …<br />أدعياء الشرف والكرامة وخونة الوطن ومحاسيب الأعداء لن يكونوا أبدا لا أول ولا آخر الرجال المخترمين"
archived = "2009-05-16"
