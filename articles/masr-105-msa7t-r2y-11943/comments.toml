text = "اخر الاخبار عن اخر الرجال المحترمين انة سيذيع برنامجة عن طريق قناة المنار وانة سيوقع العقد خلال ساعات على حسب جريدة المصريون واظن انة لو تم ذلك ستغلق مصر قناة المنار من على النايل سات وتظل على عرب سات والقمر الاروبى"
