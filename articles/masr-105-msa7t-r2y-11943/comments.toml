author = "سعيد عطيه"
posted = "2009-05-03"
text = "بصراحة انا اختلف مع صاحبة المقال في كل حرف كتبته<br />فهذا القنديل محترف ركوب للموجة الغالبة ، ففي الستينات كان من اكبر المطنطنين لعبد الناصر الذي كان لا يتورع عن البطش بنصف الشعب مقابل تحقيق امنه الشخصي ، حتى ولو تلاعب به صلاح نصر<br />وكان يذهب الى المعتقلات ليذيع على التلفزيون المصري ( الذي يستجدي قنديل العودة اليه الآن ) الإعترافات المزعومة التي كانت تنتزع من الأبرياء تحت وطأة تعذيب مهول .<br />و في احدى المرات قام قنديلكم بتعنيف بعض زبانية التعذيب عندما اتوا اليه بأحد المعتقلين ليصوره ، و هو يعترف على الهواء بما كان يريد عبد الناصر ، فلاحظ قنديلكم الهمام وجود جرح دامي في وجه المعتقل المسكين ، فثار في وجه الزبانية لأنهم اتوا اليه بمعتقل لا يستطيع تصويره ، لأن إصابات المعاملة الحسنة بادية على وجهه !!<br />كل ما في الأمر ان هذا القنديل يحاول الآن ركوب موجة المعارضة ."
archived = "2009-05-16"
capture_url = "https://web.archive.org/web/20090516010058/http://www.20at.com:80/masr/105-msa7t-r2y/11943-2009-05-03-10-04-08.html"

