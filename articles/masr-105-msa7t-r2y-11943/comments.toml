text = "يا سعيد عطية<br />حمدي قنديل بياكل عيش<br />وصاحبة المقال بتاكل عيش<br />وانت بتاكل عيش<br />وانا باكل عيش<br />بس اكل العيش بيفرق من انسان لانسان<br />فيه ناس بتاكل اللقمه متعاصه جبنه وحلاوه<br />وفيه ناس بتاكلها متعاصه بالدم"
