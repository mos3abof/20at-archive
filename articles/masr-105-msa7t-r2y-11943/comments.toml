author = "مصطفى القناوى"
posted = "2009-05-06"
text = "انتقاد حمدى قنديل فى برنامج من على قناة دبى او من على قناة الليبية او على قناة المنار هيعمل اية ؟<br />ماهى خربانة خربانة خربانة خربانة خربانة خربانة خربانة<br />واصبحت لا ينفع معاها رجال محترمين ولا رجال اندال<br />اصبحت بلد عندها شلل رباعى ونايمة على سرير الانعاش عايشة على انبوبة الا[ *** ]جين وحقن المقويات وحقن السليكون لنفخ تجاعيد الوجة وضربات المدلك على العضلات المهترئة والمسوسة<br />كلام حمدى قنديل هيعمل اية ؟<br />الافضل يقعد فى لندن ساكت يحضر حفلات السفارات وسهرات رجال الاعمال الصاخبة التى يعملوها فى لندن بعيدا عن العيون المتطفلة من الشعب الفقير<br />الرجال المحترمين يا ست ولاء مكانهم صفحات الكتب لانهم ماتوا من زمان<br />صدقينى البلد مفيش فيها ولا راجل يملى العين<br />كلهم ماتوا"
archived = "2009-05-16"
capture_url = "https://web.archive.org/web/20090516010058/http://www.20at.com:80/masr/105-msa7t-r2y/11943-2009-05-03-10-04-08.html"

