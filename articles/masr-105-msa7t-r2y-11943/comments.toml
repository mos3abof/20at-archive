author = "مش فاسوخة"
posted = "2009-05-04"
text = "اخر الرجال المحترمين والمحترمين جدا<br />هو اى واحد بيقول الحقيقة بيبقى وحش - دمة تقيل - واحد بيقول لنا احنا وصلنا لغاية فين<br />انا فى المدينة الصغيرة التى اعيش فيها -00الملك فاروق فى عهدة السعيد تم بناء عدد اتنين محلج قطن ومضرب ارز وحينما اتى بتوع انقلاب يوليو بنى عزيز صدقى مصنع نسيج اما فى عصر الاصلاح الاقتصادى فقد تم بيع محالج القطن لمثتثمر باع ارضهم قطع بناء وقامت عمارات فوقها لانة تم منع زراعة القطن فى مصر ومضرب الارز اغلق بالضبة والمفتاح اما مصنع النسيج بتاع عزيز صدقى فمكائنة بيعت خردة وارضة اصبحت مكان محطة مياة تبنى بالمعونة الامريكية<br />الراجل بيقول الحقيقة المجردة وليس منافق بيقول انتم رايحين فى داهية - بيقول اننا بنبيع اللى عملة الاباء والاجداد وكان مصر قررت ان تعزل وتمشى من المكان دة فبتبيع كل حاجة<br />الراجل بيكشف الزيف والغشاوة عن العيون المغمضة<br />انة اخر الرجال المحترمين"
archived = "2009-05-16"
capture_url = "https://web.archive.org/web/20090516010058/http://www.20at.com:80/masr/105-msa7t-r2y/11943-2009-05-03-10-04-08.html"

