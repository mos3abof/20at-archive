author = "Nounna0"
posted = "2010-02-14"
text = "اوعوا يا بنات تسيبوا حقوقكوا دى أمانة، أنا برضه زمان كنت بخاف و أسمع كلام من نوع فضيحة و عيب انما وصلت لمرحلة انى بتعب نفسيا وده كله علشان كلب مريض نفسيا (عذرا).<br />لحد لما اتعلمت اشيل معايا سلاح حاد ده لو لسانى مساعدنيش و صدقونى يا بنات هتحسوا براحة لما توقفوا المرضى دول عند حدهم<br />و محدش هياخدلك حقك انتى اللى لازم تدافعى عن نفسك فى زمن ماتت فيه الرجالة فى الحرب (مش كلهم بس الغالبية).<br />ممكن الناس تقول عليكى مش بنت ناس أو مش متربية،ميهمكيش منهم حاجة لأنهم مبينفعوش واحدة لما حد بتحرش بيها ولا بياخدوا حقها.<br />و لو ازمت من حقك تاخدى الواحد ده (سورى من قفاه) على أقرب قسم شرطة و انتى صاحبة الحق متخافيش و متستضعفيش علشان محدش يغلبك..<br />ربنا معانا و يحفظنا كلنا من كلاب السكك."
archived = "2010-02-27"
capture_url = "https://web.archive.org/web/20100227162132/http://www.20at.com:80/banat/variety/14534--126-.html"
