text = "انا حبيت فعلا الموضوع بس انا كان عندى صحاب وفجاه ومبقاش عندى حتى لما دخلت الكليه حبيت اعمل صداقه وعملت بس اتخدعت فيهم اوى وكل لما اصاحب حد اتخدع فيهم ومش عارفه بجد الاقى الصديقه الكويسه بجد مغظم الصداقات بتكون عشان المصلحه او بتكون زماله وبس وهموت ويبقا عندى اصحاب ومش عارفه اعمل اى انا من النوع اللى بقدر الصحوبيه جامد بس مش بلاقى حد يقدر صحبيتى ونفسى يكون ليه اصحاب كويسين اقدر اعتمد عليهم ويكونوا معايا على طول انا حاسه انى لما اتخطب مش هلاقى حد فخطبوبتى بجد احساس الواحد من غير اصحاب ده احساس وحش جدا ويارب كل واحده عندها صحبه كويسه تحاول متضيعهاش من ايديها لانها نعمه من ربنا"
