author = "عبد الكريم حسين"
posted = "2008-03-09"
text = "بسم الله الرحمن الرحيم …الأخوة الأعزاء …بعد التحية ؛ ماذا أقول في تعليقي عن قصيدة ( صلوات في هيكل الحب ) ؟! إنها رائعة بكل المقاييس ، أبو القاسم الشابي …شاعر تونس …شاعر الحب …شاعر الإرادة…رحمه الله ، هو من أقوى الشعراء في عصره ، وصلوات في هيكل الحب أكبر دليل على ذلك . وبحكم أنني مطرب وملحن فقد قمت بتلحينها في شكل لا يقل روعة عن القصيدة نفسها (لا أمدح نفسي )!!!! ولكنها الحقيقة . وكم أتمنى أن ينال هذا اللحن فرصته للظهور . لقد سمعت القصيدة ملحنة قديماً ، ولكن اللحن لم يعجبني ، لذلك قمت بتلحينها بشكل يواكب العصر الذي نعيشه ، بالطبع ليس كالأغاني المائعة التي نسمعها !!! مع فائق احترامي وتقديري للجميع .<br />والسلام عليكم ورحمة الله وبركاته<br />عبد الكريم حسين ( مطرب وملحن )"
