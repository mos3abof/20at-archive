[[comments]]
order = 11
subject = ""
author = "عائض"
posted = "2009-03-25"
text = "استبعد مدرب المنتخب السعودي الأول لكرة القدم البرتغالي جوزيه بوسيرو قائد المنتخب ياسر القحطاني من معسكر \"الأخضر\" المقام حالياً في مدينة الرياض تمهيداً للقاء إيران السبت المقبل ضمن التصفيات القارية النهائية المؤهلة الى كأس العالم في جنوب افريقيا 2010.<br />وجاء قرار بوسيرو إثر تغيّب القحطاني عن تدريبات المنتخب الأربعاء 25-03-2009 والتي جرت على ملعب الملك فهد الدولي.<br />وكان المدرب واللاعبون يترقبون انضمام ياسر القحطاني كونه اليوم المحدد له بعد مشاركته مع فريقه الهلال أمام نادي الوحدة اول من أمس.<br />ولكن القحطاني لم يحضر الأمر الذي أغضب المدرب وقرر إبعاده عن المنتخب وهو الخبر الذي نقله مدير المنتخب السعودي فهد المصيبيح للصحافيين أمس وقال: \"قرر المدرب إبعاد ياسر القحطاني بعد تغيبه عن التدريب واتصلنا باللاعب مراراً وتكراراً ولكن جواله الخاص مغلق ولم نتمكن الوصول إليه\".<br />وأضاف المصيبيح \"نحن نشدد على الانضباط، والوضع الراهن لياسر القحطاني مشابه لحالة خالد عزيز عندما خرج من معسكر المنتخب\".<br />وحول إيقافه بسبب تغيبه عن المنتخب رد المصيبيح \"دورنا ينتهي بالإبعاد من المنتخب، وهو قرار المدرب بوسيرو ولكن قرار إيقافه يتخذه المسؤولون عن الرياضة السعودية\".<br />ورفض مدير المنتخب التحدث عن الأسباب التي أدت إلى تغيّب اللاعب عن التدريب، مكتفياً بقوله إنه تم الاتصال به ولكن جواله مغلق.<br />وكان المدافع الأيسر حسين عبدالغني انضم إلى المنتخب أمس بعد فراغه من المشاركة مع فريقه نيوشاتل السويسري إلى جانب عبدالملك الخيبري، ولكن الأخير لم يتدرب بسبب شعوره بكدمة خفيفة"
archived = "2009-04-16"
capture_url = "https://web.archive.org/web/20090416230729/http://www.20at.com:80/ana-s3ody/11709-2009-04-14-14-18-11.html"

