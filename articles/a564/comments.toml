subject = "موضوع رائع"
text = "بسم الله الرحمن الرحيم<br />كان الله في عون الأسرى، هذه دعوتنا ونرفقها بدعوة للعرب وتحديدا للشباب الذين سقع على عاتقهم عبء نقل القضية، لن نعدوكم للصوم بل لنشر واقع الاسرى كما يعكسه هذا التقرير، الذي نتقدم بكل الشكر لمعده \"سعيد أبو معلا\".<br />فلسطيني"
