subject = ">>\"أم بشار\" أول شهيدة في إضراب الأ"
text = "استشهدت الفلسطينية عائشة محمد حمدان الزبن (أم بشار) -53 عاما- والدة المعتقل عمار حامد الزبن من مدينة نابلس، في خيمة الاعتصام التي أقيمت في دوار الشهداء بالمدينة تضامنا مع الأسرى الفلسطينيين المضربين عن الطعام بالسجون الإسرائيلية منذ يوم 15-8-2004.<br />وكانت أم بشار قد أعلنت إضرابها في أول يوم من إعلان الإضراب تضامنا مع ابنها عمار المعتقل في سجن \"هدار يم\" الإسرائيلي منذ 4 سنوات وغيره من الأسرى. وكان عمار قد حكم عليه بالسجن لمدة 27 مؤبدًا، بتهمة الانتماء إلى كتائب الشهيد عز الدين القسام الجناح العسكري لحركة المقاومة الإسلامية (حماس).<br />وفي مقابلة لـ\"إسلام أون لاين.نت\"، قالت ميرفت الزبن ابنة الشهيدة: \"لقد أعلنت أمي إضرابها عن الطعام، بالرغم من تردي حالتها الصحية، وكانت تشعر بالارتياح حينما تذهب إلى خيمة الاعتصام\".<br />وتضيف ميرفت: \"نصحنا أمي مرارا بأن تقلع عن الإضراب بسبب وضعها الصحي، إلا أن حبها الشديد لعمار زاد من عزيمتها وإرادتها التي لم يقهرها بها الاحتلال حين قتل ابنها الكبير بشار عام 94\".<br />وتابعت قائلة: \"تسبب الإضراب في ازدياد حالة أمي سوءا وأجري لها عملية قسطرة لتوسيع شرايين قلبها التي انسدت أربعة منها، إلا أن هذه العملية فشلت مما أدى إلى وفاتها\".<br />وأضافت: \"عمار لم يعرف إلى الآن بنبأ استشهاد أمه؛ فالاتصال معه منقطع منذ فترة، خصوصا أن القوات الإسرائيلية وضعته رهن الاعتقال الانفرادي\".<br />ولأم بشار بنتان وثلاثة أبناء من بينهم الشهيد بشار الذي اغتالته القوات الإسرائيلية أثناء مواجهات دارت مع الشباب الفلسطيني أمام مستشفى الوطني وسط مدينة نابلس عام 1994، وعمار ومحمد المعتقلان لدى قوات الاحتلال.<br />واعتبرت الهيئة العليا لمتابعة شؤون الأسرى في نابلس أن \"أم بشار\" أول شهيدة في الإضراب.<br />وقالت نغم الخياط عضو الهيئة في اتصال هاتفي لـ\"إسلام أون لاين.نت\": \"كلنا مع أم بشار التي بذلت أغلى ما تملك في سبيل الله أولا، وثانيا من أجل حرية ابنها، وستقوم الهيئة بعمل فعاليات تضامنية معها ومع ابنها الأسير عمار الزبن\".<br />ومن جانبه قال الشيخ حامد البيتاوي رئيس رابطة علماء فلسطين وخطيب المسجد الأقصى سابقا: \"نسأل الله أن تكون أم بشار من الشهداء عند الله\"، مؤكدا أن استشهاد أم بشار \"لن يضعف من عزيمة الشعب الفلسطيني، بل سيثبت موقفه ويدعم قضيته العادلة، بما فيها قضية الأسرى الفلسطينيين، كما أن تضامن الأهالي مع أسراهم لن يقل، فإرادة هذا الشعب لن تكسر باستشهاد أم فلسطينية لأسير\".<br />وبدأ نحو 1700 معتقل يوم 15-8-2004 إضرابا مفتوحا عن الطعام للمطالبة بوقف عمليات التفتيش التي يجري فيها تجريدهم من ملابسهم، وزيادة الزيارات المسموح بها لأسرهم، وتحسين أوضاعهم الصحية.<br />لكن سلطات الاحتلال رفضت هذه المطالب، وقال وزير الأمن الإسرائيلي تساحي هنجبي: \"إن الأسرى بإمكانهم الإضراب حتى الموت\". وبلغ عدد الأسرى المضربين حتى الآن نحو 4000 من أصل حوالي 7 آلاف و200 أسير تعتقلهم إسرائيل.<br />المقال نقلا عن إسلام أون لاين"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022140957/http://www.20at.com:80/article.php?sid=564"
