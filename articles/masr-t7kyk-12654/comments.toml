[[comments]]
order = 5
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-07-16"
text = "فتشو عن مهازل سفيرنا السابق(محمد بسيونى) فى أسرائيل؟<br />علاقات و تحرشات مع راقصاتو بنات ليل و بائعات هوى<br />و أيضا تلفيق اتهامات كازبة منحطة ضد مواطنين مصريين كانو فى اسرائيل نكاية بهم و غيظا منهم و حقدا عليهم بانهم قد طلبوا (اللجوء السياسى)لدولة أسرائيل؟<br />و منهم المواطن المصرى السكندرى (ممدوح زكى زخارى جرجس)؟<br />و المدرج على قوائم الممنوعين من السفر نتيجة لكذب ذلك السفير(السابق) المنافق<br />(حسبى اللة و نعم الوكيل)"
archived = "2009-07-17"
capture_url = "https://web.archive.org/web/20090717032529/http://www.20at.com:80/masr/t7kyk/12654-2009-07-14-15-16-04.html"

[[comments]]
order = 6
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-07-16"
text = "و زارة (الفضائح المصرية)<br />هذا هو الاسم الذى يجب ان تسمى بة (وزارة الخارجية) المصرية<br />و كفى فضيحة (السفير) المغوار الحرامى اللى بيمثل مصر فى (وارسو) بولندا؟!!!<br />فضحتونا يا كلاب يا ولاد الكلاب"
archived = "2009-07-17"
capture_url = "https://web.archive.org/web/20090717032529/http://www.20at.com:80/masr/t7kyk/12654-2009-07-14-15-16-04.html"

