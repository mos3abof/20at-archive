author = "مصرى غبى"
posted = "2009-07-14"
text = "هو النظام المصرى معلموش شعارة السرمدى الابدى لا ارى لا اسمع لا اتكلم<br />وانة علشان ياكل عيش لازم ما لوش دعوة باى حاجة والا يرجع يقعد جنب امة<br />متنفعش الفرعنة فى بلاد الغير<br />ومحدش يقول لى عرب<br />فالعرب لا يحتقرون فى الجنسيات العربية غير المصرى<br />ودى حقيقة مرة اوصلنا اليها رجال السياسة بتوع بلدنا ولاد [ *** ]"
archived = "2009-07-17"
capture_url = "https://web.archive.org/web/20090717032529/http://www.20at.com:80/masr/t7kyk/12654-2009-07-14-15-16-04.html"

