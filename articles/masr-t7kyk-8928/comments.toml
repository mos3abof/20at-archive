[[comments]]
order = 1
subject = ""
author = "مش بحبك"
posted = "2008-04-29"
text = "هو اصله الكاتب مش عارف ايه دا واحد مصري زيه زي اي مصري بيحلم يعمل مليون جنيه او بيحلم بضربة العمر اللي تخلصه من الفقر وسنينه<br />زي البت دي اللي عملت اضراب ولا الواد اللي قاطع رئيس الوزرا<br />لازم الواحد يعمل فتك علشان خاطر يكسب فلوس<br />كمان الكاتب بقا عايز يعمل فتك اوي<br />فسمى الكتاب مصر دي مش امي دي مرات ابويا<br />ايه الفتاكه دي يا روح امك<br />يلا بقا انزلوا يا مصريين اشتروا الكتاب وخلصوه من السوق خلي الواد الفتك اوي يكسبلوا قرشين كويسين"
archived = "2009-11-01"
capture_url = "https://web.archive.org/web/20091101113422/http://www.20at.com:80/masr/t7kyk/8928.html"

[[comments]]
order = 2
subject = ""
author = "برضة مصرى"
posted = "2008-04-29"
text = "ماذا اصبحت مصر فى العشر سنين الاخيرة ؟<br />اصبحت دولة تدار بواسطة مجموعة من المحتكرين والرأسمالية الطفيلية تسخر لخدمتها جهاز امن مكون مليون ونصف عسكرى امن مركزى ومباحث امن دولة اكثر من نصف مليون ويجندون بلطجية يقدرون بعشرات الالوف يعملون كمرشدين للامن وايدى ضاربة لهم<br />فأذا اراد ضابط شرطة ان يقتل مواطنا او يضربة سلط علية مجموعة من البلطجية يضربونة علقة موت ثم يتدخل الضابط ليثبت الحالة مشاجرة فى الشارع او داخل الزنزانة<br />ومباحث امن الدولة تستعين بالبلطجية لافساد انتخابات او تفريق مظاهرة او ضرب طلبة الجامعة داخل الحرم الجامعى<br />البلطجية يعملون تحت اسم المرشدين مع الشرطة<br />والبلطجية يفرضون اتاوات على الناس ويجمعون اتاوات بالقوة فى حماية الشرطة<br />واى ضابط مش عايز اى احد يصورة وهو بيعذب مواطن او بيسحلة او يحط العصاية بمؤخرتة كما شاهدنا فى الاعلام او المدونات فبيتجنب هذا ويلجأ الى البلطجية<br />والبلطجية يجلسون على المقاهى ويبيعون البانجو ويفرضون اتاوات على سواقى الميكروباص لصالح ضباط الشرطة او احد امناء الشرطة<br />مصر خلاص<br />مفيش احد بيشتغل - تنزل الساعة 3 صباحا الشارع تلاقى الناس قاعدة على المقاهى وحركة الشارع كاننا العصر<br />الزبالة فى كل مكان<br />والفساد فى كل مكان<br />ولا حول ولا قوة الا باللة"
archived = "2009-11-01"
capture_url = "https://web.archive.org/web/20091101113422/http://www.20at.com:80/masr/t7kyk/8928.html"

