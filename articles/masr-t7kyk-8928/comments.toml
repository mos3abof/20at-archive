text = "فى حديثه بقناة الجزيرة فى سبتمبر 2004 قال الأستاذ محمد حسنين هيكل أنه خلال الثلاثين سنة الأخيرة حصلت مصر على 150 مليار دولارعلى شكل منح وقروض وهبات .. صرف منها حوالى 12 مليار دولارعلى مشاريع البنية الأساسية وستة مليارات دولارعلى مشروع مترو الأنفاق .. ومصيرالمبلغ الباقى غير واضح !!!! أين ذهب هذا المبلغ الضخم وهو \\\" 130 مليار دولار\\\" ؟…؟<br />ارجو من كل من يقراء هذا ان يزور ( مقالات ثقافة الهزيمة) فى هذا الرابط:<br />www.ouregypt.us"
