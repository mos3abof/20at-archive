[[comments]]
order = 5
subject = ""
author = "ابومحسن غربة 26 سنه"
posted = "2008-04-29"
text = "هناك ما يدعو الى التفاؤل الا وهو النبي محمد صلى الله عليه وسلم وسيرته النبوية العطرة<br />ونقرأ حالة الجزيرة العربية قبل البعثة المحمدية الحالة الاجتماعية والسياسية<br />ونقرا في السيرة النبوية البعثة المحمدية 23 سنه كيف نظم النبي محمد صلى اله عليه وسلم همج الجزيرة العربية<br />ونقرا حال الجزيرة العربية بعد انتهاء مهمة النبي صلى الله عليه وسلم وفي اقل من مائة عام كانت الدولة من اسبانيا الى الهند<br />كيف غير النبي محمد صلى الله عليه وسلم همج الجزيرة العربية الى صناع الحضارة العربية الاسلامية على مدار 1000 عام الف عام حكم العرب نصف العالم<br />من هنا نبدأ هذا اول الخيط<br />وبعدين للاخ اللي مألف هذا الكتاب بعد غربة 5 سنين<br />انا بقى غربة 26 سنه وما عنديش غير هذه القصيدة<br />مصر هي أمي ..<br />مصر هي أمي .. نيلها هو دمي<br />شمسها ف سماري .. شكلها ف ملامحي<br />و إن كان لوني قمحي .. ده من فضل مصر<br />ما تلاقيش مثالها .. ست كل عصر<br />عشة جنب نيلها .. تسوى ألف قصر<br />ولا وردة بلدي .. فيها عطر مصر<br />ولا سحر مصر .. ولا جو مصر<br />ولا .. ولا .. ولا<br />ده شئ ملهش حصر<br />.. روحوا زوروا مصر<br />و إنتوا تعذروني .. لما أقول يا مصر<br />مصر .. مصر .. مصر<br />فاتك نص عمرك ياللي ما شفت مصر<br />ده التاريخ ف مصر .. و الهرم ف مصر .. و الكرم ف مصر<br />و الحلوين ف مصر .. و الجدعان ف مصر<br />ادوني عصاية .. أرقص رقص مصر<br />.. روحوا زوروا مصر<br />و انتوا تعذروني .. لما أقول يا مصر<br />الحمد والشكر لله على كل حال ونعوذ بالله من حال اهل النار"
archived = "2009-11-01"
capture_url = "https://web.archive.org/web/20091101113422/http://www.20at.com:80/masr/t7kyk/8928.html"

