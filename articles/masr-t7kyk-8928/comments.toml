posted = "2008-05-16"
text = "انتم بجد عايزين ايه ؟ مع انى متفق مع الكاتب الا انى بجد زهقت مع انى متأكد من صدق الكاتب .<br />بس انى كل 5 دقايق بتعاير انى مصرى ؟ اه عارف ان البلد باظت و اتسرقت وانتشر الفساد و الوساطه و الرشاوى و مبدأ طنش تعيش ’ طيب والبعدين هتقولى دوله ضعيفه مش بتقدر الا على ولادها هقولك حصل , غلوا الاكل حصل حبسين لشباب جوا البلد حصل ومش عارف ليه ؟ لو مش معاك فلوس ممكن اى حد يذلك من اصغر موظف لاكبرهم حتى اى واحد عادى حصل ممنوع تشوف الدنيا علشان انت فقير صح و تيجى تبص تلاقى الجيش للفقراء السجن للفقراء الشغل للفقرا بس الشغل الى مهيته200 جنيه الزراعه لفقراء الترع للفقراء المواصلات للفقراء السكوت للفقراء ولوجيت بقى تبص على اناحيه التانيه باختصار عربيات فلل حمامات سباحه بيطلع من الجيش وحد حتى لو ليه 10 اخوات بيطلع من السجن لعدم كفايه الادله و علشان مفيش شهود …<br />انا اسف انى طولت بس قصدى بيقول يا مصر لو ش هتحترمينى سبيى امشى افتحى لى السفر زى ليبيا<br />وبالنسبه لموضوع الامومه لا يا مصر انتى مش امى و لا حتى مرات ابويا انتى مجرد مكان مجرد تراب ليس لديك على افضال ولن اسألك يوما عن اى شىء وفى المقابل لا تقحمينى فى مشكلاتك وبالتالى نحن متعادلان"
archived = "2009-11-01"
capture_url = "https://web.archive.org/web/20091101113422/http://www.20at.com:80/masr/t7kyk/8928.html"

