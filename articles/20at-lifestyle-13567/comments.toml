text = "كنت دايما وانا صغيرة بحلم اني بقع من البلكونة وفبل ما اصطدم بالارض اصحي من النوم مفزوعة جدا، ويمكن الحلم ده كان بيجلي كتير عشان المذاكرة والامتحانا والتوتر بتاعهم"
