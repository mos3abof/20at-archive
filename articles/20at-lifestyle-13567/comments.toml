author = "محمد هراس"
posted = "2009-09-29"
text = "من أغرب أحلامى : كنت قبل النوم مباشرة قد شاهد اخر حلقتين فى الموسم الرابع من مسلسل لوست و إذا بأبطال المسلسل فى الحلم حيث و جدت نفسى راكب الترام فى الاسكندرية و إذا بجون لوك ( و هو رجل الادغال فى المسلسل الذى يمشى دائما بسكينه ) قد جذب اخر عربية فى الترام حتى اوقفه و نزل من الترام جاك و سعيد و كيت و اخرج سعيد خريطة تبين طريق العودة ( لأنهم كانو مخطوفين فى المسلسل )"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110174613/http://www.20at.com:80/20at/lifestyle/13567-2009-09-29-14-33-45.html"

