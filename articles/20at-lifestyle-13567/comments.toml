text = "محمد هراس<br />انا برضه من متابعين لوست<br />وكتييير جدا بحلم بيهم لدرجة انى احلم مره ان كلاير دى صاحبتى او قريبتى<br />واحلم مره انى بمثل مكان كايت<br />وساعات احلم انى عايشه معاهم فى الجزيرة بشوف هما بيعملوا ايه<br />بجد احلام زى العسسسسسسسسسسل"
