text = "انتم عارفين فيروسات الكمبيوتر وبرامجها مين اللى بيعملها - اللى بيعمل فيروسات الكمبيوتر هى شركات تنتج برامج مكافحة الفيروسات - يعنى تنشر الفيروس فى الكمبيوترات وتعمل تخريب فيجرى الناس لشراء برامج مكافحة الفيروسات لحماية كمبيوتراتهم ————— طبعا نفس الشىء اظن ان شركات الادوية التى تنتج التحصينات والتطعيمات وادوية قتل الفيروسات هى التى تنشر تلك الفيروسات فيخاف الناس ويجروا يشتروا التطعيمات والتحصينات والادوية وت[ *** ]ب شركات الادوية المليارات<br />طبعا هتقول الراجل دة مشبع بنظرية المؤامرة وان دة مش صح هقول لك امال ملايين الملايين والبليارات اللى اختفت فى الازمة المالية العالمية راحت فين - عفريت بلع البلايين والمليارات وغطس بها فى اعماق المحيط - دى كلها مؤمرات الدول الكبيرة وعلى راسها امريكا لشفط فلوس العالم"
archived = "2009-05-03"
