[[comments]]
order = 0
subject = "الطيب احسن"
author = "نيفين"
posted = "2006-02-21"
text = "الطيب احسن يا هبهوب<br />ما قلنا عيشى نمله تاكلى سكر و عيشى ديناصور تنقرضى<br />بس تعرفى فعلا عندك حق شكله مستفز<br />مع اعتزارنا ليه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113851/http://www.20at.com/article2.php?sid=472"

[[comments]]
order = 1
subject = "معلش يا هبهوب"
author = "نيفين"
posted = "2006-02-22"
text = "معلش و الله انشغلت بس الفتره اللى فاتت و انوش مش فاضيه و عامله فيها مهمه<br />قريب و الله يا هبهوب<br />و بعدين متخافيش طارق مننا و علينا<br />مهو عشريناتى زينا و بيقدر الصداقات العشريناتيه اللى زينا كده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113851/http://www.20at.com/article2.php?sid=472"
