posted = "2009-12-05"
text = "معلش انا عاوز ارد على الاخ ماكس هكتور ده اللى بيقول فيه فرق بين اليهودي والصهيوني ( ثم قست قلوبكم من بعد ذلك فهي كالحجارة او اشد قسوة ) من سورة البقرة والكلام طبعا فى الاية وبقية الاية موجه لبني اسرائيل اتباع سيدنا موسى عليه الصلاة والسلام بلا استثناء , كل اليهود بيكرهوا المسلمين والعرب وان كان فيه تفاوت فى درجة التعبير عن الكراهية بينهم بس كلهم بيكرهونا .( لتجدن اشد الناس عداوة للذين امنوا اليهود والذين اشركوا ) واضح كمان ان المقصود كل اليهود يا باشا وذكرهم قبل المشركين .ومهما قوت مستحيل هاصدقك واكذب كلام رب العالمين."
