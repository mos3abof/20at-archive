[[comments]]
order = 0
subject = ""
author = "قرف اية دة"
posted = "2009-12-01"
text = "هى حربنا مع اسرائيل كانت حرب نسوان وجواسيس علشان نعمل لها هذا الكم من الافلام والمسلسلات<br />والا كانت حرب شباب مصر فى الصحارى التى لم يرتادها بشر من قبل<br />كان فية منطقة على طريق السويس فيها يافطة مصدية مكتوب عليها بالعربى والانجليزى من ايام الاحتلال الانجليزى - مكان غير صالح لسكن الاداميين - عارفين لية - لان فيها ثعبان اسمة الطريشة بيلف نفسة زى السوستة ويدفن نفسة فى الرمل ما عدا راسة وعينية ولونة لون الرمل ولما يشوف واحد بالقرب منة بيفرد وينط يعضة فى وشة والمصاب يموت على الفور - كان فية اكبر لواء مقاتل ووحدات دفاع<br />كان شباب مصر المتخرج من الجامعات والمعاهد يرتاد اماكن فى الصحراء لم تطاها قدم انسان من قبل وكان بيقف حراسة باتلليل زى الاسد وتهب عليهم العواصف الرملية وضرب وشهم حبيبات الرمال كانها ابر بتنغرز فى جلدهم<br />هما دول اللى حاربوا<br />مش شوية نسوان فى فنادق وجواسيس مش عارف بيتجسسوا على اية<br />قرفنا مسلسلات جواسيس<br />عايزين افلام للرجال التى الذين تخرجوا من الجامعة وراحوا يبنون قواعد الصواريخ ويحاربون"
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204025524/http://www.20at.com:80/masr/review/14200-q-q-.html"

