author = "Max HecToR"
posted = "2009-12-05"
text = "انا دخلت الفيلم بجد الفيلم كويس جدا ويعتبر دليل على تقدم الفكر المصرى بس للاسف برضه لسه عندنا نوع من التخلف اننا بنكره اى حد اسرائيلى وحاولوا انهم يتعرضوا للنقطة دى فى الفيلم لما الدكتور الصيدلى قال لكريم عبد العزيز انا اسرائيلى مش صهيونى وساله اذا كان عارف الفرق<br />كم واحد منا عارف الفرق ؟<br />الاسرائيليين مش كلهم صهاينة والى بيكرهونا الصهاينة لكن فى كتير من الاسرائيليين بيحبوا العرب وفى مؤرخيين اسرائيليين كتير كتبوا عن الاصول العربية ودورها العظيم فى تكوينهم الثقافى والفكرى<br />كفاية جهل وبجد لازم علشان نهزم عدونا اننا نعرفه ونفهمه الاول<br />مش نكتفى باننا نقول اننا بنكره اليهود والاسرائيليين والصهاينة وانهم كخ<br />الكلام لازم يبقى عاقل عن كده<br />شكرا للقراءة"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106164804/http://www.20at.com:80/masr/review/14200-q-q-.html"

