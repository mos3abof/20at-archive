posted = "2009-06-23"
text = "أرجوووووووووووو ووووووووووووووك م…خلوني أتواصل مع الأخت الرائعة سارة الزامل…بأي شكل تبغوها,,,,إذا كنت موجودة ياسارة ردي علي…عندي مشكلة مع إنجاز روايتي..مع إني كاتبة قصائد جيدة كمايقال..ترى قرأت عنك كثيييير…بيننا تشابه في الإهتمامات الأدبية وهذا المهم حتى أصير كاتبة ناجحة مثلك..قرأت صفحات من روايتك..ولم أكملها إلى الآن…وفين المدونة ماني عارفة أتواصل معاها..تجيني صفحة أظن غلط..ماني عارفة..عمما..لاترفضي طلبي متى ما وصلك ندائي..أرجوك..ولك الأجر إنشاءالله..أنا تحمست كثيييييييير حتى أنشيء روايتي بإذن الله راح أنشئه..مع إننا صغار..في نفس العمر تقريبا لكن إنشاءالله راح أتجاوز الصعاب مثلك..الرحلة الأدبية رائعة…وترى ليلنا طويل..الله معاك…بس ردي علي..وهذا إيميلي<br />asasfaresraneen @hotmail.com"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106013452/http://20at.com/20at/arts/3074.html"

