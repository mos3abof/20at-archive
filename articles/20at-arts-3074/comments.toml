author = "رنا-السعوديه"
posted = "2007-01-19"
text = "هذه مشكلتنا بالسعودية لازم نكون متطرفين في أفكارنا ليش طيب؟؟ يعني يايكونون بنات السعودية صايعات ويشربون خمر ولا يكونون ملائكة؟؟ مو معقول طبعا<br />المجتمع السعودي زي اي مجتمع فيه الصالح وفيه والطالح وفيه الوسط وهم الاغلبيه ولكن ليس هناك ملائكة"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106013452/http://20at.com/20at/arts/3074.html"

[[comments]]
order = 3
subject = ""
author = "ام عبد الرحمن - جده"
posted = "2007-05-26"
text = "جزاك الله خير يااخت ساره فقد ازحتي عن قلبي هما كبيرا بارك الله فيك وفي مجهودك ولعن الله اصحاب الاقلام الساقطه<br />اللهم انتقم منهم كما جردوا بنات بلادي من الدين والعفاف والحياء واتهموها بالغباء والتخلف والرجعيه لانهن اتبعن دينك اللهم عليك بهم جميعا لاتذر منهم فردا الا ورددت كيده في نحره واشغلته في نفسه واريتنا فيه عجائب قدرتك"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106013452/http://20at.com/20at/arts/3074.html"

[[comments]]
order = 4
subject = ""
author = "ام عبد الرحمن - جده"
posted = "2007-05-26"
text = "منذ ان قرات اغلب تفاصيل رواية بنات الرياض لم اكن معترضه على الاخبار والققص التي اوردتها فكلنا بشر لسنا معصومين عن الخطاء ولكن الاسلوب الذي اتبعته كان في قمة الدناءه والسفاهه بحيث اثبتت سفاهتها وحقدها الدفين على بنات بلاد الحرمين حين وصفتهم بالغبيات لانهن اتخذن امهات المؤمنين قدوة لهن وعممت وشتمت اهل البلد الحرام بانهم افراد كالبهائم سيطر عليهم الوسواس والادهى من ذلك انها وجدت من يصفق لها ويطبل لها حتى ترقص وتدندن بالفضائح وهي تدعي التوبه والاصلاح احذروا انا اقول هنا انها تدعي التوبه ولكنها في مضمون روايتها وظاهره تدعوا الى السفور والانحلال قاتلها الله تريد مجتمع يترك للبشر حرية الاختلاط والخروج مع الجنس الاخر اللذين اسمتهم بالتماسيح وتمنت ان يكون كل اصدقائها من اصحاب الشنبات هذه هي قمة الوضاعه قاتلها الله ورد كيدها في نحرها ومن يقف ورائها"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106013452/http://20at.com/20at/arts/3074.html"

