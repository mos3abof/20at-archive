[[comments]]
order = 1
subject = "مسلم"
author = "للهم شتت شملهم وفرق جمعهم يارب العالمين اللهم إنهم أعداؤك وأعداء نبيك وأعداء دينك اللهم زلزل الأرض من تحت أقدامهم فهم أعوان اليهود وحلفائهم"
text = "اللهم دمرهم كمادمرت عادا وثمودا للهم أمين يارب العالمين<br />اللهم إنهم بغوا فى الأرض فأكثروا فيها الفساد<br />فدمرهم يارب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142435/http://www.20at.com/article.php?sid=1576"

[[comments]]
order = 2
subject = "مايا"
author = "ا يارب ماتسمعش كلام الناس اللى فوقيا"
text = "يارب ارجوك احميهم ومتسبهمش<br />البلد دى فى محنة ممكن نتعرض لها احنا او اى بلد عربى وانا مش ممكن افرح فى المصايب<br />ذنبهم اية الناس اللى ماتت واتشردت واتبهدلت لا لا لا يارب انزل رحمتك عليهم<br />امين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142435/http://www.20at.com/article.php?sid=1576"

[[comments]]
order = 3
subject = "حاتم"
author = "زاك اللة كل الخير يافتاة"
text = "واللة شو كل ها النقيض بين التعليقين<br />كيف لك يابنى ادم ان تدعى على ها الناس هيدا بدلا من طلب رحمة اللة عليهم<br />بالفعل توا ماببنظر انهم امريكان ام مغاربة ام مصريين احنا ننظر على انهم بشر<br />بدنا نحب بعض نطلب غفران ورحمة لاالهن<br />واللة هناك النقيض بين التعليقين انا مع مايا فى كل كلمة جزاك اللة خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142435/http://www.20at.com/article.php?sid=1576"

[[comments]]
order = 4
subject = "ان كان كذلك فاخبروني"
author = "لسلام عليكم ورحمة الله وبركاته"
text = "انا عندي تعليق بسيط ، و خصوصا على الاخوة الذين على طول تهجموا على الاخوة اللي ابدوا دعوا على أمريكا<br />اولا انا لم اضحك و لم اقهقه و لم افرح لما حصل في امريكا ، بس للأمانة .. في هذه الاثناء عندما ارى ما يحدث لاخواننا في العراق و كل مكان فان كاترينا (شفت صدري بعض الشئ) ... هذا شعوري الحقيقي<br />نحن كمسلمين لا نتمنى ان تحصل كوارث في اي مكان ، بس لو حصلت في بلد ظالم لنا ، هل في ذلك شفاء لصدورنا ام لا ؟؟؟؟<br />و فيه ايضا عبره و خوف ان يصيبنا الله بما اصابهم<br />يا ريت نتكلم بمنطقية شوي<br />و المنطقيه الاكثر أحب اسأل سؤال ،<br />دائما في دعائنا نقول كلنا (اللهم من اراد بالمسلمين شرا فأشغله بنفسه ) .. أشغله بنفسه .. و اللي حصل في امريكا الم يشغل بوش و من حوله عن الكيد و التدبير لاخواننا في كل مكان ؟؟؟؟ صح و لا لأ<br />انا استفسر لأني اريد افهم ديني ، هذا الدعاء ليس عليه غبار لأننا لا ندعو على اي حد ، بس لمن يكيد لنا ، و نسأل الله ان يشغله عنا ، فسواء اختار الله تعالى ان يشغله باعصار و لا بمرض و لا باي شئ اليس هذا تحقيقا للدعاء ؟؟<br />بصراحة بديت ماافهم شعور الناس واحب اكون مسلمة بالشكل الصحيح ، و المسلمين اول ما تصير مصيبة بسرعة يتجهون نحو كلام مثل المسلم لا يشمت و لا يفرح بمصيبة غيره .. كلام صحيح ... و الاسلام غير متهم عشان حد يدافع عنه ، بس يا ريت نفهم الاسلام بشكل كامل<br />يعني مثل ما فهمنا انه المسلم ما يشمت ياريت نفهم معنى (و يشف صدور قوم مؤمنين ) و ايضا الدعاء اللي ذكرته ...<br />و اللهم اهدنا الى الحق يا رب<br />السلام عليكم<br />براءة _ الامارات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142435/http://www.20at.com/article.php?sid=1576"

[[comments]]
order = 5
subject = "هااانى"
author = "وكى انا موافق على بعض الكلام"
text = "بس ممكن اسال سؤال هل الامريكان العاديون بيفرحوا للى بيحصل فى العراق وفلسطين<br />لا والف لا بل بالعكس كل يوم كانوا يقومو بمظاهرات واللة اكتر من الدول العربية لاسيما انهم فى الدولة المحتلة نفسها<br />اذن مثل ما العرب بيزعلو على اهل العراق وفلسطين هما كمان ويمكن اكتر<br />لان من الاخر كدا الشعب الامريكى ملووش ذنب واى عاقل او عاقلة هتوافقنى الكلام<br />من الاخر كدا دى سياسة دولة وبس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142435/http://www.20at.com/article.php?sid=1576"

[[comments]]
order = 6
subject = "MASHQ70@YAHOO.COM"
author = "سم الله الرحمن الرحيم"
text = "لا يا مايا ان وراء كل ثكلى في العراق امريكا ووراء كل دمعة في فلسطين امريكا ووراء خوف كل خائف في الصومال وافغانستان وسوريا وايران وجوانتاناموامريكا ناهيك عن فيتنام وكوسوفو والمشوهون في هيروشيما ونجازاكي وكأن كل شر في العالم اليوم وراءه امريكاوامريكا ليست بوش وحدة ولكنهاكل من انتخبه وسكت عن جرائمه وصدق ان قولته عن الحرب الصليبية ضد المسلمين هي فلتة لسان وصدق الله حيث قال قد بدت البغضاء من افواههم وما تخفي صدورهم اكبر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142435/http://www.20at.com/article.php?sid=1576"
