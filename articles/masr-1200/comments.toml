[[comments]]
order = 5
subject = "مكبرش و لا حاجة"
author = "ابو عاصم"
posted = "2006-11-23"
text = "الموضوع مكبرش و لا حاجة الموضوع لسة مخش حجمة الحقيقي لا الموضوع مش موضوع حجاب الموضوع اكبر من كة لما واح شاذ و ملوش في حاجة و الكل عارف تاريخة و بلوية و مفيش ح بيحترمة يتنصب علينا وزير ثقافة يعني حامي حمي ثقافة البلد و تاريخها يبقي المفروض يكون الرد اية لما واحد زي دة يفتي و يتهكم علي ثابت من ثوابت الدين نعمل اية يعني و الله ان بحس ان مبارك مثبت الراجل ( اسف كلنا عارف انة مش راجل ) في الوزارة علشان يأكد احتقارة لنا و قوة قمعة و نظامة لنا واحد بكل البلاوي اللي الناس عرفاها و الواحد يخجل يذكرها يبقي وزير ثقافة يعني عيزين يعملوا اية في البلد يحولوها زي قوم لوط و لا اية يا ابو جمال يا مجنننا و المصيبة لما الناس زعلت علي اهانة دينها يطلع قطيع الحمير المسمي نفسة مثقفين و هما في الاصل افقين يعلنوا ان دي فتنة من الاخوان و انهم متضامنين مع وزير الهيافة اللي مدلعهم و مضبطهم انا عايز افهم هما الاخوان بس اللي مسلمين في البلد دي و لما واحد من الحزب الزفت الوطني يطلع عندة شويت دم و يزعل علي دينة يبقي انجر و را الاخوان و الغريب ان واحد حمار زي احمد رجب عامل هوليلة و عامل فيها هو اللي بيفهم و ان الناس كلها اتخدعت و فهمت كلام الوزير غلت يعني الراجل كان بيدي محاضرة في العفة و الناس بتفهم بالمقلوب و الاخوان السبب اهههههههههههههههههههههه يا بلد حالك مقلوب"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125172047/http://masr.20at.com:80/article.php?sid=1200"

[[comments]]
order = 6
subject = "يهية بتغرق, شوية دم"
author = "علي"
posted = "2006-11-24"
text = "يعني حقيقي فعلا الشباب اللي بتعلق فوق شايفة إن الإسلام مهتم أكتر بأن واحد قال الحجاب مش فرض (وإن ده رأيه و بس) من إن واحد يبقي مسئول عن حرق جياين من شباب المسرح و تهريب اثار بلد و إنهيار الثقافة ؟<br />و الظريف إن نفس الشباب دي اللي بتدافع عن الإسلام (اللي واضح إن الحجاب من أركانه الخمسة) معندهاش مشكلة في قذف واحد بأنه شاذ جنسيا من غير دليل و دياولوه؟<br />غير طبعا طلبة الجامعة اللي طلعوا مظاهرات تكسر الدنيا علشان كلام الجدع ده بس مش مهتمين إن قانون الجامعة الجديد هيقعد نصهم في البيت لما المجانية تتلغي ولا فارقلهم إن الأمن بيجيب عيال بمولوتوف يعوروا الطلبة اللي مش مواقفين علي تزوير الإتحاد؟<br />يهية بتغرق, شوية دم يا رجالة و يا بنات!"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125172047/http://masr.20at.com:80/article.php?sid=1200"

[[comments]]
order = 7
subject = "معلش يا دكتور عبد المنعم"
author = "من اخوان بني سويف"
posted = "2006-11-24"
text = "معلش يادكتور عبد المنعم انت نسيت غن ساعة المحرقة بتاع بني سويف كان قبل الانتخابات اصلا يعني لم يكن يوجد من الإخوان في المجلس غير 16 عضو تفريبا ومنهم مصطفى عوض الله بتاع الفيوم وهو النائب الوحيد اللي راح للحدثة في مكانها عشان كان في فرقة من الفيوم مشتركة في العرض اللي أشتعلت فيه النار جه من الفيوم لبني سويف بعديها جه محافظ الفيوم ومن بعدهم جم نواب الحزب الوطني<br />و إخوان بني سويف - ولم يكن فيهم نائب ولا غيره - تبنوا القضية واقامو مؤتمرات وساندوا أسر الضحايا وشباب الأخوان هم اللي كانو في المستفى العام مع الضحايا واهاليهم ..."
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125172047/http://masr.20at.com:80/article.php?sid=1200"

[[comments]]
order = 8
subject = "ده موقع للردح ولا ايه ؟؟"
author = "مغترب"
posted = "2006-11-25"
text = "مش كده يا ابن بهيه هو فيه ايه ؟ ليه حالة التشنج الشديدة الموجودة في الرد والالفاظ الغريبة اللي موجودة في التعليقات لو هو ده حال مستخدمي الانترنت والمهتمين بحال مصر يبقى عليه العوض ومنه العوض هيه الطارة في الشتيمة واستخدام الالفاظ الخادشة يعني المدونين هيكونوا ثقافة الردح عموما الامر بسيط ممكناي حد يشتم ده مش صعب لكن الصعب انك تتكلم وتوصل قضيتك بدون استخدام الفاظ خادشة وافتكر ان الموقع يا عم المتدين ممكن يدخلوه بنات وولاد ناس والسلام على من اتبع الهدى"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125172047/http://masr.20at.com:80/article.php?sid=1200"
