[[comments]]
order = 0
subject = "مع وضد"
author = "إبن بهية"
posted = "2006-11-23"
text = "طبعا أنا مع وضد هذا الكلام زي العادة لأننا بنعيش في زمن رمادي مقرف والله يخليك تشد في شعرك لو لسه فيه شعرايتين باقيين من أهوال زمن حسني وبوش وأولمرت وكل الكلاب دي .. أنا مع الكلام اللي بيقول بأن هذا الموضوع أخذ من طاقة الناس الكثير وهي كان المفروض أن توجه نحو إزالة النظام القذر كله وليس محاربة ذلك الشاذ فاروق أبو خازوق .. لكن كونه زاد عن حجمه ففي رأيي أنه مازال لم يزد ونريد المزيد .. يعني لو جه وزير فرنسي وعملها نتلم ونعمل مظاهرات وقاطعوا الفرنسيس واطردوا السفير .. طيب أنا عايز بقى أعمل مظاهرة وأطالب بطرد السفير المصري من شبرا زي شعبولا ما بيقول .. وعايز كمان نقاطع السلع المصرية ... والله دي مصيبة .. فاكرين لما حصل الكلام ده في فرنسا وأوروبا عملنا إيه ؟؟؟؟ يجي الأخ ويقولك زاد عن حده ؟؟؟؟ لأ ما زادش بقى يا كابتن ولازم الوزير ده ينضرب بالجزمة القديمة على أم رأسه ... ولازم كل الكلاب اللي عاملين مثقفين دول ينضربوا مليون صرمة قديمة على دماغهم الوسخه .. عايزين مسخرة وقلة حيا يغوروا الباب مفتوح يعملوها بره مش في بلدنا وبين أولادنااللي عايزينهم يكونوا رجاله مش شواذ .. آدي اللي أخدناه من أمك يا سي فاروق اللي عايزنا ناخدها قدوة لأنها ما كانتش محجبة .. جابت إيه يا حسرة ؟؟؟ جابت شاذ ... عايز ولادنا زيك كده يا خيخه ؟؟؟ وطبعا الكلام كله موجه للشلة المعفنة اللي وقفت جنب الشاذ ده ...<br />شوفوا فيه عندنا حاجات ثوابت وخطوط حمرا .. أنا ممكن أتنازل عن بعض الأمور لكن فيه ثوابت مستحيل نتزحزح عنها قيد أنمله لأننا لو .. لو اتزحزحنا سنة بسيطة راح نتزحزح بعد كده بالكيلو والميل ونروح متنيلين على عينا وفاقدين الطريق خالص والهوية وما نعرفش احنا مين وليه وفين وده بالضبط اللي عايزينه مننا بوش وكلابه اللي بي<br />اقرأ بقية التعليق .."
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125172047/http://masr.20at.com:80/article.php?sid=1200"

