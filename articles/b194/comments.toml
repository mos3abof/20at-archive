[[comments]]
order = 0
subject = "أخبار بايتة"
author = "واضح ان عشرينات نايمة في العسل ..وانهم بيصمموا يحطوا الموضوعات على احداث \"بايتة\""
posted = "2006-01-03"
text = "لأن يا سادة عشرينات ..القضية متهم فيها شخص الآن يقال انه مصاب بمرض نفسي و قيل ايضا انه مرض عقلي..و القضية المطروحة حاليا ..هل هذا الشخص \"مجنون\"و يفتقد الاهلية و غيرمسئول عن تصرفاته؟؟<br />القضية هل يستطيع اي شخص و ان كان مجنون أو عاقل ان يقتل بمفرده عشرة اشخاص في ليلة و واحدة و يقوم بذبح طيور و التمثيل بالجثث و دفن الاعضاء المقطوعة..وحده؟! دون مساعدة احد؟<br />وما الدافع لذلك؟<br />وكيف لم يشعر به احد...حيث كان الاحتمال الاول ان الجناة (كما كان يعتقد سابقا ..وكما يشك في هذا الامر حاليا)أكثر من شخص وقاموا بتخدير الضحايا المجني عليهم ..وبذلك يمكنهم قتلهم دون ان يشعر احد \"تقريبا \" بالجريمة ..ولكن كيف يمكن ان يكون كل هؤلاء قتلوا ومثل بجثثهم دون ان يشعروا ببعضهم ..<br />تخيل معي لا قدر الله...شخص يقتل بجوارك ..في نفس سريرك ..هل ستشعر به ام لا..ألم يقاوم أحدهم أو يصرخ ؟<br />ألم ينهك من التعب و الارهاق هذا الشخص الذي قام بالذبح و استخراج الاحشاء و قطع الاعضاء؟<br />هل هو مجرم محترف ..اعتاد على القتل حتى لا يعنيه امر القتل ولايتأثر به لذلك فهو يقتل اكثر من شخص دون ان يبدو عليه اي اثر؟؟؟<br />ألم تنتابه اي حالات هستيرية ليهرب او يهذي بما فعله ..أو يعترف<br />إذن فهو ليس مجنون ..لأنه يعرف عواقبالجريمة بدليل تخلصه من ادوات الجريمة \"السكين و الساطور\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114042/http://www.20at.com/article2.php?sid=194"

