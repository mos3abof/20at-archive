author = "شمس"
posted = "2009-08-10"
text = "بصراحة ده كلام فارغ ايه يطلقها على شان موسيقى دول والنبى ناس بتفهم<br />ليه اتنين بيحبو بعض كده يفرقوهم عن بعض ده جهل وتخلف واللهى<br />ربنا يسترها"
