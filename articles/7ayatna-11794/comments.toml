author = "البدري"
posted = "2009-04-18"
text = "الزواج هو أرتباط لشخصين وإنصهار لعائلتين، لذلك لا أعتقد أن من تبحث عن الزوج المقطوع من شجرة قد فهمت هذا المعني وهي تبحث عن سعادتها وحدها مع أن العائلة التي تتمني عدم وجودها قد تكون السبب في أنقاذ زواجها في حال ظهور مشكلات بين الزوجين والتي يكون للعائلاتين الدور الأكبر في حل مشكلات البيت الصغير"
archived = "2009-04-21"
capture_url = "https://web.archive.org/web/20090421163442/http://www.20at.com:80/7ayatna/11794-2009-04-18-10-54-54.html"

