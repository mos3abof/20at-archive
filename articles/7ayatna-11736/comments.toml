text = "والله ان الشذوذ الوحيد هو في عقل الكاتب وللاسف يا عشرينات لا ادري كيف تسمحون بالافتراءات العلنية على مجتمع محافظ ومسلم،الشذوذ موجود منذ خلق الله الكون ولا داعي للتذكير برسالة سيدنا لوط عليه السلام،ولكن يبدو ان طمع مندوبكم او مراسلكم لا حدود له"
