[[comments]]
order = 45
subject = "الى من رد على تعليقى"
author = "مسلمة"
posted = "2007-02-04"
text = "اولا شكرا على الاهتمام بالرد<br />الاخت الى قالت على ردى انى مشكلتى انى مش بقرا الموضوع مين قال لحضرتك انى مش قريته؟؟؟<br />هو عشان مش علقت على الكلام ده ابقى مش قريته!!!!!<br />اما الاخ ابن اسلام<br />انا قصدت بكلامى انى مش ينفع ادخل نفسي فى مناقشة ممكن تسئ لرموز دينى<br />انا لما كتبت الرد ده كنت فى منتهى العصبية لانى قريت كلام زى ده انا زى اى مسلم مقدرش اشوف كلمة تهين دينى واسكت<br />وبعدين انا بردو محدش فهمنى ايه الحكمة من ان مشاركة زى دى تفضل موجودة<br />اولا دى خارج حدود الادب واللياقة والفاظ رديئة يعنى مش مناقشة هادفة او حتى مناقشة تلتزم باداب الحوار<br />فكون ان الموقع يسيب مشاركة زى دى<br />ده تقصير منه وعدم احترام لمشاعر المسلمين بجد كفاية بقى استهزاء بكل ماهو غالى ونفيس فى دينا<br />وانا لسه عندى قولى ان الموقع نزل من نظرى لانه نشر حاجة بلا قيمة بل انها هتثير مشاكل وضغينه وهتزيد من المشاركات السلبية وهتخرج المناقشة برة الموضوع<br />شكرا وجزاكم الله خيرا<br />وربنا يهدى"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

