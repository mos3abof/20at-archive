text = "البنادم الى سب الدين لا بن الا سلام ليست هذة اخلا ق ابناء المسيح الذى تدعى انك منهم يا بنادم الشتيمة دى لغة الضعفاء ان كان لديك دليل فناقش واتى بدليلك ونحن نحترم كل الا راء يعنى زى راى اخونا المسيحى المحترم totaيعنى خليك محترم والدين لا يسب مهما كانت وجهات النظر نحن نعترف با لدين المسيحى ولا يجوز ان نسبك ولكنى اقول لك حسبى الله ونعم الوكيل وفية حا جة اسمها جنة ونار وهنتقابل"
