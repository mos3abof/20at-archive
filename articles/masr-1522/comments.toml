[[comments]]
order = 49
subject = "إلى أخي علي"
author = "ابن الإسلام"
posted = "2007-02-05"
text = "السلام عليك ورحمة الله وبركاته وبعد<br />فالله عز وجل تعهدبحفظ كتابه الكريم قال تعالى في سورة الحجر بسم الله الرحمن الرحيم(إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ)<br />وقال تعالى في سورة فصلت بسم الله الرحمن الرحيم(إِنَّ الَّذِينَ كَفَرُوا بِالذِّكْرِ لَمَّا جَاءهُمْ وَإِنَّهُ لَكِتَابٌ عَزِيزٌ - لَا يَأْتِيهِ الْبَاطِلُ مِن بَيْنِ يَدَيْهِ وَلَا مِنْ خَلْفِهِ تَنزِيلٌ مِّنْ حَكِيمٍ حَمِيد)<br />ٍ"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 50
subject = "إلى الأخت مسلمة"
author = "ابن الإسلام"
posted = "2007-02-05"
text = "الأخت الفاضلة السلام عليك ورحمة الله وبركاته وبعد<br />أشكرك كثيرا على غيرتك على الدين وإن موقفك هذا يذكرني بقول الله تعالى في سورة الأعراف في قصة أصحاب السبت : بسم الله الرحمن الرحيم (وَإِذَ قَالَتْ أُمَّةٌ مِّنْهُمْ لِمَ تَعِظُونَ قَوْمًا اللّهُ مُهْلِكُهُمْ أَوْ مُعَذِّبُهُمْ عَذَابًا شَدِيدًا قَالُواْ مَعْذِرَةً إِلَى رَبِّكُمْ وَلَعَلَّهُمْ يَتَّقُون - فَلَمَّا نَسُواْ مَا ذُكِّرُواْ بِهِ أَنجَيْنَا الَّذِينَ يَنْهَوْنَ عَنِ السُّوءِ وَأَخَذْنَا الَّذِينَ ظَلَمُواْ بِعَذَابٍ بَئِيسٍ بِمَا كَانُواْ يَفْسُقُونَ)<br />وأنا لم أسب أحدا إطلاقا وذلك إمتثالا لأمر الله عز وجل في سورة الأنعام بسم الله الرحمن الرحيم (وَلاَ تَسُبُّواْ الَّذِينَ يَدْعُونَ مِن دُونِ اللّهِ فَيَسُبُّواْ اللّهَ عَدْوًا بِغَيْرِ عِلْمٍ كَذَلِكَ زَيَّنَّا لِكُلِّ أُمَّةٍ عَمَلَهُمْ ثُمَّ إِلَى رَبِّهِم مَّرْجِعُهُمْ فَيُنَبِّئُهُم بِمَا كَانُواْ يَعْمَلُونَ)<br />جزاك الله خيرا<br />َ"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

