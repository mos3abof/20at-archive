subject = "الى ابن المسيح 2"
author = "وبعدين يا ابني انت ابن المسيح ازاي دا المسيح ما اتجوزش ولا خلفش يبقى انت ابنه منين"
posted = "2007-02-03"
text = "طيب المسيحيين قالوا ان المسيح ابن الله مع ان الله احد صمد لا يتزوج ولا ينجب علشان خاطر ربنا خلقه بدون اب فقالوا انه ابن الله<br />لكن انت اكيد ليك اب فليه بتقول على نفسك انك ابن المسيح"
archived = "2007-02-09"
