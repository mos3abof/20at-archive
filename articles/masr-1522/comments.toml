[[comments]]
order = 9
subject = "إلى أخي فهد الإسلام"
author = "ابن الإسلام"
posted = "2007-01-31"
text = "السلام عليك ورحمة الله وبركاته وبعد<br />إذا سمحت لي تعليق صغير على كلامك أرجو أن تتدبر وتعي بصدر رحب من مسلم أزهري<br />أنت قلت \"نحن نعترف با لمسحية واليهودية ولكن الا سلام يجب ما قبلة\" وأنا أقول لك \" كلا نحن لا نفعل ذلك إن موسى وعيسى عليهما السلام كانا مسلمين بعثوا بالتوحيد ككل الرسل ألم تسمع قول الله تعالى \"إن الدين عند الله الإسلام\" وقول النبي صلى الله عليه وسلم \" الأنبياء إخوة علات دينهم واحد وأمهاتهم شتى\" أو كما قال.<br />وبالتالي نحن لا نعترف بمسيحية تدعي لله المسيح عيسى ولداً ولا بيهودية تدعي له العزير ولداُ بل نحن على دين الإسلام وملة أبينا إبراهيم عليه السلام<br />أما كون الرسل جميعا مسلمين فأذكرك بقول الله تعالى في آل عمران \"مَا كَانَ إِبْرَاهِيمُ يَهُودِيًّا وَلاَ نَصْرَانِيًّا وَلَكِن كَانَ حَنِيفًا مُّسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ\" وقوله تعالى في يوسف \" رَبِّ قَدْ آتَيْتَنِي مِنَ الْمُلْكِ وَعَلَّمْتَنِي مِن تَأْوِيلِ الأَحَادِيثِ فَاطِرَ السَّمَاوَاتِ وَالأَرْضِ أَنتَ وَلِيِّي فِي الدُّنُيَا وَالآخِرَةِ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ\" وفي المائدة \" وَإِذْ قَالَ اللّهُ يَا عِيسَى ابْنَ مَرْيَمَ أَأَنتَ قُلتَ لِلنَّاسِ اتَّخِذُونِي وَأُمِّيَ إِلَـهَيْنِ مِن دُونِ اللّهِ قَالَ سُبْحَانَكَ مَا يَكُونُ لِي أَنْ أَقُولَ مَا لَيْسَ لِي بِحَقٍّ إِن كُنتُ قُلْتُهُ فَقَدْ عَلِمْتَهُ تَعْلَمُ مَا فِي نَفْسِي وَلاَ أَعْلَمُ مَا فِي نَفْسِكَ إِنَّكَ أَنتَ عَلاَّمُ الْغُيُوبِ- مَا قُلْتُ لَهُمْ إِلاَّ مَا أَمَرْتَنِي بِهِ أَنِ اعْبُدُواْ اللّهَ رَبِّي وَرَبَّكُمْ وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِيهِمْ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025931/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 10
subject = "اضافة"
author = "خزعبلات ان يكون ابن اللة"
posted = "2007-01-31"
text = "كلنا يعرف هرم خوفو ويعرف لماذا بنى ؟<br />بنى هرم خوفو ليكون مقبرة للفرعون خوفو<br />ولكن عندما فتحوا الهرم وجدوا التابوت خالى الجثة<br />الكهنة كتبوا انة اى الفرعون كان ابن اللة وصعد بجسدة بعد موتة الى ابية الذى فى السموات<br />القصة مكررة ومؤلفة فى التاريخ وبالذات الفرعونى واصلها بقايا فرعونية قديمة ابتدعوها وشوهوا بها ديانة المسيح<br />خرافة ان يضحى اللة بابنة من اجل مخلوق لة اخطا<br />يالتخريف الدراما التى لا يتقبلها عقل طفل<br />والقصص بصراخ المسيح على الصليب مستنجدا بابوة بدون اى اغاثة وكانة اضحية للعيد<br />ثم لم يثبت ان الرومان كانوا يقتلون ضحاياهم على الصليب ولماذا الم تكن هناك سيوف<br />وهب انهم شنقوة يبقى اتباعة يعلقون مشانق فى رقابهم<br />يا لروعة الخيال المريض"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025931/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 11
subject = "سبحان الله الواحد"
author = "فهد الا سلام"
posted = "2007-01-31"
text = "بسم الله شكرا يا اخى العزيز ابن الا سلام وطبعا لازم تكون احسن منى فانت دارس فى الا زهر الشريف وان بس بحب اوضح للاخوة بعض النقاط عن سماحة الا سلام مرة تانية شكرا ليلك يا سيدنا ومولانا وجزاك الله خيرا فانتم حماة الا سلام وشكرا لكل من دافع عن الحق الا خت العزيزة زهرة الرمان والى كل من يبحث عن الحقية مرة تانية شكرا وجزاك اللة خيرا"
