author = "الرجل الاخضر"
posted = "2007-02-05"
text = "انا بمدي ايدي لك يا ابن الاسلام لكى نظهر الحق ونب<br />قمت بالاتصال بالكنائس الأفريقية و شرحت مقاصدي للقسس الذين اهتممت أن يكون بيننا حوار , لكنهم رفضوا بأعذار شبه مقبولة. لكن المكالمة الثالثة عشر جاءتني بالفرحة. لقد وافق القس ( فان هيردن ) على مقابلتي بمنزله في يوم السبت بعد الظهر . استقبلني القس في شرفة منزله بترحيب و ود. وقال إذا كنت لا أمانع فأنه يود حضور حميه البالغ من العمر سبعين عاما للمشاركة معنا في النقاش . ولم أمانع في ذلك, جلس ثلاثتنا في قاعة المكتبة.<br />* لماذا لاشيء :<br />تصنعت سؤالا : ماذا يقول الكتاب المقدس عن محمد؟.<br />وبلا تردد أجاب : لاشيء.<br />لماذا لاشيء, وفقاً لشروحاتكم فان الكتاب المقدس مليء بالتنبؤات , فيخبر عن قيام دولة السوفيت الروس وعن الأيام الأخيرة وحتى عن بابا كنيسة الروم الكاثوليك.<br />فقال : نعم , ولكن لاشيء عن محمد.<br />فسالت ثانية : لكن لماذا لاشيء؟.<br />أجاب الرجل المسن: يا بني لقد قرأت الكتاب المقدس لخمسين سنة مضت ولو كان هناك أي شيء عن محمد لكنت عرفته.<br />* ولا واحدة بالاسم :<br />استفسرت : ألست تقول أن هناك مئات النبوءات التي تتكلم عن مجيء المسيح , في العهد القديم؟.<br />قال القس : لا مئات بل آلاف .<br />قلت: إني لن أجادل في الألف نبوءة التي تتحدث عن مجيء المسيح. فإننا كمسلمين آمنا وصدقنا بالمسيح دون الحاجة إلى أي نبوءة كتابية . إنما آمنا , تصديقاً لمحمد صلى الله عليه وسلم. لكن بعيداً عن هذا الكلام , هل يمكن أن تعطيني نبؤة واحدة مضبوطة , حيث ذكر اسم المسيح حرفياً ؟ إن التعبير المسيا المترجم بالمسيح ليس باسم إنما هو لقب. هل توجد نبوءة واحدة تقول أن اسم المسيا سيكون عيسى وان اسم أمه مريم ؟.<br />أجاب القس : لا لا يوجد مثل هذه التفاصيل.<br />إذن كيف تستنتج أن ه<br />اقرأ بقية التعليق .."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 52
subject = "عودة الرجل الاخضر"
author = "الرجل الاخضر"
posted = "2007-02-05"
text = "يحتج كثير من النصارى بأن كتابهم المقدس غير محرف بنص في كاتبهم يقول<br />رؤيا يوحنا اللاهوتي الاصحاح 22 العدد 18 – 19<br />18 لاني اشهد لكل من يسمع اقوال نبوة هذا الكتاب ان كان احد يزيد على هذا يزيد الله عليه الضربات المكتوبة في هذا الكتاب. 19 وان كان احد يحذف من اقوال كتاب هذه النبوّة يحذف الله نصيبه من سفر الحياة ومن المدينة المقدسة ومن المكتوب في هذا الكتاب<br />ولـــــــــــــــــــــــــكـــــــــــــــــــــــــــــن !! لحظه تفكير وتمعن ..<br />حينما نستعرض القرآن الكريم نجد آيات كثيرة تتوعد من حرف التوراة والانجيل ( فل نقل جدلاً تتوعد من اراد التحريف ) ولا يوجد نص واحد يتوعد من اراد تحريف القرآن الكريم !!!!!!!!!!<br />لماذا ؟!!<br />لأنني إذا سألتكم<br />س: ماهو عقاب من يسرق الاكسجين الذي في الهواء ؟!!!<br />ج: حتماً ستكون الإجابه لاتوجد عقوبه !!<br />لماذا ؟ لأنه مستحيل يستطيع احد ان يسرق الهواء !!<br />س2: ماحكم من اراد ان يسرق اشعة الشمس ؟!!<br />ج2: لاتوجد له عقوبه !!!!<br />لماذا؟ مستحيل ان يستطيع احد ان يسرق اشعة الشمس !!<br />ماحكم السرقه ؟<br />قطع اليد في الشرع الاسلامي و السجن عند الغربيين !!<br />لماذا هناك عقوبه لسرقه ؟؟ لأنه ببساطه جريمة السرقه تقع كثيراً او على الاقل قد تقع فهي غير مستحيله !!<br />الخلاصة:<br />إن العقوبه تنتج عن وجود الجريمة أو قابليه وقوع الجريمة ، واما الامور المستحيله وقوعها فمن الغباء وغير العقل ان توضع لها عقوبات لأنها مستحيلة الحدوث !!!!!<br />النتيجة:<br />ان الكتاب المقدس الذي بيد النصارى واليهود ( قد حرف او له قابلية على التحريف ) والسبب وجود عقاب لمن حرف ، ولو انها مستحيله لما وجد لها عقاب بالضبط كالقرآن الكريم ! فالقرآن الكريم تحدى العالمين بأن يأتوا بآيه من مثله ، ولم يضع الع<br />اقرأ بقية التعليق .."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 53
subject = "الله أكبر يا ابن الاسلام و العزة لله"
author = "الرجل الاخضر"
posted = "2007-02-05"
text = "يا ايها المسيحي العاقل الحر ، تعتقدون في دينكم ان المسيح صلب من اجلكم ليكفر خطيئة آدم التي طرد بسببها من الجنه، لأن الانسان بحاجة من يخلصه ويصالحه مع الله سبحانه وتعالى وكل من يؤمن بيسوع المسيح إبن الله الفادي المخلص يكتب في سفر الحياة ويكون من ابناء الله (تعالى الله علواً كبيراً )<br />وانا اسألك يا مسيحي ، انت تؤمن بالمسيح وبصلبه فلماذا الله يعذبك ؟ ألم يكتبك في سفر الحياة أليست انت من ابنائة ( كما تعتقدون ) ؟!<br />مكتوب في سفر التكوين الاصحاح 3 العدد 16 – 17<br />16 . وقال للمرأة تكثيرا اكثر اتعاب حبلك.بالوجع تلدين اولادا.والى رجلك يكون اشتياقك وهو يسود عليك. 17. وقال لآدم لانك سمعت لقول امرأتك وأكلت من الشجرة التي اوصيتك قائلا لا تأكل منها ملعونة الارض بسببك.بالتعب تأكل منها كل ايام حياتك.<br />لماذا المرأه المسيحية لازالت تعانى عقاب خطيئة آدم والمسيحي كذلك ...!<br />إلى الآن المسيحي يأكل بالتعب ، والمرأة المسيحية تتألم بآلام الولادة ... أين الذبح وأين الفداء ؟!!<br />لماذا لا زالت لعنة الخطيئة تلاحقكم ! ألم يصلب من اجلها المسيح ألم يعاني منها !!<br />أليس من الأجدر قبل ان يكتب الله اسمك في سفر الحياة وتكون من أبنائة ان يزيل عنك العقاب إذا صحت قصة الصلب والفداء<br />من المعتاد ان الام تعاقب ابنها إذا اخطأ ولكن في حالة انها رضيت عن ابنها وسامحته ترفع عنه العقاب !!<br />ألم يصفح الله عنكم ؟! ألم يفديكم المسيح بدمه ؟ لماذا العذاب إذاً ؟!!<br />ليس لها إلا ثلاثة حلول لا رابع لها:<br />اما ان قصة الصلب والفداء ملفقه وليست صحيحة (وهذا معتقدنا المسلمين)<br />ان المسيح صلب ولكن لم يُقبَل فدائة ( وهذا طعن في المسيح )<br />ان المسيح صلب وقبل صلبه ولكن الله (حاشاة سبحانه) ظالم ولم يكتفي بالصلب<br />ولك<br />اقرأ بقية التعليق .."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 54
subject = "هل هذا كلام الله..........؟"
author = "الرجل الاخضر"
posted = "2007-02-05"
text = "إليك أيها القارىء الكريم بعض الفقرات من العهدين القديم والجديد والتي لا تمت لوحي الله بأي صلة إلا أن المسيحيون يقدسونها ويعتبرونها وحي من رب العالمين :<br />يقول بولس في رسالته الثانية إلي صديقه تيموثاوس [ 4 : 9 ] بحسب ترجمة فاندايك : \" بَادِرْ أَنْ تَجِيءَ إِلَيَّ سَرِيعاً، لأَنَّ دِيمَاسَ قَدْ تَرَكَنِي إِذْ أَحَبَّ الْعَالَمَ الْحَاضِرَ وَذهَبَ إِلَى تَسَالُونِيكِي، وَكِرِيسْكِيسَ إِلَى غَلاَطِيَّةَ، وَتِيطُسَ إِلَى دَلْمَاطِيَّةَ. لُوقَا وَحْدَهُ مَعِي. خُذْ مَرْقُسَ وَأَحْضِرْهُ مَعَكَ لأَنَّهُ نَافِعٌ لِي لِلْخِدْمَةِ. أَمَّا تِيخِيكُسُ فَقَدْ أَرْسَلْتُهُ إِلَى أَفَسُسَ. اَلرِّدَاءَ الَّذِي تَرَكْتُهُ فِي تَرُواسَ عِنْدَ كَارْبُسَ أَحْضِرْهُ مَتَى جِئْتَ، وَالْكُتُبَ أَيْضاً وَلاَ سِيَّمَا الرُّقُوقَ \".<br />ثم يقول له في الفقرة 19 من نفس الاصحاح : \" سَلِّمْ عَلَى فِرِسْكَا وَأَكِيلاَ وَبَيْتِ أُنِيسِيفُورُسَ. أَرَاسْتُسُ بَقِيَ فِي كُورِنْثُوسَ. وَأَمَّا تُرُوفِيمُسُ فَتَرَكْتُهُ فِي مِيلِيتُسَ مَرِيضاً. بَادِرْ أَنْ تَجِيءَ قَبْلَ الشِّتَاءِ. يُسَلِّمُ عَلَيْكَ أَفْبُولُسُ وَبُودِيسُ وَلِينُسُ وَكَلاَفَِدِيَّةُ وَالإِخْوَةُ جَمِيعاً \" .<br />ونحن نسأل :<br />أي عاقل يقول : إن هذا الكلام الذي هو رسالة شخصية محضة ، تتعلق بطلب بولس من صديقه الحضور سريعاً وتتعلق برداءه الشخصي وطلب السلام على فلان وبيت فلان ... أي عاقل يقول أنها وحي من عند رب العالمين ؟!<br />ما علاقة هذا الكلام بوحي السماء حتى يوضع في كتاب ينسب إلي الرب تبارك وتعالى ؟ !<br />ويقول بولس لصديقه تيطس [ تي 3 : 12 ] : \" حِينَمَا أُرْسِلُ إِلَيْكَ أَرْتِيمَاسَ أَوْ تِيخِيكُسَ بَادِرْ أَنْ تَأْتِيَ إِلَيَّ إِلَى نِيكُوبُو<br />اقرأ بقية التعليق .."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 55
subject = "أجب عن الاسئلة الاتية"
author = "الرجل الاخضر"
posted = "2007-02-05"
text = "السؤال الأول : بحسب إيمان الكنيسة القبطية الأرثوذكسية فإن الأطفال الذين يموتون بدون المعمودية لن يروا مجد الله ، وذلك استناداً على ما جاء في يوحنا 3 : 5 (( إِنْ كَانَ أَحَدٌ لاَ يُولَدُ مِنَ الْمَاءِ وَالرُّوحِ لاَ يَقْدِرُ أَنْ يَدْخُلَ مَلَكُوتَ اللَّهِ )) . ( ترجمة فاندايك ) .<br />وفي مادة اللاهوت الطقسي ، المقررة في كلية البابا شنودة الثالث الاكليريكية بشبرا الخيمة ، للصف الرابع 2005 - 2006 ، نجد الآتي : \" اذا أصاب المولود مرض وخافوا عليه من الموت يجب أن يطلبوا من الاب الكاهن ان يقوم بعماده ومسحه بالميرون ولو كان عمره يوماً واحداً وتحت اى ظروف ( كأن يكون الكاهن غير صائم أو عدم استطاعته عماده بالتغطيس ) وبسرعة لئلا يموت بغير عماد فيحرم من دخول ومعاينة الملكوت حسب قول مخلصنا ( يو 3 ) .<br />والسؤال : هل اختار هذا الطفل أن يموت ( او ينتقل ) قبل العماد حتى يلاقي هذا المصير ؟ واين عدل الله المطلق الذي تنادون به عند حديثكم عن الصلب والفداء ؟<br />السؤال الثاني : إذا كنتم تقولون : (( لَيْسَ ذَكَرٌ وَأُنْثَى، لأَنَّكُمْ جَمِيعاً وَاحِدٌ فِي الْمَسِيحِ يَسُوعَ )) (غلا 3 : 28) وتنتقدون وضع المرأة في الأديان الأخرى ، فلماذا تمنع الكنيسة الأرثوذكسية المرأة الحائض من التناول ومن دخول الهيكل ؟ ولماذا إذا ولدت ذكراً تكون نجسه سبعة أيام بينما إذا ولدت أنثى تكون نجسة أسبوعين وتنتظر 40 يوما بعد ولادتها للذكر حتى تطهر بينما تنتظر 80 يوما للأنثى ؟ ( لاويين 12 : 1 )<br />السؤال الثالث : من أسرار الكنيسة السبعة سر اسمه : مسحة المرضى ... لماذا فشل هذا السر في شفاء البابا شنودة الذي ذهب يُعالج بألمانيا وأمريكا في يونيو عام 2006 بسبب الآلام التي كان يشكو منها في عموده الفقري ؟<br />السؤال الرابع : حسب م<br />اقرأ بقية التعليق .."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 56
subject = "عن المحبة والإرهاب"
author = "ابن الإسلام"
posted = "2007-02-06"
text = "يقول كتاب النصارى على لسان سيدنا المسيح عيسى ابن مريم - حاشا لله أن يكون هذا كلامه -<br />لاَ تَظُنُّوا أَنِّي جِئْتُ لأُلْقِيَ سَلاَمًا عَلَى الأَرْضِ. مَا جِئْتُ لأُلْقِيَ سَلاَمًا بَلْ سَيْفًا. 35فَإِنِّي جِئْتُ لأُفَرِّقَ الإِنْسَانَ ضِدَّ أَبِيهِ، وَالابْنَةَ ضِدَّ أُمِّهَا، وَالْكَنَّةَ ضِدَّ حَمَاتِهَا. 36وَأَعْدَاءُ الإِنْسَانِ أَهْلُ بَيْتِهِ<br />(إنجيل متى - الإصحاح العاشر - العهد الجديد - الكتاب المقدس)<br />27أَمَّا أَعْدَائِي، أُولئِكَ الَّذِينَ لَمْ يُرِيدُوا أَنْ أَمْلِكَ عَلَيْهِمْ، فَأْتُوا بِهِمْ إِلَى هُنَا وَاذْبَحُوهُمْ قُدَّامِي<br />(إنجيل لوقا - الإصحاح التاسع عشر - العهد الجديد - الكتاب المقدس)<br />اللهم إنا نشهدك أنا نشهد لرسولك عيسى ابن مريم أن هذا ليس بكلامه<br />أنظروا إلى رسول الله محمد صلى الله عليه وسلم حينما كان يبعث بعثا إلى المشركين ليخرجهم من الظلمات إلى النور كانت هذه وصيته لهم<br />( انطلقوا باسم الله وبالله وعلى ملة رسول الله ولا تقتلوا شيخا فانيا ولا طفلا ولا صغيرا ولا امرأة ولا تغلوا وضموا غنائمكم وأصلحوا وأحسنوا إن الله يحب المحسنين)<br />مين فينا الإرهابي يا tota"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"
