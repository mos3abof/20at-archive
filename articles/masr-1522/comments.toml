text = "بالنسبه للصور ان المسيحين لا يعبدون الصور ولا بيبخروا للصور لكن ياخذوها شفيعا لهم عند الله .كما يتاخذ المسلمون الحسيني والسيده زينب شفيعا لهم...<br />اما بالنسبه للقسس انهم يتزوجون قبل ان يرسموا ولكن اذا ماتت امراته وهو قسيس لا يتزوج لان المسيحين كما تعلمون يقولون للقسيس يابونا ..هل من اب يتزوج ابنته؟؟؟<br />وبعدين من اللي قال ان ربنا تزوج حاشا لله<br />وكمان مين اللي قال ان الزواج غريزه حيوانيه اذا كانت الكنيسه تقدسه وتعتبره سر مقدس والذي يجمعه الله لا يفرقه انسان"
archived = "2007-02-09"
