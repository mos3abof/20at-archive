[[comments]]
order = 36
subject = "إلى tota"
author = "ابن الإسلام"
posted = "2007-02-04"
text = "إذا نظرت إلى الصورة التي في أعلى الصفحة سوف تجدي راهبتين جاثيتين على ركبتيهما أمام صورة لا تضر ولا تنفع<br />وإذا كنتم لا تقدسون إلا الله فلم لا تعبدون إلا الله أيضا؟؟؟؟<br />ولماذا تناقضي نفسك؟؟ (أنا معاك في الايه التي تقول ان الله قريب يستجيب لاي انسان في اي وقت او في اي مكان) وبعدها بسطرين تقولين (وبالنسبه للشفاعه ده في الحياه العاديه بتعتنا لما بيكون الانسان طلب عند حد ويكون له منصب بيوسط له حد قريب منه مش اكتر من كده) يعني لو كان الله سيستجيب بدون واسطة لماذا لا تطلبي منه مباشرة؟؟؟<br />بالنسبة للنقطة الثانية أنا أعلم لماذا لا تستطيعين أن توصلي لي بإيضاح أن الله - حاشا له - أب للمسيح... أتعرفين لماذا؟<br />لأنك أنت نفسك لا تفهمين كيف يكون المسيح ابنا لله<br />لو كان الله متزوجا وأنجب لكانت مصيبة ، ولو أنجب بدون زواج لكانت كارثة.<br />وبالنسبة للزواج أنا أستخدم كلمة الزواج لا أقصد بها الإرتباط ولكني أقصد ما يكون بين الرجل وزوجته من معاشرة - وما يفهم بالتلميح لا ينفع معه التصريح - فهي فعلا غريزة حيوانية (وهذه ليست شتيمة) والراهب في ثقافتكم يترفع عنها.<br />وأما سؤالي الذي لم تردي عليه فكان (هل لديكم من المسيح نصا يقول فيه اتخذوني وأمي إلاهين من دون الله؟)<br />والإجابة هي أن الإنجيل لا يوجد به نصا يقول فيه المسيح (أنا الله أو أنا ابن الله)<br />الفتوا نظر رهبانكم إلى هذه النقطة حتى تقوم دار الكتاب المقدس بإضافتها إلى النسخة القادمة من الإنجيل حسبي الله ونعم الوكيل تخيلوا أن رأس النصارى في مصر هو من يعتمد الإنجيل يعني يقول هذا كلمة الله وهذا ليس بكلمة الله.<br />بسم الله الرحمن الرحيم (فَوَيْلٌ لِّلَّذِينَ يَكْتُبُونَ الْكِتَابَ بِأَيْدِيهِمْ ثُمَّ يَقُولُونَ هَـذَا مِنْ عِندِ اللّهِ لِيَشْتَرُواْ بِ<br />اقرأ بقية التعليق .."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 37
subject = "إلى من يسمي نفسه ابن المسيح"
author = "ابن الإسلام"
posted = "2007-02-04"
text = "يا عزيزي ربنا يسامحك ويهديك أنا لم أوجه كلامي إلا لكل عاقل ومنصف فقط<br />أذكر لي بالضبط أنا شتمت إمتى<br />بجد حاول تفكر بعقلك فإن الرهبان لن ينفعوك يوم القيامة<br />بسم الله الرحمن الرحيم (إِنَّ اللَّهَ لَعَنَ الْكَافِرِينَ وَأَعَدَّ لَهُمْ سَعِيرًا - خَالِدِينَ فِيهَا أَبَدًا لَّا يَجِدُونَ وَلِيًّا وَلَا نَصِيرًا - يَوْمَ تُقَلَّبُ وُجُوهُهُمْ فِي النَّارِ يَقُولُونَ يَا لَيْتَنَا أَطَعْنَا اللَّهَ وَأَطَعْنَا الرَّسُولَا - وَقَالُوا رَبَّنَا إِنَّا أَطَعْنَا سَادَتَنَا وَكُبَرَاءنَا فَأَضَلُّونَا السَّبِيلَا - رَبَّنَا آتِهِمْ ضِعْفَيْنِ مِنَ الْعَذَابِ وَالْعَنْهُمْ لَعْنًا كَبِيرًا)<br />اللهم اهد نصارى مصر وائت بهم"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 38
subject = "إلى الأخ خالد شداد والأخت مسلمة"
author = "ابن الإسلام"
posted = "2007-02-04"
text = "السلام عليكما ورحمة الله وبركاته وبعد<br />قال تعالى في سورة آل عمران بسم الله الرحمن الرحيم (كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِالْمَعْرُوفِ وَتَنْهَوْنَ عَنِ الْمُنكَرِ وَتُؤْمِنُونَ بِاللّهِ وَلَوْ آمَنَ أَهْلُ الْكِتَابِ لَكَانَ خَيْرًا لَّهُم مِّنْهُمُ الْمُؤْمِنُونَ وَأَكْثَرُهُمُ الْفَاسِقُون(َ<br />و قال تعالى في سورة يوسف بسم الله الرحمن الرحيم \"قُلْ هَـذِهِ سَبِيلِي أَدْعُو إِلَى اللّهِ عَلَى بَصِيرَةٍ أَنَاْ وَمَنِ اتَّبَعَنِي وَسُبْحَانَ اللّهِ وَمَا أَنَاْ مِنَ الْمُشْرِكِينَ\"<br />و قال تعالى في سورة النحل بسم الله الرحمن الرحيم\" ادْعُ إِلِى سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُم بِالَّتِي هِيَ أَحْسَنُ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ\"<br />و قال تعالى في سورة العنكبوت بسم الله الرحمن الرحيم \" وَلَا تُجَادِلُوا أَهْلَ الْكِتَابِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ إِلَّا الَّذِينَ ظَلَمُوا مِنْهُمْ وَقُولُوا آمَنَّا بِالَّذِي أُنزِلَ إِلَيْنَا وَأُنزِلَ إِلَيْكُمْ وَإِلَهُنَا وَإِلَهُكُمْ وَاحِدٌ وَنَحْنُ لَهُ مُسْلِمُونَ\"<br />نحن نريد لهم الخير وندعوهم بالتي هي أحسن ولعل الله ينقذ بهذه الدعوة ولو نفسا واحدة من النار<br />اللهم اهد نصارى مصر وائت بهم"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 39
subject = "إلى كل الذين يتابعون هذه الصفحة"
author = "ابن الإسلام"
posted = "2007-02-04"
text = "السلام عليكم ورحمة الله<br />أنا لم أجد في ردود إخواني المسلمين أي إهانة أو شتيمة وأذكرهم جميعا بقول الله تعالى<br />بسم الله الرحمن الرحيم<br />لَتُبْلَوُنَّ فِي أَمْوَالِكُمْ وَأَنفُسِكُمْ وَلَتَسْمَعُنَّ مِنَ الَّذِينَ أُوتُواْ الْكِتَابَ مِن قَبْلِكُمْ وَمِنَ الَّذِينَ أَشْرَكُواْ أَذًى كَثِيرًا وَإِن تَصْبِرُواْ وَتَتَّقُواْ فَإِنَّ ذَلِكَ مِنْ عَزْمِ الأُمُورِ<br />فاللهم ارزقنا الصبر واجعلنا من المتقين<br />اللهم اهد نصارى مصر وائت بهم"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 40
subject = "للآنسات التي معنا لا تقرأن هذا التعليق لأنه مخل بالآداب"
author = "ابن الإسلام"
posted = "2007-02-04"
text = "هل هذا ما تعتقدون أنه كلام الله؟؟؟<br />استمتعوا إذا<br />الفصل السابع من نشيد الإنشاد - العهد القديم - الكتاب المقدس<br />الفصل ٧<br />الجوقة<br />١إرجِعي، إرجِعي یا شُولَمي ة!<br />إرجِعي، إرجِعي فنَنظُرَ إليكِ!<br />العریس<br />لِماذا تَنظُرونَ الشُّولَميةَ<br />آأنَّها تَرقُصُ بَينَ صَفَّينِ؟<br />٢ما أجملَ خَطَواتِكِ بالحِذاءِ<br />یا بِنتَ الأميرِ!<br />دوائِرُ فَخذَیكِ حِليٌّ<br />صاغَتْها یَدٌ ماهِرةٌ.<br />٣سُرَّتُكِ آأسٌ مُدَوَّرَةٌ<br />مَزیجُ خمرِها لا یَنقُصُ،<br />وبَطنُكِ عَرَمَةُ حِنطَةٍ،<br />یُسَيِّجُها السَّوسَنُ.<br />٤ثَدیاكِ تَوأما ظَبْيَةٍ<br />صغيرانِ بَعدُ.<br />٥عُنُقُكِ بُرْجٌ مِنَ العا جِ،<br />وعيناكِ آبِرآتَي حَشبو ن<br />عِندَ بابِ بَيتَ رَبيمَ.<br />أنفُكِ آبُرجِ لبنانَ<br />المُشرِفِ على دِمَشقَ.<br />٦رأسُكِ مُكلَّلٌ آالكَرمَلِ،<br />وشَعرُ رأسِكِ أُرجوانٌ.<br />جَدائِلُهُ تَأْسُرُ المَلِ ك.<br />٧جميلةٌ أنتِ یا حبيبةُ!<br />ما أحلى دَلالَكِ.<br />٨قامَتُكِ مِثلُ النَّخلةِ،<br />وثَدیاكِ آَعناقيدِها.<br />٩قُلتُ أصعَدُ النَّخلةَ<br />وأتعلَّقُ بِأغصانِها،<br />فيكونُ ثَدیاكِ لي<br />آَعناقيدِ الكَرمِ<br />عَبيرُ أنفِكِ آالتُّفاحِ،<br />١٠ وریقُكِ خمرٌ طَيِّبَةٌ<br />تَسُوغُ رَقراقَةً للحبيبِ<br />على الشِّفاهِ والأسنانِ.<br />العروس<br />١١ أنا لِحبيبي أنا،<br />وإليه اشْتياقي.<br />١٢ تَعالَ نَخرُجُ یا حبيبي<br />لِنبيتَ ليلَتَنا في الحُقولِ،<br />١٣ فنُبكِّرَ إلى الكُرومِ لِنَرى<br />هل أزهَرَ الكَرمُ<br />وتفَتَحَت زُهورُهُ؟<br />وهل نَوَّرَ الرُّمَّانُ؟<br />فأعطيَكَ هُناكَ حبِّي.<br />١٤ اللُّفَّا ح نَشَرَ عَبيرَهُ،<br />وآُلُّ شَهيّ<br />اقرأ بقية التعليق .."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 41
subject = "صراع يعقوب مع الله في الإنجيل"
author = "ابن الإسلام"
posted = "2007-02-04"
text = "تخيلوا ما يقوله الكتاب المقدس عن الله عز وجل - تعالى الله عما يقولون علوا كبيرا -<br />والله إن من يعتقد هذا في الله ليستحق أن يخلد في جهنم<br />الفصل 32 من سفر التكوين - العهد القديم - الكتاب المقدس<br />وقامَ في اللَّيلِ، فأخَذَ امرَأَتَيهِ وجارِيَتَيهِ وبنيهِ الأَحَدَ عشَرَ وعَبَرَ مخاضَةَ يبُّو ق، ٢٤ أخَذَهُم وَأرسَلَهُم عَبرَ الوادي معَ آُلِّ ما آانَ لَه. ٢٥ وبقيَ يعقوبُ وحدَهُ، فصارَعَهُ رَجُ ل حتّى طُلوعِ الفَجرِ.<br />٢٦ ولمَّا رأَى أنَّه لا يقوى على يعقوبَ في هذا الصِّراعِ، ضرَبَ حُقَّ وِرْآِه ف انخَلَعَ. ٢٧ وقالَ لا » : فقالَ يعقوبُ «! طَلَعَ الفجرُ ف اترُآْني » : لِيعقوبَ ما » : ٢٨ فقالَ الرَّجلُ .« أتْرُآُكَ حتّى تُبارِآَني لا يُدعَى » : ٢٩ فقالَ .« اسمي يعقوبُ » : قالَ «؟ اسمُكَ اسمُكَ يعقوبَ بَعدَ الآنَ بل إِسرائيل ، لأنَّكَ غالَبْتَ اللهَ أخبِرْني ما » : ٣٠ وسألَهُ يعقوبُ .« والنَّاسَ وغلَبْتَ وبارَآَهُ .« لماذا تسأَلُ عَنِ اسمي » : فقالَ .« اسمُكَ هُنا ك.<br />٣١ وسمَّى يعقوبُ ذلِكَ المَوضِعَ فنوئيل، وقالَ:.« لأنِّي رأيتُ اللهَ وجهاً إلى وجهٍ ونجَوتُ بِحياتي ٣٢ وأشرَقَت لهُ الشَّمسُ وهوَ يعبُرُ فَنوئيلَ عارِجاً مِنْ وِرْآِه. ٣٣ لِذلِكَ لا يأآُلُ بَنو إِسرائيلَ عِرقَ النَّسا الّذي في حُقِّ الوِرْكِ إلى هذا اليومِ، لأنَّ الرَّجلَ ضرَبَ حُقَّ وِرْكِ يعقوبَ على عِرقِ النَّسا.<br />حسبي الله ونعم الوكيل<br />انظروا في المقابل كلام الله عز وجل في القرآن الكريم - سورة آل عمران - آية 26- 27<br />بسم الله الرحمن الرحيم (قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَن<br />اقرأ بقية التعليق .."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 42
subject = "النص مرة أخرى"
author = "ابن الإسلام"
posted = "2007-02-04"
text = "لمن لم يفهم النص السابق هذا نص آخر لنفس القصة من إصدار آخر لكتاب النصارى<br />لاحظوا أن كلمة (رجل) أصبحت (إنسان) وكلمة (غالبت الله) أصبحت (لأَنَّكَ جَاهَدْتَ مَعَ اللهِ وَالنَّاسِ وَقَدَرْتَ)<br />الفصل 32 من سفر التكوين - العهد القديم - الكتاب المقدس<br />22ثُمَّ قَامَ فِي تِلْكَ اللَّيْلَةِ وَأَخَذَ امْرَأَتَيْهِ وَجَارِيَتَيْهِ وَأَوْلاَدَهُ الأَحَدَ عَشَرَ وَعَبَرَ مَخَاضَةَ يَبُّوقَ. 23أَخَذَهُمْ وَأَجَازَهُمُ الْوَادِيَ، وَأَجَازَ مَا كَانَ لَهُ. 24فَبَقِيَ يَعْقُوبُ وَحْدَهُ، وَصَارَعَهُ إِنْسَانٌ حَتَّى طُلُوعِ الْفَجْرِ. 25وَلَمَّا رَأَى أَنَّهُ لاَ يَقْدِرُ عَلَيْهِ، ضَرَبَ حُقَّ فَخْذِهِ، فَانْخَلَعَ حُقُّ فَخْذِ يَعْقُوبَ فِي مُصَارَعَتِهِ مَعَهُ. 26وَقَالَ: «أَطْلِقْنِي، لأَنَّهُ قَدْ طَلَعَ الْفَجْرُ». فَقَالَ: «لاَ أُطْلِقُكَ إِنْ لَمْ تُبَارِكْنِي». 27فَقَالَ لَهُ: «مَا اسْمُكَ؟» فَقَالَ: «يَعْقُوبُ». 28فَقَالَ: «لاَ يُدْعَى اسْمُكَ فِي مَا بَعْدُ يَعْقُوبَ بَلْ إِسْرَائِيلَ، لأَنَّكَ جَاهَدْتَ مَعَ اللهِ وَالنَّاسِ وَقَدَرْتَ». 29وَسَأَلَ يَعْقُوبُ وَقَالَ: «أَخْبِرْنِي بِاسْمِكَ». فَقَالَ: «لِمَاذَا تَسْأَلُ عَنِ اسْمِي؟» وَبَارَكَهُ هُنَاكَ.<br />30فَدَعَا يَعْقُوبُ اسْمَ الْمَكَانِ «فَنِيئِيلَ» قَائِلاً: «لأَنِّي نَظَرْتُ اللهَ وَجْهًا لِوَجْهٍ، وَنُجِّيَتْ نَفْسِي». 31وَأَشْرَقَتْ لَهُ الشَّمْسُ إِذْ عَبَرَ فَنُوئِيلَ وَهُوَ يَخْمَعُ عَلَى فَخْذِهِ. 32لِذلِكَ لاَ يَأْكُلُ بَنُو إِسْرَائِيلَ عِرْقَ النَّسَا الَّذِي عَلَى حُقِّ الْفَخِْذِ إِلَى هذَا الْيَوْمِ، لأَنَّهُ ضَرَبَ حُقَّ فَخْذِ يَعْقُوبَ عَلَى عِرْقِ النَّسَا<br />مرة أخرى حسبي الله ونعم الوكيل"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

