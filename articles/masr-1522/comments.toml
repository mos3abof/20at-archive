[[comments]]
order = 22
subject = "شكرا على الرد المهذب يا tota"
author = "ابن الإسلام"
posted = "2007-02-02"
text = "السلام على من اتبع الهدى<br />شكرا لك على الإهتمام وأرجو أن تقرأي بإنصاف تعليقي على ردك<br />بالنسبة لأول سؤال \"قولوا لي بالله عليكم ما صلاتكم إلى التماثيل والأيقونات في الكنائس والأديرة إلا صورة من صور عبادة الأصنام؟\" كان ردك \" بالنسبه للصور ان المسيحين لا يعبدون الصور ولا بيبخروا للصور لكن ياخذوها شفيعا لهم عند الله .كما يتاخذ المسلمون الحسيني والسيده زينب شفيعا لهم\"<br />وأنا أقول لك أن هذا موجود فعلا تعظيمكم لصور وتماثيل تدعون أنها للسيدة مريم وتقديم القرابين لها. أما قولك \"لكن ياخذوها شفيعا لهم عند الله\" فقد قالها من قبلك عباد الأصنام فعلا \"بسم الله الرحمن الرحيم: والذين اتخذوا من دونه أولياء ما نعبدهم إلا ليقربونا إلى الله زلفى إن الله يحكم بينهم فيما هم فيه يختلفون إن الله لا يهدي من هو كاذب كفار\"<br />وأما قولك \"كما يتاخذ المسلمون الحسيني والسيده زينب شفيعا لهم\" فأقول لك هذا ليس من الإسلام في شئ وليس ذلك من عقيدة المسلمين وإن قام به بعض جهالهم هداهم الله<br />أحكمي على الإسلام لا على المسلمين واحكمي عليه من مصدريه الكتاب والسنة<br />قال الله تعالى \" وإذا سألك عبادي عني فإني قريب أجيب دعوة الداع إذا دعان\" فالله لم يجعل واسطة بينه وبين عباده وأخيرا أنظري إلى الصورة الموجودة أعلى الصفحة واعلمي أن تقديس التماثيل عند النصارى منتشر في العالم كله لا مصر فقط<br />ثانيا: بالنسبة لثاني سؤال أنا قلت \"كيف لاتقبلون أن يتزوج القس لأن الزواج غريزة حيوانية وترضون ذلك على رب العالمين؟\"<br />وكان ردك للأسف عذر أفظع من ذنب \"اما بالنسبه للقسس انهم يتزوجون قبل ان يرسموا ولكن اذا ماتت امراته وهو قسيس لا يتزوج لان المسيحين كما تعلمون يقولون للقسيس يابونا ..هل من اب يتزوج ابنته؟؟؟<br />وبعدين من اللي قال ان ربنا تزوج حاش<br />اقرأ بقية التعليق .."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 23
subject = "أنا أؤيد هذا الرأي بشدة"
author = "ابن الإسلام"
posted = "2007-02-02"
text = "السلام على من اتبع الهدى<br />أنا أؤيد تعلبقي \"الى المدعوه هناء\" و\"اضافة\"<br />نعم ليس النصارى واليهود فقط من ادعى لله الولد<br />إقرأوا إن شئتم قول الله تعالى \"بسم الله الرحمن الرحيم: وقالت اليهود عزير ابن الله وقالت النصارى المسيح ابن الله ذلك قولهم بأفواههم يضاهئون قول الذين كفروا من قبل قاتلهم الله أنى يؤفكون\"<br />اللهم اهد نصارى مصر وائت بهم"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 24
subject = "شكرا علي اهتمامك"
author = "TOTA"
posted = "2007-02-02"
text = "بالنسبه لكلمه ان نحن ندعي انها صوره السيده العذراء انها بالفعل صورتها كما نعلم ان عصر الرومان كان مشهور بفن الرسم ووجدنا مثل هذه الصور في الكنائس الاثريه<br />انا معاك في الايه التي تقول ان الله قريب يستجيب لاي انسان في اي وقت او في اي مكان ولكن كما ياتي في تخيلك ان المسيحين يبخرون للسيده العذراء لا..<br />هو ليس بتبخير انما هو حب وتقدير لها المسيحيون لا يقدسون سوي الله ..<br />مثلا:زي ما يكون عندك شخص عزيز عليك بتقدره وبتحبه بتصوره وبتحتفظ بصورته معاك هل هذا يعتبر تقديس له<br />وبالنسبه للشفاعه ده في الحياه العاديه بتعتنا لما بيكون الانسان طلب عند حد ويكون له منصب بيوسط له حد قريب منه مش اكتر من كده<br />بالنسبه النقطه التانيه ان الله اب للمسيح هذه النقطه انا لا استطيع ان اوصلها لك بايضاح اذا قرات كتب في اللاهوت سوف تجد الاجابه علي سؤالك بوضوح واقتناع وهذه الكتب موجوده كتير الحمد لله<br />وبالنسبه للقسيس انه لا يفارق زوجته بعد ان يرسم قسيس لانه تزوجهاقبل ان يرسم قسيس والذي جمعه الله لا يفرقه انسان ولذلك تحرم الكنيسه زواج القس بعد موت امراته<br />وبعدين ماردك علي قولك ان الزواج غريزه حيوانيه؟؟؟؟ مين اللي قال كده واين قراتها؟<br />وبعدين سؤال ايه اللي ماجوبتش عليه ومين اللي قالك ان الانجيل محرف<br />اصول الاناجيل موجوده للان<br />وقبل ما تدعي لنصاري مصر ان ربنا يهديهم ادعي للمسليمين اللي مبيعرفوش ربنا ..الارهاب.."
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

