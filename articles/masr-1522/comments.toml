text = "الاخ اللي بيدعوا الاقبط للاسلام شوف ياعزيزي الاخوان بيعملوا ايه في فلسطين وغيرها قبل ماتقول المسيحيين مابيشغلوش عقولهم ولعلمك انه لولا ان المسيحيين شغلوا دماغه مولسه بيشغلوه كان زمان واحد زيك لسه بيعوم ف الترعه وبتكتب علي الخشبه عند الشيخ ده بدل ماتقول ربنا يكتر من امثالنا بتقول الله ات بهم علي فين ياعم وخدعتكم اتكشفت علي كل خلق الله"
