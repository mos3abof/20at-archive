[[comments]]
order = 30
subject = "الى ابن المسيح3"
author = "وبعدين انت تقصد ايه يعني من انك ابن المسيح اكيد ليك غرض"
posted = "2007-02-03"
text = "المسيح ابن الله<br />وانت ابن المسيح<br />يعني تقصد ان الله يبقى جدو بتاع انت ما هو ملهاش معنى غير كده<br />استغفر الله العظيم<br />سبحان ربك رب العزة عما يصفون وسلام على المرسلين والحمد لله رب العالمين<br />قل هو الله احد الله الصمد لم يلد ولم يولد ولم يكن له كفوا احد"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 31
subject = "الجعارين"
author = "المصريون القدماء كانوا يقدسون الخنفسة ويتبركون بها ويعملون تماثيل صغيرة لها وتوضع مع جثة الموتى للتبرك بها والشفاعة لهم وكان هذا شيئا غريبا جدا"
posted = "2007-02-03"
text = "ثم اكتشف بعد ذلك ان تلك الخنافس او الجعارين تلد بدون ذكر يا سلام على معجزة الخالق اليومية الذى امامنا<br />الجعار الواحد فية اجهزة الذكر والانثى معا<br />فليس مستغربا بقدرة اللة ان ينفخ اللة بروحة فى مخلوقة ادمية هى ستنا مريم اكرم نساء العالمين لتلد لنا نبى اللى عيسى<br />القران يقول ان عيسى كان عبدا للة انسانا عاديا وبشر ياكل ويشرب ويمشى فى الاسواق ويعظ الناس ومرسل لهداية بنى اسرائيل تلك الخراف الضالة على حسب انجلبهم<br />لم ينزل على عيسى اى تشريع او شريعة وقانون للناس وتنظيم علاقاتهم مع بعض او مع اللة بل حسب انجليهم اوقف العمل بشريعة موسى تماما بقولة من كان منكم بلا خطيئة فليرمها بحجر<br />وظهرت نظرية الخطيئة حينما اتى بولس الى الاسكندرية وتقابل مع الفلاسفة وطلعوا لنا بتلك النظرية الغريبة التى تقول ان الانسان يولد مجرم وابن مجرم ويحمل خطيئة ابوة ادم وان ابوة يسوع المخلص انصلب علشان يمحوا تلك الخطيئة وعصيان ادم لربة<br />ادم بعد الخطيئة تاب علية ربة فلماذا فلسفة الاسكندرية الكدابة وفلسفة الرومان<br />يايها المسيحيين اسلموا وبلاش تخريف لا منطقى"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 32
subject = "'"
author = "بسم الله الرحمن الرحيم"
posted = "2007-02-03"
text = "من محمد رسول الله إلى النجاشي عظيم الحبشه<br />سلام على من اتبع الهدي اما بعد<br />فإني أحمد إليك الله الذي لا إله إلاهوالملك القدوس السلام المؤمن المهيمن,وأشهد أن عيسى بن مريم روح الله وكلمته ألقاها إلى مريم البتول الطيبه الحصينه،فحملت بعيسى من روحه ونفخه،كما خلق أدم بيده،وإني أدعو إلى الله وحده لاشريك له،والموالاة على طاعته،وأن تتبعنى، وتؤمن بالذي جاءني، فإني رسول الله صلي الله عليه وسلم،وإني أدعوك وجنودك إلي الله عز و جل،وقد بلغت ونصحت،فأقبل نصيحتي،<br />والسلام على من إتبع الهدى ـ1ـ بحث في السيره النبويه الرحيق المختوم ص 359"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 33
subject = "اقتربت الساعة"
author = "مسلم"
posted = "2007-02-03"
text = "اننى لأشفق على النصارى الذين يلغون عقولهم التى فضلنا الله بها على سائر مخلوقاته ولا يعرفون سوى افتح قلبك؟؟ أفلا يتدبرون مصيرهم المحتوم؟؟ لا يوجد نص واحد فيما بين أيديهم من أناجيل مختلفة يدعى فيه المسيح عليه السلام الألوهية ولم يطلب من البشر عبادته؛ بل هناك آلاف النصوص التى يقول فيها اعبدوا الله الذى أرسلنى ومع ذلك يضربون بعرض الحائط حتى مابين أيديهم من أناجيل وهى بالقطع محرفة بل ومؤلفة ولا يستمعون الا للقساوسة : افتح قلبك وكفى.. حقا انها مسألة سهلة افتح قلبك وماعليك ازنى اكذب واشرب الخمر فقد تحمل عنك المسيح كل شىء ولا يعلمون أن المسيح عليه السلام براء منهم وتعالى الله عما يشركون"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 34
subject = "استغفر الله العظيم"
author = "مسلمة"
posted = "2007-02-04"
text = "انتو ليه دخلتو نفسكو فى مناقشة عقيمة ايه فاكرين بكلمكو هيسلمو ولا هما فاكرين بكالمهم اننا هنؤمن بمعتقداتهم!!!!!!<br />وازاى سمحتو لحد يقول الكلام ده<br />وفين ادارة الموقع ايه المهزله دى<br />يعنى انا مش شايفه سبب لكده ايه حرية!!!!!!!<br />انتو كمان هتقولو حرية<br />اتقو الله<br />حرام عليكو بجد لازم فيه رقابة<br />فى فرق شاسع بين الحرية وبين التعدى وقلة الاحترام<br />ده مش تعدى علينا كاشخاص ده اتعدى على كل قيمنا ومبادئنا تعدى على جذورنا واساسنا وانتو حتى مش عملتو حاجه<br />على فكرة الموقع ده نزل من نظرى جدااااااااااااااا<br />اتقوا الله"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

