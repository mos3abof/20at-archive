text = "أنا ما زلت منتظرا ردك على تعليقي \"إلى tota\" وكذلك أريدك أن تتصفحي الإنجيل الذي تقولين أنه ليس محرف - ده إذا كان عندك منه نسخة - تصفحيه جيدا وقولي لي أن النصوص التي ذكرتها ليست فيه وأني أفتري عليكم الكذب<br />وأيضا حاولي أن تنصحي المعلقين من غير المسلمين أن يلتزموا الأدب في الحوار وأن تكون ردودهم بعقلانية.<br />اللهم اهد نصارى مصر وائت بهم"
