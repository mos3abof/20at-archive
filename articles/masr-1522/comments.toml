text = "وقبل ما تشتم وتقول انك ابن المسيح روح شوف فيه حاجه اسمها (موعظة الجبل) عندكم في الدين بتاعكم روح اقرأ موعظة الجبل كويس وشوف المسيح قال فيها ايه وبعدين ابقى قرر اذا كنت تنسب نفسك للمسيح ولا لا"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209190309/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
