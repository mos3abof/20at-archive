posted = "2007-02-01"
text = "وهل للمخنسين انصاف السيدات راى<br />لو كان شيئا طبيعيا ورجلا سويا كان من الممكن ان تاخذ راية<br />ولكنة رجل يستعمل من الخلف وفاقد الاهلية ومخة فى طيزة زى ما بيقولوا<br />اتركوة فى حالة"
archived = "2007-02-02"
