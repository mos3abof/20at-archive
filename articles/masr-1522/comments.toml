subject = "لمن جاء متأخرا"
author = "ابن الإسلام"
posted = "2007-01-31"
text = "أقول لمن لم يتابع الصفحة من بدايتها كان هناك حيوان كاتب تعليقه بطريقة Franco arabic يبدو أن إدارة المنتدى قامت مشكورة بحذف هذا التعليق وتعليقي السابق \"الصارم المسلول\" كان موجه لهذا الوغد دون غيره<br />ولذلك وجب علي التنويه إلى أن تعليقي \"الصارم المسلول\" ليس موجه لأخي صاحب تعليق \"إلى المدعوة هناء\"<br />اللهم اهد نصارى مصر وائت بهم"
archived = "2007-02-02"
