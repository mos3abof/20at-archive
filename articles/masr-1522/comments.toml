[[comments]]
order = 3
subject = "الله واحد"
author = "فهد الا سلام"
posted = "2007-01-31"
text = "امنا السيدة العذرا هى من افضل نساء العلمين وهى ام سيدنا عيسى علية وعلى نبينا الصلاةالتسليم وهو من خير الا نبياء وامة صديقة والا سلام شرف السيدة مريم وسيدنا عيسى اما مسلة الحجاب فانهوا فطرة فى المراة حتى الغير مسلمة والمتبرجة تجدها فى بيتها لا بسها ايشارب او مغطية شعره لانى دى فطرة خلقها لة الله لكن العلمنية والا بحية جعلت المراة تخرج حتى من غير ملا بس يعنى احنا بنقول انى الحجاب مش اسلا مى وبس لا دة فطرت الله لكل النساء وبعدن والله لو كل واحد عمل بلاى بيقولة دينة مش هتبقى فية مشكلة ومعلش حكاية الهوية سيدنا عيسى دة كلام لا يمت للعقل بصلة ان كنتم انتم تقولون ان عيسى ابن الله ويقول اليهود عازير ابن الله حتى عندنا نحن المسلمين فية فاة ضالة الشيعة تقول ان سيدنا علي ابن الله والبهاية ايضا وكثير من غير المسلمين يمجدوان اشخاص وينسبونو الى الله فمن نصدق منكم وكل واحد ياتى بدلية ولكنه ليس مقنع استحلفكم بالله ان تقرواء وتدرسوا وتعرفوا الحق من الباطل لانى الله هو واحد احد وكلنا عبيد عند الله وهو يقول لشى كن فيكون ومحدش من الا خوة يزعل منى وياريت يكون النقاش مو ضوعى من غير الفاظ لانه من اكبر الكبارا ان يسب شخص دين من عند الله نحن نعترف با لمسحية واليهودية ولكن الا سلام يجب ما قبلة اقراو وتعلموا وادرسو الا ديان حتى يتضح الحق من البا طل وصلاة وسلام على سيدنا محمد وعلى عيسى ومو سى وعلى كل الا نبياء المرسالين"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025931/http://masr.20at.com:80/article.php?sid=1522"

