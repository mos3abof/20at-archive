[[comments]]
order = 5
subject = "الى المدعوه هناء"
author = "على ما يبدو انك مسيحية ومشكلة المسيحيين انهم لغوا الله الخالق واعطوا كل اختصاصاته الى المسيح واصبح المسيح هو الله."
posted = "2007-01-31"
text = "لا يا ماما الله هو الخالق والمسيح مخلوق من مخلوقات الله.<br />والمسيحيين مش اول طائفة من البشر تأله واحد من البشر فقبل المسيحيين فيه طوائف كثيرة الهت البشر وعلى سبيل المثال لا الحصر الهنود يعبدون الاله رام وحتى كمان هدوا مسجد في الهند اسمه المسجد البابري وبنوا مكانه معبد الاله رام وبيقولوا ان الاله رام ولد في هذا المكان.<br />واخيرا الله هو المستحق بالعبادة لانه هو الذي خلق.<br />المسيح لا يستحق العبادة لانه لم يخلق شيئا<br />فهمتيها ولا لسه"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025931/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 6
subject = "اللهم اهد نصارى مصر وائت بهم"
author = "ابن الإسلام"
posted = "2007-01-31"
text = "أيها النصارى اقرأوا ما تطلقون عليه كلمة الله إقرأوا سفر التكوين إقرأوا أعمال الرسل إقرأوا نشيد الإنشاد لتروا ما تصفون الله عز و جل به وما ترمون به أنبيائه.<br />سيقول لكم رهبانكم \"أغمض عينيك واتبعني\" ووالله لا أجد ما أقوله لكم إلا قول ربي \"وَمِنَ النَّاسِ مَن يَتَّخِذُ مِن دُونِ اللّهِ أَندَاداً يُحِبُّونَهُمْ كَحُبِّ اللّهِ وَالَّذِينَ آمَنُواْ أَشَدُّ حُبًّا لِّلّهِ وَلَوْ يَرَى الَّذِينَ ظَلَمُواْ إِذْ يَرَوْنَ الْعَذَابَ أَنَّ الْقُوَّةَ لِلّهِ جَمِيعاً وَأَنَّ اللّهَ شَدِيدُ الْعَذَابِ<br />- إِذْ تَبَرَّأَ الَّذِينَ اتٌٌُّبِعُواْ مِنَ الَّذِينَ اتَّبَعُواْ وَرَأَوُاْ الْعَذَابَ وَتَقَطَّعَتْ بِهِمُ الأَسْبَابُ - وَقَالَ الَّذِينَ اتَّبَعُواْ لَوْ أَنَّ لَنَا كَرَّةً فَنَتَبَرَّأَ مِنْهُمْ كَمَا تَبَرَّؤُواْ مِنَّا كَذَلِكَ يُرِيهِمُ اللّهُ أَعْمَالَهُمْ حَسَرَاتٍ عَلَيْهِمْ وَمَا هُم بِخَارِجِينَ مِنَ النَّارِ\"<br />اعلموا أن المسلم لا يكون مسلما إلا إذا آمن بأن سيدنا عيسى هو رسول من أعظم الرسل وأن السيدة الطاهرة البتول مريم من الصديقات<br />أنا حزين عليكم وناصح لكم أنتم جيراننا ووالله إنا لنرجو لكم الفوز والنجاة فأعطوا لأنفسكم وعقولكم الفرصة دون تعصب<br />أسأل الله أن يهديكم"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025931/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 7
subject = "الصارم المسلول على شاتم الرسول"
author = "ابن الإسلام"
posted = "2007-01-31"
text = "أرسلت تعليقي السابق قبل قراءة تعليق هذا الكافر الحيوان قبلي<br />أيها الكلب - بل أنت أدنى وأضل من الكلاب-أسأل الله أن يذلك ويقصم ظهرك وأسأله أن تتمنى الموت فلا تجده.<br />أيها المسلمون يقول الله عز وجل في سورة العنكبوت: بسم الله الرحمن الرحيم \" وَلَا تُجَادِلُوا أَهْلَ الْكِتَابِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ إِلَّا الَّذِينَ ظَلَمُوا مِنْهُمْ وَقُولُوا آمَنَّا بِالَّذِي أُنزِلَ إِلَيْنَا وَأُنزِلَ إِلَيْكُمْ وَإِلَهُنَا وَإِلَهُكُمْ وَاحِدٌ وَنَحْنُ لَهُ مُسْلِمُونَ\"<br />فهذا الخنزير من الظالمين الذين استثنتهم الآية<br />اعلموا أيضا أن الشتم والسب هو أسهل ما يكون ولكنه حجة الضعيف الضال<br />اللهم اهد نصارى مصر وائت بهم"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025931/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
