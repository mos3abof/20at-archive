[[comments]]
order = 12
subject = "بالنسبة لهرم خوفو وباقى الاهرامات!"
author = "محمد صبري"
posted = "2007-01-31"
text = "هو بصراحة الموضوع من المواضيع اللى زى مابيقولو عليها : ذات نهاية مغلقة<br />يعنى مش بتتطلب تعلقيات كتيرة .. لكنها بتستدعى موضوعات اخرى قريبة الشبه منها او ربما مغايرة<br />ودا اللى حصل فعلا !!<br />ومن ضمن المواضيع دا ، لاحظت ان احد المعلقين ذكر ان هرم خوفو تم بنائه ليكون مقبرة للفرعون...<br />فقط احب ان اصحح ذلك : فآخر ماتوصل اليه العلماء هو ان الاهرامات الثلاث لم تك مقابر على الاطلاق وكان احد الادلة على ذلك انها لم تك اساسا ثلاث اهرام فحسب بل ان هناك اكثر من هرم صغير منتشر بطريقة معينة فى المكان ... لكن الكشف الرهيب الذى اعلنوا عنه (لكن لم يعره احد اهتماما باعتبار اننا دولة تحترم العلم) هو ان الشكل الهندسى لجميع الاهرامات وطريقة بنائها اثبت للعلماء انها كانت تستخدم فى انتاج الموجات فوق الصوتية عالية التردد (ومحدش يسألنى ازاى) وقام العلماء بالفعل بالتأكد من تلك النتيجة حين فحصوا اكثر من تابوت من توابيت الفراعنة وتيقنوا تماما ان ملمس التابوت من الداخل يستحيل معه ان تكون يد بشريه هى التى صنعته وانما تم استخدم الطاقة فوق الصوتية المولدة من تلك الاهرامات (اهرامات بناء الطاقة) من اجل هذا الهدف واهداف اخرى عديدة (ربما نكتشفها فيما بعد)<br />آسف للاطالة."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025931/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 13
subject = "آيات من سورة مريم"
author = "ابن الإسلام"
posted = "2007-02-01"
text = "السلام عليكم ورحمة الله<br />بسم الله الرحمن الرحيم:<br />وَقَالُوا اتَّخَذَ الرَّحْمَنُ وَلَدًا<br />لَقَدْ جِئْتُمْ شَيْئًا إِدًّا<br />تَكَادُ السَّمَاوَاتُ يَتَفَطَّرْنَ مِنْهُ وَتَنشَقُّ الْأَرْضُ وَتَخِرُّ الْجِبَالُ هَدًّا<br />أَن دَعَوْا لِلرَّحْمَنِ وَلَدًا<br />وَمَا يَنبَغِي لِلرَّحْمَنِ أَن يَتَّخِذَ وَلَدًا<br />إِن كُلُّ مَن فِي السَّمَاوَاتِ وَالْأَرْضِ إِلَّا آتِي الرَّحْمَنِ عَبْدًا<br />لَقَدْ أَحْصَاهُمْ وَعَدَّهُمْ عَدًّا<br />وَكُلُّهُمْ آتِيهِ يَوْمَ الْقِيَامَةِ فَرْدًا<br />اللهم اهد نصارى مصر وائت بهم"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025931/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 14
subject = "المسيح لم يقتل ولم يصلب"
author = "ابن الإسلام"
posted = "2007-02-01"
text = "السلام عليكم ورحمة الله وبركاته<br />قال تعالى عن اليهود في سورة النساء<br />\" وَبِكُفْرِهِمْ وَقَوْلِهِمْ عَلَى مَرْيَمَ بُهْتَانًا عَظِيمًا<br />وَقَوْلِهِمْ إِنَّا قَتَلْنَا الْمَسِيحَ عِيسَى ابْنَ مَرْيَمَ رَسُولَ اللّهِ وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَـكِن شُبِّهَ لَهُمْ وَإِنَّ الَّذِينَ اخْتَلَفُواْ فِيهِ لَفِي شَكٍّ مِّنْهُ مَا لَهُم بِهِ مِنْ عِلْمٍ إِلاَّ اتِّبَاعَ الظَّنِّ وَمَا قَتَلُوهُ يَقِينًا<br />بَل رَّفَعَهُ اللّهُ إِلَيْهِ وَكَانَ اللّهُ عَزِيزًا حَكِيمًا \"<br />ونحن نؤمن بعودة المسيح للأرض<br />قال رسول الله صلى الله عليه وسلم :<br />\"والذي نفسي بيده! ليوشكن أن ينزل فيكم ابن مريم صلى الله عليه وسلم حكما مقسطا. فيكسر الصليب، ويقتل الخنزير، ويضع الجزية، ويفيض المال حتى لا يقبله أحد\".<br />وقال صلى الله عليه وسلم<br />\" لا تزال طائفة من أمتي يقاتلون على الحق ظاهرين إلى يوم القيامة. قال، فينزل عيسى بن مريم صلى الله عليه وسلم فيقول أميرهم: تعال صل لنا. فيقول: لا. إن بعضكم على بعض أمراء. تكرمة الله هذه الأمة\".<br />الحديثين من صحيح مسلم<br />اللهم اهد نصارى مصر وائت بهم"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025931/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 15
subject = "بوركت بوركت يا مريم"
author = "نيفين نيفى نوفا"
posted = "2007-02-01"
text = "مين فينا مبيكنش فى نفسه اجلال و محبه للسيده العزراء سيه نساء العالمين<br />كمسلمه اؤمن ان كلمه اديان زى ما قال عبد المجيد هدايه غلط و مش موجوده ف القران كله لان الاصل دين واحد و هو الاسلام<br />هى مشكاه واحده و ده نهائى<br />بس من الثوابت برده اننا كلنا مسلمين و مسيحين بنحب و بنحترم السيد مريم<br />سيده نساء العالمين"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025931/http://masr.20at.com:80/article.php?sid=1522"

[[comments]]
order = 16
subject = "الى الاخ محمد صبرى"
author = "مع احترامى لرأيك وقرائتك الا ان الهرم بنى من اجل الدفن"
posted = "2007-02-01"
text = "والا فما سر التابوت الرخامى الاحمر الموجود فى غرفة الملك وبغطائة الجرانيتى الاحمر<br />ولقد وجدت وكتبت تخمينات كثيرة عن حفظ الجثث والاشياء داخل الهرم وعدم تلفها<br />ثم ان هناك اكثر من 30 رسالة دكتوراة عن الهرم فى جامعات الغرب تتحدث عن عن تخمين طريقة البناء وكيفية نقل صخور تزن 80 طنا من اسوان الى الجيزة<br />صديقى ان الموضوع كبير ولكنة بنى اثاثا ليكون مقبرة للملك ابن الالة<br />مع وافر احترامى وتقديرى لك"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025931/http://masr.20at.com:80/article.php?sid=1522"

