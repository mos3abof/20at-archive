[[comments]]
order = 2
subject = "شوف البت"
author = "هبابه او هوبه او هبهوب"
posted = "2006-04-02"
text = "ايه يا نوفا تكلمي مفتاح وتديني الطنشه<br />انا زعلانه<br />ومخامصاكي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125350/http://www.20at.com/article2.php?sid=646"

[[comments]]
order = 3
subject = "هبهوب باشا احنا منقدرش"
author = "نيفين"
posted = "2006-04-03"
text = "يا باشا و احنا نقدر بس انتى عارفه من ساعه موضوع وحيد حامد ×الاخوان<br />لما قلنا اعبد الله انا و اكرم انت جيت تكحلها عميتها<br />وعبد الله طلب ابعتله و افهمه قصدى<br />متحضرنا يا عبد الله مش كده و لا ايه<br />الا هبهوب حبيبتى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125350/http://www.20at.com/article2.php?sid=646"

