[[comments]]
order = 0
subject = "السلام"
author = "سلام"
posted = "2006-04-02"
text = "السلام عليكم<br />انا سيدي قال لي ذات مرة، ان احد صفعك كف، فلا تصفعه، لكن لا تنسى هذا الكف ابدا..<br />الارض لن تنسى ،"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125350/http://www.20at.com/article2.php?sid=646"

