posted = "2007-01-17"
text = "يعنى اية روز اليوسف او فا طمة اليوسف كثرين دخلو الا سلام علشان يخربوة يعنى وحد ة زى دى بتحتفل بكرسماس وبعيدين بلا ضحى تنقض عجيب وبعدين الا خ الكاتب جايب نوال السعدواى يعنى انت قال بتسال اهل الفتوى مهى انيل وادل ملحدة كفارة علنا اةةةةةةةةة واة اسلامة على الى وصلنا له الله يخرب بيتك يا حسنىانت والحرامية فى الرك الا سفل من النار"
