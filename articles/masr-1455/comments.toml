order = 0
subject = "عادي"
author = "إبن بهيه"
posted = "2007-01-16"
text = "بالطيع حين يغيب الموت إحسان عبدالقدوس ويضع النظام على كرسيه أحد ماسحي أحذية المخبرين فلابد أن تتلطخ روزاليوسف بصبغات وفارنيش الأحذية بني وأسود وأصفر وعلى كل لون يا باتسطا بدلا من حبر المطابع .. ده عادي وده اللي ما قدرش حد يقوله في الندوة صراحة ..<br />أما موضوع فاطمة اليوسف ذاتها .. فأنا لست مع أو ضد تكفيرها للأسباب التي ذكرت ولكن أمام اسمها علامات استفهام كبيرة وكثيرة كتلك التي تكومت حول أسماء بعض الأدباء والمفكرين الشوام الذين نزحوا إلى مصر في عهدها وعلاقاتهم بالتنظيمات الصهيونية التي يدعي بعضها الليبرالية والبعض الآخر الشيوعية لأهداف صهيونية في الأساس .<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161343/http://masr.20at.com:80/article.php?sid=1455"

