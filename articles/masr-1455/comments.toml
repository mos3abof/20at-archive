[[comments]]
order = 3
subject = "البغاء وصحافى روزاليوسف"
author = "فارس_fr"
posted = "2007-01-17"
text = "من الطبيعى ان ترى مجلة او جريدة روزاليوسف على ماهى عليه الان من طواعية للنظام ومحاباة لافكارة وتهليل وتكبير ومدح لاهل النظام بعد ما كانت فىسالف الدهر من المنابر الشريفة وصحافيها من اكثر الناس ابداعا , وذلك عندما ينتشر فيها البغاء نعم البغاء الصحفى على يد الست النظيفة المباركة المحبة للجنة السياسات \"كرم جبر \" عندما يكون فيها احد رعاة البغاء الصحفى مثل كرم جبر فلا تحزن اخى الكريم على شرف المهنة فمثل هذا الوباء يبيع كل شئ فى سبيل البقاء فى ظل النظام وتحت رعايته المباركية .<br />نصيحتى ليك ياكرم تبطل صحافة البغاء وتفتحلك ملهى ليلي احسنلك لان الناس خلاص عرفتك وعرفة انت بيعت شرفك فين ولمين وبكام<br />سلام ياصحافة ال.....!!"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161343/http://masr.20at.com:80/article.php?sid=1455"

