subject = "انتوا كنتم فاكرين ايه!"
author = "سنووايت"
posted = "2006-04-11"
text = "عويس وعواد وكل الناس كان لازم ياخدوا باقي اليومoff لانكم كنتم منتظرين من الحكومة حاجة بجد تستاهلوا<br />يا جماعه احنا بنصدق تصريحات الحكومة علشان معندناش حل تاني واللي مش هيصدقها يشرب من البحر<br />لكن لما تحطوا امل بقى انها تاخد حقكم وتعاقب المهمل والنصاب والضلالي يبقى كفر ايوا طبعا كفر لان ربنا هوه اللي على الظالم مش الحكومة ولا الصندوق الاسود المنقط كاروهات"
