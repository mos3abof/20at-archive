[[comments]]
order = 2
subject = "الله يرخم اللى ماتو بهذا المرض"
author = "عز"
posted = "2006-06-12"
text = "لوسمحتم ادعو لكل من مات بهذا المرض بالرحمة فانا قد توفى ابى وامى وخالى و جميع اقاربى تقريبا بهذا المرص واتمنى من الله ان يكون هذا الدواء حقيقا وناجح ليشفى من تبقى من العيلة"
archived = "2006-06-13"
