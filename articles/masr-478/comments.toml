[[comments]]
order = 3
subject = "الحكومة الرشيدة"
author = "ابو شريف"
posted = "2006-06-13"
text = "في بداية العصر المباركي تم نشر إعلان وتعهد مدفوع الأجر بجريدة الأهرام موقع من أطباء وعلماء بجامعة عين شمس يؤكدون فيه بأنه تم أخذ عينات من مياه النيل من أماكن مختلفة تمثل طول النهر وتم تحليلها وكانت النتيجة أن الكيماويات التي كانت تستخدمها وزير الري في الحكومة الرشيدة في ذلك الوقت - في ذمة الله حاليا - في مكافحة ورد النيل سوف تسبب العديد من الأمراض ولا يتم التخلص من آثارها عن طريق تكرير المياة المتبعة بوزارة الري وطالبوا في التقرير إستخدام الأجهزة التي كلفت الدولة ملايين الجنيهات وتم تخزينها في مخازن الوزارة ويومها دافع وزير الري عن موقفه ... أتقدم للسادة الأطباء الشرفاء المصريين أن يفيدوا الشعب المغلوب علي أمره هل أمراض الكبد والأمراض الأخرى التي تزايدت حاليا بسبب تلك الكيماويات أم بسبب الكيماويات المسرطنه التي سمسر علينا فيها وزير الزراعة السابق المعجزة أم الشعب المصري هو السبب في عدم قدرته علي السيطرة علي صحته ...<br />والي المنتظرين الرد من وزارة الصحة حول تأكيد دواء الطحالب من عدمه أاوكد لهم أن الرد سوف يتأخر لحين حصول السيد وزير الصحة علي الثانوية العامة"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613191504/http://masr.20at.com:80/article.php?sid=478&PHPSESSID=7544a8ad0826c6ed2288a687afead969"
