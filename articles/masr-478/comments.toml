[[comments]]
order = 0
subject = "حسبنا الله ونعم الوكيل"
author = "أشرف"
posted = "2006-06-08"
text = "لن نقول سوى حسبنا الله ونعم الوكيل بعد الفشل الكبدى يأتينا السرطان وكله بمباركة رجال الحكومه ووزرائهاثم ماذا بعد ذلك؟هناك من يستغل لهفة المرضى ويبيع لهم الوهم والحكومه ودن من طين والأخرى من عجين رغم الاعلانات بالصحف الحكوميهعن النصب والدجل"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613191504/http://masr.20at.com:80/article.php?sid=478&PHPSESSID=7544a8ad0826c6ed2288a687afead969"

