subject = "الريس متقال.."
text = "الريس متقال مات يوم الجمعة الماضي .. البقية في حياتكم .. والله زعلت جدا راجل يستاهل الحزن عليه .. أهو ده الريس ولا بلاش<br />** ملحوظة للسيد الرقيب) : أنا كان نفسي أعمل المداخلة دي في موضوع كف واحد صعيدي لاقت الموضوع سافر حتة تانية .. معلهش سماح النوبة"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231200/http://www.20at.com:80/article.php?sid=367"

[[comments]]
order = 8
subject = "معلومة وعلامة تعجب"
text = "جمال مبارك هو اللي اتخذ قرار تحرير سعر الصرف العام الماضي وبالتالي ارتفعت الأسعار بالشكل الجنوني الذي نعيشه الآن وعاطف عبيد برئ .. عاطف عبيد برئ والأيام اللي احنا عايشنها دلوقتي بروفة للأيام السودة اللي جاية .. وطبيعي الفقر يسكننا طول ما ولاد الناس التانية تحكمنا والناس التانية .. ناس غيرنا لا تدري بوجعنا وعجبي"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231200/http://www.20at.com:80/article.php?sid=367"

