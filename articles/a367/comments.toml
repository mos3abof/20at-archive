subject = "نفسي"
text = "نفسي... أعيش لغاية لما أسمع كلمة الرئيس السابق\" مش \"الراحل\" ...هوه محدش من رؤسانا بيسيب الكرسي بمزاجة أبدا...لازم يسيبة مكرهه مغصوب بقضاء الله!!!<br />نفسي .... حد من المخترعين العظام يخترع لنا كرسي الرئاسةأو الوزارة من التيفال عشان الرؤساء والوزراء ما يلزقوش فيه....آآآآآة يا نااااااااري:("
