subject = "عيب قوي"
text = "الناس اللي فرحانة كدة وشمتانة<br />عيب<br />كلنا بنعيا<br />صحيح أن مبنلاقيش أشعة ولا تحاليل<br />صحيح الدوا مش موجود والبديل أمريكاني وغالي<br />لكن برده يا جدعات<br />دي أقدار<br />وبعدين بقى<br />الضرب في الميت حرام"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231200/http://www.20at.com:80/article.php?sid=367"

