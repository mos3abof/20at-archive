[[comments]]
order = 18
subject = "ألف سلامة"
text = "ألف سلامه لضهر سعادتك إحنا فداه وف رهن إشارتك<br />كل الشعب بتاعنا بحاله نسى أحزانه وخيبة حاله<br />وبيتمنى شفاك وسعادتك<br />ترجع لينا بألف سلامه..... ويسلم لينا ضهر سعادتك<br />الأسعار راح نتحملها والأوضاع مش ح نعدِّلها<br />والتغيير ماحناش عايزينه إحنا هدفنا خلاص عارفينه<br />ترجع لينا بألف سلامه.....ويسلم لينا ضهر سعادتك<br />كرسى سعادتك جوّه عيونا.... وفوق الروس<br />مين يستجرا يهوِّب جنبه....أو يتّك عليه ويدوس<br />الرجلين ح نجددهالك وبعون الله القاعده كمان ح نجِّدهالك<br />وتعيش مرتاح العمر عليه من غير ماتحس بأى آلام ف الفقرات أو ف العصعوص<br />بس انت كمان ماتغيبش علينا الله يخليك وتسيبنا نلوص<br />دى الأيام من غير تصريح من فم سعادتك ماتعديش<br />والأحلام من غير ماتعيشها معانا سعادتك تبقى كابوس<br />ترجع لينا بألف سلامه.....ويسلم لينا ضهر سعادتك"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231200/http://www.20at.com:80/article.php?sid=367"
