[[comments]]
order = 15
subject = "راجع.. راجع"
text = "إلى كل المشككين والمغرضين. رئيسنا بخير حال وتمام التمام. وطلع امبارح في التليفزيون مطقم الجلابية والروب اللي هما. وبيطمن شعبه الحبيب (اللي هو احنا) انه راااااااااااااجع، وانه صحيح في آخر الدنيا بس عارف كل حاجة يا غجر."
