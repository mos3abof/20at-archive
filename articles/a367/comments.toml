[[comments]]
order = 11
subject = "الرجاء الهدوء..لرااااااااااااااحة المرضي"
text = "الموضوع شكله هايطول يااخونا..لسه فيه تمارين وعلاج طبيعي ونظام شوب اللبن علي \"غيار الريق\" وعلي اساس نشوف ايه اللي ممكن يحصل هناك والمؤدب وقليل الأدب واللي ماحدش مربية ممكن يتصرف ازاي لو الحاج شنق وهوه بيشرب.<br />فنهدا شوية ونعرف ان الصبر طويل وكله بأمره ومافيش حاجة بتيجي قبل ميعادها..واستني القطر..القطر مايستناش."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231200/http://www.20at.com:80/article.php?sid=367"

