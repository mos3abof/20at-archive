subject = "عاطف عاطف يحى عاطف"
text = "السيد الرئيس طلع اذكى من الشعب كله لما عين عاطف مكانه .<br />علشان كل الناس تدعيله ان يرجع بالسلامه علشان عاطف لا لا لا لا لا لا كفااااااايه اي حد تاني غير عاطف اي حد اي حد. كفايه حرام الدنيا بقت ضلمه خالص"
archived = "2004-09-26"
