subject = "إلى النصرانى القذر اللى كان فوق"
author = "Drsalah_hanie"
posted = "2006-11-27"
text = "نعم إنك أيها السافل لم تخيب ظنى فيكم وفى قلة أدبكم فهاهو نصرانى قذر يسب أشرف الخلق سيدنا محمد صلى الله عليه وسلم,<br />وهو هيجيب من بره,فهو ليس أقل سفاله من الارهابى الأكبر\"بنيدكت\" وليس أقل وضاعه من \"زكريا بقلظ\",وكل هذه السفاله من هذا النصرانى القذر هو أنى إقتبست مقالا بعنوان (اعرف عدوك,ساعات يبقى عايش على أرضك ويطعن فيك ( للشيخ<br />الجليل (أبو إسلام أحمد عبد الله)صاحب موقع<br />baladynet.net/<br />الموقع الذى يفضح مخططاتهم وأهدافهم الخبيثه فى مصر.<br />قساوسة مصر الذين يدعون حب مصر يقول أحدهم فى أحد الشرائط كلاما كله حب فى مصر وأهل مصر المسلمين الطيبين يقول فيه\"يامبارك لــــــو ماحققتش اللى إحنا عايزينه لو ماإدتناش حقنا يامبارك أقسملك إنك هتلاقى أمريكــــــــــــــــا بكره فى مصــــــــــــــــر ,وها تعمل فيكم يامسلمين زى ماعملت فى العراق,أقسملك يامبارك هانخلى مصـــــــــر عــــــــــــــراق تانيه\".<br />واللى عايز الرابط يقوللى وأنا هاكتبه المره الجايه.<br />والله يانصرانى ياجاهل لأفضح سفالتكم فى كل حته وهابين مدى حقدكم على المسلمين الغلابه اللى عايشين فى مصر اللى أنتم عايشين على أرضهم وبتاكلوا من خيرهم وبعدين تطعنوهم فى ضهرهم.<br />فللأسف عندما غاب الحق وهو الاسلام ,ظهر الباطل بجبنه وقذارته وعوت الذئاب ونبحت كلاب النصارى فى كل وادى.<br />ولكن لاتتعجل الشماته فينا فالاسلام وأهله قادمون وسوف ندافع عن ديننا وأرضنا وأهلنا الطيبين حتى آخر نفس فأبقوا على غيكم حتى يأتى نصر الله."
