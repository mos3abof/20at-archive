subject = "تجريح"
author = "klo"
posted = "2006-11-26"
text = "لماذا العرب وفقط العرب مشهورون بفن التجريح لان الحملة الصليبية قد نجحت في ان تتغلغل الى اعماق افكارنا سؤال الى سيادة الوزير هل من العدل ان تهاجم الدين الاسلامي بالذات مع فائق احترامي لباقي الاديان الباقية الا اذا كان قد دفع لك اجر يومك مسبقا من قبل اعداء الاسلام وحملتهم على الاسلام تلك الحرب التي يشنها من يدعي انه يحررنا من ادران الجهل والظلام لقد احتل المركز الاول وفي الصدارة باسم او باسماء عديدة استعملها كادوات خفية ليحارب دين الحضارات دين لكل الازمان لا ادري ما اقول ولكن دعوني اقولها بصراحة ان من اشعل فتيل قضيتي ومن احرق العالم بقذائفة ومن غزى العالم باسا ليب عدة باسم التطور ليكم العلم ومن زاد عليكم الفتنة حتى بداتم تتقاذفون المسبات هو في الاصل واحد راس الشر امريكا ومن والاها الا وهي اسرائيل فاحذروها يا عرب ان التاريخ يعيد نفسة ما حدث لقصة الاوس والخزرج هو نفس الطرقة ونفس اسلوب اسرائيل عبر العصور ولا استبعد انها تتدخل حتى للنيل من كل دم عربي كان او مسلم الى الدخول الى تلك المواقع لتنشا مشروع فساد جديد لتفرقة العرب كلو من عرب 48 الاخ المحب"
archived = "2006-11-29"
