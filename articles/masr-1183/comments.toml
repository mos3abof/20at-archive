[[comments]]
order = 17
subject = "الحجاب هو المسئول"
author = "طيف بدر"
posted = "2006-11-21"
text = "في البداية شعرت بالغضب من كلام الوزير الفنان فاروق حسني و لكن بعد التفكر و التدبر و بعد إلقاء تاريخ الرجل المفضوح منذ كان ملحقا ثقافيا في السفارة المصرية بفرنسا و ما تلا ذلك عن تقرير \"نيو يورك تايمز\" وجدت أن الوزير الفنان ربما يكون على حق و أن الحجاب هو السبب فيما وصلنا إليه من سوء الحال و تدهور الوضع .<br />فالحجاب هو السبب في استيراد القمح من الخارج و عدم التوسع في زراعته محليا بناء على رغبة دولة كبرى تصدر إلينا القمح<br />الحجاب هو المسئول عن سوء التخطيط في الصناعة و الزراعة و الاقتصاد و التعليم و الصحة<br />الحجاب هو المسئول عن ارتفاع أسعار المحروقات في بلد يسبح على بحر من الغاز الطبيعي و النفط و ارتفاع أسعار الأسماك في بلد به بحران و نهر و بحيرات طبيعية و صناعية و ارتفاع أسعار اللحوم و الخضراوات في بلد يمتلك تربة من أكثر الأنواع خصوبة و لكن الحجاب هو المسئول عن تجريف الأراضي الزراعية<br />الحجاب هو المسئول عن صفر المونديال و ما أنفق على هذا الصفر من ملايين الدولارات<br />الحجاب هو المسئول عن فضيحة التقرير الأكاديمي الصيني الذي صنف أفضل 500 جامعة عالميا لم يكن فيه جامعة مصرية واحدة بينما كان فيه جامعات إيرانية و مغربية و إماراتية و ماليزية \"إحنا بلد الريادة و الفول المدلوق على السجادة \"<br />الحجاب هو المسئول عن المحسوبية و الرشوة و نهب البنوك و الاختلاس و بيع عمر أفندي برخص التراب كي تذهب العمولة إلى جيب مسئول كبير<br />الحجاب هو المسئول عن تزوير الانتخابات و إهدار كرامة المصريين في الأقسام و الشوارع<br />الحجاب هو المسئول عن غرق العبارة و اصطدام القطارات و احتراق المسارح بمن فيها بل و ربما سيكون هو السبب في عدم اكتمال البرنامج النووي المصري القادم \" اللي لسة نونو\"<br />الحجاب هو المسئول عن غباء المسئو<br />اقرأ بقية التعليق .."
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129044059/http://masr.20at.com:80/article.php?sid=1183"

[[comments]]
order = 18
subject = "ALISLAM"
author = "أولا أحيى كل من دافع عن الحجاب وأسأل الله أن يجعل كلماته فى ميزانه يوم القيامة."
posted = "2006-11-21"
text = "ثانيا أقول لدعاة العلمانية\"موتوا بغيظكم\"فهذا دين الله ومن يجرؤ على محاربة الله!<br />ثالثا أقول لمن يتهم الاخوان بعدم الديمقراطية وتقبل الاراء أقول لهم إن أى حرية فى العالم لابد وأن يكون لها قيود تحكمها ...<br />هل يستطيع شخص من باب الحرية أن يقتل شخصا اخر أو يخرق قانونا للدولة التى يعيش فيها هل يستطيع سائق سيارة أن يتجاوز القوانين المروريه بدافع الحرية.!!!<br />بالطبع لا .<br />فالعالم كله يسير بالقوانين .<br />والاسلام وضع منهجا من عند الله الخالق والذى يعلم ماهو الصالح للبشريه ومالذى يفسدها لذا لايجوز التبجح على ماشرع الله من باب الحرية لأنه ليس هناك حرية مطلقه. لذا كان من واجب المسلمين جميعا وليس الاخوان فقط أن يرفضوا مثل هذه التصريحات.إذا كنت لاتستطيع أن تنظر للشمس وهى من خلق الله ,أتنظر وتتبجح لله وتقول له ليه أمرت المسلمات بارتداء الحجاب!!!<br />رابعا أقول إن الرد المناسب على دعاة العلمانية يكون بالافعال لذا فأنا أرجو من كل مسلمة أن تلتزم بحجابها عملا وسلوكا وأرجو من كل مسلمه غير مرتديه للحجاب أن تراجع نفسها وأن تعلم أن ماقيل حول الحجاب من أنه رجعيه وتخلف هو قليل من كثير مما يكمن فى صدور هؤلاء الحاقدين على كل فتاه عفيفه وأنهم لو تمكنوا من تعرية كل مسلمة لفعلوا فكل مناهم أن يروك كما يحبون وأن يرضوا نزواتهم وميولهم الجنسيه فى التمتع بالنظر إليك منادين بالتقدم المفقود من بسبب الالتزام بالحجاب!<br />هؤلاء شعارهم الاسمى (إديها عرى تديك تطور)<br />مع أن الله عز وجل قال \"ولاتبرجن تبرج الجاهلية الأولى \" فوصف الله تعالى العرى بالجاهلية وليس بالتقدم والتطور و..و..<br />أخيرا أقول أن أوائل الثانوية العامة من المحجبات دائما _<br />اقرأ بقية التعليق .."
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129044059/http://masr.20at.com:80/article.php?sid=1183"

