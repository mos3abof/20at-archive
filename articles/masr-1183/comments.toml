subject = "الموت للسعودية الوهابية"
author = "مصرى للابد"
posted = "2006-11-24"
text = "الف مليون لعنة على العرب البدو الهمج<br />انا مع الوزير المبدع فى كل ماقاله<br />لا للعودة للتخلف والهمجية<br />لا لاتباع هؤلاء البدو الهمج<br />مصر تحولت الى مجرد تابع لدولة الارهاب الاولى فى العالم السعودية الوهابية<br />كم اتمنى ان تقوم امريكا بضرب وسحق السعودية ونظامها الارهابى الوهابى<br />ان السعودية وليست العراق هو المصدر الاول للارهاب فى العالم<br />يجب ضرب السعودية وازلة نظامها الحقير<br />ولكن السؤال : ماذا يجب علينا كمصريين عمله لحماية بلادنا من هذا السرطان الهمجى الوهابى<br />التوقيع<br />مصرى للابد"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129044059/http://masr.20at.com:80/article.php?sid=1183"

[[comments]]
order = 25
subject = "الى مصري للأبد"
author = "سعودية وأفتخر"
posted = "2006-11-24"
text = "على فكرة انت مسكين لأن مين اللي جاب سيرة السعودية؟؟<br />اطلع على حقيقتك يامتخلف ولاتنسب نفسك مره ثانية الى المصريين لأن المصريين الاصيلين مش حاقدين ولا هجوميين وسواءء انت مع وزيرك المتخلف او ضده متدخلش سيرة السعودية اللي هي تاج رأسك في الموضوع والسعوديين يعرفون يردوون على أشكالك..<br />على فكرة أكبر دليل أن أنت اللي إرهابي هو انك تتمنى ان أمريكاا اللي إنتاتتمنى انك تتجوز بنت من بلدها عشان تاخدالجنسية الأمريكية,, انهاا تضرب السعوودية انتا اللي ارهابي حاقد مريض نفسيا وجسميا وانصحك نصيحة متتعبتش نفسك في التفكير عشان معندكش فلوس تعالج بيهاا امراضك النفسيه بسبب حقدك على تاج رأسك السعودية :)<br />نسيت أقولك ياغبي ان العودة للتخلف هي تبرج الجاهلية الاولى لان الانسان خلق عاريا وقد كرمه الاسلام وجعله محتشم بس شكلك انت معذوور بتحب تكون بنص هدومك لان برضو معندكش فلوس تشتري بيها هدوم ليك انت ومراتك او عشان تغطيها بحجاب خلاص انا هبعتلك ان حبيت :)"
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129044059/http://masr.20at.com:80/article.php?sid=1183"

