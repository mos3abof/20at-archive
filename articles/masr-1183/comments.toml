text = "الموضوع حلو يا ندا واهم حاجة فيه ان الناس دى كلها اللى بيتكلموا على اساس انهم بس اللى بيفهموا بالفن وياحرام قاعدين فى وسط ناس دماغها صعبة ومش حساسة ومش بتعرف معنى الجمال، بجد لازم يقفوا عند حدهم، لاننا ناس بنفهم اوى ولو مش بنفهم بنحس عشان زى ما احنا عارفين الاوبرا احساس، عندك وجهة نظر حلوة يااحمد بس اللغة بتحاول فيها احتراف النقد اكتر من اللازم مش قصدى حاجة بس انت عندك وجهة نظر واضح انها نتيجة اطلاع وثاقفة وهواية للجال الفنى ولو اللغة ابسط هنبقى اجمل"
