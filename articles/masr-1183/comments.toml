[[comments]]
order = 9
subject = "استكمال موضوع الحصبة الليبراليزمية بتاعة سي فاروق"
author = "إبن بهية"
posted = "2006-11-20"
text = "ما رأيكم يا كرام أن نكمل موضوعنا عن الليبراليزم الموله بها سي فاروق أبو خازوق .. وبسببها وعشقها تلاقي الليبراليين عمال يخبطوا تخبيط في أهلهم اللي هو إحنا ودي مصيبة عبيطة مش عارفين يبطلوها ولا يغيروها وهي صدامهم الدائم مع ثوابت الوطن التي تقدس العفة (مسلمين وغير مسلمين .. يعني ما أتصورش صديقي الحبيب الدكتور حشمت المسيحي ممكن يسمح لكائن من كان بالمساس بعرضه .. والله كان يدبحه وأنا واثق من كده لأننا شبه عايشين مع بعض وعراف بيتهم كويس) المهم الليبراليين ومنهم طبعا العلمانيين مش قادرين يتخلصوا مما لديهم من إشكالات عويصة أهمها موالاتهم الكاملة تقريبا للغرب وولههم به إلى أبعد مدى ولا يفرقون بين كونهم من هنا مش من هناك وأن هنا مسلوب ومنهوب ومطارد ومستعمر من هناك .. تيجي تحبلي هناك (الغرب) وهم عاملين فينا كل ده ؟؟؟<br />لأ اسمحلي انته حمار أو عميل ، وعميل هنا يعني مش فاتحلك جهاز لاسلكي وعمال تعد العساكر اللي ماشيين وتبلغهم .. العمالة تطورت أوي . يعني لما تعملك مركز زي ابن خلدون وكل يومين يفقعلك تقرير على مراكز أبحاث البيت الأسود المسماه للتمويه منظمات الحرنكش ومش عارف إيه تبقى عميل حتى ولو كان معاك ألف حق ومبارك الواطي يستحق الحرق .. لكن ده ما يعطيكش الحق أبدا تتلصص على أولاد بلدك باسم حرية الإنسان وحقوق الحيوان وتعطيهم معلومات تساعدهم على اختراق الوطن .. هييجي اللي يقولك اختراق إيه وهو فيه حاجة مستخبية ؟؟؟ طبعا يا اسطى .. هم لو عارفين يحصلوا على المعلومات دي لوحدهم من غير ما يمولوا مراكز إبن خلدون دي وغيرها ما كانوش دفعوا قرش لأي منظمة أو مكتب أو كشك حقوق الإنسان والفراخ اللي عندنا .. المهم زي ما هم قالوا وكرروا مليون مرة يا تكون معانا أو علينا .. بشبوش الأهبل قالها ألف مرة يا تكون معا<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085425/http://masr.20at.com:80/article.php?sid=1183"

[[comments]]
order = 10
subject = "كلمة أخيرة ..."
author = "إبن بهية"
posted = "2006-11-20"
text = "كلمة أخيرة بس للناس اللي بتقول إنه من حقه يعبر عن رأيه .. الكلام ده حلو وجميل لو كان في بيتهم مش بيشغل منصب وزير في بلدنا يا كتكت .. يعني لما تتكلم بصفتك الشخصية وانته في بيتكم شيء ولما تكون شاغل منصب عام ووزاري كمان شيء آخر يا أفندية .. كما وضحنا قبل كده تناقضه في موضوع حرية التعبير .. يعني هو حر يبعبر براحته ومراته لو كان متجوز ممنوع عليها كذا وكذا زي ما هو قال ؟؟؟ مش ده تناقض ولا إيه ؟؟؟<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085425/http://masr.20at.com:80/article.php?sid=1183"

[[comments]]
order = 11
subject = "سيادة الوزير .. الصراحة راحة"
author = "قلم جاف"
posted = "2006-11-20"
text = "الصراحة راحة يا روحي .. انت ما بتعرفش..<br />هذه العبارة المثيرة للجدل جاءت ضمن أغنية للموتربة اللبنانية مروى قرنوح -اسمها الحقيقي- وبغض النظر عن مفهوم مصطلح \"مابتعرفش\" ..إلا أن الحكومة بها أكثر من وزير \"ما بيعرفش\" بالمقاييس السياسية والمهنية..<br />ولما كنا بلد بيروقراط صحيح ، كان فيها كل مسئول (بالهمزة أو بالطاء) يتولى منصبه كموظف يرأس مصلحة وليس كشخص يتولى منصب سياسي ، رزئت بلادنا بمجموعة من \"اللي مبيعرفوش\" من أمثال وزير التربية والتعليم الحالي ، ووزير الثقافة الحالي الذي وصفه أصدقاؤه الروزجية بأنه \"وزير الاستعراض السياسي\" عندما لوح عقب محرقة بني سويف بالاستقالة!<br />أبسط تحليل لما حدث يبين أن المسألة ليست حجاباً ولا بتاع ، واسألوا في ذلك فتحية الدخاخني الصحفية التي أجرت الحوار مع فاروق حسني ، ظهر الرجل وكأنه يريد الإدلاء بتصريح ما من \"قريحته\" أو \"أمره به أحد\" ، والغرض طبعاً الدخول في معركة سياسية جديدة مع كتلة الإخوان في البرلمان ، مجرد معركة سياسية مصطنعة خاصة معروف نتائجها ورد فعل \"الطرف الآخر\" عليها..<br />للمعارك السياسية فن وضرورات لا يبدو أن القائمين على الحزب البيروقراطي يعرفون عنها الحد الأدنى ، والغرض من المعركة المفتعلة الجديدة فيما يبدو هو تسلية الناس بما أن مجلس الشعب بلا أغلبية من البيروقراط والذين لا يفكون الخط صار مجلساً مملاً يفقد الغرض الأساسي من وظيفته وهي إضفاء مسحة من المرح على حياة المصريين الكئيبة!<br />لو التصريح من دماغه ، فهو مجرد فنان تشكيلي جاء إلى المكان الخطأ ، في حين أنه \"مبيعرفش\" ، مثله مثل الأكاديمي وزير التعليم \"اللي مبيعرفش\" ، وصاحب الحنكة السياسية رئيس مجلس الشعب \"اللي هو الآخر مبيعرفش\"..<br />السياسة أيها البيروقراط شيء لا تعرفونه ، والمؤكد أنها ل<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085425/http://masr.20at.com:80/article.php?sid=1183"

[[comments]]
order = 12
subject = "فنان و لا فننس"
author = "نيفين نيفى نوفا"
posted = "2006-11-20"
text = "اناشيفه ان فاروق حسنى فننس على راى محمود عبد العزيز ف الكيف<br />ماما:اكيد فاروق حسنى هيتشال بعد تغليقاته عن الحجاب دى<br />انا:يتشال ايه يا ماما ده ممكن ابو الهول ينطق و الهره يتزحزح من مكانه و الراجل دا لا<br />دا كان حوار دار بينى و بين ماما بعد ما شفنا الوزير المبجل على قناه المحور<br />بعيدا عن كل دا انا مش معترضه ان حد يقول رايه ف الحجاب و يرفضه او يقبله بس ليا وجهه نظر<br />لما يكون الانسان دا وزير يبقى يحاسسب على كلامه و لو اتكلم يتكلم ف مجالس خاصه مش يقولها و ف الجرايد علنى<br />دا الصحفيه اللى خدت منه التصريح سسالته كذا مره تنشر و لا لا و قالها احنا ف بلد ديموقراطى<br />شفتو البجاحه<br />لا و السست اقبال بركه جت و كملتها بكتابها الحجاب<br />ال ايه رؤيه عصريه و اللى شاف حوارها امبارح مع عمرو اديب يشد شعره من اللى بيبسمعهانا مش عارفه الناس دى عايزه تودى البلد فين اكتر من اللى هى فيه"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085425/http://masr.20at.com:80/article.php?sid=1183"

[[comments]]
order = 13
subject = "الحضارة القائمة علي شعر المرأة"
author = "شيماء"
posted = "2006-11-20"
text = "السلام عليكم و رحمة الله و بركاتة<br />الاخوة و الاخوات الافاضل<br />بمناسبة تصريحات السيد هباب المتهبب ماحي الثقافة في مصر جاعل اصغر عيل في اقل دولة في العالم مثقف اكثر<br />من اساتذة التعليم في مصر و هذه اهم انجازات وزير الثقافة المصري التي لابد و ان تذكر لنرجع الفضل<br />لاصحابة, اه بمناسبة تصريحاتة حول الحجاب و امة و زوجتة الي لسة متجوزهاش لانه لسة بيكوم نفسة اود<br />ان اسأل سيادته و اسأل كل من يهاجم الحجاب و مرتدياته و يتهم بالرجعية و التخلف لي عنده و عندهم سؤال و هو<br />سؤال حيوي جدا جدا جدا اما السؤال هو:-<br />اي حضارة عمو الوزير التي تقوم علي شعر و صدر و اقدام و خصر المرأة اي نوع من انواع الحضارات هذه<br />؟؟ طيب تفرق ايه مع سيادتك اني البس حجاب او ملبسش او استر جسدي او اعريه؟؟ هو لمؤاخذة انت و شوية<br />الهبل الي بيهاجموا الحجاب من نوعية العالم الي قايمة قاعدة ماشية نايمة تبص في الستات الي حواليها و تبحلق علي<br />اساس طبعا ان الله جميل يحب الجمال و احنا لازم نتمتع بالجمال ( كما يدعي الهبل امثالكم) او يمكن ان<br />الحضارة كلها قائمة علي شعر و جسد المرأة و الي مش عاجبة افقعوا عينة؟؟<br />و يا تري الحضارة القائمة علي شعر المرأة تفرق معاها اذا كان الشعر اسود و لا اشقر و لا احمر؟؟ طيب بلاش<br />السؤال دة يمكن صعب شوية نسأل سؤال تاني:<br />زمان في افضل عصور الدولة الاسلامية كانت كل النساء محجبات او يمكن منتقبات و مع ذلك قامت افضل<br />الحضارات الاسلامية اذا كنت تسمع عنها اصلا و التي اقتبس الغرب حضارته منها لية بقي مأثرش الحجاب وقتها<br />علي بناه الحضارة الاسلامية؟؟<br />طب بلاش سؤال تاني اسهل:<br />ممكن اعرف من حضرتك نوع الحضارة و التقدم الي احرزة الشعب المصري منذ خلعت الست الي ربنا خدها<br />صفية زغلول حجا<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085425/http://masr.20at.com:80/article.php?sid=1183"

