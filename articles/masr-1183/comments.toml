[[comments]]
order = 2
subject = "في موريتانيا (فــال) حلو خالص"
author = "إبن بهية"
posted = "2006-11-19"
text = "إبن بهية<br />أستغرب من قلة التغطية الإعلامية لموضوع الانتخابات البلدية الموريتانية رغم خطورة الموضوع .. فهو ربما يكون حلقة (بايلوت) في مسلسل التغيير العربي والإسلامي .. بروفة يعني .. آه لو نجحت تجربة إخواننا الموريتانيين وأتت بحكم ديموقراطي محترم سيكون بكل تأكيد (فال كويس أوي أوي) .. أقصد الإثنين كويسين طبعاً رئيس الحركة العسكرية (المباركة حتى اليوم) العقيد علي ولد محمد فال ، وبرضه فال كويس أوي أوي (من باب الفأل الحسن) لينا في مصر لو أكرمنا ربنا بحفنة عسكر تسري في عروقهم دماء حارة وانتزعوا البلد من براثن النظام الحاكم بأمر مش عارف مين .. تعلمنا قديماً أن الانقلابات والحركات العسكرية في أي بلد في العالم تأتي كنتيجة منطقية لجملة من الأسباب .. تتوفر كل هذه الأسباب في بلدنا الحبيب مصر منذ أكثر من ثلاثين عاماً ويزداد تركيزها كل يوم حتى باتت معتقة جداً لدرجة شديدة المرارة وشديدة العطن والعفن ..<br />لقد أعياني البحث كثيراً في سر عدم قيام أي حركة عسكرية انقلابية في مصر حتى الآن برغم كل ما تعانيه من آلام ومشكلات داخلية وخارجية بسبب ذلك النظام البغيض ؟؟؟ مليارات المليارات تنهب كل يوم وأهل مصر تقطعت بهم السبل في شتى بقاع الأرض طلباً للقمة العيش التي قلما يجدوها ويلعقون كرامتهم اتقاء عضة الجوع التي لا ترحم .. وفي المقابل تجد القطط السمان تزداد تخمة ورفاهية تصل إلى أبعد حدود السفه التي يمكن معها أن يصل مصروف قطيط صغير (قطقوط صغنن) إلى ما يوازي مصروف حي كامل من أحياء القاهرة الفقيرة .. دماء المصريين باتت مهدرة بعد أن أهدرت كرامته وأمسى لا قيمة له ولا ثمن يذكر ..<br />يموت المصريون يومياً في البر والبحر والجو بلا ثمن ولا مسائلة حتى من باب تكريم الإنسان .. يموتون على الإسفلت من جراء سرقة ونهب مليا<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085425/http://masr.20at.com:80/article.php?sid=1183"

[[comments]]
order = 3
subject = "الليبراليزم غير الحماريزم .. الشبه الوحيد الرفص من غير مناسبة"
author = "إبن بهية"
posted = "2006-11-20"
text = "رغم أنفي سرقني النعاس ثلاث ساعات كاملة عصرا على غير العادة فصهلت ليلاً حتى الساعة وكان نتيجة ذلك سيل التعليقات التي هطلت مني على كثير من المواضيع وفي كثير من المواقع .. المهم كنت أهم بالنوم حالاً لولا أنني وجدت ضرورة إضافة تعليق أخير يتعلق بفاروق حسني ذاته وغيره ممن هم على شاكلته .. يف الفكر بس مش عايزين عك على المسا ..<br />الجماعة الحلوين دول من دعاة الليبرالية غريبي الأطوار بحق .. ففي أصدقائي جميع الأطياف السياسية والثقافية من متدينين لشيوعيين لليبراليين والكل كليلة ، العجيب الذي ألحظه كغيري في الليبراليين أنهم أنانيون إلى حد بعيد وكأن فكرة الليبرالية الحرية الشخصية عندهم قد دفعت بالأنا لتقف ولاً وقبل كل شيء .. هم يدعون الرقة وقلوبهم أقسى من الحجر حتى على أقرب أهليهم .. يدعون الحرية وفي ذات الوقت يحرمونها على غير الأنا التي داخلهم .. يعني يعجبك كلامهم أوي عن الحرية الشخصية ولكنك لو مارستها معهم تبقى مصيبة وتقفز الأنا لتكون في الصدارة ويظهر الوجه القبيح للتسلط والبطش والأنانية ..<br />لي بحث عن جذور الليبرالية في مصر والوطن العربي ، لا أريد الدخول في تفاصيله حالياً ولكني سأذكر منه بعض التلميحات فقط .. (عموماً هو منشور كاملاً في عدة مواقع) الليبراليون العرب عامة لا يفرقون بين الغرام والهيام بالأجنبي وبين كونه مستعمر لبلادنا وهي خطيئة ولم ولن يغفرها لهم أحد ولا أستثني منهم هنا أحداً حتى طه حسين حين تحدث عن مستقبل الثقافة في مصر كان يروج بشكل مباشر للنموذج الليبرالي الغربي .. هذه واحدة<br />ثانياً وهذا هو الأهم أن جذورهم مشبوهة (كانت ومازالت) ففي بحث أكبر وأعمق من بحثي أنا قام به أحد أهم الاشتراكيين حالياً الدكتور رفعت السعيد وجد إشكالية المفكرين الشوام في الرعيل الأول مع لطفي السي<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085425/http://masr.20at.com:80/article.php?sid=1183"

