[[comments]]
order = 27
subject = "السعودية ارض الشذوذ والارهاب"
author = "صدرالدين امين"
posted = "2006-11-24"
text = "نعم ان السعودية ارض االارهاب واكبر مصنع في العالم لانتاج الارهابيين وعدة الارهابيين فالعالم كله تعلم الارهاب على يد السعوديين وحدهم من قاموا بتدمير مركز برج التجارة العالمي في نيويورك والسعوديون هم من دمروا افغانستان والسعوديون هم من يمارسون ابشع الجرائم في تاريخ البشرية بحق ابرياء العراق وذلك بقتل المسلمين العراقيين الابرياء بتفجير اجسادهم القذرة في ابرياء العراق ويقومون بتفخيخ السيارات وذبح الناس على الطريقة الوهابية ويقومون بزرع الفتنة والشر على ارض العراق وها هم يحاولون ويحاولون بشتى الوسائل لتدمير اكبر حضارة بشرية في التاريخ وهي مصر ام الدنيا وذلك بادخال افكار وهابية هدامة كي ترجع مصر العظيمة الى الوراء وتصبح مثل السعودية ارض البدو والهمج قبل اكتشاف النفط من قبل الامريكان والانكليز الذين علموهم معنى التحضر والتمدن فهم الذين ادخلوا التكنولوجيا الحديثة لهم بغية ان يتقدموا ويتطورا لكن لم يستفيدوا من التكنولوجيا الا في مسائل الارهاب وقتل الناس وخاصة الاجنبي الذي كان يخدمهم على ارضهم بعد اكتشاف النفط ... والسعودية هي ارض الشاذين جنسيا فهم يمارسون اللواط ويمارسون الجنس مع الحيوانات وذلك بسبب كبتهم الجنسي وحرمانهم من الجنس اللطيف ونقصد المراة بسبب المهر الغالي الذي يفرضه والد العروس وكان ابنته حاجة للبيع مثل ابقاره وبعرانه وسياراته .. ان السعودية تصرف مليارات الدولارات وتجند المصريين الفقراء لنشر المذهب الوهابي الارهابي في مصر العظيمة فالنقاب والحجاب لم تكن من ضمن الثقافة والتراث المصري قبل المد الوهاب السعودي ... نعم من حق كل امراة ان تتحجب لكن ليست على الطريقة السعودية وليس بالضغط وليعلم كل اب واخ مصري انه لايمكن فرض الحجاب على احد دون سن السادسة عشر ة لانه الانسان في هذه ال<br />اقرأ بقية التعليق .."
archived = "2006-11-29"
capture_url = "https://web.archive.org/web/20061129044059/http://masr.20at.com:80/article.php?sid=1183"

