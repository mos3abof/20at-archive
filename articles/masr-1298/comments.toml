[[comments]]
order = 6
subject = "والله باين عليكى"
author = "والله باين عليكى هابلة يا لؤلؤة هو إبتى قارئة الفنجان علشان تقولى الكلام الزبالة بتاعك ده"
posted = "2006-12-14"
text = "محدش يقدر يسجن إبراهيم عيسى ده هو الشريف الوحيد فى الحصفيين وله شعبيه جامده قوى قوى قوى<br />وإبنه المتخلف عقلياً مش ها يقعد فى الحكم إحنا عايزين واحد شريف يحكم مصر ويخرجها من المستنقع إللى رماها فيه مبارك وعيلته الوسخه وأعتقد إن السيد عمرو موسى هو أكثر واحد الشعب كله متفق عليه يبقى ياريت بتطلى تخرفى بأى كلام يا متخلفة عقلياً زيك زى إللى بتعتقدى إنه ممكن يحكم مصر هى كانت مصر ناقص وبعدين هو إنتى ما سمعتيش نشيد الشباب بتاع<br />مصر حره حره يا مبارك أطلع بره"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190508/http://masr.20at.com:80/article.php?sid=1298"

[[comments]]
order = 7
subject = "حاجة تكسف"
author = "حبيبة"
posted = "2006-12-14"
text = "بالذمة مش حاجة تكسف لما نظام مستبد ركبة تخبط في بعضها من صحفي بيقوم بواجبة اللي المفروض انه مش عمل بطولي زى ما ابراهيم عيسي بنفسه كتب كده في اخر مقال له في الدستور ده اكبر دليل علي الخيبه التقيلة اللي النظام عمال يخبط يمين وشمال زي ما يكون حد شربه حاجة اصفرة وخايف من الفضيحة ربنا يهدهم وبراءة انشاء الله ياابو فاطمة"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190508/http://masr.20at.com:80/article.php?sid=1298"

[[comments]]
order = 8
subject = "العبيط....أهوه"
author = "الصعيدى"
posted = "2006-12-15"
text = "ابراهيم عيسى ده اللى انتوا عملين علشانه الضجه دى كلها ده ديماجوجى بيستغل سخط الناس وهو من الاخر لقى مصلحته فى كلمة لا ولو لقها فى نعم كان اول واحد يقولها مقالاته خيبه و عبيطه لو قرات اول مقال ممكن تكمله من الاخير كلامه كلام مساطب عمال يكلم عن التمديد و التوريث و الثورة حاول تصلح طالما الحاكم مش حتغير زى انت مبتقول و بعدين باى كتاب ام باى سنة بلد فى 75 مليون تكون انت رئيس تحرير جريدتين خلاص مفيش مواهب والله على القهاوى فى كل حته فى مصر ناس بتفهم عنك<br />على فكرة شكلك حبوب اواى فى الفيلم الاخير شدحيلك عايزين نشوفلك حاجة انت و المناضل بلال فضل و المناضل سعد الصغير<br />يا مولعه يا بتاع السبوبة يا حلو"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190508/http://masr.20at.com:80/article.php?sid=1298"

[[comments]]
order = 9
subject = "عيب عليكى"
author = "ياللى بتهاجم السيد ابراهيم عيسى ليه كده مهاجمتش اللى نهب بلدك وخلى الشعب عبيد فى بلدهم"
posted = "2006-12-15"
text = "ليه مهاجمتوش يوم لما باع المصانع وطرد العمال وزادت البطالة وعمال يوعد ويكذب ويكذب ويوعد<br />ليه ما هجمتش راجل عنده 80 سنة وعايز يقعد فى الحكم لإخر عمره وهو بيخرف فى كل كلامه ولا يعنى علشان أبوه مات وهو عنده 102 سنة عايز يتحفنى بية لغاية لما يوصل للسن ده<br />ليه مهجمتش إللى بيحاول يورث الحكم لإبنه الفاسد الحرامى المدمن الشاذ الطماع<br />ليه ما هجمتهوش اللى سايب مراته على حل شعرها تنهب فى فلوس جمعيات وهمية للمرأة والطفل والنتيجة عصابة التوربينى ودى واحدة من مليون عصابة لسة موجوده وأطفال صغيرة متشردة فى الشارع من الفقر والبطالة<br />هو إبراهيم عيسى لما بيدافع بيدافع عن نفسه ولا بيدافع عن فقراء الشعب المطحون وبيحارب فساد راجل محنط على كرسى الحكم لغاية لما رحته عفنت من القاعده ومن الفساد ومن العمالة ومن النهب<br />أزاى تأتمن على بلدك وواحد بيخرف بيحكمها مش عارف يميز بين الصح والخطأ وعمال يعقتل فى الإخوان المسلمين علشان محدش يقرب على الكرسى إللى إن شاء الله ربنا ها يخده من فوقه اللهم آمين<br />لما تحب تهاجب هاجم الفساد ما تهاجمش إللى بيحاربو الفساد<br />والله المستعان"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190508/http://masr.20at.com:80/article.php?sid=1298"

[[comments]]
order = 10
subject = "بناء سجون"
author = "بدل بناء المدارس والمستشفيات والمصانع"
posted = "2006-12-16"
text = "اقترح بناء سجون وانفاق الميزانية على اكلهم وشربهم وحراستهم ياعم عيسى مالك ومال السياسة عايز تتكلم فى السياسة انضضم لحزب - اتكلم فى الاقتصاد فى العلم فى الثقافة انما تخالفوا القانون وتخرفوا فيبقى بقى السجون افضل السجون مش هتكفى بردة نبنى جديدة ونوسعها وبعدين انت عندك عيال من سوف يطعمهم ويصرف عليهم فى المدارس ويعالجهم - كبر مخك ياراجل وبلاش العبط اللى انت فية -انت مش هتعدل ميزان الكون اللى بيعدل هو اللة<br />خليك فى حالك اسلم لك وللمجتمع<br />انت موظف حكومى فحافظ على مهنتك والتزم باخلاق المهنة<br />والسسلام"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190508/http://masr.20at.com:80/article.php?sid=1298"

