[[comments]]
order = 0
subject = "قفوا ضدي ..!"
author = "أحمد مطر"
posted = "2006-12-13"
text = "قِفـوا ضِـدّي .<br />دَعُوني أقتفي وَحْدي .. خُطى وَحْدي !<br />أنا مُنذُ اندلاع براعِمِ الكلماتِ في مَهدي<br />قَطَعتُ العُمرَ مُنفرداً<br />أصُـدُّ مناجِلَ الحَصْدِ<br />وَما مِن مَوْردٍ عِندي لأسلحتي<br />سِوى وَرْدي !<br />فَلا ليَ ظَهْرُ أمريكا<br />لِيُسندَ ظَهريَ العاري .<br />وَلا ليَ سُلطةٌ تُوري<br />بِقَدْح زنادها ناري .<br />وَلا ليَ بَعدَها حِزبُ<br />يُسَدِّدُ زَنْدُهُ زَندي .<br />قِفـوا ...<br />لن تَبلُغوا مِنّي وُقُوفَ النّدِّ للِندِّ ِ.<br />مَتى كُنتمْ مَعي.. حتَى<br />أُضارَ بِوَحشةِ البُعْـدِ ؟<br />أَنا مَن ضَمّكُمْ مَعَهُ<br />لِتَرفعَ قِيمَـةُ الأصفارِ قامَتَها لَدى العَـدِّ<br />بظِلِّ الواحدِ الفَرد ِ.<br />ولكنّي، بطُولِ الجُهْـدِ ،<br />لَم أَبلُغْ بها قَصْـدي .<br />أُحرّكُها إلى اليُمنى<br />فألقاها على اليُسرى<br />وتَجمعُ نَفسَها دُوني<br />فَيُصبحُ جَمْعُها : صِفرا .<br />وَما ضيري ؟<br />أنا في مُنتهى طَمَعي .. وفي زُهْـدي<br />سَأبقى واحِداً.. وَحْـدي !<br />فَمي أَضناهُ حَـكُّ الشَّمْعِ عن فَمِكُم .<br />بحقِّ الباطِلِ المَصهورِ في دَمِكُمْ<br />قِفوا ضِـدّي .<br />دَعُوني، مَرّةً، أُهدي سَنا جُهدي<br />لِما يُجـدي .<br />فَمَهْما أَشرقَتْ شَمسي<br />فلن تَلقى لَها جَـدوى<br />سِوى الإعراضِ والصَدِّ<br />مَنَ العُمْيانِ والرُّمْدِ .<br />قِفـوا ضِـدّي .<br />أنا حُـرُّ .. ولا أرجو بَراءةَ ذِمَّةٍ<br />مِن ذِمّـةِ العَبْدِ .<br />خُـذوا أوراق إثباتي .<br />خُذوا خِزْيَ انصهاري في ذَواتٍ<br />أَخجَلتْ ذاتي .<br />سَفَحتُ العُمْـرَ<br />أُوقـِظُ نائِمَ الإنسان في دَمِها<br />وَحينَ تَحرَّكَتْ أطرافُ نائِمِها<br />مَ<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190508/http://masr.20at.com:80/article.php?sid=1298"

[[comments]]
order = 1
subject = "هي دي الضريبه الحقيقيه .. ربنا مع كل المظلومين المقهورين"
author = "إبن بهيه"
posted = "2006-12-14"
text = "شيء طبيعي .. لابد أن يسجن عيسى ووائل ومئات الإخوان والوطنيين من كل التيارات .. هي ضريبة الوطن الحقيقية وليست تلك التي يسلوننا إياها رغم أنفنا لتذهب إلى جيب مبارك الواطي وعصاباته .. ضريبة الوطن هنا .. هل يعلم أي قاريء هنا حجم المعاناة التي يعيشها أخونا عيسى وآلاف المصريين غيره ممن تهددهم بوبيهات العادلي القذر ؟؟؟ إنها عملية قتل على البارد .. إنهم يحرمونهم من الحياة .. يتركونهم خارج السجون في حالة عصبية قلقة أشد وطأ من السجن .. مش مهم .. برضه سنظل نقاتل ونجاهد كل بطريقته حتى نستأصل عصابات مبارك الواطي من مصر<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190508/http://masr.20at.com:80/article.php?sid=1298"

[[comments]]
order = 2
subject = "عاشق الدستور"
author = "محمد"
posted = "2006-12-14"
text = "بص يا عم شريف انا كتبت انهم اجلوا النظر فى الدعوة بس مكتبتش انهم ولاد كلب خايفين يحكموا براءة فيخرج من ايدهم ومش قادرين يحبسوه عشان خايفين من الرأى العام ..<br />بس فعلا القضية فشنك فشنك ... وعلى فكرة انا متيم بحاجة اسمها الدستور وصوت الامة بس الدستور اكتر صراحة لانها فعلا نبض الحياة الواقعية التى نحياها دون نفاق أو رياء لاحد .. ومش عارف بصراحة الصحفيين اللى هناك ماشاء الله مش خايفين ازاى من اللى بيكتبوه .. ربنا معاهم ومعانا"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190508/http://masr.20at.com:80/article.php?sid=1298"

[[comments]]
order = 3
subject = "مسجون مسجون ياولدى"
author = "لؤلوة"
posted = "2006-12-14"
text = "انا عارفة ان ابراهيم عيسى هيتسجن ومتأكدة لان بلدنا الحلوة مش ممكن تسيب حد فى حالة زى ماحصل مع ايمن نور وقضيتة السذاجة وكمان عارفة ان الدستور هينقفل قريب بس ممكن اعرف اية اخرتها لحد ما الراجل الكبير يموت وابنة يقعد مكانة"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190508/http://masr.20at.com:80/article.php?sid=1298"

