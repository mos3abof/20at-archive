[[comments]]
order = 13
subject = "رموززززززززززز"
author = "رموزززززززززززززززز"
posted = "2006-12-16"
text = "مصر اتبعت مين اللي باعها معرفش طب ليه بتسال وانت متعرفش معرفش خلاص بطل كلام ولا تخرفش اوكى ايه اوكى دى قول حاضر منا اتعلمت كدة كدة ايه و هباب ايه بصراحه دى محاورة مع نفسي خرجت منها اننا شعب تمت ابادته والطالبين البتغيير ليس حققيون انتظروا حتي يحل غضب الله وهذا افضل الاوحوال وان كنت لا تصبرون فطالبوا قواد الجيش بتخلصينا من الظلم فهم مازلوا يحبون الشعب وشكرا اعضاء مجلس الشعب بدوله ولادالبلد بجمهوريه عشرينات المصريه المثقفه"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190508/http://masr.20at.com:80/article.php?sid=1298"

