text = "تحياتى لك سيدى ولكل الشرفاء<br />لا يهمك ان اضطهدت اوان سجنت<br />فرصيدك فى الشارع شهادة اكبر على براءتك من وجودك خارج السجن وكم من اناس خارج سجون ولكنهم داخل سجون اخرى من كره الشعب ورفضه"
