subject = "لقطة جميلة اسماعيل أجمل ما فى الموضوع"
author = "نها"
posted = "2006-12-14"
text = "بص يابيبو ... انتا الجميل فى الموضوع ده أنك خدت بالك من حاجة مهمة وهو تضامن جميلة اسماعيل وجبت منها تصريحات ... بصراحة الدستور نفسها معملتش كده .. بجد امتياز فى الموضوع ده ... وده مش غريب عليك يا حج .. باى"
