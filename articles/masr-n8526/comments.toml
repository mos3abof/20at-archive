author = "magic..angel"
posted = "2006-10-11"
text = "يا استاذه نجمه عايز اقولك حاجه... انا معاكى ان المشايخ دول قدوه لينا ولازم يكونو اعلام نقتضى بيها بس اولا هم مش انبياء احنا لو هنمسك فى افعالهم يبقى يبقى طريقنا الضلال انما احنا مسلكنا مسلك النبى صلى الله عليه وسلم والناس دى عالاقل عندها علم وبتحاول توصلهولك عشان انتى تعملى بيه مش تستنيلهم غلطه دى تبقى سطحيه مننا ولازم تحطى فى دماغك ان مفيش انسان معصوم من الخطا ومش معنى انى بقولك لازم تصلى عشان النبى قال كده يبقى انتى تشوفينى انا بصلى ولا لاء . المساله ما كانت كده وبعدين احنا نشوف احنا عاملين ايه لديننا ولنفسنا اودام ربنا وبعدين نعدل على الشيوخ اللى عالاقل عاشوا عمرهم كله فى العلم والعباده وتحملوا رساله بجد يبقى من باب اولى اننا نقدرهم وندافع عنهم عن اى كلام يتقال عليهم مش نبقى احنا اللى بنستنالهم الغلطه يا رب اكون وصلتلك وجهة نظرى (وربنا يهدى كل انسان)"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061829/http://masr.20at.com:80/article.php?sid=591"

[[comments]]
order = 63
subject = "أستغفر الله"
author = "عمر حاتم"
posted = "2006-10-25"
text = "أستغفر الله من هذا الكلام الذي يقال<br />ما فعله الاخ ياسر كاتب هذا المقال خطأ كبير أرجو ان يحاسب نفسه عليه قبل ان يحاسب عليه يوم ان يلقي ربه فلا يصح باي حال من لاحوال ان يقول ذلك علي مشايخنا حتي ولو فرضنا ان هذا الكلام صحيح<br />لكن ما فعله بعض الاخوة عفا الله عنهم من سب وإهانة فهذا لا يجوز وبالتالي فهم وقعوا في خطا كبير لقوله جل وعلي (ما يلفظ من قول إلا لديه رقيب عتيد )<br />إننا في حاجة لمناقشة قضايا أكثر أهمية وإفادة لنل نحن المسلمين من هذا التفاهات والمهتارات التي لا طائل من ورائها سوي الوقوع في مصائب أكثر وأعظم.<br />وكان من المفترض ان تقوم الادارة القائمة علي المنتدي ان تقوم بتنقيح الموضوع وتقدير ما سيثيره من بلبلة لم يكن هناك داعي لها وكذلك منع الرسائل التي تعرض لها الاخ كاتب المقال<br />وللحديث بقية مادام في العمر بقية<br />والسلام مسك الختام"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061829/http://masr.20at.com:80/article.php?sid=591"

[[comments]]
order = 64
subject = "عيب"
author = "james marshal"
posted = "2006-10-31"
text = "عيب اللى بيحصل ده , ماتعرفوش ان النت مفتوح على البحرى و سيبك من موضوع مسلمين و مسيحيين أنتوا كلكم مصريين يعنى اللى يهاجم شيخ الأزهر المسيحى يزعل لأن الهجوم على شخصيه قياديه مصريه نبجلها و نحترمها و الهجوم على القيادت المسيحيه المفروض على المسلم أن يرفضها لأنها هجوم على أبناء بلده الذين يعيشون معه على السراء و الضراء و الموضوع اللى كتبه ياسر ريبورتاج جميل لو تقبلناه بعيدا عن العصبيه القبليه و بقولها تانى اللى بيشتم كأنه قاعد بيعمل دوره ميه فى ميدان التحرير و الناس بتتفرج عليه ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061829/http://masr.20at.com:80/article.php?sid=591"

