text = "الموضوع حلى اوى ياياسر وواضح انك واحد عندك موهبة بجد وكمان ضمير لأنك اختلات فكرة حلوة وتعبت عليها اوى وبخفة دم مش مبتذلة وشكلك كده بتدرس فى اازهر او ده الوسط الطبيعى بتاعك واستغليت وجودك فيه صح، وسواء كان كلامى مظبوط او لا ياريت تعمل شغل كتير عن دار الافتاء والازهر فى مصر ده ملف حلو اوى، وعن الشيخ اللى اتفصل عشان الجنسية الامريكية.<br />وانت بقى رنتموبايلك ايه؟"
