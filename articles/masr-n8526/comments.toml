text = "إذا كنتم ناويين تناقشوا المواضيع بالسب والالفظ الخارجة سيفقد هذا الموقع الهدف من وجوده.<br />صحيح موضوع الأخ باسر ليس بالأهمية الكافية والوقت غير مناسب لتناوله لكن إذا كنا حريصين على وجود شباب مهتم بقضايانا كمصريين وكعرب إيه المانع إننا نرفض الموضوع بشكل لائق ونقترح مواضيع أخرى . حتى الأخ ياسر يجب تقبله للنقد ولا يأخذ الموضوع بشكل شخصى كما يتضح من رده على أحد زميلاته.<br />وإلا أصبح الموقع منفذا لتبادل الشتائم<br />بين الزائرين . ياجماعة إحنا على الهوا بلاش ننشر غسيلناالو...."
