subject = "انعدام الضمير"
author = "محمود"
posted = "2006-07-23"
text = "بالإضافة لكل اللي اتقال عن الموضوع من ناحية هيافته وافتقاده للمصداقية وانعدام ضمير كاتبه وافتراءه على العلماءمن أجل ان يثبت انه واد فلتة وماحصلش وانه صحفي شاطر أحب أقول للأخ ياسر انه كداب والدليل على كده ان الدكتور أحمد علي ريانله سنتين خارج مصر ووصل يوم 15 يوليويعني بعد كتابة الموضوع بأكتر من اسبوعين بالاضافة الى انه ليس عميدا لكلية شريعة أسيوط لأن العميد هو د/ عبد القادر ابو العلا والكلام ده انا متأكد منه جدا لقرابتي الوثيقة من الشيخ الدكتور ريان بالاضافة الى انه لايحمل موبايل أساسا وأكيد افتراءك ده مش على الشيخ ريان بس اكيد على علماء تانيين أفاضل اتق الله وبطل هيافة وشغل تخريف ولو فعلا بتعتبر نفسك انسان محترم حاول بس تكدبني وابعت الرد على الإميل بتاعي rayan2005@hotmail.comبس مش هتقدر لأنك فعلا كداب"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061829/http://masr.20at.com:80/article.php?sid=591"

[[comments]]
order = 37
subject = "أديني رديت اهه"
author = "ياسر فرج"
posted = "2006-07-24"
text = "الأخ المحترم اللي عمال يشتمني و التاني اللي بيكدبني و و احد بيقولك قال ايه النقض مش عيب بس من غير شتيمة أولا هي اسمها نقد احنا مش في المحكمة و بعدين الأخ اللي عامل فيها أنه جاب الديب من ديله لازم يعرف أن الموضوع دا قديم جدا من أيام ما كنت طال ب في جامعة الأزهر يعني مكتوب من أربع سنين لكن بصراحة كنت مستخسره في أي جريدة الحاجة التانية ياع الشيوخ دول أعمامنا و علي دماغنا و أنا لم اقصد الإهانة أنا كان نفسي بجد أعمل حاجة ظريفة لكن بجد انا ما عنتش هاشتغل لأن في بلدنا دي فعلا التفكير جريمة أنا هاتجنن لازم فعلا كل موبايل يبقي له رنة سواء أكان اللي يمسكه شيخ او عربيد يبقي فين الإفترادا زهقوتنا في عيشتنا يا عالم يأمة ضحكت من جهلها الأمم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061829/http://masr.20at.com:80/article.php?sid=591"

