subject = "3 ملاحظات"
author = "محمد عبد الرحمن"
posted = "2006-06-30"
text = "اول ملاحظة ان المحرر عامل موضوع كويس جدا لسبب بسيط ان الفكرة جديدة وهي حاجة مهمة جدا في الصحافة اليومين دول، ودة بيقودني للاختلاف مع الزميلة الشاطرة جدا ولاء الشملول اللى معجبهاش الموضوع ولم تقل لماذا، اهم ملاحظة بقى عيب اوى الكلام السافل اللى مكتب ف تعليق شيخ الازهر بتاع بوس الواوا، انا لا اطيق الشيخ دة ولا اعترف به، لكن قلة الادب مش هي الحل لا معاه ولا مع الريس ولا اى قيادة، في الف طريقة للنقد ، ارجو من إدارة الموقع البحث جدياًعن وسيلة لمنع هذه التعليقات البشعة، التي تسئ لولاد البلد، وارجو لمن يرسلوها ان يقتنعوا ان دة موقع معبر عنهم مش خناقة في شارع كل واحد يكتب شتيمة ويفتكر نفسه عنتر زمانه وهو قاعد في بيتهم"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705101455/http://masr.20at.com:80/article.php?sid=591"

