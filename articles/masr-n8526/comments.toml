author = "نيفين نيفى نوفا"
posted = "2006-07-24"
text = "انا بنصح كل العشريناتيه انهم يعملو موبايلاتهم زيى beep once<br />نتكلم جد بقى<br />اولا ياسر عنده حق يا جماعه لان الالفاظ دى الفاظ غير محترمه و فبه الف طريقه نوصل بيها رسايلنا غير الالفاظ دى<br />بس ليا عتاب عندك يا ياسر<br />اولا الموضوع جميل من حيث المبدا بس انت مش معايا ان كونك تقصر دا على الشيوخ اللى هما رمز الاسلام مش كتير شويه<br />تعرف لو كنت عملت الموضوع دا على الساده المحترمين الوزراء و المسئولين كنت سمعت تعليقات تانيه خالص<br />عموما انا واثقه ان الناس المحترمه اللى ف الموقع قدروا اعتزارك<br />اما اخواننا اصحاب الالفاظ اياها ربنا يهديهم بقى<br />بس سؤال اخير يا ياسر<br />انت نغمه موبايللك ايه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061829/http://masr.20at.com:80/article.php?sid=591"

