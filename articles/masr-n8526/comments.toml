posted = "2006-07-08"
text = "صيحيح لماذا لم تسأل الكهنه فى الكنائس ايضا ياياسر .على فكره انا مسيحى .بس عاوز اعرف ذى اخوتى المسلمين.كده يبقى فكرنا صحيح حر.على فكره انا كنت حاطط موسيقى رقص شرفى على الموبيل بتاعى .وسمعه ابونا قال لى ياريت تغيرها.فعلا غيرتها وحطيت فيروز(اصل انا برضه عجوز عندى اربعين سنه.وعلشان الولادبرضه .ماهوانا احط موسيقى رقص .ابنى حيحط الراقصه نفسها).الله يوفقكم."
