[[comments]]
order = 42
subject = "تقليد اعمي"
author = "ميخا"
posted = "2006-07-27"
text = "انا لان اتدخل في الكلام اللي دار بين الكاتب والمعلقين وتداول الالفاظ الخارجة ودي بردو ظاهرة ليست جيدة وعيب اوي علي اللي بيشتم دة لان في ناس كتير اوي بتقراء الكلام دة .<br />ثانيا انا معرفش اية الهيافة دي (موبيال - محمول - جوال - نغمة رنة رسالة مش عارف اية محن اية هيافة اية هبل اية سزاجة اية) وبعدين اللي انا عرفة ان الزفت دة هو هو نفس التليفون اللي مرمي علي المكتب قدام اي حد وبزراير لف بس الاختلاف كلة انك ممكن تشيلة معاك في جيبك وانت ماشي يعني كل اللي يهمك انك تسمع صوته وهو بيرن وتعرف تتكلم فية وبعدين مهو احنا كنا مشين كويس قبل الاختراع دة ما يدخل مصر اصلا بس مع الاسف الهيافة والتفاهة اللي في الشعب المصري هي الي عملت من الموبايل دة حكاية ورواية وقصة وتخلي واحد زي ياسر يكتب موضوع كامل عنة وتخلي بردو الناس دي كلها ترد علي الموضوع دة بتهجم وسخرية . في حد فيكو سمع ولا شاف الهيافة دي برة عند الناس اللي استخدمت الموبايل عملت الهبل اللي الشباب ولا حتى الناس كلها هنا في مصر .. اتقوا الله وبلاش التقليد الاعمي دة .. وعوزين البلد تنضف مستحيل ..<br />حسبي الله ونعمة الوكيل .<br />يعوض علينا ربنا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061829/http://masr.20at.com:80/article.php?sid=591"

