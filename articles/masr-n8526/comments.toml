[[comments]]
order = 24
subject = "التطاول على العلماء سمة الجهلاء"
author = "واحد متضايق من الموضوع"
posted = "2006-07-08"
text = "أولا ان كنت بجد رحت سألت المشايخ والعلماء بجد وده كام حالهم ودي رناتهم يبقى قول على الأمه يا رحمان يارحيم<br />طبعا أنا استبعد امك تكون سألتهم<br />لكن الي استعجبلوه هو أزاي اصلا يبقى عندك قلب تهين علماء الأمه مع العلم كتير منهم شخصيا مش متفق معاهم<br />لكن في حدود ولا يجوز لأحد العوام التعرض للخواص من أهل العلم<br />أتقي الله وبلاش النوعيه دي من المواضيع عشان موقعكو يفضل موجود والا سيتم التهييك عليكو<br />وصدقني هكون زعلان لو ده حصل فياريت تفكرو شويه قبل ما تكتبو<br />واوعى تفتكر ان الموضوع موقع واديك بتكتب وبتشتهر<br />نجيب محفوظ الكتابه والأدب ساقته للكفر<br />فخد بالك وخليها ظريقك للجنه مش للنار<br />وربنا يهديك ويهدينا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061829/http://masr.20at.com:80/article.php?sid=591"

[[comments]]
order = 25
