subject = "الله ينور"
author = "ابو غانم"
posted = "2006-09-03"
text = "يسلم فم الاخ اللى تحت الاتنين اللى فوقيه ويجعله عامر اما بالنسبة لوائل افندي فالف مبروك على الخطوبة بس ربنا يستر وميكنش ده آخرك ذي واحد صاحبنا انته عارفه كويس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123149/http://www.20at.com/article2.php?sid=1160"

[[comments]]
order = 5
subject = "سؤال الى القراء"
author = "جاسم"
posted = "2006-09-08"
text = "السلام عليكم احب ان اسأل كل مسلم ومسلمةويارايت احصل على جواب مقنع ومنطقي السؤال هو هل من المعقول بأن الله عز وجل ان يجعل الانسان المسلم في حيرى من امره في مسألة الزواج او الزنى ولا يجعل حل وسط لهذه المسألة اخوتي الشباب انا ابحث عن الجواب منذو فترى غير قصير ى ولقد سألت بعض الشيوخ الكرام هذا السؤال من الشيوخ السعودية ومصر وغيرها وكان جوابهم بصراحة غير مقنع وغير منطقي القرانفيه ايات وسور واضحة ولكن المشكلة تقع في التفسير العلماء يفسروون كل حسب فهمه لهذه اللآيات واكتفي وشكرا انتضر الجواب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123149/http://www.20at.com/article2.php?sid=1160"

