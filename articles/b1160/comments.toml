subject = "يارب حصن شبابنا"
author = "ياسر ابو عمار"
posted = "2006-08-30"
text = "الله ينور يا عم وائل ،ربنا يحصن شبابناكلهم ،وارجو ان الاخوة اللى بيتفننوا فى قلة الادب على الفضائيات يرحموا الشباب من ترتيباتهم الشيطانية ،على العموم مبروك يا عم وائل على الخطوبة وانا شايف ان دى اهم خطوة لمن يريد الاحصان.تحياتى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123149/http://www.20at.com/article2.php?sid=1160"

[[comments]]
order = 2
subject = "مبروك لكن"
author = "حشري"
posted = "2006-08-30"
text = "أشارك الباشمهندس أعلاه تهنئة الخطوبة للأخ وائل ولكن سيظل السؤال الجوهري بالفعل اذا كان هناك فتاوى للامة واخرى للمرأة فلماذا يكون للشباب فقها خاصا بهم يترخص يتشدد ليس مهما الاهم انه خاصبهم مسكون بهمومهم على العموم نشكر الموقع على فتح القضية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123149/http://www.20at.com/article2.php?sid=1160"

[[comments]]
order = 3
subject = "السلام عليكم"
author = "ياء"
posted = "2006-08-31"
text = "الاخ اللى فوق اللى فوق بالنسبه الى الصلاه فى المسجد فلو لا قدر الله حضرتك مبتركعهاش من الاساس مش لازم تصلى فى المسجد يكفى انك تصلى فى البيت لحد ماتتعود على الصلاه فى وقتها ولو الحمد لله بتصلى متوقعش انك حتخصر حاجه لو نزلت تصلى فى المسجد بل على العكس حتكسب حسنات اكثر ( من غدا الى المسجد او راح اعد الله له نزلا فى الجنه كلما مشى او راح ) ( بشر المشائون فى الظلم بالنور التام يو القيامه)<br />فتنه سيدنا معاويه وسيدنا على<br />انصحك بقرائه كتاب العواصم من القواصم لابى بكر العربي لكن لا تنسى ان الاثنين كانوا من الصحابه رضوان الله عليهم<br />الاخ اللى فوق على طول تذكر<br />الكلمه الطيبه صدقه<br />من كان يؤمن بالله واليوم الاخر فليقل خيرا او 000<br />بلادى بلدى لك حبى وكفاحى<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123149/http://www.20at.com/article2.php?sid=1160"

[[comments]]
