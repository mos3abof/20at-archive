[[comments]]
order = 0
subject = "الله احل لنا النكاح -فين المشكلة"
author = "بردان التكريتي"
posted = "2006-08-30"
text = "والمحصنات من النساء إلا ما ملكت أيمانكم كتاب الله عليكم وأحل لكم ما وراء ذلكم أن تبتغوا بأموالكم محصنين غير مسافحين فما استمتعتم به منهن فآتوهن أجورهن فريضة ولا جناح عليكم فيما تراضيتم به من بعد الفريضة إن الله كان عليما حكيما ومن لم يستطع منكم طولا أن ينكح المحصنات المؤمنات فمما ملكت أيمانكم من فتياتكم المؤمنات والله أعلم بإيمانكم بعضكم من بعض فانكحوهن بإذن أهلهن وآتوهن أجورهن بالمعروف.........."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123149/http://www.20at.com/article2.php?sid=1160"

