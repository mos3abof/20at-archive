text = "بسم الله ماشاء الله علي كاتب المقال<br />وياريت تمدنا بالمزيد من مقالاتك<br />وان شاء الله تمدنا بالمقالات في اخبار سعيدة"
archived = "2009-05-25"
capture_url = "https://web.archive.org/web/20090525120246/http://www.20at.com:80/masr/105-msa7t-r2y/12129-2009-05-20-08-44-58.html"

[[comments]]
