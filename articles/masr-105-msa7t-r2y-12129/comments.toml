text = "جريدة صوت الامة اليوم قالت<br />ان المحروس كان راكب حصان وبيتدرب على الفروسية ولما كان الحصان بينط وقع المحروس وان[ *** ]رت رقبتة على صدرة بالتعبير الشعبى وجابوا طيارة اسعاف من عند السعودية نقلتة الى باريس وهناك طلع السر الالهى"
