author = "واحد من البلد"
posted = "2009-05-20"
text = "يا اخى تغيير اية<br />نحن فى انتظار عزرائيل ان يتم المهمة ويخلصنا منهم جميعا<br />ان ربك يمهل ولا يهمل<br />هل تذكر صدام ؟عاش حتى راى مصرع ولدية ثم مات<br />نعم ثم مات<br />لم يتعظ احد من صدام"
archived = "2009-05-25"
capture_url = "https://web.archive.org/web/20090525120246/http://www.20at.com:80/masr/105-msa7t-r2y/12129-2009-05-20-08-44-58.html"

