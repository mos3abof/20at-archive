subject = ""
author = "الاسيوطى"
posted = "2009-05-20"
text = "فى هذا الاسبوع<br />ماتت زوجة رئيس الوزراء نظيف<br />ومات حفيد مبارك<br />وماذا بعد ؟<br />من التالى من تلك الحكومة<br />من حانت ساعتة<br />اللة اعلم<br />الموت هو الحقيقة الوحيدة فى هذا العالم لو كانوا يعلمون"
archived = "2009-05-25"
capture_url = "https://web.archive.org/web/20090525120246/http://www.20at.com:80/masr/105-msa7t-r2y/12129-2009-05-20-08-44-58.html"

