posted = "2009-05-23"
text = "اجمل حاجة ظهرت بعد تلك الحادثة ان نظام الحكم فى جمهورية مشى حالك ليس جمهوريا ولا ملكيا ولا سلطنة وليس حكم الشعب ولا شيوعى ولا راسمالى ولكنة حكم العائلة<br />زى ابويا العمدة<br />حكم مشيخة وعمودية"
archived = "2009-05-25"
capture_url = "https://web.archive.org/web/20090525120246/http://www.20at.com:80/masr/105-msa7t-r2y/12129-2009-05-20-08-44-58.html"

