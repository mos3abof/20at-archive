[[comments]]
order = 1
subject = ""
author = "sara"
posted = "2009-05-20"
text = "لماذا تقللون من قيمة دعوات المظلومين ؟<br />والامهات اللاتى ابنائهن فى غياهب السجون والمعتقلات ظلما وافتراءا<br />الام المكلومة والزوجة المسكينة<br />والبنات اللائى يروعن بزوار الفجر للقبض على ابائهن فى نص الليل<br />والذين يلقون من البلكونات احياء<br />دعوات امهات كل هؤلاء الا يستجيب لها اللة<br />فلقد لا يغنى حذر من قدر ولا تنفع الاطقم الطبية ولا الطائرات الخاصة ام امرأة ولية قلعت رأسها ودعت ربها من القهر ان ينتقم من الطغاة فاستجاب لها ربها<br />احذروا دعاء ولية غلبانة مظلومة ولا تسخروا من دعائها<br />ذات مرة رايت احد المديرين الكبار مهموما مزعوجا جدا وخائف كان السماء ستسقط فوق راسة لان احد الناس قال لة حسبى اللة ونعم الوكيل فيك - فاخذ يسترضية ويكاد يستعطفة ويقول لة يا اخى لا تتحسبن على - للاسف كان هذا خارج مصر<br />اما فى مصر فالبلادة موجودة والظن ان عين اللة نائمة عما يفعل الظالمون لكونهم يحصلون على المال والسلطة<br />اتقوا دعوة المظلوم<br />تنقوا دعوة المظلوم<br />اتقوا دعوة حرمة ولية مقهورة مظلومة ليس لها الا ان تدعوا ربها لينتقم"
archived = "2009-05-25"
capture_url = "https://web.archive.org/web/20090525120246/http://www.20at.com:80/masr/105-msa7t-r2y/12129-2009-05-20-08-44-58.html"

[[comments]]
