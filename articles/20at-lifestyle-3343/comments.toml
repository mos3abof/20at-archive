author = "خلود صلاح"
posted = "2007-03-01"
text = "على فكرة بتكون كارثة بردو لما تكونوا اخوات العروسة اكبر من ازمة العروسة يعنى<br />المشكلة تكمن فى ان الليلة كلها لازم انت الى تظبطها<br />تصدقوا؟ يوم فرح اختى من كتر مشويرها هى واختى التانية وماما واخواتى والعيلة كلها<br />جيت قبل الفرح بارع ساعات ومكنتش لسة رحت جبت فستانى ولا اللسة اشتريت الشوز ولا الميك اب ولا اى حاجة ولا الاكسيسورز زى مايكون محدش كان قايلى على الرفح بس الحمد لله عدت<br />وعقبالى كدة يارب ما الناس كلها يتعبولى<br />لولولولولولولول وللوللى"
archived = "2010-02-14"
capture_url = "https://web.archive.org/web/20100214023142/http://www.20at.com:80/20at/lifestyle/3343.html"

