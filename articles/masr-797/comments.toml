[[comments]]
order = 0
subject = "مصر منورة بأجدع حرامية في تاريخها"
author = "مهموم أبوحسرة"
posted = "2006-08-10"
text = "طبعا أحلى واجدع إعلان فيكي يادنيا ..(نورت مصر) بيتك ومطرحك .. إحنا الريالة قصدي الريادة ..وإحنا الأصل والباقي كله أونطة..واجدع سلام للباشا الوزير أبوالأنس والفرفشة إللي إختارته ماما سوزان من بين مليون حرامي (شوف الاختيار صعب إزاي) ..وبعدين انتو عايزين كل شوية نرجع تاني نجيب الباشا صفلت الشليف.. الراجل هايعمل إيه وللا إيه ..ياما تعب وشقي وهوة بيوضب ويظبط الكاميرا في تصوير الأفلام السكس لفناناتنا وكان واقف وراه ساعتها صلاح نصر بيطلب منه دقة التصوير (حاجات كدة علشان تنور مصر) وبعد كدة وزير للغعلام والريادة الإعلامية وإحنا الصل والباقي حرنكش وأهو ياعيني تعبان مرة مظاهرة مليونية علشان العراق ونبح صوته ياعيني وهوة بيعترض آه والله بيعترض على الحرب وأتاريه هوه والباشا الكبير اللي فتشوا على العراق واتصلوا برئيس المباحث جورج بوش وخلوة قفش صدام والعراق كله (شوف الدقة والحنكة وشغل تفتيح المخ) وبعد كده جه عمك البلتاجي للإعلام والفقي للرياضة وبعدين راح البلتاجي بتاع السياحة للرياضة وجه الفقي بتاع المياتم للإعلام ..وآهي كلها سبوبة ولقمة عيش طرية...ونورتوا مصر ياحرامية ياولاد الكلب يا نورجية.."
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231337/http://masr.20at.com:80/article.php?sid=797"

[[comments]]
order = 1
subject = "نيتك وحشه يا شناوي"
author = "فرح"
posted = "2006-08-10"
text = "يا سلام عليك يا اخ شناوي فكرتنا بالذي مضى ومش راجع تاني وبعدين هتعملك ايه وزارة السياحه اكتر من كده عملت فرح بلدي نورت مصر يا عترة-يعني انت كده دايما ضد وزارة السياحه<br />لعلمك بئ السياحه في بلدنا عال العال وفي تقدم مستمر بفضل حمله الاعلانات الجبارة اللي جمعت فنانات وفنانين مصر الشرفاء اللي عمر مافيه واحده فيهم اتعملها قضيه آداب شهيره ولا عمر واحده فيهم ظابط شرطه عملها فضيحه ولا عمر واحد فيهم صور مسلسل ديني شهير وكان بيروح بين الشوتات ياخدله كاسين في فندق قريب من الاستدويو ولا واحدة بتعرف تعوم ايه مطرقه اخوها من اكبر الشواذ في مصر ولا عمر ابدا ابدا واحده فيهم اتباست بوسه في فيلم ولا واحده فيهم مثلا من دوله شكيكه عملت فيلم سكس في بداياتها الفنيه -عايز ايه اكتر من كده وبعدين الحمله جابت نتيجتها بس السياح كلهم راحوا على طول من المطار على جامعه الدول العربيه-شفت بئ يعني وزارة السياحه بتعمل الفه بين العرب-نيتك وحشه دا بدال ما تدعى للوزير الهمام العظيم اللي تحت ايده اعظم سياحه في مصر ومع ذلك المحصله صفر- معرض ولا اتنين في امريكا لشويه قطع اثريه كده على ماقسم يعني بينتظرة ملايين الامريكان ويزورة ملايين واحنا عندنا ابوالهول واهله هينطقوا-والحكومه نايمه في العسل- وربنا يخلى الحكومه العظيمه اللي عايشيين في حماها وشايفين الهنا على اديها- بس امانه على بتوع الحكومه كل واحد يروح للمزين ويبص على قفاه في المرايا علشان كل الاصفار دي بعتها لكم على قفا.............."
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231337/http://masr.20at.com:80/article.php?sid=797"

[[comments]]
order = 2
subject = "هكدا ستظلمونها"
author = "هند (المغرب)"
posted = "2006-08-10"
text = "بهؤلاء الوزراء و هدا الاعلان ستقولون ظلمت مصر سرقت مصر خربت مصر و ليس نورت مصر ملحوظة اعلانات السياحة في المغرب لا تقل غباوة عن اخنها في مصر حيث هناك اعلان يحث الناس على عدم سرقة السائحين؟؟؟؟ و كان شعي حرامي لا سمح الله مع ان هدا الاعلان كان لا بد ان يوجه لوزراءنا الميبجلين."
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231337/http://masr.20at.com:80/article.php?sid=797"

[[comments]]
order = 3
subject = "خربت مصر خربت مصر"
author = "احمد"
posted = "2006-08-11"
text = "يا جماعه الخير هما قصدهم تعالى مصر خرب كمان وكمان وهما حسين بحاجه الباشوات الوزرا وكانهم بيخترعوا رجل الكيكى خليه يشوف دبى والرجاله بتوعها عاملين فيها ايه واذاى عدد السياح كل سنه بيزيد عن التانيه باعداد مهوله وهنا فى تصريح من قبل حوالى سنه لوزير السياحه ان فى خلال خمسه سنوات خطه لزياده عدد السياح خمسه مليون وفى نفس اليوم قرأت تصريح للشيخ محمد بن راشد حاكم دبى انه فى خلال خمسه سنوات خطه ليكون عدد السياح 15 مليون ايوه والله العظيم خمسه عشر مليون شوفوا الفرق والا احنا مقعدين شويه بقر على الكراسى مش عارفين حاجه غير تمام يا ريس كله عال العال واوامرك يا ست هانم وطلبات البيه الصغير كدكوا نيله عليكم وعلى السياحه المقرفه بتعتكم يا بقر"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231337/http://masr.20at.com:80/article.php?sid=797"
