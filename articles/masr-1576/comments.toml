[[comments]]
order = 6
subject = "عَشْر همسات لأهل المِحَنِ والبلاء"
author = "عبد الرحمن بن محمد السيد"
posted = "2007-02-12"
text = "يا أصحاب الحاجات .. يا أهل الفِتن والابتلاءات .. يا أرباب المصائب والكُرُبات .. أُشهِد الله على حبِّكم فيه .. ثمَّ أهدي إليكم هذه الهمسات ..<br />الهمسة الأولى : أيها المصاب الكسير .. أيها المهموم الحزين .. أيها المبتلى .. أبشر .. وأبشر .. ثم أبشر .. فإن الله قريبٌ منك .. يعلم مصابك وبلواك .. ويسمع دعائك ونجواك .. فأرسل له الشكوى .. وابعث إليه الدعوى .. ثم زيِّنها بمداد الدمع .. وأبرِقها عبر بريد الانكسار .. وانتظر الفَرَج .. فإنَّ رحمة الله قريبٌ من المضطرِّين .. وفَرَجه ليس ببعيدٍ عن الصادقين ..<br />الهمسة الثانية : إن مع الشدة فَرَجاً .. ومع البلاء عافية .. وبعد المرض شفاءً .. ومع الضيق سعة .. وعند العسر يسراً .. فكيف تجزع ؟<br />أيها الإنسان صبراً إنَّ بعد العسر يسراً<br />كم رأينا اليوم حُرَّاً لم يكن بالأمس حُرَّاً<br />الهمسة الثالثة : أوصيك بسجود الأسحار .. ودعاء العزيز الغفَّار .. ثم تذلّل بين يدي خالقك ومولاك .. الذي يملك كشف الضرِّ عنك .. وتفقَّد مواطن إجابة الدعاء واحرص عليها .. وستجد الفَرَج بإذن الله .. ( أمَّن يجيب المضطرَّ إذا دعاه ويكشف السوء ) ..<br />الهمسة الرابعة : احرص على كثرة الصدقة .. فهي من أسباب الشفاء .. بإذن الله .. وقد قال النبي صلى الله عليه وسلم : ( داووا مرضاكم بالصدقة ) .. حسَّنه الألباني وابن باز .. وكم من أناسٍ قد عافاهم الله بسبب صدقةٍ أخرجوها .. فلا تتردد في ذلك ..<br />الهمسة الخامسة : عليك بذكر الله جلَّ وعلا .. فهو سلوة المنكوبين .. وأمان الخائفين .. وملاذ المنكوبين .. وأُنسُ المرضى والمصابين .. ( الذين ءامنوا وتطمئنُّ قلوبهم بذكر الله ألا بذكر الله تطمئنُّ القلوب ) ..<br />الهمسة السادسة : اعلم أنَّ اختيار الله للعبد خيرٌ من اختيار العبد لنفسه<br />اقرأ بقية التعليق .."
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073150/http://masr.20at.com:80/article.php?sid=1576"

[[comments]]
order = 7
subject = "برافو برافو برافو عصام"
author = "احمد البهنساوي"
posted = "2007-02-12"
text = "لابد قبل ان نشكر عصام فؤاد كاتب التحقيق وبعد شكر الله تعالي ان توجه بخالص الشكر والامتنان الي ادارة الموقع التي اثبتت بحق انها تسير على درب الاعلام الهادف والحيادي والمتزن فبالرغم من ان الزميلة مني سليم كاتبة التحقيق تعتبر بمثابة كادر صحفي لا يستهان به فى الموقع الا ان ادارة الموقع لم يشغلها ذلك عن رسالة الاعلام الحقيقية في حق الرد والنقاش الجاد اما انت يا عصام فاهنيك مرتين الاولي لاخلاصك لفكرتك ليس هذا فحسب بل وباقتناع يصل لدرجة الاقناع والثانية فاهنيك على اسلوبك الرصين وكلماتك التى تنظلق كطلقات الرصاص التى لا تخطيء هدفاو بصرف النظر عن توجهك فاهنيك من موقعي كقارئ في المقام الاول قبل ان اكون صحفيا لبراعتك المهنية"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073150/http://masr.20at.com:80/article.php?sid=1576"

[[comments]]
order = 8
subject = "توضيح ابو محسن"
author = "فهد الا سلام"
posted = "2007-02-12"
text = "اخونا الفاضل ابو محسن اولا شكر على الردبحب اوضح لحضرتك ان ايام الحسن والحسين كان فية شيعة وهم شيعة سيدنا على واهل اليت ثانيا اهل العقيدة والسنة لم ير فعو السنتهم عن الخوض فى هذا لا نهم تمس الصحابة ولكن مجموعة عبد الله ابن سبا التى اخذت الا سلام ستار لها هى التى جعلت الفتة تسرى بين شيعة سيدنا على وبين معاوية وكانت الفتنة الكبرى واهل السنة والجماعة يقولون حقايق لا نى تكفير اى احد من صحابة رسول الله هو من الكفر مهما كان هذا الصحابى وان كنت تسال عن الحجاج فهو طاغية زمانة وكان لا يفرق بين سنى وشيعى فى القتل اما ردك على ابن بهية ان لهو تار بينة وبين حسنى مبارك كلنا لنا تار عند حسنى مبارك وبعد كدة يا سيدى الفا ضل انت تتكلم عن تار يخ وعن زعماء كا نو ونحن نتحدث عن زما ننا وعن الظلم البين الذى نعييشة وشكر ا ليك والسلا م عليكم"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073150/http://masr.20at.com:80/article.php?sid=1576"

[[comments]]
order = 9
subject = "حلوة يا عصام"
author = "ياسر أبو العلا"
posted = "2007-02-12"
text = "لا فعلا ملعوبة يا عصام ،برغم رقتك المعروفة شعرت انك شرس للمرة الاولى فى الاصرار على الدفاع عن حاجة انت شايفها -وانا كمان-مزبوطة ،بس الاحلى هو فعلا ادارة الموقع اللى سمحت ان يكون فيه رد بالشكل ده وفى اطار موضوع مش من خلال التعليقات .<br />اول مرة اظن تعملوها مع حد غير براء انه يرد من خلال موضوع صحفى على حاجة وردت فى موضوع تانى ،برافو عصام ،برافو عشرينات،وبرضه برافو منى سليم علشان متزعلش منى .<br />الرجاء ان لا تكون تلك المرة الاخيرة فى اتاحة الفرصة امام القراء او الزملاء للرد على ما يرونه غير منطقى او صحيح يرد فى الموقع ،يعنى لو كنت عارف ان القصة دى ممكنة كان ممكن ارد على براء لما نسب ليا شرف -مع انى لا استحقه-انى اقود مع عبد المنعم حملة لمقاطعة المصرى اليوم ،بس خلاص بقى الجايات اكتر،والمشاكل عمرها ما هتخلص."
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073150/http://masr.20at.com:80/article.php?sid=1576"

