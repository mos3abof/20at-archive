subject = "محنة نعم نتعلم نعم برضه"
author = "omar"
posted = "2007-02-12"
text = "الاخوان يتعرضون للمحن نعم وللابتلاء وده طبيعى لأى صاحب دعوة<br />لكن لابد ان يتعلموا من هذه المحن والابتلاءات وهما فعلا بيتعلموا لكن (وانا واحد من الاخوان ) بقول ان الاخوان لا يتعلمون بما يكفى رغم انهم يطورون نفسهم بشكل كبير أكبر من أى حزب او جماعة لكن ما زال الايقاع بطيئا<br />http://omar-masry.blogspot.com"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073150/http://masr.20at.com:80/article.php?sid=1576"

[[comments]]
order = 3
subject = "نداء عاجل الى فضيلة المرشد"
author = "مطلوب فوري"
posted = "2007-02-12"
text = "بعد تصريح احد المسئولين الكبار ان مصر بها 4 الاف معتقل<br />يا فضيلة المرشد يرجى التكرم باصدار اوامركم السامية بسحب اعضاء الجماعة من مجلس الشعب والانسحاب من اي معترك سياسي.<br />ونضيف:<br />ان اول محنة للاخوان كانت في عهد الملك فاروق وذلك باغتيال حسن البنا واعتقال اعضاء جماعة الاخوان المسلمين.<br />وتكررت ايام جمال عبدالناصر<br />وتكررت ايام السادات<br />وها هي تتكرر بنفس السيناريو امام حسني مبارك<br />وحيث ان الجماعة بقالها ما يقارب من 60 سنه ولم تقدم اي شيء الا السجون والمعتقلات والمحاكم العسكرية والخوف والهلع للمواطنين الابرياء.<br />لذا يرجى الانسحاب فورا وبدون شروط وتحويل الجماعة الى جماعة دينية للامر بالمعروف والنهي عن المنكر دون ان يكون لها اي مطامع سياسية<br />وحل عن ابونا بسجونك ومعتقلاتك ومحاكمك العسكرية.<br />او تقولنا حضرتك حتنتضر امتى<br />لان الرسول صلى الله عليه وسلم انتصر في 13 سنه فقط<br />انت بقالك 60 سنه ولسه ما انتصرتش ممكن تقولنا حتنتصر امتى او تحل الجماعة"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073150/http://masr.20at.com:80/article.php?sid=1576"

[[comments]]
order = 4
subject = "رد على الاخ فهد الاسلام"
author = "ابومحسن"
posted = "2007-02-12"
text = "افكار شيعية<br />أرسل هذا التعليق بواسطة : فهد الا سلام<br />الاخ ابو محسن افكارك دى افكار شيعية لان مش السنة هما الى قتلو سيدنا الحسين رجاء منك انت ان تقراء تاريخ وان تبحث عن الحقايق هذا للتو ضيح بس<br />ــــــــــــــــــــــــــــــــــــــ<br />يا اخ فهد الاسلام ايام الحسين ما كنش فيه شيعة وسنه الشيعة والسنة دي مذاهب كتبت بعد ذلك.<br />ولكن قتل الحسن والحسين قتل سياسي تسبب فيه الامويين على النحو الثابت بكتب التاريخ.<br />ولكن انا قلت ان عقيدة اهل السنة والجماعة رفعت السنتها عن الخوض في هذا الموضوع لانها ستمس الصحابة.<br />وكنت اريد ان اوضح للمدعو ابن بهية الذي بينه وبين حسني مبارك تار ان هناك زعماء مسلمين في التاريخ ارتكبوا فظائع وعلى سبيل المثال الحجاج بن يوسف الثقفي"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073150/http://masr.20at.com:80/article.php?sid=1576"

