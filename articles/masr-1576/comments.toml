[[comments]]
order = 0
subject = "نظرة الإخوان المسلمين للمحنة من وجهة نظر غير المنتسبين إلي الإخوان"
author = "محمد السيد"
posted = "2007-02-12"
text = "والله احترت جدا وأنا بأعلق علي هذا الرد ...<br />أتفق تماما معه في تأكيده علي نفي وجود فكرة القدرية تماما عند الإخوان ... أوإنهم سايبين الأحداث تمر بيهم ... مع احتساب كل ذلك عند الله ...وفقط ...<br />والأهم... أختلف جدا جدا ... في بعض الكلمات المستخدمة .... في بعض الجمل اللي حسيت إن هنا مش مكانها ...<br />وخايف جدا ...إن لغة التعليقات الراقية و العالية جدا اللي كانت في موضوع الأستاذة مني ... هنا ترجع تتدني تاني .. ونبدأ العراك والصوت العالي ...<br />عموما ...ربنا يستر ...<br />وإن كان ليا رأيي\"وإن كان مينفعش أقول رأيي في حاجة أنا اللي كاتبها\" التعليق اللي كان كتبه العبد لله ..كان حيبقي أوقع وأحسن ولو بنسبة ضئيلة عن مثل هذا الرد ...<br />حتي لو بدون ذكر اسمي ...<br />المهم المعني يوصل ...<br />بس إن شاء الله ... برضه مش حاسكت ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073150/http://masr.20at.com:80/article.php?sid=1576"

