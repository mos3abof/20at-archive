text = "طب لما يوفروا لنا سرعة 15 ميجا / ث زي البلاد الى بره وبره كمان بسعر 90 جنيه<br />لكن أحنا هنا بندفع الـ 90 جنيه وبناخد 512 ك/ث … يبقى مين الى بيسرق مين بالذمة<br />ولما يوفروا السرعة دى بالسعر ده زي بره ساعتها من حقهم يقولوا احنابنتسرق<br />لكن احنا دلوقتي يبقى الواحد متعاقد على 512 وتلاقي السرعة أوحش من 256 بكتير<br />دي بقت حاجة تخنق"
archived = "2009-08-25"
capture_url = "https://web.archive.org/web/20090825184936/http://www.20at.com:80/masr/t7kyk/12885-2009-08-09-11-58-27.html"

