subject = ""
author = "من الشعب الحيران الغ"
posted = "2009-08-11"
text = "الرد علي الشركه<br />بخصوص الوصلات<br />طبعا الوصلات منتهتش يا شركات الانترنت<br />بالعكس انتو دبحتو الشعب بسكينه تلمه بارده وحسين بالدبحه<br />افهم انا الناس اللي مبتفهمش<br />ان بعد كدا بتاعلا الوصلا هيبيع بالجيجا اشتراك شهري مشعجبك روح الشركه ب45 جيجا"
archived = "2009-08-25"
capture_url = "https://web.archive.org/web/20090825184936/http://www.20at.com:80/masr/t7kyk/12885-2009-08-09-11-58-27.html"

[[comments]]
order = 8
subject = ""
author = "من الشعب الحيران الغ"
posted = "2009-08-11"
text = "شركات الانترنت لا تضمن أي سرعة يستفيد منها المستخدم<br />أشكوى سرعة تنفيذ القرار في غير اللجوء إلى اخذ أراء المستخدمين وعدم إشراك مجلس الشعب , واستفسر متحيرا عن كيفية إصدار قرار مصيري يمس العديد من الأشخاص في غرفة مغلقة بين جهاز حماية الاتصالات وشركات الانترنت وتهميش أطراف أخرى لها حق التصويت مما يسئ إلى الكرامة الشخصية واحترام العادات والتقاليد.<br />10..أوضح ابتزاز شركات الانترنت للمشتركين حيث يتم تأخير تغير الخط من شركة إلى شركة أخرى لمدة 15 يوم حيث يظل فيها المشترك من غير انترنت وهذا لإجباره على عدم ترك الشركة.<br />نظرا لسياسة الدولة وتفعيل الحكومة الالكترونية والسماح للموظفين بإتمام عملهم في المنزل عبر الانترنت وسياسة وزير الاتصالات بالانفتاح على المعلومات لمواصلة التقدم عبر الانترنت وطبقا للمادة 19 والمادة 24 من قانون رقم 67 لسنة 2006 نرجو من سيادتكم رفع قانون الاستخدام العادل الذي يفيد شركات الانترنت ويضر كل فئات الشعب من أفراد وشركات صغيرة"
archived = "2009-08-25"
capture_url = "https://web.archive.org/web/20090825184936/http://www.20at.com:80/masr/t7kyk/12885-2009-08-09-11-58-27.html"

