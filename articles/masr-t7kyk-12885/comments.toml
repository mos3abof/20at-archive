posted = "2009-08-11"
text = "بالنسبة للسرعة 512 كيلو بايت يتم وضع حد 25 جيجا بايت في الشهر اي 800 ميجا بايت في اليوم وهذا غير مقبول لمستخدمي الانترنت في البيوت والشركات الصغيرة، ودعني أوضح بأن 800 ميجا بايت تتيح لك مشاهدة أربع إعلانات لأفلام HD 1080 لمدة 8 دقائق هي مجموع الأربع إعلانات.<br />7..خدمة الانترنت تتصف بأنها خدمة تعتمد على مجهود الشركة حتى بعد هذا القرار فان"
archived = "2009-08-25"
capture_url = "https://web.archive.org/web/20090825184936/http://www.20at.com:80/masr/t7kyk/12885-2009-08-09-11-58-27.html"
