[[comments]]
order = 5
subject = ""
author = "بحب مصر جدا وقرفانة من اللي بي"
posted = "2007-07-06"
text = "بجد الموضوع لمس نقطة هامة في حياتنا جايز تكون ملازمنا في كل وقت بأشكال مختلفة انا مثلا عندى احساس فظيع بالخوف من كل شئ خوف من الناس اللى حواليا خوف من بكرة اللي مش عارفين ممكن يحصل فيه ايه الدنيا عمالة تتغير كل ثانية يعني مثلا مصر كانت من فترة قريبة بشكل يمكن يكون افضل من اللي احناعليه دلوقتي الدنيا بتتغير من حواليا المبادئ بتتغير الاخلاق بتتغير الناس مبقتش طيقة بعضها كله بياكل في كله كله بيضرب في كله اصبحت خايفة جدا من بكرة واللى ممكن يحصل فيه انا بتكلم من السياق ده لسبب اني بشتغل في شركة قطاع عام من فترة قصيرة وحاسة ان عنيا فتحت على الدنيا اللي خارج البيت والجامعة بدري ربنا يستر علينا من اللي جاي"
archived = "2010-02-11"
capture_url = "https://web.archive.org/web/20100211205127/http://www.20at.com:80/masr/hot-topics/6445.html"
