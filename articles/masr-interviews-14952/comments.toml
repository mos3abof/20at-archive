author = "لسة فية امل"
posted = "2010-01-18"
text = "لما تشوف بنت مصرية او تسمعها زى اسراء بتحس ان لسة فية امل<br />فاكرين اغنية شادية يا حبيبتى يا مصر<br />لما بتقول<br />ما شفش الولاد السمر الشداد وصبايا البلد<br />اسراء واحدة من صبايا البلد<br />فيها عناد صبايا البلد<br />وفيها جدعنة صبايا البلد<br />بنت بميت راجل<br />بس يا اسراء النظام ديكتاتورى قاسى وانت رقيقة زى نسمة الصباح واحنا خايفين عليكى لانك زى بنتنا ومش عايزين كلب يمس شعرة من شعر راسك<br />انت غالية يا اسراء عند الشعب المصرى لانك وقفت لوحدك امام السجان وركبتى عربية الترحيلات ودموعك نزلت وانت مترحلة لسجن القناطر<br />ولكن يا اسراء انتى اشرف منهم كلهم<br />انتى بنت مصر كلها"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127205706/http://www.20at.com:80/masr/interviews/14952--6-.html"
