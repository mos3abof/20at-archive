[[comments]]
order = 4
subject = "الحب بعد الجواز"
author = "BATISTUTA"
posted = "2006-10-11"
text = "الحب فى الجامعة غاية وليست وسيلة وزى ما بين المقال ان حتى علاقات الحب فى الجامعه اللى بتنتهى بجواز غالبا لا تستمر.<br />الزواج لا بد ان يكون اولا بحسابات العقل لان موضوع الزواج دا مش تهريج يعنى اتنين مش هيعقدوا طول الليل والنهار يسبلوا لبعض ويسيبوا مشاكل حياتهم زى ما كتير متخيل انا بقول الكلام دا عن واقع ان حاسه مش شرط اكون جربت ،لما اتنين بيحبوا بعض قبل الجواز والحمد لله بتجوزا الجواز بيستمر بس قصص الحب بتختفى لان الجواز بيفرض نفسه لان الحب فى الجواز جزء من كل مش الموضوع كله..<br />انا الحمد لله عايش حياتى فى الجامعه بلا رفيقات لان الرفيقة الوحيدة انشاء الله بالبلدى كده (مراتى) دا غير ان انا متأكد ان الحب فى الجامعه وهم وتضييع وقت ومستقبل كمان ."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103074604/http://masr.20at.com:80/article.php?sid=1034"

