posted = "2006-10-11"
text = "لا افهم فلسفة هذا الموضوع..هل معناه ان الحب ابن كلب وكخ ووحش وبيجيب المصايب والكوارث..الموضوع منحاز ضد الحب..وهو مالايجوز لكاتب الموضوع ..لما ذا يتيحز في ختيار نماذج فاشلة،وتبدو نكهتها مريبة في مدي مصداقيتها(لا اكذب احد ولكن فقط اقول مشاعري حيال الموضوع؟)..من باب الاحتراف الصحفي اعرضي وجهتي نظر..وليس وجهة واحدة..ولازال الموضوع غير مفهموم بالاساس"
