[[comments]]
order = 10
subject = "بعد 7سنين حب"
author = "فارس _fr"
posted = "2006-10-11"
text = "اولا تبتدى الحكاية بالحب من اول نظرةاو نقدر نقول انه اعجاب اتعرفنا على بعض واعترفنالبعض بحبنا فى اخرسنة اولى جامعة فى بدايةسنة تانية قالتلى لازم اعرف مامى بقصتنا علشان نا متعودتش انى اخبي عنها اىحاجهقلتلها وماله معنديش مانع لانى فعلا كنت واخد الموضوع جد جدا!!!! بعد معرفت مامتهاكان قرارها باننانقطع علاقتنا ببعض تنفيذا لتعليمات مامتها كلامهالى كان \" ان شاء الله لو لينانصيب مع بعض هنتقابل بعد التخرج \" ظاهريااناوافقت علىكل اللى قالته ولكن كنت بتقطع من جوه لانى فعلا كنت بحبها مع دخول امتحانات النصف الاول سمعت خبر خطوبتها لاخو واحده من صحباتنا واللى كانت على علم بعلاقتنا ببعض المهم انها خلاص طلعت من عقلي وتفكيري بعد الخطوبة دى طبعا .. لكن والله انا عدت على ايام اسود من ليالي الشتاء لا كنت عارف اذاكر ولا انام ولا اكل ولا اشرب .. المهم انى خلاص عديت المرحلة دى من حياتى ظاهريا !!! فى بداية سنة تالته _ تعرفوا دايما ان فى اىعلاقةبين اى اتنين بيكون فيه كوبري يا حد من صحباتها يا حد من اصحابي _ المهم انالكوبري كان واحد صحبي عرفت منه ان هى وعيلتها تعبانين اوى وداخلين فى مشاكل مع بعض وهى بالذات مش مبسوطة مع خطيبها ده ودايما بتشوف صورتى فيه وبتتعامل معاه على انه انا وان هىمش قادرة تستحمل اسلوب معاملته معاها ... انا فى الفترة دى كنت بطلت اكلمها او اكلم اصحابها !! احمد صاحبي \" الكوبري \" قاللى يا اخى طب بس قولهم صباح الخير صباح النور وخلاص \"السلام لله \" قلت اوكيه مفيش مشكلة وهى مازالت مخطوبة _ عدت السنة وهى على هذا الحال المعلق الى ان اتى شهر 7 موعد الزواج مع العديد من الاختلافات والمشاكل بين العائلتين تم فسخ الخطبة ومات والدها بعدها بسكته قلبية بعد فسخ الخطوبة يمكن بشهر ... رحت وعزيت اخوه<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103074604/http://masr.20at.com:80/article.php?sid=1034"

