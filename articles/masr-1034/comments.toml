[[comments]]
order = 1
subject = "زواج العقل يا دودو"
author = "مهتمه"
posted = "2006-10-10"
text = "الحب الحقيقي يا دودو ، اولا لازم يكون حلال يعني ازاي نتوقع اننا ننجح في حاجة في حياتنا وربنا شايفنا ومش راضي عنا ؟ ثانيا هو احنا بنتكلم عن الحب للحب اللي موجود في الافلام ولا بنتكلم عن زواج وحياة واسرة؟<br />لو كانت الدنيا حب وبس ما كنش قيس اتجنن ولا كان عنتر اتبهدل ، بس فيه حاجات اهم من الحب وهي مستقبل العلاقة دي ايه؟ ايه اللي يضمن لي ان الانسان ده صادق ؟ واخيرا اقري معايا الرأي ده يمكن يعجبك<br />\"إن التوفيق في الزواج يأتي في المقام الأول بالاستعانة بالله والدعاء وصلاة الاستخارة، وبعد ذلك تأتي حسابات العقل التي تقارن وضع الزوج المادي ومستواه الاجتماعي ودراسة أخلاقه وسلوكه والسؤال عنه وتأتي في النهاية المشاعر والعاطفة؛ لأننا إذا سمحنا للمشاعر أن تسبق ويكون لها الأولوية فسوف يأتي الحكم غير محايد وغير منصف، وقد توافق الفتاة (وأهلها تحت ضغوطها) على أوضاع وظروف لا يمكن قبولها في الأحوال العادية.<br />إنني لا أنكر بطبيعة الحال أهميةَ الحب والمودة والمشاعر في إقامة حياة زوجية ناجحة، ولكنها لا تصلح وحدها للتوفيق في الزواج، والعكس قد يكون صحيحًا، فتوافق العوامل الإيجابية من ماديات ومستوى اجتماعي وخُلق ودين سوف يؤدي بالتأكيد لمشاعر المودة والرضا إن لم يكن الحب، وبالتالي تسير مركب الحياة الزوجية في هدوء ودون عواصف تقتلعها، وبالتالي فأنا أرى أن زواج العقل يكسب.\""
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103074604/http://masr.20at.com:80/article.php?sid=1034"

