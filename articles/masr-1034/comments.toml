subject = "love nothing"
author = "dodo"
posted = "2006-10-10"
text = "الصراحة انا لسة صغيرة معنديش خبرة لكن الموضوع فعلان جميل لاءنى حسيت انوا اخد جوانب كتير جدا<br />انا فى اولى جامعة ومكنتش معترفة با الحب قبل كدة<br />لاءنى كنت حاسة انوا وهم كبير لكن الموضوع دة خلانى احس ان الحب كلة لاءيام دى مش حقيقى او صعب انا نلاقى الحقيقى انا بس كان نفسى اعرف اعرف الحب الحقيقى ازاى واشكرك لو رديتى عليا لكن فعلان الموضوع هايل خصوصان انوا واخد رائى استاذة كبار انا طولة عليكوا لكن انا بس كنت عايزة اقول رائى شكرا لحسن لاءستماع"
