[[comments]]
order = 13
subject = "ههق أل حب حب أل"
author = "أحمد كناريا KANARIA_ABDO2001@YAHOO.COM"
posted = "2006-10-18"
text = "الاول السلام عليكم ورحمة الله وبركاته<br />ثانيا احب أشكر كل من يشارك فى هذا الموقع الجميل الى بيناقش جميع قضايا العصر .<br />وأحب أول فى موضوع الحب فى الجامعة أنه مفيش حاجة أسمها حب بين طالب وطالبة فى مرحلة الجامعة ولا فى أى مرحلة أخرى مش معنى أنى أشوف واحد كويس سواء كان من ناحية المظهر او الشياكة اوالعقلية السليمة & وكذلك الرجال مش معنى أشوف بنت شكلهاحلو أو لبسها حلو شيك ومن وجهة نظرك انتا انه تدين وحاجة كويسة أنك تعجب بيها وعلطول تحول الاعجاب دوة إلى حب أو إلى ما شابه ذلك لآلآلآلآلآلآلآلآلآلآلآ<br />وأحب أنصح كل أخت لية<br />وليه أنا بوجه كلامى للأخوات ؟<br />لآن معظمهم سورى فى اللفظ ( سوزج أو بمعنى أخر علنيتهعم) بعنى إخر غلابة ميعرفوش حاجة عن الدنيا والى بيحصل فيها أحب أأولهم مش اى حد يتكلم معاكو بطريقة كويسة او يضحك فى وشكم تحبوه .<br />وبعدين إنتو لية بتفكرو فى الحب والرومانسية وإيه الى يخليكو تبئو فى الموقف دوة .<br />أحب أأول لكل أخت ودى أخر نصيحة عندى<br />أنكم لاوم تمارسوا حياتكم بشكل طبيعى جدا لا فيها حب ولا كلام فارغ من الكلام دوة وكمان علشان تكونوا عارفين مفيش اى حد بيتزوج بعد قصة حب زى مبتؤلوا وبينجحوا فى حياتهم الزوجية وأراهن أى شخص على ما أقول .<br />وأنا أسف لو كانت طريقة كلامى ( بلدى شوية ) زى ما بيؤلو بس أنا حبيت أعبر عن كلامى بالطريقة دى حتى يفهمها الجميع<br />وشكرا أخوكم فى الله أحمدكناريا"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103074604/http://masr.20at.com:80/article.php?sid=1034"

