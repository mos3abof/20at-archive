[[comments]]
order = 10
subject = "شوفو كلام حسنى مع التلفزيون الاسرائيلى واللهى حاجة تحرق الدم"
author = "مصرية"
posted = "2007-01-20"
text = "خلاص يا جماعة دم الشهيد اتباع من زمان من ايام المعاهدة.انا مش عارفة ازاى قدر يعمل السادات مع اليهود سلام مع انى اليهود دول معروفين انهم مش بتوع سلام وانى فى طبعهم الخيانة وقبل كدة خانوا الرسول عليه الصلاة والسلام ولسة بيخونوا لغاية دلوقتى لانهم بيقتلوا فى الجنود المصرية على الحدود وبيقولو لسة ما بينا شلوم\"يعنى سلام\" شلوم ايه يا بتوع الشلوم انتم قولوا شليمون مش شلوم لانكم قاعدين تمصوا فى دمنا بالشليمون بتاعكم دة . لا وفى الاخر مبارك يطلع يقول فى حوار مع التلفزيون الاسرائليى يقول \"انتوا يا اسرائيلين قاعدين تقولوا اعدئنا فى الجنوب اعدئنا فى الجنوب ايه دة انا لما اقول اعداء عليكم انتوا بتزعلوا دلوقتى انا بقول اخونا فى اسرائيل وانتوا تيجوا تقولوا اعداء كانكم انتوا بتعمقوا الكرهاية فى نفوس المصريين والاسرائليين لبعض\"شفتوا يعنى فى خلاصة الكلام بيقول انى الاسرئليين بقوا اخوتنا شوفتوا الجمال لا استنوا بقى الجاية احلى واحلى بيقول الرئيس\"حلو مشاكلكم يا اسرائيلين مع جيرانكم بالتفاوض والسلام وبعدين زمان كان اليهودى معروف بكلمته يعنى اليهود كانوا يدوك كلمة اقوى من الورق والإيصال\" شوفتوا الحلاوة والجمال بيقولك حلو مشاكلكم مع جيرانكم باسلام هما اليهود دول اصلن ليهم جيران دة هما اصلن معندهومش ارض وكتب عليهم الشتات فى الارض وهما اصلن محتالين فلسطين وفكرنها ارضهم ولا اللى يحرق الدم اكتر واكتر انى بيقولك اليهودى بكلمته كلمة ايه دة اليهود دول طول عمرهم خاينين ومعندهومش كلمة.<br />وكمان انا مش عارفة ازاى الصحفى المصرى هووبتاع المدونة ازاى قدروا يتدخلوا الارض المحتلة دة ماكنش فى بيت فيكى يا مصر ومافهوش شهيد ماكنش فى جامع اوكنيسة فيكى يا مصر مابتصليش على شهيد انا مش عارفة ازاى نسيوا كل دة اكيد دول ماشر<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 11
subject = "وليه تروحوا بعيد .........."
author = "طارق الوزير"
posted = "2007-01-20"
text = "ماتسمى بمؤتمرات الاقباط العالميه يشترك فيها صهاينه من الايباك والمنظمات المشبوهه وامثال الصهيونى دانيل بيبس....وهم يتفاخرون بارتباطاتهم وانظروا الى كتابات الطائفى المتطرف مجدى خليل والمهووس مدحت قلاده والمعجون بالحقد والغل عادل حزبن والمجنون موريس واخرين...بل زوروا مواقع المبرشمين متحدين وهيئه الاوساخ بأمريكا وفروعها... انها دكاكين عماله تموت حبا فى الصهاينه انهم فقط ولدوا بمصر وحاصلى على جنسيه اجنبيه فقط يكتبون بالعربى بعد ان نسوا القبطيه وحتى الاراميه لغه السيد المسيح..انهم اصبحوا من ضمن الصهيومسيحيه الفاشيه"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 12
subject = "لازم نفوق"
author = "جمعة الدمرداش"
posted = "2007-01-22"
text = "الحديث عن كامب ديفيد؛ كارتر، بيجن والأقرع النزهي بتاعنا بيجرنا دايما لحالة التحسر والندم على ما فات. مع الإحترام الموقف لا يختلف كثيرا عن موقف كلنا تقريبا مرينا بيه في حياتنا الخاصة..وبالتحديد إنا نبدأ علاقات جادة بخداع الذات والطرف اللي يهمنا إقامة العلاقة معاه بغض النظر عن نوع العلاقة.<br />بعضنا بيسمى ده كذب أبيض وبيأمل أن الوهم يبقى حقيقة وإن الظرف يتغير لصالحنا ويبقى عندنا القدرة على تحقيق الأحلام. اللي بيحصل يا سادة عكس ذلك...كذبة بسيطة ولو كانت بريئة تستدعي كذبة أكبر تغطيها وهكذا دواليك..حتى نجد أنفسنا في حالة طلاق نهائي مع الواقع ومع ذلك نصر ونكرر إنه كل شئ على ما يرام.<br />في فترة طويلة كنت أري المرحوم ناصر كزعيم منقطع النظير، لسبب وحيد إنه كان أنظف وأصدق ما مر علينا، وغاب عني إن النيات الحسنة يحاسب عليها رب العباد وحده..إحنا لينا النتايج.<br />السادات ضيعنا عمدا مع سبق إصرار بسبب حب الشهرة عنده، وعقدة النقص الكامنة فيه، وما كنش عنده أي ثمن غالي حتى لو كان مصر أو كل الوطن العربي.<br />السلام مع إسرائيل والإتصالات السرية كانت قائمة على قدم وساق من أيام المرحوم الملك فاروق..مرورا بناصر إنتهاءا بالسادات..فاروق وناصر أدركوا فداحة الثمن الواجب دفعة أولا، وثانيا تأكدوا من عدم جدية إسرائيل في أي سلام..إسرائيل لم ترد غير إستسلام غير مشروط لمصر ولكل العرب..وهذا ما نجحت فيه تماما.<br />الحل إيه طيب؟ معندناش النهارده شئ فاضل نتنازل عنه إلا نسمة الهوا المجاني اللي بنتفسها..وإلا أنا غلطان؟<br />طريق الإستسلام والإستجداء لحقوقنا المشروعة مسدود، وكفاية خداع للأنفس."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 13
subject = "عيب يااخ دمرداش"
author = "مصري"
posted = "2007-01-23"
text = "يااخ دمرداش عيب عليك توصف رئيس بلدك بالاقرع النزهي ياريت تقرا تاريخ مصر المعاصر بتجرد وفهم جيد وارجوا ان تراجع نتائج كل حقبة تاريخية لكل رئيس حكم مصر وهذة النتائج هي معيار نجاح رئيس الدولة او فشلة:-<br />1- عبد الناصر ابو نية سليمة ال مش عندة عقدة نقص تولي الحكم وكانت حدود مصر تشمل السودان وغزة الفلسطينية.<br />2- علي المستوي الاقتصادي كان القيمة الورقية للجنية المصري اعلي من قيمتة الذهبية.<br />3- دخلت مصر حربين 56 و 67 واحتلت شبة جزيرة سيناء مرتين انتهكت فيهما حرمات مصر واقتصاديات مصر وجيش مصر وسلملي علي في البحر حنحدفهم.<br />4- اصبحت مصر في نهاية عهدة محتلة صغيرة دوليا واقتصاديا كان السكر والشاي من المستحيلات.<br />5- تولي السادات الحكم واستلم ادارة بلدة بالشكل السابق بيانة.<br />6- ويكفية فخرا ويكفينا ايضا عبور قناه السويس وشبر واحد من ارض سيناء المحتلة.<br />7- السادات كان يدرك امكانيات بلدة ماكانش بتاع نعرات كدابة عارف حدودة وماكان امامة سوي مافعلة ماكتنش يقدر يدخل بلدة في حروب خمسين سنة اخري بعته وتخلف وباسم نعرات كدابة لا يدفع ثمنها غير الشعب ويثري ويتاجر بسببها الاخوة العرب والمتشدقين بالقومية العربية وامجاد ياعرب امجاد.<br />يااخي السادات مات وثلاثة ارباع سيناء في حضن مصر وكان يحلم باليوم الذي يكنمل فية تسلم سيناء بالكامل ومات الرجل وسيناء في احضان ابنائها وياريت تسافر وتزور سيناء وبقدراتك الفزة ياعم الدمرداش شوف اي جيش ممكن ان يحرر هذة المنطقة وممكن يسعفك معلوماتك العسكرية البسيطة لو اديت الخدمة العسكرية فكيف تحرر بقرار سياسي وعمل سياسي.<br />يااخ الدمرداش لمعلوماتك ان اول من اتصل باليهود من قيادة الثورة المعتدل ومش ال عندة اننفصام في الشخصية بشهادة الدكتور المفتي والذي اعتقل حتي موت عبد الناصر هو<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 14
subject = "أخي السيد مصري المحترم"
author = "جمعة الدمرداش"
posted = "2007-01-23"
text = "آسف إن رسالتي ما كانتش واضحة تماما، اللي عايز أقوله إن وضع آمالنا وأحلامنا في شخص واحد أي كان خطأ لا يغتفر. لأن معناه موتنا المحقق بموت هذا الشخص أو موت فكره أو شعاراته المعلنة. وإن كنا إحنا والأمة العربية كده قطيع مسيس لا رأي لنا في أي شئ وماحدش يفتكرنا إلا لما تنزل الكوارث العظام وبعد كده يرمونا زي الدسبوزال في سلة المهملات...يبقى حنفضل أمة عقيمة مهملة الشأن لاتجيد غير البكاء على الأطلال..اللي لينا ميراث طويل عريق فيه.<br />أنا لاعبد ناصر ولا مخدوم السادات وصدقني أتيح للسادات فرص حقيقية لوحدة العرب كانوا فيها أكثر من راغبين..أكثر بكثير من فرص ناصر.<br />سؤالي لحضرتك هل وحدة العرب ممكنة أو مستحيلة؟ هل هناك ولو إمكانية لوجود الحد الأدنى من تنسيق موقف مشترك تلتقي فيه مصالح الأخوة كارمازوف؟<br />إن كانت الإجابة قطعيا بالنفي ولا سبيل لتغير هذا لا عاجلا ولا آجلا، يؤسقني أقول لسعادتك إحنا بنكتب شهادات وفاتنا بأدينا..ولا يهم إن كانت شعر أو نتر.<br />في ظل تغير العالم حوالينا يجب إنا ندرك إن لا مصر تنفع بدون العرب ولا العرب ينفعوا دون مصر. فإن متفق معايا في هذة النظرة، ممكن يكون لحوارنا -على عدم جدواه من الناحية العملية- معنى، وإلا فأعذر سذاجتي وجهلي وشكرا لرحابة صدرك."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 15
subject = "الي الاخ المحترم الدمرداش"
author = "مصري"
posted = "2007-01-24"
text = "اخي المحترم احترم آراءوافكار حضرتك وتواضع حضرتك الجم وانا معك ياسيدي فيما قلت ولكن تعالي معي نرجع لاحداث ليست ببعيدة قد اشرت عليها سيادتك في ردك الدميث علي رسالتي وهي :-<br />أولا: كانت فرصة السادات في تحقيق وحدة عربية اكبر نعم ياسيدي معك فيما قلت السادات استطاع ان يوحد العرب في حرب اكتوبر لكن لم تسال سيدي نفسك هل هم توحدوا واستخدموا سلاح بترولهم من اجل الوحدة العربية او عيون مصر او جفون السادات لا ياسيدي استخدموة لصالحهم لكي يرتفع سعر البترول وكانوا علي يقين ممن استخدامة السادات رجوهم ان يقرروا قطع البترول اسبوع لم يكملوة حتي تنتهي مهلة الاسبوع من اليوم الخامس ومع الارتفاع المزهل للبترول والذي دهع ثمنة شباب من خيرة ابناء مصر كان منهم اخ للك اوخال او عم وبعد فض الاشتباك الاول والثاني قام السادات بجولة عربية بدئها بالسعودية للمطالبة بالاموال لاعادة تمويل الجيش المصري بالاسلحة والذخيرة استقبلوه بفتور بالسعودية ولم يستقبلة بالكويت سوي سيارة السفارة المصرية وامتنع المسئولين بالكويت باستقبالة ورجع الرجل وصورة الصحفي القذر احمد الجار الله وكتب بجريدة الانباء الكويتية مقالا تحت عنوان عودة الشحات.<br />وقتها قال غيظاالسادات بعد عودتة لم اضع يدي في يد هؤلاء الاقزام حتي لو ادي بي الامر الي رهن قناه السويس ووقتها قامت ولم تقعد ولم يفكروا ماذا حدث لرئيسهم ورمزهم والسؤال يااستاذ دمرداش لو انتي مكان السادات هل يسمح لك تاريخ بلدك وكرامة بلدك وكرامتك كانسان مصري ان تفعل غير مافعلة السادات ياسيدي كانوا يريدون لمصر ان تحارب خمسين سنة قادمة ولاخر جندي مصري علي حسب كلام المناضل عرفات الذي جاء واعترف مستشارية ان ياسر عرفات قال لهم بالحرف الواحد نحن نادمون علي عدم حضور مؤتمر مينا هاوس للسلام والذي وضضع<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 16
subject = "أخي الحبيب مصري"
author = "جمعة الدمرداش"
posted = "2007-01-24"
text = "أخوك في الوطن في العقد السادس الآن وفي كل لحظة واضع في إعتباره شعار \"يا رب حسن الختام\"، وعسكري محترف سابق يعرف قليلا من مبادئ السياسة وأكثر من ذلك قليلا في التكتيكات والإستراتيجيات المتعلقة بالفن الحربي..وحتى ذلك لم يحط بجوانب كبيرة منه رغم الشهادات الكبيرة اللي حصل عليها.<br />أستطيع أضع مجلدات كاملة ليس فيها مبالغة واحدة عن تخاذل وحقارة وعمالة أولي الحل والربط في الدول العربية الشقيقة..وصدقني أعرف ما يعني الخيار العسكري، وأعرف ما هي قوتنا ومن هم معنا في الميدان ..ولو كان بيدي وأتيحت لي فرصة خطة هجومية سأكون أسعد الناس لو إستبعدت أصحاب المواقف المتذبذبة من كل حساباتي.<br />للأسف الواقع- ودي بإعتقادي حكمة إلهية لا أعلم سرها- يضطرني إني أتعامل مع هؤلاء كحلفاء وشركاء. وإن كانت دولة بقوة أمريكا الإقتصادية والعسكرية تحتاج لهؤلاء في حربها المفتوحة في أفغانستان والعراق...تبقى تفهم قصدي تماما.<br />هناك ألغاز في نصر أكتوبر لا نقوى على البوح بيها حتى مماتنا، وهذا خير لأنه لن يؤدي لغير البلبلة وجحد بطولة شهداءنا وشعبنا ومن وقف معنا في حرب إكتوبر، وأقولك فقط وأترك كلامي بدون تعليق إضافي \"ليس السادات من تظن أو ما تظن!\"، كلمة ضمير والحكم لله وحده.<br />ما أوده أن نسعى جاهدين لتأليف القلوب المتنافرة، وأن نقبل حتى بأشباه المواقف، وحتى هذه الآن أضحت شبه مستحيلة لأن الشعار أصبح \"خذوني أنا يا أمريكان مفيش مخلص غيري!\". فاهمني؟<br />سؤالي اللي عارف إجابته سلفا هل على موقف الشعوب معول؟ القوات المسلحة أنا نفضت إيدي منها، لعلمي إنها ستخرب أكثر مما تصلح ولأنها عاجزة عن حماية حدود الوطن وستظل هكذا لعقود، ومش عايز إنها تعمل في الداخل عمل الأمن المركزي زي يناير سبعة وسبعين ربنا يسامح الجمسي.<br />شكرا لإصغاءك وتفهمك إني لايم<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 17
subject = "الي اخي البطل جمعة الدمرداش"
author = "مصري"
posted = "2007-01-24"
text = "الي والدي واخي الكبير ان سمحت لي ان ان تكون لي هكذا فهذا شرف لي وفخر لم استحقة ان سمحت لي فانا لا اكتب ردا علي ماجاء برد حضرتك الكريم ولكن اكتب منبهرا بفخار رجل من اعز رجالات مصر حاربوا من اجلي وكان بينكم مندوب عن عائلتي استشهد في اشرف معركة خاضتها بلادي فانا يوالدي العظيم شببت في بداية عمري علي الابطال والجهاد والتفاني من اجل مبدا وقضية قضية بلد فاخببت بلدي وان جارت علي وان جاروا عليها كنت سعيدا بفترة تجنيدي وتفوقت في تخصصي بجيش مصر الذي يحتوي ويحتوية اعظم واعطر رجال انجبتهم مصر رجال تعلمت منهم النظام وقبلة الاحترام.<br />ياوالدي واخي العظيم انتي وجيلك شرف لي وشرف لمصر ولجميع الشرفاء المحبين بصدق لبلدهم واقول هذا الكلام لحضرتك لانك ستحسة وتشعر بمدي صدقي ربما لو قراة الاخرون من هذا الجيل سيقولون عليا بتاع شع او مجنون او عبيط علي حسب الفاظ هذا الجيل المقززة<br />والدي واخي الكبير ان جيش مصر هو الامان لي ولبلدي وفية الخير كلة انشاء الله لانكم وانهم خير اجناد الارض.<br />ياوالدي ادعو الله العلي القدير ان يبارك لنا في امثالكم ويبارك لنا في جيش مصر ورجال مصر وانا علي يقين من رب العالمين ان جيش مصر قادر علي حمايتها وحماية شعبها لان في خير جنود الارض .<br />والدي المحترم اشكر حضرتك الشكر الكبير علي اهتمامك"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 18
subject = "اوسخ شعب"
author = "من بلد ام الدنيا"
posted = "2007-01-24"
text = "اليهود اوسخ شعب و اسوء شعب في العلام مجموعة من الكلاب الاوساخ و البهايم التي لا فائدة منها ولو هنكسب من وراهم ملايين مش عاوزنها دول عالم ولاد زانية ز مفيش واحد فيهب عارف ابوة مين وسعات بيبقي مش عارف امة مين اقول لاولاد اللقيطة اليهود اعرفوا اصلكوا ياولاد الحرام قبل ما تدوروا علي السلام هو انتوا جالكم اي رئيس وزراء عارف ابوة وامة اسمهم اية دول كلهم ولا زني وشكرا غصب عنكم يااوساخ"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 19
subject = "ايضا الي اخي البطل جمعة الدمرداش"
author = "مصري"
posted = "2007-01-24"
text = "اخي العظيم وجدت في نفسي اني لم اكفي حضرتك قدرا ومقاما فانت واخوانك من ابطال هذا الشعب قد ابليتم بلاء حسنافي اعظم واشرف حرب خاضتها مصر في تاريخها المعاصر فانتم اسعدتونا لانه كان عائدكم سعيد ومن استشهد منكم فهو بيننا حي لا يموت اخي وجدت في كلامك آلام نفسية احسستها وجراح في القلب لكن باسيدي لاتحزن فانت المفروض سعيد منذ عودتك من تللك الحرب الشريفة ونحن وشرفاء مصر سعداء بكم اللذين يضعون تراب بلدهم في اعينهم في صمت وتجدهم وقت شدائد هذة البلد صوتهم عال يقدمون ارواحهم في صمت فداء لها ليس من اللذين يتشدقون بالقومية والعروبة وتجار الدين اللذين يطفون كالغثاء بعد كل محنة وبعد كل فرح او نصر نعم يااخي اي انسان منكم لا يقل عن عن جمعة الشوان او رفعت الجمال وانتم مثلهم ياجمعة الدمرداش مثلهم يفتخر ويسعد بك الوطنيون الحقيقيون يااخي لكي اضمد جراحك اقول ان لحظة سعادتكم وقتها بالنصر تساوي اعمار وليس عمر الانسان يااخي لاتقل لقد اصبحت بالعقد السادس وقد نهضت في تنفيض يدي لا يااخي انتم فعلتم المعجزات بتوفيق الله لكم ولايمانكم بقضيتكم وهي تحرير ارض مصرنا الغالية وممكن ان تفعلوا ذلك وانتم بعيدا عن وضعكم الرسمي شباب هذا البلد المغيب عن واقعة بفعل غثائة من الطفيليات التي تركب المموجات وتستغل الضغوط التي تمارس علي مصر باسم الدين وحقوق الانسان والاقليات وانت اعلم بها مني انهم تجار باسم الدين يتاجرون ببلدهم ليس لهم مبدا مبدئهم المال ثم السلطة او السلطة الموصلة لكل شيئ ياسيدي اروي لشباب اليوم قصص بطولاتكم تفانيكم حاي لا يقعوا فريسة في ايدي هؤلاء المتاجرون بنا والمتاجرون بهذة البلد هؤولاء ولدوا سفاح ياسيدي انا اشفق علي ادارة البلد السياسية من مايفعلة هؤلاء بهذة البلد ومايمارس علينا من ضغوط خارجية وانا اقسم اني<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

