[[comments]]
order = 2
subject = "و أنا أصدق سعد وهبه"
author = "إبن بهيه"
posted = "2007-01-11"
text = "في أحد المؤتمرات في تسعينات القرن الماضي كنت أستمع إلى الراحل الحبيب سعد الدين وهبه عدو التطبيع الشهير في مصر وزوجته السيدة سميحة أيوب وصديقاتها المحترمات نادية لطفي التي كسرت الحصار إبان الاجتياح الصهيوني للبنان وذهبت لكي تلقي حذائها على الجنود الصهاينة وتعود .. سرد علينا الراحل وهبه قصة شاهدها بنفسه في إحدى صيدليات القاهرة لمواطن مصري صعيدي .. بسيط .. عامل .. كادح في بر مصر .. دخل هذا العامل إلى إحدى الصيدليات لشراء ضماد ليده التي تنزف .. كان في الصيدلية الراحل سعد وهبه وشاب آخر لا يعرفه ينتظران أن يأتي لهما الصيدلي بما طلباه من أدوية .. لكنهما بالطبع آثرا الإنتظار لكي يسعف الصيدلي ذلك المسكين الصاب في يده ، الشاهد أن الصيدلي أعطى للعامل لفة شاش ، كيس قطن ، وزجاجة مطهر .. كان في الصيدلية شاب صغير السن .. شد انتباهه ما أعطاه الصيدلي للعامل المصاب .. التقطه منه وقربه إلى عينيه ليقرأ بعض الكلمات المكتوبة فوق غلاف كيس القطن الطبي ..<br />توجه الشاب نحو الصيدلي قائلاً .. يا دكتور .. هل تعرف أن هذا القطن صناعة إسرائيلية ؟<br />فجأة سمع الجميع صوت ارتطام زجاجة المطهر على الأرض .. لقد قذف العامل كل ما في يده على الأرض بصورة عفوية وسريعة وتلقائية كأن عقرب لسعه في يده .. وصرخ في الدكتور .. حرام عليك يا دكتور عايزني ألف إيدي بجطن اسرائيلي؟ حرام علي ما أجي عندك تاني .. وخرج الرجل مهرولا خارج الصيدلية وهو يتمتم بكلام أعلبه مسموع من عينة حسبي اله ونعم الوكيل وشبيهاتها ..<br />ساق لنا هذه القصة سعد وهبه رحمه الله لكي يدلل لنا على أن المصري لم ولن يقبل التطبيع مهما طال زمان الخنوع والعمالة والصهينة والماسونية والطأطأة ..<br />و أنا أصدق سعد وهبه<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143727/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 3
subject = "آخرك كيس زبالة يا مواطن"
author = "رئيس تحرير"
posted = "2007-01-11"
text = "حاولت جاهدا فى الفترة الماضية ان اكون حذرا فى تشاؤمى من الفترة المقبلة فى مصر ثم افرطت فى التفاؤل حينما اكتشفت المدونات ثم زادت ثقتى عندما انشئت مدونتى لاقول فيها ما اريد ولكن ما حدث خلال الايام القليلة الماضية اعادنى الى الوراء كثيرا فبدأ من تعديلات السيد الرئيس اطال الله بقائه ليزيد من عذابه فى الاخرة تمخض الجبل وولد عصفورا اطلق عليه لقب التعديلات الدستوريه لبدايه عصر الاصلاحات الحقيقية اى كلام يعنى فى حته والله انا ساعات افتكر انه مش عارف ايه اللى بيحصل معذور عنده حاجة وشبعين شنه.<br />فوجئنا بقى بخبر اكياس الدم الملوثة وده خبر عادى جدا ؟ ايه عادى طبعا هو انتم فاكرين ان فى حاجات سليمة وحاجات مضروبة كله بقى مضروب وكله مغشوش وده اللى موجود مش عاجبك ادامك حل من اتنين اذا كنت غنى تقدر تدور على الحاجات اللى مش مضروبه واشترى باسعار خياليه اذا كنت فقير انتظر سرطان فشل كلوى او كبدى او عته مغولى اللى هيجيلك وساعتها حاجة من اتين يا تحاول تتعالج وابقى اقابلنى ولو اتعالجت هتاخد دوا مضروب او دم فاسد وساعتها يبقى لازم تموت طيب نفسك فى حاجة قبل ما تموت اه نفسى ازور بيت ربنا طيب تركب عبارة السلام لا دى بتغرق حلاص مش عايز احج طيب عايز ايه طيب والنبى ازور اهلى فى الصعيد ماشى ادامك حل من اتنين تركب القطر اللى بيتحرق ولا تركب القطر اللى بيعمل حادثة لا مش عايز اشوف اهلى طيب عايز ايه خلاص انا هاموت بس هادفن فين اه جينا بقى للمشكلة الكبيرة المقبرة دلوقتى تشطيب سوبر لوكس على المفتاح يعنى بتعمل من 30000 الى 50000<br />لا انا مش عايز اتدفن سيبونى هنا لما اعفن وارمونى فى الزبالة<br />ماشى اذا كان كده ماشى<br />mego-mego.blogspot.com"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143727/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 4
subject = "ليفى - من تل ابيب"
author = "ليفى"
posted = "2007-01-11"
text = "عندما بدأ كيسنجر مهامه الخاصه بالتطبيع اتذكر ان مناحيم بيغن رئيس الوزراء قال لى فى احدى جلساته مع والدى فى منزلنا ياليفى انت الان صغير لاتفهم فى السياسه لكن عندما تكبر ستعرف ان التطبيع مع العرب من صالح العرب اكثر من اسرائيل فقلت له ولماذا ياأونكل تعملوا تطبيع معهم اذن فقال ضاحكا لكى نحميك انت ومن هم فى سنك من الارهاب القادم اليكم .. وقال ان السادات سيكون اول ضحيه للارهاب .. ايامها لم افهم معنى كلام اونكل مناحيم لكن مع الايام عرفت كم كان مناحيم سياسيا كبيرا ويقرأ المستقبل.. وانا انقل لكم هذه الذكريات ليعرف العرب اننا خسرنا الكثير من التطبيع .. ومع هذا اسمع من العرب انهم مش راضيين على اليهود."
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143727/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 5
subject = "دا تار بايت يا جماعه"
author = "نيفين نيفى نوفا"
posted = "2007-01-11"
text = "مع اعجابى الشديد السادات اعترف انى بقف مع نفسى متير لما بشوف وقائع كامب ديفيد و الاقى السادات بيصافح بيجن<br />و حاولت ادخل ف عقل السادات ساعه الاتفاقيه<br />و سالت نفسى سوال واحد<br />هل السادالت وقتها كان بيحاول يحب الاسرائيلين و لا كان عايز يجنبنا تبعات ووويلات الحرب<br />و سبت السؤال لانى اعتقد ان الاجابه واضحه<br />و حكايه ابن بهيه و قصيده دنقل اللى مش بعرف امسك دموعى كل ما بقراها بالصدفه ف اى مقال زى ما حصل دلوقتى و اللى بنشوفه كل يوم من الصهاينه على شاشات التليفزيون و حادث اجرامى شع حصل لما انضربت مدرسه بحر البقر و دمنا اللى بيجرى جواه كره اليهود كل دا يخلينا نعرف ان التطبيع حتى و ان كان ظاهرى و ان تم على مستوى الحكومان فلم و لن يقبله الشعب<br />و الحكومان تذهب و لا يبقى الا الشعوب"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143727/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 6
subject = "جينات مصرية ضد التطبيع"
author = "فارس_fr"
posted = "2007-01-11"
text = "من المستحيل ان ننسي من قتلوا وسفكوا دماء ابنائنا وابائنا واولاد عمومتنا من المستحيل ان يتم التطبيع على المستوىالشعبي ابدا لن يحدث ولن ننسى انهم عدوناالاول !! نربي ابنائنا منذ الولادة على كره اسرائيل وننمى فيهم روح الوطنية , كره اسرائيل اصبح فى جينات المصري منذ ولادته .<br />ولكن مايحدث ايامناهذه من محاولات ولن اقول منقله من المصريين ولكنهم اصبحواكثيرين منهم منيتعامل مع اسرائيل امام اعيننا جميعاوبشكل مباشر ومنهم من يتعامل معهم بشكل خفى وغير مباشر وهذااشد خطرا علينا !!<br />\" ولن ترضى عنك اليهود ولا النصاري حتى تتبع ملتهم \" . صدق الله العظيم"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143727/http://masr.20at.com:80/article.php?sid=1430"

