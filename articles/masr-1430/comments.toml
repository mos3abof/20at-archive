text = "ولدي العزيز مصري أشكر لكم صدق مشاعركم الفياضة الصادقة الوطنية..وأشكركم مرة أخرى وبحرارة لأنكم أكدتم لي بتلقائية محضة ودون كلمات طويلة إيمانكم العميق بوحدة الإنتماء والمصير لنا كشعوب عربية. وأعلم حقا أن -وربما لأن السنون علمتني والتجارب المريرة- أن هجومكم الأول على إخواننا العرب، ليس دافعه كراهية لهم ولا إحتقار ولا حسد إنما هو تعبير صادق عن خيبة أمل يحسها كل عربي حر يتوق لوحدة حقيقية من مواقف أقل ما يقال عنها أنها أنانية وغير مسئولة.<br />كل ما ذكرت كان يشغل فكري ووجداني وأنا بميعة الصبا والصحة والشباب، مع التقدم في السن -وهذه سنة الله- تخبو نيران العواطف وتذكو الأسباب العقلانية والتحليل المنطقي، والسعيد منا يسترجع أحداث الماضي بقراءة الحاضر، يفعل ذلك لإستخلاص العبرة لتفادي أخطاءا أعظم خطرا قادمة لا محالة.<br />لو سألتني اليوم عن ناصر؛ هل كان صادقا فيما أطلقه من شعارات وما وضعه من أهداف جليلة داخليا وعلى المحيط العرب: من وحدة ومصير مشترك وإستقلال تام إقتصاديا وعسكريا، وعن كون ما وضع نصب عينيه أهداف قابلة للتحقيق لا بنات الأمنيات، لأجبتك بكل ضمير مستريح بالإيجاب.<br />ولو سألتني أيضا هل ترجم ذلك وأتبعه بخطوات عملية في هذا الإتجاه، لأجبتك أيضا على الفور بنعم.<br />لكن لو سألتني: أكان هو ومن معه فعلا على قدر تحمل المسئولية لما نهضوا به من أهداف جليلة غالية على نفوسنا؟ لأعتذرت لك عن الإجابة بنعم أو لا واضحتين قطعيتين..لأني على أيه حال ومهما إلتزمت الحياد والموضوعية سأقسو في الحكم وأشتط، لعلها 'لعم' ليست لا أو نعم.<br />نحن جميعا ضحايا وجناة في الوقت ذاته، ضحايا لخداع ذاتي متأصل فينا عبر قرون طويلة لم نكن فيها من السادة، ولم يكن لنا من مندوحة غير العيش بعالم وهمي تسير فيه الأمور حسب ما نرجو ونتمنى، هذ<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 21
subject = "الي اخي البطل جمعة الدمرداش"
author = "مصري"
posted = "2007-01-25"
text = "اخي الكريم اشكر حضرتك علي كرم اخلاق وعلم وثقافة حضرتك وارجوك يااخي العظيم الا تنفض يديك فخبراتكم العميقة وعلمكم الوفير اقسم لك ان هذة البلد في حاجة ماسة لكل دقيقة في وقتكم الثمين خسارة يااخي والف خسارة ان تخسر هذة البلد امثال حضرتك الذين ابلو بلاء حسنا في صباهم وشبابهم واصبحوا اليوم بخبراتهم ترياق لكل مشاكلنا اذا استخدمنا هذا الترياق الغالي والنفيث في النهاية ياسيدي اوصل لحضرتك انبهاري واعجابي بخبراتك وحزني العميق في نفس الوقت لماذا رتخسر هذة البلد هؤلاء العظماء؟ لله الامر من قبل ومن بعد والسلام عليكم ورحمتة وبركاتة"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 22
subject = "أخي العزيز مصرى"
author = "جمعة الدمرداش"
posted = "2007-01-25"
text = "أخشى والله أن أقع شر وقعة فيما أحذر منه وأستسلم مرة أخرى لجرعة مخدر خداع الذات المريحة وأعتقد بنفسي حكمة وقدرات ومهارات لاقبل لي بها.<br />ما ذكرته لكم لم يتعدى مراجعة مع ذاتي ومحاسبتها على التقصير الذي كان يمكن تفادية في كل قطاع خضته بحياتي العسكرية والمدنية لا بل والأسرية والأبوية أيضا، لم يسعفني الحظ أبدا ولا الخبرة أن أكون زوجا ولا أبا مثاليا كما أردت ولا قريب مما أردت، ولعلي جعلت بيتي وبدون إدراك ووعي تكنة عسكرية صارمة الإنظباط وألقيت بمهمة تنشأة الأبناء على كاهل زوجتي الصابرة وحدها، ولم يعجبني يوما كل ما قدمت وبذلت.<br />ومع ذلك لم أخجل وأنا أراجع نفسي على مر السنين أن أبرر شدتي بخوفي وحدبي وإشفاقي على أبنائي، لا لم أضرب أحد منهم قط ولا عاقبته، ولكني كنت بعيدا عنهم، ولم أشعرهم بما أحمله لهم من مشاعر الحب والرقة، وعكس هذا كنت مع جنود فرقتي؟ فأي أب هذا؟ والله أشعر بعقدة ذنب قاتلة أنهم لم يتركوني ويصلونني ويبروني ويفخرون بي سرا وعلنا.<br />أقول هذا لكم لئلا تظن بي خيرا وحكمة أود أن تكون لي، ولعلك ولدي تستخلص من مقالي عبرة تنفعك في مستقبل حياتك، وتتعلم تقبل وحب أبناءك وإن أخطأوا وأن يكن إصلاحك خطأهم إستشاريا لا جبريا وأن تدع لهم متسعا كافيا لتكوين شخصياتهم الخاصة التى لا ينبغي أن تكون نسخة كربونية عنك. هذا ما لم أفعله أبدا، وما لن أسامح نفسي لأجله، حتى وإن لم يشعر بضرره أبنائي يوما ولم يشتكو منه، كنت في هذا أنانيا مغرورا جاهلا وأخطره فعلت ذلك مع من أحببت، فهل هذه فعال حكيم عاقل؟ لا والله."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 23
subject = "بطلوا دراما كدابة"
author = "مفروس"
posted = "2007-01-25"
text = "وكانكم يا عينى كنت لوحدكم على الجبهة<br />كان هناك مليون وربع مصرى فى الصحارى المصرية مجندون<br />كان من كل بيت فى مصر شاب وشابين واحيانا ثلاثة يقفون دفاعا عن مصر<br />وكل تعبهم فى الميدان وتعب الشعب من خلفهم فى المصانع والغيطان ليشترى لهم السلاح والطعام<br />نصرهم الذى حققوة سرق<br />ويعاقبون الان على هذا النصر<br />الكلام موجع ولكن يستحسن ان نقف الى هنا"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 24
subject = "الي اخي الدمرداش"
author = "مصري"
posted = "2007-01-26"
text = "اخي العظيم ترددت ان ارد علي مقالك الاخير لقد توقف عقلي وشلت افكاري وتالم قلبي كثيرا لانيي احسست بما انت به وفيه ولكن ياوالدي العزيز حنانيك علي نفسك فإن قلبت بيتك ثكنة عسكرية في يوم ما فهذا شرف كريم وكبير لابنائك وبيتك فأرباب البيوت يقلبون بيوتهم اليوم ثكنة غير اخلاقية يكفي ياسيدي شرفا لابنائك انهم نشاوا في بيئة ملتزمة ومحترمة وانا لااقول لحضرتك هذا الكلام لاطيب به خاطرك ابدا والله لكن هي الحقيقة وحضرتك بالتاكيد تري بعينيك مايجري اليوم في مجتمعاتنا والدي انا ادري ان الانسان منا عندما يتقدم به العمر يذيد اشفاقا علي اولادة ويندم علي قسوتة عليهم ولو كانت معنوية لكن ياسيدي وعلي حسب ماقرات كلماتك واحسست بعمقها لم تكن قاسيا ابدا هذا كان وضعا طبيعيا نذرا لمهمتك الشريفة التي تقوم بها وكان من ضمن بنود فاتورة الثمن الذي دفعتة حضرتك بند اسرتك واولادك ولكن ياسيدي كنت تعوضة في ابنائك من الجنود ياسيدي انا لو من اولادك لكنت من الفخورين بك حتي لوكنت سجنتني في معتقل مدي خدمتك واظنهم انهم هكذا وياسيدي لاتحزن سوف تجد فيهم الخير كلة في دنياهم واخرتهم وسوف يثيبك ويجزيك الله خيرا عنهم وعنا بمافعلتة من اجلهم واجلنا فكن سعيدا ياوالدي كما كنت عائدا من يوم النصر العظيم والسلام عليك ورحمتة وبركاتة"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 25
subject = "بارك الله فيكم ولدي الحبيب مصري"
author = "جمعة الدمرداش"
posted = "2007-01-26"
text = "أثلج والله الساعة ما قرآته من صادق مودتكم وما لمسته جليا من طيب أرومتكم ونقاء عنصركم، فوالله رب العرش لتعرفن الأشجار بثمارها طيبا أو خبثا، وثمرة طيبة أراها فيكم طاب والله أصلها وفرعها وليبارك الله شجرة أنت منها، مس بلسم حديثكم جراح عميقة في الفؤاد، لعلها الشيخوخة وحب الأبوة والرغبة في الأفضل جلعتني كلها أذوب رقة. أصبحت جدا للمرة الثالثة ولا يسعدني مثل قضاء أوقات طويلة مع أحفادي، بل إني أفضل صخبهم ومراحهم البرئ على متابعة كتابة كتبي ومدوناتي عما تعلمت وما خبرت في الفن العسكري. زوجتي تحذرني أن أفرط في تدليلهم، وتقول مازجة وهي صادقة; \" كنت دوما صلبا مع قادتك مشاكسا لهم وتضرب برغباتهم عرض الحائط إن لم توافق قناعاتك، ومع ملائكتك الشياطين الثلاثة لا تملك إلا\" تمام يا فندم، هل من أوامر أخرى!\".<br />رزقك الله بالذرية الصالحة ولدي العزيز، والسلام عليكم."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

[[comments]]
order = 26
subject = "أقرأ خواطرى وأنشرها بالله عليك"
author = "مواطن بسيط ومش عبيط"
posted = "2007-01-27"
text = "سننسى....<br />وسننسى<br />سنمد يدينا للقاتل<br />وسنطلب سلماً<br />لا بأس إن قتل أخانا<br />أو قتل أمنا وأبانا<br />سنعود وننسى<br />سنقبل يده<br />وسنطلب سلماً<br />أحببنا عيش الذل<br />وعشقنا أنات الجرحى<br />ولعقنا دمعات الثكلى<br />ونعود ونطلب سلماً<br />لا نملك غير السلم<br />لا نملك<br />لا نملك حتى الشجب<br />لا نملك غير إدانة كل شهيد<br />وسنقتل<br />سنقتل كل مجاهد<br />وسنطلب سلماً<br />سنرجو عفو الأعداء<br />سنقبل كل الأقدام<br />وسيفعل كل الشعب<br />إن رفضوا فسنذبحهم<br />قربان محبة وسلام<br />عل الأعداء يتركونا أحياء<br />فحب العيش داء<br />ولقد أحببنا العيش<br />حتى لو متنا جبناء<br />قانا(كتبت لقانا الأولى ولم تنشر فأبى الصهاينة إلا أن تنشر مع قانا جديدة!!)<br />أطفال حلوين صغار<br />راجعين من المدارس<br />بيلعبوا فرحانين<br />بدون لا جيش ولا حارس<br />بينهم ولد صغير جميل وأسمه فارس<br />شافوا طيارات<br />شاورولها بالتحية<br />رموا عليهم حاجات<br />أفتكروها هدية<br />أتاريها كانت قنابل<br />تقتل كل حي<br />قتلت صوت البلابل<br />ما فضلش حد حى<br />فينكم يا عرب؟؟؟؟؟؟؟؟؟؟؟؟<br />فينكم يا مسلمين؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />لما أمل حياتنا<br />قتلوه المجرمين؟؟؟؟؟؟؟؟؟؟؟<br />القمة العربية(عبادة الشيطان)<br />فلنرقص رقصة يا ويكا<br />ولنعبد ربنا أمريكا<br />لا غير كلينتون يحمينا<br />نعجات نحن ونتنياهو راعينا<br />لا نرجو غير كراسينا<br />ونرقص رقصة<br />ويضيع الأقصى<br />ولنجلس حول الطاولات<br />ونطنطن بعض الكلمات<br />ولنشجب بعض الشجبات<br />ونعود لنرقص رقصة<br />حول رفات الأقصى<br />ولنحمد ربنا أمريكا<br />لبقاء الكرسى يا ويكا"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

