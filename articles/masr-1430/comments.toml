[[comments]]
order = 8
subject = "لا تصالح"
author = "أحمد رحال"
posted = "2007-01-14"
text = "اللي يقول علينا بتوع كلام و شعر و خطب يبقى مش فاهم .. احنا عايزين نعمل فعل و نغير كل حاجة للصح .. بس حتي الآن ماقدامناش غير الكلام .<br />أقرأ قصيده لا تصالح كاملة<br />(1)<br />لا تـُـصَـالحْ ... !<br />ولو منحوك الذهب ...<br />أترى حين أفقأ عينيك .. ،<br />ثم أثبت جوهرتين مكانهما..<br />هل ترى ... ؟<br />هي أشياء لا تشترى ..<br />ذكريات الطفولة بين أخيك وبينك،<br />حسُّكما - فجأةً - بالرجولةِ،<br />هذا الحياء الذي يكبت الشوق.. حين تعانقُهُ،<br />الصمتُ - مبتسمين - لتأنيب أمِّـكـُـمَـا..<br />وكأنكما<br />ما تزالان طفلين!<br />تلك الطمأنينة الأبدية بينكما:<br />أنَّ سـيـفانِ ... سيـفـــكَ ..<br />أنَّ صـوتانِ ... صـوتـكَ ..<br />أنك إن متَّ:<br />للبيـت ربٌّ<br />وللطفل أبْ<br />هل يصير دمي - بين عينيك - ماءً ؟<br />أتنسى ردائــي - الملطَّخَ - بـالدماء..<br />تلبس - فوق دمائي - ثيابًا مطرَّزَةً بالقصب ؟<br />إنها الـحَـــربُ !<br />قد تثقل القـلبَ ..<br />لكن خلفك عار العربْ ..<br />لا تصالحْ ..<br />ولا تتوخَّ الهربْ !<br />(2)<br />لا تصالح على الدَّمِ .. حتى بدمْ !<br />لا تصالح ! ولو قيل رأس برأسٍ<br />أكلُّ الرؤوس سواءٌ ؟<br />أقلب الغريب كقلب أخيك ؟!<br />أعيناه عينا أخيك ؟!<br />وهل تتساوى يــدٌ ... سيـفهـا كان لكْ<br />بيـدٍ ... سيـفـها أثْـكَـلكْ ؟<br />سيقولون :<br />جئناك ... كي تــحــقــــــن الــدَّمْ ..<br />جئناك ... كن - يا أمير - الحَكمْ<br />سيقولون :<br />ها نحن أبناء عـــمْ<br />قل لهم : إنهم لم يراعوا العمومة فيمن هلكْ<br />واغرس السيفَ في جبهة الصحراء<br />إلى أن يجيب العدمْ<br />إنني كنت لكْ<br />فارسًا ...،<br />وأخًــا ...،<br />وأبًـــا ...،<br />وملـكْ ...!<br />(3)<br />لا تصالحْ ..<br />ولو حرمتك الرقاد<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031740/http://masr.20at.com:80/article.php?sid=1430"

