text = "اخي العظيم ارجوا ان تصلني علي ايميلي بعد اذن حضرتك حتي يكون لي سعة من شرف التواصل والاتصال ومعرفة حضرتك وايميلي هو elkammash_ahmed@yahoo.com الرجاء ارسال اي رسالة حتي يتثني لي كتابة رقم تليفوني والتمس من كرمكم ان ترسل لي رقم تليفون حضرتك المحمول وسواء لبيت لي طلبي او لم تلبي فصورة شخصكم العظيمة والمشرفة قد حفرت في خيالي وفكري فحضرتك النموزج الذي كان دائما بالنسبة لي ولجيلي هو المثل والقدوة والامل الشريف الي ان نلتقي اتمني لحضرتك مزيدا من الصحة والسعادة والعافية والسلام عليكم ورحمتة وبركاتة"
