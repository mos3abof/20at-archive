text = "للاسف اعتقد اننا اعتدنا لا اعلم ان كان فى مصر وحدها ام يشاركها فى ذلك بلاد اخرى ، اعتدنا على ان الاحتفال بالمعاقين يتم باسلوب ساخر مضحك مبكى .<br />فى احدى الجمعيات الخيرية و فى يوم اليتيم تحديدا وجدتهم يحتفلون ايضا بالمعاقين فقلت خيرا و لكن وجدته و حسب قولهم تكريما !!!!!!!<br />فعلى اى شىء يكرموهم ؟؟؟ على الاعاقة ؟؟؟<br />ما اؤمن به ان المعاق لابد ان يعامل معاملة الانسان العادى حتى نخلق منهم اسوياء يعلمون و يقدرون قيمة العمل و الابتكار بمعنى الا يكرموا الا اذا ابدعوا او نجحوا فى شىء ما اما ان يكرموا لمجرد الاعاقة اعتقد انه اسلوب مؤلم لهم اولا قبل ان يكون لنا .<br />و الخطوة الجميلة التى تمت فى السعودية خطوة رائعة فعلا لانهم قدموا لهم عملا كان يعد حلما او دربا من الجنون ان يغوص معاق فى بحر فما بالك بالاحمر .<br />اتمنى ان يكون تعاملنا مع المعاقين تعامل مدروس عاطفيا و عمليا حتى يؤتى ثماره فيهم و فينا ."
archived = "2010-01-06"
