text = "يا للعجب أنا أول مرة اسمع بهذه الحبوب،حتى اني لما أريد أن أسهر للامتحانات أشرب القهوة ،ولها مفعول جد فعال،ففي الليلة الماضية سهرت لغاية 5.00صباحا وأنا في المذاكرة،وكان هذا بفضل القهوة،لكن طبعا لهذا السهر سلبيات كتيرة ،ففي المساء وأنا أجري الامتحان كنت أحس بارهاق كبير ،يعني أن الامتحان يمر في ظروف صحية غير جيدة.لكن على العموم تظل القهوة أحسن بكتير من هذه الحبوب التي تؤتر على سلامة الجسم.وأتسأل لوكنت حصلت على هذه الحبوب البارحة هل كنت سأجرب نصيبي منها لأني كنت بحاجة فعلا للسهر ،فهل كانت ستغريني وأنا في هذا الموقف؟؟؟؟"
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719120724/http://www.20at.com:80/20at/ana-s3ody/6200.html"

