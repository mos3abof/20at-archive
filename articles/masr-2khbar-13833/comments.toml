posted = "2009-10-27"
text = "نتحرك ازاى واحنا مخنوقين ومقطوع نفسنا من شرب المجارى واكل العيش بتاع القمح المسرطن ومش لاقيين خرم ابرة ندخل منة<br />والا علشان انك ابن رئيس جمهورية وبتتحرك وتجر وراك وزراء وكتيبة امن<br />سيبونا فى حالنا واحنا نبقى كويسين<br />روحوا وربنا يسهل لكم ومن ناحيتنا مشكورين<br />نتحرك ازاى قصدكم نتحرك ونسيب لكم البلد ونركب السفن اللى بتهرب الى شواطىء اوروبا ونغرق فى البحر"
