subject = "كلنا مسلمين عرب أو فرس"
author = "عبدالله فايع - اليمن"
posted = "2006-08-06"
text = "السلام عليكم جميعاً<br />أخواني هذه القضية قضية ايرانية داخلية وأعتقد انها تزول قريباً كما أعتقد ان السبب وراء اثارة هذه الفتن بين اقليم الاحواز العربي وبين الدولة الايرانية هو سبب غربي بمساعدة بعض العرب الخونة..<br />اخواني<br />كلنا مسلمون .. عرب .. فرس لا يهم<br />صحيح اننا نعتز بعروبتنا وأن القران نزل عربياً لكن ماذا تفيدنا عروبتنا ونحن نعيش في ذل ومهانة بسبب الغرب وأمريكا واسرائيل يجب أن يكون اعتزازنا الأكبر هو باسلامنا وليس بعروبتنا لان الإسلام أعم وأشمل وأقوى حجة.<br />ماذا نفعل بعروبتنا ويوجد منا نحن العرب الخونة والمجرومين وعملاء بني صهيون الاوغاد .. ماذا فعلت عروبتنا ونحن نغني ونرقص ونلهو والغرب يسيطر علينا بإحكام .<br />أثر علينا الغرب في كل شيء ، ويريد الغرب أن يضعضع حالنا داخليا كما تعلمون من خلال الإعلام الفاسد الذي أصبح يبث من معظم أساليب الإعلام(العربية)، بالإضافة إلى خلخلتنا من الداخل بالفتن والقلاقل والنزاعات بين الطوائف(العربية)، ففخرنا إذن ليس بالعروبة وإنما بالإسلام .. الإسلام هو الذي يًشرف .. الإسلام هو الذي يجعلنا نرفع راسنا عالياً .. الإسلام هو الذي يجعلنا نحارب اليهود ونحرر فلسطين المحتلة ليس لأن فلطسين (عربية) فقط وإنما لانها دولة(إسلامية) .. ولكي نرفع راية الله عالياً.<br />اخواني أرجوا أن لا تنقادوا نحوا الفتن البسيطة والتي تجعلنا ننشغل بها ونتجادل من أجلها وسيصل الحال بنا الى التفرقة والاختلاف وهذا هو حالنا نحن العرب للأسف.<br />أخواني إيران دولة مسلمة حتى لو كانت فارسية .. أنا افتخر بإيران وبأحمدي نجاد ليس لانهم من ايران بل لأنهم مسلمين ويرفعون اسم الاسلام عالياً.. يهددون أمريكا الان امريكا تضع لهم ألف حساب، وما مشكلة الأحواز مع ايران الا بسبب امريكي مئة بالمئة.<br />فعندما قامت الثورة الاسلامية في ايران كم لاقت ايران الأبية من التآمر عليها من الدول الغربية عن طريق بعض (العرب) الخونة بحجة الخوف منها كونها فارسيةوأنها ستحتل العرب لاحقاً. وهذا عذر أقبح من ذنب. لأانهم ساعدوا امريكا والغرب على دولة إسلامية ولا حول ولاقوة إلا بالله.<br />وأما الذين يردون على أساس أن النظام الإيراني فاشل وانه لم يستطع أن يحتوي مشكلة الاحواز فأقول له ماذا فعلت الأنظمة العربية ؟؟<br />الانظمة العربية أسوا أنظمة على الإطلاق<br />خيانة للشعب، تجويع للشعب، جعل الشعب يبحث عن لقمة العيش، وجعله يتوه في متاهات الاعلام الفاسد والرقص والغناء.<br />هذا هو النظام العربي.<br />يعني أن النظام الايراني من أفضل الأنظمة (الإسلامية) فانظروا إلى أي مستوى وصلوا ونحن مازلناعند غبائنا وخلافاتنا التافهة ولم نستيقظ بعد فإنا لله وإنا إليه راجعون"
archived = "2006-11-02"
