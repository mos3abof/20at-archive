[[comments]]
order = 4
subject = "لا تعليق"
author = "أسرة عشرينات / جامعة المنصوره/تجاره انجلش"
posted = "2006-03-24"
text = "السلام عليكم و مساء الخير عليكم جميعا<br />في واحد صاحب تعليق كتب الآتي<br />خبر عااااااجل : اعلنت وكالات الانباء انه تم اكتشاف عمالة حسن نصرالله للمخابرات البرازيلية .....<br />كما تم الإعلان عن شبكة تجسس لفاءدة اسراءيل يقودها خالد مشعل<br />كما يجري التحقيق مع قادة الجهاد حول جراءم تهريب للمخدرات الى قطاع غزة ...<br />مع تحيات اسرة عشرينات<br />بصراحه فعلا لا تعليق...........<br />اولا : مفيش حد بيعلق باسم الأسرة في الموقع .<br />تاني حاجه : الكلام المكتوب في التعليق بيدل ان اللي متبه عقله صغير وفاضي ..<br />فبلاش با عمنا بدل ما نحولك امن دوله وتحقيق وغيره زي ما حصلنا ولا تحب تجرب...<br />مفيش حد يعلق باسم الأسرة والإ هوا او هيا عارفين كويس ايه اللي هيحصلهم ...<br />اما بخصوص موضوع الأهواز فهيا فعلا فكره جميله و مفيده جدا جدا والجزيرة تقريبا بثت موضوع عن الأهواز قبل كده في برنامج تقريبا افتكر اني شفته من سنه ...<br />عموما الله معكم و تمنياتنا القلبيه بالتوفيق ...<br />اسرة عشرينات ....ولاد البلد<br />جامعة المنصوره<br />تجاره انجلش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130216/http://www.20at.com/article2.php?sid=613"

[[comments]]
order = 5
subject = "يا إبنى أنتا تانى"
author = "عابر القارات"
posted = "2006-03-24"
text = "الجدع اللى إسمه عبد الله التونسى ده واضح إنه أهطل حبتين و ده باين من تعليقاته الخايبه و الغير موضوعيه و باين عليه نفسه يبقى عبد الله الفارسى بس مش عارف ... المهم الجدع ده دخل موضوع \"إيران من الداخل \" و برضه عمل الشويتين بتوعه دول و بعدين لا مؤاخذه أخد بالشلوت و هرب بحجة إنه مش هيرد و المهم تخيلت إنى مش هأشوف وشه تانى ألاقيه ظهر فى الموضوع ده و بيهطرش و يقولك خبر عاجل و خيابة عيال ... يا إبنى إمشى مش فاضينلك .... رجاءا من العشرينات أن تنشأ ركن للاطفال و المصرح لهم بمعاملة الاطفال لمثل هذه الحالات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130216/http://www.20at.com/article2.php?sid=613"

[[comments]]
order = 6
subject = "معانا ولا معاهم"
author = "عبدالله"
posted = "2006-03-24"
text = "للأسف تعودنا نحن العرب على نظرية يا معانا يا علينا، والا ختيار بطبيعته يفرض أن من يتم اختياره يتم اختيار على عيبه بكل مساوئه وعيوبه، وإذا وجهت نقدا لهذه العيوب بغية إصلاحها فأنت تصبح علينا وغالبا ما يطبق عليك صفة خائن.<br />هذه ازمتنا نحن وانا شخصيا لا أرى من وجهة نظري ان التعرض لموضوع الأحواز يعد خيانة لإيران حتى لو كان يحمل في طياته تهجم عليه، لأنها حقيقة واقعة بل وتعد إحدى أزمات النظام الإيراني والتفرقة العنصرية التي تحدث ضد العرب الأحواز أمر يعاني منه الأحواز فعلا وليس ادعاء<br />إن النظام الإيراني فشل حتى الآن في احتواء أزمة الأحواز وحل مشاكلهم، بل بالعكس المشاكل تتفاقم، ولذا نسمع بين الحين والآخر عن حدوث اشتباكات او انفجارت في هذه المنطقة بين الأحوازيين ورجال الأمن.<br />وفي النهاية يكفي انهم عرب ولا يستطيعون التعلم بلغتهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130216/http://www.20at.com/article2.php?sid=613"

