[[comments]]
order = 8
subject = "خامنئي يخاطب الأهواز بالعربية"
author = "أكد الزعيم الإيراني علي خامنئي في خطاب ألقاه باللغة العربية أمس للجمهور المحتشد في منطقة دهلاوية في محافظة خوزستان جنوب غرب إيران ذات الغالبية الناطقة باللغة العربية، على شمولية الإسلام في مواجهة مشاريع التجزئة والتفرقة القومية التي تتهم إيران بعض الدول الغربية بالعمل على إثارتها في المناطق ذات الطابع القومي."
posted = "2006-03-25"
text = "وأكد \"أن الحفاظ على الإسلام ورايته العالية مسؤولية جسيمة تقع على عاتق الشعب الإيراني\"، وقال متوجها إلى الاستكبار العالمي \"إن الشعب الإيراني شعب قوي وصلب حنكته التجارب والأحداث\".<br />واعتبر خامنئي منطقه خوزستان النقطة التي أربكت جميع حسابات أعداء الإسلام، وقال إن أمريكا وباقي حماة الرئيس العراقي السابق صدام حسين وعناصر معسكر الاستكبار كانوا وضعوا حسابات أخرى لكن حمية الشباب المسلم في أنحاء البلاد وهمه وعزيمته وإيمان الرجال والنساء في هذه البلاد أحبطت هذه الحسابات."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130216/http://www.20at.com/article2.php?sid=613"

