subject = "اهوازلا یعانی من المذهب بل من الظلم"
author = "ابو المبرقع الاهوازی"
posted = "2006-06-23"
text = "انااسف لخلط قضیه اهواز و سکانها العرب مع المذهب فان مذهبنا لیس الا وهو مذهب اهل بیت النبی ص الذی یسمی عند العامه بالشیعه والرافضه وهذا لا یغیر فی ماساتنا التی یعیشها المواطن الاهوازی کما لا تکون ازمه المواطن الفلسطینی انه من ابنائ العامه بل المشکله هو الظلم والاحتلال وعدم دعم الدول العربیه لا المذهب اخیکم ابو المبرقع الاهوازی"
