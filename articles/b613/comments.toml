text = "الله اكبرعلى هذا الفتح الذي خققته عشرينات حيث اكتشفت مشكلة ( سبحان الله ) حتى cnn وcnbc و bbc الذين اكتشفوا قضايا البوسنة وتيمور الشرقية و البربرو اخيرا دارفور لم يفطنوا بها !!!<br />اظن ان وساءل الإعلام العالمية و من وراءها مجلس الامن و usa و اعداءنا بصفة عامة اصبحوا متحالفين إيران ...<br />ولذلك انا اقترح ان نشكل جبهة من شرفاءنا و ابطالنا الحقيقيين مثل الزعيم بن علي والحكيم حسنى مبارك والمجاهد القذافى و العالم الشيخ عبدالله أل سعود و نعلن الجهاد علي إيران و العملاء مثل نجاد و خاتمي...<br />الله اكبر...."
