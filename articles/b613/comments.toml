capture_url = "https://web.archive.org/web/20061102130216/http://www.20at.com/article2.php?sid=613"

[[comments]]
order = 12
subject = "العرب كانوا دائما عملاء لامريكيا ضد ايران"
author = "عمر عمر"
posted = "2006-04-02"
text = "فقد ذاب الثلج وبان المخفي العراق ودول الخليج تبرعوا بان ينوبوا عن امريكيا ويحاربوا ايران بعد ثورتها الاسلامية فحاربوها ثمانية سنين وتكبدوا تضحيات بشرية ومالية باهظة ثم انهزموا ولم يحققوا شيئا وانتصرت ايران وانهمرت الكرامات الربانية على الجمهورية الاسلامية الايراينة فاعدائها بالامس ( امريكيا والعراق) اصبحوا اعداء لبعضهم فحدث ما حدث في العراق وايران تضع رجل على رجل وتتفرج وعادت لها جميع حقوقها من العراق وربما تنضم العراق بكاملها اليها دون ان تضرب طلقة واحدة ودون ان تقتل واحد !!!! إنها كرامات الله يهبها للمخلصين لدينه وإنها عقوبات الله يلحقها بالخونة المتآمرين .<br />هذه ايران تتقدم شيئا فشيئا لتهزم امريكيا وستسارع امريكيا لاستخدام ادواتها( الدول العربية وخاصة السعودية والخليج) لمحاربة ايران وسيتجاوبون فورا فيحرضون الاقلية العربية والاقلية السنية ليبدئوا بعمليات اجرامية ضد اخوانهم المسلمين في ايران لضعضة ايران وتطويعها لامريكيا فلن ينفكوا عملاء وستذكرون ما اقول لكم وافوض امري الى الله ان الله بصير بالعباد وعلى الله فليتوكل المؤمنون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130216/http://www.20at.com/article2.php?sid=613"

[[comments]]
order = 13
subject = "حاجه غريبه والله"
author = "حمدي"
posted = "2006-04-06"
text = "انا فؤجئت بتعليق القائمين علي موقع عشرينات اللي بيهددوا فيه الاخ عبد الله التونسي انهم راح يبلغوا عنه مباحث امن الدوله<br />مهما كان االلي عمله الاخ عبد الله مكنش المفروض يصدر عنكم تهديد زي ده والمفروض اللي بيعملوا في العمل الصحفي يكونوا اكثر تقبلا واكتر رحابة في تقبل النقد<br />من الاخرين<br />وخصوصا من موقع محبوب لدي مرتاديه زي موقع عشرينات<br />وبعدين عبد الله من تونس يعني بعيد عن حبايبنا ربنا يكفينا شرهم<br />الا اذا كنتم تقصدوا حبيابنا اللي في تونس<br />ربنا يجعل كلامنا خفيف علي الجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130216/http://www.20at.com/article2.php?sid=613"

[[comments]]
order = 14
subject = "الأحواز وسنوات الضياع"
author = "أحمد"
posted = "2006-04-14"
text = "سنوات طويلة مضت على احتلال إيران للأحواز والسكوت والرضوخ العربي هو سيد الموقف، فمثلاً دول الخليج لم تحرك ساكناً منذ 81 عاماً والدول العربية تقف متفرجة تجاه هذه القضية المنسية، وجامعة الدول العربية بقيادة رئيسها عمرو موسى ترفض التطرق لهذه القضية بحجة ( مش عاوز وجع دماغ) طيب إذا لم ينصر الأحوازيين العرب، هل تريدون من إسرائيل أن تساندهم وتمدهم بالمال والسلاح حتى تقولوا عنهم في ما بعد إنهم منبطحون وإنهم متسلقون وتعاونوا مع اليهود ضد المسلمين وتتهمونهم بالعمالة للصهاينة!!<br />يا عرب يا خليجيين ، يا مسلمين ، إيران ليست دولة إسلامية بل هي دولة ضد الإسلام هدفها محو الإسلام وتفكيك وحدة صفوفه، والأحواز العمود الفقري للإقتصاد الإيراني، فأرضهم مليئة بالبترول ، وبها المعادن النفسية، وتربتهم صالحة للزراعة وخضراء، ولديهم آثار عيلامية، وتاريخ قديم، وأنهار ضخمه مقاربة لضخامة نهر النيل، في هذه الأرض المحتلة قضية مشابهة لقضية فلسطين، فبدلاً من التعليقات السخيفة التي تضر ولا تنفع أتمنى أن تتناقلوا الموضوع وتوصلوه إلى سي ( عمرو موسى ) وغيره من الشخصيات السياسية العربية!<br />ودمتم للخير سالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130216/http://www.20at.com/article2.php?sid=613"

