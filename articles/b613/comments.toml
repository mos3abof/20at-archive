subject = "اصدار حکم اعدام 9 من الاهوازیین الذین لمیبلغ عمرهم 20 سنه"
author = "ابو المبر قع الاهوازی"
posted = "2006-06-25"
text = "محکمه ایران اصدرت حکم اعدام 9 معارضین اهوازی باسامی 1- ضامن باوی 2- ریسان سواری 3- عبدالزهر هلیچی 4- جعفر سواری5- عبدالامام زائری 6- محمدعلی سواری 7- ناظم بریهی 8-حمزه سواری 9- جعفر سواری - لا تزید اعمارهم 20 سنه لم یسمح لوکلائهم استماع دفاعیاتهم والجمیع من بدایت الاعتقال فیالسجن الانفراد ولا یسمح لهم القائ مع عوائلهم والشخص العاشر الذی اعطاهم القنابل الصوتیه تبینه من قوات الاستخبارات لانه الان یتجول فی شوارع مدینه اهواز ومسئول حقوق الانسان فی طهران باسم السید میرباقری قام بالدفاع عن هولائ وطلب من رئس محاکم ایران السید الشاهرودی بالافراج عنهم واعادت محکمتهم بحضور وکلائهم واهلهم ولا بد شعبنا الماظل یقوم بمسولیاته ویطلب الافراج عنهم 0"
