[[comments]]
order = 11
subject = "مجوس- شيعة - زواج متعة"
author = "أبو عبد الله"
posted = "2006-03-31"
text = "يبدو أن قادة المجوس فى سعيهم لهدم الإسلام وإخراج أهله منه تظاهروا بالتشيع وأفسدوا ذلك المذهب بالأباطيل والخرافات فكان<br />سعيهم لنشر مذهبهم ليس إلا لصرف الناس عن الإسلام الذى أطفأ نيرانهم وهدم دولتهم انتقاما من الإسلام<br />بغضهم للعرب الشيعة حتى ولو فسدت عقائدهم لأن الإسلام إنما وصل بلاد المجوس عن طريق جدودهم<br />وكأن العلاقة بين شيعة إيران وشيعة العرب ليست إلا زواج متعة محرم"
