subject = "نابليون من جديد"
author = "مصري مدحور"
posted = "2006-06-08"
text = "كان نابليون ذا رأي سديد عندما فرض رسوما (ضرائب) على المواليد وعلى الموتى ودفنهم, لو أراد الدكتور نظيف حل كل مشكلات مصر المالية فما عليه إلا أن يعيد ضرائب الدفن ويطلب مساعدة من الأمن لزيادة عدد الموتى, وربنا يجعل مشرحة زينهم عمرانة"
