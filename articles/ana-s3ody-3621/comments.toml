author = "لينا عبود"
posted = "2007-04-25"
text = "الابتعاث من اجل استكمال التعليم في الخارج قد يكون حلم الكثيرين من الذين اتخذوا قرارات التميز والاجتهاد في حياتهم العمليه والعلميه وقد يكون قرار لآخرين لتغيير الملل والروتين واكتشاف حياة جديده.<br />إن فكرة الكتاب الموضوع من قبل الدكتور عبد العزيز بن عبدالله هي خطوة جيدة ومفيده إن كان القارئ ينوي فعلا التفاعل بأيجابيه ونضج مع حدث سفره مبتعثاً للخارج.<br />بكل الأحوال ليس الطلاب هم الوحيدون الذين تلقى طلباتهم في الادراج وتنسى إلى يأتي أحدهم بقلبه شفقه وينظر في بعضها بل في جميع بلدان العالم العربي والحمدلله يكون العمل الحكومي واستكمال الاجراءات بمثابة المتاهه التي ندخلها رغم عن انفنا متنبأين سلفاً بمدى المتاعب والتأجيلات التي سنملئ بها جعبتنا."
archived = "2009-04-28"
capture_url = "https://web.archive.org/web/20090428134323/http://www.20at.com:80/ana-s3ody/3621.html"

