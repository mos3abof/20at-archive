[[comments]]
order = 12
subject = "العمل الجماعى"
author = "اهم امراض مجتمعنا اننا لا نعرف ان نعمل فى جماعة -كلة يحب العمل الفردى - حتى فى الكرة كل واحد من الفريق عيز هو اللى يسجل هدف بس لكن يتعاون مع الاخر لتسديد هدف -لا"
posted = "2006-12-09"
text = "انا ومن بعدى الطوفان<br />العمل الفردى لا يجدى فى العصر الذى نعيش فية سواء فى الطب او الصناعة او فى الابحاث ويجب غرس عملية TEAM WORK<br />كيف نعلم الطفل المصرى العمل فى فريق يتم ذلك من خلال حصة الالعاب المهملة التى ننظر اليها باستخفاف ويحترمها العالم كلة<br />نعلم ابنائنا العمل فى فريق لتحقيق الاهداف والشاذ عن العمل فى فريق هو شخص فاشل لا يمكن ان يحقق اى نجاح الا بالصدفة<br />نبدأ بالاطفال اذا اردنا ان نتقدم بعد عشرين سنة<br />ففى الدول العربية الذى كان يذهب الى مصر ليشاهد التقدم اصبح يأتى من هناك وعلى شفتية علامات الازدراء مما وصلنا اية<br />هل ننتهى من اعنجهية الكذابة ونعرف الى اى مستوى انحدرنا<br />ليس عيبا ولكن لنحاول ان ننهض<br />واللة المستعان"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 13
subject = "ولو...المبرمج المصري تعبان !!!"
author = "صاحب التعليق الاول والخامس..والعاشر كمان !"
posted = "2006-12-09"
text = "من أخطر مشاكل المصرين في تفكرهم \"أغلبهم في الحقيقة\" هي عدم تقدير الامور بمقدرها...يعني الاخ فارس ساب كل إلي انا قلته ومسك في \"الاعور وسط العمي\" ..طيب يا سيدي أنا آسف ..ولكن بالفعل المبرمج المصري تعبان والمشكلة الاكبر من ده إن المصريين مش مصدقين لحد دلوقت إنهم في بعيد كل البعد عن صناعة برمجيات محترمة وده تقرره الاحصائيات وواقع الحال ...ولو كانو بيستعينو بمصريين في الخليج فده فقط علشان مهام مساعدة محددة في تأسيس قواعد البيانات العربية أما تأسيس شركة برمجة ما على مصريين فده اتحدى اي حد إنه يجيب نموذج واحد لحاجة زي كده...<br />وللعلم حالياً وفي مصر كتير من شركات البرمجة المحترمة ابتدت تستعين بهنود \"الكلام ده في مصر مش في الخليج\" وبأعداد كبيرة كمان ...<br />المشكلة بقى والكارثة الكبرى إننا لسه عايشين في وهم الريادة ...<br />بالنسبة لدسوقي ...بقولك يا بني آدم انا عايش في الامارات بقالي 3 سنين وشغال في شركة برمجة ليها فروع في الامارات وعُمان وقطر...وعايش مأساة وهم المبرمج المصري الذي لا يقهر!"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 14
subject = "أخيرا !"
author = "أولا أنا سعيد جدا لأن أخيرا هذا الموضوع طلع للنور وبدأ الحديث عنه علي الملأ!"
posted = "2006-12-09"
text = "موضوع البرمجة والمبرمجين غاية في الأهمية وتنبع هذه الأهمية من التالي:<br />1- بعض الدول الفقيرة في العالم الأن أصبحت تعتمد علي مصدر الدخل القادم من البرمجيات كمصدر رئيسي جدا للتمويل<br />2- ان تكنولوجيا المعلومات رخيصة التكلفة جدا مقارنة بتكنلوجيات أخري من المستحيل أن ننافس فبهاوبالتالي هي فرصة للمصريين لأثبات ابداعهم وقوتهم من غير عذر (مافيش امكانيات!)<br />3- مجال خصب جدا جدا ودائما فيه نقص في جميع دول العالم للحصول علي مبرمجين كفاءات أو حتي أنصاف كفاءات<br />علي العموم بعد ذكر كل ما سبق يتضح لي الاتي:<br />- نقد كفاءة المصريين في هذا المجال في محلها تماما وبعيدين تمام البعد عن المنافسة مع الهند أو غيرها<br />وبصراحة أنا لا انتقد المصريين لأنهم غير أكفاء! ولكن لأننا أصبحنا غير أسوياء بصورة فائقة!<br />المشكلة في الشخصية المصرية التي أصبحت لا تبالي ولا يتحرك لها ساكن ولا تنتمي لأي شيء! وبالتالي تقدير المسؤلية والجدية في العمل والابداع لا يمكن تصور وجودهم في مثل هذا الشخصية التي تركت نفسها في مهب ريح الفوضي والمعاناة السياسية التي تمر بها البلاد منذ أكثر من 30 عاما....<br />أنا أعمل في هذا المجال منذ أكثر من 10 سنوات.. عملت في الغرب أكثر من مصر والخليج. والأن في مصر.... أتعجب!! وأصاب بالذهول كل يوم فيما أري....<br />أنصاف المبدعين يتركون البلد في أول فرصة!<br />والمبدعين في حقيقة الأمر تركوها قبل الميلاد!<br />والبقية الباقية شخصيات عجيبة تعمل ولا تعمل! علما بأنهم أكثر المصريين رواتب الأن! ولكن لا مبالاة! والعمل الجماعي غير موجود بالفعل علي الاطلاق... والادارة كادارة مصانع السكر والزيت! والمبرمجين دائميين الشكوي في ان النظ<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 15
subject = ".انا مش ضد رايك ولكن ضد انك تفرض على رايك"
author = "فارس_fr"
posted = "2006-12-10"
text = "اخى العزيز \"اللى مش عارف اسمه \" انا ضربت لك مثل بمبرمج مصري واحد انا كنت معاصر له فى عملى وشهد له الجميع بالكفاءة , ومش معنىكلامىان كل المبرمجين المصريين حالتهم جيدة ولكن انا كان هدفى انك , واعتقد ان العمل فى البرمجة عمل ابداعى يحتاج الى اجواء مريحة على كافة النواحى السياسية والاقتصادية والاجتماعية والتعليمية ....... من اين للمبرمج المصري ان يبدع فى ظل الظروف المشينة التى تمر بها مصر منذ 25 سنة ,, يا اخى الكريم ده احتمال يطلع المبرمج من بنجلاديش ده اذا مكنش طلع ويتفوق برده على المصري ,, هل الاجواء فى مصردلوقتى تقدر تخرج مبدعين فى اى مجال ,او مجال ,, الا اذا واحد او اتنين كملواتعليمهم فى الخارج ,,, انما فىهذه الاجواء مستحيل ......."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 16
subject = "الشخصية ام النظام"
author = "دسوقى"
posted = "2006-12-10"
text = "تعليقى على \"أخيرا\"<br />أنا معك فى النقاط الثلاث الذى تتحدث على أهمية صناعة البرمجة.<br />بينما السبب الرئيسى فى أن يترك انصاف المبدعين مصر أنهم لا يستطيعون توفير حياة كريمة فى مصر مع أنهم من اعلى الرواتب فى مصر. (لو فرضنا إن المتوسط فى الراتب 3000 جنية و الشقة المتوسطة ب 70000 و عربية متوسطة ب 80000 و كيلو البصل ب 5 جنية).<br />و مش بس المبرمجين فى مصر هما اللى بيسيبوها, كل المهن أول ما بيلاقى فرصة سفر بيخلع.<br />و المبدعين مابيلاقوش اللى يحتضن إبداعهم و ده اللى قلت ان صناعة البرمجة محتاجاه فى اول تعليق.<br />لكنى ارفض القاء كل المشكلة على المبرمج. البرمجة زى أي صناعة محتاجة عوامل كتير عشان تنهض.<br />و أرفض تعميم إن الشخصية المصرية عندها لا مبالاة و عدم إنتماء ده كلام مش صحيح.<br />و بالنسبة للإدارة صحيح إن فى شركات الإدارة بتاعتها مش كويسة, لكن ده بيختفى فى صناعة البرمجه دلوقتى. الشركات المتوسطة و الكبيرة أدركت أن علم الإدارة من الأساسيات اللى تقوم عليها الصناعة و لذلك كتيير منهم بدأ يدى للناس عندة management training, software engineering. و الدولة فرضت قانون إن الشركات المصدرة للبرامج لازم تبقى CMMI certified.<br />و أعتقد إن المبرمج المصرى لو تعبان ماكانش فى شركات عالمية استثمرت فى مصر زى IBM, EDS, ITWorx و الشركات التلاتة دول شغال فيهم أكتر من 1500 مبرمج مصرى.<br />لو عايزين ننهض بصناعة البرمجة سوء المرمج أو إنه كويس مش هية المشكلة."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 17
subject = "أخيرا"
author = "بالنسبة لقائل \"و أرفض تعميم إن الشخصية المصرية عندها لا مبالاة و عدم إنتماء ده كلام مش صحيح\""
posted = "2006-12-10"
text = "أولا من المستحيل التعميم... ولكن الأغلبية أصبحت هكذا.<br />بالنسبة للأدارة و CMMI أمور شكلية مستخدمة في مصر علي طريقة الفهلوة المشهورة. مستخدمة بلا ايمان بقوتها ... مجرد استخدام شكلي للحصول علي سمعة أفضل أو أسبقية... لا يختلف كثيرا عن طبيب خريج كلية الطب الذي هو شكلا طبيب ولكن في واقع الأمر أساسا فهلوي!<br />بالنسبة للأبداع؟؟ هو فين الابداع ده بالظبط؟؟؟ حتي لو موجود فين الاقيه؟؟ ومين بيحكم ده ابداع ولا لأ!<br />بالنسبة للنسبة والتناسب بين المرتب وسعر الشقة؟؟؟!!! ياأخي الفاضل والعزيز .. في أمريكا الراتب 3000$ وسعر الشقة لا يقل عن 200000$... أنا لم أفهم بعد هذه العلاقة النسبية<br />بالنسبة لقائل : واحد أو اثنين هما اللي كويسين واتعلموا بره!! ده رأي غير موضوع علي الاطلاق... أنا اتعلمت بره ولكني قابلت ناس لم يسافروا للخارج علي الاطلاق ولكن لأنهم مازالو يحترمون ذاتهم وعندهم انتماء والله مستواهم فائق<br />وأخيرا وليس أخرا.... الابداع لا يمكن أن يدخل في معادلة فيها كلمة \"بكام\"!!! ولكن بكام تأتي دائما بعد وجود الابداع في الأصل"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

