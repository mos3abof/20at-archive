subject = "الى ميعرفش يقول عدس"
author = "دسوقى"
posted = "2006-12-09"
text = "يا أخ,<br />من سوء حظى إنى مكنتش شوفت ردك \"الموضوعى\" (اللى شتمت فيه الأخ صباحك سكر) ماكنتش حشترك فى الحوار.<br />و أعتقد إن إسلوب المناقشة \"الموضوعى\" اللى إحنا شايفينه ده هو عامل أساسى فى التدهور اللى عايشين فيه.<br />و اعقد إنك ماحاولتش تدور كويس على صحة كلامك.<br />و ده ينطبق عليه المثل و لامؤاخذة:<br />الى ميعرفش يقول عدس"
