text = "اسالك سؤال واحد وارجواالرد :<br />هل خريجى الجامعات فى شتى المجالات فى الوقت الحالى ,, مش فى زمنك اوزمنى , هل هم على مستوىالكفاءة للبدئ فى اى اعمل ام انهم ومش هقولك كلهم 99% يحتاج لاعادة تاهيل وتدريب ,, هلى التعليم فىمصرحاليا يخرج مبدعين او متميزين فى اىمجال ؟؟؟؟<br />ايه اعلى الكليات فى مصر دلوقتى ,, مثلا طب وهندسة وحاسبات , هلى خريجى هذه الكليات لا يحتاجوا لاعادةتاهيل ؟؟؟؟"
