[[comments]]
order = 7
subject = "بالراحة علينا يا ... صاحب اول تعليق"
author = "فارس_fr"
posted = "2006-12-09"
text = "الاخ صاحب التعليق الاول ,, انت سفهت من قيمة المبرمج المصري جدا واعتقد انك ذكرت انك تعمل فى الامارات ,, معقولة ان الامارات مفيهاش ولامبرمج مصري .. ؟؟ بالراحة شوية على المصري , واذكرلك موقف بسيط حصللى شخصيا مع مبرمج برازيلى واقسم بالله وانا اعمل فىدولةمن دول الخليج ايضا وهذا البرازيلى يعمل معى ,, هذا البرازيلى حديث العهد بالعمل معنا هذا الشخص يقسم بان المبرمج المصري الذى كان يعمل قبله , والذى فصل من عمله بسبب عدم قبوله للراتب الضئيل ,, يقسم هذا الشخص بانه عبقري وبانه محضر شغل ومجهزة لسنوات قادمة ,,, انا صحيح مجال شغلي بعيد عن البرمجة بس مش لازم نقلل من قيمة المصري اوى كده وده اعتراف من مبرمج برازيلى ,, والله المصري مفيش زيه بس وفرله البيئة المناسبة والامكانيات ,,,<br />عايز المصريين يبدعوا فى ظل قانون الطوارئ طب تيجى ازاى ايه ابداع ده ؟؟؟؟ فى السجون والمعتقلات .... يا اخى بدل ماتلوم المبرمج لوم نظامالتعليم الفاشل ولا الحكومة العميلة اللى خربت البلد !!!! مش كده ولا ايه .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 8
subject = "المبرمج المصري أفضل من الهندى"
author = "دسوقي"
posted = "2006-12-09"
text = "السلام عليكم,<br />الأخ العزيز اللى كتب التعليق الأول.<br />أحب أوضح حاجة من خبرتي الشخصية.<br />أنا مبرمج مصري إتخرجت و إشتغلت نت 3 سنيين من كلية الحاسبات. إشتغلت سنتين فى مصر و سنة فى السعودية. 90% من البرامج اللى أنتجتها كانت موجهة لدول الخليج و الأردن.<br />حاليا في دول الخليج الطلب عالى جدا على المبرمج المصرى. أنا أغرف أكتر من 20 مبرمج مصري هنا. و من تعاملاتى الشخصية وجدت مرمجين مصريين شغالين فى تطبيقات البنوك و البورصةو الطيران و السيارات و غيرها.<br />م للعلم إن سعر المبرمج المصرى أكتر بكتير من الهندى. و من واقع خبرتي الشخصية مع المبرمج الهندى, المصري أحسن عنده قدرة على الإبداع أكتر.<br />لو حاولت تدور على خريجى حاسبات حتلاقى أنهم كلهم إشتغلو. فى هيئات الدولة أو شركات خاصة كتيير منها يتبع شركات عالمية زى IBM مثل أو إشتغلو برا البلد زى حالتى.<br />و فى تقديري إن 75% من إنتاج البرمجيات فى مصر موجه للخارج و مش بس للدول العربية.<br />دا مش معناه إن كلو تمام يا ريس. صناعة البرمجة فى مصر محتاجة كتيير. بدءا من قوانين العمل و الضرايب و تطوير التعليم. الى توفير التكنولوجيا (زى الاتصالات و الإنترنت) إلى إحتضان الأفكار الجديدة و المواهب. و الحجات ده هى اللى وصلت الهند و للموقع ده."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 9
subject = "بطلو جعجعة ..وحرقة دم !"
author = "صاحب التعليق الأولاني..والخامس كمان !!"
posted = "2006-12-09"
text = "الكلام موجه لآخر تعليقين<br />1- انا مقلتش ان الامارات او الخليج مفهوش مبرمجين مصرين انا قلت ان المبرمج المصري مش عليه الاقبال إلي على المبرمج الهندي في الخليج ولو استعانو بيه بيكون في بعض المهام للمساعدة في القواعد إلي باللغة العربية وللأسف خلال الفترة إلي فاتت لاحظت إن الشركات ابتدت تستعين بمرمجين من الاردن ولبنان وبالنسنبة للعبقرية من عدمه الموضوع مش موضوع ععبقرية وسلوك فردي حالياً في حاجة او اختراع اسمه العمل الجماعي \"الذي لا يجيده المصريون بالمرة\" وبالنسبة لزميلك البرازيلي اعتقد ان رأيه مبدني وفقاً لأنه اصلاً تعبان والمثل بيقول \"الاعور وسط العمي سلطان\" ...الموضوع مش موضوع تحامل وكره وعواطف كدابة بعيدة كل البعد عن الواقع والحقائق خريطة العمل في مجال البرمجة في العالم كله لأن بالفعل مصر حالياً غير مؤهلة لتخريج مبرمج قوي \"تقول قهر سياسي ولا تدهور التعليم ولا وضع اجتماعي سئ او بنية تحتية متهالكة\" كل ده لا يساعد ولا يساهم في في تواجد انسان متميز مبدع في اي مجال مش مبرمجين بس ...وانتاجنا من البرمجيات دليل على كده كماً وكيفاً بمعنى اننا في مصر معملناش حاجة محترمة نقدمها للعالم \"في واحد اهبل في تعليق فوق بيتكلم عن موقع عشرينيات ولعبة اللنمبي\" والنبي ده كلام ...بقول حاجة نقدمها للعالم مش كلام خايب كله بيدور في اطار محلي بحت ...ده حتى الحاجات إلي بنصدرها للدول العربية بينفعش نصدرها لأوروبا...<br />وبالنسبة للأخ خريج حاسبات ومعلومات أقوله..متخليش تعصبك لمهنتك يطغى على موضوعيتك للنظرة للأشياء ...كلامي عن الهنود مش اعجاباً بيهم ولا كرهاً في المصريين لأن الموضوع مش عواطف وتعصب ..وللعلم انا شخصياً مبحبش الهنود ...المصري نعم اعلى اجراً ولكن مش عشان الكفائة علشان فرق العملة والهندي اقل اجر علشان<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 10
subject = "اسلوبك محترم فى الحوار"
author = "فارس_fr"
posted = "2006-12-09"
text = "اظن برازيلى يعمل فى شركة ارامكو السعودية ,, ليس باعور فى وسط العميان ,, واسال عن ارامكوان كنت لا تدرى عنها ,,,,<br />احترامى لكل مصري شريف محترم يدلى برايه مع احترام لراى الاخرين \"وان لم نوافق على راية فاننا نجعجع\" , ياريت نبتدى الموضوع من بدايته<br />متحملش العيب على المبرمجين اللى مستواهم ضعيف ولكن شوف ايه السبب فى ضعف مستواهم ؟؟؟؟؟"
