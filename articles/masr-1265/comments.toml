order = 0
subject = "اظن ان الخبر غير صحيح"
author = "المبرمج المصري غير مطلوب من الاساس في الدول العربية وغير مبدع في شغله في مصر ومن هنا ارى ان ادعاء ان مبرمجين مصريين يسافرو دول غربية ومعنا كده انها دول اوروبية أو امريكا لتحديث قواعد بيانات في الدول دي معناه ان الخبر متفبرك ومش صح...لأن المبرمج المصري تعبان وغير مبدع ...ويفضل عليه المبرمج الهندي الاكثر قدرة على العمل الجماعي \"الذي لا يجيده المصريون بالمرة\" وقدرة على التعامل مع قواعد البيانات باللغة الانجليزية\"والتي لا يجيدها المصريون في اغلب الاحيان\" والاكثر خبرة \"لأن بلاده بتحترم العلم وعندها سوق تكنولوجيا من اكبر الاسواق في العالم\""
posted = "2006-12-08"
text = "من الآخر الخبر مش صحيح<br />يا جماعة دولة لسة محتفلة بإنتاج اول \"استيكة\" من سنتين هتخرج ازاي مبرمجين لقواعد بيانات إزاي فوقو بقى وبطلوا العنجهية إلي على الفاضي دي !!<br />على فكرة :الكلام ده عن تجربة انا عايشها حالياً في الامارات...المصريين بقى حالهم التعليمي سئ للغاية ومش مطلوبين خصوصاً في تقنية المعلومات وقريباً في المجالات الطبية ...لأن مستوى التعليم في مصر زي الزفت !!"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 1
subject = "تاييد على التعليق الاول و لكن بتحفظ"
author = "صابر المصرى"
posted = "2006-12-08"
text = "انا اقف مع التعليق الاول الذى يتحدث عن حالة المبرمجين المصرين و انها تتجه نحو التدهور و هو امر لا يخرج عن السياق العام للدولة المصرية المتجة نحو التدهور فى جميع المجالات لا يمكننا اغفال احد و خاصة فى المجالات التى ترتبط بالتعليم الفاشل المريض الذى انتج الات لا تملك القدرة على التحليل و الربط و الابداع و هى الامور اللازمة لاختراق سوق العمل فى العالم كله و لكن للامانة و ليس احياء للعاطفة الوطنية , يظل المبرمج المصرى الذى تهيأ له الظروف و الامكانيات على القمة دوما لتميزة بالابداع الذى ليس له حدود و هو مالا يتواجد فى اى مبرمج اخر خاصة المبرمج الهندى و على راى مدير البرامج عندنا لما مبرمج هندى يغلط يقولك مشية و اشترى عشرة مكانة يعنى الهندى لم يتوق على المصرى بامكانيات خاصة فيه و لكن لان المصرى بدأ يفقد امكانياتة و يفقد قدراتة التاريخية و هو الامر الذى يجعل الحزن يملأ قلوبنا جميعا و لو اردنا النظر للموضوع بنظرة شاملة كى لا تجرفنا التفاصيل و نتوه فى طياتها فان تدهور حال المبرمج المصرى شأنة شان تدهو حال اى مهنة مصرية اخرى فى الداخل و فى الخارج مرجعها الاساسى التعليم و مرجعها الثانوى الممارسة و اكتساب الخبرة و كلاهما غير متوافر فى مصر و هى شىء اعتقد ان كل الكلام فيه يقال على قفا النظام الحاكم فى مصر فهو الذى بيده الأمر فى مصر فى كل مناحى الحياة و يخطأ كل الخطأ اى انسان مصرى ايا كانت مهنتة اذا اعتقد انه بعيدا عن السياسة و بعيدا عن تقدير الواقع المزرى لمصر حاليا و بعيدا عن الكلام فى حال مصر الحالي لانه اجلا ام عاجلا سوف يطولة ثعبان الفساد و يلتف حولة و يخنقة اهو او اولادة و هذا الفساد لا يستثنى احد سواء كان راكب عبارة مسكين او مبرمج كمبيوتر صرف عليه ابوة تحويشة عمرة فى الكلية لغاية مايت<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 2
subject = "صباحك سكر ياصاحب التعليق الاول"
author = "المبرمجين المصريين مش في تدهور ياكابتن بتاع التعليق الاول انت"
posted = "2006-12-08"
text = "انت اللى سمعك تقيل انما الخبر صحيح مية فى المية.. ولعلمك المبرمج المصري ازكى من بتاع بره لان اصل البرمجة مهارة وممارسة مش تعليم وحفظ كتب<br />بما انك فى الامارات فمعذور انك مسمعتش عن هنا<br />ولو المبرمج المصري تعبان زي ما بتقول ماكناش عملنا ع الاقل سايت عشرينات ده او مكناش عملنا اول لعبة الكترونية اللى نزل عنها موضوع بوحة<br />صباحك سكر يا استاذ"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 3
subject = "الله يرحم العباقرة"
author = "ممكن يكون في نوابغ من المبرمجين المصريين لكن الموضوع لا يصل ابدا لحد تعميم عبقرية المبرمجين المصريين لأن فعلا مستواهم على ادهم جدا..بالمقارنة بعباقرة الهند ..وده مش كلامي ده كلام أوروبا و امريكا اللي بتستورد العقليات الهندية و بتجيب لهم لبن العصفور لو عايزين لأنهم محتاجين خبراتهم جدا..اما المصري و العربي بشكل عام فقدراته على اده جدا جدا وكفاية عليه يعرف يشتغل على الاوفيس ويدخل على المواقع الاباحية .."
posted = "2006-12-08"
text = "أما للاخ اللي بيقول ان المبرمجين عباقرة بدليل موقع عشرينات ..يعني انت شايف عشرينات حلو اوي كده؟! يمكن شايفه في المضمون مش في البرمجة ..ده الى الان في لينكات مش بتشتغل ودي اهيف وابسط حاجة في المواقع ,,عموماالله يرحم العباقرة"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 4
subject = "الاخ صباحك سكر...انت حمار !!"
author = "الاخ إلي كاتب تعليق بعنوان \"صباحك سكر ياصاحب التعليق الاول \" بالفعل انت حمار ومبتفهمش وعديم الاحساس والشعور...ده اولاً"
posted = "2006-12-08"
text = "ثانياً:انا الي كتبت التعليق الاولاني ولسة عند رأيي في ان المبرمجين المصريين في العموم تعبانيين وحالهم لا يسر عدو ولا حبيب وبالنسبة للمبرمجين الهنود هما بالفعل خلال الخمس سنيين إلي فاتو نتيجة للشغل والاجتهاد وتقبلهم للعمل داخل مجموعة واحدة حصل ليهم تطور غير عادي اقرب للإعجاز وللعلم المبرمج الهندي الجيد حالياً مكانه مش في الخليج لأن الكفائات الهندية في مجال البرمجة بتتشتغل في مكانيين ملهمش تالت والاولوية عند المبرمج الهندي انه يشتغل في الهند اولاً وثانياً اوروبا او امريكا والتعبان بيروح الخليج ومعنى انه تعبان لا يقلل من كفائته وخبرته وجودة انتاجه لإننا لو عملنا مقارنة بين مبرمج هندي تعبان ومبرمج مصري \"من بتوع السيط ولا الغنى\" هنلاقي ان المبرمج الهندي افضل وانتاجة اجود واغزر من عشر مبرمجين مصريين ...<br />الكلام ده عن دراسة واحتكاك دائم بالمجال من خلال تواجدي في الامارات من ثلاث سنوات ...<br />بالنسبة لموقع عشرينيات ...فلا تعليق لأن الموقع برمجته زي الزفت ويلاحظها أي حد بيشتغل في مجال البرمجة...يا راجل ده موقع اسلام اون لاين حاله لا يسر عدو ولا حبيب وده<br />وسلملي على المصري إلي هيفضل طول عمره مصري ..النيل رواه والامن بيجري وراه ...علشان كده لا عارف يفكر ولا يبدع !!!<br />وسلملي على عم نظيف ..عمدة القرية الذكية !!"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 5
subject = "المصريين عمالقة"
author = "لملذا جلد الذات"
posted = "2006-12-08"
text = "نحن شعب عملاق والتعليم عندنا راقى جدا ونفس المقررات الت تدرس فى مصر هى نفسها فى بريطانيا<br />مع الفارق ان الخريج هناك تتلقفة الشركات وتصقل معلوماتة وتزيدة خبرة وهذا هو الاهم اما عندنا فانة يكون عاطلا لينسى كل شيء<br />فى ايام القطاع العام كانت هناك شركات تعلم وتدرب وتخرج وكان هناك المقاولون العرب تفتح مدارس تدريب لحرف البناء المختلفة وكذلك شركات البترول والحديد والصلب والسيارات وغيرها وغيرها000000000000000<br />لو نزلت السوق اليوم لتبحث عن لحام ضغط عال لوجدتة نادراوكذلك الحرف الفنية المختلفة كلها انقرضت لانة لا احد يدرب ويصقل ويعطى خبرة عملية<br />واصبح المصريين يعملون نادلا فى مقهى يقدم الشيشة للرواد فى فنادق الدول العربية وما رايتة حديثا هو دخول فتياتنا هذا المجال واصبحوا يقدمون الشيشة للزبائن<br />الموضوع ليس تعليم انما مرحلة مابعد الشهادة<br />لا تجلدوا الذات - بعد ان تخلصتم من القطاع العام وفى انتظار المثتثمرون الذين لن ياتوا ابدا عليكم الانتظار والدخول فى نوم عميق والحلم باحلام سعيدة<br />واللة المستعان"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 6
subject = "أعرف شركة مصرية تصنع برامج لأمريكا باستمرار"
author = "إبن بهيه"
posted = "2006-12-09"
text = "من غير تحيز ولا حسد ولا أ يحاجه من ده .. أنا عندي قصه واقعيه لشركة بسيطه كانت تعمل في البرمجيات من كام سنه وصدفه نسيب صاحب الشركه سافر أمريكا في مهمة علميه غير الحاسبات خالص ولكنه بالصدفه صادف أن البرنامج الذي يعملون عليه ضعيف حبتين فكلمهم على برنامج أحسن في مصر واتصل بقريبه فأرسل له ومن هنا لضم خيط مع الشركه الأمريكية صاحبة البرنامج الخايب الأولاني .. وبقت تشتري من الشركه المصريه برامج كتير ومازالت .. المصري كبير جدا يا ناس حرام عليكم تظلموه .. مش كفايه ظلم مبارك الواطي الماسوني وعصاباته القذره ؟؟؟<br />إبن بهيه<br />http://shadyforever.blogspot.com/"
archived = "2006-12-17"
