subject = "مأساااه"
author = "احمد"
posted = "2007-01-11"
text = "الحكايه ببساطه ان الحكومات - اللى المبرمجين المصريين سافروا علشان يعملولها قاعدة بيانات - حكومات بتعمل لصالح مواطنيها اما عندنا فالحكومه تعمل لبقاء الفرعون و ابن الفرعون - فمن مصلحة الفرعون ان الشعب ميعرفش اى بيانات"
archived = "2007-01-15"
