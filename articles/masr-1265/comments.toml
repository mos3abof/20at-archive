[[comments]]
order = 20
subject = "تحياتى لصاحب التعليق الاول"
author = "احمد عز"
posted = "2006-12-10"
text = "تحياتى ياكابتن يبتاع التعليق الاول<br />فعلا كلامة مضبوط 100% انا بشتغل هنا فى دبى مهندس دعم فنى فى احدى كبرى شركات الاتصال هنا من 5 سنوات لم ارى مصريا فالح فى مجال البرمجة اصلا<br />فى القسم الذى اعمل بة كل رؤساءى هنود واردنيين<br />كلنا هنا كالاتى 4 مصريين 70 هندى 20 باكستانى 30 اردنى وتلاتة مصريين غلابة<br />طبعا دا الحال فى مجالى شبكات الكمبيوتر فقط<br />اما باقى مجالات الكمبيوتر فلا اعتقد انها تختلف كتيرا عن ذلك<br />المصرى لما بيجى هنا بيفتكر نفسة بيل جيتس وانة الدنيا كلها هاتجرى وراة لكن للاسف الواقع غير ذلك<br />اتمنى طبعا ان يتفوفق المصرى فى هذا المجال لكن الموضوع يحتاج وقت<br />الموضوع عمرة ما كان ام سى اس ايي ولا سيسكو. ولا بكالريوس هندسة الحكاية ان اللى عايز يتفوق يبدأ من الصفرمن غيرما يعيش فالدور<br />كتير مصريين هنا بيجو معاهم بكالرويسات حاسبات وهندسة وشهادات مايكروسوفت وبلاوى سودا لكنهم للاسف بيرجعو تانى من غير نتيجة لانهم غير مدربين التدريب الكافى للعمل مع فريق محترف"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 21
subject = "مبرمج مصري ناشئ"
author = "نصر مصر"
posted = "2006-12-17"
text = "مش معنى ان البرمجه علم انشاء في الدول الغربية ان المصريين مينفعش يبرمجوا، الغرب تقدم بسبب الحضارة الاسلامية، والحضارة الاسلامية تطورت بفضل الحضارة الاغريقيه، والحضاره الاغريقيه تطورت على اسس الحضاره المصرية القديمه، وهتفضل الموجه تلف على الناس حتى النهاية، وده مش لتوفر العقول المبدعة في الحضارات المختلفة، ولكن بتوافر نظام إداره جيد، مصر فيها عقول مبدعة كتير، وليها عقول مهاجرة أكتر بتفيد أعدائنا ومبتفدناش، وده سببه قانون الطوارئ والاستأثار بالسلطة (اللي بتحكم مش السلطة اللي بتتاكل)، فاذا اراد المبرمجون انشاء قاعدة بيانات مهما كانت موهبتهم لن يستطيعوا ببساطة لان الدولة لم تطلب انشاء قاعدة بيانات، لان المسؤليين مشغولين بالسرقة والاستجمام بشرم الشيخ وتوفير عرش امن لابنائهم...<br />كمان التعليم مش مشكلة، انا بادرس برمجه في مصر بس برده بتعلم في أكبر الجامعات الامريكية والاوروبية وانا قاعد على جهازي في البيت، اللي عايز يتعلم كويس هيتعلم، الانترنت لغت كل الحدود..<br />اللي مضايقني من التعليقات دي والكلام ده بلاقية في حتت تانية كتيير، الكلام بصيغة الجمع، المبرمجين المصريين كخه والمبرمجين الهنود جامديين، ياعني اللي قال الكلام ده قابل كل المبرمجين المصريين أو الهنود علشان يجمع، في كل مكان فيه السيئ والجيد، ده شيئ طبيعي، هي بس الاداره.<br />nasrmisr.blogspot.com"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214048/http://masr.20at.com:80/article.php?sid=1265"

