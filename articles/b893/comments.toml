text = "والله ما يقع اليوم لهو مثل ما كان يقع في عهد الحسن الثاني وان اختلفت الظروف .. ولما يموت الملك الحالي سيقوم من ينتسب الى هيآت حقوقية ويطالب بتعويض الضحايا ؟؟ يا ناس افيقوا وطالبوا بحقوقكم في حياة الظالمين واردعوهم بما تملكون من وحدة وصراحة ولحمة.<br />اللهم إن هذا منكر<br />الساكت عن الحق شيطان أخرس"
