order = 3
subject = "في نفس الموضوع"
author = "يعرف بيت الأستاذ محمد العلوي ، عضو مجلس إرشاد جماعة العدل والإحسان ، بمدينة مراكش حصارا بوليسيا تشارك فيه مختلف أجهزة الأمن، وذلك منذ عصر يوم الجمعة 2 يونيو."
posted = "2006-06-05"
text = "وجدير بالذكر أن بيت الأستاذ العلوي يحتضن كما هو معتاد منذ سنوات، مجلسا للنصيحة، وقد قرر أعضاء جماعة العدل والإحسان بمدينة مراكش حضور هذا المجلس ، وذلك تشبثا بحقهم المشروع في الاجتماع، خاصة و أنهم لا يجتمعون إلا على ذكر الله وقراءة القرآن وتدارسه.<br />ولنا عودة إلى الموضوع لنخبركم بأخر التطورات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145631/http://www.20at.com/article2.php?sid=893"

[[comments]]
order = 4
subject = "كل هذا ليمنعوا الناس من ذكر الله!!!!!!!!"
author = "الخلافة"
posted = "2006-06-05"
text = "لاحول ولاقوة الا بالله و حسبنا الله ونعم الوكيل..<br />كل هذا العنف لمنع أهل العدل والإحسان من الاجتماع على ذكر الله ومحبته والتقرب إليه.فمجالس النصيحة تعقد منذ سنوات ،والسلطة بتجسسها الدائم تعلم كل شيء عن برامجها. فما هو الجديد الذي دفعها إلى هذه العنجهية؟ وهل لهذه الدرجة يخشى بعض القابعين على الحكم الاجتماع على ذكر الله؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145631/http://www.20at.com/article2.php?sid=893"

[[comments]]
order = 5
subject = "مفارقة عجيبة"
author = "أبو رحاب"
posted = "2006-06-24"
text = "هذه الحملة المخزنية على أهل العدل والإحسان شجرة فاسدة ممتدة جذورها في أعماق التاريخ لأنها حاكية عن تسلط الهمج الرعاع الجهلةالذين مُُكنوا بوسائل القهر والتخويف وحرموا من مسكة العقل والحكمةضد كل مصلح في الأرض لا يحب الفساد، والتاريخ الإسلامي يتحدث عن ملوك فاسدين حاربوا علماء أو اتخذوهم ندماء لهم إمتاعا ومؤانسة...<br />لكن ... لكن القاعدة الحاكمة أن المكر السيء لن يحيق إلا بأهله، وأهل الصلاح هم الغالبون وأهل القهر والفساد وتاريخهم مرمي في مزابل التاريخ . \" ونقذف بالحق على الباطل فيدمغه فإذاهو زاهق ولكم الويل مما تصفون .\" صدق الله العظيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145631/http://www.20at.com/article2.php?sid=893"
