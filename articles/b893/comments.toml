subject = "اقرؤوا المزيد"
author = "اعتقالات وترهيب مقابل حكمة وثبات"
posted = "2006-06-05"
text = "على الساعة الثانية عشرة زوالا من يوم الأحد 4 يونيو 2006 اعتقلت السلطة الأستاذ عبد الكريم العلمي، عضو مجلس إرشاد جماعة العدل والإحسان، والأخ أحمد الإدريسي، صاحب البيت الذي كان من المفترض أن يحتضن بالأمس لقاء لزيارة إرشادية يشرف عليها الأستاذ العلمي بمدينة الفنيدق، ليتم إطلاق سراحهما بعد حوالي ساعة .<br />وبحضور مختلف الأجهزة الأمنية احتج الأستاذ العلمي على ما كان يوم السبت من عنف مخزني في حق أعضاء الجماعة ، وتساءل عن أسباب هذا الأسلوب العنيف في التعامل مع جماعة قانونية، مذكرا أنه كان قبل أيام في لقاء بنفس المدينة حضره حوالي 600 شخصا، ولم يكن هناك أي تدخل، ولو من قبل شرطي واحد، فكان الجواب : \"هي أوامر من فوق\".<br />وفي سابقة غريبة طلبوا من الأستاذ العلمي مغادرة الفنيدق والعودة إلى مدينة سلا حيث يسكن، فرفض الأستاذ العلمي بقوة ، واعتبر ذلك طلبا جائرا يتنافى مع كل القوانين والأعراف.<br />وكنا قد أشرنا في خبر سابق أن المخزن يأبى إلا أن يواجه صبر جماعة العدل والإحسان وثباتها بمزيد من العنف والوحشية . هذه المرة في مدينة الفنيدق حيث اعترضت القوات المخزنية، التي كانت مدججة بمختلف أنواع العصي والهروات، سبيل أعضاء من الجماعة، كانوا في طريقهم إلى حضور لقاء بمناسبة زيارة الأستاذ عبد الكريم العلمي ، عضو مجلس الإرشاد، لهم. وبعد محاولات عنيفة يائسة، انطلقت منذ حوالي الخامسة مساء من يوم السبت 3 يونيو2006 ، تمكن الإخوة من الوصول إلى البيت ، الذي كان من المفترض أن يحتضن اللقاء، إلا أن السلطة منعتهم من الدخول ، فما كان منهم إلا أن وقفوا أمام البيت، متشبثين بحقهم في الاجتماع. كل ذلك وسط حصار بوليسي شاركت فيه كل القوات المخزنية. و قد استدعي صاحب البيت، في حوالي الساعة الخامسة مساء، من قبل البوليس للتوقبع على التزام بعدم استضافة أهل العدل والإحسان في بيته إلا أنه و إسوة بإخوة كثر رفض وبشدة.<br />وما أن شرع الأستاذ العلمي، من شرفة البيت ، في كلمته لتهدئة الإخوان وعموم المواطنين الذين اجتمعوا احتجاجا على مشاهد الترهيب والترويع حتى انطلق العنف المخزني من جديد دون تمييز بين الحاضرين، ودون سابق إشعار. عصي وهروات تنهال على الأجساد، وضرب وركل وشتم في حق عزال يرددون بأعلى أصواتهم حسبنا الله ونعم الوكيل، حسبنا الله ونعم الوكيل... وبعد فصول الضرب كانت مطاردات ترويعية لعموم المواطنين. الأمر الذي خلف استياء كبيرا لدى سكان الحي ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145631/http://www.20at.com/article2.php?sid=893"

[[comments]]
order = 1
subject = "بلاغ عاجل من الهيأة الحقوقية لجماعة العدل والإحسان"
author = "مغربي غيور"
posted = "2006-06-05"
text = "تعرض الأستاذ هشام الزياني من هيئة المحامين بتطوان، لاعتداء شنيع من طرف عناصر الأمن بأمر من السلطات المحلية، و ذلك بمدينة الفنيدق، الواقعة بالقرب من مدينة تطوان شمال المغرب، و ذلك زوال يومه الأحد 04/06/2006، في الوقت الذي كان أمام باب بيت أحد معارفه هناك، حيث وجد عناصر الأمن تحاصر البيت المذكور و تمنعه من ولوج البيت. و حين تقدم إلى المسؤولين بالمكان معرفا بصفته و مستفسرا، بصفة سلمية و لبقة كما هو معهود من هيئة الدفاع، عن سبب هذا المنع الماس بحرية من حرياته الأساسية، فوجئ برد الفعل العنيف جدا لعناصر الأمن الذين انهالوا عليه بأقذع النعوت ثم شرعوا في الاعتداء عليه بالعنف.<br />هذا الاعتداء الذي مس هيئة الدفاع، و أسرة القضاء، لا يمكن أن يفسر إلا برغبة السلطات العمومية في تحييد كل دعاة الحقوق و الحريات، و إسكات كل صوت حر يندد بالانتهاكات الجسيمة التي تطال الموطنين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145631/http://www.20at.com/article2.php?sid=893"

