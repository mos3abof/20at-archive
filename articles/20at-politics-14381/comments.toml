text = "ان رئيس الوزراء البيرطاني الاسبق توني بلير كان ومازال هو ودول اوروبا وامريكا وبعض دول الخليج الفارسي هدفهم الاول والاخير هو تحقيق الاستقرار والامن للشعوب التي يحكموها وفي سبيل ذلك يجب ازاله اي عقبات لتحقيق هذا الهدف فالغايه تبرر الوسيله وانا اؤيد هذا الرايء وهذا الهدف لانه مهما توفرت اسباب رفاهيه العيش الكريم لاي مواطن علي سطح الارض لا تساوي شيء علي الاطلاق مقارنه بهدف الامن."
