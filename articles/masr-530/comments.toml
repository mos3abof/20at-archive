[[comments]]
order = 0
subject = "صاحب كلمة الحق وائل الابراشى"
author = "شهد"
posted = "2006-06-19"
text = "لماذا كل هذا الظلم هل ما اقترفة وائل الابراشى هو انة قال كلمة حق اننى اعلم منذ فترة انة سوف يتم القبض علية بسبب شجاعتة وعدم خشيتة من رفع كلمة الحق اعلم انة مصيرة مثل نعمان جمعة و ايمن نور قضايا ملفقة حقا انة الظلم الى متى نسكت الى متى نرى الظلم البين ونستكين اننى حزينة من داخلى هل استعبدنا فى بلادنا بسبب الحاكم الفاسد ارجو من الشعب ان يثور ان يقول كلمة حق ان نتكاتف كى تعلو راية الحق لكى نتتحرر من الظلم والاستبعاد"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621212655/http://masr.20at.com:80/article.php?sid=530"

