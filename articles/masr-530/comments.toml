author = "فى الوطن الذى تكبل فيه الحريات"
posted = "2006-06-19"
text = "فيحاكم صاحب الرأى الذى يحاول كشف الحقائق أمام محكمه الجنايات<br />و الذى أغرق اكثر من الف انسان من فقراء هذا الوطن يحاكم امام محكمه الجنح<br />يكون مجرد الحلم<br />تــــــــرف<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأأأأه يــــــا بـــــلــــدى"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621212655/http://masr.20at.com:80/article.php?sid=530"

