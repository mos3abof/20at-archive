subject = ""
author = "عمرو المنسى"
posted = "2007-05-17"
text = "مشكور على مجهودك ياستاذ احمد فاهل هذه القرية يتميزون بالكرم والاخلاق والحب والطيبة فامنهم الفلاحون والعمال وغيرهم من المواطنون البسطاء فهؤلاء خير هذه القرية الصغيرة فيوجد عادت وتقاليد تعنى عند البعض بالدقة القديمه فانا اعشق هذه العادات واحترمها كل الاحترام وكل لما ابتعت عن هذه القرية كلما اشتقت لها اكثر تحياتى وتقدرى الى الاستاذ احمد بلال على هذا المجهود وتحياتى لكل العاملين بالموقع"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726002032/http://www.20at.com:80/masr/7eta-mn-baladi/5713--qq-.html"
