text = "طبعا انا عرفت انت بببتكلم عن منطقة اية بالضبط لأنك وصفت تللك المنطقة بكل ما يمتاز بها اهل بمنطقتها وواضح مجهودك قوى ويكفى انك من تللك المنطقة حتى تكون تللك البقعة اجمل بقعة من بقاع المحلة الكبرى"
