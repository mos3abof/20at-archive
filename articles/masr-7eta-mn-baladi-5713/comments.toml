author = "أرابيسك"
posted = "2007-05-04"
text = "رغم انى ابن مدينه و عماتر و تمدن و حياه المدن اللى مليانه عربيات و مترو و اتوبيسات و نوادى و زحمه و ناس مش بتبص للى جنبها<br />الا انى طول عمرى بحب الريف و الفلاحين و بحترمهم و بخترم لهجتهم و مصطلاحاتهم<br />رغم انى بصراحه اعتقد ان صعب اعيش هناك و مش هاستحمل اسبوع<br />لكن بحبهم و بحب الرجاله الكبار و الجدات و حكاويهم<br />و كفاية طيبه قلبهم ودى عن تجربة شخصية فى قريه ما فى الشرقية"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726002032/http://www.20at.com:80/masr/7eta-mn-baladi/5713--qq-.html"

