text = "حلو اوى ، واول مرة اقرا لك وتكون طريقة سردك ممتعو وتلقاية الى هذا الجد<br />تسلم ايدك، وضحكة الحاجة حسنة، والصورة حلوة اوى"
archived = "2009-07-26"
