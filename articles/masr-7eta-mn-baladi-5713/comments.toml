subject = ""
author = "quortba"
posted = "2007-05-03"
text = "علي فكرة يا عم احمد انا متابع مقالات الاخوة في البلد منذ فترة طويلة جدا واحيانا بعجب بكتابات قيمة لشباب واعي مثقف قادر ان يصنع من الكلمة شمعة تشعل في ظلامنا الدامس ال للاسف بدا يحوم حول شوارعنا وفي عقولنا وداخل افكارنا .. وبحيك علي الموضوع وان كنت بحي فيك احتفاظك لاصلك وكرم اخلاقك في رد الجميل للشارع ال تربيت فيه وسلامي لك ولكل الاخوة المحلاوية الجدعان … وربنا مع الاخوة المحلاوية عمال المصانع في اضرابهم حتي تعود الحقوق لهم … شكرا لك ولكل الاخوة ال معك وان كان لي ان اعلق علي الشكل الجديد للموقع فأنا افضل الشكل القديم وانفصال ولاد البلد عن عشرينيات علاوة علي المقالات الاخري التي كنا نقرأها من الجرائد المختلفة وهي تتوسط الصفحة الرئيسيه … ع العموم لك مني كامل التحية ولااحترام والسلام عليكم ورحمة الله وبركاته"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726002032/http://www.20at.com:80/masr/7eta-mn-baladi/5713--qq-.html"

