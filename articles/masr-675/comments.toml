text = "بجد والله انا مكسوفى انى عربى وكمان مكسوف اكتر انى مصرى وخاصة فى عهد الرخاء والحريات عهد السيد الرئيس<br />والله يرحم الزعيم مصطفى كامل لما قال ان لم اكن مصريا لتمنيت ان اكون مصريا<br />تعال شوف ياعم مصطفى المصرى عامل ازاى<br />وان لله وان اليه راجعون"
