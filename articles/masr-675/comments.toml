[[comments]]
order = 2
subject = "هل هذه هى مصر"
author = "ابو اسامة"
posted = "2006-07-19"
text = "هل هذه هى مصر اكبر بلد عربى لقد حزنت كثيرا عندما رايت المظاهرات فى جميع انحأ العالم بالألاف وعندنا بالعشرات الى هذا الحد بلغ بنا الجبن ونقص الدين اين مصر<br />ذات الدور الريادى الذ نصر كل الشعوب العربية خلال مقاومتها للأستعمار لقد اصبحنا مستعمرين داخليا بهذه الجنود الجاهلة والمتخلفة من الأمن المركزى<br />ولقد اصبحنا مستعمرين ايضا بالمنافقين<br />وممالئيى السلطة الذين يتحدثون عن العقل<br />والحكمة التى يتمتع بها الحكام العرب<br />فأذا كانت الحكمة والعقل ستؤدى بنا الى الذل فالى الجحيم هى واصحابها ومن يناصرها<br />الى متى صمتك يا مصر تكلمى لكى يسمعكى الجميع لقد اصبحنا عرايابلا حياء لقد ماتت فينا الرجولة واصبحنا نرتدى ثوب الخزى و<br />العار فالى متى الصمت حتى الأنهيار لقد انهارت عندنا كل القيم ولم يعد عندنا اى<br />كرامة بين الشعوب العربية فقد بددها هذا الحاكم العقلانى الذى باعها وهو يبيع بلده<br />هو والخونة من امثاله الذين سلموا مصير<br />لبنان الى اليهود.<br />الى بيروت<br />بيروت يا بيروت باعوكى يابيروت<br />اقسموا على التوراة واللهوت<br />بان الحر فى زمن الجبن سوف يموت."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721141756/http://masr.20at.com:80/article.php?sid=675"

[[comments]]
order = 3
subject = "إرحموا عزيز قوم ذل"
author = "مصرى وبس"
posted = "2006-07-19"
text = "هذه الرسالة أوجهها لكل ذى ضمير حىّ وعقل مستنير أين هو التكافؤ فى الحرب ضد إسرائيل وما هى النتيجة لقد تشرد مئات الألاف من المدنيين اللبنانيين بدلا من هذه التظاهرات المنددة بالهتافات ضد إسرائيل وأمريكا ومصطلحات المؤامرة فكان من الأفضل والأعقل أن توجه لحزب الله الذى لم يع ماهو قائم به إنه أراد أن يستعرض نفسه وقوته فى وقت تحتاج فيه لبنان إلى كل لبنانى يساهم فى خروجها من محنتها بعد رحيل الحريرى وتجمع أحزاب المعارضة ومواجهاتها مع الحكومة من أجل التغيير والإصلاح من أجل مستقبل لبنان البلد الوحيد فى الشرق الأوسط الناطق بالعربية الذى به حريات عدة فى مجالات مختلفة ونزاهة الانتخابات أيضا شعب يستحق الإحترام لكن لم تستطع بعض الدول مشاهدة لبنان تنمو وتسمو وتسير فى الطريق الصحيح نحو الحريات فكيف وهى التى عاشت مسيطرة عليها صارت تشجع حزب الله على القيام بعملياته وإكتفت هى بدور المتفرج عن بعد والنتيجة كانت ضحايا مدنيين ليس لهم أى ذنب...وربما كان الذنب ذنب الله الذى أسس له حزب بإسمه وبدلا من أن يسانده تركه فريسة للآلات الإسرائيلية اللهم اذا كان الله برئ من هؤلاء الذين يدّعون الجهاد بإسمه فرجاء أيها العرب أو المستعربون إرحموا عزيز قوم ذل"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721141756/http://masr.20at.com:80/article.php?sid=675"

[[comments]]
order = 4
subject = "عاجزون عاجزون الى تل أبيب منبطحون"
author = "عابر القارات"
posted = "2006-07-19"
text = "أنا لا أريد أن أثبط الهمم و أحبط المتحمسين من الشباب الواعد الذى فاض به من القهر و الاستبداد و الخيانة و على القل هم أفضل حالا من الغالبية الصامتة التى فضلت درأ الشر عنها و المشاهدة من بعيد أو عبر موقع عشرينات و أقول كيف نواجه إسرائيل و نحن لا نستطيع مواجهة أنفسنا و كيف سنحرر لبنان و ندرأ عنه شر أشرار البرية اليهود و نحن لا نقوى على درأ الشر عنا و تحرير أنفسنا فأنا أعتقد أن لبنان بما فيها و ما عليها و ما يحدث لها أحسن حالا مما نحن أنا فيه و إن كنا نرثى لحالهم قيراطا فيجب أن يرثوا هم علينا 24 قيراط فهم يواجهون عدوا خارجيا بالمقاومة و الجهاد و نحن عدونا من أبنائ جلدتنا فما عسانا نحن فاعلين به!! هم سيبنوا بلدهم مرة أخرى و قد فعلوها قبل ذلك وقدت دمرت فى لحظات و سيفعلوها ثانية و سترجع لبنان كما كانت فهم عندهم الإرادة!!! أما بلدنا فقد دمرت على مدار سنوات و سنوات و ماتزال تدمر و تنهب و تباع و لا أدرى كيف ستعود ناهيك عن كيف تتقدم!! كيف ينصر سجينا أخاه السجين كيف يساعد العاجز أخاه العاجز كيف يعز الذليل أخاه الذليل!!! و لا أقول إلا لا حول و لا قوة الا بالله"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721141756/http://masr.20at.com:80/article.php?sid=675"

[[comments]]
order = 5
subject = "حتى الشعوب متواطئة"
author = "هند(المغرب)"
posted = "2006-07-20"
text = "لقد اتبتنا نحن الشعوب اننا لا نفعل شيء سوى البكاء على الأطلال. فلمادا نخاف من حظر التظاهر، هل لو خرج الشعب كله الى الشارع تستطيع قوات الامن القضاء عليه؟ ادا لم تقدرو على التظاهر الآن فكيف ستمنعون ابن الرئيس من الحكم فيما بعد؟ هم يحاولون غسل عقولكم بدون اي مقاومة منكم ليس انتم فقط بل نحن المسلمين جميعا.<br />على العرب و المسلمين ان يقومون بثوٍّة عامة على جميع الحكام. يجب ان يتحرك الجميع، فسراخ العشرات هنا وهناك غير كاف. الا نشعر بالخزي و بالعار مما يحدث، هل حزب الله هم اخر الرجال المحترمين؟ هل دماءنا هي ارخص شيء في هدا العالم.حتى نحن نشارك في قصف لبنان و فلسطين بالسكوت و الخمول و شراء البضائع الامريكية و الصهيونية. ان دماء اخواننا المسلمين في لبنان و فلسطين و العراق و افغانستان ..... في رقابنا جميعا. و سنسئل يوم الحساب مادا كنا نفعل ولن نجد جواب. فهناك من يتفرج على هيفا و روبي! وهناك من يبحث عن مواقع الجنس في الانترنت! وهناك من غيب عقله بتعاطي المخدرات! و الباقي يتفرج على ما يجري في سكات. انه التواطئ لقد انتقلت الينا العدوى من حكامنا."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721141756/http://masr.20at.com:80/article.php?sid=675"

