[[comments]]
order = 24
subject = "الى السلاح"
author = "عبد العزيز"
posted = "2006-07-21"
text = "الأخوان \"مصرى و مش بس وأبو عمر\" أحسنتما الرد جزاكما الله خيرا. التافه ده بيهددنا إنه سيعبد الأصنام..بركة يا جامع..هو الإسلام ناقصه ربش وحوش وقرف..ياريت هو وكل الخلايجة اللي على ملته يعلنوا صراحة عن مجوسيتهم ووثنيتهم. صاحبنا أنا متابعه من الأول وأشم ريحته من بعد سنة ضوئية..وسيان إن سمى نفسه 'مصري مقيم بدبي' أو 'أبو شريف' أو 'جون' أو كيرلس..الخ ريحته بتدل علبه.<br />المشكلة مش فينا إحنا دي في الصهاينة..همه مش راح يسيبونا في حالنا مهما إحنا وادعناهم ومضينا معاهم معاهدات وصلح وهما بنص القرآن لا عهد لهم ولا ذمة قال تعالى\" او كلما عاهدوا عهدا نبذه فريق منهم بل اكثرهم لايؤمنون \". فهم فى صراعهم مع المسلمين لا يلتزمون بمبدأ ولا يعترفون بقانون ولا يراعون<br />للمسلمين حرمة أو يلتزمون بعهد أو ميثاق وهذا أمر قد حرصت آيات القرآن على بيانه فىأكثر من موضع فى كتاب الله تعالى:<br />{إن يثقفوكم يكونوا لكم أعداءً ويبسطوا إليكم أيديهم وألسنتهم بالسوء وودوا لوتكفرون} [الممتحنة: 2].<br />{كيف وإن يظهروا عليكم لا يرقبوا فيكم إلاً ولا ذمة يرضونكم بأفواههم وتأبى قلوبهم وأكثرهم فاسقون. اشتروا بآيات الله ثمناً قليلاً فصدوا عن سبيله إنهم ساء ما كانوا يعملون لا يرقبون فى مؤمن إلاً ولا ذمة وأولئك هم المعتدون} [براءة: 8 - 10].<br />في وقت يحثنا العملاء الكفرة من الحكام وكلابهم على نبذ السلاح والجهاد يتسلح الصهاينة كل دقيقة بأحدث آلات الدمار..فلمن يعدون عدتهم ياسادة لأوروبا وأمريكا أم لنا؟ لنستعد ولنفيق ونستغفر الله من رجس الشيطان السادات وشاكلته من الكلاب..الى السلاح يا أمة محمد."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721141756/http://masr.20at.com:80/article.php?sid=675"
