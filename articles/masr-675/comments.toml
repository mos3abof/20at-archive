subject = "هتروح من ربنا فين يا مبارك"
author = "عمار"
posted = "2006-07-20"
text = "هتموت يا حسنى هتموت --- وهتقف ادام ربنا وهيسألك عن الزل الى خليت المسلمين فية -- اعمل حسنة فى حياتك قبل مماتك -- واعلن الجهاد -- عارف اية الى هيحصل؟ --- هتحول شباب مصر التافة إلى خير جند الله --- انويها بس هتلاقينا كلنا بعد ربنا معاك --- ومتخفش - متخفش --- احنا عايزين حاجة من اتنين -- اما نعيش بكرامة وعزة الاسلام او نموت شهداء ونرتاح منك وترتاح منا"
