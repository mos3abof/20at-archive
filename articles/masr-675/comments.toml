[[comments]]
order = 11
subject = "نعيما يا مصرى وبس"
author = "مصري وبس كس أمك يابن المومس والشاذة خلقيا وجنسيا وإجتماعيا..فيابن اللي مايعجبها غير بتاع الحمار والفيل علشان على مقاس كسها وطيزها وبقها..إن كان اللي بيركبوك في دبي..زبارهم ضعيفة..تعاله هنا وأنا مستعد أنيك وكل اللي زيك."
posted = "2006-07-20"
text = "مين يابن اللبوة اللي تملي مخلينا عمرنا مانبقى جاهزين لمعركة مع إسرائيل نكون فيها على جانب من التوازن؟ وإن كان من سنة سبعة وسبعين لغاية النهارده وبكره ولسه بنقول بنبني القوات وبنستعد -لو صدق الهجص- إمتى حنجهز؟ وأمريكا اللي بتضمن تفوق إسرائيل علينا كل العرب راح تسمح لينا نجهز؟ وبإيه ياكس أمك؟ بريحة بتاع أمك المعفن كسلاح بيولوجي؟<br />يرى الجبناء أن العجز حلم******وتلك خديعة الطبع اللئيم<br />وكل شجاعة في المرء تغني***ولا مثل الشجاعة في الحليم<br />وبعدبن إنت كيهودي أحرم عليك إستخدام كلمة الله جل جلاله..إستخدم يهوة يا صهيوني مقيم بدبي."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721141756/http://masr.20at.com:80/article.php?sid=675"

[[comments]]
order = 12
subject = "لحد امتى هنفضل نخاف...؟؟"
author = "أبو على"
posted = "2006-07-20"
text = "لحد امتى هنفضل جبناء...؟؟<br />لحد امتى هنفضل نخاف...؟؟<br />الريس فى تصريحاتة دايما يقول اننا منعرفش يعنى اية حرب...و ان الحرب هتخرب البلد و هتدمر الاقتصاد..<br />أحة..<br />هو فين الاقتصاد دة..؟؟!!!<br />و حتى لو افترضنا ان عندنا اقتصاد قوي يتخاف علية...برضة دى مش حجة يا ريس..<br />ربنا بيقول فى كتابة الكريم: (و أعدوا لهم ما ستطعتم من قوة)<br />ربنا بيقول (ماستطعتم)<br />و اللة العظيم انا متأكد ان لو مصر أخذت أول خطوة...هتدخل معاها بلاد كتير عربية و غير عربية...<br />لحد امتى هنفضل نتفرج...؟؟<br />العرب و المسلمين أصبحوا اضحوكة العالم كلة..<br />دمنا بقى مية..<br />لحد أمتى هنفضل نخاف...؟؟"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721141756/http://masr.20at.com:80/article.php?sid=675"

[[comments]]
order = 13
subject = "إلى صاحب تعليق نعيما يا مصرى وبس"
author = "مصرى وبس"
posted = "2006-07-20"
text = "سعدت جدا بعد قراءة تعليقك وكنت تتوقع بالطبع أن أرد عليك ولكننى سأكتفى فقط بأن يقرأ تعليقك كل المشاركين فى هذا المنتدى لقد سمحت لنفسك بالتلفظ بأبشع الألفاظ بالرغم من علمك مسبقا بأن هذا المنبر الحر يشارك فيه اناس محترمون وسيدات أيضا أفرحت بنفسك الآن والجميع يقرأتعليقك ولكنها عادة كل الشعوب الشرق أوسطية الكلام واللسان والتهجم على الغير وإسناد الضعف والتخاذل إلى الحكام والمؤامرات الصهيونية والأمريكية لو كنت مكانك الآن لحطمت جهازى والذى يدخل في كل جزء منه سوفت وير أو هارد وير صناعة امريكية وربما كانت شركات المساهمة الأكبر فيها للصهاينةفهيا أعد الجيوش وأعلن الجهاد على اليهود أحفاد القردة والخنازير ومم نخاف فلقد أسس البشر حزب ونسبوه لله وهو القادر العليم الذى يستطيع أن يمحو إسرائيل بجيوش من الملائكة ولكن ربما غير رأيه لسبب ما أو أجل هذا الأمر لوقت مناسب بعد أن تنتهى لبنان ... إعلم أيها الغبى أن الإله الواحد القوى لا يسمع لأمثالك من الغوغاء كذلك من اليهود أيضا فأنا أتعجب على شاشات الفضائيات التى تنقل لنا كل من الطرفين يدعى الجهاد والصلاة أثناء القتال أرفض أن يكون إلهنا واحد فإن لم يكن هناك غير إله متعطش للدماء فلن أعبده وسأتجه إلى الأصنام و أيام زمان ... سامحنى الله وغفر لى من أجل خروجى عن شعورى بسبب أمثالك من البلهاء"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721141756/http://masr.20at.com:80/article.php?sid=675"

[[comments]]
order = 14
subject = "صح يابو علي"
author = "ينور عليك يا بوعلي ده الكلام ده حصل في إكتوبر والعرب ماقصروش منهم مين ساهم بالمال والأبطال والسلاح والعتاد زي العراق وكانوا من أول طلعة جوية معانا لغاية ما السادات سرب خططنا لكيسنجر وحصلت الثغرة وخسرنا أكثر ما كسبنا، ومنهم من ساهم بمال وفير زي السعودية وبلاد الخليج اللي معظمه وضعه السادات في حساباته الخاصة. وليبيا بالذات ومجنونها زي ماالسادات بيسميه ساهمت قد دول جميعا ودفعت ثمن100 طيارة ميراج إشترتها لينا من فرنسا وعتاد كثير من روسيا. الغريب إن الكلب السادات بعد كده طلع يردح للجميع ويقول \"بترولهم غلي سعره بدم أولادي!\" إبتزاز، طب هما طلبوا منه يحارب؟ ده جزاءهم..وجزاء ليبيا كان أفظع كان عايز يحتل ليبيا لولا الروس هددوه، بالمناسبة هو عمل ده بطلب إسرائيلي عن طريق كيسنجر برضه."
posted = "2006-07-20"
text = "لما إحنا نتعدل ونبقى رجاله وصادقين كل العرب يقفوا معانا، وإن فضلنا كده يبقى يا سعد إسرائيل وهناها تركبنا وتندلدل رجلبها لمشاء الله."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721141756/http://masr.20at.com:80/article.php?sid=675"

[[comments]]
order = 15
subject = "مصري وبس أهلا بكم"
author = "طارق"
posted = "2006-07-20"
text = "بالراحة يا مصري وبس وخليك حليم وعاقل..لاغبار في تسمية حزب إسلامي بحزب الله..يعني لايوجد شبه عند أي مسلم إنه يقارن بين رب العزة جل وعلا وبين مؤسس حزب ثاني من البشر.<br />صاحبنا طرح-بالمناسبة أنا ضد القباحة أي كانت- نقط جوهرية وهي تتعلق بشماعة عدم الجاهزية وعدم الإستعداد. إمتى بإذن الله حنستعد؟ وهل حسب رأي سعادتك ده ممكن في ظل علاقتنا بأمريكا؟ بمعنى وهي حامي إسرائيل الأول وموردها أحدث سلاح وتكنولوجيا وموردنا إحنا كمان بالستوك والخردة؟<br />هل تعتقد جادا إن إسرائيل في أي يوم من الأيام سترغب في السلام إذا كانت مغانم حروبها الخاطفة تعود عليها بمكاسب أكثر؟<br />أنا معاك إن هناك مؤامرة صهيونية دولية علينا ومن أيام الحروب الصليبية لكن هل إحنا بهذا الضعف والعجز لنقبل بكل شئ ولا نفسد تخطيطهم الشيطاني؟ هل محتم علينا كلنا نتخذ وزير خارجية قطر قدوة ونرفع شعار سياسة الإستجداء والتوسل للرد على العدوان والإحتلال والقتل؟ العاجز والجبان صدقني كل وقت عنده غير مناسب للمقاومة، وربنا مع العبد الصادق ويرسل الملائكة لتأييد الجيوش."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721141756/http://masr.20at.com:80/article.php?sid=675"

[[comments]]
order = 16
subject = "المفتيين"
author = "ابو اسامة"
posted = "2006-07-20"
text = "انا مش عارف كل واحد عمال يفتى على مزاجه<br />واحد يقولى ان بشر مسمى نفسه حزب الله طبعا<br />ان مكناش كلنا كمسلمين فى حزب الله هنكون فى حزب مين فى حزب الشيطان وواحد تانى يقولى انه حزب الله شيعى طيب ماهو بافعاله<br />احسن من الزعماء السنة الى باعوا المسلمين وخلوهم فى خزى وعار وبيدعوا انهم مسلمين وبعدين يا جماعة احنا كلنا<br />هنتحاسب على اعمالنا واقوالنا فيا ريت الى يقول كلمة فى الموقع المحترم ده<br />بلاش الكلمات الخارجة وترد بثقافة وتقنع الى بتناقشه برأيك بدون تجريح انت كدة<br />عمرك ما هتقنع احد برأيك حتى لو كان صح<br />واخيرا اقول للأخوة الأنهزاميين الى فى الموقع اتقوا الله فى امتكم ودينكم فالنصر<br />لم يكن يوما بالعدد او بالعدة ولكن<br />بالأيمان وباالحق فكم كان عدد المسلمين فى غزوة بدر وكم كانت عندمااعجبتهم كثرتهم<br />فى حنين فلم تغنى عنهم من الله شىء واخيرا<br />اقول لكم تمسكوا بدينكم تنتصروا (وكم<br />من فئة قليلة غلبت فئةكثيرة بأذن الله)<br />واعدكم انكم سترون ذلك من حزب الله<br />(الا ان حزب الله هم الغالبون)"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721141756/http://masr.20at.com:80/article.php?sid=675"

[[comments]]
order = 17
subject = "عما تتساءلون"
author = "هند(النغرب)"
posted = "2006-07-20"
text = "لم لا يفهم اللغة العربية: حزب الله معناه ان دستورهم القران و هدفهم هو نصرة الله و هم لم يقولو انهم آلهة. انا عن من يتحدث عن الشيعة المفروض اننا مسلمون سواء شيعةاوسنةو في الحقيقة ان مانو هم شيغة فنحن لا سنة و لا يحزنون والدليل ان لا حد يقرا القرآن و الدليل من يقول نحن غير جاهزون الم يقرا في كتابه الكريم(وكم من فئة قليلة غلبت فئة كثيرة) ما هدا الجبن و الغباء هل نحن جبناء لدرجة اننا نفند كلام الله و نكدبه ارضاءا للحكام تلاندال !!! فان كنا نخاف من الحكام افلا نخاف من الله الدي سيكون عقابه اشد!!!.<br />انلم تتحرك الضعوب لثورة اسلامية ضد الحكام و عبيدهم فان نهايتنا ستكون قريبة. فبعد لبنان سيئتي الدور على سوريا فالسعودية.... فمصر.هم يقولون من النيل الى الفرات وهاهو الفرات قد دهب و النهاية ستكون على ضفافغ النيل."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721141756/http://masr.20at.com:80/article.php?sid=675"

