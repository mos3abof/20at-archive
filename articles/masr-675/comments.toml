text = "الصديق العزيز مصرى و يس ... أنا أعتقد أنك يا إما نافهه تريد أن تثير الجدل يأ إما كل ما قاله صاحب تعليق (نعيما يا مصرى و بس صحيح) فقد أدخلت نفسك و بدوت تسب حتى و أستغفر الله الدين ... يا مصرى و بس إسمحلى أن أقول لك أنا أعتقد إنك إما يهودى أو متعاطف معهم"
