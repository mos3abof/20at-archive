[[comments]]
order = 0
subject = "رايي انا"
author = "عبدالله مفتاح"
posted = "2006-04-21"
text = "البعض زي يوسف السباعي توفيق الحكيم ونجيب محفوظ محمد و احسان عبدالقدوس سلماوي وطه حسين<br />وغيرهم الكثير<br />الواحد يختلف معاهم بس يبقى انهم ناس اثروا في الحياة<br />انا عن نفسي باحب اقرا جدا لتوفيق الحكيم<br />بس توفيق الحكيم ليه كلام فارغ كتير<br />زي احسان عبدالقدوس وجملته الشهيرة<br />(اني ادعو كل فتاه ان تاخذ فتاها الى ابيها وتقول له هذا صديقي)<br />جملة سيئه جدا بس احسان عبدالقدوس انا بحب اقراله ومش لازم اتفق معاه في افكاره<br />حتى لو كنت بعتبر ان احد هؤلاء الكتاب اثر بالسلب في المجتمع"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423183222/http://masr.20at.com:80/article.php?sid=206"

