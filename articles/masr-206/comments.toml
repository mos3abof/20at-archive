[[comments]]
order = 11
subject = "المريض المصري"
author = "ابن العجبي"
posted = "2006-08-20"
text = "بعد اللف والتمحيص , والإستماع إلى أحاديث المرضى البؤساء , خلصنا إلى أن حال المريض المصري يتلخص في ما يلي :<br />يا اللي انت بيتك قش مفروش بريش<br />تقوى عليه الريح يصبح مفيـــــش<br />عجبي عليك حواليك مخالب كبـــــار<br />وما ليكش غير منقار وقادر تعيــش<br />و عجبي!!!!"
