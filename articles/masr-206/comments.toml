[[comments]]
order = 2
subject = "شفيقة ومتولى"
author = "سنووايت"
posted = "2006-04-22"
text = "عن عبقرية جاهين انه بيمسك بطرف قلمه معاني بنشوفها كل يوم ومع ذلك هو بس اللي بيكتشفها<br />كام واحد بيملى البانيو على اخره ويسمع صوت المية بتقع على الارض وبعدين تقع تاني لما الصابونه تنزل تلعب في الميه واحد بس هوه اللي اكتشف \" كثافة الأجسام\" وصرخ صرخته الشهيرة - كام تفاحه بتقع على دماغ الناس\" ايام ما كان التفاح بيتزرع على الشجر يعني واحد بس اللي سال هيه وقعت ليه-<br />وهو ده برضه جاهين واحد بس عرف يحكي عن كل حاجة جوانا لمسنها وشايفنها وبنبحلق كمان فيها بس بنعيد اكتشافها لاول مرة لما بيكتب عننها فنستغرب ونقول معاه بجد عجبي"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423183222/http://masr.20at.com:80/article.php?sid=206"

[[comments]]
order = 3
subject = "سنرجع يوما الى حينا"
author = "اكرم"
posted = "2006-04-22"
text = "كان نفسي اعبق بس معلش انا جبتيلك ابو صلا بنفسه يعلق من الرباعيات<br />و عجبي<br />غمض عينيك و ارقص بخفة و دلع<br />الدنيا هي الشابة و انت الــــــــجدع<br />تشوف رشاقة خطوتك تعبــــــــدك<br />لكن انت لو بصيت لرجليك ....تـقع<br />عجبي !!!<br />حاسب من الاحزان و حاســـــــب لها<br />حاسب علي رقابيك من حبلـــــــــــها<br />راح تنتهي و لابد راح تنتهــــــــــي<br />مش انتهت أحزان من قبلهــــــــــا؟<br />عجبي !!!<br />يأسك و صبرك بين إيديك و انت حر<br />تيأس ما تيأس الحياه راح تــــــــمر<br />أنا دقت مندا ومندا عجبي لقيــــــت<br />الصبر مر و برضك اليـأس مـــــــر<br />عجبي !!<br />ولدي نصحتك لما صوتي اتنبــــــــــــح<br />ما تخفش من جني و لا من شبـــــــــح<br />و ان هب فيك عفريت قتيل إسألـــــــــه<br />ما دافعش ليه عن نفسه يوم ما اندبح<br />عجبي !!<br />ولدي إليك بدل البالون ميت بالــــــون<br />انفخ وطرقع فيه علي كل لـــــــــــون<br />عساك تشوف بعينك مصيرالرجــــــال<br />المنفوخين في السترة و البنطلـــــون<br />عجبي !!!<br />لولا اختلاف الرأي يا محـــــترم<br />لولا الزلطتين ما لوقود انضرم<br />و لولا فرعين ليف سوا مخاليف<br />كان بيننا حبل الود كيف اتبرم ؟<br />عجبي !!!!"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423183222/http://masr.20at.com:80/article.php?sid=206"

[[comments]]
order = 4
subject = "شاعر"
author = "أثناء خلافه مع رمز ثورة يوليو عبد الناصر كتب"
posted = "2006-04-22"
text = "يا طير يا عالي في السما .. طز فيك<br />تكونش فاكر ربنا مصطفيك<br />بردك بتاكل دود .. وللطين تعود<br />تمص فيه يا حلو ويمص فيك<br />وعجبي<br />وبما إن عبد الناصر كان مسافر يوم نشر الرباعية .. الدنيا اتقلبت على صلاح فكتب<br />أنا قلبي كان شخشيخه.. أصبح جرس<br />جلجت به .. صحيوا الخدم والحرس<br />أنا المهرج خفتوا ليه قمتوا ليه<br />لا فإيدي سيف ولا تحت مني فرس<br />وعجبي<br />من أقرب رباعياته ليا<br />غمض عينيك وارقص بخفة ودلع<br />الدنيا هى الشابة .. وانت الجدع<br />تشوف رشاقة خطوتك تعبدك<br />لكن انت لو بصيت لرجليك تقع<br />وعجبي<br />مرغم عليك يا صبح .. مغصوب يا ليل<br />لا دخلتها برجليا ولا كان لي ميل<br />شايليني شيل .. دخلت أنا للحياة<br />وبكرة حأخرج منها .. شايلني شيل<br />وعجبه"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423183222/http://masr.20at.com:80/article.php?sid=206"

[[comments]]
order = 5
subject = "إيه يا عم براء !!"
author = "الشمحطجى"
posted = "2006-04-22"
text = "فى البداية اسلوب الكتابة حلو ده من النحية الفنية اما نحية الى فيه للأسف فى بعض النقوط متعرضتهاش ويمكن ان الاسلوب الى كتبت بيه هو اسلوب البروفييل يعنى بترسم الشخصية بالكلام وصعب انك تلم كل جوانبها<br />نقطة تانى احنا ليه لما بنحب حد بنوصله انه ممكن يوصل لدرجة الإله يعنى بنأله من الآخر وده الى حصل فى موضوعك عن صلاح جاهين الى فى رأيى عن كتاباته انه كان فى كتَاب كتير يمكن اسلوبهم والقضايا الى كتبو عنها اعمق واكتر فنية من اشعاره .<br />يمكن علشان صلاح جاهين كان مرمى فى حضن الظباط الاحرار ويعتبر هو شاعر الثورة هو و الابنودى يمكن !!<br />انما فى كتاب كتير اكتر فنية وحرفية مخدوش حقهم من الشهرة والدلع زى عمنا صلاح جاهين .. فهمان ولا مو فهمان !!!<br />زائد كمان يا عم براء ارحم ابوك بقى يا سيدنا مش كله شويه تطلع عقدك عليه... الراجل خلاص راح لحاله مش كل شوية تتحفنا برأى من آرائه ...ابو يا براء لو تسأل كم قاسَ ..هتلاقيه قاسَ كتير ...بل قل قاس وقل قاس وقل قاسََ...!!<br />ويجعله عامر !"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423183222/http://masr.20at.com:80/article.php?sid=206"

[[comments]]
order = 6
subject = "ايه يا عم"
author = "البراء أشرف"
posted = "2006-04-22"
text = "إيه يا عم الشمحطجي... تعال بس بهدوء نقرأ الكلام كمان مرة.. الراجل لا هو إله ولا هو أي حاجة..<br />ده مجرد مبدع كان ليه تاريخ وساب وراه أثر عظيم، وأنا قايل أن اللي جاذبني ليه مش أعماله بقدر ما أنا مندهش لفلسفته في الحياة.. بدليل إني كاتب إني مقرتش كل أشعاره ولا اتفرجت على رسوماته..<br />فلا هو إله ولا هو منزه عن الخطأ.. وأنا شايف إن في حياته حاجات غلط زيه زي غيره.. بس أنا بتكلم عن الحاجات اللي عاجباني فيه...<br />ده بالنسبة لعم صلاح..<br />أما بالنسبة لأبويا فأبويا ده راجل زي السكر وكفاية إنه حاول يربيني وهو صغير لكن فشل للأسف بدليل إني قاعد بكتب عن صلاح جاهين اللي هو مبيحبوش.. الحكاية كلها إن تعليقات أبويا على شغل صلاح جاهين كانت السبب إني أتعلق بالشخصية دي رغم عدم معرفتي بيها..<br />المهم.. المعلومة بس اللي عايز أنفيها.. هي إن أبويا راح لحاله.. لإنه (والحمد لله) لسه حي يرزق ربنا يديله طولة العمر ويباركلي فيه..أنت أكيد تقصد جدي يا عم الشمحطجي.. ثم إن دي أمور عائلية.. تتدخل فيها ليه.. شمحظجية آخر زمن.. وعجبي!"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423183222/http://masr.20at.com:80/article.php?sid=206"

