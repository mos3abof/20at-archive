text = "بالفعل مش كتير يقدروا يعبروا عن اللي جوا كل واحد فينا لانه ما اصعب انه انسان يحس باللي جواك واللي انت بتحسه لاكن امثال امل دنقل وصلاح جاهين فعلا قدروا بابداعهم انهم يدوسوا علي جرح كل واحد فينا وافرحنا واهاتنا واحزانا<br />شكرا لصاحب اخر تعليق فعلا كلامك صح<br />سلام"
