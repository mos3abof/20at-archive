subject = "مقال كتير حلو"
author = "ريما"
posted = "2006-08-26"
text = "المقال كتير حلو و بشد اقارئ يكملو للاخر<br />اسلوبك كتير حلو يا براء و بذات انو باللهجة المصرية الي كتير قريبة عالقلب<br />بس برضو انا حابة اعرف اكتر عن صلاح جاهين<br />انا بسمع في من انا صغيرة و يمكن اكتر شي بذكرني في سعاد حسني لانها غنت كتير من اشعاره<br />بس ممكن تحكيلنا عنو اشوي اكتر يعني المعلومات الي عندك معلش تكتبها في مقال تاني؟"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071705/http://masr.20at.com:80/article.php?sid=206"
