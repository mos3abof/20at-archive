text = "بيقوللك خفيفة، وهم الفرنسيين أساسا شعب مهزار يعني مش لازم العمدة يتحمق قوي كده يعني..<br />بس المفارقة في الفرق بين بلد العمدة فيها شخص عادي جدا وبيمشي في الشارع ولما اتضرب على قفاه كمان مكانش له حرس واضطر يبلغ البوليس، وبلد تانية انت ممكن تعيش وتموت من غير تشوف المحافظ ده شكله ايه اساسا"
