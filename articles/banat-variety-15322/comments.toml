text = "انا في الموقف اللى زى ده لما بركب في مكان زحمه بعمل حاجه بسيطه اوى وهى انى بشيل دبوس من الطرحه و اخليه في ايدى لما واح يفكر يقرب مني بغرز الدبوس فى جسمه و بيبعد ومش بيقدر يتكلم"
