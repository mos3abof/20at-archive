posted = "2010-02-17"
text = "ههههههههههههههه ههههههه والله ضحكتينى نسائكم حرث لكم هذه لالازواج يامفتحة ولا فى ايه ولاانتى بتخبطى فى الكلام وخلاص وبعدين هقولك لما بيتحرشوا بيكم بتسكتوا ليه وتقولوا ماحدش بيعمل حاجة لانه شايفك وافقة ومسلمة نفسك ليه على الاخر لكن لما بتكون واحدة محترمة بتشيل ايديها وتديله ومش بتخاف وفى بنات بردك بتكون موافقة جدا على كدة وانا بصراحة شوفت كليبات من النوع ده ومتصورة من غير ماهما يعرفوا فالا بيتحرش بيجرب ياصابت ياخابت فالبنت المفروض ماتسكتش والمفروض الا مش عارفة فى الدين ماتلخبطش فيه"
archived = "2010-02-17"
capture_url = "https://web.archive.org/web/20100217174704/http://www.20at.com:80/banat/variety/15322-2010-02-14-15-12-16.html"
