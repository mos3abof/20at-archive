author = "jooliana"
posted = "2010-02-16"
text = "المتحرش يكون فى حالة شبق جنسى ومتوتر فاذا وجد الفريسة خائفة يطمئن ويستمر فى تحرشه اما اذا تم طعنه بسرعة وقوة فسوف يزمهل من المفاجاة لان الطعنة للرجل وهو متوتر وفى موضع رجولته تجعله مزمهلا لفترة زمنية خاصة اذا شاهد الدم على ملابسه وهذه فرصة للفرار بدون النظر الى الخلف ويجب على الجمعيات النسائية والنوادى تدريب الفتيات على حركات الكونج فو السريعة فلسنا جوارى للرجل وللاسف يقولون نساؤكم حرث لكم فاتو حرثكم انا شئتم - والرجل لا يحترم الا المراة ذات الشخصية خصوصا فى هذا الجيل الذى اصبح فيه الشباب مهنك من الفضائيات وسوء التغذية فهلموا لنتحد ونعلم الاقذار الادب ونجبرهم على احترامنا وكفانا سلبية وخنوع ويكفيهم ماهم فيه من لواط وانا اسفة على على قسوتى فى التعليق ولكن الكيل قد طفح وللاسف بعض صغار ضباط الشرطة يتعاملون مع الضحية كانها فاسقة اللهم قد ابلغت اللهم فاشهد<br />h"
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216115754/http://www.20at.com:80/banat/variety/15322-2010-02-14-15-12-16.html"

