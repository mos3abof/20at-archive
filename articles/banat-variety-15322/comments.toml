author = "jooliana"
posted = "2010-02-16"
text = "لابد من التسلح وانا شخصيا شحذت مبرد الاظافر واضعه بين طيات شعرى تحت الحجاب واذا شعرت بتحرش من اى شخص استهبل واغزه فى مكان جساس بشدة وعندما يفيق من الالم اكون انا قد زوغت من المكان - ولو فرض اختطاف فتباع زجاجات اسبراى مخدر بالاضافة الى العصاية الكهربية التى تنطوى وتوضع فى حقيبة اليد فى الجيب الخارجى ليسهل اخراجها واستعمالها ولا بد ان نناكد بان المتحرش جبان جدا فبلزم تمالك الاعصاب وقوة الارادة وذكر اسم الله كما يباع فى محلات العاب اعياد الميلاد اسبراى رائحته كالبيض الفاسدممكن رشها على جسمك فى حالة التعرض للاختطاف فلابد لن نكون اقوياء فالشرطة لاتاتى الابعد وقوع المحظور وبعد الفضيحة"
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216115754/http://www.20at.com:80/banat/variety/15322-2010-02-14-15-12-16.html"

