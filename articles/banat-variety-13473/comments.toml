author = "عمادالدين"
posted = "2009-09-20"
text = "مجهود جميل ورائع ولامس الصواب في معظمه ولكن<br />هناك نقطة النزول بالركبتين لدى السجود والأصح هو النزول باليدين وهناك حديث يؤيد كلامي هذا لا اتذكره ولكنه يعني النهي عن النزول بالركبة كنزول الجمل عندما يهم بالبرك<br />وهناك كتيب لابي اسحاق الحويني عنوانه\"نهي الصحبة عن النزول بالركبة\" استفاض فيه بالادلة والقياسات عن هذا الموضوع<br />تقبل مروري وتحياتي الخالصة"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923041309/http://www.20at.com:80/20at/salamo-3lakom/13473-2009-09-16-12-44-54.html"

[[comments]]
order = 1
subject = ""
author = "أُختك في الله . ."
posted = "2009-12-06"
text = "عـــذرًا . .<br />تصحيح أخطاء كتابية غفلــت عنها أثناء الكتابة . .<br />قال النبي صلى الله عليه و سلم (لعن الله النامصة و المتنمصة ) أي أن الأخذ من شعر الحاجبين يستجوجب للفاعلة (( و )) المفعول بها اللعــن أي الطـــرد من رحمـــــــة الله و جنته و رضوانه إلـى (( نـار )) تلظـــى مع غضب الله و سخطــهِ"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227180041/http://www.20at.com:80/banat/variety/13473-2009-09-16-12-44-54.html"

[[comments]]
order = 2
subject = ""
author = "أُختك في الله . ."
posted = "2009-12-06"
text = "- و مما استفحل أيضًا في المساجد و خارجها (( المُتنمصــات ))<br />فانتشر النمص بين النساء كانتشار النار في الهشيم - فما تكاد تسلم منه إمرأة صغيرة أو كبيرة , حسناء أو شمطاء , متبرجة أو حتى تلبس الســواد<br />قال النبي صلى الله عليه و سلم (لعن الله النامصة و المتنمصة ) أي أن الأخذ من شعر الحاجبين يستجوجب للفاعلة أو المفعول بها اللعــن أي الطـــرد من رحمـــــــة الله و جنته و رضوانه إلـى تلظـــى مع غضب الله و سخطــهِ . . .<br />بارك الله فيك أخي على طرحك الهام ."
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227180041/http://www.20at.com:80/banat/variety/13473-2009-09-16-12-44-54.html"

