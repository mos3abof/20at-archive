subject = "وضاح واضح"
author = "عاطف"
posted = "2006-10-15"
text = "اعتقد ان الاستاذ وضاح خنفر كان مهنيا ايضا في اجاباته وهو انسان بالفعل يستحق ان يكون في منصبه هذا.<br />اشكرك يا صاحب هذا التقرير واشكر الموقع الذي اهتم به، لانه بالفعل موضوع يجب الاشارة اليه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103250/http://www.20at.com/article2.php?sid=1349"

[[comments]]
order = 1
subject = "الجزيره درة التاج في الاعلام العربي"
author = "حمدي"
posted = "2006-10-15"
text = "ياوسائل الاعلام العربيه تبقي رع الجزيره في موضوعيتها ومهنيتها<br />الجزيره تتفوق علي اي وسيله اعلاميه عربيه من هذا الجانب بمراحل<br />انا في رايي ان لولا الجزيره ماكانت عشرينات وكل وسائل الاعلام العربيه الشريفه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103250/http://www.20at.com/article2.php?sid=1349"

