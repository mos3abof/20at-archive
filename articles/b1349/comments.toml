[[comments]]
order = 8
subject = "الي الاخ اللي فوق"
author = "حمدي"
posted = "2006-10-30"
text = "يعني هي قطر محتاجه التمويل الاسرائيلي علشان تمول الجزيره<br />يعني هي من قلة الفلوس عند القطريين .. هييجيبوا فلوس من اسرائيل<br />اما قناة العربيه بتاعتك لاتملك من اسمها شيء والافضل يسموها القناة العبريه ..قناة العربيه كل مهمتها التسويق للمشروع الامريكي في المنطقه والدفاع عن النظام الحاكم المستبد في السعوديه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103250/http://www.20at.com/article2.php?sid=1349"
