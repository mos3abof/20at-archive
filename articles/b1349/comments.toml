[[comments]]
order = 3
subject = "دائما رائدة .. و دائما متميز"
author = "سين من الناس"
posted = "2006-10-18"
text = "دائما الجزيرة هى الرائدة .. ليس لانها قناة الجزيره .. و لكن لانه تحت سقفها من هم أمثال وضاح خنفر ..<br />و تتبنى من هم فى التميز أمثال عمرو<br />سلمت يمناكم .. جمل ان عشرينات نشرت شيئا كهذا .. و نادرا ما يحدث<br />بوركتم .. و جزاكم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103250/http://www.20at.com/article2.php?sid=1349"

[[comments]]
order = 4
subject = "اشتغالات"
author = "واحد من الناس"
posted = "2006-10-18"
text = "يا رجالة الكلام دة فى البتنجان الجزيرة اتعملت لمهاجمة السعودية و لاحظو فى اى حوار اية اللى بيحصل و دققوا دية قناة عشان تشهر قطر و تهاجم مهاجميها و العربية اتعملت لمهاجمة قطر و لاحظوا كويس و توجة الجزيرة ناتج ان اللى ماسكينها فلسطينيين و فيهم اسلاميين و العربية اللى ماسكينها المارونيين اللبنانيين و دول بيكرهوا بعض جدا و طبعا دية مصلحة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103250/http://www.20at.com/article2.php?sid=1349"

[[comments]]
order = 5
subject = "العملقة"
author = "معاذ"
posted = "2006-10-20"
text = "النجاح شئ جميل وبصراحة الواحد السوي يحب يشوف النجاح ويتفرج عليه<br />ومن غير اي مبالغات فقناة الجزيرة ناجحة نجاحا ضخما ومرعبا<br />القناة عملاقة وتتمتع بأكبر نسبة مشاهدة بين قنوات الأخبار<br />وحتى بعض القنوات التي حاولت المنافسة سقطت سقوطا ذريعا لأن الجزيرة لا تنافس فهي تجدد نفسها أولا بأول وتضيف لرصيدها بسرعة ومذهلة فتبدو أصالتها وعظمتها ومعها التجديد والشباب<br />يعني الموضوع كبير كبير كبير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103250/http://www.20at.com/article2.php?sid=1349"

