[[comments]]
order = 1
subject = "مش انا اللى كاتب الشعر ده"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "تأملات رئاسية في الحملة الانتخابية<br />الريس قرفان من الحملة ****ومن بوش الى فرضها عليه<br />خمسين مرة يكلم نفسه ****وهو بيتلفت حواليه<br />بس اما انجح بس يا بوش ****راح اوريك انا ها اعمل ايه<br />احيانا يتخيل نفسه ****بيصفع بوش بضهر ايديه<br />او يرميه من شباك قصره**** ويسلط اعوانه عليه<br />ويجز على اسنانه بشدة**** ويحرك في الهوا رجليه<br />واعوانه يشوفوه يتهامسوا****دا من تأثير الحملة عليه<br />طول عمري قاعد مرتاح**** اتشرشح واتبهدل ليه<br />وناس جايين يعملو انداد ****ما حدش عارف اسمهم ايه<br />لو كانت مشيت كالعادة ****استفتاء كان يحصل ايه<br />بقى مش لاقي الا انا يابوش**** يدفع لك تمن انكساراتك<br />انا مالي ومال الفلوجة ****والى بيحصل مع قواتك<br />ياما قلنا لك يابني اتلم**** وبلاش تفرد لنا عضلاتك<br />لكن لاسمعت لنصايحنا ****ولا حتى الجهلة مخابراتك<br />ياما ها تشوف من العراقيين ****خلينا نسمع صرخاتك<br />بس انا ليه اتحمل ليه ****عبء هزايمك واندحاراتك<br />اعواني فلقولي دماغي**** بصور تافهة من حملاتك<br />فاهمين انك قدوة يا عيني**** وف تكريت يسحلوا قواتك<br />انت يا بوش سبب عكننتي**** امتى بقى تنتهي سنواتك"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142931/http://masr.20at.com:80/article.php?sid=259&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "بجد تسلم ايد اللى كاتبها"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "بعد سنين العمر دا كله ****انا اضطر ان اعمل حملة<br />وامشي اتزف ف وسط الناس ****كاني حرامي وعامل عملة<br />واسلم على رفراف الشارع **** واوزع ابتساماتي مجاملة<br />واتساوى مع كل مرشح ****زي حكاية الفيل والنملة<br />انا حاسس ان انا باتهزأ ****بس ف خطة كبيرة وشاملة<br />اعواني ماشيين حواليا ****بيقولو الليلة مش كاملة<br />كل شوية يطلع واحد ****يديني ملاحظات بالجملة<br />اوعى تكشر وانت بتقرا**** وماتنساش ان هناك كاميرا<br />اتصور من غير البدلة**** كأنك قبطان راكب باخرة<br />بلاش تتكلم خارج الورقة ****لانها في الايام دي مغامرة<br />جابوا وثائق حملة بوش ****وافلامه وهروها مذاكرة<br />عايزين يمشو عليها بالملي ****واحنا في مصر يا ناس مش برة<br />ازاي بقى ممكن تقنعهم ****ان أوتاه مش زي مسرة<br />وان احنا لسا بنتحرك ****يادوبك ما خرجناش من الجرة<br />حتى الشرابات مش ناسيينها**** والجزمة لونها ومنظرها<br />وانا ماشي في الزفة مضمضم**** ولا شايف للحملة اثرها<br />وييجي كمال ويقول لي**** ياريس اقلع يلا وانزل عوم<br />يلا اديها خمسة عبور ****علشان فيه اعلان اليوم<br />وقبل ما ايدي تشيل الكرسي ****مسكها جمال وفي عينه اللوم<br />قالي يابابا دا احنا في حملة**** ودي خطة وطريق مرسوم<br />فيه لجنة درست تفاصيلها**** وكل تحرك فيها معلوم<br />احنا اخترنا عبورنا شعار**** يلا يابابا قوم اقلع قوم<br />ويوريني صورة لبوش**** واقف يضحك ف الحمام<br />كل ما اشوفه دمي بيغلي**** وابدأ ابلبع ف البرشام"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142931/http://masr.20at.com:80/article.php?sid=259&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "حمله الرئاسه ولا حمله فريزر"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "بيعاملوني كأن انا سلعة**** منها كتير ف السوق مركون<br />قلت لهم فوقولابهدلكم**** دا انا رئيس مصر الفرعون<br />انا بدأت الحملة بكيفي**** بلاش الغيها بالتليفون<br />ما انا طول عمري وانا باتكلم**** ودايما ضيف ف التلفزيون<br />اشمعنى الايام دي يعني ****ها نحسبها بالميم والنون<br />عايزينها تمشي \"بركاوي\" ****ما هي ماشية وبقالها سنين<br />صوت الشعب انا ضامنه ف جيبي**** سواء بالشدة اوباللين<br />عمري ما شفت سقوط ف حياتي ****مش ها اسقط بعد التمانين<br />اعواني خايفين لا اتعثر**** او يقع الكرسي ويتكسر<br />ساعتها ها تبقى خسارة كبيرة**** للحرامية وشيخ المنسر<br />زادي في الحملة حب الشعب**** الى على ايامي ها يتحسر<br />لو جه واحد من اياهم ****بطيخة والبيع ع المكسر<br />لكن انا عارفيني كويس ****والمعرفة كنز ما يتقدر<br />هما صحيح اتفقرو ف عهدي **** وها اخليهم افقر وافقر<br />بس انا واثق ان انا ها انجح**** شعبي بيكره ان يغير<br />ماشي بحكمة عبيطة بتقول**** الى ما تعرفه هو الاخطر<br />هاينتخبوني علشان عارفيني ****زي بولاق والهرم الاكبر<br />مين جمعة وباقي شركاه ****عالم لسا عودهم اخضر<br />بينافسوني على ضيعة بتاعتي ****وتركة ها اسيبها لابني الاصغر<br />عايزين حملة اديها حملات**** ونشوف مين بقى هو الاشطر"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142931/http://masr.20at.com:80/article.php?sid=259&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "زيت الطعميه"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "مش ممكن اخش انتخابات ****والداخلية معايا واخسر<br />ليه انا يعني سبت العادلي ****بعد فضيحة شرم الاكبر<br />لانه مرتب كل اموره ****مين راح يكسب ومين راح يخسر<br />حتى النسبة لكل مرشح ****معروفة من دلوقتي واكتر<br />كل التفاصيل في الادراج ****مش عايزين تعطيل وتعثر<br />عايزينها تبقى شفافة ****وانضف من الصيني المتكسر<br />رغم ان انا نجاحى اكيد ****زي ما قالها بوش الاصفر<br />انا حاسس بالم ف ضلوعي ****وماشي في المولد كده متوتر<br />ماشي اشحت اصوات الشعب**** انا الفرعون المتكبر<br />بس زي ما بوش ذكرها**** انا محتاج اركز ع المظهر<br />وجمال ابني يقول لي يابابا ****لازم تلبس حاجة كاجوال<br />شكلك مش اكبر من جيلنا**** وشعرك اسود زي الليل<br />ويوريني صورة بوش ***راكب العجلة بدون سروال<br />قلت له يا ابني ابوك مش ****روبي بطل بقى بلا لعب عيال<br />خدت الشنطة منه رميتها ****وقلت الصورة دي اسوأ فال<br />انا مش عايز اسمع صوته ****ولا اشوف صورته ولو هاانشال<br />وبوش قارفني بالتليفون ****بيسأل عني كل شوية<br />بيحاول يظهرها مودة ****بس انا عارف حقده عليا<br />عايز يبعتلى مراقبين ****قلت له انا عندي الداخلية<br />دول ناس زمتهم مش واسعة**** ونتايجهم دايما ايجابية<br />قالي عايزها انتخابات حلوة**** فيها نزاهة مع شفافية<br />قلتله هانخليها شفافة**** اكتر من زيت الطعمية"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142931/http://masr.20at.com:80/article.php?sid=259&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "هيلا هوب"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "من اول ما مسكت الحكم ****وانا باسجن فيهم وباعذب<br />ضيعة ابويا وهما عبيدها ****لا باحب اتجمل ولا باكذب<br />ييجي يوم اسود واشحت صوتهم**** وامثل واعمل فيها مهذب<br />من اول ما مسكت الحكم ****عمري ما فكرت في اوضاعهم<br />ولا عمري شغلتني امورهم ****ولا حتى سلوكهم وطباعهم<br />بس دا مش معناه من الاخر**** ان انا كنت سبب تراجعهم<br />انا علشان الانتخابات ****ها اهتم شوية بمواجعهم<br />واشوف ايه يعني يريحهم ****فيه اوقات لازم ادلعهم<br />ييجي عليا يوم واترشح ****قدام الصباحي ونور<br />ونعمان ينفخ في الجرنان**** قال مخنوق وعاوزني اغور<br />الصباحي هو الى عاجبني**** راجل مش عايش في الدور<br />بيقول انه بيأيدني ****ودا هو صلب الدستور<br />انا قرفان اطلب اصوات**** من شعب انا دايما باحتقره<br />فاهم ان الريس منه ****ناقص بقي يتغدى ف قصره<br />طول عمري عامله ملطشتي**** اضربه على بطنه وعلى ضهره<br />ولما ازهق ارميه في السجن ****ولا املش ابدا من قهره<br />الشعب انا عارف مطحون ****بس انا مش مسئول عن فقره<br />اكسل شعب ف ارض الله ****متعته انه يفلي في شعره<br />مشغول ان يعيش ايامه ****من غير حتى ما يحسب عمره<br />وانا متعتي ان انا اشوفه**** والفقر بيهريه ويحاصره<br />عارف لو عاش يوم مرتاح**** راح يكتر تفكيره وفجره"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142931/http://masr.20at.com:80/article.php?sid=259&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "شحات ود ايديه 00يا محسنين الدمقراطيه"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "ويجي جمال ويقول لي يابابا ****عايزك تركب باخرة كبيرة<br />دي مرحلة تانية من الحملة**** وانت ها تبقى الريس بيرة<br />انت القبطان في المحروسة**** هاتعبر بيها نوة خطيرة<br />بس تحط ايديك ع الدفة ****وسيب الباقي على البحارة<br />لازم الشعب المصري يحس**** ان رئيسه واحد من الحارة<br />وان هموم الدفة تقيلة ****مش فذلكة وكلام وشطارة<br />خلي الشعب يشوف اعدائك ****ما يسوو حتى عقب سجارة<br />وانا باسمع له وانا مخنوق ****وباقول يلا ودمي بيغلي<br />يا بني انا عيني على امريكا ****سيبك بقى من الشعب المصري<br />لو واحد فيهم اتكلم**** انا ها اشنقه ف جنينة قصري<br />انت مصدق ان دي حملة ****ولا انا ماشي فيها بخطري<br />انا مش عايز ازعل بوش ****دا رجل مش سالك ولا دغري<br />ياما قالو لصدام ياحليفنا**** وفجأة سقاهم سم سقطري<br />حلفو يهدو عليه بغداد**** كانه وقف قدام المجري<br />شوف قذافي ليبيا كمان ****راح شايل كفنه على ايده<br />ومعداته مع اسلحته ****والتعويض لرعايا سيده<br />وقعد يتحايل ويعيط ****لحد ما بوش سحب تهديده<br />وعدوه بمكافئات وهدايا **** وكلام تافه مش ها يفيده<br />مش راح ياخد منهم حاجة**** بعد ما سلم ورفع ايده<br />بيقولو ان انا ممكن اسقط**** قلت لهم ولا في الاحلام<br />لو هاتقل عن التمانين**** تبقى نتيجة فيها كلام<br />مش رايح اقبلها من العادلي ****ولا ها يشوف ف حياته سلام<br />انا قلت انتخابات شفافة**** بس معاها نتيجة تمام<br />عايز كله يكون في هدوء**** وعبورنا يمضي بسلام<br />خمسة وعشرين سنة في البحر**** خلي عبورنا يبقى ختام"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142931/http://masr.20at.com:80/article.php?sid=259&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "الريس بيرة 00كلمه الله ايه ولكل ظالم نهايه"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "مين كان يتوقع ان انا**** اشحت من شعبي الاصوات<br />شعب الفهم بتاعه محدود**** لو يوسع ممكن انشاط<br />علشان كده وصيت اعواني**** يستعملو كرابيك وسياط<br />ويكونوا مباشرين ف عملهم**** من غير دوران ولا اسقاط<br />احيانا ياضحك من نفسي ****وما باصدقش الى بيحصل لي<br />معقول وانا قاعد ع الكرسي**** الشعب يحاول يوصل لي<br />ويرشح ناس يقفو قصادي ****ويقولو صاحبك ها يولي<br />عايز اطمن شعبي البائس ****ان انا ها ابقى رئيسه تملي<br />وما فيش نية ان انا اسيبه**** الا ف ساعة ما يحين اجلي<br />حتى الموت مش راح يعفيني**** ناوي اسيب ف المنصب نجلي<br />اول مرة الاحظ ان احنا ****عندنا شعب وله اصوات<br />وناس بتقول انها موجودة**** ف شبرا النملة والعياط<br />بيقولو احنا الشعب النايم ****ها نفوق من نومة الاموات<br />هانطالب بحقوقنا الكاملة ****وهانعمل ضجة وزياط<br />اصبروا بس عليا اما انجح**** وها اخليها محزنة وعياط<br />كل معارض يفتح بقه ****ها احول ورقه للخياط<br />والى يشيل الخيط من بقه ****ها ياخد حقه من الظباط<br />انا لسه مش قادر اتأقلم ****مع فكرة حملة انتخابية<br />احيانا بيجيني كابوس ****ان انا ماشي ف الشرابية<br />والحارة سد ومزنوقة ****والناس رايحة فيها وجاية<br />ناس مهمومة وجوه محزونة**** ولا واحد كان حاسس بيا<br />خمسين واحد خبطو ف كتفي**** وعنيهم بصت ف عنيا<br />ولا واحد فكر يسألني ****جاي تعمل ايه ف الشرابية<br />وفجأة سمعت اصوات طلقات**** وصحيت من النوم غرقان مية"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142931/http://masr.20at.com:80/article.php?sid=259&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "رساله الى مالك وسيف وشرقاوى1"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "نم يا صغيري إن هذا المهد يحرسه الرجـــــــاء<br />من مقلة سهرت لآلام تثور مع المســــــــــــاء<br />فأصوغها لحناً مقاطعه تَأَجَّجث في الدمــــــــاء<br />أشدو بأغنيتي الحزينة ثم يغلبني البكـــــــــاء<br />وأمد كفي للسماء لأستحث خطى السمــــاء<br />نم لا تشاركنــي المــــــــــــرارة والمحـــــــــن<br />فلسوف أرضعــــك الجـــــــــراح مع اللبـــــــــن<br />حتى أنال على يديك مني وهبت لها الحيــــاة><br />يا من رأى الدنيا ولكن لم يرَ فيها أبـــــــــــــــاه<br />ستمر أعوام طويلـة في الأنين وفي العـــــذاب<br />وأراك يا ولدي قوي الخطو موفــــور الشبـــــاب<br />تأوى إلى أم محطمــــــــة مُغَضـَّنَةِ الإيهــــــاب<br />وهنا تسألني كثيراً عن أبيــــك وكيف غــــــاب<br />هذا ســــــؤال يا صغيري قــــد أعد له جـــواب<br />فلئـــــن حييت فسـوف أســـــــــرده عليــــــك<br />أو مت فانظـــر من يُســـــــــِرُّ به إليــــــــــــــك<br />فإذا عرفت جريمـة الجاني وما اقترفت يــــــداه<br />فانثر على قبري وقبر أبيك شيئـاً من دمـــــــاه<br />غدك الذي كنا نؤَمل أن يصـــــــــاغ بالـــــــورود<br />نسجوه من نار ومن ظلم تدجــــج بالحديــــــد<br />فلكل مولود مكـــان بين أســــــراب العبيـــــــد<br />المسلمينَ ظهورهم للسوط في أيدي الجـنود<br />والزاكمين أنوفهم بالترب من طول السجــــــود"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142931/http://masr.20at.com:80/article.php?sid=259&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "2 الى كل ابن له اب معتقل او اخ او اخت الى كل مصر"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "فلقـــد ولــــدت كي تـــــــــــرى إذلال أمــــــــــة<br />غفلت فعاشـــــت في دياجيـــــــر الملمــــــــــة<br />مات الأبيُّ ولم نسمع بصوت قد بكــــــــــــــــــاه<br />وسعوا إلى الشاكي الحزين فألجموا بالرعب فاه<br />أما حكايتنا فمن لون الحكايــــــات القديمـــــــــة<br />تلك التي يمضي بها التاريخ دامية أليمـــــــــــــة<br />الحاكم الجبار والبطش المسلح والجريمـــــــــــة<br />وشريعة لم تعترف بالرأي أو شرف الخصومـــــــة<br />ما عاد في تنورها لحضارة الإنسان قيمــــــــــــة<br />الحـــــــــــــرُ يعـــــــرف ما تريــــد المحكمــــــــة<br />وقُضاتـــــــــه سلفـــــــــاً قــــــــد ارتشفــوا دمه<br />لا يرتجي دفعاً لبهتان رمـــــــــاه به الطغـــــــــاة<br />المجرمون الجالسون على كراسي القضـــــــــاة<br />حكموا بما شاءوا وسيق أبوك في أغلالـــــــــــه<br />قد كان يرجو رحمـــة للنـــــــاس من جــــــــلاده<br />ما كان يرحمه الإلــــــــه يخون حب بـــــــــــلاده<br />لكنه كيـد المُدِل بجنـــــــــــده وعتــــــــــــــــاده<br />المشتهى سفك الدمـــاء على ثــــــــــرى رواده<br />كذبوا وقالوا عـــن بطولتــــــــــه خيانــــــــــــــــة<br />وأمامنا التقريـــــــــر ينطــــــــــــق بالإدانــــــــــة<br />هذا الذي قالوه عنه غداً يردد عـن ســــــــــــواه<br />ما دمت تبحث عن أبِيٍّ في البلاد ولا ت<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142931/http://masr.20at.com:80/article.php?sid=259&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "رحمه الله عليك يا ابراهيم يا رفاعى"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "هو مشهد من قصة حمراء في أرض خضيبـــــــة<br />كُتبت وقائعها على جدر مضرجة رهيبـــــــــــــــة<br />قد شاهدها الطغيان أكفاناً لعزتنا السليبـــــــــة<br />مشت الكتيبة تنشر الأهوال في إثر الكتيبـــــــة<br />والناس في صمت وقد عقدت لسانهم المصيبـة<br />حتى صدى الهمســـــــــات غشـــــــاه الوهـــن<br />لا تنطقـــــوا إن الجـــــــــدار لــــــــــــــــــــه أذن<br />وتخاذلوا والظالمون نعالهــم فوق الجبـــــــــــــاه<br />كشياه جزار وهل تستنكر الذبح الشيـــــــاه؟ ؟<br />لا تصغي يا ولــــدي إلى ما لفقـــــــــــوه ورددوه<br />من أنهم قاموا إلى الوطن السليب فحـــــــــرروه<br />لو ككان حقاً ذاك ما جاروا عليه وكبلـــــــــــــــوه<br />ولما رموا بالحر في كهف العــــــذاب ليقتلــــــوه<br />ولما مشوا بالحق في وجه السلاح ليخرســــوه<br />هذا الذي كتبـــــــوه مسمــــــــــــــوم المـــذاق<br />لم يبق مسموعــــاً ســـــــوى صوت النفــــــاق<br />صوت الذين يقدسون الفـــــرد من دون الإلـــــــه<br />ويسبحون بحمده ويقدمون له الصـــــــــــــــــلاة<br />اتمنى من الله ان تكون فى جنه الخلد يا رفاعى ولو ما حدش يعرف مين هو الرفاعى يقول انا مستنى تعليقاتكم"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142931/http://masr.20at.com:80/article.php?sid=259&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 11
subject = "ومين ميعرفش الرفاعي"
author = "البراء أشرف"
posted = "2006-05-03"
text = "الرفاعي هو هاشم الرفاعي..<br />وده شاعر شاب -الله يرحمه- كان يدرس في كلية دار العلوم ومات في الخمسينات او الستينات وله مجموعة من القصائد الرائعة المجموعة في ديوان باسمه وقد جمع الديوان أخوه الأكبر..<br />هاشم له مجموعة من القصائد التي تناقش مسألة الظلم والاستبداد، أهمها نم يا صغيري ورسالة في ليلة التنفيذ والأخيرة يحكي فيها الشاعر على لسان معتقل سياسي محكوم عليه بالاعدام وجلس يكتب رسالة لوالده في ليلة تنفيذ الحكم..<br />ديوان الرفاعي يدرس في كلية دار العلوم، وقد أعلنت الكلية أنه حصل على شهادتها رغم أنه توفى قبل أن يحصل على شهادة العام الأخير بها..<br />ومات الرفاعي مقتولا في ملعب لكرة القدم بقريته الصغيرة في بلبيس تقريبا..<br />هذه معلومات قليلة عن الرفاعي.. وللمزيد يمكن قراءة ديوانه وهو متاح أعتقد في طبعته الأخيرة بدار الإيمان بالمنصورة على ما أتذكر.. أشكر الأخ الذي ذكرنا بأشعاره.. ورحمك الله يا هاشم!"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142931/http://masr.20at.com:80/article.php?sid=259&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

