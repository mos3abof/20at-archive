[[comments]]
order = 0
subject = "اة يا بلد"
author = "ايمن المصرى"
posted = "2006-10-17"
text = "و النبى مانتوش مكسوفين من نفسكم.خلاص هى دى مصر.و هو دة شعبها.وهو دة شبابها العظيم.اية اللى بيحصل دة.فاضل اية تانى يحصل لنا.خلاص يامصر خلاص يا مصر ماعدش فيكى راجل يخلصنا من الذل و الهوان دة. خلاص مفيش (سليمان الحلبى) تانى.و لا ابراهيم خليل تانى(بتاع فيلم فى بيتنا رجل).ولا خالد الاسلامبولى تانى . خلاص الرجالة خلصت . و لم يعد غير الذئاب و النعاج . اصحوا باة و فقوا . و اللة حرام."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061627/http://masr.20at.com:80/article.php?sid=1058"

[[comments]]
order = 1
subject = "شباب زى الورد"
author = "واحد من الناس"
posted = "2006-10-17"
text = "السلام عليكم ورمضان كريم والله ياجماعة نقول ايه بس دى شباب زى الورد وانا بتعرف كل يوم على كتير منهم لما يكون معيش رصيد وعايز اعمل تليفون وبعرف منهم خريج حقوق واداب وتجارة وشباب ذاكروا ونجحوا وتعبوا وفى برضوا منهم اللى يدوب بيعرف يقرا وكل دول بيتساوا ببعض اللى درس نظرية لادم سميث واللى مبيعرفش يقرا اللى درس نظريات لمبروزو والى ميهموش غير فلوسهوالله انا خايف من مستقبلى لما تخرج واخويا اللى لسة فى ثانوى قاعد يحول علمى وادبى ويغير مواد ومرعوب من المستقبل يعنى انا مش متصور انا اتعلم كل ده عشان اقف اقول موبيل موبيل وانا مش بعيب على الشباب اللى بتشتغل كده بالعكس دول رجالة انهم مشتغلوش حرامية ولا نصابين ولا قعدوا على القهوة ولا على الناصية زى شباب كتير اوى ملهاش اى لزمة وانا خايف برضه لكون من دول وبقول برضه احنا عندنا ثروات كتير اوى غير السياحة والاثار وغير النيل والبترول ثروتنا فى شبابنا ثروتنا فى شعبنا اللى على ارضنا وبقول تحيا مصر الشعب والناس مش حكام وخلاص ده هما من الاساس مش مننا ولابيحسوا بفقرنا والعيب فى الادارة هيا والوازارة حتى بلامارة احنا مش كده."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061627/http://masr.20at.com:80/article.php?sid=1058"

[[comments]]
order = 2
subject = "دماغ مصرية"
author = "شرين منصور"
posted = "2006-10-18"
text = "يا جماعة احنا بجد ناس غريبة وتفكيرنا اغرب الباب تنحرف يبقوا في نظرنا مجرمين وبايظين يشتغلوا على موبايلات في الشارع بردو نقول عيب مش منظر يعمللكوا ايه يعني يخليهم في الاوف سايد على راي الحاجة اطاطا ولا ايه وانا لو ملقتش شغل بالرغم ان حالتي المادية كويسة حعمل زيي بالضبط وده مش كلام على الاقل مش حبقى عائل على اهلي حتى بعد ما اتخرج"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061627/http://masr.20at.com:80/article.php?sid=1058"

[[comments]]
order = 3
subject = "العرب الجرب همه السبب"
author = "المهندس عادل"
posted = "2006-10-18"
text = "ملعون أبو العرب الجرب همه سبب تأخرنا وبيجرونا للخلف. ملناش غير أمريكا وإسرائيل دول همه أصدقاءنا الحقيقين، أنا نفسي أكون يهودي والإسلام ده مش عاوزه ولا المسيحية. وأحسن حسنات السادات إنه صالح إسرائيل، وخلاها طايحة في العرب بدل مننا.<br />نعم للتوريث وإستكمال المسيرة"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061627/http://masr.20at.com:80/article.php?sid=1058"

[[comments]]
order = 4
subject = "أهلا بعدولة يا كس أمك"
author = "المصري العربي السكندري"
posted = "2006-10-19"
text = "في اليمن بيسموا الحمار \"المهندس\" تعرفي ليه يا خنثى عدلات؟ لأن أبوك الحمار في الطرق الجبلية الوعرة بيختار أنسب الطرق وأقصرها ليه واللي راكبه، وإنت ست العارفين والمركوبين في مجال الركوب والإنبطاح والإنشراح والإنشكاح على زب الحمار الرماح. نحاول نرد على كسك بمنطق لوجك \"في مسلمين كويسين كتير في باكستان وأندونسيا وماليزيا \" ليه همه دول زبارهم كبيرة؟ على مقاس فتحتك الألترا اللارج وعنده إكستريم إنديورنس بحيث يقدروا ينكوكك ليل نهار نن سوتب، وكمان جنرس يعني؟ بيدفعوا كويس؟ متخليش طيزك تكون الحكم والمقياس للسياسات الدول يا خول يابن المنيك العلق الخول، يالوطي يا كافر يابن خالك، بلاش فضايح؟ همه الشرموطات النهارده بقى عندهم شهادات بكالوريوس في الهندسة؟ هندسة إيه؟ فتح الطيز؟<br />محدش من العرب غلط على مصر أو قال كذبة واحدة، دول ناكوك إنت ومدفعوش، إيه يعني يا صايعة يا معفنة؟ السادات بتاع كس أمك الخول كان أكبر متسول وشحاذ من السعودية وليبيا والجزائر وبلاد الخليج والعراق، ولإنه إبن شرموطة زيك وغازية، كان بينزل ردح لما النقطة تتأخر عليه شوية، فهمت يابن المومس؟ إنتي شوفتي بلاد العرب بالمناسبة يا عدولة؟ شوفي مستوى المعيشة هناك وهنا وبعدين إفتحي كسك وإتكلمي؟ تفتخري بمحمد علي وإسماعيل الخ، همه دول مصريين ولا تراكوة يا مقعورة؟ وبعدين إيه الفايدة لو إن مليون مصري برة حصلوا على نوبل؟ عملوا لمصر حاجة؟ وأهم من كده إيه خذت مصر من علاقتها بإسرائيل وأمريكا؟ تقدري تجاوبي من غير تشليق؟ وإلا الطبع غلاب؟"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061627/http://masr.20at.com:80/article.php?sid=1058"

