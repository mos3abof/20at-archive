[[comments]]
order = 2
subject = "الجيش المصري فين ؟؟ وساكت ليه على العرص وعصاباته ؟؟؟؟؟"
author = "إبن بهية"
posted = "2006-08-29"
text = "الجيش المصري فين ؟؟ وساكت ليه على العرص وعصاباته ؟؟؟؟؟<br />بالأمس صرح أحد أفراد عصابات مبارك (حسام بدراوي النصاب بتاع مجزرة \"\"عفواً\"\" مستشفى بدراوي بالمعادي) أن جيمي مبارك وده إسمه الحقيقي البريطاني .. أن جيمي هو من يصلح لقوادة مصر في المرحلة المقبلة .. بدأت اسطوانة التوريث تذاع في وسائل الإعلام بعد سنوات من التسجيل والمونتاج والإخراج ... بدأنا نسمع أولى وصلاتها الداعرة ... طيب لإمته يا بلد ؟؟؟ والجيش فين من المصيبة دي ؟؟؟ الجيش المصري اللي بياخدوا مرتباتهم من جيوبنا ومن دم مصر فين ؟؟؟ فين القسم اللي أقسموه على أنفسهم بحماية الوطن ؟؟ طيب وفين الحماية دي ومبارك وعصاباته بيبيع في مصر لليهود حتى حتة .. الجيش مستني إيه ؟؟؟ ولا الجيش مستريح ومالوش دعوة تتحرق البلد والناس ؟؟؟ طبعا مبارك ضاحك عليهم بقرشين زيادة في المرتبات وعايشين في فيلات وقصور وليهم كل الخدمات والمصايف والشقق وحتى السلع التموينية ليهم بأسعار غير خلق الله في جمعياتهم العسكرية ... يعني دول سكان عندنا بس ما لهمش دعوة بالبلد .. لأنهم ببساطة مش مكويين من مبارك وعصاباته زينا ... يبقى هيتصرفوا ازاي وليه ولمصلحة مين ؟؟؟ طالما كل مصالحهم متظبطة وزي الفل ... يتحرق الشعب ... بس ده حرام يا باشوات يا جيشنا العزيز ... لأنكم بكده بتبيعوا القسم بتاعكم بحماية البلد ... بتبيعوه بشوية فلوس وعمارات ومصايف .. ارجعوا إلى ربكم وحرروا مصر من ذلك الخائن وعائلته وعصاباته ...<br />إبن بهية<br />http://ibnbahya.blogspot.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125556/http://www.20at.com/article2.php?sid=1152"

