subject = "انا معاكي هوبه"
author = "كرميلينو"
posted = "2006-03-23"
text = "تاكسي العاصمة ده مشروع كويس طحن بس مشكلتوا حاجة واحدة ان محدودي الدخل اللي زي حالاتنا مش هيقدرو يستمتعوا بتكييف التاكسي بسبب بنديرته الغاليه موت و هنضطر نركب التاكس المعفن اللي لونه كئيب ( ابيض و اسود ) و اللي ماشي بالزق و اللي بنتخانق معاه دايما عن الاجره<br />صحيح يا جدعان التاكسي له ناسه و خلونا مع المكروباظ او التوبوص"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205147/http://masr.20at.com:80/article.php?sid=33&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

