[[comments]]
order = 4
subject = "اخيرا جانا الفرج"
author = "محمد"
posted = "2006-04-08"
text = "اخيرا مش راح اسمع تعنت التاكسي العادي تاني. تكسي المدينة واجهة حضارية لبلدنا. ولابد ان ننجحها. انا جربت تاكسي المدينة في مشوار من المهندسين لمدينة نصر و دفعت 17 جنيه. الأبيض و الاسود بيطلب 15. ده يدينا فكرة انو تاكسي المدينة كويس في المشاوير الطويلة."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205147/http://masr.20at.com:80/article.php?sid=33&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "مصر لم تعد لمحدودى الدخل"
author = "مصرى"
posted = "2006-04-22"
text = "تكسى العاصمة أكد أن مصر أصبحت لأصحاب المشاريع ولأصحاب رؤوس الأموال فقط لكن لا يستطيع أن يعيش فيها أصحابها من الطبقة المتوسطة والمحدودة الدخل أنا يهمنى إيه إن التاكسى يكون مكيف ولا مهبب هو أنا هأخذ تكييف التاكسى فى إيدى وأنا نازل منه المهم عندى أنى أقدر أقضى مشوارى بسعر رخيص وبدون أهدار أدمينى فى وسائل علب السردين العام والرحمة بالشعب علشان هو ده صاحب الحق فى بلده ."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205147/http://masr.20at.com:80/article.php?sid=33&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"
