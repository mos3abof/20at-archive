text = "أيمن نور قال عكس هذا الكلام على الجزيرة مباشر وبصراحة لا أصدق فلو كان الرجل عميل أمريكي وبيقبض من الأمريكان لسطع نجمه أكتر من جمال مبارك لكنه حتى مش قادر يحصل على مقر جديد لحزبه بعد أن حرق بلطجية الحزب الوطني مقره القديم بالسبرتو"
