author = "جيمي"
posted = "2009-11-17"
text = "المشكلة انه مش بيقول رأيه بصراحة<br />وبيقول رايه المبنى على توجهات ومصالح آخرون وليس بناءً على قناعاته الشخصية<br />وده يدخل تحت تصنيف \" الجبن \"<br />والأنسان الكاذب دايماً بيبقى بمليون رأي .. وتلاقيه فى المؤتمر ده بيقول حاجة تناسب توجهات اللى قاعدين فيه<br />ينزل منه ويروح ندوة .. ويقول كلام مغاير لللى قاله من شوية في المؤتمر .. علشان اللى قاله في المؤتمر ماينفعش يتقال قدام اللى قاعدين فى الندوة … وهكذا .<br />وفي رأيي أن أيمن نور من النوع ده .. للأسف مش هو ده أيمن نور اللى دخل السجن<br />دول طلعوا واحد شبيه ليه .!!!!!"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040154/http://www.20at.com:80/masr/hot-topics/14075-2009-11-17-11-39-15.html"

