posted = "2009-11-17"
text = "ايمن نور بتصريحة الاخير والذى سيكذبة غدا ويتحجج بانة ساء تاويلة او ساءت ترجمتة تعلم من المسئولين بتوعنا والقيادة السياسية الحالية تعلم انة يقول للخارج كلام وللداخل كلام تانى<br />بسلامتة بيستغفلنا<br />اكيد يا ايمن<br />انت بقيت اكبر رقيع"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040154/http://www.20at.com:80/masr/hot-topics/14075-2009-11-17-11-39-15.html"

