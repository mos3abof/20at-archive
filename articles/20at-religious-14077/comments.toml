posted = "2009-11-18"
text = "شجع نفسك على الصيام:<br />- اتفق مع زملائك في الكلية أو العمل على الصيام، وتشجيع بعضكم.<br />- إذا أفطر أحد أصدقائك في أحد هذه الأيام، شجعه على الاستمرار وعدم الاستسهال.<br />- استغل هذه الأيام في الاجتماع مع أفراد أسرتك على مائدة الطعام، والغي جميع ارتباطاتك في ذلك التوقيت من اليوم، وعد إلى منزلك مبكرا.<br />- استغل هذه الأيام في مصالحة نفسك، والتقرب من الله.<br />- تعامل مع صيام هذه الأيام كأنك في رمضان، استرجع طقوسك الرمضانية الجميلة في هذه الأيام.<br />نصائح ممتازة جدا<br />ربنا يبارك فيكم"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040148/http://www.20at.com:80/20at/religious/14077--10-.html"
