text = "لم تفشل الوقفة بدليل تواجد جميع وسائل الإعلام فى موقع الوقفة الإحتجاجية بالإضافة ان كل المعلومات فى الخبر مغلوطة ولم يحدث على وجه الإطلاق أى تضارب فى المواعيد او المكان كما لم يصدر اى بيان عن لسان الأستاذة نهاد ابو القمصان حسب قولها، ولم تحضر كاتبة المقال فى المصرى اليوم هدى رشوان وقد ارسلت تكذيب للمصرى اليوم لنشره فى القريب العاجل<br />رجاء التأكد من الخبر قبل نشره"
