author = "معجبة ببرنامج للالة"
posted = "2009-07-23"
text = "أريد أن أقول بأن خديجة أسد و زوجها عزيز سعد الله …فكرة تنشيطهما للبرنامج الرائع للالة لعروسة كانت للأسف أكبر خطأ لأنهما لايليقان بجو التنشيط ف رشيد الوالي كانت أول تجربة له في التنشيط ولكن نجح فيها وحبب البرنامج أكثروأكثر…<br />وأتمنى أن تكون الدورة الخامسة لبرنامج للالة لعروسة مع تنشيط رشيد ورشيد<br />و شكـــــــــــــ ـــرًا"
