subject = ""
author = "كداب يا خيشة"
posted = "2009-06-28"
text = "سعر الجاموسة فى السوق حاليا ما بين 7000 الى 8000 جنية<br />والحكومة بتصرخ كل يوم وتقول عجز الموازنة 100 مليار جنية يعنى ايرادات الحكومة كلها لا تكفى مصروفاتها بعجز 100 مليار جنية ومش عارفة تغطى العجز دة ازاى<br />تقوم الحكومة توزع على كل مواطن جاموسة ب 7000 جنية<br />يعنى لو كل مواطن اخد جاموسة وحتى لو 5 ملايين مواطن اخدوا جواميس من السيد المحافظ فارض مصر الزراعية كلها مش هتكفى اكل الجمايس يبقى الناس تاكل اية<br />دة كلام محافظ اهبل او مش فاهم او عارف اى حاجة<br />- وبعدين سيادة المحافظ لواء بتاع صفا وانتباة ولليمين در ومعتدلا مارش - مالة ومال الجواميس"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630152858/http://www.20at.com:80/masr/t7kyk/12493-2009-06-28-09-21-52.html"

[[comments]]
order = 1
subject = ""
author = "االجاموسة والزريبة"
posted = "2009-06-28"
text = "الجاموسة محتاجة زريبة علشان تنام فيها ومحتاجة تنظيف ورفع لفضلاتها يوميا وتحتاج الى مخزن تبن وعلف وما لايقل عن عشرة قراريط تزرع بالبرسيم<br />فية ناس فى الريف فقراء وبالذات فى الصعيد محتاجة حاجة زى كدة - بس المشكلة فى تسويق اللبن والزبد<br />انما سكان المدن فهذا لا يمكن تطبيقة اطلاقا<br />فا الشعار جاموسة لكل مواطن شعار كذاب وخادع وسيادة المحافظ ياخد جاموسة ويورينا ازاى هيربيها جوة بيتة<br />بطلوا شعارات كدابة<br />والا هنقلب الشعار بتاعة ونقول جاموسة لكل محافظ"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630152858/http://www.20at.com:80/masr/t7kyk/12493-2009-06-28-09-21-52.html"

