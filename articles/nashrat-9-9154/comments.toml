text = "شي محزن اني اعرف ان قطر فيها فقراء وبما ان عدد الفقراء الي في قطر قليل جداً اجد ان على الجهات المعنية انها تلاقي حل جذري للمشكلة هاذي وهي بانها تساعد الاسر هاذي بأنها تقوم باعانة الاسر وفي نفس الوقت دفع مصاريف تدريس الابناء وتدريبهم حتى يمتلكون الخبرة الكافة للعمل ومن ثم توظيفهم براتب يكفهم عن الحاجة … اما اعطائهم اعانات شهرية ما تسد الا جزء من حاجتهم فهذا لن يفيد"
