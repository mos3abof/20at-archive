subject = "الف تحية لشبابنا"
author = "ياسر ابو عمار"
posted = "2006-09-06"
text = "الف تحية اوجهها الى شبابنا الجميل فى كل مكان فى مصر او لبنان وغيرها ،بلادنا يا شباب ما زالت تحتفظ باحلى شباب تنقص معظمهم الفرصة لاثبات الوجود ،ولكن حين تتاح تلك الفرصة اتفرج على هؤلاء الشباب ،تحياتى .وهى دى الموضوعات يا جماعة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124905/http://www.20at.com/article2.php?sid=1197"

[[comments]]
order = 3
subject = "شكرا ً، عباس"
author = "راشد"
posted = "2006-09-06"
text = "أود أن أؤكد أن عباس ناصر كان المراسل الأفضل على الاطلاق في رأيي طوال فترة الحرب، وهذا لا يقلل من باقي المراسلين، ولكن:<br />1. عباس ذو الكلمة الأنيقة، والتقارير التي لا تكاد تخلو من حكمة ما<br />2. عباس النشط دائما ، ولا أذكر أن هناك وقت في اليوم لم يقدم فيه تقريرا أو ينقل على الهواء مباشرة<br />3. عباس في كل مكان في كل وقت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124905/http://www.20at.com/article2.php?sid=1197"

