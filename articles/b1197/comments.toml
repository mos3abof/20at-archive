subject = "شباب مجاهد"
author = "حسام الدين على"
posted = "2006-09-13"
text = "السلام عليكم ورحمة اللة وبركاتة<br />فى البداية احب ان اعبر عن مدى احترامى و تقديرى لهذا الموقع الممتاز وز اطلب منهم عدم الاهتمام بالتعليقات السخيفة التى ترسل اليكم و اهنئ المراسل الممتاز عباس ناصر لبذلة كثير من الجهد من اجل نقل الحقيقة كاماة من وطننا لبنان رغم ما تعرض لة من اهوال مميتة فى الحرب السادسة الغاشمة على لبنانو احباننا كسبنا مراسل جيداستطاع ان يتسلل الى قلوبنامثلما فعل موقع عشرينات<br />بالتوفيق ان شاء اللة"
