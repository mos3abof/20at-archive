[[comments]]
order = 0
subject = "..& ربنا يحميك يا عباس والله إنت فخر للمراسلين العرب &.."
author = "..& هيكل الأزهرى &.."
posted = "2006-09-05"
text = "والله يا جماعه اخونا الكبير عباس ناصر دا فعلا من احسن واروع المراسلين اللى شوفتهم وكنت متابعهم ايام المؤامرة على لبنان من بلد ال6 مليون جاهل ^ اسرائيل^ وانا فعلا كنت متشوق اعرف عنك اى خبر يا عباس وانا اقصد إنى اقول عباس بس مش استاذ عباس او اى القاب لأنى فعلا بحس انك واحد من الناس همهم انت عارفه كويس وشايل منه كتير وفعلا من اكتر المذيعين اللى لفتوا انظار العالم العربى بشدة خصوصا اوقات الحرب انت وغسان بن جدو الرائع وكاتيا ناصر ربنا يحميكم جميعا ويكرمكم والله انتوا فعلا فخر وعزة لينا كلنا كعرب مش هنسى اما كنت كتير جدا جدا بتقول إننا محاطين من خلقنا ومن امامنا ولا يوجد امامنا طريق فى الوقت الحالى والله كان نفسى اكون كبير فى الوقت دا واكون من الإستاف دا فعلا شىء يشعر بالبطولة والله الحمد لله انكم جميعا رجعتوا بسلام وهنكمل فرحتنا جميعا بمبادلة الأسرى بإذن الله اللى انا واثق إن زعيمنا الرائع حسن نصر الله مش ممكن هيتوانا لحظة فى استرداد ما يمكن استرداده فى ارحلة الجاية دى والله انا فعلا سعيد بيك يا عباس وفعلا انت من اكتر الناس اللى فعلا الناس كانوا بيتشوقوا لسماع تقاريرهم ربنا يكرمكم جميعا ويخللى لينا قناة الجزيرة اللى فعلا يصدق أن تكون قناة الحقيقة والحرص على ثقافة العربى الأصيل ربنا يكرمكم جميعا وشاكر جدا كاتب المقالة الرائعة دى ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124905/http://www.20at.com/article2.php?sid=1197"

[[comments]]
order = 1
subject = "مشكلتنا في التفنيش"
author = "باحث عن الحقيقة"
posted = "2006-09-06"
text = "بداية تحية لعباس ناصر مراسل الجزيزة الذي نجح في التسلل لبيوتنا وقلوبنا خلال تغطيته الممتازة للعدوان الغاشم على لبنان.<br />والشكر موصول لعشرينات على إجراء الحوار.<br />نأتي للجانب المهني:<br />الحوار في مجمله جيد جدا، ولكن للأسف صياغته جاءت سيئة، مثل هذه الحوارات تحتاج إلى محرر يملك حس- مثل على عبدالمنعم - مع كامل احترامي لمن قام بتحرير الحوار، الحوار نص بلا روح مع أنه ملئ باللقطات الإنسانية.<br />أضف إلى هذا مشكلتي الدائمة معكم وهي الأخطاء اللغوية والنحوية وهذه مقتطفات من الموضوع، أوردها كما هي:<br />\"ولهذا قرر موفد عشرينات في لبنان خلال أيام الحرب مجاهد كثيرة أن يحرمه من الراحة ولاحقه بأسئلته خلال حوار أجراه معه بعد وقف إطلاق النار.\"<br />\"برغم أنى كنت أعد نفسي في كلحظة لمفاجأة\"<br />\"كنت أنتقل على الطرقات في المنطقة الحدودية في الجنوب للكرة الثانية\"<br />\"أنت تسأل عن شعور الأهل والأصدقاء وتواصل معي\"<br />\"لكن أكثر ما سبب لي مشكلة هو بكاء تبكي والدتي\"<br />وأعود وأؤكد – حتى لا أكون كالضيف الثقيل- موقعكم ممتاز، ولكن أنتم حتى الآن تعملون على شكل هواة، وليس كمحترفين... وأخيرا تحية لموفدكم في لبنان مجاهد شرارة، ونتمنى أن نرى لك موضوعات أخرى لا حقة، فلبنان في هذه الأيام منجم أفكار وموضوعات، ولم نرى منك حتى الآن إلا النذر اليسير اليسير.<br />Ahmed-editor@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124905/http://www.20at.com/article2.php?sid=1197"

