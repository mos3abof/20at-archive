text = "يا شيخ حسن نصر الله اعلمك ان جنازة اشهداء الثلاثه الذين سقطو في مدينة الناصره العربيه سار بها اكثر من 70 الف عربي فلسطيني من الجليل والمثلث ونقب وهتفو بصوت واحد بروح بدم نفديك يا لبنان بروح بدم نفديك يا نصر الله زاعلمك ان والد اشهداء الثلاثه استدعي من قبل اشرطه الصهيونيه لتحقيق معه لانه قال وبلحرف الواحد اهدي ابنائي اشهداء الى المقاومه البنانيه ولفلسطينيه واعلمكم ان الشارع الصهيوني هنا في فلسطين المحتله عام 48 يعيش حالة الهزيمه وبسبب كنم افواه الصحافه ومنعها من النشر اي خبر انا على استعداد ان اجيب عن اي سؤال يخطر في بالكم عما يجري هنا وانقل لكم الرد بكل امانه وصدق وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

