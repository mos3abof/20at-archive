[[comments]]
order = 79
subject = "أفيقوا أيها المسلمون"
author = "قطر الندى"
posted = "2006-07-23"
text = "كم هو من المؤسف أن نرى الذل الذي وصلنا إليه بحيث أصبحت شعوب العالم الإسلامي والعربي بالأخص, متعطشة لكلمة المقاومة وتجسيدها على ارض الواقع, حتى أنها عندما ترى مقاومة ما ضد العدو الصهيوني لا تفكر فيما إذا كانت هذه المقاومة ذات أغراض أخرى غير المقاومة, وهل مقاومتها ما هي إلى غطاء لمؤامرة على الأمة الإسلامية, وما تاريخ هذه المقاومة؟ ومع من تتعاون وتتآمر؟...<br />سبحان الله مع أنه بقليل من التفكير يمكن للجميع رؤية خيوط المؤامرة المحاكة على عالمنا الإسلامي واضحة جلية؟من لا يستطيع استيعاب قول الذي يقول بأن مقاومة وعمل حزب اللات ليست إلا مؤامرة, فليقرأ تاريخ الشيعة وعداوتهم للمسلمين, ومؤامراتهم المستمرة عليهم.<br />طالما يتساءل الجميع إن كان الأسيران يستحقان أن تدمر بلد كامل من أجلهما؟؟ وكيف أن العدوان الإسرائيلي غاشم. ولكن لماذا لا تسألون أنفسكم لماذا قام حزب اللات بعمل كهذا رغم أنه من المتوقع أن يكون الرد عدوان إسرائيلي غاشم على أراضي لبنان يهلك الحرث والنسل. لماذا لم تقم حزب اللات باستشارة حكومة لبنان قبل أن تجر هذا البلد إلى حرب مهلكة من أجل أسيرين؟؟ أولم يؤدي هذا العمل إلى قتل عدد من الناس يقارب عدد الأسرى الذين أراد حسن نصر الله تبادل الأسيرين معهم؟؟ بل وسيفوق عدد القتلى في لبنان أضعاف أضعاف هذا العدد. لماذا جاء هذا العمل الغير العقلاني بوقت تقف إيران الشيعية المجوسية وحكومة سوريا النصيرية وهم أبناء ديانة واحدة أمام تهديد أمريكي؟ وفي الماضي ألم يتعاون الشيعة في جنوب لبنان مع سوريا وإسرائيل بتقتيل وإبادة وإقامة المجازر لأبناء الشعب الفلسطيني المقاوم في جنوب لبنان؟ وووو والقائمة تطول. والآن جاؤوا بمظهر المقاوم لكي يكتسبوا حب الجماهير العربية المتعطشة للمقاومة ويجروا العالم العربي إلى مواجهة مع إسرائيل وأمريكا التي قد تقضي عليهم وهكذا يحلو الجو للمجوس الشيعة لكي يسترجعوا مجد أبائهم الفرس.قاتلهم الله<br />أفيقوا أيها الناس فإنها مؤامرة ذات أبعاد دينية وسياسية بعيدة. أفيقوا قبل أن يفوت الآوان. حسبنا الله ونعم الوكيل ولا حول ولا قوة إلا بالله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 80
subject = "المسلمين أمة واحدة يا قطر الندى"
author = "حسين"
posted = "2006-07-23"
text = "يقول الحق تبارك و تعالى في كتابه العزيز (( و إن هذه أمتكم أمة واحدة وأنا ربكم فأعبدوني)) و يقول صلى الله عليه وسلم مثل المؤمنين في توادهم وتراحمهم كمثل الجسد الواحد إذا اشتكى منه عضو تداعى له سائر الجسد بالسهر و الحمة<br />إن شيعة كما ذكر في المقال طائفة من المسلمين تجمعنا بهم شريعة الله و كلمة التوحيد و حب رسول الله و آل بيته و تجمعنا بهم القدس و فلسطين و الكثير مما يجمعنا على أن يفرقنا فلنعمل فيما أتفقنا و ليعدر بعضنا البعض فيمااختلفنا فيه و أقول والنتعاون على الإلتقاء فيما تفارقنا عليه لأن الاختلاف سنة كونية مقررة في القرآن الكريم لقوله تعالى (( تلك الرسل فضلنا بعضهم على بعض منهم من كلم الله و رفع بعضهم درجات و أتينا عيسى بن مريم البينات و أيناه بروح القدس و لو شاء الله ما اقتتل الدين من بعدهم من بعد ما جأتهم البينات و لكن اختلفوا فمنهم من أمن و منهم من كفر و لو شاء الله مااقتتلوا و لكن الله يفعل ما يريد))<br />ولهذا فإن الحديث على أن المقاومة اللبنانية جأت لتخذم إيران أوغيرها في الواقع ليس مبررا لأن الأمة تحتاج إلى من يأخذ بيدها و يرفع هامتها ويجمع صفها مثل ما فعل صلاح الدين الأيوبي الكردي الكردي الكردي و ما ذلك على الله بعزيز .<br />ياقطر الندى يا مدينة رسول الله يا يثرب لسنا بحاجة إلى التفريق بين المسلمين وحالنا مشتت بل نحتاج إلى كلمة حق و من كان يِؤمن بالله و يوم الآخر فليقل خيرا أو ليصمت .<br />نحن في الجزائر من شمالها إلى جنوبها و من شرقييها إلى غربيها دقنا معاناة اإستعمار الفرنسي البغيض وعرفنا أن الاستعمار يعمل على قاعدة فرق تسود و تعلمنا أن الاستعمار لا يريد الخير لشعوب العربية و الإسلامية وندرك عمق الصراع بيننا وبينهم و لا يزال يحاول المساس بهويتنا العربية و الإسلامية و تلك أيام طويلة بيننا و بينهم .<br />و لهذا ينبغي على الأمة أن تتوحد لآ أن تتفرق فتفشل و تذهب ريحنا .<br />و على الأمة أن تتكاثف حكامها و محكوميها على نصرة كل شبر من أرض العرب و المسلمين .<br />على الشعوب أن تتعاون فيما بينها مثل الجسد الواحد أن تبكي بكاء واحد لآلمها و ّلك أضعف الإيمان و لا ننسى إخواننا المرابطين في المقاومة اللبنانية و على رأسها السيد حسن نصر الله و لا ننسى إخواننا في فلسطين المجاهذة و إخواننا في حماس و الجهاد و فتح و الشعبية و كل طوائف المسيحيين الشرفاء من أمة العرب و السلام<br />مخرمش حسيناالجزائر mekhermeche@yahoo.fr"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

