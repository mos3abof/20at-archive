[[comments]]
order = 11
subject = "من يتكلم على لبنان بالسوء فليصمت"
author = "لبنانية"
posted = "2006-07-14"
text = "كل من يتكلم عن لبنان بالسوء فليلتزم الصمت..ان ما عاناه لبنان وطني الحبيب يفوق الوصف ..لبنان تحمل كثيرا والشعب اللبناني تحمل الاكثر ..ادا اردنا التكلم عن الفلسطنين لبنان كان الماوى الوحيد لهم في وقت رفضتهم الشعوب العربية ...لبنان وبعد الحرب رفض ان يبقى كما هو وابى وقام ليصبح لبنان الجميل الذي يدمره الاوغاد في هذة اللحظة ..ان من يتكلم عن لبنان ليس لبنانيا ولا يعرف ما معنى كلمة وطن وما يعني لبنان للبنانين نفسهم...وهذا ردا لو كان مجرد رد على شخص يتكلم ويطلق العنان لنفسه ويسمح لنفسه بالتكلم عن وطني الحبيب..فليصت والله المستعان . وكان الله في عوننا وعون اللبنانين المسليمن الذين يواجهون اليوم اعنف واقوى حرب تشهدها الامة العربية على الاطلاق ضد العدو الغاشم الصهيوني ...انها لست حرب على لبنان فقط بل على سوريا وايران وكل دولة عربية مسلمة تقول كلمة الحق كلمة واحدة هي :لا اله الا الله محمدا رسول الله ...وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

