text = "او انك واحد كبير بس جاهل عمره ماقراه<br />كتاب في حياته ويمكن حتي لم يسمع نشرة<br />اخبار باهتمام<br />ياريت تقرا وتثقف نفسك شويه علشان تعرف لبنان كان فين وبقي فين<br />والمجاهدين مش محتاجين دعوات الجهله من امثالك"
