[[comments]]
order = 50
subject = "تريثوا"
author = "شنيف"
posted = "2006-07-21"
text = "للنصرة على الأعداء لابد من اتحاد علماء الأمةثم الوحدة الإقتصاديةونعمل بيد واحدة لأن الذئب يأكل من الغنم القاصية ونذكرأن المنظمات الإسلاميةوغيرها هي انعكاس للإدارات السياسيةفلا تلوموها، نقول ياأحبتي الحرب الآن فيها لبنان فيهاايجابيات أولا على عدونا الأول إسرائيل وتخفيف الضغط على حماس ولكن فيها سلبيات كثيرةالعدو لإجل اسيرين أثنين هدم البنية التحية للبنان من يدفع الثمن غير العرب فهذا إستنزاف في الأبرياءوالمال أما الثانيةلفت الأنظار عن أهل السنة في العراق الذين يشردون ويقتلون ويذبحون في عقر دارهم من قبل الرافضةوبدعم من إيران فأين الإعلام منهم ثالثالفت الاتنظار عن خسارة العدوالمتجبر أميريكا في وحل العراق وغيره ثالثالبنان أصبح محط تجربة المعدات العسكريةالإسرائيلية فلا نفرح كثيرافنقول أين السيدنصر الله من أهلونافي العراق ألا يستطيع أن يكلم أو يضغط على إيران بعصاباتهاالصفويةلماذا هذاالإجرام على مساجدنا السنيةكونهم قالواربنا الله وغير ذلك سوف تتوغل إسرائيل في لبنانووتأخذ لقمة كبيرة منه فلا تلمعواكثيرة حزب الله يقاتل لنشرعقيدته المنحرفةفي سب ابو بكر وعمررضوان الله عليهم وسب عائشة أم المؤمنين لاتتعجلوا في الفرحة لنقاتل فقط لتكون كلمة الله هي العليافقط اللهم إضرب الظالمين بالظالمين واخرجنامن بين أيديهم سالمين اللهم آمين آمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 51
subject = "فات الكتير مابقى الا القليل باذن الله"
author = "خالد الفحام"
posted = "2006-07-21"
text = "يقال ان بنى اسرائيل عندما تاهوا فى صحراء سيناء 40 عاما ايام موسى عليه السلام,يقال ان ذلك كان امر له حكمه ربما مؤداها ان هؤلاء القوم الذين تربوا على قهر فرعون لهم ليسوا مؤهلين لدخول الارض المقدسه وكان لابد من الانتظار حتى ينشأ جيل آخر تربى فى الصحراء لا يهاب الموت -- وانا اعتقد ان امثال ذاك الجيل المتخاذل الذى يخاف من خياله مازال موجود بينناحتى الآن وفى عهده حدثت معظم نكبات العرب فى العصر الحديث --- لذلك لم يبقى علينا سوى الأنتظار ---- !!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 52
subject = "اللهم انصر حزب الله و حماس"
author = "محمد من جنين القسام"
posted = "2006-07-21"
text = "الله انصر الملسمين في بقاع الارض في<br />فلسطين و لبنان وفي جميع مناطق الاسلام...<br />اتوجه الى الحركات الاسلامية المقاومة الاسلامية في لبنان وفي ارض فلسطسن الطاهرة خاصة \"حماس\"و\"حزب الله \"<br />تلك الفصائل الموقرةو الموعودة بالنصر من عند الله على اعداء الامة والمسلمين وهم \" بني صهيانة \"<br />نحن نشد على اياديهم وننقول لهم نحن معكم وكل ضمير عربي حر معكم ........و ما اكثرهم.....<br />ولكن الحكام العرب ودورهم المغزي تجاهنا وتجاه لبنان الغالي<br />ولكن نقول لهم الى الخونة المتامرين على ايران وسوريا ولبنان وعلى حماس<br />قريبا جدا جداجداجداجدا .........<br />سوف نقوم \"الشعوب العربية \" بالانقلاب عليم ورجمكم وذالك اضعف الايمان<br />ابقوا في سباتكم نائمين ومتسابقين من الذي سيخدم الاسياد \" امريكا و الصهاينة \"<br />نقول حسبنا الله ونعم الوكيل ............<br />وانما النصر نصر ساعة ............."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

