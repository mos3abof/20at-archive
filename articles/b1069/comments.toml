[[comments]]
order = 83
subject = "تلك هي أخلاقنا و عقيدتنا يا قطر الندى"
author = "حسين مخرمش"
posted = "2006-07-25"
text = "نحن أمة راحمة و دود يا قطر الندي يامدينة رسول الله يا يترب حتى مع غيرنا لأننا ببساطة أصحاب رسول الله و أحبائه<br />و لن نقود العالم كما تقوده أميركا و الغرب بغطرسة و ازدواج المعايير فحينما يولد العالم الإسلامي من رحم الصحوة الإسلامية المباركة لتعود إليه الكرة ( بكسر الكاف و الشدة على الراء )<br />هذا هو طريق الحقيقي حسب فهمناالدقيق و إيماننا العميق من فكر و تصور مستقبلى<br />تمحى فيه الضغائن و تتآلف القلوب فلا داعي في أن نظلم جميع الشيعة فهناك أصحاب أداء معرفي و فهم سليم ومعتدل فعلى الأقل أن نكون أمة الوسط و نرتقي بأخلاقنا و أنفسنا عن فتنة تصيبناقوم و تلك والله قرة عين إسرائيل و من يناصرها<br />و صدق شوقي حين يقول<br />صلاح أمرك للأخلاق مرجعـه فقوم النفس بالأخلاق تستقـم<br />فالنفس من خيرها في خير عافية والنفس من شرها في مرتع وخم<br />نحن أمة وسط لا ضرر و لا ضرار و أحسب أن الله يخاطب من فوق سبع سماوات غيرنا من المسلمين بقوله تعالى (( تعالوا إلى كلمة سواء بيننا و بينكم )) الا نعبد إلا الله و لا يتخذ بعضنا بعض أرباب من دون الله .<br />تلك هي أخلاقنا و عقيدتنا و السلام ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 84
subject = "وماذا عن عقائد الشيعة؟"
author = "قطر الندى"
posted = "2006-07-25"
text = "إخوتي عندما نقرر أن ندعم أحد ونحيطه بهذه الهالة من الإعجاب والمساندة, يجب أن لا يكون على حساب عقيدتنا الإسلامية. فإن كنا نقول أن الشيعة مسلمون ويجب علينا مناصرتهم لأنهم مقاومون, فلا تنسوا أنهم هم لا ينظرون إلينا بهذه النظرة, بل في قلوبهم غل وحقد تاريخي ضدنا, يغطونه بما يسمى التقية, ولا يغرنكم هذا. وكيف تناصرون من يقول بأن قرآننا محرف وأن فيه زيادة أو نقصان وهذا من عقيدتهم, وقد كفر العلماء بالإجماع من يقول بتحريف القرآن الكريم. وأنا لا أقول أن الشيعة كلهم كفار, بل ما أنوه إليه أن عقيدتهم فيها ما يكفر, وأنها مختلفة عن عقيدتنا تماما. فإن كنت تقبل بقولهم بتحريف القرآن ولا يثير غيرتك سبهم أصحاب نبينا الكريم وبالتحديد الخلفاء الراشدين المبشرين بالجنة وعائشة بنت أبي بكر الصديق, فهنا لا يسعني إلا ان أصمت. وهذا فقط القليل مما في عقيدتهم من باطل. ولو أراد أحدكم أن يقرأ المزيد عن الشيعة والثورة الإيرانية فليقرأ كتاب \"وجاء دور المجوس, الأبعاد التاريخية والعقائدية والسياسية للثورة الإيرانية\". وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 85
subject = "معا نحو الهدف"
author = "حسين مخرمش من الجزائر"
posted = "2006-07-27"
text = "عندما اعلنت حكومة العربية السعودية بأن ما يقوم به حزب الله في جنوب لبنان على أنه مغامرة لم تكن السعودية تعبر عن مجاملة ودية لأميريكا وليس لكشف غطاء عن المقاومة و الفعل نفسه سارت عليه أنظمة أخري ليظهروا لنا ولائهم المطلق مع الدولة العظمى الحليفة و إنما كان بمثابة تعبير دقيقا عن حقائق سياسية قائمة .<br />فالمال و الحكومات و الخيرات و فوائض الأموال العربية و الشعوب مرهونة رهنا كاملا لسوق الدولار الدولية بمعني أن المال العربي الذي تراهن عليه الشعوب العربية في أ ن يكون في خدمة الأمة العربية يدور في حركة المال الرأسمالي الأمريكي و الأوروبي و الياباني و فوق هدا و داك اليهودي لا يمكن الركون إليه و المراهنة على فاعليته .<br />و تدليلا على دلك الاندماج التبعية للمال العربي بالمال الأمريكي هو الاتفاق السعودي الأمريكي الذي كشفه الدكتور هيكل في إٍحدى مقالاته في جريدة الأنوار سنة 1977 أثناء اجتماع مجلس محافظي صندوق النقد الدولي و أهم بنوده .<br />-آدا احتفظت زيادات الحساب الجاري للملكة العربية السعودية بمعدلاتها الحالية يتم تجنيب 5% من هده الزيادات إلى الاحتياط السعودي .<br />- توضع 87% من الرصيد المالي السائل الباقي بعد متطلبات الاستثمار السعودي في السوق الأمريكية بشروط طويلة الأجل<br />- توضع 50% من فوائض ميزان المدفوعات السعودي في استثمارات طويلة الأجل في الولايات المتحدة و كانت النسبة أنداك تساوي 17,2 بليون دولار سنة 1976.<br />- تم الاتفاق مع الحكومة الأمريكية على أن تكون لهده الاستثمارات فائدة قدرها 7,5 ، و أن الحكومة السعودية يمكنها سحب فوائد هذه الاستثمارات لتسوية حسابات مشترياتها من الموردين الأمريكيين و لشراء أسلحة أمريكية .<br />- أن الحكومة السعودية تتعهد بأن لا تزيد الاسعار المعلنة لبترولها عن 5% سنويا ، و دلك لفترة تنتهي في 31/12/1984 ، و لا يتأثر هدا الالتزام الذي تقبله الحكومة السعودية بأي قرارات تتخذها منظمة أوبيك خلال هده الفترة ، وعلى فرض أن منظمة أوبيك قررت رفع أسعارها بترولها فإن هدا الرفع لا ينطبق على البترول السعودي المصدر إلى الولايات المتحدة الأمريكية .<br />- و الأسئلة المطروحة في ظل الحرب الصليبية الصهيونية المعلنة على كل عربي طفلا كان أم شيخا ، صغيرا كان أو كبير ، مقاوم كان أم مناوئا لها شيعي أم سني.<br />- لماذا ترفض أمريكا قرار يوقف إطلاق النار ؟ أ لأنه لا يناسب الصهاينة أم لا يناسب حلافائها العرب بعد أن أبلوا بلاء لا ظهير له سياسيا و أفشلوا قمة عربية ؟<br />ما مدى استمرار المقاومة؟ و هل يمكن للمقاومة اللبنانية الثأثير على ما وراء ميدان القتال ؟ أرجوا أن تضع خط عريض تحث هدا السؤال<br />عندما يتكلم الحكام أمام المؤتمرات و كاميرات العالم هل يتكلمون باسم شعوبهم أم برصيدهم المالي المودعة في خزائن الرأسمال الأمريكي و اليهودي ؟<br />هل حقق الحكام العرب لشعوبهم مستوى معيشي يليق بعصرنا في ظل السلم المزعوم و الاتفاقيات المبرمة ؟<br />هل قبل الكيان الصهيوني قرارات مجلس الأمن السابقة و هي عديدة و متنوعة و الداعية للإنسحاب و قيام دولة فلسطينية و وقف إطلاق النار ؟<br />لمادا يراهن عمر موسى على مجلس الأمن وكوفي عنان لاستصدار قرار بوقف اطلاق النار و حتى و إن حدث هدا ؟ هل ينفده الصهاينة مثل ما ينفد العرب قرارات مجلس الأمن ؟<br />فلماذا الضحك على المواطن العربي من خلال هده الخرجات المسرحية الموهمة ؟<br />هل علم الحكام بأن إعصار الشعوب قادم و أن التاريخ شاهدا و إلى ربهم يحتسبون ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

