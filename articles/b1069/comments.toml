[[comments]]
order = 19
subject = "الله يرحم العرب"
author = "حزينة على العرب"
posted = "2006-07-17"
text = "السلام عليك يا من تقرأ تعليقى، انا مش عارفة اقول ايه، يا ترى الدور علينا امتى، يا جماعة اسرائيل دى مش عايزة غير شوية ناس يخضوا فيها يقتلوا نفسهم ويخلصونا من الخونة والظلمة لازم نضربهم فى ارضهم لازم نتعلم بأه هما لانهم بيغتصبوا الأراضى فدايما بيهجموا فى ارض غيرهم لعنهم الله علشان كده احنا مش عايزين ندافع احنا لازم نهاجم بأه يلعن امريكا واسرائيل وكل الكلاب والخونة الله يلعنهم النار وبئس المصير ان شاء الله ولو كنا هنبقى شياطين خرس يبقى فين السلاح والفلوس حتى اللى نمدها للمجاهدين اللى بيدافعوا عن ارضهم وحياة اولادهم ومستقبل جيلهم لازم نقتل اسرائيل فى بلدها والمدنيين يتوعهم اولاد حرام لان اليهود لا دين لهم حرفوا كل حاجة واحلوا لنفسهم كل حرام الله يلعنهم فين ما يكونوا المنبوذين فى الارض العرب خلاص همهم على بطنهم وبس مش عايزين غير الاكل والنوم والجنس الله يرحمهم معقول خمس دول بس تنعقد علشان مناقشة الوضع الحالى معقول فينك يا سعودية فينك يا تونس فينك يا دول الخليج ولا خلاص الدم الامريكى والانجليزى والفرنساوى بأه جواكم وخلاص بقيتكم باردين على العموم الشهداء اللى راحوا هيخشوا الجنة لانهم ضحايا سلبتتنا وضعفنا هما قبلوا بجنه الله واتحملوا نار العبد الصهيونى احنا بأه قبلناجنة الكفار وياريت بأه نتحمل نار الحى الذى لا يموت، الله يلعن أبو ده زمن اللى خلانا نتفرج بكره تروح عينينا قدام ربنا لما يسألنا عملتوا ايه يا مسلمين، حسبى الله ونعم الوكيل والله يلعن الصهاينة والشياطين الخرس.والسلام ختام اذا كان فيه سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 20
subject = "باي حق يسمى حزب الله مجاهدين"
author = "القادم من الشرق"
posted = "2006-07-21"
text = "قليلاًً من الحكمه ايها المسلمين ، ايعقل ان يتم اغتيال شعب بكامله وتهديم بنيته التحتيه واهلاك الحرث والنسل من اجل تصفية بعض الحسابات ، ثم باي حق تسمون حركة حسب الله بانهم مجاهدون الم تشاهدو الشيعه في لبنان ماذا يفعلون اليس فيكم رجل رشيد ، ايها الساده ان يتم تخريب بلد بكامله وتهجير شعب اعزل من بلده من اجل ان نغفل عن العجوز الايرانيه وبرنامجها النووي ، وعملياتها العرقيه في العراف على ايدي مليشياتها واغتيال العقول العراقيه عموما والسنيه على وجه الخصوص كيف لنا ان نسمي حزب الله بانه مجاهده بل والله انه حزب اللات ،<br />ان اقدام حزب الله على هذه المغمامره الغير محسوبه انما هي من تخطيط وتدبير الدوله الصفويه ايران وحليفتها النصيريه سوريا لذا قليل من الحكمه ايها العقلاء .<br />ياشعب لبنان اننا نألم لكم ونحس ماتعانونه ولاكن آن للحكومه اللبنانيه ان تبسط صيطرتها على لبنان وان تحاسب هذه المليشيه على مغامراتها تلك .<br />اللهم انصر اخواننا من اهل السنه والجماعه في لبنان.<br />المملكه العربيه السعوديه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 21
subject = "النصر للمجاهدين"
author = "mahmood"
posted = "2006-07-21"
text = "قلوبنا معكم ايها المجاهدون لنصرة الاسلام وندعو لكم بالنصر علي الصهاينه الخنازير ونقول لكم اصمدو ان الله معكم اذا تخلي عنكم القاده العرب فهذا شئ ليس بجديد عليهم واقول للقاده العرب ماذا ستفعلون عندما تقفون بين ايدي الله الان تخافون من امريكا والله خير ان تخافوه الله المستعان افيقو من نومكم قبل فوات الاوان فان الذي تزبحهم اسرائل هم عرب ومسلمين ومن حقنا الدفاع عنهم يقول الرسول الكريم عليه الصلاة والسلام انصر اخاك ظالم او مظلوم وانتم تعرفون المعني فان الشيخ حسن نصرلله اثبت انه جدير بحب الشعب له ونتمني له الانتصار ونرجو من كل مسلم ان يصلي من اجل انتصار حزب الله الا ان حزب الله هم الفائزون وحسبنا الله علي الظالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

