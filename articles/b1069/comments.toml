[[comments]]
order = 61
subject = "allharbou ala loubnane"
author = "majid"
posted = "2006-07-21"
text = "alhamdou lillah wahdah wa assalat alla mouhamad wa lahoumma arda alla abou-bakr wa otman wa omar wa ali wa man tabi-ahoum bi ihssan ila yaoumi addine amma baaad<br />li nolahid maa tatowouri al-ahdath mina al-iraq kayfa hawalou tadlil arraay al-amm tadmir asslihat addamar achamil wa hinama akhfakou khalakou mouharabat al-irhab, noulahid nafss attarika allati abtadaouha tatarraka ilayha assahyouni fi khitabihi alharbou ala al-irhab kama dakara fi khitabihi likassbi arraay al-amm al-harbou ala hizbou allah houwa al-harbou ala al-qaida wa al-harbou ala hassan nassr allah nasarahou allah inchaa allah houwa al-harbou ala ben laden wa lakin al-mojahidine fi sabili allah la yamoutoune wa hada waadoune min inda allah<br />wa ikhraj sourya min loubnane bi moussaadate al-oumalaa min houkkamina al-mounbatihine wa almoukhabarat assahyouniya waatoghat alamrikane wa oumala-ihim fi loubnane kana ka tarika li tasshil wa takhtit li channi hadihi al-harbou ala hizb-allah alladi<br />la youhzam wa la youkssar inchaa-allah<br />hizboun youharib bi abssatti ma indahou wa da-oulatoun moujayachatoune naimatoune<br />wa allah yanssouraka ya ayouha al-batal inshaa-allah takouna khalifatoun lilmousslimine<br />wa assalamou alaykoum warahmatou allahi wa barakatouhou"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 62
subject = "الحناكيش"
author = "العربى"
posted = "2006-07-21"
text = "الحناكيش<br />في ظل الدمار الرهيب والخراب المحدق بلبنان .. وفى ظل ذالك التأييد الأعمى للعصابة الحاكمة للكيان الصهيوني من دوله الشر الأمريكي .. واز لامها في الاتحاد الأوربي<br />نجد من يخرج علينا .. من حكامنا الأشاوس المغاوير ليحمل حزب الله .. والمقاومة الإسلامية.. مسئوليه ما يحدث ألان<br />ويبدو .. أن حكامنا الأشاوس المغاوير لم يتبنوا هذا الموقف من فراغ ..<br />بل يمكنك القول .. وأنت مطمئن القلب .. بأنه أوحي إليهم به من قبل نبي الديموقراطية<br />والحاكم المؤمن التقى ... بوش الصغير<br />وحكمانا بذالك .. يكونوا أوصلوا الرسالة كأمله لشعوبهم غير منقوصة<br />وهى : أن الرهان على تلك الحكومات .. في مواجهه المشروع الصهيوني<br />هو رهان خاطئ... فتلك الحكومات ما كانت تتوجه بالسلاح فقط إلا لقمع وإذلال شعوبها<br />2: أن الرهان الحقيقي هو على تلك المقاومة الشعبية .. في كل من فلسطين .. ولبنان وعلى سواعد ما تبقى في عروقهم دماء حره من أبناء هذا الوطن<br />3: أدركنا جميعا انه لاوجود لما يسمى بالشرعية الدولية ... فتلك ماهى ألا أوهام<br />في ذهن الضعفاء.. فقط<br />4: أن هذا العدو الصهيوني لا يعرف فقط غير لغة الرعب ... وفيما عدا ذالك فهو ضحك على الذقون<br />واما حكامنا الأشاوس المغاوير ... وبعد آن فاض كيل شعوبنا بقراراتهم المتخاذلة الضعيفة<br />.... او حتى سياستهم تجاه شعوبهم والتي آدت آلي أضعافها.. وإذلالها .. داخل أوطانها فلا يستحقون آلا آن يقال عنهم غير انهم ... مجموعه حناكيش<br />العربى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

