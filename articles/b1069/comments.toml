text = "بسم الله الرحمن الرحيم<br />ولا تحسبن الذين قتلو في سبيل الله امواتا بحل احياء عند ربهم يرزقون .. صدق الله العظيم.. تحية اجلالوكبرياء الى شعبنا المرابط في لبنان الصمود وفي فلسطين البقاء .. بحكي للاخوان في لنان لازم تبقو صامدين لان المعركه معركة بقاء ومعركة امه بالكامل<br />كما قال قائد الامه العربيه والاسلاميه .. السيد حسن نصر الله .. وانها معركه جهاد او استشهاد حتى النصر انشاء الله<br />والسلام خير ختام"
