[[comments]]
order = 66
subject = "حرب عالمية تالتة"
author = "احمد"
posted = "2006-07-21"
text = "سم الله الرحمن الرحيم<br />النصر ات ات ات ان شاء الله<br />اعتقد ان حزب الله لن يسلم الجندييت الاسيرين لاسراءيل الا عن طريق تبادل الاسرى واسراءيل لن تفعل هذا لان هذا معناه خسارتها من حزب الله وخسارة جديدة وجرح جديد من لبنان هذا البلد الصغير وكذلك اذا سلم حزب الله الاسيرين دون مقابل فهذا يعنى هزيمة ، وكل من اسرْْءيل وحزب الله لن يفعل هذا لذا اعتقد ان الحرب طويلو ومستمرة ولكن هل ستدخل الدول العربية فى هذا الحرب لانها اذا لم تفعل هذا ستتكرر ماساة فلسطين فى لبنان لانه اكيد اكيد ستدخل امريكا وحلفاؤها فى هذه الحرب بجانب السراءيل طبعا ،ولذلك اعتقد قيام حرب عالمية تالتة سواء شاءوا الحكام العرب او لم يفعلو لانه بالتاكيد لن تسكت الشعوب العربية عن هذا<br />وشكرا<br />احمد العجوز"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 67
subject = "لماذا لايريد احكام العرب حرب جديدة"
author = "احمد"
posted = "2006-07-21"
text = "سم الله الرحمن الرحيم<br />السبب الحقيقى لعدم ارادة الحكام العرب الخوض فى حرب مع اسراءيل<br />اعتقد ان الحكام العرب الذين خذلوا شعوبهم وخذلوا لبنان وحزب الله وشجعوا اسراءيل كى تغعل ما تشاء لا يريدوا دخول حرب جديدة مع اسءايل لسبب وحيد<br />ليس خوفا من الهزيمة<br />ليس خوفا من اسراءيل<br />ليس خوفا على جنودهم وشعبهم<br />وليس خوفا على اقتصاد بلدانهم<br />وانما خوفا على كرسى كل منهما فكل منهما يرى امام عينيه مصير صدام حسين وياسر عرفات فكل منهما لايريد ان يخسر الحكم والملك فقد نسوا ان الحكم والملك لله وحده فقد نسوا ان الوطن فوق الجميع كل منهما يخاف ان يذهب منه الحكم فاى حاكم عربى اذا دخل الحرب سيكسب حب واحترام شعبه سواء كسب الحرب اولم يكسبها سواء فعل شيا او لم لم يفعل كفى انه كانت لديه الشجاعة الكافية للمغامرة بحكمه وسلطته<br />ولذلك اعتقد ان شبح الخوف من ضياع الحكم والسلطان والنفوذ هم الذين يمنعوا الحكام العرب من مساندة لبنان وشعبها وحزب الله وكذلك فلسطين والعراق<br />فسامح الله كل منهما وجزاهما شر جزاء لما فعلوه بنا وبالشعب العربى والامة الاسلامية<br />وشكرا احمد العجوز/مصر<br />gypton89@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

