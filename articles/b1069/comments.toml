subject = "حال الامة (بتصرف)"
author = "عربي"
posted = "2006-07-21"
text = "كيف انحدرت الأمة من مستواها الرفيع إلى ماهي عليه الأن حتى صارت ذلك الغثاء الذي أخبرنا عنه رسول الله صلى الله عليه وسلم: « يوشك أن تداعى عليكم الأمم كما تداعى الأكلة إلى قصعتها. قالوا : أمن قلّة نحن يومئذ يا رسول الله؟ قال: بل أنتم يومئذ كثير، ولكنكم غثاء كغثاء السيل. ولينزعن الله مهابتكم من صدور أعدائكم, وليقذفن في قلوبكم الوهن. قالوا: وما الوهن يا رسول الله؟ قال: حب الدنيا وكراهية الموت»<br />ولقد خُيِّل لبعض المستضعفين المنهزمين أمام الحضارة الغربية, الذين استعبد الغزو الفكري قلوبهم وأرواحهم، أن ضعف المسلمين وتأخّرهم كان نتيجة حتمية لتمسكهم بالإسلام !!<br />وأن الإسلام كان حركة تقدمية يوماً ما! أي بالنسبة لوقته! وأنه فعل ما فعل في النفوس بسبب أنه كان بالنسبة لوقته حركة تقدمية, فدفع الحياة كلها إلى الأمام ولكن دوره انتهى كحركة تاريخية وموقف تقدمي, لأنه بقي مكانه فسبقه \"التطور\"، فأصبح من ثم حركة رجعية! لم يعد صالحاً لمواكبة التطور الحديث؛ بل صار معوقاَ ينبغي طرحه والبحث عن بديل منه, والبديل هو الحضارة الغربية.<br />إن الذي تخلّف لم يكن هو الإسلام.. وإنما \" المسلمون \"!!<br />وقد تخلّفوا لا لتمسكهم بالإسلام, ولكن لتخليهم عنه, وتفريطهم فيه.. أما الإسلام فما زال هو الدين الحق, وما زال هو الطريق الواصل, وما زال هو الطريق المستقيم.<br />تخلّف المسلمون لبعدهم عن حقيقة الإسلام, وإن بقيت لهم بعض مظاهره.. لقد بقي لهم أنهم ينطقون بأفواههم \"لا إله إلا الله محمد رسول الله\". فهل يعون معناها أو يعرفون مقتضياتها؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

