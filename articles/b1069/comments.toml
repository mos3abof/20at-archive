text = "احي اخواني الذين هم في خط المواجهه الابطال .ملتقانا بالجنه انشاءالله<br />بدلا من المهاترات الذي لا يجلب من واءها شي الا الحقدواالكراهيه .<br />على اخوانا فتح جبهات قتال داخل لبنان ضد العدو الصهيوني الجبان.<br />والله ثم والله ان الشباب دماهم تفور لملاقات العدو الغاصب سوء كانو من ابناء السنه او الشيعه .<br />اخواني اما ان تعلقوا امالكم على الحكام المتخاذلين فهم لم ولن يقدموا شي يعيد للامة مجدهاوكرامتها.<br />فحيوا المقاومه التي هزت كيان المعتدي..<br />الله واكبر والعزة لله ورسوله والمومنين."
