author = "فطر الندى"
posted = "2006-07-24"
text = "أهلا بتعليقك وسهلا أخي الحسين, رغم أني لا أتفق مع أفكارك بتاتا وليس من الضروري أن أتفق.<br />قد بدأت تعليقك على ما قلته بأن ما يجمعنا مع الشيعة هو شريعتنا الإسلامية, وكلمة التوحيد وحب رسول الله وآل بيته والقدس وفلسطين, ويبدو أنك لا تعلم بعقائد الشيعة ولا مبادئهم وتاريخهم الأسود ومؤامراتهم ضد أبناء الأمة الإسلامية. ولا تعلم أنه من عقائدهم هو عدم الإيمان بكتابنا المنزل القرآن الكريم, وسب الصحابة رضوان الله عليهم المبشرين بالجنة وتسمية عمر رضي الله عنه الذي أطاح بحكم الفرس بإبليس الأبالسة وأبا بكر وعثمان بالأبالسة, كما يؤمن النصيريون وهم من فرق الشيعة بتأليه علي وتناسخ الأرواح والخ. وأنه من أمثال مؤامراتهم ودسائسهم المستمرة على المسلمين تعاون الدولة الصفوية في إيران مع الانجليز, وإفساح لهم المجال لنشر ديانتهم وإرسال المبشرين والقسيس, وتعاونهم ضد الحكم العثماني بينما هو مشغول بفتح اوروبا. والقائمة تطول وتطول ولا مجال لسردها هنا.<br />ولكن إن شئت التحدث تحديدا عن الشيعة في لبنان فمن المعروف أنهم ذبحوا بأبناء الشعب الفلسطيني الذي كادت مقاومتهم في جنوب لبنان تودي بأبناء القردة والخنازير, وبمعاونة من سوريا النصيرية وإسرائيل. وبعدها ظهرت حزب الله في الجنوب ولم يكن لها وجود هناك عندما كان المقاومون الفلسطينيون, وظهرت في مظهر المقاوم وكلها مسرحية بشعة تنطلي على شعوب أمتنا المغفلة للأسف. فكيف تقول لي أننا بحاجة إلى من يأخذ بيد أمتنا وأنا أقول لك أن تاريخهم حافل بالمؤامرات وتقتيل الفلسطينيين, وهل قتلنا هو الأخذ بيدنا. فلنجزم أننا سكتنا وباركنا لهم هذه المقاومة, فما أدراك ما هي نظرتهم إلينا, وأنهم لن يجذوا رقابنا عندما تسنح لهم الفرصة كما يفعلون في العراق عندما يخطفون العشرات من الذين يسمون عمر ويقتلونهم جميعا انتقاما من عمر بن الخطاب الذي قضى على حكمهم في فارس إيران.<br />هناك الكثير يمكن أن يسرد في هذا المجال, فهم لا يخفون عداوتهم علينا ولكن نحن من نفضل وضع غشاوة على عيوننا لكي لا نرى خيانتهم. أفيقوا فقط وتساءلوا فبل أن يئين أوان رقابنا لكي توضع في المقصلة والسلام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

