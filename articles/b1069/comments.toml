[[comments]]
order = 93
subject = "لبنان دروس وعبر"
author = "حجاج أبو شكيب"
posted = "2006-08-03"
text = "دروس و عبر من لبنان<br />العدو الصهيوني لن يوقف ممارسة سياسة الأرض المحروقة و التوسع في الأراضي العربية ما أستطاع سبيل، و عيونه من طهران إلى ما وراء وهران مدعوما بآلة الحرب و ساسة الغرب ، و السبيل الوحيد لقهر جبروت اليهود كما تعلمنا من درس المقاومة هو أن يستثاب بعض حكام العرب عن سكوتهم و تنازلهم و يحاسبون أمام التاريخ لما لحق شعوبهم من الذل و ضياع لمكانتهم بين الأمم و ضياع القدس ولا حل لداك كله إلا بالعودة إلى ينابيع هويتهم و صمامها الأمين ، الدين الإسلامي الذي أدار الحكام ظهورهم بعد أن تربوا في بيوت و موائد غريبة عن بيئتهم و أصبحت حياتنا بهم في بحر لجي و ظلمات بعضها فوق بعض .<br />و لا حل لمشكلاتنا السياسية و الاقتصادية و الاجتماعية إلا أن نعود إلى منهج الهداية منهج محمد صلى الله عليه وسلم و كل من سار على دربه و لنا في دلك عبر من المقاومة في لبنان و الفئة القليلة عددا وعدة و كتائب القسام و غيرهما من الحركات المتواضعة فاستطاعت بعون الله أن تقهر جيشا لا يقهر و أسطورة لا طاقة لنا بإسرائيل و جنوده فأرهبت نفوس المتخاذلين و القاعدين الذين لم يجدوا سوى مبررا مغامرة الشيعة ليصدروا لنا فتاوى مشوهة لا ترى إلا بأعين ممن وظفهم على المجامع الفقهية فنسو حظ الآخرة .<br />فشوهت المنظومات التربوية و الإعلامية بفعل المقص هنا وهناك و شجع التدين المغشوش و كلام المحشوش و غرست الرذيلة و فساد الشعوب ليجهز بالاحتواء لظاهرة الصحوة الإسلامية الأصيلة تحث مسميات مختلفة و يسهل على ساستنا استبدادنا و استعبادنا و تسليم رقابنا لقوم يفعل بها ما يشاء و العبرة من درس لبنان فهل فهمت شعوبنا مشاركة حكامهم في الخفاء و العلن في للعبة المفتش و الجلاد ...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 94
subject = "محمد حسان والتكفير"
author = "محمد حسان والتكفير"
posted = "2006-08-10"
text = "انهال العشرات من المصريين بالضرب علي امام مسجد في محافظه بورسعيد شمالي البلاد لانتقاده حزب الله لبنان .<br />وقالت صحيفه \"المصري اليوم\" المصريه اليوم ان امام المجمع الاسلامي الكبير في مدينه بورفواد بمحافظه بورسعيد ويدعي الشيخ محمد حسان فوجي‌ء بعد انتهاء خطبه الجمعه امس بعشرات المصلين ينهالون عليه ضربا وركلا حتي نزف الدم منه وانه لم ينقذه من بين ايدي المصلين الا رجال الامن.<br />واوضحت ان الشيخ حسان \"انتقد حزب الله مروجا لفتوي لرجل دين سعودي عن حرمانيه نصرته الامر الذي اثار المصلين الذين هددوه بالقتل ان عاد للمسجد مره اخري\".<br />واشارت الصحيفه الي ان هذه الواقعه هي الثانيه خلال اسبوع واحد التي تحدث في مصر التي يتمتع فيها حزب الله لبنان وزعيمه حسن نصر الله بشعبيه كبيره."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

