posted = "2006-07-21"
text = "الى كل مسلم يغار على دينه الى كل عربي فيه ذره من الشرف انها معركه الشرف والكرامه يقودها سيف من سيوف الله السيد حسن نصرالله واطلب منكم ان تكفوا من كتابه اعلامكم ان تجعلوا فلسطين ما يسمى اسرائيل انها شمال فلسطين وليست شمال اسرائيل اناشدكم بالله ان تصححوا اعلامكم وخاصه اعلام الجزيره والعربيه نسال الله الثبات في ارض الرباط النصر او الشهاده اخوكم ابو بلال"
