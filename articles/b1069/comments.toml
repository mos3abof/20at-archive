[[comments]]
order = 4
subject = "رسالة الى واحد"
author = "صامدون"
posted = "2006-07-13"
text = "اولا : المجاهدين محتاجين دعوات كل امة محمد<br />ولو انتا ماتعرفش فضل الدعاء فدة جهل منك بامور دينك و عندك الكتب الدينية كتيير<br />ثانيا : يا بتاع نشرات الاخبار .....لبنان كان فين و بقى فين<br />قولى يا مثقف يا متعلم يا متنور<br />كان فين .....فى حرب اهلية قادتة الى الاحتلال الاسرائيلى<br />ولسة لحد دلوقتى دولة غير مكتملة النمو و المرافق و الخدمات و البنى التحتية و كازال يسبح فى غياهيب الامبراطورية الفرنسية و السيطرة السورية<br />صح ..........كان فين لبنان و بقى فين هاه شوف حالة الان عامل اذاى لو انتا شايف ان اللى لينان فية الان دة انجاز<br />فاكيد مفيش اى امل فى اى شعب عربى طالما اصحاب النظر المحدود من عينة مد رجليك على قد لحافك موجودين ........لا و اية كمان بيتكلموا و بيغلطوا الناس التانية<br />نصيحة ....بلاش تفرد على الناس فى التعليقات بكام كلمة من بتوع حمادة و توتو<br />و لو عندك كلام و معلومات قولها فى انجاز و وضوح من غير هرتلة و لا تجريح شخصى<br />مع السلامة يا بتاع الاخبار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 5
subject = "تحيه من القلب الي مجاهدي حزب الله"
author = "حمدي"
posted = "2006-07-13"
text = "ما زال في هذه الامه رجال صدقوا ما عاهدوا الله عليه<br />ما زال في هذه الامه رجال يعرفون معني العزة والكرامه والتضحيه من اجل نصرةالاسلام والمسلمين<br />مازال هناك في الامه رجال يعرفون اعداء الامه الحقيقين ولم ينجروا الي صراعات مذهبيه او طائفيه<br />أهنيء حزب الله ورجاله فانتم بين النصر والشهادة فائزون في كل الاحوال<br />اين انتم يا علماء الامه مما يحدث<br />اين انتم يا علماء الازهر ممايحدث ام لم تصدر لكم التعليمات بعد لكي تعلقوا علي الموضوع<br />اين انتم يا علماء ال سعود مما يحدث ام انكم مشغولون في اصدار فتاويكم الجهبذيه في عدم جواز قيادة المراه السياره وعدم جواز النتف من شعر الابط<br />اللهم انصر المجاهدين في حزب الله وفي فلسطين واهزم اعدائك اعداء الدين من اليهود والكفار الملاعين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 6
subject = "واحد"
author = "انا اسف لتجاوزي في الرد السابق لكن كلامك استفزني فليس هذا الوقت المناسب لتنتقد فيه لبنان واللبنانين ابدا"
posted = "2006-07-13"
text = "يا رجل انهم يواجهون اعداء الامه الا نؤيدهم ولو حتي بالكلمات ونحن نجلس في بيوتنا وبين اهلنا بينما هم يعرضون للقصف والضرب بالطائرات والمدافع لانهم يدافعون عن شرف الامه<br />لكن علي العموم لبنان ذو وضع خاص نتيجه لتركيبتها السكانيه الطائفيه المركبه والمعقده مما جعلها ساحه لتصفية الخلافات العربيه في فتره من الفترات<br />وجعل كل طائفه تحاول ان تستقوي باطراف خارجيه من اجل توسيعه نفوذها داخل الدوله علي حساب الطوائف الاخري كما كان هناك اعتقادا سا ئدا لدي بعض السياسين البنا نين ان لبنان هذه الدوله الصغيره تتمثل قوته في ضعفه<br />لكن علي كل حال فرغم كل الحروب والماسي التي شهدها لبنان فقد خرجت فئة ممثل حزب الله مجاهدين صادقين لا يخشون الا ربهم ويتمتعون بقدر كبير جدا من الحنكه والخبره السياسيه فهم يعرفون متي يضربون وكيف يضربون ويعرفون قوة الخضم و كذلك موازين القوي العالميه وهذه ميزات صدقني تفتقدها قيادات اكبر الدول العربيه<br />وانجازاتهم خير دليل علي ذلك<br />فهم اول من حقق انتصار عسكري حقيقي ادي لانسحاب الصهاينه دون تقديم اي تنازل رغم قلة الامكانيات بالمقارنه بعدو يمتلك احدث ترسانه عسكريه في الشرق الاوسط<br />وكما قال الرجل الصادق والمجاهد الكبير حسن نصر الله لبنان الان ليس لبنان منذ عشرين عام والفرق بسيط جدا لكنه مهم جدا<br />هو تلك الاجيال المؤمنه التي تم تربيتها علي مدار تلك السنين علي حب الجهاد والاستشهاد في سبيله هذا التكتل البشري المقاوم الصلب لم يكن موجودا كما هو الان منذ عشرين عاما<br />والسبب الثاني والاهم هو حزب الله وقيادته الواعيه المستنيره والتي لا تقدم علي عمل لا تدرك عواقبه فتسليح حزب الله من افضل الي افضل وامكانيته تتطور بشكل كبيرا جدا رغم كل الضغوط والصعوبات التي يواجهها<br />اطمئن يااخي حسن نصر الله يعرف ما يفعل جيدا واراد ان يخفف الضغط عن المقاومه الفلسطينيه ولكن الجهاد لابد لها من ضريبة تدفع<br />اسف مره اخري علي تجاوزي في الرد السابق<br />اللهم انصر المجاهدين في كل مكان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 7
subject = "رسالة الى واحد"
author = "صامدون"
posted = "2006-07-13"
text = "متشكر على اسفك المقبول و سعيد بتعليقك<br />و اؤيدك فى كثير مما تقولة<br />لكن لا تنسى ان اسرائيل انسحبت من الجنوب فى ظروف نظروا اليها وقتها على انها غير مقبولة ( متمثلة فى الاشتبكات المستمرة مع المقاومة الاسلامية و الخسائر البشرية القليلة التى تتعرض لهااسرائيل )<br />و كانوا يعتقدون انها ستنتهى بالانسحاب من الجنوب<br />و هدات الامور نسبيا بشكل مؤقت و لكن مع هذا التصعيد الاخير لحزب الله<br />اخشى ان ينفذ صبر اليهود و يفقدوا صوابهم كما يفعلوا دائما و تكون بداية سلسلة لمذابح اخرى<br />لذى اتمنى ان يكون الامر هذة المرة مثلما تقول خاضع للتخطيط المتقن و الدقيق اخذا فى الاعتبار بعد النظر فى العلاقات الدولية و الازمات الاقليمية فى الشرق الاوسط<br />فى النهاية اود ان اسجل سعادتى بتطور مدى صواريخ حزب الله ليصل الى مدن الشمال الاسرائيلى<br />ربما نحقق جزء من نظرية توازن القوى و الردع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

