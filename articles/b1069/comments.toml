[[comments]]
order = 25
subject = "خـــــــــايـــــــف؟؟"
author = "حمادة"
posted = "2006-07-21"
text = "حقـا كنت اتمنى ان اكون واحد من هذه المقاومه التى فعلا هى الان تدافع عن شرف وكرامه هذه الامه<br />الامه التى تفرقت ولم تتذوق يوما طعم الانتماء والوحده العربيه ..<br />هذه كانت فرصه للجميع..<br />اولا بالنسبه الى شباب هذه الامه وانا منهم كانت هى فرصه لكى ننال الشهاده ونحن ندافع عن شرف وعزة وكرامه امتنا الغاليه<br />فعلا خايف تكون دى اخر حرب مع العدو الصهيونى على الاقل في هذه الافتره التى كانت هى فرصه لنا لكى يكرمنا ربنا بالشهاده ولكن الحمد لله<br />ثانيا<br />كانت هذه الازمه هى ايضا فرصه<br />وفرصـه ذهبيه للحكام العرب المستبدين<br />حتى يتصالحوا اولا مع انفسهم ومع شعوبهم<br />ولكن الله كريم<br />رساله حب وشوق لمجاهدين فلسطين ولبنان<br />الله يكرمكم الان لانكم تواجهون عدو الامه وليس عدوكم فقط<br />واعلموا ان شباب الامه وخاصه شباب مصـر الغاليه يتمنون لو يكونوا معكم<br />واخيرا<br />وليس بالاخير<br />النصر والعزة للاسلام والمسلمين<br />ابشروا يا شباب دام هناك رجال في هذه الامه مثل رجال المقاومه الاسلاميه بفلسطين ولبنان<br />وايضا دام هناك رجل حكيم مثل<br />حسن نصـــــــــر الله<br />ان شاء الله سيكون النصر والعزة<br />حليفان للمسلمين<br />لبيــــك يا نصــــر اللــــــــه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

