[[comments]]
order = 0
subject = "صامدون"
author = "صامدون"
posted = "2006-07-13"
text = "للمرة المليون تانى هاعلق على لـــبنــان هذا البلد المستفز<br />يعنى اية بلد فى حالة حرب و مواجهة مع الصهاينة....... ما يكونش عندها من ما قبل الحرب الاهلية فى 1982 نظام للدفاع الجوى او جيش نظامى ارضى متمركز على الحدود<br />مش ممكن اذاى اللبـنـانـيــن يقبلوا ان الطيران الصهيونى يخطرق اجواء بيروت بكل هذة السهولة<br />بيروت دى العاصمة المفروض يكون افضل تحصين و تامين فيها...... امال باقى المناطق و الاقاليم هاتبقى عاملة اذاى؟<br />لـبنــان ما اتعلمتش ابدا من الدروس من الحروب مع الصهاينة ...... من بعد الانسحاب من الجنوب لم يحدث اى تطوير للجيش ولا تدريب للكوار و لا استحداث اسلحة جديدة للدفاع<br />من الاخر لبنان مفهاش جيش ...... هما كلهم معتمدين على حزب الله المتمركز فى الجنوب ............ و باقى البلد بتصيف فى الشمال فى المنتجعات و على المرتفاعات الثلجية......و طبعا معظمهم من النصارى و قلة مسلمة<br />و ماتسالش على اهل السنة فى لبنان فهم اهل النخبة السياسية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 1
subject = "صامدون"
author = "صامدون"
posted = "2006-07-13"
text = "تابع التعليق السابق<br />لو فتحت التليفزيون بكرة قبل صلاة الجمعة و لقيتهم بيعلنوا ان الصهاينة احتلوا بيروت فجر اليوم و بدءوا فى تصفية الشباب و اغتصاب الستات<br />عادى جدا و طبيعى فى ظل الظروف الحالة<br />و إسرائيل قادرة على انها تعملها و تستحمل حبة هو هوة كلاب من العرب و تبقى تستخدم قرارات الامم المتحدة على انها ورق حمام تنشف بيها مــؤخــرة عساكرها اللى متمركزين فى البقاع<br />و تبقى تعمل زى 1982 او اكتر<br />و طبعا الريس بسلامتة العظيم مش هاينسى يمثل علينا و يعمل فيها شيخ البلد اللى بيتوسط بين اتنين بيتخانقوا على حدود اراضيهم الزراعية فاكر نفسة فى بلدهم<br />اللهم ثبت صوب المجاهدين و امدهم بمدد من عندك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

