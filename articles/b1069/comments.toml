[[comments]]
order = 13
subject = "اسد المجاهدين حسن نصر الله"
author = "حمدي"
posted = "2006-07-14"
text = "الله اكبر الله اكبر الله اكبر<br />حزب الله ولاول مره يضرب بارجه اسرائيليه في<br />عرض البحر بصاروخ من نوع جديد لم يعلن<br />عنه والجيش الصهيوني يعلن فقدان اربعة<br />جنود من جنود البارجه<br />ومجله عسكريه المانيه شهيره ترجح امتلاك حزب الله لصواريخ تصل الي تل ابيب<br />الم اقل لكم ان رجال حزب الله يعرفون ماذا يفعلون<br />اللهم ثبتهم يارب وامدهم بمدد من عندك<br />اللهم وحد المسلمين واجعل باسهم علي من ظلمهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 14
subject = "اقسم بالله هيتربوا الكلاب"
author = "لبناني دما"
posted = "2006-07-14"
text = "انا بجد مش عارف اقول اية غير شئ واحد بس .. اقسم بالله العظيم .. وربي وما اعبد اني حاسس بجد ان شاء الله هيحصل كارثة كبيرة لولاد الكلب اللي اصلا مش المفروض اننا نعمل لهم اعتبار وتطلق عليهم اسم .. من كتر حقارتهم ميستاهلوش اننا نطلق عليهم اسم .. لكن لولا ان من اصول الكلام او حتى من قواعد الكلام عن اي شئ انه لابد يكون له اسم ولو حتى اسم حقير زي صاحبه.. للاسف بنكرمهم ونطلق عليهم اسم الاسرائليين .. ولو انهم حتى كتير اوي عليهم ان نطلق عليهم اسم مجرد اسم .. اقسم بالله العظيم هيحصل لولاد الكلب دول مصيبة سودا قريب جدا فعلا ساعتها هيحسوا بمدى ضئالتهم ومدى ضعفهم قدام اجمل شعب خلقه ربي على الارض ..<br />وان شاء الله وعدي هيتحقق وان شاء الله ربي سامعني وشايف كلامي .. باذن الله هيكون في وقفة كبيرة اوي وهيتحقق كلامي.<br />يارب انت الشاهد .. حقق كلامي وانصر اجمل واطيب شعب خلقت .. امين امين يارب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

