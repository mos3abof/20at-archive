subject = "انصرنا يا الله"
author = "بسم الله الرحمن الرحيم و به نستعين."
posted = "2006-07-16"
text = "اللهم انا نسالك قادة كأبي بكر و عمر و عثمان و علي.<br />يا مسلمين يا عرب اين شرفكم اين نخوتكم. اخوانكم يذبحون و يقتلون و يشردون بابشع الطرق و افظع المجازر.<br />هبوا لنصرة دينكم و الدفاع عن اخوانكم تملكون السلاح و المال و الطائرات.<br />سيسالكم الله عما فعلتم و ه اتقيتموه في رعيته.<br />\"و قفوهم انهم مسؤولون\" صدق الله العظيم.<br />اتقوا الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

