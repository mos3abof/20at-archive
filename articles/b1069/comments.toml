[[comments]]
order = 55
subject = "من مخيم جنين الى بيروت"
author = "احمد-مخيم جنين فلسطين"
posted = "2006-07-21"
text = "قاتلوهم ولا تخشوهم انهم جبناء والله لو سمعمعتم اهاتهم وبكائهم في معركة مخيم جنين البطولة في نيسان2002 لاستغربتم من مقولة الجيش الذي لايقهر دافعوا عن وطنكم باستبسال ورجولة ولاتنتظروا من احد شيئا قاوموا متسلحين بايمانكم وحتمية النصر المؤزر وعدالة قضيتكم لقد عاركناهم في مخيم جنين وعرفنا جيدا من هم -اثنا عشرة يوما بدلوا فيها 3الوية من جيشهم وكان على راسهم وزير دفاعهم المخلوع موفاز -200من المقاتلين علموهم ولقنوهم درسا لن يتسوه ابدا اسالوا التاريخ من نحن ومن هم قسما برب العباد الذي نصر محمد انهم كانوا يصيحون ويبكون الدم قبل الدموع -نعم هدموا البيوت في المخيم كلها لكن هل قضوا على المقاومة طبعا لا -فالى اخواننا في لبنان انتم اشداء رجال مغاوير تدافعون عن شرف الامة الله معكم وكل الشرفاء معكم ويا ليتنا معكم لنسجل معكم معركة شرف ثانية النصر لكم باءذن الله وللمقاومة ولحزب الله ولكل المقاتلين الاشاوش ------------اخوكم احمد من مخيم جنين فلسطين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 56
subject = "عجــــــــــــــــــبي"
author = "عربي"
posted = "2006-07-21"
text = "عجبي من حكامنا<br />يتنخبون بدلا عنا طبعا<br />ليس تزويرا<br />بل اشفاقا علينا من المشقة<br />يهربون مقدرات البلاد الى سويسرا<br />ليس اختلاساحاشا لله<br />بل خوفا علينا من فتنة المال<br />ارسلوا برقيات التنديد عندما اذاع راديو العدو نبأ قصف حيفاء ضننا منهم امها هيفاء<br />رئيس عربي لا يستطيع ان ينشر جيشه في بلاده و يحافظ على امن كرسيه رئيس لدولة ناقصة السيادة و يبكي على سيادة حكومة لبنان حددو له عدد الجنود و السلاح بسناء<br />ويتباكي على سيادة خكومة لبنان عجبي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

