text = "رساله خاصه الى رؤساء الدول العربيه ولا يستحقون كلمه زعماء انتم تسيرون في اتجاه مخالف لاراده شعوبكم اتقوا الله وقاتلوا اعداء الله حتي يعذبهم الله بأيديكم<br />وافسدوا علي بوش واعوانه مخطط الشرق الاوسط الجديد وفق الله الجميع الي ما يحبه ويرضاه"
