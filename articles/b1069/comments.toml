text = "الم تتعلم اسرائيل من يوم امس اننى اقول ان عقولهم عقول عجول والله يسامح بعض الرؤساء العرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 33
subject = "التضامن المفروض"
author = "ابو حاتم المصرى"
posted = "2006-07-21"
text = "بعد ان شاهدت محررة الموقع على قناة الجزيره صباح اليوم اقول لها بعد تحيتها ان الشعب اللبنانى والفلسطينى لا يحتاجا الى متطوعين كحطب لنيران الصهيونيه قدر احتياجهم الى السلاح او المال لشراء السلاح وهذا هو المفروض من الشعوب طالما ان الحكومات اكتفت بالمشاهده وليلهمهم الله الصبر والجلد للمواجهه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 34
subject = "الحكام العرب"
author = "فادى"
posted = "2006-07-21"
text = "الان لبنان وفلسطين وسوريه وأمس الله يعلم والاسباب هى الحكام التى لا ينظرون حولهم بل ينظرون على انفسهم وخضوع لمريكاوسرئيل كم الجامعه العربيه اجتمعت والقررات التى اتخذت هى للاسف حمايت اسرئيل فى داخل الدول والسفاره والله لا ينسامجاهدينه فلسطين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 35
subject = "الجامعة العرب امريكية"
author = "قادوس"
posted = "2006-07-21"
text = "واسفاه وعُذرا أخوانى لهذا الاسملما كان يسمى بالجامعة العربيةفمجلس النواب الامريكى يصوت لقرار لدعم اسرائيل ضدحزب الله وضد حماس وبالامس القريب ايضا صوتت الجامعة العربية لصالح قرار بذبح المقاومة فى لبنان وفلسطين ولم يجرؤ زعيم عربى واحد بادانة او شجب العدوان الصهيونى الغاشم خوفا من الاب بوش والذى جعل نفسه وصيا على الامه العربية وزعيماللحملة الصهيونية للقضاء على الصحوة الاسلامية فحال زعماء الامه يقول قلوبنا مع المقاومة وسيوفنا عليها ؟؟؟؟؟؟حسنا الله ونعم الوكيل اللهم انك قوى عزيز غالب فاللهم بعزتك وقوتك انصر عبادك المقاومين فى لبنان وفلسطين والعراق والشيشان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 36
subject = "هات سلاح وخذ ارواح"
author = "ابو القسام"
posted = "2006-07-21"
text = "الاخوة الافاضل<br />السلام عليكم<br />انا شاب من فلسطين تحت حصار الطائرات والدبابات الاسرائيلية كل ما نطلبه من الشعوب العربية هو تزويدنا بالسلاح انري العالم والحكام المتخاذلون معنى الصمود والمقاومة باذن الله<br />وجزاكم الله عنا كل خير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 37
subject = "يا خساره يا عرب"
author = "فادى\\\\\\\\\\فلسطين\\\\\\"
posted = "2006-07-21"
text = "بعد التحيه الى البنان على هذه البطولات الان العرب ينظرون على من صدام ما موقف الزعماء وما موقف الزعماء تجاه البنان وفلسطين وسوريه اريد ان اعرف ولكن المواقف واضحه هى الخوف لئن الامان ضعيف لهماين الاحساس والضمير كلكم اين امريكاالان امريكا هى الكل لالالا وانا اعلن من شعب فلسطينى ان امريكا وسرئيل تحكم الزعماء فقط لا غيربل تحكم الجامعهالعربيه التى لا له احساس بل لهاالشكر لمريكا وسرئيل وشكرأ------وانا سعيدبوجود الموقع والشكر لكم وجميع اصحاب هذا الموقع ولكم الشكر والله معكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 38
subject = "النصر للصادق"
author = "الساخر"
posted = "2006-07-21"
text = "يااخواننا يكفينا شرف كامه ان نسمع لاول مره الى قائد صادق مع شعبه مع امته مع وهذا اهم انواع الصدق يااخواننا الشعب اللبناني شعب يبغى يعيش ولذلك سوف يبني لبنان مره اخرى وعاشره وسف يصدق نصرالله وبأذن الله وعده بالبناء وهذه المعركه من اهم المعارك الان على الساحه السياسيه والنصر بأذن الله لمن صدق مع الله وياجماعه ترى الاسرائلين الصهاينه هم اسوء اعداء الامه اذا قتلوا الانبياء مش حيقتلوا ويشوهوا قتلاهم كما شاهدنانصف وبالاصح ربع جسدطفلة لبنان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 39
subject = "الخيانه من الحكام العرب"
author = "فادى"
posted = "2006-07-21"
text = "نعم الخيانه من العرب ومن الجامعه العربيه اجتماع الجامعه العربيه اى موقف قوى بل موقف حمايت اسرئيل كم سفاره فى الدول العربيه بل اين الشعوب الان مصدر عسكري من العرب هوا واحد لجميع الامن التوجه الى سفرات الاسرئيليه والعمل بحمايت كل من داخل هذى اهم الخيانه\\\\\\من فلسطين\\\\"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 40
subject = "لبنان الصغير ينتصر على اسرائيل الكبرى"
author = "محمد الخليل"
posted = "2006-07-21"
text = "الجيوش العربية النظامية خسرت أربعة حروب في مواجهة الجيش الأسرائيلي حتى عندما كان وليدا في عام 1948 .<br />والآن لبنان البلد العهربي الصغير يتصدى وحده لأكبر قوة عسكرية في العالم ويسدد لها ضربات موجعة ولول مرة في تاريخ تأسيس الكيان العدواني الصهيوني على أرض فلسطين يصاب المحتلون بالذعر ويختفون في الملاجئ<br />إنها مؤشرات رائعة ترفع الرأس مع الأسف الشديد لما تحمله الشعب اللبناني الشقفيق وةلا سيما أن الأشقاء تركوه وحده في المواجهة وذهبوا للاستجمام في نوادي العراة الأوروبية والأميركية.<br />وما يؤلم أكثر أن بعض الأصوات العربية شجعت اسرائيل على العدوان عبر تصريحات غير مسؤولة وسجلت عليهم في صفحات سوداء في حين انبرى شافيز ليدين العدوان الصيوني<br />وقديما قالوا إذا لم تستح فقل ما شئت هل سمعتم أيه المتخاذلون<br />في عام 48 هربتم بعد عدة أيام وقلتم للفلسطينين اتركوا أراضيكم وسعنيدكم بعد أيام ، وفي عام 67 احتلت اسرائيل ثلاث مناطق عربية بعد ستة ايام في حين يصمد لبنان ولاتقول حزب الله لأنه جزء من لبنان ...<br />يصمد لبنان لليوم العاشر وسط مؤشرات أن اسرائيل بدأت تتململ من إطالة مدة العدوان<br />مزيدا من الصمود بانصر الله وعسى أن يكون نصر الله على يديك ولو كان نصرا صغيرا لأنه بلا شك سيمحو [عض آثار هزائمنا الكبيرة طوال ستين عاما من الصراع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 41
subject = "عتاب"
author = "اليمني"
posted = "2006-07-21"
text = "كنت اتمنى ان يكون هذا الموقع خاص بالمقاومة في فلسطين ولبنان لا أن تحصر في لبنان مع انني للست ضد اخواننا في لبنان ولكن لماذا هذا التجاهل لاخواننا في فلسطين ارجوا ان يضموا الى هذا الموقع فالمؤمنون اخوة كالجسد الواحد<br />واشكر لكم مجهودكم في دعم المقاومة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 42
subject = "الامة التى لاتحترم نفسها"
author = "علي سالم"
posted = "2006-07-21"
text = "من اجل جنديين السرائليين تحرق ارض بشعبها كامله هكدى الدم اليهودي غالي الثمن<br />الامم المتحده والعالم الغربي الدمقراطي لم ينطوق ببنت شفه ولن ينطق الى ادا نطق من في القبور<br />فاالامة التي لاتحترم نفسهاوترضى ان تقتات من فتاتاالموائد ولاتعرف قدرا لعلمائهاوابطالها ومثقفيهاوالمخلصين لهاولاتعرف صديقها من عدوهاهكدى يكون حالها<br />الخاسرالوحيد في المعر كةهم الشعوب المسلمه لان الصراع مع اليهودلم يكن يوما من الايام من اجل التحرير بل لمصالح خاصه فحماس ليست عنا ببعيد وحزب الله لن يكون ابن ازنا البار في امه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 43
subject = "الحرب الان"
author = "ابن مدينة الناصره"
posted = "2006-07-21"
text = "من الناصره لبيروت شعب واحد ما بموت<br />من عمان لاسوان ارواحنا فداء لبنان<br />انا ابنك يا غزه ابن الشرف والعزه<br />انا ابنك يا جليل انسى الاقصى مستحيل<br />انا ابن الحريه ابن الضفه الغربيه<br />حزب الله مع حماس سيرو معكم كل الناس<br />ارجو من الاخوه الاعزاء ان تحفظ هذه اهتفات وتهتف بها بشوارع العربيه اليوم بعد صلاة الجمعه وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 44
subject = "حوار مع جدي خالد بن الوليد بقلم: محمد الوليدي"
author = "fawaz"
posted = "2006-07-21"
text = "السلام عليكم يا جدي الحبيب<br />ـ وعليكم السلام ، من يتكلم؟<br />: حفيد من احفادك يريد السلام عليك<br />ولي ظلامة يا جدي<br />فالعرب سلمت مفاتيح مدينتي الى اعدائي<br />وأسرت الثوار كما اراد اعدائي<br />وسكرت وغنت ورقصت على اشلائي<br />يا جدي سرقوا أيامي<br />يا جدي سرقوا أحلامي<br />ـ وماذا يفعل الخليفة ؟<br />: يحاصر الشعب المحاصر<br />يطلق الرصاص على كل ثائر<br />ويحترف فينا القتل والنهب<br />وتصفق له كل العرب<br />وعن أي خليفة تسأل<br />فحفنة من لصوص هنا<br />بالوراثة تجلس على صدورنا<br />وأخاف ان اقول الحقيقة<br />فصوتنا مسموع وأخاف ان اقتل<br />ـ وأين الرجال؟<br />: لا تسأل اين الرجال<br />لو عدت مرة اخرى لسرقوا سيفك<br />وقتلوك في الحال<br />ـ خسئتم<br />وماذا حل بالقدس؟<br />: القدس يا جدي \"أقصاها\" غضب<br />مآذنها غضب روابيها غضب<br />كل شيء فيها غضب<br />القدس يا جدي تبكي دما وتنتحب<br />فبالأمس باعوها في \"اوسلو\"<br />وتغير اسمها يا جدي<br />صارت \"اورشليم\"<br />صارت لبني اسرائيل عاصمة<br />ـ أعوذ بالله من الشيطان الرجيم<br />ـ ماذا تقول؟ وما \"اوسلو\" هذه يا ولد؟<br />: \"اوسلو\" يا جدي انتصارنا الباسل<br />\"اوسلو\" يرموكنا وذات السلاسل<br />- خسئتم ..خسئتم<br />ـ انسيتم فنون قتالي؟<br />: لا يا جدي ،نعرف كيف نقاتل<br />ونحفظ خططك العسكرية<br />لكننا لا نجيدها الا بين القبائل<br />وكل معاركك في الذاكرة<br />ونعرف كيف هزمت<br />الردة والروم والأكاسرة<br />قال لنا التاريخ يا جدي<br />انك لم تخسر معركة قط<br />لكن بعدك معاركنا خاسرة<br />ـ والأمة؟<br />: تؤمن بالقضاء والقدر<br />وتدعوا الله دائما ان ينجيها<br />من عذاب الآخرة<br />وعذاب الدولة وعذاب القبر<br />ـ وماذا تفعل العرب ؟<br />: يأكلون ويشربون وينامون<br />ويستنكرون كذلك ويشجبون<br />وفي بعض الأحيان يحتجون<br />ويصلون الصلوات<br />ويقرأون الفاتحة على الأموات<br />ـ والى اين وصلت فتوحاتكم اليوم؟<br />دخلنا بغداد لآن ودخلتها معنا الروم<br />و...<br />يا جدي .. يا جدي<br />يا جدي .. يا ج .. د .. ي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 45
subject = "قلوبنا مكم"
author = "moataz"
posted = "2006-07-21"
text = "قلوبنا مع كل لبنانى صامد ضد العدو الصهيونى قلوبنا مع السيد حسن نصرالله<br />قلوبنا مع كل صامد ضد العد الصهيونى<br />حزين على موقف حكامانا العرب بتفوهم بكلمات لم يعوهاولم يفهموها.<br />ان لم يسطيعوا عمل اى شى للشعب البنانى<br />عليهم الصمت وبذلك يكونى قدموا الكثير للشعب البنانى وللامة العربية<br />اتمنى انتصار العرب سواء كانوا مسلمين مسحين فنحن اخوة<br />اتمنى وقوف الشعب البنانى يد واحدة وليس هناك مجال للحساب والقاء المسولية على حزب الله الان<br />سعيد بوقف الشعوب الاسلامية والعربية ولوكان موقف الحكام مثل موقف الشعوب لسعد اكثر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 46
subject = "لو كنت"
author = "مازن"
posted = "2006-07-21"
text = "بسم الله الرحمن الرحيم<br />في خضم ما يجري اليوم من الأحداث المتسارعه و مما نشاهدمن امور يندئ لهالجبين تاتي تحركات طنطات الأمه العربيه العظيمه الذين تطنطنو على يد شارون و نتنياهو و كولداماءير يشجبون ويستنكرون ما تقوم به المقاومه اللبانيه الشريفه وعلى رأسها حزب الله البطل فياليتني كنت اسكافيا لكنت صنعت وجوه هولاء الحكام احذيه يلبسها كل المقاومين ولعلقت حذاءي حسن نصرالله فوق راس خاءن الحرمين الشرفين و عاهر الأردن وكلاب الأمه العربيه حتى يشعرو بعروبتهم فيا كل احرار العالم الاسلامي والعربي كفانا جبنا لاننا لم نخلق جبناء والدليل صواريخ حزب الله<br />و السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

[[comments]]
order = 47
subject = "كلنا مقاومه وكلنا مع نصر الله"
author = "وضـــــاح اليــمــن"
posted = "2006-07-21"
text = "اولا عسى الله ان يجعله نصرا مبينا يتحقق في ضل الركووود للامه العربيه اللي اسه ما فاقت من سباتها<br />والله يحسره اكثر من ست مئه قتيل وللحين ماحد فاق من سباته للاسف نحن امة محمد<br />والله تعني لنا الكثير هذه العباره الامه المحمديه لكن اين هي الان نسال الله ان ينصر اخواننا المجاهدون في لبنان وفلسطين والعراق وكل مكان تنطق فيه<br />لا اله الا الله<br />وانشا الله مزيد من الغنائم نراها مع مجاهدينا باذن الله<br />ليتنا كنا معكم اخوتنا نشارككم اما الشهاده واما نصر الله المبين<br />وانشاء الله امه واحده بجميع طوائفها<br />من سنه وشيعه ومسيحيين لانه ليس وقت التفرقه بين الطوائف والاهم العدو الغاصب للارض العربيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

