[[comments]]
order = 30
subject = "الجماهير اساس التغيير"
author = "اخجل بعروبتي"
posted = "2006-07-21"
text = "بسم الله الرحمن الرحيم<br />اخوتي ان اليهود في العالم لا يتجاوز عددهم ال 15 مليون نسمه يحكمون العالم من اقصاه الى اقصاه , ليس بقوتهم بل بضعف وهوان وذل وخيانة مليار وستماية مليون ممن يدعون الاسلام وممن يدعون العروبه.<br />ببساطة اقول :<br />ان من لا يعاني لا يعلم معنى الالم والمعاناة<br />وقد يكون طلبي غير مقولا لدي الكثيرين ان قلت على المقاومة ان تنقل ساحات النضال الى كل قطر عربي ومسلم كي يذوق كل عربي معنى الالم عسى ان تتحد الجهود وتقف في وجه طغمة الطغيان ومن يدور في ركب الصهيونية من الحكام العرب العملاء والجيوش العاجزة الا عن قمع شعوبها والتي اوجدتها الصهيونية وامريكيا من اجل حماية كيان المسخ الصهيوني ومن اجل قمع كل مقاومة عربيه او اسلامية.<br />فاسطورة الجيش الذي لا يقهر الذي اطلقته عليهم حكومات الذل العرب تحطمت في معركة الكرامة عام 1968 امام المقاومة الفلسطينية حيث ربط العدو جنوده في سلاسل كي لا يهربوا من المعركة وراينا اسطورتهم تتحطم امام اطفال الحجارة في فلسطين الحبيبة وامام ايمان المجاهدين والاستشهاديين وراينا اسطورتهم تتحطم امام مقاتلي ومجاهدي حزب الله حين وقعوا في مستنقع لبنان عام 1982 وها هم يقعون في مستنقع لبنان مرة اخرى امام تخاذل كل العرب والمسلمين وامام ناظري العالم باسره دون ان يحرك احدا ساكنا وهذا دليل على حجم المؤآمرة والخيانة التي تحاك ضد كل من يقول لا لامريكيا والصهيونيه.<br />اود ان اذكّر كل من شاهد جنود الاحتلال في ساحة المعركه بالامس يتلون الصلوات وهم يعصبون اياديهم القماش الابيض وهذا ما لم يحدث في تاريخ حروب اسرائيل قاطبة.<br />انه دليل على حجم الخوف والرعب الذي دخل قلوبهم وخوفهم من مواجهات المقاومة في لبنان وحيث انهم يرتعدون خوفا من ذكر اسم حزب الله والسيد حسن نصر الله حماه الله ونصره على كل الخونة والمتامرين.<br />وانني اقول من هنا الى كل عربي ومسلم والى كل الاحرار في كل بقاع الارض بان اشرائيل اخطبوط قذر لا تتوقف عن التوسع ومستمرة في ارهاب الدولة المنظم طالما لم تجد من يردعها وخاصة ان امريكيا وعملاء العرب يقفون في صفها خوفا على كرسي الحكم وتحت المغريات التي تقدمها لهم امريكا والوعود الكاذبه.<br />لهذا فنحن بحاجة الى صحوة وقبل فوات الاوان وفي وقت لا يجدي فيه الندم, على كل احرار العالم ان يخرجوا بمظاهرات عارمة وعلى كل اصناف المقازمة في الوطن العربي ان تضرب المصالح الامريكية اولا والصهيونية ثانيا للضغط عليهما وعلى حكومات العهر العربي وانا اعلم ان التضحيات تحتاج الى الاحرار والمؤمنين بربهم وبعروبتهم وبحتمية النصر ان شاء الله.<br />كلنا يعلم ان اسرائيل كانت لف غزو وتدمير العراق لان صدام كان يشكل الخطر الاكبر على اسرائيل ونرى الموساد الاسرائيلي متغلغل في كل الوطن العربي وهم خلف قتل العلماء والتفجيرات بين المدنيين العراقيين واسرائيل خلف كل زعزعة للاستقرار في العالم عامة والعربي خاصة لانها المستفيد الوحيد من ذلك .<br />ولو نظرنا بعين الحكمة والتروي فاننا نجد اليهود متغلغلون في كل الوطن العربي وخاصة دول الطوق وها هم اشتروا اراضي واسعة من الاردن وخصوصا المناطق الحساسة وهذا كلام موثوق وليس من باب التجني كما يمتلكون اراضي في السعوديه اشتروها مؤخرا وكذلك في مصر وسوريا ولبنان وفي المغرب والعديد من الدول العربية ... افيوقا يا امة العرب من اللهو والطرب قبل ان يصيبكم ما اصاب لبنان وفلسطين والعراق .<br />ان اليهود نهايتهم في بيت المقدس مؤكدة وهذا وعد الله في كتابه العزيز فعليكم مؤازرة المقاومة كي يتحقق وعد الله على ايديكم وايدي المؤمنين والله اكبر والنصر للمقاومة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

