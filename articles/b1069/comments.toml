[[comments]]
order = 70
subject = "مصر عمر بن العاص لن تخذل المسلمين"
author = "حسن مخرمش"
posted = "2006-07-22"
text = "لقد تتبعت بشغف كبيرا مواقف حكامنا العرب على ممر السنوات تجاه قضيتنا المركزية فلسطين الحبيبة منذ نكسة 1948 إلى غاية يومنا هذا فأدركت أن الشعوب العربية لم تقل كلمة فلسطين إسرائلية و إنما حكامها حين يجلسون إلى جانب حكام الغرب يحسون بمركب نقص لديهم و يخشون قراراتهم أكثر مما يحترمون أنفسهم و شعوبهم لأنه بكل بساطة أبنائهم يدرسون في أوروبا و أميريكا و أموالهم مودعة هناك ويتصرفون بأخلاقهم حينها يطرح أكثر من سِؤال<br />وحديثي كله يتجه إلى حكومات مصر المتعاقبة لماذا تفعلون بنا كل هذه الأفاعيل يا مصر الحبيبة ؟<br />يا بلد الكنانة يا بلد الصحابة يا بلد الأنبياء يوسف عليه السلام يا بلد الأمنين<br />لماذا تعتقلون إخوانكم من كل التنظيمات ؟<br />لماذا تخذلون شعوبكم و أنتم محور الأمة في العالم الإسلامي ؟<br />ماذا تسارعون إلى المواقف الدنئة و تقبلون بها ؟<br />لماذا تساعون أمريكا و ربيبتها المهزومة؟<br />لماذا يامصر تقتلون حسن البنا؟<br />لماذا تقتلون عبدالقادر عودة وفرغلي و غيرهم من الشهداء و الأبطال؟<br />ليه يا مصر<br />لماذا تكممون الأفواه لأعظم شعب يقدم الكثير من العلماء يرزخ بهم العالم الغربي و العربي ؟<br />أين مخططات مصر عوض مخططات اليهود<br />مصر العربية المسلمة لن تخذلنا ستقف موقف علمائها المشرف و صحفييها الكبار الذين بارزوا متدحثي السلام و الباكون على أطلاله بالحجة هذه هي مصر عمر بن العاص سيد الفاتحين<br />لماذا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

