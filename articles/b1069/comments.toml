[[comments]]
order = 90
subject = "معا نحو الهدف"
author = "حسين مخرمش من الجزائر"
posted = "2006-07-30"
text = "بعض المتدينون المغشوشون و المندسون في دوائر و حساد دعوة الإخوان المسلمين بقوا على عنادهم في الجانب الأخر بعيدا عن الشعب و بعيدا عن المجتمع و بعيدا عن الأمة و قضاياها فلبسوا فقه العنف و فقه الظاهرية لم يستطيعوا أن يغوصوا إلى أعماق النصوص فضاع عنهم علم القياس و المخارج و النظر المصلحي و علم القواعد و الدوران مع العلل و علم الأصول و تجميع القرائن و الدلائل الظاهرة و نسو أن الأصل في المنافع الإذن و الأصل في المضار المنع و أن حقوق العباد مبنية على الشح و حق الله يتوسع فيه .<br />و الأخذ بالأحسن و الأخذ بالاحتياط عند الخلاف . فحرموا هؤلاء من عطايا من فقه الوسطية و التدرج في الأخذ بالفتوى ، زادهم ضعيف في العلم مع أن حرقتهم على لإسلام بدون على علم لا تكفي فأصبحوا أذات لتشويه المقاومة و وأد الجهاد و تشجيع الغوغاء و سلاح بيد العدو يستعملهم كيفما يشاء .<br />فلا داعي في تشكيك في فكر الجماعة و عمق فهمها فمجال العملي للإخوان المسلمين بالنسبة للطوائف و مند تأسيسه كان يسعى على توسيع الدائرة مع طائفة الشيعة .<br />فعلى كثرة العدد و المنتسبين لهده الطائفة إلا أنها كانت معزولة عن طائفة أهل السنة كأنهما من دينين مختلفين مع أن هده الطائفة تضم أقواما من أكرم العناصر المسلمة ذات التاريخ المجيد و الغيرة على الإسلام و الدود على حياضه .. و وجه الخلاف بينهم و بين أهل السنة ينحصر في أنهم يغالون في حب أهل البيت رضوان الله عليهم .. و لكن هل تظل هده القطيعة قائمة بين طائفتي المسلمين تستغل من المناؤيين و المعادين سياسيا و دينيا و الإسلام في أمس الحاجة إلى جهد كل فرد منتسب إليه للوقوف في وجه الغارات المطبقة عليه ؟.<br />و في مثل الظروف العويصة و الغارة تشن على المسلمين من قبل الكيان اليهودي و الأمريكان ألم يآن الأوان أن يمد المسلمين السنة أياديهم إلى إخوانهم من الشيعة و يتناسوا خلافاتهم .<br />أما الإخوان المسلمين فموقفهم كان واضحا مند تأسيس جماعتهم ، إلى أن ضرورة قيام تعاون لبناء صرح الإسلام و استعادة مجده . فلقت هده العبارات و ستجد من الشيعة الأذن الصاغية مثل ما فعل الشيخ محمد تقي قمي حين التقى و سمع صوت ينضب بالحب و يدعوا إلى الأخوة الإسلامية مع رائد دعوة الإخوان المسلمين الشيخ حسن البنا رحمه الله ، و ثمرة هدا اللقاء أنداك كان أن أنشئت دار التقريب بين المذاهب الإسلامية .<br />فهل نبقى نتفرج على إخواننا و هم يقصفون و يدبحون في قانا و خان يونس و غزة ؟ إنه من أضعف الايمان أن ندعوا لهم و من أضعف الايمان أ، ندخل إلى المواقع الغربية و نشرح لهم ما يقترفه اليهود من مجاجز و أن نحاورهم عن قضيتنا لأننا أصحاب حق و لاينبغي أن نضع جميع الغربيين الغربيين في سلة فمنهم أصحاب إدراك و أداء معرفي لا يستهان به<br />إبعثوا بصور العنف الدي تمارسه دولة الكيان الصهيوني إلى موافع انترنت و لا تيأسوا من روح الله .<br />أما لحكامنا الأعزاء فأناشدهم بالله أن يتابعوا قضايا أمتهم و يتعاونوا على نصرة المسلمين و لا يكتفوا بالإدانة و لا يراهنوا على السلام العادل لأميريكا .<br />هه شعوب جبارة بقوة الله فكونوا في صفها يكن معكم .فيسهل علينا الهدف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125214/http://www.20at.com/article2.php?sid=1069"

