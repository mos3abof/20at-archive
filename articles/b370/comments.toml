[[comments]]
order = 1
subject = "خابت فتح"
author = "فلسطيني"
posted = "2006-02-02"
text = "هذا كيد حاقدين لا اكثر ولا اقل فتح تريد تشويه صورة حماس وهز ثقة الشعب بها كما فقد الشعب ثقته بفتح ولكن خسئوا فحماس ارفع من افعال صبيانيه كهذه واين كانت هذه الاتهامات قبل ان تفوز حماس<br />الله يبعد عنا شر الحاقدين وشر الفتنه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142411/http://www.20at.com/article2.php?sid=370"
