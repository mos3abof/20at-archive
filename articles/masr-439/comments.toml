[[comments]]
order = 2
subject = "اشغال طريق"
author = "نور الغد"
posted = "2006-06-02"
text = "لنعرض الصور على الشعب من يقوم باشغال الطريق الان هل المتظاهرين ام رجال الشرطة وامن الدولة والامن المركزى والحى و رجال المباحس والحراسات الخاصة وغير ذالك الغير معلوم لعن اللة الظالمين والحرية للمعتقلين سجين الحرية ايمن نور والشرقاوى وكريم الشاعر وكمال خليل وكل الاحرارفى العالم"
archived = "2006-09-13"
capture_url = "https://web.archive.org/web/20060913030109/http://masr.20at.com:80/article.php?sid=439&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "ابو كرش كبير ده"
author = "الاستاذشيكو"
posted = "2006-06-03"
text = "هوة مين ابو كرش كبير ده في الصورة الرئيسيه<br />انا بس عايز اعرف ازاى دة يكون ظابط اساسا ؟؟!! انا عارف ان السؤال مش في وقته بس دة يدل ان لو فيه عشرة كروش من الفصيله دي في الشارع هايسدوة من غير اي مجهود ده الواحد فيهم عامل زى الفيل ابو كرش<br />كله من مال الشعب ومتجسد في كرش المعفن ده والله هي الدوله بتاعتنا كده بالظبط<br />لكي الله ياااااااااامصرنا<br />ولكم جهنم يااااااااااااابتوع امن الدوله"
archived = "2006-09-13"
capture_url = "https://web.archive.org/web/20060913030109/http://masr.20at.com:80/article.php?sid=439&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "الوعى"
author = "طارق حسن"
posted = "2006-06-03"
text = "سيدى المحرر مؤكد انك تتفق معى فى زيادة وعى الناس فى الاونه الاخيرة فى الشارع المصرى هذا الوعى هو الدافع الرئيسى لانقطاع الناس عن المظاهرات لا سيما بعد الاحباط الذى انتاب الكثير منهم بعد 25 مايو ذلك اليوم المفصلى فى حياتى انا شخصيا وغيرى<br />ذلك اليوم الذى شاهدت فيه حقيقه ذلك الوهم الذى نعيشه والمسمى بالمعارضه<br />ذلك النهم السياسى الذى سقته لنا صحف المعارضه بينما وقف هؤلاء الصحفيون المعارضون يخرجون لنا السنتهم متخلين عن الشارع والمتظاهرين يوم 25مايو ليثبتوا لكل ذى عينين انهم يبيعون هموم الناس للناس عبر ابواقهم المسماة جرايد المعارضه ويتربحون من ذلك دونما اى محاوله جادة منهم حتى فى مشاركه هؤلاء الناس الذين صدقوهم وزحفوا من مختلف انحاء المحروسه فى ذلك اليوم(25مايو) الذى شنفوا اذاننا كثيرا بالحديث عنه<br />صدقنى سيدى المحرر عندما اقول لك اننى على قدر ما احببت بل عشقت تلك الزعامات وعلى قدر ما رسمت لها من خيالات فى عقلى على قدر ما كرهتهم<br />باكرة ابراهيم عيس<br />ومحمد حسنين هيكل<br />وزكريا عبد العزيز<br />ومعنتش بشترى اى جرايد وصدقنى اعرف كتير غيرى كدة الان<br />وسلملى على قوى المعارضه"
archived = "2006-09-13"
capture_url = "https://web.archive.org/web/20060913030109/http://masr.20at.com:80/article.php?sid=439&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "الى استاذ طارق"
author = "دعاء الشامي"
posted = "2006-06-04"
text = "استاذ طارق اقدر مشاعرك بشدة ولكن اختلف معك بشدة أيضا<br />فانا اختلف معك ان ماحدث يوم 25 مايو شيء محزن بالعكس هو شيء يشرف كل مصري يريد الخلاص لنفسه وللجميع<br />اماعن ابراهيم عيسى وهيكل والناس الكبيرة دي طبعا محدش يقدر يتكلم عليهم لكن همه دورهم مختلف عن الباقين فقد اختاروا دور اتنوير والايضاح وانا معاك انهم لازم ينزلوا الشارع ويتوقفوا عن بث التشاؤم كما يفعل الاستاذ ابراهيم عيسى كل اسبوع في الدستور ولكن لا احد يستطيع اغفال دوره<br />اختلف معك ان ما يحدث يجعلك تكره قوى المعارضه فحتى لو لم تكن هناك قوى لتلك المعارضة فمن الممكن ان تستمد قوتها من الشارع<br />اما عن احساسي بما يحدث فهو حزن عميق لانهم استطاعوا بتخويفهم وقوتهم المزيفة ان يجعلوك تكره كل هؤلاء وتتخلى عن طوابير الرافضين ولكني أقدر شعورك ولو كان ايمانك بحقك حقيقي فسترجع حتما الى صفوف الرافضين في اقرب فرصة"
archived = "2006-09-13"
capture_url = "https://web.archive.org/web/20060913030109/http://masr.20at.com:80/article.php?sid=439&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "عمار يا مصر"
author = "صايع وقديم"
posted = "2006-06-04"
text = "في الممنوع<br />بقلم مجدي مهنا<br />وصلتني هذه الرسالة من معتقل سياسي سابق:<br />السيد/ ......<br />قرأت مقال حضرتك بتاريخ ١٠/٥/٢٠٠٦، وقد انتابتني نوبة هستيرية من الضحك، وشنفت أذني بحديثك العذب البريء، وكان ذلك عندما كتبت عن حقوق المعتقل السياسي، فاسمح لي أن أشنف أذنيك، وأفزع حنايا قلبك، وألهب ثنايا جوانحك، ولتمسك بقايا جوارحك.<br />قد كنت معتقلاً سياسياً وخرجت للتو منذ شهور، بعد اعتقال دام ثلاثة عشر عاماً، منذ عام ١٩٩٢، لم أتهم بأي تهمة، ولم يتم عرضي علي نيابة أو محاكمة، ولم أقترف عنفاً قط، ولم أحرض عليه قولاً أو فعلاً، ولدي كل الأحكام القضائية بالإفراج عني، والتي بلغت ثمانية وعشرين حكماً، وأقيم بصعيد مصر (طالب بكلية الإعلام)، فماذا تعلم عن أساليب هذا النظام الذي يمور في حمأة وبيئة ومستنقع آسن من الأكاذيب، ويهوي إلي درك هابط، وهوة سحيقة من التضليل، سوف أحكي لك نذراً يسيراً جداً، مما تشيب له الولدان وتقشعر له الأبدان، و يفزع له الوجدان، فلقد رأيت وذقت تعذيباً لا يخطر علي قلب بشر، إي وربي.<br />كنا خمسة من المعتقلين (م) طالب بالسنة الأولي بكلية الطب، و(أ) طالب بالفرقة الثانية بدار العلوم، و(أ) مهندس، و(س) مدرس ثانوي، وأنا خامسهم، في زنزانة عرضها متران وطولها متران ونصف تقريباً، وارتفاعها أربعة أمتار، جدرانها منقوعة في الكيروسين إمعاناً في عدم تنفس الهواء الجيد، وإعدامنا بالبطيء بخراب الصدر والرئتين، وأرضيتها من الأسفلت، ولا يوجد في الزنزانة أي نوافذ أو فتحات للتهوية، إلا كوة صغيرة قطرها (١٠ سم تقريباً) في سقف الزنزانة لمراقبتنا، ولسوف أضحك كثيراً إن سألتني عن النور والكهرباء والشمس، فتلك أمور ترفيهية، بل لا أبا<br />اقرأ بقية التعليق .."
archived = "2006-09-13"
capture_url = "https://web.archive.org/web/20060913030109/http://masr.20at.com:80/article.php?sid=439&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
