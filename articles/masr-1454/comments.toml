subject = "احلم معايا"
author = "مصرى"
posted = "2007-01-17"
text = "ياعم الرخم منك لة الراجل بيتكلم فى موضوع لة علاقة بالذوق سواء غنى او فقير<br />لية ندخل فى التريقة والفقر واللة العظيم ياجماعة دى حملة مدبرة على المصريين<br />ارجوكم ياحضرات اتركوا هذا الموقع وارحلوا عنة دة مش موقع للتشاؤم"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161544/http://masr.20at.com:80/article.php?sid=1454"
