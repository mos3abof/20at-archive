[[comments]]
order = 2
subject = "مع العلاوة الجاية"
author = "فارس_fr"
posted = "2007-01-17"
text = "متزعلش ياحج عباس ان شاء الله مع العلاوة الجاية انظف سطح البيت خالص واعمل روف جاردن وبسين وملعب تنس عشان يكون شكلها حلو لسيادتك وانت بتبص علينا من الطيارة . يا سيدي الفاضل بيتهيالى ان المصري بيخزن من مبدا القرش الابيض ينفع فى اليوم الاسود لان الاغلبية حالتهم تعبانه ميقدرش يشترى الجديد على طول ممكن الجديد يبوظ يبقي عامل احتياطه ويرجع لاستخدام القديم تانى , واغلب الناس ماشية بالمقوله المعروفة \" اركنها يمكن تنفع \" . موضوعك جميل قوى بس ان شاء الله تطبقه فى سويسرا او اوروبا شوف الدخل هناك كام والدخل هنا كام !!!!"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161544/http://masr.20at.com:80/article.php?sid=1454"

[[comments]]
order = 3
subject = "كلام هجايص"
author = "ياعم احنا غلابة ومعظم البيوت بدون اساسات ولا عمدان وايلة للسقوط وواقفة على حيلها بالسر الالاهى - يقوم حضرتك تقول ازرعوا فوقها واملوا السطح ازهار ومية - ان شاء اللة هتطب واقعة وهتبقى سنة سودة على شورتك الهباب"
posted = "2007-01-17"
text = "الناس بتربى فوق السطوح فرختين يبيضوا بيضة للعيال يفطروا بيها ويدبحوها فى احد المواسم<br />فكرتك تنفع فى دول تانية انما عند الغلابة<br />فية حسابات تانية<br />ربنا يصلح حالك"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118161544/http://masr.20at.com:80/article.php?sid=1454"

