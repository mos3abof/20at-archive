text = "اوافق ان تحكم مصر سيدة وأرشح السيدة<br />سوزان مبارك لأني أريد نهضة وثورة في التربية والتعليم وأرى أنها ستقوم بذلك ."
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107050400/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

[[comments]]
order = 65
subject = ""
author = "ارشح الحاجة تفيدة"
posted = "2009-12-07"
text = "الحاجة تفيدة ست كاملة من حارتنا وممكن تنفع تمسك البلد لانها بتصالح الراجل مع زوجتة وبتحل مشاكل الاسر وديا وبعيد عن المحاكم<br />وفى فترة كانت رئيس وزراء باكستان سيدة اسمها بنازير بوتو<br />وفى بنجلاديش رئيسة وزراء اسمها شيخة<br />وفى تركيا رئيسة وزراء لا اذكر اسمها<br />ووقفوا وقفة شجاعة جدا مع البوسنة ايام الحرب<br />والدول الثلاث اسلامية وكانت بتحكمها نسوان اية الحكاية"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107050400/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

