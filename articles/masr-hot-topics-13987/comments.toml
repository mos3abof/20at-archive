subject = ""
author = "ابو حسين"
posted = "2009-11-17"
text = "انا اويد الحديث الشريف فيما معناه لاخير فى قوم امروا عليهم امرأة مع الاحترام لانثى التى كرمها الدين الاسلامى وامرها بان تقر فى بيتها بيتها بيتها<br />بسم الله الرحمن الرحيم \"وقرن فى بيوتكن ولا تبرجن تبرج الجاهلية الاولى\" فى حال ان احنا خلينا المرأه مثل الرجل مع ان الله امرنا بان للذكر مثل حظ الانثيين ارجوكم يا مصريين يا مسلمييييييييييي ين اتقو الله والانثى تتقى الله فى نفسها ولا تتشبة بالرجال وتلبس البنطالون والمينى والبادى ما سمعنا ايام الرسول ان المرأة مسكت قيادة معينة او ترك لها حكم اة اة اة اة من عواقب هذا عند الله اتقين الله"
archived = "2009-11-29"
capture_url = "https://web.archive.org/web/20091129013901/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

