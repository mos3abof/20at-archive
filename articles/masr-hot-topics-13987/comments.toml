text = "رشحت الرقاصة شريهان عشان مصر بلد الثقافة والرقص الشرقي وهز البطن واتخيل البلد بعد تسلم ام الدنيا شريهان الحكم وهي ورئيسة الحكومة ليلى علوي والوزيرات فيفي و يسرا و نجلاء و شرين و و و و…الخ من الفنانات الفاتنات التي تزخز وتفتخرون بهن ومايجي الصبح حتى تجد طابور كبير من اشباه الرجال من اجل شم رائحتهن فقط اما الرجالة الفحولة من اجل النيك فيمكن لهن استيرادهن حسب طلباتهن<br />ههههههههه"
