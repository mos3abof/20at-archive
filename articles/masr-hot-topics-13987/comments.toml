subject = ""
author = "مصرية وافتخر"
posted = "2009-12-02"
text = "ايه الى دخل الجزائر ده استفتاء لرأسة مصر ولا الجزائر انتو حشرين نفسكم فى كل حاجة يا ساتر ايه ده وانا برشح للجزائر ام فليقة رئيسة جديدة ؟؟<br />اما لمصر نختار جمال نختار علاء انتوا مالكو بلادنا واحنا حرين فيها يا حشرين<br />انا شخصيا اتمنى عمرو موسى يكون هو الرئيس ولا ما يعجبش بلد المليون !!!!!!!!!!!<br />وعلى فكرة مصر فيها اكتر بكتير من مليون شهيد فى كل مكان العراق - فلسطين - حتى فى الخونة الجزائر ناكرين الجميل<br />للاخ الى بيرشح شريهان انا برشح امك افضل علشان شريهان تعبانة شوية وتكون ريئسة الوزرة وردة علشان كل رجالة مصر عرفينها واظن انت فاهم ولا مبتفهمش الا فرنساوى ذى اسيادك يا حسالة ابعدوا بقى عننا ياساااااااااتر ارف<br />وظهرت فجأة حنيت فلسطين وانتو كنتو فين والعالم كله كان فين والله احنا فى شهاء كتير مننا فى فلسطين بوازع دينى مش شغل استغلال مواقف يا جزائرى"
archived = "2009-12-07"
capture_url = "https://web.archive.org/web/20091207034923/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

