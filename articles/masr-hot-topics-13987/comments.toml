posted = "2009-12-02"
text = "اقتباس الجزئري الحر:<br />اولا هو عندكم رجالة في مصر .اين هو الرجالة اللي بتتكلمو عليهم .عندما تفتحو سفارة اسرائيل كانو فين الرجالة .عندما كانت تقصف غزة بالصواريخ الفصفورية اين كانو الرجالة .حشا الصالحين<br />اولا الجزائر عندها منظمات بتدعم الامهات العازبات<br />احنا معندناش الكلام دة<br />واحنا احسن رجالة فى الدنيا<br />ثانيا لما غزة اضربت بالطيارات والصواريخ انو معملتوش حاجة"
