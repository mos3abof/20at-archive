[[comments]]
order = 70
subject = ""
author = "كرم الفرا"
posted = "2009-12-10"
text = "اقتباس Max against Algeria:<br />اقتباس مصرية وافتخر:<br />اما لمصر نختار جمال نختار علاء انتوا مالكو بلادنا واحنا حرين فيها يا حشرين<br />انا شخصيا اتمنى عمرو موسى يكون هو الرئيس ولا ما يعجبش بلد المليون !!!!!!!!!!!<br />وعلى فكرة مصر فيها اكتر بكتير من مليون شهيد فى كل مكان العراق - فلسطين - حتى فى الخونة الجزائر ناكرين الجميل<br />للاخ الى بيرشح شريهان انا برشح امك افضل علشان شريهان تعبانة شوية وتكون ريئسة الوزرة وردة علشان كل رجالة مصر عرفينها<br />بجد يسلم لسانك وبضم صوتى لصوتك فى اختيارك لعمرو موسى لانه بجد شخص محترم لاقصى درجة ممكنة<br />ثانيا بقى بخصوص راى الجزائرى الراجل الى بيرشح شريهان<br />انا مش هقولك اكتر من ان كل الى بتعملوه ده بتعملوه لانكم عارفيين انكم اصغر مننا بكتير<br />انتم حثالة العرب وحتى فى ثورتكم احنا الى راعيناهالكم وحاربنالكم يا رجالة<br />وان كنت ناسى اسال ابوك وامك هم حضروا الايام دى وعارفين كويس مين الى حارب<br />يا راجل ده حتى الفيلم الوحيد الى بيحكى قصة الثورة الجزائرية تمثيل وانتاج مصرى<br />شكرا للاخ الجزائرى المحترم"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107050400/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

