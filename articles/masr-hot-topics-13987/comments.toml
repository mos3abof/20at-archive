[[comments]]
order = 14
subject = ""
author = "أحمد كريم"
posted = "2009-11-23"
text = "مفيش عيب ان امرأة تتولى حكم حاجة… لكن الأزمة ان ده يحصل طول ما في رجالة تانية موفقة وقادرة وعندها الكفاءة اللازمة للحكم<br />فمثلا شجر الدر لما مسكت مصر من بعد زوجها نجم الدين أيوب، ورغم انها مسكتها بقبضة من حديد ودافعت عن مصر ضد الغزاء، إلا أن الخليفة العباسي بعت لها وقال لها ما معناه \"لو كانت الرجالة خلصت عندكم قولولنا واحنا نبعت لكم راجل\"<br />وده كلام سليم إلى حد كبير، لأنه ما دام عندي راجل قادر يتولى الأمور، أسيبه وأحط واحدة ست في وش المدفع؟؟؟ ده غباء، أما بقى لما الرجالة يخلصوا،، يبقى ممكن ست تمسك برااحتها شلة الستات اللي فاضلين لها في البلد"
archived = "2009-11-29"
capture_url = "https://web.archive.org/web/20091129013901/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

[[comments]]
order = 15
subject = ""
author = "بلاش والنبي"
posted = "2009-11-24"
text = "هي الرجالة نافعة لما الستات هاتنفع<br />البلد دي لا عايزة راجل ولا ست<br />البلد دي مالهاش إلا الاحتلال<br />أول ما حد بيضايق الناس بيتحدوا وبيحبوا بعض والشعب بيحكم نفسه<br />ولنا في مباراة الجزائر خير مثال<br />البلد مالهاش غير الاحتلال"
archived = "2009-11-29"
capture_url = "https://web.archive.org/web/20091129013901/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

[[comments]]
order = 16
subject = ""
author = "احمد يحيى"
posted = "2009-11-24"
text = "سأل رسول الله صلى الله عليه وسلم عن من يجكم فارس - قالوا ( تحكمهم امرأة ) - فقال رسول الله صلى الله عليه وسلم - ( ما افلح قوم ولوا امرهم امرأة )<br />وذلك ليس انتقاصا من قدر المرأة ولكن لان الله عزوجل جعل الاسباب وسخر الاشياء - فمن الطبيعة البشرية الفطرية للمرأة انها لا تستطيع الحكم العام للبلاد بشكل جيد كما ينبغي - ولا تستطيع ان تتحمل اعباء الحكم و تبعاته ولا ان تقضي الامور بشكل جيد كما يرضى الله عزوجل<br />بالنسبة لفترات حكم النساء مثل شجرة الدر مثلا - ففترة حكمها لم تتجاوز الـ 88 يوما وما حققت خلالها اي انجازات تذكر في التاريخ<br />وفترة حكم ملكة سبأ \" بلقيس \" لم تشهد المملكة اي تقدم عملي او عسكري يذكر -<br />ومع هذا هناك نساء آتاهم الله حكمه و سداد في الرأى مثل السيدة عائشة و ام سلمة و غيرهم ولكن ليس في مجال الحكم و الامارة<br />وجزاكم الله كل خير"
archived = "2009-11-29"
capture_url = "https://web.archive.org/web/20091129013901/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

