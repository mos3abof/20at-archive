posted = "2009-12-04"
text = "اقتباس ارشح عمرو خالد:<br />اقتباس عبد الكريم الجزائري:<br />رشحت الرقاصة شريهان عشان مصر بلد الثقافة والرقص الشرقي وهز البطن واتخيل البلد بعد تسلم ام الدنيا شريهان الحكم وهي ورئيسة الحكومة ليلى علوي والوزيرات فيفي و يسرا و نجلاء و شرين و و و و…الخ من الفنانات الفاتنات التي تزخز وتفتخرون بهن ومايجي الصبح حتى تجد طابور كبير من اشباه الرجال من اجل شم رائحتهن فقط اما الرجالة الفحولة من اجل النيك فيمكن لهن استيرادهن حسب طلباتهن<br />ههههههههه<br />ويا ابن المره [ *** ]ه نسيت ليه وردة الجزائرية يا معرص<br />وردة الجزائرية انشاء الله حتحكم الجزائر<br />اقتباس عبد الكريم الجزائري:<br />الرقاصة شريهان احسن امراة مرشحة لحكم ام الد يا مصر<br />امك احسن وحده تحكم زبي يا بن ال[ *** ]ة"
