subject = ""
author = "م / احمد محسنرءضؤع"
posted = "2009-12-03"
text = "يعني في الاول وفي الاخر<br />احنا دولة اسلامية قبل اي حاجه<br />ولا يجوز شرعا ان يحكمنا سيدة<br />فالمرأة مكرمة من قبل الاسلام في كل شيء<br />الا المناصب القيادة<br />فلا يجوز ان تقودنا امرأة في حكم او جيش او غيرة<br />فهذا منصب يحتاج الى رجل مسلم واعي فاضي للحكم ذو شجاعة وجرأة<br />هكذا نحن لابد ان نرجع للاسلام وللدين الاول<br />ثم بعدها نحكم مين اللي يحكمنا<br />طبعا الاسماء اللي مرشحة كلهاااا اسماء محترمة ولكنها للاسف كلها تدخل تحت وطأة الحكم العلماني لمصر<br />وهو فصل الدين عن الحياة العامة<br />وطبعاااا استحاله حالنا هيتصلح واحنا بعيدين كل البعد عن دين ربنا<br />لما لا وهو شرع الله في الارض<br />والله المستعان"
archived = "2009-12-07"
capture_url = "https://web.archive.org/web/20091207034923/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

