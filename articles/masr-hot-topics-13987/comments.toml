posted = "2009-12-06"
text = "رقاصه تحكم البلد دة إلي كان ناقص<br />علشان رأساء مصر ووزرائها بيشجعو الرقص والكورة والفن<br />خلوا إلي ميشترى يتفرج<br />مش عارف بتاع الجزائر شايف نفسه ليه ما كلنا فى الهوا سوا"
archived = "2009-12-07"
capture_url = "https://web.archive.org/web/20091207034923/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

[[comments]]
order = 62
subject = ""
author = "مخنوق من الكاتب ده"
posted = "2009-12-07"
text = "هى دى اللى ناقصه ان مرة تحكمنا ما هى خابت ونبي اللى بيكتبو المواضيع يرحمونا شويه<br />انشر يا عم الديمقراطى"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107050400/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

[[comments]]
order = 63
subject = ""
author = "أسامة السلاموني"
posted = "2009-12-07"
text = "السلام عليكم<br />بعد إذن سيادتكم لقد أبلغتكم عن إساءات في التعليقات التي تنشر علي موقعكم وألفاظ خارجة تخدش الحياء . ولم يحدث حتي الأن أن قمتم بإزالتها فأرحوا من سيادتكم إزالتها حتي يظل موقعكم من المواقع المتميزة للشباب .<br />وجزاكم الله خيرا علي ما تبزلونه من جهد .<br />شكرا ."
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107050400/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

[[comments]]
