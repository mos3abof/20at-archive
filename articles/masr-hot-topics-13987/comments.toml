text = "والنبي يا اخوانا يا مشرفين … مفروض تعملوا بلوك للايبيهات الجزائر .. علشان شغل العيال الي بيحصل دا .. وبعدين يحكمنا راجل او ست .. دا ميخصكوش .. حاربنا في فلسطين ولا لا دا برضه ميخصكوش .. السكه مفتوحه .. تعالي من البحر ومن الجو حاربوا السكه مفتوحه .. هنمونلكم الطيران علي حسابنا .. بس ونبي بلاش حنااااااجر ع الفاضي .. وبسبب امثالكم وتعليقاتكم دخل العاطل في الباطل<br />بالنسبه لموضوع راجل او ست .. بالنسبالي مش فارقه .. بس انا شايف ان مصر مفيش فيها كوادر نسائيه تعرف تشتال مسئوليه امه لحد الوقتي"
