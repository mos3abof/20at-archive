author = "وماله يا اخويا"
posted = "2009-11-26"
text = "نرشح ستات وواحد زمان كان مرشحه نفسه وعايز يرجع الطربوش وواحد بيقول الشباب حل مشكلة البطالة سنارة واصطاد سمك<br />والله مبروك عليك الرئاسة يا مبارك لان مفيش رجالة غيرك تحكم البلد<br />يعني خلاص خلصت الرجالة اللي عندنا عشان نرشح ستات يعني من نجاحهم قوي في المناصب اللي ماسكينها هنمسك البلد لوحده ست<br />وبعدين يعني شجرة الدر دي كانت مصيبة ومسكت البلد عشان كانت زوجة الملك اللي مات ومسكت فترة الحرب مع الصليبيين بس وكان حكم مستتر وراء الملك المتوفي<br />ولما اعلنت موت الملك تركت العرش لعز الدين ايبك<br />يريت نشوف بجد مين ينفع يحكمنا"
archived = "2009-11-29"
capture_url = "https://web.archive.org/web/20091129013901/http://www.20at.com:80/masr/hot-topics/13987-2009-11-10-13-53-03.html"

