text = "كان الحرى بأوباما ان يقول جملة واحدة للعرب<br />اذا أردت ان تطاع فسل المستطاع وما المستطاع ولا يملك امام اليهود حيلة ولا حول له ولا قوة<br />ثم أي مراد لنا تحقق او خرجنا بالخطاب ببصيص أمل لتحقيقه<br />وكيف لمن لا يتعاطف معك ويذكر ألمك ان يعمل على تضميده او وقفه<br />ما اوباما الا حجر شطرنج جديد لليهود وما يعيدك يا فلسطين غير نزول المسيح فإنتظروا اني معكم من المنتظرين<br />ولندع جميعا اللهم إصرف عنا شر اوباما الذي إرتد عن الدين من بعد ما تبين له الحق<br />والله الوكيل بيد مقاليد كل امر عليه توكلنا واليه ننيب<br />اللهم بيدك أمرنا وأنت تتحكم به سخره لما فيه الخير لنا وقنا واصرف عنا شر الكافرين<br />آمين"
archived = "2009-06-11"
