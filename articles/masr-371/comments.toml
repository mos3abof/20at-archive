subject = "بصراحه"
author = "ياء"
posted = "2006-05-25"
text = "احلى حاجه ان من ساعه المرشد ما تولى المنصب اصبح نجم الصحف الاول القوميه والمعارضه<br />ملحوظه :<br />المرشد بيظهر فى برامج كتيره ( الجزيره - قناه العالم - ام بى سى - العربيه )<br />اشمعنا بيبقا عصبى فى الاحاديث قلى مبنشفهاش<br />حاجه تخليك تشك الراجل كان ذى العسل مع محمود سعد ليه بيقولو عصبى<br />تعبتوا اعصابى<br />الحريه للمعتقلين الحريه للوطن<br />بلادى بلادى لك حبى وكفاحى<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192813/http://masr.20at.com:80/article.php?sid=371&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "اقتباس"
author = "ياء"
posted = "2006-05-25"
text = "منقول من اخوان اون لاين<br />كانت بحق \"فضيحة بجلاجل\" على الملأ إذا جاز التعبير لكل أصحاب الجرائد الصفراء التي تصطاد في المياه العكرة، ذلك الموقف الذي تعرض له عمرو الليثي- رئيس تحرير جريدة (الخميس)-<br />لكن الله أخزى الليثي على الملأ وفي التليفزيون الحكومي وأمام الملايين الذين يشاهدون برنامج (البيت بيتك) مساء الأربعاء 24/5/2006م فقد سرد الطالب الذي أجرى الحوار مع فضيلة المرشد تفاصيل ما جرى خلال حواره مع الأستاذ عاكف، وكيف أن المرشد أحسن استقبالهم، حتى إنه فضَّل الحوار معهم على لقاءٍ مع إذاعة الـ(BBC) البريطانية، وأورد الطالب نصَّ الكلام الذي جاء فيه ما اعتبره الليثي نصرًا كبيرًا، وصدَّر به العناوين الرئيسة في جريدته، ومفاده أن الطالب سأل المرشد عن السبب من المخاوف التي تَعتري الأقباط والليبراليين والنظام من وصول الإخوان للحكم، فكان رد المرشد- كما قال الطالب في البرنامج- أن هذا الخوف لا مبرر له؛ لأن هذه المخاوف أوجدها النظام وخلقَها في نفوس الشعب؛ بسبب القمع والعنف الذي يتعامل به مع قوى المعارضة وخاصةً الإخوان، ومن لا يحب الحكم بالإسلام وبشرع الله لا يكون محبًّا للإسلام نفسه، ومن يعارض هذا سيكون محبو الإخوان أول من يضربونه بالأحذية وليس \"بالجزمة\" وليس المرشد أو الإخوان هم الذين سيضربون المعارضين كما ادعى الليثي.<br />حمدلله على السلامه يا جى من المعتقل وحشانى الابتسامه وشك ولا القمر<br />الحريه للمعتقلين الحريه للوطن<br />بلادى بلادى لك حبى وكفاحى<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192813/http://masr.20at.com:80/article.php?sid=371&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

