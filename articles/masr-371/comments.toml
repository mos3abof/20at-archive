subject = "فيه مصيبه جايه"
author = "الاستاذشيكو"
posted = "2006-05-26"
text = "بص لما تلاقي الاعلام الحكومي هايقطع في المرشد العام للاخوان اعرف ان فيه مصيبه جايه للبلد وهمه عايزين الناس تتشغل باي حاجه المهم المصيبه تهده وتعدي وكله ينام وهوة المرشد معصوم من الخطا يعني ما النظام المصري شغال عك في البلد من زمان ومحدش بيقوله انت بتعمل ايه"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192813/http://masr.20at.com:80/article.php?sid=371&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "فى الجون يا عبدالظاهر !"
author = "الشمحطجى"
posted = "2006-05-26"
text = "مقال فى الجون يا عبدالظاهر ... النظام الوسخ الى احنا عايشيين فى كنفه عايز يوصل رسالة للناس بتقول \"إن مفيش غير مبارك؟!\" .... من بعد حبس ايمن نور وخبل نعمان جمعة ورفعت السعيد خلاص بقى مخبر بيتلككو على مرشد الاخوان ...<br />والله يا عبدالظاهر يا أخويا ...جزمة الاخوان هتكون ارحم من ولاد الاحبة الى بيحكمونا دلوقت !!<br />ومشكرين على مقالك اللزيز"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192813/http://masr.20at.com:80/article.php?sid=371&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

