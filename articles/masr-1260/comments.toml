[[comments]]
order = 1
subject = "لا نعرف كيف نربى اولادنا"
author = "حقيقة لا نعرف كيف نربى اولادناالشخص الذى يتلذذ بتعذيب انسان لا حول لة ولا قوةو جائع و خائف بل مرعوب هو انسان لم يتعود احترام ادمية الناس هذا الشخص لا"
posted = "2006-12-07"
text = "ينتمى الى عالم البشر ونفسة حيوانية ومن فصيلة الحمير والبغال لتركبوها ونفس العقلية ويضع لنفسة المبررات بانة ينفذ الاوامر اى اوامر فى ان يلطم هذا المقيد او يضرب هذا المقيد<br />او تريدون التقدم وتربوا ابنائكم على تلك النزعة الحيوانية ان اهانة الانسان المكرم من اللة هو خطا فى حق البشرية والناس ومن اجل ماذا<br />احسنوا تربية ابنائكم حتى لا يكونوا برابرة كما نسمع عندما يكبرون"
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201132/http://masr.20at.com:80/article.php?sid=1260"

[[comments]]
order = 2
subject = "ارهاب الدولة"
author = "عباس محمود"
posted = "2006-12-08"
text = "بداية..هذا الجهاز لا علاقة له بلامن أو الآمان..والاصح تسميته بجهاز ارهاب الدولة..لان لا وظيفة له سوى ارهاب المواطنين من خلال القمع و الاعتقال و التعذيب.. فهو جهاز غير قانوني و غير شرعي و من الازم انهاء وجوده. لكنه اداة كل دولة قمعية استبدادية. وتأكد تماما أنه لا يقع الاختيار الا على أحقر نوع من البشر للعمل في هذا الجهاز. كل من لا ضمير ولا دين ولا أخلاق له.. أصحاب النفوس المريضة الحاقدة.. الدهماء من عبدة الطاغية و دنانيره."
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212201132/http://masr.20at.com:80/article.php?sid=1260"
