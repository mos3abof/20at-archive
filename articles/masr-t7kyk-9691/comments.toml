posted = "2008-07-25"
text = "من يوم ما عرفنا الاخوان المسلمين يا اخ شايف وهي دي دروسهم<br />سجن ومعتقلات وهروب والموضوع طرح كثيرا قبل كده<br />واريد ان اقول شيئا المرشد العام سجن عشرين سنه<br />والشيخ محمد متولي الشعراوي فسر القران في عشرين سنه<br />ايهما خدم الاسلام<br />واوجه نداء الى الشعب المصري كله لا تنتخبوا الاخوان المسلمين في اي انتخابات مجرد نصيحة<br />الاخوان المسلمين ما عندهمش اي حل لمشاكلهم<br />ممكن عمر خالد يكون عنده حلول للمشاكل الاقتصادية<br />الاخوان المسلمين دول سجون ومعتقلات وبس"
archived = "2009-10-28"
capture_url = "https://web.archive.org/web/20091028002152/http://20at.com:80/masr/t7kyk/9691.html"

