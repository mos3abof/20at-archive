posted = "2008-07-24"
text = "عاش طريدا كالكلب الضال - تحت اى هدف - هل نحن كفار وبسلامتة سيهدينا الى طريق الرشاد<br />هل عندة خطة اقتصادية للببناء كطلعت حرب مثلا<br />هل عندة مشاريع وادى السيليكون وانتاج الكترونيات تصدر لبلاد الفرنجة<br />الا يشعر بالعار والسجادة التى يصلى عليها صنع الصين الشعبية بتوع بوذا وعبادة التماثيل<br />هربان لية يا حمار<br />هل كل الدعاة هربانين<br />الرجل بحاجة الى عرضة على اخصائى امراض نفسية فهو حالة مرضية نفسية بحاجة الى علاج<br />ادعوا الى سبيل ربك بالحكمة والموعظة الحسنة - وليس بالهرب والفرار الا اذا كنت مجرما"
archived = "2009-10-28"
capture_url = "https://web.archive.org/web/20091028002152/http://20at.com:80/masr/t7kyk/9691.html"

