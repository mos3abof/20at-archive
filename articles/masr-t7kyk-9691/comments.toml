[[comments]]
order = 10
subject = ""
author = "من شعر القرضاوي"
posted = "2009-10-25"
text = "يا سيد الرسل طب نفسا بطائفة *** باعوا الي الله ارواحا وابدانا<br />قادوا السفين فما ضلوا وما وهنوا *** وكيف لا وقد اختاروك ربانا<br />اعطوا ضريبتهم للدين من دمهم *** والبعض يزعم نصر الدين مجانا<br />اعطوا ضريبتهم صبرا علي محن*** صاغت بلال وعمارا وسلمانا<br />عاشوا علي الحب افواها وأفئدة**** باتوا علي البؤس والنعماء إخوانا<br />الله يعرفهم أنصار دعوته *** والناس تعرفهم للخير اعوانا<br />والليل يعرفهم عباد هجعته *** والحرب تعرفهم في الروع فرسانا<br />دستورهم لا فرنسا فننته ولا روما ولكن قد اختاروه قرآنا<br />زعيمهم خير خلق الله لا بشرا إن يخطي حينا يضل القصد احيانا<br />الله اكبر ما زالت هتافهموا ***لا يسقطون ولا يحيون إنسانا<br />نشكوا الي الله احزابا مضلله كم أوسعونا إشاعات وبهتانا<br />مازال فينا ألوف من ابي لهب يؤذون اهل الهدي بغيا ونكرانا<br />مازال لإبن سلول شيعه كثروا أضحي النفاق لهم وسما وعميانا<br />يا قوم قد ايد التاريخ حجتنا وحصحص الحق للمستبصر الآنا<br />إنا اقمنا علي إخلاص دعوتنا وصدقها ألف برهان وبرهانا"
archived = "2009-10-28"
capture_url = "https://web.archive.org/web/20091028002152/http://20at.com:80/masr/t7kyk/9691.html"

