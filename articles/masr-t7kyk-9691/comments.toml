text = "ليه الغلط يا شايف؟؟؟؟؟؟؟؟؟؟؟ ؟؟ محدش في حياتك قالك إنه في أساليب و ذوقيات البني آدمين اللي زينا بيتكلموا بيها؟؟؟؟؟؟؟؟؟؟؟ ؟؟ و لا أنتوا عندكم بتفضلوا الطرق دي في الحوار؟؟؟؟؟؟؟؟؟ ؟؟؟؟؟<br />ممكن تعرض وجهة نظرك أيا ما كانت بأسلوب أنظف من كدة و مش عايز أكرر لك الشتايم [ *** ] اللي شتمتها و نقضي القرن الحادي و العشرين بنشتم في بعض ياااااااااااااا اااااا … يا بني آدم يعني …<br />البلد كانت مسلخة كبيرة أيام الخديوي عبد الناصر يا شايف و لو كانوا مسكوك كان زمانك مش شايف حاجة خالص و لا فاكر حاجة خالص و كل لحظة في مسلخة عبد الناصر كانت هتبقى كابوس لا يعلمه إلا الله … فهمت ياااااااااااااا ااا يا بني آدم؟؟؟؟؟؟؟؟؟؟؟؟ ؟؟؟؟؟؟؟؟؟<br />شكرا على شوية قلة الأدب دول اللي بيخلونا نحمد الله على نعمة الإنسانية و الإسلام … سلام يا غالي"
archived = "2009-10-28"
capture_url = "https://web.archive.org/web/20091028002152/http://20at.com:80/masr/t7kyk/9691.html"

