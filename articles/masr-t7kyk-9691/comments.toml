posted = "2008-07-24"
text = "\"اجتمعت الجهود، وتضافرت الخبرات، وتوجَّهت النيَّات المخلصة -بإذن الله تعالى&—1648;- إلى&—1648; إنشاء موقع (الإمام العلامة)، أول موقع على الإنترنت يُمثل مدرسة مميزة فريدة ذات فكر راقٍ، وعلمٍ منير غزيرٍ حيث يجمع أعمال علماء وآئمة مميزين؛ فهنا ستجدون أعمال كاملة لفضيلة الإمام العلامة \"علي جمعة\" مفتي الجمهورية ورمز من رموز الأمة ودرة تاج علمائها؛ خطب، ومحاضرات ، ودروس ، وفتاوي وأخبار ، وهي متاحة إما صوتية أو مرئية، إضافة لحلقاته التلفزيونية. .<br />كما تحتوي مدرسة \"الإمام العلامة\" على أعمال الشيوخ ، محمد إبراهيم عبد الباعث، د/ يسري جبر، جمال فاروق، د/ أسامة السيد، د/ محمد حسن عثمان، أشرف مكاوي، محمد وسام.<br />سيتم افتتاح الموقع ليلة 27 رجب 1429 إن شاء الله .<br />وعنوان الموقع:<br />www.alimamalallama.com"
archived = "2009-10-28"
capture_url = "https://web.archive.org/web/20091028002152/http://20at.com:80/masr/t7kyk/9691.html"

