posted = "2009-11-10"
text = "the cont of montcresto دي طبعا قصة عارفنها كويس ودرسناها في الإعدادية للي قبل مواليد 1983 وطبعا حضراتكم عارفين واللي مش عارف أقول له دي قصة بتحكي عن بطل هارب من السجن زي ما هما عاملينه بطل بس شوفوا للأسف البطل ده من فرنسا وهما أما جهم وإحتلونا من زمان لغايت سنة 1983 إحنا بندرسها في مناهجنا شوف بقه نفسك وإنته بتدرس عن بطل مش من بلدك برضه هتقول نفس الكلام وأظن ده ما كانشي بيدعي للإسلام ولا كان ملتزم ولا حاجة بس هما بيعرفوا يحكوا عن أبطالهم كويس وطبعا حضرتك يا شايف شايف فين اللي عمله طلعت حرب ولا مصطفي كامل ولا مصطفي مشرفة ولا زويل ولا أي حد عمل حاجة للبلد طبعا كله زي القرع بيمد لبره لأنه مخنوق والدليل على كده شوف أحوالنا بعد سبعين سنة من ساعتها والبلد ضايعه ولسة من دول العالم الثالث المتخلفة يبقي مين اللي مضيع البلد وخانقها (وأما من سار على خطى فرعون فإنه يقدم قومه يوم القيامة فأوردهم النار وبئس الورد المورود) إوعي تكون راضي عن حاجة عقلك وقلبك بيقولوا إنها غلط ويحشر المرء مع من يحب إسألأ عن الناس اللي إنته بتدافع عنهم ولو حاسس بس إنهم مش ماشيين صح مية المية طيب لو كانوا ظلمه كمان"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203080135/http://www.20at.com:80/masr/hot-topics/9691.html"
