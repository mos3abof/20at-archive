text = "اية الثقافة دى<br />الدنيا هتقف علشان شوية مشخصاتية ونسوان ارزاقية بيدوروا على شغل<br />اللى كاتب الموضوع يا اما مخة مسطح او ممسوح او محتاج فرمتة من تانى<br />هل هذة هى مشاكل الشباب ؟<br />هى دى اهتمامات الشسباب<br />هو الموقع بقى زبالة لية<br />لهم حق المعلقين يهربوا"
