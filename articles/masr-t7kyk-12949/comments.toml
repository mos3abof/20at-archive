[[comments]]
order = 3
subject = ""
author = "محمد جمال الدين"
posted = "2009-08-18"
text = "@مش دا المهم :<br />اعتقد أني عندي حل للمشكلة دي وهو :<br />إطلاق قمر صناعي مصري جديد يستخدم في مجال الإنترنت و الإتصالات … و تبقى الخدمة فضائية … لا أنقطاع ولا بتاع<br />وإذا كان الحل ده مش هينفع يبقى نعمل شبكة إنترنت جديدة وندمجها ع الشبكة الأم .. بحيث يفضل لنا السيطرة علي شبكتنا حتي لو الشبكة الأصلية وقعت … يعني هيبقى شبكتين في شبكة .. وقوع واحدة لا يؤثر علي المهام الرئيسية للأخري .<br />وإذا كان ع الحلول ففيه حلول كتيراوي … بس السؤال الأهم<br />مين هينفذخا بأيادي مصرية مصرية وهل الحكومة هتدعم العقول المصرية بما يتناسب و قدرتها الفائقة علي معالجة الأزمات ."
archived = "2009-08-18"
capture_url = "https://web.archive.org/web/20090818211953/http://www.20at.com:80/masr/t7kyk/12949-2009-08-16-13-23-08.html"

