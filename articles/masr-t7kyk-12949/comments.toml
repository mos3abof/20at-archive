posted = "2009-08-17"
text = "المهم يا محمد جمال الدين يا خوني ان الازمة المالية العالمية اللي حصلت كشفت عن قضية خطيره الا وهي ان شبكة البنوك تتحكم فيها اسرائيل<br />واسرائيل سحبت فلوسها من اكبر بنك في العالم فكل البنوك اتشلت وجاعت وحصلت ازمة عالمية في العالم كله<br />ـــــــــــــــ ــــــــــــــ<br />موضوعنا هنا يا محمد جمال الدين ان الانترنت دا شبكة عالمية والشبكة دي بتتحكم فيها اسرائيل او اليهود<br />اي والله اليهود هما اللي بيتحطموا في هذه الشبكة التي اصبحت شريان الحياه للعالم كله وتستطيع اسرائيل شل شبكة الانترنت في اي وقت<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />ايه رأيك يا محمد جمال الدين<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــ<br />ها انا قد سبقت واخبرتكم<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــ<br />حل عنده حل<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـ<br />مش احمد الهواري ولا عبدالله الطحاوي (طحطح)"
