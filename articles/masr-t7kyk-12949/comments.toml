[[comments]]
order = 5
subject = ""
author = "اسرائيل وشبكة الانتر"
posted = "2009-08-19"
text = "يا استاذ محمد جمال الدين<br />بنقولك ان الانترنت شبكه عالمية بتتحكم فيها اليهود زي شبكة البنوك بالضبط وتستطيع اسرائيل اغلاق الشبكة في اي وقت<br />الحل بتاع حضرتك دا زي حل البنوك الاسلامية<br />لا تسمن ولا تغني من جوع<br />انا بقولكم على معلومة مهمة جدا الا وان اسرائيل تتحكم في شبكة الانترنت<br />(ها انا قد سبقت واخبرتكم)<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />مش شريف الدواخلي ولا البراء اشرف<br />ولا رضوى حسن ولا مروى صلاح"
archived = "2009-08-28"
capture_url = "https://web.archive.org/web/20090828110309/http://www.20at.com:80/masr/review/12949-2009-08-16-13-23-08.html"

[[comments]]
order = 6
subject = ""
author = "اسرائيل والسيطرة"
posted = "2009-08-20"
text = "بالنسبة للاخ اللي بيتكلم على سيطرة اسرائيل على شبكة الانترنت هذا صحيح ووارد واسرائيل دائما تحب السيطرة على اعدائها وقال نتنياهو ذات يوم السلام هو ان تضع حذائك على رقبة عدوك<br />وعلى سبيل المثال فيه حاجه اسمها النيل وله منابع ينبع من بحيرة فيكتوريا وبلاد الحبشه اثيوبيا فاسرائيل تعاونت مع اثيوبيا في انشاء سدود على نهر النيل حتى تتحكم في المياه التي تصل الى مصر بحيث<br />فتحكم اسرائيل في شبكة الانترنت وارد<br />ويا اخ محمد جمال الدين بصفتك صحفي عايزين نفهم الموضوع يعني شبكة الانترنت دي بدايتها فين ونهايتها فين<br />زي مثلا شبكة الكهرباء كده ليها اصل بتنبع منه وليها فروع وفيه سكينة كهرباء ممكن تنقطع الكهرباء منه<br />واحنا هنا عايزين نعرف يعني ايه شبكة انترنت عالميا بتنبع منين وبتتفرع ازاي<br />ممكن يا محمد جمال الدين وسلملنا على مصطفى شحاته<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-08-28"
capture_url = "https://web.archive.org/web/20090828110309/http://www.20at.com:80/masr/review/12949-2009-08-16-13-23-08.html"

[[comments]]
order = 7
subject = ""
author = "يا استاذ محمد جمال"
posted = "2009-08-20"
text = "اخوك ابو محسن غربة طويلة<br />طيب ما هي مصر تقدر تعمل قنبلة ذرية مش شبكة انترنت<br />ما بتعملهاش ليه<br />لان امريكا مش حتسمحلك<br />مصر تقدر تزرع قمح ما بتذرعهوش ليه<br />لان الدول الكبرى مش حتوافق<br />علشان مصر تفضل تحت السيطرة<br />كذلك النت<br />في ايد اسرائيل علشان خاطر العالم كله يفضل تحت السيطرة<br />وصدق الله العظيم حينما قال<br />لتفسدن في الارض مرتين<br />وهذا هو الفساد الثاني"
archived = "2009-08-28"
capture_url = "https://web.archive.org/web/20090828110309/http://www.20at.com:80/masr/review/12949-2009-08-16-13-23-08.html"

