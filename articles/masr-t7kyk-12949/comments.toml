text = "@ رجعوا في كلامهم<br />حتي لو فعلاً رجعوا في كلامهم ع المشتركين القدامي … طب مهو الجديد ده ممكن يكون أنا أو أنت أو أبنك او أى مواطن مصري … انا مستغرب لأني عمري ما سمعت في دولة أوروبية عن تحديد إستخدام الإنترنت … الظاهر أن الشركات عايزة تطلع بمصلحة من أى حاجة وخلاص .<br />@Zeo<br />هحاول أكون أكثر حماسة .. مع اني معارض رأيك في الموضوع أنه غير مفيد<br />ع الأقل أنت عرفت انك بينصب عليك بكتيرر أوي … وده لا ينفي ان لكل واحد رأيه الحر … \" الموضوعي \""
