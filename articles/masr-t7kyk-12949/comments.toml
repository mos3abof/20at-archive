text = "يا أفندم وانا بقول لحضرتك أقتراحات … مجرد أقتراحات .. انا مش خبير ومش هفتي كتير<br />بس الى عمل شبكة الإنترنت ده إنسان .. مش كائن جه من المريخ واحنا عندنا عقول في مصر قادرة علي تنفيذ ما هو أعظم … بس ده لو الدولة دعمتهم و أديتهم مرتبات عدلة و شغلتهم ي مناصبهم بدون واسطة ولا محسوبية …<br />ثم ليه ما يبقاش فيه شبكة إنترنت خاصة بمصر وتبقى مدمجة مع الشبكة الرئيسية وأعتقد ان مهمة بناء شبكة إنترنت مش معضلة زي زمان … وإذا كان علي مصر فمصر فيها فلوس … بس ياتري بتتصرف فين ؟؟؟<br />أنت تعرف"
