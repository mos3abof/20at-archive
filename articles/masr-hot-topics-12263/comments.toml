author = "مش ححبك"
posted = "2009-06-03"
text = "مكتوب في المقاله<br />الدكتور عمار علي حسن، المتخصص في شئون الحركات الإسلامية<br />والله يا اخي المجاعه اللي في مصر دي خلت الناس تفكر في حجات غريبة يا اخي<br />حتى كمان الحركات الاسلامية بقا ليها خبير<br />وانا برضه خبير في الحركات بس في الحركات القرعه<br />يا اخ اسماعيل علي ممكن تشوفلي شغلانه خبير في الحركات القرعه"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105145939/http://20at.com/masr/hot-topics/12263-2009-06-03-09-32-32.html"
