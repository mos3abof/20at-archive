[[comments]]
order = 1
subject = ""
author = "مبارك او الطوفان"
posted = "2009-06-03"
text = "يا شعب مصر<br />مبارك ومن وراءه الطوفان<br />والايام بيننا<br />تغيير الحكم ما ينفعش في هذه الايام الصعبة"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105145939/http://20at.com/masr/hot-topics/12263-2009-06-03-09-32-32.html"

[[comments]]
order = 2
subject = ""
author = "ابو السعود"
posted = "2009-06-03"
text = "الدول الاروبية تحترم المعارضة جدا<br />وبما ان الاخوان يعارضون فان لهم احترامهم عند الدول الاروبية<br />ولكن ما الذى اظهر الاخوان وجعلهم فى الصورة الامامية وتصدرهم للشارع المصرى<br />طبعا الفضل للحزب الوطنى فى تقوية الاخوان واظهارهم وتلميعهم ليضعوا الشعب المصرى امام خيارين<br />الحزب الوطنى وجمال مبارك او الاخوان والمرشد العام<br />وطبعا بيغمزوا لدول اوروبا وامريكا شايفين حماس فى غزة هؤلاء اخوان تريدون مصر ان تصبح مثل غزة<br />لماذا لا يقوى حزب الوفد او التجمع او الناصرى<br />هل يستطيع حزب من هؤلاء وبما فيهم الوطنى ان يعمل سرادق فى الشارع فى اى مكان فى مصر ويلقى اى واحد خطبة فى الناس<br />مستحيل<br />اذن الاخوان هم صنيعة الحكومة او الفأر جيرى ليلعب دور امام توم فى الكرتون<br />ايها الشعب المصرى<br />ليس امامكم غير الوطنى وجمال مبارك او المرشد والاخوان - هذة هى رسالة الحكومة للشعب والعالم"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105145939/http://20at.com/masr/hot-topics/12263-2009-06-03-09-32-32.html"

