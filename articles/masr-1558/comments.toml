[[comments]]
order = 0
subject = "قبل عصر الديمقراطية الحالية"
author = "الهباب الاسود"
posted = "2007-02-07"
text = "قبل تطبيق قانون الطوارىء سنة 1981 اى سنة وفاة السادات كان يوجد بقايا ديمقراطية فمثلا<br />العمد فى القرى كان يتم انتخابهم بواسطة اهالى القرية واوقفت هذة الخزعبلة واصبح يتم اختيارهم عن طريق مباحث امن الدولة<br />ثم كان هناك انتخابات النقابات لاختيار مجلس الادارة والنقيب الا ان هذة الخزعبلة اوقفت ايضا لقصور 350 الف مهندس وتخلفهم العقلى الامر الذى يستدعى مجلس وصاية من محاسيب امن الدولة لادارة النقابة فى المهندسين والصحفيين وغيرهم<br />عميد الكلية ورؤساء الاقسام فى كل الجامعات كان يتم انتخابهم ولكن لتخلفهم العقلى والمهنى تقوم الاجهزة الامنية بترشيح الصالح منهم لتعيينة وبلا انتخابات بلا خيبة هى ناقصة اخوان<br />وهكذا تقدمنا ديمقراطيا على جميع الدول التقدمية<br />وكل ذلك للحفاظ على المكاسب الوطنية وحماية الشعب من الغوغائية المتسلقة والشوفانية الكارهة للحكم والاستقرار"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209060740/http://masr.20at.com:80/article.php?sid=1558"

