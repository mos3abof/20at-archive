subject = "بلد بتاعة شهادات صحيح"
author = "ميدو"
posted = "2007-02-07"
text = "بعدما كنا بنردد عبارة بلد بتاعة شهادات صحيح الان تفوقت حكومة نظيف على نفسها في قتل الكفاءات واهو بالمرة يبقي المهندسين مع الصحفيين والقضاة والاطباء بالاضافة للعمال والطلاب والبقية تاتي"
