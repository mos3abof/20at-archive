[[comments]]
order = 12
subject = "يوم لا ينفع ندم"
author = "klo"
posted = "2006-11-12"
text = "اهل العراق يا من وقفتم مع صدام في حكمة والان تقفون في شبة ندم بعد ان احسن اليكم واساتم الية بعد وقف المريكي على ارضكم واغتصب عرضكم ونار من خيرات ارضكم هل تنكرون ذلك الامريكي ذلك العلوج الذي فندتم الا قاويل عنة وانكسرتم من اول وهلة لكي يلقاكم رئيسكم المفدى في احضان رجل اخر فلسطين كم هي خائرة القوى من عام 48 تقاوم ولا ياس لانة لا حياة مع الياس اذا الشعب اراد الحياة فلا بد ان يستجيب القدر ان ما اعرفة من خلال التجربة اللبنانية اذا واصلتم النضال ستتحررون من قيد الاحتلال فلا تنتظرو المساعدة من احد لانة لن تاتي المساعدة من احد وخصوصا الدول العربية غير الويل والدمار لكم وعلى نفسها جنت براقش لانه من فعل يدكم راجعوا حساباتكم وتاملو بشكل اعمق لعل اللة يغفر لكم خطيئتكم النسان اللي صار يكرهم KLO"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015021/http://masr.20at.com:80/article.php?sid=1125"
