[[comments]]
order = 0
subject = "أول مرة بلد عربي يسبق مصر .. العراقيون السابقون ونحن بيدنا لاحقون"
author = "إبن بهية"
posted = "2006-11-07"
text = "استغرب لعدم وجود أي تعليق هنا ؟؟؟!!! لعل المانع خير .. عموما نقابة المحامين مشكورة قامت باللازم تجاه الزعيم المفدى صدام حسين .. بس هو صحيح كان مفدى ؟؟؟ وفين ملايين اللي قالوله كده ؟؟؟ ما افتدوهوش ليه دلوقتي ؟؟؟ طبعا أنا ضد تماماً الحكم على صدام حسين بالإعدام وبخاصة أنها محكمة أمريكية قذرة ومسيسة .. وكنت أتمنى من كل قلبي أن يكون خلاص الشعب العراقي من الطاغية بيدهم لا بيد الأمريكان وكنت أتمنى أن يكون الحكم على صدام حسين بواسطة الشعب العراقي وبالإعدام أيضاً ولكن غرقاً وليس شنقاً .. غرقاً في حوض سباحة كبير ينصب في وسط بغداد وفي وسطه صدام حسين وكل عراقي يمر يبصق عليه حتى يغرق .. كما سيحدث قريباً بإذن الله في الواطي حسني مبارك وكل أذنابه وعصاباته القذرة ..<br />هذا موقفي من صدام الحمار الغبي ولكن موقفي من المحاكمة فهي أقذر مما ذكرته .. وأعتذر لما سببته لكم من قرف في هذه المداخلة ... طيب وهو إيه في حياتنا ما يقرفش يا جدعان .. ما هو أصله زمن القرف كله ومكتوب علينا نقرف .. قصدي نعيش ..<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015021/http://masr.20at.com:80/article.php?sid=1125"

[[comments]]
order = 1
subject = "عدم شرعيه الا عدام فى ظل الاحتلال"
author = "مواطنه مطحونه"
posted = "2006-11-07"
text = "ولله دى اكبرمهزله وفتحت ابواب جهنم على العالم العربى كله وبعدين صدام حسين مازال الرئيس الشرعى للعراق وبعدين هما فى الاول خطفوه مش قبضوا عليه تبقى دى محكمه عير شرعيه والحكم بالاعدام ده غيرشرعى وكمان فى ظل الاحتلال وعلى العموم العراق عايزه واحد زى صدام حسين عشان تحكمها بدال هما عملين يقتلوا بعض كده من يوم ما اتقبض على صدام ويريت الامريكان هما الى بيضربوهم لا دا العراقين بعضهم فى بعض يعنى بالذمه الحاجات دى كانت بتحصل وصدام موجود اه ينعم كان صدام ليه حاجات وحشه جدا وراح حارب الكويت وعمل حاجات فى الشعب مش كويسه بس كان حالهم احسن من كده بكتيرومكنش حد يقدر يموت حد عشان كانوا بيخافوا منه وانا من راى ان الشعب المصرى كله يعمل اى حاجه عشان الحكم ده مش يحصل ان شلى حتى نعمل مظاهرات لاننا لو وافقنا على الحكم ده يبقى بندى فرصه الامريكان يركبونا كلنا"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015021/http://masr.20at.com:80/article.php?sid=1125"

[[comments]]
order = 2
subject = "يارب عقبال الباقيين"
author = "مصرى مش مطحون بس مقروف"
posted = "2006-11-07"
text = "صدام مش مظلوم ده كان دكتاتور وظالم وأخذ الحكم إللى يناسبه على قتل واحد بس وإللى المفروض أنه يطبق عليه مئات المرات على بقية جرائمه ولا يستحق التعاطف معه ولكن كنت أتمنى أن الشعب هو الذى يحكم عليه هذا الحكم ليرد لنفسه شيئ من الظلم الذى وقع عليه منه وأتمنى من الله العلى القدير أن يكون مصير حسنى مبارك وأولاده وزوجته فى مصر نفس مصير صدام حسين وأولاده وليكون عقاب الله له فى الدنيا والآخرة على مافعله فى مصر من نهب وفساد وبيع أملاك المصريين وأعتقال خيرة شباب مصر وإنحدار حياة المصريين والله المنتقم الجبار اللهم أمين فهو يمهل ولا يهمل ولعل حكم الدنيا يخفف من حكم الآخرة الذى لم يرحم شعبه ليخففه لنفسه يارب أنت المنتقم الجبار من حسنى مبارك وحثالته وأولاده وزوجته اليهودية الحقيرة اللهم آمين آمين آمين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015021/http://masr.20at.com:80/article.php?sid=1125"

