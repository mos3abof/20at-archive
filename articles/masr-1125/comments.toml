subject = "الاعدام مش كافي لصدام"
author = "ابن الاحواز"
posted = "2006-11-11"
text = "صدام مش بس حقوا الاعدام لوكان بيدي كنت احرقوا لانه هو الي ساب الايرانين الفرس ان يعملوا زي ميحلالهم في اخواننا في الاحواز المحتله من اخذ الارض الزرعيه غصبا الي الاعتدا علي الاعراض في ارض الاحواز المحتله وهو كمان اداهم الجراه علي ان يقولو للعرب خونه ووووووالي اخره بهذا الدليل مش حقوا بس الاعدام"
