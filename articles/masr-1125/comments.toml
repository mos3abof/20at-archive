[[comments]]
order = 8
subject = "اعدموا بوش قتل اكتر من صدام"
author = "محامى مسلم تعبه الزمن"
posted = "2006-11-09"
text = "واللهى ده حرام اللى بيحصل يعنى لو عدموا صدام حترتاحوا فين كرامه العراق قالوا صدام سبب الفساد اهوه صدام اتشال والناس اتقتلت اكموا بوش واعدموه لانه قتل اكتر من اللى قتلهم صدام دبح كتير اغتصب علنى اتفضحى الاسرى الستات اتهانت الاداميه على الاقل صدام ستر عليكم ومحدش عرف لكن بوش فضحكم فوقوا اتلعبت اللعبه سخنوكم الاكراد واخدوا اللى عايزينه وسابوكم تدبحوا بعض العراق قريبا نسمع عنه ولايه البصره بقياده الحكم منص السعدى ولايه كركوك بقياده فيفى عبده ولايه بغداد بقياده كاظم الساهر ساعتها حتعرفوا انكم خسرتوا واللهى حرام افهم فى ناس ماتفهم ولاعمرها حتفهم انتم نفير الامريكان ياعالم فوقوا الامريكان مش راضيين باللى بيحصل انتوا توافقوا خص عليكم ومن غير سلام"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015021/http://masr.20at.com:80/article.php?sid=1125"

