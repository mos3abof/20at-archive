text = "بسم الله الرحمن الرحيم......مع إحترامي لجميع الآراء ولكني لي رأي وهو أنه يغفر له كل شيء أمام وقفته في صد الإحتلال الأمريكي الجامح كما أن محاكمة صدام مهانة لكل عربي وخصوصا عراقي وشكرا"
archived = "2006-11-27"
