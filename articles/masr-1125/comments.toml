subject = "حلوة يابن بهية بس"
author = "محب للحكام العرب"
posted = "2006-11-11"
text = "والله فكرة يابن بهية لوحطينا مبارك وأبنه في حوض وسط القاهرة وكل مواطن مصري شريف<br />بصق عليهم لغرقوا من كثرة البصاق وخاصة أن شعبنا المصري ماشاء الله سبعين مليون وأكتر بس قبل مايغرقوا حينظفوا بذلك البصاق الطاهر الذي هو أنظف في الحقيقة من مبارك وأبنه المعتوه مش كدة ولا أيه ؟؟"
archived = "2006-11-27"
