[[comments]]
order = 4
subject = "وتلك الايام نداولها بين الناس"
author = "مسلم مفكر"
posted = "2006-11-07"
text = "بصرف النظرعن تاييد اوادانة الحكم الذى صدرعلى صدام حسين بالاعدام شنقا مع الاعتراض على شرعية المحاكمة الا ان هناك شيء هام لابد من الانتباه اليه وهو ان الله يمهل ولا يهمل ولعل ما حدث لصدام ليست رسالة امريكية ولكن رسالة ربانية لكل الحكام العرب والمسلمين على وجه الخصوص بان الظلم لن يدوم وان الملك لله يورثه من يشاء ولن يحكم احدا فى الارض الا بمراد الله يقول تعالى (قل اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء وتعز من تشاء وتذل من تشاء بيدك الخير انك على كل شيء قدير ) وهو القائل ايضا ( وتلك الايام نداولها بين الناس) فكل ما يحدث من حولناشواهد ودلائل وتأكيدات يرسلها الله من ان لاخر على معجزة القران الكريم و ليتعظ الناس فهل من متعظ ؟!"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015021/http://masr.20at.com:80/article.php?sid=1125"

[[comments]]
