[[comments]]
order = 6
subject = "قد يكون مجرما .... ولكنه شريفا"
author = "مهتمه"
posted = "2006-11-08"
text = "احترم دائما ان يدافع الانسان عما يؤمن به حقا واكره الاشخاص ذوي الوجوه المتعددة والمواقف المتباينة والتي غالبا تتبع مصلحتهم<br />هل كان صدام حسين مسئول ام لا ؟ وهل كان هناك تهويل فيما نسب اليه ام انه كان يفعل ما فعل من انتهاكات وارهاب للمواطنين رغبة في احلال الامن والاستقرار ؟ ام انه مجرم حقيقي يستحق الاعدام ؟<br />لا احد يستطيع ان يجزم بشئ بدون محاكمة عادلة وحقيقية لهذا الحاكم بدون احتلال ، وبدون ضغوط دولية وبايدي عراقية حره وليست عميلة<br />صدام حسين ايا كانت تجاوزاته وجرائمه يكفيه شرفا انه ظل حتى آخر لحظة على ارض المعركة لم يفر ولم يهرب كمن هربوا ولم يبيع او يخون ولم يضحي بنفسه فقط وانما ضحى بابناؤه وحفيده .<br />هو اشرف من كثيرين لا يحاكموا وجالسين على مقاعد وثيرة مطمئنين واذا جد الجد هم اول من يهرب وينفد بجلده .<br />اعتقد ان هذا الرجل كان يؤمن حقا بمبادئ محددة ودافع عن هذه المبادئ بشرف وكبرياء حتى النهاية ، ويقف في المحاكمة حتى الآن شامخ يعتز بدينه وعروبته ومكانته كرئيس للعراق ، ومهما اختلفنا معه لا نقبل له ان يهان لان اهانته في هذا التوقيت وصمة عار لنا جميعا ."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015021/http://masr.20at.com:80/article.php?sid=1125"

