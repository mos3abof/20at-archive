[[comments]]
order = 3
subject = "الوزير الشمام"
author = "إبن بهية"
posted = "2006-12-03"
text = "شكراً للأستاذ عزت القمحاوي على هذا المقال الجميل الرائع وشكراً لأولاد البلد على نقله لقراء هذا الموقع مرة وشكراً على تلك الصورة المناسبه للموضوع التي بدا فيها سيادة الوزير يمارس هوايته في شم النساء اللائي خلقن للشم فقط كما يزعم ذلك العربيد .. بس الغريبه هو ماله ومال النسوان ؟؟؟ يعني فيه حبة تناقض في الوضوع شويه .. ما علينا .. المهم أن المقال جميل ويمكن أن نستخلص منه وصفاً جديداً لسي فاروق شمام النسوان وأشياء أخرى .. الوزير الشمام<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206024835/http://masr.20at.com:80/article.php?sid=1245"

