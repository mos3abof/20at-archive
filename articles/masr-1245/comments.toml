[[comments]]
order = 5
subject = "ارحمناياعم عزت"
author = "فارس_fr"
posted = "2006-12-04"
text = "ايوه عرفنا ياعم عزت , ارحمونامن موضوع الحجاب اللى بقى زى اللبانه فى بق كل واحد عايز يظهر ويبان ويعلا نجمه ,, ارحمنا يا سيدى ايه الجديد اللى انت عايز تضيفه ,, يعنى انته جيت متاخر ونسيت تاخد نصيبك من التورته ,, خلونا فى مبارك اللى خلاص نوى يحكم 30 سنة تانيين ,, اتكلم عن البصل اللى غلا سعره والا اللحمه اللى بقت للشم فقط زى الستات ولا الطماطم ولا الاقتصاد البلد مليانه فساد ولا فى خطوط انت متقدرش تتخطاها"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206024835/http://masr.20at.com:80/article.php?sid=1245"
