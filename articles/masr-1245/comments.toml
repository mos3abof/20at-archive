[[comments]]
order = 1
subject = "لا دا هم يبكى فقط ولا مجال للضحك"
author = "عبد المنعم المصرى مقيم بالمهجر"
posted = "2006-12-03"
text = "ليته هم واحد كان يبقى ميت فل وعشرة ولكن يجب ان تقول هموم البلد لان بصراحة البلد بالكامل ما عدا اهل الحظوة الكل يبكى , وما يزيد النحيب ان يخرج مسؤول او ما يفترض انه مسؤول ويتكلم بما يجرح مشاعر كل المصريين والمسالة اصبحت عملية الهاء للمصريين المسحوقين من ويلات النظام ,من السهل ان واحد يقول طيب عبد المنعم المصرى دا عايش فى المهجر وايه الى مخليه بيتكلم بالطريقة دى ؟؟ سؤال ممكن يكون وجيه من شخص لا يعرف معنى كلمة مصرى فمن شرب من ماء مصر قبل التلوث ومن اكل من نتاج ارض مصر قبل السرطنة ومن تعلم فى مصر قبل الاحتكار على الاغنياء فقط ومن عمل فى مصر عندما كانت تحكم بمصرى اصيل ابا عن جد مثل عبد الناصر واقولها صراحة تسلمت عملى بعد اسبوعين من التخرج وبدون اى واسطة , وهاجرت من مصر فى عهد الساات وكنت اعود لزيارة مصر حتى لقيت ما لقيت بنفسى وليس كلاما على ايدى نظام لم اتعامل معه وذلك منذ وصولى الى المطار ولحسن الحظ اننى كنت احمل جواز سفر غير مصرى مما خفف حدة المعاناه وبقيت فق اكثر من ساعتين لاحصل على الجواز بعد ان طلبت من الضابط الذى كان بالجوازات ان يعيد الى جواز سفرى لارجع من حيث اتيت,وعندما اتى الفرج من الله وخرجت من المطار لم ارى مصر التى كنت اعرفها ولما تجولت قليلا فى شوارعها تاكدت اننى ربما اخطات الطريق ولما شاهدت الاسعار الجنونية بكيت على زملائى فى العمل وعلى اهلى ولم انعم بتواجدى فى المهجر فاصبح همى مضاعفا لكى انقذ ما يمكن انقاذة من آدمية من اعرفهم والان بعد ان اطالع ما صار عليه الوضع وكيف ان الامور تزداد سوءا تاكدتان من يحكم مصر ليس بمصرى على الاطلاق ولهذا اطالب الشباب ان يفعل مثلما كان يفعل شباب ايان الاستعمار الانجليزى وترحمت على ايام الانجليز قياسا بهذه الايام<br />اقرأ بقية التعليق .."
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206024835/http://masr.20at.com:80/article.php?sid=1245"

