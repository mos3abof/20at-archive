subject = "وجهه نظر"
author = "نيفين نيفى نوفا"
posted = "2007-01-11"
text = "احسان من القلائل اللى اختارو يقفو ضد التيار<br />زيه زى نزار قبانى و غيرهم<br />هاجمهم النقاد و احبهم القارىء<br />احسان نفسه ف مدخل روايه انا حره قال انه بيتوقع ثوره النقاد و اعلت لنه مش هيغير النهايه<br />لانه كام من جيل يختار مصيره و يتحمله<br />احب قضيته فاحبه الجمهور"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112142319/http://masr.20at.com:80/article.php?sid=1427"
