[[comments]]
order = 0
subject = "ياكل شرفاء مصر..الثورة الآآآآآآآآآآآآآن"
author = "مصرية"
posted = "2006-06-07"
text = "حادث العبارة السلام سيناريو رخيص..لكاتب درجة ثالثة..بداية من السماح لصاحب الشركة بالأستمرار فى أحتكار خط الملاحة فى البحر الأحمر رغم تكرار حوادث عباراتة..لأن البيه مسنود بشركائه من العرب والله أعلم من من المصريين..ثم تحويل الأنظار عن القصور الذى تم من قبل قائد القوات المسلحة لأشارة الأستغاثة..والتعامل معة عقب ساعتين ونصف..فى حين أن طائرات الأنقاذ يمكن أن تكون فى مكان الحادث خلال ربع ساعة.. وهذا تصريح أدلى به شخصيا أمام القائد الأعلى للقوات المسلحة حسنى الغير مبارك فى التلفزيون المصرى واذيع عدة مرات ثم تم عمل مونتاج لحذف هذه الفقره.. أى صاحب ضربة جوية هذا الذى تمر هذه الواقعة امامه مرور الكرام..والمفروض أنة كان قائد الطيران الذى يتم التعامل فيه بحساب الثانية.. ثم بدأ البحث عن كبش فداء لاسند له ..ووجدوه فى الكابتن المار بعبارته على مقربة من الحادث وتباهوا بتكرار عرض خبر يتم فيه اهانته وايقافه عن العمل وكأنه المسئول الأول والأخير عما حدث..وهم يعلمون جيدا انه يقود احدى عبارات نفس الشركة المتهالكة ..وهى غير مجهزة ايضا لعملية الأنقاذ..كالعبارة التى غرقت ، وظهر ابن صاحب العبارة فى برنامج البيت بيتك كالحمل الوديع وأغرقنابمجموعة من المستندات المضروبه والتأثرات والدموع..التى حاول بها ابراء ساحته ووالده والشركةمن دم الضحايا..ولأن الضحايا من المصريين الغلابه ..فالدم رخيص..والأرواح لا ثمن لها..وبدأت اخبار العبارة تتراجع بالتدريج فى الأعلام المصرى..وكالعاده كنا نتابع ثورة اهالى الضحايا من الفضائيات..والكل كان يراهن على هروب ممدوح اسماعيل قبل صدور قرار عدم سفره.. وتم التعتيم على كل الحقائق..ولكن ابشروا ..النائب العام طلع علينا بتسعيره جديده للدم المصرى..تعويضات اكبر من تعويضات حادث القطار<br />اقرأ بقية التعليق .."
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912174159/http://masr.20at.com:80/article.php?sid=477&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

