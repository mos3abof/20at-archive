[[comments]]
order = 7
subject = "كله تمام ياريس"
author = "ابو شريف"
posted = "2006-06-10"
text = "بذمتكم مش هوه ده اللى بيحصل واللي حصل واللي ح يحصل ؟؟؟ كل شىء تحت السيطرة يافندم<br />فيلم غرق العبارة<br />سيناريو رقم 1<br />كبرياء وعظمة<br />ضابط أول : يا فندم العبارة هتغرق<br />القبطان : تغرق إزاى وأنا القبطان يلا<br />ضابط ثانى : يافندم كلامه صح لازم نلف ونرجع للسعودية تانى<br />القبطان : عشان يقولوا إنى معرفتش أطفى الحريقة ويفتكروا إنهم أحسن منى<br />ضابط أول : يا فندم إحنا معانا وزن فوق الحمولة والإستمرار خطر<br />القبطان : وإنت هتعرفنى شغلى ياض...دنا شغال قبطان من سنة 67<br />ضابط أول : مش دى سنة النكسة يا فندم ؟<br />القبطان : إخرااااااااااااااااااس...مش عايز أسمع صوتك (كل شىء تحت السيطرة)<br />ــــــــــــــــــــــــــــ<br />سيناريو رقم 2<br />غباء وجهل<br />أحد الركاب (الضحايا) : ياساتر يارب...إيه الدخان ده...إلحقونا إيه اللى بيحصل<br />فرد من الطاقم : مفيش حاجة يا حاج ده إبن عمى بيشوى كباب تحت<br />الحاج : كباب إيه يابنى دى ريحة هباب....كح كح كح....مش قادر هو إيه اللى بيحصل بالظبط<br />فرد أخر من الطاقم أذكى من زميله السابق : دى يا حاج حريقة عادية بتحصل فى كل السفن فى المكان ده عشان<br />أشعة الشمس بتضرب فى البوصلة...ومتقلقش طفيناها خلاص<br />الحاج : دى بتزيد والدخان بيعلى إلبسى يا حاجة سترة النجاه<br />فرد الطاقم بغضب : إنت مش واثق فى كلامى ولا إيه...أنا المسؤول هنا ومش هتفهم أكتر منى...هات السترات<br />دى إنتوا عايزين تفزعوا الركاب وتعملوا قلق وخلاص...خش يابا جوه كابينتك وإقفل عليك...قلتلك (كل شىء تحت<br />السيطرة)<br />ــــــــــــــــــــــــــــ<br />سيناريو رقم 3<br />جشع وطمع<br />القبطان : أيوه يا ممدوح بيه يا مالك عباراتنا وولى نعمتنا إزيك ياباشا أخبارك إيه<br />ممدوح ب<br />اقرأ بقية التعليق .."
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912174159/http://masr.20at.com:80/article.php?sid=477&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "خد عندك"
author = "الخارجية الإسرائيلية طالبت سفيرها بالقاهرة بتوخي الحذر وتجهيز الاعتذار المناسب عن الواقعة : مجندة صهيونية تطلق اسم الرسول علي كلبها .. ومظاهرات الغضب تجتاح نابلس"
posted = "2006-06-10"
text = "كتبت دينا الحسيني ( المصريون ) : : بتاريخ 9 - 6 - 2006<br />شهدت مدينة نابلس الفلسطينية مظاهرة عارمة بسبب قيام مجندة بجيش الاحتلال الإسرائيلي ـ تعمل على إحدى الحواجز المقامة بالمدينة ـ بإطلاق اسم الرسول صلى الله عليه وسلم على كلبها ، مما أسفر عن وقوع عدد من المصادمات بين مئات الفلسطينيين المتظاهرين وقوات الاحتلال .<br />اكتشف المواطن أمجد الأغبر ـ من سكان نابلس ـ جريمة الإساءة للرسول الكريم حينما كانت المجندة الإسرائيلية تدقق في هويته على أحد الحواجز التي نصبها جيش الاحتلال بالمدينة ، إذ تقدم كلب المجندة في هذه الأثناء لمسافة قريبة نحو أمجد ، الذي سارع بنهره خوفا من أن يصيبه بأي أذي ، فما كان من المجندة إلا أن عنفته على الصراخ في وجه كلبها ، وراحت تنادي عليه باسم \"محمد\" .<br />من جانبها ، أصدرت رابطة علماء فلسطين برئاسة الشيخ حامد البيتاوي ـ عضو المجلس التشريعي ـ بيانا أدانت فيه بشدة الجريمة النكراء التي أقدمت عليها المجندة الصهيونية ، واصفة إياها بالحقيرة .<br />وأشار البيان إلى أن جنود الحاجز الإسرائيلي لا يكتفون فقط بتأخير المواطنين والتفنن في تعطيل حركتهم ومنعهم من العبور والاستمتاع بإذلالهم ، وإنما دأبوا أيضا على سب الذات الإلهية والإساءة للإسلام ورسوله الكريم .<br />وفي سياق متصل ، كشفت مصادر صهيونية عن أن الحادث دفع الخارجية الإسرائيلية لإصدار تحذيرات مشددة إلى موشيه كوهين سفيرها بالقاهرة ، مطالبة إياه بتوخي أقصى درجات الحذر ة والحيطة خلال تنقلاته بالعاصمة المصرية ، خوفا من تطاير الخبر للمصريين عبر الحدود .<br />وأوضحت المصا<br />اقرأ بقية التعليق .."
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912174159/http://masr.20at.com:80/article.php?sid=477&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
