[[comments]]
order = 4
subject = "تـــــــــخــــــــيــــــــل"
author = "طبعا هو ده اللى كان لازم يحصل و متوقع لان ده تصرف العصابات الطبيعى فى حمايه أفرادها"
posted = "2006-06-09"
text = "يروى أحد الناجين<br />|أول ما نزلنا الميه لقيت طفل عنده حوالى 3سنين لابس جاكيت النجاه وبيعيط أخدته جنبى ومر الوقت تقيل مفيش لا مراكب و لاغيره الطفل بعد وقت طويل اتجنن من الالم و الجوع و العطش و قعد يقول انا هنا ياماما انا خلاص شبعت انا بحبك ياماما انا اكلت كتير ويصرخ من الالم الفظيع وفى الاخر لقيته ازرق و مات \"<br />واحدتانى بيقول<br />أم فضلت لاخر لحظه على المركب و معاها اطفالها الثلاثه ومش عارفه تعمل ايه وفى الاخر رمتهم فى البحر ونطت معاهم ومفيش حد طلع منهم لا الام و لا اطفالها يا ترى كان شعور الام ايه وقتها<br />الان هل من الممكن ان تأخذ من وقتك دقيقه وتحاول ان تتخيل الاتى<br />انت الان على سطح المركب السلام 98 و هى تغرق وبين يديك طفله ـ واحده رأفه بك ـ عمرها ثلاث سنوات وقفزت بها فى الماء ويمر الوقت و طفلتك تبكى بين يديك عطشا و جوعا و الما و فزعا و الاسماك من تحتكما تنهش فى جسدها الصغير و جسدك ولا تملك لهذا دفعا ....صف شعورك واستيقظ قبل ان تصاب بنوبه قلبيه<br />السبب فيما حدث كله الكلب ممدوح اسماعيل و الكلاب الاخرى من شركاءه و الذين عملوا و يعملون على حمايته<br />هل تأكدناالان من ان القائمين على حكمنا و الرابضين على انفاسناهم أحط انواع البشر<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأه يــــــأ بــــــلـــــــدى"
archived = "2006-09-12"
