author = "منى ذكي"
posted = "2009-09-20"
text = "برافو يا عشرينات برافوا<br />ويا ليت يا عشرينات توزعوا عليهم تذاكر سينما للفيلم بتاعي احكي يا شهرزاد علشان يعرفوا اد ايه انا بتعب في التمثيل علشان خاطر الناس<br />وجوزي احمد حلمي عامل فيلم برضه اسمه الف مبروك يا ليت توزعوا عليهم برضه تذاكر الفيلم علشان خاطر يتفرجوا عليه<br />على فكره احنا بنحبهم اوي وزعلانين عليهم خالص ونفسنا نتبرع علشانهم<br />بس يا خساره العين بصيره والايد قصيره<br />تتصوروا انا باخد 5 مليون جنيه في الفيلم بس<br />ومش مكفيين حاجه<br />خمسه مليون يعملوا ايه في ايام لجنة السياسات السودا دي اللي احنا عايشنها"
archived = "2009-10-16"
capture_url = "https://web.archive.org/web/20091016051351/http://www.20at.com:80/masr/t7kyk/13498-2009-09-19-12-26-56.html"

