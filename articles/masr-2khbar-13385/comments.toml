text = "فتشوا عن ماسورة مياة مكسورة او بتهرب مياة تحت الارض فى المنطقة دى<br />لما بيبقى فية تهريب مياة فى ارض رملية تحت سطح الارض بيحدث انهيار للتربة<br />انما لا علاقة بمترو الانفاق بالعملية دى<br />والظاهرة دى شفتها خمسين مرة قبل كدة<br />فتشوا عن ماسورة مياة او ماسورة مجارى مكسورة تحت الارض وبتهرب مياة"
