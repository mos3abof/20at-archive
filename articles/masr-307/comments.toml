[[comments]]
order = 17
subject = "أختلف معك يا براء"
author = "اسمح لى أن أختلف معك يا براء فى موضوع نشر صورة المرأة بهذا الأسلوب لأكثر من سبب"
posted = "2006-05-13"
text = "- أولا كون مواقع أخرى نشرت الصورة ليس مبررا لأن ينشرها موقعكم الذي نعتبره موقعنا جميعا<br />بل إن النشر فى أكثر من موقع - كما أشرت- دليل أن الصورة لا تمثل انفرادا لـ\"ولاد البلد\"<br />- الأمر الآخر أن الذين يطالبون بمعالجة الصورة اعتقد ليس لأنهم يرونها مثيرة أو مغرية إنما هى عورة امرأة يجب أن تستر لا لشيئ إلا لأنها عورة<br />- اتمنى أن يكون نشر الصورة يتم بأسلوب تراعى فيه الحرفية الصحفية وآدامية الناس فى ذات الوقت<br />تخيل لو أن هذه المرأة أم أى واحد فينا .. بالتأكيد رد فعله أنه هيروح فى داهية فى هذا الضابط ، ولكنه فى نفس الوقت لن يرضي بنشر صورة أمه بهذا الأسلوب المهين<br />أضم صوتى لمن يري ضرورة معالجة الصورة حتى لا ننشغل بالحديث عنها وننسي القضية الأساسية وهى الظلم الواقع علينا جميعا"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 18
subject = "قنبلة بشرية"
author = "ابو كرتونة"
posted = "2006-05-13"
text = "ارجو ان لا يفهم كلامي غلط ولكن هذا الكلام بعد انا زهقت من الي بيحصل في مصر وانا بصراحة متاعطف مع من فجروا دهب وشرم ليس لانهم قتلة ولكن لان الدولة لم تستمع لمطالبهم واخذت القوة الغاشمة هي الوسيلة الوحيدة للتعامل مع اي صوت معارض مما اوصل الحال الي ان يقوم مجموعة من الشباب ان يفجروا انفسهم , وان اظن ان هذه التفجيرات من وجه نظر الارهابيين ليست موجه لمصر اولا ولكن لنظام مبارك القمعي الذي اتخذ من امن الدولة الوسيلة الوحيدة لقمع اي معارضة ويوم الخميس الماضي يشهد علي هذه المهزلة امام دار القضاء العالي<br />فالظلم يولد الظلم<br />والعنف يولد العنف<br />وال ايه يا مبـــارك ويا جيمــي<br />لا للتمديد لا للتوريث...<br />يسقط ....يسقط.... حسني مبارك<br />يا مبارك غـــور مصــر بقـــت بــــور"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 19
subject = "يا ريتنى كنت معاهم"
author = "ايمن المصرى"
posted = "2006-05-13"
text = "يا ريتنى كنت معاهم . جملة قالها جندى فى فيلم الطريق الى ايلات . عندما نجحت المهمة و لم يكن هو معهم . . هذة الجملة يقولها الملايين ملايين الشرفاء الذين لم يستطيعوا حضور الاعتصامات و المظاهرات بجانب اخوانهم الشرفء . و سيقولها ملايين الملايين عندما تنول مصر الحرية و الكرامة المنهوبة . . و اللة من قلبى اقولها يا ريتنى كنت معاكم . . و ان شالة حتى اسحل ويقبض على . . مصر تستحق اكثر من هذا ."
archived = "2006-09-20"
