[[comments]]
order = 13
subject = "حسبنا الله ونعم الوكيل"
author = "انا هو في غيري يقدر يكتب بايدي"
posted = "2006-05-12"
text = "حراااااااااااااااااااااااام<br />بجد ده كتييييييييييييييييييييييير حنشوف الخميس الجاي حيعملوا ايه.... لولا اني بنت ومش من القاهرة والله لو بايدي هانزل القاهرة الخميس الجاي علشان بس يعرفوا انهم كده مش بيعملوا حاجة غير انهم بيخلونا نشيط اكتر<br />وحيشوفوا الخميس الجاي الناس حتعمل ايه وحيبقي عددها كام ؟؟<br />وزي ما الناس اتفقت<br />لا للتمديد... لا للتوريث... نعم لتعديل الدستور"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 14
subject = "شكرا لكل اللي خلي توقيعه لا للتمديد... لا للتوريث... نعم لتعديل الدستو"
author = "اخت محمد السيد \"لا للتمديد لا للتوريث\""
posted = "2006-05-13"
text = "طبعا عادي... هو عادي وبس؟؟؟<br />انتوا بس اللي مش بتفهموا ...احنا اللي عقولنا عليها غيامه خلتنا نش فاهمين حاجه..........جتنا نيله ملينا البلد!؟<br />انا بس ليه سؤال .....الصور دي كلها وكان في تعتيم اعلامي علي الموضوع واتمنع الصحفيين واتضربوا....امال لو كانوا صوروا كل حاجه كان زماننا شفنا ايه وللا ايه؟؟؟؟؟؟؟؟؟؟؟؟.........<br />قلبي واجعني...منكم لله قلبتوا عليا المواجع...<br />مستنياك يا محمد ترجعلنا من عند الناس الحلوين الرائعين دول- بس يا عيني صعبانين عليا اصل احنا اللي فاهمينهم غلط...<br />اكيد يا محمد هما دلوقتي معيشينك اجمل ايام حياتك ...احلي نومه واحلي اكله واحلي صحبه...يا بختك يا عم متظبطه معاك..بتشوف الناس اللي صورها فوق دول كل دقيقه وكل ثانيه ...مش احنا جتنا القرف وشنا في وش المواطنين العاديين يعني اللي ملهمش لازمه في البلد ولو نطول نلغيهم هنلغيهم....<br />يللا مش مهم<br />مستنيينك يا محمد<br />ولغايه ما ترجع<br />\"لا للتمديد لا للتوريث..نعم لتعديل الدستور\"<br />ايميلك مستنيك تيجي تكتبه"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 15
subject = "فين الرجولة - فين النخوة"
author = "ايمن المصرى"
posted = "2006-05-13"
text = "ندائى هذا للاخوة ظباط و جنود الداخلية الشرفاء . ارجوا ان تلاحظوا الفرق بين مشاعر و احساس الشعب فى استشهاد الرائد فى سيناء و مدى تضحيتة فى سبيل هذا الوطن الغالى . و بين الرائد الذى لقى مصرعة فوق كوبرى 6 اكتوبر و هو متوجة لفض المظاهرة و الاعتداء على النساء . الاول يستحق منا الدعاء و الفخر . و الثانى سيكون فى مذبلة التاريخ المصرى . و اقول لضباط الداخلية ان من تعذبوهم و تضربوهم هم اخوانكم و اولادكم . الذين ضحوا بوقتهم و مستقبلهم من اجل حرية و كرامة هذا الوطن الغالى . لقد دارت عجلة الحرية من الظلم و الاستعباد ولن يستطيع احد ان يوقفها . و اللة على كل شئ قدير"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

