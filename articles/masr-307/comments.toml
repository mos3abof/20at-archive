text = "يا اخونا اللى حصل يوم الخميس اكتر من كده بكتير و انا شفت المناظر و اللى يحب يشوف يدخل على موقع كفاية ..و هتشوفوا<br />لكن مع احترامى ..الصوةر باين اوى انها متفبركة رغم انها بتقول اللى حصل بس برضه خلينا كده رقباء على انفسنا ..<br />نقطة تانية .. اللى بيشتموا مصر ..يا اخونا فيه فرق كبير اوى بين مصر وولاد مصر و حكام مصر<br />اتقوا الله ..مصر ذكرت فى القرأن .<br />العيب مش فى مصر . العيب فى اهلها الساكتين و حكمها المفتريين<br />يا اخونا<br />العيب فى الجتة مش الجاكته"
