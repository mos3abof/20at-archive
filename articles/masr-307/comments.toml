[[comments]]
order = 6
subject = "عفوا وعفوا.. اتنين عفوا"
author = "براء"
posted = "2006-05-12"
text = "الأخوة الأفاضل أصحاب التعليقات السابقة.. بالنسبة لستر جسد السيدة الفاضلةصاحبة الصورة.. فأنا أعتذر بشدة عن فعل ذلك لأكثر من سبب ..<br />اهم هذه الأسباب أنها بالفعل كما قال المعلق السابق عورة مصر كلها.<br />وبما أننا أصبنا في الفترة السابقة بعمى مؤقت عن رؤية عورة مصر كلها فما المانع من التذكير بها<br />خاصة وان الصورة ليست مثيرة ولا جذابة.. وبالتالي فحجة منعها ضعيفة على الاقل من وجهة نظري الضعيفة<br />الامر الثاني ان مواقع كثيرة اخرى وضعت الصورة نفسها وبالتالي فان تعديلها وتمويهها هنا لن يمنع مستخدم الانترنت من الوصول لها بسهولة<br />أما بالنسبة لتقليد اسلوب بلال فضل، فللاسف هذه ليست حقيقة<br />فالاسلوب اسلوبي منذ عرفت وتعلمت الكتابة<br />اما عن استخدام القباحة التي يتميز بها بلال، فمعلوماتي الشخصية تقول ان بلال لم يحتكر القباحة بعد، وبالتالي فهو نفسه لم يتضايق لو اصبحت استخدم القباحة مثله مع اني ارى ان الافيه القبيح افيه قديم وحمضان ولا يستحق لقب قباحة على الاقل بجوار ما يكتبه استاذنا في الكتابة الساخرة بلال فضل<br />اشكركم جميعا.. وخلونا في موضوعنا.. ولا هو فعلا بقى عادي"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

