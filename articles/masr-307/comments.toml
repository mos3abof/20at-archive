[[comments]]
order = 29
subject = "مش عادى"
author = "حسام"
posted = "2006-05-13"
text = "غلط يا براء<br />أخبرك وأوعدك إن الوصف الصح لكل ما يحدث وما سيحدث فى الشهور القليلة القادمة هو \"مش عادى\".. كان عادى إنهم يزوروا الإنتخابات لكن مش عادى القضاة يرفضوا ويقولوا ده تزوير.. كان عادى يسجنوا ويعذبوا لكن مش عادى الناس تحاصرلهم الأقسام وتقفلهم الطريق.. كان عادى يقمعوا المظاهرات فى الجامعة .. لكن مش عادى المظاهرات تخرجلهم فى الشارع .. كان عادى يضربوا الإخوان باليسار واليسار بالإخوان والمثقفين ببعضهم .. لكن مش عادى الإخوان يبقوا مع القضاة مع المهندسين وأساتذة الجامعات وكفاية والغد وكل مصرى بجد.. مش العادى إن مصرى غير منتمى لأى تنظيم يأخد أجازة عشان ينزل يدافع عن القضاة ومش عادى أمهات القضاة يقفوا يساندوا ولادهم من على الرصيف ومش عادى يفضوا المظاهرة النهارده يلاقوها جت بكره بناس تانية وفى مكان تانى .. نهى الزينى مش عادى.. والخضيرى ومكى والغريانى ودربالة مش عادى.<br />أصل العادى كتر قوى والعادى لما يكتر بيفتح باب كل ما هو ليس عاديا.. لو بصينا على الصورة من بعيد يا براء حنبتسم نصف إبتسامة.. مش بسببهم ولا لهم فضل فيها لكن ببساطة لأن حالنا ده نتيجة الخوف والوهم ولما المسألة بتزيد الدم بيغلى والصورة بتتكشف ووالوهم والخوف بيروحوا ونكتشف إننا كنا خايفين من خيال مآتة لو بس كل واحد مننا نفخ فيه نفخة حيطير.<br />شكرا لك على إسلوبك المتميز وقراءتك العميقة للصورة وتحليلها بهذا الشكل الجميل اللى يجبر أى حد يوصل للنهاية من غير ملل. وإذا كان على الصورة فأنا أحسن الظن بمن أبدى ملاحظات على الأجزاء المكشوفة من جسد هذه السيدة البطلة أيا كان إتجاهها، ولكنى أرى أن الصورة هكذا ضرورية جدا لإحداث الصدمة ووزرها يقع مع وزر الفعل على من قام به وهى بمثابة دليل إدانة ليعرف الجميع أى نوع من البشر هؤلاء اللذين جع<br />اقرأ بقية التعليق .."
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

