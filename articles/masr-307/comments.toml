[[comments]]
order = 45
subject = "جتكو خيبة في خيبتكو"
author = "بلال فضل"
posted = "2006-05-19"
text = "الأخ الذي يطلب من الشباب ألا يتأثروا بحركة كفاية وأن يركزوا أكثر في صلاة الفجر أحب أن أذكره بحديث الرسول صلى الله عليه وسلم الذي روى قصة عابد من بني اسرائيل كان من اكثر الناس عبادة لله وعندما نزل العقاب على قومه قال الملك المكلف بإنزال العقاب لرب العزة لكن فيهم فلانالايتوقف عن العبادة.. فقال له الله عزوجل به فابدأ لأنه لم يكن ينكر المنكر.. يمكنك أن ترجع الى نص الحديث في كتب الصحاح لكي تعرف أنك عندما تطلب من الشباب ألا ينكروا المنكر فأنت ترتكب إثما.. وكان أولى بك أن تشجعهم على إنكار المنكر بما استطاعوا.. وهو مالايتعارض مع صلاة الفجر.. أما إذا ظننت أنت وغيرك بأن الله سيكون راضيا عنكم لو اكتفيتم بالصلاة والدعاء فأنتم واهمون واهمون واهمون وغدا ستكتشفون ذلك يوم الحساب"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 46
subject = "عندما نستطيع"
author = "واحد من الناس"
posted = "2006-07-19"
text = "شخصيا بشوف ان لا الحكومه غلطانه ولا اللى حكمها وحكمنا غلطان اانا راييي ان الغلط دايما مننا احنا سكتنا كتير اوى اوى يوم ورا شهر ولا سنه ورا عشره ولا قروون والسبب الخوف على النفس ولا على الاولاد ولا على المرتب ولا على الوظيفه ولا حتى الخوف الالهم من الضرب والاهانه والتعذيب افتكر انه ان الاوان منخافش شويه نتحرك يمين وشمال نتحرر زى كل الدنيا ما اتحررت الا الشعوب العربيه اللى بعتبرها شعوب محتله حتى هذه اللحظه"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 47
subject = "عندما نستطيع"
author = "واحد من الناس"
posted = "2006-07-19"
text = "وتتطلبون احتارم المصرى خارج بلده احترموه فى بلده الاول كل ظالم وليه نهايه وازى كان جيلنا مش هيقدر هيجى جيل يقدر اكيد هيجى الجيل ده واتمنى اكون واحد منهم للاسف معدش فيه كلام ينفع يتقال بقى دمنا ميه الواحد حاسس كان رجولته انتزعت منه مع ان البلد مش ملك حد والله ماهى ملك حد دى بتاعتى وبتاعتك وبتاعت اختى واختك بتاعتنا لاهى بتاعت اى حد غير المصريين اللهم فاعفو عنا وارحمنا انت موالنا ونعم الناصريين"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

