[[comments]]
order = 34
subject = "إبادة شعب"
author = "أتمنى ألا أكون مصرى"
posted = "2006-05-14"
text = "لا بد أن يعاقب الرئيس حسنى مبارك على أفعاله إن ما يفعله هو إبادة جماعية للشعب المصرى وإغتيال لوجوده فمنذ أن إستولى عن الحكم بدون إنتخابات وهو يعلم عدم شرعية وجوده مما دفعه للإستيلاء على كل مقدرات البلد وثرواته وتزويره الإنتخابات به وتهميش الشعب وهذه نفس سياسة أى مستعمر فى إحتلال أى دوله إبادة الشعب وقهره حتى لا يكون هناك أى قوى تقف فى وجهه ونحن نطالب بمحاكمة دولية لحسنى مبارك على إبادته للشعب المصرى من تهميش وفقر وبطالة ومرض وإستيلاء على كل مقدراته وتزوير كل الإنتخابات لابد أن نقدم جميعاً عريضة محاكمة له على إتفاقية الكويز التى اضرت بإقتصاد مصر وعلى تصدير البترول لأمريكا لمدة عشرين سنة بنصف التمن وتصدير الغاز لأسرائيل وتصدير الأسمنت لها لبناء الجدار العازل وبيع الشركات والمصانع وهى من أملاك الشعب وليست من أملاكه وتهريب الأموال للخارج وإنتشار الفساد أنه مجرم ولا بد من عقابة كمجرمى إبادة الشعوب ولابد من نداء كامل من الشعب كله على ذلك فكيف سينظر العالم للمصريين بعد كل هذه الإهانات التى يتلقاها الشعب من حاكمه والفسدة من حوله العالم الذى كرم المصريين بأرفع الجوائز العالمين كيف سيتعامل اليوم مع المصريين"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 35
subject = "والنبي تتلهوا"
author = "بلال فضل"
posted = "2006-05-14"
text = "شكرا لك يابلال على هذا الموضوع الذي زادنا ألما على ألم وحزنا على حزن.. وزاد في ألمي أنه بدلا من أن يفكر بعض كتاب التعليقات في مايجب عمله للإحتجاج على مهزلة مثل هذه وكارثة مثل هذه لو وقعت في بلد محترم لسقطت فيها الحكومة.. لكن لأننا مجتمع مريض متناقض نفكر في القباحة.. سواء كانت قباحة الصورة أو قباحة بلال فضل حسب رأي بعض المعلقين.. أما قباحة الفعل وقباحة الواقع فهي لاتشغلهم بنفس القدر.. لاأدري كيف يمكن لانسان يقرأ ويشاهد هذه الصور ثم يكون له نفس لكي يتحدث عن اسلوب فلان أو علان وينحرف عن صلب الموضوع.. كأنه كان يشاهد صورة في فقرة صورة وتعليق.. شيئ محزن في الحقيقة.. كنت أتمنى أن نفكر فيما يجب أن نفعله للاحتجاج على صورة كهذه.. بدلا من أن نكتفي بوصف اسلوب الكاتب ومقارنته باسلوب غيره.. هذا هو مايجب أن نفعله جميعا ويجب أن ندرك أننا سنسأل يوم القيامة على مافعلناه بعد أن شاهدنا عرضا يهتك وكرامة تنتهك بالصورة البشعة التي رأيناها بها.. شكرا لك يابراء على كتابتك التي تقطر ألما وأتمنى أن تقود قراء عشرينات نحو مجهود عملي فعلي للغضب على ماحدث مثل حملة توقيعات دولية أو أي تحرك مثمر.. أشكر محمد فتحي الذي أرسل لي لينك لهذا الموضوع.. وأتمنى أن يزيح الله عن مصر قباحة حكامهاويهدي الجميع لإدراك القباحة الفعلية التي تستحق الرفض والتنديد"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

