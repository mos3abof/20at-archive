[[comments]]
order = 0
subject = "مش لا قيه كلام أقوله"
author = "زعلانه"
posted = "2006-05-12"
text = "بجد أنا مش لاقيه كلام أقوله الحزن مخلينى عاملة زى ميكون عندى 100 سنة مفيش فايده عايزين قياده عايزين قيادة أحنا قلبنا نار وكل المصريين كارهين الأوضاع القذرة إللى موجودة فى مصر إللى مفيش فرق بين الصور دى والصور إللى بتتعرض عن الفلسطينيين ولا العراقيين فى القهر والإعتقال لازم نتحرر من الفاسد هو وإبنه لا زم يدوقوا إللى بيعملوه فى الشعب. البلد وسرقوها الشعب وزلوه عايزين إيه أكثر من كده التوريث وده على حثث المصريين كلهم مش ها نتورث اللهم أرنى فيهم أية من أياتك ياأرحم الراحمين يارب العالمين الله عليك بمبارك وأبنه وزوجته وحاشيته الفاسدة الله أمين أمين أمين يارب العالمين"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

