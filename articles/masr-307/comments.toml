[[comments]]
order = 10
subject = "يا جماعه"
author = "ياء"
posted = "2006-05-12"
text = "انا فى الاول معتقدش ان البراء غلط وحتى لو غلط غلطه ولا حاجه جنب غلط الباشا قلى فى الصوره<br />بس فيه حاجه كويسه ان قلى نحس انه غلط نقله مش نسيبه نناقشه بالعقل<br />مشكلتنا اننا سبنا الزفت حسنى مبارك من غير ما نقله حاجه لمده 25 سنه بس ملحوقه<br />هو بيعتقل ناس ماشى يوم الخميس الجاى حيشوف الناس على حق<br />انا رحت الخميس قلى فات والحكومه اخدت صاحبى منى وحروح تانى الخميس الجاى<br />على فكره ظباط مصر بجد مجانين هما دول مجانين الحكومه انا شفت عساكروظباط ورتب كبيره بتضرب فينا بشكل هستيرى<br />كان يوم ضرب وشتيمه وقله ادب واعتقال دا يوم الحكومه<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

