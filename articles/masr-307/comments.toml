[[comments]]
order = 3
subject = "شيلوا الصورة او عالجوها"
author = "أرجو من السادة الأعزاء فى \"أولاد البلد\" أن أن يشيلوا صورة المتظاهرة المضروبة .. أو معالجة الصورة بأى وسيلة"
posted = "2006-05-12"
text = "نرجو ألا يعمينا الغضب مما حدث أو الانفراد بنشر الصورة ..عن ستر عورات الناس<br />امرأة ممزقة الملابس .. هذه عورات ناس<br />أشارك صاحب التعليق الذى يطالب براء بعدم الانزلاق وراء أسلوب بلال فضل"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "صورة المتظاهرة"
author = "مصري محروق دمه"
posted = "2006-05-12"
text = "فعلأً أرجو وضع علامة سوداء على وجه المتظاهرة وما بدا من جسدها .. الرسالة وصلت على كل حال .. هؤلاء كفرة والدليل أن كل مصري شمت في العربة الي وقعت من على الكوبري مع إن دول ما لهمش ذنب . كانوا بينفذوا اوامر الباشا الكبير. يوم بعد يوم سيدرك هؤلاء أنهم غلابة مخدوعون زينا ويحدث ما توقعه الخميني وينضموا للناس اللي بيضربوها .. ساعتها كل الطيارات حنطلع على سويسرا .."
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "اسرائيل إيه ؟"
author = "مصري محروق دمه"
posted = "2006-05-12"
text = "بالمناسبة اسرائيل إيه ؟... يا عم ده اسرائيل تيجي تتعلم مننا .. بذمتك عمرك شفت صورة زي دي في الانتفاضة ؟.. على راي واحد من حماس: المفروض الفلسطينيين يتظاهروا من أجل اوضاع المصريين تحت ظل الاحتلال مش العكس .."
archived = "2006-09-20"
