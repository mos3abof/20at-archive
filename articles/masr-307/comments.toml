text = "انا كنت موجود يوم الخميس 27 /4 /2006 وكنت موجود يوم الخميس 11/5/2006 وهكون موجود ان شاء الله يوم الخميس 18/5/2006، لانى شوفت اللي عمري ما شوفته الاعتقالات على ودنه اول مرة كنت رايح عشان كان عندي شغل تغطية صحفي لاني شغال صحفي وتانى مرة كانت لمتابعة الحدث لكن ان تصل السفالة إلي درجة أن الامن المركزي يطاردنا فده معناه اننا في دولة يحكمها كلاب الشرطة انهم يسحلوا المواطنيين والصحفيين ويكسروا الكاميرات دة معناه انهم مرعوبين مننا اكيد مرعوبين وعشان رعبهم يزيد لازم عددنا يزيد<br />اللي عجبني بجد اني شوفت مواطنين عاديين كانوا بيهتفوا ضد النظام الفاشى الفاشل"
