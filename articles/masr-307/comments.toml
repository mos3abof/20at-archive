posted = "2006-05-16"
text = "خلينا ياجماعه نركز قوى فى الدعاء اكيد باذن الله يوجد من ال 76مليون مصرى على الأقل مليون دعوتهم مستجابه..لالالالالالالاللفساد.....لالالالالالاللتوريث ...لالالالالالالمبارك وسلالته..و..نعم..نعم..نعم لتعديل الدستور وربنا يخلصنا من اللصوص والحرامية والفاسدين وقولوا آآآآآآآآآآآآآآمين"
