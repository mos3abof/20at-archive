[[comments]]
order = 39
subject = "حسبي ربي ونعم الوكيل"
author = "محمد احمد الرُحيّب"
posted = "2006-05-14"
text = "لن أعلق علي صورة المرأة ولكني سأعلق علي وكستنا وخيبتنا ...<br />يا شعب مصر العيب فيكم وليس في النظام<br />العيب فينا نحن المسلمين وليس في أمريكا<br />العيب فينا نحن البشر وليس في الشيطان<br />فالنظام المصري نظام ظالم وحسني مبارك عايز يتقطع من جسمه نسايل نسايل علشان بس المنظر ده أنا عارف إنه حيشفي غليل شباب مصر العطلانين وبنات مصر إللي فاتهم القطر<br />وأمريكا مركزة في مشروعها وتسعي له بكل ما تملك<br />والشيطان دي وظيفته إللي علشانها خلقه ربنا عز وجل<br />السؤال : إحنا دورنا إيه مع مبارك وأمريكا والشيطان ؟؟؟؟؟<br />أرجوالإجابة لأن مرارتي قربت تنفجر من الهم<br />أخ من الأخوان المسلمين"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 40
subject = "بتوع الاوتوبيس"
author = "الكومسرى"
posted = "2006-05-14"
text = "اللى حصل دة بيفكرنى<br />بفيلم احنـــــــــــا بتـــــوع الاوتوبـــيــــس والناس اللى اتشدت هيحصل فيـــــهم ذى كـــــدة ذى الفيلم<br />هوا مش اداكوا حريه افرحوا بيها بقى ادنوا فى مالطه براحتكوا هوا اداكوا حريه<br />هوا مش الوزارء فاتحين مكاتبهم عشان يستقبلوا الناس خليهم بقى يستقبلوا الناس بس ما فيش فايدة ادنوا فى مالطة براحتكوااااااااااااااااااااااااااااااااااااااااااااا<br />احنا بتوع الاتوبيس<br />الكرنك"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 41
subject = "حسبي الله ونعم الوكيل"
author = "Pinky_Rose"
posted = "2006-05-15"
text = "بالله عليكم يا مسلمين تذكروا ان المسلم ليس بسباب ولا لعان فبلاش الألفاظ الغريبة دي<br />ياريت أولا نصلح من نفسنا قبل ما ننزل نطالب بالاصلاح في البلد<br />كل واحد يفكر ويسأل نفسه ياتري بينزل يصلي الفجر كل يووووووم ولا بتروح عليه نومة؟!!!!<br />ياتري بيتقي ربنا في ألفاظه وفي نظراته وفي كلامه ؟؟<br />ان الله لا يغير ما بقوم حتي يغيروا ما بانفسهم<br />والقضاة اللي قاموا واتنفضوا واللي مشي معاهم في المظاهرة عشان الانتخابات المزورة ليه متهزوش كده واتحركوا واتظاهروا من أجل الحكم بشريعة الله بدل الدستوووور والقانون<br />بلاش تخلوا فكر حركة كفاية يسيطر عليكم<br />ويبقي الهدف كفاية خلاص لاه يا الحكم بشرع الله يا بلااااااااش"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100115/http://masr.20at.com:80/article.php?sid=307&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

