[[comments]]
order = 25
subject = "سامي عمران"
text = "شوفى يا خاله نونا<br />قدامك حل من 2<br />يا تحفظى لك كام قاموس اباحه و تسمعيهم من المنقى يا خيار على غيار الريق كل يوم ، مع طبق ردح و تكشيره حريمى من اللى بالك فيهم اللى تعقطع الخلف<br />يقوموا يتلموا لأن الشعوب العربيه افتقدت السلوكيات من زمان ، و اذا ارت ان تعيشى بن الحيوانات ـ دول مش ذئاب لأن الذئاب محترمه شويه ـ فلتكونى ذات مخالب<br />يا ترتاحى فى البيت و كفى الله المؤمنين شر القتال<br />و على فكره مش عشان انك ست بيعملوا كده ، ده بقى تصرفات طبيعيه عندهم ، و الحجاب ما بيدافعش عن حد ، كان زمان و جبر قبل ما تلبسه البنات و تروح بيه على ديسكو السندباد و هات يا رقص و خلع و كباية البيره مشبره<br />انا شخصيا اتعرضت لما هو اسوء من كده ، و اول مره سمعت شتيمتى بودانى بالصدفه و كان بيتكلموا على ماما الحاجه أم سامى و بيقولوا ابن الست اللى مش نضيفه<br />و طلعت فى دماغى اخوكى انه يكيل لهم ـ العبدلله كان لسه بصحته ساعتها و من الوزن التقيل ـ<br />و بعدين عقل الرحمن قال لى ياواد ماانت لو مكنتش قارفهم و قاطع عليهم الميه و النور مكنوش شتموك ، يبقى انا ماشى صح و كبرت دماغى<br />يا نونا يا بنتى انا مسكت مواقع اللعب فيها بالملايين ، و كان عندى واد فى الأداره مرتبه 640 جنيه ، و كل يوم يركب تاكسيات بعشره و لا خمستاشر جنيه ، زائد علبتين سجاير مارلبورو كان ، وقتها العلبه بثلاثه جنيه ، يعنى لقيت مصروفه الشخصى قد مرتبه، بالاضافه الى انه بيدفع اقساط 3 شقق تمليك<br />طيب بيعيش هو و بيته منين ؟؟ رحت جايب ملفاتهم واحد واحد<br />مطولش عليك بعدها بكام شهر لقيت على مكتبه علبه مارلبورو ، فتحتها لقيت جواها كليوباترا<br />ضحكت و قلت له ايه ده ، امال فين المالبورو ؟ بص بنظره تقطع القلب و قال لى ملبورو منين ياريس ما انت نشفتها<br />و ياما اتعرض على الواحد هدايا ـ رشاوى يعنى ـ و بطرق لذيذه و جديده ، يعنى مره بمناسبه السنه الجديده جات لى هديه بدل من النتيجه و الأجنده ، علبه صغيره شكلها حلو ، فتحتها لقيت جواها اسوره ذهب مرصعه بالألماس اللى قلبك يحبه<br />سألت مسئول الشركة اللى جابتها أيه ده ؟ قالى دى هدية راس السنه ! ايه ياحاج ـ على فكره كان برضه بزبيبه ـ هو انتو بتوزعوا دهب و الماظ ؟ قال ده مستوى شركتنا ، قلت له بس انا مبلبسش اساور ، قال دى للمدام ! قلت و المدام ارجل منى مابتلبسش حريمى<br />و اللى يعرض عليك خمسين باكو و يبكى و يقولك عشان خاطر النبى اجبر بخاطرى و أقبل منى الواجب البسيط ده ، اقول له عشان خاطر النبى عايزنى اقبل رشوه ؟ يقولك ليه بس كده يا بيه مش عيب برضه هو احنا بتوع كده ، ده حقك و خيرك علينا<br />قلت ماشى مادام انت شايف انه حقى يبقى خلاص ، و فقعت أهله ، اخدت منه الفلوس وندهت السكرتيره و ناولتها الفلوس قدامه ، قلت لها روحى الحسابات هاتى وصل بالمبلغ ده ، الحاج فلان اتبرع بيه لنقابة العاملين<br />بقى حيولع و يقول لأ دول عشانك ، قلت ماشى انت قلت لى دول حقى و انا حر اصرف فلوسى زى ما انا عايز<br />الدنيا كده و ماليانه عالم وسخه ، و لازم تبقى قد حالك أو تطفشى<br />على فكره انا طفشت فى الاخر ، لأن اعصابى تعبت و مش قادر اتحمل كل الفساد اللى فى البلد ، و خاصة ان خلقى ضيق و لسانى طويل<br />اما بادرة الخير و الأمل ان من يومين واحد زميل و صديق من موديلات زمان ، مسك منصب من المناصب المرعبه ، و أتصل بى و قال لى حط المبلغ اللى انت عايزه و انا موافق مقدما و ترجع<br />تشتغل فى مصر معايا ، بس بدون مبالغه ، قلت له مفيش مبالغه ، المهم نشتغل فى نضافه<br />و بدون ما كبار اللصوص يقرفونا<br />و على فكره على كلامك عن المهندز ابو جهل ، كان شغال معايا كبير مهندسين ـ كبيــــــــــــر ـ<br />بس ماشاء الله كان حمار ببردعه و الجهل نفسه ـ كانت مسميه الدكتور لأنه جايز يكون دكتور انما مستحيل مهندس ـ و الله يا نونا يا مجنونه كان يطلب قطع غيار و هو ميعرفش بتاعة ايه ولا تركب عنده ولا لأ<br />سامى عمران"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018110506/http://www.20at.com:80/article.php?sid=573"

