subject = "الكلام ده مش مبالغة - نساء المسلمين ينادين \"و"
text = "يا جماعة المقال ده بيحتوي على ربع الحاجات اللي الستات بيتعرضولها في الشارع.... ربعها والله!!! وفيه حاجات كتير حتى ما نقدرش نقولها ولا حتى لأزواجنا. يعني يصح كده نبقى في بلد مسلمين والرجالة عاملين مسترجلين والوقاحة وخدش الحياء شغال على ودنه؟؟؟<br />يعني المفروض كل راجل ما يعملش الحاجات دي وكمان حتى لو شاف واحد معندوش دم بيعملها لازم ينهره. يا جماعة أنا نفسي حصلتلي مواقف أسوأ من كدة بكتير ومنها مواقف في أماكن العمل.. ده حتى المنتقبات ما سابوهمش.. ده أصحابي المنتقبات بيسمعوا كلام من المتنقي وكأن البيه الفتك شايف اللي تحت النقاب.<br />بصراحة أنا شايفة الموضوع ده مستفحل أوي ... لو كل واحد في الرجالة روح وسأل أخته أو مراته أو أمه أو خطيبته وشها حيحمر ويجيب عشر ألوان ومش حاتقدر حتى تقول ربع اللي بيحصلها في الشارع.<br />طيب بصوا أهي لستة بالحد الأدني من المواقف اللي بتحصل:<br />البحلقة من الجيران الذكور من غير دم ولا خشا لو حد فيهم صادف واحدة على السلم<br />البحلقة من كل من هم تحت العمارة وحوالين العمارة وإنشاءالله فوق العمارة والعمارات اللي حواليها<br />لو محظوظة وعندها عربية، فيه طبعاً بحلقة الشباب الروش اللي بيسوق جنبها وكمان بحلقة الكهول اللي معندهمش دم اللي بيبصوا بطريقة والله أخجل من وصفها<br />بحلقة أي حد ماشي في الشارع من ناس بتعدي أو سواقين عريبات أو ميكروباصات وعساكر المرور وهلمة جرا مش بعيد تسمعلها كام شتيمة من المتنقية من أي حد ماشي أو راكب وشتايم من اللي ممكن يكون فيه بعض الرجالة عمرهم ما قالوها. ده غير طبعاً المعاكسات الخارجة والداخلة والمهينة وعلى كل لون يا بطستا زي المثل ما بيقول. يعني أنا عن نفسي بين بيتي وشغلي مسافة ربع ساعة وبتشتم فيها تلات أربع مرات (على سبيل المعاكسة).<br />بالإضافة للكسر عليها ومنعها إنها تعدي على سبيل الإستظراف مش عارفة ولا حتى على سبيل الغيظ من إنها ست بتسوق زيها زيو (مرة سواق تاكسي واللي جنبوا شتموا واحدة صاحبتي شتايم خارجة علشان كانوا بيكسروا عليها ويعاكسوها وعرفت تهرب منهم وكان معاها مامتها وإخواتها البنات ولما وقفت عند ظابط المرور طلعوا يجروا). ومرة واحدة تانية راجعة من كلية الهندسة بعد الدنيا ما ضلمت وكانت مضطرة تتأخر علشان المشروع بتاعها، سواق ميكروباص شارب أو شامم فضل يعاكسها ولما كسرت عليه وهربت منه قام عامل أمريكاني وإعترض طريقها في نص شارع الأوتوستراد ونزل وشدها من شعرها من عربيتها !!!!<br />أما بقى لو حظها جميل جداً وبتركب مواصلات فحدث ولا حرج عن كل أنواع التحرش اللي ممكن واللي مش ممكن تيجي على بالكم. وطبعاً كل واحد نطع ماشي في الشارع واخد توكيل من هيئة التحرش العالمية تؤهله لفعل ما يريد بدءاً من البص ونهاية بما هو أكتر من مد الإيد وحسبي الله ونعم الوكيل. وكلنا عارفين قصة البنت اللي اتنشرت في جريدة الأهرام المصريو وجت في أحد برامج التليفيزيون، وهي عن البنت إلى ركاب الميكروباص والسواق إعتدوا عليها وهي راجعة من شغلها كممرضة في أحد المستشفيات باليل وسابوها بعد ما افتكروا إنها ماتت... كمان خطيبها لما عرف (وكان كاتب كتابه عليها) كان عايز يسيبها وكأنها هي المجرمة<br />وقبل ما تركب بيكون طبعاً التسخين، وده بيأهل الواحدة مننا معنوياً للإهانات والتحرشات اللي حتتعرضلها في وسائل النقل علشان مايجلهاش صدمة عصبية ولا تروح تنتحر. وطبعاً التسخين ده يتضمن بحلقة وشتيمة ومعاكسة وإستظراف بالإضافة لحبة كهول عندهم عته منغولي فاكرين إن لما واحدة تقف تاخد مواصله معناه إنها عايزة تركب مع أي واحد ومستعدة تدفع أي بديل للفلوس. وبالتالي بيهدوا ويعلقوا ويبحلقوا و...إلخ<br />وطبعاً بعد التسخين تبدأ المبارة فلما تركب المواصلات، الذكور (ولا أقول الرجال) اللي معندهمش ريحة دم بيعتبروا أن مجرد ركوبها المواصلات موافقة ضمنية على أنها تصبح مشاع للركاب والسائق والمنادي بتاعه بالمرة يالله ما أهو أبو بلاش كتر منه. والله أنا مكسوفة أفسر أكتر من كدة.<br />ولو واحدة حاولت تدفع مكان كرسيين مثلاً علشان محدش يقعد جنبها يهبوا فيها (لأنها كدة بتعتدي على حقهم الطبيعي في التحرش) ثم تلاحقها الشتيمة بعد ما تنزل من الميكروبص، وطبعاً لو واحد إتحرش بواحدة في المواصلات وجرؤت تفتح بقها ولا تهزأة يبقى يومها مش فايت وتبقى جنت على نفسها براقش. والواحدة مننا بتكتم في نفسها وتروح تعيط في بيتهم أحسن... يعني حيبقى تحرش وكمان فضيحة وشتيمة في الشارع.<br />هذه الأمثلة من التحرش أثناء الذهاب الركوب وما قبله أو بعدهوماتكلمتش عن التحرشات اللي بتحصل في مواقف تانية"
