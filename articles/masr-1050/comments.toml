[[comments]]
order = 2
subject = "ياجمال الريادة"
author = "عادل"
posted = "2006-10-18"
text = "اين هى الريادة واين الابداع اذا كان هناك من يعين المدعو تامر امين ماهذا الفساد؟؟!! انه واحد من نتاج الفساد فى مصر ويجب ان يحاكم فى اقرب وقت ممكن.. واسال هناك شاب متميز فى قناة النيل للاخبار وهو بحق اعلامى متميز واسمه احمد انور اين هو من البيت بيتك وغيره من برامج البروزة والفلوس؟؟!! اين الوزير لمساندة هذا المبدع واظهاره بشكل اكبر لانه مشروع اعلامى متميز..اين انت ياوزير الريادة والاعلام؟؟..اتقوا الله يابشر... وادعموا الناجحين ..اتقوا الله وساندوا اهل الخبرة واقتلوا اهل الثقة وحاكموهم..وكفاكم ظلما لبثينة كامل لانها متميزة وفضحت فسادكم وفشلكم...يافاشلين يامتخلفين ياللى قتلتم مصر من سنين مش من ايام السادات ومبارك ...!! لا ده من ايام انقلاب يوليو اللى استوليتوا بيه على البلد.... عاشت مصر"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060936/http://masr.20at.com:80/article.php?sid=1050"
