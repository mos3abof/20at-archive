text = "لا يا حبيبي<br />مصر بتكسب الجزائر<br />وكسبت الجزائر وصعدت الى كاس العالم سنة 89<br />مصر لعبت في كأس العالم سنة 1920<br />انت معنوياتك ضعيفه<br />انت انسان مهزوم داخليه لا فائدة منك"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106163745/http://www.20at.com:80/masr/105-msa7t-r2y/14068-2009-11-16-13-48-36.html"

