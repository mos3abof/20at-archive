text = "كفاكم كلام لا فائدة منه .فازت الجزائر و انتهى الامر و اثبتوا فعلا انهم رجال و انهم الافضل خلونا منطقيين و بلاش الف و الدوران الي مش حنحصل منو ولا حاجة"
