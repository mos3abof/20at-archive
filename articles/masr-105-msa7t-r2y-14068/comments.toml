posted = "2009-11-21"
text = "يا نهار اسود لو المنتخب المصرى لعب مع السعودية وحضر ولاد حسنى<br />وقامت اعمال شغب وضرب بين الجمهور<br />والسعودية اخدت قرار بطرد العمالة المصرية ال 3 مليون مصرى<br />هناكل من اين<br />حسنى وعيالة هيلاقوا وظايف لنا فى مصر<br />بطلوا الكرة يا ولاد [ *** ] وخللونا ناكل عيش - احنا شعب معدم مهدود الحيل<br />ولما مش عارفين تشجعوا وتضربوا الاتوبيس الجزائرى فى القاهرة وهم يردون بضربكم فى الخرطوم يتبعة طرد العمالة من الجزائر<br />يبقى الشعب كسب اية<br />احنا عايزين ناكل عيش<br />الغوا الكرة"
