author = "يوم خروج فرنسا"
posted = "2009-11-26"
text = "كانت الجزائر قطعة من فرنسا - وكان الفرنسيون يرفضون استقلال الجزائر لان ارضها امتداد لارض فرنسا<br />ومات من الجزائريون مليون شهيد من اجل الاستقلال<br />ويوم الاستقلال<br />صعدت الجزائريات امهات واخوات الشهداء - صعدن فوق اسطح البيوت كل واحدة فوق سطح بيتها ومعها الاطفال وهتفوا فى صوت واحد طوال الليل<br />يا محمد ( يقصدون الرسول ) مبروك عليك الجزائر رجعت اليك<br />اللة اللة كان هتاف رائع ملىء قلوبنا نحن الاطفال المصريين وقتها<br />يا محمد مبروك عليك الجزائر رجعت اليك<br />يا محمد مبروك عليك الجزائر رجعت اليك<br />عادت الجزائر عربية اسلامية حرة<br />متى ياتى اليوم الذى نسمع فية<br />يا محمد مبروك عليك القدس رجعت اليك<br />متى<br />متى<br />متى"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106163745/http://www.20at.com:80/masr/105-msa7t-r2y/14068-2009-11-16-13-48-36.html"

[[comments]]
order = 21
subject = ""
author = "سعدون سعيد"
posted = "2009-11-27"
text = "انتصرت الجزائر وانتهى الامر<br />اية هدف المجادلات والمحاورات والمماحكة بتاع المصريين<br />هل الفول والبصل سد قنوات فهمكم وجعلكم تعيشون فى وهم واحلام الماعز والابقار<br />ستظل الجزائر عقدتكم<br />وستهزمكم تونس وايضا ليبيا والمغرب<br />انتم صدقتم الوهم انكم ام الدنيا<br />واذا كنتم ام الدنيا فالجزائر ابوها"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106163745/http://www.20at.com:80/masr/105-msa7t-r2y/14068-2009-11-16-13-48-36.html"

