subject = ""
author = "مش ححبك"
posted = "2009-11-27"
text = "المباراه القادمه مع الجزائر ايا كان موعدها لازم نتجاوز السلبيات التي حصلت في هذه المباراه<br />يعني مثلا الباص اللي حينقل فريق الجزائر نخلع منه الشبابيك الزجاج علشان خاطر ما يعرفوش يكسروه بالشواكيش يكون مجهز بحيث انه ما يكنش فيه زخاج خالص<br />واذا رحنا نلعب مباراه محايده في بلد اخر ما نخدش العيال الفافي والبنات الفاني يروحوا يشجعوا زي المطربين والمطربات اللي رجعوا يعيطوا في الفضائيات<br />ناخد العيال ولاحد الاحبه وولاد [ *** ]ه الصيع والحوش واللمامه ورد السجون بتوع البلد والمجرمين والمسجلين خطر علشان خاطر يروحوا يشجعوا<br />وقبل ما يسافروا نعرف في البلد اللي رايحنها السنج والمطاوي والامواس والسكاكين بتتباع فين علشان خاطر اول ما ينزلوا من المطار يروح كل واحد يشتري السلاح اللي عايزه"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106163745/http://www.20at.com:80/masr/105-msa7t-r2y/14068-2009-11-16-13-48-36.html"
