text = "الى الاخ برضو بحبك<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />اكتب على محرك بحث جوجل<br />مجازر الجزائر<br />علشان خاطر تشوف بنفسك المتحضرين اللي بيلعبوا في فرنسا"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106163745/http://www.20at.com:80/masr/105-msa7t-r2y/14068-2009-11-16-13-48-36.html"

[[comments]]
order = 23
subject = ""
author = "الى برضو بحبك"
posted = "2009-11-27"
text = "انت بتقول حيغلبونا لانهم بيلعبوا في فرنسا<br />طيب وطرد عشرين الف عامل مصري من وظايفهم دا كان شغل فرنسا<br />والاعتداء على مقر عثمان احمد عثمان في الجزائر دا شغل فرنسا<br />لعلمك بقا فرنسا بتلعن ابو اليوم اللي احتلت في الجزائر بسبب شوية الهمج دول<br />انت مش عايز في الدنيا<br />ما سمعتش عن المجازر اللي كانت موجوده في الجزائر بين الجزائريين وبعض بعد فوز التيار الاسلامي بقيادة عباس مدني واستقالة الرئيس الجزائري<br />الجزائر فضلت في مجازر لمدة 5 اعوام على الاقل<br />هون دا برضه شغل فرنسا"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106163745/http://www.20at.com:80/masr/105-msa7t-r2y/14068-2009-11-16-13-48-36.html"

