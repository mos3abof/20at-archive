text = "اغنية يا حبيبتى يا مصر لحبيبة مصر السيدة شادية اذيعت بعد نكسة 67 وكلمات الاغنية بتعطى شىء من الامل وبتقول ان العدو ما شفش العيال السمر الشداد وصبايا البلد<br />اغنية كانت بتعطى الامل وسط ظلمات الهزيمة<br />وبعد النصر غنت شادية<br />عبرنا الهزيمة يا مصر يا عظيمة<br />اية اللى دخل الاغانى دى التى لن يجود الزمان بمثلها فى لعب الكورة<br />اعملوا اغانى لنانسى عجرم وهيفاء وبقية الشلة عن الكرة<br />انما اغانى مصر التى قيلت ومصر تبكى دما وتجمع حولها الشباب السمر الشداد من القرى والنجوع ليحاربوا من اجلها فاتركوها لمصر<br />فمصر ليست مباراة كرة قدم"
archived = "2009-11-17"
capture_url = "https://web.archive.org/web/20091117133407/http://www.20at.com:80/masr/hot-topics/14068-2009-11-16-13-48-36.html"

