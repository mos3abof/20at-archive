subject = ""
author = "انتم عارفين تفيدة"
posted = "2009-11-19"
text = "تفيدة دى واحدة ست غلبانة كانت ساكنة بيت صغير فى طرف قريتنا وملهاش احد وساكنة لوحدها ومعتزة قوى بشرفها ونفسها وتملك من الدنيا شوية فراخ -<br />فى ليلة برد قوى دخل عليها عصابة حرامية اعتدوا على شرفها وسرقوا فراخها<br />وطلع مثل بيتقال جيل بعد جيل<br />وانا شايف ان المثل دة بينطبق على الفريق المهزوم<br />لما واحد بيحب يشتم واحد بيقول لة<br />الهى تخيب خيبة تفيدة ناكوها وسرقوا فراخها<br />فقدنا الشرف والمال"
archived = "2009-11-25"
capture_url = "https://web.archive.org/web/20091125150704/http://www.20at.com:80/masr/105-msa7t-r2y/14068-2009-11-16-13-48-36.html"

[[comments]]
order = 11
subject = ""
author = "مصرى"
posted = "2009-11-20"
text = "رحم اللة الكاتب الساخر محمود السعدنى<br />احيانا كان بيعلق على مباريات الكرة المصرية زمان<br />وكان بيسمى اللعيبة رغم انهم لا يقارنوا بجيل الايام دى كان بيسميهم الارزقية<br />انا رايى ان مفيش كرة قدم فى مصر<br />فية شوية ناس بتلعب بالعافية وبدون اى تنسيق واللى الكرة بتيجى على رجلة بياخدها ويجرى على الجون على طول<br />اخر مباراة لمصر من سنوات مع انجلترا اللعيبة الانجليز وقفوا مندهشين من طريقة لعبهم وطلعت الجرايد الانجليزية تقول ان الناس دى لا يفهموا اى شىء عن كرة القدم<br />العملية ارزاق<br />وانا لما اتفرج على ماتش فية فريق مصرى بييجى لى غم وانسداد نفس<br />واتابع الدورى الانجليزة واتفرج على فن كرة القدم<br />الفريق الجزائرى بيلعب بالطريقة الفرنسية قريبة من طريقة لعب الزمالك وطبعا طريقة متحضرة لا تنفع مع لعبة الغشم والعفينة والجهل"
archived = "2009-11-25"
capture_url = "https://web.archive.org/web/20091125150704/http://www.20at.com:80/masr/105-msa7t-r2y/14068-2009-11-16-13-48-36.html"

[[comments]]
order = 12
subject = ""
author = "مش ححبك"
posted = "2009-11-20"
text = "فيه حاجه اسمها المعنويات يا جماعة<br />وفيه سلاح في الجيش اسمه التوجيه المعنوي<br />حتى كمان الرياضة لازم معنويات<br />الجزائريين فهموا هذه النقطة<br />فاعتدوا على المصريين اللي شغالين في الجزائر<br />وسمعت انهم الغوا عقد عشرين الف مصري في الجزائر<br />فاكيد اكيد الكلام دا وصلت للمنتخب المصري<br />عرفوا ان اهلهم في الجزائر اتضرروا<br />فاثرت على معنوياتهم<br />الجزائر بتفهم في الحرب النفسية والمعنوية<br />فهمتوا ايه اللي حصل<br />اي خلاف يحصل مع اي دولة عربية على طول يضربوا العمالة المصرلاية بالجزمه ويطردوها<br />حتى اضعف دولة عربية<br />قطر<br />فاكرين مرة حصل خلاف بينها وبين مصر طردوا كثير من العمال المصريين<br />وايام جبهة الرفض بعد معاهدة السلام<br />فاكرين<br />العمالة المصرية واجهت نفس المصير<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـتت<br />احنا شعب جعان<br />لازم نبوس الرجلين والادين علشان خاطر نشتكل بره ونعيش ونوكل اهلها<br />لو سمحتوا والله كفاية كوره<br />احنا شعب جعان وحافي ومهزأ وبيتسول علشان خاطر لقمة العيش"
archived = "2009-11-25"
capture_url = "https://web.archive.org/web/20091125150704/http://www.20at.com:80/masr/105-msa7t-r2y/14068-2009-11-16-13-48-36.html"

[[comments]]
order = 13
subject = ""
author = "بكاء فى التليفزيون"
posted = "2009-11-21"
text = "يا نهار ابوكم اسود<br />مناحة فى التليفزيون<br />جايبين شوية اناس بتعيط زى العيال بتوع ابتدائى وكل شوية يقول لك ضربونا<br />مناحة مستمرة 24 ساعة<br />طيب واخرة العياط يا ولاد الهبلة<br />الدول العربية هتشفق عليكم ويبعتوا شوية معونات<br />اية اخرة المناحة لشوية مطربين بتوع صالات فنادق وكانوا رايحيين لية اصلا<br />اية لزوم اذاعة المسخرة دى<br />العالم هيتف عليكم لانكم شوية ارانب<br />عايزين تاخدوا شوية عطف زى بتوع غزة لما انضربوا<br />ابدا<br />كل العرب مع الجزائر وارسلوا تهانى الفوز للفريق الجزائرى<br />اتلموا بقى ووزير الاعلام الزفت يكفى على الخبر ماجور وما يفضحش المصريين قوى كدة"
archived = "2009-11-25"
capture_url = "https://web.archive.org/web/20091125150704/http://www.20at.com:80/masr/105-msa7t-r2y/14068-2009-11-16-13-48-36.html"

