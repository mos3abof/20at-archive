text = "وبعد ما تعمل كل دة برضة الجزائر هتغلبك<br />لان فية فرق بين اللعيبة اللى ساكنين فى مقابر الغفير واللعيبة اللى بيلعبوا فرنسا<br />فرق حضارى كبير بين سكان القبور وسكان المدن"
