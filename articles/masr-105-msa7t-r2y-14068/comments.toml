posted = "2009-11-21"
text = "أحنا مابنبكش .. وإذا كنا بنبكي فده علشان أحنا كنا ملخومين في حماية الأطفال والبنات إللي معانا ومقدرناش نرد عليهم ولا ندافع عن نفسنا .<br />والله لولا الأطفال و البنات، كنا وريناهم وعرفناهم مين هما المصريين ومش عايزين سلاح في أيدينا ، دخلونا بس عليهم بأيدينا فاضية وأنتوا هتشوفوا أحنا هنبيد المشاغبين النتنين دول إلي يتعرض لبنت أو لطفل يبقى لا مؤاخذة العاهرة أفضل منه ."
archived = "2009-11-25"
