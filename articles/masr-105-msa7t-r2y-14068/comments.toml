[[comments]]
order = 15
subject = ""
author = "الثورة ورجالها"
posted = "2009-11-21"
text = "طبعا ثورة 23 يوليو بقيادة المجرم جمال عبدالناصر كان ليها قصب السبق في تجويع الشعب المصري<br />يعني هما عملوا ثورة على كرامة الشعب المصري وجوعوه والنتيجة انه اصبح شعب متسول في بلاد العالم وخصوصا في كل الدول العربية يبحث عن لقمة عيش بسيطة يرسلها لاسرته ليضمن لهم حياة كريمه<br />حياه كريمه دمرها كلاب الثورة بقيادة جمال عبدالناصر<br />قتلوا فينا العزه والكرامه<br />قتلوا فيها الشجاعة<br />خلو الشعب المصري يمشي جنب الحيط<br />تصوروا يا جماعة<br />ننهزم في ماتش وننضرب بعد الهزيمة كمان<br />يعني ننهزم ونضرب ونبكي زي النسوان في الفضائيات<br />يا خسارة يا مصر<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2009-11-25"
capture_url = "https://web.archive.org/web/20091125150704/http://www.20at.com:80/masr/105-msa7t-r2y/14068-2009-11-16-13-48-36.html"

[[comments]]
order = 16
subject = ""
author = "مش ححبك"
posted = "2009-11-21"
text = "شفت على قناعة الحياه مذيعة ومعاها مطرم وهما الاثنين كانوا في السودان وبيتكلموا على الاحداث<br />المهم ان هما الاثنين كانوا بيحكوا وشبه بيعيطوا<br />بالذمة دا كلام<br />يعني هما يعتدوا علينا عيني عينك واحنا نعيط<br />كان لازم نرد الضربة بنفس الضربة<br />يعني كسروا مكتب مصر للطيران<br />الامن المركزي يكسر مكتب طيران الجزائر<br />ضربوا عمال مصريين<br />ندور على تجمعات الجزائرين في مصر ونديهم بالجذمه<br />نكسر السفارة الجزائرية ونضرب السفير الجزائري بالجذمه القديمه على وشه ادام التلفزيون<br />هما دا كان لازم الرد<br />لكن نبكي في الفضائيات زي النسوان<br />ما ينفعش"
