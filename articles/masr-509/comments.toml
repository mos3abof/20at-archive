[[comments]]
order = 8
subject = "مش فاهمة"
author = "ام العيال"
posted = "2006-06-16"
text = "والنبي بتعيطوا على اية؟؟ اصل خلاص الشغل مقطع بعضة والمناصب الوزارية مستنايكم ..كلة زي بعضة دبلوم التجارة زي كلية الطب..كلة قاعد في بيتهم لسة بياخد مصروفة من ابوة الغلبان<br />ولا نسيتوا الاول على كلية السياسة والاقتصاد والنجح بتقدير امتياز مع مرتبة الشرف طول حياته وفي الاخر مرضوش يقبلوة في وزارة الخارجية ال اية علشان انه فقير من حي بسيط..تاني يوم انتحر..<br />طبعا هوة دة مصير اللي يثق في الحكومة وحسني كان مستني اية؟؟ مستني يشيلوا الواسطة علشان خاطرة؟؟<br />طب وولاد دكاترة الجامعة اللي يبقوا معيدين بالكوسة؟؟<br />طب وولاد دكاترة الطب والتخصصات اللي محجوزة باسمهم ومحدش يقدر يهوب ناحيتها؟؟<br />ماتعيطوش<br />دا احنا عاوزين الي يعيط علينا"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616153012/http://masr.20at.com:80/article.php?sid=509"

