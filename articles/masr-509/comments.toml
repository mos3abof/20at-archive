[[comments]]
order = 3
subject = "هذا هو المطلوب ..ياكل مصر الثورة الآآآآآآآآآآآآآن"
author = "مصرية"
posted = "2006-06-15"
text = "الوضع الطبيعى لسياسة الأوغاد الطفاة أن يعيش الشباب هذه الحالة من الضغط والقهر بمناهج عقيمة ومدرسين الغالبية العظمى منهم غير أكفاء يلهثون وراء المادة بامتصاص ميزانية الآباء الى آخر نفس..والقائمين على العملية التعليمية الجالسون وراء المكاتب المكيفة فى غيبوبة تامة عن واقع التعليم فى مصر ..بداية من المعلم الغير كفؤ الذى يتقاضى مرتب يخجل الأنسان من ذكره فلهث وراء الدروس الخصوصية وانضموا الى نادى الحيتان..والكتاب المدرسى الملىء بالأخطاء العلمية والمعامل الغير مجهزة للمواد العلمية العملية حتى أصبحت تجارب الكيمياء والفيزياء والأحياء تحفظ هى الأخرى دون مشاهده..أما عن كم الحشر فى المناهج فحدث ولا حرج..وفى كل عام تشكل لجان من هؤلاء السادة القابعين فى مكاتبهم (يتقاضوا عنها بدلات طبعا) لما يسموه تطوير المناهج وتتفتق أذهان السادة العباقرة عما نراه من مهازل فى كل مراحل التعليم..واستمرارا فى غيابهم عن التعامل مع الواقع يتم وضع امتحانات لاتصلح معاييرها للطالب المصرى..ولا المدرس الذى لم يؤهل أصلا للتدريس ولا التصحيح بأسلوب التفكير والبحث والأستنتاج وتنمية قدرات الطالب ..لأنه خريج سابق لهذا النظام..أما عن الدورات التدريبية التى يقيمها الساده عباقرة التطوير فهى حبر على ورق تقام من أجل المزيد من ( البدلات )..كل مايدور حولنا المزيد.. المزيد.. المزيد من الفساد<br />أفساد حياة الشباب وأغراقهم فى دوامة الصراع من أجل مستقبل أصبح مجهولا ..هدف أول لهولاء الفسدة يحقق لهم السيطرة على قوة لايستهان بها ..حسبنا الله ونعم الوكيل<br />أخى جاوز الظالمون المـــــدى<br />فحق الجهـــــادوحق الفــــدى<br />يا كل مصر الثــــــــورة الآآآآآآآآن"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616051759/http://masr.20at.com:80/article.php?sid=509"

