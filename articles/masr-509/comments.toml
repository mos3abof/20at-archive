subject = "منكم لله"
author = "غريب"
posted = "2006-06-14"
text = "منه لله الوزير ومنه لله اللى عمل الاسئله ومنه لله اللى راجعها<br />مش عارف عايزين يعملوا فى الناس ايه اكتر من كده مش كفايه الشباب العاطل وكفايه الموظفين المطحونين وكفايه الفقرا المعدومين كمان مش بيرحموا الطلبه فى الفرصه الوحيده اللى بتخليهم يحسوا انهم بيعملوا حاجه مفيده ويحققوا ذاتهم فيها<br />منه لله اللى ولاهم علينا ومنه لله مبارك"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616051759/http://masr.20at.com:80/article.php?sid=509"

