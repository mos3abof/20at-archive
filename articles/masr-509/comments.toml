subject = "تسعيرة سوق العمل"
author = "ابو البنات"
posted = "2006-06-15"
text = "لعمل كتير ومتوفر بس لازم تشخشخ جيبك علشان تشتغل وكل حاجه وليها تسعيره يعنى مثلا عايز تشتغل فى هيئة قناة السويس لازم تدفع 20 الف جنيه والبترول والكهرباء لازم تدفع 15 الف جنيه وده طبعا مع الرأفه ويا عينى عليه ولى الامر هيربى ولا يأكل ولا يدى دروس خصوصيه ويدخل الجامعه وكل ده اكيد مش لواحد ولا اثنين ده يمكن عنده 3 او4 عيال وفى الاخر يدفع عشان يوظفهم يا عينى على الغلابه"
