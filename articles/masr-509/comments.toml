subject = "ارحموا من في الأرض يرحمكم من في السماء"
author = "مسلمة تتألم لحال نفسها وحال أمتها!!!!"
posted = "2006-06-16"
text = "السلام على من اتبع الهدى<br />سؤال يطرح نفسه . لماذا يتعمد واضع الإمتحان الصعوبة في وضع الإمتحان؟ . أهو لأننا الطلبة ضعفاء لايشكون . أم هو لأن واضع الإمتحان لايرحم هؤلاء الطلبة الذين يأملون في تحقيق شئ لأنفسهم واهليهم ووطنهم؟! . بالله عليكم راعوا ربكم الذي خلقكم في جميع اعمالكم. وارحمونا.<br />ارحموا من في الأرض يرحمكم من في السماء"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616153012/http://masr.20at.com:80/article.php?sid=509"

