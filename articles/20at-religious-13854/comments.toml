author = "مسلم"
posted = "2009-10-31"
text = "واحد يقول العلماء مختلفين<br />وواحد يقول إذكرلنا المصدر<br />إنه الخير لا يحتاج لأدلة وهو الفضل لا يجوز عليه إختلاف<br />فلتكن ما تكون، هي صلاة لله نقومها تعبداً إن كانت سنة مؤكدة ونقومها تقرباً إن كانت غير ذلك.<br />ولأ أرى كمسلم في نظمها ما يخل بالصلاة أو يعيب بنيانها.<br />بارك الله لك أخي إن أصبت وإن أخطئت بغير عمد، فكلا الحالين مأجور من الله، وإن كان هذا حال رب العالمين، فأقل ما نشكرك به هو الدعاء لك."
archived = "2009-11-01"
