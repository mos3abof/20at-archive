[[comments]]
order = 2
subject = "\\\" وانا واقفه جنب طلعت حرب ايديا في ايديه"
author = "سنووايت"
posted = "2006-05-20"
text = "لا ادري أي صدفة ساقتني \" لمكتبة مدبولي\" يوم الأربعاء قبل جلسة النطق في قضية المحاكمة التأديبية للقضاة وقبل يوم أيضا من نظر قضية أيمن نور 00 على غير العادة لم أشعر ببهجة المضي في ميدان طلعت حرب لأول مرة أدقق النظر للميدان والشوارع والبشر 0 من ركن جانبي امام مدبولي اترك النظر للكتب خلف جدارها الزجاجي00<br />وأرى أن طلعت حرب يواجه صيدناوي وبنك أبو ظبي الوطني ويعاني من ضيق تنفس وربما أزمة قلبية كتلك التي أصابت الفارس \" هشام البسطويسي \"<br />وهو يسمع ما وصل اليه حال الإقتصاد المصري وخصخصة \" اخترناه وبيعناه\" اسم الله عليه عاشور الناجي<br />لأول مرة أدقق في تمثال الميدان وأراه معطيا ظهره أو قفاه لمقر\" حزب الغد\" المعلق عليه لافته \" بنحبك يا أيمن\"<br />أدقق النظر هناك فألمح شاب أسمر يضحك وهو واقف جوار زميل له ينظرون من هناك \" من فوق\" على عربة الامن المركزي \" الخضرا\" شبه كل سنواتنا الخضرا من يوم عاشور الناجي ما رفع نبوته مش مهم على مين المهم انه رفعه<br />\" عربة الامن المركزي المذعورة \" ومعها سيارتين او ثلاثة بيضاء للشرطة منثورة هنا وهناك طالعتني هناك أقدام تلامس أرض الميدان تمضي من رصيف جروبي – للشروق- لمدبولي\" نفس الوجوه على مدى نصف ساعة تدور في شبه دائرة<br />تتسكع أمام زجاج المكتبات والمحلات والعيون قلقة والوجوه مزدحمة بالتفاصيل<br />أشتري الكتب 00 واحتضنها كعادتي عندما احصل على كتاب جديد أحب أن تتوحد \" دقات قلبي\" مع غلافه لنلتئم قبل القراءة<br />\" هي طقوسي الخاصة مع الأشياء \"<br />على عتبة المكتبة اصطدم بزميل صحفي قارئ مثقف ونهم نتبادل الكتب سألني عما اشتريت 00 اخبرني عن رواية جديدة لابراهيم عيسى<br />وأخبرته عن نسخة \" شفرة دافنشي التي حصلت عليها واتفقنا ان ارسل له<br />\"بنات الرياض \" ويوافيني هو بمجموعه اخرى<br />قب<br />اقرأ بقية التعليق .."
archived = "2006-09-26"
capture_url = "https://web.archive.org/web/20060926225428/http://masr.20at.com:80/article.php?sid=346&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "ياليت شعرى"
author = "مواطن مصرى"
posted = "2006-05-20"
text = "حكومة أيه يا زمان دى حكومة عار<br />قتل وفقر ومرض وضرب نار<br />والجارية تحت إديه والسيف كمان بتار<br />وقال الظالم ده الشعب هو الأختار<br />مدولى مده تانيه وده كان الأختيار<br />وقلنا ماشى<br />وفى إنتخابات البرلمان<br />شفنا تزوير وغش كمان<br />وضرب وسب والكل إتهان<br />ولا نسيتوا إلى عملتوه فى الإخوان<br />لما شفتوهم بيكسبوا قلتوا stopبلاإنتخابات بلا إستبيان<br />وكلامكم مشى على رقاب الشعب الغلبان<br />وقلتوا بس ده الشعب كله جبان<br />لكن القضاه قالوها حصل تزوير فى الإستبيان<br />فأدبتموهم وفتكرتم إن الكلام راح فى خبر كان<br />لكن دى البدايه و النهاية جاية يا زمان<br />والقضاه قالوها مصر بلد احرار<br />ومش هنسيب البلد تنهار<br />مش هيسكتنا حاكم طاغى جبار<br />خمسة وعشرين سنه عيشين تحت حكم حمار<br />كفاية قالت كفاية للظلم والإستعمار<br />والشعب ساكت خايف وايد وشايل على كتافة العار<br />عار مبارك وكلامه وخطبة عن الأمن والأستقرار<br />مش شايف إلى بيحصل ولا بيضحك على نفسه<br />صدقونى زى ما قلت حمار<br />وكمان جمال اتعلم وناوى يبقى المعلم<br />لكن على جثتى لو مسكها ابن الحمار<br />فكرنا إيه سوريا معلش يا عم بشار<br />البلد مش ناقصة نهيق ولا لعب ع الأوتار<br />نهشوا البلد بعد كده يقولوا مين دول الأشرار<br />حرامى قاعد على الكرسى وحوليه حراميه كبار<br />إلى غرق عبارة وبعد كده طار<br />و وزارة النقل إلى اتنهبت من حرامية كتار<br />ولا دهب إلى اضربت بعد كده يلعبلنا لسانه زى المزمار<br />وتتطلع تعبين من حوليه بتبخ سم ونار<br />و الوزرات هاتك ياسرقه وحلتنا بأت دمار<br />و المظاهرات ضرب إهانة وإعتقال بالزمه ده حاكم ولا ده جزار<br />مش ناقص على الشعب غير الإنتحار<br />متزعليش يا مصر والله فيكى ولاد أبرار<br />مهما طال الزمن ودارت الأيام ودار<br />هتفضلى يا مصر حرة على إدين ولادك الأخيار"
archived = "2006-09-26"
capture_url = "https://web.archive.org/web/20060926225428/http://masr.20at.com:80/article.php?sid=346&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

