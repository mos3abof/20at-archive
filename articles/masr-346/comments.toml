[[comments]]
order = 9
subject = "أخرجو للشوارع ولاتعودوا حتي نسحل حسني مبارك أو نموت"
author = "ما الفائدة من خروج ألف شخص أو حتي ألفي أو حتي ثلاثة للشوارع في القاهرة مادام عساكر الأمن المركزي يمكنهم تفريق المظاهرة وأعتقال النشطاء, لابد من خروج مالايقل عن مائة الف شخص للشوارع ويكونوا علي أستعداد للتضحية بأنفسهم لايتركون الشوارع حتي يسقط حسني مبارك ويتم سحله في الشوارع ماذا بقي للناس كي يتحركوا البلد واخده صفر في كل حاجةلافي تعليم ولاإقتصاد ولاحالة أجتماعية عادله الكل واخد صفر. فاضل أيه عشان نغير حسني مبارك وأبوطويلة رئيس الوزراء الأهبل مستنيين أيه ممكن يحصل . الشعب الأيراني دفع خمسة عشر الف شهيد من أجل الحرية وطرد الشاه في السبعينات ونحن نموت في حوادث الطرق والحرائق وحتي الغرق كل سنة أكثر من خمسة عشر الف . أنا مادفعه الشعب الأيراني وهو يبحث عن الحرية يقل كثيرا عن ماندفعه نتيجة سكوتنا وخوفنا"
posted = "2006-05-22"
text = "ماهو حاجة من أتنين إما نسحل حسني مبارك وعصابته أو نموت حقيرين فطعم الموت في أمر مروم كطعم الموت في أمر عظيم"
archived = "2006-09-26"
capture_url = "https://web.archive.org/web/20060926225428/http://masr.20at.com:80/article.php?sid=346&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "منقول"
author = "منقول"
posted = "2006-05-23"
text = "منقول<br />:سيدي الرئيس .. أنت جبان<br />أراك تلتصق الآن في مقعدك الوثير، وتثبّت عينيك على الشاشة الصغيرة، وترتعش يداك وهما تتعّرقان حول سمّاعة الهاتف، وقد جاءك صوتٌ من أحد كبار الكبار يطمئنك بأن كل الأمور على ما يرام، وتمام يا أفندم، فقواتك الباسلة، يا صاحب الضربة الجوية الأولى، اخترقت بشجاعة منقطعة النظير جيشاً عرمرم من شباب صغير ومرهَق من السهر استعدادا للامتحانات، ثم لبى نداء قضاته الشرفاء.<br />كانوا عشرة على الرصيف، وجنودك الأبطال أكثر من تسعمئة يحاصرونهم. القانون يقول بأنه يتم القبض على مخالفيه، ثم يُعْرَضون على النيابة. أما قانون الجبان فيطلب من كل ثلاثين أو أربعين كلبا محاصرة مواطن واحد، ثم القائه أرضا، وركله بشدة في كل أنحاء جسده حتى يتورم، وتنفجر من مساماته دماء حمراء قانية.<br />أراك هاربا في ايطاليا أو ألمانيا أو المغرب أو شرم الشيخ، وأتحداك أن تخرج في موكب مخترقا شوارع العاصمة ولو كنت في حماية أمريكا واسرائيل وكل كلابك الذئبية المفترسة.<br />أقدم اعتذاري الشديد لكل الطيارين الأبطال الوطنيين الذين رعتهم سماء مصر في السادس من أكتوبر عام 1973، وأقول لهم بأن هذا الرجل ليس منكم وليس مِنّا.<br />لعلك كنت تستلقي من الضحك على غضروفك الذي آلمك عندما بلغك نبأ تحرش ضباطك وجنودك بفتيات مناضلات أصغرهن أكثر منك شجاعة، وأعمق حبا للوطن، وأقرب لروح السماء منها لتراب الأرض.<br />انتقدتك كثيرا، وكتبت عنك ما ظننت أنه يفجر الماء من الصخر، ولكنني هذه المرة أحمل لك رسالة من سبعين مليونا من المصريين، ومعهم ستة ملايين مغترب منعهم ظلمك أن يدلوا بأصواتهم في الانتخابات الأخيرة خشية أن يكون الوعي قد أصابهم، والخوف من زائر الفجر قد زال عنهم في الغربة.<br />الرسالة التي أستطيع أن أختصر لك فيها ربع قرن من حكمك ا<br />اقرأ بقية التعليق .."
archived = "2006-09-26"
capture_url = "https://web.archive.org/web/20060926225428/http://masr.20at.com:80/article.php?sid=346&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
