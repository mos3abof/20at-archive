[[comments]]
order = 6
subject = "ونجحوا .. و وصلوا للي عايزينه"
author = "واحدة اسكندرانية"
posted = "2006-04-18"
text = "مهما قلت مش حقدر اوصفلكم الحالة اللي كنا عايينها<br />عارفين ساعتها افتكرت ايه.؟<br />افتكرت المقال بتاع (احنا في تل ابيب)<br />مش ممكن دي تكون مصر<br />لما تحس انك مش قادر تروح بيتك لما تشوف اتنين كانوا امبارح صحاب والنهاردة بيضربوا في بعض لما تفتح بابك ولاول مرة تلاقي جارك مش عارف يبتسم في وشك<br />ساعتها عرفت انهم نجحوا ..<br />هما مين ..<br />معروفين طبعا..<br />نجحوا في ايه؟؟<br />نجحوا في انهم يفرقوا ما بينا<br />طبعا بينفدوا مبدأ \"فرق تسد\"<br />المشكلة مش في الحداثة اللي حصلت<br />المشكلة الأخطر هي ان في يد خفية غرضها كله انها تستغل اي حاجة علشان تولع الموضوع<br />على فكرة عايزة اقول شوية حاجات من واحدة عاشت قلب الاحداث<br />المظاهرة اللي طلعت يوم جنازة المتوفي لم تكن لها علاقة بالجنازة بدليل ان اهله لم يسيروا فيها<br />ان من طلع على هذه المظاهرة ليسوا الأ مجموعة من البلطجية (اللي بيكونوا مسلمين وقت اللزوم ومسحيين وقت اللزوم وممكن يكونوا ملحدين وقت اللزوم)<br />اما غرضهم وهدفهم فهوا<br />اما مصالح خصية مثل السرقة والنهب وسط المظاهرة<br />او يكونوا مأجورين لغرض غير شخصي وهو تنفيذ خطة الايدي الخفية في اشعال وتوليع الفتنة بين الناس<br />وكانت النتيجة 30 مصاب 2 متوفى وتدمير وتخريب محلات كثيرة وسيارات اكثر<br />ملحوطة<br />اخطر ما في الموضوع انهم نجحوا في ان يشعلوها ...والله اعلم متى وكيف سوف تطفأ<br />وأخيرا ادعوا الله الا أرى ما حدث مرة اخرى<br />لانه احساس بشع<br />ادعوا كل مصري أن يكون بعيد النظر وان يفكر معي ويبحث عن صاحب \"الايدي الخفية\" الذي يسقينا سم العداوة والفتنة دون ان ندري<br />فتاة أسكندرانية رأت الخراب بعينيها"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423183024/http://masr.20at.com:80/article.php?sid=175"

[[comments]]
order = 7
subject = "كلمتين وبس"
author = "مجرد مواطن"
posted = "2006-04-20"
text = "ماذا يحدث لو...؟<br />- دخل الطفل مدرسه حكوميه وتعلم علم بحق وحقيقي بدون دروس خصوصيه تقضم ظهر اللي خلفوه؟<br />- وجد هذا الشاب مكان له بدون واسطه في الكليه التي يرغب في الدراسه فيها؟<br />- وجد وظيفه بون واسطه ايضاً تغنيه عن مد أيديه ورجليه من أجل لقمه العيش ؟<br />- وجد بنت الحلال اللي تقبل تبتدي معاه المشوار ؟<br />- عاش في مجتمع يحترم أدميته وأنسانيته وعقيدته ؟<br />أقولكم ماذا سوف يحدث ؟<br />سوف يكتشف انه حق ليس في مجرد الأكل والشرب والعلاج فقط .<br />بل له حق في تولي أمور نفسه والتطلع إلي فووق قووووووووووووق !!!!!!!<br />يعني هيشبع ويبتدي يدور علي الحق المسلوب وهيبتدي يسأل ليه ده يحكم وده لأ ؟<br />وعلي رأي المثل إن إرتاح العسكري تعب الضابط وإن تعب العسكري إرتاح الضابط!!!!<br />وطبعاً عمر ما الضابط هيخلي العسكري يرتاح<br />أعذروني الواضح إن الواحد بدء يهلوس<br />لكن اكيد فهمتم عايز اقول ايه !!!!<br />لكن الخوف ان العسكري يتمرد ليس علي الضابط لكن علي العساكر اللي زيه وينزلوا تقطيع وضرب في نفسهم.<br />طبعاً ده مني الضابط اللي هيزداد راحه<br />مش كده ولا آيه علي رأي عمنا فؤاد المهنس"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423183024/http://masr.20at.com:80/article.php?sid=175"

