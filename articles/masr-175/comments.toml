[[comments]]
order = 2
subject = "ارحمونا من ام التخاريف دى !!"
author = "الشمحطجى"
posted = "2006-04-17"
text = "هو خلاص مبقاش ورا الموقع غير الدكتور احمد عبدالله كل شويا تاخدو برأيه الى فى رأئى مخرجش عن الى الحكومة بتعمله كل فتره من احضان وهتاف حواليين الوحدة الوطنية وإلخ إلخ ...من الآخر كلام بايت ورحته طلعت ...حِمض يعنى !<br />الموضوع اكبر من كلام ابو ضحكه جنان دكتور احمدعبدالله المشكلة مشكلة بلد منهوش منهوب مطحون بقوانيين طوارئ الناس ادمنتها خلاص يعنى من الآخر المصريين محتاجين تأهيل نفسى يرجعَلهم انسانيتهم الى اداست بالجزم الميرى والكبت الى طابق على انفاس المصريين مش هيحله لامؤخزة اننا نقعد ندعى مع بعض وناكل مع بعض ونتفسح مع بعض ونصلى مع بعض ...المشكلة مش بين فريقيين متناحريين المشكلة مشكلة فريقيين متبهدليين ...<br />يا راجل دى شروط بنا الجوامع اصعب من شروط بنا المسجد وعلشان الواحد يعمل حزب بيطلعو عين امه ...وأبوه ...وإخواته كمان !!<br />وخد عندك الصحفيين الى حالهم يصعب على الكافر ولا القضاة الى النظام الوسخ خلاهم يضربو فى بعض وابتدى فى خطوات مذبحة جديدة ليهم هتكون افظع من مذبحة عبدالناصر ...على الاقل عبدالناصر كان راجل واتخذ قرارات فصل القضاة بنفسه انما النظام الحالى نظام جبان ..وسخ..خلا القضاة يحكمو بعض ويحققو مع بعض ويضربو بعض وعملها فتنة ...<br />الناس مطحونة يا عالم والنظام بيستغل الاحداث دى لصالحه بأسلوب خبيث وبيلعب بالبلد الكورة...<br />فالازمة ازمة بلد خربان وعششت فيه البوم والغربان والخفافيش وإلى بيطول حاجة يخدها بيخدهاوبقت زى واحد طلع اتوبيس كله نشاليين ...اتسرق حتى الاندر وير نتشوه منه ونزل من الاتوبيس بلبوص كما ولدته امه !!!<br />ولا زى بت زى القمر ركبت الاتوبيس بس كان ملايان شباب مصريين زيى وزيك مش لاقين الدردى علشان يتجوزو فعملو ايه ؟!...لامؤخزة !"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423183024/http://masr.20at.com:80/article.php?sid=175"

[[comments]]
order = 3
subject = "كيفية التواصل"
author = "ولاد البلد"
posted = "2006-04-17"
text = "الأزمة الأخيرة ليها حلول كثيرة.. آخرها بالتأكيد هو إفطار الوحدة الوطنية\"..<br />رغم أن عويس عامل البوفية لم يحصل على شهادته الجامعية، ولا هو متابع للشأن السياسي، ولا ينتمي طبعا لأي من الجماعات الإرهابية.. لكنه أشار لحل الأزمة دون أن يدري...<br />عويس يقول أن حلول الأزمة كثيرة، لكن الشرط الوحيد هي ألا تكون تقليدية.. وهو ما نراه نحن أيضا في ولاد البلد..<br />اجتماعات متواصلة منذ أزمة أحداث الإسكندرية، نحاول أن نبحث لأنفسنا عن دور في حلها، وأخيرا كان الدكتور أحمد عبد الله الطبيب النفسي الشهير والذي استضفناه في أحد اجتماعاتنا هو صاحب التوليفة التي نطرحها عليكم الآن..<br />رب.. العالمين<br />ولماذا لا نصلي معهم..<br />الصلاة.. لدينا ولديهم.. لدينا جميعا لها معنى واحد.. نحن بين يدي الله.. ولا يصح أن تقف بين يدي ربك وأنت خائف.. فلنطمئنهم!<br />ندعوكم لأن نذهب جميعا إلى الإسكندرية من الثلاثاء إلى الأحد، للكنائس التي شهدت الاعتداءات.. نصلي معهم.. نهنئهم بعيدهم.. نهاديهم.. ونبتسم في وجوههم.. وما أجمل البسمة في وجه المجروح.. وهم بلا شك مجروحين.. حتى ولو كان الحادث فردي.. وحتى ولو كان مختل عقليا..<br />فلنصلي معهم.. نشعرهم أن مصر يمكن أن تحتملنا جميعا.. وهذه حقيقة.. فالبلد التي احتملت أزمات أخطر وكوارث أبشع.. يمكنها أن تتغلب على حادث فعله مختل عقليا.. كما وصفته الحكومة..<br />نصلي معهم.. لنشعر أن المشكلة تعنينا وأن الحل بأيدينا.. وأن إفطار الوحدة الوطنية لم يفرز إلا عناوين صحفية براقة.. وصور جميلة للإخوة المفطرين في الإفطار العظيم..<br />دعوة عامة من \"ولاد البلد\".. لكل الناشطين في مصر.. ليفعلوا ما تحتاجه الأزمة منهم..<br />إن الذكرى .. تنفع \"المؤمنين\"..<br />الأزمة خطيرة..<br />- لأنك لا تتصور نفسك خارجا من المسجد،<br />اقرأ بقية التعليق .."
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423183024/http://masr.20at.com:80/article.php?sid=175"

