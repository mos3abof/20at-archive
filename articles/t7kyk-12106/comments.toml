text = "حسبنا الله و نعم الوكيل هذا البلد ينهب من دقيقة لدقيقة و تبني القصور وفي الاخر يقولوا هم لازم ياكلو عيش ؟ماياكلو جاتوه او كرواسون بلاش …ياكلو ساليزون الحلول كتير بس الشعب ده مش عايز يتطور"
