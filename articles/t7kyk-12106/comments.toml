author = "اسماعيل ابو سروة"
posted = "2009-05-18"
text = "شكر واجب<br />شكر واجب لرئيس دولة الامارات العربية المتحدة اطال اللة فى عمرة لتبرعة بمبلغ لبناء مساكن بديلة لمساكن حى زينهم تم البناء لهم بنصف المبلغ وتم سرقة النصف الاخر بواسطة حكومة الحرامية<br />والدولة لم تدفع قرشا واحدا فى بناء مساكن لسكان حى زينهم<br />مرة اخرى شكرا لرئيس دولة الامارات العربية ورحمة اللة على الشيخ زايد ابن نهيان على فعلة الطيب الذى سيكتب فى ميزان حسناتة"
archived = "2009-05-25"
capture_url = "https://web.archive.org/web/20090525055310/http://www.20at.com:80/t7kyk/12106-2009-05-18-11-09-34.html"

