posted = "2009-05-26"
text = "انا واحد من مستحقى الشقق بزنيهم وبالفعل كل الكلام مظبوض واكتر كمان ومش عرفين اية الى حيحصل حناخد الشقق ولا حناحد اية بالظبط وتروح المحافظة للسوال عن اى شى لاتجد من يرد عليك وكثرات الاقاويل ادفع 15 الف واستلم وهذة حقيق ونحن السكان جميعا نناشد السيدة الفاضلة سوزان مبارك ان تتدخل بسرعة قبل ان تباع الشقق بالرشاوى والسيد المحافظ لضمان حقوق المستحقيق ونسال لماذا كل هذة المماطلة فى تسليم الشقق مع انها جاهزة وشكرا"
