subject = "الحلم الأخضر"
author = "واحد كان عنده حلم"
posted = "2006-03-26"
text = "الموضوع رائع ب طريقه وحشه ن لأنه حسسنى بالهنا اللى انا فيه،وبما انى فى كليه زراعه والمفروض مقلقش على مستقبلى الأخضر المزرع ، ولو انى مش عارف هشتغ إيه لكن لو ملأتش شغل هشتغل نخله....."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210427/http://masr.20at.com:80/article.php?sid=74&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "كان يا ما كان ..."
author = "هووووووبه او هبهوب"
posted = "2006-03-26"
text = "احلام بضفاير قلب وبس<br />يا ارض الخوف يا لامنا امانه تسيبي جونا<br />والله احبطتوني<br />بس برده بحبكو<br />غتته اصلي<br />\"تاني تعليق واو\""
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210427/http://masr.20at.com:80/article.php?sid=74&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

