[[comments]]
order = 3
subject = "حاسيب في واحد منسي"
author = "عبدالله مفتاح"
posted = "2006-03-26"
text = "الاخ اللي فوق نسي ان ليها زميل رابع في اقتصاد وعلوم سياسيه ما علينا كل زمايلها ولاد انت مالك تدخل ليه؟ مش موضوعنا<br />متهياليان انا امنيتي<br />اول حاجه اشتغل في وظيفه كويسه عشان اقدر اولا اجوز ثانيا احضر ماجستير ودكتوراه<br />ثانياعايز اجوز بنت شيخه لاني عايز ابقى ولد حلو وبسمع الكلام<br />ثالثا عايز تنحدر مني سلاله زي اللي عمنا نيتشه قال عنها<br />رابعا ودي الاهم نفسي لما اتكلم الناس كلها تكون عايزة تسمعني<br />وبس"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210427/http://masr.20at.com:80/article.php?sid=74&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
