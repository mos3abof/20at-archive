[[comments]]
order = 8
subject = "بنت ناس"
author = "سؤال بسيط الى الفتاة المكتئبة .."
posted = "2006-04-01"
text = "واحنا مال اهلنا؟؟<br />حد قالك ان ده موقع ابراهيم مطاوع \"الله يرحمه\" ؟؟<br />الموضوع يا هالة حلو اوى .. فكرته لطيفة ومعالجته بنت ناس .. اتمنى اقرالك تاني"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210427/http://masr.20at.com:80/article.php?sid=74&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 9
subject = "الى عبد الله مفتاح"
author = "نيفين"
posted = "2006-04-02"
text = "يا عبد الله انا بعتللك ايميل بخصوص موضوع الاخوان×وحيد حامد و اسفه على التاخير ف الرد<br />و نصيحه بلاش حكايه المجستير دى نصيحه من اختك<br />انا بادئه ف المجستير و حاسه ان عقلى هيطير قريب<br />اه يا هبه<br />و اه من بكره و عمايله<br />واه م اللى الزمن شايله<br />و اه من حلم عالى لفوووووووووووووووووق<br />و لسه الكف مش طايله<br />بتفكرينى بساره ليه يا هبه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210427/http://masr.20at.com:80/article.php?sid=74&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

