text = "نسيتوا طلع في زميل كمان في كليه طب بيطري ربنا يزيد ويبارك ويا رب يكون في زميله يا رب بنت كل دول ولاد؟"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210427/http://masr.20at.com:80/article.php?sid=74&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

