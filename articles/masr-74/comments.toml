[[comments]]
order = 6
subject = "فتاة مكتئبة"
author = "شيماء"
posted = "2006-03-30"
text = "انا فتاة اسكن في المغرب وعمري15 سنة وانا مكتئبة جدا من كل من هم من حولي واحس بفراغ كبير بيني وبين اسرتي لم اعد احس بطعم الحياة معهم ولايريدون التكام معي وهدا كاه بسببي لانهم عرفو بقصتي انا وشاب انا احبه كتيرا وهو كدالك لقد هربة من منزلي ودهبت اليه وقبل ان ادهب اتصلت به وحددة معه المكان وبعد وصولي وجدت والدي بانتظاري هناك لقد كان متفقا معهم حتى يجدوني و يجلبونني الى المنزل حيث لم يحدثوني مند دلك الحين الى يومنا هدا. اريد حلا"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210427/http://masr.20at.com:80/article.php?sid=74&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

