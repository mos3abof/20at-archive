subject = "عصوم"
author = "عصام"
posted = "2006-07-06"
text = "تعرفو الموضوع دة فكرنى بنكتة واحد صحبى<br />مرة واحد زعيم \"أوحد\" بيخطب ، قام واحد رفع إيده و قال : يا ريس أنا عايز أبقى ريس زيك .............<br />الزعيم إتنرفز جدا و قال له: إنت حمار ياله؟؟؟؟<br />الراجل قاله : ليه يا ريس، هو شرط ؟؟؟<br />عصام<br />واحدعايش فى القاهرة<br />essam_ahmed_844@hotmail.com"
