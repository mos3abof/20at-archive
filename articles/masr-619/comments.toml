[[comments]]
order = 1
subject = "الحساب يوم الحساب"
author = "عابر القارات"
posted = "2006-07-07"
text = "طبعا انا بعتبر الموضوع ده نكته و ده لأن إستحالة فى بلد زى بلدنا حد يفكر انه يحاسب الريس لسبب بسيط جدا ان فى الدول المتخلفة و النايمة اللى زى حالتنا و اللى بينظرلنا العالم كله على اننا فاضلنا يدوبك ستمايه سنين و نبيقى حمير لما بتتكلم عن الريس كأنك بتتكلم عن إله طبعا حاشا لله ان نحاسب إله فاإله لكن أن يحاسب و لا يحاسبه أحد و من يوم أن قالها الهالك فرعون \"أنا ربكم الاعلى\" الى يومنا هذا (لا يقولها حكامنا الان و لكن يفعلوها) يتعامل حكامنا مع شعوبهم المستعبدة بنفس المنطق و لكن عزاءنا الوحيد أنه إنه قالوها او فعلوها فى الدنيا فلن يملكوا لانفسهم شيئا أمام الإله الحق ملك السموات و الارض و ما بينهن فيومها (و إن كانوا فى غفلة من هذا اليوم) سيؤتى بهم و \"إقرأ كتابك كفى بنفسك اليوم عليك حسيبا\" و طبعا جهنم ما فيهاش سويسرا علشان يهربوا فيها فلوسهم اللى كنزوها من قوت و دم الشعوب المستكينه"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124935/http://masr.20at.com:80/article.php?sid=619"

