[[comments]]
order = 3
subject = "آه ياشعب من حجر"
author = "مصباح"
posted = "2006-07-08"
text = "المليارات المتلتلة على قلوب حلاليف المنوفية ونسايب وحبايب حلاليف المنوفية دي للأمانة مش من مخترعات حسنية وحدها. الكلب السادات هو اللي إستن سنة الغش ورعاه حتى أثمر.<br />أمال فاكرين بلد تعدادها سبعين مليون يدوب ويكون عليها ديون خارجية أكثر من 800مليار دولار إزاي؟ ومفيش ياحسرة حاجة إتبنت ولا صناعة كانت موجودة إتطورت، ولا جيش كبير وأسلحة ثقيلة، اللهم إلا الأمن المركزي!<br />لو إسرائيل اليوم تفكر تحتل مصر، والله ما ناخد معاها ربع غلوة، وده حيحصل عاجلا أو آجلا، قواتهم كده كده موجودة في سيناء لابسه زي الطوارئ الدولية، وبسلاحنا الخردة اللي بنشتريه من ماما أمريكا بأغلى سعر تغلبنا حتى بوكينا فاسو، وقتها تتمنوا لو حد نشر بنود إتفاقية كامب ديفيد السرية.<br />ياعم إنته وهي وهو مصر باعها السادات وقبض من زمان، والمعرص اللي بعد نازل سمسرة على باقى البلاد العربية، ليبيا إتباعت والسودان والعراق وإبن الوسخة بيحاول لسه يبيع فلسطين للمرة المليون، مش مكفيه اللي كنزه ونهبه.<br />لااله إلا الله راح أكلم حيطان؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124935/http://masr.20at.com:80/article.php?sid=619"
