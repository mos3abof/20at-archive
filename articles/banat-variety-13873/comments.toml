text = "انا برضو مش مقتنعه يعني ازاي احكم علي حد وانا مش اعرفه<br />الحاجات ديه بتييجي بالتعامل وبعد لما نكون حبينا بعض وخلاص<br />بعدين الواحد يكتشف ان اللي ادامه شخص تاني اصلا"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135301/http://www.20at.com:80/banat/variety/13873-2009-10-31-10-34-37.html"

