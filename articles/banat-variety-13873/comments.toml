text = "اكي طبعا قبل ماتعرف ع شخص او اعجبة بية اكيد شخصيتو واسلوبة عجبنى عشان كدة بدات علاقتنا لكن الاسف بيحصل وانة بيتغير انا اعرف منين ولو التشبية بالعربية ممن اشتريها النهاردة وتخرب بعد شهر سنة ومهما صلحتهامش هترجع زى الاول"
archived = "2010-01-06"
