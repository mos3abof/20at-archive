posted = "2009-12-21"
text = "الكلام ده مش مقنع على فكره معلش يعنى<br />ماهو كده بيكون الانسان اتعلق بالشخص التانى و بيبقى حصل اللى حصل , انا مش هقدر اعرف مواصفات الا لما اتعامل مع الشخص و اقرب منه<br />الانسان مش عربيه زى مابتقولوا<br />الكلام ده غلط خاااالص"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135301/http://www.20at.com:80/banat/variety/13873-2009-10-31-10-34-37.html"

