subject = ""
author = "Soaad"
posted = "2009-12-26"
text = "اختيار العربية غير اختيار الشخص<br />العربية مش هيبقى فيها حاجة مختفية لكن الانسان غصب عنه بيبقى فى حاجات مختفية بتظهر فى وقتها<br />يعنى انا اتخطبت سنة وحبيت خطيبى جدا وهو كمان حبنى جدا ومكناش نتصور فى لحظة اننا نبعد عن بعض وفى موقف ما اكتشفت انه حد ضعيف مع اول مشكلة بجد معرفش يحلها<br />بمعنى ان فى طباع او تصرفات معينة مش بتظهر طول الوقت"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135301/http://www.20at.com:80/banat/variety/13873-2009-10-31-10-34-37.html"

