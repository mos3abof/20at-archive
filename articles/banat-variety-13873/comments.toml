text = "وكيف تعرف عيوب او محاسن الانسان الذى اخترتة الا بعد التعامل معة واذا وقعت معة فى الحب واكتشفت انة غير مناسب ماذا تفعل وانت احببتة وعلقت علية كل امالك واحلامك وهو السبب لانة اظهر لك حب المزيف وبعد ذلك خانك فما هو الحل فى هذة المشكلة كيف تنساة وهو ظل جزء منك لفترة طويلة واصبح معك عادة لايمكن الاستغناء عنها"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135301/http://www.20at.com:80/banat/variety/13873-2009-10-31-10-34-37.html"

