archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191959/http://masr.20at.com:80/article.php?sid=292&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "الى (نور القمر)"
author = "بكره توتو"
posted = "2006-05-13"
text = "تصدقوا بالله انتوا شباب عايز ضربكم بالنار فعلا المثل الى بيقول حط الابره على فمها البت تطلع لامها اختشوا حرام عليكم عريتونا وخليتو راسنا فى الحضيد سؤال بس يامحترم ولا يامحترمه هو (توتو) احسن من اكتر من 24 الف معتقل فى السجون المصريه توتو ده ابن 5 واحنا ولاد 9 وربنا احنا اتجننا واتهبلنا خلاص احنا مصريين مصريين<br />عارفين يعنى ايه مصريين يعنى كلاب ولاد عاهرات موش بنيجى غير بضرب الجزمه<br />احترموا نفسيكم شويه<br />هههههههههه<br />احترام ايه انا بضحك على نفسى ئل احترام ئل اه بضحك على نفسى ؟<br />ماهو احنا مصريين<br />كلاب ولانسوا اى حاجه<br />على فكره توتو بيسلم عليكوا كلكم انا لسه خارج من السجن وقابلته هناك وقلى ابقا سلملى على جميع الفرافير الى هتقابلك<br />فرفور فرور اوعى تنسى<br />قلتله لا ياتوتو موش هنسى<br />خلى بالك من نفسك انتا ومتحملش هم جمهورك جمهورك عبيط واهبل موش هيسدقوا انك فى السجن تلاقيهم دلوقتى بيقولو<br />بييحيى حفله للمساجين الغلابه الى ممسكوين فى الحاجه الى بيسموها سياسه بتعمل خير بتتبرع لصالح الفرافرير الصغننين<br />اتفووووووووووووووووووووووووو<br />عليكوا شويه كلاب ولاتسوا<br />ماهو انتوا مصريين صح<br />tito_mm33@yahoo.com<br />افففففففففففففففف منكم انتوا يامصريين"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191959/http://masr.20at.com:80/article.php?sid=292&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "عيش اهبل"
author = "ياقوى"
posted = "2006-05-14"
text = "عيش اهبل تموت مستور<br />عيش عاقل تموت مقهور<br />احسبها وفكر واختار<br />وهادلك لو فكرك حار<br />دى نصايح سهله وبسيطة<br />تعملها تنفد بحياتك<br />تهملها تبقى ابن عبيطه<br />آخر حاجة اتعلمناها<br />كانت لسه امبارح العصر<br />كل حاجة ناوى تعملها<br />لازم تبقى فى حب مصر<br />زور وانهب واسرق واجرى<br />وابنى لك كام فيللا وقصر<br />واعمل زى توتو الأمور<br />زور شهادات جامعة وتجنيد<br />يمكن تبقى ف يوم دكتور<br />وان مسكوك حطوك فى حديد<br />ماتخافش وخليك صنديد<br />امسك مصحف قول ماحصلش<br />دا انا فنان لسه ما حصلش<br />وشوف لك كام عيل مسطول<br />يهتفوا باسمك كده على طول<br />ومتنساش البانجو بتاعهم<br />لو هيفوقوا هتضيعهم<br />تفرق ايه عن ايمن نور؟<br />ده سؤال اهبل له تفسير<br />غيرك ساله كتير وكتير<br />ايمن عاب فى الذات العليا<br />ف الباشا ابو قلب كبير<br />وف ابنه الله يحرسهوله<br />ويشرف مصر بمقداره<br />ماهو شىء برضه علينا كتير<br />خليك جزمه فى رجل سعادته<br />تكسب توصل تبقى امير<br />شفت ازاى يابو مخ تخين<br />انت هتبقى نجم ملعلع<br />والتانى ويا المساجين"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191959/http://masr.20at.com:80/article.php?sid=292&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "إذا كنت محترم مش هتقدر تغمد عينيك قرفاً و كمدا"
author = "هؤلاء الفتايات ( لا أعلم يقيناً هل هم كذللك) و الفتيان ( أشباة الرجال) عاشقي هذا المزور و أمثالة الذين صدعو رؤسنا بكلامهم التافه الذي يبعد الشباب عن القضية الرئيسية لبلدهم حتى و جدنا أنفسنا في زيل الأمم يكمنا أرذل البشر و أفسدهم فضربونا بالأحذية و سجنونا لأننا كنا نائمين مع المزور و أمثالة يحتل العراق و يبث تلفزيون المحروسة ليالي الصيف من مارينا و يستشهد الشيخ ياسين و يزيع وصلى رقص لفيفي عبدة ."
posted = "2006-05-14"
text = "هكذا يريدو أن يغيبو الشباب فيصبحو مثلهم الأعلى هؤلاء المغنيين المسخ المزوريين السؤال هنا هل فعلاً لو غاب كل هؤلاء من أمثال الرجال والمغنيات الراقصات هل يوحشونا أو يريحونا"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191959/http://masr.20at.com:80/article.php?sid=292&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "انتو اساسا ناس زباله"
author = "احمد"
posted = "2006-05-16"
text = "الى كاتب المقال دا انسان زباله لان تامر دا اشرف من مليون منكوا يا عالم ما بتفهمش والحمد لله اخد براءه علشان هو كان مظلوم من الاول<br />ولما قبل ما يحصل الى حصل كنتوا بتتهبلوا عليه ليه وكان حبيبكم بكره لما يطلع بالسلامه هيرد على كل كلب كتب كلمه عنه<br />اخر حاجه عاوز اثولها انتو عالم زبااااااله<br />والراجل يبقى يقول كلمه بعد كدا على تيمو"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191959/http://masr.20at.com:80/article.php?sid=292&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 11
subject = "للأخ اللي رد عليا فوووووق"
author = "نور القمر"
posted = "2006-05-19"
text = "رغم انه طريقتك بالكلام وحشه خالص ولازم تتكلم بأدب أكتر<br />هقولك إحنا مش بندافع عن أستاذ تامر عشانه مطرب لأ لأنه أخ وأب وصديق وكل حاجه بالنسبه للناس اللي بتحبه ولانه برئي ومظلوم واتخدع وما عملش حاجه غير أنه صدق راجل نصاب ومش ضروري حضرتك تصدق<br />انا رديت عليك عشان غلط بمصر كلها ويمكن انتا منها وعلى فكره انا مش مصريه بس بحب مصر وأهلها اللي أحسن منك<br />واحترم نفسك شويا"
