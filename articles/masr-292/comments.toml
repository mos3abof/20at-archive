[[comments]]
order = 5
subject = "الناس ديه بتفكر ازاى"
author = "مواطن شاب جاله الضغط"
posted = "2006-05-12"
text = "انا نفسي افهم الشباب و الشبابات الحيموتوا على تامر بيه حسنى يعنى تفكيرهم عامل ازاى ؟ ليه يعنى بيعملوا كده ؟ طيب هما مستفيدين ايه من كده ؟ كل ده عشان الاستاذ بيغنى و بيعمل اغانى حلوه ؟؟؟؟؟ بس كده معقوله للدرجه دى الشباب و وصلوا للمرحله ديه ان واحد عشان كل الفيها انه بيغنى وياريته مثلا راجل تاريخ زى منير و لا فؤاد و لا عمرو دياب لا ده لسه ابن امبارح كل العمله هما البومين و كام اغنيه الشباب تعمل كل ده و المصيبه انه غلطان و المصيبه الاكبر انهم بيدافعوا عنه و يقولولك طيب ما هيا جت على تامر ما في كتير هربوا من الجيش ؟؟؟؟ يعنى حتى الرد في منتهى الغباء تخيل حضرتك عسكرى ماسك 2 حراميه واحد جرى و التانى لسه في ايديه نقوله لا يا عسكرى حرام عليك مش تقبض على المعاك ده طالما ان صاحبه جرى ؟؟؟؟؟؟ أن لله و أن أله لا راجعون الدول التانيه او الدول البتفهم و المتقدمه بجد بتعمل الكلام ده مع زعيم وطنى أو راجل سياسي محنك أو رجل اقتصاد عايز يفيد بلده و احنا شبابنا بقوا بيعملوا المظاهرات عشان واحد بيغنى و ياريت مغنى معجزه ما جابتوش ولادة انما والله في غيره احسن منه ملييييييييون مره .<br />يلا عليه العوض في البلد و الناس بس برضه أرجع و أقول شعارى الدائم ( مسرها تروق و تحلو و كل حاجه ترجع لمكانها الطبيعى ) ."
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191959/http://masr.20at.com:80/article.php?sid=292&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
