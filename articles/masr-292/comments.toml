[[comments]]
order = 13
subject = "ربنا معااااااااااااااه"
author = "ندى"
posted = "2006-06-02"
text = "يا جماعة اللي عندو كلمة كويسة يقولها واللي معندوش ميتكلمش انا بس عايزة اقول ان الكلمة الطيبه صدقة وحرااااام تتهموا انسان مظلوم لأنكوا ماشوفتهوش وهوا بيزور واحنامتأكدين من اللي احنا بنقوله ومتأكدين ان الانسان اللي بندافع عنه ده محترم جدا و مظلووووم و الادلة كلها في صالحه و غير كده الصحفي او الاعضاء اللي كاتبيين كلمة مش كويسة مينسوش ان تامر حسني ده مصري وانتوا لما بتكتبوا عنه كده بتسوقوا سمعته قدام العالم كله و تامر ده ابن بلدكوا ولو مش احنا االي حنحافظ ونحمي بعضنا محدش هيدور علينا .على العموم تامر مطلبش من اي حد منكوا اي حاجة تامر معاه ربنا هو القادر على كل حاجة. ربنا معاك يا تامر."
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191959/http://masr.20at.com:80/article.php?sid=292&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

