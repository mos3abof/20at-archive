[[comments]]
order = 24
subject = "معارضة"
author = "مش مهم"
posted = "2006-08-28"
text = "اسمحلي يااخ حمدي اقلك انك معندكش شغل تعملو انت حقود على تامر وانت من النوع الي بيستغل مشكلة شخص عشان يبين انو كاتب رائع اسمحلي اقلك انك مهما قلت عن تامر مش حنصدقك انا وصديقاتي وكل الشباب الي بيحبو تامر تامر اتزلم ومفيش كلام تاني وانت ياسي حمدي لزمك تتربى على كلامك."
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191959/http://masr.20at.com:80/article.php?sid=292&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 25
subject = "معارضة"
author = "مش مهم"
posted = "2006-08-28"
text = "حسبي الله ونعم الوكيل من الصحافة البيضة.وبعدين انتو يالو بتحبو تامر ازاي تقولو مقال رائع فين الروعة ديه حرام عليكو كفاية انو اتزلم واتحبس وبتقولو بتحبوه ازاي والله العضيم ياناس وياحج حمدي تامر اتززلم والسبب رجل اعمال مشهور قال لتامر يغني في فرح بنتو وتامر رفض وياحج حمدي المزو اعترف بكل حاجة روح اكتب على المجرمين مش المضلومين .وياريت تحسن الفاضك لما تكتب عن فنان او عن حد لان اسلوبك مش اخلاق كاتب.باي ياااا سي الحج حمدي"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191959/http://masr.20at.com:80/article.php?sid=292&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

