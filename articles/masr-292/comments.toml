text = "والله انا شايفه انك حاقد عليه علشان وصل لقلوب الناس وانت لا عموما ياريتك تعمل حمله صحفيه للكشف عن اولاد كل الوزراء والمسؤلين هي البلد هل كلهم دخلوا الجيش ولو كانوا هل دخوهم الجيش عمل اىه للبلد؟يا استاذ تامر حسني غلطان لكنة غلط لان قانون اصم كان هايمنعه من تحقيق حلمه و لان القانون لا يطبق على الكل ."
archived = "2006-09-11"
