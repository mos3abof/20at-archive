[[comments]]
order = 2
subject = "واللة عندك حق"
author = "المصرى الاصيل"
posted = "2006-05-09"
text = "منتهى البجاحة لما حد يتعاطف مع التوتو لية ؟<br />علشان احنا ولاد البطة السوداء رحنا الجيش علشان نتعلم ندافع ازاى عن البلد انما التوتوهات كفاية عليهم اوى يظهروا فى كل المناسبات الوطنية وبدل لما كان احتفال اكتوبر مناسبة لاظهار رجالتنا فى القوات المسحلة بقوا بتوع هشك بشك بيحيوة<br />ماهوا فرح والتوتو صدق نفسة وافتكر ان بيدافع<br />ماهوا كلة دفاع بس عن اييييية ؟<br />مبروك السجن وعقبال كبار البلد المزوريين"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191959/http://masr.20at.com:80/article.php?sid=292&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
