text = "انتي وحشتني يا تامر وحسبني الله ونعم الوكيل في الي دبر ليك هذه القصه علي الفاضي هو ناسي ان جمهورك بيحبك ومش هيقدر هيستغني عنك ابدأ مهما تقدر انا بحبك اوي يا تامر وربنا يبعد عنك شر عبيدك انا بمووووووووووووووت فيك يارب تيجي بورسعيد وتفتح فيلمك الجديد وانت بخير لان انا بجد نفسي اشوفك انا من بورسعيد وياريت تيجي بورسعيد بحبااااااااااااااااااااااااااك يا تامر<br />خلود"
