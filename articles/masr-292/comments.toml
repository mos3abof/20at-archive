author = "كنزى"
posted = "2006-07-25"
text = "واحشنى اوووووووووووووووى يا روحى والله انا حاسة ان قلبى معاك وانا نفسى اجيلك واشوفك واطمن عليك بس مش هاين عليا اشوفك فى الحالة دى والله انا بكتبلك وانا دموعى على خدى واطمن انا الحمد لله فاكراك على طول وبدعيلك عند كل صلاة واحشنننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننى<br />يا روحى"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191959/http://masr.20at.com:80/article.php?sid=292&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 21
subject = "لا حول ولا قوة الا بالله"
author = "مروة"
posted = "2006-08-03"
text = "السلام عليكم ورحمة الله وبركاتة<br />طبعا المقال جميل لانه بيفوق ناس كتير من الى بيعجبوا بالمطربين وبيجروا وراهم<br />بس انا لما قرأت التعليقات زعلت جدا لان معظم التعليقات فيها سخرية وبيوصل البعض منها للسب سواء مع تامر او ضد تامر<br />انا مش بسمع اغانى لكن اعرف تامر واعرف قصته انا رأيى انه انسان مسلم وواجب على علينا كمسلمين اننا ننصحة والى فى ايدينا اننا ندعيله بالهدايه من كل الى بيعمله من اغانى وافلام وهكذا ولعل الازمه الى هو فيها يفوق من غفلته ويتذكر ربنا<br />طبعا الناس الى بتدافع عن تامر بحرقة غريبه مشعرفه ليه انا مش شايفة انه عمل حاجة تفيد دينه او بلدة علشان ندافعله اوى كدة<br />ورربنا يهدينى ويهدينا جميعا الى ما يحب ويرضى<br />وربنا ينصر الاسلام والمسلمين فى كل مكان فى فلسطين ولبنان والعراق<br />ويستر عوراتنا وعورات المسلمات<br />وجزاكم الله خيرا"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911191959/http://masr.20at.com:80/article.php?sid=292&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

