text = "فى الصفحة الاولى اخبار بسلامتة<br />فى الصفحة التالتة اخبار ابن بسلامتة<br />فى الصفحة الخامسة اخبار زوجة بسلامتة<br />يبقى فاضل صفحة الرياضة والوفيات وممكن تقرا رياضة او وفيات"
