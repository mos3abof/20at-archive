author = "صفحة لا تكذب ابدا"
posted = "2009-12-07"
text = "صفحة الوفيات<br />مفيش فيها كذب ولا تلفيق ولا رؤساء التحرير الكذابون والمنافقون<br />وعقبال اللى فى بالى لما اقرا خبرة"
