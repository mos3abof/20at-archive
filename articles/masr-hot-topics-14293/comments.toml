[[comments]]
order = 1
subject = ""
author = "الى المعلق رقم 1"
posted = "2009-12-07"
text = "احيك<br />المعلق رقم 3<br />بلاش هبل وعبط اخوك اتقتل يا بابا المفروض يكون فيه قضية ضد القاتل<br />حتى لو قتل في الجزائر<br />لا مصر فوضى ولا الجزائر فوضى ولا امريكا فوضى<br />لما واحد بيتقتل في اي بلد في العالم يبقى لازم في جثه وطالما فيه جثه يبقى لازم الشرطة والنيابة ينتقلون الى مكان الحادث ويتفتح ملف قضية ويقبض على القاتل لتقديمه الى المحاكمة<br />بطل هبل يا ابني وروح شفلك شغلانه احسن من القعده ادام النت طول النهار"
archived = "2009-12-09"
capture_url = "https://web.archive.org/web/20091209010312/http://www.20at.com:80/masr/hot-topics/14293-2009-12-07-14-53-36.html"

[[comments]]
