author = "محمد حسنين هيكل"
posted = "2009-12-07"
text = "انا كنت من قراء الكاتب محمد حسنين هيكل منذ الطفولة وكنت اسير مسافة 3 كيلومترات الى المدينة القريبة لشراء جريدة الاهرام يوم الجمعة لاقرا مقالة بصراحة<br />الان توقفت من زمان عن شراء اى جرنان<br />الاحظ بعض الاشباب من العائلة يشترون الاهرام للبحث عن وظائف خالية"
archived = "2009-12-09"
capture_url = "https://web.archive.org/web/20091209010312/http://www.20at.com:80/masr/hot-topics/14293-2009-12-07-14-53-36.html"

