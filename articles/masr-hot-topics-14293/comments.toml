posted = "2009-12-21"
text = "اقتباس صفحة لا تكذب ابدا:<br />صفحة الوفيات<br />مفيش فيها كذب ولا تلفيق ولا رؤساء التحرير الكذابون والمنافقون<br />وعقبال اللى فى بالى لما اقرا خبرة<br />و لا يهمك يا سيدى؟<br />الموضوع كان هو توارد خواطر؟!!!<br />سوف أقرأ الصفحة الاولى لعل و عسى أرى بالبنط العريض خبر أقالة أحمد باشا نظيف جدا جدا جدا؟"
archived = "2010-01-15"
