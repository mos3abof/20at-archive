text = "ده ايه الأفيون ده ؟<br />زي ما تقول لواحد جعان, تخيل انك شبعان, طب اشغل وقتك عشان متحسش بالجوع, طب خد منوم كل ما تجوع, طب اشرب كوبايتين مية علشان تملا معدتك<br />العاطفة حاجة إنسانية أساسية جداً, يعني لو قلنا الجنس ممكن يبقاله بديل في حياة مفتعلة (و المشار إليها ب\"- فكر دائما في الحرية التي تستمتع بها، تفعل ما تحب وقتما تريد، أنت رقيب نفسك.\") فالعاطفة الحقيقية مش ممكن افتعالها, طبعاً مش لازم بجواز رسمي (ورقة و مأذون و اعتراف الدولة), بس بجواز بمعنى إن يكون لك شريكة في الحياة"
