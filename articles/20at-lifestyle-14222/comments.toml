text = "في البداية احب احيي كاتب المقال على مقاله الأكثر من رائع ده،<br />واحب أشير للجملة اللي عجبتني اوي اوي \"ولأن تكاليف الزواج مرتفعة فقد تُفرض عليهم العزوبية بالإكراه ، لذلك عليك أن تستمتع بها إلي أن يشاء الله\".<br />باختصار انا شاب عمري 23 سنة، متخرج من كلية اعلام منذ 3 سنوات، ولحد يومنا هذا ماشتغلتش ومش لاقي شغل، أي نعم الواحد اشتغل كام شغلانة عالماشي بس شغلانات متأكلش عيش وكنت بسيبها بعد وقت قصير باختصار لانها شغلانات متخلفة وعقيمة…<br />طب تعالوا كده نفكر مع بعض، لما الشاب بيتخرج بعد المعاناة دي ومصاريف وتعب ومذاكرة واجتهاد وتدريب في الصيف ومعارف وكوسة ووسايط وبرضو مش لاقيين شغل !!!!!!!!!!<br />تفتكروا ازاي هيكون الحال لما تيجي تفكر في الجواز وانت اصلا مش قادر تصرف على نفسك ؟؟ ويا ترى انت ضاع منك 3 سنين بعد التخرج ومدخلش جيبك ولا مليم او كل اللي كنت بتاخده مكانش يكفي انك تركب بيه مواصلات… يا ترى محتاج كام سنة كمان عشان تقدر تقف على رجليك عشان تجيب شقة ومهر وشبكة والذي منه ومش بس كده كمان… يا ترى هتقدر انك تكمل أد ايه بعد الجواز من غير ما تضطر تقترض او تستلف او تداين او تشحت ؟؟؟؟؟!!!!!!"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106130032/http://20at.com:80/20at/lifestyle/14222-2009-12-02-14-08-42.html"

[[comments]]
order = 72
subject = ""
author = "كريم"
posted = "2009-12-26"
text = "الموضوع وما فيه يا حضرات، مش موضوع شباب معرض او مضرب عن الزواج بإرادته، لاااااااااااااا اااااااا الموضوع اتعدى المرحلة دي من بدري…الموضوع دلوقتي بأة بيدور حوالين انك امتى تقدر تفكر في الجواز، مش امتى تفكر في الجواز ؟؟؟؟ هناك فرق…<br />دلوقتي اللي بيتجوز في الزمن ده انا بعتبره بطل، بطل ولازم يتبني له تمثال كمان في ميدان عام، أي نعم مش كل الناس معهاش فلوس ومش قادر تتجوز بس الغالبية العظمى بأت كده، وبأة نادر اوي اللي يبقى معاه فلوس ومش عايز يتجوز عشان يريح دماغه او لغاية ما يلاقي بنت الحلال اللي تفهمه ويفهمها…<br />تفتكروا يا جماعة، لو واحد لاقى شغل بمرتب محترم وقدر يكون نفسه في وقت قياسي \"10 سنين عالأقل\" تفتكروا هل يضمن انه بعد ما يتجوز متحصلش كارثة تضيع كل اللي بناه ؟؟؟ ادينا شايفين وبنسمع كل يوم عن الشركات اللي بتقفل وبتفلس والعمالة اللي بتتسرح وبتسيب وظايفها مرغمة، تفتكروا في حد ضامن انه بعد الجواز متضيعش منه وظيفته بعد لما يكون جاب عيال وفي رقبته كوم لحم لازم مع كل طلعة نهار يكون في فلوس عشان يأكلهم وإلا هيموتوا من الجوع !!!!!!! اعتقد دي مجازفة صعبة اوي ومحدش أدها…"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106130032/http://20at.com:80/20at/lifestyle/14222-2009-12-02-14-08-42.html"

[[comments]]
order = 73
subject = ""
author = "كريم"
posted = "2009-12-26"
text = "عشان كده انا شايف فعلا ان احسن حل ان الشباب يبدأ يفكر في الأفكار العملية بتاعتك دي ومينتظرش انه يدور على جواز عشان ميلاقيش وبعد كده يبتدي يطبقها ويتعب،<br />انا بنصح كل شاب انه يبدأ في تطبيق الخطوات والنصايح الغالية دي من وقت دخوله الكلية \"بدري بدري يعني\" عشان بعد ما يتخرج يكون مأقلم نفسه و\"مسستم\" نفسه عالوضع اللي هيواجهه، انا طبعا بتمنى الخير لكل الناس ونفسي اشوف كل الناس متجوزة وسعيدة بس هو ده الواقع اللي مش قادرين نهرب منه فبدل ما نهرب منه بالخمرة والنسوان والمخدرات، ياريت نهرب منه بالطرق العلمية السليمة دي…<br />انا فعلا كنت بطبق جزء كبير من نصايحك بس منكرش انك افدتني بأفكار جديدة مكنتش واخد بالي منها عشان كده انا بشكرك شكراً جزيلاً…<br />وانا شايف ان لو في افكار تانية جديدة عندك يا ريت تمدنا بيها او اي حد عنده افكار جديدة ياريت يكتبهلنا في موضوع جديد ونبدأ كلنا نعلق عليه ونقول رأينا فيه…<br />انا مأخدتش الجوانب السلبية للجواز ولا صعوبة اختيار شريك الحياة المناسب، ولا اتكلمت حتى في أهمية الجواز عند الطرفين، انا اتكلمت من وجهة نظر محددة ومعينة عشان مطولش ورغم ذلك طولت عشان كده بعتذر للجميع."
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106130032/http://20at.com:80/20at/lifestyle/14222-2009-12-02-14-08-42.html"

