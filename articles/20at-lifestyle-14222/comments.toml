subject = ""
author = "The Rock Of Faith"
posted = "2009-12-29"
text = "اتقى الله اخى الكريم رسولنا صلى الله عليه وسلم قال من استطاع منكم ابائة وهى تكاليف الزواج \"فليتزوج\" فهو اغض للبصر واحصن للفرج ومن لم يجد فعليه بالصوم فانه له وجاء.<br />اصدقك ولا اصدق رسول الله الصادق الامين الذى لا ينطق عن الهوى<br />وياسيدى لو قلتلى على امر حلال اخرج فيه شهوتى غير الزواج قولى عليه<br />وبعدين الله قال \"ومن آياته أن خلق لكم من أنفسكم أزواجا لتسكنوا إليها وجعل بينكم مودّة ورحمة إنّ في ذلك لآيات لقوم يتفكرون\" انا عاوز يا جماعة حد عاقل يقلى اصدقه ولا اصدق الله ورسوله<br />ربنا نيقلى فى الزواج \"سكون للنفس\" \"مودة بين الزوجين ورحمة\" مش ديه برده من اسباب السعادة فى الدنيا وفى الاخرة انشاء الله<br />بطلوا بقى فرجة على افلام و مسلسلات و اعرفوا مين ورا كل ده وحتى لو شفت بعينك مثال بل امثلة على ناس كانوا سعداء قبل الزواج وبعد الزواج واجه حياه كرب فا العيب فى الاختيار لشريك او شريكة الحياه و النيه من الزواج<br />معلشى طولت عليكم وتفكروا فى الايات و اسالوا انفسكم هل الله خالق الكون و الذكر و الانثى مش فاهم و الاخ الى كاتب الكلام ده هوا الى فاهم"
