posted = "2006-05-05"
text = "Alqedr yanda7 bema feh, we eza makansh el masry ghalebeyetu 3ala shakelet mubarak we 3esabto, makontosh et7akamto bemanazerhom, we tegro thayasolo fel shaware3, eh el nefaq dah!!!<br />We law gat 3ala mas2alet 7okm we 7okoma bas kat hanet shwaya, shofo sefat el sha3b el masry el naharda wel safala elly bete7sal kol youm fe kol el magalat, el qa2ema la 7asra laha.<br />We fel akheer tal3enly be fekra malhash ma3na, noor eh elly netfeeh!!! Hay2assar fe eh BEL ZEMA!!!!!!!!!! El fawateer hatankhafed wen2asar 2eqtesadeyan 3ala mawared el 7okoma?? Ha3 HA3, leah howa men emta kanet el fawateer qayma 3ala estehlakna fe3lyan mosh 3al nas wel baltaga!!<br />We ba3deen el masreteen bo2 3al fady, 7atta el fekra elly malhash lazma wala ghaya deh yet3ad 3al sawabe3 elly haye3melha.<br />Ento law sha3b zaky konto ba2eto eed wa7da, mosh tenhasho fb3ad fel shaware3 wel matager we kol magal we lamma tetgama3o el 2awel te2wo we t2asaro, laken kal 3ada, ento shayfeen ro7ko atfal abreya2, wel 7okoma heya el bo3bo3, wensetu en el 7okoma el marady mosh turkeya wala engelezeya 3ashan te3ala2o 3aleha el shama3at, el 7okoma menkom we men lonkom, we men betoo3 el sawra wel entesarat beto3kom, ya far7ety, lamma tesala7o nafsokom webyutkom we tette2o Rabena fe ta3amolatkom ma3 gherkom, eb2o fakaro felly akbar we esla7 el balad.<br />Ya 7asraaaa"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

