text = "على فكرة يا جماعة العيش حيغلى زى ماغلوا كل حاجة فى البلد راح بغلوا علينا العيش المواطن المصرى الغلبان حيعمل اية ياعلم دة فى ناس غلابة اكلهم هو العيش والرز وانتوا دلوقتى قاعدين بتتنقشوا ازا كنتوا تطفوا النور ولا لا عايزياية اكتر من اللى بيحصل دةلازم نعلن الحرب على مبارك واتباعة"
