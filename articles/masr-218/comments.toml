subject = "رساله الى أبو الهول"
author = "اتكلم اتكلم أرجوك انطق اتكلم"
posted = "2006-04-27"
text = "انا عارف انك حجرى لكن عمال تتألم<br />اتكلم<br />اتكلم عن اجدادى عن سخرتهم ف عملهم<br />اتكلم عن دلوقتى عن شعبي اللي بيتألم<br />اتكلم عن فرعون ايامنا و على ايامهم<br />اتكلم<br />اتكلم قول يا أخينا مالك ساكت و مبلم<br />شايف كرابيج على ضهرى مش عارف يوم تتظلم<br />اتكلم<br />اتكلم عن اعلامى عن فجره ف وصف رئيسهم<br />و سياسة ابنه البكرى و طوارؤه ف حكم بلدهم<br />اتكلم<br />اتكلم عن اسلامي الضايع بينى و بينهم<br />و فتاوى امامنا الاكبر و بلاوى وزير اوقافهم<br />انا عارف انك حجرى و لا عمرك راح تتكلمك<br />باتألم"
