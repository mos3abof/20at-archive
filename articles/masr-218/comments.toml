[[comments]]
order = 2
subject = "هذه ليست أفكار ولاد البلد"
author = "المهاجر(عبدالله سابقا)"
posted = "2006-04-25"
text = "أحداث طائفية بالإسكندرية... انفجارات بدهب.. حملة على القضاة الشرفاء- اعتقال شباب أبرياء أطلقوا عليهم اسم الطائفة المنصورة......<br />كل هذه الأمور تدل على ان هناك شئ خطأ، تدل على ان هناك كوارث تحدث بمصر، ولكن ما هو الحل، الحل نطفي النور ساعة، وماذا سنستفيد من إطفاء النور!!! ومن سيقوم بإطفاء النور!!!<br />رغم عدم إيماني بجدوى إطفاء النور من أساسه ولكني أشك ايضا انكم ستقومون بإطفائه<br />الإخوة الأفاضل ولاد البلد إذا أردتم ات تتبنوا حملة معينة للتضامن عما يحدث في مصر... ففكروا قليلا قبل أن تتكلموا حتى لا تحطوا من قدركم مما جماهير القراء<br />فكروا في حملة تحملها في طياتها مضمون إيجابي بدلا من هذه السلبية التي تكرسونها، والسذاجة التي تتحدثون بها، والطفولية التي تتصرفون بها... هذه ليست تصرفات ولاد البلد"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

