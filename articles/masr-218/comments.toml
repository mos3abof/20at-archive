[[comments]]
order = 98
subject = "عيني عليكي يا بهية"
author = "ياسين عاشق بهية"
posted = "2006-11-10"
text = "مابقتش محتاجة ظلام ، احنا دلوقتي في عصر الضلمة الحديثة ، محتاجين شمع كتير نشوف بيه الشمس و السما وشواشى النخيل ، و العلاج في ادينا و احنا كلنا عارفينه ، مش عايزين نعمل زي ما قال الشاعر المصري الجميل :\" و ياسين غرقان في دمه خايف منه الحكيم \" يعني شايفيين نفسنا بنموت و في ادينا العلاج و بندور على حل فانتازي انا لا اقلل من اخلاصكم و حبكم للبلد دي لكن خايف يتحول نضالنا لتقاليع جميلة ودمها خفيف و بعدين تنطفي الحماسة زي ما حانطفي النور"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117142651/http://masr.20at.com:80/article.php?sid=218&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 99
subject = "قصيدة بهية"
author = "ياسين عاشق بهية"
posted = "2006-11-10"
text = "الشاعر الشعبي قال :<br />يا بهية خبريني ،يا بوي على قتل ياسين<br />قتلوه السودانية من فةق ضهر الهجين<br />عبادي يا واد عبادي يابوي .. كرباجك في الهجين<br />و اللي يجيلو العبادي يابوي بيعيش عمره حزين<br />و ياسين غرقان في دمه يابوي خايف منه الحكيم<br />و احكم ياقاضي النيابة يا بوي قدامك مظاليم<br />عوج الطربوش على ناحية و حكم باربع سنين<br />سنتين في القصر العالي يابوي سنتين في الزنازين<br />7000 سنة في الزنازين يا بهية و لسه ما شفت النور"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117142651/http://masr.20at.com:80/article.php?sid=218&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

