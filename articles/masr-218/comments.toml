[[comments]]
order = 36
subject = "يلا نضلم غزة عليهم.."
author = "إيمان"
posted = "2006-04-25"
text = "يلا نضلم.. بس مش عندكم في مصر .. بل في غزة..كان نفسي أكون معاكو لكن ياجماعة الحال من بعضه فربنا بلانا بسلطة متفرقش كتير عن الجماعة اللي عندكم..<br />أيوة يلا نضلم غزة على عباس ودحلان..وشلة البلطجية اللي منورة البلد..بس المشكلة أنه حكومتنا حكومة حماس الله يكون في عونهامش ناقصها نضلم .. بعدين يظنوا أنه الشعب مش عايزها..<br />والله ياجماعة صح انا من قطاع غزة لكن قلبي معاكم..ورغم كل النكد اللي احنا عايشين فيه .. إحنا شايفينكم وحاسين فيكم.. وأنا بتكلم باسمي واسم ناس كتير زيه .. وصدقوني وأنا بأقرأ تعليقاتكم مرة أضحك ومرة أكاد أبكي ..خاصة تعليق\"اشتراك اجباري\" فأنتم بجد رائعين وصادقين في التعبير عن مشاعركم وروح النكتة بتميزكم واقتراحكم رائع.. وعمل شئ .. أحسن من السكوت واللاشيء..<br />وأنا أدعم حملتكم بصوتي.. وصوت الناس الغلابه اللي بتنادي من هنا في القطاع لا للفساد .. لا للخونة والمتآمرين على الشعب الفلسطيني وحكومته الجديدة..<br />وإلى الأمام يأأبناء البلد.. ضلموا عليهم البلد..<br />أختكم وجارتكم<br />من قطاع غزة<br />إيمان"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

[[comments]]
order = 37
subject = "جاري البحث عن بومه مصابه بانفلونزا الطيور"
author = "حمدي"
posted = "2006-04-25"
text = "خلاص ياجماعه علشان خاطر اخوانا في غزه<br />نخليها تضلم في غزه كمان والبومه لما<br />تخلص لف علي بيوت الساده المسؤلين في<br />مصر راح نبعتها غزه تعدي علي دحلان<br />والرجوب وابو مازن علشان البلد تروق شويه<br />بس المشكله نجيب البومه اللي مصابه<br />بانفونزا الطيرنجيبها منين<br />اللي يلاقي بومه مصابه يمسكها ويبعت لي<br />ده يعني ان عاش وربنا كتب له عمر"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

[[comments]]
