text = "دي اول مشاركه ليا معاكم في البدايه بقول ان الافكار مهما كانت سذاجتهافمن الممكن ان تخرج من رحمهااشياء توعي الناس وتحارب الخنوع والتواكل اللي معشش في عقولهم بس انا رايي يا جماعه ان التظاهر هو اللي هيسمع صزتنا للناس من خلال الاعلام المحترم وانا من خلال هذا المنبر المحترم اعلن تضامنى مع القضاه الشرفاء في مطالبهم وخصوصا القاضي المحترم الذي تعرض للضرب والاهانه من جانب بلطجيه حبيب اللي مش عادلي"
