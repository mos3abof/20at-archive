text = "هايل إننا نكون بنفكر نعمل حاجة , بس أعتقد الموضوع يستحق وقفةأكثر من إننا نخليها ضلمة , وبعدين مين اللي هيطفي النور احنا... ولا الحكومة هتحس بينا , لو صحيح عايزين تأثروا لازم يكون عطل مركزي من وسط القاهرة في شركة الكهرباء مش تقوللي كل واحد يطفي النور!..ياريت نفكر في حاجة أو حدث ايجايبي ومعبر أكثر من كده مش معقولة تكون البلد في الظروف المنيلة ديه ونظلمهاأـكثر ماهى ضلمة"
