capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

[[comments]]
order = 15
subject = "ضلمه يا مصريين"
author = "نهي"
posted = "2006-04-25"
text = "السلام عليكم<br />ما شاء الله<br />الفكرة ممتازه وتستحق التنفيذ<br />ياللا يا مصريين<br />اعملوا احجه في الاتجاه الصح ولو لمره في حياتكم<br />موش عاوزين الاخوان وكفاية والقضاة يشتغلوا وبس<br />عاوزين الشعب كله<br />واقل حاجه هيا الفكرة المطروحه هنا<br />ان احنا نصلم البلد كلاه ما عدا المستشفيات<br />وادعوا شباب مصر ان يقوموا بطباعة الفكرة وتوزيعها علي كل الشعب<br />نهي محمد / المنصوره"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

[[comments]]
order = 16
subject = "هيا يا مصريين"
author = "فيصل"
posted = "2006-04-25"
text = "السلام عليكم<br />انا فيصل من السعوديه<br />بصراحه الفكرة اعجبتني<br />وقد تتسائلون لماذا اعجبتني وانا سعودي<br />الاجابه ان شعب مصر لوابتدا بهذه الحملهوكانت لبنة في جدار التخلص من الحكم الطاغوتي<br />فانها ستكون البداية لنتخلص من كل الحكومات الطاغويته في الدول العربيه ومنها السعوديه<br />هيا يا مصريون فنحن نتظركم وننتظر ان تتخلصوامن الظلم لتبدا قافلة الحريه في الدول العربيه<br />اخوكم / فيصل"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

[[comments]]
order = 17
subject = "طفوا النور يا مصريين"
author = "مواطن مصري"
posted = "2006-04-25"
text = "بصراحه احنا زهقنا<br />موش عارفين نجيب الهم منين ولا منين<br />بس اللي عارفينه كلنا<br />ان الهم اساسه نظام حكومتنا الفاسد و الفاشل و الظالم<br />واللي عارفين ان احنا لازم نعمل حاجه لاسقاط النظام ده<br />واقلها ان احنا نقفل انوار منازلنا<br />ونقول للظلم لأ<br />فكرة الحمله هايله<br />انا معاكم وربنا يعينا واياكم<br />مواطن مصري"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

