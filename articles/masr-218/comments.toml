text = "بسم الله الرحمن الرحيم<br />كم حلمت بان اتكلم عن مبارك وان افضفض فلقد طفح منى الكيل وازداد غضبى فلعل ثورة فى اعنقى تحدثنى ما مبارك اذا جعل اخى وابى واصدقائى يبعدوا عن فى دوامة الغربة ما مبارك الذى جعلنا عبيد العالم فقبل حكم مبارك كان الجنية يعادل ثلاثة دولار اما فى عصر مبارك بية اصبح الدولار يعادل الست والسبع جنيهات ان يؤسفنى ان اقول على مبارك انها هو وعصابتة زعماء مافيا تسما التقطيع فى شريان الشعب ولاحول ولا قوة الابالله"
