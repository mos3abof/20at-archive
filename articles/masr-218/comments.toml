text = "أنا شايف ان الدعايه للحمله قليله قوي والناس متعرفش رايي ان احنا نعمل دعايه اكتر في الشوارع وفي القهواي ومع تطفيه النور ممكن ننظم اعتصام في ميادين مصر المختلفه بالشموع لان الدنيا هتبقي مضلمه وعشان الناس تحس بالحمله والدنيا كلهاوعندي اقتراح تاني انتحاري بس جامد ننظم اعتصام في عابدين قدام مقر امن الدوله في لاظغولي تضامنا مع اخوان المعتقلين هناك والي اعتقلوا قبل كده والي لسه اكيد هيعتقلوا"
