subject = "مصر مضلمة من 26 سنة"
author = "مصري مقيم باجمل بلد ( دبي )"
posted = "2006-04-30"
text = "نيفين كانت بتسألني عن نبرة في كلامي وهي مش فهماها علي موضوع حضارة 7000 سنة ايوه انا قصدي تريقة امريكا اللي بقالها 250 سنة علي وش الدنيا بقت اعظم دولة في العالم واحنا مش لايقين ناكل وبنقول ان احنا فراعنة بالنسبة لموضوع الضالمة انا حاسس يا شباب ان احنا بنتكلم في فكرة عقيمة اوي ليه لأن بلدنا الناس القائمين عليها خلاص اعتبروها الورث اللي الباشا السادات سابهولهم انا بقول مفيش فايدة وبنصح كل شاب عايز يعيش حياة (آدمية) انه يخرج من مصر لان اللي بيحصل ده حرام واحنا منستهلش نعيش حياة قذرة زي اللي في مصر الان وطبعاً الردود هتبقي انفعالية وانا متوقع ده بس هي ديه الحقيقة."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

