[[comments]]
order = 26
subject = "سؤال برئ"
author = "واحد تاني"
posted = "2006-04-25"
text = "رغم اني مش هقدر اشارك فى مساعدة بهية لعدم وجودي فى الجوار .... بس السؤال, ياترى لما تضلم على الحرامية الكبار من الساعة 9 فى الخير وحتى العاشرة مساء ... دا مش هيساعد الحرامية الصغيرين ويكون دافع للاخوة البلطجية والنشالين للعمل الدؤوب اثتاء (هاذوها) الفترة التاريخية ؟<br />يعنى لو تخيلنا مثلا ان الكاشير بتاع كارفور ماسك شمعة الساعة 9:05 عشان يشوف مشترواتك والا عم السيد سواق ترام نمرة 1 خط باكوس اللى ساهم فى حملة الظلام الدامس وطفى النور فى الترام تفتكروا النشالين ساعتها هيكون ايه دورهم؟"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

[[comments]]
order = 27
subject = "والله العظيم انا غلبت معاكم"
author = "مخنوق من ازهي عصور الحرية قصدي الحرامية"
posted = "2006-04-25"
text = "والنبي يا جماعه اللي عنده كلمه حلوه يقولها واللي معندوش ينقطنا بسكاته بلاش تثبيط همم وكفايه تشاؤم ولا مبالاه وكفاااااااااايه كفااااايه احنا وصلنا للنهايه واجدع سلام لاشرف ناس في مصر القضاه المحترمين الخضيري وعبدالعزيز والاخوان مكي ودرباله وبسطويسي وعبدالجبار"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

[[comments]]
order = 28
subject = "اشتراك اجباري"
author = "حمدي"
posted = "2006-04-25"
text = "ايه الرفاهيه اللي انتوا فيها دي ان<br />ا اسجل اعتراضي الشديد علي هذه الفكره<br />لان الكهرباء اصلا بتقطع عندنا طول الليل<br />اساسا واذا جات بتيجي ساعتين تلاته<br />وعايزني اقطع النور في الساعتين دول ان شاء الله -- لا طبعا مش هشترك معاكم<br />هو وزير الكهربا اسمه ايه علشان ادعي عليه النهارده في صلاة الفجر اللي يعرف يبعت لي<br />نفسي بومه يكون عندها انفلونزا الطيور تروح تقف علي القصر اللي غابدين او التاني اللي في شرم الشيخ وتلف ليها كام لفه علي الساده المسؤلين وتريحنا منهم<br />قولوا امين"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

