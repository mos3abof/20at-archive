posted = "2006-04-27"
text = "يا شغالين و محرومين<br />يا مسلسلين رجلين و راس<br />خلاص خلاص مالكوش خلاص<br />غير البنادق و الرصاص<br />دا منطق العصر السعيد<br />عصر الزنوج و الامريكان<br />الكلمة للنار و الحديد<br />و العدل أخرس أو جبان<br />صرخة جيفارا يا عبيد<br />في أي موطن أو مكان<br />ما فيش بديل ما فبش مناص<br />يا تجهّزو جيش الخلاص<br />يا تقولو عَ العالم خلاص"
