text = "أشد انواع الناس بغضا الي نفسي من يحيلون الجد الي هزل والهزل الي جد انت تنظر للفكره من خيالك الضيق وكما قلت ان الافكار مهما كانت سذاجتهافانها لابد ان تعبر عن شيء كما اننى مندهش من نظرتك التشاؤميه ونظرتك الي النصف الفارغ من الكوب وكمان تحليلك الغير سليم والذي ينم عن جانب مريض بداخلك ويعنى نسبه المواليد غير الشرعيين هتزيد والسرقه هتتفشي يا صاحب النوايا السيئه مثل عقلك المظلم والله امثالكم السبب في وكستنا اه والله يلا اجري اتفرج ع الكليب الجديد بتاع بوسي سمير وبعدين 254 نمرتك فين بالظبط........"
archived = "2006-06-23"
