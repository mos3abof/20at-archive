text = "يلا نضلم مصر عليهم..!<br />بجد ...<br />بس اللي عايز يشتغل بجد ... ينشرها في كل حتة ... سموا نفسكم بيها في الماسنجر ... في الياهو ...<br />ابعثوها رسايل ..ايميلات ...<br />انشروا في كل مكان ... وحتي مش بغرض الفكرة دي بس ... لكن الفكرة هي نشر مشاريع مشتركة وتفعيل الناس كلها ..وواحدة واحدة. ... حيخرج مشروع كبير يهز البلد كلها ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
