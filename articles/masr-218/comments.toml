posted = "2006-04-27"
text = "يا نفس ان لم تقتلى تموتى حسبى الله ونعم الوكيل 000000000اعتقد انكم كلكم من وجه بحرى اما انا من من صعيد مصر من اسيوط الملعونه والمغضوب عليها يا ناس نفسى اعمل حاجه الله يرضى عنكم انتو بتعملو مظاهرات ومسيرات وتضامنات مع القضاء وغيرة وغيرة ربنا يكرمكم لكن احنا هنا مش قادرين نتنفس اصلا كل اللى عايز اقوله انى 00اهوى الحياة كريمه لا ظلم لا استبداد لا استخفاف بالانسان وصدق الله اذ قال عن فرعون فاستخف قومه فاطاعووووووووووووووة اظاهر ان عهد الفراعنه لم ينتهى بعد وكلمه الله ايه ولكل ظالم نهايه"
