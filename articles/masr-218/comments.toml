subject = "سبع تلاف سنه"
author = "احمد المصرى"
posted = "2006-04-25"
text = "السلام عليكم)<br />العنوان سبع تلاف سنه<br />ايه هما السبع تلاف سنه<br />دول تقريبا عمر مصر الحضارى<br />المشكله ؟ مافيش مشكله<br />الحكايه ؟مافيش حكايه<br />امال ايه اصل الموضوع انها<br />على طول الزمان بتتسرق<br />بس اى والله على طول الزمان بتتسرق انتم مصدقنى<br />ولا لا<br />سبع تلاف سنه احتلال ورا احتلال<br />ولما يسبها الاحتلال<br />يمسكها شويت حراميه يسرقو فيها شويه<br />وبعد كيده الشعب<br />ماله<br />الشعب اكيد بيطلع عينه اكيد<br />هوه الى بيتظلم اكيد<br />هوه الى بيتهان<br />وبعد كيده يتكره من الكل بسببالحكومه<br />يعنى ايه<br />يعنى فيه شويت حراميه<br />هوه داه الموضوع كله<br />ايوة<br />اله<br />انت بتضحك طااااااايب اضحك"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

