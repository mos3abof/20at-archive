[[comments]]
order = 70
subject = "sdfsd"
author = "sdfdssdfsdf"
posted = "2006-05-09"
text = "فارس بني وحلان يغزو نادي القضاة<br />ياخبير القمع فينا والتعاطي مع القضاة<br />كنت فين ودهب بتنزف والنظام مكشوف قفاه<br />صاحي قبل الفجر يرسم خطته لسحل الجناة<br />جامع الجيش العرمرم والجنود واقفة انتباه<br />الى لابس مدني لابس والى جاي شايل عصاه<br />قلت له على فين ياعادلي ماشي على اي اتجاه<br />قلت يمكن يغزو يافا ولا حيفا نروح معاه<br />قال لي دا الغزوة محلي جنبنا ف نادي القضاة<br />القضاة دول سم ناقع انت مش عارف اذاه<br />بدأوا هجوم الاشاوس بالفوارس والرماة<br />جندلوا الخصم ف دقايق والصراخ عالي صداه<br />سيطروا على الحصن كله دمروا جيش الغزاة<br />وقبل ما الفجر يشقشق عادلي حقق مبتغاه<br />عادلي طاف كل المدينة جيشه وجنوده وراه<br />ساحب الاسرى ف مواكبه موسومين فوق الجباه<br />والجحافل ماشية ترقص جارة اعداء الحياة<br />والهتاف بالنصر عالي من الحناجر والشفاه<br />عادلي قائدنا المزفر (1)عادلي مقبرة الغزاة<br />كتبوا في عادلي قصايد تاه ف تفسيرها النحاه<br />فرشوا الساحة ولايم اتخموا منها الحفاة<br />احتفالهم كان علامة اسهبوا في وصفه الرواة<br />لكن الفرحة ماتمت والوضيع ما بلغ مناه<br />قبل تقسيم الجواري والغنايم والاماة<br />جاهم الخبر المنيل نقله واحد من الرعاة<br />عادلي مش قائد مزفر والنظام وارم قفاه<br />(1) هي هكذا في الهتاف.<br />مجلة الإعصار"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

