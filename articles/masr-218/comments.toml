author = "Shahin"
posted = "2006-08-24"
text = "سيدي الرئيس<br />في عيد ميلادك الكام وسبعين<br />كل سنة وانت طيب<br />واحنا مش طيبين<br />كل سنة وانت حاكم<br />واحنا محكومين<br />واحنا مظلومين<br />واحنا متهانيين<br />ويا تري يا حبيب الملايين<br />فاكرنا وللا احنا خلاص منسيين<br />فاكر المعتقلين<br />فاكر الجيعانين<br />فاكر المشردين<br />فاكر اللي ماتو محروقين<br />فاكر الغرقانين<br />الله يكون في عونك - ها تفتكر مين وللا مين<br />في عيد ميلادك الكام وسبعين<br />بقول لك كلمتين<br />الأولى<br />شيلتنا طين<br />و هل تعلم أن النيل بقي رشاح<br />و الجو أصبح بيئة والعيشة ولعة<br />و الشرفاء قلوبهم عالبلد والعة<br />و انت عاملهم مذبحة ولا بتاعة القلعة<br />و الإقتصاد سداح<br />و السرقة بقت كفاح<br />و مصر متاحة بس للسياح<br />و عرض البلد بقي مستباح<br />و الثانية<br />وريتنا الويل<br />دا الخطوة في عهدك بقت ميل<br />و الضحك بقي نواح و عويل<br />و الكوسة<br />عارف الكوسة<br />ممكن أقول لك فيها مواويل<br />و الجامعة بقت يا إما كباريه أو دار مسنين<br />و الشباب معظمهم من غير خمرة سكرانين<br />و العلم عز علي المتعلمين<br />و الأساتذة بقم دجالين<br />و القادة بقم طبالين<br />و اديني في الهايف يا حبيب الملايين<br />و الثالثة<br />عارف اليابانيين<br />زمان في سنة اتنين و خمسين<br />كان عندنا تروماي و كان عندنا علم و متعلمين<br />و ثقافة و مثقفين<br />و أدباء و علماء و فنانين<br />و كانوا اليابانيين<br />بالنووي لسه مضروبين<br />و للصدقة مستحقين<br />دلوقتي إحنا فين و هما فين<br />هما فوق و احنا في أسفل سافلين<br />و الرابعة<br />أمن بلدنا بقي تنين<br />و المحاكم اتملت مظالم<br />و العدالة بقت كمالة<br />و كلمة الحق في الزبالة<br />و أصحابها في الزنازين<br />و الخامسة<br />القطاع العام....عام<br />اقرأ بقية التعليق .."
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172019/http://masr.20at.com:80/article.php?sid=218&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 96
subject = "انسان من ارض مصر"
author = "لم اقل مواطن من ارض مصر لانى لا اعتقد انى مواطن لى حقوق حتى اقولها تضيع كل الحقوق امام رجال الشرطة تهان كرامتك ما دمت مواطن مصر تضرب وتسب ما دمت مواطن مصرى"
posted = "2006-09-07"
text = "تهان لانك مجرد مواطن<br />تهان لانك لست من ساسة البلد او من رجالها شرطه وحكومة<br />كنت اعتقد انى فى بلدى محمى ومطمئن انى ابن البلد وجدت الحريه موجوده خارج البلاد كنت ادخل حدود مصر اشعر بضيق فى الصدر عندما ارى وجوه الظبات والصولات فى الجمرك المصرى الذى يجعلنى اتذكرا حسن معاملة ضبات دوله اخرى استطيع ان اجعله ان يقوم من على الاكل حتى يختم لى الباسبور وفى بلدى انتظر 6 او 10 او 12 ساعة على حسب مذاج البيه الظابط<br />غير فى الشارع اسير توقفنى لجنه يمسكونى<br />من القميص مسكة الحرميه وكأنى عامل مصيبة والحرامى والمنحرف مطلق حر<br />لان هذه صنعته فهو يعرف كيف لا يقف امامهم اما نحن نقف كنت اعتقد انى ما دمت سليم لا اخاف من احد ولا الشرطة ولكنى الان اعتقد ان الخوف اصبخ خوف فطرى سواء كنت سليم او غير سليم<br />ما دمت مواطن بدون واسطه وظهر يحمينى<br />ما دمت بدون نفوذ وعلاقات قويه من طبقة الرجال المهمين اما نحن فلسنا برجال بل<br />رعاع عند هولاء<br />ارى مصر وكأنها عذبه تعداد الفلاحين فيها 70 مليون مخصوم منهم طبعا كل رجال الدوله من حكومة وشرطة وخلافه<br />فهم اصحاب العذبه وحن عبيدها<br />نفسى اتكلم<br />نفسى اشعر بالحريه<br />نفسى اكون مواطن بجد<br />تكون الشرطة فى خدمة الشعب بجد<br />مش فى خدمة الدولة<br />نفسى اكون انسان<br />نفسى اكتب هذا الكلام يقرأه كل انسان ويفتكرا انه ايضا انسان<br />لولا مكانك يا صاحب القياده لكنت مثلى<br />مهان<br />انت لن تقبلها فلما تقبلها لنا<br />لماذا ماذا تريد منا ماذا تريد الحكومة والشرطة ورجال امن الدولة منا<br />بدأ الخوف ينطفأ رويدا رويدا من كثرة ما<br />ارى واسمع واقر<br />اقرأ بقية التعليق .."
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172019/http://masr.20at.com:80/article.php?sid=218&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

