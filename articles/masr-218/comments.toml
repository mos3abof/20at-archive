[[comments]]
order = 72
subject = "ياااااااااااااه اخيرا"
author = "محمد رشاد"
posted = "2006-05-14"
text = "اقسم لقد فاض الكيل و لولا ان هذه بلدنا النى نعشقها للجات الى هدم المعبد على رؤس الكل كما يفعل اليائسين من ابناء هذا ال....وطن<br />يا عالم نحن لم نخلق عبيد ,و انا لن ارتبط بوطن لا اامن فيه على حقوقى و اضحى فيه من اجل ان ينعم المرتزقة و المنافقين. لا معنى لوطن بلا عدل و لا امل فى مستقبل بلا احترام للعلم و العدل<br />نحن شركاء فى هذا البلد و لسنا رعية و اعلن انه انتهى عصر\" نحن نملك الارض و من عليها \" و انتهى عصر\" ما اريكم الا ما ارى و ما اهديكم الا سبيل الرشاد\" انتهى عصر \" ان اخاف ان يظهر فى الارض الفساد\" و لكل من هو مستمتع بهذا العصر اقول اخرجونا من قريتكم اننا اناس نتطهر\" انا لن نعود الى ملتكم فارجمونا او انفونا الى تيه الصحراء او صلبونا الى جزوع النخل فلقد سامنا سادية فرعون تلك واصراره على الايذاء بلا مبرر لا يزال فرعون هو فرعون كما رفض خروج بنى اسرائيل قبل ان يسحلهم يرفض عتق الشعب المصرى قبل ان \"يكسر عينه\"<br />يا مرتزقة النظام يا حوارى و اعوان الظلمة يا حملة المباخريا جند فرعون يا ايها الملا اخرجونا من قريتكم اننا اناس نتتطهر انفونا من جنة مبارك لاننا قد نبدل دينكم او ان نظهر فى مصر الفساد اخرجونا الى تيه الصحراء الغربية فالحياة مع الاسد الضوارى خير منها مع الكلاب و الثعالب و يا شعب نائم الازلتم \"فاسقين \"؟ امازال يستخف بكم و تطيعونه ؟ ثم تريدون من الله ان يرحمكم ؟ و الله لسوف تسالون عن ظلمكم لانفسكم فالسكوت على الظلم به اثمان اثم الرضى و اثم المشاركة . اما ان لكم ان تخرجوا انفسكم من عبادة العباد الى عبادة رب العباد<br />تحية الى من فجر هذا الركام و التيه الممسك بانفاسنا تحية الى من اطلقوا هذه الصرخة فى وجه كل جائر و كلابه<br />انهم سبعه الالاف \"عز بن عبد السلام \" و عشرات الالاف من المماليك<br />اقرأ بقية التعليق .."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

[[comments]]
order = 73
subject = "انتفضوا"
author = "محمد رشاد"
posted = "2006-05-14"
text = "مرت عقود طويلة وتلك الحشرات الجاثمة على صدر الشعوب لاتزال تصر على كتم انفاسها حتى صارت جثث هامدة لا حياة فيها, اغلبية ساحقة من الغائبين او المغشى عليهم او الجبناء ,و بضع مئات مازالوا يكافحون بعد ان فاض بهم الكيل ماذا ننتظر ؟ و علام نبكى ؟ و ما معنى حياة لا تامن فيها على نفسك او حقوقك ان كان لك نصيب منها ؟ما معنى كلمة وطن يتاجر باسمه كل كلب ليسلبك كل ما تملك \" مش عشانى عشان مصر\"؟ و يخرج عليك كل صاحب وجه كالح ليقول \" دا امن مصر و استقرارها \" لينفتح باب لكل مريض سادى للتلذذ بايذاء الاخرين و سحلهم<br />اقسم لقد فاض الكيل و لولا ان هذه بلدنا النى نعشقها للجات الى هدم المعبد على رؤس الكل كما يفعل اليائسين من ابناء هذا ال....وطن<br />يا عالم نحن لم نخلق عبيد ,و انا لن ارتبط بوطن لا اامن فيه على حقوقى و اضحى فيه من اجل ان ينعم المرتزقة و المنافقين. لا معنى لوطن بلا عدل و لا امل فى مستقبل بلا احترام للعلم و العدل<br />نحن شركاء فى هذا البلد و لسنا رعية و اعلن انه انتهى عصر\" نحن نملك الارض و من عليها \" و انتهى عصر\" ما اريكم الا ما ارى و ما اهديكم الا سبيل الرشاد\" انتهى عصر \" ان اخاف ان يظهر فى الارض الفساد\" و لكل من هو مستمتع بهذا العصر اقول اخرجونا من قريتكم اننا اناس نتطهر\" انا لن نعود الى ملتكم فارجمونا او انفونا الى تيه الصحراء او صلبونا الى جزوع النخل فلقد سامنا سادية فرعون تلك واصراره على الايذاء بلا مبرر لا يزال فرعون هو فرعون كما رفض خروج بنى اسرائيل قبل ان يسحلهم يرفض عتق الشعب المصرى قبل ان \"يكسر عينه\"<br />يا مرتزقة النظام يا حوارى و اعوان الظلمة يا حملة المباخريا جند فرعون يا ايها الملا اخرجونا من قريتكم اننا اناس نتتطهر انفونا من جنة مبارك لاننا قد نبدل دينكم او ان نظهر فى مصر الفساد ا<br />اقرأ بقية التعليق .."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

