[[comments]]
order = 4
subject = "زهقت خلاص و الله"
author = "زهقت خلاص"
posted = "2006-04-25"
text = "زهقت خلاص و الله العظيم زهقت يا جماعة إحنا ما نستهلش كده و الله العظيم ... الشعب ده طيب و الله و ما يستهلش بقاله أكتر من 2000 سنة و أكتر و هوه بيتبهدل و لو راجعت التاريخ يوم يوم و لا ساعة ساعة ما هنلاقى الشعب ده إلتقط أنفاسه ثانية واحدة طول تاريخه حروب و مؤامؤات على الحكم و إحتلال و مظاهرات و فقر و جوع و حتى الإنتصار اللى يذكر الوحيد فى تاريخه و هو إنتصار أكتوبر مسخوه و ميعوه و اللى جه بعده قالك السادات خاين و باع النصر من أجل سلام الخصيان مع إسرائيل و ح اللى زاد و غطى الفقر و الفساد اللى قرقض البقية الباقية من رغيف العيش الناشف اللى بيتقوت عليه الشعب الجعان كفاية بقى كفاية عاوزين الشعب يستريح شوية و يقعد رايق و كفاية الشباب متبهدل ما بين إستار أكاديمى و بين تطرف و بين صياعة و ضياع فى الشوارع عاوز أعيش زى البنى أدمين و ما أحسش إنى بأحلم بأشياء إحنا بنعتبرها ما بعد الرفاهية زى الأكل و الشرب و أربع حيطان أتلم فيهم أنا و زوجتى و أعلم إبنى كويس و أعالجه لما يمرض و كل الحاجات دى العالم كله بيعتبرهم من البديهيات و بيضحك علينا لما بيعرف إن دى أحلامنا كفاية بقى الله يخليكم يا جكامنا يا ظلمه و سيبكم بقى من نظرتكم لينا على إننا شعب فرعون لو شبعنا هنرفع راسنا و نقولكم من أين لك هذا لأن لو شبعنا هنشكرك ربنا سبحانه و تعالى اللى أعطانا حكام بيسهروا على راحتنا و هنعيش زى أبسط البنى أدميين اللى عاوز يعيش و يربى ولاده و بس و هنعدى على كل واحد فيكم كل يوم و نبوس إيديه و أى حته كمان تانيه عرفانا بالجميل و لأن معيشنا فى رفاهية البديهيات و أتعظوا بقى يا حكامنا من اللى جرى للى قبليكم و اللى أذاقوا الشعب أقل مما تذيقونه الأن و هم الأن فى مزبلة التاريخ و كل ما يذكروا بتتبعهم سباب و لعنات و تفات الشع<br />اقرأ بقية التعليق .."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

[[comments]]
order = 5
subject = "زهقت و الله (الجزء الثانى اللى مش باين)"
author = "زهقان خالص"
posted = "2006-04-25"
text = "تفات الشعب المسكين إتقوا الله فينا و خللى كل واحد فيكم يقف خمسين دقيقة مع نفسه يتصور بس واقف بين أيديى الله سبحانه و تعالى و بيتسأل عن الرعية بتاعته من أول طفل عمره دقيقة لغاية الشيخ اللى عمره 200 سنه و الله و الله و الله و أقسم بالله خالق العالمين إن مافى شئ فى الكون ده كله و لو ملكت الكون ده كله(و الملك لله الواحد القهار) يسوى وقفتك لحظه و إنتا بتتسأل عن واحد واحد من المريض للمظلوم للشيخ المسن للأرملة .... إتقى الله يا حاكمنا و لو إنتا فى الدنيا دلوقتى و مستقوى بوزارة داخليتك و الله العظيم لهتتعلق فى الأخره و ماهتلاقى اللى ينجدك و ده هو اللى مصبرنا و بيوسع حدود صبرنا"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

