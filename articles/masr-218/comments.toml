[[comments]]
order = 42
subject = "سؤال بريء"
author = "حلم"
posted = "2006-04-26"
text = "هو انتو آخدين الفكرة دي من موقع كفاية ولا كفاية الي واخدها منكم؟ ولا انتو تبع بعض والله أعلم؟؟<br />عموما تطفية النور كل يوم كتير جدا عشان في ناس عندها امتحانات وناس عيانة وبلاوي<br />وبعدين الوقت ده وقت العشا وفي ستات لو منوروش النور عشان يطبخو عشا لأزواجهم فيها خراب بيوت<br />عموما انا موافقة على تطفية النور يوم محدد بس كل يوم صعب اوي/ واوعدكم اني هلتزم معاكم مع اني مش عايشة في مصر لكن أكيد الضلمة هتأثر<br />ربنا ينور عليكم"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

