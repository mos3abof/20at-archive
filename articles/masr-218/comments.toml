author = "Ahmed Mky"
posted = "2006-06-07"
text = "شوفت ناس بتتكلم عن اسيوط والصعيد وبتقول انهم مش قادرين يعملوا حاجة ياخي هوه لازم تنزل وتعتصم بالنسبة للمظاهرات في الصعيد<br />انا فاكر ان حصلت مظاهرتين قبل كده كان العدد المشارك قليل جدا يعني ميعدوش الالف<br />وبعدها الله يقصف عمرهم بتوع الامن المركزي نزلوا علي الشوارع واللي يشفوه يلموه<br />اعتقلوا حوالي ما يقرب ل8 الاف مواطن منهم طلبة عندهم امتحانات الكلام ده كان السنة اللي فاتت<br />بالنسبة للي بيعبئ الشارع ده لازم يكون في منطقة فيها صوته بيوصل لكن انا نزلت واتكلمت وغيري نزل واتكلم وصرخنا وقولنا كفاية حرام اللي بيحصل<br />كل يوم بيزيد الظلم<br />لو عاوز تشارك بحاجة مؤثرة فعل حملة طفي النور يا بهية فعلها في محافظتك<br />فعلها في كل وتأكد انك هتلاقي الكل جنمبك<br />ومنهم اناومش انا بس لا دي في ناس كتير غيري وغيرك بس المهم انك تكون عاوز تعمل حاجة<br />وانا بئيد الحملة وبقول خلوها ضلمة عليهم<br />وانا من الان بدأت بارسال sms لحوالي 7000 فرد من المنطقة اللي انا فيها<br />ان شاء الله نشوفها ضلمة عليهم مش بيعرفوا يضربوا ويسحلوا وبيعتقلوا ويغتصبوا طيب شوفوا بقي لما نضلمها عليكم هنشوف مين فينا اللي هيعرف يسمك التاني<br />في كلمة قالهالي واحد صاحبي وتركت في نفسي اثر كبير وهيه<br />اخي لا تخشي السقوط فنحن في القاع<br />مش بقول كده علشان احبطكم لا انا بقول معاكم واي فكرة تاني انتم شايفينها تعبر عن ثورة شعبية ضد الظلم اللي شفناه في عصر المعلم مبارك والبلطجية بتوعه<br />اي فكرة توصل كلمة لا كفاية ظلم<br />احنا مش هنسك مش هنطاطي احنا كرهنا الصوت الواطي<br />ان شاء الله هبدأ بنشر الحملة في المدونة بتاعتي<br />www.shellr00t.com<br />نلتقي بعد الفاصل<br />والله ياجماعه انا حكايتي طويلة مع النظام الفاسد ده<br />ومعايا حاجات تدين ناس كتير في امن الدولة فيالمنطقة اللي<br />اقرأ بقية التعليق .."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

[[comments]]
order = 87
subject = "الضلمة الجميلة"
author = "عبد الرحمن"
posted = "2006-06-19"
text = "الضلمة الجميلة<br />إلى كل من شارك بتعليق فى هذا الموقع أقول له إوعى تطفئ النور إوعي تطفئ النور<br />لان الحياة بمبي ونحن بجوار هذا النظام<br />يا من تنظرون من ثقب الباب ويا من تنظرون فقط إلى النصف الفارغ من الكوب<br />يا عالم ألم يبشرنا مجدي الدقاق أمس بأن الإصلاح قادم وإن كان تدريجيا.<br />ألم يبشركم عمرو عبد السميع بأن كله تمام<br />ألم يأتكم نبأطشة الملوخية ألم تسمعوا عن تواضع جمال جمارك ومن أنه يأكل الطعمية<br />ياعالم إختشوا يا ناس إكسفوا على دمكم دا إبن الرئيس بيأكل طعمية<br />دا إبن الرئيس جمال مجامل للناس كلها بأمارة إنه كان فى الإستاد هو أخوة وألفغ مصري مرمين فى البحر الأحمر<br />عييب عليكم خلوا فى وشكم شوية دم<br />جمال سيدكم وإبن سيدكم<br />وأخيرا لنردد مع محمود عبد العزيز<br />يسقط بونابرت يسقط بونابرت<br />معلش قبل الختام<br />سؤال والإجابة والله ألف جنية<br />هل تعتقد أن عبد الله كمال وكرم جبر ينتميان إلى بنى البشر للإجابة الإتصال على رقم زيرو صفرين زيرو<br />والله يمسيك بالخير يا عم سمير يا رجب"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

[[comments]]
order = 88
subject = "يا بهية"
author = "عبد الرحمن"
posted = "2006-06-21"
text = "يا بهية إستني شوية قبل ما تطفى النور<br />قد يتساءل الكثيرين لماذا تستني بهية شوية الإجابة<br />النور سيطفأ إجباري أى والله إجباري فهذه الحكومة وهذه الدولة سوف تضلم مصر بنفسها اى والله بنفسها وسوف يخرج الجميع ليمدحوا هذا القرار من الرئيس المؤمن الذي إرتئ أنه بتضليم مصر من بعد صلاة العشاء أحسن شئ ولكم أن تتخيلوا ماذا سيكتب أسامة سراي عن بطل الحرب والسلام الذى أتاه الوحي فى المنام ليقول له أن يضلم مصر<br />وكيف سيتهمكم بالكفر فى حالة الإعتراض حد بيعترض على الوحى يا كفرة يا ولاد الكفره وكيف سيكتب محمد على إبراهيم عن زيارة الرئيس لألمانيا الشرقية لا حظ الشرقية ليتعلم منه الألمان كيف تكون الضلمة الصحية وكيف سيخرج أنس الفقي ليقول فى مجلس الشعب عن التوفير الحادث من جراء ذلك الإجراء وكيف أن الله كشف عن الرئيس الحجاب وأوحي إليه بموضوع الضلمة وكيف سيت إستثمار المبلغ الفائض من إستهلاك الكهرباء والبث الفضائي والأرض فى بنا المستشفيات والمدارس وما أنا متأكد منه أن الرويبضة عبد الله كمال سيكتب أن الإخوان المسلمون هم المسئولون عن أن النور ولع فى شبرا وبلاق أبو العلا وسيتهم المرشد بالكفلر والزندقة لأنه قد خالف الوحى المنزل على الرئيس وسيكتب كرم جبر أن من أوحي إليه هو نجل الرئيس وليس الرئيس وسيكتبون وسيكتبون وسوف يتكلم كمال الشاذلى على أن الرئيس المؤمن محمد أنور السادات قد قال له وهو على فراش الموت بأن الرئيس من المبشرين بالجنة وأن سيوحي إليه فى أخر الزمان ولكنه لم يبح بالسر سوى بعد مضي ربع قرن وفقا لما هو معمول به فى الأسرار الحربية .<br />والأن يا أختي يا بهية ألن تؤيدى رأى أنه ينبغي عليك أن تنتظري شوية وذلك لأن الأيام القادمة أيام سوداء<br />وأخيرا لنردد مع أحمد مطر .<br />فوالينا أدام الله والينا رأنا أمة وسط<br />اقرأ بقية التعليق .."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

[[comments]]
order = 89
subject = "اوعا تنسى يا مبارك"
author = "على محمود"
posted = "2006-06-23"
text = "قصيدة البتاع<br />يا اللي فتحت البتاع<br />فتحك على مقفول<br />لن اصل البتاع واصل على موصول<br />فأي شيء في البتاع<br />الناس تشوف على طول<br />و الناس تموت بالبتاع<br />فيبقى مين مسئول؟<br />و ازاي حتفتح بتاع في وسط ناس بتقول<br />بأن هذا البتاع<br />جاب الخراب مشمول<br />لأنه حته بتاع<br />جاهل غبي مخبول<br />أمر بفتح البتاع<br />لأنه كان مسطول<br />و بعد فتح البتاع<br />جابوا الهوا المنقول<br />نكس عشوش البتاع<br />و هد كل اصول<br />و فات في غيط البتاع<br />قام سمم المحصول<br />و خلا لون البتاع<br />اصفر حزين<br />مهزول<br />و ساد قانون البتاع<br />ولا عله ولا معلول<br />فالقاضي تبع البتاع و الحق ع المقتول<br />و الجهل زاد في البتاع<br />ولا مقري ولا منقول<br />و الخوف<br />سرح في البتاع<br />خلا الديابه تصول<br />يبقى البتاع في البتاع<br />و الناس صايبها ذهول<br />و ان حد قال ده البتاع<br />يقولوله مش معقول<br />و ناس تعيش بالبتاع<br />و ناس تموت بالفول<br />و ناس تنام ع البتاع<br />و ناس تنام كشكول<br />آدي اللي جابه البتاع<br />جاب الخراب بالطول<br />لأنه حته بتاع<br />مخلب لراس الغول<br />باع البتاع بالبتاع<br />و عشان يعيش على طول<br />عين حرس ع البتاع<br />و برضه مات مقتول"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172019/http://masr.20at.com:80/article.php?sid=218&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 90
subject = "بنوك الدولة"
author = "إبن بهية"
posted = "2006-06-25"
text = "أقترح إقتراحا عمليا يزلزل الكيان بالكامل مع تمام مشروعيته وأحقية كل مصري فيه ألا وهو :<br />*** مطالبة الجماهير المصرية بالذهاب للبنوك المصرية وسحب جميع أموالهم .<br />وذلك للأسباب التالية :<br />1ـ ستطرح البنوك للبيع لأعداء الوطن .<br />2ـ إتضح عند طرح بنك الإسكندرية للبيع وجود مبالغ بالمليارات ضائعة من البنك ولم تسدد بعد .<br />3ـ توجد أموال وديون بالمليارات لبافي البنوك المصرية يبحثون سدادها من عملية بيع بنك الإسكندرية.<br />أي أن كل بنك سيباع لسداد مديونية البنك التالي - فما هو الحال بآخر بنك .<br />4ـ سنوقف نزيف سرقة أموال الشعب والدولة .<br />5ـ سنوقف إغتناء الحرامية من أموال شعبنا .<br />6ـ فلنسحب أموالنا قبل ألا نجدها كما حدث من قبل بسرقة شركات توظيف الأموال .<br />والأسباب كثيرة لا حصر لها."
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172019/http://masr.20at.com:80/article.php?sid=218&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 91
subject = "العزيزة بهية البلاوي المستخبية وطبيخ الملوخية والفراخ المقلية"
author = "عبد الله"
posted = "2006-06-29"
text = "العزيزة بهية<br />الحمد لله أننى إستطعت أن أكتب لك مرة أخري<br />بص يابهية موضوع يا لا نضلم مصر عليهم دا موضوع مش داخل الأنفخى بتاعتى<br />إذا يا بت يابهية نضلم مص ماهى يا بت مضلمه جهزه أى والله مضلمه جاهز<br />فى بلد يا بهية يكون فيه رئيس مجلس إدارة أكبر جريدة فى الشرق الأوسط حرامي ومرتشي ومرفوعة حصانتة لحين التحقيق معه<br />ويكون مدير التسويق بها الذى يشغل منصب رئيس النادى الأهلى نادى القرنين مرتشى وحرامي ومطلوب على ذمة العديد من القضايا<br />ويكون أمين صندوق نفس النادى حرامي وسارق لقصر العينى الفرنساوي<br />ويكون رئيس ديوان رئيس جمهوريتها حرامى وحامي لقاتل الف نفس فى البحر الأحمر<br />ويكون محافظ دقهليتها أب للص سارق المال العام ومشارك لباجنيد فى سرقة القصر العينى الفرنساوى ويكون محافظ بور سعيدها أب لسارق شركة برسيل<br />ويكون ويكون ويكون<br />ويكون رؤساء تحريرها من عينة المقبور عبد الله كمال والمخفى ممتاز الهر ويكون رؤساء مجلس إدارة صحفها من عينة بخل كسر<br />والله يا بهية إنها لبلد مضلمه جاهزة<br />.................مشكده ولا أيه"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172019/http://masr.20at.com:80/article.php?sid=218&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 92
subject = "يلا نولع مصر علبهم"
author = "eneen_2@yahoo.com"
posted = "2006-06-29"
text = "أحيي أصحاب هذه الفكرة والتي أراها في الحقيقة اشعال وليس إطفاء .<br />هي إشعال لإرادة التغيير ولو بشكل يبدو ظاهرياًًسلبيا وغير فعال ولكنه سيقيس حجم الرفض الموجود في المجتمع لكل أشكال الفساد والقهر والظلم واللاإنسانية التي يتمتع بها النظام .<br />فتعالوا معا نولع مصر عليهم بنور المشاركة وتوحيد الصف والأعمال ذات الدلالة وليكن اطفاء النور هو الشرارة التي تشعل نيران الغضب في الصدور.<br />كل ظلام العالم لا يستطيع أن يطفئ شمعة واحدة .<br />(مقهور/مظلوم/عاطل/ناقم)"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172019/http://masr.20at.com:80/article.php?sid=218&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 93
subject = "معاكم"
author = "محمد شحاتة"
posted = "2006-07-08"
text = "بس فهموا الناس ليه هتطفوها<br />والحكاوى تجيب بعضاها<br />بالمناسبة ده موقع المدونة بتاعتى<br />http://alhal.blogspot.com/<br />ودى اخر حاجة فيها<br />أ ـــــ الله اكبر فوق ايادى الظالمين<br />ب ـــــ بسم الله حا نحكى حكاية الحرية يا سامعين<br />ت ـــــ َتغير الأحوال من قضاء الله فى السنين<br />ث ـــــ ثورةاى بلد عاوزه ولد وكتير من المخلصين<br />ج ـــــ جنى المصباح وسرالله فينا احنا شعب المطحونين<br />خ ـــــ خروج الروح ولا العيشه كدة بالحايا مدفنوين<br />د ـــــ دفع الضرر عن البشرفرض عين و لا ايه يامعممين ؟<br />ذ ـــــ ذيادة الكلام الحر توعى و فعل الحر ابرك من حكاوى سنين<br />ر ـــــ رد الهوان والأنحطاط عن البلاد اولوية يا مثقفين<br />ز ـــــ زيلوا الحواجز يا كل التيارات انتوا بس مصريين<br />ش ـــــ شبكة فساد حطيت علينا والحل فى السكاكين<br />س ـــــ سنين سودا بفسادهم وبغبائهم وجهلهم المبين<br />ص ـــــ صلاح امتى فى قوله لا لظلم قالهنا الأمين<br />ض ـــــ ضد الكسل ضد اليأس ضد الغباوه والمغفلين<br />ط ـــــ طمع النفوس فى الدنياهو الخطر فانسوها ولو لبعد حين<br />ظ ـــــ ظهورالحق هيجنن الوحش فستحملوهم دول يومين<br />ع ـــــ عزم الرجال يظهر فى اليومين السود عديهم بخير يا كريم<br />غ ـــــ غيوم وآلام وممكن دم وما ينفعك إلا صبر وذكاء ودعاء الوالدين<br />ف ـــــ فوز اكيد من بعدها فوران يغير الملاين<br />ق ـــــ قلوب الناس تصبح معاك بس ما تتغرش لتصبح مثل السالفين<br />ك ـــــ كل الخطر تنسى الوعود وتنقلب فرعون من الفراعين<br />ل ـــــ لم حواليك الرجال والكفائات مش كلاب متسلقين<br />م ـــــ مصر تقيلة اقوى فشيل على قدك ما تعقدش على الكرسى سنين<br />ن ـــــ نور طريق من بعدك لجل ما يكمل الطريق السالكين<br />ه ـــــ هتبقى بلدنا جنة الله واحنا فى الرخاء متنعمين<br />و ـــــ وان نسيت هنقوم عليك<br />اقرأ بقية التعليق .."
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172019/http://masr.20at.com:80/article.php?sid=218&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

