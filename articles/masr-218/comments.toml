[[comments]]
order = 12
subject = "ايه يا عم كشافات"
author = "محمد علي"
posted = "2006-04-25"
text = "ايه يا عم كشافات<br />مولدات ايه<br />يا سيدي ما طز والفين طز في المسئولين ومولداتهم.....<br />لو الشعب كله ضلم علي انواره<br />مولدات المسئولين هتتضامن مع الشعب<br />المسئولين كام واحد يعني<br />مليون.......لكن الشعب 74 مليون<br />والكثرة تغلب المفسدين والحراميه والمحتالين<br />يا سيدي سيب الشعب يعمل حاجه<br />سيبه يقول لا والف لأ لاولاد....اللي بقالهم ربع قرن مزهقينا و مطهقينا وكل حاجه زفت<br />يا جماعه طفوا النور<br />واللي هيفضل فاتح نوره يبأه هوا الخاين والحرامي"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

