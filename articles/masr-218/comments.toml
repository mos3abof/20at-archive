posted = "2006-04-25"
text = "ومين يا جماعة اللي قال إن الفكرة ساذجة.. كل واحد داخل بيقول مساء الخير وبعدها يقول (رغم سذاجة الفكرة) أحب اقولكم ان رغم سذاجة تعليقاتكم إلا إني فرحان بيكم.. ده أنتوا ناس غريبة جدا... ما تطفوا النور.. ايه اللي هيحصل يعني.. هتخرب اكتر ما هي خربانة .. طفوها.. على الاقل توفير.. طفوها.. جايلك يا ضلمة"
