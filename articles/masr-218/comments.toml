subject = "فكره جامده طحن"
author = "هيثم"
posted = "2006-04-25"
text = "هايات علي كل الناس اللي هنا<br />انا اول مره ادخل الموقع ده وبصراحه عجبني وعجبتني الفكره كتييير<br />ربنا يعينكم وانا معاكم<br />وانا شايف ان الفكرة فعلا بتجسد الام الشعب ده<br />الشعب الحكومه عايزه تضلمه وهوا هيضلمها علي الحكومه<br />انا معاكم<br />وشكرا للموقع وللشخص صاحب الفكرة<br />هيثم"
