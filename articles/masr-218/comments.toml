[[comments]]
order = 78
subject = "أود أن أشارك.. و لكن"
author = "سارة نور الدين"
posted = "2006-05-23"
text = "أوجه أولاً تحية لأبطال مصر في كل الدنيا من أول القاعدين فيها إلى المهاجرين و الطيور الشاردة .<br />و للشباب الذين يودون المشاركة في العمل السياسي من منطلق الهوجة الجديدة و حملة الاعتقالات الأخيرة التي طالت من أعرفه و من لا أعرفه و أود أن أعرفه لأنه في نظري فاقني درجات عديدة و هزمني في سلم المجد إلى كل الشرفاء في نادي القضاة ، أوجه هذه الرسالة المفعمة بالحب و التقدير .. ولكن:<br />هناك شيئان نسيناهما و هما على التوالي:<br />1- لماذا لم يعلن القضاة منذ البداية عن مطالبهم صراحة و يروجوا لها أليست هذه المطالب تمس مصالح الشعب ككل؟<br />2- على الراغبين في المشاركة في السياسة و اتخاذ الطريق الصحيح فيها أن يعرفوا تماماً ما الذي يسيرون عليه من أرض و قبل كل شيء عليهم أن يفهموا إلى أين هم ذاهبون و أن يتسلحوا بسلاح العلم و المعرفة و أن لا ينساقوا وراء شعارات واهية تأخذ منهم جهدهم و عافيتهم فعلى من يريد أن يأخذ اتجاهاًما في حياته أو منحى فيها فعليه بالمعرفة أولا قبل كل شيء و بعدها لن يندم على شيء و لن يستطيع أحد أن \"يأكل بعقله الحلاوة\"."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

