author = "وليد"
posted = "2006-04-26"
text = "يا جماعة.. اللي معترض علي الفكرة يدينا بديل يقول حاجة نعملها بدل تكسيرالمجاديف ده.. هي دي السلبية بعينها.. مش عايز يعمل حاجة ومعترض علي أي فكرة من غير مشاركة فعلية.. إحنا يا جماعة بنسعي للاصلاح وده عمره ما هيبدأ من فوق. لازم يبتدي جوانا الأول. وعشان ده يحصل لازم يكون في وعي عند الناس. وده هيتحقق إن شاء الله بالحركات الشعبية زي كفاية مثلا وبأفعال جماهيرية زي طفي النور يا بهية مثلا. الفكرة عمل شئ من الحركة بدل الخمول والامبالاة وتوصيل رسالة للناس العاديين قبل الحكومة. رسالة بنقول فيها إحنا مش ساكتين ومش هنقف نتفرج ومشاعرنا مش شعارات. لا لسه فينا روح ولسه جوانا عناد. الحركة البسيطة دى لو كبرت هتتحول لحركة أكبر وأكبر لحد ما تبقي حالة غضب وثورة وعصيان. يمكن باحلم لكن من حقي أتمسك بحلمي. بس نبتدي يا جماعة.. نبتدي بأي تصعيد مهما كان شكله بسيط وساذج.."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

