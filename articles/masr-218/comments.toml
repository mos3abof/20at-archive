[[comments]]
order = 10
subject = "رسالة إلى الموقع"
author = "مصري مقيم في السعودية"
posted = "2006-04-25"
text = "الأخوة الأعزاء<br />من السعودية حيث لقمة العيش ، أتواصل معكم وأشارككم أفكاري وغلياني على كل مايحدث في مصرنا الحبيبة.<br />الحقيقه القضية تجاوزت المظاهرات والأعتصام بأعداد قليلة يمر بها الناس وقد يتضامنون بقلوبهم أو بألسنتهم أو يمصمصون الشفاه ، ثم يتابعوا السير والدوران في ساقية الذل والصراع اليومي المجنون من أجل لقمة الأولاد وكسوتهم . والأمر تجاوز كذلك أطفاء النور عليهم ( ولو أنها فكرة جميلة ) ، والمطلوب هو هزة عنيفة للشعب نفسه ، فالجو العام يشبه فترة ما قبل يوليو 52 ، والشعب يفتقد القيادة التي تقود حركته للتغيير ، والسياسة قتلت في النقابات العمالية والجامعات والتي كانت دائما طليعة التغيير والثورات .<br />الوضع الآن يتطلب تغيير للحالة النفسية للشعب ، الذي أصيب بالأكتئاب والسلبية والجمود ، والفعل اليومي المتكرر والخالي من أي مضمون .<br />ولقد تساءلت منذ عقد من الزمان ، ماذا يفعل المصريون بحياتهم ، هل ينتجون ؟ هل يبدعون مثل الشعوب الأخرى ؟ ماذا تضيف مصر ذات التاريخ والحضارة الآن إلى التراث الأنساني ؟<br />إن في إسرائيل الآن 12 براءة إختراع يوميا !! فماذا نقدم نحن ؟<br />مثل هذه الحالة تحتاج وبدون تأجيل إلى تكاتف كل القوى الوطنية ولتنزل إلى الشارع وتدعو الناس إلى الأنضمام إليها وسوف ترون النتيجة ، وإذا حاول النظام القمع في البداية فإن هذا سيشعل حماس الناس أكثر ولن يكرر الجيش أذا أستدعي للقمع مع فشل الداخلية المتوقع ، تجربة إيران الشاه عام 79 عندما قتل 14000 في يوم واحد .<br />على قدر أهل العزم تاتي العزائم ، وبقدر إحباط وغليان وإهانة هذا الشعب يجب أن تكون ثورته ، وإذا قال أحدهم أنني أقول هذا وأنا بعيد ، فإنني أقدم أولادي الثلاثة شبان ليشاركوكم هذه الأنتفاضة من بدايتها وليكونوا فداءا لهذا الو<br />اقرأ بقية التعليق .."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094350/http://masr.20at.com:80/article.php?sid=218"

