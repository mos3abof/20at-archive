[[comments]]
order = 0
subject = "من المؤمنين رجال صدقوا"
author = "حذيفة - لبنان"
posted = "2006-10-11"
text = "سبحان الله، فعلاً ذكرني بالشيخ كشك رحمه الله.<br />والله هذه عظمة الإسلام.<br />رجال صدقوا الله تخرجوا من مدرسة محمد صلى الله عليه وسلم.<br />جزى الله خيراً الأستاذ صاحب التحقيق والإخوة الأفاضل في إدارة عشرينات."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"

[[comments]]
order = 1
subject = "أهم ما جاء في هذا الحوار"
author = "ندى الحسن"
posted = "2006-10-11"
text = "السلام عليكم<br />أهم ما في هذا الحوار هو تسليط الضوء على الأزهر ودوره..لخص الشيخ وضع الأزهر بعنونته كمؤسسة رسمية،وفقدان الأزهر لدوره!<br />أيضا مصطلح\"سندوشة الاسلام\" مصطلح معبر لحالة المسلمين في الغرب الذين يريدون تلقي الاسلام بوجبة سريعة \"سندويش\"وهذا أيضا ينبه الى أسلوب الداعية الذي يجب أن يتوافق مع المكان والزمان وأي اسلام يصل في سندويش سريع!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"

[[comments]]
order = 2
subject = "الشيخ رجب كشك الصغير"
author = "روح اليقين"
posted = "2006-10-12"
text = "جزاه عن الامة الاسلامية خيرا وكثر من امثاله واجعله للشباب المسلمين قدوة يحتذى بها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"

[[comments]]
order = 3
subject = "الموضوع جميل"
author = "أشرف"
posted = "2006-10-12"
text = "الموضوع جميل<br />والشيخ رجب من الشخصيات الجاذبة فعلا<br />أسأل الله أن يثبته دوما ولا يسلط عليه أعداء الحق."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"

[[comments]]
order = 4
subject = "كشك يعود من جديد"
author = "خليل الكسيح"
posted = "2006-10-12"
text = "بسم الله الرحمن الرحيم<br />فعلا كشك يعود من جديد --------<br />ونريد كذلك أن يعود أمثال صلاح الدين - ابن الهيثم - البيروني - نور الدين محمود - وغيرهم الكثير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"

[[comments]]
order = 5
subject = "صدقت ورب العرش"
author = "أمة الله"
posted = "2006-10-12"
text = "السلام عليكم ورحمة الله وبركاته فعلا لقد صليت خلف هذا الشيخ العظيم مرات عديدة وكل مرة أكتشف أن الحمد لله على أن الأمة الإسلامية ما زالت بخير إلى الآن فعلا فإنه ينطق بكلمات لا يقوى أي من هؤلاء الدعاة على التلفظ بها أمد الله في عمره وشفاه وأعانه عل حمل لواء الإسلام ونصرة دين الله<br />وانه لا الفضل بعد الله سبحانه وتعالى على طرد وتنظيف هذه المنطقة التي يوجد بها المسجد من تجار المخدرات الذين إهتدى الكثير منهم على يده<br />وجزاك الله خيراً يأأستاذ مجاهد على هذا الموضوع الجميل الذي يجزيك الله به خيراً"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"

[[comments]]
order = 6
subject = "اكثر الله من امثاله"
author = "رنا"
posted = "2006-10-12"
text = "صدقا لم اكن اعلم ان الشيخ عنده ذلك الثبات على الحق الذي افتقدناه كثيرا هذه الايام عند كثير من الدعاة والعلماء<br />جزى الله صاحب المقال خيرا وحمى الله الشيخ وثبته واكثر من امثاله.<br />حوار رائع يحمل الكثير من المحاور الهامة المتعلقة بحياتنا ..وأسأل الله ان يعود الازهر كما كان في الماضي وكما يتمنى الشيخ القدير."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"

[[comments]]
order = 7
subject = "حماه الله"
author = "أهداف"
posted = "2006-10-12"
text = "السلام عليكم ورحمة الله<br />والله أكبر خلق فعظم ودبر .. والحمد لله على كل أمر يا أخ مجاهد أننا لا زلنا نجد من أمثال الشيخ رغم قلتهم لكنهم موجودون .. والندار أنهم مميزون كل عن الآخر ..<br />رعاهم الله وجعلهم ذخرا لهذه الأمة<br />السلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"

[[comments]]
order = 8
subject = "حوار جمييييل"
author = "أميرة بدران"
posted = "2006-10-12"
text = "حوار شيق جدا وجميل واجمل ما فيه انه بيسلط الضوء علي قصص النجاح اللي بنفتقدها دوما وسط الظلام شكرا جزيلا لك يا استاذ مجاهد ودوما دوما تبرز لنا قصص نجاح تستطيع ان تشق طريقها رغم الصعاب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"

[[comments]]
order = 9
subject = "زيزو"
author = "اولا احب اشكر الاستاذ مجاهد علي الموضوع الجميل ده عشان فعلا الشيخ رجب ده ربنا يحفظه راجل رهيييب ..."
posted = "2006-10-12"
text = "لما بصلي وراه بحس اني بصلي في الحرم<br />ربنا يزيده ويرزقه الاخلاص<br />جزاكم الله خيرا استاذ مجاهد واشوفك هناك<br />سلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"

