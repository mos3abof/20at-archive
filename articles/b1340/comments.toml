[[comments]]
order = 13
subject = "الرد على الزنديق زكريا بطرس"
author = "طه سعد محمد خلوصى"
posted = "2006-10-25"
text = "ايها الحقير الذى يسمى بزكريا بطرس اولى لك فى برنامجك ان تنظر فى ديانتك انت بدلا من الخوض فى مالايخصك ثم لماذا الاسلام بالذات الذى تتحدث عنه الم يوجد ديانات متعددة فى العالم اليوم فان دل ذلك فانما يدل على مخططكم القذر انت وامثالك للنيل من دين خير المرسلين. اما بالنسبة للكلب الذى يحاورك مقدم البرنامج الذى يزعم انه كان مسلما قبل ذلك فان كان هذا الكلام صحيحا لماذا يحتفظ بتشرفه لهذا الاسم حتى الآن الم يكن جديرا به ان يسمى نفسه اسما غير اسم احمد?<br />ولسوف ترى ايها الكلب انت ون على شاكلتك نصر الله لدينه الخاتم ونصر الله لنبيه صلى الله عليه وسلم الذى آمن به كل الرسل والانبياء بداية من آدم عليه السلام وحتى المسيح عيسى بن مريم صلوات الله وبركاته عليهم اجمعين وحسبنا الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"

[[comments]]
order = 14
subject = "ياليت جميع الشيوخ كالشيخ رجب"
author = "احمد حماد"
posted = "2006-10-26"
text = "السلاعليكم ورحمة الله وبركاته يا ليت كل من كان مسئول عن الدعوة الاسلامية كالشيخ رجب فتح الله عليه لانه يدعو الناس الى الدين باخلاص من وجه الله لاننانفتقد الاخلاص فى حياتنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"

[[comments]]
order = 15
subject = "اجمل ايام حياتى"
author = "عمرو"
posted = "2006-10-30"
text = "اكرمنى الله بأ اختم القران الكريم خلف هذا الرجل الكريم حماة الله وحفظة لقد كان هذا اليوم اجمل ايام حياتى حتى الان بكيت وبكى كل من بالمسجدلا لم يكونوا يبكون بل كانوا منهارون لقد وقعت على الارض اكثر من مرة من شدة البكاء واكثر ما اسعدنى المزاد لصالح فلسطين لقد صدق هذا الرجل فى دعائة فكنا صادقين فى التامين وراءة اللهم احفظة وان كان لى عمر اختم معة كل رمضان اينما حييت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103300/http://www.20at.com/article2.php?sid=1340"
