[[comments]]
order = 2
subject = "صناح الحياة و ......"
author = "قذائف الحق"
posted = "2006-03-27"
text = "السلام عليكم<br />أنا موافق جدا على المشروع مع بعض التعديل<br />بدل الورد نزرع مصول استراتيجي يمكن كل شارع في مصر بيحتاجه و الاول نعمل انكفاء ذاتي و بعدين نصدر و ننافس كولومبيا<br />احنا نزرع بانجوا في البلكونات و فوق السطوح<br />ايه رأيكم<br />و تحيا الحكومة<br />سلام<br />أخوكم قذائف الحق"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210521/http://masr.20at.com:80/article.php?sid=77&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "صباح الخير على الور اللي فتح في جناين مصر"
author = "كرميلينو"
posted = "2006-03-28"
text = "على فكرة دي مطلع قصيدة الفاجومي و غناها الشيخ امام لما كانوا بيستقبلوا الطلبة في المعتقلات ايام الله يجحمه السادات ( و اتبعوا في هذه الدنيا لعنةو يوم القيامة ) ( اولئك يلعنهم الله و يلعنهم اللاعنون )<br />اما موضوع الورد جميل جميل الورد<br />و شوف الزهور و اتعلم<br />الكلام ده مع انه جميل و شاعري و رومانسي صعب يحوق فينا وانا بقرا الموضوع و انامستعد نفسيا اسمع عن الطلبة المحبوسين في المعتقلات من اكثر من 10 سنين بدون اي لائحة اتهام<br />الموضوع جميل<br />بس العنوان مش مناسب حبتين"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210521/http://masr.20at.com:80/article.php?sid=77&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"
