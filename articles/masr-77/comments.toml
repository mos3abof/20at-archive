[[comments]]
order = 0
subject = "موافقة"
author = "طماطم"
posted = "2006-03-26"
text = "موافقه على الكلام دا بس انا معنديش مكان ازرع فية<br />ياترى الدولة ممكن تدينى مكان ازرع فية ورد ولا هتقول مفيش<br />الدولة دى كلامها كتير والله بجد انا اتخنقت منها<br />المشروعات دى ما هية الا ثفقات بتتوزع على ناس معينة<br />لو الدولة كلامها صح كده وبتوفر مشاريع لينا<br />مكنش الفين واحد يغرقو فى العبارة وهما راجعين من برة عشان مش لاقين شغل فى بلدهم<br />المشروع دا مشروع ورد بس كلة شووووووك<br />يارب ارحمنا بقة"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210521/http://masr.20at.com:80/article.php?sid=77&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

