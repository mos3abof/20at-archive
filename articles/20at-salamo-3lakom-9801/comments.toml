[[comments]]
order = 6
subject = ""
author = "أُختــك في الله . ."
posted = "2009-12-07"
text = "و بمـا أن ليس هناك وقت محدد لصلاة الإستخارة إلا أنه يجب تحـري أوقات الإجابة ..<br />بين الاذان و الاقامة - الساعة الأخيره من يوم الجمعة - الثلث الأخير من الليل - عند نزول الغيث - … و أي وقت غير هذا جائز حتى في الأوقات المكروهة لأنها صلاة من ذوات الاسباب<br />و أخيرًا . لا يجوز أن يُصلي أحد صلاة الإستخارة لأحـد .<br />إلـــى .. - من السعوديــة - بارك الله فيكم و نفع بكم . و جزاكم الله خيرًا على ما تم تفصيله<br />إلى أخي- تامر الصمادي - جزيتم خيرًا - فكنتم سببًا في تصحيح الأخطاءالخاصة بصلاة الإستخارة - بارك الله فيك و لك"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123935/http://www.20at.com:80/banat/variety/9801-2009-08-13-13-54-40.html"

[[comments]]
order = 7
subject = ""
author = "أُختــك في الله . ."
posted = "2009-12-07"
text = "العبد إذا قام بالإستخارة و عزم على الأمر فإنه يفعله بلا تردد بما انه لا يتعارض مع الشرع فيستخير الله ثم يسأل أهل الخبرة ,<br />ثم ينطلق و لا ينتظر رؤية أو منام و لا ينتظر راحه أو إنشراح فى صدرهِ , يقدم على الامر مباشرةً فإذا يسر الله له أمره فهذه هي نتيجة الإستخارة , أما اذا لم يتم التيسير فهذه نتيجة أيضًا و يجب الرضا بما قدره الله لنـا .<br />ومن فوائـد الإستخـــارة ..<br />1- إراحـــة النفس من الحيرة و التردد<br />2- مخالفة اهل الجاهلية الذين كانو يستقسمون بالأزلام و الذين يضربون الرمل و يحسبون النجم و يقرءون الكف و الفنجان .<br />3- اصابة سُنة من سنن النبى صلى الله عليه و سلم<br />4-اعتراف من العبد بعجزه و تبرأٌ من العبد من حوله و قوته الى حول الله و الى قوة الله ثم هو تفويض لله فى الامور و توكل عليه"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123935/http://www.20at.com:80/banat/variety/9801-2009-08-13-13-54-40.html"

[[comments]]
order = 8
subject = ""
author = "أُختــك في الله . ."
posted = "2009-12-07"
text = "قال الشوكانى .. فى قوله (( كان النبي يعلمنا الإستخارة فى الأموركلها)) قال فى هذا دليل على العموم و إن المرء لا يحتقر أمـرًا لصغره وعدم الإهتمام به فربُ أمر صغير يكون الإقدام عليه خطير و عظيم الضرر<br />و لذلك النبي صلى الله عليه و سلم قال ليسأل أحدكم ربه حاجته كلهــا حتى يسأله شسع نعله اذا إنقطع ..<br />في أي الأمور تجوز الإستخارة ؟<br />لا تجوز الإستخارة في واجب و لا سُنة و لا حرام و لا مكروه<br />فلا يجوز لي عمل إستخارة بصوم رمضان ( لأنه واجب )<br />ولا يجوز لي عمل إستخارة في إرتداء الحجاب ( لأنه واجب و فرض )<br />ولا يجوز لي الاستخارة في شرب الخمر ( لأنه حرام )<br />تجز الإستخارة فقط في المُبــاح و هو ما خلى من المدح و الـذك أي مستـوي الطرفيــن , فعل المُبـاح لا يأتي بحسنات و تركـه لا يأتي بسيئات هذا ما يمسى بمستوى الطرفين<br />و المباح مثل .. الزواج - السفر المُباح - إنشاء شركة<br />كيف لي معرفة نتيجة الإستخارة ؟<br />من الأخطاءالمرتبطة في أذهان الناس أن الإستخارة تكون قبل النوم مباشرةً حتى كون النتيجة هى رؤية و هذا من الخطـــــأ , فلا ترتبط الإستخارة برؤية على الإطلاق , و ليست مرتبة أيضًا براحــة في الصــدر"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123935/http://www.20at.com:80/banat/variety/9801-2009-08-13-13-54-40.html"

[[comments]]
order = 9
subject = ""
author = "أُختــك في الله . ."
posted = "2009-12-07"
text = "السلام عليكم . .<br />كان النبي صلى الله عليه و سلم يعلم أصحابه صلاة الاستخارة كما يعلمهم الآيـــة من القــرآن كما جاء فى الحديث الصحيح الذى رواه الامام البخارى ..<br />شرع الله صلاة الاستخارة لإخراج العبد من الحيرة و التردد بين أمرين (( مُباحين )) فعندها نُفَوِّض الأمر و الإختيار لله و نتوكل عليه و نرضى بمـا قدر ..<br />أو التردد فى شراء شقه أو محــل … إلخ<br />و تُســن الاستخارة لمن أراد أمر مباح و إلتبس عليه وجه الخير فيه فيصلى ركعتين من غير الفريضه و لو كانت من السنن الراتبة يعنى سُنة الضهر و إنها إستخارة وهذا يجوز<br />ومتى نصلى الاستخارة صباحًا أم مساءًا ؟ يجوز بعد العصر؟ وهو وقت كراهة ؟ نعم يجوز لأنها من الصلوات (( ذوات السبب )) فيجوز أن تُصلى فى وقت الكراهة<br />وتقرأ فيها بمـا شئت من السور ثم تحمد الله و تصلى على النبي ثم تدعـو بالدعاء"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123935/http://www.20at.com:80/banat/variety/9801-2009-08-13-13-54-40.html"

