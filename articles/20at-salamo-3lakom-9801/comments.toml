text = "أعتذر فقد أخطأت في كتابة الفقرة قبل الأخيرة وهذا تعديلها ..<br />( وأمر أخير ربما يستخير المرء على الشروع في أمر ما ويتيسر ولكنه لا يوفق ، هذا لا يعني أن الاستخارة لم تكن نافعة ، بل يعني أن الإخفاق في هذا الأمر تحديدا ومروره بهذه الخبرة هو لصالح المستخير وهذا ما لا يعلمه إلا الله سبحانه وتعالى ) ."
