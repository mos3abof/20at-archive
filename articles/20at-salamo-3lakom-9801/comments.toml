author = "من السعودية"
posted = "2008-08-06"
text = "مع احترامي لتامر الصمادي وعشرينات ، ألا ترون معي أنه من المجحف عرض الحالات السلبية فقط ، هذا أمر .. أما الأمر الآخر ، فهوإن صلاة الاستخارة يلزمها أن يكون المستخير جازما على القبول سواء بالعمل أو الزواج أو السفر أيا كان الأمر .. فقد قال النبي عليه الصلاة والسلام إذا ( هم ) أحدكم بالأمر فليركع ركعتين من غير الفريضة ، ثم ليقل :\\\" اللهم إني أستخيرك بعلمك ، وأستقدرك بقدرتك ، وأسألك من فضلك العظيم فإنك تقدِرُ ولا أقدِرُ ، وتعلم ولا أعلم ، وأنت علام الغيوب ، اللهم إن كنت تعلم أن هذا الأمر -يسمي حاجته - خير لي في ديني ومعاشي وعاقبة أمري - أو قال : عاجلة وآجله - فاقدره لي ويسره لي ، ثم بارك لي فيه ، وإن كنت تعلم أن هذا الأمر شر في ديني ومعاشي وعاقبة أمري - أو قال : عاجله وآجله - فاصرفه عني واصرفني عنه ، واقدر لي الخير حيث كان ، ثم ارضني به \\\". ( رواه البخاري146/<br />إذن هو أولا : يصلي ركعتي الاستخارة .<br />ثانيا : يشرع في عمل ما قصده في استخارته .<br />ثالثا : النتيجة ( إذا كان الأمر خيرا له ، فسيتيسر .. ولإن كان شرا ، فيتعسر ويصرف ) .. وهذا نستنتجه من كلمات الدعاء ، ومن الخطأ أن نعتقد أنه سيعرض لنا رؤيا في المنام ، أو نختبر حالة نفسية ، نعم ربما يمر بعضنا بذلك ولكن حدوثه ليس لزاما .. وهذا واضح من نص الدعاء .<br />والاستخارة تكون على القبول والرفض أيضا ، كأن تستخير الفتاة على رفض خاطب لها لم يعجبها ، أو وظيفة قررت عدم القبول بها .<br />وأمر أخير ربما يستخير المرء على الشروع في أمر ما ويتيسر ولكنه لا يوفق ، هذا لا يعني أن الاستخارة لم تكن نافعة ، بل يعني أن عدم الإخفاق في هذا الأمر تحديدا ومروره بهذه الخبرة هو لصالح المستخير وهذا ما لا يعلمه إلا الله سبحانه وتعالى .<br />مع تمنياتي للجميع بأعمال موفقة تصحبها نيات طيبة .."
archived = "2009-08-15"
capture_url = "https://web.archive.org/web/20090815000227/http://www.20at.com:80/20at/salamo-3lakom/9801-2009-08-13-13-54-40.html"

