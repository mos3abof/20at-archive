text = "حستى مبارك حا يعرف ايه بس<br />هو حا يلاحق عليه ولا ايع ولا اي ولا ايه<br />على راآالفنان القدير الى نان مس فاكر اسمه<br />اعتبك على ايه ولا ايه ولا ايه<br />الصراحه والصراحه راحه انا خايف اكتب حاجه لاحسن القى المخبارات العامه مكسره الباب ووخدانى على بالى بالكم<br />لا يعم انا مقولش حاجه علشان اعيش احسن"
