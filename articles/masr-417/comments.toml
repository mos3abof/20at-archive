author = "مواطنيتمني الموت ويري رجل يحب مصر"
posted = "2006-11-04"
text = "اقسم ان الحاكم ده هو وابنه لن يخرو راكعين الاازا وضعناهم بالقوه في وضعنا نحن الزين لايملكون ثمن العلاج وكفانا قول حزبي الله ونعم الوكيل<br />اتمني ان يخرج من صلب جيشنا رجالا مخلصين وييضعون هزا المنوفي ومن تبعه في ميدان رمسيس ويقولون اللوه حاجه عنده ياخد حقه منه يارب اعيش لما اشوف يوم فيهم وحزبي الله ونعم الوكيل"
archived = "2006-11-17"
