[[comments]]
order = 0
subject = "الطوارئ المستوطنة..في مصر!"
author = "لم تعرف القارة الأفريقية كلها نظاما أكثر حقارة ونذالة وعمالة وخيانة وإهدارا لموارد بلد غني مثل نظام اللامبارك وسلفه الديوث السادات لعنهما الله ومن يحبهما، ومن يسير على ضلالهما."
posted = "2006-05-31"
text = "المشكلة أخطر مما تخطر ببال أحد من حضراتكم، مهما بالغ في التشاءم.<br />منذ عام سبعين والمخطط لإفراغ مصر من كل عناصر القوة والمقاومة وإستقلالية القرار يسير سيرا حثيثا مطردا، بخطوات تترواح فيها السرعة بين العدو والسير الحثيث، واليوم بعد أن أوشك المشروع على أن يؤتي أكله، وتم للأمريكان أكثر مما حلموا به، يقل لي أحدكم أنهم تاركوكم تغيرون النظام، وتستبدلوه بآخر وطني؟<br />لايصدق هذا الأمر إلا من يغالط نفسه، ومن قربت عليه مواقع النجوم!<br />كفانا خداعا لأنفسنا، ولنقف مع النفس وقفة صادقة نجس فيها مواقع الضعف والقوة فينا وفي أعدائنا في الداخل والخارج. ومن ثم نوجه ضربات مركزة متتالية تفقد العدو اللامبارك وزبانيته الأوغاد توازنهم فيخرون وقوعا!<br />قبل ذلك رجاءا إتفقوا على قيادة تتمتع بالشفافية والوضوح، ذات برنامج واضح المعالم وخطط مدروسة للحاضر والمستقبل. ولابد أن يجتمع لهذه القيادة تأييد ثلاثي إن كان لها أن تنجح، وأولها التأييد لمحلي الشعبي، وتأييد دول الجوار أو على الأقل دولة منها، وتأييد دولي، أو على الأقل قبولا!<br />وهذة الشروط التي ذكرت آنفا أعز منالا اليوم من الغراب الأعصم، وعذرا إن وجهت نقدي الصريح لحركة الإخوان بالتحديد، لأني لاأثق بكفاية جدا، وعندي ما يجعلني أن أضعها مع النظام اللامبارك بسلة مهملات واحدة.<br />حركة الإخوان للأسف وهذا يمزق نياط القلب، لم تتمتع قيادة منها لابالشفافية ولابعد النظر ولا الصدق مع الذات أو المريدين والمخلصين، وكل أولئك مرجعه في معظمه أن \"الفهلوي\" عندهم يقوم مقام العارف الخبير. سادتي وإخوتي في الدي<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133034/http://masr.20at.com:80/article.php?sid=417"

[[comments]]
order = 1
subject = "تكملة"
author = "سادتي وإخوتي في الدين، لاتغني فهلوة عن دراسة وتخطيط وتمحيص."
posted = "2006-05-31"
text = "خليفة الإمام حسن البنا رحمه الله، الهضيبي تسبب بكوارث لايقدم عليها أي هاوي في السياسة، ومع أني لاأصدق رواية الإخوان بأن فاروق هو قاتل الإمام، ففاروق كان أعقل من ذلك، إلا أنني أعجب من عجرفة وحمق الهضيبي، وقد لجأ اليه الملك وكان هناك متسع لأن يتولى الإخوان رئاسة الحكومة.<br />نفس الشئ حدث مع ناصر، وعجرفة الهضيبي وعدم مرونته وفهمه لقواعد اللعبة كانت سببا في صراع مرير مع أنظف نظام عربي وإسلامي عرفناه في العصر الحديث. إنصافا للإخوان المسلمين، فإن تعامل المرحوم ناصر مع ملف الإخوان برمته كان لا يمت للحكمة بشئ، ووضع كما يقولون السيف موضع الندى والعفو ولم الشمل.<br />ظل الإخوان ولايزالون ينكرون أنهم طالبو حكم، كأن طلب الحكم أمر فيه عيب، والحقيقة كانت عكس ذلك، والإخوان بالغوا إبان الخمسينيات بتقدير قدارتهم وحضورهم الجماهيري، وكانوا ضد إقامة حياة نيابية وضد إنتخابات يعلمون أنها ستأتي حتما بحكومة وفدية، وكل الشهود العدول يؤكدون بأن الضباط الأحرار كانوا زاهدين في الحكم بأول الأمر، لعدم وجود تصور واضح لديهم أو خطة واضحة. متى ننضج سادتي ونفكر قبل أن نتحرك ونضرب؟<br />لإقامة حكم على هدي القرآن والسنة المشرفة، لابد لنا أولا أن نصيغ منهما نصوصا ولوائحا واضحة، وأن يتضافر على صياغتها علماء وعقلاء الأمة بكل علم ومجال، ولا يكون مجهود فردي أو إجتهاد يتيم، فهل تم ذلك منذ نشأة الإخوان لليوم؟ وأن تلك النصوص على شكل قانون نلزم جميعا بإتباعه بدل الفرنسي والروماني وغيره؟"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133034/http://masr.20at.com:80/article.php?sid=417"

