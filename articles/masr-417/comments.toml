subject = "سؤال سازج جدا"
author = "احمد طارق"
posted = "2006-06-01"
text = "أرسل هذا التعليق بواسطة : احمد طارق<br />السيد رئيس الحمهوريه كل يوم بيقول انه ديموقراطى ماشى حنصدقه<br />طيب الديموقراطى اكيد بيؤمن بتداول السلطه<br />يعنى ببساطه ان ممكن ييجى يوم ويكون هو فى المعارضه<br />فهل يرضى مبارك عندما يكون فى المعارضه ان يضرب بالجزمه ويسحل ويبرك على صدره خمسه من الحوش والاوباش ضباط السافاك اسف قصدى ضباط الداخليهويتهكوا عرضه وعرض المحروس جمال"
archived = "2006-06-15"
