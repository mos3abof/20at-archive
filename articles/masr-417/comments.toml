subject = "مطلوب تغطية المزيد من الندوات"
author = "م.ن"
posted = "2006-06-01"
text = "أولاً شكراً على تغطية الندوة , و الحقيقة فى ندوات كتير فى كل مكان و من الجميل اننا نغطيها لأن يتقال فييها كلام جميل جداً ....<br />بالنسبة للطوارىء فطبعاً مبارك لحس وعده بإلغائه ! و ده كان متوقع زى كل وعوده الى لحسها و قانون مكافحة الإرهاب الى بيتكلموا عنه هيكون أفظع من قانون الطوارىء !<br />لا تنتظروا شىء حسن من أمثال هؤلاء"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133034/http://masr.20at.com:80/article.php?sid=417"

