subject = "حراام"
author = "hany"
posted = "2006-03-23"
text = "ياخساااااارة كان نفسى اشوفو ؟؟؟<br />نفسى اسافر لمرسى مطروح او السلوم علشان اشوفو ككسوف كلى للشمس؟؟<br />لكن انا هنا من الصعيد وهنا مش هيحصل كليا ؟<br />نفسى حد يرد عليا هل هنا فى الصعيد هيحصل حتى كسوف جذئى ؟؟؟"
