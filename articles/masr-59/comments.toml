subject = "جميل جدا"
author = "dark angel"
posted = "2006-03-24"
text = "اكيد اليوم هايكون يوم جميل جدا انا عن نفسى هاكون متشوقة انى اشوفه.<br />بس انا برد على هانى بقوله ان اكيد يعنى انا مش متاكده ان على الاكل ممكن يحصل كسوف جزئى فى بقية القاهرة مش مرسى مطروح بس"
