subject = "وهم الإخوان المسلمين"
author = "بسم الله الرحمن الرحيم"
posted = "2006-05-17"
text = "يا اخي الكريم وجود تعاليم تتفق مع الدين وتأمر بطاعة الله لا ينفي عن الجماعة أي تهمة فالدين أحد أهم الوسائل التي تستخدمها أي جماعة سياسية وإنما نستشف الغرض الحقيقي من بين السطور ومن تنفيذ التعاليم على أرض الواقع فهل رأيت من قبل إرهابيا يقول (أنا إرهابي ملعون وأريد أن يتبعني أصحاب العقول الضعيفة حتى أحكم البلاد حكما مستبدا وأروع الآمنين) بالطبع لا ولكن أي حركة تسعى لاستخدام الدين وبذلك يمكنها خداع الناس فحتى الحروب الصليبية نفسها كان لها غطاء ديني وهذا مجرد مثال أرجو ألا يساء فهمه. ووجود هذه التعاليم أمر ضروري لاستقطاب بعض المتدينين حتى لا ينتبهوا للسم المدسوس في العسل فهل مثلا مقاطعة كل من يعارض فكر الإخوان المسلمين هو أسلوب متحضر يتفق مع الدين الحنيف؟ ولنا أن نسأل هل إذا حكمنا عضو من الإخوان المسلمين هل سيقاطع كل من يعارضه؟ وكيف يطالبون بعد ذلك بالديموقراطية؟ كما أن المعارك الفكرية ليس فيها جنود وثكنات وقادة وأوامر تنفذ على الفور وحتى إذا افترضنا ذلك فالأمر لم يكون مجرد معركة فكرية بل كان هناك فريق كشافة تابع للإخوان تتطور إلى تنظيم سري مسلح ارتكب الكثير من الجرائم من أبرزها اغتيال المستشار أحمد بك الخازندار وقضية السيارة الجيب الشهيرة التي ضبطت صدفة وضبط فيها مستندات تدل على تخطيط لأعمال إرهابية وبعد ذلك محاولة اغتيال جمال عبد الناصر ومحاولة الإنقلاب عام 1965 والقائمة طويلة جداْ وموجودة في الكتب التي ذكرتها التي أرجو منك ومن كل القراء للمرة الثالثة قراءتها مع ملاحظة أن الوقائع السابقة اعترف بها اعضاء من الإخوان المسلمين ذاتهم وأريد أن أعرف هل أيضا عبد الله إمام ومكرم محمد أحمد وكل المعارضين للإخوان المسلمين يعتقدون أن الإسلام في الجامع فقط؟ وهل تظنني أنا أيضا أعتقد ذلك؟<br />والسلام عليكم ورحمة الله وبركاته."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

[[comments]]
order = 21
subject = "الاخوان احسن من غيرهم"
author = "بسم الله الرحمن الرحيم"
posted = "2006-05-17"
text = "الحكاية شكلها كدة مش هاتخلص وهانعد كل يوم نرد على بعض. بس مش مشكلة<br />يعنى معلش انا دايما بحب اتكلم فى نقاط<br />1-حضرتك قعدت تتكلم كتييير اوى ان التعاليم الاسلامية ما تنفيش التهمة بس كلام حضرتك فى النقطة دى كله مبنى على افتراض او ظن او اعتقاد او تفكير او شك عند حضرتك انت ان الاخوان لهم هدف تانى غير الدين ودا رأى حضرتك الشخصى ومش لازم يكون صح. زى ما انا قلت قبل كدة واحد بيقول يجب استشعار مراقبة الله دائما فى السر والعلن ودا يعنى ان هو عارف ان الله اعلم بالسر واخفى فمش معقول بيقول كدة وفى نفس الوقت يبقى بيستغل الدين<br />2-مسألة بأه \"مقاطعة كل من يعارض فكر الإخوان المسلمين\".معلش اعذرنى حضرتك فهمت النقطة دى من التعاليم غلط خالص لان الاستاذ البنا\"تقاطع من كان الاتصال به ضد مصلحة دعوتك\"والشىء اللى يعارض الفكر غير اللى يؤذى الفكر ويوقفه<br />يعنى مثلا- على سبيل الافتراض- لو جماعة قالت احنا هانمشى فى الشارع نقطع الدعاية بتاعت الاخوان .اهو دا يضر بالفكر والدعوة مش يعارضه وبس ولذلك يجب مقاطعته.<br />لكن المعارضة الفكرية غير مفيش منها ضرر بل بالعكس فهى شىء ضرورى لاختلاف المفاهيم والاراء والعقول.بدليل انى برد عليك اهو مش مقاطعك يعنى ودليل ان قيادات الجماعة مش مقاطعين اصحاب الافكار المختلفة (اتمنى يكون المعنى وصلا)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

