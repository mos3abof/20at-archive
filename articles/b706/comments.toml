text = "واحب اقول ليه احنا عايزين نحاسب الاخوان على حاجات نظن انهم هايعملوا ونشكك فى نواياهم فى حين ان النظام بيعمل كل حاجة وحشة فى البلد وماحدش بيقول \"بم\" حتى القضاه بيضربوا<br />ليه الجهود ما تتوجهش فى اتجاه واحد ونسبنا بأه من الخلافات اللى بينا<br />ولا هو على رأى المثل \"مش قادر على الحمار بيتشطر على البردعة\"<br />انا ما اقصدش التشبيه علشان محدش يفهم الكلام غلط بس انا قصدى المعنى بس<br />وشكرا"
