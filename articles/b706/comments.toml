[[comments]]
order = 17
subject = "وهم الإخوان المسلمين"
author = "بسم الله الرحمن الرحيم"
posted = "2006-05-15"
text = "من قال أن الإخوان أحسن من غيرهم؟ وبغض النظر عن مدى اتفاقنا أو اختلافنا مع رفعت السعيد فما هو موجود في الكتب المذكورة وقائع حقيقية وهذا هو السر بل الأسرار الخطيرة التي ستكشف الإخوان بالفعل ولنتناقش في هذا في مرة أخرى عندما نكون قد قرأنا سوياْ الوثائق الضرورية في هذا الأمر. والآن نعود إلي رسالة التعاليم فالنقطة 25 كانت \"أن تقاطع المحاكم الأهلية وكل قضاء غير إسلامي، والأندية والصحف والجماعات والمدارس والهيئات التي تناهض فكرتك الإسلامية مقاطعة تامة\" ولنلاحظ أن البنا لم يقل \"هيئات غير إسلامية\" وإنما قال التي تناهض فكرتك الإسلامية أي من يعارض الإخوان المسلمين وكأن الإخوان فقط هم المسلمين ومن سواهم ليس مسلما ونفس الأمر يتكرر في النقطة 37 وهذا بالإضافة إلى صيغة الكلام في النقاط المذكورة وكلمات \" كتيبتك- أن تعمل على نشر دعوتك في كل مكان وأن تحيط القيادة علمًا بكل ظروفك ولا تقدم على عمل يؤثر فيها تأثيرًا جوهريًا إلا بإذن، وأن تكون دائم الاتصال الروحي والعملي بها، وأن تعتبر نفسك دائمًا جنديًا في الثكنة تنتظر الأوامر\" وكأننا في معركة لا في دعوة. وأعود لأسألك نفس السؤال هل قرأت لرفعت السعيد وعرفت أنه يقدم نقد تجريح وليس نقد عقلانى؟ لاحظ أنه لم يشتم حسن البنا قط في هذين الكتابين وكان يذكره بالأستاذ البنا وأنهى الكتابين بكلمة \"هذا ما أعتقد\".<br />والسلام عليكم ورحمة الله وبركاته."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

[[comments]]
order = 18
subject = "الاخوان احسن من غيرهم"
author = "ايوه الاخوان احسن من كتير غيرهم على الاقل مش زى اللى بيدعى انو من المعارضة فى حين هو بيتمرغ فى حضن النظام وابسط حاجة النائبين بتوعه ما حضروش الجلسة بتاعت مد قانون الطوارىء يمكن كان وراهم مشوار اهم من الطوارىء؟!الله اعلم"
posted = "2006-05-15"
text = "يعنى حضرتك كنت بتتكلم المرة اللى فاتت عن 5 نقاط دلوقتى قلوا شوية دا شىء كويس ربنا يكرم.<br />واحب برده اقول ان رسالة التعاليم 38 نقطة كلها تدل على ان دعوة الاخوان هى دعوة اسلامية صرف وكلها تعاليم لزيادة القرب من الله عز وجل .ومعلش انا هاذكر جزء منها على سبيل المثال<br />1-ان يكون لك ورد يومى ثابت من القرانوتحسن تلاوة القران والتدبر فى معانيه<br />5-ان تهتم بالنظافى فى كل شىء<br />7-ان تكون وافيا بالعهد والكلمة والموعد مهما تكون الظروف<br />8و9و10و11-ان تكون شجاع وافضل الشجاعة الاعتراف بالخطأوالصراحة فى الحق وتملك نفسك عند الغضب وتكون شديدالحياء وتكون عادلا وتقول الحق ولو على نفسك او اقرب الناس(طبعا انا باختصر فى كل نقطةعلشان الوقت)<br />13-ان تكون رحيم القلب حسن السلوك مع الناس<br />19و20-تبتعد عن الميسر والربا ووسائل الكسب الحرام<br />26- تديم مراقبة الله وتذكر الاخرة وتستعد لها وتتقرب الى الله بنوافل العبادة من صلاة الليل<br />31-تجدد التوبة والاستغفار وتبتعد عن الاثام الصغيرة والكبيرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

[[comments]]
order = 19
subject = "تابع الاخوان احسن من غيرهم"
author = "معلش انا اسف على التطويل بس حبيت اذكر جزء قليل جدا من الرسالة علشان الصورة تتضح بس ويبان ان دعوة الاخوان هى فى الحقيقة دعوة اسلامية صادقةو دعوة نقية جاوزت المطامع والاهواء واكبر دليل على ذلك النقطة اللى بتقول تكون دائم المراقبة لله فكيف برجل يراقب الله فى كل شؤنه ان يتهم بهذه الاتهامات"
posted = "2006-05-15"
text = "بخصوص النقطة :<br />25-حضرتك بتقول ولنلاحظ أن البنا لم يقل \"هيئات غير إسلامية\" وإنما قال التي تناهض فكرتك الإسلامية أي من يعارض الإخوان المسلمين وكأن الإخوان فقط هم المسلمين ومن سواهم ليس مسلما. طيب ماهو قال قضاء غير اسلامى اهو وبعدين من قال ان الاخوان فقط هم اللى مسلمين لا يا فندم مش معناها كدة<br />كل الناس مسلمين ونحن لا نكفر احد ولكننا نقدم الاسلام كما نفهمه باختصار \"دين شامل لكل مناحى الحياه\"فى ناس بتعتقد ان الاسلام فى الجامع وبس زى د/رفعت السعيد مثلا والدلائل على ان الاسلام شامل السياسة والاقتصاد و.....الخ كتير جدا لو تحب نتكلم فيها<br />مسألة بأه كتيبتك وجندى وكانها معركة.ايوه فعلا هيا معركة بس معركة من غير اسلحة يعنى معركة فكر.<br />اتمنى من الله ان يكون المعنى وصل واضحا<br />واحب اقول فى النهاية كلمة للاستاذ البناوهى\"ونحب ان يعلم قومنا-وكل المسلمين قومنا-انهم احب الينا من انفسنا وانه حبيب الى هذه النفوس ان تذهب فداء لعزتهم ان كان فيها الفداء\"<br />فوالله الذى لا اله الا هو يا اخى العزيز انى احبك فى الله واحب اقولك فى النهاية ان اختلاف الرأى لا يفسد للود قضية<br />وعذرا مرة اخرى على التطويل وجزاكم الله خيرا والسلام عليكم ورحمة الله وبراكاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

