subject = "الاخوان حركة سياسية في إطار إسلامي"
author = "لماذا حركة الاخوان برأي هي حركة سياسية تتخذ من الدين لباسا لها؟ الجواب لأنها لا تلتزم بما جاء به الإسلام الموروث من القرأن والسنة والسلف الصالح والأدلة كثيرة منها :"
posted = "2006-05-25"
text = "1/ إيمان الاخوان بالقاعدة الشرعية الخطيرة وهي \" عند الضرورات تباح المحرمات \"وهذه مصيبه بحد ذاتها<br />2/ إيمانهم بجواز أن تفجر نفسك بالمتفجرات لكي تقتل العدو , مع العلم أن علماء المسلمين أمثال إبن باز وبن عثيمين رحمهم الله يرونه إنتحارا<br />3/يرون بجواز الأناشيد الاسلامية التي يصاحبها تطعيمات صوتية من ألة الأورج على شكل أهات ولكنها بالنهاية تسمع كأنها ألة موسيقية<br />4/حلقهم للحاهم وتقصيرها والثابت عن النبي صلى الله عليه وسلم إطلاقه لها<br />يتبع بعدالامتحانات ,,,"
archived = "2006-11-02"
