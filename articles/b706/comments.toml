[[comments]]
order = 12
subject = "من الارهابى؟"
author = "الاستاذ اللى داخل حامى اوى ده وبيقول الاخوان ارهابيين."
posted = "2006-05-11"
text = "هدى نفسك شوية.وبلاش اسلوب الردح دا<br />اولا الاخوان معروفين عند كل العاقلين والمنصفين انهم يمثلوا الاتجاه المعتدل ويرفضون العنف والارهاب والاستاذ المرشد اكتر من مرة ينتقد ويدين العنف والعمليات الارهابية<br />ومعلش ما فيش عاقل يقول غير كدة<br />بس انا عايزك يا ريت تقولى ايه رأيك فى حكومة بتضرب القضاه والصحافين وتعتقل اساتذة الجامعات ؟يا ترى دى حكومة ارهاب ولا لا؟<br />ونرجع نتهم الاخوان بالرهاب.بلاش كدة بأه<br />ومعلش انا اسف على الاسلوب الحاد فى الكلام<br />بس الحق حق<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

[[comments]]
order = 13
subject = "وهم الإخوان المسلمين"
author = "بسم الله الرحمن الرحيم"
posted = "2006-05-13"
text = "لقد قرأت رسالة التعاليم للبنا ولاحظت أنها والعديد من كتابات الجماعة تدعو لسيطرة كاملة للمرسد على أعضاء الجماعة وانعزال أفرادها عن المجتمع وهروبهم من أي مناقشة أو حوار ومثال ذلك رقم و 25و24و36و 37و 38في واجبات الأخ العامل ويمكنكم الإطلاع على رسالةالتعاليم في موقع www.ikhwanonline.com وأن تتأكوا مما أقول وكفانا من أوهام وأساطير الإخوان والكلام عنهم وكأنهم اطهر خلق الله أو صديقين وشهداء.<br />نصيحة لكم افرأوا الكتب التالية:<br />الإرهاب المتأسلم لماذا ومتى وإلى أين؟ د. رفعت السعيد<br />حسن البنا متى وكيف ولماذا؟ د.رفعت السعيد<br />عبد الناصر والإخوان المسلمون عبد الله إمام.<br />هل لديكم رد على ما هو مثبت في هذه الكتب؟<br />والسلام عليكم ورحمة الله وبركاته."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

[[comments]]
order = 14
subject = "الاخوان احسن من غيرهم!!"
author = "الاستاذ اللى فوقى اللى بيتكلم على رسالة التعاليم-اللى هى اصلا للاخوان فقط المؤمنون بفكرتهم كما ذكر الاستاذ البنافى بدايتها-يعنى حضرتك جايبلى خمس نقاط من 37 ومع ذلك انا هاوضح النقاط اللى حضرتك قلت عليها"
posted = "2006-05-13"
text = "النقطة:<br />24 -ان تعمل مااستطعت على احياء العادات الاسلامية واماتة العادات الاعجمية مثل القاء التحية -يعنى نقول سلام عليكم مش هاى وصباح الخير-والطعام والشراب ..الخ وان نتحرى السنة المطهرة فى ذلك (فيها ايه دى)<br />25- ان تقاطع كل ما هو غير اسلامى من قضاء غير اسلامى-يعنى حكم يخالف الشريعةالاسلامية-وانديه وصحف غير اسلامية<br />36-ان تعرف اعضاء كتيبتك معرفة تامة وتؤدى حقوق اخوتهم كاملة من الحب والتقدير والايثار(ودى فيها ايه دى)<br />37-ان تتخلى عن الصلة بأى جماعة لا يكون الاتصال بها فى مصلحة دعوت(طيب وايه المشكلة فيها.الراجل بيتكلم مع واحد أمن ومقتنع بفكرته)<br />38-ان تعمل على نشر فكرتك فى كل مكان(طيب وايه اللى يزعلك فى كدة)<br />مع التاكيد مرة ثانية ان الاستاذ قال فى بداية الرسالة ان الكلام دا للاخوان فقط وليس لكل الناس كما هو الحال فى باقى الرسائل.<br />هو دا بأه يا سيدى السر الخطير اللى هايكشف الاخوان على حقيقتهم.<br />انا بصراحة مش شايف فى الكلام دا الا كل خير واتباع لهدى الرسول (ص)<br />واخيرا. د/رفعت السعيد معروف بكرهه الشديد للاخوان وكل ماهو اسلامى ودا مش جديد عليه وهو دائما بيقدم نقد تجريح وليس نقد عقلانى وبناء<br />وفى النهاية اسف على التطويل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

