order = 37
subject = "وهم الإخوان المسلمين"
author = "بسم الله الرحمن الرحيم"
posted = "2006-07-10"
text = "أولاْ يجب أن أوضح أن جميع تعليقاتي حتى الآن منشورة تحت عنوان \"وهم الإخوان المسلمين\" وليس لي علاقة بأي تعليق آخر وثانياْ أنا لا أنتمي لحزب التجمع ولا لأي حزب أساساْ واعتراضاتي على الإخوان ليس لها علاقة برفعت السعيد ولا أظن أن كل من يعارض الإخوان له ندوة مع عصام العريان أثبت فيها خطأه هذا إن كان بالفعل أثبت أخطاء رفعت السعيد في هذه الندوة وثالثاْ لا داعي للتجاوز اللفظي يا سادة لأن هذه محاورة يفترض أنها متحضرة بين أشخاص يفترض أنهم محترمون.<br />والسلام عليكم ورحمة الله وبركاته."
archived = "2006-11-02"
