posted = "2006-04-18"
text = "أعلم أن الموقع يهاجم الفساد وفكرة التوريث وبلطجة الانتخابات .الخ ...<br />ولكن هذا لا يعني بالضرورة أن مايمدحه الموقع يكون هو الصالح .. ومايذمه الموقع هو الفساد بالضرورة .. ولايعني أيضاً أن الإخوان المسلمون كجماعة على الرغم من تنظيمها الجيد وانتشارها أن أعضائها هم المرسلون الطاهرون الطيبون الخالون من المتناقضات ..<br />أرحمونا .. أنا معاكم في نقد الفساد بس مش معنى كده إنكوا تفرضوا علينا الإخوان .. مع احترامي (لأفكارهم) و ( أدبياتهم ) و (رسائل إمامهم الملهم ) .. دول مجرد بشر ومفيش داعي من الآخر كده نستغل الدين علشان نوصل للحكم والتلاعب بمشاعر الناس ...<br />وشكرا ياسادة"
