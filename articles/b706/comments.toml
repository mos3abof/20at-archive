order = 22
subject = "تابع الاخوان احسن من غيرهم"
author = "3-مسألة باه\"فريق كشافة تابع للإخوان تتطور إلى تنظيم سري مسلح \".فان النظام الخاص هو مفخرة الاخوان المسلمين واصلا ظروف الاحتلال فى ذلك الوقت كانت تستدعى ذلك والوضع دلوقتى غير زمان خالص وبعدين النظام الخاص انتهى بخروج الاحتلال من مصر يعنى دا كان فى ظل مقاومة مشروعة للاحتلال زى حماس دلوقتى مثلا وحضرتك ذكرت حادثتين ولم تذكر الدور-الذى لا ينكره الا جاحد-الكبير لهذا النظام فى مقاومة الانجليز فى مصر بل والعمل على طردهم وايضا تدريب الفدائيين الذين هم خارج الاخوان وكذلك ايضا دوره الكبير فى حرب فلسطين 48 وذلك بشهادة قائد الجيش المصرى فى فلسطين أن ذاك اللواء/احمد على المواوى.ومع ذلك فان الحادثتين اللى حضرتك ذكرتهم كانوا تصرف فردى وليس قرار من قيادة الجماعة وقد اكد الاستاذ البناعلى ذلك وكون بأه بعض الناس بتقول ان هو اللى امر وهو بيضحك علينا فدا برده مسأله افتراض ليس له اى حقيقة وبعدين نقول\"هلا شققت عن قلبه\"يعنى من الاخر اللى عمل كدة كان شباب عنده حماس زياده وهو طبيعى معاه سلاح بيقاوم بيه الانجليز فشاف ان الراجلين دول كانوا ظالمين اخدته الحمية وعمل كدة بتصرف فردى."
posted = "2006-05-17"
text = "واحب اقول برده ان مفيش حد معصوم ومفيش عمل بدون اخطاء بس الاخطاء لا يجب ان تنسينا الفضائل وما يبقاش موضوع تصيد للا خطاء ولا ايه؟اصل احنا لو هانتصيد الاخطاء لبعض هانطلع بلاوى.ومش هانخلص<br />4-موضوع بأه الاغتيال فناس كتيييييير كتبوا وفالوا ان دا كان فبركة فى فبركة بس اهو موضوع لاعتقال الاخوان وخلاص .واظن حضرتك تعرف ان الاخوان لهم الفضل الاكبر بعد الله عز وجل فى قيام الثورة -طبعا قبل ما عبد الناصر يرجع فى كلامه وينقل على الاخوان بعد ما كان معاهم-ولعلك تعرف ان واحد من الحرس الجمهورى لعبد الناصر كان من الاخوان بس ماحدش يعرف ولما عرفوا سنة 65 قبضوا عليه ومات فى السجن الحربى يعنى لو كان عايز يغتاله كان سهل اوى خاصة ان عبد الناصر كان فى رحلة قبلها على طول وكان راكب القطار فكانت الفرصة مهيأة جدا ولكن دا مش منهج الاخوان<br />انا ايدى وجعتنى من الكتابة.<br />بس فى النهاية ياريت توضحلى ليه رفعت السعبد دايما يفضل النظام اللى بيتحمى فى قانون الطوارىء وبيبعد دايما عن المعارضة بل ويكون سكينا فى ظهر المعارضة<br />*معلش انا ممكن ما عنتش ارد عليك اليومين دول علشان انا ورايا امتحانات ولكن الجايات اكتر من الرايحات .وشكرا<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

