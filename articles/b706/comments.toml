posted = "2006-04-21"
text = "السلام عليكم<br />الاخ الي فوقي معلش ان شاء الله الاخوان ينكشفوا للناس بس عشان يعرفوا الناس انهم همه دول املهم في الاصلاح و يطردوا المفسدين في البلد طردته الكلاب<br />اما موقع عشرينات فهو من احسن المواقع و ارائهم رائعه و محترم اما انه متحامل علي الحكومه ارجوك قولي حد بيشكر في الحكومه غير الحزب الوطني<br />جزاكم الله خيرا يا عشرينات و الموضوع رائع بجد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

