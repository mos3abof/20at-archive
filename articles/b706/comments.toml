text = "وبقول انا كمان \"ليه نحاسب الاخوان على حاجات نعتقد انهم هايعملوها ونشكك فى نياتهم فى حسن احنا مابنحاسبش اللى فعلا بيظلم الناس ومعيش البلد فى كرب على مسمع الناس كلها.<br />ولا هو على رأى المثل \"مش قادر على الحمار بيتشطر على البردعه\"<br />على فكرة انا مش قصدى التشبيه بالظبط-علشان محدش يفهم غلط-بس انا قصدى المعنى بس<br />وشرا"
