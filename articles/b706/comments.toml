[[comments]]
order = 33
subject = "معلش شكلك مش فاهم حاجة"
author = "الكابتن اللى فوقى معلش شكلك مش فاهم اى حاجة فى اى حاجة-انا اسف-بس هى دى الحقيقةاللى باينة اوى من كلامك"
posted = "2006-05-26"
text = "اولا:مفيش حاجة اسمها قاعدة شرعية بتقول \"الضرورات تبيح المحرمات\"-وتقريبا انت مش عارف اصلا يعنى ايه قاعدة شرعية لانك لو تعرف مش هاتقول الهجص بتاعك دا-وبعيد عن القواعد الشرعية -اللى اعتقد انك بتسمع عنها من بعيد لبعيد- مفيش اى حاجة من ادبيات الاخوان بتقول الكلام دا الا فى حالة واحدة الا وهى لو انت قصدك على حزب التجمع(الاخوان فى منظور حضرتك)والله شر البلية ما يضحك<br />ثانيا:انا ما اعتقدش ان الشيخ بن باز قال الكلام دا.بدليل ان اصلا اللى بيخرج يجاهد فى سبيل الله ايام الرسول(ص)كان بيبقى خارج علشان يستشهد ومش عارف انت تعرف موقف الصحابى اللى لما الرسول بعت له الغنائم بعد الحرب قال \"لم ابايعك على هذا.ولكن بايعتك على ان ان اقتل بسهم ها هنا-واشار الى رقبته-وفى اليوم التالى استشهد بنفس الطريقة فقال الرسول(ص)صدق الله فاصدقه الله.وبرده الموقف التانى لما صحابى تانى دخل فى المنجنيق \"وحدفوه\"داخل حصون الاعداء علشان يفتح الابواب فهل دا كان يتوقع انه يخرج مثلا.<br />ثالثا:دا موضوع فى اختلاف بين العلماء واحب اقولك بأه القاعدة الشرعية اللى بتقول\"المختلف فيه لا انكار فيه\"<br />رابعا:كتير من الاخوان بيطلقوا لحاهم.وبعضهم بيحلقها.مع الاخذ فى الاعتبار ان اطلاق اللحيه سنة وليس فرض.يعنى مثلا الرسول كان بيصلى السنة القبلية للفجر هل لو انا مصليتهاش يبقى عليا اثم؟لا طبعا لان دى سنة وليست فرض.<br />ومع ذلك والله احنا نفسنا يا سيدى نطلق لحانا ولكن فى ظل الحكومة الظالمة اللى حاكمانا بقانون الطوارىء والاشتباه واعتقال كل شخص يلتحى يبقى مفيش مشكلة من حلق اللحية.بدليل ان الاخوان فى فلسطين او الكويت او السعودية او اى مكان تانى بيطلقوا لحاهم<br />بصراحة انا ما كنتش عايز ارد على الكلام اللى ينم عن جهل كامل بأمور الدين دا ولكن علشان الامور تتضح للناس بس.<br />وبلاش الكلام دا يا كابتن يا بتاع حزب التجمع انت.وبعدين غريبة دى انت لسة لك عين تتكلم؟<br />صحيح اذا لم تستحى فا افعل ما شئت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

[[comments]]
order = 34
subject = "اتقوا الله يا اخوانى"
author = "اللى الاخ الكريم صاحب العنوان\"شكلك مش فاهم حاجة\""
posted = "2006-05-27"
text = "يا اخى اقدر لك حبك للاخوان وحرصك على اظهار الحق ولكن ليس هذا هو الاسلوب الحاد هو الاسلوب المعتمد لدينا نحن-الاخوان- ولذلك ادعوك لقراءة المزيد من رسائل وادبيات الاخوان والاقتراب من الاخوان اكثر لتتعرف على اسلوب الاخوان فى الحوار الذى يجمع ولا يفرق<br />وحسبنا ما قال ربنا عز وجل\"وادع الى سبيل ربك بالحكمة والموعظة الحسنة\"<br />وحسبنا ايضا قوله\"ولو كنت فظا غليظ القلب لانفضوا من حولك\"<br />وصدق رسول الله(ص)اذ يقول\"انا زعيم بيت فى وسط الجنة لمن ترك المراء ولو كان محقا\"<br />هذه كانت نصيحتى لاخى صاحب الرد الحاد<br />اما اخى الاخر صاحب الاتهامات اصلا .فبالله عليك يا اخى اسئلك عدم كيل الاتهامات بدون دلائل واسئلك ان تتأكد من صحة ما تقول اولا والا تسىء الظن دائما فأن \"بعض الظن اثم\"<br />وجزاكم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

[[comments]]
order = 35
subject = "حركه فاشيه تدعوا للعنف"
author = "حمدى"
posted = "2006-05-27"
text = "قرات له<br />مجموعه رسائل البنا ص 320 \"نحن ايها الناس ولا فخر اصحاب الرسول \"ص\" وحمله رايته من بعده ورافعوا لوائه كما رفعوه حتى يصل الى ايها الاخوان المسلمون هذه منزلتكم فلا تصغروا انفسكم فتقيسوا انفسكم بغيركم\"وذلك يعتبروا انفسهم اصحاب الرسول وبقيه الامه من الجاهليون وهم لا يتورعون عن التصفيه الجسديه لمعارضوهم كما كان من امر الجهاز السرى واغتيال النقراشى والخازندار.... الخ<br />من مجموعه رسائل البنا :<br />_____________________<br />رساله الجهاد قال فى اخرها\"ايها الاخوان ان الامه التى تحسن صناعه الموت وتعرف كيف تموت الميته الشريفه يهب الله لها الحياه العزيزهبالدنيا والنعيم الخال \" هل هذا حديث ينسب لرجل مسلم ام حديث رجل فاشى يكتب تحت عنوان تشمئز منه النفس عنوان بعيد عن روح الدين \" صناعه الموت \" وما جاء الاسلام الا ليعلمنا نحيا فى سبيل الله وكيف نحفظ زنرقى للاحياء حياتهم وما كان الجهاد الا تشريعا مرحليا اظطر اليه الاسلام لملابسات الموقف وحكم الوقت واداه للتعامل وثقافه العصر فى القرن السابع الميلادى وما كان الا كالمبضع فى يد الجراح وليس كالمديه فى يد الجزار لصناعه القتل<br />وما جاء الاسلام ليعلمنا فن الحروب وصناعه الموت والقتل.<br />ونشر مقال 1934 تحت عنوان صناعه الموت ؟؟؟؟؟<br />واعاد نشر المقال كتاب حسن البنا متى ... كيف ... لماذا اخذ من جريده الاخوان المسلمين تاريخ 16\\8\\1946<br />ويقول فى مزكرات الدعوه والداعى ص 144 \"نحن حرب على كل زعيم او رئيس حزب لا تعمل على نصره الاسلام ولا تسير فى الطريق لاستعاده حكم الاسلام !!!!!ومجد الاسلام<br />سنعلنها خصومه لا سلم فيها ولا هواده معها\"<br />هذا الحديث بجانب العنف يتنافى مع ابسط قواعد الجهاد يتولاه امام المسلمين ولا تتولاه طائفه من المسلمين لتعلن الحرب على الطوائف الاخرى واكثر من ذلك لاتوجه للمسلمين ولكن لغير المسلمين<br />فمن اين استباحوا حر ب المسلمين وحديث النبى \" كل المسلم على المسلم حرام دمه وماله وعرضه وان يضن به ظن السوء \"<br />وهم لايتورعون لتحقيق ماربهم بايه وسيله تحت مبدا الغايه تبرر الوسيله حتى لو كانتا متعارضتين<br />وهم لايعرفون للديمقراطيه ولا المواطنه ولا المراه ولا اهل الكتاب من حرمه او حقوق<br />رحم الله مصر منهم ووعى شعبنا بخطرهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

