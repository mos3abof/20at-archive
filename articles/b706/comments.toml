author = "بالصدفة اشتريت بالامس رسائل حسن البنا..و سبحان الله فتحت عشرينات وجدتها تتحدث عن نفس الموضوع رسائل البنا"
posted = "2006-04-18"
text = "المهم يا جماعة انا مش من الاخوان و اظن اني لن أكون منهم مع احترامي الشديد لنظامهم و تنظيمهم<br />يعني ممكن تحطوني في تصنيف متردد ..اللي قال عليه البنا..<br />ما هو الناس بالنسبة للاخوان اصناف اربعة<br />مؤمن - متردد- نفعي - متحامل<br />انا مش نفعي ولا مؤمن و لا متحامل<br />محسوبتكم متردد..يمكن و الله اعلم اكون بكرة مؤمن بفكر الاخوان"
