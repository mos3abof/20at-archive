subject = "اهم من القراءة"
author = "عبدالمنعم الطيب"
posted = "2006-05-10"
text = "قد يختلف البعض أو يتفق حول الإخوان ولكن كتاب الرسائل من الأشياء القليله التى اتفق عليها المنصفون وأقول (المنصفون) ولكن الأهم من القراءة -ان كانت القراءة مهمه- هو ان ننطلق كل بفكره طالما الوجهة واحده. العمل العمل يا شباب وبنات الإسلام ما من وقت -إن عدوكم لا ينام- واحسبكم تعلمون ان من اشهر كلمات البنا حينما طلب منه تأليف الكتب(إنما أؤلف رجالا) هنا يكمن السر إيها الإخوة والأخوات سؤال هو لى أولا قبلكم .. هل مستوى حركتنا بقدر مستوى كلامنا ؟؟؟؟؟؟ أسأل الله التوفيق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

[[comments]]
order = 10
subject = "مش عارف"
author = "واحد مش أخوان"
posted = "2006-05-10"
text = "بصراحة انا لم أقرأ رسائل البنا بالرغم من سهولة الحصول عليها سواء عن طريق صديق او الانترنت . لكن لماذا ؟<br />أصل الاسلام دين سهل وبسيط. ومش مكلكع ذي مالناس فاكرة. بغض النظر عن رسائل او معتقدات اي شخص . الأهم اننا نقرأ القرأن وبعد كده نتعرف على السيرة والسنة النبوية . القرأن والسنة هما اللي فيهم الخلاصة والمباديء.مش اي حاجة تانية"
