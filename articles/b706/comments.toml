order = 28
subject = "وهم الإخوان المسلمين"
author = "بسم الله الرحمن الرحيم"
posted = "2006-05-21"
text = "أود أن أوضح لحضراتكم أني لست عميلا للنظام حتى أتشطر على البردعة كما تفضل الأخ الكريم من قبل ولكن ما أكلمكم عنه حدث بالفعل ولست أحاسب الناس على نواياهم ومثبت في الكثير من الوثائق والكتب التي أرجو منكم ومن القراء للمرة الرابعة محاولة الإطلاع عليها وستتغير الحقائق أمامكم فاغتيال الخازندار إذا كان حمية شباب وتصرف فردي فلا أظن أن اغتيال النقراشي باشا ومحاولة اغتيال إبراهيم عبد الهادي واشتباكات الإخوان مع البوليس في كلية الطب تارة والزراعة تارة كانت أيضا حمية شباب وإذا كانت كل الأعمال الإرهابية -التي لم أذكر منها إلا القليل- كانت بدون معرفة البنا فما دوره إذاْ كمرشد للجماعة ومن المعروف أن البنا كان يتمتع بطاعة عمياء من أعضاء الجماعة كما قال \"كل الطاعة في المنشط والمكره\" ولا يعقل أن يتم كل هذا بدون علمه.<br />وإذا افترضنا أن الإخوان كان لهم بالفعل دور في حرب 48 وفي الكفاح ضد الإنجليز –رغم أن الإخوان على حد معرفتي غابوا تماما عن الكفاح في القناة عام 1951- فلماذا استمر التنظيم بعد تحرر البلاد من الإنجليز وقيام حكومة مضادة للصهيونية واحتفظ بسلاحه لمحاولة انقلاب عام 1954؟<br />يدي لم تتعب من الكتابة ولكن أنا أيضا عندي امتحانات ولنناقش موضوع عبد الناصر فقط على أن نكمل بعد انتهاء الامتحانات:<br />تم إطلاق ست رصاصات على عبد الناصر ولم تصبه أي منها وهذا ما جعل الناس تشك في أن عبد الناصر افتعل هذه المحاولة لتبرير اعتقال الإخوان ولكن الحقيقة أن من أطلق النار هو سمكري وليس قناصا ويجب أن نضع ذلك في الاعتبار كما أن أحمد بدر الذي كان يقف بجانبه تلقى رصاصتين من الست وكان يقف بجانب عبد الناصر أيضا مسئول سوداني أصيب بالرصاص ومات بعد ذلك وإحدى الرصاصات كانت على مسافة قريبة جدا من عبد الناصر. أما رد فعل عبد الناصر الذي قال\"أيها الرجال..فليبق كل في مكانه..أيها الرجال\" فقد قيل أنه كلام مسرحي ولم يصدق بعض الناس أن رجل يكمن أن يصيح بمثل هذه الكلمات بالعربية الفصحى وهو أمام الموت ولكن عندي الرد فالسادات مثلاْ عندما أطلق عليه الرصاص لم يختبئ بل قام واقفا وتلقى الرصاص وهذا المثال يوضح أن رد فعل عبد الناصر لم يكن مستبعدا ولا أظن أن أي حاكم مهما كان السبب يرضى بأن يطلق أي شخص مهما كان ماهر في الرماية الرصاص على بعد 2-3 من جسد هذا الحاكم في تمثيلية لأن هناك نسبة للخطأ بالطبع وهذه حقائق معروفة لا علاقة لها برفعت السعيد الذي يصيبكم اسمه بالحساسية.<br />ربما أغيب عن متابعتكم حتى يوم 10 يوليو حتى تنتهي امتحاناتي فلا تظنوا أني هربت من النقاش ورجاءْ الزموا الموضوعية والحياد وبالذات الأخ الذي يقول \"ولا تلتفتوا الى المشككين\"...نلتقي بعد الفاصل -بعد 10 يوليو- فما زال عندي الكثير وما نفد مني الفكر.<br />والسلام عليكم ورحمة الله وبركاته."
archived = "2006-11-02"
