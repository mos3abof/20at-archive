text = "ممكن تكون أخومسلم ملتزم دون أن تقرا رسائل الأمام حسن البنا.دعوة الأخوان تدعو لللأتزام بالسنةومعاملة الناس بخلق حسن والجهاد .فمن كان كذلك فهو أخو مسلم وإن لم يقرأ رسالة واحة للأمام حسن البنا. لكن الأنضمام للجماعة أفضل لأن الذئب يأكل من الغنم القاصية."
