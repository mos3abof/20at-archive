text = "الاستاد بتاع رفعت السعيد نصيحة ابقي اسئل على الندوة بتاعة معرض الكتاب من سنتين اللى كانت بتناقش كتاب المتاسلمون (واحد من ارهاصات هذا الرفعت ) كانت بين د.عصام العريان ورفعت السعيد وبعدها اوعدك انك مش هتستنضف تبص لكتبه اللى بتتباع على الرصيف (لو ملقتهاش ابقا ابعت ايميلك وانا ابعتهالك لما اخلص امتحانات) نصيحة تانية هتلاقى رفعت السعيد مستشهد بمقولات واحداث ووقائع (اللى انت بتسميهم حقائق )حاول ترجع للمصادر اللى هو بيقول جايب منها الكلام ده وابقى قولنا لقيت ايه!!!!!!!!!!"
