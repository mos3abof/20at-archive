text = "حاشرين نفسكم فى الاربعينيات والخمسينيات من القرن الماضى وشغالين كلام ومحسسين الناس ان الخازندار ولا حتى النقراشى كانوا ملايكة مع انهم كانوا فى غاية الظلم -مع اعتراضى على اغتيالهم-وقاعدين تتكلموا فى زمن غير الزمن وظروف غير الظروف<br />بس لما نيجى نشوف نلاقيكم قاعدين فى مقر الحزب وسايبين الدنيا تضرب تقلب.الاخوان يتبهدلوا علشان يمنعوا قانون الطوارى وانتم ما تكلفوش خاطركم حتى تحضروا جلسة التمديد.<br />الاخوان يتاخد منهم 500 واحد علشان كانوا بيساندوا القضاء ورفعت السعيد يكتب \"ازمة القضاه ازمة داخلية ولا علاقة لمبارك بذلك .امال ليه البلد كانت متغرقة عساكر وامن دولة واعتقالات.<br />الشعب عايز الاخوان واختار 88 منهم دا غير 40 مقعد تم التزوير فيهم باعتراف رئيس الوزراء .وانتم خرجتوا من المولد بلا حمص بس شاطرين تعيطوا علشان الاخوان رشحوا واحد قدام خالد محى الدين والشعب اختار بتاع الاخوان ومااختارش خالد محى الدين-ياحرااااااااام-وطبعا الاخوان هما اللى وحشين ودايما يشتموا فيكم ويشوهوا صورتكم قدام الشعب.فوقوا بأه!!!<br />غريب حالكم والله يا بتوع التجمع والناصرى لما تطلبوا من الجبهة الوطنية للتغير يطردوا الاخوان اللى لهم 88 مقعد ويخلوكوا انتم يا بتوع 2 مقعد ولما يرفضوا تنسحبوا من الجبهة بحجج تعبانة زيكوا.وترجع تقولى انت مش عميل<br />فوقوا بأه يا بشر وعيشوا الواقع واشتغلوا وبطلوا كلام شوية .ولا هى الناس قرفت منكم من قليل<br />اف يا احزاب غاوية كلام."
archived = "2006-11-02"
