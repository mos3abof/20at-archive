subject = "جميله"
author = "ياء"
posted = "2006-04-18"
text = "الرسائل اكثر من رائعه وخاصه رساله<br />الاخوان المسلمين تحت رايه القران التى يقول فيها<br />نتقدم بدعوتنا نحن الاخوان المسلمين<br />هادئه ولكنهااقوى من الزوابع العاصفه<br />متواضعه ولكنها اعز من الشم الرواسى<br />محدوده ولكنها اوسع من حدود هذه الاقطار الارضيه جميعا<br />خاليه من المظاهر الزائفه والبهرج الكاذب<br />ولكنها محفوفه بجلال الحق وروعه الوحى ورعايه الله<br />ويقول فيها ايضا<br />نحن نريد<br />الفرد المسلم<br />البيت المسلم<br />الشعب المسلم<br />الحكومه المسلمه<br />والدوله المسلمه التى تقود الدول الاسلاميه ( الخلافه الراشده )<br />yehia2784@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123410/http://www.20at.com/article2.php?sid=706"

[[comments]]
