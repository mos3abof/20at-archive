[[comments]]
order = 0
subject = "ربنا يرحمنا"
author = "الاسم عربيه"
posted = "2006-10-30"
text = "مهما زادت السجون والمعتقلات<br />مهما تفننوا فى اشكال التعذيب والاهانات<br />هنظل نندد بكل سلطه فاسده<br />هنندد بكل حاكم مستبد<br />هنندد بكل مراكز القوى<br />هنندد بكل من غفل مبادىء الاسلام<br />ونسى بان امرهم شورى بينهم<br />وللاسف مش موجودين الا فى البلاد العربيه<br />ربنا يرحمنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130252/http://www.20at.com/article2.php?sid=1390"

[[comments]]
order = 1
subject = "انتهى الدرس يا غبي"
author = "حمودة"
posted = "2006-10-30"
text = "العالم دي سجنت لما تمكنت ولما تمكن المساجين ضحكوا عليهم بحكومة وحدة وطنية أو الوطن وغيره والمساجين لسه مااستوعبوش الدرس ومازالوا مساجين معنويا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130252/http://www.20at.com/article2.php?sid=1390"

[[comments]]
order = 2
subject = "السجن الكبير"
author = "خالد أحمد"
posted = "2006-10-30"
text = "للأسف الشديد الوطن العربى تحول الى سجن كبير كما قال أحمد مطر عن الحكام العرب أنهم -سجانا يتبع سجان-القضية أعقد من سجون محكمة وكلاب حراسة أنما المشكلة فى نفوس أعتادت الذل وأستمراءت المهانة والله لا يغير مابقوم حتى يغيروا ما بأنفسهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130252/http://www.20at.com/article2.php?sid=1390"

