[[comments]]
order = 0
subject = "زمان وانا صغير"
author = "عبدالله مفتاح"
posted = "2006-03-29"
text = "اول يوم بابا وصلني المدرسه ودخل معايا ودخل للمدير راح قايله عندنا فصلين واحد الاستاذ يوسف راضي والتاني (مش فاكر اسمه) بابا قاله وديه عند الاستاذ يوسف راضي (فلسطيني الجنسيه) المهم دخلت الفصل لقيت المدرس يقول أواال اتنين يروحوا العيال قايلين وراه أواال اتنين (عشان احنا في اول اتنين يعني مش اول واحد)اصل هناك مش الف وباء هناك واحد واتنين<br />المهم الحصه الاولى خلصت على انه يقول اول اتنين واحنا نقول وراه الحصه التانيه بقا يقول واحد نقول وراه اتنين نقول وراه تلاته نقول وراه .<br />انا كنت داخل المدرسه كبير لان راحت عليا سنه كنت حاسس اني مدايق اوي وايه اللي احنا بنقوله ده ؟ خصوصا اني كنت بعرف اقرا ومش طالبه اني اقول اول اتنين او واحد اتنين<br />في الفسحه قابلت اخويا وقلتله الحق هوه انا جي المدرسه دي عشان اتعلم واحد اتنين وبعدين احنا اتاخرنا اوي مش كده بابا وماما يقلقوا علينا .<br />لو اضفنا للجو اللي انا بحكيه ده ان كان في ولد اسمه (يزن) سوري عمال يعيط طول ما هو قاعد يبقى انا كنت حاسس اني في مورستان حقيقي<br />وكفايه كلام كده"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210912/http://masr.20at.com:80/article.php?sid=94&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "ايوه ....للاسف فاكر"
author = "Dabdoob"
posted = "2006-03-30"
text = "مش عايزكم تفهموني غلط في الموضوع ده<br />ان طيب والله وماقدرش ازعل من حد ساعتين علي بعض بس لو حد ظلمني مابقدرش انساهاله ابدا حتي لو كنت سامحته<br />كان فيه مدرسة مش فاكر اسمها كانت هوايتها انها تضربنا تقريبا عشان نسكت وكانت بتستظرف وتقول (مش انا اللي ضربتكم دي العصايا) يا سلااااام<br />نفسي بقه اقابلها تاني دلوقتي وانا هاقنعها ان ايدي هي الي هتكسر نافوخها مش انا<br />بصراحة انا لسه باكرهها لحد دلوقتي<br />قلبتوا علي المواجع<br />وسلام<br />Dabdoob"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210912/http://masr.20at.com:80/article.php?sid=94&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "انا مهما كبرت صغير......"
author = "هووووبه او هبهوب"
posted = "2006-03-30"
text = "احكلكو ايه ولاه ايه ولاه ايه<br />اولا انا كنت شقييييه جدا في الفصل من الاخر كنت مشاغبه<br />بس كنت غبيه برضه والله اليوم اللي عمري ماانساه<br />والاستاده بتديني الشهادة واناجبت فيها كحكه في الحسا<br />ب<br />وريحيه ماما بقي وفرررررحانه انا الوحيده اللي جبت<br />كحكه<br />هي كنت بتخبز جوه المصيبه كنت بتعمل كحك برضه اه والله<br />لقتها عماله تصوت كحكه كحكه ياحماره مااحنا عندنا كتير<br />اهوه وانا مستغربه هي بتزعق ليه دا انا الوحيده<br />اللي جبتها . الظاهر الحساب عمل عميله لما كبرت<br />وقررت اخش رياضه انتقاما<br />يلا كانت ايام لديده لو ترجع بس من غير كحك"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210912/http://masr.20at.com:80/article.php?sid=94&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "عقدة و شنيطه"
author = "سوسة المفروسة"
posted = "2006-03-31"
text = "انا بقى يا جماعة اولى ابتدائى دي عملالي عقده ...و انا صغيرة ماما ماكانتش بتحب تعملي ضفاير و كانت بتقصلي شعري عل طول القصة بتاع مي عبد النبي قصير بس مغطي الحلق بتاعي..الميس لما شافتني في الزحمة بتاع اول يوم افتكرتني ولد.قعدتني وسط الولاد ..لا و في اخر صف..<br />الصراحه انبسط و عملت عصابة م الولاد و كنت انا رئيستها و كانوا كلهم بيسمعوا كلامي و ما يقدروش يتنولي كلمه...بس بعد شويه كنت بابص للبنات ..كلهم قاعدين جنب بعض و بيخرجوا الفسحه سوا..و كلهم عاملين ضفاير و بيلبسوا توك....فاقسمت بيني و بين نفسي ان تبقى عندي اكبر ضفيرة و اني اشتري توك البلد كلها و اجبر كل البنات انها تمشي معايا و كمان يسمعوا كلامي (حاجه كده زي فيلم امير الانتقام)<br />بس ...تاني سنة عملت كده و بقيت الكل في الكل....بس العصابه القديمه بتاعتي العيال طلعوا جدعان و لما رشحت نفسي عشلن ابقى رئيسة الفصل خلوا كل الفصل صوتلى تحت تهديد السلاح .....و الله كانت ايام"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210912/http://masr.20at.com:80/article.php?sid=94&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "ليت الشباب يعود يوما"
author = "سنووايت"
posted = "2006-04-01"
text = "أولى ابتدائي<br />كنت بكره الصحيان بدري وبحب السهر طفله وكل يوم خناقة وعياط واستخبى تحت الشرير ويجبوني بس وبعد الحرب دي كلها اتحشر في زي المدرسة اللي كان مريله وشنطه فيها سندوتشات مش بحبها<br />على باب المدرسة او الفصل حسب التساهيل يعني اسيب السندوتشات<br />طفله هادية مش بتتكلم خالص تفتكروها خرساء ودني بتحمر وتسخن في الشتا وانا بحل واجب الحساب الغلس<br />واعد على صوابعي \" لحد النهاردة\" واتعلق بالميس الطيبة بتاعتي اللي مش فاكره اسمها وارجع البيت اعمل الواجب واعمل نايمه في السرير لقرب الفجر وبعد ساعه ولا اتنين نفس الايد بتصحيني وتبتدي خناقه الصحب واستخبى تحت السرير ويجبوني \"<br />ياااااااااااه كانت ايام"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210912/http://masr.20at.com:80/article.php?sid=94&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "اولى ابتدائي .. فاكرها ..."
author = "sweet_princess"
posted = "2006-04-05"
text = "اولى ابتدائي دي كانت اجمل يوم ...<br />لاني كنت سعيده جدا وانا رايحه المدرسه لاني كنت ببص ع الاولاد اللي اكبر مني وهما شايلين الشنط والزمزميات ورايحين المدرسه وكان بيبقى نفسي اقلدهم ..<br />لكن اللي انا فاكراه اوي في اول يوم منظر الولاد معايا في الفصل ..<br />كانوا في تناقض غريب ..<br />اللي الاقيه واخد ركن وعمال يعيط ..<br />واللي فاتح السرينه ععععععععع عازو مااااااااااااااماااااااا ... لدرجة اني كنت شايفه لوزه وانا قاعده مكاني ...<br />واللي عمال يضحك زي الاهيل ..<br />واللي مطلع سندوشتات وعمال ياكل ..مع اننا كنا لسه داخلين الفصل ..<br />بين كل دول ودول انا كنت بتفرج بهدوء ع السيرك اللي اتنصب حواليا ..<br />غير كدا المكان ما كنش غريب عني لاني ..<br />كنت بدخله كل يوم من وانا عمري 8 شهور مع مامتي ..<br />لانها كانت بتشتغل اداريه هناك ..<br />وكنت بتحرك بكل حريه ..اسيبها واسحف والمدرسين يلاقوني داخله عليهم الفصل ..<br />كان جو جميل انا كنت متعوده عليه ..<br />لكن للاسف انا دخلت المدرسه من هنا .. وماماكانت اترقت واتنقلت طبعا ..<br />لكن حقيقي كانت ايام لذيذه ..<br />دا غير الحفلات في الدراسه او حتر النادي الصيفي والمكتبه اللي كنت مشتركه فيهم ..<br />واني كمان كنت بقدم اذاعة المدرسه من 3 ابتدائي لحد الثانوي ..<br />اقوللكم ايه ولا ايه بس ..<br />طبعا الابتدائي دا كان احلا ايام حياتي .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210912/http://masr.20at.com:80/article.php?sid=94&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

