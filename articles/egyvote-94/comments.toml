[[comments]]
order = 0
subject = "ربنا يسترها معاكم يا جيران المقار الانتخابية .... امين"
author = "محمد السيد"
posted = "2005-11-30"
text = "بنا يستر ... مفيش تعليق تاني ...<br />باقي اليوم يمكن يشهد تعليقات جديدة ... لكن دعواتنا لأهالي المناطق اللي فيها مدارس ومقار انتخابية ...<br />ربنا يحميهم من شر الوطني ... ومن بلطجية الوطني ... ومن مرشحي الوطني ... ومن فلوس الوطني .... ومن كل حاجة بتيجي من الوطني ...<br />ويحمينا معاهم كمان ....<br />وتمر الأيام الحلوة دي بخير وعلي خير ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044825/http://egyvote.20at.com:80/article.php?sid=94"

[[comments]]
order = 1
subject = "صحيح بمناسبة اللي بيحصل!!هو انا حكيت لكم حكاية الأسد و التعلب والارنب؟"
author = "محمد السيد"
posted = "2005-11-30"
text = "بعدما علقت ... افتكرت حكاية حيوانات الغابة .... الأسد والتعلب والأرنب...أحكيها لكم .... عشان نعرف النهاردة إيه النظام ؟؟؟<br />كان التعلب متعود كل ما يشوف الأرنب يضربه ويقول له ودنك طويلة ليه ؟؟؟ جميل ....؟؟ جميل ...<br />الأرنب زهق من المعاملة دي ... وقال يروح يشتكي لكبير الغابة ... راح للأسد وشكي له من التعلب .....<br />بعد ما مشي الأرنب ... الأسد نادي علي التعلب وأخده وحده ... وبينصحه ... قال له : يا عبيط !! ....<br />بدل ما كل مرة تضربه علي نفس السبب وتخلي شكلك وحش ... ابحث عن سبب مقنع $ ... كل مرة اخترع حاجة .......<br />مثلا اطلب منه يجيب لك حاجة ولما يجيبها اضربه وقول له مش عايز دي انا عايز التانية ... مثلا قول له :<br />هات لي تفاحة ..... ولو جابها حمراء اضربه وقول له انا عايزها خضراء والعكس ...<br />التعلب ما صدق ... راح نادي علي الأرنب وقال له : هات لي تفاحة ...... راح رد الأرنب و عمل نفسه بيفهم<br />وقال له ..........<br />عايزها حمراء ولا خضراء ؟ ..........<br />قام التعلب ضربه وقال له : ودنك طويلة ليه ؟ ...........<br />يعني الحكومة قالت تحلي الحكاية وتقدم اصلاحات و حاجات كده ...عشان تنجح برضه ....<br />لقت الناس بتتذاكي عليها وبتسقط مرشحيها .... قامت ضاربة الناس ورجعت للأسلوب الأول وقالت لها<br />ودنك طويلة ليه ....؟<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013044825/http://egyvote.20at.com:80/article.php?sid=94"
