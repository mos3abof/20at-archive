[[comments]]
order = 1
subject = "أفضل بكثير من الخميس"
author = "علي المراني"
posted = "2006-05-31"
text = "السلام عليكم ورحمة الله<br />بما أن العلماء قد رأو ذلك فمن أنا حتى أقول لا<br />بالعكس سنجدها متعة أكثر ونغير الجو وبعد صلاة الجمعة لا يهم الطالب المذاكرة لثاني يوم ولا الموظف عمله<br />أنا أوافق وبشدة صراحة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151246/http://www.20at.com/article2.php?sid=878"

[[comments]]
order = 2
subject = "أنا أعترض"
author = "لا تقل من أنت ؟ حتى تعترض ، أقول أنا أمرؤ من المسلمين ، واعترض لتغيير الخميس الى السبت للاسباب الاتية :"
posted = "2006-05-31"
text = "1. مشابهة اليهود والنصارى في اتخاذ يوم السبت يوم عطلة رسمي ، والنبي -صلى الله عليه وسلم حذر من التشبه باليهود والنصارى.<br />2. يوم الخميس يوم يصومه بعض المسلمين تطوعاأو قضاء ؛ لورود النص بذلك للمتطوعين ، ولا شك أنه اذا كان يوم اجازة ففي ذلك عون لهم على البر والتقوى.<br />3. في بداية عطلة نهاية الاسبوع ، يشد كثير من الناس الرحال لقضاء نهاية الاسبوع خارج العمران ،ليعودوا يوم الجمعة ، أما الان فإن احتمال أضاعتهم لصلاة الجمعة وارد جدا؛ لانهم سيرتحلون قبل يوم الجمعة(يوم الخميس) ، ولن يعودوا الا السبت مساء."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151246/http://www.20at.com/article2.php?sid=878"
