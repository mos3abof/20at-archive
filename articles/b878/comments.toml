subject = "ليش لا"
author = "محمد النجداوي"
posted = "2006-05-30"
text = "مادام الامر لا يخالف الشرع يوجد فية مصلحة من الطبيعي الكل يوافق.<br />بس لو كان السبت انا بعارض"
