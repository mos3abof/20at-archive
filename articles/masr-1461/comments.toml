[[comments]]
order = 30
subject = "خيره الناس"
author = "كلما تفاجانا الحكومه باعتقالات جديده نجد انهم من خيره الناس ومن الذين فعلا يريدون لهذا البلد الخير والصلاح"
posted = "2007-01-30"
text = "فهم اساتذه الجامعات ورجال الاعمال والعلماء الاجلاء . وتقوم بتوجيه التهم الذائفه اليهم بالعثورفي منازلهم علي السكاكين (يامصيبتي ) وفلوس نقديه كمان ( لا دا موضوع كبير ) وفي النهايه يتضح انها سكاكين المطبخ وفلوس تعبهم وشقاهم. لقد ظهرت هذه الحكومه وما تحمله من فساد بوجهها القبيح الذي تحاول التستر عليهافالحكومه تظهر في كل مره بوجه اقبح من ذي قبله فهي تتفق مع قول الشاعر<br />\" لها جسم برغوث وساق نعامه ووجه كوجه القرد او هو اقبح \"<br />ولكن كل حاجه خلاص بقت كتاب مفتوح علي راي الكابتن محمود عبد الللطيف ."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"
