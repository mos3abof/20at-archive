author = "ميدان التحرير"
posted = "2007-01-18"
text = "اولا<br />هل انت تنتمى للاخوان سواء عمليا او فكريا لانك عمال تقول : قولنا قولنا ؟؟ واهو كلام ويا عالم ساعه الجد هنشوف ايه<br />ثانيا<br />يا عم انت افهم انا مقلتش ان السيف والمصحف مش عاجبنى انا قلت هم فين ، انا اعتراضى على ان الاخوان ليه تخلوا عنهم و هل ده عشان يرضوا الحكومه ، مهو اللى يتخلى عن صوره ممكن بعد كده يتخلى عن الشعار و ممكن وممكن طالما ان الحكايه مصالح و خلاص<br />وبعدين انت اولت كلامى بهذا الاسلوب ، ان كان مش واضح قول مش واضح انما تفسر الكلام على هواك و ترد عليه<br />وبعدين فى غابه الديموقراطيه دى اللى انت عاوز تمشى حربايتك فيها ، اذا كان انت من اولها اهوه و مش عاوز حد يعترض و لا يقول مش عاجبه ، فين الديموقراطيه دى هه ؟؟؟<br />ايه اللى يدل على ان الاخوان هيعملوا على اساس ديمقراطى فى البلد اذا كانوا شايفين نفسهم المسلمين الحقيقيين الوحيدين فى البلد ،<br />جبت الفكره دى منين ؟؟ من كلامهم يا سيدى ، كل كلامهم باسم الاسلام و اسم الدين و حتى و هم بيعادوا مؤسسات اسلاميه اخرى كالازهر ، ده من طريقتهم يتفهم ان انت بعد كده يا تبقى مسلم اخوانى او على الاقل موافق على كل ما يقولوه و يفعلون يا اما تبقى فى خانه الاعداء ، وتقولى ديمقراطيه ، ديمقراطيه مين يا عمنا ، انت بتضحك عليا و لا على نفسك ،<br />وبعدين مش المرشد ده هو الكل فى الكل و له كل السمع و الطاعه و الناس بتوطى تبوس ايده ؟؟؟؟ عاوز انت رئيس جمهوريه ( ولا مش هتبقى جمهوريه بقى ) يتعمل له كده ييجى رئيس الوزرا والسلامو عليكم يا سماحه الرئيس و يقوم موطى و بايس على ايده ؟؟ وطبعا راخر هيبقى له السمع و الطاعه ، ولا مش كده و بس ده اللى هيخالفه مش هيبقى بقى مجرد معارض ده هيبقى كافر كمان ، امال ، مش سماحه الرئيس هو المتحدث باسم الدين يبقى الخارج علي<br />اقرأ بقية التعليق .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

[[comments]]
