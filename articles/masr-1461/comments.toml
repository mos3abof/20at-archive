[[comments]]
order = 8
subject = "ارحموا الدين الاسلامي وارحمونا"
author = "انسان مسلم"
posted = "2007-01-18"
text = "الي شلة الاخوان ال مشكوك في اسلامهم وال كل الششلل والعملاءاللذين يتاجرون بالدين من اجل المال والجاه والشهرة لانهم مساكين من اسقاع المجتمع ولاد خبازات وغسالات وابهاتهم كلهم عطشجية وماحدش سمع عنهم ارحموا مصر وارحمونا وارحموا الاسلام كفاية شوهتوا صورة الدين الاسلامي بصورتكوا المقززة كفاية ال عملتوة في اولاد الناس منذ ظهوركم علي الساحة.<br />المسلم ايها الشلل من سلم الناس من يدة ولسانة وانتم جميعا لاسلاام من ايديكم والسنتكم .<br />والسؤال ماهي مؤهلاتكم وخبراتكم ياجهال انتم فقراء العلم والنفس والمعرفة ايها المرضي اغربوا عن اعيننا وعن حياتنا وكفاية شوهتونا وشوهتوا ديننا.<br />المسلمين والاسلام محتاجون اليي العلماء في كل مناحي الحياة حتي نرقي ديننا دين رقي وتقدم وعلم مش سفسطئة ودموججية وعمالة وتجارة به ارحمونا ايها الجهال ارحمونا ادعوا الله ان يرحمنا منكم وياخذكم اخذ عزيز مقتدر.<br />امثلنكم بالعالم ماذا فعلوا ببلادهم غير الخراب والدمار طالبان في افغانستان-حماس في فلسطين - الجماعات في الجزائر - المحاكم في الصومال والمشكلة انكم جميعا عملاء ومرتزقة لما تتظاهرون انهم الاعداء وتسبونهم ليل نهار اختشوا وخلي عندكم دم باه واغربوا عن اعيننا اشكالكم لاتسر النظر بل تقبض القلب والروح."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

[[comments]]
order = 9
subject = "الجماعات الدينية"
author = "اية المشكلة ان يبقى عندنا جماعات دينية"
posted = "2007-01-18"
text = "فى امريكا مئات الالوف من الجماعات الدينية الملحقة بالكنائس ويجمعون مليارات الدولارات لاستخدامها فى التبشير واقامة الكنائس فى افريقيا والعالم ومنها مصر - كم كنيسة مصرية بنيت باموال امريكية - اسألوا شنودة<br />الجماعات الدينية لن تسطوا على الحكم كما سطى الانجليون على الحكم فى امريكا<br />يجب رعاية الجماعات الدينية حكوميا وعدم النفور منها ومساعدتهم لفعل الخير والجمع من الغنى والصرف على الفقير<br />لا تتقربوا الى امريكا بضرب الاسلاميين على رأى المثل العامى خد من دقنة وافتلة<br />خلوهم يمارسوا نشاطهم الخيرى ولا تجعلوها فتنة<br />وختاما اعملوا زى الغرب ماعندة جماعات دينية وفى فرنسا متعصبون ضد الجالية الاسلامية ويريدون رميهم فى البحر ولكن يبقى القانون فوق الجميع<br />وربنا يهدى النفوس"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

[[comments]]
order = 10
subject = "الى توتو ( انسان مسلم )"
author = "اخوك عفروتو"
posted = "2007-01-18"
text = "استاذى الفاضل : من الواضح جداص انك شارب امية لفت قبل قراءة المقال او فقط قبل كتابة التعليق الاسطورى اللى كتبته .<br />مبدأيا من هم الاخوان ( د . حبيب النائب الاول للمرشد استاذ دكتور فى العلوم وكان رئيس نادى اعضاؤالتدريس فى جامعةاسيوط والشاطر تكفل الموق بذكر طن الشهادات الحاصل عليها والعريان حاصل على كلية طب وآداب تاريخ // جيد جداً// وبكالويوس الشريعةالاسلامية // جيد جدا // وليسانس الحقوق // جيد // الشيخ سيد عسكر من كبار علماء الازهر ، الكتاتنى اسناذ جامعى ن ابو الفتوح طبيب ، د. محمد مرسى استاذ جامعى ناهيك عن تنظيم الدكاترة الذى اتهم من خمس سنوات بنشر فكر الاخوان داخل الجامعة ... الدرجات العلمية داخل الاخوان أكثر من ان تحصى ابداعهم العلمى والادبى أكبر من ان يذكر .<br />اما بخصوص اصول وأسر أبناء الاخوان فهم وإن كان منهم ما ذكرت فهو أمر لا يعيب وغير محرم والعمل الشريف غير لا عيب عليه ولك الاخوان بها ابناء الذوات وأبناء البشوات القدمى ونهم ابو النصر والتلمسانى والمستشارين كالهضيبى والعلماء والادبارء كمحمد عبد القدوس .<br />ووجود من ذكرت أنت إلى جانب من ذكرت أنا فهو جانب يذكى الاخوان ولا يقدح فيها حيث تكون جماعى تضم كافة شرائح وفئات الشعب وليست جماعة نخبوية .<br />وسئوال أخير من انت فى مصر لتتكلم على الاخوان ؟ انت حتى لم تذكر اسم - من الواضح انت استعريت من ذكر نسبك يا توتو"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

