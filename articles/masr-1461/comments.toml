subject = "سلسبيل ... مفخرة الإخوان"
author = "محمد السيد"
posted = "2007-01-18"
text = "في الفترة دي ... المصور نزلت صور من الكلام ده ...<br />أنا بأعتبر الحاجات دي أدلة في صف الإخوان .. مش دليل ضدهم ..<br />كان من الورق ...نتايج انتخابات مجلس الإرشاد .. وفيها كل عضو أخد كام صوت .. وتزززيعات مسئلية أقسم الجماعة ... \" من طلبة لعمال لبر لاشبال للأخوات للنشر ل....... \" ... وتوصيف لتوزيعات المكتب ... علي قطاعات ومحافظات الجمهورية ...<br />المهم ... العدد لسة عندي ... لكن مش دي القصة ..<br />القصة ..إن ده دليل علي الديمقراطية داخل الجماعة ... دليل علي تطبيق الشورى\"أحد ثوابت الجماعة\" ...<br />وأظن اللي يطبقها داخل تنظيمه حيكون من الأولي يطبقها خارجها ...<br />دليل علي النظام العالي جدا ... اللي أظن إنها حاجة مش عيب ... علي العكس ميزة ...بعكس ماكتير بيصوروا الموضوع ..<br />كلمة أخيرة ... المهندس الشاطر.. كان في اليمن .. وهناك لما سافرنا وإحنا صغيرين ... كان في استقبال الإخوان هناك ..<br />ونعم الرجل ...<br />بس برضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

