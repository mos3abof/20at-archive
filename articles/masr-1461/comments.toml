[[comments]]
order = 26
subject = "والله إنت بركة مجارى"
author = "والله إنت يا مدان التحرير بركة مجارى لإن الإخوان المسلمين لم يحكموا علشان نقدر نحكم هما ها يبقوا إيه لكن الواضح لينا رفضهم للفساد الموجود وإنهم كفاءات وأساتذة جامعات وأصحاب فكر منظم ومتقين الله ولم نرى منهم أى إرهاب ولكن ما يفعله مبارك وعيلته القذرة هو لعبة لكى يضمن تحنيط الكرسى ليهم علشان كده بيحاولوا يشوهوهم فاكرين أن الشعب مش عارف يفرق بين ناس بتخاف ربنا وناس نهبت مصر ورصيدهم بقى بالمليارات من النهب والمتاجرة بأقوات الشعب لكن أحب بس أقول لمبارك إنت قاعد فى الحكم بتعمل إيه وإنت موجود أصلاً فى الدنيا ليه وإيه فايدتك وقدمت لمصر إيه غير الخراب والفقر وإبن مختل شاذ مدمن عايز تورثه الحكم وزوجة مجنونة جشعة يهودية الأصل عمالة تنهب وتسافر وتتاجر بمصر ولا يهمها إلا إستعراض فساتينها التى هى من دماء المصريين"
posted = "2007-01-21"
text = "حسبى الله ونعم الوكيل أللهم أخرج مبارك وعيلته من مصر فقراء أذلاء وطهر مصر من فسادهم اللهم آمين وولى علينا خيارنا وليس شرارنا"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

