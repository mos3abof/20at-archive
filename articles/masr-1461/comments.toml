subject = "التاريخ يعيد نفسه/ درس من كربلاء"
author = "التاريخ يعيد نفسه من الاسلام الاول حيث الخليفة معاوية ابن ابي سفيان وابنه يزيد واستخدام معاوية ابن ابي سفيان كل سلطاته وقوته وذلك لتنصيب ابنه يزيد ولي للعهد وخروج سيدنا الحسين (الاحق بالخلافة) للثورة على يزيد وتخلي انصار الحسين عنه وجعله وحيدا هو واصدقائه في مواجهة جيش يزيد كامل وقتل الحسين (ابن بنت رسول الله وجز راسه) وقتل من معه وسبي نساء ال البيت وانتصر الباطل على اهل الحق."
posted = "2007-01-18"
text = "ـــــــــــــــــــــــــــــــــــ<br />التاريخ يعيد نفسه هل تتعلمون من درس سيدنا الحسين.<br />ـــــــــــــــــــــــــــــــــــ<br />اتركوا حسني مبارك واتركوا الحكم ودعوا الحسين يعيش فالله هو مالك الملك يؤتي الملك من يشاء وينزع الملك ممن يشاء.<br />يا جماعة الاخوان المسلمين اتركوا السياسة وانسحبوا من مجلس الشعب وتحولوا الى جماعة اصلاحية تدعو الى الاخلاق الفضيلة احسن لكم ولنا وارحمونا من السجون والمعتقلات وامن الدولة<br />ارحمونا ياعالم"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

