[[comments]]
order = 19
subject = "برضه هيفضلوا صامدين(1)"
author = "ياسر أبو عمار"
posted = "2007-01-18"
text = "انا بصراحة مستغرب من الانسياق ورا تصريحات واستفزاز الحكومة للناس ضد الاخوان.<br />يعنى البهوات اللى عمالين يشتموا فى الاخوان مش عايشين فى ام البلد دى ولا ايه؟مش عارفين ان الاخوان دول عايشين فى البلد دى من اول ما اتولدوا وهما اول ناس بيحموا امنها،يعنى انتم مش عارفين ان الاخوان هما اكثر ناس فى البلد بتحرص على النظام وبيحبوا البلد،مش فاكرين انهم سكتوا على قتل عدد من ابنائهم داخل سلخانات التعذيب واتجرعوا مرارة فراق اخوانهم وسكتوا علشان ميعملوش فتنة فى البلد ،دلوقتى جاى واحد يطلع يقول انهم خطر على البلد ،أف يا ياخى امال هما لما اخدوا ثقة الناس من سنين فى الانتخابات المختلفة كانوا بيمثلوا على الناخبين ولا ايه ؟ يا جماعة خليكم منطقيين ،الاخوان عايشين معاكم من ساعة ما انتوا كلكم اتولدتم ،امتى شفتوا حد منهم ارتكب حادثةعنف؟"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

[[comments]]
order = 20
subject = "برضه هيفضلوا صامدين(2)"
author = "ياسر أبو عمار"
posted = "2007-01-18"
text = "المشكلة اللى بيروج الكلام ده هى الحكومة اللى بتعذب فى المصريين بدون اسثناء الا البهوات اللى زيهم ،ونشرت التلوث والفساد والجهل وربت الناس على الخوف والقهر والذل وقلة الكرامة ،بقى هما دول اللى خايفين على امن البلد،مش هما دول برضه اللى غرقوا الناس فى العبارة وهربوا صاحبها ،وهما اللى دخلوا الاكياس الملوثة بتاعة الدم وهيهربوا صاحبها برضه،وغيره وغيره.<br />النهاية اصفق لكافة مؤسسات المجتمع المدنى ومنظمات حقوق الانسان على المشاركة فى حفلة سلخ الاخوان ،اما الموضوع لو يتعلق بالشواذ ولا البهائيين كانوا قلبوا الدنيا .<br />برضه الناس عارفة الحقيقة ،مش هيقدر الاعلام الموجه انه يغير قناعتهم بان الاسلام هو الحل وان الاخوان امل الامة فى كل مكان."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

[[comments]]
order = 21
subject = "بهدوء شوية"
author = "واحد من الاخوان اللى بيموتوا فى حب البلد"
posted = "2007-01-18"
text = "عمر السجن ما غير فكرة،عمر القهر ما أخر بكرة،لا تقلقوا على دعة الاخوان فهى دعوة ربنا ومش هتطلع الايام دى اقسى من ايام عبد الناصر ،طبعا الكلام ده للاخوان واللى بيحبوهم ،اما الجماعة اللى ما صدقوا وانفتح باب الهجوم على الاخوان لاخراج غلهم من نجاح الاخوان فاحب اقول لهم ،على فكرة هتتغاظوا اكتر واكتر ان شاء الله ،واناوانتم والايام .<br />فاكرينا هنخاف وندخل بيوتنا ونقفل على روحنا ،بالعكس هنشتغل اكثر واكثر علشان بنحب البلد دى ومش هنسيب الحرامية ينهبوها ."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

