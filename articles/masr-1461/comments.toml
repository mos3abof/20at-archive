posted = "2007-01-24"
text = "الاخ السباك بتاع المجارى<br />وانت محموق اوى كده ليه هعهعهعهع<br />وانت مين قال لك انهم مش فاسدين<br />واضح اساسا انك منهم من زعلك اوى كده و اتجاهك ( كالعاده ) للشتيمه<br />وبعدين هما ضد الحكومه ، بس هل ده معناه يعنى انهم كويسين؟؟ ، يعنى لو اولمرت بتاع اسرائيل وقف ضد الحكومه المصربيه هتعتبره مناضل و شريف !<br />ايه التخلف اللى انتو فى ده<br />والله الاخوان ليهم حق يركبوا على قفاكم."
