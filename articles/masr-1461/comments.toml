text = "بتندة علية فى الظلمة وبنسمع نداة<br />تصحالة من قبل الاذان<br />نروح نقابلة فى الغيطان<br />فى المتاجر والمصانع<br />والمدارس والساحات<br />طالعالة صحبة صفوف الوف<br />طالعالة رجال اطفال بنات<br />كل الدروب واخدة بلدنا للنهار<br />بنحب موال النهار"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

