[[comments]]
order = 23
subject = "من السهل"
author = "من السهل جداً القضاء على شخص لكن من الصعب القضاء على الفكر والإخوان فكر ومبدأ ولذلك أستمر حب الشعب لهم"
posted = "2007-01-19"
text = "كلما أعتقل مبارك القذر من الأخوان أجدهم من كفاءات مصر التى لو أراد مبارك أن ينهض بمصر لكان هؤلاء القيادات النادرة والشباب الواعى هم من سينهضون ولكن مبارك القذر يعتلقهم لإنهم كفاءات ولم يقتلوا مثله ليصلوا للحكم ولم ينهبوا مصر ولم يفسدوها ولم نسمع أنهم حاولوا توريث الحكم للإبن الأهبل المدمن الذى يعتقد أن مصر لعبة يريد أن يلعب بها فى لحظة من لحظات إدمانه للهروين."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

[[comments]]
order = 24
subject = "مزنق"
author = "ميدان التحرير"
posted = "2007-01-19"
text = "انتو الصراحه زودتوها اوى فى الموئع بتاعكو ده كل مره تتنيلو تكتبو موضوع عن الاخوان و يرد كام واحد هم هم بنفس الاسلوب و نفس الكلام المستفز و قال يعنى البلد كلها مع الاخوان واللى يستجرى و يعترض تعدوا تزنقوا عليه فى الكلام و تبص تلاقى عشر ردود عليه قال يعنى الاغلبيه رافضه كلامه هعههعهعهعهع ،<br />.. كفايه استهبال على العالم بقى غرضكوا ايه .. اقامه دوله اسلاميه ؟؟ حرام عليكم بقى العصابه دى هى اللى هتقيم دوله اسلاميه ولا اللذيذ اللى بيقول عمركوا شوفتم منهم حاله عنف ... انت عبيط يعنى و لا بتستعبط علينا .. ده كلامهم بس عباره عن حاله عنف ومفيش مجال اصلا لاستعراض تاريخهم الاسود من ساعه البنا لحد دلوقتى من مؤامرات و اغتيالات و صراع على الحكم و اساسهم الوهابى الدموى اتريق يا خويا انت وهو على الكلام ده واستخف بيه مهو انتو متعلمتوش غير يا التريقه و الشتيمه يا الكلام الخيالى الخيبان اللى ملوش اساس و البيه اللى بيقول هتتغاظوا اكتر كمان وكمان لا يا عم الناصح ده احنا بكره اللى نتفرج على خيبتكو و انتو بتشوفوا المقلب السخن اللى انتو واخدتوه فى الجماعه دى قال نتغاظ قال هههه الا اذا كان لسيادتك مصلحه معاهم بقى ده موضوع تانى."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

