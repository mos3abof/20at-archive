[[comments]]
order = 13
subject = "القافلة تعوى والكلاب تسير"
author = "رئيس تحرير"
posted = "2007-01-18"
text = "رئيس تحرير<br />القافلة تعوى والكلاب تســــير<br />القافلة هنا هى الشعب المصرى ولكن العواء ليس عواء وانما حسرة والم وحزن على ما آلت اليه احوال البلد .<br />اثبتت الايام صدق التوقعات بتوريث الحكم والتعديلات الدستورية تسير فى هذا الاتجاه وبعد ان ظن العاقلون والحكماء ان التعديل سوف يقلص من سلطات رئيس الجمهورية وجدنا ان السلطات تزيد وتصل الى حل مجلس الشعب لدرجة ان نائب من الحزب الوطنى احتج بخلع بدلته واصبحت الفضائح ذات الرائحة النتنة والتى تنبعث كلها من قصور الرئاسة او اصدقاء قصور الرئاسة اصبحت تعكر الجو وتفسده فها هو وزير العدل الذى من المفترض انه يحمى الناس ويسن القوانين يرفض رفع الحصانة عن السيد هانى سرور لمجرد انه صديق مقرب من الوريث و فضائح الشركة المملوكة اصبحت على الميديا صباحا ومساءا .<br />الصحة التى كنا ننعم بها زالت واصبحت فى خبر كان واصبح الشعب كله عنده سرطان وكلى وفيروس سى<br />الامن اصبح من حامى الشعب الى مضطهد اى شخص والتعذيب اصبحح مممنهج ولغة الاقسام يا بن و يابنت ال.......<br />سابوا الحرامية واللصوص والمنافقين وكدابين الزفة وتحولوا للاخوان المسلمين يعتقلوهم ويصادروا اموالهم بحجة انهم خطر على امن مصر ويطلع هذا المخرف العجوز اللى باع بلده وشعبه ويقول اصل الاخوان خطر على مصر<br />هما اللى خطر برده<br />الداخليه تنكر اى شىء ومتفرغة لحراسة القصور وقاطنيها اما الشعب يولع مش مشكلة<br />لو عندكم ذرة كرامة وذرة يعنى اصغر شىء فى الدنيا ارحلوا عنا سيبونا وامشوا ومصر فيها اللى يقودها واللى يديرها 80 مليون واحد اكيد فيهم واحد كويس يقود<br />اتوجه اليكم بالنداء ارحلوا بدلا من ان تترحلوا<br />mego-mego.blogspot.com"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042423/http://masr.20at.com:80/article.php?sid=1461"

