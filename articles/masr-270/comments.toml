[[comments]]
order = 0
subject = "الله يولع فيك وفية"
author = "بن الكفر"
posted = "2006-05-03"
text = "امنية انا بضم صوتي لصوتك ومش عايز حد يتكلم باسمي وبقول لسيلدتة المحرر انت لازم تعمل كدة علشان انت كلب السلطة اللي السلطة كل فترة بترمي حتة عضمة ويعالم احتمال تكون حتة لحمة تاكل فية ولازم تعغمل بيها لاكن علشان تكلم باسمي ملكش عندي غير الجذمة ........ والله يولع فيك وفي الريس بتاعك"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120825/http://masr.20at.com:80/article.php?sid=270&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "حسنى لم يعمل حساب لعمره"
author = "مصرى"
posted = "2006-05-04"
text = "قال الشاعر دقات قلب المرء قائلة له أن الحياة دقائق وثوان وحسنى مبارك لم يعمل حساب لعمره الذى يزيد كل سنة بحمولة من الذنوب بسبب النهب وظلم الشعب وتقصير فى حقوق المصريين فى حياة كريمة فماذا ينتظر أن نقول له غير ربنا يخلصنا منك ويجعلها آخر سنة فى حياتك وبعدها نقول للمصريين كل عام وأنتم بخير رحل الفاسد ولن نسمح لوريث فساده أن يحكمنا فنحن أحفاد الرعيم أحمد عرابى الذى قال: لقد خلقنا الله أحراراً ولن نورث بعد اليوم."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120825/http://masr.20at.com:80/article.php?sid=270&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "ابتاااااااااااااااااااااااااااااااااااة"
author = "مجدى اليمانى"
posted = "2006-05-04"
text = "هل ساكون فى تاريخنا متائمرا ام هادم الاوسان<br />كل الذى اريه ان تجرع كاس المارارة لم يكن بالامكان<br />اهوى الحياة كريمه لا قيد لاارهاب لااستخفاف بالانسان<br />ان الحياة لغايه اسمى من التصفيق للطغيان<br />من شعر هاشم الرفاعى"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120825/http://masr.20at.com:80/article.php?sid=270&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "72مليون كفااااااااااااااااااااااااااية"
author = "مصرية"
posted = "2006-05-04"
text = "امنية اناايضا اضم صوتى لك واقول لكل حقير مساح جوخ يتكلم عن نفسة الدنيئة فقط ولا يسمح لنفسة بالحديث بالنيابه عن اىواحد مصرى شريف وكل سنة وانت ياغير مبارك شارب الزفت والمر ويطلع من عنيك انت واتباعك شلة الحرامية حق الشعب المصرى ويجى اليوم اللى تتفضحوا فية وانتم عايشين لان الموت رحمة لاتستحقوها وربنايرزقكم بذل الدنيا زى ما ذليتم مصر وشعبهاالعمر دة كلة ونفسى نعمل عليكم مشروع للتكافل الاجتماعى نحبسكم فى قفض كلاب فى ميدن التحرير ونعمل تسعرة للبصق او اللطم على وجوهكم العكرة ونوزع دخلها على فقراء مصر وقتها مش حيكون فى مصر ولا واحد فقير غورواااااافى الف داهية تاخدكم ياساااااتر فعلا معندكوش ريحه الدم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120825/http://masr.20at.com:80/article.php?sid=270&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "والله خسارة البصقة فى وشهم"
author = "مصرى"
posted = "2006-05-04"
text = "إن شاء الله عيد ميلاده هايكون آخر أحزان مصر ونهنىء المصريين جميعاً بالخلاص منه وإيانا ومحاولته توريث الحكم لازم نبقى كلنا عارفين إن مصر عمرها ما هاتتورث زى ما قال أحمد عرابى لقد خلقنا الله أحراراً ولن نورث بعد اليوم ويبدوا أن احمد عرابى كان حاسس أنه هاييجى حاكم متخلف عقلياً أثر عليه الزهايمر وإعتقد أنه ممكن يورث الحكم لإبنه المعتوه المدمن ولن يحدث إلا على جثث المصريين جميعاً."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120825/http://masr.20at.com:80/article.php?sid=270&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "بتحكم مين؟"
author = "مصرى"
posted = "2006-05-05"
text = "أحنا المصريين بنقول لك إنت قاعد ليه لم ننتخبك وزورت الإنتخابات لضمان بقائك فى الحكم وإحنا كلنا بنرفضك وإنت مش من الشعب إنت خائن لإن إللى عملته فى الشعب لا يفعله حتى المحتلين من نهب وسلب وفقر وإنتماء لإسرائيل ولأمريكا لحمايتك من شعبك الكاره له الرافض لوجودك فإرحل غير مأسوف عليك ولتعلم أننا لن نورث بعد اليوم كما قال أحمد عرابى وإقول لك كلمة أخيرة أخرج من مصر مصر لم تنجب إلا أبنائها المخلصين وأنت خائن ولست إبن مصر وليس لك مكان فى مصر"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120825/http://masr.20at.com:80/article.php?sid=270&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "ابتاه ماذا قد يخط بنانى"
author = "نيفين"
posted = "2006-05-10"
text = "شكرا يا ا/مجدى اليمانى على الابيات الحلوه من قصيده ابتاه ماذا قد يخط بنانى<br />اهى حاجه نصبرناو بقول للزعيم<br />اللهم لا تسلط علينا بذنوبنا من لا يخافك و لا يرحمنا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120825/http://masr.20at.com:80/article.php?sid=270&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "لاتتعجلوا النهايه"
author = "refaee"
posted = "2006-05-27"
text = "لاتتعجلوا نهايته فهي قادمه<br />وسوف تكون علي يد من يحب, انه الوريث جمال<br />مصداقا لقوِل الله ( فأتاهم الله من حيث لم يحتسبوا)<br />وتاكدوا أن الوريث يستعجل الامور, ويريدها حالا<br />وان شاء الله تنتهي مملكه ال مبارك عما قريب ,<br />فلم يعد لها الا قليل جدا, وصدق الله اذ يقول ( ان<br />موعدهم الصبح 0 أليس الصبح بقريب)"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120825/http://masr.20at.com:80/article.php?sid=270&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
