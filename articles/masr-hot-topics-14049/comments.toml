text = "الحمد لله على الفوز وربنا يسهل يوم الاربعاء للفريق الاحسن<br />بس ياجماعه صدوقنى ده اصعب مباره اشوفه فى حياتى<br />وانا شايف العرب بيعملو كده فى بعض بسبب لعبه<br />ولو كنت مسئولا لامرت بلعب المباره وبعد فوز مصر ان شاء الله<br />اهدى الصعود لمنتخب الجزائر الشقيق ونعرفهم ان المصرين اهل الكرم<br />مش عايز اشوف المنتخب فى كاس العالم ونخسر دوله الجزائر<br />الله اعلم بالطرف الثالث اللى فى الموضوع اللى بيزود مشاكل العرب<br />وتحياتى للجميع"
