text = "لو سمع اليهود هتاف الحناجر تلك التي في مباراة الأمس، لو سمعوها في أرض فلسطين من مسلمين شدوا الرحال لنصرة الاقصى، والله لفرُّوا ولم يبقَ فيها أحد! أي نصر وأي فوز والأقصى مُهددٌ بالانهيار في أيَّةِ لحظة؟؟؟ أيُّ نصر وأيُّ فوز والأرض التي بارك الله فيها مُحاصرة ومُحتلة وفيها يُفسد اليهود؟؟؟ لا حولَ ولا قوة إلاَّ بالله.. اللهم أصلح حالنا ووحِّد قلوبنا على حبِّك وحبِّ نبيِّنا وحبِّ مسجدِك الأقصى ونصرته.. اللهمَّ آمين"
