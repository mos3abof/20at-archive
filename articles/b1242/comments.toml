subject = "الكلام ده عفا عليه الزمن"
author = "shell|r00t"
posted = "2006-09-25"
text = "بسم الله الرحمن الرحيم<br />اولا احب اشكرك علي الموضوع بتاعك<br />بس في عندك شوية نقاط غلط<br />اولا الكلام الل انتي بتقوليه ده اغلبه كلام قديم عفا عليه الزمن لو هنتكلم عن الhacking دلوقتي العملية اتقدمت في كل مجالاته بدأ من hacking emai (اختراق الايملات)<br />او اختراق الاجهزة او اختراق المواقع والسيرفرات والشبكات او اختراق شبكات الهواتف او ما يسمي بالفريكنج<br />وفكرة انك تستخدمي برنامج انتي فيرس في فكرة حمضانة لامواخذة لاني ابسط شئ انه ممكن يعمل فيكي هيتبعتلك ملف يوقف عمل الانتي فيرس والفايرول بتاعك في اقل من ثانية وساعتها طبعا هيكون جهازك اكبر عرضة او بوابة كبيرة للاختراق او نزول الفايروسات دي حاجة بسيطة في موضوع الاجهزة<br />موضوع الاجهزة دلوقتي اتقدم لدرجو اني ممكن اخترق جهازك بمجرد معرفة الاي بي الخاص بيكي IP<br />وده سببه عيب يوزر user ليه لانك مثلا مش بتنزلي اخر التحديثات بتاعة الويندوز وكمان دلوقتي ميكروسوفت مش هتقبل النسخة بتاعتك علشان نسخة مضروبة مش اسطوانة اصلية للويندووز معترف بيها في الشركة الزفت اللي اسمها ميكروزفت<br />طيب لو قعدنا نتكلم عن اساليب الهاكر دلوقتي هنقعد نتكام لسنين قدام علشان اقدر اوصلكم لمدي التقدم اللي وصلناله في عمليات التشفير والتخفي علشان عملية الاختراق تتم بسلاسة وبسهولة ومن غير ما سيادتك تعرفي انك مخترقة اساسا<br />سيبك بقي من الاجهزة والايملات والكلام العبيط ده<br />تعالي بقي نتكلم علي موضوع اختراق المواقع والسيرفرات وده بيشكل دلوقتي خطر كبير جدا علي مواقع كبيرة والسبب الاساسي في الاختراق لموقعك بيكون انت<br />اولا مش بتابع التحديثات اللي بتنزل او الباتشات اللي بتنزل للسكربتات اللي بتستخدمها في موقعك<br />دلوقتي اقدر اقولك مثلا انك لو عندك موقع مدونة فانتي معرضة لااختراق بنسبة 98%<br />ليه اولا الاسكربت اللي بتستخدميه في موقعك ممكن اخترققك منه<br />مش كده بس لا انا ممكن اخترققك عن طريق السيرفر اللي انتي مستضيفه عليه وحوارات كتير ة<br />نيجي بقي لو ربنا رزقك بواحد دم اهله سئيم<br />وحب يطلع عينك ويدمرك هيشتغل علي الموقع بتاعك بنوع هجوم اسمك هجوم حجب الخدمة وهوه انه بيستهدف الموقع بتاعك عن طريق كمية اتصالات بتم عليه والاتصالات دي بتكون وهمية بس فعلا بتم علي السايت بتاعك لغاية لما يستهلك كل الموارد بتاعت الموقع بتاعك<br />مش كده كمان ده ممكن يطير الداتا بيز بتاعت الداتا سيرفر كامل<br />طبعا الهجوم ده اتطور دلوقت يزمان كان لازم عدد ويقعدوا يشتغلوا في نفس الوقت<br />علي الموقع بتاعك لغاية لما يوقعوا الموقع وده زمان كانوا بيسموه جهاد الكتروني لما كان بيتم علي المواقع اليهودية ايام الانتفاضة بتاعت فلسيطين<br />دلوقتي الهجوم ده اصبح مش لازم عدد شخص واحد ممكن يقوم بعمل الاف من الاشخاص<br />الهجوم ده اسمه DDOS وفي نوع جديد منه اسمه DRDOS<br />بصي بقي الهجوم ده دلوقتي الحماية منه صعبة جدا لانه بتكلف تكلفة عالية علي الشركة اللي مستضيفة الموقع بتاعك<br />او انهم يجيبوا واحد يعملهم حماية منه وده بياخد فلوس كتير قوي علشان كده اغلب ان مكنش كل الشركات مش بتعمل الحماية بتاعته ومعرضة في اي وقت انها تنضرب منه<br />اااه بصي الكلام كتير قوي بس لو عاوزه تعرفي اكتر حدددي الموضوع اللي انتي عاوزه تعرفي فيه مجال ومعلومات اكتر وانا ممكن افيدك وده عن واقع خبرة شخصية<br />ياريت مكونش طولت عليكم بكلام ملوش لازمة<br />سلام<br />shell|r00t<br />Security 4 Arab Team"
