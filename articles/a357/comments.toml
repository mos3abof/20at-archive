subject = "رأي الأمهات"
text = "بكرة كلكم تبقوا امهات وآباء وتعرفوا ان مهما عملتم مش هتوفوا جزاء الوالدين .. وكمان مهما عملتوا وحش مش هيزعلوا منكم<br />براحتكوا يا ولاد"
archived = "2004-08-03"
