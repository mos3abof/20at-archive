subject = "ادعوا لهم يا جماعة"
text = "يا ريت نحاول كلنا نعود نفسنا اننا ندعي لأهالينا في كل صلاة، علشان تكون عادة حتى بعد ما يتوفاهم الله. ليصدق علينا جميعاً قول رسولنا الكريم \"ولد صالح يدعو له\""
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803042542/http://www.20at.com:80/article.php?sid=357"

