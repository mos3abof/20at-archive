[[comments]]
order = 5
subject = "يا سلام ع التقى !!!!!!!!!!!!!!!!"
text = "اللي اعرفو انك نرفوزة وصوتك عالي فى البيت وما عندكيش رغبة فى النقاش الطويل برافو عليكي التغير ده ويارب يكون مستمر ... ربنا معاكي ......... على فكرة الافكار بتاعتك جميلة وبتخرج عن النمطية فى طبيعة التناول حتى لو الفكرة نفسها مستهلكة ودي حاجة جميلة جدا ربنا معاكي وان شاء الله كل ما تتعبي اكتر هتلاقي توفيق ربنا قدامك !!!!!!!!"
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019021259/http://www.20at.com:80/article.php?sid=357"

[[comments]]
order = 6
subject = "مسلمه"
author = "لسلام عليكم ورحمه الله وبركاته"
text = "انا مريت بتجربه حقيقيه مع امى وابى اولا امى انا كنت عاصيه لامى وكنت لم استجيب لهاكانت تقول لى دائما ابعدى عن فلانه وانا كنت بعرضها وفى الاخر قولتلها حاضر بس كنت بكلمها من وراهاحتى عرفت امى وكانت لها صدمه ورغم ذلك استمريت مع هذه البنت وكانت هى سبب كل مشكله فى حياتى بعد كده ونلت غضب امى وكان اصعب شئ عندى وابى كنت لم اسمع كلامه وكنت بعرفع صوتى عليه ونلت غضبه ايضا وبعد ان كبرت وعرفت ان الدنيا لا تسوى شئ من غير رضاهم تمنيت منالله ان يسمحنى وان يعنى على طاعتهم وكل ما بغلط استغفر الله يجعل قلبى هادء عليهم الحمدلله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142929/http://www.20at.com/article.php?sid=357"

[[comments]]
order = 7
subject = "الأم والأب كلمتان أقرب للقلب من الحب ."
author = "اعة الوالدين شىء جميل يكفى أن تدعوا الأم لإبنها او لإبنتها والله يا جماعة مش هتحسوها دلوقتى أنا والدتى توفيت من حوالى 3 أسابيع وقبل وفاتها بيوم بوست إيديها وقولتها راضية عنى يا ماما قالتلى راضية عنك وأنا بحبك ربنا يسهلك ويكرمك يا إبنى وعايزة أفرح بيك قبل ما أموت . اليوم اللى بعدها تعبت فراحت للمستشفى لإن كان عندها تليف بالكبد أدى الى الاستسقاء وحصل نزيف داخلى وتوفيت وهى على يدى وكان أخر كلامها أن رددت الشهادة أكثر من عشر مرات فقبلت يديها ورأسها وكنت متماسكا جدا لإننى رأيت فى أمى القدوة الحسنة والصلاح والتقى كانت صامدة أمام المرض اللعين . رحمها الله ."
text = "والله يا جماعة بعد وفاتها أحس بسعادة غامرة أحس أن الله راضى عنى أحس بشعور طيب تجاة الناس أحببت الناس جدا وفقنى الله فى عملى أكثر وأكثر صار بعض الشركات الكبرى فى كم دولة عربية يطلبوننى بالإسم وذلك ليس ذكاء منى وإنما بفضل الله وبفضل أمى الصالحة التى توفيت على يدى وهيا راضية عنى .<br />إخوتى الأفاضل أدعو الله أن يرحم أمى وأن يهدينا جميعا وأوصي كل الأخوة بأن يطيعوا والديهم كما قال الله عزوجل . ( وَقَضَى رَبُّكَ أَلاَّ تَعْبُدُواْ إِلاَّ إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَاناً إِمَّا يَبْلُغَنَّ عِندَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلاَهُمَا فَلاَ تَقُل لَّهُمَا أُفٍّ وَلاَ تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلاً كَرِيماً).<br />عبدالله فرج"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142929/http://www.20at.com/article.php?sid=357"

