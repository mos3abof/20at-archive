order = 0
subject = "الصلاة"
text = "انا عندي فكرة ممكن تفرق..يعني مثلا لو موجودين في البيت..فيها إية لو صليناكلنا مع بعض جماعة...و لو بابابيصلي في المسجد..فيها لو صليت انا و اختي و امي...<br />دايما لما اصحابنا بيكونوا عندنا في البيت بنصلي سوا..لية مش بنعمل كدة مع اهالينا!!"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803042542/http://www.20at.com:80/article.php?sid=357"

[[comments]]
order = 1
subject = "فكرة روعة"
text = "واحد حكى لي فكرة روعة وهي أنه عزم أمه لوحدها - هو متجوز- في مطعم شيك جدا ورومانسي قوي<br />بيحلف لي ان أمه بكت وكادت تبوس ايديه من الفرحة<br />تخيلوا وهي عارفة انه سايب زوجته وأولاده وقاعد معاها 3 أو 4 ساعات في مكان رائع<br />متيجوا نجرب"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803042542/http://www.20at.com:80/article.php?sid=357"

[[comments]]
order = 2
subject = "متعود .. دايماً"
text = "عمري ما قلت لأمي الأكل وحش .. دايماً أهبر الأكل علطول .. حلو كان أو حش .. وأقول لأمي قبل ما أقوم .. تسلم إيدك يا ست الكل ..<br />عمري ما رفعت رجلي وأنا جالس أمامهم وعندما أكون مرهقاً وأريد أن أمدد قدامى .. أستأذنهم"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803042542/http://www.20at.com:80/article.php?sid=357"

[[comments]]
