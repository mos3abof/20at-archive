[[comments]]
order = 9
subject = "صراحة"
author = "ر الوالدين في هذه الايام يحتاج الى مجاهدة خصوصا في الاسر المفككة و الاسر التي تفضل بعض الابناء على بعض و الاسر التي بها الوالد او الوالدة مشغولين عن الابناء بحياتهم الشخصية و الاسر التي لا تهتم باولادهم من الناحية المادية فقط و الاسر الغير ملتزمة بالاسلام"
text = "اقول ان هؤلاء جميعا لابد من برهم و لا مناص من ذلك<br />و لكن الامر يحتاج الى مجاهدة و اهتمام<br />و الله المستعان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142929/http://www.20at.com/article.php?sid=357"

