subject = ""
author = "مش رضوى حسن ولا مروى صلاح"
posted = "2009-02-13"
text = "الشعب المصري اصله اهبل ومش فاهم اصول السرقة<br />السرقة ليها اصول يا بلد<br />لما تيجي تسرق لازم تبقى عضمه ناشفه<br />تسرق وانت عضمه طرية حيدوك بالجذمه مش علشان خاطر انت سرقت … لا لا لا<br />علشان خاطر انت سرقت من وراهم يا حمار… افهم يا شعب اصول السرقة<br />لما تيجي تسرق لازم تبقى عضمه نشفه<br />اقولك انا بقا ازاي تبقى عضمه ناشفة<br />لازم يكون ليك ضهر من الحرامية الكبار<br />زي ممدوح اسماعيل كده غرق 1000 واحد بس كان ليه ظهر<br />ما حدش عرف يلمسه ليه لانه عضمه ناشفه<br />اما الناس الهبل اللي الموضوع بيتكلم عندهم دول عيال خايبه عضمة طريقة<br />كان لازم يشفلهم لوا من اللواءات الكبار يشتغلوا معاه علشان يحميهم<br />سلام يا صاحبي"
archived = "2010-02-14"
capture_url = "https://web.archive.org/web/20100214023424/http://www.20at.com:80/masr/news/11274.html"

