author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-02-13"
text = "محاكمات ايه وبتاع ايه وبطيخ ايه<br />وايه يعني الامتحانات اتسربت<br />ايش يكون في غرق 1000 واحد في عبارة<br />ولا بيع اصول الدولة<br />ولا هزيمة 67<br />ولا الغذية الفاسدة<br />ولا المسرطنة اللي بيستوردوها<br />ولا الفشل الكلوي والسرطان اللي بقوا عاملين زي الانفلونزا<br />وبعدين هما حرامية حيحاكموا حرامية<br />ما الحال من بعضه<br />بلد عجيبة<br />تهرب ممدوح اسماعيل وتمنع ممدوح زكي زخاري من السفر<br />علشان خاطر ايه سافر اسرائيل<br />وايه يعني لما يسافر اسرائيل يبعله شوية معلومات<br />عجيبه يا بلد"
archived = "2010-02-14"
capture_url = "https://web.archive.org/web/20100214023424/http://www.20at.com:80/masr/news/11274.html"
