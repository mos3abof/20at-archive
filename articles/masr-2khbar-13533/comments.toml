author = "اخوان مين ؟"
posted = "2009-09-27"
text = "يا عم اعتقلوهم كلهم وريحونا بقى<br />انما نعتقلهم النهاردة ونفرج عنهم بكرة فا احنا اصابنا الملل من المسلسل البايخ دة<br />اعتقلوهم وخللونا نشوف مصالحنا<br />والا سايبينهم علشان تقولوا لدول الغرب الحقوا الاخوان هيمسكوا الحكم زى حماس فى غزة ولا ضرورة عن التوريث علشان الاخوان<br />يروح الاخوان فى ستين داهية<br />فية تيارات فى البلد غير الاخوان<br />فية الوفد والاغلبية الصامتة وممكن نختار استاذ زى حسب اللة الكفراوى يبقى رئيس للدولة او ابو زيد وزير الرى الاسبق او نعمل رشيد رئيس دولة"
archived = "2009-09-29"
capture_url = "https://web.archive.org/web/20090929010528/http://www.20at.com:80/masr/2khbar/13533--21-.html"
