subject = "أفضل حل"
text = "أظن أحسن حاجة ان كل قناة فضائيةعربية و كل جريدة عربيةتقوم بجمع التوقيعات علي هيئة مكالمات او رسالات من المحمول لأن المواقع العربية علي النت ليس عليها اقبال كبير مثل اليهودية.قد تفلح جمع التوقيعات عبر النت بعد 100 سنة عندما يوجد معني حقيقي للقومية العربيةو تقدم عربي.قد يفلح جمعها علي قنوات الاغاني بسبب اقبال كل عربي عليها(هم يضحق و هم يبكي!!)"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035928/http://www.20at.com:80/article.php?sid=175"
