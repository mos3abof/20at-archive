[[comments]]
order = 4
subject = "واحد رخم"
text = "المرة دى رخامة عامة بمعنى لو اننا عاوزين نجمع توقيع علشان موقع بيسىء للاسلام او المسلمين بلاش ياعم الاسلام علشان الحساسية ،لو احنا عاوزين نجمع توقيع فى قضية عربية كان ممكن نجمع كام توقيع فى يومين ،<br />اكبر توقيع اتجمع على قضية فى يومين ما يزيدش عن 70 توقيع \"قضية الحجاب فى فرنسا\" ، وفى نفس التوقيت انا فاكر ان برنامج سوبر ستار تابعه ماعرفش كام مليون وحصل كام مليون اتصال علشان تفوز الست ديانا كروز"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035928/http://www.20at.com:80/article.php?sid=175"

[[comments]]
