subject = "زعل ...كبييير !"
author = "الشمحطجى"
posted = "2006-05-31"
text = "زعل ...كبييير !<br />علشان لامؤخزة البنى آدم الى شوه التعليق بتاعى وحزف منه وخلخله..ومن الاساس انا مقلتش حاجة لامؤخزة لا تجرح حد ولا تعوره والى شال الكلمات من التعليق يروح يدور على معانى الكلمات الى شالها هيلاقيها لا تتعارض لا مع اداب عامة ولا آداب القاهرة ...وبتقولو النظام بيقهركو وكاتم على نفسكو !!!<br />وبفكر بجد انى اقاطع ام الموقع ده...ومش الموقع ده بس ...كل النت !!!<br />بلا أرف ...عكرتو دمى ع الصبح الله يخرب بيوتكو !<br />والنظام بتاعنا فعل ولاد \"...\" ولو وقعو فى إيد واتمكنت منهم ه\"...\"<br />على فكرة انا الى مكتبتش زوقياً منى مش خوفاً من حد !!<br />وبجد بفكر انى اقاطع النت عموماً !"
