[[comments]]
order = 16
subject = "الاسكندرية"
author = "ahmed"
posted = "2006-06-02"
text = "أعتقد أن الإعتصام حق للإنسان فى دولة حرة ولكن مصر دولة تحت الإحتلال ولننظر كيف كان الزعماء فى عصور الإحتلال لمصر يتعاملون مع المحتل والدفاع عن مصر وعن شرعية وجود المحتل على أرض مصر الغالية وهم جميعاً من الحقوقيين مثل مصطفى كامل ومحمد فريد وسعد زغلول وغيرهم كثير. فنظام الحكم الموجود فى مصر ليس نظام شرعياًلأن الرئيس حسنى مبارك لم يأتى للحكم منذ تولى الرئاسة بإنتخاب الشعب كما ينص الدستور وكان وجوده فى الحكم طوال هذه السنوات بالتزوير وما بنى على الباطل فهو باطل. ثانياً كيف للقضاء أن يرتضى لنفسه هذه الوقفة المستجدية فى دولة محتله كان من المفروض المطالبة بتحرير مصر وليس الإنتظار من المحتل أن يعطيهم حقوقهم التى سلبها منهم الذى هو من وجهة نظر القضاء المتهم الأولى على قتل السادات وكل الأدلة تشير إلى أصابعة الخفية فى ذلك وكان لا بد أن يسقط القضاء شرعية الحاكم فى وجوده فى الحكم. وأيضاً لما أصاب مصر من فساد وتدهور وإخلال بكل مؤشرات الحياة من بطالة وتعليم وصحة وقتله للحياة الديمقراطية لكى يضمن سيطرة على الحكم وهذه نفس سياسة المحتل ولكن الحل الوحيد الذى لا بديل عنه هو الثورة على هذا الفساد وخاصة أن الشعب كله مؤيد لكم وملتف حولكم ولكنه ينقصه القيادة وأنتم القيادة الصالحة التى يتمناها المصريين جميعاً فماذا تنتظرون هل تنتظرون أن يقضى عليكم الحاكم كما فعل فى الحياة الحزبية وبذلك تفقدوا حتى أحترام الشعب لكم لا امل الأن إلا بالثورة والشعب كله معكم وفى إنتظار شرارة البداية على أيديكم يا شرفاء مصر لنطهرها من هذا الفساد المتسرطن"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132909/http://masr.20at.com:80/article.php?sid=414"

[[comments]]
order = 17
subject = "هم مين اللي بتقولوا عليهم دول ولا مؤاخذه"
author = "papakimos"
posted = "2006-06-02"
text = "بصراحه بصراحه انا معرفش مين البشاوات دول وليد باشا وحسام باشا مين التالت ده نسيت اسمه باشاوصباح الخير يا باشا وصاح سعادتك يا باشا.... يا باشا يا باشا<br />انا اعتقد ان سعاده فخامه البشوات دول لو اللي فوقيهم قاللهم انزلو الشارع واحضنو الشعب بحب وسلمو عليهم بموده وبوسو ايديهم شعر ودقن هيعملو كده - هم كمان فوق راقابيهم جزمه زي اللي فوق رقابينا هم كمان خايفين علي اكل عيشهم زي ما كلنا خايفين بس هو بعد كده بيتعودو علي كده وبيعملو كده علشان ميتعملش فيهم كده كده ويبقو زينا من غير شغل ولا حتي حبه الكرامه اللي بياخدوها مننا وصدقونو اكيد الواحد منهم مش بيكون فرحان وهو بيعذب حد من اول الباشا الكبير لغايه المخبر البصمجي اللي ميعرفش الفرق بين العولمه وغياب المضمون والمهمزه وغياب التكوين الفردي التوحدي وبطريقه اسهل ميعرفش الفرق بين الالف وكوز الولامؤاخذه الذره<br />الواحد لاذم يكون \"دقيق\" برضو<br />ربنا يتوب علي البشوات من اللي بيعملوه غصب عنهم ويستجيب دعائنا علي اللي بيوزهم<br />وفي النهايه لا يغير الله ما بقوم حتي يغيرو ما بانفسهم"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132909/http://masr.20at.com:80/article.php?sid=414"

[[comments]]
order = 18
subject = "غبى ومستغبى"
author = "أبو أسامة"
posted = "2006-06-02"
text = "امن دولة ايه<br />ازاى يبقى امن دولة وهما مبيشغلوش فيه غير نوعين بس من البشقراسف لحرف الشين هما<br />غبى ومستغبى وطبعا عارفين الغبىوهو العسكرى الأمى الى مش عارف غير اضرب دول<br />اعدأ الوطن والمستغبى هو طبعا القادة و<br />الظباط من اولاد البشوات والبهوات ماهو<br />مش اى حد بيقبلوه فى الشربة قصدى الشرطة<br />وعامل غبى ومستغبى فيهاماهوبياخدعلى قلبه قد كدة دا غير يا باشا ويا بيه الونى مش عارف معناه وتلاقيهم هما كمان مش عارفين معناها ايهبالذمة دول يحموا دولة طيب يحموها من مين من الى عايشين فيهاولامن<br />التانين"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132909/http://masr.20at.com:80/article.php?sid=414"

[[comments]]
order = 19
subject = "قانون الشياطين والكافرين"
author = "العدالة للجميع حاكم اومحكوم"
posted = "2006-06-02"
text = "قانون الطوارئ هو ابليس مظلوم بني مزار ان لااصدق ان واحد يدخل علي ثلاث افراد في غرفة واحدة او غرفتين او كان شخصين ولو نائمين ان محمد عليمحمد احمد عبد اللطيف يستطيع يقتل عشر فراخ لاني الفراخ تستطيع ان تدافع ياحاكم ياقاضي هل رايت بعينك حسبي الله ونعمى الوكيل هل انت مطمئن للحكم هذاحرام ظلم ظلم ظلم في اماكن كتيرة يارب ارفع الظلم عن المظلومين عجل بة يارب"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132909/http://masr.20at.com:80/article.php?sid=414"

[[comments]]
order = 20
subject = "اموات في طرة"
author = "بو محسن محبوب"
posted = "2006-06-22"
text = "فيه حد منكم فكر مرة في المعتقلين السبعين بليمان طرة دول يا عيني مرضي ومفيش حد بيفكر يخرجهم رغم تأكيد الداخلية انهم فعلا من تنظيم طلائع الفتح ولكن لم يعد لهم فائدة خاصة بعد عشرتهم لوليد بابو زعبل رجاء تذكرهم قبل موتهم واسألوا باسل بيه عنهم وعن خطورتهم علي عدم تكدير صفو الأمن لمدة قد تتعدي عشرين عام قادمة"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222610/http://masr.20at.com:80/article.php?sid=414"

[[comments]]
order = 21
subject = "اسألني انا عن باسل بيه"
author = "ابو منه"
posted = "2006-06-22"
text = "انا لا أنكر أنه من افضل الموجودين وفيه خير إلا ان لا احد عاقل بهذا الجهاز يسمع له بخروج هؤلاء المرضي الغير مخاف منهم علي امن الدولة ولا ديوله وبيقولوا انهم بيعالجوا هؤلاء من امراضهم الدينية نصيحة لله اسرعوا في ارسالهم الي بيوتهم فما تفعلون تفريخ لغيرهم وعليكم بالمصالحة لمصلحة النظام بيتعكوا والله والسلام بعد الكلام ابو منه..... معتقل سابق"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222610/http://masr.20at.com:80/article.php?sid=414"

[[comments]]
order = 22
subject = "انا عارف الملف ده كويس"
author = "شادى عادل الصياد"
posted = "2006-06-26"
text = "ملف أى شخص فى أمن الدولة<br />لاتزيد المعلومات فيه عن المعلومات التى فى شهادة الميلاد<br />وإلا لماذا قبض على تحرى وأنا لم أفعل شيئا؟"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222610/http://masr.20at.com:80/article.php?sid=414"

[[comments]]
order = 23
subject = "أدعوا الله أن يجعل كلامك صحيح"
author = "شادى عادل الصياد"
posted = "2006-06-26"
text = "أدعوا الله أن يجعل كلامك صحيح<br />حتى يعرف من هو الارهابى ومن هو الصالح"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222610/http://masr.20at.com:80/article.php?sid=414"

[[comments]]
order = 24
subject = "دعوة للمصالحة"
author = "ابو حبيبة"
posted = "2006-06-27"
text = "عايز اعرف ليه ما يكونش فيه حد عاقل يحافظ علي ماء وجه الجماعات الدينية وهيبة جهاز الأمن ويصلح بينهم اكيد فيه طريقة يعني للحل وعدم ادخال امريكا في اللعبة في مصر ولا مكتوب علينا ينهبنا الغرب علي مدار السنيين كفاية بقي حرام علي الناس اللي بتحت بنزين بين المتديينين والمسئولين اليس منكم رجل رشيد؟"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222610/http://masr.20at.com:80/article.php?sid=414"

[[comments]]
order = 25
subject = "غريب غريب غريب"
author = "ابو منه"
posted = "2006-06-27"
text = "عايز مرة من المرات اسمع فيها عن ارهابي يهودي أو مسيحي هو الإرهاب ده مصنوع للمسلمين بس يا عالم كفاكم تغفيل لنا<br />ايه ده؟"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222610/http://masr.20at.com:80/article.php?sid=414"

