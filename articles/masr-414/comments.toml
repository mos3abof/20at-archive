[[comments]]
order = 0
subject = "جامد ياد يا درينى !"
author = "الشمحطجى"
posted = "2006-05-30"
text = "كلامك يا درينى ...جامد ونقح ...<br />عجبنى بصراحة...بس هو فى حاجة كده نفسى اقولها..<br />بالنسبة لوليد الدسوقى ...هو اى نعم سفاح وابن ستين فى سبعين بس لامؤخزة وليد باشا ده لسة تلميذ فى مدرسة التعذيب الى فى الداخلية واستعجبت جداً لما لقيت الاخوة فى موقعنا الموقر والمواقع الصديقة زى البلوجرز وخلافة بيضخمو منه وكأنه امنا الغولة ولا ابو رجل مسلوخة !<br />الدسوقى ده لو قناه بواحد زى اسلام عبدالرحمن \"اسم حركى لظابط فى جابر ابن حيان \" ولا حسام باشا نبيه يطلع جنبيهم ملاك بجناحين ...<br />وعلى العموم كلهم ولاد \"..\" يستهلو لامؤخزة \"...\" وعلى فكرة انا لو وقع فى ايدى واحد منهم \"...\" ..والله العظيم هـ\"...\" وبعد ما \"...\" هعصر عليه لمونة علشان يتعذب ...وبعد كده اسيبه يعيش بقية عمره مذلول وسط الرجاله...<br />لامؤخزة !!!"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132909/http://masr.20at.com:80/article.php?sid=414"

