subject = "جامد يبني مووووت"
author = "اميرة هاشم"
posted = "2006-08-30"
text = "جامد يبني التحقيق ده اوي<br />بجد خلاني اقراه من اول سطر لاخر سطر<br />وخلاني اضحك اوي من طريقتك الساخرة<br />بس بعديها عيطت<br />ربنا مع الشعب المصري و يجعل كلامنا خفيف عليهم يبني"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222610/http://masr.20at.com:80/article.php?sid=414"

[[comments]]
order = 28
subject = "زوال الفساد"
author = "شيكوا"
posted = "2006-10-05"
text = "اننا نعيش دولة داخل دولة كدولة الفاتيكان فى ايطاليا ،وغالباماستزول الدولة الفاسدة المتمثلة فى أمن الدولة ووزيرها ورئيسها، ولعن الله هؤلاء المجرمين الفراعنة"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117141125/http://masr.20at.com:80/article.php?sid=414"

[[comments]]
order = 29
subject = "لا حول ولا قوه إلا بالله"
author = "لا مؤاخذة ما اقدرش اقول اسمي لحسن يقول عليا ارهابي"
posted = "2006-10-11"
text = "استاذ دريني الموزون كلامك جامد قوي بس انا شايف حاجة إن ما حدش يقدر يتكلم فبقينا بنفك عن نفسنا في النت من فترة قريبة كلب من كلاب الداخلية كان بيهزر مع واحد غلبان للاسف باين علية انه غلبان عشان كدة كانوا بيتسلوا عليه ويقوله اضرب انت يا مصطفي لا حول ولا قوة إلا بالله<br />قوتهم في ظلمهم حاجة تقرف نفرق ايه عن الغرب ما هم عاملين يطلعوا كل حاجة على المسلمين في العراق وجونتنامو واللازى منه وما حدش عارف يعمل حاجة ولو اتكلمت يا حلاوة بيت ارهابي الحمد لله نصر ربنا قريب ربنا يتولانا"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117141125/http://masr.20at.com:80/article.php?sid=414"
