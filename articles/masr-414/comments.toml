posted = "2006-06-01"
text = "بالذمه حد يصدق ان دول عندهم ملفات وال هباب دى بلد عشوائي ماشي بالبركه والضباط اختييارهم علي اساس غير علمي بالمره صحيح فالحين في الضرب والسحل لكن عقولهم انظف من الطبق البلاستك تفتكروا ان بلد فيه 3االف منطقه عشوائيه ممكن تقدر تعرف اسمائهم ده غير بفضل اتنشار الاميه والتزوير هناك مصريون شهادات ميلادهم مجهوله دول بس عايزين يعملوا عارفيين والامن مستتب"
