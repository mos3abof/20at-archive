[[comments]]
order = 5
subject = "انا الفلسطيني أقول فيكو ايه"
author = "المرفوض أمنيا من المصريين"
posted = "2006-05-30"
text = "طيب أنتو مصريينوأمن الدولة بيمنعكو ويعذبكو ووووو<br />طيب أنا الفلسطيني مرفوض أمني ليه من أمن الدولة بتاعكو ( لاظوغلي ) مع إني اعملت عمايل علشان يرفعوا المنع الأمني عني مفيش فايدة<br />مع إني لم أدخل مصر ولا غير مصر في حياتي<br />أولكم ليه أنا مرفوض !!!<br />لأني مناضل فلسطيني واليهود واضعين اسمي على قائمة الممنوعين من السفر بسسب نضالي ومقاتلتي لهم فعندما انسحب الصهاينة من معبر رفح سلموا كشف الممنوعين من السفر لامن الدولة المصري وبالتالي أمن الدولة المصري رافض دخولي لمصر ولا بأي شكل من الأشكال وحتى مش راضي يتناقش في هذا الامر<br />مرفوض يعني مرفوض<br />وبتقولوا بس اليهود هم الكلاب<br />تقولوا ايه في امن الدولة بتاعكو<br />توقيع المرفوض أمني ( مش عارف ليه)"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132909/http://masr.20at.com:80/article.php?sid=414"

