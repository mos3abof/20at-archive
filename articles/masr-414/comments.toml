[[comments]]
order = 2
subject = "أمن ..بأي حال عدت يا أمن"
author = "ز...و...ح"
posted = "2006-05-30"
text = "من السذاجة ان يتساءل الواحد منا عما إذا كان هذا الوليد الدسوقي \"كنموذج لمن على شاكلته\" هل هو من الآدميين أي ممن لهم قلب ومشاعر وأحاسيس وعما إذا كانت له اسرة من أم وأب وزوجة واطفال ينافح عنهم ويكره لأي منهم مجرد الأذى النفسي قبل الأذى البدني ..وقد يدفع عمره ليحمي ظفر طفله من الأذى والخطر ولا نقل التعذيب والتغريب والسحل وما شابه ...ومن السذاجة التساؤل عما إذا كان هذا الشخص قد حرر بيدية ملفات لأهله وأطفاله ضمن جهاز أمن دولته بحسبانهم من السبعين مليونا أم أنه استثناهم من ذلك بحكم العادة المصرية الله يقطعها .......ومبلغ الظن أن هؤلاء الأبعاض بلا عقل وذاكرتهم ممسوحة وتم انتزاع مواطن العاطفة والأحاسيس الانسانية من صدورهم فصاروا كائنات وحشية حيوانية لا مهمة لها ولا وظيفة سوى الافتراس وحسب..وهكذا تخلت بارادتها عن آدميتها واكتسبت صفاتها الحيوانية وصار منصق القوة منطقها وشريعة الغاب منهجها والاستقواء على الضعيف مبلغ لذتها .... وهذا هو الخطر المحدق بالمجتمع حيث يعيش بينه بل ويقوم على شئونه كائنات لها تلكم الصفات وهو ما يتطلب جهدا هائلا لإعادة تأهيلهم وغرس الصفات الانسانية فيهم من جديد وخرطهم بالناس وليتعرفوا على مسميات لم تدركها حواسهم الحيوانية من قبيل الرحمة والترحم والتواصل والمشاركة الوجدانية ومشاعر الحزن والفرح الانساني والانخراط بالآدميين واكتساب الملكات الإنسانية والرحمة بالضعيف .. بل وتعريفهم أن هناك إله خالق جبار متفرد بالألوهية لا شريك له في ملكه وأن هؤلاء مهما توحشوا وبطشوا وتملكوا هم عبيد لله مهمتم هي عبادة الله كما أمرهم الله بذلك حيث يقول تعالى\" وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ{56} مَا أُرِيدُ مِنْهُم مِّن رِّزْقٍ وَمَا أُرِيدُ أَن يُطْعِمُونِ{57} إِ<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132909/http://masr.20at.com:80/article.php?sid=414"

[[comments]]
order = 3
subject = "والله ما حنخاف .... إيه رأي يا ...... يا بتاع أمن الدولة ؟؟؟"
author = "محمد السيد"
posted = "2006-05-30"
text = "ياتري عندهم عني ايه دلوقتي؟؟<br />مممممممم<br />بس والله دول اجهل من الجهل ...<br />و والله ما يعرفوا حاجة يا ابني ....<br />دول كل واحد بيدور علي مصلحته . فلما بيمشي ويسيب مكانه بياخد معاه كل الشغل والملفات اللي عملها أو يبوظها عشان اللي بعده ميستفدش منه ...<br />يعني مصلحته هو وبس<br />فاطمنوا كلكم .... اول ما بتاع أمن الدولة يتغير بيمسح كل الملفات واللي بعده بيبدأ من الصفر ....<br />وبعدين إنتو ايه اللي يهمكم .... يعملوا اللي يعملوه .....<br />هما حيخوفونا ..؟؟<br />عموما ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132909/http://masr.20at.com:80/article.php?sid=414"

