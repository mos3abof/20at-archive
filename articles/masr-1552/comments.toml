order = 0
subject = "يمكن ويمكن ويمكن"
author = "ما يمكن التماثيل دى بتخسر وبتسبب نكسة للاقتصاد الوطنى والدولة عايزة تبيعها لمثتثمر ينظفها ويهتم بيها والشخص اللى عايز يفوت من الميدان اللى هى فية يدفع رسوم للمثتثمر تشجيعا للسياحة والامن القومى والمحافظة على المكتسبات التى اكتسبها شعبنا"
posted = "2007-02-06"
text = "لية الكاتب نيتة سيئة وبيتكلم عن امور هو مش فاهمها"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209234552/http://masr.20at.com:80/article.php?sid=1552"

[[comments]]
order = 1
subject = "الهندي"
author = "الثقة"
posted = "2007-02-06"
text = "مشكلة الثقة اصبحت المشكلة التي يجب علي اي حكومة ان تضعها في اولويات لان<br />الثقة المفقودة بين الشعب والحكومة هي الفجوة الكبيرة جدا بينهم<br />انا اعتقد ان لو الحكومة قالت انها هتوزع اللحمة ببلاش ؟<br />\" وهو مش ممكن لو حصل \"<br />انا شخصيا اول ما اقول ان ده لحمة<br />مضروبة جابها وزير وعاوزين يتخلصوا من<br />اللحمة والناس<br />لو نفتكر<br />ايام العدوان علي العراق<br />شيخ الازهر قال الي عاوز يروح يجاهد يجي<br />الناس راحت وبعدها \" هوب \" اتخدوا<br />يلا بالشفة<br />موضوع فية لقطة لذيذه جدا"
archived = "2007-02-09"
capture_url = "https://web.archive.org/web/20070209234552/http://masr.20at.com:80/article.php?sid=1552"

