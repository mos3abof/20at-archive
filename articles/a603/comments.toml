[[comments]]
order = 7
subject = "حنان"
text = "أولا : أنا لا أملك دليلا يقينيا يؤكد أن القاعدة هي التي نفذت عمليات 11 أو ينفي المعلومة لكن القاعدة نفسها اعترفت بهذا في الشريط المسجل لأسامة بن لادن والذي أذيع في الذكرى الأولى للعمليات وذكر فيه أسماء المنفذين وأذيعت الوصايا المسجلة لبعضهم<br />أما حكاية الجهاد ... فأنا اعترف أنني في حيرة من أمري ، أنا أكره قتل المدنيين فعلا ، لكن مدنيينا في العراق وفلسطين يقتلون كل يوم بالجملة والموت للمدنيين في أراضينا اصبح مجانيا لذلك وبصراحة فرحت كما فرح الكثيرين بعمليات 11 سبتمبر وشعرت أن على الأمريكيين أن يذوقوا الموت الذي تتسبب فيه حكوماتهم (المنتخبة ديموقراطيا ) في أماكن عديدة من العالم وخاصة أرضنا ... واعتبر أن الفتى الذي فجر نفسه مخلص النية لله هو مجاهد والله أعلم<br />أما تفضيل محمد عطا على زياد الجراح فلم أقل به ولا أخفي اعجابي الشخصي بشخصية زياد الجراح وحيويته وانفتاحه على الحياة ، لكن فيما يبدو ان للجهاد شروطا أخرى توفرت في محمد عطا وهي الجدية ولا يتم أي عمل بدون الجدية<br />منين جبت الكلام ده؟ من اعترافات خالد شيخ محمد ورمزي بن الشيبة المنشورة .. وكذلك تقرير لجنة الكونجرس عن 11 سبتمبر وحلقة سري للغاية التي أعدها يسري فودة عن الموضوع ...<br />يبقى أن أقول أن فعلا 11 سبتمبر هي أكبر حادث مفصلي في عالم القرن الواحد والعشرين وما نملكه من معلومات عنه أكثر كثيرا مما نجهله ... فعلا ، فوق كل ذي علم عليم"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

