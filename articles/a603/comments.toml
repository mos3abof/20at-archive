[[comments]]
order = 16
subject = "نونا الي حنان"
text = "حنان<br />انا زعلانه انك بتروجي لموضوع كلنا عارفين انه مش صح<br />انت كلامك بيقول ان الي عملوه ده من الاسلام و بتصوريهم ابطال<br />و الي اتقال يا حنان امن محمد عطا اصلا اتصفي في المانيا ما سافرش اساسا و ده كلام اهله<br />يا حنان انا مش بظلمك بس فعلا انت بتعملي زي الي قال عنهم فهمي هويدي<br />و كل كلمة الواحد بيقولها بيتحاسب عليها<br />حرام نظلم اسلامنا<br />لان الي حصل ده بعيد جدا عن الاسلام<br />و كلنا فاهمين ان استحاله دولة اسلامية تعمل كده لان احنا معندناش القدرة<br />و الي ماتوا في المركز التجاري معظمهم مسلمين يا حنان لان اغلب اليهود اخدوا اجازة يومها<br />الطيارة ساعة و نص خارج المسار الي المفروض تكون فيه و السلطة الامريكية متحركتش<br />ده غير ازاي المصور عرف ان بالتحديد البرجين ددول هينضربوا و مش مرة واحدة مرتين و يصورها و هي بتنضرب؟؟؟؟؟<br />يا جماعة حرام عليكم اسلامكوا بجد بتظلموه<br />و كل واحد عاجبه عقله و شايف هو بس صح<br />انت مش عايزة حتي تستمعي لنقد الاخرين"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

[[comments]]
order = 17
subject = "حنان إلى نونا"
text = "اولا : فعلا أنا لا أروج لشئ وليس لدي يقين كامل أن المسلمين هم الذين فعلوها لكن لدي أدلة استقرأها..وماعدا ذلك كلام لم تقع أدلة عليه زي حكاية إن محمد عطا اتصفى في ألمانيا وأنا سمعت هذا الكلام من والده وكنت مشفقة جدا على الأب الذي لا يريد أن يصدق ما حدث (لعله حدث فعلا )<br />أنا لا أظلم الإسلام ويبقى اختلافنا حول من فعل 11 سبتمبر لا علاقة له بتقييم الإسلام كدين : افترضي انك ضد الحدث لكن من فعلوه هم مسلمون .. هل يشين هذا الإسلام ؟؟ لا اعتقد .. الاسلام شئ وسلوك المسلمين حتى لو تحركوا تحت رايته شئ آخر وكلها اجتهادات يسمح بها الأفق الواسع للإسلام .. وعلينا أن نسمح للآخرينم بالاختلاف معنا دون الخوف على الاسلام أو على صورة الاسلام<br />وأنا قلت أن ما حدث هو اجتهاد القاعدة في رؤيتها للجهاد .. والجهاد مطلوب الآن كالماء والهواء ومن يختلف مع القاعدة عليه أن يقدم مفهوم آخر للجهاد .. وسنفرح به .. المهم أن نكف عن القعود<br />أما حكاية اليهود .. فالهدف من العملية لم يكن القتل فحسب لكن هز الجهاز المناعي للأمريكان الذين اعتقدوا أنهم في بروج مشيدة .. فتجبروا .. بلاضافة لخسائر اقتصادية جمة (تعرفي أن مركز التجارة الاعالمي كان مركز للجاسوسية الاقتصادية لصالح الأمريكان ) ..<br />نونا أنا سعيدة جدا بنقد الآخرين (رغم ان عقلي عاجبني ) لأن نقد الآخرين هو ما يحفز العقل<br />وبجد أنا باعترف يا جماعة أنه هناك شئ ما يحيرني في 11 سبتمبر وأنتم استسهلتم إدانة الحدث وإلقائه عن كاهل العرب والمسلمين (وريحتم دماغكم) إنما أنا فرحت بالحدث .. ولم أخف من عواقبه .. لأن سوابقه كانت أظلم .. ورغم كل هذا أنا بأكره القتل وخصوصا القتل خارج ساحة المعركة(يسمونه خطأ قتل المدنيين) واتمنى كما أي انسان أن أعيش في عالم آمن يخلو من القتل.. لكن ماذا سنفعل للدفاع عن نفسنا .. من يملك الإجابة يقولها وأنا معه"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

[[comments]]
order = 18
subject = "يا حنان هخنقك"
text = "يا بنتي انا نونا<br />انا يا حاجة مش عارفة اقولك ايه انت سامعة صوتك و بس و مصرة ان الي نفذ العملية القاعدة و ده استخفاف بعقول حتي الاطفال و موضوعك واضح جدا<br />بتقولي ان زياد و محمد ناس كويسيين و حلوين و جمال ان نفذوا عملية 9-11 يا بنتي انت فين الدليل انهم منفذي العمليه؟ و انت ليه مصرة ان ترددي كلام الغرب ان فعلا هم الي نفذوا العملية<br />ده بعد ساعة قالوا ان 19 واحد الي نفذوها و اصلا منهم واحد كان ميت من سنتين<br />اشمعني حادث الطائر المصرية تحقيقة اخد سنة و اكتر عشان يقولوا البطوكي انتحر<br />خلاص يا حاجة انت شايفة ان انت صح و ان هما الي نفذوها حقك عليا و انا غلاطانة يا ستي<br />هما الي عملوها ولا يهمك و القاعدة حلوين و ولاد حلال<br />حقك عليا"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

[[comments]]
order = 19
subject = "إلى نونا وأخواتها"
text = "يا سادة يا كرام..<br />بعيداً عن اتفاقي أو اختلافي مع ما جاء في الموضوع<br />الأستاذة حنان ما جبتش حاجة من عندنا<br />القاعدة هي اللي تبنت العمليات<br />ما حدش ضربها على إيديها وقالها أعملي كده<br />وما حدش ضربها على إيديها وقالها تبني اللي عملتيه<br />أتفقوا أو اختلفوا مع 11 سبتمبر لكن لا تقولوا إن القاعدة ما عملتهاش، لأن أي واحد فيكم كلف نفسه ودخل موقع قناة الجزيرة وسمع شرايط بن لادن هايسمعه وهو بيردد أنه تبنى العمليات<br />بس خلاص"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

[[comments]]
order = 20
subject = "واحد والسلام"
text = "حد يا جماعة سمع حلقات هيكل<br />هيكل بيتكلم عن نقطة مهمة جدا اسمها ثقافة الهزيمة<br />يعني ان الشعب كله يبقي عايش علي اساس ان هزيمته دي شيء واقع لازم يتأقلم معاها وانه هيفضل اسير ليها<br />بعد 11-9 أصبحت الامة العربية كلها تعيش في حالة تعايش وتأقلم مع الهزيمة<br />يا جماعة اللي انا عايز اقوله ان موش مهم مين اللي نفذ الهجمات الأهم اننا بنتحمل نتيجة الهجمات دي حتي ولو كنا لا نعرف عنها شيء<br />يبقي من الافضل انننا نقتنع اننا احنا اللي نفذناها لنبدأ نفهم اللي بيعاقبنا ناوي يفضل يعاقب لحد فين ونفرق بين المنطقي في عقابة وبين الغير منطقي<br />ده افضل من اننا نضرب علي طول الخط من غير ما نسأل اللي بيضربنا هيبطل يضرب امتي<br />علي العموم أنا استمتعت كتير بالمقال<br />وانا موش بروج للهجمات<br />أنا بس بحاول اتعامل بايجابية مع الوضع واانظر للنصف الملئ من الكوب وأتوقع اسوأ الحقائق حتي لا أكون واهما واعيش وحدي في دنيا الخيال<br />وشكرا للجميع"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

[[comments]]
order = 21
subject = "زائـ الفجر ـر"
text = "بسم الله الرحمن الرحيم<br />الحقيقة احنا الحمد لله ماشيين على المخطط الغربي تمام يعني احنا مش فاهمين حاجة وهو ده المطلوب ومشتتين ما بين اذا كانت العملية دي جهاد ولا ارهاب ولا تطرف ولا حركة شعواء واللي عملها بن لادن ولا امريكا ولا اسرائيل وهل بن لادن ده شيخ حقيقي ولا تابع لامريكا ولا يمكن اصلا مفيش بن لادن !!!<br />اكرهك وأحبك في نفس الوقت وفي النهاية الايام هتدور واللي فوق هيبقى تحت واللي تحت هيبقى فوق<br />مسألة معقدة<br />بالنسبة للموضوع منين المعلومات مش مهم على فكرة المهم انت يا صديقي ويا صديقتي عملتوا اية اللي بيقول لاء غلط واللي كمان بيقول صح عملت اية؟؟<br />حررنا فلسطين ؟؟ قاطعنا؟؟؟ حررنا النساء المغتصبات في السجون العراقية ؟؟؟ عملنا اية ؟؟؟<br />والاجابة منكم هنعمل اية ؟.؟ طيب انت عملت اية؟؟<br />والرد ان الله لا يغير ما بقوم حتى يغيروا ما بأنفسهم<br />...... سؤال ؟؟<br />كم قال الأمريكان نحن نطالب ونطالب متمسكين بلفظ نحن دافعي الضرائب فتجيز حكومتهم ما يطلبون .. السؤال كم يقتل من اطفال المسلمين فقط في اليوم الواحد على يد الجنود الامريكان واليهود الممثلين لدولتهم وفي الاصل ممثلين للشعبهم واين دافعي الضرائب؟؟<br />....سؤال ؟؟<br />ما ردكم على الفتوى الحخامية اليهودية ( الدليل جريدة الاهرام المصرية ) يجوز قتل المدنيين في فلسطين حفاظا على الهيمنة اليهودية - وان كانوا قالوا تحديدا المسلمين -<br />..... سؤال ؟؟<br />ما موقفكم من الحالة السودانية والتدخل الامريكي ؟؟ ما هي الشرعية الدولية التي حصلت عليها امريكا لدخول العراق؟؟ ولما نطلب بجزء من ارض فلسطين رغم ان الارض كلها حقنا ؟؟؟ من اعطى لامريكا الحق؟؟<br />.... سؤال ؟؟<br />هل كان القصف الامريكي في بداية الهجمات الامريكية في بداية حرب العراق والي الان قصف لمركز الجيش والرئيس العراقي أم للمدنيين؟؟ واذا كان للجيش والنظام والمدافعين فأين السلاح واين الجيش العراقي ولما لم نرى تدمير لحصن واحد عراقي؟؟؟<br />.... سؤال ؟؟<br />هل تميز طائرات الفانتوم بي والصواريخ الذكية والقنابل العنقودية بين جندي ومدني ؟؟<br />.... سؤال ؟؟<br />لما حتى الان امريكا تسكت عن كوريا الشمالية ؟؟<br />لما نجد الضرب فقط في الدول الاسلامية ؟؟<br />لما تسكت امريكا عن اعتداءات اليهود؟؟<br />لما سكتنا نحن عن التطرف والعنصرية الفرنسية؟؟<br />وملايين الأسئلة بدون ردود<br />اعتقد من يحرر فلسطين سيكون اخرس - لا يعرف اللهو بالكلام- سلام كلام كلام سلام ... هز الصفحة سلام كلام سلام كلام"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

[[comments]]
order = 22
subject = "يلا زى بعضه"
text = "مناالاخر<br />حنان بتقول انها القاعدة وانا كمان معاها<br />حنان بتقول انه نوع من انواع الجهاد وانا رافض بشدة لذلك<br />حنان بتقول انه اجتهاد انا اقول مقيش اجتهاد يسمح بقتل 3 الاف واحد وبعدين نقول اصاب او اخطا<br />حنان بتقول ان امريكا لازم تتعاقب والواضح انها اتعاقبت بالفعل لدرجة ان بوش طلع وقال حرمت اعمل حاجة تانى<br />الاخوة فى الموقع انصار نظرية المومراة التى يمكن ان تكون صحيحة هذا لا ينفى قيام القاعدة بهذه الومراة يمكن الامريكان عرفوا وسكتوا لكن القاعدة هى التى نفذت<br />حنان بتقول ان مخها عاجبها وانا كمان وكل الاخوة فى الموقع مش عايزين يعملوا زارعة مخ او يستنسخوا مخ حضرتك وده مش مبرر لغلق باب الحوار<br />وشكرا"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

[[comments]]
order = 23
subject = "حنان"
text = "انتهى الوقت .. والموضوع خلاص هيطلع برة الصفحة الرئيسية ...<br />أحب أقول أني مش هازعل نونا أبدا حتى لو عايزاني أقول إن القاعدة مش هي اللي عملتها .. وأقفل وداني عن شرائط أسامة بن لادن (ما هو الختق مش حاخة سهلة يرضه)<br />انما أخونا اللي بيسأل عن الاجنهاد اللي ممكن يؤدي لقتل 3000 واحد ... أنا مش فاهمة تصور الناس إيه عن الحروب .. الحرب لازم يموت فيها ناس ... وده حصل في حروب النبي وغيره .. المهم نكون صاحب خق وحربك مشروعة وده ينطبق علينا .. يا جماعة دي مش ثقافة الهزيمة .. دي ثقافة الاستسلام<br />سلام"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

[[comments]]
