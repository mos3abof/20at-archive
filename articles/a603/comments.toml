[[comments]]
order = 14
subject = "حنان"
text = "الأخ لعب عيال : أنا مش آنسة وممكن تخاطبني بلقب أستاذة كما جرى العرف في التعامل مع الصحفيين...<br />ثم ..إذا كانت تقارير امريكا تقول إننا متخلفون وارهابيون فأنا لم أردد هذا الكلام .. مشكلتك هي انك تصدق ما تروجه أمريكا من أن الجهاد والقتال (اللي بيسيح فيه دم) تخلف وارهاب ..\"أذن للذين يقاتلون بأنهم ظلموا وأن الله على نصرهم لقدير\" ونحن ظلمنا .. ولنا حق القتال .. وهذه قضية أخرى ...<br />وبعدين أنا اعتمدت على مصادر متنوعة وجمعت شهادات أطراف الحدث : أمريكا والقاعدة وفي التحقيق الصحفي عليك جمع المعلومات من أطراف الحدث .. ويا ريت كان فيه طرف ثالث ارجع له .. وماتقوليش القاعدة إيه علاقتها بالاسلام .. مهنيا : أسألني القاعدة إيه علاقتها بالحدث ؟؟؟ لأني اتناول حدث ولا اتناول إسلام القاعدة من عدمه .. والقاعدة اعترفت بتبني الحدث والاعتراف سيد الأدلة<br />\"قوة الاسلام تاتى من تمسك اهله به تاتى من عقيده قويه لامن ضربة دم ودمار\"... اتفق معك والجهاد هو جزء من العقيدة وتمسك أهل الإسلام بالاسلام<br />ثم حكاية القلم اللي مسكته وما عنديش حاجة أقولها .. اعتقد ده موضوع ما يستاهلش الرد.. لأن الرد الممكن .. ممكن يكون بالغ الغرور .. وأعوذ بالله من الغرور<br />الأخ : ضوابط ...<br />فعلا المحقق الصحفي هو نائب عن القارئ يتبع أساليب النيابة للوصول للحقيقة و.. الحقيقة دائماعصية وصعبة وأتفق معك أن 11 سبتمبر لغز كبير وأنا اجتهدت في سياق ما عندي من معلومات والله أعلم ... إنما حكاية السطحية والسير وراء بوش .. فهي تهم .. لا تستحق الالتفات ..(أنا وراء بوش ..!!! الله يسامحك )<br />ثم بقي أن أقول لنون أني سعيدة جدا إني استفزتها .. لأن الاستفزاز مطلوب لإعمال العقل ..إنما تحطيني في سلة واحدة مع اللي كتب عنهم فهمي هويدي .. ده حرام<br />أشكر أخونا واحد والسلام لدفاعه عني .. (ما هو لازم محامي فعلا مع سيل التهم اللي تودي النار دي )"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

