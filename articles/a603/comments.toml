subject = "يلا زى بعضه تانى"
text = "يا اخت حنانلو كان لكى صديق اوقريب فى هؤلاء القتلى لشعرت باحساس الظلم والقهر فماذا فعلوا<br />طبعا احنا عارفين سلوك الرسول فى الحرب لايقتل امنا ااويروع شيخا هو طفلا وكلنا فاكرين موقفه الذى اتحدى ان يكون له اى مثيل لاهل مكة بعدما كل ما فعلوه فيه وهو كثير جدا جدا جدا اكثر مما تعلمنله فى المدراس<br />اذهبوا فانتم الطلقاء<br />ليس معنى ان عدوك خسيس ان تكون انت اكثر منه خسة ونذالة<br />والمناسبة ليس لى قريب او بعيد فى الضحايا ولكنها فيمة الحياة الانسانيةالتى رفعها ديننا<br />وشكرا"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

