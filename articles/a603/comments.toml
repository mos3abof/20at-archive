[[comments]]
order = 11
subject = "لعب عيال"
text = "الانسه حنان يبدو انك فعلا وبدون اى تجنى بتكتبى اى كلام وخلاص وهنا تكمن المشكله<br />1-اولا تقرير الكونجرس وتقارير امريكا دايما بتقول انا احنا متخلفين وارهابيين وولادكلب لازم نتمحى من الوجود واعتقد انك برضه مصدقه الكلام ده لانه من امريكا<br />2- شريط القاعده والقاعده كلها ايه علاقته بالاسلام<br />يمكن يكون اسلام السيف والدم وتجارة المخدرات لكن ان وغير نعرف اسلام السماحه والامان والرحمه اسلام لاتقتلوا شيخا ... اعتقد عارفه باقى الحديث<br />3-قوة الاسلام تاتى من تمسك اهله به تاتى من عقيده قويه لامن ضربة دم ودمار<br />4- نصيحه اخيره حاولى تفهمى كل الجوانب قبل ماتمسكى القلم<br />5- ياريت تكونى فعلا عندك رغبه فى توصيل حاجه للناس<br />مشمجرد شوية كلام وخلاص"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

[[comments]]
order = 12
subject = "واحد والسلام"
text = "الأخوة اللي فوق ...<br />السلام عليكم<br />بهدوء شديد جدا ودون انفعال عندي كلمتين عايز اقولهم ..<br />أولا ..النقد موش عيب والموقع ده معمول علشان نتكلم فيه براحتنا لكن الحرية ليها قواعد واول قواعدها انك تسيب اللي قدامك يتكلم براحته وتكون بتحترمه ..<br />ثانيا ممكن أسألكم سؤال ..ايه اللي هيفرق لو كنا مقتنعين اننا لينا علاقة باحداث سبتمبر من عدمه<br />احنا كدة كدة بنتعاقب عنها سواء عملناها او لأ ..يبقي الافضل اننا نكون فاهمين احنا بنتعاقب ليه علشان نعرف نتفاهم مع اللي بيعاقبنا ونعرف نفهمه<br />ثانيا الناس كلها متفقة ان زياد الجراح ومحمد عطا هما منفذين عمليات سبتمبر لكن المشكلة كلها في الجهة اللي واقفة وراهم<br />يعني حنان لم تأتي بجديد ..لم تخترع اشخاص<br />علي العموم أناممتن حقيقي للكاتبة وبشكرها جدا وان كان الشكر لا يكفي<br />والسلام للجميع<br />وشكرا تاني لعشرينات"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233812/http://www.20at.com:80/article.php?sid=603"

