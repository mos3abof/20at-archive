[[comments]]
order = 2
subject = "عندي الحل بس للناس اللى عاوز الحل!!!"
text = "أنا عندي حل بسيط جداجدا جدا جدا خالص؟<br />إيه هو ؟<br />أن إحنا العرب الجرب نبطل عنظزة .<br />ونحاول ندور على حقيقتنا وإحنا ممكن نعمل إيه بجد مش إحنا بنحلم نعمل إيه.<br />بكده حنعرف قدراتنا وننميها حتى بدون فلوس غير<br />1- ثمن المواصلات للأماكن اللى ممكن نتدرب فيها<br />2- أو للمكتبات علشان نستلف كتب نتعلم منها بدل الكورسات اللى مش لا قين ثمنها.<br />3-ونقبل نشتغل في أي شغلانة محترمة مش بتجيب فلوس كثير دلوقتي لكن مش مبتذلة وغير مخلة بالشرف.<br />يعني نبدأ حبه حبه وفي الآخر حيبقى عندنا شجر وبساتين .<br />والله يعينكم يا عرب رجاله وستات مغرورين على الفاضي!"
archived = "2004-08-11"
capture_url = "https://web.archive.org/web/20040811012428/http://www.20at.com:80/article.php?sid=137"

