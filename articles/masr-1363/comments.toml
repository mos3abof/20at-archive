posted = "2006-12-27"
text = "موضوع جميل<br />واطرف موقف فعلا موقف العريس اللى طلع عنده سكر ده<br />صحيح الكدب ملوش رجلين<br />و بالنسبه لموضوع التعديلات انا كمان مستغربه ان عشرينات عامله عليها تلاهى<br />بس لما فكرت فهمت<br />يا جماعه احنا ف دخله عيد و سنه جديده كل سنه و انتو طيبين و مش طالبه نكد<br />و متقلقش يا فارس بعد العيدهنرجع و نكمل النكد ان شاء الله"
