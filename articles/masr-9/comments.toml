[[comments]]
order = 0
subject = "الموت فطيس"
author = "ابن بلد برضه"
posted = "2006-03-14"
text = "والله عنكم حق الواحد خايف يروح اي حته احسن يموت فطيس مش بعيد تروح تصلي في الجامع تلاقي ماس كهربائي زي اللي حصل في مسرح بني سويف وتموت فطيس<br />اه يابلد"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021322/http://masr.20at.com:80/article.php?sid=9&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 1
subject = "ربنا يرحمنا"
author = "بلال"
posted = "2006-04-03"
text = "الله يحم اللي ماتوا واللي لسه عايشين كلنا نستاهل الرحمة من ربنا وربنا يقوينا ع اللي بيحصل في البلد دي"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021322/http://masr.20at.com:80/article.php?sid=9&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "ايوه كدا يا براء"
author = "نيفين"
posted = "2006-04-06"
text = "اكتر من رائع يا براء<br />هى دى المواضيع مش تقوللى بسلامته بيخطب<br />بس قلبت علينا المواجع و الله<br />احب اضيفللك حاجه فى الموته اللى تبع العباره و هى انك لما تموت اهللك مش هيقاقو نفسهم انهم يا خدوا بتارك لان القبطان مات<br />مات و شال الليله يا عينى<br />ربنا على الظالم"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021322/http://masr.20at.com:80/article.php?sid=9&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 3
subject = "عمار يامصر"
author = "omr2005"
posted = "2006-04-10"
text = "عمار يامصر ، وانا لله وانا اليه راجعون ، اذا الشعب يوماً اراد الحياة فلابد ان يستجيب القدر ولابد لليل ان ينجلى ولابد للقيد ان ينكسر"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021322/http://masr.20at.com:80/article.php?sid=9&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 4
subject = "انتوا كده بتهرجوا"
author = "مناضل أنترنتى قديم"
posted = "2006-04-12"
text = "السلام عليكم ورحمة الله و بركاته<br />ايده احنا هانهرج انتوا كده بتتكلموا عن الطبقه الكادحه من الشعب<br />طيب الساده ولاد الاكابر مالهومش نفس<br />مهما مصريين زيكم و لا هى تفرقه عنصريه و السلام بجد ده ظلم ازاى تنسوا واحده من اهم وسائل الحكومه المصريه لتقليل النسل<br />وديه اتفاقيه دوليه كده مع بعض الدول الصديقه وعلى راسها بلاد العم سام<br />انتوا ازاى تنسوا حكاية الطياره بتاع سواحل الاطلنطى و اللى وقعت بنيران صديقه<br />طب بلاش امريكا انتم نسيتوا طياره الخطوط الجويه الفرنسيه اللى وقعت فى الغردقه و لا علشان الضحايا متريشين شويتين<br />وعلى فكره الاتنين وقعوا ى البحر<br />ومن الأطلنطى للأحمر هاتغرق هاتغرق"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021322/http://masr.20at.com:80/article.php?sid=9&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 5
subject = "الموت علينا حق"
author = "مصرية"
posted = "2006-04-20"
text = "كلنا ها نموت والموت علينا حق ولكن المهم ماذا أعددنا للموت هو ده المهم لأن كل إنسان سيسأل عن عمله وعن رعيته ولا بد أن نعد العدة للموت لأن الحاكم سيسأل عن فقراء بلده وعن الشباب وبطالته وعما نهب من أموال مصر وعما زور من إنتخابات لأنه هو الذى طلب الملك ولم يوهبه الله إياه حتى يعينه عليه والله فى عون مصر حتى تتغلب على محنتها من هذا الفاسد"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021322/http://masr.20at.com:80/article.php?sid=9&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 6
subject = "الموت علينا حق"
author = "ربيع"
posted = "2006-04-23"
text = "انتم نسيتم حاجه مهمه<br />مش لازم التعب والسفر والتكلفه<br />ممكن تمشي في اي شارع من شوارع المحروسه<br />ممكن تخبطك عربيه<br />ممكن يكون واحد من بتوع السرفيس<br />او شاب روش بيسابق واحد صحبه<br />لو مش عجباك الموته دي<br />ايه رايك في بلاعات الصرف الصحي<br />ولا بلاش عشان الريحه عموما في حاجه اسهل خد بالك انك ممكن تاخد اي عمود نور بالحضن والكبل الي خارج من العمود هو اللي ممكن يقوم بالمهمه<br />عموما تعددت الاسباب والموت واح<br />اييييييييييييه دنيا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021322/http://masr.20at.com:80/article.php?sid=9&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 7
subject = "دي بس البداية"
author = "لميس"
posted = "2006-04-24"
text = "لومن أولهاالعبارة كدة أمال بعد كدة هيكون إية<br />دي بلدبيزة<br />باين كدة مش لأية إل يعدلها<br />صحيح شببها خربو (أعدين على الرصيف زي ما بيأوو)<br />وبنتها (الرقاصة و المغنية و الشريبة (<br />مبعممش<br />بس أأول إية دي الأغلبية<br />ربنة يكون في عونك يا مصر"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021322/http://masr.20at.com:80/article.php?sid=9&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
