subject = "الأحمق"
author = "أبو أسامة"
posted = "2006-06-06"
text = "وكأن المصطفى(ص)يعيش بيننا الأن ويرى ويسمع<br />كل ما يصدر منةحماة النظام والمستفيدين و<br />الفاسدين الذين يبعون ضمائرهم من أجل حماية نظام فاسد . فيقول نبيناعليهالصلاة<br />والسلام سائلا الصحابة(أتدرون من الأحمق<br />فيردالصحابةقائلين الأحمق يا رسول الله من<br />باع آخرته بدنياه فيرد الرسول صلى الله عليه وسلم قائلا الأحمق من باع آخرته بدنيا<br />غيره)صدق المصطفى صلى الله عليه وسلم<br />وهانحن نرى ونسمع هؤلأ الناس يوميا وعلى مدى 25عامايبيعون وطنهم ويعذبون ابنائه<br />ليحموا نظام رجل عم الفسادوالسرقة والقتل<br />وأستهان بشعبه فأحرقه وأغرقه وأطمع فيه<br />الفاسدون ليسرقوالحمه ويمتصوا دمائه<br />فمن لنا بعدك يا رسول الله .<br />لا.............للفاسدوولده"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044108/http://masr.20at.com:80/article.php?sid=465&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
