[[comments]]
order = 0
subject = "الإخوان لماذا يشوهون أنفسهم ؟"
author = "أحمد"
posted = "2006-05-17"
text = "خيرت الشاطر هو أحد قادة الإخوان الكبار ومنذ فترة قاد فريق داخل مكتب الإرشاد لتمرير التوريث مقابل مكاسب للإخوان وقال إن التوريث ليس معركة الإخوان ، ولم يكذب الإخوان تلك الأخبار دليل على صحتها ... عندما يكون مثل هذا الشاطر من قادة الإخوان الكبار لا يجب أن نتعجب من أى شىء ، للأسف الإخوان جماعة كبيرة جدا وبها من الشخصيات والشباب المخلص الكثير ولكن يقودهم خونة من أمثال الشاطر ،"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211155/http://masr.20at.com:80/article.php?sid=338&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "إعتذار"
author = "أحمد"
posted = "2006-05-18"
text = "بعد ما رأيناه من الإخوان اليوم أعتذر عما كتبته ولكن بالنسبة للشاطر فلا زلت عند رأيى حتى يكذب تلك الترسيبات التى نشرت فى المصريون"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211155/http://masr.20at.com:80/article.php?sid=338&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "الا مبارك جونيور"
author = "لابد للصوره ان تتضح للجميع فمن جملة ملاحظاتى كأحد المنتهكه حقوقهم فى مصر المخروسه أؤكد بكل ثقه ان النظام بعدما فرغ من الاحزاب الهشه و قياداتها و وأدت حلم ايمن نور و من استشعر به بصيص من امل بدا ممكناللحظات و بعدما فرغت من تأديب شرفاء القضاه و ....و...و..."
posted = "2006-05-24"
text = "حان الدور على الاخوان و تصفيه ما تمكنوا من الحصول عليه من مكاسب فكون اعتبارهم ـ من قبل رجل الشارع ـسبيل الخلاص من نظام غبى اكبر جريمه يجب عقابهم عقابا رادعاعليه<br />لقد اطلق النظام كلابه من المنافقين و المنتفعين فى كل وسائل الاعلام للتمهيد لما ينتظر الاخوان من مذابح سوف يشيب من هولها الولدان<br />بالمناسبه<br />فليحكم الاخوان او فليحكم الشيطان فلن ابالى فالمهم الا يحكم مبارك جونيور فيهرب كل سارق بماسرق و لا يحاكم مجرم بما اقترف من جرمو تظل نفس الشرذمه تحكمنا و تتحكم فى مصائرنا<br />ااااااااااااااااااااااااااااااااااااااااااااااه يـــا بــــــلــــــــدى"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211155/http://masr.20at.com:80/article.php?sid=338&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
