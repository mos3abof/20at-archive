subject = "يا وارث مين يورثك"
author = "eyeadam"
posted = "2006-05-25"
text = "المرشد العام يقبل ما يقبلش جمال مبارك اساسا هوا اللي بيحكم البلد مش لسه هيحكم واعلي ما خيلكم رشحوه"
archived = "2006-09-06"
