[[comments]]
order = 0
subject = "لا تصالح ولن يمنحوك الذهب"
author = "مصرية"
posted = "2006-05-14"
text = "رائع يا د. مجدي<br />أمل دنقل قال لا تصالح ولو منحوك الذهب<br />المشكلة في النظام المصري أنه يريدنا أن نساوم وألا نقاوم، حتى دون أن يمنحونا لا ذهب ولا فضة ولا تراب حتى"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142438/http://masr.20at.com:80/article.php?sid=318"

[[comments]]
order = 1
subject = "ابن البلد"
author = "كلامك أثار معان رائعة في النفس، وابن البلد له نخوة لا بد له أن يستخدمها وإن كانت ضريبة حياته الموت، فلا نعرف طريقا آخر للحرية سوى مواجهة الظلم والاستبداد"
posted = "2006-05-15"
text = "واصل طريقك يا دكتور واجعل من كلامك سوطا عليهم حتى نصل إلى بر الأمان"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142438/http://masr.20at.com:80/article.php?sid=318"

[[comments]]
order = 2
subject = "لا تستسلم"
author = "نيفين..نيفى ..نوفا"
posted = "2006-05-18"
text = "اذا الشعب يوما اراد الحياه<br />فلابد ان يستجيب القدر<br />و لابد لليل ان ينجلى<br />و لابد للقيد ان ينكسر<br />الرساله واضحه"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142438/http://masr.20at.com:80/article.php?sid=318"

[[comments]]
order = 3
subject = "عوزنا نقول حاضر و بس"
author = "اسامة على"
posted = "2006-05-19"
text = "الحكومة عوزانا نمشى زى ما هيا عاوزة تقلنايمين نروح يمين تقلنا شمال نروح شمال لكن دا بعدها احنا قعدلكم على الوحدة و مش حنسبكم تعملوا اللى انتم عاوزينة........."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142438/http://masr.20at.com:80/article.php?sid=318"
