text = "حسبنا الله ونعم الوكيل بجد<br />والله ياجماعه حالنا بقا مأسف للغايه<br />بس مش لازم نستمر ف اللى احنا فيه ده .. الخير لسه موجود ياجماعه بس بجد محتاج لسعى مننا .. ولنتوكل ونفوض أمرنا جميعآ الى المولى عز وجل<br />شكرآ اولاد البلد على الموضوع"
