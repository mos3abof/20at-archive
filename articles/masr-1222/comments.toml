[[comments]]
order = 1
subject = "ايه الغم ده"
author = "فارس _fr"
posted = "2006-11-28"
text = "\"ان الله لايغير ما بقوم حتى يغيروا ما بانفسهم \" ياسلام لو جرب يبطل السجاير اللى على الصبح دى وبعدين تدريجيا يبطلها واحده واحده , لو جرب يفطر , لو جرب يسمع اسطوانة القران اللى جبها ابوه ,, لو فكر يعترض على احواله ويقول لالالالالا ...<br />منك لله يامبارك مصير الشاب ده وغيره فى رقبتك ليوم الدين,, وحسبي الله ونعم الوكيل"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073305/http://masr.20at.com:80/article.php?sid=1222"

[[comments]]
order = 2
subject = "يوم حلو ف يحياة شاب معاصر"
author = "إبن بهية"
posted = "2006-11-28"
text = "أقصوصة روعة يا أولاد البلد ... وصاحبها المسكين واحد من أولاد بهية الغلابه اللي طاحنهم إكسبريس مبارك الواطي وعصاباته إذا كان هو ولا أبوه ولا أمه ولا إخوته جميعاً .. يوم في حياة شاب مصري .. المصيبة أنه يوم كويس وحلو والله .. ياهـ لو شفتوا أيام تانيه سودا لشباب من أولاد بهية ... ربنا يهدك يا حسني إنته وحكومتك القذره وعيلتك الأقذر ... أنا عارف إنه مش بالدعاء وحده سنتخلص من ذلك العتل مبارك الواطي .. لكنها تنفيسه لغاية ما ربك يسهل وتشتد همم أولاد بهية ويضربوه ستين صرمه قديمه على سحنته القذره هو وعصاباته وعيلته ... شكرا أولاد البلد على هذه اليومية الجميلة من يوميات شاب مصري وتفصيلاتها الحلوة ..<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073305/http://masr.20at.com:80/article.php?sid=1222"

