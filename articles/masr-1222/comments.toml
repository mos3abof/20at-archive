subject = "على ده الحال أنا"
author = "pelado"
posted = "2006-11-29"
text = "ده حال كل واحد فينا كل واحد فينا عندو داء و مش عارف يبطله بأي طريقة و كل يوم بيقول أنو خلاص أنا مش هعمل كده تاني و يرجع تاني لنفس العادة السيئة أكيد إحنا معندناش ارادة قوية علشان نبطل عاداتنا و ربنا بي يرحمنا برحمته."
archived = "2006-12-05"
