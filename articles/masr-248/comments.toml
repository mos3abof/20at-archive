subject = "مبارك الفاسد"
author = "احمد المصراوى"
posted = "2006-05-13"
text = "السلام عليكم لااقول امثر مما قيل ولاكن كلمة واقفة فى حنجرتى دولة الظلم ساعة ودولة الحق الى قيام الساعة وربنا يولى من يصلح ويكون فيه خير للبلاد والعباد وربنا يأخز رئيسنا اخز عزيزمقتدر ومعا مع القضاة ولا للتزوير ولا لقانون الطوارئ"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517190454/http://www.masr.20at.com:80/article.php?sid=248&PHPSESSID=a417ce98b7af7a46e663526893c140fa"

[[comments]]
order = 9
subject = "القرصااااااان"
author = "مصرية"
posted = "2006-05-15"
text = "حق الاعتصام ... حرية التعبير ...انتخابات نزيهه...كلها قضايا ثانويه بعد قضيه سرقه شعب وليس المقصود هنا سرقه امواله فقط ولكن سرقه عمره واحلامه ومكانته التاريخية .. سرقه مستقبل جيل قدر له ان يولد ويشب ويطحن ويقهر وتضيع آماله فى ظل نظام فاسد كيف نعيد لهذا الجيل ما ضاع من عمره .. كيف نعيد لمصر مكانتها الرائده بعد ان عاشت طوال هذه السنين فى ظل حكم تابع كالكلب للصهيونية الامريكية .. كيف نعيد لمصر اقتصادها المنهار بعد سنوات طوال من السلب و النهب وتهريب الأمال ..كيف نعيد مصر مرة اخرى كدولة منتجة بها مؤسسات صناعيه بعد ان اصبحنا نستود حتى الكبريت انهم يبيعون الصروح الصناعية التى كانت منافسه للصناعات العالميه من قبل.. انهم يبيعون مصر فى المزاد كل يوم.. انهم يصادرون كل مامن شأنه ان يكون فى صالحها ويطلقون الشعارات والبيانات الزائفة العارية من الصحة وكأنهم يقصدون بالحديث دولة اخرى القراصنة لم تشبع بعد ..بعد هذه السنوات من السرقة والسلب والنهب ولكن الطوفان قادم حتما.. والبركان سيثورحتما والنهايه قريبه حتما..والفضيحةآآآآتية حتما ..وسنظل نقول حتى هذه الساعة ..لالالالالالاللفساد .....لالالالالالالقانون الطوارىء ...لالالالالالالاللتوريث...و.. نعم نعم نعم لتعديل الدستور"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517190454/http://www.masr.20at.com:80/article.php?sid=248&PHPSESSID=a417ce98b7af7a46e663526893c140fa"

