[[comments]]
order = 11
subject = "لا يسترد الا بالقوة"
author = "انسان واقعى"
posted = "2006-06-15"
text = "أقول لكم انها المرة الأولى التى اكتب فيها وقد اعجبنى الموضوع وأعجبتنى التعليقات المرفقة بة واعتقد ان النهاية قريبة وان النظام قد تمادى الى المرحلة التى لايمكن السكوت عنها ولكن يا أصدقائى المعركة الأخيرة ستكون مؤلمة ولها نتائج لايمكن حسابها فالنظام يعتقد انة بأنتهاكة لأدمية المصريين سوف يقمع الثورة القادمة لامحالة ولكنة يزيد الأحتقان فى الشارع وعند الأنفجار سوف يدفع ثمن كا الأخطاء التى أقترفها فى حق المصريين ولا تنسو الأغلبية المطحونة التى لا يعلم أغلب من يكتبون هنا عنهم شيئا فهولاء دفعو ليس ثمن الحرية والكبت السياسى ولكنهم دفعو ثمن اهدار كرامتهم فى ظل الفقر المدقع والمعناة الا أنسانية التى يعيشونها هم وفلذات اكبادهم ويوم يوجد قائد لهؤلاء فلن يرحمو النظام او اتباعة والمتغنين بأمجاد الريس والموالون لهم وأقاربهم وحتى نحن ربما لن نسلم من الأنتقام"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904062606/http://masr.20at.com:80/article.php?sid=248"

