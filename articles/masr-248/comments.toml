text = "ما يفعله حسنى مبارك فى معاركه لضمان بقائه فى الحكم يقول عنه العلماء كأنه الوهج الأخير للشمعة قبل أن تنطفىء للأبد وأحنا هنا فى مصر بنقول عنه حلاوة الروح ربنا يطلع روحه ويرينحنا منه فى القريب العاجل وإن غداً لناظره قريب"
