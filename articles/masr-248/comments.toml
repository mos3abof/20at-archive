[[comments]]
order = 0
subject = "أكنك فى دولة أخرى"
author = "مصرى"
posted = "2006-05-01"
text = "حين أشاهد التليفزيون المصرى وأقرأ الصحف الحكومية الملاكى وأطلع على الصحف المعارضة وخاصة جريدتى المفضلة الدستور وصوت الأمة وأشاهد الفضائيات الإخبارية أشعر وكأننى فى دولة عبدة الأصنام فكل المواضيع لتمجيد الحاكم الفاسد وصلوات الشكر والعرفان له فهو المنزه عن الخطأ وهو المعصوم من الخطيئة وكأننى فى عصر الوثنية بالتمام والكمال وهذا لأنهم إنسلخوا عن الشعب وأصبحوا عبيد لسلطة الحاكم وبخصوص صاحبتنا فأنا كنت بأكره بيتى بسببها وكانت تتعامل مع الأحداث على أننا لا بد وأن نكون عبده الشياطين مثلها وإلا مش ها تجيب لنا الشيكولاته وياريت ياريت إللى إسمة تامر أمين يحصلها يارب قادر ياكريم فى القريب العاجل وعلى العموم الصحف الملاكى والتليفزيون المصرى فاقدين مصداقيتهم عند الشعب كله وياريت يقفلوهم إلى إشعار آخر بإذن الله."
archived = "2006-05-05"
capture_url = "https://web.archive.org/web/20060505044259/http://masr.20at.com:80/article.php?sid=248"

[[comments]]
order = 1
subject = "الأهبل"
author = "صابر غريب"
posted = "2006-05-01"
text = "من ظن أنالنظام يحارب معركته الأخيرة فهو واهم الريس صحته حلوة والحرس الجمهوري صاحس والأمن المركزي بيسن سنانهوأمريكا لن تجد في الدنيا أفضل من مبارك لإذلال المصريين وضربهم بالجزمة وإسرائيل لن تجد في الدنيا من يحميها من غضب مصر ومن نهضة مصر أفضل من مبارك ... مبارك عليك مصر يامبارك"
archived = "2006-05-05"
capture_url = "https://web.archive.org/web/20060505044259/http://masr.20at.com:80/article.php?sid=248"

[[comments]]
order = 2
subject = "مع الاخ صابر غريب"
author = "عابر القارات"
posted = "2006-05-01"
text = "للاسف الشديد ما قاله الاخ صابر غريب صحيح تماما فالرئيس إذغ صح التعبير \"مغلف\" بطبقات فولاذية محمكمة الفلق و لا ينفذ منها أو أليهانسمة الهوا و ذلك لزوم الحماية التامة من الرعاع أو الرعية و الكلمتان سواء و طبعا تذكرنى هذه الطبقات بحفاضات الاطفال التى تتسابق الشركات فى تأكيد أنها تحمية و تحمى جلده الحساس فهذه الطبقات أو الجهات التى تحمى الرئيس ربما يكون الامن المركزى هو اخر طبقة منها فالجهات كثيرة مرورا بالمخابرات و الحرس الجمهورى و نواب الوطنى و رجال الاعمال و رجال الصحافة و الذى أعجبنى جدا تسميتهم \"المنافقين الجدد\" على وزن المحافظين الجدد و البلطجية و من باعوا ذمتهم للشيطان و أشتروا الدنيا و نسوا أخرتهم و المرتشون و المفسدون و المطبلاتية و و و و ... و بعد هذا السرد السريع أعتقد أنه قد أصابكم اليأس اليس كذلك و طبعا اليأس نابع من كثرة و قوة و تلاحم و توحد الهدف الذى تنشده كل هذه الطبقات و هو الفساد و لا شئ غير الفساد .... لكن أقول لكم ليست مصر أقوى من الاتحاد السوفيتى مثلا فى زمانه و مع فارق التشبيه من أغلب النواحى لكن أقول لكم إن اليوم أتي لا محالة و كل ما يفعله النظام الان هو شراء بعض الوقت فقط مهما طالت السنين و زادت الطبقات"
archived = "2006-05-05"
capture_url = "https://web.archive.org/web/20060505044259/http://masr.20at.com:80/article.php?sid=248"

[[comments]]
