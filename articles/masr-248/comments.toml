author = "شباب مصر الجدعان"
posted = "2006-05-04"
text = "بصراحة انا متاكد انها معركته الاخيرة ،رغم الامن والمخابرات ومبارك بيفكرنى بعنتر فى فيلم عنتر ولبلب رغم انه قوى وجته لكنه بياخد كل قلم وقلم يطلع من ودانه والغريب ان اللى بيدهولوا المصرى الشجاع رغم صغر حجمه،وبصراحة اكتر الجماعة البعدا بيخوفوا الناس وعاملين فزع مع ان القلم السابع لو فاكرين هياخده فى الطيارة (ما هو طيار بقى )"
archived = "2006-05-05"
