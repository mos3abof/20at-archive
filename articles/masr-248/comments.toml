text = "من كام يوم للاسف قريت مجلة روز اليوسف بالصدفة لقيتهم بيهاجمو كل الناس من اول عمر خالد الى السيد سعد الدين ابراهيم مش فاهم المجلة و القائمين عليها عايزين اية مننا يعنى لا دا نافع ولا دا نافع وتلاقى فى اخر صفحة اعلانات البنك العربى الافريقى و اتش اس بى سى الى بالصدفة الاخ المبجل جمال مبارك شريك فيهم الى بتة من ازاز مايحدفش الناس باطوب يا ابو كمال ولا ايييييييييية (مصرى مفرووووووووووووووس"
