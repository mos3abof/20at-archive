text = "يا عم سياحة اية و نياحة اية<br />d.j بياكل ملبن كل يوم فى فرح او حنة او خطبة ونازل باغانى هابطة تناسب قعدة البانجو والحشيش ورقصنى يا جدع<br />اليومين دول بتيجدى عربية نصف نقل ومحملة شيشة وجوزة والرجالة اللى بيحضروا الفرح فى الحارة او الشارع بيدخنوا ويهيصوا ومعاهم الامناء ورجال الشرطة الاكفاء وطبعا بتوع الكهرباء بيحضروا علشان يقبضوا المعلوم والا يقطعوا الكهرباء عن الحتة ويبوظ الفرح<br />عالم ال D.J لم يكن على ايامنا وشفتة بعد ما رجعت من الغربة وبقى ضرورة فى الافراح الشعبية ودايما بيذيع اغنية زبالة اسمها اركب الحنطور واتحنطر"
archived = "2010-01-02"
