[[comments]]
order = 1
subject = "والله ما بعرف كيف الرد"
author = "محجوب"
posted = "2006-10-20"
text = "حقا موضوع لا محل له من الاعراب<br />الا اذا كان الموضوع يلقى الضوء على حياه هذه الشريحه من الشعب المصرى فهذا جيد.<br />ولكن ان يكون الغرض كله هى الست تبقى مسحراتيه ولا لا ، ده غريب ، ولا هى المساواه دى لا تجوز الا على سيدات الاعمال والفتات المتحررات اللى تلاقى لسانهم اطول من ميت راجل.<br />وبعدين احنا عندناالمسحراتى وزوجته بتيجى تاخد فلوس قبل العيد كل سنه وبقالها على الحال ده قرون ! ايه اللى جد فى الدنيا."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061328/http://masr.20at.com:80/article.php?sid=1070"
