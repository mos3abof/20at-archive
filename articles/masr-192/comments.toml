[[comments]]
order = 8
subject = "مصر ماعملتشى حاجه"
author = "احمد المصرى"
posted = "2006-04-25"
text = "السلام عليكم ) نوال مابتحبش مصر ومش عارف مين مش فاهم حاجه المسيحى المسيحى يقول مصر دى ايه هيه عملتلى حاجه انا ولا اهلى والمسلم يقول الحكومة فى مصر بتدى حق للمسيحين اكتر من المسلمين وانا مش عايز اعيش فيهاانتم بقى بتتكلمو بجد ولا كلات داه هظار انتم حاسين بالمشكله ولا لا انتم عرفتم الى حصل ولا لا انتم عايزين تفهمم ولا لا فى ناس عيزه تفهم وناس هيزه تهيص ناس عيزة تتكلم وناس مش عيزة تسمع ناس تحب الفضايح وناس بتتصرف بعدم وعى يعنى ممكن تكون دى الحكايه بس<br />لاكن فى الاساس فى بلد اسمها مصر عايزة ولادها عايزة ناس تفهم ناس تعرف تتكلم ناس تسمع صح مش ناس عايزه هيصه وخلاص واحد مسيحى ماتت فى عمل ارهابى وبعدها بائسبع 22 مصرى ماتم فى عمل ارهابى وقابلها بثلاث شهور الف مصرى ماتم فى عبارت السلام (98)قبل كيده بائربع سنين ماتم اكثر من ثلاث الف مصرى فى حادث قطار الصعيد الم نفهم من ذلك شىء ام ستظلو هاكزا معقولها ماحنش فاهمين ان فى ناس نفسها تهز صورة البلاد امام اهلهاانتم فاهمين ولا الغباء هيسيتر على عقولنا ونقعد نعك فى كل بركه شويه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213447/http://masr.20at.com:80/article.php?sid=192&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

