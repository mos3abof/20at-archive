[[comments]]
order = 10
subject = "ههههههه مطلعوش ركاب طلعوا مخبرين"
author = "حمدي"
posted = "2006-04-25"
text = "ولا غريبه ولا حاجه بس ملعوبه<br />طيب اقولكوا حكايه حصلت بجد لي من كام سنه كده كانت نقابه المهندسين عاملين اعتصام داخل النقابه وكانوا عاملين يهتفوا من داخل النقابه بواسطة ميكرفون وفيه طبعا امن مركزي وعربيات شرطه وحكايه كبيره<br />المهم انه كان فيه قدام النقابه محطه اتوبيس فانا عملت حجة انني مستني الاتوبيس علشان اتفرج انا وصاحبي اللي معايا علي بيحصل وطبعا حوالينا ناس مستنيه الاتوبيس برده<br />ههههههه مستنيه الاتوبيس اه يا ساذج انت وهووو انت فكرتوا زينا بالضبط طلعوا كلهم مخبريين يااخوي انت وهو<br />المهم احنا بقا واخدين رحتنا في الكلام انا وصاحبي وعينك ما تشوف الا النور<br />سعادة البيه الباشا المخبر اللي جبنا قام ماسكنا من قفاي ولا مواخذه ولقيت الاخوه اللي المفروض مستنين الاتوبيس بقدرة قادر كلهم مخبرين هههههههه<br />ده كان يوم اسود بعيد عنكم -- انا كنت عايز اتفرج بس اه والله وحاولنا نقنع سعادة البيه الباشا المخبر لكن مخه كان جذمه قديمه<br />لحد ما جيه واحد كده كان واقف قريب انا كنت بحسبه مستني تاكسي لانه كان واقف بعيد شويه<br />طلع ضابط ههههههههه<br />المهم بعد شرحت للضابط ان سعادة البيه الباشا المخبر ظلمنا واحنا كنا معدين ولا لينا في الطور ولا الطحين<br />الضابط شاف بطايقنا وبعدين قلنا روح ياله يابني ذاكرلك كلمتين ينفعوك<br />قلت له يعني نمشي قال لنا اه<br />بصيت لسعادة البيه الباشا المخبرلقيته زعلان قوي<br />ومن نهارها يا حضرات وانا لا اثق باي حد واقف علي محطة اتوبيس ولا اللي راكبه<br />اساسا انا كرهت الاتوبيسات"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213447/http://masr.20at.com:80/article.php?sid=192&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

