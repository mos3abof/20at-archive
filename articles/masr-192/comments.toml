[[comments]]
order = 2
subject = "أيه الجديد فى كده ياعم براء"
author = "مناضل أنترنتى قديم"
posted = "2006-04-18"
text = "السلام عليكم ورحمة الله وبركاته<br />تعرف أن الجيش الأسرائيلى أتعلم الحكايه ديه مننا يمشى الضباط الأسرائيلين فى مظاهرات الفلسطينبن<br />لابسين لبس عرب .... أه لابسين<br />بيتكلموا عربى ...... اه بينكلموا<br />ملامحمهم عربيه ..... اه ملامحهم عربيه<br />و فى عز المظاهره ما هى شغال و أول ما يبتدى ضرب النار كله بيجرى يقوم الضابط الأسرائيلى مصطاد شاب فلسطينى فى شارع جانبى و بمعاونة ظباط اخرين معاه فى المظاهره يقبضوا عليه و على المعتقل عدل<br />بس بصراحه الصور ملهاش حل"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213447/http://masr.20at.com:80/article.php?sid=192&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

