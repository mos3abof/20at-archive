[[comments]]
order = 0
subject = "على اى اساس"
author = "فارس_fr"
posted = "2006-12-26"
text = "انت حضرتك بتتكلم على اساس ان الشعب كله عنده دش اومشترك وواخد وصله دش , او سارقها ,, يا سيدي يعنى الفضائيات هى اللى هترتقى بمستوى البلد ,, انت عندك قري وعزب ونجوع مدخلهاش لا ميه ولا كهرباء ,, يعنى كويس ان الناس تشوف الاولىوالتانية والمحليات ,,, ارحمونا ياناس الله يكرمكم واتكلموا فى حاجه مفيدة"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010126/http://masr.20at.com:80/article.php?sid=1357"

[[comments]]
order = 1
subject = "هو إنت منين يا فارس-fr"
author = "أحمد المصري"
posted = "2006-12-26"
text = "يا عم إصحى و فوق القناوات الفضائية في كل مكان. لو إنت من الصعيد أو الريف و رحت من قريب كنت سوف تعلم أن الزمن الي بتتكلم علية هو نفسه الي القناوات الحكومية عايشة فيهيعني من 50 سنة كدة"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010126/http://masr.20at.com:80/article.php?sid=1357"

[[comments]]
order = 2
subject = "فلاح ابن فلاح من الصعيد من الريف مش مهم"
author = "فارس_fr"
posted = "2006-12-26"
text = "احلفلك بالله ان لسه فيه بلاد مفيهاش كهرباء لحد وقتنا هذا !! لو انتوا عايزين تصححوا الاوضاع صح ابتدوامن بداية السلم ,, متعملوش زى نظيف وتقولوا كمبيوتر فى كل بيت والحكومة الذكية والكلام ده ,, الاول بدل ما تدوروا على الملايين اللى مصروفه على الفضائيات ,, ابتدواالسلم من بدايته"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010126/http://masr.20at.com:80/article.php?sid=1357"

[[comments]]
order = 3
subject = "فضائيات بفلوسنا"
author = "شحلوف التانى"
posted = "2006-12-26"
text = "ايوة ياسيدى بيعملوا فضائيات بفلوس الناس الغلابة علشان يوظفوا ولاد المذيعين والمذيعات والمخرجين والمخرجات الاحياء منهم والاموات<br />ليها لازمة هذة الفضائيات ---- لا<br />طيب نبنى بالفلوس اللى بتنصرف عليها مدرسة والا مستشفى<br />مين اللى قال ان احنا عايزين فضائيات للاسرة والصحة<br />علشان تحديد اعداد المسلمين فى مصر وزيادة اعداد النصارى قصدى تحديد النسل<br />سؤال برىء<br />لية معظم دكاترة تنظيم الاسرة مسيحيين ؟<br />اة يا بلد"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010126/http://masr.20at.com:80/article.php?sid=1357"

