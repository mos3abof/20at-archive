author = "عبد الجبار"
posted = "2009-05-01"
text = "فى الشرق الاوسط يوجد فقط 3 دول تصنف على انها دول وليست انظمة<br />3 دول محترمة تراعى المواطن بتاعها وتحترمة وللمواطن قدسية فيها - ونتيجة لذلك اقتصادها متقدم وانتاجها المحلى يغطى سوقها ولا تتسول مساعدات من احد<br />اولى الدول هى اسرائيل اذ لا يوجد اسرائيلى واحد فى المعتقل او سجين سياسى او سجين راى رغم انة عندهم اشد الاحزاب الدينية تطرفا فى العالم انتاج اسرائيل القومى 120 مليار دولار فى حين انتاج مصر القومى 30 مليار دولار<br />ثانى الدول المحترمة هى تركيا ويكفى اننا نستورد الحديد والاسمنت من تركيا والملابس الجاهزة المحترمة واقتصاد تركيا محترم جدا ويستعين بالتكنولوجيا الالمانية<br />الدولة الثالثة المحترمة هى لبنان فرغم الطوائف والتعدد الا انهم محترمون فى احترامهم للمواطن<br />اما باقى الشرق الاوسط فشوية انظمة زبالة عفى عنها الزمن ومصيرها مثل تشاد والصومال ودارفور"
archived = "2009-05-02"
capture_url = "https://web.archive.org/web/20090502112954/http://www.20at.com:80/t7kyk/11929-2009-04-30-15-49-14.html"
