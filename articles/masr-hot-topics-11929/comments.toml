text = "عيد عمال يعنى اية ؟<br />يا اخ دى كان زمان ايام الاشتراكية وتماثيل رخام على الترعة واوبرا فى كل قرية عربية<br />دة مش امانى ولا كلام اغانى<br />احنا بنستورد كل حاجة تقريبا من الصين لان العمال تعودوا على النوم وال[ *** ]ل وقبض المرتب اخر الشهر سواء انتج او لم ينتج وهناك عادة قبيحة ظهرت الان اسمها الاضراب - كل شوية يعملوا اضراب<br />ويعطلوا البلد - الحمد للة الصين بتورد لنا كل حاجة وبسعر رخيص خالص والحكومة مبسوطة واحنا مبسوطين خالص واخر راحة"
