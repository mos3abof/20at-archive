[[comments]]
order = 0
subject = "قصيدة( اسد فى السبعين) اهداء للشاعر الكبير امين الديب"
author = "المصرى"
posted = "2007-02-13"
text = "الشاعر الكبير امين الديب ابن قرية نكلا وهو للعلم فى السبعين من عمره تعرض للسجن والاعتقال والاهانه وكل تهمته انه يحب بلده ويكتب قصائد فى حب وطنه ولم يكتب اغانى لهيفاء ونانسى كان زمانه راكب شبح وضيف دائم فى التليفزيون<br />(قصيدة اسد فى السبعين<br />وشوبش زغرتى يا نكلا<br />عشان انجبتى عم امين<br />ما قيمتك بيه بقت مليار<br />اسد مع انه فى السبعين<br />كلامه حامى زى النار<br />ما بيخافشى ولا يهابشى<br />ولو ضربوه بألف عيار<br />سلامتك يا أبن مصر يا زين<br />وعندى رجاء لو تسمح<br />انا والدى ربى يغفر له<br />كان مصرى اصيل زييك<br />ياريت<br />اقرأ بقية التعليق .."
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216003839/http://masr.20at.com:80/article.php?sid=1581"

[[comments]]
order = 1
subject = "فعلا"
author = "نيفين نيفى نوفا"
posted = "2007-02-13"
text = "فعلا الشعر غايب حاليا<br />فكروتونى يا عشرينات بابيات نزار:<br />ان الشعر فى اعاقه سفر<br />و ابحار الى الاتى<br />و كشف ليس ينتظر<br />و كمان مقوله ابراهيم عيسى:<br />الشعر هو قبله الزمان على جبين الارض<br />و الشعلر العاظفى هو شفاه تللك القبله"
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216003839/http://masr.20at.com:80/article.php?sid=1581"
