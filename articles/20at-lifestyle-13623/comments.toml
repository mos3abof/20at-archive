text = "انا دائما بقول كلمة ( اسف ) سواء بسبب او من غير ومش عارف ليه بقول كده<br />يمكن لاني بحس اني بقول كلام غلط او معلومة مش صح<br />وساعات ببقى عاوز اولع في نفسي لما اقولها، يعني مثلا لما اطلب من البقال حاجة ويجيبلي حاجة تانية اقوله اسف انا كنت عاوز كذا ساعات بحس اني مفروض اسكت عشان ما حدش يفهمني اني عبيط ولا حاجة"
