[[comments]]
order = 0
subject = "روضه عبد الحميد"
author = "انا اخدت البرنامج دة"
posted = "2006-09-20"
text = "وللامانه بالرغم من بغضى الشديد لجمال<br />لم يحدثنا احد مطلقا فى السياسه<br />بل كان ممنوع ان نتحدث فى السياسه او الدين.<br />وللامانه مدرسينا كانوا يناقشوناعن جد ضد السياسه<br />وكان عندنا مستر كان يقعد يحكى لنا عن ايام مالسادات منع اللحمه<br />وايام الانتخابات كان بيتريق ومرحش<br />يعنى كان محدش بيكلمنا فعلا<br />وللامانه البرنامج فعلا جيد جدا<br />مع ملاحظه بغضى للحكومه<br />اللهم مهلك الظالمين بالظالمين"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
order = 1
subject = "مش عارف اقول اية ؟؟!!"
author = "واحد هينفجر من الحكومة .. لا لا من .. بس نقول اية"
posted = "2006-09-21"
text = "يعني يا نااااااااااااااااااااااااااااااااااااااااااااااااااااااااس والله حرام الي بيحصل فينا دة واحنا ساكتين كدة بس العيب مش علينا العيب علي الكلاب الي بتاكل قووت الغلابة .. الكبار الي كل واحد هياخد الي كسبة دة وربنا هيحاسبة علي كل مليم كسبة حرام في حرام ... مش حرام لما واحد عيل صغير يمشي البلد هوة و ابوة والي اكتر من كدة كمان ان ابوة بيورثو البلد دلوقتي يعني ماشاء الله هيبقي ( جمال بي محمد حسني مبارك الكبير ) حسبنا الله ونعم الوكيل .."
