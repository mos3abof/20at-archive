subject = "في ايه ياابن بهيه"
author = "في ايه ياابن بهيه اهدي ياعم شويه"
posted = "2006-09-21"
text = "هو ان يعني انا اللي منعك من ان تسقط نظام مبارك ... روح ياعم اسقطه .. انا قاعد مستنيك ياعم اهوو ... هترجع الساعه كام .... وبعدين ياعم انا مش سوسو ولا توتو...هو انا لو سوسو ولا توتو هحارب هاله سرحان ليه..ياسيدي اعتبره اضعف الايمان... اعتبره ابراء ذمه امام الله .....اهدي كده ياابن بهيه انا مش من نظام مبارك انا من الشعب المطحون .... يعني الهدف واحد حتي لو تعددت اساليب المقاومه"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

