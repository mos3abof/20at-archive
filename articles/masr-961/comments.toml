subject = "جات على الجامعه يعني ؟؟؟"
author = "إبن بهية"
posted = "2006-09-21"
text = "جيمي نازل يبرطع في البلد على كيفه .. جات على الجامعه يعني ؟؟؟<br />كويس إنه ما أخدش الجامعه كلها .. شفتوا ازاي طلع راجل طيب مش زي ما احنا عارفين عنه النتانة .. ربنا ياخده هو وأبوه في حادث قطار ولا عبارة ولا طيارة .. بس كده هيبقى مصري .. لأ بلاها .. يموت زي الخروف في الحمام قادر يا كريم ...<br />إبن بهية"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
order = 4
subject = "بنا المنتقم ..."
author = "إبن بهية"
posted = "2006-09-21"
text = "حسني مبارك ضارب وكاسر ومدشدش كل الأرقام القياسية في عدد المصايب في عهده المنيل بنيله وقطران على وشه العكر لسه معصلج برضه مع عزرائيل !!! # أستغفر الله من هذا الكلام # ... ناس بتقول عزرائيل مصهين عنه .. ناس تانيه بتقول ... ناس تالته بتقول ........ .. لولا حرام كنت أقول إنه داخل معاهم في اللعبة # أستغفر الله من هذا الكلام # ... ما هي بقت حاجه تطهق يا جدعان .. يا عزرائيل يالا بقى ريحنا ... بقالك مدة مشرفنا في مصر وكل يوم بتقبض من مصر علماء وأدباء وفنانين .. وسايب الأوغاد والكلاب المسعورة تمرح وتنهب في البلد حوالين القوادة السياسية زي ما انته راسي .. هو حسني وقع من الكشف ولا إيه ؟؟؟ # أستغفر الله من هذا الكلام # ...<br />مش مستغربين السنة دي ؟؟؟<br />فقدت بهية أسماءً وأعلاماً كثيرة وكبيرة جداً .. كل واحد منهم مدرسة في تخصصه .. بل إن بعضهم تخطى تخصصه # وراح خارج حتته # إلى تخصصات أخرى وبرع فيها لدرجة مذهلة وغير مسبوقة كالدكتور أحمد مستجير رحمه الله .. عالم النبات والزراعة ومبتكر العروض الحسابي في الشعر # بالمناسبة له موقع على النت يشرح فيه هذا العروض العجيب # .. وكيف حول الموسيقى إلى أرقام تتمايل على لحن عقريته رحمه الله ... أتكلم عن مين ولا مين .. دول كتير أوي أوي اللي راحوا منك يا بهية ...<br />بالطبع تذكرت هذا عند الحديث عن عمو فؤاد رحمه الله .. الذي كان مدرسة في حد ذاته وإن لم يعطيها الإعلام إسماً كالمدبوليزم للمرحوم عبدالمنعم مدبولي .. المهم يا سادة لا ندري متى يمكن لبهية أن تطرح عنها الطرحة السوداء والجلابية السوداء اللتين تتدثر بهما منذ عقود طوال حزنا على أبنائها الذين يتساقطون منها كل يوم أرضاً وجواً وبحراً في عهد مسيو حسني مبارك صاحب الرقم القياسي العالمي في الكوارث الطبيعية وال<br />اقرأ بقية التعليق .."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
order = 5
subject = "يا جمال.. يا حمار المستقبل"
author = "الخيار"
posted = "2006-09-21"
text = "إيه يا جميل يا جمال<br />إيه إبن الحمار<br />إية ياللي عيش في دلال<br />إيه يا إبن الحمار<br />مالك و مال الحكم يا إبني<br />خليك ربي أبوك الحمار<br />سيبني و سيب الشعب يغني<br />و يقول إمتا يموت مبارك الغني<br />الشعب جعان و المخبرات في كل مكان<br />فاهم يا عديم الفهم يا حمار<br />أنا ماشي و إنت قاعد لكل زمان<br />يا بهيم يا حمار يا إبن الحمار<br />الفول مش مدمس و الكشري مات<br />و إنت عايش على كنتاكي و لحم القات<br />يا حمار بلاش هبالة<br />بص على أبوك و إتعلم إزاي تكون زبالة<br />يا إبن الحثالة<br />يا حمار بلاش نهيق<br />البرسيم مش كتير بس الجت غالي<br />و إنت و أبوك على قمم الخوالي<br />يا حمار يا إبن الحمار<br />عايز خيار"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
order = 6
subject = "الحل هو"
author = "سعد الدين"
posted = "2006-09-21"
text = "بدل الكلام اللي لايودي ولا يجيب الحل من ده كله يتلخص في:<br />أطلق لها السيف قد جاش العدو لها*** أطلق لها السيف لا خوف ولا وجل<br />أطلق لها السيف وليشهد لها زحل *** فليس يثنيه إلا العاقل البطل<br />أسرج لها الخيل ولتطلق أعنتها*** كما تشاء ففي أعرافها الأمل<br />دع الصواعق تدوي في الدجى حمما*** حتى يبان الهدى والظلم ينخذل<br />واشرق بوجه الدياجي كلما عتمت*** مشاعلا حيث يعشى الخائر الخطل<br />واقدح زنادك وابق النار لاهبةً*** يخافها الخاسئ المستعبد النذل<br />أطلق لها السيف جرد باركـــه*** ما فاز بالحق إلا الحازم الرجل<br />واعدد لها علما في كل سارية ***وادع إلى الله أن الجرح يندمل<br />اللي عنده لسه قطرة دم عربي أو مسلم يعلن عن نفسه وإحنا نشوف طريقة نجتمع ونبحث وسائل فعالة لرد الصاع صاعين للعملاء الخونة وللنظام الداعر.<br />ياريت لو إبن بهية يكون همزة وصل للي راغب حقيقة في عمل شئ يغير الواقع المهين. الذوق واللين لايجدي مع الخونة الكفرة. مستني الرد منكم."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
order = 7
subject = "مش فاهمه"
author = "زنوبه"
posted = "2006-09-21"
text = "آنا عندى سؤال ـ إذا كانت جمعية جيل المستقبل هدفها هو تآهيل شباب الخريجين لمعترك الحياة وتعليمهم ... إلخ<br />آمال الشباب آصلا بيدخلوا الجامعه ليه؟ آنا مش عارفة آوضح وجهة نظرى، هآحاول بسؤال تانى، آمال الشباب بيعملو إيه فى الجامعه وبيتعلموا إيه؟؟!!! هل معنى ذلك آن الحكومه تعترف بإن التعليم الجامعى به قصور وسلبيات فيبدؤا بتعويض ذلك القصور بجمعيات مثل جيل المستقبل. المفروض آن يتخرج الشاب مؤهلا تماما للنزول الى الحياة العمليه ؟!! واللا آنا غلطانه؟<br />آتذكر فى سلسلة مقالات للكاتب آنيس منصور ذكر إن الجامعات المصرية لا تندرج فى ضمن آفضل 500 جامعة على مستوى العالم!! يا نهار آسود!!!<br />معلهش آصل آنا من جيل قديم شويه وما دخلتش جامعات مصريه؟!! ياريت لو حد يتكرم ويفهمنى؟!"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
order = 8
subject = "لا ادرجوها يا زنوبه..و رجاء لعشرينات"
author = "نيفين نيفى نوفا"
posted = "2006-09-21"
text = "يصحيح ليكلا يا زنوبه<br />ادرجو جامعه القاهره بس مش علشان هى كويسه طبعا لكن ال ايه علشان تخرج منها تلاته من اللى اخدو جايزه نوبل<br />بالنسبه بقى لتعليق ليفى انا مش عارفه ايه الحكمه يا عشرينات ان ميبقاش فيه رقابه على الموقع<br />انا عارفه انكم فبل كدا حذفتو تعليق ليه و شكرتكم فارجوكم حد بحذف التعليق السابق<br />ما هو يا احنا يا الشخص دا على الموقع"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

