[[comments]]
order = 25
subject = "الى زنوبه و معاذ"
author = "نيفين نيفى نوفا"
posted = "2006-09-24"
text = "عندك حق يا زنوبه بس انا قلت حل كويس اوى و حتى عجب مصرى و قاللى كدا صح و هو اننا نهمله خالص و منلردش عليه<br />زنوبه انا كنت بعتللك تهنئه ف موضوه استاذ تاريخ نحن المساكين و بقولها تانى<br />كل سنه و انتى طيبه<br />و بالنسبه لمعاذ خلى عندك شويه امل و لو ان مفيش حاجه مبشره ف اللى بيحصل ف البلد من حوالينا<br />و بالمناسبه دى حته من صلاح عبد الصبور<br />اه ليس هو الليل<br />بل العمر القادم<br />اه ليس هو الليل<br />بل الرعب المتجدد<br />ليس هو الليل<br />بلالقدر<br />و سقوط الحاضر فى المستقبل<br />اه ليس هو الليل<br />بل الجرح اليومى<br />ينزف دم اسود فى الصبح المقبل"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"
