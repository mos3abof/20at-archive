[[comments]]
order = 22
subject = "إلى وليد حجاب"
author = "مواطن رزل"
posted = "2006-09-22"
text = "معنديش استعداد أسمع كلام عن همبكة التنمية البشرية وما إلى ذلك من هراتيل .. فأي جاهل يستطيع أن يتكلم في تلك الأمور ويدرسها أيضاً ، والمترجمات الركيكة في هذا المجال \"مرطرطة\" ومكتوبة ومترجمة بفهلوة أمريكية منقطعة النظير ، ومنبتة عن واقع \"سوء\" العمل في مصر..<br />الكلام واضح ، وبعيداً عن إنكار علاقة البرنامج بالسياسة (والذي قد يذهب البعض فيه إلى الحلفان بالطلاق) ، هل التدريب وإعداد الأجيال هي مسئولية الدولة أم هي مسئولية الأحزاب؟<br />لابد أن تكون مسئولية الدولة ، وإلا فإننا نضع كل الجياد أمام العربة..<br />درست الخصخصة ، وأعلم مما درست أن دور الدولة ينتقل في ظلها إلى الرقابة وإلى أداء الخدمات ذات البعد الاجتماعي والقومي ، والتدريب من وجهة نظري الاستجماتيزمية المتواضعة هو أحد هذه الخدمات ذات البعد القومي ، ومع ذلك يتم تسليمها بسهولة للمجتمع المدني وتسييسها ، وضع شاذ ومقلوب وسمج ، تماماً مثل \"الشحاتة\" من المجتمع الأهلي لبناء مستشفى رغم أن مستشفى يقدم خدمات مجانية هو من صميم اختصاصات الحكومة.."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
order = 23
subject = "كل عام وانتوا......الخ الخ الخ"
author = "معاذ محمود عامر"
posted = "2006-09-23"
text = "كل حاجة في الزمن الردئ اللي احنا عايشينه ده<br />مبقاش ليها طعم<br />حتى رمضان اللي كان مقدمه أهم مناسبة عندنا<br />مبقاش ليه طعم<br />هو يمكن عندنتا اكتئاب جماعي في مصر<br />أو يمكن كل اما بكبر بيقل احساسي بالمناسبات الجميلة اللي زي كده<br />متهيألي حتى المباركة لبعض بقت روتينية ومملة<br />عشان كده هباركلكوا بتصريف من عندي<br />((((((((كل عااام وكلكم بخير, وصحة, وعافية, وحرية, والتزام, ورغبة في الحياة والتقدم للأمام, كل عام وانتوا بتضحكوا, وبتطربوا, وبتعبدوا ربنا الواحد باخلاص وحب, كل عام وانتوا مطمئنين, وآمنين, وفي راحة نفسية عايشين, كل عام وانتوا.......<br />بني ادمين)))))))))))))))"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

