[[comments]]
order = 10
subject = "المجاري طفحت تانى"
author = "زنوبه"
posted = "2006-09-21"
text = "شكرا يا نوفا على التوضيح<br />آما بقى بخصوص الواد ليفى بواسير(المجارى إبتدات تطفح تانى) ـ آحب آوضخ لك إن ده واد عنده هوس جنسى فى عقله بدليل إنه لا يستخدم الا التعبيرات الجنسيه فى تعليقاته , و الهوس الجنسى ده بيبقى راجع لكبت آو لعقده نفسيه معينه منذ الصغر ورفض دائم من الجنس الاخر ليه ـ بدليل إنه قال قبل كده إن كل البنات فى تل العقارب اللى جاى منه بيموتوا فيه، ده دليل إن ما فيش واحده بتعبر آهله آصلا و هو غالبا عيل آقل من عشرين سنه لآن واضح من كتاباته إن ثقافته صفرررررر ، ماتلقيهوش آبدا بيرد آو بيعلق بآى رد موضوعى ، مجرد هلاوس جنسيه لشخص مريض بدليل إنه ما بيشتمش إلا النساء<br />آما المكان اللى درست فى وإتخرجت منه ، بالتآكيد واحد زيك يا واد يا بواسير ما يجرؤش آصلا يمسح فيه البلاط!!!<br />الحل يا نوفا إن الواد ده يآخد بالجزمه كل ما يفكر يتطاول على آسياده المصريين وخاصة النساء منهم لغاية ما إدارة الموقع تفلتر الردود وياريت يحطوا كاونتر يوضح بلاد زوار الموقع علشان نتآكد الواد ده محدوف من آنى ماسورة مجارى"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
order = 11
subject = "لا هالة سرحان ولا مركز .. خلينا في المهم يا ذوق ق ق"
author = "إبن بهية"
posted = "2006-09-21"
text = "آسف يا كابتن يا بتاع هالة سرحان .. هي مين هالة سرحان أصلاً عشان نعرف نحكم عليها .. المهم إننا مش فاضيين دلوقتي من مبارك وعيلة مبارك وعصابات مبارك .. خلينا في المهم يا سوسو .. وأنا لا أرى اليوم أهم من زوال نظام مبارك من مصر بالكامل .. يعني ثورة شاملة تطيح بالقوادة السياسية كلها ويتم تشكيل لجنة لوضع دستور صحيح لمصر .. لجنة وطنية بجد مش من بتوع دستور يا سيادنا بتاعة المرحوم ساداتوه بتاع الصهاينة وخليفته القذر مبارك .. عايزين لجنة بجد الجد ويتم عرض الدستور على الشعب للموافقة عليه أو رفضه أو تعديله في استفتاء حر من غير تزوير .. ويتم إطلاق حرية تشكيل الأحزاب بدون تدخل من القواد الأكبر في الشرق الأوسط .. عارفينه .. اللي ما عندوش أي ريحة من الشرف ... ويعلن عن موعد لإنتخابات نيابية حقيقية بدون بلطجية .. واللي يفوز يشكل حكومة بجد وحق وحقيق مش سمك لبن تمر هندي بتاع حسني مبارك الواطي<br />كل الحاجات دي هي المهمة دلوقت مش تقولي هالة سرحان ومركز ...<br />إبن بهية<br />http://ibnbahya.blogspot.com"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
order = 12
subject = "إلى الأخ بتاع هالة"
author = "إبن بهية"
posted = "2006-09-21"
text = "على فكره أنا مش مع ولا ضد أي هالة في الدنيا .. بس بعد ما نخلص من هالة الفقر والغلب والنكد الأبدي المعشش في بر مصر .. وأنا في الأساس الأساسي خالص ضد قنوات روتانا كلها ... لأنها تدخل ضمن المخطط الغربي لبهدلة مجتمعاتنا وتدميرها وتخريبها .. هي وإسهال الفيديو كلب إبن الكلب اللي شغال ليل نهار أغاني بورنو عريانة .. طبعا هييجي حتة هلفوت متفلسف ويقولك .. تاني نظرية المؤامرة .. راح أقوله البعيد إنه جاهل جهل أزلي ... لأنه لو بقرأ أو بيطالع ما يتم تفصيله لنا لكي نرتديه غصب عننا كان فهم ..<br />لو بص شوية في اللي بيحصل كان البعيد فهم .. لو عرف ازاي دلت عندنا البلاوي اياها من سنين ومين دخلها كان البعيد فهم ... لو قرأ كام صفحة بس .. والله كام صفحة من مذكرات تيودور هرتزل أبو الحركة الصهيونية كان فهم وعرف قصدي<br />لكن تقول لمين .. ربنا يشفي ولادنا الأول ويفهموا وبعدها يفهم أعدائنا ..<br />يا رب يا هادي .. اهدي أولادنا ودمر عائلة مبارك وعصاباته بقدرتك وجبروتك ..<br />إبن بهية<br />http://ibnbahya.blogspot.com"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
order = 13
subject = "للحيوان اللي قبلي"
author = "ليفي معاذيير"
