[[comments]]
order = 16
subject = "أمريكا عايزاه وحتدعمه"
author = "عاشق الزنوبة والنفين نوفا"
posted = "2006-09-22"
text = "العوض على الله يا إكسلانسات جمالات بنت حسنية المنوفية بقت والي مصر الجديد مفيش كلام. لإمتى وقد إيه الله أعلم..ربع قرن جاي..أكثر؟ أقل؟ ده مربوط بإرادة الشعب على التغير بالقوة..وهنا أقصد أي شكل متاح للقوة..مش شرط قنابل ورصاص وبارود.<br />مسلسلات التوريث مش جديدة على السياسة الأمريكية..قبل كده ظهرت في تايوان وخلو إبن تشاي شيك برضة يبقى رئيس ومتخب بإسم الديمقراطية...المهم لأمريكا وجود عملاء ليها على رأس النظام مطالبهم قليلة وخدمتهم ليها أقصى ما يمكن...وحكام العرب مش طالبين غير الكرسي ونهب البلاد الداخلي..يبقى تدعمهم أمريكا."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
order = 17
subject = "الرئيس الفنزويلي يهاجم سياسات بوش ويصفه بالسكير"
author = "وكالات"
posted = "2006-09-22"
text = "هاجم الرئيس الفنزويلي مجددا نظيره الأميركي، واصفا إياه \"بالمدمن على الكحول والمريض\" وذلك خلال زيارة إلى كنيسة هارلم بنيويورك.<br />وقال هوغو شافيز إن \"بوش مريض ويعاني من عقد عديدة\" مضيفا أنه \"يمشي مثل جون واين\" الممثل الأميركي الشهير الذي غالبا ما تقمص أدوار رعاة البقر بالأفلام الأميركية.<br />كما نعت الرئيس الفنزويلي بوش بأنه \"لا يفقه شيئا في السياسة\" وأنه \"وصل إلى منصبه بفضل أبيه\" الرئيس الأميركي الأسبق.<br />وقد زار شافيز حي هارلم حيث أعلن توسيع برنامج مساعداته المتمثل في بيع النفط بأسعار مخفضة لعائلات في نيويورك.<br />وكان الرئيس الفنزويلي وصف نظيره الأميركي الأربعاء الماضي من على منصة الأمم المتحدة بأنه \"شيطان وطاغية\".<br />وقد رفض البيت الأبيض الرد على تصريحات شافيز, وقال إنها لا تستحق التعليق.<br />من جهته ركز المندوب الأميركي بالأمم المتحدة جون بولتون هجومه المضاد على شافيز، باتهامه بـ \"الديكتاتورية\" وفرض قيود مشددة على عمل وسائل الإعلام."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
order = 18
subject = "والله راجل وجدع يا شافيز"
author = "والله راجل وجدع يا شافيز تعاله يا خويا شوف الأملة بتاعتنا إحنا نبوس القدم ونمسح عتبات البيت الأسود بلسانتنا...تفوه على زعماء العرب الجرب وأولهم حيوان المنوفية الواطي وهادم الحرمين وعيال الحرام في الخليج وأولهم الكويت."
posted = "2006-09-22"
text = "\"أعلن توسيع برنامج مساعداته المتمثل في بيع النفط بأسعار مخفضة لعائلات في نيويورك.\" لأ زعمائنا بيدوه مجانا لأمريكا علشان تدمرنا بيه...وفي مصر لإسرائيل علشان يبيدوا الفلسطينين واللبنانين اللي مش عقلاء زي بقرة المنوفية الضحوك. يارب اليك المشتكى .."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

