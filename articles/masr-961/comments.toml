[[comments]]
order = 20
subject = "يسقط يسقط يسقط يسقط يسقط يسقط"
author = "معاذ ....مقهور.... عامر"
posted = "2006-09-22"
text = "عادي جدا ....التوريث هيمر ببساطة زي ماكل حاجة في مصر بتخلص بسرعة<br />كل اللي احنا بنتمناه مش هيحصل ...<br />عارفين ليه عشان للأسف مش هنقدر نعمل حاجة................<br />مفيش أمل لان القوى المدنية كلها اما عميلة واما براجماتية واما بلا تواجد جماهيري,<br />يعني م الآخر جمال حبيبنا هيورث هيورث,<br />وملهاش حل غير الثورة,<br />يعني الفوضى والدمار والنفق المظلم الذي بلا نهاية معروفة,<br />ولكن كله هبوط وانحدار فمش هتفرق كتير,<br />الله يرحمه الأستاذ أمل دنقل:<br />(أيها السادة لم يبق اختيار<br />سقط المهر من الاعياء<br />وانحلت سيور العربة<br />ضاقت الدائرة السوداء<br />حول الرقبة<br />وفي الظهر الجدار)<br />يسقط مبارك<br />يسقط الفساد<br />يسقط القهر والقمع<br />يسقط الجبن والاستسلام والرضا بالامر الواقع<br />يسقط كل ما هو قائم<br />(لأن كل الأشياء لابد أن تسقط وتنهار<br />حتى يحدث أي تغيير)"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

