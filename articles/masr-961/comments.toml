[[comments]]
order = 2
subject = "إذا سمح لي الزميل .."
author = "وليد حجاب"
posted = "2006-09-21"
text = "ليس حقيقياً أن جمعية جيل المستقبل التي تعمل في مجال تأهيل الخريجين من شباب مصر تدعو للحزب الوطني أو حتى لمؤسسها ( جمال مبارك ) بصفة شخصية .. وبالمناسبة أنا ممن تلقوا التدريب في هذه الجمعية وعلى يد مدرسيها ومعلميها الشباب ولم نتطرق أبداً للسياسة من قريب أو من بعيد .. ورداً على جزئية (وإذا كانت الجامعة لم تنجح في تأهيل طلابها خلال سنوات الدراسة والتي تتراوح من 4 – 6 سنوات حسب التخصص فهل يتم ذلك في دورة مدتها 3 شهور ؟! ، وتعلق د. معتزة خاطر أستاذ الكيمياء التحليلية على ذلك بأن لوائح كل الكليات تنص على تدريس اللغة الإنجليزية والحاسب الآلي فضلاً عن نشاط المركز العلمي للحاسبات والذي تلقيت فيه تدريبي على علوم الحاسب منذ 25 سنة عندما كان يعمل بلغة البيزيك والفورتران !!) .. بمنتهى الصراحة وللأسف الجامعات المصرية غير قادرة على تأهيل الشباب للخوض في معترك الحياة العامة والعملية وسوق العمل .. بتخريجها شباب يحمل مجرد شهادات أكاديمية بدون أي مهارات شخصية أو مكتسبة .. و أسال الزميل كاتب المقال إن كان خريج جامعة مصرية ( متى تلقيت أي محاضرات في الإدارة الذاتية أو تدريب على مهارات العرض ومهارات الاتصال وإدارة الوقت مثلاً .. هل علمك أحد من \" دكاترة الكلية \" كيف تعد سيرة ذاتية ناجحة ؟؟؟!! وهي بالأمر المهم لكي تبدأ البحث عن عمل بعد التخرج .. ؟؟) وهل لي أن أسأل زميلي مرة أخرى ماالفرق بين خريج الجامعة المصرية وخريج الجامعة الأمريكية ؟؟؟ هو تماماً ذلك الفرق بين ما يحصل عليه طالب الجامعة الأمريكية من مهارات وتدريب لا يحصل عليهما طالب الجامعة المصرية تجعل الأول متفوقاً في فرصته للحصول على فرصة عمل على الرغم من قوة المادة الإكاديمية للثاني .. أما تلك المواد التي تقررها الكليات في اللغة والحاسب مجرد مق<br />اقرأ بقية التعليق .."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060908/http://masr.20at.com:80/article.php?sid=961"

[[comments]]
