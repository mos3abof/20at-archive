[[comments]]
order = 0
subject = "ده مش عبيط ده بيستهبل"
author = "مصرى"
posted = "2006-04-29"
text = "الرئيس حسنى مبارك منذ أن أتى للحكم وهو لا يعرف إلا هدفين له الأولى الإستيلاء على كل ثروات البلد من أجل إزلال شعبها والتحكم فيه وتحويلة لعبيد عنده بديكتاتوريته وطغيانة والثانية هى توريث الحكم لإبنه المفتقد لأى خبرات الذى تربى وسط القصور ولا يعرف عن حياة المصريين شيء فهو يعيش فى عز من مص دماء المصريين ولكن وفجأة وجد شيء لم يعمل له حساب قضاء يفضحة على تزويرة للإنتخابات ويقف ويقول لا فأصبح مصدر قلق بالنسبة لعملية التوريث التى لن ينالها إلا على حثث المصريين جميعاً فهو يغير الدستور عملياً ذلك الدستور الذى لا يعطية الحق فى الحكم لإنه لم يأتى للحكم بالإنتخاب ولكنه يحكم مصر وإيضاً الذى يمنع التورث لأن مصر ليست ملكية ولكن يغير الدستور عملياً ويحاول توريث إبنه الحكم فهو لا يغير نص الدستور ولكنه يغيره تنفيذاً وإستهبالاً وهو الذى عاقب الدكتور أيمن نور على التزوير ولم يسمح للقانون بعقابة على تزوير الإنتخابات وقهر المصريين فهو بالعربى كده دستور تفصيل إكس إكس لارج حسب المقاس يعنى"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120125/http://masr.20at.com:80/article.php?sid=242"

[[comments]]
order = 1
subject = "أباطرة الصحافة وسدنة النظم"
author = "نقله لكم اخوكم اللهو الخفي"
posted = "2006-04-29"
text = "سقوط النجوم علامة من علامات الساعة (والنجم إذا هوى)، عندما يتهم البريء صاحب الدعوة بالضلال والغواية، أما في حالة بعض أباطرة الصحافة في الوطن العربي فإنهم قد ضلوا الطريق، وأغووا الناس، وزينوا لبعض النظم أعمالها، وقلبوا الحق باطلاً والباطل حقاً. يظل إمبراطور الصحافة على مدى عقود من الزمان نموذجاً للوطنية، ثم يتحول في غمضة عين إلى نموذج للفساد. ويسقط من أعلى رأس المجد إلى حضيضه، ومن دخول مبنى المؤسسة، دخول النجوم، إلى دخول دور المحاكم والقضاء كالمتهمين والمجرمين للتحقيق، ومن ترأس مجلس الإدارة في الهيئة، في أعلى السلم الوظيفي، إلى قفص الاتهام محاطاً بالحراس في الطابق الأرضي لقصور العدالة.<br />ومنهم من يقفز من القطار قبل أن يصطدم، وتقع الواقعة. ويدعي الوطنية وينضم إلى صفوف المعارضة، وينقد النظم والحزب الحاكم بعد أن استفاد عدة عقود من الزمان. فيترجَّل، ويستعد للقادم. ومنهم من ينتظر إلى سِن المعاش بعد أن يكون قد استنفد آخر قطرة، ثم يتحول إلى معارض داخل الصحف القومية أو داخل صحافة المعارضة بالمقالات الملتهبة، وبالمقابلات الصحفية الرنانة. فقد تحول بقدرة قادر من \"الجاهلية\" إلى الإسلام. ومنهم من يقوم بذلك وهو مازال تحت السلاح، في سن الخدمة ليضمن مستقبلاً يبنيه في المرحلة القادمة بعد أن أوشكت هذه المرحلة من مسيرته على الانتهاء. يترك الحزب الحاكم، ويتنازل عن مكاسبه العاجلة في السلطة والثروة، انتظاراً لمكاسب آجلة في المرحلة البديلة، والثروة مستمرة. يموت الأنبياء والملوك، ويستمر الكهان والأحبار والسدنة! أما بعض رجال الاقتصاد والمال فإنهم يهربون خارج البلاد بعد تهريب أموالهم وبيع شركاتهم وانتظار عقد الصفقة مع النظم للعودة مع تنازل عن جزء من رأس المال للوسطاء ومبعوثي النظم. ومنهم من يزاح في صم<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120125/http://masr.20at.com:80/article.php?sid=242"

