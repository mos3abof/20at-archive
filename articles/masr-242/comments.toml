[[comments]]
order = 4
subject = "طرطور العصابة"
author = "إبن بهية"
posted = "2006-04-30"
text = "المشكلة مش في مبارك وحكمته التي يضحكون عليه بها فخلال ربع قرن لم نر على هذه الحكمة أي دليل .. المهم المشكلة أن البلد أمست محكومة بعصابة لابسة طرطور اسمه حسني .. يعني عاملين أراجوزات علينا وبيمصوا في دمنا ليل نهار .. لازم النظام كله يغور في ستين داهية .. طيب ازاي ؟؟؟ والله ما انا عارف .. لكن الواضح والجلي أن هناك ثورة شعبية عارمة وحارقة تدق أكفها على أبواب مصر .. ثورة الجياع والغلابة وهما طبعا كل البلد باستثناء شوية أفراد العصابة الكبيرة .. صاحبنا أبو حكمة كبيرة انكشف أمره وظهر على حقيقته وباين إنه ما يعرفش العمى .. وتخيل بلد بالحال ده هيكون مصيرها إيه ؟؟؟"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120125/http://masr.20at.com:80/article.php?sid=242"

