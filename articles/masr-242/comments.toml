[[comments]]
order = 8
subject = "ثمار حكمة مبارك"
author = "ياسر"
posted = "2006-05-28"
text = "من الاجحاف أن ننكر ثمارحكمة الرئيس مبارك<br />فعلى مدى خمس وعشرين عاما مع الشغل والنفاذ استطاعت هذه الحكمة أن تصل بنا<br />لبر الأمن ولكنه الأمن المركزى كما حققت لنا أعلى معدلات الفساد والانهيار فلنا باع طويل مع الصفر فى كل المجالات الا أننا<br />وللحق نحتل صدارة الدول الراعية للفساد<br />فاذا اردت ان تصبح رجل اعمال أو صاحب منصب رفيع فما عليك الا ان تلتحق بأمانة<br />السياسات بالحزب الواطى . ولاننكر حكمة السيد الزعيم فى حفاظه على الشرفاء فى البلد فقد أودعهم السجون والمعتقلات بعيدا عن الفساد والمفسدين لنكتشف بعد ذلك حقيقة غائبة وهى ان كل من هم خارج<br />القضبان هم المسجونين الحقيقيين تحت نير<br />الاحتلال المباركى .وباسم كل شاب عاطل<br />ابعث برسالة شكر للقائد المفدى حيث انه<br />لايريد لشبابه التعب فأعفاهم من كل فرص<br />العمل وأختم كلامى بهذا التصور لحديث دار<br />بين القائد الملهم وأحد منافقيه عندما<br />ساله الاخير ايهماافضل حكمى ام حكم عمر بن<br />الخطاب فاجابه المنافق بكل بلاهة حكمك<br />طبعا ياريس اصل عمر كان بيخاف من ربنا<br />انما انت ما بتعملش حساب لحد خالص ."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120125/http://masr.20at.com:80/article.php?sid=242"

