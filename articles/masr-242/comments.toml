text = "دى بقى خريطة مصر الجديده بجهزها للبيع علشان نرزق منها احسن انا شايف ان سرقتها مش كفايه احنا نبيع الجمل بم حمل احسن هيجيب فلوس اكتر ايه رايك انا مجهزلك حته حلوه اسمها شبرا الخيمه عيال رجاله ممكن تستخدمهم لمحاربة العالم زى جنود مرتزقه كده وفيه برضه حتت حلوه كتير والسماسره شغالين فى كل حته"
