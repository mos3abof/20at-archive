text = "مقال حلو<br />و خطوة معقولة من مايكروسوفت بس مهما كان لن تستطيع منافسة عملاق البحث جوجل<br />هي فقط محاولات لتقديم محرك بحث بمميزات اخري او التقديم في شكل اخر<br />محرك البحث هو فقط بحث بطريقة ذكية و سريعة اما باقي المميزات فهي تتعلق بالموقع او الخدمة و ليست مرتبطة بشيء اخر<br />و سرعة الارشفة في جوجل و نتائج البحث المتجددة المصنفة حسب معايير معينة متجددة و صعبة كل ذلك في رصيد جوجل<br />و مازالت مايكروسوفت تحااااااااااااا ااول ..<br />بس لو كتابة رابط الموقع صح لو امكن"
