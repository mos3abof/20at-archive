order = 0
subject = "لابديل"
author = "أبو أسامة"
posted = "2006-06-06"
text = "يجب ان تكون نهاية هذا المشروع نهاية مشرفة والا ستكون معها نهاية الأمل فى تغيير شىْء ماقد املناه فى وقفة القضاة الشرفأالى جانب هذا الوطن المباع والممزق<br />والتى نامل ان تكون النهاية لصالحه اما<br />بتنفيذ المشروع كما هو دون نقصان ودون تراجع القضاة عن اى شىء فيه امام ترزية النظام واما ان يكون هناك بديل للضغط<br />عليهم عن طريق الدعوة لأستفتأ شعبى على<br />استقلال القضأ. أذ انه لابديل عن هذا المشروع لكى نخرج من هذه الظلمة الحالكة<br />والمهينة لشعب بتاريخه الطويل لم يحظى فيها بنعمة الديموقراطيةوالتى ارجوا ان<br />تكون على ايدى القضاة الشرفأ.<br />وما اقصده هنا هومشروع القضاةلسنة1991<br />نعم.............لأستقلال القضأ<br />نعم.............للقضاة الشرفأ"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907035203/http://masr.20at.com:80/article.php?sid=467&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "انتو الامل للغلابة المستعبدين"
author = "هانيبال"
posted = "2006-06-06"
text = "قضاة مصر هما الامل الاخير لاصحاب البلد اللي صارو عبيد بتخطيط منوفي كلب فلاح احقر من جزمة قديمة .. وزي ما خاف محمد على قبل كده من تجنيد المصريين عشان يفضلومايعرفوش يعني ايه سلاح يدافعو بيه عن نفسهم برضه المنوفي قضى على كل المواهب والمبدعين اللي ممكن يشيلو عبء القيادة جيل من ورا جيل وقدر بخبث الفلاحين المشهورين انه يسجن ويسحل كل بني ادم عنده شوية كرامة او احساس بالذات ومع ذلك يمكرون ويمكر الله والله خير الماكرين .. ربنا رزقنا احنا الغلابة بالجماعة القضاة دول وهما دول اللي باقيين من مصر .. مصر اللي ابدعت اعظم حضارة في تاريخ الكون ييجي عليها زمان تيقى في ديل الامم وزبالة الحضارة ببركة الفلاحين طبعا .. القضاة فعلا هما الامل الاخير هما اللي لو قدر عليهم الجربوع النتن ده يبقى مصر هاتفضل كده حتى اشعار اخر .. والاشعار الاخر ده معناه في حياة الشعوب يعني عشرات او مئات السنين والله اعلم .. والنبي يا سيادة المستشار زكريا عبدالعزيز بلاش تقعد مع اي حد ليه علاقة بالحكومة او بالعصابة دي .. ارجوك انت وزمايلك بلاش تتخلو عن 70 مليون بني ادم كلهم تعابنين والهم بيحصدهم واحد ورا التاني .. ربنا معاكم ربنا معاكم ربنا معاكم قادر وكريم"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907035203/http://masr.20at.com:80/article.php?sid=467&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "الى هــانــيــبال هـــذا الزمــن"
author = "لو سمحت بلاش تغلط فى الفلاحين"
posted = "2006-06-07"
text = "لان بيتهيألى ان لوجذورك مصريه صميمه حيكون داخل فيها جزء فلاحى كبير<br />يا ريت نتعلم نتخلص من العنصريه الكاذبه اللى بدون سند دى<br />ولعلمك<br />مش كل فلاح من نفس عينه الفرعون الاله<br />التوقيع<br />فــلاح خــرســيــس أدبــسـيس<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأأه يــــأ بــــلــــدى"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907035203/http://masr.20at.com:80/article.php?sid=467&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
