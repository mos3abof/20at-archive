author = "ابو موسى"
posted = "2008-03-23"
text = "فترة الخطوبة مش سهلة زي ما انتوا فاكرين بالع[ *** ] دي صعبة جدا وعدم الاطالة فيها مرغوب فيه جدا لان كل طرف بيحاول يظهر مميزاته بس ويتجمل اكثر من اللازم وبعد الزواج تاتي المشكلة وهي يبان عيوب كل واحد وتختفي كل المميزات والتجملات وبتالي يبدا الملل في الحياة الزوجية وايضا فترة الخطوبة بتجعل وخصوصا الشاب بالضغط على الطرف الاخر ومبادلته الحب باي طيفة كانت وهذا ع[ *** ] كل المبادئ والله يصبر كل الشباب والبنات في ظل الظروف الصعبة التي يمرون بها والله الوفق… اللهم انصر شبابنا وقوي ايمانهم ولابد من معرفة الشباب والبنات الثقافة الجنسية الصحيحة وعدم السماح لاي شخص بالعبس فيها لان هي ملك لهم فقط…"
archived = "2009-05-03"
capture_url = "https://web.archive.org/web/20090503094329/http://www.20at.com:80/7ayatna/3334.html"

