text = "اخي اللي بيسال يعمل ايه مع خطيبته لازم تحاول تتصرف معاها بحكمه وتوقفها عند حدها يعني مش تتكلم معاها باللين وخلاص لا لازم تزعل منها ولو زعلت منك اصبر لغايه ما ربنا يهديها حتي لو بتحبها لازم تحسسها بالزعل زي مابتحس بالحب منك بس لاتكون فظ معاها وما تدخلشي حد بينكوا ولو ما استجابت بالشده او اللين يؤسفني اقول ان اختيارك كان غلط من الاول ولازم تسيبها احسن ماتندم بعدين واتمني لكم السعاده والهدايه"
archived = "2009-05-03"
capture_url = "https://web.archive.org/web/20090503094329/http://www.20at.com:80/7ayatna/3334.html"

