text = "أنا مخطوبه وعندي 23سنه مخطوبه من سنتين بس خطيبي لسه بيدرس وانا متخرجه بس انا بحس بملل فظيع والمزعلني انه مش مقدر اني زهقت ونفسي ينجح علشان يتخرج ونجوز بس هو ماش براحته أوي في الجامعه ولساله سنتين كمان بس أنا حاسه بملل فظيع بس مستحمل علشان بحبه بس هو مش مقدر ده وانا مش عارفه اتصرف معا"
