text = "السلام عليكم .. جوري _ مخطوبه _17 عام _ بصراحه فترة الخوبه مررررررررره رووووووووووعه \"فيها حركااات صعبه يعني أشتياق وأخواتها\"بس المشكله مثل ماقال الأخ \"عمر الحامدي\" نظره مره وحده وبعدين خلالالاص طبق للعادات والتقاليد\"يحلموا على قولتهم\" بعد الزواج بكيفهم , وإللي أصعب من كذا إذا طولت فترة الخطوبه من جد أحساس غيييير ما أقول الأ الله يعجل مابه خير."
