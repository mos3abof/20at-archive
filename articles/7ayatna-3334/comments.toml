text = "خطيبتى بتعمل حاجات كتير غلط وشايفه انها عادى لكن الحاجات دى بتزعلنى منها وكذا مره قولتلها حاولى تغيرى من نفسك ومافيش فايده لان الافعال دى بقت طباع بالنسبه لها يعنى مره ركبت مع واحد من عندنا من المنطقه يوصلها للكلية وكان الموضوع عادى بالنسبه لها وهى كمان اللى قالتلى ومره تانيه رقصت فى فرح واحده صاحبتها ادامى وبتعلى صوتها على والدتى . ارجوكوا انصحونى اعمل ايه"
