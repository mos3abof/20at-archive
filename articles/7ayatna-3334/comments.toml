posted = "2007-03-09"
text = "عاداتنا وتقاليدنا تمنع هالشي ماادري ليش اعتقد انه الجهل، مع انه الخطوبة لها ميزات انها طريقة للتعرف على الطرف الثاني، المصيبة اذا وقع الخطأ ان صلح للها استمروا وتزوجوا اما ان كان لا هذي هي المشكلة، عن نفسي خطبتي مامرت عليها 3 شهور واكتشفت مساوئ بزوجي مع انه فيه ميزات، ميزاته غطت على مساؤه الا انه فيه سيئتين اثرت بنظرتي له ، اول شي انه ضعيف شخصية والشي الثاني كذاب بشكل رهيب ومستعد يحلف، خلاني هالشي افكر الف مرة قبل لااتزوج وشكلي راح انفصل عنه"
archived = "2009-05-03"
capture_url = "https://web.archive.org/web/20090503094329/http://www.20at.com:80/7ayatna/3334.html"

