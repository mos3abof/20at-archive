author = "اهمال فى اهمال"
posted = "2010-01-03"
text = "مين اللى ساب المغارة دى مفتوحة - مش الشركة اللى بنت الكوبرى وتركتها بدون باب ولا اغلاق ومفيش احد من المسئولين ولا المهندسين بيمر ويشوف دى مفتوحة لية<br />اى حتة مهجورة زى دى لازم تأوى الحرامية والمجرمين والمطاريد وتستخدم فى الشم والاغتصاب وتصبح وكر لكل الموبقات<br />مسئولية الحكومة اولا واخيرا<br />دى اذا كان عندنا حكومة"
archived = "2010-01-22"
capture_url = "https://web.archive.org/web/20100122094032/http://www.20at.com:80/masr/hot-topics/14725-2010-01-03-14-04-19.html"

