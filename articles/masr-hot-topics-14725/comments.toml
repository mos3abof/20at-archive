posted = "2010-01-03"
text = "هي وزارة الداخلية لسه فاكره ان فيه مغاره اسمها اغتصاب البنات<br />طيب ما هي موجوده من زمان اوي والغرز موجوده من زمان اوي<br />ايه اللي خلا الشرطة تفتكر يعني دلوقتي<br />موجوده من زمان واصحاب الغرز بيدفعوا كويس علشان الشرطة تسيبهم"
archived = "2010-01-22"
capture_url = "https://web.archive.org/web/20100122094032/http://www.20at.com:80/masr/hot-topics/14725-2010-01-03-14-04-19.html"

