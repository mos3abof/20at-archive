text = "الحمد لله ....<br />وبرضه مش حنسكت ....<br />وبعدين دول أخدوا مني كاميرتين ديجيتال بألف ومتين جنيه ...<br />ماشي يا حرامية ... حسابنا قرب معاكم<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
