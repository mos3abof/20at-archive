subject = "مقهورة"
author = "بنت مصريه"
posted = "2006-05-31"
text = "والله انا لو ناشطه واعتدى على مهسكت حتى لو مت ودايما هندد بالحكومه وياريت الحكومه تعرف ان العنف بيولد عنف وينضفوا الامن من الالعناصر الزباله اللى فيه صح ولا ايه يانظيف"
