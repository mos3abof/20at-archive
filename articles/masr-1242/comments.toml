subject = "عادي يا جماعه افهموا كويس بس بيقول ايه الراجل"
author = "حيران"
posted = "2006-12-03"
text = "اعتقد يا جماعه الراجل بيكلم عن حكم شرعي اسمه انتفاء الصفه بالانتقال وحكم تطهير المال بمعني انك لو عندك فلوس مخدرات حرام وتبت لربنا تعمل فيها تولع فيها ما انت مش ينفع تصرفها علي نفسك علشان فلوس حرام يبقي تتبرع بيها عادي ياجماعه الراجل مش قال كلام جديد انتوا بس الي مش فهمتوا قصده ايه بس<br />دي حكم اسمه تطهير الاموال عادي خالص الفلوس الحرام عليك لما تتبرع بيها مش بتبقي حرام للي استقبلها زي انت معاك فلوس مسروقه كده دي حرام اشتريت بيها خضار بياع الخضار بقيت بالنسبه ليه فلوس حلال يبقي المال تنتفي صفته بالانتقال<br />مع تمنياتي"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073447/http://masr.20at.com:80/article.php?sid=1242"

