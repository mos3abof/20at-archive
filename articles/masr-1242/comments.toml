text = "لا ادري كيف تقبل اموال من حرام لتمويل هدف سامي وهو قناة اسلامية لتعريف الناس امور دينهم كيف يقول الشيخ الذي احترمه واحبه \"ابواسلام\" اننا نقبل غسيل الاموال واموال المخدرات والربا \"ان الله طيب لا يقبل الا طيب\" .. لا ادري هل الغاية تبرر الوسيله ؟؟؟؟؟؟؟؟؟؟؟"
