[[comments]]
order = 5
subject = "أرجو الانتباه لأمر هاااام ........"
author = "إبن بهية"
posted = "2006-12-03"
text = "أرجو من الإخوة في موقع أولاد البلد الذي نحترمه جميعاً الانتباه بشده لما سأقول .. لقد قرأت الموضوع أكثر من مرة وهو من الناحية العلمية لا يمكنك ن تسميه حواراً أو ريبورتاج أو تحقيق صحفي أو تقرير أو خبر أو مقال .. يعني ببساطه ومن غير ما تزعل الأخت أميره فوده التي ربما كانت في يوم ما تلميذة لدى أحد أصدقائنا .. يا أختي الكريمه أميره موضوعك يفقتد إلى القالب الإعلامي الصحيح ، هذه ناحية جوهرية في كلامي حتى لا تفهمي أنه تجريح في شخصك أو مهنيتك .. وربما هذا كان السبب المباشر في تحويرك لكلام الرجل المسكين أبو إسلام متخذة منه عنواناً للموضوع على طريقة عادل حموده العبيطه التي لم ولن توصله إلى المجد الذي يتمناه لأنه ببساطة مجرد نافخ بالونات .. يعني أجوف بلا ي معنى حقيقي ولا يمكنك أمام كتاباته إلا أن تقف وتعطيه ظهرك فوراً مهما كنت تتفق أو تختلف معه ..<br />أنت أختي الطيبه لملمت هذه الجمل من لسان أبو إسلام ووضعتيها أمامك فلم تجدي يها موضوعاً ذا شأن ولم تتمكني من صياغتها بطريقة إعلامية في قالبها الصحيح فلجأت إلى مدرسة عادل حموده في الهروب من العلم إلى السبهللا الصحفية المتمثلة في فرقعه فارغه لا علاقة لها بالموضوع .. حين تأخذين كلام الرجل الذي يقوله للشكوى من مر الحال وضيق المجال وتجعلين منه عنوان هذا الموضوع الأقرب إلى فنون خالتي بمبى منه إلى فنون الصحافة فهذا كلام لا يليق أبداً ولا يجوز أن يمر علينا هكذا مرور الكرام .. مدرسة مصطفى أمين وعلي أمين في الصحافه الحاره التي يقلدها البعض لم تكن يوماً قلباً للحقائق أو تصيداً للكلمات من أفواه الناس ولو لم يقصدوها كما تعلمين يقيناً .. هل تشعرين أنك قمت بعمل جيد؟ هل تشعرين أن الفبركه المكشوفة تلك عمل جيد ؟ هل تظنين أنك نجحت في شد انتباه الناس ؟ ربما شددت<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073447/http://masr.20at.com:80/article.php?sid=1242"

[[comments]]
order = 6
subject = "ما علاقة الصورة بالموضوع ؟؟؟"
author = "إبن بهية"
posted = "2006-12-03"
text = "بسبب طول التعليق السابق لي نسيت نقطة هامه وهي سؤال لأولاد البلد .. ما علاقة قناة الأمه بمظاهرة في الجامع الأزهر ؟؟؟ لأ والله أنا ليس لدي أي تحفظ على استخدام أي صوره مهما رميتم من ورائها فهي حريتكم الشخصيه ورؤيتكم ، لكن ما علاقة هذا بذاك ... ممكن نعرف ؟ أفيدونا أفادكم الله ...<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073447/http://masr.20at.com:80/article.php?sid=1242"

[[comments]]
order = 7
subject = "رأى"
author = "البراء"
posted = "2006-12-03"
text = "تطهير ايه ... ده اسمه غسيل اموال ودى جريمه يعاقب عليها القانون فى الدنيا كلهاهتيجى احد عندنا و تبقى حلال ، ربما تكون القناه اتعملت بدافع التقليد لقناه الحياه و غيرها لدى النصارى خاصه وان ابواسلام مهتم جدا بمثل هذه الامور.<br />انما هو المؤسف فعلا تعليق الاخ الفاضل ابن بهيه المتحمس و الغيور ، ولكن هل يجوز ان ندافع عن اى شىء يرتدى عباءه الدين حقا كان ام باطلا ؟؟ ويبدو انه لم يجد ما يدافع به من حيث المضمون فاتجه للشكل ، وتحدث عن تعقيدات و اساليب صحفيه و ربما شكك فى مصداقيه كاتب الموضوع من الاساس ، نظرا لان الفكره (قبول اموال حرام بغرض الحلال) غير مقبوله و من الصعب التقليل من حدتها او الالتفاف حولها ، لذا و مع الاسف لجأ الى هدم المقال من اساسه تجنبا للجدال حول مضمونه.<br />ارجو الا يغضب من تعليقى و لكن هذا ما شعرت به من خلال مجمل ما قاله تعقيبا على المقال."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073447/http://masr.20at.com:80/article.php?sid=1242"

