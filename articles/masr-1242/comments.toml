[[comments]]
order = 1
subject = "كلامك كله تناقض"
author = "فارس_fr"
posted = "2006-12-03"
text = "ان لم تهتم بامر المسلمين وقضاياهم فانت لست منهم ,, فكلامك كلهتناقض ازاى تقبل اموال الربا وغسيل الاموال لتمويل هدف نبيل وسامى , على حد كلامك وانا اعتقد انك لك هدف تانى ,, واعتقد ان اللى يدافع عن النبىيدافع عن المسلمين وقضاياهم ومصالحهم \"من لم يهتم لامر المسلمين فليس منهم \" .<br />والدليل انك مش مهتم كلامك ده (فنحن كقناة لا شأن لنا من قريب أو من بعيد بالقضايا الداخلية كما أننا لا ننتمي لأي جماعة أو جمعية أو هيئة ولا نهاجم حكام ولا برلمان ولا لصوص البنوك ولا أعضاء مجلس الشعب ولن نتعرض بسوء الى أي خدمة من الخدمات الموجودة لأننا لا نريد أن ندخل في أي صراع مع أي سلطة فقضيتنا قضية فكرية ونريد فقط أن نعمل من أجل الإسلام في أمن وآمان داخل بلادنا\".!!)"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073447/http://masr.20at.com:80/article.php?sid=1242"

