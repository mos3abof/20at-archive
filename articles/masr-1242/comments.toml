[[comments]]
order = 10
subject = "توضيح"
author = "إبن بهية"
posted = "2006-12-04"
text = "أخي الكريم براء .. تحية لك وللجميع .. أرجو تكرماً منك عادة قراءة الموضوع الإنشائي المنشور أعلاه لتتمكن من التقاط سبب ما ذكرته في تعليقي .. جاء في الموضوع على لسان السيد أبو إسلام كما تقول الأخت الكريمه كاتبة الموضوع ما يلي ((كنت أتمنى أن نبث من مصر، وأن نجد بها مساحة لتحمل أهداف القناة من نشر آداب وأخلاق الإسلام والتعريف بالنبي الكريم ولكن للأسف– ولا أخجل من قولها- نحن نتسول المال من المسلمين من أجل استمرار عمل القناة لأننا نبث بمجهوداتنا الذاتية.. ولذلك أعلن أننا مستعدون لقبول أي تمويل حتى ولو كان مصدره غسيل الأموال أو تجارة المخدرات أو حتى أموال الربا.. وكل من لديه مال يخشاه ليس عندنا حرج شرعى فى قبوله على إطلاقه طالما أن الهدف النهائي منه خيرا وهو نصرة رسول الله فى شعوب أصبح فيها الدين الإسلامي مهان إلى هذا الحد المخيف)) هلا لاحظت أمراً مريباً ؟ أرجو إعادة القراءة ..<br />يقول أبو إسلام كنت أتمنى أن نبث من مصر ..... لكن للأسف .. ((ركز معي)) المفروض أن تكون التكملة هي أنه لكن للأسف لا نبث من مصر .. أليس هذا هو المنطق؟ لكن من غير المنطقي أن تتحدث عن نتيجة وتعقبها بسبب مختلف بعد الأسف .. يعني مثلا كنت أتمنى النجاح هذا العام لكن للأسف أهملت دراستي .. هذا منطقي والغير منطقي أن تقول كنت أتمنى النجاح هذا العام لكن للأسف فاز الأهلي على الزمالك .. هو كان يتكلم عن أمانيه في البث من داخل مصر وكان من الطبيعي أن يذكر بعد هذا الأسف أسباب ذلك المنع وأما ما ذكره بعد الأسف طرق التمويل .. هذه واحده ..<br />ثانياً تحدث الرجل عن موضوع التمويل الذي يتسولونه بأسلوب الشاكي الباكي وكيف أنها قائمة على جهودهم الذاتية ولذلك يعلن أنهم مستعدون لقبول أية أموال لضمان استمرار هذه القناة في أداء عملها الخيري ف<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073447/http://masr.20at.com:80/article.php?sid=1242"

[[comments]]
order = 11
subject = "أخي براء ..."
author = "إبن بهية"
posted = "2006-12-04"
text = "أما حديثك أخي الطيب عن أنني رحت بعيداً عن المضمون إلى الشكل فهذا لسبب رئيسي واضح لك جداً .. الموضوع لم يكن متمحوراً حول تمويل القناة بالربا .. الموضوع كما ترى وحتى من العناوين الداخليه يتحدث عن التضييق على أبو إسلام وقناته وجاء محشواً فيه سطر واحد عن التمويل في سياق باكي ومتسول وشاكي .. وما تم هو شقلبة الوضع واعتبار هذا السطر الأساس بأخذه عنواناً للموضوع .. هذا القذى ((على رأي عمنا بيرم التونسي رحمه الله)) بالضبط ما تفعله الصحافة الصفراء بتاعة الواد الأصفراني .. أشهر أصفراني في مصر والوطن العربي عادل حموده بتاع الابتزاز وساويرس اللي طلعه بره روزاليوسف من ست سنين لو فاكرين .. يا ريت حد يكون فاكر المعركه التي دارت بينه وبين عمنا الفاجومي لما نزل في الراجل بهدله عشان خاطر إنه قبل دعوة من ساويرس لإقامة حفل له .. طيب الفاجومي حر يروح زي ما هو عايز ويحتفل مع اللي عايزه .. لكن اللي مش حر وما يصحش خالص هو اللي بيبتز الناس عشان خاطر .. يا أنشر .. يا تدفعوا .. زي ما شفنا بعدها في كتاب عمنا الفاجومي ((آدي مصر وآدي أنا وعادل حموده)) يا ريت يكون اسم الكتاب صح ولم تخني الذاكره .. ده يا سيدي اللي زعلني في الموضوع لأني بصراحه أشوف العمى ولا أشوف عادل حموده ده ولا أي حد بيقلد أساليبه الواطيه في العمل الصحفي ..<br />تحياتي لك<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073447/http://masr.20at.com:80/article.php?sid=1242"

[[comments]]
order = 12
subject = "قبل ما حد يرد ..."
author = "إبن بهية"
posted = "2006-12-04"
text = "قبل أن يهم أحدهم بالدفاع عن عادل حموده المفتون به البعض .. أرجو الانتباه إلى أنني مستعد لتزويده بما يقنعه تماماً (مستندات) بأن ذلك القذر لا هو عادل ولا حموده ولا أي شيء .. هو مجرد جرز قذر يقتات على فتات موائد رجال الأعمال .. لما طردوه من روزاليوسف ورموه في ثلاجة الأهرام ليكتب زاويه كل أسبوع عرض على أكبر قوادي الصحافة المصرية ((مشهور جداً والكل عارفه في الوسط الصحفي)) عرض عليه ممارسة الضغط على رجل أعمال كبير يملك المصانع والشركات في العاشر من رمضان وخليج السويس لغاية ما رمالهم قرشين وعملوا بيهم صوت الأمه بأسماء طبعا مختلفه .. وملأت إعلانات الرجل صفحات صوت الأمه لو فاكرين تاريخها من عدد زيرو .. يالا كفايه كده النهارده .. بس يا ريت نعرف الناس قبل ما ندافع عنها .. من كام يوم كان هنا موضوع عن أحدهم برضه وبرغم انتمائنا المشترك إلا نني تضامنت مع الآخرين ضده وذكرت ما لدي من معلومات لأنه فعلا كان راجل مش كويس .. القضيه هنا .. إنك تعرف الحقيقه أولاً .. أحياناً تجد أناساً لا نختلف معهم ولا يمكن أن نتحاور معهم ويأـي بعض الإخوة يطالبنا بالحوار .. زي مبارك اللص الواطي .. وعادل حموده القذر .. دي ناس ما ينفعش تذكرها غير بكل نقيصة لأننا مش مجرد مختلفين في الرأي زيي أنا دلوقتي والأخ براء .. لكن ول لصوص وأسخم من اللصوص .. عايزني أتحاور مع لص وعميل وفوق كل ده بعيد عن السامعين قواد ؟؟؟ لأ طبعا .. الأشكال دي ما لهاش عند أولاد بهيه غير ضرب الصرمه القديمه ..<br />للجميع تحياتي<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
