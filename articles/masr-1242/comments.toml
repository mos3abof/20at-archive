[[comments]]
order = 15
subject = "رأى"
author = "اميره فوده"
posted = "2006-12-05"
text = "الاخ ابن بهيه اشكرك على مداخلاتك ولكن لن اطيل عليك فى التعليق لانى صحفيه واعلم ان خير الكلام ما قل ودل اولا اخبرك بأننى كررت على مسامع الشيخ ابو اسلام اكثر من مره هل انشر عدم ممانعه القناه فى تلقى اموال مشبوهه فكانت اجابته دائما طبعا طالما اننى لن اصرف بها على نفسى واستخدمها فى عمل سامى ورغم اختلافى فى هذه الجزئيه معه الا اننى احترمت جرائته فى التعبير عن رأيه ثانيا بدى من كلامك انك تعرف القناه جيدا وربما تعرف ابو اسلام نفسه فكان عليك قبل ان تقوم بهذه الحمله الهجوميه والتكذيبيه ان تدعيه للرد والمشاركه فى الموقع كى تكون المناقشه اكثر ايجابيه بدلا من الشكل الذى تحدثت به واذا كان لم يقل ذلك فعليه بالتكذيب فورا ولكنى اطمأنك ان هذا لن يحدث ثالثا انت قيمت الموضوع من الناحيه الشكليه ورغم احترامى لرأيك انصحك بأن تترك التقييم الشكلى للمتخصصين فهم ادرى منك بفنون العمل الصحفى وعليك تقييم مضمون الموضوع فقط فليس من المنطقى ان كل من لا يعجبه شكل موضوع يتهمه بالصحافه الصفرأء وهو ما دفعنى ان انصحك بعدم التقييم الشكلى لانك مع الاسف تخلط الاوراق ببعضها بعيدا عن اى تقييم موضوعى<br />واخيرا يا اخ ابن بهيه اخبرك بقاعده صحفيه تقول ان الموضوع الذى يثير حوله جدالا فهو موضوع ناجح بكل المقاييس لانه تضمن معلومه اثارت قضيه واكرر مع اختلافى مع ابو اسلام الا اننى نقلت ما قاله بحياد تام وموضوعيه.."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073447/http://masr.20at.com:80/article.php?sid=1242"

[[comments]]
order = 16
subject = "تعقيب إلى الأخت أميره"
author = "إبن بهية"
posted = "2006-12-05"
text = "الأخت العزيزة أميره فوده<br />شكرا على تعقيبك الكريم .. وأشكرك على نصيحتك لي بعدم التقييم الشكلي للموضوع برغم أهميته لأنه كما تعلمين يا أختنا العزيزة (أنت تقولين صحفية) أن وضع أي موضوع في شكله الصحفي المناسب ليس ترفاً ولكنه جزء جوهري في كيان الموضوع ولا أعتقد أن أي مدرس مساعد في الكلية يمكن له أن يقول لك ذلك لو درست إعلام ولا يمكن أن تجديه في أية ورقة صادرة من متخصص ولو حتى من منازلهم .. حكاية أن المضمون أهم من الشكل هذه تصلح لأمور أخرى غير الإعلام .. أرجو مراجعة مقررات أولى صحافه ...<br />أما قولك بمعرفتي الكبيرة بالقناة والسيد أبو إسلام شخصياً وطلبك مني أن أتصل به كي يرد فهذا يؤكد لي أنك لم تقرأي تعليقي باهتمام لأنني قلت فيه أنني أرى صورة أبو إسلام في كثير من المدونات يطلبون له التحرر من سجون مبارك .. وتساءلت هل خرج ؟؟؟ وشكرت موضوعك أنه عرفنا بخروج هذا الرجل الطيب .. أما القناة فقد عرفتها من عدة قراءات ولم أشاهدها حتى اليوم .<br />تقولين أختنا الطيبة أنك كررت الكلام على السيد أبو إسلام ورأيت منه موافقة على نشر هذا .. وأنا لو تابعتي كلامي منذ البداية لم أكذبك ولكني في آخر تعليق فقط ذكرت هذا بأسلوب مهذب جداً مقارنة بما قمت حضرتك به من استعمال لجملة بسيطة قالها الرجل الطيب في سياق أسفه وشكواه من عدم توفر التمويل وجعلت منها العنوان الرئيس لموضوع مختلف عن العنوان تماماً .. راجعي موضوعك ..<br />نصيحة رداً على نصائحك الموقرة .. أتمنى أختي الكريمة أن تتبصري فيما قلت جيداً وتراجعي نفسك ومقررات الدراسة واعلمي أننا سنظل طوال حياتنا نتعلم ومن يكف عن التعلم ينتهي .. واعلمي جيدا أنك تتعاملين مع جمهور (أنا منهم) والجمهور لا علاقة له بنيتك إن كانت طيبة أو العكس وإنما يحكم على ما يراه .. وأنا رأيت أسل<br />اقرأ بقية التعليق .."
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210014329/http://masr.20at.com:80/article.php?sid=1242"

