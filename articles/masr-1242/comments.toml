capture_url = "https://web.archive.org/web/20061205073447/http://masr.20at.com:80/article.php?sid=1242"

[[comments]]
order = 13
subject = "عنوان التعليق"
author = "البراء"
posted = "2006-12-04"
text = "شكرا اخ ابن بهيه على الاستفاضه فى الرد على التعليق ، وهذا بالاضافه الى الاسلوب الراقى فى الحوار والذى ارجو ان يكون مثالا لبعض الاخوه الذين ربما ببعض الاندفاع يبادرون بالاشتباك مع كل من يختلف معهم فتحيه لك مره اخرى<br />وفى الواقع فان فقرتك الاخيره فى ردك الاول لخصت الفكره كلها، لو ان الكلام المذكور بالمقال صحيح فكما قلت انت لن نستطيع ان نقبله كله دون اى تحفظات واما اذا كان الموضوع مفبرك فهذا امر اخر فبناء على صحه اى من الامرين يمكن ان نبنى راينا ، فاذا حقا تاكد ان المقال يشوبه الخطا او انه من البدايه لا اساس له ، فانت محق فى كل ما قلت. وعموما انا اتعجب من دول غنيه كدول الخليخ مثلا تكون على استعداد لدفع اضعاف ما قد تتكلفه هذه القناه و فى امور لا قيمه لها فلا احد يستطيع ان ينكر ان هناك مظاهر للاسراف و البذخ فاقت كل الحدود.<br />نهايه ، اعتقد ان التعليق الاخير الخاص بهذا العادل حموده ليس موجه لى بصفه خاصه ، فهو لا يعنينى اصلا من قريب او بعيد حتى ادافع عنه.<br />والسلام."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073447/http://masr.20at.com:80/article.php?sid=1242"

