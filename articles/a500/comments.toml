[[comments]]
order = 3
subject = "جدعة يا رغدا ..."
text = "الجميل بكتاباتك يا رغدا ...<br />بصراحة كل شي ...<br />يعني عم تطرحي مواضيع احنا بنعيشها كل يوم لكن باسلوب مختلف .. ممتع .. شيٌّق ..<br />عم تعملي جهد ممتاز لتخلّي الصورة أوضح ...<br />وبتوجهي التفكير لنواحي أو جوانب حياتية روتينية<br />من خلال تسليط الضوء عليها .. لكن برضو ضوء من نوع مختلف!!<br />الحلول غالبا مفقودة بمقالاتك (بالأخص بهذا النوع الحساس من المقالات اللي بتتناول العلاقات الشخصية...)<br />لكن انتي غير مطالبة بالحلول ...<br />بل على العكس محاولة تقديم حل قد تضر بنوعية المقال!!<br />الموضوع متشعّّب جدا و ظروفه متنوّعة ...<br />لذلك تقديم حل على أساس وجهة نظر واحدة (يعني وجهة نظر الكاتب)<br />قد تضر بالمرجو فعلا من هذا المقال ... ذكاءك ككاتبة تم توظيفه من خلال استبدال الحل بجملة معطيات,<br />خبرات سابقة وحوارت, يعني (كم) من المدخلات المهمّة لاستنباط حل (شخصي) مناسب لكل شخص ...<br />يعطيك العافية<br />استمررررري ...<br />أحمد خنفر"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018213553/http://www.20at.com:80/article.php?sid=500"

[[comments]]
order = 4
subject = "البنات بتتمنطر بانها رفضه فلان"
text = "حصلت لى تجربه انى اتقدمت لزميله فى العمل وكنت مراعى النقطه دى ان الموضوع يكون سر حتى يكتمل وبعد كدا لقيت الناس كلها عرفت انهارفضت مع انى كنت غير مقتنع بسبب رفضها ولكن يبدو ان بناتنا فى مصر لسه واخدين قلم فى نفسيهم<br />ربنا يهدى---"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018213553/http://www.20at.com:80/article.php?sid=500"

[[comments]]
order = 5
subject = "صباح الورد .. وتعليق من القلب"
text = "بطله يارغداء<br />موضوع يمس ناحيه مهمه من حياتنا نحن الجيل الشاب<br />بصراحه ان كان في نطاق العمل او الجيران او الاقارب<br />انا مع مبدا كتمان امر الخطوبه لانها فقط مرحله لدراسه الاطراف لبعضها ولا داعي للاحراج واعلان الامر لانه قد يكون هناك فيما بعد عدم تفاهم ومافيش نصيب<br />كل مااحب ان اقوله هو ان المشكله الحقيقيه في مجتمعنا اننا لانفهم الزواج كما يجب ان يكون انه تفاهم تعاون مشاركه وقبل كل شيئ احترام<br />ولكن ياتي عندك دور الاهل في النظر اليه انه امر لا مفر منه تحكمه المطالب الماديه او العادات الاسريه<br />او تاتي البنت لتفكر فيه بانه وسيله للخروج من منزل الاهل والحصول على الحريه وننسى انه امر مبنى على الرضى والتوافق وينتج عنه بذره جديده لحياة جديده<br />تحياتي لك ووفقك الله<br />المحبه<br />صباح الورد"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018213553/http://www.20at.com:80/article.php?sid=500"

