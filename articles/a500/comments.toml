[[comments]]
order = 8
subject = "الحلم الثائر"
text = "الشعراوي قال عن الريس السادات : لا يُسأل عما يفعل<br />جميلة العبارة ... والقلم مرفوع عن ثلاثة النائم حتى يستيقظ ... والصبي حتى يحلم ... والمجنون حتى يفيق<br />باختصار<br />نصر تحول الى هزيمة<br />لم؟<br />لانه السياسة طغت على الحل العسكري الناجع جداجدا جدا والاجدر مع الكيان الصهيوني<br />وشكرا"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018213553/http://www.20at.com:80/article.php?sid=500"

[[comments]]
