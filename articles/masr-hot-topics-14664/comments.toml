text = "بجد أحلي وأروع وأرق ما في عمري كله و2009 بشكل خاص أن ربنا أعطني راجل لو حكيت عنه كل ستات الدنيا هاتحسدني عليه، ولما بحب أوصفه بقول ملاك ف جسد رجل، وهو أثبتلي أن الراجل فعلا أقوي من الست ف كل حاجة، أدعولي يرجع بألف سلامة."
