posted = "2009-12-30"
text = "كارثة الدويقة<br />حادثة القطار<br />الضريبة العقارية<br />تجديد بطاقات الرقم القومى كل سبع سنين<br />اختلاط مياة الشرب بمياة المجارى فى قرية البرادعة واصابات التيفوئيد<br />اكتشاف الزراعات على مياة المجارى<br />تربية الاسماك فى بركة مياة المجارى بالعاشر من رمضان<br />ذبح الخنازير واصابات انفلونزا الخنازير<br />ازدياد البطالة<br />ازدياد المصابين بفيروس الكبد سى<br />حالات الاغتصاب والتحرش الجنسى<br />الحكم فى قضية السكرى<br />زواج هيفاء وهبى من واد تافة<br />حرب غزة<br />تلك كوارث وطنية وغيرها وغيرها وغيرها"
archived = "2010-01-03"
capture_url = "https://web.archive.org/web/20100103121955/http://www.20at.com:80/masr/hot-topics/14664--2009.html"
