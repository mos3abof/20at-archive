subject = "اردنيه"
author = "تكّ"
posted = "2006-01-03"
text = "كل الاردنين بحبوكي يا فلسطين وبتمنولك التحرير وبتمنوا كمان انه الحقرا اليهود يطلعوا منك ...........الله ينصركوا بجاه محمد عليه الصلاه والسلام ..لاجلك يا مدينة الصلاه نصلّي لاجلك يا بهية المنازل يا زهرة المدائن يا قدس ياقدس يا مدينة الصلاه نصلّي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125613/http://www.20at.com/article2.php?sid=35"

[[comments]]
