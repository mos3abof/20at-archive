subject = "صامدون"
author = "البداوي الفلسطيني"
posted = "2006-01-18"
text = "إن طالع بعدك عنك يا بلادي و النوى و حرمت شم الورد و الياسمين و الهوى فسيبقى ذكرك طول المدى شلــــت يمناي إذا نسيتك يا بلادي وليس لي بلاد غيرك فلســـطين الحبيبية<br />البداوي"
archived = "2006-11-02"
