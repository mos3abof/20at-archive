[[comments]]
order = 4
subject = "للغالية فلسطين"
author = "رومينامروة"
posted = "2006-04-30"
text = "عشت يا ارض الشهداء عروسا مزينة بدماء الابطال فجر الحرية دنا على الطلوع و راح نزفك يا خيرة العرايس بلدي عزيز علىلكن لو خيروني لاخترتك انت لادفن في ترابك تحية اسلامية نضالية لكل ابطال الحجارة"
archived = "2006-11-02"
