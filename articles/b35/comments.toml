[[comments]]
order = 0
subject = "اجمل من روحي فلسطين"
author = "شاب مغترب فلسطيني"
posted = "2005-12-08"
text = "ا اطيب ريحك يا فلسطين وما اطيب ريحة ثراك، يعلم الله اني مشتاق لك اكثر من اشتياقي لكل شيء، واني اسال الله عز وجل ان المس ثراك ولو لدقيقة واحدة.<br />ولا اريد ان اكون مداحا للاستاذ عاطف دغلس فهو يستحق اكثر من اقول له بارك الله فيك وجزاك كل خير.واشكر عشرينات على اثرائنا بهذه القصص الجميلة......"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125613/http://www.20at.com/article2.php?sid=35"

[[comments]]
order = 1
subject = "ترابي"
author = "بلادي وان جارت علي عزيزة اهلي وان ضنوا علي كرام"
posted = "2005-12-08"
text = "انا بحبك يا فلسطين من البحر للنهر وسارجع في وم الى ارضك وساقبل صراك رغك كيد الكائدين"
archived = "2006-11-02"
