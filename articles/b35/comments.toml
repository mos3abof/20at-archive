[[comments]]
order = 5
subject = "فلسطين أرضي"
author = "حبيبتي ..عشيقتي ..فؤادي .. وقلبي"
posted = "2006-06-25"
text = "قلبي هذا ينبض باسمك حين يسمعه<br />أنا طالبه في الخامسة عشر من ع8مري<br />ولم أرى فلسطين ولم أشم رائحتها<br />أتمنى ولو قبل أن تقبض روحي بدقيقة أن أراها وأشم رائحتها الزكية بدون شك بلدي الغالي لو كلفني الذهاب اليك او استعادة حبة رمل واحده روحي فهي رخيصة في سبيل الوطن ...<br />مع حبي الذي لا يوصف ولايقدر أحد يحبك متلي<br />بين أرضك ..رؤى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125613/http://www.20at.com/article2.php?sid=35"

[[comments]]
order = 6
subject = "يا حبيبتي"
author = "فدائيه"
posted = "2006-07-20"
text = "ما احلى العودة الى الوطن<br />هذا هو كلام لاجئة لم ترى بلادها منذ ما انخلقت والله يا بلادي ما احلاكي وما هو السبيل الى اللجوء الىالبلاد ونحن بعيدون عنها يارب خلينا نرجع على فلسطين وبكفينا ذل وياس وبكفينا تفرقة عنصريه من جميع الشعوب يارب مالنا غيرك والله انا بنحبك وابندعوك من كل قلبنا يا رب ارجوك استجب لنا فها هم الناس لا يسألون عن شيء سوى المال والامور الاخرى يارب ياحبيبي ساعدنا والله انا بحاجه الك هذا امنياتنا يافلسطين ما بك تبكي على ابنائك وهم ذاهبون الى الله فياريت نحن نموت موتتهم ونحيا عند الله شهداء يارب هذا الدعاء ومنك الاجابه اللهم امين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125613/http://www.20at.com/article2.php?sid=35"

[[comments]]
order = 7
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-19"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125613/http://www.20at.com/article2.php?sid=35"
