[[comments]]
order = 4
subject = "موقع مقرف"
author = "علي فكرة يا عشرينات انتو بقيتو موقع مقرف جدا ... عاملين نفسكم متنورين و سايبين الناس تشتم في بعضها و بتتبنوا وجهات نظر في منتهي الغرابة و بقالكم كام يوم مش وراكم سيرة غير فاروق حسني اصل خلاص مفيش حاجة اهم نتكلم فيها غير الحجاب ... طاب بذمتكم كدة في كام موضوع اتكتب عن تحرشات وسط البلد و كام موضوع اتكتب عن فاروق زفت و أم الحجاب و أم النقاب .... ولا حتي كام موضوع اتكتب عن الانتهاكات الجنسية للمواطنين (و ياريت متحسبوش الحملة اللي عملتوها لامجد عشان هو صاحبكم)"
posted = "2006-11-27"
text = "انا رأيي ولعوا في أم الستات بقي عشان تلاقوا حاجة مفيدة تكتبوها<br />حاجة تقرف"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128110052/http://masr.20at.com:80/article.php?sid=1215"

