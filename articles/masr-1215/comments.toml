[[comments]]
order = 1
subject = "برغم أنني شخصيا ضد الختان نهائياً ....."
author = "إبن بهية"
posted = "2006-11-27"
text = "برغم أنني شخصيا ضد الختان نهائياً للأنثى ولا أعتقد في مشروعيته أو تحريمه .. إلا أنني لو كنت على شفا الموت ووصف لي دواء من جمعية مثل تلك الألمانية ما أخذته وفضلت الموت على التعامل مع الماسونيين الخنازير ... ختان مش ختان .. نختن ما نختنش إحنا أحرار .. جميع الجمعيات الأهلية من عينة الجمعية الألمانية دي مشبوه ومؤسس خصيصاً من أجل لخبطة مجتمعاتنا بدعاوى سخيفة كلها تدعي البراءة والطهر والرقة والعزوبة وووو إلخ من تلك الادعاءات الكاذبة .. وفي الحقيقة هي جمعيات قذرة مؤسسة خصيصا لهدم المجتمعات وضرب ثوابتها من جذورها في أي موضوع والسلام .. يا ريت يا شباب تدوروا على أساس نوادي الروتاري والليونز اللي بقت زي أكشاك المثلجات في بلدنا .. يا ريت تدوروا وتشوفوا أصلها إيه .. كلها مع الجمعيات القذرة دي مجرد محافل ماسونية متنكرة ... أنا مع كل الشيوخ المحترمين الذين خلعوا من المؤتمر بسبب تمويله المشبوه من جمعية أجنبية .. احنا ناقصينك انته كمان يا سي جيرمان .. ما هو أصلهم نشطوا أوي أوي بعد ما الست ميركل زعيمة اليمين المتطرف وصلت للحكم في الجرمانيا .. ولسه ياما حنشوف من الألمان كمان ... أنا ضد الختان لكن بصوت محلي من جوانا مش من جمعية نجمة داوود دي<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128110052/http://masr.20at.com:80/article.php?sid=1215"

