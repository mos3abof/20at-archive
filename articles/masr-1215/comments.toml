text = "يعني اذا رجال الدين هيك بيحكولشو العتب على هالناس البسطا؟ هلا الختان مش حرام؟ طيب اذا قطعو ايد البنت يا ترى حرام ولا حلال؟...بتر عضومن اعضاء البنت مش حرام؟<br />انواسلام بحكوباسمو؟<br />حسبي الله و نعم الوكيل في مشايخ اخر زمن"
archived = "2006-11-28"
