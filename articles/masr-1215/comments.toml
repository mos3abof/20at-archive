[[comments]]
order = 7
subject = "لماذا الختان من ألمانيا"
author = "حمدة فحماوي"
posted = "2006-11-27"
text = "الختان مشكلة مصرية إفريقية ، غير موجودة في بلاد المسلمين أو العرب الأخرى ، وهي مرتبطة بالعادات والتقاليد ، وحرارة إفريقيا..ولكن لماذا لا تكون مناقشة الختان قادمة من الإتحاد النسائي المصري ، أو لجنة المرأة في البرلمان المصري ، أو لجنة المرأة في نقابة المحامين المصريين ، أو لجنة المرأة في جامعة الدول العربية ؟ لماذا تأتينا من ميركل ألمانيا التي ترصد شواطىء لبنان لحماية إسرائيل ، وترصد أيضاً شواطىء المرأة المصرية التي لا يحق لأحد أن يرصدها، أو يطلع عليها ، سوى مؤسساتها النسائية العلمية المصرية، فأهل مصر أدرى بشعابها..مواطنة عربية من خارج مصر"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128110052/http://masr.20at.com:80/article.php?sid=1215"

