[[comments]]
order = 1
subject = "ام"
text = "وهل لوكانت الميس جاوبت وشرحت كانت المعلومة هتدخل دماغ البنت لأ .. كانت هتتلزق وممكن اللزق يفك قبل الامتحان ويبقى حظها حلو لو انفك بعد الامتحان ..<br />بصوا الموضوع ده فيه عدة ضحايا ..<br />اولهم المدرسة نفسها ..تفتكروا ايه اللى يخلى واحدة حامل وتعبانة وزهقانة ..ايه اللى يجبرها انها تقف فى وسط سبعين ثمانين تلميذ وهى مش قادرة وفاقدة 3/4 تركيزها ..ثم انها مش عارفة معلومة بديهية ..طب مين حطها فى المكان ده ..وحملها مسئولية العبث بعقول اطفالنا ..<br />ثانيهم واهمهم اولادنا .. ده تعليم ده اللى بيحصل ..يعنى مفيش واحد من السادة الدكاترة اللى بقالهم خمسميت سنة ماسكين التعليم فى مصر ..عمره سافر برة او حتى قرا هما برة بيدرسوا ازاى ..يعنى هنكون اكتر من الصينيين ..اكيد فيه حل تانى غير اسلوب حشو الدماغ والتلقين الى ان يجىء الامتحان ثم فقدان الذاكرة الذى يجعل مدرسة العلوم لا تعرف من الذى اخترع البكتريا وكيفية تكاثرها .. انا يللى ادبى عارفاها ..اصلى متعلمة برة !!!!"
archived = "2004-11-03"
capture_url = "https://web.archive.org/web/20041103003718/http://www.20at.com:80/article.php?sid=716"

