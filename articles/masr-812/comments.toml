order = 0
subject = "قصة اسلام قبطي"
author = "وديع احمد"
posted = "2006-08-18"
text = "قصة أسلامي<br />بسم الله الرحمن الرحيم<br />* الحمد الله على نعمة الاسلام نعمة كبيرة لا تدانيها نعمة لأنه لم يعد على الأرض من يعبد الله وحده الا المسلمين.<br />* ولقد مررت برحلة طويلة قاربت 40 عاما الى أن هدانى الله وسوف أصف لكم مراحل هذه الرحلة من عمرى مرحلة مرحلة:-<br />مرحلة الطفولة:- ( زرع ثمار سوداء )<br />* كان أبى واعظا فى الاسكندرية فى جمعية أصدقاء الكتاب المقدس وكانت مهنته التبشير فى القرى المحيطة والمناطق الفقيرة لمحاولة جذب فقراء المسلمين الى المسيحية.<br />* وأصر أبى أن أنضم الى الشمامسة منذ أن كان عمرى ست سنوات وأن أنتظم فى دروس مدارس الأحد وهناك يزرعون بذور الحقد السوداء فى عقول الأطفال ومنها: -<br />1- المسلمون اغتصبوا مصر من المسيحين وعذبوا المسيحين.<br />2- المسلم أشد كفرا من البوذى وعابد البقر.<br />3- القرآن ليس كتاب الله ولكن محمد اخترعه.<br />4- المسلمين يضطهدون النصارى لكى يتركوا مصر ويهاجروا..... وغير ذلك من البذور التى تزرع الحقد الأسود ضد المسلمين فى قلوب الأطفال.<br />* وفى هذه الفترة المحرجة كان أبى يتكلم معنا سرا عن انحراف الكنائس عن المسيحية الحقيقية التى تحرم الصور والتماثيل والسجود للبطرك والاعتراف للقساوسة.<br />مرحلة الشباب ( نضوج ثمار الحقد الأسود )<br />أصبحت استاذا في مدارس الأحد و معلما للشمامسة وكان عمري 18 سنة وكان علي أن أحضر دروس الوعظ بالكنيسة والزيارة الدورية للأديرة ( خاصة في الصيف ) حيث يتم استدعاء متخصصين في مهاجمة الإسلام والنقد اللازع للقرآن ومحمد ( صلي الله علية وسلم ) .<br />* وما يقال في هذه الإجتماعات :<br />1- القرآن مليء بالمتناقضات ( ثم يذكروا نصف آية ) مثل ( ولا تقربوا الصلاة ...)<br />2- القرآن مليء بالألفاظ الجنسية ويفسرون كلمة ( نكاح ) علي أ<br />اقرأ بقية التعليق .."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065148/http://masr.20at.com:80/article.php?sid=812"

[[comments]]
order = 1
subject = "الراهب الذي اسلم"
author = "يوسف استاس"
posted = "2006-08-18"
text = "الراهب الذي اسلم<br />قصة يوسف استاس :<br />وقد كتب عنه في شبكة الفجر مايلي :<br />الشيخ يوسف استس الداعية الأمريكي ( القسيس سابقاً )! هذا الرجل من أفضل من رأيت من الدعاة في أمريكا - نحسبه كذلك والله حسيبنا وحسيبه - الشيخ يوسف الأمريكي يسكن بولاية فرجينيا قرب العاصمة واشنطن وهو أصلاً من ولاية تكساس .. رجل مسلم يعتز بدينه ويلبس الثوب والغترة دائماً ، ولما أراه أتذكر الشيخ الأباني - رحمه الله - ، ولم أظن أن أجد أمريكياً أبيضاً كهذا الرجل الفذ .<br />والشيخ يوسف رجل مسن وأبوه الطاعن في السن مازال حياً وكان قسيساً أيضاً وقد أسلم أبوه ولله الحمد ، فترى الابن المسن ( الشيخ يوسف ) مع كبر سنه يحضر أباه الرجل الطاعن في السن المُقعد على الكرسي المتحرك إلى الصلاة ويضعه في الصف ليحضر صلاة الجماعة ( مشهد مؤثر جداً مع كونهما قسيسين سابقين ) .<br />وقد ذكر لي أحد الإخوة أن من أسباب إسلام هذا الشيخ أن امرأة مسلمة جاهلة قالت له لما كان قسيساً : \" أنتم المسيحيين دينكم صحيح إلا أنكم تخطؤون وتقولون أن عيسى قد صلب أو قتل ، والصحيح أنه لم يقتل أو يصلب وإنما الله رفعه إليه \" .<br />فبقي كلامها في نفسه ووجد اختلافاً عندهم وتضارباً في الآراء حول هذه المسألة ، ثم طرح هذه المسألة في اجتماع القسس فثار الجدل واللغط وغضب كبير القساوسة لإثارة هذه المسألة وشكك فيه وطرده من المجلس . وذكر لي غيره قصصاً أخرى نسيت أجزاءاً منها ، ولم أسأل الشيخ عن هذا السؤال الذي سأله إياه الكثيرون ، وكأني رأيت لذلك رابطاً في موقعه .<br />أسلم على يديه الكثير ، ولا يكاد يمر يوم إلا ويسلم على يديه أحد ، وفي أحد الأيام جاءني مستبشراً طليق الوجه وقال : \" أسلم اليوم ستون شخصاً \" .<br />والشيخ لا يكتفي بتلقين الشهادة فحسب بل يتابع المسلمين الجدد ويعلمهم أم<br />اقرأ بقية التعليق .."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065148/http://masr.20at.com:80/article.php?sid=812"

[[comments]]
order = 2
subject = "أقباط مصر مسلمون لا نصارى"
author = "ابو اسلام احمد"
posted = "2006-08-18"
text = "أقباط مصر مسلمون لا نصارى !!<br />وإليكم الأدلة<br />بقلم<br />أبوإسلام أحمد عبدالله<br />Abuislam_a@hotmail.com<br />الحمد لله ، والصلاة والسلام على رسول الله 00 إن القضية التي سأتحدث عنها مباشرة، هي تلك الفِرية التي سموها (( فتنة طائفية )) ، والتي تموت وتحيا ، تم تموت ، ونحن لا نملك أي قدر من المعرفة حول مَن يُصدر القرار بموتها ، ثم مَن الذي يتولى ـ في كل مرة ـ مخاضها ؟‍‍! 0 إنها أزمة يعانيها سبعة وستون مليوناً من المسلمين المؤمنين بإله واحد ، وكتاب واحد ، وسُنَّة نبوية واحدة ، ينهل منها ملايين الفقهاء والعلماء والدعاة والمفكرين وطلبة العلم والدارسين والعوام في علاقتهم بأربعة ملايين نصراني ـ على أفضل تقدير ـ بنسبة 87,5% تقريبا من إجمالي السكان ، وينقسمون ـ فيما بينهم ـ إلى ما لا يقل عن أربعين ملة عقَدية في مصر وحدها !<br />وفي البداية ، أرجو رفْع التكاليف والحواجز النفسية والحساسيات المرهفة ـ تكتيكاً أو استراتيجيةً ـ إن أردْنا الوصول إلى حلول عملية لمشكلة تؤرِّق مضاجع السياسيين منذ غاب الإسلام العقَدي 0<br />تلك التي وجد فيها اللادينيون ( العلمانيون ) وسَقَط متاع الشيوعية وبقايا الماركسيين مستنقع ماء آسِن ، غاصوا فيها حتى أذقانهم ؛ ظناً منهم أن بها صفاءً أرادوا تعكيره ، ووجد فيها بعض العابثين من النصارى ـ المتطلعين إلى النجومية والشهرة ـ سيوفاً على رقبة الحاكم وحكومته ، يغازلونهم بلمعانها بين الفينة والأخرى؛ إثارة للرعب، أو لهواً بما هو ليس بلهو !0<br />نربأ بالعقلاء أن يزايدوا أو يروا في دفن الرؤوس كالنعام منجاةً من الخطر ؛ ففرض الحقائق ليس بحال طعناً ، أو إساءةً لاحد ، والحديث عن النصارى والنصرانية ليس مِنطقة ألغام كما يروجون فى أسماعنا ؛ لتخلو لهم ساحة الأم<br />اقرأ بقية التعليق .."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065148/http://masr.20at.com:80/article.php?sid=812"

