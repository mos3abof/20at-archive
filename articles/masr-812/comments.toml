[[comments]]
order = 10
subject = "كيف غيرني الاسلام"
author = "وديع احمد"
posted = "2006-08-21"
text = "كيف غيرنى الله بالاسلام<br />بسم الله والحمد لله ،<br />والصلاة و السلام على سيدنا محمد أشرف الخلق و خاتم النبيين ، و أشهد أن لا اله الا الله وحده لاشريك له ،واشهد أن محمدا عبده ورسوله و حبيبه ، و أؤمن أن المسيح عيسى ابن مريم هو عبد الله و رسوله وابن أمته ، والجنة حق والنار حق ، وأؤمن بالقدر خيره وشره .<br />( ربنا لا تزغ قلوبنا بعد اذ هديتنا و هب لنا من لدنك رحمة انك أنت الوهاب )<br />أما بعد ،فقد هدانى الله الى الاسلام منذ ما يزيد على (12)سنه ،وكنت من قبل ذلك أشتاق الى الاسلام من كل قلبى و كنت أفكرفيه بعقلى ، ومن قبل ذلك كنت أحب التوحيد ولم يقبل عقلى الشرك أبدا، فلله الحمد ،وكنت أشتاق الى أن أصلى صلاة الجماعة فى المسجد ولو مرة واحدةقبل موتى ، فها أنا أصلىصلاة الجماعة و أنعم الله علىبها أكثر من (12)سنة ، فلله الحمدعلى نعمة الاسلام و كفى بها نعمة .وأحب أن أهدى هذه هذه الأفكار الىكل من يفكر فى دين الاسلام ، لعله يهتدى بها ان شاء الله ، فقدغيرنىالاسلام فى أمور كثيرة أحب أن أشرحها لكل الناس لعلها ينتفع بها المسلم و المسيحى ، والله ولى التوفيق .--- أخى اقرأباهتمام و انتباه .<br />أولا: بفضل الله وحده تغير تفكيرى فى ذات الله سبحانه وتعالى<br />كان تفكيرى كله مشغولا بالتثليث ، وكيف يكون ثلاثة فى واحد ؟وكنت أنا و غيرى نسأل القساوسة : كيف يكون لله ابنا و يكونا متساويان ،ويكونا واحدا ؟ ثم يرسل الأب ابنه ليعذبه الناس ويستهزئون به ويبصقون عليه ويضربونه ويقتلونه أبشع قتله ؟ ثم يموت ويدفن وهو اله؟ لأجل الخطية البسيطه الوحيده التى فعلها أول انسان وليس له خبرة فى الخطية ولا فى وسوسة الشيطان ؟ وكيف يكون ال<br />اقرأ بقية التعليق .."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065148/http://masr.20at.com:80/article.php?sid=812"
