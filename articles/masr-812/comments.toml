[[comments]]
order = 5
subject = "مبروك عليك الاسلام"
author = "قبطي متدين"
posted = "2006-08-19"
text = "اولا احب اقول للدكتور الذي اسلم انة لن يكون أخر من اسلموا و ارجو منه الا ينسي ان هناك اخرين يتم تنصيرهم كل يوم اما بعد احب ان اقول له ان كل ما انتقده في المسيحية ليس سليم :<br />فعبادة الصور و التماثيل ليست صحيحة كما قال و ان كان الاشخاص الذي يحتفظ المسيحيين بصورهم و تماثيلهم مقدسين عندهم ليس اكثر ولا اقل .<br />ثانيا لا يحدث أن الكنيسة تقوم بتعليم المسيحيين الاخطاء اللي في القران لان رجال الدين المسيحي عندهم من الذكاء ما يجعلهم خائفين علي أولادهم من حدوث فتنة يكون المسيحيين هم ضحيتهاامام دفاع المسلمين عن دينهم .<br />ثالثا أنك كتبت خطأ فادح حيث أنك كتبت أن والدك كان عضو لجمعية صدقاء الكتاب المقدس و كان يلح عليك للذهاب الي الكنيسة و ان تكون شماس و المعروف ان الشمامسة هم أحد الرتب الارثوذكسية وبين الطائفتين ما صنع الحداد كما يعلم الجميع و بهذا التناقض انهي كلامي حيث ان كلامك مشكوك في صحته"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065148/http://masr.20at.com:80/article.php?sid=812"

