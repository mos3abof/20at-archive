[[comments]]
order = 7
subject = "اى شخص"
author = "مهو الكلام ده اللى جايبنا ورا"
posted = "2006-08-19"
text = "....هيه قبطى اسلم...الله اكبر...وكان هذا هو اخر انجاز فى الدنيا...فلا هذا الشخص زاد شىء على الاسلام و لا هو انقص شىء من المسيحيه...طبعا قصه قبطى اسلم هذه بها من الثغرات الواضحه التى لا تفوت على اى مسيحى مما يدل على ان هذا الاخ اصلا لم يكن مسيحيا!!!ومن جيد اقول لو اسلم قسيس ولو يحول شيخ الى المسيحيه هذا لن يزيد هؤلاء او هؤلاء .... لا الدين فى النهايه يرجع الى الانسان و ربه ، انما ما يحدث هو تعصب لا يختلف كثيرا عن التعصب عند تحول شخص من الاهلى الى الزمالك."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065148/http://masr.20at.com:80/article.php?sid=812"

[[comments]]
order = 8
subject = "لماذا يستنجد الاقباط بأمريكا"
author = "فهمك كويس"
posted = "2006-08-19"
text = "الاخ الفاضل الذي قال ان جمعية الكتاب المقدس بروتستانتية والشمامسة ارتودكس وبينهم ما صنع الحداد<br />كويس خالص<br />انت تعرف ان امريكا دولة بروتستانتية<br />لماذا يستنجد الاقباط الارتودكس المصريين بأمريكا ويريدونها احتلال مصر طالما ان بين الارثوذكس والبروتستانت ما صنع الحداد وعجبت لواحد اسمه عدلي ابادير عائش في سويسرا عمال يعمل مؤتمرات في امريكا علشان امريكا تحتل مصر هو واحد اسمه مايكل منير"
archived = "2006-08-21"
