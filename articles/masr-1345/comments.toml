[[comments]]
order = 0
subject = "انا احلم"
author = "حسب اللة السادس عشر"
posted = "2006-12-23"
text = "انا احلم<br />ربما احلام يقظة<br />ولا اعمل اى شىء لتحقيق تلك الاحلام<br />اين هى امصانع التى تبنى لتستوعب الايدى العاملة وفى اى مكان وباى نقود<br />اين هى المزارع التى ستوزع على الفلاحين ليشتغلوا فيها<br />نحن فى انتظار المثتثمرين الذين لن ياتوا ابدا<br />نحن فى انتظار المجهول<br />اين خططنا للتنمية<br />لا خطط ولا تخطيط ولا ندرى ما ياتى بة الغد<br />كلنا فى انتظار السادة المثتثمرون والسادة السياح فاذا لم يجيئوا نعمل اية؟<br />نغنى ظلموة<br />نرقع بالصوت الحيانى<br />نبطل اكل وشرب<br />ونجيب خواجات يلموا الزبالة بتاعتنا كاننا دولة خمس نجوم<br />ماحدش هايبنى مصر الا المصريين<br />لا مثتثمر ولا زعبور ولا غيرة<br />نحن فى انتظار حكومة تخطط وتنفذ وتعمر بفلوسنا وتعبنا وفكرنا احنا<br />وحتى ياتى ذلك اليوم هنعض فى صوابعنا ونقول مع المسرحية الشهيرة<br />كداب يا خيشة"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010557/http://masr.20at.com:80/article.php?sid=1345"

[[comments]]
order = 1
subject = "البيان الحقيقي"
author = "المواطن المطحون"
posted = "2006-12-24"
text = "اتسم بيان حكومة نظيف الثالث عشر بما يدعو للتفاؤل والخير والامل علي غرار (الدنيا ربيع والجو بديع سلملي علي كل المواضيع) للراحلة سعاد حسني , فقد تغابيت واحسنت النية ان اتابع بيان الحكومة علي امل ان اسمع من نظيف مؤشرات حقيقية تدل عن الواقع الملموس وليس ( كل شيء تمام يا ريس) لكن للاسف , فالكاذب سيظل كاذب والحرامي حرامي وليس هناك امل الا في غالبية الشعب المطحونين من فقر مزمن وامراض فتاكة وبطالة مستفحلة وفساد مستشري والامل ان يفوق الشعب من غيبوبته العميقة , فكل شيء بالبلد الان يجري سرقته وبيعه للاجانب من يهود وامريكان , واذا كانت ممتلكات الشعب في عهد ثورة عبد الناصر تباع الان برخص التراب , ففي الغد سيطل علينا خبر ببيع قناة السويس او تاجير الاهرامات , فكل شيء مباح الان في ظل عالم الخصخصة والمصمصة وفي ظل الاقتصاد الحر ان يطرح كل شيء للبيع حتي ولو كانت المباع هو مصــــــــــر ."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010557/http://masr.20at.com:80/article.php?sid=1345"

[[comments]]
order = 2
subject = "وظيفة فى بنك زراعي"
author = "فارس_fr"
posted = "2006-12-24"
text = "فى احد الايام الغابرة علمت من صديق لى عن وجود مكان شاغر \"وظيفة \" فى احد البنوك القروية ومعلن عن هذه الوظيفى فى الجريدة ,, وكالعادة ذهبت لبحث عن واسطة , نعم واسطة , وللاسف بعد استيفاء جميع الطلبات والشروط اتضح ان , الاعلان عن هذه الوظيفة كان احد الشروط الاساسية ونظام من النظم الحكومية ,,كيف؟؟<br />فهذه الوظيفة لم تعد شاغرة مذ 3اشهر وتم تعين شخص ما بها واستلم رواتبه ,, وتسالت لماذا اذن يتم الاعلان عن وجود وظيفة وهى لم تعد شاغره ,,, رد البيه المسؤول : ده النظام يا فندى , عايزنا نخالفه ولا ايه ؟؟؟<br />هذا هو حال الحكومة وهذا هو حال البلد وعوود فى وعوود وكلام فى الهواء .<br />حسبي الله ونعم الوكيل"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010557/http://masr.20at.com:80/article.php?sid=1345"

[[comments]]
order = 3
subject = "ربنا اكيد معانا يا فارس"
author = "المواطن المطحون"
posted = "2006-12-24"
text = "الله يخرب بيت الواسطة , هي مبوظة الدنيا , حيث ممكن تلاقي واحد معاه تجارة وعاطل من خمس سنين , وفي نفس الوقت واحد لسه متخرج ويتعين , يعني طظ في المبادي والاخلاق والمساواة والحق في الوظيفة للجميع, وليس لاقارب فلان او بفلوس, ديه بلد وسخة وعايزة الحرق , وانشاء الله عن قريب الثورة تقوم وننتقم من العميل العجوز مبارك وابنه الشاذ جمال برايز .<br />تحياتي ليك يا فارس وانا معاك و8 مليون عاطل في البلد القذرة ديه معاك."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010557/http://masr.20at.com:80/article.php?sid=1345"

[[comments]]
order = 4
subject = "الموضوع كبير يا مطحون"
author = "فارس_fr"
posted = "2006-12-24"
text = "عزيزى المواطن مطحون , صحيح انا ملقتش الفرصة فى مصر للعمل وبيتهيالى مش هلاقيها بالطرق الشريفة ولا بعد 20سنة ,, ولكن انا ولله الحمد اعمل فى احد دول الخليج ,, ونفسي انى ارجع بلدى وافيدها انا وغيري من كفاءات خرجت طفشانه من البلد من الاستبداد والظلم اللى استشرى فيها,, واوجه كلمة للناس اللى مش عارفه قيمة مصر كويس انهم لو جربوا الغربة هيتمنوا التراب اللى مصر ,, اه يا بلد والله يا مطحون الموضوع كبير والهم تقيل وربنا موجود ينقذنا من الظلم والفساد<br />ولك تحياتى على ارائك الممتازة"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010557/http://masr.20at.com:80/article.php?sid=1345"

[[comments]]
order = 5
subject = "لايرى"
author = "حسااااام"
posted = "2006-12-25"
text = "الراجل دة بيصحة الصبح الخادمة الفلبينية تجيبلة عصير البرتقال يدخل الجاكوزى ياخد الدش التمام يدخل غرفة البدل المستوردة من أيطاليا (((أصلة بيحب البدل ألايطالى))) ينزل العربية المرسيدس المصفحة البلازما قدامة يتفرج على اخر تقارير ألانجازات الزجاج مغلق على خلفية سارينة سيارات التأمين الخاصة بسيادتة ليس مضطر كباقى مخاليق ربنا يستنى المواصلات وتلاقية اساساً لايعرف معناها أو ممكن يكون شاف صورها فى أحد الملفات الطرق مغلقة أو خالية كما يتوهم سيادتة يصل الى مجلس الوزراء يباشر أعماله الجبارة ولا يرانا لايعلم عنا أى شىء لا يرى محدود الدخل الا فى الملفات"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010557/http://masr.20at.com:80/article.php?sid=1345"
