[[comments]]
order = 1
subject = "حضارة متأخرة"
author = "أيمن أبومصطفى"
posted = "2006-06-13"
text = "حضارة متأخرة<br />مضت السنون سريعة الجريان لاخير في الإذعـــــان للطغيانِ ِ.<br />أيقودنا أهل السفاهة للــــردى فنعيش في القبلات والأحضان ِ.<br />وبزعمهم أن الحضارة هـــكذا كـلا ورب الـطــور والـفـرقــان ِ.<br />فترى الشباب تحطمت آمالهم حتى غدوا من عصبة الشيطانِ ِ.<br />لافرق بين محمد أو جرجسَ هما في الخلاعة والهوى مثلان ِ.<br />وبناتنا بعد الغــفـاف بــــديننا بِـعْـنَ الـحَيَـــــاءَ بأزهدِ الأثمان ِ"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010143/http://masr.20at.com:80/article.php?sid=507"

