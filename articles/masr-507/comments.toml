[[comments]]
order = 9
subject = "مولد وصاحبه غااااااااايب"
author = "صبرني يارب"
posted = "2006-06-17"
text = "يعنى هى جات على المترو يا ستى انظر حولك انا عموما ما عنديش مترو فى بلدنا الحمد لله بس باركب تاكسيات وكل مااركب اتشاكل مع السواق مره عايز يركب معايا 3 وانا نبقى اربعه عشان يعنى يسترزق يا ابنى ما انا هاديك اجرة المشوار لا بس عشان الناس الي مش لاقيه تركب طب يا بابا تركبهم فوقى؟؟؟؟ ومره واحده يقف فى وسط شارع مزدحم جدااااا ويقف علىالشمال وعايزنى انزل ويقولى ما يهمكيش يا ابله كأنى خايفه على بابا عربيته مش خايفه على عمرى ومره تانيه عشان بتاع التاكسي بيقولي فيها ايه لما امشى مخالف فىالشارع يعنى هو مين بيمشي صح وبعدين مالها المواصلات ماهى فل الفل اهي<br />انظر حولك يا سيدى امصال الفراخ اتاخرت وجت بايظه والفراخ الى فى البلد ماتت كلها واصحابها ولعوا واحنا معاهم<br />صاحب العباره كلفت القصه وبقت زى الفل<br />شرم الشيخ بتتباع المتر ب خمسه جينه والى ما يشترى يتفرج<br />تمثليات بتتعمل على قفانا طول النهار من التنميه والاقتصاد الحر والديموقراطيه ويل يا ويل<br />البورصه بتتضرب لحساب البهوات ويلموا فلوس المضاربين الصغيرين الغلابه ويقولوا واحنا مالنا ما انتم الى بعتم وانتم الى اشتريتم<br />والبلد بايعاناااااااااااا بندفع دم قلبنا لشركات الجوال اغلى من اى بلد عشان الحكومه اتفقت مع الشركات دى على مص دم الشعب<br />انظر حول يااخى تلاقى مولد وصاحبه غايب وتلاقى الطوفان وكل من السلطه شايل على كتفه مقطف وبيقول شيل عبى خلص قبل ما تتهد على دماغنا خليها تتهد على دماغ الشعب وعلى راي محمد صبحى قنبله ؟؟؟ ارميها على الشعب ارميها على الشعب<br />المتسولون والباعه الجائلين نتيجه طبيعيه لفساد مجتمع كامل من اول حكومته لافراده لمثقفينه الخرساء لاطفاله الى اهاليهم بطلوا يربوهم وبقى اهم من تربيتهم تأمين موبايل لكل عيل عشان يبقى يطمن عليه وهو<br />اقرأ بقية التعليق .."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906101336/http://masr.20at.com:80/article.php?sid=507&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "]دي ناس غلابه"
author = "شقيان"
posted = "2006-06-18"
text = "اللي حضرتك مش عارفاه إن الحكومه دايما بتعمل على مصلحة هذه الفئة الكادحة من الشعب وبتشجعهم وبتساعدهم لأنها ببساطة بتشجع المشروعات الصغيرة اللي منها<br />1- بياع الخضار اللي واقف في نص الشارع وسدادد الطريق وحمارة مالي الأرض تحته \"لا مؤاخذه خـــرى\" وما حدش عارف يكلمه ولو تجرأتي وكلمتيه زي ما عملتي مع العساكر ساعتها هو اللي هيطلب لك البوليس.<br />2- بياعين الأنابيب والعيش والسكر .... اللي ممكن يمنعوا السلع المهمة دي عشان بعد كده يغلوا اسعارها أو يبيعوها في السوق السودا زي تذاكر الدورة الأفريقية.<br />3- عربيات شغالة بدون نمر ومكسره وهلكانه وسايقها بلطجي أو مسجل خطر كل دا مش مهم دي مسؤولية اللي يركب معاهم.... !!! وفوق كده الحكومة مش بترضى تدفعهم ضرايب غير الفرده بتاعة الأمناء اللي بيقابلوهم وكمان سايباهم ياكلوا عيش ويخنقونا بالدخان الاسود اللي طالع من المواتير المفوته<br />أخيرا الكلام دا مش إشاعه ولا هزار ..وده حصل معايا شخصيا عندما توصلت عن طريق الصدفة لواسطة كبيره جدا في وزارة البيئة وأنا باحكي لأحد أصدقائي عن تضرري الشديد من المطعم الشيك قوى أسفل عمارتنا ووقعت في عرض هذا المسئول وقلت النهارده بس أقدر أنام من غير دخان وأصحى من غير ما اسمع صوت مفرمة الطعمية ولا ريحة الممبار المتعفن جدا ... المهم رد علي المسؤول وقال لي أنا ممكن أهوشه ودي ممكن أنا أتئذي فيها لأنه بصراحة دا مشروع صغير والحكومه بتشجع على المشروعات الصغيرة ومانعه منعا باتا إن أيا منها يتقفل ولو ليوم واحد<br />بصراحة الحكومه معاها حق!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!1"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906101336/http://masr.20at.com:80/article.php?sid=507&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

