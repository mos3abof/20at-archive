subject = "ميه ميه"
author = "MIDO"
posted = "2006-10-02"
text = "والله انتى ميه ميه على الموضوع ده<br />انا هجرب الطريقه دى ان شاء الله<br />ســــــــــــــــلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114858/http://www.20at.com/article2.php?sid=1297"

[[comments]]
order = 4
subject = "شاي يقصر العمر"
author = "الله يا هايدي ..بس عايزة اقول حاجة ..الشاي الاخضر طعمه وحش جدا جدا..مش عارفة بيطيقوه ازاي"
posted = "2006-10-02"
text = "المشكلة الأكبر انك قلتي<br />أجرى باحثون في اليابان دراسة شملت أكثر من 40 ألف رجل وامرأة، وجدت أن الذين يواظبون على تناول عدد كبير من أكواب الشاي الأخضر يعيشون عمرا أطول!<br />فالشاي الأخضر يحتوي على مادة البوليفينول، والتي لها فائدتها في إطالة العمر!!!!<br />عمر ايه اللي هيطول يا هايدي دول ناس معندهمش عبارات بتغرق و لا اتوبيسات بتتقلب ولا مسارح بتتحرق ولا بيخطفوا اولادهم علشان يسرقوا اعضاؤهم ..ولا عندهم فشل كلوي من الميه الملوثة و لا سرطان من المبيدات على الاكل ولا فيروس سي لا مؤاخذة ..ولا ضغط دم من الغلب و الهم و لاسكر ومش لاقيين الانسولين ..ياختي متقلبيش علينا المواجع ...<br />اشربوا الشاي الأحمر..أهو أحسن علشا بيقصر العمر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114858/http://www.20at.com/article2.php?sid=1297"
