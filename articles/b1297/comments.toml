[[comments]]
order = 0
subject = "كان بودى يا هايدى"
author = "نيفين نيفى نوفا"
posted = "2006-10-01"
text = "مش عايزه اكسفك يا هايدى بس مليش تقل على الشاى<br />انا يا ستى من حزب القهوه<br />بس مفيش مانع نجرب<br />نتكلم جد بقى<br />الموضوع جميل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114858/http://www.20at.com/article2.php?sid=1297"

[[comments]]
order = 1
subject = "الشاي المغربي"
author = "صفاء"
posted = "2006-10-01"
text = "احب اقدم طريقة صنع الشاء المغربي لمن يريد ان يجرب اولا نسخن الماء حتي الغليان ناخد الابريق البواد باللغة المغربية وتضع فية الشاي ملعقة كبيرة تم النعناع بعد ان نكون قد نضفناه جيدا تم السكر بحسب الدوق ونصب الماء الساخن ونتركة فوق النار مدة دقيقة وبالصحة والعافية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114858/http://www.20at.com/article2.php?sid=1297"

