author = "شاهندة"
posted = "2009-07-01"
text = "احب اعلق اولا على البوم انغام لانه حلو جدا وبجد تستمع بفن راقى وجميل وانت بتسمعه<br />فعلا ابداع فى الكلمات والالحان والتوزيع والالات الموسيقية المستخدمة<br />فعلا البوم خارج المنافسة ويرفع شعار :للسميعة فقط<br />ثانيا البوم عمرو دياب حلو ويليق بالشباب وفىه اغانى حلوة واحلى اغنية عجبتنى :يهمك فى ايه ووحياتى خليكى وكله الا حبيبى<br />البوم تامر ناوية انى ماسمعوش اصلا لان البنى ادم بينرفزنى والهليلة اللى معموله عليه فعلا تنرفز<br />البوم شرين لسه مانزلش بس اكيد لما ينزل هسمعه لانى بحب صوتها وكمان بحب اختياراتها لاغانيها<br />البومات الممثلات دلع ماسخ ماعدا البوم بشرى لان فعلا صوتها جميل جدا"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010010142/http://www.20at.com:80/masr/review/12345--t-.html"

