text = "كلمة أخيرة لتشمورة………………<br />بص يا تشامر :<br />إنسى إنك توصل للى وصل إليه الهضبة , بجد دة مستحيل…<br />بل مستحيل أصلاً إنك توصل حتى إنك تنافسه….<br />نصيحتى ليك :<br />دوٌر على حد قدك كدة لسه بيشق طريقه ونافسه يا تشمورة…………"
