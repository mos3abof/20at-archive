[[comments]]
order = 1
subject = "الوقت ثمين"
author = "نوالمعزو"
posted = "2006-02-03"
text = "بسم الله الرحمان الرحيم والصلاة والسلام على حبيبنا وقرة اعيننا سيدنا محمد وعلى اله وصحبه وسلم تسليما وبعد فان الوقت من اثمن الاشياء في حياة المرء وادا دهبت منا دقائقه ولحضاته فلا يمكن لها ان تعود لهدا يجب على المرا ان يستغله في ما يرضي الرحمان وفي ما ينفعه وينفع دينه ولايجب علينا هدره في التفاهات التي لاتجلب انا من ورائها غير الحسرة والندم حتى ادا ما افقنا من غفلتنا وندمنا فلا ينفعنا الندم حينها ولا تنفعنا الحسرة والسلام عليكم ورحمة الله وبركاته اختكم في الله نوال من المغرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150942/http://www.20at.com/article2.php?sid=211"
