subject = "أصلنا شعب الربع ساعة الأخيرة"
author = "شرقاوي"
posted = "2006-01-07"
text = "أصلنا شعب الربع ساعة الأخيرة ، غالباً ما بنستهتر بالوقت و نضيعوا يمين و شمال و نؤجل كل شئ لبكرة و غالباً ما يصح مثل ( خط بكرة بور )."
archived = "2006-11-02"
