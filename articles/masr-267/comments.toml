[[comments]]
order = 11
subject = "مبارك فى سطور"
author = "شريف محمد وطنى"
posted = "2006-05-19"
text = "عندما يعبراحد عن رايه هذا لايعنى انه يتسم للوصول الى هدف ولاكن من المفروض ان ياخز كل فرد احتراما ليس لكونه بالحكومه او خارجها نحن لانر ان الرئس اهان احد او اهان شعبه حتى لو كان هناك من يطلب حق ضائع فالاحسن ان نحسن التعبير لمطلبته<br />وانا الان اعبر عن ما وجد فى مصر من تعبيرات صادقه فى عيد ميلاد السيد الرئيس<br />مبارك فى سطور<br />تقدم شعب مصر مسلميه واقباطه يهنئون الرئيس بعيد مولده<br />ليس لكونه رئيس لهم فقط ولكن لرجل يحافظ على امن وسلاامه بلاده<br />رجل يحافظ على عزتهم وكرامتهم يهتم دائمابالاصلاح على خط مستقيم<br />لتحتفظ بلاده بشموخها .<br />وخلفه حكومه قويه تسعى لتحقيق اهدافه وبرنامجه الطموح<br />وها نحن اليوم نقول لرئيس يحب شعبه وشعبه يحبه<br />( كل عام وانت بخير يا مبارك)."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222701/http://masr.20at.com:80/article.php?sid=267&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
