[[comments]]
order = 1
subject = "هو في ريس تاني"
author = "بن الكفر"
posted = "2006-05-03"
text = "اول مرة اعرف من اخبار اليوم دلوقتي ان في ريس تاني بيحتفل مع الريس بتاعنا بعيد ميلادة بس الاسامي بتات المشاريع دي مش غريبة عليا على العموم اكيد الاخبار يقصدوا ريس غير حسني وبلد غير مصر ومشروعات غير المشروعات ومش عايز اي بني ادم يقولي باسم المصرين علشان مش بحب حد يتكلم باسمي ومتعلمتش اعيش منافق ومش انا كلب الحكومة ومستني منها عضمة علشا كدة بمجد في اوطي خلق الله"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222701/http://masr.20at.com:80/article.php?sid=267&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "ارحمونا"
author = "مواطن والله ما عارف يرجع بلده"
posted = "2006-05-04"
text = "يا ريس عندى تعليق بسيط دلوقتى الفلسطنيين عايشين على امل ان فلسطين ترجع لهم وبيستنوا اليوم ده وبيحلموا بكده مشكلتنا ان احنا المصريين مش عارفين نحلم زيهم لبلدنا ترجع لنا من الحراميه والقوادين والكلاب طب نعمل ايه عجبى<br />مجبر عليك يا صبح مغصوب عليك يا ليل لاجيت الدنيا بمزاجى ولكان لي فيها ميل"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222701/http://masr.20at.com:80/article.php?sid=267&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "ذئاب الجبل"
author = "مجدى اليمانى"
posted = "2006-05-04"
text = "مكن اعرف قراء ولاد البلد زعلانين ليه من عمو اسامه سرايا احنا اتفقنا ان فى مصران مش مصر واحده والراجل بيبعت تحيات مصر بتاعته هو وامثاله مش مصر بتاعتنا احنا يبقى الموضوع ما يخصناش وهو ليه حريه الرائ والتعبير لكن احنا هنا مصر بتاعتنا من مصر المحروسه الى مصر المخروسه من مصر زكريا عبد العزيز والبسطويسى ومكى الى مصر احمد عز وسمير رجب والشاذلى ونافع نقول لهم استعدو فالطوفان ات لامحاله وزى ما قال على الحجار فى ذئاب الجبل 0ولابد من يوم معلوم تترد فيه المظالم ابيض على كل مظلوم اسود على كل ظالم 00فالى ذلك اليوم واعتقد انه قرب قوى قوى قوى قوى قوقوقوق ق ق ق الحقوووووووونى"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222701/http://masr.20at.com:80/article.php?sid=267&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

