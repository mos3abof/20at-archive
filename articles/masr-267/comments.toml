[[comments]]
order = 9
subject = "لكل بداية ......."
author = "توتى"
posted = "2006-05-10"
text = "لكل بداية نهاية ... فقط عليكم جميا بالصبر و الدعاء ... و ربنا يحفظ مصر فالخوف كل الخوف مما سيحدث عندما يتصارع الطامعين فى الحكم من بعده و خصوصا انه لا نائب له .<br />و الشعب لن يرضى بالتوريث !!!<br />الصورة قاتمة و مخيفة !!!<br />اللهم انشر رحمتك على العباد و عجل بالفرج يا ارحم الراحمين ."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222701/http://masr.20at.com:80/article.php?sid=267&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

