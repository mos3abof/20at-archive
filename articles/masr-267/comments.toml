[[comments]]
order = 5
subject = "نفااااااااق"
author = "مصرية"
posted = "2006-05-05"
text = "كفاية نفاق ياعالم معدش فيه ورا تجيبونا فيه اكتر من اللى احنا فيه يوم الحساب بيقرب وكل منافق وكاذب ووصوللى وانتهازى ان شاء الله حيكون له مكانه عظيمه فى مذبلة التاريخ مع رئيس العصابة والفضيحة حتبقى كبيرة على قد اعمالكم السودة سودتم عيشتنا الله يسود وجوهكم اكتر مماهى يودة من اعمالكم لاعندكم دم ولا كرامة ولا اخلاق ولا دين غوروا فى داهيه وريحونامن بلاويكم كان يوم اسود ومنيل بستين نيلة يوم ماجيت فى الدنيا اللهم اجعلها آخر الأحزان"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222701/http://masr.20at.com:80/article.php?sid=267&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "من مصرى"
author = "مصرى"
posted = "2006-05-07"
text = "ها أقوله فى عيد ميلاده أيه هو يعنى ناقص إللى أنا ها أقولهوله لاكن برضوا هاقوله قاعد ليه على كرسى مش بتاعك الكرسى ده بتاع حاكم شريف علشان يرعى مصالح المصريين زى لما الدستور قال وقال كمان أن الحاكم ييجى بالإنتخاب وإنت لم تنتخب من الشعب وكمان زورت الإنتخابات علشان تفضل قاعد وهاقوله كمان إللى قاله الزعيم احمد عرابى لقد خلقنا الله أحراراً ولن نورث بعد اليوم وإن شاء الله عيد ميلادك هايكون آخر أحزان مصر"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222701/http://masr.20at.com:80/article.php?sid=267&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

