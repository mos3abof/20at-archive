subject = "فى اى احد سبب له ضرر"
author = "محلاوى"
posted = "2008-10-16"
text = "بسم الله - اولا احب اعرفكم ان الشيخ على من نفس قريتى القيصرية بمدينة المحلة الكبرى - منذ صغرنا و نحن كاطفال نذهب وراء الشيخ على اللى كان بيسعدنابعوده لما كان اى احد يدعوه للجلوس معاه سواء فى المحلات الموجوده بالشارع الرئيسى بالقرية - او فى المقاهى - يعنى راجل عادى و لم يسبب لاى احد ازى - بل بالعكس لما كان بيشجع فى المحلة و كان اى احد بيقصده فى خدمة ما كان بيتاخر - طبعا لان عنده معارف كتيرة - بس هى دى العاده دائما نسب الناجح و نحاول نشوه صورته - معلش الزى - طيب يا جماعة الزى ده لابسة من اول ما غنى - و احنا عارفين ان كتيير من المداحيين الزى ده منتشر عندهم - معلش برده - عم على عمل ايه الزى بيسىء للازهر نغيرة - و لو ان الازهر بقوه مكنش فكر ان على قصد او لم يقصد يهز صورته - طيب بيشجع فرق تانيه طيب لو مصر بتلعب مع بلد تانى بيشجع مين - طيب لو عرب بيلعبوا مع اجنبى بيشجع مين و لو افريقى مع فرق تانية بيشجع مين - على فكرة بقى انا مبحبش الكرة - سلام"
archived = "2008-12-28"
