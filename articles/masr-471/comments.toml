posted = "2006-11-02"
text = "رغبه واحتياج وربمااستهواء للتعبير عن انبهار الشاب بمقومات الفتاه هذا عن المعاكسه العينيه اما معاكسه التكنولوجيا ووسائل الاتصال فنها تعتبر مثلها ولكن لها ابعاد سيكلوجيه اخرى فمن الممكن ان ترى زوجه محرومه تستمتع مع شاب عن طريق التليفون او فتاه مضطهده تلبى احتياجاتها فى استخفاء عن طريق الاتصال وفى النهايه كلها مساله عقيده واعتتقاء وعادات وتقاليد تحكم كل شخص فى افعاله"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117210213/http://masr.20at.com:80/article.php?sid=471&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
