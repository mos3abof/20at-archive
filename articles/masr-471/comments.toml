subject = "لغو"
author = "Theocrat"
posted = "2006-06-07"
text = "الموضوع سيء جدا؛ لأنه لا يعترف بان معاكسة بنات الناس - أخواتنا المسلمات - شيء قبيح، بل و يربطه بالحميمية والألفة المصرية. أيضا استخدام ألفاظ قمة في التدني بدل من ان ينصح من يفعل ذلك بأن يتوب إلى، فإن لم يكن خوفا من، فليكن خوفا على اخته أو أهله<br />قال رسول الله(ص): \"الدين لا ينسى و الديان لا يموت اعمل ما شئت فكما تدين تدان\"."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170841/http://masr.20at.com:80/article.php?sid=471&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

