subject = "سلوك مش حضاري"
author = "dido"
posted = "2006-06-11"
text = "المعاكسة تصرف غير حضاري خالص و معظم الشباب بيفتكروا ان دمهم بيبقى خفيف بيها لكن ميعرفوش نظره الناس ليها بيكون ايه....<br />بتكون كانها اعلان عن شاب مكبوت مش شيك و لا بيتصرف بزوق مع البنات ...<br />كوني مصرية مش عايشه في مصر بشوف الصراحة بلاقي اسلوب المصريين في المعاكسة مش ظريف خالص و بيظهرهم بطريقة و بشكل وحش جدا كونهم الجنسية الوحيد تقريبا اللي بتكتر اوي العيار بتاع المعاكسة لاي بنت او سيدة و ممكن الواحد يكون بيشتغل و يسيب شغله و يحدف كلمتين و يكمل كانها واجب"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170841/http://masr.20at.com:80/article.php?sid=471&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

