author = "بسم الله ما شاء الله"
posted = "2009-07-27"
text = "والله العظيم انا مش عارف افرح ولا احزن بس الموضوع مهم جدا لان هنا الواحد هيبتدى يفكر يا ترى يا هلترى الولد ده هيكون مصيره ايه؟؟؟؟؟؟<br />انا شايف ان مهند علاء الفروض يعنى انه هيبقى حاجه جميله اوى ان شاء الرحمن بس دا طبعا لو اتنفذ شويه حاجات وانا اشك كل الشك ان ربعها هيتعمل اصلا زيه زى غيره واعيدها تانى زيه زى غيره ودا لاسف !!!!!!!!!!!!!!! !!!<br />يارب يارب يارب يا علاء تحظى باهتمام المسئولين ويكون ليك شان كبير فى المستقبل لاننا محتاجين اللى زيك كتير علشان ربنا اللى يعلم بالايام اللى احنا داخلين عليها<br />واخر حاجه علشان ابقى خلصت ضميرى قدام ربنا علشان يمكن لو مسئول او ابن مسئول او مراه مسئول شافت الكومنت دا تبلغه يعنى (((( اتقوووووووو الله فى عملكم )))) علشان ربنا شايف كل حاجه<br />وبقول للكاتبه علياء ابو شهبه موضوعك فوق الرائع وان شاء الله ربنا هيجازيكى خير عليه<br />وانا والدى صحفى ومهتم بالمواضيع دى جدا فلو يهمك المشاركه ياريت تردى على ايميلى sweet_love_alh@ yahoo.com<br />ان شاء الله مستنى ردك على خير"
