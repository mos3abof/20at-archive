author = "ممدوح زكى زخارى جرجس"
posted = "2009-08-13"
text = "رمضان كريم<br />بعد الغاء موائد الحمن بسبب الخوف من\"انفلونزا الخنازير\"؟<br />لماذا لا يتم عمل حقائب صغيرة تسمى \"وجبة الرحمن\"<br />عبارة عن عبوة مشروب لقمر الدين<br />5 تمرات<br />سندوتش دجاج؟ او لحم؟ او سمك<br />تفاحة او قطعة كنافة<br />و (كل عام و انتم بخير)<br />و رمضان دائما\"كريم\""
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814235856/http://www.20at.com:80/masr/2khbar/12924-2009-08-13-07-41-51.html"

[[comments]]
order = 1
subject = ""
author = "اذن فليسرقوا"
posted = "2009-08-13"
text = "موائد الرحمن تجعل بعض الفقراء واولادهم يتذوقوا اللحم فى رمضان<br />لو حرمتوهم من الموائد<br />كيف يتصرفون ؟<br />اليس من حقهم ان يسرقوا لياكلوا<br />ومن حقهم ايضا ان يخطفوا ويهجموا وينالوا حقهم بالقوة من الاغنياء<br />ماذا يريدون ان يفعلوا بالفقراء ؟"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814235856/http://www.20at.com:80/masr/2khbar/12924-2009-08-13-07-41-51.html"

[[comments]]
order = 2
subject = ""
author = "هو الموضوع اكل"
posted = "2009-08-14"
text = "موائد الرحمن هى لعابرى السبيل بمعنى واحد فى الشارع بعيد عن بيتة لسبب ما كان يكون عسكرى مرور او واحد كان قادم من مكان بعيد للشراء وقضاء مصلحة ثم زنقة الوقت ودخل علية المغرب فيجب على القادرين عمل افطار لهؤلاء الناس<br />زمان كان الكمسرى فى الاتوبيس والقطار يوزع بلح تمر على الركاب حينما ياتى المغرب وهم فى سفر<br />اما ان تتحول موائد الرحمن الى اماكن للاكل البلوشى فهذا غير مطلوب ووجب التبرع بثمنها لشراء ملايات سرير لمستشفى حكومى يضطر المرضى الغلابة لاحضار ملايات سرير من بيوتهم<br />كفانا مظاهر تدين كدابة من قادرين اغتنوا بسرقة الناس واحتكارهم<br />خلوا واحد قادر يتبرع بخمسين تختة يجلس عليها الاطفال فى مدارس يجلس فيها الاطفال على الارض"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814235856/http://www.20at.com:80/masr/2khbar/12924-2009-08-13-07-41-51.html"
