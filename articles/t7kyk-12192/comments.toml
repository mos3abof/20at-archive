subject = ""
author = "مش لاوى بوزى"
posted = "2009-05-27"
text = "خلاص الناس اللى يتسمع لهم اتنفوا لزمن تانى واللا ايه مفيش غير واحدة كل شغلتها تهز وسطها وتلعب بباقى جسمها والناس التافهه يريلو عليها والله يا زمن احنا بإدينا اللى عايزه قطعها اللى عملنا لهم قيمة"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527212442/http://www.20at.com:80/t7kyk/12192-2009-05-26-10-27-53.html"

[[comments]]
