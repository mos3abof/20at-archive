[[comments]]
order = 2
subject = ""
author = "نصائح من الساقطات"
posted = "2009-05-26"
text = "هيا خلاص يا ست دعاء - الست المصرية هتتبع نصائح الننانات اللى كل اسبوع مع زوج جديد وروائح فضائحهم تزكم الاناف<br />نصائح الساقطات لا احد يلتفت اليها<br />السيدة المصرية المجهدة فى العمل وشغل البيت وتربية الاولاد سعادتها الكبرى لما تبص فى وش عيالها وزوجها وتلاقيهم مبسوطين وكويسين وتقعد فى وسط مملكتها - تعبانة نعم لكن راضية<br />واذ زوجها هزر معاها شوية خارج المؤلوف هتلاقيها زمجرت وتشخط فية وتقول لة اتلم يا رجل انت - انت عايز تتسلى والا اية<br />اما البوس عندها فدة قلة ادب اذا كان عندها عيال اما اذا كانت عروسة فمسموح بالبوس فى السنة الاولى فقط<br />هيفاء اية<br />الم تسمعى عن الصعيدى الذى لم يبوس زوجتة ابدا طوال عشرين سنة فى السرير - لية - لانة ساعتها بيبقى حاطط ديل الجلابية بتاعتة فى بقة"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527212442/http://www.20at.com:80/t7kyk/12192-2009-05-26-10-27-53.html"

[[comments]]
