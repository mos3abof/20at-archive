subject = ""
author = "~~~~M~~~~~"
posted = "2009-05-29"
text = "نتكلم بصراحه اولا ربنا لما خلقنا كلنا خلقنا بشكل كويس<br />\"خلقكم فأحسن صوركم\"<br />طبعا اذا كنا بنتكلم على هيفاء فسواء ده جمال طبيعي او مش طبيعي ربنا لما بيدي حد حاجه حلوة المفروض انه يشكره عليها سواء شكل او غيره فياترى هي لو جمالها طبيعي هي كده بتشكر ربنا على نعمته؟؟<br />طبعا انا عارفه ان الموضوع هو فقط للسخريه بس بجد يعني فعلا هو في حد لاقي 11 ساعه عشان ينام وهيقول لا<br />ولا يعني نص بنات مصر بيشربوا سجاير<br />فعلا نصايح مفيده هههههههه"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530135657/http://www.20at.com:80/2khbar/12192-2009-05-26-10-27-53.html"

[[comments]]
order = 5
subject = ""
author = "ا سلام"
posted = "2009-05-29"
text = "مات الغناء فى مصر<br />دلوقتى المغنية بتغنى بهز صدرها ومؤخرتها<br />الاخت هيفاء بتقول بوس الواوا<br />وفتحت كل قواميس الكرة الارضية ابحث عن معنى كلمة واوا<br />وقال القاموس البرتغالى ان معنى كلمة واوا معناها المريضة او الموجوعة وزمان قالت بعض الاغانى<br />الكوكو واوا - الكوكو واوا - الكوكو واوا<br />الا ان بعض المدردحين شرح لى معنى كلمات هيفاء بتاع بوس الواوا او الحس الواوا ان معناها كلابى قوى ومعناها قبيح —- وسمعت ان اما فى حى شعبى ضربت ابنها علقة مبرحة وهو ابن السادسة من عمرة لانة كان بيغنى بصوت عال وراء التليفزيون بوس الواوا<br />فكلمة الواوا عند اهلنا بتوع الاحياء الشعبية كلمة عيب يعاقب عليها القانون ب 6 شهور سجن"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530135657/http://www.20at.com:80/2khbar/12192-2009-05-26-10-27-53.html"

