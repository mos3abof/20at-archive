subject = ""
author = "ابومحسن غربىة 27 سنه"
posted = "2009-05-26"
text = "النبي محمد صلى الله عليه وسلم استوصى بالنساء خيره<br />واخد جملة قالها النبي صلى الله عليه وسلم وهو على فراش الموت (اذا صحت الرواية)<br />الصلاة وما ملكت ايمانكم<br />حاضر يا رسول الله<br />بأبي انت وامي يا رسول الله<br />ساحفظ وصيتك"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527212442/http://www.20at.com:80/t7kyk/12192-2009-05-26-10-27-53.html"

