subject = ""
author = "شكرا لرجال المرور"
posted = "2009-07-30"
text = "اولا شكرا لرجال المرور فى زفتى على سماحهم للسيارة بالسير بدون ترخيص على اساس انها تسير فى وسط الغيطان والحقول<br />ولو اصروا على تسجيلها فسوف يتوقف كل شىء فلا يوجد رقم شاسية ولا رقم موتور ولا اسم شركة مصنعة ولا مستخرج جمركى ولا اى شىء من الاوراق ممكن ان يوضع فى ملف<br />العملية اجتهاد ميكانيكية زفتى بدون اى تشجيع حكومى اوحتى محلى<br />واظن انهم راووا دراسة القمح اشتراها فلاح ب 16 الف جنية صناعة تركيا ودرسها الميكانيكية وانتجوا اول دراسة قمح مصرية من عشر سنوات صناعة زفتى ب 4 الاف جنية بس وكنت وقتها اعمل فى محلج قطن فى زفتى واتابع نشاطهم قبل انتقالى الى الصعيد"
archived = "2009-07-31"
capture_url = "https://web.archive.org/web/20090731232859/http://www.20at.com:80/masr/t7kyk/12798--x-.html"

[[comments]]
order = 1
subject = ""
author = "تقرير خطأ"
posted = "2009-07-30"
text = "اول بلد تم تصنيع هذة السيارة فية هى مدينة زفتى بمحافظة الغربية<br />ومحرك السيارة هو محرك طلمبة الرى 7 حصان ديزل اصلة هندى ويتم تجميعة فى مدينة المنصورة<br />والفلاحون فى زفتى يستخدمونة بدل الحمير والعربة الكارو وينقلون محاصيلهم علية ويستخدمونة طلمبة رى ايضا<br />ان هذة السيارة او العربة تمشى فى زفتى من حوالى 6 سنوات ونتشرة فى قرى مركز زفتى<br />وجميع اجزائها عدا الموتور من مخلفات السيارات القديمة وسرعتها بطئة جدا وكانها عربة كارو<br />وفى ورش زفتى يتم ايضا صناعة دراسات القمح والمقطورات الزراعية البلدى<br />للعلم بس"
archived = "2009-07-31"
capture_url = "https://web.archive.org/web/20090731232859/http://www.20at.com:80/masr/t7kyk/12798--x-.html"

[[comments]]
order = 2
subject = ""
author = "احلام ضائعة"
posted = "2009-08-01"
text = "انا من جيل العواجيز واطفال الثورة<br />كان حلم جيلى بناء صناعة قوية فى مصر<br />وكان استاذ الهندسة عزيز صدقى يبنى المصانع ومن بينها مصنع النصر للسيارات<br />اذكر انة قال فى محاضرة فى كلية الهندسة فى اسكندرية قال مصنع النصر للسيارات فى حلوان هو مصنع تجميع لمكونات السيارة لتشحيع الصناعات الصغيرة - كيف ؟<br />يعنى مصرى يعمل مشروع لانتاج البطارية ويورد الى النصر للسيارات ومصرى اخر يصنع المقاعد وكراسى السيارة ويوردها ومصرى يفتتح مشروع لانتاج زجاج السيارات واخر صندوق التروس او الفتيس وكذلك الانوار<br />كان مشروع مصنع النصر للسيارات هو التجميع وتشجيع الصناعات الصغيرة على الانتشار<br />وبدا بتجميع اجزاء من ايطاليا اللى هى الفيات<br />ولكن تم بيع مصنع النصر للسيارات واستمر تقدم الهند<br />وماتت الصناعة فى مصر"
archived = "2009-08-03"
capture_url = "https://web.archive.org/web/20090803195937/http://www.20at.com:80/masr/t7kyk/12798--x-.html"

[[comments]]
