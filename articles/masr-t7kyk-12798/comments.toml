subject = ""
author = "الهند تتقدم"
posted = "2009-08-06"
text = "حال التعليم فى مصر مبكى<br />اخر الاحصائيات بتقول ان 80 % من الطلاب بيدرسوا ادبى جغرافيا وعلم نفس وفلسفة واجتماع<br />اما العلوم والكيمياء والطب والزراعة والهندسة والتكنولوجيا والعلوم التطبيقية فحوالى 20 %<br />يعنى بنجيب لوراء جامد زى ايام الاحتلال لتخريج كتبة وموظفين<br />زمان كان العكس كلة علمى واقلية ادبى ايام ناصر<br />يبقى هنروح فى ستين داهية<br />بنصرف فلوس التعليم على عشرات الالاف لطلاب بيدرسوا فلسفة واجتماع"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223201536/http://www.20at.com:80/masr/hot-topics/12798--x-.html"

