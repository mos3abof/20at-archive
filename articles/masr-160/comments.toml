[[comments]]
order = 10
subject = "وحدووووه"
author = "كريم الشناوى"
posted = "2006-04-14"
text = "أولا انا لا انتمى لا للإخوان و لا لغيرهم... و لكن ما جاء من تعليقات على الموضوع... رفعلى الضغط.... و لى عدة تعليقات :-<br />1 - اخطأ محرر الصفحة عندما كتب أن الشباب الموجود فى التحقيق \" غير مسيس \" و ربما جاء هذا التعبير سهوا منه و لكن...<br />موضوع اسمه \" ضد الإخوان \" عاوزين مين يقول رأيه... البنا الله يرحمه و لا الهضيبى .<br />2 - ارى انه من غير اللائق ان يتهم كاتب احد التعليقات كاتب تعليق اخر \" بقدر كاف من الضحالة الفكرية فى السياسة والتاريخ والقانون \" عشان قال إن تاريخ الإخوان دموى... يا سيدى الإخوان حاليا تنظيم مدنى جميل و كل حاجة... و لكن هذا لا ينفى الحقائق التاريخية حول \" التنظبم السرى \" للإخوان .. و اللى كان ليه طابع دموى .<br />3- بالنسبة للتعقيب اللى اتكلم عن الشباب السطحى اللى بيتفرج على الأولى و التانية و يقرا الأهرام و الأخبار.. يا سيدى الشباب ده مبيقراش حتى الأهرام و الأخبار ..وشباب وحش بيتفرج على ميلودى او برامج الأغانى فى التانية,,, بس ده حال معظم الناس و غالبية الشباب - مش كلهم - بيفكروا كده ....و لو ان الأراء مش مسطحة أوى كده يعنى.<br />و بالمناسبة ... بيرناردشو لهاف الدورى الإنجليزى .<br />4 - أرجو من مسئول الصفحة حذف كلمة \" جتكو القرف \" من التعليق الذى عنوانه \" صباح الصدق \" ... و حتى يتم حذف التعليق او تحسبا إنو ميتحذفش فاحب اقول ... يا سيدى انت هتقرفنا ليه... انت اللى جتك ستين قرف...<br />و نهاية يجب القول أن الإخوان من أهم و أقوى التيارات السياسية فى مصر - رغم اختلافى معهم - و لكن يجب أن يقدموا إجابات واضحة حول برنامجهم و مواقفهم من بعض القضايا كمفهوم المواطنة ... فالإخوان فازوا ب88 مقعد عشان كوادرهم ناس محترمة... لكن برضه عشان الناس زهقت من حرامية الحكومة و برضو<br />اقرأ بقية التعليق .."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 11
subject = "مزعلين نفسكم ليه"
author = "احمد"
posted = "2006-04-15"
text = "مزعلين نفسكم ليه يا جماعه الموضوع وما فيه عايز تشوف بلدك ايه ممكن يحصلها اذا الاخوان مسكوها شوف الي هايحصل في فلسطين من الحكومه الجديده \" مايسمى بحكومه حماس \" شوف الازدهار الي هتكون فيه فلسطين في خلال الفتره الجايه .<br />اما بالنسبه للموضوع الي اتكتب فهو نقض للاخوان وليس في محله مع احترامي لكاتبه لانه زي ما قالم الشباب ان الناس الي مذكورين معندهمش اي فكره او اي خلفيه عن الاخوان والناس دخلت الخطوط السياسيه الدينيه في بعضها والمشكله في ان الخطوط الدينيه دخلت في بعضها يا جماعه لازم تفرقوا بين ( الاخوان المسلمين ، اهل السنه ، الدعوه والتبليغ ، الجهاد ..... وغيرهم ) يا جماعه مصر بلد الدعوات الاسلاميه مع الاحترام لهم كلهم لكن الاخوان عايزين يجمعم بين كله بين الدين والسياسه والاجتماع والاقتصاد على اساس ديني صحيح بمنع الحرام ووضع الحلال واكيد الكل فاهم كده كويس .<br />بالنسبه للانتخابات : الانتخابات المصريه ولله الحمد انتم عارفين اد ايه كانت كويسه عن السنوات الي فاتت بس (ديل الكلب عمره ما يتعدل) والحمد لله الاخوان خدم 88مقعد وانشاء الله المرحله القادمه هتكون احسن واحسن في ظل تعديل دستوري والمبشرات موجوده خاصه بعد ما حصل تصويت في المجلس وكانم الاخوان واخدين 90% من التصويت وطبعاً عمو فتحي سرور لغى التصويت واجله لتاني يوم على ما النواب الي كانم نايمين يصحوا من نومهم ."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 12
subject = "إلي الزملاء فى عشرينات"
author = "صحفى مصري"
posted = "2006-04-16"
text = "إلي الأصدقاء الأعزاء فى موقع عشرينات .. هناك فارق كبير بين حرية الإبداع والتعبير من جهة والفوضى من جهة أخرى ، أعتقد - وأنا بالمناسبة صحفى - أن الموضوع لم يعد بشكل جيد أو فكرة التحقيق لم تكن مختمرة فى ذهن الزميل الذى نفذها فجاءت بهذا الشكل - معذرة- السطحى<br />المرجو من الزملاء فى الموقع أن يناقشوا الأفكار جيدا مع بعضهم البعض وتوضيح الرؤية بشكل جيد للصحفى وكيفية معالجة الفكرة ، حتى لا تخرج بهذا الأسلوب المهترئ وتثير هذا القدر من الغضب ممن يحبون الإخوان أو من يختلفون معهم<br />أنا أحمل الصحفى والزملاء فى الموقع سوء معالجة الفكرة وخروجها بهذه السطحية<br />وكثرة التعليقات لا تعنى تميز الموضوع لأن هناك موضوعات صحفية كثيرة قد تكون فى منتهى الهيافة والسطحية وتثير ردود فعل حادة جدا .. فهذا ليس دليلا على تميزها<br />وشكرا"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 13
subject = "تعقيب"
author = "هيثم دبور"
posted = "2006-04-16"
text = "1- أرى أن ملحوظة السيد مشرف الصفحةهي تبرأ من الموضوع لأن أبجديات الصحافة الالكترونية تنص على أن الموضوعات تعبر عن وجهة نظر كتابها و لا تعبر بالضرورة على وجهة نظر الموقع حتى أنك تجد هذه الجملة في كثير من المواقع العربية و الاجنبية بجوار جملة حقوق النشر أسفل الصفحة و هو ما يوضح أن الموقع بصفة عامة ( و ليس على موضوعات معينة ) منبرا ليبراليا يسمح باختلاف الأراء ، زاد من هذا التبرأ وصف الشباب بأنه عادي مش مسيس و كأنك تقول يا جماعة الكلام اللي جي ده كلام فارغ بتاع شوية عيال و الأخوان على عيننا و راسنا و هو ما ظهر في وصف الجماعة بـ ( المهمة) فهو رأيي شخصي أضعف الموضوع الذي تلاه ، لأن التحقيق الصحفي يشمل ظاهرة منشرة بشكل يستطيع الرأي العام إداركها ( و الأخوان كيان سياسي لا يحتاج إلى كلمة المهمة للإدراك )<br />2- الموضوع في رأيي جيد جدا استعرض أراء مجموعة من الشباب يحملون توجهات معينة و قدرا ثقافيا متفاوتا في جماعة الأخوان و قد عبروا عن رأيهم في الجماعة بما يدعم رأيي السابق بأنه كيان ظاهر للعيان لا يحتاج لكلمة المهمة كما أنهم لم يقللوا من شأنه و لم يقللوا من دوره لنضع هذا الوصف و إن كان البعض اختلف معه ، و أرى أن أراء الشباب تنوعت بين الانطباعات الشخصية و الصورة الذهنية و التحليل السياسي المستند إلى مرجعية و التحليل الإعلامي أيضاو المواقف الشخصية و هو ماأثرى الموضوع .<br />3- الأراء الخاصة بالقراء - إلا فيما ندر - لا تحتاج إلى الالتفات أو الوقوف عندها لأننا لا زلنا نتناقش بمبدأ أنا لازم أقنعك بوجهة نظر و لازم تقول آمين على أفكاري و إلا كنت شخص حقير و كائن ضحل و تناقش أفكارا تافهة بشكل تافه ."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 14
subject = "عفوا"
author = "محرر الصفحة"
posted = "2006-04-16"
text = "الإخوة المعلقين..<br />بالنسبة للملحوظة المكتوبة قبل الموضوع، فقد كان لها دلالتها.. ولها أسبابها أيضا.. وهي ما تستحق الإيضاح في التالي..<br />- موقع عشرينات ينسبه البعض لجماعة الإخوان، وهذا ليس صحيح بالمرة.. لكن هذا لا يمنع اهتمامنا بأخبار وشئون الجماعة.. فقط لأنها الطرف الإسلامي في معادلة السياسة المصرية.. وهو ما جعلني أؤكد أن الموقع لا يقف ضد الإخوان.. لكنه يحاول من خلال هذا الموضوع أن يقترب من أفكار وآراء الشباب الذين لهم فكرة ورأي خاص عن الإخوان..<br />- بالنسبة لكلمة \"غير المسيس\" فلها أيضا أهميتها.. والسبب أن المسيسين أيا كان انتماءهم عدلوا مواقفهم من الإخوان بعد أحداث التغيير في 2005 وبعد فوز الإخوان، وبالتالي فبما أن المسيسين قد أدلوا بدلوهم مسبقا.. فهذا الموضوع جاء ليقول قيه غيرهم آراءهم..<br />- الأمر الأخير أن الملحوظة قبل الموضوع كان لها سبب واحد.. وهي أن تؤكد أن المقال لا يعبر عن رأي الموقع.. حتى لا يتهمنا القاريء العزيز بالتناقض.. لأن في مواد الموقع الكثير من المؤيد لتصرفات الإخوان..<br />أشكركم على التفاعل.. وعلى ردود أفعالكم المهمة لنا.. رغم أنفنا..<br />محرر صفحة ولاد البلد<br />weladelbald@yahoo.com"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

