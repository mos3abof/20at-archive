subject = "صباح الصدف"
author = "إسلام لطفي"
posted = "2006-04-13"
text = "السلام عليكم . . أنا ما عنديش مانع ان حد يكتب مقال مش يهاجم الإخوان لأ يا عم اعمل مقال يسب للإخوان بس ما تستعمانيش وتقول لي شباب مصري عادي<br />صدفة مش منطقية شوية ان كلهم بيشتمواوبيهاجموا الإخوان؟<br />تقريباً انت رحت جبت كومبارس من على \"قهوة البستان ملتقى الأدباء والفنانين\" وخليتهم يمثلوا دور شبابا اهبل وعملت بيهم الموضوع<br />جتكوا القرف"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

