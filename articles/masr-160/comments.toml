subject = "ايه يا عم اسلام"
author = "كروكي"
posted = "2006-04-13"
text = "ايه يا عم اسلام لطفي .. الراجل قايل في اخر مقاله :<br />(ما أريد قوله أني وجدت شباب كثيرون يحبون الإخوان، وأنا شخصيا لي منهم أصدقاء، لكن كان الهدف من هذا المقال هو أن أقابل وأكتب عن هؤلاء الذين يكرهون الإخوان..<br />والإخوان لديهم – دائما- الفرصة في أن يغيروا من أنفسهم، ولعل مراقبون للشأن السياسي المصري يؤكدن أنهم يتغيرون بالفعل)..<br />يعني الراجل مجبش الشباب من القهوة، لا قعد يدور عليهم لحد ما لقاهم، وبيقول انه لقى كتير من الاخوان او بيحبوهم.. بطلوا بقى تفتحوا المواقع عشان تتفرجوا ع الصور"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

