order = 0
subject = "إخوان.طز-على طريقة المرشد -"
author = "صلاح على"
posted = "2006-04-13"
text = "تاريخ الإخوان الدموي أوضح من إنه يتشرح ، الخوف كله دلوقتي من فكرة إن جماعة متطرفة في اتجاهها زى الإخوان يبقى ليها 88 كرسي في البرلمان ، متهيألي الإخوان نفسهم خايفين من الفكرة دي ، لأنهم في السياسة صفر ، البعض كان بيدعو بالسماح للإخوان بإقامة حزب سياسي رغم مخالفة دا للدستور ، وأنا رأيي إن لو الدولة فعلا ذكية ، تسمحلهم بدخول حظيرة الأحزاب السياسية ، عشان تفضحهم ليس إلا"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "ليس موضوعيا"
author = "كون الموقع يكتب ملحوظة فى بداية التحقيق أن الموضوع لا يعبر عن رأي الموقع فى الإخوان ، لا يعنى أن يتم استطلاع مجموعة من الشباب جميعهم لا يعرفون شيئا عن الإخوان أو بمعنى أصح شباب سطحيين للغاية"
posted = "2006-04-13"
text = "وإذا كان هؤلاء الشباب لا يعرفون الإخوان ، فالعيب فيهم وليس فى الإخوان .. وإلا من الذى انتخب الإخوان وأعطاهم ثقته أليس الشعب ؟!"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "نعم الموضوعية .. حشاش"
author = "من الواضح ان العينة التى تم استطلاع رأيها \"ليست غير مسيسة\" كما يذكر الموقع"
posted = "2006-04-13"
text = "ومن طبيعة التعليقات نستطيع ان ندرك بسهولة ان لهم اتجاهات سياسية معادية للإخوان .. و قد ذكر مجرى الاستطلاع ان احدهم ينتمى لحركة كفاية<br />جميعهم على ما اعتقد مسيسين .. باستثناء الأخ الأخير بتاع الحشيش<br />بقى بتخدوا رأى حشاش فى جماعة الإخوان ؟!<br />نعم الموضوعية"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "إلي صلاح على"
author = "من الواضح أنك تتمتع بقدر كاف من الضحالة الفكرية فى السياسة والتاريخ والقانون"
posted = "2006-04-13"
text = "الإخوان ليسوا جماعة دموية كما وصفت ، والقانون لا يمنع الإخوان أو غيرها من الجماعات والقوى السياسية من تشكيل أحزاب ذات مرجعية إسلامية لأن الدستور فى مادته الثانية يؤكد على ان الشريعة الإسلامية هى مصدر السلطات<br />لو أتيحت الفرصة للإخوان لتشكيل حزب سياسي اعتقد أنه سوف يقود البلد خلال سنوات قليلة"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

