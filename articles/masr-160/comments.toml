order = 15
subject = "النمر الأسود.... :-)"
author = "كريم الشناوى"
posted = "2006-04-16"
text = "بصراحة كلمة صحفى مصرى مع ما جاء بعدها من نصائح النجاح تمثل اسلوب متعالى بيرفعلى الضغط برده... أيها الصحفى المصرى :-).. أنتقد الموضوع...و قول أنه معجبكش ... لكن ما تمليش على حد يعميل ايه.. يعنى عبر عن وجهة نظرك بس... يا سيدى أنا عجبنى الموضوع.. و بحب التفاهة ( طبعا من وجهة نظرك لأن ده مش تفاخة )... و فى الأخر عاوز أفكركوا بالإعلان اللى بيقول...<br />مصر فيها .. الحياة الحلوة.<br />مصر فيها... أحلى منظر نيل.<br />مصر فيها... سبعين مليون صحفى... :-)<br />( مع الإعتذار للوحش طلعت مصطفى )"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 16
subject = "توضيح"
author = "صحفى"
posted = "2006-04-18"
text = "اعتذر للأخ النمر الأسود على أنى كنت سببا فى رفع الضغط لديه ، رغم أنه اتهمنى بالتعالى وهى تهمة غير صحيحة بالمرة ، وقد اردت من تعليقى السابق أن أخرج من حدود موضوع صحفى ضيق - أرى أنه تمت معالجته بسطيحة- إلى الحديث عن قواعد مهنية لا يختلف عليها اثنان<br />وكون البعض معجب بالموضوع .. وهذا حقهم لا يعنى أن الموضوع جيد( جمهور كبير يستمعون لريكو و شعبان عبد الرحيم .. ومعجبين جدا بهما !!)<br />وكون هناك معجبين بالموضوع لا يمنعنى حقى فى نقده وفق أسس موضوعية وتوضيح وجهة نظرى وكشف ما فيه من أخطاء<br />وعموما أعتذر لكل من رأى فى كلامى نبرة تعالى لا سمح الله"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 17
subject = "لماذا هذا الهجوم"
author = "هدى"
posted = "2006-07-29"
text = "ايها الشباب لماذا هذا الهجوم على جماعة تضحى من اجل الوطن ولم تتربح ولم تسعى الا لكل خير لهذا الوطن اعملوا عقولكم فى التفكير فيما تسمعون وتقولون واحذروا ان تقلدوا دعاة العلميانية والفجور فى البلد واقرءاو عن الاخوان واعرفوهم عن قرب ولا تدع احد يعبث بعقلك ولن يجبرك احد فى الكون كله على شى لا تريده ."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 18
subject = "مناقشه غير شريفه ضد الشرفاء"
author = "علان منكم"
posted = "2006-07-30"
text = "يا شباب هذا كلامكم ام كلام مندس عليكم<br />طيب تعالوا ننظر هولنا عملنا ايه بالاحزاب الاخرى ن يقولون انهم من الشعب<br />عملوا ايه لينا نحن الشباب<br />هل احد منكم يعرف مصيره بعض الخروج من التعليم .<br />ولا هى المشكلمه بس مشكله كلام ضد الاخر<br />عندما تجد نفسك فى مشكله الى من تذهب الى الوسطه ام الى الحكام<br />على الاقل ان هؤلاء الاشخاص يناضلون من اجل مستقبل افضل ام غيرهم من<br />الزعماء والوزراء اصحاب النفوز والسلطاط<br />ضد الشعب اصحاب تجميع الفلوس وحملها الى الخارج<br />اصحاب سرقه احلامنا وامالنا فى مستقبل لنا<br />اصحاب ضياع الملا يين من الشباب<br />اصحاب الفكر المتحضر نحو شباب القهاوى<br />اما عن فلسطين اتجدوا انهم ضيعوها ام رضوها بروح المقاومه الشريفه بدون جمع الاموال ووضعها فى بنوك سورا<br />ايها الشباب المخدوع اى خطط الدوله فى تحقيق احلامنا انا شب مثلكم لم اجد الا خلافات وتناقضات بين الاخوان والحكومه بدون النظر للشباب بدون اى تقدم بل تخازل من اسوء الى اسوء<br />هل هذه خطه الرئيس التحطيميه للشباب<br />هل هذا ما انتخبنا له"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100904/http://masr.20at.com:80/article.php?sid=160&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
