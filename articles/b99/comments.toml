[[comments]]
order = 2
subject = "أخو الريس"
author = "والله يا جماعة مش عارف أقولكم إيه"
posted = "2005-12-17"
text = "بس الموضوع بسط من كده بكتير<br />أنا شايف إن الإنسانة اللى أتمنى أرتبط بيها تكون طبعا ملتزمة وطبعا جميلة<br />بس الفكرة فإن فعلاً فعلاً فى جوانب تاية كتييييييييييير غير المعيارين دول<br />ولكن الغالب يتكلم المعيارين دول بإعتبارهم الحدود الشائكة ...يعنى بمعنى آخر إن الناس دايما بتفتكر إن الحاجتين عكس بعض<br />بس ده مش اللى أقصده الوقتى<br />أنا فى نقطة هامة حابب أوضحها إن أى إنسان هايرتبط بإنسانة لازم هايكون فيها صفات كتيييير اوى ومش معنى إن واحد محتار بين الجمال والدين إنه هايخدها أمية أو جاهلة لأ أكيد فى حد أدنى هو محدده تقريبياً لازم يكون متوفر قيها وأكيد لازم يكونوا أهلها كويسين وولاد حلال ولازم يكون....ولازم يكون..... الخ فأنا أختلف مع رأى الأستاذ - اللى مش فاكر إسمه - اللى بيقول إن فى جوابب كتير لاوم الةاحد يشوفها..، ولكن المقال يناقش قضية الإختيار بين الدين والجمال ولذا ..لكى نحدد أيها يجب تحدييد كل الجوانب الأخرى غير هاتين النقطتين ولذا أنا أعتب على الأخت - وأمى لله وأنا بقول أخت- الفاضلة هبة الله أحمد - كاتبة المقال- فى أنها أتت بهذا الرأى فى الموضوع.<br />أعود سريعا إلى ما تركتكم عنده بخصوص الجمال أم الدين ..الدين أم الجمال..<br />والله يا جماعة الأستاذ عمرو خالد بيقول جملة رائعة (محدش هايتجوز مرات حد) وده حقيقة..، بس نرجع برضة تانى ونقول أصل أنا محتار وأنا بفكر وأنا مش عارف أقرر..أقولك أنا بقى يا سيدى<br />خدها منى نصيحة<br />روح فى مجتمع أو دائرة من الدوائر حولك تتمتع بقدر أو بحد أدنى من الإلتزام الذى تقبله وأختار ساعتها إجمل واحدة - فى نظرك طبعاًً-...،<br />بمعنى إيه...<br />بمعنى إن مثلاً إنت ليك أخت وعارف إن صويحباتها كوبسين وولاد حلال -زى أختك- يبقى توكل على الله وروح شوف وأخطب.<br />أو مثلاً نسايب أخوك معروف عنهم إنهم عائلة محترمة وذوو دين..يبقى توكل على الله...أو....ا,....إلخ<br />المهم فى الآخر حاجة مهمة جدا<br />إن كلمة (متدينة)وكلمة(جميلة)الإثنان كلمتانت نسبيتان<br />يعنى تحتلف من واحد لواحد ومن شخص لشخص ..ومن بيئة لبيئة ومن عيلة لعيلة<br />مثال على (متديب)<br />اللى بتلبس حشم البعض بيقول عليها متدينة \\، والللى لبسة حجان تبقى متدينة بالنسبة لها، واللى لبسة واسع وفضفاض بتكون متدينة.. واللى حافظة جزء من القرأن متدينة واللى 3 متدينة.. واللى 10 متدينة واللى خاتمة متدينة<br />يا جماعة والله كوووووول المسلمين متدينين..الفكرة إن تدينك عامل إيه؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />واللى عايوها ده عايو تدينها أد إيه؟؟؟؟<br />ونفس الكلام فى الجمال - بس بلاش أمثلة- عشان ما ندخلش فى شبعهة الحرام...<br />وعايز أقولكم على حاجة فى الآخر<br />أنا برضة كنت محتار ..، لكن الحمد لله لقيت الإنسانة المتدينة - بالنسبة لرؤيتى - والجميلة برضة - فى نظرى أنا طبعاً- وفى النهاية لا يهم أحد من سأتزوج ولكن المهم أن أكون أنا مقتنع بمن سأتزوج.<br />دعواتكم بالتسير والتعجيل لى فى زواجى.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103500/http://www.20at.com/article2.php?sid=99"

[[comments]]
order = 3
subject = "هي جوازة ولا أكتر"
author = "عبد"
posted = "2005-12-17"
text = "هي جوازة ولا أكتر - منعملها مسابقة- ملكة جمال الملتزمات. احنا ليه مفترضين ان احنا كشباب بنصلي و نصوم و نغض بصرنا ان احنا منترفضش هى كمان ليها حق تفكر و المسألة توافق عقي و فكري و روحي قبل أي حاجة. أنا رأيي ان كل الملتزمات حلوين فعلا-بجد أنا قصدي ان هي جميلة كأنثى- نور في الوش كده و هدوء و وقار و عقل ووو هقول ايه ولا ايه يا جماعة متصعبهاش و لا انتو يا اخواتنا تصعبوها علينا. واللي يحب النبي يقول صلى الله على محمد صلى الله عليه و سلم مرة واحدة على الاقل<br />و سلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103500/http://www.20at.com/article2.php?sid=99"

[[comments]]
order = 4
subject = "هبهوب"
author = "هبهوب"
posted = "2005-12-18"
text = "امممم اتفق مع راي الاستاذ ابو العريس محدش بيتجوز مرات حد وحاجه تانيه انت ممكن تكون موافق عليها وكل حاجه سيان جانب جمالي او ديني بس البخت بقي وكدا فا اعتقد يعني سيبها للي خلقا واستخير<br />اه بالحق ممكن الصوره اللي انت تكون مثاليه مثلا ف سيبها للي خلقها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103500/http://www.20at.com/article2.php?sid=99"

[[comments]]
order = 5
subject = "رجولتي مهانة"
author = "سكندري"
posted = "2005-12-21"
text = "لا أعلم ما علاقة التعليق حول ما حدث للأخت هناء برأس الموضوع الأصلي ولكني فعلا بعد أن قرأت التعليق أشعر الأن فعلا أن رجولتي أهينت<br />كيف يحدث هذا في مصر ومن شخص سافل من المفروض أنه يحمي الأمن والأمان<br />هؤلاء السفلة هم مصيبة مصر<br />ولكن اي أمن وأمان بعد هتك الأعراض وبعد حبس الشرفاء وبعد ما حدث من ازهاق أرواح بريئة في يوم الحرية المزعومة يوم الانتخابات لا لشئ إلا أنها صدقت فعلا الدعوه المسمومة وذهبت لتشارك<br />اااااااااااه<br />اه يا بلد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103500/http://www.20at.com/article2.php?sid=99"

[[comments]]
order = 6
subject = "هيريحكو"
author = "عبدالله مفتاح"
posted = "2005-12-24"
text = "من الاخر كون ان البنت تكون متدينه ده ميمنعش انها تكون جميله ولا كل المتدينات وحشين؟<br />اكيد في منهم ملكات جمال<br />وانا يوم لما اجي اجوز مش هتجوز الا واحده شيخه (ان جاز التعبير)وليمكن اتنازل عن الشرط ده ومهما كانت المغريات ليمكن اتجوز واحده تدينها مطاطي او سطحي وده حقي ومحدش يتدخل وفي الاخر نشوف مين اللي هيفلح في جوازته ومين اللي هيحثو التراب على راسه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103500/http://www.20at.com/article2.php?sid=99"

