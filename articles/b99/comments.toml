subject = "جردوا \"هناء\" من ثيابها و حاولوا هتك عرض ابنتها"
author = "في قسم شرطة الدخيلة : جردوا \"هناء\" من ثيابها و حاولوا هتك عرض ابنتها"
posted = "2005-12-16"
text = "كتب نشوي مصطفي (المصريون) : بتاريخ 16 - 12 - 2005<br />استمرارا لحلقات مسلسل التعذيب التي لا تنتهي بانتهاكات أدمية البشر داخل أقسام الشرطة وفي واقعة مشينه ليست الأولي تروي السيدة هناء سعد إبراهيم ما تعرضت له داخل قسم الدخيلة علي يد المعاون المباحث أثناء زيارتها لأحد أقاربها المحتجزين داخل القسم حيث قام أحد الأشخاص المراقبين والموجودين داخل القسم بمعاكسة أبنتي أمام الضابط والجنود فقامت بنهره ومعاتبته فما كان منه إلا قام بالاعتداء علي ابنتي ، فقام المخبرون علي الفور باصطحابي وابنتي والشخص المراقب ويدعي أحمد إلي مكتب معاون المباحث ، والذي قام بصرف المراقب من مكتبه وقام باستدعاء إحدى السيدات من حجز النساء إلي مكتبه وأمرها بتجريدي تماما من كل ملابسي وقام الضابط المذكور أمام المخبرين بالاعتداء علي بكرباج علي ظهري وأنا عارية تماما وأصابني بإصابات ظاهرة وأستولي علي جهاز المحمول الخاص بي وبطاقتي.<br />ثم حاول أن يجرد ابنتي من ملابسها ولكني ثرت عليه فلم يستطيع أن يفعل ذلك ثم قام بتقييدي من الخلف بقيد حديدي واحتجازي في القسم حتى الواحدة بعد منتصف الليل بعد تغمية عيني حتى حضرت سيارة وتم ترحيلي إلي قسم مينا البصل وإخلاء سبيلي وعليه تقدمت بشكوى إلي رئيس غرب النيابة الكلية لاتخاذ اللازم نحو الضابط وإثبات واقعة هتك عرض."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103500/http://www.20at.com/article2.php?sid=99"

