[[comments]]
order = 0
subject = ""
author = "شاذ"
posted = "2009-10-15"
text = "طيب ما هو فية كلام كتير عن وزراء شواذ وابناء مسئولين كبار شواذ<br />هما قصدهم اية<br />عايزين يقولوا اية<br />الفرقعات اليومين دول كتير لية<br />فرقعة النقاب<br />وفرقعة الزبالة فى الجيزة<br />وفرقعة التلوث فى مياة الشرب والتيفود<br />وفرقعة انفلونزا الخنازير مع ان اللى ماتوا منها ثلاثة وبيموت فى الشهر الواحد الف بنى ادم فى حوادث طرق<br />وفرقعة مرتضى وشوبير<br />هو فية اية<br />البلد بتموت والا بتطالع فى الروح<br />فية اية يا بلد<br />بيعملوا فيكى اية"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205018/http://www.20at.com:80/masr/2khbar/13717--cd-.html"

[[comments]]
order = 1
subject = ""
author = "فية صورة محضر"
posted = "2009-10-15"
text = "الصحفى او رئيس التحرير قال ان ضابط اعطاة محضر الشرطة وعندهم صورة منة وبناءا علية نشروة وال cd فية صورة محضر الشرطة<br />ولكن الشرطة بعد ذلك نفت وجود محضر او اى تحقيق<br />العملية بقت لعبة<br />فية جهة حكومية بتلعب تلعبة تشوية لسمعة الرجل<br />والمحكمة هى التى ستفصل وعلشان كدة القاضى اجل القضية لدراسة الوثائق ومشاهدة ال cd"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205018/http://www.20at.com:80/masr/2khbar/13717--cd-.html"

[[comments]]
order = 2
subject = ""
author = "جيمي"
posted = "2009-10-15"
text = "وحتي لو هو فعلاً شاذ<br />مهو فيه ملايين الشواذ الى شيخ الأزهر حتى ما حجمهمش … وجاى ع النقاب<br />وهى مسألة شخصية كونه شاذ او لا<br />بس فعلاً انا حاسس انه مخطط وان الحكومة بعد مسلسل متخافوش عايزة تحجم دوره وتكره الناس فيه علشان يحصل رد فعل نفسي عند الناس وتنطبع صورة ان الى بيعارض بيبقى منافق وبيعمل حاجات غير الى بيقلها<br />مشكلتى انى قاري الحكومة …"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205018/http://www.20at.com:80/masr/2khbar/13717--cd-.html"

[[comments]]
order = 3
subject = ""
author = "حلاوة العنتبلي"
posted = "2009-10-15"
text = "كلامك دا كلام فاضي لا يستند على اي اساس<br />الصحفي لن يقوم بنشر اي محتوى بدون التأكد من صحته<br />وفيه مثل شهير بيقول \"مفيش دخان من غير نار\" … مش كده والا إيه؟<br />اقتباس تصفية حسابات:<br />امس كان فية حلقة فى التليفزيون وكان نور الشريف مع معتز الدمرداش بيتكلموا<br />ويظهر ان هناك رتبة من الامن قدمت مستندات للجريدة لتنشرها فالجريدة عندها مستندات ويظهر ان جهات امنية تريد ان تشوة صورة نور الشريف او تحجمة وتعرفة انة صغير لان نور اتكلم وقال انة من شهر فات طلب مقابلة الرئيس مبارك علشان يكلمة كمواطن مصرى عما يحدث لمصر من تحجيم وتقليص دورها<br />فالعملية كما يبدو مشبوهة وفيها تدخل امنى لتشوية صورة الرجل الوطنى<br />على العموم الموضوع هيموتوة بسرعة لان نور الشريف لة شعبية واسعة"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205018/http://www.20at.com:80/masr/2khbar/13717--cd-.html"

