[[comments]]
order = 11
subject = "قصــــــة ضحيـــة سائــق"
author = "ضحيـــة السائــق"
posted = "2007-02-13"
text = "اغتصاب سائق التاكسي لي<br />هي سيدة في الخامسة والعشرين من عمرها. والدها علمها الصلاة والتقوى وعمل الخير، علمها السماح والغفران.. وعاشت على ما تعلمته من والدها. وتزوجت شابا مؤمنا تقيا.. يعمل مدرسا بالجامعة وعاشا في سعادة غير كاملة بسبب عدم الإنجاب دون سبب معروف في الزوجة أو الزوج. وبشهادة الأطباء الزوج سليم والزوجة سليمة ورغم نصائح الآخرين للزوج بالزواج من أخرى، إلا أنه رفض أن يسبب لزوجته الخوف والإحراج. وكلما عاودهما الحنين للأطفال تضرعا إلى الله أن يكمل سعادتهما. وفي أحد الأيام ذهبت الزوجة لزيارة أمها المريضة، وأخبرها زوجها بأنه عنده ندوة في الجامعة وبعد انتهائها سيمر عليها لزيارة أمها والعودة إلى المنزل. وانتظرت الزوجة عند أمها حتى التاسعة مساء ولم يحضر الزوج.. وبعد دقائق اتصل الزوج ليخبر زوجته بأن تبيت عند أمها أو تعود بمفردها للمنزل وحاولت الزوجة العودة لبيتها، ودفعتها رغبتها في سرعة الوصول للبيت لركوب تاكسي. وأبدى السائق أدبه في البداية وسار بالتاكسي، وإذا به يغير مسار الطريق وسارت صامتة مستسلمة. وعندما وجدت الطريق مظلما خاويا من حركة المرور، ارتجفت رعبا وإذا بالسائق يخرج شيئا ما من جيبه ويشمه وقال للزوجة - بصوت مترنح يا حبذا لو تشاركينني هذا المزاج المنعش. وأوقف السيارة. فصرخت فيه أن يسير. وسخر منها، ثم أخبرته أن زوجه ، ضابط شرطة، فازدادت سخريته ونزل السائق وجذب الزوجة بقوة * فسقطت على الأرض، فهجم عليها كالوحش الكاسر، قاومته بشدة إسترحمته وتوسلت إليه.. ومزق ملابسها وعندما تعرى جسدها راحت في غيبوبة ولم تدر ماذا حدث لها، إلا أنها استيقظت من الغيبوبة في هذا الخلاء والظلام ووجدت هذا الذئب البشري وقد اغتصبها بكت وصرخت وتمنت الموت ولم تدر ماذا تفعل؟ خافت أن تقف في الطريق لتشير<br />اقرأ بقية التعليق .."
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214070116/http://masr.20at.com:80/article.php?sid=1571"
