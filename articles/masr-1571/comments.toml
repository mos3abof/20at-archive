author = "فارس_fr"
posted = "2007-02-11"
text = "اذن الحل ان ضماير الناس تصحى وتتغير , وده لسه بدري عليه شوية ,,, يمكن اذااتغير الحال ومبارك مات ولا حاجه وحكمنا واحد فعلا من صلب بهية , يمكن ساعتها ظروف الناس تتحسن وضمايرهم ترجع ليهم تانى .<br />او ممكن ان كل واحدة -من ولاد الغلابة -تشتريلها \"موتوسيكل \" تقضي بيه مشاويرها وتبقي استريحت من معاكسات سواقين التاكسي - لان طبعا طبقة الكريمة بناتهم كل واحدة عندها عربية خاصة .<br />ادعوا معايا ان ربناياخد مبارك يمكن احوالنا تتغير !!!!!!!!!!!!!!"
