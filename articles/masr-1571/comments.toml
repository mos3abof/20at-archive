subject = "و الله عندك حق يا فارس"
author = "نيفين نيفى نوفا"
posted = "2007-02-13"
text = "فعلا يا فارس مساله ان السواقين فيهم مؤهلات علياصح لا و دراسات عليا كمان<br />فعلا يا جماعه بقت حاجه تحزن<br />انا مره ركبت مع سواق و كان بيتكلم مع حد راكب جنبه و كان بيقولو لبعضهم مفيش شغل و الحاله صعبه و الكلام دا فسال الشخص اللى كان راكب ادام داالسواق انت ايه فقاله انا مغايا مجستير ف القانون فقاله الشخص و ليه مكملتش لحد ال<br />كتوراه فقاله يا استاذ انا معايا مجستير و بسوق تاكسى عايزنى اخد الدكتوراه ليه علشان اسوق اتوبيس يعنى<br />و ضحكو<br />بس الضحك اللى بيبقى وراه دموع داخليه<br />فعلا البلد رايحه ف داهيه"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214070116/http://masr.20at.com:80/article.php?sid=1571"

