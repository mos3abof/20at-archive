subject = "اسوا وسيلة مواصلات"
author = "ممتاز يا اخ يسر حطيت ايدك على الجرح ان ما فيش واحدة ممكن تأمن على نفسها اذا ركبت تاكسي لوحدها مع ان المفروض الواحد بياخد تاكسي وبيدفع فيه مبلغ كبير علشان خاطر الامن والامان لكن يظهر العكس ممكن الواحدة تركب تاكسي وما تشفش اهلها تاني."
posted = "2007-02-11"
text = "لان مهنة السواقة هي مهنة العاطلين عن العمل يعني اي واحد عاطل وفاشل عايز يشتغل يعمل ايه يتعلم السواقه ويشوف تاكسي يشتغل عليه وطبعا الطبع بيغلب التطبع وهو شغال سواء لازم يتصرف باصله<br />اللهم ارفع مقتك وغضبت عنا يا رب"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214070116/http://masr.20at.com:80/article.php?sid=1571"

