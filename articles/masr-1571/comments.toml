subject = "الميكروباص !!!!!"
author = "فارس _fr"
posted = "2007-02-11"
text = "ايوه هو الحل فىالميكروباص , اولاارخص من الناحية المادية , ثانيا مش هتخافى على نفسك<br />وانت راكبة لان هيكون معاكى ناس كتير لا هتحتاجى انك تشيلى معاكى لا قزازة معطر ولا حاجه خالص كفاية تقولى ان واحد بيعاكسك وهتشوفى الرجالة اللى هتقف لك قد ايه !!! مش عارف الناس اليوميندول الناس عندهااستعداد تتخانق عشان واحدة اتعاكست ولا لا!!<br />بالنسبة للاخ اللى قال ان اغلب السواقين بيكونوافى الاصل عواطلية ومش متعلمين ,, احب اقولك انك متقدرش تعمم كلامك لان فى سواقين كتير بكالوريوسات والله بكالوريوسات \"طب وهندسة \" ومش سواقين تاكسي وبس وسواقين ميكروباص كمان ........... ربنا يفرجها عليناوعليك ."
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214070116/http://masr.20at.com:80/article.php?sid=1571"

