[[comments]]
order = 1
subject = "طب وحبيبنا"
author = "sweet_princess"
posted = "2006-02-19"
text = "لا انتو كده بتظلمو الحكام بتوعنا ظلم شديد دا احنا عندنا في الوطن العربي مواهب تستاهل الاوسكار وانا برشحلكم النجم الامع بتاعنا حبيبنا وحبيب الشعب كله (((هستكنا وبشكتكنا ياريس دا انت رئيس والنعمه كويس )))على راى عادل امام وانا برشح النجم الامع بتاعنا دا لبطولة اول افلامه ويارب تكون اخرها (انا تلقيحه )وبعدين يكمل بعده بقى لحد الجزء السابع والعشرون الورثه انشاء الله (ماهي عزبة بابا اللي سابها لهم )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150017/http://www.20at.com/article2.php?sid=463"
