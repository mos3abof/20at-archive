subject = "مين قال كده ؟؟"
author = "أكرم"
posted = "2006-02-18"
text = "مين قال ان السياسيين في الوطن العربي الكبير جدا ( من المحيط الى الخليج ) مالهومش في التمثيل يا مروة قولي كلام غير كده ؟؟؟"
