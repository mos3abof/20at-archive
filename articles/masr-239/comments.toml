[[comments]]
order = 6
subject = "نعم توجد مصران"
author = "توجد مصران"
posted = "2006-04-30"
text = "توجد مصر نحس بها وهم لا يشعرون بها<br />وتوجد مصر لا نراها ولكن هم يعيشون فيها<br />لاتعرف ما يدور داخل القصور والفيلات ولا تتوقع ماذا يدور بداخلها ولا ماذا يئكلون<br />او يشربون<br />وهم لا يريدون ان يعرفو ماذا يحدث داخل الشوارع والحارات وكل همهم ان يجمعو الاموال<br />ولكن لي رجاء هل ممكن ان تخرج كرم جابر من المصر التي لا تعيش معنا"
archived = "2006-05-04"
capture_url = "https://web.archive.org/web/20060504134057/http://masr.20at.com:80/article.php?sid=239"

[[comments]]
order = 7
subject = "مصر واحده أنت اللى مش فاهم"
author = "واحد عادع معدى"
posted = "2006-04-30"
text = "أوعى تكون فاكر أن فى فرق بين القايمه الاولى و التانيه يابنى كله بيطبل بس بطريقته. مصر لا دول ولا دول مصر الغلابه المطحونين اللى قوتهم مسروق من الاف السنين. مش شويه المعرصين ولا المثقفين اللى عاملين فيها ثورجيه ولا كفايه ولا اخوان ده كله بتنجان من الاخر كله عاوز حته من التورته وسلم لى على الحريه والملوخيه بالتقليه"
archived = "2006-05-04"
capture_url = "https://web.archive.org/web/20060504134057/http://masr.20at.com:80/article.php?sid=239"

[[comments]]
order = 8
subject = "موضوع لذيذ"
author = "قعر الحلة"
posted = "2006-04-30"
text = "عليا الحرنكش ياريس مبارك<br />فى عصر مزركش ملون بنارك<br />لابايعك وابايع حكومة حمارك<br />ملعون ابو اللى يقدر يقاطع قرارك<br />نهاره مقندل وليله مبارك<br />فهمبك وهجص وطلع فى ديننا<br />اكيد هو طالع يشاهد جمالك<br />جمالك مبارك سوزانك سوزاننا<br />يامحلا حصارك لمصر اللى جالنا<br />نسيمها فى عصرك بيشوى فى بدننا<br />اؤيد وابايع فخامة جلالتك<br />وايد اى واحد بيمسح ريالتك<br />ولانك سر باتع هاننسى هبالتك<br />فاقعد ياريس ودلدل حمامتك<br />حمامة السلام حمامتك ياريس<br />سلامة الحمامة وسلامتك ياريس<br />على تل مصر ياريتك تهيص<br />خرابه فسيحة عليها تمتيس<br />واامر تطاع فشعبك مفيص<br />احمد فؤاد نجم"
archived = "2006-05-04"
capture_url = "https://web.archive.org/web/20060504134057/http://masr.20at.com:80/article.php?sid=239"

