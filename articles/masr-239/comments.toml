[[comments]]
order = 11
subject = "kkjhhdfsdsa"
author = "موني"
posted = "2006-04-30"
text = "في مصر تالته فعلا ميعرفوهاش بتوع الاولي وكفرانه وطلعان دينها من التانيه ..<br />اللي همه بيروحو وسط البلد بس في الظروف الاستثنائيه .. وميعرفوش اللي حضرتك بتقول عليهم دول .. تامر وهيثم .!الخ<br />مصر يا استاذ هيه اللي حضرتك واصحابك مفكرتش مره تروحلها ولا تحاول تنزل لها بجد مش استعراض ..<br />ده لو مصر هيه شوية العيال التلاتين اربعين واحد اصحابك دول او حتي شوية الرجعيين بتوع الاخوان اللي ميفرقوش حاجه عن الحكومه في كل توجهاتهم .ز خصوصا الاجتماعيه . ده لو دي مصر في نظرك يبقي حضرتك هتقع بدري قوي.. حاول تخرج بره وسط البلد شويه .. كم واحد يعرفوك في حتتك؟"
archived = "2006-05-04"
capture_url = "https://web.archive.org/web/20060504134057/http://masr.20at.com:80/article.php?sid=239"

[[comments]]
order = 12
subject = "ربنا يستر"
author = "نصيحة أخوية استخبىى في بيتكو اليومين دول علشان الكلام بتاعك ده يودي في داهية . انت ماشفتش اللى حصل لقضاه ميصر و لا ايه و لا انت عايز تحصلهم. ربنا يستر ."
posted = "2006-04-30"
text = "على العموم المقال جميل لكن مايؤخذ عليه هي الأسماء الكتيرة اللى انت مليت بيها المقال و حكمت عليهم من الظاهرمع ان ممكن يكون فيه منهم ناس كويسة . أنا رأيي بلاش تحجر على رأي القارئ اللى ممكن يشوف في بعضهم اشخاص كويسين"
archived = "2006-05-04"
capture_url = "https://web.archive.org/web/20060504134057/http://masr.20at.com:80/article.php?sid=239"

[[comments]]
order = 13
subject = "يخرب عقلك"
author = "mido_mashakel"
posted = "2006-04-30"
text = "والله وانا ماحلفش كذب ابدا كانك دخلت جوة قلوب المصريين الشرفاء الجدعان وعبرت عنى انا واصحابى بجد وقعدت توصف مصرهم ومصرناوالاسامى اللى انتا قلتها حقيقية100% كانك ياخى دخلت قلوبنا لكن اسمح لى اضيف ناس الى مصرنا اسامه انور عكاشه-اسامه الغزالى حرب-الأستاذ محمد حسنين هيكل-مجدى مهنا-البدرى فرغلى -ايمن نور-وائل الابراشى-احمد منصور-الشيخ محمد الراوى-بلال فضل-ابراهيم منصور-بثينه كامل-عصام فهمى-ابوالعز الحريرى -عادل عيد-محمد الضهيرى-حمدى السيد-احمدفؤاد نجم.........واسمح لى اشيل بعض البشر من مصرنا واحطهم فى مصرهم زى المطرب مصطفى كامل-جهاد عودة-مجدى الدقاق-احمد عمر هاشم -الشيخ سيد طنطاوى-محمد على محجوب- السيد راشد-سمير رجب-مرسى عطاالله-القط-نافع-والى-ناديه الجندى -تيسير فهمى-تامر جلال-فيفى عبده-ندىوعمروتامر بسيونى والبيت بيتك كله-طارق علام -حياة عبدون-جمال الغندور-محمدحسام-ميدو-متعب...واللى عنده اضافة يضيفها وده اقتراح لك ياأحمد ولكل القراء ان نعمل قائمتان مصرنا ومصرهم عشان اول لما نمسك البلد ننضفها من اللى فى مصرهم وننده على اللى فى مصرنا ايه رأيك يالله نبدأ"
archived = "2006-05-04"
capture_url = "https://web.archive.org/web/20060504134057/http://masr.20at.com:80/article.php?sid=239"

[[comments]]
order = 14
subject = "مصر التالتة"
author = "أحمد رحال"
posted = "2006-05-13"
text = "في مصر كمان , بتاعت الناس اللّي مش لاقية تاكل غير عييش حاف و لو اقو غموس بيبقى لفت مخلل عشان معهمش حق الفول .. و بيشربوا من مياه طايلها صرف صحي .. و يا ريت محدش من الإ خوة اللّي بتعلق يعمللي فيها كادح وشاب مولود في عزبة أبليحة , عشان النت اللّي انت عليه دلوقتي بتمن الساعة دي ممكن عيلة كاملة تاكل لمدة يوم .. و سلملّي على الكفاح الثوري الثقافي"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224040/http://masr.20at.com:80/article.php?sid=239&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
