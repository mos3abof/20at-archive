posted = "2006-04-30"
text = "يعني لورحت شرم الشيخ ودهب هتلاقسهم مصرغير مصرنا<br />والغردقة والجونة مصر تانية الص<br />ومصر حي الأشجار والقطامية هايتس<br />وفيه مصر اسطبل عنتر ومنشية ناصر والحلاليف<br />ومصر الصعيد وقبلي<br />وأمصار كتير ياما"
archived = "2006-05-04"
capture_url = "https://web.archive.org/web/20060504134057/http://masr.20at.com:80/article.php?sid=239"

