text = "أنا رجعت . والحمد لله<br />لكن المشكلة إني برضه باقول .....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />وصحيح<br />...بأنقل لكم تحيات وسلامات 650 معتقل موجودين في سجن طرة دلوقتي ...<br />ربنا معاهم ويفك كربهم و يجمعنا بيهم تحت سماء حرة وفوق أرض بتنطق حرية<br />mohamedmat@hotmail.com"
