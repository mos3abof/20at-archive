[[comments]]
order = 0
subject = "منقول"
author = "ياء"
posted = "2006-05-24"
text = "وقال المستشار محمود الخضيري رئيس قضاة الإسكندرية في تصريحات لـ\"إسلام أون لاين.نت\" الأربعاء 24-5-2006: \"إن نادي القضاة سينظم غدًا الخميس وقفة احتجاجية بداخل النادي ستقتصر على القضاة فقط للمطالبة بحقنا في الاستقلال القضائي\".<br />وأضاف: \"بهذه المناسبة أطالب الشعب المصري أن ينتهز مناسبة الوقفة الاحتجاجية للقضاة، وأن يخرج للشارع للمطالبة بالإصلاح والتغيير والتعبير عن رأيه بشكل سلمي في مجمل الأزمات والاحتقانات التي تعيشها مصر\".<br />غير أنه شدّد على ضرورة \"أن تكون وقفة الشارع بشكل منفصل؛ حفاظًا على خصوصية ووقار القضاة\".<br />وقال الخضيري: \"لكل مصري الحق أن يعبر بطريقته عن احتجاجه؛ إما بتعليق شارات سوداء أو إطفاء الأنوار ليلاً أو التوقف عن العمل أو إرسال برقيات إلى رئاسة الجمهورية. وألمح إلى ضرورة أن يثبت الشعب للحكومة أن المطالبين بالتغيير والإصلاح الحقيقي ليسوا قلة أو مجموعة نخبوية في البلاد\".<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182901/http://masr.20at.com:80/article.php?sid=368"

[[comments]]
