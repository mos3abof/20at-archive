subject = "العز بن عبد السلام"
author = "الديموقراطيه لا تمنح و لكن تنتزع انتزاعا"
posted = "2006-05-25"
text = "فلندافع عن اخر معاقل الحريه فلم يتبق لنا الا القضاء النزيه و رجاله الشرفاء<br />و لننتظر ذلك اليوم الذى يقف فيه من باعوا انفسهم و ضمائرهم و أخرتهم بذهب المعز مره و خوفا من سيفه مره اخرى امام محكمه الشعب فيحكم عليهم ويلقى بهم فى احط مكان فى مزبله التاريخ<br />الشرفاء<br />محمود مكى<br />هشام البسطويسى<br />محمود حمزه<br />هلا منحتمونى شرف تقبيل اياديكم البيضاء طهاره وعفه<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأاه يــــــا بــــــلـــــــدى"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182901/http://masr.20at.com:80/article.php?sid=368"

