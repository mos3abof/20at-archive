author = "تحيه عسكرية شرطة دبي"
posted = "2010-02-16"
text = "فيه واحد من حماس اسمه المبحوح اتقتل في دبي والقتله هربوا وكعادة الشرطة العظيمة شرطة دبي كشفت عنهم وقبضت على اثنين منهم الف تحية لشرطة دبي ونرجو من الشرطة المصرية والضباط المصريين يتعلموا بدلا من معاكسة النساء<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــ<br />كشفت شرطة دبي، أمس، النقاب عن ظروف وملابسات قضية مقتل القيادي في حركة حماس المعروف باسم محمود المبحوح، إذ أفصحت عن أسماء وهويات العناصر المتورطة في ارتكاب الجريمة، وعرضت شريطاً مصوراً رصد تحركات العناصر المطلوبة ضمن هذه الواقعة والبالغ عددهم 11 شخصاً، بينهم امرأة، يحملون جوازات سفر أوروبية سليمة.ووفقاً للقائد العام لشرطة دبي الفريق ضاحي خلفان تميم، فإن أجهزة الأمن «توصلت إلى نتائج دقيقة أسفرت عنها التحريات في وقت قياسي لفك خيوط جريمة شغلت الرأي العام العربي والدولي، بتحديد هوية العناصر المتورّطة فيها بأسلوب علمي لا يقبل تفنيداً أو تشكيكاً». لافتاً إلى أن النتائج الأولية تشير إلى قتل المبحوح بكتم أنفاسه."
archived = "2010-02-18"
capture_url = "https://web.archive.org/web/20100218133527/http://www.20at.com:80/masr/news/15358-2010-02-16-14-19-30.html"

