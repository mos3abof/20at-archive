[[comments]]
order = 2
subject = "في فلسطين كمان"
text = "يسعى القائمون على المساجد الفلسطينية لابتكار أساليب جديدة يستطيعون بها جذب الأطفال والفتيان خلال عطلة الصيف، حيث يمزجون دروس تجويد وحفظ القرآن الكريم بدورات تعليم الكمبيوتر والسباحة والمسابقات الترفيهية. وتشتعل المنافسة بين هذه المساجد لاجتذاب أكبر عدد ممكن من هؤلاء الأطفال والفتيان سعيًا وراء الفوز بثواب الله \"وفي ذلك فليتنافس المتنافسون\".<br />وقال ياسين مشتهى إمام مسجد المحكمة البردبكية في حي الشجاعية بمدينة غزة لشبكة \"إسلام أون لاين.نت\" الخميس 8-7-2004: \"فصل الصيف فرصة ذهبية للدعوة إلى الله عز وجل، ونحن نستغله أحسن استغلال من أجل استقطاب أكبر عدد ممكن من الشباب المسلم\".<br />وأوضح مشتهى أنه \"قبل بدء فصل الصيف نكون قد وضعنا خطة برامجية متكاملة، نسير عليها من أجل تطوير العمل الإسلامي والدعوي واستغلال أوقات الفراغ لدى الشباب المسلم\".<br />وأشار إلى أن الأنشطة الدعوية في الصيف ترتكز على الجانب الترفيهي والرياضي، كعنصر جذب للفتيان والمراهقين، موضحًا أنه \"يتم عقد دورات تثقيفية وتربوية، ورياضية وروحانية، مثل دورات الكمبيوتر والسباحة، بالإضافة إلى دورات حفظ القرآن وأحكام التجويد\".<br />وفي مدينة رفح جنوب قطاع غزة يتركز اهتمام المساجد على الأنشطة والبرامج التثقيفية والتربوية، بينما تقل درجة الاهتمام بالبرامج الترفيهية؛ نظرًا للحصار الذي تفرضه قوات الاحتلال الإسرائيلي على المدينة.<br />وقال جاسر المشوخي إمام مسجد الفاروق بمدينة رفح: \"نُعِدّ لأنشطة صيفية متميزة تتمثل في المحاضرات الثقافية والمخيمات الصيفية، ولكن لا أخفيكم أن هذه النشاطات على الرغم من نجاحها، فإنها غير متكاملة نظرًا للحواجز والعراقيل الإسرائيلية التي تحول بيننا وبين أماكن الترفيه\".<br />http://islamonline.net/Arabic/news/2004-07/08/article10.shtml"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154451/http://www.20at.com:80/article.php?sid=429"

[[comments]]
order = 3
subject = "Dino"
text = "السلام عليكم اخوتى فى الله , و جزاكم الله خيرا على تعليقاتكم و انا اقرتح ايضا استخدام الزبادى ,اى حمام زبادى على الشعر فبل الاستحمام و يبقى على الشعر حتى يجف , و يسلام لو اضفتى عليه كام ثومة هتلاقى النتيجة راااااااااااائعة فهذه و صفة مجربة ..<br />ماسك التوم + الزبادى على الشعر لمدة نصف ساعة فى الاول بعد كده ممكن تحطيه لفترات اطول .و ستشعرى طبعا بحرقان فى الرأس من تأثير الثوم لنكن بعد غسل شعرك ستشعرى حتما بالفرق فى النعومة و سهولة التسريح .بس لازم يغسل الشعر جيدا حتى نزيل رائحة الثوم ,الرائحة تكون موجودة طول مالشعر مبلول فقط و نعد جفاف الشعر فلن تشعرى بالثوم خالص..و لوحد فروة شعره حساسه بلاش يستعمله .."
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154451/http://www.20at.com:80/article.php?sid=429"

[[comments]]
order = 4
subject = "وائل عباس"
text = "حقيقة ما اجده في الموسيقى الغربية لا اجده في موسيقانا العربية برغم حاجتنا اليه<br />وهو السياسة<br />فخلال حرب فيتنام ابدع فنانو موسيقى الروك اعتراضاتهم على الحرب وصاغوها في قالب موسيقي سمي بالبروتيست روك مثل بوب ديلان وجيمي هندريكس<br />وغني بروس سبرنجستين اغنية مولود في امريكا لاقتل الرجل الاصفر<br />واعضاء فريق البيتلز تنازلوا عن لقب سير اللذي اعطتهم اياه ملكة انجلترا بسبب موقف انجلترا من حرب فيتنام ونجد فريق مثل سيكس بيستولز وهم اول من اخترعوا البانك روك يغني اغنية لعن الله الملكة ولا يرميهم احد في المعتقلات<br />وكريس دي بيرج غنى للثورة على الاحتلال البريطاني لايرلندا في اغنية ريفولوشان واغنية الرياح الشرقية وغيرها<br />وفريق كرانبيريز غنت مغنيته الرائعة دولوريس او ريوردان كان الله في عونك يا ايرلندا انهم قتلوا ابي ولم يقتلوا كبريائي<br />حتى مادونا غنت اغنية الحياة الامريكية وبها تلميحات كثيرة عن غزو العراق<br />وعارض الحرب صراحة فريقي يو تو وديكسي تشيكس"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154451/http://www.20at.com:80/article.php?sid=429"
