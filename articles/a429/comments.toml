subject = "بنوتة"
text = "الموضوع جميل جدا و ياريت كل الشباب ربنا بهديهم و يساهموا و يشاركوا فى انشطة زى دى بدل تضيع اوقات الصيف فيما لا يفيد و ممكن اطلب منكم طلب انا عاوزة عناوين المساجد دى لأنى عاوزة اشارك فيها فى الصيف و جزاكم الله خير الجزاء"
