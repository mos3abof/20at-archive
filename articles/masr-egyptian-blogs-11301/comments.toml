posted = "2009-02-15"
text = "هو أيه يا عم يا صاحب المدونة انت .. أأنت ليك عند السواقين فلوس ولا ايه ؟<br />انت بتكرهم ليه اوى كدة ؟<br />ثم انت بتقول ان الاضراب بتاعهم يعنى بجاحة .. وانا بقولك دى عنصرية واضحة منك<br />وبتقول انه مادام ده قانون يبقى لا يحق لأحد انه يعترض عليه !!!يبقى ما تطالبش بوقف العمل بقانون الطوارئ<br />وهو سائقى الشاحنات الى بيبرشموا وبيتنيلوا بس<br />مهو فيه شباب فى عربيات ملاكى وبيعملوا الاكتر من كدة وبيتسببوا فى حوادث دامية<br />ثم بلاش لغة التعميم الى اتكلمت بيها دى<br />وخليك فاكر .. الظلم حرااااااااااااا م<br />وحاول تكون اكثر حيادية من كدة فى النظر للأمور"
archived = "2010-01-05"
