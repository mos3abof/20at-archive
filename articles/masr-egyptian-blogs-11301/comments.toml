posted = "2009-02-20"
text = "لو طبق القانون فى مصر نصا بلا روحا؟<br />لكان الحال فى (مصر)قد تغير الى الاحسن<br />لكن الكارثة كبيرة حيث دائما يسيس القانون و هذة هى الكارثة الحقيقية<br />الفوضى و المحسوبية و الفساد و السرقة و الاعتصامات؟؟؟<br />نريد حكومة (عسكرية)و ليست حكومة ضعيفة فاسدة اسمها حكومة(ديمقراطية )<br />حكومة عسكرية قوية ديكتاتورية تطبق القانون بيد من حديد!<br />دون تفرقة بين كل الشعب؟ يعنى حكومة لا تعرف (الكوسة)بل حكومة تمسك العصا و بيد من حديد على كل خارج على المرحوم الماسوف علية (القانون)رحمة اللة"
archived = "2010-01-05"
