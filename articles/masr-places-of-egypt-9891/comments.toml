text = "دول بيلعبوا قمار بشوية جنيهات قليلة تشترى فرخة او كيلو لحمة<br />انما اللى بيلعبوا قمار بالمليارات ويوزعوا على بعض اراضى الدولة وبنوك الدولة واحتكارات استيراد القمح واللحوم والدجاج ويوزعوا التسلية واللهو غير البرىء مع المطربات والرقاصات ثم يرسلوا ضباط امنهم لقتلهم زى سوزان تميم وسعاد حسنى<br />سعاد حسنى طلبها ابن رئيس دولة عربية تغنى وتهيص فى شقتة فى لندن فرفضت فارسل لها ضابط امن رماها من البلكونة<br />الفساد بتوع الغلابة مش هيضر غيرهم انما فساد الكبار ضر البلد كلها<br />البلد كلها بتلعب قمار بمستقبلها"
archived = "2010-01-05"
