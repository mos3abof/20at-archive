posted = "2008-08-18"
text = "أنا رحت سوق التونسي مرتين من حوالي 10 سنين مع اصدقاء لي لما سمعنا عن شهرته، والحقيقة إنه مش سوق دا \"منبع السوء\"، فهناك تجد كل انواع الغش والتضليل والسرقة، والغريبة ان السوق بيروح له ناس من مختلف الطبقات في مصر علشان مساحته الكبيرة واحتوائه على بضاعة من كل صنف.<br />لكن أغرب شيء شوفته هناك حاجتين: بيع السيراميك زي ما هو يعني لو الواحد عاوز 30 متر مثلا ومفيش غير27 متر مش هيلاقي الباقي الا بالحظ.<br />الحاجة التانية ان في ناس بتبيع مثلا علب الكريم والشامبو والجيل المنتهية فاضية وفي ناس بتشتريها.. الى الن مش عارف افهم الناس بتشتري ليه علب فاضية مستعملة يعني مثلا علبة لمعجون اسنان رماها صاحبها في الزبالة تلاقيها بتتباع هناك وهي متكسرة ومتبهدلة.<br />ملاحظة أخيرة إن هناك العديد من الأمراض ممكن تنتقل عن طريق تداول الاشياء المستعملة في هذا السوق وخصوصا في العب الفارغة."
archived = "2010-01-05"
