[[comments]]
order = 0
subject = "يا دي المصيبه"
author = "عبدالله مفتاح"
posted = "2006-04-02"
text = "هنرجع تاني لايام البلطجه والالفاظ السيئه والاتهامات والفضايح والبلاد العربيه هتتفرج علينا وعلى خيبتنا التقيله المتمثله في مرتضى منصور<br />بما اني اهلاوي الموضوع في حسنة واحده ان الزمالك هيغرق تاني والاهلي هيغلبه بسهوله<br />بس بردو هيرجع على مستوى المنتخب<br />يلا يا رب يمشي<br />محدش عايزه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211343/http://masr.20at.com:80/article.php?sid=112&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

