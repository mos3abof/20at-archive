[[comments]]
order = 3
subject = "هههههههه والله اول مره الزمالك يصعب عليا"
author = "sweet_princess"
posted = "2006-04-02"
text = "الزمالك بجد صعبان عليا اوي ..<br />يعني انا كنت اتمنى اي حاجه تحصل لكن ماكنتش اتوقع (عودة الندل )..<br />ياللا .. ربنا يكونه في عون الزمالك .. حقيقي والله صعبان عليا والدمعه هتفر من عيني ..<br />بس انا لو مكانكم ..اعمل حركه زي (كفايه ).. يمكن تنفع المره دي .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211343/http://masr.20at.com:80/article.php?sid=112&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "خدعونا فقالوا"
author = "محمد نبيل"
posted = "2006-04-05"
text = "اولا اعرفكم بي انا محمد نبيل صحفي وبصراحة انا عاوز اقول شيء مهم جدا لابد لكل منا ان لا يحكم علي اي انسان الا اذا جلس معه وتحدث معه ولا نقول مرتضي منصور جيد او سيء الا بعد ان نبحث عن شخصيته وحتي لا ينخدع الراي العام مرة اخري انا تحت امر اي انسان يحتاج الي مساعدة واتمني للمسئولينعن الموقع موافاتي بالاخبار الجديدة اولا باول مع خالص تحياتي لكم محمد نبيل"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211343/http://masr.20at.com:80/article.php?sid=112&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "فين المايسترو"
author = "نيفين"
posted = "2006-04-06"
text = "و الله كل ما اشوف اللى بيحصل ف ادارات النوادى الاقينى بفتقد صالح سليم<br />و اليكم اخر فضائح مرتضى منصور و هو فشل اعتداء كان هيتم من ابنه و جوز بنته و 20 بلطجى على عمرو اديب بعد حوار ر اجراه معاه عمرو ف القاهره اليوم<br />صحيح عمرو ظبطه يومها بس ده اسلوب البلطجيه امثال منصور<br />و على رايك يا عبد الله احنا الكسبانين لان الزماللك هيتدهور و الاهلى سينطلق<br />و ينطلق<br />و لا عزاء للاخوه الزملكاويه الاعداء<br />قصدى الاعزاء<br />واحد"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211343/http://masr.20at.com:80/article.php?sid=112&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 6
subject = "عصر الأنحطاط"
author = "أبو إسراء"
posted = "2006-04-10"
text = "بصرف النظر عن قرار المحكمة بعودة السيد منصور الى سدة الرئاسة فى النادى فإن وصول من له هذه التصرفات التى أقل ما توصف بعدم الحكمة والألفاظ التى تتسم بالعصبية وعدم الدبلوماسية لمسئول مثله يدلل على من أنتخبوه فى الأصل وأن المسألة تثل الذوق العام السائد وأن الأمر يحتاج بحث وعلاج على مستوى الخبراء والمختصين"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211343/http://masr.20at.com:80/article.php?sid=112&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 7
subject = "اتقوا الله"
author = "اللورد"
posted = "2006-04-11"
text = "عايزيين ايه ياولاد الآيه!حكمت المحكمه ؟ فى مصر ؟ وقضاء مصر الذى حكم على عزام ؟ وحكم على ايمن نور؟ اللى بيحبوه ليه ؟ واللى بيكرهو ليه؟ اتقو الله فى هذا الرجل ! دع القافله تمضى و..... تنبح ؟ خلص الكلام"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211343/http://masr.20at.com:80/article.php?sid=112&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 8
subject = "عاوز ايه تانى"
author = "فاتن محمد"
posted = "2006-04-11"
text = "عاوز ايه تانى يامرتضى منصور والله انا اهلاويه<br />بس الزمالك صعبان عليه ليه كده بيعملوا فى النادى ده كده وفين المسؤلين عن هذا البلطجى الى مش همه حد ومتكبر على ايه ابعد عن الكوره ابعد عن الكوره<br />والله الزمالك صعبان عليه والاعيبه خلاص هتمشى وتسيب النادى بسببك يا راجل يالى بتقول على نفسك كبير ابعد وسبهم فى حلهم لو انت فعلا زاي مبتقول انك بتحب الزمالك ليه متمسك بالمنصب وليه عاوز المنسب ده عاوز ايه تانى عاوز ايه تانى"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211343/http://masr.20at.com:80/article.php?sid=112&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

