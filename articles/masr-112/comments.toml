[[comments]]
order = 10
subject = "مرتضى ونعمان جمعه"
author = "حسام محمود ماهر"
posted = "2006-04-16"
text = "انا متاكد ان الاستاذ مرتضى عارف ان كل الوسط الرياضى والصحفى بيكرهه ومش عايزه, ومنصبه منصب شرفى !! طيب فى ايه وليه اللى بيمسك فى حته مش عايز يسيبها حتى لو كانت تطوعيه ؟ شوفوا مرتضى وشوفوا نعمان جمعه نفس الفكر ونفس الاسلوب واحد ولع فى حزبه والتانى ممكن يولع النادى ويعادى الكل بس يفضل تحت الاضواء , هو منصب تطوعى يعنى ايه ؟؟"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211343/http://masr.20at.com:80/article.php?sid=112&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 11
subject = "ربنا معاك يا مرتضى"
author = "عصام"
posted = "2006-05-25"
text = "ياريت نسيبة يعمل حاجة للنادى اللى كان خرابة لمدة سنوات على يد مجلس ادارة ماعندهوش غير فريق الكور واعضاء النادى يتصرف عليهم كل ايرادات النادى كفاية مغالطة وتعلوا شوفوا اعمالة فى شهور فى النادى الى كان خرابة رنا معاك يا مرتضى<br />وكفاية كدة وما تردش على اى حد علشان ما توقعش تانى فى الغلط"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903172310/http://masr.20at.com:80/article.php?sid=112&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

