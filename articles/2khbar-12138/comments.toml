text = "لسة الاستئناف<br />وعلى العموم فية بعض القضاة لا يخافوا ويحكم بما انزل اللة وكما قال القاضى قبل النطق - الحكم للة<br />ولسة الموضوع لم ينتهى والاعدام ليس مؤكد<br />وممكن ينال تخفيف رئاسى<br />او يجيبوا ولد هلفوت يعدموة مكانة وهو يسافر اوروبا متنكر"
