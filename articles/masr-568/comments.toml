posted = "2006-07-16"
text = "الظاهر يا جماعه ان ليله مقتل الراجل الكبير هى السبب لانها بتتحقق واحده واحده والديب عايز ياكل الغنم ( اسف على التعبير ) قبل ما يكله الاسد ( امريكا ) علشان قرب على المعاش<br />كانت معايه القصه وواحد نزل اخذها سلف يقرأها وما رجعهاش فياريت لو حد من الاخوه يدلنى اقرئها فين دلوقتى مع العلم انى مقيم خارج مصر ولكم تحياتى ولو ممكن عنوان البريد الالكترونى بتاع الاستاذ ابراهيم عيسى ربنايخليكووووووووا"
