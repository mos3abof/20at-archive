[[comments]]
order = 8
subject = "عجبي!"
author = "الأستاذابراهيم عيسي و أقول الأستاذ لأنه واحد من القلائل المعدودين والمستحقين لهذا اللقب عن جدارة واستحقاق."
posted = "2006-06-27"
text = "خلينا نفكر بهدوء : فيه ناس متعاطفة معاه حبا وتمسكا بالأمل. وفيه ناس يائسة من الحياة وبالتالي كرهت نفسها والأخرين وعاوزينها تتحرق علي اللي فيها(والله بعض الناس دي نفسها تقتل نفسها وكل أسرتها!). وفيه ناس مسكونة بتفكير ضيق جدا علي موضوع ان الأستاذ ابراهيم عيسي اتكلم علي بعض الصحابة بقلة ذوقّ!<br />وأقول للمجموع الأخيرة هل الهدف من كلامه هو \"قلة الذوق\" أم تنوير الناس بفكرة الدكتاتورية ومتي وكيف بدأت وتوغلت داخل حياتنا واصبحت جزء لا يتجزأ من شخصيتنا؟<br />يا شباب مصر واملها الأستاذ ابراهيم عيسي يحاول جاهدا تنوير الناس بأصول المصائب اللي احنا فيها الأن؟ ومعرفة أصل الداء هو اهم وسيلة لعلاجه.<br />اعتقد ان الأستاذ ابراهيم عيسي نفسه عنده تفسير واضح جدا لماذا يمكن ان يهاجم من بعض الشباب اللي كاره النظام! وأعلم جيدا انه من السهل عليه أن يصل الي أصل هذا الداء فينا!<br />لا تعدموا المفكرين ولا تقتلوا من يستطيع أن يفدي نفسه من أجل نفع الكثير من الأخرين. لا لليأس ولا للأستسلام. انها حرب طويلة الأمد ولن تنتهي في أيام أو بضع سنوات ولكنها من السهل جدا أن تنتهي في ثواني عندما نقتل ما بداخلنا من بصيص الأمل.<br />واخيرا ولس اخرا<br />اذا عرف السبب السبب بطل العجب وعجبي!"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200115/http://masr.20at.com:80/article.php?sid=568"

