order = 0
subject = "حكم بحبس مصري أقام دعوى لمحاكمة مبارك وصحفيين نشرا عنها"
author = "TeGo"
posted = "2006-06-26"
text = "حكم بحبس مصري أقام دعوى لمحاكمة مبارك وصحفيين نشرا عنها<br />القاهرة (رويترز) - أصدرت محكمة مصرية يوم الاثنين حكما بحبس مواطن أقام دعوى قضائية لمحاكمة الرئيس حسني مبارك وتضمن الحكم حبس رئيس تحرير صحيفة نشرت عن الدعوى وصحفية بها.<br />وأصدرت الحكم محكمة الجنح ببلدة وراق العرب احدى ضواحي القاهرة الكبرى وقضى بحبس المواطن سعيد محمد عبد الله ورئيس تحرير صحيفة الدستور الاسبوعية المستقلة ابراهيم عيسى والصحفية سحر زكي لمدة سنة لكل منهم.<br />ويحق لثلاثتهم استئناف الحكم اذا دفع كل منهم عشرة الاف جنيه (1700 دولارا) كفالة لوقف تنفيذ الحكم.<br />وأقام الدعوى أمام محكمة جنح وراق العرب أربعة محامين ورجل أعمال وصاحب ورشة وعامل طالبين أقصى عقوبة لمقيم الدعوى ضد مبارك والصحفي والصحفية اللذين نشرا أنه أقامها أمام محكمة القضاء الاداري طالبا محاكمة مبارك وأفراد أسرته بزعم أنهم باعوا شركات القطاع العام بثمن بخس وبددوا المعونات الاجنبية التي حصلت عليها مصر في السنوات الماضية.<br />ونشرت الدستور موضوعا عن الدعوى في أبريل نيسان موضحة أن مقيم الدعوى يطالب أسرة مبارك برد 500 مليار جنيه قيمة شركات القطاع العام والمعونات الاجنبية.<br />ووجه المدعون للصحفيين ومقيم الدعوى ضد مبارك تهم السب والقذف والتحريض ضد الرئيس المصري والتطاول عليه واهانته.<br />وقال قاضي محكمة الجنح أسامة صلاح قبل النطق بالحكم ان ما نشر هو مما \"الت اليه القيم والاخلاق واندثارها بين بعض الاقلام الصحفية التي ارتبطت بنشر كل ما هو هدام لمجتمع يخطو نحو الحرية بخطى ثابتة في ظل مناخ ديمقراطي.\"<br />وأضاف \"القلة من أصحاب الاقلام والنفوس الضعيفة تستغل حرية النشر للاساءة للغير مثلما جاء في تلك الدعوى من اساءة واستغلال لحرية الكلمة... هذه الاقلام تعود كالس<br />اقرأ بقية التعليق .."
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200115/http://masr.20at.com:80/article.php?sid=568"

[[comments]]
