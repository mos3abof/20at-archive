subject = "عيسي و النظام"
author = "بسمه"
posted = "2006-07-25"
text = "النظام الذى يملك كت اجهزة الاعلام ووسائل النشر ويصدر عن مؤسساته مئات المطبوعات التي تنطق بلسانه وتمجد في عظمته و تخر ساجدة لحكمته والهيته وصحافته تعصرها كده تتساقط منها مقالات النفاق ويسيطر عليها المخبرين واللصوص لاتتحمل ابراهيم عيسي الصحفي المحترم صاحب القلم الحر والراىء المستقل لذلك هم يريدون ردعه وارسال رسالة لكل اصحاب الراىء الشرفاء ان هذا هو مكانكم السجن نظام مرتعش مرعوب فعلا اللى اختشوا ماتوا عقبالهم يارب"
