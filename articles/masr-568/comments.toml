subject = "لا تعليق"
author = "مروه"
posted = "2007-02-06"
text = "اى تعليق يمكن ان يقال مجرد لاشيىء لاكلمات تستطيع ان تخرج مابداخل كل مواطن مصرى حر يؤمن ببلاده ويبحث عن حقوقه المسلوبه وحريته المكبوته وخير بلاده الضائع بين ايادى السلطه<br />اؤيدك ياعيسى وكيف لااؤيدك وانت تعبر عن المظلومين والمعدمين والموتى على قيد الحياة فى هذا البلد المكظوم واهله<br />اعرف انك تعلم ان من رفعوا الدعوى ماهم الا ايدى خفيه من ايادى السلطه الظالمه الناهبه للبلد تحت عنوان الاصلاح الذى لايحدث والتطور الذى اصبح يعنى فى شرعها التقهقر والرجوع للخلف<br />تقدم ولا تتوقف وماضاع حق وراؤه مطالب"
