text = "بدأ النظام بأيمن نور ثم نعمان جمعة ثم وائل الابراشى ثم 0000000000(الشعب المصرى) والله لو يقدروا يجيبوا الشعب العربى كله كانوا عملوها<br />كل ما يريدونه ليس هؤلاء الأشخاص ولكن من مبدأ(دم الى اتكلمم و الى يتكلم اهو عرف الى فيها )لأنهم كان ممكن يلبسوهقضية رشوة أو اختلاس أو حشيش أو ما شابه لكن تهمت الكلام فى حد ذاتها مقصودة يعنى بيقولا الحدق يفهم"
