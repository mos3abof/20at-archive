author = "بلاش نخلي الهدف من الكلام حبا في الكلام! وده الفرق الكبير بين من يتكلم من اجل التنوير ومن يتكلم من أجل الكلام ذاته. بالله عليك يا مواطن مصر ومش عاوز تبقي مصري ايه الهدف من كلامك واسمك؟؟ أنا مصري و معي جنسيات أخري! وعشت بره مصر كتير جدا. بالله عليك انت لازم تجرب علشان تغير انتمائك تاني وتحب انك تبقي مصري؟"
