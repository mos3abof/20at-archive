author = "ميدوووووووووووووووووووووو"
posted = "2006-11-21"
text = "هذا هو مصير الشرفاء لانة ليس زمن الشرفاء فهو زمن العبيد والافقين والمدلسين زمن جمال وعلاء واحمد عز وكمال الشاذلى زمن الحرامية مية مية.<br />المشكلة يااستاذ ابراهيم انك بتنفخ فى اربة مخرومة والشعب اصبح عندة بلادة ولامبالاة والمشكلة الاكبر انك مش عايز تعرف ان احنا مش فلى بلد احنا باختصار فى عزبة صاحبها الباشا حسنى وولاد الباشا ومجموعة من الغفر والخولى والباقى هم الفلاحين الاوجرية يعنى الفلاح الى بيشتغل بلقمتة وياريت لقيها .عمرك شوفت فلاح اجير يحاسب الباسا ويسالة عن خير الارض واذا ماتجرء وحصل مصيرة معروف طبعا فخير العزبة للباسا وخدمين الباشا وعيال الباشا اما الشعب المسكين صاحب الخير فيكفية فخرا انة يعيش فى عزبة الباشاوانة تنازل وتعطف وتحنن ان يحكم هولاء الفلاحين .<br />ايها الفارس النبيل انزل من على حصانك واكسر سيفك وبوس القدو على غلطتك فى حقك الحمار والغنم وباقى الزريبة مع الاعتذار للحيوانات ."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121222814/http://masr.20at.com:80/article.php?sid=568"

