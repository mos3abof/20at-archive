subject = "نفسى أسأل سؤال"
author = "عابر القارات"
posted = "2006-06-29"
text = "نفسى أسأل سؤال محيرنى جدا و يا ريت الجميع يشاركونى فى البحث عن إجابة شافية يمكن الواحد يستريح و يقتنع باللى بيجرى و السؤال هو (هوه فين الرئيس من الكلام ده) يعنى ليه ما يطلعش و يواجهه أسئلة الشعب بجرأه و شجاعة و طبعا أقصد أسئلة الشعب الحقيقية مش زى أسئلة طلبة الجامعة التى بيجيبوها فى التلفزيون كل سنة اللى واحد من أمن الدولة يعمل نفسة طالب و يقوم يسأل الرئيس أسئلة معده سلفا هى و الاجابة بتاعتها لأ طبعا أقصد كل الاسئلة اللى بنسألها هنا فى ولاد البلد و فى المواقع التانية و صدقونى و الله لو الريس عمل كده و جاوب بشجاعة و صراحه على الاسئلة دى ده هيزيد من شعبيته جدا جدا و هيسد الطريق على المعارضة و هيصعب مهمتها جدا و للاسف اللى كان أستاذ فى الموضوع ده كان الرئيس (بالرغم من معارضتى الشديدة لسياساته و أفعاله هو و زبانيته ضد كل رأى حر) الا انه كان بيطلع فى وسط الشعب و من شرفة القصر الرئاسى و يتكلم لغه بسيطة الناس كلها بتفهمها بالرغم من نبرة الغرور و عدم الاحساس بالحجم و الكارثة الحقيقية اللى كانت مصر فيهاإلا انه إكتسب بالطريقة دى حب المصرى البسيط اللى طبعابيمثل 90% من سكان مصر لكن للاسف الريس و رجالته الاشاوس فضلوا طريقة الجبناء و هى المواجهه بدلا من المواجهه الصريحة و الحقيقية مع الشعب إختاروا المواجهه من وراء العربات المصفحة بتاعة الامن المركزى و كلاب امن الدولة"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103074035/http://masr.20at.com:80/article.php?sid=568"

