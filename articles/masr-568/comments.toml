text = "ياجماعة حرام عليكو تظلموا أحسن رئيس في الدنياالسيد/ حسني مبارك وأولاده اللي زي العسل السيد/ جمال والسيد/ علاء اللي عايشين عيشة زي الزفت ومس لاقيين شغل ياعيني ولا عارفين يكونوا نفسهم علشان يتجوزوا وبيناموا كل يوم هماوأبوهم وأمهم الغلبانة ماما سوزان من غير عشاء علشان حالتهم المادية وحشة إنتوا ماشفتوش جمال يادوب لسع خاطب من فترة قصيرة علي ما لقي حد يرضي بيه علشان ظروفه وحشة ومش لاقي شقة يتجوز فيها"
