subject = "لا تعليق"
author = "مصرية"
posted = "2006-06-26"
text = "مواطن يرفع قضية على رئيسه يحاسبه يدخل السجن<br />صحفى ينشر الخبر يدخل السجن<br />رئيس وزراء يسب الشعب كله محدش يحاسبه<br />وزير يحرق الناس فى المسارح ميتحاكمش<br />عضو مجلس الشورى يغرق الناس ف البحر ندافع عنه ونهربه بره البلد<br />إيييييييييه أكمل ولا كفاية<br />ضاقت فلما استحكمت حلقاتها فرجت وكنت أظنها لا تفرج"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200115/http://masr.20at.com:80/article.php?sid=568"

[[comments]]
order = 2
subject = "تهمةواحدة لاتكفى"
author = "أبو أسامة"
posted = "2006-06-26"
text = "يا ريت بدام فيهاسجن يا استاذ ابراهيم<br />كنت قلت على بقيت التهم وذيد عليها كمان<br />ان الراجل كبر وخرف والمفروض يتحجر عليه<br />لأنهعدى السن القانونى للحكم والمفروض يرموه للقطط .معلش يا مواطن ماهوالى يقول الحق فى البلد دى يسجنوه وزى ما فيه قضاة محترمين فيه كمان قضاة مرتشين وموالسين<br />واهم لسة بيبيعوا فى البلدطول ما اصحبها<br />ساكتين ويا ريت كل الناس تبقى زيك يا اشرف مواطن .<br />وآه.يا بلد<br />باعك كلاب لكلاب<br />باعوكى بارخص تمن<br />والشارى كان كداب<br />لادفع صحيح الثمن<br />ولا شغل الشباب<br />وعجبى....."
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200115/http://masr.20at.com:80/article.php?sid=568"

