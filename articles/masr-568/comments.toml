[[comments]]
order = 25
subject = "وش كشوف"
author = "المؤرخ المصري"
posted = "2006-06-28"
text = "بتخبي وشك ليه يا بلد لما دراعاتك مكشوفة<br />حتداري ايه بعد اللي انكشف للأسف حومتنا مفضوحة<br />عل الجزيرة والاوروبي واللي ليه ومالهوش<br />مش عارفة جرى لنا ايه كل السطور محذوفة<br />بفعل فاعل يا بلد<br />واللي اتسجن ولدك<br />واللي يغيظ ويغل اللي حكم ولدك<br />حرام عليكوا بجد<br />كل الحصون تندك<br />ولما الأوان يجي<br />والسجون تنفك<br />مين اللي حيضرب في مين<br />ومين على دماغه حينسك<br />ومين من التاريخ<br />اسمه حيتمحي<br />حرام عليكوا بجد<br />دا ابليس يستحي"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200115/http://masr.20at.com:80/article.php?sid=568"

