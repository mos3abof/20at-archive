[[comments]]
order = 47
subject = "مش كلنا مظلومين"
author = "احمد صلاح"
posted = "2006-11-01"
text = "مش كل الناس فى مصر مظلومين طبعا لازم فى ناس استفادت من الفساد الى فى النظام عشان كده مش عايزين نستغرب لما نلاقى ناس بتدافع عن النظام عشان هما استفادو منه وياريت مفيش حد يقول الدين والضمير عشان المصلحه هى الى بتحرك الناس فى مصر .مثلا الى بيهاجم رؤساء التحرير بتوع الجرائد القوميه ليه ؟ هل هما مستنيين منهم انهم يسبو الرئيس طبعا لا والف لا هو فى حد يسب ولى نعمته ياريت نفهم الى بيحصل وسطينا.لو حبينا نقسم الشعب المصرى بصراحه وبدون مجامله او تحامل حنلاقى 30% مع النظام منهم المستفيد ومنهم الى بيعمل الحاجه دى خضوع وعدم قدره على المواجهه وبعد المشكله ان ال 30% دولا قادرين على السيطره على نص الشعب على الاقل سواء بالترهيب وبالترغيب .<br />اذا كان فى حد معترض على كلامى ياريت نسأل نفسنا سؤال هو ممكن يكون خبيث شويه احنا لو كنا مكانهم كنا حنعمل زيهم .<br />انا اتمنى ان الرساله دى اشوفها على الموقع بس خايف انها تتمنع عشان بقول الحقيقه.<br />اتمنى التواصل على الايميل معكم<br />e mail:fighter_007_1984 @yahoo.com<br />السلام عليكم ورحمه الله وبركاته"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103074035/http://masr.20at.com:80/article.php?sid=568"

[[comments]]
