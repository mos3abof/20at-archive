[[comments]]
order = 56
subject = "من هم حكامنا"
author = "ضيف على مصر"
posted = "2006-11-25"
text = "اليس حكامنا ومن يحتكرون كل مكاسب البلد مصريين ... اليسوا منا ونحن منهم .. من تركهم يعملون هذا .. ااجانب ام مصريين؟ العيب فينا نحن الذين مكناهم منا .. لكن نحن وثقنا فيهم واعطيناهم الا مانة والحمد لله حفظوا الامانة وصانوها .. برضا من كل مصرى .. هل تنسون نتائج الاستفقتاءات على الرياسة 99.9 % بكل ثقة وبكل حب من المصريين للحاكم ومن يتبعه .. وبمنتهى النزاهة والشفافيه !! وقد تحملوا المسئولية حتى اخر نفس (الريس ماكانش عارف يقراها صح وهو بيلقى خطاب العرش لانه مكتوب له وعليه ان يقرأه فقط)واحنا مالنا هوكان فيه حد فينا رئيس جمهورية ؟ مادام الحاكم يملك كل القوة فعلى الدنيا السلام . ومادامت الحاشية فاسده فلا فائدة .. الكراسى بتغرى اى انسان نفسه ضعيفه وتوهمه بانه ملك الارض ومن عليها .. والمال يغوى اى جبان ناهيك عن السلطان .. لو علم هؤلاء الطغاه انهم سيدخلون القبور بلا سند ولا مال وسيحاسبون على كل ذلك لتابوا الى الله ، لكنى اعتقد انهم لا دين ولاايمان لهم ولنا الله اولا واخيرا هو مفرج الكروب ، ودولة الظلم ساعة.. ودولة الحق الى قيام الساعة نسال الله ان يتولى الشعب المصرى وجميع الشعوب العربيةبرحمته الواسعة .. فليس لنا الاهو ينصرنا على القوم الظالمين وحسبى الله ونعم الوكيل"
archived = "2006-12-03"
capture_url = "https://web.archive.org/web/20061203012154/http://masr.20at.com:80/article.php?sid=568"

[[comments]]
order = 57
subject = "الامر لله وحده"
author = "تعيس"
posted = "2006-11-26"
text = "تعيس كل من يعيش على ارض مصر فى هذا العصر ، فالابتسامات ولت ، والسعادة اندثرت ، الا عند اسياد البلد اصحاب الجاه والسلطان ،، ولكن هذا ماجنيناه على انفسنا ،، فالكل لايفكر الا فى نفسه والذى يقدر على اى حاجة لمصلحته يعملها وعلى الدنياالسلام وكفايه بقى زعيق وتهبيل احسن ماعاد لها اى لازمة ،، لااحد يسمع ولا احد ينصت وودن من طين وودن من عجين ،، واى موضوع هايف بيشغلونا به ،، فاروق حسنى .. .. الخ حتى نجذ مايشغلنا واهى ماشيه والسلام ،،الى ان ياذن ربك فهو وحده عنده الفرج"
archived = "2006-12-03"
capture_url = "https://web.archive.org/web/20061203012154/http://masr.20at.com:80/article.php?sid=568"

[[comments]]
order = 58
subject = "خير الكلام"
author = "ِاحمد حمدى"
posted = "2006-11-29"
text = "وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنْتُمُ الْأَعْلَوْنَ إِنْ كُنْتُمْ مُؤْمِنِينَ (139) إِنْ يَمْسَسْكُمْ قَرْحٌ فَقَدْ مَسَّ الْقَوْمَ قَرْحٌ مِثْلُهُ وَتِلْكَ الْأَيَّامُ نُدَاوِلُهَا بَيْنَ النَّاسِ وَلِيَعْلَمَ اللَّهُ الَّذِينَ آَمَنُوا وَيَتَّخِذَ مِنْكُمْ شُهَدَاءَ وَاللَّهُ لَا يُحِبُّ الظَّالِمِينَ (140) وَلِيُمَحِّصَ اللَّهُ الَّذِينَ آَمَنُوا وَيَمْحَقَ الْكَافِرِينَ (141) أَمْ حَسِبْتُمْ أَنْ تَدْخُلُوا الْجَنَّةَ وَلَمَّا يَعْلَمِ اللَّهُ الَّذِينَ جَاهَدُوا مِنْكُمْ وَيَعْلَمَ الصَّابِرِينَ.<br />وقال الله عز و جل<br />لا تشغلوا انفسكم بالدعاء على الملوك و لكن اشغلوا انفسكم بدعاء ملك الملوك يكفيكم ملوككم."
archived = "2006-12-03"
capture_url = "https://web.archive.org/web/20061203012154/http://masr.20at.com:80/article.php?sid=568"

[[comments]]
order = 59
subject = "خليها تخرب بقى"
author = "كاميلا"
posted = "2006-11-30"
text = "بجد يا عم عيسى .. انت كدة غلطان انت والصحفية كمان .. قلتلى ليه ؟؟ اقللك انا ليه ؟؟<br />انت ليه مكملتش باقى الجرايم اللى عملها واللى ارتكبه فى حق الشعب المصرى باكمله .. بصراحة انا لما بشوف صورته فى اى مكن بتف عليه بحس انى هرجع بتارف بجد منه .. مش طايقاه .. مش عارفة هو ازاى راضى على نفسه انه يتهزء وعارف كويس اوى ان الشعب مش طايقه ومش عايزه ومع ذلك تحس انه جبلة ومفيش فايدة مهما قلت انك مش عايزه برضه غتت مفيش فايدة .. يللا ادعو معايا ربنا ياخده ويحرقه فى ناره .. والله هو نسى ان فى حساب ونسى ان فى نار مستنيه بفارغ الصبر علاشن تاكله وتحرق فيه وهى بتللذذ .. هو مشافش الناس عاملة ازاى .... لاحول ولا قوة الا بالله ؟؟"
archived = "2006-12-03"
capture_url = "https://web.archive.org/web/20061203012154/http://masr.20at.com:80/article.php?sid=568"

