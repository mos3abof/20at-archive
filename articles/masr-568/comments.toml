[[comments]]
order = 51
subject = "فاكس إلى الرئيس مبارك"
author = "احمد حجازى"
posted = "2006-11-14"
text = "يا سيادة الرئيس<br />نقول لك إذا كان القدر قد جعل منك رئيساعلينافهو لسوء حظناوهذا عن تجربه.<br />يا سيادة الرئيس:<br />* عينت من قيادات أمن الدولة وزراء و محافظين علينا.<br />* حاكمت القضاه و الصحفيين وزورت انتخابات مجلس الشعب و حبست كلا من : أيمن نور، نعمان جمعه، د.عصام العريان، د. محمد مرسى، وتحاكم اليوم إبراهيم عيسى، وهذا المصير ينتظره الكثير والكثير ممن هم يسيرون فى طريق الاصلاح.<br />* إذا كان يحميك اليوم الأمن فمن يحميك غدا من الله الجبار.<br />* يا سيادة الرئيس \" إن الله يمهل كانه يهمل فإذا أخذ الظالم لم يفلته ، وإذا دعتك قدرتك على ظلم الناس فتذكر قدررة الله عليك.<br />* ولو دامت لغيرك ما وصلت إليك \" والله غالب على أمره ولكن أكثر الناس لا يعلمون \".<br />** هذا الفاكس من كل شعب مصر**"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121222814/http://masr.20at.com:80/article.php?sid=568"

