subject = "زمن المنشورات قرب"
author = "كوش النوبى"
posted = "2006-11-05"
text = "انا حاسس اننا هنرجع تانى لزمن المنشورات والخلايا السريه وحجات من بتاعت الاحتلال<br />الانجليزى ربنا يخرب بيتك يا مبارك واشوف فيك يوم انت وعيالك وام قويق مراتك<br />مش عارف هتعمل فينا ايه تانى الله لا يرحمك دنيا ولا اخره منتظر اليوم اللى هيبقى الشعب كله فى حاله ذهول يوم موتك<br />مش هنبقى مصدقين ده لو مت من اصله منظر اهلك هيحنطوك فى ميدان رمسيس<br />يارب ابنك يموت عشان نشوف هتسيب البلد لمين ومراتك ام بذ واحد دى ربنا يحرقها كده خلت البلد كلها مجالس امومه وطفوله ومراة وشويه رعايه الكلاب الضاله ياولاد الكلب الله يحرقكم خربتو البلد"
