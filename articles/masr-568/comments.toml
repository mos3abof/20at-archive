subject = "يا أطهر الرجال"
author = "نهاد"
posted = "2006-09-14"
text = "يا عيسى دائما الأشجار المثمرة تلقى بالحجارة ولكن النباتات الشيطانية تنبت على مياه المجارى ولا أحد يقترب منها فلا تحزن ولتعرف أن الشعب كله معك ولكن أنت تمتلك الكثير لكى تنقذ المصريون من فساد الحاكم وحثالته فلا تتهاون فجرائدك هى أصوات الشعب العالية المطالبة بالتحرر من اللامبارك وعائلته ليفضح على الملأ على كل أفعاله القذرة وأهمها قتله للسادات ولرفعت المحجوب وخيانتاته لمصر وعمالته لليهود والأمريكان فأنت صوت الحق والشعب ولا تتهاون فى مسئوليتك التى خولها لك الشعب وأمنك عليها والله يحفظك من كل أذى ويرعاك"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103074035/http://masr.20at.com:80/article.php?sid=568"

