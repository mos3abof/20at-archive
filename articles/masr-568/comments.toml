[[comments]]
order = 21
subject = "المشنوق اعلاة"
author = "احمد مطر"
posted = "2006-06-28"
text = "مَـرّةً، فَكّـرتُ في نشْرِ مَقالْ<br />عَـن مآسي الإحتِـلالْ<br />عَـنْ دِفـاعِ الحَجَـرِ الأعـزَلِ<br />عَـن مدفَـعِ أربابٍ النّضـالْ !<br />وَعَـنِ الطّفْـلِ الّذي يُحـرَقُ في الثّـورةِ<br />كي يَغْـرقَ في الثّروةِ أشباهُ الرِّجالْ !<br />قَلّبَ المَسؤولُ أوراقـي، وَقالْ :<br />إجتَنِـبْ أيَّ عِباراتٍ تُثيرُ الإنفِعـالْ .<br />مَثَـلاً :<br />خَفّـفْ مآسـي<br />لِـمَ لا تَكتُبَ ماسـي ؟<br />أو مُواسـي<br />أو أماسـي<br />شَكْلُهـا الحاضِـرُ إحراجٌ لأصحابِ الكراسي !<br />إحـذِفِ الأعـْزَلَ ..<br />فالأعْـزلُ تحريضٌ على عَـْزلِ السّلاطينِ<br />وَتَعريضٌ بخَـطِّ الإنعِـزالْ !<br />إحـذِفِ المـدْ فَـعَ ..<br />كي تَدْفَـعَ عنكَ الإعتِقالْ .<br />نحْـنُ في مرحَلَـةِ السّلـمِ<br />وَقـدْ حُـرِّمَ في السِّلمِ القِتالْ<br />إحـذِفِ الأربـابَ<br />لا ربَّ سِـوى اللهِ العَظيمِ المُتَعـالْ !<br />إحـذِفِ الطّفْـلَ ..<br />فلا يَحسُـنُ خَلْطُ الجِـدِّ في لُعْبِ العِيالْ !<br />إحـذِفِ الثّـورَةَ<br />فالأوطـانُ في أفضَـلِ حالْ !<br />إحـذِفِ الثّرْوَةَ و الأشبـاهَ<br />ما كُلُّ الذي يُعرفَ، يا هذا، يُقـالْ !<br />قُلتُ : إنّـي لستُ إبليسَ<br />وأنتُمْ لا يُجاريكُـمْ سِـوى إبليس<br />في هذا المجـالْ .<br />قالّ لي : كانَ هُنـا ..<br />لكنّـهُ لم يَتَأقلَـمْ<br />فاستَقَـالْ !"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200115/http://masr.20at.com:80/article.php?sid=568"

[[comments]]
order = 22
subject = "كلنا خونة وعملاء بالميلاد؟"
author = "مجنون خطر بالعباسية"
posted = "2006-06-28"
text = "عايزين قادة من كوكب أو مجرة تانية! قبل ماينط حد منكم في كرشي ويقول ياقليل الأدب يا محبط، يا تعليم الغرب، أرجوكم تسمعوا كلام المجنون اللي هو أنا، وتعقلوني:<br />حقيقة تاريخنا كله مزور من الفراعنة لغاية أن يشاء الله، مين اللي كتب لنا تاريخ الفراعنة؟ الجواب عندي حاضر، بس أحب أسمعه منكم ياعاقلين؟ أوعوا تقولوا مصريين لأضحك عليكم أنا وزملائي في العباسية.<br />طيب حكاية عرابي\" لن نورث بعد اليوم!\" تعرفوا إن الإنجليز خلقوها من العدم، علشان يبرروا تدخلهم لحماية خليفة المسلمين ضد المتمرد عليه الفلاح الفلح عرابي أفندي. كله كذب وإذا حصلتم بصعوبة على مذكرات عرابي أو سامي البارودي مش حتلاقوا حكاية\"لسنا ثراثا وعقارا!\" دي، إزاي الكلام ده؟ كويس ياعرابي ماطلعوك شيوعي، دعا الوالدين الشيوعية وقتها ما كانوش إخترعوها.<br />الزعيم سعد زغلول اللي فلقونا بوطنيته و..و..و، لما أقرا في مذكراته إنه كان يفضل من العصر لمنتصف الليل يلعب البوكر مع الإنجليز في نادي الجزيرة أو في عوامة......، يبقى أقول إيه؟<br />النحاس هو مش خيار إنجليزي فرض على الملك فاروق بالدبابات الإنجليزية في فبراير إتنين وأربعين.<br />ولما نصدق الإخوان المسلمين يبقى كمان الزعيم عبد الناصر الله يرحمه، عميل إنجليزي أمريكي إسرائيلي مهمته إعدام الشهيد سيد قطب وخلاص.<br />اللي بعد عبد الناصر من الحلاليف مايستهلوش أذكرهم والكل عارفهم، السؤال:\" هي مصر مطلعش أبدا قائد أو زعيم وطني وشريف؟\"<br />منين نستورد واحد نظيف شريف ووطني؟ من أي كوكب؟ من أي نجم؟ من أي مجرة؟"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200115/http://masr.20at.com:80/article.php?sid=568"

