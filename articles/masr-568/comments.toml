posted = "2006-07-24"
text = "الاخوة الافاضل السلطة مسيطرة على كل مؤسسات الدولةحتى القضاة بيحكمو بناء على تعليمات الا قلة شرفاء انتفضو فضربهم الامن بالجزمةالاخوة الافاضل ما اشبة اليوم بالبارحة فساد واستغلال نفوز ومركز قوة= النكسة اماابرهيم عيسى هزا الشريف المحترم دخولك السجن فى هزا العهدشرف لك ولامسالك"
