subject = "عيسى عيسى عيسى"
author = "مواطن مفروس"
posted = "2006-06-27"
text = "الموضوع من الاخران ابراهيم عدى الخطوط الحمراء والخطوط دية فى عقول اللى ماسكين العصايا من النص نهاجم نظيف والشوية الموظفين اللى بنسميهم مجازا وزراء اوكية نعيب فى الذات الملكية لا والف لا واهى كلها بطولة على شوية موظفين لابيهشوا ولا بينشوا ابراهيم مشكلتة انة مصدق انة فية امل ان الشعب يصحى وياخد حقة وحريتة بنفسة اشرب بقى يا عم ابراهيم ياخى سيبك من المسكوت عنة وتحريك الاموات وكل عيش وبقلاوة وجاتوة كمان لو حبيت شوفواتعلم من عبداللة كمال وكرم جبر اللعب الصح نوم العازب عجين الفلاحة واةيابلدبقى فيك القرداتية بهوات ورؤساء تحرير كمان والليل الليل الليل يا ميمون وكل ميمون عارف لعب صاحبة"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200115/http://masr.20at.com:80/article.php?sid=568"

