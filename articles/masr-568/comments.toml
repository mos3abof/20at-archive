subject = "مع ابراهيم عيسى ضد الزبانية"
author = "اسامة"
posted = "2006-06-28"
text = "اللى حصل لابراهيم اثبت ان الزبانية بتوع سلطان مصر منتشرين وواصلين ، و ان مفيش تقدم ولا حرية رأى لكن الواقع اننا غصب عنهم هنوصل لهدفنا و الشباب مبشرين بوعى و فهم للخطة الحقيرة بتولى الحرامى الاكبر جمال للحكم لكن كلنا هنقف ومش هنسكت ، و على فكرة انا طالب اعلام و مثلى الاعلى هو ابراهيم الشريف و لو كعرفش هو يوصل لهدفه ففيه كتير من الشباب هيكملوا مشوار الاحتجاج لحد ما يروح حكم مبارك فى مزبلة التاريخ هو و عيلته اللى ناهبة البلد و مودياه فى داهية"
