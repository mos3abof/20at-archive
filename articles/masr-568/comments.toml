[[comments]]
order = 71
subject = "يا حكومة الناس عرفت كل حاجة"
author = "مختار"
posted = "2007-02-07"
text = "أحب أقول للحكومة ومن يزينوا لها الباطل من صحفيين غير محترمين لوظيفتهم إن الناس عرفت كل حاجة حتى شوفوا الإحصائيات دى<br />يشير تقرير هيئة الشفافية الدولية إلى تراجع ترتيب مصر في مكافحة الفساد من المركز 41 إلى 44 إلى 77؛ حيث بلغ حجم الفساد 69% من التعاملات بمعدل 70.000 قضية فساد سنويًّا (قضية فساد كل دقيقتين).<br />* يشير التقرير الاقتصادي لوزارة الخارجية المصرية إلى أن تأسيس شركة في مصر يحتاج 34 يومًا بخلاف 180 يومًا للموافقة الأمنية، في حين أن 48 ساعة كافية في الأردن لإتمام نفس الشركة، وفي حالات التقاضي لإنهاء العقود في مصر 410 أيام، وفي تونس 240 يومًا وفي المغرب 27 يومًا.<br />* يشير مؤشر الإفصاح وإتاحة المعلومات (لدراسات الجدوى للمشروعات الاقتصادية) والذي يتراوح من 1: 10 إلى حصول مصر على 5 درجات والكاميرون وزيمبابوي والجزائر على 8 درجات، في حين حصلت زامبيا وتايلاند على 10 درجات.<br />كل هذه القيود والمفاسد أدت إلى:<br />* هروب 200 مليار دولار خلال ربع قرن (تصريح للدكتور عزيز صدقي).<br />* تضخُّم الدَّين الخارجي إلى 36 مليار دولار.<br />* تضخُّم الدَّين المحلي إلى 600 مليار جنيه.<br />* انخفاض الاستثمار الأجنبي بنسبة 40% في الفترة (2003/2005).<br />* هروب الاستثمار الوطني للخارج بنسبة 550% (من 47 مليارًا إلى 264 مليار جنيه).<br />* تراجع ترتيب مصر بين الدول الجاذبة للاستثمار إلى الترتيب 108 من 140 دولة.<br />وفي الأيام القليلة الماضية وعلى خلفية قرار النائب العام بالتحفُّظ على أموال 29 قياديًّا من الإخوان المسلمين تم الآتي:<br />* هروب 21 مليار جنيه خارج البلاد.<br />* تراجع الودائع بالجهاز المصرفي وزيادة معدل التضخم 12.4%.<br />* تزايد العجز في الميزان التجاري إلى 747 مليون دولار.<br />* تراجع<br />اقرأ بقية التعليق .."
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212040552/http://masr.20at.com:80/article.php?sid=568"
