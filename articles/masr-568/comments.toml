[[comments]]
order = 28
subject = "اقررررب .. اقرررررررررررب"
author = "هانيبال"
posted = "2006-06-28"
text = "مش عايزين نشتت نفسنا والنبي وكل من له نبي يصلي عليه ..<br />اولا ..<br />مطلوب التخلص من قادة العصابة الاتي اسمائهم..<br />1 صفوت الشريف ( عزيزة سابقا )<br />2 جمال مبارك ( عشان نشطب ونخلص بقى )<br />3 احمد عز ( عشان نحرم جمال من كيفه )<br />4 عاطف عبيد ( مع ملاحظة منظر شفايفه )<br />ثانيا..<br />يجب الدعوة لثورة شعبية شاملة في كل محافظات مصر ومهما تكن النتائج وعشان تستريحو يعني من الاخر كده حسني مبارك لابد وتابت ومش هايطلع ولا بالطبل البلدي يعني الكلام مفيش منه فايدة ولا عايدة .. القوة هي اللي هاتغير البلد دي وتغير شخصيتها الازليه الابدية المكتوبة على قفا اهالينا من ايام سيدنا عكروت .. وبالنسبة للاخوة اللي بيكتبو شعر وهجاء وكده .. احب اقولهم ان الكلام مع الاشكال الكافرة دي مالوش لزمة .. يعني لا بيصد ولا بيرد وده عبط وهبل وقلة حيلة .. عايز تعمل حاجة يابابامنك له بطل تكتب شعر خالص اليومين دول واحسن ليك ولينا تلم اصحابك وحبايبك وجيرانك وتشرحلهم وتعرفهم وتبصرهم وتسخنهم عشان هوب كرسي في الكلوب الليلة تتلم ونحصد مصر في اوانها قبل ما الغلة تموت وتعفن واحنا نموت من الجوع او ناكل بعض ( رغم اننا بقينا بنكره بعض لدرجة العمي من الجوع الحرمان ) .. وواحدة واحدة نمسح الايام السودا باستيكة والرئيس اللي جاي واللي بعده يعملو حساب الناس ويعرفو ان الله حق وانهم مش بيصرفو من جيوب اهاليهم ( مع ملاحظة ان جميع اهالي رؤساء مصر كانو على فيض الكريم ) .. يا رجالة مين موافق على الكلام ده .. ؟؟ طيب اللي موافق يرفع ايده ..<br />عمكم هانيبال"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103074035/http://masr.20at.com:80/article.php?sid=568"

[[comments]]
order = 29
subject = "مبارك =الدمار لشعب مصر الصامت اللى ارجل واحد فيهم اسمو العيل"
author = "بيبو"
posted = "2006-06-28"
text = "اجبن شعب واوسخ رئيس وازبل حكومة حكومة مصر لا تتوقعو ان قامت الحرب انا تجدو رجال يدافعو عن مصر فلا يوجد رجال وانا اولهم الحكومة جعلت منا جبنا لانستطيع الا السكوت او الخناق مع بعضنا البعض ومن كتر الظلم خلاص انا نفسى اسافر او اموت او اغور فى ستين دهية من حكومةمصر والظلم اللى فى مصر والرئيس اللى بيحرك الناس زى الحمير وبيسجن ايمن نور وبيضرب القضاة وبيضرب الشعب انا كل طموحاتى ضاعت فى البلد الوسخة دى بسبب الرئيس او الملك والحاشية الوسخة (على فكرة انا المفروض مهندس اتصالات )ههههههههههه كان نفسى ابويا وامى ميخلفونيش عشان انا بقعد جمبهم فى البيت زى البنت وكل ماروح شغل يقولى عايزين خبرة او عايزين بنت عشان ماما سوزان قالت نشغل البنات طيب كوس ام سوزان على مبارك"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103074035/http://masr.20at.com:80/article.php?sid=568"

[[comments]]
order = 30
subject = "تحية طيبة للجميع وخاصة مجنون العباسية وهاني وبيبو!"
author = "متابع"
posted = "2006-06-29"
text = "إخواني، كويس جدا إننا نبتدي نحس ضعفنا وخوفنا وفزعنا من نظام غبي مفلس وعديم الوسائل، وأحب أطلب من الإخوة التركيز على القضايا التالية في النقاش لأهميتها القصوى:<br />أولا: تحليل مواطن القوة والضعف في شخصية المصري. ليه المصري سلبي وساذج وخواف وقليل الوعي والتقافة. فيه طرق علاج ناجعة وسريعة لمعالجة هذه الأمراض؟ إيه هيه؟<br />ثانيا: أهم مشكلة تواجهنا وتدفعنا للتبعية والعبودية هي الديون الخارجية التي تتجاوز 800مليار دولار، واللي لو حسبانها راح نجدها مجموع ثروة بس عشرة من اللصوص الكبار في البلد زي الريس نفسه وأنجاله وطلعت وعزت السادات وزفت عز ..الخ. هل لو قامت ثورة شعبية أو من الجيش، يمكن تحصيل هذة الأموال المسروقة من الحسابات السرية في الخارج لتسوية الديون، وماتنسوش إن فوائد هذة الديون فلكية وتزايد بإستمرار.<br />ثالثا: هل هناك رؤيا واضحة لإنهاء التبعية الأمنية والعسكرية لأمريكا؟ إحنا بنحتاج من جديد لحليف قوي يزودنا بالسلاح والعتاد وبغطاء سياسي دولي. مين هو البديل؟ وقبل كده هل إخراج الأمريكان من مراكز السيطرة في البلد وقواتنا المسلحة أمر ممكن؟ هل راح يتم بالسهولة اللي خرج بيها الروس بقرار السادات؟<br />رابعا: هل يوجد حزب أو حركة شعبية لديها برنامج أو حتى تصور لحل البنود الثلاثة الأولي؟<br />إذا كان الجواب بالنفي فلن يجدي أبدا إعدام مبارك وعائلته في ميدان التحرير. وصلتكم الرسالة يا إخوان؟"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103074035/http://masr.20at.com:80/article.php?sid=568"

