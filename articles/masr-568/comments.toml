text = "هل تفتكروا تغيير مبارك حتفرق فى حاجه<br />هل تعديل قيادات الاحزاب حتصحصح الاحزاب<br />هل تغيير الوزراء حتصلح الكون<br />ابدا ابدا<br />حسنى مبارك وشلته منج مصرى<br />الحكومه اعضاؤها منتج مصرى<br />النواب منتج مصرى<br />المحافظون منج مصرى<br />ضباط الشرطه الامثال مكافحه المخدرات نتج مصرى<br />ضابط الاموال العامه النصاب منتج مصرى<br />الذين سلقوا موضوع عمر افندى منتج مصرى<br />اللى بي بيعوا البلد مصريين<br />طلعت السادات ابو جزمه منتج مصرى<br />احمد عز ابو سيخ حامى منتج مصرى<br />الخصخصاويه منتج مصرى<br />اللى طبخوا لممدوح اسماعيل منتج مصرى<br />احنا بهبلنا وخيبتنا وضعفنا نستاهل كل اللى جرالنا ونستاهل الضرب بالجزمه احنا لو كنا نستاهل ما كان ربنا ادانا وكرمنا<br />لاكن احنا منستاهلش رحمه ربنا علشان كده بى مرمط كرامتنا بنمتجاتنا الخايبه<br />الشعب المصرى جبان طول عمره حتى ربنا سبحانه وتعالى ارسل سيدنا موسى من دون الانبياء قال له اذهب الى فرعون انه طغى \" كانه بقوله سيبك من المصريين دول ورا فرعونهم عميانى<br />جتكم ده كلكم وانا معاكم"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200115/http://masr.20at.com:80/article.php?sid=568"

