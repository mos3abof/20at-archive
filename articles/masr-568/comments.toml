[[comments]]
order = 16
subject = "هانيبال حاسس بالاكتئاب شويتين"
author = "هانيبال"
posted = "2006-06-27"
text = "صفوت الشريف<br />عاطف عبيد<br />جمال مبارك<br />بشار الاسد<br />مطلوب التخلص منهم باقصى سرعة وباي شكل عشان هانيبال يستريح ويقدر ينام شوية .. اما ابراهيم عيسى فهو راجل يستحق الحبس في حالة واحدة بس هي ان الحبس للرجالة .. والقضاة ربنا يلطف بيهم ويكشف عنهم الحجاب عشان يشوفو المنصوب لهم ويعرفو ان المعركة ( في كل الحالات ) فيها فايز ومهزوم .. والمهزوم طبعا هو اللي يتخلى عن اهدافه من ورا دخول المعركة .. اختار يا زكريا يا عبدالعزيز من بين القوسين ( فايز ولا مهزوم ) ؟؟<br />اما المصريين فهما عبيد ابناء عبيد احفاد عبيد ودي حقيقة مش اشاعة والمثل المصري بيقول ( ضرب الحكومة شرف ) طيب ليه يا ولاد ال.... وايه الشرف اللي ياخده قفاك من ايد مخبر خباص بتلاتة تعريفة ؟؟ طيب فيه امل في البلد دي ولا فيه عمر ؟؟ الحضارة الفرعونية بتقول فيه امل .. لكن صفوت الشريف بيقول ان فيه انشراح وجمال مبارك بيقول فيه احمد عز .. خش برجالتك يا فرج .. بقولكم ايه من الاخر كده .. اللي موافق على ان الامل الوحيد لينا كلنا يا مصريين هو الثورة الشعبية يكتب ده ويقول الثورة هي الحل في كل مكان وفي كل سايبر .. وكفاية خوف بقى ..<br />عمكم وسيد جمال مبارك ( هانيبال )"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200115/http://masr.20at.com:80/article.php?sid=568"

