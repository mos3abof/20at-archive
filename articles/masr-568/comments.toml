text = "لكل انسان حق النقدلكن مايمز الصحفى عن الشخص العادى ان يكون نقدة هادفا ومجردا من اى مصلحةالا للمصلحة العامة فقط ولايعنى النقد ان يكون بالسب والقذقف بل يجب على الصحفى المتمرس ان ينأئى بنفسة عن هذا وقد قال الله للحبيب المصطفى ( ولو كنت فظا غليظ القلب لنفضو من حولك)وهنايكمن سرالدعوةواسلوب الخطاب يعلمنا ربنا تبارك وتعالى وكما قال الحبيب المصطفى انزلو الناس منازلهم اذا ابراهيم عيسى لم يتعلم شىء"
