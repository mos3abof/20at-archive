author = "سلمى من المغرب"
posted = "1999-11-30"
text = "كل عام وانتو بخير وبتمنى للموقع المزيد من التميز لأنو الموقع اللي كنت ابحث عنو من زمان ولقيتو.<br />بتمنى تواصلو مجهوداتكم والله يوفقكم<br />بعايد على كل قراء ومعلقي موقع عشرينيات كل عام وانتو بألف خير"
archived = "2009-05-16"
capture_url = "https://web.archive.org/web/20090516054928/http://www.20at.com:80/7ayatna/2970.html"

[[comments]]
order = 1
subject = ""
author = "سلمى من المغرب"
posted = "1999-11-30"
text = "هناك بعض الرسائل الالكترونية اللتي تبعث على شكل تذكير بضرورة ذكر الله عز وجل او التنبيه الى تصرفات غير لائقة او نقرأ احيانا مقال يذكرك بأصداقك. ويكون لكتير من هذه المقالات وقع على النفس وهي تنتشر بسرعة كبيرة . اذ يكفي ان تكتب ابعث ل 10 شخاص فتسمع خبرا جيدا أو تثبت لصديقك بأنك وفي فتنتشر الرسائل واللتي غالبا لا نعرف مصادرها!!!!!"
archived = "2009-05-16"
capture_url = "https://web.archive.org/web/20090516054928/http://www.20at.com:80/7ayatna/2970.html"

[[comments]]
