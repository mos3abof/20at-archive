author = "نيفين نيفى نوفا"
posted = "1999-11-30"
text = "و شيرين مجدى و من المعلقين ابن بهيه و عبد الله مفتاح و بقوله انت فين و هبهوب شرحه و معاذ<br />بجد خايفه اكون ناسيه حد<br />لكل عشرينات كل سنه و مصر كلها طيبه"
archived = "2009-05-16"
capture_url = "https://web.archive.org/web/20090516054928/http://www.20at.com:80/7ayatna/2970.html"

[[comments]]
order = 3
subject = ""
author = "نيفين نيفى نوفا"
posted = "1999-11-30"
text = "خدو عندكو<br />ف العيد جتلى الرساله دى<br />خلاص مفيش وقفه (عرفات) و لا كرم( زايد )بس لسه باقى عيد( مبارك)<br />كمان هندى سال مصرى ليه مش احرق جثه قبل ادفن قاله احنا افن بعدين ربنا احرق<br />و ف رمضان الرساله الشهيره<br />يا مشمشيه قلبى يا كنافه عمرى يا بلح حياتى كل سنه و انتى قمر الدين<br />الرسايل كتير اوى يا جماعه و الله<br />بس المهم و قبل الزحمه<br />احب اقول لكل عشرنات كل سنه و انتو طيبين وhappy new year و merry christmas<br />و اخص بالذكر<br />البراء و دعاء الشامى و مى كامل و الطحاوى و الدرينى و حسين عبد الظاهر و منى سليم و روضه عبد الحميد و عجم"
archived = "2009-05-16"
capture_url = "https://web.archive.org/web/20090516054928/http://www.20at.com:80/7ayatna/2970.html"

