[[comments]]
order = 0
subject = "UR TUNISIAN BROTHER"
author = "ABDALLAH"
posted = "2006-03-10"
text = "السلام علىكم يجب ان نعرف انه لا يوجد حرية مطلقت و واقعيا ليس هناك بلد ليس فيه ممنوعات اما سياسية او تاريخية او دينية ولهذا يجب ان نكون منصفين فى الحكم على مقياس الحرية فى هذا البلد او ذاك فالحريات في ايران موجودة بشكل رهيب و بطريقة لا تقارن مع الدول العربية و لكن المشكلة هى في نوعية الحريات الموجودة فمثلا تم انتقاد ابن الخمينى في حيات ايه حتى اعتزل السيلسة و لكن مثلا لا يمكن لاحدان يتهكم على تطبيق الشريعة او المقدسات الدينية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130538/http://www.20at.com/article2.php?sid=552"

[[comments]]
order = 1
subject = "رد"
author = "احمد"
posted = "2006-03-12"
text = "حرية الصحافة كامة فضفاضة لا معنى و لا مغزى لها الا للدفاع عن اغراض ... لا تخدم باي حال واقع الامة. انظروا كيف يحارب الغرب حرية الفكر وحرية الصحافة في عقر داره وهو الذي يتشدق بها وب....لماذا اذا هذا التحامل على امتنا فحسب وهي تحارب من الخارج وكذا من الداخل. ايها الكتاب ايها المفكرون راجعوا اراكم وكتاباتكم... لضمان وحدة الامة ومنعتها . لماذا لا تكتبون ضد أعداء الامة وما يحيكونه من مؤامرات ضجها ليل نهار.لماذا عاقبوا رأي من تكلم عن المحرقة . لماذا حاكموا السيد جارودي لمجرد آرائه...و.... راجعوا انفسكم واعلموا ان الحرية ليست سوى عباءة يرتديها كل كيف يشاء وحسب هواه..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130538/http://www.20at.com/article2.php?sid=552"

[[comments]]
order = 2
subject = "الله ينصرهم"
author = "عبدالله - اليمن"
posted = "2006-09-12"
text = "دولة إيران الإسلامية الحديثة هي نموذج يجب أن يقتدي به جميع المسلمين والعرب لكي ينهضوا بمستواهم إلى أعلى المراتب.<br />فنظام إيران والاجراءات التي تتخذها والمنع في بعض الاحيان هو الذي يجعل الدولة ترتقي إلى مصاف الدول العظمى مع زيادة كونها إسلامية ملتزمة فلا يسمح للصحف ولا للحرية التي تعتدي على الدين أو تمس بالأخلاقيات أو تدعوا إلى خلخلة الدولة.<br />ولهذا نجد إيران اليوم في مستوى عالي جداً حيث التعليم والوعي في الشعب الايراني الحر بالإضافة إلى التزامه بالتشريع الاسلامي والتزامه بالنظام ، حيث أصبحت ايران اليوم مكتفية ذاتياً في معظم المنتجات بل ومصدرة أيضاً، حتى على مستوى الأسلحة المتطورة.<br />وكم من مرة مدت يدهاإيران(وما زالت) للدول العربية لمساعدتها والنهوض بها (بدون مقابل) ولكن للأسف يكون الرد بالرفض بل ومعادات إيران لصالح أمريكا ويصل البعض من الشعب (بسبب الجهل) إلى أن يطلق التحذيرات من إيران والخوف منها لانهاشيعية.<br />فأهلا بإيران الإسلامية الأبية وأهلا بالنظام الحر وأهلا بنهاية أمريكا واسرائيل ان شاء الله."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130538/http://www.20at.com/article2.php?sid=552"
