text = "ههههههههههه<br />هههههه<br />ههههههههههه<br />ههههههه<br />تفجيرات سيناء مرة اخرى<br />يالمصريين واللة انا بالذاف بدى اتبرع لكم بعدد كبير من الامن والشرطة لكى يحمونكم<br />هههههههههههه<br />واللة ماعم ضحك معكم انا انشاللة بكلم هنا عدد كبير من الجنود لكى يحمونكم<br />بدكم كم ؟؟؟؟؟<br />ماتحرجو واللة ؟؟؟؟؟<br />كم ؟؟؟؟<br />انا بضميرى عم بحضر لكم جيوش كبيرة لكى يحموهههههههههههه"
