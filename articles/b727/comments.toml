[[comments]]
order = 11
subject = "صح النووووووووووووم"
author = "نفسي افوق"
posted = "2006-04-25"
text = "انا مش عارف احنا ليه بنفضل نخبط في بعض في حاجات بسيطة ومش أساسية في حياتنا ؛؛؛؛<br />انا مع الناس اللي بتئول انه في كلام علي جواز الاحتفال بشم النسيم لأنه ما بيجيش الا مع عيد اليهود والنصارى ولو كان فعلا يوم مصري خالص ليه ما بيتحددلوش يوم مثلا 16 او 17 ابريل مثلا ولكن هو بيفضل معلق حتى عيدهم وده في حد ذاته امر قاطع .<br />لكن انا مش عارف امتى هنفوء ونعرف اللي بيحصلنا ده حرام ولا حلال قانون طوارئ فتن طائفية اعتقالات فساد رشاوى حكم مستبد دكتاتورية الامن بيتحكم في كل حاجة حتى ائمة المساجد اي شغل بواسطة اي مصلحة بواسطة حتى رغيف العيش النضيف بواسطة<br />يا جدعان القضاة انضربووووووووو فاضل ايه تانى<br />ايها السلبيون افيقوا<br />ايها النائمون استيقظوا<br />اللي خايف راجع نصيحة منى : اتل الخوف جواك قبل اما يقتلوا فيك اخر ذرة ايجابية وخير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131702/http://www.20at.com/article2.php?sid=727"

