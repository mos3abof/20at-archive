subject = "عبد الله..هبهوب..اكرم..عشرينات"
author = "نيفين"
posted = "2006-04-24"
text = "بقول لكل الناس اللى ف العنوان كل سنه و هما طيبين<br />هبه الصباره كل سنه و انتى طيبه يا حياتى و يا رب تكون الحاجات اللى بعتها عجبتك و سلامى لهند اللى بتحب فيروز<br />اكرم كل سنه و انت طيب و لو انك غبت علينا و مصدفتش لما قرات تعليقك على موضوع جاهين<br />عبد الله كل سنه و انت طيب و معاك ان الاحتفال باليوم دا حرام بس بهدووووووووووووووء<br />عشرينات و كل مصر كل سنه و انتو طيبين<br />و لو ان انفلونزا الطيور سرقت فرحتنا بتلوين البيض<br />و زحمه الحياه سرقت سعادتنا بتهنئه بعضينا<br />و الرومانسيه دايما بتخطف فرحتى باى عيد علشان بفتكر كل حبايبى اللى بعيد<br />اقولكو<br />كل سنه و انتو طيبين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131702/http://www.20at.com/article2.php?sid=727"

