text = "دى بدعه<br />ومينفعش نعمل حاجه كده وخلاص<br />يا جماعه احنا مسلمين وهنتحاسب عن كل حاجه وكل نيه \"انما الاعمال بالنيات\"<br />ناكل فسيخ وبيض بس فى اى يوم تانى<br />الحقيقه انا كنت فاكره فى ناس هنا اكثر تدينا<br />اللهم ارنا الحق حقا وارزقنا اتباعه وارنا الباطل باطلا وارزقنا اجتنابه"
