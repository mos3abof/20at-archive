posted = "2006-04-23"
text = "السلام عليكم ورحمة الله وبركاته<br />مش عارفه يا استاذه دعاء ايه لازمه التورته دى وايه لازمه التهنئه اساسا بهذا العيد البدعى الذى لم ياتى فى كتاب ولا سنه<br />وربنا يهدينا واياكى<br />احنا ان شاء الله نحتفل باعياد المسلمين لكن المسيحين ممكن يحتفلو باعيادهم بس بطريقتهم ولوحدهم<br />اصلى معتقدش انهم بيذبحو خروف زينا فى العيد مع انهم بيعيدو معانا<br />اللهم احسن خاتمتنا فى الامور كلها"
