[[comments]]
order = 9
subject = "المستشار محمود حمزة: ليتني مت قبل أن أري هذا اليوم"
author = "مصري"
posted = "2006-04-24"
text = "قلت لهم أنا رئيس محكمة.. فزادت شراستهم وسبوني بألفاظ نابية:<br />المستشار محمود حمزة: ليتني مت قبل أن أري هذا اليوم.<br />روي المستشار محمود حمزة تفاصيل الاعتداء عليه »للوفد« أكد حمزة انه وصل صباح أمس الاثنين لمقر نادي القضاة.. وركن سيارته بعيداً عن مقر النادي وأضاف: وترجلت وأثناء سيري في الشارع الذي يوجد به مقر النادي استوقفني وجود أعداد من جماعة »كفاية« يقفون في مواجهة النادي مرددين هتافات تضامن مع القضاة.. وقبل عبوري لباب النادي فوجئت بأن المكان تحول الي ساحة قتال ورأيت مجموعة أشخاص يرتدون ملابس مدنية حاملين في أيديهم الشوم متجهين مباشرة الي المتظاهرين<br />من أعضاء حركة كفاية وانهالوا عليهم بالضرب.. كان المنظر لا يوصف.. والضرب ضرب موت.. استفزني الموقف خاصة وأن أعضاء كفاية استغاثوا بالقضاة وكل ما فعلته انني رحت أرصد أحداث الاعتداء بكاميرا التليفون المحمول الخاص بي وبالفعل صورت كل الاحداث ووقائع الضرب وأثناء ذلك فوجئت بأحد الضباط يأتي من خلفي ويضربني بشدة علي يدي التي تحمل »الموبايل« فسقط التليفون علي الارض وفي ذات الوقت فوجئت بضابط شرطة اخر يكتفني محاولاً شل حركتي واشترك الضابطان في القائي علي الارض وسط الشارع، وما ان سقطت علي الارض حتي تجمع حولي عدد من ضباط الشرطة وراحوا جميعاً يضربونني في كل أنحاء جسدي.. ضربوني بأحذيتهم في وجههي وأصابوني بعدة كدمات.. كما ضربوني علي ظهري وبطني وفي كليتي.<br />صرخت وقلت حاسبوا.. أنا رئيس محكمة وكأن هذه العبارة استفزتهم فما ان سمعوها حتي زادوا من ضربهم وأمطروني بسباب لم أتخيل ان أسمعه.. سبوني بأبي وأمي وبألفاظ نابية.. حاولت أن أثبت لهم انني فعلاً رئيس محكمة مددت يدي في جيبي وسحبت محفظتي لكي أعطي لهم الكارنيه الخاص بي ولكنهم لم يمهلوني.. أخذوا محفظتي ومسدسا مرخصا كان معي وواصلوا سبابهم ثم سحلوني علي ظهري بطول شارع شامبليون وفي النهاية قذفوني في بوكس شرطة.. ولما تحرك البوكس حاولت القفز منه فأعادوا ضربي ونزف الدم من أنفي ووجهي ولما رآني شقيقي المحاسب »أحمد« صرخ فيهم حرام عليكو سيبوه ده رئيس محكمة فضربوه هو الاخر.. ثم حملوني ورموني في سيارة ترحيلات وأغلقوا الباب.<br />ويضيف المستشار محمود حمزة داخل سيارة الترحيلات: زاد نزيف الدم من أنفي ووجهي صرخت بكل ما أملك من قوة قلت أنا باموت.. ولكن أحداً لم يهتم بي ولما تواصلت صرخاتي قال أحد الضباط أخرس يا ابن... قلت أنا رئيس محكمة ومريض وعامل عملية قلب مفتوح عايز أخذ الدوا.. عايز أشرب مية.. وكان الرد الوحيد الذي أتلقاه اخرس!!.<br />وبعد حوالي 15 دقيقة تحركت سيارة الترحيلات وكان معي فيها عدد من المعتقلين من أعضاء كفاية سمعت بعضهم يقول احنا رايحين أمن الدولة في عابدين.. وهناك بالتأكيد هيموتونا من الضرب.. ولما وصلنا الي عابدين قلت للضابط أما اسمي كذا وبنزف وها اموت.. وأنا رئيس محكمة بمحكمة شمال القاهرة.. فقال الضابط طيب استني هانشوف.. انتظرت ساعة وبعدها جاءني نفس الضابط وقال انت اسمك ايه؟.. فأعدت عليه كل بياناتي فرد استناني.. وبعد فترة من الزمن خرج أحد الضباط واستوقف تاكسي كان يمر بالصدفة في الشارع ثم ألقوني داخل التاكسي وقال الضابط للسائق وصله لبيته.. لبيته وبس ومش أي مكان اخر.. انطلق السائق في الشارع وحاولت إقناعه بأن يوصلني الي أقرب مستشفي فرفض وبعد محايلات واستعطاف مني رق قلبه وأوصلني لاحد مستشفيات مصر الجديدة.<br />ولم يتمالك المستشار محمود حمزة أثناء حواره مع »الوفد« نفسه وبكي وقال: »ياريتني مت ومشفتش اللي حصلي ده«.<br />ولما سألته عن اصاباته قال: »أعاني كدمات في وجهي من ضرب أحذية ضباط الشرطة وأعاني كدمات أخري في كل أنحاء جسدي.. وفي ذراعي.. ثم توقف عن الكلام وبكي للمرة الثانية«. وقال: »أنا أشعر بإهانة بالغة.. فين هيبة القضاء.. فين المقام الرفيع.. فين.. فين كل ده«.<br />سألته عما ينوي أن يفعله فقال: »أنا كنت متضامنا مع مطالب القضاة المعتصمين في نادي القضاة بنسبة 70% الان أنا متضامن معهم بنسبة 100% أما من اعتدوا علي فلن أترك حقي.. أنا حددت اللي اعتدوا علي في محضر رسمي والتحقيق جاري الان وسآخذ حقي وأي مبلغ تعويض أحصل عليه سأتبرع به لنادي القضاة وللجمعيات الخيرية ولكل مواطن يهان في مصر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131702/http://www.20at.com/article2.php?sid=727"

