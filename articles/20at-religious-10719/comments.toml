author = "ابو العربي"
posted = "2008-12-15"
text = "هذا الصحفي بطلا حقيقيا سيظل يذكره التاريخ فإنه لم يجبن وقال كلمة حق عبر بها عما يحمله كل عربي تجاه هذا البوش اللعين وتمنيت لو أن بيده هاون أوصاروخا أطلقه عليه ولو لاحت لي الفرصة ما ضيعتها ليس للشهرة ولكن إعذارا إلى الله أني لم أجد غيرها"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105183924/http://20at.com/20at/religious/10719.html"

[[comments]]
order = 3
subject = ""
author = "أحمد العسيري"
posted = "2008-12-16"
text = "أخطأت بوشاً فأصابت العلم الأمريكي<br />قرأت للتو أبيات للشاعر عادل الكاظمي<br />هو هكذا النصرُ المؤزّرُ يُكسب = فحذاءُ منتظرٍ سلاحٌ يُرهب<br />إنْ أخطأتْ بوشاً فما هي أخطأت = عَلَمَ الرذيلة إنّ ذلك أوجب<br />أبتِ الحذاءُ بأنْ تُعانقَ سافلاً= يلهو بقتل الأبرياء ويلعب<br />أو أنّ بوشاً قد تدرّب يتّقي = رَمْيَ الحذاءِ فأفلح المتدرِّب<br />خوفاً على شرف الحذاء وحيطةً = من رأس بوشٍ قالها المتأدّب<br />بوشٌ ( إذا ضُرِبَ الحذاءُ برأسِهِ = قال الحذاءُ بأيّ ذنبٍ أُضرب)"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105183924/http://20at.com/20at/religious/10719.html"
