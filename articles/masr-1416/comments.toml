subject = "مشكورين على مجهودكم"
author = "فارس_fr"
posted = "2007-01-09"
text = "ياسيدي\" نورت مصر \" . هو فيه حاجه بعد تلويث الدم , الله اعلم باي الملوثات , ياسيدى احنا عندنا حكومة نظيفة جدا وعندنا شعب جبان جدا , لوثوا اكياس الدم , الخضر والفاكهة مسرطنة وملوثة . دستور ملوث ومسرطن , ضمائر ملوثة وعفنه , والشعب الجبان لسه نايم بيفكر بس في ازاى يرضي رغباته الجسدية .<br />حد يجاوبنى امتىالشعب ده هيتحرك امتى الناس هتصحى وتفوق , امتى هنحاسب يوسف والى وامثاله ؟؟؟؟؟؟؟؟؟؟"
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111071630/http://masr.20at.com:80/article.php?sid=1416"

[[comments]]
order = 2
subject = "شكر واجب"
author = "عن ماذا تتكلمون ؟"
posted = "2007-01-09"
text = "عن شعب كما قال احد زعمائة السياسيين من قبل<br />شعب يجمعة مزمار وتفرقة عصا<br />الزمار موجود<br />والعصا عند القمع المركزى<br />وياقلب لاتحزن<br />وانفخوا فى قربة كلها ثقوب<br />ممجرد كلام فى كلام<br />وبلدنا على الترعة بتغسل شعرها<br />ياما نهار ماقدرش يدفع مهرها ياهل ترى الليل الحزين يقدر ينسيها<br />ابدا<br />ابدا<br />شمسك يابلدى حزينة وارضك مجروحة"
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111071630/http://masr.20at.com:80/article.php?sid=1416"

[[comments]]
order = 3
subject = "الى ثوار موقعة الدنمارك"
author = "هل نبينا علية افضل الصلاة والسلام يرضى بتلك الحداث"
posted = "2007-01-09"
text = "هل يرضى بقتل المسلمين وغير المسلمين<br />بالموت البطيء<br />بفيروس سى<br />حساسية العين و الصدر<br />الفشل الكلوى<br />الدماء الملوثة<br />المياة الملوثة<br />القطارات المحترقة وغيرهاكوارث القطارت العادية<br />العبارات الغارقة<br />قتل الاجئين فى وضح النهار<br />هل قرئت فى كتاب البروتوكولات عن هذة الاشياء<br />هل دبر اليهود و الاعداء هذا الكم المهول من المصائب<br />ام الى أخترناة و بايعناه وأحنا معاه لمشاااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااء الله<br />ياأخى أعتبرو هذة الحكومة مثل جريدة اليولاندس بوست أعتروها هى الدنمارك أعتبروهم أعداء الله أنشرو ملصقات لمقاطعة ضرائبهم و جبايات الزبالة الى على الكربهاء ونحن عنها ساكتون أعتبروها كالعدو الصهيونى أعتبروها بوش أعتبروها شارون أعتبروها<br />كل المعاناة التى نحن عنها ساكتون أتكلمو يا بشر قبل ما نموت أتكلمو حرام عليكو حراااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااام"
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111071630/http://masr.20at.com:80/article.php?sid=1416"

[[comments]]
order = 4
subject = "الى شياطين الانس والجن من كل الاجناس قراءة هذا الاعلان"
author = "تعلن الحكومة المصرية"
posted = "2007-01-09"
text = "بدايتاً من الرئيس الى أصغر تيييييس<br />عن تنظيم دورات تدريبية فى الاتى:<br />1- كيفية قتل البنى أدمين من غير ما ياخدو التامين (راجع حادث العبارة و الواد بتاع قطر)<br />2-تنظم وزارة الصحة و السكان عمليات قتل جماعية للبشر بجميع أنواع الامراض المعروفة و غير المعروفة (راجع معايا مرضى الفيروس سي و بي ....الخ ومصاب بها حوالى 10 مليون مصرى من ضمنها العبد لله ب ِA)<br />3- تنظم وزارة الداخلية دورات للمتخصصين فى القتل المباشر:<br />أ- صعق بالكهرباء.<br />ب- الحرق على نار هادئة (لزوم الترويش يعنى)<br />ج- ألاغتصاب و وضع كل ما يصلح أدخالة فى ثقوب الجسم البشرى (راجع السواق بتاع بولاق)<br />4- وزارة الزراعة مش هتقدر تغمض عينيك:<br />راجع المقال بتئنى (حلوة تئنى دي)<br />5- وزارة الاسكان هدم مساكن القطامية وبناء منتجع جولف مكانها (هو طن الحديد بقى بكام دلوقتى يا مرسى)<br />ويا ترى هو بنفس سعر طن الحديد الى بيتصدر لاسرائيل ولا لاء ( ) برجاء وضع فارق السعر بين الاقواص عشان أنا نفسي أخد شقة أيجار جديد هههههههههههههههة<br />وعلى الفائزين أن يشكلو حكومة جديدة و يحكمو الشعب المنبطح (راحت عليك يا جيمى انتى و أبو جيمى وطنت سوزى وأخوك التانى بالمرة)<br />يبقى ياريت تعزمونا فى الساحل الشمالى فرع جهنم"
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111071630/http://masr.20at.com:80/article.php?sid=1416"

[[comments]]
order = 5
subject = "مع الاسف"
author = "صموئيل"
posted = "2007-01-10"
text = "فعلا القاهره محاصره بكافه انواع الملوثات بدايه من الهواء و السحابه السوداء التى تزورنا كل عام والله اعلم ما مدى ضررها الحقيقى ، المصانع التى تحاصر العاصمه و التى - طبعا - لا تعبا بمثل هذا الكلام ، نهايه بكم السيارات الرهيب ( والذى يتفق ابدا مع مستوى معيشه الغالبه من الشعب ، فمن يركب كل هذه الماركات الغاليه؟؟) و حتى السجائر و نحن ماشاء الله من الشعوب التى يزداد فيها عدد المدخنين على عكس مخاليق ربنا من سكان الارض!<br />وحتى مياه الشرب تلوثت وحتى قبل ان يطولها التلوث فلقد زرت مره احد مرافق المياه و فى الواقع المنظر لا يسر ابدا هنالك وقبل هذا ذاك فالمصدر نفسه (النيل) حافل بكل اسباب الملوثات التى يمكن ان تجدها فى نهر<br />واجد نفسى اتفق اسفا مع كلام الاخ فارس_fr بان الشعب على المستوى الفردى او الجماعى غافل عن كل هذه الامور بل يتعامل بانانيه شديده ، فطالما منزلى نظيف - اتكلم عن المنزل متودوناش فى داهيه - فلتحترق الدنيا بمن عليها بعد ذلك."
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111071630/http://masr.20at.com:80/article.php?sid=1416"
