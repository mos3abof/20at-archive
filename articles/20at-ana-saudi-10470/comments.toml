text = "فكرة حلوة.. و اعتراض الفتيات السعوديات في محله.. وأيضا.. تردده في الموافقة على عملهن في هذا المجال<br />في محله.. ولكن.. تعبيره عن الأمر .. بأن السبب في تردده هو خلوة السعودية برجال وعمل ميداني غير مقبولة.. والجنسيات الأخرى عاااااااادي… هذه فيها قولان!!!<br />هل بناتكم بنات ناس.. وتخافوا عليهم.. ولازم تطبقوا عليهم شرع الله.. وبنات المسلمين من الجنسيات الأخرى لا !!<br />ما ينطبق على أي بنت مسلمة من أي جنسية عربية.. يجب أن ينطبق على الجميع..<br />سواء داخل المملكة أو خارجها…<br />سبحان الله.. وله في خلقه شؤوووون.."
