text = "فعلا مأساة حقيقية طفل و طفلة يموتان بسبب الوقوف فى الطابور الصباحى المدرسى بعدها تلغى طوابير المدارس فى عدة مناطق و مازال هناك مطالبة بإلغائها فى العاصمة ؟؟؟ لماذا لا اعلم ماهى اهمية طابور الصباح و لماذا الاصرار علية فى هذا الجو القارص الى الدرجة التى نرى فيها الاطفال تتساقط صرعى من شدة البرد ؟؟؟من الاهم طابور يتعوض فى وقت لاحق ام طفل اذا سقط لن يتعوض؟؟؟؟<br />فعلا مأساة<br />www.egyptiannefertiti.com"
archived = "2009-10-20"
