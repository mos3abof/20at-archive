text = "الكوفية هي رمز الاصالة الفلسطينيه , رمز العزة والكرامه رمز النضال لكل فلسطين , ولكل من يحفظ كرامة هذا الوطن الغالي فلسطين , بعيدا عن النزاعات والانقسامات بين الفصائل , تأتي الكوفـية باصالتها لتجمع الشتات لكل الفلسطينيين في الداخل والخارج .<br />من يلبس الكوفــيه كموضـه فهو لايعرف ماهي الكوفــية ؟<br />انما الكوفيـه هي عـزة , هي حياة كرامة ,هي قوة , كل الناس تطمح لترتديها , ليقتبسوا من جمالها نورا , انهم يتسابقون لاردتاءها ,,<br />الكوفـية الاصيله لها رائحة الحياة الفلسطينية بكل تفاصيلها , من يعرف الكوفـيه لايرضى بها الا فلسطينيه من ارض فلسطين ومن عرق فلسطيني ,<br />شكرا لكم عبقرينوا .."
