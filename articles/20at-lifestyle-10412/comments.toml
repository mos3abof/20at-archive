author = "فلسطينية"
posted = "2009-12-24"
text = "السلام عليكم ،<br />بداية أود ان اشكر صاحب الموضوع<br />الكوفية كانت منذ زمن ولاتزال رمز الهوية الفلسطينية والنضال والمقاومة ،<br />كان لا يرتديها الا من يستحق ان يكون فلسطينيا وطنيا لديه من الانتماء وحب الوطن الكثير .<br />انا أرتدي الكوفية ، تقريبا اغلب الاوقات ،<br />لاني اصبحت اشعر انها جزء لا يتجزأ من وطنيتي وفلسطينيتي ،<br />ولا احب سوى الكوفية البيضاء المخططة بالاسود ،<br />واحمق من يعتقد انها لتنظيم معين كفتح !<br />وأشعر بالاستياء كوني ارى ( ما يسمونها بالكوفيات ) الملونة منتشرة ، وتلبس موضة بين الشباب والشابات !<br />\"دائما الكوفية مقتصرة على الشباب أكثر من البنات، \" أستغرب حقا رأي هذه الفتاة !<br />منذ متى والكوفية مقتصرة على الشباب !<br />وما الذي يمنعنا نحن الفتيات من ارتدائها !!<br />الكوفية رمز ، وهوية ، وتراث ، وحضارة شعب .<br />تحياتي لكم"
archived = "2009-12-30"
capture_url = "https://web.archive.org/web/20091230114206/http://20at.com/20at/lifestyle/10412.html"
