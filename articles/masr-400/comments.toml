posted = "2006-08-05"
text = "بصراحه يا حنان انتى كده قلتى الخص الموضوع واكفى على الخبر ماجور زى ما بيقولوا يعنى باعلانك عن موضوع ارتداء الحجاب ده انتىك ده فاكره انك هاتخلى الناس تنسى عمايلك بتاعت زمان انتى ووفاء عامر بس عايز اسالك سؤال انتوا يعنى تستمتعوا وتتجوزوا عرفى وتتطلقوا وتتجوزا ده وده وتناموا معى ده وده وبعد ما تشبعوا تيجوا قدام الناس الغلبانه وتعملوا نفسكم شرفاء وتقولوا انكم خلاص ربنا اهداكم الى الطريق الصواء حقيقى يعنى انا مش عارف ازاى اصلا امثالك يا حنان يسمحولها بانها تعمل حاجه زى كده لانه انتىو امثالك لا يصلح ليهم اللى الرجم او الموت ضربا بالرصاص يا ايتها العاهره"
archived = "2006-09-07"
