text = "اولا ربنا يهديها هى واللى زيها<br />ثانيا بلاش بقى تطلع لنا وتدينا مواعظ علشان انا عن نفسى وناس كتير لا اقتنع بأى كلام بيقولوه مش معقول الواحده من دول يتعرض لها فيلم فيه كل المسخرة اللى بتحصل فى الافلام والاقيها بعد ساعة طالعة فى برنامج بتقول فى مواعظ واحاديث بصراحة بعيد عن المنطق والفهم الموضوع ده . خلاص اتحجبتى او اعتزلتى خلاص ربنا يهديكى ويغفر لنا وليكى"
