[[comments]]
order = 12
subject = "الروضه الشريفه"
author = "بسمه"
posted = "2006-05-30"
text = "مبروك للفنانة علي خطوة الحجاب ولكن هي نفسها اللي عملت اكثر من عمره محجت بيت الله وهناك مكان الرضه الشريفه عندما يقف فيه المرء يشعر بصفاء الروح وكان في هذا المكان يولد الانسان من جديد بلا ذنوب ولا اخطاء لماذا لم تتكلم هي عن هذا المكان برغم تعدد مرات لا يوجد مسلم واحد يختلف عن هذا الوصف ومع ذلك الاخت حنان تصريحاتها بعد الحجاب نفس التصريحات السطحيه لكل من سبقوها حنان جميلة جدا فى الحجاب ولكن ستصبح اذا استمرت في عملها مجرد نقطه في صورة او كادر حتي يرض عنها كل المتحمسون ولكن لن تكون مؤثرة لان الميديا وصناعه السينما جزء من النظام العالمي للعولمه وهي عارفه كده كويس و بعد ان ينفض مولد الاحتفالات وسيعود كل الي موقعه وستتحجب اخريات وتظهر اخريات انها عجله لن تتوقف وسنه الحياة ان تمضي ولا تتوقف"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907034923/http://masr.20at.com:80/article.php?sid=400&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 13
subject = "إقبال بركة و معاداة السامية"
author = "كنت مصري قبل الخصخصة"
posted = "2006-05-31"
text = "السلام عليكم و رحمة الله و بركاتة<br />المقدسة إقبال يركة خدي بالك من اليهود بدءوا يحطوكي في دماغهم بيقولوا إنك معادية للسامية و ربنا يريحنا من أمثالكم و الفنانة حنان ترك و الله تتحجبي أو لا تتحجبي فكل نفسٍ بما كسبت رهينة مش هتنفعي إلا نفسك يوم لا تملك نفس لنفس شيءا و الأمر يومئذاً بيد الله تتحجبي و تظلي في الوسط الفني إنتي بتضحكي علي مين ماهو أحمد الفيشاوي كان زي ما بيقول ملتزم و بيأدي رسالة زي ما قالة الأستاذ عمرو خالد و اهو فضايحة وصلت cnn , bbc أدعوا الله و أمنوا معي أن يزيل الله الغم عن بلدنا الحبيب مصر و أن يستعملنا لنصرة دينة إنة ولي ذلك و القادر علية"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907034923/http://masr.20at.com:80/article.php?sid=400&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

