[[comments]]
order = 17
subject = "مبروك وعقبال الباقي"
author = "ابو شريف"
posted = "2006-05-31"
text = "الحمد لله رب العالمين علي الرغم من الهجمات الشرسة التي يشنها دعاة التخلف واصحاب الرايات الحمر من الكتاب والاعلاميات الداعيات الي التحرر الخلاعي والمجون ... علي الرغم من كل ذلك الا أن الله سبحانه وتعالي الذي يعز من يشاء ويذل من يشاء يهدي الي اتباع تعاليمه من يشاء من عباده المخلصين<br />والف مبروك حجابك ياام يوسف وربنا يقويكي علي دعاة العري والإنحلال الأخلاقي والي الكاتبه الكبيرة التي تكتب بمداد السم في قلمها اقول اتقي الله ولا تذكري شئ في الدين أنت بعيده عنه ... الحجاب يا أسم علي غير مسمى ( لا إنتي إقبال ولا فيكي بركه ) مذكور في القرآن وذلك لعلو شأن المرأة وليس تحقيرها والذي لايسمح لها إظهار سوي الوجه والكفين وأما حجاب الرجل فهو في تغطية عورته وأما بالنسبة لك انت فلن أقول لك سوي الله يهديكي"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907034923/http://masr.20at.com:80/article.php?sid=400&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 18
subject = "لا حول ولا قوة الا بالله"
author = "عصام"
posted = "2006-05-31"
text = "مالقتش حاجة اقولها غير لا حول ولا قوة الا بالله....اول ماسمعت ان حنان اتحجبت فرحت وقلت الحمد لله الذي هداها.. بس بعد ماشوفت صورتها المنشورة .. قولت لنفسي .. هو ده الحجاب اللي تقصده ، قلته احسن .<br />يا حنان.. الحجاب اللي الدين امر بيه عمره ما كان حتة منديل مايجيش 20 سم * 20 سم ومغطيه بيه شعرك وخلاص.<br />عاوزة تتحجبي صح .. واتمني من الله ذلك يبقي البسي الحجاب اللي لا يسوء للمحجبات.<br />والا افضلي زي ما كنت احسن علشان الموضوع ده بصراحة بيدايقني اوي....محجبة وبودي ورقبة باينة ... الله الله الله.<br />لا حول ولا قوة الا بالله"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907034923/http://masr.20at.com:80/article.php?sid=400&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

