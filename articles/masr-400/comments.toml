archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907034923/http://masr.20at.com:80/article.php?sid=400&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 15
subject = "حنان والحجاب"
author = "واحد وخلاص"
posted = "2006-05-31"
text = "الحمد لله أن حنان اتحجبت فعلا هذا ما كنا نتمناه علشان تتحل كل مشاكلنا حقيقى الواحد حيطق من الفرحه لا غلاء ولا بطاله ولا فساد ولا...ولا... بعد اليوم خلاص حنان اتحجبت وكله تمام!!!!!<br />يا جماعه كفايه هبل بقى وفوقوا وبطلوا تتوهوا فى اخبار بهذا المستوى من الهيافهما تتحجب ولا تتهبب هتفرق معانا ايه ولا خلاص الغيبوبه سيطرت علينا الى هذا الحدبصراحه التعليقات تفقع حاولوا تعقلوا."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907034923/http://masr.20at.com:80/article.php?sid=400&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

