[[comments]]
order = 0
subject = "لماذا هذا الهرج والمرج"
author = "شاهدت اليوم على قناة الـ LBC برنامج شاركت فيه الممثلة المحجبة منى بعبد الغني ، والصحفية المهاجمة دائما وأبدا للجاب رئيسة تحرير مجلة حواء إدبار بركة ( بكسر الباء ) ، والمذيعة اللامعة بقناة الجزيرة ( المحجبة كذلك ) وإدعت الصحفية المشبوهة التوجه والانتماء أن الحجاب ليس من الحرية والدين بل هو تقليد يهودي وافتراء على الإسلام وأن المرأة اليوم فيه من القوانين والأليات ما يحميها من التعرض والتحرش وليس الحجاب هو ما يحميها ، وأن الحجاب تمييز ضد المرأة"
posted = "2006-05-29"
text = "أقول أولا للأستاذة منى عبد الغني والأستاذة المذيعة بقناة الجزيرة لا يهن من عزمكن أقوال وأفعال مأجورين وأفراد مشكوك في إنتمائهم الديني والسياسي<br />أما الأستاذة إدبار أو إقبال بركة فإني قد أخذت على نفسي منذ سنين عدم متابعة برنامج أراكي فيه لكن ولمشيئة الله فتحت القناة على الأستاذة منى وهي تتحدث عن الحجاب ثم وجدتك إنت تتحدثين عنه بأنه عادة يهودية ، فأقول لك يا عدوة كل قيمة دينية أنك إما جاهلة وإما متجاهلة فإن كنت جاهلة بدينك فالأولى بك أن تلجأي الى من يعلمك ، لكني لا أعتقدك كذلك إنما أعتقدك متجاهلة وذلك من ردك على الشيخ الذي بين لك جهلة فقلت له بكل تفاخر أنك خريجة آداب قسم لغة عربية ، يعني كلية من الى تحت ( مع الاعتذار لخريجي الأداب واللغةالعربية ) لأن من يقرأ مقالاتك يتأكد بعدك عن اللغة العربية اللهم من النزعة الى هدم اللغة العربية<br />وما شأن كلية الأداب لغة العربية بلفقه هل سنتلقى الفتوى من صحفية خريجة أداب، وأليس من الحرية أن يرتدى من يشاء الحجاب حجابة، ولماذا هذه الحملة على الحجاب هل الحرية في الحجاب فقط ، وما رأيك يا رافعة راية الحرية وكراهية التمييز ضد المرأة فيما حدث للمرأة المصرية ( المصرية بحق ) في التظاهرات الأخيرة ولماذا ل<br />اقرأ بقية التعليق .."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907034923/http://masr.20at.com:80/article.php?sid=400&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

