subject = "الحمد لله"
author = "وليد عمر"
posted = "2006-05-31"
text = "قال تعالى (( فأما الزبد فيذهب جفاء واما ما ينفع الناس فيمكث فى الأرض )) الحمد لله على هذه المنه من الله عز وجل ــ وان شاء الله هتكونى سعيدة طالما كان هذا العمل لله رب العالمين ، وان شاء الله تعملى اعمال فيها خير وفلاح ــ والله كنتى جميله من غير حجاب ولكن بالحجاب اصبحتى اجمل من الجمال واشرق من الشمس واحلى من القمر .. اللهم يثبتكى على هذا الطريق"
