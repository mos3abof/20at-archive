posted = "2006-06-17"
text = "لا حول ولا قوة الا بالله يا ستى عيب اوي كده عيب الا تحفظى قول رسول الله لا فضل لعربى على اعجمى الا بالتقوى فلسطينىايه ومصري ا يه بس ومين سيد مين بس اتقوا الله فى بعض<br />بالذمه ده كلام يتقال والله يا ستى انتى اسأتى للمصرين اكتر من الفلسطينيه<br />وبلاش الفخر والاعتزاز الى على الفاضي ده وحياة والدك انزلى الشارع وشوفى التدهور الىاحنا فيه<br />واتقوا الله خير تقاته عيب كده عييييييييييييييييييييب يا مسلمين قبل ماتكونا مصريين واسياد قال الناس بلا خيبه اتحطوا والنبى"
archived = "2006-06-20"
