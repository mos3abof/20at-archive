subject = "فهلوة ولا نصب ؟؟"
author = "محمد"
posted = "2006-06-11"
text = "دي موش اسمها فهلوة دا اسمه نصب وتحايل واحنا الشعب الوحيد اللي فاكر نفسه فهلوي لكنه متأخر عن كل العالم بخمسين سنه ومش بيطور نفسه ابداً وحنفضل كدا طول ما احنا فاكرين اننا اذكى من غيرنا ونقدر نضحك عليه لكن الحقيقة غير كدا ومش حتظهر ألا لما نشوف الناس في البلاد اللي حوالينا اتقدمت ازاي وبتفكر ازاي ونقارن( بلد الريادة) علي راي المسؤولين بالبلاد الآخري"
