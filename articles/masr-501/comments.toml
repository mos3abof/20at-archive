[[comments]]
order = 15
subject = "الست فلسطينية"
author = "واحدة من أسيادك المصريين"
posted = "2006-06-17"
text = "شوفى بقى احنا ننقد بعض نشتم بعض حتى ماشى لكن حدتانى يشتم فى المصريين يبقى نهاره اسودوكمان فلسطينية يبقى نهارك اولة فلس وآخره طين زى كل ولاد بلدك اللى عايشين بره بلدهم وكلهم حقد وغل على اهل البلد اللى آوياهم انا عارفكم ومعاشراكم 18سنه وعارفه كويس جدا كرهكم العميق للعرب عموما وللمصريين بصفه خاصه بالرغم اننا اكتر بلد شايليين مشاكلكم واذا كان فيه شعب فهلوى يبقى فى الحضانه جنبكم ياتربية اليهود يللى محسوبين غلط على فلسطين الفلسطينيين اللى يستحقوا الاحترام همه اللى عايشين فى بلدهم وفى كل بيت منهم فيه شهيد مش اللى منتشريين فى العالم يكنزوا الأموال وكل زلمه منهم بالفهلوه يشتغل بدل الشغله تلاته وكام سنه يبقى مليونير ولما تتطلب سفارتكم تبرعات 1% من مرتباتكم العرق اليهودى يظهر وتبدؤا فى نشر غسيلكم القذر وتتكلموا عن ثروات وقصور زعمائكم واموالهم فى سويسرا اللى كونوها على حس القضيه تحبى اقول كمان ولا تتكسفى على دمك وتلمى نفسك..بالذمه انت واحده معندهاش لادم ولااصل لك نفس تصيفى والناس فى بلدك اللى بيموتوا عشان اللى زيك مش لاقيين لا اكل ولا دواء صحيح اللى معندوش خير فى اهل بلده حيكون عنده خير فى اهل البلد اللى لماه ؟؟؟ المفروض اللى زيك هوه اللى يخاف الله لأن مساعدة اهل بلدك الآن واجب دينى واخلاقى ومن عشرتى لكم عارفه ان دى حاجات مش موجوده عندكم المصارى اولا واخيرا وان كان مش عاجبك اسيادك المصريين واسياد الدنيا كلها يللا ياماما روحى بلدك يمكن لوكنت واحده من اللى يطفحوا الدم فى ارض بلدك كان الواحد يفكر يعذرها لكن واحده مرتزقه زيك محتاجه كورس فى الأدب والتربية والتاريخ قبل ما تتكلم عن أسيادها المصرييـــــــــن فهمتى ولا اقول كمان!!!!!!"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620061606/http://masr.20at.com:80/article.php?sid=501&PHPSESSID=21c1da686e11b97f5ce68fa71c774ee1"

[[comments]]
