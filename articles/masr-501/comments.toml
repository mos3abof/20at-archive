posted = "2006-06-11"
text = "الفهلوه عند المصرين مش بس كده الجديد دلوقتى هو الاعلانات على الدش المركزى تيجى مجموعه من الشباب ويعملو اعلان مع بعض صغير بكاميرا فيديو بسيطه جدا وتتسجل على شريط فيديوواثناء الماتش او الفيلم او المثلثل المتبع من الجماهيريجى رايح صاحب الفكره عارض شريط الفيديو على الدش والمبلغ بسسسسسسسسسسسسسسسسسط جدا"
