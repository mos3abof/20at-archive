text = "بصوا بأة انا مصرية بس والله اللى بيحصل ده عيب اوى عيب تشتمى الفلسطينيين اه مش كلهم حلوين بس مش كلهم وحشين دى إسمها شرشحة سورى فى اللفظ يعنى بس هى ما قالتش حاجة تستاهل والله الفلسطينيين دول ناس انا بحبهم خالص ونفسى ازور ارض فلسطين وهيه ما قالتش حاجة غلط ومفروض اسلوب الحوار يكون ارقى من كده"
