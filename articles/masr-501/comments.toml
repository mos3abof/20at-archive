subject = "صبرنى انا يارب"
author = "ssss"
posted = "2006-06-21"
text = "أنا متأكد ان الفلسطينية هى صاحبه تعليق صبرنى يارب أولا لأنك اتكلمتى عن الأسيادمن منطق المادة وثانيا انك بدأت بالذم فى المصريين وتعليقك موجود وثالثا مش ممكن واحد مصرى يبقى مغفل لدرجة انه يدافع عن من سب المصريين واتهمهم بالفهلوه فى كل شى وانهم لا يخافون الله<br />ورابعا احسن لك واشرف لك ترجعى بلدك طالما انت واحدة بتخاف الله وتتبرعى بثمن فسحتك فى مصر لأبناء بلدك الذين لم يقبضوا مرتباتهم حتى الآن ولسانك السليط فى غير الحق ضمية لألسنة المجاهدين فى فلسطين حتى يكون ذو فائده لأنه لم يخلق من يستطيع اهانه مصر لأنها هى وأبنائها فوق الجميـــــــــــــــــــــع وصبرنى أنا يارب على هذه البلاوى"
