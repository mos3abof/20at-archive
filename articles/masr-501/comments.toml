subject = "حتة فهلوة .. مهداه إلى الرئيس مبارك مع وافر القرف"
author = "http://ibnbahya.blogspot.com/"
posted = "2006-07-11"
text = "سأقص عليكم كما وعدت فاصلاً آخر من الفهلوة .. وبإمكان أي منكم مشاهدته بنفسه .. يوما ما كنت عند بائع الدجاج (الفرارجي) عشان أجيب فرخه (واحده بس على قد الإيد) وكان فيه عربية واقفه والجزار عمال يشفي ليها شوية فراخ (يفصل العظم عن اللحم) لأنها عايزه فراخ فيليه .. وطبعا كان لازم أنتظر للنهاية .. بعد ما مشيت الست الغندوره جه راجل مسكين زي حالتنا وأخذ من الفرارجي العظم اللي طلع من فراخ الست الهانم .. صدقوني كانت أول مره أعرف إن الفرارجي بيخزن العظم عشان يبيعه للغلابه يعملوا عليه شوربة .. حتة فهلوة بسيطة الكل عارفها مهداه بكل قرف للرئيس حسني مبارك والحرامية الملتفين حوله وحول إبنه الريس المنتظر<br />http://ibnbahya.blogspot.com/"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012230/http://masr.20at.com:80/article.php?sid=501&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

