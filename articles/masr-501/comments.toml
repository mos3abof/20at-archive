[[comments]]
order = 36
subject = "الفهلوه مش حرام في مصر"
author = "واحد ياريته كان فهلوي"
posted = "2006-07-15"
text = "يا جماعه انا عايز اقول تفتكرو لو كان مرتب الموظف المصري زي الدول المتقدمه بلالاف تفتكرو كان عمل مسد كول ولا حتي فكر انه يجيب وصله بالعكس دا احنا شعب بيحب الفنجره والابه بس هو فعلا معهوش وعايز برضه يعيش في منظر كويس وعلي فكره زي ما كل الناس عارفه ان اللي بيسرق عشان هو محتاج ياكل مش بيبقي حرام يعني بمعادله سهله اوي ولان تقريبا معظم كل اللي في مصر محتاجين فتفتكرو فعلا الفهلوه تبقي حرام ؟ انا بيتهيالي انها مش حرام"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012230/http://masr.20at.com:80/article.php?sid=501&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

