[[comments]]
order = 24
subject = "قاطعوا ال ART"
author = "قاطعوا الـ ART رداً على تبجح \"صالح كامل\""
posted = "2006-06-25"
text = "انتهك \"صالح كامل\" ، مالك فضائية (A.R.T) ، بكل صلافة وتبجح كافة التقاليد والآداب والأعراف الواجبة ، بالسماح لنفسه<br />بالقذف فى حق الشعب المصرى ، واتهامه [فى حديث لجريدة المصرى اليوم بتاريخ 19/6/2006] لستة ملايين<br />مصرى ، بأنهم لصوص يسرقونه ، بزعم مشاهدة لمباريات كأس العالم ، التى يحتكر نقلها ، بطرق غير مشروعة .<br />وإذ ترى الحركة المصرية من أجل التغيير (كفاية) فى هذا التصريح المتجاوز لكل القيم ، والذى يحمل احتقاراً لشعب مصر ، واستهانة بكرامته ، خروجاً سافراً<br />من شخص طالما استفاد من كرم المصريين ، وكدس المليارات من عرقهم وأموالهم ، ليدهشها ذلك الصمت المريب الذى قابلت به الدولة هذه التصريحات المنحطة ،<br />وسكوت النظام على تكرار اساءة هذه الشخصية المنفلتة لمصر ولشعب مصر ، بعد أن ساعده الفساد المستشرى فى بنيان النظام على احتكار جانب كبير من التراث الثقافى المصرى ، والتربح من اغتصاب تاريخنا الفنى العظيم ، دون وازع من ضمير أو أخلاق .<br />إن \" الحركة المصرية من أجل التغيير \" ، (كفاية) إذ ترفض هذه التصريحات المسيئة لوطننا ولشعبنا ، لتناشد جماهيرنا التى لا تقبل الإهانة ، أو تتنازل عن الكرامة ، بأن يقاطعوا كافة المنتجات التى يقف وراءها صالح كامل ومؤسساته المالية ، وأبرزها فضائية (A.R.T) بكل امتدادتها وعروضها حتى يلقنوا \"صالح كامل\" وأمثاله ، درساً فى الكبرياء الوطنى ولكى يعرف أن المصريين ليسوا لصوصاً ، وإنما شعب كريم لا يقبل الضيم ، أو يسكت على إساءة! .<br />كما تتخذ حركة \"كفاية\" من النية المبيتة – التى عبر عنها \"صالح كامل\" فى حديثه المشار إليه – لاحتكار الدورى العام المصرى ، وحمران الجماهير المصرية من آخر الم<br />اقرأ بقية التعليق .."
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012230/http://masr.20at.com:80/article.php?sid=501&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 25
subject = "اعبط ناس"
author = "عبدالله"
posted = "2006-06-26"
text = "والله العظيم العرب دول اغرب صنف بشر فى الدنيا ابدا لا يستطيعون النقاش ولا التفاهم رعناء على انفسهم رحماء لغيرهم والله لو واحد اسرائيلى اللى شتم كان كل واحد بعت يشرح ازاى ان احنا اهل حضاره لكن مع فلسطينى لازم ينشتم وربما انه مش فلسطينى _اسرائيلى _ولكن لابد ان تظهر الرعونه لنشتم وليشتم الاخرون ونترك ما يجمعنا الى ما يفرقناوهكذا وسنظل دوما نحن العرب وحتى بالنسبه للسب فانا اعتقد ان الفلسطنيين لا يرد عليهم بالسب مهما فعلوا فشهيد منهم بالامه العربيه كلهاوليس هناك خارج وداخل فكلهم معذبين ويقتلون بينما نحن نشاهد روتانا سينما ولا نستطيع ان نغمض اعيننا -0وبالمقابل لن اقول اننا المصريين سبب ذل الامه العربيه عامه والفلسطنيه خاصه _ااه يرحمه قاتل السادات_لان السبب لم يكن الشعب ولكنه كان الخائن السادات فهل يصح ان اقول اننا السبب رغم ان لنا دور كبير -لا _ لاننا والله لا نستطيع ان نحكم على ما سوف نأكله فكيف بالله نحكم حكومتنا _ المهم اننا يجب ان نتقى الله ولا تأخذنا العزة بالاسم ولنفكر ما هو المردود من السبب الا دفع الامور الى الاسؤ ولنفكلر ماذا لو تغاضينا الا يدفع ذلك الاخرون الى احترامنا لانهم يعلمون ان ما اسهل الرد فلو تركته لوجه الله فانا اكبر من شيطانى اتقوا الله وبنا الى ما يجمعنا"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012230/http://masr.20at.com:80/article.php?sid=501&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 26
subject = "ايها المسيؤون لها ..هذه هى مصـــــــــــــــــر"
author = "مصرية"
posted = "2006-06-30"
text = "(1)لا يحزننى الاساءة الى مصر من غير أبنائهاقدر ما يقهرنى الأساءة لها من المصريين أنفسهم..لن اتحدث عن حضارتها القدديمة ..حضارة السبعة آلآف سنة التى لم يكشف عن اهم أسرارها حتى الآن ..فكم من العلماء والمؤرخين من كل أجناس الدنيا سجلوا أمجادها على مر العصور ..وأسالكم كيف تهينوا الأرض التى كرمها الله تعالى فى كتابه العزيز؟؟..والى من غاب عنهم كلام الله اذكركم به عسى أن تكفوا عن الأساءة لها ولأرضها ولشعبها..<br />قد فضل الله مصر وشهد لها فى كتابه بالكرم وعظمة المنزلة وذكر باسمها وخصها دون غيرهاوأبان فضلها فى آيات القرآن الكريم وكفى به شهيدا..فقال الله تعالى\" وأوحينا الى موسى وأخيه أن تبوءا لقومكما بمصر بيوتا واجعلوابيوتكم قبلة\"..(يونس 87)<br />\"ادخلوا مصر ان شاء الله ءامنين\"(يوسف99)<br />\"اهبطو مصر فاءن لكم ما سألتم\"(البقرة61)<br />\"وقال الذى اشتراه من مصرلامرأته أكرمى مثواه\"(يوسف21)..وفى ذكر ضمنى لأرض مصر..قال تعالى\"وقال نسوة فى المدينة امرأت العزيزتراودفتاها عن نفسه\"(يوسف30)<br />وقال تعالى\"ودخل المدينة على غفلةمن أهلها\"(القصص15)..وقال تعالى\"وجاء من أقصا المدينة يسعى\"(القصص20)..والمدينة فى الثلاث الآيات السابقة هى منف عاصمة مصر الفرعونية..وقال فى كتابه العزيز عن فرعون وافتخاره بمصر\"أليس لى ملك مصر وهذه الأنهار تجرى من تحتى\"(الزخرف51)"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012230/http://masr.20at.com:80/article.php?sid=501&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 27
subject = "ايها المسيؤون لها ..هذه هى مصـــــــــــــــــر"
author = "مصرية"
posted = "2006-06-30"
text = "(2)وقال تعالى فى وصف مصر وماكان فيه آل فرعون من النعمة و الملك ما لم يصف به بقعة فى الأرض\"كم تركوا من جنات وعيون(25) وزروع ومقام كريم (26)ونعمة كانوا فيهافاكهين(27)الدخان..فهل لبلد من جميع اقطار اللأرض أثنى عليه الكتاب او وصفه اوشهدله بالكرم غير مصر؟؟<br />وروى عن النبى (صلعم)أنه قال \"ستفتحون أرضا يذكر فيها القيراط فاستوصوا بأهلها خيرا فان لهم ذمة ورحما\" (صحيح مسلم)<br />وعن عمر عن النبى(صلعم)أنه قال\"اذا فتح الله عليكم مصر فاتخذوا فيها جندا كثيفا؛فذلك الجند خير أجناد الأرض\"وقال ابو بكر رضى الله عنه:ولم ذلك يارسول الله؟قال\"لأنهم فى رباط الى يوم القيامة\" (كنز برقم38262)"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012230/http://masr.20at.com:80/article.php?sid=501&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 28
subject = "ايها المسيؤون لها ..هذه هى مصـــــــــــــــــر"
author = "مصرية"
posted = "2006-06-30"
text = "(3)أما من كان بها فى الأسلام من الصحابة والفقهاء والعلماء والأحبار والزهاد ومن دخلها من الملوك والخلفاء وأهل العلم والشعر والنحو الخطابة وكل من برع على اهل عصره فمن الصعب حصرهم ومن المشهور منهم كما ذكر اهل العلم والمعرفة أنه دخل مصر فى فتحها ممن صحب الرسول (صلعم) ما يزيد عن مءه رجل وقال يزيد بن أبى حبيب: وقف على اقامة قبلة المسجد الجامع ثمانون رجلا منهم الزبير بن العوام والمقداد بن الأسود وأبو الدرداء وأبو ذر وعمار بن ياسر وأبو هريرة وغيرهم<br />ومن كان بها من الفقهاء والعلماء فمنهم الليث بن سعد وعبد الله بن وهب وعبد الله بن الحكم وأسد بن موسى ومحمد بن يوسف الكندى ..ومن الزهاد: سليمان بن القاسم وسعيد الأدم وذو النون المصرى وغيرهم"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012230/http://masr.20at.com:80/article.php?sid=501&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 29
subject = "ايها المسيؤون لها ..هذه هى مصـــــــــــــــــر"
author = "مصرية"
posted = "2006-06-30"
text = "(4)وولد من الخلفاء بمصر عمر بن عبد العزيز وجعفر المتوكل على الله ..ودخلهامنهم معاوية ومروان بن الحكم وعبد الله بن الزبير وعبد الملك بن مروان ومروان بن محمد والسفاح والمنصور والمأمون والمعتصم والواثق<br />ودخلها من الفقهاء وغيرهم: الشعبى وأبو سلمة بن عبد الرحمن وعكرمة والشافعى وحفص الرد ومنصور بن عمار.. ومن الشعراء:جميل بثينة وعبد الله بن الزبير وابو نواس ونصيب بن رباح وخويلد بن خالد الهذلى والحسين الجمل وغيرهم<br />اما عن أرضها وما بها بركة وحكمة فبها الطور حيث كلم الله موسى وبها الوادى المقدس وبها ألقى موسى عصاه وبها فلق البحر وبها كان ملك يوسف وبها النخلة التى ولدت مريم عيسى تحتها وبها اللبخة التى أرضعت عندها مريم عيسى بأشمون فخرج منها الزيت وبها مسجد ابراهيم ويعقوب وموسى ويوسف عليهو السلام<br />وبها مجمع البحرين الذى ذكره الله تعالى فقال\" مرج البحرين يلتقيان(19) بينهما برزخ لا يبغيان(20) ( الرحمن)<br />وروى عن ابى هريرة أن رسول الله(صلعم) قال \"مصر أطيب الأرضين ترابا وعجمها أكرم العجم أنسابا\""
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012230/http://masr.20at.com:80/article.php?sid=501&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 30
subject = "ايها المسيؤون لها ..هذه هى مصـــــــــــــــــر"
author = "مصرية"
posted = "2006-06-30"
text = "(5) وأما عن ذكر مصر وفضلها وما أوثرت به على غيرها ..روى أبو بصرة الغفارى الصحابى الذى شهد فتح مصر وعاش ودفن بها قال: مصر خزانة الأرض كلها وسلطانها سلطان الأرض كلها\". وقال الله تعالى على لسان يوسف عليه السلام\" قال اجعلنى على خزائن الأرض انى حفيظ عليم\"(يوسف55) وقال سعيد أبى هلال : مصر أم البلاد وغوث العباد\". وقال عمرو بن العاص\" ولاية مصر جامعة،تعدل الخلافة\" وروى عن عقبة بن مسلم حديث يرفعه الى الله عز وجل يقول يوم القيامة لساكنى مصر فيما يعدد عليهم من نعمته\" ألم أسكنكم مصر فكنتم تشبعون من خبزها وتروون من مائها أمسكوا على أفواهكم\" وروى عن شفى بن عبيد الأصبحى انه قال: مصر بلدة معافاة من الفتن لا يريدهم أحد بسوء الا صرعه الله ولا يريد أحد هلكهم الاأهلكه الله\""
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012230/http://masr.20at.com:80/article.php?sid=501&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 31
subject = "أيها المسيؤون لها ..كفوا عن البلد التى كرمها الله والرسول والصحابه وأه"
author = "مصــــــــــــــرية ولى كل الشرف"
posted = "2006-06-30"
text = "(6)<br />هذا ما استطعت بمجهودى المتواضع أن أذكره عن مكانة أرضناالطيبةالتى كرمها الله تعالى بكل هذه النعم والأفضال وباركها بكل هذا التكريم..فكيف لكم يا بشر الأساءة لما كرمة الخالق ؟؟؟؟ هذه الأرض الطيبة التى وهبها الله هى كنانته فى الأرض والبشر من أفسدها بالطمع والجشع والفساد وترك تعاليم ديننا الحنيف واللهاث وراء اذيال الغرب الفاسد والأنبهار به تاركين قيمنا وأخلآقنا..تركنا المفسدين والفاسدين يتمكنون منها ومنا فلا نلوم الا أنفسنا ..اتقوا الله فى مصر ..اتقوا الله فى أنفسكم ..اتقوا الله فى أبنائكم .. اقتلعوا من أفسد الوطن يا خير أجناد الأرض اتركوا الفتن يا أهل مصر وانتبهوا للعدو الحقيقى الذى يريد بكم الضلال وأولى خطواته كرهكم لمصر حتى تصبح لقمة سائغة فى أفواههم القذرة لا تنجرفوا فى هذا التيار ..هذه مصر بكل عظمتها وتاريخها وتكريمها من الخالق لا يحق لمخلوق اهانتها ..اذا كنا نعيش عصرا من الفساد فنخن جميعا مشتركين فى استمراره ..ان لم يكن فى صنعه فهو بالسلبية والخضوع..والمباهاه فى الأساءة الى مصر التى أصبحت على ما يبدو لدى البعض موضة وخاصة من يعيشون خارجها..<br />واذا أتتك مذمتى من ناقص<br />فهى الشهادة لى بأنى كامل<br />ياكل أجناد مصـــــــــــــــر انقذوا الوطن.. الثـــــــورة الآآآآآآآآآآآآآن"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922012230/http://masr.20at.com:80/article.php?sid=501&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

