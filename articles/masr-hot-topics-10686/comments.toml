author = "مش لازم"
posted = "2008-12-06"
text = "اي والله العظيم المذيع مفيد فوزي على الفضائية المصرية الاولى شايفه امبارك بعد العصر معاه واحد مدرس تكنولوجيا معلومات في الريف واقسمله انه بياخد 105 جنيه في الشهر وهو متجوز<br />اسألوا مفيد فوزي<br />حتى بالامارة قالوا تعالى نقف نص دقيقة حداد على حالته التعيسة<br />مدرس في الريف بياخد 150 جنيه في الشهر واسالوا مفيد فوزي بتاع الفضائية المصرية<br />حتى سألوا المذيع قالوا انت بتاكل لحمة ازاي<br />سلام"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204213523/http://www.20at.com:80/masr/hot-topics/10686.html"

[[comments]]
order = 5
subject = ""
author = "ام بهلول الليبرالية"
posted = "2008-12-06"
text = "السنة اللى فاتت اشتريت جدى فى العيد ب 700 جنية والجزار دبحة وسلخة وشفى اللحمة واخد 50 جنية ولما وزنت اللحمة طلعت 9 كيلوجرام - يعنى الكيلو لحمة من الجدى دخل فى 80 جنية وهو عند الجزار حاليا ب 36 جنية<br />اسعار الخرفان السنة دى فى سوق بشتيل الخروف ب 1800 جنية يبقى الكيلو لحمة مشفى بكام ؟<br />قلت يا بت ام بهلول بلاش<br />اشتريت دكر وز وزغطتة فول وذرة وبسم اللة ما شاء اللة بيمشى يتبختر وكانة عنترة شايل سيفة ويوم العيد هنعمل حلة كسكسى وصينية رقاق باللحمة المفرومة مدهونة بالقشطة وندخلها الفرن وشوية شوربة لسان العصفور من مرقة دكر الوز<br />وبهلول وابو بهلول هيتغدوا<br />وربنا يفرح المسلمين ويجعل عيدهم طيب وبخير ويفك اسرى السجون وربنا ينكد على الظالم والمفترى وابن الحرام ويخللى عيدهم فى عيادة الدكاترة<br />خالتكم ام بهلول من بشتيل"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204213523/http://www.20at.com:80/masr/hot-topics/10686.html"

