text = "يا عم ضياء بس فيه طايفه في مصر بعيد عند وعن السامعين<br />بياكلوا الحمير والفراخ الميته<br />الفرخة الميته بخمسة جنيه دلوقتي<br />غليت كانت 3 جنيه بس<br />يلا بقا نصيبنا كده ناس تاكل خرفان وناس تاكل حمير وفراخ ميته"
