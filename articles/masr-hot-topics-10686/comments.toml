author = "شعبان"
posted = "2008-12-05"
text = "العيال الى هربوا لاوروبا وركبوا السفن ونزلوا الشواطىء هناك احياء هم اللى فيهم الخير وبيفكروا فى اهليهم<br />يعنى واحد راح فرنسا ارسا فلوس لاختة تشترى عجل جاموس ب 10 الاف جنية وتدبحة وتوزعة على الناس<br />واخر مقاول فى الخليج فعل نفس الشىء<br />ومن ايطاليا 3 او اربعة ارسلوا لاهليهم ليذبحوا عجولا لتوزيع لحومها على الناس<br />شايفين<br />بيخاطروا بحياتهم وبيركبوا البحر ولما يمسكوا قرش لا ينسون اهليهم الغلابة<br />هم دول اللى جناب المفتى قال عليهم انهم طماعين"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204213523/http://www.20at.com:80/masr/hot-topics/10686.html"

