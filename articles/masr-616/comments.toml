[[comments]]
order = 2
subject = "لماذا الآن؟"
author = "إبن بهية"
posted = "2006-07-06"
text = "السلام على الجميع..<br />حديث الأخ الكاتب معقول وتعليق الأخ محمد حسين برضه جيد ، لكن هناك أمور لم يتطرق لها أحد حتى اللحظة وهي تتلخص في السؤالين التاليين: هل هناك علاقة بالزيارات السرية التي قام بها كلا من جمال مبارك لواشنطن وقيادات مسيحية تعيش في إمريكا إلى مصر مؤخراً والاجتماعات التي تمت برعاية أمريكية؟ السؤال الثاني هل من علاقة بين اللوثرية والمسيحيين الإنجيليين في أمريكا (وهي المسيحية اليهوديةالتي يعتنقها أغلب رجالات الإدارة الأمريكية حالياً) وما قام به ذلك القس المشلوح؟<br />سوف أحاول الإجابة هنا ولكن إن لم تسعفني المساحة فالموضوع موجود على المدونة التالي عنوانها<br />www.ibnbahya.blogspot.com"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091059/http://masr.20at.com:80/article.php?sid=616"

[[comments]]
order = 3
subject = "ماكسيموس وجمال مبــــارك والصهيونية واللعبة القذرة ..."
author = "إبن بهية .."
posted = "2006-07-06"
text = "التعليق كاملاً موجود على الرابط التالي<br />http://ibnbahya.blogspot.com/<br />يعلم الجميع أن إخواننا الأقباط يعانون أشد المعاناة في الحصول على ترخيص بإقامة كنيسة جديدة وفقاً للخط الهمايوني كما هو معروف وحتى بعد أن حصلوا على موافقة من نظام مبارك فمازالت تقابلهم الكثير من العوائق ، فكيف يتمكن القس المشلوح ماكسيموس من استصدار تراخيص لخمسة كنائس دفعة واحدة وفي أسبوع واحد؟! طبعاً لجنة السياسات وجمال مبارك هم وراء ذلك بكل تأكيد .. فلو أن البابا شنودة وقف على أهداب عيونه ما استطاع استصدار ترخيص واحد في سبع سنين وليس أسبوعاً واحداً يا سي جمال الغير مبارك .. يجي ده ياخد خمس تراخيص مرة واحده ؟؟؟!!! (يعني بصراحة خمسة وخميسة عليه وعلى فهلوته الماكسيموس ده) .. من أين كل تلك الملايين من الدولارات ؟؟؟ ومن منحه كل تلك التراخيص في أسبوع ؟؟؟ المهم يا سادة هذه نقطة لابد الوقوف عندها كثيراً جداً وسؤال النظام المباركي لماذا كل ذلك يا سي جيمي ؟ هل هي ثمن قبول أورراق اعتمادك رئيساً مقبلاً لمصر والتي قدمتها إلى البيت الأبيض في زيارتك السرية التي قمت بها منذ شهرين للبيت الأبيض والكونجرس؟؟؟ طبعاً الأخ جيمي بيزعل لما حد يقوله إنته إيه وضعك في البلد عشان تروح تقابل رؤساء الدول وبصفتك إيه ؟؟؟ لذلك لن نسأل عن ذلك ولكن سنسأل عن الرسوم التي دفعها لكي يحصل على مباركة البيت الأبيض لحكم مصر ، لقد ظهر بعضها وما خفي كان أعظم .. يا ترى بعتلهم إيه تاني يا جمال ؟؟؟ المهم نرجع لماكسيموس .. الذي يقول عنه إخواننا المسيحيين أنه مشلوح ومغضوب عليه من الكنيسة المصرية التي يقودها البابا شنودة الثالث (شفاه الله) وقد ذهب صوب أمريكا وتمرغ في حضن الصهاينة والخونة من مسيحيي مصر في المهجر .. طبعاً لا أقصد مسيحيي المهجر جميعهم ولكن البع<br />اقرأ بقية التعليق .."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091059/http://masr.20at.com:80/article.php?sid=616"

