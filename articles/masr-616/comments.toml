[[comments]]
order = 14
subject = "الافتاء"
author = "سعد"
posted = "2006-07-15"
text = "يقول عبداللة الطحاوى مع اخترامى لة ان قداسة الباباشنودة هو متسلط على الكنيسة والايريد اى شخص يعارضة اخب اقول لة ان البابا بينفذ كلام الانجيل بينفذ كلام الانجيل وليس حسب هوى كل شخص مثل مكسيموس يريد ان يفعل واى شى يفعلة قداسة البابا يكون من الاتجيل اما الاشخاص الذين يعارضون البابا هم الذين يريدون انجيل حسب مزاجهم .وعلى العلم يوجد اضطهاد للاقباط فى مصر .تصليح دورة مياة تحتاج قرار جمهورى تخبل ذلك تغير باب نفس الشى عايز قرار من مبارك غير الجامعة الدكتور يسال الشخص عن اسمة اذا وجد الاسم بين مسيح ومسلم يسالة عن اجداد اجدادة حتى يعرف هذا مسيحى ام لا لو مسيحى تاكد انة ساقط وغير ذلك الحراسة على الكنائس ليس للحماية ولكن بيكون جواسيس وانا شوفت ذلك مخبرمنالمباحث يتنصت على الكهنة والدليل على ذلك عندما هجم شحص عل كنيسة الاسكندرية تركوة لذهب لكنيسة اخرة وكل ذلك بمساعدة وزارة الداخلية التى تقتل الاقباط.واى مشكلة بين مسيحى ومسلم يكرم المسلم ويهان المسيحى ولماذا كلة لست اعرف وتقول الاقباط فى عزلة لا الاقباط فى اضطهاد شديدة انا لااريد غير كل واحد ياخذ تعبة ومجهودة كما تفعل الدول الاوربية وليس هذا مسيحى اكسر رقبتة والامثلة لاتحصى فى مصر .العنصرية انتهت من جنوب افريقيا ولكن موجودة فى مصر.واتتا تحب قداسة الباباشنودة لان ينفذ كلام الانجيل .ينفذكلام الانجيل ....................اى مالانهاية"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091059/http://masr.20at.com:80/article.php?sid=616"

