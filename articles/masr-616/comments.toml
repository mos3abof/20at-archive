[[comments]]
order = 5
subject = "ياريت تكون دقيق فى معلوماتك"
author = "واحد مسيحى"
posted = "2006-07-07"
text = "اولا اتمنى ان تكون دقيق فى معلوماتك لان الباب شنودة لم يرفض الصلاة على ابونا متى المسكين لكن ابونا متى هو الذى رفض ان يعرف احد بوفاتة وان يصلى علية احد من القيادات الكنسية<br />ثانيا لم يكن هناك مشاكل بين ابونا متى وقداسة البابا ولكن خلافات فى وجهات النظر وكلنا نعرف ان قداسة البابا يقدر المتنيح ابونا المسكين جدا<br />ثالثا انا اتمنى اعرف قداسة البابا سبب فطنة طائفية ازاى هل هو من اطلق الجماعات الاسلامية من السجون وتركها تكفر المجتمع ان هو السبب فى احداث الزاوية الحمرا او احداث العديسات او الاسكندرية هل البابا هو اللى امر اهالى العديسات انهم يهاجمو كنيسة ولا قداسة الباب هو اللى امر الارهابى بتاع اسكندرية انة يدخل الكنائس ويقتل الناس البابا عارف كويس قوى ان شعبة قليل بالنسبة للمسلمين الموجودين فى مصر وكل طلباتة ان شعبة يلاقى كنيسة يصلى فيها وان لايضطهدة احد هل هذة مطالب كثيرة على المسيحيين؟<br />اخيرا هل المطلوب من البابا ان يغير فى كلام الانجيل والمسيح علشان الناس تنبسط يعنى ممكن واحد مثلا يجى يقول اوقفوا تعدد الزوجات فى الدين الاسلامى والمسلمين يسكتوا طبعا لاء اللى موجود فى الكتب السماوية هو اللى ينفذ الكتاب المقدس بيقول مفيش طلاق يقوم يجى واحد ويقول لاء احنا هنطلق الناس علشان يبقوا مبسوطين<br />كلمة اخيرو نفسى اقولها لكاتب المقال البابا شنودة رجل وطنى جدا وبيحب البلد اوى وهو راجل عظيم بمعنى الكلمة ضيع حياتة وصحتة علشانا ومش هتتصور اد اية المسيحيين بيحبوة ومستحيل نقبل ان واحد زى ماكس يتطاول علية البابا مش مجرد رئيس كنيسة لاء مهما اقولك مش هتفهم قيمتة بالنسبة لينا واتمنى انك تتحرى فى معلوماتك الدقة"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091059/http://masr.20at.com:80/article.php?sid=616"

