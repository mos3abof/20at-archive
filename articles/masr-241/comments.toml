[[comments]]
order = 3
subject = "حسبى الله عليك"
author = "ضحية من السلام 95"
posted = "2006-05-27"
text = "فاكرينى ياممدوح بيه انا احد ضحايا السلام 95 اللى غرقت فى منتصف رمضان وغرقت معاها شقى عمرى فى السعودية عربيتى الجيب الهوندا وفلوسى وكل امتعتى وطلعت بجلبية وشبشب من البحربعدهلع وزعرواخرتها دوختنى واتبهدلت واخيرا تكرمت عليا بعد ماارسلت ايميل لمكتب دكتور نظيف كشكوى اقول ايه ولا ايه دعيت عليك كتير ومازلت انته ومعالى مديرة الشئون القانونية عندك ومحمود الدسوقى وشلة أكل حقوق الناس هو ده كان استقبالك ليا يامصر بعد غربة 15 سنة عندى كلام كتير أوى وتعبان أوى وقرفان أكتر حسبى الله عليك وكل من كان السبب ايميلى موجود اللى عايز تفاصيل علشان انا تعبان"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182601/http://masr.20at.com:80/article.php?sid=241"

