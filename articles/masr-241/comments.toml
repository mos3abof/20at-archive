text = "يا ممدوح بية متزعلش نفسك شدة وتزول دة اصلا شعب جربان اية يعنى لما 1100 واحد يموتوا ما هما اصلا جربانين فداك يل باشا بس بينى وبينك انا زعلت على الاطفال الى ماتو علشان هما ملهومش دعوة بالبيزنيس<br />و سلملى على الطوارىء"
