subject = "معذرة إن كنت تعصبت"
author = "هاني ضوَّه"
posted = "2006-01-15"
text = "الموضوع فعلاً فكرتة ومضمونة جميل جدا لكن الملاحظة التي ذكرتها في تعليقي مهمة بارك الله فيكِ أخت مني.<br />لا تغضبي من تعليقي ولتاخذة على أنه ملاحظة بسيطة، ونحسن بكِ الظن، فأنت ما أردتِ إلا الخير وإلا لما وضعتي هذا الموضوع...<br />في إنتضار جديد موضوعاتك، وفتح الله علينا وعليكِ فتوح العارفين بكتابة الحكيم.<br />نسألكِ الدعاء يا طيبة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123221/http://www.20at.com/article2.php?sid=251"

