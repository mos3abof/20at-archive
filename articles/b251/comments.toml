[[comments]]
order = 4
subject = "خاتم النبيين"
author = "مسلم"
posted = "2006-01-14"
text = "لدينا مانتكلم به عن السول صلي الله عليه وسلم علي طول الزمانمن أعلام نبوته ومعجزاته ومعالم الحق في رسالته الخاتمة . ولكني أشعر بالخجل كمسلم أن أقف موقع المدافع عن رسول الله -ص- أدافع عن من ولمن ؟ أدافع عن النور الطاهر أمام ثقافات العالم اليوم التي استحلت سفك الدماء حتي أبادت 200 مليون هندي أحمر في أمريكا والتي استحر بينها القتل في حربين عالميتين فكانت الضحايا خمسين مليونا من البشر. الحضارة الغربية اليوم هي التي يجب أن تقف صاغرة أمام عظمة محمد -ص- ورسالتهوحقيقة الإسلام أنه الدين الوحيد الذي غزا المنتصرون في عقر دارهم رغم هزيمة المسلمين السياسية والعسكرية. أيها السادة آن لنا أن ننتقل من موقف المدافع إلي موقف المعتز بالطهر الذي معه في عالم استحل الزنا والخنا والشذوذ بكل أنواعهواستحلت ثقافاته السائدة نهب الأمم وسلب الشعوب جهارا نهارابقوة القهر وجبروت البطش . ومع ذلك ومن منطق الدعوة إلي خير دين سنبقي نتكلم عن سيدنا مجمد بما يلفت الناس إلي معلم نبوته ورسالتهصلي الله عليه وسلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123221/http://www.20at.com/article2.php?sid=251"

[[comments]]
order = 5
subject = "سيدنا .. سيدنا .. سيدنا"
author = "هاني ضوَّه"
posted = "2006-01-15"
text = "بسم الله الرحمن الرحيم<br />إليكم هذا التعليق:<br />نصلى على سيدنا رسول الله صلَّى الله عليه وآله وسلم فتتفتح القلوب والزهور وسنابل القمح وتدخل الأسماك المياه الدافئة.. تتضاعف مساحة البراءة والرحمة بين الناس.. تبرق السماء بملايين النجوم اللامعة.. وتحلم الصحراء بالخضرة.. إن الصلاة على سيدنا رسول الله صلى الله عليه وسلم هى قرص دواء يجلب الشفاء.. ويخفف من شرور الدنيا.. ويخلق للسكينة جناحين تنزل بهما على صدور الناس، ولا يجوز أن ننطق باسم الرسول مجرداً من الاحترام الواجب.. وهو احترام رفعه الله سبحانه وتعالى إلى درجة الفريضة.. يقول سبحانه وتعالى<br />لا تجعلوا دعاء الرسول بينكم كدعاء بعضكم بعضا) ويقول سبحانه وتعالى: ( يا أيها الذين أمنوا لا ترفعوا أصواتكم فوق صوت النبى ولا تجهروا له بالقول كجهر بعضكم لبعض أن تحبط أعمالكم وأنتم لا تشعرون).<br />سبحان الله إننا نسمع من يذكر اسم \" محمد \" ثم نكتشف أنه يتحدث عن سيدنا رسول الله صلَّى الله عليه وىه وسم .. وهو إسلوب لا يليق بذات الرسول الشريفة.. ويخلو من السيادة التى تليق بحضرتة صلى الله عليه وآله وسلم، إن التواضع الذى عرف عن سيدنا نبى الله لا يغرينا أن نتعامل معه على هذا النحو الذى لا يليق.. فاحترام سيدنا النبى صلََّّى الله عليه وىله وسلم أمر إلهى.. يقول سبحانه وتعالى<br />إن الله وملائكته يصلون على النبى يا أيها الذين أمنوا صلوا عليه وسلموا تسليما) .. ونطق الاسم الشريف دون تعظيم وتوقير هو جرأة على حضرته صلَّى الله عليه وآله وسلم، وجرأة على سنته المطهرة وهى جرأة قد تدفع البعض لما هو أكثر.. ترك السنة والإدعاء بأن ما ورد فى القرآن يكفى.. وقد ثبت عن سيدناالرسول الكريم صلَّى الله عليه وآله وسلم أنه قال(( أنا سيد ولد أدم ولا فخر)).. إذن فله السيادة على كل ذرية أدم عليه السلام.. ومن لا يقر بهذه السيادة فإنه يسقط عن نفسه الآدمية.. ويخرج نفسه منها.. وسيدنا الرسول عليه الصلاة والسلام هو سيد الأنبياء والمرسلين.. وسيد الأولين والآخرين.. ولكن كل هذا التكريم لا يفيده بشي.. فقد نال ما هو أكثر من ذلك.. تكريم الله سبحانه وتعالى.<br />إن النطق باسمه صلى الله عليه وآله وسلم مجردا فيه تطاول وعدم الإعتراف بالسيادة.. والسيادة تعنى الشهادة بالأفضلية والأسبقية والوفاء.. أى الكمال.. فمن رأى نفسه يتساوى مع سيدنا رسول الله صلى الله عليه وسلم بالأفضلية عند الله أو بالوفاء بكل ما أمر به الله وفاء كاملاً من فعل المأمورات وإجتناب الممنوعات والمحرمات لا يصح له أن يقول عن رسول الله إنه سيدنا محمد، على أنه فى البداية والنهاية يرجع هذا الأمر للذوق الشخصى.. والأدب الشخصى.. والاحترام الشخصى.. إننا نفرط بجنون فى منح الرتب والألقاب.. فلان بك.. فلان باشا.. صاحب السعادة.. حضرة المحترم.. معالى الوزير.. صاحب السمو.. دولة الرئيس.. الباشمهندس.. حضرة الصول.. الأسطى.. صاحب الجلالة.. فضيلة الشيخ.. صاحب العصمة.. الكاتب الكبير.. الفنان القدير.. نجم النجوم.. العالم الفذ.. الصحفى المخضرم.. شاعر الأجيال.. أمير الشعراء.. فلماذا نستنكر على رسول الله صلى الله عليه وآله وسلم ما نمنحه للبشر بسهولة ويسر وإفراط؟ إننا لم نسمع أحدا يقول لرئيسه: يا فلان.. وينطق اسمه مجردا.. ولا يقوى أحد منا أن ينادى أباه باسمه مباشرة.. فكيف ننطق باسم النبى مجردا وهو رسول الله صلَّى الله عليه وآله وسلم وأعظم شأنا؟!.. إن هذا من الأمور الغريبة.. أن يستسيغ البعض نطق اسم النبى مجردا.. إن نطق الاسم على هذا النحو مخالفا للنص الإلهى<br />لا تجعلوا دعاء الرسول بينكم كدعاء بعضكم بعضا) . وحتى لو لم يرد فى الكتاب النهى عن نطق الاسم مجردا فإن علينا ألا نفعل ذلك بأنفسنا.. فالله لم يأمرنا بأن نقول\" صاحب السمو\" أو \" معالى الوزير\" ورغم ذلك نحرص على هذه الألقاب.. فكيف نفعل ما لم يرد به نص ونتجاهل ما ورد به نص؟ ولا حول ولا قوة إلا بالله.<br />ونحن نحسن الظن بكاتبة الموضوع حفظها الله لتأخذ كلامنا على أنه نصيحة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123221/http://www.20at.com/article2.php?sid=251"

