subject = "من اقوال محمد"
author = "رافض"
posted = "2006-06-22"
text = "قال صلى الله عليه وسلم : ( لا يخلو رجل بإمرأة إلا كان الشيطان ثالثهما ).<br />السؤال \" ولماذا يكون الشيطان ثالثهما ؟ هل هي الاخلاق الاسلامية ؟ الايوجد في تلافيف دماغ المسلم غير الجنس ؟ وهل بمجرد خلوته بواحدة سينط عليها ويغتصبها ؟ ثم هي : لاحول لها ولاقوة ؟ الايوجد مسلم واحد لايفكر بهذه الطريقة ؟ صدفني في حياتي الكثير من مواقف الخلوات هذه , افليس غريبا اني لم أشعر بوجود الشيطان ؟ افما آن الاوان ان نعلم اولادنا الثقة بانغسهم وبالجنس الاخر ؟ الى متى سنيوق بناتنا الى مذبح الزوجية كالأنعام ؟ والى متى سيقتنع شبابنا بقسمتهم ونصيبهم وكأن المهم هو فقط ارضاء حاجة جنسية ؟ واحسرتاه"
archived = "2006-11-02"
