[[comments]]
order = 1
subject = "الرسالة التي أبحث عنها"
author = "وسام كمال"
posted = "2006-01-14"
text = "شاهدت فيلم الرسالة لأول مرة ليلة العيد...<br />أقسم أنني لازلت تحت تأثير هذا الفيلم العظيم،<br />ربما ضايقني كثيرا تلك المشاهد التي لم يستطعوا أن يقدموها في الفيلم، لعدم إمكانية تمثيل دور النبي صلى الله عليه وسلم<br />ولكن هناك لمسات أضفاها السينارست كان لها عبقها على جو الفيلم<br />قد يظن البعض أن الفيلم يطفي بعض الشوق للقاء الرسول،<br />ولكن الشوق اشتعل، وإلا ما دخلت في هيستيريا بكاء أنا وأمي بعد مشاهدة الفيلم<br />هناك معنى جميل هزني في الفيلم، بفعل صحابة الرسول:<br />سيدنا حمزة ...................... أسد الله<br />سيدنا خالد ....................... سيف الله<br />واااااااه معنى رائع، أن تكن في يد الله يستخدمك حيث يراك متميزا،<br />معنى قاله أحد فريق صناع الحياة مع عمرو خالد في معسكر الحج:<br />\"من نعم الله أني أعمل عنده\"<br />وذكر آخر:<br />\" من نعم الله أنه واحد، فلو تعددت الآلهة لتمزقنا في ارضاء كل منهم\"..<br />وكان رجل ثالث قد ذكر عن نعمة مباركة لا يلتفت لها الكثيرون:<br />\" من نعم الله أن نعمه لا تعد ولا تحصى، فلو كانت نعم الله تعد لكنت حزنت لأن نعمه عليك اقل من نعمه على غيرك، ولكن هناك تساو بيننا جميعا، كلنا نجمع من النعم عدد لا متناه\"..<br />سبحانه<br />ولكن هذه النعم الرائعة تحتاج إلى شكر وافر..<br />تحتاج إلى طاقة نوجه إليها طاقتنا<br />تحتاج لأن يحدد كل منا هدفه في الحياة، ويوفق للطريق الصحيح الذي يستخدمه الله فيه<br />أشتاق إلى ذلك... وسأقضى الوقت الذي يتطلبه البحث عن نقطة البداية الحقيقية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123221/http://www.20at.com/article2.php?sid=251"

[[comments]]
