posted = "2006-01-15"
text = "السلام عليكم احباب الله اول شيء اود ان اقوله هوالشكر الجزيل للاخت منى على هدا الموضوع فمما يقال من لا يشكر الناس لايشكر الله وثاني شيءاود قوله لابد لكل مسلم ومسلمة من معرفة حبيبنا والرحمة المهداة لنا وكلنا نعرف حديثه المشهور في اخر ايامه وهو قوله عليه ازكى صلاة و تحية اشتقت لاخواني...فلنكن حقا اخوانه الدي بشر بهم .لقد جاء هدا الموضوع في وقته ولكن(الدهر كله لله ولرسوله)وهي<br />الحجةفالناس كلهم يغبطون الحجج في كل بلادهم ولايسعوني انا وامثالي الى قول احد الصالحين (الناس زاروا محمد وانا حبه سكن قلبي)"
