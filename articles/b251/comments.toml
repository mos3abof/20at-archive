text = "الأخوة الكرام .. ارجوكم ركزوا و حاولوا تتدبروا في تفهم إن سيدنا الحبيب صلى الله عليه و آله و سلم لن يقول عن نفسه قولوا : اللهم صل على سيدنا محمد و آل سيدنا محمد ، لذلك فقد قالها صلوات الله عليه بدون السيادة .<br />لكن بالنسبة إلينا فالسيادة في التشهد مستحبة كما قال الشافعي .<br />أما فعلا العنوان \" انت و محمد \" فيه قلة ذوق و كأن محمد الذي نتكلم عنه هو شخص آخر ، و إنسان عادي يمكن أن نذكره مرة كصلاح الدين و نيوتن و ابن رشد !<br />للأسف كثرة قراءتنا للأفكار الغربية عن سيدنا محمد صلى الله عليه و سلم و تصوراتهم له جعلنا نظن أن أي تصور مقبول\" بالنسبة إليهم هم \" قالوه يمكن أن نعتقده نحن كذلك ، الغرب لأن أغلبهم غير مسلمين يعتقدون أن محمد رجل عظيم و لكن هذا يعني انه ممكن يتكرر و في النهاية هو شخص جميع صفاته عادية لكنه كان عبقري مثلا أو عظيم الخلق إلخ ، إنما سيدنا محمد في الاعتقاد الإسلامي السلفي نعم هو مثلنا في بشريته لكن مش مثلنا في أشياء كثيرة فمن منا يبيت عند الله يطعمه و يسقيه و من منا يرى من خلفه كما يرى من أمامه و من منا ليس له ظل على الأرض إذا سار في الشمس ، و كل هذه الآيات ( مادية ) لم أتخطاها لأذكر الخصوصيات الروحانية التي اختص الله بها سيد البشر .<br />لذا فهو سيدنا و رسولنا و حبيبنا و قدوتنا و شفيعنا إن شاء الله يوم القيامة ، لا يجوز بأي حال و تحت أي بند أن نساوي بينه و بيننا ، أما إذا أردنا الشعور بالاقتراب فهذا طلب سامي و لكن بأسلوب آخر كأن نذكر بقوله سبحانه و تعالى : \" و اعلموا أن فيكم رسول الله \"<br />، أو الحديث الشريف : \" تعرض علي أعمالكم \"<br />أو من خلال الصلاة و السلام على الحبيب سيدنا محمد و آله و صحبه و عند ذلك يرد علينا صلوات الله عليه و سلم السلام كما قال في الحديث الشريف ، إلخ<br />أعتذر للإطاله و ارجو العفو فلم أكن أقصد شخص بعينه و إنما لابد أن أوضح بعض ما تعلمته خصوصا عندما يتصل ذلك بسيدنا محمد صلى الله عليه و سلم ، و كلكم تتفقون معي في ذلك لأن جميعنا قلنا \" إلا الحبيب محمد \"<br />و صل اللهم على سيدنا محمد و على آله و صحبه و التابعين"
