subject = "من فضلك"
author = "أماني (حفيدة الحبيب محمد)"
posted = "2006-01-14"
text = "من فضلك يا أخت منى ، أولا أشكرك وادعو الله أن يوفقك دائما عن الكتابة والدفاع عن سيدنا محمد (صلى الله عليه وسلم ) ولكن تعليقي البسط عن هذا المقال هو أنه من الأفضل لو كنت كتبتي عنوان المقالة بأسم \" أنا وسيدنا محمد \" أو مثلا : \" أنا وحبيبنا محمد \" أو الى أخره من الألقاب التي لابد وأن يسبق بها اسم سيدنا محمد ( صلى الله عليه وسلم ) احتراما له<br />حفظك الله ورعاك يا أختي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123221/http://www.20at.com/article2.php?sid=251"

