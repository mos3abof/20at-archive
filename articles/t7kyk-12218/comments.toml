author = "الفارسى"
posted = "2009-05-29"
text = "عين الخليفة عمر بن الخطاب سلمان الفارسى واليا على الكوفة<br />سلمان الفارسى رسول اللة صلى اللة علية وسلم قال فية - سلمان منا ال البيت<br />اراد سلمان ان يبنى بيتا للحاكم فى الكوفة فاحضر البناء وقال لة ابنى لى بيتا وتعرف شروطى - قال البناء - اعرف - سأبنى لك بيتا راسك اذا وقفت يطول سقفة واذا نمت فية رجلك تلمس الجدار المقابل<br />يعنى بيتا متواضع جدا وفقير جدا<br />من اجل هذا فتح الاسلام البلاد شرقا وغربا<br />لانهم حكموا بالعدل ولم يسرقوا اموال الفقير والجائع<br />الاسلام يعنى العدل<br />وبدون هذا يتدهور المسلمين<br />ويصبح حالهم كما نرى الان"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530183252/http://www.20at.com:80/t7kyk/12218-2009-05-28-15-31-59.html"

[[comments]]
order = 1
subject = ""
author = "الانجليز والالمان وا"
posted = "2009-05-29"
text = "لو الحاكم فى امريكا اخطأ خطأ بسيط لكتبت الصحف ضدة وحاكموة وابعدوة عن كرسى الحكم كما حدث فى فضيحة ووتر جيت<br />وفى اسرائيل الحاكم اولمرت لما اتهم فى الرشوة جروة الى المحاكم وطلعوا ميتيين امة<br />وفى الهند البوذية قتلوا انديرا لانها اضطهدت السيخ<br />وفى انجلترا قاد تشرشل الامة الانجليزية فى الحرب العالمية التانية وبعد النصر قالوا لة مع السلامة واختاروا رئيس غيرة اسمة ايدن لمرحلة السلام<br />ولم تحدث كوارث لتلك الامم عندما غيرت حكامها<br />الا امة الاسلام<br />رؤسائها كلهم فاسدون ويقول واحد اطعهم واوعى تخرج عليهم لتخرب مالطة<br />اذا صحت تلك الاحاديث كما يدعى جهلة الاسلام يبقى فية حاجة غلط او انتقلت غلط<br />اذ لا يمكن ان يدعو الاسلام الى التخلف عن العالم<br />الم يقل ابو بكر وليت عليكم ولست بخيركم فان احسنت فاعينونى وان اسأت فقومونى الصدق امانة والكذب خيانة<br />فردوا علية واللة لا نقومك الا بسيوفنا<br />يطلع علينا واحد بكلام للطحاوى<br />مين هو الطحاوى"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530183252/http://www.20at.com:80/t7kyk/12218-2009-05-28-15-31-59.html"

