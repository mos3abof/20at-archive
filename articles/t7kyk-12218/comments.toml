author = "مش ضروري"
posted = "2009-05-29"
text = "الاسلام فتح الشرق والغرب بفضل اهل السنة والجماعة<br />الاسلام انطلق من جزيرة العرب الى العالم بفضل اهل السنة والجماعة<br />وبفضل الالتزام بعقيدة اهل السنة والجماعة<br />الذين قهقروا العالم الاسلامي هم<br />الشيعة والخوارج<br />الفجر الشيعي وفكر الخوارج هو سبب نكبات العالم الاسلامي<br />اما اهل السنة والجماعة هم الذين فتحوا البلاد وقالوا جملتهم المشهورة<br />جئنا لنخرج الناس من عبادة العباد الى عبادة رب العباد ومن ضيق الدنيا الى سعة الاخرة ومن جور الاديان الى عدالة القران<br />فارجو من الاخوة المعلقين يروحوا يتعلموا دينهم كويس ويروحوا اي مكتبة اسلامية ويشتروا كتاب عن عقيدة اهل السنة والجماعة ويقرأوها ويفهموا تماما ان اهل السنة والجماعة هم الذين فتحوا الشرق والغرب<br />سلام"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530183252/http://www.20at.com:80/t7kyk/12218-2009-05-28-15-31-59.html"

[[comments]]
order = 3
subject = ""
author = "االمعلق رقم 1 و 2 و"
posted = "2009-05-29"
text = "يا اخى امثالك هم سبب تأخر المسلمين من المغرب غربا حتى بنجلاديش شرقا<br />امثالك هم من جعلوا المسلمين الشحاتين والمرضى بتوع العالم<br />امثالك فى الصومال وتشاد والسودان هم سبب بلاوى المسلمين<br />انت شفت مسلمين فى العالم حالهم يسر حبيب<br />امثال الافكار الجاهلة التى تروجها من ايام معاوية وحتى الان سبب بلاوى المسلمين<br />انت بتذكر كلام الطحاوى المتخلف وناسى كلام الامام محمد عبدة الذى دعى الى خلع الخديوى الخائن حليف الانجليز وايد ثورة عرابى<br />الم يقرأ الامام محمد عبدة الاحاديث التى تتشدق بها<br />قرفتونا<br />مليتوا البلد زى البراغيت وانفلونزا الطيور"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530183252/http://www.20at.com:80/t7kyk/12218-2009-05-28-15-31-59.html"

[[comments]]
