subject = ""
author = "مش ضروري"
posted = "2009-05-30"
text = "جمال عبدالناصر كان راجل ظالم ومفتري وحكم مصر بالحديد والنار<br />الاخوان المسلمين خرجوا عليه واشتبكوا معاه وكانت وقعه جامده<br />قامت اسرائيل استولت على سيناء<br />والشعب المصري كله خسر خسارة فادحه<br />يبقى كان لزومه ايه الخروج والتمرد والعصيان<br />وناخد هنا مثال قلناه قبل كده هو سياد بري بتاع الصومال<br />كان راجل ظالم ومفتري ولكن كانت البلد ماشيه وامور الناس ماشيه<br />علشان خاطر هو راجل ظالم ومفتري خرجوا عليه<br />تحولت الصومال الى مجاعات ولاجئين<br />يبقى اي الحالتين افضل الصبر على ظلم سياد بري<br />ولا الخروج عليه"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530183252/http://www.20at.com:80/t7kyk/12218-2009-05-28-15-31-59.html"

