text = "يقول الإمام الطحاوي في \" شرح العقيدة الطحاوية \" التي هي عقيدة اهل السنه والجماعة<br />ولا نرى الخروج على أئمتنا وولاة أمورنا وإن جارو<br />ولا ندعوا عليهم<br />ولا ننزع يدا من طاعتهم<br />ونرى طاعتهم من طاعة الله - عز وجل – فريضة ما لم يأمروا بمعصية<br />وندعو لهم بالصلاح والمعافاة .. ) ."
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530183252/http://www.20at.com:80/t7kyk/12218-2009-05-28-15-31-59.html"

[[comments]]
order = 8
subject = ""
author = "لا زراعى ولا صحراوى"
posted = "2009-05-30"
text = "طبعا لا زراعى ولا صحراوى —- لانة خلاص مفيش فايدة — العجز فى الميزانية 130 مليار جنية والوزير غالى بيعتمد على الايراد من الضريبة<br />الاخبار بتقول النهاردة ان المالية بتفكر ترفع اسعار بنزين 90 وبنزين 95 وبتفكر ترفع اسعار السجاير علشان تعوض العجز فى الموازنة ويصرفوا على الامن المركزى<br />اظن اللى هيطين العملية ان المنح هتقل من الدول التانية بسبب الازمة المالية<br />يعنى الوضع الاقتصادى بعد كم سنة مرشح للانفجار<br />يعنى اكيد هيبقى فية انهيار<br />فنحن نسير الى اعماق البحر<br />وليس الزراعى ولا الصحراوى"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530183252/http://www.20at.com:80/t7kyk/12218-2009-05-28-15-31-59.html"

[[comments]]
order = 9
subject = ""
author = "تعبان يا قلبى"
posted = "2009-05-30"
text = "جمال عبد الناصر لم ينهزم بسبب خروج او دخول الاخوان<br />مصر انهزمت لان مصر كانت جاهلة<br />كان عساكرها اميون ولا يعرفون القراءة والكتابة فى مواجهة جيش اسرائيلى من الجامعيين<br />جيش مصر فى 67 اشبة بقوات الامن المركزى الان<br />لم تكن مدارس ناصر المجانية قد خرجت طلبة بعد<br />اولى دفعات الخريجين من الدبلومات والجامعات من التعليم المجانى اللى عملة ناصر هم الذين حاربوا فى اكتوبر 73 وجابوا النصر<br />السادات اللة يرحمة كان بيقول كلام فلاحى قبل الحرب كان بيقول قبل ما ادخل الحرب لازم احط فى ايدين ولادى الالكترون<br />لازم التعليم<br />لا يمكن ان تنتصر امة جاهلة فيها نسبة الامية 60 % على شعب جامعى 100 %<br />عبد الناصر لم ينهزم<br />ولكن الشعب الامى الجاهل هو الذى انهزم"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530183252/http://www.20at.com:80/t7kyk/12218-2009-05-28-15-31-59.html"

[[comments]]
