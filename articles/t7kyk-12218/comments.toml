subject = ""
author = "وللجهل بشر"
posted = "2009-05-29"
text = "واطيعوا اللة ورسولة واولى الامر منكم<br />من هم اولى الامر ؟<br />اولى الامر هم اهل الحل والعقد<br />يعنى الائمة الدعاة امثال شيخ الازهر ولجنة الفتوى والتشريع والعقلاء من الامة<br />وليس مقصود بالاية ابدا اولى الامر بمعنى الحكام ورؤساء الجمهوريات والملوك والسلطان ومشايخ الخليج<br />وبعدين انت هتدخلنا فى متاهة لية وبتقرأ لنا اية وتسيب اية تانية<br />طيب يا بتاع الطحاوى اية رأيك فى الاية<br />ومن لم يحكم بما انزل اللة فاؤلئك هم الكافرون<br />يعنى والحمد للة كلهم كافرون ووجب الجهاد ضدهم<br />قيا حبيبى المعلق السابق لا تدخل الدين فى السياسة ولا السياسة فى الدين لانك هتلاقى الف دليل معا[ *** ]<br />وابقى سلم لى على الامام الطحاوى والشبراوى واو رجل مسلوخة"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530183252/http://www.20at.com:80/t7kyk/12218-2009-05-28-15-31-59.html"

[[comments]]
