subject = ""
author = "مش ضروري 3"
posted = "2009-05-29"
text = "عصيان ولي الأمر و التمرد عليه , والخروج عليه يؤدي إلى مفاسد كبيرة وإلى فساد عريض ,<br />1- فالعصيان هذا عصيان لله ورسوله .<br />2- وهو يجرئ الرعية على التمرد و المخالفة لأوهى الأسباب .<br />3- وهو يفرق شمل الأمة و يباعد عنها .<br />4- كما أنه وسيلة للفوضى و تعميق للصدع و توسيع له .<br />5- وهو سبب الخوف و الذل و الهرج و المرج .<br />6- ثم إنه عنوان ضعف الأمة و ذهاب ريحها , وكفى بذلك تنفيرا من هذا العصيان .<br />7- وهو سبب الهزيمة أيضا , لما يسببه من تنازع , وتفرق , وقد قال تعالى : (( ولا تنازعوا فتفشلوا و تذهب ريحكم ))"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530183252/http://www.20at.com:80/t7kyk/12218-2009-05-28-15-31-59.html"

[[comments]]
