[[comments]]
order = 12
subject = ""
author = "مش منوفى"
posted = "2009-05-31"
text = "شوف يا اخ مش ضرورى<br />نحن شعب فقير جدا لان الامكانيات محدودة جدا ومصر ليست امريكا عندها امكانيات قارة كاملة<br />والشعب الفقير مثل الرجل الفقير بيعمل حساب لكل قرش بيكسبة يعنى لو معاة 100 جنية مش بيروح يتغدى فى مطعم فخم - لا - دى بيحاول يشغل ال 100 جنية لصالح عيالة<br />مش ممكن ينفع سياسة رجال الاعمال واستئثار 1 % بثروات الشعب والباقى جوعان<br />لا<br />سياسة البلد لازم تبقى وسط مسموح للقطاع الخاص بالتنمية والشغل وايضا الدولة لازم تخطط وتبنى مشاريع ومش تترك العملية سايبة كل واحد يسرق على مزاجة<br />يعنى سياسة الدولة الاقتصادية سمك لبن تمر هندى<br />يعنى تضرب الفوضى اطنابها<br />والنتيجة العجز الرهيب فى الميزانية - واحد فقير وعايز يصرف من اين ؟<br />من الشحاتة ؟ الى متى<br />لازم سياسة اقتصادية للدولة والدولة ترجع تبنى تانى وتقود التنمية بمعاونة القطاع الخاص<br />هذا والا الانهيار"
archived = "2009-06-26"
capture_url = "https://web.archive.org/web/20090626083843/http://www.20at.com:80/masr/t7kyk/12218-2009-05-28-15-31-59.html"
