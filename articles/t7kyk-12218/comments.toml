subject = ""
author = "مش ضروري 2"
posted = "2009-05-29"
text = "أهل السنة والجماعة لا يرون الخروج على ولاة الأمور بالمعاصي، خلافا لأهل البدع من الخوارج والمعتزلة والرافضة، والأدلة على هذا كثيرة، من الأدلة على أنه لا يجوز الخروج على ولاة الأمور بالمعاصي قول الله تعالى: يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنْكُمْ أمر الله بطاعة ولي الأمر والخروج عليه ينافي طاعته، وفي الصحيح عن النبي -صلى الله عليه وسلم- أنه قال: من أطاعني، فقد أطاع الله، ومن عصاني، فقد عصى الله، ومن يطع الأمير، فقد أطاعني، ومن يعص الأمير، فقد عصاني هذا فيه النهي عن عصيان ولي الأمر والأمر بطاعته، ولكن هذا عند العلماء مقيد بما إذا لم يأمر بمعصية، كما في حديث أبي ذر، ومن الأدلة حديث أبي ذر أنه قال: إن خليلي أوصاني أن أسمع وأطيع، وإن كان عبدا حبشيا، مجدع الأطراف وفي لفظ ولو لحبشي كأن رأسه زبيبة ومن الأدلة: ما في الصحيحين عن النبي -صلى الله عليه وسلم- أنه قال: على المرء السمع والطاعة، فيما أحب وكره، إلا أن يؤمر بمعصية؛ فإن أمر بمعصية، فلا سمع، ولا طاعة ."
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530183252/http://www.20at.com:80/t7kyk/12218-2009-05-28-15-31-59.html"

