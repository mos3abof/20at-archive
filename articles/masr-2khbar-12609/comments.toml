subject = ""
author = "حاجة تموت من الضحك"
posted = "2009-07-11"
text = "واللة كلام يموت من الضحك<br />يا عم روح بيتكم<br />وييجى واحد بيعرف يفك الخط هيتكلم احسن منك ويعمل حاجة بدل دور الطرطور اللى انت بتشتغلة"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043230/http://www.20at.com:80/masr/2khbar/12609-2009-07-11-08-18-35.html"

[[comments]]
order = 1
subject = ""
author = "اديلة بانجو"
posted = "2009-07-11"
text = "يظهر ان البانجو اتغش اليومين دول<br />مصر شديدة قوى وقفاها عريض قوى ويا باشا ما تضربنيشى على قفايا اضربنى على طيزى<br />عينة وسخة للمسئولين فى الايام السوداء"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043230/http://www.20at.com:80/masr/2khbar/12609-2009-07-11-08-18-35.html"

[[comments]]
order = 2
subject = ""
author = "موضوع تعبير"
posted = "2009-07-11"
text = "صدقونى الكلام دة لما تتمعن فية تلاقية عامل زى موضوع تعبير كاتبة طالب فى فى صف سادس فى مدرسة حكومية<br />فية رئيس وزراء يقول الكلام الهرتلة دة<br />مصر شديدة قوى يا عيال وكلام زى نسرع العجل<br />الراجل دة حصل حاجة فى مخة وصحيح انة مهندس وعندة الجنسية الكندية<br />والا يمكن كان بيتعاطى حاجة صفرا فى قزازة اعطاها لة فاروق حسنى<br />ربنا يرحمنا<br />يا نظيف يا شديد يا جامد"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043230/http://www.20at.com:80/masr/2khbar/12609-2009-07-11-08-18-35.html"

