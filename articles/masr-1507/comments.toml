[[comments]]
order = 0
subject = "يااستاذ بلال"
author = "زهرة الرمان"
posted = "2007-01-28"
text = "يا استاذ بلال يا صحفى يا كبير المقام - لك كل الاحترام<br />عايزين مبادرة تصلح الحال المايل فى بلدنا احنا ونلاقى شغل للعيال ونلاقى شقق يسكنوا فيها ومصانع تغنينا عن الاستيراد<br />عايزين نستر البنات واهلهم يقدروا يجهزوهم<br />شايف كمية الفقر جوة البلد اد اية وشايف الناس الغلابة اللى عايشين فى الضنك<br />ان كنت شبعان لازم تشوف الفقير وتطالب بحقوقة<br />مبادرة اية وقضية اية كفاية تجارة بالقضية<br />شوف قضيتنا احنا<br />احنا الشعب اللى هدة الفقر والحاجة<br />اقتصادنا اللى هو اقتصاد تسول وشحاتة من دول خلق اللة اللى بتسميها مساعدات<br />عايزين مبادرة لقضيتنا احنا<br />شفت مدينة غزة فى التلفزيون بيوتها كلها بيضة وفلل وعمارات اخر حلاوة وشوف احياء القاهرة المتطرفة بتاع الغلابة<br />يااستاذ بلال يا محترم احنا اللى عايزين مبادرة"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090528/http://masr.20at.com:80/article.php?sid=1507"

[[comments]]
order = 1
subject = "اى مبادرة نختار"
author = "فهد الا سلام"
posted = "2007-01-31"
text = "انا من رايى ان كل دة كلام فارغ ومضيعة للوقت لينا اكثر من خمسين سنة ومفيش رايس عربى واحد عندة دم ولا نخوة اتجاة هذا الوطن العربى المسلوب كل دى مبادرات فا شلة من غير فا يدة اية يعنى نعمل المبا درة وبعد كدة تر جع اسر يل تنقضها المبادرة الصح هى اعادة النظر فى كل المو قف العربية اولا اعادة النظر فى اتفا قيى كامب ديفد تسليح المنظمات الفلسطنية تغير الا ستر اجية العر بية من مو قف الدفاع الى مو قف الهجوم وكفا نا خوف من امريكا وحلفا امريكا الاسلام والا مة العر بية اقوى من كل هذا ولكن هولاء الحكام الجبناء الضعفاء هم اللى خلونا ضعفاء"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090528/http://masr.20at.com:80/article.php?sid=1507"
