text = "اسمحلى اقولك انك شاب معقد<br />البنات مش سلعة رديئة تزين نفسها عن طريق حركات او كلمات او قراءات للتباع أو تتزوج البنت بطبيعة الحال رقة ادب شيى كالقمر ينير سماء الشبابانت نفسك تقول عليه هكذا وهتتزوج من بنت"
