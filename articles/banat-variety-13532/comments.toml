text = "طب ايه رايك ان انا مش بعمل كده خالص وبتصرف فعلا علي طبيعتي خالص<br />والله فعلا بفوجأ بكلام مش شرط من خطيبي (انت ملاك ـ انت ملكة ـانت تستهلي ان الواحد بيعملك اي حاجه ـ …) وكلام كتير زي كده<br />وفعلا والله الواحد علي طبيعته مش شرط تصنع ممكن الطبيعه تكون احلي بكتير<br />اما الي ميحبش طبيعة خطيبتة يبقي اصلا مش بيحبها<br />وسيبك من الي يقول انا هغيرها الي بيحب حد بيحب كل حاجه فيه مش مرطبط بيه علشان ينتقده ويعقده في حياته<br />والحقيقه المخزيه بقي<br />ان الرجاله بيحبوا الكدب ويتقبلوه وهما زي الهبل وبيبقي بالنسبالهم منتهي الحقيقه هبل بقي"
