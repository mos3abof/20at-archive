author = "MS&Saicoo"
posted = "2007-10-27"
text = "بصراحه ياجماعه وعن تجرب ووقع انا بعيشها البنت بتحاول فعلا تكون احسن امام خطيبها بس مش لانها تزيف نفسها بس علشان هدف ليها وغالبا بيكون حب نظرة الرضا لمستقبلهم باى شكل من الاشكال<br />وهدف تانى انها ممكن تنجح فى استمرار فى انها تكون الاحسن والاجمل امام من تحب فى المستقبل<br />دى نظره البنت طيب والراجل لو خطيبتها بانت انها مش مهتميه باكله او مش مهتميه بمظهرها قدامه اولا وقدام الناس ثانيا<br />ولم تكون مراعيه اتكيت الاكل والتعامل ساعتها هيكون الخطيب مبسوط لانها حقيقيه مش مزيف لحد قول المقال ولا هتحب انها تتعلم علشان هدف لاسعاده بيها<br />تمنياتى بمذيد من التوفيق"
archived = "2009-11-02"
capture_url = "https://web.archive.org/web/20091102075500/http://www.20at.com:80/20at/7ayatna/6990.html"

