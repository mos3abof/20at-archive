text = "دمك زى العسل وللاسف كلامك كله صح نااااااااادر اما تلاقى بنت طبيعيه ومش مصطنعة امال الرجالة بتتجوز ازاى ماهو بالحركات دى ويشربوا القلب ياعين امهم ويكتشفوا الحقيقة بعد فوات الاوان ولو البنات ماكانوش بيعملوا كده منذ بدا الخليقه كانت البشريه شارفت على الانقراض لان نادر ماكان حد حيفكر يتجوز من الرجالة طبعا"
