text = "انا معاك فى الكلام ده<br />ولكن<br />فيه بنات فعلا رقيقة بطبعها وفيها بعض الحاجات اللى انت انتقضتها من غير متكون مصطنعة<br />والبنت الرقيقة عملة نادرة اليومين دول ولكنى فعلا اقدر اى بنت تكون فيها الصفة دى<br />والاخت التى تتهمك بالمعقد .. مينفعشى كدة يا انسة ده رايه وان كان فيه بعض الهزار نتقبله عشان الحياة تمشى<br />ولا هو عشان كشف بعض الحقائق تزعلى<br />خليكى فريش وسبور عشان الحياة تمشى<br />والسلام ختام"
