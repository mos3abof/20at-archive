subject = "الامر اكثر عمق و اخطر من هدا"
author = "لمين من الجزائر"
posted = "2006-10-08"
text = "ادا كان الامر للاطلاع و فقه الواقع فلاباس اما الانتهاج الفكري فلا يحمد يعقباه .ليس هناك فكر منفصل عن دين .وكما يمكن ان يكون الدين منهج للحياة فقد يكون المنهج الحياتي دين .والتقسيم بين الفكر و الدين هي مقولة بورجوازية حديثة لا اساس لها."
