subject = "ارجو دائما قول الحقيقه"
author = "ياسمين"
posted = "2006-08-04"
text = "ارى انه لاتوجد موضوعيه وحياديه فى الموضوع وهناك معلومات كثيرة مهمه ومش موجوده وهناك معلومات خطأ ثم عايزه اعرف ليه حكمتى على الشيوعيه ان دمها تقيل احب اعرف الناس ان الشيوعيه مش نكته ولا حدودته علشان يطلع دمها تقيل او خفيف<br />وشايفه ان الشيوعيه هى الحل"
