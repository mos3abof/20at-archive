[[comments]]
order = 2
subject = "الشيوعية الحقيقية"
author = "فاتن"
posted = "2006-07-13"
text = "في الحقيقة المقال جيد لكنه مختصر جداأما بالنسبة للفيل فهو مزيف جدا بطريق واضحة ويحتوي على مجموعة من الأكاذيب التي لا تصدق (كيف انسان واحد بعمل قحط _بالله عليك_)وارجو منكم أذا كنتم حقا تريدون نقل معلومة صحيحة بدون انحياز نقلهابعدل شوي وإزا حبيتو في أمكانية اني ازودكم بكل الملفات الممكنة لإيضاح الفكرة بشكل جيد لأنه في النهاية مش لازم نحاكم الأحداث لازم نحاكم الفكرة وهل هناك فرق بين النظرية والتطبيق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125600/http://www.20at.com/article2.php?sid=1065"

