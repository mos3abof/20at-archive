[[comments]]
order = 0
subject = "حتى انتم دمكم ثقيل"
author = "ريم بنت السعودية"
posted = "2006-07-12"
text = "لما صار دمها ثقيل ليش كتبتو عنها حتى موقعكم دمه ثقيل وطالع بايخ انادخلت اشوف وين وصلت الشيوعية واذا بالثقافة شرق وانتم غرب \\\\\\\\\\\\\\\\ غير واعين سردتم لنا ارقام وتاريخ الشيوعية وكارل ماركس الذي شبعنا من اسمة ومن ثم دعمتم لنا بصور من نسج الخيال كانكم تقولون استخرج الفروق الخمسة بينها والمشكلة انه كاتبين ليس كاتب واحد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125600/http://www.20at.com/article2.php?sid=1065"

