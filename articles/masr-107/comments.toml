author = "مسلم حريص على دينه"
posted = "2007-02-10"
text = "أرى أن كاتب ذلك الموضوع إما كافر او كافر او لا يعلم عن الاسلام شيئاً وشكله كده نصرانى مدسوس على المسلمين و حاقدا علينا ويظهر ذلك من كلماته التى ذكرها التى فيها سخرية و العياذ بالله من الله و الذى أوضح انه نصرانى هو ذكره لكلمة (الرب ، المقس ،....) و هذه كلمات لا يقولها إلا النصارى عباد الصليب ولم يكفيه ذلك بل تطاول على خيرا من أمثاله الشيخ الجليل الشعراوى رحمه الله و أقول لذلك الملحد إن لم تقل خيرا فلتسكت و رسالة اوجهها لكل المسلمين إستبشروا خيرا ألا إن نصر الله قريب"
archived = "2007-02-12"
