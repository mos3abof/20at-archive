subject = "حسبى الله ونعم الوكيل"
author = "إسراء"
posted = "2006-11-24"
text = "أنا مش فهمه هو عبد الحليم حافظ عمل إيه علشان يكون وجهه مشرفه-أمال الشيخ محمد متولى الشعراوى دا يبقى ايهاللى عاش عمره كلهفى طاعه الله وتفسير كتابه العزيز ونشر الدعوة الاسلاميه.وعبد الحليم حافظعاش عمره فى الغنا والتمثيل وكان أخر اعماله قبل ما يقابل رب كريم هو فيلم (أبى فوق الشجرة)وطبعا شفتو مدى الأدبوالاحترام اللى يتمتع بيه الفيلميعنى وهو فى أخر حياته ومع مرضه ظل يفكر فى الفن ولم يتقرب الى الله عز و جل.وبعد هذا الفرق من يستحق ان يكون الوجهه المشرفه لمصر.أكيد وبلطبع هو الشيخ محمد متولى الشعراوىاللذى إفتقدته الامه العربية وندعو الله عز وجل أن يرزقنا بشيخ جليل مثله. وبعدبن ايه اللى بيقولهاخينا ده من استهزاء براى الشيخ الشعراوى فى نكسه 67 وهو يعنى الظلام اللى كانت عيشه فيه مصر من عدم التقرب الى الله وعدم طاعه أوامرهواللى كانت تتضح فى الافلام المصريه اللى مابتخلاش من المناظر الخليعة وكان الفيلم مينفعش يبقى فيلم اللابالمناظر دى وحجات تانيه كتير لاتنتمى للدين باى صلهوبعد داكله وتقلى ربنا يوفقنا.طب مهو فى غزوة منغزوات المسلمين كان عددهم قليلواسلحتهم ومع ذلك ربنا نصرهم علشان ايمانهم القوى وطاعتهم لله. ونافى النهايه مش هشتمك بس هدعيلك ربنا يهديك وينورلك قلبك ويحسنلك اسلوبك ."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014154/http://masr.20at.com:80/article.php?sid=107"

