posted = "2006-07-30"
text = "سوف اطرح موضوع كامل في مجالس القصيم عن هذا الحدث<br />ولكني اقول ان صدق هذا فهو شهيد ان شاء الله<br />نعم هو مغني ولكن ياخوان لا نعلم قبل وفاته ماهو شعوره فالاعمال بخواتيمها<br />وثاني والله كل ماشفت اسمه عبد الحليم حافظ<br />اقول ذهبت يا عبد الحليم للحليم الحافظ<br />الله سبحانه وتعالى<br />وقد يكون هذا الخبر كذبه لذلك من المهم التثبت من الخبر"
