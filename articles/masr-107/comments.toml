posted = "2006-11-27"
text = "بسم الله الرحمن الرحيم<br />اولا أحب ان أشكرك على الجراة الى حضركتبت بها الموضوع واعرف ان حضرتك تقصد الوعى الثقافى والفكرى وان احنا مش بس نررد كلام مش فهمين لا نلجاللبحث ونكتشف الحقيقه<br />بس حضرتك اغلفت جانب مهم جدا عن الغلبيه من الشعوب العربيه وهو الوازع الدينى الى تقريبا بياثر فى نفوس الكثير منايعنى اما اجد كلمه لا اله الا الله محمد رسول الله على حبه فاكهه أوخضار دى شىء جميل وعظيم وعلى فاكرة ده ممكن ياثر فى نفوس كتير من البشر فى زياده التمسك باسلامنا الجميل<br />واخيرا انا بدى اقول لحضرتك انا أناقش قضيه بش ما أجرحش شعور غيرى<br />أنصح وأهذب بس برفق<br />صح ولا ايه"
