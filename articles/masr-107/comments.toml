[[comments]]
order = 29
subject = "خرافات!!"
author = "من غير ليه"
posted = "2006-08-04"
text = "لا يوجد أناس يؤمنون بالخرافات كما يفعل المسيحيون المتدينون في الغرب والشرق أيضا<br />يجب التأكد من صحة الخبر ثم تكون القضية كالتالي:<br />اما ان يكون الخبر كذبا واشاعة وهذا هو المعقول والمتوقع<br />واما ان يكون الخبر حقا وصدقا!!!! وهذا بعيد جدا لكن حتى لو فرضنا صحته لابد ان يكون لذلك اسباب مادية ساعدت على حفظ الجثة من التحلل مدة ثلاثين سنة!!<br />الله جعل لكل شيء سببا ودييننا بحمد الله يعصمنا من الخرافات والأساطير ورحم الله العندليب وأسكنه فسيح جناته اللهم ارحمنا وتب علينا انك انت التواب الرحيم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 30
subject = "هكذا نتأخر ..."
author = "زياد"
posted = "2006-08-06"
text = "يا جماعه .. ممكن جداً ميكونش أتحلل .. ممكن يكونو حنطوة في لندن .. اذا سافرت روسيا سترى جثة ستالين لم تتحلل .. ممكن قوي في لندن قالو أنه مشهور و عيزين يعمللوله preserve حتى لا تتعفن الجثه لحد لما يكملو بناء المقبرة ... ليه لاء فأنا سألت صديق في الطب الشرعي قالي ممكن قوي يكوتو عملو كدة"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 31
subject = "جة يكحلها"
author = "محمد لبيب"
posted = "2006-08-21"
text = "نا المانع من و جود اشارات و تذكرة من اللة, فنحن نؤمن بالامور الدينية مثلما نرى اي شيء مادي,فليس كل شيء يرجع الي منظور علمي,و ليس ما لا نراة فهو غير موجود.فلا يسعنا الا ان نقول سبحان اللة حينما نرى مثل هذة الامور و لا داعي لان نخلق جوا حاد من الجدال الذي لا نتقن غيرة تاركين معظم امورنا المهمة و احولنا الان<br />اما بالنسبة للكاتب فانا اعيب علية فيما قالة ,فهو ليس لة مجرد الحق في النقد علي الشيخ الشعراوي فالكاتب طبيب علي ما قرأت و ليس بدارس و لا يصح ان يتفوة بمثل هذة الالفاظ و الطريقة. انا معة فقط في ان لا نسعي وراء الخرافات و الدجالين و مثل هذة الامور,و لكنة \"جة يكحلها عماها\""
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 32
subject = "وما أوتيتم من العلم إلا قليلاً"
author = "رفعت شميس"
posted = "2006-08-24"
text = "سبحان مسبب الأسباب - ما من شيء في الكون إلا وهناك سبب في حدوثه ، وأعتقد أن سبب عدم تحلل جثة عبد الحليم يعود إلى أسباب علمية ...فمن المعروف أن سبب تفسخ الجثث وتحللها ناجم عن نشاط الديدان التي تتغذى على الجثة ، وهذه الديدان هي من الجسد ويبدو أن الأدوية التي تناولها عبد الحليم قبل وفاته أو الأبر والحقن التي أعطيت له قتلت الديدان والجراثيم في جسده وبالتالي نتيجة عدم نشاط البكتريا في التربة لعدم وجود الضوء والهواء جعل الجثة وكأنها في حافظة ."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 33
subject = "الصدق"
author = "محمد منير ابو المجد"
posted = "2006-08-29"
text = "ارى الهجوم على اصحاب الخرافات وعلى الشعب الذي يحب ويتلزز بالخرافات وإن كان للخرافات والاكاذيب بعض الجمال في نفس القارئ ولكن يجب ان نرى الى من يجلب لنا الخبر أو الخرافه فهو مصدر القلق ومصدر الكذب . ارى في كاتب المقال بعض السخرية على الشعب الغلبان جداً والذي يريد ان يتلهي فى اي شيء بعيد عن الواقع ... من منكم ياسادة ياصحفيين يتسم بالصدق .وانت يا صاحب المقال هل تتسم بالصدق على الاقل في هذا المقال ولا وجدت موضوع تكتب فيه وخلاص .. احنا زهقنا من كتر الكلام والكذب"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

