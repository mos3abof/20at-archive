text = "يااستاذ خالد احب اقوللك انك مهما وصلت درجة العلم عندك ففي الاخر انت كلك كدة علي بعضك من صنع الله ومجرد شىء بسيط يكاد لايذكر من خلق الله واياته ومعجزاته فحاسب واياك ان تستهزىء بالله ومعجزاتهل لاني مش انا اللي بقول كدة لكن الله عز وجل بيقول في كتابه الكريم بسم الله الرحمن الرحيم افبالله واياته كنتم تستهزؤن صدق الله العظيم واخيرالايسعني الا ان اقول لك كما قال رسول الله صلي الله عليه وسلم لقومه اللهم اهدي قومي فانهم لايعلمون"
archived = "2006-11-06"
