text = "انا بحب عبد الحليم بشكل مش طبيعي .هو بالعكس فرح الناس وبكاهم ,وصوته واحساسه المرهف,مش زي اغاني هالجيل.وبعدين عبد الحليم عانى بحياته كثير وانا بوصفه انه جرح بملامح انسان ...وبعدين في شغله عن الأخ اللي بحكي عنه مين هو وليش ,,مع احترامي لرأيك ...مين انت تا تحكي هيك وشو موقعك من الاعراب.... وما بنحكى على الميت الا الرحمه انا بحيي كل جمهور حليم وبحيي عائلته الكريمه وشادي شامل وادارة مسلسل حليم وشكرا........."
