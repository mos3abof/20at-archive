[[comments]]
order = 6
subject = "الأدب وقلة الأدب"
author = "كتكوتة"
posted = "2006-04-03"
text = "اعجبتنى فكرة المقال في البداية وما ان اسطدمت بكلماته الغير مهذبة توقفت عن قراءة المقال وفضلت ان اعلم كاتبه انه ينبغي على اي انسان مهما فكر نفسه حاجة جامدة ان يتأدب عندما يكتب خاصة وان كان مايكتب يتحدث عن الله سبحانه وتعالى ورسوله الكريم صلى الله عليه وسلم فمن الممكن ان نتقبل اسلوبا وقحا في الكتابة عن مبارك اون عن ولي عهدة المنتظر ولكن الذي لا يمكن ان يقبله اي شخص هو هذا الاسلوب ( ان الله لا ينتظر بطاطساية ولا طماطماية ) وهذه المعجزة العبيطة) وقد يكون هناك ماهو احط من هذه التعابير ولكن لا ادري فلقد توقفت عن القراءة حتى لا اتحمل ان يردد ذهني كلماتك عند قراءتي لها وشكرا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "وقفوهم انهم مسؤولون"
author = "رائد بغدادي"
posted = "2006-04-05"
text = "الاخ الكاتب هل تستطيع ان تخبرني ماذا ستقول عندما ستقف وتسأل امام الواحد القهار سينطق لسانك ويدك بماكتبت فأتقي الله بماتكتب كي تصدق اولاتصدق فهي مشكلتك كماهي مشكلة العلمانيين اما التطاول على معجزات الحق تعالى لاظهار الحق فهذا لوكان للمسلمين خلافة اسلامية تحكم بشرع الاسلام لكان لكم في الحياة قصاص يااولي الالباب ..هل تستطيع ان تخبرني ماالفرق بينك وبين رسام الكاركاتير الدنماركي لعنه الله فهذا يستهزئ بالله ورسوله واسلوبك هنا يستهزئ بالله ورسولة..والمثل يقول (قل خيرا او اصمت)"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "لله الامر من قبل ومن بعد"
author = "اشرف راجح"
posted = "2006-04-08"
text = "اولا اخي العزيز موضعك اتي في العصب اي في صلب الموضوع انا سمعت عن كل ما تتكلم عنة وانا معك فيها وانة لموضوع هداف<br />ولاكن يا اخي يوجد شيئ اسمة الخطابة<br />انا طريقتك في التعبر غير جيدة وبل المعني وقحة<br />يا اخي انا لما بخاطب انسان وحش وبتكلم معاة بكلام وحش وياتي ذكر انسان عزيز علي في الموضوع بحترم لساني واتكلم بل الحسن احترامة لذكر الشخص العزيز او الحسن<br />فما بالك ان تربط معا كلام المولي عز وجل كلام وقح يا اخي هذة لغة دنوية ولا يجوز انت تدخلها في الموضوع<br />موضعك جيد جيداا ولاكنك جعلت لة باب نقد واسع بهذا الكلام الي لا يجوز ان يوضع في موضوع اتي فية ذكر الله"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "ماذا عمل لأخرتة"
author = "مضر ياسين"
posted = "2006-04-09"
text = "كل انسان سوف يحاسبهاالله على عمره ماذا عمل به لمرضات ربه<br />ماذا عمل عبدالحليم<br />والله يقول(ويقولون ياويلنامال هذا الكتاب لايغادرصغيرة ولاكبيرة الا أحصاها)"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "خالد كوهين منتصر"
author = "محمد عبد الفتاح"
posted = "2006-04-09"
text = "الحمد لله وكفى والصلاة والسلام على نبيه الذى إصطفي<br />أخيرا وجدت مكان أكتب لأرد على الخالد الذى أدعو الله عز وجل أن يخلده فى نار جهنم ذلك العلمان الداعر الفاجر الكاذب الكذب الوقح الذي يتجرأعلى كل ماهو إسلامي<br />يا خالد إبن منتصر فلتعلم أنه سيطول وقوفك بين يدي الله عز وجل<br />يا خالد إبن منتصر هب أن الأن أخبتك أن وكالة الإستخبارات الأمريكية قد صورت فى أي مكان فى العالم أنه يوجد مكان فى غابات المكسيك كتب عليه بخط عربي واضح لا إله إلا الله محمد رسول الله أكنت مصدقها إى وربي ستصدق لأنه من الخنازير أمثالك يا خالد إبن منتصر لماذا هذا التجرأعلى كل ماهو إسلامي<br />بخصوص حديث الذبابة الذى إتخذته سخريا أكنت مصدقى يا كلب السلطان إن أخبرت أن العلماء فى جامعة أثبتوها عمليا يا كلب السلطان أما نحن يا خالد كوهين<br />فإننا نقول سمعنا وأطعنا ونقول قولة إبي بكر الصديق رضي الله عنه الشهيرة إن قال فقد صدق<br />إن قال فقد صدق إن قال فقد صدق<br />يا كلب السلطان ما قولك فى الإسراء والمعراج يا كلب السلطان إن من هوان الدنيا على اله عز وجل أن يتحدث أمثال من أشباه الرجال فى أمور الدين<br />وللحديث بقية"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 11
subject = "مخلد فى النار انشاء الله"
author = "ابراهيم محمد"
posted = "2006-04-18"
text = "لماذا يتهجم هذا الشخص على بعض المعجزات التى ظهرت ويعتبرها خرافة هل ظهور لفظ الجلالة على طماطماية أو بطاطساية يعتبر خرافة هل تدخل أحد فى صنع هذه المعجزة أم أنها من صنع الله عز وجل<br />ومن الممكن أن تكون إشارة من الله تعالى للعلمانيين المتخلفين بقدرة الله عز وجل ورسوله فى وسط هذا الكم الهائل من الفحش والرذيلة والبعد عن الله عز وجل فالله يقول انا موجود وسولى حقا موجود<br />ولقد رأيت فى كبد السماء معجزة ظاهرة وهو ظهور اسم الرسول صلى الله عليه وسلم \" محمد \" يظهر واضحا وكتوبا أو مرسوما فى السماء بالسحاب فاسماء فارغة تماما ولا يوجد فيها غير اسم \" محمد \" هل هذه صورة مرسومة أ خبر مذاع ...... اتق الله فكلامك لايقدم ولا يؤخر والله فعال لما يريد"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

