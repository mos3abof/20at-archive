posted = "2006-11-09"
text = "بصراحه الاسلوب خالي تماما من الذوق ومن احترام عقول الناس ده غير ان الدكتور خالد بينتقد كلام الشعراوي وده يدل علي جهله الشديد بشخصية الشعراوي وعلمه وقوة رؤيته للامور وبعدين الخرافات الي بتقول انها خرافات محدش يعرف اذا كانت خرافات ولا لاء معلش هاتلي دليل يثبت انها خرافه او هاتلي دليل يثبت انها حقيقه دي حاجات محدش عارفها يبقي كله علي حسب اعتقاده وثقافته<br />واعتقد انك في حاجه كبيره لمراجعه نفسك ولا انت عايز تفتح اي موضوع وخلاص تتكلم فيه وبعدين انا راييء انك تقراء اكتر في الطب يمكن تستفاد"
archived = "2006-11-17"
