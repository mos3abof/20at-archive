[[comments]]
order = 83
subject = "احب الله و رسوله"
author = "محمد"
posted = "2007-01-20"
text = "موضوع ممتاز وطرح عقلاني و منطقي . من هو عبد الحليم حافظ حتي لا تذوب جثته؟ كان داعية؟ او كان يدعو للفضيلة ؟كان ممن ساهم في تدمير بناتنا و شبابنا حتي بعد موته. ولو كان الله اعطاه كرامة لكان شفاه من البلهارسيا .كان حافظ على جثة قبل موته كانت كرامة له ؟ الذي لايمنع البلهارسيا ان تاكل جثته و هو حي لايمنع البكتيريا تحليل جسده وهو جثة يااصحاب العقول. المهم ليس موضوعنا عبد الحليم . عبد الحليم مات الله يرحمه راح لربه ان شاء عذبه و ان شاء رحمه . مايحزنني هؤلاء الذين يصرون ان يلغوا عقولهم. كما تفضل صاحب الموضوع انتشار الخزعبلات بشكل فظيع في دولنا الاسلامية بشكل عام . الدين جاء لينهي ذلك و لم ياتي محمد صلي الله عليه و سلم الا ليلغي ذلك و يحارب الخزعبلات. ويدعو الي العمل . ان كانت جثة عبد الحليم ولنفرض انها لم تتحلليا اخي اذهب واعمل بحوث واستنتج لماذا لم تتحلل ماهي المواد المستخدمة شو السبب . نحن اصحاب دين العمل دين الاجتهاد و البذل وعندما تستنفذ طاقتك كاملها تكون اعذرت امام الله . الله يعينايارب."
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120125537/http://masr.20at.com:80/article.php?sid=107"

