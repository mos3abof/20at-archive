[[comments]]
order = 38
subject = "أخي الكريم هذه قصتي"
author = "لولو"
posted = "2006-09-04"
text = "أخي الكريم أنا إنسانة تربوية ومتعلمة تعليم عالي ومثقفة ولله الحمد ومؤمنة أيضًا وأعلم أن في كلامك شئ من الصحة وإن كنت أخالفك الرأي في بعض معتدقاتك ،، فالله لا يحتاج لبراهين على وجوده سوى التدبر والتفكر وإمعان النظر والبصيرة وإعمال العقل فيما حولنا ،،، ومع ذلك فقد يكون بعض مما ذكرته فيه شيء من الصحة ليهدي الله به من يشاء من عباده الضالين عن الصواب،، سأحكي لك قصة واقعية حدثت معي شخصيًّا فقد احترق منزلي في منتصف الليل احتراقًا تامًّا لم يبقي الحريق الذي استمر قرابة خمس ساعات على شيء حتى الأرض احترقت وسقف المنزل اخترق من شدة الحريق وخرجت أنا وأبنائي بفضل من الله ورحمته أحياء وقد كانت لدي أربعة مكتبات ضخمة احترق كل شئ ولم يبقى له أثر أما حجرة نومي احترقت احتراقًا فظيعًا حتى الحديد ذاب ومع ذلك فقد كان في حجرتي خمسة مصاحف أقسم لك بالله العظيم الذي لا إله إلا هو بأنها لم تحترق حتى غلافها لم يحترق ولا زلت أحتفظ بها إلى اليوم وقد مرَّ على الحريق خمسة سنوات إضافةً أنه كان عندي في المطبخ الذي احترق كله بما فيه من ثلاجات وغيرها من الأجهزة كان فيه كيس نايلون به ست جالونات من العسل كنت قد اشتريتها لزميلاتي بالعمل صدق بأنها لم تحترق... هذا للعلم وللأمانة فقط أحببت أن أعلق وأذكر لك حقيقة ما يحدث من معجزات إلهية هي أكبر من أن تتخيلها.. وشكرًا لك"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

