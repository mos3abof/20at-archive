posted = "2006-05-27"
text = "الأخ خالد<br />لقد ذكرنى مقال حظرتكم بصينية البسبوسة المحشية بالطرشى فلقد كان مثالا للتناقض المقزز فقد تحدثت عن أمور هامة جدا لايجب السكوت عنها وفجأة أجدك تتحدث وتخوض فى معجزات رب العزة بطريقة أقل ماتوصف بها بأنها وقحة فتذكر أنك لا تتحدث عن ممثلة عاهرة و لا عن مسئول فاسد ولا لاعب منحرف بل تتحدث عن خالق الأكوان و نبى الإنسانية"
