author = "ahmad yusuf"
posted = "2007-01-11"
text = "بسم الله الرحمن الرحيم<br />عادة يلجأ الإنسان الى الخرافات و يتخذها كمخدر ليستريح من ضميره الوجودي فهو لا يريد أن يتحمل المسؤلية ... مسؤليته عن حياته و مستقبله و عن الكون ، فيهرع بنحت أصنما بيده ثم يتنحث لها و يخشاها و يسلمها مصيرة ، إنه خائف من تحمل المسؤلية عن نفسه و عن كل شيء حوله لا يريد أن يعيش \"القلق\" فالأسهل أن يهرب من هذا كله باختراع أوهام و خرافات يشعر خلفها بالامان و الراحة و هذا ضد الدين فالدين يرفع من شأن الفرد اجتماعيا و عقليا و روحيا ، وهو رفع من شأنه أن يسمو بإنسانيته إذ حرره من الشرك وعبادة القوى الطبيعية ، و أسقط عن كاهله نير الخرافات . وبدلا من أن يشعر أنه مسخر لعوامل الطبيعة تتقاذفه كما تهوى ، نبهه إلى أنها مسخره له و لمنفعته ، ودعاه إلى أن يستخدم عقله في معرفة قوانينها و يعمل فكره و بذلك فك القيود عن روح الإنسان ، وعقله جميعا ، وهيأه لحياة روحية و عقلية سامية و كا قال ابن رشد \" الحسن ما حسنه العقل و القبيح ما قبحه العقل لا يمكن ان يعطينا الله عقلا ثم يعطينا شرائع مخالفة له \" فبدلا من الجري وراء التخاريف و الكرامات باسم الدين فإن الدين الحق يقتضي ان نهتم في المرتبة الأولى بالحقائق العلمية .<br />و لكن مع هذا فإن التاريخ مليء بحوادث خارقة للطبيعة و إذا كان وجود اسم سيدنا محمد صلى الله عليه و سلم على الجبل او في الطماطم لا يجب ان يكون دليلا للإيمان لأن هذا في حد ذاته ضد غاية الحياة التى يجب على الإنسان فيها أن يختار بعقله فلو كان هناك معجزات لقضي الأمر و لكن ماذا يضرك إذا كان موجودا و الله قادر على ذلك وهذا ليس غريب و هناك الآف الظواهر - حاليا - لا يستطيع العلم أن يضع لها أي تفسير حتى الآن ، و الحالات الخارقة للطبيعة في كل مجالات العلم كثيرة و تكتظ بها الكتب الغر<br />اقرأ بقية التعليق .."
archived = "2007-01-15"
capture_url = "https://web.archive.org/web/20070115142822/http://masr.20at.com:80/article.php?sid=107"

[[comments]]
order = 81
subject = "أحبوا شعب مصر مسيحيا ومسلما"
author = "حاقظ جاويش"
posted = "2007-01-13"
text = "الموضوع فى غاية الجمال ولكن هناك تعليق بسيط وهو أننا يجب أن نتحرى الدقة عندما نقوم بإدخال ذكر المولى تبارك وتعالى فى كلامنا فلا نقول<br />\" وكأن الله جل جلاله وعظمت قدرته ينتظر بطاطساية أو طماطماية لبيان إعجازه وقدرته\"<br />ولكن كان من الممكن أن نقول<br />\" نحن لا نحتاج إلى إثبات لبيان إعجاز وقدرة الله جل وعلا \"<br />أيضا هذا الجزء من النص<br />\" فيستسهل إرجاع الظواهر الإجتماعية إلى أسباب غيبية علشان يريح دماغه كماحدث من الشيخ الشعراوى عندما فسر هزيمتنا فى 1967 بأنها عقاب من الله بسبب إبتعادنا عن طاعته \"<br />فهذا كلام لا يجوز الخوض فية لأنه حقيقة لا جدال فيها والدليل على ذلك أن من أهم أسباب النصر فى أكتوبر 1973 الصيحة ( الله أكبر ) ورجوع الناس شعبا وجيشا<br />الى الله<br />ورداً على سؤال حضرتكم<br />وأتساءل هل شعبنا معذور حقاً فى ذلك السلوك الذى يعوض به طناش الأحزاب وغياب السياسيين وقهر رجال الدين وهبر رجال الأعمال ؟<br />نعم شعبنا معذور حقاً فى ذلك السلوك لأنة لم يجد التوجية الصحيح رغم وجود وسائل الإعلام التى لم تمدة إلا بكل ما هو من شأنة الترفية وفقط<br />فإذا كنا نحب هذا الشعب ونحرص على مصلحتة فهيا بنا نتكاتف لنبث فيه روح العلم والثقافة ونمحوا ( الجهل والفقر والمرض )"
archived = "2007-01-15"
capture_url = "https://web.archive.org/web/20070115142822/http://masr.20at.com:80/article.php?sid=107"

