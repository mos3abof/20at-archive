text = "انتة يا كاتب انتة اتمنى ان يحشرك الله مع عبد الحليم اينما كان حتى يرسل لك كل يوم رسالة من تحت الماء يكتبلك فيه اني اغرق احرق اشنق. ولك انتة منو يا مطي حتة تتكلم على معجزات الله سبحانه و تعالى يعني انتة تركت العالم كلة و اول ما شطحت نطحت و تقلد على معجزات الخالق انه تذكير لك يا حمار و لكل من يسهو عن ذكر الله و معجزات لعصر اصبح الاساس فيه هو المادة"
