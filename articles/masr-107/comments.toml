[[comments]]
order = 0
subject = "واحدة كمان"
author = "سوسة المفروسة"
posted = "2006-04-01"
text = "وكمان الخرافة المنتشرة دلوقت على جدران كل المساجد...الصورة اللي خدوها من مركبة فضائية باين او قمر صناعي و لقوا الارض كلها مضلمة ماعدا مكة و المدينة...و صورة سفينة سيدنا نوح اللي لقيوها في تركيا و بعدين اتضح ان واحد مركبها بالفوتو شوب<br />انا من رايي ان الحاجات دي بتضر الاسلام جدا خصوصا لما بيتكشفوا ..و مش عارفه اللي بيعملوا كده نيتهم ايه بالظبط؟؟؟؟"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "رحمتك يارب"
author = "AyMo"
posted = "2006-04-01"
text = "ياجماعة لازم نعترف ان عبد الحليم كان صاحب كرامات ومعجزات ..انتو نسيتو اهم معجزتين؟ انة بيتنفس تحت الماء . وبيمسك الهوا بأيدية..!<br />لو سمحتو تفكرو الف مرة وتحللو الافكار قبل ماتصدقو اللى بتسمعوة وتشوفوة.<br />ياناس يامحترمين علماء الجيولوجيا اثبتو أن هناك بعض أنواع التربة لا تحلل اجساد الموتى يعنى طبيعتها كدة..وقد حدث وكشفت اجساد موتى لم تحلل ولم يمسها السوء..<br />يعنى دة مش معناة ان كلهم يبقو فى منزلة الانبياء والشهداء.<br />وارد عالسيد الفاضل اللى بيقول ان الموضوع نوقش بطريقة وقحة انة مع كل الاحترام ليك وكل محبى عبد الحليم ..لازم نواجة الخرافات والافتراءات على اللة بكل شدة . وعبد الحليم حافظ ماهو الا مغنى وزى مانشر الاغانى الدينية والوطنية نشر كمان كلمات تفتن وتحدث الغرائز يعنى لم يكن نبيا ولا شهيدا بل انسان يصيب ويخطىء .والان لايجوز علية الا الرحمة"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "خالد منتصر ماله؟"
author = "عبدالله مفتاح"
posted = "2006-04-01"
text = "من المعروف ان خالد منتصر دكتور نسا وتوليد وعقم؟ ماله هو ومال الكلام ده<br />مرة ييجي بجهله يتكلم في علم الحديث ويشكك في احاديث من صحيح البخاري<br />ومرة ييجي عايز يعتمد على العلم اعتماد كلي<br />وهو اصلا جاهل بامور الدين وبدل ما يتكلم في علم الحديث يشوفله حاجه خاصه بالنسا والولاده يتكلم فيها"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

