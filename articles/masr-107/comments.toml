order = 23
subject = "ادب الحوار"
author = "مسلم بسيط"
posted = "2006-06-05"
text = "يجب ان يكون ادب الحوار من الطرفين من الكاتب والقاريء وبالنسبه للشيخ الجليل الشعراوي رحمه الله فاخشي انك لم تستوعب ما قال وارجوا ان بكون ذللك بحسن قصد منكم فما قاله الشيخ هو نفس ما قلته انت والفرق انه اوجز لاته بليغ وانت فسرت فقال رحمه الله ات سبب الهزيمه هو البعد عن الله وقلت انت ان السبب هو الديكتاتوريه والفساد الخ اليس ما قلته انت هو تفسير البعد عن الله مع رجاء لسيادتكم بادب الحوار خاصه مع من اختاره الله الي جواره ولا يستطيع الرد هدانا الله واياكم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 24
subject = "ثقافه زائفة وكلمات تافهه"
author = "واقعى وليس متفلسف بليييييد"
posted = "2006-06-11"
text = "لا شفاك الله ولا عافاك<br />ولا سامحك الله<br />من انت ومن نصبك لكى تنتقد بهذه الطريقه.<br />ليس النقد عيبا ولكن النقد البناء ولايسمى هذا بنقد وانما سباب علنى وفيه استهزاء كثييييييييييييير بالدين<br />لا سامحك الله"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

