[[comments]]
order = 4
subject = "اتقوا الله"
author = "عبد الله"
posted = "2006-04-02"
text = "يا أخي اتقل الله لا تتحدث بهذه الطريقة عن معجزات ليست من صنع البشر وتطلق انت عليها خرافات هل وجود لفظ الجلالة على (البطاطس والطماطم) خرافة وأكثرها تكراراًً والله لسوف تقف بين يدي الله وتحاسب.<br />يا أخي لك مطلق الحرية تصدق أولا تصدق ولكن لا تطلق عليها خرافة فهو قادر على كل شيء<br />حسبي الله ونعم الوكيل"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182717/http://masr.20at.com:80/article.php?sid=107&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

