subject = "لا يجوز على الميت الا الرحمة"
author = "لما"
posted = "2006-12-29"
text = "لا يجوز القول عن هذه القصة خرافية دون أن نرى بأعيننا ربما هذه القصة صحيحة و ان الله غفور رحيم رغم انني عندما كنت أستمع الى أغانيه قالت لي أختي بسخرية انه الان يتعذب في قبره وفي اليوم التالي دهشت فعلا عندما قرأت هذه القصة أن جثة عبد الحليم ما زالت كما هي ما مصلحة شيخ المسجد ان يكذب انا من جهتي أصدق هذه القصة ومن الأدب ان لا نذكر الميت الا بالخير والدعاء والدعوة له بالاستغفار وان أراد أحد ان يقول عن هذه القصة انها خرافة فليقل ولكن ليس له الحق في أن يذكر اسم عبد الحليم بأي سوء والله أعلم"
