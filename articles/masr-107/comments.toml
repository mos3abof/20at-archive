[[comments]]
order = 94
subject = "الحقيقة العلمية"
author = "عبد الله"
posted = "2007-02-13"
text = "ليس معنى انتشار بعض الاشاعات الكازبة والتى تصدق من قبل الشعب الغلبان بان كل شئ يحدث في هذا الكون له حقيقة علمية وان كان صحيحا فما التفسير العلمي لانشقاق القمر لسيدنا محمد والتفسير العلمي للاسراء والمعراج .<br />معجزة الله الواحد ليبين قدرته العظيمة والتى مما لا شك فيه واضحة تمام الوضوح للعقل المفكر<br />اخى ليس معنى فساد الجزء فساد الكل ايضا لان هناك فعلا معجزات يصنعها الخالق في كل يوم وكل لحظة للتزكرة بان الله موجود ، ولتعلم ان وجود الانسان نفسه هو معجزة من الله ونعمة<br />وفي النهاية احب ان اوضح ان كثير من هذه الاحداث تعتبر شائعات كاذبة ولكن هناك ايضا حقائق ."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219212748/http://masr.20at.com:80/article.php?sid=107"

[[comments]]
order = 95
subject = "هيهات"
author = "سارة"
posted = "2007-02-13"
text = "رغم أن المنطق يغلب على كلامك ، إلا أن مغالاتك في انتقاد مايسمونه بالمعجزات وأسلوبك في الطرح يشي بعلمانيتك المفرطة ، رائع أن نتخلى عن الخرافة ، ورائع أن نعتمد العلم مرجعا في مختلف المسائل ، ولكن نحن في مجتمعات لا تزال في بداية خطواتها الأولى ونتعرض لمختلف وسائل القهر الإجتماعي والسياسي ...لذا تحتاج هذه المجتمعات إلى شيء من \" الخرافة \" المقبولة كي تنسى همومها اللامتناهية ، أريد أن أذكرك أخي العزيز بشعار رفع أثناء الثورة الفرنسية يقول \" أعطني خبزا كي أحافظ على كياني واعطني خمرا كي أنسى همومي \" هذه شعوب تريد أن تنسى همومها فماذا عن شعوبنا نحن ؟ شعوبنا مهددة في كيانها وفي خبزها وفي عقولها أيضا ، هي شعوب مستهدفة ، فماذا تريدها أن تفعل ؟ أن تلغي كل موروثاتها وتحرق كل مراحلها وتتناغم مع قوانين العلم دون سابق إنذار ، أوروبا قطعت مراحل عديدة لتصل إلى ماوصلت إليه ، أوروبا ناضلت ودفعت الكثير لتحقق ريادتها في جميع المجالات ، أما نحن فلازلنا شعوبا جائعة تناضل من أجل القوت اليومي فما بالك بالنضال من أجل تحرير عقولنا من الخرافة ، الأرضية لازالت غير مهيئة لمثل هذه النضالات..........."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219212748/http://masr.20at.com:80/article.php?sid=107"

[[comments]]
order = 96
subject = "رد"
author = "حسين"
posted = "2007-02-18"
text = "انا مؤيد للكاتب في بعض الأشياء اللي ذكرها وانا معاه فعلا في نقطة رائد الفضاء<br />بس انا شايف انه بيبالغ في تعصبه لآن هو غلط غلطه كبيره في نقطة الهزيمة في 67 طبعا انا مؤيد للشيخ الشعراوي 100% لأن يا عزيزي انت بتفسر سبب الهزيمة علي اللي قلته في ضعف سياسي وفساد الخ .........<br />ولكن الشيخ الشعراوي فسره علي اساس البعد عن الله واحنا طبعا هه وللأسف أخدنا التبير ده علي اساس انه معني روحي فكلمة الله اليوم تأخذ علي انها كلمه روحية خاصة غيرعامة<br />ولكن الله هو الخالق للكون وللأنسان والزمان فالله انزل القران والقرأن يحوي ما يكفي من أيات لسيت للدين فقط ولكن للدنيا بيثبات الدين تستقر الأمور في الدنيا فلا يوجد فساد بوجود الدين وان توهان الدين يؤدي الي الفساد وزوال الملك فالله امر بالشوري ونجد ان عكسها الديكتاتورية وامر بالعدل ونجد مكانه الفساد وأمر بأعداد القوة قال تعالي \" وأعدوا لهم ما استطتعتم من قوة ومن رباط خيل ترهبون به عدو الله وعدوكم \" فالله أمر بأعداد جيوش قوية فيا عزيزي لو أخذت اسباب هزيمة 67 ستجد ان الله أوجد لنا حلها ولكن لا حياة لمن تنادي فلو اخذنا بالمنهج الألهي ستنهض الأمه ويرتفع شأنها بأذن الله وهذا لن يحدث طالما نعتبر نحن ان كلمه \"الله\" كلمه روحانية بحته تعني انك طالما انك تصلي وت}دي فروضك الخمس فأنك تعنب انك مسلم ومؤمن وتعتقد بذلك انك اديت ماعليك لله عز وجل هيهات يا عزيزي !!!!<br />وبالنسبه لموضوع عبدالحليم فهذه تفاهه لا أحب ان اتكلم فيهاوبالنسبه لكلمة الله علي النبات والحيوان والجبال والسحاب قال تعالي سبحان الله : \"وسنريهم اياتنا فى الافاق وفى انفسهم.....\" صدق الله العظيم<br />وشكرا ....................................................."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219212748/http://masr.20at.com:80/article.php?sid=107"
