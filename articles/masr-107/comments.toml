posted = "2006-10-13"
text = "لاحول ولا قوة إلا بالله<br />كنت أتصور ان المسلم كلما زاد ايمانه زاد أدبه , وأعتقد أن القرآن ملىء بالآيات التى تحض على حسن المجادله فى محاوله لكسب الآخر ,ولكن نحن نجتهد فى أن نخسر, وبهذا وبمفاهيم أخرى مترديه أصبحنا كمسلمين فى آخر الصف,انا متأكد أن الردود كلها تعبر عن غيرة أصحابها على الدين ولكن ألم يكن من الأفضل أن أكسب أعدائى ,<br />على فكره يبدوا أنكم جميعا لم تستوعبوا ماعرضه عليكم الدكتور خالد فالواضح أنه مؤمن جيد يعرض رؤيته بعقل مستنير"
