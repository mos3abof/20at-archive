text = "لا أوؤمن بنجاح الفكرة لأنه من السهل الحصول عليها كما حصل معظم زملائي على رخصة القيادة من دون أن يذهبوا لإدارة الرخص أعتقد أنه إذا كانت الرخص التي تستند عليها أرواح فكيف بهذه الرخص<br />و الشيء الآخر أعتقد أن الشباب سيأخذها مأخذ السخرية للأسف مع العلم أن نسب الطلاق تتزايد للأسف<br />فما الحل إذا"
