posted = "2009-05-30"
text = "بسم الله الرحمن الرحيم<br />هذا الموضوع للأمانة منقول من منتدى آخر ..<br />وعندما رأيته وجربت الموقع المذهل..آثرت أن أضعه ليستفيد به إخواني الأعضاء<br />وهو عبارة عن موقع مذهل لارسال رسائل الجوال إلى جميع انحاء العالم وباللغة العربية والانجليزية مجاناً.<br />بالاضافة أن الرسالة تصل وكأنها مرسلة من رقم هاتفك الخاص ولا يظهر أى علاقة للموقع.<br />وكذلك وجود أرشيف للرسائل يمكنك من الاحتفاظ بكل الرسائل التى قمت بارسالها.<br />امكانية تسجيل قائمة تليفونات خاصة بك.<br />امكانية تحديد وقت ارسال الساعة بالتاريخ والساعة.<br />امكانية معرفة وصول الرسالة أو عدم وصولها.<br />وعدد أحرف الرسالة 160 حرف وهو أقصى عدد ممكن يصل إليه أى موقع.<br />والكثير والكثير من المميزات …<br />الد[ *** ] الى الموقع<br />http://www.free—sms.com/ar/index.go?refid=826717"
archived = "2009-08-13"
capture_url = "https://web.archive.org/web/20090813225028/http://www.20at.com:80/20at/ana-s3ody/12214-2009-05-28-11-04-03.html"

