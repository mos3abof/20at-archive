posted = "2009-08-04"
text = "صلاة الفجر بحس بجد لما اصليها اليوم بيعدى من غير مشاكل بفضل الله اما اليوم بقى الى انسى او انام متاخر والحمد لله بيعدى بس بتحصل فيه حجات تفرق كتير عن اليوم الى صليته يا رب لا تكلنى فى نفسى طرفة عين واصلح لى حالى<br />تقبلوا مرورى"
archived = "2009-08-05"
