[[comments]]
order = 0
subject = "حد الحرابه"
author = "زنوبه"
posted = "2006-11-05"
text = "مش قلت لكم فى تعليق قبل كده إن الرادع ضعيف ، لن ينصلح الحال إلا إذا تم تطبيق حد الحرابه على كل من يتعرض لآنثى بالقول آو الفعل بدءا من الجلد إلى الإعدام وآن يتم تطبيق الحد فى ميدان عام وقتها حيتعلموا غض البصر.<br />نصيحه لكل البنات كل واحده تشيل وسيلة دفاع عننفس فى شنطتها وما تسكتيش لو حد فكر يقولك كلمة تجرحك إفضحى آهله.<br />آنا عن نفسى بابتدى معاهم الوصله ب \"عيب يا تافه يا بن التافه \" آبص آلاقى الواحد منهم ماشى بيدارى نفسه فى الرصيف، لآنهم بيفهموا سكوت البنت غلط وبيفتكروها مبسوطه ، آؤكد لكم إن الاستفزاز اللى الناس فيه اليومين دول حيخلى ولاد حلال كتير قوى يقوموا بالواجب وذياده مع اللى بيعاكس<br />وبرضه خلى معاكى وسيلة دفاع عن نفس فى شنطتك ـ لو تعرفى حد بيسافر بره مكن يجيب لك صاعق كهربى آو زجاجه \"زجاج\" لا تزيد عن واحد سم معلهش خديها من وحطى فها مية نار حلوة مش حاميه علشان تحرق من غير ما تشوه<br />فيه حيقولوا كده كتير لكن الرد إن برضه كتير اللى شوارعنا وصلت ليه!!!"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

[[comments]]
order = 1
subject = "نتنظر المزيد"
author = "تهامى"
posted = "2006-11-05"
text = "انا مش مصدق اللى بيحصل ده ... بس بجد البلد بقيت غريبة اوي<br />النقاب و السعار الجنسي<br />مظاهرات تحدث في جامعة حلون بسبب أن العميد جامعة حلون .. رفض أن تدخل بنت المدينة الجامعية بدون أن تكشف عن شخصيتها الحقيقة ... في نفس الوقت تحدث في أيام العيد حوادث السعار الجنسي التي يصورها البعض على أنها ثورة للشعب<br />تعالى نقرب الحادثتان من بعض النقاب و السعار الجنسي ؟ و الغريبة أن الاثنين بيحصلوا في بلد واحد اسمها مصر ؟ وممكن يكون من الناس اللي اشتركوا في وسط البلد كانوا مشتركين في مظاهرات النقاب ..لان التناقض أصبح عادي ؟<br />حوادث السعار الجنسي لم ترك منقبة او متبرجة أو حامل كما نقلت روايات الشواهد ؟ لا أعرف لماذا لم نسمع بيانات واضحة في الإعلام عن هاتان الحادثتان ؟<br />أتمنى أن أسمع رأي دكتور علم نفس أو اجتماع عن ما يحدث في بلدي ؟ ما تفسير هذا التناقض الرهيب ؟ أتمنى أن يجيب أحد لي من هم المصريين و ما هي صفاتهم المشتركة ؟<br />مما أنى لم أشاهد ما الحدث لا أستطيع أن أجزم بما حدث و لكن ثقافتي و عشرتي للمجتمع المصري تجعلني أصدق أن ذلك يحدث في مصر<br />http://tohamy345.blogspot.com"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

