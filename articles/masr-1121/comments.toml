[[comments]]
order = 10
subject = "من غير قانون ما فيش حلول"
author = "بسمه"
posted = "2006-11-06"
text = "تابعت الموضوع ده في معظم الجرايد وعلي النت معظم التعليقات جاءت بحلول لاسف فاشلة وانا مستغربة ان الناس مندهشة ان ده بيحصل في مصر وشوية يقولوا تحرش و حبة يقولوا سعار و كان بلادنا بس اللي فيها رجالة و اننا نفضل نوصف الحالة و نتكتفي بسب هولاء الشباب علي فكرة الرجالةالكبار كمان او اننا نقول ان الفضائيات والكليبات والسنيما هي السبب دى حجة سخيفة جدا تفتكروا ان ده ما حصلش في الغرب الكافر حصل طيب المسلمين اللي عايشين في اروبا وامريكا بيشوفوا الستات شبه عراه بيعملوا ايه والا هما مش زى شبابنا منهم الغني والفقير بل بالعكس ما يحدث في مجتمعاتهم ابشع مننا الف مرة من حيث الانحلال لكن عندهم قانون بيطبق من الجانبين الامن من ناحية والمواطن يقدر شاب يتحرش ببنت الا بمزاجها دى كانت وقعته سوداء السجن علي طول لازم كل بنت عندنا يحاول اي مجرم يقرب منها من غير ردح تاخذه علي قسم الشرطة ولا تتنازل عن حقها تحت اى ظرف لازم نجبر الدولة علي تطبيق القانون و ده مش ها يتحقق الا لما يكون عندنا قضاء مستقل عن سلطة الدولة لازم ناخذ حقنا بنفسنا ما ننتظرش من دولة غائبة ونايمة في العسل تحافظ علي شرفنا فاقد الشيء لا يعطيه"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

[[comments]]
order = 11
subject = "نصيحة من مجربة"
author = "أمة الله"
posted = "2006-11-06"
text = "السلام عليكم ورحمة الله وبركاته<br />يا اخواتى اللى بيقولوا حتى الحجاب الشرعى والا الخمار ماسلموش لا معلش مشكلتنا ان معظمنا حجابه الاساسى برا يعنى فى اللبس بس مش برا وجوا وعن تجربة مبدئية وانا لابسة خمار يعنى طرحة طويلة مغطية ثلاث ارباع الجسم وجوانتى ووش مافيهوش مكياج انى مرة اتعرضت لمعاكسة من شاب بيدور على رد فعل وسبحان الله مكنش فى رد منى الا استتغفر الله العظيم بصوت عالى ووشى فى الارض وفى ثوانى لقيته عمال يقول انا اسف انا اسف وكل ده فى مجرد ثانية او بالكتير اتنين مريت فيها جنبه<br />فمعلش مانغالطش نفسنا اه الحجاب هو الحل والاحتشام فى اللبس والمشى والنظرة هو الحل<br />والحجاب يبقى من جوا وبرا يعنى زى ما قال اخونا انك تحصنى نفسك بالتسبيح طول مانتى ماشية وليه ماتعوديش نفسك على الادكار اللى علمهالنا الرسول عليه الصلاة والسلام عند النزول من البيت وعند رد شر اللى تخافى من شرورهم (نرجع للدين اكتر من كده شوية/ الدين مش صلاة وصوم وبس ده منهج حياة) ووالله قسم احاسب عليه يوم الحسرة ان اللجوء لله والاحتماء بمعيته احسن مليون مرة من اى وسيلة دفاع وربنا سبحانه وتعالى هو اللى بيوكل عنك ملايكة يدافعوا عنك ويعموا بصر اصحاب القلوب الضعيفة<br />وده مايمنعش برضه ان المؤمن كيس فطن شيلى معاكى بخاخة بس مش مية نار عشان مانبقاش نزلنا لمستوى الاجرام وادى البشر اللى يمكن يمكن يكون سلوكك سبب من ربنا لهدايتهم بعد كده ويا ما قصص من ناس تابت من العن من كده/ بس ممكن تحطى فيها عصير بصل او لمون او حتى ميا بشطة كل ده بيوجع ويلهى وفى نفس الوقت الادى منه مؤقت لحد ما تتصرفى فى وسيلة نقل او اشخاص يقفوا جنبك<br />وفى النهاية بس عايزة اقولكوا حاجة<br />خلاص دلوقتى المجتمع عرف ان الله حق وان الناس اللى بيقولوا عليهم مقفلين<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

[[comments]]
order = 12
subject = "حل المشكلة من أساسها"
author = "نورة"
posted = "2006-11-06"
text = "لنحل كل المشكلات التي تعاني منها مجتمعاتنا يجب ان نعرف ما هو أساس تلك المشكلة اي ما الذي جعل هذه المشكلة تبدأ أصلا.<br />طبعا مفهوم جدا ان الاساس هو الوازع الديني وتطبيق شريعة الإسلام في كل شيء ..لكن كيف يمكن لنا ان نطبق الشريعة الاسلامية على مجتمع ككل..<br />ارى ان نبدا بتطبيق القاعدة النبوية :\" كلكم راع وكلكم مسؤول عن رعيته \" ولا تنبطق هذه القاعدة على مسؤولية الاب في بيته ومع أولاده فحسب بل تتسع لتشمل المجتمع. يعني من المسؤول عن هذا المجتمع او ذاك..<br />مشكلتهم انهم لا يدركون ان سيحاسبون امام الله يوم القيامة عن كل هؤلاء العباد الذي في ذمتهم."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

[[comments]]
order = 13
subject = "اين السبب"
author = "شريف"
posted = "2006-11-06"
text = "السلام عليكم ورحمة الله وبركاته<br />لماذا حدث ما حدث فى وسط البلد من قلة ادب وتجمعات شبابية للتحرش بالفتيات والسيدات لماذا حدث ذلك فى بلد الاسلام والازهر الشريف اكيد حدث ذلك لغياب الوعى الدينى غياب الدعاة (قهريا) وغياب الوازع الدينى اكيد ايضا ولابد لنا من افاقة لما حدث والتفكير فى حلول سريعة لتجنب هذا كثيرا لأن ذلك اساءة لنا جميعا عربا ومسلمين ومصريين اين علماء الامة من هذا اين الازهر الشريف واقول ايضا اين الحكومة وان ما حدث ناتج ايضا عن تسيب واستهتار الرقابة بعرض افلام خليعة وقلة ادب وبها عرى وجنس وما شابهة ذلك من انحلال اخلاقى ودعوة للجنس علناوقد حدث ذلك اما سينمات يعرضن افلاما خليعة واكيد هذا الحدث ناتج عن هياج الشباب من هذه الافلام خاصة وان احدى بطلاتها راقصة شهيرة معروف عنها الخلاعة والانحلال، ولابد من اطلاق ايدى علماء الامة لكى ينورا الطريق امام شبابنا (طريق الهداية) ويأخذوا بأيديهم الى الفلاح والنجاح ان شاء الله تعالى وارجوا من الحكومة ان تضرب بأيدى من حديد على كل شخص يريد النيل من سمعة وشرف هذه البلاد واذى شعب هذه البلاد بالقول او الفعل."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

[[comments]]
order = 14
subject = "المشكلة مش البنات بس ولا الولاد بس"
author = "اللي عايز أأكد عليه ان المشكلة أكبر بكتير من كام شاب صايع متهيجين أو كام بنت مش مؤدبة ولا عندها دم، لأ المشكلة بقت مشكلة مجتمع فعلا ً مهدد بالانهيار الأخلاقي والاجتماعي ومن ثم الانهيار الكلي."
posted = "2006-11-06"
text = "وحتى تحل هذه المشكلة فليس أمام الفتاة المحترمة حتى الآن سوى ان تلبس محترم، وتتكلم محترم، وتحط في شنطتها ما يردع بجد \"مش الملح والفلفل الأسود والكلام الفارغ ده\"، عشان هو الموضوع كله عبارة عن تجارب بيتناقلها الشباب السافل، فلما واحد فيهم يتعور في وشه، وللا جلده يتحرق بمية نار ويقول لزميله يخاف ليكون حظه منيل ويقع في نفس البنت الجدعة.<br />ده طبعا لأن عساكر الدولة اللي بيسدو الشمس وقت المظاهرات مش بيكونوا ومش هيكونوا موجودين عشان يدافعوا عن البنت والكلام الفارغ ده، لأن مهمتهم أعظم من كدة بكتير .. هما بيدافعوا عن الباشا وحرمه والباشا الصغير .. وبس"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

[[comments]]
order = 15
subject = "يا آستاذ مش مهم"
author = "زنوبه"
posted = "2006-11-06"
text = "الاستاذ اللى مسمى نفسه \"مش مهم\"<br />لأ يا سيدى تطبيق حدالحرابه يجب آن يكون من الاولويات ويكون آول حاجه تطبق من الشريعه لآنه حمايه لى ولآختك ولآبنتك وزوجتك وكل من تحمل آسمك ـ حتى لو كانت آمرآة غريبة تآمن الحياة معنا<br />وبعدين هو يعنى علشان الشياب مش لاقى يتجوز يقوم ينزلوا ينهشوال فى آعراض الناس !!! إخص !!! ده مش عذر آبدا<br />آمال فين الصوم اللى آمر بيه الرسول عليه الصلاة والسلام<br />لا حول ولا قوة إلا بالله العلى العظيم<br />ما زلت مصرة على رآى آن تطبيق حد الحرابه هو الرادع الوحيد لوقف هذا الفساد"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

[[comments]]
order = 16
subject = "مينفعش"
author = "عبدالله مفتاح"
posted = "2006-11-06"
text = "فين اللي اغلب البنات محجبين حجاب اسلامي بشروطه الصحيحه<br />انا شايف بنات البديهات مليه الدنيا والبنطلونات مغرقة الشوارع<br />هو اي كلام في اي كلام وخلاص؟<br />شيوخ تاني؟<br />يا دي المصيبه<br />مش بقلكم في مرة واحد هيقول الشيوخ هما سبب ثقب الاوزون<br />عمالين تحاسبوا المتحرشين ومحدش فكر يحاسب وزعلانين من محاسبة العاريات<br />طالبوا بوقف العري مع مطالبتكم بوقف التحرش حتى تكونوا منصفين<br />على فكرة يا زنوبة ايه رايك نطبق حد الحرابة على البنت اللي عارية؟<br />لو موافقه محدش هيعارض يتنفذ على المتحرش<br />وكل عام وانتم بخير"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

[[comments]]
order = 17
subject = "حد الحرابه مرة آخرى"
author = "زنوبه"
posted = "2006-11-06"
text = "آنا مش فاهمه إيه اللى مضايقكم فى تطبيق حد الحرابه على المتحرشين ، واخدينه ليه بصورة شخصييه كده ؟!! إنتم تعرفوا حد بيعاكس البنات وخايفيين عليه يتجلد فى ميدان عام قدام الناس كلهاويتفضح.<br />وبعدين مش كل المصايب ترموها ع البنات!!<br />غض بصرك يا آخى وإتق الله؟؟!!<br />زى ما فيه بنات غير محتشمات فيه رجاله يدب قى عينها رصاصه ع المحتشمه وغير المحتشمه ـ والله العظيم آنا آعرف بنات ليس بهن مسحة جمال وغايه فى الادب والاحتشام وتعرضت إحداهن لمحاولة خطف داخل سيارة فى شارع جسر السويس وواحده تانيه حجابها ما يختلفش عليه إتنين كانت العربيات تقف تقاولها على السعر لدرجة آنها جائت لى فى مرة تبكى وبتقول \"آعمل إيه يعنى ده آنا لابسه خيمه\" يا جماعه إتقوا الله فى النساء فرسول الله آوصاكم بنا خيرا وآوصاكم بالضعيفين اليتيم والنساء بدل ما فيه شيوخ فى خطبهم وفى برامج التلفزيون هاريين الستات ذم وبهدله لغاية ما حولوا المرآة لمجرد حتةلحم يا مكشوف يا متغطى لكن فى النهايه لحم زى ما قال مفتى آستراليا ، يا ريت الشيوخ دول يركزوا خطبهم على تربية ضعاف النفوس من الرجال وتذكرتهم بوصية رسول الله فينا<br />طيب وفتاة طنطا اللى كان حجابها لونه آسود وماتت آثناء آغتصابها لآنها مريضةبالقلب . دمها فى رقبة مين؟ فى رقبتنا كلنا مش بس ولى الامر وآدى النتيجه وآؤكد لكم إن القادم آسواء إذا لم يتم تطبيق حد الحرابه ـ ياعالم ده اللى خطفها وإغتصبها وتسبب فى قتلها آخذ 3 سنوات سجن بس<br />إتقوا الله فى النساء"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

[[comments]]
