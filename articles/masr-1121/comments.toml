subject = "منهم لله"
author = "ام محمد"
posted = "2006-11-06"
text = "كل واحد بيعاكس بنت اويتعرض لها بالقول او الفعل منه لله عز وجل وعاوزه اقولهم ان يوم القيامه ان شاء الله سوف تشهد اعضاء جسمه عليه وسوف ينطقها الله عز وجل لانها فى الدنيا مسخره له يفعل بها ما يشاء ولكن يوم القيامه سوف تشهد عليه وبالنسبه لحادثة التحرش الجنسى التى حدثت فى وسط البلد الله اعلم اذا كانت حقيقه ام لا ولكن لفت نظرى انها حدثت امام السينما ولماذا يا اختى تذهبى للسينما بصراحه انتى غلطانه ده المعاكسات وقلة الادب فى كل مكان ربنا يرحمنا وانتى رايحه للنار برجلك سينما ايه ونيلة ايه ربنا يهدى كل شباب المسلمين والمسلمات"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

