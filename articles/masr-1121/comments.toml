[[comments]]
order = 29
subject = "كل ماسبق"
author = "عبد من عباد الله"
posted = "2006-11-26"
text = "كل ماسردتموه هو من الاسباب والعجيب<br />ان معرفة السبب اول مرحلة من مراحل العلاج الا في مشاكلنا نحن<br />فنحن نعرف ان الظروف الاقتصادية عامل والازياء الخارجة عن المألوف والعرف عامل وقلة تربية بعض الشباب والبنات عامل<br />وعدم تطبيق شرع الله وحدوده اهم واكبر عامل والكبت السياسي عامل والعوامل كثير لكن فين الحلوللكل العوامل دي والعوامل اللي جدت واللي هاتجد تاني<br />انا مع ان البنت ما تسكتش لان دا بعطي مبرر للحيوان اللي اتسفل عليها بالاستمرار والمزيد ومع انها تحاول حماية نفسها باي وسيلة مادامت ليس هناك وسائل حماية اخرى ولكن !!!!<br />نحن جميعا مع ان تحترم الشارح في ملبسها وسلوكياتها واذا كانت محجبة يبقى الحجاب كما قيل سابقا جوهر ومظهر<br />وربنا يحفظنا جميعا من المصير الذي نهرول اليه انفلات امني وخنقة سياسية وبطالة وهياج وحمى الجنس وضغط من الاعلام على شهوات الشباب وتيسير كل وسائل الاثارة ومحاربة التواجد بالمساجد ياااااااااه عايزين كمان ربنا يسترها عليكي يا بلد"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

