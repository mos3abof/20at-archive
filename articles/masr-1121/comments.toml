[[comments]]
order = 4
subject = "ايه المطلوب بالضبط من البنات؟"
author = "بنت مصرية"
posted = "2006-11-06"
text = "(ومرات أخرى ينتهي الأمر بسيل من الردح والشتائم والبهدلة من المرأة مدافعة عن نفسها، لذلك كنا نحرص على أن نختار بنت أو سيدة يظهر عليها الاحترام، بنت ناس يعنى، ونبتعد كل البعد عن بنت البلد أو من يظهر عليها ذلك)<br />يعنى ناس كتير ظلموا البنات وقالو ان البنات هى السبب لانهم مش محترمين ودلوقتى اللى بيتحرشوا بيقولو انهم بيدوره على البنت المحترمة<br />ايه المطلوب مننا بالظبط؟<br />قالولنا حجاب لبسنا حجاب<br />قالولنا عبايات لبسنا عبايات<br />قالولنا بلاش مكياج قولناموافقين بلاش مكياج<br />ايه المطلوب مننا تانى؟نمشى نردح فى الشوارع؟<br />مينفعش نكون بنات محترمين وولاد ناس علشان نحافظ على كرامتنا<br />احنا مظلومين فى البلد ده من كل ناحية سياسيا و اقتصاديا و اجتماعيا وحتى دينيامفيش مرة سمعت شيخ عيب عليكوا ولكن دايما الاتهام للبنات مع ان معظم ستات مصر محجبات حجاب بشروط اسلامية صحيحة<br />يظهر مفيش غير مية النار على راى الاخت زنوبة فى التعليق الاول"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

[[comments]]
order = 5
subject = "رد على المفتي زنوبه"
author = "مش مهم"
posted = "2006-11-06"
text = "نصيحة لكل البنات:<br />الاحتشام في الملابس<br />الاحتشام في الكلام<br />الاحتشام في المشي<br />عدم الضحك<br />عدم لفت الانظار بأي شيء<br />البنت تمشي زي العسكري بالخطوه السريعة<br />لا تبص يمين ولا تبصي شمال<br />والبنات المحجبات والمنقبات ساعات ما بيكنش فيه احتشام خالص للاسف.<br />والتحصن بذكر الله سبحانه وتعالى والدعاء طول ما هي ماشيه في الشارع.<br />ولازم تعرف البنت الحالة النفسية اللي بيعيشها الشباب من جراء الفسق والفجور الموجود (على الاقل) في القضائيات وان جواز الشباب على ما يبدو انتهى وهذه ابيات شعرية لتأبين زواج الشباب<br />وزارات ورا وزارت هتعيش على حلمنا<br />و اللي بيجى يادوب مظبوط على قدنا<br />جايز هيجي اليوم والشبكة تيجى إنما<br />تفضل فلوس الشقة ودة شيء بعيد عننا<br />جايز هيجي اليوم والشقة تيجى إنما<br />هتكون سنانك وقعت قربت على 100 سنه<br />وقبل ما نطبق حد الحرابة لازم يا زنوبه تكون الدولة اسلامية كلها بتطبق شرع الله في كل شيء في كل منحى من مناحي الحياه وبعدين حد الحرابة دا آخر حاجه (وما تفتيش من غير علم تاني يا زنوبه)"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

[[comments]]
