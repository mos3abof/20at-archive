subject = "يا رب اصلح شباب المسلمين"
author = "أحمد رحال"
posted = "2006-11-06"
text = "انا شايف إن مهما كانت البنت مش محتشمة ده مش مبرر لأي شاب وضيع إنه يتحرش بيها , يعني لو واحد ماشي بيتكلم في موبايل غالي مثلا ده مبرر إن لو واحد فقير شافه يسرقه ؟؟ أكيد لأ .. و المفروض البنت برضه تكون محتشمة عشان هي نازلة و عارفة إن في الشوارع شباب كتيييييير مش محترمين و أكيد هيحاولو يعاكسوهم ( على الأقل )<br />و ربنا يصلح شباب و بنات المسلمين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014011/http://masr.20at.com:80/article.php?sid=1121"

