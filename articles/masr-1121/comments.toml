subject = "حكم"
author = "طلبت من الله(غنى)لأكون (مسرورا) فأعطاني (فقرا) لأكون (حكيما)‏"
posted = "2006-11-06"
text = "طلبت من الله (قوة) لأعمل أعمالا (باهرة)‏فأعطاني(ضعفا)لأتعلم (الطاعة)‏<br />طلبت من الله (صحة) لأحقق أشياء (عظيمة)فسمح لي (بمرض) يبعدني عن (التكبر)‏<br />طلبت من الله (كل شيء) لأستمتع بالحياة فأعطاني (الله) لأستمع بكل شيء"
