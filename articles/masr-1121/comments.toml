text = "عجبي جدا تعليق الاخت زنوبة.. طبعا الاحتياط واجب ولما البنت تسكت اكيد الحيوانات دي هتفهمهاغلط .. ومافيش مانع البنت تكون محترمة في مظهرها وملبسها وفي نفس الوقت تكون قوية وما تسكتش .. فيه بخاخ يسمى Pepper Spray مش عارف اذا كان موجود في مصر والا لا اذا كان مش موجود ففكرة مية النار المخففه اللي قالت عليها الاخت زنوبة فكرة رائعة .. تحياتي وتمنياتي بالسلامة والعافية لكل بنت من بناتنا وامرأة من نسائنا"
