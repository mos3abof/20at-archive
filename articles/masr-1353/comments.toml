subject = "من زكى الدبور الى حمدى شرف المهنة"
author = "hamdy.rizk36@yahoo.com"
posted = "2006-12-26"
text = "من محجوب عبد الدايم فى عصر مكرم الى محفوظ عجب فى عهد سى عبدة يظل السؤال حائر و يحتاج لاجابة؟؟؟؟؟؟؟؟؟<br />لية المصور كامجلة فاشلة توزيعيا و صحفيا و مهنيا رغم ان فيها حمدى شرف المهنة؟؟؟؟<br />وبقى الشلة؟؟؟؟؟؟؟؟؟؟<br />ياريت حمدى يرد او على الاقل يقول رقم توزيع مجلتة؟؟؟؟؟<br />ولية مفيش كلمة فيها عن الفسد فى قطاع وحتى حمدى لا يكتب عن الفساد فى قطاع البترول البترول ؟؟؟؟؟؟<br />عايزين حمدى شرف المهنة يرد؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
