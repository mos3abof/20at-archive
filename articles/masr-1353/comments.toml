[[comments]]
order = 5
subject = "دكتور سيتى - قرينك يازوواوى"
author = "ايمن امام"
posted = "2006-12-26"
text = "ياحمدوف- دكتور سيتى هو قرينك يازوواوى مع اعتذارى للزواوى لانه كان مصريا رغم ما على شخصه من ملاحظات -ثلاث رسائل على الموبايل افردت لها مقاله وجعلتها رساله تهديد للرئيس- بصراحه تامه ارى انك هذه الايام تهدد الرئيس مباشره ولاتستحى - انت تحاول ان تضغط على الرئيس - بالتهديد والوعيد ان لم يستجب لقرينك - الذى اصبح يطاردك ليس فى الفراش ولكن ايضا فى الموبايل- هل لو ارسلت لك رساله على الموبايل تقول لك - ان الاسلام يعطى الاقباط كامل الحقوق والواجبات - هل ستنشرها - طبعا لا - ولكنك - من مدرسه هاتلى خبر يقول ان مواطن عض كلب ولاتتحفنى بخبر ان كلب عض مواطن -ياحمدوف كراهيتك للدين الاسلامى ليس لها حدود - والكوابيس التى تطاردك ليس لها اساس سوى عقلك الباطن فلا المهدئات التى تتناولها ولاالمشروبات ستجعلك تناه نوما هادئا لانك تحارب - الاسلام - - كثيرا ماهاجمت شعار الاسلام هو الحل - وانا اطرح عليك شعارا جديدا ( الحل هو الاسلام) مارأيك فى هذا الشعار الجديد اعتقد ان المعنى قد تغير كثيرا - الحل هو فى وتنفيذ شعار اخر قد يرضى هواك ويرضى من انت تابع لهم - الحل فى تطبيق شرائع الله عز وجل الثلاث وكلها تجمع على ان من يتعرض للمولى عز وجل ودياناته فهو مشكوك فى ايمانه - او قل لنا انت ماذا تقترح للخروج بالوطن من عثرته - اقصد بالوطن مصر وليس منزلك لان الطكثيرون منكم هذه الايام اختزلو الوطن فى منزلهم فقط بمعنى اذا كانت ثلاجته عامره باصناف الطعام وحسابه فى البنك فى تزايد مستمر فالوطن بخير -ارجوك ياحمدوف بدلا من المنشورات التى تكتبها كل صباح - نريد ان نرى لك مقالا به فكر يناقش ويفيد / ايمن امام"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224324/http://masr.20at.com:80/article.php?sid=1353"

