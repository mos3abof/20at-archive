order = 0
subject = "وضحت نيتك"
author = "واحد بيحب مصر"
posted = "2006-12-25"
text = "بالله عليكم مقال \"خذها ولا تخف\" ثم ذلك المقال أعتقد أن النية وضحت ولا شك بل تم إعلانها في وضح النهار<br />حمدي رزق يارجاله لم تعجبه المادة الثانية من الدستور لم يعجبه أن مبادئ الشريعة الإسلامية هي المصدر الرئيسي للتشريع في ذلك البلد الذي غالبية سكانه مسلمين<br />هذا المقال نشر اليوم 25/12/2006 في المصري اليوم وهذا يشككنا بعض الشئ في نوايا \"ولاد البلد\" لأنكم نشرتم مقالة حمدي رزق في نفس يوم نشرها في المصري اليوم<br />هل تنتظرون مقالاته بفارغ الصبر لكي تنقطونا بها<br />أعتقد أن هناك مقالات تنشر في مواقع أخرى متعددة ومنها على سبيل المثال جريدة المصريون الالكترونية وكذلك موقع \"كفايه\" ومواقع أخرى كثيرة يمكن أن تلقوا الضوء عليها ويكون هناك الرأي والرأي الآخر<br />صدقوني بكده ستفقدون مصداقيتكم ياولاد البلد..."
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224324/http://masr.20at.com:80/article.php?sid=1353"

[[comments]]
order = 1
subject = "ومن يكون سيتى شنودة المزعوم"
author = "سيتى اية وقرف اية - عندة قلق يروح ياخد حبة فاليوم ولا حبة مهدىء ويرتاح"
posted = "2006-12-25"
text = "لية افتعال مشاكل لن تقع وتخويف الناس من المسلمين الارهابيين وكان النصارى ياعينى حمائم سلام مش تعابين جوة عش حمام<br />اقلية قذرة تريد ان تبتز اغلبية مطلقة امر مرفوض جملة وتفصيلا<br />انا لا ادافع عن الاخوان ولكن ارفض ان يغمز الدين الاسلامى من جانب ويتهم بان اصحابة ارهابيون ويعلقون مشانق للاخرين<br />فى فرنسا 5 ملايين مسلم وفى بريطانيا نفس العدد وعندنا خمسة ملايين نصارى مثلهم<br />ولم نرى ان تلك الاقليات المسلمة تتدلع على حكوماتها مثل هؤلاء وتطلب تعيين وزراء ومحافظين<br />اللى مش عاجبة البلد وسياسة البلد --- الباب يفوت جمل - يروحوا عند قرايبهم هناك فى امربكا وكندا<br />بلاش قرف"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224324/http://masr.20at.com:80/article.php?sid=1353"

