subject = "مصـ( الخير )ـعب.....يرحم زمن الرجالة !!!"
text = "يا جماعة انتوا ليه متحاملين<br />عليهم كده؟!<br />كفاية الانجازات اللي حققوها لشعوبهم!!!!!!!<br />إنجازات ايه؟!<br />لا في إنجازات كتير:<br />1. عند تطبيق مبدأ \" الأرض مقابل السلام \"<br />اكتفينا نحن بالسلام \" الجزر الاستراتيجي\"<br />و أعطيناهم الأرض , وأصبحنا نحن الموزعين<br />المعتمدين الوحيدين في العالم للسلام!!!<br />( بيتباع في زجاجات سلام دلوقتي و كل زجاجتين<br />عليهم صابونة هدية علشان نضمن ان اليهود<br />\" صابونة \" في حالنا!!!!!!!!!!!!!!!!!!!)<br />2. التغيير الرهيب في لاءات الأمس الثلاث<br />و الذي جاء نتيجة المجهودات الجبارة التي بذلوها<br />فلاءات الأمس هي: \" لا استسلام , لا تراجع , لا سلام \"<br />أما لاءات اليوم: \" لا مانع , لا اعتراض , لابد منه \"<br />و يرحم زمن الرجالة!!!!!<br />ترقبوا البيان التأسيسي للحلف الالكتروني الفظيع!!!<br />مهندس العمليات المستحيلة!!!"
archived = "2004-09-03"
