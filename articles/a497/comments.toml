subject = "فلسطين : جريحة هؤلاء المجرمين"
author = "من اين ابدا و ماذا ساقول : سالخص كلامي ببيت من الشعر :"
text = "لو ان ما في الدنيا انتكاسا** لما عشقت مسيلمة سجاح .<br />هؤلاء الازلام يعتقدون ان الله ليس موجودا . ولكن الله سبحانه لهم بالمرصاد . نحن الذين تعذبوا على ايديهم<br />نقول لهم , ان الملتقى هناك عند الحكم العدل العزيز الحكيم, سنقتص منكم وممن سار معكم من ايها المجرمين , لن ولن نسامحكم ابدا , نحن ندعوا عليكم بالليل والنهار , حسبنا الله ونعم الوكيل ,<br />اخوكم : كتائب شهداء الاقصى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145657/http://www.20at.com/article.php?sid=497"
