[[comments]]
order = 3
subject = "زمن محمد دحلان **"
text = "فلسطين - الحقائق<br />9/3/2003<br />رسالة من العقيد محمد دحلان (وزير الأمن لدى السلطة الفلسطينية)<br />إلى شاؤول موفاز (وزير الحرب الصهيوني)<br />حضرة وزير الدفاع الإسرائيلي شاؤول موفاز المحترم<br />تحية طيبة وبعد:<br />بداية يجب أن تعلموا أننا نعمل ضمن تبعات وليس تنفيذاً لأوامر أحد ونحن نؤمن تماما أن مصلحة شعبنا تقتضي القضاء على عصابات \"المافيا\" هذه التي تنشر الفوضى في صفوف شعبنا وتثير النزاع والأحقاد بيننا وبينكم من اجل أهدافهم الشخصية أو أهداف عبثية، ولهذا تأكدوا تماما أننا لن نسمح لهؤلاء المتطفلين علينا وعلى شعبنا بالبقاء في صفوف شعبنا، بل إننا سنستأصلهم ونستأصل آثارهم وأفكارهم حتى لا يبقى في صفوف شعبنا إلا من يقبل التعايش معكم، وتأكدوا أيضا أن السيد ياسر عرفات أصبح يَعُد أيامه الأخيرة ولكن دعونا نُذيبه على طريقتنا وليس على طريقتكم، وتأكدوا أيضا أن ما قطعْتُهُ على نفسي أمام الرئيس بوش من وعود فإنني مستعد لأدفع حياتي ثمنا لها.<br />السيد وزير الدفاع الإسرائيلي شاؤول موفاز:-<br />إننا نعلم أنكم دولة حضارية وديمقراطية مثلما أمريكا دولة حضارية وديمقراطية، ونعرف أنكم لا تستطيعون أن تتعاملوا مع عصابات \"مافيا\" وهذا من حقكم تماماً، ولكن تأكدوا أن هذه المرحلة انتهت بلا رجعة وابتدأ عصر القانون والمحاسبة والسلطة الواحدة ولكن كل هذا يتطلب منا ومنكم التعاون الكامل من اجل تحقيق هذه الأهداف التي تصب في مصلحة شعبنا وشعبكم، ولهذا أناشدكم أن تكونوا أكثر مرونة في تعاملكم معنا وذلك من أجل مصلحة الهدف الذي نعمل من اجله وهو السلام، ويجب أن لا تضطرنا باتخاذ خطوات غير محسوبة قد تكلفنا فشل مخططنا أو إعاقته.<br />فالخوف الآن أن يُقدِم ياسر عرفات على جمع المجلس التشريعي ليسحب الثقة من الحكومة وحتى لا يُقدِم على هذه الخطوة بكل الأحوال لا بد من التنسيق بين الجميع لتعريضه لكل أنواع الضغوط حتى لا يقدم على مثل هذه الخطوة.<br />ونحن قد بدأنا بمحاولة استقطاب الكثير من أعضاء المجلس التشريعي من خلال الترهيب والترغيب حتى يكونوا بجانبنا وليس بجانبه لكننا نخشى من المفاجئات.<br />أما بالنسبة لبقية المؤسسات التابعة لمنظمة التحرير مثل: المجلس الوطني والمركزي فهذه أسماء يجب أن تنتهي وأن تُفرَغ تماماً من مضمونها وأتمنى أن تمنعوها من الانعقاد داخل الضفة أو غزة مهما كلف الثمن وهذا يصب في مصلحتكم قبل مصلحتنا.<br />السيد وزير الدفاع الإسرائيلي شاؤول موفاز:-<br />في النهاية لا يسعني إلا أن أنقل إمتناني لكم ولرئيس الوزراء شارون على الثقة القائمة بيننا ولكم كل الاحترام.<br />غزة<br />13/7/2003<br />التوقيع : محمد دحلان<br />وزير شؤون الأمن المفوض لوزارة الداخلية<br />الرسالة موجودة أيضا في هذا الرابط لموقع المركز الفلسطيني للاعلام:<br />رسالة من العقيد محمد دحلان (وزير الأمن لدى السلطة الفلسطينية)<br />إلى شاؤول موفاز (وزير الحرب الصهيوني)<br />**(العنوان مأخوذ من عنوان لمقال في موقع ايلاف لكاتبه د. أحمد عرفات القاضي)<br />المرجو تفعيل الرابط."
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903083612/http://www.20at.com:80/article.php?sid=497"

[[comments]]
order = 4
subject = "خد دي كمان"
text = "شن الوزير الفلسطيني السابق لشؤون الأمن الداخلي، محمد دحلان، هجومًا لاذعًا على رئيس السلطة الفلسطينية، ياسر عرفات، في مقابلة صحفية نشرتها، اليوم (الأحد)، صحيفة \"الوطن\" الكويتية. وقال دحلان إن \"الرئيس عرفات يجلس الآن على جثث وخراب الفلسطينيين في وقت هم أحوج فيه إلى الدعم والمؤازرة وعقلية منهجية جديدة\".<br />وفي إشارة إلى عرفات، قال دحلان إن \"العقلية التي تدير الوضع الفلسطيني لم تعد ذات جدوى فالخسائر لا تحصى والحياة الفلسطينية مدمرة\".<br />وأضاف دحلان أن \"الوضع الفلسطيني لم يعد يحتمل الفساد ولا بد من تطبيق الإصلاحات التي أقرها ياسر عرفات\"، مؤكدا أنه إذا لم يتم تطبيق الإصلاحات قبل العاشر من آب/ أغسطس الجاري، فإن حركة احتجاجات كبيرة تضم 30 ألف فلسطيني ستسير في قطاع غزة دعمًا للإصلاحات\"."
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903083612/http://www.20at.com:80/article.php?sid=497"

