[[comments]]
order = 3
subject = ""
author = "انتم بتعملوا اية ؟"
posted = "2009-12-07"
text = "من سنين طويلة كانت شركة امريكية بتركب لنا مشروع فى مصر - وكنت اعمل مع امريكى فى صالة تركيبات معدات على النيل وحدث ان اللمبة المضيئة فى السقف احترقت فذهبت الى المخازن واحضرت لمبة نيون لتركيبها<br />وامسكها الامريكى وقرا عليها صناعة بولندا made in poland وكانت بولندا وقتها شيوعية فكرر فى غضب صناعة بولندية والتفت الى غاضبا - انتم بتصنعوا اية هنا<br />وسكت - احسست بالخجل لاننا نستورد لمبة نيون من بولندا<br />اة لو جاء هذا الامريكى الان - نحن يا سيدى لا نصنع شيئا ولقد سرحنا العمال فى معاش مبكر ليجلسوا على المقاهى ونستورد من الصين من الابرة للصاروخ<br />نحن لم نعمل شىء غير المعمار وسيراميكا رويال<br />نحن اخذنا الوطنية من صراخ ملعب كرة القدم<br />وطبعا اسرائيل مبسوطة جدا من هذا التوجة وفى قمة السعادة<br />بينما ايران تجرب اطلاق الصواريخ وصناعة المحركات واسرائيل تجرب صواريخ مضادة للصواريخ وتتطور صناعيا كل يوم<br />بينما قطاراتنا تحترق وتتصادم والعبارات تغرق بالناس ولا نعدم ان نجد جاموسة تلبس القضية وتشيل وزر الاهمال<br />فالجاموسة التى شالت وزر حادث القطار<br />مثلها تماما الكرة التى شالت وزر ومستقبل بلد يتهاوى"
archived = "2009-12-09"
capture_url = "https://web.archive.org/web/20091209010307/http://www.20at.com:80/masr/hot-topics/14287-2009-12-07-11-53-47.html"

[[comments]]
order = 4
subject = ""
author = "الوطنية والكووورة"
posted = "2009-12-07"
text = "الوطنية وحب مصر ان تنتج شيئا او تشارك فى بناء شىء يخدم بلدك واهلك وناسك<br />الوطنية ان تنتج قلم رصاص واستيكة وسجادة صلاة ومسبحة وتنتج قمحك وتعمل رغيفك وقميصك وفانلتك وجزمتك هنا فى مصر - الوطنية ان العربية اللى بتركبها والبندقية اللى بتحارب بها تبقى انت ساهمت فى انتاجها<br />الوطنية وحب مصر يعنى بناء مصانع ومزارع وفرص عمل وتصدير انتاج مصرى<br />هى دى الوطنية<br />انما لما تبقى واقف فى ملعب كرة قدم وشايل علم مصرى انتاج الصين وجزمتك انتاج الصين والفانلة او القميص والبنطلون انتاج الصين وعمال تصرخ وتقول مصر ومصر فلا مؤاخذة دى اسمة الخبل<br />كوورة اية وعلاقتها اية بالوطنية<br />فية اعلان عن التشجيع للكرة بيذاع من تليفزيون ابو ظبى الاعلان بيظهر شخصين لابسين لبس انسان الكهوف وكل واحد ماسك غصن شجرة وبيتفرجوا على مباراة وبعد المباراة نزلوا فى بعض ضرب وطحن - ثم صوت يقول ان التشجيع حضارة واظنهم يتمهزؤون على مصر والجزائر<br />لا تربطوا الكورة بحب مصر<br />حب مصر يعنى بناء مصر<br />الا اذا كنا عايزين نخللى حياتنا كلها لعب"
archived = "2009-12-09"
capture_url = "https://web.archive.org/web/20091209010307/http://www.20at.com:80/masr/hot-topics/14287-2009-12-07-11-53-47.html"

