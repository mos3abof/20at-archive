[[comments]]
order = 12
subject = ""
author = "مش فاهم اى حاجة"
posted = "2009-12-09"
text = "فى مصر عندنا وزارة ولها وزير اسمها وزارة الاوقاف - كل شغل وزارة الاوقاف هى كتابة خطبة الجمعة وتوزيعها على امام المسجد فى كل ربوع مصر وطبعا بعد مراجعة امن الدولة لمحتوى الخطبة واصبح عدد الائمة ما شاء اللة ربنا يزيد ويبارك وكلهم بيقرؤوا من ورقة مكتوبة وميزانية وبدلات وفلوس وهيصة<br />لماذا لا تعود المساجد اهلية وكل حى وكل شارع يصرف على الجامع او المسجد بتاعة<br />مش عارف<br />نرجع للوزارة اياها - المفروض يا سادة ان من ضمن واجبات وزارة الاوقاف هو الحج والمفروض ان جميع الحجاج تحت اشراف وزارة الاوقاف - انما يبقى الحج سياحة وتتولى مكاتب السياحة الترتيب والحجز وكاننا طالعين رحلة الى شواطىء قبرص او جزر الهاواى<br />اين وزارة الاوقاف من امور الحج<br />لماذا لا يكون لوزارة الاوقاف فنادق فى جدة والمدينة لخدمة الحجاج المصريين<br />لماذا تترك لشركات السياحة تنظيم رحلات الحج<br />الوزارة لها خطباء واناس تعرف الشعائر ومن المفروض ان الحج تحت ادارتهم<br />انا مش فاهم<br />الحج تبع الاوقاف والا تبع شركات السياحة"
archived = "2009-12-12"
capture_url = "https://web.archive.org/web/20091212231341/http://www.20at.com:80/masr/105-msa7t-r2y/14287-2009-12-07-11-53-47.html"

[[comments]]
order = 13
subject = ""
author = "كلام فى حب مصر"
posted = "2009-12-09"
text = "اشتريت رابطة خبز ( عيش بلدى ) من عند البقال ورجعت الى البيت وفتحت جريدة اقراها من الجرائد المصرية - فيها كلام عن شباب فى عمر الورد ينتحرون بسبب البطالة والفقر والعوز وعدم قدرتهم على مصاريف المعيشة - ليس هذا موضوعنا - ولكن طريقة الانتحار هى التى لفتت انتباهى - الشباب ينتحر بمص قرص يباع فى الصيدليات بسعر رخيص وهذا القرص يستخدم فى قتل السوس فى حبوب القمح - بمعنى ان اصحاب الحبوب من القمح والذرة يضعون مسحوق هذا القرص فى وسط الحبوب فيمنع تسوسها ولا تتلف<br />الى هنا والكلام رائع<br />ولكن من يغسل حبوب القمح واين قبل طحنها للتخلص من تلك السموم<br />هل هناك مغاسل لحبوب القمح قبل الطحن عند الحكومة والمستوردين والا كلة بطين البرك<br />علشان كدة الفشل الكلوى منتشر وسرطانات الكبد والسرطانات فى الدم وبين الناس<br />هل عندنا نظام ادارى صارم يراعى مصالح الناس ويحافظ على صحتهم<br />والا كلة باللحاليح وابراز الوينجز لتنجز وصبح على الدرج يا استاذ<br />يا نهار اسود<br />ونظرت الى رابطة العيش وقلت فى بالى<br />كلنا بنحب مصر"
archived = "2009-12-12"
capture_url = "https://web.archive.org/web/20091212231341/http://www.20at.com:80/masr/105-msa7t-r2y/14287-2009-12-07-11-53-47.html"

