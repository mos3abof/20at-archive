[[comments]]
order = 16
subject = ""
author = "الحكومة صادرت البيوت"
posted = "2009-12-12"
text = "فية حاجة جديدة اسمها الضريبة العقارية<br />يعنى هتدفع بمقدار ايجار للبيت ملكك اللى انت وارثة من ابوك او جدك<br />يعنى هندفع ايجار للبيت للحكومة<br />وكان الحكومة بقت هى مالكة البيت وهندفع ايجار على شكل ضرايب<br />وطبعا اللى يفكر يبنى بيت فى البلد دى هيخسر ويمكن يتحبس لو مافيش فلوس يدفعها ضرايب<br />الناس هتبطل تبنى بيوت وهتفكر تسكن فى العشوائيات او المقابر<br />جدى هيدفع ضريبة عقارية على بيتة من المعاش اللى هو بياخدة علشان الحكومة تنبسط<br />لان جدى ليس لة دخل غير معاشة واشترى الفيلا بتاعتة دى فى الستينات ب 8 الاف جنية بالتقسيط"
archived = "2009-12-12"
capture_url = "https://web.archive.org/web/20091212231341/http://www.20at.com:80/masr/105-msa7t-r2y/14287-2009-12-07-11-53-47.html"

[[comments]]
order = 17
subject = ""
author = "مرتب الموظف المصرى"
posted = "2009-12-13"
text = "فى جلسة ودية بين سيادة الرئيس حسنى مبارك والرئيس اوباما<br />سال الرئيس مبارك - فخامة الرئيس اوباما كم يبلغ راتب الموظف الامريكى ؟<br />اوباما0 ( حوالى 5000 دولار فى الشهر )<br />مبارك - وكم يصرف شهريا ؟<br />اوباما — 2800 دولار شهريا<br />مبارك - بيوفر يعنى 2200 دولار شهريا بيعمل بهم اية ؟<br />اوباما- لاننا بلد ديمقراطى لا نسالة فى حاجة خاصة بة - ثم التفت الى الرئيس حسنى<br />وسال - فخامة الرئيس حسنى - كم يبلغ مرتب الموظف المصرى ؟<br />فرد مبارك - حوالى 200 دولار<br />وهنا سال اوباما - وكم ينفق الموظف المصرى فى الشهر ؟<br />رد مبارك - حوالى 1000 دولار<br />فسال اوباما - ومن اين ياتى بالفرق<br />فقال مبارك<br />لاننا بلد ديمقراطى لا نسال الموظف من اين ياتى بباقى المبلغ انها اشياء شخصية"
archived = "2009-12-15"
capture_url = "https://web.archive.org/web/20091215125125/http://www.20at.com:80/masr/interviews/14287-2009-12-07-11-53-47.html"

