posted = "2009-12-17"
text = "وراق الحضر ووراق العرب فيها حتة كنيسة ضخمة جدا وعدد النصارى فى المنطقة لا يتعدى 400 شخص بما فيهم الاطفال - ويظهر ان البرد اليومين دول شديد قوى وصل احنا فى شهر كيهك اول شهور الشتاء والجماعة صايمين وبياكلوا الزيت المغشوش بتاع التموين وبخار الزيت بيطلع بخار فى اعلى المخ تطلع تهيؤات غريبة تخليهم يشوفوا حاجات غريبة<br />وانا اقترح فتح فرع لمستشفى العباسية جنب الكنيسة فى وراق العرب حيث ان البامية عملت غمامة فى رؤوس الاخوة - وظهور شبح العذراء هيريحهم نفسيا"
archived = "2010-01-14"
