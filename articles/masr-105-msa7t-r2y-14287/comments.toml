[[comments]]
order = 6
subject = ""
author = "Chemist / M. Eissa"
posted = "2009-12-08"
text = "[quote name=\"Chemist / M. Eissa\"]اولا: الله ينور عليك تسلم ايديك اللى كتبت و دماغك اللى فكرت… المقالة من الاخر وانت لميت فيها نقط كتيرة جدا وباسلوب وشكل جميل جدا يقارب المحترفين فى الكتابة.<br />ثانيا: شكرا اوييييييي لاصحاب التعليقات (انت بتعملوا اية؟) و (الوطنية و الكووورة) لان كلامهم وطريقة تفكيرهم بتصب فى صلب لاموضوع بشكل شدييييد. واخيييييييي على صاحب التعليق(المعلق رقم 2) لان كلامه الصراحة مش كويس ابدا ويجيب لورا.<br />ثالثا: انا عن نفسى برفع شعار فى حب مصر ولكن بطريقتى وتفكيرى انا… عايزين مصرنا العزيزة العظيمة صاحبة 70000000000000 الف مليون سنة حضارة يبقى فيها جامعة واحدة توحد ربنا ضمن احسن 500 جامعة على مستوى العالم"
archived = "2009-12-09"
capture_url = "https://web.archive.org/web/20091209010307/http://www.20at.com:80/masr/hot-topics/14287-2009-12-07-11-53-47.html"

