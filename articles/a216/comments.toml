[[comments]]
order = 1
subject = "رؤية.."
text = "عندما يهون شأن صاحب الهيبة والسلطان ويأفل نجمه، يهون على الصعاليك واللقطاء أن يدعوا عليه ما يحلو لهم، وأن يتهيأ لبعضهم أنهم قد أقرضوه أموالاً لم يردها عليهم، ويتهيأ للبعض الآخر أنهم قد أتوا زوجه على حين غفلة منه في ليلة من اليالي، حتى يصنع كل واحد منهم من نفسه بطلاً ومن سيرته أسطورة، فإذا طلع النهار، وسطعت الشمس في أعينهم فأغشتها، وضربت حرارة النهار جلودهم فأحرقتها، عاد كل شيء إلى ما كان عليه، وعلموا أن الله هو الحق المبين..<br />...أحمد القطب..."
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616064247/http://www.20at.com:80/article.php?sid=216"

