subject = "اقتراح عجيب تخيلو الشيعة في قوطي فول مدمس"
text = "أرسل هذا التعليق بواسطة : مهجد الشيعة<br />والله اقتراح عجيب ورهيب الله الله لو انها تتحقق الصراحة نرتاح ونريح الدماغ من شركم لا تقولي ولا اقولك اما لو يخصصو لكم قوطي فول على قدكم تتكلموا فيه زي منتم باغين اما انا لو اتكلم من هنا الي يوم القيامة مو نافع فيكم ايش اسوي بس حبيت اقترح هذا الاقتراح وانشالله الجهات الخاصة تنظر في الموضوع بشكل جدي وانشالله تتحقق"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

