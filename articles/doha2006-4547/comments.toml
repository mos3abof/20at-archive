text = "أرسل هذا التعليق بواسطة : اكتب اسمك هنا<br />أرسل هذا التعليق بواسطة : عـــمـــر<br />إيري بطيز أمك القحبة يا ابن الشرموطة الكبيرة الي نمت معها .. وأنا نمت مع كل الشيعات الشرموطات .. كس أمكم منايك قحاب ولاد قحبات أولاد متعة يلعن شرف الشريف فيكم يا منتاكين .. أولهم حسن نصرالله أخو الشرموطة الي نمت مع أمه ومقتدى الصدر المخصي إبن الداعرة المنتاكة .. كس أمكم أمياتكم قحبات شرموطات .. الله ينيكني ام كل واحد شيعي .. أمين<br />أبلغ عن هذا التعليق<br />يالشيعي يالجرار ..<br />أرسل هذا التعليق بواسطة : نياك الشيعه<br />ياشيعه يامخانيث ياكلاب ياجرارين ,, والله والله اني مافيكم ذره شرف ,, امس كنت نايم مع وحدة شيعية ,, ايوه انتم هذي شغلتكم تتوالدو عشان احنا ننيكم .. هههههههههههههههههههههههه<br />أبلغ عن هذا التعليق<br />هاتك عرض الشيعه<br />أرسل هذا التعليق بواسطة : زغيب الخومينيات<br />ختفوووووووووو عليكم يا شيعه ياعبادين القبور يا اولاد المتعه فعلاً انا مع تعليق الاخ الي يقول انتو تتوالدون عشان ننيكم<br />العن ابووووووكم يا روافض يا انجس خلق الله يا انجس من الخنازير يا اغبياء يا سفله يا واطيييين خررررررره على كل شيعي عابد قبور وانت يا مسيحي يا غبي ياغبي يااااااااغبي ترا انت مافي فرق بينك وبين الشيعه<br />الشيعه يعبدون قبور وانت تعبد انسان مثلك مثله يا زطي يا عرص العن ابو الي نفضكم يا قحااااااب<br />بااااااي زغيب الخومينييات<br />أبلغ عن هذا التعليق<br />شيعه؟؟<br />أرسل هذا التعليق بواسطة : عباس جوغوي<br />يا اخوان مايصح هالكلام عيب ومايصير تسبون وتغلطون بس مدام شيعه حيلكم فيهم عبادين القبور عبادين التربه بلاعين العيور اولاد المتعه والزنا اولاد الحرام الشيعه اصلاً السيد تبعهم لازم يتمتع بالمرأه قبل مايدخل عليها الديوث زوجها والاخ لازم يتمتع بأخته الديوث الثاني<br />فعلاً انتم اولاد متعه واولاد زنا وأولاد حرام<br />والدين بريئ منكم وشوفو الي بالصوره والله مايفرق عن الخنزير شي<br />سبحان الله خنازيير بشريه<br />أبلغ عن هذا التعليق<br />خره فيكم يانواصب ياكلاب<br />أرسل هذا التعليق بواسطة : مقتدى كاسر خشوم النواصب<br />كس امكم واحد واحد يانواصب ياخوات القحبه ادخل زبي في مكوتكم يامخانيث ياعيال القحاب اولاد المسفار يا انجاس تفووو عليكم وعلى اشكالكم الوصخه<br />أبلغ عن هذا التعليق<br />الرد على الشيعه<br />أرسل هذا التعليق بواسطة : سنى نايك 50 شيعيه<br />العن ابو ابو الشيعه الكلاب عبدة الزب كس ام كل شيعى فى الوجود<br />أبلغ عن هذا التعليق<br />مصاص الزببه مقتدى القذر<br />أرسل هذا التعليق بواسطة : سنى غصب على كس ام الشيعه<br />بعيكم معلومه عن مقتدى القذر هذا النذل نايك اخته هذى معلومه حقيقيه ما تشوفونهم يقودون على اخواتهم<br />أبلغ عن هذا التعليق<br />كس امكم كلكم يا السنة<br />أرسل هذا التعليق بواسطة : شيعي لين الموت ومحد بغيرني<br />اصلا كل السنة يدعون حب الرسول عليه وعلى اله الصلاة والسلام لانهم كلهم سفلة واحد واحد والله العظيم حرام عليكم الي مسويين حرب عليهم ال الرسول يا جهلة اصحو للدنيا اصحو الرسول لن يشفع لكم يوم القيامة الله ياخذكم يا سفلة يا خونة<br />أبلغ عن هذا التعليق<br />شيعيون<br />أرسل هذا التعليق بواسطة : لبيك يا حسين<br />الحق باين باين والالفاظ القذرة هذي مابتنفعكم في النهاية الحمد لله اني انولدت شيعي وساموت شيعي موالي لاهل البيت عليهم افضل الصلاة والسلام ومن شيعة الحسين ومن محبي ال محمد صلى الله عليه وعلى اله وسلم وعجل فرجهم يا الله وجعلني من انصارهم الى يوم الدين<br />أبلغ عن هذا التعليق<br />خنازير صج خنازير<br />أرسل هذا التعليق بواسطة : اهداء الى كل خنزير -س-ن-ي<br />ههههههههههههههههههههههههههههاااااي<br />أبلغ عن هذا التعليق<br />كسس ننه<br />أرسل هذا التعليق بواسطة : نياك الشيعيات<br />خهخهخهخهخهخه يا كلاب يا روافض العن ابوكم يا متخلفين انتو ناس انخلقتو للمتعه فقط<br />يعني الواحد يروح السيده زينب الي بدمشق ينيييك الشيعييات يروح البحرين هم ينييك شيعييات<br />يروح ايران ولبنان والكويت هم ينييك شيعييات العن ابوكم وين مانروح ننيييك فيكم<br />انتو المفروض مالكم اي كلمه ولا اي صوت لأنكم اولاد زنا واولاد متعه واوالاد حرام<br />وعلى فكره كل ماشوكتكم تطلع بنكسرها لكم<br />خهخهخهخهخهخه عيري بأم الخميني اساس الفجر والكفر<br />وعيري بامه واخته وبعرضه وشرفه<br />عيري بشرف كل شيعيه شرمووطه وشريفه<br />ويعني ما اعتقد في شريفه يا عابدين الزب والطييييز العن ابوكم لابو من جمعكم انتو وهذا الخرتيت البقره فرس النهر لو يجي يشيل عيري ويتمرن فيه مو احسن؟؟؟!<br />أبلغ عن هذا التعليق<br />n70<br />أرسل هذا التعليق بواسطة : n70<br />يا كلاب انا لماتركت هالصفحة انتوا فلتوا ما هيك بسيطة بس يكون باعلم والحاظر يخبر الغايب انوا (سيدنا عمر ابن الخطاب كان ينتاك)<br />ملاحظة الي كاتب هالقال هو(جعفري )علوووووو من سورية @ الاسد<br />أبلغ عن هذا التعليق<br />على عيري كل سني<br />أرسل هذا التعليق بواسطة : نايك 51 سنيه هع هع<br />انتوماليكم حق تتكلمو لان انتوو منايك تتنيكووعلى خواتكم واناا نكت 51 سنية وكلهم وصخين يعني انتو مو طاهرين وبانتكم حق نيك ورجالكم يصيروو شيخ وعمايمكم على بهايمكم هعهعهعهع وانا شيعي وغصبن عن كل شيخ سني جرار وجرار خواته للنيك وعلى فكرة ((قحابكم وصخين ويحبوو المص ) سيدنكم عنر قاليكم لماا ينكم واحد مصوو له زبوو كتيرر يا منايك هعهعهعهع<br />أبلغ عن هذا التعليق<br />يا شيعة يا أولاد الشرموطة<br />أرسل هذا التعليق بواسطة : نايك أم مقتدى الصدر والشيعة كلهم<br />يعني لازم نظل نكسكس لخواتكم الشرموطات كس أم مقتدى الصدر والسيستاني وكل الشيعة المنايك أولاد الشرموطة المنتاكة .. الله خلقكوا عشان تنتاكوا يا منايك كس أمكم شراميط .. خوات الشيعة شرموطات .. ومقتدى الصدر وحسن نصر اللات أكبر ولاد شرموطة .. أنا نكتها لأمه هذا نصر اللات القرن إبن القوادة<br />أبلغ عن هذا التعليق<br />كفى كذب<br />أرسل هذا التعليق بواسطة : ربي الله ولااشرك معه احدا<br />السنه فئة ضالة ومضلة وكذابين ومحتالين بإسم الدين والشرع يحاربون الشيعه بأسم المتعه ومذهبهم الأعور يشهد لهم بزواج المسيار !!! تناقض.. يحاربون الشيعه على المراقد وتجد أهل السنة وبالذات أهل السفلية السعودية يعبدون حكام هذه الأمة المعوجه !!! تناقض.. يحاربوننا كشيعة في لبنان اولآ لأننا اثبتنا لهم ان ولاة امرهم اشباه الرجال يحاربون مذهبنا الذي حطم اسطورة الجيش الذي لا يقهر<br />قبل ان تشتم الشيعي وتكفرهم فكر في نفسك وكفر ذاتك المتغطرسة على الدين ياجاهل انا لا اكفركم ولكن اقول لكم كفاكم ضحك على الدين مذهبنا ليس دينآ أخر ومذهبكم ليس دينآ اخر كيف تكفروننا ونحن نشهد ان لا اله الا الله وان محمد رسول الله ؟<br />تكفروننا لأننا مذهب يأبى ان يعيش الا تحت ظلال السيوف ؟ يامن تحبون العيش تحت ظلال السقوف اين جهادكم وتاريخكم شتم وتكفير ؟<br />أبلغ عن هذا التعليق<br />الشيعة على زبي<br />أرسل هذا التعليق بواسطة : نايك أمك يا شيعي يام منتاك<br />كس أم الشيعة كس أم الخميني و إيران كس أم مقتدى الصدر كس أم حزب اللات كس أم السيستاني والمالكي .. كس أم الشيعة أبناء المنتاكة .. كس أم الضاحية الجنوبية .. عاش الشيخ سعد الحريري و فؤاد السنيورة والملك عبد الله نايكين أم الشيعة المنتاكين .. كس أمكم يا عبدة القبور كس أمكم يا مجوس .. وسيبقى كل السنة غصة في حلقكم يا أنجاس يا أنذال كس أم الشيعة في كل مكان بكربلاء والنجف وكل بقعة على الأرض فيها شيعة ..<br />أبلغ عن هذا التعليق<br />ماذا نقول لإولاد الحرام<br />أرسل هذا التعليق بواسطة : مدمر الرافضة<br />ان السيستاني تمتتع بأخت مقتدة ومقتدةتمتع بأخت----ولذلك كل الشيعة واولاد حرام وهم خطر على الدين الاسلامي اكثر من الفرس و اليهود ويجب إزلتهم كما يزال الورم من الجسم وتحية لصدام نايك مقتدة وشيعته<br />أبلغ عن هذا التعليق<br />كلمة حق<br />أرسل هذا التعليق بواسطة : صدام حسين<br />يأخ عربي لقد قلت الحق انا صدام و الشيعة اعدموني لااني لا انيك الإ النساء الشيعيات وهم يريدوا ان انيك الرجال الشيعة قلت لهم هذا حرام هذا لواط ولذلك اعدموني ماذا اقول لشعب شيعي حياته كلها نياكة في نياكة ومتعة وهناك مص المتعة عندهم يجوز ان يمص الرجل الشيعي للفرس فتوة من اية كسكساني لطيزاني زورو موقع طيزاني في قم<br />أبلغ عن هذا التعليق<br />مجلس الافتاء الشيعي<br />أرسل هذا التعليق بواسطة : علي حسن حسين عباس ابو الفضل<br />احدث فتوة شيعية بسبب الدواعي الامنية وحضر التجول يجوز ان يحدث زواج متعة ما بين الاخ واخته والاب وابنتة ولابن وامه بشرط القبول وبدون اذن الولي وبشرط حضر التجوال وينتهي الزواج مع رفع منع التجول المجلس الاعلى للافتاء في 25 رجب<br />أبلغ عن هذا التعليق<br />شيعة يا أبناء الحرام<br />أرسل هذا التعليق بواسطة : نايك أم مقتدى القذر<br />هذا دليل واضح على إنه الشيعة أبناء حرام كس أمهم يلعن شرفهم أبناء زنا ومتعة يلعن طيز أم الشريف فيهم هالكلاب الخونةعبدة الأصنام والقبور كس أم إيران الي طلعتهم<br />أبلغ عن هذا التعليق<br />مساء الخير<br />أرسل هذا التعليق بواسطة : السلطان<br />الله يسامحكم على هذه الالفاظ لسا سنة وشيعة روحوا شوفوا الامريكان واليهود شو عم يعملوا فيكن وباعراضكم هذا احسن ما تتحدوا ضدهم عما تسبوا بعضكم ولا هذا اللي شاطرين فيه عاملين حالكم اسلام والله الاسلام بريئ منكم الله ينتقم من كل واحد بيعمل فتنة<br />أبلغ عن هذا التعليق<br />الحقيقة<br />أرسل هذا التعليق بواسطة : باحث عن الحقيقة<br />يا مسلمين ان قاتل الامام علي بن ابي طالب عليه وعلى ال بيته السلام هو ابن علقم وهو فارسي من ايران بسيف اشتراه بالف درهم ووضع عليه سم بالف درهم انظروا للحقد الفارسي على العرب<br />أبلغ عن هذا التعليق<br />لاحول ولا قوة الا بالله<br />أرسل هذا التعليق بواسطة : لا سني ولا شيعي مسلم<br />اتقو الله يا مسلمين المشكله السنه مسلمين والشيعه مسلمين<br />بدال السب والغلط على بعض اتقو الله ويا اخوان كل انسان ومذهبه لهم دينهم ولنا دين اتقو الله الناس رمضان وصيام وانتو هنا تسبون وتغلطون وتكفرون اتقووووووو الله يا مسلمين الله يهديكم<br />مع السلامه واستغفر الله لي ولكم<br />أبلغ عن هذا التعليق<br />قم<br />أرسل هذا التعليق بواسطة : حيدرة<br />الحقيقة تقال مارايت أوسخ من الشيعة وخاصة المعممين ... أكثرهم يفعلوا الفاحشة مع الصبيان ذكور مع أن المتعة حلال<br />آني ما ألوم السنة أبداً صحيح أن بعضهم وسخ ولمن لا يقول أن هذه الوساخة دين وشرع شرعة علي عليه السلام<br />أتقوا الله يا شيعة خافوا الله ....<br />أبلغ عن هذا التعليق<br />العراق<br />أرسل هذا التعليق بواسطة : شيعي محب آل البيت<br />قم كلامك صحيح من ناحية المعممين آني شفت أكثر من معمم مع صبي ... ومرة تتبعت واحد من هؤلاء ترصدت به بعد المحاضرة وكانت خووش موعضة بكى كثير منا ... ثم وقفت أتابعه بسيارتي ( بيني وبينكم آني مخابرات شيعي ) وكان الوقت ليل وقفت سيارتة على جانب طريق فرعي .. أوقفت سيارتي جانباً بيث لا يراني ..أسرعت ومعي عصى غلظة وكنت ملثم لأن الحكومه تساعد المعممين وتصدقهم .. المهم شاهدته يخلع سروال الولد ويحاول إدخال ذكرة .. كسرت الزجاجة وضربته بالعصى بكل قوة ثم أغمي عليه . وأنا أضربة بينت له أني إرهابي سني ... نعم هاي قصة المعمم الوسخ صدقت<br />أبلغ عن هذا التعليق<br />الله يخزيكم يا عرب السنة وشيعة<br />أرسل هذا التعليق بواسطة : انا مسلم<br />ما تستحو علي انفسكم بتنهشو ببعضدكم حرام علكم جميعكم مسلمون كل العالم ضد الاسلام .عربي نتي مش عربي يا عربي.هك بدو الغرب يا.قاهر النواصب<br />أبلغ عن هذا التعليق<br />الشيعة المخانيث على زبي<br />أرسل هذا التعليق بواسطة : نايك الشيعي نشافي<br />ابي انيك واحد شيعي نشافي واخليه يروح ويلبس عمامته وهو حامل بالشهر الاول خخخخخخخخخ<br />على زبي الشيعة<br />ولاحد يغلط على السعوديين عشان مانيك له امه دوق ستايل يابناء القحبة يانباء الشرموطة<br />ياشيعي اختك قحبة وابوك امبسبس وامك عليه واقفة جرارة<br />ياشيعي اسمع الحقيقة شبت في كس امك حريقة امش ياكللب ياديوث استر على امك طفي محنتها باي طريقة ماصورة ولا زب صناعي ولا يمكن يكفيها زب الحماار<br />هههههههههههههههااااااااي<br />يالشيعة انتم مهانين اقولكم شئ ياشيعة يامخانيث<br />روحو تحت السرير حق اختك وبعبصها ونيكها وطلعها خلها تتشرمط في الاسواق..<br />هههههههههههههههههههههههههههه<br />والنعم باهل السعودية وزبي في الشيعة...<br />أبلغ عن هذا التعليق<br />عيري بكس ام مقتدى القرد وبكس ام الستياني او سورى السستاني الصخل وبكس اخت الحقير<br />أرسل هذا التعليق بواسطة : خمينى الكلب ابن الكحبة عجل يابة<br />كس ام الشيعة من شمال العراق لجنوبه انتوا يا جلاب الوطن ياسفلة الارض يا عبدة الاوثان ويا من تعبدون الله بالكذب انتم يا سحرة ويا دجالين يا عبدة هبل عير بكس امهاتكم وخرة بعماماتكم اتعلمو حجى وبعدين احجوا خوات التمصة امهات التدحسة اهل الزنا جماعة المتعة صايرين شرفاء اصحاب دين وانحب اهل البيت ولكم انتوا اصلكم انغولة والبغولة اشرف منكم انتوا الكل يعرفكم عبدة القبور والنار وانتوا اللى كتلتوا اهل البيت خونة<br />أبلغ عن هذا التعليق<br />افيقوا<br />أرسل هذا التعليق بواسطة : almadbooh<br />لا حول و لا قوة الا بالله<br />أبلغ عن هذا التعليق<br />شيعه بلاعين العيوور<br />أرسل هذا التعليق بواسطة : سالب شرف الشيعه<br />العن ابوكم يا شيعه يا مذهب القذاره يا مذهب الحرام الله يلعنكم في كل كتاب الله ينتقم منكم يا اوصخ شعب واوصخ ناس<br />عيري فيكم وبكل شيعي وشيعيه يا قحاااااااب يا اولاد الحرام<br />أبلغ عن هذا التعليق<br />الشيعه هم حثالات البشر<br />أرسل هذا التعليق بواسطة : قاهر الشيعه الانجاس المتوحشون<br />الى الاخ القلب الكبير تحيه عطره وبعد: كيف حاللك اتمنى ان تكون بخير .<br />لم اكتب من فتره فلقد توفي ابن عمي وكنت مشغولا .<br />فرجعت الان لاكتب وافضح ابو درع وابو خرى في اللي خلفو مقتدى النجس ابن النجسه فهم كفار بامتياز. ويجب علينا ان نعمل بجهد ونفضح هؤلاء المتخلفون الوحوش اتفو على الخميني النجس ابن النجس .....<br />أبلغ عن هذا التعليق<br />كسسسسسس امكم كلكم<br />أر