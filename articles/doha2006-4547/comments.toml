subject = "انا اجيت صائد الحشرات والقوارض كفالة سنة"
text = "أرسل هذا التعليق بواسطة : مروان البر يشي<br />نيك الشيعة في الحالات اتالية حلال :1 من الخلف 2 اكبار والصغار 3 الرجال والنساء .افقع وكس ا خت كل من : السكستاني الصدر والطيز الصحن الطيزي ولحيدري والخميني وباقر الحكيم علا اختهي وا امهي القحب بلااعت عيور ككاولية لعنة عاليكو يا اخوات القحبة لاستثني منكو احد ا"
