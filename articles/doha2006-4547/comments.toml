subject = "كس ام السنة"
text = "أرسل هذا التعليق بواسطة : شيعي كيفي<br />كس امك يا ابو شخة الشيعة تاج راسك و كس عرظك يا ابن القحبة"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 9
subject = "مجانين السنة و الشيعة"
text = "أرسل هذا التعليق بواسطة : فلسطيني<br />يخرب بيتكو مجانين ، سنة و شيعة ولكو اليهود و الامريكان بذبحو فينا و إحنا بنسب على بعض و بنحارب بعض ولك الاسلام المستهدف ، شيعي و سني ، ولك هذا من نجاحات الاحتلال الاسرائيلي و الامريكي يفرقنا ، اتوحدو يا مسلمين اليهود و الامريكان ذبحونا"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 10
subject = "هههههههه"
author = "على العموم كس امكم"
text = "أرسل هذا التعليق بواسطة : يا صدام حسين<br />و الله الشيعة مجانين شو الهبل الي تسوه<br />يعني شو خص ابا الفضل في المنتاك الايراني"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 11
subject = "العن ابو السنه"
text = "أرسل هذا التعليق بواسطة : ابودرع<br />لك ابو شخه لو تعرف معنى الاسم مكتبته بس انت منيوك سني والسنه ماعليهم حرج كلهم مناويك وراح ننكيكم واحد واحد يا دودكيه كس اخوات السنه ولاسيما القائد المجاهد حارث الضارط عفوا الضارب عفوا الضاري كوووسها لاوخته"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 12
subject = "يا ابو شخه"
text = "أرسل هذا التعليق بواسطة : ابو درع الشهم<br />السنه كلهم مناويك واولهم عمر بن الخطاب لعنه الله"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 13
subject = "ياااااااااااااا ابو شخه"
text = "أرسل هذا التعليق بواسطة : ابو درع الشهم<br />السيد القائد المجاهد مقتدى الصدر تاج راس الشيعه ونياج خوات السنه"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 14
subject = "الله يامسلمين"
text = "أرسل هذا التعليق بواسطة : شيعي وافتخر<br />ياناس يا عالم ويش هل الريج انو الي تسمون روحكم شيعة ويش هل الكلام المكتوب هذا كلام يطلع من شيعي عيب عليكموانتو ياسنه مو عيب عليكم هل الكلام سنة النبي هذي تسبون"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 15
subject = "مساعدة خاصه للوهابيات"
text = "أرسل هذا التعليق بواسطة : المساعد الفذ<br />أي بنت وهابيه او سنيه سلفيه عمرها بين 15 و30 تريد أن اجرب معها رضاعه الكبير وبكل سريه سأمص لها وأريحها تتفضل هذا ايميلي ahmedaalnasser@hotmail.com"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 16
subject = "مساكين"
author = "ربنا يرحمكم جميعا من الاسلام"
text = "أرسل هذا التعليق بواسطة : ابو السماسم<br />والله المسلمين سنة وشيعة مساكين واحد ماشى ورا محمد وواحد ورا على والنهاية كله بدعة شيطانية<br />السيد المسيح قال انا هو الاول والاخر"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 17
subject = "لعنة الله عليك ياصليبي ياكفار"
text = "أرسل هذا التعليق بواسطة : السلف الصالح<br />لعنك الله يا ابو السماسم ياصليبي ياكافر سوف نذبحكم ذبح النعاج يا احفاد القردة والخنازير وان غدا لناظره قريب الا رسول الله ياعباد الصليب"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 18
subject = "كس ام الشيعة"
text = "أرسل هذا التعليق بواسطة : عـــمـــر<br />كس ام الشيعة واحد يقول للثاني .. كلكم أولاد ممتعة كس أمكم قحاب ولاد قحاب"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 19
subject = "يا ابو درع الشهم يا إبن المنتاكة"
text = "أرسل هذا التعليق بواسطة : عـــمـــر<br />إيري بطيز أمك القحبة يا ابن الشرموطة الكبيرة الي نمت معها .. وأنا نمت مع كل الشيعات الشرموطات .. كس أمكم منايك قحاب ولاد قحبات أولاد متعة يلعن شرف الشريف فيكم يا منتاكين .. أولهم حسن نصرالله أخو الشرموطة الي نمت مع أمه ومقتدى الصدر المخصي إبن الداعرة المنتاكة .. كس أمكم أمياتكم قحبات شرموطات .. الله ينيكني ام كل واحد شيعي .. أمين"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 20
subject = "يالشيعي يالجرار .."
text = "أرسل هذا التعليق بواسطة : نياك الشيعه<br />ياشيعه يامخانيث ياكلاب ياجرارين ,, والله والله اني مافيكم ذره شرف ,, امس كنت نايم مع وحدة شيعية ,, ايوه انتم هذي شغلتكم تتوالدو عشان احنا ننيكم .. هههههههههههههههههههههههه"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 21
subject = "هاتك عرض الشيعه"
author = "بااااااي زغيب الخومينييات"
text = "أرسل هذا التعليق بواسطة : زغيب الخومينيات<br />ختفوووووووووو عليكم يا شيعه ياعبادين القبور يا اولاد المتعه فعلاً انا مع تعليق الاخ الي يقول انتو تتوالدون عشان ننيكم<br />العن ابووووووكم يا روافض يا انجس خلق الله يا انجس من الخنازير يا اغبياء يا سفله يا واطيييين خررررررره على كل شيعي عابد قبور وانت يا مسيحي يا غبي ياغبي يااااااااغبي ترا انت مافي فرق بينك وبين الشيعه<br />الشيعه يعبدون قبور وانت تعبد انسان مثلك مثله يا زطي يا عرص العن ابو الي نفضكم يا قحااااااب"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 22
subject = "شيعه؟؟"
author = "سبحان الله خنازيير بشريه"
text = "أرسل هذا التعليق بواسطة : عباس جوغوي<br />يا اخوان مايصح هالكلام عيب ومايصير تسبون وتغلطون بس مدام شيعه حيلكم فيهم عبادين القبور عبادين التربه بلاعين العيور اولاد المتعه والزنا اولاد الحرام الشيعه اصلاً السيد تبعهم لازم يتمتع بالمرأه قبل مايدخل عليها الديوث زوجها والاخ لازم يتمتع بأخته الديوث الثاني<br />فعلاً انتم اولاد متعه واولاد زنا وأولاد حرام<br />والدين بريئ منكم وشوفو الي بالصوره والله مايفرق عن الخنزير شي"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 23
subject = "خره فيكم يانواصب ياكلاب"
text = "أرسل هذا التعليق بواسطة : مقتدى كاسر خشوم النواصب<br />كس امكم واحد واحد يانواصب ياخوات القحبه ادخل زبي في مكوتكم يامخانيث ياعيال القحاب اولاد المسفار يا انجاس تفووو عليكم وعلى اشكالكم الوصخه"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 24
subject = "الرد على الشيعه"
text = "أرسل هذا التعليق بواسطة : سنى نايك 50 شيعيه<br />العن ابو ابو الشيعه الكلاب عبدة الزب كس ام كل شيعى فى الوجود"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 25
subject = "مصاص الزببه مقتدى القذر"
text = "أرسل هذا التعليق بواسطة : سنى غصب على كس ام الشيعه<br />بعيكم معلومه عن مقتدى القذر هذا النذل نايك اخته هذى معلومه حقيقيه ما تشوفونهم يقودون على اخواتهم"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 26
subject = "كس امكم كلكم يا السنة"
text = "أرسل هذا التعليق بواسطة : شيعي لين الموت ومحد بغيرني<br />اصلا كل السنة يدعون حب الرسول عليه وعلى اله الصلاة والسلام لانهم كلهم سفلة واحد واحد والله العظيم حرام عليكم الي مسويين حرب عليهم ال الرسول يا جهلة اصحو للدنيا اصحو الرسول لن يشفع لكم يوم القيامة الله ياخذكم يا سفلة يا خونة"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 27
subject = "شيعيون"
text = "أرسل هذا التعليق بواسطة : لبيك يا حسين<br />الحق باين باين والالفاظ القذرة هذي مابتنفعكم في النهاية الحمد لله اني انولدت شيعي وساموت شيعي موالي لاهل البيت عليهم افضل الصلاة والسلام ومن شيعة الحسين ومن محبي ال محمد صلى الله عليه وعلى اله وسلم وعجل فرجهم يا الله وجعلني من انصارهم الى يوم الدين"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 28
subject = "خنازير صج خنازير"
author = "ههههههههههههههههههههههههههههاااااي"
text = "أرسل هذا التعليق بواسطة : اهداء الى كل خنزير -س-ن-ي"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 29
subject = "كسس ننه"
text = "أرسل هذا التعليق بواسطة : نياك الشيعيات<br />خهخهخهخهخهخه يا كلاب يا روافض العن ابوكم يا متخلفين انتو ناس انخلقتو للمتعه فقط<br />يعني الواحد يروح السيده زينب الي بدمشق ينيييك الشيعييات يروح البحرين هم ينييك شيعييات<br />يروح ايران ولبنان والكويت هم ينييك شيعييات العن ابوكم وين مانروح ننيييك فيكم<br />انتو المفروض مالكم اي كلمه ولا اي صوت لأنكم اولاد زنا واولاد متعه واوالاد حرام<br />وعلى فكره كل ماشوكتكم تطلع بنكسرها لكم<br />خهخهخهخهخهخه عيري بأم الخميني اساس الفجر والكفر<br />وعيري بامه واخته وبعرضه وشرفه<br />عيري بشرف كل شيعيه شرمووطه وشريفه<br />ويعني ما اعتقد في شريفه يا عابدين الزب والطييييز العن ابوكم لابو من جمعكم انتو وهذا الخرتيت البقره فرس النهر لو يجي يشيل عيري ويتمرن فيه مو احسن؟؟؟!"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 30
subject = "n70"
text = "أرسل هذا التعليق بواسطة : n70<br />يا كلاب انا لماتركت هالصفحة انتوا فلتوا ما هيك بسيطة بس يكون باعلم والحاظر يخبر الغايب انوا (سيدنا عمر ابن الخطاب كان ينتاك)<br />ملاحظة الي كاتب هالقال هو(جعفري )علوووووو من سورية @ الاسد"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 31
subject = "على عيري كل سني"
text = "أرسل هذا التعليق بواسطة : نايك 51 سنيه هع هع<br />انتوماليكم حق تتكلمو لان انتوو منايك تتنيكووعلى خواتكم واناا نكت 51 سنية وكلهم وصخين يعني انتو مو طاهرين وبانتكم حق نيك ورجالكم يصيروو شيخ وعمايمكم على بهايمكم هعهعهعهع وانا شيعي وغصبن عن كل شيخ سني جرار وجرار خواته للنيك وعلى فكرة ((قحابكم وصخين ويحبوو المص ) سيدنكم عنر قاليكم لماا ينكم واحد مصوو له زبوو كتيرر يا منايك هعهعهعهع"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 32
subject = "يا شيعة يا أولاد الشرموطة"
text = "أرسل هذا التعليق بواسطة : نايك أم مقتدى الصدر والشيعة كلهم<br />يعني لازم نظل نكسكس لخواتكم الشرموطات كس أم مقتدى الصدر والسيستاني وكل الشيعة المنايك أولاد الشرموطة المنتاكة .. الله خلقكوا عشان تنتاكوا يا منايك كس أمكم شراميط .. خوات الشيعة شرموطات .. ومقتدى الصدر وحسن نصر اللات أكبر ولاد شرموطة .. أنا نكتها لأمه هذا نصر اللات القرن إبن القوادة"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 33
subject = "كفى كذب"
text = "أرسل هذا التعليق بواسطة : ربي الله ولااشرك معه احدا<br />السنه فئة ضالة ومضلة وكذابين ومحتالين بإسم الدين والشرع يحاربون الشيعه بأسم المتعه ومذهبهم الأعور يشهد لهم بزواج المسيار !!! تناقض.. يحاربون الشيعه على المراقد وتجد أهل السنة وبالذات أهل السفلية السعودية يعبدون حكام هذه الأمة المعوجه !!! تناقض.. يحاربوننا كشيعة في لبنان اولآ لأننا اثبتنا لهم ان ولاة امرهم اشباه الرجال يحاربون مذهبنا الذي حطم اسطورة الجيش الذي لا يقهر<br />قبل ان تشتم الشيعي وتكفرهم فكر في نفسك وكفر ذاتك المتغطرسة على الدين ياجاهل انا لا اكفركم ولكن اقول لكم كفاكم ضحك على الدين مذهبنا ليس دينآ أخر ومذهبكم ليس دينآ اخر كيف تكفروننا ونحن نشهد ان لا اله الا الله وان محمد رسول الله ؟<br />تكفروننا لأننا مذهب يأبى ان يعيش الا تحت ظلال السيوف ؟ يامن تحبون العيش تحت ظلال السقوف اين جهادكم وتاريخكم شتم وتكفير ؟"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 34
subject = "الشيعة على زبي"
text = "أرسل هذا التعليق بواسطة : نايك أمك يا شيعي يام منتاك<br />كس أم الشيعة كس أم الخميني و إيران كس أم مقتدى الصدر كس أم حزب اللات كس أم السيستاني والمالكي .. كس أم الشيعة أبناء المنتاكة .. كس أم الضاحية الجنوبية .. عاش الشيخ سعد الحريري و فؤاد السنيورة والملك عبد الله نايكين أم الشيعة المنتاكين .. كس أمكم يا عبدة القبور كس أمكم يا مجوس .. وسيبقى كل السنة غصة في حلقكم يا أنجاس يا أنذال كس أم الشيعة في كل مكان بكربلاء والنجف وكل بقعة على الأرض فيها شيعة .."
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 35
subject = "ماذا نقول لإولاد الحرام"
text = "أرسل هذا التعليق بواسطة : مدمر الرافضة<br />ان السيستاني تمتتع بأخت مقتدة ومقتدةتمتع بأخت----ولذلك كل الشيعة واولاد حرام وهم خطر على الدين الاسلامي اكثر من الفرس و اليهود ويجب إزلتهم كما يزال الورم من الجسم وتحية لصدام نايك مقتدة وشيعته"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 36
subject = "كلمة حق"
text = "أرسل هذا التعليق بواسطة : صدام حسين<br />يأخ عربي لقد قلت الحق انا صدام و الشيعة اعدموني لااني لا انيك الإ النساء الشيعيات وهم يريدوا ان انيك الرجال الشيعة قلت لهم هذا حرام هذا لواط ولذلك اعدموني ماذا اقول لشعب شيعي حياته كلها نياكة في نياكة ومتعة وهناك مص المتعة عندهم يجوز ان يمص الرجل الشيعي للفرس فتوة من اية كسكساني لطيزاني زورو موقع طيزاني في قم"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 37
subject = "مجلس الافتاء الشيعي"
text = "أرسل هذا التعليق بواسطة : علي حسن حسين عباس ابو الفضل<br />احدث فتوة شيعية بسبب الدواعي الامنية وحضر التجول يجوز ان يحدث زواج متعة ما بين الاخ واخته والاب وابنتة ولابن وامه بشرط القبول وبدون اذن الولي وبشرط حضر التجوال وينتهي الزواج مع رفع منع التجول المجلس الاعلى للافتاء في 25 رجب"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 38
subject = "شيعة يا أبناء الحرام"
text = "أرسل هذا التعليق بواسطة : نايك أم مقتدى القذر<br />هذا دليل واضح على إنه الشيعة أبناء حرام كس أمهم يلعن شرفهم أبناء زنا ومتعة يلعن طيز أم الشريف فيهم هالكلاب الخونةعبدة الأصنام والقبور كس أم إيران الي طلعتهم"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 39
subject = "مساء الخير"
text = "أرسل هذا التعليق بواسطة : السلطان<br />الله يسامحكم على هذه الالفاظ لسا سنة وشيعة روحوا شوفوا الامريكان واليهود شو عم يعملوا فيكن وباعراضكم هذا احسن ما تتحدوا ضدهم عما تسبوا بعضكم ولا هذا اللي شاطرين فيه عاملين حالكم اسلام والله الاسلام بريئ منكم الله ينتقم من كل واحد بيعمل فتنة"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 40
subject = "الحقيقة"
text = "أرسل هذا التعليق بواسطة : باحث عن الحقيقة<br />يا مسلمين ان قاتل الامام علي بن ابي طالب عليه وعلى ال بيته السلام هو ابن علقم وهو فارسي من ايران بسيف اشتراه بالف درهم ووضع عليه سم بالف درهم انظروا للحقد الفارسي على العرب"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 41
subject = "لاحول ولا قوة الا بالله"
author = "مع السلامه واستغفر الله لي ولكم"
text = "أرسل هذا التعليق بواسطة : لا سني ولا شيعي مسلم<br />اتقو الله يا مسلمين المشكله السنه مسلمين والشيعه مسلمين<br />بدال السب والغلط على بعض اتقو الله ويا اخوان كل انسان ومذهبه لهم دينهم ولنا دين اتقو الله الناس رمضان وصيام وانتو هنا تسبون وتغلطون وتكفرون اتقووووووو الله يا مسلمين الله يهديكم"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 42
subject = "قم"
author = "أتقوا الله يا شيعة خافوا الله ...."
text = "أرسل هذا التعليق بواسطة : حيدرة<br />الحقيقة تقال مارايت أوسخ من الشيعة وخاصة المعممين ... أكثرهم يفعلوا الفاحشة مع الصبيان ذكور مع أن المتعة حلال<br />آني ما ألوم السنة أبداً صحيح أن بعضهم وسخ ولمن لا يقول أن هذه الوساخة دين وشرع شرعة علي عليه السلام"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 43
subject = "العراق"
text = "أرسل هذا التعليق بواسطة : شيعي محب آل البيت<br />قم كلامك صحيح من ناحية المعممين آني شفت أكثر من معمم مع صبي ... ومرة تتبعت واحد من هؤلاء ترصدت به بعد المحاضرة وكانت خووش موعضة بكى كثير منا ... ثم وقفت أتابعه بسيارتي ( بيني وبينكم آني مخابرات شيعي ) وكان الوقت ليل وقفت سيارتة على جانب طريق فرعي .. أوقفت سيارتي جانباً بيث لا يراني ..أسرعت ومعي عصى غلظة وكنت ملثم لأن الحكومه تساعد المعممين وتصدقهم .. المهم شاهدته يخلع سروال الولد ويحاول إدخال ذكرة .. كسرت الزجاجة وضربته بالعصى بكل قوة ثم أغمي عليه . وأنا أضربة بينت له أني إرهابي سني ... نعم هاي قصة المعمم الوسخ صدقت"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 44
subject = "الله يخزيكم يا عرب السنة وشيعة"
text = "أرسل هذا التعليق بواسطة : انا مسلم<br />ما تستحو علي انفسكم بتنهشو ببعضدكم حرام علكم جميعكم مسلمون كل العالم ضد الاسلام .عربي نتي مش عربي يا عربي.هك بدو الغرب يا.قاهر النواصب"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 45
subject = "الشيعة المخانيث على زبي"
author = "والنعم باهل السعودية وزبي في الشيعة..."
text = "أرسل هذا التعليق بواسطة : نايك الشيعي نشافي<br />ابي انيك واحد شيعي نشافي واخليه يروح ويلبس عمامته وهو حامل بالشهر الاول خخخخخخخخخ<br />على زبي الشيعة<br />ولاحد يغلط على السعوديين عشان مانيك له امه دوق ستايل يابناء القحبة يانباء الشرموطة<br />ياشيعي اختك قحبة وابوك امبسبس وامك عليه واقفة جرارة<br />ياشيعي اسمع الحقيقة شبت في كس امك حريقة امش ياكللب ياديوث استر على امك طفي محنتها باي طريقة ماصورة ولا زب صناعي ولا يمكن يكفيها زب الحماار<br />هههههههههههههههااااااااي<br />يالشيعة انتم مهانين اقولكم شئ ياشيعة يامخانيث<br />روحو تحت السرير حق اختك وبعبصها ونيكها وطلعها خلها تتشرمط في الاسواق..<br />هههههههههههههههههههههههههههه"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 46
subject = "عيري بكس ام مقتدى القرد وبكس ام الستياني او سورى السستاني الصخل وبكس اخت الحقير"
text = "أرسل هذا التعليق بواسطة : خمينى الكلب ابن الكحبة عجل يابة<br />كس ام الشيعة من شمال العراق لجنوبه انتوا يا جلاب الوطن ياسفلة الارض يا عبدة الاوثان ويا من تعبدون الله بالكذب انتم يا سحرة ويا دجالين يا عبدة هبل عير بكس امهاتكم وخرة بعماماتكم اتعلمو حجى وبعدين احجوا خوات التمصة امهات التدحسة اهل الزنا جماعة المتعة صايرين شرفاء اصحاب دين وانحب اهل البيت ولكم انتوا اصلكم انغولة والبغولة اشرف منكم انتوا الكل يعرفكم عبدة القبور والنار وانتوا اللى كتلتوا اهل البيت خونة"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 47
subject = "افيقوا"
author = "لا حول و لا قوة الا بالله"
text = "أرسل هذا التعليق بواسطة : almadbooh"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 48
subject = "شيعه بلاعين العيوور"
text = "أرسل هذا التعليق بواسطة : سالب شرف الشيعه<br />العن ابوكم يا شيعه يا مذهب القذاره يا مذهب الحرام الله يلعنكم في كل كتاب الله ينتقم منكم يا اوصخ شعب واوصخ ناس<br />عيري فيكم وبكل شيعي وشيعيه يا قحاااااااب يا اولاد الحرام"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 49
subject = "الشيعه هم حثالات البشر"
text = "أرسل هذا التعليق بواسطة : قاهر الشيعه الانجاس المتوحشون<br />الى الاخ القلب الكبير تحيه عطره وبعد: كيف حاللك اتمنى ان تكون بخير .<br />لم اكتب من فتره فلقد توفي ابن عمي وكنت مشغولا .<br />فرجعت الان لاكتب وافضح ابو درع وابو خرى في اللي خلفو مقتدى النجس ابن النجسه فهم كفار بامتياز. ويجب علينا ان نعمل بجهد ونفضح هؤلاء المتخلفون الوحوش اتفو على الخميني النجس ابن النجس ....."
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 50
subject = "كسسسسسس امكم كلكم"
text = "أرسل هذا التعليق بواسطة : كسسس امكم كلكم شيعه وسنه<br />عيري فيكم كلكم يا شيعه انا لو كان ديني غير الاسلام وراح اسلم طبيعي اصير سني انتو يالشيعه قذرين كيف تنيكون بناتكم من ورا يا لحاسين الزق هذا كفوك يا صراصير تحبون الطيز لأنها مخرج الزق والصراصير تحب الزق يا زق بااااي"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 51
subject = "اعوذ بالله"
text = "أرسل هذا التعليق بواسطة : حرام الي تسوونه<br />الحين بينتو لي شي واحد اني اخذت من مذاهبكمالسب والشتم انا الحين اقول ان اليهودي صار اطهر من المسلمين بكلامكم هذاوبينتو لي اعوذ بالله وحتى الصحابه اهنيكم على دينكم لوثتوه بسمعتكم الوصخه"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 52
subject = "مسلم"
text = "أرسل هذا التعليق بواسطة : مسلم عربي<br />مابتستحو علي حالكم ياعرب .العالم ضكم بيكرهم يا زبلت هذه العالم سنه وشيعه.كل واحدمنكم اخو شرموطه .سمحولي علي هذا لغوه"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 53
subject = "شيعي وافتخر"
author = "ههههه"
text = "أرسل هذا التعليق بواسطة : شيعي وافتخر ونقهر ملك مو عاجبه يتخنف وينتحر<br />انا شيعي وانتوا النواصب<br />اقولكم<br />انا شيعي وافتخر وادوس قبر شيخكم واقهر ولي مو عاجبه ينتحر<br />انتوا زي عمرو بن العاص لين فسخ هافه لين جا الأمام علي بيقتله<br />انتوا تتنايكوا رجالكم يتنايكوا ويفتخروا<br />ونسائكم ياحبهم للمص<br />كل وااحد قضه اسود متروس دم<br />وكل وحدة حيلها قد عيري<br />عيري طويل عريض قوي يسر الناظرين<br />اللي يبي يشوفه يجي القطيف او العوامية<br />ويشوف العير<br />وانتوا اولاد حرام ناييك<br />خواتكم يتنايكوا في امريكا"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 54
subject = "نياك الشيعه"
text = "أرسل هذا التعليق بواسطة : سني عربي<br />كس امكم يا شيعه يا كلاب يا مخانيث ارجل شيعي في الوجود على زبي يامعرسين كباركم يحبون نيك الاولاد بس"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 55
subject = "الى النذل مسلم عربى"
author = "عود اذكرنا ههههههههه"
text = "أرسل هذا التعليق بواسطة : العرب الكفرة العملاء<br />انت يامسلم عربى جكدنيجت ياكواد يا ابن الكوادةامك وخواتك جكد خرطوو بالملاهى ابن بلاعة العير ابن ام الترصة اخت الترطة مصاص لحاس روح الحك امك وخواتك ولويلعبن بالعير جقة شبر ويرجعون للبيت يشتهون العير يلة هى علينا انت تنيج امك وخواتك اوى"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 56
subject = "انت يا ابو شيعى وافتخر"
text = "أرسل هذا التعليق بواسطة : عيربكس اختك وامك كووووووااااادددد<br />ابن بلاعة العير ابن الجارورة والقارورة مستنقع كواد اخت التنيج منيــــــــــــوك قذر نكس اطرم ولك على شنوخابصنة افتخروافتخر على امك اللى كاعد ينيجها القرد المعمم مالتكم والا على اخواتك الى كاعدات يحكن وينوحن على كساستهم بعد ما اغتصبوهن جيش الوردى اى حقك خوش افتخار دروح نيج احسلك لواقبض ثمن النيج كواد ولك انتوا كلكم تنيجون وبالمتعة تتكاثرون مثل الصراصير لان المتعة شعاركم الاب يزوج بنتة والابن يزوج اختة اعوذ بالله منكو ياوسخين يااهل الفحشاء والزنا والمتعة ابقوا ورة ايران الجايفة يطيح حظكم لو ورة اهل العمايم اللى من باب يدعون بالدين ومن جهة اكبر خوات كحبة ولك اختك انيجة اذا اشوف اسمك مرة ثانية كواد"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 57
subject = "وأعتصموا بحبل الله ولاتفرقوا"
text = "أرسل هذا التعليق بواسطة : القسور العراقي<br />لاحول ولاقوة إلا بالله<br />يا إخوان الإنسان بأعماله وليس بإنتمائه المذهبي . أكو بالعراق شيعة زينين وسنة زينين. فعيب هالكلام لأن المسلم من سلم الناس من لسانه ويده. صدق رسول الله ."
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 58
subject = "كس كس ام ازعم شيعي"
text = "أرسل هذا التعليق بواسطة : كس ام الشيعه<br />كــــُـــس أخــت أزٍعَـَم شيـعي على آآآيري أخوٍوٍ شرموٍطه وكسسسسس اخت الي بدووو يسب علي كلمه بس ابن شرموطه ويلا عيشو يا ولاد العااااااههره :]"
archived = "2007-12-02"
