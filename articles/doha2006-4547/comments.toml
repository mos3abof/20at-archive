[[comments]]
order = 99
subject = "الشيعه ما تخلي السنه تتفرغ للجهاد"
text = "أرسل هذا التعليق بواسطة : مروان سوب 7<br />في مواقع كثيره لي النصارى تسب محمدا ص وعلي وابوبكر والحسن وانا عندي العناوين والدليل وانا موريهم ولعن حرمهم وانا ملزق فيهم ما بتركهم وانا مجننهم<br />واشيعه واقفين ضد السنه لاهم تاركينا نحن نرد على النصارى وهم الشيعه لايردون ويدافعون عن محمد ص وعلي يسبون في روم النصارى ولا ارى شيعي واحد يدافع فقط السنه هم من يدافعون عن ال اسلام"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 100
subject = "انعل ابوكم لابو الي جابكم يا كلاب ياخرة"
text = "أرسل هذا التعليق بواسطة : آقيم على كس امكم الحد ياشيعه<br />الله يلعن أبوكم يا أولاد الكلب خرا في وجهكم يلعن ابوكم كس امكم يا منيوكين يا شراميط كل واحد يبلع لسانه وياكل خرا انتم حيوانات الله يلعنكم ياعيال الكلب مخآنيث تفو على الكس الي جابك إنت وياه واحط برج ايفيل بكس ام كل شيعي على زبي كلكم خوات شرموطة كلكم ولاد كلب العن ابوكم لا ابو شرفكم ودي انيكم واحد ورا الثاني مسوين زحمه العن ابوكم لابو من خلفكم يكلاب ياخره مص ولحس وأنيك اختك القحبه يقوآد يبن القوآويد والله أصلبك على زبي ياشيعي أبطح وانيك اهل بيتك ياولد الحرام العن ابوك ياخراعيري فيك والله لأفلت زبي بكس اختك يسرح ويمرح يا كلب كس امك ياشيعي يا منيوك كس امك ياولد الرخآص آخ آتفووو بنص طيز أمك تفو علي راس امك يا ولد القحبه يا ثور والله لو آشوفك أنيكك من دقنك أنت زبالة و الصرصار اللى فى الخرا أحسن من اللى جابك كس امك وكس اختك وكس اخت الي نفضك يا حمارتفوووووه علي كس أختكم العن أبو والدينكم على من جمعكم اخ اخ اخ اخ تفو تفو تفوتو على جهنم يولآد القحآب كس أخت اللي نفض الشيعه انيك امكم يا اولاد الشرموطه انعل ابوكم لابو الي جابكم يا كلاب ياخرةازق فوق رآس أبوك إنت وياه كس امكم عيري فمك العن ابو والدينك أنيك ولايآك أوطيك بجزمتي أوصلك للقاع ياخره يا خنيث ياابن الجراره يا منيوك ياشيعي منااااايك يا عيااال الشرموووطه اقسم بشرفي لو آمسك واحد فيكم لانيكه وانيك آهله بساعه وحده واشوف مراجلكم الكذابه كس خواتكم ياقحأب يأولد القحبه إنت وياه أنتم لستو سوى حشرآت في نظر مواطنين وأقل من حشرة في نظر أسيادكم أنتم طبقه زباله وصخه كآبسه على نفس الناس ذليلين فالمجمتمع عآر على ال أمه ال أسلاميه والعربيه العن ابوكم واحد ورا واحد ياكلاب وياولاد الكلاب مص زبي الله يلعن ابو من جابكم ياكلاب ياشيعه ياقوآدين انيك امكم فى طيزها الواسعه يا كس امها انا انيك امك يا ابن القحبه يا ابن الشرموطه ياشيعي رآح أنيك اجداد اجدادك والله انكم ماتسوون شي يا عيال الكلب والله لأنيك أمك يارافضي يانجس واخزق وابزق والزق في كس أختككول خرا وادحش عيري بكس اختك الله يلعن أبوك آتفوووو على طيزك كس امك على أبو امك على زبي تعال خذ كلس اختك من البيت يا خرنثه ياقواد ديووووووووووووووووث كس امك يا ابن القحبه انا اوريك ياخنيث ياشيعي ياكلب انيك اهلك وطوايفك كلهم يابن القحبة كس امك على كس أختك على زبي كل اللي تعرفهم اكبرهم و أصغرهم ياخنيث على رآس زبيييييييييي كس امك إنتى اخرتها راح تنيك نفسك آخ آتفوووؤؤؤءهـ على كل الروآفض خرا على هالاشكال المشوهة لاهم رجال ولاهم حريم تفو عليكم واحد واحد فروخ عيال كلب مخانيث العن الله ابو من جمعكم كلااااااااااااب كس خواتكم واحد واحدعلى زبييييي يلعن ابو شرفكم قحاب ولاد قحبات منآآآآآيك كس امكم كلكم ياولاد الكلب ابول على شرف اهلكم لابوكم لابو من جمعكم ياقحيب أتفوو على كس امكم لبوكم اكته فيكم قحاب مخآنيث كلكم على زبي يا عيال الكلب شرآميط ابناء المتعه ابناء ليله الطفيه يلعن شرف الشريف فيكم يا ولاد العاهرة خراي عليكم من اصغر ولد لاكبر جد ابول عليكم أتفو عليكمعير فيكم وعيرفي امهاتكم ادخل زبي في مكوتكم يامخانيث ياعيال القحاب اولاد المنيوكه يا انجاس تفووو عليكم وعلى اشكالكم الوصخه آتفووووووووووووووووووووووووووووكس ام الشيعه كلهم اولاد الزنا كس ام السيستاني الخنيث القوادكس ام الخميني كس ام مقتدى القذروكس امالحكيم على راس زبي كس ام الخوئي وكس ام الشيرازي وكس ام الكوراني وابول على دار الدعاره كربلاء النجسه وازق واشخ على النجف الانجس وكس امكم يا ابناء القحبه يا شيعه العن ابوكم لابو الي جابكم يا كلاب ياخرة"
archived = "2008-03-12"
capture_url = "https://web.archive.org/web/20080312154744/http://doha2006.20at.com:80/article.php?sid=4547"

