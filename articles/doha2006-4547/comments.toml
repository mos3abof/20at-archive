[[comments]]
order = 91
subject = "من على حق"
text = "أرسل هذا التعليق بواسطة : احله كدبه<br />السلام على من اتبع الهدى وبعد السب من عادة الجهل ولاتردو على السفيه جواب ولكن الشيعه على حق ونحن نعلم ابنا السنه ولكن نكابر على انفسنالانه الرسول ص اوصه الامام على على ولاية المسلمين من بعده ونحن السنه اتبعناهوا انفسنا ومن اتبعنا امثال عمر وعبد الملك ابن مروان ولايه صريحه في حق اهل بيت النبي اديقول بسم الله الرحمن الرحيم انما يريد الله ليدهب عنكم الرجس اهل البيت ويطهركم تطهيرا ومن هم اهل بيت النبي اهي الزهراء ع ام الامام علي ع ام الحسن والحسين سيدا شباب اهل الجنه هل يعقل سيدا شباب الجنه ليسا على الحق طبعا لا"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

