[[comments]]
order = 111
subject = "إنتوا مسلمين ؟إنتتوا محبين للرسول (ص)؟"
text = "أرسل هذا التعليق بواسطة : أنا مسلم وبس<br />سني ولا شيعي الإثنين يذكرون كلمة الله إذا هذا كلامكم وين محبتنا و احترامنا الله وللرسول(ص)والله عيب عيب عليكم وصلت يأهل العرب والمسلمين فيكم السب والقذف<br />وتسمون بأعماركم مسلمين كل من سب الرسول(ص) وأهل بيته الأطهار و أصحابه كأنه سب الله خافوا ربكم انتوا مسلمين كونوا قد هالكلمه مسلم كل اللي غلطو واللي سب بنظري هذا يهودي كافر وياويلك من عقاب الله..حسبنا و نعم الوكيل فيكم ياعرب يللي ينقال عنكم مسلمين سيدي ورسولي(ص) بريئ منكم يا......مسلمين."
archived = "2008-03-12"
capture_url = "https://web.archive.org/web/20080312154744/http://doha2006.20at.com:80/article.php?sid=4547"

