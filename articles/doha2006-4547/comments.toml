[[comments]]
order = 69
subject = "لاتسبو الحسن والحسين"
author = "يـــــــــــــــــــــــــو"
text = "أرسل هذا التعليق بواسطة : المــــــــــــــثــــــــــــقف الســـــــــــــــنــــــــــــــــــي<br />بسم الله الرحمن الرحيم وبعد<br />اخوانـــــــــــي السنه :<br />ان البعض منكم يسب الحسن والحسن رضي الله عنهم<br />وهذا غلط فأنهم من اقارب الرسول ومن صحابته وابناء بنته رضي الله عنهم<br />ولذالك لاتكونو مثل الشيعه (((الاغبيـــــاء))) بايعو دنياهم وأخرتهم<br />اللذين يسبون عمر وابو بكر رضي الله عنهم وغيرهم من الصحابه<br />وتخيلوا يسمون عمر وابو بكر ((الكلبان الاسودان))<br />لعنهم الله هم واسيادهم ((الخونه الكذابين مضاجعوا الصبيه))<br />لعنهم الله جميعاا<br />لا اقول الا ياايها السنه المقتدو بسنة الرسول<br />ان الشيعه يفضلون بعض الصحابه رضي الله عنهم وبعضهم يحقرونهم<br />فلذالك لاتسبوا صحابه الرسول اللذين يفضلونهم الشيعه لاننا نحن السنه ((نحب كم صحابة الرسول صلى الله عليه وسلم))<br />واقول للشيعه طريقة كلامكم وقحة زيكم واقول للواعين منهم واظن انه لايوجد واعين ههههههههه ادخلوا ااسلام فأنتم كفاااار<br />واول كفركم طريقة صلاتكم<br />وفي الختاااااااااااااااام لا اقول الا عاااااااااااااااااااااااااااااااشو السنه وعاشت كل بلد سني ولعن الله ايران والكفار والشيعه<br />ســــــــــــــــــــي"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 70
subject = "الأ اخ السني مثقف"
text = "أرسل هذا التعليق بواسطة : مروان البر يشي<br />كس اخت علي والزهرا الالقحبة مالت الشيعه الي هم يعبدوهم لاكن علي رضيا اللة عنه وفاطمه رضوان الله عليه الي احنامنعرفه مانرضى احد يسب عليهم وهم رحمت الله عليهم لم يسبو ابو بكر وعائشه ولاكن رجل قندرة من قم النجسة يسبون محمد ص يقول اكو في الماكنة خرخشه غلطت يارسولالله وان علي ضرب جبريل كف وهوى الذي يسامح الميت ويحاسب ويحضر المطر والرعد صوته ويقف على القبرعند دفن الشيعة المخانيث المنا ويك باالعين عيورة السني الاشرميط في قم مدينه نجسه في ايران عبدة النار والان يعبدون علي وفاطمة لها قران كانت الملئكه تكتبةلها زززززززززززززززززززززززززززززززززززززززززززززبفي ومهاتكو علمتوني السب ونا كنت مودب وفي النهياةكس اخت اشيعة المنويك على قد حبات الرمل *وعدو يا حبيبي يا حلوين"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 71
subject = "انا اجيت صائد الحشرات والقوارض كفالة سنة"
text = "أرسل هذا التعليق بواسطة : N 70<br />ما اخبارتتتتتتتتتا ني عن رقم تلفو ن اختك الحديث جداوالاكن لي معلوماتك كل العالم شافو كلسون زوجت بشار البس ميو ميييوو باااا بررر وي وي وي تعووةة والاكن من منطلق احساباتي اختك تجيب ن70 في زبين في الأ اردن وف مصر 5 ازباب وفي اليمن 6 ازباب ومصة وفي السعودية وانتااعلم في الزب السعودي نياكة واحد +مصة واحدةوووووووووافييييي الكويت مصة واحد وتاخذ اختك ن90"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 72
subject = "رد علا طيزي ونفتخر مقتدى مقتدى مقتدى اضرط"
text = "أرسل هذا التعليق بواسطة : مروان البر يشي<br />حنى مابدينى السب والأى الشتم انتم بداتم ونتم فرقتو وانا الي اصحاب شيعه من العراق وليسى من المجوس الملاعين ولم يسب و الصحابة يومن حتى في الخفاء ولم نبدئ في نشرسنتنا والاكن بداها الخوميني وقاتاتلنا وحربنا لم نذهب نحن الى ايران ولم نشرع قتل الشيعي المنيك الذي ينام مع ااختة ولا نحتا ج ايران واهيى الان تكر ه امريكى لمى لم تكرة امريكى عندى بدايت غزو سنتةالعراق الشرفا و لمى لم تدعم فتح ايام النضال السابقة ولم تدعم الشيخ اسامة بن لادن اللأن تدعم الفلسطنين وفي هذا الوقت تلعب بلفصائل الفلسطنية واللبنانية الان لي ماذا لاتتركونا واطلقونا وتحلو عن ازبابنا ولي ماذالا تكتب عربي ما هي كتابتك هل انتا مجوسي عبدة طيزيا انا لم افهم منها شيء كس اخت عرظك هل امك تعمل سكرتيرةعند المريكان قحبة هل تحب ان تخلف امك طفل اشقر وعين زورق من زب امر يكي ونتا تضل تلعب معاه انكوغغغووة انكغغغيه وتسميه طوني او ما ركوس"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 73
subject = "رد علا طيزي ونفتخر مقتدى مقتدى مقتدى اضرط"
text = "أرسل هذا التعليق بواسطة : مروان البر يشي<br />يبا هذا ابو النغل العباس ابن طيزي ولي يسب على السنه ويقول مناويك وابصر ايش ذني سواليف حصيدة الموكد والمنطق والعقل الطيزي الشيعي الجاهل لازم يعرف انه الزب المريكي ليس موجود عند السنه انما عند شيعة العراق وهذهي حقيقه . انا لم اخترعها لايصبرون علأى عدم النيك علأ من يحبون المريكان ويحمون المريكان ويقدرون الزب نحن السنة نذهب ال الغرب ونخنثهم . انتا فا همني انتا معيا مقتدى مقتدى مقتدى اظررررررطططططط عالأ زبيييييييييييييييييييييييييييي"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 74
subject = "انا اجيت صائد الحشرات والقوارض كفالة سنة"
text = "أرسل هذا التعليق بواسطة : مفتر س مواقع سب السنة الااطهار مروان<br />سئل الشيخ العلامة السيد صاحب المزبلة الحوزية ما هوحكم البصق في صباح الوجه الشيعي والبول عليه وهل هو مكروه فقال بسم علي الرحمان الرحيم لا اعلم"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 75
subject = "عـمـــر"
text = "أرسل هذا التعليق بواسطة : عــــمــــر<br />يا شباب السنة الأشاوس<br />إحنا أرجل من إنه نسب على أل البيت و أمهات و أخوات المسلمين .. أحنا الإسلام الحقيقي ..<br />كس أم الشية كلهم على زبي .. الشريف فيهم إبن قحبة والله مليت من كثر ما كسكست لخواتهم والله صابني شبع من خواتهم .. يلعن تعريص أم الشريف فيهم .. مقتدى القذر إبن الشرموطة لسه مبارح نكت أمه .. و السيكسستاني قبل بيوم قاعد مع خواته .. يلعن طيز امهم شراميط ..الخميني في الزمانات نكت أمه الجربة .. يا أخوان هدوا اللعب شرف الشيعة كلهما يساوي زبر سني واحد ."
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 76
subject = "كس اخت كل شيعي مع كل لفه دراجه في الصين"
text = "أرسل هذا التعليق بواسطة : نايك خواتهم<br />كس ام احسن شيعي .. كس اخت احسن شيعي<br />اولاد العرص اولاد الزنا اولاد القحبه اولاد الزانيه اولاد العاهره اولاد الساقطه ... الخميني تبعكم بس جالس ينيك في خواتكم يا اولاد التايهه .. كس امكم صحيح ... لو فيكم ذره شرف كان نكتوا امه للخميني تبعكم .. كس ام السكساوي تبعكم اخو شرموطه"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

