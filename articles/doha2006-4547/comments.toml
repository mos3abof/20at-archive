subject = "تفله من أصغر سني تسوى مليآر من الشيعه"
text = "أرسل هذا التعليق بواسطة : أل مهـــلـــــ هـــــل<br />انعل ابوكم لابو الي جابكم يا كلاب ياخرة آقيم على كس امكم الحد ياشيعه الأمريكان نايكين خواتكم يقوآدين طآلع لكم لسآن يخوات القحاب إنتم اول شي حررو بلدكم يافروخ وحرر أطيآز أمهاتكم وخواتكم من عيوره الأمريكان الله يلعن ابو شرفكم يآقوآدين أتفووو عليكم لعنه الله عليكم<br />الله يلعن أبوكم يا أولاد الكلب خرا في وجهكم يلعن ابوكم كس امكم يا منيوكين يا شراميط كل واحد يبلع لسانه وياكل خرا انتم حيوانات الله يلعنكم ياعيال الكلب مخآنيث تفو على الكس الي جابك إنت وياه واحط برج ايفيل بكس ام كل شيعي على زبي كلكم خوات شرموطة كلكم ولاد كلب العن ابوكم لا ابو شرفكم ودي انيكم واحد ورا الثاني مسوين زحمه العن ابوكم لابو من خلفكم يكلاب ياخره مص ولحس وأنيك اختك القحبه يقوآد يبن القوآويد والله أصلبك على زبي ياشيعي أبطح وانيك اهل بيتك ياولد الحرام العن ابوك ياخراعيري فيك والله لأفلت زبي بكس اختك يسرح ويمرح يا كلب كس امك ياشيعي يا منيوك كس امك ياولد الرخآص آخ آتفووو بنص طيز أمك تفو علي راس امك يا ولد القحبه يا ثور والله لو آشوفك أنيكك من دقنك أنت زبالة و الصرصار اللى فى الخرا أحسن من اللى جابك كس امك وكس اختك وكس اخت الي نفضك يا حمارتفوووووه علي كس أختكم العن أبو والدينكم على من جمعكم اخ اخ اخ اخ تفو تفو تفوتو على جهنم يولآد القحآب كس أخت اللي نفض الشيعه انيك امكم يا اولاد الشرموطه انعل ابوكم لابو الي جابكم يا كلاب ياخرةازق فوق رآس أبوك إنت وياه كس امكم عيري فمك العن ابو والدينك أنيك ولايآك أوطيك بجزمتي أوصلك للقاع ياخره يا خنيث ياابن الجراره يا منيوك ياشيعي منااااايك يا عيااال الشرموووطه اقسم بشرفي لو آمسك واحد فيكم لانيكه وانيك آهله بساعه وحده واشوف مراجلكم الكذابه كس خواتكم ياقحأب يأولد القحبه إنت وياه أنتم لستو سوى حشرآت في نظر مواطنين وأقل من حشرة في نظر أسيادكم أنتم طبقه زباله وصخه كآبسه على نفس الناس ذليلين فالمجمتمع عآر على ال أمه ال أسلاميه والعربيه العن ابوكم واحد ورا واحد ياكلاب وياولاد الكلاب مص زبي الله يلعن ابو من جابكم ياكلاب ياشيعه ياقوآدين انيك امكم فى طيزها الواسعه يا كس امها انا انيك امك يا ابن القحبه يا ابن الشرموطه ياشيعي رآح أنيك اجداد اجدادك والله انكم ماتسوون شي يا عيال الكلب والله لأنيك أمك يارافضي يانجس واخزق وابزق والزق في كس أختككول خرا وادحش عيري بكس اختك الله يلعن أبوك آتفوووو على طيزك كس امك على أبو امك على زبي تعال خذ كلس اختك من البيت يا خرنثه ياقواد ديووووووووووووووووث كس امك يا ابن القحبه انا اوريك ياخنيث ياشيعي ياكلب انيك اهلك وطوايفك كلهم يابن القحبة كس امك على كس أختك على زبي كل اللي تعرفهم اكبرهم و أصغرهم ياخنيث على رآس زبيييييييييي كس امك إنتى اخرتها راح تنيك نفسك آخ آتفوووؤؤؤءهـ على كل الروآفض خرا على هالاشكال المشوهة لاهم رجال ولاهم حريم تفو عليكم واحد واحد فروخ عيال كلب مخانيث العن الله ابو من جمعكم كلااااااااااااب كس خواتكم واحد واحدعلى زبييييي يلعن ابو شرفكم قحاب ولاد قحبات منآآآآآيك كس امكم كلكم ياولاد الكلب ابول على شرف اهلكم لابوكم لابو من جمعكم ياقحيب أتفوو على كس امكم لبوكم اكته فيكم قحاب مخآنيث كلكم على زبي يا عيال الكلب شرآميط ابناء المتعه ابناء ليله الطفيه يلعن شرف الشريف فيكم يا ولاد العاهرة خراي عليكم من اصغر ولد لاكبر جد ابول عليكم أتفو عليكمعير فيكم وعيرفي امهاتكم ادخل زبي في مكوتكم يامخانيث ياعيال القحاب اولاد المنيوكه يا انجاس تفووو عليكم وعلى اشكالكم الوصخه آتفووووووووووووووووووووووووووووكس ام الشيعه كلهم اولاد الزنا كس ام السيستاني الخنيث القوادكس ام الخميني كس ام مقتدى القذروكس امالحكيم على راس زبي كس ام الخوئي وكس ام الشيرازي وكس ام الكوراني وابول على دار الدعاره كربلاء النجسه وازق واشخ على النجف الانجس وكس امكم يا ابناء القحبه يا شيعه العن ابوكم لابو الي جابكم يا كلاب ياخرة<br />ياشيعي كس أم أم أم أمك العاهر ابن العاهره ابن الحرام ابن الشرموطه ابن القحبه ولد الخنزير ابن الزنة ابن المطلقه ابن اللقيطه ابن لرخيصه ابن القوآويد<br />ياشيعي<br />كس أمك ياكلب ياخرا يامنيوك العن ابوك الخرى انيك اختك من ورى توووف بنص طيز أمك يبن العاهره ياشيعي عيري فيك وعشره في اختك يا ابن السحااقيه يا ابن الوآطيه كس ام اللي جابت كس أمك ياقذر ياحمآر أتفوووو ياشيعي انيك اختك فوق صدرك وانيك امك على ظهر ابوك يا ابن الرقاصه وانيك خواتك واخوانك عيال المطلقه ابناء اللقيطه خرا على اهلك يا ولد الدعاره ياشيعي اتفوووو عليك يا منبع القذاره انته حثاله انته مرحاض كس امك بموجب القانون ماده رقم 160 انته ابن حرام وولد زنى وربى<br />انته انسان واطي ومنحط وسافل يا ابن الكلب يا اخو الخنيث انا بنيكك وبنيك اي انسان زباله وحثاله شرواك يا ابن القحبه ياشيعي ابول على شرف اهلك واتفل وأزق عليك انا عمك يا ابن زبي ياللي ما تسوى شي ياخرى أدخل رجلي في طيز أمك يا واطي يا ابن الواطيه<br />العن ابوك يبن الكلب تفوووووو عليك وعلى ابوك العور ابول عليك وعلى عينه العوره كس امك يا ابن الكلب ياشيعي أنيك ولآياك أوطيك بالجزمه أوصلك للقاع ياخره ياخنيث يامنيوك يأبن الجرآره تفو على شنبك وشنب ابوك أتفووو<br />خرا عليك وعلى اهلك يا ابن العاريه الجاريه بنت الظرووط ابول على رحم امك بنت الفاجره ياشيعي ابول على فصيلتك الخرىىى ابول على تاريخ اجدادك كسس امك يالقرد مدمن الزبوب ابن الستين الف قحبه ابن الصايعة بلآع الزب<br />مص ولحس وأنيك أختك القحبه خنيث مخنث ابن كلب ابول على امك يابن الكلب اهتك عرض اختك كس ام اللي جابة كس أمك خرا بشكلك الواطي تحت انعالي يا ابن الواطي اخ تفوو اقصاك حشره انته مصخره وابوك مزبله يالنجس يا ولد القحبه<br />والله لواشوفك لآفتح مكوتك بزبي ياخرا وأحط رجلي على رقبتك ياولد الكلب ياجرو ياخنيث يامنيوك مص زبي آتفو عليك وعلى آهلك ياشيعي والله انك حثاله اكل خراامك لا ابول على شرفك يا خرى وشرف عيلتك يا اخو منيوكه ابول على شجرة عائلتك يا حيوان كس اختك<br />انيك امك وانت تراقبلي يا اخو القحبه وربي لا ابول على ضمير ومعشر اهلك يا خرى ياشيعي تووووووف على رآس أمك كس اخت اصلك وفصلك وكس اخت نسبك وصخ يا اخو الارمله يا ابن المطلقه<br />أتفو على كس امك القحبه أتفو على كس امك يبن القحبه عيري بطيز أمك ياخنيث عيري بجهالك ياشيعي يا جحش ياابن حرام انت يا قواد امك قالتلي انها حصلتك يا خرى في مكان مكتوب عليه بلديه يا خرى كس اخت سلالت امك<br />كس امك يا حقير ازق على شعر راسك يا خرى يأخ منيوك امس مسوي حق زبي نعيمًا ممكن تمصلي يا خرى ياشيعي العن ابوك ياكلب ياخرا يا ابن حرام يا ابن ملاجأ يا ابن قواده سبااله يا ابن مصاصة الزبوب وربي لو امسكك لا اركبك زبي<br />ابول على فصيلتك يا خرىى ابول على تاريخ اجدادك كسس امك آووختفووووووؤؤؤءهـ ياشيعي كل خرا ابن قحبه ابن زبي كسس اخت شرف كسس ام طراطيش كسس اختك يأبن حرآم<br />كسس اختين امكك يا خرى انت واحد مشرد ابن متشرده ابن ليله الطفيه يإبن الشرموطه خنيث كس ام ابوك ابول عليه وابول علا شرف اجدادك ياشيعي خههخخهخهااتفوو على حنجرت ابوك خهخهخهاااتفووو على طوايفك ونسبك ومنبعك يا خرىىى ياشيعي كس امك يامخنث يابن الشرموطة امك شرموطة ياحيوان ياولد القحبة أتفووو الله يلعن ابوك ياشيعي وحياة كس أمك لازم امسح بكرامة اهلك المتناكين الارض كس امك يافرخ ياشيعي أتفو على شواربك لعنة الله عليك يالنجس تعال خلني الحسك نعالي ياولد القحبه ياشيعي يلعن ابوك ياخنيث يامنيوك مص زبي آتفو عليك وعلى آهلك ياشيعي لعنه الله على أبوك لاتزعجني في نيك أختك الصغيرة ياشيعي اختفوووووووووووووووووه عليك وعلى شرفك الله يلعن ابوك مدعوس عليك بالجزمة الأمريكيه ياشيعي كس امك أكل خرا الله يلعن ابوك منيوك عاهر اخو المنيوكة انته من اصل كلب كس اختك يا منيوك ياشيعي الله يلعن أبوك والله لآامسح الاراضي بشرفك يلعن شرفك ببلاش اناابي اهتك عرضك تراني اعجبك يابن الكلبه ياشيعي قوم إلبس سروالك يبن القحبه اعطيك بالجزمه على طيز أمك يآولد القحبه ياشيعي يأوصخ من مآتلد الكلآبو أختفووووووووووووووووووووووووووووووووو ابول على دار الدعاره كربلاء النجسه وازق واشخ على النجف الانجس وكس امكم يا ابناء القحبه يا شيعه العن ابوكم لابو الي جابكم يا كلاب ياخرة"
