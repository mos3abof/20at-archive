subject = "شيعيه حلووووووه"
text = "أرسل هذا التعليق بواسطة : شيعيه حلوووووووه والصدر تااااااافخ<br />آآه انا شيعيه اريد انتاك كوسي يحرقني ابي سني عنده زب كبير يدخله بأعماق رحمي ويبول فيه ويطفي ناره<br />نيكوني آه آه احب المتعه اعشقها تعالو مارسو معي اللواط احب اتناك من الخلف اريد حد يشق طيزي"
