author = "يا اخو الكحبة"
text = "أرسل هذا التعليق بواسطة : نياك اخت السنة<br />اختك يا بو الشيخة نايكهة من طيزهة<br />لا تحكي على<br />الشيعة<br />الشيعة<br />تاج راس السنة<br />يا اخوا المنيوكة<br />يا اخو العزراء"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

