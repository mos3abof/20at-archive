[[comments]]
order = 122
subject = "توقف الطخ على الشيعه الرجاء انا لا نسب"
text = "أرسل هذا التعليق بواسطة : مروان ابن عبد الملك<br />الشيعه سمعت الكلام وقفت الشتم وحنا السنه لازم نكون احسن منهم صح عيني في مناطق في النت تسب الرسول محمد ص وعلي وفاطمه وابوبكر والااسلام والعرب والا ايرانين وكل مسلم في الدنيا نتفق ونضع ايدينا في ايد بعض وارسل لكم العناوين تشوفها من يحب محمدص وائل البيت لايسب من الان وطالع الى علا الكفره المهره والله لا نثائر لل رسول الله والدين ال اسلامي اتفقنا ايد في ايد وانا من هذه الحضه اعتذر لل اخوان الشيعه على ما بدرا مني من سب انا اسف جدا جدافي موقع تقدر تنزله من النت اسمه بالتوك بعدما تحمله علا جهازك ادخل ميدل ايست ثماكرستانتي ستجد رومات تسب وتشتم ال اسلام السنه والشيعه وكل شي مسلم اذهبو وشاهدو ولا تقولو حرام او مو حرام ادخل ودافع اشتم تعرص نيك امهم فجرو الروم عليهم السنه الا اشاوس مطلعين الويل عليهم مجننين الكفره النصارى الي يسبو ويشتمو ."
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 123
subject = "الله يصلحكم .. أخواني الشيعة اتحدث بلغتكم التقية"
author = "ويوم الحساب ينتهي العتاب"
text = "أرسل هذا التعليق بواسطة : بوخالد<br />السلام عليكم ورحمة الله وبركاته ونبدأ بأسم الله ..<br />كل مايفعله المذهب الشيعي لا خص لي فيه فأنتم تحاسبون واما تدخلون الجنة او النار لا يوجد خيار ثالث ولكن الكنز الكنز هو ان تدخلو الجنة بفضل من الله وليس بالدعاء ( يا أبا الفضل ) .. وكان المفترض ان يضع ( يارحيم .. ياالله .. ياكريم) وهذا شرك بالله بأن يجعل مع الله شريك في الدعاء .. وهذه القضية.. واتمنى من الشيعة بأن يقرأو كتب السنة ويقرأو كتب الشيعة ويقارنون كما نحن اهل السنة نقرأ كتبكم ونقارن مابين الصح والخطأ .. هداكم الله وليس أبا الفضل .. فهو مكرم عن ما تفعلون وليس له ذنب بأن تجعلوه في مكانة الاله والعياذ بالله وان لم يكن هذا المقصد فها قد نبهتكم ومن يقرأ كلامي فقد علم والله المحاسب"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 124
subject = "ليش السب وانتو تقولو مسلمين"
text = "أرسل هذا التعليق بواسطة : بن علي<br />اخواني السنه ليش هاالكلام والتجريح في اخوانكم الشيعه ؟وانتو ياشيعه ماهذه أخلاكم وتعاليم دينكم الحنيف وتعاليم أئمتكم؟والله عيب على الجمع هاالكلام الوسخ ومايطلع الا من ناس ماهيه متربيه تربيه صحيحه بل ماخذه علمها من الشارع وهذا الكلام للجميع؟بعدين هاالي كتب أول تعليق هل هو مسلم؟وهل كلامه عدل حتى صرنا نهرول وراه ونكتب هذه التعاليق على الموضوع المطروح أعلاه بعدين المفروض على القائمين على هذا المنتدى ان يجدو المواضيع الجيده التي تجذب الناس لهم وليس تفرقهم وتحياتي لكل شخص كتب لتوحيد الصف لا لتفريقه"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

