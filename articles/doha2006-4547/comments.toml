subject = "شيعي (( رافضي ))"
author = "اللهم انصر انصار السنه"
text = "أرسل هذا التعليق بواسطة : ناصر الرسول صلى الله عليه وسلم<br />لا تقولون شيعه بل هم روافض رافضيين يعني الشيعي رافضي واذا قلتوا لهم شيعي يفرحون بهذا الاسم لاكن قولوا لهم روافض او رافضي عبده القبور اللي يرخصون اعراضهم للسيدهم ويكرمون اسيادهم ببناتهم واعراضهم !! عجبنا لهم<br />(( لعنت الله على الرافضين ))"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 94
subject = "ناصر السنة"
text = "أرسل هذا التعليق بواسطة : ناصر الرسول صلى الله عليه وسلم<br />من على حق<br />أرسل هذا التعليق بواسطة : احله كدبه<br />السلام على من اتبع الهدى وبعد السب من عادة الجهل ولاتردو على السفيه جواب ولكن الشيعه على حق ونحن نعلم ابنا السنه ولكن نكابر على انفسنالانه الرسول ص اوصه الامام على على ولاية المسلمين من بعده ونحن السنه اتبعناهوا انفسنا ومن اتبعنا امثال عمر وعبد الملك ابن مروان ولايه صريحه في حق اهل بيت النبي اديقول بسم الله الرحمن الرحيم انما يريد الله ليدهب عنكم الرجس اهل البيت ويطهركم تطهيرا ومن هم اهل بيت النبي اهي الزهراء ع ام الامام علي ع ام الحسن والحسين سيدا شباب اهل الجنه هل يعقل سيدا شباب الجنه ليسا على الحق طبعا لا<br />أيعقل كلامك هذا ؟؟<br />الروافض يقولون ام الوحى أتى محمد صلى الله عليه وسلم بلغلط وانه مُرسل لعلى رضى الله عنه ويلعنون ابو بكر رضى الله عنه و يسبون عائشه أم المؤمنين رضى الله عنها الروافض يرخضون أعراضهم لسيدهم اهذا حق ؟؟ عجبنا لك<br />الروافض رفضوا بما انزل على محمد عليه افضل الصلاة وأتم التسليم<br />الروافض ليسوا على حق وأسئلوا علماء المسلمين في المملكة العربية السعودية<br />أمثال : الشيخ / عبدالله بن جبرين أطال الله عمره ووفقه في الدنيا والاخرة"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

