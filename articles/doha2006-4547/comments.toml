subject = "لا تقل الشيعه تاج رأسنا بل حل عنا تعرف تفك عنا"
text = "أرسل هذا التعليق بواسطة : مروان ابن عبد الملك<br />ما راح اسب على الشيعه والى على عماد مغنيه والى على الكلب مقتدى والله والله يا اما الشيعه تتوعى وتصحى وتشوف كيف في النت والبالتوك روم النصارى كيف يسبون الرسول ص وعلي وابوبكر وكل الصحابه ويساعدونا كيف -الشيعه تحل عن السنه فقط وحنى ندبر حالنا ونعرف نتصرف مع النصارى لاكن اذا لم تحلو عنا وتتركونا ارجع وارجع بمسبات تفجعكم تفجع الشيعه واترك النصارى وارجع ليكم راجعه ما فيه ندم الكلام واضح وصريح يا اما نتصدى للنصارى يا نرجع لبعض والخيار عند اخواني الشيعه"
archived = "2008-03-12"
capture_url = "https://web.archive.org/web/20080312154744/http://doha2006.20at.com:80/article.php?sid=4547"

