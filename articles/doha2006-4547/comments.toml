subject = "انا راجعت فعلا فيه روافس يعبدون الرب علي"
text = "أرسل هذا التعليق بواسطة : جزع نعل سني اشرف واطهر من مليون روافس<br />من ابن العاهره الماهره ابن ليلة الطفيةالذي سب اسياده من 0 ياعيال القحبه يااللي تسبون الشيعه لعنه على امكم ولد المسيار والمسافر وارضاع الكبير ياعيال الخطيه ..0 لعنه على امك على عدد الازبار التي دخلت كس امك الشعيه ضرب متوسط طول الزب المريكي على عدد ايام السنه الهجريه مقسومه في السنه الميلادية اذا امك سمحت لي واحد ابن عاهره ماهره يدوس على طرف سني انيك خواتك الصغار قبل الكبار وانيك المهدي المنتظر مالتكم وانيك كل الذين في الصحن الحيدري والعن طعارص بعابيص طيز ام المهدي المنتظر واسمع اخلي للك مسبه اوريك العجب يا روافض وساعود وراح اخليل بجد تزعل وانت حر ."
archived = "2008-12-23"
