order = 95
subject = "يا ابا طيزي مقتدى مقتدى مقتدى طنجره"
text = "أرسل هذا التعليق بواسطة : جلد نعل نجس اطهر مليون مره من ابنا المتعه<br />يابا هلا عمي 1ليس نحن الذي يكره الشيعه اكثر من اليهود2ليس نحن من يدافع عن امريكا في العراق 3 وليسى نحن من يكفرالشيعه وانتم تكفروننا4 لمذا لا تهدو النصار الى الا اسلام مثلنى لماذا تهدوننانحن انحن اكفر من اليهود والنصار 5نحن لم نقل الشيطان الاكبر مسموح في دخول الواطن العربي الشيطان الاكبر ههههههههه زبي يا ابنا التعه الفجره وفي لبنان الامريكن مشكله لاكن العراق لا تفصلون على كيفكم 6 القراءن ناقص ايتين ها 7علي ظرب عزرائيل كف 8الشيخ احمد ياسين مات كافر والسنه كلهم كفره اقل لكم يا ابناء العهر والزندقه كفو عنا واتركوننا ليس لكم عندنا شيء ياعبدة القبور والزبور يابنا الفجره العهره وعندم تحلونا عنا وتعفو عنا سنحاسبكم الحساب العسير وان لم تحلو عنى سنحاسبكم مرتين شنشنقكم من خصواتكم يا جواسيس سجل يا تاريخ من وقف مع امريكا ومن لم يقف افتخرو الان انكم امريكان ي مقتداكو ويا عباسكو ماركوس ويا زوزو بو الفضل زبي عاهيك شعب حقير مابستحي ويا اخي نجرب اول المتعه الي عندكم تمتعونا واذا قتنعنا بهاقد نصبح روافض مثلكم يا مقتدى الزب والسكساني مويزك امريكاني لاتنسا تلبس البكيني لامك واخواتك ودلعهن سوسو وفوفو وهن على شاطي البحر بس لا ظل تقول الشيطان الااكبر عيب يسمعك بوش مش كويس بعدين الجيش المريكي يمتنع يتمتع في خواتكو في العراق وظلكو اتجسسو على الشجعان المجاهدين السنة في العراق وبس تخلصو اهدونا لى الا ادين الشيعي عشان نصير خون مثلكم ونصير احنا وبش حبيب مش هيك تريدون يا كفره علي منكم بريء عريتو علي رظي الله عنه والله انه مستحي منكو ومن افعالكم توطو الرأس تفو عليكم تفو خاص لي مقتدى الكلب واقول له هاي هاي تروح دانس مع اختك هاي شيعه مفخرة امريكى"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 96
subject = "لم يوصي الرسول (ص) علي( رضي) في الولايه"
text = "أرسل هذا التعليق بواسطة : مقتدى (نيو لوك) الكلب المريكي<br />سمعت شيخ من قوم الجربه يعاتب النبى ص لانه لم يسلم الولايه لي علي وكان يقول ( اكو في الماكنه خرفشه) وهات ايه في القرأن تقول الوليه لى على بعد موت الرسول ص ولماذا الله كانت له حكمه في انا محمد )ص( لم يكن له ولد او اولادانه رسول بلغ الاقاصي والاداني والعربي والغير عربي الدين ليس لى احد الدين للكل يا مقتدى الكلب"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

