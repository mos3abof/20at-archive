subject = "وحدة إسلامية"
author = "أخوكم أحمد صفي الدين"
text = "أرسل هذا التعليق بواسطة : أحمد صفي الدين<br />الحمد لله أن جعلنا مسلمين ألسنا نشهد أن لا إله إل الله محمد رسول الله أليس لنا كتاب واحد هو القرآن الكريم<br />ألسنا جميعا سنة وشيعة نحب آل البيت ونجلهم ونقدرهم فصلاة الواحد منا لاتتم إلا إن صلى عليهم لماذا الإختلاف أنا مسلم صحيح أني سني ولكني والله أحب آل البيت حتى أن أسماء أولادي زهراء والحسن ومحمد وزينب<br />تذكروا أن لدينا هموما أكبر"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

