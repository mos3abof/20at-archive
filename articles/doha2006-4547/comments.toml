[[comments]]
order = 127
subject = "ضع عنوان التعليق"
text = "أرسل هذا التعليق بواسطة : اكتب اسمك هنا<br />ياعيال القحبه يااللي تسبون الشيعه لعنه على امكم ولد المسيار والمسافر وارضاع الكبير ياعيال الخطيه ..<br />كس اخت كل واحد بن قحبه يسب الشيعه هذا لانه نغل ولد نغل وامه تتناج في الفنادق ياعيال القحبه اكلو خرى وبسكم شخابيط في الكمبيوتر واللي يكره الشيعه يسوي شي فيهم اذا في امه خير اكيد في كل محل يعيشون وياكم روح ومد يدك وشوف ينيج قبلت اهلك كلها لو لا ياولد القحبه ابو شخه النجس وعمر وباقي ربعه المخاثيث ياابطال الكبيورد طلعو برى للننعل ام امكم ياعيال السفله خفووووووووووووووووووووو عليكم يارجل ولا رجال"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 128
subject = "أسنغفر الله"
text = "أرسل هذا التعليق بواسطة : مسلم لاشيعي ولا سني مسلم فقط<br />يا أمة سخرت من جهلها الأمم أما آن لكم أن تستفيقوا على حضارتكم التي باتت في الحضيض<br />عذراً رسول الله صلى الله عليه وسلم<br />عذراً إمامي علي كرم الله وجهك<br />ترفعوا عن هكذا ألفاظ واقتدوا بمن تدعون أنكم تتبعوه سواء أنتم من أتباع نبينا محمد عليه الصلاة والسلام أم من أبتاع الامام علي كرم الله وجهه"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 129
subject = "الحقيقة"
text = "أرسل هذا التعليق بواسطة : صباح عبدالله<br />والله ماكو اسلام كلة اتفكر بالنيج مهما كان والسنة والشيعة مختلفون ولا يتراهمن للابد واحد مشرق واحد مغرب وعلى اللهالمطاليع الله يستر"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 130
subject = "كوسكوسي"
text = "أرسل هذا التعليق بواسطة : شيعي<br />انا شيعي مطمبز واستنى الي يجي يبحش إيرو ابتيزي<br />حتى لو كلب او حمار مش مشكله<br />انا كمان عندي شقة دعاره بقود على بنات السيد كاظم<br />واللي يبي ينيج يدفع مقدما<br />ملاحظة:مانقبل شيكات والعنوان:حسينية المهدي المنتظر"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 131
subject = "متخلفين"
author = "و احدروا من الفتنة"
text = "أرسل هذا التعليق بواسطة : مسلم<br />كيف تشتمون بعضكم وانتو كنتو عايشين مع بعظكم<br />في ناس من مصلحتها ان تخلق الفتنه ما بين<br />المسلمين وانتو يا جهله تتحدون الا تتحدوا<br />يا متخلفين يا حتلات مجتمعاتكم<br />اعطو الشيعه الفرصه في الحكم و تصحيح نضرة<br />الناس في المذهب الجعفري<br />واصنعوا شيآ فيه خير للعرب بدلا من السبّ<br />و احدروا من الفتنة<br />و احدروا من الفتنة<br />و احدروا من الفتنة<br />و احدروا من الفتنة<br />و احدروا من الفتنة<br />و احدروا من الفتنة<br />و احدروا من الفتنة"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 132
subject = "صاحب الموقع والمسؤل"
text = "أرسل هذا التعليق بواسطة : لعنة الله<br />مين الكلب المسؤل عن موقع كهذا ؟؟<br />ليسمح لشرازم من هنا وهناك تسب وتلعن كما تشاء دون استحياء لدين او ملة ؟<br />بعد ما كتبت آية قرآنية تحث العابثين رجعت وحذفتها لان مكان القرآن اسمى واعظم من مكان قذر كهذا<br />لعنة الله على من نشر وسب ولعن وساعد على ذلك"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

