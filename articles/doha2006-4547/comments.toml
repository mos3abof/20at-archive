subject = "كــس أم أم أم الشيعه المنايكه"
text = "أرسل هذا التعليق بواسطة : نايك الشيعه<br />اولاً وليس أخراً:<-- طلع عيره<br />يا (روافظ) ياشراميط يامعرسين يامخانيث<br />كــس أمـك كلكم من اولكم لأخركم من كبيركم الي صغيركم<br />من الذكر فيكم الـ الاأنثي ياقحااااب ياكواوله ياقواويد ياعواهر يازواني ياشراميط الخميني والسكستناني والخوئي ومقتدي الطـيز ابن الطيــز ابن المنيووكه من طيزها وخرج هو من فتحة شرجها القذر الي خرج منها كل شيعي معرس منيوك لحد الخصوه يعني وصلت فيكم الدعاره والشرمطه تقدمون بناتكم وخواتكم وحريمكم للسيد ينيكهم ياديوثين وينيك الاخ اخته والاب بنته وين الرجوله بالله انتم رجال انتم مسملين؟ خسئتم يااشباه الاوادم الي الان ماعمري شفت شيعي يعلق على هالنقطه لي مو داري؟ تسبون ع الفاظي ماعندكم لسان تردون فيه ياقحااب الامريكان خررري عليكم ياعيال الـ(ستين مليون قحبـه ) هاهاها"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

