text = "أرسل هذا التعليق بواسطة : مروان البريشي<br />مثل ماتسب عالخلفا ْالراشدين وعائشة هذ ا رد ي علي خنث فاطم الزهرا مالتكم وا ليست مالتنا وطلع زبة علا العسكري والا منيك المنتضر وكس اخت الحسن والحسين مالتكم ولسياد الماخانيث"
archived = "2008-02-09"
