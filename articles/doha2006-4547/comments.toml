subject = "الى عرض مغري ومدمر الراقضه"
text = "أرسل هذا التعليق بواسطة : جلد نعل سني اطهر من مليون رافضي<br />يا ابن العاهره الماهره انا حذرتكم ونبهت لاكن الروافس وما ادراك ما روافس احب انيك المهدي المنتظر الوطي ال واطي ليه لانه منتاك منتاك دخل السرداب في طيز المهدي الالم ما تحمله ارسله الى الروافس ولان الروفس يضريون انفسهم لماذا من شدة الالم طيز المهدي المنتظر تولم السوداب طويل ممتع لاكنه مولم المحنه المحته اتعضو تعلمو تفقهو انضرو الى طيز والام المهدي المنتظزر.يا كبدي على طيز المهدي الخرا بلاع العيوره الواطي الا لوطي يا روافس انصرو طيز المهدي ابن الشرموطه العاهره الماهرهى عودو اهبو وانصرو طيز الرب علي مالتهم لاتنشورو الواط يكفي ما حل في طيز الرب الكهدي المنتظر والرب علي والرب لولو الزهراء ليسى الرب الذي الله هو الذي يرسل القرأن بل لولو مالت الروافس العواهر اذا اردتم المزيد انا جاهز عندي من المسابات الكثير مروان ابن عبد المللك انا اتابعكم يا ابناء ليلة الطفية ساعود بمسابات لي علي والزهراء مالتكم وليست مالتنا"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 143
subject = "رد على نياك الوهبية"
text = "أرسل هذا التعليق بواسطة : جلد نعل سني اطهر من مليون رافضي<br />لا هاذا الي ما حد يسب عليه انا اسب عليه فقط والى سني يتدخل فيها. انا احب كس الزهراء فاطمه المنتاكه العاهره الماهره التي كانت تمص زب علي في ليلة الطفيه لاكن ويش يعرفكم في موصفات العاهره الزهراء سلام الله عليها كانت كل يوم تحب الزب العربي تحب زب الرب علي يقال في قرأن فاطمه الزهراء العاهره انها تحب الزب السني رد على الخ ابن العاهره الرافسي لم والان يعرف ماذا فعل بسب علي شخصيا متناسيا اني سني ويمنع السب على السنه لم انهي الي عوده يا ههههاي نياك اختك مو الوهابيه يتبع في الحلقه القادمه ."
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

