subject = "ياء الصحاب العقول الرفيعه"
author = "واصواب الحق هو القران الكريم"
text = "أرسل هذا التعليق بواسطة : ابو انس (سلطان النور )<br />يأ اخوان حنا ء أهل<br />ينبغي ان تحترم الموقع<br />وينبغي ان تختار أحسن الكلام<br />من يريد الحق يذيقرأ القران الكريم ويفتح مخه زين<br />والله العظيم<br />أن فيه أيات<br />قبل ايام ارسول محمد صلى الله علية وسلم أخبرناء<br />عن كل مايحمي الأنسان من كل جهه<br />ولكن ينبغي يأ عقلا<br />أن نتدبر في القران<br />وانا لا يهمني من أستهزء بنبينا محمد صلى الله عليه وسلم<br />لأنني واثق كل ثقه بأن الله اخبرنا في القران الكريم<br />أنا كفيناك المستهزأين<br />وانا أتساءل لو انا شيعي وقال لي اسيد لا تتبع كذا أو كذا ولا تتبع علماء السنه ولا تسألهم<br />يا اخوان<br />ياحبايبنا ايها الشيعه ( الرافضة )المحترمين<br />شغلو عقولكم<br />الله خلق الأنسان وجعل له عقل وشهوه<br />وخلق الله الملأكه وجعل لهم عقل فقط<br />وخلق الله الحيوانات وجعل لهاشهوه فقط<br />فسبحان الله الذي اكرم الأنسان وجعل له عقل يتفكر به<br />كيف اقدم بنتي أو زوجتي او اختي لسيد<br />هل هو خالي من الأمراض<br />الله يحمينا من الأمراض اذا اتبعنا القران الكريم واسنة<br />ام اسنه تعلم ان العالم رباني حقاء<br />انه يكون صادق وتجد المسأله عنده وعند غيره نفس الجواب ( الدليل من القران الكريم )<br />احببت ان اشارك الأمه بماء استطيع<br />اللهم أحمي بلادنا من الفتن<br />اخوكم سلمان ابو انس<br />frygdهو الهتميل<br />أن اخطأت فمن نفسي والشيطان وان الصبت فمنك وحدك يا الله الهم وفقك كل من ارد الحق والصواب<br />انا انسان لي الحريه ولي أن اخذ الذي أراه صواب"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052622/http://doha2006.20at.com:80/article.php?sid=4547"

