text = "أرسل هذا التعليق بواسطة : من عربي غيور<br />ياحيف عليكم يا عرب قاعدين بتسبو بعض شيعا وسنا انتو شو بتعرفو من اسلامكم لحتا تغارو عليه مو عيب الاسلام شيعا وسنا بيرضا نسب بعض السب بي السلام حرام السلام دين تسامح الي سب التاني يستغفر لا اخوه المسلم واله يرحمنا ويخلصنا من هل خلافات ويارب لا تسامح المشايخ الي مشراضين يحلو هل خلافات وقاعدين بغزو نهر الدم بي العراق"
