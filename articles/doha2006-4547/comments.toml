text = "أرسل هذا التعليق بواسطة : نياج مقتدى العريض حيل مهور<br />اول ماقول احنة اخوان سنة وشيعة وسلام الله عالى اهل البيت الاطهار فانما هاذ الينيج ابو جيش الوردي الله راح ايخالي بطيزة بركان من نار عالمود تفوخ دودة مالتةاليتزعم الدين وكالمن يمشي وراة تبرت منة الشيعة اليوم القيامة ويطلع ينيج مثالة ترة صير بي دودة الي يمشي وراة ويكوم ينطي فوك طيزة فلوس دير بالكم وسلامي الى اخواني السنة والشيعة الطيبين"
