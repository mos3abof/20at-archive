text = "أرسل هذا التعليق بواسطة : ممحـــــونة سنيـــــــــــــة<br />كسي مولع نار ممكن تطفوهة انا احب النيك من الطيز ومن الكس واحب تلحسولي اريد زب طويل وعريض اذا تريدون تشوفو صوري انضرو لصور ابن لادن فانا اخته<br />سعر النيكة الواحدة 1 دولار انارخيصة لان اريد افرح الماطنين<br />الي يريد يراسلني عنواني هو (ديوان الوقف السني )<br />نقبل الشيكات وحتى لو ماعدكم فلوس مو مشكلة بالآجل<br />واذا واحد ماعندة يخليهة على حسابنة وله الاجر والثواب"
