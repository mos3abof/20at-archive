[[comments]]
order = 80
subject = "يا أبناء الزنا"
text = "أرسل هذا التعليق بواسطة : صدام عمر صدام عمر صدام عمرصام عمر صدام<br />لاتأسفن على غدرالزمان لطالما رقصت على جثث الأسودكـلاب.<br />لاتحسبن برقصها تعلوا على أسيادها تبقى الأسود أسود والكلاب كلاب.<br />شنقوك غدراَ في صبيحة عيدنا لم يعلموا أن المنايا من الأسود تهاب.<br />غادرتنا جسداً وروحك باقية تسمو إلى العلياء بغير حجاب.<br />نطق الشهادة ثلاث مرات عظام قبل الرحيل إلى العزيز الواحد التواب.<br />إنا ظلمناك جميعاَ ولم نعي بأنك في ظلمة الآفاق كنت شهاب.<br />صدام ياصدام لاتعتب علينا فإننا قما نصلي عليك حضورنا وغياب.<br />نرجو الإله أن تكون قد إلتقيت في جنة الفردوس بالأحباب.<br />ونزلت فيها كمارجوت مكرما في زمرة الشهداء بغير حساب.<br />ياشيعة الأنجاس ياأبناالزنا والمتعة يامن لهم في كل دار خراب.<br />ياشيعة الأنجاس ياأبنا الزنا والمتعة فيكم ومنكم ضاعت الأنساب.<br />زرعوا الشقاق بين أبناء العروبة وللفتن قد عينوا العراب.<br />الخاميني إبن متعة ومثله من قد نفق(الخميني) والمالكي إبن زنوه كما حكيم عمامة لغراب.<br />لاتأمنوا شر الكريم إذا أهين ياأحقر الحقراء<br />ياأذناب.<br />ياأهل يعرب عراقنا ينزف دما وأهله في دارهم قد أصبحوا أغراب.<br />ياأهل يعرب حان وقت سيوفكم للثأر منهم والدماء تنساب.<br />قوموا هلموا وإسحقوهم كلهم هاقد عرفتم من هو<br />الكذاب.<br />لاتستكينوا وأنتم أحفاذ لمن خضعت لهم قبل الرؤس رقـاب.<br />لاتأسفن على غدر الزمان لطالما رقصت على جثث الأسود كلاب.<br />لاتحسبن برقصها تعلوا على أسيادها تبقى الأسود أسود والكلاب كلاب."
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 81
subject = "رد علا طيزي ونفتخر مقتدى مقتدى مقتدى اضرط"
text = "أرسل هذا التعليق بواسطة : مروان البريشي<br />لاهم المناويك بجاهدو والا تاركين الا اشاوس يقاتلو قاتل الله الشيعه الفجر لا لهم مبدى والا دين اما يعبدون النار اويرفعون قيمة علي ابن ابي طالب منهم بريءوانا احب في هذه الساعه المباركه ان اوءهني وابارك للكلب السستاني اطال الله في عمر بنته المصونه القحبه بحيث اذا وافق السكستاني ان ازني فيها بدل المتعه فهيى موضه قديمه واكمل نصف طيزي الشيعي وادخل الجنه بارك الشيطان لك وحماك ووسع فروج الشيعه عند الخ العلامهمقتى مقتدى مقتدى مقتدى الكلب اريد الفروج العواهر الشيعه جميعهم حتى بنات ال علوين في سوريا لي توزيعهم علا شباب السنه الطهار"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 82
subject = "لا يامسلمين"
text = "أرسل هذا التعليق بواسطة : سعودي<br />يامسلمين الشتم مو من اداب المسلم ولا تركب نفسك ذمب يامسلم سني كنت ولا شيعي كلكم مسلمين من صح من غلط ماحد يعرف الى رب العالمين اخواني الشباب الي شتم احدى الصحابه اقولك هذي ماهي اخلاق مسلم للاسف انت تعكس صوره سيئه عن الاسلام والمسلمين .<br />الله يهديكم وتكبروا عقولكم عندنا قضايا اهم لازم نفكر فيها يااخوان اليوم ماهو يوم الخلاف اليوم يوم اتحاد العرب والمسلمين بجميع طوائفهم حتى نكون قوه لا تنزهم والله يهدي النفوس ويهديكم قولي امين<br />واذكروا الله وصلوا على نبي الامه فكلكم مسلمين"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 83
subject = "لا يامسلمين"
text = "أرسل هذا التعليق بواسطة : سعودي<br />كفاكم ايها المسلمين سب وشتم في الاعراض وصحابه رسول الله (ص) وال بيت رسول الله فمن منكم يصل لمنازلهم ومن منكم يتبعهم ويتبع رسول الله (ص) سنه او شيعه يسبو بعضهم بعض بكلام ماهو الا عارا عليكم<br />من منكم يتبع رسول الله (ص) من منكم يعبدالله سبحانه وتعالى اتقوا الله يامسلمين واذكروا الله وتركو عنكم السب والشتم وصلوا على نبي الامه خير من كل الكلام<br />اللهم اهدي كل المسلمين وغفر لهم ياكريم ياغفار"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
