cha ya maniouk ya jabane<br />أبلغ عن هذا التعليق<br />الشيعة تاج على راسكم<br />أرسل هذا التعليق بواسطة : شيعي وافتخر<br />الشيعة تاج راسكم كلكم وايران افضل دوله بالعالم يكفي انها دولة اسلامية وتلتزم بالحجاب اين الدول الباقية والخليج الفساد العام به<br />أبلغ عن هذا التعليق<br />الف مبروووك<br />أرسل هذا التعليق بواسطة : اغتصب شييعيه تدخل الجنه<br />ابارك للأخوه اغتيال العاهر ابن العاهره الرافضي ابن الحرام عماد مغنيه ابن الشرموطه ابن القحبه ولد الخنزير وان شاء الله مثواه نار جهنم فحم الله ثراه<br />أبلغ عن هذا التعليق<br />و أنا أيضاً أبارك إغتيال إبن المنيوكة عماد مغنية<br />أرسل هذا التعليق بواسطة : عــــمـــر<br />كس أم عماد مغنية على أم كل واحد مشى بجنازة هذا المنيوك المجرم الإرهابي كس أمه شرموطة على أم كل شيعي على زبي .. يلعن تعريص أم حسن نصر اللات وكل الي يحبوه من الشيعة الأنذال عابدين القبور .. المخانيث عبادين كساس أم الخميني<br />أبلغ عن هذا التعليق<br />يا شيعه يا زبالة العالم<br />أرسل هذا التعليق بواسطة : معا لعالم خالي من الشيعة<br />كس ام الشيعة بزبي خوات المنيوكه<br />أبلغ عن هذا التعليق<br />لا تقل الشيعه تاج رأسنا بل حل عنا تعرف تفك عنا<br />أرسل هذا التعليق بواسطة : مروان ابن عبد الملك<br />ما راح اسب على الشيعه والى على عماد مغنيه والى على الكلب مقتدى والله والله يا اما الشيعه تتوعى وتصحى وتشوف كيف في النت والبالتوك روم النصارى كيف يسبون الرسول ص وعلي وابوبكر وكل الصحابه ويساعدونا كيف -الشيعه تحل عن السنه فقط وحنى ندبر حالنا ونعرف نتصرف مع النصارى لاكن اذا لم تحلو عنا وتتركونا ارجع وارجع بمسبات تفجعكم تفجع الشيعه واترك النصارى وارجع ليكم راجعه ما فيه ندم الكلام واضح وصريح يا اما نتصدى للنصارى يا نرجع لبعض والخيار عند اخواني الشيعه<br />أبلغ عن هذا التعليق<br />العراق مالتنة<br />أرسل هذا التعليق بواسطة : الايراني<br />الحمدلله والشكر اللي كدرنا نفرق بيناتكم ياعراقيين يامناويك وان شاء الله العراق راح يصير مدينة من مدن ايران الحلوة واني ما اكره السنة لان شيعي بس اني اكره العراقيين كلهم لان اني ايراني.تحياتي لمدينة ايران الجديدة<br />أبلغ عن هذا التعليق<br />أبو عبدو الصاخوري<br />أرسل هذا التعليق بواسطة : أبو عبدو الصاخوري<br />كس أمو بإيري كل شي بسب السنة والشيعة وأبو حافظ وأبوه رحمه الله ولك منايك الشعب عبيتقتل بفلسطين وأنتوا متل أيري عمرو ما حط عقلوا براسوا.<br />أبلغ عن هذا التعليق<br />إنتوا مسلمين ؟إنتتوا محبين للرسول (ص)؟<br />أرسل هذا التعليق بواسطة : أنا مسلم وبس<br />سني ولا شيعي الإثنين يذكرون كلمة الله إذا هذا كلامكم وين محبتنا و احترامنا الله وللرسول(ص)والله عيب عيب عليكم وصلت يأهل العرب والمسلمين فيكم السب والقذف<br />وتسمون بأعماركم مسلمين كل من سب الرسول(ص) وأهل بيته الأطهار و أصحابه كأنه سب الله خافوا ربكم انتوا مسلمين كونوا قد هالكلمه مسلم كل اللي غلطو واللي سب بنظري هذا يهودي كافر وياويلك من عقاب الله..حسبنا و نعم الوكيل فيكم ياعرب يللي ينقال عنكم مسلمين سيدي ورسولي(ص) بريئ منكم يا......مسلمين.<br />أبلغ عن هذا التعليق<br />نثغ<br />أرسل هذا التعليق بواسطة : شهم<br />وين<br />أبلغ عن هذا التعليق<br />ياء الصحاب العقول الرفيعه<br />أرسل هذا التعليق بواسطة : ابو انس (سلطان النور )<br />يأ اخوان حنا ء أهل<br />ينبغي ان تحترم الموقع<br />وينبغي ان تختار أحسن الكلام<br />من يريد الحق يذيقرأ القران الكريم ويفتح مخه زين<br />والله العظيم<br />أن فيه أيات<br />قبل ايام ارسول محمد صلى الله علية وسلم أخبرناء<br />عن كل مايحمي الأنسان من كل جهه<br />ولكن ينبغي يأ عقلا<br />أن نتدبر في القران<br />وانا لا يهمني من أستهزء بنبينا محمد صلى الله عليه وسلم<br />لأنني واثق كل ثقه بأن الله اخبرنا في القران الكريم<br />أنا كفيناك المستهزأين<br />وانا أتساءل لو انا شيعي وقال لي اسيد لا تتبع كذا أو كذا ولا تتبع علماء السنه ولا تسألهم<br />يا اخوان<br />ياحبايبنا ايها الشيعه ( الرافضة )المحترمين<br />شغلو عقولكم<br />الله خلق الأنسان وجعل له عقل وشهوه<br />وخلق الله الملأكه وجعل لهم عقل فقط<br />وخلق الله الحيوانات وجعل لهاشهوه فقط<br />فسبحان الله الذي اكرم الأنسان وجعل له عقل يتفكر به<br />كيف اقدم بنتي أو زوجتي او اختي لسيد<br />هل هو خالي من الأمراض<br />الله يحمينا من الأمراض اذا اتبعنا القران الكريم واسنة<br />ام اسنه تعلم ان العالم رباني حقاء<br />انه يكون صادق وتجد المسأله عنده وعند غيره نفس الجواب ( الدليل من القران الكريم )<br />احببت ان اشارك الأمه بماء استطيع<br />اللهم أحمي بلادنا من الفتن<br />اخوكم سلمان ابو انس<br />frygdهو الهتميل<br />أن اخطأت فمن نفسي والشيطان وان الصبت فمنك وحدك يا الله الهم وفقك كل من ارد الحق والصواب<br />انا انسان لي الحريه ولي أن اخذ الذي أراه صواب<br />واصواب الحق هو القران الكريم<br />أبلغ عن هذا التعليق<br />أرسل هذا التعليق بواسطة : اكتب اسمك هنا<br />ياويلكم من الله يا الشيعيه تسبون صاحب الرسول عليه السلام الله يهلكم ويشتت شملكم 0<br />أبلغ عن هذا التعليق<br />خافوا ربكم يالشيعه<br />أرسل هذا التعليق بواسطة : ريم الغامدي<br />انتوا جاهلين ومتخلفين اصحوا من غفلتكم لن ينفعكم ماانتم عليه سوف تعضون اصابعكم من الندم بتموتون ونموت ونتقابل عند الملك الديان<br />أبلغ عن هذا التعليق<br />كــس أم أم أم الشيعه المنايكه<br />أرسل هذا التعليق بواسطة : نايك اكبر شيعي"
