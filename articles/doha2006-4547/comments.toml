author = "اولاً وليس أخراً:"
text = "أرسل هذا التعليق بواسطة : اكتب اسمك هنا<br />Version 1.5<br />5‏ آلاف فلسطيني عبروا من رفح خلال يومين<br />ضع عنوان التعليق :: المزيد<br />الاسم<br />العنوان<br />قول كلمتك<br />اجعل ولاد البلد صفحتك الرئيسية<br />أضفها إلى مفضلتك<br />هتصلى التراويح فين؟<br />الإخوان – الوطني .. حرب الشنطة!<br />الأهلي الثالث عربيا والزمالك الخامس<br />الجيش يحرس الإخوان<br />النائب العام يقرر حبس طلعت مصطفى<br />بحبك رغم أنف رمضان !!<br />ثم تمتم: مفيش فايدة!<br />رأيته وهو جالس على القهوة كعادته.. يحتسي كوب القهوة السادة<br />• قانون (معاداة الأهلوية)!<br />• على صفيح ساخن.. في العباسية!<br />• مسروق من الجزيرة!<br />(يا أبا الفضل) ... شعار ديني؟!!<br />عشرينات – الدوحة 2006<br />يصعد حسين رضا زاده إلى المنصة، يملأ يديه بالبودرة... ثم ينحني ليرفع الأثقال التي وضعت له... وهوووب .. يرتفع إلى أعلى.. وترى معه تلك الجملة التي كتبت على زيه الرياضي .. \\\\\\\\\\\\\\\"يا أبا الفضل\\\\\\\\\\\\\\\"..!!<br />ثم ينزل الأثقال وتعلن نتيجته وينزل من على المنصة، ويأتي اللاعب الذي يليه، وهكذا...<br />ولكن هل كان حسين زاده يعرف أن اللجنة الأوليمبية الإيرانية سوف تتلقى إنذاراً بسبب ما كتب على زيه؟!!<br />العقاب على وزن الذنب؟!<br />وقد قال حسين مسلم، مدير عام المجلس الأوليمبي في مؤتمر صحفي : \\\\\\\\\\\\\\\"لقد وجه المجلس الأوليمبي الآسيوي رسالة تحذير إلى اللجنة الأولمبية الإيرانية بعد ارتداء أحد رباعيها قميصاً كتب عليه شعار ديني\\\\\\\\\\\\\\\".<br />وكان الرباع الإيراني حسين رضا زاده قد أحرز الأربعاء الماضي الميدالية الذهبية لوزن فوق 105 كجم رافعا 425 كجم (195 خطفاً و230 نتراً).<br />وأوضح مسلم بأنه تم إخطار اللجنة الأوليمبية الإيرانية بأنه سيتم استبعاد أي رياضي يرفع شعارات دينية في حال تكرر ما حصل، وأيضاً ستتم معاقبة اللجنة مادياً وقد يصل الأمر إلى حد استبعادها من الألعاب تماماً...!<br />وأضاف : \\\\\\\\\\\\\\\"كنا قد أرسلنا تعميماً إلى اللجان الأوليمبية الآسيوية جميعها بالالتزام بدستور المجلس الأوليمبي وأعلمناها بأن أية لجنة لا تلتزم بذلك ستكون معرضة للعقوبة بإلغاء نتائجها أو منعها من المشاركة\\\\\\\\\\\\\\\".<br />ولكن وفي النهاية، هل ترى من العدل أنه إذا قمت بكتابة اسم شخص ما يمثل لك مثل أعلى، أو رسم رمز ديني على فانلتك التي ترتديها أثناء ممارستك إحدى الرياضات .. سوف تعاقب أو تلغى مشاركتك تماماً؟!<br />ننتظر أرائكم ...<br />البريد الإلكتروني الإسم<br />الاسم<br />العنوان<br />أدخل الرمز الإلكتروني :<br />التعليق<br />إلى عنوان البريد الإلكتروني للصديق المرسل إليه<br />اسمك<br />بريدك الإلكتروني<br />رسالتك<br />الاسم<br />البريد الإلكتروني<br />الرسالة<br />يااااا أبو شخه<br />أرسل هذا التعليق بواسطة : عربي<br />كس أم الشيعه الأنجاس<br />أبلغ عن هذا التعليق<br />السلام عليكم<br />أرسل هذا التعليق بواسطة : علي حسين<br />أنا مسلم شيعي أحب أقول ان كان هذا فعلا ضدالقوانين فأنا لست مع الرباع الايراني زاده .<br />وبالنسبة للمدعو عربي فأحب أقول رحم الله والديك والله يهديك تحياتي وحبي لجميع المسلمين السنة والشيعة<br />أبلغ عن هذا التعليق<br />الأمم بالأخلاق<br />أرسل هذا التعليق بواسطة : علي علي<br />أخوووي عربي,,<br />أنا شيعي وأمي سنية..كيف كذا تسبها وهي سنية من دينك ومذهبك؟!<br />أبلغ عن هذا التعليق<br />سلام<br />أرسل هذا التعليق بواسطة : احمد غازي رضا<br />اوا بسم الله الرحمن الرحيم<br />يابا الفضل العباس<br />الى الذين لم يعرفوا من هو ابو الفضل انه العباس بن على عليهم السلام<br />أبلغ عن هذا التعليق<br />سلام<br />أرسل هذا التعليق بواسطة : n70_syria<br />ابو شيخة والله امك<br />واختك غير انيكهم<br />يا اخو القحبة امك تنتاك وتلعب بزبي وايري<br />احنا الشسيعة تاج على راس امك وايرنا يشرفك ويشرف كل الخليج الخونة انتوا اهل الخليج اتنيكوا اخواتكم للا امريكان والابريطانيين<br />أبلغ عن هذا التعليق<br />كس ام السنة الانجاس خوات الكحبة<br />أرسل هذا التعليق بواسطة : نياك اخت السنة<br />اختك يا بو الشيخة نايكهة من طيزهة<br />لا تحكي على<br />الشيعة<br />الشيعة<br />تاج راس السنة<br />يا اخوا المنيوكة<br />يا اخو العزراء<br />يا اخو الكحبة<br />أبلغ عن هذا التعليق<br />كس امكم يانواصب<br />أرسل هذا التعليق بواسطة : قاهر النواصب<br />الشيعة تاج راسكم ياكلاب ياولاد القحبة تفوووو عليكم<br />أبلغ عن هذا التعليق<br />ههههههههههههههههه<br />أرسل هذا التعليق بواسطة : بالمرصاد<br />اتمنى الترفع عن الالفاظ البذيئه<br />أبلغ عن هذا التعليق<br />كس ام السنة<br />أرسل هذا التعليق بواسطة : شيعي كيفي<br />كس امك يا ابو شخة الشيعة تاج راسك و كس عرظك يا ابن القحبة<br />أبلغ عن هذا التعليق<br />مجانين السنة و الشيعة<br />أرسل هذا التعليق بواسطة : فلسطيني<br />يخرب بيتكو مجانين ، سنة و شيعة ولكو اليهود و الامريكان بذبحو فينا و إحنا بنسب على بعض و بنحارب بعض ولك الاسلام المستهدف ، شيعي و سني ، ولك هذا من نجاحات الاحتلال الاسرائيلي و الامريكي يفرقنا ، اتوحدو يا مسلمين اليهود و الامريكان ذبحونا<br />أبلغ عن هذا التعليق<br />هههههههه<br />أرسل هذا التعليق بواسطة : يا صدام حسين<br />و الله الشيعة مجانين شو الهبل الي تسوه<br />يعني شو خص ابا الفضل في المنتاك الايراني<br />على العموم كس امكم<br />أبلغ عن هذا التعليق<br />العن ابو السنه<br />أرسل هذا التعليق بواسطة : ابودرع<br />لك ابو شخه لو تعرف معنى الاسم مكتبته بس انت منيوك سني والسنه ماعليهم حرج كلهم مناويك وراح ننكيكم واحد واحد يا دودكيه كس اخوات السنه ولاسيما القائد المجاهد حارث الضارط عفوا الضارب عفوا الضاري كوووسها لاوخته<br />أبلغ عن هذا التعليق<br />يا ابو شخه<br />أرسل هذا التعليق بواسطة : ابو درع الشهم<br />السنه كلهم مناويك واولهم عمر بن الخطاب لعنه الله<br />أبلغ عن هذا التعليق<br />ياااااااااااااا ابو شخه<br />أرسل هذا التعليق بواسطة : ابو درع الشهم<br />السيد القائد المجاهد مقتدى الصدر تاج راس الشيعه ونياج خوات السنه<br />أبلغ عن هذا التعليق<br />الله يامسلمين<br />أرسل هذا التعليق بواسطة : شيعي وافتخر<br />ياناس يا عالم ويش هل الريج انو الي تسمون روحكم شيعة ويش هل الكلام المكتوب هذا كلام يطلع من شيعي عيب عليكموانتو ياسنه مو عيب عليكم هل الكلام سنة النبي هذي تسبون<br />أبلغ عن هذا التعليق<br />مساعدة خاصه للوهابيات<br />أرسل هذا التعليق بواسطة : المساعد الفذ<br />أي بنت وهابيه او سنيه سلفيه عمرها بين 15 و30 تريد أن اجرب معها رضاعه الكبير وبكل سريه سأمص لها وأريحها تتفضل هذا ايميلي ahmedaalnasser@hotmail.com<br />أبلغ عن هذا التعليق<br />مساكين<br />أرسل هذا التعليق بواسطة : ابو السماسم<br />والله المسلمين سنة وشيعة مساكين واحد ماشى ورا محمد وواحد ورا على والنهاية كله بدعة شيطانية<br />السيد المسيح قال انا هو الاول والاخر<br />ربنا يرحمكم جميعا من الاسلام<br />أبلغ عن هذا التعلي