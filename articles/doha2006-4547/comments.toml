[[comments]]
order = 85
subject = "رد على على مسلم سعودي"
text = "أرسل هذا التعليق بواسطة : مروان البريشي<br />والله انني احترمك فقط ان كنت سني انهم الفجره الكفره اتهمونا اننا نسب علي والزهرا رضي الله عنهم وانا اقسم انني لم اجد موقعا يسب عليهم اما هم عبدة النار فيسبون على ابو بكر وعئشة التي هيى اشرف من نساْ الشيعه كلهم ومن ابنا المتعه ابنا {ليلة الطفية} التي هم العهره يعرفونها ولان نسمح لي كلب شيعي مهما كان ان يسرق امجادنا وجهادنا وشهدانا وتعبنا ويسب اصحاب الرسول ص فل يعلم ابنا الفجرة ايا منقلب سينقلبون فليعلم عبده النار انا الطلقه قد خرجت وانها لان تتوقف عند الكف عن السب الصحابه لان تتوقف كلمه اريد اسماعها للكفره الشيعه النجاس لان نتوقف عن قتالكم حتى لو توقفتو عن سب الصحاب واعتزر الخمينىء الكلب ابن الحماره لاعنت الله على علي والزهرا القحبه مالتهم وبارك الله في علي وا فاطمة رضي الله عنهم ويا عالم لاتخلطو بين فاطمة الشيعه التي لها قراْن لها وبين فاطمه التي نحن نعرفها واسبو والا تخافو شيا فسنمسح الشيعه بالعين العيور مثل الصراصير"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 86
subject = "الخلااااااا"
text = "أرسل هذا التعليق بواسطة : زغيييب الشيعه<br />اقوووووول يا روافض الخلا والله ان قمنا عليكم لأنزغبكم ناشف اسيادكم السنه كل ما واحد فيكم يرفع راسه بندوسه بنعالنا<br />وايران الي مستانسين فيها امريكا بتظربها وهذا احسن خبر سمعته بحياتي<br />الشيعه وايران الي متعنترين نبي نشوف وش بيصير فيهم ووش يبون يسوون خخخخخخخخخخ"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 87
subject = "الشيعة والسنة"
text = "أرسل هذا التعليق بواسطة : {{{{{{{{ ريتشارد قلب الاسد }}}}}}}}<br />انا قريت تعقيبات كتيرة والله انو يااااا السنة ولا الشيعة مابتفهمو حرام عليكم استحو على وجهكم الله ينعلكم ياااااااااااااااااااابقر واقلكم رأيي وبصراحة الله ينعل شرفكم كلكم لانو مافي عندكم شرف ولا بتغارو على شرفكم وبتزوجو خواتكم وزاج متعة يعني شرمكة وقودنة وطعرسة على المخفي وانو يااااا السنة عملين حالكم شريفين وانتو احرمن عالم ونصابين وبتخفو بلاسلام وبتحللو اللي بدكم اياااااااااة ولكم استحو على حالكم الناس وسلط على القمر واحنا لسا نمسب على الشيعة ولا السنة واو مسيحي اتحدو ياااااااااااااااعرب وشوفو مين بيقدر يوقف بوجهكم بس بقول نعلت الله عليكم اجمعين وعلى فكرة انا مسلم وربي يشهد علي"
archived = "2008-02-09"
capture_url = "https://web.archive.org/web/20080209024718/http://doha2006.20at.com:80/article.php?sid=4547"

