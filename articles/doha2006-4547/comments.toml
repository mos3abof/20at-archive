[[comments]]
order = 1
subject = "السلام عليكم"
text = "أرسل هذا التعليق بواسطة : علي حسين<br />أنا مسلم شيعي أحب أقول ان كان هذا فعلا ضدالقوانين فأنا لست مع الرباع الايراني زاده .<br />وبالنسبة للمدعو عربي فأحب أقول رحم الله والديك والله يهديك تحياتي وحبي لجميع المسلمين السنة والشيعة"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 2
subject = "الأمم بالأخلاق"
text = "أرسل هذا التعليق بواسطة : علي علي<br />أخوووي عربي,,<br />أنا شيعي وأمي سنية..كيف كذا تسبها وهي سنية من دينك ومذهبك؟!"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 3
subject = "سلام"
text = "أرسل هذا التعليق بواسطة : احمد غازي رضا<br />اوا بسم الله الرحمن الرحيم<br />يابا الفضل العباس<br />الى الذين لم يعرفوا من هو ابو الفضل انه العباس بن على عليهم السلام"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

[[comments]]
order = 4
subject = "سلام"
text = "أرسل هذا التعليق بواسطة : n70_syria<br />ابو شيخة والله امك<br />واختك غير انيكهم<br />يا اخو القحبة امك تنتاك وتلعب بزبي وايري<br />احنا الشسيعة تاج على راس امك وايرنا يشرفك ويشرف كل الخليج الخونة انتوا اهل الخليج اتنيكوا اخواتكم للا امريكان والابريطانيين"
archived = "2007-12-02"
capture_url = "https://web.archive.org/web/20071202133432/http://doha2006.20at.com:80/article.php?sid=4547"

