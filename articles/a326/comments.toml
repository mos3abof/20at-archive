[[comments]]
order = 0
subject = "مواقع"
text = "على رأي نجيب الريحاني : إيه ده كله .. إيه ده كله<br />يا خبر أبيض .. كل دي مواقع إباحية ..<br />والراجل الكوبارة ده بيخش المواقع دي .. وف الشغل .. طب استر نفسك وروح اتجوز مادمت مش قادر ..<br />ولا ممعكش فلوس تشتري شقة بمنافعها ..<br />ولا تعالى هنا: إيه دا كله .. إيه ده كله ... كل ده راتب : دا أنت بتاخد على قلبك بتاع 2 مليون دولار ف السنة يعني بتاع 500 ألف دولار كل طلعة نص سنة ..<br />يعني 166 ألف دولار كل 3 شهور ..<br />صحيح اللي تفتكره بقدونس يطلع جرجير.."
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803095519/http://www.20at.com:80/article.php?sid=326"

[[comments]]
order = 1
subject = "الشمحطجي"
text = "ايه ياريس هى العملية ناقصة ..ما هى مولعة خلقة<br />لامؤخزة راجل عرة و خايب و احنا مالنا<br />لامؤخزة صاحبك بتاع البنك ده لو شاور على اجدعها *** فى ايرلنده راح تجيله جرى<br />انما تقول ايه فى النفوس الدنية<br />طيب و بالاصلاة على النبى عليه السلام ...انا لامؤخزة راجل شاب دلوقت و زى ما انت عارف العملية مأشفرة و مافيش ميه الواحد يمشى بيها حاله و مافيش اى فرصة الواحد يتجوز لو معزة حته!!<br />نعمل ايه نقديها لامؤخزة مواقع و هلس<br />لامؤخزة ياعم على ولا ماعرفش اسمك ايه اما تكتب كلمة حلوة يا أمه تفضها سيرة و ماتخطهاش تانى<br />و انت ياعم مشرف الموقع ايه ياريس ده... موقع على النت ده و لا غرزة براحه على العيال شويه انتو بتكلمو بنى بنى آدمين مش ملايكه<br />رجاء... المشاركه دى لو اتحزفت عليه النعمة ما هكتب اى مشاركة تانى ..لأ ده انا مش هاخش عليه تانى<br />عفواً.. تم حذف الكلمة الموضوع مكانها تلك العلامة داخل التعليق بواسطة مشرف الموقع.. وموقع عشرينات يرحب بالأخ الشمحطجي وبتعليقاته الثرية..دائما وأبداً.."
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803095519/http://www.20at.com:80/article.php?sid=326"

