subject = ""
author = "مفهوم الحج عند الناس"
posted = "2009-07-03"
text = "الحج فريضة دينية مش لكل الناس ولكن فقط للقادرين عليها - يعنى لو واحد عندة بنت فى سن الزواج وتحتاج لتجهيز لا يحق لة الحج الا اذا ستر ابنتة فستر ابنتة اهم من الحج<br />وواحد يعول امة واخواتة البنات لا يحج لة الحج طالما امة واخوتة فى حاجة الى هذا المال<br />ولكن الحاصل بين الفئات الشعبية وعامة الناس هو الحب الزائد لرسول اللة صلى اللة علية وسلم فيبيعون ما ورائهم وما امامهم ويذهبون للحج لعلهم يقفون امام قبرة الشريف<br />حب الرسول صلى اللة علية السلام وال بيتة الاطهار هو ما يدفع الفقراء الى شد الرحال الى مكة ناسين الابن والابنة والام والزوجة<br />وبعض الناس يظن ان الحج مثل مولد الحسين او السيدة زينب يجب اللحاق بالمولد كل سنة<br />وبعضهم يذهب للدعاء فى الكعبة مثل تلك المراة الطيبة التى قابلتها فى الطواف تدعو بصوت عال جدا<br />يارب زوج بنات اخويا لطفى وابعت لهم [ *** ]ان يستروهم<br />لم تدعوا اللة ليقضى لها حاجة خاصة بها ولكن كان دعائها لزواج بنات اخوها لطفى<br />الناس الطيبين<br />ملح الارض"
archived = "2009-07-20"
capture_url = "https://web.archive.org/web/20090720143142/http://www.20at.com:80/masr/2khbar/12550-2009-07-03-19-36-45.html"

[[comments]]
order = 1
subject = ""
author = "حراميه وبيحجوا"
posted = "2009-07-03"
text = "المهم في الموضوع ان الحراميه في مصر هم اسرع الناس للحج<br />لاعتقادهم الخاطىء ان الحج بيكفر الذنوب<br />صحيح الحج بيكفر الذنوب التي من حق الله فقط<br />اما حقوق العباد فلا يكفرها الله ابدا الا ان ترد المظالم الى اصحابها<br />وبعدين الحج لا بد ان يبقى من مال طيب<br />واذا حج الانسان من مال حرام فعندما يقول لبيك اللهم لبيك<br />يقول الله ملك لا لبيك ولا سعديك مالك حرام وحجتك مردوده عليك"
archived = "2009-07-20"
capture_url = "https://web.archive.org/web/20090720143142/http://www.20at.com:80/masr/2khbar/12550-2009-07-03-19-36-45.html"

[[comments]]
order = 2
subject = ""
author = "عبدالله بن المبارك"
posted = "2009-07-03"
text = "عبدالله بن المبارك قال كده برضه<br />باختصار<br />عبدالله بن المبارك كان جاي من العراق للحج فوقفت القافلة بتاعته لتستريح وبالصدفه وقفوا بجوار مزبله فوجد امرأة تبحث في المزبلة ووجدت دجاجه ميته<br />فنهرها عبدالله بن المبارك على ذلك فقالت له انا اربي اطفال ايتام وليس لنا عائل ولم نذق طعم اللهم منذ عدة اشهر<br />فاعطاهم عبدالله المبارك كل ما معه من نقود وطعام وعاد الى بلاده وقال ليس لنا حج هذا العام<br />ـــــــــــــــ ــــ<br />هذا باختصار<br />باختصار"
archived = "2009-07-20"
capture_url = "https://web.archive.org/web/20090720143142/http://www.20at.com:80/masr/2khbar/12550-2009-07-03-19-36-45.html"

