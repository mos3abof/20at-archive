posted = "2009-07-03"
text = "مش الامام فقط هو اللى بيقول كدة - خطيب مسجد حارتنا قال الكلام دة من 10 سنين<br />والشيخ كشك قال الكلام دة من عشرين سنة وكل الناس العاقلين بيقولوا الكلام دة - يقوم شيخ عمر مكرم جاى النهاردة يقول الكلام دة"
