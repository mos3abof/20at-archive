[[comments]]
order = 25
subject = "بحث مطول عن التدخين لمن يريد المزيد"
text = "أحكام التدخين في ضوء النصوص والقواعد الشرعية س: أرجو من فضيلتكم الإفتاء بالنسبة للتدخين .. هل هو حلال أم حرام؟ وذلك بالنظر إلى النقط الموضحة بعد . 1. في تقرير لكلية الأطباء الملكية البريطانية قالوا فيه (أقلعوا عن التدخين وإلا عاجلتكم المنية) .. 2. بلغنا أنه قد أفتى بعض كبار علماء الدين بأن التدخين بين حرام ومكروه ، ومسموح به . ( أ ) فهو حرام في حالة عدم قدرة المدخن على تحمل مصاريف التدخين . (ب) ومكروه للقادر عليه . (جـ) ومسموح به إذا كان هناك راحة نفسية للمريض من التدخين . 3. نرى كثيرين من علماء ورجال الدين يدخنون . ملحوظة : من أضرار التدخين التي أعلنت عنها (كلية الأطباء الملكية البريطانية) : (1) 27500 بريطاني يفتك بهم التدخين سنويًا ، وتتراوح أعمارهم بين 34-65. (2) 155 ألف بريطاني سيموتون سنويًا بسرطان الرئة خلال الثمانينات . (3) 90% من حالات الوفاة بسرطان الرئة تحدث نتيجة التدخين . (4) الأسباب الرئيسية لحدوث الوفاة بين المدخنين : الإصابة بسرطان الرئة - النزلات الشعبية - تليف الكبد - أمراض الشريان التاجي - الذبحة الصدرية - سرطان الفم : البلعوم والحنجرة - الأطفال الذين تلدهم نساء يدخن يولدون أقل من الوزن الطبيعي - والأمهات أكثر عرضة للسقط. كما أعلن في مجلة Lancet لانست البريطانية ، وهي مجلة طبية محترمة أن التدخين مرض وليس عادة وآفة يمارسه أغلب أفراد العائلة ، أو أنه عادة يؤدي إلى امتهان الفرد لكرامته ، وأن عدد المتوفين نتيجة التدخين اضعاف وفيات وحوادث السيارات ، وينصح الطبيب الذي يدخن بأنه غير أمين على مهنته . لعلنا نحصل على رأي قاطع بالأسانيد القرآنية والمحمدية حتى لا يكون هنا مجال للنقاش وخصوصًا أن ضرره قد ثبت بتقرير أكبر هيئة طبية محترمة في العالم (150صفحة) ولك مني ألف تحية، ووفقكم الله دائماً. ج: الحمد لله والصلاة والسلام على رسوله وصحبه ومن نهج نهجه (وبعد) ظهر هذا النبات المعروف الذي يطلق عليه اسم \"الدخان\" أو (التبغ) أو (التمباك) أو (التتن) ، في أخر القرن العاشر الهجري ، وبدأ استعماله يشيع بين الناس ، مما أوجب على علماء ذلك العصر أن يتكلموا في بيان حكمه الشرعي . ونظرًا لحداثته وعدم وجود حكم سابق فيه للفقهاء المجتهدين ، ولا من بعدهم من أهل التخريج والترجيح في المذاهب ، وعدم تصورهم لحقيقته ونتائجه تصورًا كاملا ، مبنيًا على دراسة علمية صحيحة ، اختلفوا فيه اختلافًا بينًا : فمنهم من ذهب إلى حرمته . ومنهم من أفتى بكراهته . ومنهم من قال بإباحته . ومنهم من لم يطلق حكمًا بل ذهب إلى التفصيل . ومنهم من توقف فيه وسكت عن البحث عنه (انظر : مطالب أولي النهى شرح غاية المنتهى في فقه الحنابلة ج6ص218) وكل أهل مذهب من المذاهب الأربعة فيهم من حرمه ، وفيهم من كرهه ، وفيهم من أباحه . ولهذا لا نستطيع أن ننسب إلى مذهب القول بإباحة أو تحريم أو كراهة . أدلة المحرمين : أما المحرِّمون فاستندوا إلى عدة اعتبارات شرعية يجمع شتاتها ما يلي : 1- الإسكار : فمنهم من قال إنه مسكر ، وكل مسكر حرام ، والمراد بالمسكر في قولهم: مطلق المغطي للعقل ، وإن لم يكن معه الشدة المطربة. قالوا: لا ريب أنها حاصلة لمن يتعاطاه أول مرة . وبعضهم قال : معلوم أن كل من شرب دخانًا كائنًا ما كان أسكره ، بمعنى أشرقه، وأذهب عقله بتضييق أنفاسه ومسامه عليه ، فالإسكار من هذه الحيثية لا سكر اللذة والطرب (الفواكه العديدة في المسائل المفيدة . الشهير بمجموع المنقور ج2.) ورتب بعضهم على هذا عدم جواز إمامة من يشربه . 2- التفتير والتخدير : وقالوا: إن لم يسلم أنه يسكر فهو يخدر ويفتر . وقد روى الإمام أحمد وأبو داود عن أم سلمة أن رسول الله صلى الله عليه وسلم ( نهى عن كل مسكر ومفتر )(رمز له السيوطي في الجامع الصغير بعلامة الصحة وأقره المناوي في فيض القدير .) قالوا : والمفتر ما يورث الفتور والخدر في الأطراف . وحسبك بهذا الحديث دليلاً على تحريمه . 3- الضرر : والضرر الذي ذكروه هنا ينقسم إلى نوعين : ( أ ) ضرر بدني : حيث يضعف القوى ، ويغير لون الوجه بالصفرة ، والإصابة بالسعال الشديد، الذي قد يؤدي إلى مرض السل . ومن سديد ما قاله بعض العلماء هنا : انه لا فرق في حرمة المضر بين أن يكون ضرره دفعيًا ( أي يأتي دفعة واحدة ، وأن يكون تدريجيًا ، فإن التدريجي هو الأكثر وقوعًا . (ب) ضرر مالي : ونعني به أن في التدخين تبذيرًا للمال، أي إنفاقه فيما لا يفيد الجسم ولا الروح ، ولا ينفع في الدنيا ولا الآخرة ، وقد نهى النبي صلى الله عليه وسلم عن إضاعة المال . وقال الله تعالى:(ولا تبذر تبذيرًا . إن المبذرين كانوا إخوان الشياطين وكان الشيطان لربه كفورًا)الإسراء:27. وقال أحد العلماء : لو اعترف الشخص أنه لا يجد فيه نفعًا بوجه من الوجوه ، فينبغي أن يحرم عليه، لا من حيث الاستعمال . بل من حيث إضاعة المال إذ لا فرق في حرمة إضاعته بين إلقائه في البحر ، وإحراقه بالنار ، أو غير ذلك من وجوه الإتلاف . وممن حرم الدخان ونهى عنه من علم<br />Read the rest of this comment..."
archived = "2005-02-20"
capture_url = "https://web.archive.org/web/20050220092212/http://www.20at.com:80/article.php?sid=498"

