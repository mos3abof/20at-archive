subject = "الزي اليمني لا يعني انفصالا"
text = "عندماذهب الرئيس الصالح علي عبدالله صالح الى قمه الدول الثمان بزيه اليمني المعروف ( الجنبيه ) فهذا لا يعني انفصالا على الاطلاق وانما هو رفع لمميزات الشعب اليمني واحتراما لتراثه الذي ليس من العيب اظهارها امام العالم . اما عن الذين يقولون غير هذا الكلام من كتاب ومحللين فهو كلام لا ينبغي قوله في ظل حكم عادل مظلته الوحده والجمهوريه وطريقه الكتاب والسنه,فبنظري ان هذا الكلام ليس له ايه فائده سوى غلغله البلابل في اوساط الشعب اليمني الذي من المستحيل ان يفكر بمثل هذا التفكير الرجعي"
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903083857/http://www.20at.com:80/article.php?sid=498"

