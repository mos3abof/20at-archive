[[comments]]
order = 69
subject = "عنتر نت"
text = "طبعا أحترم كل الردود اللي انتقدت هذا الأسلوب الغير لائق,وأكيد ان أفضل وسيله للاقناع أو الدعوه هي دخول قلب المدعو بالكلمه الطيبه والأسلوب المهذب والذي لا أظن ان كاتب المقال حاول ولو مره يستعمله لأنه أكيد بيجيب نتيجة.<br />لكن أعتقد ان الاسلوب ده لازم يستعمل في بعض الأماكن التي لا تحتمل وجود هواء غير نظيف مثل المستشفيات,أو الأماكن التي يكون فيها المدخن قدوه لغيره مثل قاعات الدراسة أو مدرجات الكليه.<br />أكيد بنشوف ناس بتدخن في المستشفيات وأحيانا يكون الطبيب المعالج هو اللي عمال يدخن وعادي جدا.لدرجه ان احد المرضى طلب منه انه يطفي السيجاره لكنه رفض,<br />شفتو البجاحه وصلت لأيه<br />و مش ممكن يكون الزوار الأفاضل اللي بيدخنو داخل المستشفى مش عارفين أن التدخين ممنوع فيها<br />برضه دكاتره الجامعة اللى المفروض انهم قدوه للطلبة<br />الناس دي ماينفعش معاها الذوق<br />صح ولا ايه<br />لكاتب المقال:الشعر حلو جدا وينفع كأسلوب نقد قوي"
archived = "2005-02-20"
capture_url = "https://web.archive.org/web/20050220092212/http://www.20at.com:80/article.php?sid=498"

