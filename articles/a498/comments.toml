subject = "amgad19792002@yahoo.com"
text = "عيب والله عيب الي بدو ينصح ما بشتيم اذا كان مسلم بس الي كتب هذا المقال واحد يهودي و اذا بدو يرود على مقالي عشان حكيت عنه يهودي فما يرد احسله ويقبلها على نفسه زي احنا ما قبلناها علينا كلمه حيوان وكل الي شجعوه هم زيوه يهود ، يا حيوان عيب عليك انصح الناس وما تحط صور الناس و تشتم فيهم ،الرسول عليه الصلاه والسلام كان جاره يهودي وكان دائما يرمي القمامه امامه بيته وكان الرسول يكتفي ويقول اللهم اغفر لامه المسلمين ونحن نعرف القصه كامله ، وهذا الي تكلم في هذا الكلام وشتم اخوه المسلم هذا واحد يهودي واذا تحققتم من هو فتجدوه يهودي ويتكلم العربي وهدفه ان يرانا نشتم بعضنا فمن يوافقني الراي فارجوا ان يسامحه و يرد عليه بكلام احسن منه وجزاكم الله خيرا"
archived = "2005-02-20"
capture_url = "https://web.archive.org/web/20050220092212/http://www.20at.com:80/article.php?sid=498"

