subject = "المحتقرين فى الأرض"
text = "أنا فتاة وأكرهه المدخنين ككره هتلر لليهود ورأيى أن من يدخن انما هو انعدام للشخصية و عقدة نقص لرجولته فأغلب المدخنين يدخنوها من فترة الثانوية العامة وهذايدل على التقليد الأعمى وانتشارها بين الطلاب الفشلة و أيا يدخن كل طفل متسول لأنه يرى مظهره رائع و هو يمسكها ويضعها فى فمه بككل غباء وكل من هم من الطبقة المتدنية هم مدخنين فلك أيها القارئ ان تمر بجوار مدرسة السعيدية الثانوية للبنين وترى منظر الطلاب المتجمعين وهم يدخنون و كأنهم يفعلون المعجزة ويبدو ذللك عليهم من طريقة مشيتهم و هم يدخنون وطريقة التدخين أيضاوفى رايى من لا يدخن انما هو ذا شخصية قوية جدا ادرك انها مضرة وليست مجدية فى شئ ولها رائحة نفيرة وعلم بأنها ليست التى ستجعله فى نظر الآخرين رجلا وكفى ذللك مع العلم بأنى لم أعبر الا بشئ بسيط عما بداخلى"
