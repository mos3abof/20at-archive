text = "يا حبايب السيدة نداء لكل الناس الى مش عاجبها التدخين بدل ما تتكلموا وتوصلوا الموضوع للعند ويبقى فريقين واحد بيدخن والتانى بيرخم عليه ادعو للمدخنين ان ربنا يزيل عنهم النقمه والبلاء ده<br />وعموما كل واحد بيتحاسب على خطاءة<br />بكل الحب اقولكم خلينا كلنا نحب بعض احنا مصريين و والناس والله خارج مصر بتحسدنا على اننا مقربين من بعض ورغم ظروف المعيشه الصعبه ايلا اننا بنهرج وبنتعامل مع بعض فى الشارع بحب<br />مطولش عليكم بس ادعوا ربنا يحمي مصر ويحمى شعبها الطيب"
