text = "هاى احمد والله انا بشكرك كتير على رأيك وكويس قوى انى فى شاب فى الزمن ده بيفكر كده ومش عاجباه السجاير بس كان نفسى فى حاجه انك تقول اضرارها الصحيه والنفسيه وربنا يوفقك ولا يهمك الاراء الخايبه اللى مكتوبه من اراء الاخرين المحبين للسيجاره لانهم مسيرهم ما هيعرفوا قد ايه هى ضرر واكيد هيندموا"
