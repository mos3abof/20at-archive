text = "وهذا الي زيه بدي ارود كمان زي ما هو حكى خليه يسمع هذا الكلام اسمع يا ابن الحرام انصح الناس وخليك محترم والحق على صاحب الموقع الي سمحلك هيك مع احترامي اله بس انتا وكل الي امتالك زيك يا اخو الشرموطه ونفسي لو اوصلك اشوفك كيف انتا زلمه لو انك زلمه احكي هذا الكلام امام رجل يعرف يتصرف معاك بس لو اعرفك و اذا شوفتك راح اكسرلك ثمك وخليك انتا ولي زيك يشوف حجمه كيف و الي بفكر يرود علي بدي العن شرفه تعفو كيف صح كل واحد عنده كلمه حلوه يحكيها والي ما عنده كلمه حلوه يبلعها لاجي ابلعه ، عيب عيب نفسي اعرفه واه بس لو انه قريب لانيك اخته مع تحياتي لاخو الشرموطه صاحب المقال الي حاط صوره ابوه وهو بدخن يا احمد عبيد واسم العيله مصري بكفي هاي الكلمه مصري لانه ليس على المصري حرج ، سيدك وتاج راسك امجد الفلسطيني و صديقي المغربي"
archived = "2005-02-20"
capture_url = "https://web.archive.org/web/20050220092212/http://www.20at.com:80/article.php?sid=498"

