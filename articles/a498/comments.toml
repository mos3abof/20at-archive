text = "اولا : سلام عليكم يا أحمد وشكرا على المقالة و الفكرة<br />ثانيا: انا عندى 21 سنة و ما بدخنش و أخويا المتزوج لما بيجيلنا بيولع السيجارة و انا احاول اخليه يطفيها ...الوالدة تقولى :عيب ما تبقاش قليل الذوق<br />بالله عليكم مين فينا قليل الذوق اللى مش حاسس باللى حواليه و يستاهل التهزيق<br />كماااااااان المقالة كانت موجهه الى الأشخاص اللى ما عندهمش دم من المدخنيناللى مش حاسين بالناس من حوليهم والهدف منعهم من أذانا ...اما ما يقوله الزملاء من البحث عن اسباب تدخينهم فده شىء خاص بيهم كأفرادبيدخنوا بعيدا عن الناس(ان شالله حتى يولعوا فى نفسهم)......بهزر طبعا"
archived = "2005-02-20"
capture_url = "https://web.archive.org/web/20050220092212/http://www.20at.com:80/article.php?sid=498"

