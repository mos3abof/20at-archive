text = "بسم الله الرحمن الرحيم اولا ان تنظيم القاعدة هو من صنع امريكي اوجدته امريكا في افغانستان في الثمانينات لاجل امر واحد هو خدمة مصالحها هناك وعندما اقتضت المصلحة ان يقوم تنظيم القاعدة بضرب اهداف في امريكا فعل واليوم العالم الاسلامي يتحمل التبعات اذا عدنا بالذاكرة الى الوراء نجد ان اسامة بن لادن قد درس في مدارس امريكية في السعودية وتخرج من جامعات اميريكا واغلب الدعم الذي يتلقاه اسامة والقاعدة هو من اموال تاتي من امريكا ولا تزال ارصدة اسامة بن لادن في معطم بنوك العالم جارية ويمكنه ساعة يشاء ان يستخدمهاانتبه اخي المسلم (مسيلمة العصر )عاد من جديد تفقه اخي المسلم بمن تقتدي ان اليهود قد زرعوا في بلادنا الاسلاميةكثيرا من اسرهم التي تخدمهم تحت اسم الاسلام منهم اسرة اسامة بن لادن وهي من اصول يهودية من اليمن"
archived = "2005-02-20"
capture_url = "https://web.archive.org/web/20050220092212/http://www.20at.com:80/article.php?sid=498"

