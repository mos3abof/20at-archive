author = "مصر فى قلبى"
posted = "2010-02-22"
text = "يارب ينصر البرادعى على الظلم الى اصبح فى كل مكان فى مصر والتاريخ لاينسا الذين يشككون فى زمة البرادعى البرادعى انا متابعة من سنين ولاشفت فية شىء الى عندما قرر الترشح يا رب العليم بالكيد والمكيدون عندى امل كبير وفرحة فى الرجل هذا الدكتور الوطنى النظيف الشريف المشرف لمصر والمصرين انا قلبى يحدثنى ان اللة سيعوض مصر بعد صبر المصرين السنين السوداء."
archived = "2010-02-25"
capture_url = "https://web.archive.org/web/20100225200719/http://www.20at.com:80/masr/hot-topics/15428--facebook-v-.html"

