subject = ""
author = "مصر فى قلبى"
posted = "2010-02-22"
text = "وكمان انتى يا منى انا كنت فاكرك رمز النظافة فى مصر واللة انا مكنتش مصدق انتى يكون عندك اى انحياز وبالزات الموضوع دا الى واضح وضوح الشمس وتتكلمى مع الدكتور وكانك من الصومال واسالتك الواضحة الى بتنصب فى رضا وطاععة الحومة لا يامنى انت فقدتى شعبيتك من كثير من الناس الى بحبوكى بجد البرادعى طوق النجاة واذا ضاع مصر غرقت لان اليوم داحوضح معنى الكلام الكتير الى بنحكى فى المصريين الابطال بتوع زمان الى مش بسكتوا على الظلم وبقولوا كلمة حق واللة يستر على القيم والميادء الى فقدها اهل القلم الحر وبقت مصالح فى مصالى وضاع الضمير"
archived = "2010-02-25"
capture_url = "https://web.archive.org/web/20100225200719/http://www.20at.com:80/masr/hot-topics/15428--facebook-v-.html"

