posted = "2010-02-23"
text = "أملنا فى الرجل ده كبير أوي .. بس ربنا يستر عليه من نظام فاسد بالتلاتة<br />يارب نحلم مرة بجد أننا نحقق الصورة اللى عايزين مصر تكون عليها<br />يااااااارب<br />وانا مش شايف ضرورة للهجوم الجامد ده على منى الشاذلي<br />أى حد ممكن يغلط .. أو ممكن تكون كانت بتحاول تبقى محايدة فأختلت الموازين فى ايديها ومعرفتش تظبط حيادها فقلب لإنحياز ضد .<br />فليه الناس بترمى تهم وخلاص .. ولا هنعمل زي ماتشات الكورة ..<br />جدو ضيع جون يبقى أبن تييت وتييت .. ومافيش خمس دقايق ويجيب جون بقى فنان ومنقذ المنتخب .<br />يارب لو حققت حلمنا في تغيير النظام .. فحقق حلم العالم كله فى أبادة الناس دى"
