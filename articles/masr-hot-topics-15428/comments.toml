author = "أفضل شمس"
posted = "2010-02-22"
text = "كان واضح تماما أن المذيعة المثقفة مدربة تماما لإحراج البرادعى ووضعه فى خانة اليك إلا أن البرادعى كان قارىء جيد لما خلف الأسئلة وإستطاع بحنكة سياسية عالية أن يسيطر على المذيعة ويحرج النظام الفاشل المتغطرس فإنقلب السحر على الساحر وكسب البرادعى الجولة وإرتفع رصيده لدى المصريين ولم يبقى إلا القليل وتسقط ورقة التوت من على النظام وسوف يكتشف حسنى خيبته عندما يجد الجميع ينفض من حوله فى صورة مشينة ويحاولون كسب رضا البرادعى متخيلين أنه حسنى الثانى . وبعدين فيه سؤال ناقص هو النظام إللى كتم على قلوب المصرين بالكذب والخداع والتعذيب عيز إيه تانى هايصلح خيبته . لك يوم ياظالم"
archived = "2010-02-25"
capture_url = "https://web.archive.org/web/20100225200719/http://www.20at.com:80/masr/hot-topics/15428--facebook-v-.html"

