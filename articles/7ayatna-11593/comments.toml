text = "الموضوع خطير بجد … تحول شبابنا وبناتنا فجأة وبدون مقدمات الى شباب ممسوخي الهوية وهذا اقل ما يجب ان يقال عن شباب تناسى دوره في المجتمع وتفرغ لمتابعة اخبار هذا النجم او ذاك المشهور دون ادنى مسؤليات او التزامات<br />وشابات نفرغن ايضا لمتابعة احدث صيحات الموضة والجمال ومتابعة قصص الحب والغرام على شاشات الفضائيات دون ادنى احساس او اكتراث بدورن الحقيقي في المجتمع .. لا املك سوى الدعاء والتضرع الى الله ان يهدينا سواء السبيل ..<br />احمد عوض الله - مصر"
