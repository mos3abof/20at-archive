text = "نحن لا نكون تحت رحمه امريكا حتي ان كانت من القوه العظمي التي تهدد العالم باكمله لاننا لا ناخذ بارائهم ولا نهتم بهم لانه مثلنا شعبا وخطا ونحن نثق في البردعي ثقه هي الاولي والوحيده من نوعها هذا الراي راي شخصي قد لا يعجب الاخرين ولكنه الحقيقه التي تغيب عن اذهاننا نحن المصريين ونحن نصر علي الغيلر مهما كان الثمن وةنحن معك يا دكتور محمد البردعي وسوف نحل راياتك مهما كان الثمن وان كان هذا الثمن هو العمر الباقي لنا.؟؟؟؟؟؟"
