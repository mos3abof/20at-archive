subject = ""
author = "يا فضيلة المرشد"
posted = "2009-09-06"
text = "يا فضيلة المرشد خلاص وزارة الداخلية هي اللي حتشرف على الانتخابات<br />القضاه باي باي باي باي<br />يعني اللي حصل من خمس سنين دا ما تحلمش بيه تاني<br />يا دوب الاخوان حيبقوا عشرين واحد على الاكثر في مجلس الشعب<br />وكله كله كله كله المعارضة والاخوان والوفد مش حيزيد على 25%<br />سلام يا فضيلة المرشد<br />وسلملي على فضيلة نائب المرشد"
archived = "2009-09-07"
capture_url = "https://web.archive.org/web/20090907171202/http://www.20at.com:80/masr/2khbar/13187-2009-09-06-08-01-07.html"

[[comments]]
order = 1
subject = ""
author = "ولزومه ايه"
posted = "2009-09-06"
text = "ولزومه ايه<br />المرشد العام تاعب نفسه ليه<br />طالما حسني مبارك يقدر يحل البرلمان في اي وقت ويقعد النواب في البيت"
archived = "2009-09-07"
capture_url = "https://web.archive.org/web/20090907171202/http://www.20at.com:80/masr/2khbar/13187-2009-09-06-08-01-07.html"

[[comments]]
order = 2
subject = ""
author = "مسرحية سمجة"
posted = "2009-09-06"
text = "جميع احزاب ما يسمى بالمعارضة كل حزب بياخد سنويا حصة من الفلوس من الحزب الوطنى يمشى بها حالة واظن الحزب الوطنى بيعطى كل حزب معارضة 350 الف جنية سنويا علشان ياجر شقة للمقر وشوية نثريات فى جيوب كبار رجال الحزب<br />يبقى هيعارضوا اية<br />الاخوان فقط هم اللى بيصرفوا من فلوسهم"
archived = "2009-09-07"
capture_url = "https://web.archive.org/web/20090907171202/http://www.20at.com:80/masr/2khbar/13187-2009-09-06-08-01-07.html"

[[comments]]
order = 3
subject = ""
author = "فى لاظوغلى"
posted = "2009-09-07"
text = "اسماء اعضاء مجلس الشعب اللى هينجحوا فى الانتخابات القادمة سنة 2010 اسمائهم موجودة فى لاظوغلى عند مباحث امن الدولة<br />والمجلس مترتب من دلوقتى واخر تمام<br />تبقى تقعدوا ساكتين وتحترموا نفسكم وتشوفوا اشغالكم وتعملوا زى شنودة ما بيعمل لمصلحة الاقباط ياخد رجال الحكومة بالاحضان ويبعت سكرتيرة لاقباط المهجر يشعللهم نار<br />مفيش طرق شرعية<br />فية لوى دراع<br />تقدر تلوى دراع الحكومة يا سعادة المرشد زى شنودة ما بيعمل<br />اظن لا<br />تبقى تقعد فى بيتكم ساكت"
archived = "2009-09-07"
capture_url = "https://web.archive.org/web/20090907171202/http://www.20at.com:80/masr/2khbar/13187-2009-09-06-08-01-07.html"
