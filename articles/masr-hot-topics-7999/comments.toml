subject = ""
author = "محمد سعد اللطوخى"
posted = "2008-01-12"
text = "شكرا للمجهول اللى رد عليا وشتم طوخ كلها بللى فيها وانهم على بعضيه كده لبشه واحده \"لطوخ\" وشكرا على ان ده هو الطريقة اللى تعاملت بيها مع الافكار اللى قلتها بصراحة منتهى الوجاهة وحجتك افحمتنى جدا جدا .. واشكر المعلقين اللى بيخففوا وطئه الهوس الطائفى ويدوا احساس للقراء ان البلد دى مش كلها مرضى نفسيين مستننين حجر صحى … اخيرا انا مش من طوخ"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121339/http://www.20at.com:80/masr/hot-topics/7999.html"

[[comments]]
