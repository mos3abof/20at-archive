text = "الاستاذ العزيز عك فى عك اولا احه بالالف مش بالقاف يعنى مش لازم تبقى فقى كمان فى الشتيمة .. ثانيا فى موضوع المسيحيين عايزك انت والتانى اللى بيفشر الطائفية فى مصر بان المسمين بيشتغلوا مدرسين جغرافيا والمسيحيين لا .. عايزكوا تعبروا عن مشاعركوا بالكامل قولوا انكم نفسكم تقتلوا المسيحيين وان ميولكم اكثر عدوانية مما تكتبون لعل ده يخللى بقية القراء فى بينة من امرهم .. لانكم فعلا بتتمتعوا بطائفية بغيضة جدا .. وافق ضيق .. والاهم من ده الاستقواء على الاقلية بحجة انه قوية وده بيتناقض مع مشاعر الاحتقار اللى انت اصلا بتكنها ليهم .. ازاى تعمل حساب لحد ريحته مزيته وعضمة زرقا .. انتو عندكوا مشكلة فعلا عويصة ومش حناقش تعصب المسيحيين لانه مهما قلنا مهما قلنا ومهما كان حجمة فهو رد فعل .. .. واخيرا حكرر المثل الابيح والفج اللى كتبته قبل كده \" انتو زى العاجز جنسيا اللى مش بيطلق مراته فلما تسيبه يقتلها \""
