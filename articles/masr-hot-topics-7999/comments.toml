text = "انا رحت العاشر - لقيت اكتر من نصف المصانع بتوع نصارى وما بيوظفوش فى الوظايف المهمة غير نصارى انما الفراشين والعمال التعبانين بيبقوا مسلمين - وعندهم عنصرية غريبة جدا - لان معظمهم جاى من اقباط المهجر<br />مش هى دى القضية<br />القضية انهم ملئوا الدنيا كلام انهم مضهدين<br />وانهم اصحاب البلد الحقيقيون - يا اخى قحة - وادخل اى موقع لهم على النت وشوف السفالة اللى بيكتبوا بها عن الاسلام<br />والمسلمين<br />وشوف التحريض على مصر فى امريكا<br />انهم مجموعة سموم فى البلد وجب التضييق عليهم وضربهم بالصرمة القديمة"
