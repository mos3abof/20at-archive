text = "سويرس وميت سويرس ومليون كفتس لن يهزوا شعرة فى اى مصرى<br />هو فاكر انة هينشر الانحلال فى شباب المسلمين ويبعدهم عن الدين<br />ولما يذيع نشرة الاخبار بالعامية هيقضى على اللغة العربية - موسى صبرى والا صبرى موسى<br />تلك احلام كفاتسة - احلام الاقليات المنعزلة المريضة<br />الاسلام فى مصر يقوى والكفاتسة فى ضمور<br />ونور اللة هو الغالب ولو كرة الحاقدون"
