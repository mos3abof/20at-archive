text = ".. سواريس اللى طالع جديد فى المقدر يحارب الاسلام مرة بمهاجمة الحجاب - على فكرة جدتة النصرانية فى الصعيد كانت بتلبس الملس وبتمشى خيمة متحركة وما كنش بيتذمر - دلوقتى بيطلع قرارات سواريس هذا لما جة يعمل شركتة اشترى شوية معدات خردة من اتصالات الامارات وغيرها وركبهم وكسب من وراها المليارات ومن المليارات دى عمل مصانع اسمنت وعمل امبراطورية قبطية واللى يغيظ ان النصارى فى مصر عددهم 4 % ومسيطرين على 60 % من الاقتصاد —- تصور .. مسيطرين على 60 % من اقتصاد البلد - والحزب الحاكم بيساعدهم .."
