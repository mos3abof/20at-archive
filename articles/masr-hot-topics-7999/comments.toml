text = "اكيد انت من طوخ<br />انت عارف مرة المحاظ راح طوخ وخطب في اهل البلد وقالهم ايه<br />يا اهل طوخ انتم ((( لطوخ )))) وطوخ لكم<br />ولطوخ جمع لطخ يا استاذ طوخي<br />يعني من كلام حضرتك باين انك لطخ كبير"
