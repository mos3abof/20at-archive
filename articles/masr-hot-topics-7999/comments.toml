subject = ""
posted = "2008-01-13"
text = "انا متأسف يا اخ طوخي بس والله النكتة دي اللي قالي عليها واحد من طوخ والله العظيم ويسكن في طوخ بالامارة في بلد اسمها الدير<br />المهم انت العنوان اللي انت كتبته (لازم نعترف ان عندنا هوس ضد المسيحيين)<br />دا اذا كان فيه مسيحيين اصلا في البلد واريد هنا ان اذكر شيء مهم<br />منذ حوالي 50 سنه 50 سنه مش 500 سنه<br />منذ حوالي خمسين سنه كانت بريطانيا محتلة مصر كما تحتل امريكا العراق<br />وطبعا انت عارف ان بريطانيا كانت محتلة فلسطين وسلمتها لليهود<br />لو كان فيه مسيحيين في مصر كانت بريطانيا سلمتلهم البلد زي ما سلمت فلسطين لليهود<br />ومن هنا نستنتج ان نسبة المسيحيين في مصر (فضحت نفسها) لا ترقى الى اي حقوق على الاطلاق ولو كان فيه حقوق كانت بريطانيا سلمتلهم مصر<br />والحكومة المصرية لا تريد الافصاح عن عدد المسيحيين في مصر تقديرا لمشاعرهم لانهم نسبة قليلة جدا جدا جدا<br />وانا اسف على حكاية لطخ دي انا كنت بأمزح مع حضرتك واهل طوخ بيحبوها<br />سلامي لك"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121339/http://www.20at.com:80/masr/hot-topics/7999.html"

