text = "الاقباط اقلية وما فيش حل لحماية نفسها الا ان تتقوى بالعلم والمال<br />يعني الاقباط مابيشتغلوش اي حاجه وخلاص زي المسلمين بيشتغلوا في السمين<br />عمرك شفت مدرس جغرافيا قبطي لا تلاقيه مسلم<br />لكن القبطي يشتغل مدرس رياضيات وانجليزي علشان خاطر يدي دروس لاولاد المسلمين<br />وقس على ذلك القبطي عمره ما يشتغل شغلانه هفأ ابدا زي المسلمين<br />المسلم يشتغل مدرس جغرافيا مدرس تاريخ مدرس العاب يشتغل موظف بميت جنيه في الشهر<br />لان المسلم ما عندوش قيادة توجهه عنده حكومة خايبه ورئيسا عجل زي نظيف كده<br />اما المسيحي فعنده ناس بتوجهه عنده مرجعية عنده منهج ماشي عليه علشان كده 4% سيطروا على السوق"
