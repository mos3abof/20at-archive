text = "وليه محدش منكم قال ان المحطه عملت ساعة علي الهواء مباشرة للاحتفال بهجرة الرسول في برنامج مساءك سكر ذيادة ..<br />وليه محدش اتكلم وعلق علي تقرير بيسال المسلمين اخوانا احنا في سنه كام هجرية واللي عرفو يتعدو ع الصوابع<br />وليه محدش برضه اتكلم عن فقرة مديح لمدة نصف ساعة علي الهواء مباشرة<br />وثانيا اصلا مواعيد الافلام بتبقي محطوطه من قبلها بكتير وبتبقي خطه شهر.. يا جماعه خلينا موضوعيين قبل ما نختلق الاحداث والمصادمات ..<br />ثالثا راس السنه هو مش يوم هجرة الرسول الرسول (ص ) هاجر في الشهر ربيع وراس السنه ده تقويم وضعه عمر بن الخطاب"
