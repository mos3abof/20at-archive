subject = ""
author = "لا مؤاخذة"
posted = "2008-01-13"
text = "إيه الهبل ده ؟؟<br />إيه اللى دخل الدين فى الموضوع ؟؟<br />ببساطة اللى مش عاجبه يقلب القناة .. الناس نوهوا و قالوا إن الفيلم للكبار فقط .. خلاص .. اللى شايف نفسه بشخة يقلب<br />ساويرس راجل علمانى ليبرالى بيؤمن بالحرية اللى الإخوان عاوزين يصادروها من الكل ..<br />و الموقع ده أصلا إخوانجى ..<br />كل شوية واحد إخوانجى يطلع يقولنا الحرية و الديموقراطية و بعدين أول ما ييجى الواحد يشم نفسه شوية و يعمل اللى هو عاوزه يكفروه ..<br />مش برضه مرشد الإخوان هو اللى قال : طظ فى مصر و أبو مصر و اللى فى مصر ؟؟<br />و الله و نعم المرشدين !!<br />هو ده الإسلام بقى ؟؟<br />طظ فى البلد و أبوها و اللى فيها ؟؟<br />هو ده البتاع اللى عاوزينه يحكم مصر ؟؟؟<br />ولا الأخ اللى بيقول إن الإحتلال الإنجليزى كان هيسلم مصر للمسيحيين لو كان فيها مسيحيين أيامها أحب أقوله : ياخى أحه .. روح إقرا التاريخ الأول علشان الناس متضحكش عليك<br />أحححححححححححححح ححححححححه"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121339/http://www.20at.com:80/masr/hot-topics/7999.html"

