text = "سويرس … جاب فلوسة منين ؟ اولا الراجل - … حلال يعنى فى راية ما بيعملش حاجة غلط - لما جابوا للمسيح .. - قال لهم ولا واحد فيكم يلمسها من كان منكم بلا ..فليرمها بحجر - يعنى يا … امشوا على حل شعركم واعملوا اللى انتوا عايزينة وابوكم فى الاعتراف هيقول لكم فركش خلاص ما دام اعترفت يبقى ولا كانك عملت حاجة وبعدين جاب فلوسة منين - من اشتراككم فى تليفوناتة - كل واحد يخلع من شركتة وخلوة يفلس …"
