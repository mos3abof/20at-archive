posted = "2008-01-10"
text = "يا استاذ على<br />يا جماعه<br />يا اخواننا<br />القناه بيمتلكها ملياردير قبطى له وجهه ما معروفه و بيصرح بيها ف كل وسيله اعلاميه بتتاح ليه و بيقولها على الملا ان دى سياسه القناه و اللى مش عاجبه يخبط دماغه ف الحيط فمستغربين ليه انه يذيع فيلم زى ده ف مناسبه دينيه اسلاميه<br />انتو محسسنى ان كان قناه الناس هى اللى اذاعت الفيلم<br />يا جماعه اذاعه الفيلم على otv هو التطور الطبيعى للحاجه الساقعه و اكيد مقصود من قبل القائمين على القناه لانهم بدورهم بينفذو السياسه القذره لساويرس<br />و مع احترامى يا استاذ على بس طرح مثل هذه المواضيع لا يجلب الا الجدل اياه اللى كلنا عارفينه و اللى التعليقات فوق اكدته<br />و نرجع تانى نلف حوالين بعضينا<br />عايزين حل عملى فعلا زى ما قال احد المعلقين نقاطع موبينيل على الاقل<br />و كل واحد يبدا بنفسه بجد و منعملش زى الحماس الكبير اللى حصل بعد تصريحات ساويرس عن الحجاب و الناس قالت هنقاطع هنقاطع و بعد يومين الموضوه اتنسى و اسكت هس و لا كان حاجه حصلت<br />يا ريت كل واحد يبدا بنفسه بجد"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121339/http://www.20at.com:80/masr/hot-topics/7999.html"

