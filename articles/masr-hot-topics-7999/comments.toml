text = "يا جماعة انا رايي ان دي سياسة القناه التي ترى عدم الحجر على الابداع السنيمائي وغير ه عن طريق اي رقابة من اي نوع او تقطيع في الافلام بطريقة متخلفة استنادا لاهواء شخصية (ذي الart مثلا التي بتقطع فالافلام العربي على طريقة الي مش عاجبه حته منه و شايف انها عيب يقطعها بغض النظر عن القيمة الفنية للعمل ككل) ، وزي ما قال العديد من المشاركين انه مادامت القناه حرة نوعا ما في عرض الافلام فللمشاهد مطلق الحرية في المشاهدة من عدمه ( الا اذا كان الموضوع تعبه اوي وهيموت يشوف الحتت ال uncut دي فهو حر برضه) ولكن عنوان الموضوع والربط بين عرض الفيلم وبين يوم الهجرة اراه انه عمل تحريضي ضد المسيحيين ككل كمثال الجاهل الذي حمل لواءالفضيلة وسب الديانة على انها تبيح الزنا بل وتطاول على السيد المسيح عليه السلام ، فيا جماعه لا داعي لتهييج الناس فالتناس هايجه على بعضها خلقة ولنعالج الموضوع بالراي والراي الاخر وليس بالسباب وازدراء الديان والعياذباللهi"
