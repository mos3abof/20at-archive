posted = "2008-01-13"
text = "عنوان التعليق : الاقباط اقل من 4% ويمبكون حتى ملابسى الداخلية … ياخى اتفوو على البيت اللى رباك<br />اسم المعلق محمد سعد الطوخى<br />هذا التعليق على الموضوع رقم: 13771<br />الـip بتاعه : 121.218.44.156<br />الوقت اللي علق فيه بكل دقة وأمانة : 2008 / 01 / 11 - 08:01:08<br />التعليق بقى شخصيا اللى بيقول الاقباط 4% لا انا معترض دول اقل من 1% وممكن نعدهم كمان يعنى هانى رمزى وكان واحد فى اسيوط على كام محل عصير قصب على كام جواهرجى على شوية صيدليات وكام واد فى المدرسة اسمهم مايكل وريمون يعنى ميكملوش االفين او 300 نفر .. بس انا ليا تفسير لحالة النطاعة الفكرية اللى انت والى زيك فيها .. انت اتولدت وكل هزايم البلد بتبرر باسرائيل الى هى اقل من عشر مصر ومابالك بالعالم العربى .. فانت يا جهول معندكش مانع انك تحمل اقلية مهما كانت اربعة او ستة او عشرة فى المية مسئولية مشاكل التسعين فى المية .. حتقعدوا طول عمركم زى العاجز جنسيا اللى مش بيطلق مراته فلما تسيبه يقتلها"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121339/http://www.20at.com:80/masr/hot-topics/7999.html"

