posted = "2008-01-13"
text = "الحقيقة ان لو ساويرس مكنش مسيحى كانت الحملة مش حتكون بالعنف ده .. لان جمال مروان بيتحدى الملل فى ميلودى وبيعمل اعلانات عن البيض … ومحدش بيقول نقاطع شركات عبد الحكيم عبد الناصر خاله .. ثانيا الموقف من القناة مش لانها بتعرض اباحة بقدر ما هى قناة مصرية بتعرض اباحة بالتالى انت موقفك مش من الاباحة لان لو موقفك من الاباحة كاباحة كنت طالبت بمقاطعة الدش كله .. ثانيا على الجميع الوقوف ماما المراه كل يوم وترديد اللهم لا تمكن الاقلية العبقرية اللى هى صفر فى المية من الاغلبية الغبية اللى هى مية فى مية"
