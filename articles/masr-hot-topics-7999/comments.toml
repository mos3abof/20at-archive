order = 10
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-01-11"
text = "تزوجته منذ 3 سنوات زوجا عمره 30 عاما، وأنا أصغره بـ 8 سنوات، وقبلت به لأنه كما سمعت وسألت، قيل إنه متدين ويصلي ويعمل، فهو إنسان عصامي يسعى للأفضل. إنه زوج حنون, وأراه يحترمني ويقدرني, ولكني ومنذ البداية لم أمل إليه عاطفياً، وحقيقة إلى الآن! ولكنني لم أخبره بذلك، فقط أجلت مسألة الإنجاب إلى ما بعد السنتين, وقد رزقني الله الآن بطفل عمره 8 أشهر. كل مشاعري وعدم تقبلي لزوجي لم تجعلني مقصرة في حقه، وهو من يقول هذا, حتى إنه لا يحس بعدم تقبلي له؛ لأنني أنا من وافقت عليه وبرضى أهلى على الزواج منه، وليس ذنبه أن قلبي لم يمل له. ولكن مشكلتي الأخيرة معه تجعلني أفكر في الطلاق، فحياة قصيرة أفضل من عمر وسنوات طويلة أعيشها معه بهم وكدر, وطفل واحد أفضل من اثنان وثلاث وأربع. قبل فترة وقبل مدة بسيطة من ولادتي، اكتشفت أن زوجي يمر وبشكل يومي على المواقع الجنسية والفتيات العاهرات، ويستمتع بمشاهدة الصور فيها (للجنسين). فلم أعر الموضوع اهتماما، ولم أكلم زوجي، فالموضوع فقط كنت ألمّح له أنني أعلم بما يفعله, وحاولت أن أشغله بي وبابننا الذي ننتظره، وظننت أنه ترك تلك العادة، وفي يوم ولادتي اكتشفت أنه يراسل الفتيات في إحدى مواقع الصور المشهورة، ففتحت تلك الصفحه وتركتها له؛ ليعلم أنني أدري، وبعد أن أنجبت طفلي قلت: لابد وأنه اعتدل وتاب، بعد أن أوضحت له أنني قرأت وعرفت كل شي، ولكنه تعذر وجاء لي وقال لي: إنه ليس من يراسل الفتيات، بل أحد أصدقائه فتح الموقع باسمه وراسلهن، فحاولت التصديق بأن الرسائل من صديقه، ولكن هل صديقه من يشاهد الصور على جهازه الخاص. وتصرفاته لم تدل على ذلك، كان يومياً يسهر على هذه الصور, طننا منه أنني لا أدري ما الذي يجري، وأني صدقت أنه يسهر على المنتديات الإسلامية, إلى أن انهرت، فأنا مقبلة على حياة جديدة مع طفل صغير، وزوج مدمن لا يشبع من مشاهدة الصور، فكرت في الطلاق، وفي الحقيقة ندمت على وجود هذا الطفل بيننا, ولكني أحمد الله كثيرا، فأنا أؤمن أن الله أراد أن يكون كل هذا. واجهت زوجي خلال الأسبوع نفسه (الأسبوع الأول من ولادتي)، وعفته من كل قلبي.. كرهت الجماع معه، وكرهت كل شي فيه، حاول أن يرضيني, واعتذر وبكى كثيراً. وحاول الذهاب للعمرة وذهب، ولكنه عاد كما ذهب!! لم يرتدع. قلت قد يكون لأنه مدمن، فلا يمكنه ترك كل شي مرة واحدة، ولكن مر الشهر والثاني والثالث وهو مستمر في هذه العادة, وكل هذا وهو يظن أني صدقته وأنه ما عاد يشاهد هذه الصور. وواجهته خلال هذه الفترة أكثر من مره، ولمحت له أنني مازلت أعلم أنه يشاهدها، ولكنه يغضب ويحاول أن يقول: هذا كان خلال فتره مرت فقط، وإنه لم يعد يفتح هذه المواقع. وللعلم فإني حاولت أن أتجمل له، ولكنه يستمر في مشاهده الصور، لا أدري ما الحل، حاولت أن أشبع غرائزه بكل الطرق، وتنفيذ كل مايطللبه مني، ولكن لا فائدة. فأنا جميله ولله الحمد، وصغيرة في العمر, ومتعلمة.. ولكن لم يفد كل هذا. وفي الحقيقة أنا أفتح جهازه في غيابه وأفتح ملف \"history\"، وأرى أنه مازال يفتح هذه المواقع.. باختصار هو يحفظها في لستة واحدة في هذا الموقع الخاص بالصور. واجهته مرتين ولمحت له آلاف المرات، وفرحت عندما ترك الصور فترة، ولاحظت أنه بدأ يقطعها فعلا، إلا أنني رأيت خلال الفترة الأخيره عاد إلى الإدمان عليها مرة أخرى! هذه المرة لم ألمح له ولم أحاول مصارحته, ولا الكلام معه، فكرت في أن أخرج معه وأهدده بأنني لا أريد البقاء معه أو الاستمرار معه في الحياة إذا عاود ذلك أو طلب الطلاق، فالثالثة تامة \"وإذا كانت نزوة المرة الأولى كما يقول, والمرة الثانية فهذه المرة لا، فقد أصبح الموضوع عادة.. لا بل طبع فيه\"، ولكني أخاف أن أحرم من ابني. ففضلت عدم التسرع وطلب المشورة كحل أخير, فأنا لا أستطيع طلب مساعدة أمي، مع أنها إنسانة متعلمة، وزوجي ينصت لها ويقدر رأيها، أو من أبي؛ فلا أريد تكديره، ولكني سأفعل هذا بعد طلب المشورة منكم, ومحاولة تطبيق ما تشيرون فيه علي، وما يزيدني كرهاً أنه دائما يغضب ويتظاهر بالحزن عندما يرى أحد طلابه أو أصدقائه قد انحرف، وينهره ويقول لي بما معناه \"حرام إلى يسونه\" \"اختربوا\" \"ظاعوا\". يأمر الناس بشي ويتركه.<br />أختنا الكريمة نسأل الله تبارك وتعالى أن يتوب على زوجك وأن يخلصه مما هو فيه من معصية وتقصير في حق نفسه وفي حق الله عز وجل، وتتولى استقلال الباكر الاستشارية الاجتماعية والأسرية بإسلام تايم الإجابة على سؤالك قائلة:<br />عناصر المشكلة:<br />- زوج مدمن على المواقع الإباحية.<br />إيجابيات المشكلة:<br />- زوج متدين ويصلي وعصامي وحنون يحترم ويقدر زوجته.<br />الحلول الممكنة:<br />ابنتي الكريمة مريم يبارك فيك ربي، ويهدي زوجك ويعيد الحب والسعادة التي يرضاها الله على بيتك وحياتك.<br />قرأت رسالتك مراراً، والحقيقة أنها أرقتني وجعلتني حزينة كثيراً؛ لأن البيوت بدأت تنهار، وسببها هذا الجهاز الإلكتروني المحمل بكثير من المعلومات الضارة والمفيدة، وكيف الإنسان ينقاد خلف الضار بسهولة، ويترك ما وهبه الله من علم ومواهب وخلق ليصبح مضيعة لتلك المحرمات.<br />فكل الشرر يبدأ من الفضول ليصبح شيطانا متمكنا وإدمانا لا يمكن الخلاص منه إلا بعد جهد جهيد.<br />فالمشكلة يا ابنتي العزيزة تكمن في السبب الحقيقي الذي جعل زوجك يبحث خلف تلك المتع الواهمة، هل هو الفراغ العام، أم الفراغ العاطفي، أم فراغ المتعة من كل شيء في الحياة… الخ.<br />تلك الأسئلة تتسائلها كل زوجة ذكية تريد أن تنقذ حياة زوجها وأبي أولادها؛ ليكون القدوة والمثال الحسن لأبنائها، ولتعيش حياتها مستقرة وسعيدة.<br />لن أضع لك حلول سحرية ممكن في ثانية أن تحقق لك الفرج، بل ستجتهدين أنتِ في تحقيق النتائج والحلول..<br />عزيزتي، البنت التي تتزوج تجعل بيتها كله بيدها، إن شاءت جعلته جنة وإن شاءت جعلته نارا، وأراك قد اتخذتي الجانب الثاني منذ اللحظة التي قلتي فيها: \"ولكني ومنذ البداية لم أكن قد ملت له عاطفياً وحقيقة إلى الآن! فكيف تستثمرين حياتك وأنت قد أعلنت عدم الحب والعاطفة لوالد ابنك، فمتى قد جعلتي منه شيئا ممكن الخلاص منه بسهولة، وفي حين إنك أم ولم تفكري في الصغير الذي هو بحاجة إلى رعاية مشتركة وأب حنون كما ذكرتي من صفاته، اخترتي الأنانية التي تملكتك وهو الخلاص منه واللجوء إلى فك أغلظ وأوثق ميثاق.<br />بنتي العزيزة، كلماتي قاسية نوعاً ما لأنني أريد إفاقتك، فلجوء الرجل إلى الوهم والخيال ما هو إلا حرمان وهزات يتعرض لها الإنسان تتسلل إلى نفسه لتتمكن منه وتصبح مطبقة عليه.<br />حتى لو كنت قد وفرت كل طلباته، فالزوج إذا لم يجد التعاطف معه والتمكن من حصوله على السعادة السريرية بكل أشكالها وأنواعها، فحتماً سيبحث عن ما يريحه، ومن ثم يتورط بعدم الفكاك منها.<br />سنبدأ من البداية، وفكري بإتقان للإجابة عن تلك التساؤلات:<br />- هل زوجك كان مدمناً لتلك المواقع قبل زواجكما أم بعده؟<br />- هل زوجك قد لجأ إلى تلك المواقع بعد فترة حملك؟<br />- هل بحتي له بأنك لا تجدي أي حب وعاطفة نحوه؟<br />- هل تدينه الذي ذكرتي حافظ عليه في بداية حياته معك وظل يجتهد في المحافظة على صلاته في سنين زواجكما؟<br />إذا أجبتي بحقيقة الأمر بينك وبين تلك الأسئلة فستكتشفين من هو السبب في تورط الرجل مع تلك المخالفات والمواقع.<br />فالحل ابنتي الكريمة:<br />1. أن تجلسي إلى نفسك لتراجعي علاقتك بزوجك من كل النواحي، وخاصة بعد قدوم طفلك، ومنها تلجئي إلى الحوار الهادف الباحث والراجي للوصول إلى حل، فجزء من حل هذه المشكلة يكمن في النقاش الهادف لا الصراخ، وأن تكوني في حالة حوار لا محاسبة وموبخة، وسيساعدك ذلك على أن تكشفي الحقيقة التي دفعت زوجك لتلك المخالفات.<br />2. مهما يصل الأمر من كلام ونقاش، تحلي بالصبر والعاذر للنفسية التي ستجعله يصغر في عيونك، خاصة وأنه كان ينكر أن تلك المواقع تخصه، وثاني شيء لأنك أصغر منه، فلابد أن لا تكوني جارحة في كلماتك، ولا تجعلي من نفسك المعصوم عن الخطأ وأن الجريمة محيطة به فقط.<br />3. لابد أن تكتمي سره عن الجميع ولا تفضحيه، سواء عند أسرته أو أسرتك أو أصدقائكما؛ لأن الفضيحة تكسر الحاجز والأدب في المعصية.<br />4. لو استطعتي الحصول على معرفة الأسباب التي جعلته يلجأ لتلك المواقع ووصلتي إلى حلول، فلابد أن تفهمي أن الرحمة التي خصها الله في الإنسان هي النسيان للآلام التي يتعرض لها الإنسان، فعيشي الحياة الجديدة لأجل سعادتك وسعادة ابنك متناسية ما حدث.<br />5. الحب يا عزيزتي لا يأتي في بداية سنواته الأولى، فالحب بين الزوجين لا يثمر إلا بعد الخمس سنوات الأولى؛ لذلك تقع معظم المشاكل في هذه السنوات الخمس الأولى، فلا تقنعي نفسك بفك الميثاق بينكما على أساس أنك لم تحبيه، فقد ذكرتي جملة من الخصائص التي هي أساس كل زواج ناجح، وموجودة في زوجك من تدين إلى الحنان، لذلك وظفي عاطفتك لخدمة تلك الصفات.<br />6. المرأة أينما تعددت أشكالها ومفاتنها تظل امرأة لديها ما لدى غيرها، لا تختلف عن الأخرى، فلا تجعلي الصور الواهمة لزوجك متعته، فلو أرادت المرأة أن تثير زوجها وتجعله لا يفكر بغيرها لفعلت، وسنك الصغير هذا سن الدلال والجمال، فلا تستحي من استخدام ما وهبك الله لتلبي الحاجة التي يحتاجها زوجك ولجأ فيها لغيرك.<br />7. كلما اقتربتي منه بحنان ـ لأنها صفته أساساً ـ وشجعتيه على أن يحادثك عن أسباب دخوله تلك المواقع، فحتماً ستجدين إجابات تساعدك على أن تعالجيه وتنقذيه، ولو طلب منك مجاراته في اللعب والحركات التي يرغب بها، فلك الأجر مرتين الأولى لأنك تؤدين حق من حقوقه، والثاني لأنك تريدين هدايته وابتعاده عن المحرمات.<br />وربي يبارك فيكما ويحفظكما، فلا تنسي أن يكون الدعاء لزوجك أساس كل صلاة، فربنا لا يرد مستغيث وطالب.<br />ـــــــــــــــ ــــــــــ<br />هذه الاستشارة بالتعاون مع \"شبكة أشرعة\"."
