order = 8
subject = ""
author = "أكتب إسمك هنا بسرعة"
posted = "2008-01-10"
text = "طيب ليه الأخ ماإتكلمش عن الأباحة اللي عيني عينك علي قناة أشرف مروان؟<br />حفيد الزعيم الخالد أبا خالد؟؟؟؟؟<br />ليه مجابش سيرة البرامج الجيدة علي قناة الفسق و الفجور أو تي في؟ يبقي انت أكيد في مصر و صباحك/مساءك سكر زيادة؟<br />هل نسيت يا باشا الموضة اللي طلعت فترة علي القناة التانية الأرضية إنهم كانوا بيجيبوا مشاهد أبيحة؟<br />طب ما في قناة تي في 5 عالنايل سات و كلها حاجات مش مؤدبة !!!!!<br />و ضحكتني قوي حتة إنفراد موقع عشرينات بالحديث عن american pie يا عم خد ده و أقعد عليه<br />مصر كلها شافت الفيلم بليل و ده فين ناس كمان شافوا الجزء الخامس من الفيلم ده قبل ما ساويرس يذيع الجزء الأول !!!<br />جاي بسلامتك و تقول إنفراد !!! محسسني إنكوا بتشموا علي ضهر إيدكوا ولا حاجة<br />شيء أخير لو بجد عاوز حرية للإعلام ؟؟؟؟سيب المجتمع يكون هوة ضمير الإعلام و هوة اللي يحكم مش شوية صحفيين لسة متخرجوش مالجامعة يجوا و يتكلموا عن المجتمع<br />آه للأسف الناس عاوزة الجنس و الأباحة و دي آخر حاجة كنت عاوز أقولها بس للأسف لازم أقولها !!!<br />تنكر إن أعلي نسبة تصفح للمواقع الجنسية و الشاذة فكريا علي مستوي العالم جاية من أم الدنيا؟<br />خلاص فرقت أيه الدش من النت؟ ده عالأقل الدش أرحم يا أخي كلها شوت ولا اتنين و يديروا<br />غيروا فكر الشباب الهيجان ده الأول و بعد كده هاجموا الناس التانية"
