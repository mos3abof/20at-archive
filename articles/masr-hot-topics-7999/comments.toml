posted = "2008-01-13"
text = "أيه يا شيوخ جايين علي أو تيفي؟ ما فيه الشوتايم و اللي واخد توكيلها في مصر واحد مسلم و الشوتايم مش زي أو تيفي فيلم ولا اتنين كل سنة لأ دي 24/7 شغالة …في ما تيجي نمارس الحب و مش عارف ايه عارفين مشكلتكوا ايه؟ انتوا نسيتوا الواقع …, الواقع اللي بيقول إن المصريين المستخدمين للنت هما الأكثر بحثا عن الجنس و الدعارة علي مستوي العالم … البحث ماذكرش هما نسبتهم كام مسلمين و كام مسيحيين ليه؟ لأننا كلنا مصريين مصريييييييييييي ييييييييييييين يا بشر يعني شعب مكبوت يعني شعب مقهور يعني المصري مبقاش يعرف يكيف مراته ولا يعدل مزاجه ولا يربي عياله ولا حتي يشم هوا نضيف ولا يشرب ميا مفيهاش رواسب فككوا بقي من ده كله و تحية كبيرة قوي قوي قوي لزكريا اللي كل الشباب بيحبوه لأنهم بيطلعوا فيه كل كبت الشتايم اللي جواهم يمكن الحل في تدريس التربية الجنسية في المدارس ؟ ولا الحل في الإنضمام للإخوان ولا الحل في انك تبقي ليبرالي و لارج ولا الحل إنك تمسك جاز و تولع في نفسك علشان انت مصري لو لم أكن مصريا لكنت مرتاحا نفسيا"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121339/http://www.20at.com:80/masr/hot-topics/7999.html"

[[comments]]
