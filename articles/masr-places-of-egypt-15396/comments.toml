author = "البناء بالحجر"
posted = "2010-02-18"
text = "منذ اجدادنا الفراعنة لم تبنى مصر بالحجر الا فى العصر الفاطمى وبعدهم العصر المملوكى<br />نسى المصريون البناء بالحجر فى عصر الاحتلال الرومانى والاغريقى وبداية العصر العربى<br />بنى الفاطميون اسوار القاهرة وبواباتة وبنوا الجامع الازهر - وكل ذلك بالحجر<br />وظهرت عبقرية البناء المصرى ذو الاصل الفرعونى فى البناء بالحجر مثل الاهرامات والمعابد القديمة<br />حتى المساجد بنيت على الطراز الفرعونى على نسق معابد الشمس<br />فالمسجد مستطيل ساحتة مكشوفة للشمس وعلى الجوانب الاربعة اسقف وتقام تحتها الصلوات وتمتل ىء الساحة المكشوفة بالمصلين يوم الجمعة<br />اذن هى حضارة موصولة فرعونية اسلامية عريقة بعكس الكنائس الرومانية والطراز الرومانى القوطى الغريب على الارض المصرية"
archived = "2010-02-22"
capture_url = "https://web.archive.org/web/20100222020756/http://www.20at.com:80/masr/places-of-egypt/15396-2010-02-18-20-37-46.html"
