[[comments]]
order = 28
subject = "انتصار للحق"
author = "زائر"
posted = "2005-11-28"
text = "قفت د.نهى وقفة مائة رجل وهي تدلو بشهادتها عن مخالفات قانونية شهدت حدوثها في الرقابة على الانتخابات. تقطعت بها الأسباب لكي تحول دون وقوع الخطأ. ولكنها لم تصمت؛ بل شهدت شهادة حق تكتب لها عند ربها. وأبت أن تسكت على الباطل؛ حتى لا تنعت بوصف بعض السلف: \"الساكت عن الحق شيطان أخرس\". إذ تقف شهادة المؤمن له يوم القيامة، وتكون النجاة والشافعة له يوم لا ظل إلا ظله."
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813231809/http://egyvote.20at.com:80/article.php?sid=36"

[[comments]]
order = 29
subject = "اة يا بلد كوســـــــــــــــــــــــة"
author = "Cheetos"
posted = "2005-12-03"
text = "للى حصل فى دمنهور دة تكملة رواية الكوسة المصرية اللى بطلها الرئيسى جدو مبارك طبعا تحت انتاج الحزب الوطنى واخراج الامن المصرى انما اللى اسمة الفقى دة دة حتى مايستحقش حد يزكرة لانة هلهولة فى ايد الحزب وهو مش فى ايدة لنة يستقيل زى ما الناس عايزة لان من الاخر الناس فى البلد دى مالهاش رأى الناس هنا بتنساق زى الخرفان واللى حصل فى دمنهور دة وفى المحمودية وفى كل البحيرة ومصر اكبر دليل على كدة اةةة يا بلد كوســــــــة"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813231809/http://egyvote.20at.com:80/article.php?sid=36"

