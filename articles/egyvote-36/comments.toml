[[comments]]
order = 24
subject = "الى الدكتور مصطفى الفقى"
author = "احد شباب دائرة دمنهور"
posted = "2005-11-24"
text = "تمنى ان ان يكون الدكتور مصطفى الفقى متابع لتلك المقالات- وان كنت اشك فى ذلك- او ان يطلعه عليها احد المقربين اليه لا لان يلقى على مسامعه هذا الكم الكبير من السخط ولكن فقط ليزف اليه \"بشرى\" بشرى من كل ابناء دائرة دمنهور من مثقفيها الذين احبوه وابنائها البسطاء الذين توسموا فيه بالفطرة نموذجا لانسان \"محترم\" بغض النظر عن حزبه الوطنى.<br />بشرى لك يا دكتور مصطفى فاليوم فقط تم تمزيق صورتك الحسنة داخل وجدان الالاف من ابناء دمنهور ربما كان صحيحا انهم لم يعتزموا مطلقا التصويت لصالحك ولكنهم كانوا يحترموك بشدة، فبشرى لك كل هذا الكم من السخط والحنق واقول لك بشرى لان الحزب الوطنى لا يعترف ولا يساند الا من توافرت فيه بضعة شروط اهمها \"ان يكون الشخص مكروها بالقدر الكافى\" وها انت يا دكتور مصطفى قد نلتها...... فهنيئا لك."
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813231809/http://egyvote.20at.com:80/article.php?sid=36"

