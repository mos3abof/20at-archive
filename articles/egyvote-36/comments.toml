[[comments]]
order = 7
subject = "الفقي لما يسعد"
author = "محمد السيد"
posted = "2005-11-21"
text = "صطفي الفقي .... اسم كنت لفترة قريبة بأحترمه .. لكن بعد اختار الرئيس له في المجلس اللي فات بدأت صورته تتغير..وتنقلب 180 درجة... والنهاردة بعد اللي حصل ....أكيد اتقلبت تماما ...<br />الدكتور حشمت مرشخ الإخوان كان 34 الف صوت والفقي وصل الي 6 الاف وكان الكل متأكد من اكتساح حشمت ... واتأخر القاضي في الفرز الأخير وفي اعلان النتيجة وكانت المفاجأة في الآخر عدد الاصوات الغريب .. الفقي 19 الف مقابل 4 آلاف لحشمت... اللي الواحد مش عارف اتوزع علي أي أساس ....<br />في اتصال تليفوني كانت الاخبار من واحد واقف عند لجنة الفرز إنه خلاص ... كانت النتيجة شبه نهائية وكنت متابع لحظة بلحظة ... والمفاجأة في النهاية الصبح عرفتها ... فوز الفقي ...<br />الحقيقة يا فقي .... انت كتبت شهادة موتك و نفسي أشوفك عشان أقول لك الكلام ده ...<br />و فعلا الفقي لما يسعد ..ويخون ويزور ويسرق ويفقد احترام الناس ويسقط في نظرهم كلهم ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813231809/http://egyvote.20at.com:80/article.php?sid=36"

[[comments]]
order = 8
subject = "اللي يقبل ده كله لازم يكون حزن وطني"
author = "محمد السيد"
posted = "2005-11-21"
text = "فاية انه حيكون في مجلس وفي اكتر من خمسين واحد بيبصوا له نظرة احتقار لأنهم عارفين إنه واخد حق مش حقه و راضي بيه ...<br />اللي يقبل إن الحزب ياخده معبر عشان يحاول يضرب بيه الإخوان بيأي ميستحقش احترامه لفسه حتي ... اللي يقبل إنه ينقلب علي كل مبادئه وأخلاقه واللي اتربي عليه عشان مجرد كرسي المفروض يقضي أيامه كلها يبكي علي اللحظة اللي قبل فيها ..<br />اللي يتقلب كلامه يوم الانتخابات ويخرج يدعي بأشياء هو أول العارفين إنها محصلتش المفروض يحفر قبره و يدفن نفسه فيه بينفسه ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813231809/http://egyvote.20at.com:80/article.php?sid=36"

