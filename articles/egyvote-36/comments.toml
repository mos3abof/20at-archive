subject = "انا سعيد بفوز الفقى"
author = "ابو عمر"
posted = "2005-11-22"
text = "صدر سعادتى ان الفقى هو من ذبح نفسه بنفسه وخلصنا من منافق وافاق يتلون كالحرباء ومتحدثا بمعسول الكلام يخدع به الكثيرين. فشكرا يا فقى فانت تستحق ان تعامل باذدراء واحتقار...يا مزور يا مزور يا مزور يا مزور يا مزور يا مزور.<br />مصدر سعادتى الثانى بفوزه هو انه اظهر لدى كل من علق على هذا المقال المتميز حالة الوعى الشديده لدى كل من كتب رايه."
