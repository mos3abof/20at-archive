[[comments]]
order = 4
subject = "انتحار مصطفى الفقي"
author = "عمرو"
posted = "2005-11-21"
text = "لا يسعني غير نقل كلام للأخ اسلام علي<br />\"كثير من التصرفات قد يبدو ظاهرها الفلاح والنجاح إلا أن باطنها العذاب والخزي<br />وهذا ما استشعرته بوضوح وأنا أتابع أنباء تزوير انتخابات دائرة دمنهور لصالح د مصطفى الفقي ، على حساب د جمال حشمت مرشح الإخوان المسلمين والذي أظهرت نتائج الفرز النهائية أنه متوفق على د الفقي ب 18 ألف صوتا في حوالي الساعة الثانية عشر عند منتصف ليل الاثنين ولم تعلن النتيجة إلا في الثامنة والنصف صباحا تقريبا<br />ربما هذا المقعد لن يفرق مع الإخوان في ظل اكتساحهم لبقية الدوائر ، لكن من سيفرق معه د الفقي ، لأنه كان يحظى ببعض الاحترام في صفوف المثقفين والمهتمين بالشأن العام ، وكان هناك خلاف هل هذا الرجل إصلاحي فعلا ، أم هو نسخة متعلمة من كمال الشاذلي ورفقاه ، وكانت إجابة هذا السؤال حائرة عندما تحضر سيرته<br />لكن أظن الآن جميعنا عرف الإجابة<br />لا أظن د الفقي فاز بكرسي بل فاز بنعش ينهي تاريخه الفكري ، على الأقل بين صفوف المثقفين المحترمين<br />ولك الله يا مصر<br />إسلام علي\""
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813231809/http://egyvote.20at.com:80/article.php?sid=36"

