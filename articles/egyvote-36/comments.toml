subject = "حقراء"
author = "زائر"
posted = "2005-11-22"
text = "ستغرب موقف هؤلاء الذين يحترمون شخصيات من نوعية الفقى وعبد اللاه وغيرهم من كهنة المعبد الذين يمنحون السلطة الشكل الائق...<br />الفقى وغيره مرتزقه لا يمكنهم العيش دون اكسوجين السلطة عبر انابيب النفاق... هم هامانات كارتونيه لا تقدم ولا تؤخر إلا كلام ملنا سماعه وتنظير أهبل لا قيمة له ولا معنى غير ان يرضى الحكام عنهم<br />واحيانا تجدهم يقولون بعض كلام يبدوا منه انهم مارضون لكنهم فى نجاسة النفاق يسبحون<br />انهم احقر من الحقارة ذاتها<br />لست من الاخوان<br />لكن ما يحدث اسمه................"
