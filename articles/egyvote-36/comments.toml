posted = "2005-12-22"
text = "اذا تفعل الماشطه فى الوجه العكر<br />العمر قصير والإنسان فقير والأمر جد خطير<br />د/ مصطفى الفقى ارجو من سيادتك ان تتخيل فقط لحظة دخول القبر ثم لحظة السراط ثم حساب العظيم الديان<br />الهم انتقم لنا من هؤلاء فى اموالهم واولادهم وصحتهم واجعلهم اذلة كما هم الآن"
