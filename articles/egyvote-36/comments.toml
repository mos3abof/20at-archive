text = "عتقد بانة لن يكون سعيدا ابدا باقية حياتة..لقد خسر نقسة وخسر احترام الشعب المصرى لانة يدرك ويعلم جيدا انة اغتصب شىء ليس من حقة..اعتقد بان مقعد البرلمان لن يكون مريحا لة...خسارة كبيرةفى حق نفسة...اضاع احترام الشعب لة...عيب ان تختم حياتك هكذا...ياخسارة."
