capture_url = "https://web.archive.org/web/20070813231809/http://egyvote.20at.com:80/article.php?sid=36"

[[comments]]
order = 16
subject = "احنا نروح نموت احسن"
author = "حمادة"
posted = "2005-11-22"
text = "عتقد ان الوضع الان اصبح خارج عن كل مايمت للمنطق وقواعدة فالجميع يعلن ان الانتخابات مزوره وان كل شيء اصبح اكثر سوادا فبالله عليكم ماذا تفعل الحكومة لم يكن يتخيل احدا يوما ما ان الاخوان سوف يحصدوا كل هذا النجاح في ظل انتخابات غير نزيهه فالبرغم من اختلافي الشديد معهم الاانني اري انهم هم التنظيم الوحيد القوي في مصر بعد الوطني وان نجاحهم جاء نتيجة ثلاثة عوامل هي 1- التنظيم الجيد لصفوف العمل داخل اروقة المجتمع 2- النزاهة الغير مسبوقة في اي انتخابات سابقة 3- التوتر الشديد داخل نفوس الشعب تجاة الوضع الاجتماعي و الاقتصادي الحالي<br />(اسف لأنني سوف اكمل حديثي بالعاميه)<br />لما الحكومه ساندت مصطفي الفقي علشان خاطر عيون لجنة السياسات مانجحتش حد من العتاولة في اللجنة لية زي حسام بدراوي ثم انحنا من امتي بسمع عن وزير بيعيد. طيب دول حكومة خالدمحي الدين حكومة لأ وبيقولوا زعيم بيعيد لية قدام الاخوان طيب خد عندك لما الاخوان بنجح منهم 34 اول مره و13 وبيعيد حاجة وتلاتين والله اعلم في الباقي ونرجع بعد داكلة نقول برضه تزوير يبقي اية الحكاية هو الناس الي بتتكلم دي فاكرة الدنيا هتتصلح في يوم وليلة ياجماعة نشكر مره علشان ربنا يزود علينا ولا لو الوضع الي بيقول ان مفيش فايدة دا انتو شايفنه الي بيقول ان كلها تزوير وتمثيل دا صح يبقي احنا نروح نموت احسن<br />اوفليبحث كل منا عن قبره"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813231809/http://egyvote.20at.com:80/article.php?sid=36"

[[comments]]
order = 17
subject = "مقاطعة تامة"
author = "محمد"
posted = "2005-11-22"
text = "حدش يشوف ولا يحضر اى ندوة للاخ الفقي بعد كدة ، طالما هو اختار النهاية دى وفي معرض الكتاب الجاى ، نكتب ورق صغير ونوزعه على الناس نقولهم اخرجوا من القاعة الراجل دة مزور ، ونبعت للمنصة سؤال واحد \"انت ليك عين تتكلم هنا ؟\" أما الاخ احمد موسى فدة حال الصحافة المصرية فيها الشرفاء واللى مفيش بس هو بوليسي زيادة عن اللزوم واسمه في الاهرام العميد أحمد موسى ، ايوة زمايله عارفين انه كان عاوز يدخل كلية الشرطة ومعرفش فدخلها من الاهرام وحسبنا الله ونعم الوكيل"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813231809/http://egyvote.20at.com:80/article.php?sid=36"

