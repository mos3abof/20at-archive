subject = "أروح لمين"
author = "عابر القارات"
posted = "2006-07-03"
text = "سؤال بسيط مع إحترام طبعا لأخوانى فى الوطن أقباط مصر و اللى بينا عيش و ملح و لى منهم أصدقاء و زملاء كتتتيير جدا ... سؤال بسيط بس هوه كل ما أمريكا تضغط على الحكومة تقوم موافقة على طول و خصوصا لما يكون الموضوع متعلق بالاقباط يعنى الاقباط (بعضهم طبعا) عندهم أمريكا تشوف حقوقهم و تفرضها على الحكومة أما إحنا المسلمين (و لو أنى أرفض تماما التفريق بين مصرى و مصرى بكلمة مسلم و مسيحى) مالناش غير ربنا سبحانه و تعالى القوى العزيز الجبار أقوى من أمريكا و من الحكومة .... و على فكرة أعتقد ان الانشقاق ده الحكومة فرحانه بيه علشان تشتت كلمة الاقباط بعد ما ظهروا فى الفترة الاخيرة ليهم قوة و صوت و خصوصا فى مواضيع المسرحية اللى اتعرضت فى اسكندرية و قصة المختل اللى طعن عدة مواطنين اقباط و غيرها من الاحداث القريبة .... عموما ربنا يحفظ مصر و يجعلها فى رباط دائماكما بشر الحبيب المصطفى صلى الله عليه و سلم"
