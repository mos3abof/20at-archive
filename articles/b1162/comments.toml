[[comments]]
order = 9
subject = "صراحة مب كل الممثلين ؟؟"
author = "انجلينا"
posted = "2006-09-20"
text = "شكرا على الموضوع لكن مب كل ممثل مع اسرائيل هنالك الكثير منهم من هم ضد اسرائيل ووقفوا في وجه اسرائيل فليس من العدل ضلمهم وهم واقفين في صف العرب وهم<br />انجلينا جولى التى احبها لاعملها الطيبة وايضا ميل جبسون الذى قال سيحارب اليهود وايضا جورج كلوني الذى قال عن الرئيس الامريكي واتباعه ان التاريخ سيلعنهم وايضا داستين هوفمن وهو من اصل يهودى الذى قال بأن لم يعد هناك وجود للأنسانية بسبب وجود اسرائيل<br />وايضا ال باتشينو الذى قال من هم الارهابيون هم اسرائيل وانطوني هوبكينز الذى قال اخجل كوني امريكيا وهنالك الكثير منهم لماذا دائما اذاكان هناك ممثل واحد ضد المسلمين كرهتم الجميع !!!<br />ارجوا التعليق ؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131727/http://www.20at.com/article2.php?sid=1162"
