[[comments]]
order = 7
subject = "وليه المقاطعة كده ؟"
author = "محمد حسن"
posted = "2006-09-07"
text = "اللي أعرفه إن العبيط ده اتبرع من حر ماله لأطفال البهايم اللي اسمهم إسرائيل ، إنما لو اتضح لنا انه من إيراد الفيلم فاللأسف راح مني عشرين جنيه ليهم وللي كان كان ...<br />عامة أنا مش عارف ، لو من مبدأ المعاملة بالمثل أوكي ، مارلين براندو تم مقاطعته من أرباب هوليوود لما نصر قضايانا ، فاممكن كده ، لكن الفكرة إن الموضوع ياجماعة يكون أهم لو اعتبرنا الممثل زي الإنسان العادي أولا : إيه اللي يخليه يتبرع ليهم مش لينا ؟؟ أكيد هو يهودي يعني مش حايتبرع لينا أكيد وهما أولى ، كام ممثل عربي اتبرع للبنان ؟؟ كام واحد منااتبرع ليها ؟؟<br />أرجع تاني : هي المقاطعة ليه هي الحل ؟؟ أعتقد إن الحل بالحوار أولى والحل بإننا نعرف الناس دي الحقيقة أكبر وأهم ، مش بنكر بالمرة دور المقاطعة الفاعل لكن لما يكون في حاجة زي الفن بيكون الأمر موضع شك ، مش حاتوصل الفكرة ، عامة أنا عارف إني خرفت ومافهمتوش حاجة من كلامي بس أنا كمان زيكم ، عامة الموضوع جميل واعذروني للهرطقة دي أنا مانمتش بقالي 72 سااااااعة ، باي ميوي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131727/http://www.20at.com/article2.php?sid=1162"

