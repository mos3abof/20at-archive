[[comments]]
order = 1
subject = "مجرد توضيح"
author = "عمرو"
posted = "2006-08-31"
text = "عزيزتي مي<br />أحسنت بهذا الموضوع الذي سبقتيني اليه فقد كانت نفس الفكرة في ذهني وأعمل عليها طوال الأسبوع ، مبروك عليك يا ستي<br />ولكن أوضح نقطة هامة، ليس كل نجوم هوليوود من اليهود وحتى الأسماء المذكورة من الممثلين اليهود فأغلبهم ليسوا صهاينة او مؤيدين للكيان الصهيوني ، فالطرح الذي يطرحه وودي ألان في أفلامه مثلا ليس طرحا صهيونيا على الاطلاق ومسألة تأييد الفنان الغربي لاسرائيل لا علاقة لها بديانته فلو دققتي النظر في الموقعين على البيان لوجدتي ان اغلبهم غير يهود كستالون وبروس ويليس ونيكول كيدمان،ولاحظياننا نتحدث عن مجتمع لا يقيم فيه الفرد على أساس ديانته مثلنا،ولست بحاجة الى أن اذكرك بأننا نعادي الصهاينة وليس اليهود، لذا وجب التنبيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131727/http://www.20at.com/article2.php?sid=1162"

[[comments]]
order = 2
subject = "اليهود والصهاينه"
author = "وفاء &وليد"
posted = "2006-09-05"
text = "اليهود والصهاينه هما وجهين لعمله واحدة وامريكا واسرائيل عمله ولكن العمله الأكبر اذا فككتها تطلع لك يهود وصهاينه واذا لم نكن ضد اليهود الذين يكتب اطفالهم علي الصواريخ فنكون ضد من كلهم محتلون والمتضرر منهم فليرحل من بلاد العرب وكفاهم استيطان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131727/http://www.20at.com/article2.php?sid=1162"

[[comments]]
order = 3
subject = "لعنة الله على أمريكا وعلى هوليود ونجومها"
author = "مقاطعة من زمان"
posted = "2006-09-05"
text = "لم أكن أنتظر رد الفعل هذا لأقاطع فأنا قاطعت المنتج الأمريكي من زمان<br />كرهي لبوش كرهني في كل أمريكا وكل ما يذكرني بأمريكا.<br />على فكرة والدتي رغم أميتها تكره الأفلام الأمريكية موت ولن تتوانى عن إطفاء التلفزة عند عرضهم لها.<br />عقبال الجميع<br />سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131727/http://www.20at.com/article2.php?sid=1162"

[[comments]]
order = 4
subject = "نحن كنا نحاول تجاهل ذلك"
author = "د محمد عاصي"
posted = "2006-09-06"
text = "ان تاريخ نجوم هوليوود حافل بالدعم التام لاسرائيل مهما كانت المذابح المرتكبة وكان شعاراتهم عن حقوق الانسان تتلاشي حين يخص الامر العرب والمسلمين ونحن كنا نحاول تجاهل ذلك ونستورد بضاعتهم السينمائية والتي تصورهم ابطال مفعمون بالأنسانية وتصورنا همج فارجو من الهيئات العليا مقاطعة الافلام الامريكية وهناك بدائل كثيرة ونظيفة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131727/http://www.20at.com/article2.php?sid=1162"

[[comments]]
order = 5
subject = "أذى"
author = "عبد الله المسلماني"
posted = "2006-09-06"
text = "بسم الله<br />الحمد لله الواحد الأحد الفرد الصمد<br />نحمد الله تعالى أنه جامع الناس ليوم لا ريب فيه ومجزئ كل بعمله<br />ورغم كل الحزن الذي ألم بالأمة لما نواجه من نكالب الأمم الأخرى علينا كأمة التوحيد إلا أننا لا يجب أن نهن ونحزن فقد قال الحق تبارك ونعالى \" لن يضروكم إلا أذً.....\" ولن تنفي الحاضر والمستقبل فلله الحمد والشكر فكل هذا وما حصل حتى فيما مضي كله أذً فقط، أي أنهم لن بصلوا إلى درجة محو أمة التوحيد أو قهرها أبدأ.<br />أما أن نتعجب من دعم ما بسمى بنجوم هولبوود للصهيونية فلدي أسألة، وقبل ذلك أقول أن صناعة السبنما الأمريكية أساساً تدار عن طريق اللوبي الصهيوني، ثم<br />أي نوع من النجوم هم<br />ما هي أخلاقهم<br />ما هي مبادئهم<br />ماذا ننتظر من قوم العهر والمجون وتعدد العلافات والشذوذ مبدئهم؟؟؟؟<br />إن أسلافهم قالوا\"\"\"أخرجوا آل لوطٍ من قريتكم إنهم أناسً يتطهرون........\"<br />تحباتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131727/http://www.20at.com/article2.php?sid=1162"

