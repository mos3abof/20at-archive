[[comments]]
order = 0
subject = "ما شاء الله يا شيخ مسعود"
text = "الموضوع حلو اوى وعجبنى اسلوبك الرائع. وشامم ريحة كده -طبعا حلوه- انك هتكون نجم ان شاء الله.وحضرتك عارف دا زمن نجوم الافتاء زى ماهو زمن نجوم الكوره وغيرهم.طبعا الاختلاف واضح والتشابه كمان واضح. الكوره مش لازم تطلع بره الخط والا تبقى اوت يا مولانا.وطبعا مفيش داعى اكلمك عن قوانين الطرد من الملعب لانك اكيد كاتبها فى جيبك.ربنا يكرمك يا شيخ مسعود ودايما فى الملعب قولوا امين"
archived = "2004-06-27"
capture_url = "https://web.archive.org/web/20040627095012/http://www.20at.com:80/article.php?sid=268"

