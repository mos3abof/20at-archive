subject = "روز أم الشائعات"
author = "أبوالوليد التمامي"
posted = "2006-06-24"
text = "تعودنا من روز اليوسف الفرقعات الإعلامية الكاذبة والساذجة التي تعتمد على الإثارة فقط دون حقائق يكفي عناوين ومانشيتات المجلة التي حين نقرأ الموضوع نجده مختلف تماما . ناهيك عن مسلسل الأكاذيب المستمرة لكتاب أقل ما يوصفون بالشيوعية المنهارة فلا تجد كاتبا يحترمه الناس يكتب فيها"
archived = "2006-08-19"
