text = "لإزالة البقع رجاء متلعبوش في الهدوم .. ووديها للمغسلة ضروري جدا ..لأن التنظيف بالبنزين من أسوء وأفشل الطرق لإزالة البقع و أي محاولات لإزالة البقع ف البيت بتزود المشكلة وبتثبت البقع أكتر<br />الراجل في المغسلة قالي قبل كده لو فيه بقعة على الملابس هاتيها فورا بدون أي محاولات للتنظيف لأن البنزين و غيره بيسيب اثر مكان البقعة"
