[[comments]]
order = 13
subject = "العقيدة بالعامية"
author = "زائر"
posted = "2006-04-28"
text = "دي يا جماعة قصيدة رائعةكفاية فيها تبسيط عقيدتنا ساعة بحثناالداخلي عن اجابات للأسئلة الصعبة (في القضاء والقدر وخلق الله لكل مخلوقاته بشكل مباشر ولا بالتطور وكمان أين الله في كل مكان ولا في السماء) قضايا كتيرة فيها تلال من الكتب وشاعر تائه يبحث عن الله داخله وفي لحظة مفعمة بالوهج بيكتب أول بيتين في منتهي الروعة بين الجبر والاختيار والأمل والنظرة من بعيييييييييد للنهاية عند ياب القبر ...............وعجبي"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 14
subject = "لمحبى الأستاذ صلاح"
author = "مصطفى احمد"
posted = "2006-04-28"
text = "قد بعتقد القارئ لهذه القصيده ان بها بساطة غير معهودة للأستاذ صلاح صاحب الكلمات الشيقة الجميلة التى لا تنسى وتغنى بها اعذب اصوات فى الوطن العربى.<br />ولكن فى الحقيقة هى ليس بسيطة ولكن هى كل ما يعتقدة الأستاذ وغيره من كتاب وشعراء وإعلاميين فى الله عز وجل.<br />فهم لا يعلمون إلا ان الدين علاقة بين العبد المبدع الخارق الفاعل لكل شئ والرب الذى ليس له فضل اكثر من انه صنع السماء والأرض وبعض النجوم ويمكن له فى وقت الأزمات ان يتدخل على استحياء.<br />فهذا هو مفهوم الرب عندهم يشكر له بمزاجى يشكى انه فى السماء ولكن ان الله الخالق الرازق المدبر القادر الذى له الملك والحكم فهذه صفات لا يقولون بها فضلا على الإعتقاد<br />( الذى خلق فسوى والذى قدر فهدى والذى اخرج المرعى فجعله غثاء أحوى )<br />آيات تقريبا نحفظها أنظر خلق قدر أخرج سوى هدى جعله.<br />هذا هو ربنا الذى انزل كتابه الخاتم على رسوله الخاتم صلى الله عليه وسلم ليكون تبيانا لكل شئ.<br />ولكم منى كل الشكر"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 15
subject = "جاهين ده مش هيتكرر تانى"
author = "ندى"
posted = "2006-04-28"
text = "والله انا عاجبنى اوى كلام شاعر بس برضه يا شاعر معظم الناس الكويسين لما بيكبروا فى السن بيبقى ليهم اتجاهات دينية و رغم ان القصيدة مش عاجبانى لدرجة انى حاسة انها متلفقاله بس الابداع اللى عمله جاهين يخلينا نغفرله اى سطحية (و لو انى مع نيفين برضه فى اننا ماينفعش نقول كده على جاهين)...."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 16
subject = "شاعر عبقري"
author = "محمد قرنه"
posted = "2006-04-29"
text = "حلو أوي النقاش دا ..<br />لزائر<br />فرق كبير أوى عن التعبير عن المشاعر في شكل قلب وسهمين على شجرة وبين التعبير عنها في شكل قصيدة ، الشعر له أصوله<br />لمصطفى أحمد<br />( هى كل ما يعتقدة الأستاذ وغيره من كتاب وشعراء وإعلاميين فى الله عز وجل.<br />فهم لا يعلمون إلا ان الدين علاقة بين العبد المبدع الخارق الفاعل لكل شئ والرب الذى ليس له فضل اكثر من انه صنع السماء والأرض وبعض النجوم ويمكن له فى وقت الأزمات ان يتدخل على استحياء.)<br />إنت بقى قدامك تلات سنين تفسر اللي انت قلته دا !!<br />لندى<br />معاكي في موضوع متلفقاله دي بنسبة 70%<br />لازم نتفق الأول إن صلاح جاهين شاعر عبقري<br />على الأقل من وجهة نظري<br />ومظنش إنه بعد العمر دا حيقع في أخطاء عروضية هبلة زى<br />مين اللي لما بنطلبه يسمعنا<br />وفي وقت الحزن بيشجعنا<br />السطر الأول<br />مستفعلن مستفعلن متفالن<br />السطر الثاني<br />تداخل هلامى من التفعيلات<br />لو قريناها وفي بالمد حتبقى<br />وفي وق تل/ حز نبي شج/ جعنا<br />مفاعيلن/ فاعلاتن/ فالن<br />ولو شيلنا المد حتبقى<br />وف وق / تل حز / نبي شج / جعنا<br />فالن/ فالن/ فعولن/ فالن<br />وفي الحالتين ملهاش معنى !"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

