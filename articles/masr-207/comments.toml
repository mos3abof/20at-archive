subject = "عاشق بهلوان ( إلى صلاح جاهين)"
author = "محمد قرنه"
posted = "2006-04-29"
text = "ولقيت في شعرك بهلوانْ<br />وأنا كنت لسه حاكمّل السطر الحزين في غنوتي<br />وحأقول وأعيدْ<br />\" من غير ألم تبكي الحياة من حزنها ..<br />والحزن هوه المنتهى ..<br />والقلب لو ممشيش على الأشواك ما يطرح يوم جديدْ \"<br />ولقيت إيديك بتحط فوق الكف تمنعني<br />وتاخدني<br />لدنيا كل ما فيها غريب عني<br />وأنا وياك ومستني ..<br />ألاقي الحزن في الكلمات وفي الألحانْ<br />ولقيت في شعرك في بهلوانْ !<br />أنا لسه بأحبي في طريق الشعر لازمْ<br />وأنا كنت حاسب<br />- رغم عمري اللي معداش في الزمن عشرين سنه -<br />إني أنا<br />أقدر أغير في القواميس القديمة والمعاجمْ<br />وأقدر أعلق على المشانق أى شاعر<br />وأقدر أهد الكون وأبنيه من جديدْ<br />مأنا برده لابس زى توفيق الحكيمْ<br />وبأمثل الدور اللي حاكم خطوتي<br />ليه ضحكتك ..<br />بتهد من عزمي وتضعف قوتي ؟؟<br />وتجدد الجرح القديمْ ؟؟<br />والله عارف<br />إننا ألعاب في كف المهزلهْ<br />وإن ( الشُرُمْ ) جنب ( البُرُمْ ) بيحلوا كل المشكلهْ<br />بس المصيبه إن أنا<br />لسّاني حابب غنوتي<br />ليه ضحكتك..<br />بتهد أحلامي وبتسد البيبانْ ؟؟<br />دأنا برده عاشق<br />زى مأنت أكيد عشقت وتهت في الأزمان زمانْ<br />ولّا عشانْ ....<br />أصبحت أنا الطور اللي بيلف الحياه<br />وصبحت إنت البهلوانْ<br />صعب البكا<br />افرد جناح حلمك على وجود المكانْ<br />وارحل مكان ما تلاقي للبسمات مكانْ<br />دوّر بفلسفتك سنين الحزن في شكل ابتسامهْ<br />واسرق نجومك مالسما وارميها في جناح اليمامهْ<br />واضحك كمانْ<br />إيه يعني تبقى البهلوانْ<br />ومادام ملوك القول باعوك وسابوك هنا<br />واخترت إنت تكون ملاك للشيطنهْ<br />ولو اتغابيت واخترت أكون منهم أنا<br />فأنا برده عاشق بهلوانْ"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

