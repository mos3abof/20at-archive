[[comments]]
order = 9
subject = "الى شاعر"
author = "نيفين"
posted = "2006-04-27"
text = "المره دى بالراحه عليا انا<br />معلش يا سيدى لقيت كل الرباعيات اللى حافظاها اتقالت و مكنتش فاكره رباعيه العندليب اوى معلش<br />و بعدين انا بكتب شعر و الله و مقدره ان الخطا ف الشعر بيضايق الللا بيقرا معلش ليك و لجاهين و للى قراوا الرباعيه غلط<br />بالنسبه لموضوع السطحيه انا ليا راى<br />بما انى بحب جاهين جدا انا بتضايقنى كلمه سطحيه<br />اوكى انا معاك بامانه ان القصيده مش مستوى جاهين بس تعالى ندور على اسم تانى و انا موافقه بس بجد بلاش كلمه سطحيه<br />دا جاهعين برده يا جماعه مهما كان"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

