[[comments]]
order = 32
subject = "إلى الشاعر العبقري (قرنه)؟!!!"
author = "أحمد بك يسري"
posted = "2006-12-09"
text = "سواء كانت القصيدة لجاهين أو لم تكن فقد أخذت مساحة أكبر من حقها في النقاش<br />و لنكتفي بقولنا أنها إنفعالة دينية لطيفة...<br />و لشاعرنا العبقري (قرنه!!!) أقول:<br />إن دموع البهلوان (المهرج) عمل خاص ولا يصح أن تدرجها بين سطورك بهذا الأسلوب<br />و لأنك أوضحت لنا في أحد تعليقاتك أنك تفهم جيدا في بحور الشعر و موازينه فنصيحتي لك أن تكتفي (بالعوم) في واحد من هذه البحور أو أن تقف ( بميزان) في محطة الرمل!!!<br />تحياتي لكل أولاد البلد"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114233/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"
