[[comments]]
order = 30
subject = "حب الله"
author = "هدير"
posted = "2006-11-16"
text = "السلام عليكم انا احب ان اقول شىء لكل من قال اى كلام على اللذى اللف هذه القصيده ان هذا غلط رايي ان اللى يعجبه يعلق واللى ما يعجبه يحتفظ برايه والله انا كنت افتكر ان اللى يالف هذا طفل وبعدين قرات ولاكن لازم اننانخاف الله لاننا من المفروض ما نتكلم عن احد كلام مش حلو والله لونعرف كلنا حب الله ما نفعل شىء يغضبه ولكم ان لا تنسو ان سياتى اليوم الذى نقف فيه امام الله وان علينا ان نطيع الله وان نحافظ على كلامنا وعلى ما نفعله ويا رب نسالك صحبه الحبيب المصطفى صلى الله عليه وسلم"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117204211/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

