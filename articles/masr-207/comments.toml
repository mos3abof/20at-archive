subject = "لايوجد انسان فوق النقد"
author = "حسن مصباح"
posted = "2006-04-28"
text = "لالبدلكل انسان ان يتفق او يختلف فى اى شىءاذا كان شعر او سياسة لان الاختلاف حاله صحيةالاختلاف فى الرئى لايفسدللودقضيةلان الشاعر رغم انه من اهم شعراء العميه الا انه من الممكن ان نختلف معه او نتفق لايوجد انسان فوق النقدوانا شايف ان القصيدة فيهاابيات كثيرة جميلة وابيات اقل جمالا واتمناان يتم نشر الربعيات للشاعر لانه جميله جدا"
archived = "2006-09-06"
