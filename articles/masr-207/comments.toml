[[comments]]
order = 27
subject = "مش قصيدة - غنوة أطفال!"
author = "سامية جاهين"
posted = "2006-09-03"
text = "مساء الخير عليكم جميعا. أولا أحب أوضح ان القصيدة اتنشرت بالفعل بعد وفاة صلاح جاهين على طول في عدد تذكري اتجمعت فيه مختارات من أعمال جاهين مباشرة بعد وفاته.<br />ثانيا أحب أوضح ان النقاش أصلا خارج عن إطار الموضوعية لأن ولا صلاح جاهين قال ولا احنا قلنا إن دي قصيدة. دي كتبت كأغنية للأطفال! وده سبب تبسيطه للغة"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 28
subject = "حبيب الملايين جاهين"
author = "شهد _ بغداد"
posted = "2006-11-15"
text = "انا بس عاوزة اسال انتم ليه بتعملوا كدة ليه بتتكلموا عن حبيبي جاهين كدة انتم لو كنتم بتقيموا صح وعندكم ذوق مكنتوش اتكلمتوا كدة كنتم تكلمتوا بذوق شوية عشان هو ميت هو حتى بعد ما مات مخلصش منكم دة زي ماعملتوا مع الامبراطور احمد زكي وذبحتوا وهو ميت عشان فيلم حليم انا احب اشكر نيفين اوووووي على كلامه اللي كله ذوق ورقة . كنت عاوزة اعرف بس ان اللي ارسلت التعليق اللي قبلي هي صحيح سامية جاهين ؟ واخيرا انا عاوزة اقول ان القصيدة راااااااااااااااائعة وعاوزة اقول ان احنا دلوقت محتاجين لشخص يعبر عنا زي جاهين بكل صدق مرغم عليك ياصبح مجبور ياليل لادخلتها برجلية ولاكان ليا ميل شايلني شيل دخلت انا في الحياة وبكرى حاخرج منها شايلني شيل ."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117204211/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

