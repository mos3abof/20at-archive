[[comments]]
order = 21
subject = "انصفوا صلاح جاهين"
author = "مريم"
posted = "2006-05-03"
text = "أنا زعلانة جدا من الذين يقولون أن القصيدة سطحية لاننى ارى انها تحمل الكثير من المعانى السامية و البسيطة فى آن واحد وتدل على عمق جاهين فى فهمه للعلاقة بين الانسان و ربه و لكنى اتفق مع الذين يقولون ان القصيدة ليست على المستوى المعهود من جاهين و ذلك من حيث اللغة و فى بعض الابيات الى جانب الاخطاء العروضية و لقد نسى البعض ان هذه هى قصيدته الاخيرة وربما لم يمهله القدر لاعادة صياغتها وربما ايضا يكون ضعف القصيدة احد اسباب تردد ابناء صلاح جاهين فى نشرها و نشرها بعد اعوام من رحيله فارجوكم رفقا بشاعرنا الكبير .و شكرالكم"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

