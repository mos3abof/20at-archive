[[comments]]
order = 0
subject = "عرفتك يا رب"
author = "ياء"
posted = "2006-04-21"
text = "اذنبت يا رب واذتنى ذنوبى مالها من غافر الاكا<br />دنياىغرتنى وعفوك غرنى ما حيلتى فى هذه او ذاكا<br />لو ان قلبى شك لم يك مؤمنا بكريم عفوك ما غوى وعصاكا<br />ان لم تكن عينى تراك فاننى فى كل شئ استبين علاكا<br />رباه هانذا خلصت من الهوى واستقبل القلب الخلى هواكا<br />وتركت انسى بالحياه ولهوها ولقيت كل الانس فى نجواكا<br />ونسيت حبى واعتزلت احبتى ونسيت نفسى خوف ان انساكا<br />ذقت الهوى مرا ولم اذق الهوى يارب حلو قبل ان اهواكا<br />تتبع 00000<br />yehia2784@hotmail.com"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 1
subject = "سطحية(الله يرحمك بقة)"
author = "قصيدة سطحية إلى أقصى درجة"
posted = "2006-04-22"
text = "هى دي مشكلة الفن لما يتوظف لخدمة غرض معين حتى لو كان غرض ديني<br />في الأغلب الأعم<br />بيتحول لأدب مسطح أهبل<br />زى اللي إحنا شايفينه فوق"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 2
subject = "شاعر"
author = "مثال لأدب موظف دينيا وجميل أيضا !"
posted = "2006-04-22"
text = "إسماعيل صبري<br />يا رب أين ترى تقام جهنمٌ<br />للكافرين غدا وللأشرارِ<br />لم يبق عفوك في السماوات العلى<br />والأرض شبرا خاليا للنار<br />يا رب أهلني لفضلك واكفني<br />شطط العقول وفتنة الأفكار<br />ومر الوجود يشف عنك لكى أرى<br />غضب اللطيف .. ورحمة الجبار<br />يا عالم الأسرار حسبي محنة<br />علمي بأنك عالم الأسرار"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 3
subject = "تكمله"
author = "ياء"
posted = "2006-04-22"
text = "يا منبت الازهار عاطره الشذا هذا الشذا الفواح نفح شذاكا<br />يا مجرى الانهار ماجريانها الا انفعاله قطره لنداكا<br />رباه هانذا خلصت من الهوى واستقبل القلب الخلى هواكا<br />وتركت انسى بالحياه ولهوها ولقيت كل الانس فى نجواكا<br />ونسيت حبى واعتزلت احبتى ونسيت نفسى خوف ان انساكا<br />ذقت الهوى مرا ولم اذق الهوى يارب حلوا قبل ان اهواكا<br />انا كنت ياربى اسير غشاوتى وبدات بالقلب البصير اراكا<br />يا غافر الذنب العظيم وقابلا للتوب قلب تائب ناجاكا<br />اترده وترد صادق توبتى ؟ حاشاك ترفض تائبا حاشاكا<br />يارب جئتك نادما ابكى على ما قدمته يداى لا اتباكى<br />انا لست اخشى من لقاء جهنم وعذابها لكننى اخشاكا<br />اخشى من العرض الرهيب عليك يا ربى واخشى منك اذ القاكا<br />يارب عدت الى رحابك تائبا مستسلما بعراكا<br />انى اويت لكل ماوى فى الحياه فما رايت اعز من ماواكا<br />وتلمست نفسى السبيل الى النجاه فلم تجد منجى سوى منجاكا<br />وبحثت عن سر السعاده جاهدا فوجدت هذا السر فى تقواكا<br />فليرض عنى الناس او فليسخطوا فلسوف لا اسعى لغير رضاكا<br />ادعوك ياربى لتغفر حوبتى وتعيننى وتمدنى بهداكا<br />فاقبل دعائى واستجب لرجاوتى ما خاب يوما من دعا ورجاكا<br />منقول عن مجله الوعى الاسلامى العدد 54<br />yehia2784@hotmail.com"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 4
subject = "فعلا والله"
author = "عبدالله مفتاح"
posted = "2006-04-23"
text = "بجد انا حاسس انها سطحية جدا ايه اللي مكتوب ده<br />القصيده اللي مبعوته باسم ياء احلى منها بمليون مرة<br />والللي احلى كمان وكمان سفري بعيد لزين العابدين بن علي بن الحسين بن علي بن ابي طالب- رضي الله عنهم -"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 5
subject = "بالراحه على ابو صلاح"
author = "نيفين"
posted = "2006-04-24"
text = "القصيده مش مستوى قلاح جاهين المعتاد بس مش لدرجه السطحيه يا جماعه<br />دا السهل الممتنع و اقروها تانى<br />و احب اقول لجاهين<br />يا عندليب قوم قول غنوتك<br />قول غنوتك و احكى على بلوتك<br />كتر الغنا مش هيموتك انما<br />كتم الغنا هو اللى هيموتك<br />عجبى"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 6
subject = "قال سهل ممتنع"
author = "شاعر"
posted = "2006-04-25"
text = "يا أخت نيفين ، هناك فرق بين السطحية والسهل الممتنع ، القصيدة اللي فوق - دا لو اتفقنا على تسميتها قصيدة أصلا ! - سطحية إلى أقصى مدى<br />والسهل الممتنع يا نيفين باشا<br />ميخلكيش تبهدلي أم رباعية جاهين بالشكل اللي انتي عاملاه دا<br />يا عندليب متخافش من غنوتك<br />قول شكوتك .. واحكي على بلوتك<br />الغنوة مش حتموتك .. إنما<br />كتم الغنا هو اللي حيموتك<br />الشعر عزيزتي مش فكرة ، قد ما هو صياغة للفكرة !"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100635/http://masr.20at.com:80/article.php?sid=207&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

