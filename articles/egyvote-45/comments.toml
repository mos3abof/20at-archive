[[comments]]
order = 1
subject = "وجهة نظر غريبة"
author = "داليا"
posted = "2005-11-24"
text = "شكيل جبهة تحت عنوان نواب ضد التزوير شيئ مبالغ فيه جدا فهل يكون دورها الاحتجاج كل ساعة امام مقر مجلس الشعب ضد التزوير ! نتيجة الانتخابات قد حسمت سواء كان بها تزوير ام لا<br />الموضوع ثري بالمعلومات ولكنه طويل جدا وحمل أكثر من فكرة مما تسبب في التشتيت"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013043024/http://egyvote.20at.com:80/article.php?sid=45"

[[comments]]
order = 2
subject = "المقال ثرى فعلاً"
author = "زائر"
posted = "2005-11-24"
text = "لسلام عليكم<br />أود أن أشكر الأخ عبد المنعم على هذا المقال .. وهذا التحليل الرائع .. ولكنه طويل شوية وأخاف ان أرسله لأصدقائى لا يقرأووه لطوله ..<br />على العموم هذا تحليل قوى .. والفكرة جميلة ويمكن أن يكون لها ثمار قوية فى المستقبل<br />بمعنى .. أن يكون لهؤلاء النواب أعمال وطلب استجواب وهم من خارج البرلمان .. جايز ميكونش له تأثير عملى بمعنى فصل موظف أو غيره .. الله أعلم .. بس بالتأكيد سوف يكون فى أثر إنشاء الله"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013043024/http://egyvote.20at.com:80/article.php?sid=45"

[[comments]]
order = 3
subject = "مقالات الحشو وتجميع التصريحات ليست من شيم عشرينات"
author = "زائر"
posted = "2005-11-25"
text = "لمقال عبارة عن مجموعه من التصريحات وحشو بأخبار قديمة ولايوجد به جديد<br />أرجو من كاتب المقال ومن ادارة تحرير عشرينات أن يستمروا كما عودونا في تقديم الانفراد والجديد في الصياغة والطرح والتصريحات كما عودونا دائما وألا يلجأوا إلى مقالات الحشو وكتابها"
archived = "2006-10-13"
capture_url = "https://web.archive.org/web/20061013043024/http://egyvote.20at.com:80/article.php?sid=45"
