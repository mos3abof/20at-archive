subject = "وعجبي"
author = "محمد صالح"
posted = "2007-01-15"
text = "سيبكو بقه من كل الخبر وبصو لاخر كام سطر--اللجنة اللى هتناقش القضية فيها حمدي السيد اللى هو راح من كام سنة وقال ساعتها ان كل حاجه تمام--وكمان بقى رئيس اللجنه مين--محمد ابو العينين--بتاع الفياجرا فى السيراميك--يعني من الاخر حراميه بيناقشو قضية فساد--وعجبي"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192145/http://masr.20at.com:80/article.php?sid=1445"

[[comments]]
order = 1
subject = "كم روح بريئة قتلت"
author = "من قتل روح واحدة فكانما قتل الناس جميعا"
posted = "2007-01-15"
text = "كل من تسبب فى قتل انسان باهمال او بتعمد<br />او بسبب التكسب اذا كان فية قضاء عادل يجب ان يحكم عليهم بالاعدام<br />هذا الكلام لو فية قضاء عادل"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192145/http://masr.20at.com:80/article.php?sid=1445"

[[comments]]
order = 2
subject = "لمصلحه مين"
author = "نيفين نيفى نوفا"
posted = "2007-01-17"
text = "لمصلحه مين اللى بيحصل دا<br />ايه اللى يدفع حيدر بغدادى او غيره الى الشك ف مصانع سرور الا اذا كان فعلا فيه شبهه ف الموضوع<br />البيت بيتك جاب الجلسه اللى جمعت نواب مجلس الشعب و الوزيرو محمد ابو العينين و حمدى السيد اللى موقفه غامض و شامه ريحه مش كويسه ف كلامه بنبنيه موقف الدنيا ربيع و الجو بديع<br />طيب يستنى كلام النيابه و بعدين يتكلم دا هانى سرور نفسه طلب رفع الحصانه علشان يمثل ادام القضاء بعد ما المجلس رفض رفعها يا ناس<br />و اللى نقله البيت بيتك شىء مؤسف<br />تبادل شتايم<br />و سب و زعيق<br />و فى النهايه لBEGGERS HAVE NO CHOICEالشعب الشحات مفيش ادامه الا انتظار قرار النيابه<br />بس يا خوفى لا نكون مستنيين جودو"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192145/http://masr.20at.com:80/article.php?sid=1445"

[[comments]]
order = 3
subject = "حتى دمنا يا عالم"
author = "بسلة مسلمة مصرية"
posted = "2007-01-18"
text = "يا ناس حتى دمنا يعنى مش كفاية بقى بيتسرق لاء وكمان ملوث والله دى بقى حاجة تضحك انا بس عايزة احذر المتبرعين انة لازم تحصل على شيك الدم بتاعك لما تتبرع لانة لاتضمن ان كيس الدم دة رايح البنك لانة من غير الشيك ممكن يتباع كيس الدم برة بالفلوس وميروحوش لناس فى امس الحاجة الية لان الشيك بيثبت انة فى تبرع وكيس موجود المهم ربنا يكون فى عون الراجل الشجاع حاتم الجبلى الكوارث عمالة تنزل على دماغة واحدة ورا التانية وهو بيعترف باى خطأ مش زى اصحبنا التنين وحقول اية تانى حسبنا الله ونعم الوكيل"
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120181201/http://masr.20at.com:80/article.php?sid=1445"

[[comments]]
order = 4
subject = "لا للفقر..لاللبطالة..لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-01-20"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو السيلة الوحيدة للتوظيف<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />من الاخر ياناس ده قانون ظالم وسيهدم اركان المجتمع الذي يقوم علي الاستقرار الي مجتمع يقوم علي التعاقد المؤقت ثم الي الشارع انت واسرتك ايه الموظف المسكين."
archived = "2007-01-20"
capture_url = "https://web.archive.org/web/20070120181201/http://masr.20at.com:80/article.php?sid=1445"
