author = "جيش وشرطه"
posted = "2009-08-26"
text = "الا من رحم ربي<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />العيال اللي بتاخد السنوية دلوقتي بتجري على كلية الشرطة والكلية الحربية<br />ليه؟؟؟؟؟؟؟؟؟؟؟<br />المفروض الكلية الحربية دي للحرب والدفاع عن الوطن<br />وكلية الشرطة دي علشان خاطر يشتغل في وزارة الداخلية اللي هي وزارة خدمات<br />يعني المفروض يخدم الشعب<br />لكن للاسف العيال بتجري على الكليات العسكرية علشان خاطر تلبس البلده وكل واحد بيحلم انه يرجع البيت وهو لابس بدلة الكلية والبنات بتوع الحته يشوفوه وهو لابسها<br />وبعدين العملية تكبر معاه وبعد البنات يبقا علشان خاطر الستات تجري وراه<br />وادي سعادة اللواء سامي فوده نموذج اللي انا بقول عليه<br />ومحسن السكري واسلام نبيه وغيره وغيره كتير"
archived = "2009-09-04"
capture_url = "https://web.archive.org/web/20090904062837/http://www.20at.com:80/masr/2khbar/13062-2009-08-26-05-00-06.html"

