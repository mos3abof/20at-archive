[[comments]]
order = 0
subject = "سونيا الشريرة"
text = "ما هي هوليودولا بوش ولا كيري ... كلهم زي بعض .. مش ههوليود دي الي بتعمل افلام بتتهم العرب والمسلمين بالارهاب .. هي امريكا .. كلها .. يا رب تتحرق"
archived = "2004-11-03"
capture_url = "https://web.archive.org/web/20041103003803/http://www.20at.com:80/article.php?sid=715"

[[comments]]
order = 1
subject = "المعلم حسنين"
text = "فعلا بوش ما زاال هو الاوحد فعلا وكيري هو ظله ثقيل الظل .. اللهم ارحمنا .. وبالمناسبة بوادر التزوير في الانتخابات الأمريكية ظهرت النهاردة ... فعلا على رأي بن لادن .. بوش تعلم كثيرا من الحكام العرب .. وبقى شعاره هو الأوحد"
archived = "2004-11-03"
capture_url = "https://web.archive.org/web/20041103003803/http://www.20at.com:80/article.php?sid=715"
