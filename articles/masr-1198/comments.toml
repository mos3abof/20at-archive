subject = "علي نحت القوافي من معادنها .:. وليس علي إذا لم تفهم البقر"
author = "إبن بهية"
posted = "2006-11-23"
text = "ولا عش دبابير ولا حاجه غيرش بس إننا مازلنا برغم ما مر بنا من مصائب مباركية .. مازال عندنا ثوابت لن تتزحزح إلا في القبر .. يا ريت البقر تفهم على رأي عمنا الشاعر ... علي نحت القوافي من معادنها .:. وليس علي إذا لم تفهم البقر<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
