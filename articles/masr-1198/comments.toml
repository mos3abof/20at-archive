[[comments]]
order = 1
subject = "مصر العزيزة لي وطن"
author = "رموززززززززززززززززززززز"
posted = "2006-11-23"
text = "جمال بدوى انت ووزير الثقافه وكل الناس المعجزة اللي مفروض تتطلع معاش علشان كبرت وخرفت عمك وزير الثقافه دة صاحب انجازات التصادم مع الاسلام دة راجل الشعب بايام وزارته وصل لحد ان معدلات الجواز العرفي عليت وان الاخلاق بقات في السلامكه يا جمال الراجل لو اعتذر اعتذرة مش مفيد لانه مقتنع داخليا برايه العجيب ثانيا يقول ولا ميقولش مخلاص امريكا ضربت العرب وكمان الخونه بيساعدوا وكمان عايزكم بعشرينات توصلوا الراي للوزير اهم حاجه مقامكم عند ربنا يا وزير وكمان ثقف نفسك واعرف ان وزير الثقافه اسم بدون مسمي بالنسبه لك واعرف انك خلاص حوشتلك القرشين وهتجهز ولاد يا عم ماشيه معاك حلاوة واحنا نطق ونضربها عرفي علشان سعادك تفرح وتزقطط وكمان جمال بدوى لازم يدي فرص لللي بعدة للكتابه ولا هو محتكر ثقافات مصر لوحدة وبعدين اللي هيكتب بعدى لازم يحترم راي ويعلق"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171935/http://masr.20at.com:80/article.php?sid=1198"
