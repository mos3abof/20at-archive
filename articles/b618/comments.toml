subject = "دعم!!!"
author = "مخلوق ارضي"
posted = "2006-03-26"
text = "عن اي دعم تتحدثوا يا شباب؟؟؟<br />هل صدقتم انا امريكا وصلت لدرجة الاحسان؟؟<br />مش معقول دولة الارهاب في العالم تعطينا مالا نزيها من غير ما يكون هناك نية مبيتة.<br />ارجو أن نعي هذه الاستراتجية الخبيثة وانا ما يعطى على انه صدقة لوجه الله ما هو الا سيف سيبقى مسلط على الرقبة اذا حاولت تقوم.<br />ولا تنسى تقوم ياعربي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145953/http://www.20at.com/article2.php?sid=618"

