subject = "بابا بتعمل اه"
author = "بابا بتعمل اه"
posted = "2006-07-03"
text = "بتصور اني فتحت باب غرفة النوم ، فوجدت بابا ومعه رجل وبابا بيصرخ فقلت بكل بساطه بابا انت بتعمل اه ، فياتري ماذا سييقول ، هذا صديقي اتركني الان يا ولدي ثم يصرخ ويصرخ فقمت بغلق الباب وانا اقول ربنا معاك يا بابا !!!!!!!!<br />لعنة الله عليكم ، فالحيوانات لم تصل إلي هذه المراحل ، اللهم عافنا واعف عنا"
archived = "2006-11-02"
