[[comments]]
order = 1
subject = "هي بقت كده"
author = "صايع وقديم"
posted = "2006-05-23"
text = "يا عيني علي الرجاله<br />زمان اللي كان ربنا بيبتليه بالموضوع ده كان بيداري علي نفسه و يلم الموضوع<br />انما دلوقت بقي الموضوع علني و في وسائل الأعلام .... ايه يا جدعات مش خايفين ربنا بخسف بيكم الارض ولا يبتليكم بمصيبه تاخدكم<br />لا للمثليه<br />لا للتوريث<br />لا للفساد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150440/http://www.20at.com/article2.php?sid=834"

[[comments]]
order = 2
subject = "اخسؤا ولاتكلمون"
author = "العسلي"
posted = "2006-06-13"
text = "ان المجتمع بريء منهولء المثليين الشواذ المخنثين الذين يريدون ان يغيرو فطرة الله التى فطر الناس عليهاوقام عليها المجتمع وتطورت المجتمعات<br />المم نقول للمثليين المخنثين توبوا الى الله قبل ان ياتى يوم الندم وان كنتم قد ابتليتم بشوة الشذوذ فاصبروا عسى الله ان يشفيكم منها وان اصريتم على غيكم وضلالكم فعليكم لعنة الله والملائكة والناس اجمعين<br />وهذا الانحراف الذى يشجعه اعوان ابليس نلاحظ انه اصاب المجتمعات المترفة وهذا انذار بكارثة عظيمةتحقيقا لقوله تعالى (واذا اردنا ان نهلك قرية امرنا مترفيها ...الخ)<br />فاتقةا الله يا مترفينا اعاذنا الله منكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150440/http://www.20at.com/article2.php?sid=834"

[[comments]]
order = 3
subject = "انتم الشاذون"
author = "نديم"
posted = "2006-06-21"
text = "انهم مثاليون وليسؤا شاذين تتدعون الدين وانت م لا تعبدون سوى الكره والعماء وليس لكو رب لان ربكم هو التسلط لماذا تكرهون ناس لا عيب لهم لماذا تلحقون اناس ارادوا حقوقهم لمااذا ايها الشاذين عقليا تريدون منع اناس ضعفاء قليلون بعددهم اقوياء بقضيتهم محاربين شرساء من اجل حقوقهم انهم بشر كرهت الرب من ورائكم اتركونا وشاننا لاننا لا نؤذي احد لماذا تؤذوننا احببت الشيطان لانه يعطي الحقوق اعرف مصيرهم كن اذا مصيركم غير الشر لانفسكم نهايتكم ستكون كنهاية غيركم من الكرهين للمثالين نهايتكم انكم ستقفوا تتفرجون لانهم على جق والق دائمل منتصر كفا saton_666@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150440/http://www.20at.com/article2.php?sid=834"

