[[comments]]
order = 0
subject = "حسبي الله ونعم الوكيل"
author = "باحث عن الحقيقة"
posted = "2006-09-12"
text = "نشرتم تقرير طويل عريض عن إصدار قرار من الرئاسة العامة لشئون الحرمين الشريفين بمنع صلاة النساء داخل صحن الحرم الشريف، مع أني أكد ان هذا مقترح وليس قرار<br />وعندما يظهر لكم صحة الأمر تنشرون الخبر في سطر مدفون داخل تقرير... هل هذه هي الأمانة يا عشرينات؟<br />وبعدين أنا عايز أي محرر في العالم يقرأ هذا السطر ويفهمه لي:<br />\"عباس يقيل حكومة حماس لمدة يومين تمهيداً لحكومة وحدة وطنية\".<br />دي صياغة تقابلت بها ربنا يا مروة<br />لم يعد لدي ما أقول.... يبدو إنه مافيش فائدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150644/http://www.20at.com/article2.php?sid=1215"

