text = "انا اسفه لكن ما اتار غضبي هو نه اتهام لكل المغربيات انهن داعرات مش كلهم و بعدين مصر هي البلاد الاول للدعاره يعني ان المغرب ليس بلد الدعاره الفاسقات موجدين بس مش كتير زي مصر و بردو مصر مش بلد الفساد احنا كلنا عرب و مش لازم نتهم عربي او حتى اعجمي الفساد موجود في جميع الدول بس ده مش معناه ان كل الناس بتفسد انا اسفه على التعليق الي خارج عن سيطرتي بس ده برضو وجهت نضر"
