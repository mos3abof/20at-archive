author = "الله مصر الكأس"
posted = "2009-11-17"
text = "كل مصرى فى اللحظه دى بيتمنى الفوز لبلده وانها تتأهل لمونديال جنوب افريقيا 2010<br />وكل الفوضى اللى عملها سواء فريق الجزائر او شعبهم … ان دل هذا فيدل على الهمجيه و الوحشيه و التعصب على شىء ليس له اولويه انهم يتعصبوا او يعملوا اى شغب يسىء ليهم او لشعبهم … سواء مصر او الجزائر فإننا فى النهايه امه عربيه واحده… المفروض ان احنا نتعصب و نتشدد ضد عدونا مش ضد نفسنا … و فى النهايه احب اختم ان سواء النصر او الهزيمه … فإن الله سبحانه و تعالى حيجعل سبب الفوز للمجتهد و الافضل ولكل مجتهد نصيب … وان شاء الله مصر تكسب … الله مصر الكأس"
archived = "2009-12-19"
