text = "المباراة كانت حلوة بجد اول ماجبنا الجون الاول دفاع الجزائر زاد جدا وكان صعب الوصول كتير للجون الجزائري وانما المنتخب المصري كان فى هجوم متواصل اكثر من الجزائر بس كل هجماتة كانت مقفولة بسبب دفاع الجزائر بس بصراحة الجون الاخير دة جة حظ من دعوات المشجعين ودعوات المصرين كلهم عشان يقطع لاسان الجزائر على الي بتقولة علينا بس ابو تريكة كان عامل زى الي مش عاوز مصر تكسب كل شوطة منة فى السما من كتر الشهرة الي خدها اعتقد اتغر فى المتش دة عشان كدة كان اداءة ضعيف زى اداء لاعب بقالة سنة فى الكورة نفسى فى مباراة السودان نشوف ابوتريكة الحقيقي الي عاوز يرفع اسم مصر مش الي عاوز يلعب باالكورة ويلاعب بدل الجزائر يلاعب السما"
