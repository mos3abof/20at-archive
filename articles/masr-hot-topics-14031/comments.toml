posted = "2009-11-14"
text = "احنا صحيح فوزنا بالمبارة و الفرحة موجوده فى كل بيت و فى كل شارع و الناس مبسوطة بس برضة مش هو ده فريق منتخب مصر فين منتخب مصر الى كان فى كاس افريقيا و كاس القارات فان الحماس فان المتابعة فان الاصرار بصراحة الاعيبه ملعبتش حلو اوى بس نقدر نقول انهم حققوا البسمة على وجوة المصريين بس الكلام ده مينفعش فى المبارة القادمة الان انا متاكد ان منتخب الجزائر حيلعب بكل قوته و مش حيتنازل عن حلم كاس العام بسهولة فلازم الاعيبه تشد حلها شويا واحنا وراهم حنشجعهم و نشجهم"
