posted = "2009-11-14"
text = "ال100 الف مشجع وال 80 مليون مصرى يا جماعة عملو ضغط على لعيبيتنا اوى . لان ببساطة مصر كللها حطت املها وثقتها فيهم ودى مسئولية كبيرة وانا شايف ان النتيجة كويسة جدا والاداء السئ دة بسبب الضغط الرهيب اللى كانو فية اللعيبة . انا مش متغاظ غير من ابن التيت احمد المحمدى كان بيلعب اكنو عيل ناشئ فمنتخب الشباب المكسح بتاعنا. وفى الاخر لازم كللنا نقول الف مبروك يا مصر يا غالية وعقبال الصعود"
archived = "2009-11-18"
capture_url = "https://web.archive.org/web/20091118024321/http://www.20at.com:80/masr/hot-topics/14031-2009-11-14-19-30-46.html"

[[comments]]
order = 10
subject = ""
author = "محمد محسن"
posted = "2009-11-14"
text = "الحمدلله رب العالمين<br />مصر كانت داخلة مبارة السهل فيها مستحيل<br />الجزائر دخلت الماتش وهما بيفكروا في شكل التي شيرتات بتاعت المودنيال<br />والحكومة الجزائريه جهزت 20 الف شرطي لاحكام الشوارع بعد التأهل من القاهره<br />لاعيبة مصر : بيفكروا في 3 اهداف<br />لاعيبة الجزائر: التعادل يكفيهم<br />يبقي كان الماتش هيطلع ازاي<br />الحمدلله - كده الفرص بقيت متساوية<br />واللي هيلعب احسن<br />معنويأ وخططيا وفكرا وتنفيذ في الملعب هو اللي هيفوز<br />وان شاء الله وبأذن الله تعالي النصر والفوز لمصر<br />وربنا يسعد غلابه كتير نفسهم في الفرحة"
archived = "2009-11-18"
capture_url = "https://web.archive.org/web/20091118024321/http://www.20at.com:80/masr/hot-topics/14031-2009-11-14-19-30-46.html"

