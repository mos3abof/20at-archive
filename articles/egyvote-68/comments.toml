[[comments]]
order = 2
subject = "العيب ليس في التليفزيون.. العيب فينا"
author = "باحث عن الحقيقة"
posted = "2005-11-27"
text = "الواقع أن العالم من حولنا يتغير، والقنوات الفضائية تكثر وحجم الحرية يزيد، ومساحة الفهم تتسع، وما زال التليفزيون المصري يصر على تغطيته العقيمة، وخطابه الإعلامي الساذج، وهو ما جعل دعاء وأنا والكثيرين ينصرفون عن متابعته، ليس خوفا والعياذ بالله من أن تصيبنا نفحاته الغير مباركه، وشطحاته الغير موفقة، بل هو نوعا من البعد عن وسائل الاستفزاز.. فالإخوان هم البلطجية، ومنع الناخبين من التصويت هو لتامين العملية الانتخابية، أما نجاح مصطفى الفقي فلم يأتي عن طريق التزوير، وإنما هو محاولة من الدولة أن تصحح للناس- اللي ما يعرفوش مصالحهم- اختيارهم.<br />ولو أساء الناس الفهم وأدركوا الأمور بشكل آخر فالمسألة ترجع لقصور في فهمهم، وعيب في شخصيتهم.. وأكيد هم منتمين للإخوان.<br />أما أساتذة التضليل و تزييف الحقائق من محرري نشرات الأخبار ومعدي البرامج، فضلا عن أبواق السلطة من المذيعين والمذيعات السافرات منهم والمتبرجات فلا نملك إلا أن نقول لهم حسبنا الله ونعم الوكيل.<br />وفي النهاية لايسعني إلا ان أشكر كاتبة الموضوع دعاء الشامي التي أثارت بموضوعها كثير من الشجون داخلنا"
archived = "2007-08-15"
capture_url = "https://web.archive.org/web/20070815123103/http://egyvote.20at.com:80/article.php?sid=68"

[[comments]]
order = 3
subject = "عاشق مصر"
author = "مصطفى المفكر المثقف"
posted = "2005-11-27"
text = "صطفى الفقى رمز الحزب الوطنى قلما تجد رجل مثله لا حياء له فالكل اجمع على انه فاز بالتزوير الا ان الرجل المثقف البارع يؤكد بطريقة مثقفة انه نجح بالارادة الشعبية .<br />لقد تخلى الفقى عن ثقافته المعدومة اصلا من اجل مقعد البرلمان وكل شئ يهون ظهر لنا رجلا بلطجيا يستخدم المال لاغراء الناخبيين حتى المال يا استاذ مصطفى يا مثقف يا عبقرى حتى فى هذا البرنامج ظهر لنا محاورا بلطجيا عالى الصوت حقيقة لم استطع تكلمة الحلقة حتى لا اصاب بضغط الدم فقد رايته فى العاشرة مساء على دريم ذات مرة واعتقدت انه مثقف فعلا حتى اختلف معه احد المتصلين عندما قال له انك تتحدث بلسان الحزب الوطنى فجأة ظهر لنا مصطفى بوجه البلطجى واخذ يعنف المتصل ويقول ويعيد و(ينعق)بانه كذا كذا ثم قرأت عنه فى صوت الامه انه شتم موظف فى مصر للطيران عندما طلب منه نقود لشحن الحقائب الزائدة عن الحد المسموح به هنا ثار الاخ وقال له سأنقلك كما فعلتها مع زميل لك هذا هو مصطفى الفقى( وهنروح بعيد ليه هو مش من الحزب الوطنى حزب البلطجية والمشتاقين ) اذن فهى سياسة حزبية"
archived = "2007-08-15"
capture_url = "https://web.archive.org/web/20070815123103/http://egyvote.20at.com:80/article.php?sid=68"

[[comments]]
order = 4
subject = "اهدوا شوية بس"
author = "محايد"
posted = "2005-11-27"
text = "يب اوي وعاوز يتهزق اللي قال\"الشعب المصري الجبان\"اكيد طبعا مش مصري اللي قال هذا الكلام الحاجة التانية انا معاد مصطفي في كل كلمة قالها عن الاخوان وياريت الجماعة الاخوانجية يبطلوا استهبال وانتهازللظروف الدولية عشان اطماع سياسية وبلاش استغلال للمواطن البسيط ويضحكوا عليه باسم الدين لانهم عارفين ان الدين اقوي سلاح لاستمالة المصريين نظرا لثقافتهم البسيطة وعد درايتهم بالامور السياسبة انا شخصيا لا اتمني اليوم اللي يصل فيه اخوانجي للحكم واقراوا التاريخ وانتم تعرفوا اتمني تكون المعارضة ليبرالية ويسارية"
archived = "2007-08-15"
capture_url = "https://web.archive.org/web/20070815123103/http://egyvote.20at.com:80/article.php?sid=68"

