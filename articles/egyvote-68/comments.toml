[[comments]]
order = 6
subject = "نهاية الفقى"
author = "شيبمان"
posted = "2006-04-07"
text = "يا فقى الانتخابات ده كان كلها تزوير والحكومة كانت ناوية عليه لكنك للأسف شيلت الليلة كلها فقد كانت واقعة تزوير انتخاباتك هى الأشهر والحكومة باعتك يا فقى وشيلتك الليلة ومرمطت تاريخ فى الأرض<br />الحق نفسك واعمل اى حاجة اذا ماكانش عشان التاريخ اللى وضعك فى مزبلته يبقى عشان يوم ما تقابل ربن يوم الحساب يا فقى يلل حافظ القرآن هتقول ربنا ايه"
archived = "2007-08-15"
capture_url = "https://web.archive.org/web/20070815123103/http://egyvote.20at.com:80/article.php?sid=68"
