[[comments]]
order = 2
subject = "م الاخر"
author = "سوسة المفروسة"
posted = "2006-03-26"
text = "يعني ياجماعة م الاخر ابو العينين فاسد و يوسف والي و كمال الشاذلي و سمير رجب و ابراهيم نافع ووزير السياحة و المواصلات و المالية و رئيس مجلس الشعب و رئيس مجلس الشورى و سونه و سوزي و جيمي و لولو و عم محمد بتاع الفول (ماهو بياخد ربع جنيه عشان يتوصى بالسندوتش) و عم محسن الفراش اللي كان بياخد 5 جنيه عشان يجيب النتيجة م الكنترول و اونكل اللي بيدخلك تقعد في السينما لو ماادتلوش ع اللاقل جنيه يطفي الكشاف و يسيبك تتدالج على جدور رقبتك<br />يعني م الاخر كلنا رشاة و كلنا مرتشين..نعيب زماننا و العيب فينا<br />معلش يا مصر ليكي رب اسمه الكريم"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909220417/http://masr.20at.com:80/article.php?sid=67&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
