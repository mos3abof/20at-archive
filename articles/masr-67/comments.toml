subject = "لا جديد تحت الشمس (عفوا لا جديد فى مصر)"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-23"
text = "المره دى انا قبللك يا اكرم<br />موضوع ابو العينين دا تفتح ف القاهره اليوم و مش عارفه ليه ملت لانى اصدق الراجل دا اقصد ابوالعينين اصله مش محتاج يهرب فياجرا بس بما اننا ف مصر فاى شىء محتمل يحصل عادى جدا<br />كمان موضوع عمر افندى دا شكله اتلعب قيه جامد بس يا خبر انهردا بقلوس بكره يبقى ببلاش<br />على اسم مصر التاريخ يقدر يقول ما شاء"
