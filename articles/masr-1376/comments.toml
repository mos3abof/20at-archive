[[comments]]
order = 1
subject = "من هم الاخوان"
author = "انا عاوز اسال سؤال هو الاخوان المسلمين دول شيوخ وائمه ولا مواطنيين مصريين ؟والسؤال ده سالته كتير ومحدش رد عليا"
posted = "2006-12-29"
text = "ولو مواطنين ليه عاملين الدين شعار وبيتكلمو فيه وبيفتو كتير وهما مش رجال دين ميسيبو الاسلام فى حاله ويسمو نفسهم الاخوان المصريين<br />ولو هما شيوخ وائمه ورجال دين ليه عاوزين<br />النفوذ والسلطه والحكم ميهتمو بعباده الله وتنفيذ الفروض وتوعيه الناس بالدين الاسلامى بدل مبيسيؤ ليه باعمالهم وبعدين رجل الدين ده المفروض يكون قدوه صالحه تهدينا الى الله مش تهدينا الى النفوذ والتعصب والعنصريه والارهاب وحب السلطه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103146/http://masr.20at.com:80/article.php?sid=1376"

[[comments]]
order = 2
subject = "بلا تعديلات بلا بطيخ وقرع على خلق الله ..."
author = "إبن بهيه"
posted = "2006-12-29"
text = "ما تفضوها سيره بقى من الدستور والرغي الفارغ ده .. بجد بقت حكايه ماسخه والكلاب الحوش دول وكلام القرني الغير شريف ده ما لوش أي أساس من العقل ولا المنطق ولا القانون .. هم واثقون من أن الشعب لا يفهم ولا يعي ولا يعرف ما هو الدستور وما هي مواصفاته ولماذا هو أصلاً .. عشان كده تلاقي الهلف من دول يطلع يبعبع بشوية كلام فارغ من أي مضمون وخلاص<br />سيبكم من الدستور لأنه ما منوش أي فايده خالص وما ينفعش فيه تعديل من أصله ، وبخاصة في وضعنا الحالي الذي يحتاج إلى نسف ذلك النظام البغيض نهائياً ثم نجلس بعدها لنضع لنا دستوراً حقيقيا وليس عتها كالذي نراه ..<br />إذا كنا مقتنعين تمام الإقتناع بأنه لا يوجد لدينا دستور فكيف يأتي ذلك القذر الواطي مبارك ويقول تعديلات ؟! هو فين الدستور أصلا عشان نعدله ؟ إذا كان شوية الإنشا اللي عملهم المقبور السادات دول ينفعوا تسموهم دستور فهذا معناه أننا مازلنا عند المربع صفر ولازم نبدأ من جديد نهاتي ونصرخ بأن ذلك العته ليس دستوراً ولا يصلح أن يكون دستوراً .. لكن تقول لمين وكتير من الأفنديات اللي عاملين روحهم مثقفين مش فاهمين يعني إيه دستور ... ده بخلاف المسقفاتيه من كل التيارات بتوع الطبل والزمر للنظام العميل ..<br />طيب تعالوا نشوف الإنشا الغبي ده اللي مصرين يسموه دستور كان شغال بجد السنين اللي فاتت ولا مجرد كلام فارغ ما يساويش الحبر المكتوب بيه ؟؟؟ مش فخفخامة جلالة الواطي مبارك معطل الدستور من يوم ما حطوه الأمريكان على الكرسي بقانون الطواريء اللي مددوه تاني بعد ما قال إيه نجح في انتخابات الرئاسه؟؟؟<br />أنا عايز أفهم وعايز حد يفهمني ويستحمل غباوتي .. لمصلحة مين العك اللي احنا فيه ده ؟<br />ليه بندخل الناس في حوارات وجدل عقيم لا يجدي ؟<br />فين المثقفين بجد من ولاد بهيه عشان يفهم<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103146/http://masr.20at.com:80/article.php?sid=1376"

[[comments]]
order = 3
subject = "أنا رأيي الأخوان مايتعبوش نفسهم"
author = "أنا رأيي لا الإخوان ولا كفاية يتعبو نفسهم..."
posted = "2006-12-29"
text = "الشعب نايم في سابع نومة ... والإخوان وكفاية دايما هم اللي بيتصدروا ..وبعد كدة يطلع المتفلسفين علينا بنظريات المؤامؤة.... والحكومة تعتقل الإخوان....وينتهي الموضوع ...<br />واللي يغيظك إنك تلاقي مواطن أهبل بيقولك بتوع كفاية دول أمريكان...<br />أو واحد تاني يقول أصل بتوع الإخوان دول بيدغدغوا الناس بالدين ..<br />ياخي جتك دغدغة إنت وهو في حنكك..خليك نايم إنت..."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103146/http://masr.20at.com:80/article.php?sid=1376"

[[comments]]
order = 4
subject = "الاخوان المصريين الجمهوريين"
author = "زعبلة اللى كسر القلة"
posted = "2006-12-29"
text = "اليس الاخوان المسلمين مصريين والا يمكن جايين من كولا او كوالا لامبور<br />كلمة المسلمين دى هى اللى بتحرق فى طيز الغرب والاقباط والحكومة<br />طيب يا جماعة غيروا اسمكم الى الاخوان المصريين الجمهوريين علشان امريكا تنبسط بالجمهوريين دى<br />ويبطلوا يحطوكم فى المعتقلات<br />المعتقلات فيها 50 الف مصرى محدش بيجيب سيرتهم ولا حتى منظمات حقوق الانسان<br />عايشين ازاى واعتقلوا لية<br />وبقى لهم كم سنة فى المعتقلات<br />والاخر تقولى الدستور وتعديل الدستور<br />هو فية دستور اصلا"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103146/http://masr.20at.com:80/article.php?sid=1376"

[[comments]]
order = 5
subject = "الاخوان المسلمون"
author = "ابن البنا"
posted = "2006-12-31"
text = "دعوة الاخوان المسلمون اكبر وارفع من ان يمسها احدكم بسوء<br />بعدين دعوة الاخوان المسلمون دعوة عالمية وليست مصريه او كوالالمبويه مثل ما قال الاخ الكريم انفا<br />وصدقوني الاخوان المسلمون لا يبتغون اجرا من احدا ولا يريدون مصلحة شخصية وانما يريدون دوله اسلاميه , يشعر فيها الفرد انه انسان وليس بهيمة تسحب<br />واشكركم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103146/http://masr.20at.com:80/article.php?sid=1376"

[[comments]]
order = 6
subject = "واحد من الناس"
author = "الأخوان أجبن من ان يخوضوا هذه المعركة."
posted = "2007-01-02"
text = "أما من يقول ان العيب فى الشعب فهو للأسف لم يقرأ التاريخ جيدا و لم يتعلم سياسة فأى حركة تغيير فى العالم لم تخرج من الشعب بل تخرج مجموعة من الناس حزب او جماعة لتعرض افكارها بوضوح للناس و كيفية رؤيتها للتغيير فيؤيدها الناس فتنجح او يعرض عنها الناس فتفشل فتعمل على تطوير نفسها (أغلب حركات التغيير خرجت من تحت ضغط كبير من الحكومات ) فلو تكلمنا عن الاخوان مثلا كاكبر معارضه فى مصر خرج الناس معهم فى الانتخابات ووقفوا بقوة فى بعض المناطق اكتر من الاخوان انفسهم (كنت اعمل فى احد اللجان فى فترة الانتخابات)ثم ماذا أرنى بالله عليك ما فعله الاخوان..... نشطوا بقوة فى فترة الانتخابات ثم ....نوم عميق ....ليستيقظوا على اساءة النبى...نوم عميق.....فلسطين .....نوم عميق....لبنان................أين اوجاع الشعب نفسه اوجاع العامة .هم لم يشعروابنا لم يشعروا بغلوا الاسعار لم يشعروا بحوادث القطارات (البنزين و السولار)حادث العبارة و فى النهاية نعيب الشعب .....شعبنا يفتقد القيادة و الاخوان للأسف ليسوا أهل لها و لا يوجد من هو اهل لها لذلك الشعب يعيش فى التيه لكن العيب فى المعارضه وليس فى الشعب"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103146/http://masr.20at.com:80/article.php?sid=1376"

