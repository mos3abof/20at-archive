[[comments]]
order = 1
subject = "الوجه الآخر"
text = "لم يكن ظهور العالم الجديد لبحارة وقراصنة الإسبان والبرتغاليين، لم يكن سوى محاولة للإلتفاف حول الهيمنة الإسلامية عبر قارات العالم، فالدولة العثمانية كانت قد أوصدت مداخل البوسفور والدردنيل، والمماليك كانوا مسيطرين على الممرات المائية التي تصل شرق العالم المعروف بغربه، حين برزت فكرة الدوران حول الكرة الأرضية للوصول إلى الصين والهند وجزر الملايو، غير أن الهوة كانت هائلة الاتساع، بين ما فعل الإسبان والبرتغاليون حين دخلوا الأمريكيتين غزاة، وبين ما فعل المسلمون حين فتحوا بلاد الدنيا في المشرق والمغرب..<br />ما دخل الإسبان ومن خلفوهم إلى ذلك العالم بأخلاق الفروسية ورسالة الفاتحين أولي المجد والحضارة، لكنما بدناءة القراصنة وخسة اللصوص وانتهاز السفلة.. فأتوا على الأبرياء وقضوا على الحضارات التالدة، وطمسوا ثقافات أهل الحواضر والبوادي في تلك القارات والجزر..<br />كانوا ينشئون عالماً آخر لهم.. لهم وحدهم، بمقاييسهم الخاصة، ومفاهيمهم الخاصة.. يطمسون فيه كل ملامح الماضي، ويتحررون فيه من قيود الحاضر، ليصنعوا لأنفسهم المجد الذي أرادوا على الوجه الذي يرغبون..<br />وإن ما يحدث اليوم، ليس سوى امتداداً لما حدث بالأمس، وقد صدقت في كل هذه الأحداث كلمة كولومبوس حين اكتشف العالم الجديد... \"الآن التف الحبل حول عنق العالم الإسلامي، وبقى أن نشدد الخناق\"<br />إنني أستطيع أن أتخيل مدى حنق ذلك الرجل حين نزل إلى \"كوبة\" فوجد على صخور الجبال والجدران المتهالكة عبارات عربية وبقايا آيات من القرآن الكريم ثم مسجد قديم بمأذنة تقف أعلى التل شامخة شاهدة على عظمة أمة ومجد حضارة لم تدخر وسعاً أن توصل رسالة الحق والخير والسلام إلى أبعد بقعة معروفة على سطح الأرض.."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231620/http://www.20at.com:80/article.php?sid=184"

[[comments]]
