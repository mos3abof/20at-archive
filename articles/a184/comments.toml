subject = "1492"
text = "... نعم كانت أمريكا محاولة خلق عالم جديد بعيدا عن سيطرة الثقافة الاسلامية .. خلق مركز جديد للعالم على هامشه الغربي .. أليست مفارقة أنه في العالم 1492 .. تسقط دولة الاسلام في الاندلس وتكتشف أمريكا أيضا بدعم وتمويل ملكة أسبانيا .."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231620/http://www.20at.com:80/article.php?sid=184"

[[comments]]
order = 4
subject = "سبحان الله"
text = "كأن تكوين امريكا او اكتشافها جاء كدرس كبير علي العالم ان يفهمه..كيف تأتي الثروة خالصة مصفاة..وكيف يتصرف الإنسان في هذه الثروة ويستعمل هذه القوة..كيف يهدر وكيف يبني..كيف يكسب وكيف يخسر الأعداء..امريكا مع كل ماكتب عنها تبقي دولة تستحق التأمل والقراءة من جديد."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231620/http://www.20at.com:80/article.php?sid=184"

[[comments]]
order = 5
subject = "وحشية مبكرة"
text = "كانت أمريكا تمثل في أغلب الأذهان صورة مفعمة بالحيوية ، كانت شباب العالم وكان الحلم الأمريكي طازجا ، لكن ألم يتكشف لنا بعد أن الحلم كان بائتا وفاسدا ومرا كالعلقم ، وأن الصورة الذهبية اللامعة للعالم الجديد لم تكن كما صورتها كاميرات هوليود ، ولكن ..كانت كما صورتها الحقيقة على أكتاف الجثث السوداء للعبيد المستجلبين"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231620/http://www.20at.com:80/article.php?sid=184"
