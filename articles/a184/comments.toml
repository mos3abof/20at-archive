subject = "السلام عليكم"
text = "الأخ الكريم ..الوجه الآخر ..ماذكرته من معلومات جميل ورائع و جديد بالنسبة لي علي الأقل وأري انه موضوع رائع خاصة انك كاتب ماهر كما بدا في مداخلتك..ليتك تقوم بعمل موضوع عن هذا الأمر لعشرينات..شكرا لك ولجديتك.<br />أ نصرالدين"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231620/http://www.20at.com:80/article.php?sid=184"

[[comments]]
