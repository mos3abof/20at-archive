subject = "السنيورة"
author = "قال رئيس وزراء لبنان فؤاد السنيورة ان الحكومة اللبنانية لم تكن علي علم بهجمات حزب الله ضد اسرائيل علي الحدود. وقال السنيورة في بيان صادر عن مجلس الوزراء عقب اجتماع طاريء ان الحكومة اللبنانية لم تكن علي علم وهي لا تتحمل مسؤولية ولا تتبني ما جري ويجري من احداث علي الحدود الدولية ."
posted = "2006-07-13"
text = "وادان السنيورة القصف الاسرائيلي علي جنوب لبنان وقال ان حكومته ستدعو الي عقد جلسة طارئة لمجلس الامن الدولي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125145/http://www.20at.com/article2.php?sid=1068"

