subject = "وزير الدفاع العبري"
author = "وقال بيريتس في مستهل اجتماع للجنة الخارجية والدفاع في الكنيست (البرلمان اسرائيلي) \"لن نسمح لحزب الله بالعودة الى المواقع التي كان يحتلها على امتداد الحدود\" قبل ان يشن عملية ادت الى اسر جنديين اسرائيليين."
posted = "2006-07-13"
text = "وقال بيريتس \"وحده الجيش اللبناني يجب ان يتحرك في هذا القطاع (جنوب لبنان) وينشر قوات. واذا لم تنشر الحكومة اللبنانية قواتها المسلحة مثلما يتحتم على حكومة ذات سيادة ان تفعل، فلن نسمح لقوات حزب الله بالتموضع مجددا من الجانب الاخر من الحدود\". واضاف وزير الدفاع \"لن نقبل بعد الان ان تهدد منظمة ارهابية سكان شمال اسرائيل بتأييد من حكومة ذات سيادة\".<br />عامير بيريتس وزير الدفاع الإسرائيلي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125145/http://www.20at.com/article2.php?sid=1068"

