subject = "السفير طلع وطني"
author = "استدعي السفير اللبناني في واشنطن فريد عبود الي بيروت امس الاربعاء، كما افاد مصدر رسمي."
posted = "2006-07-13"
text = "واوضح وزير الاعلام غازي العريضي ان هذا القرار اتخذ بسبب تصريحات عبود المتناقضة مع الموقف الرسمي اللبناني. وأدلي عبود بتصريحات لوسائل الاعلام الامريكية علي علاقة بالتوتر القائم في جنوب لبنان اثر أسر حزب الله اللبناني جنديين اسرائيليين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125145/http://www.20at.com/article2.php?sid=1068"

