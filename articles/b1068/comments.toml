order = 0
subject = "الخنازير مرعوبين"
author = "سمع دوي انفجار في شوارع مدينة نهاريا المقفرة شمال اسرائيل, ثم انفجار ثان. ستة صواريخ كاتيوشا اطلقها حزب الله من جنوب لبنان استهدفت المدينة واشاعت الخوف بين سكانها الذين اختار بعضهم الرحيل الخميس 13-7-2006."
posted = "2006-07-13"
text = "وقالت راشيل وهي تضع يديها المرتجفتين حول عنقها \"انا في صدمة. اريد الرحيل. انا خائفة\". وفي ساعات الصباح الاولى, قتلت امرأة في نهاريا جراء انفجار صاروخ كاتيوشا اطلقه حزب الله الذي قام الاربعاء باسر جنديين اسرائيليين. وبدأت اسرائيل الاربعاء هجوما واسعا على لبنان اوقع عشرات القتلى معظمهم من المدنيين.<br />ومنذ يومين, يعيش سكان نهاريا القريبة من الحدود اللبنانية في الملاجىء وسط دوي انفجارات الكاتيوشا والقصف المدفعي والجوي الاسرائيلي على جنوب لبنان. وفي حي ترومبلدور, كانت سيارات الاسعاف تمر بسرعة كبيرة مطلقة العنان لصافراتها, في حين كانت سيارات الشرطة تذيع عبر مكبرات الصوت \"القصف كثيف. عودوا الى الملاجىء\".<br />وفي ملجأ مؤلف من غرفتين واسعتين بجدران اسمنتية, تجمع سكان مبنى بانتظار نهاية الانذار جالسين على اسرة معدنية. واحتضنت دانا غوزلان, ابنة السابعة عشرة اختها الباكية ايفات تواسيها بعد سماع صوت انفجار. وتقول دانا \"نريد الرحيل من المدينة لكن الوضع خطير\". وتضيف امها \"اذا ذهبنا في السيارة قد يصيبنا صاروخ\". وفي وسط المدينة ترك انفجار صاروخ كاتيوشا اثرا في احد الشوارع الذي تحطمت واجهات متاجره المغلقة.<br />وتقول راشيل حجاج (41 عاما) \"افقت على صوت انفجار. شممت رائحة حريق ونزلت ووجدت الجرحى\". وتقيم راشيل فوق مطعم \"الشيخ والبحر\" الذي اصيب صاحبه بجروح خطيرة. \"الناس يرحلون من المدينة\", تضيف راشيل التي شاهدت جيرانها يضعون امتعتهم في سيارتهم.<br />وبالقرب من المكان كانت تال الكابتس (17 عاما) تتفقد المكتب العقاري الذي تعمل فيه والذي اصيب باضرار كبيرة. وتقول \"ساعود الى بيتي. انا ارتجف من الخوف, هذه اول مرة يحصل فيها هذا\". وما ان يسمع دوي انفجار, حتى يخرج فتية الى الشارع ليتحققوا من مكان سقوط الصاروخ. ويصرخ بهم رجال الشرطة \"اذهبوا. ليس هناك ما تشاهدونه, هذا خطر عليكم. انزلوا الى الملجأ\".<br />وقالت شرطة نهاريا ان امرأة قتلت واصيب ثمانية اشخاص بجروح الخميس. وفي المقابل, قتل قرابة اربعين لبنانيا بينهم 15 طفلا في الغارات الاسرائيلية على لبنان. وتجاهلت بنينا سريتاك (49 عاما) التحذيرات واصرت على فتح المقهى الذي تملكه.<br />لكن احدا لم يجرؤ على المجىء اليها. وتقول \"فتحت المقهى. حزب الله لن يمنعنا من ان نواصل حياتنا الاعتيادية\". وعلى رصيف المقهى, كان يائير بومين (33 عاما) يتأمل سحابة من الدخان في البعيد. هناك تسبب انفجار كاتيوشا بحريق. ويقول بومين \"منذ ست سنوات وبعد الانسحاب من لبنان لم نشهد مثل هذا العنف\". ويعيش الرجل في كيبوتس (قرية تعاونية) على مشارف المدينة. ويضيف \"لبنان مسؤول, وليس فقط حزب الله. نحن بلا شك متجهون نحو حرب جديدة\"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125145/http://www.20at.com/article2.php?sid=1068"

