[[comments]]
order = 6
subject = "السبروت"
author = "اعرب كبير المفاوضين الايرانيين حول الملف النووي الايراني علي لاريجاني في سوريا عن دعم ايران \"للمقاومة الفلسطينية واللبنانية ضد اسرائيل\" على ما افادت اليوم الخميس وكالة الانباء الايرانية الرسمية. واكدت الوكالة ان لاريجاني وهو الامين العام للمجلس الاعلى للامن القومي اجرى مساء الاربعاء محادثات مع القادة السوريين وقياديين في الحركات الفلسطينية لا سيما حركتي الجهاد والمقاومة الاسلامية (حماس) والجبهة الشعبية لتحرير فلسطين القيادة العامة."
posted = "2006-07-13"
text = "واضافت الوكالة ان لاريجاني اعرب عن \"دعم الجمهورية الاسلامية الثابت لكل حركات المقاومة الفلسطينية واللبنانية ضد اسرائيل\"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125145/http://www.20at.com/article2.php?sid=1068"

[[comments]]
order = 7
subject = "المتحدث الرسمي باسم الابطال"
author = "حذر ممثل حركة المقاومة الاسلامية (حماس) في لبنان اسامة حمدان اليوم السبت في مقابلة مع صحيفة نروجية من ان عمليات خطف الاسرائيليين ستتواصل طالما لم تفرج اسرائيل عن المعتقلين الفلسطينيين وذلك ايا كانت نتيجة الهجوم الاسرائيلي في غزة."
posted = "2006-07-13"
text = "وحذر المسؤول في حركة حماس السبت عبر النسخة الالكترونية لصحيفة \"افتنبوستن\" من \"ان الفلسطينيين سيقومون باي شيء لتحرير ابنائهم وبناتهم واشقائهم ونسائهم من السجون الاسرائيلية\".<br />واضاف حمدان في اتصال هاتفي معه في لبنان من اوسلو \"ان عمليات الخطف ستتكثف طالما لم يتم الافراج عن الفلسطينيين وايا كانت نتيجة الغزو الاسرائيليي في قطاع غزة\" لان \"اسرائيل لم تفرج ابدا عن معتقلين فلسطينيين لاسباب اخرى\".<br />وقد أسر العسكري الاسرائيلي جلعاد شاليت في 25 يونيو في هجوم فلسطيني على موقع عسكري اسرائيلي جنوب الدولة العبرية قرب قطاع غزة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125145/http://www.20at.com/article2.php?sid=1068"

