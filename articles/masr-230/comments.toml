[[comments]]
order = 0
subject = "لو طفيت النور؟؟؟"
author = "sara"
posted = "2006-04-27"
text = "فعلاٍٍٍٍ احنا محتاجين نطفى النور بجد نقعد قاعدة صراحة و نعمل حوار صريح مع نفسنا يمكن ربنا يفرجها من عنده ونقدر نعمل حاجة لبلادنا اللى مظلومة فى الدنيا واحنا كمان مظلومين معها انابجد ساعات كثير قعد اعيط مع نفسى على البلد وقعد اقول لنفسى يا ترى بلدنا هتنتهى ولو انتهت يبقى امتى والساعة كام ويترى احنا هنكون عايشين بس عشان البلد دى تتصلح ابدائوا بالشباب احنا عندنا شباب كتير ضايعة ما بين المخدرات وروبى,دانا,نانسى,هيفا,تينا,ماريا,video clipsجاد شويرى,التعليم,البطالة ولو انتوا شباب يعنى سنكوا أقل من27 انا هفرح لانى فى شباب بتحب البلد بجدوربنا يوفقكم"
archived = "2006-05-13"
capture_url = "https://web.archive.org/web/20060513042941/http://masr.20at.com:80/article.php?sid=230&PHPSESSID=7c371a24ae1ded446717ebb456d40af2"

[[comments]]
order = 1
subject = "معناها إية"
author = "لميس"
posted = "2006-04-27"
text = "معناها إية نطفى النور للناس إل غوية تضييع وأت هتخدها بمعنى مفيش مزكرة مفيش شغل مفيش أي حاجة في بس نعد ناكل عشان الأكل إل في الثلاجة ميخربش (خصارة )<br />أما لما يكون معناها إعادة التفكير في المستأبل والحلم المصري( فلحكومة هتأول بلاش منه أحسلك خلي النور شغال والكهربة على الحكومةولا يهمك )كدب<br />أما بأة في جو الرمانسية فدا بس للحبايب بس الناس إل مجروحة وعندها بأس هتعد تعيطعلى بختها<br />أما الناس الهااااااااااااي فمهتسدأ كل واحد يأضلو ساعة يعاكس فيها من ورى السيتار<br />أما عني أنا فمشهأول إني مش هعد أغني ظلموة بس بعد التفكير و العياط على حال مصر هنزل الشارع و هصوة وهأول(إصحو مصر بتضيع وإحنا بنضيع معاها ،مصر محتجانا يا ناس )"
archived = "2006-05-13"
capture_url = "https://web.archive.org/web/20060513042941/http://masr.20at.com:80/article.php?sid=230&PHPSESSID=7c371a24ae1ded446717ebb456d40af2"

[[comments]]
order = 2
subject = "ساعه مع الشموع"
author = "نيفين"
posted = "2006-04-27"
text = "و ده مش كلام رومانسى<br />لا بجد<br />قضى ساعه و انت بتتفرج على شمعه بتدوب قدامك علشان تنورلك<br />الشمعه<br />الكائن الرقيق الجميل اللى بيحرق علشان غيره<br />و مفيش مانع فعلا نعيط على وضعنا الهباب و احنا بنتفرج على الشموع<br />البلد دى راحه ف داهيه"
archived = "2006-05-13"
capture_url = "https://web.archive.org/web/20060513042941/http://masr.20at.com:80/article.php?sid=230&PHPSESSID=7c371a24ae1ded446717ebb456d40af2"

