[[comments]]
order = 1
subject = "متستعجبشى متستغربشى"
author = "نيفين نيفى نوفا"
posted = "2006-09-03"
text = "و ايه الغريب<br />متستعجبوش على راى اسماعيل ياسين<br />انا كنت من كام يوم ف راس البر و فيه مكان هناك اسمه اللسان و اللسان للى ميعرفش راس البر هو مكان ترفيهى للناس<br />يتفرجو على البحر و يتكلمو و يلعبو و الشباب يغنو او يسمعو اغانى<br />و لاقيت بعد التجديدات اللى حصلت لوحه كبيره مكتوب عليها ممنوع ارتفاع الصوت<br />طيب و الناس اللى بيبقى نفسها تغنى او تفرفش تعمل ايه تنكتم<br />و الاكتر من كدا ان مخالفه التعليمات ستكلفك 100 جنيه<br />ان شاء الله بعد كده هيتعمل لكل مواطن حظر تجول ف بيته بعد الساعه 9"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145059/http://www.20at.com/article2.php?sid=1181"

[[comments]]
order = 2
subject = "من يتقي الله"
author = "وفاء &وليد"
posted = "2006-09-04"
text = "الي راسل الرساله الخاصة بالسب علي الرئيس واسرته وتقول اتقوا الله من ياأخى بالله يتقي الله هناك النقد ليس في شخص الرئيس او اسرته ولكن النقد في القضيه ذاتها هؤلاء الذين تكيل عليهم السباب اولي الأمر الذي امرنا الله عزوجل بطاعتهم ياأخي اين الأخلاق في تلك الألفاظ النابيه الخادشة تخيل بالله عليك لو ان اختك قرات هذه الألفاظ اوبنتك اوابنك هذه هي الأخلاق واذا كانت هذه هي الفاظ الذين يحاولون انقاذ المجتمع فليغرق المجتمع ولا حاجه لنا بكم فإذا( ذهبت الأخلاق ذهب المجتمع )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145059/http://www.20at.com/article2.php?sid=1181"

[[comments]]
order = 3
subject = "النةم"
author = "حكمت على احمد حسن"
posted = "2006-09-10"
text = "الخت ماريا نامت فى الطائرة والحمد للة بسلامة رجعت لاسرتها الكريمة لاكن عندنا ماشاء اللة اللى ينام فى الموصلات ممكن يروح الاخرة من غير حتى ما ينطق الشهادة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145059/http://www.20at.com/article2.php?sid=1181"
