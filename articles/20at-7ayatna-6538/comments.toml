[[comments]]
order = 4
subject = ""
author = "هبه عاشور"
posted = "2007-07-03"
text = "مش هأقدر اقول غير … تفاهة وعالم فاضية .. لو عندنا حاجة تشغلنا ما كناش اهتمينا بأى برامج تافهة زى كده ..<br />أنا لا أنقد القائمين على البرنامج لكن أنقد اللى بيتابعوه واللى هم السبب الرئيسى فى نجاحه … عيبنا اننا عندنا انفصام فى الشخصية … مثلا تلاقى واحد عمال يشتم فى بنات الفيديو واللى بيعملوه ومع ذلك طول اليوم قاعد أمامها<br />الحل لكل البرامج التافهة اننا نتجاهلها .. وده مش هيحصل إلا لو شغلنا وقتنا .. ونلغى كلمة وقت فراغ من حياتنا … اشتغلوا فى أى حاجة .. عمل تطوعى - رياضة - كورسات .. أى حاجة واملوا دماغكم بحاجة عدلة"
archived = "2009-08-02"
capture_url = "https://web.archive.org/web/20090802053756/http://www.20at.com:80/20at/7ayatna/6538.html"

