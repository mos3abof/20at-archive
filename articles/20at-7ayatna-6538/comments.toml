author = "ادم المهدى"
posted = "2007-07-03"
text = "سلام عليكم<br />الاخت اللى قالت ان هم ناس فاضية و تفاهه ممكن يكون تاهت عن بالها ان هم بيخططولنا ليل نهار علشان يبوظونا ، و عشان يمحوا عقيدتنا اللى اغلى حاجة عندنا جوا صدرنا ، و لازم نبص للموضوع ده بنظرة ان احنا نشتغل و نتحرك بدينا ، سواء نعمل على النت اعلام هادف او نكلم اصحابنا او على الاقل نفسى<br />و اختم بآية تبين دورنا كمسلمين ( كنتم خير امة اخرجت للناس تأمرون بالمعروف و تنهون عن المنكر ) لو ربنا واخد عننا الفكرة دى هل احنا قد التصور ولا لا!!!<br />ادخل على مدونتى<br />www.ademelmahdy.blogspot.com"
archived = "2009-08-02"
capture_url = "https://web.archive.org/web/20090802053756/http://www.20at.com:80/20at/7ayatna/6538.html"

