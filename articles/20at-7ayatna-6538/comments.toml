text = "عريس و عروسة<br />إيه ده !! بالله عليكم فى برنامج فعلا بيحصل فيه كدة؟؟ ولا انتوا بتهزروا ؟؟ ولا أنا بحلم ..<br />ولا إيه…؟؟<br />إخيه على كدة يا جدعان…لا والله إحنا حقيقى ف آخر الزمان ..؟؟<br />وتقولى عريس وعروسة وثالثهما الشيطان ..وتخلينى آجى على ملا وشى عشان أقرا المقال..ياعم كنت إكتب (زانى و زانية وثالثهما المشاهد ) ..(ساقط و ساقطة وثالثهما واحد مغفل) أى حاجة كدة؟؟؟<br />يالا كل حاجة قسمة ونصيب؟؟<br />oosaamaaa@yahoo"
