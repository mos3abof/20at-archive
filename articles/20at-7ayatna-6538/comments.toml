text = "يانهار ابيض الجواز ده يبقى مهزلة لو اكتمل بالطريقة دي يا رضوى كان عندك حق في موضوعك انا مشفتش البرنامج بس فهمت الموضوع من التفاصيل اللي سردتيها وكمان ازاي واحدة تهرب من اهلها وتبقى متوقعة ان الناس تتعاطف معاها ناس فاضية والله مالها الخطبة وماله الجواز التقليدي ..<br />عموما لايفوتني في هذا الموقف ان اتذكر مقولة المطرب المشهور حسام حسني ماتفتكروش يا بنات ان الجواز راحة…"
archived = "2009-08-02"
