[[comments]]
order = 4
subject = "يسمع من بقك ربنا"
author = "سمسمة"
posted = "2006-03-21"
text = "يااااااااااااااااااااااه لو تنحى البعيد فيه حاجات كتير قوي هاتتغير اولا: هانفرحج ونمشي في الشوارع نقول اننا عشنا وشفنا رئيس تاني لمصر ياولاد لاننا ولقلة حظنا من يوم مااتولدنا وهو الريس بتاعنا<br />ثانيا: ممكن نحلم او نتمنى او حتى نسرح بخيالنا اننا نلاقي شقة وتنتجوز بعد ان فقدنا الامل وقررنا نقضيها زيرات للاهل وخروجات ع الكورنيش<br />ثالثا:ممكن برضه نحلم يكون عندنا عيال لاني بصراحة كنت فقدت امل في الموضوع ده مش عشان الشقة بس لكن كمان عشان الواحد بصراحة مش هايخلف عيال وبيهدلهم في البلد دي وهي محتاسة كده ومالهاش كبير<br />ثالثا:هارجع اسمع الاغاني الوطنية تاني لاني بصراحة كرهت الاغاني الوطنية والتلفزيون المصري والوطنية عموما لاجل عيون حسنس مبارك لان كل واحد قبل كل اغنية لازم يحط اسمه الله يــــــــ....<br />رابعا: الواحد ممكن يمشي في البلد براحته من غير حرقة دم من كثر الاماكن اللي متزينة باسمه مستشفى مبارك مدرسة مبارك وسلم مبارك ومكتبة مبارك وكوبري مبارك الله لا يبارك فيه البعيد<br />اما خامسا بقه فهي اني انسى كل الاماني والاحلام دي لو حضرته تنحى عشان الننوس يمسك مكانه في الوسية اللي سيبهاله الغالي وساعتها فيه حل واحد اني اهج واسيب البلد دي عشان عائلته تستريح"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205556/http://masr.20at.com:80/article.php?sid=48&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

