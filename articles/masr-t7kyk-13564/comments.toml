subject = ""
author = "مجرد اشاعات"
posted = "2009-09-29"
text = "هناك اشاعات بان وزير الصحة صرح بانة اعد مدافن جماعية ل 8 مليون مصرى سيصابون بانفلونزا الخنازير<br />وان الحكومة تنوى التخلص من معتقلى الاخوان والجماعات بحبسهم فى زنزنات ضيقة مزدحمة ليصابوا بانفلونزا الخنازير ويموتوا<br />كلام كتير بنسمعة على القهوة بعد سيجارتين بانجو هناك من يقول ان ايمن نور هو هدف انفلونزا الخنازير الاول<br />الاشاعات مالية القهاوى ومفيش مسئول حكومى بيطلع فى التليفزيون يقول للناس الحقيقة وفية اسر كتيرة لن ترسل اطفالها للمدارس<br />وربنا يستر والخريف بدا والليل بدا يبرد وموسم الانفلونزا اوشك على القدوم"
archived = "2009-10-02"
capture_url = "https://web.archive.org/web/20091002233655/http://www.20at.com:80/masr/t7kyk/13564-2009-09-29-12-14-53.html"

[[comments]]
order = 1
subject = ""
author = "تعهد بماذا ؟"
posted = "2009-09-29"
text = "ومن اثار هذا التطعيم التخلف العقلى للاطفال<br />الضعف الجنسى وعدم الانتصاب للرجال وحيوانات منوية مشوهة تنتج اجنة ناقصة واجهاض مبكر<br />تليف الكبد السريع<br />يبقى مين اللى هيوقع على تعهد بتدمير حياتة<br />ممكن نتحمل انفلونزا الخنازير انما بلاوى التطعيم فربنا يعفى البلاد والعباد"
archived = "2009-10-02"
capture_url = "https://web.archive.org/web/20091002233655/http://www.20at.com:80/masr/t7kyk/13564-2009-09-29-12-14-53.html"

[[comments]]
