author = "نموت بالانفلونزا"
posted = "2009-09-30"
text = "طبعا اسهل نموت بالانفلونزا ولا نموت بالتطعيم ( الفاكسين)<br />اللة يخرب بيوتهم<br />انا رايى ان انفلونزا الخنازير دى اشبة بزكام جامد شوية وزى ما بنتعامل مع الزكام نتعامل مع انفلونزا الخنازير"
archived = "2009-10-02"
capture_url = "https://web.archive.org/web/20091002233655/http://www.20at.com:80/masr/t7kyk/13564-2009-09-29-12-14-53.html"
