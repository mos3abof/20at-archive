[[comments]]
order = 3
subject = "نم فى سلام نومة الأبطال"
author = "مناضل أنترنتى قديم"
posted = "2006-04-12"
text = "السلام عليكم و رحمة الله و بركاته<br />إليك يا سعد أنت و كل من هم على شاكلتك<br />إلى كل من رفض الخنوع او الذل<br />إلى من تجرى فى عروقهم دماء الرجوله و الحريه<br />إلى رجل لم أقرء عنه من قبل إلى عن طريق هذا المقال<br />إلى أبطالنا فى كل مكان و زمان إلى سليمان خاطر إلى الشيخ أحمد ياسين إلى الدكتور عبد العزيز الرنتيسى إلى رامى عياش إلى الدكتور يحى المشد إلى أيمان حجو إلى محمد الدره إلى كل من نالتهم يدالغدر و الخيانه<br />اهديهم هذه الكلمات<br />نم فى سلام نومة الأبطال<br />واترك حماس ترد كالزلزال<br />بطلا حيت برغم ألوان الاسى<br />أفلا تموت اليوم كالأبطال<br />هذا قدر الأبطال من لا يطيقون العيش إلا أحرار رفض سعد كغيره من الرجال ان تتلاقى ايدينا مع ايدى القتله رفض ان نجلس لنتفاوض معهم و دموع الثكالى لم تجف بعد<br />رفض ان نتبادل الورود ودماء الشهداء لا تزال ساخنه فوق أرض سيناء و الجولان<br />رفض سلام الاستسلام و نحن خير أمة أخرجت للناس<br />رفض ان يهنأ له العيش و الأسرى فى السجون<br />وقف شامخا صامدا كم يقف النخيل و مات واقفا كما تموت الأشجار<br />سجل يا تاريخ ولاد بلدى بيموتوا على موائد اللئام<br />انت الأن فى نعمه يا سعد لانك لما ترى عارنا و الامانا فاصبحت دمائنا فى كل مكان لم تعد فقط فى القدس وسيناء والجولان<br />أصبح لنا فى كل ساعه موكب شهيد<br />بل قل فى كل دقيقه قطرة دم تراق<br />لا أملك إلا ان أقول لك أنت و من هم على شاكلتكم<br />أيها المجانين العقلاء ناموا فى سلام"
archived = "2006-04-15"
capture_url = "https://web.archive.org/web/20060415170849/http://masr.20at.com:80/article.php?sid=155"

[[comments]]
order = 4
subject = "سعد حلاوة...مقدرش يخون"
author = "احمد الشيخ"
posted = "2006-04-13"
text = "بسم اللة الرحمن الرحيم انا مندهشتش من الخبر لانانا اتعود وغيرى اتعود على هذا الحال فى مصرمنذعهد محمد على والدكتاتورية بدات تحكم مصر لكن فية شىء مهم لابد من التعليق عليةهو الى عملة سعدحلاوة عمر ما كان علشان اوصل راى للاخرين افزع الامنينحرية الراى فى الاسلام ليها احترامها وليها تقديرها لكن مش بالصورة الى قراتهالكن هاقول كلمة اخيرة للناس جميعا وهى كلمة قالتها اسماء بنت ابى بكر لابنها الزبير بن العوام هى ارى يا بنى تموت شهيدا خيرا من ان تتبع فاسقا لاءيما ... وانا بقول ان الاسلام راجع قريب وهنفتكرك با سعد واللة يرحمك"
archived = "2006-04-15"
capture_url = "https://web.archive.org/web/20060415170849/http://masr.20at.com:80/article.php?sid=155"

