[[comments]]
order = 14
subject = "ماذا تظنون بكلام الله -عز وجل-"
author = "islam_physics@yahoo.com"
posted = "2006-04-20"
text = "إنها كلمات الله -عز وجل- فالروعة ليست فقط في جمال القصة وإنما أيضا في أسلوبها المحكم-صنع الله الذي أتقن كل شئ- فمن هنا نستشعر هذه الكلمات فكم كتب الشعراء من كلمات نعدها من أعظم ما كتب لغويا وتصويرا إمتاعا ولكن ماذا يكون بجوار كتاب ينطق بالحق ..لا يأتيه الباطل من بين يديه ولا من خلفه ..من لدن حكيم خبير .<br />وعن الموضوع ففكرته جميلة وأنا أهنيكي عليه وجزاكي الله خيرا ولكن لا يروقني هذا الأسم وهو سينما القرآن فكيف فالقرآن ليس كتاب قصص وروايات وإنما هو دين كامل ومعجزة من الله يؤيد بها رسوله فتكون عندنا أعظم قدرا ونحكي عنها بأجل الكلمات.. ففي زماننا هذا يتبادر إلى الذهن حقارة السينما التي باتت تعج بكثير من التافاهات فكيف نشبه ما يأتي في القرآن بمثل هذه التفاهات وأنا لا أجه إليكي الإنتقاد فقط هي نصيحة من غيور علي دينه وعلي قرآنه وأنا متأكد أن عندك وعند كل المسلمين نفس الغيرة والحب ولربما كان وأكثر .<br />وصوت قائكي جميل فجزاه الله خيرا<br />أخوكم<br />إسلام عبد السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124227/http://www.20at.com/article2.php?sid=659"
