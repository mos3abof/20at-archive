[[comments]]
order = 4
subject = "نظرة من حلم"
author = "aroundu_4"
posted = "2006-04-05"
text = "نظرة من حلم<br />حينما أمر بجوار الجامعة<br />حينما تهفو رائحة الكلية<br />أتذكر ... أتطلع .. أتشوق ..<br />كنت هناك.. بل.. هنا في هذا الموضع<br />لا بل هذا المكان ..<br />هنا أكلت .. وهنا شربت ..<br />أنظر.. هناك ضحكت ملأ السمع والبصر..<br />أما هنا بكيت وصرخت وضخبت ...<br />وهنا شاركت وضحيت .. وهناك قلت وسمعت ..<br />أما في هذا الموضع نمت وتألمت ...<br />أري ..وأسمع همساتهم ونبراتهم ..<br />أري وجوهاً تأتي وتختفي ... تضحك وتبكي ..<br />أحبهم....... كلهم ....<br />هذا المسجد شاهدٌ عليَ .. وهذا مكاني المفضل يأنُ لفراقي ...<br />جلسنا هنا في هذا الممر علي البلاط .. وتسامرنا معاً ..<br />يااااااااااه .. لحظه من عمر .. يا ليتها لم تنقضي ..<br />أما هنا صنعت لهم كرة لنلعب بها ...<br />وهنا قلت لهم فكرة لنسمو بها...<br />ياااااااه لَكم سهرنا وتعبنا ... ولَكم قلنا وسمعنا ....<br />ولَكم فكرنا ورسمنا وخططنا.....<br />يااااااااااه .. لحظه من عمر .. يا ليتها لم تنقضي ..<br />حلم جميل .... لم يكتمل ....الأيام تفرق ولا تجمع..<br />الجامعة ... الأصدقاء ... الأحباء .... كلهم .........<br />حلمٌ تسمو به أعلي الخيال ...<br />واقعٌ تقوي به علي كل حال ...<br />نظرة بعمر ...من خيال ... من حلم ...<br />aroundu_4<br />ماشي ومش ماشي<br />أسير في بحر طويل مثقل الكتفيين تكاد أرجلي أن تهوي مع نسمة ريح<br />أكاد أعيا وجفوني لا تقوي علي النظر<br />ويداي مخدرتان ..مقيدتان كأنهما الذل<br />ويداعبني حلم جميل لا أستطيع التنازل عنه ...<br />حتي أتذكر ( ذنوبك قد قيدتك )...........<br />أنتفض ... أقوي ... أقوم ....<br />لا أستطيع ...<br />أستغفر ... فأسمع ..الله أكبر ...فأصحو من غفلتي لأصلي الفجر...<br />aroundu_4<br />أرسلوا لنا لتعبروا عن مشاعركم.....<br />http://groups.yahoo.com/group/aroundu_4/"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124227/http://www.20at.com/article2.php?sid=659"

