[[comments]]
order = 6
subject = "الشهيد سيد قطب.."
author = "حسن الهيثمي"
posted = "2006-04-05"
text = "الموضوع جيد و ذكرني بماكتبه الشهيد سيد قطب، في كتابه الرائع{التصوير الفني في القرآن}حيث قال رحمه الله :{إن للمفردات القرآنية دلالة عظيمة على جمالياته .. ومن ذلك أنها موضوعة في الأصل اللغوي تعبيراً عن روائها وحسنها ..<br />فالقرآن العظيم اتخذ بعضها في صورة فنية ، أو تشبيه رائع ، أو كناية بديعة ، أو إسناد بليغ ..<br />ومن الجوانب التي يُنظر فيها إلى جماليات المفردات القرآنية أن يستقلّ لفظ واحد برسم صورة شاخصة .. تارة بجرسه الذي يلقيه في الأذن .. وتارة بظله الذي يلقيه في الخيال .. وتارة بالجرس والظلّ جميعاً ..<br />تقرأ قوله تعالى : \" يَا أَيُّهَا الَّذِينَ آمَنُواْ مَا لَكُمْ إِذَا قِيلَ لَكُمُ انفِرُواْ فِي سَبِيلِ اللّهِ اثَّاقَلْتُمْ إِلَى الأَرْضِ\" (التوبة : 38) ، فتسمع الأذن كلمة (اثّاقلتم) ، فيتصوّر الخيال ذلك الجسم المثّاقل ، يرفعه الرافعون في جهد ، فيسقط من أيديهم في ثِقَل . إن في هذه الكلمة طنّاً على الأقلّ من الأثقال . ولو أنك قلت : تثاقلتم ، لخفّ الجرس ، ولضاع الأثر المنشود ، ولتوارت الصورة المطلوبة التي رسمها هذا اللفظ ، واستقلّ برسمها ..<br />وتقرأ قوله تعالى : \" وَإِنَّ مِنكُمْ لَمَن لَّيُبَطِّئَنَّ \" (النساء : 72) ، فترتسم صورة التبطئة في جرس العبارة كلها ، وفي جرس (ليبطئنّ) خاصّة . وإن اللسان ليكاد يتعثّر وهو يتخبّط فيها ، حتى يصل ببطء إلى نهايتها ..<br />وتقرأ قوله تعالى : \" قَالَ يَا قَوْمِ أَرَأَيْتُمْ إِن كُنتُ عَلَى بَيِّنَةٍ مِّن رَّبِّيَ وَآتَانِي رَحْمَةً مِّنْ عِندِهِ فَعُمِّيَتْ عَلَيْكُمْ أَنُلْزِمُكُمُوهَا وَأَنتُمْ لَهَا كَارِهُونَ \" (هود : 28) ، فتحسّ أن كلمة (أنلزمكموها) تصوّر جوّ الإكراه بإدماج كل هذه الضمائر في النطق ، وشدّ بعضها إلى بعض ، كما يدمج الكارهون مع ما يكرهون ، ويشدّون إليه وهم منه نافرون ..<br />وتقرأ قوله تعالى : \" وَالَّذِينَ كَفَرُوا لَهُمْ نَارُ جَهَنَّمَ لَا يُقْضَى عَلَيْهِمْ فَيَمُوتُوا وَلَا يُخَفَّفُ عَنْهُم مِّنْ عَذَابِهَا كَذَلِكَ نَجْزِي كُلَّ كَفُورٍ * وَهُمْ يَصْطَرِخُونَ فِيهَا رَبَّنَا أَخْرِجْنَا نَعْمَلْ صَالِحًا غَيْرَ الَّذِي كُنَّا نَعْمَلُ \" (فاطر : 36-37) ، فيخيِّل إليك الجرس الغليظ لكلمة (يصطرخون) غِلَظ الصراخ المختلط المتجاوب من كل مكان ، المنبعث من حناجر مكتظّة بالأصوات الخشنة .. كما تلقي إليك ظلّ الإهمال لهذا الاصطراخ الذي لا يجد من يهتم به أو يلبّيه .. وتلمح من وراء ذلك كله صورة ذلك العذاب الغليظ الذي هم فيه يصطرخون } و كذلك نجد مثل هذا في كتابه { مشاهد يوم القيامة} رحم الله الشهيد الرائع سيد قطب الذي أعدمته أيادي مجرمة، لا حس لها و لا ذوق.ذلك الشهيد الذي انتبه إلى هذه الروائع القرآنية.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124227/http://www.20at.com/article2.php?sid=659"

