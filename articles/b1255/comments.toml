order = 0
subject = "Ramadan"
author = "Asalamo alikom all 20at"
posted = "2006-09-21"
text = "kol sana wentom tayebeen<br />We (my friends and me)put a simple list for worship in Ramadan<br />I'll put it here and if anyone wants to share us in this list and let your friends take it too , so we all take sawab in this holy month insha'ALLAH<br />Here is the list<br />1.PRAYING ALL THE PRAYERS IN IT'S TIME AS MUCH AS WE CAN SPECIALLY ELFAJR<br />2. PRAY ALL SONNAH<br />3.READING QURAN (ONE PART AND HALF EVERYDAY IF POSSIBLE, the idea is to finish the quraan during Ramdan)<br />4. AZKAR ELSABA7 Wa ALMASA2 (AZKAR ALSABA7 AFTER FAJR AND AZKAR ELMAZA2 AFTER ASR)<br />5. PRAYING 2 RAK3AH FOR ALDO7A (AFTER SHOROOQ OR 1 ONE HOUR BEFORE THE DOHR OR INBETWEEN)<br />6.PRAY TARAWEE7 (8 RAK3AH)<br />7.CALL FAMILY MEMBERS AS MUCH AS WE CAN<br />8. CALL FRIENDS (JUST TO SAY ASALAMO ALIKOM AND HOW ARE YOU NOT FOR HOURS)<br />9. MAKE DESSERT OR ANY TYPE OF FOOD FOR THE MASJID (JUST FEW DAYS IN THE WHOLE MONTH)<br />10. GIVE DONATION TO THE EID CELEBRATION (EVEN MONEY OR CANDY FOR THE KIDS, GIFTS LIKE THE LAST YEAR)<br />11. NOOOOO TV (ESPICIALY THE PEOPLE WHO HAS DISHHHHH , TRY IT ,IT'S BETTER FOR YOU)<br />12.AVOID TOO MUCH TALK AND ARGUMENTS WITH ANYBODY ESPICIALY HASBUND(TRY, I KNOW IT'S KIND OF HARD)<br />13. AVOID SHOUTING AT KIDS<br />14. AVOID SPENDING TOO MUCH TIME IN THE KITCHEN.<br />15. MAKING DOA'A AND ZEKR, TASBEE7 WHILE YOU ARE FREE AND DURING COOKING.<br />16. DETERMINE 2 OR 3 DAYS IN THE WHOLE MONTH AND INVITE YOUR FRIENDS FOR IFTAR AND TAKE SAWAB OF IFTAR ALSA2EM (NOT WALEEEEEMA JUST 2 OR 3 KINDS OF FOOD SO YOU'LL NOT LOSE YOUR ALL TIME IN COOKING) .<br />17. MAKE SALAT AL-QIAM (TAHJUD) AT LEAST TWO RAK3AH BEFORE FAJR<br />comments are welcome<br />I hope you like it and ramadan Kareem"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124045/http://www.20at.com/article2.php?sid=1255"

