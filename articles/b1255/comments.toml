text = "ياااه على طعم كل حاجه ف رمضان<br />فعلا كل شىء متغير<br />الايه دى كنت بقراها امبارح بس ف نهار رمضان ليها شكل مختلف<br />و الاغنيه الدينيه دى سمعتها كتير بس ف رمضان ليها طعم مختلف<br />و قيسو على كدا الادعيه و الصلوات و الكلام العادى حتى<br />فعل بنحس باختلاف كبير<br />روحانيات و ههالات نورانيه داخليه<br />حاجات متتوصفش<br />رمضان كريم"
