text = "كل حاجة في الزمن الردئ اللي احنا عايشينه ده<br />مبقاش ليها طعم<br />حتى رمضان اللي كان مقدمه أهم مناسبة عندنا<br />مبقاش ليه طعم<br />هو يمكن عندنتا اكتئاب جماعي في مصر<br />أو يمكن كل اما بكبر بيقل احساسي بالمناسبات الجميلة اللي زي كده<br />متهيألي حتى المباركة لبعض بقت روتينية ومملة<br />عشان كده هباركلكوا بتصريف من عندي<br />((((((((كل عااام وكلكم بخير, وصحة, وعافية, وحرية, والتزام, ورغبة في الحياة والتقدم للأمام, كل عام وانتوا بتضحكوا, وبتطربوا, وبتعبدوا ربنا الواحد باخلاص وحب, كل عام وانتوا مطمئنين, وآمنين, وفي راحة نفسية عايشين, كل عام وانتوا.......<br />بني ادمين)))))))))))))))<br />أخزكم المكتئب الحزين معاذ بن أهل مصر المساكين"
