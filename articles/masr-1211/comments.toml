author = "إيمان حسان"
posted = "2006-12-09"
text = "عفوآ تصحيح السورة الكريمة .<br />بِسْمِ اللَّهِ الرَّحْمَـنِ الرَّحِيمِ<br />{قُلْ يأَيُّهَا الْكَـفِرُونَ * لاَ أَعْبُدُ مَا تَعْبُدُونَ * وَلاَ أَنتُمْ عَـبِدُونَ مَآ أَعْبُدُ * وَلاَ أَنَآ عَابِدٌ مَّا عَبَدتُّمْ * وَلاَ أَنتُمْ عَـبِدُونَ مَآ أَعْبُدُ * لَكُمْ دِينُكُمْ وَلِىَ دِينِ}.<br />صدق الله العظيم"
