subject = "حسني التوربيني"
author = "المواطن المطحون"
posted = "2006-12-13"
text = "سئل المواطن المطحون من الشعب الفليسوف الفلسوف عن اوجه الشبه بين مبارك ورمضان التوربيني؟<br />فقال الفليسوف: ان رمضان التوربيني سفاح وقاتل ولكن ضحية ؟؟؟؟؟ فتعجب المواطن<br />فقال المواطن المطحون: كيف يكون التوربيني ضحية؟<br />فرد الفليسوف: التوربيني هو ضحية نظام فاسد عميل دمر كل شيء بمصر فلم ولن يترك شيء الا وافسده , فالرئيس كابس علي النفس منذ 25 سنه كاملة وبعد هذه المدة الطويلة من الحكم بالتزوير طبعا لم يقدم شيء ملموس لمصر , فالفقر زاد واصبح معظم الشعب لا يجد قوت يومه, والاقتصاد انهار واصبحنا في موخرة الدول النامية, والبطالة زادت واصبح لدنيا 8 مليون عاطل , والسرطان وامراض الكبد استشرت واصبح معظم المصرين يعانون منها, فماذا ننتظر من رد فعل المجتمع تجاه هذا الظلم , فاصبح المجتمع يفرز رمضان التوربيني ومثله سوف يظهر قريبا قتله اخرين مثل رمضان الاكس و رمضان الاسباني و رمضان القشاش وغيرهم.<br />فرد المواطن علي الفليسوف: وبعد كل هذا الشرح المطول لم اعرف وجه الشبه المثالي بين الرئيس مبارك ورمضان التوربيني.<br />فقال الفليسوف: ان رمضان التوربيني مغتصب اطفال وقاتل بسبب ظروف المجتمع الصعبة القاسية .<br />اما الرئيس مبارك فانه مغتصب شعب باكمله مع سبق الاصرار والترصد."
