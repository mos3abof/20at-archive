order = 0
subject = "مقال رائع"
author = "شيماء"
posted = "2006-11-25"
text = "السلام عليكم و رحمة الله و بركاتة<br />مقال رائع احيك عليه<br />و عموما كويس انك لحقت تحلم قبل الاحلام متبقي بفلوس او يفرضوا عليها ضريبة احلام.<br />بس صراحة انا زعلانة من جيرانكم مش كانوا اجئلوا الفرح لحد متطلع قرار لزيادة المرتبات و الاقي مرتبي زاد 9 اضعاف او حتي تنفذ قرار الكادر المعلمين الخاص الي احسن ابويا حط عله امال كتيرة اوي و يظهر ان كلها حتبقي في الهواء الطلق.<br />صراحة جيرانك ملهومش حق انا حعمل ثورة عليهم و اسميها ثورة ذو القعدة."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210316/http://masr.20at.com:80/article.php?sid=1211"

[[comments]]
