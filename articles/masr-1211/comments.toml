[[comments]]
order = 20
subject = "مسلم يتمنا ان يكون اسرائيلى"
author = "عمرو المصرى"
posted = "2006-12-13"
text = "كنت اتكلم معا استاذى احمد بلال من خلال النت وارسل لى موضوعا عن يوم ان اصبحت رئيسا وكنت انا قاعدا فى سيبر وبالصدفة جاء شخص وهو امين شرطة فهو بينى وبينو صداقة سطحية فسالتهوا سؤال هل لو عرضى عليك الجنسية الاسراءليةمذا هتفعل فقال لى اوفق طبعا انا اكيد نيتى مسلم بس الجنسية الاسرئلية يعنى فلوس وحريم وعيشة حلو وانا فى الاول والاخر مسلم واللة العظيم ان هذا الحديث حصل بالحرف الواحد وهذا احد ابناء مبارك ربنا معاك يبلال يارب احفظ لنا مصر من الكلاب الصغيرة والكلب الكبير الى اسمو مبارك عمرو المصرىىىىىى"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045650/http://masr.20at.com:80/article.php?sid=1211"

