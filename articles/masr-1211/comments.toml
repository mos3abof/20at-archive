subject = "رد في السريع السريع .. برافوووو"
author = "إبن بهية"
posted = "2006-11-25"
text = "رائع يا بلال ... برافوا .. وفعارم عليك بالتركي كمان يا سيدي على الكلام الحلو ده .. إيه ياد يا بلال هو انته عايز تعمل علينا رئيس ؟؟؟ طيب رشح نفسك كده وأعاهدك إني أنتخبك .. يا ريت .. مش بعيد على ربك يا بلال .. بس خلي بالك زي ما قلت في النهاية إنهم سجلوا الحلم صوت وصورة ممكن يحاسبوك عليه ويتهموك بالطمع في رئاسة الجمهورية وتلبس التهمة التيكاواي بتاعة قلب نظام الحكم .. تقوولش يا أخي نظام احكم كان معدول أصلا ... الشاهد حلمك ده حلم السبعين مليون .. مش يكونوا رؤساء .. لأ .. لكن يتخلصوا من الواطي حسني مبارك<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
