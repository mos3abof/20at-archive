subject = "فعلا قبطي مريض نفسيا"
author = "مصري حقيقي"
posted = "2006-11-26"
text = "القبطي الحقير عابد الصليب ايه الي تعبك , امثالك هم الذين يشعلون الفتنة الطائفية في مصر , وللعلم لو اشتعلت الفتنة سيكون مصيرك هو احراق امثالك او طردهم من البلدالطيبة مصر , وللعلم الاسلام سيزداد انتشارا في العالم كله سواء رفضت او ابيت واسئل القساوسة بتوعك منتهكي اعراض الاطفال ."
