posted = "2006-12-08"
text = "تحياتى لك سيدى على حلمك<br />ولكم اتمنى ان يحقق كل انسان حلمه ولكنك ها هنا تنافسنى فى حلمى فمنذ ايام الثانوية والتى تذاكر فيها شئت ام ابيت كانت كل اوراقى تمتلى باحلام من تلك التى تورد المهالك وكنت اخطط وانفذ واحل مشاكل مصر فى كل جلسة مذاكرة مشكلة وهنا مشكلة اكبر فانت عندك دليل حلم اما انا فدليلى مسجل وهو بمثابة اعتراف بالتهمة والتى لا ادرى لماذا هى تهمة الاستيلاء على الحكم وقلب نظام االحكم<br />لا اتنازل عادة عن احلامى ولكن هاهنا فانت افضل كثيرا من السيد القادم شئنا ام ابينا<br />تحياتى للجميع"
