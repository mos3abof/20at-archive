text = "الكابتن اللي حاطط لينك لموقع قذر ده عيب عليه لأننا كلنا عارفين الوساخه والقذارة الصهيونية وحطك للينك لمواقعهم بيعطيه شهرة على الفاضي وهم أوساخ .. أنذال وخنازير .. بلاش عبط واتكلم من غير ما تعمل دعاية لمواقع قذرة زيهم"
