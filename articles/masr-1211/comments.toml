text = "مع احترامي لحلم سعاتك إلا ان<br />1ولا: مايصحش وحرام تغتاب الناس<br />2نيا: ياعم ليه عايز تبقى رايس علشان تعدل البلد؟؟...ما تعدلها من مكانك هنا علي قد ما مسموح لك.<br />3الثا: كل ميسر لما خلق له.<br />4ابعا: اعمل لنظرتك للحياة feed back<br />ويجعله عامر"
