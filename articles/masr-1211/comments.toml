[[comments]]
order = 6
subject = "احلم وما تخفش"
author = "mona"
posted = "2006-11-26"
text = "احلم وخذ راحتك الحلم خلاص بقي حقيقة دايما بحلم وخيالي واسع وفي النهاية حلمي بيتحقق المهم الصبر عايزين نحلم سوي ونحقق الحلمبالشعب وللشعب ويما يغلط نحاسبة بس احنا ائلي بنديهة الفرصة هو وغيرة والكلام دة لازم ينتهي احكم نفسك بنفسك وحاسب نفسك قبل ان تحاسب روح ابوك مات وجنازتة مشش عسكرية جنازتة منسية مالهاش صدي صوت زي جمال وغيرة انتهي زمن الاستعباد وانتة رجعتة عشان كدة هومات ومش لاقين كان ندفنة وريحة وحشة قوي وصلت لحد عندي وكفاية بقي بلاش عنادمعدش لية لزمة سيبنا في حالنة ياما اجيبة من برة وطع عينك واقيم عليك الحد ."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210316/http://masr.20at.com:80/article.php?sid=1211"

[[comments]]
order = 7
subject = "قشطة"
author = "مصرى متغرب"
posted = "2006-11-26"
text = "بجد بجد مقال رائع وتفكير ممتاز لحل مشاكل البلد ماطلعش من دماغ ابن امة ولا ابوة بس همل مش فاضيين يفكرو هما بس عايزين يشوفو اية الى لسة قابل للسرقة والنهب فى البلد علشان يكوشوعلية وانا وحياة والدك عايز قرار مخصوص لحبيب العادلى نجيب كل المواطنين الى اتبهدلو ى اقسام الشرطة وغيرها وكلواحد يعمل فية زى ما اتعمل فية بالضبط<br />بسرعة بس الحق كمل حلمك قبل العادلى مايموت"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210316/http://masr.20at.com:80/article.php?sid=1211"

[[comments]]
order = 8
subject = "ملاحظات"
author = "عنتر مش لاقى سيفه"
posted = "2006-11-26"
text = "السلام علي من اتبع الهدي<br />اولا...جميل الحلم و ان شاء الله حقيقة في القريب العاجل<br />الاخ اللي ناشر الحوار حول الاسلام...احترم نفسك و بلاش تحط لنكات لمواقع اقل نا يقال عنهامواقع لمرضي نفسيين...و للعلم لا يوجد اي سبب لوضعها لانها لا تفيد قارئها باي جديد..فما هي الا ثرثرة بعض الحاقدين علي سيدنا محمد و علي الاسلام...نعلم بوجودهم ونتجاهلهم و هذا هو ما يسبب لهم الجنون و الحرقه الني هم فيها.<br />عاجبني اوي اوي التعليق للازميلة مني ...و احب اقولها ان شاء الله باتت قريبة اوي و النور بدأ يظهر من بعيد...محتاجة شوية صبر و مجهود...فعلا ان الله لا يضبع اجر من احسن عملا."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210316/http://masr.20at.com:80/article.php?sid=1211"

[[comments]]
