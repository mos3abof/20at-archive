subject = "المجرم الحقيقي"
author = "يوسف محمد يوسف"
posted = "2006-11-26"
text = "خواني المجرم مبارك قاتل السادات الحقيقي ماذاتنتظرون من مجرم لايقل عن صدام حسين وكلهم من مدرسة واحدة مدرسة الاستبداد واقول ان كل من يقول ان مصر تضيع لو اسرعنا في الاصلاح يعني ياجماعة نامو ربنا ينتقم منك يامجرم كم خربت في ارض الكنانة وانا لست مستغرب هذاالكلام منة ابدا وماذا انتظر من مجرم فاكر مصرعزبة ابوة ولكن ربنا سينتقم منة وهو الذي يمهل ولا يهمل"
archived = "2006-12-05"
