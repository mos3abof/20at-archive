subject = "رحمه الله"
author = "zx350sa--ali"
posted = "2006-09-18"
text = "الله يرحمه<br />الله يفسح عليه في قبره ويدخله جناته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131255/http://www.20at.com/article2.php?sid=1227"

[[comments]]
order = 3
subject = "باقى فى قلوبنا"
author = "حسام الدين على"
posted = "2006-09-18"
text = "المهندس<br />المهندس<br />فؤاد المهندس حاجة كدا زى الهوا فى كل مكان و هوا برضة فى قلب كل واحد منا و فى عقل كل واحد مناو محدش يقدر ينسى المهندس لانى ساعتها حينسى يتنفس و ساعتها حيموت<br />اللة يرحمة<br />حسام الدين على"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131255/http://www.20at.com/article2.php?sid=1227"

