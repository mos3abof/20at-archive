[[comments]]
order = 0
subject = "قولوا امين"
author = "فارس"
posted = "2006-09-17"
text = "اللهم ارحمه و اللهم عافه واعف عنه و اللهم ان كان محسنا فزد فى احسانه وان كان مسيئا فتجاوز عن سيئاته .<br />اللهم اجعل قبره روضة من رياض الجنة ولا تجعلها حفرة من حفر النيران . امييين يارب العالمين<br />وصلى اللهم وسلم على سيدنا محمد وعلى اله وصحبه اجمعين .<br />الروابط مش كلها شغاله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131255/http://www.20at.com/article2.php?sid=1227"

[[comments]]
order = 1
subject = "كلمتين و بس يا استاذ"
author = "نيفين نيفى نوفا"
posted = "2006-09-17"
text = "سمعت الخبر بليل امبارح و ف لحظه دارت ف عقلى كل الافيهات الجميله بتاعته<br />طلعت قماش قماش طلعت<br />قلبى يا غاوى خمس قارات<br />يخواتى صايم و راجل شقيان و مراتى عايزه تجوعنى حتى ف رمضان تعاليلى يا اما<br />رحل الاستاذ زى ما بيرحل كل شىء جميل ف الدنيا<br />مش كده و لا ايه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131255/http://www.20at.com/article2.php?sid=1227"

