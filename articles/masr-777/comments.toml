[[comments]]
order = 25
subject = "يعيش المرشد أبو التصريحات العنترية"
author = "مصري"
posted = "2006-08-08"
text = "القارئ الجيد للتاريخ يقدر بعرف ان الاخوان منذ نشأتهم يعتمدوا علي الكلام فقط فهم رجال أقوال لا أفعال يعني اخرهم يهيجوا الناس علشان يقوموا بمظاهرة من غير طبعا مشاركة الناس المهمين في التنظيم و خصوصا اولادهم يعني انا انضميت شوية للاخوان في كفرالشيخ و بعدين الحمد لله ربنا شفاني لما فوجئت ان كل المظاهرات اللي بنقوم بيها بتتم بدون مشاركة أولاد قياداتنا اللي طبعا خايفين علي ولادهم يعني ياريت قيادات الاخوان يكونوا ناويين يبعتوا أولادهم علي رأس جيش المرشد عنتر بن شداد اتحرير لبنان و بعد لما يحرروها يحدودا علي فلسطين يحرروها و يحلوا مشكلة الشرق الأوسط نهائيا ."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 26
subject = "كلام إنتم عارفينه"
author = "متولى"
posted = "2006-08-08"
text = "إللى مستغرب قوى إن عدد الإخوان كثير هوه إنت مارحتش الإنتخابات الأخيرة بتاعت مجلس الشعب ولا إيه وشوفت إزاى الناس كلهم كانوا عايزين ينتخبوهم وإزاى كان رد فعل الإمن المركزى معهم وبعدين الإخوان لا يلموا الحثالة لأن معظم أبناء الإخوان من الطبقة المتعلمة مثل أساتذة الجامعات والمهندسين وغيرهم من الطبقات التى تتقى الله ولديهم حب كبير لبعض وهم منتشرون فى دول كبيرة وياريت تعمل إستطلاع للرأى علشان تعرف كام من شباب الإخوان فى مصر عايزين يروحوا يحاربوا فى لبنان وإنت ها تلاقى العدد إللى فضيلة المرشد قال عليه أقل بكثير وروح شوف خيبتك إنت مع إللى عمال يدافع عن اليهود والأمريكان"
