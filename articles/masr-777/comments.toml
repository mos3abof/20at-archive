posted = "2006-08-07"
text = "هو انتم عندكم المسانده تكون بالكلام بس والجعجعه وخلاص ولما الرجل يقول انه عنده استعداد لارسال 10000 متطوع للقتال يبقي غلط انتم تبع مين بالظبط الحكومه ولا المباحث ولا مين مش عارفاذا كانوا مش هايعرفوا يوصلوا لهناك يبقي عيب الحكام مش غلط منه انتوا يبدوا انكم عاملين زي زعيمكم عبد الناصر القتال بالكلام والاونطه بس وعند بدء المعركه الحقيقيه يصدر قرار الانسحاب فورا وتسليم الارض للعدو كل ماتعرفونه عن المقاومه هو الهتاف فقط ده موقع شبه حكومي"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 5
subject = "اين 10 الاف"
author = "هند(المغرب)"
posted = "2006-08-07"
text = "اداكان لدا الاخوان 10الاف مجاهد باسلحة متطورة لايقلون عن المقاومين في جنوب لبنان اتمنى عليه ان يبعتهم الى لبنان بسرعة فالامر مستعجل اما ادا كان دلك دعاية فهدا ليس وقت الكلام هدا وقت العمل ثم هدا الكلام يجعل مبارك يفعل بالاخوان ما يريد فمن الافضل ان يفي مرشد الاخوان بما قال حتى لا يكون قد فتح على الاخوان النار بدون فائدة و خاصة بعدما ظهر ايمن الظواهري و قد صرح بان الاخوان في مصر انظموا الى القاعدة.<br />و في النهاية اقول لجماعة الاخوان المسلمين خدو حدركم اد يبدوا ان الحرب القادمة ستكون بين مبارك و الاخوان."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

