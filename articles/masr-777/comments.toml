[[comments]]
order = 8
subject = "اللى مش فاهم يسكت"
author = "ابوعبيده"
posted = "2006-08-07"
text = "ياجماعة اللى مش فاهم يسكتاحسن صراحه انا كل يوم بازيد يقين ان الفهم نعمة وعموما اللى عنده استعداد ان يبعت عشر ةالاف مجاهد احسن بكتير من اللى عنده استعداد انه يبعت مائة الف كلمه تاخر ما تقدمش مين يطول انه يكون من ضمن العشرة الاف دولولا انتو قاعدين كده للساقطه واللاقطه احسنلكم جاهدوا بكلامكم اليهود والامريكان الظالمين يارب تكونوا فهمتووتنقطونا انتم بسكاتكم وفعلا شعب مصر فيه ملايين من الاخوان وغيرهم على اتم استعداد للجهاد فى فلسطين او لبنان او العراق كمانتحت قيادة المخلصين من ابناء الامه الاسلاميه من اى مكان"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 9
subject = "العقل زينة"
author = "واحد عادى"
posted = "2006-08-07"
text = "الدولة مش هتخاف من تنظيم علنى ولا سرى<br />كفاية اللى عندها<br />- 750000 جندى أمن مركزى الذين كان يبلغ عددهم 450000 حتى نهاية عام 2002.<br />- 25000 - 45000 بلطجية و مليشيات مأجورون هذا هو<br />- 100000 جندى حرس جمهورى مدججون بالأسلحة الثقيلة.<br />- 250000 فرد من المخابرات العامة و الحربية و مباحث أمن الدولة<br />الخوف الحقيقى من العصيان المدنى ودى الحاجة اللى<br />واضح ان الأخوان مش بيفكروا فيها<br />اينعم بعض قادتهم صرحوا بيها<br />بس على مستوى الأفراد كتير منهم ما يعرفوش العصيان المدنى نفسة يعنى اية<br />فا متخافوش عليهم<br />غوله بس مش ناوين يزعالوها<br />يزعالوها قوى<br />ينكوشوهابمظاهرة او تصريح اه لكن زعل بجد هنخش<br />فى تكسير العظم وهما حاسين ان النظام طاب وقرب يوقع ومش ناوين يطحنوا هما ويجى<br />واحد زى رفعت السعيد يركب ويدلدل رجله<br />ويعملى فيها رئيس ولا حتى وزير"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 10
subject = "ابايع الاخوان"
author = "صقر قريش"
posted = "2006-08-07"
text = "اولا اريد ان ابايع الاخوان حاليا الاستاذ محمد مهدى عاكف على الجهاد واتمنى ان اكون من ضمن العشرة الاف مجاهد<br />ثانيا اوضح لمن يريد ان يتكلم دون ان يفكر وهو ما قاله الامام محمد مهدى عاكف فى حوارة على قناة الجزيرة عندما قال لا اريد دم بدون ثمن وكان كلامه رد على من تحدث مثلكم فى كيف لا يرسل الاخوان جنود كما فعل قبله المرشد الاول حسن البنا رضى الله عنه فقال الرجل ببساطه انه لا يريد دم بدون ثمن وانه يريد دم بثمن والمقصود هنا وهو للتوضيح لمن لا يفهم هو ان لو خرج بالفعل 10000 مجاهد من كتائب الاخوان المسلمين فمن سيقف امامهم قبل ما يقف اسرائيل هم اخوانهم الجنود المصرين وهنا يحدث حرب اهليه لا تحمد عقباه ومن هنا تحث الامام محمد مهدى عاكف عن طرق بديله ومنها العصيان المدنى وقال بالحرف لا افعلها الا لما اتاكد من نجاحها اذا يتضح لنا من خلال ما سبق هو صدق ما جاء من تصريحات الامام ولكن ما الحيطه والحذر فهذا ما تعلمناه من زعيمنا محمد صلى الله عليه وسلم وارجو من الاخوة الذين لا يعجبهم كلام الامام ان لا يستمعو الى الكلام ولكن يرو الافعال وان لم يرو فانصحهم بالكشف على عيونهم فذاك افضل للايام القادمه فسوف يرون انشاء الله ما يثلج صدورهم"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

