posted = "2006-08-08"
text = "الدال على الخير كفاعله ـ حديث شريف<br />If you want to donate to our brothers and sisters in Lebanon, please call Dr. Fatma El Awa from the W.H.O in Egypt (World Health Organisation) Tel# 27 65 000 (Cairo). They are in need for baby/adults diapers and all personal hygiene items.<br />إن كنتم تودون التبرع لصالح الاخوه فى لبنان فبرجاء الاتصال بالدكتوره فاطمه العوا من منظمة الصحه العالميه على هاتف 2765000 ـ القاهره<br />هم فى حاجه الى حفاظات الاطفال والكبار وكل ما يتعلق بمستلزمات النظافة الشخصيه"
