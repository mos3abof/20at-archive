[[comments]]
order = 12
subject = "إتقوا الله و لا تكونوا إمعه و توقفوا عن قول الجبناء"
author = "مسعود"
posted = "2006-08-08"
text = "أيها الجبناء يا من تهاجمون من هم أشرف منكم و من قضى أكثر من نصف عمره فى السجون فقط لأنه مؤمن بقضيته و هم يعذبون فى السجون و أنتم جالسون على أعجازكم تلهون و تجرون وراء إليسا و هيفاء وهبى و شبيه عبد الحليم حافظ و يا من رضعتم تفاهه و جرت فى دمائكم الدياثة الأخوان أشرف و أقدر على قيادة هذه الأمة من العصابة التى تحكمنا فإن قالوا صدقوا فى ما قالوا فمن منا الإ الجبناء بالطبع و المتخلفون و القاعدون لم يتأثر و ربما بكى لما شاهده من مصائب بنى صهيون فى إخواننا فى كل مكان من منا لم يحدث نفسه على الأقل بأن يذهب و يحارب بنفسه ضد هؤلاء الحيوانات فهل رأيتم الحياة كم هى رخيصة لا تساوى هل رأيتم أن جبنكم قد جرأ عليكم أحفاد القرود و أصهار الخنازير عليكم هل رأيتم أطفالا أشجع منكم يواجهون الموت بصدور عارية هل رأيت أيها الرجال نساءا قدمن الخمس و العشرة من الشهداء فداءا للدين و ليس للدنيا و هم يبتسمون فرحا لمستقر أبناءهم مع الصديقين و الأبرار كفاكم غمزا و لمزا و لا تكونوا كمن قال فيهم عز من قائل \"إِنَّ الَّذِينَ أَجْرَمُوا كَانُواْ مِنَ الَّذِينَ آمَنُوا يَضْحَكُونَ (29) وَإِذَا مَرُّواْ بِهِمْ يَتَغَامَزُونَ (30) - سورة المطففين - و لكن الأمل كل الأمل ليس فيكم و لكن لم صدقوا ما عاهدوا الله عليه و ربما تكون مفاجأة لكم لأنهم كثر"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 13
subject = "ابوعبيده و صقر قريش و مسعود"
author = "mahmoud"
posted = "2006-08-08"
text = "ألي كل هؤلاء أنتم أسوأ من يدافع عن الاخوان بل أنتم دليل أدانتهم<br />ابوعبيده<br />هو بس اللي فاهم وهوا بس اللي عارف وكل الناس مش عارفين حاجه \"للأسف أنك لم تتجاوز القشره الخارجيه للمعرفه\"<br />و صقر قريش<br />لسه عايش في الوهم وبيسمع اللي حفظهوله<br />\"أنظر خارج البرواز ده \"<br />أما مسعود فده بيقول اي كلام ولا هوا دريان كل الناس جبناء كل الناس عملاء. زي مرتضي منصور<br />نصيحه<br />أذا كنتم مستحدثين في الجماعه فأن<br />الجماعه في أشد الحاجه الي أمثالكم في الفتره القادمه<br />علي فكره أنا قابلت\"أخوان\" كتير والله<br />كان فيهم ناس كتير بتفهم وبتعرف تتكلم<br />ليه متسيبوش دول عشان يتكلموا بدلكم<br />للعلم أنا َضد النظام و ضد الحكومه وضد حسني وولده"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

