[[comments]]
order = 23
subject = "تانى يا عبد الله"
author = "نيفين نيفى نوفا"
posted = "2006-08-08"
text = "عبد الله انا عارفه انك اكيد انت اللى بتقول دلوقتى تانى يا نيفين<br />انا عارفه اننا اتكلمنا ف الموضوع دا كتير و كالعاده اقتنعت بكلامك مع الاختلاف معاك قليلا<br />بس المره دى انت مش معايا ان المرشد لازم يحترم عقولنا<br />مش عيب انه يقف مع المقاومه و يخطب و يهتف بسسس ليه بقى التصريحات الورقيه اللى كل شويه يطلع بيها<br />هقولها تانى انا مش مع الاخوان و لا ضدهم بس بجد يا جماعه الاخوان جماعه تستحق رجل افضل من عاكغ للتحدث باسمها"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

