[[comments]]
order = 29
subject = "افهموا يا جماعة"
author = "ابو سمية"
posted = "2006-08-08"
text = "يا جماعة ابوس ايديكم افهموا ،اوعوا تكونوا فى عشرينات بوق للنظام دون ان تعلموا ،انا مش شايف اى مشكلة ان المرشد يقول ابعت 10 الاف او اكثر للبنان ،الكل فاهم انه بيقول الكلام ده توبيخ للنظم العربية اللى نايمة فى العسل ،واثبات ان المصريين ما زالوا بخير ولم تمت نخوتهم حتى الان ،ولكن البعض ما صدق ان المرشد قال التصريح ده راحوا مسلطين ابواقهم الجاهزة فى كل وسائل الاعلام لشن حملة على المرشد والاخوان ،وانا متاكد انكم فى عشرينات مش كدة .ثم انه ايه المشكلة يكون عند الاخوان 10 الاف مجاهد ،اعتقد اللى مستغرب من العدد اما انه بيهزر او مش دريان بالدنيا لانه متاكد ان الاخوان فى العالم كله وباعداد اكثر من كده بكتير .يا شباب احب اسال الاخوة اللى متضايقين قوى من تصريح المرشد المناصر للمجاهدين فى لبنان منذ بداية العدوان لماذا لم تسالوا القادة العرب الذين لم يهددوا حتى بارسال فردة جزمة عسكرى عربى لمناصرة المقاومين ،وليه ما اتريقتوش يا بهوات عليهم زى ما بتتريقوا على الاستاذ عاكف ،بصراحة انا فى منتهى الحزن اننا بنفكر بالطريقة المقرفة دى ،وفى النهاية احب اؤكد للاخوة اللى هيفرقعوا من الاخوان بسبب وبدون ان الاخوان لن يتاثروا بمثل تلك الحملات المنظمة التى تشن عليهم بعد اى تصريح للمرشد ،وانا اتخيل انبعض الناس واقفين وراء الابواب ماسكين اقلامهم المسمومة فى انتظار الاشارة من قادتهم \"ابدا الهجوم على الاخوان \"فيبداوا فورا .الاخوان دول يا جماعة بنى ادمين بيغلطوا وبيعملوا حاجات صح بالتاكيد ولكن النقد عمره ما كان كده ،افففففففف"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
