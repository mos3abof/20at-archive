subject = "عامل فيها حسن نصر الله"
author = "shekoto"
posted = "2006-08-08"
text = "فضيلة المرشد عايف الدور شوية ...... مفكر نفسة حسن نصر الله<br />وحتى لو الكلام دة صحيح يبفى بيفتح علينا النار من كل الأتجاهات<br />ونبقى لبنان الثانى<br />أحنا اة كلنا قلوبنا مع لبنان وضد كل الأنتكاهات اللى بتحصل<br />بس الحل من رأيى<br />أما اننا نبعت جيش بحق وحقيق<br />أو ندعيلهم ونعد فى بيوتنا"
archived = "2006-08-31"
