text = "كلام كلام كلاااااام<br />هما دول الاخوان<br />ايوة فيه 10 آلاف يطلعوا في مظاهرة<br />او يعملوا أمسية لفلسطين والانتفاضة مستمرة .. حتي تعود الأرض حرة<br />مراحوش ليه بأي شكل فلسطين تحايل حتي لو اشتغلوا في شركات الاسمنت اللي بتصدر لاسرائيل الاسمنت ويدخلوا ويجاهدواا<br />هنفوق امتي بس"
