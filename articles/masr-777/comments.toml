[[comments]]
order = 31
subject = "إلى الجحيم يا ولاد البلد"
author = "مسعود"
posted = "2006-08-08"
text = "الى الجحيم يا موقع ولاد البلد فلا أنتم أولاد و لا أنتم تنتمون لهذه البلد الطيبه فكل ما المواضيع التى تكتبونها عن الإخوان متحاملة و متهمة إياهم بأبشع الإتهامات و متهكمه على قياداتهم فلم أجد موضوعا واحدا ينصفهم و لا أحسب القائمين على هذا الموقع إلا من الخائبين دعاة العلمانية و نبذ كل ما يدل على الدين فهنيئا لكم بكل من على شاكلتكم و بالمناسبة لم يبقى فى الموقع من الرعيل الأول ممن كانوا من الشباب المستنير ذو التفكير السليم و الرأى العادل إلا القليل ممن رحم ربى و أحسبهم على رحيل من متابعة هذا الموقع الذى أقل أقل ما يقال على القائمين عليه أنهم منحازون فهنيئا لكم السطحيين و متضخمى الذات و الذين يحسبون أنفسهم مفكرين و مؤرخين و كتاب يستحقون نوبل للأدب و لكن الحظ ظلمهم هنيئا لكم الفشل الذى حققتموه بجدارة منقطعة النظير و أعلن المقاطعة لموقعكم الذى كان فى يوم من الأيام منتدى الشباب الذى يمثل الموجة الجديدة من الفهم و الوعى"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 32
subject = "لا يامسعود"
author = "مصرى جدااااااا"
posted = "2006-08-08"
text = "لا يا عم مسعود مش كده ،ان كانوا الجماعة فى الموقع نشروا موضوع او موضوعات مش عاجباك فليس الحل هو المقاطعة بل النصيحة ،واضح من كلامك انك من الاخوان وانا عارف ان الاخوان ناس زى العسل وبيعرفوا كويس ادب الاختلاف.امسحها فيه المرة دى ،وبلاش اتهام لاحد لاننا كلنا مصريين وبنجب بلدنا ،خليك دائما زى حبايبك الاخوان ناس زى الفل ربنا يحفظهم رغم الحاقدين"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 33
subject = "قلة أدب والله"
author = "أمير الأمراء"
posted = "2006-08-08"
text = "الأخ الكريم أحمد الهواري ..<br />للأسف أنت إنسان غير مؤدب وغير محترم حين تكتب بهذا الأسلوب السفيه عن أستاذ فاضل في عمر والدك أو جدك .. هل بإمكانك أن تذهب لوالدك وتقول له اصمت أو اخرس يا والدي؟ طبعا لأ ليلطعك قلمين يعدلوك ...<br />السفاهة والوقاحة الأخطر في كلامك أنه حتى نية الجهاد صارت مستقبحة في صدرك الضيق يا من كره الله انبعاثه فثبطه .. هل سمعت يا تحفة بحديث النبي الكريم: (من مات ولم يغز ولم يحدث نفسه بالغزو مات على شعبة من شعب النفاق) .. أنت حتى لا تتقبل الحديث عن \"إمكانية الجهاد\" ولا تستسيغه بعد إن رضيت الدنية من دينك ... أذكرك بقول الحق تبارك وتعالى فاذهب واقرأ سورة الأحزاب واقرأ تفسير الأيات من أول قوله تعالى :(قد يعلم الله المعوقين منكم والقائلين لإخوانهم هلم إلينا ولا يأتون البأس إلا قليلا)<br />لعنة الله على الظالمين<br />((إن الذين يكتمون ما أنزلنا من البينات والهدى من بعد ما بيناه للناس في الكتاب أولئك يلعنهم الله ويلعنهم اللاعنون))"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 34
subject = "خدم السلطة .. أسفوخس"
author = "مجاهدون صابرون"
posted = "2006-08-08"
text = "سخافة وقلة أدب كالعادة لا جديد لدي من يعرف أنة يقبضراتب مقابل تقبيل يد وقدم الحكومة الفاسدة ليل نهار<br />لما لم يتحفنا الكاتب بعيدا عن الحرب بأسماء كبار المهربين للمخدرات و سارقي قوت الشعب لما لم يرفع عقريتة ليس بحي علي الجهاد بل بحي علي الصلاح فأشار لمن وصل لمجلس الشعب بالتزوير؟!<br />لا نطلب من الكاتب حي علي الجهاد بل علي الأقل ليتحدث ولو بلحظة صدق واحدة عن آلاف المعتقلين بلا أي محاكمات في سجون رهيبة بل ليحي لنا قصص أبوزيد الهلالي في كيفية بقاء من صدر لة حكم بالأفراج من محكمة أمن الدولة ثلاث أو خمس مرات متتالية!!<br />لا نريد من الكاتب حي علي الجهاد حتي لا يقع في العنتريات لكن ألا يستطيع أن يحكي لنا قصص الف ليلة وليلة باب هروب الملايين من القروض من أرض المحروسة<br />لما لم يتحرك الكاتب ولو للحظة بدون أي شعارات ضد من ضباط الشرطة الذين كالوا الركلات والضرب بالعصي والقبض علي المتظاهرين أم أن هؤلاء مثل اليهود أيضا لديهم (عقليات جهنمية تستدرجنا إلي هلاكنا وفنائنا) !!<br />بل هو الإنبطاح والإنهزام كالعادة بلد يشرب الشباب بة البانجو في الشوارع وخمسة ملايين عاطل وثلاثة ملايين عانس وأنتخابات مزورة حتي أنتخابات القري والنجوع! وفساد في كل شئ ... خمسون سنة من الهدم المستمر لمصر ... ولم يتحرك الكاتب ... لكنة الآن يستكثر علينا حتي الشجاعة!<br />نعم قادرين علي أرسال العشرات والمئات والألوف هل تعرف لما؟! لآنهم تربوا في بيوت طاهرة وتعلموا السجود لله لا لفرعون وعلمهم القرآن أن الله أغرق فرعون ... وأغرق هامان ... وأغرق أيضا جنود فرعون ... ولم يشفع لجنود فرعون أنهم كانوا ينفذون الأوامر أو يمشون بجوار الحيط أو داخل الحيط ... فتذكر ... تذكر ... لم يشفع لجنود فرعون أنهم كانوا مجرد خدم!"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 35
subject = "مستوى متدنى"
author = "ابو اسامة"
posted = "2006-08-08"
text = "فعلا الموقع بقى مستواه متدنى وفى النازل<br />بقى عامل زى روزل يوسف بعد ما بقت تبع الحزب الوطنى وانا علشان كده مبقتشى اعلق فيه كتير مع انى من اول الناس اللى علقوا فيه اما بالنسبة للأخوان فانا احييهم على موقفهم واطالبهم ايضا برأيهم فى الجهاد<br />ضد من يخون بلده ويخذل المسلمين عن الجهاد<br />ويقتل فى الأمة روح الجهاد فما حكم قتاله<br />وان يكون هذا الرأى معلن .<br />ملحوظة يا ريت تشيلوا اشباه الكتاب دول من الموقع علشان بقوا مقززين اوى وبيسيروا قضايا تشكل رايهم الخاص ولا تنم عن اى دراسة اوضح النقطة دى علشان محبش اظلم حد يعنى الأخ الكاتب كان المفروض سأل المرشد واتكلم معاه وانا بصراحة سمعت الحديث بتاع المرشد وكان بيقول فيه انه مستعد يرسل المجاهدين على اساس ان الحكومة تساعده على ارسالهم زى ما كانت الحكومة ايام الملك بتساعد المجاهدين فى الجامعات وبتمولهم بالسلاح على شان يحربوا فى فلسطين يعنى بدل مينتقد الحكومة اللى محصلتشى حتى الحكومة ايام الملك بينتقد<br />اللى عايز يجاهد ويبوا انه حتى مكلفشى<br />نفسه انه يسمع حديث المرشد."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 36
subject = "الله المستعان"
author = "اكرامى"
posted = "2006-08-08"
text = "الله المستعان فى نصر لبنان اما ما قاله فضيله الامام لمساندة الاخوه فى لبنان ليس ببعيد عنه ولو ان الجكومه فى مصر قتلت الهمم فى قلوب الشباب وحرقت اوراق المفكريين والكتاب فهى لا زالت فى رجال الاخوه متقده وعلى اتم الاستعداد لنصره الاسلام في كل ارجاء الارض ويكفى ان اقول قول سيدنا عمر بن الخطاب فى حواره مع رسول الله صلى الله عليه وسلم السنا على حق اليس قتلانا فى الجنه وقتلاهم فى النار يا سيدى المفكر كن على عقيده بان الاسلام يعز الضعيف وتاكد بان الحق احق ان يتبع و دعك من الجدال فى الباطل رغم انى اعرف انك تعلم الحقيقه تماما ولا ادري لماذا تفعلون هذا الا لدنيا تصيبها ام لمجد وشهره زائفه اتقى الله حق تقاته و اخيرا هداك الله و بصرك"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

