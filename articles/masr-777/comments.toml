subject = "هناك فرق"
author = "فضل الله توفيق"
posted = "2006-08-08"
text = "ياريت تعرفوا الفرق بين إللى بيحفروا فى ا لصخر علشان الحق وبين إللى بيدمر مصر بالباطل وبيدمر العرب بالخيانة هوه لما فضيلة المرشد يقول إنه ها يرسل 10000 مجاهد للبنان أكيد كان واثق إن شباب الإخوان كله معه وهذه حقيقة فنحن نعلم الحق ونرى الباطل باطل ونرى كيف يحارب الإخوان المسلمين لإظهارهم للباطل ورفضه ولكن أن يحارب مسلم مع مسلم أية أن كان سنى أو شيعى أم يحارب المسملم فى صف اليهود على المسلمين ونحن جميعاً فداء للإسلام وللحق وللبنان ومصر والله على ما أقول شهيد"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 16
subject = "الى جميع الاخوة"
author = "ماجد"
posted = "2006-08-08"
text = "استحلفكم بالله ان تعيدوا قرأءة كل ما سبق قبل قراءة كلمتي<br />ثانيا هل ترون قدر التباين والاختلاف الذي يحدث بيننا على اي قضية وعلى اي تصريح وعلى اي كلمة انا لا اعني ان قول مرشد الاخوان اي كلام ولكن حتى وان كان قول غيرة وحماسة ولا احسب رجل في هذا المستوى والمكانة يقود رجال لهم من المكانة ما لهم يقع في مثل هذا ومع هذا اقول لو هو قول حماسة فاقل واجب ان يغضب ويتحمس ويصرح ...<br />وان كان صدقا ما يقول فهل تخشون على الاخوان من استغلال الامن لتصريح مرشد الاخوان<br />ام تخشون ان يكون لديه 10000 مقاتل<br />لو تخشون على الاخوان فوفروا خوفكم فهذا شأن داخلي هم اولى بذلك من غيرهم<br />وان كنتم تخشون من وجود 10000 مقاتل فهم لم يستخدموا ضدد احد حتى ان وقوات الامن اضعاف اضعاف ذلك اضافة الى اننا في حالة حرب بغض النظر عن السنوات الماضية من معاهدة الاستسلام والتي لم تأت باي تنمية او رخاء كما كان متوقع ومع هذا اوقف التدريب العسكري في المداري والجامعات كان الشعب كله مدري مش 10000 يمكن على حمل بنادق الصيد بس كان يمكن يستخدما لو حد قرب من بيته وعلمناهم مكانها رقص البالية وكرة الفولي بول ايه رأيكم في مستر ايجبت كان بنت حلال صح شاب يفرح اعتقد اهله كانوا فخورين بانتصاره نفس الفخر اللي كان هايفخر به اهل العراق بممثلتهم في ملكة الجمال<br />يا جماعة الخير تجاوزوا حدود التصريحات طالما هي مازالت في حدود التصريحات وان تخت ذلك الى حدود الافعال ومسلطة على العدو فتحية للرجل والف تحية<br />وان تجاوزت حدود التصريحات على رقابنا فلن يجدوا من يقف الى جوارهم في بلد ال73000000<br />الوحدة يا اخوة الوحدة مع انفسنا والله عجيبة انتم عايزين ايه حد يقف مع نفسة ويسألها عايزه ايه لا التصريحات النارية نافعة والا اللي بيقول مش حانحارب من اجل حد عاجب بس<br />اقرأ بقية التعليق .."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

