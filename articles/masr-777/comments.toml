subject = "بذاءة محمود"
author = "ناصر سعد الله"
posted = "2006-08-08"
text = "الواد محمود ده بذئ اللسان زى ما بيقول مسعود و باين عليه فعلا من طبالين الزفة بتوع الحزن الوطنى .... إنتا تطول حتى تبقى ضفر مجاهد من المجاهدين اللى إنتا و أمثالك عايشين بس تحت حماهم و لولا هما و لولا إسرائيل حبيبتك عارفة إنهم لسنا موجودين فى أمة المسلمين كانت فعصتك من زمان"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 19
subject = "اخوة لبنان"
author = "عبدالله الشيخ"
posted = "2006-08-08"
text = "سيدى المحترم<br />اذا كان المرشد يتكلم عن ارسال عشرة الاف من الاخوان , فاحب ان اعلمك ان الاخوان المسلمين موجودون في اكثر من مائة دولة في العالم ليس في مصر فقط ؛ يمكنني تفسير هذا الكلام انه امر للأخوان في لبنان ان يتدخلوا في المعركة الان واذا كان الاخوان يتدربون على السلاح لكي يستخدموه في مثل هذه المواقف فعليك ان تحمد الله انهم يفعلون ذلك ام كنت تحب ان يفتح باب للدفاع عن لبنان فلا تجد شخص مدرب للذهاب ."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 20
subject = "معلش يا أحمد"
author = "مساء الخير"
posted = "2006-08-08"
text = "والله ياأخي كان نفسي فعلا تلقط الإخوان وتصريحات المرشد في لقطة أفضل من اللقطة دي شوية..<br />أنا بصراحة شايف ان التصريح مفيهوش مشكلة كبيرة.. عادي يعني.. خلي اللي يتكلم يتكلم.. وهو على فكرة في التصريح ده بيتكلم من حكم معرفته بالاخوان لانه مرشدهم.. والتصريحات اللي فاتت كانت مشكلتها انه بيتكلم في حاجة تخص كل الناس سواء \"طز في مصر\" أو \"هنضربهم بالجزم\"..<br />لكن طالما الراجل قال كلام يبقى مسؤل عنه.. وميصحش يا بطل اننا نمسك للراجل على الواحدة.. خلينا نشوف فعلا.. هل لو اتفتح الباب لارسال متطوعين الاخوان يقدروا يبعتوا الرقم ده.. وانت عارف كويس يا أحمد انهم يقدروا يبعتوا اضعافه.. وده شيء ميفرحش قد ما يخلينا نتأمل في قدرة الجماعة دي على الحشد ونسأل ايه هو سر قوتها..<br />فاهم ياعم.. يعني الراجل بيقول تصريحات كتير غلط.. لكن مينفعش نقول ان كل تصريحاته غلط.. ده تصريح متوازن من وجهة نظري ومش حماسي ولا دعاية.. هو بيضغط وبيقول ان الشعوب والرحكات الشعبية عايزة تحارب.. ومتهيألي ان ده دور محمد مهدي عاكف باعتباره مرشد للاخوان ..<br />النقطة الأخيرة يا أحمد انك اتسرعت شوية للاسف في الكتابة عن الاخوان وانت لا تعرفهم جيدا.. فرقم 1000 ليس هو الرقم الذي طالب به حسن البنا.. حسن البنا كان عايز 12 كتيبة كل كتيبة ألف وبحسبة بسيطة تبقى النتيجة 12 ألف.. كون بقى انك مش بتعرف تحسب دي قضية تانية..<br />يا رجالة الله يكرمك.. اشتموا الاخوان واي حد تاني عايزين تشتموه لكن استندوا على معلومات.. بالمناسبة.. هو انت ليه مكمتش المرشد تسأله عن تصريحه.. يعني ليه المقال ماشي في سكة واحدة.. يمكن لانه بيعبر عن رأيك.. برافو عليك"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

[[comments]]
order = 21
subject = "يا بلاد الهوا يا بلاد"
author = "مصراوي بلا حدود"
posted = "2006-08-08"
text = "هل أساتذة الجامعة والأطباء والمهندسين والمثقفين من جماعة الإخوان المسلمين سُذّج حتى يولوا عليهم رجل مثل مهدي عاكف إلا إذا كان أهل لذلك .. هل هذا الرجل الذي قال لا في زمن الضعف والهوان وكان مصيره السجن يكون هذا جزاؤه من نفوس ضعيفة .. تريدون مصر وكما قال نجيب سرور (( يا بلاد الهوا يا بلاد يا بلاد النجوى فؤاد )) .. نعم كثير منا يريد مصر علمانية وياريت كمان يبقى الحكم أمريكي إسرائيلي عشان الديمقراطية ويبقى زواج الدم والبصمة والكاسيت جائز .. مصر التي في خاطري هي مصر الطيبة والأخلاق والإيمان .. ولمن لا يعرف لم يصوّب الإخوان بندقية في وجه أي مصري ولمن يريد أن يعرف التاريخ فإن الإخوان المسلمين أذاقوا إسرائيل الأمرّين في حرب 48 وقد اعترف الصهاينة بذلك .. يا سيد مهدي نحن نحترمك ونجلك ولا نشك لحظة في إيمانك ووطنيتك .. الله يحفظكم ولا تلتفت لأبواق النظام الفاسد الصهيوأمركي."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123422/http://masr.20at.com:80/article.php?sid=777"

