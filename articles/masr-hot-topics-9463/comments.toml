text = "ايه يا عم القرف ده—انا حسيت من الكلام انى هشوف ف الصور حاجه جامده<br />بس طلع خرابه—او غرزه—حاجه زي كده<br />عارف احلى حاجه فيه ايه؟؟ اليافطه الكمبيوتر اللى بره"
