posted = "2009-04-23"
text = "على فكره انا رحت حمام التلات والمكان يتميز بتراث قديم مميز جد وبيجعل المكان جامد جدا وعلى فكره المكان احسن من الصور كتير والمهم فى المكان انه الناس العاملين بالمكان لهم طريقه جميله بالتعامل وبعدين ياستاذ محمد اذهب للمكان قبل ماتعلق من صور اللى صور تقريبا مش عرف ازاى يصور المكان وصدقنى هتيدعيلى"
archived = "2009-06-29"
capture_url = "https://web.archive.org/web/20090629101920/http://www.harb.20at.com:80/masr/t7kyk/9463.html"
