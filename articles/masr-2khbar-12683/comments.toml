author = "صناعة الصين طبعا"
posted = "2009-07-18"
text = "بس الخبر لم يذكر اين صنعت الفوانيس<br />وطبعا فوانيس بتغنى وتقول اهلا رمضان تبقى صناعة الصين<br />والصين بتعمل الفوانيس وسجادة الصلاة<br />واحنا بس رجال الاعمال بتوعنا متخصصين فى صنع الشيبسى والكارتيية وبالشطة والفلفل<br />هيصوا يا مصريين<br />السنة اللى فاتت استوردنا ب 100 مليون دولار فوانيس"
archived = "2009-07-19"
