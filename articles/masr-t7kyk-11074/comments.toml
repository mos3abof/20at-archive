posted = "2009-01-27"
text = "الله يسامحك يا اخي<br />هو احنا كنا ناقصين نشوف الصور دي كمان<br />الله يخربيت الحكام على اليهود على الأمريكان<br />وبعد ما شوفنا الصور دي … نعمل ايه بقى<br />هنفضل ساكتين كده<br />هيجيي اليوم اللى هيتعمل فينا كده ومحدش هيعبرنا احنا كمان<br />حسبي الله ونعم الوكيل"
archived = "2009-05-09"
