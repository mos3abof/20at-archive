text = "الموضوع راائع يا خباب<br />لازم الناس كلها تشوفه<br />العالم كله<br />وهيجي اليوم اللى هناخد حقنا فيه<br />حسبى الله فيهم وفي ضعفنا وغبائنا وجبننا"
