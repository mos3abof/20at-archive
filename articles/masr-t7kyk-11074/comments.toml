author = "يا عمى"
posted = "2009-01-26"
text = "موضوع متميز جداً جداً<br />واااااااااااااا اااااااااااو<br />و المشاهد فعلاً .. مش لاقيلها وصف لأنها فوق البشاعة و الوحشية<br />بس برده لازم بقى الى هياخد خطوات جااادة فى محاكمة المسئولين .. يبتدى من دلوقتى<br />اصلك عارف اننا بنثور مرة واحدة … وننهبط بمجرد ما حد يلهينا بلعبة ولا حاجة .. زى الاطفال الصغيرين<br />ربنا معاهم يارب .. وينصرهم"
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509191711/http://20at.com:80/masr/t7kyk/11074.html"

