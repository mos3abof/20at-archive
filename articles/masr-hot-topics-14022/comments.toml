author = "hongool khalaf"
posted = "2009-11-13"
text = "نلعب بالطريقة التقليدية بتاعتنا 3/5/2<br />حراسة المرمي : الحضري<br />الدفاع:<br />ليبرو هاني السعيد\"علشان تقيل وممكن يزيد في التص\"<br />مساك ايمن عبد الظاهر السقا \"مكان وائل جمعة اللي مش هيلعب\"<br />مساك أيسر شريف عبد الفضيل\"كان بيلعب في الأسماعيلي باك شمال وقت الزوم رجله الشمال هايلة\"<br />باك يمين أحمد فتحي \"لسببين هو خبرة اكتر من المحمدي والجزائر الشمال بتاعهم حريف كورة أحمد فتحي هيسد معاه دفاع وبسرعته يعمل خطورة من وراه والمحمدي على الدكة لو احتجناه\"<br />باك شمال سيد معوض \"دفاع وهجوم ملوش حل\"<br />خط الوسط:<br />ارتكاز محمد شوقي \"نص دفاع خبرة وده وقته\"<br />ارتكاز حمص \"بدلا لحسني اللي ممكن الأصابة تكون مأثرة عليه وتميز حمص انه هجومي ودفاعي بطريقة مرعبة لأي فرقة ومبيغلطش تقريبا وده محتاجينه وهادي الأعصاب رمانة الميزان في قلب الملعب\"<br />صانع الألعاب: أبو تريكة \"مش هتكلم عن ابو تريكة الجبار\"<br />الهجوم:<br />1- زيدان \"تميز زيدان انه بيخلص وسريع وجريئة ومش بيخاف ومش بيضيع كتير زي متعب وده المطلوب\"<br />2- عمرو زكي \"دور البلدوزر انه يهد دفاعهم ويسحبه معاه في 18 بتاعهم والمدافعين متحركوش قدام كتير فيكون هناك زيادة عددية مطلوب في وقت زي ده\""
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114092323/http://www.20at.com:80/masr/hot-topics/14022-2009-11-12-16-42-31.html"

