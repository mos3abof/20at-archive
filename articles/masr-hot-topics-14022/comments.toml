author = "عبد الرحمن الموافي"
posted = "2009-11-13"
text = "أفضل يحتفظ ببركات كمخزون استراتيجي وورقة رابحة ممكن تعمل دربكة كاملة ف صفوف الجزائر .. تشكيلي :<br />حراسة المرمى الحضري<br />مساكين :السقا وهاني سعيد<br />باك يمين فتحي وباك شمال معوض<br />ونج يمين أحمد حسن وونج شمال محمد زيدان<br />ف النص تريكة وحسني عبد ربه ((مع)) الالتزام الكامل لحسني عبد ربه بالدفاع ،ويكتفي بالتسديد البعيد، ومع تبديل تريكة وحسن ف الاماكن وقت اما نفقد الكورة .<br />قدام متعب وزكي<br />وبعد وقت معين ف الشوط الاول ـ ع الدقيقة 30 كدا ـ ينزل بركات ونج يمين وزيدان يطلع قدام وحسن يروح شمال وتريكة يفضل ف النص<br />لإن ميزة تريكة انه متعود على اللعب مع كل اللعيبة دي ويقدر يربط الدفاع بنص الملعب بالهجوم كويس أوي،ولازم منفقدوش الميزة دي.<br />لازم نخلي بالنا م الدقيقة 30 لغاية الدقيقة 40 لإنهم هيهاجمونا فيهم غالبا .. لازم نركز أوي مهما كانت النتيجة وقتها.<br />الروح مطلوبة ف جميع أوقات المباراة ،وبرضو مهما كانت النتيجة.<br />ربنا معاكو يا رجالة"
archived = "2009-12-19"
