posted = "2009-11-13"
text = "الطريقة 3 - 5 - 2<br />حار المرمى : عصام الحضرى<br />الدفاع : ليبرو ( هانى سعيد )<br />مساك ( احمد فتحى )<br />مساك ( عبدالظاهر السقا )<br />خط الوسط : وسط ايمن ( محمد بركات )<br />وسط ايسر ( سيد معوض )<br />وسط مدافع ( محمد شوقى )<br />وسط مدافع ( محمد حمص )<br />صانع العاب متقدم ( محمد ابوتريكة )<br />خط الهجوم : راس حربة ( عمرو زكى )<br />راس حربة ( محمد زيدان )<br />هدف الخطة :<br />وجود خبرة فى كل الخطوط ممزوجة بالشباب فى كل خط من الخطوط<br />الاستفادة من طول عبدالظاهر السقا فى الخلف واجادته لضربات الراس فى الهجوم<br />الاستفادة من قوة وصلابة احمد فتحى فى الدفاع<br />ضمان وجود جناحين طائرين للملعب وهما بركات ومعوض<br />الاعتماد على هدوء اعصاب حمص فى وسط الملعب ورؤيته الجيدة للملعب كبديل لاحمد حسن الذى يتعمد الاحتفاظ بالكرة وذلك بجوار شوقى البلدوزر مع الزامه بعدم تعمد الخشونة مع ممثلى الجزائر<br />المرونة فى الهجوم بامكانية تبادل الادوار المستمر بين ابوتريكة وزيدان مع امكانية تعاون بركات معهم وتغطية حمص لمركزه"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114092323/http://www.20at.com:80/masr/hot-topics/14022-2009-11-12-16-42-31.html"

