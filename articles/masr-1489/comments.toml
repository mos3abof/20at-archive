[[comments]]
order = 4
subject = "الاعلام بين الحقيقة والخيال"
author = "حافظ الحاسى"
posted = "2007-01-26"
text = "الاسف الاعلام المصرى هو سببكل الحساسية بين الفرق والمنتخبات العربية اولا من بداية مباراة ليبيا ومصر فى تصفيات المونديال المانيا عندما قال بان ليبيا جسر عبور الى المانيا وليبيا منتخب ضعيفة ولم فازت ليبيا تغير الكلام واما بخصوص مبارة الاتحاد والزمالك المقامة فى مصر مادا فعل الزمالك الى بعثة الاتحاد لليبى الاسف لم تقوم حتى باستقبال البعثة او الكريم بيهم والاشياء الغريبة التىفعلوها الى البعثة من ناحية الاقامة والضجيج من اجل ارهاق البعثة اما بخصوص المباراة ليبيا ومصر الاخيرة لايتدخل الامن او الجمهور الى الاعتداء على الاعبين بل احد الاعبين المنتخب فقط ولكن يبقى سؤال مادا فعل الاعبين المصريين حتى يعتدى عليهم الاعب ممكن شتموا او قاموا بشى مشين بلاش نسبق الاحداث"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128172051/http://masr.20at.com:80/article.php?sid=1489"
