text = "مطلوب حارس لكل لاعب<br />ويوجد مطرب لكل مواطن<br />و10 عساكر امن مركزى لكل لكل متظاهر<br />ومحكمة لكل ناشط سياسى<br />ومعتقل لكل محافظة<br />اية الخير دة كلة<br />دا احنا شعب خلاق ومبهر<br />يا حلاوة"
