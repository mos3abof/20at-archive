[[comments]]
order = 0
subject = "ليه فضوا الاعتصام"
author = "لما هما مخدوش حقوقهم ليه فضوا الإعتصام اللى أثبت إنه خير وسيلة لحصولهم على حقوقهم ويشل حركة الحكومة نهائياً"
posted = "2007-02-11"
text = "نرجوا حذف اللينكات الثلاثة اللى فوق حيث أنها ليست لها علاقة بالموضوع"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214064256/http://masr.20at.com:80/article.php?sid=1570"

[[comments]]
order = 1
subject = "فين"
author = "مصانع بتتباع أنا نفسى أعرف المصانع دى بتتباع لمين؟ وبكام؟ وفلوسها بتروح فين؟ وإيه اللى بيستفيده العامل من بيع المصانع واللى بيعود عليه؟ وإيه إللى بيستفيده المصريين من بيع المصانع وبيعود عليهم؟"
posted = "2007-02-11"
text = "الواضح إنها كعكة وبتتقسم على مجموعة رئيسهم مبارك وزوجته وإبنه وفى النهاية الشعب بيخسر"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214064256/http://masr.20at.com:80/article.php?sid=1570"

[[comments]]
order = 2
subject = "للاخ صاحب فين"
author = "كان فية مصنع مبنى من ايام ناصر ومهندس مصر عزيز صدقى اطال اللة فى عمرة"
posted = "2007-02-11"
text = "المصنع دة اسمة شركة النصر لصناعة المراجل البخارية<br />باعوة المتامرون على بيع مصر لشركة امريكية او اسرائيلية اللة اعلم ما تخفى النفوس وطلعت النغمة فى جرايد السح امبوة ان الشركة المشترية هتطورة وتكبرة وتزغطة وتنمية<br />وبعد سنتين الشركة قفلتة بالضبة والمفتاح وباعت الارض وما عليها وهبرت هبرة كويسة<br />طيب يا جماعة الخير عايزين غلايات<br />ردت الشركة ابقوا هاتوا الغلايات للمصانع بتاعتكوا من فرعنا فى اسرائيل<br />عرفت ياسيدى بتنباع لية ولمين"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214064256/http://masr.20at.com:80/article.php?sid=1570"

