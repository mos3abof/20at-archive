subject = "حرام عليكم"
author = "ياء"
posted = "2006-05-16"
text = "يا جماعه حرام عليكم انت وخدين موقف من الواد ليه<br />اكمنى ابو حكمنا بالحديد والنار من 25 سنه وان الحاجه والدته ممتعانا بطلعتها البهيه ولا اخو قلى لامم فلوس البلد<br />ولا عشان الواد واخد حقه تلات ومتلت ومربع ومضلع كمان<br />سيبوا الواد يعيشلوا يومين دا داخل على قفص الزوجيه وما قدراك ما قفص الزوجيه<br />يارب يروح فى رحله من دول ومايرجع تانى وابوه يبعت اخوه يدور عليه مايرجع هوا كمان وكفايه كده<br />ربنا على الظالم وابن ......<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914182807/http://masr.20at.com:80/article.php?sid=333"

