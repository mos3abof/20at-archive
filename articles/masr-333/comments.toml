[[comments]]
order = 16
subject = "طبعا رحلة عمل لإستيراد باقى الطٌرح"
author = "عاشق لمصر كافر بحكومة مصر"
posted = "2006-05-19"
text = "يا جماعة الحكومة اكتشفت ان يوجد جزء من الشعب لم يحصل على نصيبه من الطٌرح (جمع طرحه رأس حريمى للى مش واخد باله )وبسبب عدم حصولهم على نصيبهم من غطاء الرأس المسمى طرحة فقاموا بالتظاهر وعمل شكل وحش فى الشوارع لأنهم تجرئوا وطالبو ببعض حقوقهم ولذلك قام السيد جيمى مشكورا بالذهاب لأمريكا مخصوص ليستورد كمية جديدة من الطرح متوصى عليها من بوش بنفسه تكفى الجميع علشان الشمس ما توجعش دماغنا ونفتكر ان مصر فيها رجالة<br />بس اللى مايعرفهوش السيد جمال مبارك ولى عهد مصر وأمير الصعيد (ولى عهد فاروق كان اسمه أمير الصعيد) أن كلاب الداخلية لن تنفعه ولا والده عندما يحدث الإنفجار بـ70 مليون مصرى فلن تستطيع كلاب الداخلية قتل الشعب كله (وإلا فلن تجد من تحكمه) والانفجار قادم ومن يدعى غير ذلك فهو للأسف لا يرى ولا يقرأ التاريخ . لقد غير بابا مبارك شعار الشرطة منذ سنوات بعد ان كان الشرطة فى خدمة الشعب أصبح الشرطة والشعب فى خدمة الوطن والشعب الغلبان لا يجد من يخدمه وياريت جت على كدة بس , ده الشعار الواقعى المعمول به فعليا هو الشعب والوطن فى خدمة الشرطة وطبعا معروف إن الشرطة ما هى إلا كلب السلطة الوفى الذى لا يتورع عن تقطيع اوصال الشعب علشان العظمة اللى جيمى وباباه بيرموها لهم (بس بينى وبينكم العظمة بصراحة بتكون كبيرة احيانا) واغلب الوقت بتكون بتاعة واحد مننا لكن كلب السلطة اولى بيها مننا لأنه يحافظ لنا على الطرحة<br />دولة الظلم ساعة ودولة الحق إلى قيام الساعة"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914182807/http://masr.20at.com:80/article.php?sid=333"

[[comments]]
order = 17
subject = "السرية مش للاهمية"
author = "اعتقد ان السرية مش للاهمية السرية كانت للتهزيق .."
posted = "2006-05-19"
text = "واشنطن بعتت للبرنس عشان تبلغه رسالة قوية اللهجة مفادها ان اللي العنف والبطش الامني ضد المعارضة بيزعج واشنطن وانها مش راضية . وكانت عايزة تضمن ان البرنس يوصل الرسالة الشديدة اللهجة للسيد الوالد بكل امانة .. فقررت تنقلها الي البرنس الصغير وترسل رسالة اخرى غير مباشرة مفادها انها عارفة كل حاجة وعارفة مين الامر الناهي في المحروسة وعارفة البرنس بيعمل ايه بالظبط ..<br />يعني البرنس الصغير راح غصب عنه .. صعب علي بجد .."
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914182807/http://masr.20at.com:80/article.php?sid=333"

