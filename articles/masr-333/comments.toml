text = "يا اخوانا الود مظلو وغلوب على امره انتو فاكرين آخر زياره لابو لامريكا كانت امته والراجل كبر وصحته ماعدتش تستحم وطيظه بقت ناشفه علشان كده بعت ابنه الصغير الورور اللى لسه ما انفضتش بكارته علشان بوش ينيكه بدل ابوه شوفتوا بقى الود مظلوم اد ايه وبيضحى علشان مصر وقام بالحجهالسنويه لامريكا نيابة عن ابوبس احنا اللى بنسئ الظن وما بنفهمش وما بنقدرش الجهود الجباره اللى بيقوم بيها<br />علشان بس تعرفوا الناس دى ببتعب اد ايه"
