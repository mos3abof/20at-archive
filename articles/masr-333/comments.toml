[[comments]]
order = 22
subject = "منقول"
author = "مش عارفه"
posted = "2006-05-23"
text = "لولا أن مراسلة -الجزيرة- الفضائية قد ضبطت السيد جمال مبارك وهو يتسلل من أحد الأبواب الجانبية للبيت الأبيض، لما عرفنا بخبر زيارته السرية إلى الولايات المتحدة، فى البداية صمتت حكومتنا وحاولت -التطنيش-، ولكن عندما اضطرت الإدارة الأمريكية للإفصاح عن زيارة -ابن الرئيس- لها، أذاعته مصادر الحزب الوطنى أن أمين لجنة السياسات كان يعرض خطوات الإصلاح -الديمقراطي- على الإدارة الأمريكية! وأذاعت مصادر أخرى أن السيد جمال كان يعمل مرافقا لطياره الخاص فى تخليص تجديد رخصته!.<br />فتحت الزيارة -السرية- لجمال مبارك شهية الجميع للتساؤل والغمز واللمز، لكن أهم التساؤلات كانت مرتبطة بنوعيتها: هل كانت زيارة رسمية حكومية أم زيارة حزبية، كما حاولت دوائر الحزب الوطنى إضفاء صفة الحزبية عليها؟!.. هل الزيارة قد دلت بالفعل على أن -التوريث- قد تم أم لا؟!، ما الذى يجعل السيد جمال مبارك يسافر على ظهر طائرة رئاسية دون أى منصب رسمي؟.. ما هو الوضع الدستورى لابن رئيس الجمهورية؟!.. مائة سؤال وسؤال، لكن هناك جواباً واحداً أكبر نعرفه هو أن جمال مبارك كان يقدم للسادة فى البيت الأبيض -كشف حساب- عن ممارسات إدارة والده والعائلة، بينما كانت وسائل الإعلام الحكومية تتشدق برفض الضغوط الخارجية والتدخل الأجنبى فى شئون انتهاكات حقوق الإنسان فى مصر.<br />إذا كان السيد جمال مبارك فى زيارة رسمية حكومية، أو فى مهمة بعثها به والده، فإن التوريث قد تم، وآن الأوان للإعلان عن عدم شرعيته ومقاومته فى الشارع بكافة السبل، وإذا كان السيد جمال - فعلاً - قام بزيارة للبيت الأبيض بصفته الحزبية فالمصيبة أعظم! طبقا لقانون الأحزاب والمادة 21 منه فإن الاتصال بأحزاب أجنبية يتم طبقا لشروط واعتبارات تصفها لجنة شئون الأحزاب، وفى حالتنا هذه لم يقم السيد جمال حت<br />اقرأ بقية التعليق .."
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914182807/http://masr.20at.com:80/article.php?sid=333"

[[comments]]
order = 23
subject = "منقول"
author = "منقول"
posted = "2006-05-23"
text = "منقول<br />:سيدي الرئيس .. أنت جبان<br />أراك تلتصق الآن في مقعدك الوثير، وتثبّت عينيك على الشاشة الصغيرة، وترتعش يداك وهما تتعّرقان حول سمّاعة الهاتف، وقد جاءك صوتٌ من أحد كبار الكبار يطمئنك بأن كل الأمور على ما يرام، وتمام يا أفندم، فقواتك الباسلة، يا صاحب الضربة الجوية الأولى، اخترقت بشجاعة منقطعة النظير جيشاً عرمرم من شباب صغير ومرهَق من السهر استعدادا للامتحانات، ثم لبى نداء قضاته الشرفاء.<br />كانوا عشرة على الرصيف، وجنودك الأبطال أكثر من تسعمئة يحاصرونهم. القانون يقول بأنه يتم القبض على مخالفيه، ثم يُعْرَضون على النيابة. أما قانون الجبان فيطلب من كل ثلاثين أو أربعين كلبا محاصرة مواطن واحد، ثم القائه أرضا، وركله بشدة في كل أنحاء جسده حتى يتورم، وتنفجر من مساماته دماء حمراء قانية.<br />أراك هاربا في ايطاليا أو ألمانيا أو المغرب أو شرم الشيخ، وأتحداك أن تخرج في موكب مخترقا شوارع العاصمة ولو كنت في حماية أمريكا واسرائيل وكل كلابك الذئبية المفترسة.<br />أقدم اعتذاري الشديد لكل الطيارين الأبطال الوطنيين الذين رعتهم سماء مصر في السادس من أكتوبر عام 1973، وأقول لهم بأن هذا الرجل ليس منكم وليس مِنّا.<br />لعلك كنت تستلقي من الضحك على غضروفك الذي آلمك عندما بلغك نبأ تحرش ضباطك وجنودك بفتيات مناضلات أصغرهن أكثر منك شجاعة، وأعمق حبا للوطن، وأقرب لروح السماء منها لتراب الأرض.<br />انتقدتك كثيرا، وكتبت عنك ما ظننت أنه يفجر الماء من الصخر، ولكنني هذه المرة أحمل لك رسالة من سبعين مليونا من المصريين، ومعهم ستة ملايين مغترب منعهم ظلمك أن يدلوا بأصواتهم في الانتخابات الأخيرة خشية أن يكون الوعي قد أصابهم، والخوف من زائر الفجر قد زال عنهم في الغربة.<br />الرسالة التي أستطيع أن أختصر لك فيها ربع قرن من حكمك ا<br />اقرأ بقية التعليق .."
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914182807/http://masr.20at.com:80/article.php?sid=333"

