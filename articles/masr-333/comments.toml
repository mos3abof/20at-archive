[[comments]]
order = 5
subject = "\\\"من مصر، مع حبي\\\".. بطولة جيمي بوند"
author = "أسامة صابر مصطفى"
posted = "2006-05-17"
text = "بداية، أود من أصدقائي الكرام، التركيز الشديد هذه المرة فيما سأطرحه ولكم بالطبع كل الحق في الرد واستنكار ما سأقوله..<br />طائرات ركاب تضرب برج التجارة العالمي، وواحدة ضربت مبنى وزارة الدفاع الأمريكية، وبداية حرب جديدة في نوعيتها تسمى بالحرب على الإرهاب وهذه الحرب التي حملت رايتها أقوى دولة في التاريخ وهي الولايات المتحدة الأمريكية، أعلنت بمنتهى العجرفة، من ليس معي فهو ضدي وذلك على لسان رئيسها جورج بوش.<br />وعندما أعلن بن لادن (أو هكذا رأينا) مسؤوليته عن هذه العملية، قررت واشنطن الانتقام من أفغانستان عسكرياً والقضاء على حركة طالبان التي كانت تأوي بن لادن وتدعمه.<br />وهنا جاء الدور على مصر لبيان ما الذي تستطيع أن تقدمه لأمريكا من خدمات. وعندما سُئل الرئيس مبارك في مقابلة صحفية، عما إذا كانت مصر ستبعث بجنود للمحاربة تحت لواء أمريكا، كما سبق وأن فعلت في حرب استعادة الكويت؟<br />رد الرئيس مبارك بشكل قاطع: \"مصر لن تبعث بأي قوات إلى خارج حدودها، ولكن.. سيقتصر التعاون بيننا على تبادل المعلومات المخابراتية\".<br />مرت أعوام قليلة على هذا التصريح، إلى أن جاء يوم التقى فيه مبارك بشباب الجامعات في محافظة الإسكندرية، وذلك بعد سقوط بغداد تحت الاحتلال الأمريكي بعدة أشهر، هذا اللقاء تناول أحداث العراق بالطبع، وبعد أن تناول الرئيس تصريحات وزير الإعلام العراقي الصحاف بالتهكم وأيضاً لم يبخل على الرئيس العراقي بالاستهزاء من تفكيره العسكري، وفي وسط شماتته غير المبررة، زل لسانه بأمر خطير..<br />الرئيس المصري ذكر أن هناك عملاء مصريين كانوا يعملون في العراق ويبعثون بالمعلومات المخابراتية أولاً بأول للوقوف على الحالة العسكرية للجيش العراقي.<br />في مقابلة صحفية أخرى لمبارك، قال فيها: \"إن لمصر عميلاً في تنظيم القا<br />اقرأ بقية التعليق .."
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914182807/http://masr.20at.com:80/article.php?sid=333"

