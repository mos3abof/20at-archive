posted = "2006-05-18"
text = "يا اخواننا الواد ده راح أمريكا، وكانت الزيارة مستهدفة علنيا.. لكن كيفية إخراجها للنور هو اللي كا تمثيلية..<br />حد يصدق إن الجزيرة اللي ادبوها واعتقلوا مدير مكتبها تتجرأ وتكسر أوامر الرئيس النونو الوريث..<br />لو كانت امريكا عايزة تسمع منه كانت أعلنتها مدوية.. حتى لو كانت مش هتعمل مع النظام أي حاجة.. وده اللي احنا متوقعينه وده اللي هيحصل فعلا..<br />لكن تسريب معلومة الزيارة فيه إيحاء بإن النظام في مصر مدعوم.. لأن أمريكا لم توجه أي لوم علني..<br />وسلم لي على أم الديمقراطية"
