text = "ان شاء الله فى الفوز نقول<br />\" منخب الساجدين يسحق الجزائريين \"<br />\" الفراعنة فى المونديال بعد غياب 20 سنة \"<br />\" شحاتة يعطى الجزائر درسا فى فنون الكرة و يتاهل بجدارة لكاس العالم \"<br />\" رجالة المنتخب المصرى يخرجون الجزائريين و الجماهير المصرية لم تنام \"<br />اما فى حالة الهزيمة لا قدر الله<br />\" منتخبنا الوطنى دمر احلام الملايين \"<br />\" بعد الفوز فى القاهرة يستيقظ المصريين على كابوس فى السودان \"<br />\" منتخب شحاتة زى منتخب سكوب و الضحية هو الجمهور العظيم \"<br />\" منتخبنا الوطنى لعب و خسر بشرف و لم يحالفة الحظ فى التاهل \""
archived = "2009-12-07"
capture_url = "https://web.archive.org/web/20091207040543/http://20at.com:80/masr/hot-topics/13937--15-.html"

