author = "مروان جلال الفحار"
posted = "2009-11-16"
text = "انشاء الله حنكيب ونصعد كاس العالم<br />على فكرة دة يوم عيد ميلادى<br />وانشاء الله نحتفل بية كلنا لان دة حيبقى اسعد يوم عليا<br />الرجالة دى اقل تكريم ليها انها تصعد كاس العالم اى حاجة تانية غير كدة يبقى الجيل دة معملش حاجة<br />يا رب نفوز ونصعد<br />يا رب"
