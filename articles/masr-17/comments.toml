subject = "فلاح : منعرفش الناس دول لاننا مبنشوفهمش"
author = "أحمد بلال"
posted = "2006-03-12"
text = "برغم الهزيمة التي مني بها اليسار في الانتخابات الاخيرة، إلا أنني أفخر أن أكون يساريا، جاء في هذا الموضوع من الاشياء ما تستحق الرد و لما كان ردي عليها سيكون في معرض الهجوم على تيار يساري أو حلقة يسارية فإنني سأتجاوز هذا التعليق، لأن ليس هذا هو الوقت المناسب للهجوم على حلقات يسارية، لأن الأزمة موجودة بالفعل في كل التيارات و الحلقات اليسارية، أزمة قيادات لها في مواقعها القيادية سنوات و سنوات و كانت النتيجة عزلة عن الجماهير و كذب على شبابها و نفاق لليمين سواء السلطة أو الجماعات المتأسلمة، هذه القيادات التي اصطنعت لليساريين لغة مختلفة و مارست عملها اليساري بين جدران اربعة لا يعرف من خارجها حتى من هؤلاء الذين بالداخل<br />و كانت المحادثة التالية هي إحدى نتائج استمرار هذه القيادة في مواقعها<br />قعدت مع فلاح من البنوان كان عند واحد قريبه عندنا في المحلة، قعدنا على القهوة و الحقيقة كان الفلاح فلاح ( قراري ) اتكلم معايا في حاجات كتير عن مشاكل الفلاحين و خاصة المشاكل اللي بتواجهم في زراعة البنجر و اللي طبعا مينفعش اقولها لان كل القيادات و الزعامات اليسارية اللي موجودة عارفاها كويس قوي و خاضت معارك كتير مع الفلاحين ضد السلطة و الملاك عشان الاراضي دي<br />المهم قلت بقى الراجل بيكلمني إنه لازم اللي يمثل الفلاحين يكون فلاح، و انهم بيعانوا من الاغنياء ملاك الاراضي، و محدش يحس بالفلاح غير اللي يمسك الفاس، و إن اللي بياكل عيش \"\"مقدد\"\" مش زي اللي بياكل جاتوه قلت في بالي بقى ياواد خش عليه بالكلمتين اللي حفظتهم و اللي قريتهم في الكتب قلتله<br />يا سليمان إيه رأيك في اليسار<br />قالي : يسار ايه ده<br />قلت : أقصد يعني اليساريين .. الناس اليساريين يا سليمان<br />قالي : الناس الكبار دول ؟<br />قلتله : يا عم بقولك اليساري<br />اقرأ بقية التعليق .."
archived = "2006-05-25"
