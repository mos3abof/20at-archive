[[comments]]
order = 1
subject = "رئيس جمهورية فسادستان العظمي"
author = "شاب مخنوق من البلد"
posted = "2006-06-11"
text = "الي رئيس دولة فسادستان العظمي ارجو ان تتقبل لعناتي ولعنات 72 مليون مصري مخنوقين من حكمك الابدي , وبنقلك يا عجوز مصر بمناسبة عيد ميلادك<br />كل سنة وانت في ستين داهية<br />الهي ما يطلع عليك بكرة وتكون ميت في جهنم<br />قولوا امين<br />اميـــــــــــــــــــــــن"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010105/http://masr.20at.com:80/article.php?sid=502"

[[comments]]
order = 2
subject = "هو م دليفرى"
author = "حبيبه"
posted = "2006-06-12"
text = "كل ما لفت نظرى في هذه الطبخه ما كتبه بلال فضل و ياسر الزيات والباقي مع احترامي عادى جدا هو ثرثرة علي صحفات الصحافة مع احترامي للكاتب الساخر احمد رجب في راي الشخصي ليس مهم الشخص المهم النظام الذى يحكمنا الديموقراطيه ليست جنسيه ولكنها منهج ونظام ثم لايهمني او يضايقني ان يكون جمال مالكا لطائرة او حتي صروخا فهو ابن الرئيس ورجل اعمال وهناك في بلدنا من هم اقل منه شان ويملكون طالما هذاعن طريق الكسب المشروع الشيء الهام هو لماذا جمال مبارك يصعد وغيره لا و ماذا يغريه للوصول لحكم بلد عليل اقتصاديا وسياسيا وثقافيا واجتماعيا الحقيقه نحن بلد خارج التاريخ والجغرافيا والفلك وحساب المثلثات بفضل حكامنا ونحن شركاء فيما وصلنا اليه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010105/http://masr.20at.com:80/article.php?sid=502"

[[comments]]
order = 3
subject = "كوالالمبور ههههههههههههههههههههههههه"
author = "من المجنون الذى تراوده فكره مقارنه رئيس وزرائنا المحبوب احمد نظيف و طويل مع ذلك الشخص المجهول القادم من احد دول جنوب شرق اسيا و الادهى ان عاصمه تلك الدوله كوالالمبور ـ ياله من اسم مضحك سخر منه معظم فنانينا"
posted = "2006-06-12"
text = "مهاتير محمد يحكم مصر مبارك فينشر الخير و النماء و العدل و رغد العيش<br />والله انه لاخر الزمان<br />يا سلام لو كانت الجزمه لبست فى وش امه!!<br />تسلم جزمتك يا استاذ طلعت<br />الرائع بـــــلال فـــــضــــل<br />العبقرى عـــــــمــرو ســـــلــيم<br />و الله الذى لا اله الا هو انى لاكاد اموت خوفا عليكم و اقلامكم من كيد ابناء الافاعى<br />أأأأأأأأأأأأأأأأأأأأأأأأأه يـــــأ بـــــلـــــدى"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010105/http://masr.20at.com:80/article.php?sid=502"

[[comments]]
order = 4
subject = "جاءنا البيان التالى"
author = "نيفين نيفى نوفا"
posted = "2006-06-13"
text = "خلاص يا جماعه طلعت السادلت فصلها بنفسه ف القاهره اليوم امبارح و قال لعمرو اديب انه فعلا لما اتنرفز لقى نفسه فعلا بيقلع الجزمه<br />و عمرو قاله فعلا انت عملت كده و بتعترف قالله اه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010105/http://masr.20at.com:80/article.php?sid=502"

[[comments]]
order = 5
subject = "غرقنا يا سنبل غرقنا"
author = "الاستاذشيكو"
posted = "2006-06-13"
text = "كلنا معاك يا ريس<br />يا بايع ارضنا ودمنا<br />لو حتي غرقتنا 0000 كلنا معاك<br />لو زهقتنا وارفتنا مش هننساك<br />كل يوم معزتك (ماءماءماءماءماء)<br />لو كنت حتي بقرنين ونهقت وقلت<br />انتو فين 00000 بردة معاك<br />زمان قلولنا مات الملك مات او<br />عاش الملك عاش بس ايه<br />انت بقه الله عليك متبت ولازق بغرة<br />وبردة معاك 00000 يا مغارقنا<br />وبايع ارضنا احنا معاك"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010105/http://masr.20at.com:80/article.php?sid=502"

[[comments]]
order = 6
subject = "الباجور منوفية"
author = "ناصر عبدالفتاح موسى"
posted = "2006-06-24"
text = "احب ان الفت نظر سعادتكم الى مهذله حية من مستشفى الباجورالعام حيث توجهت اليهابعدمنتصف الليل حيث كان ابنى عندة غيبوبة سكرولم يتم العلاج الا بعد ان ادفع ثمن تحليل السكرالعادى وفوجئت بانها بعشرة جنيهات ومن المعروف بائها عند الصيدلية بخمسة جنيهات ولاستقبال العام بمستفى الباجورالتذكرة بثلاثة جنيهات ومن المفترض انها مجانا والطبيب المعالج لم يتم الكشف على المريض الا بعددفع التذكرةوهذة الواقعة كانت امامى الساعة الرابعة بعد منتصف الليل ومزق لة التذكرةواختم حديثى بانى هى دية مصرالظلم والظلمات من الحكومة الموقرة ومعى دليل على كلامى هذا وشكرا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183158/http://masr.20at.com:80/article.php?sid=502&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "هكذا تدار الأمور في مصر"
author = "شلولو"
posted = "2006-07-01"
text = "هكذا تدار الأمور في مصر أناس يصرخون ويسبون ويلعنون وأناس يحكمون ويتحكمون ولا يعيرون الناس الأولانيون أي اهتمامون<br />فيا حسرتاه يا حسرتاه يا حسرتاه<br />ملحوظة ( يطلق على هذا الشكل من السياسة \"ديمقراطية كس امكم\" ) التعبير للدكتور أحمد عبد الحميد يونس"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183158/http://masr.20at.com:80/article.php?sid=502&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "الشعب المظلوم"
author = "مواطن مصري"
posted = "2006-10-10"
text = "اي حد امتي يا شعب ها تفضل ساكت علي الي بتعمل فيك الدولة كل يوم تسرق وتتنهب والشعب المسكين لاحول لة ولا قوة والسياسة المتبعة هي انك تقوم في الصباح تفكر في رغيف الخبز ولا تفكر في السياسة المتبعة من الحكومة ورئيسها لن ولم ينصلح حال الدولة الا اذا استقالت الحكومة ورئيسها وسيبوا الشعب يختار رئيسة مش تسلموا الحكم للابن البار والله يكون بعون الشعب المظلوم ."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124911/http://masr.20at.com:80/article.php?sid=502&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "كوكب اخر"
author = "بسم الله الرحمن الرحيم"
posted = "2006-10-11"
text = "حرام عليكم ارجو من الكاتب اسامة سرايا ان يبطل نفاق شوية ويكون موضوعى ولكن كيف وهو يدين لمن وضعة فى هذا المكان كما ارجو من الكاتب المنافق سمير رجب ان لا يكتب ايات قرانية فى مقالاتة وواضح لاى واحد مثقف وشبة مثقف ان الرئيس بيعد ابنة لرئاسة مصر تقلش مصر ديت عزبة ملهاش صاحب وحزبنا الله ونعم الوكيل<br />مواطن مصرى طفحة من النفاق"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124911/http://masr.20at.com:80/article.php?sid=502&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

