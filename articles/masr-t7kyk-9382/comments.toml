author = "عبدة شعار"
posted = "2008-06-19"
text = "كنت من الناس الذين شاركوا فى محو الامية<br />والنتيجة كدة - احنا شعب بيهرج وبيحب الكلام وعمرة ما بياخد الامور بجدية<br />يعنى اية ننادى بشعار محو الامية والتسرب فى التعليم الابتدائى عشرين فى المية<br />يعنى اية محو امية وثلث اطفال مصر ليس لهم مكان فى التعليم الابتدائى وينشأ جاهل من الصغر<br />اعملوا مدارس للصغار يتعلموا فيها الاول<br />واحد زى احمد عز وعندة مليارات كم مدرسة بناها للفقراء<br />الغلبان الفقير اللى عايز يسكن المدينة الجامعية علية محو الامية واحمد عز ورفقائة ميعملوش حاجة"
archived = "2009-07-30"
capture_url = "https://web.archive.org/web/20090730213957/http://www.20at.com:80/masr/t7kyk/9382.html"

