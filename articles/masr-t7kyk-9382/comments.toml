text = "مدينة جامعة حلوان وعن تجربة هي اسوء المدن الجامعية في مصر<br />وجامعة حلوان بتالف قرارات علي مزاجها عشان تعجز الطلبة<br />رضينا بالهم والهم مش راضي بينا"
