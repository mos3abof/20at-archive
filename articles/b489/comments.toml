[[comments]]
order = 2
subject = "عرفي ؟"
author = "sweet_princess"
posted = "2006-02-26"
text = "انا مااعرفش يعني ايه الكلمه دي غير في الحكم العرفي .وعرفي الديك اللي بنتنشق عليه دلوقتي واليه فقط اهدي اغنيه(بحلم بيك انا بحلم بيك ).<br />هما دول بس اللي انا اعرفهم وبعترف بيهم .<br />اما اللي بيقول غير كده مع وافر الاحترام (مع انه مايستاهلش الاحترام )فدا يبقى اسمه زنا مقنع بيلجا له اللي عاوز يريح ضميره ويخليه ياخد تعسيله .<br />ولدول بس انا بفكرهم بحديث النبي عليه الصلاة والسلام<br />ان يضرب احدكم بمخيط في راسه خير له من ان يمس امراة لاتحل له )<br />المخيط يعني ابرة الخياط ( ودي بقى ماتعرفوش شكلها كان ايه على ايام الرسول عليه الصلاة والسلام .<br />واخيرا ......(العرفي دا زنا والله )لانه بيفتقد اهم شروط الزواج وهو الاشهار (الاعلان ).<br />بسم الله الرحمن الرحيم(ولاتفربوا الزنا انه كان فاحشة وساء سيبلا )صدق الله العظيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152512/http://www.20at.com/article2.php?sid=489"
