subject = "سيبوا الخلق للخالق"
author = "دردشه"
posted = "2006-02-25"
text = "يااخى سيبوا الخلق للخالق سيبوا الناس تتمتع بعضها البعض بالحلال احسن يتمتعوا بالحرام انت وانا رجال وعلى فكره النساء صاروا اكثر من الرجال سيبوا الرجال يتمتعوا بالنساء والرجل من المفروض ياخذ اكبر عدد ممكن من النساء ؟؟؟؟<br />مجرد راى لايعبر عن الحقيقه"
