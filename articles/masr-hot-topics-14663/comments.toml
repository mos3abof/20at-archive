subject = ""
author = "لا بد منها"
posted = "2009-12-30"
text = "لا بد من الاجندة فى العمل<br />دايما فى ايدى وفى مكتبى لكتابة ملحوظات فى العمل او نقاط يجب مراجعتها او مشكلة فنية حدثت وتم حلها<br />وهى مرجع وثائقى لكل مشاكل العمل الفنية<br />وكلما انتهى عام احتفظ بالاجندة القديمة كوثيقة مهمة جدا"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129104833/http://www.20at.com:80/masr/hot-topics/14663-2009-12-30-13-45-12.html"

[[comments]]
order = 1
subject = ""
author = "33"
posted = "2009-12-30"
text = "لأ انا بطلت الاجنده من بعد الجامعه بسنه تقريبا كنت بشتريها علشان اكنت فيها مذكرات وذكريات ايام الجامعه بس بعد الجامعه احداص حياتي بقت عاديه وروتينيه مع انه كان فيه ذكريات حلوه بس حبيت احتفظ بيها لنفسي ماحدش يقراها من ورايا ويعرفها غيري. وكل سنه وانتم طيبين"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129104833/http://www.20at.com:80/masr/hot-topics/14663-2009-12-30-13-45-12.html"

[[comments]]
order = 2
subject = ""
author = "انوووووووووووج"
posted = "2009-12-30"
text = "الحقيقه طول عمرى كان نفسى اعرف فايده الاجنده, مع بدايه السنه الجديده الاقى فعلا الناس تسأل هيا فين اجنده السنه دى بس عمرى معرف استخدماتها ايه, وكل مجيب اجنده واقول حبتدى اكتب قيها ايه حاجه بقه الاقى المشروع فشل , على العموم اهى كل من اشكال الاحتفال بالسنه الجديده"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129104833/http://www.20at.com:80/masr/hot-topics/14663-2009-12-30-13-45-12.html"
