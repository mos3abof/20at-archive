text = "بما أنني طالب بكلية الهندسة فقد كانوا يغنون :<br />\" زمان و أنا صغير كنت بحلم أجيب تقدير<br />تعب القلب واتحير من الرسم و من التحبير...<br />و حلمت زمان بـ\"شيت\"*.. و حله يكون معايا<br />و من الأحلام صحيت .. لقيت المعيد ورايا<br />بصيييت بصيييت .. كان بيصححلي الـ\"شيت\"...<br />*شيت : هو الكلمة الانجليزية sheet و تعني مجموعة من<br />المسائل والأسئلة المتعلقة بموضوع معين ..<br />و هي متداولة في كل الكليات العملية تقريبا..."
