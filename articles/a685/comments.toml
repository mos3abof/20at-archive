text = "ههههههه<br />مش ممكن بجد مواقف جامدة أوي<br />إيه دا ، فعلا<br />محمد فاروق أصحابك دول فين من زمان<br />لتكون إنت صاحب الموضوع في منتدى مصر<br />بجد هايل هايل<br />أنا دمعت من الضحك<br />قول كمان :))))))))"
