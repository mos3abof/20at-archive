[[comments]]
order = 2
subject = "حتة جاتوه"
text = "انا قريت الموضوع دا كله مرة واحدة<br />وكنت اتمنى انه ما يخلصش زي ما يكون حنة جاتوه<br />صغيرة كان نفسي تبقى كبيرة قد الدنيا وتفضل معايا زي ما كنت باتمنى دايما زمان<br />على فكرة الواد شمس الدين -3سنوات-كان قاعد مسهم قبل رمضان -على غير العادة-فقلت له مالك يا حبيبي قاللي \"أنا قاعت مستني عمو لمضان عسان ييكي يلاقيني مؤتب\"<br />تقبلوا محبتي<br />وسام"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024134558/http://www.20at.com:80/article.php?sid=685"

[[comments]]
order = 3
subject = "لمبة محروقة"
text = "موقف مضحك حصل من ابن عمي عنده 6 سنين ، راح أول يوم المدرسة أولى ابتدائي ورجع يقول لمامته (( أنا تعبان ، داخل أنام ، تبقي تحليلي الواجب على ما أصحى)) هههههههههههههههه<br />محدش خد باله إنه بيعمل نفس حركات بباه بس الفرق بدل الواجب (الغدا) :))))))))<br />موضوع حلو أي فاروق بجد يجنن ، وياريت أي حد عنده مواقف يقولها خلونا نضحك شوية ، وفعلا جيت في وقتك الموقع كان مرت عليه سحابة كآبة كدة<br />وشكرا ليكم كلكم<br />وسلام للي في بالي :)"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024134558/http://www.20at.com:80/article.php?sid=685"

[[comments]]
order = 4
subject = "أحمد عبيد"
text = "تسلم إيدك يا معلم<br />بجد موضوع مالهوش حل وله في دماغ كل واحد فينا ذكريات وذكريات.<br />* وانا صغير كانوا بيحفظونا نشيد بلادي بلادي في المدرسة، وفيه جملة بتقول \"كم لنيلك من أيادي\" فكنت طبعا حافظه سماعي، وكنت فاكرها \"كمل نيلك من أيادي\" يعني أنا يا بلدي اللي كملت نيلك.<br />** إذا كنا جيل التلفزيون فإحنا كمان جيل \"صفاء أبو السعود\" ..فاكرين أغنية \"جانا العيد\" كانت بتقول فيها \"سعدنا بيها بيخليها ذكرى جميلة لبعد العيد\" بس كانت بتعمل وقف على الدال بتاع سعد.. وكان كل همي وأنا صغير أعرف مين \"سعد\" ده وإزاي هو \"نبيها\".<br />*** آخر حاجة موقف حصل قدامي عند الحلاق قبل رمضان علطول.. طفل صغير قاعد جنب أبوه وبيكلمه عن رمضان فبيقول له \"أنا ح أصوم يوم ويوم\" فأبوه قال له بغضب \"ليه بقى .. أنت كبرت\" فرد الطفل\" ح أعمل زي سيدنا داود\"<br />تسلم إيدك يا محمد وكل سنة والجميع بخير."
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024134558/http://www.20at.com:80/article.php?sid=685"

[[comments]]
order = 5
subject = "وائل عباس"
text = "موضوع جميل جدا جدا جدا<br />رجعنا لايام البراءة<br />انا شخصيا التلفزيون ومجلة ميكي بوظوا فيا حاجة مهمة جدا<br />وهي الاقتناع بان الانسان يدبح الحيوان وياكله<br />مع انها سنة ...<br />الحيوانات كانت اصحابي بطوط وزيزي والحمام والفراخ والوز والحاجات دي<br />ما كنتش مقتنع ان اصحابي دول ندبحهم وناكلهم كده عادي !!!<br />مرة لقبنا حمامة جناحها مكسور خدناها البيت لحد ما خفت<br />وكنا عاوزين نطيرها ... لكن طبعا ... الله يرحمها<br />وكذلك اشتروا بطة وفرخة رومي سميناها الرومية كانت كبيرة واخويا كان بيركبها زي الحصان<br />ومرة جبنا قراميط صاحية<br />حطيناهم في البانيو علشان نلعب معاهم<br />بس كانت نهايتهم صينية ...<br />ومرة جبنا اربع كتاكيت مات منهم اتنين<br />كنا عاوزين ندفنهم زي الناس ما بتتدفن بس ماما ما رضيتشي<br />وانا قعدت اقرا عليهم قران<br />والاتنين اللي كبروا طلعوا ديك وفرخة<br />سميناهم الجوز والمرات<br />بس كانوا بيضربوا بعض<br />وكانت نهايتهم حلة شوربة ...<br />وحتى يومنا هذا مش باحب اللحوم والطيور بالذات ..."
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024134558/http://www.20at.com:80/article.php?sid=685"

