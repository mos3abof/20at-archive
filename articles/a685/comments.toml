subject = "مكسوفة"
text = "وائل طمنتني :) أصلي أنا كمان مش بحب الطيور خالص ومش باعرف أطبخها أبدًا ومش ممكن آكلها<br />لكن اللحوم عادي ، بتيجي مترتبة ومقطعة من السوبر ماركت وتطبخها علطول بسهولة وبتكون شهية ولطيفة<br />أصله مش معقول تبقى نباتي<br />وأنا مش هاطبخ لي أكلة وانت أكلة :)<br />لحوم نعم طيور لا:))<br />الحمد لله :) كل يوم باكتشف فيك صفة مطابقة ليا بالزبط<br />أنا مبسوطة أوي إن الموضوع عجبك وياريت تكتب مواقف تانية<br />وشكرا مرة تانية لصاحب الموضوع خفيف الدم :)"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024134558/http://www.20at.com:80/article.php?sid=685"

