[[comments]]
order = 0
subject = "مسلم"
text = "إنا لله وإنا إليه راجعون.. اللهم اجرنا في مصيبتنا واخلفنا خيرا منها.. وأفرغ على أهله وأحبابه صبرا من عندك يا رحيم وتوفهم مسلمين.. وأرضى اللهم عنه وأرضه..<br />اللهم لا تحرمنا أجره ولا تفتنا بعده.. واغفر له ولنا.."
archived = "2004-06-26"
capture_url = "https://web.archive.org/web/20040626205630/http://www.20at.com:80/article.php?sid=339"

[[comments]]
order = 1
subject = "مسلم برده"
text = "يا ترى هنجمع توقيعات ونعمل حملات بريدية وننشر صور؟؟ يا ترى اللي عملناه مع العراقيين كان نصرة لأخواننا وقولة حق ولا جعجعة طالما محدش هيطولنا؟"
archived = "2004-06-26"
capture_url = "https://web.archive.org/web/20040626205630/http://www.20at.com:80/article.php?sid=339"

[[comments]]
order = 2
subject = "بيرو"
text = "عندي كلام كتير عايز اقوله بس مخنوق قوي كفاية قوي حسبنا الله ونعم الوكيل"
archived = "2004-06-26"
capture_url = "https://web.archive.org/web/20040626205630/http://www.20at.com:80/article.php?sid=339"

[[comments]]
order = 3
subject = "angle"
text = "في الشدائد يختار القلة سلامة المنهج بينما يختار الكثير منهج السلامة.<br />لا أكف عن سماعه يقول لي : ما دمنا نحب طريقنا ونجاهد في سبيل الله ونأمل في غد مشرق بوعدربنا لنا فلن تخبو نارنا تلك التي نوقدها بحب الله ونذكيها بنور كتابه.<br />ثبتنا الله واياكم"
archived = "2004-06-26"
capture_url = "https://web.archive.org/web/20040626205630/http://www.20at.com:80/article.php?sid=339"

[[comments]]
order = 4
subject = "احنا لسه بيحصل في بلادنا كده"
text = "حسبنا الله ونعم الوكيل ....<br />لسه بيحصل في بلادنا كده ؟؟؟ ناس بتتاخد من بيوتها في عز الفجر ومن بين أولادها وتتبهدل وتتهان وتترمي في السجون وتتجرح وتتعذب وتموت زي افلام زمان بتاعة صلاح نصر وغيرهم؟؟؟ لا نقول الا حسبنا الله ونعم الوكيل واللهم أجرنا في مصيبتنا وأخلفنا خير منها ونحتسب الذين ماتوا شهداء عند الله ونقول للحكومة الغراء: والله والله والله سوف تقفون يوماً أمام الله تحاسبون على ما تفعلون بالرعية ولعذاب الله شديد وواقع وتيقنوا بهذا وسوف يدخر الله سبحانه القادر لكم في الدنيا والآخرة ما يرضاه وهو القادر وانتم .....حسبنا الله ونعم الوكيل ."
archived = "2004-06-26"
capture_url = "https://web.archive.org/web/20040626205630/http://www.20at.com:80/article.php?sid=339"

