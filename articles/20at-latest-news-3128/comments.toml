text = "شق الشفة الولادي او الشفة الارنبية cleft lip<br />هو تشوه ولادى يصيب الشفة العليا للطفل لاسباب عديدة. وبالسابق كان يطلق عليه بالشفة الارنبية اي تشبه شفة الارنب , ويكون الشق على اشكال متعددة وقد يصاحبه شق في اللهاة او الحنك او تشوهات في الوجه والانف او يكون منفردا. ويشمل كل او احد مكونات الشفة<br />مكونات الشفة او الشق<br />1-عضلات الشفة<br />2- الجلد<br />3-الغشاء المخاطي الداخلي mucus mem.<br />4-الغشاء المخاطي الاحمر الجاف red mucusa الخارجي للشفة<br />5-عظام الفك-pri maxilla<br />انواع شق الشفة الولادي<br />1- احادي الشق وهو عبارة شق منفرد في الشفة العليا في احد جانبي قوس الحب (وهو يمثل وسط الشفة العليا-cubid bow) او في الوسط.<br />2- ثنائي الشق وهو عبارة عن شقيين في للشفة العليا متناظرين متتساويين في الطول او غير ذالك.<br />3- شق الشفة الاحادي الكامل حيث يشمل الشق قاعدة الانف ايضا.<br />4- شق الشفة الاحادي الناقص حيث لا يشمل الشق قاعدة الانف .<br />5- شق الشفة الثنائي الكامل او الناقص كما في الاحادي .<br />تصل نسبة الإصابة بتشوهات الشفة الأرنبية سواء ارتبط ذلك بـالإصابة أيضا بتشوهات الحنك أو عدمها إلى ما يقارب واحد لكل750 ولادة حية، وعند مقارنة المعرضين للإصابة بهذه التشوهات بين الذكور والأناث، نجد أن إصابة الذكور بتشوهات الشفة سواء كان ذلك مرتبطا بالإصابة بتشوهات الحنك أو عدمها تصل إلى الضعف بالنسبة للإناث. أما بالنسبة لتشوهات الحنك، فإننا نجد أن إصابة الأناث بتشوهات الحنك فقط تصل أيضا إلى الضعف بالنسبة للذكور ولكن دون أن يرتبط ذلك بالإصابة بتشوهات الشفة.<br />اذا فان تعريف التشوه الذي يصيب الشفة<br />الشفة الأرنبية clet lip : عبارة انفصال في الشفة العلوية يظهر كفتحات أو فجوات على السطح الخارجي للشفة ذاتها. يمتد غالبا هذا الانفصال ليصل إلى اللثة العلوية أو إلى ما وراء الأنف شاملا معه عظام الفك العلوي .<br />شق الحنك cleft palate: هو عبارة عن انشقاق في سقف الفم. قد يصيب هذا الانشقاق كلا من الحنك الصلب hard palate (وهو الجزء الأمامي العظمي من سقف الفم)، أو الحنك الرخو soft palate<br />اسباب هذا التشوه ماهي ؟<br />مازالت أسباب الإصابة بتشوهات الشفة والحنك في معظم حالاتها مجهولة حتى الآن. كما أنه لا يمكن التدخل بأية طريقة طبية لمنع الإصابة بها أثناء مراحل الحمل.<br />1-وراثية: يعتقد معظم العلماء أن أسباب الإصابة تعود إلى مجموعة من العوامل الوراثية والبيئية. لذلك فإن احتمالات الإصابة بهذه التشوهات تكون أكبر عند حديثي الولادة في العائلات التي قد أصيب فيها أحد أفرادها من قبل<br />2-ادوية :بتناول الأم خلال فترة الحمل بعض أنواع الأدوية التي قد يكون لها بعض الآثار الجانبية على الجنين. من بين هذه الأدوية أدوية الصرع، بعض أدوية القلب، أدوية علاج حب الشباب والتي تحتوي على - Accutane، أو الكورتيزونات cortisones<br />3- امراض مختلفة: قد تحدث الإصابة نتيجة لتعرض الأم خلال مراحل نمو الجنين داخل رحمها لفيروسات.مثلا كل الحصبة الالمانية والانفلونزا وغيرها من الامراض.<br />4- نقص في التغذية : للحامل لكثير من العناصر الغذائية المهمة مثل الفيتامينات والعناصر والاملاح الضرورية.<br />مثلا الفولك اسد folic acid<br />من الفيتامينات الضرورية لبناء والتحام الشفة في الاسابيع الاولى للطفل وهو داخل رحم الام.<br />المشاكل الصحية التي ترافق الاصابة بتشوهات الشفة والحنك<br />التهابات االاذن الوسطى والسمع: نتيجة لقرب قناة أستاكي<br />الموصلة بين الحلق والأذن من العيب الخلقي وفشل العضلات المحيطة به فإن العديد من هؤلاء الأطفال يتكرر عندهم إ لالتهابات الأذن الوسطى مما قد يسبب ضعف في السمع.<br />ولأنهم أكثر عرضة من غيرهم لتراكم المواد الغذائية السائلة في الأذن الوسطى. من الممكن أن تؤدي التهابات الأذن الحادة إلى فقدان حاسة السمع إذا تركت دون علاج. و لمنع تطور الحالة إلى الأسوء يتم وضع صمامات معينة في الأذن الوسطى للطفل المصاب لمساعدته على صرف المواد السائلة،<br />الرضاعة: نتيجة لوجود ذلك الشق أو الإنفصال في الشفة او الحنك ، فإن الأطعمة والسوائل تنتقل من خلف الفم إلى الأنف. و لحسن الحظ، تتوفر زجاجات الرضاعة المصممة لمساعدة الطفل المصاب بإنزال المواد السائلة من الفم إلى المعدة مباشرة. قد يحتاج الأطفال المصابون بتشوه الحنك إلى استخدام حنك صناعي لمساعدتهم في تناول الطعام<br />النطق: قد يواجه الأطفال المصابون بتشوهات الشفة والحنك أيضا بعض المتاعب في القدرة على الكلام بالشكل الصحيح. حيث إن مخارج حروفهم تكون أنفية و صعوبة في فهم ما يقولونه. فإن هذه المشكلة لا يعاني منها جميع الأطفال المصابين بتشوهات الشفة أو الحنك، وأن التدخل الجراحي يساهم في حل المشكلة جذريا عند بعض المصابين. والافضل استشارة اختصاصي النطق<br />مشاكل نفسية : ان تشوه الشفة قد يؤدي الى صدمة نفسية للابوين وكذالك للطفل عند دخوله الروضة او المدرسة وذالك لكثرة التعليق من قبل الزملاء .بعض الحالات تحتاج لاستشارة طبيب نفسي للاطفال.<br />وكذالك التشويهات المصابة للحالة مثل تشوهات الانف التي تنعكس سلبا على المريض تحتاج لاختصاصي تجميل متمرس لازالة هذه التشوهات اثناء العملية الاولى او لاحقا وحسب مقدار التشوه.<br />مشاكل تصيب الاسنان: مثل تسوس الاسنان او اعوجاج الاسنان وخاصة في التشوهات الكبيرة التي تصيب الفك. وتحتاج لاختصاصي طب وتقويم الاسنان.<br />العلاج<br />ان علاج التشوهات الولادية للشفة والحنك تحتاج لاختصاصات متعددة من الاطباء للحصول على النتيجة المثلى في العلاج ولتقليل من مضاعفاتها.<br />1-اختصاصي جراحة التجميل ويقوم باجراء العمليات اللازمة وعلى مراحل وحسب شدة الحالة وتبداء هذه العمليات بالنسبة للشفة من الاسبوع العاشر الى سن 18-20 سنة وحسب شدة التشوه<br />2- اختصاصي تقويم الاسنان<br />3-اختصاصي انف واذن وحنجرة<br />4-اختصاصي جراحة الوجه والفكين<br />5-اختصاصي نطق<br />6-اختصاصي تغذية<br />7-اختصاصي نفسي للاولاد<br />8-طبيب اطفال اختصاصي<br />ويتم متابعة المريض بصورة مستمرة وحسب شدة التشوه.<br />الدكتور كمال حسين صالح<br />اختصاصي جراحة التجميل والتكميل<br />مستشفى العمادي-الدوحة-قطر<br />drkhsh2001<br />yahoo.com<br />al emadi hospital-qatar-<br />www.kamalsaleh.sptechs.com"
