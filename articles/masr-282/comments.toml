[[comments]]
order = 8
subject = "القضاه ضمير الامه"
author = "من انا"
posted = "2006-05-12"
text = "عندما يتغيب ضمير الانسان يستحل كل شي حرام كما لو انه حق طبيعي له دون خوف من عقاب الله<br />فماذا لو تغيب ضمير الامه فكل فرد ضعيف وما اكثرهم في هذه الامة تكون كرامته وحريته بل ايضا دمه مباح<br />اما اذا نهض ضمير الانسان لايرضي الحرام ويخاف الله<br />مابالك عندما ينهض ضمير الامه بجميع قضاها الشرفاء وما اكثرهم في مصر سوف تصبح مضر جنة لااصحابها وقبرا لاعدائها<br />مكي والبسطويسي انتم محور تغير هذه الامه ياقضاه مصر ياضميرها الحي لا تتنازلوا عن التغيير لانه قادم لامحالة فثقوا انكم منتصرين بأذن الله وكل مصري شريف يؤيدكم"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517233147/http://masr.20at.com:80/article.php?sid=282"
