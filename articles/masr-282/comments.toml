[[comments]]
order = 1
subject = "عاش قضاة مصرنا ألاحرار"
author = "محمد ألمصرى"
posted = "2006-05-09"
text = "عاش قضاة مصر ألاحرار عاش بكم ولكم شعب مصر أرسل أليكم بعظيم تقديرى وأحترامى ولناديكم ألعظيم على وقفتكم ألعظيمة ألتى سيذكرها ألتاريخ فى سجل ألكرامة وألنبل وأقول لكم أن مصر عن بكرة أبيها تساندكم وتشد من أذركم كما نقول لكم نحن بكم ومعكم سنكمل مسيرتكم فلا فائدة فى ألمطالبة بحريةهذة ألبلاد وقضائهايعانى من كبت لحريتة نحن جميعا فداء لحرية قضاة مصر وأن معركة قضاة مصر هى معركة كل مصر . ولن ترككم فى وجهة ألضغاة وحدكم فأمأ ان نتحد ألان أو نصمت للآبد .وأعود مرددأ عاش عاش قضاة مصرنا ألشرفاء"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517233147/http://masr.20at.com:80/article.php?sid=282"

[[comments]]
order = 2
subject = "المصرى الأصيل"
author = "مصرى طهقان من أوضاع الفساد"
posted = "2006-05-10"
text = "تضامنكم مع القضاء ووقفتكم للإعتراض على الظلم شيىء أسلج صدور المصريين بأنهم ليسوا وحدهم بل لهم قيادة وهذا ما يتمناه كل المصريين قيادة تقودهم لتطهير مصر من الإحتلال المستبد الفاقد لكل شرعية فى وجوده ولا يكفى أن نكتب شعارات ونحن نجلس فى أماكنا يجب أن نكون كلنا يد واحدة فالحاكم الفاسد أفقد الشعب ثقته فى نفسه وقدراته على مواجهة الفساد حتى يضمن بقائة ولكن نحن فى حاجة لمد يد قيادتكم للشعب لنتحرر ولن يترككم الشعب فكلنا ضد الحاكم والفساد والحثالة التى تلتف حوله نحن نوليكم قيادة مصر والشعب كله من خلفكم ألم يحين الوقت لإنقاذ مصر من بين أنيابهم"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517233147/http://masr.20at.com:80/article.php?sid=282"

