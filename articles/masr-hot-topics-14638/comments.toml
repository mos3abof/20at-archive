text = "اقتباس ام البانجو !!!!!!!!:<br />هو الواد بطرس بيضرب سجاير محشوة بانجو ماركة الصاروخ<br />- وقال الكلام دة فى انهو قهوة او انهو عرزة<br />يخرب بيتك يا مضروب بسنتك المكسورة وشكل امك اللى يقطع الخميرة من البيت<br />بقى فى ذمتكم دة شكل نصطبح بة على الصبح من غير ما تلبس العربية فى شجرة او الاتوبيس يقع فى الترعة او القطار يولع<br />رجاءا لما تنشروا خبر عنة لا ترفقوا صورتة لانها بتعمل عندى اشمئناط وابقى عايز ارجع<br />أسلوب قذر من وزير\"صايع\"؟"
