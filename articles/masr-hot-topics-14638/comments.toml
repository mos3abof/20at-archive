posted = "2009-12-30"
text = "اقتباس الحق يقال:<br />: لوطلع العيب من أهل العيب مايبقاش عيب<br />نصراني حكم مسلمين هيعمل أيه غير كده:<br />اقتباس جمال محمد:<br />الغلط عندنا طالما مسك مسيحى بيت مال المسلمين<br />و مال دين أم أى حد بدين أم قلة الأدب ؟؟<br />هو أى واحد إبن وسخة يلاقى واحد مسيحى بيشتم ولا بيعمل أى حاجة غلط يقولك أصله مسيحى ؟؟<br />يعنى هو مفيش أى واحد مسلم بيسب الدين ؟؟<br />هى كس أم المعرصة مش هتسيب البلد دى بقى ؟؟؟<br />و كلنا عارفين إن أى وزير بينفذ السياسة العامة للدولة و زى ما قالها واحد من الوزرا قبل كده إن كل الوزرا مجرد سكرتارية للرئاسة !!<br />يبقى ماله بقى إن بطرس غالى مسيحى ولا مسلم ؟؟؟<br />و ماله لما أى واحد مسيحى إبن [ *** ]ة سب الدين فى الشارع ولا أى واحد مسلم إبن [ *** ]ة بردو سب الدين فى الشارع ؟ دى مالها بدينه ؟؟؟<br />إرحموا البلد بقى يا إخوان يا متأسلمين و شوفوا المرشد اللى بعبصكم و زور الإنتخابات بتاعتكم و بعدين إبقو تعالو إتمنيكو علينا<br />و النبى بلاش كل واحد طيظه واكلاه يطلع يطفح كلمتين و يعملى فيها محلل سياسي"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102080535/http://www.20at.com:80/masr/hot-topics/14638-2009-12-29-10-33-35.html"

