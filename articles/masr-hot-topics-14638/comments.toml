text = "اقتباس جمال محمد:<br />الغلط عندنا طالما مسك مسيحى بيت مال المسلمين<br />بيت مال المسلمين لم تمتلىء خزائنة الا على ايدى المسحيين أصحاب الزمة ؟<br />فرغت خزائن بيت مال المسلمين الا عندما ترك الامر لعديمى الزمة من \"المسلمين\"؟<br />و التاريخ خير شاهد؟<br />و هطلع ايمان اى كلب و سخ يشتم المسحيين فى عقيدتهم السمحاء؟"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102080535/http://www.20at.com:80/masr/hot-topics/14638-2009-12-29-10-33-35.html"

