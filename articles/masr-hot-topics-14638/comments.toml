author = "دين اللى خلفوة"
posted = "2009-12-29"
text = "مش بطرس غالى باشا بس اللى بيقول كدة لوحدة للمواطن المصرى<br />ها اطلع دين اللى خلفوك<br />تسمعها فى قسم الشرطة من اى ضابط او امين شرطة لاى مواطن<br />تسمعها فى الجيش حينما تكون مجند<br />دى سياسة حكومية عامة من ايام المماليك وهى سياسة احتقار المصرى الفلاح من صاحب اى سلطة فى البلد دى<br />علشان كدة لازم يبقى فية تغيير<br />لازم يزال حكم العسكر الغبى وحكم الحزب الجاهل الحرامى<br />لازم يتغير دم الحكومة وييجى واحد زى البرادعى نظيف وعندة شفافية وشاف الناس المحترمين برة بر مصر فى الخارج بيحترموا المواطن قد اية<br />لازم تتغير القذارة العسكرية التى تحكمنا من 23 يوليو<br />لازم البرادعى يخلصنا من حكم الامن وقفل الشوارع واخلاء المدينة علشان عجل ابيس هيزور المكان<br />لازم ننظف البلد من العجول والتيوس والبلادة والتناحة<br />مش بطرس غالى لوحدة"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102080535/http://www.20at.com:80/masr/hot-topics/14638-2009-12-29-10-33-35.html"

