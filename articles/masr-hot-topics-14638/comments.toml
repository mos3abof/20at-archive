posted = "2009-12-31"
text = "للاسف اللى يعمل هذا العمل السافل لا يستحق ان يكون و زير ولا حتى غفير!!!<br />بغض النظر عن كونه مسلم او مسيحى فلا المسلم ولا المسيحى يرضى ان يهان دينه من اي مسلم او مسيحى اخر حتى لو كان رئيس ميش و زير.<br />ارجو ان يحاسب هذا الشخص (الوزير!!!) بالاقاله الفوريه حتى يكون عبره لاى وزير يتطاول على الدين.<br />ياريت كل انسان مصرى يعبر عن رأيه تجاه هذا الشاخص - وانا متاكد انه لا احد يرضى بهذا الشتيمه القزره . فلابد من المحاسبه"
