text = "السلام عليكم<br />اولا احب اهني كل واحد شتم في الوزير علي الذنوب اللي اخدها واقوله اتق الله في نفسك وثانيا ماعلينا سوي ان احنا نقول للوزير المبجل ربنا يرحمه لان رسولنا الكريم امرنا اننا ندعيلهم بالرحمه(مش نشتم فيهم)<br />لا اله الا الله"
