text = "اقتباس طيزط حمرا:<br />اقتباس A7MED LOTFY:<br />ممدوح زكى زخاري<br />كاتب إسمك بالكامل ليه يا روح أمك ؟ فاكر نفسك رايح تعمل بطاقة ؟<br />لا يا حليتها … رايح يعمل اشتراك مترو …<br />ونتا مال اهلك ما يكتب اللى هو عاوزه<br />ولا هو تعريص و خلاص .. لقيت نفسك مش قاتر و الشتيمه هتنقط منك ونا واقف<br />قلت اما اشتم على اى حاجة و خلاص ؟؟؟<br />ايه الناس الخرى دى ..<br />ده بتاع أمك هو الى أحمر يا [ *** ]"
