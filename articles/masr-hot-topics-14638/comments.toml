author = "م/طاهر سيد عباس عكاش"
posted = "2009-12-31"
text = "لو شايف ان ده برلمان يحترم ماكانش سب الدين ولكن شايفه برطمان واللى جواه شوية زتون مخلل لو شايف رجاله فى الدوله ماكانش سب الدين فمن حقه الى ان يحس اويشوف البلد فيها رجاله وماتنسوش تسلمولى على شيخ الازهر وتسألوه على رأيه فى سب الدين علشان يقولكم هل بطرس غالى يقصد سب الدين ولا الديك ولا الديب طبعا شيخ الازهر هيقول احنا هنكنس عليه السيده والحسين واحسن تعليق ممكن نقوله حزينه يامصر"
