order = 0
subject = ""
author = "بصو في الصورة كويس"
posted = "2009-12-29"
text = "الصورة دي على ما يبدو في حاجه اسمها مجلس الشعب<br />او<br />البرلمان<br />وعلى ما يبدو ان دول شوية عيال طراطير كل واحد فيهم سعى للعضوية من اجل مجد شخصي له ولا علاقة له بالشعب ولا مصالح الشعب واقول لهم ان مهمة البرلمان الرئيسية هو مراقبة رئيس الجمهورية وعزله اذا لزم الامر<br />اي والله<br />البرلمان من سلطته عزل رئيس الجمهورية<br />والبرلمان الامريكي مرة عزل نيكسون رئيس امريكا<br />واجتمع لعزل كلينتون وكلينتون كان واقف على باب البرلمان منتظر النتيجة<br />لكن احنا عندنا رئيس الجمهورية هو اللي من حقه يحل البرلمان<br />يبقى لزمته ايه<br />طز فيكم يا شوية مرتزقه سواء كنتم وطنيين او اقباط او اخوان<br />طز فيكم جميعا يا شوية ارزقية<br />المواطن الشريف لا يرشح نفسه في مجلس الشعب ولا يروح انتخابات من اصله<br />سلام"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102080535/http://www.20at.com:80/masr/hot-topics/14638-2009-12-29-10-33-35.html"

