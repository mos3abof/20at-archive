author = "مواطن ماهور على حال"
posted = "2009-12-30"
text = "للاسف هذا واقع المصرى اليوم مهان من كل الحكومه فى اقسام الشرطه فى المصالح الحكوميه قاى يعنى تيجى من وزير هو على راسه ريشه يقول من حقه فحق المصرى راح بسلبيته وطيبته الملهاش حل سكوت المصرى على هؤلاء من زمان جعل حالنا اليوم هكذا فلا تبكى على اللبن المسكوب ولا حول ولا قوة الا بالله وربنا يخلينى جمب الحيط زى محنا مشين دى بقى هدف المصرى اليومين دول ربى عيالك سلام"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102080535/http://www.20at.com:80/masr/hot-topics/14638-2009-12-29-10-33-35.html"

[[comments]]
order = 11
subject = ""
author = "مليون و250 الف جنية"
posted = "2009-12-30"
text = "مرتب اشرف العربى رئيس مصلحة الضرائب - مرتبة الشهرى مليون وربع المليون جنية مصرى فقط لا غير<br />اشرف العربى اختيار وتعيين يوسف بطرس غالى<br />وولاد ال !!! رايحيين مجلس الكلام او البرطمان يتكلموا على هدم وازالة بيوت الغلابة فى عزبة الهجانة<br />الغلابة بتوع عزبة الهجانة اللى الحكومة نسيتهم فدبروا حالهم واتصرفوا فى بيوت يسكنوها بدل المقابر - تكافئهم الحكومة بهدمها وبطرس غالى يسب دين ابوهم<br />فى ذمتك دى تنفع دولة<br />اكيد دولة على بابا والاربعين حرامى"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102080535/http://www.20at.com:80/masr/hot-topics/14638-2009-12-29-10-33-35.html"

[[comments]]
order = 12
subject = ""
author = "زمان والقطاع العام"
posted = "2009-12-30"
text = "القطاع العام كان زفت وهباب - بس كان بيصرف على الحكومة ويمول حروبها وكل مصاريفها<br />بعنا القطاع العام الوحش السافل<br />الحكومة عايزة تصرف وتمول الامن المركزى وتدعم المواطن الاسرائيلى الغلبان وتدفع فرق سعر الغاز<br />تعمل اية<br />تقوم تعين وزير جباية<br />يلم الفلوس من جيوب الناس باى طريقة<br />رجعوا للجابى القبطى بتاع عصر المماليك اللى بيذل الناس ويجمع الجزية<br />طلع لنا قبطى رزيل جدة شنق او حكم بالشنق على فلاحى دانشواى ايام الاحتلال<br />يعنى راضع الخيانة من جدة الكبير<br />فطلع لنا بحكاية الضريبة العقارية<br />هى مش ضريبة عقارية - لا - هى ضربة عقارية<br />غالى بطل الضربة العقارية"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102080535/http://www.20at.com:80/masr/hot-topics/14638-2009-12-29-10-33-35.html"

