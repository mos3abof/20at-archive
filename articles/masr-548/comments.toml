subject = "صلاة الشكر"
author = "ابو شريف"
posted = "2006-06-21"
text = "اتوقع ان صلاة شيخنا الجليل الراحل لم تكن صلاح فرح او لضعف منه امام بهرجة الدنيا كما ذكر الأخ الكريم جمال ولكنها كانت صلاة شكر علي عدم انتصار الفكر الشيوعي والسلاح الشيوعي في الحرب لان وقتها لن نقول ان مصر كسبت الحرب ولكن روسيا وسلاحها هو من كسب الحرب وحين يكون العمل غير خالص لوجه الله ساعتها يخضع للحسابات الدنيوية والذي يؤكد وجهة نظري ان العديد من ابطال حرب 73 ذكروا انهم في يوم العبور العظيم واثناء الحرب شعروا بقوة غير عادية كامنه بداخلهم وهي قوة الله اكبر<br />والله اعلم"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622150741/http://masr.20at.com:80/article.php?sid=548"

