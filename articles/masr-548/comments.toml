author = "منصــور"
posted = "2006-06-21"
text = "السلام عليكم و رحمه الله و بركاته<br />عفوا سيدى ..جعلت منها عنوان لتعليقى لأن الفهم الخطأ فى نظرى هو ما غلف الموضوع<br />إبراهيم عيسى .. عفوا سيدى<br />لم يسجد الشعرواى شكرا لهزيمه الوطن و لكن سجد لله ليحمد فى الضراء كما يحمده فى السراء ..يسجد لأنه يعرف جيدا إن ربما فى ظاهر الأمر السوء من نتائجه الخير .. و أهم الخير بالفعل وقف المد الشيوعى فى مصر ..<br />محمد المسلمانى .. عفوا سيدى<br />أخطأت حين أخذت من منطق إبراهيم عيسى فى تلك النقطه ثابت فوجهت به الخطأ للشيخ الكريم .<br />شكرا"
