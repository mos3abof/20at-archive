[[comments]]
order = 7
subject = "مين اللي قال؟؟؟؟؟"
author = "معتـــز"
posted = "2006-06-21"
text = "السلام عليكم<br />في سؤال مهم<br />هل قال الشيخ الشعراوي رحمه الله بنفسه أنه كان يصلي شكرا على الهزيمة<br />أم لمجرد صلاته قالوا تبقى صلاة شكر رغم بالمناسبة انه لا توجد ما تسمى صلاة شكر ولكن يوجد سجدة شكر<br />وكان النبي صلى الله عليه وسلم إذا حزبه أمر فزع إلى الصلاة<br />يعني لو في أزمة بنصلي<br />يعني ممكن الشيخ رحمه الله يكون قام يصلي لأننا أصبنا بهزيمة يدعو الله ان تنفك عنا<br />أنا مصمم لو محدش سمع الشيخ بنفسه بيقول إنها شكر..يبقى ده دليل جهل هؤلاء الكتاب وحسبنا الله ونعم الوكيل"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622150741/http://masr.20at.com:80/article.php?sid=548"

[[comments]]
order = 8
subject = "لمصري مقيم بدبي"
author = "عماد الدين"
posted = "2006-06-22"
text = "صح أبو شريف(مصري مقيم بدبي)، الإيمان بالله بيملى النفوس قوة، وبيطلق طاقات كامنة، إذخردها ربنا سحانه وتعالى في عباده. أنا سمعت أيضا من اللواء محمد الفاتح، أشياء لاتفسر إلا بكونها كرامات ومعجزات من عند الله سبحانة، ومنها العدو إن (معلهش يابو شريف-إسرائيل عدو أبدي عندي) إستخدم صواريخ SS20 بكثافة، لصد القوات عن إحتلال جبل المر، ويشاء الله أن الصواريخ كانت تغوص كقوالب الطوب في رمال سيناء ولم ينفجر منها صاروخ واحد.<br />كلمة الله أكبر هي التي صنعت النصر، وربنا نظر لقلوب الجنود والضباط المخلصين، ولو حاسبنا بنوايا السادات الخيانية، لما حررنا شبرا واحدا، يكفي أن نقرأ مذكرات الفريق الشاذلي أو نسمع أحاديثه إبان فترة وجوده بليبيا، لنعلم حقيقة هذا السادات لعنه الله وكل من يحسن الظن به.<br />الشيخ الشعراوي لم يكن العز بن عبد السلام، ولكن مقارنة بالطنطاوي اليوم، يتضح لنا الفرق. أنا مع الرأي القائل أن شيخنا الفاضل كان عنده ضعف لبهرج الدنيا وحب الظهور والإلتصاق بالحكام وإغداق ألقاب وصفات عليهم، لاتحق لبشر أبدا. إحنا النهارده مش هنا علشان نحاكم الشيخ أو ندعي العلم بما كان في نفسه، وأعتقد شخصيا لو كان غرضه خبيث لكتم الأمر.<br />أكبر زلة له، إنه تخلى وهو القادر عن قيادة الأمة روحيا، وتركنا لأمثال بيصار وطنطاوي وعلماء السعودية والخليج اللي حللوا إستباحة بلد إسلامي، وتدنيسه تحت نعال الأمريكان والإسرائيليين. وشكرا."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622150741/http://masr.20at.com:80/article.php?sid=548"

[[comments]]
order = 9
subject = "نزار قباني - قصيدة رسالة الى جمال عبد الناصر"
author = "viking your_guard@hotmail.com"
posted = "2006-06-23"
text = "جمال عبد الناصر ... قتلناكَ<br />نزار قباني<br />قتلناكَ.. يا آخرَ الأنبياءْ<br />قتلناكَ..<br />ليسَ جديداً علينا<br />اغتيالُ الصحابةِ والأولياءْ<br />فكم من رسولٍ قتلنا..<br />وكم من إمامٍ..<br />ذبحناهُ وهوَ يصلّي صلاةَ العشاءْ<br />فتاريخُنا كلّهُ محنةٌ<br />وأيامُنا كلُّها كربلاءْ..<br />2<br />نزلتَ علينا كتاباً جميلاً<br />ولكننا لا نجيدُ القراءهْ..<br />وسافرتَ فينا لأرضِ البراءهْ<br />ولكننا.. ما قبلنا الرحيلا..<br />تركناكَ في شمسِ سيناءَ وحدكْ..<br />تكلّمُ ربكَ في الطورِ وحدكْ<br />وتعرى..<br />وتشقى..<br />وتعطشُ وحدكْ..<br />ونحنُ هنا نجلسُ القرفصاءْ<br />نبيعُ الشعاراتِ للأغبياءْ<br />ونحشو الجماهيرَ تبناً وقشاً<br />ونتركهم يعلكونَ الهواءْ<br />3<br />قتلناكَ..<br />يا جبلَ الكبرياءْ<br />وآخرَ قنديلِ زيتٍ..<br />يضيءُ لنا في ليالي الشتاءْ<br />وآخرَ سيفٍ من القادسيهْ<br />قتلناكَ نحنُ بكلتا يدينا<br />وقُلنا المنيَّهْ<br />لماذا قبلتَ المجيءَ إلينا؟<br />فمثلُكَ كانَ كثيراً علينا..<br />سقيناكَ سُمَّ العروبةِ حتى شبعتْ..<br />رميناكَ في نارِ عمَّانَ حتى احترقتْ<br />أريناكَ غدرَ العروبةِ حتى كفرتْ<br />لماذا ظهرتَ بأرضِ النفاقْ..<br />لماذا ظهرتْ؟<br />فنحنُ شعوبٌ من الجاهليهْ<br />ونحنُ التقلّبُ..<br />نحنُ التذبذبُ..<br />والباطنيّهْ..<br />نُبايعُ أربابنا في الصباح..<br />ونأكلُهم حينَ تأتي العشيّهْ..<br />4<br />قتلناكَ..<br />يا حُبّنا وهوانا<br />وكنتَ الصديقَ، وكنتَ الصدوقَ،<br />وكنتَ أبانا..<br />وحينَ غسلنا يدينا.. اكتشفنا<br />بأنّا قتلنا مُنانا..<br />وأنَّ دماءكَ فوقَ الوسادةِ..<br />كانتْ دِمانا<br />نفضتَ غبارَ الدراويشِ عنّا..<br />أعدتَ إلينا صِبانا<br />وسافرتَ فينا إلى المستحيل<br />اقرأ بقية التعليق .."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906210749/http://masr.20at.com:80/article.php?sid=548"

[[comments]]
order = 10
subject = "السؤال هو"
author = "بهاء"
posted = "2006-06-23"
text = "لا إله إلا الله<br />سيبونا من قباني وميزاني، ومن اللي في كل واد يهيمون ويقولون ما لا يفعلون.<br />الأخ الي ذكر بيصار والطنطاوي.. الخ من شلة علماء السلطان، وضع إيده على الجرح فعلا، ليه علماءنا بهذا الشكل؟ ومش بس عندنا للإنصاف، روحوا أي بلد إسلامي تلاقوا نفس النماذج مع إختلاف الألقاب، ليه كده؟<br />الشيخ القرضاوي ربنا يطول لنا في عمره، يمكن يكون من القلائل الي عندهم فهم وتبحر في الدين وبقية من جرأة إنه ينكر المنكر بلسانه، أخشى ما أخشاه، والأعمار بيد الله، لو ربنا خذ اليه الشيخ يوسف، مايبقاش قدمنا غير أدعياء العلم زي الفيشاوي وعمر خالد، وغيرهم من فقهاء الفضائيات اللي فتواهم بالدولار واليورو.<br />شيخ الأزهر ده فاسق، أقل كلمة يمكن أن يوصف بيها، آخر كلمة قالها الشعراوي لما الحلوف مبارك نجا من محاولة الإغتيال اللي أظنها كذبة، إنه قال وهو بيرعتش\".. لعلنا لانلتقي بعد مؤتمرنا هذا، ولا أريد أن ألقى الله بنفاق...\"، ده كان في سنة خمسة وتسعين، الشيخ كان بيثقل ضميره إنه هادن الفسدة دول زي الحلاليف السادات وزفت مبارك.<br />إزاي يبقى علماءنا زي العز بن عبد السلام؟ ده لازم يكون السؤال!!"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906210749/http://masr.20at.com:80/article.php?sid=548"

[[comments]]
order = 11
subject = "رسالة للطنطاوي"
author = "بيبرس البندقداري"
posted = "2006-06-23"
text = "نقل مراسل 'مفكرة الإسلام' في الموصل عن الشيخ محمد الخطيب أن قوات الاحتلال الأمريكية قدّمت عرضًا مغريًا لعلماء الدين السُنة وخطباء المساجد تشمل رواتب كبيرة تصل إلى خمسة آلاف دولار شهريًا وسيارة، إضافة إلى إعمار مساجدهم مقابل أن يتخلوا عن لهجتهم الهجومية على الاحتلال، وأن يغضوا الطرف عن المجازر التي ترتكبها قوات الاحتلال الأمريكية في الموصل.<br />وقال الخطيب: 'أكثر من 50 إمامًا وخطيب مسجد قُدِم له هذا العرض عن طريق عملاء الاحتلال الموجودين في مبنى المحافظة، بحيث تمت كتابة مطالب الأمريكيين في ورقة ليوقّع عليها من يقبلها ثم يحضر لتسلم مرتبه وجائزته الشهرية مع السيارة وضمان بإعمار مسجده'.<br />وكشف الخطيب عن أن علماء الدين السنة مزقوا تلك الأوراق بعد أن بصقوا عليها وعلى وجه من جلبها لهم.<br />شيخنا كان سيذعن لمطلبهم بدون رشوة ولزرقة عيونهم فقط، ألا لعنة الله على كل فاسق."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906210749/http://masr.20at.com:80/article.php?sid=548"

