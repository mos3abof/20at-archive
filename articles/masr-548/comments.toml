text = "اجنزاء عبارة من مكانها وحدوث حالة هيسترية فى تناولها افلاس والأمر أبسط من ذلك فهمت من سجود الشيخ الشعراوى أنه لايحمد على مكروه الا الله فهل اذا مات اعز الناس لديك ثم دفعك ايمانك بقدر الله أن تتوضأ وتصلى ركعتين وتحمد الله وتسترجع هل يعنى ذلك أنك فرحان أو شمتان لكن المقصود من الزن على هذه الجكاية أغراض اخرى والله أعلم"
