[[comments]]
order = 14
subject = "الحق احق ان يتبع"
author = "يحيى"
posted = "2006-10-25"
text = "عندما قال الشيخ انه صلى شكرا لله بعد الهزيمه برر موقفه و هو انه عندما تتبع الشرق او الغرب تتبعه تبعيه فكريه و سياسيه و كليه و لذلك اذا انتصرنا و كان حالنا على هذا الحال كنا بالطبع سنتمادى و نسير فى ركب لاشتراكيه او الشيوعيه<br />و لهذا اراد الله ان يفيقنا من غفلتنا بهذه الهزيمه لكى نعود اليه و نفيق من من تبعيتنا لهذا او ذاك<br />اذا فهذه الهزيمه كانت انذار من الله تعالى لنا فيجب ان نحمد الله عليها لانها اعادتنا الى الحق و الحق احق ان يتبع"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117202447/http://masr.20at.com:80/article.php?sid=548"

[[comments]]
order = 15
subject = "لم يصلي الشيخ الجليل لاجل الهزيمة"
author = "سميرة"
posted = "2006-10-27"
text = "باسم الله الرحمان الرحيم<br />انا من المغرب اكتب دفاعي عن شيخي الجليل الامام لانه لم يصلي لنصر عدو او لهزيمة مصر انذاك قبل الاجابة اسائل ذلك الكاتب لهذا الموضوع لوكان في روحانية الامام هل ستصلي تلك الصلاة لا او نعم بالطبع نعم لان تلك الصلاة التي صلت من طرفه لم تكن فرحا بل انها ترويح و ازالة هم وغم النكسة التي منيت به بلاده و في عهد رسول الله كان يقول لبلال اررحنا بها فهي قياس لما فعه الامام و انه انسان"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117202447/http://masr.20at.com:80/article.php?sid=548"

[[comments]]
order = 16
subject = "اللهم أرنا الأمور على حقيقتها"
author = "هانى حسنى"
posted = "2006-11-18"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم ورحمة الله وبركاته, أخوانى فى الله أستحلفكم بالله أن تروا الأمور على حقيقتها وأن تدعوا الله العلى الأعلى أن يرزقكم هذه الملكة , فلدى سؤال : هل ما فعله الشيخ - والله تعالى وحده هو الذى يعلم بمراده - بمثل ما فعله أو قاله هذا الشاعر المضل نزار قبانى فى قصيدته التى نشرتموها فى التعليق المرسل اليكم والتى يدعى فيها بكلامه أن عبد الناصر خاتم الأنبياء بعد رسول الله ( مع العلم بأنه لا يعترف بالنبى محمد أصلا )فأرجو من أخوانى أن يتركوا ما لا يعلمون الى الله وحده وألا ينشغلوا بمثل تله التفاهات لدى سؤال آخر<br />هل يأمن أحدكم على نفسه الفتنة ؟ طبعا لا فإذا وضع أحدكم ولا أبرئ نفسى إذا وضعنا فى مكان من تسبونهم وتتهمونهم بالخيانة وموالاة ذى السلطان فلا يأمن أحدنا أن يفعل مثلما فعلوا أو أكثر , وأخيرا أختم بما ورد عن أحد الصحابةوعذرا لأنى لا أتذكر اسمه الآن فقد قال له أحد التابعين لو رأينا رسول الله لما تركناه يمشى على الأرض ( تعظيما له ) فقال له هذا الصحابى أو كنت تفعل ذلك ؟ فقال له التابعى نعم , فقال هذا الصحابى والله لقد رآه أناس ثم كفروا به ولم يؤمنوا فاحمد الله على ذلك . انتبهوا الى ما يهم المسلمين ودعوا ما لا يهم ."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118183941/http://masr.20at.com:80/article.php?sid=548&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 17
subject = "كيف تجرؤ"
author = "محمد حامد"
posted = "2006-12-14"
text = "بسم الله الرحمن الرحيم والصلاة والسلام على اشرف المرسلين سيدنا محمد صلى الله عليه وعلى اله وصحبه اجمعين ثم اما بعد كيف سمحت لك نفسك ان تتصيد للشيخ الجليل مثل هدا الموقف ان تصيد هدا الموقف كمن دخل بستانا كله زهور نضرة فلم يرى كل هدا وانماراى فى وسط البستان زهرة زابلة فلم يعلق على شىء الا هدة الزهرةالدابلة فلقد تركت كل ما قدمه الشيخ للامة ولم ترى الا هدا الموقف الدى جعلت منه جريمة لاتغتفر وان كنت قلت دالك عن الشيخ الشعراوى فهل تجرؤ ان تنتقض احد الموجودين على الكراسى الان اعتقد لا ويكفى ان اقول فيك حسبناالله ونعم الوكيل"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216071627/http://masr.20at.com:80/article.php?sid=548"
