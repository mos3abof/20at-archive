[[comments]]
order = 0
subject = "غفر الله لنا جمبعا"
author = "جمال"
posted = "2006-06-20"
text = "ما كنت أحسبني أكتب قولا كهذا بيوم من الأيام، ولكن غفر الله لشيخنا الجليل ضعفه أمام بهرج الدنيا وحب الشهرة المركبة في نفس إبن آدم. له عندي مع ذلك موقف أحمده، وهو تركه لوزارة الأوقاف بعد أن إتضح لديه أنه لن يستطيع إصلاح قوم طبع الله على قلوبهم بمعصيته وإرضاء الطاغوت. لم تكن سجدته تلك زلته الكبرى، ولعله تأول فأخطأ الحكم والمقياس، وظن أنه يعلم أمورا ظاهرا وباطنا وكشف له الغيب، فقرأ الكفر في قلب ناصر.<br />رحم الله شيخنا، لله دره لولا ضعف بين فيه أمام الحكام، وحرص على الإلتصاق بهم وإن آذاه دنسهم وهو لايشعر، من يدري لعله كان يظن أنه مصلحهم بلين القول والمخالطة المباشرة، ولكن هيهات ماذا يتعلم المهر العربي الأصيل إن ربي بين الحمير، إما شهيقها أو نهيقها نعوذ السامعين منه.<br />كان رحمه الله على سعة علمه وحضوره وتقبله من الأمة كلها، مؤهلا لقيادة هذه الأمة روحيا، ولكنه لم يفعل وتركنا حيارى، إن والله ما أرضى أن تنال منه رغم ذلك كلمة سوء مابين بغداد الى مراكش."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622150741/http://masr.20at.com:80/article.php?sid=548"

[[comments]]
order = 1
subject = "نقطة نظام"
author = "مروة"
posted = "2006-06-20"
text = "أنا لما قرأت مقال أستاذ إقراهيم عيسى أختلفت معه لأنه فهم المسألة غلط صلاة الشيخ الشعراوى مش فرحة بسقوط نظام أد ما هى فى البداية حمد و شكر لله على الشر قبل الخير، دى غير أن النظرة الأيمانية للشيخ الشعراوى الواثقة بالله شافت فى الوقت ده أن دى مش النهاية بالعكس الثبات على الأيمان و شكر الله سبحانه و تعالى سيؤدى و أتخاذ طرق صحيحة للحياة و العمل سيأتى بالنصر ، فى عهد كلنا عارفين أيه الى كان بيحصل فيه و أن السلاح كان روسى دى مش معناه أن الفكر الشيوعى هو الى حارب نظرة الشيخ الشعراوى كانت بعيدة للمستقبل مش للصدمة و حالة الأنهيار الى كان فيها المجتمع بعد النكسة<br />دى غير أن فعلا نظرة د جمال حمدان تشاؤمية بعض الشئ و مش كل الى فى الكتاب صحيح 100% و حرب أكتوبر يجب أن تكون دليل على ذلك"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622150741/http://masr.20at.com:80/article.php?sid=548"

[[comments]]
order = 2
subject = "لندع القول"
author = "سعيد"
posted = "2006-06-20"
text = "إيه! خير القول أن ندع ما لا نعلم الى ما نعلم، ولسنا بمسئولين أمام الله عن الشيخ الشعراوي، ولا بمقدورنا أن نشق عن قلبه لنعلم حقا وصدقا ما دوافعه، فعله حقا ينقصه الكياسة، وأيا كان نوع السلاح فطالما كان بمصر فهو مصريا، وبسلاح الروس قاتلنا بإكتوبر، وبكلمة الله أكبر إنتصرنا.<br />وما أضر الأمة الإسلامية وفرقها إلا السادات، ولليوم تتجرع الأمة عقبى خيانته لأمانات الله والوطن، لندع القول كله والله يحكم."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622150741/http://masr.20at.com:80/article.php?sid=548"

