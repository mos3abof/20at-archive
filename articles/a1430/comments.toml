subject = "عندما تتحول الاعمال الخيرية الي تنمية"
author = "ندما تتحول الاعمال الخيرية الي تنمية تبقي هذه دولة قذافستان الاقتصادية , هذا هو برنامج سيف القذافي التنمية , دولارات , يوروا , أموال طائلة"
text = "فعل الخير لأهل الخير , مش للقذاذفة , التنمية خير من الخير , مؤسسة القذافي للتنمية , شني هالاسم السحنون , متفقعصين علي الطرنزيط الثوري , ويغيروا في الاسامي , مهزلة ثورية ليبية , ما الامر يا ال قذاف هل اوراق مؤسسة القذافي الخيرية بداءت تفضح .<br />الله يكون في عون الشعب الليبي<br />انا افسر هالافعال بشيء واحد وهو ان<br />سيف القذافي يريد ان تأتي الجلطة للعقيد القذافي !"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151131/http://www.20at.com/article.php?sid=1430"
