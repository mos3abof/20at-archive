[[comments]]
order = 1
subject = "نقلا عن احد المواقع"
author = "جماعة الإخوان المسلمين... جماعة فاشلة بامتياز"
posted = "2006-10-14"
text = "للكاتب: أحمد البغدادي (كاتب كويتى)<br />وضعت أميركا حركة حماس ممثلة جماعة الإخوان المسلمين في مصيدة الانتخابات، ووصلت إلى رئاسة الحكومة الفلسطينية. وقبل ذلك وصلت جماعة الترابي ممثل جماعة الإخوان المسلمين في السودان إلى السلطة بمساعدة عن طريق البشير ومن قبله. وفشل كلاهما، حركة حماس والترابي، في القيام بمهام الحكم بنجاح. وقد انتهت التجربة السودانية إلى عزل الترابي عن الحياة السياسية، وفشلت حركة حماس في القيام بمهام الدولة. وها هو الشعب الفلسطيني يتضور جوعا ويقتتل أبناؤه في الشوارع للمرة الأولى في تاريخهم بفضل سوء إدارة حماس لأمور الدولة الوهمية التي لم تخلقها أميركا بعد، ولله أنني لفرح ومسرور لهذا الفشل السياسي، لأنه يحمل بشائر للمستقبل فيما لو فكر أي شعب عربي غبي بتسليمهم السلطة، لأن نصيبهم سيكون الفشل ثم الفشل، ولأن هذه الجماعة لا تنجح إلا في بناء مجتمع شحاذين وطماعين يبحثون عن المال من أجل المال فقط.<br />الفشل السياسي لحركة حماس ومن قبلهم جماعة الترابي (تحولت السودان الآن إلى دولة علمانية!) دليل واضح على أن هذه الجماعة التي تأسست منذ عام 1928 لا تستطيع سوى إقامة جمعيات خيرية لتنفيع وجذب الاتباع على غرار ما تفعله الجمعيات الخيرية التبشيرية النصرانية، مع اعتبار حقيقة أن الجمعيات المسيحية تعمل الخير لوجه الله تعالى، ولا تبحث عن سلطة أو نفوذ داخل المجتمع، كما هو حال جماعة الإخوان المسلمين في السودان وفلسطين ومصر ودول الخليج.<br />لقد أثبتت حركة حماس أن الفكر الديني المصطبغ بالأيديولوجية السياسية لا يمكن له أن يقوم بواجبات الدولة، ليس فقط كونه لا يملك الزاد التراثي في مجال علم الدولة، بل لكونه أيضا، أعجز من يوفر لقمة نظيفة<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073748/http://masr.20at.com:80/article.php?sid=1044"

[[comments]]
order = 2
subject = "وزيرة لا تعرف المجتمع المصرى"
author = "الظل المصرى"
posted = "2006-10-14"
text = "الوزيرة تضحك على من على الشعب ام على نفسها جماعة الاخوان موجودة داخل كل موسسة وكل شارع وكل مكان داخل فلن اضيع الوقت فى الرد عليها. اما الاستاذ أحمد البغدادي (كاتب كويتى) الظلهر انة يحمل بعض الطغان والاحقاد الشخصية اضافة انة لايقرا فى الحياة العربية الساسية الا ما يشبع اتجاة العالمانى ياسيد احمد اقر الحاحية الساسية من جميع الزاويا ثم احكم ولا تضع الاضغان الشخصية فى السياسة واقر المزيد حتى تضح لك الصورة اكتر من ذلك.شكرا للموقع على اتاحة الحور النقى"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073748/http://masr.20at.com:80/article.php?sid=1044"

[[comments]]
order = 3
subject = "الي الاخ الكويتي"
author = "ابو علي المصري"
posted = "2006-10-16"
text = "اتقى الله كيف تقول هذا الكلام علي جماعة مسلمه و تمدح الجماعات التبشيرية التي تحارب الاسلام وتقول انها جماعات خيريةتعمل لوجه الله اي الله تقصد المسيح الذي يدعوا اليه التبشيريين والعياذ بالله ادعوك الي التوبه من هذا الكلام قبل الموت شمت فينا الاعادي ياشيخ"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073748/http://masr.20at.com:80/article.php?sid=1044"

[[comments]]
order = 4
subject = "اعطوها الادوات حني نحكم عليها"
author = "ابو عبدالله"
posted = "2006-11-06"
text = "اتعجب ممن يحكم علي حركة حماس بالفشل في الحكم أبسط القواعد تقول اعطوا الحكومه ادواتها عشان بعد كده نشوف حتتصرف ازاي ونقول فشلت والا نجحت يا سادة حكومة حماس ممنوع عنها كل شئ باختصار هي محاصره مفيش موارد مفيش فلوس بالله عليكم لو مشروع فاشل وانت ماسك مديره ومنعوا عنك التمويل ومنعوا العمال ومنعوا الماكينات حتعمل ايه حتدير ازاي؟<br />اتقوا الله وانظروا الي الامور بموضوعية حتي لا تخدعوا العامه بكلامكم"
archived = "2006-11-12"
capture_url = "https://web.archive.org/web/20061112200320/http://masr.20at.com:80/article.php?sid=1044"

