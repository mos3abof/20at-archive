posted = "2006-10-13"
text = "والله انا مش عارف الست الوزيرة واخواتها الوزا بيضحكوا على مين لما يقولوا مين الاخوان ،الاخوان يا ستى موجودين فى كل حارة فى مصر ،واذا لم تعرفيهم حتى الان فاكيد ان نظرك ضعيف ودى مش مشكلتهم ،دى مشكلة التامين الصحى اللى عاملك نظارة بايظة ،ركزى شوية يا ستى الوزيرة ."
