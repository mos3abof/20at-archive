posted = "2009-02-02"
text = "زرت السيد البدوى كما كان يفعل اجدادى واجداد اجدادى<br />قلت لهم نزور ضريح رجل من المجاهدين وقف فى وجة الغزوة الصليبية فى المنصورة - فقد جند سيدى احمد البدوى الفتيان ومن هنا يسمى بابو الفتيان وعمل غارات على جيش لويس التاسع فى دمياط والمنصورة وحرر الاسرى من المسلمين ومن هنا عرف باسم جلاب الاسير<br />نحن نزور مشايخنا المجاهدين والاولياء ليس لقضاء الحاجات وانما لاعترافنا بجميلهم وتكريمهم<br />وكما يكرم الفرنسيون جان دارك - لماذا لا نكرم السيدة زينب ونحتفل بمولدها<br />اننا نتمسك بعادتنا وعلى السادة اتباع المذهب الوهابى ان يبتعدوا عنا<br />سنحتفل بكل الاولياء على اساس انة اامة مجاهدون وسباقون فى الاسلام"
archived = "2009-06-20"
