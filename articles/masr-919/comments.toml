[[comments]]
order = 16
subject = "هل فعلاً يمكن تقديم شكوى ؟!!"
author = "مصري مطحون"
posted = "2006-09-13"
text = "أحبتي في الوطن .. بعد ما رأيناه من إهدار لكرامة القضاء ولكرامة المواطن ولكرامة أي صوت حق في البلد .. هل تظنون أن الشكوى سيكون لها مكان أو أذن صاغية؟؟!!!<br />أشك في ذلك .. وأرجع الأمر كله لله وأسأله جلت قدرته أن لا يسلط علينا بذنوبنا من لا يخافه فينا ولا يرحمنا..<br />فلم يعد من هذه الحكومة الفاسدة من يخاف الله إلا من رحم .. وهم في انتظار خلعهم من مناصبهم حتى لا تكون هناك بقعة بيضاء في عباءة الدناسة والنجاسة.. وكل ذلك مرجعه إلى غضب الله علينا لانشغالنا بالدنيا عن تربية أولادنا على القيم ونشر المحبة بيننا وبين جيراننا وأهلنا فأصبحنا كالغنم الشاردة التي يسهل على الذئب تخطفها واحدة تلو أخرى.. أما لو كان هناك ترابط في المجتمع مسلمون ومسيحيون لما جروء أحد على الاستهانة بهذا الشعب ، ولما استطاع أحد أن يقول على شعب مصر (زمارة تلمه وعصاية تهشه).<br />وحسبي الله ونعم الوكيل على كل ظالم ومعتد على حرمة الإنسان الذي كرمه الله حتى وإن كان كافراً فالآية لم تخص المسلمين بالتكريم ولكن شملت جميع بني آدم.<br />قال تعالى :(ولقد كرمنا بني آدم وحملناهم في البر والبحر).. الآية.<br />وآسف على الإطالة."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

