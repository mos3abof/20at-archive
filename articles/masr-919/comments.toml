text = "مين قال ان احنا مش امجد كلنا بنقلع كلنا بنتضرب و بنبوس ازاي نكون مش أمجد الادهي ان امجد ده واصل و ابوه رجل اعمال و حصل فيه كده امال يحصل فينا ايه و احنا الغلابة؟؟؟؟ الظابط اللي عمل كده ده معندوش ذره انسانية عشان يعمل كده في بني أدم زيه كل الفرق بينهم ان الاول معلق شوية نجوم علي قفاه و التاني لأ. انا اعتقدان الظابط ده مريض نفسيا و لا ممكن يكون حد من الكبار اتحرش بيه(ان بعض الظن اثم) قبل كده فقرر يطلعوا علي الشعب بلي ازرق.<br />هتاف كنا بنردده في مظاهرة دعم المقاومة \"يا نصر الله اطلب تلاقي في القاهرة مليون فدائي\" اسمحولي بتعديله \"يا مبارك اطلب تلاقي في القاهرة مليون أمجد\" :("
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

