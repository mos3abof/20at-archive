text = "ا المفروض النقيب دة يعدموة لان اللى عملة انتهاك لحرمة الرجل وغير كدة الضباطهواللى عمل الواقعة دى نقيب الشرطة (محمد المرزوقى)انا راى فية انة عيل غير محترم وغير كدة كمان فاكر نفسة انة نقيب ياما هنا ياما هناك هو لسة مجرد نقيب لسة ماوصلش للرتبة الحرجة زى مابيقولو غير محترمين والضباط هما اسفل ناس فى الجمهورية والضابط دلوقتى رخيص ملوش سعر بس بعض الضبات محترمين وعلشان كدة مابيكملوش لرتبة(لواء)الوسخ بس اللى بيوصل اللى بياخد رشاوى وينفذ اوامر البيك الكبير معالى وزير الداخلية ووزير الداخلية طلع منة كلام وقال (انا كنت راجل محترم واللة انا عايز اسيب الوزارة بس هما يسيبونى)مين المقصود بهما دول دول اكيد عصابة كبيرة ماسكة البلدبس هانعمل اية ياامجد"
