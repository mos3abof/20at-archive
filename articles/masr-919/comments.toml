[[comments]]
order = 10
subject = "قصة حقيقة"
author = "مصرى متغرب"
posted = "2006-09-13"
text = "اولا اعزى امجد فى وفاة الانسانية وحقوق الامسان فى مصر .وانضم الى زملائى الذين سألو سؤال خطير جدا ماذا لو ان امجد شخص عادى ليس له من الاقارب المهمين والمعارف ؟ ولعل ابرز رد فى الكليب الذى عرضة الموقع من قبل لضابط شرطة بيتسلى مع اصحابة بضرب واحد غلبان وماسمعناش عنهم اى حاجة لا الضابط ولا المواطن لانة غلبان<br />انا حصلت لى قصة اسمحولى احكيها انا كنت معدى فى ميكروباص على كمين وجة امين شرطة معاة اعدادية ولا حتى ماخدهاش وقال بطاقتك ياد انت وهو لاتنين قاعدين فى الكرسى الى قدامى مانعرفهوش الراجل طلع بطاقتة على طول اما التانى عمل نفسة مش واخد بالة قالة بطاقتك يالا ام قالة بطاقة مين يابن الوسخة انت مش عارف انت بتكلم مين روح نادى الضابط ال.... الى قاعد فى الكمين يابن .... قوله النقيب فلان مخابرات حربية امين الشرطة اترعب وانا اسف ياباشا واصل وفصل قام الراجل نزل من السيارة وقام واخدة حتت شلوت محترم وجة الضابط وقبل مايتكلم كان الراجل قعد يزعق ويشتم وكل شوية يقول دة انا ممكن اسحب الكمين عندى فى مكتبى بتليفون وساعتها امهاتكم مش هاتعرفكم والضابط يهدى فية وهو ابدا هاتو لى الكارنية بتاع الامين دة وماتحركش الا لما اخدة وبعد العربية مامشيت فى وسط الطريق رماة وبعدين واحدة ست كبيرة قالت له والنبى يابنى لولا انت كنا اتبهدلنا قالها انا مش ضابط ولا حاجة انا كنت ضابط احتياط وسلمت الكارنية من ست شهور ومن ساعتها وانا كل ما اقع فى كمين اقول انا ضابط<br />القصة دى حصلت قدامى"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

[[comments]]
order = 11
subject = "معاك يا براء و لكن ......"
author = "نيفين نيفى نوفا"
posted = "2006-09-13"
text = "بص يا براء انا اتكلمت ف الموضوع دا كتير وحكيته لكل عشرينات حتى من قبل ما تتكلمو عنه لانى سمعته بصوت امجد ف القاهره اليوم<br />و علقت كتير لما كتبتو لدلاجه انى زهقت<br />و كل رجائى انك تستمر ف حمله انا مش هتضرب يمكن نحس بشويه تفاؤل<br />و بمناسبه التفاؤل عندى سؤال<br />يا ترى لسه بتحلم بمصر اللى بتتولد من جديد ف ساعه ضلمه ما يعلم بيها الا ربنا"
archived = "2006-11-04"
