[[comments]]
order = 3
subject = "حتى لا يختلط علينا الامر"
author = "هادى"
posted = "2006-09-13"
text = "كنت كتبت تعليق قبل هذا وحكيت انى صادفت مشكله بسب انى سلمت على واحد صاحبى ملتزم اسلاميا ولكن احقاقا للحق ان معامله ضابط امن الدوله لى كانت فى غايه الاحترام ولم يخلل الاسئله اى شيء يسىء لى<br />ولم يتعامل معى ولا حتى بالصوت العالى<br />ولكن بعد عوتى الى عملى بالكويت<br />قادنى الفضول للاتصال بصديقى الذى كان السبب فى هذا الموقف ولانه اصبح زبون عند امن الدوله سألته عن هذالضابط فأخبرنى نقلوه من امن الدوله لانه محترم وابن ناس طيبين وسألته هل كل الضباط يتعاملون معك مثل هذا الضابط .......فبكيت و من اجل صديقى واذرفت الدمع السخين على حبيبتى مصر وبالتأكيد الجميع يعرف لماذا بكيت"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

[[comments]]
order = 4
subject = "اه والف اه يابلد"
author = "ابو عمار"
posted = "2006-09-13"
text = "ايام الكلية كنت بتمشى باليل مع زملائي بالمدينة وجيه سعادة البية الضابط ولمنا كلنل على البوكس ما عدة صديق لي ( مش عارف لية ترتيبات ربنا ) واخدونا اداب معاكسة انثى بالطريق العام على فكرة كانت الساعة 1 باليل وكنا في الشتا يعني مفيش جنس انثى بالطريق ولا حتى قطة المهم شاء القدر ان صاحبي يقاول اخويا ويعرفة ويجيلنا على مديرية الامن على فكرة اخويا وكيل نيابة قصرة طلعت وحاولت اطلع زملائي بس على ما جبت اهاليهم كانو حولوهم بمحاضر وحبس وعرض على النيابة وبعد كدة محكمة جابتلهم شهر حبس والحمد لله استأنفنا ومتحبسوش تخيلوا كل دة لية<br />قالها البية الضابط لاخويا ...........<br />ياباشا معلش منقصدش اخوك انت عارف بقة اليومين دول تقفيل محاضر ورفع تقارير والحاجات دي واحنا مطلوب مننا عدد محاضر وانت مش محتاج اشرحلك ؟؟؟؟؟؟؟؟<br />اه يابلد"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

[[comments]]
order = 5
subject = "المنتخب المصري"
author = "ضابط شرطة برفقته مجموعة من افراد الشرطة يعتدون علي لاعب المنتخب المصري عماد متعب بالسب والقذف والضرب فحاول ومجموعة من المواطنين فض المشاجرة ففوجيء بضابط الشرطة يخرج سلاحه الميري من ملابسه مهددا كل من حاول الاقتراب من اللاعب عماد متعب وتخليصه من بين يديه."
posted = "2006-09-13"
text = "أكد الجميع ان ضابط الشرطة طلب من عماد رخصتي السيارة والقيادة وعندما اخذها منه قال له: »اركن بجانب الطريق« وعندما سأله عماد هل هناك مشكلة قام ضابط الشرطة معتز بالله حسن بسب لاعب الاهلي بألفاظ قذرة فرد عليه عماد متعب السباب فحدثت مشادة كلامية تحولت إلي تشابك بالايدي، تجمع علي اثرها كل المارة علي الطريق، وعندما تدخل الناس لفض النزاع اشهر ضابط الشرطة سلاحه الميري في وجه الجميع واصاب به احد امناء الشرطة وبعد فترة حضر الفنان محمد عطية الذي حاول تخليص عماد متعب من قبضة ضابط الشرطة وادخله داخل سيارته الخاصة إلا ان الضابط لم يرتدع وقام بتحطيم زجاج السيارة الجانبي وحاول اخراج رأس عماد متعب من خلاله إلا ان عماد خرج بعدما شعر بالخوف الشديد مما يحدث وقام الضابط بالاعتداء عليه بالضرب وطرحه أرضا وتجمع عليه افراد الشرطة وقاموا بتلقينه علقة ساخنة بالأحزمة الميري وسحله علي الارض.<br />وبعد فترة جاءت سيارة نجدة وانقذت عماد متعب من بين أيدي الضابط واعوانه وتوجهوا إلي قسم الخليفة وتم تحرير محضر بالواقعة وحاول ضباط الشرطة داخل القسم تهدئة عماد متعب الذي اشتكي من آلام بظهره من اثر العلقة الساخنة، واكد ضباط الشرطة ان ما حدث يمكن ان يحدث لاي شخص وان ضابط الشرطة لم يقصد عماد متعب بشخصه"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

[[comments]]
order = 6
subject = "كفااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااية"
author = "معاذ محمود عامر"
posted = "2006-09-13"
text = "يسقط مبارك ورجاله وابنه وكلابه الملاعين<br />يسقط الظلم والظلمة<br />يسقط كل الأنذال والكلاب والخنازير من اول الخنزير الكبير محمد حسني مبارك الى الى أصغر خنزير في رجاله وأجهزته المستبدة<br />يا مبارك<br />لعنك الله<br />لعنك الله<br />لعنك الله<br />لعنك الله<br />لعنك الله<br />لعنك الله<br />يارب لاتسامحهم ولاتجلعهم يردون على جنة<br />الخنازير<br />الأنجاس أبناء الأنجاس<br />الفاجرين<br />العاهرين<br />الظالمين<br />يا كلاب يا ابناء الكلاب يا مبارك ياحقير يا أحقر من وحيد القرن<br />يا مستبد يا ظالم يا قاتل يا سارق الوطن حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل"
