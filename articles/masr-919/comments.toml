[[comments]]
order = 23
subject = "هل يتذكر احد؟"
author = "مدحت"
posted = "2006-09-14"
text = "ياترى اللى حصل للاخ امجد هو اسوأ ما تعرض له مصرى او مصرية داخل بلده؟ قطعا لا. من ضمن ما ذكرتنى به هذه الجريمة جريمة أخرى أدت بمن أرتكبت فى حقه الى أن يلقى بنفسه من فوق أحد الكبارى وينهى حياته. مؤكد كثير منكم يتذكر قصة خريج كلية التجارة بتفوق الذى تقدم لامتحان ملحق تجارى بالخارجية ونجح فى كل اختبارات القبول ولكن فى المقابلة الاخيرة قيل له انه لايمكن قبوله بسبب وضعه الاجتماعى. الاحباط وصل به لان ينتحر. يبدو انه لم يعد هناك فارق بين الداخلية والخارجية. مؤكد هناك أشخاص على خلق فى كل مهنة ولكن الشواهد تؤكد على انهم قلة ضئيلة."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

[[comments]]
order = 24
subject = "آخر نكتة في مصر"
author = "معاذ...مقهور...عامر"
posted = "2006-09-15"
text = "العادلي يستقبل وفداً من منظمة العفو الدولية<br />استقبل حبيب العادلي وزير الداخلية، بمكتبه ظهر أمس، سكرتير عام منظمة العفو الدولية إيرين خان والوفد المرافق لها. واستعرض العادلي ــ خلال اللقاء ــ السياسات والخطوات المتتابعة لأجهزة وزارة الداخلية وقطاعاتها للالتزام بمبادئ وقواعد حقوق الإنسان، سواء ما يتعلق بتطورات السياسة العقابية بالسجون، أو دعم دور الأجهزة الرقابية بالوزارة، أو نشر ثقافة تلك المبادئ بين رجال الشرطة. وعرض التطورات الإيجابية بصدد الحوار والتعاون مع المجلس القومي لحقوق الإنسان والعديد من المنظمات الأهلية.. وكذا من خلال لجنة قومية تشارك فيها الوزارات الأخري المعنية.<br />وتناول الوزير خلال اللقاء، أبعاد ظاهرة الإرهاب ومخاطرها المتصاعدة عالمياً وتهديدها المباشر لحقوق الإنسان، وأشار إلي الدراسات والمناقشات الحكومية والسياسية الجارية للتقدم للسلطة التشريعية بمشروع قانون لمكافحة الإرهاب، لملء الفراغ التشريعي في مواجهة ظاهرة الإرهاب، مع الإنهاء المرتقب لحالة الطوارئ والصلاحيات الجزئية القانونية التي تتوسل بها حالياً أجهزة الأمن في مواجهة مخاطر وتهديدات الإرهاب.<br />من:المصري اليوم"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

