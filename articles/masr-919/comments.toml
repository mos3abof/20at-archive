[[comments]]
order = 0
subject = "رد فعلي"
author = "شيماء"
posted = "2006-09-12"
text = "السلام عليكم<br />عجبني رد فعل امجد بعد الي حصل يعني انة مسكتش و اتكلم في وسائل الاعلام و انه حيرفع قضية و الكلام دة كلة و دة صح لان الساكت عن الحق شيطان اخرص و الي بيسكت عن الظلم حتي لو مظلمش بيشارك بحجر في بناء بيت الظلم.<br />لكن الي معجبنيش هو ليه من الاول نفذ كلامهم ليه شتم نفسة, ليه هان اهلة بالشتيمة, ليه قلع هدومة ليه.. ليه؟؟<br />يا جماعة الي بيفهم معني القضاء و القدر كويس حيعرف ان الي مكتوبلنا حنشوفة حنشوفة بس الفرق في ازاي حنشوفة يعني اسباب القدر و الحكمة بتقول تعددت الاسباب و الموت واحد لو احنا مؤمنين بده كويس عمرنا محنرضي بالظلم و لا الاهانة لان الرضا بالظلم و الاهانة مش حيرد قدر القدر انكتب و خلاص .<br />اديكم مثال بسيط ممكن انا اخاف اطلع مظاهرة ليحصلي حاجة فيها لكن انا لو مقدر لي يحصلي الحاجة دي حتحصل حتي لو مطلعتش المظاهرة , شباب يخطفوني في شارع و يحصلي كدة , حادثة تعمل فيا كدة, و لو تفتكروا فيلم احنا بتوع الاتوبيس شوفو عادل امام و عبد المنعم مدبولي رغم انهم مكانش ليهم في السياسة لكن اتقبض عليهم ظلم و اتعذبوا و اتهانوا ظلم لان دة قدررغم ان عبد المنعم مدبولي كان بيخاف يفتح بقة في السياسة.<br />خلاصة الكلام متطاطيش راسك لحد انت كدة و لا كدة مش حتشوف اكتر من المكتوب و لا اقل.<br />اوعي تسيب ظابط يضربك و لو قالك اقلع متقلعش و لو قالك اشتم اهلك اشتمه هو و صدقوني الي زي دول جبناء لما يلاقوك بتقاوم و عارف حقوقك و واجباتك من نفسة حيلم الموضوع خوفا علي نفسه.<br />يالله كلنا نقول<br />لا للظلم<br />لا للجبن<br />لا للخوف<br />لا للسكوت عن الحق<br />و الف لا نضمن بيها حياه محترمة فيها كرامة لاولادنا و احفادنا ان مكانتش لينا."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

