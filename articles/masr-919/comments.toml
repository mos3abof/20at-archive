subject = "العين بالعين"
author = "احمد"
posted = "2006-09-13"
text = "اخي العزيز اكرم ارجو منك تطبيق الشريعة علي هذا الفاجر جزاءة الوحيد ان يهتك عرضة في ميدان عام و يضرب بالجزمة عدد مرات ضربك اخي العزيز ارجوك لا تحزن ولا تبتئس كلنا معك كلنا امجدكلنا شيرين وليكن هذا الفاجر عبرة ولكن لي سؤال بسيط ما ذنب كفر الشيخ التي نقل لها هذا الفاجر المعقد؟؟؟؟؟؟؟"
archived = "2006-11-04"
