capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

[[comments]]
order = 7
subject = "ماذا لو ؟؟"
author = "مصراوي قديم"
posted = "2006-09-13"
text = "السلام عليكم...<br />ردا على الاخت شيماء التى تتساءل لماذا وافق امجد على فعل كل ما يطلب منه و لماذا لم يعترض, احب ان اوضح شيئ بسيط , ضعى نفسك مكان امجد, شاب محترم من عائلة محترمة, قرأ و سمع عما يحدث فى مثل هذه المواقف,معه عروس المستقبل و مخه مشغول بالاف الترتيبات و الانشغالات,و يفهم تماما ما يمكن ان يحدث لزوجته, و انا اعتقد ان هذا كفيل جدا بجعل اى انسان محترم يحافظ على عرضه و شرفه ان يتحاشى من ليس عندهم لا عرض و لا شرف.<br />و لكن جاء على بالى امر اخر, عند قراءتى للموضوع من بدايته فى مجلة روز اليوسف,رأيت ان امجد اتصل بعد ذلك بوالده و محاميه عضو مجلس الشعب و رفع بيان للسيد وزير الداخلية و النائب العام,و زوجة امجد اتصلت بوالدها الذى خلص امجد من كل هذا بعدة مكالمات, اذا ماذا لو, و اكررها ماذا لو حدث ما حدث لمواطن عادى بسيط من ابناء مصر, وما اكثرهم,فبالتأكيد لن يكون له اب ذو شأن او محام عضوالبرليمان,او وسطاء ينقذوه,تخيلوا ماذا سيحدث لهذا المواطن و زوجته.<br />اذا لابد من حل, و اعذرونى فلا احد يقول لى قانون او عقاب رسمى او محاكمة عسمرية, ارجو من اولاد البلد ان يتابعوا حملة لن اضرب بعداليوم, التي بدأوها,ماذا وصلت اليه و ماذا يتم عمله و ما الذى يجب علينا ان نقوم به,فيا اخوتى يجب ان يتم كل هذا بسرعه لأن اي واحد منا معرض لمثل ما حدث لأمجد."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

[[comments]]
order = 8
subject = "اقتله يا امجد"
author = "فارس"
posted = "2006-09-13"
text = "والله يا جماعة انا قريت الموضوع اكتر من مرة ويمكن بالتفصيل عن كده وكانت كل احداثه بتمر على وكان انا فى حلم او كابوس مزعج , بس يا امجد فعلا انت لازم تاخد حقك ومش حقك القانونى وبس , فمادام احنا بقينا عايشين فى غابه والقوي فيها واللى فى ايديه السلطة يقدر يضرب عباد الله بالجزمة ويقلعهم هدومهم معناه خلاص انت تاخد حقك من الضابط ده , والله العظيم زى ما انا بقولك كده , دا انت تشوف التحقيق هيوصل معاه لحد فين وايه نتيجته وبعدين تنتهز الفرصه وتقتله والله لو قتلته يا امجد مفيش كلب بعد كده هيقدر يفتح بقه منهم وهيعملوا حسابهم ويفكروا الف مرة قبل ما يعملوا حاجه زى كده مع اى حد تانى ,, اقتله اقتله اقتله ,<br />تخيلوا ان الموضوع ده حصل مع شخص عادى ومش ابوه رجل اعمال ولا حاجه ايه اللى كان هيحصل ولا اى حاجه .... حسبي الله ونعم الوكيل فى البلد واللى بيحصل فيها والله المستعان ."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

