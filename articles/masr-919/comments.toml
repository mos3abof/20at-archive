subject = "لغايه امتى"
author = "انا زهلت وانا بقرأ الكلام ده"
posted = "2006-09-12"
text = "طول عمرى اسمع عن تدنى المستوى الاخلاقى للضباط<br />انما ان تصل قذاره اخلاقهم وتدنى نفسياتهم الى تلك الامور بالشعه<br />فدامعناه اننا بنحول شاب طبيعى الى انسان مسعور تحت لواء الشرطه<br />العيب فى جهاز باكمله<br />وبعدين الى تكلم ده واحد جت لهالشجاعه ان يسرد اقصوصته وفجعبت مئات وربما الاف حكايات اخرى يكتمونها فى الصدور<br />فالى متى نخاف من الشكوى او ان نرفع صوت البكاء"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104061657/http://masr.20at.com:80/article.php?sid=919"

