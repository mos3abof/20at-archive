text = "الموضوع فكرته ظريفة بس الحقيقة يا عشرينات متأكدة ان موضوعاتكو مضروبة و كتبتوها ف المكتب و مفكرتوش اصلا تنزلوا تسألوا الناس (لأن مفيش حد عمره هيرد عليكي يقولك فاكراني جربانة و لا ايه )ساذجة اوي الحكاية دي …<br />عارفين لو انتو مبتضربوش المواضيع …هتنشروا صور الناس اللي بتسألوهم ..أو تصوروهم فيديو ولو مقاطع صغيرة وتنشروها و منها تكون بتعملوا فيديو و تبقو موقع 100 100 ..شبابي صحيح ..مش مضروب"
