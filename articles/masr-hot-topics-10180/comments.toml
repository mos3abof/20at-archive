text = "اة طبعا لازم نستحمى حماية مغمسة لاننا متزوجين<br />انما العزاب الغلابة بيستحموا كدة حاف<br />ما هو احنا بنستحمى كل يوم يا ست مروة لانة ضرورة شرعية بعد عملية ال ——<br />وطبعا ليلة العيد بتبقى ليلة عمرانة بالشغل الجاد والكفاح المضنى يعقبة استحمام الطهارة وصلاة العيد<br />كل عيد وانتم طيبين<br />وما حدش يتقل ليلة العيد وخدوا بالكم ممكن الكهرباء تقطع وتبقى المية ساقعة زى الرصاص وتسلخ جلدكم"
