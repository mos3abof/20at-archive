text = "الست مارى انطوانيت بتاع الثورة الفرنسية كانت بتفتخر انها لم تستحم طوال حياتها الا مرة واحدة<br />واغرب استحماية حكاها لى الوالد ايام ما كان فى الحرب تحت قيادة الشاذلى فى 73 انهم كانوا بيستحموا بكباية مياة واحدة - يغمسوا المنديل فى الكباية ويمسحوا بة جسمهم بعد ما يبلوها بالصابون<br />اما اجدع استحمام فكان بمناسبة الزواج<br />واخر استحمام هيبقى غسل الميت بعد عمر طويل ويلبس الكفن اللى من غير جيوب"
