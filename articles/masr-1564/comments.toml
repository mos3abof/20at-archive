[[comments]]
order = 1
subject = "هو روج الى فى شفايفة ده ولا ايه !!!!!"
author = "فارس_fr"
posted = "2007-02-08"
text = "بالذمة ده شكل رئيس يمسك حكم بلد زى مصر , مش معقولة واحد حاطط روج فى شفايفة - وانا سامع ان الناس بتقول عليه حاجات مش حلوه فى حقة - مش معقولة يمسك حكم مصر ,, مصر اغلى بكتير يااخوانا اغلى من ان واحد شاذ زى ده يحكمنا بالله عليكم خدووا بالكم كويس ان الاحداث اللى بتم اليومين دول - من سفاح المعادى وخلافة - دى كلها احداث لاشغال الراى العام واشغال الشعب عن عملية التوريث وعملية طبخ الدستور لصالح هذا الشاذ ,,,<br />بالنسبة لموضوع الضرب اللى حصل دى حاجه متعودين عليها , ابوه الله يرحمه باعتبار ما سيكون , لم بيعمل اى مؤتمر او يتنقل لاى داهية تاخده , بيتبهدل عشانه ناس كتير عشان سيادته يتنقل من مكان لمكان تانى يقفل شوارع ويعطل مصالح الناس , وكله فدا الشعب .<br />مستكترين سبعة ثمانية ينضربوا عشان خاطر الننوس الصغير , يمكن كان ليهم انتماءات معادية للننوس ولا يمكن احنا فى بلد ديموقراطى وكانو هيحدفوه بالطماطم والبيض .<br />يالله حسبي الله ونعم الوكيل , طالما الشعب جبان ومستحمل الاهانات المستمرة والانتهاكات الدائمة لحقوقه , لابسط حقوقه , ومستسلم لارادة البلطجية من الشرطة ومن الجيش يبقي متستكتروش ان مجموعة طلبة تتهان وتنضرب عشان جيمى مبارك . والله انا قلت ومازلت اقول واردد ان حلها فى \" تسونامى \" بس تسونامى من نوع تانى تسونامى نخوة وعزة وكرامة فكرينها الكرامة اللى نسيتوها على ايد مبارك وكلابه لو رجعت لينا كرامتنا وكل واحد فينا حط نفسه او ابنه او اخته او بنته مكان الطلبة دول واللى حصلهم شوفوا ممكن نعمل ايه !!!!<br />مازال عندى امل فى الـ\"تسونامى \" ."
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210045728/http://masr.20at.com:80/article.php?sid=1564"

