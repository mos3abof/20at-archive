subject = "نجيب سرور"
author = "الأوله آه"
posted = "2007-02-11"
text = "والتانيه اُفْ<br />والثالثه أحّوه<br />منين اجيب ناس لمعناة الكلام يتلوه<br />النص جاهز ومكتوب لك ومتفصَّل<br />يا عم سيبك بقى قللى كلام ينفع<br />..الشرف نفعنى واسـتنفع<br />ووَطّى أنيكك وصلى ع اللى فيك يشفع<br />وقلنا ننضف بقى قالوا بلا وكسـه<br />واللـه لتحصل بدال النكسه ميت نكسه<br />بلد المنايك بلدنا الكل ناك فيها<br />شوف الخريطه تلاقيها فاتحه رجليها<br />ربك خلقها كدا راح تعمل ايه فيها<br />جايز يكون مرخى جايز حضرته ..<br />ومالو .. بس المهم يبان بتاع نسوان<br />واللحس ليه انتشر ؟! عشـان مافيش إزبار<br />هاتناك ضرورى ولازم كلنا....<br />عشان ما يفضلش فيكى يا مصر ولا راجل<br />لو كتفونى وناكونى أبقى مش متناك<br />عيّان وبينيك فى ميت يبقى مات راجل<br />نجيب سرور"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225329/http://masr.20at.com:80/article.php?sid=1564"

