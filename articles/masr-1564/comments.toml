author = "تقرير عن الفساد في \"مصر المحروسة\""
posted = "2007-02-18"
text = "(نتحدى أى مسؤل أن يستطيع انكار أى من الحقائق المذكورة هنا)<br />1- فساد نجلى رئيس الجمهورية<br />يشارك كل من علاء و جمال مبارك على سبيل الرشوة و البلطجة بحصص مجانية تبلغ 50 بالمائة فى رأس مال كبرى الشركات التجارية و الصناعية بمصر و كان من نتيجة فرض هذة النسبة المرتفعة جدا على هذة الشركات دون دفع مليما واحدا أن هذة الشركات أصبح يتهددها خطر الافلاس و الانهيار وقد تم طرد نسبة كبيرة من العاملين بها مما أسهم فى زيادة نسبة البطالة و ارتفاع معدلات الكساد. و مما زاد الطين بلة أن جمال و علاء يفلسان و يطفشان من السوق من لا يدفع لهما و يستمر يعمل فى السوق \"بكل بجاحة\" و كمان ينافس الشركات التى تعطى لهما حصة مجانية برأس المال مما أدى الى خروج الألاف من المستثمرين و رجال الأعمال الشرفاء الجادين من السوق و نتج عن ذلك توقف الإنتاج فى معظم الوحدات الإقتصادية بالبلاد و طرد العاملين بها مما أوصلنا الى الحالة الراهنة من البطالة الشاملة و هى نموذج لحالة إقتصادية إجتماعية سيئة لم يعرف العالم مثيلا لها منذ أزمة الكساد العالمى فى نهاية العشرينات من القرن الماضى. و بالرغم أن جمال و علاء شركاء ببلاش يعنى مش دافعين حاجة الا أنهما بسبب جشعهما لا يرحمان شركاءهما و لا يقدران ظروف الكساد التى تعصف بكل من فى السوق و يرفضان سماع أعذار و حجج فلا بديل عن دفع نصيبهما البالغ 50% و مش مشكلتهما إذا كان شركاءهما خسرانين و لا كسبانين. و من الشركات التى يشارك فيها جمال و علاء بنسبة 50% بالمجان هى: مارلبورو و مترو و هيرميس و ماكدونلدز (منصور)، سكودا (شفيق جبر) ، حديد العز (أحمد عز) ، دريم لاند( أحمد بهجت) ، اية أر تى (صالح كامل) ، فرست (كامل والخولى) ، موفينبيك ( حسين سالم) ، التجارى (ال<br />اقرأ بقية التعليق .."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219170049/http://masr.20at.com:80/article.php?sid=1564"

