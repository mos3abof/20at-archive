subject = "لا لا لا"
author = "لا لموظف البنك الحرامى جمال مبارك"
posted = "2007-02-19"
text = "نعم لعمرو موسى رئيساً وأبا لكل المصريين مصر محتاجة كفاءة عمرو موسى وإيمان الدكتور سعيد العريان وخبرة وصبر السيد مهدى عاكف<br />اللهم كما بليت مصر بمبارك أخرجهم من مصر اللهم آمين"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219170049/http://masr.20at.com:80/article.php?sid=1564"

[[comments]]
order = 47
subject = "هية فين"
author = "إيه إنجازات جمال مبارك إللى تخليه عايز يحكم مصر وما هى خبراته السابقة بعيد عن لجنة السياسات إللى كل الشعب عارف أتعين فيها أزاى ومين واسطته"
posted = "2007-02-19"
text = "أى واحد رايح يقدم شغل لازم يكون معاه شهادة خبرة وخصوصاً ده حكم مصر مش أى وظيفة<br />أعتقد أن أى حد ها يحكم مصر ها يكون أكفء من جمال مبارك ولا داعى أن يقحم نفسه فى ما ليس له فيه ولو باصص يعنى أن أشمعنى بشار ولا غير بشار بقى رئيس كل دولة وليها ظروفها لكن مصر مليانة كفاءات وبعد الحالة اللى وصلت ليها مصر على أيد حسنى مبارك فلابد أن يكون إللى يحكم مصر واحد من أبنائها ضباط الجيش علشان يقدر يعيد لمصر مكانتها بين الدول ثانى وطبعاً الشعب كله أتقرص من حسنى مبارك يعنى أى حاكم الشعب هو إللى ها يشرف عليه وكفاية بقى التكية إللى حسنى مبارك كان عايش فيها على حساب نهب البلد وخرابها<br />يارب أحفظ مصر من كل أذى ومن مبارك وعائلته اللهم آمين"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219170049/http://masr.20at.com:80/article.php?sid=1564"
