text = "انتم مش هيهدالكم بال الا لما تودونوا في ستين دهيه جتكم داهيه تخدكم وتعليقاتكم.<br />يعيش حسني مبارك يعش جمال حسني مبارك ويعيش ابن جمال حسني مبارك وربنا يخلي الحكومه ورئيس الجمهوريه . ما كفياكم فقر يا ناس وخليكم في اكل عشكم ."
