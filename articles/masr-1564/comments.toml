[[comments]]
order = 9
subject = "مفيش فايده"
author = "نيفين نيفى نوفا"
posted = "2007-02-09"
text = "على طريقخ هانى رمزى ف وجهه نظر بقول مفيش فايده<br />برده الشباب مصر ينتقدجمال بمنظور شخصى<br />اللى يقوللى مره كلام عن خطيبته و اللى يشتم بطرق جارحه اخلاقيا و اللى بيقوللى حاطط روج ف الصوره<br />يا جماعه عايزين نرتقى فكريا و ننظر للصوره مش للاطار<br />ارجوكو انتقدو الاداء السياسى يا ريت نتعلم نتكلم فى لب الموضوع و منبصش للهوامش<br />و لا استثنى نفسى من النصيحه<br />مع الشكر"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210045728/http://masr.20at.com:80/article.php?sid=1564"

[[comments]]
order = 10
subject = "حلال عليهم حرام على غيرهم"
author = "جمال مبارك يتعامل بالكذب والتمثيل على الشعب ويختلق المواقف لكى يظهر له زى العفريت فى كل علبه وما دخله هو وشباب الجامعات وهل باقى الأحزاب يحصلون على حقوق زيارة الجامعات أو لهم مبنى جيل المستقبل بالجامعات مثله"
posted = "2007-02-10"
text = "لما باقى المعارضة كلهم يأخذوا نفس الميزات إللى هو بيأخذها يبقى من حقه يزور الجامعات ويبقى ليه مبنى فى كل جامعة متكف الملايين من الجنيهات والطلبة مش لاقيين يأكلوا ولا يدفعوا المصاريف ولا ثمن الكتب<br />جمال مبارك يعلم جيداً رفض الشعب بشبابه وشيوخه له وما يفعله هو فرض نفسه مستعيناً بالبلطجية يعنى بنظام أنا جى الحكم بالصورة دى وطبعاً هو فى الأول والآخر مرفوض مش لأى شيء سوى لأن:<br />مصر وصلت للقاع فى عهد حسنى مبارك من النهب والفساد والدكتاتورية والطغيان وطبعاً ده متربى على أيد الدكتاتور الأعظم فرعون مصر يعنى بالعربى هايبقى فرعون الصغير وكل المؤشرات بتقول كده وطبعاً إللى كان بيحصل للناخبين من ضرب وإهانة كان بتوصيات خاصه منه وفى كل الأحوال مبارك وعائلته فاشلين فى إقناع الشعب بمصداقيتهم وطبعاً لما وقف المحروس يتكلم فى المؤتمر الرابع للحزب الوطنى ويكذب فى أرقام التنمية وفاكر إن حد مصدقة كان أكبر دليل<br />مصر مليانة كفاءات جاهزة وصاحبة خبرات سياسية عميقة مثل الدكتور سعيد العريان والسيد عمرو موسى وهناك فارق كبير بين واحد مسنود بأبوه وجه من موظف بنك زرع قيادة وطبعاً دى إهانة للحزب الوطنى وللشعب بمجلسه وتخطى الكل وبقى رئيس لجنة سياسات وطبعاً واخد موافقة على كل إللى بيعمله وإللى لسه ها يعمله من الراس الكبيرة يعنى بالعربى طايح مش معنى كده إنه يتجرأ ويبقى رئيس جمهورية<br />أكبر دليل على إنه دكتاتور وطاغية زى أبوه هو الإسلوب إللى بيفرض نفسه بيه على الشعب رغم رفض الشعب له ورغم معرفته جيداً<br />اقرأ بقية التعليق .."
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210045728/http://masr.20at.com:80/article.php?sid=1564"

[[comments]]
order = 11
subject = "المساواة عدل"
author = "لماذا لا يسمح للملك احمد فؤاد الولى الشرعى لمصر بالنشاط السياسى ؟"
posted = "2007-02-10"
text = "لماذا لايسمح لخالد جمال عبد الناصر بالنشاط السياسى ؟<br />لماذا لا يسمح لجمال السادات وابوة ولى نعمة حسنى مبارك بالنشاط السياسى ؟<br />والا العملية فرض شخص بعينة ؟<br />نحن شعب ليس مجموعة من الاغبياء<br />الحاكم القادم سيكون لواء من الجيش<br />واحد من اولاد الارض<br />اتشعبط فى المواصلات واولادة عاطلين عن العمل<br />لم يبيع ممتلكات الشعب لليهود والشركات الوهمية واخرها بيع مصنع لشركة هندية<br />حتى الهنود يامصر جايين ينهبوا عيالك<br />لا لا والف لا للملوثين بتدمير مصر"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210045728/http://masr.20at.com:80/article.php?sid=1564"

[[comments]]
order = 12
subject = "هو احق"
author = "لو كان الحكم بالتوريث يبقى الأولى بالوراثة هو الملك أحمد فؤاد الذى يعتبر هو الملك الحالى لمصر طبقاً لدستور 23 وطبعاً كلنا موافقين عليه طالما مش من عيلة مبارك"
posted = "2007-02-10"
text = "والله لو حكمنى بواب العمارة هوافق عليه لكن مش هوافق على المخنس جمال مبارك المكروه من كل الشعب وهذه أول علامات كراهية الله له"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210045728/http://masr.20at.com:80/article.php?sid=1564"

