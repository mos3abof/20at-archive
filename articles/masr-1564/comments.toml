subject = "الجيش فى ازبكسان"
author = "شوارزكوف"
posted = "2007-02-09"
text = "الاخوة الذين يخمنون من سيحكم ؟<br />الذى سيحكم هو لواء من الجيش شاء النظام ام ابى فالبلد داخل على فوضى نتيجة الجوع وستعم الاضطرابات والقلاقل وستنتشر الحرائق فى كل مكان<br />وكل ذلك يتم بغباء النظام الحالى الذى جمد البلد وادخلها فى فى عدم وجود تنمية وباع مدخرات الاجيال السابقة ابتداءا من المصانع والبنوك<br />واصبحت البلاد والعباد على قارعة الطريق تتسول طعامها<br />وقريبا سينزل الجيش الى الشوارع لايقاف التظاهرات ومنع اعمال الفوضى"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210045728/http://masr.20at.com:80/article.php?sid=1564"

[[comments]]
order = 6
subject = "لماذا لن يحكم جمال مصر"
author = "يقول البعض بأن جمال مبارك تنقصة الخبرة و الأخر يقول بأن مجرد تصعيدة و تلميعة لترشيحة لمنصب الرئيس فيةاخلال سافر بمبدأ تكافؤ الفرص. و هناك أسباب أخرى و هى:"
posted = "2007-02-09"
text = "1- بداية، الحالة الصحية لجمال مبارك لا تسمح لة بتولى مهام رئيس الجمهورية لانة مصاب و فى مرحلة متأخرة بسرطان الدم و يضطر مثل والدتة التى أورثتة هذا المرض للسفر الى الخارج للعلاج عدة مرات كل شهر بعد أن استنفذ عدد المرات المسوح بها لتغيير دمة.<br />2- سناريوهات نقل السلطة أو بمعنى أصح توريثها الى جمال مبارك كلها غير شرعية و تتنافى و القانون و العرف. فاذا قام حسنى مبارك باصدار قرارا جمهوريا بتعيين نجلة نائبا لرئيس الجمهورية فان هذا القرار سيولد باطلا اذ انة لا يجوز لرئيس الدولة تعيين ابنة فى أى منصبا تنفيذيا ناهيك عن منصب نائب الرئيس. و ترشيح جمال مبارك بمعرفة مجلس الشعب للاستفتاء علية هو اجراء غير مشروع ليس فقط لان مجلس الشعب جاء بانتخابات مزورة و هى حقيقة أكدتها أحكام قضائية و لأن كل الانتخابات و الاستفتاءات التى جرت فى العقدين الماضيين باطلة بل منعدمة طبقا لحكم المحكمة الدستورية العليا لعدم اشراف القضاء على كافة مراحلة مما يجعل وجود مبارك ذاتة فى الحكم باطلا مما يبطل بل يعدم أى قرار اتخذة أو سيتخذة بصفتة رئيسا للجمهورية و لكن أيضا لان كل من مجلس الشعب و جمال مبارك و حسنى مبارك و كل مؤسسات الدولة تعلم مقدما بأن ترشيح مجلس الشعب لجمال مبارك أو أى شخص أخر باطل لأن المجلس ذاتة باطل كما أسلفنا و بأن نتيجة الاستفتاء على جمال مبارك معروفة سلفا و بأنة سيجرى تزويرها أسوة بكل الاستفتاءات و الانتخابات التى سبقتها و بأن القضاء لن يشرف على كل مراحلها ككل الاستفتاءات و الانتخابات السابقة.<br />3- جمال مبارك يحمل جنسية أجنبية (الجنسية البر<br />اقرأ بقية التعليق .."
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210045728/http://masr.20at.com:80/article.php?sid=1564"

