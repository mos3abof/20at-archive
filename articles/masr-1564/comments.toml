subject = "الى فارس"
author = "نيفين نيفى نوفا"
posted = "2007-02-13"
text = "يا فارس صدقنى انا عارفه اننا كشباب زهقنا من الكلام و انا و الله ساعات و انت عارف بكتب لا تعليق .جمال مش معصوم من الخطا و هو بشر بس ليه حياه التاس الشخصيه و ليه الشكل الخارجى<br />عايزين النقد يبقى على مستوى الموضوع و خصوصا انك من التعليقات اللى بحب اتابغهاف اى موضوع و بتعجبنى اراءك الساخره جدا و عجبنى تفكيرك لما اتفقت معايا قبل كدا لما قلت ان مستبعد جمال يتولى الحكم و علشان كدا بنتظر من تعليقك اللى اكتر من مجرد انتقاد ملامح او قسمات شخص حتى لو كان جمال مبارك.و على فكره دى مناسبه كويسه انى اقوللك انك من فتره تعليقاتك مش قويه<br />عايزين تعليقات فارس بتاع زمان<br />اول ما دخلت الموقع .و اكيد حصل خير"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225329/http://masr.20at.com:80/article.php?sid=1564"

[[comments]]
order = 28
subject = "مبادرة تائيد السيد جمال مبارك لعبور المستقبل"
author = "نحن معك فى عبور المستقبل"
posted = "2007-02-15"
text = "نحن الموقعين ادناة الذين يستشعرون مدى الجهد المبذول والايمان الراسخ لدى السيد جمال مبارك فى التغلب على الصعاب والمشاكل التى تواجها مصرنا الحبيبة والشعب المصرى بكل طوائفة واطيافة.نعلن التاييد الكامل والقاطع للسيد جمال مبارك, وايماننا بما يسعى الية من ترسيخ مبادىء الحرية والديمقراطية والاصلاح وتكافوء الفرص بين ابناء البلد الواحد, وعدم قناعتنا بما يحاولة المشككين والمغرضين من تعطيل مسيرتة فى عبورة بنا الى المستقبل كما اننا نؤكد لة ان كل المصريين يدركون مدى المصداقية والشفافية والاخلاص الذى يتمتع بها السيدجمال مبارك, على الرغم من الحملات المنظمة التى يقوم بها المفسدين مستغلين المناخ الديمقراطى التى تنعم بة مصرنا الحبية فى عهد الرئيس محمد حسنى مبارك ونحن اذ نعاهد السيدجمال مبارك على اننا لن نسمح لهؤلاء القلة ببث تلك الافكار الهدامة وسنتصدى لتلك الحملات المنظمة ولن نتجاهلها, ولن نسمح لها بان تشكل عبئا ومساسا بمستقيل البلاد وامنها القومى وبناءا علية فقد عقدنا العزم على اتخاذ مجموعة من الاجراءات الفعلية كالاتى:<br />اولا: دعم المزيد من التوافق الوطنى والاجماع الشعبى تجاة مشروع جمال مبارك للعبور الى المستقبل ثانيا<br />توضيح ما اتخذة السيد جمال مبارك من سياسات ودعم المشاركة الشعبية فى دفعها الى حيز التنفيذ<br />ثالثا: مواجهة الافكار الهدامة والشائعات المغرضة فى كافة وسائل الاعلام والصحافة مثل مواجهة دعاوى التوريث ,بدعاوى التاسيس للمستقبل<br />الموقعين ادناة1-احمد قرة<br />مدير مركز المصداقية للشفافية"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225329/http://masr.20at.com:80/article.php?sid=1564"

[[comments]]
order = 29
subject = "لا لجمال مبارك"
author = "لا لجمال مبارك الكذاب زى أبوه فاكرين لما كان بيقول إنه لا يسعى لحكم مصر نفس كذب أبوه ونفس دكتاتوريته ونفس طغيانه"
posted = "2007-02-15"
text = "جمعية إيه وإصلاح إيه وهما سبب الفساد اللى فى مصر هو حد حكم مصر غيرهم<br />يا جمال إتقى الله فى نفسك المريض بالسرطان إللى زيك سنواته بقت معدوده ياريت تخاف من ربنا شوية وتعرف إن كل إللى سرقته من مصر مش ها ينفع فين المليارات ومنين جيبتها ياترى من مصروفك ولا من نهبك وسرقتك كام مشروع عندك وجبتهم منين<br />مصر للمصريين ليست لعائلة مبارك ولو مصر ها ترجع ملكية يبقى الملك أحمد فؤاد هو إللى يحكم مصر طبقاً لدستور 23 إللى الشعب كله أقره وأهى قصور أبوه موجوده والشعب كله ها يوافق عليه بس جمال مبارك لا لا لا<br />يا شاذ يا مدمن أتكسف على نفسك يا حرامى المصريين كلهم مش عايزينك والجمعية إياها إللى أمك عملهالك دى محدش ها يرشحك منها وكفاية عليكم بقى سرقة فى مصر سيبو الشعب يبعيش ربنا ينتقم منكم يارب ويورينا فيكم يوم أسود"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225329/http://masr.20at.com:80/article.php?sid=1564"

