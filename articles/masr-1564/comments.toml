[[comments]]
order = 42
subject = "لو كان ناسى فكروه"
author = "جمال مبارك بهذا التكالب للوصول إلى الحكم يؤكد أنه يريد أن ينهب باقى مصر لإنه يعلم جيداً علم اليقين أن الشعب كله رافضه وبيكرهه ولا يمكن ها يتقبل واحد زى ده ماضى عليته وماضية كله ملطخ بالدم وبالنهب والسرقة والفساد يبقى ياريت ينسحب من حياة المصريين وكفاية علينا إللى شوفناه من أبوه ومصر عايزه واحد يخاف ربنا علشان يقدر يصلح فساد 26 سنة حكم فاسد من واحد معندوش ضمير ولا دين ولا أخلاق"
posted = "2007-02-19"
text = "لا للتوريث نهائياً نعم للتغيير من قيادات مؤقته لحين إجراء إنتخابات جديدة"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219170049/http://masr.20at.com:80/article.php?sid=1564"

