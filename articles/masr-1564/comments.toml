[[comments]]
order = 45
subject = "لجان الإنتخابات هى الفيصل"
author = "الشعب هو صاحب الحق فى إختيار رئيسه وهو الذى سيشعر بالعار حكمه مدمن وشاذ"
posted = "2007-02-19"
text = "الشعب يريد إصلاح فساد مبارك وعائلته الحرامية فلن يقبل أى إمتداد لهذا الحكم الفاشى القذر<br />الشعب هو الذى ذاق كل ألوان الفساد على يد اللامبارك الواطى وهو الوحيد صاحب الحق فى رفض الفساد فلو لم يكن مبارك حرامى فأين خير مصر وأين شباب مصر الله يحرق قلبة يارب على عياله زى مهو حارق قلب الشعب على ولادهم إللى فى المعتقلات<br />لو مصر ها يتورث الحكم فيها يبقى الوريث الشرعى للحكم هو الملك أحمد فؤاد طبقاً لدستور الشعب كله أقره وهو دستور 23<br />كفاية على مبارك سرقة كفاية عليه نهب ربنا يحرقه فى نار جهنم اللهم آمين هو وعيلته يارب ورينا فيهم يوم يشفى غليل الشعب من فساد مبارك وعائلته اللهم آمين<br />أكثر من السرطان ربنا ها يبليك بإيه يا جمال يا شاذ هى مصر ناقصة فوق البلاوى إللى أبوك عمله فيها إن يحكمها شاذ لوطى روح يا بنى طهر نفسك بالتوبة ربنا يخدك اللهم آمين<br />عمر مديد لمبارك أكثر من 83 سنة هو لسه ما شبعش ولا هى مصر لسه فيها حاجة عمالين يتخانقوا عليها فى العيلة الحرامية دول"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219170049/http://masr.20at.com:80/article.php?sid=1564"

[[comments]]
