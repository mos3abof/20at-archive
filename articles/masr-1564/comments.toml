[[comments]]
order = 3
subject = "مبارك: مصر ليست سورية"
author = "مبارك: مصر ليست سورية"
posted = "2007-02-08"
text = "قال الرئيس المصري حسنى مبارك إن ليس لديه أي خطط للسماح لأبنه الصغير جمال أن يخلفه في تولى الرئاسة<br />وقال مبارك في لقاء مع مجلة نيوزويك الأمريكية إن مصر ليست سورية، مشيرا إلى الرئيس السوري بشار الأسد الذي خلف والده<br />وقد نسب إليه قوله إنه يبحث عن نائب لرئيس الجمهورية ولكنه أضاف أن ذلك أمرا صعبا، غير أنه بصدد دراسة عدة أسماء<br />هذا وينص الدستور المصري على أن يتولى نائب الرئيس منصب الرئاسة لفترة انتقالية في حالة وفاة رئيس الجمهورية<br />غير أن هناك تكنهات واسعة الانتشار في القاهرة أن جمال مبارك يعد لتولى السلطة"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210045728/http://masr.20at.com:80/article.php?sid=1564"

