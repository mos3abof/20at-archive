text = "لا للفساد لا للمدمن لا للشاذ نعم للإخوان المسلمين<br />هما ليه خايفين من الاخوان المسلمين إللى كلهم كفاءات ومفيش واحد منهم حرامى ولا نهب البلد زيهم بالعكس دول بيدفعوا من جيوبهم علشان يعملوا مشاريع لخدمة الناس والشباب<br />لكن دايماً إللى على رأسه بطحة بيحسس عليها وهما علشان حرامية خايفين من إللى يكشف سرقتهم ونهبهم وفسادهم لكن الله قادر على فضحهم فى الدنيا ويوم العرض عليه الله آمين يارب"
