[[comments]]
order = 14
subject = "الى الاخ استفسار"
author = "بذمة ابوك دا كلام حد يصدقه"
posted = "2007-02-10"
text = "ان جمال مبارك عنده سرطان في الدم<br />طيب انت روح شوف كده اللي عنده سرطان في الدم في مصر عامل ازاي.<br />دا كلام شوية ناس عواطلية<br />وقبل كده قالوا عليه لواط<br />تتصور<br />انا عايز اعرف حاجه فيما ايه يعني لما جمال مبارك يحكم مصر<br />طيب ما هو الملك حسين ابوه حكم الاردن<br />وبشار الاسد بيحكم سوريا بعد ابوه<br />وملك المغرب بيحكم المغرب بعد ابوه<br />ايه اللي جرا بس<br />واحنا في مصر طول عمرنا الابن بيحكم مكان ابوه طول عمر مصر عايشه على كده"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225329/http://masr.20at.com:80/article.php?sid=1564"

[[comments]]
order = 15
subject = "لـ نيفين نيفي نوفا"
author = "فارس_fr"
posted = "2007-02-10"
text = "والله يا نيفين احنا مغلطناش فى البخاري ,الناس تعبت من كتر الكلام , سواء فى الشكل او المضمون , سواء خارج الصورة او بره الصورة ,,, وبعدين انا استفسرت عن الروج اللى حطه الننوس الصغير فى شفايفة ليس الا ,,وده للسخرية منه من شخصه ,ولان الواحد زهق من كتر الكلام عن عدم كفائته لحكم مصر . زهقنا من الكاى بورد يانيفين , ولا هو ده بقه دور الشباب دلوقتى يكتب ويتكلم وبس , انا سخرت منه وسخرت من الشعب الجبان اللى كل واحد فيه بيقول وانا مالى , اظن لحال اللى مصر وصلت اليه لا بفرح عدو ولا حبيب !!!"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225329/http://masr.20at.com:80/article.php?sid=1564"

