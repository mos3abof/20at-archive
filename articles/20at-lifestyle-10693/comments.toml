text = "اسعد عبد الله الله يعطيه العافية لانه على الاقلا يهتم ويسجا الاسر الفقيرة كم يقول<br />ولكن فعلا زملائة غير مهتمين ويفكرو بزحمه ها اليومين وكيف يبدي زبون على الاخر من اصدقائة ويسكر هاتف الجوال طبعا مشان الزحمة مانو اخونا فاضي مشان يرد على جواله ولكن لايعرف انه ليس سوى جزار لحام حقه نص فرنك بساعة الغلاوشغله بس ها اليومين وبعديت يقعد وينتظر زبائن ولايجد احد يمر ولو حتى يلقي التحية علية<br />ويبقى حبيبي القلب فاضي وينتظر من ينادي له كي يذبح له شاة وبدون اجر بس يعطي الجلد مشان يسد الملل من قعدته بالمحل<br />ويتذكر الايام الخوالي طبعا زحمة عيد الاضحى وتقفيل الجوال وعدم الرد لانه مشغولا منو فاضي وكيف هذا الزبون يترجة مشان يذبح لاه وذاك يعطيه اجرتين بدل من اجرة ودفتر الزبائن مليين ويشطب فيه…الخ؟؟<br />ولحتى يجي الاضحى بيكون اخونا تخ من القعدة ولايجد سوى زبون زبونين بالمحل يومين"
