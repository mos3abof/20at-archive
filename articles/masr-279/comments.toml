subject = "حلوة يا إيهاب"
author = "منسي زيّهم"
posted = "2006-05-08"
text = "يا جماعة الموضوع باين م العنوان .. تهييييس !!!<br />بس انا متهيأ لي ان القصة دي لها بقية يا عم إيهاب ... ياريت تقعد كده مع نفسك وتحاول (تقدح زناد فكرك) وتجيب لنا التكملة لأني عجبتني جدا تعليقاتك الجانبية اللي بالعامية ... وما تنساش تملاها اسقاطات سياسية وتحبيشات والذي منه ... مش ح اوصيك .. أه ؟؟"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023102/http://masr.20at.com:80/article.php?sid=279&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

