[[comments]]
order = 1
subject = "يا استاذ فادى"
author = "sara"
posted = "2006-05-06"
text = "يا استاذ فادى انا طبعا بحترم رايك بس انا شايفة انى القصة حلوة وحسيت انها بتتكلم علينا واننا احنا اهل قرية الساعدة لانهم بيتهربوا من مشاكلهم عن طريق البانجو والحشيش والمخدرات دة راى فى القصة وانا شايفاها حلوة بعدين حضرتك لو إنسان متحضرالمفروض تعبر عن رأيك بأسلوب متحضر شوية يعنى مثلا كنت تقول انى هى مش عجباك واى حد هيحترم رأيك لكن مش القصة مقرفة"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023102/http://masr.20at.com:80/article.php?sid=279&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

