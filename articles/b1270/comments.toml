order = 1
subject = "رمضان كريم وكل عام وانتم بخير"
text = "بسم اللة الرحمن الرحيم السلام عليكم ورحمة اللة وبركاتة . اشكرك اخ علي موضوعك الشيق والمعبر عن الحال العربي من حيث االانحطاط والي اين وصلت من حيث ان اكثر الناس ماعديهمش انة رمضان ام غير رمضان حيث يمارسون الحب كما قلت في كلامك وحتي بالمشاعر فهو حرام لان رمضان شهر مقدس ويجب احترامة لانة شهر الفضيلة والغفران يغفر لك اللة عما سلف من اخطاء مش يزيدو الاخطاء حتي في رمضان وهذا هو التغريب الاسلامي يحاولون اليهود ووووووووووالنصاري بشتي الوسائل ولاطرق ابعادنا عن ديننا الحنيف والقيم وبالتدريج الممل حتي نتركة كامل ولك جزيل الشكر والعرفان ومع ال السلامة .<br />عبدالوهاب احمد هزاع المحمدي .<br />جامعة صنعاء كلية الزراعة.<br />almuhammadi@ymani.com"
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025200733/http://www.20at.com:80/article.php?sid=689"

