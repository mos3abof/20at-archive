subject = "الى الاخ الفاضل وائل عباس"
text = "أما عن تعليقك علي الحب و وصفه بانه كلام فارغ فهذا ليس بحق و هو موجود في اصل ديتتا الحتيف بشرط عدم تعدي حدود الله و قد تكلم عليه الكثير من العلماء الكبارفي كتبهم و راجع كتاب ( طوق الحمامه - بن حزم الاندلسي ) و كتاب ( روضة المحبين - بن القيم ) و كتاب ( تحفة العروس - محمود مهدي اسطنبولي)<br />أخوكم سامى عفصه<br />*** تم حذف الكلمات الموضوع مكانها هذه العلامة لخروجها عن سياق مناقشة الموضوع"
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025200733/http://www.20at.com:80/article.php?sid=689"

