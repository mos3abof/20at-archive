text = "بجد يا براء في الجون موضوعك وبجد الشباب تعبان<br />وربنا يسترها علي ولايانا<br />*** تم حذف الكلمات الموضوع مكانها هذه العلامة لخروجها عن سياق مناقشة الموضوع"
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025200733/http://www.20at.com:80/article.php?sid=689"

[[comments]]
