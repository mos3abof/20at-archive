subject = "مذكرات جامعي"
author = "فارس"
posted = "2006-09-25"
text = "السلام عليكم ورحمة الله وبركاته .. ورمضان كريم علينا جميعا .. انا مع الاخ نادر انور والاخ معاذ .. رب رمضان هو رب شوال هو رب كل الشهور ... بس ياريت منضيعش الشهر ده فى الحب والكلام الفارغ .. واسمعوا نصيحة واحد ... ضيع اربع سنين من عمره فى الجامعة وضيع معاها اربع شهور رمضان فى الحب والكلام الفارغ والعلاقات الغير جائزه .. الله يهديكم جميعا ..<br />شكرا لك يا براء انك فتحت موضوع زى ده ...<br />حسبي الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 24
subject = "عنوان سيئ جدا براء"
author = "وفاء&وليد"
posted = "2006-09-25"
text = "براء انف رمضان ارقي من ان نتطاول علينا انه شهر رمضان العظيم الذي انزل فيه القران وبعدين كل ماكتبته ليس فيه شئ رغم (انف رمضان )الكريم مع اعتذاري الي الله عن هذا اللفظ المستفز فالفتايات والشباب يزيدون التزام وابتعاد عن الشهوات ولو قليل ولكن في النهايه كل فرد يشعر بقدسية الشهر الكريم علي قدر التزامه وليست الشهور كلها مثل رمضان الكريم الذي تصفد فيه الشياطين ودون رمضان قد يطغي الشيطان علي الأنسان في لحظات من الضعف ولكن ربي غفور رحيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 25
subject = "من غير عنوان"
author = "zabot el afreat"
posted = "2006-09-25"
text = "أولا أسم الموضوع جامد جدا ويعبر فعلا عن مضمونه انا رأي إن رب رمان رب باقى الشهور مفيش حاجه أسمها مانكلمش بعض علشان إحنا فى رمضان فحرام وأنا صايم والحركات دى لأ الصح معروف والخطأ معروف بصرف النظر عن الشهر اللى إحنا فيه يعنى فى العلاقات دى طبعا غالبا بتحصل حاجات مش صح عموماولو هنتكلم عن الصح الصح ده حتى النظره حرام ولا يمكن فى رمضان بيكلموا بعض وهما حطين وشهم فى الأرض."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 26
subject = "الساخر المتكبر"
author = "زين العابدين احمد"
posted = "2006-10-02"
text = "السلام عتيكم ورحمة الله وبركاته الموضوع مش بطال لاكن طبيعة المتكبر المغرور البراء نقد دون فهم حتى اصبح انه لايرى الا ما يراه هو فقط الحب كلمة جميلة يحرص عليه الكبير قبل الصغير وحب الجامعة اذا بعد عن الاحترام وحفظ اليد والكلام المثير ودخل من الباب فاهلا به وما الفرق بين الخاطب والحبيب الاول يخرج ويتسحر ويكمل اليوم مع التليفون حتى الفجر والثانى قد يفطر ولايستطيع السحورمع حبيبته ان رمضان شهر القران فما يفعله المحبين الجامعين فى رمضان نقول لهم جزاكم الله خيرا وشدوا حلكوا وجعتوا حبكم في النور وربنا يسامحكمان شاء الله وياايها الساخر المغرور الا بيته من زجاج"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 27
subject = "ان تحبط اعمالكم وانتم لا تشعرون"
author = "بجد دي نصيحة على جنب....انا قرأت كتير من المواضيع الهايفة في الموقع دا."
posted = "2006-10-02"
text = "بس اللي بخاف منه فعلا وبيدفعني اني احذر وننور اللمض ونرفع حالة الاستعداد للبرتقالي.....ان يظن الكاتب والمؤلف انه ارتقى سلم البيان ويحاول ان يرضي قرائه باي عنوان مثير.<br />(رغم انف رمضان)..... شهر الله...الذي انزل الله فيه(شهر رمضان الذي انزل فيه القرآن)......الذي قال انه لي.<br />ينفع تقول (رغم انف النبي ).....عارف انه في معرض نفي......بس قد يحبط عملك.<br />فخللي بالك الله يكرمك عشان متوديش نفسك في داهية اكتر مانتا رايح.<br />ورغما عن انف ابيك ....سوف ا<br />عارف انها جرحتك.<br />فخللي بال سيادتك وانت بتتكلم عن حاجة متخصكش لوحدك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 28
subject = "يعرفوا الهايف منين"
author = "ازهري"
posted = "2006-10-13"
text = "يبدو ان الاستاذ نسي لب الموضوع وبدا يتخذ طريق صلاح سالم ولكن باعتباري ازهري احب اقول ان لولا قلة المال ما اظطر زميلنا العزيز من ملاحظه تلك الملاحظه الشديدة وكتابة موضوعه<br />وذلك اننا نعاني من كساد في الزواج علي مستوي الشباب ولا اعترض علي التعارف الذي يتم بين البنات والاولاد وذلك ان اخذ اطارا شرعيا ولا اقصد يذلك الزواج طيعا ولكن اقصد علاقة الزمالة التي تتحول في اغلب الاحيان الي حب صادق غير مشوش باي شئ يخجل منه اي حب بغرض الزواج ولا اجد مشكلة لتحدث في رمضان لان رب رمضان هو رب باقي شهور السنة ولا ينظر الله الي العباد في رمضان ثم يقلي عنهم يعد ذلك حاش لله فيجب علينا اتباع الاداب التي يقبلها كل منا علي من هو عرضة من اخوات مثل حبيبتة وهو<br />عدم الملامسة الغير مبررة<br />عدم الخوض في احاديث يمكن ان تثير الغرائز<br />احملي من تحبينه علي طاعة الله<br />احمل من تحب علي طاعة الله وافهمها حقوقها وما لها وما عليها<br />والله المستعان وندهو ربنا<br />ان لا نحتاج الي ذلك في المستقبل وان يزوجنا ربنا بالصالحات الغير مفرطات<br />وكما قال جل شانه<br />الطيبون للطيبات والخبيثون للخبيثات .... الاية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

