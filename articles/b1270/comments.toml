subject = "زهور"
text = "دائما أخ البراء تتحفنا بمواضيع رائعة ومهمة(وحساسة)<br />(الله يفتح عليك )<br />احد صديقاتي أخبرتني أن شهر رمضان يدرب على الصبر بعد اتفاقها مع حبيبها ألا تحادثه طوال الشهر الكريم وقالت يمكن تراجع نفسها وتقول لحد ماتتم الخطوبة رسمي<br />يا رب اعن الجميع على طاعتك والبعد عن معصيتك في كل الشهور"
