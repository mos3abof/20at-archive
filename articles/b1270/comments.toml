text = "يا سلاااااااااااام يا معلم بيرو<br />بصراحة \"جيت على الجرح\"...<br />أخ سامي عصفة أهنئك على رأيك و أنا أوافقه تماما..<br />و يللا نغني سوا:<br />\"حملت الحب في القلب<br />زرعت الحب في الدرب<br />تعالوا فتشوا عمري<br />فلن تلقوا سوى الحب\""
