[[comments]]
order = 0
subject = "الحب لا يعرف رمضان"
text = "الحب لا يعرف رمضان و لا شعبان و الحب الحقيقي الذي يتنفس الطهارة و يترعرع بالعفه لا يفرق بين الشهور و الايام ولا الليل و النهار الحب الذي خاف من اللمسه و يهرب من القبلة الذي ترتجف اليدان فيه لمجرد السلام و تنغلق الجفون عند النظرة و تدمع العينين عند التلاق و الفراق - هل هو موجود الأن في قاموس الشباب - أم أنه في مخيلتي و ذكراي أنا فقط؟سامي عفصه"
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025200733/http://www.20at.com:80/article.php?sid=689"

