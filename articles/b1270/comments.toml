[[comments]]
order = 30
subject = "انظر حولك يا برنس"
author = "على الطاير"
posted = "2006-10-13"
text = "مش عارف الاخوة برغم احترامى الشديد للثقافات الدينية او الاحساس الدينى و توابعه من حمية و احساس انه لازم نفهم الناس اشياء هيا اساسا عارفاها و فاهماها و زى مابيقولوا عندنا فى المثل المصرى _يعرفوا القرد مخبى ابنه فين_بس اكيد الدنيا كلها شباب و بنات و حتى مع ملاحظة ظهور جنس تالت و رابع كمان بس الواضح و الظاهر ان الصفة السائدة فى مجتمعاتنا الاسلامية و لن اقول العربية نظرا لان لبنان دولة عربية و طبعا كلنا عارفيين ايه اللى بييجى من الشام و بنشوف عالفضائيات حاجات كدة جامدة و شديدة بس اللى واضح انه فيه حالة من انعدام شىء بالى اسمه القيم الدينية فى نظر الناس دى وماتفتكروش يا اخونا و لا تصدقوا الاسطوانات الفاشلة بتاعة انا هانتظم و اصوم و اصلى و مش هالبس بادى و لا جينز و لا شغل العروض اللحميةدى<br />كل ده بيتغير و بيعود لطبيعته بمجرد بعد الفطار و اساسا هى مجرد اعراض رمضانية مؤقتة بحسب التشخيص الطبى للحالة بس بتختلف مدتها من حالة لحالة بس النتيجة محتومة الا و هى عودة المياه لمجاريها<br />على فكرة انا انسان بسيط جدا و باشتغل عالنيل فى السياحة يعنى و كدة و باكلمكم من واقع شغلى اللى انا باشوفه كل يوم بنفس مستوى الرتابة الممللة بتاعة موظفين الحكومة<br />تلاقيهم كدة ياخويا شباب و بنات و خواجات حتى!!!!! تخيلوا و قاعدين ايه ؟!!!! شيشة و مزاج و بلوتوث و مقابلات و كلام من كدة<br />اللى يخلينى باعممها و بانظرلها بالشكل ده هو العدد و باحسبها علميا فبلاقى ان الغالبية العظمى زيى مابقولكم<br />الصح بيقول اتعامل مع الوضع كما هو عليه مش كما ينبغى ان يكون عليه<br />يعنى من الاخر و على بلاطة باردة كدة و ساقعة<br />فككم من المثاليات و كل واحد حسابه عند ربه و هما عارفيين كدة<br />زمن الدعوة انتهى يا برنسات و دلوقتى اهو بقى زمن ستات على خواجات !!!!!!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 31
subject = "دعونا نفرق بين الحب والشهوة"
author = "أهداف"
posted = "2006-10-14"
text = "لقد جمعت يا سيدي ما بين الحب وما بين اللهو في مسألة الحب<br />الحب ليس هوجا ولا طيشا .. وليس محرما سواء في رمضان أو ما عدا ذلك لأن لا حكم لنا عليه فهو شعور ناجم عن حاجة الإسا للشعور بالعاطفة .. وأعظم حب قطعا هو حبنا لله عز وجل ثم لرسوله صلى الله عليه وسلم وكذلك أنبياؤه جميعا .. ومما يستوجب التوضيح أن المسألة التي طرحتها تفي بغرض الترويج لفكرة أن الحب هو اللهو ..<br />لا لا<br />من يقول أنه يحب ليلهو فقد أخطأ ..<br />هذا ليس حبا .. هذه شهوة وصياعة<br />.. الشاب الذي يلقى خمسين شابة بالنهار ويتغزل في هذه ويلمس تلك وفي النهاية يقول أنه لم يقم بأي علاقة مع فتاة وإن كان في ذلك صادقا من حيث المفهوم الأشمل فقد فعل ذلك بمفهوم غير مرئي للعين المجردة .. وبذلك هو لا يعرف الحب لأنه لو أدركه لأحب في الله .. لأحب من منطلق حبه لله الحياة وما فيها كما الخلق<br />لذلك.. أعجبتني الجملة الأخيرة وقول الأخ فيها .. اللي عاوز يحب .. يحب ربنا ..<br />وهذا هو الحق .. أن نبدأ بحب الله وإدراك الفكرة في هذا الحب، ومن ثم الحكم إذا ما كان الشعور مدرجا تحت مصطلح حب أم مدرج تحت مصطلح شهوة<br />حياكم الله<br />السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 32
subject = "نتكلم بجد و بصراحة شوية؟"
author = "على الطاير"
posted = "2006-10-15"
text = "لهووحب؟<br />تفتكر يا سيدى الفاضل ان دلوقتى لو سيادتك يعنى بتشوف ناس او بشر ايا كان مستواهم المادى او الاجتماعى تقدر و بمنتهى الموضوعية تقولى مين دلوقتى مش بينظر للحب على انه وسيلة لهدف ماايا كان سواء هدفه مادة او شهوة ؟ يعنى مين بيتجوز الا لما يكون له هدف فى زواجه؟<br />مش الواحد بيتجوز عشان هدف معين هو فى احتياج ليه؟<br />يعنى جوازه هو نظرا لاحتياج شهوانى ايا كان نوعه(مال_سلطة_وضع اجتماعى_جنس ....الخ)<br />والشهوة محركها هو احتياج للشعور بمتعة الارضاء<br />اصبح ان الحب رياضيا او عقلانيا او منطقيا زيى ماسيادتك بتقول وجهان لعملة واحدة !!!!!!<br />اما بالنسبة لحب ربنا سبحانه و تعالى ...........مش المفروض اننا نحب الله عشان ندخل الجنة؟!!!!<br />يعنى حتى حب الله هدفه اتقاء النار و العذاب صح؟!!!!!<br />يعنى بمعنى اخر حب لازالة الشعور الانسانى بانه سوف يتعرض للعذاب و الالم النفسى كل مايفتكر انه عاصى!!<br />يعنى تقدر تقول مع انه حقيقة بس فى نفس الوقت وسيلة ذاتية يختلقها الاقتناع بان حدوث العذاب هو امر حتمى<br />وهنا وصلنا لنقطة اسمها عظيم الا و هو (الايمان بالخالق) سبحانه و تعالى<br />ولما نقيس اللى فات على اللى موجود دلوقتى حوالينا نجد و بكل صراحة و بدون محاولة تزييف حقيقة امر قائم بزعم الحرمانية اننا و للاسف ......معدومى الايمان الفعلى بوجود الرب ونعتبره مجرد فكرة لدينا ليس لها الاسانيد المادية اللتى يحتاجها العقل ليتاكد ويلمس حقيقة وجود الله .............<br />اسف للاطالة وارجو الا يعتبر الاخ كلامى على انه اساءة للخالق عز وجل !!!!!!!!<br />ولكن اصحوا يا برنسااااااااااات ......<br />صدقونى دى بقت دنيا ستات على.... خواجات!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

