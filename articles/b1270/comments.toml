text = "عنوان الموضوع غير موفق تماما<br />برجاء تغييرة فورا<br />لا احد رغم انف رمضان<br />وولا حب رغم انف رمضان<br />برجاء الانتباة قليلا ( كثيرا ) لما نقول<br />فان الرجل ليتكلم بالكلمة لا يلقى لها بالا يلقى فى النار سبعين خريفا"
