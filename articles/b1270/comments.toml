[[comments]]
order = 6
subject = "مكسوفة"
text = "تقريبا أنا قريت الموضوع مرتين بس مفهمتوش أوي يعني لسا ،<br />هو يعني قصد الكاتب إن الحب غلط وبالذات في رمضان مفروض الواحد يبعد عن الغلط ، ولا إن اللي كان عنده علاقة يقطعها ولو حتى من بعيد من غير فطار مع بعض وشارع الحب والحجات دي<br />على أي حال ربنا يستر علينا في رمضان وغير رمضان<br />وشكرا - شهقة- يا براء"
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025200733/http://www.20at.com:80/article.php?sid=689"

[[comments]]
order = 7
subject = "حب إيه"
text = "لست أدري كيف يضيع الشباب والفتيات اوقاتهم في أمور فارغة كاللذي يسمونه الحب !!<br />أنا طوال دراستي الجامعية لم أسمح لنفسي الدخول في قصة حب مع أي فتاة فأنا شاب مثقف ومن عائلة محترمة وبدلا من أن أشغل نفسي في الحب والكلام الفارغ تجدني منشغل بهم الأمة ومحاولة تنقيتها مما علق بها من علماء السوء والدجل ودعاة الكليب كعمرو خالد.<br />وأسعى دائما من خلال مجموعتي على الياهو اللتي يحاول دائما الإخوان المتأسلمون تدميرها إلى كشف نوايا هذه الجماعة بالوصول إلى الحكم.<br />كماأنني مشهور جدا على الانترنت من خلال مقالاتي الواسعة الانتشار ويمكنكم مراجعة كتاباتي على مواقع كثيرةمنها شباب مصر وعربتايمز وبحزاني وملتقى الحوار العربي ودنيا الوطن .<br />كما أنني أقوم بجهود جبارة في الدعوة الى الله حيث لي حوارات مطولة دائما مع غربيين من أجل إقناعهم بالاسلام.<br />وائل عباس"
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025200733/http://www.20at.com:80/article.php?sid=689"

[[comments]]
order = 8
