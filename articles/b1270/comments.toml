[[comments]]
order = 15
subject = "محن ..رغم انف المحترمين"
author = "نادر أنور"
posted = "2006-09-24"
text = "السلام عليكم<br />اولا احب اقول لكل رواد الموقع العزيز رمضان كريم , واحب اقول لرمضان والله بعودة يا رمضان.<br />طبعا كالعادة نجد موقعنا العزيز عشرينات ثرى بالمواضيع الجديدة والافكار التى تجتهد لتقدم لنا كل ما هو شيق ومفيد<br />لا اذكر اننى علقت على احد مواضيع البراء اشرف من قبل_بالواقع نادرا ما يلفت نظرى اسم الكاتب_وهذا التعليق موجه له شخصيا<br />فالموضوع مبذول فيه جهد _كالعادة_حتى وان لم تكن فكرته جديدة الا انه اثراها بطريقة عرضة الشيقة,<br />فقط يا عزيزى البراء استخدامك المتكرر لكلمة الحب _سواء فى استطرادك واسم الموضوع او نقلا على لسان الطلاب_ اقل ما يقال انها استفزتنى<br />فانا اعتقد ان التفتح وتقديم القيم بشكل عصرى لا يتدنى ابدا لمسايرة اطلاق كلمة الحب _العبيطة_على كل مخادنة ومحن (مع الاعتذار للفظين) بين اتنين سايحيين على بعضهم وسايحين على اللى حواليهم ومظروتين الدنيا حواليهم بفضلات الاساءة للحياء والاداب والاحترام<br />ارجوا وضع الالفاظ فى موضعها الذى يدل عليها<br />وارجوا ان تتقبل ملحوظتى بصد رحب عزيزى البراء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 16
subject = "بص يا سيدى"
author = "بسلة مصرية مسلمة"
posted = "2006-09-24"
text = "انا مبكلمش اصحابى الولاد فى رمضان ممكن رسايل كل فين وفييييييييييييييين علشان بسنطمن على بعض اولا لانة رمضان ثانيا علشان وقت رمضان ضيق مابين كلية وصلاة وقران وشوية نوم وحبة على موقعك يبقى خلص اليوم وبصراحة انا بلاقى كل اصحابى بعد رمضان فى تغيير جميل بنتكلم فى الدين وربنا واللى عملناة فى رمضان بجد حاجة جميلة اما عن الحب فانا مش رومانسية اوى وحتى لوكدة فالمفروض انا ربنا اهم وهو مش حينفعنى بحاجة يوم القيامة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 17
subject = "هنصوم و هنحلم بمصر اللى بتتولد من جديد ف ساعه ضلمه ما يعلم بيها الا رب"
author = "نيفين نيفى نوفا"
posted = "2006-09-24"
text = "مش عارفه ليه يا براء بحب جملتك دى و معلقه معايا كل ما اجى اكتب تعليق على موضوع ليك<br />و برغم انى سالتك قبل كدا لسه هتحلم بمصر اللى بتتولد من جديد ف ساعه ضلمه ما يعلم بيه الا ربنا رغم كل الظروف اللى حوالينا و انت مرديتش عليا<br />انا برده هقوللك رايى<br />انا شايفه اننا طول السنه عايشين لحاجتين يا اما لنفسنا يا اما لغيرنا<br />و علشان كدا مش كتير لو عشنا شهر لربنا<br />و انا بستعجب يا جماعه من اللى يزعل لما حد يقولله ناجل كذا لبعد رمضان<br />فعلا يا جماعه مش كتير على ربنا شهر ف السنه<br />انا كنت هنيتك يا براء برمضان ف موضوع استاذ تاريخ نحن المساكين و بكررها تانى كل سنه و انت طيب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 18
subject = "خلاصاية"
author = "معاذ محمود عامر"
posted = "2006-09-24"
text = "الموضوع مش موضوع رمضان<br />انما موضوع حلال وحرام<br />اللي شايف ان دي حاجة حرام ميعملهاش أساسا حتى في غير رمضان<br />واللي شايفها حلال_وانامنهم_براحته أهم حاجة ميبقاش فيه تعدي على حرمة الصيام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 19
subject = "رمضان شهر جميل"
author = "على المصرى"
posted = "2006-09-24"
text = "الكلام عن شهر رمضان الجميل<br />شهر رمضاندة يا جماعة لازم ننسى فية كل حاجةيعنى اللى ماشى معى بنات يفكو منهم شوية واللى مقضيها بردة نفس الكلام يعنى باختصار الشهر دة لازم نبقى فية شوية معى الله عز وجليجماعة لازم نصلى ونصوم ونقرا القرءان ونصلى التراويح ونصلى الفجر حاضر ياريت يا شباب علشان احنااللى هما الشباب ريحين فى دهية خالح يعنى نبقى شوية معى ربنا علشان احنا ريحين فى دهية يجماعة لحظو انا دلوقتى اللى بيموت هما الشباب الصغيرينصح ولا غلط ندعو الله ان يهدى جميع شباب المسلمينامين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 20
subject = "البراء دا قريب حمدى رزقوف"
author = "ايمن امام- المحامى"
posted = "2006-09-24"
text = "السلام على من اتبع الهدى - مالك ياعم براء بتخبط ليه - عنوان مقالك - بصراحه سىء للغايه-مش عارف تختارلك عنوان اخر - مثلا تطلع لنا بفتوى من اياهم ان لمس الحبيب لايفطر طالما النيه انك تتجوزها بعد العيل الاولانى - انتا قريب حمدى رزقوف بتاع المصرى اليوم ولاايه الحكايه - وكل عام والاسلام بخير شاء من شاء وابى من ابى - تسكثرون علينا ان نعود الى الله فى هذا الشهر - كلنا - انا اتكلم على المسلمين يابراوف - كلنا نعلم اننا مقصرين مع الله - فل قررنا ان نصالحه فى هذا الشهر تزعل ليه يااسطى براوف - انا فهمت مقالك كده مش عارف يمكن عندى قصور فى الفهم - ولا حريه الابداع عندك مفتوحه الشهيه علينا - روح ياعم اتوضى وصلى لك ركعتين واتقى الله على الاقل فى هذا الشهر - ولو مش عارف كيف تتوضاء ممكن ترجع لاى موقع اسلامى تتعلم منه كيفيه الوضوء وكيفيه التأدب عنما تتحدث عن شهر انزل فيه القرأن - يا اسطى برأوف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

[[comments]]
order = 21
subject = "كل عام و انتم بخير"
author = "ريما"
posted = "2006-09-24"
text = "انا بحب كتير مقالاتك ا اخ براء<br />كل موضوعاتك بتكتبها باسلوب كتير حلو<br />انا ما كان يتغير عليا شي ايام رمضان لما كنت بالجامعة اولا انا طول 4 سنين ما كنت لا مصاحبة و لا بحب بس كانت علاقاتي بضل عادي مع زمايلي الشباب يعني بغير رمضان و لا برمضان انا ما كنت بحس حالي بعمل اشي غلط عشان اوقفو برمضان<br />مجرد زمالة عادية و هاد كتير طبيعي و حتى بعد ما خلصت و اشتغلت ضلت علاقتي مع زملا الشغل عادي زي طول ايام السنة<br />بعتقادي الواح منا لازم يحترم حالو و يفرض حدود على علاقاتو برمضان او بغيرو هيك ما بطر غير شي برمضان<br />و كل عام و انتو بخير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134338/http://www.20at.com/article2.php?sid=1270"

