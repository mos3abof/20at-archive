subject = "مكسوفة"
text = "جزاكم الله خيرًا على الإهتمام<br />وياريت كمان تحذفو التعليق بتاع(حب ايه) لأن مش وائل هو اللي كتبه ، وكمان التعليق اللي بيرد عليه وياريت نتعلم إننا لما نناقش نناقش رأي مش شخص ، ومدام انتو متأكدين إن مش وائل اللي كتب التعليق يبقى كمان اللي ناقش فكرته ، لأن مابني على خطأ فهو خطأ<br />وياريت بجد يتنفذ الإقتراح وكل سنة وانتو طيبين"
