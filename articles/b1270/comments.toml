text = "قشطه ياعم بيراء<br />كده لي عندك موضوع اوع تنسى !!!!!!!!!!!!!<br />انا قلت راى وهاأقول تانى<br />الحب الطاهر الصادق ماتفرقش معاه رمضان ولا غير رمضان أما حب اللمز والغمز طبعا........ فى رمضان أو غير رمضان لان ساعتها ممكن تقول<br />انت حيت (شهقه ) ياشيطان"
