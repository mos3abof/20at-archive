[[comments]]
order = 0
subject = "مفاعلات نوويه فى مصر مبارك"
author = "ليس خرقا للاعراف السائده الان ان تمتلك مصر مفاعلات لانتاج احتياجاتها من الطاقه"
posted = "2006-06-12"
text = "لكن العائق الذى سيواجه القائمين على اتخاذ هذه الخطوه الجباره هو..<br />كيفيه توفير تلك الكميات المهوله التى سوف تستخدم لانتاج الطاقه من.......<br />نـــــــــوى الـــبـــلــح<br />والا فلماذا تعارض مصر مبارك طموح ايران النووى وهى لا ناقه لها فى الامر ولا جمل ؟<br />أأأأأأأأأأأأأأأأأأأأأه يــــــا نـــووى<br />عفوا<br />أأأأأأأأأأأأأأأأأأأأأأأه يـــأ بـــــلـــدى"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005917/http://masr.20at.com:80/article.php?sid=499"

[[comments]]
order = 1
subject = "ماذا فديتك؟"
author = "سمسم"
posted = "2006-06-13"
text = "أضحكتموني وأنا أميل للبكاء، ياحاج عادل صبري إتق الله يارجل وكفاك هرفا بما لاتعرف:\"وكانت مصر على وشك توقيع اتفاق مع ألمانيا لبناء المحطة النووية الأولى في الضبغة (120 كم غرب الإسكندرية) عام 1986، ضمن خطة قومية لبناء 10 مفاعلات على مدار 20 عاما تنتهي العام الحالي.\"<br />من يصدق هذا فلا يلومن إلا نفسه، لم يذكر لنا العلامة النطاسي أي الألمانتين يقصد الشرقية أم الغربية وقتها؟ ومع ذلك يمضى في إستحمارنا كذا بلا رقيب ولا حسيب كأنا جميعا من النوكى والحمقى. يابن الأكارم تعلم أصول الكلام، منذ عهد خرتشوف نيكتا ومن وراء ظهورنا تم إتفاق ودي بين العملاقين على ألا يسمح للعرب بإمتلاك أسرار الطاقة النووية، ومع أن الصين الشعبية وعلى لسان شوان لاي كانت وعدت ناصر بمفاعل نكاية بروسيا وأمريكا، إلا أنها لحست وعدها بعد ذلك، حينما إتضح لها هذا الإتفاق. ولا نزيدك علما أن ألمانيا الغربية كانت ولا تزال إن لم نقل مستعمرة أمريكية فهي تابع يدور بفلك الولايات المتحدة، ولم تغادر قوات الحلفاء برلين رسميا إلا عشية ما يعرف بحرب الكويت، فماذا تقول؟ والشئ عينه يصدق على ألمانيا الشرقية مع إختلاف السيد.<br />الذي أعلمه أن نيكسون تقدم بإقتراح لبناء محطة كهروذرية بسيناء تستفيد كل من إسرائيل ومصر من إنتاجها، وهو مارفضته إسرائيل على الفور، رغم إنها تحت إشرافهم وإشراف الأمريكان وهي سلمية أكثر من إستسلام الساداتي ذاته. أتدري لماذا لافض فوك؟ لعلم أبناء العمومة أن الفارق بين الإستخدام السلمي وبناء القنابل هامشي، وهذه معلومات أولية يعرفها حتى حمار مرتش من عيار أبا البرادع صاحبك.<br />ثم إعلم سهد ليلهم مبهرجوك وفاضحوك، إن مخابرات سيدك الساداتي لها ضلع أكبر من الكبير بإغتيال العالم المشد، فقط ليحرم العراق من خبراته، فماذا تقول؟<br />الليفتنا<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005917/http://masr.20at.com:80/article.php?sid=499"

[[comments]]
order = 2
subject = "بأي حق"
author = "أنا مش قادر أفهم بأي وجه حق تمنعنا الدول الكبرى من امتلاك مفاعلات وحتى أسلحة نووية؟ هل هي وصية علينا فتمنعنا عشان ماما قالتلنا ما نلعبش بالكبريت علشان ما نتلسعش؟ ولا هي ملاك نزع الأسلحة وإحلال السلام في الشرق الأوسط؟ وإن كانت كذلك فلماذا تغض بصرها عن المفاعلات النووية الإسرائيلية، وكأنها فتاة تسير في الشارع فلا يجب النظر إليها لأن الله نهانا عن ذلك؟"
posted = "2006-06-13"
text = "أتمنى أن يأتي اليوم الذي يصبح من حقنا أن نساير الغرب في تقدمه بدون قيود أو شروط"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615005917/http://masr.20at.com:80/article.php?sid=499"

[[comments]]
