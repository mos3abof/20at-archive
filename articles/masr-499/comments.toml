subject = "يا كل مصر .. الثورة الآن"
author = "مصرية"
posted = "2006-06-17"
text = "مرحبـــــا فارس القلم لا أملك ما أقول بعد كلامك سوى الدعوة للثــــــــورة الثورة ياكل المصريين الآن وقبل فوات الأوان..اقرؤا لأصحاب الأقلام المخلصة الشريفه..اعرفوا الحقائق اعرفوا الطريق الى الخلاص من هذا العفن الذى يقتلنا<br />أخى جاوز الظالمون المدى<br />فحق الجهاد وحق الفـــدى<br />ياكل أبناء مصر الثــــــــورة الآآآآآآآن"
archived = "2006-09-19"
capture_url = "https://web.archive.org/web/20060919011510/http://masr.20at.com:80/article.php?sid=499&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
