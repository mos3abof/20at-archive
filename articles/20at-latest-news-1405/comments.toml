text = "الفيلم الوثائقي الفلسطيني `الجنه الان` الذي كاد أن يحتل المرتبه الأولى لأحسن فيلم لهذا العام في الاوسكار لم يأخذ مكانته الحقيقية. فما هي الدوافع التي أجبرت أو جعلت الاوسكار مقتنعا على التراجع أو غض النظر عن هذا الفيلم الذي اغضب وهز الكيان الصهيوني ؟ ولماذا أصر الاوسكار على قول جمله نشكر السلطه الوطنيه الفلسطينيه على الفيلم الفلسطيني `الجنه الان` ؟ ولم يقل نشكر الشعب الفلسطيني أو نشكر جميع العاملين على هذا الفيلم؟ وهل استطاع اللورد الصهيوني إقناع الاوسكار بهذه الدرجه؟؟ وما هي رسالة الفيلم ؟ وهل نعتبر ترشيحه مكسباً سياسياً للقضية الفلسطينية ؟ وتتواصل الانتقادات الموجهة إلى فيلم `الجنة الآن`، بسبب تصويره للعمليات الاستشاديه في إسرائيل.، ومع ترشيح الفيلم لنيل جائزة أفضل فيلم أجنبي في احتفالات الأوسكار لهذا العام، اشتدت حملة مضادة لرفع الفيلم من قائمة الأفلام المرشحة للجوائز. ولكن مخرج الفيلم هاني أبو أسعد قال انه يأمل أن يساعد الفيلم في فهم البيئة والدوافع التي تدعو أناسا عاديين للقيام بمثل هذا العمل البطولي. وامتاز الفيلم بعده ميزات جعلته اكثر لفتا للانظار فقد استمد هذا الفيلم احداثه من الواقع العام والحياه الواقعيه والبيئه الصحيحه للواقع الفلسطنيني الذي يعيشه الشعب الفلسطيني بالضفه الغربيه. والجدير بالذكر ان الارتباط الفلسطيني الاسرائيلي ساهم في اعداد هذا الفيلم وقد جرت بعض لقطات هذا الفيلم بمدينه تل الربيع التى تقع تحت سلطات الاحتلال الاسرائيلي والتى تسمى تل ابيب وكلمه ابيب عبريه الاصل وتعنى بالعربيه الربيع. الفيلم يتحدث ايضا عن العقليه التى تسلكها الفصائل الفلسطينيه ويصور معاناه الشعب الفلسطيني على الحواجز العسكريه الاسرائيليه التى تفصل بين مدينه واخرى وبين قريه واخرى. ففى تمام الساعة الثالثة فجر الاثنين و حتى السادسة صباحاً بتوقيت القاهرة،بدأ حفل توزيع جوائز الاوسكار على مسرح كوداك في هوليوود بولاية كاليفورنيا.. وشارك في تقديم الجوائز والأفلام المشاركة نخبة كبيرة من نجوم هوليوود على رأسهم الممثل القدير `مورجان فريمان` الفائز بجائزة الأوسكار العام الماضي كأفضل ممثل في دور مساعد عن دوره في فيلم `فتاة بمليون دولار. وهذه هي المرة الاولى في تاريخ جوائز الاوسكار التى يتم فيها ترشيح فيلم فلسطيني عربي لنيل جائزة افضل فيلم اجنبي وهو فيلم `الجنة الان` للمخرج الفلسطيني هاني ابو أسعد الذي تناول فيه قضية العمليات الاستشهاديه بشكل خاص وبيان الماساه التي يتعرض لها الشعب الفلسطيني الجبار بشكل عام. . . وتوجهت مجموعة اسرائيلية تقول انها تمثل اهالي `ضحايا العمليات` الى أكاديمية العلوم والفنون السينمائية الاميركية طالبة منع اشراك الفيلم في المنافسة واقناع الاوسكار بمنع هذا الفيلم الفلسطيني الذي هز الكيان الصهيوني من الفوز او حتى من المشاركه بجوائز حفل الاوسكار لمنع رفع أي شى يتعلق بفلسطين عاليا ولمنع الفلسطينين من تحقيق مجرد حلم صغير يتسني بتصوير الواقع الفلسطيني الموجود بفلسطين ولاقناع الاجناس العربيه بحق الشعب الفلسطيني بأرضهم واظهار المعانه الكبيره التي يتعرض لها الشعب الفلسطيني. وقالت المجموعة الاسرائيليه والتى تمثل ضحايا العمليات الاستشهاديه انها جمعت اكثر من 32 ألف توقيع على التماس يعارض ترشيح فيلم (الجنة الان) لجائزة احسن فيلم اجنبي وحاولت ايضا اقناع الاوسكار بمنع الفيلم من المشاركه بتوزيع الجوائز! ويقول خبراء بصناعة السينما انه لم يحدث ابدا في تاريخ هذه الصناعة سحب فيلم رشح بالفعل لنيل جائزة اوسكار الا مع الجهات الصهيوينه ويقول ايضا الوسكار انه تلقى بلاغا رسميا يمنع مشاركه الفيلم بتوزيع جوائز الاوسكار وان هذا الجهه التى ابلغتهم بذلك هي جهه بالغه الاهميه والخطوره. . وقالت صحيفة `يديعوت احرونوت` الاسرائيليه ان اعضاء الاكاديمية الامريكية للسينما تعرضوا الى ضغوط كبيرة مارستها جهات اسرائيلية وشخصيات يهودية ذات تأثير فى هوليوود، غايتها عدم التصويت على منح `الجنة الآن` جائزة أوسكار. وفيلم `الجنة الآن` هو من إخراج هانى أبو اسعد ويقوم بدورى البطولة فيه على سليمان وقيس ناشف، وجميعهم من مدن داخل الخط الاخضر. ويروى الفيلم قصة `فدائيين` فلسطينيين من مدينة نابلس فى الضفة الغربية خرجا لتنفيذ عملية `استشهاديه` فى حافلة اسرائيلية فى مدينة تل ابيب وفى النهاية يقرران العدول عن خططتهما وعدم تنفيذ العملية. والجدير بالذكر ان دور السينما فى اسرائيل رفضت عرضت الفيلم. وقد فاق حفل هذا العام الحفلات السابقة من حيث تكاليف تنظيمه. إذ تشير التقديرات الى انه تكلف حوالى مائة وخمسين مليون دولار. وهكذا استاطاعت فعلا الجهات الصهيونيه منع الاوسكار من اعطاء ولو حق بسيط لهذا الفيلم الذي يعبر عن الهموم الفلسطينيه ويتحدث عن القضيه الفلسطينيه!!!!! ان فلم الجنة الان قد ترشح لافضل الجوائز العالمية وهذا نصر بحد ذاته لثقافة عربية ملتزمة صاعدة تحترم العقل والدين والعلاقات الحضارية و الانسانية لجميع البشر فجميع العاملين في هذا الفيلم هم اناس عاديين وبالرغم من ذلك كاد ان يأخذ هذا الفيلم جائزه الاوسكار لولا الجهات الصهيوينه التى لا تريد حتى ان يكون مجرد اسم فلسطين بالاوسكار. واخرج الفيلم المثير للجدل مخرج من عرب اسرائيل هو هانى أبو أسعد ومثل فيه ممثلون عملوا مع فريق فلسطيني. وكان منتج الفيلم يهوديا اسرائيليا وكان تمويله اوروبيا. وهاني ابو اسعد مخرج الفيلم فلسطيني الاصل يحمل الجنسيه الاسرائيليه كباقي الفلسطينين الذين يعيشون بأرض ال67 وومناطق الخط الاخضر فقد قررت اسرائيل بمنحهم جنسيات اسرئيليه فقد ظنت ان بذلك تستطيع الغاء الانتماء الفلسطيني والوجود الفلسطيني والهويه الفلسطينيه لهؤلا الشخاص. واتهم يوسي زور الذي قتل ابنه في تفجير حافلة صهيونيه بعمليه فدائيه هزت مدينه تل ابيب والتى راح ضحيتها اكثر من 20 اسرائيلي والعديد من الجرحى، ان الفيلم يتعاطف كثيرا مع العمليات الاستشهاديه وانه يعارض حق اسرائيل المشروع بحد تعبيره من العيش بسلام. وانه يحث الكثيرون من الشبان الفلسطينين الذين شاركوا في الانتفاضة التي اندلعت ضد الاحتلال الاسرائيلي في الضفة الغربية وقطاع غزة عام 2000 . من القيام بعمليات ضد اسرائيل. وقال زور لرويترز `ان فيلم الجنه الان يجب عليه تغير اسم فيلمه ليصبح جهنم الان لانه يتحدث عن سفك الدماء وقد حدد زور مهمه العالم ان تقف ضد هذا الفيلم لمنعه من اخذ جائزه الاوسكار كأفضل فيلم لهذا العام. وهنا نرى تبادل وجهات النظر الاسرائيليه المناهضه لهذا الفيلم والخوف الذي زرع بالكيان الصهيوني الغاصب الذي لم يكتفى بأغتصاب الارض ولم ولن يقتنع بحق الفلسطينين بأرضهم فكل ردود الفعل الاسرائيله الحاقده جاءت فقط للرد على فيلم فلسطيني يحلم بتوصيل الحقيقه للعالم اجمع. ورفضت دور السينما الاسرائيلية الكبرى عرض فيلم `الجنة الان` بعد ان عبر خبراء التوزيع عن خوفهم من ضعف الاقبال على مشاهدة فيلم عن المفجرين الفدائيين كما تحدثوا عن مقاطعة محتملة. ولكن التحدى الكبير الذي حدث بأسرائيل فأن دار العرض في السينما في تل ابيب هي الدار الوحيده التي يعرض فيها الفيلم وحسب اداره الدار فان التذاكر جميعها مباعه وهذا يدلل على الاهميه الكبيره للفيلم من الجانب الاسرائيلي وافراد الكيان الصهيوني الذي لم يعد له قدره علىالتحمل بالانتظار لرؤيه فيلم فلسطيني يظهر كيفيه القيام بالعمليات الاستشهاديه التى تقع داخل الكيان الصهيوني ويبرز ويصور الفيلم معاناة الفلسطينيين اليومية تحت الاحتلال الاسرائيلي لكن شخصيات الفيلم تناقش ايضا ما اذا كان ذلك يبرر العنف. وأقبل احد المهاجمين على مهمه استشهاديه تكفيرا عن الذنب الذي شعر به لان احد اقاربه كان عميلا للكيان الصهيوني فقد قرر تكفير لذنب عن والده الذي كان جاسوسا لاسرائيل الامر الذي دفعه للانتقام والمثير للجدل ان فيلم الجنه الان فاز بجائزة الكرة الذهبية `جولدن جلوب` في يناير الماضي الامر الذي عزز فرص فوزه بأوسكار احسن فيلم اجنبي الامر الذي استعدى الى استنفار الكيان الصهيوني والعمل جاهدا لمنع هذا الفيلم من الوصول لاي مركز بالاوسكار . . وفي مجموعه من الاراء المتباينه قال احد الاسرائيلين الذين شاهدوا هذا الفيلم ان هذا الفيلم سيكون له ردود كبيره على الساحه الفلسطينيه وسيبعث بهم المزيد من التقدم نحو تحرير ارض مغتصبه او ارض حق للاسرائيلين على حد تعبيره وقد اكدت مجموعه كبيره من مشاهدين هذا الفيلم ان الفيلم سيخلق جو جديد في الضفه الغربيه وقطاع غزه يعزز من اهتمام الفلسطينين بارضهم المحتله وحث الشبان الفلسطينين بضرب الكيان الصهيوني الغاصب كما اثار فيلم الجنه الان جدلا واسعا كغيره من الافلام الفلسطينيه التى تتحدث عن الماساه الفلسطينيه مثل فيلم `ميونيخ` ويتناول فيلم ميونخ قصه عميل للموساد الاسرئيلي يطلب منه تصفيه مجموعه من الناشطيين الفلسطينين بسب قيام مجموعه فدائيه من منع اسرائيل بالمشاركه بالالعاب الالومبيه التى كانت تقام بالمانيا انذاك. وهكذا وبأختصار هز الكيان الصهيوني المغتصب من فيلم الجنه الان وبعث فيهم الرعب والخوف من اعلاء كلمه فلسطين في الاوسكار واستطاع فعلا الكيان المغتصب واللورد الصهيوني بأوروبا وامريكا مع الاوسكار من منح فيلم الجنه الان افضل فيلم لهذا العام ولكن فيلم الجنه الان حقق انتصارا ملحوظا بالاوسكار فقد نال هذا الفيلم العظيم المرتبه الخامسه على العالم واستطاع كأول فيلم فلسطيني دخول الاوسكار واخذ مكان جيد له. .. فقد استطاع فعلا اللوبي اليهودي بالنجاح والاقناع المتميز من الالتفاف حول فيلم الجنه الان… انها ما يسمى بالدمقارطيه الامريكيه الصهيونيه … على كل حال لا بد للقيد ان ينكسر يوما ما بفضل صمود وعزيمه الشعب الفلسطيني الصامد وعلى امل ان يكون المستقبل مشرقا ومليئا بالانتصارات ان شاء الله وان تحمل هذه الايام رسائل تحرير ونصر وحلم عوده ودوله مستقله… الخلود لشدائنا الابرار والجنه لهم بأذن الله والخزي والعار للعملاء وللصهاينه الاقذار…"
