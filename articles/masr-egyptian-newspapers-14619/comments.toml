text = "يطالعنا كثير من المبدعين وفي كل الأجناس الأدبية بأشياء غريبة يكتبونها وصورا ليست من البلاغة وجودة الصنعة في شيء وليس لها ما يبررها سوى فضاضة صاحبها سواء كانت مكتوبة أو مرئية أو مسموعة وعن بعض هؤلاء المحسوبين على فئة المثقفين والفنانين ذاك الذي رسم لوحة أو فقرة في قصة أو رواية أو صورة في إنتاج سينمائي لمشهد جنسي فضيع يثير فيك التقزز بحيث أنك حين تراه قد يبدو لك من خلال ما رسم صاحبه من أحداث أنه يشكل محطة طبيعية قد يجعلك تستسيغه ولو على مضض ولكنك سوف تظل تشاهده وأنت تحمل في نفسك كل مقومات شخصيتيك وبيئتك حتى وإن كنت لا تتفق معها واعلم سيدي الكريم أن هؤلاء هم فئة تتسابق في إرضاء بعض الجهات من الغرب ونيل الرضى منها وقبولها في منتدياتها وقد رفعت شعار محاربة \" الطابوهات \" عبثا المتمثلة في الإنسلاخ من كل القيم تحت موضة أدبية جديدة يسميها هؤلاء اعتباطيا \" الحداثة \" وهي في النهاية سعي لكسب \" الخواجية \" مثل اللجوء السياسي هو لجوء فني . http://www.20at.com/components/com_jcomments/images/smiles/unsure.gif"
