text = "حقيقى خطوات جيدة …لأن أهم شئ فى الموضوع دا هو الإيمان أن كل شئ بيد الله الخير والشر… والشر يكون فى حد ذاتة خير ا …والبدء بالإعتراف أنه مدمن …فهذا سيجعل باقى الخطوات سهلة التنفيذ …ومافيهاش أى حاجة إن الإنسان يعترف بخطأة فى حق نفسة والأخرين وحق خالقة عز وجل ويقلع عن الإدمان …دا حتى هايعيش بصحة كويسة …"
