author = "MS&Saicoo"
posted = "2007-10-25"
text = "بصراحه ياجماعه فعلا مع الحب مفيش مستحيل لما بنحب فعلا ما بنشوف عيوب حبايبنا ودا من مبادئ الحب سوا تخين رفيع النظره الخارجيه ما بنهتم بيها<br />لان الحب فى قلوبنا ومتهيئلى لو مافيها عيوب فى قلوبنا اكيد مفيش مستحيل دى نظره<br />ومن الوجه الاخر لو بتحب فعلا هتتغير وتحب نظره الرضا من حبيبك ويكون ليك هدف لانك تتغير للاحسن والسبب برضه الحب<br />لكم منى بالغ تحياتى"
archived = "2009-07-03"
capture_url = "https://web.archive.org/web/20090703105256/http://www.20at.com:80/20at/7ayatna/7077.html"

[[comments]]
