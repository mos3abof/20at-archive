author = "اكتب اسمك هنا مصرية مغتربة"
posted = "2007-10-25"
text = "ساعات كتير بيبقى التحن دليل على حاجات حلوة فى الشخصية يعنى بيقولو ان الشخصية اللى بتحب الحياة دايدا بتحب الاكل وطبعا بتتخن وفعلا كلنا بنلاحظ ان التخان دايما دمهم خفيف وعشرتهم حلوة وصحبتهم خفيييييييييفة اخف من ناس كتير وزنهم مثالى"
archived = "2009-07-03"
capture_url = "https://web.archive.org/web/20090703105256/http://www.20at.com:80/20at/7ayatna/7077.html"

[[comments]]
order = 2
subject = ""
author = "علي علي علي"
posted = "2007-11-02"
text = "اي هبل في الجبل مش لاقيين موضوعات ولا ايه يا عشرينات<br />حرام عليكم اعملوا بالدولارات اللي بتاخدوها يا بتوع الاخوان وقدموا اي حاجه مفيده او معلومه مهمه للناس<br />المصيبه بقي ان كل الموضوعات قماشه واحده مقطوعه من ثوب الهيافه<br />ومش عارف ايه حكاية السؤال اللي في نهاية اي موضوع ؟؟ ايه بقي رأيك ؟ يا ريت تقولنا انت هاتعمل ايه ؟<br />ايه هو انا بأقرأ موضوع ولا فزوره هاهاهاهاهاهاها طيب في جايزه للتعليق الصحيح"
archived = "2009-07-03"
capture_url = "https://web.archive.org/web/20090703105256/http://www.20at.com:80/20at/7ayatna/7077.html"

[[comments]]
order = 3
subject = ""
author = "منى"
posted = "2007-12-04"
text = "الدين والخلق اهم شىء فى شريك الحياة ولكن القبول هو الاخر مهم ولكن انصح اى فتاة تقدم لها عريس بدين وتوافرت فية كل المزايا الاخرى ان تتروى فى اخذ القرار ولاترفض الا بعد الاستشارة والاستخارة وتطلب منة ان يخس<br />وبعدين ان شاء الله فى الجنة مش هيبقى تخين هيبقى جميل جدا ودة المهم لان الحياة فى الجنة مش هنا"
archived = "2009-07-03"
capture_url = "https://web.archive.org/web/20090703105256/http://www.20at.com:80/20at/7ayatna/7077.html"

[[comments]]
order = 4
subject = ""
author = "الخنساء"
posted = "2007-12-08"
text = "أولا أحييكم على هذ المواضيع بجد الرائعة ولذيذة كمان<br />ثانيا أعيب على اللى بيعقب …ياجماعة فيه حاجة إسمها ذوق فى الرد ..يعنى مثلا الموضوع مش عاجب حضرتك يبقى مش لازم ترد عليه<br />يعنى حضرتك لو حد بيتكلم معاك فى موضوع مش عاجبك هتقوله إيه الهيافة اللى إنت بتتكلم فيها دى؟؟؟؟؟؟<br />فياريت ياجماعة وأرجو الذوق فى الكلام شوية وياسيدى فيه مواقع تانية تليق بدماغ حضرتك لو الموقع ده مش عاجبك<br />وجزى الله خيرا كل من يشرف على هذا الموقع الرائع وإلى الأمام …"
archived = "2009-07-03"
capture_url = "https://web.archive.org/web/20090703105256/http://www.20at.com:80/20at/7ayatna/7077.html"

[[comments]]
