subject = ""
author = "منى وهيب"
posted = "2007-12-13"
text = "بجد الموقع يبان خفيف لكنه عميق جدا الرك على طريقه العرض مش الموضوع لان اى موضوع ممكن يتعالج بهيافه او يتعالج بشكل لطيف ومفيد زى ماحصل هنا وانا طبعا مع الراى اللى بيقول ان مسالة التخن والرفع مالهاش اى قيمة فى الاختيار احنا فى زمن البنت بتدور فيه على راجل يمتلك صفات الرجولة بجد مهما كان شكله او وزنه لان الراجل اللى بجد بقى شىء نادر جدا ولهم حق الناس اللى قالوا ان اللى مش عاجبه الموضوع اما يشوف موقع تانى او يعلق بشكل هادى ومحترم"
archived = "2009-07-03"
capture_url = "https://web.archive.org/web/20090703105256/http://www.20at.com:80/20at/7ayatna/7077.html"

