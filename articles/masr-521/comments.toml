subject = "كويس"
author = "عبدالله مفتاح"
posted = "2006-06-14"
text = "مقال كويس بس على حد علمي المتواضع<br />ان العنوان لغويا غلط لان غير لا تعرف<br />اي ان الصواب<br />للمراة غير المصريه"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112728/http://masr.20at.com:80/article.php?sid=521"

