[[comments]]
order = 3
subject = "ضاعت الحقوق"
author = "mezo"
posted = "2006-06-15"
text = "حقوق المرأة ضيعتها المرأة<br />و التي هي من أمثال هؤلاء النساء اللاتي يتكلمن كثير و لا يفعلن اي شيء سوى الظهور على الفضائيات و الأرضيات كمان وكل يوم بتسريحه شكل و بفستان جديد ز بنطلون مشخلع و هكذا ضاعت الحقوق<br />لكنها عند من شرعها باقية سبحان الله"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112728/http://masr.20at.com:80/article.php?sid=521"

[[comments]]
order = 4
subject = "الرجال قوامون على النساء"
author = "بنت الشاطئ"
posted = "2006-06-20"
text = "مع اني بنت الا اني مش موافقه على اللي المراه فيه دلوقتي من مساواه مبالغ فيها مع الرجل .وتاكدوا يا جماعه انا فعلا بنت ومش متطرفه انا اتهاجمت يعني مكنتش مجرد معارضات لكلامي على منتديات تانيه يا ريت رايي يحترم و المعترض يناقشني"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112728/http://masr.20at.com:80/article.php?sid=521"

[[comments]]
