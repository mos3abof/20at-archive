subject = "رد على بنت الشاطىء"
author = "NADIAMORSI"
posted = "2006-06-21"
text = "يابنتى الرجال قوامون على النساء بما انفقوا واليمين دول مافيش حد بينفق مع احترامى لكل الرجال بلنسبه للمقال فهو جميل"
archived = "2006-09-07"
