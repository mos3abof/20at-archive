subject = ""
author = "نيفين نيفى نوفا"
posted = "2007-06-08"
text = "انا كنت فاكره ان اراء الناس هتبقى غير كده خالص<br />و اضح من البرومو انه فيلم هايل<br />بس لازم اشوفه و بعدين احكم<br />بس انا ليه كلمه لاستاذ محمود عباس الطالب و الناس اللى بنفكر زيه واقولهم مينفعش نحكم على احمد من خلال حياته الشخصيه و لازم نفصل و نبقى حيادين ف حكمنا<br />مع ان الفيشاوى نفسه قال ف كذا interview انه قبل الفيلم علشان وافق حالته النفسيه بعد موضوع طلاقه بس مع ذللك انا لما اجى احكم هنحى كل دا جانبا"
archived = "2010-02-19"
capture_url = "https://web.archive.org/web/20100219020008/http://www.20at.com:80/masr/review/6196--45----.html"

[[comments]]
