posted = "2008-04-02"
text = "والله الفلم حلو .. بس ما أدري وش سار في النهايه ؟!<br />ما ادري قتلو أحمد بحجة قتله لوالديه ولا لا !؟<br />الصراحة النهايه مو واضحة .. الفلم حلو بس المفروض يوضحون النهايه<br />أنا ما أدري وش حصل مع أحمد اللحين .. قتلوه ولا لا .!؟<br />اللي يعرف يخبرني"
