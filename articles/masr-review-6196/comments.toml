author = "دسوقي"
posted = "2007-06-09"
text = "لا يا نيفين أنا عن نفسي رحت الفيلم وفعلا مش حلو ذي ما كنا فاكرين تحسي كده ان الاحداث مش راكبه على بعضها واحمد مش خفيف كده يعنى بجد انا حسيت ان الدور اكبر منه بكتير"
archived = "2010-02-19"
capture_url = "https://web.archive.org/web/20100219020008/http://www.20at.com:80/masr/review/6196--45----.html"

