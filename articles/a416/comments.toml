[[comments]]
order = 0
subject = "البراء"
text = "لأول مرة هتخلي عن إسم بيرو وأكتب تحت إسمي الحقيقي \"البراء\" يمكن كانت اول مرة أكون فخور فيها بأسمي يوم إستشهاد البطل عياش ...أبو البراء...<br />يا تري ممكن نلاقي بينا دلوقتي اللي يكمل مسيرته ويا تري فين البراء دلوقتي ...حي ..ولا ...ولا دمه هو كمان ملطخ وجه كل واحد عربي وأنا أولهم (طبعا بعد الكراسي)(!!)<br />أما محمد مصطفي فدي أول مقالة ليه علي عشرينات ....يا تري هنشوفك تاني..؟؟"
archived = "2004-07-05"
capture_url = "https://web.archive.org/web/20040705235113/http://www.20at.com:80/article.php?sid=416"

[[comments]]
order = 1
subject = "عياش والرنتيسي وقافلة الشهداء"
text = "بعد وفاة والدة الرنتيسي أعلن ان عياش كان مستخبي لمدة سنة كاملة في بيتها وحتى أولادها مكنوش يعرفوا!! علشان كده ابنها كان الرنتيسي"
archived = "2004-07-05"
capture_url = "https://web.archive.org/web/20040705235113/http://www.20at.com:80/article.php?sid=416"

[[comments]]
order = 2
subject = "القدس لنا"
text = "بسم الله والصلاة والسلامعلى خاتم الانبياء والمرسلين اما بعد فان يحيى عياش قائد ترك الحياة وذهب ليلحق كلمة الحق فانه رجل الذي يفتخر به لانه قائد ومسؤل عن قتل الصهاينة ووضع الخوف والفزع حتى انه كان المطلوب الاول لدى الصهاينة بعد ان عمل جاهدا في العبوات الناسفة وهذا الرجل الذي عمل جاهدا لاخافة اليهود حي في قلوبناان شاء الله ويحيى بعد استشهاده خلف وراءه الف يحيى ليكن يحيى رمز الجهاد وان لضربك لسائرون يا يحيى البطل"
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025230210/http://www.20at.com:80/article.php?sid=416"

[[comments]]
order = 3
subject = "نابلس جبل النار"
text = "لازم قبل مانحارب اسرائيل نحارب الجواسيس الي خانوا الله والوطن وقبل كل شي نفسهم ومع انه عنا جواسيس الا انه في شعب مجاهد مناضل جبار"
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025230210/http://www.20at.com:80/article.php?sid=416"

