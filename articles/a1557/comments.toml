[[comments]]
order = 0
subject = "زهور"
author = "الله شباب فلسطين جدعان، على الاقل فيهم اللي يعرف يستغل الانترنت بحاجات مفيدية بدل الحاجات السخيفة."
text = "ولو كل واحد فيهم فتح النت دقيقة وقال اللي كلمة عن فلسطين لكان ام فلسطين ومعاناة الشعب وصلت لملايين البشر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151209/http://www.20at.com/article.php?sid=1557"

[[comments]]
order = 1
subject = "زهور"
author = "هور"
text = "انا زهور محمد اللي دايما اعلق بعشرينات<br />بس حبيت انوه انو التعليق الاول اللي باسم زهور مش تعليقي<br />و ذلك واضح لانو مش اسلوبي في التعليق<br />ياريت يا زهور الثالثة في الموقع لانو في زهور تانيه بتعلق تذكري اسمك زهورواسم والدك عشان انا متتلخبطش<br />تحياتي لجميع الزهور"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151209/http://www.20at.com/article.php?sid=1557"
