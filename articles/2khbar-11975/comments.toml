text = "انا للة وانا الية راجعون<br />نقدم نحن الشعب المصرى طبقة الناس الغلابة والمهمشين خالص العزاء الى سعادة رئيس وزراء مصر الدكتور نظيف فى وفاة السيدة حرمة تقبلها اللة بواسع رحمتة-<br />كما اننا نذكر الطغاة والمجرمين ان عزرائيل قريب جدا من رقابهم ومن اراد منهم واعظا فالموت يكفية - وما تدرى نفس ماذا ت[ *** ]ب غدا ولا باى ارض تموت<br />الموت لا يقدر علية الحرس ولا اكوام المال ولا جبروت السلطة الغاشمة"
