order = 0
subject = "\\\"الغضب الساطع آت وأنا كلي ايمان\\\""
author = "معاذ محمود عامر"
posted = "2006-06-15"
text = "أعتقد أن الفترة المقبلة, ستشهد تطورات خطيرة جدا على صعيد أزمة القضاة, فالنظام ماض في مشروعه لاجهاض الحمل الثوري في الشارع, فبعد أن استطاع القضاة جمع الشارع المصري كله حولهم وتوحيد جميع النخب الفكرية والتيارات المتعددة حول هدف واحد وهام وهو استقلال القضاء, فوجئت الدولة بذلك فهاجت وماجت وحاولت عابثة منع ذلك التوحد المضاد لها والمتضامن مع السادة القضاة عن طريق السحل والاعتقال وانتهاك أعراض المواطنين, وستبقى كذلك أيضا في الفترة القادمة, فبالرغم من أنها حاولت تهدئة الوضع بالحكم الغريب الذي صدر من مجلس التأديب المسيس, الا أن ذلك كان من نظرها مسكنا مؤقتا للوضع وظنت ـولبئسما ظنت ـ أن القضاة سيسترخون والشارع سينام, لذلك بدأت تفصيل قانون السلطة القضائية الجديد بسرعة, ثم ها هي الآن تمرره الى مجلس الشورى في مشهد مثير لاستفزاز أي مصري لا سيما أنها رفضت عرضه على نادي القضاة ـالممثل الشرعي الوحيد لجموع القضاة في مصرـ وكان رفضا مهينا لكرامة القضاة . اذن بعد كل هذه المشاهدات, يتضح أن تأزم الوضع سيبدأ بتصعيد من القضاة قد يصل الى حد الاضراب عن العمل ـ كما لوحوا من قبل ـ وستتخذ الدولة الغبية اجراءاتها التصعيدية المضادة مأخوذة بصدمة ثورة الشعب مرة أخرى أمام طغيانها الأعمى المغرور . اذن ففترة السكون الحالي كانت فترة سكون سابق لعاصفة عظيمة, وهذه العاصفة مهمة لخلخلة ثقة النظام الغبي الحقير لذلك أهـــــلا بالـعــاصـفة و(النصر أقرب من ايدينا). للمراسلة والنبي :mizo_bns2011@yahoo.com"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619212612/http://masr.20at.com:80/article.php?sid=523"

