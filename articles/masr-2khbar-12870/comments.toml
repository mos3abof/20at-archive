author = "الحكومة مش فاضيه"
posted = "2009-08-08"
text = "الحكومة مش فاضيه<br />الحكومة مشغولة بالذي هو اهم<br />الحكومة ما عندهاش غير الامن وبس<br />امن النظام فقط هو المهم وكل شيء في البلد لا يهم على الاطلاق"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809145807/http://www.20at.com:80/masr/2khbar/12870-2009-08-08-06-34-21.html"

[[comments]]
