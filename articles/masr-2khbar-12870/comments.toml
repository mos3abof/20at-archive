subject = ""
author = "االهدف واضح"
posted = "2009-08-08"
text = "نشر الزبالة فى كل مكان وبكمية كبيرة<br />حتى تتوطن الامراض فى بلدنا مثل التيفوئيد وانفلونزا الخنازير وانفلونزا الطيور<br />والناس تموت<br />وعدد السكان يقل<br />شوف بقى التخطيط الاستراتيجى للسيد اللواء المحافظ<br />تقليل عدد السكان<br />ربنا معاكم"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809145807/http://www.20at.com:80/masr/2khbar/12870-2009-08-08-06-34-21.html"
