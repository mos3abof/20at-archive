[[comments]]
order = 40
subject = "والله حرام"
author = "عزيز المصرى"
posted = "2006-11-02"
text = "والله حرام عليهماللى بيعملوه فى مصر والناس المساكين اللى عايشة مش عارفة فين الحقيقة اذا كان ده حال اعضاء نواب الشعب طيب يبقى الناس معزورة تقطع فى بعضها وتستحل كل المحرمات ..<br />طلعت السادات عارف كويس جدا ان مجلس الشعب اوسخ من الخمارة ومغارة على باباطيب ليه لو عنده مستندات فعلا تبين مصادر الفساد والذين استغلوا مناصبهم فى مص دماء الناس ينشر المستندات دى فى الصحف علشان الناس تعرف ويستمر فى النشر سواء هو او غيره ممن يدعون حبهم للبلد لكن كلام على الفضائيات وبس ده بيسبب حالة من الفوضى بين الناس واحنا مش ناقصين الله يخرب بيت ابوهم ..<br />كلام فى كلام ماشفناش واحد مصرى بجد يطلع ويقول هى دى مستندات الفساد شوفوا ياناس ازاى بلدكم بتتسرق ..<br />الله يرحمك يا ناصر الله يرحمك يا سادات كل واحد فيكم ترك بصمة فى وجدان الشعب المصرى اما الموجدين حاليا واللى حواليهم واللى منتظرين دورهم سرقوا البصمة ودفنوا الامل وقتلوا المستقبل فى عيون الناس 0<br />والنتيجة الجزمة اصبحت اداة من ادوات الحوار .<br />الله ينتقم منكم ومن كل انسان استحل البلد والناس ربنا يخلصنا منكم بالقتل او الاغتيال او الموت من عنده مش مهم والسبب طبعا الراس الكبيرة اللى ميت على الدنيا ومش عامل حساب يوم السؤال من رب العباد"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117202307/http://masr.20at.com:80/article.php?sid=423"

