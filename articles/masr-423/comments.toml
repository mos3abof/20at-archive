[[comments]]
order = 12
subject = "يا رجال الرقابة الأدارية أستيقظوا"
author = "أبو العربى البورسعيدى"
posted = "2006-06-02"
text = "الأستاذ / طلعت السادات عندة كل الحق أنة يسأل ويتهم غول الحديد / أحمد عز من اين لة هذا ؟ قانون من أين لك هذا يطبق على الصغار بس لكن الكبار محصنين ومحميين ... وأراهن بعمرى لو الرقابة الأدارية واللواء / حمدى راشد بص لأحمد عز وقال من أين أتى بثروتة ؟ فسيحال للتقاعد حالا , يا رجال الرقابة الأدارية الأفاضل من فضلكم تحروا عن مصادر ثروة أحمد عز وقدموة للكسب غير المشروع وأن كنت أشك أنكم لن تفعلوا لأن المية ما بتجريش فى العالى وأنتم بس فالحين تجروا وراء موظف غلبان أو تاجر رقيق الحال وتعملوا لة قضية ... أتقوا اللة فى انفسكم يا رجال الرقابة الأدارية .... لقد أثرى أحمد عز على حساب الشعب بمساعدة كبار المسئولين فى الدولة وأتت ثروتة من طرق غير مشروعة أهمها المضاربات والقوانين الحمائية التى تفرض على الحديد المستورد فى صورة رسوم أغراق وغيرها وفى المتاجرة بالأراضى المملوكة للدولة وغيرها كثير .. وليعلم المسئولين أن غدا لناظرة قريب وستأتى ساعة الحساب ولن يرحم الشعب كل من أساء الية وأستباح أموالة وثرواتة ."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614142622/http://masr.20at.com:80/article.php?sid=423"

[[comments]]
order = 13
subject = "جزمه ياااااا دنيا جزمه"
author = "الاستاذشيكو"
posted = "2006-06-02"
text = "هى الحكايه ايه بالظبط كده وعلي بلاطه<br />الواحد عامل زى مايكون اطرش ف الزفه<br />هو صناعه الجزم هاتنضرب ولا ايه<br />المرشد بيقول بالجزمه (سواء كان صح ولا غلط)<br />والسادات هايضرب الحرامي عز بالجزمه<br />والحكومه فعلا بتضرب الناس بالجزمه<br />باقي ان الجزمه هى اللي تنضرب يا ناس اختشوا وخلوا عندكم دم بقه<br />الجزمه دى اشرف من ناس كتير اوي ومن حقها انها تختار اللي هاتضربه عشان ماتتوسخش بيه<br />يعني السادات كان يرفع الجزمه ويسبها اما تضرب العز او حتي فتحي شرور<br />يعني هي اللي تختار<br />ونفس الشىء للمرشد المناصرين له يرفعوا الجزم في وش الحكومه واللي يقرب ينضرب<br />ناااااااااااااااس معندهاااااش جزم"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614142622/http://masr.20at.com:80/article.php?sid=423"

[[comments]]
order = 14
subject = "اضربةالف جزمة"
author = "نور الغد"
posted = "2006-06-02"
text = "يستاهل الف جزمة وجزمة وجزمة لحد ميقول حقى برقبتى ويغنى انا بكره الجزمة وبحب الشبشب احنا فى عصر الحرامية نهبوة اموال الشعب الفقير مش عارف يشترى جزمةوالواحدمن الحرامية عندة الف جزمةوجزمة تحية للاستاذ طلعت السادات الصديق العزيز لزعيم الغد الدكتور ايمن نور الصابر على قضاء اللة وعلى الظم والاستبداد<br />وان اللة مع الصابرين ولك الحرية يا ابو شادى و نور والتحية للاستاذة جميلة اسماعيل"
