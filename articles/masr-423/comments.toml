[[comments]]
order = 42
subject = "ياريته قطعه بمطواه"
author = "نديم"
posted = "2006-11-04"
text = "أتعجب من هؤلاء اللصوص أنعدم الدم من وجوههم يقيموا الدنيا على رفع الجزمة على لص يرتع في مقدرات الدولة احتكر حديد التسليح وخلي الشعب الغلبان بكل طوائفه لا يستطيع تشطيب شقة تؤويه وللأسف يسانده أو شريك له المحترم جمال مبارك الذي يتحدث كرئيس دولة ويصدر قرارات وليست له أي صفة ، كأننا عزبة أبوه أو الأبعديه التي ورثها عن أبيه ، وطبعا أحمد عز واحد من الحيتان الذين ملكوا مصر واستعبدونا بدون صك عبودية ، في حكومة رجال الأعمال ، وزير الصحة يملك أكبر مستشفيات استثمارية ووزير السياحة يملك أكبر شركات سياحية وهلم جرا وزعت الدولة بالشعب على هذه العصابة وزير وفي نفس الوقت في مجلس الشعب وفي نفس الوقت يملك أكبر الشركات في الدولة والتي معظمها ناتج عن خصصة القطاع العام أو التبرع به لهؤلاء ، فهل تنتظرون في هؤلاء خير ، ياجماعة الدولة ضاعت وانتهت ولا تحاولوا تعب أنفسكم ، طول ماعندنا جهاز شرطة لا خلق ولا دين وحياء ولا انسانية يحمي هؤلاء ويساندهم ويطارد الأطهار والشرفاء ،"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117202307/http://masr.20at.com:80/article.php?sid=423"
