subject = "وماذا بعد الكلام"
author = "محمود محمد"
posted = "2006-10-12"
text = "اولا يسلم الاستاذ طلعت السادات ثانيا ايه الى بعد الجزمة وبعد الكلام ده كله ياترى فيه حاجة بتحصل ياترى السيد رئيس الجمهوريه عياخد موقف مع احمد عز ولا مع طلعت السادات؟ سأقول انا لكم السيد رئيس الجمهوريه عياخد موقف مع طلعت السادات ويمكن الراجل يدخل السجن واكيد عيدخله علشان يبقى عبره ومحدش يفكر بعد كده يتكلم على اى حد من صحاب اولاده وده طبعا حقه علشان احمد عز واكل مع علاء وجمال عيش وملح فهمين يعنى ايه واكلللللللين عيش وملح"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117202307/http://masr.20at.com:80/article.php?sid=423"

