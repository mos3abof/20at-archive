[[comments]]
order = 15
subject = "كلهم ولاد وسخة عايزين الضرب بالجذمة الوسخة"
author = "كلهم ولاد وسخة عايزين ضرب بالجذمة من حديد .."
posted = "2006-06-02"
text = "حرمية أفاقين ، سارقي أموال الشعب<br />لكن بيسرقوها بالقانون بنهم وبين بيعض<br />بورق رسمي مضروب ..<br />اكبر حرمية .. سرقوا مال الشعب المسكين<br />كل كلب في مجلس الشعب ومجلس الشوري<br />وفي كل دوائر الدولة والحكومة الظالمة<br />كلهم حرمية حرمية حرمية .<br />اللهم غسلهم في حميم جهنم ولا ترحمهم<br />وأرنا فيهم عجائب قدرتك .<br />مصوا دم الغلابة ، تاجرو بصحة الناس<br />حأقول أية ولا اية<br />اذا كان الكبير ابن كلب جذمة<br />ابو الحرامية كلهم على مستوى العالم ."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614142622/http://masr.20at.com:80/article.php?sid=423"

