[[comments]]
order = 20
subject = "مصر بلد الفسد والمفسدين"
author = "بكر"
posted = "2006-08-13"
text = "اولا الكل يعرف ان حسن حمدي والخطيب وشوبير ومجدي عبدالغني وسمير زاهر حرمية كبر جدا ولا ينفع ان الشريف مرتضي منصور يعيش في وسط كلة حرمية وفاسدين وهو يرد الصلح العام لكن مصر بلد الرقصين والفسد والكل يعلم الفسد فية والظلم واخير الظلم الذي وقع علي مرتضي من الخبيث حسن صقر الخائن لبيتة بتاع العزومة علي حساب ممدوح عباس ولنا تنصلح حال مصر طلما فية المفسدين الذين يجعلون نفسهم شرفاء وحسبن الله ونعم الوكيل"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
