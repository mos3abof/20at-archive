author = "كتيبه"
posted = "2006-05-31"
text = "جنا ابى عليه ان اولدفى هذاالزمن لاري بعينى مجموعه من اللصوص تحت انقسام من يسرق مديا وفكريامن الناس ما بين مؤيد لهذا ومعرض لذك - وان كان رب البيت بالدوف ضربا مبارك عليكم"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 14
subject = "مرتضي علي خطأ"
author = "AHMED MESBAH HESSEIN IBRAHIM"
posted = "2006-06-25"
text = "انا أري ان لا يجب انه مرتضي منصور يسب ويقذف حسن حمدي وباقي أعضاء النادي الأهلي وأنا أري انه يجب محاكمة مرتضي بالبلطجه.وأيضا ماذا عن ملفات الفساد التي قرأت عنها يجب النظر أيضا في تلك القضيه."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 15
subject = "مرتضى سيد كل الاهلوية"
author = "بدر بيبو"
posted = "2006-07-14"
text = "من الاخر كده كل اللي عايزه العلوج او اليهود او الهنود الحمر بعيد عن عنيهم انشاء الله مرتضى هيفضل لحد ميتسجن الحرامية منم المثال حسن حمدى القرد والخطيب الخنزير وشوبير المقرف"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 16
subject = "المستشار والحمار"
author = "سيف الدين"
posted = "2006-07-18"
text = "الأخوة الأفاضل مش عارف أيه بالضبط إلا خلنى أروح هلى هذه الصفحة ولكن هذا الموضوع الشيق الذى كتبت عنه من قبل فى الكثير من المواقع ومش مشكلة برده إن الواحد يقول رأيه عندكم دام فضلكم<br />بداية المستشار المحترم مرتضي منصور يمثل دور الضابط<br />حسن حمدي والخطيب وشوبير وعدلي القيعي ومدحت شلبي أفراد العصابة<br />الكابتن عصام عبد المنعم شيخ المنصر أما زعيم العصابة فهو إكس<br />المهم علشان الفيلم يكمل ويتم سرقة مصر لابد من الإستعانة بالرجل الكبير وشلته المهم من الأخر دا فيلم كبير وفى النهاية قبل كلمة الختام ستكون نهاية الأدوار على النحو التالى<br />حكمت المحمة حضوريا على مستر إكس بلإعدام شنقا بتهمة الخيانة العظمى وبيع البلاد والعباد<br />المتهم حسن حمدى وشريكة إبراهيم نافع بالأشغال الشاقة المؤبدة وبرد جميع المال الحرام الذى إستولوا عليه<br />القفه السجن 14 سنه مع رد المال الحرام كذلك الذى إستولى عليه<br />الشوبير تطبيق حد الحرابه فى الإسلا م عليه لتدميره الأندية المصرية هو ورئيسه السمير باهت<br />أما القردين مدحت شلبي ومجدى عبد الغنى وعدلى القيعى وعصام عبد المنعم فالحكم بالبرأة لثبوت إختلالهم العقلى<br />والسلام ختام<br />وبالروح بالدم نفديك يا مرتضي وبالروح بالدم نفديك يا مرتضي بالدم نفديك يا مرتضي وبالروح بالدم نفديك يا مرتضي وبالروح بالدم نفديك يا مرتضي بالدم نفديك يا مرتضي وبالروح بالدم نفديك يا مرتضي وبالروح بالدم نفديك يا مرتضي بالدم نفديك يا مرتضي وبالروح بالدم نفديك يا مرتضي وبالروح بالدم نفديك يا مرتضي بالدم نفديك يا مرتضي"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

