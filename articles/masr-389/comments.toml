[[comments]]
order = 2
subject = "حسن حمدى ..ابراهيم نافع رايح جاى"
author = "سالم"
posted = "2006-05-28"
text = "دى حلاوة روح قبل حسن حمدى مايشرف ه البورش مع شريكه ابراهيم نافع...ملايين نهبوها سوا...ولان مرتضى لسان امه مبرد وعاوى منظرة...لكمه مش حرامى..واسألوا مصطفى بكرى"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "يااااااااااا بق ع الفاضي"
author = "الاستاذشيكو"
posted = "2006-05-28"
text = "اللي مش منصور كلام في كلام عامل فيها شريف ونزيه وبتاع الغلابه وهو خرج من القضاء بفضيحه ده ليه ابن ظابط وبنت متجوزة وكيل نيابه والبت التانيه في حقوق هاتخش النيابه غصب عن الكل<br />ده بقاله سنتين عمال يقول هايحبس ده وهادخل ده السجن وانا هادب دة كان البلد بتاعه ابوة<br />جاتكو القرف ماليتو البلد<br />وهوة ممعاهوش غير طوله اللسان وقله الادب والقيمه ربنا يهديالكل"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "مرتضى ..وملف نفسه"
author = "مصرى جدا"
posted = "2006-05-29"
text = "هؤلاء هم نجوم المجتمع كما تقولون والبلد كلها مستواها فى الحضيض وسب وسحل وأعتقال واهانة قضاه وتزييف للحقاق ألخ..........<br />وأصبح هذا الفساد فى مصر شىء عادى"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "اللي اختشوا"
author = "بسمه"
posted = "2006-05-29"
text = "صحيح الي اختشوا ماتوا مرتضي اللي لسانه فالت وحكايه الفانله البيضا والكلام الفنكوشي اياه نسخه مكرره من الفانله الحمرا كلهم في الهم اخوات لكن حسن حمدى مش بتاع كلام ده ايده تتلف فى حرير العمولهوالسمسره وشركه الاحبار ارقام صادرة عن الجهاز المركزى للمحاسبات حاجه كده تخليك عزيزى المواطن تشعر انك بتتسرق تحت شعارات القيم والاخلاق وطبعا كل ده بفضل فساد الصحافه والمحرريين الرياضه اللى بيقبضوا علشان الشعب يتسرق ويشجع اللعبه الحلوه"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "اتقوا الله"
author = "واحد قرفان"
posted = "2006-05-30"
text = "يا اخونا اتقوا الله ولا تلوثوا ألسنتكم بأعراض الناس والهمز واللمز على مخاليق الله حكمتم إن حسن حمدي حرامي وبيسرق اموال الأهرام والقضاء مازال يبحث قضية مصطفى بكري ولم يحكم فيها بعدفمن العدل مع النفس ومع الآخرين عدم إطلاق الاتهامات جزافاً وحنلاقيها من مين ولا من مين<br />والله مرتضى لو ما ظهرش في الإعلام أزعل واتضايق ما في خبر نشر عنه إلا وقرأته وهو شخصية رائعة وظريفة عسل يا مرتا"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "تخيل"
author = "الديب سرحان"
posted = "2006-05-30"
text = "قبل نا تشتم مرتضي ...وتعيب في سيف ودرع الزمالك سابقا...دلوقتي الزملكاية مقضينها امواس...<br />غمض عنيك وتخيل شكل الدنيا من غيره ...تخيل الزمالك من غيره ...مصر حواء العالم (مش ام الدنيا)..من غيره وابقي اتكلم<br />امضاء زملكاوي قديم<br />ومش باحب مرتضي"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "مرتضى وملف نفسه"
author = "المتمرد"
posted = "2006-05-30"
text = "مرتضى ده مينفعشى يمسك اى سلطة فى اديه لا نه عصبى وده مش من صفات رجل سياسى ده مكمن يبقى عربجى مينفعشى يمسك رئيس نادى الزمالك لانه نادى محترم ورئيسه غير محترم زيك كده يامرتضى"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "هكذا تكون الصفوة والتعليقات"
author = "عادل حسين عبدالغفار"
posted = "2006-05-30"
text = "الحق دائماقوى وصوته عالى وانااشاهد الاستاذمرتضى فمهنته طبيعتهاالمشاكل لكن عندما يصل الحوارالى هذا المنحدر والتعليقات هناتصل الى الغوغائيةواحترامى للقضاء الحصن الاخير للامة وجب عليناان لانقلد الصفوة فى الحوار مع احترامى لللاستاذ مرتضى والكابتن حسن"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

