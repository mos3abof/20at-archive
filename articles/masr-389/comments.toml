text = "انا معايا مستندات فساد لكل واحد علي كوكب الارض والمريخ والمجموعة الشمسية والمجرة كمان<br />انا معايا ملفات فساد لكل مخلوق في السجن من اصغر جردل لاكبر راس<br />حد شاري"
