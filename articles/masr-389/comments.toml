[[comments]]
order = 11
subject = "حسن سبانخ"
author = "ابو شريف"
posted = "2006-05-31"
text = "يهوي المستشار مرتضى منصور الصحافة والاعلام والكاميرات ويبحث أن يجد لنفسه أي دور ليكون في بؤرة إهتمام الناس ولا أريد أن ادخل في متاهات دخله المادي أو أي شئ من هذا القبيل حتى لا أشيل ذنب ولكن من ناحية الألفاظ فأنا أرى أن سيادة المستشار في أشد الإحتياج الي من يظبط له تيل فرامل لسانه حتى يستطيع أن يتحكم في إنفعالاته ... علي العموم حسن سبانخ سوف يتولى رئاسة نادي السجون علي يد النادي الأهلى وجماهيرة وهذه خدمه تقدم لنادي الزمالك أيضاًًُ ليستريح من المشاكل وخدمه لحسن سبانخ حتي يجد الوقت الكافي للإطلاع علي ملفات الفساد التي معه والخاصة بالشعب المصري كله"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 12
subject = "الاهرام و فساده"
author = "ما بحبش الاهلى"
posted = "2006-05-31"
text = "اليس حسن حمدى من الاشخاص المتهمين قضية الفساد فى الاهرام ,<br />بلى هو من الاشخاص المتهمين و معه تابعه قفه {الخطيب} فهو من اكبر الحراميه الموجوده فى البلد ومعه شيخ المنصر ابراهيم نافع<br />ه>ا هو حال الاهلويه,رجال المبادئ والاخلاق طططططططططططططططططظظظظظظظظظظظظظظظظظظظظظظفى الاهلى"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113018/http://masr.20at.com:80/article.php?sid=389&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
