subject = "انا قرفان"
author = "انا قرفان"
posted = "2006-10-25"
text = "اول انا اول مرة اقرء اللموضوع ده والتعليقات بتاعته<br />ثانيا : معلومة جديدة من الاخ / طيف بدر ويا ريت يتحفنا بالمصدر اللي جاب من المعلومة دي ان ثلث فلسطين كانت تابعة للمملكة المصرية<br />ثالثا :لا احد ينكر دور كبار قادة منظمة فتح < انا بقول كبار القادة مش الشباب ><br />دورهم في قمع الانتفاضة التي اتت بهم الي سدنة الحكم ودورهم في ايلول الاسود ودورهم في الحرب الاهلية في لبنان<br />حتي ابوعمار نفسه<br />مشكلتنا كلنا ان احنا معنديناش قادة رجال معظمهم عملاء والقائد اللي بجد ممكن يغتال في اي لحظة اما العميل يظل مكانها الي ان يتوفاه الله او يصبح كارتا محروقا<br />رابعا : اللي بيحصل في الاراضي المحتلة جزء من المخطط الامرياسرائيلي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"
