posted = "2006-10-03"
text = "حركة فتح طول عمرها فيها عملاء و ياما اعتقلوا مسئولي حماس عشان يرضوا الإسرائيليين و عمر ما الإسرائيليين قطعوا عنهم الضرايب لأنهم بيوافقوا على كل التنازلات اللي بيعرضها الإسرائيلين<br />ودلوقت أول لما فشلوا في الإنتخابت التشريعية بيحاولوا يصعبوا الأمر علي حماس...............حسبي الله ونعم الوكيل<br />ربنا معاكم يا حماس"
