[[comments]]
order = 1
subject = "جنون فتحاوى"
author = "ياسر ابو عمار"
posted = "2006-10-03"
text = "لا ادرى سببا لهذا الجنون الفتحاوى الذى كان نتيجة غير متوقعة لرسوبهم فى الاختبار الذى اجتازوه امام الشعب الفلسطينى ،وارى ان فتح رسبت مرتين كانت اولاهما فى صناديق الانتخابات وهى خسارة لا تشين اى فصيل سياسى ،لان السياسة فائز ومهزوم ،اما السقوط المروع فكان الخسارة فى تقبل النتيجة والاقتناع باختيار الجماهير ،وهو الامر الذى فشلت فيه فتح بامتياز ،اذ اكتشف الشعب الفلسطينى ان الفتحاويين فضلوا الانتقام على مصلحة شعبهم الذى يتغنون منذ عشرات السنين بانهم الممثل الشرعى والوحيد له ،الا ان الاعتداءات والتفجيرات التى قامت بها عناصر فتح لم تكن الا شهادة وفاة لتنظيم كان وطنيا اما الان فهو عبارة عن ميليشيات رافضة لارادة الامة ،واقفة امام حصول ابناء شعبها على القوت الذى يحميهم من الموت ،الف خسارة على فتح وافعالها التى لم تضف لهم الا كل احتقارعربى واستياء اسلامى ورفض عالمى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"

