text = "دحلان: كلب حقير نذل حرامي سراق كذاب ابحثوا عن اي كلمة في كل القواميس معناها سيء لا تعطيه حقه (شارون نفسه اشرف منه)والرجوب وعريقات ونبيل عمرو ةاحمد عبد الرحمن والعزام.................الله ينتقم منهم انشاء الله"
