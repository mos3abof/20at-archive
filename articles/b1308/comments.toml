[[comments]]
order = 14
subject = "الاعتذار للمصريين واجب"
author = "من غزة"
posted = "2006-10-05"
text = "الي بينكر فضل المصريين ومصر على الفلسطينيين (والغزاويين بالذات) بيكون ناكر للجميل ,, يكفي تعاطف الشعب المصري ودعواتهم لنا بكل وقت ..<br />وآخر الاحداث الي تستوجب الاعتذار للمصريين :حادث الاعتداء على خط الكهرباء من مصر لرفح ,, بجد حاجة تكسف وبأعذر للشعب المصري كله على وجود حفنة من الاغبياء تخرب على الجميع..<br />ربما تعامل العسكري والضابط المصري على الحدود في معبر رفح تكون احيانا ادنى من التعامل مع البشر ,, لكن الشرطة عنيفة حتى مع الشعب المصري نفسه,,"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"

[[comments]]
order = 15
subject = "إلى حاجة تقرف..."
author = "طيف بدر"
posted = "2006-10-05"
text = "حرب 48 : كان ثلث فلسطين تابعا للمملكة المصرية آنذاك و كان من الضروروي مواجهة السرطان الصهيوني منذ بدايته<br />حرب 56 : إنجلترا و فرنسا و إسرائيل هجمت على مصر بعد تأميم قناة السويس<br />حرب 67 : أظن عارف !!<br />حرب 73 : أظن إسرائيل كانت في سيناء<br />لو حكومة مصر دلوقتي عايزة تساعد الفلسطينيين كانت دعمت حكومة حماس \" مش لازم يديهم فلوس\" الخير كتير عندهم و الحمد لله و ربنا يبارك رجال حماس بس متساعدش أمريكا و إسرائيل و زبالة فتح و تعامل وزراء حماس كوزراء محترمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"

