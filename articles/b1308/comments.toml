[[comments]]
order = 9
subject = "رد عندما يكون اغلب المعلقين فشله"
author = "شاهد عيان"
posted = "2006-10-04"
text = "يا اخي عمرها فتح ما كانت تعمل شيء من النضال اسمحلي احكيلك، فتح فظحتنا بلبنان قتلوا بعضهم، قتلوا الشريف ابو جهاد فيهم. واخذوا يفعلون المنكر والفواحش في لبنان وسوريا ايضا، ولذلك ما زال الفلسطينيون من اهل الضفة والقطاع الى الان ممنوعون من زيارة سوريا ولبنان.<br />فتح طالما كانت وستظل تعمل العام لابناء شعبها، وهذه الايام تثيبت ذلك."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"

[[comments]]
order = 10
subject = "حاجة تقرف"
author = "رد على الأخ شاهد عيان"
posted = "2006-10-04"
text = "يعني الاخ شاهد عيان ملقاش حد يشتمه في بلده فقعد يشتم في المصريين ؟! عملوا لك ايه المصريين يا خويا ..ماانتو كل يومين تدخلونا و تعكونا في حروب ملناش فيها مصلحة ...كل ده و المصريين ملهمش قيمة عندكو ..لكن تروحوا تبوسوا جزم الخليجيين ..يا اخي جتكوا خيبة ..روحوا شوفوا خيبتكم و ابقى حررها لوحدك<br />كل واحد عاجز وضعيف مش قادر يعمل حاجة ..يقوم يشتم في مصر و المصريين علشان يعمل فيها الواد بيفهم في السياسة ..فعلا بقت حاجة تقرف الفلسطنيين مبقوش قادرين يخفوا حقدهم على المصريين بشكل فظيع..و الدليل شوفواأسافين الفلسطنيين في المصررين في الخليج..الفلسطنيين كل هدفهم يقطعوا عيش المصريين ..روح يا اخي انت متفرقش عن الصهاينةكتير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"

[[comments]]
order = 11
subject = "اللهم اهدي فتح فإنهم لا يعلمون"
author = "طيف بدر"
posted = "2006-10-04"
text = "بالنسبة للأخ صاحب تعليق \" حاجة تقرف\" : إيه هي الحروب التي خضناها من أجل فلسطين ؟ ضحكوا علينا بالكلام ده. كل الحروب التي خضناها ضد إسرائيل لأن أراضينا كانت محتلة و لم تكن من أجل فلسطين<br />بالنسبة ل\"صيع\" فتح : كانت فين جرأتكم و اليهود اجتاخوا غزة؟ قلعتوا هدومكم و سلمتوا سلاحكم لليهود<br />كان أولى بيكم إن \"صياعتكم \" دي كلها تطلع على اليهود و الأمريكان اللي محاصرينكم مش على حكومتكم المعتقلة في سجون العدو \" بتواطؤ منكم\" و التي لا يزال أفرادها يركبون سيارات الأجرة<br />و كل الشغب الي بتعملوه دلوقتي بعد رجوع أبو مازن من عند حبايبه في واشنطن<br />لامؤاخذة : أن تكون عميلا لسوريا و إيران خيرل من أن تكون عميلا لأمريكا و إسرائيل : هذا إن كانت حماس عميلة لسوريا و إيران من أصله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"

[[comments]]
order = 12
subject = "ريما"
author = "يا اخوان مش هيك النقاش بصير"
posted = "2006-10-04"
text = "بعدين هو احنا العرب ديما هيك الجمل لما يقع بتكثر سكاكينو على طول بننسي تاريخنا؟<br />بعض فصائل فتح عم تغلط هاد مش مبرر نمحي تاريخها المشرف بالنضال و نحكي عنها بهالطريقة.. شو فضحوك بسوريا و لبنان؟ .. و مين الي قتل الشهيد ابو جهاد؟..فتح؟..اقرا تاريخك بعدين علق.. بعدين شو دخل المصريين بالي بصير؟ بنتقاتل بين بعضنا بقوم نسب على جيرانا؟ ما كفاكم فرقة؟<br />و لاخ المصري انت مش هامك من القضية الا انو الفلسطنية بشتغلو بالخليج و بنافسوك؟ يا اخي الارزاق من الله.. و ما حدا بقطع عيش حدا.. و اطمن ما حدا قلقان في العمالة المصرية و بدو يروحها الرزق على الله<br />و يا قادة فتح تحركو بكفي تاركين كل واحد يشتغل على راسو<br />ابو لطف وينك؟ احكي اشي.. ما ضل كبير غيرك... ابو مازن حلها ان شاء الله بالاحكام العرفية... انا مع الاخ مطفي بدنا حاكم عادل مستبد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"

[[comments]]
order = 13
subject = "حاجة تقرف بجد"
author = "لا مؤاخذة الاخ اللي بيقول ان مصر محاربتش علشان فلسطين ..أومال 48دي كانت ليه..يعني تقصد ان مصر معملتش حاجة لفلسطين ولا للفلسطينيين؟"
posted = "2006-10-05"
