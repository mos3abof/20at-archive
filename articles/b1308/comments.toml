subject = "الله على الظالم"
author = "Albattar"
posted = "2006-10-10"
text = "بسم الله<br />و الله انا مش عارف هالفتحاويين ليش مش قادرين يتقبلوا خسارة الانتخابات الله يهديهم و اذا لم يرد هدايتهم يأخذهم و يخلصنا منهم.<br />و االله يأخذ بيدك يا حماس لانه ابناء حماس احرص من غيرهم على اراقت دماء المسلمين لانهم بشتغلوا من ناحيه شرعيه مش مصالح.<br />و الله الموفق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"

