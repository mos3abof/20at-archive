[[comments]]
order = 4
subject = "غزة مقبرة الأحرار"
author = "صطفى"
posted = "2006-10-03"
text = "إن ما آلت إليه الأمور مؤخرالا ينم سوى عن إفرازات التخلف بعد اكثر من خمسون عام من الإحتلال<br />فشعب يقبع تحت الإحتلال يواجه الفقر والتخلف والظلم لابد من تركمات وإفرازات للتخلف ال>ي واكبه وعاشه واصبح متأصل فيه وخاصة ف القطاع حيث يقطنه وهجر إليه ألاف الفلاحين والقروين وهم على مستوى متدني من العلم والثقافة<br />نحن نتحدث عن حماس وفتح وكانهم فصيلين مستقلين وننسى انهم من ابناء الشعب الفلسطيني وهم جميعم فلسطينيون<br />وقد وصل حد الغباء والجهل السياسي عند الفلسطينين البؤساء إلى ان ينتخبوا فصيل حماس فقط بنظرة انه الفصيل الحاكم بأمر الله دون النظر سياسيا لما تتوجبه المرحلة المقبلة واحتياجنا لرجل المرحلة وهاهي النتيجة نحن لسنا اهلا للديمقراطية ولابد من تربية الديمقراطيو اولا<br />نحن بحاجة إلى حاكم ديكتاتوري عادل يوجه شراعنا حيث يرى وحسب ما تقتضيه حنكته السياسية كالزعيم ابو عمار رحمه الله<br />أرجوكم يا عرب لا تسلكو مسلك انور السادات وعودوا إلينا وشاركونا قضيتنا فها نحن نتخبط ونغرق في افرازات تخلف اكثر خمسون عاما تحت الإحتلال واثريائنا الفلسطينيون يلهون ويعيشون حياة الترف ف اميركا واوروبا ونحن من ندفع ثمن لهوهم عندما نشبث بحق عودتهم وهم لا بدهم يعودوا ولا يحزنون<br />فلنقتدي بالصهيونية وقوميتها ووحدتها<br />عسانا ما نندم يوم ونصير نقتدي بالتوراة والتلمود"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"

[[comments]]
order = 5
subject = "كلنا ضد حماس"
author = "حماس زى إسرائيل"
posted = "2006-10-03"
text = "السبب ىف أزمة حماس<br />أن كلنا ضد حماس<br />فتح , السلطة الفلسطينة , مصر , دول الخليج , الاردن , طبعا إسرائيل و أمريكا<br />و أزمة المرتبات متعمدة و مقصودة من دول العالم و الدول العربية متواطئة معهم من أجل زنق حماس فى خانة اليك مع الشعب و اظهارها فى شكل ضعيف غير قادر على اطعام شعبة<br />و لو فتح بتاكل الفلسطينيين من الشحاتة من الاتحاد الاوربى و امريكا<br />فحماس فشلت فى جلب قوط للفلسطينيين من اموال المسلمين و العرب<br />ودى اللى هايجننى<br />راحت فين فلوسنا اللى اتبرعنا بيها و راح فين رقم التبرع لحساب جامعه الدول العربية و فلوس مؤتمر القمة العربى<br />راح فين كل ده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"

[[comments]]
order = 6
subject = "من غزة"
author = "احنا في غزة بلوم الطرفين .. انا واحدة من الناس مش منتمية لفتح ولا لحماس ,, لأن الاتنين في النهاية على ما يبدو همهم على السلطة وكل طرف بيحابي ابناء حزبه .. اما باقي الشعب الي مش محسوب على اي من الحزبين هو الي خسران .."
posted = "2006-10-04"
text = "الفرق ان دول بيصلوا ودول ما بيصلّوش (مش تعميم طبعا).. وطبعا انت ممكن تقبل الغلط من واحد مش متدين ولكن غلطة المتدين بتكون بألف وو ده الفرق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"

