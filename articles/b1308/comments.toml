text = "صًراع فلسطيني اسرائيلي ولا صرع فلسطيني فلسطيني ؟؟<br />غريبة انو الصراع اتحول لصرع<br />وصار في صرع عند اكبر فصيلين اصيبوا بداء الكلب<br />والكلاب فلتت ع المواطنين ف الشارع<br />واصبحت القضية صرع فلسطيني فلسطيني<br />يوم أن حدث اول اشتباك الأسبوع الماضي وفي الساعة الثامنة مساء وبينا كنت اصول واجول ف شوارع غزة بلا هدف , فجعني ما رأيت<br />فانقلبت الحاويات على رؤوسها انصاف الطرف وحمدا لله انها كانت فارهة فقضية الرواتب جعلت الشعب يأتي على الأخضر واليابس من فرط الجوع<br />وكانت طرق رئيسية مغلقة...وضع لافتات كبيرة بمثابة سدود<br />والشوارع خاااااااالية<br />وعند كل مفترق طريق تجد جموع من المرتزقة المشلحين (يعني المسلحين)<br />لأنهم شلحوا وطنيتهم لما رفعوا سلاحهم ع بعض<br />وكان من فوقي اسراب من البوم والخفافيش<br />بكثرة إز انها تكثر ف الظلام<br />وفعلا كان الظلام حالك بعد ان طقعت الكهرباء عن معظم المناطق<br />حقا عرفت كيف تكون ميدنة الأشباح<br />انها غزة مقبرة الأحرار<br />فإن هجرت غزة زلك دليل ان لا سكان فيها<br />نحن انصاف بشر نسكنها والعجيب انو بنتف ف البير اللي بنشرب منه<br />حقا ما يحدث فاجعة<br />أتلك غزة ؟ انحن الفلسطينيون ؟<br />عجبي مما صنعت يا الجهل...<br />ولكن لما تمحورت القضية لصرع ؟ ومن أين قفزت إلينا تلك الكلاب الضالة ؟ من مربيهم ؟<br />ووسط من يعيشون ؟<br />انحن بحاجة لسياسي محنك كالزعيم الراحل ؟<br />أم حاجة لصياد كلاب ؟<br />انستعين بالشيطان كي يخلصنا منهم ؟<br />إن ما آلت إليه الأمور مؤخرا لا يبشر سوى بالركود السياسي علي صعيد مقاومتنا<br />فلن نتقدم خطوة واحدة<br />ايتها الكلاب الضالة من اي حجر او زق او فصل<br />عودي ادراجك وارحلي بعيدا<br />فغدا اسود الثورة تهب<br />رياح المقاومة الفكرية الثقافية ستشتعل<br />ثوار فلسطين والعرب قادمون وأحرارهم كأمثال الحسيني وابو اياد وابو عمار وابو الهول وابو جهاد كلهم عائدون...<br />اسود فلسطين عائدون ايتها الكلاب الضالة فاحزري<br />تبت يداكم إن حملت السلاح علينا<br />أيها الشعب حازر ...فمن الكلاب يتحدث العربية..<br />إن القدس لم تسقط عام ال48<br />ولم تسقط عام ال67<br />بل انها تسقط الن على ايدى الأقتتال الداخلي<br />وحسبي ربي على فتح وحماس و على كل شاهد اخرس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125833/http://www.20at.com/article2.php?sid=1308"

