author = "اسم مبارك"
posted = "2009-07-19"
text = "فى معظم قرى مصرى فى الوجة البحرى تجد كم بيت او عيلة اسمهم عيلة مبارك وعادى جدا تلاقى عبد اللطيف مبارك وعبد اللة مبارك وهم فلاحون عاديون جدا<br />والاسم دة مش قاصر على بلد الريس بس فى كل حتة عيلة مبارك ولا رابط بينها اطلاقا<br />فتشابة الاسماء وارد جدا<br />يعنى واحد صاحبى كان مسافر فى المطار مسكوة علشان اسمة مطابق لاسم الشيخ عمر عبد الرحمن المعتقل فى امريكا بتاع الجماعات وقعد محجوز فى المطار ساعتين لغاية ما طلع ان فية فرق فى اسم الام وفرق فى تاريخ الميلاد<br />عادى جدا"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805232421/http://www.20at.com:80/masr/ebn-balad/12688-2009-07-18-12-33-40.html"

