author = "شعب فاشل"
posted = "2009-07-18"
text = "انت بتقول في مقالك ان صاحب الصورة دا اتصل بمحل كباب وقا<br />* عايز فرخة مشوية ونص كيلو كباب وكفتة<br />انت عارف دول تمنهم كام<br />لا يقل عن 100 جنيه بالميت<br />والراجل بتاع الصورة دا باين حالته تعبانه اوي يا دوب عليه نص كيلو كشري وقرصين طعمية وبالعافية كمان<br />والله لما تكتبوا مقالات ما تفبركوهاش خلو الكلام فيه عقل شوية ومطابق للواقع<br />سلام يا صاحبي<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــتت<br />مش احمد الهواري ولا عبدالله الطحاوي"
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719094959/http://www.20at.com:80/masr/t7kyk/12688-2009-07-18-12-33-40.html"

