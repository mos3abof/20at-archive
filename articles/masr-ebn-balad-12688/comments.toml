text = "واية يعنى تشابة اسماء<br />هو اسمة لا مؤاخذة محمدبن عبد اللة ابن عبد المطلب<br />تشابة اسماء بين مواطنين مصريين عادى جدا ومكرر ولا يجلب كل تلك الهيصة واللى هيسمع اسمة هيتريق علية<br />يعنى جيتو فى حاجة عدلة جتكوا نيلة فى تفكيركم الهباب"
