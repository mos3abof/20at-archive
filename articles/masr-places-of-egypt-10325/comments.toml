subject = ""
author = "امة الله المصرية"
posted = "2008-10-23"
text = "جميل جدا و كامن في محاولة لعمل فندق للنساء فقط في دهب و شرم و لاقت الفكرة اقبالا هائلامن الاجنبيات قبل العربيات و لكن مع الاسف لم يتم<br />علي كل ايه عنوان الكافية ده لو سمحتم؟<br />و زي ما نجحت فكرة عربية في الترام للنساء فقط و كافيه للنساء فقط و ياريت تبقي في فنادق للنساء فقط<br />ستنجح الفكرة انشاء الله خاصة بالنسبة لمجتمع يتيح الفرصة لرجاله للتحرش بالنساء و يستدير حتي امناء الشرطة عن حماية النساء فيه فهذا من افضل الحلول"
archived = "2009-11-15"
capture_url = "https://web.archive.org/web/20091115170944/http://www.20at.com:80/masr/places-of-egypt/10325-2009-06-09-20-07-39.html"

[[comments]]
order = 1
subject = ""
author = "مش ححبك8"
posted = "2008-10-23"
text = "يا حبيبي التحرشات الجنسية بين الذكر والانثى افضل كتير من تحرشات المثليين<br />اذا تم فصل الجنسين عن بعض سيظهر تحرشات السحاقيات واللواطين<br />بطلوا هبل وعبط بأه<br />دريمة الزنا بين الرجل والمرأة اخف كثير من جريمة اللواط او السحاق فهي جرائم مشينه<br />هذؤا رأيي"
archived = "2009-11-15"
capture_url = "https://web.archive.org/web/20091115170944/http://www.20at.com:80/masr/places-of-egypt/10325-2009-06-09-20-07-39.html"

[[comments]]
order = 2
subject = ""
author = "الطموحة"
posted = "2008-10-24"
text = "فعلا حاجة مميزة جدا<br />وانا باشكرك جدا على الموضوع الجمييييييييييي ييل ده وياريت يكون فيه كتير من الحاجات<br />ده لأن الواحد زهق بجد من التعامل السخيف مع الرجال ومشكلات التحرش وكمان الواحد<br />مش بيعرف ياخد راحته في حاجة خالص<br />وعلى فكلرة الموضوع ده موجود في دول عربيه تانيه ،أنا رحتها بنفسي ،<br />بجد فكرة جميلة<br />واكتبي لنا عنوانه يا قمر ربنا يخليكي"
archived = "2009-11-15"
capture_url = "https://web.archive.org/web/20091115170944/http://www.20at.com:80/masr/places-of-egypt/10325-2009-06-09-20-07-39.html"
