author = "نفسي ادعيلك يا مبارك"
posted = "2010-03-08"
text = "حدعيلك من كل قلبي<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ<br />اللَّهُمَّ اغْفِرْ لَهُ وارْحَمْهُ وعافِهِ واعفُ عنْهُ وأكرمْ نُزُله ، ووسِّع<br />مُدْخلَهُ ، واغسلهُ بالمَاءِ والثَّلْجِ والبَرَدِ ، ونَقِّهِ من الخطَايا كَمَا<br />نَقَّيْتَ الثَّوبَ الأَبيضَ من الدَّنَسِ ، وأَبْدلهُ داراً خيراً من دارهِ ،<br />وأهلاً خيراً من أهله وزوجاً خيراً من زوجهِ وأَدْخِلْهُ الجَنَّةَ وأعِذْه من<br />عَذَاب القَبْرِ ومِنْ عَذَاب النَّارِ<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />يا رب يا رب"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309112531/http://www.20at.com:80/masr/hot-topics/15634-10-.html"

[[comments]]
order = 3
subject = ""
author = "10 وسائل"
posted = "2010-03-08"
text = "10 وسائل للتخلص من السمنه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />الريجيم الغذائي<br />المشي<br />التمارين الرياضية<br />الإبر الصينية الموضعية<br />الأدوية<br />أجهزة تقوية العضلات، والذبذبات الكهربائية<br />ا لموجات الصوتية<br />شفط الدهون<br />.. الجراحة<br />وقليلاً ما نلجأ إليها، حيث نستخدم المشرط في حالة الأرداف<br />المتضخمة، خاصة إذا كانت غير متناسقة تماماً، وبعد فشل محاولات<br />العلاج السابقة."
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309112531/http://www.20at.com:80/masr/hot-topics/15634-10-.html"

[[comments]]
order = 4
subject = ""
author = "مش من البرادعى"
posted = "2010-03-08"
text = "الوسائل العشرة المذكورة هى للتخلص من الشعب المصرى<br />فهم عايزين ارض مصر فاضية علشان يبيعوها تمليك لليهود والاجانب وكل اللى يدفع<br />دى لجنة سياسات برئاسة حاييم ابن شارون<br />البرادعى مش مهم يبقى رئيس<br />البرادعى عايز يحط اسس للحكم زى سوار الذهب بتاع السودان<br />وايمن نور عايز كدة برضة<br />نظام حكم بالانتخاب من العمدة لرئيس الحى للمحافظ لعميد الكلية لرئيس الجامعة للوزارة للرئيس<br />نظام اختيار صح<br />انما سياسة البيع والبيع بالذات لاجانب فنحن الشعب المصرى مخطط لابادتنا والعملية مش صدفة<br />واللة دول بيخططوا لابادتنا زى ما امريكا ابادت الهنود الحمر<br />المصريين اكلهم كلة سموم ومياة ملوثة وحوادث طرق وامراض كبد وفشل كلوى - مش صدفة<br />مش عايزين يموتوا البرادعى<br />عايزيت يتخلصوا مننا احنا"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309112531/http://www.20at.com:80/masr/hot-topics/15634-10-.html"

