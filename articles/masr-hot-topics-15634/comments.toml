[[comments]]
order = 12
subject = ""
author = "البرادعي والاقباط"
posted = "2010-03-10"
text = "اقباط مصر اثبتوا بكل العصور وحتى اشدها سوادا عليهم من الاسلام والمسلمين انهم وطنيين اكثر من اى مصرى مسلم —لم يتعاونوا مع احد لتحرير بلادهم من الاستعمار الوهابى رغم تعدد الفرص الذهبية للتخلص من هؤلاء البدو الاجلاف وكانوا دائما مثال الوطنى الحق الذى يضع مصلحة بلاده اولا ما يفعله امن الدولة الوهابى المصرى هو تخريب مصر والاسراع بخطة ذبح الاقباط واسلمة الضعفاء منهم بالقوة تفاديا لاستحقاقات الغاء المادة الثانية من الدستور واقامة دولة ديموقراطية تحترم حقوق الانسان<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ<br />يا ترى البرادعي جاي يلغي المادة الثانية من الدستور"
archived = "2010-03-11"
capture_url = "https://web.archive.org/web/20100311190135/http://20at.com:80/masr/hot-topics/15634-10-.html"

[[comments]]
order = 13
subject = ""
author = "اللعبة اتغيرت"
posted = "2010-03-10"
text = "امبارح كان فية لعيبة جديدة<br />الاستاذ صفوت الشريف بدأ يظهر وعارف ان شروط الترشيح تنطبق علية - عندة خلفية عسكرية سابقة فى المخابرات ومسئول حزبى وممكن تمشى معاة<br />واللواء عمر سليمان مرشح اسرائيل وامريكا والرجل القوى وبتاع مخابرات ايضا<br />ويظهر ان اقامة الرئيس هتطول شوية فى المانيا<br />والبلد فيها ازمة جاز<br />والعربيات واقفة<br />ومدد يا سيدى الخربوطلى"
archived = "2010-03-11"
capture_url = "https://web.archive.org/web/20100311190135/http://20at.com:80/masr/hot-topics/15634-10-.html"

[[comments]]
order = 14
subject = ""
author = "نحتاج مليون برادعى"
posted = "2010-03-11"
text = "احنا مش محتاجين برادعى واحد احنا محتاجين مليون برادعى<br />لانة تم تجريف مصر بالكامل واصبحت لا تطاق<br />ازاى وزير بترول مسئول عن الوقود والطاقة تحصل ازمتين متتاليتين وراء بعض وتشل حركة البلد والناس تعانى المر والمرار ويظل فى وظيفتة وزارة ازمات من ازمة البوتاجاز الى ازمة السولار - هو مين اللى عينة فى المنصب دة وهو ابن مين فى مصر<br />هما بيختاروا زبالة المصريين يعملوهم وزراء<br />واحد فاشل اداريا وبيعمل ازمات وبيتسم زى العجل فى التليفزيون ويقول لك غلطة الشعب والاستهلاك والاحتكار<br />يلعن ابو دة نظام ودى حكومة"
archived = "2010-03-11"
capture_url = "https://web.archive.org/web/20100311190135/http://20at.com:80/masr/hot-topics/15634-10-.html"

[[comments]]
order = 15
subject = ""
author = "قصة الحريرى"
posted = "2010-03-11"
text = "انتى عارفة لو البرادعى جرى لة حاجة<br />هتتكرر قصة اغتيال الحريرى بتاع لبنان<br />العالم هيعمل محكمة دولية للتحقيق وهيمسكوا اللى بالى بالك من لباليبة ويطلعوا عين امة<br />من هنا كلامك مالوش لزمة لانة محدش يقدر يمسة بل بالعكس هيشددوا الحراسة علية لانة لو حصل حاجة لة ولو بالصدفة هيتشنيروا قدام العالم<br />اطمئنى على البرادعى<br />دى يختلف عن ايمن نور"
archived = "2010-03-11"
capture_url = "https://web.archive.org/web/20100311190135/http://20at.com:80/masr/hot-topics/15634-10-.html"
