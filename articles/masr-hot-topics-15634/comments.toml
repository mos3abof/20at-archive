[[comments]]
order = 8
subject = ""
author = "البرادعى كايدهم"
posted = "2010-03-09"
text = "امريكا مالهاش حبيب<br />صدام كان حبيب امريكا وبيحارب ايران نيابة عنها وشنقوة<br />وشاة ايران كان حبيب امريكا والشرطى الامريكى فى الخليج واخرتة مات ورفضوا دخولة االارض الامريكية للعلاج<br />وغيرهم وغيرهم<br />والسادات قال ان 99 % من اوراق اللعبة فى ايدى امريكا وبعدين امريكا قتلتة لما بقى فية بديل<br />وحسنى مبارك كان ذكى جدا ولم يعين لة نائب او بديل علشان امريكا ايدها طارشة وطالما فية بديل بتديلة استمارة 6<br />يعنى لما السادات كان بديل عبد الناصر - عبد الناصر مات مسموم<br />ودلوقتى فية برادعى وبديل جيد مثقف ومتنور ويعرف الحكم على الطريقة الغربية<br />ومن هنا الرعب والخوف من البرادعى<br />استمارة 6 بتنكتب الان فى امريكا<br />وفية تغيرات ديناميكية<br />لا جمال ولا ايمن نور ولا سليمان ولا عمرو ولا دياولو<br />فية برادعى<br />وهنشوف الاخراج هيتم ازاى"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309112531/http://www.20at.com:80/masr/hot-topics/15634-10-.html"

[[comments]]
order = 9
subject = ""
author = "2 مليون جنية لمراتة"
posted = "2010-03-09"
text = "فى اليوم السابع بالصور من نص ساعة خبر عن وزير الصحة الجبلى ان الست مراتة تعالجت على نفقة الدولة ب 2 مليون جنية وصور القرار موقع عليها من الدكتور نظيف وبا اسم الدستور<br />بينما مستشفيات الحكومة مفيش فيها شاش ولا قطن ويموت الفقراء على ابوابها<br />ميزانية وزارة الصحة بيعالجوا نسوانهم وعيالهم فى انجلترا وامريكا والمانيا والغلابة يروحوا فى ستين داهية<br />وبعدين نقول جمال ونقول البرادعى ونقول حسنى"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309112531/http://www.20at.com:80/masr/hot-topics/15634-10-.html"

