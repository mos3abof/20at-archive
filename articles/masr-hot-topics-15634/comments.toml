posted = "2010-03-08"
text = "الدعاء دة على الميتيين<br />انت مستعجل لية<br />سيبة شوية<br />اصل القصة هتكرر مرات كتيرة سفر وعودة وسفر وعودة<br />زى الملك حسين<br />وزى ابو رقيبة<br />ادعوا لة بالشفاء وبس<br />اما الرحمة وتبديل زوج خير من زوجة هيقلب عليك سوزان<br />خليك حلو<br />ادعو لة بالشفاء وبلاش تغسيلة بالثلج لحسن الدنيا ساقعة قوى والعضمة كبيرة"
