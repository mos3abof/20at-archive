subject = "ان شاء الله خير"
author = "احمد"
posted = "2006-12-24"
text = "نامل ان شاء الله انه يكون خير وبلاش نبرات التشاؤم التى يبثها رعاة المصالح التى بسببهم اصبحت مصر الان على حافة عدم الامان من جماعة الاخوان المسلمين او حركة كفاية او من يقولوا على انفسهم لجنة حقوق الانسان<br />سيبوا البلد تمشى للامام وبلاش نغوص الى ان نصبح لبنان الاخرى"
archived = "2007-01-28"
