[[comments]]
order = 1
subject = "دستور مين ؟ فين ؟ ليه ؟ ياهـ هـ هـ ههههه"
author = "إبن بهيه"
posted = "2006-12-25"
text = "تديلات إيه ؟؟؟<br />طيب ومالو .. نعدل .. ما نعدلش ليه ؟ .. هو احنا صغيرين يعني ؟؟<br />طيب حد شاف الدستور عشان نعدله ؟؟؟ ما مرش من هنا ؟<br />مصر التي لا يعرف قدرها ذلك القذر الواطي مبارك الملعون عامل دستورها زي جالابية أبو لمعه الدبلان المخططه بتاعة أخوه شلبي .. كل يوم يرقع فيها ...<br />طيب وهو انته مين يا واطي عشان ترقع في دستور مصر العظيمه ؟؟؟<br />الدستور والكلام في الدستور يجب أن يعطل تماماً حتى نخلص من ذلك القذر الواطي مبارك وعصاباته ولصوصه العملاء للصهاينة ..<br />قبل كده أظن كله كلام في الهجايص وما لوش لازمه ..<br />دستور إيه اللي عايزه الناس تعدله ؟؟؟<br />حد شاف له أي أثر طول تلاتين سنه ؟؟؟ ما احنا عايشين في طواريء وأحكام عرفيه .. يعني الدستور معطل .. ده لو كان فيه دستور أصلا مش العك اللي عمله الماسوني السابق السادات العميل ..<br />أكرر طلبي يا عشرينات بعدم وضع صورة القذر الواطي مبارك .. ويا ريت تحققوا لي الأمنية دي قبل ما أموت من القرف من الخلقة الوسخه دي ...<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102318/http://masr.20at.com:80/article.php?sid=1351"

[[comments]]
order = 2
subject = "تعديلات إيه وفتكات إيه"
author = "حسنى مبارك ليس محتاج إلى نص دستورى ليحكم بيه البلد ده مسح بكرامة الدستور المصرى الأرض"
posted = "2006-12-25"
text = "الدستور فى وادى واللامبارك فى وادى تانى<br />يعنى هو إحترم الدستور لما وقف وقال سأحكم لأخر بتاع ده نبض فى كلبة هو الدستور قال إن الحاكم يأتى بالإنتخابات الحرة<br />يعنى هو أحترم الدستور وإحنا بلد أشتراكى وعمال يبيع أملاك الشعب من مصانع وشركات التى هى ملك الشعب فى النظام الأشتراكى ولا يجوز له التصرف فيها<br />يعنى هو كان أحترم الدستور لما قاله إن الحاكم يسهر على مصالح الشعب وهو عمال ينهب فى الشعب وجعل الشعب كله عبيد عنده وفرض مراته وإبنه فى الحياة السياسية يعنى هو مش قادر يبقى كده خالف الدستور<br />يعنى هو كان أحترم الدستور إللى بيقول إن رئيس الجمهورية يأتى بالإنتخاب وهو لم يأتى بالإنتخابات يبقى وجوده من البداية باطل<br />يعنى هو أحترم الدستور لما قال إن الأنتخابات تكون حرة وهو زور كل الإنتخابات بإعترافه أن الإنتخابات القادمة لن تكون مزورة مثل سابقتها<br />يعنى هو أحترم الدستور لما قال مصر دولة جمهورية وهو عايز يورث الحكم للإهبل العبيط إبنه<br />يعنى هو أحترم الدستور لما قال إن رئيس الجمهورية يكون مصرى من أبوين مصريين وإبنه مزدوج الجنسية لأن أمه بريطانية من أصل يهودى وفى بريطانيا الأولاد ينسبوا لأمهاتهم يعنى مش مصرى خالص<br />يعنى هو إحترم الدستور لما حفظ للمتظاهرين حرية التعبير والتظاهر وهو بيضرب المتظاهرين وبيعتقلهم<br />يعنى هو أحترم الدستور ومفيش أى نص يحشر مراته فى الحياة السياسية وهى بتجتمع بالوزراء وبتلقى عليهم الأوامر وبتحمل الشعب مصاريف السفر للخارج الباهظة التكاليف بالمليارات وهذا باطل<br />يعنى هو أحترم الدستور لما فصلوله مادة عاملة كده زى التلمود اليهودى علشان يضمن يورث الحكم للمتخلف المكروه من<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102318/http://masr.20at.com:80/article.php?sid=1351"

[[comments]]
order = 3
subject = "للدشم إللى هى ؟؟؟؟"
author = "يا اللى عماله تتنططى فى وسط الموقع علشان تبخى سمك القذر ياإللى اسمك دشم ومرة تلميذه ومرة مصرية بجد وأنت فى النهاية يهودية بجد وكلنا عارفينك ياريت تهدى وتتمرمغى فى النعيم المنهوب من الشعب إللى إنت عايشه فيه قبل لما يرجع لأصحابه من أبناء الشعب"
posted = "2006-12-25"
text = "هو أنت مبقتيش تكتبى ليه شعارك القذر<br />لا للتوريث لا لجمال مبارك<br />عايزين حكومة إنتقاليه تعيد للشعب كرامته بقيادة القضاه ثم أنتخابات حرة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102318/http://masr.20at.com:80/article.php?sid=1351"

[[comments]]
order = 4
subject = "تعديلات ايه لامؤخذه!"
author = "كلنا لازم نهتم بالتعديلات الدستورية لانها مؤكد حتأثر تأثر تأتير مباشر علي المواطن الغلبان الي بيكمل بقيت عشاه النوم."
posted = "2006-12-25"
text = "السؤال الأهم هو ايه هي التعديلات الدستورية المهيبة الي حتغير الحياة في مصر والي ماحصلتش من سنة 23 ولا حتحصل.<br />أعتقد ان الموضوع يرجع لللنية الخالصة لوجه الله مش لمجاملة الشعب المصري والمن عليه بأهم حق من حقوقه.<br />ولحد ما تتوفر النية الخالصة لله ساعتها بس ممكن نحاسب الناس ونسالهم انتو ليه مش مهتمين بالتعديلات الدستورية."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102318/http://masr.20at.com:80/article.php?sid=1351"

[[comments]]
order = 5
subject = "دستور يا أسيادنا"
author = "تم فتح ترزي حسني وولده جمال لتفصيل الدساتير وتأييف القوانين على المقاس ..."
posted = "2006-12-25"
text = "المواد من عندناوالموافقة لدينا مسبقاً والبلد بتاعتنا والخير في أيدينا ومراتي على سريري وإبني حبيب ننوس عين أمه سوزي شريكي في المحل والمحل لا يحل<br />على زبائن المحل الكرام ... الشعب الكرام التفصيل لدينا بايدي محلية هي مش وطنية بس محلاة ويا محلة العيشة على كرسي الرياسة كلها وناسة وحداقة وفهلوة وشوية سياسة والشعب المصري آخر تعاسة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102318/http://masr.20at.com:80/article.php?sid=1351"

[[comments]]
order = 6
subject = "البيضه ولا الفرخه"
author = "شيكو"
posted = "2006-12-25"
text = "هنفضل نجرى ورا وهم اسمه الحكومه والتعديلات ويا ترى امتى هيحسوا بينا<br />وهيحسوا بينا زاى واحنا شعب اخرص بياكل فى بعضه وبيجرى ورا الموضه ومبيشغلش دماغه غير بالاستهلاك حتى الوقت مالوش عندنا قيمه .دستور ايه بس الى بتكلم عليه مش لما نعرف هويتنا الاول ويقولولنا البلد دى بتاعة مين.كل شئ يشوبه فى امنا الحبيبه مصر التشويش.واذا كان رب البيت بالدف عازف فما بالك بحال اهل البيت.<br />انا اعتقد ان حاله الفساد التى نعيشها ولا بد لها من نهايه ولكن السؤال متى؟ بتغير الدستور لا والله لكن لما نفوق .انا لا اهاجم ولكن مبارك لا يعنينى شئ ولا دستوره ولا حتى طباخين الدستور.الاهم نحن لا بد ان يعى كل منا من هو حتى ياتى يوم الانتقام واعاده مجد مصر الضائع لا المسلوب .اسفه للاطاله ولكن اعجبتنى كلمه قراتها يوم \"لابراهيم عيسى\"<br />مصر جميله لكن المصرين\"وحشين\"لكن انا هقول المصرين نايمين ولا بد لهم من قومه."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102318/http://masr.20at.com:80/article.php?sid=1351"

[[comments]]
order = 7
subject = "معاك يا ابن بهيه و لكن...."
author = "نيفين نيفى نوفا"
posted = "2006-12-25"
text = "هى كلمه و حكمه قالها ابن بهيه حد شاف الدستور علشان نعدله<br />و انا قلتها قبل كدا برده ف تعديل الماده76<br />قلت هو فيه دستور اصلا<br />و لكن ليا عندك عتاب على تحامللك على السادات<br />انا عارفه من ساعه موضوع اللص و الكلاب لما لمتنى على كلامى عن ناصر انك ناصرى<br />بس دا ميمنعش انك تقدر السادات و تدى للراجل دا برده حقه<br />مش اتفقنا ان لكل واحد اخطاؤه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102318/http://masr.20at.com:80/article.php?sid=1351"

[[comments]]
order = 8
subject = "معلش استحملونى"
author = "فارس_fr"
posted = "2006-12-25"
text = "*نفسي الاحوال تتعدل والدستور يتبدل لصالح المواطن الغلبان مش لصالح الثعبان الاكبر , نفسي التعديلات الدستورية المباركية تهتم بالغلبان ابن الغلبان اللى عايش فى دوامة لسه هاحكم لاخر نفس :-<br />- لسه رغيف العيش غالى وحالته تعبانه<br />- لسه الطماطم ب6جنيه والبصل ب4 جنيه<br />- لسه المواصلات زحمة واتوبيساتها تعبانه<br />- لسه التعليم حالته لا يرثى لها من سئ الى اسوا .<br />- لسه فيه على حد علمى 8 مليون عاطل عن العمل .<br />- لسه فيه كام عانس فى البلد متجوزتش<br />- لسه فيه تزوير فى الانتخابات<br />- لسه فيه تعذيب فى السجون واغتصاب وانتهاك لادمية المصري .<br />- لسه مبارك وزبالته مستمرين فىحكم بهية<br />- لسه ابواق الفساد والاقلام الفاسدةامثال حمدى رزق وكرم خبر\" بتضمضم وبقبق\" للحكومة وانجازاتها .<br />- لسه عندنا جرائد زى الاهرام والجمهوريه<br />- لسه الغاز الطبيعى بيصدر لاسرائيل ببلاش<br />- لسه البترول فى جعبة امريكا لننال الرضا السامى .<br />- لسه فيه فضائيات زى العربية وروتانيات<br />- لسه البلد مليانه علمانيين وليبراليين ومدعى الثقافه .<br />- لسه الاثار بتتهرب خارج مصر<br />- لسه الخصخصة شغاله وسرقه المال اعام<br />- لسه الحوادث شغاله ويروح معاها الالاف من الغلابه .<br />- لسه امين الشرطة والعسكرىالمعفن له قيمه فى البلد وبيتعالى على خلق الله .<br />- لسه فلسطين محتله !!!!! لسه العراق محتله !<br />- لسه علاء بيسرق وينهب ويشارك على كل قهوة وكشك سجاير .<br />- لسه جمال عينه على الكرسي .!!<br />ولسه ... ولسه ... ولسه ..........!!!<br />مستنين ايه يا ناس والله حرام ,, معلش طولت عليكم بس الكلميتن كانوا واقفين فى ظورى ,,<br />تحياتى لكل قلم حر فى مصر ...!!!<br />اسف لتكرارى التعليق"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102318/http://masr.20at.com:80/article.php?sid=1351"

[[comments]]
order = 9
subject = "بصراحة والصراحة راحه"
author = "مبارك عمل من دستور مصر بامبرز ليه ولعيلته حسب المقاس"
posted = "2006-12-25"
text = "هو فين الدستور إللى فاق إنه فيه حاجة إسمها دستور يحكم بيه بعد 26 سنة عمال يتصرف فى عزبة أبوه زى ما هوه عايز ومش هامه أتخن تخين فى البلد<br />الحل هو حكومة إنتقالية بقيادة قضاه شرفاء ثم أطلاق الحريات ثم إنتخابات جديدة بدستور جديد لكن دستور ونفس العجل ده قاعد على الكرسى يبقى بيضحك علينا<br />دستور إيه دلوقتى والشعب بيموت من الجوع<br />طيب الدستور الموجود قال إن أبناء الشعب سواسية فى الحقوق طيب هو التوربينى متساوى فى الحقوق زى جمال اللامبارك<br />كفاية بقى ضحك"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102318/http://masr.20at.com:80/article.php?sid=1351"

[[comments]]
order = 10
subject = "لا للدستور"
author = "مبارك لم يضحى من أجل مصر فى يوم من الأيام وكان دائماً جاسوس لحساب أسرائيل وأمريكا علشان كده أتصعد بسرعة وأتعين نائب رئيس فهو لم يعانى أو يضحى مثلما يضحى أى قائد فى سبيل شعبه وعاش طول عمرة بوهم إسمه الضربة الجوية علشان يفهم الشعب إنه سبب النصر وينسب لنفسه نجاح ليس من حقه"
posted = "2006-12-26"
text = "مبارك لن يتنازل عن بنود الدستور التى جعلت من آله فما يدعيه هو كذب وخداع<br />ولو كان ها يغير فلن يغير أى بند يمس الأمتيازات التى يتمتع بها فى الدستور<br />مبارك غير الدستور لصالحه بدون وجه حق يعنى مراته إللى فرضه نفسها على الوزراء والحكومة وبتلقى الأوامر للوزراء لم يضع لها الدستور حق فى ذلك بل ويعتبر ده تقصير فى مهام عمل مبارك فهل حاسبه الدستور وهل يوجد بند واحد بالدستور يحاسب رئيس الجمهورية على نهبه أو يسأله من أين لك هذا وهو ينهب مصر منذ 26 عاما هو وعائلته<br />لن يغير مبارك الدستور ولكن الشعب سيغير مبارك والدستور كما يفعل حسن نصر الله ويطالب بحقه فى الحكم المغتصب منذ إحتل مبارك مصر بدون شرعية<br />الشعب هو صاحب السلطه وهو الذى من حقه أى يختار رئيسه ولم يختار أحد من الشعب مبارك فى يوم من الأيام إذن ليس من حق مبارك الجلوس على كرسى الحكم وكل ما يفعله باطل باطل باطل لإنه حاكم باطل<br />حسبى الله ونعم الوكيل"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102318/http://masr.20at.com:80/article.php?sid=1351"

