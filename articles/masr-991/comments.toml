[[comments]]
order = 0
subject = "احمد..اضف الى معلوماتك .قصدى رسايللك"
author = "نيفين نيفى نوفا"
posted = "2006-10-01"
text = "رساله بلح حياتى فعلا مشهوره اوى السنه دى و جتلى<br />و من الرسايل المشهوره السنه دى و اللى تنفع للعيد كمان<br />الكل بيقوللك كل عام و تنت بخير بس انا بقوللك انت الخير لكل عام<br />وخد عندك<br />مكان البدر خليتك و ملاك الخير سميتك و عزيز و غالى ناديتك و بقرب رمضان هنيتك<br />و كمان<br />يا طيور المحبه زوريه و على قلبى وصيه و برمضان هنيه و بالفانوس فكريه(ناس ماديه صحيح)"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125152500/http://masr.20at.com:80/article.php?sid=991"

