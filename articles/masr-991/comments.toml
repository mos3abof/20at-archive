posted = "2006-10-03"
text = "للاسف مشروع شنطة رمضان جاى متزامن مع شنطة المدارس ودى اكبر حجة لكل مصرى صميم فظل الاعياد اللى احنا عايشينها انهم يهربو من مشروع شنطة رمضان بحجة شنطة المدارس اللى مش عارفين يملوها"
