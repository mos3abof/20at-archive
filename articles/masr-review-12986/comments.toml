subject = ""
author = "لواءات بالزوفة"
posted = "2009-08-19"
text = "واللة ضحكت من كل قلبى<br />هيئة تجميل القاهرة رئيسها لواء اركان حرب<br />علشان كدة شوارع القاهرة جميلة جدا<br />والزهور والورد فى كل مكان<br />تجميل القاهرة ولواء اركان حرب بيادة<br />ومفيش ولا ورقة زبالة<br />كلة تمام يا افندم<br />ربنا معاكالى الامام<br />عايز عبط اكتر من كدة"
archived = "2009-08-22"
capture_url = "https://web.archive.org/web/20090822020340/http://www.20at.com:80/masr/review/12986-2009-08-19-11-17-04.html"

[[comments]]
order = 1
subject = ""
author = "اعمل فلوس"
posted = "2009-08-19"
text = "يا جماعة على اد ما مصر فيها فار انما فيها ناس بتفكر ازاي تعمل مليون جنيه وتحل مشكلتها<br />ففيه افكار انك تاخد من كل حمار ماشي في الشارع جنيه ومليون حمار تكسب مليون جنيه<br />زي مثلا قناة موجه كومدي فيها فوازير تعتمل على سرقة رصيد الموبايلات<br />الاخ الكاتب اللي فوق دا فكر في فكرة انه يالف كتاب ويخلي مليون واحد يشتروه ويكسب من كل واحد جنيه وتبقى اتحلت المشكلة<br />ومرة فيه واحد قابليه الف كتاب (علشان ما تنضربش على قفاك)<br />بس يا خسارة الداخلية صادرته ومنعت طباعته<br />ازاي تعمل مليون جنيه في مصر سهله<br />تفكر في اي فكرة يعجب بيها مليون واحد من الـ 80 مليون<br />وتكسب من كل واحد جنيه يبقى معاك مليون جنيه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-08-22"
capture_url = "https://web.archive.org/web/20090822020340/http://www.20at.com:80/masr/review/12986-2009-08-19-11-17-04.html"

