subject = ""
author = "مواطن مصرى"
posted = "2009-08-19"
text = "الجديد ان الكتاب لم يضيف جديد الشعب المصرى فاهم انه عامل عبيط من زمان<br />وبيعيش حياتها على السخرية والنكات بس المشكلة اننا فقدنا القدرة على المواجهة<br />لما كان فية احتلال كان فية رجالة وكانت فية هوية<br />الان فقدنا الهموية<br />بيطلقوا ع الشعب المصرى انة شعب رعاع متتخضوش من الكلمة قصدهم مش هيثور الا لما ميلقيش الفتات لكن طالما لاقى الفتات اهوة عامل عبيط وعايش عيشة العبيد<br />اسف على حدة الاسلوب بس مع الاسف دة الواقع"
archived = "2009-08-22"
capture_url = "https://web.archive.org/web/20090822020340/http://www.20at.com:80/masr/review/12986-2009-08-19-11-17-04.html"

