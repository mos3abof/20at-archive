[[comments]]
order = 10
subject = "اطلب مساعدة ....معلومات"
author = "راحيل نوي"
posted = "2006-10-17"
text = "اهلا بكم<br />والدي ووالدتي من مواليد مصر. خرجوا من مصر سنة 1957.اناولدت في اسرائيل واسكن فيها. حاليا اني اكتب رسالة دكتورة حول الرؤى المصرية بصدد التاريخ اليهودي.<br />ساكون ممنونة جدا اذا يرسل احدكم اسم موسوعة او اسم موقع انترنت حيث يمكنني ان اجد معلومات عن مؤرخون مصريون مثل:<br />عرفة عبده علي<br />فاطمة العامر<br />علي شلش<br />احمد عثمان<br />شكرا جزيلا لكم<br />راحيل نوي"
archived = "2006-11-20"
capture_url = "https://web.archive.org/web/20061120165650/http://masr.20at.com:80/article.php?sid=1003"

