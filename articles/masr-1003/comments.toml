[[comments]]
order = 1
subject = "رمضان كريم"
author = "حلو يا حلو"
posted = "2006-10-01"
text = "السلام عليكم اولا وكل سنة وانتوا كلكم طيبين ورمضان كريم الموضوع ده شيق اوى عشان نشوف صهاينة مصريين زينا ونعرف بيفكروا ازاى عاشن نعرف فكر الاسرائلين والفكرة ان المشكلة مشكلة سياسات مش مشكلة ديانات.وعلى فكرة الناس كلها بتقول انا المحرمات الثالثة هى السياسة والدين والجنس لكن فى الحقيقة انا شايف انها اهم ثلاث اشياء يجي التحدث عنهاو ياريت تبعدالموقع عشان نشوفه ونتاكد من الموضوع ده."
archived = "2006-11-20"
capture_url = "https://web.archive.org/web/20061120165650/http://masr.20at.com:80/article.php?sid=1003"

