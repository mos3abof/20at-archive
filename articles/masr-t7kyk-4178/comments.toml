subject = "المعنى الحقيقى ل\\\"للكبار فقط\\\""
author = "أحمد عصام"
posted = "2006-06-26"
text = "هل هم الكبار فى السن أى البالغين وما بعدهم ؟ أم الكبار فى الجسم فقط ولم يبلغ السن القانونى ؟ أم هم الكبار عقليا وفكريا وفهموا الحياة على حقيقتهاسواء كانت أعمارهم كبيره أو صغيره ولكن كما يقال دماغم توزن بلد ؟؟<br />وفى النهايه أوصى كل انسان أن يزن كل أمر بيمزان الايمان عنده حتى وان كان صغيرا أو كبيرا أو حتى لاشىء ......."
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626151243/http://masr.20at.com:80/article.php?sid=563"

