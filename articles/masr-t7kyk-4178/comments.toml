order = 3
subject = "حرام عليك"
author = "زنوبه"
posted = "2006-06-26"
text = "فى موقع قناة العربيه منذ حوالى آسبوعين تم فتح حوار عن فيلم عمارة يعقوبيان وما تتخيلوش كم الشتائم التى آنهالت على مصر والمصريين من العرب وآتهمهم لنا بالانحلال والشذوذ ـ طبعا العرب عندهم زبالتهم اللى مفروض ينشغلوا بيها لكن بالرغم من كده آنا آحب آوجه رساله لمؤلف الفيلم وآقول له<br />حراااام عليك<br />آما المخرج والممثلين فآحب آقول لكم آتقوا الله"
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626151243/http://masr.20at.com:80/article.php?sid=563"

