subject = "إنه إلف امعصية"
author = "اللى بيحصل ده بالظبط هو إلف المعصية و جعل الناس تتعود على هذه المشاهد الخارجة و المستفزة للمشاعر حتى نصل إباحة المحرمات و اعتبارها طبيعي في حياتنا."
posted = "2006-06-26"
text = "اللهم إذا أردت لعبادك فتنة فاقبضنا إليك غير فاتنين و لا مفتونين"
