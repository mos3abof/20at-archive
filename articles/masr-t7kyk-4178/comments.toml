subject = "ياسلام عليك"
author = "واحدة صحفية"
posted = "2006-06-26"
text = "فكرة حلوة اوى يا محمد .. بجد عجبتني اوى .. كان ممكن تستفيض اكتر فى الفكرة بعيدا عن السينما وتطبقها فى كل حاجة فى حياتنا كمان .. للكبار فقط قاعدة بيطبقها كل الكبار لمنع الصغار عامة"
archived = "2006-06-26"
