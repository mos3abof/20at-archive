author = "مصرى اصيل"
posted = "2006-07-16"
text = "الحمد لله الذى جعابنا مسلمين موحدين<br />لأ نلوم على الكبار والصغار<br />لأ نلوم على الشركة المنتجة<br />لأ نلوم على من دخلو الفيلم<br />لأ نلوم على من عجت جيوبهمبالمال<br />نلوم على من زرع فى عقول الشباب هذه الافكار الغريبة والشاذة على التقاليد والعادات المصرية الاصيلة<br />حسبى الله فى الانفتاح الاعلامى بهذا الشكل الخاطء"
