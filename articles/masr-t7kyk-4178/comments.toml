[[comments]]
order = 0
subject = "لك الله يا مصر"
author = "مصرى دمه محروق"
posted = "2006-06-26"
text = "و الله العظيم الى بيحصل دا حرام وحده وحده هنفقد الحياء ومعنى فقد الحياء يعنى فقد الإيمان إحنا مستوانا بينحدر شويا شويا وعلى الجانب الأخر تجد الممثلين الفجرة بيقولوا ان الوضع جيد و مبشر . طبعا لازم يقولو كدا لأنهم مش حسيين بالشعب تلاقى واحد منهم عربيد و سكرى وماشى غلط و للأسف الدوله تكرمه .سواء ممثلين الزمن دا أو الزمن الى فات كلهم نفس العجينه .لك الله يامصر يلا يا شباب نغير ما بأنفسنا أولا لعل الله يرحمنا ويصلح حالنا."
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626151243/http://masr.20at.com:80/article.php?sid=563"

