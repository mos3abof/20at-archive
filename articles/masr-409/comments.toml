posted = "2006-06-05"
text = "لو ان عمرؤ خالد يقول ان الوصلة حرام فانة فلوسة كلها حرام لانة يجمعها من الشيخ صالح الذى جأء ليعرف الدين اليوم مع ان الاحتكار للسلعة حرام فأين هو الحرام فى الوصلة الحمد للة انة مكنشى رئيس جمهورية كان جعل شعبة عبيد وان شاء اللة القنوات هيتصلح حالها لما يموت ترجع الامور تانى طبيعيةوسلامى للشيخ اة شيخ"
