posted = "2006-07-18"
text = "اى الاخ السعودي العظيم..يبدو أن جزيرة العرب قد عادت لعبادة الاوثان..هذا الملك الذي تقدسه ماذا فعل لك، ماذا خدكمك..ام أنك مثل القط تحب خناقك..الشعب السعودي اثره يعاني الفقر وماكل تبن..فلمك اتقدس الحمار ابو عابد الذي يدافع عن حق إسرائيل في ذبح اللبنانيين؟ يعني بإختصار ايش عملك ذلك الدابة، وهنا استغل الفرصة لأقول..المصري رغم فقره لا يخشى ان يشتم رئيسه في الشارع..ام السعودي فهو يخاف حتى من شرطي المرور...ومثال ذلك هذا العاطل عن العمل السعودي الذي يمدح مؤخرة طويل العمر الذي شحد الشعب هو وأبناءه...تفوه عليك يا عبد..يكفيك عارا ان اسمك مرتبط باسم اسيادك..سعودي..."
