subject = "تفوه عى الشعب السعودي الزفت..مش مكفيهم الشرمطة العالمية بدهم يحرمونا م"
author = "داعس في طيز عبدالله بن عبدالعزيز"
posted = "2006-07-25"
text = "اربعة امراء واثرياء سعوديين تنافسوا على فخذي هيفاء وهبي واحدهم فاز بها بعد ان نقلها بطائرته الخاصة من بيروت<br />بيروت - رعد شاكر<br />علمت عرب تايمز من مصادر مطلعة في مطار بيروت الدولي ان طائرة خاصة لامير او ثري سعودي حطت في المطار لنقل هيفاء وهبي التي حصلت على اذن خاص من فؤاد السنيورة لاستخدام المطار رغم قرار اغلاقه ووفقا للانباء فان الثري او الامير هو واحد من اربعة<br />مصادر مقربة من هيفاء ذكرت ان الطائرة تعود للامير الوليد بن طلال الذي يتبنى معظم مغنيات الفديو كليب ... لكن مسئولا في المطار قال انه شاهد الشيخ وليد البراهيم يستخدم نفس الطائرة في تنقلاته وهذا الشيخ هو مالك محطة العربية والام بي سي وهو شقيق الاميرة الجوهرة ارملة الملك فهد ويقال انه تزوج ممثلة اغراء مصرية زواج مسيار<br />المرشح الثالث لعملية الانقاذ الجريئة لمغنية ابوس الواوا هو الشيخ سعد الحريري وهو ايضا ثري سعودي ويعتبر الحاكم الفعلي للبنان ويقول العارفون ان سعد الحريري هو الذي امر فؤاد السنيورة بفتح المطار والسماح للطائرة بالاقلاع بعد اخذ موافقة اسرائيلية ويقال ان هيفاء شوهدت يوم امس في بروكسل حيث يتواجد سعد الحريري حاليا<br />المرشح الرابع هو المليونر والثري السعودي طارق الجفالي الذي خطب هيفاء وهبي ثم فك خطوبته بعد صراع عليها مع الشيخ وليد البراهيم<br />وبغض النظر عن هوية الامير او الشيخ الشهم الذي هب لانقاذ افخاذ هيفاء وهبي من التلطيش الاسرائيلي فان المؤكد ان الرياض كانت مقرا لكل محاولات الانقاذ والاسعاف لهيفاء التي يقال انها قبضت عشرة ملايين دولار نظير ان تغني بين يدي ورجلي الامير سلمان اغنية ابوس الواوا وقد بدأت بمطلع الاغنية الساعة العاشرة مساء وانهتها قبل صلاة الصبح ... والله اعلم<br />الطريف ان محطة العربية نشر<br />اقرأ بقية التعليق .."
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830142211/http://masr.20at.com:80/article.php?sid=409"

