[[comments]]
order = 308
subject = "يا ياناس شوية تفكير وبلاش عنتريات"
author = "عبدلله"
posted = "2006-10-26"
text = "الملك عبدالله بن عبدالعزيز الذي اذا رفع يديه في الحرم ترى دموعه وإذا جلس للسماع لتلاوة القرآن جلسته الأسبوعيه تقريبا ترى دموعه والذي حينما رأى الأطفال الأيتام ابناء رجال الأمن أخذ يمسح عينيه بطرف ردائه من الدموع والذي يجلس جلسته الأسبوعيه لكافة أطياف الشعب السعودي كبيرهم وصغيرهم غنيهم وفقيرهم يسقي هذا شربة ماء بيده ويساعد ذاك باالوقوف لكبر سنه ويحل المعضلات التي ترد إليه والمشاكل والمسائل العالقه بكل شفافية ما أمكن والبت فيه بنفس اللحظه إن كان من الممكن ذلك وعبدالله بن عبدالعزيز الذي هو أول من تحدث عن الفقر باالمملكه بكل جرأه واتخذ عدة تدابير لمحاولة التخفيف من تبعات ذلك المارد اللعين الفقر منها بناء المساكن وانشاء صندوق لكي يخدم المواطن نفسه بنفسه دون احساسه بمذلة الحاجه لأحد واتخذ تدابير كثيرة لاتحضرني الآن كما قام بتخفيض سعر الوقود وقام بزيادة الرواتب 00 وقام بإعلان الحوار مع من يخالفه تحت مسمى مجلس الملك عبدالعزيز للحوار الوطني إن صحت صحت التسمية وينادي دائما باالشفافية 000 ردي هذا على من يهاجم البلد بحجة الملك يبيح ويشجع قتل اللبنانيين والفلسطينيين والكل يعلم أن أكثر من دعم تلك الدولتين ماديا وسياسيا هي المملكه باالإضافه إلى ماتقدمه مصر من دعم لمثل هذه القضايا 00 وأعتقد أن سبب هجومهم ذلك هو عندما صرحت المملكه بأن ماقام به حزب الله !!!! من خطف للجنديين الإسرائيليين هو مغامره 000 نعم مغامره وبكل المقاييس كم قتل من شيخ وامرأه وطفل وكم هدم من بيت على رؤوس اصحابه بسبب جنديين !!! كانت ما يسمى بإسرائيل تنتظر الفرصه لكي تزمجر وانطلت الحيله على ما يسمى حزب الله !!!! لتصفية حسابات امريكية اسرائيليه من جهة وايرانيه من جهة اخرى والضحية لبنان !!! سؤال 000 من أدخل القوات الأمريكية<br />اقرأ بقية التعليق .."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117141116/http://masr.20at.com:80/article.php?sid=409"

