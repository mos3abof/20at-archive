text = "كورة ايه وزفت ايه ..طبعا أنا عارفه أن كلامى حيزعل كل اللى حيقراه من محبى الكرة..انا كنت أيضا من محبى الكورة ولكن أعتزلت كل أنواع الحب ..سوى حبك ياوطنى ..يا مصر ياحبيبتى ..أنت والملايين من أهلك المطحونين الغلابه..اللى حيدفع مئات الجنيهات قد تصل الى الآلاف ..أحسن لة عند الله التبرع بها لفقراء الوطن المنهوبين والمسلوبين من عائلة الأمبرا طووووووور..كأس العالم ترفيه ليس فى قائمة طعام الفقراء المصريين..ويجب أن يكون كأس تحير الوطن هو ما نشربه حتى يوم الخلاص..أيها القرصان وعصابتك ..أنتم أحقر الكلمات فى قواميس كل لغات الدنيا..لالالالالالالا لمبارك وعصابته وسلالته..لالالالالالالالا..للفساد..لالالالالالالالالالالا لقانون الطوارىء...ونعم..نعم..نعم..لتعديل الدستور...اللهم أجعل يوم الخلاص قريب..حيث مكانهم الصحيح فى مذبلة التاريخ ..قولوا آآآآآآآآآآآآآآآآآآمين"
