[[comments]]
order = 117
subject = "فزعة لعيون ابو اشرف"
author = "صالح السعدي"
posted = "2006-06-27"
text = "اضغط على القناة المطلوبة ثم اضغط على زر التحكم ( MENU )ثم أختار ( TOH ) ثم أختار ( PARSER ) ومن القائمة الجديدة أختار ( RAM EDITOR ) يظهر لك قائمتان متسلسلة حسب الأرقام والرموز التي على اليسار في المستطيل الأزرق 00 المهم تأخذ الشفرة الجديدة وتلاحظ أين تضعها يعني الكود الأول -- مثال ( O4) أو (OD) وهذه الرموز تعطى مع الشفرة - تضغط على مكان الشفرة ويظهر لك مستطيل جديد للشفرة الجديدة قم بإدخال الشفرة فيه بالتسلسل أي الرقم برقمه من الريموت والحرف بالضغط فوق أو تحت حتى يظهر مع ملاحظة أنه يجب نقل المؤشر في حالة كتابة الحرف أما الرقم فينتقل من تلقاء نفسه وبعد الإنتهاء تثبت بالغط على الأوكيه ثم الخروج -- والضغط في كل المراحل بالأوكيه00 احببت الإفادة فقط"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152831/http://masr.20at.com:80/article.php?sid=409"

