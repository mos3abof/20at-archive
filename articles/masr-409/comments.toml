[[comments]]
order = 11
subject = "تانى الوصلة"
author = "محمود صباح"
posted = "2006-06-02"
text = "الفارق كبير بين الوصلة والأشتراك..الوصلة نوع من السرقة والتحايل للحصول على الأرسال بطريقة غير مشروعة..وهى أكيد حرام..أما الأشتراك فهو طبعا حلال..أما التطاول على رجل دين..بدون الأستناد الى معلومات سليمة..فهذا شيىء أحمق وغير أخلاقى ..وكان يجب عليك التأكد من معلوماتك قبل أن تكتبى التعليق<br />ياأخى شوف الاعلان وانت تعرف الشيخ عمرو خالد بيقول ايه الوصلة حرام طيب والمبلغ اللى بيطلبة الشيخ صالح ده حلال ولا حرام كام واحد فى مصر يقدر يجيب الوصلة اولا انا معرفش هى تمنها فى مصر كام ولكن انا للاسف الشديد مشترك فيها فى السعودية والمبلغ هو حاليا 1800 ريال وللعلم هو زاد 3 مرات فى خلال اربع شهور كان فى ديسمبر 1200 ريال وبعدها بفترة قصيرة ارتفع الى 1400 ريال وفى شهر مارس اصبحت 1600 وفى 15 مايو اصبحت 1800 ريال طيب مش هى دى اللى يتقال عليها سرقة مع انه شارى البطولة بتاعة 2002 وبطولة 2006 وبطولة 2010 مع بعض وكاتب العقد بتاعهم فى مايو سنة 2000 يعنى محصلش انة دفع زيادة عن اللى دفعة سنة 2000 مين اللى بيسرق بقى ومين اللى بيستغل حاجة الناس ابشع استغلال احنا ليه بنغالط نفسنا هو يعنى عمرو خالد كان نبى من الانبياء معصوم من الخطأ ابدا هو بيشتغل فى الايه ار تى يعنى لازم يدافع عنها ويجيب احاديث وايات قرأنية على الوصلة وانا ممكن اجيب لك احاديث عن اللى بيعملة صالح كامل فى الناس واستغلالهم وما اكثر الاحاديث والايات القرأنية اللى بتتكلم عن الموضوع ده وبعدين محدش غلط فى الشيخ عمرو خالد انت من مريديه انت حر ومن حقك ولكن اللى مش من حقك انت تشتم اى واحد علشان بيقول رأية خلينا نختلف باحترام مش لازم نقطع بعض انا او غيرى بنعتبر اللى بيعملة عمرو خالد ده تمثيل وده حقنا وبرضة انا او غيرى بن<br />اقرأ بقية التعليق .."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025816/http://masr.20at.com:80/article.php?sid=409"

[[comments]]
order = 12
subject = "شيخ000 شاخ000 يشيخ"
author = "الاستاذشيكو"
posted = "2006-06-02"
text = "والله الواحد مش عارف يعمل ايه بس هو صالح كامل ده ايه منشار طالع واكل نازل واكل ده مش بيرحم يابا<br />وكل حاجه عنده بالفلوس وبعدين هو مصتاصد المصريين الغلابه<br />الاول بدا بكاس القارات اللي مصر مشاركه فيها وبعدين كرة القدم للشباب اللي مصر مشاركه فيها برضه وبعدين كاس الامم الافريقيه اللي مصر مشاركه فيها تالت<br />وده كوم وبطوله العرب كوم تاني<br />وبعدين ده عمال يزود في الاشتراك علي المصريين وغيرهم<br />اذا كان ده مش احتكار ومص دم للغلابه يبقه الاحتكار ايه<br />واللي محموق اوي علي الوصلات سواء كان عمرو خالد ولا غيرة لازم يعرف ان صالح كامل تخصص عكننه ع المصريين<br />اما القناة التانيه تزيع ولا متزعش ده مش مهم انا عاندي الوصله بادفع اشتراك للوصله مش لصالح كامل"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025816/http://masr.20at.com:80/article.php?sid=409"

