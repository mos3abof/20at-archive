[[comments]]
order = 19
subject = "بيقول الوصلة حرام الشيخ وكل فلوسة بتتصرف على النسوان"
author = "محمد على على"
posted = "2006-06-05"
text = "بصراحة حاجة تغيض لما بيقولوا شيخ وهولا شيخ ولا حاجة زى الى بيقولولة يا حج فلان<br />لية يا محتكر وماشى فى الحرام وبتجمع فلوسك منها بتالف فيلم انتى وعموووووووور افندى وبتقول حرام يا اخى عيب انتى مش صغير انتى هتودى الفلوس دى فيين يا رب يريح العالم منك ومن امثالك الاحتكار حرام مش الوصلة الى حرام على الاقل الى معاة والى ممعهوووووووش بيتفرج وبيحرق دمك وسلامى للمحتكر الكبييييير ولعموووووووووور الى الناس كرهتة بسبب جهلة عن الدين وبااااااااااااااااااااى"
