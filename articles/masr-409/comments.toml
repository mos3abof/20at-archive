[[comments]]
order = 14
subject = "كاس العالم"
author = "البحر"
posted = "2006-06-03"
text = "البطواله اسمها كاس العلم لكره القدم بينظمها المسسه المسئوله عن تلك الرياضه على مستوى العالم الفيفا<br />صح الكلام<br />لكن سبحان الله فى خلقه له شئون سلطان المال جعل البطوله اسمها كاس الشيخ صالح<br />وهو كدا الكلام<br />اللمعهوش ما يلزموش<br />والىى عجبه الكحل يتكحل<br />انما مساله مفوضات القناه التانيه<br />والوصل لاتفاق فى اخر لحظاه تبقا لاسمها ايه دى التوجيهات من السيد الكبير المسئول اللى يعينى عليه وعلى امه مش بيجى له نوم طوال فتره المفاوضات علشان يحبه عين امه هو صعبان عليه الغلابه ما يشفوش كاس العالم<br />والله يشكر<br />على العموم هو دا الاقتصاد الحر<br />تقوالى لى احتاكار ما احتكار<br />اقوال لك بمالك تعمل ما بدالك<br />يعنى كل حاجه حوليك لازم تشجعك على انك تكون انانى<br />هى دى الحريه هى دى العولمه<br />واديك فى دافوس تقول مختش فى شرم الشيخ"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025816/http://masr.20at.com:80/article.php?sid=409"

