[[comments]]
order = 107
subject = "نسأل الله الهداية للجميع"
author = "مسلم"
posted = "2006-06-27"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم ورحمة الله وبركاته<br />اخواني اخواتي عندي كلمة بودي ان اوجهها لكم<br />نعم لكم انتم .انتم الذين عاشرتكم تقريبا سنتين<br />ولكم الحق علي ان انصحكم وانصح نفسي اولا<br />اخواني كلكم يرى ويشاهد مانحن عليه من غفلة<br />همنا ان نرى اخبار لاعبنا المفضل وفريقنا الذي لاينهزم<br />وترانا ندخل في معارك كلامية ويصل الحال ان نسب بعضنا من اجل ذاك اللاعب وذاك الفريق<br />تناسينا اننا اخوان في الله يجمعنا دين واحد فوق كل علاقة<br />تناسينا همومنا الكبيرة .تناسينا ان هناك يوم سنسأل فيه عن وقتنا وماذا قضيناه فيه<br />هل قضيناه في ذكر واستعداد للحساب<br />ام صرفناه في البحث عن اخبار ذاك اللاعب وذاك الفريق وذهب وقتنا كله ولم نستفد منه شيئا<br />اخواني هذا المنتدى له رجالاته القائمين عليه وهم يوفرون لنا تقريبا كافة الاخبار<br />ولكن الملاحظ هو التعمق العجيب في كثير من الأخبار<br />فترى ذاك لايكاد يغمض له جفن ولاعبه اقصد حبيبه مصاب<br />اين الولاء والبراء<br />لهذه الدرجة وصلنا<br />لهذه الدرجة تناسينا مافعلوه في الحملات الصليبية التي كان اخر ضحاياها اخواننا في العراق<br />ويأتي البعض ويقول إن ااسرائيل هي عدونا الوحيد<br />وأن الباقين لاعلاقة لهم<br />انا أسالكم من يمول اسرائيل ومن يناصرهم ومن قوى شوكتهم؟؟<br />اسئلة يجيب عليها من حكم عقله قبل قلبه<br />والمصيبة الكبيرة هى ان حتى الشيخ عمرو يخوض<br />فى هذه الدوامة , يحلل ويحرم فى موضوع كورة قدم، من المفترض انك قدوة ايها الشيخ....<br />وهذا الموضوع والله حجة عليكم يوم القيامة<br />وقد أبرأت ذمتي<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152831/http://masr.20at.com:80/article.php?sid=409"

