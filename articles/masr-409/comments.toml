posted = "2006-06-04"
text = "كنت اتمنى من الداعية عمرو خالد ان يفتينا في الناس الي بتعبد الحاكم وترفعه لدرجة الاله هو ده مش شرك برضه ومش هو ده الي خلانا دول متخلفة.<br />يا استاذ عمرو خالد مين اهم ولا لازم يكون كلامك في مصلحة اللي بيدفعلك لدرجة اني تصورت انك عامل برنامج على خطى الحبيب مخصوص علشان تهاجم بتوع الوصلة الحرامية الكخة الي بيضييعوا الملايين من صاحبك طب اتكلم على الي بيسرقونا عيني عينك وافسدوا مجتمعنا ورفعوا من قيم التزوير و الرشوة و السرقة وحطوا من قيم العمل والتدين ......اصحى يا عمرو"
