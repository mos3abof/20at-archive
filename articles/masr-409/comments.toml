[[comments]]
order = 1
subject = "فعلا الوصلة هى الحل"
author = "محمود صباح"
posted = "2006-05-30"
text = "فى مؤتمر صحفى للشيخ صالح كامل فى جدة بالمملكة العربية السعودية قال بالحرف الواحد بعد سؤالة عن الاسعار البالغ فيها بالنسبة للاشتراك فى السبكة قال اللى ممعهوش ميلزموش وعندما سئل عن الفقراء الذين لا يستطيعون دفع المبالغ للاشتراك قال هؤلاء الفقراء لا يهمونى فى شيئ فانا تاجر ودفعت اموال ولابد من استردادها فأنا لست وزيرا لشئون الفقراء هذا كان كلامة وهذا المؤتمر كان فى 2004 قبل بطولة الامم الاوروبية وحدث هجوم شديد عليه من الصحفيين هنا فى السعودية ودول الخليج بعد كده يطلع الشيخ عمرو خالد ويعمل اعلانات على الايه أر تى ويقول أن الوصلة سرقة وحرام اللى يركبها عنده والكلام اللى بيتذاع فى اليوم الواحد ييجى مائة مرة وانا عن نفسى بقول للاخ عمرو خالد لا الوصلة مش حرام وانا متأكد من كده انت بتقول الكلام ده علشان انت شغال فى المحطة فيه ناس كتير جدا فى مصر والدول العربية صالحين وبيعملوا فروض ربنا كلها على اكمل وجه لكن لهم هواية وحيدة وهى ماتشات المورة يبقى لما ييجى واحد زى صالح كامل ويحرمهم منها يبقى الوصلة حتى اخر العمر وميهمنيش كلام عمرو خالد ولا غيرة ولو حد عنده اعتراض يقولى"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025816/http://masr.20at.com:80/article.php?sid=409"

