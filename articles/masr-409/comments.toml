text = "يمكن لمن يمستطيع استقبال القمر الاوروبى ويعرف كيفية ادخال الشفرات ، مشاهدة كأس العالم على القناة السويسرية SF1<br />وهذه هى شفرة مجموعة SRG SWISS<br />نوع الشفرة : viaccess<br />رقم تعريف المجموعة : 00 94 00<br />رقم المفتاح : 0B<br />الشفرة : 9A 7C C3 1F 1D DC 4F 7F<br />لادخال الشفرة على اجهزة ASTRA<br />يتم استعمال الريموت فى كل الخطوات<br />MENU<br />الوقوف على STB SETTINGS<br />الضغط على الأرقام 1 ، 2 ، 3 ، 4<br />اختيار VIACCESS<br />سيظهر جدول الشفرات فيتم ادخال رقم التعريف ثم رقم المفتاح ثم الشفرة<br />الرموز A-F يتم ادخالها عن طريق الاسهم<br />أرجو أن يقوم كل من يقرأ هذا التعليق بنشره بين منتديات ومواقع الانترنت"
