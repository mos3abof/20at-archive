posted = "2006-06-06"
text = "لصاحب التوقيع ss s انا لم اتطاول علي الشيخ عمرو لان الاختلاف في الراى مااسموش تطاول وانا سمعته علي قناةاقراء صحيح الوصله حرام علي القادر والاغنياء ده شيء بديهي لكن اسمحلي اللي دخل 0ه1 جنيه في الشهر او ضعف هذا المبلغ يعمل ايهوعلي فكره لان الحكومات المصريه علي مدار التاريخ ارقامها كاذبه فان الحقيقه ان مصر بس موظفون دول بس خمسه مليونويبقي المهمشون اللي لاحقوق لديهم كل جريمتهم انهم ولدوا فقراء ياريت نحس شويه بالناس دي يعني لاتعليم ولاصحه ولا مسكن حتي حقهم في الترفيه كتير عليهم مش كفايه المسسلات كلها عن ستات ورجاله الاعمال و البيت بيت تامر امين و محمود سعد و بعدين ما حدش يقولي مكانهم الجنه لان الشيخ صالح وامثاله بمعاونه اصحاب الفتاوى لهم اماكن هناك علشان اعمال الخير والذى منه يعني يا حول الله حتي الجنه مستكترنها على الناس واللي يقول كورة ايه وكلام فارغ ايه الناس اللي ما تعرفش انها قوة في السياسه والاقتصاد واحيانا في صنع القرار"
