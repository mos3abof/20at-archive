[[comments]]
order = 74
subject = "الغطرسة السعودية مرة أخرى...."
author = "بسطار أردني على رأس السعودي"
posted = "2006-06-21"
text = "مرة أخرى الشعب السعودي والتصلف السعودي الشاذ والسادي يطرح نفسه ليقول......نحن الاسياد يا كلاب يا مصريين ويا اردنين ...ايه نحنا طوال العمر..اخوتي الكلب ابن المنتاكة اخو الصرماية صالح كامل المنيك..لا يحتاج للإشتراكات وانما كان بإمكانه ان يحصل نفس المبلغ من الإعلانات لو اذاعها على قناته بالمجان..وانما هو الحقارة السعودية والرغبة في اثبات السيطرة التي يغذيها التصلف السياسي السعودي........ لعنة الله علىالنفط الذي حول الحمير الى أسياد.... على كل..... اقولها كس اختك يا صالح كامل يا حقير يا طرطور...... وخرى على كل الشعب السعودي من الملك بتاعهم الى اتحن واحد فيهم"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141435/http://masr.20at.com:80/article.php?sid=409"

[[comments]]
order = 75
subject = "لا تغالط نفسك وتحرقها"
author = "ابووتين"
posted = "2006-06-21"
text = "أمرك غريب وأسلوب للأسف ؟؟؟؟ لايملك من للغة الحوار الا كل كل رديء الرجل السعودي معروف بطيبه وكرمه تحصل على ماتريدمنه عندما تأتيه بنفس طيبه ونقية للأسف حقدك وكرهك ينم عن أصلك وأنحرافك أكيد هذا التهجم نتيجة خطاء قمت به وتم تأديبك ومن هنا تولد لك هذا الشعور راجع حساباتك مع نفسك أولا ثم مع الاخرين لكي تعيش مرتاحا وتثق فيمن هم حولك مع أحترامي وتقديري لشعب الاردني الاصيل أنت لاتمثل هذا الشعب الاصيل صاحب النخوة والعادات والتقاليد التي يفخر بهاكل مسلم"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622150957/http://masr.20at.com:80/article.php?sid=409"

[[comments]]
order = 76
subject = "تحية للكاتب (( بسـطار ))"
author = "صالح السعدي"
posted = "2006-06-22"
text = "أكثر ما عجبني هو المقطع الأول من أسمك وأنت لا تزيد عن ذلك الأسم بل هو أفضل منك ؟؟ عالعموم الشيء الذي فعله الشيخ/صالح كامل من ابسط حقوقه كونه تاجر ولو لم يفعل لفعلها غيره من التجارة الكبار - هو بطبيعة الحال إحتكار ولكن الغلط ليس منه بل أن الحكومات التي جعلت من قنواتها عروضاً للتجار غير مبالية بحقوق الشعب المساكين - فالشيخ صالح أعطاهم المقسوم وأشترى حقوق الناس منهم فلماذا كل هذا التحامل على الشعب السعودي بالأخص وماهو ذنب السعوديين 00 أنت جاهل والمهاترات معك لا تجدي 0000"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622150957/http://masr.20at.com:80/article.php?sid=409"

