text = "يا بابه الشعب السعودي اشرف منكم يا كلاب واللي يسب الشعب السعوي من الانترنت مو رجال واللي قاعد ويقول النفط اللي خلى الكلاب اسياد اولا الكلاب انت واشكالك الي قاعد تسب الشعب السعودي وبعدين هذا ملكنا ابو متعب الله يطول في عمره وي يخلييه لشعبه انشاء الله والله احطك على عيني وراسي ياالحلبي وصالح السعدي ابو تين ومشكورين انكم رديتوا على هذا الشخص اللي قاعد يسب الشعب السعودي واخيرا اريد ارسال رساله الى صاحب الموقع انك تحذف رسائل الاشخاص الجاهلين اللي ما عندهم اخلاق وكرامه وشكرا"
