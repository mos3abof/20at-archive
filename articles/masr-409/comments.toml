[[comments]]
order = 100
subject = "مرو خالد وفيفي عبده"
author = "ابن الأردن البار"
posted = "2006-06-24"
text = "يعني لا يسعني الا ان أقول ان فيفي عبده الغعلام الإسلامي الهخادف هو الراقصة اللهلوبة عمرو بن خالد الدينماركي قدس الله سره وفضح ستره...... ما مصلحة هذا الطرطور الجاهل بالدنيا والدين ان يفتي بمنع الناس من سرقة الحرامي المحترم الشيخ صالح كامل...... اما عمرو خالد انه طروطور والمشكلة ان الجهلاء والخرقاء يسمعون له..اي طرطور مثله يدافع عن عدم استخدام وصلة مع قناة دعارة رمسةي مثل الأي ار تي.... على فكر الايه ار تي ترمز الى الحس رجلي تتنعس..وانا اضيف عليها: احس رجلي تتنعس يا عهمرو خالد....اما الاح صالح السعدي.زفإن كنت لا اتفق معغ الذي اسمه بسطار اردني..الا انه مكعه حق في السب على الحرامي السفيه عمرو فاسد والكندرة صالح كامل.... اخوتي.....لا يوجد لدينا مخ نحن العرب ولالا لكنا رفعنا في اوروبا قضية عغلى الفيفا تحت بند \"انتاي ترست لاوز\" وتعني مكافحة الإحتكار....والذي كان أيضا إحقتار من قبل شيخ المنصر صالح كامل ..بالمناسبةما اخبار زوجته صفاء ابو السعود؟"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170821/http://masr.20at.com:80/article.php?sid=409"

