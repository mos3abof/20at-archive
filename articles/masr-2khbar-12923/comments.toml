text = "اقتباس سبب سحب كرنيه زخاري:<br />سبب سحب كرنيه زخاري انهم اكتشفوا انه ممنوع من السفر لانه سافر الى اسرائيل بدون اذن الحكومة المصرية<br />هو دا السبب<br />مفيش اي نعرة طائفية ولا حاجه<br />المسلمين والمسيحيين ممنوعين من السفر الى اسرائيل الا باذن من امن الدولة<br />مصر ما بتفرقش بين المسلم والمسيحي<br />الاثنين سواسية امام القانون والمسلم والمسيحي ممنوعين من السفر الى اسرائيل<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />نش شريف الدواخلي ولا البراء اشرف<br />الى (شريف الدواخلى و البراء أحمد)<br />ممكن توصلو كلمتى الى رئيس الحكومة و اعضاء الحكومة جميعا<br />قول لهم \"زخارى\" يقول لكم مليون الف مليون (طظ و طظ و طظ)<br />ملعون أبو ام (الحزب الوطنى) قيادة و كوادر و أعضاء"
