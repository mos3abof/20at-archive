author = "سبب سحب كرنيه زخاري"
posted = "2009-08-13"
text = "سبب سحب كرنيه زخاري انهم اكتشفوا انه ممنوع من السفر لانه سافر الى اسرائيل بدون اذن الحكومة المصرية<br />هو دا السبب<br />مفيش اي نعرة طائفية ولا حاجه<br />المسلمين والمسيحيين ممنوعين من السفر الى اسرائيل الا باذن من امن الدولة<br />مصر ما بتفرقش بين المسلم والمسيحي<br />الاثنين سواسية امام القانون والمسلم والمسيحي ممنوعين من السفر الى اسرائيل<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />نش شريف الدواخلي ولا البراء اشرف"
