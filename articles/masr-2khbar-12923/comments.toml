text = "اقتباس يا خرابي على الكذب:<br />يا زخاري انا متابع تعليقاتك من اول ما دخلت الموقع<br />دا انت كنت حبيب هشام طلعت يا كذاب<br />وكنت بتقول اان الواد بلية بتاع الحديد اللي هو احمد عز هو اللي لفقله القضية<br />فاكر يا زخزخ<br />قلبت ليه على هشام طلعت يا زخاري<br />علشان انا اكتشفت ان الصدق فى مصر ليس لة مكان<br />مصر اصبحت مرتع لكلاب (الحزب الوطنى)<br />و اشكرك يا صديقى صاحب التعليق رقم(17) و رمضان كريم و كل سنة و انت طيب<br />\"اتفو على الحزب الوطنى\" و أعضائة من الكبير الى الصغير"
