subject = "الله معكم"
author = "فهمى"
posted = "2007-01-07"
text = "ثبت الله كل من بذل لله وقته وجهده وليعلم العالم ان الازهر بابنائه سوف يظل شامخافلا نامت اعين الجبناء ولاهدئت ما انتهكت الحرمات واخذ الابرياء ظلما"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108065212/http://masr.20at.com:80/article.php?sid=1310"

