text = "هو فية احد بيروح الشغل<br />واللى بيروح الشغل عامل اضراب<br />والمدارس فى اجازات مفتوحة والعيال بيروحوا الدرس<br />والمحلات والدكاكين بتفتح الصبح الساعة 12 صباحا<br />والموظف بيبدأ الشغل الساعة عشرة صباحا ويروح الساعة 12<br />سلمها للى خلقك"
