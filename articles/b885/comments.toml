[[comments]]
order = 3
subject = "اللهم خلصنا"
author = "عزيز المصرى"
posted = "2006-10-22"
text = "هذه دعاوى بنى صهيون وبدون شك لقد تغلغلوا فى ارضنا العربية الطاهرة وبات همهم الاول نشر الرذيلة والفسوق العيب ليس فى شبابنا ولكن العيب فى القائمين على امورنا اين التوعية واين رجال الدين اين من يوضح للشباب تلك الامر ..<br />اللهم خلصنا من اليهود ومنهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142723/http://www.20at.com/article2.php?sid=885"
