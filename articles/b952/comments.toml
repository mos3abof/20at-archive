[[comments]]
order = 0
subject = "ليه الموضوع ده ما عليهوش تعليقات"
author = "سمراء"
posted = "2006-06-18"
text = "السلام عليكم و رحمه الله و بركاته<br />الموصوع ممتاز بارك الله فيكم و ياريت تدعوا للجميع بالقدره على قيام الليل لانه محتاج لجهاد نفس شديد و ياريت كمان ندعي لبعض كلنا في القيام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123254/http://www.20at.com/article2.php?sid=952"

[[comments]]
order = 1
subject = "الله الله على قيام الليل"
author = "ام صلاح"
posted = "2006-06-19"
text = "جزاكى الله خيرا يا هبه على هذا الموضوع , وحقا ان قيام الليل متعه لا يحس بها الا من زاق وارتشف منها , والله لقيام الليل هو الطريق الا تربيه جبل مسلم بحق ناصرا لدينه ولامته فاللهم اجعل امه حبيبك المصطفى ممن ترتوى قاوبهم بحلاوه قيام الليا . امين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123254/http://www.20at.com/article2.php?sid=952"

[[comments]]
order = 2
subject = "جزاك الله خيراً"
author = "أحـــــــمــد"
posted = "2006-06-19"
text = "جزاك الله خيرا يا أخت هبه ، وجعلة في ميزان حسناتك ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123254/http://www.20at.com/article2.php?sid=952"

[[comments]]
order = 3
subject = "ما زال الاسلام بخير"
author = "احمد قمر"
posted = "2006-06-19"
text = "بصراحة ربنا يبارك فيكي لاضافتك هذا الموضوع ورغم اني لا اقوم الليل الا ان موضوعك شجعني ربنا يبارك فيكي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123254/http://www.20at.com/article2.php?sid=952"

[[comments]]
order = 4
subject = "اللى كاتبة الموضوع ده زوجتى"
author = "مصطفى احمد"
posted = "2006-06-19"
text = "انا بجد فخور ان اللى كاتبة الموضوع ده زوجتى الموضوع رائع جدا وكاركتر جديد لهبة وكتابتها ربنا يباركلى فيها وتكتب دوما مواضيع رائعة تفيد بيها كل المسلمين والناس اجمعين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123254/http://www.20at.com/article2.php?sid=952"

[[comments]]
order = 5
subject = "لواعج عاشق"
author = "نبيل أبو الفتوح"
posted = "2006-06-19"
text = "لك الله ياسيدتى .... فلكم إنهلت العبرات مدرارا لكلمات مست شغاف القلوب وإستضاءت بنحيب المتأوهين قربا من ذات الملك العلام .. تحجبهم سجف البعد والغربه ويجمعهم حنين واشتياق .. وقد تأرجحت أفئدتهم مابين أسرار العلن وتخوفات الإسرار وتلونات الإشتياق .<br />لك الله ياسيدتى .... وبدر الملك العلام فى ملكوت غيبه يتهود يمنة ويسرى لمشاعر تمور ولواعج تثور من وقع حروف كلماتك ولغور معانى ألفاظك .<br />شكرا ياسيدتى ... ونحن باللإنتظار لمشاعر أخرى حيه رضيه مغلفه بالتحميد والثناءات ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123254/http://www.20at.com/article2.php?sid=952"

[[comments]]
order = 6
subject = "متعة العبادة"
author = "محجبة"
posted = "2006-06-21"
text = "اللي عرف متعة صلاة الليل مش ممكن يتركها-لو كانت ركعتين بس يا الله ربنا غفور بشكل احنا بنذكر صلاة الليل وقت الهم والحزن وننساها وقت الفرح وربنا بيتقبل منا ورحمته واسعةوهو الغفور الرحيم -"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123254/http://www.20at.com/article2.php?sid=952"

