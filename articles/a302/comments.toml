[[comments]]
order = 0
subject = "شطحات الصوفيه"
text = "من هذا الباحث واين هذا المعهد وكيف اجرى البحث<br />وهل المسلم اقل تعرضا للامراض من غيرهم<br />هل نشر في اي مكان"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040124/http://www.20at.com:80/article.php?sid=302"

[[comments]]
order = 1
subject = "سبحان الله"
text = "اللهم لك سجدنا وبك آمنا ..<br />سجدنا لك وسجد لك ما في السماوات وما في الأرض ..<br />سبحانك ما خلقت هذا باطلاًً .. فقنا عذاب النار<br />جزاكم الله خيراً على هذا الخبر الجميل وسط أمواج متلاطمة من الأخبار الكئيبة<br />فالسجود لله وليس لأمريكا يا من تشدون الرحال إلي البيت الأبيض سألين بوش العفو والمغفرة..<br />ربنا .. إياك نعبد وإياك نستعين ..<br />والسلام عليكم"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040124/http://www.20at.com:80/article.php?sid=302"

[[comments]]
order = 2
subject = "اللهم لك سجدت"
text = "اللهم لك سحدت و بك آمنت ولك اسلمت، سجد وجهى للذى خلقه، و صوره، وشق سمعه وبصره، تبارك الله أحسن الخالقين"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040124/http://www.20at.com:80/article.php?sid=302"

[[comments]]
order = 3
subject = "دجل علمي-الاسلام لا يحتاج للكذب"
text = "الكلام المذكور فيه خلط بين الاشعة الكهرو مغناطيسية و الكهرباء الساكنة.<br />و فيه خلط بين وضع الرأس على الارض و بين الوصل الكهربائي بالارض.<br />و مصاغ بطريقة غير علمية.<br />فما الفارق بين سجود المسلمين لله و سجود الكفار للاصنام.<br />و ما الفارق بين التاريض عن طريق القدمين او الراس.<br />يجب ذكر مصادر البحث.<br />إن المسلم هو من يبحث عن الدقة العلمية و ينفذ أمر الله \"اقرأ\" و ليس من يصفق لكل جديد"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040124/http://www.20at.com:80/article.php?sid=302"

[[comments]]
order = 4
subject = "لازم نفكر"
text = "الناس اللي علقت دي حافظة التعليق ده لكل الأبحاث اللي من النوع ده.. فكتبت وخلاص ولا ايه؟ ما هو اسم المركز والدكتور مذكورين..!!!! وبعدين ايوا فيه حجات غلط بتتقال بس مش معنى كده ان كله غلط!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040124/http://www.20at.com:80/article.php?sid=302"

[[comments]]
order = 5
subject = "طبعا لا يحتاج"
text = "اتفق مع القائل أن الإسلام لا يحتاج للدجل<br />لكننا أيضا يا صديقي العزيز لا نحتاج إلى أن نتخلى عن حقائق في الإسلام حتى نظهر بأننا شيك وراقيين وكلام من ده<br />لو شفنا القنوات التبشيرية الأمريكية هنلاقي دجل ونصب للصبح رغم اننا بنقول أن الأمريكان متقدمين وعقليتهم في التفكير جميلة وكلام من ده<br />عندك مثلا مقدم برنامج كل شوية يجيب واحد ولا واحدة حصل له أي حاجة (صدقوني مرة واحدة فرقع كاوتش عربيتها وبعدين قعدت تحكي ازاي ان واحد وقف لها وغير لها فردة الكاوتش وازاي هي حست بقى ان المسيح هو اللي بعت الراجل ده وان الراجل ده مكنش راجل حقيقي وانها متأكدة انه ملاك وانه بعد ما غير الفردة اختفي في لحظات) وطبعا مقدم البرنامج قال انه أكيد الرب هو اللي بعت الملاك ده وهو أكيد ملاك وإلا مين اللي بيساعد أي حد تاني في تغيير الكاوتش<br />اللي عايز أقوله ان الدجل والنصب في معتقدات أخرى كتير<br />لكن لما يكون مركز علمي ودراسة علمية وكلام منطقي مش لازم بقى نزايد ونقول انه دجل لأن كدة ممكن برده نقول ان كل حاجة في الدين دجل لانه إيمان بغيبيات<br />وبالمناسبة فيه ابحاث كتيرة جدا قام بها غربيون على قراءة القرآن والصلاة والوضوء وأثبتوا قدرة العبادات دي على تغيير مدارات الطاقة في الجسم البشري"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040124/http://www.20at.com:80/article.php?sid=302"

[[comments]]
order = 6
subject = "مصرى مغترب فى الكويت ( مصطفى )"
text = "لا اله الا الله<br />محمد رسول الله<br />لقد امرنا الله عن كل شى فيه خير لنا فى الدنيا وفى الاخره ولكن ماذا فعلنا نحن المسلمين لله تعالى<br />لقد فعلنا كل ما يغضبه علينا وحزبى الله ونعم الوكيل"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040124/http://www.20at.com:80/article.php?sid=302"
