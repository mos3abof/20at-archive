author = "ام مصرية مطحونة"
posted = "2009-03-21"
text = "هدية اية اللى الام عايزاها من عيالها<br />الام عايزة شوية رحمة<br />عايزة اللى عايز يشرب كباية شاى يروح يعملها لنفسة بدل ما ينادى ماما عايز كباية شاى وهو زى الفلق<br />عايزة اللى جوعان يروح يغرف لنفسة وياكل وبعد الاكل يغسل طبقة<br />عايزة عيالها الشحوطة فى البيت يخدموا انفسهم<br />الام المصرية مهلوكة ومستعبدة فى الشغل والغسيل والاكل والنظافة ومحدش بيساعدها<br />مش عايزة هدايا من احد<br />عايزاكم ترحموا امكم شوية"
archived = "2009-05-05"
