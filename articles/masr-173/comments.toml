[[comments]]
order = 0
subject = "اهلاويه"
author = "وفيها لما الدورى المصرى يقتصر على النادى الاهلى طالما فيه لعيبه كويسه وهو الاصلح"
posted = "2006-04-20"
text = "لكن حكايه زمالك ولا اسماعيلى ولا اى حاجه تانيه مينفعش<br />دايما الفرق دى من جواها مشاااااااااكل كتير<br />لكن الاهلى نادى اللعيبه و الجهاز المحترميين<br />مع انى كتير ببقى متضيقه من اداء الاهلى اللى بعد كتير عن المهاره بس اهو احسن من غيره<br />بس الحقيقه الكره العالميه حاجه تانيه بيحسسونى ان اللى بيحصل عندنا دى كورة شراب مثلا<br />ويالا بقى اهلى اهلى اوه اوه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213018/http://masr.20at.com:80/article.php?sid=173&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

