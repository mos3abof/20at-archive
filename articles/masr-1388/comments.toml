[[comments]]
order = 4
subject = "الى متى"
author = "مع الاسف وجود اسماء كدينا و سعد و روبى و من قبلهم الموضوع الذى تحدث عن ان كلمه سكس هى اكثر الكلمات بحثا عنها على الشبكه فى مصر ، يوضح لنا الاهتمامات الحقيقيه لعامه الناس و نحن هنا نتحدث عن طبقه المفروض انهانالت قسطا ما من العلم و المعرفه اتاح لها التعامل من الكمبيوتر و تصفح الشبكه فما بالك بمن هم اقل من ذلك"
posted = "2007-01-05"
text = "ولهذا تنجح شخصيات مثل روبى و سعد و لهذا تستمر شخصيات كدينا نجوما للمجتمع رغم كل ما صدر و يصدر منهم ، لان فعلا الجمهور عاوز كده ، وهى دى المشكله<br />واهو رزق الهبل........"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103216/http://masr.20at.com:80/article.php?sid=1388"

