[[comments]]
order = 1
subject = "الثقة"
author = "Max"
posted = "2007-01-01"
text = "عمرو خالد يستحق الاول بجدارة مع ان فيه ناس منشقة عليه وعشان كده الكاتب كتب مثير للجدل بس المعظم عارف مين عمر خالد او هنقول قله اعزرنى من تضارب افكارى بس كلمة مثير للجدل لسه مش مستوعبها كويس اما بالنسبة للكينج منير فهو كان يستحق الثانى مش السابع خالص ده راجل فكره ناضج جدااا وبيدينا افكاره الناضجة ديه نستوعب بيها حياتنا اما اى شخص اخر فى القائمة فليس من ضمن اهتمامتى عشان السياسة بقت وجع دماغ اليومين دول خلينا مع دينا شوية يمكن التحرش الجنسى يقل ولا حاجة هو اكيد هيقل بس ده فى المشمش انا بس نفسى اعرف فيه حاجة حصلت العيد ده ولا لا اصل بصراحة الى شفته امبارح كان كتير شوية عايز اعرف بقا بقيت الاماكن الاخرى انا كنت فى مكان مفعم بالحيوية والطاقة الفكرية اللاعقلية !!!!!!!!!!!!"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103216/http://masr.20at.com:80/article.php?sid=1388"

[[comments]]
