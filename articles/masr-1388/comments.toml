subject = "عيب"
author = "ايمن امام"
posted = "2007-01-02"
text = "عيب عليكم تحطو عمرو خالد ضمن هذه القائمه / كان يجب ان تكون القائمه مزدوجه - اهل الجنه واهل النار مثلا- عمرو خالد يدعو الى الجنه وغيره يدعو الى النار فشتان الفارق بين الاثنين -عمرو خالد تفتخر بأن فى مكتبتك شريط كاسيت له اما الاخرين فأنك تستحى على الاقل ان تظهر لهم اى كاسيت امام ابنائك- الا اذا كنت من الجماعه بتوع التنوير والضلمه والابداع/ ايمن امام"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103216/http://masr.20at.com:80/article.php?sid=1388"

