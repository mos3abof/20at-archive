[[comments]]
order = 0
subject = "باب الجنة"
author = "Mohamed Elbanhawy"
posted = "2006-10-18"
text = "بسم الله و الصلاة و السلام علي رسول الله و علي اله و صحبه اجمعين .<br />اما بعد فقد احببت ان اعلق علي موضوع المسجد , فالحمد لله دور المسجد لم ينته بعد و الدليل هو الصعود الهائل لعلمائنا الأجلاء في طريق الدعوة حتي وصلوا بحمد الله الي ما وصلوا اليه الأن , و فضل الله وحده و مجهود هؤلاء العلماء علي مر سنين طوال في الدعوة الي الله و التزامهم بتعاليم دينيهم الحنيف و عدم انسياقهم خلف الدعوات العلمانية لتهميش دور الدين , رغم ان عقيدتنا الأسلامية تقوم علي مبدأ ان الدين هو الحياة<br />{وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ }الذاريات56<br />و هؤلاء العلماء امثال الشيخ محمد حسين يعقوب ,محمد حسان ,محمود المصري , الشيخ ابو اسحاق الحويني , الشيخ محمد اسماعيل المقدم , الشيخ سعيد عبد العظيم , الدكتور ياسر برهامي و غيرهم من علمائنا حفظهم الله لنا و بارك لنا فيهم , و ادعو من الله ان يستمر نهج قناة الناس للدعوة الي الفضيلة و المر بالمعروف و النهي عن المنكر ."
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123084549/http://masr.20at.com:80/article.php?sid=1065"

[[comments]]
order = 1
subject = "المساجد باقية ان شاء الله"
author = "مسلم"
posted = "2006-10-18"
text = "ما دخل الفضائيات بالمساجد<br />في التلفزيون احاديث ونصائح وفتاوى وتثقيف اسلامي في القنوات الاسلامية<br />وفي المسجد صلاة وعبادة وحلقات ذكر<br />الحمد لله"
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123084549/http://masr.20at.com:80/article.php?sid=1065"

[[comments]]
order = 2
subject = "الاسلام"
author = "ما الذى يمنع ان يكون بالاضافه الى دور المسجد ان توجد قنوات مثب هذه"
posted = "2006-10-18"
text = "وماذا كان يفضل كاتب المقال محطات الفيديو كليب ام المحطات الاجنبيه الجنسيه<br />اللهم ادم علينا نعمتك<br />سبحان الله وبحمده سبحان الله العظيم<br />والصلاه والسلام على سيد الخلق وخاتم النبيين والمرسلين سيدنا محمد عليه الصلاه والسلام."
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123084549/http://masr.20at.com:80/article.php?sid=1065"

