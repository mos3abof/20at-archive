[[comments]]
order = 2
subject = "البقاء لله"
author = "نيفين نيفى نوفا"
posted = "2006-07-02"
text = "عاوزه اعزى كل عشاق السامبا لخروج البرازيل الغير مشرف و لخروج الارجنتين المشرف..الارجنتين زعلتنا كلنا بخروجها بس كفاها فخرا انها فريق رائع و لعبت افضل من المانيا بس الارض و الجمهور عوامل لا يمكن اغفالها وساعدت المانيا كتير..كمان انجلترا كانت مديه المونديال طعم حلو بس البرتغال اكيد هتعوضنا"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074738/http://worldcup2006.20at.com:80/article.php?sid=101"

[[comments]]
order = 3
subject = "القط الأسود أبن عم ال لهو الخفي"
author = "ABOO DONIA"
posted = "2006-07-04"
text = "جاء فريقين مثل القط الأسود والهو الخفي ولن يستطيع أحد أن يتذكر أدائهم المرعب الذي أخاف الكثير من المدربين والاعبين والمشجعين الفريق الأول وهو مثال صريح للقط الأسود الأكودور وهجوم فجأه علي كأس العالم وهجزم أيضاً علي بعض الفرق ومثل القط الأختفاء السؤيع<br />والفريق الأخر وهو لا ينسي لوجوده المناسب في المنافسة وهو صربيا الفريق الذي اخاف الكثير من النقاد وافزع الكثير من المنجمون حيث استطاع أن يلعب بفر جديد وبأسلوب ملفت ولكن كلا الفريقين أصبحو مثل<br />\\\"القط الأسود\\\" \\\" وال لهو الخفي\\\""
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074738/http://worldcup2006.20at.com:80/article.php?sid=101"
