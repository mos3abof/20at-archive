[[comments]]
order = 1
subject = ""
author = "تخفيض الفائدة"
posted = "2009-06-21"
text = "البنوك اليوم خفضت الفائدة على الودائع لصالح رجال الاعمال<br />وطبعا رجال الاعمال بياخدوا الفلوس من البنك ويشغلوها وفلوس المودعين تتاكل والناس الغلابة اللى حطين قرشين فى البنك يعيشوا منهم بعد غربة سنين مش هتعرف تعيش<br />وكل واحد عندة قرشين يتصرف فيهم"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624030828/http://www.20at.com:80/masr/2khbar/12420-2009-06-21-08-50-02.html"

[[comments]]
order = 2
subject = ""
author = "مباراة امريكا"
posted = "2009-06-21"
text = "اليوم الساعة تسعة ونصف مباراة مصر وامريكا ويمكن نفوز اصل الامريكان بتوع كرة سلة مش كرة قدم"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624030828/http://www.20at.com:80/masr/2khbar/12420-2009-06-21-08-50-02.html"

[[comments]]
order = 3
subject = ""
author = "سلام مربع"
posted = "2009-06-22"
text = "احنا بنتكلم عن السلام كتير لية<br />احنا مش خلاص عملنا اتفاقية كامب ديفيد وبننعم بخيرات السلام<br />مش فاهم لية الكلام كتير عن السلام<br />يكونش عايزين يعملوا اتفاقية سلام تانية غير كامب ديفيد والا الموضوع كلام لتضييع الوقت"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624030828/http://www.20at.com:80/masr/2khbar/12420-2009-06-21-08-50-02.html"

[[comments]]
order = 4
subject = ""
author = "هو فية اية"
posted = "2009-06-22"
text = "هو مين اللى كتب ومين اللى نشر ومين اللى دفع<br />سلام اية<br />اسرائيل عايشة فى سلام ومبسوطة على الوضع دة واخر تمام<br />فية احد يقدر يغير حاجة غير اسرائيل<br />الكونجرس من املاك اسرائيل<br />فلا اوباما ولا غير اوباما يقدر يفرض حاجة على اسرائيل"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624030828/http://www.20at.com:80/masr/2khbar/12420-2009-06-21-08-50-02.html"
