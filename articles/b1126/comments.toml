[[comments]]
order = 9
subject = "قلة أدب"
author = "سلطان زمانه"
posted = "2006-09-04"
text = "إالى الأخ اللي كاتب الكلام اللي فوق ..<br />إيه قلة الزوق و الأدب ؟؟<br />ليه متحاوليش تكون محترم عشان الناس تحترمك ؟؟<br />تحاول تعمر دعاية لزبك هنا ليه ؟؟<br />الناس اللي موجودين هنا كلها ناس محترمة و مؤدبة<br />إنت قليل الزوق و وحش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113845/http://www.20at.com/article2.php?sid=1126"

[[comments]]
order = 10
subject = "ali"
author = "zx.350sa"
posted = "2006-09-08"
text = "اناالحمد لله والعائلة كلها من غير المدخنين بالغرم انه كانت لي تجارب قديمه لكنها الحمد لله لم تستمر<br />وانا لدي العديد من الاصدقاء المدخنين وانا اشوقهم كل يوم الي توه يتعلم التدخين ويبي يصير رجال والي وده يتخلص من التدخين بس مش قادر لانه اصبح بالنسبة له مثل الاكسجين لا يقدر على فراقه لمدة دقائق وهو لو بيده كان ترك التدخين بس الادمان على النيكوتنين مايرحم<br />على فكرة انا اعتبر المدخنين مثل المدمنين مايقدروا يتركوا الشي الي راح يدمرهم واغلب اصحابي يعرفوا هذي المقولة لاني اصارحهم بها<br />والله اني اتألم عندما اشاهد واحد صغير السن توه يدخن او مبتدى ودي انصحه والقليل الي يتقبل النصح او حتى يسمعك لكنه عندما يعرف الحقيقه يكون الاوان قد فات على التخلي عن التدخين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113845/http://www.20at.com/article2.php?sid=1126"

[[comments]]
order = 11
subject = "مفيش فايده"
author = "مصرى جدا"
posted = "2006-09-12"
text = "يا جماعه جربتكل حاجه الرياضه كنت بفرفر زى الديك المدبوح طيب قولت يمكن اللبان ينفع و دفعت دم قلبى و كنت بفطر كل يوم 500 ملجم نيكوتين لما كنت بهرى معدتى<br />و برضه منفعش<br />قولت ياواد انجز و هات الباتش الى هى اللازقه يعنى تفتكروا ايه الى حصل<br />ولا الهوا يا ريس قولت لا انا ادخن احسن و اسهل ولع يارجل و احرق صدرك بلاش هم ازلى حتى السيجاره هتحط همك فيها وتحيا الكامل و المالبورو ولتسقط الكليوباترا<br />و ليخساء الخاسءون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113845/http://www.20at.com/article2.php?sid=1126"
