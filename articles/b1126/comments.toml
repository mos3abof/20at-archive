order = 0
subject = "البيت مليان غيوووووووووووو م"
author = "ريم بنت السعودية"
posted = "2006-08-07"
text = "اختي رانيا انا افتكرت الي كاتب الموضوع جنس خشن لكن حلو موضوعك وفي نفس الوقت الي يدخن وحاط براسه ها الشي لو يعطونه الدنيا ما اقلع عن عادته حتى وهو يعاني من سكرات الموت والكحة شارقته والبيت ياسلام مليان غيوووم والاطفال رايحين فيها الله يهدي الجميع ........... ملاحظة اختي رانيا نريد مواضيع رمانسية جدا لاني رمانسية واعشق الرمانسية واظن قلمك الرائع كما عودنا بمواضيعه الجميلة مو مخيبني وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113845/http://www.20at.com/article2.php?sid=1126"

