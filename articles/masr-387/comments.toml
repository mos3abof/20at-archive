[[comments]]
order = 18
subject = "سلبية الشعب فى كل شى"
author = "مصطفى"
posted = "2006-06-15"
text = "يا جماعه الكلام ده كله جميل لكن المشكله اننا شعب سلبى جدا بدليل أننى عند أجراء الأستفتاء على الدستور العام الماضى وحتى فى الأنتخابات أسمع من الناس أن ما تريده الحكومه هو اللى حيكون طيب أزاى وأكتر من 60% من الناخبين لم يذهبوا لصناديق الأنتخاب نحن 35 مليون ناخب لم يذهب منهم فى الأستفتاء الا 8 ملايين ناخب فقط فأين كانوا ال27 مليون الباقين فهذا هو ما يسهل عمليات التزوير وهذا هو ما يريده النظام ان نعتقده بأن كل شى عايزاه الحكومه هوه اللى حيكون . وربنا يوفقنا لما فيه خير لبلدنا الحبيبه ان شاء الله"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616152721/http://masr.20at.com:80/article.php?sid=387"

