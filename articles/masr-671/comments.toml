subject = "الله يخرب بيوتكم"
author = "طهقان"
posted = "2006-07-22"
text = "ياجماعة ربنا يهدي جميع المسلمات للحجاب<br />بس دي مش قصتنا دلوقتي احنا اليوم بتتعرض<br />الامه العربية والاسلاميه لحرب شرسه من كلاب<br />امريكا وحلفائها اديكم شايفين اللي بيحصل في العراق اخرهم كان أغتصاب الفتاه<br />العراقيه المسلمه عبير قاسم الجنابي15عام<br />من احد كلاب امريكاوبس ماكتفوش بأغتصابها<br />لأ كمان قتلوهاواحرقو جثتها هي واهلها<br />والمسلمين بتتفرج ويسمعو مطشات كأس العالم وأخبار الفنانين ياجماعة اتقو الله<br />والله كلنا مسؤلون امام الله في كل عرض ينتهك<br />وفي كل روح تزهق وفي كل مسجد يدمر<br />وفي كل طفل يقتل وفي كل بيتا يهدم<br />حسبنا الله ونعم الوكيل ."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050350/http://masr.20at.com:80/article.php?sid=671"

