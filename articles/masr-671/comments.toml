subject = "هو في إيه"
author = "lo2lo2a_arsany"
posted = "2006-08-10"
text = "هوفي إيه كل ما حد يتكلم على الحرب على لبنان والعراق يقول دي الحرب على الأمة الإسلامية ، ما هي لبنان فيها مسيحين ومسلمين و كل الديانات ، الأولى نقول حرب الإنسان على أخوه الإنسان ، زي ما في مسجد بيتحرق هكذا الكنائس وفي بيوت مسلمين بتتهد هكذا بيوت المسيحين ، ولا تعتقد مرة أن أمريكا وإسرائيل بفعلتهم الشعناء هذه يتبعون دين أو ملة أو يعرفوا ربنا أصلا، ربنا ما قالش خالص في الكتب السماوية اقتل، كل ما في الأمر دي وحشية وإلحاد من الرؤساء بيدفع تمنها الشعب العراقي واللبناني والإسرائيلي والأمريكي والعالم كله ، وهاأقول تاني الحرب والإرهاب ليس له دين لا تقوللي مسيحي أومسلم ، ولو كنت هاتتكلم بمنطق المسيحي والمسلم ، ماتنساش إن اللي ابتدى حزب الله وده إسلامي قال إيه علشان يعني كده يعني يعني يدافع عن الفلسطينيين.<br />ونقول يا حزننا على الإنسان اللي بيقتل أخوه بلااااااااااااا سبب."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050350/http://masr.20at.com:80/article.php?sid=671"

