author = "محمد شاهين"
posted = "2006-08-08"
text = "والله يا جماعة أنا عندي رأي تاني هونسبنا من حلا وأخوتها ونتذكر سوياً هذا الحديث<br />\" قال رسول الله صلي الله عليه وسلم من قال لا إله إلا الله والله وأكبر ولا حول ولا قوة إلا بالله محيت عنه ذنوبه ولو كانت مثل زبد البحر \" أو كما قال صلي الله عليه وسلم وشكراً ....... وخلينا بقي ولاد بلد وندعي للمسلمين في فلسطين والعراق وأفغانستان وفي كشمير والشيشان والصومال والسودان والفلبين وأندونسيا ولبنان ولبيا وتونس وسوريا والجزائر والمغرب والصين ووووووووووو مصر طبعاً"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050350/http://masr.20at.com:80/article.php?sid=671"

