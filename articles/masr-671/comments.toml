text = "بسم الله والحمد لله والصلاة والسلام على رسول اما بعد: اختي في الله حلا اللهم اجعل حلاك في الجنة اولاً اهنءك على هذا الانجاز العظيم في حياتك رغك ان الدنيا تغري بمظاهرها ولكن تحديت نفسك اولاً لتقومي بهذه الخطوة العظيمة عند الله واقول لك ثبتك الله على ما انت عليه وزادك ايمان وتقوى واثابك الفردوس الاعلى وحشرك مع زمرة نبينا المصطفى محمد عليه الصلاة والسلام."
archived = "2007-01-20"
