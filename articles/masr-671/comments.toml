subject = "الدنيا ربيع"
author = "ابن حميدوو"
posted = "2006-07-19"
text = "يا جماعة بلا لبنان بلا فلسطين بلا مقاومة, احنا فاضيين للكلام الفاضى ده,,فى حاجات اهم من كده بكتير,حلا اتجوزت,حلا فشكلت,حلا اتحجبت,حلا خلعت الحجاب, و المعتوهة التانية اللى بتموت فى حماده هلال و عايزة نمرة تليفونه, يا شيخة اتوكسي,ده مطرب ده,,انا بقترح يا جماعة ان احنا نلم نفسنا كده كوووولنا و نمسك ادينا فى ادين بعض و نربطها بالحبل بالجامد و نرووح سوا علي شط النيل و نرمي نفسن, و انا اكوون اول واحد, والله الواحد زيهئ من العيش و العيشة و اللى عايشنها, دحنا حتى مانستحئيهاش."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050350/http://masr.20at.com:80/article.php?sid=671"

