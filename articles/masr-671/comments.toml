subject = "الله يعينكم"
author = "سعوديه"
posted = "2006-07-25"
text = "بصراحه حلا تضحك على نفسهاوعلى مايبدو ان هي عندها الرغبه في الحجاب لكن مافي تشجيع اوتشويق اومعلومات عن الحجاب واتمنى لها ولغيرها الستر والهدايه<br />وأنا مش حدافع عن الأخت حلا اكن يعتبر نقطه في بحر من فعل هالصايعات المايعات اللي مايخافون من الله ومتناسين رقابة رب العالمين عليهم مثل خروبي ونانسي عقرب ونعجه قصدي نجلا والفاسقه الساقطه حيفاء وحبي وقبيحة الوجه رزان مغربي ووو............متى يارب تنصر الإسلام والمسلمين وتبيدمن أرضك هؤلاء الفجرة الفسقه<br />في السعوديه في الشرقيه وبالتحديد في محافظةالأحساءنحتفل بالبنت عند بلوغهاسن التكليف وهو سن التاسعه لأنها مكلفه شرعيابلبس الحجاب وإقامة الصلاة وصيام رمضان والحج ولوأن الحج صعب في هذا لسن فأنا حجيت العام الماضي وعمري25سنه وكانت معنا في الرحله أصغر حاجه عمرها14سنه وأصغر حاج ومتزوج عمره 20سنه الحمد لله على النعمهفهذي شيم العرب المسلمين الأهتمام بفروض الإسلام<br />أما قليلات الأدب أقصد عديمات الأدب يريدون يقلدون الأجانب الغربيين ....هم حرين في أنفسهم لكن لاينسون انهم عبيد لله رب العالمين<br />وأتمنى التوفيق والنصرلكم ياأهل مصر وأن يسهل الله عليكم جميع أموركم ويرزقكم من رزقه الحلال ويحرم عليكم الحرام وينفع بعضكم بعضاً"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050350/http://masr.20at.com:80/article.php?sid=671"

