posted = "2006-07-24"
text = "ياناس حرام كدة الالفاظ النابية الى قالوها بعض الاخوة عيب ...الى قال الالفاظ دى يرضاها لاخته او امه؟؟؟؟<br />بعدين خلو البنت حلال فحالها ....كلنا زعلنا عشانها ...بس فالنهاية كل شىء قسمة و نصيب<br />محدش عارف ايه سر خلافها هى و زوجها بس الاخر ده مش شان اى حد فينا<br />و على راى الاخ الى قال<br />نسينا لبنان و فلسطين و بنفكر فطلاق حلا و هانى و بس؟؟!!!<br />الله المستعان"
