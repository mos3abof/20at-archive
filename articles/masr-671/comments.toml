posted = "2006-07-24"
text = "جماعة حلا حرة تقلع الحجاب تلبس الحجاب دى علاقتها بربنا بعدين هى تتحاسب بس احنا نكون نصحناها وهى حرة فى الاخر وبعدين هى مش اول فتاة تتخطب او يتكتب كتبها وتتطلق احنا ملناش دعوة بحياتها الشخصية تتجوز تتطلق احنا ملناش دعوة هى حرة مش معنى انى هى ممثلة واحنا معجبينها نبقى ندخل ى حياتها وبعدين فى مثل بيقول من تدخل فلى شىء لا يعنيه سمع كلام لا يرضيه وربنا يهديها ووتجوز ابن الحلال وربنا يهدى باقى الممثلين"
