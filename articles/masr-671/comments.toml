[[comments]]
order = 0
subject = "غريب"
author = "عابر القارات"
posted = "2006-07-18"
text = "مشكلة هذه الفتاة مثلها مثل الفتيات اللائى فى نفس مستواها الاجتماعى و البيئى كما أشار الكاتب أنهن يعشن فى عالم يمكن أن نطلق عليه عالم \"شيزوفيرينا\" أو إنفصام فى الشخصية فهن يلا يدرين ماذا يريدن بالتحديد فمن جهه يريد الحياة كما تربوا و فة نفس الوقت و لعوامل معينه ربما صادفتها فى حياتها تريد حياة أمنه مسالمة و ربما متدينة و للجمع بين الحياتيم و ربما الشخصيتين فى داخل الفتاة الواحدة يحدث حالة من التوهان و فقدان البوصلة و المحاولة المستمية للجمع بين الاضاد فى داخل النفس البشرية و طبعا ما يحدث مع حلا يمكن أن نراه يحدث من حولنا لفتيات كثيرات ممن نقابلهم فى الدراسة أو العمل أو حتى الاقارات فترى الفتاة فى شهر رمضان مثلا تتحجب و تخلع الحجاب مع تكبيرات عيد الفطر مع إنها تعلم أن رب رمضان هو رب باقى شهور السنة أو ترى فتاه محجبة و متبرجه و ربما مغرية و داعية للرذيلة من ملبس و طريقة فى الكلام أكثر من كثير من السافرات أو فتاة تلبس الحجاب و فتحب التانورة الى ما فوق الركبة أو تلبس الجينز الذى يفصل أكثر مما يستر و لا أدرى أهو جهل أم إنفصام فى الشخصية كما أعتقد!! و فى النهاية أدعو لحلا و غيرها من البنات اللائى يتصارعن مع أنفسهم أن ينتصر الخير بداخلن فى النهاية و خسارة أن يتم أبغض الحلال بين أى إثنين تعاهدا على الحب و الوفاء و إتقاء الله سبحانه و تعالى"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050350/http://masr.20at.com:80/article.php?sid=671"

