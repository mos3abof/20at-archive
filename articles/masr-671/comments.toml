posted = "2006-07-24"
text = "كل الهجوم ده على البنت عشان ما اتوفقتش<br />مع الولد .. والا السبب هو انها اتقت الله<br />في نفسها .. يا جماعه حبوا الخير للناس<br />افرحوا لفرحهم وازعلوا لزعلهم ..ده اخلاق<br />المسلمين ..المسلم ما يعرفش الشماته<br />مايعرفش يقف وقت ما رباط يتفك بين زوجين<br />يقف يقول آآآه ماهي أصله..ا والا هو أصله ..عيب ..<br />نتقي الله ..وندعيلهم يصلح بينهم وانه<br />يكتبلهم الخيرأيا كان .. مش عارفين<br />ندعي يبقى نسكت ونجنب الناس<br />السنتنا ..اكيد هم مش ناقصين"
