posted = "2006-08-01"
text = "اولا يا جماعه بجد عيب نشغل نفسنا بموضوع خاص جدا زى دا من العقل وما يرتضيه الدين لينال اننا نكون اكتر حرص على نفسنا لأننا مسلمين زى بعض الحمد لله ويهمنا ان سمعتها تكون دايما كويسة وانا بقرأ التعليقات لاقيت ناس بتقول هتخش النار ومش عارف ايه بقوله يا اخى الفاضل انت بتتكلم كلام غير عقلانى لان محدش يعرف مين هيدخل نار ومين هيدخل جنة ربنا يكرمنا جميعال ونكون فى الجنة ان شاء الله وانا عن نفسى مش مهتم اصلا بالموضوع وحلا شيحة بحب تمثيلها فعلا لكن بصراحه فرقة وسط البلد كلها مش بتنزل من زورى على العموم يارب مكونش ضايقتكم بكلامى وسامحونى انى رديت متأخر لكن لسه قارى الموضوع دلوقتى حالا ."
