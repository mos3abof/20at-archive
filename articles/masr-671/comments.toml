[[comments]]
order = 74
subject = "أسباب النصر"
author = "أحمد سمير"
posted = "2006-08-09"
text = "أولاً ) مبروك على الحجاب ويارب يكون يابرك لك<br />ثانياُ ) في ظل المحن هذه نحن نحتاج إلى النصر وهو يتم بالأخذ بالأسباب و كون فنانه تتحجب وتخاطر بالشهرة فهو إصرار وعزيمة على حب هذا الدين و هي بوادر تساعد على التعجيل بالنصر وذلك بالتمسك بديننا وقيمنا .<br />** نعم فالممثلات هن قدوه لشريحه كبيرة من بناتنا للأسف ولكن مع ظهورهم بالحجاب وبالتالي أدورا محترمه فهو يؤدي إلى إعادة تفكير بناتنا في العودة إلى الدين .<br />** بالتوفيق يا حلا والله قد زاد ضياءك بحجابك فهو يعبر عن ضياء الوجه والعقل والقلب وأسأل الله أن تكون قدوة حسنه وأن تتقبلي الحياة بتحدي<br />وأتمنى أن يجمع شملك الله مع من تحبيه ليكون زوجك في الدنيا والأخره<br />مع خالص تقديري ونسأل الله النصر للبنان وفلسطين والعراق ويبدأ النصر بإالتفافنا حول ديننا و أذكركم بمقاطعه كل من يعتدي أو يؤيد الإعتداء على بلادنا الحبيبه"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050350/http://masr.20at.com:80/article.php?sid=671"

[[comments]]
