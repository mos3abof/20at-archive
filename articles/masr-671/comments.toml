[[comments]]
order = 41
subject = "الحجاب جميل عليكى اوى يا حلا"
author = "سمية"
posted = "2006-07-30"
text = "يا حلا ياريت لو تقرأى كلامى ده مبروك على الحجاب وربنا يثبتك عليه يا رب واحناوراكى وبنتشجعك ، والحجاب لا يمنع الفن ولكن ياريت يا حلا ياحبيبتى اختارى الاعمال الفنية اللى تخدم الامة الاسلامية وتخدم الاسلام علشان نرتقى شوية بالفن الهابط بتاعنا اعملى حاجات تعلم الناس تعاليم اسلمنا واخلاقياتنا وتعلم الصغار ازاى يتكلموا مع الكبار .. فى مواضيع مهمة كتيرة تخدمنا لكن للاسف كل اللى فى سوق الفن دلوقتى قذارة وقلة ادب وبيلهوا الشعب فى الزنا والعراه والموضوة الجديدة :\" الشذوذ الجنسى \" اللواط ربنا يخدكم يا للى فى بالى ، بسم الله الرحمن الرحيم :\"إن الذين يحبون أن تشيع الفاحشة فى الذين آمنوا لهم عذاب أليم فى الدنيا والاخرة والله يعلم وأنتم لا تعلمون \" ربنا يهدى وانا مع كل الناس اللى كتبوا وبيقولوا ياريت نهتم بحاجات اكبر من الممثل الفلانى والممثلة الفلانية علشان امتنا فى خطر من اليهود والامريكان والمفروض نرجع لدينا علشان ربنا وحده هو اللى حينصرنا عليهم يقول الرسول صلى الله عليه وسلم : يحشر المرء مع من احب\" فالى بيحب الممثل الفلانى والمغنية الفلانية انت ضامن انه يدخل الجنة طيب حيدخل الجنة على الرقص والعرى وعدم طاعة ربنا اظن الحق واضح والباطل واضح وكتب الدين عندنا معلش طولت عليكوا"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050350/http://masr.20at.com:80/article.php?sid=671"

