subject = "اللهم اجعلنا من المتقين"
author = "ليس ضرورياً"
posted = "2006-07-28"
text = "لا حول ولا قوة الا بالله العلى العظيم...ان ارتدت الحجاب تحدثنا...وان لم ترتديه تحدثنا....سبحان الله متى امتلكنا افئدة الناس واطلعنا على ما فيها...سمعت مقوله مرة مفادها ان احد الناس سأل حكيماً كيف السلامة من الناس؟ فقال له الا تُظهر الخير ولا الشر فقال له الرجل وكيف ذلك؟ قال؟ ان اظهرت الخير عاداك اهل السر وان اظهرت الشر عاداك اهل الخحير...وهكذا حالها وحال مثيلاتها مع الناس ولا حول ولا قوة الا بالله"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050350/http://masr.20at.com:80/article.php?sid=671"

