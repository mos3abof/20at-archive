text = "السلام عليكم ورحمة الله وبركاته الله سبحانه وتعالى لم يأمرنا ان يكون الحجاب بالقلب والاخلاق ولكن اولاً ان يكون على الرأس وقد ذكر الله تعالى في كتابه الكريم ايه عن الحجاب وعلى فكرة انا اهنئ الفنانة الذي تاب الله عليها حلا شيحا واتمنى ان لا تكون فنانة بعد الان بل ان تكون داعية الى الله وان تتقرب من الله عز وجل لا السعادة مع الله فقط واقول لها هنيئاً لك الحجاب لا نك لو لم ترتديه في الدنيا سيلبسونك اياه رغماً عنك عند موتك واكثر من هذاانهم سيغطون لك وجهك ولكن يكشف عنه الا محرم لك وعندها لن تستطيعي نزعه او ان تقولي لهم لا اريد ارتداءه واخيراً اقول لك اختي في الله لا تغرك الدنيا فالدنيا ملعونة ملعون ما فيها الا ذكر الله ومن والاه او كما قال رسولنا الكريم عليه الصلاة والسلاك فيا اختي توبي الى الله توبة نصوح وارضي الله يرضيك في الدنيا والاخرة وابتعدي عن رفقاء السوء ولا تعاشري الا من يؤثر عليك دينياً والسلام عليكم ورحمة الله وبركاته اختك في الله ام طه."
