text = "يا جماعه حرام عليكم حلا مش أول ولا اخر بنت هتفسخ أو تنفصل بعد كتب الكتاب وقبل ما كل واحد يتكلم عليها يحط في دماغه انه له اخت أو اي بنت تخصه ممكن اي حد يتكلم عليها. كده عيب يا جماعه كل واحد يفكر كويس قبل ما يقول كلمهوبلاش تتعمقوا في حياه الناس وكل واحد يركز في بلاويه الاول وبعدين يتكلم عي مشاكل الناس"
