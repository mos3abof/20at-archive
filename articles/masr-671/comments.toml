posted = "2006-08-09"
text = "قال رسول الله<br />قال رسول الله ستتداعي عليكم الامم كماتتداعيالاكلة علي قصعتها قالواامن قلة نحن حينئذايارسول الله قال لا ولكنكم كثير كغثاء السيل ><br />فاتقواالله ايها المسلمون وانظروا الي مايحدث حولنافي فلسطين ولبنان والعراق فهم اولي بهذا الوقت الذي نضيعه في التفاهات وادعوا لاخوانكم لعل الله ينصرهم ويحقن دمائهم"
