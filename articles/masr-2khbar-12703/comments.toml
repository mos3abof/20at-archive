[[comments]]
order = 3
subject = ""
author = "الدوام للة"
posted = "2009-07-20"
text = "للة ما اعطى وللة ما اخذ وانا للة وانا الية راجعون<br />يعنى اية الهدف من الحكاية او القصة او الخبر<br />الناس لا تذهب الى العمرة مثلا او يخافوا من الذهاب الى السعودية<br />ومن منا لا يود فى قرارة نفسة ان يموت فى الارض الطاهرة ويبقى فى جوار الرسول علية السلام واصحابة وال بيتة الاطهار<br />اذهبوا الى بيت اللة معتمرين وقفوا امام الروضة الشريفة وقولوا لسيدنا رسول اللة يا رسول اللة ضاقت علينا الدنيا بما رحبت فاغثنا اغثنا يارسول اللة<br />حالنا اصبح لا يطاق وبلغت الروح الحلقوم فاللهم عفوك وفرجك واحسانك<br />ليذهب القادرون ويدعوا لنا<br />اغثنا يا رسول اللة<br />ولا تخافوا من الخنازير ولا انفلونزا الخنازير فاللة خير حافظ<br />اذهبوا الى البيت الحرام<br />يا مكة<br />سورك متين جد الحسين فيكى<br />فيكى مقام الخليل يشرف اراضيكى<br />_______________ _______________ _____________<br />عبد فقير الى رحمة اللة"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727202006/http://www.20at.com:80/masr/2khbar/12703-2009-07-20-06-40-09.html"
