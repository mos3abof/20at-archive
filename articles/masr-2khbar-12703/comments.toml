subject = ""
author = "االا رسول اللة"
posted = "2009-07-20"
text = "قال تعالى<br />ولو انهم ظلموا انفسهم ما جاءوك<br />صدق اللة العظيم<br />المذاهب الاربعة تقر التوسل والشفاعة برسول اللة<br />قال الامام مالك للخليفة المنصور لما حج وزار قبر الرسول صلى اللة علية وسلم وسال مالكا قائلا<br />يا ابا عبد اللة استقبل القبلة وادعو ام استقبل رسول اللة صلى اللة علية وسلم ؟<br />قال مالك<br />ولم تصرف وجهك عنة وهو وسيلتك ووسيلة ابيك ادم علية السلام الى اللة تعالى بل استقبلة واستشفع بة فيشفعة اللة<br />ذكرة القاضى عياض فى الشفا وساقة باسناد صحيج"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727202006/http://www.20at.com:80/masr/2khbar/12703-2009-07-20-06-40-09.html"

