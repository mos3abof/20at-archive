[[comments]]
order = 5
subject = "مش بتوع جواز"
author = "بصراحه الشباب والبنات اليومين دى بتوع"
text = "العب العب العب طبعآ الجنسين عشان كده كتير منهم صاروا شبه بعض اما الزواج عايز<br />((راجل وحرمه)) مش اتنين شباب ولا اتنين حريم<br />المهم عشان ما انساش بضحك اوى من اللى يحسب نفسه هوا اللى بيرزق = اول محد يقولوا زواج يئعد يحسب ويخطط ويبكى ويقول انا ماعنديش<br />نصيحه لكل عزوبي انوى واتوكل على الله<br />وربنا حيكرمكم اه نسيت اقولكم انا مش بتاع جواز<br />عشان انا الشرط الوحيد للزواج ان العروسه يكون عندها 30 مليون وحلوه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152509/http://www.20at.com/article.php?sid=1560"

[[comments]]
order = 6
subject = "OUFA"
author = "سم الله الرحمن الرحيم"
text = "فى البدايه احب اعرفكم بمبدا فى الحياه<br />المبدا بيقول ان انا مادخلش موضوع وانا مش قده عندنا فى وجه قبلى الوضع مختلف لازم يكون عندك شقه على الاقل وكمان فتره الخطوبه لاتتعدى 3 اشهر علشان كلام الناس طبعا<br />انا عن نفسى ناوى اخطب السنه الجاييه بس بادور على بنت الحلال اللى تشاركنى حياتى المستقبليه ان شاء الله بس على شروط اولها انها تكون بنت ناس وجدعه واصيله يعنى من الاخر بنت كامله او شبه كامله واهمخ حاجه تكون بتحب الخناق<br />انا مستنى الردود انا هاخلص الكليه السنه الحاليه انا فى البكاليريوس وانا على اتم استعداد للزواج من حيث الناحيه الماليه او النواحى التانيه وانتوا فاهمين طبعا هههههههههههه اوكى انا فى الانتظار على رقم 0125132904 باسم oUFA"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152509/http://www.20at.com/article.php?sid=1560"
