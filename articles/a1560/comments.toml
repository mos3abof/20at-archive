subject = "الجواز"
author = "صراحة هي فكرة الجواز اصلا فكرة منيلة في كل حاجة يعني سبحان الله الواحد بيرمي نفسه في النار بايده"
text = "بداية من صعوبة الاختيار مرورا بالشبكة وتكلفتها وفترة الخطوبة وتكلفتها والشقة ومصيبتها والعفش والفرح وشهر العسل وبعد كدة الحمل والولادة والسبوع والمرض بتاع الطفل وبعدين الحضانة والجنين التاني في بطنها وهكذا دة غير مصاريف البيت والفسح والعزومات دة غير عشقها للنكد وتكره انها تشوفك بتضحك مثلا وانت مش قادر تجيبلها الفستان اللي وعدتها بيه في الوقت اللي جاتها جابته وسبقتها<br />دة غير ولا اقولكم انا تعبت كفاية كدة ايه رايكم في حد عايز يتجنز قصدي يتجوز؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152509/http://www.20at.com/article.php?sid=1560"

