subject = "مش ازمة اسعار"
author = "لمشكلةان الشاب لما بيحوش له 2000 جنيه الكبر بيدخل نفسه و يحس انو لمونة في بلد قرفانة!يعني بيشوف نفسه حبتين تلاتة، فيتدلع و يتأمر على البنت و اهلها وكأن مفيش غيره و كأن البنت كانت قاعدةتبكي جنب الحيط في انتظاره"
text = "بس رجاء من الشباب اللي شايفين نفسهم و عايزن عروستهم تبقى هيفا ولا نانسي عجرم ,,,يبصوا لنفسهم في المرايا ..ويشوفوا المهر اللي بيدفعوه يجيب كام كيس شيبسي"
