[[comments]]
order = 2
subject = "هيا يا شباب"
author = "لزواج نصف الدين والموضوعات المذكورة غير وارده علي الاطلاق ...."
text = "اذا كانت العروسة غنية عاورة المليونير<br />اذا كانت فقير ايضا عاوزة المليونير<br />اين نجد المليونير للعروسة<br />ابن صاحب مصانع ومؤسسات وشركات فتجد العريس شرس يتكلم من منطلق فلوسة اللي بيشتري بيها دميه بلاستيك واللي عاجبة واللي مش عاجبه يشرب من البحر فتطفش منه العروسة ويصبح عانس في بحر فلوسة .<br />اما الغلبان وذهب ليدخر من الدول حتي ادخر مبلغ من المال وطبعا حضر بعد ما انهد حيله واصبح صاحب مرض ودخلت عليه الشيخوخة وعاوز عروسة شباب وعليها تجعل من حياته جحيم وتستنزف امواله التي ادخرها وترفع عليه قضية لانه لا يصلح للزواج .<br />اما الحال في الحواري والازقة والاماكن التي ندعي انها مستوي اجتماعي منخفض تجد يوميا الافراح تتم (بحصيرة وقله وكنبه) وهات يا خلفة عيال .<br />اصبح المجتمع علي مستوياته<br />العالي افراد الاسرة واحد او اثنين من الاطفال علي الاكثر..<br />المتوسط خناقات واهات وضرب وطحن وعدد متوسط ثلاثة اطفال ..<br />المستوي الادني تجد ان اطفال الاسرة اكثر من ثمانية<br />اي انه حدث انقلاب في الهرم<br />كلما زاد الدخل كلما قل عدد الاسرة والزيادة السكانية<br />وكلما قل الدخل زادت الزيجات والزوجات للفرد واتسعت افراد الاسرة.<br />وتجدهم في طبقة الباعة المتجولين اصحاب المراجيح والعربات الكارو وتعتقد انهم ذات دخول صغيرة ..<br />كل زوجة معها مرجيحة والعيال عندما تصل لسن العاشرة يركب عربية كارو او حنطور ورب الاسرة لو جمع الدخول من كل الاطراف وجد ان دخله مرتفع اكثر من المتوسط ويتدافعوان لاي مكان للعيش فيه ..<br />والاكثر شيوعا شباب المستقبل يتزوج من اجنبيات فوق الستين ليحصل علي الاقامة .. ويدخر المال ويعود هيكل محطم الامال وعاوز يرتاح بقي بحفنة الدولارات اللي معاة ...<br />لا ا حب ان اكون مليونيرا لاساق وتحطمني امراءة<br />ولا اكون بجوار الارصفة لاتمتع بالجواري ثلاثة زوجات<br />ولا متوسط لاعيش في الخناقات والندم والاهانات والزنقات ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152509/http://www.20at.com/article.php?sid=1560"

