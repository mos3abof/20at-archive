[[comments]]
order = 7
subject = "خلاص زهقنا"
author = "ابو كرتونة"
posted = "2006-06-28"
text = "حسني مبارك هذا العميل الخائن<br />الكلب الخسيس<br />اهم انجازاته:<br />8 مليون عاطل<br />12 مليون عانس<br />850 الف حالة سرطان بسبب المبيدات المسرطنة(يوسف والي)<br />15 مليون حالة مصابة بالفيرس الوبائي سي<br />80 % من الشعب المصري تحت خط الفقر منهم 25% لا يجدون قوت يومهم<br />فساد اداري وانهيار اقتصادي, وانتشار المحسوبية والواسطة بصورة سرطانية"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200015/http://masr.20at.com:80/article.php?sid=579"

[[comments]]
order = 8
subject = "العميل مبارك"
author = "منصور"
posted = "2006-06-28"
text = "ايها القابع فى ظلمات قصر الرئاسة استفيق من غفلتك اتصدق كذبتك بانك رئيس من الممكن ان تكون رئيس عصابة ولكن لست رئيسا لمصر ولا للمصريين لم تكن يوما ما ولن تكون ايضا يوما ما رئيسا للمصريين فمن يزور الا نتخابات لا يستحق ان يكون مصريا ومن يسحل ويضرب ويهتك عرض المصريين لايستحق ان يكون مصريا ومن يبيع وطنه لبابخس الاثمان لا يستحق ان يكون مصريا ومن يعقد اتفاقيات مع الاعداء ويتحالف معهم على الشعب لا يستحق ان يكون مصريا ومن يتستر على مجرم سنين وسنين ظل يسمم ويسرطن ماكل ومشرب المصريين لايستحق ان يكون مصريا ومن يهرب مجرما قتل الفا من المصريين غرقا لا يستحق ان يكون مصريا ومن يعمل لحساب الامريكان والصهاينة لايستحق ان يكون مصريا ومن صافح الصهاينه ولم تجف بعد دماء من قتلوهم على الحدود من المصريين لايستحق ان يكون مصريا ومن حرق مجمع نور الغد لا يستحق ان يكون مصريا ان تهمة واحدة مما سبق كفيلة بإدانتك بالخيانة العظمى للوطن فمابالك لو تجمت كل هذه التهم فى شخص واحد<br />اهنئك انه انت فلترحل عنا ولتذهب الى الجحيم فإنا هاهنا صامدون ضد الفساد والاستبدا فلترحل ولتاخذ معك ابنيك وامرأتك وحاشيتك ونظامك فلقد كرهكم الشعب فانت ونظامك متهمون بالخيانة العظمى للوطن"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200015/http://masr.20at.com:80/article.php?sid=579"

[[comments]]
order = 9
subject = "ارحل يا فاسد"
author = "شاب عاطل"
posted = "2006-06-28"
text = "من شاب عاطل ماجيستير في القانون ومن ملايين العاطلين يقولوا لك :ارحل يا مبارك يا خائن يا عميل الامريكان والصهاينة , يا مجرم في حق وطنك وشعبك<br />ارحل يقولها ملايين الفقراء والمحتاجين يا مبارك يا سارق قوت الشعب ومسرطن ما تبقي من هذا القوت<br />ارحل قبل ان تجرفك الثورة القادمة التي لن تبقي طويلا خلف السد<br />لا للتمديد..لا للتوريث..لا للعميل مبارك"
