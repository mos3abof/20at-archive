text = "ان هذه الحوارات وان دلت فانما تدل حمورية الريس لأنه ببساطة محدش بيظبطها له<br />زى العادة من مستشار السياسة ومستشار<br />الزراعة ومستشار الكوسة ومستشار الفساد<br />ومستشار الغرق ومستشار الحرق الخخخخخخخ<br />فهو لايعرف ان يتكلم بدون المستشارين بتوعه الى مطلعين عينه فهو يبدوا فى هذه الحوارات فى منتهى البلاهة ولايبدوا فيها الا كحمار لايعرف شىء عن اى شىء سو الضربة<br />الجوية الى هو كان قاعد فيها فى غرفة من الزجاج بينه نسى يقول لهم شيلوا اللقطة دى وحطونى فى قلب الطيارة علشان يبقى<br />بجد صاحب الضربة المخفية."
archived = "2006-06-28"
