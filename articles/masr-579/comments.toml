[[comments]]
order = 0
subject = "وكان بيجيب بدل منين يلبسها في كل حوار من دول ؟؟؟ ناس أغنياء صحيح"
author = "محمد السيد"
posted = "2006-06-27"
text = "إيه يا عم الجمال ده بس ...<br />طيب والله صعبان عليا ... وجالك قلب تدور وراه كل ده ؟؟؟<br />ولا مش بعيد تكون شفت لك كام حوار منهم كمان ولا حاجة ...<br />بسس انسي .... إيه رأيك في كل الحوارات دي ... ولا نجوم السيما ...<br />وبعدين ليه مكملتش سيرة حوارات العائلةالكريمة ... ؟<br />المدام .... فاكر كلامها عن مكتبة الأسرة ؟؟؟ والاعلانات اللي كانت بتيجي فيها ...<br />تكرهك في القراءة ...<br />ولا مع عالم سمسم ... يا ستااااااااااار<br />ولا الحوار المعجزة للابن المعجزة برضه ... مع لميس الحديدي ....<br />وبرضه مش حاسكت .......<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200015/http://masr.20at.com:80/article.php?sid=579"

[[comments]]
order = 1
subject = "وبص لما المذيع حاول يرمي كلام علي انتصارنا قام فجر له مبني القناة كلها"
author = "محمد السيد"
posted = "2006-06-27"
text = "لا ... وسمعته مرة مع التليفزيون الصهيوني ... لما سأل المذيع عن حرب أكنوبر. ...<br />قام بص له بجنب عينه ...<br />وزم شفتيه ...<br />واحمرت وجنتيه ...<br />وظهر الغضب جليا علي ملامح وجهه العنيد ...<br />وقاله ..... لا لا لا لا روح اسأل قادتك إحنا عملنا فيهم إيه في أكنوبر ....<br />طيب ماتوريناإنت يا عم الحاج .... يا شاطر ... عملت فيهم إيه بعد أكتوبر ....<br />ولا عملت إيه في اي حد في الدنيا ؟؟ ... غير المصريين ... الغلابة ...<br />إحنا يعني ...<br />وبرضه مش حاسكت .......<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200015/http://masr.20at.com:80/article.php?sid=579"

[[comments]]
order = 2
subject = "خبر هام"
author = "مصرى متغرب"
posted = "2006-06-28"
text = "خبر هام<br />بعد الدراسه والتحليل والتفصيل وبعد ان عكف نخبه من المع الخبراء المصريين والعالميين عن دراسه الظواهر التاليه والوصول الى اسبابها نتج الاتى<br />1- ظاهرة تخلف الطفل المصرى والعته الذى يتمتع به اطفالنا وكرههم الشديد للقراءه<br />السبب/ ظهور ماما سوزان فى برنامج عالم سمسم واعلانات القراءه للجميع<br />2- ظاهرة تخلف شباب الجامعات وهبلهم وعدم اقبالهم على الحياة<br />السبب/ لقاءات شباب الجامعات مع اسم النبى حارسة وصاينة السيد جمال مبارك وبردة ظهور ماما سوزان فى برنامج عالم سمسم<br />3- ظاهرة العته والعبط الى مسيطرة علينا ان احنا 25 سنه بنسمع نفس الكلام وبنصدقه من نفس الراجل وبردة ظهور ماما سوزان فى برنامج عالم سمسم<br />هذا ولما فشلت اللجنه فى علاج هذة الظواهر انبثقت عنها لجنه اخرى التى بدورها شكلت لجنه جاء بيانها الحتامى فى كلمتين<br />مافيش فايدة مافيش امل<br />هذا وقد انتحر جميع اعضاء اللجان اعلاة<br />وسمعنى اغنية الست نانسى اطبطب ادلع"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200015/http://masr.20at.com:80/article.php?sid=579"

