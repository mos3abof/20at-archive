[[comments]]
order = 17
subject = "يا حو,,,,راتك ,,,ياريس"
author = "مكرم مصرى"
posted = "2006-06-28"
text = "اولا صباح الخير يا مصر اسف وارجو ان تقراء على مصر اليى كانت مصروكان كل وحد ياحب التانى هذ زمان,, والانالكل يتكلم ذى ابو الهمل وانتم مافيش حب على بعض يبق الريس على حق الريس والعائلة الكريمة حرمية مثل على بابا ونصف البلد الاربعين ,,,, والربع كدب ورشوي وبتاع كلم بسواربعالاخر مش عرف لا يسرق ولا يتكلم حتى ولا يمشى لانة ميت من الجوعــ ارجو ننظف انفسنآ الاول وبعد نشوف على بابا وحرمة وابنة ــ وارجو ان ننظر الى الحقييقة ونبطل خدع وونشوف الفلم الجديد ــ البنات والشياشة والموادة الجديد الاعنية الفسدة وكان اكثر من ذلك وكل واحد يعلم كل شئ لذم ان ننظف انفسنا ونطهرة ـ لان موضوع على بابا هذ بسيط بس وكل واحد يرشح نفسة ويعمل عصابة 40 ال يجرة ورة بدون اى تفكير لان ماذا الجهل حتى لو متعلم وللة جاهل عن الدنيا ـ الف خسرة يا مصر والف خسرة على شباب مصر 73 و67 ماتو كل شباب على شان شويت هوبل الا عمل ريس والا عمل حسب والا عمل وعمل والبلد خربيت والان واحد امين شرطة يوقف بلد اة اة اة ااموال ريس يعمل اة خسرة عليكى يا مصر ارجو ان نقراء الكتاب الكريم صح بدون تفسير شيطانى والانجيل ارجو ان يقراء صح ايضآ وارجو عدم الحقد الحقد على بعض لان مصر هى زمان وهى الان بس الناس هى ,,,,,’’’ الف خٍـــــــــٍٍرة ـ يا عم سعد زغلول ومصطفى وانت عرفين وانا اســـــــف جهل وفقر ومرض وسرقى وكدب ونصب و و و = مصر لية البلاد تتقدم ونحنوة الى الوراء لماذا كل فرد فى مصر لباس القفطان وعمل شيخ وهو ليس يقراء الكتاب الكريم لماذا هل هو التقدم والاخر ينظر الى التلفزة ويقول انا متعلم والاخر يغش فى الامتحان ويقول ـ د ـ وم و محامى و وووو ونعلم ان المدارس الان صغفر والدروس آآآ هذة مصر والنصب فى التجارة يقول ا<br />اقرأ بقية التعليق .."
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200015/http://masr.20at.com:80/article.php?sid=579"

