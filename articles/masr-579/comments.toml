subject = "طب كرامتي ياريس"
author = "مقهووووووور من تلفزيونك الاسرائيلي ياريس"
posted = "2006-06-28"
text = "...أكتر تلفزيون بيحاوره سيادته ..الاسرائيلي!!!<br />اللهم عليك بالكلاب ولاد الكلابالذين عاثوا فسادا...<br />كرامتي ليه بتضيها يابابا حسني لما تحاورهم وتروح للزفت بتاعهم ده؟؟؟<br />ارجوك انا مش فاضللي منك غير الكرامة..<br />سيبهالي اعيش بيها..مش كفاية مفيش حاج ة تاني ليا!!"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200015/http://masr.20at.com:80/article.php?sid=579"

[[comments]]
order = 5
subject = "بطل ... بالصدفه"
author = "مصري موجوع"
posted = "2006-06-28"
text = "مش عارف ليه كل ما افتكر بطل الضربة الجوية افتكر هدف مجدي عبد الغني في كأس العالم بإيطاليا والذي بسببه كبس علي نفسنا كمعلق وعضو مجلس ادارة وخبير كروي ومقدم برامج تليفزيونية (الله يرحم مجدي مقشه) صاحبنا برضه بطل الضربة الجوية ... هو قواتنا الجوية ماكنش فيها طيارين غيرة يعني ولا ايه ... يعني الباشا كان بيسوق اربعين طيارة في نفس واحد ... اي نعم القوات الجوية كانت سبب رئيسي في حرب اكتوبر المجيدة هذا لاينكره الا الجاحدون ولكن هل لم يجب علي الشعب المصري ان يقوم بذكر مناقب تلك الضربة اي ان يرث الله الارض وماعليها ... ياعم الفاتورة وبنسددها من لحمنا الحي من 25 سنة ياترى فاضل فيها تسديد كام سنة ... ياترى رنا عبد الرحمن اتجوزت ولا لسه<br />وتضامنا مع الاستاذ محمد السيد اقول<br />برضه مش ح اسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200015/http://masr.20at.com:80/article.php?sid=579"

