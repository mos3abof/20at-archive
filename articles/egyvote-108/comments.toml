[[comments]]
order = 0
subject = "هو فين حزب الوفد"
author = "ناهد"
posted = "2005-12-08"
text = "ان كان زمان فيه حاجة اسمها حزب الوفد ولكن الظاهر أن نعمان جمعة أصاب الحزب في مقتل ،الموضوع في غاية الشقاوة"
archived = "2006-01-04"
capture_url = "https://web.archive.org/web/20060104150847/http://egyvote.20at.com:80/article.php?sid=108"

[[comments]]
order = 1
subject = "من قال هذا"
author = "عمرو"
posted = "2005-12-11"
text = "ن قال أن مصر تدين بدينيين يا أستاذ فخري والواضح أنك لم تقرأ الدستور أو فاكر أن رقم 10 مليون قبطي رقم يخوف بس مين قال أن هذا الرقم صحيح من أصله وتبع أي أحصائية مصر دولة اسلامية فقط وبلاش الادعاءات حيث لا يوجد لها مكان في السياسة"
archived = "2006-01-04"
capture_url = "https://web.archive.org/web/20060104150847/http://egyvote.20at.com:80/article.php?sid=108"

[[comments]]
order = 2
subject = "مافرقش عن غيره"
author = "هانى"
posted = "2005-12-20"
text = "تفق مع الاستاذ منير ان نعمان هو اسوأ وفدى فى التاريخ ، وإن قرارته انفعالية وغير موزونه وده واضح فى كل لقاءاته وحواراته ، بس انا رأيى ان الراجل معذور هو يعنى مايفرقش كتير عن الصباحى او الاقصرى او العجرودى او شلتوت كلهم طينه واحده ، منتفعيم واصحاب مصالحز وبنا يستر على الاستاذ منيرلما يبقى رئيس الحزب"
archived = "2006-01-04"
capture_url = "https://web.archive.org/web/20060104150847/http://egyvote.20at.com:80/article.php?sid=108"

