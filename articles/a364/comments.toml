subject = "مرك بر امريكا"
text = "اعتقد انه حان الوقت كي ندرك اننا لن نحصل على اي حق الا ونحن نرتدي اكفاننا استعدادا لموت صار مجانيا<br />والله برافو على طلاب ايران ومرك بر امريكا"
