author = "جيمــــي"
posted = "2009-09-29"
text = "فى تالتة إبتدائى كنت رئيس الفصل وكنت فرحان اوى علشان حاسس أنى ليا سلطة على الأطفال الى انا طفل زيهم ، بس فى نفس الوقت والدتى كانت قالتلى انى اموت أو افقد أى حاجة ولا أنى افتن على زمايلى … وده الى أتفاجئت بيه بعد فترة ، وعرفت انه مستحيل انى اكون رئيس للفصل وفى نفس الوقت أحافظ على مبدء متربى عليه …<br />وعلشان كدة حكومتنا كلها فاسدين وناس من غير مبادىء و عندهم أستعداد يبيعوا ابوهم علشان يعلوا اكتر واكتر<br />زى ما ظابط الشرطة فى كل قسم بييجى على آخر السنة ويعمل حملة يلم فيها شباب كتير و الى شاكله يدى على سوابق يروح ملبسه أى قضية من القضايا الى لسة ما اتقفلتش و الى مقيدة ضد مجهول .. علشان يبان أنه شغال ويترقى و علشان رئيسه يتنقل لمكان أكبر .<br />مصر أساساً ماشية غلط حتى فى إدارة الفصول ، عايز تبقى رئيس يبقى تقول حاضر ونعم و تحت امر سيادتك وبس"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014533/http://www.20at.com:80/masr/ebn-balad/13565-2009-09-29-13-08-06.html"

