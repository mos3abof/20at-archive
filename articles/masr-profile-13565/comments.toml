[[comments]]
order = 4
subject = ""
author = "شنكار يا الفا 2"
posted = "2009-09-30"
text = "هل استفدنا من مواد الانشطة اللى هى الاشغال والتربية الفنية والتربية الزراعية وجماعات التصوير فى المدرسة الاعدادية<br />نعم<br />فاذكر اننى عندما اردت الزواج وذهبت مع زوجتى واهلها لشراء اثاث البيت وبالطبع كان معنا نجار موبيليا ولكننى كنت فاهم وعارف اميز انواع الخشب واعرف افرق بين الخشب الزان والخشب السويدى والخشب الاحمر والخشب الماهوجنى وكذلك خشب شجر الكافور والسنط والتوت المحلى وكل ذلك بفضل مدرس الاشغال بتاع المدرسة الاعدادى<br />اما عمل المربى فى البيت فذلك مثلا لانك لا يمكن ان تجد فى السوق مربى البلح السمان<br />فاضطر لعمل مربى البلح السمان كما تعلمتها فى الاعدادى وعلمتها لزوجتى واولادى<br />اما التربية الزراعية<br />فا انا اراهن اذا عرف شاب انواع الزهور<br />وهل يستطيع ان يميز زهرة الست المستحية من زهرة القرنقل او البنفسج<br />والمصيبة انهم يتكلمون عن تطوير التعليم وهم يخسفون بة الارض<br />ارجعوا الى تعليم زمان<br />تعليم ايام عبد الناصر وسيد يوسف الوزير الذى خرج لنا زويل ومجدى يعقوب"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014533/http://www.20at.com:80/masr/ebn-balad/13565-2009-09-29-13-08-06.html"

[[comments]]
order = 5
subject = ""
author = "شنكار يا الفا"
posted = "2009-09-30"
text = "كل ما اذكرة<br />ان رائد الفصل بتاعنا كان مدرس اشغال فى المدرسة الاعدادى<br />ايام عبد الناصر اللة يرحمة كان فية وزير تربية اسمة سيد يوسف وكانت المدارس بتعلم بجانب العلوم مواد انشطة<br />ومواد النشاط كانت تربية زراعية وتربية فنية واشغال وكان فية مدرس تربية زراعية فى المدرسة الاعدادى عبارة عن مهندس زراعى بيعلم الطلبة عمل المربى وبيعملها عملى وانواع الزهور والتعرف عليها ومدرس الاشغال بيعلمنا النجارة وعدة النجارة وعمل اشغال نجارة صغيرة وصناعات جلدية وكنا بنعمل صنادل ونخيطها ونتعلم تشميع الفتلة<br />المهم كان مدرس الاشغال بيوقف الالفا او اول الصف جنبة وهو بيقوم بشغل النجارة يناولة العدة زى المنشار والشنكار<br />وكان فى الورشة يقول دايما<br />شاكوش يا الفا شنكار يا جهينى<br />واللة التعليم زمان كان رائع<br />منهم للة ولاد الكلب اللى خربوة"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014533/http://www.20at.com:80/masr/ebn-balad/13565-2009-09-29-13-08-06.html"

