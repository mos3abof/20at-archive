text = "كان زمان اللى بيطلع الاول على الفصل دراسيا وبيجيب اكبر مجموع فى الدرجات هو اللى بيطلع الاول وبيقف الفا على الفصل وبيكتب اسماء اللى بيعملوا هيصة واللى بيقوموا من مكانهم واللى بيخرجوا للطرقة<br />انما دلوقتى الموازين اتغيرت<br />المدرس بيختار ولد شمحطى طول بعرض غتت ورخم ومش مهم كسلان دراسيا وبليد المهم يسيطر على الفصل ويسكتة<br />الدنيا اتغيرت"
archived = "2009-10-03"
