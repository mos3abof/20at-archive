text = "هههههه يا اخى حرام عليك<br />متسلط وحاد النظرة و له كتير من الخصومات … اممممـ يمكن في العادة<br />انا كنت رئيس الفصل امينة الفصل في سنة من السنين ما كنتش شريرة اوى كدا هههههه بالعكس نوو خصومات خالص الا مع الفصول الاكبرمنى اووف دايما نتخانق<br />تصدق؟!<br />وفي امل السنة الجاية كمان ممكن!!"
