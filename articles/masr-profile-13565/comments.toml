subject = ""
author = "الى المعلق السابق"
posted = "2009-09-29"
text = "هو من البداية نظام التعليم فاشل<br />لو نظام التعليم صح لا تسمع ان ظابط شرطة مصرى لفق تهمة او ضرب او اهان او عذب مواطن مصرى مثلة<br />الكلام دة مش فى الهند لية<br />مش فى بريطانيا لية<br />مش فى بنجلاديش لية<br />المواطن بيحترم انسانية المواطن التانى مهما كان درجة تعلمة بل على العكس لما بيكون فى وظيفة ومتعلم وبييجى واحد عندة مش متعلم او كبير فى السن بيحترمة اكتر وبيحل مشكلتة الاول مش بيتعالى ويتعجرف<br />فية ميراث من التعامل بنتعامل بة مع بعض من العهد التركى بمعنى السيد والعبد الموظف الميرى اللى بيمثل سلطة الاحتلال والمصرى الغلبان اللى بيخاف وبينضرب على قفاة كان فية احتلال تركى لمدة 400 سنة<br />وكان المواطن المصرى فى عين السلطة فلاح خرسيس<br />ولما سالت واحد تركى عن معنى خرسيس اللى كان اجدادة بينادوا اجدادى بها ضحك وقال لى معنى خرسيس يعنى حرامى<br />كلنا لم نتعلم صح"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014533/http://www.20at.com:80/masr/ebn-balad/13565-2009-09-29-13-08-06.html"

[[comments]]
