[[comments]]
order = 1
subject = "تذكرتين ( هما اتنين )"
author = "كرميلينو"
posted = "2006-03-22"
text = "الموضوع مليان اخطاء املائية فمثلا ثلتوا ان مرات ناصر اسمها تحية مرة و مرة فتحية و حرب 48 بقت 84 سبحان الله<br />اللي عمل كده لازم ياخد جزائه لان الموضوع مش بطال و الاخطاء دي بتخنق اللي بيقرا و السلام للجميع و لهبوب بالخصوص ( جواب مسوجر )"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205706/http://masr.20at.com:80/article.php?sid=52&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

