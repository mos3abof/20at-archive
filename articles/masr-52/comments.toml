[[comments]]
order = 8
subject = "هو ده لقب ولا مهنة"
author = "مصرية"
posted = "2006-04-20"
text = "هو إسم سيدة مصر الأولى ده لقب ولا مهنة وهو مين إللى إدهولها وهى عاملت إيه غير إنها بتنهب أموال الجمعيات الوهمية النسائية التى تحصل على تمويلها من الغرب وفلوس مكتبات الأسرة الباهظة وتحولهم لحسابها برة يا جماعة إللى بتعمله ده علشان تلمع صورتها أمام الإعلام فقط لكن الواقع يؤكد تدنى مستوى المرأة فى مصر فأين حقوق المرأة المعيلة المسئولة عن تربية أبنائها بمفردها وأين حقوق المرأة الريفية المنهوبة صدقونى إللى بتعمله ده علشان كان نفسها تأخذ جائزة نوبل للسلام وده بس للإعلام الغربى لكن أحنا فى مصر عارفين أنها ناهبة فلوس الجمعيات النسائية الوهمية وباعدين حكاية حضورها لمباريات الكورة ده علشان تعمل شعبية لنفسها علشان كان نفسها تبقى نائبة للرئيس ويبقى زيتهم فى دقيقهم عشان فسادهم ما يتعرفش برة لكن سيدة مصر الأولى والأخيرة هى كل أمرأة أعتقل زوجها وربت أولادها بمفردها وحسبى الله ونعم الوكيل"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205706/http://masr.20at.com:80/article.php?sid=52&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"
