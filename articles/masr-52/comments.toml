text = "ايه يا موقع انتوا مش جوزتوني ليه في مادالوكنتي خديجه لاه كددا حزعل<br />انتو نسيتو اخص علي كدا وزغروده جامده عشاني \"الاولي'<br />والاخيره يايابشر."
