[[comments]]
order = 3
subject = "تعالوا زورونا"
author = "ابن البلد"
posted = "2006-03-22"
text = "ايه يا ابا انت وهو، ماله الموضوع...<br />شوية أخطاء املائية.. وإيه يعني..<br />وبعدين الغلطة التاريخية الوحيدة هي ان المحرر كتب 84 بدل 48 .. يعني هو كان عارف التاريخ بس غلط في كتابته..<br />ناس ميعجبهاش العجب ولا الصيام في رجب ولا حتى تاكسي العاصمة..<br />وبعدين يا رجالة الصفحة لسة جديدة وأكيد الاخوة لسه بيجربوا ..<br />واللي عنده كلام عايز يقوله.. واللي ليه نفس يكتب.. يتفضل يبعت على ميل الصفحة .. سامع ولد بيقول انه ميعرفوش.. أهو يا عم..<br />weladelbalad@20at.com<br />سلام<br />ابن البلد"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205706/http://masr.20at.com:80/article.php?sid=52&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

