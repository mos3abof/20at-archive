[[comments]]
order = 0
subject = "صحافه 00000اااااااااااااااه"
author = "الاستاذشيكو"
posted = "2006-05-30"
text = "انا بصراحه مش شايف ان فيه فرق بين سمير رجب والللي جه بعده سي محمد بيه ابراهيم<br />كل اللي حصل بعض التعديلات عشان لزوم المرحله اللي جايه 00000 لزوم البروباجندا<br />وان فيه ديمو 000 ديموقراطيه يعني<br />يا سيدي كلهم زي بعض ولا ايه<br />شوف مقال الاسبوع اللي بيكتبه رئيس التحرير في الجمهوريه كله شتيمه في الاخوان والاحزاب المعارضه وكفايه 0000<br />وبعدين شويه حكايات قبل النوم واخبار السفرياتبتاعه الريس وكلم مين ومين كلمه وكل الدنيا كانت مستنياة والدنيا كلها بتحبه وتحترمه وكاننا في مصر<br />التخين فيهم تقعد تفطص علي نفسك من الضحك لما تقرا حاجه من كتاباته"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132612/http://masr.20at.com:80/article.php?sid=403"

[[comments]]
order = 1
subject = "لعن الله أمثالكم"
author = "Masrat"
posted = "2006-05-31"
text = "لعن الله أمثالكم و \"تمكرون و الله خير الماكرين\" إرحموا أنفسكم من كثرة اكتسابكم للذنوب حتى تستطيعوا أن تتحملوا عذاب الآخرة و كفاكم عذاب الدنيا<br />أنت لستم في نعيم بل نحن من ننام مظلومين و ليس ظالمين يا بخت من نام مظلوم و لا بات ظالم<br />الحمد لله على ما نحن فيه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132612/http://masr.20at.com:80/article.php?sid=403"

[[comments]]
order = 2
subject = "سؤال سازج جدا"
author = "احمد طارق"
posted = "2006-06-01"
text = "السيد رئيس الحمهوريه كل يوم بيقول انه ديموقراطى ماشى حنصدقه<br />طيب الديموقراطى اكيد بيؤمن بتداول السلطه<br />يعنى ببساطه ان ممكن ييجى يوم ويكون هو فى المعارضه<br />فهل يرضى مبارك عندما يكون فى المعارضه ان يضرب بالجزمه ويسحل ويبرك على صدره خمسه من الحوش والاوباش ضباط السافاك اسف قصدى ضباط الداخليهويتهكوا عرضه وعرض المحروس جمال"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132612/http://masr.20at.com:80/article.php?sid=403"

[[comments]]
order = 3
subject = "واحد و الله"
author = "نيفين"
posted = "2006-06-01"
text = "الرقص فوق الحبال<br />و قرب و بص و جلا<br />بيغير الاحوال و ينعنش المساله<br />لعيبه فيهم كبير<br />وفيهم ضعيف و فقير<br />الضعيف انداس<br />اما القوى فلا<br />اوعى تخاف م القوى اللى يقوللك انا<br />منفوخ و فاضى و هوى مستقوى من ضعفنا<br />اذاكان لابد الموت<br />اصرخ بعلو الصوت<br />جايز بشر يسمع<br />و يوصل اللى انتهى"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132612/http://masr.20at.com:80/article.php?sid=403"

[[comments]]
order = 4
subject = "دعوة للتغير"
author = "مهزلة"
posted = "2006-06-01"
text = "عم سمير الله يرحم ايامك<br />هو ده من دواعى التغير زمان كنا نفكر ان ايام سمير رجب مفيش اسود منها وكنا بنترحم على ايام زمان ودولتى برضه بنترحم على ايام عم سموره مش ده تغير مش عيب تكون من المويدين لشخص او المعارضين و ممكن تنقلب من كده مويد لكده معارض هى ده الديموقراطية<br />و بتقولوا البلد مفهاش ديموقراطيه<br />البلد مليانه كل حاجه من الابرة للصاروخ حتى النووى بتاع ايران احنا سبقنها فى عمله وكمان العيش التوتست برضه موجود و البطاله مفيش والعيشة زى الفل<br />عيب نتهم واحد بس انه كان مش محترم خد عندك واحد زى عم ابراهيم نافع كان مش ديموقراطى و مالى جيبة من الديموقراطية وعم ابراهيم سعده برضه راجل ديموقراطى صرف علشان لما عرف انه هيتغير عمل حته ديموقراطية و استقال لزوم الديموقراطية<br />و عم سمير رجب راجل ديموقراطى شوف دلوقتى تلاقيه ملون جلده من مويد لمعارض لمويد لمعارض علشان ديمواقرطى<br />يعنى ايه ديموقراطيه بالصلاة على النبى علشان الواحد يبطل تخبيط فى الحلل"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132612/http://masr.20at.com:80/article.php?sid=403"

[[comments]]
order = 5
subject = "سمير رجب = رجب سمير"
author = "البحر"
posted = "2006-06-05"
text = "شالوا الدو وحطوا شاهين الدو قال منتوش لعبين 000 يا ناس يا طيبين جدا المساله مش مساله تغير القيادات فى الصحف القوميه كل دا شغل بيتم على نار هاديه ازاى يا بحر يا فتك اقوال لك ازى يا صاحبى لما كل قياده من دول الان اتفتحت عليها نيران الاتهام بالمحسوبيه والرشوه والتربح واستغلال النفوذ الان وبسرعه بعد ما اتشالوا علشان مع التغير الكبير اكيد حيحصل ان فى ناس كتير حتهلل للقياده الشابه الواعده اقصد طبعا العبو للمستقبل يبقى الناس اللى عبرت فى الماضى عندها اللى يشغلها<br />طبعا بلويهم وصفقاتهم المشبوهه ومن الاخر كدا وعلى بلطه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132612/http://masr.20at.com:80/article.php?sid=403"

[[comments]]
order = 6
subject = "سمير ايه اللى انت جاى تقول عليه"
author = "هند يوسف كمال"
posted = "2006-06-09"
text = "انتم غلابة طحن بجد بجد سمير ايه اللى احنا بنتكلم عليه عندكم الاستاذ عمرو عبد السميع و الاستاذ ممتاز القط والسيد اسامة سرايا كل دول اسخم مليون مرة من سمير والمصيبة بجد الناس اللى بتبيع قلمها من غير ماتبين زى عادل حمودة اللى مقالاته فى الفجر بتين وبصراحه توجهه الجديد عادل المتشدق بالحرية ولامانع عنده من الدفاع عن الرئيس وبطانته بطريقة اصله مايعرفشى اصله مادريش ده جمال ده حلو ده انيق ده جذاب ده مش عايز يمسك الحكم استريحتوا وتلاقيه يحط الكلام على لسان ناس تانية ولكنك لاتجد الا تاييد ومباركة من بس حاجة كدة فى الخباثة ده غير طبعا فزاعة الاخوان اللى مابيبطلش يتكلم عنها بكره الاخوان يشنقوا زكريا عبد العزيز مع ماهر عبد الواحد ويسجنوا هيكل مع اسمامة سرايا وكاننا قصر بريالة لاندرى اين مصلحتنا وكان الاخوان مسيطرين علينا سيطرة تامة<br />كلام غريب وعجيب وما اكثر من يبيع قلمه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132612/http://masr.20at.com:80/article.php?sid=403"
