text = "الف تحية للقضاة ،الف تحية للشرفاء من ابناء الوطن فى كافة مجالاتهم ،واؤكد انه طالما ظل مثل هؤلاء القضاة والصحفيين والمحامين والمهندسين وغيرهم من شرفاء الامة فلن تضيع ."
