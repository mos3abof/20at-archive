[[comments]]
order = 1
subject = "أسلوب حضارى"
author = "يوسف الاسكندرانى"
posted = "2006-06-03"
text = "الاسلوب الذى يقـترحه عظماء مصـر<br />بجلسات استماع مستمرة ودائمة هو<br />اسلوب حضـارى مفيد للجميع<br />مفيد أولا للـحكومة منه تعـرف كل<br />مايإن منه شعبـهافربما تمكنت من<br />رفع الكثـير او القلـيل من هـذا<br />الظـلم فتجد لها أنصار حقيـقيين<br />سـيكونون أوفـى لهامن المبـررين<br />المزيفين المأجورين و يجد دكتور<br />نظـيف رداعلى تسـائله لمـاذا لا<br />يصـدقوننا؟؟؟<br />مفيد ثانيا للحـزب الحاكم ليعرف<br />الرد الشـافى على تسـاؤل قياداته<br />بعد هزيمته السـياسية الموجعة فى الانتخابات البلمانية الاخيرة لمذا<br />لا يردوننا؟؟؟ وتجد لجنة السياسات<br />أن ارادت ما لم تجده عند قياداتها اللذين لفظهم الشعب<br />مفيد ثالثا لشعبنا نتعلم منه لغـة<br />غابت عن كيفبة عـرض مشاكلنا و أدب الحـوار وإحترام الآخـر وأعتقد أنه<br />سوف يساعد على تغيير شيئ ما بدرجة<br />ما<br />و أرجو أن يحضر جلسات الاستماع آخر الاساثذة المحترمين فى مصـر قبل ما يودعونا بطرق مختلفة فحضورهم يعطى للجلسات مصداقية واعلام بل واحترام<br />غـاب كثيرا عن حياتـنا حتى اسلـوب<br />اعتراضـنا فأنا أقبل أن تقـاوم من<br />أجل حقـك بكل الوسـائل ولكن حـدود<br />الادب واللياقة والمقدسات تبقى سقفا<br />لى ولك وللجمـــع"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224323/http://masr.20at.com:80/article.php?sid=438&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

