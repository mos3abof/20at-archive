text = "بص يا استاذ ياللي داخل باسم مجهول اولا كل سنة وانا طيب وثانيا انا هقولك علي حاجة تعملها ولو عايز تعملها اعملها بس هي ان شاء الله هتجيب نتيجة بص اذا كان كل اللي بينك وبين الانسانة اللي بتحبها مجرد نظرات او ابتسامات اعجاب اوخجل فا متنتظرش منها انها تيجي وتقولك من فضلك انا عايزة رقمك او انا معجبه بيك او الكلام دة لا البنت بتحب الولد اللي مديلها اهتمام مديلها شخصيتها قدام الناس بيعاملها معاملة خاصة شويه كدة يعني ولو هي تقيلة شويه انت كمان اتقل حبة بس مش قوي علشان الطبيعي ان البنت بتبقي مستانيا من الولد الدافعة علشان تبدا علي الاقل تتكلم معاه حتي لو مفيش في نيتها اي حاجة يعني مثلا اتحجج ان ورق الدرس مش معاك واطلبه منها بس بشياكة ومش تكسفها قدام صاحباتها وبعد شويه اطلب رقمها علشان لو عايز تسالها علي معاد الدرس او اي حجة يعني وكدة وبعدين لو حاولت تقرب وهي حسيت منها انها مش متقبلة الموضوع بلاش تكرر المحاولة الا لما هي اللي تحاول معاك فاهم؟ ؟؟ وخليك في الحنين وربنا يوفقك سلاااااام"
