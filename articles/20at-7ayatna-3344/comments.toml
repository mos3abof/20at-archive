[[comments]]
order = 224
subject = ""
author = "بهاء"
posted = "2009-11-30"
text = "على خدي أحط إيدي<br />واعاود ذكرى أيامي<br />وأدور احلى ما فيها<br />وأشوفك أنت قدامي رحـــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــ بحبيكــ ـــــــــــــــ ــــــــــــاب"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 225
subject = ""
author = "بهاء"
posted = "2009-11-30"
text = "أحلى مافيك كلك<br />وكل ما فيك أحلاك<br />وقلبي وكلي يحبك<br />ومحد عندي يسواك !<br />يارحاب"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 226
subject = ""
author = "بهاء"
posted = "2009-11-30"
text = "حضنت حبك بقلبي وخليت نوره بصدري لانك عمري وقلبي احبك حيل وربي<br />كل ماجيت أعبر لك<br />عن شعوري والغرام!<br />أبقى سارح مثل<br />طفل ماعرف نطق الكلام<br />أنت أستاذ العشق<br />وأنا طالب في صفك<br />وأعتقد إني ناجح<br />لأني أموت في حبك"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 227
subject = ""
author = "شمس"
posted = "2009-11-30"
text = "ايه هو مفيش حد هنا ولا ايه اخرج يعنى"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 228
subject = ""
author = "شمس"
