text = "بصراحة يامهاب ماتزعلش منى ان ده عيب فيك لان انت المفروض ماتديش لحد<br />الفرصة انه يجرحك انا عن نفس بصراحة انه واحد قاللى ماتديش لنفسك الفرصة<br />انك تتكلمى معايا كده بس الواحد بيتعلم من غلطه وانت جربت 3 مرات فالمفروض<br />انك تحط لكل حاجة حد حتى للحب حد وحاول ان الحب اللى جاى يكون اول واخر<br />حب وحاول ماتخليش حد يجرحك وحتى حاول تقرأ كلام night لانه بيتكلم صح جدا<br />ومفيش اى حاجة فى كلامة غلط ولازم ناخد بالنا بردوه فوق او تحت سن العشرين<br />لان انت بردوه يامهاب وكل الناس بتحب بكل كيانها فبيبقى صعب اوى عليهم لما<br />يتجرحو وبالذات من اقرب الناس ليهم اللى هما بيحبوهم"
