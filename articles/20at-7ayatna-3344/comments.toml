posted = "2009-07-21"
text = "انا حبيت اقولكوا حاجه بس ان الحب موجود في كل وقت وفي كل مكان وفي اي سن بس للاسف احنا العيب فينا بناخد من الحب ستاره لحاجات تانيه كتيره اوي يعني في شباب ياخدوه عشان متراهنين علي بنت او عايزين مثلا يوصلوا ليها وبعدين يسيبوها<br />وفي بنات بتاخد من الولد زي مرحله تتباهي بيها ادام اصحابها وممكن كمان تكون وخداه تسليه في الوقت الي ممكن جدا يكون الطرف ده واخده تسليه وتهريج ممكن يكون الطرف التاني بيحبه بجد وده مش يتسمي الا تلاعب في المشاعر وللاسف بيكون نهايته مش تمام<br />وللاسف انا شوفت كتير اوي بس محبيتش كتير هي مره واحده الي حبيت فيها بس اعتقد انه حب بجد بس ربنا يسامحه بقي …بجد نصيحه لاي حد يلاقي حد يحبه يجد مش يفرط فيه"
archived = "2009-07-22"
