posted = "2010-01-19"
text = "تابع<br />قلت إنه اميرة…في أرضها<br />ملاك…في سمائها<br />وأنا اميرلها…<br />إذا ابتسم…رأيت برقاً يتلألأ من فمه … لايعرف الكبرياء<br />فقال أين هي؟؟؟<br />ففتحت له صدري…وقلت هنا مسكنها<br />وعلى قلبي…نقشت إسمها<br />وكلمة أحبك…دائما على فمها<br />فجأة !!<br />تساقطت عليّ أمطار…من السماء<br />بدون غيوم…<br />فوجدتها دموع من عيون القمر؟؟<br />رأى نورا يشع من قلبي<br />أحمله…وهو شرف لي<br />نعم…لقد أبكيت القمر<br />فقال لي…فعلا أنا شبيه لها<br />فقلت صدقت…فأنت تشبهها<br />وضياءك…مستمد من نورها<br />فلأجلك حبيبت<br />سيبكي…القمر<br />ويتفتح…الزهر<br />ويفنى…العمر<br />فأنت نور…في كياني<br />وأنت زهرة…ببستاني<br />أنت أمنيتي…واميرتي<br />التي لم تتحقق<br />وجنة…بقلبي زرعت<br />جروحي بك قد شفيت<br />وأحزاني بوجودك بلا رحمة دفنت<br />فقليل بحقك أن يبكي القمر<br />أحبك"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212092209/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 360
subject = ""
author = "تيتو"
posted = "2010-01-19"
text = "-لاجلك حبيبتي…بكى القمر<br />في ليلة إشتقت…إليك<br />لمخاطبتك …لمناجاتك …<br />لهمساتك…لإبتساما تك…<br />ولم تكوني بالوجود…وليس بالوجود أفضل من حب لك بداخلي موجود<br />كلما نظرت إلى شيء أمامي وجدتك أجمل…وأجمل<br />نظرت إلى الماء…وجدتك أصفى…وأنقى<br />نظرت إلى الورد…وجدتك أحلى…وأبهى<br />تذكرت الوفاء…وجدتك من الوفاء…أوفى<br />وفجأة…نظرت للأعلى<br />رأيت القمر…يسير بكبرياء<br />أمامه نجوم…وخلفه…نجوم<br />أعجبني جماله…فأهديته سلامي<br />أتبعت سلامي…بابتسامه<br />وقلت له؟<br />كم أنت مغرور أيها…القمر<br />ألا تعلم أنني أملك أجمل منك ؟؟<br />فلماذا تتكبر<br />ألم تنظر إلى هذه الأرض؟؟<br />ألم تعلم أن بالوجود…أفضل منك ؟<br />لم تعجبه كلماتي.<br />وقف في كبد السماء!<br />وقال لي…من تكون هذه؟؟؟"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212092209/http://www.20at.com:80/20at/lifestyle/3344.html"

