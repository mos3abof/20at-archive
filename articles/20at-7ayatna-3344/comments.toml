text = "وبالنسبه لموضوع ان الراجل دايما بيشوف اي واحده احلي من مراته ده لان اي واحد اما بيكون معاه حاجه لمده معينه بيبدا يزهق منها واحنا مش هنقدر نلوم الرجل علي كده لان دي طبيعه بس الي نقدر عليه ان الزوجه المفروض تجدد من نفسها علي طول"
archived = "2009-07-22"
