text = "انا للاسف مشعارف اعترف بحبي خايف الاقي رد الفعل مش زي ماانا متوقعة وكمان انا لسة فاضلي سنتين واتخرج وهي اتخرجت مع الملاحظة ان احنا قد بعض ويمكن انا اكبر كمان ومش عارف اعمل اية وخايف اعطلها في حياتها بس اهم حاجة عندي انها تبقي سعيدة وخلاص مش مهم الباقي"
