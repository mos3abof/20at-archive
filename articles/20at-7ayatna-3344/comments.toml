archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 236
subject = ""
author = "رحاب"
posted = "2009-11-30"
text = "احمد انت موجود"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 237
subject = ""
author = "شمس"
posted = "2009-11-30"
text = "ايه رايك ياوائل<br />ادخل فى الموقع ده باسم شمس<br />ولا<br />شــــــمـــــــ ـس لا تـــــغــــــــ يـــــــب<br />انا عاوزاك تقرا كلامى كويس<br />وياريت تحسه بقلبك لانى حساه بقلبى"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 238
subject = ""
author = "شمس"
posted = "2009-11-30"
text = "ايه ياجماعة هو مفيش حد هنا فى الموقع ده ولا ايه"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 239
subject = ""
author = "شمس"
posted = "2009-11-30"
text = "اوك<br />اليسا بتقول<br />بعيد او حنبى وانا فاكراك ولو انت فين انا شايفاك<br />وانا لو مع مين ياحبيبى بقلبى معاك<br />ومحمد نور بيقول<br />عين لو بعيد شايفاك روحى لسة معاك غبت عنى وماله<br />تعال وقوللى بس اشتقتلى ياحبيبى دانت وحشتينى ادينى قبلك قولتها<br />معاك لو حتى طال بعدك سنة مانساش هواك ولا حبنا معقول فى بالك كل ده<br />كفاية بقى لاحسن الاغنية دى انا بحبها اوى ولو الواحد كتب كل حاجة حلوة<br />ورومانسية مش هيقدر يوصف اللى جواه"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 240
subject = ""
author = "NIGHT"
posted = "2009-11-30"
text = "اسف ياشمس كنت فى مشوار فى محطة الرمل ولسة جاى هستناكى الساعة 11 اوك<br />لا طبعا مش زعلان وانا من امتى زعلت منك .هستناكى ماتتاخريش"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 241
subject = ""
author = "شمس"
posted = "2009-11-30"
text = "ايه ياوائل مادخلتش ليه؟؟؟؟<br />على فكرة الكلام انا حساه بقلبى<br />انت زعلت انا واللهى بهزر معاك"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 242
subject = ""
author = "بهاء"
posted = "2009-11-30"
text = "يارحاب انا لما كتبت رحاب بالاجنبى مش انا اللى كتبتها انا كنت داخل موقع وبلصوطفة لقيت الكلمة دى ختها كوبى وكتبتها"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 243
subject = ""
author = "بهاء"
posted = "2009-11-30"
text = "حبنا ماهو غلطه<br />إنتا صقر و أنا بطه<br />إنتا كتاب و أنا شنطه<br />و إنتا قلب و أنا جلطــه"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 244
subject = ""
author = "بهاء"
posted = "2009-11-30"
text = "متخلف<br />مجنون<br />ياويلي ما يحس<br />غبي<br />ما أدري كيف عايش<br />اللي يعرفك وما يحبك"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 245
subject = ""
author = "تيتو"
posted = "2009-12-01"
text = "أجمل وردةٍ قطفتها من بستان حبي<br />كي أفاجئكِ.<br />يا رمز الجمال والذوق والهيام .<br />أغمضي عيناكِ وعيشي اجمل لحضات<br />الحب معي بين ورودٍ حمراء وأجواء هادئه<br />لا تخفي فأنا من ذابت روحكِ فيه حبي انتي"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 246
subject = ""
author = "تيتو"
posted = "2009-12-01"
text = "جف حبري و أشتاق قلمي<br />لعزف أجمل الكلمات والأللحان<br />إعتصر قلبي ألماً لشوقٍ يكاد<br />يذيب الأرواح."
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 247
subject = ""
