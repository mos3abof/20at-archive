text = "الرسايل اللى هتكتبها دى اوحش رسايل<br />اتفقنا نكون اثنين انا الرمش وانت العين اذا مافرقنا القدر ماتفرقنا البشر<br />ـــــــــــــــ ـــــــــــــــ ــــ<br />عطشان والدنيا مطر …<br />والعين ما تشبع نظر …<br />مشتاق يا أحلى بشر ..<br />وينك يا نور القمر ؟؟؟؟؟؟ يارحاب"
