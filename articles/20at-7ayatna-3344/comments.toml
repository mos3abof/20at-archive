text = "الله يسلمك ياقمر كتر الف خيرك واللهى ياوائل انا عارفة انى تعبتك معايا اوى<br />وشيلتك همومى وضيعتلك وقتى معلش انا بس بقو ل الكلام ده لانى انا فى الاخر<br />اللى بزعلك وباجى عليك وانت مابيبقاش ذنبك اى حاجة وانا بشكرك اوى على<br />سؤالك عليا وانت كمان ابقى طمنى عليك وعلى فكرة انا عند عمى فى المرج فى<br />بيت العيلة قاعدة معاه انا وتيتاه لان حازم قدر يخرج دلوقتى الحمـــــد للــــــــه"
