text = "ازيكم كل الى فى الموقع رحاب انا معرفش هخش هنا تانى ولا لاء علشان احنا هنغير بتاع النت هتشترك عند واحد غيرو اوك متزعليش منى بجد والله غظب عنى انا حبيت اقوليك احسن تزعلى منى وممكن مخوشش من غير ماقوليك تفكرينى زعلت اوك ,اول مانشترك فى النت الجديد والله هخش هنا على طول هتوحشينى يارحاب بجد هتوحشينى"
