text = "اهلا يارحاب عاملة ايه"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 229
subject = ""
author = "شمس"
posted = "2009-11-30"
text = "السلام عليكم ورحمة الله وبركاته<br />انا جيت"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 230
subject = ""
author = "NIGHT"
posted = "2009-11-30"
text = "شمس انا موجود دلوقت لما تيجى ابعتيلى"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 231
subject = ""
author = "بهاء"
posted = "2009-11-30"
text = "يارحاب هو انا بكلم مين غيرك انتى شايفة بكلم مين انتى طبعا مش حد تانى على فكرة شاهيناز بتقفل الموبيل علشان مامتها وعلى فكرة هى معهاش رقم واحد هى معها 6 ارقامفهمتى وبهاء بيسلم عليك وتانى مرة الرسايل دى ليكى انتى مش لحد وكل سنة وانتم طيبين يالى فى الموقع هم من هنااااااااااااا اااااااااااك"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 232
subject = ""
author = "رحاب"
posted = "2009-11-30"
text = "احمد انت رسايلك جميله اوي وياترا انت باعتها لمين؟"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 233
subject = ""
author = "NIGHT"
posted = "2009-11-30"
text = "انا بقراء كلامك وبسمعه وحسه وبشوفك بقلبى اكيد ياشموسه .<br />قوليلى صحيح انتى هنا فى اليكس ولا فى كايرو…؟"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 234
subject = ""
author = "NIGHT"
posted = "2009-11-30"
text = "شموسة وحشتينى موووووت"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
