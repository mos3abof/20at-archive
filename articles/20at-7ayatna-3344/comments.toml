text = "أنا في المستشفى أبى اسوي عمليه اضافة قلب لان حبي لك زاد<br />ـــــــــــ رحاب<br />القمر حلو بس هو عالي<br />والذهب جميل بس غالي<br />وانت احلاهم لأنك ببالي<br />\"ـــــــــــــــ ــــــــ رحاب ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />القمر حلو بس هو عالي<br />والذهب جميل بس غالي<br />وانت احلاهم لأنك ببالي"
