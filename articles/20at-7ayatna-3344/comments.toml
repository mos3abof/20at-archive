text = "وحشتيني … وحشتيني<br />يا ساكنة في قلبي وفي عيني<br />يا عمري الجاي وسنيني<br />يا قمري وضي لعيوني<br />وحشتيني<br />يا زهرة الهوى الدافي<br />عيونك بحر ليل صافي<br />رميت قلعي ومجدافي<br />وقلت الموج يرسيني<br />وحشتيني<br />يا ملاكي وكل دنيايا<br />يا نجم عشقته في سمايا<br />يا روحي وعمري ومنايا<br />يا وهمي وعقلي وجنوني<br />وحشتيني<br />دا قلبي دقته باسمك<br />وحلمي رسمته كان رسمك<br />ياللي في جمالك وفي حسنك<br />عمر الحياة ما توريني<br />وحشتيني<br />بحبك أيوه مش خايف<br />وغيرك في عيني مش شايف<br />***********تيتو الاسكندرانى**** *********<br />teto5591<br />yahoo.com"
