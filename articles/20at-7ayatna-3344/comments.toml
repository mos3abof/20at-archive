posted = "2009-07-19"
text = "كملى باقى الجملة ياشمس مش عارف هى غامضة لية معايا ان بدخل هنا مخصوص عشانها وعشان اطمن عليها وهى عارفة انا بخاف عليها اد اية 0 لكن انتى طبعا خدتى من كلامى اللى يزعلك بس والباقى مشوفتهوش 0 والغموض اللى انا اقصدة انك تكلمينى من اليكس وفجاة تقولى انك فى مصر وتقولى مسافرة فجاة الكويت وفجاة لندن ولما بقولى الاميل قولتى ده مشكلة كبيرة وموضحتيش لية مشكلة كبيرة مع انى قولتلك يعنىاية مشكلة كبيرة دة اللى قصدة وانا مش بحسبك كل واحد حر فى حياتى بس انا حبيت اوضحلك انا اقصد اية 0 وعلى فكرة مش هعتبك ولا هزعل من كلامك انك اتعلمتى من (( واحد)) قالك مش تدى لنفسك…وانتى عارفة الباقى ولا هزعل من تلمحيتك بانى جرحتك لانى لو دورنا فى لكام بع1ض ع اللى يزعلنا هنلاقى ولو دورنا ع اللى يخلينا نسامح برضو هنلاقى زى مانتى دورتى كده على الجملة اللى تزعلك وخدتيها وسبتى الباقى"
archived = "2009-07-22"
capture_url = "https://web.archive.org/web/20090722153529/http://www.20at.com:80/20at/7ayatna/3344.html"

[[comments]]
