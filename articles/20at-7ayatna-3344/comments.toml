[[comments]]
order = 74
subject = ""
author = "مهاب"
posted = "2009-07-19"
text = "و احب اشارك ف موضوع night ان فعلا ف ناس بتحب تهرب من الحقيقه<br />مجرد هروب مش اكتر يعني علشان ما يواجهش الواقع<br />يعني حد شايف حياته وحشه من وجهه نظره فبيحاول ينكرها بهروبه من حقيقتها<br />و ف ناس بتحب تهرب بالنوم علشان متوجهش برضه الواقع فهو هروب بس علشان يحاول يعيش نفسه ف حياه احلي من وجهه نظره حتي لو كانت ف حلم او حتي كانت مؤقته<br />و برضه ع موضوع الموت ان الناس شايفينه شر دنيوي لانه بينهي حياه الانسان<br />فمبيكونش عنده فرصه ان يصلح نفسه حتي علشان يعمل حاجه لاخرته<br />اما ع موضوع الشات انا عن نفسي مش شايفه انه حرام لانه وسيله مناقشه و دردشه<br />زيها زي التليفون او لما بتكلم مع صحابك<br />ممكن تكون هادفه و دينيه و تهدف لتصليح الذات و النفس<br />زي ما ممكن تكون برضه سيءه او تهدف لاشياء خاطئه فاي حاجه ف حياتنا ليها وجهين<br />المفروض احنا نحاول نستفيد من الجانب الايجابي اكتر من الجانب السالبي<br />و بصراحه كويز رائع يا night<br />و اتمني اشارك معاكم ع طول"
archived = "2009-07-22"
capture_url = "https://web.archive.org/web/20090722153529/http://www.20at.com:80/20at/7ayatna/3344.html"

