[[comments]]
order = 223
subject = ""
author = "شمس"
posted = "2009-11-30"
text = "لو ان الحب كلمات تكتب لانتهت اقلامى<br />ولكن الحب ارواح توهب فهل تكفيك روحى؟؟؟؟"
