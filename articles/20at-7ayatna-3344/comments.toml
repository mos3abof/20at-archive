text = "ياشموسة ايه رايك انا دخلت باسمى الحقيقى<br />يارب يكون اسمى عجبك وعجب وائل وعلى<br />فكرة انا كل يوم بدخل هنا وببقى نفسى اكلمك<br />بس بلاقيقى مابتدخليش المهم انك تكونى كويسة<br />انا بس بتمنى اى كلمة منك حتى لو كانت ســــم<br />لان السم منك ياعسل يبقى سمسم على فكرة انا<br />بغير عليكى اوى لما بتكلمى حد غيرى لان انا<br />بحبك واللهى وقولى اللى انتى عاوزاه انا راضى"
archived = "2009-06-14"
capture_url = "https://web.archive.org/web/20090614044811/http://www.20at.com:80/20at/7ayatna/3344.html"

[[comments]]
