archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 252
subject = ""
author = "رحاب م"
posted = "2009-12-22"
text = "انا اسفه جدا ياتيتو ماكنتش فاضيه-عموما ازيك واي حاجه عاوز تسالني فيها او عاوز تقولي حاجه قولهالي وانا لما ادخل هارد عليك اوك يلا سلام هادخل بكره باذن الله"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 253
subject = ""
author = "تيتو"
posted = "2009-12-23"
text = "ازيك يا رحاب عمله ايه وايه اخبارك _على فكره اليومين دول مليش معاد محدد لان جهازى بايظ فا بقعد عند اخويا وحسب الجهاز لما يكون محدش قاعد عليه"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 254
subject = ""
author = "رحاب @"
posted = "2009-12-23"
text = "ازيك ياتيتو عامل ايه انا الحمد لله -وانا برده عاوزه ادردش معاك قولي علي ميعاد نتقابل فيه في الموقع هنا وانا اشوف اذا كان هاينسبني ولا لاء"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 255
subject = ""
author = "تيتو"
posted = "2009-12-24"
text = "ازيكم يا جماعه_ازيك يا رحاب والله يا ملاك فى ظروف بتحكم فى اى حاجه الا الحب لو الحب بجد مش هيكون فيه اى مشكله وملهوش اى مكان<br />ولا بعيد ولا قريب انتى الوحيده اللى تعرفى انتى حسه بمين متسأليش حد اسألى نفسك انتى بتحبى مين بجد (دا من وجهه نظرى)"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 256
subject = ""
author = "ملاك"
posted = "2009-12-24"
text = "ازيكو ياجماعة<br />انا بصراحة ماكنتش بفكر فى الحب ده خالص بس فى واحد قاللى انه بيحبنى<br />وانا كمان كنت بحبه بس دلوقتى مابقيش افكر فيه خالص بالرغم من انه لحد دلوقتى بيحبنى ونفسه يكلمنى بس انا قابلت واحد اسمه احمد ومش متخيلين انا بحبه قد ايه وهو بيقعد يكلمنى عن الحب وبيبقى نفسه افضل معاه واتكلم معاه بس هو بعيد اوى عنى وماينفعش اروح المكان اللى هو فيه تانى فانا بصراحة يعنى مش عارفة اعمل ايه ياريت ياجماعة حد يجاوبنى بس بصراحة"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 257
subject = ""
author = "تيتو"
posted = "2009-12-24"
text = "۰۪۫H۪۫۰۰۪۫A۪۫۰۰ ۪۫P۪۫۰۰۪۫P۪۫۰۰۪ ۫y۪۫۰-۰۪۫ ( ♥ ) -۪۫۰۰۪۫N۪۫۰۰۪۫E۪ ۫۰۰۪۫W۪۫۰-(♥ )-۰۪۫Y۪۫۰۰۪۫E۪۫۰۰ ۪۫A۪۫۰۰۪۫R۪۫۰"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 258
subject = ""
author = "تيتو"
posted = "2009-12-24"
text = "ربنا معاكى يا سلمى ولو بتحبيه بجد اكيد ربنا هيقف معاكم بس المهم الصدق فى الحب من الطرفين"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 259
subject = ""
author = "سلمى خالد"
posted = "2009-12-24"
text = "ازيك حبيبي مبسمعش صوتك لى وحشتنى حبيبي بجد وحشتنى"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 260
subject = ""
author = "سلمى خالد"
posted = "2009-12-24"
text = "انى كنتى حبيت بس مفش نصيب وهو كنى بيحبني ولحتى تلواتى اتعولى"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 261
subject = ""
author = "تيتو"
posted = "2009-12-24"
text = "ومين يقدر ينساكى _ازيك يا رحاب ايه اخبارك"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 262
subject = ""
author = "رحاب @"
posted = "2009-12-24"
text = "في ايه ياجماعه مافيش حد بيدخل ليه؟ شكلكوا كده نسيتونا ولا ايه؟"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 263
subject = ""
author = "رحاب @"
posted = "2009-12-24"
