posted = "2009-06-10"
text = "يا رامى ياقليل الادب يااخى حبك برص<br />انت مالكش دعوة بيا ولا بوائل تانى انت<br />فاهم ولا لا وبعدين انت اصلا اللى مالك بيا<br />ولو انت راجل اصلا مش هتدخل<br />هنا تكدب على الناس وتكتب اسم بنت<br />دية بقى تبقى اسمها رجولة<br />ماتزعلش ياوائل ان انا رديت عليه بس هو<br />ضايقنى لما قال انا بحب شمس<br />هو لو محترم عمره مايقول كده<br />وانا اصلا عمرى مااعرفه"
