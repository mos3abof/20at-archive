posted = "2009-08-05"
text = "مقدرش ازعل منك لانى لو زعلت من شمس يبئا مش هيطلع عليا نهار لان مفيش نهار من غير شمس. الف حمدالله ع سلامه حازم سلميلى علية كتير. طنمنينى عليكى وعلية ع طول."
archived = "2009-08-21"
capture_url = "https://web.archive.org/web/20090821044719/http://www.20at.com:80/20at/7ayatna/3344.html"

[[comments]]
