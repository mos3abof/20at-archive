text = "حبيبي !<br />بعد أن أعطيتك قلبي<br />وسكنت بين حنايا الروح<br />كيف سأهديك الورود ؟<br />وكل ورود الدنيا تأخذ عبيرها منك …!<br />كيف سأتقرب منك أكثر ؟<br />و أنت تسكن القلب بين أحشائي<br />وكيف سيقول لساني أحبك ؟<br />وكل نبضات قلبي تقولها لك وحدك يا أغلى الناس ـــــــــــــــ ــــــ رحاب"
