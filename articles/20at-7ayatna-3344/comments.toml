posted = "2009-07-19"
text = "على فكرة ياوائل انا بفهم عربى كويس وشكرا على كلامك الذوق ده<br />وانت بتقول لمريم اه انا حاسس ان فى حاجة غلط وعادى براحتك مش<br />عايز تكلمنى تانى ماتكلمنيش وانا بردوه عارفه ان انت محترم جدا<br />وعمرك ماقولتيلى عاوز رقم التليفون ولا عاوز اقابلك انا بس بوضح<br />الكلام ده لمريم ان انا وانت عمرنا مافكرنا ولا قلنا يعنى الكلام ده<br />ويعنى ايه ياوائل الكلام ده…والله يامريم مش اعارف اقولك اية بس شمس فيها حاجة غامضة كدة محيرانى مش عارف لية هى غامضة اوى كدة معايا …انا عارف ياشمس انك هتزعلى من كلامى بس دى الحقيقة … راجع نفسك وشوف مين اللى غلطان<br />لو حتى قلت ان انا اللى غلطانة عادى عارف ليه لان انا واثقة اوى ان انا مش غلطانة<br />وعلى رايك ده اخر كلام بينا . سلام"
archived = "2009-07-22"
capture_url = "https://web.archive.org/web/20090722153529/http://www.20at.com:80/20at/7ayatna/3344.html"

