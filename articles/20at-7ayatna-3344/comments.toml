text = "شكرا ياشمس على كلامك الذوق وانا اسف لو كنت ضيعت وقتك وانا مقولتش حاجة غلط ولا عمرى غلطه فيكى عشان تتاسفى انك عرفتينى لو قراتى كلامى كويس هتعرفى انى مقولتش حاجة غلط فى حقك بالعكس انا بقولها شمس زى اختى وعمرى مفكرت اكلمها فى تليفون وانى بدخل هنا عشان اطمن عليها وهى عارفة انا بخاف عليها اد اية هو ده كلامى بس واضح انك مش بتفهمى عربى كويس يلا حصل خير وشكرا ياستى على كلامك بس عايز اقولك على حاجة اخيرة وبعدها مفيش كلام بينا تانى بعد اللى انتى قولتية ده انا بدخل هنا عشانك انتى بس وعشان اطمن عليكى عشان اكون جانبك لو احتاجتى اى حاجة لو فكرتى كويس هتلاقى اننا نعرف بعض من زمان اووى عمرى لطلبت اكلمك ولا اقبلك ولا اى حاجة من دى لانى مش عايز غير انى اطمن عليكى بس ده اخر كلام بينا .سلام"
archived = "2009-07-22"
capture_url = "https://web.archive.org/web/20090722153529/http://www.20at.com:80/20at/7ayatna/3344.html"

[[comments]]
order = 70
subject = ""
author = "شمس"
posted = "2009-07-17"
text = "انا على فكرة ياوائل بشكرك اوى انك اتعرفت على مريم وبقيتو تتكلمو عليا واحب اقولك<br />حاجة يامريم وائل عارف انى مابكدبش ويعنى ايه خد حذرك ويعنى ايه فى حاجة غلط<br />وكمان ايه اقول لا لحسن تزعل ماكفاية اللى انتى قولتيه انتى ووائل علياكل ده ومش<br />عاوزانى ازعل شكرا ياوائل ولما انت شايف ان فى حاجة غلط ليه ماقولتيش ولا انت<br />مستنى لما حد يقولك وبعدين يامريم انا محترمة اوى ومعرفش اى حد وكمان مبديش حد<br />رقم التليفون وياريت يعنى يامريم انتى ووائل بعد اذنكو ماتتكلموش عليا تانى ودلوقتى<br />بديت تبان على حقيقتك ياوائل عالعموم انا اسفة انى اتعرفت عليك وماكنتش بدخل على<br />شان ظروف مش لازم يعنى الواحد يعرفها وانا اسفة كمان انى انا اتعرفت على اى حد<br />لان اقرب الناس لينا بقوا دلوقتى اوحش واسوء الناس والواحد نفسة لا يشوفهم ولا يكلمهم<br />تانى ابدا…على فكرة يامريم انا بتمنالك انتى ووائل والناس كلها السعادة<br />وانشاء الله تتجوزى انتى وعمرو وتبقى اسعد واحدة فى الدنيا انتى وهو وانت ياوائل تتجوز<br />اللى انت نفسك فيها يارب ويسعدك وبقولك تانى انا اسفة على معرفتى بيك ضيعت بس<br />وقتك ووقتى وماخدتش غير تريقة عليا"
archived = "2009-07-22"
capture_url = "https://web.archive.org/web/20090722153529/http://www.20at.com:80/20at/7ayatna/3344.html"

