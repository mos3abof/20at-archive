posted = "2009-11-30"
text = "انتِ عصر العشق الجميل والسحر<br />براءه العذراء وصمت الغرور<br />بل عينكى انتِ كل السحره والكهنه والازمان والعصور<br />حبيبتى … ليس بالصعب عليكى قتلى<br />دعى فقط شفتيكى تلمسنى سترين موتى وهلاكى بلا شعور<br />انتِ احلى واجمل الاشياء فى حياتى<br />بل حياتى انتِ والاشياء حولكى تدور<br />تدور كالكوكب حول الشمس<br />ومن انحرف طغى وتلاشى ومات قبل العبور<br />بالله عليكى لا تتركينى<br />اجذبينى اليكى امزجينى بتراب ارضكِ<br />ادفنينى واكتبى قبرى العاشق المسحور<br />فأنا لم اعزف بالكلمات الا من اجلكِ<br />ومن اجلكِ تفانت كل الكلمات والاوزان والبحور<br />فانتى اسراء قلبى من الحياه<br />الى عالم يفوق الاحساس والشعور<br />اه لو علم كل الناس بحبنا<br />لصرنا حديث الخلائق من قبل العصور<br />اه لو يدوقوا حبى اليكى لهاجت الجبال والبحار والصخور<br />لأامتنعت الارض عن الدوران وابا الزمان ان يدور<br />لثارت كل الخلائق حولى وتفجرت قنابل العشق<br />حول اقدام اميره البحور<br />حبيبتى ها انا افقد الصواب وسأبحر اتجاهك<br />ويا خوفى من بلادك عاليه القصور<br />احبك<br />***********تيتو الاسكندرانى**** *******"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

