[[comments]]
order = 191
subject = ""
author = "تيتو"
posted = "2009-11-30"
text = "'أحبها… وحنيني يزداد لها..<br />عشقتها… وقلبي يتألم برؤية دمعها.<br />أفهمها… حين أرى الشوق في عينها…<br />كم تمنيت ضمها… كم عشقت الابتسامة من فمها..<br />والضحكة في نبرات صوتها… لا بل الرائحة من عطرها.<br />سألتها… كم تشتاقي لي؟<br />فأجابت.<br />كاشتياق الغيوم لمطرها..<br />اشتياق الحمامة لعشها..<br />اشتياق الأم لولدها…<br />اشتياق الليلة لنهارها..<br />اشتياق الزهرة لرحيقها.<br />بل اشتياق العين لكحلها…<br />اشتياق قصيدة الحب لمتيمها…<br />بل اشتياق الغنوة للحنها<br />قلت لها<br />كل هذا اشتياق؟؟<br />قالت<br />لا… بل أكثر فأكثر… فأنت وحدك حبيبي في الدنيا كلها…<br />فرحت أتغنى بسحرها… أغزل كلام الهوى بعشقها…<br />ومن أشعار الهوى أسمعها… لا بل لأجلها أنا حفظتها…<br />فاحترت بم أوصفها…<br />قلبي؟؟<br />لا فسوف أظلمها..<br />حبي؟؟؟… ملكتي؟؟؟… صغيرتي؟؟؟… فكل هذا لايكفي<br />فأنا في الحب أعبدها…<br />فروح روحي أسكنتها… ومعبودتي في الحب جعلتها…<br />فيا طيور الحب اوصلوا لها… سلامي… حبي… وبأني أنتظرها…<br />يا كل العالم احكوا لها… عشقي… وهيامي… وكم اشتقت لقلبها…<br />تيتو الاسكندرانى"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201183827/http://www.20at.com:80/20at/lifestyle/3344.html"

