posted = "2009-07-19"
text = "والله يا شمس انا حتي ما بحاولش ادي لحد فرصه انه يجرحني بس مش عارف ممك فعلا زي ما بتقولي ان الواحد المفروض ميحبش بكل كيانه<br />مع ان كل واحد يقول ان احسن حب هو حب العقل بس مش عارف حاولت ف مره اعملها مع الاسف حسيت اني مش هيكون حب حب هيكون اي حاجه تانيه<br />اللي بحاول فيه بصراحه دلوقتي اني احب بقلبي و عقلي بس اهو بحاول<br />و المشكله فعلا يا شمس اني بتعلم من غلطي بس لما بحب بنسي الدنيا حتي بنسي كمان جرحي القديم و المصيبه المفروض اني مش صغير يعني عندي 21 سنه ؟!؟<br />بس بجد اتشرفت بجد من ردك يا شمس و ان شاء الله هحاول فعلا اعمل بيه"
archived = "2009-07-22"
capture_url = "https://web.archive.org/web/20090722153529/http://www.20at.com:80/20at/7ayatna/3344.html"

