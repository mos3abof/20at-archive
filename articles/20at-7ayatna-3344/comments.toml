text = "انا اكتر واحد مبسوط في الدنيا لاني بجب دودي نور عيني بجد يوم ما قولتلها بحبك كانت حاجة صعبة اوي لاني كنت خايف اخسرها لكن الحمد لله انا كسبت احسن حبيبة واحسن صديقة انا بعشق الدنيا لان نور عيني دودي فيها .<br />الكلام اللي قولته ميعبرش عن اي حاجة من حبي ليكي يا دودي لاني بحبك اكتر من اي حد في الدنيا وبعشقك و بموت فيكي يا قمر وانا اراهن لو في حد بحب حبيبه اكتر مني واراهن لو في حد مبسوط اكتر مني"
