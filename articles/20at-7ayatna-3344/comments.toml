text = "بصو يا جماعة انا هفتحلكم موضوع وعايز كل الناس اللى معانا هنا تقول رائيها وتعليقاتها ع الموضوع كل واحد يقول وجهة نظرة فى الموضوع … الموضوع هو<br />((( لية بنهرب من الحقائق الموجوده فى حياتنا …مع اننا كلنا بندعى اننا بنحب الصراحة والحقيقة )) يعنى مثلا نقول ع الموت بعد الشر رغم انه حقيقة وندخل شات وندعى الاحترام ومعرفة ربنا ووقت الصلاة نقوم نصلى رغم اننا عارفين ان الشات حرام وحاجات كتير على هذا النحو … اتمنى كل الناس اللى هنا تشارك بارئها"
