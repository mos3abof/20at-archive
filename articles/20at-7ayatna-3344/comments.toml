[[comments]]
order = 249
subject = ""
author = "تيتو"
posted = "2009-12-21"
text = "السلام عليكم _ ايه ا رحاب انتى وجودى مش هتدخلو ابدا ونتقابل ولا ايه انا بستنى كتير حديكون موجود"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 250
subject = ""
author = "تيتو"
posted = "2009-12-22"
text = "ازيك يا رحاب اخبارك ايه انا مش عاوز اسألك انا عاوز نتقابل هنا ندردش مع بعض ياريت يعنى"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135819/http://www.20at.com:80/20at/lifestyle/3344.html"

[[comments]]
order = 251
subject = ""
author = "رحاب م"
posted = "2009-12-22"
