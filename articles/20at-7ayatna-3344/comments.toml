subject = ""
author = "شمس"
posted = "2009-08-05"
text = "بعد كل اللى حصل بينا ده ياوائل لسة فاكرنى وبتقوللى خللى بالك من نفسك<br />انا واللهى بجد يعنى بردوه مش عارفة اقولك ايه لانى خلصت كل كلامى<br />وانت واللهى تستاهل كلام محدش قاله لحد قبل كده كلام محدش يعرفه غيرك<br />وانا واللهى بشكرك جدا ياوائل وحازم الحمد لله خف شوية يعنى احسن بكتير<br />من الاول وانا حكيتله عليك وهو معجب واللهى بيك اوى وبيشكرك انك كنت<br />جمبى وهو تعبان وكمان على مجهودك وانت بتطمن عليه كل يوم<br />وانا لو دخلت الشات هبقى اقولك وكمان افهمك واحكيلك على حاجات كتير<br />واوعاك تزعل منى احسنلك انا بقوللك اهو من دلوقتى ماشى<br />خلى بالك من نفسك ياوائل وطمنى ياريت كل يوم عليك"
archived = "2009-08-21"
capture_url = "https://web.archive.org/web/20090821044719/http://www.20at.com:80/20at/7ayatna/3344.html"

