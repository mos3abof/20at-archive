subject = "فلان وعلان ودحلان"
text = "حتي من زملاء لنا في العمل عاتبنا بعضهم علي هذا الموضوع..بدعوي انه موضوع ملئ بالمعلومات ولكن بدون ذكر مصدر محدد لهذه المعلومات.<br />وهذا خطأ مهني في الإعتبارات الصحفية ولكنه أمر عادي للإعتبارات الفلسطينية.<br />جيث أننا نلاقي الأمرين مع زملائنا الفلسطينين الذين يرسلون لنا موضوعات جميلة ومتخمة بالمعلومات أيضاً ولكن يطلبون عدم ذكر أسمائهم لخوفهم من بطش السلطة ورجالها أو بطش قوات فلان وعلان ودحلان..!!!!<br />ويلاحظ انه في الأزمة الأخيرة بغزة سالت أطنان الحبر حول كلمتين لا أكثر ولا أقل هما الفساد مطلب فلسطيني ولكن بعض الأطراف تتلاعب بالوضع الفلسطيني..وكلمة هنا وكلمة هناك بلا ايضاح او تحليل.<br />ولأن حالة نبيل عمرو وهو رجل من الداخل \"وفي العملية\" أصبحت تمثل حالة من الرعب تتهدد العديد من الفلسطينين - وهم من خارج العملية ومالهومش دية كما نقول - فيأتي الكلام من تحت لتحت وبأكبر قدر ممكن من التستر علي المصادر.<br />وفي هذا الإطار ننوه إلي أن ملف \"كل رجال عرفات\" الذي نشر فيه ثلاثة بروفيلات عن الرجوب والجبالي وموسي عرفات قد نشرت بإسم مستعار لنفس السبب.<br />السلام عليكم<br />المحرر"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926225254/http://www.20at.com:80/article.php?sid=523"

