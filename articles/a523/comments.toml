subject = "دحلان لـ«الشرق الأوسط»: من حقي انتقاد عرفات لكن لي"
text = "اتهم وزير الدولة الفلسطيني السابق لشؤون الأمن محمد دحلان، أعضاء في اللجنة المركزية لفتح بأنهم معنيون بإبقاء الرئيس ياسر عرفات محاصرا.<br />ورفض دحلان في حوار مع «الشرق الأوسط» في القاهرة، الاتهامات بأن حركة الاحتجاجات التي يقودها هدفها الوصول الى السلطة، وقال «لا أطمح في أن أكون مكان الرئيس عرفات وهو يعلم ذلك جيدا. ثم ان هذا الموقع غير مغر على الاطلاق»، مشيرا الى ان هذه الاتهامات متوقعة من كل جهة مدانة وتتهمني لدعوتي للإصلاح.<br />* اعطيت الرئيس عرفات مهلة حتى 10 اغسطس (اب) الجاري، أي أول من أمس، لكنكم لم تقوموا بشيء؟<br />ـ قضية المهلة هذه مختلقة تماماً ولكن الحقيقة انه لم يصدر عني شيء من هذا القبيل، ثم انني أكره المهل لاننا اعتدنا أن نأخذ مهلا من قوات الاحتلال، وبالتالي أنا لا أتعاطى مع لغة التحذير، ثم انه من باب الأدب والخلق ألا نعطي مهلا لبعضنا، فكيف عندما يتعلق الأمر بالرئيس عرفات، أنا من حقي أن أنتقد الرئيس عرفات لكن ليس من حقي أو أوجه انذارات أو تحذيرات لأحد وتحديدا اذا تعلق الأمر بالرئيس.<br />* جرت أحداث كبيرة في الشارع الفلسطيني جعلت الفلسطينيين يتخوفون من وقوع حرب اهلية فما تعليقك، خاصة انك أنت المتهم بالوقوف وراء هذه التحركات؟<br />ـ أنا أؤيد ما حدث في غزة من هبة جماهيرية شعبية سلمية للمطالبة بالاصلاحات، ما حدث هو تطور داخل الشأن الفلسطيني، وأنا كنت واثقا انها لن تصل أبدا الى صراع على السلطة كما يحلو للبعض أن يصوره، بالاضافة لكونه غير واقعي، ما حدث من تحركات واحتجاجات كانت بأمل جلب نتائج إيجابية ودفع القيادة لاجراء تغييرات جوهرية على العمل الداخلي والسياسي. أما الحفاظ على الواقع الراهن فيخدم الاحتلال ويعززه، وباختصار الحديث الشعبي الفلسطيني في كل بيت الآن هو اجراء اصلاحات وتصحيح كل المسارات، فهذه قضية أصبحت مطلبا شعبيا فلسطينيا، والمجلس التشريعي الفلسطيني قدم وثيقة الاصلاح للرئيس عرفات في عام 2002 والمجلس الثوري لحركة فتح قدم اقتراحا للاصلاح في عام 1997 قبل أن تطالب الولايات المتحدة بالاصلاح وقبل أن تدعي اسرائيل بأنها تريد اصلاحا، فهي آخر دولة يمكن ان تريد اصلاح السلطة الفلسطينية، لان اسرائيل مصلحتها في وجود سلطة فاسدة وفاشلة ومترددة تعيش بلا رؤية وبلا وحدة وطنية، وبرأيي ان ادعاءات اسرائيل ودعوتها لاصلاح السلطة بهدف إلغاء المطالبة بالاصلاحات من قبل الفلسطينيين وتصوير الاصلاح على انه مطلب وقضية اسرائيلية.<br />* لكن ألا تعتقد ان اختطاف مسؤول كبير وأجانب وإحراق المباني ليست مطالب جماهيرية؟<br />ـ حركة الاحتجاجات التي جرت في غزة التي أباركها لا علاقة لها بخطف غازي الجبالي أو بخطف الفرنسيين، ما حدث تشويه للحقيقة وتداخل لما حدث، والحركة الشعبية التي أيدتها ليس فيها أي تجاوز باستثناء الاعتداء على مكتب في رفح، هذا كان خطأ كبيرا لم يتكرر، مجموعة كتائب شهداء جنين هي التي خطفت الجبالي, وهي تمول من السلطة ماليا وتسليحا وادارة وأعضاؤها موظفون في السلطة، وكتائب الشهيد أبو الريش هم الذين خطفوا الفرنسيين للتضامن مع الرئيس عرفات، وهذه الكتائب أيضا تمولها وتسلحها السلطة باعتبارهم موظفين في الأمن الوطني، اي اننا لا علاقة لنا بهاتين الحركتين، نحن تحركنا ككادر تابع لفتح مطالبين بالاصلاح ومناشدين الرئيس عرفات بألا يقر التعيينات الأخيرة التي تتعلق ببعض المسؤولين الذين ثبت تورطهم بفساد كبير وهم غير مؤتمنين على حياة الناس.<br />* هل تعني ان هاتين الحركتين تعمدتا القيام بحوادث الخطف لاحداث فوضى ولتأليب الجميع على حركتكم؟<br />ـ بالمناسبة، استنكرت حوادث الخطف، لكن رغم ذلك لا أريد ان أوزع التهم، فهذا سلوك سيئ، وبالمناسبة هؤلاء الشباب الذين قاموا بهذه الحركات وطنيون اجتهدوا فاخطأوا والرئيس عرفات يعرف من يمولهم، ولكن ان تدار الأمور للاساءة للحركة الشعبية التي تريد الاصلاح فهذا أمر مرفوض.<br />* اعتبر البعض ان حركة الاحتجاجات التي تساندها وتقودها جعلت الفساد شعارا احتموا به لاخفاء مقاصدهم الحقيقية وهو تحقيق السلطة والنفوذ؟<br />ـ هذا غير صحيح فأنا كنت وزيرا في حكومة أبو مازن واستقلت وكنت مديرا لجهاز الأمن الوقائي واستقلت بارادتي وأنا الوحيد الذي قدم استقالته مرتين، وبالتالي لا أطمح الى أن أكون مكان الرئيس عرفات، ولا يوجد في مخيلتي ذلك وهذا أمر غير وارد لعدة أسباب تاريخية كثيرة أنا مقتنع بها والرئيس عرفات يعلم ذلك جيدا، الرئيس عرفات يعيش في ظرف قاس ومؤلم ولا يتمتع بكونه رئيسا لدولة مستقلة ذات سيادة، فهذا الموقع غير مغر على الاطلاق، لكن هذا لا يمنعني من المطالبة بالاصلاحات، وأتوقع ان كل جهة متهمة ومدانة ستخترع عني رواية، واذا كنت بالفعل متهما بطمعي في الاستحواذ على السلطة فليكن وليقوموا اذن بتنفيذ الاصلاحات التي يطالب بها فقط المجلس التشريعي وحينئذ سأؤدي لهم التحية، ثم ان اتجاهات الانتخابات في حركة فتح كانت تؤيد الرئيس عرفات لكن تعارض الفاس<br />Read the rest of this comment..."
archived = "2004-09-26"
