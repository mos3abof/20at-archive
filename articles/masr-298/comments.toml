[[comments]]
order = 10
subject = "متسببين منك قصدى متشكرين"
author = "محمد احمد مصطفى"
posted = "2006-11-23"
text = "ربنا يجعللك فى كل خطوبة سبوبة وميحرمكيش من انك تكونى سبب سبابيب للغلابة اللى مش متسبببين ودمتم ويجعلة عامر هههههههههه"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041600/http://masr.20at.com:80/article.php?sid=298&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 11
subject = "يامنجى الالطاف نجنا مما نخاف"
author = "محمد شعراوى"
posted = "2006-11-23"
text = "والله انا خايف امشى وراء كلامك بدل ما تبقى سبوبة اكل عيش تطلع سبوبة اكل ضرب والواحد خايف احسن تبقى سنانة بيضة اوى تعرفو لية علشان لو عمل زى ما بتقولى ممكن ياكل مش على سنانة لا هياكل على قفاة وربنا يستر"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041600/http://masr.20at.com:80/article.php?sid=298&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
