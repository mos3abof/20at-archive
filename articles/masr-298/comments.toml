order = 0
subject = "إنما الأمم"
author = "يحضرني هنا قول الشاعر الهمام"
posted = "2006-05-09"
text = "إنما الأمم السبابيب ما بقيت .. فإن هم ذهبت سبابيبهم ذهبوا!"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124510/http://masr.20at.com:80/article.php?sid=298&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "لو مؤاخذة"
author = "مصرية طفحانة الدم"
posted = "2006-05-09"
text = "ربنا يخليكو تجيبولى اى حاجه اتسبب بيها عشان انا طفح كيلى<br />بصوا<br />انا مخلصة كلية تربية و معايا لغتين انجليزى و فرنساوى او كان معايا لانى درست و خلصت وكل فترة ادرس حاجة معرفش اتسبب فيها اقوم اركنهاوافكر فى حاجة تانية<br />معايا كمبيوتر اوفيس كامل وصيانة وانترنت ودلوقت بدرس منحة جرافيك<br />عندكو حاجة اتسبب بيهاولا منها ؟"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124510/http://masr.20at.com:80/article.php?sid=298&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "يا نهار أبيض"
author = "عابر القارات"
posted = "2006-05-09"
text = "يا نهار أبيض معاكى ده كله و مش عارفة تتسببى !! ده إذا كان بلية اللى معاه يا دوب شهادة الميلاد و بيكسبله عشرة جنيه لو كان شغال فى ورشة و خمسة جنيه لو شغال منادى على ميكروباص ... هأقول إيه ربنا يعينك و يساعدنا"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124510/http://masr.20at.com:80/article.php?sid=298&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "الى الاخت المنتقبه الا المنتقبه"
author = "عبدالله مفتاح"
posted = "2006-05-10"
text = "ولا يهمك لا تتسببي دلوقتي استني لغايه متوصلي وابقي تسببي<br />ويا سلام لو يبقى عندنا صحفيه منتقبه دي امنيه انا عايزها تتحق يا ريت تحققيلي الامنيه دي<br />صحفيه منتقبه"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124510/http://masr.20at.com:80/article.php?sid=298&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "اة يا بلد"
author = "ايمن المصرى - الكويت"
posted = "2006-05-10"
text = "ارجو ان يقراء هذا الموضوع السيد الرئيس و السادة الوزراء و رجال الحزب الوطنى و لجنة السياسات . يعرفوا ماذا وصل الية حال الشباب و مدى الياس و الهوان الذى وصلوا الية . انى اتساءل هل هذة مصر الثورة . مصر الحضارة . مصر القوية بشعبها و شبابها . هل اصبح هذا هو الحاضر البائس الذى نعيشة .ليتنى مت قبل ان ارى هذا. و اللة على كل شئ قدير ."
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124510/http://masr.20at.com:80/article.php?sid=298&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "انا عندي سبوبة :)"
author = "على فكرة ... انا عندي سبوبة و اعتقد ان ده اللي نافع دلوقت لان كل واحد بعد ما بيتخرج بيعتمد على الهواية و بعد كدة على ما تفرج يشتغل بشهادته فعشان كدة رايي ان كل واحد يحاول يتعلم كام سبوبة سواء باه كمبيوتر و لا يفتح محل اتصالات او سيبر اي حاجة من دي"
posted = "2006-05-10"
text = "بالنسبة لباعتي انا بحب شغل الخرز و بحاول اتعلم حاجات جديدة و هحاول اسوق لمحلات لاني بعتمد على اصحابي حاليا او اني ابيع حاجة لحد و اخد نسبة و جنيه على جنيه تحوش"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124510/http://masr.20at.com:80/article.php?sid=298&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "لا سبوبة بعد اليوم"
author = "الشرقاوي"
posted = "2006-05-10"
text = "من واقع علمي بعلم السبابيب المصري فقد يكاد يكون اندثر هذا الفظ الى حد ما وبدانا نسمع عن كلامات مثل نفحة او مرمة او غيرها من الكلمات الدالة ع العمل الاضافي<br />بارك الله لنا في الزملاء الصحفيين الاشاوسة المغاوير في استراج كل ما هو جديد"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124510/http://masr.20at.com:80/article.php?sid=298&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "الى الاستاذ عبد الفتاح"
author = "كان على عينى احققلك هذه الامنيه لكن فين المؤسسه العاقله الى تعمل كده يا عم صلى على النبي"
posted = "2006-05-14"
text = "احنا اما مؤسسات بتاعت حبيب الشعب الى كلنا عرفينه وانا على فكره كليتى تبع واحده من هذه المؤسسات الكبيره الى انا بكرها دى يا اما مؤسسه نظيفه لكن مش عاوزه حد يعارضها فى الكلام"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124510/http://masr.20at.com:80/article.php?sid=298&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "كداب من يومك"
author = "ابو كرتونة"
posted = "2006-05-14"
text = "عم حسني مزبط شعبه ما فيش بطالة ولا فقر ولا فساد, والشعب ميت فل وعشرة كمان<br />وبس شوية شله منحلة مواليه لاسرئيل همه الي عملين المظاهرات علي الفاضي ويجب القضاء عليهم<br />وعموما كام واحد اشتغل من 5و4 مليون فرصة عمل يا عم حسني يا مزبطنا<br />والله كداب من يومك يا عم حسني"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124510/http://masr.20at.com:80/article.php?sid=298&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

