text = "الله.. حلوة قوي دي يا براء.. في الجون يعني.. وانت يا حمديانو.. انت راجل مهيساتي كبير.. والناس المفروض تتعلم من تهييسك.. نفسي اقابله.. اللي يحب يقابلك يروح فين"
