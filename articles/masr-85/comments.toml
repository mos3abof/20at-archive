[[comments]]
order = 2
subject = "اول مرة اشوف حد ضارب فيديو"
author = "كرميلينو"
posted = "2006-03-28"
text = "حمديانو ده لاسع طحن<br />و د ه الشاب اللي بعيبر ن ثقافة جيلنا للاسف \"( و للاسف ليه ؟؟؟ )<br />احنا جيل ميلكانا او طعمة ميلك مش مهم او صح الصح او جيل 2000 قول اللي نفسك فيه<br />احنا ناس شكلهم جميل بس طعمهم ماسخ علقم و الله<br />لحمنا مر<br />على العموم اللي يشوف بلاوي الناس تهون عليه بلاويه<br />و شكرا<br />نلتقي بعد الفاصل"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022725/http://masr.20at.com:80/article.php?sid=85&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 3
subject = "على علبه"
author = "على علبه"
posted = "2006-03-28"
text = "على قد ما أنا سعيد انى شوفتك على الموقع على قد اننا متخليتش ازاى هتبقة الحاكم بتاعنا<br />بحترمك جدا وبحبك جدا وياريت تختار الموضوعات اللى هتعملها<br />انا واثق جدا ان انتة مش راضى عن العمل ده<br />مع تمنياتى بالتوفيق ليك يأستا برأه مدير عشرينات<br />مع تحياتى على علبه من مقهى ابو أمين"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022725/http://masr.20at.com:80/article.php?sid=85&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 4
subject = "على علبه"
author = "على علبه"
posted = "2006-03-28"
text = "على قد ما أنا سعيد انى شوفتك على الموقع على قد اننا متخليتش ازاى هتبقة الحاكم بتاعنا ياحمدى<br />بحترمك جدا وبحبك جدا وياريت تختار الموضوعات اللى هتعملها<br />انا واثق جدا ان انتة مش راضى عن العمل ده<br />مع تمنياتى بالتوفيق ليك يأستا برأه مدير عشرينات<br />مع تحياتى على علبه من مقهى ابو أمين"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022725/http://masr.20at.com:80/article.php?sid=85&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 5
subject = "في منه كتير"
author = "عبدالله مفتاح"
posted = "2006-03-28"
text = "لا بجد الولد ده في منه كتير وهو مش مجنون او عبيط\"؟<br />هو غالبابس مشوش او نفسيته تعبانه وبيحاول يوهم نفسه لكن هو سليم جدا عقليا<br />بس حلو"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022725/http://masr.20at.com:80/article.php?sid=85&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 6
subject = "حسبنا الله ونعم الوكيل"
author = "نجلاء"
posted = "2006-03-31"
text = "فى ناس كتير فى بلادنا ذى الشاب ده,ضايعه وتايهه ومالهاش هدف فى الحياه سوى الفلوس والمتعه,هو عنده ثقافه, بس ثقافة صفوت الشريف وانس الفقى ,له احلام بس احلام مشوشه ومالهاش ملامح.<br />حرام الناس الضايعه دى ,من المسئول ان يرجعهم للطريق ويوريهم النور,<br />لو كان فى اسرتك لا قدر الله واحد مثله, كنت هاتعمل ايه؟ وده وارد جدا<br />لو ساكن جانبك واحد حاسس انه رهيب على راى صاحبنا ! كنت هاتقدمله ايه<br />هو ده السؤال الى حاوله تقدمه له اجابه يا شباب عشرينات"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022725/http://masr.20at.com:80/article.php?sid=85&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

