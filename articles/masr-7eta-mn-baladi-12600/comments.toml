subject = ""
author = "المساجد المصرية"
posted = "2009-07-08"
text = "المصرى الفرعونى المسلم لم يغير ابدا فى تصميم معبدة الذى يعبد فية اللة<br />درست هندسة معابد الشمس فى مدينة هيليوبوليس القديمة — صالة كبيرة جدا غير مسقفة تسقط فيها الشمس ومفتوحة للسماء وحولها من الجوانب الاربعة اماكن الصلاة<br />والمسجد صورة طبق الاصل مع التغيير فى المحراب والقبلة والمنبر ولكن الهندسة هى هى بلا اى تغيير<br />اما الكنائس فى مصر فطراز رومانى وليس فيها من المصرية شىء<br />ومسجد السلطان حسن صورة بالكربون من معابد الشمس الفرعونية - فيها الاصالة والفن والجمال مع فارق الدين"
archived = "2009-07-09"
capture_url = "https://web.archive.org/web/20090709213600/http://www.20at.com:80/masr/7eta-mn-baladi/12600-2009-07-08-10-44-25.html"

[[comments]]
order = 1
subject = ""
author = "عادل ابو محسن"
posted = "2009-07-08"
text = "منذ بناء الاهرامات لم يبنى المصريون بالحجر غير فى وجود دولة المماليك<br />المماليك الذين اعادوا الى مصر والمصريين فنهم الرائع فى البناء بكتل الاحجار المربعة<br />وشهدت القاهرة الاسلامية بلد المائة الف ماذنة مساجد عملاقة كالاهرامات مقامة من الاحجار<br />واصبحت الماذن الحجرية العالية فوق المساجد مكان المسلات القديمة امام معابد اجدادهم الفراعنة"
archived = "2009-07-09"
capture_url = "https://web.archive.org/web/20090709213600/http://www.20at.com:80/masr/7eta-mn-baladi/12600-2009-07-08-10-44-25.html"

[[comments]]
order = 2
subject = ""
author = "ااول مدينة جامعية"
posted = "2009-07-09"
text = "فى مسجد السلطان حسن سكن لطلاب العلم فى المذاهب الاربعة وكان الطلبة الذين يقيمون فى تلك الغرف اكلهم وشربهم بالمجان بالاضافة الى مصروف للجيب او هدية السلطان ومنحتة<br />فحكاية التعليم المجانى موجودة فى مصر منذ الازهر ومنذ مسجد السلطان حسن<br />وكان اهل الخير يعطون الطلبة الكسوة وكتب العلم ولهم جراية شهرية معلومة<br />ارجعوا الى تاريخنا المشرق المضىء ولا تقرؤوا تاريخنا المكتوب فى الغرب وكلة حقد صليبى اصفر على المماليك الابطال الذين هزموهم وطردوهم من الشام وفلسطين"
archived = "2009-07-09"
capture_url = "https://web.archive.org/web/20090709213600/http://www.20at.com:80/masr/7eta-mn-baladi/12600-2009-07-08-10-44-25.html"

[[comments]]
order = 3
subject = ""
author = "marwa abdelfatah"
posted = "2009-07-15"
text = "المسجد رائع جدا<br />والزوار بيزروه من كل مكان<br />مسجد السلطان حسن ومسجد الرفاعي وحاجت تاني كتير بيوضحوا قد ايه المعمار الاسلامي في مصر رائع للغاية<br />معمار ملئ بالاصاله والفن والرقي"
archived = "2009-07-20"
capture_url = "https://web.archive.org/web/20090720041212/http://www.20at.com:80/masr/7eta-mn-baladi/12600-2009-07-08-10-44-25.html"

[[comments]]
order = 4
subject = ""
author = "البناء بالحجر"
posted = "2009-07-24"
text = "المعمارى المصرى الفرعونى المسلم بنى معبد الاقصر بالحجارة وابن هذا المعمارى بنى المساجد المملوكية فى فترة انقطاع طويلة بعيدة لم يبنى بالحجر<br />ومسجد السلطان حسن بعظمة البناء وقبل ان تبدا الصلاة يدخل الخشوع قلبك وتلك عظمة المعمارى وهو ان يدخل الخشوع قلبك بعظمة البناء قبل ان تشرع فى الصلاة<br />ما ان تقف وتشعر انك صغيرا وضعيفا امام العظمة وتتوضا وتبدا فى الصلاة خاشعا وناسيا كل مشاكلك على باب الجامع<br />المعمارى المصرى الذى يبهرك فى معبد الاقصر وامام معبد الاقصر البحيرة المقدسة التى يتطهر فيها المصلون قبل الصلاة يبهرك فى السلطان حسن بالمبانى والميضة والمدرسة<br />تحية الى اجدادى المعماريون العظماء البناة"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809021930/http://www.20at.com:80/masr/7eta-mn-baladi/12600-2009-07-08-10-44-25.html"

