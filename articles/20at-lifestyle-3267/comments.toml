[[comments]]
order = 17
subject = ""
author = "المترو"
posted = "2008-10-16"
text = "يا جماعه فى موضوع مضايقنى اوى و خلانى اتشعلق فى الاتوبيسات بدل المترو<br />الناس اللى بتطلع تجرى بسرعه عشان تلحق المترو<br />اول ما يدخلوا<br />يروحوا واخدين نفس عميق و طويل و فجاه يخرجوا بنفخه محترمه فى وش اللى ادامهم<br />المهمه النفخه دى مدتها طبعا طويله و يعلم ربنا انى ببئى هارجع من الارف<br />والنصيبه الاكبر لما بشوف حد بيلعب فى مناخيره حتى السيدات المحترمات بيعملوا كدا و بعدان يمسكوا فى الكراسى و فى كل حاجه و يشهد ربنا انى كنت هرجع بالفعل من منظر شوفته من سيده محترمه كدا كانت بتعمل كدا ومش عارفه ارجع فين المترو مليان ناس اديتهم ظهرى عشان ما اشوفش وش حد خالص<br />و اخيرا قررت اتشعلئ فى الاتوبيسات بعيد عن كل البشر"
archived = "2009-08-12"
capture_url = "https://web.archive.org/web/20090812063851/http://www.20at.com:80/20at/7ayatna/3267.html"

