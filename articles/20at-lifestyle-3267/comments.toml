text = "حرام بجد عليكم انا كنت هفطس من الضحك من تخيل المنظر ان الناس كلها بتتاوب في وقت واحد والهبو طالع مرة واحدة<br />بجد انا هيجرالي حاجة بشتغل في مكان محتررررررم جدا وساعة الصلاة بعيد عنكم وعن السامعين كلهم وكأنه قبر واتفتح من عام 67 … ريحة غير محددة الملامح وهي عبارة عن مزيج من رائحة القدمين مع الشرابات مع …الرحمة بجد"
