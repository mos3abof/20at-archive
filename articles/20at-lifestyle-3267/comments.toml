text = "الريحة دى بجد مشكلة انا بقيت موسوسة و كل شوية اشم هدومى و اشمم ماما و خطيبى و كلو يقولى مفيش حاجة بس انا بقيت كده من كتر ما شوفت بنات ريحتها مقبرة و قلت داهية لاكون انا كمان مش شامة نفسى و المصيبة الاكبر هى المساجد بجد دا بيت ربنا يعنى نظافته واجبه و حرام اننا نهملو انا بجد بتجنن من الموضوع دا المسجد بتبقى رحتها فظيعه و دا مكان عبادة!!!!!!!!!!<br />انا كذا مره اجيب جليد لمسجد الكلية و اجى ارش عشان اغير ريحة الجامع وحدة تقوم تزعقلى تقولى هنتخنق و التانية يقولى العطر حرام و التالته تتنفض و تقولى بينزل عليا و الرابعة…طب و مش حرام ريحة الجامع تبقى كدا"
