text = "يالاهووووي انا فاكرة مرة كنت في الجامعة في اول سنة وكانت قاعدة جمبي واحدة مش عارفها وبعدين عنكم جمعيا الريحة خارجة منها غير طبيعية كنت بموووووووووت. المفروض الواحد ياخد باله من نفسه اووووي النظافة هي عنوان الشخص .. وبعدين الموضوع مش مكلف الحل هو الاستحمام والتاكد منن نظافة الهدوم يوميا زي ما يسر قالت وبس مش شوية المياة والصابون هما اللي هيعملوا ازمة وشكرا"
