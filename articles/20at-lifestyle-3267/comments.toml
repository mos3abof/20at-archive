text = "بجد كدة عيب أوي يا جماعة الناس دي بيكون عندهم ظروف … ماينفعش نحرجهم الإحراج ده كله… و فيها ايه لو نستحمل الريحة الوحشة يعني ..عادي جداااااً و بعدين بالنسبة للشرابات يعملوا ايه الناس يعني لو لبسو الجزمة من غير شراب هتبقى العن . انا بس لية تعليق واحد لما الواحد بركب المترو الصبح بدري و الناس كلها تتتاوب في وقت واحد هية دي بقى اللي تبقى مشكلة"
