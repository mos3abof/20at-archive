subject = ""
author = "English Youth"
posted = "2007-02-17"
text = "بجد يا سير موضوع أكثر من رااائع وجاء في وقته فعلاً لأن في كثير من الناس بيفتكروا إن الروائح الكريهة لا تظهر وتنتشر إلا في الصيف فقط وده طبعاً خطأ وكلام فارغ، لأن الشتاء بيكون ألعن وأدل سبيلاً … الريحة بتكون مكتومة تحت الجاكيتات والبالطو وكل كم الصوف التقيل ده وأول ما الشخص يقلعوا جوة المكتب أو قاعة المحاضرات أو الفصل … أجارك الله الناس بجد يا بترجع يا بتجري على برة … أنا الحقيقة كنت بعاني من موقف بشع جداً في مكان عملي السابق وهي وجود موظف جديد كويس جداً مهنياً وطيب أوي بس مشكلته الرائحة الكرييييييييييي ييهة ومش أي رائحة لأ دي بجد كريهة فوق التصور لدرجة إني مرة جريت على الحمام رجعت بجد وباقي زمايلي وأصدقائي يا مضوا إنصراف بدري متغاضين عن الخصم من مرتباتهم أو خرجوا ومرجعوش أو حطوا مناديل على مناخيرهم وكتموا انفاسهم ياحرام… المهم إن أنا دلوقتي في مكان عمل تاني ولسة الغلابة زمايلي بيعانوا ولما رحت زرتهم آخر مرة كنت حرجع بجد …<br />الأهم في موضوعك يا يسر إن الناس لازم تعرف إن الروائح الكريهة مش مصدرها عرق وبس لأ ده روائح القدم والشعر والملابس المتسخة وحاجات تانية لا داعي لذكرها طبعاً علشان في ناس محتمرة هنا بس حاجات تستدعي الإستحمام اليومي والإغتسال الجيد سواء صيف أو شتاء، وطبعاً رائحة الفم اللي الحل بتاعها مش مجرد حباية نعناع … لأ … لازم زيارة لدكتور أسنان والغسيل بالمعجون كل يوم دايماً … إلى الأمام يا يسر ويارب كل اللي مش حاسس إنه ممكن يؤذي اللي حواليه بريحته يقرا الموضوع ده ويتعظ … والسلام ختام"
archived = "2009-08-12"
capture_url = "https://web.archive.org/web/20090812063851/http://www.20at.com:80/20at/7ayatna/3267.html"

