author = "محمود بكر"
posted = "2009-11-09"
text = "فعلا .. فيلم ضعيييف<br />المشكلة إن فى مخرجين لسة متخيلين إن المشاهد المصرى بيروح عشان يتفرج و يضيع وقت و بس لأ بالعكس الوقتى إحنا بننقد كل شئ و لينا رؤية خاصة و معدش أى حاجة تكون جديدة تبقى كويسة لأ لازم تنقد حتى لو جديدة … أنا تقريبا الفيلم كلة مفيش مشهد معلقتش على حاجة فية.. و فى مشاهد مفهمناش فايدتها إية فى الفيلم أساسا… منا مشهد لما خالد الصاوى راح المشرحة و شاف غادة عبد الرازق و هيا شايلة طفل… معتقدش إنة كان مشهد مفيد بحاجة … و فى حاجة مهمة فى الجريمة إن من الأول الطبيب الشرعى قال إن فى ضربة بأيد محترفة تشوية الوجة كان بأحتراف و المتهم إعترف بالقتل و ليس بالتشوية يعنى المفروض كان يوجة الأتهام للزوجة لأنها دكتورة جراحة بس دا محصلش … دى كانت أكتر حاجة معجبتنيش فى الفيلم و الى خلتنى أدقق و أطلع فى كل مشهد عيب… و كان فى أدوار ملهاش فايدة نهائى كان فى واحد بيجرى مع الظابط و بيركب معاهم العربية دور متوظفش أساسا هوا موجود فى مشاهد كتيرة و مكنش لية أى فايدة مدخلش السياق … و كثيييييير"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203025228/http://www.20at.com:80/masr/review/13866--qq-.html"
