text = "أحب أن أقول للشباب والشابات أننا يجب أن نشكر الله على النعم التي أعطانا إياها ، الحمد لله الذي أعطانا عيونا نبصر بها وآذانا نسمع بها ولسانا ننطق به وأرجلا نمشي عليها وأيديا نمسك بها ، وبعد كل هذا تريدون أن تغيروا ما أعطاكم إياه الله ، نصيحتي بأن نقتنع بما أعطانا إياه الله بدون أن نغير في خلقته لنا ، وأنا ضد عمليات التجميل وتغيير الملامح والشكل ، آسف لأنني أطلت الكلام لكن أتمنى أن تكون قد وصلت الرسالة"
