subject = "اختلاف المقاييس"
text = "تختلف مقايس الحكم على الانسان سواء من الداخل او الخارج فالذى تراة انت جيد من المحتمل ان يراة غيرك سئ وحكم الشخص على نفسة غير كافى لابد من النظر الى اراء الاخرين ولكن بالطبع الفئة المعتدلة منهم ومن هنا يستطيع الانسان التغير ليتوافق مع الاخرين واقصد من كلمة التغير هو التغير الداخلى وليس الخارجى فالذى خلقنا علية الله سبحانة وتعالى هو الوجهة الاكمل لكل شخص منا(لقد خلقنا الانسان فى احسن تقويم )صدق الله العظيم"
