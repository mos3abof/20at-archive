subject = "حيزوم"
text = "ده عرض وليس مرض<br />إن كان هاجس الشباب اليوم هو موضوع الـNew Look ، فإننى أرى أنه حاله عرضيه تشغل بال بعض الشباب لأنه لا يوجد شئ أو قضيه أو هدف حقيقى يشغله حتى ولو كان ذلك الهدف يحقق مصلحه شخصيه وهذا لكون المصالح الشخصيه هى أهداف مؤقته تنتهى بإنجازها وهذا لا يمنع كونه شئ محبب إلى النفس فى تحسين المظهر والتجميل الإجتماعى ولم تنشأ هذه الظاهره إلا لثلاث أسباب جوهريه :<br />1 - عدم الثقه بالنفس ومحاولة الهروب عن إجابه السؤال السرمدى \" إيه هو هدفك فى الحياه ؟ \" وعدم وجود رضى داخلى عن ما تحقق على أرض الواقع .<br />2- مرض لازم السواد الأعظم منا وقلما ينجو منه أحد ألا وهو المبالغه الكبيرة فى نظرة الناس لنا فكل التقاليد والأعراف الإجتماعيه لا يحركها سوى ذلك الهاجس ويأتى الوازع الدينى أو الأخلاقى كواجهه على أغلب الأحوال . لذلك لابد من التعود على أن نسأل أنفسنا دائما بعد أى فعل نفعله ( أنا عملت كده ليه ؟ ).<br />3- مش فاكر......... حد يقترح حاجه هنا :)<br />على العموم هناك شعار لابد من إستيعابه جيدا وهو Be Your Self .<br />إيه رأيكم بعرف أصبع كفته :)"
archived = "2005-04-15"
capture_url = "https://web.archive.org/web/20050415084527/http://www.20at.com:80/article.php?sid=1008"

