subject = "فيصل من المغرب"
text = "بالله ثم بالله عليكم هل هدا موضوع يصلح للناقشة أو حتى للإتارة<br />الأمة المسلمة غارقة في الدم من المؤامرات الصليبية و الصهيونية<br />وغارقة في الوحل من انحلال أبنائها، هدا يريد تغيير لون شعره أنت تريده كلون دم محمد الدره؟ و هدا يريد عضلات ألم تسمع قصة عبد الله بن مسعود الدي قال فيه النبي صلى الله عليه و سلم رجلاه أثقل عند الله من جبل أحد<br />أستغفر الله و أتمنى الهداية لي و لكم<br />أخوكم في الله"
