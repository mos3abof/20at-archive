[[comments]]
order = 10
subject = "كامل الاوصاف فى عين نفسى ام فى عين الاخرين!!!؟"
text = "محدش فى الديا يدر يوصف نفسه بالكمال مهما كانت مميزاته ومهما كان مدح الاخرين ليه..الكمال لله وحده طبعا.. وفى حاجتين مهمين الاولى هى لما بتواجه نفسك ادام نفسك بتحكم عليها وتقول ايه؟ فكر كده ..انت كشكل افضل من غيرك ولا لا؟ عايز تغير فى شكلك؟ طب غير من جواك الاول ربنا هيجعل القبول فى شكلك مهما كنت عايز تجمل فيه ..جمال النفس ينعكس على جمال الشكل ..مش ربنا سبحانه لما وصف المؤمنين قال..سيماهم على وجوههم من اثر السجود..وحسن الخلق بيحسن الخلقة ويخليك شاب امور ووسيم فى عين الناس اللى بتفهم ..انما لو عايز تعي بشكلك بس اللى هيمدحك النهاردة لو لا قدر الله حصللك حاجة فى وشك هتعمل ايه؟ انمابينك وبين نفسك وادام الناس لازم تكون راضى ومقتنع بفضل الله عليك وتمييزك وتكريمك عن باقى الخلق ..البنات بقه مش عيب انك تهتمى بشكلك وبالاستايل بس العيب ان ده يبقى كل محور تفكيرك وحكمك على نفسك والاخرين بالشكل هيخليكى تتخمى فى ناس كتير شكلهم حلو لكن جواهم خراب .. انا طولت عليكم..الخلاصة يا جماعة التوازن والاعتدال والوسطية فى كل شيء مطلوب وربنا يكرمنا ويحسن اخلاقنا كما حٍسًن خلقنا"
archived = "2005-04-15"
capture_url = "https://web.archive.org/web/20050415084527/http://www.20at.com:80/article.php?sid=1008"

