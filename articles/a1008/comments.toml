[[comments]]
order = 17
subject = "للأستاذ فيصل من المغرب"
text = "يا حاج فيصل ! إنت فيه إيه بالظبط؟<br />مالك داخل تهجمعالشباب اللي بيدردشوا و يفكوا عن نفسهم من الكبت اللي مش مخللي حد عارف يقول رأيه؟<br />المؤامرات الصليبية و الصهيونية موجودة في نافوخك اللي عاوز له علاج من الأمراض العقلية.<br />و إحنا قلوبنا مع فلسطين بس مش معقول بعني نقعد ليل نهار نعيط و نولول.<br />يعني بزمتك إنت عمرك من سنة 48 ما دخلت سيما و لا مسرح و لا شفت فيلم لعادل إمام و للا هنيدي.<br />هل أضربت عن أكل ما لذ و طاب من كسكسي المغرب تضامناً مع الدرة؟<br />بقالك ياتري كام سنة ممتنع عن الحبيبة أو الزوجة كإعلان إحتجاج؟<br />ياعم عيش و خللي غيرك يعيش.<br />أما الشاب اللي عاوز يصبغ شعره ، فأنا مش شايف مشكلة. طاب ما حسني مبارك بيصبغ شعره و حواجبه كمان!!<br />و للا هيه جات عالشباب الغلابة أللي عاوز يجرب و يتعلم حاجات كتير قبل ما يصطدم بمرارة الحياة الواقعية؟<br />يا ساتر ده إنتو قلبكو إسود بشكل!!<br />واحد زهقان"
archived = "2005-04-15"
capture_url = "https://web.archive.org/web/20050415084527/http://www.20at.com:80/article.php?sid=1008"

