order = 0
subject = "العلم نووووووووور!"
author = "Enter"
posted = "2006-03-20"
text = "رب الكيبورد و الماوس بيمسي ...<br />فعلا يا ولاد ، و كما قال الشاعر :<br />\"غراء فرعاء مصقول عوارضها<br />تمشي الهوينا كما تمشي نانسي عجرم\"!!<br />أنا بس عندي شوية ملاحيظ و تساؤلات :<br />1) تامر أنا بأحب أغانيه معظم أغانيه جدا بس لو طلعت حركة التزوير دي صحيحة انا هأتضايق منه جدا ..و بمناسبة \"مواقعهم\" موقع تامر تحفة فنية بكل المقاييس ..<br />2) اليسا خريجة علوم سياسية!!!!!! ما تجيبش أبدا!!<br />3) إيهاب توفيق أخد الدكتوراه بتاعته ، و عمرو دياب اتخرج في السنة اللي اتولدت فيها D: ، 1986<br />4) \"اللبنانية نورهان فقد درست علم النفس\" ، بفتح السين أكيد .. مش ممكن يكون غير كده!<br />5) إيمان البحر باحترمه جدا .. و فرحت إنه من كليتي ... هلوسة!<br />6) \"حصلت جالا فهمي على ليسانس آداب\" .. آداب ايه بالظبط؟!!<br />7) بالنسبة للآنسات (الله وحده يعلم إن كانوا كده!) \"هيفاء ونانسي ومروي اللبنانية وبوسي سمير ونجلا\" ... مش محتاجين مؤهلات زيادة سعادتك !!<br />كفاية علينا أوي كده ، و إلا هنمووووت."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205501/http://masr.20at.com:80/article.php?sid=46&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

