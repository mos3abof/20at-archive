subject = "ييييييييي"
text = "كلمة شبابية في حد ذاتها تكرهك في اي موضوع..بحس انها شتيمة..مش عارف همه الهبل اللي بيعملوه وصلنا لكده والا الهبل اللي بنعمله احنا وصلهم لكده..حسبي الله ونعم الوكيل فيك يابتاع الرياده الآعلامية"
archived = "2004-08-31"
