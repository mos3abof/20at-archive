order = 0
subject = "أماني وأغاني"
text = "المهم الأول يعني إيه شبابية .. وهل للشباب هموم مختلفة عن هموم المجتمع ، وما هي هذه الهموم الخاصة جدا .. لأن لو البرامج الشبابية على طريقة أماني وأغاني ولا حتى كليك بتاع أبو ظبي ولا نادي السيارات ، وبرامج دريم المملة فألا ليت الشباب لا يعود أبداااا"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235349/http://www.20at.com:80/article.php?sid=188"

