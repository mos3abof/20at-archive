[[comments]]
order = 3
subject = "فكرة برنامج جديد - رغداء بندق"
text = "الموضوع والفكرة جمال جدا، لاننا لأول مرة بنشارك في الاعداد مش مكتفين بدورنا كمتلقي بس،وأصدق مافي الموضوع - كما أتوقع- أن تصدر من الشباب نفسه...وأقترح عدة فكرة لبرنامج ممكن نسميه\"أقبل التحدي\" اتمنى ات تكون جيدة:<br />** فكرة البرنامج تعتمد على اختيار شاب ما بشكل عشوائي او خلينا نستغل sms في حاجة مفيدة ولو لمرة واحدة وده ممكن تحقيقه لو قام شخص ما بالاتصال او ترشيح نفسه او حد رشحه ليكون بطل الحلقة القادمة من برنامج \"أقبل التحدي\" (على ان يعمل فريق العمل على أن يصل للشاب دة أيا كان مكانة ومن خلال كاميرا واحدة يحملها المخرج يعني لو كان في استاد كورة يجيبوة،لو في نادي يطلعوه - وهيتم معرفه مكانة من خلال أهله او أصدقائة أو بالاتفاق معهم)ولو وصلوا له يقوم المخرج بتكليفه بآداء مهمة ما لمدة ما، ومازالت الكاميرا ترافقه والتعليق الصوتي كذلك، شرط المهمةان تكون في خدمة المجتمع \"الخدمة في دار مسنين- دار أيتام- يكنس الشارع- يشتغل في حضانة...الخ\" وحتى يستوفي المدة والمهمة ينتقل لمهمة اخرى مفيدة له شخصيا زي (تعلم رياضة لا يجيدها- تكليفه بتسلق جبل بعد تدريبه عليه بالطبع- تعليمه السواقه..الخ )وهكذا حتى ينهي المهام ويصل لآخر مرحلة من البرنامج، ويحصل في النهاية على ميدالية البرنامج ومبلغ محترم(جزء من اللي حصلناه من الـsms) او ان يقوم البرنامج بانجاز مهمة خاصة بالمتسابق كنوع من المكافأة.<br />هدف البرنامج: ان يستغل طاقة الشباب وحبهم للنجومية والشهرة في حاجة مفيدة للمجتمع أو حتى مفيدة له شخصيا وسيتم تكريمه بالميدالية أو بالمهمة الخاصة به او حتى بالفلوس.<br />رغداء بندق"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235349/http://www.20at.com:80/article.php?sid=188"

