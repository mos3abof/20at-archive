subject = "اشمعنا؟"
text = "احم .. سؤال بسيط .. اشمعنا التركيز ع البنات بس .. دانت لو فتحت التليفزيون يوم الجمعة واتفرجت على الإذاعة الخارجية .. أتحداك لو مانعستش انت نفسك من مناظر الناس اللي بتتاوب واللي نامت فعلا.. والكلام ده ع الكل .. مش شباب بس .. ورجالة كبار كمان<br />ياريت يعني مانظلمش الشباب .. ونحاول نبص للموضوع من منظور أعمق شويه.<br />ودمتم"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235349/http://www.20at.com:80/article.php?sid=188"

