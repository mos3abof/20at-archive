text = "متشكرة اوى يأستاذ عبدالله على اسهامتك العظيمة ويكفينى فخرا ان اسمى معاك فى الموضوع وشكرا اوى ياحسام وان شاء الله اتحسن اكتر من الاول ومتشكرين على توجيهاتك"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224854/http://masr.20at.com:80/article.php?sid=1336"

