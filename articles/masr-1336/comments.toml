[[comments]]
order = 1
subject = "اه ده يا ولاء"
author = "الهندي"
posted = "2006-12-21"
text = "الموضوع جميل يا ولاء وبعودة الايام وكمان<br />الاستاذ طحاوي معاكي اه ده و الدويتو ده<br />والموضوع بجد حلو بس عاوز يكون فن اكتر من كده"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224854/http://masr.20at.com:80/article.php?sid=1336"

[[comments]]
order = 2
subject = "ارض الخوف"
author = "الشاب كتبه التعليق خافوا على روحهم من كتر الكلام و لكن لو كانوا بيراعوا الامانه كانوا كتبوا كمان انه من ضمن الملصقات اللى بتبقى فى كل مكان و اى مكان ( اذكر الله ) و عدد من الاحاديث التى لم نسمع عنها من قبل و لسنا متاكدين من صحتها -"
posted = "2006-12-21"
text = "و قبل ما تهيجوا على متهمينى بالكفر اقول يعنى انت مثلا لو ماشى فى الشارع وواحد لمؤاخذه جه و لطع على قفاك ورقه من دول هتسيبها ملزوقه على قفاك برضه بدعوى ان مالها اذكر الله مش عجباك ليه و لا انت كفرت ، يا شباب محدش اعترض على الكلمه و لكن ان توضع فى مكانها<br />مش معقول يبقى فى يافطه بتقول ان ده اتجاه الجيزه مثلا ابص الاقيها بقت اتجاه اذكر الله يعنى هو ده يرضى ربنا يا عالم ، وهى من امتى الحكايه حكايه ورق و لصق<br />ولا الجهه ( اللى الله اعلم ايه هى ) المعنيه بلصق الورق ده عمال على بطال شايفه ان الشعب كله كافر وعاوزه تفكره بالله"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224854/http://masr.20at.com:80/article.php?sid=1336"

[[comments]]
order = 3
subject = "موقع عشرينات انضم لابواق الحكومة الفاسدة"
author = "المواطن المطحون"
posted = "2006-12-21"
text = "اظني ان موقع عشرينات اصبح حكومي اكتر من الحكومة نفسها , فالانتقادات الموجهه للحكومة اصبحت قليلة والمواضيع التي تكشف الفساد والفاسدين انعدمت , وكنت شعرت اني اقرء جريدة الاهرام بدلا من موقع عشرينات.<br />عيب عليكم يا موقع عشرينات ان تخسروا الحرب ضد الفساد والفاسدين وعملاء الوطن وعلي راسهم مبارك وجمال (رضي بوش عنهما) وتخسروا ايضا القراء الاحرار الذين يقروا مدونتكم.<br />وشكرا"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224854/http://masr.20at.com:80/article.php?sid=1336"

[[comments]]
order = 4
subject = "شكرا"
