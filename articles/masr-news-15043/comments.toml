author = "الازهر الشريف"
posted = "2010-01-25"
text = "بيقولوا ان علماء الازهر بتوع السلطه وبيفتوا اللي السلطة عايزاه وعمالين يقلوا ادبهم على الازهر اللي عمره 1000 سنه وهو كعبة العلم في العالم الاسلامي<br />ممكن تقرأوا اول سطور في هذ المقال اديهم بيفتوا اهم ضد الدولة<br />بطلوا شغل الوهابية والاخوان اللي ودونا في ستين الف داهيه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />أفتى عدد من علماء الأزهر الشريف، وأعضاء مجمع البحوث الإسلامية، بأن قانون «الضريبة العقارية الجديد» يخالف أحكام ومبادئ الشريعة الإسلامية، وطالبوا بإقالة الدكتور يوسف بطرس غالى، وزير المالية، لتسببه فى الكثير من المشكلات وإثارة الرأى العام."
archived = "2010-01-30"
