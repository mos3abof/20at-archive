author = "طيب نعمل اية ؟"
posted = "2010-01-25"
text = "طيب نعمل اية ؟<br />ما ندفعش الضريبة ولا نقدم الاقرار - وانتم هتحمونا من الغرامة والحبس<br />كانت فين فتواكم اثناء مناقشة القانون فى البرلمان - كانت القطة واكلة لسانكم<br />وبعدين الشجاعة نطت فى قلوبكم بعد الرئيس ما قال ان القانون لم يحسم بعد وان هناك مناقشة تانية لة<br />هو احنا بنلعب حلبسة<br />عايزين نظهر فى الصورة<br />انا مستعد ان اقسم لكم ان هذة الفتوى ظهرت بعد خطاب حسنى مبارك فى كفر الشيخ وقال ان فية مراجعة لبعض البنود<br />انما لو لم يتكلم - كان ولا شيخ فتح بقة - ما القانون متوافق علية بقى لة سنة - كنتم فين"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130003617/http://20at.com:80/masr/news/15043-2010-01-25-13-29-59.html"

