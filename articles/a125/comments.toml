[[comments]]
order = 0
subject = "مفكر كبير"
text = "رغم اختلافي معه في بعض أفكاره، إلا أن د.حسن حنفي مفكر كبير، له وزنه، وأتذكر حينما كان يدرس لي في جامعة القاهرة كان يخصص نصف درجات المادة لرأي الطالب، والنصف الآخر للمعلومات والأدلة التي نسوقها للتدليل على آرائنا، وكنا يحذرنا من أن نتفق مع رأيه دونما اقتناع، وكان رحب الصدر تجاه أي نقد يوجه له في محاضراته، فقد كان يخصص لنا آخر ربع ساعة من كل محاضرة للنقد.. وأؤكد على كامل تقديري له رغم اختلافي معه في كثير من أفكاره .. اللهم اهدنا سواء السبيل وثبتنا على طريق الحق والدين."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926232210/http://www.20at.com:80/article.php?sid=125"

