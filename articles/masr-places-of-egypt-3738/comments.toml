[[comments]]
order = 7
subject = "انا م البدايه يا غربه بتالم"
author = "نيفين"
posted = "2006-04-12"
text = "فاكره يا هبهوب<br />فمرتنا باكرم<br />الا متعرفيش يا هبهوب اكرم فينه مش باين<br />و بعدين يا هبه احنا معندناش بنته تقول كده<br />و بعدين يا روحى انا رحت فين<br />اجمدى يا هبهوب دنا كنت لسه قاعده اقول البت هبه المصريه الجدعه اللى ف امريكا<br />صدقينى يا هبه كلنا هذا الشخص المغترب<br />الغربه مش ترك وطن انتى ممكن تحسى بغربه و انتى بين اهللك و مش انا اللى هقوللك<br />و بعدين عمنا يوسف شاهين قاللك ايه<br />قال العلم ف الغربه وطن<br />و الجهل ف الوطن غربه"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525020145/http://masr.20at.com:80/article.php?sid=115&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"
