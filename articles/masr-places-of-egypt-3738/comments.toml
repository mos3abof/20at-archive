text = "السلام عليكم<br />اولا احب ان اطلب من كل رواد هدا الموقع وكل المعلقين هنا ان يصوتو لصالح هانى وليس زوزو<br />لانة مصرى اولا واخيرا وهو احق"
archived = "2006-05-25"
