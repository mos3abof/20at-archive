[[comments]]
order = 1
subject = "القعده مع ماما تساوى الدنيا كلها"
author = "مفيش اجمل ولا احلى ولا اريح ولا ..ولا...........(.لو فضلت كده للصبح مش هاخلص)من القعده مع ماما وبابا واخواتى فى البيت حتى لو كان فى حبس حريات اصل كل حاجه بيعملوها علشان بيحبوكى وخيفين عليكى"
posted = "2006-04-04"
text = "عمرهم ما هيعملو حاجه تضرك القعده جنبهم بكنوز الدنيا ( انا مش قادره اتخيل انى فى من الايام هتجوز واسيبهم)<br />حد طايل يرجع البيت يلاقى الاكل جاهز وكل حاجه مستناياه ( دا بحكم ان كليتى بنرجع متاخر ويدوبك اكل وبعديه نوم كليه الهلوسه اصلها) المهم انا كنت فى يوم من الايام فى الموقف ده<br />وكنت خايفه ماجبش مجموع يدخلى هلوسه القاهرة وكان قرارى ان لو مجموعى جاب اقاليم مش هاروح ولا هتاغرب بس الحمد لله جبتها<br />سلام بقى كفايه كده"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525020145/http://masr.20at.com:80/article.php?sid=115&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "الغربة صعبة"
author = "بلال"
posted = "2006-04-05"
text = "عندك حق والله الغربة صعبة قوي امال بقه لو على بنت مش ولد ، داحنا الواحد مننا بيشيل هم الجيش وكانه حمل ثقيل على قلبه لكن والله برافو عليكم على قدرتكم وتحملكم بس تفتكروا الدنيا ولا الشغل ولا حتى الطموح يستاهل او يساوي ثمن الغربة المر اللي انتوا دفعتوه دا انتوا من اول يوم باين المعاناه امال السنين ياترى عملت فيكم ايه؟"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525020145/http://masr.20at.com:80/article.php?sid=115&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 3
subject = "امنيات"
author = "رائد بغدادي"
posted = "2006-04-05"
text = "الطريق الى النجاح ليس يسير وهذه ليس بتجربة صعبة بالنسبة للفتاة اذا ماقورنت بالصعاب التي ستواجهها في مستقبلها القريب بالعكس فأن اول اسس تحمل المسؤليه تبدأ من هنا فمن تحمل مسؤولية النفس فقط الى تحمل مسؤوليه عائلة وماكل مايطلبه المرء يدركه تجري الرياح بمالاتشتهي السفن فلما لاتكن تجربة المدينة الجامعية المدخل لترويض النفس على تحمل الصعاب ..الم تقرأوا ان اكثر مشكلات الطلاق هي تهرب احد الطرفين من تحمل المسؤوليه ومن يتهيب صعود الجبال يعش ابد الدهر بين الحفر ومن لم يعانقه شوق الحياة تبخر في جوها واندثر.<br />بصراحة الموضوع مهم جدا ولكن الغرابة في قفزة دعاء الشامي من قمم الادب العالمي الى الهموم الاجتماعيه وهذا ليس بغريب فهي عودتنا على المفاجآت ..كلمة اخيرة للكاتبة ..اذا كنت قد اضئت بصيص شمعة امل لولادة جان جينيه وأصحابه فلاتطفئيها في اقرب سلة مهملات تحت مكتبك."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525020145/http://masr.20at.com:80/article.php?sid=115&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 4
subject = "ياحبيب قلبي دول لسه سنه اولي"
author = "هبهوب...هبابه...هوووووبه"
posted = "2006-04-05"
text = "انا عيطت ليه يا دودو كدا بس<br />موضوع جميل ومش عايزه افتح فيه عشان لو فتحت حقلبها<br />مناحه معني الكلمه ...ويوفق كل متغرب ياختي<br />وبس عشان اناخلاص جالي احباااااط<br />اخيرا \"الدنيا مرمطه خلاص اقتنعت بوجه نظر ابويا<br />لازم تعيشيها حلوها ومرها بس مرها جاسي جوي يابوي<br />معلش هي كدا الدنيا يا خلي شوطه بتصيب وشوطه تجلي<br />يلا اعملو زوخليكو \"صبارة\""
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525020145/http://masr.20at.com:80/article.php?sid=115&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

