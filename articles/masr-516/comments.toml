subject = "ماما هي ماما"
author = "بنت البلد"
posted = "2006-06-14"
text = "اه صحيح هو ده بس اللي هاتعمله؟؟؟<br />عمومافايده ماما مش في الأكل او في الشرب او لأنها شايله عني حاجات كتير,فايده ماما لأنها ماما,ماما هي ماما من غير اي حاجه,بس موضوع جميل والله ولك تحياتي وربنا يرجع الوالده بالسلامه."
