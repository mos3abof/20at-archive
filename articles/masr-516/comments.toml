posted = "2006-06-14"
text = "بسم الله الرحمن الرحيم<br />احب في البدايه ااكد علي فضل الام علينا و من غير الام مش كنا هنيجي للدنيا يا ريت نقدم للام كل احترام وتقدير و بعدين لما تسافر ابقي اعمل اللي انا عايزه علشان كده عنده حق اللي كتب امي مسافره و هعمل كارثه لانها هيه اللي مخلياني احترم نفسي<br />تحياتي ......... ساحر الجنس الناعم<br />محمود عزت<br />mahmoudezzat1@yahoo.com<br />بااااااااااااااااااااااااااااي"
