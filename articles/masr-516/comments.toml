subject = "مقال ممتاز جداً"
author = "مصري مقيم بدبي"
posted = "2006-06-15"
text = "بجدالمقال رائع وعلشان اسلوبك الشيق جداً انا كملته لآخر سطر فعلاً الام هي كل حاجة في حياتنا,انا عايش في دبي بقالي 5 سنين وبنزل كل سنة شهر يمكن انا فقدت الاحاسيس اللي انت بتقولها علشان انا هنا لوحدي بس بجد اشتياقي لماما كبير اوي غير بابا وغير اخواتي بس بجد ميرسي علي المقال اللذيذ ده."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155056/http://masr.20at.com:80/article.php?sid=516"

[[comments]]
order = 4
subject = "كنت فاكره يا مصر انى تعبت منك........."
author = "نيفين نيفى نوفا"
posted = "2006-06-15"
text = "فكره اننا نعرف قيمه اهلنا بعد ما يبعدوا عنا طايما بتفكرنى بفكرهالناس اللى مبيعرفوش قيمه بلادهم الا بعد ما يسافروا بره<br />و فعلا يا جماعه شىء جميل جدااااااااااااااا ان الواحد يلاقى نفسه لوحده ف البيت<br />يا سلام حلو انك تفتح الكمبيز\\وتر و تعليه على الاخر (و لو اننا بيت عيله و هلاقى تيتا تنزل تقوللى انتى عامله فرح)<br />حلو انك تجيب القناه اللى انت عايزها و اللى دايما وجود حد جنبك بيرفضها<br />حلة انى اتفرج على الباليه<br />حلو انلى اسمع بعض الاحيان اغنيه هابطه حاسه ان ليها معنى الناس مش شايفاه<br />حلو انى احط كتاب فى مكان ما من الشقه و ارجع الاقيه بعد ساعتين ف مكانه<br />حلو احساس الوحده<br />بس لحد امتى<br />ما هو برده حلو انك تنادى على حد يجيبللك حاجه<br />حلو احساس ان فيه حس ف البيت<br />حلو احساس الكسل و اعتمادك على مامتك ف كل شىء<br />حلو لما الباب يخبط و اكون مش عايزه اقابل الناس الجايه انى اقول افتحى يا ماما<br />حلو ان حد خنيق طالبك و مش عايز ترد انك تخلى حد يرد و يقول انك مش موجود<br />الوحده حلوه بس مش على طول"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155056/http://masr.20at.com:80/article.php?sid=516"

[[comments]]
order = 5
subject = "كلم ماما ..."
author = "هوووووووووووبه"
posted = "2006-06-15"
text = "صحيح علي راي كل البشر اللي فوق دي ايه البراءة دي مبسوط عشان البيض المسلوق وبتهوفين ولايهمك بعد ما تمشي حيبقي \" البيت بيتك\".<br />وانا امي لما كانت بتسافر كنا بنعمل حفله بمعني الكلمه هيصه علي ظمبليطا شفت فيلم \"Home Alone \"بمواقفه المضحكه والشقيه كانت بتحصل خاصه مع اخواتي الصغار واهو اتفرج عليه بالمره يسليك , بس دلوقتي بقي يا بشر هوووووووبه مسافره ونصيحه لكل اللي معتمد علي الماما بتعاته يسبها كام شهر كدا وخليك جدع والجري نص الجدعنه طبعا , واهو بالمره تشد حيلك كدا وتكبر يا صغنن .<br />مــــــــــــاشي يا \" ورك البلد \"."
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616152909/http://masr.20at.com:80/article.php?sid=516"

