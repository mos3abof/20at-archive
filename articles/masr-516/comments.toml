posted = "2006-06-16"
text = "وديلى سلامى يارايح للحرم وادعيلى وسلملى على هادى الامم<br />انظر للكعبه يا محلاها نور وجلال يغشاها اذكرنى امامها وادعيلى<br />يا ماشى بهيمه من الصفا للمروه يا شارب من زمزم اتذكرنى بدعوه<br />هنيئا هنيئا يا رايح للهادى دا حبه شغلنى ملا كل فؤادى<br />ادخل من باب السلام بتادب واحترام واذكرنى امامها وادعيلى<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
archived = "2006-06-21"
