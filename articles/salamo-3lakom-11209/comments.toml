text = "احنا شباب اه احنا عايزين نجوز اه بس فى الحلال بس لازم نهتم بفلسطين شوووووووووووووو ية ونشوف الناس عاملة ايه فى البرد والسقعة شايفين عمرو اديب والروقان"
