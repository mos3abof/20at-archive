author = "مولي"
posted = "2009-02-08"
text = "وربنا انتم بقيتم موقع هايف وكل افكاركم ومواضيعكم اهيف منكم ايه ياناس خنقتوني كل الاحداث دي ومش لقين افكار ولا مواضيع عدلة تنشروها حتي المواقع بقت هفأ حرقتم دمي علي الصبح والموكوس المحرر تعب نفسه وعمل يعني يعصر في نفوخة علشان يكتب موضوع زي دا هايف اكيد الافكار طبعا بتدل علي اصحابها<br />رجااااااااااء الي المسؤلين عن الموقع دا اختاروا مواضيع عدلة تكتبوا فيها وارحمونا بقيييييييييي"
archived = "2009-04-24"
capture_url = "https://web.archive.org/web/20090424160619/http://www.20at.com:80/salamo-3lakom/11209-2009-04-22-13-47-03.html"

