order = 0
subject = "هاى يا هبهوب عاش من شافك"
author = "نيفين"
posted = "2006-02-12"
text = "ايه يا هبهوب يعنى لا حس و لا خبر<br />انتى فين و فين المذكرات و الحاجات اللى قولتى هتبعتيها<br />بالحق ايميليك ضاع منى معلش ابعتيه تانى<br />الموضوع لذيذ و فعلا بيحصل و اكتر من كده<br />هبهوب كان اكرم قاللك تسمعى اغنيه اسماعيل البلبيسى و انا كمان بقوللك اسمعيها لانها فعلا اغنيه ملهاش حل و تحفه<br />و معدتيش تكتبى على الحيطان تانى<br />متنسينيش بقى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131628/http://www.20at.com/article2.php?sid=418"

