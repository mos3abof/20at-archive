[[comments]]
order = 2
subject = "تفتكري انا مين؟"
author = "خسارة يا شيرين انك مش بتكتبي"
posted = "2006-02-12"
text = "انتي موهوبة<br />اعملي لنفسك واجب انك تكتبي حاجة اسبوعيا<br />بجد<br />وياسمين كمان<br />وواحد فول بالزيت الحار<br />على الأقل ترحمونا من بيرو وشركاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131628/http://www.20at.com/article2.php?sid=418"

[[comments]]
order = 3
subject = "مش قلتلكوا مصر لسه بخير"
author = "أكرم"
posted = "2006-02-12"
text = "عارفين الموضوع ده من اشد الموضوعات اللي قرتها على عشرينات من اول ما طلع<br />عشان كده انا لسه مصر يكون في تقييم للمقالات من خلال التصويت ( لو بتحبوا الديموقراطية صحيح ؟؟ ) عشان الناس تحكم و تعرفوا مدى شعبيتكوا صحيح ؟؟<br />و ياريت يا شيرين تكتبي كل يوم مش كل اسبوع<br />و كلمة اخيرة ( مش عارف بقيت رغاي اوي كده ليه ؟؟؟ )<br />الكتابة على الجدران هي عادة فرعونية قديمة و لولا الفراعنة ما كتبوا على الجدران ماكناش نعرف تاريخنا و لا تاريخهم ( هو تاريخ النهارده كام ؟؟؟ )<br />و بعدين ماهو المدرس في المدرسة بيكتب على الحيطة و المدرس في الجامعه بيكتب ع الحيطة و بصراحة ملكيش حق يا طنط ام هبهوب<br />قالا قوليلي هي والدتك اسمها ايه ؟؟<br />عشان ابقا ادعيلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131628/http://www.20at.com/article2.php?sid=418"

