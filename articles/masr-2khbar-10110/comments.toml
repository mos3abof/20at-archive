text = "الاول نظيف يتكرم مشكورا بهز طولة و ينظف مصر من الزبالة اللى مالية الشوارع و الحرامية و القوادين و العاهرات<br />و بعدين ابقى اتكلم على تنظيف المواقع الجنسية اللى على النت؟<br />هو دكتور نظيف موش نظيف و لا اية الحكاية بالضبط<br />دا انظف من الصينى بعد غسيلة ! نظيف نظيف نظيف جدا جدا جدا<br />ايوة و اللة العظيم نظيف و رايق زى المية(لا لون) و (لا طعم) و (لا رائحة)<br />هو فية نظافة زى كدة!!!!!!!!!!!! !!!!!!!!!!!!!!! !!!!!؟"
