author = "مصرى حتى النخاع"
posted = "2008-09-20"
text = "الحكومة دايما بتتصرف نيابة عن الشعب ويالتالى فاية المانع ان الاخوان والجماعات الاسلامية والمسيحية المتطرفة والمنتشرة فى ربوع مصر بتمويل خليجى امريكى ان تتصرف وتتحدث وتمرح نيابة عن الشعب المصرى<br />سالت سؤال مهم ياترى اية المانع لحجب المواقع الجنسية فى مصر ؟<br />وباعتبارى احد المصريين الصامتين اقول لك مافيش مشكلة ابدا لكن واية المانع من تغليظ العقوبة على الدعارة والخمور واية المانع بعد كدة من تغليظ العقوبة على السب والشتيمة بصوت عالى واية المانع من توقيع عقوبة على الفتيات الكاسيات ملابس مثيرة ثم اية المانع من توقيع العقوبة على من لاترتدى الحجاب ثم النقاب واية المانع من توقيع عقوبة على من يفتح محلة وقت الصلاة ثم اية المانع من فصل الشباب عن العوائل على البحر ثم اية المانع من توقيع عقوبة على من يرتدى لباس البحر الا ماكان شرعيا<br />اصلا دى رغبات الاف الرجال والعوائل المصرية وتتفق مع كل الدول العربية<br />اية المانع من توقيع عقوبة على حرية التفكير حتى ولو كان بينك وبين نفسك ؟؟؟؟؟؟؟؟؟؟؟"
archived = "2009-07-07"
capture_url = "https://web.archive.org/web/20090707020417/http://www.20at.com:80/masr/2khbar/10110.html"

