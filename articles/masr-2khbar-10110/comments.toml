author = "رضة انا برخامتة"
posted = "2008-09-20"
text = "من اوجاع القلب<br />لدى جارى شاب ظريف ذكى وعندة حيوية ومرح ومجتهد جدا ويدرس الهندسة فى احدى كلياتها وبتفوق<br />فجأة ابتدأ يدمن الكمبيوتر وشبكة النت ويسهر الليالى الطوال امامها - وطبعا كبير والرقابة علية فى هذة السن صعبة<br />وفجأة بدات تظهر علية اعراض الاكتئاب - وبدأ كلامة مع الاسرة يقل واصبح اكثر انطوائية<br />ثم تدهورت حالتة الدراسية - وعرف الرسوب لاول مرة وفى كل المواد - وتطورت الامور الى الامتناع بعد ذلك عن دخول الامتحانات<br />اننا نربى اولادنا على قيم شرقية واخلاقية<br />اما يجد امامة مواقع الشات الجنسية وامامة نساء عاهرات وافلام لا تخطر على ادائها اشهر الساقطات مصنوعة بتقنية كلها اثارة واثارة للغرائز امام شاب صغير عندة حياء ينتج عنة تفاعلات داخلية عنيفة<br />فى اروبا نفسها وفى المانيا برامج فلترة تمنع تلك المواقع بناءا على طلب الاسرة<br />وفى الخليج ودبى برامج تحظر تلك الاشياء كلها<br />من الممكن استعارة تلك البرامج من دولة مثل الامارات<br />انما ترك الامور على ما علية سينتج عنة بلاوى مثل تزايد حالات الاغتصاب والتحرش الجنسى بالفتيات والسيدات والعنف والانهيار الاسرى<br />ارجوك دكتور نظيف<br />اعملوا حاجة من اجل الشباب ومن اجل الاخلاق"
archived = "2009-07-07"
capture_url = "https://web.archive.org/web/20090707020417/http://www.20at.com:80/masr/2khbar/10110.html"

