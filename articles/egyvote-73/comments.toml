subject = "اللهم بارك لها و فيها و أكثر من أمثالها"
author = "على"
posted = "2005-11-27"
text = "للهم نطقت شهادة الحق مخافة منك ... و لم تخش قوى الظلم و الظلام , فكن وليها و كن حسبها , و كن وكيلها و أحمها من بطشهم , و أنصرها كما نصرت الحق , لا نزكى عليك أحداً سبحانك , و لكن نحسبها على خير ."
archived = "2007-08-14"
