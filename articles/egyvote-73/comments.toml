[[comments]]
order = 0
subject = "معك حق"
author = "محمد أباظة"
posted = "2005-11-27"
text = "امستشارة نهى الزيني إمرأة بألف رجل. و لا عزاء لأنصاف أو أشباه الرجال من عينة القاضي المزور الذي قلب الميزان للفقي الذي لا يحمل من الفقه شيئاً. و الله لقد كنت أحترم هذا الفقي و لكنه سقط من نظري سقوطاً ليس له من بعده قائمة. و لقد ذكرني موقف المستشارة نهى بقوله تعالى \"فلولا كان من القرون من قبلكم أولو بقية ينهون عن الفساد في الأرض إلا قليلاً ممن أنجينا منهم. و اتبع الذين ظلموا ما أترفوا فيه و كانوا مجرمين. و ما كان ربك ليهلك القرى بظلم و أهلها مصلحون."
archived = "2007-08-14"
capture_url = "https://web.archive.org/web/20070814023845/http://egyvote.20at.com:80/article.php?sid=73"

[[comments]]
order = 1
subject = "تحية من القلب"
author = "ikotb2004"
posted = "2005-11-27"
text = "حية من القلب الى الدكتورة منى الزينى...لقد اثبتت بان الدنيا مازالت بخ ير..لن ينسى شعب مصر شجاعتها وشهادة الحق التى ادلت بها..ان اللة سوف يكون معها وسيحميها على وقوفها بجانب الحق..نحن معك واكرر تحيتى واعتقد ان شعب مصر كلة معك بما فيهم من كانت هذة الشهادة ضد مصالحة..على فكرة واللة العظيم انا لست اخوانى."
archived = "2007-08-14"
capture_url = "https://web.archive.org/web/20070814023845/http://egyvote.20at.com:80/article.php?sid=73"

