[[comments]]
order = 5
subject = "لسه فيه الرمق"
author = "واحد مالوش فى التور"
posted = "2005-11-27"
text = "الله انا مستبشر خير بالرغم من كل الظلام اللى عايشين فيه فقد كنت سابقا اعتقد ان مصر قد أصبحت جثه هامده فرجالاتها سارقيين و شبابها لا هم لهم الا احدث الموبايلات و النغمات و بناتها مشغولات بالزواج العرفى و شيوخها قد هد حيلهم المبيدات المسرطنة و الزحف على البطون من أجل لقمة العيش ... لكن كنت خاطئا فلازال فى الجسد رمق حياة و لا ربما يتعافى و ترجع أليه فتوته ... و الذى دعانى لاحياء التفاؤل و نفض ظلام الخفافيش عن عيونى أمران مكملان لبعضهما هو فوز الاخوان و شهادة هذه المرأة التى لا أقول حديدة و لكن إمراه لا يقل وزنها عن الاف الرجال الذى أذلوا نفسهم للدنيا فأذلتهم الدنيا و خنعوا للحاكم فأذلهم الله ... فتحية من القلب و جزاك الله خيرا .... و الكلام لرجال خجلت الرجولة من أنتمائهم اليها"
archived = "2007-08-14"
capture_url = "https://web.archive.org/web/20070814023845/http://egyvote.20at.com:80/article.php?sid=73"

