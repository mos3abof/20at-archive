text = "كلا فاني لا اشتري الملابس المستخدمة لكونها غير متوفرة هنا في سلوفينيا . ولكن ان هذة الملابس تغسل وتكوى بالمكوى البخاري على العموم هذة الملابس تجمع كمساعدات للمحتاجين وليس للبيع .شكرا لهذا الاهتمام بهذة المواضيع مع التقدير"
