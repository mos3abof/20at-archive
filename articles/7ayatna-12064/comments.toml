subject = ""
author = "الحسين الصغير - مصر"
posted = "2009-05-13"
text = "السلام عليكم أخي فؤأد<br />والله مقال جميل أشكرك عليه<br />وبالفعل البالات وشراء الملابس المستورده اصبح منتشكر بشكل كبير<br />حتى عندنا في مصر هناك سوق مخصص للملابس المستعملة المستورده والتي تلاقي إقبال كما هو الحال بالعراق لجودتها ولمركاتها العالمية<br />والمشكلة والخطورة مما يمكن ان تحمله من أمراض<br />لكن في ظل أرتفاع الاسعار فعلا لا يوجد بديل افضل<br />والله يوفقك دائما وللأمام يا أخي<br />اخوك الحسين من مصر"
archived = "2009-05-16"
capture_url = "https://web.archive.org/web/20090516051136/http://20at.com:80/7ayatna/12064-2009-05-13-14-03-47.html"

[[comments]]
order = 1
subject = ""
author = "هارون عمايرة-فلسطين"
posted = "2009-05-14"
text = "البالة في معناها ليس كمحتواها كاتبنا العزيز<br />ولعرض وجهة نظر الزبون والتاجر يجب ايضا عرض وجهة نظر القائم باعمال الحكومة التي تسمح بهذا الامر والتي تشرف عليه<br />لكن موضوع البالة والذي لا يوجد عندنا في فلسطين فهو كما يقال لنا في الاردن عنه انه افضل من منتوجنا بالكثير وهذا ما نحن نرغب به دائما<br />فثقافة البالة ليست بثقافة هجينة علينا بل هي ثقافة الفقر الي زرعه ويزرعه القائمين علينا<br />فنعود الى بيت الشعر الجميل الذي يقول بكل حكمه<br />لا تحسبوا رقصاتي بينكم فرحا …فالطير المذبوح يرقص من الالم"
archived = "2009-05-16"
capture_url = "https://web.archive.org/web/20090516051136/http://20at.com:80/7ayatna/12064-2009-05-13-14-03-47.html"

