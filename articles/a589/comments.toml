[[comments]]
order = 14
subject = "لماذا هذا كله؟"
text = "أخي الكريم لماذا هذا الحق كله لعالم من علماء المسلمين، وإن كنت أنت لا تثق في كلامه وعلمه، فلا يجوز لك ان تخوض في عرضه.<br />وأقول لك اعتبره شخص عادي. فهل يجوز التجريح والمساس بعرضه؟ أرجو من الله أن يغفر لنا أجمعين.<br />ثم إني أدعوك يا أخي أن تستغفر الله سبحانه وتعالى، مما تفوهت به وكتبته يداك، فإن الله سبحانه وتعالى يغار على أعراض المسلمين، ولا يقبل مثل هذا الافتراء.<br />أخي الكريم،<br />أولا يجب أن تتعلم أسلوب النقد.. النقد البناء... لأننا نحن مسلمين... ثم يجب أن نتخير الكلمات التي نتفوه بها... لأننا محاسبون عليها كما تعلم أخي الكريم \"ما يلفظ من قول...\".<br />ثم يا أخي الكريم أقول لك أن هذه الفرقة منهي عنها كما يقول المولى عز وجل في سورة آل عمران \"واعتصموا بحبل جميعا ولا تفرقوا\" ويقول سبحانه وتعالى (ولا تكونوا كالذين تفرقوا واختلفوا من بعد ما جاءهم البينات).<br />وأمرنا أن نوالي بعضنا البعض فيقول سبحانه(والمؤمنون والمؤمنات بعضهم أولياء بعض) وكذلك يقول سبحانه وتعالى (إنما المؤمنون أخوة فاصلحوا بين أخويكم واتقوا الله لعلكم ترحمون) أفلسنا نبحث عن رحمة الله أن تعمنا وتعم الأمة الفقيرة إلى رحمة الله.<br />وأمرنا كذلك (يا أيها الذين أمنوا إن جاءكم فاسق بنبأ فتبينوا أن تصيبوا قوما بجهالة فتصبحوا على ما فعلتم نادمين) صدق الله العظيم<br />وأذكرك بالرجل الذي بشره المصطفى صلى الله عليه وسلم بالجنة 3 مرات، والحديث معروف ومشهور وكان السبب أنه يبيت لا يحمل حقدا ولا كرها لأحد من المسلمين...<br />فهل فعلنا مثله حتى نكون من أهل الجنة....<br />وأخيرا أقول علينا أن ننشغل بمعالي الأمور ونترك سفاسفها... أي علينا أن نبحث عن الموضوع الذي تكلم فيه فضيلة الشيخ... الحجة بالحجة والدليل بالدليل... أما أن نترك الموضوع ونجرح في الأشخاص هذه تجارة المفلس.... عذرا... فهكذا علمنا علماءنا...<br />وأخيرا تقبل مني خالص التحية والاحترام..<br />.................................حالم بمستقبل مشرق.............."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

[[comments]]
order = 15
subject = "لعن الله شيوخ المصلحة"
text = "سبحان الله<br />ما تسمونه اشاعة هو معلوم عند كل الناس<br />وجزء منه من مذكرات القرضاوي نفسه<br />وتحديدا الجزء الخاص بصلاح نصر<br />وموضوع امير قطر ظاهر كالشمس لكل من تابع تطور الموقف من اول الانقلاب وحتى يومنا هذا<br />وقاعدة السيلية كانت تيث منها الجزيرة اخبار الحرب<br />ومعروفة للجميع واولهم القرضاوي شيخ امير قطر<br />وموضوع المليون دولار من امير دبي نشر في اسلام اونلاين<br />وللاسف وجدنا الشعراوي رحمة الله عليه له مشروعات خيرية<br />حتى الدكتور مصطفى محمود اللذي طالما قيل في حقه الاقاويل له اعمال خيرية تشهد له<br />بينما القرضاوي كبير المقام رايح يتجوزلي بنت عندها 16 سنة حتى بالامارة اسمها اسماء<br />اما الاشاعة الحقيقية فهي ما تروجونه انتم عن ورع وتقوى القرضاوي !!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

