subject = "احمد خان"
text = "الى صاحب الاشاعات الي ملهاش لازمه<br />والله انت باين عليك في ثأر بينك وبين القرضاوي<br />عندما يدرس بنات الشيخ يوسف في امريكا فان دل الموقف هاي على شىء فهو يدل على ان الاسلم دين تحرير المراه ولها الحق في دراسه العلم ولو في الصين واشاعه ان اولاد القرضاوي غير محجبات خطا يا صاحب الاشاعات البلهاء .........يل اخي بدل ان تكتب الاشاعات ادعي لهن بان يثبتهن الله في بلاد العم سام ويبعد عنهم شر اعداء الاسلام"
