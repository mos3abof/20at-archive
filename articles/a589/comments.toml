[[comments]]
order = 2
subject = "لعن الله شيوخ السلاطين"
text = "القرضاوي كان من الاخوان ايام عبد الناصر<br />حكم عليه بالسجن<br />فعقد صفقة مع صلاح نصر بمقتضاها يتجسس على اخوان الخليج<br />فافرج عنه واعطاه باسبورا وارسله الى الخليج !!!<br />القرضاوي كان مع حاكم قطر<br />نط ابن حاكم قطر على كرسي قطر<br />نط القرضاوي في حضن الحاكم الجديد<br />حاكم قطر حب يزرع كلية<br />اشتراها من واحد باكستاني<br />لكن الاسلام لا يبيح نقل الاعضاء<br />فاباحه القرضاوي لجل عيون اميره<br />القرضاوي يفتيلنا هنا فتوى<br />ويروح اوروبا يلحسها<br />القرضاوي يتلقى مبلغ عشرة ملايين دولار من امير دبي<br />من اجل موقعه على الانترنت !!!!!!!!!!!!!!!!<br />واطفال مصر يموتون من الجوع وينامون تحت الكباري<br />واطفال السودان تفترسهم النسور<br />ونعم الشيوخ !!!<br />قرضه فأر مسلط من جهنم ان شاء الله !!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

