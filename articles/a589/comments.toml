[[comments]]
order = 4
subject = "مسلمة"
text = "في أحيان كثيرة تخرج تعليقات عشرينات عن لب الموضوع والحقيقة أن هذا يضايقني ويضايق كثيرين من قراء عشرينات وبنستحمل .. عادي .. لكن أخونا اللي كان كل تعليقه اساءة للشيخ القرضاوي أعتقد أنه من الضروري الرد عليه أولا لأنه لم يسئ للقرضاوي قدر ما أساء لنفسه ولنا أيضا<br />القرضاوي في هذا المقال يطرح رؤية مهمة حول المرأة في الاسلام وتحمل قدر عالي من الاستنارة والاجتهاد والاعتدال ... ومطلوب سماعها والحوار معها في ظل الثقافة الدينية التي تدفع نحو الوأد المعنوي للاناث السائدة حاليا .... لكن أخينا بدل ما يرد على هذه الرؤية بكام عقلاني فتح بالوعة من الاتهامات (الله واعلم بمدي صدقها) لكنها غلوشة ع الموضوع وكأنه مطلوب ألا نسمع كلاما جادا في أي قضية جادة ... مطلوب فقط أن نسمع شتيمة وصراخ واتهامات<br />اعترف باني اخذت موقفا من المشايخ لفترة طويلة تحت تأثير نظرية مشايخ السلطان وبالوقت اكتشفت اننا بحاجة لمرجعية نسمع منها ونتحاور معها لا ننساق وراءها واعجبت بما يطرحه القرضاوي دون تقديس له .. وهذا هو واجب المسلم .. أن يحسن التحاور حول قضايا دينه<br />استغفر الله يا أخي في ما القيته من اتهامات بلا بينة .. وادخل في لب الموضوع ...الم يكن الاسلام دينا رائعا في فتحه الأفاق أمام النساء للمشاركة في المجتمع<br />لا إله إلا انت سبحانك اني كنت من الظالمين"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

[[comments]]
order = 5
subject = "مسلمة تاني"
text = "وكمان أخونا اللي كل همه ان ندفن نساءنا في الرمال بدعوى أنهن لسن كنساء الصحابة ... وانهن زي شاكيرا .. يا أخي الننبت يحسن إذا احسن رعايته وفتح الأفاق أمام المرأة كي تدرس وتعلم وتشارك هو خير اصلاح لها ... ونساؤنا صرن في أدنى المراتب من يوم ارتفعت دعاوى حجبهن وهذا مما ليس في أصل الاسلام"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

[[comments]]
order = 6
subject = "من إخوان مصر"
text = "السلام عليكم ورحمة الله وبركاته بداية أقول \" الحكمة ضالة المؤمن أنى وجدها فهو أحق الناس بها\" , فحتى إن كان الدكتور يوسف القرضاوي كما يقول \"الأستاذ\" الذي تحدث بالأعلى , فخذ ما يصلح ودع ما لا يصلح.. هذه نقطة , النقطة الثانية ممكن \"الأستاذ\" الذي يسب شيوخ السلاطين ويعتبر القرضاوي منهم يوضحلنا هو ايه مؤهلاته الشرعية أو مصادره التاريخية علشان يتكلم عن شيخ جليل مثل الدكتور يوسف القرضاوي؟!! ام هو سب فقط دون بينة؟!! ثم من قال أن الدكتور القرضاوي ترك الإخوان أو حتى تآمر عليهم؟ راجع معلوماتك واتق الله...<br />الأخت مسلمة بارك الله فيك واستمري على منهج الاعتدال هذا..<br />نصيحة : تكلموا في الموضوع بعيدا عن شخص الدكتور القرضاوي أو بمعنى آخر \" الحكمة ضالة المؤمن أنى وجده فهو أحق الناس بها \""
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

[[comments]]
order = 7
subject = "نسأل الله الهداية"
text = "أسأل الله العظيم رب العرش العظيم أن يهدي فرقة الإخوان المسلمين إلى الحق المبين فقد ضيعوا دين ربهم وميعوه والله المستعان<br />وهذه بسبب رؤوس الضلال الذين منهم صاحب هذا المقال وإن كان ما ذكره في المقال أثار وأحاديث وقصص صحيحة ولكن لا ندري ايش المراد منه في هذا الوقت؟ وهل المرأة المسلمة محرومة من حقوقها حتى يأتي فلان وعلان ليطالبوا بحقوقها؟<br />لا ولكنه الجهل الذي جعل أكثر النساء لا يعرفن حقوقهن الذي منحها الله إياهن!<br />فالعلم العلم العلم<br />والعمل العمل العمل<br />وإياكم ورؤوس الضلال وأن زينوا وبهرجوا لكم الكلام وإن أظهروه في شكل الدفاع عن المسلمين<br />فهم مرة يقولون الإخوة النصارى ومرة الإخوة الرافضة-قاتلهم الله- ومرة يجالسون النساء المتبرجات مثل تلك التي جالسها الغزالي السقا والقرضاوي وغيرهم من روؤس الفتنة<br />والله المستعان"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

[[comments]]
order = 8
subject = "الى صاحب الاشاعه"
text = "قائل الكلام ده هيتحاسب يوم القيامه لان دي فتنه بغض النظر عن الكلام ده صح ولا مش صح لانه ممكن يعمل مشكله في قطر بلكلام ده بعدين الكلام ده ليس في الوقت المناسب ولا في المكان الناسب لان القرضاوي لا بتحدث عن نفسه بل يتحدث عن المراه والاختلاط<br />لما يتحدث عن نفسه نبقى نشوف الكلام ده ينفع يتنشر ولا لا<br />احمد خان"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

[[comments]]
order = 9
subject = "من إخوان مصر"
text = "بارك الله فيك أخي \" حالم بمستقبل مشرق\" و على من يظن بالإخوان سوءا أن يقرأ تاريخها جيدا .. و أذكركم ثانية \" الحكمة ضالة المؤمن أنى وجدها فهو أحق الناس بها\"<br />و أرجو من المعلقين أن ياتزموا بأدب الحوار في الإسلام بعيدا عن التجريح والسب والاتهام لأن هذا ما يريده من أعداؤنا"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

