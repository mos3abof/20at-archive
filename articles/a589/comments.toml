[[comments]]
order = 0
subject = "خالص حبي وتقدير"
text = "مع خالص حبي وتقديري لفضيلةالشيخ يوسف القرضاوي.<br />لدي تسائل هل نساء اليوم مثل نساء الصحابة، رضي الله عنهم أجمعين، لأني على ما أرى من واقعنا المرير أننا نزلنا إلى مستوى الشهوات وغلبنا جانب الطين على جانب الروح....<br />فنساء الصحابة كن يبحثن عن العلم والفضيلة، ونساء اليوم (معظمهن) يلهثن وراء الغربيات، وتقليدهن في زيهن اللافت للنظر والكاشف للعورة، والتخلق بالسيء من أخلاقهن....<br />وأنا لا سمح الله لا أعترض على فضيلةالشيخ، فإني أتمنى أن أكون من تلاميذه... أو تلميذا لتلاميذه... أكرمه الله بالعمر المديد والعمل السديد... ونفعنا بعلمه... حشرنا جميعا مع سيدنا محمد صلى الله عليه وسلم...... آمين<br />..........................حالم بمستقبل مشرق.........................."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

