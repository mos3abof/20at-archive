subject = "هذا بهتان عظيم"
text = "(لَوْلاَ إِذْ سَمِعْتُمُوهُ ظَنَّ الْمُؤْمِنُونَ وَالْمُؤْمِنَاتُ بِأَنْفُسِهِمْ خَيْرًا وَقَالُوا هَذَا إِفْكٌ مُّبِينٌ)<br />(وَلَوْلاَ إِذْ سَمِعْتُمُوهُ قُلْتُم مَّا يَكُونُ لَنَا أَن نَّتَكَلَّمَ بِهَذَا سُبْحَانَكَ هَذَا بُهْتَانٌ عَظِيمٌ. يَعِظُكُمُ اللهُ أَن تَعُودُوا لِمِثْلِهِ أَبَدًا إِن كُنْتُم مُّؤْمِنِينَ)<br />صدق الله العظيم<br />تب أخي الكريم قبل أن يفاجئك الموت فتتحسر على ما قلته على فضيلة الشيخ القرضاوي.<br />أنت لست مأمورا بمحاسبة الناس، فعليك بخاصة نفسك ماذا فعلت أنت لخدمة الإسلام والمسلمين؟!<br />وأين أنت من الدعوة إلى الله سبحانه وتعالى...<br />يا أخي إني أشعر أنك تحمل حقدا لشخص الدكتور القرضاوي، هذا لا يجوز، لأنه مسلم، فضلا عن أنه عالم، وإن أنت اختلفت معه في الرأي.<br />هكذا تعلمنا من نعومة أظافرنا أن لا نعتدي على مسلم بالقول أو الفعل.... أنت أثبت أنك لا تملك حجة فالرجل يقول لك كان النبي يفعل وقال النبي صلى الله عليه وسلم وأنت تركت الموضوع وتجرح في شخص القائل... وهل هذا من أدب الإسلام الذي تعلمناه....<br />أنت تحمل في قلبك حقدا نسأل الله أن يطهره فندعو الله أن لا يجعل في قلوبنا غلا للذين آمنوا..<br />وقلت لك أن هذه تجارة (((المفلس)))<br />سامحك الله.... وغفر لك<br />واللعنة عموما لا تجوز على شخص بعينه ففي الحديث:‏قال رسول الله ‏ ‏صلى الله عليه وسلم ‏ (‏لا تلاعنوا بلعنة الله ولا بغضبه ولا بالنار)‏أي لا يلعن بعضكم بعضا فلا يقل أحد لمسلم معين عليك لعنة الله مثلا......تحفة الأحوذي بشرح جامع الترمذي<br />وأيضا: ‏عن ‏ ‏عائشة‏ (ض) ‏قالت :(‏ما لعن رسول الله ‏ ‏صلى الله عليه وسلم ‏ ‏من لعنة تذكر.....) جزء من حديث شرح سنن النسائي للسندي.<br />‏عن ‏ ‏ابن عمر (ض)‏ ‏قال: ‏قال النبي ‏ ‏صلى الله عليه وسلم ‏ (‏لا يكون المؤمن لعانا) الترمذي<br />وفي صحيح مسلم: ‏قال رسول الله ‏ ‏صلى الله عليه وسلم ‏(‏لا يكون اللعانون شفعاء ولا شهداء يوم القيامة) جزء من حديث.<br />‏(بينما جارية على ناقة عليها بعض متاع القوم إذ بصرت بالنبي ‏ ‏صلى الله عليه وسلم ‏ ‏وتضايق بهم الجبل فقالت ‏ ‏حل ‏ ‏اللهم العنها قال فقال النبي ‏ ‏صلى الله عليه وسلم ‏ ‏لا تصاحبنا ناقة عليها لعنة) مسلم<br />‏أبي الدرداء (ض): ‏سمعت رسول الله ‏ ‏صلى الله عليه وسلم ‏ ‏يقول ‏(‏إن ‏‏ اللعانين ‏ ‏لا يكونون شهداء ولا شفعاء يوم القيامة) مسلم<br />وفي صحيح البخاري: ‏عن ‏ ‏أنس (َض)‏ ‏قال (‏لم يكن رسول الله ‏ ‏صلى الله عليه وسلم ‏ ‏فاحشا ولا لعانا ولا سبابا كان يقول عند المعتبة ‏ ‏ما له ‏ ‏ترب جبينه)<br />أظن هذا يكفي....."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

[[comments]]
order = 18
subject = "ابن بلد"
text = "أنت يابني ادم الراجل بتاع المستقبل بيكلمك بكلام سيدنا النبي ألف صلاة وسلام ونور عليه، وانت برضه مافيش فايدة...<br />هو أنت أيه بس حيرتني، واللا زي ما بيقولوا بينك وبين الشيخ تار بايت.....<br />أنا مليش في الموضوع دة، بس لما قرات الكلام بتاعك.. اتنفزت....<br />انت مالك واحد اجوز واحدة صغيرة طيب هو انت مالك هو قالك اديني حاجة... مش احسن من اللي بيدور على حل شعره..<br />وبعدين تعال قولي هو انت مسلم؟. أنا شكك فيك.. باين عليك من العيال اياهم...<br />عجبي"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

[[comments]]
order = 19
subject = "هو بعينه بغباوته وائل"
text = "أيها الأعزاء:<br />جميع التعليقات التي تهجمت على القرضاوي هي من كتابة المدعو وائل عباس فهو يعادي الإخوان المسلمين والقرضاوي ووصلت به الوقاحة إلى سب ابن تيمية، وجميع أخباره الساقطة عن القرضاوي وعن بناته يستقيها من جريدة صفراء قذرة تصدر في أمريكا عن شخص وضيع لا يعرف له انتماء اسمه أسامة فوزي ، فرجاء لا تكترثوا للمدعو وائل كثيرا فكلامه عبارة عن قمامة يجب عدم الاقتراب منها.<br />أحمد الشاذلي"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041556/http://www.20at.com:80/article.php?sid=589"

[[comments]]
order = 20
subject = "الاجابة لك وحدك أختى المسلمة"
text = "لماذا ينتقل الحوار حول الموضوع الى الحوار حول الشيخ القرضاوي و نعلم أن كل شخص نأخذ منه و نرد عليه الا رسول الله عليه الصلاة و السلام - و مشروعية عمل المرأه في الاسلام من حيث الأصل ذكره الكاتب في المقاله و تبقي مسألة المصلحه و المفسدة من العمل و مدي احتياج المرأة للعمل- أننى أحترم المرأة التى تعمل لأنها وجدت نفسها مضطرة للعمل لحاجتها اليه فعلا - أما أن يكون العمل بلا أسباب حقيقية مثل - المساوة مع الرجل- الفراغ - الملل - الخروج من المنزل - الرفاهية - فأرجو من أختي أن تراجع نفسها قليلا - أتحدث الى المسلمة-هل العمل يقربك الى الجنة ام يبعدك عنها ؟؟ الاجابة لك وحدك وكل أخت تختلف الاجابة عندها وهي رقيبة علي نفسها ؟؟؟<br />أختي المسلمة - اريدك في الجنة و الجنة فقط فأعملي لها في أي مكان .<br />سامى عفصه"
archived = "2004-11-23"
capture_url = "https://web.archive.org/web/20041123124923/http://www.20at.com:80/article.php?sid=589"
