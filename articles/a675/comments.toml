subject = "رمضان هذا العام"
text = "السلام عليكم ورحمة الله وبركاتةكل عام وانتم بخيرالاخت هبة بارك اللة فيكرمضان لة حلاوة لايعرفها الا الذين ذاقوها وانا كرمني الله منذ ثلاث سنوات وذقت حلاوتة فعلمني الله كيف احبة وكيف احرص علي ان ارضية فعرفت فية اول مرة صلاة التهجد( انا وربي والناس نيام) ودوامت عليها بعد رمضان بصورة غير منتظمة للاسف وانزل اللة في قلبي حب الصلاة فاصبحت اشتاق الي الصلاة بعد ان كنت اؤديها فرضاا وحافظت علي ختم القران مرتان في رمضان كل عام وقراتة طول العام فالقران اصبح رفيقي الذي لا استطيع البعد عنة ويرجع الفضل لله اولا ومعلمي الاستاذ عمرو خالد ثانيا الذي دلني علي الطريق( لاعطاء كل ذي حق حقة) .. صدقوني رمضان فرصة عظمة لنعرف اللة وتغير انفسنا بصورة جذرية ويكفي كنوز الحسنات في هذا الشهر .واتمني في رمضان هذا العام ان يهئ لي الحياة والظروف ليقربني منة وافعل كل يرضية ويبعدني عن كل ما يغضبة ويمدينا بجرعة ايمانية نستمر بها طول العام وان يتقبل اعمالنا ويستجيب دعواتنا ويعز امة حبيبة محمد صلي علية علية وسلم"
archived = "2004-10-18"
