subject = "بشراك ياابن بهية"
author = "فارس_fr"
posted = "2006-11-15"
text = "يبشرك بالخير يابن بهية !!! معقوله فى 2012البلد هتكون اتغيرت ؟؟؟ ولا هتكون خلاص اتورثت ؟؟؟ معقول البلد هتصحى من الغفوة اللى طولت دى !! مش عارف ليه مش مصدق !! يابن بهيةالبلد عايزة انقلاب من نوع تسونامى عشان يغير البلاء اللى الناس عايشه فيه !!!<br />معقوله ف 2012 اللى مش لاقى وظيفة هيتوظف \"ويتجوز\" والبنات تتجوز ومنحوت الدخل حالته تتغير !!!! معقوله ده يحصل !!! معقوله الشباب المتغرب والطيور المهاجرة دى ترجع تانى والخبرات اللى بيستفيد منها غيرنا !نستفيد منها احنا ! مش معقوله !! طيب مبارك ساعتها عيكون فين هو والحاشية الكريمة!! معانابرده اهو ده اللى مش معقول ياابن بهية !!!!<br />انت بتحلم حلم جميل قوى ياااارييت يتحقق ..معقوله يرجع المصرى يرفع راسه ويفتخر انه مصري ونرجع لامجادنامن تانى !!! الله يبشرك بالخيريابن بهية ....."
