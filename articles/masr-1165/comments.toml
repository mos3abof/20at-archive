text = "بعد كثرة تسرب مقاطع الفيديو التي تحتوي علي انتهاكات ضد المواطنين، قال أحد الخبثاء أنها وسيلة من وزارة الداخلية لإرهاب المواطنين علي طريقة \"لو مسمعتموش الكلام هنعمل \"فيكو\" زي ماعملنا في عمو\".<br />ـــــــــــــــــــــــــــــــــــ<br />وخبثاء ليه يا ولاد البلد فيه حد يشتم نفسه"
