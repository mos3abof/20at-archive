subject = "اللهم احفظ الرئيس العراقي ورفاقه من يد العملاء والأحتلال النازي"
author = "Agenda Irak info Français English Español العربية Links Photos"
text = "المحامي الفرنسي ايمانويل ليدو : صدام حسين المحكوم مسبقا<br />في مقابلة نادرة مع صحيفة القدس العربي 6/12/2004 كشف المحامي الفرنسي ايمانوييل ليدو المكلف بالدفاع عن الرئيس العراقي صدام حسين عن جزء بسيط من الحقائق التي تفضح كذب وتزيف كل التهمة التي روج لها الخونة والعملاء ومجوس القرن العشرين وعملاءهم من المنافقين عن الرئيس الشرعي للعراق صدام حسين.<br />11 كانون الأول 2004<br />Cet article est disponible en français sur iraqresistance.net<br />هذا المقال متوفر بالفرنسية على موقع مقاومة العراق<br />صورة غلاف كتاب \"صدام حسين المحكوم مسبقا\" للمحامي الفرنسي ايمانويل ليدو<br />فالمحامي يؤكد انه يملك مايثبت براءة العراق من تهمة ضرب الاكراد بالغاز وان ايران هي التي قتل الاكراد وليس العراق!<br />ويؤكد ان اعتقال الرئيس مخالف لكل القوانين والاعراف الدولية، كما يوضح انه لا المحتل الامريكي الصهيوني ولا جواسيسه في العراق يملكون اي قدرة على محاكمة صدام!<br />واخيرا يؤكد المحامي الفرنسي ان المحتل وكلابه هم من يحتاج الى التفاهم مع الرئيس صدام حتى يضمنوا ان لايكشف جرائمهم للعالم ويفضح حقيقتهم!<br />واخيرا قال المحامي في رده عن سؤال حول استرايتجية محامي الرئيس في الدفاع عنه:<br />\"أولا في خطتنا، أن نتوجه للسلطة العراقية والأمريكية معا بعدم القبول بشرعية القضاة المعينين من طرف قوات الاحتلال، فهم سيكونون قضاة عراقيين ولكن بعيون المخابرات الأمريكية، ولقد قلت إلي زملائي الأردنيين بأنا أمام زبون غير عادي، فهو رئيس دولة، ومن ثم يجب معاملته بحكم هذا المنصب وقبل ترتيب أية استراتيجية قد تتعثر لأسباب كثيرة، يجب في البدء مقابلة صدام حسين والاستماع إلي توجيهاته، فهو شخص ذكي واستراتيجي من الطراز الأول، له أفكار دقيقة، وبالتأكيد سيكون له طلبات معينة. فهو القائد وليس نحن.\"<br />وعندما سأله صحفي القدس انكم تقولون في الكتاب أن أي تصريح من طرف صدام حسين، كان سيزعج الأمريكيين، لهذا لم يسمح إلا لوسائل الإعلام الأمريكية للاستماع إلي أولي تصريحاته بعد اعتقاله؟<br />اجاب المحامي:<br />\"نعم، لقد أدركنا منذ بداية اعتقاله منذ 13 ايلول (سبتمبر) أن العملية الإعلامية مهمة، فلقد علمنا دائما عن طريق الصليب الأحمر أنه بتابع كل ما يقال في وسائل الأعلام كما أنه استطاع مشاهدة فيلم مايكل مور، وأنه يقرأ مختلف الجرائد العربية، حتي كتابي هذا وصله خلال أسبوع، وأثني عليه كثيرا، أستطيع القول من هذا الجانب أن الديمقراطية الأمريكية فعالة جدا، ومن ثم طلبت من زملائي في عمان بأن نقوم بمقابلات صحفية نمرر من خلالها تفاصيل دقيقة ونوجه له بعض التوجيهات القانونية، وفي أول مقابلة له معه قاضي التحقيق كان رائعا.\"<br />ملاحظة: هناك بعض الامور التي وردت في المقابلة والتي من السهل ملاحظة انها جاءت من قبيل تحسين صورة الامريكان من مثل قول الصحفي ان الديمقراطية الامريكية فعالة عند ذكره للجرائد التي يطلع عليها الرئيس! ومن مثل تلميحه بان الاحتلال سيسمح للرئيس بالترشيح للانتخابات!! (هل يحتاج الرئيس الشرعي للعراق ان يستجدي الشرعية من المحتل!) وكذالك عندما نفى ان يتم قتل الرئيس او تسميمه! نقول اننا لاندري كيف وردت هذه المقولات في المقابلة ومن هو المسؤول عن ترويجها، ورغم اننا نتمنى ان لايتم التخلص من الرئيس صدام، ونتمنى ان يكون قادر على متابعة مايجري في العالم الا اننا نستغرب تأكيد المحامي لهذا وهو يعترف في المقابلة بانه لم يتمكن من مقابلة الرئيس صدام حتى الان؟!!!<br />لهذا اردنا التنويه، فقد تعودنا على دس السم بالدسم، ولانزال نحاول دائما استخلاص الدسم وتجنب السم ماامكن!!<br />نص المقابلة<br />إيمانوييل ليدو المحامي الفرنسي عن الرئيس العراقي :<br />هذه حقيقة الاباطيل في حق التهم الزائفة الملفقة للرئيس الاسير!<br />إثر صدور كتاب صدام حسين المدان مسبقا للمؤلف المحامي إيمانويل ليدو الذي يتولي الدفاع عن صدام حسين، التقته القدس العربي في مكتبه بباريس. وكان هذا الحوار الذي يتحدث فيه عن خيوط محاكمة تتسم بالغموض والتعقيد في ظل تجاهل كلي للقوانين والمواثيق الدولية من طرف قوات الاحتلال الأمريكية. كما يقدم معلومات تنشر للمرة الأولي عن تحضيرات أمريكية سابقة لغزو العراق بمال العراقيين، وعن الدور السيئ الذي لعبته هيئة الأمم المتحدة في برنامج النفط مقابل الغذاء وعن احتمال مقايضة صدام حسين بمنحه لجوءا سياسيا نحو بلد يختاره لقاء صمته.<br />في كتابك تحاول معالجة قضية صدام حسين من وجهة قانونية بحتة وفق المعاهدات والاتفاقات الدولية وما تقتضيه أية هيئة قضائية في العالم التي تكفل حق أي متهم في الدفاع عن نفسه، وتخلص في النهاية إلي أن محاكمة صدام حسين بالصيغة التي تريدها الولايات المتحدة غير شرعية، فما الذي لم تحترمه الولايات المتحدة في ملف صدام حسين؟<br />الحرب غير شرعية<br />ببساطة، أقول إن الحرب التي قادتها الولايات المتحدة بمعية بريطانيا هي خرق فاضح للقوانين الدولية، فهيئة الأمم المتحدة وحدها وفقط وحدها الكفيلة بإصدار قرار خوض حرب أو إيفاد قوات عسكرية إلي أية جهة في العالم بهدف سلمي، وأن لا نخوض الحرب من أجل الحرب. هذه إحدي أبجديات القوانين والمواثيق الدولية الغاية منه القضاء علي بؤر التوتر في العالم، ونزع المعاناة عن من يعانون ويلات الحروب الداخلية لأسباب دينية أو عرقية أو غيرها، والعراق برأيي لا يدخل في أي خانة من الذي ذكرت. الأمريكيون ذهبوا بعيدا في فلسفتهم، فعندما استنتجوا بان هيئة الأمم المتحدة لم تقتنع بحجة وجود أسلحة الدمار الشامل لدي صدام حسين، بكل بساطة قرروا ضرب العراق بشكل أحادي دون أي غطاء أممي، ومن ثم فالضربة العسكرية الأمريكية ضد العراق غير مؤسسة وضربت عرض الحائط القوانين التي تسير المجتمع الدولي. وفوق ذلك هي تـأسر رئيس دولة اليوم بغير وجه حق، وتسقط نظاما برمته وتستبدله بهيئة مؤقتة لتسيير شؤون البلد، وتنشئ هيئة قضائية خاصة لمحاكمة الرئيس الأسير من طرف قضاة تعينهم الإدارة الأمريكية، ويؤسسون بدورهم ملفا يحمل سبع اتهامات خطيرة ضد صدام حسين رئيس العراق دون أية شرعية قانونية أو قضائية.<br />ايران وحلبجة<br />في كتابك خصصت فصلا عن قضية حلبجة التي تتهمه الجهة القضائية المكلفة بمحاكمة صدام حسين بارتكاب جرائم قتل استعمل فيها الغاز وتنسب الجريمة إلي إيران، ماهي الحجج التي تملكها التي تؤكد ما تذهب إليه؟ أعتقد أنه في هذه المسألة بالذات لم يفهمني جيدا الإخوة الأكراد، واتهمت بمعاداة الأكراد، أبدا، فأنا لا أنكر معاناة الأكراد ولا أشكك أبدا في ما لحقهم من أذي وظلم، وقلت إن صدام حسين لم يكن أسوأ من غيره في معاملة الأكراد، فالذين ظلموا بشكل لا يطاق الأكراد هي السلطة التركية وليس صدام حسين، ولا نريد لحد الآن توجيه أصابع الاتهام إلي تركيا التي تجاوزت المواثيق الدولية في ضرب الأكراد إساءة معاملتهم وتحقيرهم، فقط لأن تركيا تشرع في الانضمام إلي الاتحاد الأوروبي ولا نريد أن نقول كلاما سيئا عن تركيا. وأقر في هذا الاتجاه أن الأكراد بالفعل تعرضوا للغاز القاتل، لكن المشكلة أن صدام حسين في كل مسيرته منذ أن وصل إلي سدة الحكم لم يكن يحمل في مشروعه إبادة المجتمع الكردي، أبدا، والمشكلة الثانية أنه في الحرب العراقية الإيرانية استعمل الغاز من كلا الطرفين، إلا أن نوعية الغاز المستعمل ضد الأكراد هو غاز خاص من فئة السيانيد ، وهو الغاز الذي تستعمله إيران وليس العراق لأن العراق لم يكن يتوفر علي هذا النوع من الغاز، وكل الخبراء الدوليين والأمريكيين الذين عاينوا جثث الأكراد الذين استنشقوا الغاز القاتل يجمعون علي أن الغاز المستنشق هو غاز السيانيد . ولكن من يمكنه إثبات أن العراق لم يستعمل ذات الغاز، وبأنه غير متوفر عنده؟ ببساطة الأمريكيون يعرفون تمام المعرفة من يملك ماذا في مجال الطاقة والمواد الكيماوية وليس فحسب، ونعرف جيدا أن الإيرانيين كانوا يستوردون غازات معينة من ألمانيا، مصدرها شركات أمريكية، ووقتئذ كانوا يبيعون الأسلحة لكلا الطرفين أي للعراق وإيران معا، دون أي وازع أخلاقي أو إنساني و إيران غيت أكبر شاهد علي ذلك، وحتي فرنسا في تلك الفترة كانت تبيع أسلحتها لكلا الطرفين. والإيرانيون ذاتهم واعين كل الوعي اليوم بان محاكمة صدام حسين تشكل خطرا عليهم.<br />وتقول أيضا أن محاكمة صدام حسين هي محاكمة للغرب أيضا، فإلي أي مدي يمكن اعتبار الغرب طرفا في محاكمة صدام حسين؟ لقد وعدونا بإجراء محاكمة لصدام مع نهاية السنة، وهي المحاكمة التي لن تكون أبدا، وبعد ذلك سيعدوننا بإجرائها بعد الانتخابات التشريعية، وأعتقد أنه حتي ولو انسحبت قوات الاحتلال من العراق وهو الشيء الذي لن يحدث أبدا ـ فإن السلطة العراقية الجديدة لن يكون في مقدورها تنظيم محاكمة بهذا الحجم، مع الأخطار التي تواكب هذا وهي أخطار سياسية وأمنية ودبلوماسية الخ، وأتصور أن الخلاص سيكون في إجراء مفاوضات مع صدام حسين لترتيب خروجه من البلاد وتأمين له مكان ما في بلد يختاره للعيش فيه بأمان مقابل صمته.<br />التسميم<br />وفرضية التخلص منه بتسميمه أو قتله بأي طريقة من الطرق غير واردة في رأيك؟ لا أظن ذلك مطلقا، وانظر بالمقابل شخصا مثل طارق عزيز وزير خارجية صدام حسين الذي لم يقم إلا بعمله كدبلوماسي موجود ظلما في السجن رغم مرضه، ونحن كائتلاف محامين أول شيء سنقوم به في حالة ما إذا استتب الأمن وعادت الأمور إلي نصابها هو المطالبة بإطلاق سراحه فورا، وأعتقد من جهة أخري أنني لا استبعد أبدا أن يجري تفاوض مع صدام حسين من أجل ترشيح نفسه للانتخابات الرئاسية.<br />هل قدمتم طلبات لرؤية موكلكم لدي قوات الاحتلال والسلطة العراقية الحالية؟<br />طبعا قدمنا أكثر من طلب وعندي ردود من طرف البنتاغون تحليني إلي السلطة العراقية، وكنت أعرف أنه قبل إجراء الانتخابات الأمريكية سيكون مستحيلا رؤية صدام حسين، فقد يشكل ذلك خطرا علي المرشح جورج بوش، والآن لا يوجد هناك أي مبرر يمنع زيارته في سجنه، وكان شرطهم أن ينضم إلي ائتلافنا محاميا عراقيا من داخل العراق، وهذا الشرط قد تحق بانضمام محامي عراقي إلي عصبتنا، وعلمنا أيضا من خلال تقارير الصليب الأحمر الدولي أنه يريد لقاء محاميه، وهيئة الصليب الدولي ستنكب علي دراسة طلب الرئيس العراقي والنظر فيما يمكن القيام به من أجل ضمان حق الدفاع عن صدام حسين ابتداء من الأسبوع المقبل حتي يتسني لنا مقابلته خارج بغداد، وربما يكون المكان في قطر ليومين أو ثلاث فقط، فهو اليوم موجود في مكان قرب المطار في بغداد. وعلمنا من خلال مصادر في سجنه أنه لم يعد يتحمل عملية نقله المستمرة من بغداد إلي قطر، والسلطات القطرية لا تريد مطلقا أن يوجد صدام حسين لمدة طويلة علي أراضيها. فهم يقبلون بأن يبقي مثلا في إحدي القواعد الأمريكية في قطر لأسبوع أو أسبوعين لا أكثر. ولقد مكث حسب معلوماتي إلي غاية ثلاثة أسابيع في قطر.<br />ماهي استراتيجية دفاعكم عن الرئيس العراقي؟<br />أولا في خطتنا، أن نتوجه للسلطة العراقية والأمريكية معا بعدم القبول بشرعية القضاة المعينين من طرف قوات الاحتلال، فهم سيكونون قضاة عراقيين ولكن بعيون المخابرات الأمريكية، ولقد قلت إلي زملائي الأردنيين بأنا أمام زبون غير عادي، فهو رئيس دولة، ومن ثم يجب معاملته بحكم هذا المنصب وقبل ترتيب أية استراتيجية قد تتعثر لأسباب كثيرة، يجب في البدء مقابلة صدام حسين والاستماع إلي توجيهاته، فهو شخص ذكي واستراتيجي من الطراز الأول، له أفكار دقيقة، وبالتأكيد سيكون له طلبات معينة.<br />فهو القائد وليس نحن<br />لهذا تقولون في الكتاب أن أي تصريح من طرف صدام حسين، كان سيزعج الأمريكيين، لهذا لم يسمح إلا لوسائل الإعلام الأمريكية للاستماع إلي أولي تصريحاته بعد اعتقاله؟<br />نعم، لقد أدركنا منذ بداية اعتقاله منذ 13 ايلول (سبتمبر) أن العملية الإعلامية مهمة، فلقد علمنا دائما عن طريق الصليب الأحمر أنه بتابع كل ما يقال في وسائل الأعلام كما أنه استطاع مشاهدة فيلم مايكل مور، وأنه يقرأ مختلف الجرائد العربية، حتي كتابي هذا وصله خلال أسبوع، وأثني عليه كثيرا، أستطيع القول من هذا الجانب أن الديمقر<br />27/07/2006<br />اقرأ بقية التعليق .."
