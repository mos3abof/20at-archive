subject = "والله زمان"
text = "والله زمان<br />مبروك يادسوقى الموضوع حلو اتعودت عليك جرئ وراسك نشفه اللى فى دماغك بتعمله بس فى حاجه يمكن فعلا يكون الجنس عنصر مهم فى حياتنا بس اعتقد انه من الصعب ان يتم تدريسه فى المدارس لانها هتبقى عمليه صعبه خاصة في ظل حالة الانحلال التى نعيش فيها"
