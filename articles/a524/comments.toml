subject = "جديد الموقع"
text = "lol<br />أنا والدتي و لحد دلوقتي و رغم بلوغي سن النضج الفكري و رغم ثقافتي الواسعة، و رغم إني ساعات بتطرق لهذه الموضوعات في بعض مناقشاتنا و علمها باني على قدر من الثقافة، إلا أنها مازالت بتشخط فيه معتبره الكلام ده عيب و \"مش وقته\" (رغم إني على وش جواز)... و بتقولي \"أنا عمري ما حد كلمني و قالي أي حاجه\" و بتتفاخر بأنها تزوجت في سن مبكر بطريقة تقليديه جدا و بدون أي نوع من أنواع الثقافة الجنسية، و معتبره كلامي في هذه الموضوعات معاها أو أسئلتي لها نوع من أنواع \"البجاحة\" الطبيعية في أبناء جيلي !!<br />لكن لابد من الإعتراف، بأنه رغم فهمي لأن الموضوع ده مش عيب أو حرام و أن الدين اتكلم فيه و حط له قواعد و أصول، و أنه لا حياء في العلم أو الدين، إلا إني بأجد صعوبه في الرد على بعض تساؤلات أبناء إخوتي في هذا الموضوع.. إظاهر إن إحساسنا بأن الموضوع ده و الكلام فيه شيئ فوق العادي، هو نوع من العدوى أن هو صفه موروثه في الشعوب العربيه :)"
