[[comments]]
order = 22
subject = "بيرو"
text = "اهلا بيكم<br />الناس دول علقوا امتي يا رجالة ..؟؟<br />ما أنا قاعد علي عشرينات ال24 ساعة<br />علي العموم ملحوقة ..!!<br />اللي انا عايز اقوله اننا لو اتفقنا كلنا علي راي واحد يبقي التعليقات دي كلها ملهاش لازمة<br />مهم قوي اننا نختلف علشان نفهم وندرك<br />كلنا شباب في بعض وموش عيب ان واحد يبقي صح والتاني يبقي غلط<br />وده برضه موش معناه ان فيه واحد صح علي طول الخط والتاني غلط علي طول ..!!<br />نقطة تانية مهمة ...<br />موضوع الكلام في الجنس بيحصل سواء كنا بنتكلم في السر او العلن<br />والناس كلها عارفة ان فترة من 15/20 هي اهم فترة في حياة الانسان وهي برضه الفترة اللي مبيشبعش فيها الواحد سواء كان ولد او بنت من البحث عن اي معلومة جديدة وخصوصا لو كانت متعلقة باكتشافه لنفسه<br />ومن هنا كان الكلام عن الجنس والزواج والحب والسجاير والمخدرات وعلاقة الولد بالبنت والمشاكل مع الاب والام والعيلة والاخ الكبير<br />الحاجات دي اساسيات في حياة اي شاب<br />واللي موش بيحصل معاه كدة الناس بتبصله علي انه مريض !!<br />اللي انا عايز اوصله في الآخر اننا كدة كدة بنتكلم وكدة كدة بنعرف وبنسأل<br />طيب ليه متبقاش معرفتنا وكلامنا ده موزون<br />يعني لو الواحد اتعود من وهو صغير ان فيه درس في العلوم كل اسبوع بيكلمه عن نفسه وجسمه وجنسه<br />بشكل حضاري ومن غير خدش للحياء<br />اعتقد ساعتها موش هيبقي فيه ضرورة للفضائيات العارية ولا المواقع الاباحية ولا معاكسة واغتصاب البنات في الشوراع !!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022024839/http://www.20at.com:80/article.php?sid=524"

