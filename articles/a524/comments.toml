[[comments]]
order = 40
subject = "فلسطين"
text = "احنا عندنا بفلسطين يدرس عن الجنس بالمدرسة الثانوية فى مادة الصحة والبيئة وهذا شىء عادى وما فى اى شىء على العكس كل الناس لازم تتثقف بطريقة سليمة وصحيحة. أنا احيى الدكتورة هبه قطب على جراءتها وشجاعتها واختراقها لهذا الصرح الضخم من عقول البشر."
archived = "2004-10-22"
