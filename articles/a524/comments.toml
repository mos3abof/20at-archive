text = "معلش معلش عايزة اقول تعليق تانى الظاهر مفيش غيرى,,,,, هو اقتراح لو توصلوة لدكتورة هبة قطب متهيالى لو الموضوع اتدرس بكثافة فى مادة الدين احسن,,, لان الدين كفيل انة يشرح ابعاد الموضوع كلها من خلال الفقه والاحاديث الموجودة فى كثير من المواضيع مثل بما يوصى الرسول صلى اللة علية و سلم عند دخول الرجل على زوجتة.....بالاضافة ان تدريسة فى مادة الدين هيضفى علية شىء من القدسية والاحترام ودة المطلوب,,, دة رايى بس بجد انا شايفة ان النت انسب الوسائل اللى من خلالها ممكن نناقش مواضيع حساسة بحرية وبدون احراج المواجهة,,,,بس يا ريت يشاركونا فى التعليقات ناس متخصصين و يكلمونا على مواقع الشباب عشان منبقاش بنتكلم ونرد على نفسينا........................................... و سلاموا عليكوا بقىىىىىىىىىىى...................."
