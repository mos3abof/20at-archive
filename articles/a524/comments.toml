subject = "كرسي في الكلوب"
text = "أنا موافق علي رأي الأخت ............ (يارب أكون كتبت الإسم صح)<br />في الحقيقة يا جماعة أنا شايف فعلا إن موضوع الثقافة الجنسية دة لازم يتاخد في حصة الدين لأنها الحصة الوحيدة المحترمة من قبل الطلبة وإن كان بدأ معدل الإحترام ده يقل عشان يحصل بقية المواد الأخري زي العربي والدراسات فما بالكم يا جماعة بحصة جنس تفتكروا الطلبة شاكلهم هايكون إية<br />(طب بالذمة دي هاياخدوا فيها دروس خصوصية إزاي)<br />أنا يا جماعة بأيد اننا نجعل المسألة مقننة وتحت المراقبة ويكون فيها مصارحة بأسلوب علمي وأظن أنه بدل ماندي الأولاد كورسات جنس ندي الأباء كورسات في توصيل المعلومات لأنة ماحدش هايفهم عقلية إبنك ويسيطر عليها غيرك<br />وسلام"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022024839/http://www.20at.com:80/article.php?sid=524"

