[[comments]]
order = 35
subject = "يانهار غبار"
text = "كل دي تعلقيات على موضوع في الجنس .. لأ وربنا شاطرين<br />ايه الكبت اللي عندكم ده ..<br />انامتجوز وعندي عيال .. وباتكلم معاهم لو سألوني .. بس بجد كده كتير اوي<br />على العموم .. ليكم حق .. غريزة وطلب واحتياج .. واحساسات بالذنب .. وعناوين مفرقعة .. وبنات نيو لك وشباب بعضلات ..<br />ما تيجوا نسميها العلاقة الزوجية ( بس) مش الجنس وبكده وببساطة جدا .. نحصر الجنس داخل العلاقة الزوجية النظيفة .. لأحسن ده اتبهدل معانا جدا زي ما بهدلوا الحب<br />أحمد محمد علي"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022024839/http://www.20at.com:80/article.php?sid=524"

