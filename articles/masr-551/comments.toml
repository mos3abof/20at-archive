subject = "السور"
author = "nadia moesi"
posted = "2006-06-21"
text = "انا اسكندرانيه وبحب سور الاذبكيه واول منذل القاهره لاذم امر على السور ويارب مايتنقل بس هو فى حاجه صح بتتعمل فى البلد دى"
archived = "2006-06-23"
