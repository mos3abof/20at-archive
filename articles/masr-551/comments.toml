[[comments]]
order = 1
subject = "قتل الجمال"
author = "ابوشريف"
posted = "2006-06-22"
text = "لايتواني معول الهدم عن قتل كل شئ جميل في بلدنا ... ان سور الازبكية يمثل بالنسبة لعاشقى القراءة والمثقفين رئة حامة لتنفس المعرفة والاطلاع واذكر اني اشتريت كتاب ضخم عن حريق القاهرة بجنيه واحد من حوالي 15 سنة ولم احد نفس هذا الكتاب في المكتبات الأخري فهل المطلوب ان نركز في تفكيرنا وقراءتنا علي اخبار الفنانين والممثلين"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623144624/http://masr.20at.com:80/article.php?sid=551"

[[comments]]
order = 2
subject = "شوف يا باشا"
author = "هوووبه"
posted = "2006-06-22"
text = "الكام مرة اللي روحت فيهم القاهرة<br />كانت فوسحه وفي النص كدا بنعدي نشرب عصير قصب والمكان روحته بالصدفه , الاسعار فعلا رخيصه والكتب روعه والله الواحد مفتقد الكتب دي ,اول مره اتعرفت علي مصطفي محمود ورواياته كانت هناك ولما رحت تاني<br />اشتريت كام كتاب كدا والله الواحد مفتقد الكتب دي يلا قلبت المواجع يا عجم ."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623144624/http://masr.20at.com:80/article.php?sid=551"
