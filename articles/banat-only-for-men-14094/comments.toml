text = "(29) بسنت<br />واذا كنت حضرتك مستغرب انهم مش مكسوفين من حماده ومكسوفين منك حماده ده شغله\"<br />زى ما قولت لـ bent vip عدم حياءهم من حمـــادة ده اسمه \" إلـــــف المعصيـــة \" من التعود على فعـــل الحــرام ضـــاع الحيــــاء و إن ضاع حيـــــاؤك ضـــــــاع إيمـــانك<br />و مهنــة \" حمادة \" لا ترضي الله و لا ترضي رسـوله و مكسبـــه حـــرام و بالتالي مأكله و مشربه حـــــــرام و كما قال صلى الله عليه و سلم \" كـــل لحـــــم نبت من حرام فالنـــــــار أولى بـــــــه"
