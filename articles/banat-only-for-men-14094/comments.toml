posted = "2009-12-25"
text = "اولا انت متعرفش الاحراج اللى بنت بتكون فيه وهى فى الكوافير يا سلام بقى لو قدام الكوافير شباب تلاقى الواد من دول بيبص ليك بدرجه غريبه كأنك رايح تعمل حاجه غلط اروح حطه عينى فى الارض يروح الحيوان يقول لاصحابه تتفتكر دى هتعمل ايه جوه يروح الحيوان تانى يقوله دى ياعم محجبه يعنى مش هتعمل شعرها يبقى هتعمل … ويقعدوا يضحكوا تحس انك عايز تضربهم بالجذمه<br />لكن الاخ حماده بتاع الكوافير بيبقى عارف انه هو اللى هيعملك مش قاعد يضحك عليك زى الحيوان فالموضوع مش موضوع راجل وحماده<br />ثانيا انت ضد الكوافير وان البنات بيرحوه يعنى الوالده مش بتروح ولا اقولك خالى مراتك تبقى قعده جنبك زى اخوك وشعرها منكوش مترين ومش متساوى وحالته صعبه<br />ثالثا بالنسبه للجيبونه انت ضدها دى بنت بتحلم باليوم اللى هتلبس فيه فستان زى سندريلا انت عايز تقتل حلمها ليه _الغلط على الحيوان اللى بيقف عشان يبص عليها _"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106181529/http://www.20at.com:80/banat/only-for-men/14094-2009-11-18-12-53-24.html"

