text = "اقتباس bent vip:<br />لأ بجد يا محمد موضوع هايل وضحكتني جدا ومكونتش اتوقع ان الشباب والرجاله عندهم الفضول ده للكوافيرات<br />وبالامانة اللي بتشوفوه بره ميجيش ربع اللي بيحصل جوه<br />من حواديت وكلام وافعال وسجاير وكل حاجه<br />وبالنسبة لان البنات بتتكسف منكم مش من حماده الكوافير ده لان ببساطة انا لو روحت عند كوافير وشاف شعري مره او شافني لابسه سواريه عريان هتكسف مره وبعد كده هتعود عليه ومش هيجي في بالي انه راجل هحس انه ست ماهو متعود يشوفني كده وانا متعوده انه يشوفني كده ويشوف كل البنات<br />وعموما الكوافير والترزي والدكتور حتي لو اعجبوا بواحده مش بيبينوا<br />عشان شغلانتهم كده<br />وانا اسفه طولت عليك بس يارب اكون مش تقيلة الدم<br />وميرسي جامد ع الموضوع<br />———————————————————————————————————————————-ههههههههههههههه ههههههههههههههه ههههههههههههههه ههههههههههههههه ههههههههههههههه ههههههههههههههه ههههههههههههههه ههههههههههههههه ههههههههههههههه هههه"
