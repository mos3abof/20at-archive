text = "انا فعلا مستغربة قوي انت فاضي لدرجة انك قاعد للسقطة و اللقطة لأ وكمان مستني تحصل المعجزة اللي تترفع فيها الجيبونة عشان كله\" ينكشف ويبان \"<br />بجد خص على كدة وعليكوا كلكوا يا شباب مصر !!<br />والله ماعارفة أقول ايه ولا ايه شباب مريض بجد طيب و مضيع وقتك ليه يا استاذ ياللي كاتب التوبيك ؟؟ مش خايف لا تفوتك حاجة برة وانت قاعد كدة تكتبلنا المواقف والطرائف دي !!! ولا تلاقيك ناقل حياتك كلها في البلكونة أصلا !!!<br />وبعدين نازل تريقة على بنات الناس !!! فيها ايه بنوتة صغيرة 15 سنة داخلة تعمل شعرها عند الكوافير؟!! ماهي ممكن تكون عندها مناسبة ولا رايحة فرح ولا أي حاجة على طول كدة ترجمت تصرفها بطريقة زبالة و تقول \"طيب حد يقولي بنات لسه عمرهم 15 سنة رايحين الكوافير ليه؟\" سؤال غ*** غريب مارودش عليه !!<br />ماهو أمثالك والله هم أكيد اللي كانوا السبب فب ان \"حمادة\" يحط باب بعد ماكان ستارة عالمحل ..<br />والله مهما عملوا .. حتى لو كل البنات لبسوا خيم .. انتو أصلا عالم تعبانة في مخكوا ومريضى .. تفاهة و دماغ فاضية ماشوفتش كدة .. استفادنا ايه احنا من شوية الهبل دة !!!!!!!!!!!!!!"
