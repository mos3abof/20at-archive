text = "والله انا حسه انك كان نفسك تكون مكان حماده وانك حسده عموما حماده برقبتك علشان ده شغله مش فاضي وبيعمل قاضي روح يابني دور علي حاجه تشغلك وتشغل دماغك الفاضيه الي مليانه افكار زباله وسيب بنات الناس في حالها وخد بالك انك في يوم ما يعني لو حصل هتجوز ومراتك اكيد زارت الكوافير كتير فهيكون الي بتعمله غيرك عمله في مراتك سواء ضحكت اتريقت او بصيت كله سلف ودين والا انت من النوع الي مش بيهمه الي يتعمل في مراته"
