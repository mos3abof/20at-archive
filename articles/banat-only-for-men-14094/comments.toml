text = "(45) رشروش<br />و تذكري أن اللســـان مغرفــــــة القلــــــب .. أي ان اللســـان يغرف ما في قلبك .. فإن كان كلام حسن يرضى الله فقلبك سليـــم و العكس صحيح<br />و إن إستقام قلبـــك استقيمت جميع جوارحك و سلمت و الدليل قول النبي صلى الله عليه و سلم ..<br />ألا أن فــي الجســـد مضغــــة إن صلحـــت صلــح الجســــد كلـــه و إن فســــدت فســــــد الجســــد كلـــه إلا و هـــي القلــــــــب ."
