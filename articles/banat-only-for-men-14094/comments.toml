text = "(29) بسنت<br />\"قبل ماتحاسب الاب والام انهم بيسمحو لبناتهم بكده حاسبو انتو انفسكو ع تصرفاتكم الزباله اللى بتعملوها مع بنات الناس\"<br />خطـــأ يا بسنـــــت … كفـــــــى بالمـــــــرء إثمًـــــــا أن يُضيــــع من يعـــــــول<br />قال الله تبارك و تعالى .. قوا أنفسكم و أهليكم نــــــارًا وقودهـــا النـــاس و الحجـــارة عليها ملائكـــة غــلاظ شـــداد لا يعصـــون الله مــا أمرهــم و يفعــلون ما يــؤمرون ..<br />الأب و الام مسئوليـــــن مسئوليــــــة كامـــلة عن تربيــة الأبنـــاء و لــو الأب عارف ان بنته رايحــة \" لحمادة \" و مأنكرش عليها يبقى ابوها ده ما قال عنه صلى الله عليه و سلم \" الديـــــــوث \" وهو اللي يستحـــل الفاحشــــة على أهـــــــل بيتــــه<br />و هـــو من الثــلاثة الذيــن لا يدخلـــــون الجنـــــــة . . ."
