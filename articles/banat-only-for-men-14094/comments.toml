author = "بسنت"
posted = "2009-12-26"
text = "بجد انت فرستنى<br />واستغربت جدا من انبهارك الفظييييييييييي يع بالكوافير<br />واستغربت اكتر من تعليقات الاخ ابن خالتك اللى ((صايع حبتين))<br />وازاى اساسا تفضل مركز مع الجيبونه والببرونه انت شخصيه تعبانه<br />لوحطيت ف دماغك ان الاخت صاحبت الجيبونه اختك استحاله كنت تعمل كده انت خلاص بئى خلصت شغل وصلاه وقريت القراءن وقاعد تتسلى ف البلكونه<br />ازاى هتتفتح بيت بالدماغ الهايفه دى؟؟؟؟<br />ونصيحه منى لحضرتك يوم ماتتجوز متوديش الهانم بتاعت ساعتك للكوافير احسن يكون ف ناس زيك كده بيتفرجو عليها<br />وخليها قعده جبك ف الكوشه وهى منكوشه وبعماصها وطبعا بالبيجامه حضرتك طبعا عارف اخطار الجيبونه<br />وبعد الجواز ولاتوديها تعمل شعرها ولا حاجه تانيه وتبقى جنبك<br />زى الراجل ومش هاقولك ناقصها شنب هى فعلا هتبقى بيه<br />ما انت لوتتقى ربنا متبصش ع البنات وتعرف ان كل بصه بذنب زنا ربنا يهديك ويرحمك"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106181529/http://www.20at.com:80/banat/only-for-men/14094-2009-11-18-12-53-24.html"

