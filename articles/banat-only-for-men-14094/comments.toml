posted = "2010-02-28"
text = "(45) رشروش<br />قال صلى الله عليه و سلم .. إن العبد ليتكلم بالكلمـــة مــن رضوان الله لا يلقى لها بالا يرفعــه الله بها درجات و \" أن العبد ليتكلم بالكلمة من سخــط الله لا يلقى لها بالا يهوي بها فى نار جهنـم\"<br />تفتكــري الكلام اللى كتبه \" محمد \" كلام في رضى الله أم في سخطه ؟<br />كل كلمة بتكتبيها يا \" رشروش \" أو بتقوليهـا هتتحاسبي عليها حتى لو تقصدي بيها هزار أحاديث النبي وحي من الله عز وجل لكنها بلسان النبي صلى الله عليه و سلن و إن كنتي مؤمنة بالله و رسوله فلابـد لكِ من تصديق قول الله و قول النبي صلى الله عليه و سلم<br />و قـال النبي صلى الله عليه و سلم<br />لا يستقيم إيمان عبد حتى يستقيم قلبه ولايستقيم قلبه حتى يستقيم لسانه.. وسئل النبي عن أكثر ما يدخل النار وفقال الفــــم والفـــرج"
