posted = "2010-02-28"
text = "(29) بسنت<br />\" ولما يبص ع البنت الى خارجه من الكوافير يوم فرحها وطالعه لعريسها \"<br />حبيبتي في الله . . .<br />لو العريس راجــل غيور على زوجتـــه ميوديهاش لراجــل يزني بيهـــا .. مستغربة من كلمة يزني بيها؟ قال رسول الله صلى الله عليه و سلم … العين تزني و زناها النظر و اليد تزني و زناها اللمـــس و الأذن تزني و زناهـا السمع و اللسان يزني و زناه الكــلام و القدم تزني و زناها المشي و القلب يتمنى و يشتهي و الفــرج يصدق ذلك كله أو يكذبه<br />يعنى لما البنت تروح لكوافير \" راجـل \" يحط ايده على شعرها او على وشها مش هيتكتب فى صحيفته انه عملها شعرها لا هيتكتب انه زنا بايده و زنا بعينه لما بص عليها و لما اتكلم معاها و هزر معاها هيتكتب انه زنا بلسانه"
