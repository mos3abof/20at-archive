text = "يالله عليك<br />كان ممكن موضوعك يبقى الطف شويه لو جه فى شكل نصائح<br />انا عايزه اعرف ماتكسفتش وانت بتقول كل شىء انكشف وبان<br />هل انت تعتقد ان البنت اللى الجيبونه بتترفع منها بيكون قصدها ولا هيا بتكون عارفه ان واحد زى سيادتك انت وابن خالتها مستنى حاجه زى كده<br />يااخى واذا بليتم فاستتروا عملت ذنب اسكت واستغفر ربنا<br />انما عامله تجربه شخصيه وعامله موضوع وكاتبه وفرحان بيه اوى<br />ربنا يشفيك<br />انا مش عايزه اقول كلام زياده فى الموضوع بصراحه لان الاخت بسنت و prenciss كفوا ووفوا<br />وربنا يهديك انت واخواتك وابن خالتك"
