[[comments]]
order = 16
subject = ""
author = "بسنت"
posted = "2009-12-28"
text = "يامسلمه مصريه انا مش شايفه محمد اتكلم ع البنات اللى بيخرجوا من الكوافير بشعرهم عشان يجذبو عين الشباب زى انتى مابتقولى<br />كل كلام البيه المحترم انه مركز جوا المحل وبيبص ع البنات اللى جوه وع حماده دى بقى عادى ومن الواقع المصرى؟؟؟<br />ولما يبص ع البنت الى خارجه من الكوافير يوم فرحها وطالعه لعريسها وهو مركز مع الجيبونه اللى اترفعت<br />دى بردو خارجه عشان تجذب عيون الشباب<br />قبل ماتحاسب الاب والام انهم بيسمحو لبناتهم بكده حاسبو انتو انفسكو ع تصرفاتكم الزباله اللى بتعملوها مع بنات الناس<br />واذا كنت حضرتك مستغرب انهم مش مكسوفين من حماده ومكسوفين منك حماده ده شغله<br />لكن انت شغلتك ايه غير البص ع البنات ودقق ع كل حته ف جسمهم وتفصصهم من صوابع رجليهم لحد راسهم<br />لا وفرحان بنفسك وجاى تحكى بلاويك وعقدك المريضه انت وابن خالتك الشملول"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106181529/http://www.20at.com:80/banat/only-for-men/14094-2009-11-18-12-53-24.html"

[[comments]]
order = 17
subject = ""
author = "مسلمة مصرية"
posted = "2009-12-28"
text = "الناس اللى زعلانة من محمد, انتوا زعلانين منه اوى كدة ليه, الراجل مبيحكيش حاجة مبتحصلش, كل للى بيقوله ده من واقع الشعب المصرى و بيحصل و كلنا بنشوفه سواء احياء شعبية او راقية, يعنى محمد هو اللى افكاره زبالة و البنت اللى رايحة عامله شعرها فى الكوافير و هى خارجة فى العيد مثلا عشان تجذب عيون الشباب ليها و تعجبهم هى اللى افكارها كويسة. خلينا صرحاء مع نفسنا اكتر من كدة.<br />انا هازود اللى الكلام اللى قالته (أختك فى الله) انه الاب اللى بيدفع فلوس لبنته عشان تظهر زينتها و يسمح للراجل الكوافير انه يحط ايده على شعر و وش بنته هو كمان مذنب و الام اللى بتشجع ابنها و مربياه على انه مش عيب انه يبص على البنات و يمتع بصره هى كمان مشاركة فى الذنب."
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106181529/http://www.20at.com:80/banat/only-for-men/14094-2009-11-18-12-53-24.html"

