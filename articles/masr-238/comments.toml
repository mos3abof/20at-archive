text = "خدنه ايه من مصر ومن ابن المتناكه حسنى<br />عاوز اقول كلمتين وبس العرص بقيله كرش يلم فيه ويمص دمنا كس امك يا حسنى هو والمعرصين الى وراة واخير باعها للبن المتناكه ولدة جمال ود سوزان الى بتنيكه العيال الخول اه اه اه اه اه اه لو يحكمونى على الوسخ واتباعه لكونت اشرب من دمهم وانيك امهم كس امك يا حسنى مبارك يا خول"
