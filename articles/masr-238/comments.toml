[[comments]]
order = 16
subject = "كفكف دموعك ليس ينفعك الكاء ولا العويل"
author = "مسلم"
posted = "2006-04-29"
text = "كفكف دموعك ليس ينفعك البكاء ولا العويل ، وانهض ولا تشكو الزمان ، فما شكا الا الكسول.<br />ما هذا اليأس والقنوط يا شباب مصر ، والله لن تهون مصر وأنتم أهلها ، هبوا هبة رجل وأحد وأسقطوا الطاغوت وأقيموا دولة المؤسسات المبنية على الحرية والشفافية والمحاسبة واستقلال القضاء.<br />يا شباب مصر ، أتظنون الامر مستحيل ، لا والله ، بل هو أقرب اليكم من حبل الوريد ، غاية الامر أن تكونوا يدا واحدة على قلب رجل واحد والهدف الواضح البين ، وهو اسقاط الديكتاتور وأقامة دولة المؤسسات تحت ظل الشريعة."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192624/http://masr.20at.com:80/article.php?sid=238&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

