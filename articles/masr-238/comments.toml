text = "ترجع جميع اسباب الفساد فى البلد<br />بسب واحد خول اسمه\"مبارك\"<br />لو تعرفواااا<br />ااعد طربوش 25 سنه والخولات اللى حواليه يسرقوا فى البلد وهو مصدر الطرشه<br />لحد ما هايتناك منهم قريب<br />والشعب هاينكهم كلهم قريب ان شاء الله<br />ربنا معانا فعلا..<br />احنا فعلا فى عصر ال......"
