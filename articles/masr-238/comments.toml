[[comments]]
order = 31
subject = "غلابه"
author = "طارق حسن"
posted = "2006-05-25"
text = "ياااااااااااااااااااااااااه<br />داحنا غلابه غلب وعبط عبط يا جماعه كلامى والله العظيم بامانه<br />انا قطعت اليوم سفر 400كم رايح وجاى للقاهرة علشان احضر مع جموع الشعب الغفيرة ذلك اليوم المفصلى فى حياة مصر الوقفه اللى كل قوى الشعب بتدعى ليها من فترة طويله<br />وللاسف بعد ما قطعت كل المسافه دى اكتشفت انى اهبل وعبيط بس عزائى الوحيد ان فى كتير هبل وعبط زيى تمام صدقوا كلام الجماعه الجورنالجيه اللى بيقولوهبس خرجت بمجموعه حقائق لازم اقولها وبامانه علشان معتش هبل تانيين يصدقوا الجماعه دول اهم الحقائق دى<br />1-الاخوان المسلمين مجرد كارت بيتلعب بيه من قبل الحكومه فى الوقت المناسب انما ليس لهم اى دخل فى الواقع السياسى المصرى<br />2-الجماعه الجورنالجيه بتوع صحف المعارضه بيكتبوا من اجل التوزيع فقط والمكسب وبس واكبر دليل على كلامى انى شفت النهارده اطول اقصر مسافه فى العالم وهى مسافه ال15م التى تفصل بين سلم نقابه الصحفيين وغرفه الجتماعات المسافه دى اكبر من المسافه اللى انا قطعتها من بلدى للقاهرة<br />3- الشعب ده غلبان اوى ونفسه يعيش من غير ما يضحى باى حاجه وبالتالى اللى يحب الشعب ده يسيبه يعيش زى ماهو عايز من غير ما ينغص عليه حياته ويتكسب من بيع هموم الشعب للشعب(جرايد المعارضه)<br />4- الف الف مبروك للوريث القادم عمنا كلنا وربنا يبارك لنا فيه<br />5-احنا روحنا روح عبيد بنستنه اول ايد تضربنا علشان نبوسها ونقدم لها كل فروض الطاعه والخضوع"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192624/http://masr.20at.com:80/article.php?sid=238&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 32
subject = "الله يرحم شعبك يا مصر"
author = "سمير المصرى"
posted = "2006-06-01"
text = "اتاذى العزيز..اسمح لى ان اقول لك مختصر الموضوع فى مصر اسف فى مص ..كنت اعيش فى اوربا وانت تعرف الحياة هناك لا توجد وجه مقرنه بين هذا وذاك....عموما...ارسل الف مليون تحيه للاساتذ سمير المصرى...الذى لا اعرفه وانما اقرء له فى كل المواقع واللمنتديات...هذا الرجل الذى عرض ولاول مرة فى التارخ مشروع دوله للاجار....وانا معه نريد ان نعرض الدوله للاجار بعد ان فرغت من الشعب والدنيا والدين...لايوجد شعب يقول اه او حتى اف...لا من غلاء الاسعار التى تلهب جسده ولا من الجرباك الذى يقف وراءة من قانون الطوارء ...وكل انسان هنا فى هذة الا دوله يعمل لصالحه الخاص ويضحك على الصعيدة بشويه كلام فارغ من المضمون....وبعد انا نزلنا الى الشارع لكى نحمى ظهر القضاة وينحرق ظهرنا من عسكر الظالم الدكتاتور..لم نجد من القضاء تصعيد بعد زيارة سيادة الرئيس جمال مبارك لهم سرا..لان الرجل خلاص اخذ ok من ماما امريكا....فلا يوجد عندى الا بيت شعر صغير يعبر عن رجوعى الى دوله للاجار....<br />كس اختك يا مصر وكس اخت نيلك<br />كس اخت اللى يحب يرجع ويجيلك<br />كس اخت التاريخ ده كسكسى على بطيخ<br />كس اخت الحضارة دى حبت حجارة<br />كس اخت كليوبترا والجباروت<br />كس اخت حتشبسوت<br />احنا شبابك يا مصر سقيناكى من دمنا<br />سقيتينا من سمك<br />واخر كلام عندنا يا مصر كس امك"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192624/http://masr.20at.com:80/article.php?sid=238&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

