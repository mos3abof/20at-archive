[[comments]]
order = 9
subject = "حراااااااااااااااااااام - كفاااااااااااااااااااااااية"
author = "مصري مقيم باجمل بلد ( دبي )"
posted = "2006-04-29"
text = "صورة البيت اللي واقع ده مهزلة وطبعاً ده كله تحت اعين الجهات المعنية انا هتجنن من الحكومة بتاعتنا بيعملوا الشعب ده كأننا هنود او بنغالي انا نفسي حد يكون شاف ازاي الاماراتي بيتعامل في بلده يا جماعة هنا كلمة مواطن ديه فخر يعني اللي يقال عليه مواطن ده حاجة كبيرة اوي بس يا حسرة علي المواطن مصري الغلبان الفقير الي مش لاقي ياكل بسبب الحكومة طبعاً عجبني اوي تعليق طارق لان الحال في مصر الان كده علي فكرة هنا مصريين كتير جداً اتعلموا هنا واتربوا والله انا قابلت عشرة كلهم بيقولوا لا يمكن نرجع مصر فياريت تسلمولي علي حضارة 7000 سنة والازهر وايه تاني مصر فرحانة بيه"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192624/http://masr.20at.com:80/article.php?sid=238&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

