[[comments]]
order = 7
subject = "انا انسان"
author = "طارق حسن"
posted = "2006-04-28"
text = "مثل مصرى قديم مش فاكر نصه بس معناه ان لو قابلنى واحد فى الشارع وقال لى انت حمار امشى واسيبه لانه قليل الادب بعد ما اسيبه لو قابلنى واحد تانى وقالى نفس الكلمه المفروض انى اشك فى الموضوع<br />لو قابلنى الثالث وقالى نفس الكلام يبقى الموضوع اكيد وغير قابل للشك<br />ونظرا لهذا الاجماع الذى اراة فى طريقه معامله كل من هو مسؤل فى الدوله معىحتى وان لم يقل لى اننى حمار ومع اجماعهم جميعا عليها من صحافه واعلام وشرطه ومديرى الحرامى فى الشغل<br />وجدت نفسى قاعد احلف واقسم لنفسى انى انسان<br />واليكم نص الحوار مع نفسى<br />بما اننى يجرى فى عروقى دم وليس بول اذن فانا انسان ولست بالوعه رغم ما يحمله دمى من انفلوانزا الطيور والالتهاب الكبدى بكل انواعه والسرطان والفشل الكلوى<br />وبما اننى احس واشعر فانا انسان ولست كلب خشب رغم ما يحمله جسدى من جينات خبيثه تحمل ذلك الارث العربى من الاستكانه والخزى والعار<br />تلك الجينات المحموله على كروموسوم كان اصله رباط جزمه ميرى<br />وبما اننى اتنفس واتغذى فانا انسان رغم ما اعانيه من فقر دم وبطاله وغلاء وعرى<br />وبما اننى اتحرك فانا انسان رغم انى اعيش فى ظل قانون الطوارىء ولا اعلم متى ساكون اين وهل ساستمر فى عملى او سيتم احالتى للمعاش المبكر<br />وبما اننى لا اباع ولا اشترى فانا انسان رغم انه قد يتم بيع كبدى او كليتى او حتى مخى دون ان ادرى<br />يا جماعه وااه والله والله انا انسان<br />صدقتونى ولا لا<br />طب لو فى حد مصدقنى والنبى يحاول يقنعنى"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192624/http://masr.20at.com:80/article.php?sid=238&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

