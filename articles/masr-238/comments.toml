[[comments]]
order = 36
subject = "برده بنحبها"
author = "مصرى جدا"
posted = "2006-07-04"
text = "هي وحشة اوى بس برده حلوة اوى و انت يا طارق انسان لأنك لازم تكون كدة و لازم تعرف ان فى اصعب من كدة كمان.<br />انا بس عايز اعلق على كلام الاخ المصرى الى عايش فى دبى الى بيقول عليها اجمل بلد فى الدنيا انا كمان عايش فى دبى و بقولك مافيش اجمل من مصر و انا مش عايز اغلط فى الامارات لانى بحبها بس مع احترامى ليها هى لا تقارن بمصر احنا كبار اوى يا حبيبى بس وقعنا فى ايد شوية ولاد وسخة نصابين و مسيرها تفرج ان شاء الله اما التعليقات الى شتمت فى مصر فانا بقولوهم اشتموا فى الحكومة اشتموا فى اي حد لكن بلاش مصر لاننا بنحبها اوى و ان شاء الله قربت و دلوقت احنا علينا اننا نشتغل و بس و نركز فى شغلنا حتى لو فيه بطالة برده نشتغل او نذاكر او نعمل اي حاجة مسيرها هاتفيدنا قدام مش لازم دلوقت."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192624/http://masr.20at.com:80/article.php?sid=238&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

