[[comments]]
order = 24
subject = "المهنة بلطجى انتخابات"
author = "مواطن من البلد دى"
posted = "2006-04-30"
text = "شكرن يا براء اولا على موضوع الملك هو الملك و ثانيا على الصورة دى<br />الاخ الاستاذ المبجل صاحب الباع السياسى الطويل ناصر النمر ده مجرد بلطجى انتخابات فى حى السيدة زينب وانا اعرفه هو وبقية الشلة الكريمة ( على بجون .. نبيل زنجر .. الجمل ...) الاسماء كتير بس الصورة دى لو بتعبر عن شئ فهى بتعبر عن المؤيدين الحاليين .<br />ملحوظة الاستاذ ناصر النمر عنده محل سمين<br />وكل تعاملاته مع الفشة والممبار والطحال واللى مش مصدق يروح السيدة زينب ويدخل شارع سلامة حجازى و يسال على محل ناصر النمر<br />انا مجرد مواطن بيحب بلده لذا لزم توضيح الصورة المنشورة اكتر<br />سلام يا اصحابى"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192624/http://masr.20at.com:80/article.php?sid=238&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

