[[comments]]
order = 40
subject = "ياخي احة"
author = "شاعر من غير شعر"
posted = "2006-12-06"
text = "ليه يا صاحبي؟<br />تعرف إنك خول و ابن متناكة؟<br />ما ترد يا كس امك ساكت ليه؟<br />طبعاً ما عندكش كلام تدافع بيه عن نفسك<br />دنا اللي خول و ابن ستين كلب عشان بعتبرك أعز صديق ليا<br />ليه تعمل فيا كده؟<br />بحلق فيا كمان يا كس امك<br />منتا جبلّة و ما بتحسش<br />ما ترد ساكت ليه؟<br />إيه أم البرود اللي انت فيه ده؟<br />آخر حاجة كنت أتوقعها إنك تخون العيش و الملح اللي بينا..<br />تخون صاحبك اللي في يوم خدت معاه عهد..<br />عهد الإخلاص لصداقتنا لآخر يوم في عمرنا..<br />فاكر يا ابن المتناكة و لا نسيت؟<br />لا نسوان و لا فلوس و لا أي زفت قدر يهز اللي بينا أو يفرقنا..<br />عشناها عالحلوة و المرة..<br />بكينا و ضحكنا..<br />شكينا و اتجننا..<br />فهمنا.. و هرتلنا..<br />فاكر يا كس امك؟<br />أنتا باصصلي كده ليه؟<br />فين لسانك الطويل؟<br />إيه اتخصيت بكس امك؟<br />منتا عشان غلطان مش حتقدر ترد..<br />إنت واحد خاين و ندل..<br />ليه تعمل في صاحبك كده؟<br />ليه يا صاحبي؟<br />ليه؟<br />ليه تموت دلوقتي؟<br />أحه يا صاحبي.."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142526/http://masr.20at.com:80/article.php?sid=238&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

