[[comments]]
order = 4
subject = "اقتربت لحظة النهاية !"
author = "محمد صبري"
posted = "2006-04-28"
text = "اعتقد ان هناك مؤشرات عديدة على اقتراب لحظة نهاية نظام الحكم الفاشي فى مصر ، مظاهرات متحلاقة وحركات جديدة وقضاة شرفاء وصحف رائعة ومواقع الكترونية تتجاوز الواقع كل لحظة ، تنبؤات قوية بموت الرئيس بعد شهرين ، بطش النظام وهياجانه وغبائه وغباء اعلامه دليل تداعى وسقوط لاشك فيهما ، فتنة طائفية اثبتت ان النظام فشل فى تعليم الشعب كيف يكون شعبا يتجاوز القومية الى العولمة وبدلا من ذلك جعلته شعبا يكفر بالقومية ليهبط الى الولاءات الاولية الضيقة !!!<br />اخيرا انا طالب بكلية الاقتصاد والعلوم السياسية ، من يومين دخلت محاضرة للدكتور محمد كمال ونا مش معاه ف مادته اساسا لانه بيخنقنى بهدوءه ... المهم ان الراجل او ماشفنى واقف ع الباب حس انى جاى افجر نفسى لانه حافظ الناس اللى معاه... والله وشه جاب الوان الطيف خاصة انى بصتله بصة مش لطيفة وكنت حاطط ايدى ف جيوبى ... بس انا مش اهبل عشان اخسر حياتى فى حاجة ملهاش قيمة ... سلام لاحلى ناس!"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904192624/http://masr.20at.com:80/article.php?sid=238&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

