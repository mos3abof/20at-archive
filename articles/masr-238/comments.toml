[[comments]]
order = 38
subject = "لا حول ولا قوة الا بالله"
author = "الخفاجي الشهير"
posted = "2006-10-19"
text = "والله التعليق على الصورتين ما لاح يكون تعليق بس شو بدنا نقول بس الحكومات اذا عربية يعني مافي حكومة يعني التفكير بالحزب بس والناس يموتو وانا لله وانا اليه لراجعون الحكام العرب طاعون وسرطان وايدز مش ممكن المعالجة ونهايتنا معهن الموت عالاكيد.. نحنا العرب نعبد الصور ونعبد الاشخاص ولا نعطي اهمية لما سيفعل الحاكم وكما قال الشاعر احمد مطر المشهور..<br />يصبح اللص باوروبا زعيما للنوادي<br />وبامريكا زعيما للعصابات<br />وفي بلداننا (رئيسا للبلاد).."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117204426/http://masr.20at.com:80/article.php?sid=238&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

