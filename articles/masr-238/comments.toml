order = 1
subject = "هو فى ايه ؟؟؟؟"
author = "sara"
posted = "2006-04-27"
text = "حد يرد عليا هو فى ايه هو احنا اللى مشيين غلط ولا الدنيا ولا الحكومة ولا مين ولا مين على ما اعتقد انى احمد عرابى, سعد زغلول , مصطفى كامل , محمد فريد, عبد الناصروالسادات كل الزعماء دول لو كانوا عرفوا انى احنا متهاونين فى حقوقنا,وانى مصر على الهامش يعنى مش زى امريكا_ انجلترا_الدول الا وربية كلهاماكنوش فكروا يعملوا ثورة ولا ضحوا بنفسم وبحريتهم علشنا احنا للاسف الحكومة مضيعانا وفى ناس مش عايزة تعمل حاجة للبلد لو فضيلنا على كده يبقى البلد دى هتضيع اكتر ما هى ضايعةولا حياة"
