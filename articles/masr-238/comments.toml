author = "نيفين"
posted = "2006-04-29"
text = "يا طارق لنت اكيد انسان و ان كانت مصر تعانى من احترام ادميه الانسان<br />انت انسان علشان مستحمل<br />انت انسان علشان صابر<br />انت انسان علشان حزين و مهموم من اوضاع البلد الهباب وما دمت حزين تبقى انسان لان الانسان بلا حزن ذكرى انسان<br />و دى فرصه نشكر حكومتنا النظيفه على النكد اللى اثبتلنا اننا بشر<br />و بقول للمصرى المقيم بدبى ارجوك طفايه<br />مش عارفه ليه حاسه ان كلامك ليه معانى مش اللى هى<br />فاهمنى؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2006-09-04"
