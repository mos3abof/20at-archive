subject = "النكبه"
author = "ياء"
posted = "2006-06-05"
text = "مقال جيد وصور معبره<br />اليوم شاهدت على قناه دريم لقاء مع احد الاسرى المصرين فى نكسه 67 (فؤاد حجازى ) وكيف روى ما حدث خلا 8 شهور قضاها فى الاسر ولقد تذكر الرجل وبكى وبكت معه المذيعه منى الشاذلى وبكى معها كل من شاهد الحلقه<br />اكثر ما ابكانى هو ذلك الشاب الفلسطينى الذى اسروه وعندما قال انه شقيرى ( نسبه الى احد قاده فتح ) اى فلسطينى ضربه اليهود حتى يقول انه تبع ناصر واى اى جنسيه اخرى لكنه رفض واخد يردد انه فلسطينى حتى قتله اليهود<br />نبكى على ذكرى شهدائنا الراحلين فى 67 و73 وشهداء الانتفاضه فى فلسطين<br />الحريه للمعتقلين الحريه للوطن<br />بلادى بلادى لك حبى وكفاحى<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233107/http://masr.20at.com:80/article.php?sid=461"

[[comments]]
order = 3
subject = "هو كل واحد بييجي وهو حالف ليعمل لنا مصيبة ويمشي .."
author = "محمد السيد"
posted = "2006-06-05"
text = "وأنا مع ياء تماما ....<br />اللي حصل في 56 مكنش انتصار ولا حاجة ...<br />ولو قلنا انتصار ... فهو باي حال لا يعود للرئيس جمال عبد الناصر ... ولكن لرفض الاتحاد السوفيتي وأمريكا للهجوم أساسا .. وبعض المقاومة الشعبية ...<br />أما 67 ... فحسبنا الله ونعم الوكيل في كل واحد تسبب في أي جزء ولو صغير منها ...<br />وآدي نتيجة الاستبداد والإعلام الكاذب والضحك علي عفول الناس ...<br />و حبس الشرفاء ... ماهي دي مصيبة كل زعيم ... وكل عصر ...<br />وبرضه ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233107/http://masr.20at.com:80/article.php?sid=461"

[[comments]]
order = 4
subject = "Ahmad"
author = "اقرأوا امل دنقل:"
posted = "2006-06-06"
text = "قصيدة البكاء بين يدي زرقاء اليمامة<br />أيتها العرافة المقدَّسةْ ..<br />جئتُ إليك .. مثخناً بالطعنات والدماءْ<br />أزحف في معاطف القتلى، وفوق الجثث المكدّسة<br />منكسر السيف، مغبَّر الجبين والأعضاءْ.<br />أسأل يا زرقاءْ ..<br />عن فمكِ الياقوتِ عن، نبوءة العذراء<br />عن ساعدي المقطوع.. وهو ما يزال ممسكاً بالراية المنكَّسة<br />عن صور الأطفال في الخوذات.. ملقاةً على الصحراء<br />عن جاريَ الذي يَهُمُّ بارتشاف الماء..<br />فيثقب الرصاصُ رأسَه .. في لحظة الملامسة !<br />عن الفم المحشوِّ بالرمال والدماء !!<br />أسأل يا زرقاء ..<br />عن وقفتي العزلاء بين السيف .. والجدارْ !<br />عن صرخة المرأة بين السَّبي. والفرارْ ؟<br />كيف حملتُ العار..<br />ثم مشيتُ ؟ دون أن أقتل نفسي ؟ ! دون أن أنهار ؟ !<br />ودون أن يسقط لحمي .. من غبار التربة المدنسة ؟ !<br />تكلَّمي أيتها النبية المقدسة<br />تكلمي .. باللهِ .. باللعنةِ .. بالشيطانْ<br />لا تغمضي عينيكِ، فالجرذان ..<br />تلعقَ من دمي حساءَها .. ولا أردُّها !<br />تكلمي ... لشدَّ ما أنا مُهان<br />لا اللَّيل يُخفي عورتي .. ولا الجدران !<br />ولا اختبائي في الصحيفة التي أشدُّها ..<br />ولا احتمائي في سحائب الدخان !<br />.. تقفز حولي طفلةٌ واسعةُ العينين .. عذبةُ المشاكسة<br />( - كان يَقُصُّ عنك يا صغيرتي .. ونحن في الخنادْق<br />فنفتح الأزرار في ستراتنا .. ونسند البنادقْ<br />وحين مات عَطَشاً في الصحراء المشمسة ..<br />رطَّب باسمك الشفاه اليابسة ..<br />وارتخت العينان !)<br />فأين أخفي وجهيَ المتَّهمَ المدان ؟<br />والضحكةُ الطروب : ضحكته..<br />والوجهُ .. والغمازتانْ ! ؟<br />أيتها النبية المقدسة ..<br />لا تسكتي .. فقد سَكَتُّ سَنَةً فَسَنَةً ..<br />لكي أنال فضلة الأمانْ<br />قيل ليَ \"اخرسْ ..\"<br />فخرستُ .. وعميت .. وائتممتُ<br />اقرأ بقية التعليق .."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233107/http://masr.20at.com:80/article.php?sid=461"

[[comments]]
order = 5
subject = "حمدي"
author = "56 كانت نصر عسكري هو انت جايب"
posted = "2006-06-06"
text = "معلوماتك من كتب التاريخ بتاع خمسه<br />ابتدائي<br />يا حبيب قلبي معركة 56 كانت هزيمه عسكريه<br />نكراء بكل المقاييس وكل الخبراء<br />العسكريين المحترمين متفقين علي كده<br />لكن هما حولوه الي انتصار سياسي علي اساس<br />ان الدول المعتديه اظطرت للانسحاب بعد<br />الانذار الامريكي با ستخدام باستخدام<br />السلاح النووي ضد الدول المعتديه<br />**ايوه امريكا<br />عبد الناصر وعبد الحكيم عامر امروا<br />بتدمير الاسطول المصري قال ايه يااخوي<br />علشان يسدوا القناه في وجه الغزاه<br />يعني عبد الناصر كان مفروض انه يستقيل<br />بعد 56 لو كان بيحترم نفسه<br />لكنه طلع من الموضوع بطل ازاي متعرفش<br />مزوري التاريخ وعبدة الاصنام وتقديس<br />الاشخاص هما سبب كل البلاوي اللي احنا فيها<br />في الماضي والحاضر وابقي سلملي علي هيكل"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233107/http://masr.20at.com:80/article.php?sid=461"

[[comments]]
order = 6
subject = "منكم نستفيد فيلد مارشال حمدي!"
author = "سمسم"
posted = "2006-06-06"
text = "حلمك شوية يا أستاذ حمدي أفندي/<br />حلمك قبل ماتنزل في الخلق تحدفهم بالدبش، وأنت مكشوف ع الآخر كده، حصن نفسك الآول أحسن تجيك طوبة على دماغك تطير الكام خلية الرمادية اللي لسه شغاله فيه، وبعدين لاتعرف تقرا تاريخ خامس إبتدائي ولا أبجد هوز حتى!<br />الإنذار الأمريكي ياعلامة عصرك؟ هو أنته تلميذ عبد العظيم رمضان؟ كويس قوي إني أعرف منك إن خورشوف نكيتا يبقى رئيس الولايات المتحدة، على كده يبقى إيزنهاور رئيس الإتحاد السوفيتي وقتها، مش كده؟<br />اللي أعرفه وعندي على شريط فيديو لسه إن خورشوف ده قلع الجزمة وقعد يخبط بيها على طاولة الأمم المتحدة وقال الكلام ده، معرفش بقه إن ده كان إيزنهاور متنكر، وإنتى اللي وحدك فقست الحكاية بعد نص قرن الزمان، دنته بلوه مسيحة وإحنا منعرف.<br />مش عيب إننا منعرفش، العيب كل العيب إننا نفتي بدون علم، باي باي مس أمركان باي!<br />منكم نستفيد فيلد مارشال حمدي!"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233107/http://masr.20at.com:80/article.php?sid=461"

