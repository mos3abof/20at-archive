subject = "اخر كلام"
author = "حمدي"
posted = "2006-06-06"
text = "الحقيقه ان لا بحب رمضان عبد العظيم ولا<br />بطيقه ولا اقدر اسمع منه كلمتين<br />وانت لا يمكن تكون بتكره الاسرائليين قدي<br />لكن هي دي مشكلتكم ان انتم متصورين انكم<br />الوطنين واللي يختلف معاكم يبقي عميل<br />واللي بينتقد عبد الناصر يبقي عميل<br />** انا انتقد عبد الناصر وانا اعرف ان<br />الرجل ربما كان مخلصا في توجهاته لم<br />ا يريده لمصر لكن هذا لايشفع له عندي في<br />تعذيب الناس وانتهاك ادميتهم"
