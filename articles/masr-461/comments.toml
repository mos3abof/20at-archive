[[comments]]
order = 18
subject = "ياشرفاء مصر الثورة الآآآآآآآآآآآآآآن"
author = "مصرية"
posted = "2006-06-08"
text = "الى كل المشاركين فى هذا الحوار الساخن<br />الانتماء الى تيارات فكرية مختلفة لم يمنع كما لمست من قرائتى لتعليقات الجميع أننا نتفق جميعا على حب مصر و ضرورة انقاذها من براثن هذا القرصان وعصابتة..هذه قضيتناالأساسية الآن..حتى الدروس المستفادة من تاريخ الأمم لن تفيدنا أمام هذه الحالة المستعصية..ارى أن وضع هذه الخلافات الفكرية جانباوالتمسك بقضية التحرير الكبرى من الأحتلال اللامباركى هو أفضل ما يمكن أن نقوم به فى المرحلة الحالية..آلآف الأقلام لن نتقص من قدر أى زعيم قدم عمره وتفانى فى خدمة بلده ..وملايين الأقلام لن تجمل من صورة خائن يبيع وطنه ..مصر فى حاجة الى كل هذه الطاقات أن تتوحد لأننا نواجه نفس العدو ونفس المصير..فئات لايستهان بها من الشعب يتم تخريب عقولهم وأفكارهم بأكاذيب لخدمة النظام الفاسد..عملائه من الحزب الوطنى الناجحون مثله بالتزوير فى مجلس الشعب يوظفون من يقوم بدس أفكار وسط الناس البسطاء تصيبك بالذهول اذا استمعت اليهم ..واليكم أيسط ما سمعته :ربنا يخلى الريس ( اللهم لاتتقبل ) لأنه حامي البلد من اسرائيل وأمريكا ولولاه لدخلت اسرائيل البلد ويطردونا من بيوتناويقتلوا الناس فى الشوارع مش مهم اللقمة محدش حيموت من الجوع واللى يموت يبقى ربنا اختاره..المهم اننا نلاقى مكان يتاوينا:.<br />ولكم ان تتصورا كم الناس المصدقة لهذا الكلام..أنا شخصيا اعمل جاهدة لتصحيح افكار كل من استطيع ..والحمد لله لاقت محاولاتى النجاح معهم ..كنت أظن ان مصدر هذه الأفكار محافظة معينة حتى تعددت المصادر من محافظات اخرى وبات الوضع اخطر لخروج هذه الأفكار عن دائرة البسطاء..مع ملائمة السيناريو بحسب الفئة المعنية..مخطط ولا حكماء صهيون..فلنكرث جهودناونتفق علىانقاذ مايمكن من العقول ..لايمكن ان نتركه يوسع من ارضية الفرش و<br />اقرأ بقية التعليق .."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233107/http://masr.20at.com:80/article.php?sid=461"

[[comments]]
order = 19
subject = "خدعونا وقالوا نكسه"
author = "ابو شريف"
posted = "2006-06-10"
text = "بعد البيانات الكاذبة والمضللة التي كانت تعكس التخبط اللامحدود للأطفال اللذين إنقضوا علي السلطة وقاموا بالثورة التي بدأت بيضاء ثم أسودت مع الأيام بفعل جنان البعض ومجون البعض الآخر إنشكف المستورد ولكن منعا من سقوط آخر ورقة من أوراق التوت التي تحمي عوراتهم تم إطلاق نكسه وهي في الحقيقة وكسه لإنها أعطت شهادة الميلاد الحقيقية لإسرائيل وتم تسليم مفتاح الأقصى فيها ، ولكن لإننا شعب طيب ... يصعب علينا الحرامي لو بكي ونتركه من أجل أولاده ... اقتنعنا بتمثيلية النصف إله والذي صور لنا نفسه انه منقذ الشعب المصري والعربي والقومية العربية وهو في الحقيقية من أدخل الشعب المصري في بئر الفساد والديون اللذين لانعرف للخروج منهم سبيلا ، ومن يتكلم عن العدوان الثلاثي عليه أن يتذكر جيدا أنه لولا أن اللعبة تمت من وراء ظهر أمريكا لما كتب لها الفشل لهذا العدوان ولكن لابد لأمريكا أن تعترض في ذلك الوقت ليس حبا في مصر أو عبد الناصر ولكن تأكيدا للعالم كله أنه في حال رغبة أي قائد أن يفعل أي شئ لابد من طلب التصريح من ماما أمريكا فقط لاغير ولكن إنتصار في العدوان فهو إنتصار سياسي وليس عسكري وصاحب الإنتصار العسكري هو السادات الله يرحمه<br />وخدعونا وقالوا نكسه"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233107/http://masr.20at.com:80/article.php?sid=461"

[[comments]]
order = 20
subject = "خد عندك"
author = "الخارجية الإسرائيلية طالبت سفيرها بالقاهرة بتوخي الحذر وتجهيز الاعتذار المناسب عن الواقعة : مجندة صهيونية تطلق اسم الرسول علي كلبها .. ومظاهرات الغضب تجتاح نابلس"
posted = "2006-06-10"
text = "كتبت دينا الحسيني ( المصريون ) : : بتاريخ 9 - 6 - 2006<br />شهدت مدينة نابلس الفلسطينية مظاهرة عارمة بسبب قيام مجندة بجيش الاحتلال الإسرائيلي ـ تعمل على إحدى الحواجز المقامة بالمدينة ـ بإطلاق اسم الرسول صلى الله عليه وسلم على كلبها ، مما أسفر عن وقوع عدد من المصادمات بين مئات الفلسطينيين المتظاهرين وقوات الاحتلال .<br />اكتشف المواطن أمجد الأغبر ـ من سكان نابلس ـ جريمة الإساءة للرسول الكريم حينما كانت المجندة الإسرائيلية تدقق في هويته على أحد الحواجز التي نصبها جيش الاحتلال بالمدينة ، إذ تقدم كلب المجندة في هذه الأثناء لمسافة قريبة نحو أمجد ، الذي سارع بنهره خوفا من أن يصيبه بأي أذي ، فما كان من المجندة إلا أن عنفته على الصراخ في وجه كلبها ، وراحت تنادي عليه باسم \"محمد\" .<br />من جانبها ، أصدرت رابطة علماء فلسطين برئاسة الشيخ حامد البيتاوي ـ عضو المجلس التشريعي ـ بيانا أدانت فيه بشدة الجريمة النكراء التي أقدمت عليها المجندة الصهيونية ، واصفة إياها بالحقيرة .<br />وأشار البيان إلى أن جنود الحاجز الإسرائيلي لا يكتفون فقط بتأخير المواطنين والتفنن في تعطيل حركتهم ومنعهم من العبور والاستمتاع بإذلالهم ، وإنما دأبوا أيضا على سب الذات الإلهية والإساءة للإسلام ورسوله الكريم .<br />وفي سياق متصل ، كشفت مصادر صهيونية عن أن الحادث دفع الخارجية الإسرائيلية لإصدار تحذيرات مشددة إلى موشيه كوهين سفيرها بالقاهرة ، مطالبة إياه بتوخي أقصى درجات الحذر ة والحيطة خلال تنقلاته بالعاصمة المصرية ، خوفا من تطاير الخبر للمصريين عبر الحدود .<br />وأوضحت المصا<br />اقرأ بقية التعليق .."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233107/http://masr.20at.com:80/article.php?sid=461"

