[[comments]]
order = 13
subject = "بل حنانيك انت يا مراقب"
author = "حمدي"
posted = "2006-06-06"
text = "الاخ مراقب ( إخيه عليه) من باب الرد بالمثل فقط<br />انا اختلف مع معظم ما كتبته ولكني اتفق معك في عدة نقاط<br />1- انا فعلا قاعد علي النت ومشغل المروحه<br />2-ثانيا انا فعلا عمال افرك في رجلي<br />3- انا بشرب الحقيقه شاي مش نسكافييه<br />لاني معرفوش<br />بس انت جيبت المعلومات دي منين ** انت<br />بتراقبني *** واضح ان الحس الامني عند<br />الناصريين عالي ** خبره بقي في المجال<br />الامني ** الحمد لله ان انت مش بتحكموا<br />البلد**** اي نظام مهما كانت مساوئه<br />مكنش هيكون بخطورتكم****<br />وفي النهايه انا بس عايز اقولك انت وكل بيفكروا بطريقتك<br />ان الظلم والاستبداد لايمكن ان يبرر باي<br />عنتريات فاضيه او الكلام عن قضايا كبري<br />لان علي راي اللي قال ** العبيد لا يحررون<br />ارضا بل يجب ان يحرروا انفسهم اولا"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233107/http://masr.20at.com:80/article.php?sid=461"

[[comments]]
order = 14
subject = "تلميذ رمضان إسرائيل؟"
author = "سمسم"
posted = "2006-06-06"
text = "كوهين بيقول:\"<br />الحقييقه انا فعلا باخد معلوماتي من عبد العظيم زمضان<br />احسن ما اخدها من هيكل عميل الاتحاد<br />السوفيتي السابق ورفيق الطاغيه الظالم عبد الناصر \"<br />تعرف إن هيكل محسوب على الغرب يافالح، ولا عمرك شفته إستشهد بوثيقة شرقية؟ ولهذا السبب بالذات تم تقريبه ليكون قناة إتصال، لأن عنده مواصفات لم تجتمع لغيره، ولا خلصت مناقشة العسكرية دلوقتي بقى الدور على السياسة؟<br />ولكن طالما رمضان إسرائيل أستاذك، قسما عظما من الحظة دي ما أرد عليك مهما تقول.<br />أنا ياأفندي مولود في أمريكا أصلا، ولو عايز جنسيتهم أخذها، لكن لا أنا عربي ودمي عربي وحأفضل كده، قول عليا مغفل وناصري واللي يعجبك بس يكون في علمك أنا لسه ماكملتش العشرين، يعنى لا أعرف الإتحاد الإشتراكي."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233107/http://masr.20at.com:80/article.php?sid=461"

