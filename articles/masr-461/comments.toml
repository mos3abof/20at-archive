[[comments]]
order = 10
subject = "عاش جمال عبد الناصر"
author = "عمرو"
posted = "2006-06-06"
text = ":لي بغض الملاحظات على تغطية موقعكم الكريم لزكرى نكسة 1967<br />فاولا لم تتوافر في التغطية ما عرفناه عنكم من موضوعية فقد نشرت فقط الموضوعات التي تهتجم شخص الزعيم الراحل جمال عبد الناصر ولم تعط فرصة مماثلة للجانب الاخر لنشر رؤيته عن هدا الحدث<br />ثانيا:ان الرئيس عبد الناصر اعترف بمسئوليته الكاملة عما حدث وبدا في بناء القوات المسلحة من جديد وبدات مرحلة حرب الاستنزاف التي سماها المؤرخون الاسرائيليون الحرب الأطول والأصعب في تاريخ اسرائيل وقال عنها عايزرا وايزمان انها اول حب لا تكسبها اسرائيل وتكفي هنا شهادة موشية دايان:\"في ظرف 18 شهرا استطاعت مصر اعادة قواتها المسلحة الى ما كانت عليه قبل حرب الأبام الستة وزادت من قدراتها الجوية والبحرية \"<br />ثالثا: ان ثمة وجه اخر للمعركة لا بلتفت البه كثيرون وهو الدور الامريكي الدي خطط مند البداية لاسقاط تيار القومية العربية الدي كان تتزعمه مصر بقيادة عبدلناصر وقد قال الرئيس الامريكي جونسون صراحة في مدكراته \"لقد كنت اقود حرب 1967 بنفسي\" وقال رجل المخابرات الامريكية ايفلاند في كتابه \"حبال من الرمال\" ان مسئولية جونسون عن حرب 1967 لا تقل عن مسئولبة ايدن في تدبير معركة السويس 1956<br />رابعا: ان التدكير المستمر بالهزيمة لا يخدم احدا سوى العدو نفسه الدي يسعى دائما الى اقناعنا بأننا مهزومون ولا قبل لنا بالته العسكرية وكان الاصح هو التدكير بانجاز المقاومة اللبنانية الصغيرة عدة وعتادا في دحر العدو من جنوب لبنان ،ولا ادري لمادا نتلذذ<br />بجلد انفسنا والتذكير بالهزائم ولا نتذكر انتصارا واحدا<br />خامسا: لا أحد طبعا فوق النقد سواء عبد الناصر او غيره ولكن ما رأيته هما ليس نقدا بل تصفية حسابات<br />سادسا: مجرد سؤال برى :لمادا لم ارى على موقعكم الكريم اي مفال ينتقد الرئيس الراحل ان<br />اقرأ بقية التعليق .."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233107/http://masr.20at.com:80/article.php?sid=461"

[[comments]]
order = 11
subject = "حنانيك ياعم حمدي شكشك"
author = "مراقب"
posted = "2006-06-06"
text = "الأخ حمدي (إخيه عليه) على الأقل كان يجب يكون عنده شئ من الإنصاف لما يتكلم وكان لازم يوضح زوايا الصورة طالما أكد للدنيا كلها إن 56 كانت هزيمة منكرة وانه مايعرفش ازاي عبدالناصر حولها لنصر سياسي<br />أولا عبدالناصر يا أفندي بصرف النظر عن صحة أو توقيت قراره أعلن تأميم قناة السويس في خطوة فاجأت الدنيا كلها لعلم الجميع بالعواقب الوخيمة( دي غير العواقب الوخيمة اللي دايما رأس الحكمة والرئيس الحكيم بيحذر منها كل ما أمريكا وإسرائيل يبلعوا بلد عربي الأيام دي ودا بعد ما يفتح لهم القنال ورجلين مصر كمان) المهم إن عبد الناصر أخذ خطوة ضد السيطرة والهيمنة والأطماع الاستعمارية وكانت ضد رغبة أكابر العالم السفاحين أيامها ولا زالوا .. فكان العدوان الثلاثي وتوصيف كلمة عدوان هو برأيي توصيف سليم لأنه لم تكن هناك حرب بمعناها الشامل ولم يكن هناك تكافؤ قوى .. وأنى لدولة لسة خارجة من مرحلة استعمار وخائرة القوى وفي مرحلة لملمة شملها أن تنتصر على جيوش أقوى ثلاث قوى في العالم ( يعني شوية نظر يابوالأحاميد) ... عبد الناصر لم يغزو الكويت مثلا . علشان تجتمع عليهاجيوش بريطانيا العظمى وفرنسا الوسخة واسرائيل اللي ماينفعش معاها وصف فهي وصف نفسها. بل كان ( رغم خطاياه الرهيبة) قائدا وزعيما عربيا عرفت قدره الهند وغاندي ونهرو زعيم يوغسلافيا وكونوا رابطة دول عدم الانحياز لا للمعسكر الغربي بتاع أمريكا وبريطانيا ولا للمعسكر الشرقي بتاع السوفييت وكنوا على الحياد وكان عبدالناصر بالذات من رواد وقادة وزعماء ومناصري حركات التحرير من الاستعمار على مستوى العالم .. وعلشان ما أطولشي عليك أحب أقول لك إن الحروب لا تقاس نتائجها بالنواحي العسكرية فقط بل بالهدف الذي اندلعت من أجله ..فإذا كان الهدف من العدوان الثلاثي في 56 هو إحتلال مصر<br />اقرأ بقية التعليق .."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233107/http://masr.20at.com:80/article.php?sid=461"

