subject = "كيف تقنع المصريين بأن لهم كرامة؟"
text = "كيف تشرح لهم مفهومَ الكرامة وقد أصبحت الكلمةُ غريبةً عليهم، بعيدةً عن قدراتهم الاستيعابية، بل منفرةً لهم لأنه تُذَكّرهم بالكف الغليظة التي تهبط منذ ربع قرن على قفا كل منهم، فيصمت، ويبتسم، ويمسح عرقه، ويخفي وجهه، أو يفلسف وجهة نظره في ضرورة قبول الأمر الواقع لأن العناية السماوية أعدت للصابرين منهم نعيما مقيما؟<br />تلقيت في العامين الفائتين عددا هائلا من الرسائل الخاصة والتعقيبات والتعليقات والردود من مصريين يسبّون، ويلعنون، ويشككون في أحاديثي، ويُصرّون أن الصورة ليست قاتمة، وأن الطاغية يحمل في سوطه وردة، وفي معتقلاته أملا في مستقبل مشرق، وفي جيوب لصوصه كتبا مقدسة، وفي حذائه الذي يضرب به شعبه رحمة وشفقة وعبقرية حكم تسمح له بولاية خامسة.<br />مصريون كثيرون لا يتحسس أي منهم قفاه، ولا يرى مواطنا مثله يبحث في صناديق القمامة عن عشائه في الوقت الذي لا يستطيع ابن الرئيس أن يحصي ملايينه لكثرتها.<br />أدمعت عيناي وأنا أقرأ عن مئات المواطنين الذين ينتظرون أمام كليات الطب لعل الطلاب يتفضلون عليهم، ويستأجرون أجسادهم المنهكة والمتعبة والمريضة للقيام باختبارات عليها مقابل مبلغ قد لا يكفي خبز يوم أو يومين!<br />من الذي حقن أهل بلدي المصريين بتلك البلادة العجيبة التي أصابت موضع الكرامة في العقل والعاطفة؟<br />في نفسي شحنة غضب لو كانت بركانا لقذفت حِمَمَها في طول وادي النيل الخالد لعلها توقظ الوعي، أو تحرك ساكنا، أو تجعل المصريين يتنبهون للحظة أو برهة أن الخالق أكرمهم، وأن من يفرط في كرامته كمن فرط في دينه وعرضه وماله وأهله.<br />بعض الغوغاء يتصورون أن اقامةَ المصري في الخارج وعلى مبعدة آلاف الأميال من الوطن السجن لا تسمح له برؤية المشهد المصري على حقيقته، لكن الحقيقة أن المصريين في الداخل في أمس الحاجة الآن لشعلة وعي تأتيهم من خمسة أو ستة ملايين مصري يقيمون في الخارج، ويتنفسون الحرية، و يعيشون كبقية خلق الله مكرمين معززين ولو كانوا في دول العالم الثالث.<br />إن أبناء شعبنا يتعرضون لخطر التعود على الاذلال، وقبول الامتهان، وعمى الألوان، واعتبار معارك الرئاسة وانتخابات البرلمان حراكا سياسيا ومقدمة لافراج الرئيس عن سبعين مليونا من المعتقلين، لكن ما هكذا تورد الإبل!<br />إنني غاضب على المعارضة المصرية بقدر غضبي على النظام الارهابي للرئيس حسني مبارك، فالمعارضة تمدّ في روح النظام المهتريء، وتمنحه الشرعيةَ الدستورية والشعبية في الرقص معه.ويبقى السؤالُ الحائرُ معلَقاً بين السماء والأرض: كيف تقنع المصريين بأنّ لهم كرامة؟ كيف يقرأ هذه الكلماتِ مصريون ولا تثير لديهم إلا عدم الاكتراث؟ كيف سيعاتبني ويؤنبني وينتقدني مصري لأنني نبّهته إلى الكف الغليظة التي تهوي بقوة فوق قفاه؟ كيف سيقولون: لماذا لا يتركنا هذا الرجل نعيش بسلام وأمن ونستمتع بأننا لا نرى، ولا نسمع، ولا نحس، ولكن نتكلم فلا يسمعنا سيد القصر، فصوت سوطه أعلى من أناّت أوجاعنا؟"
