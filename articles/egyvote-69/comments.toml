subject = "12/12/2005"
text = "﻿ألَمْ يكن من الأفضل أن أضع عنوانَ مقالي: كيف تُقنع الكرامةَ بأن للمصريين حقاً فيها؟<br />أعود للمرة الرابعة أو الخامسة للكلمة التي فجّرها في أذني صديقي المحامي الأوروبي الذي استفسرت منه عن سبب طرد شرطة بلده لمجموعة من المصريين بطريقة مُهينة، فقال لي وكأنه يضع سراً في بئر عميق لا قرارَ له: لأن المصري من دون خلق الله كلهم الذي لا تدافع عنه حكومته تحت أي ظرف وضد أي امتهان لكرامته!<br />في كل دول العالم يتقدم الزائرُ لضابط الجوازات بجواز سفره، فيشكره الضابط ولو كان ممتعضا، أما في مصر فأنت تقدم جواز سفرك قائلا: شكرا، ليس من قبيل التطرف في التمدن، ولكن المساحة المخصصة لكرامتك في التعامل مع الآخرين لا تسمح لك بأكثر من هذا، بل قد تشكر أمينَ الشرطة لأنه ألقى في وجهك هويتك الشخصية دون أن يصطحبك معه بتهمة اللاتهمة!<br />لو أنك في مركز قوة، أمنية أو مالية أو إدارية، وأعتدت أن تصفع أحدهم على قفاه في كل يوم عشر مرات دون أن ينبس ببنت شفة، ثم قررت بعد عدة سنوات أن تخفض عدد الصفعات إلى خمس فقط، ما الذي سيحدث؟<br />أغلب الظن أن المصفوع سيقدم لك عميق شكره، وربما يُحَدّث الآخرين عن لطفك وكرمك وطيبة قلبك!<br />ولكن إذا كنت في مصر وتقدمت من المصفوع محذرا إياه، ومُنبّهاً لضرورة الحفاظ على كرامته، ثم عارضاً عليه مقارنةً بحقوق الآخرين في الجزء الآخر من العالم، ومستنهضا هِمّتَه، ومُحَرّضا نوازع الخير في نفسه للتمرد على الواقع، فإن الكارثة والفاجعة والمصيبة ستدهشك، وربما يغشى عليك من هولها وصدمتها!<br />إنّ صاحبنا سيغضب منك لأنك ذَكرّته بكرامته، وحاولت تعكيرَ صفو لذة الذل واستعذاب الهوان التي تبلغ شدتها ومُتعَتَها وبهجتها كلما مَنَحَته أمْنا وسَكْينة وحماية في ظل سلطة يُقَبّل حذاءها، وتمد في روحه، وتمَنّ عليه أنْ تركته ينام ملء جفنيه ولو كانت بطنه خاوية!<br />ربع قرن من أسفل وأحط وأعفن فترات تاريخ أم الدنيا، يبصر فيها الأعمى بلدا يتم نهبه علنا وجهرا ووقاحة، فتزداد نُكَتُ المصريين، ويبررون للصوص اجرامَهم، ويجددون للرجل الذي فتح لهم خزائن مصر كما تفتح كلمة سمسم مغارة علي بابا، ويبتلعون كرامتهم، وتسير الحياة كما هي، أو كما أمر بها سيد القصر.<br />أكثر من سبعين مليونا من البشر يشهد التاريخ على قيمة حضارتهم، وتحتضنهم جغرافيا مانحة إياهم النيل والبحرين والأرض الزراعية وموقعا استراتيجيا يعادل ثراء دولة نفطية، فيقوم المصريون بالتفريط في كل هذا، ويبصقون على كفاءات آلاف منهم يستطيعون الحفاظ على تلك الثروة، واعادة بناء أمة من أعرق شعوب وحضارات الدنيا، ويسلمون وطنهم العزيز للمرة الخامسة لطاغية مستبد، يحيط به لصوص محترفون، ولا تتحرك فيهم ذرة كرامة واحدة.<br />ولكن هل هناك مفهوم موحد للكرامة لدى المصريين كما هو لدى معظم شعوب العالم من لبنان إلى توجو ومن أوكرانيا إلى فنزويلا ومن رومانيا إلى تاميل سري لانكا؟<br />الاجابة التي يبكي لها أسلافنا وأجدادنا منذ بدء التاريخ لا تحتاج لتبرير أو شرح، فلو خرج عدة آلاف في قلب العاصمة الأكثر ازدحاما رافعين شعارات تطالب بوقف التوريث والنهب والتجديد والتسلط واغلاق المعتقلات والافراج عن الأبرياء ومطاردة رؤوس الفساد، فإن سبعين مليونا من المصريين سينظرون ببلادة شديدة، وسيفغرون أفواههم، وربما يتعجبون من هؤلاء الغوغاء الذين يرفضون أن يستمر الرئيس في صفعهم على أقفيتهم.<br />ماذا حدث في النفس المصرية وجعلها تبادر فورا برفض من ينبّهها إلى كرامتها؟<br />إذا أردت أن تكتب مقالا واقعيا تشرح فيه ما يعرفه كل مصري، جاهل أو عالم، أمي أو قاريء، وتطالب أهل بلدك بالانتفاضة، وتحرضهم على العصيان المدني، وتحدثهم عن مفهوم كلمة غريبة اسمها ( الكرامة ) وتسهب في شرح أهميتها وقيمتها الوطنية والدينية والانسانية فلا ريب أن ثمانية من كل عشرة يقرأون كلماتك سيمرون عليها مر الكرام ولن يكترثوا لها، والتاسع سيصب جَمّ غضبه عليك ويتهمك باللاواقعية، وبأنك لا تستوعب أحداث الشارع المصري، أما العاشر فربما يمتدح شجاعتك، ثم يتولى عنك مهموما بقضاياه ومشاكله الخاصة.<br />كيف يضحك المصري، ويبتسم، ويأكل في معدته ما يسد جوعه، ويشاهد التلفزيون، ويستمتع بالمسلسلات، وفي الوقت عينه يرى بأم عينيه بلده الذي يتغزل فيه صبحا ومساء وقد تحول إلى ترِكة يُعِدّها رجلٌ يقترب من الثمانين لابن ينكر على المصريين حقهم في عزبة أبيه؟<br />كيف يبلع المصري كرامتَه بسهولة ويُسْر وربما مستَعْذِبا غض بصره عما يُحاك لوطنه ولأهله ولأولاده، فيستعد لست سنوات عجاف قاتمات أكثر سوادا من لجُة البحر في ليل طويل لا يعرفه صبح أو حتى فجر على استحياء؟<br />كيف لا يغضب المصريون ومنهم مئات قد قضوا في فترة حكم الرئيس مبارك تحت التعذيب وفي أقسام الشرطة؟<br />كيف لا يغضب المصريون، وآباؤهم وأبناؤهم يقبعون في سجون الظلم عشر سنوات وخمس عشرة سنة وأكثر دون محاكمة؟<br />كيف لا يغضب المصريون وقانون الطواريء الذي لا يتحمله الأحرار شهرا أو اثنين، فيلسعهم بسوطه أربعة وعشرين عاما ثم يمارسون حياتهم كأنهم ليسوا خلفاء على الأرض، أو فيهم من روح الله؟<br />كيف ينظر المصريون بكل تلك البلاهة والبلادة وتبلد الاحساس لطاعون من الديكتاتورية المذلة، فتتحول مصر في عهده إلى أصفار متراصة، فيرى المصري نتائج حكم مبارك في الغلاء واستحالة شراء كل احتياجاته الدوائية وانحطاط الخدمات والتعليم والتربية والاعلام، ويتنفس هواءا ملوثا، ويشرب ماء أكثر تلوثا، ويفرض عليه الرئيس وزيرا لعشرين عاما يجعل خيرات أرضهم مستودعا للسرطان، وبطونهم وأجسادهم ودماءهم وأكبادهم صيدا ثمينا لهذا المرض اللعين؟<br />كيف تقنع ستة ملايين عاطل عن العمل بأن الرئيس هو المسؤول الأول والأخير عن مأساتهم؟"
