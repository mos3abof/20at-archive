[[comments]]
order = 2
subject = "يا رب نفهم"
author = "إبن بهية"
posted = "2006-11-17"
text = "هو فيه إيه ؟؟؟ إيه الرعب العجيب ده من الدين والمتدينين في أي مكان وكل مكان ؟؟؟ لماذا الرعب من الإخوان ؟؟؟ هل لهذا ما يبرره ؟؟؟ والله لا أجد لدى أي ممن يعادون الإخوان أي مبرر منطقي يمكنني أن أقبله كمواطن يلوذ بهم لحمايته من بطش النظام الفاسد ... طيب ما تيجوا نشوف ستهم أمريكا وأسيادهم في الغرب بيعملوا إيه ؟؟؟ مش من عشرين .. قول ثلاثين سنة بدأ اليمين في الغرب يرتفع ويحصل على الحكومات واحدة تلو الأخرى من أيام ستهم الحديدية وحزب المحافظين البريطاني وسيدهم رونالد ريجان ومحافظينه الجدد وهي شغال يمين في يمين ؟؟؟ آخرها ميركل في ألمانيا .. يبقى ليه عندنا احنا لأ وكخه ؟؟؟ ليه هو الدين عورة ولا إيه ؟؟؟<br />لسه من يومين زعيم الجمهوريين قالها على الملأ وأمام وسائل الإعلام مش بينه وبين نفسه .. قال (اسرائيل تنفذ سياسة إلهية) والنبي إيه ؟؟؟ طيب ليه ما قلناش له عيب اتلهي بلاش حركات متدينين ؟؟؟ ليه اشمعنا احنا بس ممنوع على اليمين عندنا يحكم ؟؟؟ هو يمينهم أحسن من يمينا ؟؟؟ ولا فين العلة يا عالم معلولة ومرضة في دماغها ؟؟؟<br />الإعلام بقاله خمسين سنة شغال على الإخوان هبد وتجريح وبهدلة .. تقولش الإخوان باعوا البلد زي غيرهم ؟؟ ولا المصايب اللي احنا فيها دي منهم ؟؟؟ دول غلابة ما حكموش البلد خالص ولا ساعة حتى .. يبقى ليه بنلومهم كده ؟؟؟ تيجي تتكلم كده وانت يساري مش إسلامي يقولولك لا لا إنته يسار إسلامي .. إنته مش عارف بطيخ إيه .. يا عم اتنيلوا وافهموا بقى .. الحل للبلد دي عند الإخوان والله ولو ربنا وفقهم وحكموا يبقى ساعتها نحكم عليهم وعلى إدارتهم للبلد اللي واثق تمام الثقة أنها ستكون أفضل من أي حد غيرهم .. يا ريت نحترم نفسنا ونحترم بعضنا ونحترم وطنا ونجعله هو فوق الجميع مش كلام وبس .. لأ وفعل كمان بمراق<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015247/http://masr.20at.com:80/article.php?sid=1160"

[[comments]]
order = 3
subject = "عندك حق ابن بهية"
author = "شيماء"
posted = "2006-11-17"
text = "السلام عليكم و رحمة الله و بركاتة<br />عندك حق ابن بهية الدين بقي كخة في بلاد المتدينين لكن للاسف المسيحين مش بيتواجهوا بكل كمية الرفض و التعنت الي بيلاقيها الاسلاميين .<br />و الغريب انهم مسمينها جماعة الاخوان المحظورة شوفت الغباء البلدي , منين محظورة و منين منها 88 نائب في البرلمان يكونوش هربانين من السجن عشان كدة محظورة و لا الالاف الي انتخبوهم او يمكن ملايين فاقدي الاهلية و معاهم شهادة معاملة الاطفال. و صحيح \" و كم بمصر من المضحكات و لكنه ضحك كالبكاء\"<br />شكرا"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015247/http://masr.20at.com:80/article.php?sid=1160"

