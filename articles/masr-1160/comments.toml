[[comments]]
order = 0
subject = "الله يحرقهم"
author = "الله يحرق الوزيرة وجوزها وإللى معينها كلهم فى يوم واحد اللهم امين"
posted = "2006-11-15"
text = "على العموم الخطر على الوزيرة مش من الأخوان المسلمين الذين يتقون الله وتخشى على بيع أملاك الشعب من رفضهم لهذا الفساد الخوف كل الخوف عليها من العمال الذين سيسحقونها هى وامثالها الحرمية الفاسدين وهما لو مكنوش متأكدين أنهامن الفسدة وهما منها ما كنوش صبروا على أنها مؤهل متوسط وعينوها وزيرة والله يمهل ولا يهمل وحسبى الله ونعم الوكيل<br />اللهم لا تولى علينا بذنوبنا من لا يخافك ولا يرحمنا اللهم أمين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015247/http://masr.20at.com:80/article.php?sid=1160"

