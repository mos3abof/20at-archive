[[comments]]
order = 1
subject = "محدش يسمع كلام اميرة"
author = "محمود صباح"
posted = "2006-05-30"
text = "يااخوانى ياطلبة محدش يسمع كلام اميرة ؟ ليه كده يااميرة مش تخليكى اميرة هو فين الوقت اللى الطلبة هيضيعوه فى التمشية والسينما مش كفاية الوقت اللى ضاع طول السنة شوية بطولة افريقيا وشوية ماتشات الدورى وبعد اسبوع كأس العالم وفى الوسط شوية مظاهرات وجنبهم حبة اعتصامات ده غير الوقت الى ضاع فى المواصلات ( حلو السجع ده ) ده اصلا غير ان الطلبة مبتبتديش مذاكرة الا قبل الامتحانات بكام يوم يبقى تيجى انتى وتقولى لهم روحوا سينما واسمعوا موسيقى واطفوا النور . صباح النور . ياجميع طلبة مصر المحروسة محدش يسمع كلام اميرة لان اللى هيسمع كلامها يبقى ييجى يقابلنى لو نفع"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132921/http://masr.20at.com:80/article.php?sid=415"

[[comments]]
order = 2
subject = "انا افتكرت التهيس بتاع الاسكندرانيه"
author = "احمد السعوديي"
posted = "2006-05-31"
text = "انا مش معاكم كلكم في الكلام التهيس ده بدل ماتتكلموا عن الامتحانات قولوا ايه الحياه فيما بعد الامتحانات هتوصلوا لجواب واحد مفيش حياه مستقبل ضايع ماعدا طبعا الكوسه الكل عايز يهيس اليومين اللي فاضلينله في الحياه خليكوا في الدراسه والمصروف لان بعد كده مش هتاخدوا الابال..... بعيد عن السامعين<br />اخوكم بقاله في التعليم كتير وانا مبسوط ومش هتغير لواقدر اخد السنه في عشره مش هتاخر وده مش كلام واحد فاشل ده كلام خبره من كتر سنين التعليم<br />صدقوني مفيش احلي من ايم الكليه تخيل نفسك تصحي يوم مش لاقي حد يعبرك ولا شغله ولا مشغله ومش عارف تتجوز ولا فيه فلوس علي اعتبار انك مخلص بقه هتسأل نفسك فين حريم الكليه والاصحاب والمقالب وسهر الليالي والعربده هتلاقي نفسك ياأس من الحياه وهتنتحر وده توقعي للشباب المصري بعد سنتين لو حال البلد ماتغيرش للاحسن ههههه وطبعا مش هيتغير<br />امضاء اخوكم السعيد جدا بخنقت المراقبين"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132921/http://masr.20at.com:80/article.php?sid=415"

[[comments]]
order = 3
subject = "العلام سترة"
author = "Doctor xp"
posted = "2006-06-01"
text = "مش حنسي كلمة واحد صاحبي الله يمسيه بالخير بقي و يرجعه مصر يالسلامة (أو ربنا يفرجها من عنده و نحصّله في بلاد البترول قبل ما تصبح بلاد الأمريكيين) كان دايمان يقول إن العلام سترة ... و طول مانتا في بيت أهلك محدش بيسأل على أي حاجة ... بس إنتا تخلص علام من هنا ونفتح على روحنا كل أبواب الكلام و التعليقات و \"ماتساعد أبوك فى مصروف البيت يا زفت ... أديينا أعدين بنعلف فيك بقالنا سنين .. لو كنا بنربي فى ثور كان زمانو بيلف فى ساقية ... ماتخلي عندك شوية من الهباب إللي بيسموه الدم و تنزل تدور على شغل ... طب ياأخي إتنيل على عينك و حط فى عينك حصوة ملح ... بتتكلم على جواز يا فسل يا إمعة و إنتا لسه بتمدلي إيداك كل شهر تاخد مصروفك\" و هكذا تلاقي فعلاً إن الغلطة الحقيقية إنك مش لاقي شغل ... الغلطة إنك خلصت علام و بقيت أعيدلوهوم في البيت صباح و مسا.<br />نصيحة أخوية من شاب ممتحن ... إسمعوا كلام الأخت أميرة و سيبوها على الله."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132921/http://masr.20at.com:80/article.php?sid=415"

