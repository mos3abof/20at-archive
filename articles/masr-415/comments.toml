[[comments]]
order = 5
subject = "هي كانت ناقصه يا اميرة"
author = "الاستاذشيكو"
posted = "2006-06-03"
text = "والنبي يا ست اميرة بلاااااااااش يقلبي علينا المواجع العمليه مش ناقصه والله<br />قال يعني لازم الواحد يذاكر ويسترخي ويعمل حركات من بتاعه الاخت اميرة عشاان ينجح ولا عشاااان يسترخي ايه الكلام الافاضي ده 00000 لااااء وايه الاخت اللي فوقي بتقول انها اول ما قرات المقال استريحت وبلاش الكلمه التانيه عشان دى بقه تبقه لمؤخذة 00000 هه فاهمين طبعا قال النور المطفي قال 0000ايه ده<br />بلااااش حد يفهم الكلام غلط<br />طبعا موافقين هه موافقه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132921/http://masr.20at.com:80/article.php?sid=415"

