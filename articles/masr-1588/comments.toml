subject = "موضوع ممتاز"
author = "شريف الدواخلي"
posted = "2007-02-14"
text = "الموضوع بجد عجبنى جدا يا استاذ بشر لدرجة انى قريته أكتر من مره \" تصور ديه \" وده لان الموضوع معمول فيه شغل صحافة محترفين من اول كلمة لنهاية الموضوع وناخد حاجة حاجة<br />1- توافر عنصر السرعة فى تغطيه الحدث<br />2- المعالجة المتكاملة لكل جوانب الازمة<br />3- التزام الموضوعيه بشكل رائع فى الموضوع<br />4- الاسلوب كان دسم جدا بس واضح قوى<br />وعلى فكره يا بشر انتا من احسن الناس اللى بكتب فى الموقع من وجهه نظرى المتواضعة"
archived = "2007-02-16"
