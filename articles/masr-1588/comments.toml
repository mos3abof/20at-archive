subject = "عيد بفالنتين أحمر بلون دم المسلمين في كل مكان"
author = "طيف بدر"
posted = "2007-02-14"
text = "http://alayasser.maktoobblog.com<br />الدكتور غالب الفريجات/الأردن<br />في الثالث عشر من شباط من عام 1991، قصف ملجأ العامرية في مدينة بغداد عندما كان مأهولا بالمدنيين من نساء وشيوخ وأطفال، أدى إلى استشهاد (407) مواطنا، منهم 138 رجلا، 269 امرأة، من بينهم 54 طفلا رضيعا، 26 مواطنا عربيا.<br />لقد قرر المجرم الجنرال غلوسوم قصف ملجأ العامرية لإيقاع الرعب في نفوس العراقيين، فانطلقت طائرتان من نوع (أف – 117) مزودتان بقنابل صنعت خصيصا لهذه العملية، من نوع (جي بي يو/27)، المخصصة لحرق الأهداف الكونكريتية والموجهة بأشعة الليزر، من قاعدة (خميس مشيط) في السعودية، مع تشكيل من طائرات الحماية والحرب الالكترونية، لتصل إلى ملجأ العامرية، وتطلق عليه صاروخين صمما خصيصا لهذا الغرض، من خلال فتحة التهوية الخاصة بالملجأ، وكان هدف الصاروخ الأول أحداث خرق يولد عصفا، يؤدي إلى إغلاق الأبواب، فيما يقوم الصاروخ الثاني من خلال الخرق، ليحقق النتيجة المطلوبة للعدوان.<br />لقد حامت الطائرات الأمريكية لثلاثة أيام متتالية حول منطقة الملجأ، قبل ارتكابها الجريمة البشعة وبارتفاعات منخفضة، لغرض التصوير والتعرف على مواصفات الملجأ وتحديد كيفية إصابته وإلحاق الأذى به وبالناس الموجودين فيه، وبعد إصابته وصلت درجة الحرارة فيه إلى آلاف من الدرجات وانصهرت الأجساد، حتى أن كثيراً من الجثث في الطابق السفلي قد تفحمت واختلطت بالاسمنت والحديد المنصهر، فتحول هذا الطابق إلى مدفن جماعي، ولم يتمكن أهالي العامرية من التعرف على الجثث، التي تحولت إلى أكوام من لحم محترق وهياكل محطمة.<br />أرادت الولايات المتحدة أن تكذب على العالم كعادتها لتبرير الجريمة البشعة، فادعت أنه مقر عسكري، وأطلق المجرم ديك شيني وزير الدفاع، نائب الرئيس الحالي أكذوبة،<br />اقرأ بقية التعليق .."
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216004835/http://masr.20at.com:80/article.php?sid=1588"

