author = "40 مليون فى عشوائيا"
posted = "2009-10-22"
text = "رجعت بعد غربة طويلة 30 سنة الى ارض الوطن<br />فى الحقيقة معظم مابنى من مبانى فى قرى ومدن مصر باثتثناء الساحل الشمالى كلة مبانى عشوائية<br />لماذا لا تزور شبرا الخيمة وحواريها التى لا تزيد عن مترين وكلها عشوائية وجميع الامتدادات فى القرى والمدن المصرية بنيت بدون اى تخطيط او اشراف حكومى<br />فمثلا الحكومة لم تتدخل لتحديد عرض الشوارع ولا اماكن بناء المدارس ولا الخدمات ولا حدائق ولا مسطحات خضراء ولا اى تخطيط اطلاقا<br />كان الحكومة كانت غايبة او مغيبة والناس بتبنى وكل واحد بمزاجة<br />الحكومة فقط كانت تمد المجمعات العشوائية بالكهرباء والماء وينتهى دورها<br />فعندك ما لا يقل عن 40 مليون مصرى يعيشون فى عشوائيات"
archived = "2009-10-24"
capture_url = "https://web.archive.org/web/20091024154720/http://www.20at.com:80/masr/2khbar/13786--31-.html"
