posted = "2009-11-05"
text = "الموضوع حلو جدا و بجد نفسي نعمل موضوع عن المبذر كمان اصل كتير اوي اعرفهم مبذرين يسيبوا النور و التلفزيون و الكاسيت و اللاب توب شغالين مع بعض في نفس الوقت و لو راحوا يشتروا فاكهة لازوم يشتروا خمس انواع و فى الاخر كلهم يترموا بجد يا محمد يا ريت زي ما تناولت مشكلة البخلاء تتناول عكسهم مشكلة المبذرين"
