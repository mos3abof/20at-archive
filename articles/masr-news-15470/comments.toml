author = "يا نهار اسود"
posted = "2010-02-24"
text = "كيف يتم قبول طالب فى مدرسة وعندة فيروس الكبد بى وفيروس سى وسرطان الدم<br />الا يوجد كشف طبى على الطلبة قبل دخولهم المدارس<br />المريض هنا فى وسط تجمع طلابى مصدر عدوى رهيب<br />ثم اننى اؤؤيد سيادة الوزير فى الضرب وكلنا فى المدرسة انضربنا - بس مش بالاجرام دة<br />الضرب بمسطرة بعصا رفيعة على الايدى - ماشى<br />انما تكسير عظام طفل فهذا اجرام وليس ضرب<br />الضرب مطلوب نعم ولكن بحنان وبأوبية شديدة<br />لية القسوة دى"
archived = "2010-03-10"
capture_url = "https://web.archive.org/web/20100310204526/http://www.20at.com:80/masr/news/15470-2010-02-24-13-30-11.html"

