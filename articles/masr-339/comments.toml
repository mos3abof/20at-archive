subject = "لا هو تدهور ولا حاجة"
author = "am00r"
posted = "2006-05-18"
text = "هوا لا تدهور ولا حاجة، ده استهتار و عدم مبالاة بالشعب، و بالذات عندنا هنا فى مصر، كل ما يحصل حاجة يقولونا \"الي عملها مختل عقليا...!\" و احنا نسكت.<br />البلطجة لازم يبقالها حل، دي بقت سياسة \"عينى عينك\""
