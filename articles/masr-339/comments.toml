[[comments]]
order = 1
subject = "اخر الاخبار"
author = "ابو كرتونة"
posted = "2006-05-26"
text = "اعلنت السلطات النظيفية انه بالكشف علي ممدوح اسماعيل صاحب العبارة المنكوبة تبين انه (مختل عقليا) وامرت حكومة جمهورية فسادستان ايداعه احدي المصحات بلندن, ومعه اموال الشعب الهارب بها..<br />وسلملي علي الترمــــــــاي"
archived = "2006-09-05"
