[[comments]]
order = 2
subject = "آه يارمم"
author = "زعلان وحزين"
posted = "2006-05-26"
text = "بصراحة أنا لست مع فهمي هويدي في محاولته الرخيصة المكشوفة لتبرئة حماس الإرهابية من محاولة التخريب وقلب نظام الحكم في الأردن الشهيد البلد الوديع الذي لم يخن العروبة يوما ولم يلعب على كل الحبال يوما ولم يهبط مليكه ومنيكه ارض صهيون ليبلغ جولدا مائير بان مصر ستشن الحرب ..ولم يبيع التاريخ والدم والعروبة يوما.. ولم يوالي الصهاينة والدهاقنة على حساب ابناء الدم والمصير والدين يوما......<br />كما ان حماس الارهابية هي التي سحبت وآوت العصابة المجرمة إلى غزة لتدريبهم على أعلى مستوى تقني على التخريب في مصر التي بذل زعيمها المفدى عمره في قضيتها ووهب نفسه لفلسطين وابناء فلسطين يذود عنهم وينافح بالرخيص والرخيص ..ولم يدع أحدا من أول شامير مرورا ببيريز ونتنياهو وشارون انتهاء بأولمرت لم يدع أحدا منهم يركب على الفلسطينيين إلا وركب معه إن لم يركب قبله .. الحريص قوي قوي على ضبط النفس وضبط النقص لما الصهاينة يدكوا اللحم العربي في بعضه ويشووه في جهنم النابالم والمطاطي ويحاصرون النساء والأطفال على الطرقات والكمائن ..بينما إذا اتعور كلب صهيوني بحجر طفل مات أخيه وأمه وابيه وفصيلته التي تؤويه ..انتفض كالسعران ويدين العملية الدنيئة الخسيسة .. آه يا أمة بقت وسخة .. مهما كان البحر عاتي.. قوادينك ملاحينك ..يزعقوا للركيب يواتي.. حماس ؟؟؟ حماس ياولاد الجزمة يارمم هاتقلب نظام الحكم وتخرب في المخروبة اللي عايشة على الشحاتة واللي بتاكل بثدييها منذ العمر الطويل وحتى طويل العمر..<br />حماس ياولاد الكلب يا أنطاع هاتدرب الشباب الغلابة على تفجير المواخير بتاعة دهب علشان تهز استقرار اللي مالوش قرار .آه ياقرار.<br />عايزين إيه بالظبط .. حتى آخر شمعة باقية عايزين تطفوها ومش قادرين على نورها .... خلاص قتلتم في الأمة حاجة اسمها الكفاح<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183019/http://masr.20at.com:80/article.php?sid=339&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "حسبنا الله ونعم الوكيل"
author = "مصرى للنخاع"
posted = "2006-05-27"
text = "حسبنا الله ونعم الوكيل فى الظلمه رؤسائناسواء فى مصر اوفى اى مكان تانى من الوطن العربى هؤلاء العلوج على راى اخونا الصحاف عايزين يهدموا اى حلم جميل ممكن تحلموا البلاد العربيه بناس نضيفه تحكمها واول الخونه دول الراس بتاعتنا والراس بتاعة الاردن الخونه يارب احرقهم بجاز وسخ قولوا امين"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183019/http://masr.20at.com:80/article.php?sid=339&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
