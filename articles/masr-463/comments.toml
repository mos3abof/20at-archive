order = 0
subject = "نداء عاجل لكل شخص محترم فينا...تعالوا شجعةنا في عرض النيابة النهاردة"
author = "محمد السيد"
posted = "2006-06-05"
text = "اليوم عرض 200 من المقبوش عليهم في يمظاهرة القضاة يوم الخميس 11/5..<br />واللي شرفت برفقتهم ... لكن مش عارف ليه استعجلوا عليا وطلعوني ....<br />لو حد ممكن ييجي يساندهم ... متتخيلوش كان تأثيره إيه علينا منظر مئات البشر اللي كانوا واقفين خارج مبني محكمة الجلاء .... والله ده كفايه يشجعنا متين سنة قدام ...<br />بجد والله ... اللي يفدر يحضر ويتواجد .. ده له أثر محترم جدا علينا جوه ...<br />وبرضه<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910073625/http://masr.20at.com:80/article.php?sid=463&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "دول الناس كانوا أحسن مننا وأرجل في اليوم ده"
author = "محمد السيد"
posted = "2006-06-05"
text = "إحنا يومها كنا مجهزين هتافات وحاجات من دي .. قلنا نشجع الناس اللي جايين يطمنوا علينا .. لكن العكس اللي حصل ..<br />صوتهم وشكلهم وهتافهم .. خلي كتير مننا يبكي ويتأثر جدا جدا ....<br />أنا أسف إني مش قادر أنقل لكم الوصف .لكن حقيقي ... كانت لحظة بالدنيا ...كفيلة كمان إنها تشجع أي واحد فيكم إنه يكمل المشوار ده ...ومايخوفهوش لا سجن ولا سجان ...<br />وبرضه<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910073625/http://masr.20at.com:80/article.php?sid=463&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "العنوان والوقت وياريت تحضروا ومتقلقوش. مفيش اي قلق أو مضايقة أمنية"
author = "محمد السيد"
posted = "2006-06-05"
text = "صحيح ...نسيت العنوان ..<br />شارع الجلاء .. موازي لرمسيس .. هناك المكان معروف جدا .. وحتلاقوه زحمة ...<br />كمان ... العرض طول اليوم لغاية الساعة 5غالبا ... ماهم كتير ... يعني وقت ماتكونوا فاضيين تعالوا ..<br />بس بجد .. متسبوهمش لوحدهم<br />لا للتمديد... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910073625/http://masr.20at.com:80/article.php?sid=463&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "خد عندك"
author = "الخارجية الإسرائيلية طالبت سفيرها بالقاهرة بتوخي الحذر وتجهيز الاعتذار المناسب عن الواقعة : مجندة صهيونية تطلق اسم الرسول علي كلبها .. ومظاهرات الغضب تجتاح نابلس"
posted = "2006-06-10"
text = "كتبت دينا الحسيني ( المصريون ) : : بتاريخ 9 - 6 - 2006<br />شهدت مدينة نابلس الفلسطينية مظاهرة عارمة بسبب قيام مجندة بجيش الاحتلال الإسرائيلي ـ تعمل على إحدى الحواجز المقامة بالمدينة ـ بإطلاق اسم الرسول صلى الله عليه وسلم على كلبها ، مما أسفر عن وقوع عدد من المصادمات بين مئات الفلسطينيين المتظاهرين وقوات الاحتلال .<br />اكتشف المواطن أمجد الأغبر ـ من سكان نابلس ـ جريمة الإساءة للرسول الكريم حينما كانت المجندة الإسرائيلية تدقق في هويته على أحد الحواجز التي نصبها جيش الاحتلال بالمدينة ، إذ تقدم كلب المجندة في هذه الأثناء لمسافة قريبة نحو أمجد ، الذي سارع بنهره خوفا من أن يصيبه بأي أذي ، فما كان من المجندة إلا أن عنفته على الصراخ في وجه كلبها ، وراحت تنادي عليه باسم \"محمد\" .<br />من جانبها ، أصدرت رابطة علماء فلسطين برئاسة الشيخ حامد البيتاوي ـ عضو المجلس التشريعي ـ بيانا أدانت فيه بشدة الجريمة النكراء التي أقدمت عليها المجندة الصهيونية ، واصفة إياها بالحقيرة .<br />وأشار البيان إلى أن جنود الحاجز الإسرائيلي لا يكتفون فقط بتأخير المواطنين والتفنن في تعطيل حركتهم ومنعهم من العبور والاستمتاع بإذلالهم ، وإنما دأبوا أيضا على سب الذات الإلهية والإساءة للإسلام ورسوله الكريم .<br />وفي سياق متصل ، كشفت مصادر صهيونية عن أن الحادث دفع الخارجية الإسرائيلية لإصدار تحذيرات مشددة إلى موشيه كوهين سفيرها بالقاهرة ، مطالبة إياه بتوخي أقصى درجات الحذر ة والحيطة خلال تنقلاته بالعاصمة المصرية ، خوفا من تطاير الخبر للمصريين عبر الحدود .<br />وأوضحت المصا<br />اقرأ بقية التعليق .."
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910073625/http://masr.20at.com:80/article.php?sid=463&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
