text = "وقت الزيارة طبعا ها اقعد فى البيت واتفرج على اخبار قناة bbc<br />ويمكن اسافر البلد خميس وجمعة اطمئن على الاهل<br />او اروح سوق الجملة اشترى فاكهة من هناك واحتمال اشيل الكاميرا واروح اخد صور على الطبيعة لشاطىء النيل<br />او اقعد اشا[ *** ] مع العيال وامهم واخليها تعمل طبقين رز بلبن"
