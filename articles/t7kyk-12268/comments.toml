author = "امن عايز يظهر"
posted = "2009-06-03"
text = "انا عندى سؤال<br />هل لو سيادة الرئيس محمد حسنى مبارك قرر زيارة العاصمة الامريكية - هل سيغلقون الشوارع ويمنعون الناس من الدخول والخروج واغلاق الشبابيك<br />لية الامن عندنا يظهر انة عايز يظهر وكانة صاحب الليلة وانة اللى شايل الهم<br />يا جماعة البلد امان والناس غلابة ومفيش احد عندة دبابة مخبيها فى البيت ولا صواريخ فوق السطح<br />اللة يرحمك يا عبد الناصر ويا سادات لما كنت بتركب مع الرؤساء سيارة مكشوفة وتطوف فى الشوارع وسط تصفيق الجماهير<br />انا عاصرت الرئيس السادات وهو بيستقبل الرئيس الامريكى وطلعنا فى الشارع وهتفنا لهم<br />والشوارع كانت مكتظة بالناس"
archived = "2009-06-06"
