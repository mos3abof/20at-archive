author = "واحدة وخلاص"
posted = "2009-10-15"
text = "موافقة على كل ما قلت في هذا المقال ..<br />- فالنقاب في الأول والأخر حرية شخصية سواء كان ناتج عن فكر ديني أو نتيجة سلوكيات مجتمع .. ومن حق أي انسان أن يلبس ما يشاء سواء كان المجتمع سيرضى به أم لا.<br />- أما الأماكن أو الوظائف التي تتطلب زي بشروط معينة فإما أن يلتزم الكل بهذا الزي أو أن تنسحب من هذه الوظيفة أو هذا المكان \" أي إذا تم منع المنقبات من د[ *** ] الجامعات أو من العمل كممرضات أو مدرسات مثلا.. فلتمنع أيضا من تلبس الملابس الضيقة أو العارية \" .<br />- وآخر نقطة أوافق عليها وأعتقد أن هذا المقال أول من تكلم عنها \" من الأولى أن يُصدر قراراً بمنع النقاب فى الملاهى الليلية \""
archived = "2009-10-30"
