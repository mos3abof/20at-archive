author = "أميرة عبدالحميد"
posted = "2009-10-16"
text = "الاستاذ الفاضل كاتب المقال،<br />الا تجد ان كلامك يناقض بعضه ، بالله عليك الا يكفي راي 80 بالمائه من العلماء كاغلبيه لمنع النقاب ، اليس لدوله تحرص على اسستتباب الامن ان تجبر مواطنيها على كشف وجوههم ، تقول بانه الاولى منع النقاب من الملاهي الليليه وما الذي اتى به علينا الا المتنطعون في الدين الذين يعتبرونه فضيله و هؤلاء اسألهم اسيظلون على رايهم هذا ان خبروا بانفسهم الزنا في بيوتهم والتحرش في المساجد من قبل رجال منتقبين والله ان ما اقوله واقع وليس خيال واسع دعونا نعود للفطره وننظر لوجوه بعضنا بعضا والا سنجد شبابنا من الجنسين يمشون في الشوارع مرتدين اقنعه بات مان وسندريلا وغيرها ما دامت تغطيه الوجه حريه شخصيه.<br />السلام عليكم ورحمة الله"
archived = "2009-10-30"
capture_url = "https://web.archive.org/web/20091030151804/http://www.20at.com:80/masr/blog/13704-2009-10-13-15-48-05.html"

