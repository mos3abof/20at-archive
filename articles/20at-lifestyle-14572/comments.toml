text = "لا حول و لا قوة إلا بالله . متى سنبتعد عن الاحتفال بأعياد ميلاد الكفار و الفاسقين و نحتفل بميلاد الرسول عليه الصلاة و السلام .<br />و لكنني سعيد بأن الصورة في الأعلى لا تحوي شموع على ال كعكة لأنها تقاليد وثنية تدعو إلى عبادة الأصنام .<br />و السلام عليكم و رحمة الله ."
