subject = "انا اريد"
author = "رشا"
posted = "2006-02-20"
text = "انا جلست مع احد لاشخاص مرة ولكن انا عائشة في حيرة من امري اهو مريض ام لا ولا اريد فحص نفسي لان اهلي اذا علمو بالمر سيقتلونن واذا ذهبت الى احد المخابر سوف يكون هناك تحقيق من الامن واخذ الهويات الخ...... انا اريد معرفة اي شيء حول هذا المرض واريد ان اعرف اعراضه ارجو الرد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134617/http://www.20at.com/article2.php?sid=32"

