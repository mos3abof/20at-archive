[[comments]]
order = 1
subject = "إنه ابتلاء من الله"
author = "سعيد"
posted = "2005-12-10"
text = "أقول لصاحب التعليق السابق: لا يجب التشفي في مرض قد يصيب كل إنسان بأسباب مختلفة،والإسلام علمنا أن المرض ابتلاء من الله قد يطهر به من الذنوب والمعاصي.<br />ويبدو ان معرفتك بالمجتمع المغربي منعدمة فهو ليس إطلاقا مجتمع الفاحشة، فهي موجودة إلى جانب الصلاح والتقوى شأن كل المجتمعات.<br />والإنسان عدو ما يجهل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134617/http://www.20at.com/article2.php?sid=32"

[[comments]]
order = 2
subject = "saad"
author = "quel ignorance!!"
posted = "2005-12-13"
text = "الجهل يولد الجهل... تجهل المغرب، وينقصك الحياء... المغرب الذي تتحدث عنه هو مغرب يوسف بن تاشفين وطارق بن زياد، وهو البلد الذي خرجت اكبر المظاهرات في العالم الإسلامي لدعم فلسطين والعراق، وهو الذي خرج أكثر من مليون ونصف للمطالبة بمدونة أسرة تنسجم مع الشريعة الإسلامية.. الإنسان عدو ما يجهل..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134617/http://www.20at.com/article2.php?sid=32"

[[comments]]
order = 3
subject = "ان الله اذا احب عبدا ابتلاه"
author = "داليا"
posted = "2005-12-14"
text = "شفاك الله وعفاك يا فاطمه انت وابنك ولابنا يحمي ابنك يارب وبعدين فكرة الانتحار دي وحشه جدا فربنا اذا احب عبد ابتلاه فربنا بيحبك و عايز يخففلك ذنوبك فأصبري واحتسبي و ربنا يصبرك يا رب والاخ اللي قال ان المغرب بلد الفاحشه فكل بلد فيها التقوى وفيها الانحلال من بعض الناس فقط فمش كويس ان نحكم كده على بلد باكملها وبعدين متنساش انها بلد اسلاميه في الاول وفي الاخر وعيب ان نغلط كمسلمين في بعض وربنا يهدي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134617/http://www.20at.com/article2.php?sid=32"

[[comments]]
order = 4
subject = "الله يشفيك يا اختي"
author = "ليانا من القدس"
posted = "2005-12-21"
text = "ربنا يكون معاك ويشفيك يا اختي ويحمي كل أبناء وبنات المسلمين ةالله يهدي كل الشباب .... والشخص الذي قال ان الشعب المغربي كله هكذا ... أقول له لا تسخر أو تستهزأ من أحد أو من المرض ... ممكن انت تصاب بشكل أو بآخر بل ادع لاختنا ولجميع الناس بالصفاء وربنا يهدينا كلنا وسلامة أبنائك .. ليانا من القدس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134617/http://www.20at.com/article2.php?sid=32"

[[comments]]
order = 5
subject = "شفاك الله يا فاطمة"
author = "حورية الدعوة"
posted = "2006-01-21"
text = "شفاك الله يا فاطمة فهذا قضاء الله وقدره فاصبري وان شاء الله مثواك الجنة يارب العالمين<br />عليك بشراء عسل طبيعي 100% ويفضل عسل السدر وتجعلين أحد الرقاة المعروفين بالدين والصلاح والتقوى وقوة صلته بالله فتجعلينه يرقي ويقرأ على هذا العسل .. بعد ذلك.. تقومين بأخذ ملء ملعقة صغيرة من هذا العسل كل صباحافتشربينه على الريق بدون شرب الماء طبعا وكذلك نفس الطريقة في المساء<br />ويفضل أن لا تتناولي أي شيء بعد أخذك للعسل لمدة 2 ساعتين تقريبا<br />وعليك بشرب ماء زمزم ويفضل تشربينه في الصباح على الريق ولا تتناولي أي شي كل مدة الصباح حتى الظهر.. وتقللين من الأكل في باقي النهار وتجعلين كل اهتمامك على شرب ماء زمزم.. وهناك قصص عجيبة لأناس شفوا من أمراض عديدة من الله تعالى ثم بسبب ماء زمزم ولله الحمد<br />وأسأل الله تعالى لك الشفاء العاجل وأن يعوضك خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134617/http://www.20at.com/article2.php?sid=32"

[[comments]]
