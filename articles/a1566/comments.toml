subject = "salam"
author = "صة حقيقية وقعت في أمريكا لشاب سعودي ملتزم يقول : عندما كان يدرس في إحدى جامعات أمريكا وتعرفون أن التعليم هناك مختلط بين الشباب والفتيات ولا بد من ذلك وكان لا يكلم الفتيات ولا يطلب منهم شيء ولا يلتفت إليهم عند تحدثهم وكان الدكتور يحترم رغبتي هذه ويحاول أن لا يضعني في أي موقف يجعلني احتك بهم أو أكلمهم"
text = "يقول : سارت الأمور على هذا الوضع والى أن وصلنا إلى المرحلة النهائية فجاءني الدكتور وقال لي اعرف واحترم رغبتك في عدم الاختلاط بالفتيات ولاكن هناك شئ لابد منة وعليك التكيف معه الفترة المقبلة وهو بحث التخرج لأنكم ستقسمون إلى مجموعات مختلطة لتكتبوا البحث الخاص بكم وسيكون من ضمن مجموعتكم فتاة أمريكية فلم أجد بدا من الموافقة<br />يقول : استمرت اللقاءات بيننا في الكلية على طاولة واحدة فكنت لا انظر إلى الفتاة وان تكلمت أكلمها بدون النظر إليها و إذا ناولتني أي ورقة آخذها منها كذلك ولا انظر إليها صبرت الفتاة مدة على هذا الوضع وفي يوم هبت وقامت بسبي وسب العرب وأنكم لا تحترمون النساء ولستم حضاريين ومنحطين ولم تدع شيء في القاموس إلا وقالت وتركتها حتى انتهت وهدئت ثورتها ثم قلت لها لو كان عندك قطعة من الألماس الغالية ألا تضعينها في قطعة من المخمل بعناية وحرص ثم تضعينها داخل الخزنة وتحفظينها بعيدتا عن الأعين قالت نعم قال كذلك المرأة عندنا فهي غالية ولا تكشف إلا على زوجها .. هي لزوجها وزوجها لها لا علاقات جنسية قبل الزواج ولا صداقات يحافظ كل طرف على الآخر وهناك حب واحترام بينهم فلا يجوز للمرأة أن تنظر لغير زوجها وكذلك الزوج<br />أما عندكم هنا فأن المرأة مثل سيجارة الحشيش يأخذ منها الإنسان نفس أو نفسين ثم يمررها إلى صديقه وصديقه يمررها إلى الآخر ثم إلى آخر وكذلك حتى تنتهي ثم يرمى بها بين الأرجل وتداس ثم يبحث عن أخرى وهلم جرا بعد النقاش انقطعت عن المجموعة لمدة أسبوع أو اكثر<br />وفي يوم جاءت امرأة متحجبة وجلست في آخر الفصل استغربت لأنه لم تكن معنا طوال الدراسة في الجامعة أي امرأة محجبة وعند انتهاء المادة تحدثت معنا فكانت المفاجئة أنها لم تكن سوى الفتاة الأمريكية والتي كانت من ضمن مجموعتنا والتي تناقشت معي وقالت بأنها تشهد أن لا اله إلا الله وان محمد رسول الله دخلت في الإسلام لأنها وحسب قولها هزتها الكلمات فكانت في الصميم . فلله الحمد والمنة .."
archived = "2006-11-02"
