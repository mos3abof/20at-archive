[[comments]]
order = 3
subject = "تظهر الولايات المتحدة وكأنها خادمة للشيطان واللصوص"
author = "فشلت الأداره الأمريكيه فى العالم:80% من المصريين رفضت الأشتراك فى مسرحية الديموقراطيه"
text = "مشكلة الولايات المتحدة الأساسية هي اعتماد علاقاتها مع الأنظمة بناء على قدرتها في اخماد الصوت المعارض في الداخل، لذلك هي تدعم الأنظمة وتقوي من شوكتها لتهيئة المناخ العام المستقر الذي يمكنها من خلاله الحصول على مصالحها بيسر وسهولة.<br />أثبتت التجربة بأن هذه سياسة خاطئة استمرت في تطبيقها الولايات المتحدة على مدى ستين عاما مضت، وقد ادركت أخيرا هذا الخطأ على لسان وزيرة خارجيتها السيدة كنوناليزا رايس عند زيارتها الأخيرة لمصر. في اعتقادي ان الولايات المتحدة قادرة ومدركة في الوقت الراهن بضرورة انتهاج سياسة مختلفة حتى تتجنب تجاربها المريرة الماضية . .<br />ان بناء علاقة جيدة ومستمرة مع شعوب المنطقة يقتضي عدم دعم النظم المستبدة التي يستأثر عدد محدود من رجالها بثروة ومقدرات الوطن ويوجهونها بما يخدم مصالحهم مما يخلق مشاكل داخلية على المدى الطويل بين السلطات المحلية وشعوبها، وكنتيجة لذلك تصب الشعوب الثائرة والمهضومة جام غضبها على النظم المدعومة من قبل الولايات المتحدة<br />وبذلك تظهر الولايات المتحدة وكأنها خادمة للشيطان واللصوص والحرامية في المسيطرين على الأنظمة المحلية من رجال النظام وخدامه.<br />لو استطاعت الولايات المتحدة تغيير استراتيجيتها في دعم النظم غير القادرة على تحقيق العدالة الإجتماعية عن طريق توجيه المقدرات والثروات الوطنية لتحقيق نمو متوازن تزيد فيه الأعمال وتخفف البطالة ويزيد النشاط الإقتصادي فإنها بذلك ستكون الصديق الصدوق للشعوب المقهورة من سيطرة واستئثار النظم ورجال النظم بثروات الوطن ونهبها.<br />لا بد للولايات المتحدة من اعتماد درجة تحقيق العدالة الإجتماعية كمحدد اساسي يتم من خلالة اقرار دعم نظام معين او فرض ضغوط عليه لتحقيق قدر مقبول من العدالة الإجتماعية يجنب النظام من حصول مشاكل داخلية لديه ينتج عنها قدر تراكمي كبير مع الوقت من الكراهية لداعمي النظام والمتمثل في الولايات المتحدة.<br />وستجد الكثير من الشكر والعرفان كصديق فعلي للشعوب بدلا عن الإكتفاء بصداقة النظم التي تجلب علي مصالح الولايات المتحدة في المنطقة مع الزمن الويلات والأزمات.<br />المسؤولون الأمريكيون يعترفون بفشلهم في مواجهة كاترينا ويجملون صورتهم<br />كشفت وثائق ومراسلات حصلت عليها وكالة 'إسوشيتد برس' أن المسؤولين الفيدراليين الأمريكيين اعترفوا بتقصيرهم وفشلهم في التعامل مع كارثة إعصار كاترينا، إلا إنهم في الوقت ذاته يحاولون تحسين صورة جهود الإغاثة والإنقاذ.<br />وقالت إسوشيتدبرس: إن مذكرة كتبها 'مايكل براون' مدير الوكالة الفيدرالية لإدارة الكوارث اعترف فيها بالتأخير، وقلة مواد الإغاثة، إلا إنه شدد في رسالته التي أرسلها إلى موظفي الوكالة على ضرورة العمل على رسم 'صورة إيجابية' لتعامل الحكومة مع ضحايا إعصار كاترينا.<br />وذكرت إسوشيتدبرس أن براون ذاته أرسل مذكرة إلى وزير الأمن الداخلي الأمريكي مايكل تشرتوف طالبه فيه بأمر وكالات الإطفاء والإنقاذ في الولايات الأخرى غير المتضررة بعدم إرسال الشاحنات أو عمال الطوارئ إلى مناطق الكوارث بدون طلب واضح من الحكومات الرسمية أو المحلية.<br />وفي سياق ذي صلة كشفت شركات الطيران أن الحكومة لم تطلب منها المساعدة في عمليات إخلاء الضحايا لم تأتي إلا عصر يوم الخميس الماضي بعد عدة أيام من وقوع الكارثة."
