[[comments]]
order = 1
subject = ""
author = "عبد الصمد السيد"
posted = "2009-05-04"
text = "فية مواقع كتيرة تتبع قسم التوجية المعنوى لجهة من الجهات<br />وفية مواقع مدفوعة الاجر ومن يمولها اقسام العلاقات العامة<br />وفية مواقع تمولها الاحزاب والمخصصات المالية من السفارات لجماعات الحقوق المدنية<br />واى انسان بقرأ محتوى هذة المواقع بيعرف مين اللى ورائها - وهل هو الصول الامنى او الناشط الحزبى او مندوب السفارة"
archived = "2009-05-31"
capture_url = "https://web.archive.org/web/20090531115026/http://www.20at.com:80/t7kyk/11953-2009-05-04-09-04-50.html"

