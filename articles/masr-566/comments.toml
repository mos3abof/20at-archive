text = "والله هوة اسم مش علي مسمه<br />لا هوة شيخ ولا هوة صالح لحاجه(مابيعرفش يعني00000ههههه)ولاهوة كامل لان الكمال لله<br />والكلب لما يهوهو ماحدش بيرد عليه<br />وبلاااااش نتحمق اوي عشاااان دى سرقه من واحد حرامي ومبروم علي مبروم مايلفش<br />اما كلام المعفن بتاع ال artفانصه كدب وافتراء وتهجم علي اللي ساعدوه في بدايه حياته وهو المستفيد الاكبر من الاحتكار<br />مش هانسيبك يااااااااا مبارك ولا اللي معاكمن الحراميه<br />ان انت اكرمت اللئيم تمردا000000!!!!!"
