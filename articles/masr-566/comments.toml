order = 0
subject = "شعب طيب"
author = "شيرين عبد الحميد"
posted = "2006-06-25"
text = "شعبنا شعب طيب و تعودنا منذ صغرنا على ان من يشتمنا لا نرد عليه و نقول له الله يسامحك عشات ناخد حسنات و ندخل الجنة و ناس تانية تقول يعنى هى الشتيمة بتلزق المهم اننا بنتفرج و واللى يشتم يشتم و ناس تالتة تقول طب ده مش مصرى و يمكن يكون عنده حق طب اللى قال طز فى مصر يتعمل فيه ايه"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200104/http://masr.20at.com:80/article.php?sid=566"

[[comments]]
order = 1
subject = "الــــلـــــه يــــــــرحــــــم"
author = "صالح كامل اللى مش عارف مين اللى اداه لقب الشيخ بيشتم المصريين"
posted = "2006-06-25"
text = "ده لو كان له اب و لا جد يعرفه غير الريال و الدولار ياريت يسأله عن التكيات المصريه اللى كانت فى كل حته فى بلده و البلاد اللى جنبها و كانت بتوزع عليهم الاكل و الملابس وياريت يسأله بالمره عن سر التانيه اللى بيعملوها فى كم الجلاليب ومفكرينها موضه وكانت فى الاصل علشان لما توزعها التكيه المصريه عليهم كان ممكن اللى ياخدها طويل فيفك التانيه علشان تناسبه ولا كسوه الكعبه اللى كانت مصر بتبعتها<br />دلوقت ابن الشحاتين جاى يشتم اصحاب الفضل عليهم( بس للاسف فيما مضى)<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأأأأه يـــــا بــــــلـــــدى"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200104/http://masr.20at.com:80/article.php?sid=566"

