[[comments]]
order = 4
subject = "الحق مش عليه"
author = "ابو شريف"
posted = "2006-06-26"
text = "أنا لا الوم الشيخ صالح كامل علي مايفعلهمن تشفير فالراجل مليونير واخذ لقب الشيخ من ماله وليس من علمه ... أما وصفه للذي يقوم بتمديد الوصلات بأنه حرامي فهو محق في ذلك وتعالوا نحسبها بالعقل بدون لغة العواطف اللي مدمرانا لو أي بائع جرائد قام بإتاحة الفرصة لسكان منطقته بقراءة الجريدة ثم اخر اليوم ردها مرة اخري لدار النشر علي اساس انها مرتجعة هل ستقبل دار النشر ذلك وتقول عن بائع الصحف انه ناشر للثقافة في منطقته ام ساعتها سيكون مساءل امام القانون ... الحق حق ياناس ... لكن من الممكن علي الشعب المصري ان يفعل شئ اخر هو عدم شراء اجهزة خاصة به او عدم شراء كروت خاصة بقنواته المشفره ، ياعالم ياهو القناة تبث من مصر والعاملين بها مصريين والشركة المصنعة للديكودر مصرية والعاملين بها مصريين لماذا نترك ذلك كله ونشتم في تاجر لايهمه سوي الربح والخسارة فقط لاغير ، قاطعوا ايه ار تي ايه المشكله مش ح نموت لكنه سيفكر الف مرة في المصريين وفي صالحهم ... وبالنسبة للحديث الشريف فأعتقد ان الاحتكار الذي نهى عنه رسول الله صلي الله عليه وسلم هو احتكار شئ مفيد للناس وبدونه سيتضرر الانسان سواء مأكل او مشرب أو ملبس او دواء لكن احتكار كأس العالم اعتقد انه اساسا لهو والمال الذي يدفع فيه حرام وعلي فكرة انا واحد من الناس قاطعت كاس العالم بسببه ولازلت احيا ولم امت بعد والاهلي قاطع بطولته ولازال اكبر نادي في الشرق الأوسط .... فنجعل ردنا علي سبابه ليس بالسباب بل بالمقاطعة"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200104/http://masr.20at.com:80/article.php?sid=566"

