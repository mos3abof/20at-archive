[[comments]]
order = 7
subject = "نستاهل ضرب الجزم"
author = "ortiga"
posted = "2006-06-26"
text = "انتوا مستغربين ليه.احنا شعب مالناش لا صاحب ولا كبير.كل من هب ودب عنده الجراءة الى تخليه يضربنا بالجزم ويقدرنا بما هو اتفه القيم.احنا بلا قيمة احنا ولا حاج .<br />احنا رمم بدل مبنهونش على حد .<br />منزلة الكلاب فى بلاد الكفار لو كانوا كفار ليهم قيمة عننا.<br />احنا الى عملنا فى نفسنا كده شعب كل واحد فيه بكره الى جنبه بيكرع الى بياكل معاه عيش وملح فى طبق واحد.<br />احنا عندنا ناس بتكره نفسها...احنا شعب بيكفر بعضه ......واحنا كلنا كفار..<br />صدقونى والله العظيم والله العظيم احنا عالة على الكون"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200104/http://masr.20at.com:80/article.php?sid=566"

[[comments]]
order = 8
subject = "ربنا معانا"
author = "اردني عاشق لأرض الكنانة"
posted = "2006-06-26"
text = "الى الأخوة في مصر المشكلة ليست عندكم فقط عندنا في الأردن نفس الشء اشتراك الart 200 دينار اردني يعني 1625 جنيه لذلك اوجه رسالة الى الأخ صالح كامل اتقي الله .العالم العربي هو الوحيد الذي يشاهد المونديال عبر قناة واحدة فقط و حتى 2014 الكاميرون العدمانة تستطيع ان تشاهد المونديال عبر 4 قنوات يعني الأحتكار ماركة عربية مسجلة !!! نقول ايه يا صالح يا كامل حسبي الله و نعم الوكيل فيك و في قناتك"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200104/http://masr.20at.com:80/article.php?sid=566"

[[comments]]
order = 9
subject = "حرام ايه وحلال ايه يا شيخ الهشك بشك انت!!!"
author = "TeGo"
posted = "2006-06-26"
text = "ايه هو اللى حرام وحلال اللى بيقؤله ده<br />طيب لو الوصله حرام ، واللى بيعرضه فى باقى القنوات من افلام فيها نحلال خلقى ( اعتقد مفيش فيلم مفيهوش بوسه على الاقل ) والاغانى وغيره وغيره<br />هو ده بقى اللى حلال يا عم الحج !!!!<br />انا بقؤل لو مش عاجبه الشعب المصرى ممكن يبث قنواته على قمر تانى غير النيل سات او يمنع البث لينا من اساسه عشان احنا مش قد المقام !!!!<br />روح نام على جنب وسيب الشعب المصرى فى حاله<br />ولو عايز بجد تنفذ الحلال والحرام راجع قنواتك كلها واللى بتعرضه من برامج ورقص وبعد كده تعالى اتكلم عن الحلال والحرام"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200104/http://masr.20at.com:80/article.php?sid=566"

