[[comments]]
order = 12
subject = "الحقيقه متزعلش"
author = "yahkk"
posted = "2006-06-27"
text = "انتو زعلنين ليه ان الراجل ده شتمنا محنا فعلا نستاهل اكتر من كده لاننا شعب جتته نحست واخد على الذل بقينا شعب لو حد عاملنا بحترام نركبه والى يدينا بالجزمه ويشتمنا نخاف منه والدليل على كده لو ركبت الاتوبيس وجيت تعدى من ورا واحد وقلت له بعد ازنك ممكن تعدينى تلقيه شخر ونخر وهاتك يشتمه وهتعدى ازاى كأنك لما تعدى من وراه هتعمله حاجه وحشه لكن لو اديته كوع وسبقت انت بالشخر تلقيه وسعلك ومفتحش بقه احنا فعلا لو شعب بيفهم كنا خلينا صالح منغير شيخ يحترمنا ويعمل لنا الف حساب فاكرين لما شركات المحمول فى مصر جت تتلبون علينا وترفع الاشتركات الناس كلها سابت المحمول وكانت هتبيعه خلت الشركات ترجع زى الجزمه الاديمه وترخص فى الاشتراكات احنا اكبر تعداد سكانى فى المنطقه لو قاطعناالartهنخلى الراجل ده يبوس جزمتنا علشان نرضى عنه بس للاسف احنا شعب سلبى"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628200104/http://masr.20at.com:80/article.php?sid=566"

