[[comments]]
order = 1
subject = "فريق الأحلام"
author = "ابو شريف"
posted = "2006-06-10"
text = "يمتاز الجمهور الزملكاوي بأنه علي درجة عالية جدا من النسيان ... فاكرين أيام فريق الأحلام وبرضه اخذ المركز الثاني لدرجة أن الكابتن احمد الكأس رفض اللعب للزمالك ورجع للأولمبي في الدرجة الثانية بعد مادخل النار برجليه ... وعلي الرغم من تقديري لعمرو زكي كلاعب هداف إلا أنني اشفق عليه من دخوله عش الدبابير وهو الذي كان في إنبي حيث الإدارة المحترمه التي كان كل فرد فيها يعرف حقوقه وواجباته إلا أنه ذهب الي سوق عكاظ حيث يتولي فرد واحد فقط توجيه اللاعبين ورسم الخطة ووضع التشكيل والتفاوض مع اللاعبين والشتيمة في التليفزيون والراديو والجرائد ( وربنا يستر ومايكونش ليا ملف معاه ) وبكره فعلا يشعر بالندم وعلي العموم الأهلي محتاج الي منافسين اقوياء لنشعر بالمتعة وبحلاوة النصر عليهم<br />وسلمولي علي حسن سبانخ"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233214/http://masr.20at.com:80/article.php?sid=482"

