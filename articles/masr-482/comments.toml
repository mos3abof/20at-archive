text = "حضري مين اللي قال عايز اروح الزمالك هو احنا هنكذب كمان ولا ايه ، الحضري واحمد السيد وجيلبرتو شرف ليهم انهم يكونوا في الاهلي ومش بعد كل دة ممكن حد فيهم يفكر ولو لمجرد لحظة انو يروح الزمالك والا بقى يبقى .... ارحموا عزيز قوم ذل ..."
