subject = "يا عينى عليك يا زمالك"
author = "داليا"
posted = "2006-06-12"
text = "قال ايه عمرو راح الزمالك يا حلاوة يا ولاد طيب طظ فى عمرو ده ابو تريكه بعشرة زيه ده كفايه متعب بس يخوفه وعلى رأى المثل عمرو زكى اشترى كيكه لقى فيها ابو تريكة ومبروك السجن لمرتضى منصور وعبال 100سنة هناك يا رب... ده محمد بركات بس يستاهل الدهب و10000000000000جنية مش عمرو زكى وروح فى 200 داهيه يا عمرو بالزمالك بتاعك ان شاء الله تولعوا بجاز و الزمالك مفلس ياعم عمرو هياكل عليك فلوسك"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233214/http://masr.20at.com:80/article.php?sid=482"

