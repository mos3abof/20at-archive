[[comments]]
order = 19
subject = "مين عمرو زكى ده"
author = "بنت اهلويه"
posted = "2006-07-22"
text = "مين عمر زكى ده حيوان ما عندوش عقل حد يسب الاهلى نادى القرن ويروح للنادى الزمالك المتخلف ان نادى الزمالك مايعرفش غير الهزائم انا مش عرفه ايه الهبل ده الاهلى يازملكويه يلى ما يعرفوش حاجه عن الكره الاهلى ده مدرسه فن ولعب وهندسه وفى النهايه طظ فى لعيبة الزمالك انا اول مره اعرف انى حد بخروج فرحان انه خسر 3\\0 وكمان بيقول الحمد لله لن احنا خسرنا 3\\0 بس بازمه ده كش هبل طظ فى عمرو زكى مين يعنى ده مايجيش حاجه جنب متعب ولا ابو تريكه"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183122/http://masr.20at.com:80/article.php?sid=482&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 20
subject = "ما يهمكيش يا بنت الاهلى"
author = "سمية الزملكاوية/ عدوة الحمير"
posted = "2006-07-24"
text = "خلاص يا ستى ولا يهمك ولازم تعرفى برده ذى ما انتى بنت الاهلى انا كمان بنت الزمالك<br />وذى ما انتى ما بتحبيش حد يتكلم عن الاهلى بطريقة مستفزة انتى كمان ما تكلميش على الزمالك بالطريقة دى وكفاية الا احنا فيه احنا عاوزين حد يواسينا مش يعمل فينا كده والاهلاوى قبل الزملكاوى<br />وبعدين مهما كان الزمالك والاهلى فرقتين مصريين ولازم يحبوا بعض واذا كانت رسالتى الاولى كانت بطريقة مستفزة شوية فأنا اسفة جدا ويا ستى ما تزعليش منى<br />بس ارجوكى راعى شعورى وشعور كل الزملكاوية الا مثلى كده تماما<br />ونحن كاهلاوية وزملكاوية شعارنا واحد هو (( الروح الرياضية ))<br />ها بقى يا ستى اتفقنا واريد ان الكلام ده<br />يحصل مع كل الاهلاوية والزملكاوية"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183122/http://masr.20at.com:80/article.php?sid=482&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

