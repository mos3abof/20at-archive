text = "عمرو مين دة اللي عاملين عليه الهوجة دي كلها . قال يعني بيلعب كويس طب دة محمد عبد الوهاب بتاع الاهلي احسن منه 1000000 مرة . اشرب يا زمالك بالسم الهاري .... اقصد بالهنا والشفا ."
