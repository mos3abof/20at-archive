[[comments]]
order = 15
subject = "الله يخرب بيتكم"
author = "سمية الزملكاوية"
posted = "2006-07-10"
text = "اولا احب اعرف البهايم الاهلاوية ان الاهلى ده فريق محلى ولو لعب بره هيتكشف على حقيقته ذى ما قال الاخ قبل كده<br />اما الزمالك<br />هو ده الفريق قاهر الاجانب<br />ومبروك عليك يا عمرو الفانلة البضاء<br />ومين متعب ده الحمار الا ييجى حاجة جنب عمرو ذكى<br />انا ممكن اقول ابو تريكه اه لانه فعلا واد اخلاق بجد<br />وبعدين انا هقول ايه اكتر من كده ده الرد على البهايم العلوج حرام"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183122/http://masr.20at.com:80/article.php?sid=482&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 16
subject = "فرحنين بالخيبة"
author = "نادية"
posted = "2006-07-12"
text = "قال ايه الزملكاوية فرحانين بالهازيم<br />والهزيمة من الاهلى باقل الاهداف فوز بالنسبة لهم وقال ايه فرحانين بعمرو زكى<br />طيب بزمتكم فى مقارنة بين عمرو ومتعب ذى ما فى مقارنة بين حمهور الاهلى وجمهور الزمالك<br />وباهديلكو اغنية الزمالك رجله بتوجعه.. وملقاش حد يشجعه"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183122/http://masr.20at.com:80/article.php?sid=482&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 17
subject = "هى العلوج طلعلها صوت ولا ايه"
author = "سمية الزملكاوية/ عدوة الحمير"
posted = "2006-07-12"
text = "هى مين دى الا بتتكلم<br />هما العلوج طلعلهم صوت ولا ايه وبقيوا بيعرفوا يتكلموا<br />يلا افرحلكو شوية يا بهايم قبل ما......<br />وبعدين لما انتى يا انسة بتقولى ان الزمالك بيفرح بهزايمه من الاهلى يبقى الاهلى يعمل ايه يحب على جزمة الزمالك ويبوس التراب الا بيمشوا عليه<br />وعلى العموم انا كمان بهديلك اغنية<br />وعاوزة اقولك حاجة تانى كمان<br />مين ده الا ملقاش حد يشجعه<br />الزمالك برده<br />الزمالك ملك الكورة المصرية والعالمية<br />اه ، وانتى بتولى كمان مين ده عمرو زكى الا ما يجيش حاجة جنب عماد زفت متعب<br />ده عماد متعب الحمار لو طال يشيل الشنطة لعمرو زكى كان عملها<br />وانا كمان بهديلك اغنيه<br />علشان توصليها للبهايم الحمر<br />(( عصام قلبه بيوجع .. مش لاقى حد يدلعه<br />عصام بيقول الاه . اه اه اه<br />مش لاقى الدفاع معاه اه اه اه<br />يا عصام يا حارس الاهلى اوعى الزمالك يضيعكوا ))"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183122/http://masr.20at.com:80/article.php?sid=482&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
