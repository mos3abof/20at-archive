posted = "2006-06-18"
text = "ربنا يرحم الاهلي والزمالك اتفرجوا على كاس العالم وانتوا تعرفوا اللى احنا بنلعبوا دة مش كورة وسياسة الكورة في مصر دلوقتى هي ان الاهلي معاه فلوس وبيخطف اللعيبة بتاعت مصر كلها علشان محدش ينافسه والزمالك مليان مشاكل والكل بيدبح في بعضه علشان المصلة مش علشان خاطر النادي بذمتكم دي كورة ربنا يهديكم"
