text = "مبروك يا زمالك طلع رؤوف جاسر مفلس مش عارف يجيب لعيب بمليون جنينه الي هو عمر الصفتي وعمر زكي عاد الي روسيا اذا عاوزين تتاكدو ادخلو على زمالك tv اشرب يا ابيض ابو خطين حمر ههههههههههههههههههههههههههههههههههههههه"
