posted = "2006-07-12"
text = "موسوعه الحكومه حتعملها واحده ست من امثال المناضله اعتماد خورشيد.ولو ان لغزاره الماده العلميه التى ستكون متاحه لكتابتها.سيتولى كتابه الموسوعات عن عهد مبارك فقط كتيبه من النساء اصحاب القدرات الخاصه(على رأسهم هيفاء).نفسى صاحبنا يكنكن بقى عاوز اقرأفضايحهم.يارب يا تاخده ياتاخده"
