text = "نحن مصريون ضد التوريث والإخوان معا . منذ تصريح نائب المرشد والذى هو فى حقيقته رسالة للنظام بمباركة التوريث قررنا أن نرسل رسالتنا للجميع ، لقد تم التوريث فعلا بمباركة الإخوان !!! لك الله يا مصر ، وليعلم نائب المرشد أنه كان واجب عليه بدلا من إتهام الشعب بالسلبية كان عليه إثارة الشعب للوقوف ضد التوريث"
