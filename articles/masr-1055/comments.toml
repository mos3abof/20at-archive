order = 0
subject = "روضه عبد الحميد"
author = "انا حضرت حفل افطار الاخوان"
posted = "2006-10-16"
text = "وبصراحة الكلام المكتوب اقل من انى ارد عليه اصلا<br />لان الاخوان اولا مبيشحتوش من حد؛دول بينفقوا من جيوب الاخوان؛الحاجة التانيه\"بتوع ربنا\"دول من قال لك انهم لم ينتفقوا على شنط رمضان؟؛وهل لابد ان ينفقوا اجمالى الدخل بنسبه100%؛ثم ان الجماعه الغت افطار العامالقبل الماضى لتتبرع بثمنه لفلسطين رغم اهميه هذا الافطار اعلاميا وسياسيا؛وميصحش تقول على عزيز صدقى بيلهث وراء الاخوانّّّ!!! طب حدد مكسبه ايه؟هيدوله رئاسه وزارة!!!.<br />اتق الله<br />واتقوا الله اهل روز اليوسف"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105055730/http://masr.20at.com:80/article.php?sid=1055"

[[comments]]
order = 1
subject = "ماذا تعرف عن دور المساجد وانت لاترتادها"
author = "ايمن امام"
posted = "2006-10-16"
text = "الناس دى حالفه فى الكنيست انها تفطرنا - مش عارف هما عاوزين ايه بالظبط مننا - يعنى يشجع عبد الناصر فى خطبه الازهر ويمنع غيره - طيب يافالح قولى ازاى تتواصل قوى المعارضه مع الشعب هل من خلال روز اليوسف ام من خلال الميريديان ام من خلال الحزب الوطنى - وانتم اغلقتم كل الابواب على كل من يريد ان يعبر عن رأيه سمحتم فقط لصحف البورنو ان تنتشر وصادرتم كل الاقلام الشريفه - وهذا دليل افلاس فكرى منكم فلو كنتم تملكون الحجه لما لجأتم الى استعراض القوه - ثم قل لى ايها الجهبز هل سيسرى هذا القانون على الكنائس ايضا - ام ان ذلك خط احمر - وساعتها سنجد التفسيرات الجاهزه - هل تستطيع ان تمنع الرهبان من التحريض العلتى للمسيحيين - على التظاهر لان مسيحيه اشهرت اسلامها - حتى يجبركم على تسليمها وايداعها احدى الكنائس - هل تستطيع ايها الجهبز ان تعلق على ما يدرس فى مدارس الاحاد ولها مطبوعات شبه دوريه ولاتصدر بأى ترخيص وليس لها جهات رقابه - ارى انكم تدعون انكم القائمين على مصلحه هذا البلد وقد نصبتم انفسكم اوصياء علينا تتحدثون بلساننا وهو منكم براء من انتم وما هى صفتكم ومن اعطاكم التفويض لتتحدثوا بأسمنا - هل تستطيع ان تزعم انكم منتخبين تتحدثون بأسم الشعب - هل تستطيع ان تزعم انكم الصفوه المثقفه التى تتحدث بأسم الشعب وما دون ذلك فهو جاهل لايستطيع ان يعى مصالح الشعب - اذا كنت تدعى ذلك حقيقه - فما هى انجازاتكم فى خلال 25 عاما - لاترى الاتدمير متعمد وتخريب للاقتصاد وعوده الى الطبقيه وهذه المره سلمتم مفاتيح البلاد للاقباط واليهود ومن على شاكلتهم -مالك ومال الاخوان المسلمين - وان كنت معك فى ان حفل الافطار كان يجب ان توجه نفقاته للمحتاجين ولكن الا تستطيع ان توجه هذه النصيحه لاسيلدك الذيمين نصبوك متحثا بأسمهم - هل تستطيع<br />اقرأ بقية التعليق .."
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105055730/http://masr.20at.com:80/article.php?sid=1055"

