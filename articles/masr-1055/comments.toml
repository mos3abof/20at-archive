text = "وأذكر أن جريدته ومجلته رمز من رموز النفاق ، وإلا لماذا لم يطلق البيه كرملة مبادرته عندما كانت المظاهرات يقودها شيخ الأزهر نفسه من داخل المسجد ، أو عندما كانت وزارة الأوقاف تستغل المساجد للدعاية الانتخابية؟<br />هو بس استنى لغاية ما مظاهرات العدوان على لبنان خلصت ، واتكلم ، ودة أكبر دليل على إنه خايف منهم وبيرجع يهاجمهم بعد كدة.."
