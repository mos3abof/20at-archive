order = 2
subject = "لا وانت الصادق .. يا كرملة"
author = "قلم جاف"
posted = "2006-10-18"
text = "المظاهرات في المساجد خطأ سواء من عمر مكرم أو عمر أفندي يا كرملة..<br />وأعتقد أن مجلتك وصفيحتك التي وضعت يدها في يد تجار الدين الصوفيين الذين سميتهم اسلاما مستنيراً يواجه التطرف ، ومن أكثر من استغل المساجد للبيزنس السياسي والشو الديني على مدار التاريخ الإسلامي كله هي آخر من يتكلم.. خلي عندك شوية أحمر يا كرملة!"
archived = "2006-11-05"
capture_url = "https://web.archive.org/web/20061105055730/http://masr.20at.com:80/article.php?sid=1055"

