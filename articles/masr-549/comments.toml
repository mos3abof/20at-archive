[[comments]]
order = 9
subject = "اما يا مصر صحيح غلبانة"
author = "محمد حلمي"
posted = "2006-06-22"
text = "انتو عارفين عجبني هذا الشعر اوي<br />ودة منقول من الوعي المصري<br />أما يا مصر صحيح غلبانة<br />يوم تتعشي وعشرة جعانة<br />وبتتغطي بناس بتوطّي<br />لما غرقتي في بحر خيانة<br />أما يا مصر صحيح غلبانة<br />أما يامصر عليكي حكومة .. غش ف غش<br />بتبدل في اليوم الواحد .. مليون وش<br />وبتستعبد ...شعبك تجلد<br />قهر وذل وخوف واهانة<br />أما يا مصر صحيح غلبانة<br />أما يا مصر عليكي رئيس.. مش متأخر<br />ان يسيب في كلابه تهيص ..وهو يشخر<br />لما الخير في ايديكي اتبخر<br />راح امريكا خدله اعانة<br />أما يا مصر صحيح غلبانة<br />لسه يا مصروشعبك ساكت...كاتم غلبه<br />امتى يا مصر ح يفهم ان بحقه يطالبه<br />خايف لاحسن نومه يغالبه<br />يصحى يلاقي الناس عريانة<br />اصحي يا مصر الناس نيمانة"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622151041/http://masr.20at.com:80/article.php?sid=549"

