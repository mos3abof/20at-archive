[[comments]]
order = 20
subject = "أحسن لقب للحلوف الواطي زي سوزي مابتقول"
author = "بياع الكوسة"
posted = "2006-06-26"
text = "الواد هانيبال ده يستاهل الإسم اللي بيطلقه على نفسه، بالمناسبة دة إسم قائد من أصل عربي شمال أفريقي (للحنبلية قوي) تولى على الإمبراطورية الرومانية، وما أدراك ما هي.<br />رأس الجسر أو القوس معروف في التكتيكات والتشكيلات الحربية ومن قبل هانيبال، هو عمل إيه إستنى لما الأعداء قربوا وراح قلب القوس بحيث أصبح شبه دائرة تحيط بيهم، ليه؟ لأنه أراد أن يتيح لمن يريد الهرب منهم والهزيمة فرصة الإفلات، لأن المقابل لو الواحد عارف إنه ميت ميت يقاتل زي ألف، مش كده ياهاني؟ فاهم قصدي؟<br />أحسن لقب للحلوف مبارك هو اللي بتناديه بيه أنثاه سوزي حلوفة، وهو الواطي، وده مش من عندي، وسوزي أعرف بحلوفها منكم.<br />وكلمة الواطي بتجمع كل الخصال اللي بتوصفها يا سيد هانيبال.<br />بلد تعداد سكانها 70مليون وعليها ديون تزيد عن700 مليار دولار، يعني بحسبة بسيطة كل واحد منا كلف الدولة أقله مليون، عايزين هنا أكثر من كده؟ ربنا يجعله عامر."
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626151149/http://masr.20at.com:80/article.php?sid=549"

