[[comments]]
order = 15
subject = "هانيبال دكر وكسم مبارك"
author = "هانيبال"
posted = "2006-06-24"
text = "بصراحة والصراحة راحة يعني على بياض والطيب احسن مش كده برضه ؟؟<br />الناس في مصر ماتت من زمااااااااااان .. زمان اوي .. زمان خالص .. من ييجي 3000 سنة كده .. حد يقدر يقولي ليه المصريين جابو واحد اسمه محمد على عشان يحكمهم ؟؟<br />تقدرو تقولولي الثورة اللي حصلت في مصر ايام السادات قامت ليه اساسا ؟؟ تقدرو تقولولي ليه رغيف العيش هو السلعة الوحيدة اللي سعرها زي ماهو من سنة 1981 ؟؟<br />تقدرو تقولولي ايه السر في ان مبارك الكافر حط واحد يهودي اقرع على اهم وزارة في مصر (اللي هي وزارة الزراعة) ؟؟<br />طيب بلاش ده كله ..<br />حد يقدر يقولي جمال مبارك موجود على الساحة السياسية بيعمل ايه اساسا ؟؟ وكذلك سوزي شرشر بتعمل ايه وباي صفة ؟؟<br />والقضاة ليه حطو ايدهم في ايد الكلب الجربان صفوت الشريف ؟؟<br />رغم انهم عارفين كويس ان العصابة بترقدلهم على خازوق محترم من اللي قلبك يحبه!!<br />ولوالقضاة مش عارفين تبقى مصيبة .. يا رجالة مفيش رجالة في مصر .. يا رجالة الثورة هي الحل الوحيد ومفيش حل تاني ولا بديل تاني واللي يقول غير كده يبقى حاجة من اتنين .. عارفين ايه هما ؟؟<br />اي كاتب يقول غير كده يبقى لا مؤاخذة ..<br />هي كلمة هاقولها واعصبوها براسي ( صفوت الشريف هو اخطر افراد العصابة وهو اللي سايق المركب وهو اللي كان سبب في وجود مبارك على الكرسي لمدة ربع قرن وهو اللي هايساعد جمال في الوصول للكرسي زي بشار الاسد قصدي بشار الخول )<br />واللي مش مصدق يبقى حاجة من اتنين عارفين ايه هما ؟؟<br />.. واللي عندو كلام تاني يقولو وتصبحو على خير<br />عمكم هانيبال"
