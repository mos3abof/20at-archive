subject = "إيه"
author = "إيه الإسم المناسب لخائن ... باع أملاك مصر من مصانع وشركات وشرد العمالة... ونشر البطالة ...ونهب خير مصر كله لحسابه... وإللى باع بترول مصر لأمريكا لمدة عشرين سنة لقدام بنصف الثمن... وإللى فاتح خط غاز طبيعى لإسرائيل تحت تصرفها... وإللى بيضرب شعبه بالأحذية لما بيتكلموا أو بيعترضوا... وإللى نصف شعبه فى المعتقلات...وإللى رهن قناة السويس أهم مصادر الدخل المصرى لأمريكا قناة السويس إللى المصريين ماتوا علشان يحفروها هى دى من حقه التصرف فيها أو يرهنها وإيه مقابل الرهن ده هل ليورث الحكم للمتخلف المجنون المدمن الشاذ إبنه... ياترى إيه اللقب المناسب إللى يتقال للخائن ده أعتقد إن كل ألفاظ الخيانة مش ها توفى حقه فى الخيانة"
