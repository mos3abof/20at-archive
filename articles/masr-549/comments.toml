[[comments]]
order = 11
subject = "مبارك كلب ابن شرموطة كافر"
author = "هانبيال"
posted = "2006-06-22"
text = "مفيش اي حل غير الثورة الشعبية واعدام العصابة بالكامل وعلى راسها ابن المتناكة حسني مبارك .. وانا رايي ان الجماعة اللي بيكتبو مقالات يبطلو فلسفة وفذلكة ويخليهم اشجع من كده شوية ويجيبو من الاخر ويقولو مفيش حل غير الثورة .. وجمال مبارك بيحضر نفسه للرئاسة بشكل رسمي واللي يقول غير كده يبقى منافق حقير او حمار مش بيفهم ..<br />اخر الانباء ..<br />جمال مبارك واحمد عز بينيكو بعض ودي ومن نتائج ذلك اطلاق يد احمد عز لجمع اي فلوس وباي ترتيب وكسم اي حد ..<br />يعني اذا كان رب البيت بالدف ضارب فشيمة اهله الرقص فانا انصح المصريين من الان بان يدربو ابنائهم الذكور على انهم يتناكو لان الاجيال اللي جاية ممكن يكون رئيسهم جمال الخول .. والبلد كلها هاتبقى خولات بجد .."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623144531/http://masr.20at.com:80/article.php?sid=549"

[[comments]]
order = 12
subject = "كل شيء مطروح وممكن"
author = "شيخونكو"
posted = "2006-06-22"
text = "بداية ... الأخ هنيبال .. كلامك منطقى بالنسبة لثورة شعبية لكنها محتاجة زمن وققت .. وملوش لازمة ابدا استخدام العبارات القذرة اللي لجئت اليها دي لتعبر عن رأيك .. دماغك نضيفة خللي لسانك نضيف (مع انه بيني وبينك يستاهل يتقال فيه كده)<br />المهم .. فيه بدائل تانية .. تدعيم الاخوان المسلمين ، المعارضة ، نشر فضائح المسئولين بأي طريقة لأن المشكلة الاساسية ان غالبية الناس ميعرفوش حاجة ومطحونين ليل نهار في الجري ورا لقمة العيش والدروس الخصوصية ومسلسل اخر اليوم وتيجي تقول لحد تسمع عن مظاهرة كذا ؟؟ يقولك مظاهرة ايه ؟؟!!! طيب فلان اعتقلوه ؟؟ هما مين دوول ؟!! من الخر توعية الناس لو هايز فعلا تعمل تحرك شعبي .... مصري وطني مخلص ..."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623144531/http://masr.20at.com:80/article.php?sid=549"

[[comments]]
order = 13
subject = "نظرية هانيبال في النيك المبارك"
author = "هانيبال"
posted = "2006-06-23"
text = "بصراحة والصراحة راحة يعني على بياض والطيب احسن مش كده برضه ؟؟<br />الناس في مصر ماتت من زمااااااااااان .. زمان اوي .. زمان خالص خالص .. والبركة طبعا في الحكام اللي ربنا جعل جزمتهم فوق رقبة اهل البلد .. حد يقدر يقولي ليه المصريين جابو واحد اسمه محمد على عشان يحكمهم لما الفرصة رجعت ليهم واصبحو هم اصحاب القرار ؟؟<br />تقدرو تقولولي الثورة اللي حصلت في مصر ايام السادات كان اهم اسبابها ايه ؟؟ تقدرو تقولولي ليه رغيف العيش هو السلعة الوحيدة اللي سعرها زي ماهو من سنة 1981 ؟؟<br />تقدرو تقولولي ايه السر في ان مبارك النجس عين واحد يهودي على اهم وزارة في مصر اللي هي وزارة الزراعة ؟؟<br />طيب بلاش ده كله ..<br />حد يقدر يقولي جمال مبارك موجود على الساحة السياسية بيعمل ايه اساسا ؟؟<br />والقضاة اللي امل 70 مليون نفر ليه حطو ايدهم في ايد الكلب الجربان صفوت الشريف ؟؟<br />رغم انهم عارفين كويس ان العصابة بترقدلهم على خازوق محترم من قلبك يحبه<br />ولو مش عارفين تبقى مصيبة .. يا رجالة مفيش رجالة في مصر .. يا رجالة الثورة هي الحل الوحيد ومفيش حل تاني ولا بديل تاني واللي يقول غير كده يبقى ايه ؟؟<br />اي كاتب يقول غير كده يبقى لا مؤاخذة ..<br />وعلى فكرة واعصبوها براسي ( صفوت الشريف هو اخطر افراد العصابة وهو اللي سايق المركب وهو اللي كان سبب في وجود مبارك على الكرسي لحد الان .. واللي عندو كلام تاني يقولو وتصبحو على خير"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170131/http://masr.20at.com:80/article.php?sid=549"

