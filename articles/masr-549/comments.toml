[[comments]]
order = 4
subject = "بمناسبة الشعراوي"
author = "مصري مدحور"
posted = "2006-06-21"
text = "أعجبني جدا المقال, ولست ممن يؤيدون تكميم افواه المخالفين أو مصادرة آرائهم, فالشعراوي قد مات وحسابه على ربه ليس علي أو عليك أو أي أحد آخر, ولكني سمعت الشعراوي يقول أنه سجد شكرا لله على هزيمة يونيو النكرا, ولكن الرجل لم يكن غبيا لدرجة ابداء خيانته للوطن كما تظن, بل هناك مبدأ أصيل في الدين بأن الضرر الأخف أفضل من ضرر كبير محقق, وبه فسر الكثيرون سر هزيمة المسلمين وفيهم رسول الله (ص) يوم أحد, فقالوا أن يهزم المسلون بعد مخالفة أمر النبي (ص) أفضل من أن ينتصروا وقد خالفوه, لأنهم لو انتصروا لما بقيت للرسول هيبة ولا احترام, وأن تصدمنا هزيمة تجعلنا نرجع عن تيارات الحادية خير من أن ننتصر ونندفع بقوة في هذا الطريق"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141615/http://masr.20at.com:80/article.php?sid=549"

