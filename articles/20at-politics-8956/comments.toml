author = "الطحاوي"
posted = "2008-05-04"
text = "نحن بصدد شيرين .. كاتبة مجتهدة فكرة ولقطة .يد تحمل القلم واخرى تشيل الكاميرا اللي في الشنطة الحريمي ذات المائة جنيها . كاتبة وصحفية شابة من شبرا كان الخلاص والصجافة .هي مقلة جدا .لكنها عندما تنوي تكتب تكون قد قررت اعطاء كل الكتاب اجازة مفتوحة .شيرين مديرة ديمقراطية تحثوا التراب والحبر في وجه المنافقين .وشيرين هي اسبرين الصحافة الشابة تداوي راس من يشكو الصداع .مش عارف اقول ايه ولا ايه بس انا اقترح تعليق هذه المقالة في نقابة الصحفيين .أو يضعها هيكل مقدمة لاحد كتبه ،أو تكون سيمنار مناقشة لاقسام الاعلام بجامعات العالم .<br />على العموم ده كلام مباشر من شخص دوغري لسه شاتم تامنافقين في مقالة"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105221440/http://20at.com/20at/politics/8956-2009-12-28-15-38-49.html"

