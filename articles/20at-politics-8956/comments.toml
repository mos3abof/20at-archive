text = "للهروب من وجع القلب دا كله خدى المترو يا بنتى وريحي بالك<br />بهدلة ببهدلة<br />بلا اشارات بلا زحمة وبلا وجع قلب<br />حد يتحشر الحشرة السودة دى برضة كل يوم<br />دى حاجة تجيب الضغط يا بنتى وانتى لسة صغيرة صحتك"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105221440/http://20at.com/20at/politics/8956-2009-12-28-15-38-49.html"

[[comments]]
order = 5
subject = ""
author = "مش بحبك"
posted = "2008-05-09"
text = "يا طحاوي دي ما اسمهاش صحافة يا طحاوي دي اسمها صحافة مجلات الحائط زي اللي كانت ايام المدرسة<br />وعادة في بلادها العربية ما فيش صحافة<br />لكن الصحافة والاعلام دي تلاقيهم في امريكا<br />صحافة التغيير<br />صحافة التأثيير<br />صحافة بتشيل رئيس وتحط رئيس<br />صحافة بتقوم حروب بين البلاد<br />هي دي الصحافة يا طحاوي<br />لكن الكاميرا في الشنطة الحريمي دا ما اسموش صحافة يا طحطح يا خويا<br />وبطل اكل حمير لو سمحت"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105221440/http://20at.com/20at/politics/8956-2009-12-28-15-38-49.html"

[[comments]]
order = 6
subject = ""
posted = "2008-05-09"
text = "شيرين مجدي<br />العمر: 27<br />الجنس: انثى<br />الصناعة: إنترنت<br />المكان: cairo : مصر<br />الاهتمامات<br />قراءة.. مشي.. سماع أغاني.. شوية دندنة.. وأهم حاجة أكل الشوكولاتة طبببببعا<br />الموسيقى المفضلة<br />الأغاني العربية والفرنسية<br />الكتب المفضلة<br />ليالي ألف ليلة نجيب محفوظ - صاحب الجلالة الحب \"مصطفى أمين\" - في بلاط صاحبة الجلالة موسى صبري - أيام لها تاريخ أحمد بهاء الدين - بين أبو الريش وجنينة ناميش يوسف السباعي - مصير صرصار توفيق الحكيم - جوابات حراجي القط عبد الرحمن الأبنودي… ولسة كتير"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105221440/http://20at.com/20at/politics/8956-2009-12-28-15-38-49.html"

