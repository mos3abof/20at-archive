author = "مروة عبد الفضيل"
posted = "2008-05-04"
text = "ايه يا شيري المأساه اللي انتي فيها دي بس فعلا عندك حق ده شارع اسخف من السخافة بس السؤال بئه تخيلي لو واحده عايزة تولد في مستشفي الجلاء عقبال ما توصل للمستشفي ايه اللي هيحصل لاما هتموت لاما هتولد في الشارع لاما السواق هيضحي بالام وابنها وبنفسه وفي اقرب عمود ويخلص الليله دي يالا يا شيري بلاش تمشي من الشارع ده تاني خالص وطريق رأس الرجاء الصالح احلى واسرع كتييييييير"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105221440/http://20at.com/20at/politics/8956-2009-12-28-15-38-49.html"

