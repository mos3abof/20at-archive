text = "نسيتي تقولي أن شارع الجلاء مع ما يضمه من المباني الحكومية والمؤسسات والهيئات… يوجد في أوله من ناحية رمسيس نقطة زحام و \\\\\\\"توقف إجباري\\\\\\\" عند محل \\\\\\\"على بركة الله\\\\\\\" أشهر محل كبدة في مصر!!!<br />وبرده نسيتي تقولي عن \\\\\\\"أجمل روائح\\\\\\\" ممكن تشميها في شارع الجلاء واللي منبعثة من تحت كوبري اكتوبر وورا مستشفى الهلال !!!"
