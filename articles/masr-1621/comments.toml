[[comments]]
order = 7
subject = "رسالتين و بس"
author = "نيفين نيفى نوفا"
posted = "2007-02-21"
text = "على راى استاذنا الراحل فؤاد المهندس كلمتين و بس<br />الرساله الاولى للهوارى<br />طبعا من الاساس عنوان التعليق اسمحلى مستفذ جدا<br />ثانيا معروف ان دا عبود الزمر و جه من يومين ف القاهره اليوم تقرير عن الاستشكال اللى عمله لطلب الافراج<br />تانيا الموضوع تفوح منه رائحه السخريه الجارحه<br />النقد ميبقاش كدا يا هوارى و بالنسبه لاجابه سؤاللك طبعا من حق الزمر الافراج عنه و السيده جيهان السادات نفسها اقرت دا ف برامج كتير و انا رغم رفضى للزمر و من على شاكلته قلبا و قالبا انادى بالافراج عنه بدافع الانسانيه<br />دا راجا اجرم و خد جزاؤه<br />و بعدين خلاص ميتخافش منه و النظام ليه مايون طريقه احنا عارفينها لتحجيم دوره<br />الرساله التانيه لابن بهيه اللى فعلا صدمنى بتبنيه مبدا المراهنه على العنف زى ما قال احد المعلقين<br />من امتى كان حل مشاكلنا بالقتل<br />و متقوليش دا خائن لان مساله خيانه السادات من عدمها و كامب ديفيد و الحوارات دى لم و لن تحسم و للتاريخ و للاجيال الجايه الحكم عليها<br />بالظبط كدا زى كون عصر عبد الناصر هو العصر الذهبى من عدمه<br />و كون عبد الناصر مفترى عليه او مفترى علينا<br />ثم احنا ا اتفقنا ان للرجل و اقصد السادات ما له و ما عليه برده زى عبد الناصر<br />يعنى معقول مش قادر تفتكر للراجل دا حاجه كويسه واحده<br />اسمحلى اسجل اسفى<br />و مع اختلاف وجهات النظر حول كامب ديفيد و علامات الاستفهام التى ما زالت قائمه بصددها الرجل الان فى زمه الله و لا يجوز الا طلب الرحمه ليه<br />ابن بهيه<br />انا و الله مش من عادتى انى احجر على راى حد او نظرته السياسيه للامور بس انا فعلا مستغربه منك تبنى التطرف و اقرارك ليه حتى لو كان التطرف لحل مشاكل وطن زى مصر<br />انا كنت كل مره بتناقش معاك فيها زى مواضيع ناصر و نصر الله و غيرها بسجل احترامى لتقديرك الراى و الرا<br />اقرأ بقية التعليق .."
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222081024/http://masr.20at.com:80/article.php?sid=1621"

