text = "اظن من الادب ساسيادة الصحفى انك تتكلم عن واحد من سن والدك حتى ولو كان اخطء فى حياتة ورغم حبى للسادات الا الحى ابقا من الميت واظن كفاية علية كدة 25سنة يعنى اجيال اصبحت لا تعرف عنة شىء ولو خايفين منة خروجة وحددوا اقامتة وريح بالكوا دة رجل اصبح مسن يعنى,<br />وبالنسبة للاستاذ الصحفى كاتب المقال مش من الزوق انك تسخر من هذا الرجل لهذا الحدلان الصحافة ادب مش هز اكتاف ....<br />وشكراااااااااااااااااااا"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222081024/http://masr.20at.com:80/article.php?sid=1621"

