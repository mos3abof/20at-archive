[[comments]]
order = 3
subject = "وهو بطل"
author = "رجل عجوز"
posted = "2007-02-20"
text = "جندت بعد تخرجى من الجامعة وارسلت الى الجبهة شانى شان كل شباب مصر وقتها كان فى كل بيت من مصر شاب او شابين فى الحرب وشربنا المر وكانت الامكانيات تعبانة ولكن النفوس كانت فى السماء والروح المعنوية عالية وكنا راضيين لاننا كلنا كنا فى الخنادق وكانت هناك مساواة وكفائة فرص وفى الميدان كان الجميع صعيدى وبحراوى وفلاح وعامل وجامعى وامى ومسلم ومسيحى مفيش فرق<br />ومات ناس كتير وانجرحت ناس كتير<br />ولكن الهدف كان مصر وتحرير تراب مصر<br />ثم بعد النصر نشيل الكفن على كتفنا ونروح تل ابيب نطلب السلام او بمعنى اصح الاستسلام لية وفين تعب مليون وربع شاب مصرى<br />استسلام كان من الاول من بعد الهزيمة نسلم<br />والشباب كان ثائر وقتلوا السادات<br />وهذا المسجون كان من هؤلاء الشباب<br />وحتى لو شنقوة فهو والتاريخ<br />انتهى عمرة فى السجن ونفذ الحكم<br />فلماذا تخافون منة ؟<br />يظل صقر الجبال صقرا<br />لا ينحنى للعاصفة<br />يتشبث بمخالبة فى الصخر<br />رغم علمة انها مشبعة بالموت<br />ولكنة لايستسلم ابدا<br />يظل صقر الجبال صقرا"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222081024/http://masr.20at.com:80/article.php?sid=1621"

