[[comments]]
order = 1
subject = "عروستي"
author = "إبن بهيه"
posted = "2007-02-20"
text = "يا أخي الطيب .. أي جرم اقترفته يدا هذا الرجل ؟<br />هل قتل الخونة جرماً ؟ هل الوطنية جرماً ؟ عموما هو السيد المحترم عبود الزمر الذي يخشاه مبارك الواطي ولا يسمح له بالخروج من محبسه السري برغم مرور خمسة أعوام على انتهاء مدة السجن التي كان يقضيها ظلما وراء القضبان ..<br />وإن كان ولابد بقى من الكلام عن الجريمة فكان لابد أن يسجن قبله مبارك الواطي الذي كان لصيقا بالماسوني الهالك الأول ولم تصبه رصاصة واحدة برغم كثافة إطلاق النار التي أصابت عشرات يومها كما نعلم جميعنا .. لماذا لم يسجن ذلك الضابط الذي أعطى الإبرة الخاصة بالبنادق الرشاشة للشهيد خالد الاسلامبولي ؟<br />طيب ليه من أساسه ما قبضوش على الزمر والاسلامبولي قبل التنفيذ برغم تبليغ ذلك الضابط الذي أوصل إلى خالد إبر البنادق ؟<br />قال إيه<br />القوادات قالت للضابط اللي عملوه شاهد ملك في القضية سايرهم .. إديلهم الإبر واحنا رايحين نقبض عليهم متلبسين ؟؟؟!!! لأ والنبي إيه ؟<br />عملية اغتيال رئيس دولة وتقولي خليهم لما نقبض عليهم متلبسين ؟<br />هاتولي طفل في الكي جي وان (ما احنا ألافرانكا) يدخل دماغه الفيلم لاهندي ده ..<br />عرفتوا دلوقتي ليه طلعت السادات نايم في زنزانه ؟<br />ربنا يفرج همك يا أستاذ عبود يا زمر وليرحم الله الشهداء الخمسة الذين طهروا مصر من ذلك الماسوني الذي بدأت كراهيتي له تضمحل بسبب الماسوني الحالي وما نراه منه .. والله السادات اللي مات كان أرحم بقى .. يالا بقى مين اللي جاي عليه الدور ؟ عروستي<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222081024/http://masr.20at.com:80/article.php?sid=1621"

