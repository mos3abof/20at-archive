[[comments]]
order = 1
subject = "الف خسارة يا \"طيب \""
author = "ياسر أبو عمار"
posted = "2006-12-28"
text = "اكرر التهنئة للدكتور الطيب بوزارة الاوقاف او مشيخة الازهر ،والله ما هيلاقوا زيك يا عم الشيخ ،ملكى اكثر من الملك ؛تكره طلابك وتتمنى لهم استمرار الاعتقال ،قلبك جامد ،متاكد ان الطلبة لم يقصدوا بعرضهم اى ارهاب ومع ذلك تتمادى فى الضغط على الطلاب واولياء امورهم ،واوشكت السنة ان تضيع من ايديهم بسبب حضرتك ،اعتقد انك متاكد ان الطلبة لم يطالبوا الا بحقهم المشروع فى الغاء قرارات الفصل الجائرة ضد زملائهم واعادة المستبعدين من المدينة والاحتجاج على شطبهم من الانتخابات الذى تم على عينك ،لماذا لم تصبك الجراة الصعيدية وانت ترى ابناءك يشطبون فى الانتخابات ؟او ولماذا لم ترفض فصل صهيب الملط وزملائه بسبب اشتراكهم فى الاتحاد الموازى الذى اجريت انتخاباته داخل الجامعة وتحت عين الجميع ،هل العقاب يكون بترك الملف للبهوات الذين يقررون ما تتخذه من قرارات \"عارفهم طبعا \".<br />لا يا دكتور :كنت اظنك اقوى واحلم واعقل وارأف مما ظهرت عليه فى تلك الحادثة التى وان كانت رفعت اسهمك لدى السادة فانها حطتها عند الناس الذين كانوا يعتقدون انك اسم على مسمى \"الف خسارة يا رئيس الجامعة \"."
archived = "2007-01-05"
capture_url = "https://web.archive.org/web/20070105033437/http://masr.20at.com:80/article.php?sid=1368"

