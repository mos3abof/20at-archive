[[comments]]
order = 3
subject = "حسبنا الله ونعم الوكيل"
author = "محب الأزهر"
posted = "2006-12-30"
text = "واضح جدا أن كل ما حدث مع الدكتور الطيب هو تعبير عن همجية نواب الحكومة والإخوان وتطاولهم على أحد علماء الأزهر الشريف ينبئ عن خطورة الوضع في بلد الأزهر الشريف ، وهو تغافل عن المشكلة الحقيقية وهي تعمد الحكومة تجهيل وتحجيم دور الأزهر ودور علماء الأزهر الممثلين الحقيقيين للإسلام الحق في مصر وليس الأخوان ،ولكن حسبنا الله ونعم الوكيل"
archived = "2007-01-05"
capture_url = "https://web.archive.org/web/20070105033437/http://masr.20at.com:80/article.php?sid=1368"

[[comments]]
order = 4
subject = "إستمراراً لمسلسل الحياد الذى يتبعه موقعكم الموقر"
author = "-=uper=-"
posted = "2006-12-31"
text = "هعلق على نقطتين هتوضح جداً مدى حياد البيه الصحفى الكاتب المحترم<br />ياأخى إحترم عقل إللى بيقرأ مقالك وقل إنك متعاطف مع الطيب وبلاش تمثليات<br />**\"نواب الإخوان إللى بيسمعوا كلام نائب كبيرهم\"<br />وواضح إنك ماتعرفش طريقة عمل الكيانات السياسيه المحترمه<br />لما تبقى عضو فى كتله برلمانيه وينفق على مبدأ يجب الإلتزام !!<br />بالله عليك دى إسمها إلتزا حزبى ولا سماع كلام كبيرهم كأنهم عصابه<br />والله عيب عليك !!!!1<br />**مين إللى تطاول على علاماء الأزهر الكرام إللى عين عليهم شيخهم ومديرينهم ورؤسائهم وإنتزع حقهم فى غختياره كأنه قصر غير قادريين على التمييز<br />مين أهان الأزهر إللى بيدفع للخطيب 7 جنيه فى الخطبه وبيدفع للراقصه عشره ألالف جنيه فى الليله<br />ياعالم بطلوا الأفلام إللى بتعملوها دى<br />إخوان مين إللى أهانوا الأزهر .. دى إسمه هبل!!!"
archived = "2007-01-05"
capture_url = "https://web.archive.org/web/20070105033437/http://masr.20at.com:80/article.php?sid=1368"

[[comments]]
order = 5
subject = "اه يا بلد"
author = "رحال"
posted = "2006-12-31"
text = "انضم برأيي الى راي اخي الفاضل -=uper=-<br />وها هم الاخوان الذين افنوا حياتهم دفاعا عن حق المواطن المصري يتهمون ويشكك في اسلوبهم الدعائي ايضا<br />وكما قالت عضوة الوطني انها تخاف على اولادها من الاخوان المسلمين<br />بالله عليكم ايخشى من الام على وليدها؟؟!!<br />هل الاخوان المسلمين ينخاف منهم ؟؟!<br />والله لقد قالت كلمة سيحاسبها الله عليها يوم القيامه<br />فالاخوان المسلمون يبحثون وينقبون على ما هو مفيد وصالح لكل افراد الشعب والكل يشهد بذلك.<br />وانتم تعرفونهم حق المعرفه<br />والله انهم ويشهد الله لا يطمعون في منصب ولا ثروة ولا منفعة ماديه<br />ولا يجرون وراء شهرة والله يشهد على ما نقول"
archived = "2007-01-05"
capture_url = "https://web.archive.org/web/20070105033437/http://masr.20at.com:80/article.php?sid=1368"

