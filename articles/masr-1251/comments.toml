[[comments]]
order = 2
subject = "ربنا يوفق كل الأحرار"
author = "إبن بهيه"
posted = "2006-12-07"
text = "إخواني الأعزاء المحترمين المعلقين قبلي وتفضلتم بذكر اسمي أشكركم جميعاً ولو أنني أضم صوتي إلى أختنا الفاضله وأسأل الأخ أن يوضح كلامه لنا جميعاً لأنني بصراحه لم أفهم .. كما أشكر عظيم لاشكر الأخت مريم على كلامها اللطيف الطيب المهذب .. تيجي تقولي مهذب ؟؟ وانته كل شويه بتقول واطي ومش عارف إيه ؟؟؟ أنا عمري في حياتي ما شتمت واحد مش عارفه كويس وعارف إنه يستحق الشتم والضرب كمان .. عموماً ما علينا وربك يعدلها وأحوالنا الفظيعه دي نبدلها .. نخش في الموضوع ..<br />أنا بصراحه سعيد جدا بكل هذا .. يعني سينما مستقله .. مسرح مستقل .. اتحاد طلبه مستقل .. يا ريت يبقى كل حاجه عندنا كده .. كل ما مبارك الماسوني الواطي وعصاباته يقرفونا في عيشتنا نروح عاملين كيان آخر موازي يعبر عنا بصدق بعيدا عنهم حتى نتمكن في الآخر من فرض أنفسنا عليهم وعلى من ورائهم من صهاينه ومنظمات ماسونيه .. طبعا ده موضوع يحتاج إلى وقت وجهد وصبر طويل جدا .. لكن يستحق العناء طالما مش عارفين نغير بصوره راديكاليه .. ولو أنني لن أمل الحديث عن ضرورة التغيير الراديكالي الإنقلابي سواء كان مدنياً (ثوره شعبيه وعصيان مدني)) أو عسكريا كحركة الفال الحلو بتاع موريتانيا بس نجيب منين جيش محترم يعملها ؟؟؟ غيرش الأمل بقى في الضباط الصغيرين ..<br />المهم أنا مع هذه الفكرة وأتمنى لهؤلاء الشباب التوفيق في كل أنشطتهم العظيمه هذه .. سواء اتحاد طلاب حر أو مسرح حر أو سينما حره أو أي ريحة حريه في هذا البلد الي يسرع الخطى نحو الموت لو لم ندركه سنموت فيه ومنه وله وعليه وربك يستر ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-11"
capture_url = "https://web.archive.org/web/20061211114912/http://masr.20at.com:80/article.php?sid=1251"

[[comments]]
order = 3
subject = "ايوه"
author = "صاحب تعليق ايوه"
posted = "2006-12-08"
text = "معلش يا عم ابن بهيه حقك على ، هو عذر اقبح من ذنب انا عارف بس واضح اوى من الرد ان كلام ملوش معنى افتكرت ان ده واضح اوى لانك اكيد ملكش علاقه بالملك لير ولا اللى وراه ولا اللى مش عارف ايه ، معلش يعنى ، واضح انه كلام فارغ مفتكرتش ان حد هياخده على محمل الجد ، هو رد كلام فارغ اه بس انا لا افكر فى شتيمه اى حد ، وبصراحه انا قرفت من جو المؤامرات اللى بيفرضه النت فكل واحد شاكك فى اللى حواليه ده مش عارف عميل لايه وده جاسوس و ده له اهداف غير معلنه ، ده لدرجه انا فاكر انكو فى احد المواضيع كنتم بتتعاملو مع واحد من اصحاب الردود على انه جاسوس يهودى ، الجو كله عدم ثقه و قلق وحاجه لا يعلم بيها الا ربنا ، ارجو ان متزعلش من الكلمتين دول ، عموما و ده لا يقلل من الخطا مش شايف ان فى اهانه فى الكلام مش جايز يا اخى كنت اقصد ان وراك ناس طيبين و جدعان .... وكمان يا ريت الاعتذار لا يقابل بالاهانه لان كان سهل اوى لا ارد ولا اقول اى حاجه."
archived = "2006-12-11"
capture_url = "https://web.archive.org/web/20061211114912/http://masr.20at.com:80/article.php?sid=1251"
