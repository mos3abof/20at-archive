subject = "استفسار"
author = "مريم"
posted = "2006-12-07"
text = "الي صاحب التعليق السابق<br />انا اقراء كثيرا لابن بهية و لكني لا اعلم اي شيء عنه...ممكن توضح كلامك لو سمحت...مين هو ابن بهية و ميت اللي وراه و معاه...عشان لو طلع هو كمان انسان مش كويس انا هازعل اوي بصراحة....انا كنت فاكراه من المعارضين المحترمين و لكن من كلامك واضح ان فيه حاجة انا مش عارفاها...برجاء التوضيح سريعا...وشكرا"
archived = "2006-12-11"
