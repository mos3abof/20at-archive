[[comments]]
order = 0
subject = "فين السر ؟؟"
author = "محمد السيد"
posted = "2005-11-30"
text = "ر بكاء والي ؟؟؟؟ إيه السر ؟؟ يا تري هو سر؟؟ أعتقد إن السر مش سر ... صح ؟؟ إيه الأسئلة الكتيرة دي ؟؟؟<br />بكاء والي ... ما هو لازم يبكي .. يعني واحد في مكانه حيعمل ايه... انا بأتكلم بعد الخسارة ...<br />الآن هو مستني المحاكمة .. مستني السجن ... مستني الفضيحة ... مستني رد الشعب علي سنين من السلطة ..<br />الآن هو قاعد في بيته .. ويمكن يكون سافر و ترك البلد ... لكن الأكيد إنه مرعوب وخايف من كل حاجة بتحصل من حوله ...<br />الآن هو ممكن يعتقد إن مبارك حيحميه .. وتلاقيه بيردد الكلام ده ... لكن مبارك يحمي مين ولا مين ؟؟؟<br />ابكي ... ومش تبكي وبس ... لا .. استني رد الشعب ... رد الناس ... استني ردنا ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-26"
capture_url = "https://web.archive.org/web/20060926221608/http://egyvote.20at.com:80/article.php?sid=84"

