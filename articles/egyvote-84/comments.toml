subject = "بدل الدموع دم إن شاء الله"
author = "basmatokom"
posted = "2005-11-30"
text = "عدد كل أب و كل أم وكل ولد وكل بنت جالهم سرطان ويا عالم ظروفهم وظروف أهلهم ايه<br />ربنا ينتقم منك بعدله في الدنيا و في الاخرة ....يجعلك اية إن شاءالله<br />ابكي ابكي .....ياما هتبكي ...لسه أيامك السودة كتيير جايه"
archived = "2006-09-26"
