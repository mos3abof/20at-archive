text = "مكتوب في المقاله<br />،،،،،،،،،،،،،،، ،،<br />وكان متحدث باسم المستشارة الألمانية أنجيلا ميركل قد أعلن أن مركيل ستبحث مع الرئيس المصري حسني مبارك حادث مقتل المصرية مروة الشربيني في ألمانيا مؤخرا.<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــ<br />وهو حسني مبارك حيهمه حاجه<br />ايه يعني واحدة مصرية اتقتلت<br />طز<br />حسني مبارك عنده 80 مليون واحد عايزين القتل<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــت<br />مش شريف الدواخلي ولا البراء اشرف"
