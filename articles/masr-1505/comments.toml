[[comments]]
order = 0
subject = "هو ايه حكاية موضوعات التيك اواى!!!!"
author = "شريف الدواخلى"
posted = "2007-01-28"
text = "470 كلمة – 4 ولاد – 4 بنات – شوية كلام مرسل !!!!<br />وبعدين ... هو ايه حكاية موضوعات التيك اواى ديه يا جماعة .. مش ممكن اتعبوا شوية فى الموضوعات ...<br />لو الصحافة مجرد تليفونات يبقى العامله بتاع السوتش يكلم كان واحد وواحدة ويكتب الموضوع ويبقى صحفى ؟؟؟؟ مكنش حد غلب ..<br />فكره الموضوع جميلة جدا بس فيها شوية ثغرات ... اللى هى<br />1- فيه شغلك فى الجامعة وعرضك للنشاطات اللى بتقدمها الكليات \"<br />ونقدها بشكل موضوعى \" ورأى الطلاب فيها \" ان كانوا يعرفونها وكذلك رأى اساتذه الجامعه<br />2- فيه رأى متخصص فى الادارة \"و ما اكثرهم فى كلية التجاره \" ازاى ممكن الطلبه بستغلوا اوقات اجاتهم فى الترفيه طبعا ولكن باستراتيجية معينة<br />3- اراء خبراء التعليم فى كيفية الاستفادة القصوى من الاجازة وكيفية الاستعداد الامثل للتيرم التانى<br />4- واخيرا ... لن يكون مبرر ان الموقع شبابى ومفتوح عذرا مقبولا حتى ننزل بالمستوى على حساب اساسيات المهنه .. ولكن العبره بحسن عرض الموضوعات القوية اللى \" متخدم عليها صح \" عشان ما حدش يقول احنا عاوزين كده عاوزين موضوعات مفيهاش معلومات \"مجرد حاجات تسطح العقل \" عاوزين شغل صحافة محترفين مش هواه .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131103546/http://masr.20at.com:80/article.php?sid=1505"

[[comments]]
order = 1
subject = "الي شريف الدواخلي"
author = "انت يا عم انت مالك فية اية عاملي فيها علامة عصرك ونازل تعلق في كل موضوع كاتبينة زمايلك وهاتك يا نقد وتقطيع في ام المقال"
posted = "2007-01-28"
text = "اتلم يا عم شوية بلاش النفسيات التعبانة دي خلي اللي يكتب يكتب عجبك المقال ناقش اللي فية معجبكش متردش لا تظهر لكن تعملي فيها هيكل عصرك وتدخل كل موضوع تشرك امة لا"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131103546/http://masr.20at.com:80/article.php?sid=1505"

[[comments]]
order = 2
subject = "الى الاستاذ شريف الدواخلى"
author = "واحد مفروس"
posted = "2007-01-28"
text = "يا اخى الكريم احنا مش طلبة فى قسم الاعلام كل شوية تدينا محاضرة فى الكلام الخايب اللى بيقولة دكاترة الاعلام<br />ولعلمك ولا دكتور من بتوع الاعلام ينفع يكون صحفى دول حافظين مصطلحات جامدة بيرددوها بس<br />لكن الاعلاميين الكبار ماتخرجوش من الاعلام<br />مثلا مصطفى امين وعلى امين كمثال مادرسوش فى الاعلام انما من اشهر الصحافيين فىمصر<br />بطل التعليقات الفنية المحبكة قوى<br />معلهش"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131103546/http://masr.20at.com:80/article.php?sid=1505"

[[comments]]
order = 3
subject = "للاغبياء الذين يتنقدون الدواخلى !!"
author = "أحمد بكير"
posted = "2007-01-28"
text = "انا مش عارف الناس اللى عماله تنتقد الدواخلى دول وصلوا للدرجة ديه من الغباء انهم يقولوا ان نفسيته تعبانه من ان بعض الناس .. يا اساتذه اسم الدواخلى منور فى الدستور دايما وده خير دليل انه حد كويس جدا ...<br />ومش كده وبس انا شايف ان تعليقه وان كان يعيب عليه بعض العصبية الا انه موضوعى جدا ومش تنظير خالص بل بالعكس ده كل بيركز على فنيات شغل الصحافة ..<br />وبعدين ياجماعة احنا هانفضل لحد امتى لانقبل النقد ...<br />بس اكتر حاجة عجبانى ان الداوخلى مش بيعبر كل الكلاب اللى عماله تعوى وراء تعليقه .. بس انا هارد على كل تعليق يمسك بكلمة لانى على اقتناع تام بانك حد كويس جدا و عارف انك تعليقك يهدف لرفع مستوى الاداء فى الموقع"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131103546/http://masr.20at.com:80/article.php?sid=1505"

[[comments]]
order = 4
subject = "لي بيدافع عن شريف الدواخلي"
author = "اقتباس \"ومش كده وبس انا شايف ان تعليقه وان كان يعيب عليه بعض العصبية الا انه موضوعى جدا ومش تنظير خالص بل بالعكس ده كل بيركز على فنيات شغل الصحافة .. \""
posted = "2007-01-28"
text = "خلص الاقتباس<br />أحمد بكير في شئ معروف ما بين ابناء المهنة والاحدة انة مينتقدش فنيات الشغل قدام الزبون يعني ممكن الكلام دة يتناقش بينهم وبين بعض مش في تعليق . طبعا انا مش هتكلم علي جودة المقال او فنياتة لكن مكن اناقش الافكار اللي طرحها ودة اعتقد المغزي من انك تعلق علي مقال مش مكتوب عل البوتن<br />\"انقد المقال\" يا ريت بتوع عشرينات يريحونا من الناس دي ويغيروها ل \"ناقش هذا المقال\" عشان الناس اللي نفسيتها تعبانة تفهم تناقش من تنقد فنيات المقال.<br />ثانيا لما تتكلم وتقول علي اللي مش عاجبة نقد الدواخلي واننا امة لسة متعلمناش النقد وترجع تشتم وتقول مستني كلب يتكلم وقاعدلة<br />اسمحي اقولك كلمة في ودنك ممكن<br />\"حكها بخيارة ممكن تهدي شوية\""
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131103546/http://masr.20at.com:80/article.php?sid=1505"

[[comments]]
order = 5
subject = "الموضوع عادى"
author = "ايه- السويس."
posted = "2007-01-28"
text = "اولا الموضوع عادى مفيهوش حاجه مهمه والناس كلها بتشتغل وقتها فى الاجازه باى طريقه,وللاخ اللى بيدافع عن شريف الدواخلى وبيقول ان اسمه منور فى الدستور دى صحافه صفراء ونادرا لما حد بيقرأها ولو هو كاتب كويس كانت اى جريده من الجرائد الكبرى اخذت مقالاته."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131103546/http://masr.20at.com:80/article.php?sid=1505"

