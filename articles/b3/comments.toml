[[comments]]
order = 1
subject = "تطهير!!!"
author = "محمد"
posted = "2005-12-06"
text = "عجبت جدا من عنوان الحملة \"تطهير الماسنجر من ايميلات الجنس الاخر\"<br />وكأن الجنس الاخر نجس يجب التطهر منه!!<br />لا أدري أي عقلية وراء مثل هكذا نشاطات!!<br />ولماذا دائما-في مجتمعاتنا- هناك افتراض بسوء النية لكل من يتحدث مع الجنس الاخر سواء على الماسنجر او حتى على أرض الواقع<br />الأصل أن نفترض في الناس حسن النية وليس العكس<br />والأكثر طرافة هو اعتبار الماسنجر نوع من الخلوة!!!!!!!<br />كيف؟؟؟ وما هو المعيار الذي حكم به من قال بهذه الفتوى العبقرية؟!!!<br />حقا نحن مازال امامنا الكثير حتى \"نتطهر\" من هكذا أفكار، وأخص بذلك المجتمع السعودي الذي مازال يرى في قيادة المرأة للسيارة مخالفة للدين، رغم ان هذا المجتمع يعلم تماما العلم ان هذه ليست سوى عادات اجتماعية ليس لها أصل من الدين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"

