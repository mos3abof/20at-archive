[[comments]]
order = 10
subject = "التطهير"
author = "ما علاقة التطهير بالنساء"
posted = "2006-01-30"
text = "اولا بالنسبة للشباب عندما يتركون دراستهم لاجل الماسنجر فهذا راجع للتربية والاهل<br />ثانيا من تطهر نفسك منه هل هي النساة التي ربنا خلقها من الرجل وللرجل<br />ثالثاالا يكون هناك تطهير ايضا للمراة على الرجل وللعكس<br />رابعاالمراءة والرجل حلقتان لا ينفصلان بسبب او ما فممكن ان يتناقشا في مواضيع او تكلما في امور شتا<br />خامسا اذا لم يكن الرجل قادرا على منع نفسه من التكلم في الماسنجر او عبر الانترنت فهل من الضرورة عمل جمعية للتطهر اولا طهروا انفسكم<br />سادسا انا لست مع النساء او مع الرجال فانا مع الحق والقول هو اسهل من الفعل<br />سابعا لا يحق لاي شخص عمل جمعية للتطهر من النساء فمن السهل للنساء عمل جمعية مثلها<br />فالذي يريد ان يزني او التي تريد ان تزني فاية اقرب لهما هل الماسنجر او الانترنت او الشارع<br />وشكرا على استماعكم لي واي اسفتفسار على الايميل دكتور عماد emadmnofi@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"

