text = "عجبني السعوديون كثيرًا لقيامهم بمثل هذه النشاطات التي تبدو جادة ، وقد يقتنع بها المراهقون بصفة خاصة ، أو الملتزمون الجدد ، ولكن أعتقد أن الماسنجر ( بشكل خاص) تجاوز هذه المرحلة بكثير ، فقد أتفق معك علىأن الشات تضييع وقت ، أما كون الماسنجر (خلوة) بجد كثيييييييييييييييير أوفـر يعني<br />وتحياتي"
