[[comments]]
order = 16
subject = "حمدي"
author = "السلام عيلكم ورحمه الله ...."
posted = "2006-03-27"
text = "انا متفق معاكي يااخت نور تقريبا في كل اللي قولتيه<br />لكن يمكن يكون الاختلاف هو في تفسيرنا لبعض الامور تفسير مختلف<br />بمعني مثلا انت بتتكلمي عن ضعاف النفوس<br />وانا شايف ان الضعف الانساني مش شيء مشين<br />ده شيء موجود عند كل الناس لكن بدرجات مختلفه ومتفاوته مهما بلغ التزامهم<br />وينبغي ان لا نغالي في تقديرنا لذاتنا وقدرتنا في السيطره علي مشاعرنا وسلوكنا<br />لانه احيانا بيكون مدخل من مداخل الشيطان<br />وخصوصا ان علاقه الرجل بالمراه في الاسلام لها ضوابط معينه<br />بشكل ابسط خليني اقول ايه اللي يخلي شاب يضيف بنت عنده علي الايميل<br />طيب علاقة عمل ..... ممكن يكون لها مبرر<br />من اقربائه مثلا مفيش مشاكل<br />لكن انا بتكلم عن مايسمونه الصداقه بين الشاب والفتاه من خلال الماسينجر من اجل الصداقه فقط واللي ممكن قوي تتطور لنواحي تانيه<br />طيب انت ايه رايك فيه حاجه في الاسلام اسمها صداقه بين ولد وبنت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"

