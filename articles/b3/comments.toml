[[comments]]
order = 6
subject = "أطهر إيه من إيه"
author = "محمد السقا"
posted = "2006-01-12"
text = "أطهر إيميلي من البنات كمان إيه ده ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />إيه رأيكم أطهر البناية والمحل و المواصلات من البنات كمان ؟؟؟؟؟؟؟<br />أنا لما بتكلم مع بنت على المسنجر بكون عم بنمي معارفي وثقافتي بالحياة وده واجب علينا عشاتن منبقاش جاهلين ومنقادين وراء أفكار غيرنا المسمومة تجاه الجنس الأخر نتيجة جهلنا فيه وبطريقة تفكيره<br />صدقوني الدنيا إتغيرت والمسلمين لازم يواكبوا التطورات دي بإقتراحات منطقية وممكنة التحقيق مش طلبات غريبة وبكلمات سافرة متل (((تطهير ))))<br />عموما انا اقترح عدم فتح الكميرات فقط<br />أما الشات فمفبهوش حاجة غلط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"

[[comments]]
order = 7
subject = "تحيه الي الجميع"
author = "حمدي"
posted = "2006-01-14"
text = "جميل القول اننا يجب انا لا نتخذ مواقف<br />مسبقه عنما ندخل اي نقاش<br />وجميل القول اننا يجب ان نكون ذو عقليه<br />نقديه منفتحه باحثه عن الحقيقه<br />وجميل القول اننا يجب ان نلتزم الادب<br />و الموضوعيه في الحوار مع الاخر<br />ومااكثر المقولات الجميله<br />ولكن الاجمل من كل هذه المقولات ان تترسخ<br />معانيها في قلوبنا وعقولنا وتنعكس في<br />سلوكناو افعالنا<br />اللهم ارنا الحق حقا وارزقنا اتباعه<br />وارنا الباطل باطلا وارزقنا اجتنابه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"

