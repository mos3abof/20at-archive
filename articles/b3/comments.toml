subject = "الصراحة × الصراحة"
author = "حسام"
posted = "2006-07-17"
text = "مرحبا شباب اول شي اشكركم كتيير على الموضوع الرائع ولكن بإختصار شديد جدا عندما اخل مواقع الدردشة فإني أخل بأسمي الحقيقي ولا أستعمل اساليب اللف و الدوران ولا أدخل الدردشة بإسم فتاة مع اني لم ولن افعلها ابدا وذلك لأن ثقتي بنفسي قوية ولا يهمني احد امامي طالما بأن الحديث يكون ضمن نطاق الادب و الاحترام والذي يكون شاباً و يدخل بأسم فتاة أنا اعتبره ( آسف ) مريضاً عنده نقص و يرغب في إكماله<br />ولكم شكري و تقديري لكل من قرأ التعليق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"

[[comments]]
order = 20
subject = "نصيحه للنفس"
author = "حسناء"
posted = "2006-09-16"
text = "السلام عليكم و رحمة الله و بركاته كل سنه و انتم طيبين بمناسبة حلول شهر رمضان الكريم وياريت كل واحد و واحده يبدا بنفسه و كلنا نصلح من نفسنا و نمشى على الصراط المستقيم واخر دعوانا ان الحمد لله رب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"

[[comments]]
order = 21
subject = "فكرة رائعة واشد عليها"
author = "صمت البوووح"
posted = "2006-09-17"
text = "السلام عليكم ورحمة الله وبركاته<br />فكرة رائعه تدل على الوعي الفكري والنفسي لدى الشباب عامة, وانا اشد علي ايديهم واتمنى من بنات جنسي ان يخطو تلك الخطوة الرائعه .<br />ولله الحمد فقد حذفة برنامج الماسنجر منذ مايقارب السنتين ولم اعاني من اي مشاكل .<br />موفقين وإلى الامام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"

[[comments]]
order = 22
subject = "ما اعرف"
author = "فاطمة حسن الهزاري"
posted = "2006-09-18"
text = "والله انا ما اعرف شو اقول بس انا قريت بس والله المعلومات انا استفت منها وايد ومشكور اخوي فواز"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"

[[comments]]
order = 23
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-18"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"

