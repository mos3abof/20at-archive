[[comments]]
order = 27
subject = "أنيلب الدئاب"
author = "حسين الحسيمي"
posted = "2006-10-26"
text = "بسم الله الرحمان الحيم<br />الصلاة والسلام على رسول الله صلى الله عليه وسلم وعلى اله وصحبه أجمعين.<br />أما بعد<br />أختي الكريمة،إحدري من أنياب الدئاب وهم الرجال اللئام اللدين لا يخافون الله ،قد يتكلم معكي بأجمل العبارات ليوقعكي في فك الشيطان ولكن الله الله يا اختاه إياك ولانصياع لكلامه حتى لا تكونين عار على المجتنع،وعليك بتطهير نفسك بالتوبة الى الله والانصياع لإوامره،والزواج من الرجل الصالح وطاعته,أختاه العغاف والطهر هما سلاح المرءة وعلامات أنوثتها ,تقبلي مني أختي الكريمة هده العبارات المتواضعة والقليلة.والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"
