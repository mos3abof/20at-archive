[[comments]]
order = 3
subject = "من مينا الى محمد"
author = "مينا"
posted = "2005-12-07"
text = "نتا بجد عظيم اوى اوى يا محمد انتا تقريبا سبقتنى وقلت كل اللى انا عايز اقوله<br />يا جماعة يا جماعة الاسلام العظيم مش بيحد من العلاقات بين الرجل والمراءة لكنه بينظمها<br />مش اى ولد بيتكلم مع اى بنت يبقى الموضوع اللى بيتكلموا فيه حرام<br />الناس اصحاب العقلية القديمة دى عايزين يفصلوا نصف المجتمع عن نصفه الاخر ازاى ؟؟؟؟؟؟؟؟؟؟؟<br />ثانيا يا ريت الناس اللى مش لاقية شغل تبطل تطلق فتاوى عمال على الفاضى علشان الفتوى دى مش فى وش صاحبها لا دى فى وش الدين<br />ازاى يا يبقى فى خلوة بين شخصين متباعدين فى المكان<br />دى اساسا الخلوة اتحرمت بين اتنين ( رجل ومراءة) اغراب خوفا من الوقوع فى المحظور اللى بيتطلب مكان فين المكان بقى فى الشات ؟؟؟؟؟؟؟؟<br />ثالثا المشكلة اللى فيها الشباب السعودى حاليا غلطة قديمة بسبب الكبت والانفصال الكلى و الجزئى عن الجنس الاخر<br />واساسا فى علم النفس الانسان فى مرحلة المراهقة بيسعى لاستكشاف الجنس الاخر و فى مرحلة النضوج بيسعى لعمل علاقات مع الجنس الاخر ( علاقات محترمة صداقة مثلا او جيرة )<br />يبقى لما الشباب السعودى بيخالف السلم الطبيعى اللى المفروض اى انسان طبيعى يطلع عليه عبر مراحل عمره<br />اكيد بيجيله خلل بيعوضه من خلال الشات يبقى اساسا الغلطة قديمة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"

[[comments]]
order = 4
subject = "مينا انت تاني"
author = "عبدالله مفتاح"
posted = "2005-12-07"
text = "ينا يا صحبي انت مش غلطت غلط واحد انت غلطت كذا غلط هقلهملك<br />الاول:ان مش ينفع انك تحكم على اي فتوى لانك مش من اهل الدين يبقى مينفعش اصلا تحلل فتوى ايا كان مصدرها<br />ثانيا:مفيش حاجه في الدين اسمها صداقه بين الولد والبنت ده موضوع محسوم ومفيهوش نقاش اي صداقه بين ولد وبنت حرام بنص القران(ولا متخذات اخدان)<br />ثالثا:يا ريت تحترم الناس اللي ليهم راي في الدين ومتقلش عليهم اصحاب العقليه القديمه<br />رابعا:كلمة الكبت اللي بيستغلها معظم انصاف المثقفين وغير العالمين باوجه الامور في التلميح بان الولد غلط انه ميصحبش بنات الرد عليه كالتالي: اي تربيه سليمه عفيفه لازم يكون فيها نوع من انواع الكبت اللي بيقوم وبيصبح طاقه بناءه<br />افترض معايا ان واحد حب واحده متجوزة نقول يعمل معاها علاقه عشان ميحسش بالكبت؟<br />لا طبعا لان القيم والمبادئ والمثل بتفرض عليه انه يصبر<br />خامسا :على كلامك يبقى كلام البنت للولد في التليفون مفيهوش اي غلط لانهم لم يجتمعوا في مكان وانت اكيد عارف المصايب اللي بتحصل في التليفون بين البنات والشباب يبقى العبرة مش بالمكان العبرة بما يقال بينهم<br />سادسا واخيرا: مش معنى كلامي اني مع او ضد ان المسنجر يكون جنس واحد انا بس حبيت اوضحلك امور انت نسيتها او تناستها<br />لكن ممكن اكون من باب سد الذرائع او ضد من باب فرض النيه الحسنه لكن مستحيل اعيب على اي من الطرفين انهم اتصرفوا باي من الطريقين<br />عبدالله مفتاح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134143/http://www.20at.com/article2.php?sid=3"

