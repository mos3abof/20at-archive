subject = "حمدي"
author = "بالتاكيد ان تقويم السلوك ومراعاة ضوابط التعامل بين الرجل والمراة الاجنبيين عن بعضهما هي الاساس"
posted = "2006-03-26"
text = "ده شيء لا يختلف عليه اتنين<br />لكن ربما لان الواقع الان من حال الشباب كان هو الدافع لاصدار هذه الفتوي<br />لان بصراحه الماسينجر في اغلب الاحيان لايعني عند الشباب الا التعرف علي فتيات والعلاقاتالعاطفيه واشياء من هذا القبيل<br />وعندما نتكلم عن شباب في سن المراهقه فربما يحتاج الامر الي ضوابط شرعيه تحكم الموضوع"
archived = "2006-11-02"
