text = "يا حلاوة<br />الاخ احمد ماهر اللى فى حركة 6 ابريل بيتصل ببتوع المهجر عن طريق واحدة اسمها لينا جرجس بتشتغل فتاة ليل فى فيرجينيا<br />يظهر ان احمد ماهر هيحصل بيشوى<br />ماهو فية شباب بيشوفوا اللحمة بينهبلوا"
