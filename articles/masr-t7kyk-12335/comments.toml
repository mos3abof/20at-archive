[[comments]]
order = 2
subject = ""
author = "حركة كفاية قرف"
posted = "2009-06-10"
text = "يعنى اية حركة كفاية تتصل ب اعباط المهجر<br />من هم اعباط المهجر واسف لاستعارة كلمة زميل معلق من قبل باستخدام كلمتة اعباط المهجر<br />مش العيال دى هاجرت واخدت الجنسية الامريكية وغاروا فى ستين داهية - لية كفاية تتصل بيهم علشان تنسق مع اعباط المهجر الذى يوجههم الصهاينة والمنظمات اليهودية فى امريكا<br />بكدة يبقى حركة كفاية اللى رئيسها جورج اسحاق بتلعب على كل الحبال<br />يبقى اية علاقة شباب 6 اكتوبر<br />حركة 6 اكتوبر حركة شبابية مصرية نظيفة اسستها بنت من مصر تحت شعار خليك فى البيت<br />6 ابريل شباب نظيف لا يجب ان يوسخ نفسة مع اوساخ اعباط المهجر او اوساخ كفاية<br />6 ابريل هم شباب مصر المثقف الناهض امل بكرة بتوع التكنولوجيا والنت<br />هم الحلم المصرى الباسم<br />6 ابريل خليكوا بعيد عن الاوساخ واحلموا بمصر قادمة نظيفة وقوية وعادلة"
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715071317/http://www.20at.com:80/masr/t7kyk/12335-6-.html"

[[comments]]
order = 3
subject = ""
author = "مطالب 6 ابريل"
posted = "2009-06-11"
text = "ما هى مطالب 6 ابريل ؟<br />شوية شباب طموحين عايزين يعملوا حاجة - بس ازاى - ما هى الطريقة ؟<br />لم يقل لنا احد سواء حزب وطنى او معارضة او اخوان او كفاية او 6 ابريل - كيف نبنى مصر ؟<br />كيف نقضى على البطالة ونبنى اقتصاد قوى وكل واحد يلاقى فرصة عمل وينتج ويبيع وشوارع البلد تنضف ويبقى فية حدائق وحضانات وتنتهى العنوسة والزواج المتاخر<br />كيف نخرج من النفق المظلم الذى دخلنا فية<br />لو فية حزب عندة برنامج لعمل دة انا هالتحق فية فورا<br />انما كلام هلامى عن الديمقراطية والتغيير ومش عارف اية فكلام فارغ<br />الصين شيوعية وفيها اقوى اقتصاد فى العالم<br />وامريكا مركز الراسمالية وفيها اقتصاد منهار<br />عايزين تجربة مصرية خاصة بنا<br />عايزين ناس تقول للشعب نعمل اية<br />نبدأ ازاى"
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715071317/http://www.20at.com:80/masr/t7kyk/12335-6-.html"
