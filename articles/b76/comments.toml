subject = "مين اللي قد المسؤليه"
author = "ابو ماجد"
posted = "2006-09-08"
text = "استاذ احمد اسال انت من مصر على فكره عندكم في مصر اشياء اكبر واعمق تستاهل انك تعطيها وقتك وجهدك من مواضيع اسماء مستاره<br />ثانيا : ارى ان الشخص الذي يلقب زوجته باسم غير لائق مثل شارون او الشيطان فهذا دليل انه مازال طفلا لا يستطيع ان يفتح بيتا فليته طلب من والديه ان يؤجلا زواجه حتى ينظج ويعتمد عليه او ان يواصل حياة المقاهي والصياعه وماله ومال بنات الناس"
