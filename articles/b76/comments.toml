subject = "ياسلاااااااااااااااااام"
author = "تيماء"
posted = "2006-01-25"
text = "سلام على الجميع<br />يعني يا شباب السعوديه مو كفايه انكم عديمين الرومانسيه الا من رحم ربي منكم<br />بس وش نقول الله يعينا عليكم<br />المهم يا بنات فكرو معي وش ممكن نطلق عليهم بجوالاتنا<br />ممكن نقول(العله-التنحه-المهستر-علتي-الماصل-عندكي سلف) وغيرها بس للاسف ما تلاقون اسمائكم فجوالاتنا غير(ابو عيال- الغالي- حياتي-حب العمر-الروح- الغلا- غناتي-جنتي وناري-كل الشوق)يا ترى يستاهلون؟؟؟؟؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134359/http://www.20at.com/article2.php?sid=76"

[[comments]]
order = 11
subject = "جنون قلم"
author = "قد يحمل موضوع وجهة نظر وهي تسميه بهذا الاسم او غيره ... وسبب قد يكون عيبا كما ذكر انفا"
posted = "2006-03-03"
text = "لكن هناك اسباب اخرى والموضوع حمل على وجهة نظر محايده ...<br />وسبب كما ارى ان استعمال المستعار هروب من عيون الفضوليين ... عند نسيان الهاتف او غيره ..<br />وهناك من هو معدوم الضمير فياخذ الرقم ليصبح مزعج لهم ومعاكس ... او لتنفيث حقد قد حمله اتجاه الشخص فيكون تنفيث في اهله<br />اسباب مرضيه متعدده لكن ابليس لم يمت واعوانه كثر خصوصا وان البعد عن الشرع سبب حقيقي لذلك<br />تحياتي بنت نجد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134359/http://www.20at.com/article2.php?sid=76"

[[comments]]
order = 12
subject = "زوجتي هي)) ام الحبيايب ))"
author = "jaguar"
posted = "2006-04-15"
text = "ان التعليقات التي تعطي للزوجة يجب ان تكون علي قدرها ...... واقصد بقدرها هنا ان لا ننسى انها مكسورة الجناح وهي ام لابنائنا حبيابنا وهي مدربية لا اجيالنا ومدرسة لهم هي المدلاسة الاولي . و لا ننسى ان نبينا عليه افضل الصلاة والسلام اوصى بالقوارير (( النساء )) كما اوصان بان نطلق الاسماء المحببة وليست الاسماء التي فيها نوع من الاضطدهاد والقسوة فهن امهاتنا وبناتنا وعماتنا وخالتنا هن من فتحت اعيننا عليهن وقدرها رسولنا الكريم بأن خصها بحسن الصحبة للابناء وان الجنة تحت اقدام الامهات فكيف لنا ان نمتهن هذا المخلوق الضعيف النقي والذي هو بسمة وبلسم حياة الرجل ..... واوضح اني متزوج منذ اكثر من 23 سنة ولا زلت اكرر انها هي ام الحبيايب شاء من شاء ...............<br />لذلك انا اطلق عليه (( ام الحبياب ))...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134359/http://www.20at.com/article2.php?sid=76"

[[comments]]
order = 13
subject = "وزارةالداخلية"
author = "حاتم السوداني"
posted = "2006-07-22"
text = "إلي احمدالمصري موضعك ممتاز وانامن مدمني هذه الفكرة ولكن تركتهابدون عودة والسبب ان الله حباني بزوجةلاتحفظ الارقام ولاتفرق بينها ،قمت بتسجيل رقمهابأسم حبيةقلبي وفي يوم قامت بالإتصال بي في العمل صباحا وعندنهاية اليوم حضرت للمنزل فقامت تبحث عن رقم إحدي قريباتها فذهبت الي المكالمات المستلمة فوجدت حبيبةقلبي وكانت المشكلة بأني احب أخري ووووو وظنون وشكوك ولم تقتنع الا بعدان قمت بالإتصال بهذا الرقم امامها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134359/http://www.20at.com/article2.php?sid=76"

