order = 0
subject = "ماذا يفعل الزوج؟"
author = "أبو دم خفيف"
posted = "2005-12-13"
text = "لقد استثارني في نهاية الموضوع سؤالي يطرحه الكاتب ألا وهو ماذا يفعل الزوج إذا عرفت زوجته اسمها على تليفونه، إذا كان مسميها وزارة الداخلية هيقولها أنا مسميك كدا عشان بشعر معاك بالأمان، وإذا كان مسميهاالإرهابية هيقولها المسلمون دائما متهمون بالإرهاب وهذا نوع من انواع المقاومة، اما لو كان مسميها غلطة فيقولها\" أنا آسف مش عهمل كدا تاني\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134359/http://www.20at.com/article2.php?sid=76"

