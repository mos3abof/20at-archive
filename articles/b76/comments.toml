[[comments]]
order = 15
subject = "سكون الروح"
author = "هي بالفعل ظاهرة غريبة بس لكل مجتمع تقاليده"
posted = "2006-07-27"
text = "و انا بحب كثير تقاليد المجتمع السعودي بحس انه بيعطي قيمة للمراة فلس من هب و دب ممكن يشوفها و لا حد ممكن يجي ناحيتها عن جد يا بنات السعودية انتم محظوظات<br />و يارب تتمسكوا بتقاليدكم و تلتزموا بالحجاب و النقاب لا تغلطوا غلطتنا تحت اسم الحرية فقدنا اسسنا الدينية الا من رجمك ربيك على فكرة انا من المغرب<br />نرجع لموضوعنا الاساسي حبيت بس اقول انه الكلمة الطيبة صدقة فليش ما تنادي على زوجتك باسم حلو تبعث السرور ال فرح في قلبها تاخد فيها ثواب و حتى ادا دورت في جوالك زي العادة تلاقيك مسجل نمرتها باسم حلو يعجبها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134359/http://www.20at.com/article2.php?sid=76"

