[[comments]]
order = 7
subject = "حلقـة أولى !!!"
author = "مكتب المصريون"
posted = "2006-04-12"
text = "ولفتت المصادر إلى أن دوائر صناعة القرار تبنت في الفترة الأخيرة خيار تفريغ الحياة السياسية من أي قوي قادرة علي مواجهة مخطط التوريث وهو ما حدث بالفعل في حزبي الغد والوفد ، متوقعة أن تستمر هذه الاستراتيجية مع الأحزاب والقوى الأخرى حتى تكون الساحة مهيأة لتنفيذ السيناريو الخاص بتوريث السلطة.<br />وأشارت المصادر إلى أن القيادة السياسية أصبحت تتبنى في الفترة الأخيرة السيناريو اليمني والأردني في التعامل مع جماعة الإخوان المسلمين حيث نجح هذا النظامان في إفراغ تجربة الفصيلين الإسلاميين من مضمونهما عبر إظهار عجزها عن التعاطي مع المشاكل الشعبية ، وهو ما يتكرر الآن بشكل كبير مع جماعة الإخوان التي وضعتها الحكومة بين مطرقة الضربات الأمنية وسندان التجاهل الإعلامي حيث تفرض وسائل الإعلام حصارا مشددا على الجماعة ونوابها الـ 88 .<br />ولم تستبعد المصادر أن تكون الدولة قد هدفت من وراء نشر هذا الحوار المثير إلى التغطية علي الضجة الكبيرة التي أثارتها تصريحات الرئيس مبارك التي اتهم فيها الشيعة العرب بالولاء لإيران وليس لدولهم ، معتبرة أن حوار المرشد قد جاء كطوق نجاة للرئيس مبارك ، وأن قيام روزاليوسف بنشره في هذا التوقيت لم يكن مصادفة .<br />ولم تستبعد المصادر أن يكون الهدف من نشر الحوار هو \"إشعال حريق\" داخل الجماعة ، على غرار ما حدث في حزب الوفد ، حيث تراهن الحكومة على أن التركيز على الحوار قد يدفع ما يسمى بالتيار المعتدل داخل الجماعة إلى المطالبة باتخاذ إجراء ما ضد المرشد محمد مهدي عاكف من أجل إنقاذ سمعة مصداقية الجماعة أمام الرأي العام وحتى أمام كوادر وقواعد الجماعة نفسها ، وهو ما سيواجه بالطبع بمعارضة قوية من جانب الجناح المتشدد .<br />وفي سياق متصل ، تسود جماعة الإخوان المسلمين حالة من الغضب العارم تجاه نشر حوا<br />اقرأ بقية التعليق .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023029/http://masr.20at.com:80/article.php?sid=148&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 8
subject = "حرام على الاخوان وحرامين على الحكومه وعلى المواليين لهم والجاهل"
author = "one want hakkهاااااام"
posted = "2006-04-12"
text = "اولا الى الصحفييين<br />انتم قاعدين تهاجموا الجماعه فان كانواا خاطئين اليس هناك شيئا يسمى تصحيح الفكر بصاحب الفكر على ان يحكم وهناك كثير من المسلمين والعلماء الازهر وغيرهم من من يفتى بالموضوع فاساس النقد وضع الاصح وهم يتكلموون عن الاسلام اذن ناتى برجل عالم مسلم وليكن مفتى الديار وعلماء الازهر<br />ثانيا للبيت بيتك /وخاصه الاستاذ تامر الذى والله احبه ولكن فعل فعلا لا يؤاخذ عليه لان هذا التلفزيون موالى للحكومه كثيرا وهو انه لم ياتى بوجهين الاختلاف واتى بجاانب واحد فاذا اتينا بالفرد المدان واستمعنا لذلك ولاخر وهذا ما تفعله القنوات الا خرى حتى لوكان رئيس الجمهوريه<br />للاخ بقى بتاع المصور الى عامل اصلا زى المخبرين والحرميه وانا اسف لان هذا من عضبى على اسلامى وكل فر شاهد هذه الحلقه كان مع الاخوان وانتم بهذا تشوهون صوره الاسلام لا الاخوان فاءذا والله اهتممنا بالاسلام لا غيره من التفريعات اتينا كل زى حق حقه<br />الى المرشد/الله يسمحك على ما فعلت بنا من اساءه للمسلمين ولاسائتك للمصريين فهل هذاا من شيم الرسول الكريم وانا لا اؤاخك كالاخريين ولكننى اعتب عليك"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023029/http://masr.20at.com:80/article.php?sid=148&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 9
subject = "عبد الله مفتاح..كدا انت صح"
author = "نيفين"
posted = "2006-04-12"
text = "كدا منختلفش لان كدا انت بتقول اللى للاخوان و اللى عليهم<br />انا كنت متوقعه انك هتدافع على طول الخط بس كبستنى<br />فعلا مينفعش نعامل عاكف على انه لا ينطق عن الهوى و انه بيحيط بصغائر الامور<br />و مش هسخر منه زى ما عمل ناس كتير لماساله عمرو اديب عن بيل جيتس و معرفوش لانى بحترم الحريه الثقافيه لاى انسان بس انا بحس ان الاخوان هيكسبو كتير لو جددو كوادرهم بكوادر شبابيه اكثر الماما بتللك الامور"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023029/http://masr.20at.com:80/article.php?sid=148&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 10
subject = "مظلوم يا نيفين"
author = "عبدالله مفتاح"
posted = "2006-04-12"
text = "ايه الحكايه واحد يصر اني سلفي وميصدقص الا لما يشوف صورتي ويعرف اني لا سلفي ولا حاجه.<br />ونيفين فاكراني اخواني ابا عن جد ومش هقول اي حاجه ضد الاخوان<br />انا ولد عادي جدا جدا ومليش اي انتماءات سياسيه او دينيه<br />كل ما فيها ان الاخوان فعلا احسن شريحه موجوده في المجتمع السياسي ودي حقيقه لا ينكرها الا جاحد"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023029/http://masr.20at.com:80/article.php?sid=148&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

