text = "الاخوان جهلة جدا وخاضعين لانتماءاتهم الاولية الضيقة وناسيين اننا فى القرن الواحد والعشرين قرن العالمية والانسانية مش الدين والتخلف والبدائية والروابط الاولية.<br />الناس دى مش فاهمة حاجة<br />طظ فيهم وفى اللى بيحبوهم وبجد بجد ملكوش الا الضرب بالجزم يامتطرفين يا انصار الدولة الدينية الثيوقراطية المتخلفة الغبية"
