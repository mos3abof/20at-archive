[[comments]]
order = 13
subject = "اقول لهم"
author = "محمد"
posted = "2006-04-16"
text = "للاسف هناك من الناس من يصطاد فى الماء العكر ويحاول ان يظهر نفسه على حساب الآخرين وهذا لن يضر الإخوان ولن يزعز ثقتنا في قيادات الجماعة نحن أصحاب منهج وفكرلا يتغير لان منبعه الإسلام<br />أقول لمن لا يعرف الإخوان ....<br />إسمع منهم ولا تسمع عنهم اختلط بهم وصاحبهم تعرف من هم الإخوان<br />وأقول للاخوان ...<br />مهما قالوا ومهما شنعوا علينا فنحن ثابتون انشاء الله<br />( ورسالة خاصة لكلمن سمع الحوار)<br />هذه التصرحات بهذا الأسلوب الذي ورد في التلفزيون المصري لا تصدر عن شبل من اشبال الإخوان ) فكيف بمرشدنا الاستاذ مهدي عاكف الرجل الذى قضى اكثر من 20 عاما بالمعتقلات لانه يحب مصر"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023029/http://masr.20at.com:80/article.php?sid=148&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 14
subject = "لماذا روز اليوسف"
author = "معاذ"
posted = "2006-04-20"
text = "لماذا هذا الهجوم على روز اليوسف ؟؟<br />كلنا نعرف اتجاهاتها التي نعارضها بل ونحتقرها<br />ولكن لماذا الهجوم عليها اذ اثارت هذا الموضوع<br />ان كان المرشد اخطا فما المشكلة ان تنشر الخطا روز اليوسف او غيرها<br />بدلا من ان نلوم روز لاليوسف على نشرها الموضوع<br />دعونا نوجه اللوم لمرشد الاخوان الفاضل على كلماته التي تثير حفيظة شعب بكامل ضده"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023029/http://masr.20at.com:80/article.php?sid=148&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

