[[comments]]
order = 5
subject = "وانا كمان"
author = "مواطن عادى"
posted = "2006-04-11"
text = "كنت من شهر خارج وقعدنا فى الشارع ما يقرب من ساعه لا نتحرك<br />لوجود تشريفه او موكب حد الله اعلم مين<br />وبتلقائيه شديده وفى وسط كلامنا<br />كل من كان فى السياره<br />قال هى دى بلد الواحد يعيش فيها<br />واخرالله يخرب بيت البلد وو احد دى بلد بنت كلب<br />المقصد احيانا الواحد فى مواقف تخرج منه كلمات لا يقصدا بالمعنى الحرفى ولكن يقصد التذمر وخلافه<br />ولكن هذا لا يعفى المرشد من هذا الكلام<br />احب ان اوضح ان حمدى رزق هذا<br />والكل يعرف مخبر صحفى لامن الدوله"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023029/http://masr.20at.com:80/article.php?sid=148&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

