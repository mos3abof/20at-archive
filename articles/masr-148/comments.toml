[[comments]]
order = 0
subject = "البادىء اظلم"
author = "محمد السيد - حماسنا"
posted = "2006-04-11"
text = "ان خرجت الصفاقة من أهل الصفاقة فلا تكون ابدا \" صفاقة \" , فهؤلاء المتربصين دائما قليلى الحيلة , زادهم الله خيابة على خيابتهم ليس أمامهم إلا تصيد الكلمات و تقطيع الحوارات و لصق التصريحات , هؤلاء يريدون الهدم لا البناء و التنمية , قسما بالله العظيم هؤلاء لا يريدون التعامل إلا بلغتهم الكاذبة و نفاقهم الظاهـر المبين , هؤلاء هم حقا حثالة المجتمع و أرباب التخلف و الرجعية السياسية التى نعانى منهـا , لا يجب علينا ان نترجم لهم لغتهم , بل واجب ان نخاطبهم بلغتهم , و إن كان سلاحهم كاسيت , فنحن نمتلك ما لا يعرفون \" و سيعلم المنافقين إن شاء الله أى منقلب ينقلبون \" ."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023029/http://masr.20at.com:80/article.php?sid=148&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 1
subject = "طز في روزا اليوسف كلها"
author = "عبدالله مفتاح"
posted = "2006-04-11"
text = "الجاهل اللي اسمه حمدي رزق قعد يتكلم عن كلمة طز زي ميكون لفظ خارج وقعد يدينا محاضرة في القيم والمبادئ ونسي انه رقاص كبير<br />والجاهل التاني اللي اسمه عبدالله كمال قعد يتكلم عن ان هما دول الاخوان الحقيقيين زي ميكون عاملهم وخلاص فهمهم<br />من جهل الناس دي انها بتعامل المرشد على انه انسان لا ينطق عن الهوى ودي نقطة جهل كبيرة جدا ولا زم يعدلوها<br />ولا خليهم زي مهما كده كده بنكرههم وعارفين انهم ناس اشرار"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023029/http://masr.20at.com:80/article.php?sid=148&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "طز في روزاليوسف لكن"
author = "حمدي"
posted = "2006-04-11"
text = "ايوه صحيح طز في روزا اليوسف وطبعا نواياهم السيئه محدش بينكرها<br />لكن رجل في مثل منصب المرشد العام يجب ان يكون حريصا في كل كلمه يقولها للاعلام لانه لا يمثل نفسه بل يمثل تيار اسلامي ذو وجود كبير في الشارع الاسلامي وهو امل المصريين في التغيير في الفتره الحاليه<br />و لا ينبغي لنا نحن سواء كنا منتمين للتيار الاسلامي او من المتعاطفين معه كما يقال ان نبررر كل كلمه يقولها اي واحد منتمي للتيارالاسلامي سواء بالحق او بالباطل مهما بلغ وزنه من مبدأ انا واخوي علي ابن عمي وانا وابن عمي علي الغريب<br />بصراحه الكلام لا يليق ان يصدر عن رجل في نفس هذه المكانه ان صح نسبة هذا الكلام الي فضيلة المرشد"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023029/http://masr.20at.com:80/article.php?sid=148&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

