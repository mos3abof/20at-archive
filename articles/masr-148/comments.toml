[[comments]]
order = 16
subject = "طز والف طز في اللي نهبين خيرك يا مصر"
author = "رحاب شلبي"
posted = "2006-05-17"
text = "كل المسلمين في الدنيا معذبون فمنهم من لا يجد قوت يومه ومنهم من يجد علاج لولده<br />وحنروح في انحاء الدنيا ليه ما احنا اهو في مصر ام الدنياوطبعا القارئ ادرى بالرفاهية التي نعيشها<br />فبالله لو واحد ماليزي ولا حتى عبد اسود حبشي يرد للمتضررين من غرق العبارة حقوقهم ولا يوقف بيع عمر افندي ولا يمنع تهريب الاموال العامة ولا ولا ولا......مش يبقى الرجل عنده حق بس مع تصحيح العبارة كالتالي:<br />طز في المصري وأبو المصري وابنه المصري<br />اللي ضيعونا وضيعوا كرامتنا وخلوا هم كل مصري بس ازي يوفر لقمة العيش لابنه لا ن المصري اللي صعبان عليكم استبداله بماليزي بياكل الجاتوه بطايرة جاية من باريس<br />وحسبي الله ونعم الوكيل"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023029/http://masr.20at.com:80/article.php?sid=148&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

