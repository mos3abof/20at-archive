text = "ياعم المتطرف الأخوانى * كذاك الله كل خير*<br />لأن الأول كنا أحنا بس اللى عارفين حقيقتك دلوقتى الشعب كلة عرفك أنت واللى وراك وبقولهالك ياعم لو مش عجباك البلد دية سيبها ............طز طز فى مين فى البلد اللى أنياك أنت ومن معك وأنت مطارد وارهابى فى كل بلاد العالم حقيقى الشتيمة بتلف وترجع لصاحبها"
