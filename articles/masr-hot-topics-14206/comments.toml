text = "معركة مفتعلة زى معارك دون كيشوت ليس فيها اى عقل وطلعوا يكلموك على كرامة مصر وحق مصر<br />طيب فين كرامة مصر لما العالم كلة شاف وزيرة وضيعة معاها او ساقطة الاعدادية بتبوس ايدين امك انت وهو<br />هى دى كرامة مصر اللى هناخدها من الجزائر<br />رجعنا لبوس الايدى<br />والاخر يقول الجزائر وحرقوا العلم وضربونا<br />انتم اللى ضيعتم كرامة مصر"
