subject = "أمي الرائعة"
author = "الحسيني"
posted = "2006-01-11"
text = "أول من اكتشف هذه النظرية في الغالب أمي يرحمها الله فقد لاحظت أنها لا تفرط في الملاعق بسهولة وكانت الملعقة من دول - أي و الله_ تعيش عندنا بالعشرين سنة حتي تصير غير صالحة للاستخدام الآدمي وكان من عادتها رحمها الله أن تربط ما يأتيها من ملاعق جديدة بأستك وتضعها كأنها تحبسها مكبلة في أعماق أدراج المطبخ ومن يدري لعلها كانت تدرك هذه الخصلة في الملاعق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114800/http://www.20at.com/article2.php?sid=142"

