posted = "2005-12-22"
text = "انتو ازاي تكتبو عن المعالق ومتكتبوش على الشوك<br />هو ايه؟ الشوك بنت البطة السودة...<br />بعدسن في حاجة بقي باين السايت دة بقى فيه ناس شاربه حاجة ومشلاقيه مواضيع تكتب عليهافبكتبوا على أي حاجة..<br />ومش بعيد نييجي بكرة نلاقي موضوح ..كيف قتل زرار القميص الأبره"
