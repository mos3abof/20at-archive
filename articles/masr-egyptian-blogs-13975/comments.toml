posted = "2009-11-11"
text = "لا أحفظ الحديث النبوي المناسب ولكني أحفظ معناه وفي معنى الحديث رب كلمة يهوي بها صاحبها في النار .. إعرف الجزائر والجزائريين قبل أنا تطلق إتهاما كهذا .. وإن كانت مجموعة من الأطفال أحرقت قميص المنتخب الوطني وليس العلم المصري كما تزعمون .. فأظن أنكم رددتم عليها و أكثر من ما تستحق بحرقمك مرة لعلم الجزائر والثانية لعلم رسمتم عليه رأس كلب و عضمة على أنه علم الجزائر .. أخي كاتب الموضوع أنا أعيش مع المصريين مذ كنت في سن العشرة وأتقن المصرية أفضل من بعضهم وأعرف المدن والحواري والعزب في مصر كابن البلد .. ولكني إرتأيت أن أكتب لك بالعربية ردا على من يقول أننا لا نتقنها أو أننا لسنا عرب .. أخي كاتب الموضوع لا أقصد بردي الإساءة وإنما هذا مجرد تعقيب على كلامك .. وتقبل مروري هداني الله و إياك … أخوك عبدالله من الجزائر"
archived = "2009-11-11"
capture_url = "https://web.archive.org/web/20091111133837/http://www.20at.com:80/masr/egyptian-blogs/13975-2009-11-09-13-38-05.html"

