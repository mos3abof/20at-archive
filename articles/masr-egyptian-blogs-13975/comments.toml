posted = "2009-11-10"
text = "اتمنى من الله عزوجل انا يهدى الشعبين وفى كلا الوجهين رغم اننى مصرى<br />هنا نقص ايمان كل من المصريين والجزائريين .<br />نفسنا نتعاون ونتحد<br />بس دا ما يمنعشى ان مصر برده ان شاء الله هتكسب"
archived = "2009-11-11"
capture_url = "https://web.archive.org/web/20091111133837/http://www.20at.com:80/masr/egyptian-blogs/13975-2009-11-09-13-38-05.html"

[[comments]]
