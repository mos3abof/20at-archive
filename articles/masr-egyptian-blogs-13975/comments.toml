posted = "2009-11-11"
text = "الى الاخوة الجزائريين<br />انتم اخوتنا واشقائنا ونعزكم ونقدركم ونحترمكم كشعب مسلم مقاوم وبطل<br />ومن اجل مباراة كرة قدم من يكسبها سيصل الى المونديال ليهزم هزيمة منكرة امام منتخبات اوروبا وفى اول لقاء<br />لا يفسد العلاقة بين الشعبين مجموعة من مهاويس الكرة عندنا او عندكم<br />الرياضة اخلاق وليست كلها مكسب على طول او خسارة على طول فمرة نكسب ومرة نخسر وتكون الروح الرياضية عالية<br />وانا اشجع اللعبة الحلوة سواء فى فريقكم او فريقنا<br />فى مرة من المرات وكانت فرنسا تحارب المانيا فرنسا بقيادة نابليون<br />سال الضباط نابليون<br />نحن مسيحيون وهم ايضا الالمان مسيحيون فمع من يكون الرب ؟<br />فقال نابليون<br />الرب سيكون مع المدفعية الثقيلة<br />اى بالمعنى<br />ان الفريق الجيد المدرب هو الذى سيكون معة اللة ويفوز"
archived = "2009-11-13"
