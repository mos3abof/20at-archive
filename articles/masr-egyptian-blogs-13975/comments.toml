subject = ""
author = "جزائري"
posted = "2009-11-11"
text = "لقد قرأت كلمك كاملا … بعضه على العين والراس … وبعضه لا أصنفه بجانب براميل القمامة … وما لفت إنتباهي أنك تتكلم عن شعبي و بلدي وكأنك تعرفها حق المعرفة … وإليك بعض نقاطي :<br />الفرنسيييس لم يقتلونا إلا إذا كان من يموت في سبيل الدفاع عن الوطن يعتبر قتيلا .. فكم قتيلا في جعبتكم ؟ من يهود و أنجليز وفرنسيس !!!<br />ومن هنا أحب أن أشير أنه لا دخل للسياية بالكورة ومن يقحمها فهو ل يفهم في الإثنتين إجمالا ولا تفصيلا ..<br />قرأت عناوين الصفح التي \" تزعم أنها جزائري\" سؤالي لك … لماذا لا تأتي بالمصدر من الصحيفة نفسها وليس من موقع مصري .. فهل أنا مجبر أن أصدق أنا هذا الكلام منقول عن صحف بلادي .. حتى لو كان ما تقوله صحيحا أحب أن أشير لك كما يوجد هناك صحف وصحفيين تافهين ومحرضين عندنا .. فما أكثرهم عندكم !! بل ما أكثر المؤولين الذين فضحنا أمرهم و كذبهم … أخي كاتب الموضوع إفترائك بأن الشعب الجزائري يكره المصري ما هو إلا إفتراء كاذب .. 15000 موظوف مصري يعملون بالجزائر .. عائلات مصرية مقيمة بالجزائر..علاقات مصاهرة بين مصريين وجزائريين .. فهل هذا دليل على الكره ؟؟ لا أعتقد"
archived = "2009-11-11"
capture_url = "https://web.archive.org/web/20091111133837/http://www.20at.com:80/masr/egyptian-blogs/13975-2009-11-09-13-38-05.html"

