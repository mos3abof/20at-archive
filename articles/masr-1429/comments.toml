author = "عماد محمد بكر"
posted = "2007-01-14"
text = "فعلاً وللاسف أصبح كل شعب مصر منتهكون في كرامتهم ومسلوبون من آدميتهم للاسف ، وكيف هذا بواسطة جميع السلطات .<br />قد سمعت من أحد الاشقاء العرب أنه من الحكمة لكل من يحترم نفسة الابتعاد عن التحدث في القنوات الفضائية بالذات من يقومون بالدفاع عن هذه السلطات لانهم وللاسف كلهم مسوخ ولايمكن تخيل من أين يأتون بالقدرة على الكلام و الدفاع عن انفسهم وعن ساداتهم ؟ فقلت له .. كيف تتخيل أن يحترمون أنفسهم ،عندنا مثل بيقول اللي اختشوا ماتوا .....لنـــــــــــا الله محمود المصري."
