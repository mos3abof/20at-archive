[[comments]]
order = 13
subject = "يــــــــــــــــــــــارب"
author = "محمود المصري"
posted = "2007-01-14"
text = "حســــــــــــبي الله ونعم الوكيل في كل انسان فقد انسانيته ، لست أدري الى أي مدى كل العصابة الحاكمة في مصر المحروسة أقصد (اللي بقت مخروبة )انعدم عندهم الاحساس ، و الله أنا اصبحت مثل الالاف المؤلفة من المصريين باأشعر بالخزي و العار على اني مصري بسبب هذه العصابة الحاكمة و زبانيتها ، و الحقيقة أن جميع اخواننا العرب دائما مايشيدون بنا كأفراد نعمل الى جانبهم ونشيدمعهم بلادهمبكل الحب و الاخلاص ، وكثيراً مايشعرون تجاهنا بالشفقة بعد ماوصلت اليه الامور أخيراً،و بعد الكثير من المواضيع التى تحدث يوم بعد يوم، والحقيقة أنا مش شايف أن هناك نهاية لهذا ، لان كل يوم بيزيد عن اليوم السابق ، ويصبح معتقل جوانتناموا بالنسبة لما يحدث بمصر كلها وليس بسجون وأقسام بوليس مصر فندق سبع نجوم .<br />ثقافة الطغمة الحاكمة في مصر وعلى رأسهم رئيس العصابة يتبنون منطق (الناس بتنسى) وعندهم حق الامريكان يفعلوا هذا ، واللي عنده اعتراض يقارن ، ليس لدينا ما نقول سوى يـــــــــــــارب !!"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118162037/http://masr.20at.com:80/article.php?sid=1429"

