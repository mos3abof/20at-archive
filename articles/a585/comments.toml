[[comments]]
order = 1
subject = "حالم بمستقبل مشرق"
text = "يا ترى هل هو الوحيد الخائن الذي تربى في أحضان القوى المعادية للأمة، ويهيئونهم للسيطرة على مقدرات الشعوب المقهورة؟ ولا أقصد بسؤالي هذا الاستهانة بما فعله ويفعله هذا الخائن.<br />ولدي سؤال حرت في الإجابة عليه، وهو إلى متى ستبقى أمتنا ترضى بان يتولى زمام أمورها مثل هؤلاء الخونة؟"
archived = "2004-09-05"
capture_url = "https://web.archive.org/web/20040905180832/http://www.20at.com:80/article.php?sid=585"

[[comments]]
order = 2
subject = "منه لله اللى كان السبب"
text = "فى اللى بيحصل فى العراق , والموضوع كويس يا بيرو ربنا يوفقك"
archived = "2004-09-05"
capture_url = "https://web.archive.org/web/20040905180832/http://www.20at.com:80/article.php?sid=585"

[[comments]]
order = 3
subject = "سونيا"
text = "طب صدام ماله بقى ... سيوا الراجل في حاله !!!!!!!!!!!<br />صدام وعلاوي هما وجهي العملة لا يظهر أحدهما إلا في غياب الآخر .. وكلاهما عرائس ماريونت في يد الأمريكان بطريقة أو بأخرى إلا أنها عرائس ماريونت قاتلة بجدارة وهذا ما يؤهلها لدورها المطلوب أمريكيا"
archived = "2004-09-05"
capture_url = "https://web.archive.org/web/20040905180832/http://www.20at.com:80/article.php?sid=585"

[[comments]]
order = 4
subject = "كلام ... يحتاج لتوثيق.."
text = "هذا الكلام لم يتحدث كاتبه عن مصدره حتى يمكننا التاكد و الوثوق به خاصة و اننا نحتاج لمثل هذه المصادر للتثبت من المعلومات في نقاشاتنا"
archived = "2004-09-05"
capture_url = "https://web.archive.org/web/20040905180832/http://www.20at.com:80/article.php?sid=585"

[[comments]]
order = 5
subject = "مطراوي"
text = "الأخ اللي فوق ...لو حضرتك رجعت لآخر سطر في المقال هتلاقي مكتوب ان المعلومات دي ليها مصدر ...ولو حضرتك عايز تعترض يكون الغعتراض كالآتي ...<br />بما إن المقال منقول عن لجنة متابعة المتعاونين مع الإحتلال ...يبقي إيه لازمة إن إسم البراء أشرف يكون في اول المقال ...<br />وحتي لو كنت سألت السؤال ده الرد يكون إن البراء هو اللي جاب الموضوع وهو اللي وصله وبالتالي فليه الحق إنه يكتب إسمه ...<br />شكرا"
archived = "2004-09-05"
capture_url = "https://web.archive.org/web/20040905180832/http://www.20at.com:80/article.php?sid=585"

[[comments]]
order = 6
subject = "الحل ان يؤتى بواحد من رجالات القاعدة..."
text = "الرئيس المخلوع دكتاتور وجبار وطاغية والحالى عميل وخانع وذيل اذا مالحل هل يؤتى بواحد من رجالات القاعدة او طالبان اعتقد ان هذا ماترمى اليه.ياراجل سيبوا الناس فى حالها هذه طرهات كانت رائجة فى القرن العشرين."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018114636/http://www.20at.com:80/article.php?sid=585"

[[comments]]
order = 7
subject = "ردا على..."
text = "ردا على صاحب التعليق (الحل ان يؤتى بواحد من رجالات القاعدة...)<br />مع احترامي لما ترى فإني أختلف معك... وأقول أن هل الدنيا ليس بها أناس بين هذا وذاك، أي إما أقصى اليمن أو أقصى اليسار...ألا يوجد وسط.<br />على سبيل المثال، حكومة تركيا. لا تتفق معي أنهم أناس محترمون، ويعملون لمصلحة بلادهم... وإنهم لا يقبلون أن يكونوا عملاء وخونة... واكتسبوا احترام كل الطوائف. حتى العلمانيين الذين يعادون أي فكرة إسلامية... أليس كذلك؟<br />مع خالص تقديري لك، وخالص الشكر لموقع عشرينات.<br />.......................حالم بمستقبل مشرق........."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018114636/http://www.20at.com:80/article.php?sid=585"

