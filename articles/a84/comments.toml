subject = "يا عم شوف لك حتة ناشفة و اقعد فيها"
text = "و حياة أمي برنامج<br />هايف<br />و كل اللي<br />بيتابعووه هايفين و هبل كمان<br />و بدل تضييع الوقت<br />دور لك على تربة<br />قبل الزحمة<br />HMH"
archived = "2004-04-17"
