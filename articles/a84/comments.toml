[[comments]]
order = 3
subject = "SLAMAMUSLM"
text = "الله يسامح اخواتنا اللى اشتركو فى المهزلة دى فى وقت احنا مجروحين فيه باستشهاد الشيخ ياسين عليه رحمة الله وفى وقت مش لاقيين لقمة العيش وفى وقت احتلت فيه العراق ومش عارفين المركب هاترسى فين وفى وقت احنا محتاجين فيه اننا نتوحد بقى يعنى مش حرام على اللى عاملين البرنامج ده ان كانوا يعرفوا الحرام اصلا تضييع وقتنا فى الكلام الفارغ وفرضا لو يااخ محمد عطية انت وغيرك ربنا اخد روحك فى الاكاديمية كان هاتقوله ايه كنت هاتقوله يارب اسمع صوتى كده شوية ولاشوف الرقصة دى ولا شوفنى يارب وانا بابوس الامورة دى<br />والله العظيم ربنا هايحاسبكوا حساب عسير ان متبتوش اليه وعلى الاثر السيئ على اولادنا كل مرة هانقول اليهود اللى بيعملوها طب ادنتوا مش يهود عرفتوا ليه احنا فى زلة وهوان علطول واقدم اليك يااخ محمد عطية وهنيئا على الفلوس الله هاتكسبها بدون تعب اقدم ليك قصيدة ارثى فيها الشهيد احمد ياسين يمكن نحس بهمومنا الحقيقية<br />\"العنوان: رثاء شيخ الشهداء\"<br />أرثى دماءك من دمى**** ياعزَ فخر المسلم<br />إختارك الله لـــــــــــــه **** فعليك كل ترحمى<br />ياسين يأبى ربنـــــــا **** إلا بدك الاعظـــــم<br />تلك العظام الشامخات **** الطاعنات تقـــــدم<br />وبرغم طعن سنيك **** فى ضوء فجر باسم<br />قد توج الله بك **** هام الفداء الاكرم<br />ولأنت تاج شهادة **** ترفعها فوق الانجم<br />كم كان قلبك لاهثا **** عنها بصدق متيم<br />تمسى تساءل نجمها **** فى ليل جبن معتم<br />هل آن يبرق لى ضيا **** نجم ويأخذ من دمى<br />إنى أريد تلاقيا **** بنبى ذاك الخاتم<br />وبحزبه وبآله **** بجنان رب منعم<br />فأصاخت الحسنى لك **** من بعد طول ترنم<br />فى حسن خاتمة المنى**** تذرى بمكر الآثم<br />من مقعد ثوراته **** نبضات جسم معدم<br />صنو العبادة والسهر **** من آل دار الأرقم<br />كالطود فى وجه العدا **** بل سهم ربى الراجم<br />يرمى بك الله فدى **** قلب الحقود المجرم<br />ربيت أنعم بالأب **** أبطال نصر قادم<br />لألاء عذب حديثك **** درٌ كنور فى فم<br />فى تؤدة عبئتهم **** فرسان حق حاسم<br />كالبدر هام بنجمه **** اوخاتم فى معصم<br />فإذا تربى فعالم **** وإذا أمرت كحاكم<br />للبيب أمرك ثلة **** رهن الاشارة ترتمى<br />ببنات فكرك صغتهم **** لايوزنوا بالدرهم<br />وسيوزنوا بثباتهم ****فى دار خلد الراحم<br />للسلم أنت مسالم **** للحرب فارسها الكمى<br />ياسين من صدق الاله **** بجوف قلب مفعم<br />يصدقه رب واهب **** والخير فى وعد همى<br />قصدوك بعد تضرع***واتصل فيض المنعم<br />وقرأت وردك فازدهى**ايمان قلب حازم<br />واشع نور الذكرفى***جنباتك كالبلسم<br />وخرجت باليسرىفكنـــت كحمام روض حوم<br />قد كان همك سيدى***رضاء رب راحم<br />فما اختفيت تحرزا***أوخفت بطش تحتمى<br />كلا ومن وهب الحياة***ياسين ذاك الملهم<br />سمىُ \"أحمد\"تجتلى *** سنن النبى الهاشمى<br />أرثيك ام اهنأ بك***والله فزت بأكرم<br />بمقام صدق نلته***يامن لدينك تنتمى<br />الآن تسرح راضيا***بجنان خلد فانعمى<br />واخالك فى نضرة***حسن الشباب الاوسم<br />وأراك وجهك يكتسى***فرحا ببشر ناعم<br />واحس لمس يدا النبى**على الجبين كبلسم<br />مامت ياياسين لكن***تحيا بعين اليتم<br />فديتك شيخى خلفك***جيل الفداء الاعظم<br />للحق باعوانفوسهم***هم فى القطار القادم<br />للقدس للاقصى فدا***عرس توشح بالدم<br />إن غاب منهم ضيغم***يخلف دماه بضيغم<br />فعزاؤنا فى اخوة***كالهادى فى ليل عم<br />شرف لامة احمد***احيوا الجهاد بصارم<br />يارب جندك مدهم***ضد الظلوم الغاشم<br />واقصم بهم ياربنا***صهيون حقد مجرم<br />ياسين قد علمتنا***درب الجهاد المحكم<br />ودليلنابكتابنــا***قرآن ربى المنجم<br />ووراء أحمد قدتنا***جزلا بغير تجهم<br />اعذرت لله فمــا***لنت لبغى الآثم<br />كرسى عجزك يمتطى*صهو الجواد المطهم<br />وفضحت فينا كراسيا**ترضى الجبان الناقم<br />هانت لدنيا دستها***هاماتهم فى قمقم<br />ياسين يافخر الدنا***يافخر دينى الاقوم<br />ربحت جنة واهب***جنب النبى الباسم<br />إهنأ بجنتك فلا***نامت عيون اللوم<br />فزت وخسر الشانئ**أنا لاأراه بآدمى<br />بل كتلة للحقد قد***شرب الدما من أعظم<br />رباه فالعنه وخذ***ثأرا لشيخى الاكرم<br />تمت بحمد الله<br />والسلام عليكم ورحمة الله وبركاته<br />ومعذرة ان اطلت ومعذرة ان تجرأت عليكو شوية وربنا يسامحنا جميعا"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417074645/http://www.20at.com:80/article.php?sid=84"

[[comments]]
order = 4
subject = "لاحول ولا قوة الا بالله"
text = "انا بس بدي اعلق على مسألة سجود محمد عطية بعد فوزه اللي بتدل على حالة التناقض التي يعيشها بعض الشباب فهو يفصل حبه لله وشكره له عن عناقه للبنات اللي هو حرااااااااااام انا مش قادرة استوعب هو كيف جامع الشعورين!!!!!!!!!<br />كمان مرة في الجامعة عملنا نقاش عن تلفزيون الواقع وقالت احدى الطالبات \"للعلم في مشارك من ستار اكاديمي ما بقطع فرض وبصلي كل صلاة بصلاتها!!!!!\"اتا مش عارفة مين هو بالضبط بس مش هادا موضوع مهم ناخد بالنا منه يعني شو الفيدة من الصلة ازا ما نهت عن المنكر!!!!!<br />انا شايفة انه في فصل كبير ولبس واختلاظ مفاهيم صاير في العقول انتو معاي؟؟؟؟؟؟"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417074645/http://www.20at.com:80/article.php?sid=84"

[[comments]]
order = 5
subject = "الموضوع دا فعلا كــــــــــــارثة"
text = "إن فعلا وصل الموضوع ببعض الشباب للتفرقة التامة بين الفروض والعبادات وبين حياتةالشخصية والعملية وكأنه يؤدي ما عليه من فروض لسداد دين معين بينه وبين الله (سبحانه وتعالى)... وبعد كده يكون (عداه العيب)ومسموح له أن يفعل ما يشاء.<br />وأعرف أحد الشباب يعود الى منزله مصطحباباقة من الcd<br />المليئة بأحدث الأفلام الجنسية... ليتوضاء ثم يصلي العشاء ويتبعها بالنوافل ثم وبعد ذلك مباشرة..!!<br />يبداء بمشاهدة هذه الأفلام الواحد تلو الأخر مع<br />ما يصحبها من ممارسة عادات مذمومة<br />ثم يقوم فيغتسل.... فينام ليقوم فيصلي الفجر<br />في المسجد.. ويقرأ وردا من القرآن............وهكذا<br />وحقيقة أنا لا أرى دخلا في هذا السلوك المتضاد (للدعاة الجدد) كما جاء في تعليق سابق لفيلسوف العصر اللذي أبدع في ترميز أسماء(عمرو خالد و أحمد الفيشاوي) حتى أني مندهش من تمكني من معرفة الأسماء بعد هذا الترميز المتمكن...<br />ولن أفتي أنا أيضا في أسباب إزدياد ظاهرة (ساعة لقلبك وساعة لربك) هذه بمعناها الحقيقي وإن كنت أرجح رجوعها لأسباب تتعلق بالقدوة والتنشئة (مثال على هذا: أن نجد الأب يؤكد على الإبن ضرورة عدم الكذب تحت أي ظرف ثم هو في نفس الوقت يأمره بأن يجيب على من يسأل عنه في الهاتف بأن(والله بابا مش موجود دلوئتي).. وهو يجلس بجواره.<br />وربنا يهدينا جميعا إلى ما يحبه ويرضاه<br />((ملحوظة هامة: يستطيع كل من شاهد لحظة فوز الشيخ محمد عطية أنه -ربنا يسامحه- سجد سجدة شكر للجمـــهور وليس لله مع الأسف))"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417074645/http://www.20at.com:80/article.php?sid=84"

[[comments]]
order = 6
subject = "محمد عطية وأحمد ياسين"
text = "والله أنا اقرأ عن محمد عطية وأنا اشعر بالعار والخزى من هذا الواقع الاليم والذى نجح فيه الغرب بجدارة على جعل الشباب العربى مسخ عديمة المعنى أو القيمة تشعر كل من يراها بالتفاهة والمهانة والمصيبة انه يزعم ان هذا تحرر وروشنة وروح شبابية ويفصل بينها وبين الدين فالدين شئ والتحرر منه شئ اخر ويظهر محمد عطية فى نفس الوقت الذى يختفى فيه احمد ياسين وتنضم دول العالم بأسره لمحاربة المسلمين فى كل مكان وللأسف الشديد انا من نفس المدينة التى يقطنها محمد عطية وخريجة لنفس الكلية التى يدرس بها وأجد الكثير جدا من اشباه محمد هذا فى كل مكان"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417074645/http://www.20at.com:80/article.php?sid=84"

[[comments]]
order = 7
subject = "الإسلام بخير و النصر للمسلمين بأمثال هؤلاء"
text = "و نعم الأخلاق ، و نعم التربية ، هكذا سنسترد المسجد الأقصى ، هكذا سندحر كيد أعدائنا ، هكذا سننتصر على المتربصين بنا، هكذا سنبيض وجه نبينا....بهؤلاء المخنثين و المخنثات الزناه العرايا المراقيع ، توتو و ميمى و سوسو، بهؤلاء المخنثين و أشباه الرجال....بهؤلاء نخاف أن ينزل علينا سخط الجبار المنتقم<br />ربنا لا تؤاخذنا بما فعل السفهاء المراقيع منا...لا تتؤخذنا بتوتو و ميمى و سوسو و من على شاكلتهم"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417074645/http://www.20at.com:80/article.php?sid=84"

