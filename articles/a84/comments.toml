[[comments]]
order = 1
subject = "من ثمارهم تعرفونهم"
text = "هذة النماذج الممسوخة التى يروج لها الآعلام ليقلدها الشباب حتى صرنا لانعرف الرجل من المرأة الا بصعوبة<br />كل ذلك هو ثمرة للاعلام الحر المتفتح كما يدعون<br />والتربية المتحررة وضرورة مصادقة الابناء الى اخر هذا الهراء<br />اما عن صلاة او سجدة الشكر فلا تتعجب فهذة نهاية المنهج الاحول الذى يتبعة بعض من ينتسب للدعوة الاسلامية وباسم سماحة الاسلام والتيسير على الناس يبيحون كل شىء فى سلسلة طويلة من التنازلات -ولابد ان تكون طويلة لان الشيطان يعمل ببطء شديد-<br />سلسلة من ع/خ وحتى ا/ الف*** وباقى فريق يلا يا شباب الذين هم ثمرة هذة الصحوة"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417074645/http://www.20at.com:80/article.php?sid=84"

