[[comments]]
order = 2
subject = "الصعيدي لما يتمدن"
author = "سحس"
posted = "2007-01-10"
text = "المشكلة ان السينما الامريكية غرقت السوق بهذه النوعية من الأفلام .. بانتاج قوى وافكار مبتكرة وسناريوهات محبكة وممثلين على قدر عال من الحرافية .. الامر الذى يجعل انتاج عالمنا الثالث لهذه النوعية من الافلام نوع من المسخ المقيت.. يخرج معه الفيلم على طريقة الصعيدى لما يتمدن<br />انا شايف ان تميز اى ابداع يأتى من تجسيده لبيئته المحلية وهذا ما اوصل نجيب محفوظ للعالمية، وهذا ما جعل رواياته تصدر للثقافات الأجنبية لاستكشاف البيئة المصرية بكل تفصيلاتها والتعرف على شخصية المصري - بانتماءاته الثقافية والطبقية - بكل ما فيها نقاط قوة وضعف.<br />ما الذي يجبرنى كمشاهد على الجلوس ساعة أو أكثر امام مسخ مشوه فى حين ان الافلام الامريكانى (الأصل موجودة) ؟ هذا لا يعنى الدعوة لمقاطعة السينما المصرية والاكتفاء بمشاهدة ما نتنجه هوليوود.. ولا هو تقليل من الذات إنما أدعو للتركيز على قضايانا المحلية فى قالب مصري صميم عبر عنا وعن قضايانا وليس قالبا أمريكاني.<br />أما بخصوص وصف نبيل فاروق بأنه الكاتب الكبير .. فأظن أنه يقصد \"كبير\" فى السن لأن أغلب من قرأوا له - وبالمناسبة لست واحدا منهم والحمد لله- كانوا أطفالا صغارا .. رأوا فى كتاباته عالما من الخيال الملئ بالمغامرات والتشويق."
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112134911/http://masr.20at.com:80/article.php?sid=1422"

[[comments]]
order = 3
subject = "المعتقلون"
author = "الحاضر يبلغ الغايب"
posted = "2007-01-10"
text = "المعتقلون<br />أخبار يومية || كشوف لأسماء بعض المعتقلين<br />خبر صحفى 5 أكتوبر 2005<br />انصفوهم<br />المعتقلون في مصر<br />همه مين ؟ وكام ؟ وفين؟؟؟<br />أجلالا لمعاناة الالم و أحزان القهر لدي \" هؤلاء \" الذين اجبروا علي التجرع من كأس الفقد و الفقدان فقد الناس و فقدان الوطن علي ايدي من لا يدركون قيمة العدل ولا راحة الرحمة<br />وإحساسا بمعاناة اهاليهم و احبائهم و احياء للامال و الأحلام في عيون ابنائهم بخروج اخر واحد من \" هؤلاء \" يوم شروق الحرية و ظهور الحق .<br />تعلن جمعية المساعدة القانونية لحقوق الانسان عن رغبتها في مشاركة كافة قوي المجتمع السياسية والاجتماعية التي تتحرك منذ فترة ليست بالقليلة في سبيل الافراج عن وانصاف المعتقلون بمقار الاعتقال و السجون المصرية وذلك من خلال ايجاد اجابات علي قدر من الوضوح و الشفافية والحقيقة فيما يتعلق باعداد المعتقلون , واماكن و ظروف اعتقالهم كخطوة اولية لابد منها قبل او بالتوازي مع التحرك من اجل انصافهم والافراج عنهم و تعويضهم .<br />ما يثير الفزع في قضية المعتقلون في مصر خلاف التجاهل التام من قبل المسؤلين و الجهات المعنية , هو غياب اية معلومات رسمية او موثقة عن الاعداد الحقيقية الهائلة من المصريين الذين تعرضوا , ويتعرضون للاعتقال و السجن بمقار الاعتقال و السجون المصرية , او عن اسباب و ظروف و اماكن اعتقالهم .<br />عشرات الالاف من المصريين قد انتزعوا قسرا من حياتهم وحرموا من حريتهم و من حقهم في الحياة الكريمة ومازال الرأي العام لا يعلم العدد الحقيقي من \" هؤلاء\" الذين قبعوا<br />و يق<br />اقرأ بقية التعليق .."
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112134911/http://masr.20at.com:80/article.php?sid=1422"

