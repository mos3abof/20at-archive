subject = "الكلام ده فى مصرولا فى حتة تانية"
author = "max"
posted = "2006-04-01"
text = "بصراحة ياجماعة انا كنت قاعد فى الجامعة فى امان الله ومرة واحدة لقيت واحد صاحبى بيقلى تخيل حصل ايه النهاردة فى مصر قلتله ايه ......جمال مسك ولاايه فضحك قلى لا ده حزب الوفد النهاردة كان فيه ضرب نار<br />ناس معاها مسدسات ولا ايه الله اعلم وضربو على الموظفين نار ومنعهوهم من دخول الحزب بصراحة انا قلت ديه كدبة ابريل بس دلوقتى عرفت انها فجعة ابريل بصراحة انا مش متخيل ان ده ممكن يحصل فى مصر ده لا يمكن يكون عندهم عقل ولا اخلاق ولا اى حاجة انا مش مستوعب ازاى ده يحصل فين الدين فى العقل هنقول ايه ولا ايه .......وتحيا مصر"
archived = "2006-05-25"
