[[comments]]
order = 2
subject = "اعتقال الشرطة لنعمان جمعة وستة اخرين للاستجواب"
author = "رويترز - عاجل"
posted = "2006-04-01"
text = "قالت الشرطة ان انصار زعيم حزب<br />الوفد المصري المعزول نعمان جمعة اقتحموا مقر الحزب في القاهرة اليوم السبت<br />وان ثمانية اشخاص اصيبوا بجروح جراء اطلاق النار عليهم.<br />واصيب نحو 15 اخرين ايضا بعد ان وصل جمعة الذي عزل من قيادة الحزب في<br />يناير كانون الثاني الى المقر بصحبة العشرات من انصاره.<br />وقال اطباء ان ثلاثة من الذين اصيبوا باعيرة نارية حالتهم خطيرة. وقالت<br />الشرطة ان من بين الذين اصيبوا باعيرة نارية صحفيون وموظفون بالحزب كانوا<br />داخل المبنى لدى وصول جمعة.<br />ولم تتمكن الشرطة من تحديد المسؤولين عن اطلاق النار.<br />واعتقلت الشرطة في وقت لاحق نعمان جمعه وتوجهت به الى مكتب النائب العام<br />للاستجواب. كما اعتقل ستة من انصاره. وعبر نحو 200 من معارضي جمعه الذين<br />تجمعوا امام مقر الحزب عن فرحتهم بعد ان اقتادته السلطات بعيدا.<br />ثم حملوا محمود اباظة نائب رئيس الحزب على اكتافهم ورددوا هتافات مؤيدة<br />له.<br />وحل جمعة في المرتبة الثالثة بفارق كبير عن الرئيس حسني مبارك في أول<br />انتخابات رئاسية تعددية اجريت العام الماضي بحصوله على ثلاثة في المئة فقط من<br />اصوات الناخبين. وللحزب ستة مقاعد فقط من بين مقاعد البرلمان البالغ عددها<br />444 مقعدا.<br />وكانت المحكمة ايدت حق جمعة في دخول مقر الحزب. ولا يزال جمعة يقول انه<br />رئيس الحزب ويصر على أن مجموعة صغيرة من المنشقين داخل الحزب هي التي اطاحت به.<br />وبعد اقصائه انتخب الوفد مصطفى الطويل رئيسا جديدا خلال اجتماع<br />لجمعيته العمومية.<br />وكان حزب الوفد الاصلي الذي تعود جذوره الى وفد غير رسمي سعى للاستقلال عن<br />بريطانيا في عام 1919 قد هيمن على الساحة السياسية في مصر الى ان قامت ثورة<br />1952 التي حظر بعدها ضباط الجيش الذين استولوا على السلطة نشاط الاحزاب<br />السياسية.<br />اقرأ بقية التعليق .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015829/http://masr.20at.com:80/article.php?sid=103&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

