author = "مريم الاميري"
posted = "2010-01-08"
text = "وشكرا على الموضوع … فيه ناس بتحب القراءه اوي و بتشتري كتب كتير و فيه ناس بتشتري كتب من غير ما تقراها و في الحالتين ده بيكلف فلوس كتير و خصوصا ان فيه كتب غاليه ده بالاضافه الى وجود المكتبات في اماكن متباعده فده بيستهلك وقت كبير فممكن اللجوء لمعارض الكتب لان بيكون عليها خصم و كمان بتكون المكتبات فيه قريبه من بعضها و كمان ممكن اللجوء للمحلات اللى بتبيع كتب مستعمله يمكن شراء كتب في حاله جيده و كمان رخيصه شويه و بكده نقدر نشتري كتب اكتر او نقلل من الفلوس المدفوع"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212092216/http://www.20at.com:80/banat/self-development/14175-2009-11-25-15-59-46.html"

