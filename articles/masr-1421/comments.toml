subject = "سراندوا !!!!!!! فى مصر دى ؟؟؟"
author = "فارس_fr"
posted = "2007-01-10"
text = "اولا احب احييكى يا هبة على مقالك الاكثر من ممتاز , واللى سلطتى فيه الضوء على انتهاك جديد لحقوق لمواطن (الفلاح ) المصري منقبل ذوى السلطة والنفوذ .<br />بس والله انا اول ما قرات اسم العزبة افتكرت انها اسم مقاطعة فى فرنسااو انجلترا متخيلتش انها عزبة مصرية عمومااسمها جميل ,, ماعلينا ,, بغض النظر عن الاسم , انتهاكات الامن والشرطة لحقوق الشعب بلاش اقول عليه الجبان لان الفلاحين هنا اخذوا موقف واعترضوا على ضياع حقوقهم لصالح اقطاعى من ذوى السلطة والنفوذ ,<br />ويمكن الحادثة دى تكونفاتحة خير علينا واشوف الناس كلها بتعترض على الاوضاع المتردية اللى وصلنا ليها من قمع وظلم وفساد وتلوث .<br />ومواطنه (قال مواطنه قال ) يمكن تكوندى بداية خير والله فكرتونى بالصورة دى بحادثة دنشواى يمكن يكون فى ثورة شعبية قريبة , ثورة على الطاغية مبارك واذنابة .<br />*تحياتي ليكى يا هبة .<br />ابن بهية فينك !!!!!!!!!!!!!!!!!"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112135220/http://masr.20at.com:80/article.php?sid=1421"

[[comments]]
order = 1
subject = "ليعدموهم جوعاً .. عقاب الاستعباط .."
author = "شكرا أستاذة هبه .. وشكراً يا أستاذ فارس على الدعوة الكريمة .. وأحييك على تعليقك المميز كالعادة .."
posted = "2007-01-10"
text = "أظن يا جماعه أن هؤلاء الفلاحين .. مجرمين فعلاً .. .. لو الجلسة فيها قاضي من بتوع نادي القضاه .. بتوع الشرف دول فربما مات قبل النطق بالحكم بسبب انفجار شرايين عقله (لا قدر الله) .. شايفين ليه مبارك الواطي .. حبيب الملاعين .. مصمصم كل الصمصمة على ألا يترك الحرية للقضاة ليستقلوا عن سلطاته ؟ صعبان عليه شرايين عقول القضاة .. وكمان عشان ما يجيش يوم نلاقي قاضي بيحكم لصالح مجرمين زي دول وينصفهم على أسيادهم المبروكين .. أعتقد أن أي قاضي عادل من بتوع مبارك سيحكم عليهم بالإعدام جوعاً بعد تأديبهم شويتين تلاته لعدة أسباب أهمها طبعا الاستعباط ..<br />بيستعبطوا وعاملين نفسهم فلاحين وهم طلبة في الأزهر ..<br />بيستعبطوا وعاملين نفسهم مش في مصر مبارك الواطي .. وقال إيه بيدافعوا عن حقوقهم ؟!<br />بيستعبطوا وعاملين نفسهم مش فاهمين التغيرات الجديدة .. طيب أهو فخفخامة جلالة الواطي هيريحكم خالص .. أنتم وأمثالكم وراح يجيبهالكم دستوري .. مسح الاشتراكية من الدستور زي ما مسحها عمليا من يوم ما دلدل رجليه على كرسي الحكم؟!<br />بيستعبطوا وعاملين نفسهم مش عارفين بأن عبدالناصر مات .. الله يرحمه.<br />الأكاده أكتر إنهم ..<br />بيستعبطوا وعاملين نفسهم مواطنين .. وهم يا دوب .. يا دوب يا دوب .. مصريين ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112135220/http://masr.20at.com:80/article.php?sid=1421"

