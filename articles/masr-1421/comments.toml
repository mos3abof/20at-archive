subject = "مات عبد الناصر"
author = "كان بيحلم ببناء اوبرا فى كل قرية عربية"
posted = "2007-01-10"
text = "وكان بيحلم بتماثيل على الترعة<br />اغانى عبد الحليم وصلاح جاهين<br />رجعت دنشواى وبطرس غالى الكبير بتاع الاعدامات وبدل التماثيل اللى على الترعة هتلاقى المشانق وبرضة محدش حاسس<br />يافلاحين انسوا وانسوا<br />للبيت رب يحمية وللفقراء رب جبار منتقم"
