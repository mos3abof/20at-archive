[[comments]]
order = 3
subject = "اخاف حد يقول عليهم فلاحين من الاخوان المسلمين"
author = "فارس_fr"
posted = "2007-01-10"
text = "عزيزى ابن بهية انت اكيد اخدت بالك من الكام اسم ال( طلبة الازهر الشريف ) . والله خوفى ان يطلع علينا مسؤول حكومى بتصريح من تصريحاتهم الفزة و يطلع شوية الفلاحين الغلابة انهم من الاخوان المسلمين , او تنظيم ارهابى فى عزبة من عزب مصر هدفهم ضرب مناخير ابو الهول , ولا حاجه<br />والله انا معاكم بقلبي وروحى ودمى يافلاحين مصر ,<br />يااصلنا وعزوتنا , اتمنى انكم تفضلوا على موقفكم وثباتكم ومتتنزلوش عن حقوقكم ابدا واللى يحرق لكم غيط احرقوله اتنين , والعسكرى اللى يضربكم قلم اضربوه عشرة .. العين بالعين والسن بالسن والبادئ اظلم !!!!!"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112135220/http://masr.20at.com:80/article.php?sid=1421"
