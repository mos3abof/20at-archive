subject = "الرباط المغرب"
author = "ميمون"
posted = "2006-12-13"
text = "نحن فخورين باداء فريق الاهلي المصري . وفي رايي ان السبب في التالق هو الانسجام الحاصل بين اللاعبين وعدم السماح لاغلبهم بالاحتراف الى الخارج و ليس كالفرق المغربية التي تبيع اللاعبين باي تمن و لو كان زهيدا"
