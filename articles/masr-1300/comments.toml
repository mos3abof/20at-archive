[[comments]]
order = 2
subject = "للأسف الهزيمـة بشـرف هي طموحنا وهدفنا"
author = "زملكـاوي مغترب"
posted = "2006-12-14"
text = "ههههه ايه ده يا أهلي دا الي انت فالح فيه هزيمة بفارق هدف من اتحاد جدة العام الي راح ودلوقتي من الرفقة بتاعة البرازيل بفارق هدف .<br />ومع احترامي للفرقة البرازيلية الأنتر وهي من افشل الفرق في قارة امريكا الجنوبية<br />أمال لو كان الأهلي بيلاعب ساوباولو كان حيعمل ايه؟؟؟<br />كان حيخرج بتاريخية في شباك الحضري<br />على العموم الأهلي وضح بأنه فريق محلي للأسف"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216231506/http://masr.20at.com:80/article.php?sid=1300"

