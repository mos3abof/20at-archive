subject = "لخبطة"
author = "سعيد احمد محمد"
posted = "2006-06-08"
text = "على من يطرح هذا السؤال اصلا؟؟ علينا ؟؟ومن نحن؟هل نحن اصحاب هذا البلد حتى يكون لنا راى فيما سيحدث فيه غدا ؟يا سادة فلنكن منطقيين هذه ليست بلدنا انها بلدالذين يعرفون جيدا ماذا سيحدث غدا وبعد غداما نحن فللاسف اضعف كثيرا كثيرا من ان ندلى بدلونا الفارغ دائما فى مواضيع الكبار وسنبقى كذلك الى ان ياتى اليوم الذى يصبح فيه كل مصرى ومصرية من امثال بهية ومنال وعلاء وشيماء وعمر ومحمد الشرقاوى عندهانستطيع ان نقرر ماذا سيحدث لمصر فى العام القادم"
