[[comments]]
order = 2
subject = "صدقت ظنوني للاسف"
author = "ميم"
posted = "2006-05-31"
text = "انا سعودية اسف لواقع اعيشه فلا تلوموني 00000<br />ادرس في الكلية قسم لغة انحليزية بقسميها اللغة والادب<br />يدرسني استاذين مصريين واستاذة مصريه والاخرين من جنسيات اخرى الاستاذين على قدر من العلم واحدهما (ادعو معي) وفقه الله بعدد ماحج فوج واعتمر استاذفي جامعة القاهرة ولحسن حظنا انه جاء ليدرسنا0000اما<br />تعليقي فعلى الاستاذة القديرة التي تحمل ماجستير لغة انجليزيه ولاتعرف ان كانت oxenمفردا ام جمعا لاتلوموني فما كنت لاتكلم لولا انها تجرات وقالت لي انني (لاافهم) يعني بالسعوووودي (شين و000<br />كل انسلن يعرف قدر نفسه وكان بمقدوري ان ارد عليها ولكن سكتت ليس خوفا وانما يأسا<br />واقعي المر جعلني على ثقة انني لو زرت مصر فسأجد الماجستير في اقرب 000بقااالة000"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904191448/http://masr.20at.com:80/article.php?sid=125&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "ليس مقت الديار من سكن قلبي /ولكن مقت من سكن الديارا .."
author = "الجزائري"
posted = "2006-09-18"
text = "في الحقيقة ليس بالغريب ان نسمع ان كل شيء يباع في مصر بل الحمد لله ولا ادهى ان ترى سوقا للعبيد هناك...لان الاخلاق قد انحطت واصبحت الرذالة فضيلة لان المصري في جال القرش يهدم العرش وانتم تعرفون ذلك احسن مني ...انا هنا منذ عامين ماجستير ...جزائري الجنسية اخجل من اهلي لما اقول لهم انا في مصر ...وبتجربة المصريين لا يحتلون علميا اي شيء معنا نحن الجزائريين هنا في ديارهم ...هم بعيدون عن العلم ..للاسف ياحبيبتي ياجزائر لم تفتحي لنا الباب لكي نكون بين احضانك ...لان الماجستير في الجزائر ليس مفتوح للجميع بل تتم العملية بنظام المسابقات ..نحن جئناك يامصر لكن للاسف الشديد لم نجد ما نريد ..العلم لا يوجد ..صدقوني وكانكم معي لان الحق تراه كل عين مبصرة ...."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117203232/http://masr.20at.com:80/article.php?sid=125&PHPSESSID=8e9894e7237da2f6158003c326adcad0"

