subject = "لية مستغرب"
author = "احمد العبيدي"
posted = "2006-12-11"
text = "والله انكم حقا مضحكون التزوير في اكبر الدول علماومعرفة في كثير من دول العالم ولكن ماتزعل (العين ماتعلي علي الحاجب )والله نحن المتعلمين ولافخر وبأذن الله نعرفهم فهم لايستطيعون مجابهتنا حتي ولوحصلوا علي اعلي الشهادات فلاتزعل ولاتزعل ولاتحمل هما من هولاء الاوباش فهم لايستحقون ان نفكر فيهم ونشغل انفسنا بتفاهاتم فعندما خلق الله الدنيا خلق الخير والشر............"
archived = "2006-12-16"
