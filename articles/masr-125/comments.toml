subject = "مغامرة صحفية .. تستحق القراءة"
author = "لبني عبدالسميع"
posted = "2006-04-05"
text = "دي مغامرة صحفية عملتها أنا و زميلتي عن الموضوع ده نشرت في جريدة الخميس حيث نعمل , انا صدمت مثل ا/ فهمي هويدي و لكن ما صبرني وجعلني أشعر ببعض الأمل هو موقف د/هاني هلال وزير التعليم العالي فقد حول مشكورا الموضوع للرقابة الادارية، و يشرفني قراتكم لمغامرتنا.<br />19/1/2006<br />مغامرة صحفية:<br />مافيا بيع رسائل الماجستير والدكتوراة في مصر<br />لم أتعجب من نص الاعلان المنشور في جريدة الوسيط يوم 16 ديسمبر 2005 عن استاذ جامعي يقوم بعمل رسائل الماجستير والدكتوراة للباحثين بأي جامعة بالعالم بسعر مغري جدا مع شرحهاوتوضيحها للباحث قبل المناقشة، لم يدهشني ان رسائل الماجستير والدكتوراة اصبحت تباع كالسلع فهذه ليست اول مرة يباع فيها العلم فقد بيع من قبل عن طريق الدروس الخصوصية في المدارس والجامعات وهذا الاعلان هو التطور الطبيعي للدروس الخصوصية، ما ادهشني وجعلني اقف كثيرا امام هذا الاعلان جرأة صاحب الاعلان في الاعلان عن نفسه ألم يخف من قراءة وزارة التعليم العالي لهذا الاعلان أو حتي مصلحة الضرائب ام ان هذا العمل اصبح مشروعا وانا معرفش.<br />اتصلت تليفونياً برقم الموبايل الموجود في الاعلان وادعيت اني طالبة تمهيدي ماجستير في كلية الاعلام جامعة القاهرة واخترت هذه الكلية لاني خريجتها بالفعل فاذا سألني في اي مو ضوع يخص الدراسة استطيع الاجابة حتي لا يكشف امري، وطلبت من صاحب الاعلان ان يقوم بعمل رسالة الماجستير لي وسألني عن اسمي وعنواني ورقم تليفوني واعطيته بيانات غير حقيقية ثم طلبت التعرف علي شخصه والخطوات التي ستمر بها الرسالة فعرف نفسه علي انه د.احمد حسن استاذ رياضيات بتربية عين شمس و انه يعمل مع فريق متكامل من كل الكليات وقاموا بعمل رسائل ماجستير ودكتوراة في تخصصات الهندسة والطب البشري والاسنان والصيدلة وستكو<br />اقرأ بقية التعليق .."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904191448/http://masr.20at.com:80/article.php?sid=125&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

