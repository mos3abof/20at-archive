text = "انا عايزة اعرف هو احنا لازم نجرح في بعض في تعليقاتنا ؟؟؟!!!!!!<br />ايه اللي معاها فلوس وعايزة تصرفهم ، ليه أهاجم قبل اما اقرا الكتاب الاول ، وانت زعلان ليه والتاني الي مضايق انها خريجة مكتبات ايه المشكلة يعني . دي بتبقى ملكات ، ربنا مديها للواحد. واللي متفلحص قوي دي يورينا طيب موهبته ؟ّ!!!!!"
