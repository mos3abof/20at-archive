[[comments]]
order = 15
subject = ""
author = "بقية التعليق السابق"
posted = "2010-02-03"
text = "ودعا عبدالعظيم صدقي مقرر الأنشطة بجمعية خريجي الإعلام إلي ضرورة وجود ميثاق شرف للعمل الإعلامي يتزامن إقراره مع إقرار مشروع النقابة.. وقد وعد النائب البرلماني هشام مصطفي خليل بالاستمرار في فتح الحوار حول مشروع النقابة للوصول إلي أفضل تصور.. وفي نهاية اللقاء أعلن عن إهداء مكتبة والده المرحوم الدكتور مصطفي خليل رئيس وزراء مصر الأسبق لجامعة القاهرة وتضم 1000 كتاب ومرجع في مختلف فروع المعرفة.. كما قام الدكتور حسن عماد بإهداء سيادته درع كلية الإعلام."
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309064205/http://www.20at.com:80/masr/interviews/15102--qq.html"

[[comments]]
order = 16
subject = ""
author = "نقابة الإعلاميين"
posted = "2010-02-03"
text = "مشروع نقابة الإعلاميين في ندوة جمعية خريجي الإعلام<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــ<br />عقدت جمعية خريجي الإعلام برئاسة أ.د. ماجي الحلواني ندوة عن مشروع إنشاء نقابة للإعلاميين تحدث فيها النائب هشام مصطفي خليل عضو مجلس الشعب في المشروع الجديد الذي يتبني تقديمه للجان مجلس الشعب وتناول عدة محاور من بينها تسمية النقابة وتحديد الأعضاء المستفيدين منها وأنشطة العمل النقابي بها ومصادر تمويلها وشكل العلاقة بينها وبين الوزارات المعنية كوزارة الإعلام ووزارة الثقافة وأشاد بمبادرة السيد أنس الفقي وزير الإعلام ودعوته لإنشاء نقابة للإعلاميين كأول وزير يدعو لإنشاء نقابة."
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309064205/http://www.20at.com:80/masr/interviews/15102--qq.html"

[[comments]]
