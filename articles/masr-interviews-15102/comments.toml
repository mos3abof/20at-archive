[[comments]]
order = 2
subject = ""
author = "الى المعلقة السابقة"
posted = "2010-01-29"
text = "لا يا اختي انا متعلم والحمد لله وبشتغل في تخصصي الجامعي وعارف اني لو اشتغلت في غير تخصصي يبقى غلط<br />يعني مثلا حضرتك لو عندك قضية حتروحي لواحد محامي ولا واحد محاسب<br />لو عايزه تولدي حتروحي لواحد مهندس مدني ولا واحد دكتور<br />فيه حاجه اسمها تخصصات اكاديمية يا متعلمه<br />كل واحد يشتغل في تخصصه الاكاديمي<br />ومن جهة اخرى قطاع الاعلام دا قطاع خطير<br />ولعم تخصص الاعلاميين المصريين وكلهم جايين من كليات شتى<br />فهو اعلام فاشل فاشل فاشل<br />والموضوع يطول شرحه"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122237/http://www.20at.com:80/masr/interviews/15102--qq.html"

[[comments]]
order = 3
subject = ""
author = "رودى"
posted = "2010-01-29"
text = "بجد انا فاخورة بيكى جدا لانك نفس تخصصى وبالنسبة للاشخاص الى بيتكلموا عن قسم مكتبات او كلية الاعلام فاكيد هما اصلا مش متعلمين علشان يعرفوا اهمية الكلييتين وبجد انا فخورة بانك الفتى كتاب زى ده والى الامام يسيدتى وتحياتى للك يارغدة"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122237/http://www.20at.com:80/masr/interviews/15102--qq.html"

[[comments]]
