[[comments]]
order = 7
subject = ""
author = "حرية صحافه"
posted = "2010-02-01"
text = "اي واحد اسمه صحفي او مذيع لازم يكون خريج صحافة واعلام<br />خلاف ذلك ما يسميش نفسه صحفي او مذيع او مقدم برامج يسمي نفسه اي حاجه تانيه وما يخدش كرنيه النقابة<br />اي واحد بيشتغل صحفي وهو مش خريج اعلام وصحافه يبقى<br />صايع<br />صايع<br />صايع<br />صايع<br />فاهمين ولا لأ"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202161202/http://www.20at.com:80/masr/interviews/15102--qq.html"

[[comments]]
order = 8
subject = ""
author = "خلاص"
posted = "2010-02-01"
text = "خلاص<br />طالما هو دا رأيكم يبقى مفيش حل غير اننا نلغي كليات الاعلام والصحافة<br />طالما في نظركم اي كلية تقضي والموضوع مش محتاج لكليات متخصصة<br />وان خريج الاعلام ما بيعرفش يكتب خبر ولا يقدم برنامج<br />يبقى نطالب بالغاء كلية الاعلام جامعة القاهرة والغاء ايضا اقسام الصحافة في كليات الاداب<br />ونرفع الموضوع الى السيد وزير التعليم العالي لالغاء هذه الكليات<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــت<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202161202/http://www.20at.com:80/masr/interviews/15102--qq.html"

[[comments]]
