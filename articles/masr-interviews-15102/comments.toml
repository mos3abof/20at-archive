subject = ""
author = "ابقوا قولوا"
posted = "2010-01-29"
text = "ابقوا قولوا بعتم كم نسخة<br />اظن ان معاها قرشين عايزة تصرفهم فى الفاضى ولا اظن ان واحد عاقل يرضى يقرأ شوية الكلام اللى قراناهم بقرف فى عشرينات<br />وانا افضل ان بالقرشين اللى هتعمل بيهم كتاب تشترى فرش جديد للبيت وتنجد المراتب وتشترى سجادة جديدة وتليفزيون 32 بوصة<br />كتاب اية يا محروسة - هو كل واحد شخبط كلمتين بقى كاتب"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122237/http://www.20at.com:80/masr/interviews/15102--qq.html"

