subject = ""
author = "للمتفزلك"
posted = "2010-02-01"
text = "للمتفزلك اللي بيتكلم عن التخصصات وخلافه… هو من امتى في واحد في بلدنا بيشتغل بتخصصه؟؟ ده اولا ، ثانيا : الاعلام والكتابة الصحفية موهبة قبل ما تكون دراسة .. وكام واحد خريج اعلام ما بيعرفش يكتب خبر، ولا كام واحد خريج اذاعة وتلفزيون ما بيعرفش يقدم ضيف… المهم في الاخر التمكن والاحتراف … دارس مش دارس الاهم الاداء.. ولمعلوماتك\" جمال ريان\" مقدم نشرة اخبار الجزيرة… معاه ذانوية عامة فقط:)"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202161202/http://www.20at.com:80/masr/interviews/15102--qq.html"

