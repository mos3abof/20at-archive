author = "علياء عبدالفتاح"
posted = "2010-02-05"
text = "جوابي هو ان كليات الاعلام ملهاش اي لازمة لان كل اللي ممكن اتعلمو فيها تلاقي في كم كتاب ممكن تقراهم. يعني هي وقفت على الاعلام نص الكليات ملهاش اي لازم ونصيحة ليك يا كابتن: الكلام اللي حضرتك بتكتبه كل ما شخص نشر او كتب حاجة لانه مش خريج اعلام مش حيغر حاجة وروح طلع عقدك بعيد او ورينا شطارتك يا بتاع الاعلام.<br />فعلا بلد شهادات وجامعات بتخرج جهلة وانصاف متعلمين"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309064205/http://www.20at.com:80/masr/interviews/15102--qq.html"

