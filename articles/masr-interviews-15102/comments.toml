subject = ""
author = "كلية الاعلام"
posted = "2010-02-02"
text = "الى اعزائي الطلبة والطالبات الذين نجحوا في الثانوية العامة<br />مبروك والف مبروك<br />واوعا حد فيكم يكتب في الورق بتاعه (كلية الاعلام)<br />اوعو اوعو اوعو<br />دي كلية وسخه اللي متخرج منها بيشتغل في مطعم<br />لان مهنة الاعلامي اي واحد ممكن يشتغلها<br />دكتور مهندس محاسب مدرس تمرجي قهوجي صول<br />عبدالله الصحاوي كان بيشتغل في مجله اسمها الكرباج صاحبها واحد صول<br />ما حدش يدخل الكلية دي خالص<br />سلام<br />_______________ ______________<br />مش احمد الهواري ولا عبدالله الطحاوي"
archived = "2010-02-02"
capture_url = "https://web.archive.org/web/20100202161202/http://www.20at.com:80/masr/interviews/15102--qq.html"

