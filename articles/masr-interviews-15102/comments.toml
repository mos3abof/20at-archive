author = "علياء عبد الفتاح"
posted = "2010-02-01"
text = "الف مبروك يا رغداء على الكتاب وبالتوفيق دايما<br />ومستنين المدونة بتاعتك ياريت تقوليلنا عليها اول ما تعمليا وانا شاية انك تسميا بنوتة مفروسة وياريت تكتبي عن الجواز وسنينه والعيال وسنينها<br />واحنا معاكي<br />بالتوفيق دايما"
