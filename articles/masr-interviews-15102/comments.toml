[[comments]]
order = 0
subject = ""
author = "اول القصيده كفر"
posted = "2010-01-28"
text = "اول القصيده كفر يا عجم انت بتقول في مقالك<br />صحفية مهتمة بالشأن الاجتماعي، حاصلة على ليسانس آداب تخصص مكتبات دفعة 99 من جامعة القاهرة،<br />ازاي حاصلة على قسم مكتبات وبتشتغل صحافية<br />الصحافي يا عجم لازم يكون متخرج من كليات متخصصة في الصحافة والاعلام<br />كلية ادب قسم مكتبات يعني امينة مكتبه وليس صحفية<br />والدبلوم دا ما ينفعش يا عجم<br />سلام يا عجم واصحفي لازم يكون زي المحامي ليه كليات متخصصة يا عجم<br />سلام يا عجم وسلملي على الواد بتاع العتبه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122237/http://www.20at.com:80/masr/interviews/15102--qq.html"

