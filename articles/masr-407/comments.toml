subject = "هم يبكى وهم يضحك"
author = "نظره حائره"
posted = "2006-05-29"
text = "والله لو أتظاهروا بالملابس الداخليه مش بالترينجات والبيجامات وأهوا لو عبروهم روحوا بيوتكم أحسن لحسن بيلموا المختلين عقليا"
