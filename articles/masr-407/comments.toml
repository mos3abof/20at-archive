text = "هههههههههه<br />ولسة يا هنشوف<br />مش ناقص فى المظاهرة دى غير تلفزيون وماتش كورة وحاجة ساقعة وواحد قهوجى تبقى القعدة تحلوة ........"
archived = "2006-11-17"
