[[comments]]
order = 1
subject = "الغسيل"
author = "السعيد المصرى"
posted = "2006-05-29"
text = "ساقول شئ واحد وباختصار<br />ايمن نور اما اضرب عن الطعام<br />كانوا هاسيبوا يموت<br />وبرضوا عملوا اللى هوما عايزينة فية<br />على العموم تجربة واضراب ويفشل او يفشل"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143434/http://masr.20at.com:80/article.php?sid=407&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

