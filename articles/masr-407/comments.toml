subject = "البسوا العصبة"
author = "مصري حزين"
posted = "2006-05-31"
text = "انا باقترح يلبسوا العصبه ويصوروا طشت الغسيل وحتي لو ده حصل ماحدش حيعبرهمكانوا استحوا والا اتكسفوا بعد حادثه العباره (مصري حزين يائئئئئئئئئئئس )"
archived = "2006-11-17"
