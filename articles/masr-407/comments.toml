[[comments]]
order = 5
subject = "قااااال ايه بيجامات"
author = "الاستاذشيكو"
posted = "2006-05-31"
text = "والله لو حتي من غير هدوم ماهاتخدوا حاجه<br />كل الاصوات الحرة في البلد هايكون مصيرها كده<br />مظاهرة بابيجامات والترنجات ماعدش فاضل غير فانله وشورت والماتش يسخن وبردة مش هايجيبوا جون في الحكومه"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143434/http://masr.20at.com:80/article.php?sid=407&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "هذاجهدنا ولا داعى للياس"
author = "ياسر ابو العلا"
posted = "2006-05-31"
text = "فى البداية اوضح اننى احد الصحفيين الذين ارتدوا التريننج ووقفوا امام نقابة الصحفيين للاحتجاج على تعنت رئيس التحرير والمجلس الاعلى للصحافة ونقيب الصحفيين ،المهم اننا تحركنا واعترضنا وما ضاع حق وراءه مطالب ،اما الذى اثار انتباهى بالفعل فهو حجم الياس الذى يعترى الشباب الذين علقوا على هذه المظاهرة الجديدة من نوعها ،فضلا عن السخرية من منفذيها .لا يا شباب ما هكذا تورد الابل ،لابد ان يدافع الانسان عن حقه بكافة الوسائل والى اخر نفس فى حياته .على فكرة احنا يوم الخميس سوف ننظم مظاهرة اخرى بالزوجات والاولاد امام مقر النقابة ايضا ."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143434/http://masr.20at.com:80/article.php?sid=407&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "الناس عايزة اية"
author = "محمد احمد"
posted = "2006-05-31"
text = "الناس عايزة اية من الحكومة. كل شى غلط الحكومة مسئولة. الاخوان عايزين اية يحكموا البلد يحكموها البلد تخرب زى فلسطين ونهجر المسحيين او نقتلهم."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143434/http://masr.20at.com:80/article.php?sid=407&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "بطل هبل"
author = "تعليقا على التعليق اللى فات اللى كتب اسمه احمد محمد واعتقد ان اسمه الحقيقي سلومة الافرع .. مخبر امن دولة"
posted = "2006-06-01"
text = "مين اللى قالك يا عم العبيط ان الاخوان لما شكلوا الحكومة فى فلسطين اتخربت<br />هم هجروا المسيحيين ؟!<br />الناس خلاص فاقت وما بقتش تاخد على كلام التفزيع من الاسلاميين<br />مؤشرات الانتخابات فى مصر وفى فلسطين تقول ان فيه مسيحيين صوتوا لصالح الإخوان"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143434/http://masr.20at.com:80/article.php?sid=407&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "تامر حسنى مبارك"
author = "سمير المصرى"
posted = "2006-06-21"
text = "مظاهرة سلبوته..تقلع تلبس مش فرقه معنا الشعب ورثينه غصب عن اللى جابو ابوة شعب نادر لما تلاقى زيه فى الايام دى شعب عمرة ماحس بشئ ولا حيحس بشئ والله لو الدنيا ولعت من حوليه مش حيقول اف ولا حتى اح...لكن السؤال المهم الان فى الشارع المصرى هل تامر حسنى مبارك ابن حسنى مبارك بتاع مصر ولا بتاع المجارى ...مع الاعتزار يما جارى فيكى بيجرالى"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143434/http://masr.20at.com:80/article.php?sid=407&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
