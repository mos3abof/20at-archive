[[comments]]
order = 0
subject = "شيرين رضا"
author = "شيرين رضا لم تدخل فندق سميراميس فى الحادية عشرة صباحا لتصفيف شعرها كما زعمت، كانت الساعة هى الواحدة و55 دقيقة صباحا.. ووفقا لدفتر تسجيل السيارات بالفندق، فقد كانت تقود بنفسها السيارة رقم 250615ملاكى إسكندرية ماركة بيچو 307. فى الساعة الثانية و55دقيقة فجرا طلب الضيف العربى المقيم فى الجناح 755 «مشروبا» وثلاثة كاسات، ووقع بنفسه على الشيك رقم 3261وفى الساعة الرابعة و35 فجرا تكرر نفس الطلب ووقع بنفسه على الشيك رقم 3303، وفى الساعة السابعة و15 دقيقة صباحا طلب إفطارا لثلاثة أشخاص ووقع بنفسه على الشيك 3391."
posted = "2007-01-15"
text = "إلى هنا كانت الأمور تسير بلا مشاكل دون تدخل من أحد، إلى أن اتصلت شيرين بنفسها بإدارة الفندق تطلب إصلاح التكييف فى الجناح 755، وصعد عمال الصيانة ومعهم ضابط أمن للاطمئنان على إصلاح العطل، وكانت الساعة هى الحادية عشرة قبل الظهر. بعد نزلوهم تقدم مسئول الأمن بالفندق ببلاغ إلى ضابط السياحة يطلبون فيه نزول سيدتين من الجناح هى شيرين رضا وسارة إبراهيم نجم مصرية لها جنسية كندية طالبة بالجامعة الأمريكية.. وبهدوء شديد اتصل ضباط الأمن بالجناح وطلبوا من النزيل السماح بنزول السيدتين بناء على البلاغ المقدم من الفندق.<br />كانت ردود النزيل العربى عنيفة وغاضبة وهدد وتوعد وأقسم أنه لن يسمح بنزول أحد من جناحه وتعقدت الأمور بشكل كبير، وقبل أن يتأزم الموقف أكثر وأكثر نزلت شيرين وصديقتها إلى اللوبى وقالت إنها لا تريد أن تعمل مشكلة..واصطحبها ضابط شرطة السياحة بالفندق لتحرير محضر بالواقعة.. وتم تحويلها وصديقتها إلى النيابة وتم الإفراج عنهما بضمان محل الإقامة"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192133/http://masr.20at.com:80/article.php?sid=1447"

[[comments]]
order = 1
subject = "جامع.. سعد الصغير"
author = "رأفت عبد الكريم"
posted = "2007-01-15"
text = "ياريت بس كان بطل الاغانى الفاشله اللى بيعملها كان عمل خير فى الناس اكتر من بناء جامع فالناس لم تكن تنتظر سعد الصغير كى يقيم لها مسجد.<br />ولى تعليق على راى منال محمد هذا الذى ورد فى المقال فواضح من اسلوب كلامها انها مصريه تقيم فى النرويج او ما شابه ذلك ، ففى البدايه تتعجب من اسلوب الشعب المصرى ده ( معلش يا هانم الشعب دون مستوى سيادتك ) وكانها من الشعب السويسرى الشقيق ، ايه الالاطه دى ، ثم قولها اذا كنا ممكن نصلى فى كنسيه وكان الكنيسه ( وهى دور عباده لها احترامها ) مكان متدنى جدا لدرجه انها تقارن به ( واذا كان الواحد..... ) فى حين انها لا ترى مشكله فى سعد ضيف الكباريهات الدائم ، و ختمتها مسك بانها طبعا لا تعرف ايه شبرا الخيمه دى ( طبعا مكان مش قد المقام ) مع ان شبرا الخيمه تعتبر من اكثر المناطق كثافه سكانيه ( ولا تلاقى اللى عايشين فيها دول معيز) ، ولكن الاسخف من ده كله ان كاتبه المقال معجبه بكلامها اوى لدرجه انها واخده منه جزء و كاتباه فى اول الصفحه."
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192133/http://masr.20at.com:80/article.php?sid=1447"

