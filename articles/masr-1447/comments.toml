[[comments]]
order = 8
subject = "هو لسه في حد بيحب مبارك؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
author = "اعتقد انه حاقد ومريض وجاحدمن ينكر انجازات الثورة وخيراتها التي نعيش فيها الي الان , وانه من احسن العهود بعد عهد محمد علي باشا."
posted = "2007-01-15"
text = "يوجد في كل ثورة اخطاء ولكن<br />لا تقلل من الانجازات العملاقة من زيادة الرقعة الزراعية وبناء المصانع العملاقة وتاميم قناة السويس وبناء السد العالي وبناء جيش وطني قوي وسياسة الغاءالاقطاع وسياسة الملكية للشعب المصري وتمصير الاقتصاد وغيرها من الانجازات العملاقة التي نعيش في خيرها الي الان , ومثالا علي ذلك انه كانت البطالة معدومة تقريبا وتنحصر بين الاميين والجهلة وكانت لاتتجاوز نصف في المائةمن القوي العاملة , وكان للمصري قيمة كبيرة بين الامم حتي ان دول امريكا الجنوبية مازالت تتغني بعبد الناصر الي الان كرمز للوطنية والثورة ومقاومة سياسة الاستعمار .<br />اما الان في ظل العهد المباركي , العهد الذي زاد ثمن كل شيء فيه الا شيء لم يزد ثمنه بل قل ثمنه واصبح بدون قيمة وهو الانسان في عهد مبارك وابنه (رضي بوش عنهما) .<br />انجازات مبارك وابنه وحزبه التوربيني(رضي بوش عنهم جميعا)<br />1)نسبة الفقراء في مصر 21%من عدد السكان<br />2)نسبة من هم تحت خط الفقر 45% من السكان<br />3)3 مليون مريض بالسرطان بانواعه(المبيدات المسرطنة ويوسف والي الخنزيز)<br />4)9 مريض بالفيروسات الكبدية(A,B,C)<br />5) 7 مليون عاطل من الشباب<br />6) 9 مليون عانس<br />7)بيع القطاع العام والبنوك وشركات الاتصالات وغيرها من المرافق الحيوية للاجانب وغالبيتهم من الامريكان واليهود<br />8) حصول مصر علي مركز متقدم في الاكثر دول فسادا في العالم<br />9) انتهاك الحريات العامة وتعذيب المواطنين علي ايدي كلاب الداخلية.<br />10) غرق 1450 في البحر الاحمر وحوادث القطارات المتكررة, والقهر والظلم الاجتماعي وظهور الثراء الفاحش ونسبة اغنياء النصف في المائة وظهورالفقر<br />اقرأ بقية التعليق .."
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192133/http://masr.20at.com:80/article.php?sid=1447"

