text = "والمكان طاهر ونظيف<br />اية المشكلة<br />هل هو مسجد ضرار لتفريق المسلمين وزرع مبادىء تتعارض مع جوهر الدين<br />ياعم انت وهو صلوا وبلاش وسوسة<br />وبطلوا فزلكة والموضوع اصلا لايحتاج الى اى نقاش الا اذا كانوا ناس فاضيين لا شغلة ولا مشغلة"
