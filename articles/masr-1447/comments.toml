text = "عفوا اريد أن أفهم هذا الخلط بين المقال والردود عليه، فبين خمس ردود يوجد إثنين فقط لهم علاقة، والردود الأخري، مرتبطه بقضايا مختلفة، فكيف يمكن إعتبارها عقيب أو رد على نفس الموضوع؟ وهل هو خطا مستخدم، أو خطاء نظام تقنى؟"
archived = "2007-01-17"
