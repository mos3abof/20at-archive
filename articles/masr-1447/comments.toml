[[comments]]
order = 4
subject = "الى الاخ اللي فوق"
author = "انا كلامي مش كده انا كلامي ان فيه واحد مسمي نفسه ابن بهية بيسب ويشتم في حسني مبارك وعنده مدونه دخلت عليها وجدت صورة جمال عبدالناصر استغربت ازاي واحد بيكره حسني مبارك وبيحب جمال عبدالناصر مع انهم نظام واحد عبدالناصر والسادات ومبارك تماما مثل الملك توفيق والملك فؤاد والملك فاروق."
posted = "2007-01-15"
text = "فاللي يحب جمال عبدالناصر ما يكرهش السادات ولا مبارك لانهم هما التلاته نظام واحد لا يتجزأ.<br />وبعدين اللي عمله عبدالناصر دا من فلوس الشعب من مش فلوس امه السد العالي وكل الانجازات دي اتبنت من مال الشعب وبدم الشعب جمال عبدالناصر ما بناش حاجه جمال عبدالناصر كان بيخرب وبس لغاية ما سلم سينا لاسرائيل.<br />ويشكر حسني مبارك انه حافظ على معاهدة السلام مع اسرائيل"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117192133/http://masr.20at.com:80/article.php?sid=1447"

