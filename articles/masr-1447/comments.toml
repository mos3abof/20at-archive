text = "الجامع ملوش دخل وكلنا عارفين ودا مكان للعبادة بس انا مصليش فية ونا عارف ان قلى بنية جايب فلوسة منين ومين ممكن ياكل على مائدة افطار ن علق رقاصة شرين وسارة معرفش الموضوع اما الثلاثى المرح فامنهم لله خربوا البلد وتلاتة قطعة واحة بس كل واحد خرب بشكل مختلف انا مش مسامح يارب"
