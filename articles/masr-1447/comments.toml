text = "إيه الكلام العجيب ده ؟ هو صفحة التعليقات بقت مساحة فاضية لكل واحد دماغه فيها شوية كراكيب ييجي يرميها هنا و يمشي ؟؟!! يا جماعة اتعلموا النظام بقى .<br />أنا رأيي في موضوع الجامع إن ده حاجة بينهخ و بين ربنا , و من كان منا بلا خطيئة فليرجمه بحجر , زي ما قال سيدنا المسيح عليه السلام ."
archived = "2007-01-17"
