[[comments]]
order = 5
subject = "احلام اليوم حقائق الغد"
author = "السندباد البحري"
posted = "2007-01-16"
text = "لازم نعرف ان كل شيء بيتطور مادام احنا بشر هتحصل الحكايه دي من غير ارادنا.. لان ده تطور طبيعي..واللي انت فاكره مستحيل ومنافي اليوم بكره هتلاقيه ضروري ومنطقي جدا..المهم دايما تكون (الدراسه هي الحل) لازم ندرس كويس اوي كل خطوه ...وطبعا اتلدراسه محتاجه مزيد من الديمقراطيه ومزيد من الانفتاح ومزيد من الشفافيه..وانا شايف ان قيام حزب تطور طبيعي..لاني انال ممكن اقول انهارده انا استحاله اشتري عربيه مثلا لسبب او لاخر بكره هتلاقيني شاري واحده علي الزيرو مش علشان معنديش مصداقيه ولكن علشان الظروف بتتغيرومتطلبات اليوم غير امبارح..المشكله دايما في حاجه واحده نصيحه اقدمها لكل من الاخوان والحزب الوطني ايضا ..تريثوا قليلا في الدراسه العلميه للموضوع وسيبوكوا من (المعلمه المصريه)بفتح الميم وتسكين العين وفتح الام واطلاق العنان للديمقراطيه( فوق البيعه)"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

[[comments]]
order = 6
subject = "آن لأبي حنيفة أن يمد رجله ..."
author = "إبن بهيه"
posted = "2007-01-16"
text = "آن لأبي حنيفة أن يمد رجله .. هكذا قال الإمام أبو حنيفة في نهاية درسه الذي اعتاد أن يلقيه على تلاميذه ومريديه .. فقد كان الرجل يجلس جلسة غير مريحة احتراما لرجل أشيب يكبره سناً كان من بين الجالسين .. فتوقيراً للرجل كان أبو حنيفة يضم ساقيه توقيرا لهذا العجوز ، لكن عند نهاية الدرس تقريباً تكلم الرجل العجوز بكلام غريب وعجيب لم يكن أحد يتوقع أن يصدر من رجل في سنه فقال أبو حنيفة كلمته الشهيرة تلك..<br />فهل آن لفضيلة الأستاذ مهدي عاكف أن يمد رجله بعد الذي سمعناه من ذلك الواطي المتغطرس من قلة أدب وذوق وسياسة حتى ؟ وبعد كل ما عاناه الإخوان وتحملوه في سبيل دعوتهم وفكرهم ؟ أعتقد أن من حق الإخوان المسلمين ان يكون لهم حزب سياسي تحت أي مسمى .. ديني .. مدني .. ما يرونه هم مناسبا لهم ويتوافق مع مبادئهم وللجماهير الحق في الانضوزاء تحته أو رفضه .. أليست هذه هي الديموقراطية ؟<br />في كيان لم ولن يصل إلى أن نسميه دولة رغم أنف من زعم ذلك قام حزب كاديما في ربع ساعة .. وعندنا في مصر صاحبة العشرة آلاف سنة حضارة والحياة البرلمانية بها عمرها مديد وضارب في أعماق التاريخ لأكثر من مائة وأربعين عاما .. لا يسمح بقيام الأحزاب إلا بموافقة الحزن الوطني ؟؟؟؟؟!!!!!!!!<br />من ناحيتي أتمنى لحزب أبو حنيفة كل توفيق وازدهار وولادة أولاً .. ولو أعجتني أطروحاتهم فيه سأدافع عنه ، وإن لم تعجبني فلن أهاجمه حتى نتخلص جميعا من الطاغية الواطي مبارك وعصاباته ثم بعدها يكون لكل حادث حديث ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

[[comments]]
order = 7
subject = "إلى صديقي عبدالله الطحاوي !!"
author = "محمد مصطفى"
posted = "2007-01-16"
text = "عبدالله الطحاوي ..<br />كاتب رشيق..أقصد رشيق العبارة والكلمة..يأثر أي قارئ بتعبيراته القوية الموجزة دون تعقيد أو اسفاف !!<br />تحليل رائع..<br />وبالنسبة للحزب الذي تدور حوله المناقشات ..ومن حكم مشاركتي في جزئية متعلقة بوضع هذا التصور اتحدث هنا...فخطوة الحزب لدى الاخوان ليست عند أو نوع من انواع المواجهة مع النظام..فهي خيار الجماعة دون مواربة أو موالسة ..وواقع الحال..فالنظام يبادر دائماً بالمواجهة والعناد..وتجهيزات الحزب لمن لا يعلم تدور حولها مناقشات عند الاخوان منذ فترة ليست بالقليلة ..ولكن مرارة تجربة حزب الوسط..وما تم فيها من جفاء بين من كانو اصحاب فكرة واحدة ..بعد تراشق واتهامات من قبل المهندس أبو العلا ..وكأنه كان يتقرب إلى الله بمهاجمة الاخوان ..كل هذا كان في افق التجربة ..فكان تأجيل الاعلان..إنما المناقشات والتلميحات في وسائل الاعلام والاعلان الدائم عن ما يدور في ذهن الاخوان من افكار حيال ما يقلق الشرفاء من ابناء الوطن حول الاخوان ورؤيتهم لبعض القضايا ..فقد تم الاعلان عن الخطوط العامة لأفكار الحزب الذي حوله تدور مناقشات داخل بعض الدوائر الفكرية في الجماعة من فترة ليست بالقليلة ..ومن قبل اي مواجهة مع النظام..مع الوضع في الاعتبار أن النظام في حالة تأهب دائم ضد الاخوان..ولو تم طرح فكرة الاخوان في أي وقت سابق أو لاحق لقيل أن الاخوان يصعدون ويعاندون مع النظام..لأن النظام في مواجهة مستمرة مع الاخوان...وأي خطوة تقوم بيها جماعة أو تيار سياسي تحكمها معادلات معقدة متعلقة بطبيعة الوضع وردود الافعال..والاخوان اختارو هذا التوقيت وفقاً لرؤيتهم !!<br />المهم..القضايا التي طرحتها في تحليلك ..أغلبها تم حسمه من قبل الاخوان ..وغيرها من القضايا ..واعتقد أن ما طرحته من إشكاليات من القضايا التي للإخوان في<br />اقرأ بقية التعليق .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

