[[comments]]
order = 0
subject = "ما زال العرض مستمر"
author = "ياء"
posted = "2007-01-16"
text = "زى بدايه اى تعليق<br />المقال حلو حلو<br />زى نهايه اى تعليق<br />دا مجرد كلام وفى الشارع تختلف الحسابات<br />ما بينهما<br />اسوا ما فى تغير العرض السياسى - دا لو فى تغير فى الاساس - هو جمود الجمهور لا هو يبكى ولا هو يضحك - ولا كانه هنا فى الاساس<br />فكره جماعه بتلعب كل الادوار وبتعمل كل شئ من الممكن قبوله اذا اعتبرنا ان معظم الناس مش عايزه تتحرك انت بتلعب وبتجرى هنا وهناك لقيت حد يلعب معاك - يكون بيفهم - اهلا وسهلا ملقيتش حتعمل ايه ؟ حتكمل لعب لوحدك لحد متحس انك تعبت وانك مش قادر تكمل<br />فكره حزب الاصلاح وحزب الامل ثم اخيرا ضجيج الوسط هى استكمال لدور سياسى لحركه الاخوان كلها تجارب للاخوان المسلمين لا يجوز فصلها تبعا للافراد الذين قاموا بها او الاوقات التى نشائت فيها فهى ترتبط فى البدايه والنهايه باطار الجماعه واهدافها ببساطه كلها تجارب اخوانيه<br />ما يعكف عليه الاخوان حاليا هو استكمال لتجارب سابقه بما فيها تجربه الاحزاب التى لم يكتب لها الاكتمال بل وقد تصل الى الرجوع الى الدستور الذى وضعه الاخوان عام 52 - لم ننساه لانه ملئ بالرؤى التجديدية<br />المزاج حاليا يجب ان يتوقف على القواعد التى يريد ان يمارس الاخوان عليه اللعبه السياسيه مستقبلا واظن ان على الاخوان ان يتحركوا بين الراديكاليه والبرجماتيه السياسيه بشكل او باخر بمعنى اى يروا اى من قواعد اللعبه تناسبهم الان ويستطيعوا ان يغيروها مستقبلا فيما يريدون ان يغيروا فى المجتمع تبعا لاهدافهم ومعتقداتهم<br />مثل شكل الحركات السياسيه والنقابات المهنيه مثلا فقد يستخدموها بشكلها الحالى رغم وجود رغبه فى تغيرها مستقبلا والادوار الى تلعبها - برجماتيه<br />رفض ما لا يمكن الممارسه من خلاله مثل لجنه الاحزاب مثلا او شكل الاستفتائات الانتخابيه ومقاط<br />اقرأ بقية التعليق .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

