text = "أعتقد أن الحكومة لن تسمح لقيام حزب للإخوان وذلك لإنه هايسمح لهم بتقديم مرشح لرئاسة الجمهورية ... وده اللي الحكومة شربت المر ياعين مع ترزية القوانين عشان تحط الحواجر أمام الموقف ده<br />الأخ اللي بيقول كفاية سياسة ... أمال ان شاء الله يفضل الشعب يتاخد على قفاه لحد إمتى!!"
