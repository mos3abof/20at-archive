[[comments]]
order = 23
subject = "يا عم معاذ...آخر مرة !!"
author = "محمد القط"
posted = "2007-01-18"
text = "بص يا معاذ...للمرة الرابعة ..لعلك تفهم..ولو مفهمتش تبقى دي مشكلة عويصة ..إنت محتاج تحلها مع نفسك...<br />الكلام ده مش هكرره تاني..القضايا إلي انت طرحتها كنقد للإخوان...الاخوان وضحوهامن زمان ...وخلاص الملفات إلي انت بتتكلم عليها حالياً اتقفلت...ومبيفتحهاش غير مجموعة من الصحفين وكتاب وعقليات \"لو حلفتلهم على المايه تجمد\" مش هيصدقو ...يعني من الآخر في قضايا واشكاليات تانية عند الاخوان محتاجة النقد غير الكلام إلي انت اتكلمت عليه..قضايا بيطرحها كتاب وصحفيين تانيين ولكن بطريقة ناضجة ...الهدف منها الصالح العام ..مش تشفية غليل ولا عملاً بمبدأ خالف تعرف ولا لن اعيش في جلباب ابي..والقضايا دي ..بيطرحها عدد من الكتاب زي الدكتور محمد سيد سعيد وحسن نافعة وضياء رشوان..وغيرهم.. إنما دول اشهرهم...كون انك مش فاهم تبقى دي مشكلتك..روح اكشف ولا اتعالج!!<br />ونقطة الاحترام من عدمه..دي مش مهمة بالنسبة ليه...لأنه واضح إنه شعور متبادل...لأني بصراحة مستعيلك قوي...وبالفعل أن غلطت إني فتحت مع عيل باب للحوار...واللي يمشي ورا العيال ......!<br />المهم ..إني كل ما إنت بتعلق وترد على كلامي او على اي حد ..بيترسخ عندي مفهوم اكتر من الاول ..وهو ..إنك لسة عيل ..وبشخة !!!"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

