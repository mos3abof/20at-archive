subject = "يا قط"
author = "معاذ محمود عامر"
posted = "2007-01-18"
text = "والله أنا سعيد جدا بتعليقك لأنك والحمدلله مردتش على ولا نقطة وحورت الكلام تاني مما يدل على إنك بتهرب وعمال تخوفني بأسماء مفكرين وسياسيين طب وانا مالي ومالهم ياعم أنا قلت كلام بسيط جدا لا قلت انا مفرك ولا سياسي ولا نيلة وقلت رأي بسيط ومتهيألي بيدور ف دماغ ناس تانيين كتير والحقيقة غن حتى المقال كان فيه تساؤلات مشابهة مما يعني غن كاتب المقال كمان عيل يعني وللا إيه؟<br />يعني برضه الأستاذ الطحاوي تساءل عن علاقة الجماعة بالحزب وعن أهدافهم الجديدة وهل فعلا هيستطيعوا تنفيذ كلامهم عن المواطنة وغيره<br />عموما يا سيدي أنا اللي آسف إني رديت عليك وعلى فكرة انت اللي علقت على كلامي م الأول وكان أريحلك تهملوا طالما انت شايف انك صح كده وكلامك حقيقة مطلقة وان انا عيل عشان بقول كلام مخالف يبقى كنت تريح نفسك<br />والحقيقة يعني أنا برضه مش هاغلط فيك شخصيا عشان عيب يعني<br />يا أستاذ يا كبير ياناضج يا محترم<br />والسلام"
archived = "2007-01-31"
