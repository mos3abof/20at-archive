text = "انتمائي للإخوان من عدمه ..أظن إنه موضوع مش حيوي هنا..وعلى العموم ..أنا كنت منتمي للإخوان في فترة من الفترات ..وحالياً ..مش فاضي !!!!<br />في حاجة كمان مهمة..وهي اسلوبك اختلف عن التعليق الاول..يعني في تعليقك الاولاني كان يغلب عليه طابع السخرية وقلة الأدب..يعني استخدام لفظ أبو شخة ..ده دليل على إنك لسة عيل صغير و \"بشخة\" !!<br />إنما في التعليق التاني فأسلوب مختلف تماماً..بتستخدم لغة موالسة خايبة..وده دليل آخر على إنك ..لسة عيل صغير و\"بشخة\"!!<br />برضك..تصور !!"
