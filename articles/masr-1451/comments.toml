author = "وطني ولكن"
posted = "2007-01-16"
text = "ان الحوار لازم فى شأن مهم كهذا لأنه بداية انفتاح فى البلد لأن فصيل هام وعريض فى المجتمع ( بغض النظر عن أى وجهة نظر فيه )قد نزل الى الشارع السياسي كحزب له برنامج يقبله أو يرفضه من شاء.ان ذلك سيقوي الحياة السياسية برغم تشاؤم الكثيرين من الموافقة على الحزب.لأن ذلك سيعطى دفعة دم جديدة للحياة السياسيةالمصرية وتنشيط العاملين بالسياسة المخالفين للأخوان أو المتفقين الجميع سيحاول ارضاء الشعب المطحون وهوالمطلوب سواء من الأخوان أو غيرهم لكن وجود الأخوان سيجعل النقد والتنافس على مصلحة الشعب وتحقيقها هى الغاية التى سيلهث وراءها الجميع. ولاشك أن الأخوان منظمين جدا وظهر ذلك فى الإنتخابات والبرلمان وغيرها بل استفاد من ذلك الحزب الوطني وقلدهم حتى فى الإنتخابات والتقرب للفقراء وان كان لايقارن.يعنى وجود الأخوان سيغير طبيعة المنافسة وطبعا تحت أسس قانونية تحكم البلد.وعن نفسي حلا للمعضلة والخوف من الأخوان الغير مبرر لأن حزبهم لن يغير البلد بهذه السهولة المفترضة لأن أعظم عهود الإسلام كان فيها من يشرب الخمر ويزني و و و و كما هو معروف من الأحاديث النبوية الشريفة كشارب الخمر الذى قال عنه الصحابة رضي الله عنهم \"ما أكثر ما يؤتى به \" وكان يلعنه الصحابة الموجودون فنهاهم النبي صلى الله عليه وسلم وقال لهم \" لاتلعنوه فإنه يحب الله ورسوله \". وأقول مع أن ذلك سوف ينتقد من الجميع لنكن مثل انجلترا من جهة معينة وهى الرياسة ولتبق مدى حياة الرئيس ورئيس الوزراء والحكومة ومجلس الشعب هم من يحكم البلد والرئيس يبقى ويدير البلد من خلال قرارات وتشريعات مجلس الشعب والحكومة المنتخبين من الشعب بغير تزوير ونرى من يصـلح يستمر ومن لايصـلح يغيره الشعب.ونهتم بسرعة بمصـلحة البلد وتطويره.أما بالنسبة لابن الرئيس فهى فرصة له خلال حيا<br />اقرأ بقية التعليق .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

[[comments]]
order = 14
subject = "مجرد تساؤلات برييييييييييييئة جداااااااااااا"
author = "معاذ محمود عامر"
posted = "2007-01-17"
text = "عندي سؤال<br />لما إخوانا يعملوا حزب هيفضلوا ينشدوا الأناشيد اللي زي دي<br />يا معشر الإخوان هبوا لا تترددوا<br />عن حوضكم حيث الرسول محمد<br />أو الأناشيد دي<br />وهل عرف الدهر فينا جبانا<br />إذا هتف الحق يخشى الردى<br />ومن غيرنا يستجيب الندا<br />ويبعث في الخافقين الصدا<br />أو دي<br />بالمال والأرواح نفدي الإسلام<br />في الماضي أو في الحاضر نحن الفرسان<br />أو يهتفوا الهتاف ده<br />احنا الإخوان الله أكبر<br />أقسمنا يمينا لا نقهر<br />الخلاصة اللي مش فاهمها هتعملوا حزب يكون هدفوا إعادة الخلافة الإسلامية وللا اتنازلتوا عن الهدف ده؟<br />وازاي هيكون مدني؟<br />مدني ازاي وانتوا عايزين دولة إسلامية؟<br />وبعدين عمالين تقولوا وطنية ومدنية وديمقراطية ده أي طفل بيفك الخط يقرا رسائل حسن البنا هيلاقي إن الأجندة بتاعتكوا فلسفتها مش وطنية إنما أهداف إسلامية كلاخلافة والدعوة ومش عارف إيه كده<br />بصراحة في تناقض كبير أوي في كلامكوا مخليه كلام عبثي ميخشش غير دماغ الناس الغلابة اللي مش عارفين حاجة ف الدنيا<br />مش نافعة الحدوتة بصراحة متخشش على عيل بشخة يعني متحاولوش تغيروا جلدكوا<br />شوفولكوا خدعة غيرها<br />ربنا يرحمنا بقى"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

[[comments]]
order = 15
subject = "يا عم معاذ .."
author = "محمد القط"
posted = "2007-01-17"
text = "واضح إن معاذ عامر مراهق..يعني بالبلدي عيل صغير..وواضح كمان إنه غير مدرك لطبيعة الاخوان وأفكارهم وما يقولونه من تصورات أيدها مفكري البلد زي الدكتور حسن نافعة والدكتور محمد سيد سعيد وغيرهم كتير من المنصفين المحايدين...<br />وواضح كمان إن ليه تجربة سيئة مع أحد الاخوان وعلى ما اعتقد إنه ابوه \"ده لو مكنش بيدعي\" ..وأظن إن تعليقاته طفولية وغير ناضجة..<br />يا عم معاذ ..الاخوان المسلمين ..كتيار وفصيل سياسي مصري..غير إلي إنت شوفته في بيتكم..وفي حاجة الاخوان مقتنعين بيها ومن اساسيات فكرهم ..وهي إن في إخوان كتير في الجماعة ولكنهم مش منها وكمان في ناس كتير من الأخوان ولكنهم مش فيهم..<br />اعتقد إن عقليتك مش هتفهم الكلام ده...المهم الوالد أو أي حد إنت قابلته مش مقياس على اداء الجماعة الواقعي ..أو سبب في الغمز واللمز في الاخوان..إلي في رأيي مش أسلوب الرجالة في المناقشة..ودور الاخوان في المجتمع وخدماتهم للناس مخرجتش من تحت إيد تيارات سياسية تانية وجعت دماغ الناس بكلام عن حقوق الفقراء والطبقات الكادحة..الكلام ده..لا أكل جائع ولا أكسى عريان ولا حافظ على شرف البنات من الضياع تحت نيران الفقر وذل الحاجة...ولكن ما يمارسه الاخوان من دور خدمي للمجتمع ظاهر للجميع..فلامؤخزة ميجيش واحد أبوه ضغط عليه في تربيته علشان يطلعه بني آدم..ويمسح دور الاخوان بأستيكة رديئة..علشان شخصية ابوه \"إلي هنفترض إنه مثلاً زعيم عصابة ولا تاجر مخدرات\"..الاخوان ملهمش دعوة بأبوك..قيم الاخوان بعيد عن الوالد يا معاذ..ده فكر ناس ناضجة..مش شغل العيال إلي عمال تتكلملي عن أناشيد وكلام فاضي ...الاخوان حسموه من قبل ما تتولد.. !!<br />المهم..بعد ما كتبت التعليق ..قررت إني ألغيه..وكنت مستخسره فيك...بس نشرته ..لعلك تفهم..ومتوقعش !!"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

[[comments]]
order = 16
subject = "أبو قطة"
author = "معاذ محمود عامر"
posted = "2007-01-17"
text = "ما شاء الله على أدب الحوار والاختلاف في الرأي ما شاء الله<br />بص أنا مش هرد على كلامك لإن فيه إساءات شخصية لا تليق بأي حوار أو نقاش محترم ولكن أنا قلت رأيي في هيئة تساؤلات صغيرة الغرض منها واضح وهو السؤال هل هذه مثلا أفكار تناسب حزب مدني وفكر ديمقراطي حداثوي<br />وذكرت أمثلة وسايب الحكم للي يقرا ومش هارد عليك بأسلوبك لأن والدي اللي مش عاجبك اللي هو تاجر مخدرات زي مانت قلت علمني:<br />ادفع التي هي أحسن<br />وشكرا جدا وجزاك الله خيرا على ذوقك وأخلاقك الرفيعة واحترامك وتقديسك للرأي الآخر والفكر المخالف مشاء الله عليك وعلى حواليك بجد ربنا يبارك في أخلاقك العالية<br />نقطة أخيرة<br />أنا أشك أنك في الأصل من الإخوان لأن الإخوان (برغم نقدي لهم كما ذكرت واختلافي معهم إلا أني أعرفهم جيدا على المستوى الشخصي وعاشرتهم طويلا ومازلت لي علاقة بكثير منهم أصدقائي وأحترمهم لأنني من الذين يحترمون الاختلاف في الرأي ويفصلون بين المستويين الفكري والشخصي) أقول لأن الإخوان برغم اختلافي معهم إلا أنني أشهد لهم شهادة حق بالخلق الرفيع والأسلوب الهادئ برغم أنهم قد لا يحترمون الرأي الآخر ويؤمنون بامتلاك الحق المطلق والرأي الأصح إلا أن هذا الأسلوب التجريحي ليس من شيمهم<br />أما إذا كنت منهم فهذا أمر آخر<br />ولك تحياتي واحترامي كإنسان برغم كل شئ<br />والسلام"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

[[comments]]
order = 17
subject = "يا عم معاذ.."
author = "محمد القط"
posted = "2007-01-17"
text = "أولاً ..أنا مغلطش في ابوك بأي صورة من الصور..لأني قلت لو نفترض \"مثلاً\" إن ابوك زعيم عصابة ولا تاجر مخدرات..فده مش مقياس لتقيم الاخوان...لأن تقيم التيارات والمؤسسات الكبيرة ليه مقاييس تانية ..غير مقياس \"شغل العيال\" إلي سيادتك بتقيم بيه الاخوان..زي الاناشيد والمواطنة وغيرها من القضايا إلي الاخوان حسموها من قبل ما انت تتولد..يعني الاخوان مقالوش إن هدفهم من الحزب الخلافة ..وده الكلام إلي معاليك اتهمتهم بيه..وبرامج الاحزاب إلي تقدم بيها الاخوان خلال العشريين سنة إلي فاتو ..مفهاش سيرة الخلافة ولا حتى سيرة الدولة الاسلامية..هما قالو دولة مدنية..يتساوى فيها كل المصرين أمام القانون والدستور مسحيين ومسلمين..<br />وبالنسبة لموضوع الاناشيد والمسيقى والكلام ده..الاخوان اتكلمو فيه واتنبح صوتهم..المشكلة عندك انت..مش عايز تصدق...وإنت حر ..وعليه متقعدش تبخ قلة فهمك على مخاليق ربنا ..عايز متصدقش ..متصدقش..إنما الاخوان هيعملو إيه أكتر من كده...إنت إلي تفكيرك ضيق..<br />زائد كمان ليه الحجر على آراء الناس واحلامهم يعني الاخوان عايزين يعملو خلافة..طيب ما الناصريين عايزين يعملو وحدة قومي \"مش خط الميكروباص إلي في امبابة\"...والاشتراكيين ليهم طموحهم وبرنامجهم الشمولي برضك...أمريكا ليها احلامها التوسعية ..أي اتجاه أو دولة ليها طموحها واحلامها ...<br />انتمائي للإخوان من عدمه ..أظن إنه موضوع مش حيوي هنا..وعلى العموم ..أنا كنت منتمي للإخوان في فترة من الفترات ..وحالياً ..مش فاضي !!!!<br />في حاجة كمان مهمة..وهي اسلوبك اختلف عن التعليق الاول..يعني في تعليقك الاولاني كان يغلب عليه طابع السخرية وقلة الأدب..يعني استخدام لفظ أبو شخة ..ده دليل على إنك لسة عيل صغير و \"بشخة\" !!<br />إنما في التعليق التاني فأسلوب مختلف تماماً..بتستخ<br />اقرأ بقية التعليق .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

