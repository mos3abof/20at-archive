subject = "مزاج المصرى !!!!!!!!!!؟؟"
author = "فارس_fr"
posted = "2007-01-16"
text = "مزاج الحياة المستقر منذ مائة عام في الملبس والفنون والسينما والمسرح والسياحة والأدب والعادات الاجتماعي ....... يعنى تفتكر يااخ عبدالله ان الاخوان لو طالبوا باغلاق كبريهات شارع الهرم وحلات الدعرة اللى منتشرة فى مصر انتشار النار فى الهشيم ,,, دى انت تسميها حركة اسلمة . والله مش عيب ان الاسلمة تمنع عنا وباء الخليجيين ومن والاهم هتقولى دى سياحة اقولك اسف دى دعارة , ومين قلك ان ده هو مزاج المصرى وعاداته . بيتهيالى يا انا فهمتك غلط ياانت كل كلامك فى النقطة دى غلط<br />ارجواالايضاح ؟؟؟"
