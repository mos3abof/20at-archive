text = "بص يا أستاذ قط يعني الأسلوب العادي مش عاجبك وبتقول عليه موالسة<br />طب أنا هافهمك ليه لو كنت مش فاهم أنا غيرت أسلوبي<br />(1)<br />أنا لا أحب ادخال الشخصي في العام يعني انت بدأت حوارك بتجريح شخصي بكلة عيل أو مراهق ولم ترد مباشرة على التعليق<br />(2)<br />عندما يكون هناك نقاش بيني وبين أحد فهذا يختلف عن النقد الموجه لحزب أو جماعة ويكون أقلا حدة لأم هذه طبيعة الإنسان عموما<br />(3)<br />ما زلت على رأيي وماغيرتوش ولما قلت عيل بشخة مكنتش بشتم حد معين ولا قلت على حد مبيفهمش واحتقرت رأيه لكن انت اتكلمت بأسلوب استئصالي ودوجماتي متعصب وكأن الله قد أنزل عليك جبريل فألهمك الحق وحدك دون الآخرين المختلفين معك<br />(4)<br />لو أنا عيل بشخة عشان استخدمت الكلمة دي في سخرية أو نقد فعلى هذا الأساس كل الالفاظ والشتائم التي كلتها لي هي أيضا من صفاتك لأنك قلتها<br />(5)<br />هو أنا قلت إن أنا شيخ كبير<br />يا عم أنا لسة عيل ومراهق وعندي تمنتاشر سنة<br />وده يخصك في إيه؟<br />طالما أنا بقول رأي ما يبقى لازم تسمعه حتى لو من طفل<br />وبعدين يا سيدي المراهقة الحقيقية هي إني أرفض سماع أي صوت غير صوتي وأحتقر أي رأي غير رأيي<br />وواضح إنك مفهمتش أنا أقصد إيه بالفصل بين المستويين الشخصي والفكري<br />هاشرحلك تاني<br />يعني لو أنا مثلا ليبرالي علماني وصاحبي أصولي إخواني يبقى أنا هنتقد فكره وبسخرية شديدة كمان لو عاوز إنما مش هيأثر على الناحية الشخصية ولا احترامي ليه كإنسان واحترامي لتدينه وأخلاقه<br />فهمت حضرتك وللا أعيد تاني؟<br />للأسف في ناس متفهمش الأسلوب المحترم في الحوار وحضرتك من الناس دي عشان كده متستاهلش إن أنا أحترمك في الحوار ولكن برغم كده أنا مش هسئ ليك كشخص لأن ده من شيم ضعاف الموقف ولو عندك رأي قوي وسديد وواثق فيه مش مضطر إنك تخلي اللي قدامك مراهق وعيل بشخة عشان يطلع ر<br />اقرأ بقية التعليق .."
