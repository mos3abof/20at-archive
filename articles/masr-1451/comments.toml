subject = "حزب الاخوان الجمهوريين"
author = "خلاص ياحبيبى انت وهو"
posted = "2007-01-16"
text = "الحزب هيكون اسمة الاخوان الجمهوريين<br />شعارة نحن جمهوريين ومفيش توريث لا فى المناصب ولا فى القبادات يعنى اللى ابوة سباك مايطلعش سباك<br />الناس اخوة ومواطنين لا فضل لعربى على اعجمى الا بالتقوى<br />هانكلها بعيش ودقة بس بكرامتنا<br />هنبنى مصانع ومزارع ونشغل العيال ونجوز البنات<br />الاكل بالمجان للشعب كلة<br />عايزين حاجة تانى<br />حد دافع حاجة من جيب ابوة<br />لا<br />يبقى خلاص"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

[[comments]]
order = 10
subject = "خايفين ليه؟1"
author = "باسر أبو عمار"
posted = "2007-01-16"
text = "على فكرة لم أكن راغبا فى التعليق على الموضوع لانى شايف انه فيه فزلكة زيادة عن اللزوم ثم انى مش فاضى،ولا مؤاخذة يا عبد الله انا شايف ان عندك كلام افيد من كده كان ممكن تقوبه ،وكمان العنوان الصراحة سخيف ،مزاج ايه يا عمنااللى مرتبط بحزب الاخوان ؟المهم اللى استفزنى التعليق اللى قبلى على طول بعنوان حزب الاخوان الجمهوريين ،فعلا فتح نفسى للتعليق ،اصل الصراحة الوضع اللى احنا فيه لازم يسد نفس معظم أبناء شعبنا البطل الصابر اللى مستحمل المعاناة من سنين كتيرة قوى ،التعليق جميل وعجبنى قوى ،وهو ليه الخوف من حزب الاخوان ؟ما تسيبوهم يعملوا حزب واكشفوهم أمام الناس إنهم ما بيعرفوش يلعبوا سياسة ...."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

[[comments]]
order = 11
subject = "خايفين ليه؟2"
author = "ياسر أبو عمار"
posted = "2007-01-16"
text = "ولكن بالتاكيد الكل عارف ان الخوف من حزب للاخوان سببه اخلاصهم للبلد وحبهم الشديد ليها ،وبعدين والله الساحة السياسية هيكون فيها فرق واضح لو سمحوا للاخوان انهم يعملوا حزب ،مع شكى الكبير فى ان الحكومة عاوزة تعمل حياة سياسية اصلا ،مش كفاية الفساد والمحسوبية والسوس اللى عمال ينخر فى البلد ؟مش كفاية اكياس الدم البايظة والتوربينى وسفاح المعادى واعتقال الشرفاء ورجال الاعمال المحترمين؟مش كفاية الطوابير اللى رجعت على كل حاجة والزبالة اللى اتحملت على فاتورة الكهربا بالعافية ؟مش كفاية التعذيب اليومى فى مقار الاحتجاز ؟مش كفاية التحرشات الجنسية بالبنات ؟وكفاية والنبى على كدة المسالة مش ناقصة إحباط"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

[[comments]]
order = 12
subject = "رد اعتبار"
author = "الأستاذ مأمون الهضيبي رحمه الله المرشد السابق للإخوان هو صاحب فكرة إدخال الحزب إلى الجماعة وتوافق بذلك مع الأستاذ التلمساني مرشد الانفراجة، ويمكن القول أن الاستاذ مأمون ظلم كثيرا من تلامذته ومعاصريه، فهو راعي التجديد داخل الإخوان ..بداية من وثيقة دعاة لاقضاة التي حررها بنفسه في السجن، إلى الصفقات السياسية مع الأحزاب العمل والوفد إلى رسالة 94 التي تخص المرأة والشورى والأقباط فضلا عن برنامجه الانتخابي الخاص به."
posted = "2007-01-16"
text = "وبناء على جهوده بدأت تخرج مشاريع حزب الإصلاح الذي أعده الأستاذ مأمون،"
archived = "2007-01-31"
