[[comments]]
order = 2
subject = "الدين النصيحة يا فضيلة المرشد"
author = "الدين النصيحة يا فضيلة المرشد"
posted = "2007-01-16"
text = "لا الزمان ولا المكان يسمحوا بالنشاط السياسي لجماعة الاخوان المسلمين يرجى التنبيه على اعضاء مجلس الشعب من الاخوان بالاستقالة فورا من مجلس الشعب وايقاف اي نشاط سياسي لجماعة الاخوان المسلمين والانخراط في صفوف الشعب وان يكون الاخوان المسلمين جماعة وعظية تعظ فقط وتحظ على الفضيلة والاخلاق الحسنه.<br />كفاية سجون<br />كفاية معتقلات<br />كفاية امن الدولة<br />ارحمنا بأه يا اخي<br />50 سنه في عذاب 50 سنه في رعب<br />لو كان ربنا رايد لهذه الجماعة النصر ما كنش قتل حسن البنا<br />واوجه نداء الى السيد حسني مبارك انت لك مطلق الحرية في تعيين من يخلفك تماما مثل الخلفاء الامويين والعباسيين<br />ارحمونا يا عالم كفاية سجون كفاية معتقلات كفاية سياسة الناس جاعت"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

