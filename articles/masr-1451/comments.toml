[[comments]]
order = 20
subject = "ابو لهب.. أفضل من مبارك !!"
author = "بالنسبة للتخوف من الاخوان أو من اي تيار سياسي آخر من إن البلد تنهار أو تحصل فجوة سياسية"
posted = "2007-01-17"
text = "اظن لإن أي فصيل سياسي مصري هيكون افضل من النظام الحاكم الحالي<br />وبيتهيألي لو إن ابولهب كون حزب وسماه الحزب الوثني الديموقراطي مثلاً وكان نائب رئيس الحزب أمية ابن خلف وأمين التنظيم هو عمرو ابن ود ورئيس لجنة السياسة الوليد ابن المغيرة وأمين التثقيف ابو جهل عمرو ابن هشام...<br />في اعتقادي إن الحزب ده هيكون احن وارحم على المصريين من الحزب الوطني...<br />لأن بصراحة مجموعة الحزب الوثني أسست حزب في الجاهلية إسمه \"حلف الفضول\" كان ليه دور مهم في الحياة السياسية والاجتماعية في الجاهلية....<br />ترويج كلام مبارك عن الاستقرار والخوف على مستقبل البلد من التغير ومن القوى السياسية المختلفة بيصب في ترسيخ الوضع القائم وبيقطع حبال الثقة بين الناس والقوى السياسية..وفي الآخر كل ده بيصب في خانة النظام...نفس الكلام بيتقال عن صدام إنه افضل من وحد العراق وكلام خايب زي كده...في حين إن العراق مشفش الطائفية إلا في عهد صدام ..<br />المهم..لو وزة حكمت مصر ..هتكون احسن من حسني مبارك !!!"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042409/http://masr.20at.com:80/article.php?sid=1451"

