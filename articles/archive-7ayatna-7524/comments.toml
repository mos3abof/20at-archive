[[comments]]
order = 37
subject = ""
author = "فلسطيني قرفان"
posted = "2009-05-25"
text = "لا حول ولا قوة إلا بالله …<br />إنتو لليوم على هالقصة … والله أنا فكرتكم عقلتم<br />يا إخوان القصة ما بدها هالكم الهائل من التعليقات ..<br />كل القصة واضحة ( كل واحد يروح على البيت عندو ويشوف أهلو | إخواته - أمه - أخوانه وباقي العيله | ويطلع فيهم ويشوفهم وبعدين يطلع في الشارع ويقعدلو خمس دقليق فالشارع ويحكم على حالو ) .<br />وكل واحد عارف حالو .. بلا أردنية بلا فلسطينية<br />أخونا ( الأردن عز وفخر ) بيكولك مش | لاكيين | وبعدين ليش نودي نسواننا إلهم<br />ما هما ييجوا عندنا وإحنا نبعتهم إلهم عالدبابات وببلاش كمان من غير دولار واحد يا أخو | الكحبه |<br />وأخونا بيشتغل وبيتعب ( طبعا الكل عارف إيش بيشتغل ) وبياكل من عرق طـ ـ ــ ه ؟<br />طيب أنا قرفت .. بدي أروح بلكي ألاكي لكمة أكلها<br />طبعا لنا عودة إن شاء الله يا تعيبه إنتو"
archived = "2009-08-02"
capture_url = "https://web.archive.org/web/20090802160820/http://www.20at.com:80/20at/7ayatna/7524--facebook.html"

