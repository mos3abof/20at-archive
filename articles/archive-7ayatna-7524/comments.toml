text = "بعد السلام ,<br />الأخ الفلسطيني ما دامك شاد حيلك كثير , ورافع راسك كثير , وبالعربي يعني ( يا أرض احفظي ! ) شو فائدة الكلام هسه !<br />إذا إنتو نفسكو مش عارفين شو تعلموا !<br />والله دنيا بالعكس !!! بقتلوا القتيل وبمشوا بجنازتو !<br />شوف عيوني أنا ما ودي أكثر كلام معك , ولكن كل واحد منّا عارف شو عمل وشو رح يعمل ! وكل واحد منا عقلوا براسو بعرف خلاصو !<br />وبلاش يعني شغل الكلام ( كلنا العرب شاطرين بالكلام ) !!<br />إذا أنت مفكر حالك كثير يعني حليت مشكلة الشرق الأوسط بتكون غلطان وغلطان كثييييييييير ,,<br />المشلكة أكير من فلسطين وأرض فلسطين ( مع الإحترام الشديد ) !<br />راجع بأقرب وقت : أنا"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

