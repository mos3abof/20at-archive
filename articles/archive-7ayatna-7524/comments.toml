text = "معلش ارجع واحكيلكم يا شباب في ناس بتدور على الفتنة وبتزرع فينا الكره يا ريت ما نفتح مجال لهذه النفوس المريضة انها<br />تنجح وتفرقنا لانه احنا مثل ما حكيت اخوة واهل والله العظيم في اصحاب لي اردنية بعزهم اكثر من اخواني وبفديهم بروحي<br />وهم كمان بيعزوني والنا وقفات مع بعض الاخوان بهذا الزمن ما بيوقفوها<br />والله يخليكم بلاش تحقدوا على بعض والله العظيم اول ما شفت المواضيع اللي انطرحت اني ما قدرت اكملها وياريت اكون<br />قدرت اوصل الصورة بمضمونها ويا ريت تكونوا فهمتوني يا جماعة والله يهديكم ويفتح عليكم"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

[[comments]]
order = 23
subject = ""
author = "اكتب اسمك هنا"
posted = "2009-01-24"
text = "يا جماعى الخير انتم ما خليتوا مسبة ولا كلمة احتقار الا وحكيتوها والطرفين ما قصرتوا ببعض<br />اسمحلي احكيلك شي يا اخي الكريم انا شاب فلسطيني وبعيش بالاردن ولي الشرف اني اعيش بالاردن وانتمائي للاردن<br />لكن مش معنى هالحكي اني انسى بلدي الاصل والله العظيم بتضايق لما اشوف العنصرية من الطرفين سواء منا او منكم<br />وانا مش عنصري وخليني احكيلك شي احنا عائلة وحدة وبيننا نسب و انتم خوال اولادنا واحنا خوال اولادكم وبينا عيش وملح<br />واللي اهم من كل هالحكي انو بيننا عيش وملح وبيننا عهد الله والحكي مش موجه الك بشكل خاص بس لكل اللي بيسب<br />وبيشتم من الطرفين احنا عائلة وحدة وعرب وكل الاحترام والتقدير للاردن اللي آوتنا ويا ريت تشيلوا من راسكم انه احنا<br />شعب ناكر للجميل<br />حتى الرسول منع سب الديانات الاخرى مش لانهم صح بس لانهم رح يسبوا دينا كمان وعشان هيك يا اخوانا الاردنيين والفلسطينيين بلاش تخلوا بقلوبكم حقد وصفوا نفوسكم وبتمنى ربنا يوفقنا ونسامح بعضنا وتضل المودة والمحبة عنوان<br />الصداقة والاخوة واسف لو طولت عليكم سامحوني واخيرا يا شباب وحدوا الله واخزوا الشيطان واحنا اهل وقرايب"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

