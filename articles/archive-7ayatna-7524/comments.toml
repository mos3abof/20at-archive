text = "محمد نواف باختصار كس اختك ياابن الشرموطة الاردنية مع خالص الشكر لاختك مصيصة زباب الفلسطينية ولك الاردنيات بطلعو في باص القرية الفاطس و ريحتكم من ركوب الحمير الي هية حضارتكم تلويث للبيئة بوصلو المدينة يدورو على زبااااااااااااا ااااااااااااااا ااااااااااااااا ااااااب الفلسطينية بتعرف ليش يا ابن الزنا علشان انتو ما بتعرفو الى الجيش رجالكم كلهم بلجيش بتغيبو عن نسوانكم بلاشهر بطلعو على سدد المحلات التجارية علشان ينتاكو برجع الخرة منكم بلعب على طيز مرتة الي مطلقها عشريييييييييييي يييين مرة بقلها هييييييييي يامرة افتحي رجليكي بدي انيشك نيش هسع و العب عطيزش انا ما بدي اطيل الكلام اسئل امك مين ابوكككككككككككك ككككككك صاحب اي محل تجاري في الاردن يا ابن الزنااااااااااا اااا اااااا"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

