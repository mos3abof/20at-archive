posted = "2008-08-21"
text = "لا اعرف كيف يقاس الشخص انا مولود بالاردن وحاصل على الجنسيه الاردنيه وطفولتي وكل مراحل دراستي من الابتدائيه حتى انهيت دراستي الجامعه كانت على ارض الاردن ويقولون لي انت اصلك فلسطيني ليس لي لا من قريب ولا من بعيد بفلسطين حتى ولا ذكرى واحده فيها فكيف انسب حالي لها حتى لو كما يقولون انني من هناك افخر كوني ولدت على تراب الاردن واحمل جوازه فلينظر كل من يتلفظ على الاردن بسوء كيف اوضاع الفلسطينين في لبنان ومصر وسوريا حتى كما يفعل الكثير يستخدمون كلمه فلسطين للاستجداء فقط ليس اسرائيل هي الخلل الخلل موجود فينا نحن الفلسطيني مع احترامي له يكره حتى نفسه لماذا احب الاردن حتى الثماله حتى لو كل العالم اعتبرني غير اردني الزرقاء هي جنتي على الارض"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

