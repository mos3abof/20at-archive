text = "اللة ينصرك ياحمممممممممودة شكري يا قاهر الاردنين اولاد اصدقاء ازواجهم ما لقيت ارخص من البنات الاردنيات الحق يقال معلمات في مص الزبااااااااااا ااااااااااااااا ااااااااااااااا اب هادة الحلو فيهم خلي اخو الشرموطة الاردني يجيبلك اختة تمصلك ايرك وتحياتي الك ولاهل فلسطين ولكل شاب عندة كرامة لاخوانة الفلسطينين . وكس اخت احسن اردني خسيس عميل لاسرائيل تفووووووووووووو ووووووووووووووو ووووووووووووووو ووووووووووووووو ووووووووو عليكم متاسف يا اخوات العاهرات ازا بدي اسبكم اكثر بحكي يا اردنين تفووووووووووووو وووو ."
