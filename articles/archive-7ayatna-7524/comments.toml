[[comments]]
order = 12
subject = ""
author = "شيطان"
posted = "2008-08-21"
text = "فلتحيى اسرائيل قبل ان تضع الدول المستعمره هذه الحدود المصطنعه واصبح هناك الاردن وفلسطين كنا امه واحده شعب واحد فلماذا هذه العنصريه التى تلهب المشاعر وتولد الحقد حتى بين الاخوه اذا لم تعجبكم كلمه اخوه فنحن مسلمين واذا ايضا لم يعحبكم مسلمين فنحن عرب اذا نحن على مساحه صغيره جدا هنا لا نتفق هل تريدون ان ننتصر على عدونا مهما كان ؟ عدونا نحن انفسنا والحقد الدفين الموجود داخلنا لماذا تفتخرون كما كان يفخر اهل الجاهليه الله جعلنا ارذل الامم عندما عندما ابتعدنا عن طريق الله وتريدون ان نتوحد ! فعلا فلتحيا اسرائيل يكفيها فخرا ان فقط 25 مليون نسمه مسيطره على العالم بأسره ليس فقط بقوه السلاح لانهم فقط يفكرون مهما كان لونه او البلد الذي جاء منها او ولد فيه بمصلحه اسرائيل فمتى يكون عندنا وعي عدونا ونصبح فقط ان نحب انفسنا لا غير ذلك"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

[[comments]]
