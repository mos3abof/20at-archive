text = "مرحبا اخوي الاردني … انت بتقول انو الاردن كلها امجاد وكلها فخر<br />اذكرلي مجد واحد سوته الاردن ؟!! بلاش صعبة هادي …<br />اذكرلي تاريخ الاردن ؟!! وهل كان في دولة اردنية ؟!! ومن وين جاءت الاردن ؟!! \\\"اكيد بتذكر مراسلات الحسين و مكماهون<br />الدولة الوحيدة في العالم العربي يلي مالها ذكر في التاريخ هي الاردن … بلاش نيجي لمسلسلاتكم التاريخية كلها بدو وخيام<br />يعني ما كان فيها حضاااارة خالص \\\"عبارة عن رعاة غنم وماشة و رحالة \\\" يخلف علي خلالكم دولة حبيبي<br />يعني باختصار انتو يالاردنين اخر ناس تحكو على الفلسطينين و الفلسطينين اخر ما بيفكر انهم يلقو احترام منكمــ<br />ياريت تخبي راسك و تخجل حالك لما تقول انكـ اردني لانك عارف وواعي معنى كلامك"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

[[comments]]
order = 16
subject = ""
author = "فلسطيني قرفـان"
posted = "2008-09-06"
text = "طيب ما دامكم هيك نار وبتردوا على بعض ما شاء الله وردودكم مقنعه<br />وأنا شايف إنوو إنتو الإثنين أنيل من بعض ..!<br />هيو الفيس بوك ما شاء الله .. ( مش سامعين إلكم صوت هنـاك ) مسيحية وأجانب مشرشحين العرب<br />نفسي أشوف هناك ردرود هيك ..<br />ولا بس بتتشاطروا على بعض ؟ أكيد .. لأنوو الواحد فيكم بيعرف حالو إنو غلط بس بيتعاوج<br />بس بيني وبينكم<br />كل ما أشوف كلمة أردن بجميع مشتقاتها وحتى بالإنجليزي<br />ما بييجي على بالي غير .. ( زقلاب) وزقلاب هاد واحد أهبل عندنا .. بنطلونو نافخ من ورا ( أعز الله السامعين ما عدا الأردنية ) ويا ترى من شو نافخ .. هاد ما بيعرف شي إسموو حمام .. بيعملها على حالو وبتنشف وهيه في البنطلون<br />ولابس 30 بلوزة فوق بعض ومش لابس في رجلو شي .. وكعب رجلو أقسى من الأسفلت<br />وأحيـانا بقول والله ضلمتوو لزقلاب .. يمكن بشوفه أحسن منهم (الأردنية<br />تعالوو نحسبها بالعقل ومن غير غلط .. كلنا شاطرين بالغلط<br />الفلسطيني إلوو أصل وأجداد ( الكنعانيين )<br />الأردني لا أصل له … ؟؟؟ !!!<br />فلسطين إنذكرت في التاريخ وتذكر في الحاضر وذكرت وستذكر في المستقبل<br />الأردن عمرنا ما سمعنا فيها إلا أيام ما مات حسين .. وشفنا عبيد الدينار بيجروا في الشوارع قال هامهم حسين<br />وبيحاولو يعملو أي شي غريب علشان يبينو للعالم .. قال شو شرطيات مرور .. يا خزوة<br />فلسطين حكمها رمز العرب كلهم .. القائد الرمز ياسر عرفات ولما إستشهد كل العرب زعلت عليه<br />حاليـا .. أبو مازن وهنية بنشوفهم خونه .. وفي نفس الوقت بنغلط عليهم وما حدا بيحبهم ( صراحة)<br />الأردن حكمها عميل وخاين (حسين ) وما حدا إتذكرو إلا تبعون الدينار<br />وحاليا بيحكمها .. (هذا الجرو من ذاك ال[يا وحش] ) .. وزيوا زي الي جابو .. وأبصر إبنو .. يمكن رئيس أمريكا ولا بريطانيا ولا حتى إسرائيل .. ما علينا وعمري ما شفت شعب بيحب ملك بهالشكل .. ( والله لو إنو نبي ) ليش ؟؟؟؟؟؟<br />لأنو الدينار إلو تأثير … كل ما ييجي الأردني يعترض على شي . . بيدحشلو في طيـ؟؟؟..ــو دينار<br />فلسطين شعب لولا الحصـار .. بس بديش أكمل !!<br />الأردن لا حول ولا قوة إلا بالله مش مذكورين عالخريطة<br />فلسطين شعب الشهداء والعلماء والعظماء ..وبإمكان الي مش مسدق عندو قوقل واليو توب والويكي بيديا<br />يشوف !!<br />الأردن شعب طالما خرج نكشات الراس .. والنت أكبر دليل روح إبحث عن الأردن مش حتلاقي غير متخلفين بيضحكوا الناس عليهم .<br />وليش أكثر في الكلام .. مهي الأردن واضحه من ألفاظ أهلها .. طبعـا كل واحد بقول الي متربي عليه ..<br />والي بيشوف حالو أزعر ومنـ…؟؟ـك بنات فلسطين .. بدي أقص إيدي إذا ما كانت أختكـ من بنات الهشك بشك<br />وشفناهم بجرش وغيرها<br />بتكون 15 إيد شب في طيـ؟؟ها وهيه قال بتصور ولا بتغني ولا بتشجع في المغني<br />وبنات غزة على سلامتهم .. ومش كل أصـابع الإيد وحدة .. بس إنتا بما أنو شايف الغلط فيك ومش قادر تعمل شي<br />إذا هو نقطة ضعف عندك .. في المقابل بتشوف حالك أبو الشرف إنتا وخواتك ( ربنا يستر الجميع )<br />بس مش إذا ربنا سترك تروح تفضح في حالك ..!<br />الدنيا رمضان .. والدينا الصبح<br />بديش أكثر في الكلام .. لأنو بعرف كيف ( زقلاب بدو يفهم) هع<br />وتحياتي للجميع<br />ولنا عودة إن شاء الله .. ورمضـان كريم (F)"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

