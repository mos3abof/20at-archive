text = "يا ال[ *** ] يا يوسف الشاهد<br />احنا الشعب الي عايشين عالمرتزقة يا اخو المنيوكة ما حدا ودالكو مساعدات غير الاردن ما حدا ودالكو اطباء غير الاردن يا ال[ *** ] واحنا نوديلكوا الطعام على بلادكوا يعني معيشينكوا ببلادكوا وبالاردن من وراء تعبنا بلحلال والمواشي وانتوا خواتكو ينتاكن قدام عينوكوا يا اخوا البلاعة يعني بلعربي خواتكوا ينتاكن بفلسطين من الامريكان ولا مكفيهن ازباب الامريكان وجيات ينتاكن بالاردن يعني شو هذا والله تعبت من نياكت خواتكوا صفات عدور انيك الاولى وتجيني الثانية مشان الله ارحمني من نياكت خواتك يا سيدي لاتزعل انت وفلسطينية كلهم على زبي بس تعال خذ خواتك من وراهن ما صحلي اقعد انا مراتي"
