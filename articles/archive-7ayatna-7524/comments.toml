posted = "2009-04-30"
text = "رسال الى ضابط المتقاعد<br />انا عسكري في الجيش الاردني معلومة أنا السرية الي انا فيها ولا عسكري يقدر يحكي معي بتعرف ليش لاني شفتهم مستمتعين بنياكة خواتك وعزموني استمتع معهم بس انا ما يحصلي الشرف انيك فلسطينية ولا هما يحصلهم الشرف انهم ينيكوا فلسطينيات بس حابين نعلم عليكوا"
