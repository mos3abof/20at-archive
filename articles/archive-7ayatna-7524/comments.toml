text = "اذا انتا عندك مشكلة مع المذكور اللي هو محمد نواف الحمدا لله أنا شو دخلني ؟؟؟؟؟<br />انتا أكيد عامل معاه مشكلة وصاير تشكك بالعالم والناس اللي بتعلق بالصفحات<br />يا ولد روح انقلع من وجهي مش فاضيلك لا إلك ولا الثانيحمد ؟؟<br />وبعدين انت ا اكيد ناشر تعليقك الطوويييييييييي ييييييييييل كثير بكل صفحة بدخلها هذاك الثاني ياولد روح حلوا مشاكلكوا بعدين عنا<br />مش ناقصين احنا وجع راس هونه من وين بدو الواحد يلاقيها يعني ولك القضية أكبر من خيلاتك وتصوراتك !!"
