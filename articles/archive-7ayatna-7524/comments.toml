text = "رسالة الى فلسطيني قرفان<br />انت بتغلط على الاردنية من وراهم وبتغلط على اللمك عبدالله ملكنا وسيدنا احنا شعب ما نخون بعضنا مثلكم الي يقول انا مع فتح وانا مع حماس وما تتوحدوا مع بعض لوانتم بتغلطوا علينا قدام وجوهنا لفضحنا عرضكم مثل الفلسطنين الي ساكنين عندنا اما بتقول زقلاب حنا الاردنية مانعرف لازقلاب ولاغيرها حنا الاردنين عشنا من تعبنا اما انتم بعتم اراضيكم لليهود وجيتوا عندنا وتركتوا بلدكم ورئيسكم الي طالما نشوفوا على التلفزون لايعرف يحكي كلمة اب اب اب اب اب اب كل العالم بتضحك عليكم وضلكم تغلطوا على الاردنية من وراهم مثل الاسود اما قدامهم مثل البساس ويوجد طلاب يدرسون عندنا في المدرسة فلسطنين ولا واحد يقدر يفتح اثموا بتعرف ليش لان اصغر واحد بينا داعس على راس احسن فلسطيني لانكم مالكم امان وخون يلي بتقول زقلاب كل الفلسطينية زقلابين هههههههههههه"
archived = "2009-08-02"
capture_url = "https://web.archive.org/web/20090802160820/http://www.20at.com:80/20at/7ayatna/7524--facebook.html"

