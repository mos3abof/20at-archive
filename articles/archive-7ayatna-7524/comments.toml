[[comments]]
order = 4
subject = ""
author = "يوسف الشاهد"
posted = "2008-08-05"
text = "الاردنيون اولاد القحبات.. بعد ما اجروا ارضهم 99 سنة في الباقورة وجنوب البحر الميت طبعا غصبن عنهم لانهم ما بقدروا على زعل اسيادهم في تل ابيب وواشنطن ولندن.. بعد التاجير صاروا يبيعوا ارضهم عينك عينك.. واخر خبر اعلنت صحيفة يديعوت احرونوت في عددها الصادر اليوم ان اليهود استطاعوا استملاك الاراضي الواقعة من منطقة جلعد - البلقاء مرورا بمنطقة السرو غرب الفحيص غرب ماحص الى غرب دابوق مرورا بمنطقة بدر وحتى جبل نيبو - مادبا ونسبة الاستملاك وصلت حتى الان الى 35% والحبل على الجرار.. واولاد العشائر اللي بسميهم ملكهم \"نشامى\" بتمسخر عليهم.. ببيعوا في الارض وبسمسروا وهم عارفين لليهود المهم النشمي يروح يجوزله وحدة لبنانية تنيكه بدل مرته المعفنة اللي ماكلها القمل والبراغيث وكسها معطبن.. كس ام هيك شعب اخو شرموطة.. شعب مرتزقة شحاد عايش على المساعدات وعلى ظهر الشعب الفلسطيني اللي تامروا عليه عينك عينك منذ المقبور عبدالله الاول وحتى اليوم.. هذا شعب اكثر شعب متامر في التاريخ العربي المعاصر وسيكتب التاريخ بحروف من خرة سيرة هذا الشعب وسيرة دولته المصطنعة المسخ التي اقيمت لخدمة بني صهيون"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

[[comments]]
order = 5
subject = ""
author = "ابن الشعب الحر وليس الشعب الار"
posted = "2008-08-15"
text = "ما ان صدرت الاوامر من الشرموطة رايس بضرورة مسارعة الزعماء العرب لزيارة العراق.. الا وان هب ملك الاردن عبدالله الثاني ليكون اول الذاهبين الى هناك خدمة للاهداف الاميركية والاسرائيلية في المنطقة.. وكونه التلميذ النجيب في مدرسة ابيه واجداده التي سارت على خط العمالة والخيانة منذ حسين بن علي مسقط دولة الخلافة العثمانية الاسلامية ومنذ عبدالله الاول بايع فلسطين مقابل انشاء كيان له ولاولاده في شرق نهر الاردن في منطقة صحراء فلسطين وبادية الشام<br />هذا هو دور هذه السلالة والتي وجدت شعبا اسموه الشعب الاردني وهم من البدو الرحل والسقط وجدوا شعبا تافها لا يفقه ثلث الثلاثة في السياسة بل لا يعرف كيف يخرة وجدوا شعبا كالحمار ان تحمل عليه يلهث وان تتركه يلهث.. فطال بهم الحكم وسيطول ما دام يوجد بين الشعوب العربية شعب اسمه الشعب الاردني"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

[[comments]]
order = 6
subject = ""
author = "عمار الفايز بني صخر"
posted = "2008-08-15"
text = "تتحدث عن الفلسطنيين وكانهم شعب بلا تاريخ او بلا اصل.. اقول لك ان 70% من الشعب الفلسطيني اصولهم تعود الى الحجاز ونجد واليمن يعني مثلك يا فصيح زمانك.. وهذه النسبة ليست من عندي من كتاب ومؤرخين اردنيين مثل الموسى وغيره.. وللعلم ايضا فان هذه النسبة الاصيلة من اصول الشعب الفلسطيني ليست موجودة عند شعبك الاردني وانا واحد منه.. حيث ان نسبة السكان الاردنيين \"القح\" لا يتجاوزون نسبة 35% والباقي مرتزقة من الشيشان والشركس والدروز والجبلية والشوام والعراقية والمصاروة.. فبلاش فذلكة ولا اعتقد ان الشعب الفلسطيني يهمه ان يكون الصخور اصلهم من فلسطين بل انا اقول لك لو خيرت لاحمل جنسية عربية او اجنبية لن اختار سوى الجنسية الفلسطينية لانها شرف على جبينك وليس الشرف ان تضع شعار من يخدمون الاجنبي وياتمرون باوامره فوق راسك"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

[[comments]]
order = 7
subject = ""
author = "عراقي عروبي شريف"
posted = "2008-08-15"
text = "كلمة حق اريد اقولها في هذا الموقع وفي هذه العجالة.. من خلال تجربتي الشعب الاردني شعب خسيس وهو يتعامل حسب مصالحه والشعب الاردني ما فيه عنده نخوة ولا شهامة ولا رجولة ولذلك هو سريع الانقياد لاي حاكم يجي يمه.. اما الشعب الفلسطيني فهو شعب عربي عملاق بالفعل مو بالحجي.. شعب فلسطين هو خلاصة الشعوب القومية المناضلة رغم ان الاردنيين هم اكثر شعب تامر على الفلسطينيين قيادة وحكومة وشعبا.. في النهاية لا بد ان اقول ان جولة الباطل ساعة وجولة الحق الى قيام الساعة"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

[[comments]]
order = 8
subject = ""
author = "الشراري الفلسطيني"
posted = "2008-08-15"
text = "سبعك وخرة عليك.. ولك شرف عظيم الك انك تكون من اصل فلسطيني مش من اصل سلالة الخيانة والعمالة في المنطقة.. وبعدين انتوا اللي اطعمتوا الشعب الفلسطيني اللاجئ عندكوا ولك القمل كان ماكلكوا وكلوب باشا بنيك في نسوانكوا من شان علبة حلاوة وتنكة زبيب.. هسة صرتوا شبعانين يا جعانين يا اللي القمل والجرب ماكل منكوا اليد والمعصم يا حثالة.. اخص عليكوا واحد يقول للثاني يا انذل الشعوب العربية يا اللي ما عندكوا غيرة لا على ارض ولا على عرض شحدتوا على ظهور الشعب الفلسطيني اللاجىء انتوا وحكامكوا مش تشبعوا وتتعلموا وتصيروا نواب واعيان ووزراء وانتوا خرة ما بسوى الواحد فيكوا تفة بس العتب مش عليكوا لانه الشرموطة اكثر وحدة بتحكي عن الشرف"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

[[comments]]
order = 9
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-08-15"
text = "الأخ اللي معلّق وقآيل .. إن الصّخور [ بني صخر ] ..<br />أنا أشهد لك أن المجالي والرّفآعـي كما ذكرت أصلهم فلسطيني !<br />لكن الصّـخـور .. تهبَـى وتخَسي والله !<br />لا تحرّف في أصلنآ .. تفهَم ؟<br />حنّآ الصّخور ما جيناها فلسطين إلاّ يوم فزعنا معاكم والله يرحم شهدآء الجبُور والخرشآن يوم فزعَوآ في 67 مع الفلسطينيين !<br />حنآ الصّخور مردّنآ وأصلنآ يعُود لنجد يآخوي !<br />وبـصـرآحـة أستغرب من اللاجئ اللي يجي يسب بالأردن !<br />يا عمي ظبينآكَم .. وحطينآكم في ديرتنآ ..<br />لعن أبو من جابكم تاكلون وتنكرون !"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

[[comments]]
order = 10
subject = ""
author = "أبن الشهيد"
posted = "2008-08-21"
text = "الاردني الشهيد رساله الى كل اردني وكل فلسطين<br />الى الاردنيه النشامى<br />الى شهداء الوطن …<br />الاردن وفلسطين بلد واحد ووطن واحد<br />الى عمي الشهيد عليان حسين على ابورمان *الاردني* السلطي* الذي استشهد على جبل المكبر في القدس الشريف<br />لا تقلق فانتا شهيد وطلبت الشهاده للحفاظ على الوطن والعرض وقول كلمة الله اوكبر واشهد ان لا اله الا الله وشهد انا محمد رسول الله<br />الاسلام اولا<br />والاردني اولا<br />والاردن اولا<br />فيا فلسطنية الاردن يا ااهوا المتاردنيين لوعلم الشهيد انه في يوم من الايام سياتي من هاذا الشعب الفلسطين شخص ويسب الاردن ويسب عرض الاردن هل تعتقد بانه سوف يذهب للدفاع عن فلسطين…حتى يستشهد ويموت هناك<br />هل تستطيع الاجابه؟؟؟؟؟<br />انا استطيع نعم سوف يذهب ولا يتتردد لانه يعرف انه واجب ديني ووطني ولن يتتردد<br />احذرو الياهود يا عرب<br />يا فلسطينيه هل انتم فلسطنيه<br />وهل يوجد شيئ على الخارطه اسمه فلسطين<br />ما ااانتم<br />اسرائيليين<br />من اسرائيل<br />نحن الاردنيين لسنا اعدائكم<br />نحن على استعداد ان نضحي بانفسنا واموالنا فداء لكم فاعرفو عدوكم<br />هل تعتقدو ان الشهيد رحمة الله عليه عليان ابورمان المكتوب اسمه على باب بوابة بلدية السلط الكبرى<br />لوسمع هاذ الكلام سوف يقوم بقتل اليهود ام الفلسطنيه قتلهو ام الدفع عنهم<br />حسبي الله ونعم الوكيل<br />khaled_algool@y ahoo.com"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

