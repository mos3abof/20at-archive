author = "واحد مر من هون بالصدفة و ندم"
posted = "2009-03-28"
text = "أولا: الأردن و فلسطين أرض واحدة بدليل إن الأردن أسست أول شيء على انها إمارة \"شرق الأردن\" أي شرق نهر الأردن أي أن غرب الأردن هو فلسطين.<br />ثانيا: أشك أن الحيوان اللي كتب أول تعليق ورمز لإسمه ب\"الأردني\" انه صح أردني… المقال بعيد تماما عن أي جدال فلسطيني/أردني… يعني باختصار هذا جاي يولعها و مو معروف قرعة أبوه من ويييييين وأحلى شئ بكلامه هو كلمة \"التاريخ\" اللي زتا بالنص صحيييييح إن لم تستح فافعل ما شئت… بلمرة فيك تكتبلنا شوي عن هاذ التاريخ … ما راح اضغط عليك كتير بس خلال القرن 18… حاول ترد…<br />ثالثا: الله يخليكم الأردن شيء و العائلة الملكية شئ ثاني زي ما فلسطين شئ وأبو مازن وشلته شئ ثاني و هام جر (عمم على باقي الأنظمة العربية)… بظن المعنى وصل<br />رابعا : يا أخوتي طولوا بالكم شوي مش أي [يا وحش] بينبح جنبكم رح تردوا عليه… نحن مسلمين قبل كل شئ"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419020419/http://archive.20at.com:80/7ayatna/7524.html"

