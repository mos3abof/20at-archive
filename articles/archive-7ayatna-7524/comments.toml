text = "انا فلسطيني وافتخر انا مابدي احكي كثير ومابدي ارد على الاردني المتعصب لانة جاهل مسكين بحكي المثل جاهرت العالم وغلبتة وجاهرني الجاهل فغلبني فلسطين ااااااااااااااا ااااااااااااااا اخ ما اغلى ترابك احنا العرب مش كويسين مع بعض مااشطرنا بس نشمت في بعض بدل ما تناصر اهل فلسطين يا جاهل لانة بلد عربي مسلم على الاقل روح دور على اصلك يا وسخ ان مش عنصري لاكن فلسطيني غصب عن رحمة شرفك واضيف الى معلوماتك انا من مواليد الاوسخ قصدي الاردن على فكرة مابدي تزعل مني ياجاهل ."
