subject = "شاعدة عيان على غرق السلام 98"
author = "لميس"
posted = "2006-04-11"
text = "هكتب حاجة وأتمنى الناس تاراها<br />أولا انا بنوتة عندها 13سنة أكيد تستغربو من الإسم لاكن انا مسلمة عموما مش هطول عليكم.............<br />شاهدة عيان سعودية .. تروي قصتها مع كارثة العبارة<br />الحمد لله وحدة والصلاة والسلام<br />.. بتفاصيل مرعبه.على من لا نبي بعده، وبعد:<br />فهذه قصة المرأة التي نجاها الله من كارثة غرق العبارة السلام 98 ، وبدون مقدمات ولا ممهدات سأسرد القصة كما حدثتني بها:<br />ـــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />تقول أن زوجها لايحب السفر للخارج بطبيعته ولكن بعد زواجي بأشهر طلبت منه السفر لمصر.. وافق زوجي على السفر، وقمنا بشراء بعض الملابس والأغراض التي نحتاجها،<br />واقترح زوجي شحن السيارة ليسهل علينا التنقل داخل مصر... شحنا السيارة وركبنا العبارة.. حاول زوجي أن يكون في الغرف الداخلية، لكن بسبب تأخرنا لم يتمكن من ذلك، فقال: لايوجد مكان إلا على سطح العبارة..<br />قلت له: لابأس الجو جميل والرحلة لن تستمر طويلاً.. لكن المشكلة أن زوجي بدأ يشعر بالبرد وظهرت عليه علامات السخونة.. المهم بدأت الرحلة من غير تنظيم ولا ترتيب، ولا توجد أي إرشادات للركاب من حيث الأماكن المخصصة للجلوس طريق الطواريء وإرشادات السلامة كل من يدخل يجلس في أي مكان..<br />بدأت الرحلة والناس في مرح وانبساط وكثير من الركاب ذهبوا للسينما ليقضوا بقية رحلتهم.. جلست أنا وزوجي على سطح السفينة ومعنا بعض اللحف والبطانيات نتقي بها البرودة.. وبعد مضي ساعتين وكان وقت غروب، شممنا رائحة دخان ولا حظنا على الطاقم بعض الارتباك، فما أعطينا الأمر أي اهتمام ولم نكن نعلم أن هذه بداية النهاية..<br />بعد قرابة ربع ساعة تقريباً أحسسنا أن الدخان ازداد سوءاً، وأن السفينة في تمايل على جهة اليمين.. جاء أحد ال<br />اقرأ بقية التعليق .."
