posted = "2009-12-30"
text = "نفسى الحكومه تتبرع بكل فلوسها للناس الغلابه و المحتاجين و يبدأوا من جديد حياتهم و حكمهم بنزااهة و كرامه و صدق و شفافية يمكن يمكن قصدى يمكن يعنى ربنا يكفرلهم على ذنوبهم اللى عملوها فى الشعب و يغفرلهم علشان نشوف بلدنا احسن بلد فى الدنيا و نخاف عليها مش نسيبها و نهاجر و نشتم فيها ربنا يحمينا و يحرصنا يا رب"
