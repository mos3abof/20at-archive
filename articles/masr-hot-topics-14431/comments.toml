text = "والله يا جماعة مصر عاوزة تغير شامل من اول الشعب من عادات وتقاليد وفكر وديمقراطية واسلوب حضارى الى الحكومة من فساد وسرقة ونهب اموال الشعب والقروض النصب دة كلو لو اتغير هنبقى احسن شعب واحسن بلد ونتقدم كتير جدا انتوا لو بصيتوا لكل جانب من حيث التعليم والسلوك بتاع الشعب اللى بيظهر فى اسائل المواصلات والشارع هتلاقوا احنا اللى عاوزين نتغير ومش بقول كدة برمى اللوم على الشعب والحكومة بردة عاوزة تغير فى النظام بس احب اقول الموضوع معقد جدا ومحتاجين وقت كبير جدا علشان التغير من حيث كل شىء … وشكراً"
