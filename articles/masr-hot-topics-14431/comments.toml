posted = "2009-12-30"
text = "هي الفكره جميله جدا وانا عن نفسي مش عارف انا ممكن اطلب ايه من الحكومه بس انا بجد نفسي احس ان ليه مستقبل وان فيه امل في بكره نفسي في الحريه والديمقراطيه ونفسي امشي في الشارع احس ان الناس مبسوطه وقبل ده كله طبعا نفسي الحكومه تستقيل ومبارك يعتزل والناس هي الي تختار ويكون فيه انتخابات نزيهه وشفافه مش ملعوب فيها ومش مهم مين ييجي وقتها اي كان طالما ان الشعب ختار"
archived = "2010-01-15"
