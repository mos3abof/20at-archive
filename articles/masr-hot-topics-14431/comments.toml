text = "انا نفسى تكون شوارع مصر كلها نظيفه بس ده كل مابتمناه عشان التلوث دلوقتى بقى فى كل مكان وشكرا<br />ونفسى تكون كل الناس عندها وعى ان التلوث هو سبب الامراض ولو كان عند كل واحد فينا وعى ما كان فعل ذلك لان ده مش على الحكومه وحدها بل كل ده مسئوليتنا جميعا ولو كل واحد يبدأ بنفسه هتكون البلد ده اجمل بلد فى العالم ويكون فيه تنظيم بين الادارات الحكوميه لأن بعد رصف الشوارع يأتى بتوع الصرف الصحى ويحفروا مره اخرى ثم الغاز ثم الكهرباء وهكذا وتبوظ الشوارع مره اخرى ونفسى تكون القاهره واسكندريه ما هما الا مدن سياحيه فقط وتخرج كل المراكز الحكوميه خارجهم لان القاهرة والاسكندرية مدن من افضل المدن عالميا بل بالعكس يوجد فيهم ما لم يوجد عند اى مدينه اخرى"
