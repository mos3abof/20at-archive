text = "اود ان اري مصر بلادي منارة للعلم كما كانت<br />نفسي اري بلادي بلا فساد اداري<br />بحلم اني اري وطني اقوي بلد اقتصادي وعسكري وكل شئ<br />اتمني ان ارها بثوب اخر مماهي علية الان<br />بتمني ارها تغزو بالعلم الفضاء والذري والتطور بكل شئ<br />لوم لم اكن مصريا لاودادت ان اكون مصريا<br />(ادخلوا مصر انشاء الله امنين) صدق الله العظيم"
