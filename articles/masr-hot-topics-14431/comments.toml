text = "انا مش عاوزة اتكلم عن نفسى انا الحمد لله احسن من غيرى بكتير اوى بس انا نفسى يبصو لحال الناس الغلابة اللى مش رقين مكان يعيشو فية وكمان عاوزيين يخرجهم من العشش اللى همما قاعدين فيهم وهما ولا لاقيين اكل ولا شغل وكمان بيجو عليهم طيب يبصو على رجال الاعمال اللى ممشين شغلهم الباطل باللفلوس والرشوة لية لو لقو واحد غلبان بياخود رشوة من واحد علشان يمشيلو شغلة ياخدوة ولو لاقوة مصدر كبير بياخود رشوة بيسيبوة هى الحكومة كدة دايما واخدة الغلبان {اللى ملوش ضهر }عارفين ان الشعب المصرى هو ارخص شعب وافقر شعب على مستوى العالم كلة بس يارب يكون الكلام دة صح وتسمعو كلامنا وتعملو حاجة بجد للشعب الغلبان دة"
