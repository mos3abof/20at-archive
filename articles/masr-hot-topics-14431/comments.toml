text = "نفسي في حاجات كتير منها : احترام آدمية المواطن المصري ، الاهتمام بشده وبجديه بالجانب التعليمي وتبني العلماء وأفكارهم في خدمة البلد ، الاستعانه بأصحاب الخبرات بجد الأمناء لإعاده توزيع دخل الدوله من موارد طبيعيه وقناة السويس والجمارك والمطارات والنقل والمواصلات والضرائب و و و .. الخ ، الاهتمام بالمشاريع الصغيره وتشجيعها بشده وبجديه مش كلام على الورق ، إيقاف استيراد السلع الغير أساسيه (آيس كريم شيكولاتات ، أسماك غريبه ، شامبوهات ، مناديل ، شيبسي ، زبده ، لبان ، حلويات ، طعميه ، … ) والاهتمام بالصناعات المحليه والتصدير ، حل جزري لمشكلة المرور بدل ما نصف اليوم بيضيع في مشوار ولا اتنين ممكن يبقو خمس أو ستة ، نظافة الشوارع ، النظر بعبن رحيمه لمن هم تحت خط الفقر وعمل مؤسسه أو وزاره خاصه بهم للقضاء على البطاله والجريمه ، من الآخر التفكير في إزاي الناس تتبسط وتعيش مرتاحه ما هما لو رايحو الناس ليه هاننتخب غيرهم بالعكس هانحبهم ونتمسك بيهم أكتر وأكتر … آسف للإطاله"
