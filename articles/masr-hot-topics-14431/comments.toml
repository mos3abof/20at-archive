text = "نفسي بس اكل كافيار احمر لان الحكومه مش موفره في السوق غير الكافيار الابيض والاسود وانا بصراجه زهقت منهم . نفسي اغير عربيتي المرسيدس واركب الرولز رويز بس ممكن الحكومه تخفض الضرائب عليها بس . نفسي المحاكم يبقى فيها تكييفات اكتر . نفسي الموظفين يكونو اسرع يعني يخلصوا الورق فربع ساعه بدل ما يعد نص ساعه . نفسي القطورات يكون فيها وجبة تحتوي على اصناف جديده بدل اللحمه والفراخ … انا بصراحه مرتاح اوي ومسوط اوي من الحكومه وحاسس انها عامله كل حاجه … الشغل مرطرط والفلوس على قفا من يشيل ومفيش فقر ولا عنوسه والشقق برخص التراب . الحمد الله … يا سلااااااااام يا ولاد .. الحمد الله"
