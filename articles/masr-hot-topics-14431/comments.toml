posted = "2009-12-27"
text = "نفسى اعيش انا طبعا عايش مش ميت بس اقصد عيشه زى عيشة المصرى بتاع زمان حد يصدق شاب 24 عايش فى عصر النت وال لاب توب والموبايل التاتش ويطلب انه يرجع للعصر اللى قبله . احنا عندنا القدره ان نعيش المواطن المصرى احسن من الامريكى والفرنساوى بس هما يخلوا خيرها للبلد كلها مش ليهم بس مش كده وبس ده احنا كمان مناخدش سلف او معونات والله احنا نسلف امريكا وفرنسا والله انا واثق ان احنا نصرف عليهم بس الريس دايما شايف ان احنا فى ازمه مش عارف امتى هيشوف اللى العالم كله شايفه وبيحسدوا عليه وهو مش شايفه ربنا انعم عليه بانه خلاه يبقى رئيس بلد زى مصر وشعب زى الشعب المصرى هى امريكا ولا فرنسا عندهم مواردنا ولا احنا بنصرف قد اللى هما بيصرفوه ده كفايه السكه الحديد , المترو , الضرائب , الزباله , الثروه ( السمكيه , الصناعيه , التجاريه ), السياحه , سيناء , السويس .. الخ . ده غير ان عندنا فيه خدمات بفلوس عندهم تبع الضرائب ( الجرائد , الزباله , تليفون المنزل بعض البلاد مجانى داخل الدوله , العاطل له عند الدوله مرتب.. الخ ) وفى خدمات بيعملوها من غير فلوس على اساس ان هى اصلا بتجبلهم فلوس مثال ( الزباله ) . اسف طولت"
