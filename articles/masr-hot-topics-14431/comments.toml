author = "حكومة احتلال"
posted = "2009-12-16"
text = "دى اوسخ نظام حكم فى العالم<br />واوسخ من اى استعمار<br />حكومة اية اللى هتسال على المواطن<br />اقسم باللة ان المواطن فى غزة التى تحت الحصار او فى الضفة الغربية اللى تحت الاحتلال المباشر حالة احسن الف مرة من حال الشعب المصرى المطحون اللى البغل بتاعة بيقول التنمية السنة دى 5 % — يا بغل 5 % والا 30 % بيروحوا لمين غير الحرامية والشعب مش شايف حاجة"
