author = "مصطفى محمود"
posted = "2010-03-12"
text = "والله يا جماعة كل الكلام اللى كان نفسى اطلبه مكتوب بس هل تصدقوا ان ده ممكن يحصل<br />ياحلاوة ياولاد زى مابيقولوا عشم ابليس فى الجنة<br />ع العموم ما تتعبوش نفسكوا وتكتبوا كلام وتعليقات لأن الحكومة مش هتمشى ده نفوا البرادعى<br />برا البلد واعتبروه عميل لأمريكا ومرتد وكافر عشان خلى امريكا تخش العراق والمشكلة انهم نسيوا ان كلهم عملاء ومرتدين<br />والريس ربنا يحفظه ويديم عليه الصحة عشان يطلع عينا عمل فيها ميت اول ما عرف بموضوع هد الاقصى يا جدعان فوقوا ولو مرة واحدة فى حياتكم احنا هنفضل كدة ليوم الدين<br />اللهم انى بلغت اللهم فاشهد"
archived = "2010-03-15"
