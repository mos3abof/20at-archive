text = "1) كفاية طبطبة عشان تعبنا ومحدش حاسس بينا .<br />2) يبصوا للغبان قبل ما يبصوا للمرتاح .<br />3) كفاية مخدرات فى البلد الناس مخها اتلحس .<br />4) يوفروا شغل للناس .<br />5) الناس مش عارفة تعيش عشان مش عارفين يلاقوا اللقمة .<br />6)نفسى الاقى بلدى نظيفة و مفيهاش زحمة .<br />7) كفاية وسايط عشان تعبنا واللى يدفع أكتر يبقى الأول .<br />يوفروا مواصلا للناس .<br />9) يوفرا سكن للشباب .<br />10) يساعدوا الشباب بدل ما يقعد على النواصى والقهاوى يبقى فى شغله اللى بيدخلله دخل كويس عشان يقدر يكون نفسه بسرعة .<br />وفى الأخر أقولهم أن الناس بجد تعبت ومحدش حاسس وهى دى نهاية المطاف والأيام اللى جاية هتكون أيام سودة فاحذروا ."
