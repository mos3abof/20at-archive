subject = ""
author = "هى دى مصر يا عبلة"
posted = "2009-12-13"
text = "سعد باشا زغلول قال مفيش فايدة<br />وفريد الاطرش غناها<br />مفيش امل يا حبيبى فيك<br />صحيح مفيش امل<br />هو احنا هنفهم احسن من سعد باشا والا حتى فريد الاطرش"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105204753/http://20at.com/masr/news/14380-2009-12-13-18-36-58.html"

[[comments]]
order = 1
subject = ""
author = "يا خسارة يا مصر"
posted = "2009-12-13"
text = "يا خسارة يا مصر هترجعى ورا كمان وكمان<br />مفيش امل<br />السنة الزفت فايدتها النوم<br />نامى يا مصر واتغطى"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105204753/http://20at.com/masr/news/14380-2009-12-13-18-36-58.html"

[[comments]]
order = 2
subject = ""
author = "مكرم"
posted = "2009-12-13"
text = "وهو حاصل على ليسانس الاداب قسم الفلسفة جامعة القاهرة عام 1957،<br />يعني جاهل بيشتغل في الصحافة عن جهل<br />المفروض الصحافي يكون خريج كلية الاعلام<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــ<br />مش ححبك"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105204753/http://20at.com/masr/news/14380-2009-12-13-18-36-58.html"

[[comments]]
order = 3
subject = ""
author = "بروفة ناجحة"
posted = "2009-12-13"
text = "دى بروفة ناجحة لامن الدولة<br />سوف تتكرر فى انتخابات مجلس الشعب القادمة 2011<br />وسوف تتكرر فى انتخابات الرئاسة سنة 2011<br />شعب يكرة التغيير ويستحق اللى يجرى لة<br />ويعشق المومياوات والمتحنطين والعواجيز<br />نجح مكرم وهو تخطى ال 75 سنة وكل زملائة فى القرافة من بدرى<br />هيعمل اية لشباب الصحفيين<br />راجل من عصر الكتابة بالريشة والطباشيرة على لوح الاردواز ازاى هيتعامل مع شباب الكمبيوتر والكىبورد<br />مفيش اى امل<br />زى ما كانوا بيلموا الموظفين فى اتوبيسات ويعطوا كل موظف سندوتش و 5 جنية لينتخبوا ممثل الحزب الوطنى فى مجلس الشعب عملوا كدة مع الصحفيين<br />هذا هو المستقبل<br />ومبروك يا سى مكرم وابقى نام بدرى يا جدو ودفى نفسك وما تنساش دواء الكحة وتيبس المفاصل والتهتهة فى الكلام ويمكن تنزل ريالتك على صدرك او طقم اسنانك يقع فى الطبق وانت بتاكل<br />سلام الميتيين<br />هو دة مستقبلك يا بلد"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105204753/http://20at.com/masr/news/14380-2009-12-13-18-36-58.html"

[[comments]]
order = 4
subject = ""
author = "حبظلم بظاظة"
posted = "2009-12-14"
text = "كل نقيب وانتم طيبين<br />نقابة المهندسين تحت الحراسة - اى واللة - نقابة تحت الحراسة - ومفيش لها نقيب ولا لها انتخابات ولا اى حاجة - والامن بيديرها - اصلهم لا مؤاخذة ضبطوها فى بيت مشبوة وسىء السمعة وضبطت بالجرم المشهود والادلة البينة<br />نقابة اية يا عم الحاج<br />وجامعات اية يا عم الحاج<br />واحزاب اية يا عم الحاج<br />كلة كلة بيتزبط من لاظوغلى"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105204753/http://20at.com/masr/news/14380-2009-12-13-18-36-58.html"
