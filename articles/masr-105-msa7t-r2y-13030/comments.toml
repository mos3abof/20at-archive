subject = ""
author = "سلمى"
posted = "2009-08-23"
text = "بجد المقال ده منسق جدا واضح انك مركز مع القضية وفاهم أبعادها كويس، وعندك حق طبعا هبه دي لو كانت تخلت عن حقها في العودة كانت بقت زي اي بنت مقهورة في بيتها كما أحيي مقارنتك بينها وبين باقي القضايا التي تحتاج إلى تكاتف الجميعى مثل عماد الكبير مثلاً وهي تقريبا نفس الحالة<br />كتابة مميزة وجهد مشكور"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 1
subject = ""
author = "مصطفى"
posted = "2009-08-23"
text = "مقال عظيم والله بيعبر عن تفكير شباب كتير<br />بس الشباب اللي ماعندهاش خيال وفردية صعب تفهمه<br />معلش"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 2
subject = ""
author = "واضح"
posted = "2009-08-23"
text = "ان المواضيع فى الموقع والمحررين اصبحوا زبالة"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 3
subject = ""
author = "يمنى"
posted = "2009-08-23"
text = "صاحب التعليق اللى مش فاهم:<br />الموضوع ده جميل جداً وتحليل سلس يجوز أنه أعلى من مستواك فى الفهم<br />أحياناً يكون القارئ غبياً"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 4
subject = ""
author = "مش فاهم"
posted = "2009-08-23"
text = "انت عايز تقول اية<br />موضوع طويل وكلام كتير وبتلف وبتدور على اية مش فاهم<br />انت كاتب غبى جدا"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 5
subject = ""
author = "صناعة الاعلام يهودية"
posted = "2009-08-24"
text = "في المقال السابق الذي كتبه الكاتب الناشىء محمد جمال الدين كان كاتب على الانرنت وتمت مناقشة بان اليهود مسيطرين على النت<br />كذلك الاعلام اليهود مسيطرين على الاعلام في العالم<br />شبكة الالانترنت<br />شبكة البنوك<br />شبكة الاعلام<br />اي شبكة تأكد تماما ان اليهود مسيطرين عليها<br />واسرائيل متخصصة في بث القضايا التي تشغل العرب عن قضاياهم الاساسية<br />يعني الخبر دا اللي هو موضوع الصفحة ايه اهميته بالنسبة للعرب والمسلمين<br />ولكن لسيطرة اليهود على الاعلام وتخصصها في صناعته تشجع هذه القضايا التافهة حتى ينشغل بها العرب حتى تتحول القدس الى اورشليم بهدوء<br />يعني فيه خبر النهاردة بيقول ان اسرائيل سوف تغرق الضفة بمليون مستوطن<br />هو دا المهم مش قضية هبه نجيب"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 6
subject = ""
author = "أحمد حسني"
posted = "2009-08-24"
text = "مستوى رفيع من المقالات<br />شكرا لولاد البلد<br />و أرجو إلا تلتفتوا لمعلقين مستواهم الذهني خلاهم يكتبوا أساميهم \"مش فاهم\" و\"كاتب معتوه\". طب غيروا أساميكم الاول علشان تفهموا"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 7
subject = ""
author = "كاتب معتوة"
posted = "2009-08-24"
text = "ناس عايزة تكتب اى هراء واى تخريف وناس متخلفين ينشرون لهم<br />اولا لا قضية مطلقا فى حكاية تلك البنت التى تريد ان تهرب من اسرتها وتنفك من رعاية الاب وكاننا فى باريس وليس اسرة شرقية مسلمة مصرية للاب ان يرعى ابنتة ويحافظ عليها<br />ما علاقة عماد الكبير وعماد الصغير وقضايا التعذيب بحكاية بنت غاوية شهرة كدابة اذ لم يثبت ان ابوها قد عذبها<br />وبعدين كلام عن التفرد وكلام عن البطيخ وعرض الموضوع بطريقة سمجة جدا ومملة جدا كانة طالب فى 6 ابتدائى بيكتب موضوع تعبير عن شم النسيم<br />اية الهبل دة<br />يؤسفنا تدنى المستوى و تدنى اختيار الموقع<br />زبالة اخر زبالة"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 8
subject = ""
author = "الى المعلق السابق"
posted = "2009-08-25"
text = "اللهم اني صائم"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 9
subject = ""
author = "صياد"
posted = "2009-08-25"
text = "اقتباس صناعة الاعلام يهودية:<br />اي شبكة تأكد تماما ان اليهود مسيطرين عليها<br />اليهود مسيطرين على كل شبكة؟<br />حتى شبكة الصيادين يا أهبل ؟"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 10
subject = ""
author = "سلاح جو اية"
posted = "2009-08-26"
text = "سلاح جو اية يا ابنى<br />هو احنا عندنا سلاح جو اصلا - دى شوية طيارات روسى ملهاش اى لزمة<br />واى طيار فى اى دولة عربية بيشوف الطيار الاسرائيلى جاى بيهرب فى الحال ويشخ على نفسة<br />لا مقارنة بين اى طيارات روسى وطيارات امريكانى<br />فرق السما عن الارض"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 11
subject = ""
author = "اسرائيل تسيطر"
posted = "2009-08-26"
text = "اسرائيل تسيطر على سلاح الجو العربي من خلال اكرانيا<br />التاريخ : 18/2/2009<br />لندن-الكوفية برس-ابرمت اكرانيا عقودا مع اثيوبيا، فيما تجري محادثات مع دول عربية لتطوير طائرات الميغ الحرببة الروسية الصنع المصنوعة العام 96 بهدف تأهيلها من جديد وفق التقنيات الحديثة والمتطورة واعادتها الى الخدمة مجددا.<br />ووفق تقارير ومعلومات تداولتها اروقة ضيقة فان اكرانيا ابرمت الصفقة اولا مع اثيوبيا وبدأت بالفعل تحديث وتطويرات طائرات الميغ الروسية وهو ما شجع دولتين عربيتين هما مصر واليمن للشروع في مفاوضات مع كييف لعقد صفقة مشابهه."
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 12
subject = ""
author = "الشاعر على سلامة"
posted = "2009-08-28"
text = "نشر الشاعر على سلامة فى جريدة المصرى اليوم اخر صفحة امس<br />من غير معركة<br />لكن اظرف المتقاتلين<br />واحد مصدق<br />ان مصر لسة ما بقيتش مملكة<br />واشجع الكدابين اللى قال<br />الدنيا حلوة<br />والوضع امن مستقر<br />ودة شعب متدلع ولازم<br />يعترف ويقر<br />مصر لا يمكن تكون ماشية<br />على حل شعرها<br />لكن يجوز<br />تكون متجوزة فى السر"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"

[[comments]]
order = 13
subject = ""
author = "عمري"
posted = "2009-08-30"
text = "انا عمرى ما اسكت واكون سلبى<br />وامشى والحيطه تكون جنبى<br />الايجابيه مبدأ دايما فى قلبى<br />هطالب بحقى واكون تمساح<br />مهما تعمل ومهما تقول<br />انا ثابت فى ارضى لا يمكن ازول<br />هقاوم الاعادى واغيظ العزول<br />ومش لوحدى هاقود الكفاح<br />انا واحد من الملايين<br />بتكوى جلودهم لكن صابرين<br />وكلنا للفجر مستنيين<br />من الظلم يوم كلنا نرتاح<br />عمرى ما اخاف وعمرى ما هاركع<br />وغير الحق عمرى ماهاسمع<br />ولو كتفونى قدام مدفع<br />قرءانى بايدى وكتب الصحاح"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908005605/http://www.20at.com:80/masr/105-msa7t-r2y/13030-2009-08-23-12-45-16.html"
