[[comments]]
order = 2
subject = "بوادر انهيار"
author = "ابو كرتونة"
posted = "2006-05-20"
text = "انا اعذر النظام المصري علي ما يفعله لانه بدء بالفعل بوادر انهياره, فهو مثل الذئب الجريح عندما يجرح تاخذه حالة من الهياج فيهاجم اي شيء وكل شيء , من كل بقائه , ولكن هيهات يامبارك, شعب مصر العظيم فكل ما تفعلونه من مظاهرات تفضح النظام البائس امام العالم له ايجابياته قريباسوف تظهر."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117205433/http://masr.20at.com:80/article.php?sid=336&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "أختلف معكم تماما"
author = "عمر قناوي"
posted = "2006-05-23"
text = "أختلف تماما مع تحليلكم لأسباب التصعيد الأمني فهذا التصعيد في رأيي المتواضع حدث لعده أسباب أهمها أن النظام سيقدم علي خطوات إقتصاديه مرعبه خلال الشهرين القادمين ومنها إلغاء الدعمويتوقع الكثيرين أن تكون هذه الخطوه هي التي تفجر الثوره أو الفوضي في مصر فكان لا بد من إرهاب الشارع والمعارضه حتي لا يتحرك أحد من منزلهحين ترفع الحكومه الدعم أضف لذلك أن الدوله بدأت تنظر لكفايه بقلق شديد فهذه الحركه حركت المياه الراكدهفي الشارع المصري بدليل هذا الكم الكبير من الإضرابات والإعتصامات الذي تشهده البلاد بل أن قضيه القضاه أنفسهم لم تكن لتصل لهذه الدرجه من التصعيد لولا دعم الشارع الذي قادته كفايه ومن بعدها الإخوان"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117205433/http://masr.20at.com:80/article.php?sid=336&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
