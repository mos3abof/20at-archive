[[comments]]
order = 0
subject = "قولوا آآآآآآآآآآآآمين"
author = "مصرية"
posted = "2006-05-19"
text = "انا مش فاهمه العادلى بيه تاعب نفسه ليه فى القبض على المتظاهرين ..هل لأنهم قالوا الكلام اللى جواهم بصوت عالى ..كل المصريين ياعادلى بيه بيقولوا كل يوم أسخم ميت مره من اللى سمعتوه فى المظاهرات..وانتم عاملين زى النعام حاطين راسكم فى الارض ...يالله شد حيلك وحضر سجن يكفى 70 مليون مصرى ..وتتعب نفسك ليه ..انتم خليتم البلد سجن كبير ..بالظلم والفسادوالاستبداد ....وقانون الطوارىء..منكم لله....انتم احقر الكلمات فى قواميس كل لغات الدنبا..ربنا يخلصنا منكم..ونلاقى داهيه ترضى تاخدكم..ولالالالالالالالالالالا لمبارك وسلالته..لالالالالالالالالا للفساد..لالالالالالالالالا لقانون الطوارىء..ونعم..نعم..نعم..لتغيير الدستور..قولوا آآآآآآآآآآآآآآآآآمين"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117205433/http://masr.20at.com:80/article.php?sid=336&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

