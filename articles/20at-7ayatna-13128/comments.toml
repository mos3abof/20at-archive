text = "انصائح حلوة قوي<br />بس مين يعملها وامتى<br />عاوزين شلة جدعان كده تشجع بعضيها وتعزم وتتوكل على الله في العشر الاواخر مع العبادات<br />يبقى فعلا هي دي الاصحاب بجد<br />وعلى فكرة النصيحة التالتة ناقصة كلمة أو كلمات<br />وشكرا جزيلا"
