[[comments]]
order = 0
subject = "كدب فى كدب"
author = "رحاب زين"
posted = "2006-05-16"
text = "قرأت الخبر الذى نشر بخصوص فقرة كدبة ابريل فى حلقة برنامج مصوراتى مع عادل مبارز وفى الحقيقة اول ما اتضح لى هو ان الخبر منقول من احدى الإصدارات الغير محترمة والتى تتسم بعدم المصداقية وايضاً قد اتضح لى ان المحرر الذى قام بكتابة هذا الخبر لم يشاهد الحلقة ولكنة تبرع فى ان يكتب بدون ان يشاهد وايضاً لم يكلف نفسة بأن يذكر انة ينقل بناءاً على ما قرأة ولم يشاهد . واستعجبت من نهاية الخبر الذى فضل عدم التعليق على الخبر ولذلك لم اعلق على ما فى الخبر من اخطاء تسئ لمطبوعاتكم امام كل من شاهد الحلقة ويدرك ان هذا الخبر كدب فى كدب"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211621/http://masr.20at.com:80/article.php?sid=120&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "سابو الحصان ومسكو في البردعة"
author = "احمد نديم"
posted = "2006-08-04"
text = "انا كنت عايز اسال الصحفي المحترم الي كتب الخبر ده بيجيب اللوم علي مين وعشان مين قضية هند واحمد مفضوحة من زمان ومش مستنية الي يولعها وان كانت هناك فضايح فهم يستهالوهعا عشان يبقو عبرة لاي حد يعمل زيهم يكون عارف حجم الفضايح والمسائلة وانا شايف ان الي حصل في البرنامج نوع من العقاب الغير مقصود من صاحبه بس هو جي في مكانه المناسب ومع شخصه المناسب"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914030154/http://masr.20at.com:80/article.php?sid=120&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
