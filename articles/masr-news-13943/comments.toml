author = "mr_matrix26"
posted = "2009-11-08"
text = "الواحد مستعجل اوى يسمع ان الماتش النهاردة بقى علشان يشوف بعنيه كرامة الفريق التى استهان بها كل جزائرى ترد اما عينيه ونقدر نرد عليهم بجد مش كلام عايزين فعل والفعل يكون فى المكسب ان شاء الله علشان مش مصر الى تكسب بأساليب غير شرعيه مثل عدم اراحة اللاعبين قبل يوم المباراة والتشجيع السئ وماخفى كان اعظم<br />بس اللعب والاهداف هيا الى هترد مش الكلام ولا الاساليب غير المحترمة اتمنى الرد من لاعبى الفريق باهدافهم ولا اتمنى الرد من الجماهير بألفاظهم الخارجة<br />نريدها مباراة خالية من التعصب خارج الملعب نريدها تعصب فى الملعب وذلك عن طريق الاهداف الغزيرة التى تروى عطشنا وكبريائنا كمصريين"
archived = "2009-11-12"
capture_url = "https://web.archive.org/web/20091112185333/http://20at.com:80/masr/news/13943-2009-11-06-22-18-25.html"

