subject = "مشكور أخي على هذا التوضيح"
author = "حية سورية قومية اجتماعية:"
text = "قرأة هذا الموضوع عزيزي وأشكرك باسم رفاقي في الحزب السوري القومي الاجتماعي على هذه الكلمات المعبرة. كما أوضحت فإن رفيقتنا سناء محيدلي هي أول فتاة تقوم بهذا العمل وقد لحق بها من رفيقاتنا ورفاقنا الكثير مثل وجدي الصايغ - ابتسام حرب .... والقائمة تطول."
archived = "2006-11-02"
