subject = "أساتذة الإخوان"
author = "سولو"
posted = "2006-11-30"
text = "اليوم يا جماعة بجد كان أكثر من رائع وخاصة ان عندنا فى جامعة عين شمس نادرا ما تلاقى دكاترة متظاهرين ..اعجاب الطلبة وصل لحد طلبهم العضوية فى 9 مارس ...للأسف عين شمس مش زى القاهرة فى تفاعل أعضاء هيئة التدريس حتى الإخوان من الأساتذة أنفسهم...."
