subject = "طالب في عين شمس و شاف بعينه"
author = "FREEDOM FIGHTER"
posted = "2006-12-02"
text = "أنا كنت حاضر وشفت بعيني,كنت قاعد مع زمايلي و مره واحده لاقيت ظبات حوالينل و في كل حته,أنا اتخضيت و لاقيت داكتره و حبة طلبه رافعيت شعارات و كان معايا الكاميرا و صورت وي عندي الصور علي الكومبيوتر ,كانت مظاهره حضارية فعلا,, وأحب أقول لابن بهيه ان البلوج بتاعه حلو أوي بس نفسي أعرف يعني ايه أبن بهيه,,وشكرا"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073341/http://masr.20at.com:80/article.php?sid=1232"
