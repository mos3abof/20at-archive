[[comments]]
order = 2
subject = "عصر البلطجه في الحقبة الثانيه من حكم عائلة مبارك الواطي"
author = "إبن بهية"
posted = "2006-11-30"
text = "يارب نصرك للمصريين الغلابه .. أولاد بهيه على النظام البلطجي الخائن العميل .. نظام مبارك الواطي .. لأول مره في تاريخ مصر نرى هذا الكم من البلطجه في الانتخابات والجامعات .. لأنه ببساطه عصر البلطجه .. مبارك الواطي الأول بدأ عصره بالسهننه والسهتنه وحندل والمندل بتاع أهله ده اللي قرفنا بيه ثلاثين سنه .. مبارك الواطي الثاني عايز يبدأ عصره بالبلطجه عشان الواطي الأول لم يترك له أي لعبه من الألاعيب لابهلوانيه والأكاذيب فالولد يا عين أمه مش لاقي طريقه غير البلطجه .. يعمل إيه يعني ؟؟؟ ده حتى حتة الكذبه الجديده خالص بتاعة النووي ما نفعتش والشعب هرشها وعرف إنه كداب في أصل وشه ونصاب .. طيب يعمل إيه ؟؟؟ يبلطج .. يالا نبلطج كلنا ... هيهـ ... مش هو ده اللي عايزينه يا كلاب ؟؟؟ بس ساعتها راح تحرقكم البلطجه .. لأنها مش بلطجه بالأجره زي اللي بتأجروهم للانتخابات البرلمانيه والجامعيه .. دي بلطجه بسبب الجوع والغلب .. ثوره يعني بس بطريقتكم .. أصلهم بيغيروا كل الكلام ثوره يعني بلطجه والبلطجه يعني حفظ النظام .. زي العاده .. فمن باب محادثة الناس على قدر عقولهم بأقولهم عن ثورتنا الشعبيه المباركه بلطجه عشان يفهموا بس .. ربنا يخلي ولادك يا بهية<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073341/http://masr.20at.com:80/article.php?sid=1232"

