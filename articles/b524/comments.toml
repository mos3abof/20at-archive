text = "انا ليا اعتراض على كلام الكابتن غيور.<br />انت فاكر نفسك عايش فين....؟!!!.<br />ايوه تبادل القبلات بين المخطوبين اولا :<br />حرااااااااااااااااااام.(ودا نوع من انواع الزنا يا كابتن (باللمس).<br />ثانيا:<br />قلة ادب وسفاله ... لانه مش من حفهم ودي تبقى سرقه.<br />ثالثا :<br />هينزل واحد فيهم من نظر التاني وهيفقد احترامه ليه((دا لو كان فيه احترام من الاصل)).<br />انا ماكنتش ناويه ارد... لكن ردك نرفزني واستفزني جدا.<br />وسؤالك احنا عايشين فين...؟<br />فلو كل الناس بتفكر زيك نبقى عايشين في غابه (او مكان ماحبش اقول اسمه).<br />والحمد لله اللي بيفكروا زيك قليلن اوي."
