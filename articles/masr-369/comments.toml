text = "انا جربت و زحلقت الشريحه تحت بطارية جهاز 3310 و استتمرت المكالمه شغاله في الأربع مرات بعد ما شلت الsim لكن بعد كده اكتشفت ان فودافون فعلا حسبت المكالمات بالكامل و خدت حقها كامل.... على كل في فكره عبقريه عند واحد صاحبي عشان ما نخليش المكالمه تتحسب .. هاجرب الأول و بعدين ان شاء الله هاعرفكم ايه اللي حصل ...<br />على فكره أنا مؤيد موضوع حتى لو كان ده بيحصل تبقى دي سرقه<br />و التجارب دي بس من أجل اشباع الفضول<br />العده 3310 كانت عدتي القديمه و كانت مربيه في البيت ياعيني بس بعد الإشاعه دي انا هاحطها في عينيا<br />و آخر الكلام .... سلام"
