text = "محمد عاشور اول واحد بلغنى واكد على الموضوع لانه حصل قدامه وكنت متردد فى التجربة لكن اما سمعته من اكتر من واحد وانا الوحيد اللى معايا الجهاز الاصيل دا اللى ترميه ع الارض يطلعلك تانى مش باقول اصيل المهم عملنا التجربة وزحلقت الشريحة واتصلت والمكالمة فضلت شغالة عادى بدون انقطاع لحد ما فجأة لقيت المذيعة طالعة تتأسف وتقول عفوا لقد نفذ رصيدكم ماذا تفعل لو كنت مكانى ياترى اخد الفلوس من محمد عاشور لانه صاحب الخبر ولا ادعى ع الشركة لانها خربت بيتنا وخلصت فلوسنا؟"
