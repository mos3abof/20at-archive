[[comments]]
order = 11
subject = "السرقة حرام"
author = "د ياسر"
posted = "2006-05-25"
text = "سامحك الله يامن اتهمتني بتنناسي الحديث الشريف الناهي عن الإحتكار<br />وانما قل أني نسيته<br />وللتذكره فنص الحديث كما في سنن أبي داوود: \"‏حدثنا ‏ ‏وهب بن بقية ‏ ‏أخبرنا ‏ ‏خالد ‏ ‏عن..... عن ‏ ‏سعيد بن المسيب ‏ ‏عن ‏ ‏معمر بن أبي معمر ‏ ‏أحد بني ‏ ‏عدي بن كعب ‏ ‏قال ‏<br />‏قال رسول الله ‏ ‏صلى الله عليه وسلم ‏ ‏لا ‏ ‏يحتكر ‏ ‏إلا خاطئ ‏<br />‏فقلت ‏ ‏لسعيد ‏ ‏فإنك ‏ ‏تحتكر ‏ ‏قال ‏ ‏ومعمر ‏ ‏كان ‏ ‏يحتكر ‏ ‏قال ‏ ‏أبو داود ‏ ‏وسألت ‏ ‏أحمد ‏ ‏ما ‏ ‏الحكرة ‏ ‏قال ما فيه عيش الناس ‏ ‏قال ‏ ‏أبو داود ‏ ‏قال ‏ ‏الأوزاعي ‏ ‏المحتكر ‏ ‏من يعترض السوق\"<br />وواضح من النص ان هناك نوعان من الإحتكار نوع منهي عنه ونوع غير منهي عنه بدليل ان أحد الصحابه ثبت عنه الإحتكار<br />وقوله ان \"المحتكر من يعترض السوق\"<br />أي ان الإحتكار المنهي عنه يكون فيما فيه حاجة الناس ولا عنى لهم عنه<br />والله أعلى وأعلم<br />خالص تحياتي"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044003/http://masr.20at.com:80/article.php?sid=369&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

