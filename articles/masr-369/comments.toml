[[comments]]
order = 41
subject = "الزحلقة وكلام السداح المداح"
author = "a3mw"
posted = "2006-06-03"
text = "العقد شريعة المتعاقدين ياآفاضل وانتوا وقعتم عليه اولا--- ثانياالرصيد بيتخصم علشان الى زمته واسعة لايقع فى هذا الفخ ويفقد رصيده---- ثالثا اصحاب الاشاعة هم اصحاب المصلحة المستفيدين اللى طلعوها والى مش مقتنع هذا شرح الفكرة من التعليقات وهو كلام علمى وسليم<br />يعني لماالواحد بييجي يشحن موبايلو برصيد جديد , تفتكروا شريحة الخط هي اللي بيتحط عليها الرصيد ؟ طبعا لا , ومعنى كده انه الرصيد بينزل علي كمبيوتر الشركة اللي بيحتوي على بيانات المشتركين بما فيها الرقم المسلسل للشريحه ورقم التليفون المحدد لهذه الشريحه وكمان نوع اشتراك الشريحه دي في الشركة سواء خط بفاتوره شهرية ولا كارت بيتشحن برصيد .<br />لحد كده تمام ؟ طيب تمام .<br />نيجي للمفيد : لما سيادته صاحب الخط ابو رصيد مدفوع مقدما ( بيشحن يعني ) لما ييجي يعمل مكالمه اللي بيحصل كالاتي :<br />بيكتب النمرة وبيدوس علي اتصال فا بيروح الموبايل موصل نفسه علي الشبكة ومعرف نفسه علي انه الموبايل اللي رقم شريحة خطه كذا , و بعدين يقوم الكمبيوتر بتاع الشركه يشوف لو ليه رصيد بيفتحله اتصال ولو مالوش رصيد بيروح مطلعله البت اياها اللي بتشتم دي ,, ما علينا , المهم الكمبيوتر بيفضل يعد مدة المكالمه ومخلي الخط مفتوح طول ما في رصيد ( سواء في شريحه في الموبايل او لا ) لانه وظيفة الشريحة بس تحديد الموبايل ده مين صاحبه وبعدين الموبايل نفسه هو اللي بيخلي الواحد يتكلم ويتصل واللازمنه..المهم بيفضل الخط مفتوح علي كمبيوتر الشركة لحد ما الرصيد علي الكمبيوتر يخلص يروح فاصل الخط و المكالمه من علي العده اللي ساحبة الخط ايا كان مكانها لانه بيفصل الخط من المصدر ( من جوه الشبكة ) .<br />طبعا الكلام ده بافتراض انه صاحبنا شال الشريحه في اول المكالمه و الدنيا فضلت شغاله , لكن الطبيعي انه لمس<br />اقرأ بقية التعليق .."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044003/http://masr.20at.com:80/article.php?sid=369&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

