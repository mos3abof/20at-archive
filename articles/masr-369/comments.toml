text = "باختصار<br />اتصل بى صديقى العزيز<br />وقال لى حركة جامدة قوى<br />بعملها خليك معايا<br />وهكذا<br />حدث ذلك ثلاث مرات<br />والى ان ظبطت<br />اخذ يحدثنى عن الموضوع ويقول لى على طرقة الزحلقة<br />اللى هانتكلم بها دولى مع صديقنا فى الخارج<br />وقال لى ايضا سنتحدث مع بعضنا البعض الى ان ينفذ شحن البطارية<br />واخذنا فى الحديث لمدة 25 دقيقة<br />ولكن بطنة وجعتة وحدثة هاتف من السماء<br />فقال لى انا هاقفل بقى واشوف اية النظام<br />من الاخر<br />احتسبت علية الدقائق<br />ويعانى الان<br />يا جماعة دى اشتغالات<br />وعلى فكرة بقى الشركة اكيد اللى مطلعاها<br />ونشرها فكم من الفضوليين جربوا وسيجربوا<br />والمكسب لمين معروفة<br />فوقوا بقى يا جدعاااااان"
