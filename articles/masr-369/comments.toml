[[comments]]
order = 34
subject = "البلد المتزحلقه"
author = "هيفيد بايه الاسم"
posted = "2006-05-28"
text = "الاشاعه دي زيكم كلكم وصلتنا زي الصاروخ و أكتر حاجه زعلتني و خلتني أحس أد ايه احنا وصلنا لمرحله من الفراغ و التفاهه ألا و هي لما تلاقي العبقريه الشبابيه في زحلقه الكارت و لأني شفتها بعيني معه كذا واحد تحس بجد انك قاعد مع احمد زويل أو دكتور مجدي يعقوب و هو بيعمل جراحه دقيقه في القلب هو دا بالظبط نفس الحال مع المزحلقين للكارت و الي يحزن اكتر ان ال 100 مره الي شفت فيها واقعه الزحلقه انتهت بخيبه تقيله علي وجوه المزحلقين لأن ماشاء الله كله اتسحب منه رصيده و ضاع الحلم يا ولدي حلم الاستغلال و الانتقام من ام نبيل و فوده فون ...<br />علشان كدا أنا قلت ان دي البلد المتزحلقه ربنا يكرمهم وصلونا للدرجه دي من زحلقه الدماغ و الجري ورا الأوهام بالظبط زي وهم البورصه و أخواتها وصلونا ازاي نحط جنيه يطلع من الناحيه التانيه دولار ربنا يشفينا و يساعدنا ننشف دمغاتنا من الزحلقه الي وصلنا ليها...<br />ملحوظه: أنا معايا حته 3410 و السعر في متناول الجميع فقط ( 1000 ) جنيه مزحلق والوسطاء يمتنعون ..."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044003/http://masr.20at.com:80/article.php?sid=369&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

