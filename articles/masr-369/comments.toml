[[comments]]
order = 10
subject = "د ياسر عم الدكترة"
author = "يا عم الدكترة دا اسمه عقد اذعان"
posted = "2006-05-25"
text = "وكمان انت تناسيت حديث الرسول من احتكر فهو خاطئ<br />سرقة ايه بقى اللى حضرتك بتكلمنا عنها<br />الحكومة رافضة اي شركة تالتة تدخل<br />السوق لسويرس و نصير بس<br />و الغريبة ان فيه اشاعات ان علاء شريك فى الشركتين ازاااااااااااااااااااااااااااااااي<br />معرفش رغم انهم متنافستين"
archived = "2006-09-06"
