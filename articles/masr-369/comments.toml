posted = "2006-05-27"
text = "معقول الكلام دة ؟؟؟؟؟شركة التليفون المحمول استاذة فى النصب وكلة شرعى وعلى بند المصروفات الاداريةو لما شافوا التجار استهبلوا رفعوا سعر الكارت تدريجيا من 100 الى 155 جنية استهبلت هى كمان وخلت سعرالكارت 115 جنية من غير مصاريف ادارية و لا غير وينزل لك رصيد ب 80 جنية حد شاف نصب اكتر من كدة لكن ليها حق طالما ترفع السعر و ايضا الكلاب تجار الكروت يرفعوا السعر و الكل بيشترى اللى ناقص فى مصر ان الكلاب تمسك موبايل و كأن اللى لايوجد معة موبايل حايدخل النار"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044003/http://masr.20at.com:80/article.php?sid=369&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 29
subject = "اعتذار واجب للدكتور ياسر"
author = "الزيني بركات"
posted = "2006-05-27"
text = "ايوا يا فندم اولا انا اسف فى لفظ تناسيت و لعلك نسيت فعلا و نحسب كذلك و لا نزكي على الله من احد<br />ثانيا نص الحديث كما ذكرته كان واردا بالنص الذى ذكرته انا و حفظته من كتاب الدين للصف الثانى الاعدادي ايام ما كانوا بيدرسوا الدين انا دلوقت اتخرجت خلاص و ععموما ديه لينك فيها تعريف الاحتكار وكذكلك الحديث بالنص الذى ذكرته انا و هذا بالطبع لا يمنع من وجود روايتين لحديث واحد<br />http://islamonline.net/servlet/Satellite?pagename=IslamOnline-Arabic-Ask_Scholar/FatwaA/FatwaA&cid=1122528605204<br />اخيرا لو قلنا الاحتكار بتفسير حضرتك يبقى يا فندم حنقول ان احتكار شركة المصرية للأتصالات و تغلية سعر المكالمة مع انها بتنزل فى جميع دول العالم مش احتكار<br />يعنى هو انا لو متكلمتش فى التيليفون حموت<br />وكمان احتكار عز للحديد مش حرام يعنى هو انا لو مشترتش شقة علشان اتجوز حموت<br />و كمان و كمان وكمان<br />و شكرا لك"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044003/http://masr.20at.com:80/article.php?sid=369&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

