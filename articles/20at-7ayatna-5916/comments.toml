author = "عادل السيد الدسوقي"
posted = "2008-03-26"
text = "السلام عليكم ورحمة الله وبركاته<br />الله وحده يعلم كم أحب أل سعود وعلي رأسهم الملك عبد الله حفظه الله من كل سوء<br />وكل ما أتمناه من الملك عبد الله أن يساعدني في الحصول علي شقة أسكن فيها وأسرتي حيث أني من محدودي الدخل<br />وكل ما أطلبه منحه من ملك الخير والسعادة فكيف لا وهو عميد أل سعود حفظهم الله جميعا.<br />والسلام عليكم ورحمة الله وبركاته."
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621140325/http://www.20at.com:80/20at/7ayatna/5916.html"

