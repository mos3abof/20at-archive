text = "انا فتاه سعوديه ابلغ من العمر 23 سنه<br />الي خادم الحرمين الشريفين المللك عبدالله بن عبدالعزيز رعاه الله<br />اعاني من مشاكل صحيه اعاني من الصلع الكامل وتقوسات في الارجل احتاج الى عمليات في ارجلي ولكن لايوجد لي المال لكي اتعالج ووالدي لايستطيع معالجتي فظروفي الماديه صعبه علمأ انني لم اكمل دراستي بسبب مشاكلي الصحيه خرجت من المدرسه بسبب صخريه الاصدقاء مما اثر على حياتي النفسيه لم اعد قادره على المشي امشي بصعوبه والم اطلب من الله ثم من خادم الحرمين الشريفين بابه عبدالله ان يمد يده لي بمساعدتي فاانا حاولت المجي عنده ولاكن لم استطيع ساعدني بابه عبدالله انا محتاجه للك لتفرج همي والمي من بعد الله<br />الي يبغى ي[ *** ]ب اجرفيني ويساعدني ويوصل الرساله الي بابه عبدالله يتصل على رقم اخي<br />0560673024<br />من مكه"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621140325/http://www.20at.com:80/20at/7ayatna/5916.html"

