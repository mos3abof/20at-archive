posted = "2007-05-18"
text = "خادم الحرمين الشريفبن لا يكل أولا يمل من توصيل الحقوق المظلومين ورد الحق لأصحابه<br />جزاه الله خير الجزاء<br />ولكن الملك لن يسطيع حل كل المشاكل من خلال برنامج<br />وكذلك لن يستطيع كل أصحاب الشكاوى الوصول للبرنامج<br />فيجي على كل مسئول أن يراعي الله في عمله حتى لا نلجأ لمباشر اف ام"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621140325/http://www.20at.com:80/20at/7ayatna/5916.html"

