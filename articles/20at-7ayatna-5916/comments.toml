text = "انا فتاة منذ انا تخرجت من الكلية وانا احلم بالتعييين حلم حياتي ان اكون مدرسة اجيال عددنا في المنزل كثير ووابوي شخص متقاعد عليه ديووون انحرمت من اشياء كثيرة من الاملابس والجوال واشياء تخصني كبنت وكلي امل بان اجد وظيفة تساعدني على مساعدة والدي في اخواني وايضا يكون لي راتب شهري لايتعدى ال3000الاف ريال ياليت ياليت تصل رسالتي الى الملك ويتحقق الحلم قولوا امين"
archived = "2009-06-21"
