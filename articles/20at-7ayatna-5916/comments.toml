[[comments]]
order = 4
subject = ""
author = "عمر أحمد محمد مصطفى"
posted = "2008-05-24"
text = "السلام عليكم ورحمة الله وبركاته..<br />أتكلم الآن بعد أن فاضت بي السبل وتفرقت بي الطرق…<br />أنا شخص معاق من مصر، الاسكندرية..<br />وأعيش في أسوأ لحظاتي الآن.. فأنا معاق حركياً، وذو جسد مشوه.. ولكني أتحرك بالكرسي المتحرك، وأركب الموتوسيكل الكحيان بتاعي بشكل جيد ، وأسوقه بأحسن ما يكون…<br />تعبت من تهدد وجودي في عمل فيه مصاعب ، البُعد، والقيام بكل إدارة محل العمل.. وأنا ضعيف في إدارة العمل..<br />وعلى الجانب الآخر، أنا أحب الكبميوتر جداً، وأُجيد استخدامه بشكل جيد ويتطور باستمرار..<br />أنا متزوج ولدي بنت… ولكن ظروف صعبة جداً في مصر، لا أستطيع تحملها.. غلاء الأسعار بجانب قلة العائد، بجانب عدم تقدير المعاق حقه في المساعدة، أو منحه منحات تساعده على مُجاوزة مشاكله المالية والمادية التي لا تُحل أبداً…<br />أحتاج إلى أن أسافر في بلد يهتم بالمعاقين، وأن أعمل بها في عمل سهل ومناسب لي، وأن أُمنح حياة تساعدني على تجاوز إعاقتي… فهي الآن السبب في كل مشاكلي…<br />الآن أقول في نفسي.. ليتني ما تزوجت… ليتني مت قبل هذا وكنتُ نسياً منسيا… حتى لا أتعرض لأكثر من تلك ضغوط تجعلني مشلولاً ومعاقاً فوق إعاقتي الأصلية…<br />إميلي إذا استرعته رسالتي… فأملي في الله رغم ذلك لا ينضب ولا يخفت…<br />ahmadhed@hotmai l.com<br />الله يسمعني ويعلم بحالي…"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621140325/http://www.20at.com:80/20at/7ayatna/5916.html"

