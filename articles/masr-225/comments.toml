[[comments]]
order = 0
subject = "الله يرحمك يا خاطر"
author = "عابر القارات"
posted = "2006-04-25"
text = "أولا الله يرحمك يا أرجل من حكامنا اللى باعونا و باعوا أرضنا و كرامتنا و دينهم فوق البيعة علشان يرضوا حفنه من القوادين أولاد الزوانى و حثالة قاع البشرية و لست أدرى لماذا يرضوهم و يدهسونا لماذا يقبلوا أحذيتهم و يقفون فوق حناجرنا لماذا إرتضوا بحياة النعام أمامهم و حياة الأسود علينا لماذا يكرهوننا ألى هذه الدرجة ... هذه الدرجه التى معها تمنينا أن يحتلنا اليهود فلا أعتقد أنهم سيفعلون معنا أكثر من أعداءانا أبناء وطننا... رحم الله فقيدنافقيدالرجولةو عزاءنا الوحيد أنه إن شاء الله فى فسيح جناته و إن شاء الله من قتلوه و كذبوا علينا إن شاء الله يسكنهم الله فسيح عذابه فهو ولى ذلك و القادر عليه"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122229/http://masr.20at.com:80/article.php?sid=225&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "حسبي الله ونعم الوكيل"
author = "واحدة وخلاص"
posted = "2006-04-25"
text = "موضوع جميل والحقيقة انا مكنتش اعرف حاجة عن الموضوع ده من سنة 85<br />يااااااه دى انا كنت فاكرة موضوع المختل عقليا ده جديد بس ده طلع قديم قوي ده من ساعة ما اتولدت تقريبا<br />يلا ربنا ينجينا ويسترها معانا"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122229/http://masr.20at.com:80/article.php?sid=225&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "الموت المشرف"
author = "اللهم اغفر له وارحمه"
posted = "2006-04-25"
text = "ونعوذ بك من موت الخزي والذل والسوء<br />وارزقنا موتة ترضاها"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122229/http://masr.20at.com:80/article.php?sid=225&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "فينك دلوئتي ... مبقوش يهود بس... دول مصريين كمان"
author = "محمد السيد"
posted = "2006-04-25"
text = "الله يرحمك ويرزقنا حتة .... حتة بس ... من شجاعتك دي ...<br />الله يرحمك و يرزقنا عسكري تاني ... يعمل اللي عملته ويصحي فينا الإحساس من جديد ...<br />الله يرحمك ويبعث لنا راجل تاني ... يعمل اللي مقدرتش تكمله ويقف لهم كلهم ... ميسبش حد فيهم ...<br />الله يرحمك ويجعل ذكراك ذكرى لينا كلنا ... يمكن حد يفور الدم عنده شوية وقوم يعمل حاجة للبلد دي ...<br />بس نعرف ...؟ بأحسدك ... بأحسدك إنك معتشتش لغاية أيامنا دي ...<br />ياعالم ساعتها .. كنت حتحتار تضرب مين ولا مين ولا مين ....<br />الله يرحمك ... يا سليمان .... ياطيب الخاطر<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />مش مغيره . هه<br />mohamedmat@hotmailcom"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122229/http://masr.20at.com:80/article.php?sid=225&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "سؤال مهم ارجو من عشرينات التوضيح"
author = "هو سؤال غريب شوية انا عايزة افهم الملابسات اللي خلت سليمان يطلق النار علي مجموعة من العزل مش معاهم سلاح و فيهم سيدات ... يعني ليه مثلا و هو مسلح مهددهمش باطلاق النار فقط او اعتقلهم ... معلش انا معرفش القصة كويس و محتاجة التوضيح دا ضروري قبل ما اصدر حكم ظالم علي سليمان باطلاق النار علي مدنيين بدون حق مهما كانت درجة استفزازهم لشعوره الوطني و مهما كانت درجة عريهم هم في الاخر نساء و اطفال عزل"
posted = "2006-04-26"
text = "و كمان عايزة اعرف في حد منهم مات او ايه الاصابات<br />شكرا جزيلا"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122229/http://masr.20at.com:80/article.php?sid=225&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "والله مبدع يا احمد"
author = "ايمن الغمري"
posted = "2006-04-27"
text = "الاستاذ هايفضل طول عمرة استاذ. مش معني ان احيانا الواحد بينسي او بيتناسي الحقيقة الحلوة اللي في بلدنا( مصر بلد الامان لل.......)انة معندوش انتماء للبلد. لكن لما واحد زيي يلاقي واحد زيك يا احمد يا هواري علشان يصحي حب البلد تاني في قلوبنا. والله هتفضل طول عمرك نجم. ايمن الغمري"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122229/http://masr.20at.com:80/article.php?sid=225&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "كلنا فدا مصر"
author = "عصام عبدالجواد"
posted = "2006-04-29"
text = "انا عيشت الموضوع بالضبط في جامعة الزقازيق أثناء دراستي وسافرت الي اكياد لحضور مؤتمر المعارضة هناك الله يرحمة<br />ولا تحسبن الذين قتلوا في سبيل اللة اموات بل أحياء ولكن لا تشعرون اللة يرحمة مع الدرة وأمثالة كثير وسوف يأتي اليوم الذي نأخذ بتارة"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122229/http://masr.20at.com:80/article.php?sid=225&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "سليمان خاطر"
author = "مصرى حزين على مصر"
posted = "2006-05-01"
text = "الى الاخ او الاخت صاحبت تعليق هم عزل كان هددهم<br />موضوع عدم التزام الصهاينة بتعليمات الامن كان متكرر فى الوقت ده وكان فيه اوامر من قائده بالضرب فى المليان وفق ماجاء فى تحقيقات النيابه هو حذرهم ولم يستجيبوا<br />واخيرا الفاتحه على روح شهداء والوطن وادعو معى ان لا يزهب دمهم بدون فائدة"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122229/http://masr.20at.com:80/article.php?sid=225&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "اااااااااااااااااااااااااااه يا خاطر"
author = "تذكرناك.... نعم تذكرناك بالرغم من أنك لم تغب يوما عن البال."
posted = "2006-06-04"
text = "تذكرناك.... نعم تذكرناك عندما غبت من أعين المستذلون الأنذال.<br />تذكرناك.... نعم تذكرناك عندما رخص دمك رخص دم مصر العزيز الغال.<br />تذكرناك.... نعم تذكرناك عندما ناءت الأكتاف بالأحمال<br />تذكرناك.... وستبقى في قلوبنا يا خاطر أبد الآجال"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122229/http://masr.20at.com:80/article.php?sid=225&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

