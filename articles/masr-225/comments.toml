posted = "2006-10-15"
text = "يابنى يا غالى يا حتة من قلبى سجانوك وهانوك وشناوك وقالوا انتحر ماتحزنيش يا ام الشهيد الفجر هيطلع من جديد ومهما الشمس غابت هتشرق من جديد ومهما شناقو القمر هيطلع النهار دة خيانة فى بلدى الشمس بتقول خيانة والسما بتقول خبانة خبانة خيانة خيانة"
archived = "2006-11-17"
