[[comments]]
order = 1
subject = "تفافه السعال الوسخه المليانه مخاط معسل قص .."
author = "إبن بهيه"
posted = "2006-12-09"
text = "هو عصر البلطجه والشذوذ والشم وكل الموبقات ذلك الذي استهله مبارك الماسوني الواطي الثاني برئاستة لجنة السياسات التي نتحدث عنها وكأنها أمر واقع لا جدال فيه ، يعني إيه لجنة سياسات ؟ طيب هو الحزب بيشتغل إيه لما يعملوا فيه لجنه سياسات ؟ طبعا ما تسألش وما تدورش لأن مبارك الماسوني الواطي الأول عايز كده بناء على تعليمات المحافل الماسونية كي يضمنوا بقاء كلب ماسوني موالي لهم على كرسي الرئاسه في مصر لأن مصر لمن لا يعلم هي مفتاح المنطقة كلها من شمالها لجنوبها ومن شرقها لغربها .. يعني ببساطه كده كان لازم يحصل كده عشان يقدروا ياخدوا فلسطين وبعدها العراق ولبنان جاي في السكه مع أو بعد السودان والصومال وإيران وتركيا التي خربتها المحافل الماسونية وبقت فيها زي دكاكين البقاله و مبارك الماسوني الواطي الأول شغال كده برضه والبلد في عهده القذر ملئت بنوادي الروتاري والليوز ومحلات بيع الإلحاد والمجون والقذاره من منظمات العمل المدني وحقوق المرأة وحقوق الإنسان والفئران والبطيخ اللي طالعين فيه ده الذي ظاهره الرحمة وباطنه الماسونية بكل سمومها وقذارتها وجبروتها ((يرجى البحث عن جذور الليونز والروتاري وشوفوا البلاوي حتى على النت بس)) .. هل تذكرون الصحفي رضا هلال الذي اختفى منذ سنوات ولم يظهر حتى الساعة ؟ لماذا ؟<br />لأنه ببساطة كتب عدة كتب في الماسونية وفي اليهود ومخططاتهم واقترب من المنطقة المحرمة لمبارك الماسوني الواطي الأول وبدأ النخوره والبحث في خلفياته الماسونية وزوجته البريطانية سوزي وعائلتها البريطانية وأخوالها في لندن ((سوزان بريطانية لأمها البرطانية الحمراء وكذلك تبعها إبنيها إيلي وبالمصري علاء وجيمي وبالمصري جمال .. فتشوا هتلاقوا كتير أوي)) ، الراجل اتشفط من أمام مكتبه شفطاً أو تبخر في الهواء .. راح<br />اقرأ بقية التعليق .."
archived = "2006-12-12"
capture_url = "https://web.archive.org/web/20061212200518/http://masr.20at.com:80/article.php?sid=1266"

