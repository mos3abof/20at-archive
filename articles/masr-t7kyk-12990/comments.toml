text = "لو دخلت خناقة علشان واحدة بتتعاكس والقميص بتاعى اتقطع انت عارف القميص بكام والبنطلون بكام<br />كل واحد يدافع عن اهلة بس<br />انما واحدة فى الشارع معلهش سامحنى"
