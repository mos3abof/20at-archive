subject = ""
author = "اانت مجنون والا عبيط"
posted = "2009-08-19"
text = "رجولة اية يا ابا الحاج<br />لو شفت واحد بيغتصب واحدة فى وسط الشارع فى عز الظهر وعملت شهم ورحت تنقذها<br />والولد المغتصب غزك بالمطواة وعورك والدم نزل وبعدين شالوك على المستشفى ورموك على الباب والمستشفى الحكومى رفضت د[ *** ]ك اللا لما تدفع تامين 2000 جنية وسابوك تنذف على الباب وانت عاطل او موظف ممعكش فلوس تعمل اية<br />تموت<br />واللة لو لقيت اسرائيلى بيحط قنبلة فى شارع لامشى عادى وكانى مش شايف حاجة<br />ولو شفت واحد بيغتصب اهم سيدة فى مصر هقول شد حيلك<br />احنا مالنا<br />خلينا جنب الحيطة<br />ممعناش فلوس للعلاج"
archived = "2009-08-22"
capture_url = "https://web.archive.org/web/20090822020523/http://www.20at.com:80/masr/t7kyk/12990-2009-08-19-15-01-16.html"

[[comments]]
order = 1
subject = ""
author = "ابومحسن غربة 28 سنه"
posted = "2009-08-19"
text = "يا مصر يا منوره شرق وغرب الكون<br />انا قلت فيكى شعر قالولى يا مجنون<br />انا مهما فيكى اتهنت لكنى برده مصون<br />ولوبره فلحت انا مصرى مهما اكون<br />بحلم يا مصر نكون افضل بلاد الكون<br />ولا اشوفش فيكى مهان وعلى بعضنا ما نهون"
archived = "2009-08-22"
capture_url = "https://web.archive.org/web/20090822020523/http://www.20at.com:80/masr/t7kyk/12990-2009-08-19-15-01-16.html"

[[comments]]
order = 2
subject = ""
author = "احمد ربيع"
posted = "2009-08-20"
text = "اخر موقف حصل معايا من هذا القبيل كنت واقف في محطة مترو في طابور التذاكر و لقيت واحد عايز يحط ايده في جيبي فمسكتها و لما بصيتله لقيته شاب و للأسف مكانش في اي بتاع أمن علشان اندهله فقلتله عيب عليك كده<br />بجح فيا و قاللي ايه انا كنت بدخلك الفلوس علشان كانت هتقع<br />قلتله طيب لم نفسك و بطل الحركات دي<br />بعد ما جبت التذكره لقيته بيكلم شاب شكله طالب في الكليه و لقيت الشاب ده بيطلع فلوس من جيبه<br />رجعت و قلتله ماتديلوش حاجه ده حرامي و كان هيسرقني فالواد سابه و مشي<br />انا قعدت اطرده بره المحطه و هددته اروح اجيب الشرطه و هو قعد يبجح بس لم نفسه و خرج<br />مشيت شويه و بعدت و وقفت ابص عليه لقيته دخل تاني و بيحاول يسرق واحد فرجعلته و مسكته و قلتله مش هسيبك غير في القسم<br />الراجل اللي كان هيتسرق و شوية ناس اتلموا و قالوا خلاص سيبوه منه لله و بتاع و اللي شلني ان كل ده و بتوع الامن مش موجودين مش عارف كانوا فين<br />المهم مشينا الواد ده خالص لغاية ما تلاشى عن الانظار في اخر الشارع<br />بس بصراحه ماحسيتش اني رضيت ضميري بشكل كويس لأنه هيروح يسرق في حته تانيه و اتعرف من بعض الناس في المحطه و لو شافوه تاني هيقولوا عليه<br />بس على الاقل ما سكتش"
archived = "2009-08-22"
capture_url = "https://web.archive.org/web/20090822020523/http://www.20at.com:80/masr/t7kyk/12990-2009-08-19-15-01-16.html"

[[comments]]
order = 3
subject = ""
author = "احمد ربيع"
posted = "2009-08-20"
text = "مع احترامي للردود .. بس انا استغربت عليها اكتر من الموضوع نفسه<br />هو احنا بقيا في اوروبا ولا ايه يا جماعه ده المصريين مشهورين بوقوفهم جنب بعض حتى لو مايعرفوش بعض<br />يعني الحاجه الوحيده الكويسه اللي فينا هتبدأ تتلاشي كمان<br />أنا بصراحه مابقدرش اشوف حاجه غلط و يكون عندي فرصه اني اتصرف فيها و ماتصرفش<br />بحاول اعمل اللي اقدر عليه و زي ما ربنا يقدرني<br />لو الواحد اعتبرها حاجه لوجه الله و ان دي كبيره أوي عند ربنا هياخد موقف و ان شاء الله ربنا هينصره<br />اينعم في مواقف بتبقى اكبر من الواحد و بيبقى صعب جدا يتدخل فيها انا معاكوا لكن في مواقف بيبقى عندنا فرصه نتدخل و نحل<br />يعني مثلا انا قبل كده شفت خناقه من بعيد و كان فيها مسدسات و بلاوي سودا .. بصراحه مارضيتش اقرب لأن ده يبقى سفه مني<br />لكن لما الاقي واحد بيعاكس واحده في الشارع او اتنين بيلطشوا في بعض بتدخل طبعا<br />و اول واحد بيتدخل بتلاقي الناس كلها جت اتدخلت معاه<br />هي دايما اول خطوه بتبقى صعبه و الناس عايزه اللي يشجعها"
archived = "2009-08-22"
capture_url = "https://web.archive.org/web/20090822020523/http://www.20at.com:80/masr/t7kyk/12990-2009-08-19-15-01-16.html"

