subject = "بحب ترابك يامصر"
author = "have_75_75@yahoo.com"
posted = "2006-07-13"
text = "اكيد مش هعرف اوصف يعنى ايه حبى لمصر بس كل اللى اعرفه ان اى انسان عايش بداخله قلب ولكنى لا املك بداخلى قلب بداخلى مصر هى القلب والعقل والدم هى الروح التى احيا بها ومن اجلها ولو لم اكون مصريا والله لقتلت نفسى<br />3حروف لو اتكلمت عنهم ما يكفينى فيهم 3 سنين ولا 300<br />ان كان هناك شرف فى الحياه فهو شرف المصريه<br />بعشقك يامصر وبعشق ترابك وناسك ونيلك وهرمك علشان اخدتى من الحروف 3 عشقت كل الحروف واللغه اللى انكتب بيها اسم مصر<br />مصر<br />الله كلمه جميله<br />مصر رددوها مليون مره كلمه فيها راحه نفسيه كبيره<br />مصر مصر مصر"
archived = "2006-09-04"
