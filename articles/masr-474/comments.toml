[[comments]]
order = 3
subject = "نجم النضال نجم النجوم"
author = "محمد حسن غنيم"
posted = "2006-06-11"
text = "أحمد فؤاد نجم<br />أسطورة مصرية هو فكر مصر<br />تاريخ مصر<br />لسان الشعب الفقير<br />ماذا تعرف عن نجم<br />نجم المكافح<br />نجم الإنسان<br />نجم المناضل<br />نجم السجين<br />نجم النجوم<br />أحمد فؤاد نجم<br />بقلم / محمد حسن غنيم<br />عانى أحمد فؤاد نجم الفقر و التشرد في الطفولة و الشباب، و كان أول ما لفت أنظار المهتمين بالفن إليه هو ديوانه \"صور من الحياة و السجن\" و الذي كتبه في اتجاه عام 1959 عندما كان يقضي عقوبة سرقة، و كان ديوانه الأول هو \"الأهلي و الزمالك\" عن الكرة التي عشقها. توالت بعد ذلك القصائد العاطفية و الإنسانية المضمون و التي غناها إمام أو نشرها في مجلة صباح الخير حيث انصهر في جو من الكتاب و الفنانين المجددين المتحمسين للتيار الشعبي في شتى المجالات. و كان بيرم التونسي هو أبوه في القول. و لا يظهر المكون الشعبي في شعر العامية المصرية كما يظهر لديه، بما يجعل من الممكن القول أنه الشاعر المصري الأول، و يكاد يكون الوحيد، الذي فكر و كتب بالعامية! عندما جاءت النكسة وجد نجم نفسه ينفجر في طوفان من الأشعار الهجائية السياسية الثورية و التي تسببت في عودته للسجن مرارا، و في اقترابه من طلاب حركة 1972 و شعبيته لدى المعارضين في أنحاء العالم العربي. عرف نجم أيضا ككاتب في بعض الدوريات، و أثارت مذكراته و أحاديثه الغضب منه أو الإعجاب بجرأته. و يتميز شعره باقترابه من شكل الزجل في البناء و المضمون الساخر و اللغة الشديدة الشعبية و \"البذاءة\". جرب نجم أيضا كتابة المسرحيات و أغانيها و أغاني التليفزيون و قد كتب لمغنين كثيرين غير الشيخ إمام، إلا أنه ارتبط به في ثنائي ظاهرة احتضنتها الحركة الوطنية.<br />تلميذك يانجم<br />محمد حسن غنيم"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613191615/http://www.masr.20at.com:80/article.php?sid=474&PHPSESSID=e5ae9e423ee210742025737a2a401d36"

