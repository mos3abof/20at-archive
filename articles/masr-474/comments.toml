subject = "ممكن يورونا مين يقدر يعملها ؟؟"
author = "محمد السيد"
posted = "2006-06-07"
text = "فعلا قطع الإيد اللي تتمد علي طوبة من جدار في حجرة سطوحك .. يا عم أحمد<br />يا عمنا إنت مهما قالوا وعملوا .. طوبة من الأوضة أحشن من فدادين و فصور وعمارات ومنتجعات ... عايشيتن فيعا اللي ميتسموا ...<br />ولا تشيل همها ... لو هدوا طوبة... نبينيلك مكانها ...ألف طوبة ...وفي نفس المكان ..<br />مكانك يا عم أحمد<br />وعلي فكرة محافظ القاهرة اتصل بيه بعد كده ... وأكد له إن محدش يقدر يعمل كده أبدا ...<br />لكن الكلام ده بعدما المصري اليوم نشرت خبر طلب الهدد بتاع الحجرة<br />وبرضه ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613191615/http://www.masr.20at.com:80/article.php?sid=474&PHPSESSID=e5ae9e423ee210742025737a2a401d36"

[[comments]]
order = 1
subject = "القدوة الغائبة"
author = "أبو أسامة"
posted = "2006-06-07"
text = "ربنا يخليك لمصر يا عم احمد.<br />فيه ناس بتشوفك بيقوللوا عجوزوبيخرف<br />مظاهرات ايه الى بيشارك فيها هو لسة عاوز من الدنياحاجةميعرفوش الهبل ان انت عم الشباب وانت الروح الى بتديهم الأمل ان<br />لسة فيه ناس عايشين بيحبوا البلد رغم ان<br />الى حكمنها تعابين وان انت القدوة الى الى غابت عن الشباب من سنين وافتكروا ان البلد مفيهاش غير الهباشين علشان كدة تعيش لنا يا عم احمد قدوة ومثل للشباب الحزين انا مش قصدى اقول فيك شعر لكن جدعنتك وصورتك لما بشوفك فى مظاهرة<br />خلتنى احس انك انت الريس مش الى ميتسماش<br />لكن ريس الشباب وكل سنة وانت شباب ."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613191615/http://www.masr.20at.com:80/article.php?sid=474&PHPSESSID=e5ae9e423ee210742025737a2a401d36"

