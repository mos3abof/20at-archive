subject = "من مؤ يد ى حما س"
author = "شر قا و ية"
posted = "2006-05-26"
text = "لقد غمر تنى الفر حة لفو ز حما س ولكنى اشعر الان بالمازق الذ ى تعا نى منةحماس والحصار العالمى المفر وض عليها ولكن الخطا الذى ارتكبتة حماس هو ان الوزارة اخذت لون واحد وهو انهم جميعا من حماس وكان يجب ان يكون هناك فصائل متعددة ومختلفة حتى تضع الغر ب فى مازق فاذا استطا عت ان تتدارك هذا الخطا فلتبادر بة لحل الا زمة وادعو ا"
