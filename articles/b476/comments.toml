[[comments]]
order = 0
subject = "المؤسف"
author = "عبدالله مفتاح"
posted = "2006-02-20"
text = "الحاجه اللي تدايق ان اعلام الغرب قدر ياثر على اعلامنا والحاجه اللي تجنن انك تحس ان الصحافه عندنا سلكت مسلك الاغنام يعني الصحافه الغربيه تقول على حماس متطرفين الصحافه عندنا يقولو متطرفين طيب ليه الحركه دي تطالب بارضها ولم تطلب اكثر من حقها يبقى نقول متطرفين وخلاص زي ميقولو نقول؟<br />انا حاسس ان صحفنا زي الديول (مع خالص الاعتذار)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125651/http://www.20at.com/article2.php?sid=476"

[[comments]]
order = 1
subject = "لا ماتعتذرش"
author = "sweet_princess"
posted = "2006-02-21"
text = "ماتعتذرش يا عبدالله لانك مش غلطان لان هو دا فعلا اللي بتعمله الصحف عندنا دايما بتروج ضداي شئ تكون امريكا غضبانه عليه يعني مثلا عمرك شفت في نشرات الاخبار حد بيقول على الشهيد الفلسطيني انه بيعمل عمليه استشهاديه ؟ طبعا اللي بنسمعه دايما جملة ((لقد تمت امس عمليه انتحاريه ))وكل دا عشان يصرفو نظر الناس عن قد ايه العمل دا بطولي ويديك احساس انه واحد اتخنق من حياته فقال افجر نفسي ومعايا اتنين تلاته والكلام دا مش من عندي دا قاله الرئيس بتاعنا في حوار معاه في مره وبيسالوه عن رايه في العمليات دي واللي معظمنا عارفه ان المفتي السابق نصر فريد واصل اعفي من منصبه لانه رفض يصدر فتوي بان اللي بيعملوا العمليات دي مش شهداء وان دا تخريب وان الناس دي بتدمر في الغلابه المستوطنين<br />اما بالنسبه لحماس:فهي بجد الشوكه اللي طلعت في ظهر اسرائيل وحقيقي الانسان لازم يتفائل لان اكيد انشاء الله كل الخير هييجي على ايد الناس دي وهما بجد اللي ممكن يعملو حاجه وياريت بقى ماحدش( يتفذلك )ويعمل نفسه كوفي عنان بقى ويقعد ينتقد ناس قدمو اغلى اولادهم شهداء فداء لفلسطين<br />وبعدين يا اخي اللي عمال يقول انها بعبع وانها مش هتعمل حاجه استنى شوف الاول وبعدين ابقى اتفذلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125651/http://www.20at.com/article2.php?sid=476"

[[comments]]
order = 2
subject = "الحمد لله على فوز الاسلام"
author = "leeeellee"
posted = "2006-02-21"
text = "انا بحمد الله مليون مرة على فوز حماس لانو فوز للاسلام باذن المولى و بالنسبة للمساعدات انها رح تقل هادا الحكي انشاالله مش صحيح الله لوحدة الي بيعطي و بيرزق مش امريكا و الصهاينة و اليهود لا هادا الحكي مش مزبوط بس الواحد يدعي ربو و يخلي املو بالله كبير و باذنه تعالى رح نتحرر و ندعس على كل العاملين حالهم مسيطرين متل امريكا و امثالها و بدعي ربي يثبت حماس على مبادئها و قيمها و اخلاقها و تعاليمها الدينية و القدرة على القيادة ومطلوب من الجميع يدعيلهم و عمل ما يستطيع لنصرتهم يعني نصرة دين الله عز وجل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125651/http://www.20at.com/article2.php?sid=476"

[[comments]]
order = 3
subject = "i love hamas"
author = "اروى"
posted = "2006-02-21"
text = "حركة حماس بداية مبشرة جدا بقرب النصر لاخوتنا فى فلسطين حررها الله وربنا ينصرهم ويعنهم على اللى هم فيه فحركة فتح كانت مليئة باللصوص وعلى رأسهم ابو عباس وعرفات يعنى مش عمرنا اسمعنا مثلا ان حد من حركة حماس اختلس حاجة بس طول النهار نسمع واحد من حركة فتح عمل والتانى سوى والفلوس دى لو راحت للشعب الفلسطينى اكيد كانت حتساعد كتير ومش بعيد ينضم لحركة حماس ناس مش قوى بس مش معنى كده انها وحشة المهم ان حماس تتمسك بمواقفها والمساعدات دى من عند ربنا مش من امريكا ولا من هونولولو ده رزق وربنا بيرزقه لعبده مش اكتر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125651/http://www.20at.com/article2.php?sid=476"

[[comments]]
order = 4
subject = "اه يا خوفى من اخر المشوار اه يا خوفى"
author = "نيفين"
posted = "2006-02-21"
text = "اؤيد كل من قال ان صحفنا و علامنا العربى كله نفاق فى نفاق فى نفاق<br />بينافقو الحكام و بينافقو الشعوب و بينافقو مراكز القوى سواء اشخاص او حركات او دول<br />نفسى نبطل نسمع و نقرا عبارات زى عمليه انتحاريه و انتحارى فلسطينى و صرح فلان و على حد زعمه و على حد قوله و رفض بشده و استنكر بقوه و الكلمه الغبيه اللى بتتطلع لنا فى كل بين بيصدر عن اى فمه عربيه او اى بيان بيصدر عن الجامعه العربيه كلمه نشجب<br />نشجب<br />نشجب نشجب<br />كرهنا الكلمه دجى بقى و فقدت معناها من زمان<br />عموما بالبنسبه لحماس خايفه افرح لان الموضوع ليه ابعاد كتير<br />نصيحه يا جماعه لاتصدقو كل ما تسمعوه و صدقو نصف ما تقرؤه و ربع ما تروه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125651/http://www.20at.com/article2.php?sid=476"

[[comments]]
order = 5
subject = "حماس بس مش كفايه"
author = "أكرم"
posted = "2006-02-21"
text = "انا رأيي اذا فشلت حماس في توحيد الصف الفلسطيني و توحيد الفصائل المسلحة في جيش نظامي ( متعدد القيادات ) عشان تبقى العمليات الاستشهادية عمليات رسمية يبقى وقفت على اول الطريق<br />اما لو فضلت الحكومة حكومة حماس و بس يبقى سلامو عليكوا<br />الحماس في القضايا المهمة زي قضية فلسطين لوحده مينفعش لازم حماس و جهاد و فتح و جبهة شعبية قوية و نظام و سياسة فاهمه و متودكة صح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125651/http://www.20at.com/article2.php?sid=476"

