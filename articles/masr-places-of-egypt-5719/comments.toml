author = "ابومحسن غربة 25 سنه"
posted = "2007-05-04"
text = "الموضوعات بتاعتكم جميله جدا بتفكرني بمصر وبجمال مصر وبتثير فيها احزان الغربة اللي مش عايزه تنتهي<br />انا سافرت زي اي شاب قلت اعد سنه ولا سنتين فوصلنا الى 25 سنه وماشي في 26 ويظهر انها مش حتنتهي وحموت غريب<br />زلذلك ارجو من الشعب المصري كله ان يخرج من ازماته حكاما ومحكومين باتباع النبي محمد صلى الله عليه وسلم<br />عيب اوي ناس يبعث الله فيهم النبي محمد صلى الله عليه وسلم ويكون حالهم بهذه الطريقة"
archived = "2009-12-08"
capture_url = "https://web.archive.org/web/20091208124316/http://www.20at.com:80/masr/places-of-egypt/5719-2009-06-10-09-30-17.html"

