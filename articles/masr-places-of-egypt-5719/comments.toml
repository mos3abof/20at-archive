text = "اسلوب سلس و بسيط…و مشاعر دافئه …و تصوير دقيق لاهم ملامح الحاله المصريه او الحارة المصريه…مع ملاحظة الصدق الشديد فى توصيل ادق الفضايح …اوووه اسف.. ادق الملامح أعنى …لكن بصدق أسلوب رائع جذبنى و أهنئك بجد عليه أستاذ منير"
