author = "shimoland"
posted = "2007-05-28"
text = "شيء جميل جدا ان يتذكر الانسان طفولته بين حين و آخر خاصة إذا كانت طفولة بريئة جميلة<br />و لكن اسمح لي سيدي .. ما تحكي عنه ليس طفولة جميلة .. هذه فضائح ..<br />(في شارعنا ترعرعت ونشأت وسط كومة من عشاق الكلاب ومحبيهم ) (كانت للخنازير جولات هي الأخرى، حيث تفنن أحد الجيران في تربيتها، )<br />(وكان \"عماد وشريف\" أصدقاء التشرد في نفس والتوهان، )<br />(وكل هذه الحيوانات داعبت طفولتي البريئة وتركت بصمات، لم أنساها )<br />اذا كانت طفولة أي شاب او رجل او اي انسان مقترنة بمثل هذه الاشياء فكيف هي شخصية هذا الانسان<br />في عقله و فكره .. ما هي البصمات التي تركت اثرا من مثل هذه الحيوانات الضالة او غيرها .. أو اطفال مشردة و في حالة توهان كما وصفت .. في طفولة فتى من وجهة نظرك سيدي ؟؟ ..<br />و الطفل في مراحل عمره يتعايش و يتعلم مما حوله و يرسغ في ذهنه ما تعلم و يشب عليه طوال عمره و يتخده اسلوب و منهاج لما تعلمه ..<br />فمثلما نقول : من شب على شيء شاب عليه<br />صراحة كان يجب ان تذكر ماذا تقصد من سرد مثل هذه الطفولة؟؟ و هو انعكاس على شخصية الكاتب ام ماذا ؟؟<br />والا فاكتب فيما هو انفع .. اكتب عن طفولة على بن ابي طالب او ايا من الصحابة العظماء ..<br />عذرا سيدي<br />فأنا لم استفد من هذا المقال<br />و لا اعتقد احدا قد استفاد منه"
archived = "2009-12-08"
capture_url = "https://web.archive.org/web/20091208124316/http://www.20at.com:80/masr/places-of-egypt/5719-2009-06-10-09-30-17.html"
