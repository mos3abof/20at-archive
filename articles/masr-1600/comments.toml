subject = "ااكشن المعاش احسن"
author = "سن المعاش"
posted = "2007-02-18"
text = "ما هي السن المناسبة للاحالة للتقاعد<br />الغالبية مع سن 65 سنه<br />بنات الجنس اللطيف يفضلن الاحالة للتقاعد بعد سن الاربعين<br />للتفرغ لشئون البيت وتربية الأولاد<br />هيئة المعاشات لا تمانع من رفع السن الى 70 سنه<br />بشرط موافقة جهة العمل<br />القاضي يعمل مدى الحياة في المملكة المتحدة<br />في الدول الاسكندنافية يتم أخذ مشورة المحالين للتقاعد<br />في المسائل التي تستعصي على الحل.<br />يعتبر سن الاحالة للمعاش او التقاعد مرحلة فارقة ونقطة تحول خطيرة في حياة الانسان حيث تمثل نقلة نوعية كبيرة من حياة كلها حركة نشاط الى حياة مشوبة بالحذر والخوف من مواجهة المجهول وهناك من يدخل الى هذه المر حلة دون خوف او تهيب لأنه قد خطط لها مسبقا، ومنهم من يقبل عليها دون استعداد او خطط مسبقة ويترك نفسه للمقادير تحركه كيفما تشاء الى أن يأتيه اليقين.<br />ولما كان سن الاحالة للتقاعد بهذه الأهمية في حياة الإنسان فقد أجرت مجلة \"ياسمين\" استطلاعا للرأي حول السن المناسبة للإحالة للمعاش فجاءت إجابة الغالبية في تفضيل سن 65 سنه واجابة واحدة طلبت سن 55 سنة وطائفة ثالثة فضلت فتح المجال بدون تحديد سن معينة طالما كانت صحة الانسان تسمح له بالاستمرار في العمل وطبعا كل رأي من هذه الآراء له ما يبرره فماذا قال هؤلاء وهؤلاء؟ وما هو تعليق الهيئة العامة للمعاشات والتأمينات الاجتماعية في الامارات على هذه القضية؟<br />الكوادر الفنية النادرة<br />في البداية يقول عبدالله التوم حسن (قاضي سابق) ويعمل حاليا رئيسا للادارة القانونية لمجموعة شركات العباس بدبي إن سن الستين هي السن المناسبة للتقاعد من وجهة نظري، غير ان ذلك لا ينطبق على كل الوظائف وكل الناس فهنا بعض الكوادر الفنية النادرة التي تكون الحاجة إليها ماسة، ولعل خير مثال على ذلك ما درج عليه القضاء الانجل<br />اقرأ بقية التعليق .."
