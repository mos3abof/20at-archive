[[comments]]
order = 3
subject = "مروة ملهاش في الرياضة"
author = "خبير رياضي"
posted = "2006-11-12"
text = "واضح جدا ان مروة ملهاش في الرياضة بدليل انها مش عارفة اسم الاستاد اللي بيتلعب عليه الماتش كمان كاتبه اسم فلافيو غلط .<br />والموضوع لا يختلف عن اي موضع اخر منشور في اي مكان وماخوذ تسخة طبقة الاصل يا عالم يا بتوع عشرينات الحقوا صفحة مصر بتقع حد يعمل حاجة .<br />جتكم الارف ماليتو البلد كل واحد يفتي في حاجة مش بيفهم فيها.ولا هو موضوع كمالة عدد وخلاص وعلشان يتقال انكم بتغطوا الاحداث وخلاص.<br />مروة شوفيلك شغلى تانية او اكتبي في حاجة بتفهمي فيها بلاش وجع بطن ."
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123202005/http://masr.20at.com:80/article.php?sid=1145"

