[[comments]]
order = 7
subject = "دقوا الصفاقص"
author = "نيفين..نيفى..نوفا"
posted = "2006-11-12"
text = "دقوا الصفاقص دقو الصفاقص.....<br />كملوانتو بقى يا اهلاويه<br />عملوها الوحوش<br />صحيح اعصابنا تعبت من الفرص الفلافلاويه الكتير اللى ضاعتو كوره عماد متعب الحلوه واللعب باخلاق الروح الرياضيه من الاشقاء العرب التونسيين و من شيلهم للعيبه الاهلى من على الارض و من شد الفنلات<br />بس كل دا اتمسح لما ابوتريكه شد الفتيل و فرقع القنبله<br />طبعا اخواننا الزملكاويه بقولهم البقاء لله<br />معلش سا محونى بس لو انتو مكاننا كنتو هتعملو كده و اكتر<br />عجبنى اوى مواطن بيسالوه بعد الماتش كمصرى قبل ما يكون ةاهلاوى قالهم بلاش نضحك على بعض الفرحان انهارده جمهور الاهلى مش جمهور مصر<br />مش كده و لا ايه"
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123202005/http://masr.20at.com:80/article.php?sid=1145"

