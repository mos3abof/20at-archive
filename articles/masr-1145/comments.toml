posted = "2006-11-12"
text = "يا خبيز يا رياضي..لو انت فعلا خبيز متل ما بتحكي..كنت حتترفع عن الشتايم..<br />او كنت راح تفيدنا ..افادكم الله<br />اماصباح التفاهه..الكوره دي حاجه موجوده..والاهل يكسب..دي حاجه مش لينا دخل فيها.. متلها متل صاحبك لما نجح ورحت مشان تباركله..<br />او صاحبك لما مات.. وزعلت ورحت مشان تعزي فيه"
