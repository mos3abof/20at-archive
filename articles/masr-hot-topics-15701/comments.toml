author = "مش ازهرى"
posted = "2010-03-10"
text = "شيخ الازهر الجديد لازم يكون ذو خلفية عسكرية حسب التقاليد المتبعة اليومين فى الوظائف العليا زى اللواء المصيلحى بتاع الفنية العسكرية وزى العميد فهمى بتاع المواصلات وغيرهم وغيرهم<br />فالمتوقع تعيين لواء من سلاح التوجية المعنوى اسمة اللواء الدكتور صفا محمود انتباة يتمتع بخبرة عالية كونة كان واعظ فى الجيش لسنين طويلة<br />وطبعا فية ميتيين كتير هيوصلوا اليومين دول وراء بعض ومطلوب شيخ ازهر يصلى عليهم امام التليفزيون ويدعوا لهم بالرحمة والمغفرة<br />مطلوب شيخ ازهر فورا لاهمية دعائة فى شفاء المرضى والمعاقين عقليا وبدنيا"
archived = "2010-03-12"
capture_url = "https://web.archive.org/web/20100312113544/http://www.20at.com:80/masr/hot-topics/15701-2010-03-10-18-00-20.html"

