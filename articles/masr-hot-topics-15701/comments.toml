author = "من موقع الاقباط"
posted = "2010-03-12"
text = "فى نعى البابا شنودة الثالث للراحل الكريم عبّر عن حزنه العميق، واصفًا رحيل طنطاوي بأنها \"خسارة كبيرة لا تعوض\"، مضيفًا أنه كان رحمه الله مجموعة من الفضائل، وكانت له في قلبه محبة عميقة، وكان يعتبره أخًا وصديقًا له، وكانا يتفقا معًا في كثير من الآراء والمواقف، ولم يجد البابا عزاءً في فِراقه\".<br />وبعد أحداث نجع حمادي، ذهب إلى مطرانيه نجع حمادي لتقديم واجب العزاء لكل من الأنبا كيرلس والأنبا بيمن أسقف نقادة وقوص واللواء مجدي أيوب محافظ قنا. وألقى خطبة الجمعة بجامع المحطة الجديد مؤكدًا فيها على أن الاختلاف في العقائد لا يمنع التعاون وأن الدين لله والوطن للجميع، منددًا بالاعتداء على الآمنين، ومؤكدًا على أن المعتدى سواء كان مسلمًا أو مسيحيًا وحده من يتحمل جرم فعلته."
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314030547/http://www.20at.com:80/masr/hot-topics/15701-2010-03-10-18-00-20.html"
