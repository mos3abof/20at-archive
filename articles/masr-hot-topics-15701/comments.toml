author = "هيئة كبار العلماء"
posted = "2010-03-11"
text = "قبل الحكم العسكرى سنة 52 كان شيخ الازهر بالانتخاب من كبار العلماء<br />وبعد حكم العسكر ايام عبد الناصر والسادات كانت هيئة كبار العلماء ترشح 3 اسماء لرئيس الدولة يختار منهم واحد<br />وبعد سنة 96 فى عصر حكم الامن والمماليك الجدد تم ترشيح 3 اسماء للرئيس فاختار واحد من دماغة<br />واظن ان المعمول بة ان يتولى المفتى المشيخة"
archived = "2010-03-12"
capture_url = "https://web.archive.org/web/20100312113544/http://www.20at.com:80/masr/hot-topics/15701-2010-03-10-18-00-20.html"

