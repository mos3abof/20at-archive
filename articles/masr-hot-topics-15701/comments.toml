author = "معتز"
posted = "2010-03-11"
text = "الاحق بهذا المنصب بعلمة واجتهاة ومكانتة العلمية والعالمية وجرأتة فى الحق وفى امور الدين هو الشيخ يوسف القرضاوى<br />فبوضع الشيخ يوسف القرضاوى فى هذا المنصب سوف يعلى من المكانة العالمية للجامع الازهر التى انخفضت فى الفترة الاخيرة كما انة سيلجم الاصوات المتنافرة فى جماعة الاخوان المسلمين<br />ولكن هل توافق امريكا على تعيين الشيخ القرضاوى شيخا للازهر<br />اظن لا"
