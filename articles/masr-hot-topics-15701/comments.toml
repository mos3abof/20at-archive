text = "رحمة الله تعالي علي شيخ الازهر واسال الله ان يغفر له ذنبة ويسكنه دار احسن من دارة<br />واتمني ان يخلفة في مشيخة الازهر الدكتور / احمد عمر هاشم او الدكتور / فريد واصل<br />والله يوفق ولاة الامر الي اختيار انسب الاشخاص في هذا المنصب دينا وعلما وخلقا : *"
