posted = "2010-03-12"
text = "مش مهم مين حيكون شيخ الازهر<br />مش مهم مين حيكون رئيس الجمهورية<br />مش مهم مين حيكون المرشد العام<br />مش مهم مين حيكون البابا<br />المهم اننا نكون ديمقراطيين<br />واللي دخل في سن ال60 يتفضل يحل عن ميتين ابونا ويقعد في البيت مع المدام ويدي فرصة لغيره<br />سلام<br />ـــــــــــــــ ـــــــــــــــ ــــــــــت<br />مش شريف الدواخلي ولا البراء اشرف"
