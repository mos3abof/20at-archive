[[comments]]
order = 7
subject = ""
author = "زوبيدة من الجزائر"
posted = "2009-05-22"
text = "واللة يا جماعة من زمان قلت لعائلتي أنه عند وفاتي لازم يتبرعوا بأعضائي للمرضى, لأن هذه الأعضاء ألي يستفاد منها المرضى وممكن تنقذ الحياة, علاش ندفنوها في التراب حتى تتعفن , علاش من الأفضل أنه ننقذ حياة واحد مريض , أعتقد أنه عندنا أجر, ولازم لكل إنسان يفكر بالنسبة للتبرع بأعضاءه لأنه ممكن في يوم يكون محتاج لعضو ينقذ حياته , ومن هذا المنطلق إلي يقول المسلم من يحب لأخيه ما يحب لنفسه.<br />لكن هنا في الجزائر مازال ما عندناش هذه البطاقة التبرع ألي في السعودية نتمنى توصل وينفذوها."
archived = "2009-05-25"
capture_url = "https://web.archive.org/web/20090525120113/http://www.20at.com:80/7ayatna/10737.html"
