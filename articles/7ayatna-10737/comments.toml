text = "جاد شويري يتبرع يعنيه دا المفروض يقلعوا عنيه الاثنين ويبقي اعمي يمكن يرحمنا من الكليبات بتاعته<br />اما انا عن نفسي فبقول من يرحم من في الارض يرحمه من في السماء وامنح حياة بعد وفاتي وانقذ مريض"
archived = "2009-05-25"
capture_url = "https://web.archive.org/web/20090525120113/http://www.20at.com:80/7ayatna/10737.html"

