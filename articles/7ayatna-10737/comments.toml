author = "دودي بيدو"
posted = "2008-12-17"
text = "ياجماعة احنا كلنا امانة ربنا جعلنا جسمنا امانة بكل اعضاؤه بقى زي ما تكون<br />ازاي احنا نتصرف فيها وايه مش بس كده لاء بعد الوفاة يعني الروح تكون ذهبت للخلقها واحنا بقى نلعب بالجسد الي هو امانة في رقبتنا<br />وبعدين اكرام الميت دفنه ولا نسينا"
archived = "2009-05-25"
capture_url = "https://web.archive.org/web/20090525120113/http://www.20at.com:80/7ayatna/10737.html"

