author = "مخرات السيول فين !!"
posted = "2010-01-21"
text = "فى كل بلاد الصعيد هناك من القديم منذ الفراعنة مكان اشبة بترعة جافة حفرتها السيول على تتابع السنين<br />ولما كان فى مصر حكومة كانت بتطهر وتعمق حفر مجارى السيول او مخرات السيول لتاخذ المياة الى البحر بعيدا عن بيوت الناس<br />انما بقى وبما اننا بدون حكومة ولا بلديات فمخرات السيول اتردمت والحكومة نايمة ومحدش بيحفر حاجة فالمياة الهابطة من الجبل كسرت البيوت<br />تبقى الحكومة رايحة هناك لية<br />بعد ما خربتها<br />ما يروحوا يكملوا نومهم فى شرم الشيخ"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123100738/http://www.20at.com:80/masr/news/15001-30-.html"
