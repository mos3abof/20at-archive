text = "الحكاية اللي فاتت انا عشت واحدة شبيهة ليها بس مش مع زميلي إنما مع رئيس القسم اللي بشتغل فيه، كان ييجي واحنا قاعدين في الاجتماع اليومي يقوم بسلامته قالع جزمته وفاكك كام زرار من القميص عشان يريح بسلامته<br />يلا اهو راح لحاله"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213142116/http://www.20at.com:80/20at/health/14331-2009-12-09-13-32-54.html"

