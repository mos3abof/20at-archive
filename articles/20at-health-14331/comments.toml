author = "طيب و بالنسبة لرائحة"
posted = "2009-12-10"
text = "انا ليه تجربة مع واحد زميل كان تيجي صلاة الظهر نلقيه فجأة قلع الجزمة الكوتشي وريحة المكتب تقلب في لحظة بجد كنا بنبقى هنموت المهم بقى انه كان بيفضل قالع الجزمة لحد صلاة المغرب بحجة تهوية قدميه و بصراحة واحد كلمه راح بمنتهي البجاحة قال انا مقدرش اكتم رجلي طول النهار وأقصى مع عمله اناه وضع الحذاء الكوتشي فى الدرج بتاعة لكن الرائحة لم تختفى برضه منه لله"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213142116/http://www.20at.com:80/20at/health/14331-2009-12-09-13-32-54.html"

