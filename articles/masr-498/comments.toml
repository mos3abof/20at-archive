[[comments]]
order = 1
subject = "أحفاد ابن سلول... خفوا شوية"
author = "العجيب والمدهش والمثير للتأمل أن الله تعالى قد توعد المنافقين وأختصهم بالدرك الأسفل من النار؟؟؟ يعني هتلاقي المشركين والكفرة والفجرة والمذنبين والعصاه وتحت منهم وفي ديل القائمة (المنافقين) أي منافقين ... وطبعا كان رأس النفاق عبدالله بن أبي بن سلول ..وكنا فاكرينه إنه راعي النفاق والمنافقين ولكن جاء من بعد منه خلف اسود ومطين بستين طين بوظوا حتى طعم النفاق وبقى حتى نفاق ماسخ وقميئ ووسخ زيهم .. المهم ... إحنا عايزين شوية المنافقين المرائين دول يشرحوا لنا سبب واحد في جمال مبارك غير إن أبوه رئيس البلد يديله الكفاءة للجلوس على عرش مصر ؟؟ طب ليه ما طلعش ابن ابراهيم سعدة سعده زي ابوه وكان مسك مكانه ؟؟ وليه ابن ابراهيم نافع ماطلعش نافع زي ابوه وكان مسك مكانه؟؟ وليه ابن سمير رجب ماطلعشي رجب زي ابوه ومسك مكانه؟؟؟ إشمعنى بقى ابن حسني مبارك لازم يطلع مبارك زي ابوه ويمسك مكانه؟؟؟ ما هو السبب والمبرر ؟؟ مافيش سبب ولا مبرر إلا إن كل بربور من دول عايز يتعدى على ابن سلول ويتفوق عليه ويسجل رقم نفاقي باسمه في موسوعة إخص وألف إخص..؟؟ وكأن البلد دي راحت وماتت وخلصت من الرجالة ولم يعد يرتع فيها إلا المنافقين والمرائين والأذيال والأندال؟؟؟ جرى إيه يارمة منك له له له له؟؟ دي مصر يافسل عارف يعني اسم مصر ؟؟ مصر اللي اسمها بيتعبد به في القرآن إلى قيام الساعة"
posted = "2006-06-11"
text = "({وَإِذْ قُلْتُمْ يَا مُوسَى لَن نَّصْبِرَ عَلَىَ طَعَامٍ وَاحِدٍ فَادْعُ لَنَا رَبَّكَ يُخْرِجْ لَنَا مِمَّا تُنبِتُ الأَرْضُ مِن بَقْلِهَا وَقِثَّآئِهَا وَفُومِهَا وَعَدَسِهَا وَبَصَلِهَا قَالَ أَتَسْتَبْدِلُونَ الَّذِي هُوَ أَدْنَى بِالَّذِي هُوَ خَيْرٌ اهْبِطُواْ مِصْراً فَإِنَّ لَكُم مَّا سَأَلْتُمْ وَضُرِبَتْ عَلَيْهِمُ الذِّلَّةُ وَالْمَسْكَن<br />اقرأ بقية التعليق .."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233327/http://masr.20at.com:80/article.php?sid=498"

