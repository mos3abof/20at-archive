subject = "ابواق الفساد"
author = "محمد"
posted = "2006-06-11"
text = "انا قريت فعلا المقالة المشار اليها فى الموضوع ، وكان ابراهيم سعده يتعجب من قدرة الاخ جمال بن مبارك على قدرته الرهيبة فى ايجاد الحلول وانه ( جمال ) هو السوبر مان بتاع مصر وهو اللى هايحل كل مشاكلنا ، حقيقى إن للفساد ابواق نتنة ومعفنة كمان ، تقريبا هو مزود جرعة النفاق اليومين دول على امل انه يرجع تانى رئيس لمجلس ادارة الاخبار او رئيس تحريرها على الاقل"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233327/http://masr.20at.com:80/article.php?sid=498"

