[[comments]]
order = 9
subject = "بابا حسني"
author = "محمد حسن غنيم"
posted = "2006-06-15"
text = "بابا حسني مبارك<br />مقدمــه لسيادتكــم برعــم نشــأ فى عهدكــم وتربّــى فى كنفكــم وشرب من بحــر علمكــم وحكمتكــم التى أذهلــت العــدو قبل الصديــق<br />تسمـحلي أقــولّك يابابا ؟<br />بابا أنا تعبــان أوي ....لأ مــش سنانــي دي ودانــي !!!...أيــوه ودانــي ..أصلي سمعــت كتيــر أوي عن حاجــات حلوة حتحصــل لنا وما حصلــش منها حاجــة ...حقول لك شويــة حاجــات منها واخواتي هنا يمكــن يحبــوا يزودوا عليها شــوية حاجات تانيــة جايز أكــون نسيتها ... بابا مــش عايزك تزعــل منى علشان فتحــت لك قلبــي<br />(1)<br />بابا...مصــر فى السياســة والإقتصــاد وحتى فى الرياضــة بقت في الحضيض.. بقينا في آخــر القايمــة يابابا صــدقنى<br />(2)<br />الدول اللى كان محــدش بيسمع عنــها خالــص بقت أحسن مننا بكتيــر أوي يعنــى دول زي الهند...الفلبين...حتى تايــلاند عندهم إيــدز وبرضه بيشتغلــوا وبيصدّروا كمــان....إنت نمــت يابابا؟ .....لسه صاحي... طيب أكمــل ..عارف ده سببه ايه .. سبب بسيط جدا اننا الدولة الوحيدة فى العالم اللى عندها الهرم بس بالمقلوب يعنى بنبنى وفى الاخر خالص نخطط ونكتشف ان اللى بانيناه مش نافع نقوم نهدمه ونعيد بنائه تانى والنتيجة بتطلع برضه زفت<br />(3)<br />بتشــوف قناة الجزيــرة والعربيــة ودبى يابابا....شوف همّه وصلــوا وبقوا إيه واحــنا بقيــنا إيه....الإعــلام بتاعــنا بقه زبــالة.. اعلام كاذب وأخبار منقولة من فضائيات اخرى بصراحــة يابابا...تفتكــر ده من إيــه؟<br />(4)<br />المصرييــن اللى عايشيــن بره محــدش بيســأل فيهم خــالص يابابا....تصــوّر لو حــد منهم مات ...السفــارة مابترضــاش تبعت جثته إلا لــو الناس لمّــت من بعضها ودفعــت المعلــوم......ده غير<br />اقرأ بقية التعليق .."
archived = "2006-06-17"
capture_url = "https://web.archive.org/web/20060617174341/http://masr.20at.com:80/article.php?sid=498"

