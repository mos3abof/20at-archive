subject = "الكل في سلة القمامة"
author = "ام العيال"
posted = "2006-06-12"
text = "طب لية انتم متحاملين على ابراهيم سعدة كل دة..الاساسفي الراس الكبيرة اللى قاعدة ومتبتة على عرش مصر..مش ممكن اكيسد كرسي رئاسة مصر فيه لزق اقوى من الامير..يانس انتو سايبن ال....ومتشطرين على البردعة<br />الظلم اكبر من كدة فوقوا<br />وبعدين صاحب المقال بيقول نعطي لجمال مبارك فرصة<br />فرصة اية ؟؟ انه ينهب زيادة؟؟<br />يسرق من الاول وجديد<br />هوة حاسس بحد؟؟حاسس بالجعانيين؟؟<br />بالشقياننين في الدول العربية الجهلة واللي بيذلونا علشان القرش اللي بلدنا مش قادرة توفرهولنا مش علشان اننا دولة فقيرة بل دولة مسروقة من ال مبارك<br />حرام ارحمونا<br />حيبقى الغلب علينا وعلى عيالنا<br />كل دة علشان اسرة واحدة؟؟"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233327/http://masr.20at.com:80/article.php?sid=498"

