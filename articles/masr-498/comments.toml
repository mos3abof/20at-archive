subject = "شقة لزواج عريس الغفله"
author = "أمير"
posted = "2006-06-12"
text = "بسلامته بيدور علي شقه علشان يتجوز فيها..أبوه طلب من أحمد نظيف يشوف شقه للواد...نظيف لقي له شقه في المهندسين...بعد يومين جمال قال المهندسين زحمه شوف لي شقه في 6 أكتوبر...العروسه قالت لأ 6 أكتوبر بعيده ..حصلت مشكله بين العريس و خطيبته و هما لسه علي البر... في النهايه قرروا يفتحوا الشقتين علي بعض علشان يرضوا جميع الأطراف.. و أهي مصر واسعه.."
