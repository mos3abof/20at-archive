[[comments]]
order = 12
subject = "الفراعنه"
author = "حسام"
posted = "2006-06-16"
text = "اللى بيقرا التاريخ وبالذات التاريخ المصرى هيعرف اننا تقريبا والله اعلم فى بداية عهد المماليك اللى كانو بيورثو اولادهم الحكم ومحدش منهم كان بيموت ميتته ربه الانادر واحنا بنعيش العصر دا من تانى يعنى السلطان صاحب البلد يفرض ضرايب زى ماهوا عايز ويحبس اللى عايز يحبسه ويدبح ام اللى عايز يدبحه ومفيش حد يقوله انت فين والشعب باه ياكل تراب واللى مش عاجبه يشرب من الخراره (حوض البهايم)والعصر دا هاينتهى بحاجه من اتنين اما الثوره او الحمله الفرنسيه اوالشعب يغور فى ستن داهيه ويريح نفسه .منتظركم فى معتقل العقرب بالوادى الجديد حسام الارهابى"
archived = "2006-06-17"
capture_url = "https://web.archive.org/web/20060617174341/http://masr.20at.com:80/article.php?sid=498"

[[comments]]
order = 13
subject = "شيئ من الخوف"
author = "عتريس"
posted = "2006-06-16"
text = "الواحد بقى عنده خوف من كل شئ فى البلد حتى من امه لاتكون بتشتغل مرشد فى امن الدوله وتودى الواحد فى600 داهيه وده سببه طبعا ارهاب الدوله اللى تربينا عليه فى ظل قيادة السيد الاستاذ الباشا الزعيم القائد بطل العبور ابو جمال حقظه الله ورعاه وادام عزه وحفظ ملكهه واحنا ننضرب بالجزم لوحد فتح بقه وقال كلمه واحده .دى العباره اللى بيقولها اى واحد غلبان مقهور عنده شوية عيال عايز يربيهم ولو خدوه بتوع امن الدوله هيركبوه ويشردو عياله ولو حد سال عنه يبقى ارهابى وابن سبعين كلب .تسعين فى الميه من الشعب بتخاف من كده وكلهم معندهمش جهاز كومبيوتر علشان يقرو الكلام الفاضى بتاعنا ده وطبعا دا من السياسه العليا للحكومه لان الجاهل والفقير ميعرفش يطالب بحقه واللى يجوز امه يقوله ياعمى<br />وفى الاخر ندعو الله جميعا مسلمين ومسيحيين ان يخلصنا الله من هذ الظلم ويرفعه عنا قبل ما نروح ورا عين الشمس"
archived = "2006-06-17"
capture_url = "https://web.archive.org/web/20060617174341/http://masr.20at.com:80/article.php?sid=498"
