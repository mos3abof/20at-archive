subject = "منافق+مرتشى=فاسد"
author = "أبو أسامة"
posted = "2006-06-11"
text = "منافق كلمة اصبحت مرادفة لكلمة مرتشى او<br />فاسدوما اكثرهم هذه الأياموالظاهر ان الأخ ابراهيم سعدة عاوز يحصل اخواته الى سبقوه<br />ابراهيم وسمير اللى عملوهم على قلبهم و<br />القائمة عمالة بتزيدويكفيهم قول المصطفى عليه السلام انهم(حمقى)اذقاللأصحابه(اتدرون من الأحمق فقالوا الأحمق يا رسول الله من باع أخرته بدنياه فقال عليه الصلاة والسلام<br />بل الأحمق من باع أخرته بدنيا غيره)صدق رسول الله (ص) .<br />مزيدمن المنافقين<br />مزيد منالمرتشين<br />مزيدمن الفاسدين فى عصر السيدالرئيس<br />وولده"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233327/http://masr.20at.com:80/article.php?sid=498"

