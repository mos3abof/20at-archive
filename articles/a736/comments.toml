subject = "حرب صهيوصليبية"
text = "مفكرة الإسلام: في أحد معسكرات الجيش الأمريكي خارج مدينة الفلوجة، انزوى عدد من عناصر مشاة البحرية الأمريكية [المارينز] عن بقية الجيش المنشغل في الاستعداد لمعركة الفلوجة، حيث كانت هذه المجموعة من عناصر المارينز تستعد للمعركة ولكن بطريقة أخرى، حيث أخذوا يناشدون 'المسيح' ويعمّدون بعضهم البعض من أجل أن ينصرهم 'الرب' في معركتهم مع الفلوجة، في إشارة واضحة للبعد الديني المسيطر على الجيش الأمريكي.<br />بلغ عدد هذه المجموعة بحسب ما ذكر موقع 'دردوج' الأمريكي 35 جنديًا من جنود المارينز كانوا يستمعون للتراتيل المسيحية، ويطلبون من 'المسيح' حمايتهم في المعركة التي قد تكون أكبر معركة تشهدها القوات الأمريكية منذ دخولها إلى العراق.<br />ووفقًا لوصف الموقع الأمريكي فقد وقف هؤلاء الجنود وهم يرتدون ملابسهم العسكرية المموهة، ورفعوا أيديهم في الهواء بعد أن وضع بنادقهم الهجومية إلى جوارهم، ثم أخذوا يتلون ترانيم في مدح 'المسيح'، في 'كنيسة صغيرة' بنوها داخل معسكرهم.<br />ولم يكتفِ جنود المارينز بذلك بل قاموا بتعميد بعضهم [ فعل مسيحي يقصد به تخليص المسيحي من ذنوبه] .<br />ويقول السير جنت ميلز ثاتفورد أحد من حضروا هذه الطقوس: 'إنه أمر مريح .. أن تذهب للكنيسة قبل المواجهات الكبيرة .. '، وأضاف هذا الجندي الأمريكي: 'في أحيان كثيرة .. لا يكون لديك إلا الرب'.<br />وفي إشارة واضحة لطبيعة الحرب الدينية قام أحد الجنود الأمريكيين بالقراءة من الإنجيل الحديث عن نبي الله داود - عليه السلام- والذي هزم جالوت وهو ما يعتبرونه نصرًا لليهود على الفلسطينيين حيث قال جندي مارينز: 'وهكذا هزم داود الفلسطينيين'، فدفعت كلمته تلك بقية الجنود إلى الهتاف إعجابًا بما فعله نبي الله داود - عليه السلام - .<br />ثم أخذ جنود المارينز يتلون من الإنجيل ما يرونها موافقًا لوضعهم، حيث يعتبرون أنفسهم محاربين للخير ضد البربر الذين يعارضون وجود الخير في العالم.<br />ويضيف جندي أمريكي آخر: 'النصر من الرب'.<br />وقال القسيس الذي يقود الجنود الأمريكيين: 'إننا نريد تحريرهم من الظلم والاغتصاب والتعذيب والقتل. . . نحن نطلب منك أيها الرب أن تباركنا في مجهودنا هذا'.<br />ثم تراص جنود البحرية وأخذ قسيسهم يباركهم بـ'الزيت المقدس'.<br />وقد تم في هذه الطقوس تعميد ستة جنود من عناصر المارينز، وقال واحد منهم: 'أنا أردت أن أفعل ذلك قبل توجهي إلى المعركة' , ويعجب المراقبون من نوعية الدافعية الدينية التي على أساسها يقتل الإنسان غيره ويشرد أطفاله ويهدم بيته ويستبيح حرماته , وكذلك تلك التي تقوم على سفك الدماء وانتهاك الأعراض بعقيدة شركية المسيح - عليه السلام - منها بريئ !!"
archived = "2004-11-10"
capture_url = "https://web.archive.org/web/20041110003521/http://www.20at.com:80/article.php?sid=736"

