subject = "ahmedsaber1970@yahoo.co.uk"
text = "غازات تصيب بالهستيريا وحروق وجثث مشوهة في الشوارع ... العراق: قصف كيماوي أمريكي على الفلوجة وعشرات الجثث ملقاة في الشوارع<br />الفلوجة (العراق) - خدمة قدس برس<br />قالت مصادر في المقاومة العراقية إن قوات الاحتلال استخدمت على نطاق واسع أسلحة كيماوية وغازات سامة ضد المقاومين المدافعين عن مدينة الفلوجة. وقالت المصادر إن عشرات الجثث شوهدت في الأحياء الشمالية للمدينة.<br />وذكرت المصادر أن لجوء القوات الأمريكية للأسلحة الكيماوية والغازات السامة تم بعد تمكن المقاومين العراقيين من دحر قوات الاحتلال عن تلك الأحياء، ورفع العلم العراقي فوقها، ونجاحهم في تدمير عدد كبير من العربات والدبابات الأمريكية، التي شوهدت والنيران تشتعل فيها.<br />وذكرت المصادر أن القوات الأمريكية اختارت اللجوء إلى الأسلحة المحرمة دوليا، لإخماد شوكة المقاومة في المدينة، في ظل غياب وسائل الإعلام عن الفلوجة، وسيطرة قوات الاحتلال على المراسلين العسكريين المرافقين للقوات المهاجمة للمدينة، إذ تعمد القوات الأمريكية إلى فرض رقابة صارمة على سائر التقارير والصور، التي يبعث بها المراسلون الصحفيون من حول المدينة.<br />وقال طبيب عراقي، طلب عدم الكشف عن اسمه، لوكالة \"قدس برس\"، إن القوات الأمريكية ألقت غازات كيماوية وغاز الأعصاب على المقاومين، مما أدى إلى إصابة العديد منهم بحالة من الهستيريا، جعلت بعضهم يتمرغون في الأرض وهم في وضع مزر جدا.<br />في حين قال عدد من المقاتلين، ممن شاركوا في معارك حي الجولان، لوكالة \"قدس برس\"، إن القوات الأمريكية ألقت العديد من الغازات السامة، قسم منها يجعل الجلد يحترق، دون أن تنفع الأساليب البدائية للمقاتلين في وقف تأثير تلك الغازات.<br />وكان وزير الدفاع العراقي حازم الشعلان أعلن أن اليوم الثلاثاء سيكون يوم الحسم في معركة الفلوجة. ويذهب مراقبون إلى أن الشعلان كان يعني استخدام قوات الاحتلال للأسلحة الكيماوية وغازات الأعصاب لقتل المسلحين المدافعين عن المدينة والذين بحوزتهم وسائل بسيطة، إذا ما قورنت بالوسائل التقنية العالية، التي يستخدمها الجيش الأمريكي، وهو ما حصل بالفعل مساء اليوم.<br />وذكرت المصادر أن قوات الاحتلال بدأت تدخل إلى بعض الأحياء الشمالية لمدينة الفلوجة، في حين لا تزال المقاومة مستمرة في أماكن عديدة أخرى في المدينة، التي تتعرض لهجوم واسع من جميع الجهات."
archived = "2004-12-31"
capture_url = "https://web.archive.org/web/20041231091747/http://www.20at.com:80/article.php?sid=736&mode=&order=0"

