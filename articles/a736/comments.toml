text = "قناة الجزيرة<br />أفادت مصادر طبية للجزيرة بأن المعارك العنيفة التي اندلعت مساء الاثنين في الفلوجة غرب بغداد, أسفرت لحد الآن عن مقتل شخصين وإصابة 15 آخرين.<br />وقال الدكتور أحمد خالد من مستشفى الفلوجة العام إن قوات الحرس الوطني العراقي أخرجت أكثر من 60 طبيبا ودمرت المستشفى وكسرت زجاج النوافد واعتدت على موظفي المستشفى بالضرب.<br />وأضاف أن مقاتلي الحرس الوطني العراقي عرضوا منتسبي المستشفى, بعد أن سرقوا ما في جيوبهم, على لجنتين عراقية وأميركية استجوبتاهم عن بعض الشخصيات الموجودة في الفلوجة. وقال إن الكادر الطبي أعيد بالقوة بعد التحقيق إلى بغداد بسيارات إسعاف ترافقها سيارات مدرعة.<br />ومن الميدان قال الصحفي العراقي أبو بكر الدليمي في اتصال مع الجزيرة من الفلوجة إن المدينة تحولت إلى ساحة حرب والقصف المدفعي متواصل في جميع المناطق, موضحا أن المستشفى العام سقط بيد القوات الحكومية, والمستشفى البديل المكون من خمسة أطباء فقط غير قادر على استيعاب الجرحى أو إجراء اللازم لهم"
archived = "2004-11-10"
capture_url = "https://web.archive.org/web/20041110003521/http://www.20at.com:80/article.php?sid=736"

