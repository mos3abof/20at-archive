subject = "dd2004aa@yahoo.com"
text = "الله الله الله الله<br />هذا هو يوم الظالم الجلاد الذي اذل الشعب فضربوا اوكار<br />الصداميون في الفلوجه والرمادي وهيت وعانه والموصل<br />وتكريت وبلد وبيجي وكركوك وبعقوبه ولاترحموا منهم احدا<br />ولاحتي مجروحا منه فانهم كلاب الطاغيه المخلوع<br />والنصر لكل الاحرار الذي يريدون نجات الوطن"
archived = "2004-12-31"
