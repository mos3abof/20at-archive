subject = "ss2002w@yahoo.com"
text = "بسم قاسم الجباريين<br />الحمد لله الذي اذل الظالمين القابيعين في الفلوجه<br />بعد 35 عام من الظلم للشعب العراقي فجاء يومكم<br />ايه السفله القابعين في القبور بعد ان كنتم في القصور ولم تعبوا بظلمكم للوطن فحان ساعه الخلاص منكم<br />والي الابد ايه الصداميون المجرمون"
archived = "2004-12-31"
capture_url = "https://web.archive.org/web/20041231091747/http://www.20at.com:80/article.php?sid=736&mode=&order=0"

