subject = "الفلوجة ليست المكان الأفضل"
text = "كعراقي, يؤسفني ما يجري بالفلوجة مع قتل و أذى للناس, لا لأنهم أقاربي بالعشيرة بل لأنهم أخوة لي بالمواطنة و العروبة و الإسلام. لكننا بحاجة للحظة صدق يا سادة و سيدات, فالفلوجة ليست معقلا رائعا للمقاومة كما يحب الإعلام العربي تصويرها, بل هي مدينة محكومة من مجرمين بعثيين سابقين و بعض المتطرفين الدينيين الذين يذبحون الإنسان لإختلافه بالرأي معهم. بالتأكيد الأمريكيون لا يهاجمون الفلوجة لهذي المنطلقات, بل هم يهاجمونها لكي تضم تحت باقي المدن العراقية لا أكثر, و بالتالي تقام الإنتخابات بهدوء ليبيض وجهها البشع لوهلة.<br />و نحن لسنا بالحمقى لنثق بالإنتخابات القادمة, لكننا نريد أن نتخذها ذريعة لنسيطر أكثر على مؤسساتنا بالدولة و نتمكن من إضعاف الجانب الإداري الأمريكي لنتركهم بالنهاية جيشا وسط جيش آخر هو الشعب. الإنسان البعثي لا يؤمن بهذا المنطلق للمقاومة, بل هو ينسف آبار النفط و أنابيبه ليعطي للأمريكي فرصة بنائها مرة أخرى بملايين الدولارات لكي يبقى العراق مديونا لها. الإنسان البعثي الأحمق لم يفاجأنا بهذي الحركات الغبية, بل هو أمر أعتدناه منذ 40 سنة منهم, و كانوا قبلا يسحلون الإنسان المسلم لو أنهم أحسوا بأنه يعبد الله حقا و يجاهد لأجله, و اليوم يلعبون بالعواطف باسم الإسلام كما فعلوا بعام 1968, و الفرق أنهم يلعبون بمشاعر الشعوب العربية و ليس الشعب العراقي الذي يعرفهم جيدا و يعرف من هو الغنسان البعثي.<br />البعثي عادة إما سفاكا للدم أو سكيرا, و البعثية إنسانة لا يكف الرجال عن ولوج دارها ليلا و العبث بشرفها, فهل نرتجي من هؤلاء ثورة؟<br />لا أعتقد"
archived = "2004-12-31"
capture_url = "https://web.archive.org/web/20041231091747/http://www.20at.com:80/article.php?sid=736&mode=&order=0"

