subject = "بيان صادر من الجناح العسكري في تنظيم القاعدة في ال"
text = "الحمد لله قاهر الأعادي في الانبار وبغداد وبعقوبة والموصل والرمادي ، والصلاة والسلام على محمد في كل صقع ونادي وعلى آله وصحبه في كل حاضر وبادي ... أما بعد :<br />هاهم ضياغم الإسلام في بلاد الرافدين يثبتون أنهم صنو أسود الفلوجة شجاعة وفروسية ... ؛ فبعد أن عد العدو عدته لضرب إخواننا في مدينة الفلوجة الأبية انبرى أُسد الجبار لنصرة إخوانهم وأعراضهم .... فأليكم يا غيارى جانب من عمليات الأسود ليوم الاثنين المؤرخ 25/رمضان/1425 هجرية؛ الموافق 8/11/2004 ميلادية فنقول وبالله نستعين:<br />1- قام أُسد الأمة في مدينة بغداد بالتالي :<br />1) عملية استشهادية في شارع المطار .... استهدفت سيارتين تابعتين لجهاز المخابرات الأمريكية ألcia وكانت السيارات نوع Gmc (بهبهان) محمية بمدرعتين ...ولله الحمد والمنة .<br />2) اشتباكات مع القوات الأمريكية في شارع حيفا ببغداد ....<br />3) حرق ناقلتين إمداد في منطقة الغزالية ....<br />4) قامت كتيبة الصواريخ بضرب 24 صاروخاً نوع كراد وطارق على معسكر ما يعرف المزرعة القريب من مدينة الفلوجة الأبية والذي تتجمع فيه القوات الغازية ....<br />5) وكذلك قامت كتيبة الصواريخ بدك مقر ما يعرف بمعسكر جاهدي خلق القريب من مدينة الفلوجة الأبية وكذلك مقر شركة اللحوم الذي تتجمع فيهما القوات الغازية ... ولله الحمد والمنة ....<br />2- قام أُسد الأمة في مدينة الكرمة والرضوانية القريبتين من مدينة الفلوجة الأبية بالتالي:<br /> (عملية الصقر الاستشهادية ) حيث انطلق ليث من ليوث \" كتيبة الاستشهاديين \" لينغمس في تجمع للقوات الأمريكية في المدينة .... ولله الحمد والمنة حيث كانت عملية موفقة ....<br /> قام أبطال المدينة بالاشتباك مع القوات المحاصرة لمدينة الفلوجة الأبية والتعرض لقوافل الإمداد حيث تمكن الأسود من حرق 14 ناقلة وقود في هذا اليوم وحده .... ولله الحمد والمنة ....<br />3- قام أُسد الفلوجة الابطال :<br /> بادئ ذي بدئ نود أن نبشر الأمة بأن المدينة ما زالت تحت سيطرة المجاهدين التامة والشاملة.... وأن العدو إلى ألان لم يستطع التجرؤ لدخول المدينة – صانها الله – وان ما أدعاه إعلامه بان مدرعا ته دخلت منطقة حي الجولان ما هو إلا كذب محض... وهذا هو الأصل في أقواله وأفعاله ... وفوق كل ذلك أكد الصحفيون المتواجدون في المدينة والقريبين منها كذب الخبر..... كما وأن الشباب المجاهد الأبي متماسك وصابر ومرابط.... ومعنوياته جد مرتفعة.... ولله الحمد والمنة .... وكانت خسائر العدو (المُشاهدة) كالآتي :<br />1) إسقاط ثلاث طائرات حربية الأولى نوع F16، والثانية نوع F19، والثالثة طائرة تجسس... وقد اعترف العدو الخائب بإسقاط طائرة تجسس واحدة.... ولله الحمد والمنة ...<br />2) إحراق مدرعتين اثنتين.... ومقتل من فيهما .... ولله الحمد والمنة ....<br />3) اشتباك مع القوات الغازية على أطراف المدينة ...<br />4- قام أُسد الرمادي الأبطال :<br />1) عمليتين استشهاديتين ....<br />2) تفجير عبوات ناسفة....<br />3) اشتباكات مع العدو في كافة أنحاء المدينة .... كما ونحب أن نعلن للأمة أن المدينة شبه محررة من العدو... وانه إلى ألان لا يجرؤ دخول المدينة ؛ والمدينة تتعرض لقصف جوي متواصل<br />ولا حول ولا قوة إلا بالله ....<br />5- قام أُسد الموصل الأبطال:<br /> قام الأبطال في مدينة الموصل الحدباء باشتباكات متفرقة من أنحاء المدينة مع العدو ومن والاه من المرتدين ....<br /> حرق أربعة صهاريج 3 منها تركية و1 أمريكية وقتل من فيها ...... ولله الحمد والمنة ....<br />ولينتظر أعداء الله منا المزيد والله غالب على أمره ولكن أكثر الناس لا يعلمون....<br />والله اكبر.... ولله العزة ولرسوله وللمجاهدين ....<br />الجناح العسكري<br />لتنظيم القاعدة في بلاد الرافدين<br />الاثنين المؤرخ 25/رمضان/1425 هجرية<br />الموافق 8/11/2004 ميلادية"
archived = "2004-11-10"
capture_url = "https://web.archive.org/web/20041110003521/http://www.20at.com:80/article.php?sid=736"

