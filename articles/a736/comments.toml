subject = "نقل المعركة إلي بغداد"
text = "مفكرة الإسلام: [خاص] تحاول المقاومة العراقية توسيع رقعة الحرب ضد الاحتلال داخل المثلث السني في مسعى حثيث لها لنقل المعركة إلى العاصمة العراقية بغداد.<br />ووزع منشور للمقاومة يميط اللثام عن خطة لها بنقل المعركة من الفلوجة إلى بغداد بعد أن اشتبكت مجاميع من المقاومة خارج الفلوجة بالقوات الغازية في الخطوط الخلفية للغزاة وأمطرتهم بصواريخ سجلت رقما قياسيا تجاوز 200 صاروخاً خلال هذه الليلة.<br />ويقول مراسل 'مفكرة الإسلام' إن سيارات للمقاومة العراقية تحمل منصات صواريخ غير مضيئة تتسلل خلف خطوط العدو في جنح الظلام وتصب عليها لظى صواريخه."
