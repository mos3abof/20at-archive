subject = "يوسف والي المفتري عليه"
author = "احمد رمضان"
posted = "2005-12-15"
text = "نت احد المتابعين لسير العملية الانتخابية بيوسف الصديق ولم يحدث سوي تدخلات بسيطة من جانب الشرطة ولكن لأن الظروف مواتيه ومناسبة تماما لاسقاط والي نتيجة غسيل المخ الذي ملئ عقول ابناء الدائرة ، ايا كان الامر فقط اختارت جماهير الدائرة حسن يوسف الذي لايتمتع باي شعبية اللهم ماانه نال حظامن السماء اهدته ظروف غير متوقعة حتي لنفسه،فهو لايصدق ماحدث ، حقا انها كانت ثورة عارمة ضد والي ودون تطويل اود ان اسالكم بعض الاسئلة :اولا لماذا قعل والي ذلك من تطبيع كامل مع اسرائيل وهل تصرف بمفرده ام بعلم رئيس الجمهورية ؟<br />ثانيا ماالذي يدفع بوالي لارتكاب خيانة وطنه وهوليس لديه ولداولا بنتا ولم يكن يوما فقيرا يريد التربح من وظيفته العامة ؟<br />اما اذا كان والي مدان فلنطالب جميعا باعدامه ام تري اننا سنتطرق الي مظاهرة عارمة تطالب باعدام كل افراد النظامالمصري<br />انتظر الرد واسف علي عدم العناية باللغةالصحيحة<br />اذا ارتم مشوار واخبار حية تفيد جميعا عن حياة والي فانا في خدمتكم بشرط ان يعرض"
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228233821/http://egyvote.20at.com:80/article.php?sid=60"
