posted = "2010-02-23"
text = "الحمد لله على نعمة الإسلام والحمد لله أن ميز اللة المرأة المسلمة عن غيرها بتاج…هو الحجاب الشرعى الذى يرضى الله أولا وأخيرا…لا يكون رضائى إلا فى إطار رضاء الله ..شعار كل بنت مسلمة((الله خلقنى ..الله يعرفنى ..الله يحبنى ..الله أمرنى..فلله كل أمرى))هنيئا لك أختى وإبنتى وأمى ..يا كل من أعلنت إسلامها ليس بالقول ولكن بالعمل…إليكم ياحبيباتى هذا الحديث لتحذرن من أن تكن من أهله حمانا الله وإياكن…روى مسلم فى صحيحه عن أبى هريرة رضى الله عنه عن النبى صلى الله عليه وسلم أنه قال:((صنفان من أهل النار لم أرهما: قوم معهم سياط كأذناب البقر يضربون بها الناس, ونساء كاسيات عاريات,مائلات مميلات,رؤوسهن كأسنمة البخت المائلة, لا يدخلن الجنة ولا يجدن ريحها , وإن ريحها ليوجد من مسيرة خمسمائة عام))أطيعى الله حبيبتى وتحجبى ..ولا تنسى أن تعرضى نفسك على هذه الأية وأن وتعرفى شروط الحجاب الشرعى لتكونى من الناجين من أهل هذا الحديث وتفوزين برضوان الله قال تعالى(يا أيها النبى قل لأزواجك وبناتك ونساء المؤمنين يدنين عليهن من جلابيبهن ذلك أدنى أن يعرفن فلا يؤذين وكان الله غفورا رحيما)"
