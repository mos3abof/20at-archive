text = "يتبع : باقي المقال :<br />7- أن لا يشبه ثوب الكافرات؛ لقوله -صلى الله عليه وسلم-: (مَنْ تَشَبَّهَ بِقَوْمٍ فَهُوَ مِنْهُمْ) (رواه أحمد وأبو داود، وصححه الألباني)، كما دعا إلى مخالفتهم فقال: (وَخَالِفُوا أَهْلَ الْكِتَابِ) (رواه أحمد والبيهقي، وحسنه الألباني)، (خَالِفُوا الْمُشْرِكِينَ) (متفق عليه)، (خَالِفُوا الْمَجُوسَ) (رواه مسلم).<br />8- أن لا يكون ثوب شهرة؛ وهو كل ثوب يقصد به الاشتهار بين الناس سواء كان الثوب نفيسًا يلبسه تفاخرًا بالدنيا وزينتها، أو خسيسًا يلبسه إظهارًا للزهد، قال -صلى الله عليه وسلم-: (مَنْ لَبِسَ ثَوْبَ شُهْرَةٍ فِي الدُّنْيَا أَلْبَسَهُ اللَّهُ ثَوْبَ مَذَلَّةٍ يَوْمَ الْقِيَامَةِ ثُمَّ أَلْهَبَ فِيهِ نَارًا) (رواه أحمد وابن ماجه، وحسنه الألباني)."
archived = "2010-03-08"
capture_url = "https://web.archive.org/web/20100308124329/http://www.20at.com:80/banat/health-and-beauty/beauty/15276-2010-02-10-14-38-59.html?utm_source=facebook&utm_medium=banat-ad&utm_campaign=hegab"

[[comments]]
order = 25
subject = ""
author = "heba alshamy"
posted = "2010-03-01"
text = "يتبع : باقي المقال :قُلْتُ: يَا رَسُولَ اللَّهِ كَسَوْتُهَا امْرَأَتِي. فَقَالَ لِي رَسُولُ اللَّهِ -صلى الله عليه وسلم-: (مُرْهَا فَلْتَجْعَلْ تَحْتَهَا غِلاَلَةً إِنِّي أَخَافُ أَنْ تَصِفَ حَجْمَ عِظَامِهَا) (رواه أحمد، وحسنه الألباني).<br />5- ألا يكون مطيبًا؛ لقوله -صلى الله عليه وسلم-: (أَيُّمَا امْرَأَةٍ اسْتَعْطَرَتْ فَمَرَّتْ عَلَى قَوْمٍ لِيَجِدُوا مِنْ رِيحِهَا فَهِيَ زَانِيَةٌ)(رواه النسائي، وحسنه الألباني)، وسبب المنع منه واضح، وهو ما فيه من تحريك داعية الشهوة.<br />6- أن لا يشبه لباس الرجال؛ لحديث أبي هريرة -رضي الله عنه- قال: (لَعَنَ رَسُولُ اللَّهِ -صلى الله عليه وسلم- الرَّجُلَ يَلْبَسُ لِبْسَةَ الْمَرْأَةِ وَالْمَرْأَةَ تَلْبَسُ لِبْسَةَ الرَّجُلِ) (رواه أبو داود، وصححه الألباني)."
archived = "2010-03-08"
capture_url = "https://web.archive.org/web/20100308124329/http://www.20at.com:80/banat/health-and-beauty/beauty/15276-2010-02-10-14-38-59.html?utm_source=facebook&utm_medium=banat-ad&utm_campaign=hegab"

[[comments]]
order = 26
subject = ""
author = "heba alshamy"
posted = "2010-03-01"
text = "يتبع : باقي المقال :<br />3- أن يكون صفيقـًا لا يشف؛ لأن الستر لا يتحقق إلا به، قال -صلى الله عليه وسلم-: (سَيَكُونُ فِي آخِرِ أُمَّتِي نِسَاءٌ كَاسِيَاتٌ، عَارِيَاتٌ، عَلَى رُءُوسِهِنَّ كَأَسْنِمَةِ الْبُخْتِ، الْعَنُوهُنَّ، فَإِنَّهُنَّ مَلْعُونَاتٌ) (رواه أحمد والطبراني، وصححه الألباني).<br />قال ابن عبد البر -رحمه الله-: \"أراد النساء اللواتي يلبسن من الثياب الشيء الخفيف الذي يصف ولا يستر، فهن كاسيات بالاسم، عاريات في الحقيقة\".<br />4- أن يكون فضفاضًا غير ضيق؛ لأن الغرض من الثوب هو رفع الفتنة، ولا يحصل ذلك إلا بالفضفاض الواسع، وقد قال أسامة بن زيد -رضي الله عنهما-: (كَسَانِي رَسُولُ اللَّهِ -صلى الله عليه وسلم- قُبْطِيَّةً كَثِيفَةً كَانَتْ مِمَّا أَهْدَاهَا دِحْيَةُ الْكَلْبِيُّ فَكَسَوْتُهَا امْرَأَتِي فَقَالَ لِي رَسُولُ اللَّهِ -صلى الله عليه وسلم-: (مَا لَكَ لَمْ تَلْبَسِ الْقُبْطِيَّةَ) ؟. قُلْتُ: يَا رَسُولَ"
archived = "2010-03-08"
capture_url = "https://web.archive.org/web/20100308124329/http://www.20at.com:80/banat/health-and-beauty/beauty/15276-2010-02-10-14-38-59.html?utm_source=facebook&utm_medium=banat-ad&utm_campaign=hegab"

[[comments]]
order = 27
subject = ""
author = "heba alshamy"
posted = "2010-03-01"
text = "يتبع : باقي المقال :<br />وهذا يدل على أن الحجاب المأمور به هو الذي يستر جميع البدن، وصفاته:<br />1- أن يغطي جميع البدن؛ لقوله -تعالى-: (يُدْنِينَ عَلَيْهِنَّ مِنْ جَلابِيبِهِنَّ ذَلِكَ أَدْنَى أَنْ يُعْرَفْنَ فَلا يُؤْذَيْنَ).<br />2- أن لا يكون زينة في نفسه؛ لقوله -تعالى-: (وَلا يُبْدِينَ زِينَتَهُنَّ إِلا مَا ظَهَرَ مِنْهَا)، والمقصود من الأمر بالجلباب إنما هو ستر زينة المرأة، فلا يعقل حينئذٍ أن يكون الجلباب نفسه زينة.<br />ولذلك قال الإمام الذهبي -رحمه الله-: \"ومن الأفعال التي تلعن عليها المرأة إظهار الزينة والذهب واللؤلؤ تحت النقاب، وتطيبها بالمسك والعنبر إذا خرجت، ولبسها الصباغات والأزر الحريرية والأقبية القصار مع تطويل الثوب وتوسعة الأكمام وتطويلها، وكل ذلك من التبرج الذي يمقت الله عليه، ويمقت فاعله في الدنيا والآخرة\"."
archived = "2010-03-08"
capture_url = "https://web.archive.org/web/20100308124329/http://www.20at.com:80/banat/health-and-beauty/beauty/15276-2010-02-10-14-38-59.html?utm_source=facebook&utm_medium=banat-ad&utm_campaign=hegab"

[[comments]]
order = 28
subject = ""
author = "heba alshamy"
posted = "2010-03-01"
text = "باقي المقال :<br />قال الشيخ ابن عثيمين -رحمه الله-: \"وهذا الحديث دليل على وجوب ستر قدم المرأة، وأنه أمر معلوم عند نساء الصحابة -رضي الله عنهم-، والقدم أقل فتنة من الوجه والكفين بلا ريب، فالتنبيه بالأدنى تنبيه على ما فوقه، وما هو أولى منه بالحكم، وحكمة الشرع تأبى أن يجب ستر ما هو أقل فتنة، ويرخص في كشف ما هو أعظم منه فتنة، فإن هذا من التناقض المستحيل على حكمة الله وشرعه\".<br />وفي التعليق الجاي إن شاء الله نكمل شروط الحجاب الشرعي<br />من نفس المقال."
archived = "2010-03-08"
capture_url = "https://web.archive.org/web/20100308124329/http://www.20at.com:80/banat/health-and-beauty/beauty/15276-2010-02-10-14-38-59.html?utm_source=facebook&utm_medium=banat-ad&utm_campaign=hegab"

[[comments]]
order = 29
subject = ""
author = "heba alshamy"
posted = "2010-03-01"
text = "باقي المقال:<br />قال أبو بكر بن العربي -رحمه الله-: \"وذلك لأن سترها وجهها بالبرقع فرض؛ إلا في الحج فإنها ترخي شيئًا من خمارها على وجهها، غير لاصق به، وتعرض عن الرجال، ويعرضون عنها\".<br />وعن عائشة -رضي الله عنها- قالت: (كَانَ الرُّكْبَانُ يَمُرُّونَ بِنَا وَنَحْنُ مَعَ رَسُولِ اللَّهِ -صلى الله عليه وسلم- مُحْرِمَاتٌ فَإِذَا حَاذَوْا بِنَا سَدَلَتْ إِحْدَانَا جِلْبَابَهَا مِنْ رَأْسِهَا إِلَى وَجْهِهَا فَإِذَا جَاوَزُونَا كَشَفْنَاهُ) (رواه أبو داود، وصححه الألباني).<br />وعن ابن عمر -رضي الله عنهما- قال: قال رسول الله -صلى الله عليه وسلم-: (مَنْ جَرَّ ثَوْبَهُ خُيَلاَءَ لَمْ يَنْظُرِ اللَّهُ إِلَيْهِ يَوْمَ الْقِيَامَةِ. فَقَالَتْ أُمُّ سَلَمَةَ: فَكَيْفَ يَصْنَعْنَ النِّسَاءُ بِذُيُولِهِنَّ؟ قَالَ: (يُرْخِينَ شِبْرًا). فَقَالَتْ: إِذًا تَنْكَشِفَ أَقْدَامُهُنَّ. قَالَ: (فَيُرْخِينَهُ ذِرَاعًا لاَ يَزِدْنَ عَلَيْهِ) (رواه الترمذي، وصححه الألباني)."
archived = "2010-03-08"
capture_url = "https://web.archive.org/web/20100308124329/http://www.20at.com:80/banat/health-and-beauty/beauty/15276-2010-02-10-14-38-59.html?utm_source=facebook&utm_medium=banat-ad&utm_campaign=hegab"

[[comments]]
order = 30
subject = ""
author = "heba alshamy"
posted = "2010-03-01"
text = "باقي المقال :<br />وقال محمد بن سيرين -رحمه الله-: \"سألت عبيدة السلماني عن قول الله -تعالى-: (يُدْنِينَ عَلَيْهِنَّ مِنْ جَلابِيبِهِنَّ) فغطى وجهه من فوق رأسه، وأبرز عينه اليسرى\".<br />ومما يدل على أن المرأة كلها عورة يجب سترها عن أعين الرجال الأجانب قول النبي -صلى الله عليه وسلم-: (الْمَرْأَةُ عَوْرَةٌ).<br />قال الإمام أحمد -رحمه الله-: \"كل شيء منها عورة حتى ظفرها\",<br />وقال شيخ الإسلام ابن تيمية -رحمه الله-: \"وهو قول مالك\".<br />وقال -صلى الله عليه وسلم-: (لاَ تَنْتَقِبِ الْمَرْأَةُ الْمُحْرِمَةُ وَلاَ تَلْبَسِ الْقُفَّازَيْنِ ) (رواه البخاري)."
archived = "2010-03-08"
