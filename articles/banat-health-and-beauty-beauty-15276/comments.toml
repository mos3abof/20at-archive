posted = "2010-02-19"
text = "بقية الشروط اللي لازم نراعيها في عملية التجديد ده:<br />8- أن لا يشبه لباس الكافرات ( يعني لا يشبه مثلا لفة ترحة الراهبات اللي لا تستر الرقبة، و كمان لا يكون صدر اللبس مفتوح الأنن الحركة ده كان النساء الكافرات في الجاهلية و عصر الإسلام بيعملوها…)<br />9- أن لا يكون فيه تصاليب ولا تصاوير لذوات الأرواح (عليه صور .. وده حتى علشان اللبس يصبح غير ملفت حتى…)<br />* ثانيا :<br />برضه علشان نحقق التجديد ممكن نجدد الألوان ، تركيب الملابس على بعضها و كذلك تركيب الألوان على بعضها ، نغيير الأقمشة (تغيير الأقمشة بيعمل فرق كبير جدا في المظهر) …<br />و ده كله في الآخر علشان أرضي ربي اللي هو أغلى عندي …"
archived = "2010-02-22"
capture_url = "https://web.archive.org/web/20100222223058/http://www.20at.com:80/banat/health-and-beauty/beauty/15276-2010-02-10-14-38-59.html?utm_source=facebook&utm_medium=banat-ad&utm_campaign=hegab"

[[comments]]
order = 5
subject = ""
author = "أمة الله"
posted = "2010-02-19"
text = "فكرة التجديد ده فكرة حلوة …<br />أقولكم علي حاجة تساعدكم في الإخيتار و التجديد …<br />* أولا :لازم نراعي شروط الحجاب أثناء عملية التجديد، و اللي هى كالتالي: 1- أن يكون الحجاب ساترا لجميع البدن (الرقبة و الذراع و الأقدام و الأرجل…)<br />2- أن يكون ثخينا لا يشفّ عما تحته (مش شفاف: زي مثلا ترحة خفيفة أو حاجة تريكو بتبين اللي تحتها…)<br />3- أن يكون فضفاضا غير ضيّق (مش كارينا carina او بنطلون أو إسترتش…)<br />4- أن لا يكون مزينا ملفت للأنظار (ألوان صارخة أوي، تطريز كتير أووووفر OOover أوي…)<br />5- أن لا يكون مطيّبا (يكون ليس له رائحة و ده بالتأكيد لا يمنع استخدام مزيل رائحة العرق اللي من غير not scented, perfume، يعني كفاية رائحة النظافة)<br />6- أن لا يكون لباس شهرة (يعني لا نلبس الملابس بقصد التفاخر و المنظرة بيها، و كمان لا نغالي اوي فيها مش بس في سعرها و لكن كمان لا نغالي في شكلها )<br />7- أن لا يُشبه لباس الرجال ( يعني مثلا مش اللبس اللي يخلي اللي يشوفك من ظهرك يتساءل ده ولد ولا بنت و يرجع يقول لنفسه لأ أكيد بنت مش لابسة ترحة أه أدام عينيك …"
archived = "2010-02-22"
capture_url = "https://web.archive.org/web/20100222223058/http://www.20at.com:80/banat/health-and-beauty/beauty/15276-2010-02-10-14-38-59.html?utm_source=facebook&utm_medium=banat-ad&utm_campaign=hegab"

