posted = "2010-03-01"
text = "السلام عليكم و رحمة الله و بركاته<br />مبروك للي اتحجبت وبادعيلها بالثبات بس لازم يا بنات لما نيجي نرجع لربنا نرجع صح هو مش أصلا هدفنا إن احنا نتوب من الذنوب و المعاصي اللي من ضمنها عدم الحجاب ,يبقي نتوب صح , وصح يعني وفق المنهج اللي منزلهولنا ربنايعني وفق شرع الله كما يريده الله عز وجل لا كما أريده أنا و شرع الله يكمن في كتاب الله عز وجل و سنة رسول الله صلى الله عليه و سلم .. تعالوا بأة نشوف شرع ربنا ييقول إيه …<br />من مقال للشيخ محمود عبد الحميد ,اسمه :الحجاب كما نريد:<br />فقال -تعالى-: (يَا أَيُّهَا النَّبِيُّ قُلْ لأَزْوَاجِكَ وَبَنَاتِكَ وَنِسَاءِ الْمُؤْمِنِينَ يُدْنِينَ عَلَيْهِنَّ مِنْ جَلابِيبِهِنَّ ذَلِكَ أَدْنَى أَنْ يُعْرَفْنَ فَلا يُؤْذَيْنَ) (الأحزاب:59)، قال ابن مسعود -رضي الله عنه-: \"الجلباب هو العباءة أو الملاءة التي تُضرَب على الرأس فتغطي جميع البدن\"."
