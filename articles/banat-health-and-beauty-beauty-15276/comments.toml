text = "أول يوم حجاب..بيكون اسعد يوم في حياة أي بنت<br />اولا لانها التزمت بشرع الله سبحانه و تعالى، و لأنها خطت خطوة جديدة في طريق إرضاء الله عز و جل، و لأن زي ما هى حاولت تقرب من ربنا ربنا كمان بيقرب لها، و ده في الحديث القدسي:<br />\"وما تقرب إلي عبدي بشيء أحب إلي مما افترضت عليه وما يزال عبدي يتقرب إلي بالنوافل حتى أحبه فإذا أحببته كنت سمعه الذي يسمع به وبصره الذي يبصر به ويده التي يبطش بها ورجله التي يمشي بها وإن سألني لأعطينه ولئن استعاذني لأعيذنه…\""
