author = "منة عماد"
posted = "2010-02-10"
text = "جزاكم الله خيرا<br />نصايح مفيدة<br />بس كنت عايزة أقول أني بعد أكتر من حداشر سنة محجبة جربت فيها ربطات كتير ما أستريحتش غير لما لبست طرح طويلة لأسباب كتير<br />أولها أني ببقى مطمنة إني متغطية كويس فحتى لو في هوا أو شعري أتفك من تحت الطرحة ما فيش حاجة هتبان<br />ثانيا سهلة جدا ومريحة في الربط ولا تسببلي أي آلام<br />أحسن حاجة الإيشاربات المربعة الكبيرة بتكون متر ونص في متر ونص أو زي ما أنت عايزة الطول بشتريها من الأزهر من محلات قماش الإيشاربات اللى هناك وأعمل سرفلة لأطرفها … لما بربطها بتنيها مثلث بس مش قد بعض واحد كبير والتاني أصغر منه شويه<br />وألبسه وأحطله دبوس من عند الرقبة وخلاص .. ما فيش أسهل من كده<br />في كمان الإيشاربات المستطيلة بس العريضة مش الكنزة مريحة برضو وبتغطي الظهر والصدر"
