subject = "الظلم فى البلد"
author = "رحاب على"
posted = "2006-10-16"
text = "بسم اللة الرحمن الرحيم انا زهت من حسنى مبارك مفيش اى تغير الفقير مش لقى ياكل كيلو الطماطم 2جنية كيلو الحمة 20جنية البيضة50 قرش غير غير احنا عايشين فى فساد محدش عالم بلغالبة الناس مشية تكلم نفسهامن قسوة مدارس قسوة عيد من الماريف الحيا اليوميةيارب تتفضح ياحسنى ويهدك ربنادة انت مش رءيس دة الى عينك رءيس منة للة يامظور فى الانتخبات ياحرامى منك للة يابعيد انت وعلتك كلها"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117202142/http://masr.20at.com:80/article.php?sid=395"

[[comments]]
order = 7
subject = "الظلم فى البلد"
author = "سارة"
posted = "2006-10-16"
text = "اقول اية دة انا مهما قولت عمر ماهاكلم بلسان75مليونمنك للة يفضحك ربنا علشان دى مش مصر الى كانت ايام السادات والا عبد الناصر حبة حبة مصر هتبا فى مجاعةمن ساعة ما مسكت مصر والفسات حت عليهاسارق اموال البلدالناس مش لية تاكل وكمان عايز تمسك ابنك يارب ابنك يموت علشان متربى بفلوس حرام من الناس الغلابة دة انت عملت جرايم ملهاش حل احنا كنا عايزين ايمن انت ظورت انت والحومة الوسخة وانت الى كسبت مكفكش دة كمان سجنت ايمن نو بالكوسة ياحرامى يامظور ايمن نور الى لم فى انتخبات الرءاسة ملاين فى مجلس الشعب ملمش والا صوت يبا انخبات كوسةبلاش نكلم على نعمان جمعة لنة اشرف منك بكتير وكان هايحس بالمواطن المصرى الغلبان"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117202142/http://masr.20at.com:80/article.php?sid=395"

