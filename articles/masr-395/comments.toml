order = 0
subject = "مبارك معزول"
author = "Utopian"
posted = "2006-05-28"
text = "ساعات بحس ان مبارك ده بيحكم بلد تانية غير مصر...عمري ما سمعته بيتكلم عن أي مشكلة في البلد غير الانفجار السكاني و تحديد النسل و الكام كوبري اللب اتعملوا و مشاريع الصرف الصحي...لكن مشاكل البني ادمين اللي بجد...طنااااااااااش...أكنه معزول عن الدنيا و عايش في بلد تانيه.<br />اللهم ولي أمورنا خيارنا"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043312/http://masr.20at.com:80/article.php?sid=395"

[[comments]]
order = 1
subject = "ربنا ينتقم منك يا حمكشة"
author = "مشروع ارهابي خريج جامعة وعاطل"
posted = "2006-05-28"
text = "انا خلاص زهقت منك , وزهقت منك يا حرامي يا سارق خير البلد انت والاربعين حرامي بتوعك<br />ربنا يهدك وينتقم منك بابشع امراض الكون ويخلصنا منك باذن الله يا عم حمكشة يا كبيررررررررررررر<br />قولوا امين ..امين"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043312/http://masr.20at.com:80/article.php?sid=395"

[[comments]]
order = 2
subject = "هما بيعملوا ليه فينا كده"
author = "نظره حائره"
posted = "2006-05-29"
text = "لماذا يكرهنا حسنى مبارك لماذا ينكل بنا اليس نحن الشعب الذى جعله ينعم بكل هذه الرفاهيه والحياه الرغده ووليناه زى ما بتقولوا انتم علينا ماذا فعلنا له هل هو حقد وكره وثأر قديم بينه وبين شعب مصر وأن الاوان للانتقام لماذا يطلق علينا كلابه السعرانه تنهش لحمنا وتهتك أعراضنا لماذا نداس بالاقدام والاحذيه لماذا نقتل وليس لنا ديه سؤال أخير أنتم بتضربونا ليه فى الفرح والحزن بتضربونا ليه حسبنا الله ونعم الوكيل"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043312/http://masr.20at.com:80/article.php?sid=395"

[[comments]]
order = 3
subject = "اذا لم تستح فسحل كما شئت"
author = "ربنا يفضحكوا فضيحه القطط"
posted = "2006-05-29"
text = "تفتكروا الحكومه بتاعتنا و رئيس العصابه<br />وشله المنتفعين تأثر فيهم أى فضايح<br />دول ناس معندهاش دم يا سيدى<br />أأأأأأأأأأأأأأأأأأأه يــــــــــا بـــــــــــــلـــــدى"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043312/http://masr.20at.com:80/article.php?sid=395"

[[comments]]
order = 4
subject = "إلى النظرة الحائرة"
author = "إلى الاخ النظرة الحائرة"
posted = "2006-05-29"
text = "تتسائل لماذا يكرهك لماذا ينكل بك ..<br />لاننا في نظرهم حوش رعاع كلاب زبالين<br />لامامة الشعوب ..<br />مش كفاية اننا حكمنكم ...<br />وبعدين عايز اقولك . الشعب لم يكن له أي دور في تعيين اي رئيس<br />ولم يكن للشعب اي دور في تعيين من يذله ولم ولن يكن له اي دور ..<br />عبيط من يتوهم ان للشعب دور في تعيين سيده<br />هذا كلام فاضي ..<br />بديل الفترة الرئاسية الأخيرة .<br />90% من البلد مش عايزين الراجل ده تاني<br />ومش بيحبوه ..<br />وبالرغم من كده ... وبالغصب وبالجذمة<br />برضوا شغال غصب عنكم وراح يذلكم اكتر واكتر<br />وعلشان تتأكد والأيام بيننا ..<br />بكرة تشوف لما ابنه جمال يمسك ، وهو طبعاً ليه حق طبيعي يتقدم للانتخابات زيه زي اي مواطن مصري ، بل بالعكس ده عنده خبره<br />فأبوه رئيس دولة سابق لمدة اذلال 25 عام<br />لما يمسك بكرة تقول كلامي صحيح<br />غصب عن التخين ابنه رايح يمسك<br />وكل الحوش والرعاع اللي بيعارضوا التوريث<br />او ان جمال يمسك البلد ويلعب في بواسيرها<br />الحوش والرعاع دول بكره يخدو بالجذمة القديمة<br />انت فاكر ايه ... العصابة ده من ايام<br />الهكسوس ومش راح تمشي من البلد ...<br />اهرب بجلد إلى اي بلد أخرى بأسرع وقت<br />أوعى تجيب عيال يحملوه الجنسية المصرية<br />اكبر غلطة في حياتك ممكن تعملها ."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043312/http://masr.20at.com:80/article.php?sid=395"

[[comments]]
order = 5
subject = "الحق لابدله من قوه تحميه"
author = "نظره عاقله"
posted = "2006-05-30"
text = "الاحساس بالظلم وحده كافى لتوليد الانفجار0 فما بالكم وإحنا عايشين فى قمة الظلم والفسادلذلك أنا مش هاقول كلام نتيجه غضب ولكن هافكركم باتساؤل ده 0قال أيه الى فرعنك يا فرعون ؟قال مالقتشى حد يوقفنى000وعلشان كده هاقولكم ساكتين ليه وعلشان ايه فقد قال تعالى (لا يغير الله ما قوم حتى يغيروا ما بانفسهم)(واعتصموا بحبل الله جميعا ولا تفرقوا)000فقوا أنفسكم ودافعوا عن العدل والحق والخير باموالكم ودمائكم وأنفسكم ولا تستسلموا حتى لا تهدر الحقوق وتضيع الأمانات<br />ولا يسعنى الا أن أقول<br />حسبي الله ونعم الوكيل 00وإن لله وإن إليه راجعون"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043312/http://masr.20at.com:80/article.php?sid=395"

