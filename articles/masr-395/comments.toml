text = "اول كلامى منك للة ياحسنى الكلب انت مش بنادم دة انت حيوان عايش والا حاسس بى مشاكل الشباب الشاب من دول يتعلم ويسهر ويتخرج ميليش شغلويلى زميلةوالاد الناس الاغنية متوظفين يسال نفسة اشمعنة همااترى البلد مشية كوسةنفترد ان الفقير معهوش فلوس يعمل اية حرام حرام حرام حرام الظلم دةانا عمرى ما سمعت حسنى الكلب بيكلم على امشكلة فى البلد"
