[[comments]]
order = 0
subject = "بيرو... أنا معاكم"
text = "المقال .. أسف مين اللي قال إن ده مقال الحملة المكتوبة فوق دي كارثة و عبقرية.. أنا موش عارف أعبر بس أخيرا لقينا حد بيكتب وهو بيفكر نعمل أيه علشان نخرج من اللي أحنا فيه ... ولعل مقال في موقع يكون هو الشرارة اللي تصحي الناس وتوعيهم وتخليهم يتحركوا .. أنا معاكم ويارب يهدينا وينصرنا علي أعداء الإسلام"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233554/http://www.20at.com:80/article.php?sid=205"

[[comments]]
