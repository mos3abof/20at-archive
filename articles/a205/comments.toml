subject = "عايزين خطوات عملية وبسرعة"
text = "يا ريت عشرينات تكمل السير في الطريق ده كلنا عايزين نتحرك ونقول اللي جوانا عايزيين خطوات عملية وبسرعة"
archived = "2004-09-26"
