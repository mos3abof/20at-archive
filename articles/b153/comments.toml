[[comments]]
order = 9
subject = "نحبك يا أم نضال"
author = "بنت فلسطين (ف)"
posted = "2006-01-28"
text = "أعرفها جيداً وجلست معها كثيييييير<br />و أنت تجلس معها تشعر أنك في عالم اخر تشعر بحنان بحب بصفاء قلبها ينبض بالحب لفلسطين والتضحية من أجل تحرير القدس<br />محبة جداجدا لإبناءها وكل من حولها تسعي للخير دائما<br />قدمت إبناءها في سبيل الله لأجل الله وحبها لله ولفلسطين يهون عندها كل شئ<br />مبدءها يهون الغالي لأجل الأغلى<br />أحبها أحبها أحبها هذه الخنساء العظيمة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125533/http://www.20at.com/article2.php?sid=153"

