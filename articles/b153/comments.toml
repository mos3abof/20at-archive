posted = "2005-12-26"
text = "يا ريت من كل الشباب و البنات يحاولوا يكونوا مع ولادهم و بناتهم زي أم نضال ... يعلموا أبناءهم العيش لخدمة الإسلام و الشهادة في سبيل الله<br />و سلملي على جيل شيبسي و شيتوس"
