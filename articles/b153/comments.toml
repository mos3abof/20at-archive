author = "الاخ الكريم اللي بيقول ان الموضوع ده من موقع اخوان اون أون لاين مع كامل الاحترام للموقع لكن ممكن ساعتك تعمل دون لود لفيديو عشرينات وبرده دون لوود لفيديو اخوان أون لاين وتعرف الفرق ايه"
