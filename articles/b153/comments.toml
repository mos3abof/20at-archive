posted = "2006-07-22"
text = "طوبى لك وطوبى لامهات الشهداء اللواتي انجبن اعز الرجال واعظم القادة يستنهض الامة من كبوتها وهاهي فلسطين تسطر مجدها وترسم صورتها المبدعة ويشق الشهداء طريقهم الى جنه ربهم فطوبى لاهل فلسطين وطوبى لهذا الدم المتدفق وطوبى للشهداء وطوبى لمن حذا حذوهم واسال الله للمسلمين العزة والنصر على الاعداء وان يتقدم شباب الاسلام للحاق بركب المجاهدين لان الجنة تنتظر للمشمرين لها والحور العين في غاية الاشتياق , فهل من مجيب للنداء ."
