subject = "الى خنساء فلسطين ام نضال"
author = "عبد الرحيم سمير"
posted = "2006-02-26"
text = "بسم الله الرحمن الرحيم اقول لي ام الئبطال الثلاث و الرجل الئسير اي ام نضال انتي خنساء فلسطين وتستحقي هاذا القب اجل تستحقيه وقد علمتي امهتنا كيفية الصبر على ابنائهن الرجال المقاومين الئبطال اجل انتي يا ام نضال فقد علمتي الرجال المقومة ولصبر على الئحتلال الصهيوني و ارجو ان تكوني سعيدة وتجمعين مع ابنئك في الجنة والسلام عليكم ورحمة الله وبركاتوا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125533/http://www.20at.com/article2.php?sid=153"

