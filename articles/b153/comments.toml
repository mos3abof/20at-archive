author = "نيفين"
posted = "2005-12-27"
text = "يا ريت الاتنين اصحاب تعليق الشيبسى و الشيتوس يبقو بتعليقاتهم على مستوى الموضوع<br />يا جماعه الهيافه دى اللى ودتنا ورا الشمس<br />الى ام نضال افرحى يا ام الشهيد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125533/http://www.20at.com/article2.php?sid=153"

[[comments]]
order = 6
subject = "توضيح"
author = "محمد علي"
posted = "2005-12-27"
text = "الأخت نيفين... جزاكي الله خيرا<br />معكي حق شر البلية ما يضحك<br />أنا أسخر من حال شباب الإسلام الذي أصبح كل همه حضور جميع حفلات عمرو دياب و اقتناء كل ألبومات هيفاء وهبي<br />أسخر من حال أطفال المسلمين الذين لا هم لهم إلا الشيبسي و الشيتوس و بي بليد<br />بينما في فلسطين هناك أسر تمكنت بفضل الله و حوله من جعل حياتهاإعلاء لكلمة الله و مماتهم شهادة في سبيل الله<br />أقول ليت كل أمهاتنا أم نضال و كل آبائنا عبد العزيز الرنتيسي و ليت كل شباب الإسلام أسامة بن زيد و كل أطفالنا علي بن أبي طالب في طفولته<br />و لكن أنظري حولك ستجدين أطفالا و شبابا لا هم لهم ولا مشكلة تشغل بالهم إلا كيفية قضاء الكريسماس<br />و لله الأمر من قبل و من بعد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125533/http://www.20at.com/article2.php?sid=153"

[[comments]]
order = 7
subject = "حسيت اني صغيره أوي...."
author = "مسلمه"
posted = "2005-12-28"
text = "أنا شفت أم نضال في نقابة الأطباء كانوا عاملين لها أحتفال ... حسيت اد إيه هي ست عظيمة جدا و كنت حاسة اني صغيرة أوى جمبها بجد كان نفسي أروح معاها فلسطين عشان أعيش الحاجات اللي كانت بتحكيها.. يا رب أرزقنا الشهادة جميعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125533/http://www.20at.com/article2.php?sid=153"

