text = "أنا احييكى يا أمى والله كم أنا أشتاق للجلوس معكى والله أنا عندما أشاهد الناشيد الذى تقبلى فيه ابنكى الشهيد أدعو الله أن يجعلنى مثلك وعلى فكرة احنا فى مصر اتفقنا فى العيد ان نتكلم مع الحضور على شخصيتك الرائعة لنحيى فيهم معنى الشهادة والنضال والجهاد اللهم ان اسمى امانينا هى الشهادة فى سبيلك فلا تحرمنا منها ادعو الله ان يتقبل منكى يا امى ويجمعنى بيكى فى الدنيا والاخرة...الاسلام هو الحل الحقيقى لهذه الامة الغافلة"
archived = "2006-11-02"
