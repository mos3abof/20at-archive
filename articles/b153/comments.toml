text = "أنا بقى مش حلم حياتى إنى أعيش فى ظل الخلافه الإسلاميه<br />أنا نفسى يبقى نصف أمهات المسلمين بس من نفس النوعيه دى<br />ربنا يكرمها و يحشرنا معاها فى الحنه يوم القيامه"
