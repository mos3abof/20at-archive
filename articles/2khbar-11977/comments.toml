author = "ممدوح زكى زخارى جرجس"
posted = "2009-05-12"
text = "كداب يا طلعت كداب<br />كفى تمسح رخيص بالسيد رئيس الجمهورية<br />هو رئيس الجمهورية فاضى ليك يا مشخصاتى و لا فاضى لحل مشاكل الشعب المطحون الغلبان<br />روح اطبخ على اى عبيط غيرنا"
archived = "2009-05-22"
