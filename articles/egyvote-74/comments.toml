order = 0
subject = "الوصايا العشر للاطاحة بالرئيس مبارك"
author = "محمد عبد المجيد"
posted = "2005-12-12"
text = "لوصايا العشر للاطاحة بالرئيس حسني مبارك<br />بقلم<br />محمد عبد المجيد<br />طائر الشمال<br />أوسلو في 4 ديسمبر 2005<br />﻿هذه الوصايا العشر هي تحريض لمحاولة قلب نظام الحكم، لكنني أعترف مسبقا بأنها لن تجد أذنا صاغية، وسينساها قارئوها قبل الانتهاء من السطر الأخير فيها، وسينظر لها المصريون بعزة وإباء واستعلاء رافضين أي صوت يأتيهم من الخارج فأبطال الداخل قادرون على تحرير وطنهم كما يظنون.<br />عندما يصبح الجهاز العصبي للمرء معبرا عن تحضر وتمدن وأحاسيس راقية وانسانية، تتقدم الكرامة حاملة كل مقومات التقدم ، ويرتعش الزعيم في قصره، وترتجف يداه، ويفكر سبعين مرة قبل السماح بانتهاك كرامة مواطن ولو كان أميا بسيطا متواضعا في قرية مجهولة في أحد نجوع مصر الموجوعة حتى الموت.<br />* عندما تستيقظ مبكرا عليك بالقاء نظرة متأملة قي المرآة، وأن تحرص على الحديث بصوت مرتفع أمامها، وأن تقول أربع وعشرين مرة: أنا ليست لي كرامة ولا أستحق العيش وأنني لا أصدق أن نفخة من روح الله أعطتني هذه القيمة!<br />* أن تقول بصوت أكثر ارتفاعا ووضوحا : نعم، أنا أعرف أن هناك عشرات الآلاف من المصريين يعانون العذاب المهين والظلم الشديد في زنزانات قذرة لعدة سنوات دون محاكمة، لكنني لن أدافع عنهم، ولن أكترث من أجلهم، ولا يهمني أن يحرقهم الرئيس أو يأمر بتصفيتهم أو يظلوا هكذا حتى يأتيهم ملك الموت، وليذهب محبوهم وذووهم وأهلهم وأمهاتهم وآباؤهم إلى الجحيم فأنا مواطن أناني وجبان ولا يعنيني أمر الآخرين .<br />ثم ترتفع حدة صوتك وتقول: وأعرف فضلا عن ذلك أن مئات المصريين قضوا تحت التعذيب في أقسام الشرطة والتخشيبة والحجز بعدما تعرضوا لكل عذابات البشر بمخالب ذئاب ساديين من رجال الأمن منحهم الرئيس رضاه وصمته وموافقته الضمنية، بل إنه قلد بعضهم أوسمة الاستحقا<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
