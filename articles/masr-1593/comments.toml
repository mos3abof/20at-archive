[[comments]]
order = 18
subject = "اية الهلس دة"
author = "أخر العقلاء"
posted = "2007-02-16"
text = "اذا كان المتكلم مجنون فالمستمع عاقل<br />اية الهلس اللي بيتقال بيتشاع جة<br />رغم اني مش مؤيد لتوريث جمال مبارك بس يا جماعه اللي عندة نقد موضوعي ينتقدة<br />بس ان الموضوع يصبح كلام هبل و جنان وخلاص لا<br />يعني اية سوزان يهودية انجليزية<br />ازاي يعني يهودية و انجليزية و هي في الاساس مصرية من عائلة مصرية و في الاساس زوجة لضابط مصري من خمسين سنة وزيادة<br />من امتى بيسمح للضباط الزواج باجنبية او من اصول اجنبية<br />اي طفل يعلم جيدا ان اي ضابط عادي غير مسموح لو في الاصل ان يتزوج باجنبية او من اصل اجنبي فما بالك بيهودية<br />ومش اي ضابط احنا بنتكلم عن طيار مصري في الستينيات من القرن الماضي و اصبح مدير للمدرسة الجوية ثم قائد للقوات الجوية فنائب رئيس جمهورية فرئيس جمهورية<br />هما يعني قيادات البلد نايمين على ودانهم من ستين سنة وانتوا يا شعب عبقري اللي اكتشفتوا دلوقتي بس ان الست سوزان يهودية انجليزية<br />والمخابرات المصرية من الخمسينات والستينات كانت نايمة وهبلة وسايبة واحد مصري متجوز يهودية انجليزية يبقى طيار و مدير المدرسة الجوية .... ازاي يا بشر<br />انا حكاية ان جمال شاذ.... فلا تعليق....دة كلام برضة.... انتوا خلاص مش لاقيين حاجة تلطوه بيها غير التشنيع الوسخ وترجعوا تقولوا ان الحكومة هيه اللي بترمي التهم جزافا على ايمن نور و طلعت السادات و حسام ابو الفتوح<br />وللا انتم برضة اللي مش لاقيين حاجة اوسخ ولا اكثر دنائة الا انكم تقولوا ان جمال مبارك شاذ<br />وعرفتم منين يا بشر<br />حد فيكم كان بيشوز معاه ولا شفتم جمال تحت الكباري بيشم كلة و ينام مع الشواذ<br />هههههههه جمال مبارك عندة سرطان<br />حلوة دي كمان<br />او ماهوة بياكل اغذية مسرطنة وبيشرب مياة ملوثة كمان<br />لو جمال مبارك عندة سرطان فعلا دة يبقى اكبر دليل يخليكم<br />اقرأ بقية التعليق .."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 19
subject = "الاخ اللى فوق"
author = "يشترط فى الضابط ان يكون من ابوين وجدين مصريين"
posted = "2007-02-16"
text = "ولكن بالنسبة للزوجة للعسكريين ممكن تكون اجنبية بس يحصل على تصريح مسبق من الجيش او مخابرات الجيش المهم بتصريح وايا تكن جنسيتها مش مهم<br />واحيانا تلعب الواسطة لعبها<br />هذا كلام عام للايضاح ولا اقصد بة شيئا معينا"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 20
subject = "الى الاخ اخر العقلاء"
author = "ممتاز يا اخي ممتاز يا اخي"
posted = "2007-02-16"
text = "اصل الشعب المصري كله دلوقتي بيضرب بانجو<br />ستات ورجاله خلاص ما بقاش دريان هو بيقول ايه<br />احسن ناس بتربي ولادها في مصر هما العسكريين<br />وجمال مبارك اتربى في بيت واحد عسكري اللي هو حسني مبارك<br />يعني متربي على الضبط والربط والرجوله والشهامه.<br />وبعدين يا اخي كل حاكم بيستخلص الحاكم اللي وراه منذ قديم الازل<br />وحسني مبارك حر في اختيار خليفته سواء كان جمال او اي حد تاني<br />هكذا الامور استقرت عندنا في البلاد العربية<br />واهو بشار الاسد مسك مكان ابوه<br />والملك عبدالله مسك مكان ابوه<br />ايه اللي جرا بس عايز افهم"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 21
subject = "تحليل الحرام"
author = "الاخ اللى بيتكلم عن بشار الاسد"
posted = "2007-02-16"
text = "بشار وداهم فى ستين داهية ومش لاقيين ياكلوا ومنتظرين الغزو الامريكى فى اى لحظة<br />والملك حسين ورث ابنة علشان ملكية هاشمية يعنى من ولاد النبى<br />وبتاع المغرب الدولة ملكية فاطمية علوية ومن بتوع ال البيت برضة<br />انما احنا دولة جمهورية<br />عايزين تقلبوها ملكية يبقى الملك بتاعنا احمد فؤاد<br />مش عايزين جهل<br />ابن عسكرى اية وابن مش عارف اية<br />بطلوا جهل"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 22
subject = "لا يجوز"
author = "أخر العقلاء تاني"
posted = "2007-02-17"
text = "الاخ اللي عقب اتة يجوز للعسكريين الزواج من اجنبية بشرط ان يأخذ موافقة القيادة العسكرية والمخابرات<br />كلامك صحيح نبيا في الوقت الحالي<br />ولكن يتم احالة الضابط الذي يتزوج من اجنبية للتقاعد او يستقيل لان المخابرات ترفض هذا<br />وهذا بالنسبة لآن ولكن في وقت السيتينيات كان بالطبع امر مرفوض تماما<br />وللعلم انا والدي ضابط طيار تخرج من الكلية الجوية في الستينات كذلك<br />وللعلم ان حتى ابناء الضباط اذا تزوجوا من اجنبية تلغى عضوياتهم من الاندية العسكرية وه"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 23
subject = "عمليات مغطاة"
author = "أخر العقلاء"
posted = "2007-02-17"
text = "وللعلم انة في اغلب الحالات التي تزوج فيها ضابط مصري من اجنبية خلال فترة الستينات والسبعينات كانت عمليات مخابراتية من اجل تعمد تسريب معلومات عسكرية مضللة او لجمع معلومات من خلال تلك الزوجه الاجنبية والتي كانت في معظم الحالات دسيسة على الضابط من اجل جمع معلومات من خلال هذا الزواج<br />انا لازلت فعلا اضحك متعجبا ممن يشيعون ان السيدة سوزان لملوم يهودية انجليزية<br />اعتقد ان مرجع تلك الاشعه ما اشيع على الملك عبد اللة بن الحسين عاهل الاردن ان امة انجليزية وذلك امر واقع<br />ولكن تحور الحديث ليطول ان الوضع عندنا في مصر بالمثل<br />او ان احا ما استمع لتلك المعلومة ولم يتبين من المقصود بها وظن ان المقصود بها رئيس جمهوريتنا وليس ملك الاردن<br />ولربما كان محشش او ضارب سمسون بانجو انطلق يحكي مع جماعه من زملاءة الحشاشين حتى انتشرت الشائعه<br />فعلا شيء مضحك برغم سفاهته"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

