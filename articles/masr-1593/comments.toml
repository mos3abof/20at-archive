[[comments]]
order = 36
subject = "الرئيس مبارك في سطور"
author = "الرئيس مبارك في سطور"
posted = "2007-02-18"
text = "ولد الرئيس محمد حسني مبارك في قرية كفر مصيلحه محافظة المنوفية، بمنطقة الدلتا بقلب مصر، في 4 مايو 1928.<br />وفي عام 1950، التحق بالكلية الجوية حيث حصل على درجة البكالوريوس في العلوم الجوية.<br />وتدرج بعد ذلك في عدد من المناصب القيادية في القوات الجوية المصرية: كطيار، ثم مدرس، فقائد تشكيلات، فقائد لقاعدة جوية، وتلقى دراسات عليا بأكاديمية \"فرونز\" العسكرية في الاتحاد السوفيتي.<br />وقد تميز الرئيس مبارك طوال فترة عمله بالقوات الجوية بالانضباط والتميز، وهو ما أهله لأن يعين في عام 1964 قائداً لإحدى القواعد الجوية غرب القاهرة، ليكون أصغر طيار يقود قاعدة جوية.<br />وفى عام 1967 عُين مديراً للكلية الجوية، ثم رئيساً لأركان حرب القوات الجوية المصرية. وهو المنصب الذي ظل يشغله حتى تم تعيينه قائداً للقوات الجوية عام 1972. وخلال هذه الفترة، تمكن من إعداد كوادر جوية مقاتلة خاضت معركة أكتوبر 1973 وكان الرئيس مبارك صاحب خطة الضربة الجوية الأولى.<br />عقب حرب أكتوبر 1973، رقي لمنصب فريق جوى. وفى عام 1975، اختاره الرئيس السادات نائبا لرئيس الجمهورية، ثم عُين نائباً لرئيس الحزب الوطني الديمقراطي عام 1978.<br />وفي عام 1981، انتخب مبارك رئيساً لجمهورية مصر العربية، ورئيساً للحزب الوطني الديمقراطي. وأعيد انتخابه كرئيس للجمهوريـة في أعوام 1987، 1993، و1999 لثلاث فترات متتالية.<br />وعندما تولى الرئاسة، كانت مصر تمر بظروف داخلية وإقليمية صعبة. فقد كانت محاصرة بقطيعة عربية وضغوط دولية وأزمات اقتصادية.<br />ومنذ بداية توليه مهامه كرئيس للجمهورية، اتبع الرئيس مبارك سياسة خارجية تقوم على توطيد علاقات مصر مع غالبية دول العالم وهو الأمر الذي خلق توافقاً في الرؤى فيما يتعلق بالعديد من القضايا الدولية، وكان<br />اقرأ بقية التعليق .."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 37
subject = "فساد عائلة مبارك فى سطور"
author = "تقرير عن الفساد في \"مصر المحروسة\""
posted = "2007-02-18"
text = "(نتحدى أى مسؤل أن يستطيع انكار أى من الحقائق المذكورة هنا)<br />1- فساد نجلى رئيس الجمهورية<br />يشارك كل من علاء و جمال مبارك على سبيل الرشوة و البلطجة بحصص مجانية تبلغ 50 بالمائة فى رأس مال كبرى الشركات التجارية و الصناعية بمصر و كان من نتيجة فرض هذة النسبة المرتفعة جدا على هذة الشركات دون دفع مليما واحدا أن هذة الشركات أصبح يتهددها خطر الافلاس و الانهيار وقد تم طرد نسبة كبيرة من العاملين بها مما أسهم فى زيادة نسبة البطالة و ارتفاع معدلات الكساد. و مما زاد الطين بلة أن جمال و علاء يفلسان و يطفشان من السوق من لا يدفع لهما و يستمر يعمل فى السوق \"بكل بجاحة\" و كمان ينافس الشركات التى تعطى لهما حصة مجانية برأس المال مما أدى الى خروج الألاف من المستثمرين و رجال الأعمال الشرفاء الجادين من السوق و نتج عن ذلك توقف الإنتاج فى معظم الوحدات الإقتصادية بالبلاد و طرد العاملين بها مما أوصلنا الى الحالة الراهنة من البطالة الشاملة و هى نموذج لحالة إقتصادية إجتماعية سيئة لم يعرف العالم مثيلا لها منذ أزمة الكساد العالمى فى نهاية العشرينات من القرن الماضى. و بالرغم أن جمال و علاء شركاء ببلاش يعنى مش دافعين حاجة الا أنهما بسبب جشعهما لا يرحمان شركاءهما و لا يقدران ظروف الكساد التى تعصف بكل من فى السوق و يرفضان سماع أعذار و حجج فلا بديل عن دفع نصيبهما البالغ 50% و مش مشكلتهما إذا كان شركاءهما خسرانين و لا كسبانين. و من الشركات التى يشارك فيها جمال و علاء بنسبة 50% بالمجان هى: مارلبورو و مترو و هيرميس و ماكدونلدز (منصور)، سكودا (شفيق جبر) ، حديد العز (أحمد عز) ، دريم لاند( أحمد بهجت) ، اية أر تى (صالح كامل) ، فرست (كامل والخولى) ، موفينبيك ( حسين سالم) ، التجارى (ال<br />اقرأ بقية التعليق .."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 38
subject = "هذا مؤكد"
author = "فعلاً سوزان مبارك إنجليزية من أصول يهودية وطبعاً كلنا عارفين قصة العيلة الكريمة بتاعتها وإن أمها كانت تمرجية فى مستشفى هناك وطبعاً فيه نقطة مهمة إن الديانة اليهودية تنسب الأولاد لأمهم يعنى المخنث جمال يعتبر يهودى وده يؤكد سر عمالته لليهود هو وأمه"
posted = "2007-02-18"
text = "حكاية إن علاء عقل ده كذبة كبيرة قوى وخاصة بعد لما ظهر فى نهائى كأس أفريقيا ومراته ولا كانت متحجبه ولا نيله وكانت لابسه بنطلون جينز معرفش كانت لابساه إزاى ومسيبة شعرها بس هما بيقولوا حكاية إنه ربنا هداه علشان ينفوا فساده<br />لو كان ربنا هداه كان رجع كل الفلوس إللى نهبها من مصر وطبعاً رد المظالم أول شيء لقبول التوبة<br />أنا لا يهمنى إنه يكون مهدى ولا مش مهدى ولا يهمنى إن أخوه يكون شاذ ولا مدمن ولا إن أمه يكون يهودية ولا غيره أنا إللى يهمنى هو الفساد إللى إحنا بنجنية من وجودهم فى الحكم وده من غير شرعية أولاً لإن مبارك مزور الإنتخابات وثانياً لإن الدستور لم يعطيهم حق التدخل فى شئون الحكم وده يبقى إخلال بمهام مبارك يعنى لا يصلح للحكم<br />ربنا يريحنا منهم كلهم ويحكم مصر من يخاف على شعبها اللهم آمين"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 39
subject = "إيه العبط ده"
author = "إللى كاتبه السيرة الذاتية لمبارك كاتبه تاريخ ميلاده غلط على فكرة مبارك من مواليد 1924 وبعدين هو دلوقتى عنده 83 سنة يعنى ولا بحل ولا بيربط وياريت تخلى الموضوع ده علشان تنشريه فى حفلة تأبينه قريباً اللهم آمين يارب"
posted = "2007-02-18"
text = "شوفى لو عايزة تعملى شعبيه ليه فالشعب كله طهقان من قرفكم وسرقتكم<br />الشعبية الوحيدة اللى الشعب ممكن يتقبلها منكم هى إنكم ترجعوا للشعب ملياراته إللى تهبتهوا وتسيبوا مصر وتغوروا فى داهية<br />وده مش ها يمنع الشعب إنه برضوا يحاكمكم على مافعلتوه فى مصر من نهب وسرقة وبيع المصانع والبطالة والعمالة الله يخرب بيتكم يارب ومتوعوا تتهنوا على إللى سرقتوه قولوا آمين"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

