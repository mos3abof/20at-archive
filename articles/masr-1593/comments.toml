[[comments]]
order = 0
subject = "جمال بتاع العيال"
author = "كوكوكوكوكو"
posted = "2007-02-14"
text = "زيارة جمال السرية لأمريكا<br />أرجوا أن<br />ينال الإعجاب هذا المشهد الذى على مايبدو أنه<br />يدور الأن مع<br />تحياتى.......:<br />مشهد خارجي ... ظلام دامس .... أنوار خافتة مُحيطة<br />بالبيت الأسود ..<br />الفجر بيشقشق .... أصوات خبط ورزع على<br />البوابة الخارجية للبيت الأبيض :<br />لورا : يا<br />ساتر يارب .. ده مين السمج اللي بيخبط<br />علينا<br />الساعة دي ؟<br />إصحي يا بوشي شوف في إيه<br />بوش يهب منزعجاً : إيه .. في إيه ؟ أسامه رجع تاني<br />؟<br />البرج ... إوعى<br />البُرج .... ناولوني الشبشب ... إستخبي يا<br />ديك<br />لورا : برج<br />إيه يا راجل ما راح واللي كان كان .. ده<br />باب<br />البيت البراني<br />بيخبط قوم شوف مين<br />بوش : أقوم إزاي وأنا بالبيجاما ... قومي إنتي<br />يمكن<br />ماحدش غريب<br />لورا :<br />مين .. مين اللي بيخبط ؟<br />جيمي : أنا جمال يا<br />طنط<br />لورا :<br />جمال مين ؟<br />جيمي : جمال إبن<br />مبارك<br />لورا :<br />إبن سوزان ؟<br />جيمي : أيوه يا طنط إفتحي أنا أفأفت من البرد<br />لورا : خير<br />يا جمال .. ماما جرا لها حاجة ؟<br />جيمي : لأ .. ماما بخير والحمد لله ولسه ضاربة<br />مكتبتين<br />الإسبوع<br />اللي فات<br />لورا<br />: إوعى تكون إتخانقت مع خديجة . حاكم أنا<br />عارفها<br />هاتعمل<br />عليها ماري منيب ؟<br />جيمي : يا طنط مافيش حاجة ... أرحمي أهلي ودخليني<br />الأول<br />هاموت من<br />البرد .. وبعد كده إن شالله تبعتيني<br />جوانتانمو<br />يحققوا<br />معايا .<br />لورا<br />: إدخل يا جمال .. أقعد أتلقح في أوضة المسافرين<br />عبال ما أصحيلك<br />عمك بوش .... فطرت ولا أجيب لك لقمة تشق<br />بها ريقك<br />جيمي : لأ الحمد لله أنا أكلت شاندوتشين سدُق في<br />القطر<br />وأنا جاي<br />... صحي لي أونكل قوام ال<br />اقرأ بقية التعليق .."
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216005255/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 1
subject = "موتوا او انفجروا"
author = "مصرى فى الخليج"
posted = "2007-02-14"
text = "لا تعليق<br />الله يرحم صلاح عبدالصبور<br />لا...لا...لا أملك إلا أن أتكلم<br />يا أهلَ مدينتنا<br />يا أهل مدينتنا<br />هذا قولي<br />انفجروا أو موتوا<br />رعبٌ أكبرُ من هذا سوف يجيء<br />لن ينجيَكم أن تعتصموا منهُ بأعالي جبل الصمت...أو ببطون الغابات<br />لن ينجيَكم أن تختبئوا في حجراتكمو<br />أو تحت وسائدِكم...أو في بالوعات الحمَّامات<br />لن ينجيَكم أن تلتصقوا بالجدران<br />إلى أن يصبح كل منكم ظلا مشبوحا عانقَ ظلا<br />لن ينجيَكم أن ترتدُّوا أطفالا<br />لن ينجيَكم أن تقصر هاماتكمو حتى تلتصقوا بالأرض<br />أو أن تنكمشوا حتى يدخل أحدكمو في سَمِّ الإبرة<br />لن ينجيَكم أن تضعوا أقتعة القِرَدة<br />لن ينجيَكم أن تندمجوا أو تندغموا<br />حتى تتكون من أجسادكمُ المرتعدة<br />كومةُ قاذورات<br />فانفجروا أو موتوا<br />انفجروا أو موتوا"
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216005255/http://masr.20at.com:80/article.php?sid=1593"

