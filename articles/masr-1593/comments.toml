author = "اية دخل اقباط المهجر فى الموضوع ؟"
posted = "2007-02-17"
text = "خليهم فى حالهم<br />لو حكم جمال مبارك اية الجديد ؟<br />احنا البلد وقعت فى حفرة وباعت مصانعها ومزارعها وبقينا على الحميد المجيد<br />عايشين على الاعانات والمساعدات<br />ونصف الشعب عاطل عن العمل والباقى بيتغل فى وظائف هامشية او عايشين على المعاش اللى بياخدوة<br />المشكلة مش مين اللى يحكم<br />المشكلة ازاى نطلع من الورطة والمصيبة اللى احنا فيها<br />10 مليون بنت عانس علشان الصبيان ما بيشتغلوش ولا قادرين يفتحوا بيت ولا يقدروا يجيبوا شقة فى طول عمرهم<br />مين اللى هيحل المشكلة دى يافالح<br />الفقر والجهل والمرض ملا البلد<br />عايز اية تانى"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 29
subject = "الى الاخ اللي فوق"
author = "يا اخي الكلام بين المعلقين اتحول على ان هناك شائعات على السيدة سوزان بتقول انها يهودية بريطانية"
posted = "2007-02-17"
text = "وان جمال مبارك شاذ<br />فكل واحد بيقول رايه بشأن مصدر هذه الاشاعات<br />انا عن تجربتي مع اقباط المهجر متأكد انهم وراء بث هذه الاشاعات على النت<br />انما احنا ما بنتكلمش على الحالة الاقتصادية<br />لان المنطقة كلها مخنوقة اقتصاديا حتى السعودية والخليج"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 30
subject = "المصري"
author = "أخر العقلاء"
posted = "2007-02-17"
text = "معلش سؤالين بس علشان ابقى فاهم وبجد<br />الضباط اللي خدمت معاهم في 73 ضباط احتياط ولا ضباط متخصصين ولا بنتكلم عن قادة كتائب وافرع و اركان حرب<br />وما هي جنسيات زوجاتهم هل هن سوريات او ليبيات مسلمات وللا روسيات مسيحيات<br />ام اسرائيليات او يهوديات من جنسيات اوروبية ؟؟<br />شكرا لتوضيحك"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 31
subject = "هدا هو المهم"
author = "مش مهم سوزان تطلع يهوديه ولا إنجليزية ولا هبابية ولا مهم إن إبنها يطلع شاذ ولا مدمن ولا حقير ومش مهم إن جوزها خنزير ولا غيره المهم هما قدموا إيه لمصر؟؟؟"
posted = "2007-02-17"
text = "هو ده السؤال ماذا قدموا لمصر؟<br />قدموا إغتيال السادات علشان يوصلوا للحكم<br />قدموا تزوير الإنتخابات علشان يضمنوا بقاؤهم فى الحكم<br />قدموا نهب مصر وشوفوا أرصدتهم بقت قد إيه جابوها منين؟<br />قدموا عمالة لليهود والإمريكان على حساب سمعة مصر<br />قدموا بيع مصانع الشعب وطردوا العمال بدل لما يحلوا مشكلة البطالة<br />قدموا إعتقالات لأبناء الشعب محميين بقانون الطوارئ<br />قدموا إعتقالات لأسيادهم من الأخوان المسلمين أصحاب الكفاءات من أساتذة الجامعات فى تخصصات نادرة ومن أطباء ومهندسين وطلبة جامعات<br />قدموا الذل والمرض للمصريين<br />علشان كده إحنا رفضينهم لكن مسألة إنها يهودية ولا إنجليزية فهذه الشعب كله عارف إنها فعلاً إنجليزية من أصول يهودية وإن إبنها مدمن وشاذ ومافيش إختلاف عليها بين أثنين من الشعب وطبعاً هما بينكروا علشان فاكرين أنهم ممكن يورثوا الحكم للمجنون إبنها المريض بجنون العظمة لكن الشعب كله ها يقوله روح شوفلك لعبة إلعب بيها مصر فيها رجالة كفيلين أنهم يحكمهوها ويعيدوها لمجدها إللى مسح مبارك بكرامته الأرض<br />وطبعاً فى الحالة دى لا لمبارك لا لزوجته لا لإبنه نعم لكل الشعب الرافض لمبارك وعائلته"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

