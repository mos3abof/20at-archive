[[comments]]
order = 9
subject = "هو مين ده"
author = "مين إللى قال إن جمال مبارك ينفع يبقى رئيس جمهورية"
posted = "2007-02-15"
text = "أولاً: جمال مبارك بخبرته وكفاءته يا دوبك ينفع يبقى موظف حكومة درجة ثالثة ويقبط 145 جنيه ويشوف ها يعمل بيهم إيه ولا إيه<br />ثانياً: بعد فساد 26 سنة وتزوير الإنتخابات وإنحدار كل الحياة فى مصر أصبح كره الشعب لمبارك وعائلته قاتل وأصبح التغيير هو الحل والوحيد للنهوض بمصر وعلى الأقل عودتها إلى قبل حكم مبارك الفاسد<br />ثالثاً: جمال مبارك نهب مصر ورصيده إللى بالمليارات يشهد على ذلك ولو كان النبى حارثه وصاينه عنده الوصفة السحرية لحل مشاكل مصر طيب ليه محلهاش وهو عامل زى عفريت العلبة بيتنطط فى كل حته وفارض نفسه على حياة المصريين وهو وعيلته سبب معاناة المصريين<br />رابعاً جمال مبارك ليس له أى قبول شعبى لإنه يسير على نفس الدكتاتورية والطغيان الذى يميز أبوه فهو متربى على أيد فرعون مصر الدكتاتور وطبعاً من سار على الدرب وصل<br />خامساً: كيف سيشعر بالشعب من تربى فى قصور الشعب ومن أمواله المنهوبة وعاش فى برج عالى بعيد عن معاناة المصريين من جراء حكم أبوه فهل وقف يوماً فى طابور للعيش أو للحصول على جنيه فول وطعيمة ليأكل هو وأسرته فكيف سيشعر مثله بالشعب الذى يعانى من جراء نهبه وسرقته هو ومن حوله المحميين بيه<br />سادساً: جمال مبارك ليس مصرياً ولكنه إنجليزى الجنسية من أصول يهودية نسبة إلى أمه فمعنى كده إنه ها يبقى ده إحتلال إنجليزى يهودى لمصر وطبعاً ده هو سبب بيع مصر لليهود من أهل أمه<br />سابعاً: الشعب هو صاحب القرار والحكم وهو الذى سيختار من يحكمه مهما إعتقل مبارك وإبنه كفاءات مصر من المعارضة ومن الإخوان المسلمين فالشعب سيحطم المعتقلات ليخرجهم ويتوجهم حكام عليه فهم الأجدر وهم عانوا من فساد مبارك وعائلته<br />يبقى ياريت يعرف بقى ويحس هو معندوش ليه كرامة و<br />اقرأ بقية التعليق .."
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216005255/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 10
subject = "ما ينفعش خالص"
author = "حسنى مبارك جه الحكم بعد لما قتل السادات ولم يرشحه الشعب للرئاسه وزور كل الإنتخابات يعنى مالوش إى شرعية يعنى بقى إيه البجاحه إنه عايز يورث إبنه الحكم ولا هو علشان إتعود على التزوير فاكر إنها سهله زى شكة الدبوس بالظبط"
posted = "2007-02-15"
text = "لو مصر ها ترجع ملكية والحكم ها يتورث فيها يبقى الملك أحمد فؤاد هو الحاكم الفعلى لمصر طبقاً لدستور 23<br />وأنا رأيى إن الإثنين ولا أحبه وياريت يحكمنا عمرو موسى بالإجماع"
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216005255/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 11
subject = "عايزين المعلمين مش عايزين الشواذ"
author = "عايزين الكفاءات هى إللى تحكم مصر مش عايزين الشواذ ولا المدمنين ولا الحرامية"
posted = "2007-02-15"
text = "إتقى الله فى نفسك يا جمال يا مبارك واحد زيك يبتدى يتقرب لربنا وخاصة وإنه مريض بالسرطان كفاية عليك سرقة ها تقابل ربنا إزاى يا فاسد<br />حسبى الله ونعم الوكيل فى مبارك وعائلته كلها<br />نعم لكل كفاءات مصر ولا للفسدة والمدمنين والشواذ"
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216005255/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 12
subject = "بيفكرنى"
author = "شكله فى الصورة بيفكرنى بالقلقاس أنا ما بحبش القلقاس"
posted = "2007-02-15"
text = "لا لجمال مبارك لا لعائلة مبارك كلها نعم لحكم إنتقالى يقيادة القضاء الشريف ثم إنتخابات جديدة بإشراف قضائى كامل ودستور جديد تضعه لجنة متخصصة بمشاركة الشعب<br />لا لمبارك لا لجمال مبارك الغير كفء لحكم مصر لا لسوزان مبارك يهودية الاصل والمله"
archived = "2007-02-16"
