[[comments]]
order = 33
subject = "سوزان فعلا بريطانية ومعي الدليل"
author = "سوزان فعلا بريطانية ومعي الدليل"
posted = "2007-02-17"
text = "سوزان مبارك تحمل الجنسية البريطانية بالتبعية لأمها البريطانيه وهي ماسونية وجدودها فعلا يهود يعيشون في ضاحية ويلز وجمال اسمه البريطاني جيمي وعلاء اسمه البريطاني إيلي ويوجد لهم شهادات ميلاد بريطانيه واللي عايز يتحقق من كده يروح موقع العربي الناصري الذي نشر هذه المستندات قبل عامين .. صور من المستندات البريطانيه .. صور .. يعني مستندات واضحه واللي عنده حد هناك ممن يطلب منه يسأل في لندن عن العيله الوسخه دي<br />الموضوع مش فبركه ولا كلام في الهوا .. اللي قالوا كده نشروا مستندات وذكروا مصدرها كمان في الحكومة البريطانية والمكان اللي ممكن تلاقيها فيه .. عايزين إيه أدله تاني ؟؟؟<br />سوزان ماسونية وجدود أمها يهود وكله موجود في دار المحفوظات البريطانية للي عايز يعرف ويفهم عشان نبطل هبل وعبط بقى<br />تحية للعقلاء فقط"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 34
subject = "الى طبعا طبعا"
author = "اقرأ التعليقات كويس يا اخ طبعا طبعا"
posted = "2007-02-17"
text = "التعليقات بتقول ان اقباط المهجر هما اللي بيطلعوا هذه الاشاعات.<br />وبعدين يا اخونا اليهود والمسيحيين ممكن يدخلوا في الاسلام ايه المشكلة كانت يهودية او مسيحية بس دخلت في الاسلام<br />انتو ما تعرفوش ان كل المهاجرين العرب الى اوروبا الغربية وامريكا بيتجوزوا مسيحيين وبيسلموا هناك في هذه البلاد.<br />وبعدين يا جماعة علاء مبارك ربنا هداه على ايد عمر خالد خلاص وترك كل شيء ومتفرغ للدين"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

