[[comments]]
order = 26
subject = "تعقيب على كلام اخر العقلاء"
author = "اللي بيطلع هذه الاشاعات على حسني مبارك وسوزان مبارك وجمال مبارك هما اقباط المهجر"
posted = "2007-02-17"
text = "لان حسني مبارك مش عايز يلغي المادة التانية من الدستور والتي تنص على ان الدين الاسلامي هو الدين الرسمي للدولة والشريعة الاسلامية هي مصدر التشريع.<br />وعمالين يعملوا مؤتمرات عالمية لتكوين جبهة ضد حسني مبارك لاجباره على الغاء هذه المادة.<br />فارجو من المسلمين عدم الانسياق وراء هذه الاكاذيب وان كان الامر ولا بد ان تؤول السلطة فيما بعد الى جمال مبارك فأنا ارى ان هذا شيء عادي في حياتنا كعرب ومسلمين وضربت مثل ثلاث بلدان عربية الابناء حلوا مكان الاباء<br />سورية والاردن والمغرب"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 27
subject = "تعقيب على كلام اخر العقلاء 2"
author = "وزي ما الاخ اخر العقلاء قال ان حسني مبارك ضابط في الجيش وما كنش عنده واسطه وفلاح واثبتلكم ان السيدة سوزان مبارك مصرية من عائلة مصرية."
posted = "2007-02-17"
text = "اوعا حد يصدق ان جمال مبارك شاذ جنسيا دي اشعة روجها كلام المهجر علشان خاطر يدمروا حسني مبا<br />وانا على حسب تجربتي اشتريك شقة من واحد ضابط في منطقة مخصصة لضباط الجيش وعشت معهم عن قرب واقول ان احسن ناس بتربي اولادها الضباط مستحيل ضابط الجيش ابنه يطلع كده ولا كده.<br />وشكرا لك يا اخر العقلاء فكلامك اثلج صدورنا"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123219/http://masr.20at.com:80/article.php?sid=1593"

