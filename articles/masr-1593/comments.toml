author = "يا عوازل فلفلوا"
posted = "2007-02-15"
text = "نحن معك فى عبور المستقبل<br />نحن الموقعين ادناة الذين يستشعرون مدى الجهد المبذول والايمان الراسخ لدى السيد جمال مبارك فى التغلب على الصعاب والمشاكل التى تواجها مصرنا الحبيبة والشعب المصرى بكل طوائفة واطيافة.نعلن التاييد الكامل والقاطع للسيد جمال مبارك, وايماننا بما يسعى الية من ترسيخ مبادىء الحرية والديمقراطية والاصلاح وتكافوء الفرص بين ابناء البلد الواحد, وعدم قناعتنا بما يحاولة المشككين والمغرضين من تعطيل مسيرتة فى عبورة بنا الى المستقبل كما اننا نؤكد لة ان كل المصريين يدركون مدى المصداقية والشفافية والاخلاص الذى يتمتع بها السيدجمال مبارك, على الرغم من الحملات المنظمة التى يقوم بها المفسدين مستغلين المناخ الديمقراطى التى تنعم بة مصرنا الحبية فى عهد الرئيس محمد حسنى مبارك ونحن اذ نعاهد السيدجمال مبارك على اننا لن نسمح لهؤلاء القلة ببث تلك الافكار الهدامة وسنتصدى لتلك الحملات المنظمة ولن نتجاهلها, ولن نسمح لها بان تشكل عبئا ومساسا بمستقيل البلاد وامنها القومى وبناءا علية فقد عقدنا العزم على اتخاذ مجموعة من الاجراءات الفعلية كالاتى:<br />اولا: دعم المزيد من التوافق الوطنى والاجماع الشعبى تجاة مشروع جمال مبارك للعبور الى المستقبل ثانيا<br />توضيح ما اتخذة السيد جمال مبارك من سياسات ودعم المشاركة الشعبية فى دفعها الى حيز التنفيذ<br />ثالثا: مواجهة الافكار الهدامة والشائعات المغرضة فى كافة وسائل الاعلام والصحافة مثل مواجهة دعاوى التوريث ,بدعاوى التاسيس للمستقبل<br />الموقعين ادناة1-احمد قرة<br />مدير مركز المصداقية للشفافية"
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216005255/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 14
subject = "الي المدعو احمد قرة انت باين عليك تعبان في دماغك"
author = "مصري حقيقي"
posted = "2007-02-15"
text = "اشكالك الوسخة هما القلة الحقيرة المتحكمة في البلد وهم عباره عن قلة منعدمة الضمير خرفان نتنة يقدوها راعي شاذ جنسيا مريض نفسي وهو جمال وابوه العميل مبارك العجوز (رضي بوش عنهما), وانتم دائما ما ترمون في مزبلة التاريخ مثل كل عميل حقير واعوانه العلوج , فانتم لا تتعلمون من التاريخ الذي لا يعطي لاحد الدوام ابدا والعبرة في صدام حسين واعوانه الشرزمة فهل تعتبرون يا خرفان جيمي اسف جمال الشـــــــــــاذ."
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216005255/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 15
subject = "الموقع والمطيباتية"
author = "واحد وافدى"
posted = "2007-02-15"
text = "فية ناس مطيباتية بتقول كلام نفاق علشان سندوتش وحتة بعشرة وحباية زرقة ويدخل الموقع علشان يتكلم كلام خايب عن بعجر اللى ينفع يحكم مصر<br />طيب هنقلبها ملكية يبقى الملك احمد فؤاد موجود وابن الملك احمد فؤاد برضة موجود وقصر ابوة وجدة لسة برضة موجود<br />والملك على الاقل كان بيجيب رئيس الوزارة من الحزب اللى نجح<br />الحزب الوطنى هو حزب ليس شعبى لانة انشأ بقرار حكومى واخذ كل مخلفات الاتحاد الاشتراكى ومقارة"
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216005255/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 16
subject = "هو فيه إيه"
author = "الإخ بتاع يا عوازل فلفلوا ده عمال يتكلم كلام غريب باين عليه لسه قايم من جلسه شذوذ هو راخر أولاً شوف يا بنى:"
posted = "2007-02-15"
text = "إنت بتتكلم عن إن الشاذ جمال بيقود مصر للإصلاح طيب هو مين سبب الفساد غيره وغير أبوه وأمه هو فيه حد حكمنا غيرهم طيب رصيده بقى قد إيه دلوقتى وهو يعرف إنه هو سبب خراب مالطه فى مصر<br />إنت بتتكلم عن تكافؤ الفرص طيب هو جمال زيه زى التوربينى إللى الفقر جعل منه مجرم ولا زيه زى أى موظف غلبان فى البلد ولا زيه زى أى معارض أظن كلامى مفهوم وأكبر شاهد إللى حصل للدكتور أيمن نور والسيد طلعت السادات وخيرة مصر من الإخوان المسلمين طيب لما يعتقلوا أساتذة الجامعة والمهندسين والخبراء ورجال الأعمال من الإخوان يبقى ها ينهضوا بمين ياروح أمك<br />جمال مبارك جاب منين مشاريعة وهى فين الشفافية والهبابية إللى بتقول عليها وهو وقف فى المؤتمر الرابع للحزب الوطنى وبنفس الوقاحة بتاعة أبوه يألف أرقام عن التنمية معناها إننا بقينا رأس برأس مع اليابان والصين ويمكن متفوقين عليها<br />كان ممكن تكون مصر من أول دول العالم فى التنمية لولا مبارك وعيلته إللى جمال واحد أساسى منهم نهبوا إيرادات مصر من قناة السويس والسياحة والبترول والغاز الطبيعى وغيرها كثير<br />فين مصانع مصر وهى ملك للشعب باعها لنفسه ولليهود وإيه مصير العمالة إللى فيها غير الإضرابات علشان يوصلوا لحقوقهم اللى نهبها الله يخرب بيته جمال مبارك يارب<br />فين هو تكافؤ الفرص وهو ليه مبنى فى جامعة القاهرة لجيل المستقبل كام واحد من المعارضة ليهم مبانى جوه الجامعات<br />فين حق المعارضة فى وسائل الإعلام إللى بيدفع ثمنها من قوت الشعب وإللى موراهاش غير التسبيح لمبارك وطبعاً كله بحسابه وإدفع يا مصرى من ضرايبك وقوت عيالك علشان يسمعونا إن مبارك أتصل بالتليفون ولا دخل الحم<br />اقرأ بقية التعليق .."
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216005255/http://masr.20at.com:80/article.php?sid=1593"

