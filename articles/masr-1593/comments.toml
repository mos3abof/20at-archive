author = "مبارك من مواليد سنة 24 وفعلاً هو دلوقتى عمره 83 عاماً هما بيصغروه ليه يمكن شايفينله عروسة صغيرة أحسن من الكركوبة إللى عندها 76 عاماً ومتصابية وعاملة نفسها بنت أمبارح"
