[[comments]]
order = 6
subject = "كلمة الى كل من يعارض جمال مبارك"
author = "واحد من الناس"
posted = "2007-02-15"
text = "كلمة بسيطة الى كل من يعارض جمال مبارك رئيسا لمصر<br />الشعب المصري طول عمره محروم من انتخاب رئيسه او حاكمه منذ بداية التاريخ.<br />جمال عبدالناصر لم يعمل غير حركة قرعه لانه استبدل ولي العهد بنائب رئيس الجمهورية ونائب رئيس الجمهورية اصبح يعينه رئيس الجمهورية ويفرض على الشعب انتخابه كما حصل مع انور السادات وحسني مبارك يعني مفيش انتخاب ولا بطيخ كان فيه استفتاء 99ر99%.<br />تجربة سورية: ابن حافظ الاسد مسك الحكم والبلد ماشية زي ما هيه ما حصلش فيها حاجه.<br />تجربة الاردن: الملك عبدالله ابن الملك حسين مسك مكان ابوه والحمد لله والبلد ماشيه<br />ملك المغرب: ايضا مسك مكان ابوه والبلد ماشية زي الحلاوة والحمد لله.<br />ايه بأه المشكلة لما جمال مبارك يمسك رئيس جمهورية في مصر.<br />وايه الفرق بينه وبين اي واحد تاني ممكن ان يعنيه حسني مبارك نائب رئيس جمهورية.<br />ممكن اعرف وجهة نظركم"
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216005255/http://masr.20at.com:80/article.php?sid=1593"

[[comments]]
order = 7
subject = "هي الصهيونية إسرائيل وبس يا واطي ؟"
author = "إبن بهيه"
posted = "2007-02-15"
text = "الواطي واطي ومن شابه أباه فما ظلم<br />بس يا ترى إيد الوالد اللي في بق الجيش حتفضل ممدوده في بقه على طول عشان يسكت على الجرو الصغنن ولا سنتين وخلاص بح ؟<br />أعتقد ممكن يكون فيه عاقل في الجيش المصري ويفهم الرسالة ...<br />ناس كتير تقولك ياه .. هو احنا هنرجع نجيب من تاني ونبدأ حكم عسكر من أول وجديد ؟<br />طيب وإيه العمل ؟<br />وبعدين العسكر لو محترمين ومخلصين ليه لأ؟<br />المهم ما يكونوش خونه وعملاء وبياعين وطن لكل من هب ودب.<br />المهم الناس تلاقي هدمه ورغيف وبرشامه واربع حيطان تلمهم<br />المهم ولادنا يطلعوا يلاقوا ليهم وطن لسه عايش مش متباع للصهاينه بكل جنسيات العالم ، إيشي صهيوني هندي وإيشي صهيوني كوري وإيشي صهيوني تايواني وإيشي صهيوني أمريكي وأوروبي)<br />((يا ريت نفهم الميزة الاستراتيجية للصهيونية وهي أن سبب تغلغلها في كل جنبات العالم الأربع ونطق أصحابها بكل لغات العالم هو تشتت اليهود في الأرض .. عشان كده فيه صهيوني في كل بلد في الدنيا))<br />وده للأسف اللي بيضحك علينا مبارك الواطي وعصاباته وعايزين يفهمونا إنهم ما بيبيعوش البلد (أراضي ومصانع وشركات) للصهاينه .. هو مين عبيط يا واطي انته وعصاباتك؟<br />هي الصهيونية إسرائيل وبس يا واطي ؟<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216005255/http://masr.20at.com:80/article.php?sid=1593"

