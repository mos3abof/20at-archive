text = "أه طبعا بتابع فتافيت<br />خصوصا لو كنت جعان<br />قناة تحفة بفكرة تحفة<br />بس لو يزودوا نسبة البرامج العربي<br />و برنامج مطبخ جيمي من احسن البرامج<br />اصلاح الشباب الفاسد الضائع المدمن بتعليمه الطبخ كجزء من برنامج علاجي<br />حاجة بجد تحفة<br />يعني يعالج المدمنين و يجيب لهم وظيفة يكسبوا منها<br />قناة متخصصة حلوة قوي و ياريت نشوف قنوات متخصصة كمان و كمان<br />بس ما حاولتش اطبخ بصراحة اي حاجة بشوفها فيها لان المكونات عادة بأسماء غريبة او مش موجوده اصلا في السوق"
