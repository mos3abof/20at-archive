subject = "يارب قارئ رسالتي تهديه إلى الصراط المستقيم يارب"
author = "مــسـلـمة للأبــد"
posted = "2006-10-16"
text = "ليه نحن الشباب والبنات اصبحت إهتماماتنا رخيصة ودنيئة لهذا المستوى لدرجة تقييمنا لأغاني تافهة لاتنفع بل تضر ياويلتنا يوم الحساب نحاسب على توافه الامور في دنيا فانية ونترك الأعمال الصالحة الباقية فكروا بالله عليكم هل انتم سعداء هكذا هل انت مسرورون بحياتكم على المعاصي والتلذذ بها لا والله لو قلتم نعم لا لذة ولا سرور في معصية الخالق سبحان ألم تخجل وتستحي من الله وهو يراك وانت تعصية امامه وعلى ارضه خافوا الله في نفسكم خافوا الله فإنه يراكم وانت على ارضه وتعصونه وهو منعم عليكم توبوا إلى الله لعل اليوم هو آخر ايامك او اخر ساعة في حياتك فمت وانت على طاعة وعلى غير معصية وأكثرو من تذكر هادم اللذات الا وهو الموت واستغفر الله لي ولكم وصلى اللهم وسلم على رسولنا وحبيبنا محمد<br />اتمنى ان لااكون قد ضايقتكم لكن حالكم ضايقني والله يهدي من يشاء والسلام عليكم اخواني في الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133236/http://www.20at.com/article2.php?sid=405"

