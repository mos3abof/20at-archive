text = "هذه الإغنيات تعبر عن الحاله المزاجيه للأنسان فمثلا فيه نـــــــاس تحب اغاني الحب ومنها ممكن تقلب لنكد وبعدين اغاني النكد هى اللي صح ،اغاني الفرح كلها وجع دماغ ورقص وحاجات تزهق والحان مسروقه كمــــان!!؟ أغنية فيروز شادي من اجمل الأغاني واخر ما توقعت انها تصنف من أغاني النكد طيب ليه مفيش حد كتب اغاني عبد الحليم اللي كلها نكد في نكد رغم جمالها مفيش حاجه اسمها اغاني نكد هى اغلبيتها اغاني حب بس من النوع الهادي اللي انتم بتقولوا عليه نكـــــد!!!"
