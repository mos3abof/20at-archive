[[comments]]
order = 0
subject = "ابدعوا"
text = "أنا واحدة من الناس بعشق عروض مسرح الهناجر وأتمنى انكم تستمروا بنفس الحماس لحد مايوصل صوتكم للناس كلها<br />والموضوع حلو جدا وبيثير قضية مهمة"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154955/http://www.20at.com:80/article.php?sid=501"

[[comments]]
order = 1
subject = "وسام كمال"
text = "الموضوع حلو قوى يادسوقى"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154955/http://www.20at.com:80/article.php?sid=501"

[[comments]]
order = 2
subject = "الغريب"
text = "علي فكره ياجماعة الموضوع مش مجرد تمثيل وفن كده الفكره دي تؤكد ان الهجوم علينا احنا الشباب اكثره بيتم عن جهل بطبيعتنا وحياتنا والدليل ان الشباب دول وغيرهم بيقدموا فكر عالى قوي ويكفي ان معظم المظاهرات الأخيره كانت من نبع حماس الشباب<br />علشان كده ياريت جيل العواجيز يرحمنا ويعترف ان جيلنا له الأفضليه ويمتلك القوه عنهم"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154955/http://www.20at.com:80/article.php?sid=501"

[[comments]]
order = 3
subject = "ياه"
text = "لذيذ حلو وماله ياخويا تمثيل تمثيل زي بعضه المهم متكونش العمليه والحركات الوطنيه والشعارات مجرد تمثيليه لحد ما يوصل الشباب للشهره وبعد كده نلاقي مليون سمير غنم وعادل امام ومش بعيد تلاقي روبي كمان"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154955/http://www.20at.com:80/article.php?sid=501"

[[comments]]
order = 4
subject = "الغربه"
text = "انا احد افرد فرقة غربة هنا<br />اخيرا لقينا حد يكتب عنناكلمه لله الجرايد كلها بتجر ورا الست روبي والحاج شعبان ووزارة الثقافه مش فضيه للفن والكلم الفارغ ده...........<br />متشكر جدا لصاحب كلمة ابدعوا وسوف اعتبره امر واجب النفاذ واريت تكوني موجوده في العروض الجايه"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154955/http://www.20at.com:80/article.php?sid=501"

[[comments]]
order = 5
subject = "ايهاب..................................ز"
text = "تمثيل هاهاهاها بزمتك ياكابتن هو ده وقته تمثيل ايه<br />هي الناس لقيا تاكل والنبي ياجدعان ارحمونا شويه مناالأحلأم والشعارات دى علشان الناس اتخنقت"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154955/http://www.20at.com:80/article.php?sid=501"

[[comments]]
order = 6
subject = "من المحرر"
text = "الي السيد الفيلسوف العبقري ايهاب<br />ممكن اعرف حضرتك بتعمل ايه في حياتك اكيد قاعد في البيتمستني الحال ينصلح او مستني البطل الهمام المنقذ علشان يخلص الناس منالظلم والغلا<br />ياعم ايهاب الناس دي بتحاول تقل اللي جواها بطريقه يمكن متعجبش حضرة المناضل العظيم<br />ياريت في يوم تخطف رجلك لحد الهناجر وتتكلم معاهم وبعد كده احكم زي مانت عايز"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154955/http://www.20at.com:80/article.php?sid=501"

[[comments]]
order = 7
subject = "وفقكم الله ... مخرج فقير جدا"
text = "بارك الله لكم في هذه التجربة التي أرجو ان تنتشر وتعمم وقد قمت مع زملاء لي بتجربة مماثلة تحت عنوان كلنا ولاد تسعة"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154955/http://www.20at.com:80/article.php?sid=501"

