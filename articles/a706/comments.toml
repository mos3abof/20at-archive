[[comments]]
order = 1
subject = "الموضوع حلو بس عايز ناس بتفهم"
text = "الموضوع عبارة عن ذكريات رمضان . مش باين اذا كانت في الطفولة ولا ايام شتاء قارس و لا ايه بالظبط.<br />بس الموضوع عبقري. على فكرة أنا عندي إعتقاد ان الأستاذة لمياء بتحب يوسف شاهين . لان الموضوع عامل ذي الافلام بتاعته. ماينفعش تفهمها من اول مرة. و ده لو كان دليل على شيء فهو دليل على إبداع إبتكاري.<br />شكراً<br />هشام حمزة.<br />28/10/2004"
archived = "2004-10-29"
capture_url = "https://web.archive.org/web/20041029163109/http://www.20at.com:80/article.php?sid=706"

[[comments]]
order = 2
subject = "القيصر"
text = "انا عندي اعتقاد ان الاستاذه لمياء بتحب بوجي وطمطم<br />يا جماعه انا مش فاهم حاجه بلمره انا قرئت الموضوع ثلاث مرات ...ده شكله لغز والله<br />وكنجرليشن يا مستر حمزه انك فهمت الموضوع"
archived = "2004-10-29"
capture_url = "https://web.archive.org/web/20041029163109/http://www.20at.com:80/article.php?sid=706"
