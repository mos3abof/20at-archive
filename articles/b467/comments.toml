subject = "يوووووووووووووه"
author = "sweet_princess"
posted = "2006-02-19"
text = "اما صحيح عفريت هي كل العيال دي لما تحب تتشهر تقوم تغني عن الدين والخيبه ان ممكن تلاقي فيهم اللي اصلا مابيركعهاش ومش فاهم اي شئ عن الكلام اللي بيقوله ((بس طلب من اختكم بس ممكن تفهموني هو العفريت دا قال ايه في الاغنيه ))وبعدين يامسلمين معقوله مطرب وعفريت كمان هي ناقصه ((((تلاقيه ما عجبش لجنة التحكيم فقالو يصرفوه بدري ))) اشتاتا اشتوت بعيد بعيد لا تاذينا ولا ناذيك ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142657/http://www.20at.com/article2.php?sid=467"

[[comments]]
order = 1
subject = "طيب سمعتم اغنيه شعبولا"
author = "نيفين"
posted = "2006-02-20"
text = "اللى عايز يعيط و يحس بالدهشششششه يسمع اغنيه شعبان عبد الرحيم اللى عن الاساءه للرسول<br />بيقول فى حته من الاغنيه على الرسول الصادق الامين و ايييييييييييه<br />انا متأكده يا جماعه ان شعبان ساذج و الغلط مش عليه الغلط على الحقير اللى الف و الاحقر اللى لحن و لعتقد ان المؤلف اسلام خليل و الاحقر شركه الانتاج اللى استغلت كل ده<br />الله المستعان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142657/http://www.20at.com/article2.php?sid=467"

