author = "ابحاث اية يا جهلة"
posted = "2009-06-16"
text = "مصر هتعمل ابحاث فى النانو تكنولوجى - لية - وعلشان اية<br />مش نعمل زرار القميص الاول وسوستة البنطلون ورباط الجزمة<br />هى العملية مظاهر والا احنا بنمثل فيلم<br />الناس الغلابة علميا واقتصاديا زى مصر تعمل زى الصين وجنوب افريقيا وماليزيا نشتغل فى حاجة اسمها الهندسة الع[ *** ]ية<br />اية هى الهندسة الع[ *** ]ية<br />يعنى اجيب مروحة هواء مصنوعة فى دولة ما وجيدة واقلدها بالضبط اعمل صورة منها بالكربون وانتجها وابيعها للناس<br />يعنى تقليد المنتج الاجنبى وتصنيعة محليا<br />انما اعمل ابحاث وابدا من الصفر فامامنا عشرة قرون حتى نصل<br />ابداو بالهندسة الع[ *** ]ية<br />وليس بالابحاث"
archived = "2009-06-18"
