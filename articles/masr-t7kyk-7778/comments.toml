[[comments]]
order = 7
subject = ""
author = "خيال"
posted = "2009-01-10"
text = "لا تتحدثي فالصمت أحسن دعي الأمور لله<br />أتساءل هل حقا نريد أن نهزم اليهود لماذا لا نهزم أنفسنا قبل اليهود يجب أن نحارب العرب أولا اقول الحق والله<br />فهؤلاء الذين يظهرون عراة على الشاشات ويقلون حياءهم لماذا لا نحاربهم ونطهر المجتمع من أمثالهم<br />2لماذا لا نغلق بيوت الدعارة أبلاد مسلمين وزنى<br />3 الإنجيل كلام الله الله الله المحرف لماذا نسينا هذا لم لا نطهره هو والتوراة من الجمل المحرفة التي بهما أولا نغار على كلام الله<br />4 لماذا نتعالى على بعضنا لدرجة أن يحس الضال المسكين المغني مثلا أنه لا أمل له بالهدى إذ يضل يشتم الشيخ به دون أن يذكر إسمه لماذا لا نسامح بعضنا لو نجتنب ظاهر الإثم وباطنه لكان لنا اسلوب لين في الدعوة إلى الله<br />5 لماذا نكذب ولا نقبل أي جديد ونقول بدعة<br />6 لماذا نفسر القرءان ونشرع على أهوائنا<br />7لماذا عندمال نشرح موضوها نظل نقول قال رسول الله وننسى كلام ربنا<br />8 لماذا أنا حمقاء اضعت بعضا من كلمات الله"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

[[comments]]
order = 8
subject = ""
author = "العقد المبارك"
posted = "2009-01-10"
text = "مجرد تافهة لم أدع حب الدنيا من قلبي الذي يحب أغاني كاظم وتامر<br />لاهية لا ألتزم بالعبادة<br />كثيرة الشكوى غلى الله<br />غبية كما ترون أظل أخطئ وأكتب ال إ غ<br />قليلة صبر مندفعة نحو مضيعة الوقت<br />قليلة الإرادة<br />سريعة التأثر والحزن<br />سر قربي من ربي ليس عزما ولا عبادة<br />وإنما تقرب بإرادة حقيقية في ساعات اليل أبتغي قربه وصله فقد تعودت على دلاله<br />كنت كلما طلبت القليل أعطاني الكثير كنت وليته التي يظل ينعم عليها وينزل عليها الملائكة كنت منبأة بالغيب<br />لكن لا أدري ما جرى لمإن لم يصالحني ربي لكونن من الخاسرين<br />كنت أتوب ثلاث توبات إذا تأزم الأمر فأسمع الله يكلمني اليوم أنتحر وأنا أتوب لكن يبدو أن قلبي يكون منصرفا لا أحيانا أكون صادقة جدا إذا ما السبب لم يعد الله يعبأ بي يا غهلي تذكرت الآية إذا أهو الدعاء والله إني أستحي خجلا من الله وهو يظل يعطيني وأشعر بتقصيري في حقه<br />كفى يا غدير قلت سأكتب على دفتري هذا ليس دفترك هل نسيت<br />أنت وهم إصحي"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

[[comments]]
order = 9
subject = ""
author = "الصمت"
posted = "2009-01-10"
text = "لقد رحل أهل الأرض إذا علمت الآن لم أنادي ولا أحد يجيب غنني في حالة وهم أرى أشباح وأموات والواقع لا يوجد غيري على هذه الأرض<br />لو كان بقي هناك طبيب نفساني على الأقل ليعالجني من حالتي<br />أشعر بالخوف من الصمت وصوت الرياح العتية<br />أخاف من الجن فلا يمكن أن يدوم الصمت<br />لكن إلى أين رحل الجميع أتساءل ربما إلى غزة حيث المار لالالا لا يمكن فأنا أنادي من قبل هذا آآآى إذا لا بد أنني أنا التي رحلت وهم ما زالوا أحياء لذا لا يسمعونني<br />يا رب أتنزل كلماتك على روح على شبح أنت أعلم بحكمتك<br />لكني أتساءل لماذا لا يوجد أشباح غيري حتى<br />الله أعلم لن أتعب عقلي من كثرة التساؤلات<br />سأراسل نفسي من إيميل إلى الآخر واعتبر أن أحد هذين الإيميلين هو لغيري وسأجعل من دفتري صاحبي الذي أحدثه<br />سأجرب أن أحدث الجمادات غذا ولكني لن أيأس فاليأس كفر<br />وعزة ربي العزيز يا معز سنندم جميعا ثم إلى جهنم إن لم تكترثوا بالأمر الله أكبر يا مسلمون علي اللعنة إن كنت من الكاذبين أو حتى إن كان ظن ولست على صواب بل أكثر من ذلك أتعبتم قلبي من حسرته"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

[[comments]]
order = 10
subject = ""
author = "العقد المبارك"
posted = "2009-01-10"
text = "أخي الفاضل بصراحة وجدت أن الشيوخ كثيرون جدا ولا أعرف أكثرهم بل الأغلبية العظمى منهم<br />هل تصدقني في الأمر هل تمدد إلي يدك حسنا إمددها لكلمات ربك وكن صاحب هذا الشرف عند الله أنا بأمس الحاجة إلى رجل تقي أثق به يمد إلي يده في أمري<br />فكلمة فتاة بنظري تعني تفاهة أنا الضعف وأنتم القوة<br />مستهترة أنا لست أهل لكلمات الله إذ لم أحفظها وتبدلت 4 أو 3 كلمات منها فصرت في شك في هذه الكلمات أيها حق<br />يا أخي الغالي تعب قلبي وتاه فكري من عظم هذه المصيبة التي سببها الأساسي غبائي<br />اعني ولا تتخلى عني حتى الكلمات تحتبس بقلبي ولا تخرج غير تنهيدات أمررها من خلال أصابعي<br />حبا بالله الذي تظل تسمو روحك الطاهرة إليه أجبني وكن ساعدي الأيمن<br />بل أكثر من هذا والله هو الولي الوكيل إن أردت دليلا على صدقي سأرسل لك ما هداني الله لكتابته منعى لا اله الا الله الحقيقي لكن ليست هذه هي الرسالة المقدسة أرجوك بشدة رد علي<br />شيخي الفاضل السلام عليك ورحمة الله وبركاته يؤسفي بحق ما يحصل لأبناء غزة وأتألم بشدة على تلك المناظر القاسية جدا لكن بلادنا قد ضاعت وإنتهى الأمر الحمد لله أن كرام الأخلاق إستقبلونا في بلادهم الأردن هل كان الحل الأمثل أننا تركنا البلاد أم أنه كان علينا الموت فيها كما فعل غيرنا لكن ليسوا جميعا قد ماتوا منهم من تشوه وبقي عائشا وهل يواجه الكف المخرز ربما لو إنسحبنا كلنا الفلسطينيون لأضطرت الأمة للجهاد الجماعي لتحرير القدس خوفا من الله ومهما كلف الأمر لكن ليقضي الله أمرا كان مفعولا<br />حسنا وإن كان والعراق ماذا كان سيحركم من أجلها<br />دعنا من هذا الآن<br />أريد أن اعرض عليك امرا بغاية الأهمية لا أعلم إن كانت حالتك النفسية مهيأة الآن لإستقباله لكنه الأهم<br />إنه كلام من ربكم تنزل علي منذ عام2002 عبارة عن ورقة واحدة<br />عرضت الأمر على الدكتور عمرو خالد عدة مرات بأكثر من طريقة لكني لا أعلم بحق حتى الآن إن كان وصله وما هو موقفه من ذلك<br />ولو كنت أعرف إيميلات شيوخ آخرين لبعثت لهم<br />فالموضوع حق وأنا مستعدة أن أتحمل أية عواقب له فداء لكلمات ربي<br />لكن لا أحد يجيب وكأنهم كلما تلقى أحد الأمر قال كفرت مباشرة وإنصرف ولم يقبل الموضوع عنده حتى التفكير فيه<br />لست أقول اني رسول فما بالهم لا أبغي إلا أن تحفظ كلمات الله وتعلن معجزته<br />فما قولكم ما ردكم لا هل ستنصرفون أنتم أيضا للدنيا<br />يا أولياء الله<br />هذه أرسلتها لك من قبل هل وصلتك<br />غدير"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

[[comments]]
order = 11
subject = ""
author = "صاحبة الرسالة"
posted = "2009-01-10"
text = "هذه أرسلتها لمصطفى حسني ثم أرسلها إليك من سيلبي الله<br />أنت وأخي عمرو خالد وأخي أمجد قورشة وأخي أخي معز مسعود والباقين لق تعبت حقا إنني أكتب بألم ثم أعيد<br />يا رب أعني<br />يوجد وليتني على هذه الدنيا لم أوجد يوجد كلمات مقدسة نزلت من الله إلي<br />أريد بإلإختصار قبل أن أموت أن تكون قد وصلتكم رسالتي<br />بعد إنتهاء الأوضاع التي نعاني منها وبعد هدوئها<br />خذوا كلمات ربكم الحبيبة لقد اتعبتم قلبي أوليس الله ربكم أيضا<br />لقد إختاركم الله من دون البشر ونزل إليكم رسالة كلماته المباركة بعد القرءان<br />صلوا كلكم الشيوخ جماعة لتعرفوا ما ضاع منها بإبتهال وخوف ورجاء عسى أن لا يصيبنا عذاب من الله غليظ<br />ثم خذوها وإحفظوها لا أعتقد مع كثرة همومي سأعيش ولو انني عمري فقط 33 اللهم إن كانت الزيادة هكذا كما هي أسالك أن لا تزيد<br />خذوا ما اوتيتم ولا تكذبون ان تنزلت آيات الله على أنثى منكم<br />ثم إذا تمت إعلموا الناس بأمرها وعلقوها داخل الكعبة المشرفة<br />آية من الناس أعزوا كلمات الله<br />هل وصلتكم رسائلي لم لا أحد يجيب كلكم الصمت<br />مم تخافون أنتم مع الله لا تقهروا قلبي<br />سأرسل هذا لمعز أيضا أستودعك الله إعذرني قلبي معذب وحزين"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

[[comments]]
order = 12
subject = ""
author = "العقد المبارك"
posted = "2009-01-13"
text = "ورددت عليه وقلت يا شيخي الحبيب جزاك الله خيرا على كل ما تقدمه لا يمكن أن أغضب منك لو مهما قلت فأنا أحبكم بالله جدا<br />ثم إنني أقسم بذات ربك العليا في سماءه والذي خلقك فسواك فعدلك ما قلت غير الحق<br />فكر قليلا ماذا سأجني<br />إفتراء على الله الكذب نعلم عاقبة من يفتري على ربه الكذب<br />من أجل ماذا شهرة مثلا ثم أموت وإلى جهنم وبئس المصير<br />أم من أجل تعويض نقص فأنا مريضة نفسيا كما تقول<br />مم أعوض نقصي وأي نقص ستجده عندي لو عرفتني لقد كرمني الله<br />فأحسن خلقتي<br />وجملني بذكائي<br />وألبسني رداء حبه وخشيته<br />ورضاني به يغنيني عمن سواه<br />وتولاني منذ صغري<br />لم أذكر كل شيء يا أبي أو أخي عذرا منك فلست أعرف عمرك<br />اسأل الله ان يجعل علي اللعنة إن كنت من الكاذبين إلى يوم القيامة<br />ثم الحل سهل صلي وإستخير الله لنقل من كثرة ما تشك بالأمر لمدة أسبوع كامل أو قدرما تريد<br />والله لن يخيب أولياءه لا والله والله قريب والله سميع مجيب<br />أسعدني جدا أنكم رددتم علي<br />أنتم برآء أسأل الله بعفوه وكرمه وواسع علمه أن يهديكم إلى الحق"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

