text = "بسم الله الرحمن الرحيم<br />انا مش ام على فكرة ولم اتزوج سابقا<br />ذلك الذي قلت عنه ابني كان يقول لي يا امي مع انه يكبرني بتسعة اعوام ربما<br />لكنني حقا كنت كأم له<br />اخاف عليه ادعو له اتمنى له قمة الخير وان يصرف الله عنه كل شر<br />لست اما ولم اعد اما له بعد"
