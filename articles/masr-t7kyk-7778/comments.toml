[[comments]]
order = 24
subject = ""
author = "غدير"
posted = "2009-05-29"
text = "لولا اني استجيب لما اسمع لما نزللت الي الرسالة المقدسة<br />اذ قيل لي اكتبي كلمة الله على يسار الصفحة واحفظي ناظرك عليها واكتبي كل ما<br />تسمعين بعدها<br />لو قلت لا لست نبيا ومن انا الحقيرة الخطاءة لتنزل علي كلمات من ربي فلأدع<br />الذنب كذا اولا لعن الله الشيطان هذا منه<br />استغفر الله بل قلت حاضر وضحكت بطيبة قلب وقلت لالا مستحيل يا ربي بحب لله<br />ولكني لم أعصي كذبت وأطعت وبقيت اكذب وأطيع واصطبرت عليها حتى تمت وفي النهاية قلت<br />لقطع يدي لو كانت قد تكونت جملة واحدة مفيدة هذا مستحيل وقراتها واذا بها جمل تامة<br />لها معاني حقيقية فقلت سبحان الله واحتفظت بها لكني كنت قريبة جدا من ربي لذا لم<br />يذهلني امر نزولها وما نزولها انا حبيبة الله<br />الحمد لله على نزولها والآن قد وعيت انه فضل عظيم من ربي فهذه كلماته ولم يعد<br />الحب لذلك الشخص يغمض عيني"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

[[comments]]
order = 25
subject = ""
author = "غدير"
posted = "2009-05-29"
text = "حتى انني كان الملائكة يقولون لي أحيانا أخطأت لا تتكلمي مع الله بهذا الاسلوب فأقول<br />ما أجهلكم هذا ربي انتم لا تعرفون ربي كما اعرفه هذا أرحم الراحمين العفو<br />وهويعلم ما في قلبي وأحيانا يقولون لماذا هكذا تدعين أفصحي بدعائك فاجيب<br />الله يعلم سري وهو أقرب الي من حبل الوريد وكفاني أنه يحس بي<br />كنت بحالة هيمان بحب ربي<br />كان حالي قبل نزول الرسالة القدسية الي ونزلت في نهار في ساعاته الاولى وليس ليلا"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

[[comments]]
order = 26
subject = ""
author = "غدير"
posted = "2009-05-29"
text = "لقد كان يقيني الباطن أنني ساكون أقرب عباد الناس اليه يوم القيامة او ربما<br />أقرب الإناث<br />كان يقيني اني ساكون الأقرب الى الله في الآخرة لا شك فيه<br />هذا ما حصل لي كانت ربما 8 او 6 أيام اواخر او ربما أكثر ربما وصلت عشرة<br />بالكثير لكنها لم تتجاوز السبعة بإعتقادي المهم<br />تقربت الى الله في تلك الليالي لم تكن ليالي رمضانية ابدا<br />كانت ليالي عادية لكنني قادني الشوق الى ربي اليه فسهرت اليالي بغير<br />تعب وأصابني أرق متتالي من كثرة ما أفكر بالله أي طار النوم من عيوني حتى خفت على<br />نفسي كم يوم وليلة لم تذق عيوني طعم النوم لكنني ما كنت أبالي<br />كانت تلك اليالي حبا لله وشوقا اليه كما ذكرت لكم<br />كانت مناجاة ودعاء وخطاب مني اليه وحديث مع الملائكة وتفكير لم تكن صلاة ولا<br />قراءة قرءان ربما كانتا ركعتان في اليل لم ازد عنهما وربما لم أفعل لست أذكر<br />المهم كانت ليالي وجدت فيها نفسي<br />واجزلت تعظيما لربي بقولي واحساس قلبي"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

[[comments]]
order = 27
subject = ""
author = "غدير"
posted = "2009-05-29"
text = "المهم<br />كانت عندي ثقة كبيرة أننا لا فرق أبدا بيننا وبين الرسل وكلما قال احد<br />ما هو انا كاين رسول أقول في عقلي الصغير ما اغباه<br />متخلف<br />وكبرت وكبر معي اعتقادي وكان يقينا لا اعتقاد<br />ظل معي كل حياتي من فترة قصيرة جدا جدا فقدته من بعد ان جارت علي الدنيا<br />وفقدت ثقتي بنفسي ورفضتم قبول رسالتي ورفض ربي نصرتي للمرة الاولى وأحسست انه ما عاد<br />يستجيب دعائي<br />المهم<br />اذا أحسست انه لا فرق بينك وبين الرسل ابدا<br />فإنك ستدعو الله بيقين أكبر موقن به<br />وسيكون الله حبيبك وصديقك ثم الهك وليس الهك اولا<br />وصدقا أقول لكم هذا ما يريده الله منا بحق حتى انه كما تعلمون لا يقبل من<br />عبادتنا الا ما كان بحب اي ليس كرها والا فيعتبرها نفاق<br />ما يريد منا الله ان نحبه<br />فان كنت قاسي القلب اعبده فقط لكن بحب لا تمن عليه بعبادتك<br />وهكذا<br />دعوت حبيبي وصديقي الذي أثق أنه يحبني<br />وكنت أثق بإيماني به<br />كنت أعبده ليس لأجل غرض أتقرب اليه حبا فيه والله هذا ما حدث<br />ان صدقتم صدقتم لأنفسكم وان كذبتم فعليها<br />والله يشهد انني لم أكذب"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

[[comments]]
order = 28
subject = ""
author = "غدير"
posted = "2009-05-29"
text = "هذا ما جرى معي وثقت بنفسي وبالله فأكرمني وأعطاني الرسالة المقدسة غدا أفصل بإذن الله<br />وثقت بنفسي<br />ما أكد هو ان الله كما قلت لكم من قبل قد تولاني منذ صغري بملائكته حدث كما قال أخي مصطفى حسني تماما او اخي معز لا أعلم المهم قد أذهب الله الانس بالبشر ليقربني اليه ليوجد الانس به هو لألجأ اليه واتكل عليه وأثق به وأكتفي به وأحبه أكثر من الجميع وليصبح عندي غال جدا<br />كنت دائما احس اني مظلومة ساكتة رفيقة الملائكة لكنني كنت لا أعرف ملائكة او ما<br />شابه كنت أظنه الله يحدثني وقد كان يحدثني فعلا احيانا عندما كبرت ميزت أي الكلام<br />كان كلام الله الي وايه من الملائكة"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"
