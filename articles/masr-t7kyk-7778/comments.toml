text = "لقد كنت انا ايضا اصلي وانا صغيرة الصلوات متتالية في آخر الليل اقضي الاربعة واصلي العشاء لكن المهم ان ترتاح نفسيتي اننني صليت كنت انسى بسبب انشغالي باللعب<br />وكذلك انا التزمت بالصلاة دون تقطيع اي صرت احافظ عليها سنة 97<br />سبحان الله يسعدني اننا متشابان<br />وكذلك كنت اعبد الله حبا فيه<br />الحمد لله ثبتك الله واياي وزادنا هدى<br />آمين"
