subject = ""
author = "صاحبة الرسالة"
posted = "2009-03-22"
text = "رجعتلكم<br />سلامتك ايها الغالي معز يا رب انا ولا انت اللهم آمين ويا رب يعفو عنك<br />من منكم معصوم عن الخطا<br />أنا ايضا خطاءة<br />عندي معجزة<br />كلمات انزلها الله<br />الصفحة نفسها فهمت<br />هوه شريط [ *** ]ت وبضل يعيد<br />اللي الله قدر عليه المفتي انتي لابسك جن<br />جن اللي يلبس اليهود<br />اتقوا الله<br />وناس بقولوا كذابة شو دليلكم<br />ليش كل الشيوخ خايفين من ايش خايفين<br />طب ناقشوني<br />والله انكم مسؤولين امام الله<br />طب اسالوا فطرتكم<br />مش العصيان هو تصرف مخالف للفطرة مجاهدة لها تحميلها عبء لا يعود عليها بنفع<br />ع[ *** ] الفطرة<br />والكفر ستر وتغطية للفطرة اذ ما تكفروا يعني ما تستروا الفطرة<br />اسألوا فطرتكم<br />انتو شو بتعملوا بايميلاتي بتمحوها قبل ما تقدرؤها<br />انا قلت كلام عيب يا معز<br />ليش هيك مشرفين منتداك بحكوا عني<br />واله انت عمرك رديت علي اصلا مين فيكم رد علي مفش غير الدكتور مازن مطبقاني<br />والمفتي<br />طب والعمل<br />انا لو كنت شب كان اختلف الوضع<br />ايميلي holyecho<br />yahoo.com<br />كل ما بكتب مشاركة في منتدى بحذفوها وبعملوا علي حظر طب ليش هو انا بكفر<br />انا مش قايلة عن حالي نبي<br />بآمن بالقرءان وانه الرسول خاتم النبيين مش هاي آية في القرءان<br />وبآمن بالآيهاليوم اتتمت لكم دينكم وبعرف انه الدين تم<br />ليش هو انا قلتلكم اني جيت بأوامر او نواهي<br />شو حجتكم علي اذا<br />انه الوحي نزل علي مش شرط اكون رسول عشان ينزل علي الوحي<br />مش ربنا بنزله على اولياؤه وبخلي الملائكة تتولانا ولا كيف بتولونا اذا<br />قل أحبك كلمات ربنا نزلت في ظرف خاص عذرا لي<br />والله مر كتر الهم مر وقت الحمد ونسيت أحمد ربنا<br />انتو بتعذبوني<br />بس تأكدوا اني مش رح استسلم واذا كان ما عندي حجة عليكم معلش خليني اموت فداء لكلمات ربي<br />لو بدي اكذب بكتبش كلمات عن الحب ولواحد مش ممكن هل أرضى فيه لإني عندي كرامة ولإني مش فضله<br />فليش ما اخترت كلام غير عن هيك<br />لو قال ستميت احبك هلأ بطل ينفع معي ولو يطوبلي الدنيا كلها<br />فكروا يا معز هذا هو الطريق الصح<br />الله يهديكم"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

