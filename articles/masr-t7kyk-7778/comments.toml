order = 17
subject = ""
author = "غدير"
posted = "2009-03-04"
text = "هذه أول مرة أقرأ ما هو مكتوب في الأعلى<br />الحمد لله أولا وقبل كل شيء أنه هداك<br />ثانيا سبحان الله الذي جعل هذه الصفحة فيها قصتك وقصتي ذواتا الحدث الكبير هداك ورسالتي<br />عام 2002 ما هذا التشابه<br />لقد إخترتك إتباعا لفطرتي والله ليس اكثر<br />لكنني أحسنت الإختيار<br />الله يغفر لك ما تقدم من ذنبك ويتوب عليك ويعفو عنك<br />قصة تحولك هذه وبدرجة كبيرة تعبر عن فطرة سليمة وتميز<br />أنت لست مجرد شخص عادي<br />اسأل الله لك الثبات ما شاء الله لا قوة الا بالله<br />بل اسأله لك الزيادة<br />يا رب في الاخرة من المصطفين الأخيار<br />ولأنك رجل نقي الفطرة وعقلاني<br />جعل الله الموضوع ياتي اليك دونا عن الكل<br />وجعل صفحتك هذه تطوي معجزة<br />وباركك<br />أمدد يدك لله الذي مد إليك يده<br />والله ما قلت غير الحق فلا تقلدهم أنت مختلف عنهم<br />أنت مميز لاتسعفني عباراتي<br />فلا تنصر الباطل على الحق<br />إتبع فطرتك مرة اخرى سيهديك الله لتؤمن برسالته<br />أنا غدير يا معز هولي لف"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

