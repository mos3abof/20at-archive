text = "قبل الرسالة المقدسة:<br />كنت على علاقة جميلة بربي<br />اسهر الليالي المتواصلة<br />أدعوه أتقرب إليه أتضرع إليه اناديه اناجيه أحبه بكل ما في<br />دونما إنتظار لمقابل ولا جزاء<br />لأنني أحبه ومن يحب لا ينتظر جزاء من محبوبه على حبه له<br />كنت أثق به يؤيدني وينصرني يحدثني من وراء حجاب<br />أو يوحي إلي عن طريق ملائكته الكرام<br />ينبؤني بالغيب ويكون أي يحدث في كل مرة ما نبأني به<br />أحس بغضبه إذا عضب وبعتبه إذا عتب<br />به أعيش وله<br />النزول:<br />دعوت الله ان يهديني في أفكاري وعقلي وأسلوبي لكلمات إذا كتبتها وأعطيتها لأحدهم أن يتقدم لخطبتي فقد أعطيته الكثير من الرسائل قبلها ولم تنفع<br />كيفية النزول :<br />ألهمني الله أن أكب كلمة الله على يسار الصفحة وأن أحفظ نظري عليها وأكتب كل ما أسمع حتى النهاية<br />أثناء النزول:<br />كنت شاردة الذهن فرحانه بذكريات الحب المؤيد بالملائكة وبتأييد الله لي<br />الكلمات التي كانت تملى علي كانت تقاطع أحلام اليقظة والفرحة تلك ولم أكن موقنة أنها ستتكون جمل لها معنى ظننته إبتلاء لكنني لم أرفض ان أنصاع للأوامر<br />وأثناء كتابتي أحسست بثقل على صدري كبير وبان روحي توشك أن تتصعد في السماء وتضايقت جدا فقلت خلص وما ان نطقت بهذه الجملة حتى أحسست أن شيئا تصعد من أعلى صدري للأعلى وبعدها إرتحت<br />مضمون الرسالة:<br />تتحدث عن موقف جرى بيني وبين ذلك الشاب فيه سوء ظن منه وإتهام موجه نحوي بأنني من الفتيات اللواتي عندهن قابلية على أمور غير لائقة بالأدب نتيجة موقف جرى بيني وبينه سوء تصرف مني بغير وعي<br />بعد ذلك :<br />أردت بعدها ب3 شهور ان أبيض الورقة أو ربما أكثر وفعلت وأنا بنفس الحالة التي بها كتبت الرسالة عندما القيت الي<br />فأضعت كلمة منها صارت موقع يحتمل إحتمالين قلت هذه الكلمة ما جلبها هنا لا أذكر أنها كانت موجودة<br />ووصلت الرسالة لذلك الشخص على ذلك النحو فرح بها لكنه لم يتقدم لخطبتي اظن أنه كان متزوجا عندها<br />لقد كانت كالسحر إذا نظرت إليها يتحول وأنا أحدثه على الهاتف من عدواني الى مسالم جدا وقد أخبرته بذلك<br />ثم اليوم صارت مواضع الشك أربع كل موضع يحتمل كلمتين<br />سحقا لحظي التعيس<br />أنقذوا كلمات ربكم من ضياع أكبر<br />وصرت كلما وضعت على الإحتماليه أحد الإحتمالين في أي موقع ينزل بي عذاب من ربي غليظ<br />هناك كلمة لم أجدها حتى في المعجم اللغوي<br />وباقي الجمل لا أفهم معناها الا قليلا منها أي لا أفهم السياق كله ومنها ما يحتمل عندي أكثر من معنى"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122846/http://20at.com:80/masr/t7kyk/7778.html"

