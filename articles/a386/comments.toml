[[comments]]
order = 1
subject = "علاقات متشابكة"
text = "اليوم الأحد .. 28 يونية حزيران .. قابل الدكتور طنطاوي شيخ الزهر السفير الأمريكي ديفيد وولش .. ولما خرج السفير من اللقاء تحدث عن الانسحاب الاسرائيلي من غزة ودعم أمريكا للدور المصري في موضوع غزة .. هل تعتقد أن هناك علاقة بين غزة والأزهر وأمريكا وتغيير المناهج ودور مصر"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926233535/http://www.20at.com:80/article.php?sid=386"

[[comments]]
