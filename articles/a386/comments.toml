subject = "الغضاريف الجدد"
text = "بيقولك ان الراجل بعد العملية الناجحة..وطبعا لازم تبقي ناجحة..قام ومشي علي رجليه..بعد أقل من 48 ساعة علي عملية الغضروف قام ومشي علي رجليه جديدة دي ياشباب"
archived = "2004-09-26"
