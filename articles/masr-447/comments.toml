[[comments]]
order = 2
subject = "البقاء لله"
author = "ابو شريف"
posted = "2006-06-04"
text = "يريدون منا هذا النعي<br />في حادث مأساوي تم إغتيال الشرف والعفه عن عمر مديد قضتها بين الشباب المصري المتحلي بها ... وقد شارك في حادث القتل والإغتيال كل من : -<br />الفنان الكبير فاروق الفيشاوي والفنانة القديرة سمية الألفي اللذان ومن حبهما للشعب المصري قاما بتأدية رسالتهما الفنية وتناسيا ابنهما الشاب أحمد الذي يتباهي بأنه أقام علاقة غير شرعية (قمة التضحية)<br />الدكتور الحناوي والسيدة عقيلته المسئولان عن تكوين عقلية أجيال من الشباب في الجامعة بدفاعهما المستميت عن ابنتهما التي كانت تبيت خارج منزل الأسرة ولحرصهما علي مصلحة شباب مصر لم يأخذا بالهما من الابنة (قمة إنكار الذات)<br />المطرب العالمي تامر حسني الذي هرب من شرف التأدية العسكرية وقام بتزوير شهاداته العلمية وكل ذلك ليتفرغ للرسالة الفنية وتقديم القيم للشباب (قمة الأخلاق)<br />بعض الشباب المرضي المهووسين الذين استدانوا او كلفوا اهاليهم مبالغ مالية من اجل اعلان التضامن ليس من اجل اطفال فلسطين - فليذهبوا للجحيم - أو من اجل تحرير القدس - للقدس رب يحميه - ولكن من اجل التضامن مع المطرب صاحب الرسالة المقدسة تامر حسني<br />إذا كانوا يريدون من شعب مصر نشر هذا الاعلان فأرجوكم لاتعطوهم الفرصة ولنتمسك جميعا بالأخلاق التي تبكي علي ماوصل اليه حال الشباب فيكي يامصر"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112928/http://masr.20at.com:80/article.php?sid=447&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "آآآآآآآآآآآة ياوطنى"
author = "مصرية"
posted = "2006-06-04"
text = "مسلسل الفساد والأفساد بدأ بافساد الشباب عن طريق الأعلام الهابط المنحل الذى كان يقوده ال (..) صفوت الغير شريف..أنا فى الحقيقة أتعجب من هذه الأسماء لدرجة انى أشك أنها أسماء لزوم المنصب وليست الأسماء الحقيقية..مبارك..الشريف..نظيف..العادلى...شر البلية ما يضحك ..مخطط هذه العصابة ..استهداف الشباب واغراقه فى عالم من التفاهه والهيافه والسطحية وصولا الى الانحلال...بوسائل الأعلام المجندة لتحقيق هذا المخطط...مع طحنه فى ظروف معيشية ودراسية قاسية ومضغوطة حتى لايجد ملاذا للترويح عن نفسه سوى مايقدم له من جرعات يومية من هذا المخطط المنحل..وهذا ما يحدث فى العالم العربى كله ..فكلهم ادوات..وعملاء للوبى اليهودى الأمريكى.الذى انجز مهمته الأولى بنجاح..بتنصيب وتجنيد حكام عملاء. ..والهدف الحالى هو الشباب ..باضعافه وتسطيحه وضياعه..يسهل عليهم مهمة اقتياده..وهنا يأتى دور الآباء ورجال الدين ..فى انقاذ ما يمكن انقاذه ..قبل ان تحل الكارثة ويكون هذا الجيل هم آباء المستقبل..لآاقول ان كل أبناء مصر بهذا المستوى ..ولكن الخطر يكمن فى استمرار هذا التيار القذر...<br />آآآآآآآآآآه ياوطنى ..كم هنت فى عيون السفلة..وكم علت فيك أصوات النباح...أنتم أحقر الكلمات فى قواميس كل لغات الدنيا..لالالالالالالالالالالالا للقرصان وسلالته وعصابته..ونعم..نعم..نعم..لثورة الجيش والشعب على الظلم والفساد"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112928/http://masr.20at.com:80/article.php?sid=447&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "نعيب زماننا والعيب فينا وما لزماننا عيب سوانا"
author = "مهندسة على باب الله"
posted = "2006-06-06"
text = "لم يعد للصمت مكان ولقد حان الوقت ان نقول لا بالفم المليان فى وجه كل خطأ نراه يحدث امامنا وحولنا<br />الى متى الصمت على انتشار الفساد دى تبقى مصيبة ( ايعجبكم كثرة الخبيث من الطيب ) ؟؟؟؟؟؟؟؟<br />الى متى الصمت على المهازل التى تحدث فى التلفاز من ... ( يخجل لسانى عن ذكره ) وكأن الامر طبيعى , والعلاج فى وجهة نظر المسئولين المحترمين غير القناة ؟؟؟؟؟؟<br />الى متى سوف ننكر ذاتيتنا الاسلامية وكأنه عار علينا ان نقول لا هذا حــرام شرعاً وكأننا نخاف من ان يطلقوا علينا لفظ ارهابى ..؟؟؟؟<br />الى متى تاخدنا الدنيا فى وتاخدنا همومها الطالب مطحون فى دراسته والشاب بيدور على شغل والاب والامبيجروا وراء الرزق علشان الاولاد والدروس الخصوصية , ليس هذا عيبا فان كان فى سبيل الله فلهم الاجر بالطبع ولكن لكل منهم لابد وان تظهر كلمة الحق على لسانه طيب ازاى :<br />الطالب يراعى الله ويتقن مذاكرته واذا طلب منه الغش او التغشيش يقول حـــرام من غشنا فليس منا ........<br />الشاب يراعى الله فى عمله ويتق الله حيثما كان وخصوصا فى الاختلاط بالجنس الاخر ويقول لا لن اقوم بعمل علاقة مع فتاة محرمة على كما قال سيدنا يوسف (إنى أخاف الله ) ويتحرى الحلال فى رزقه ....<br />الاب يتحرى الحلال والطيب فى مصادر الرزق وان يكون القدوة الحسنة لابنائه وعلمه ماهو الحلال والحرام والاخلاق ..<br />الام مدرسة اذا اعددتها اعددت شعبا طيب الاخلاق , تراعى الله فى تربيتها للابناء وتكون القدوة للمسلمة لهم ......<br />لا يغير الله مابقوم حتى يغيروا ما بأنفسهم<br />فاليراعى الله كل منا ولا نستحى من اجلاء الحق<br />إن لم تكن للحق أنت فمن يكون ؟؟؟؟؟؟"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112928/http://masr.20at.com:80/article.php?sid=447&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "اللهم لاتوءخذنا بما فعل السفهأمنا"
author = "أبو أسامة"
posted = "2006-06-06"
text = "اللهم لاتوءخذنا بما فعل السفهأ منا هذه<br />دعوة يجب ان يدعوا بهاكل من بقى لديه حيأ<br />او بعض كرامة فقد قل الحيأ وضاعت الكرامة<br />عند بعض الناس لدرجة انهم يتابهون بالزنا<br />وينكرون الزواج وكانه عار ويساندون السفهأ الذين لايقدمون لمجتمعهم الا الفساد والتفاهة .واخيرا اذكركم بقول المصطفى(ًص)<br />(الأيمان بضع وسبعون شعبةو الحيأشعبةمن<br />شعب الأيمان)صدق رسول الله صلى الله عليه وسلم<br />لا.............للتفاهة<br />لا.............للهيافة<br />...........وخلوا عندكم دم وشوفوا الشباب<br />............بيعمل ايه فى المظاهرات"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112928/http://masr.20at.com:80/article.php?sid=447&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "يــــــشــــــــوفـــــــــــه فـــيــــديــــــو أحـســــــــن"
author = "يا ننوس عين امك"
posted = "2006-06-06"
text = "يعنى انا كنت بأدخل الجيش ـ سيبك من المرمطه ـ علشان أحمى الاستاذ توتو وهو نائم فى فراشه الوثير معانقا موزته الاثيره بعد احتساءه شرابه المفضل<br />ولا و كمان يزور و يخرج منها زى الشعره من العجينه<br />يا حلاوه<br />أأأأأأأأأأأأأأأأأأأأأه يـــــــا بـــــــلــــــدى"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112928/http://masr.20at.com:80/article.php?sid=447&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "عاد الإسلام غريبا"
author = "مصري مدحور"
posted = "2006-06-07"
text = "لو أننا مؤمنين حقا بالله ورسوله لطبقنا شرعه, ولو طبقنا الشرع لخشى هذا الفيشاوي من حد الزنا الذي كان سيطبق عليه لأنه أقر بزناه, وهو الجلد مائة جلدة في حالته هذه (لأنه غير متزوج), ولكن ابتعادنا عن الدين حتى تركن حدود الله هو السبب في كل ما يحدث لنا ( ومن يتعد حدود الله فقد ظلم نفسه)وكذلك رأى كثيرون أن الاسلام انتهى فلم لا يظهر دين جديد كالبهائية, فلم تلومونهم؟؟<br />حسبنا الله ونعم الوكيل ولا حول ولا قوة الا بالله وإنا لله وإنا إليه راجعون"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112928/http://masr.20at.com:80/article.php?sid=447&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "اهلا بالضريبه"
author = "mido"
posted = "2006-06-07"
text = "بانسبه للمغنى المذكور فى المقال كل اللى بيحط الاعلانعلى عربيته ولا اللى بيتصل يسأل عليه تبع فريق الضريبه<br />اوعى تسألنى يعنى ايه ضريبه لازعل منك<br />اهى شباب هايفه عاوزه حفله تزنق فيها ولا مصيبه تاخدهم سيبك منهم لان دول مش الرجاله لما بتلاقى واحد خـــ واجه بتشغل بالك بيه ما يولع هو والكومبين بتاعه<br />يعنى الراكب والمركوب<br />المهم نخش على الزانى<br />باعترافه فى البيت بيتك<br />والله لو فيه حد يحكم الناس ديه كان ضربه بالجزمه منتظر ايه من شاب ابوه ارتست وامه الله اعلم<br />وبعدين لما نفتحله المجال يتكلم يبقى الغلط عندنا المفروض ما نعبروش<br />اهى هيصا واحده زانيه وواحد زانى عاملين لينا دوشه يا عم احنا مش لاقين ناكل ارحمونا<br />وبكره نتفرج على تامر افندى وهو خارجمن السجن وملمع وكأنه خارج من فندق وفاتح صدره اصل هو بس اللى عنده شعر ما فيش راجل غيره ما تدقش<br />ربنا يهديه<br />ولسه ياما هانشوف سلام يا شعب"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112928/http://masr.20at.com:80/article.php?sid=447&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "ما بلاش يا عبد الله"
author = "نيفين ..نيفى ..نوفا"
posted = "2006-06-07"
text = "نصيحه بلاش يا عبد الله<br />تامر محبينه قصدى محباته كتير<br />هتواجه حمله من الجنس الناعم<br />و هتلاقى الشتايم جايالك من حيث لا تدرى<br />بالمناسبه برده مبنتفقش 100 ف الميه<br />و للحديث بقيه"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112928/http://masr.20at.com:80/article.php?sid=447&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "سؤال برئ"
author = "احمد نبيل"
posted = "2006-06-07"
text = "الموضوع مالوش علاقة بتامر لكن بمعركة \"الفيشاوي والحناوي \" اسم الله عليه ويا عيني عليه<br />اخوانا الحلوين دول من سنتين ويمكن اكتر بيحكوا عن \"علاقة \" و\"جواز \" وشوية حاجات كدة ف الآخر بتدل على شيئ واحدهو\"الزنا\"<br />ورغم كل الناس اللي عمالة ترغي عمال على بطال - مع أو ضد - محدش فكر ان الكلام ده يدخل يعتبر عدة جرئم ف وقت واحد \"<br />1- تحريض على الفجور<br />2- فعل فاضح<br />3- تسهيل الدعارة (أو التحريض عليها)<br />4- الزنا<br />والتهمة الرابعة أوضح هذه التهم من حيث الدليل والعقوبة<br />فهل ممكن ان حد يعاملهم على الأساس ده ،والا العقوبات الجنائية ف مصر بقت مقصورة على اللي بينادي بالشرعية<br />وصباح \"النور\" لحد ما نوصل ل \"الغد \"<br />لو وصلنا له<br />احمد"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112928/http://masr.20at.com:80/article.php?sid=447&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

