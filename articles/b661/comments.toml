subject = "من المسؤول عما يحث في العراق؟"
author = "إن المسؤول الاول عما يحدث في العراق هو صدام حسين فلولا ظلمه وطغيانه وتجبره ما فتح العراقيون ابواب بلادهم للصلبيين يبتغون منهم الخلاص من ظلم الطاغية صدام."
posted = "2006-04-05"
text = "المسؤول الثاني هم خونة العرب والاسلام(طواغيت العرب) وعلى رأسهم ال سعود وال صباح ، وحسنى مبارك ، وملك الاردن ، فلولا خيانتهم لله وروسوله ( بل حتى لمواثيق ابرموها مع صدام كحال ال سعود) ، لولا موالتهم للاعداء ماتجرأ العدو علينا، ونال من بغداد عاصمة حضارة العرب.<br />والمسؤول بعد هؤلاء نحن الشعوب العربية التى ارتضت لنفسها الذل والمهانة والاستكانة ، فرضيت بامثال هؤلاء الحثالة(طواغيت العرب ) ، أن يكونوا سادة وقادة ، فهذه هي النتيجة ضباع العراق منا -نحن العرب - كما ضاعت فلسطين .<br />الامر بايديكم -يا شباب الاسلام - انتفضوا على الطغاة وأسقطوهم -غير مأسوف عليهم - وأقيموا دولة الحق والعدل التي يتفيأ ظلالها كل مسلم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151840/http://www.20at.com/article2.php?sid=661"
