author = "كداب يا خيشه"
posted = "2009-11-26"
text = "هو اللحمة نزلت صح بس موصلت ل 17 جنيه<br />هي نزلت في اسيوط ووصلت ل 30 جنيه وده عشان في لحوم نازله من القوات المسلحة<br />وعشان قلة الاقبال علي شراء اللحمة كل الناس بتضحي<br />هما صادقين في كلمة 33 بس كدابين في 17<br />وبعدين محافظ اسيوط بيبعت الاخبار دي ازي<br />علي كده المكتب الاعلامي بتاع محافظتنا شغال حلو اوي"
archived = "2009-11-29"
capture_url = "https://web.archive.org/web/20091129013821/http://www.20at.com:80/masr/news/14162--17-.html"
