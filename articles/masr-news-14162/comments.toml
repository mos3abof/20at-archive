text = "اللواء سكرتير المحافظ عبد الرحمن راشد واللواء مدير مكتب المحافظ واللواء المحافظ<br />كلهم لواءات<br />يبقوا كلهم كدابين<br />لان اللحمة عندنا ب 45 جنية"
