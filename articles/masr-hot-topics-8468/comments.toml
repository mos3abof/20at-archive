author = "محمد رضا علي السيد"
posted = "2008-03-12"
text = "الاخ الزميل محمود سعودي قد تفضل بشرح ماوصفته له تماما ولكن مايثير دهشتي هو احنا خيفين نتكلم ليه ولما نتكلم نقول باسلوب ساخر وكفانا بسخرية القدر فلا اعتراض علي القضاء والقدر ولكن الهدف هو السمو بالزات الانسانيه التي كرمها الله عزوجل(ولقد كرمنا بني ادم وحملناهم في البر والبحر ورزقناهم من الطيبات وفضلناهم علي كثير مما خلقنا تفضيلا)فاين تكريم الانسان هل بتركه غريقافي المياه بسبب انتهاءميعاد العمل ام بسبب عجزهم واين التفضيل هل بتركه بعد موته وحيدا في الماء مرشوقا في الطمي فلا حول ولا قوة الابالله وانا لله وانا اليه راجعون"
archived = "2009-11-16"
