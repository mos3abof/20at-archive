[[comments]]
order = 1
subject = "لأنه منير ؟...ممكن يرد علينا"
author = "محمد السيد"
posted = "2006-03-12"
text = "بجد بأحب أسمعه ....<br />وإن كان في الكليبات الأخيرة باستغرب ...<br />طالما الأغنية محترمة ولحنها راقي وكل حاجة تمام .... ليه تخرب ده كله بتصوير .... ملوش لازمة أبدا ؟؟؟<br />نفسي أوجه السؤال ده ليه ولناس تانية .... لكن أهه فرصة ...<br />ياتري ممكن يرد ؟؟؟<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamdmat@hotmail.com"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204720/http://masr.20at.com:80/article.php?sid=13&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "ايه اللي جاب سيرة الإخوان دلوئتي؟"
author = "محمد السيد"
posted = "2006-03-12"
text = "هم الإخوان عمرهم إنهم قالوا إنهم ضد الفن ..<br />أبدا ...<br />الإخوان - وكل الناس المحترمة - ضد الفن الهابط .. الفن الضايع ... الفن اللي ملوش لازمة ...<br />وبعدين يا عشرينات إنتو لازم بعد كده نجيبوا يافطة كبييييييييرة وتكتبوا عليها .......<br />\"والله العظيم ... إحنا مش الموقع الرسمى للإخوان ولا بنعبر عن رأيهم \" و بعدها لينك لأي موقع من مواقع الإخوان .. يمكن الناس تصدق ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />نفسي اغيره .. حد عنده توقيع جديييييييييد؟<br />mohamdmat@hotmail.com"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204720/http://masr.20at.com:80/article.php?sid=13&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "للاستاذ محمد السيد"
author = "طيب يا استاذ محمد السيد"
posted = "2006-03-13"
text = "رغم ان تعليقاتك بتعجبنى لكن التعليق ده مش قوى<br />انا بس عاوزة اعرف فين الفن الراقى اللى فى ليلى ولا مدد يارسول الله<br />دى اغنيه فيها نوع من الشرك والعيازو بالله ( المدد والعون من الله وحده)<br />واعتقد حضرتك عارف كده كويس فياريت تبقى تراجع كلامك كويس<br />بس حلوة حكاية اليافطه دى فكرة برضه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204720/http://masr.20at.com:80/article.php?sid=13&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "لعمل مركب من ورق علي الميه لرخي وسلامي لاحلي وطن"
author = "هوووبه او هبهوب"
posted = "2006-03-14"
text = "فظيعه الاغاني خد بالك من فظيعه دي<br />فكرتوني بحارتنا وعم البلبيسسي ياسلاااام<br />وانا قاعده برغي مع ولاد عمي وخواتي<br />في البلكونه وحرتنا المعفنه , وسما ع<br />الادان , وكبايه الشاي, والله ياجماعه لو<br />قلتلك بكرها قد ايه وبحبها متستغربش يلا<br />يابلد يارب اموت فيكي."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204720/http://masr.20at.com:80/article.php?sid=13&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "سؤال مهم بخصوص منير"
author = "مروة"
posted = "2006-03-26"
text = "شوفوابقى أنا بحب أغانى منير جدا<br />لكن عايزة أسأل كام واحد حضر حفلة لمنير والحفلة لم تكمل لأنه لم يكن فى وعيه؟؟ انا بسأل السؤال ده لآن مهما كان منير رائع و جميل لكن ده بيأثر على حب الجمهور ليه أنا حضرت له حفلة فى مصيف مراقيا و لم يظهر أساسا على المسرح رغم ان الناس جت من أماكن بعيدة لدرجة أن واحد قال أصل أحنا جاييين نسمع سباك ( مع الأحترام للسباكين لآنها مهنة شريفة) لكن ده كان نتيجة متوقعة لعدم أحترام الجمهور الى جه للحفلة"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204720/http://masr.20at.com:80/article.php?sid=13&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 6
subject = "ملاحظة من عابرة سبيل"
author = "whitecat"
posted = "2006-03-30"
text = "عايزة اقول بس للي اعترض على اغنية مدد يا رسول الله ان كلامه صحيح والعون من ربنا بس لكن رغم كده الاغنية دي كان فيها رسالة سلام وتسامح وحب لكل الاديان في وقت كان العالم كله ثائر على المسلمين وبيحاول يوصمنا بلقب \" ارهابين\" وياريت حد يقولي اسم اغنية بتدافع عن الرسالات السماوية وبتدعوا لايقاف سفك الدماء حاليا<br />نقطة تانية بالنسبة لاغنية ليلى اعتقد انها من الاغاني \" العفيفة \" والي هي نادرة اوي في الغزل حاليا ولو عندكو شك في كده افتحوا التلفزيون واتفرجوا على العينات المستنسخة الي بتهز كل حاجة فيها عالشاشة الا اخلاقها.<br />انا بحيي بنت البلد اوي اوي عالكلام الحلو الي قالته في منير الي انا بعشقه وبحترمه شخصيا وياريت كل الناس الصاحية الي في الدنيا تقدر توقل جملة من الي بيسموه \" مسطول\" يقدر يقولها او تقدر تقول \" ليه تسكتي زمن اتكلمي , ليه تدفعي وحدك التمن اتكلمي\"<br />انا اتكلمت اكتر من اللازم ياريت تكون فكرتي وصلت واعتذر على التعليق رغم اني غريبة عنكو ."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204720/http://masr.20at.com:80/article.php?sid=13&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"
