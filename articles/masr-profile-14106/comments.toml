[[comments]]
order = 11
subject = ""
author = "بنتك يا مصر"
posted = "2009-12-13"
text = "اقتباس جزائرى:<br />كشعب جزائرى لا و لن ننسى الكلمات الجارحة التى تصلنا عبر فضائيات العار اعدرنى يا شعب مصر …اسود امام الجزائر …نعاج امام اسرائيل<br />وماذا تسمي صحافتكم ونقيب الصحفيين عندكم الذي سمعناه جميعا يتحدث وعرفنا جميييعا اننا كنا لا نعرف الصحافة الجزائرية كنا وللاسف لا نعرف سوى صحيفة المجاهد ايام الثورة الجزائرية<br />لكن الاهم اخي او اختي<br />اذا كنا نحن نعاج امام اسرائيل فماذا تكونون انتم<br />اخبروني ماذا فعلتم من اجل القضية الفلسطينية<br />كل واحد عمال يكلم بقلب جامد قوي طب انتم عملتوا ايه؟؟؟؟؟؟؟؟؟؟<br />مصر طول عمرها بتساند العرب وبتقف جنبهم واحنا عملنا كتيييييير ومازلنا بنعمل<br />انتوا بقى عملتوا ايييييييييييييي ه؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106181636/http://20at.com:80/masr/profile/14106--19-.html"
