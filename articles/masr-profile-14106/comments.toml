posted = "2009-11-20"
text = "بسم اللة الرحمن الرحيم<br />الحمد للة رب العالمين<br />الرحمن الرحيم<br />مالك يوم الدين<br />اياك نعبد واياك نستعين<br />اهدنا الصراط المستقيم<br />صراط الذين امنوا"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123165043/http://www.20at.com:80/masr/profile/14106--19-.html"

