[[comments]]
order = 0
subject = ""
author = "المطرب محمد فؤاد"
posted = "2009-11-19"
text = "على قناة الحياة اسمع الان<br />ان المطرب محمد فؤاد كان راكب اتوبيس فى السودان والجزائريون حدفوة بالطوب وبيقول للمذيعة - ان سيادة الرئيس محمد مبارك اتصل بة يطمئن علية وبيقول كمان ان الاستاذ علاء اتصل بة وقال لة مش هنام الا ما تدخل بيتك<br />يا سلام<br />امان يا مصر<br />وعمار يا مصر<br />المطرب محمد فؤاد<br />سلامات يا بلادى الف سلام"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123165043/http://www.20at.com:80/masr/profile/14106--19-.html"

[[comments]]
order = 1
subject = ""
author = "واضح جدا"
posted = "2009-11-19"
text = "شتائم الجزائريون للمصريين يجب تحليلها و معرفة مدلولها<br />اهم شتيمة قيلت اننا يهود - هل نحن يهود ام سياستنا ام توجهاتنا ؟ لا ادرى<br />السودان استدعت السفير المصرى للاحتجاج على ما نشرتة الصحف والاعلام بشان تامين المباراة<br />الفيفا نشر انة سيعاقب او يوجة رسالة الى مصر بشان قذف الاتوبيس الجزائرى فى القاهرة واصابة 3 لاعبين جزائريين<br />ظهور السيد علاء مبارك وتصريحاتة للاعلام ضد الجمهور الجزائرى - هو فية تبادل ادوار<br />هل اصبحت مصر هى الاسد العجوز والا الحيطة الواطية فى المنطقة والا اية<br />حاجات كتير الماتش دة وضحها"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123165043/http://www.20at.com:80/masr/profile/14106--19-.html"

[[comments]]
order = 2
subject = ""
author = "افريكانو"
posted = "2009-11-19"
text = "على فكره كلنا زعلنا بس دى لا يمكن تكون نهايه الدنيا بس بجد كان نفسى يصعدوا بس علشان يبقى تكريم للرجاله اللى قدروا يخلوا مصر كلها رجل واحد وبجد فرحان قوى اننا عرفنا بجد ايه الشعوب اللى بتحقد علينا بجد دول شعب اغبيه وكلاب وولاد كلب نسيوا اللى عملناه علشانهم بعد ما فرنسا كسرت عيونهم كلهم واحما اللى رفعنا راسهم ولو انكروا ده يبقوا ولاد كلب وليه يبقوا هما اصلا اوطى شعب الكلاب احسن منهم"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123165043/http://www.20at.com:80/masr/profile/14106--19-.html"

[[comments]]
order = 3
subject = ""
author = "كنزي"
posted = "2009-11-19"
text = "و لله أنا أتأسف لما وقع بين بلدين مسلمين أنا عشت في مصر مدة سنة و الله العظيم حبيت شعب مصر و في الأخير دي كرة بس ما الذي حصل آسفة بالنيابة عن شعب الجزائر"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123165043/http://www.20at.com:80/masr/profile/14106--19-.html"

[[comments]]
order = 4
subject = ""
author = "هرتلة"
posted = "2009-11-19"
text = "نكسة اية ومباراة اية<br />ما خلاص يا ابنى مباراة وعدت<br />استعدوا لمقابلة الجزائر مرة تانية فى دورة افريقيا السنة اللى جاية 2010 وهنشوفكم هتعملوا اية<br />اى كلام بعد انتهاء المباراة يعتبر هرتلة وتخلف عقلى<br />المولد انفض داهية تاخدكم كلكم"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123165043/http://www.20at.com:80/masr/profile/14106--19-.html"

[[comments]]
order = 5
subject = ""
author = "موقعة ام درمان"
posted = "2009-11-20"
text = "فى موقعة ام درمان الشهيرة<br />تصدر المقصورة الرئيسية فى الجانب الجزائرى اثنان من اشقاء الرئيس بوتفليقة على اساس انة لم ينجب صبيان<br />وعلى الجانب المصرى تصدر المقصورة نجلى السيد الرئيس<br />ودارت المعركة<br />فى اشد الدول تقدما مثلا فى المباريات فى اوروبا انجلترا وفرنسا يحدث عقب المباريات شغب وحرائق وقتلى - ولكن تظل الحكومات بعيدا والسياسيون بعيدون<br />اما فى شرقنا المتخلف والمنكوب فلا دساتير تحترم ولا قوانين ولا اى شىء<br />دارت معركة ام درمان بين قادة المقصورتين<br />ليتلهى الناس بالكرة ولينسوا الفساد والنهب والتخلف والجوع والمرض<br />معركة رهيبة"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123165043/http://www.20at.com:80/masr/profile/14106--19-.html"

[[comments]]
order = 6
subject = ""
author = "خطيب الجمعة"
posted = "2009-11-20"
text = "فى مسجد فى الشارع اقيم فية صلاة الجمعة قال الخطيب فى خطبة الجمعة - ان مؤازرة المنتخب القومى ضد الجزائر من كبار رجال الدولة والحزب هو واجب وطنى وقومى وعمل يحبة اللة ورسولة<br />وكانت الخطبة كلها عن كرة القدم وتشجيع الفريق القومى<br />بعد انتهاء صلاة الجمعة<br />اقمت صلاة الظهر<br />ولا حول ولا قوة الا باللة"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123165043/http://www.20at.com:80/masr/profile/14106--19-.html"

[[comments]]
order = 7
subject = ""
author = "نوعية المشجعين"
posted = "2009-11-20"
text = "الحزب الوطنى اختار شوية مشجعين فافى او من علية القوم او من طبقة high class وطبعا النوعية دى مش بتاع تشجيع دى ناس معاها فلوس وعايزة تتفسح وتغير جو وترجع بالكاس وتتصور فى التليفزيون ويضربوا كم بق كلام للتليفزيون<br />انما لو ارسلوا اولاد الاحياء الشعبية كانوا عرفوا يشجعوا ويردوا الاعتداء ويدافعوا عن نفسهم ولكن المصيبة ان الفقير فى البلد دى ليس لة حق<br />وطبعا الوطنى اختار الناس بتوعة من علية القوم ورجعوا مضروبين يعيطوا - طيب بتعيط لية يا روح امك زى ما ضربك اضربة وزى ما حدفك بالطوبة احدفة بالطوبة انما شوية مطربين هلافيت بيقولوا ان الجزائريون اشتروا مطاوى وسكاكين طيب لماذا لم تشتروا مطاوى وسكاكين زيهم<br />انا اعرف ان اللى يشتكى يبقى حرمة وزى الست انما الرجل بياخد حقة بايدة وفى نفس المكان والوقت<br />وعيطوا فى التليفزيونات زى النسوان"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123165043/http://www.20at.com:80/masr/profile/14106--19-.html"

[[comments]]
