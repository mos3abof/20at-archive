text = "اقدم خالص الشكرللاستاذشيكو اللىكتب ان اهم حاجةان (فلافيو)يلعب كويس فى كاس العالم عشان نبيعه بمليون (رغم انى شايفةانه كفاية عليه النص قوى وربنا يعوض فى الخسارة اللى حيسرها الاهلى)اصل فلافيو جاب جووووووووووووووووووووووووون لانجولا فى كاس العالم وتعادل لها براسه الفضية اللى انا مش عارفة هو بيلمعها بايه"
