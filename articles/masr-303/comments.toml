subject = "خفه الدم والكوره"
author = "طارق حسن"
posted = "2006-05-11"
text = "هل هناك علاقه بين خفه الدم والكوره<br />سؤال طرح نفسه عليا بعد ما قرات مقالك وبعد ما بطلت اشترى جريده الجمهوريه بسبب محمود معروف وجمال هليل<br />اتمنى ان كل شخص قبل ما يكتب فى حاجه ان يكون فاهم ومش اى فاهم علشان يصل لمرحله النقد<br />ارى ان هذا المقال يحسب عليك وليس لك بالمره واسال اهل الذكر<br />لان واضح ان كل معلوماتك فى الكورة مصدرها جرايد او الاستماع لمحليلى التليفزيون اللى بيرددوا كلام ماحد معين فيهم معتبرينه الدكتور"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520100622/http://masr.20at.com:80/article.php?sid=303"

[[comments]]
