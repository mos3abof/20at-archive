subject = "لا يا راجل !"
author = "أنا بتفق مع الأخ طارق حسن ....."
posted = "2006-05-12"
text = "و بذمتك يا شيخ جيلبرتو لاعب عادى ؟!! و مين قالك انه لم يتألق امام كل الفرق فى دورى أبطال أفريقيا و تصفيات كأس العالم الى أنجولا تفوقت فيها على نيجيريا !! بقى جيلبرتو لاعب عادى ؟؟<br />و بعدين ما انتا حكمت على انطوان بل و ايموانيل و فيلكس و غيرهم من مواجههتهم للاعبون المصريين ...اشمعنى عنى سحبتها من جيلبرتو ..."
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520100622/http://masr.20at.com:80/article.php?sid=303"

[[comments]]
order = 4
subject = "70 مليون ناقد رياضي"
author = "لا حول و لا قوة الا بالله"
posted = "2006-05-12"
text = "يا اخ رغم خفة دمك و رغم اني ضحكت و رغم ان معلوماتك الكروية مشوشة للغاية \"يعني مثلا تشيرنو مانساري انتقل من القناة للاهلي للاتحاد و لم ينتقل للاتحاد من القناة كما كتبت\" بس كل ده كوم و موضوع المهارة ده كوم تاني<br />فلافيو لو سعادتك كنت تابعت البطولة الافريقية الاخيرة كان هداف انجولا تصدق بقي؟<br />برضه سيبك من الكلام ده ما احمد حسن هداف مصر و مش بيجيب جون في تركيا الا كل كام شهر<br />انما فلافيو فعلا مهاريه الفنية عالية جدا انما العيب فينا احنا!!<br />لو تفتكر الاهلي جاب لاعب السنة اللي فاتت كان اسمه كاستليو كولومبي الواد ده لما تحدثت مع اصدقاء لي هنا \"عشان انا خارج مصر\" من كولومبيا اتصدموا انه احترف في مصر<br />الواد ده انتهي بسبب انه ضيع ضربتي جزاء!! علاقته بالجماهير امثالك اللي بتكتب في الكورة عشان فاكرة انها فاهمة كورة انتهت بسبب مباراة؟ تعالي بقي نرجع للكابتن كوليبالي ... الواد ده عمل كام ماتش في الاول خرافة تقولش رشيدي ياكيني ولا دانيال اموكاشي و بعدين ساق العوج زي عمك جونيور و بعدين رجع علي ماتش اهلي و زمالك جاب جون و اتعوج الخ الخ<br />احمد فيلكس برضه قعد سنة مطلع عين ابو الاهلوية و بعد كده بقي نجم شباك؟<br />و بعدين انت عاوز ايه من جلبيرتو طالما \"رغم انه كتيان في نظرك\" الا انه عمر ما باك يمين في اي نادي بهدلة محليا او افريقيا؟ ولا نجيب لسيادتك روبرتو كارلوس مثالا؟<br />يا ريت النقد يكون موضوعي بصرف النظر عن كل الظرف اللي في المقال... اما الاخوة الاهلوية فسؤالي لو فلافيو مثلا جاب جون يوم الاحد ان شاء الله حيكون برضه موقفكم نفسه؟"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520100622/http://masr.20at.com:80/article.php?sid=303"

