text = "من الجميل ان يعبر النسان عن رايه ولكن الاجمل ان يكون مدعوم بالحقيقه ورغم ان الاعب لم يحرز سوى هدف بالصدفه الا انه لعيب جدير بالاحترام وانه تالق مع منتخب بلاده فى كاس الامم الافريقيه واختير احسن لاعب فى الدور الاول ليس على سيبل الصدفه بل لانه لاعب مجتهد فى الملعب وليس من المفروض ان يكون الفريق فيه 11هداف وانه صنع العديد من الاهداف الى لاعبين اخرين اما بالنسبه عن المحترفين فتاريخ الكوره زاخر واقرء تاريخ النادى الاهلى وانت تعرفعلى سبيل المثال مس الحصر الانجولى جلبيرتو وتشرنو اوخرين واناهم تالقوا ماع الاهلى تالق غير عادى اما بالنسبه لمساله التوفيق من عدمه دى ترجع الى الوقت وفلافيو قادم لا عزاء الى الجماهير الحاقده"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908064941/http://masr.20at.com:80/article.php?sid=303&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

