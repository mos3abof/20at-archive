text = "عارف ليه اللعيبه ديه احنا بس اللي بنلبسها ؟ علشان كل حاجه ليها سمسار والسمسار لازم يطلع بنسبه لكن احنا عندنا كل حاجه ليها هليب والهليب ده لازم يطلع بهبره كبيره وعلى هذا يروح هذا الهليب الى البلاد الجعانه والى الاشحاص الفقراء جدا ويجيبهم لينا على انهم لعيبه وطبعا احنا ناس لقبهاابيض وما بنسالش عن حد فبنشرب المقلب ومع ذلك بننكسف نعترف بكدة فنفضل ندافع عن المقلب للاخر واهو كله على حساب صاحب المخل ياعزيزي فتش عن الهليبه ورا كل صفقه من دول ستجدهم هما هما"
archived = "2006-05-20"
capture_url = "https://web.archive.org/web/20060520100622/http://masr.20at.com:80/article.php?sid=303"

[[comments]]
