subject = "فلافيو يمنع الحسد"
author = "جوده العربي"
posted = "2006-06-26"
text = "اولا جلبيرتو علي رأس افضل المحترفين داخل مصر ولازم تتعرف بكده يابو دم خفيف اما بالنسبه للاخ فلافيو بيلعب كل ماتش اساسي وهو وحش والاهلي بيكسب فين المشكله وبعدين الخواجه جوزيه بينزله عشان يشيل الحسد عن لعيبة ونجوم الاهلي وده احسن مايجيب جوال والله يباركلك يفلافلللللللل"
