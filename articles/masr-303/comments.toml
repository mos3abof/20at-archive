posted = "2006-05-13"
text = "اية الهبل ده ولا معلومات صح ولا اي حاجة مجرد نقد للاعب وخلاص<br />ياريت نكون موضوعين في ارائنا، وبعدين ماتيجي حضرتك تقعد مكان عمك جوزيه احسن وتدرب .<br />وبعدين لما فلافيو لاعب كتيان كان على الاقل تقول ان جليبرتو احسن باك شمال في في مصر لاعب على الاقل جيد .<br />وماتنساش انه بيبهدل الزملكاوبة كل ماتش وفلافيو وجليبرتوالاتنين في منتخب انجولا الل اتاهل لكاس العالم .<br />عارف يعني اية كاس عالم اللي احنا مش عارفين نعتيه بقالنا 16 سنة والسبب اللي مش بيفهموا في الكرة زي حلاتك ..<br />جاتكوا القرف ماليتو البلد"
