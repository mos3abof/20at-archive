[[comments]]
order = 31
subject = "زى غيره"
author = "التعيس"
posted = "2006-06-27"
text = "اهو (الكتيان) ده جاب هدف فى كاس العالم طيب ما احنا داخلين على عشرين سنه اهو ولسه بنغنى على الهدف اليتيم بتاع مجدى عبد الغنى فى هولندا و من ضربه جزاء ، والله فى مهاجمين كتير مصريين اقل ما يقال عنهم انهم مش احسن من فلافيو وانما الناس عاملاهم نجوم و الانديه بتصرف عليهم بهبل."
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908064941/http://masr.20at.com:80/article.php?sid=303&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 32
subject = "آه منك يا كايدهم !!!"
author = "صلاح محمود الضبيلي"
posted = "2006-06-28"
text = "لفت نظري في موقعكم أنه ممكن اي واحد فيكم يكتب في أي شئ وكل شئ ..... ليه وازاي ماعرفش<br />نتكلم زيكم ونقول ازيكم !!!!! وبالله عليكم عايز اعرف بس على أي أساس قيمتم فلافيو ؟ وخللوا بالكم والله ماهو قريبي ولا بيني وبينه معرفة<br />لكن أنا نفسي تقارنوه بعمرو زكي اللي عملتوا له ضجة بكش ومين هو عمرو زكي ده وتاريخه ايه في الكورة ؟ يعني مثلا لعب كام دقيقة في لوكوموتيف ده والا اسمه ايه ؟<br />ياجماعة صدقوني السنة الجايه حتشوفوا فلافيو وايديكم حتتهري من التصفيق له والاعجاب به وبلاش خيابة دوروا لكم على موضوع تاني جاتكم مليون خيبه"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908064941/http://masr.20at.com:80/article.php?sid=303&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

