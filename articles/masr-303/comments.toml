text = "الهدف من اي دوري في العالم تأهيل اللاعبين لكأس العالم فاهمين يا عالم اما اللعيبه بتوعنا دول شويه موظفين لاعلاقه لهم بالكره وكل 4 سنوات ننتظر بنيين تتعادل مع الصومال والحبشه تهزم جزر القمر 15 ـ3 علشان مصر تصعد ومن اجل هذا عارفين احنا متأخرين جدا لايامتشأم احنا اول افريقيا اقولك الاول حتي الخامس في المانيا حاليا"
archived = "2006-09-08"
