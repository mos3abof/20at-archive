subject = ""
author = "مهندس تكييف وتبريد"
posted = "2008-05-31"
text = "سأركز على نقطة فنية ذكرها الاخ وهى استخدام ملفات انابيب النحاس التى لا تعجب الاخ ويريد استبدالها بملفات انابيب استنليس استيل لا تصدا<br />اولا معروف لاى مبتدأ ان النحاس جيد جدا لتوصيل الحرارة بع[ *** ] الاستنليس استيل الغالى الثمن جدا والذى لا يكافأ النحاس فى التبريد وكمان طريقة لحام انابيب النحاس اسهل وادق ومن الصعوبة بمكان لحام انابيب الاستنليس استيل<br />ثم انة فى التصميمات الحديثة تلف انابيب النحاس حول الوعاء الذى بة الماء من الخارج ولا يتعرض اطلاقا للتلامس مع الماء على حسب تخيل الاخ<br />رجاءا لا تنشروا موضوعات فنية قبل مراجعة احد المختصين حتى لا يضحك علينا القاصى والدانى<br />مع شكرى"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620064007/http://www.20at.com:80/masr/t7kyk/9220.html"

[[comments]]
