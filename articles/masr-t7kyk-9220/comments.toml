subject = ""
author = "زيزوس"
posted = "2008-06-01"
text = "الأخ مهندس تكييف وتبريد : حضرتك بس مش بتقرأ كويس …الراجل مجابش سيرة أنابيب ستلنس …<br />كل اللي قاله : كما يحافظ علي صحة الانسان لانه مصنوع من خامة الاستالس ( اللي هو المبرد نفسه ) والمواسير النحاس ملفوفة من الخارج معزولة…<br />يعني محدش قال انابيب استانلس دي خالص …<br />عموماً حتي لو هو مش اختراع فيكفينا ان فيه حد بيهتم لسة بصحة الانسان … والراجل مضربش حد علي ايده يعني وقاله تعالو النبي اشرب من عندي ولا تشربش من عند غيري … هو مجرد قال فكرة وقام بتنفيذها بدون مساعدات او اعانات خارجية .. وهو شيء يستحق التقدير لا الاستهجان او السخرية يا بشمهندس"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620064007/http://www.20at.com:80/masr/t7kyk/9220.html"

