posted = "2008-06-04"
text = "بصراحة انا مش عارف اقول اية انا مش هكتر لانى مش بعرف اكلم كتير بس بصراحة الراجل دة عمل حاجة غريبة جدا دلوقتى كل الناس بتفكر فى نفسها ولكن هو قبل ما يفكر فى نفسة فكر فينا احنا البشر فكر انا مش عارف اساعدة ازاى ولكن انا هحاول بان انشر هذا الموضوع الى بعض اصدقائى ."
