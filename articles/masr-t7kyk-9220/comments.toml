author = "شركة هندسية"
posted = "2008-06-02"
text = "ممكن أعرف لحد امتى الحقد هايفضل فقلوب … عايز اقولك حاجة يا … أخ مهندس ده من وجهت نظرك معملش أختراع وششككت فى كل اللى اتقال مع ان اختراعه بالفعل فى ناس كتير اوى شيفاه انه شئ رائع ، خلينا فيك انت قدرت تعمل ايه ولا كل اللى قدرت تعمله هو النقد بحقد ."
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620064007/http://www.20at.com:80/masr/t7kyk/9220.html"

[[comments]]
order = 3
subject = ""
author = "ناصر قاسم البرد الساحر"
posted = "2008-06-03"
text = "أحب أن أوضح إلى من يهمه أمر أختراع المبرد ورداً على تعليق الأخ المهندس الساخر بالنسبة إلى الأنابيب النحاس أستالس التى آشرت إليها يا أخ أحب أن أعرفك بحكم خبرتى النظرية والعملية أكثر من عشرين عاماً فى المجال قد ورد على جميع أنواع مبردات المياه الموجوده فى مصر وجميعها تعمل بنفس الطريقة التى ذكرتها فى الحوار الصحفى وأن المياه تتعرض بالفعل للتلوث ، وقد تم فى مصر لف الإنابيب النحاس على الخزان من الخارج وقد فشلت هذه التجربة لأن الخزان ينفجر من ضخط المياه بعد فترة قليلة ولهذا لجؤا إلى الخزان المفتوح معدا الذى ذكرته انت يا أخ فى جملة التصميمات الحديثة وهذا المبرد صناعة صينية ذو زجاجة ويستخدم فى المكاتب والمنازل وسعة المياه الباردة بها قليلة وأعطاله كثيرة<br />وأما المبرد الذى قمت بعمله لا يتقيد سعة لترية من المياه الباردة ولذلك يوضع فى الشارع أو فى أى مكان لسيتخدمه مئات الناس يومياً و لشكله البسيط فى الحجم يمكن استخدامه فى شركات أو مكاتب بدون أى إيذاء لصحتهم ومياه باردة مستمرة طول الوقت ولأ يستهلك كهرباء كثيرة وتكلفته غير باهظة كما قال الأخ المهندس ويحافظ على طبقة ألإزون والبيئة .<br />وأخيراً أعرفك يا أخ أن المبتدئين لا يخترعون وعندما تنقد شئ فيه معلومة علمية عليك بلإستفسار أولاً قبل السخرية حتى لا تنال إستياء من القاصى والدانى .<br />نصر قاسم صاحب المبرد السحرى<br />ولمن يريد الأستفسار عن المبرد فاست كول يرجى الإتصال على رقم :0106327136<br />وأنا مستعد لأى إستفسارات ."
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620064007/http://www.20at.com:80/masr/t7kyk/9220.html"

