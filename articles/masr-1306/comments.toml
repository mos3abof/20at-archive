subject = "نظرة تأمل"
author = "مصراوي على طول"
posted = "2006-12-16"
text = "لازم يا جماعة نهدا كدا واحنا بناقش الموضوع، المصري اليوم لم تخطئ في نشر الصورز والا المطلوب منها نشر كل ما هو سيء من جانب الحكومة فقط. ثانيا مرشد الاخوان قال قبل كده انه عنده 10 آلاف مقاتل مستعدين للذهاب للبنان، هيجيبهم منين المقاتلين دول، يعني في تدريب عسكري، والا هيبعت ناس عشان تموت باسم الاخوان وهو ياخد السوكسيه كله، ثانيا لما يكون في عرض زي ده مع التصريحات المرشد يبقى الناس تصدق اللي الحكومة بتقوله في ظل تاريخ الأخوان ولمن يقول ان الاخوان بيعملوا كده للدفاع عن نفسهم ضد الحكومة يبقى فين الدولة(مش الحكومة) وبعدين كل مجموعة تحاول تكون قواتها الخاصة بيها وتبقى هيصة بقى"
