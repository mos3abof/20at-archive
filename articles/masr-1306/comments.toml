author = "السبب هو إستضعاف الشعب وفقدانه ثقته فى نفسه حتى لا يقوى على صد الفساد المتجسم فى الحاكم وعائلته وحثالته"
posted = "2006-12-15"
text = "الحاكم قاتل فهل جرئ أحد على فضح جرائم قتله البشعه سواء للسادات أو للظباط الأحرار وغيرهم طبعاً لا هو الذى يعتقل الإخوان المسلمين ويسرطن الشعب<br />الحاكم مزور لكل أرادة الشعب فى كل الإنتخابات منذ وصل للحكم فهل حاكمه أحد طبعاً لا هو فقط الذى حاكم الدكتور ايمن نور على تزويره<br />الحاكم ناهب مصر كلها فهل حاكمه أحد على أيرادات مصر المنهوبة<br />الحاكم يسافر كل العالم ويعقد إجتماعات مع كل رؤساء العالم فهل يعرف أحد من الشعب ماذا يفعل فى هذه الإجتماعات<br />الحاكم يفرض زوجته فى الحياة السياسية وأبنه المفتقد لكل الخبرات الذى زرعه قيادة فى الحزب الحاكم الذى لا يضم إليه إلا الفسدة وتجار المخدرات والناهبين من أصدقاء الصغنون فهل حاسبه أحد وهل خلت مصر من الرجال حتى يوافقوا على هذه المهزلة التى تفقده الشرعية فى الحكم<br />الحاكم يبيع أملاك الشعب ويزور الدستور فهل منعه أحد<br />الحاكم وصل للثمانين ويطالب ببقاءه فى الحكم مدى الحياه فهل سأله الشعب على أى أساس ترتكز فى هذا التصريح<br />الشعب يعانى من البطالة والمرض فهل طالب بحقوقه كما يجب أن يطالب وليس الشكوى فقط<br />الحاكم يكذب على الشعب منذ توليه الحكم فهل حاسبة أحد مثلما حوسب الرئيس كرتر على كذبه على الشعب<br />إذن نحن السبب فيما وصلنا إليه وفيما وصل إليه الحاكم من إذلال للشعب ولن ينتهى حالنا بالشكوى ولكن بالوقوف وصد الفساد وإزالته فهل أشتكى السيد حسن نصر الله من فساد السنيورة ولكنه وقف وضم الشعب لصفوفه وحارب الفساد<br />لا أمل إلا بالقضاء على مبارك وعائلته وأزالة اللجنة ثلاثية الأبعاد التى تحكم مصر وتطهير مصر من فساده وذلك بحكومة مؤقته لمدة سنتين<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

[[comments]]
order = 13
subject = "اعتقال الاخوان .. طبيعى جدا"
author = "مصرى حتى النخاع"
posted = "2006-12-15"
text = "عاوز الاول اقول للخليجى الاهبل روح اتعالج ياشاطر<br />بالنسبة لاعتقال 180 من الاخوان المسلمين انا شايف<br />1-الاعلام ملوش دعوة تماما بما حدث هوا نقل صور يعنى وقائع وبالتالى الصورة وحدها عبرت<br />2- الاخوان هما جزء من نسيج الشعب يعنى تعذيب الامن وبهدلة كرامة المواطن المصرى هيا جزء مشترك بين الاخوان والشعب يبقى بلاش نحمل المواضيع دى سبب العرض العسكرى<br />3- الامن ثم الامن ثم الامن الاخطبوط اللى بتتكشف انيابة فى كل حالة حالات تعذيب المواطنين بهدلة الصحفيين سحل الاخوان ...........<br />4- الاخوان كمان مخطئين جدا احنا عاوزين نتخلص من حكم مبارك واعوانة اكيد مية فى المية بس الشعب ياجماعة عاوز يتنفس حرية ادوا المواطن المصرى فرصة للحرية احنا مش عاوزين نبدل حكم مبارك بالاخوان لا لا والف لا<br />نفسى نبقى زى دول اوروبا نفس الحرية الشوارع نضيفة مافيش محسوبية البنى ادم مكلاك مش مهان اللى ماسكين البلد عندهم فكر واضح لالاارتقاء بيها وبالمواطن عاوزين ناس تحكمنا متدخلناش فى حروب وهمية لصالح ناس تانية الشعب تعبان مش عاوز يحارب عاوزين ناس تحكمنايكون عندها استعداد للراى والراى الاخر مش حكم استبداد زى حسنى حتى ولو كان باسم الدين عاوز اخرج من بيتى وانا فرحان<br />المواطن المصرى نفسة يحلم ببكرة من غير خوف<br />يامبارك حل عننا بقى خد اخواتك اعضاء الحكومة ومعارضينك مليشيات الاخوان وحلوا كلكم عننا وسيبونا نحكم نفسنا بنفسنا"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

[[comments]]
order = 14
subject = "هو فيه إيه"
author = "إيه إللى كاتبه المصرى اللى عامل نفسه مطحون"
posted = "2006-12-15"
text = "أولاً حرية أيه وهبل إيه وحسنى مبارك قاعد على نفس البلد بالتزوير<br />مالهم الإخوان حد منهم رد على إللى بيتعمل فيها هل مسكو فى يوم مدفع ولا خطفوا حد من الفسدة بتوع البلد وعذبوهم زى مبارك الواطى لما يبعمل فيهم<br />إستقرار إيه وحروب إيه وهبل أيه ومهلبية إيه هو إنت بتسمى حكم مبارك ده إستقرار ده أستهبال وعماله لليهود والأمريكان<br />بالعربى كده الشعب كله بيكره مبارك يبقى هو قاعد من غير أى شرعية فى الحكم يعنى مزور ومكروه من الشعب وفارض مراته الوسخة اليهودية على الحكم وعلى الحياة السياسية وإبنه المعروف سيرته الوسخة لكل الشعب زارعه بالعافية يا جماعة دى دولة وشعب ومحدش منهم ها يقدر يوصل للحكم بالعافية وبكراهية الشعب والشعب عمره ما هايحبهم بعد إللى عمالوه فى مصر يبقى القضية محلولة الثورة على مبارك وطرده وتطهير مصر منه وحكم مؤقت من القضاه لمدة ستنين نطهر مصر فيها ثم إنتخابات حرة لإنتخاب حاكم ينهض بمصر ويعيد تواجدهافى الساحة لكن الكلام العبط إللى كاتبه ولا كاتباه المصرية أياها بتاعة الدشم مرفوض موفوض مرفوض لإن مصر دى بلادنا وهما مغتصبينها مننا وأحنا مش اقل من الفسلطنيين ولا العراقيين ولا اللبنانيين إللى بيدافعوا عن بلادهم ضد الإحتلال والفساد<br />أستنفذتى كل الأسماء إرحمى نفسك يا دشم ويا مصرية مطحونة ويامصرى مطحون كفاية الشعب كله بيكرهك بيكرهك ورافض إن واحدة يهودية تحكمه أظن المعلومة وصلتك وكفاية بقى قرف"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

