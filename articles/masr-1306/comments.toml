[[comments]]
order = 27
subject = "السلبية مطلوبة"
author = "اسامة"
posted = "2006-12-16"
text = "السلبية مطلوبة أحيانا خصوصا عند الفتن ...........<br />قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِنَّهَا سَتَكُونُ فِتْنَةٌ تَسْتَنْظِفُ الْعَرَبَ قَتْلَاهَا فِي النَّارِ اللِّسَانُ فِيهَا أَشَدُّ مِنْ وَقْعِ السَّيْفِ<br />حدثنا مسدد حدثنا حماد بن زيد عن أبي عمران الجوني عن المشعث بن طريف عن عبد الله بن الصامت عن أبي ذر قال<br />قال لي رسول الله صلى الله عليه وسلم يا أبا ذر قلت لبيك يا رسول الله وسعديك فذكر الحديث قال فيه كيف أنت إذا أصاب الناس موت يكون البيت فيه بالوصيف يعني القبر قلت الله ورسوله أعلم أو قال ما خار الله لي ورسوله قال عليك بالصبر أو قال تصبر ثم قال لي يا أبا ذر قلت لبيك وسعديك قال كيف أنت إذا رأيت أحجار الزيت قد غرقت بالدم قلت ما خار الله لي ورسوله قال عليك بمن أنت منه قلت يا رسول الله أفلا آخذ سيفي وأضعه على عاتقي قال شاركت القوم إذن قلت فما تأمرني قال تلزم بيتك قلت فإن دخل علي بيتي قال فإن خشيت أن يبهرك شعاع السيف فألق ثوبك على وجهك يبوء بإثمك وإثمه<br />حدثنا عثمان بن أبي شيبة حدثنا وكيع عن عثمان الشحام قال حدثني مسلم بن أبي بكرة عن أبيه قال<br />قال رسول الله صلى الله عليه وسلم إنها ستكون فتنة يكون المضطجع فيها خيرا من الجالس والجالس خيرا من القائم والقائم خيرا من الماشي والماشي خيرا من الساعي قال يا رسول الله ما تأمرني قال من كانت له إبل فليلحق بإبله ومن كانت له غنم فليلحق بغنمه ومن كانت له أرض فليلحق بأرضه قال فمن لم يكن له شيء من ذلك قال فليعمد إلى سيفه فليضرب بحده على حرة ثم لينج ما استطاع النجاء<br />حدثنا مسدد حدثنا عبد الوارث بن سعيد عن محمد بن جحادة عن عبد الرحمن بن ثروان عن هزيل عن أبي موسى الأشعري قال<br />قال رسول الله صلى الله عليه وسلم إن بين يد<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

