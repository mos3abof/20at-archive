[[comments]]
order = 6
subject = "المسئول"
author = "المسئول هو مبارك الواطى إللى قاعد على قلب مصر بدون شرعية ولا قاعدة جماهيرية قاعد يحكم مصر وكأنه بيرعى غنم وماسك عصاية الأمن يحمى نفسه بيها وكل لما عصاية الأمن تتكسر يجيب عصاية أكبر منها علشان يخرس الشعب. واحد عنده 82 سنة بدون تزوير طبعاً وقف وبمنتهى الوقاحة يقول للشعب أنا قاعد لغاية آخر نبض فى قلبة طب ما شارون قلبة بينبض وهو يعتبر ميت وناسى أصلاً إنه ملوش شرعية يقعد بيها لإنه مزور لكل الإنتخابات ولإن الشعب كله رافض العيلة كلها هل يوم لما نطق بالتخريف بتاعه ده عمل استطلاع للرأى فى وجوده من عدمه أو أصلاً فى سياسته المقصود بها أخراس الشعب وتجويعه وبطالته حتى يصبح عدداً بلا قيمة ولا يجد من يقول له لا فهو نظام يحكم مصر 26 سنة بدون شرعية وبدون إعتراض شعبى فكيف سيقبل اليوم أن يقول له الشعب لا لكن القضية هى لازم توحيد المعارضة كلها مع بعض لإنهم بياخدوا رؤس الشعب من المعارضة واحد واحد أبتدوا بأيمن نور ثم نعمان جمعة ثم طلعت السادات ثم الآن الإخوان المسلمين ولأنهم قوة لن يستطيعوا محاربتهم إلا بتفتيتهم وهذا ما يفعلونه كما يفعلون مع حركة كفاية التى وقف حسنى الواطى يقول أنا هاعمال حركة أكبر منها وهاسميها مش كفاية وإللى عاملة الطلاب ده لا يقل عما يجيش فى صدور المصريين الرافضين لحسنى مبارك ورافضين لوجود زوجته اليهودية وإبنه المدمن الشاذ فى الحياة السياسية ولا أمل إلا بالثورة عليهم وتطهير مصر منهم وطالما قيادات المعارضة مش عايزة تقود الشعب يبقى من حق الشعب الدفاع عن نفسه بكل الطرق"
posted = "2006-12-15"
text = "مصر حره حره يا مبارك أطلع بره"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

[[comments]]
order = 7
subject = "كس امكم"
author = "خليجي بكل فخر"
posted = "2006-12-15"
text = "هيه شووف مصري وش يقول<br />يالمصري انت سافل واطي .. وانا اعرف لي مدرسين مصاريه والله والله تافهين نفسهم رخيصة .. انا اتصدق عليه واخدمه والله خدمتهم كثر ونكروا الجميل في دقيقه.. بعدها عرفت انو مافي مصري فالدنيا شريف<br />كلهم حقين فلوووس<br />والله والله الا اليوم وانا ماشفت مصري نضيف او مصري شريف او مصري كريم وجيههم مغسوله بمرقه كلب<br />مع انني ماقد قابلت كويتي لاكن اشوفهم نظيفين واشراف نفسهم عزيزة ماهم مثل المصاريه<br />المصاريه شي تافه اشتريهم بريال وابيعهم بريال<br />المصري من ورا الشاشه سوا نفسه رجال .. والله لو اجي عنده مثل الدجاجه مايهش ولا ينش<br />انا من احد الخليجين اللي سافروا مصر لجل شي واحد اللي هو (( الكس )) يعني مافي خليجي ماهان شرف المصاريه..<br />وياناس تخيلوووووا مدرس مصري انا معاه طيب واستغل طيبي ومره من المرتا قال لي ياحمار تدرون وش سويت ماكلمته..<br />رحت له بيته بعد فتره عشان مايحس اني ابغى اسوي له شي .. المهم رحت بيته واخذته على اسا اننا نروح نتعشى في مطعم ونتمشى.. انا متفق مع شباب في الاستراحه حقتنا ينتظروني .. المهم اخته على الاستراحه وضربناه ونكناه وصورناه<br />عشان قالي ياحمارر دفع ثمنها غالي<br />وبعدين هددته بالمقطع الفيديو ونجحني ونجح كل اللي اعزهم بالمدرسه .. وهو الحين في مصر ذليل تافه نكته واخذت شرفه<br />وشره الا الان بيدي..<br />ما احب اطووول عليكم<br />احب اقووول<br />ان ما اعتقد انو في مصريه شريفه<br />ولالالالالالالالالالالالاهنو الخليجين"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

