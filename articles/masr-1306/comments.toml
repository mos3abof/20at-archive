text = "لازم يعين تجيب التهزيق لامك يا شرموط , كل شوية تدخل علينا علشان امك المومس تتشتم , طب ليه يا مهزئق , امك زنبها ايه يا ابن المومس, انت مش ملاحظ ان الموقع ده موقع معارضة , والـ انت من كتر الشتيمة مش بتحس خلاص زي الخنازير.<br />عموما روح لامك عند سيدك مبارك لانه تعب خلاص من كتر السيكو سيكو فيها."
