text = "الاخوان فى الجامعه غلطوابالاستعراض القتالى ده ومرشدهم كذب لما قال انها تمثيليه عن المقاومه وهى لا كانت تمثيليه ولا اسكتش هى كانت استعراض لمهارات الطلاب.<br />غير كده دى مش اول مره الطلبه تلبس الزى ده عندنا وفيه حاجات الطلبه ادوها قبل كده شبيهه بالموضوع ده لكن طبعا والامن كان شايف كل حاجه بس المره دى بالذات الموضوع خد حجم اكبر والسبب ان جريده روز اليوسف تبنت الحمله المضاده للاخوان بحكم انها جريده تبعه للحكومه لكن الحق ان الحمله لم يكن المقصود منها الاخوان لكن كان المقصود من الحمله دى تشويه صوره اداره الجامعه ممثله فى الدكتور احمد طيب وده ردا على رساله الماجستير اللى تمت مناقشتها فى احدى الكليات الشرعيه التابعه لجامعه الازهر بمحافظه المنوفيه وتم فيها تكفير فاطمه اليوسف والتى تنسب اليها مؤسسه روز اليوسف وتم فيها نقد لازع لفكر المؤسسه, المهم من الاخر استعراض الاخوان لو كان تم فى ظروف غير دى كان الموضوع كان بقى اصغر خصوصا ان الدكتور عصام العريان اطلق صراحه على ماسمعت وبالتالى ده اعطى روح معنويه للاخوان فكان لازم ده يتحطم وزى ما بيقولوا راس كبيره خرجت ندخل مكانها راس كبيره تانى اللى هو الدكتور الشاطر وده طبعا فى اعتقادى اهميته رمزيه ومعنويه للاخوان اكثر منها تنظيميا عموما الموضوع كبير لكن فعلا هو اثر على طلبه الاخوان فى الجامعه وانا اعرف اكثر من واحد نزلوا بلدهم لغايه ما الامور تهدى لانهم بيقبضوا على الطلبه من شققهم الموجوده فى الحى السادس اللى بيتركز فيها شقق الاخوان وكمان مدينه الصفا اللى فى الحى السابع اللى اساسا هى اتعملت علشان يتحط فيها المستبعدين امنيا من المدينه الام .<br />لكن حكايه الاسلحه اللى اتظبطت فى شقق الطلاب فده كلام فارغ وانا متاكد من النقطه دى تحديدا وطلبه الاخوان عندنا ا<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

