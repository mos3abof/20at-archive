text = "الناس إللي بيخرجوا عن جماعة المسلمين و عايزين يعملوا فرقة و بلبلة و يقعدوا يشيلوا سكاكين و جنازير و مطاوي<br />ولا يمكن تقصد إللي بيعملوا إجتماعات مع الغرب و إللي بيوالوه و لهم تحركات خفية في التنظيمات الدولية و يخالفوا عقيدة الولاء و البراء ؟؟؟<br />ولا يمكن تقصد إللي بيهربوا بره البلد و يسيبوها زي منتا بتقول مش عايزين يفضلوا مع الأطهار من الشعب و بيطلبوا حق اللجوء السياسي من دولة من الغرب الكافر"
