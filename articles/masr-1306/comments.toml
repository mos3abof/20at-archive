subject = "أنتم الأعلون إن شاء الله"
author = "هذا هو حال الأمةفى كل مكان مايحدث في مصر هو مايحدث في فلسطين هو ما يحدث في العراق هو مايحدث في كل مكان ترفع فيه راية الملتزمين ."
posted = "2006-12-15"
text = "ماذا تريد الدولة من هؤلاء ؟<br />ماذا جني هؤلاء؟<br />لابد للأمة أن تستيقظ , ما المعني بأن نحي فلا نحي بنا الدين, هذا مايفعله طلبة الإخوان , فالله معهم, وأشكر الإعلام الذي سيصنع منهم رجال إن شاء الله"
