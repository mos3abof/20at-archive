[[comments]]
order = 30
subject = "عمار"
author = "الاخوه غلطنين"
posted = "2006-12-16"
text = "أنا رأيي يا جماعة ان الموضوع كان غلط من الأول..... يعنى مكانش المفروض إن الأخوة يقوموا بالعرض دة بالشكل اللى حصل دة...كان هيبقى عادى لو العرض معمول كرد فعل على اعتداءات فى فلسطين مثلا...بس مش كدة...<br />و خصوصا انو معروف ان الإعلام بيستغل الكلام دة كويس اوى ضدهم..<br />و مع ذلك بردو انا ضد الإعتقالات اللى حصلت لأن دة رد الفعل مبالغ فيه....و مجرد إستغلال للموقف مش أكتر...<br />على أى حال ربنا يستر على البلد دى بجد ....الوضع بقى صعب أوى"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

[[comments]]
order = 31
subject = "نفسي اشوف حاجة مفيدة"
author = "ميدو"
posted = "2006-12-16"
text = "معلش ياجماعه أنا شايف أن الأخوان غلطوا لما رفعوا الأعلام وأنا نفسي أشوف حاجات مفيده الأخوان بتعملها .أنا مبشفش منهم غير الكلام وبس وكل اللي فلحين فيه يعملوا مظاهرات اللي مبتعملش أي حاجه للبلد غير الخراااااااب .ولوسمحتوا محدش يفتكر أني بحارب الأخوان دى مجرد رأي .أصل الأخوان هيقولوا عليه أني تبع الحكومه وأني بكرهم لا والله انا بحبهم جدا بس أنا شايف أنهم مش صح"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

[[comments]]
order = 32
subject = "بجد والبلطجية اعتقولوا"
