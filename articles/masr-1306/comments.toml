[[comments]]
order = 33
subject = "اخبار سنة 2010"
author = "الحاكم بامر الشيطان مولانا جمال برايز رضي بوش عنه"
posted = "2006-12-16"
text = "بمناسبةمتابعة تنفيذ البرنامج الانتخابي للرئيس حسني وجمال (رضي بوش عنهما) , ادعو انا رئيسكم القادم المرشد العام للحزن الوطني الارهابي (جمال برايز) كل الشباب من الجنسين ان هناك قانون يعده مجلس الحرامية (الوزراء سابقا) بتفعيل ضرب البرايز باعتبارها المشروع القومي القادم لكل شباب مصر , وتجريم الزواج الطبيعي بين الجنسين لعدم وجود امكانيات للزواج , ويعد مجلس الحرامية بنود المشروع لعرضها علي مجلس العواجيز(الشوري يعني) وتمهيدا لعرضها علي مجلس الصوت العالي والمصـلحجية(مجلس الشعب يعني). ودمتم<br />الحاكم بامر بوش مولانا جمال برايز (رضي بوش عنه)"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

