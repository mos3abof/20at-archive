text = "استعجبت كثيرا من المصري اليوم الجمعة ولم اجد ما كانت تفعلة يوم العرض الصور العسكرية والكلامات المطاطة التي لم نقرا تصريح واحد لطالب من الطلاب بتوع الازهر يشرح ماذا يفعلون او ماذا يقومون بة لكن النهادة هي مستقلة علي الاخر شوفتوا تقريبا منزلة بيان الدخلية كلة وكمان تاريخ اعتقالات الشاطر والاخوان ونسيوا انهم اليبب فيما حدث فين التغطية الجامده بتاعتكم ولا يا انكل الجلاد عمو المخبر قالك براحة واكتب ان السبب في القبض العرض العسكري<br />اة ياخدكم وريحنا منكم يا ولاد ال...لب"
