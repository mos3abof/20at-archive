[[comments]]
order = 1
subject = "مصر العزيزة لي وطن"
author = "كيمو الحلو"
posted = "2006-12-15"
text = "السادة الاصدقاء الاخوان اخطاءوا فهم تنظيم مسلح من زمان ايام البنا والجريدة جاهله خالص انا كتبت مقال عن فساد بالمحله الصعيدى الحلوف اللي اسمه عبد الحكيم الاسواني مرضاش ينشرة مع انه مادة جامدة اصلا المصري اليوم متتحراش الدقه علشان هي جريدة تافهه وبكرة هتشوفوا استاذة الجامعه دول بتوع دعارة واوساخ وعمرهم معلموا بضميير كمان مصر مولعه وهتنفجر ان شاء الله في بعضها وانا حاسس انها كدة لانها بقت بلدملهاش لازمه والادله كتير واتحدى حد يقول عكس كدة<br />ومفيش حاجه اسمها وطنيه ومهلبيه كل اللي في مصر هما اعداء مصر وسلمولي علي كوكو كوارع"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

[[comments]]
order = 2
subject = "الف مبروك للطيب وكمال والجلاد"
author = "ياسر ابو عمار"
posted = "2006-12-15"
text = "*السبب فى رايى هو الكبت والقهر الذى يتعرض له الطلاب الاحرار فى هذا البلد الذين منعوا من خوض الانتخابات واعتقلوا وفصلوا واقتحمت مساكنهم دون ان يتحرك احد الاشاوس الذين يصرخون رافضين استعراض الكاراتيه \"التمثيلى \".<br />*المسئول امن الدولة الذى لا يرعى حرمة او مصلحة لاحد فى هذا البلد فيقرر تضييع مستقبل 180 طالبا على الاقل باعتقالهم ومنعهم من دخول الامتحانات .<br />*المسئول الادارات الجامعية الورقية التى تنفذالاوامر دون اى مناقشة \"واحب اسال السيد الاستاذ الدكتور \"الصعيدى الجدع\"احمد الطيب :ارتحت يا عمنا لما 180 من ولادك اترموا فى السجن بسبب انك اصبحت ذيلا للاجهزة الامنية ؟<br />*المسئول وسائل اعلام لا يعرف احد لمصلحة من تعمل ،ولمصلحة من تستعدى الدولة ضد مجموعة من الطلاب الذين اخطاوا واعتذروا عن خطئهم .<br />واحدد هنا جريدتى المصرى اليوم وروزاليوسف ،واحب اشكر كل من السيد مجدى الجلاد والعقيد عبد الله كمال على جهودهم الحثيثة فى تحريض الاجهزة الامنية على القبض على هذا العدد من الاخوان .<br />الصحفيون الجدد اثبتوا ان للصحافة دور مختلف ؛فبعد ان كانت المهمة الصحفية تتعلق بالاعلام والتوعية ونقل الاحداث تحولت بقدرة الاجهزة المعنية الى بوابير جاز تسخنالشرطة ضد ابناء البلد .<br />الف خسارة على الصحافة ان كانت هذه ستصبح مهمتها فى المستقبل ."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

[[comments]]
order = 3
subject = "لماذا الهمة هذه المرة"
author = "واحد مفروس"
posted = "2006-12-15"
text = "اموت واعرف ليه الاجهزة المصرية الرائعة تحركت بسرعة البرق للقبض على طلاب الاخوانفى حين لم نسمع لها صوتا حين غرق المئات فى العبارة واغتصبت البنات فى شوارع وسط البلد وانتهكت حرمات الصحفيات امام نقابتهن ؟،ولماذ لم يشمروا عن سواعدهم الفتية فى تعقب البهوات الذين يهربون بفلوس الغلابة الى الخارج ،بل لماذا اغمضوا اعينهم عن البلطجية الذين دخلوا بكل سهولة الى جامعات عين شمس وغيرها واعتدوا على طلاب الجامعة ؟<br />اعرف الاجابة بالطبع ولكنى اردت ان ارد على البهوات الذين ما زالوا يعتقدون ان تلك الاجهزة تحركت قلقا من تنظيم عسكرى للاخوان ،والله العظيم امر مضحك ان يصدق عاقل هذا التخلف الذى تردده تلك الوسائل الاعلامية التى تاخذ موادها التحريرية مباشرة من تقارير الضباط ،وما انجسها من تقارير."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

[[comments]]
order = 4
subject = "من المسئول ؟؟؟"
author = "إبن بهيه"
posted = "2006-12-15"
text = "من المسئول ؟؟؟ لما تجيب بلطجيه بسنج ومطاوي وعصي ويدخلهم الأمن نفسه من باب الجامعه ويعزمهم على شاي ويسيبهم يبهدلوا الطلبه ويضربوهم ، هل يحق لك أن تسأل طلبة الإخوان عن أي رد فعل سلبي بعد ذلك ؟؟؟ عندما تحرم الطلاب من أي مشاركة وتحرمهم من حقهم في الترشيح وممارسة حياتهم كغيرهم من الطلبة وتنهب هذا الحق وتعطيه لمن لا يستحقه ، فقط لمجرد أنه من أتباع الجرو الصغير جيمي وجمعية اللا مستقبل بتاعته يبقى ممكن تسأل الضحية لماذا تنفست ؟؟؟ لماذا قاومت الذبح ؟؟؟ لما دكاكين الإعلام وبيع الوطن بالحته اللي مليانه مخبرين من عينة رزق وجبر ودقاق وكمال يشتغلوا تلطيش واضطهاد لطلبه أبرياء يريدون أن يكونوا هم وليس غيرهم .. يريدون أن يعيشوا بحرية ، فماذا يمكن أن تنتظر من شباب مارست عليه كل تلك الضغوط ؟؟؟ هل تنتظر أن يكونوا كأبائهم يتلزقوا على قفاهم ويمشوا جنب الحيط ويربوا العيال ؟؟؟ لأ طبعاً ده تهريج .. الحساب الأول لمبارك الواطي وعصابات الأمن القذر التي تتدخل في كل الشئون بلا دعوة إلا من مبارك الواطي وعصاباته .. ممكن يدخل ضمن هذه العصابات اليوم عمداء كليات ورؤساء جامعات واطيين برضه .. باعوا أولادهم الطلبه للأمن بصاندوتش في مؤتمر بطيخ وبدل سفر ما أعرفش كام ملطوش ومنصب مستنيه لما يغور من الجامعه .. محافظ الفيوم مثلاً .. عايز الطلبه دي تعمل إيه والبي ؟؟؟<br />طيب ليه محافظ الفيوم ؟؟؟ لأنه الأستاذ بسرعة الصاروخ بقى عميد وهوبا هوبا بقى رئيس جامعه وهوبا هوبا أستاذ الكيميا بتاع المعامل بقى بيفهم وينفع يبقى محافظ فعينوه محافظ ... ودا ليه ؟؟؟ لأنه الواطي كان مخبر على زمايله للأمن وماشي تبع البدنجان وتمكن من إحكام قبضة الأمن على الجامعة التي عينه مبارك رئيسا لها فمحى فيها أي أثر لأي تيار من أي نوع .. الكل لازم يطبل<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

