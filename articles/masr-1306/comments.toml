[[comments]]
order = 41
subject = "منقول"
author = "وضعت أميركا حركة حماس ممثلة جماعة الإخوان المسلمين في مصيدة الانتخابات، ووصلت إلى رئاسة الحكومة الفلسطينية. وقبل ذلك وصلت جماعة الترابي ممثل جماعة الإخوان المسلمين في السودان إلى السلطة بمساعدة عن طريق البشير ومن قبله. وفشل كلاهما، حركة حماس والترابي، في القيام بمهام الحكم بنجاح. وقد انتهت التجربة السودانية إلى عزل الترابي عن الحياة السياسية، وفشلت حركة حماس في القيام بمهام الدولة. وها هو الشعب الفلسطيني يتضور جوعا ويقتتل أبناؤه في الشوارع للمرة الأولى في تاريخهم بفضل سوء إدارة حماس لأمور الدولة الوهمية التي لم تخلقها أميركا بعد، ولله أنني لفرح ومسرور لهذا الفشل السياسي، لأنه يحمل بشائر للمستقبل فيما لو فكر أي شعب عربي غبي بتسليمهم السلطة، لأن نصيبهم سيكون الفشل ثم الفشل، ولأن هذه الجماعة لا تنجح إلا في بناء مجتمع شحاذين وطماعين يبحثون عن المال من أجل المال فقط."
posted = "2006-12-17"
text = "الفشل السياسي لحركة حماس ومن قبلهم جماعة الترابي (تحولت السودان الآن إلى دولة علمانية!) دليل واضح على أن هذه الجماعة التي تأسست منذ عام 1928 لا تستطيع سوى إقامة جمعيات خيرية لتنفيع وجذب الاتباع على غرار ما تفعله الجمعيات الخيرية التبشيرية النصرانية، مع اعتبار حقيقة أن الجمعيات المسيحية تعمل الخير لوجه الله تعالى، ولا تبحث عن سلطة أو نفوذ داخل المجتمع، كما هو حال جماعة الإخوان المسلمين في السودان وفلسطين ومصر ودول الخليج.<br />لقد أثبتت حركة حماس أن الفكر الديني المصطبغ بالأيديولوجية السياسية لا يمكن له أن يقوم بواجبات الدولة، ليس فقط كونه لا يملك الزاد التراثي في مجال علم الدولة، بل لكونه أيضا، أعجز من يوفر لقمة نظيفة للفقراء. لقد اعتقدت حركة حماس أن الوصول إلى السلطة والقيام بمتطلبات الدولة مثل إدارة جمعي<br />اقرأ بقية التعليق .."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

[[comments]]
order = 42
subject = "ياتري الطلاب كانوا معزورين"
author = "محمد عبد المنعم"
posted = "2006-12-23"
text = "قبل ما نقول طلاب الازهر عملوا ايه<br />ياريت نفكر الأول إيه اللي اضطرهم لعمل ده.. مع ملاحظة أنهم اعتذروا عنه<br />1- تزوير الانتخابات والطرق القذرة اللي بيتعامل بيها موظفين رعاية الشباب أثناء فترة الانتخابات<br />2- فصل الطلاب اللي بيحاولوا يمارسوا دورهم بإجابية وبطرق سلمية ومشروعة زي الاتحادات الحرة .. والتي إن لم تكن رسمية بمفهوم إدارة الجامعة.. فهي تفويض من الطلاب لطلبة الاتحاد الحر بالمطالبة بحقوقهم والقيام بالدور الذي لا يقوم به طلبةالاتحاد المزور<br />3- في الوقت الذي لا يجد فيه الطلاب رعاية من رعاية الشباب وفي الوقت الذي لا يوجد فيه دعم للطلاب المستحقين ولا يوجد فيه دعم للأنشطة.. نجد ميزانية الاتحاد تنفق ببزخ وبسفه على مجموعة معينة من الشباب على رحلاتهم وملابسهم وأشياء أخرى؟؟؟؟<br />4- في الوقت الذي لا يجد فيه الطلاب الحرية في الدعوة لدينهم والحفاظ عليه.. بل ولا يجدون حتى الحرية في التعبير الشخصى عن تدينهم بالالتزام بالزي الاسلامي أو السمت الاسلامي، نجد في نفس الوقت حرية التعري للبنات وحرية العربدة للشباب وحرية عمل العلاقات المختلفة المحرمة بين الشباب والبنات بدعوى الحرية الشخصية.<br />5- بعد كل ما مضى وأكثر بكثير مما مضى نجد أن الطالب الذي يريد أن يمارس كل هذه الحقوق يعامل بالفصل بل وبالاعتقال وبإرسال بلطجية لضربة داخل الحرم الجامعي لمجرد أنه يريد أن يمارس حقوقة المشروعة سواء كانت سياسية أو غير سياسية.<br />*** فإذا افترضنا حتى أن هؤلاء الطلاب أرادوا أن يوصلوا في لحظةغضب رسالة إلى هؤلاء الحكام أو الأصح أن نقول المحكومين من قبل أمن الدولة بأن إرادة الطلاب من الممكن أن تتحول عن مسار العقل والحكمةإلى غيرها من الطرق.....<br />فأنا بشكل شخصى لا ألومهم.. وأري أن قوة التحمل لها حدود .. بل وأرى أن صبر هؤلا<br />اقرأ بقية التعليق .."
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231001138/http://masr.20at.com:80/article.php?sid=1306"

[[comments]]
order = 43
subject = "مش للدرجه دي...في حاجه غلط"
author = "حازم محيي الدين"
posted = "2006-12-24"
text = "انا عايز افهم حاجه ازاي يعني شويه طلبه والمفروض انهم طلبه ويعملوا عرض زي ده هوه خلاص البلد فوضي كده وازاي يعملو كده جوه حرم جامعي وايه الغرض من عمل حاجه زي دي واكرر تاني ايه الغرض من عمل حاجه زي دي ما الاخوان طول عمرهم بيعملو مظاهرات بس المره دي زودوها اوي<br />وعايز ابعت رساله للاخوان:<br />انتو لو تعرفو انتو خسرتو اد ايه بسبب ده تندمو اشد الندم لان الناس اللي كانت مطعاطفه معاكو بقت تخاف منكم وحست ان في حاجه غلط"
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231001138/http://masr.20at.com:80/article.php?sid=1306"
