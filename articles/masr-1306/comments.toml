[[comments]]
order = 11
subject = "انت وصمة عار على الخليجيين"
author = "رئيس تحرير"
posted = "2006-12-15"
text = "ايها المخنث الذى خالفت شرع الله اولا باتهامك لن تنجح فى جرنا الى السفالة فنحن ارفع واشرف من ذلك ولن تنجح فى هز عروبتنا وصدقاتنا للخليجيين فنحن عرب ونفتخر بهذا ونعرف ان كل البلاد العربية مثلنا تئن من وطأة احتلال حكامها واستبدادهم ملكى او امارةاو جمهورى فكل الحكام العرب باعواانفسهم الى الحكم اما عن الفلوس وان المصريين لا هم لهم الا جمع المال فانت لا تعرف شيئا عن المصريين اصحاب الخير والشرف ولقد سافرنا الى معظم البلدان العربية ولم نجد سوى اخوة محترمين واى حوادث فردية من اى شخص لا تعبر عن حقيقة شعب ذكر فى القرآن وكرمنا رسولنا صلى الله عليه وسلم بذكرنا فى حديثه الشريف مصر التى ساعدت فى انارة ظلمات الاحتلال وخلصت منه الجزائر العربية مصر التى فتحت بيوتها للكويتين بعد تعرضهم للظلم والاحتلال من العميل الامريكى صدام حسين<br />ايها الخليجى مهما كتبت لن تشعر بشء لانك شهوانى غير محترم ولايس انت السبب بل نحن السبب فيما نحن فيه ولكن سياتى اليوم الذى نستعيد فيه بريقنا وريادتنا ودورنا الرئيسى سيأتى الزعيم مثل القائد الملهم عبد الناصر ليعلمنا الكرامة من جديد .<br />رئيس تحرير<br />mego_mego.blogspot.com"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

