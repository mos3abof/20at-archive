[[comments]]
order = 36
subject = "اية الحكاية"
author = "الدباغ"
posted = "2006-12-16"
text = "عاملين هيصة لية ؟ اعتقلوا العيال واية يعنى<br />علشان كانوا بيلعبوا كراتية -مش مهم<br />يلعبوا زى ماهم عايزين -بس الغلط كان فى اللباس الموحد اللى عامل زى لبس قوات المليشيات - برضة مش مهم<br />اهدأوا هينضربوا كل واحد علقة ويخرجوهم علشان ما يعملوش كدة تانى<br />اية المشكلة - احنا مش شعب دموى<br />احنا حضارة سبعة الاف سنة فاكرين الملك فاروق رغم كل فسادة لم يحاكموة بل وادى الضباط الذين اخرجوة من الحكم التحية العسكرية لة وهو يغادر<br />وانظروا الى حالة صدام وفى ماذا يفعلون لة<br />نحن اصحاب حضارة عريقة ولسنا دمويين<br />يا مسئولين رجاءا رحمة بالاولاد فهم مثل اولادكم واخطئوا"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217051708/http://masr.20at.com:80/article.php?sid=1306"

[[comments]]
