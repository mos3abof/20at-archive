posted = "2006-12-16"
text = "طيب يا جماعة وهو الاستعراض العسكري علي حد تعبيرهم واللي عمل الضجة دي كلها<br />يجي جنب حرب الشوارع اللي الامن عملها لما دخل البلطجية جامعة عين شمس بقنابل المولتوف ده يبقي ايه<br />لعبة اتاري ولا ممكن نسميه هزار تقيل شوية<br />ولا حول ولا قوة الا بالله العلي العظيم"
