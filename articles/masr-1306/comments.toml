text = "لم الشعب شايفين الشرفاء بيتبهدلوا وصوتهم اتنبح عشان يردوا حقوقهم وهم ما زالوا سلبيين ...يبقى الشعب المسؤل<br />لكن على العموم ...السجن ده تربية لشباب الإخوان ان شاء الله يساعدهم على تقديم تضحيات اكتر...ويربيهم على الصبر والنضال أكتلا"
