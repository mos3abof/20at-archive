[[comments]]
order = 0
subject = "الى صاحب التعليق الغبى الاحمق ؟"
author = "انسان"
posted = "2006-10-05"
text = "ايها الغبى الاحمق صاحب التعليق؟ هل انتهت مشاكلنا وهمومنا فاصبحت سيرة الصحابة وال بيت النبى عليه الصلاة والسلام وتشضوية سيرتهم كالسيعة الكفرة هى كل همومنا وشغلنا الشاغل<br />ال بيت النبى عليه الصلاة والسلام اشرف الخلق الذى تتسائل عن حياته قبل ان يؤدبه ربة<br />وماذا تتوقع يا احمق ان تكون حياته قبل ذالك؟<br />لقد ولد النبى صلى الله عليه وسلم دون ان تتالم امه بولادتة<br />كانت السحب تظله فى رحلاتة وهو طفل<br />كان مؤتمن على كل شئ فى حياتة وهو مازال شابا ولم يكن الوحى قد اتاه<br />وصحابة النبى الكرام المبشرين بالجنة التى لن تعرف طريقها انت ومن مثلك من المنافقين<br />اليس عثمان ابن عفان هذا الذى تستحى منه الملائكة<br />اليس عثمان ابن عفان واحد ممن عاش وتوفاه الله وهو يعلم انه فالجنة<br />تبشيرا من اكرم الخلق<br />واين انت من اكرم الخلق لتتجاذب سيرتة<br />عليك اللعنة انت وجريدة الغد وكل غد ياتى بالسواد المطروح فى قلوب غلفها الله بما لا يحب ويرضى"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 1
subject = "الى عديم الاخلاق ضعيف الحجة اعلاه"
author = "علي"
posted = "2006-10-06"
text = "قذارة اللسان لا تجعلك على حق ولا داعي للتشنج<br />والان كلامي موجه لذوي العقول:<br />لماذا هذا الرفض المطلق لذكر الحقيقة بدون نقاش لماذا تميع الحقائق وجعلها مبهمة حتى ضاع الحق والباطل على امتنا الاسلامية اوليس الاعتراف بالخطأ فضيلة اوليست الانقسامات الموجودة الان بسبب الخلاف الذي حصل بين الصحابة بالسابق وما الفرق بين ما يحدث الان من اقتتال بين المسلمين وما حدث في عهد الصحابة فعدد القتلى بعشرات الالاف اذا المطلوب هو كشف الحقيقة وتحديد الخطأ و الصح وبيان من كان على حق ومن كان على باطل ليتنور ابناء امتنا الاسلامية"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

