[[comments]]
order = 57
subject = "لنا الله"
author = "محمد نبيل"
posted = "2006-10-13"
text = "الى الأستاذ معاذ محمود عامر وغيره ممن يتشدقون بحرية الحوار وانه لا معصوم الى ذلك من الكلام<br />فصاحب التعليق الأول الذي رفض أن يكتب اسمه واشار بخفة عقل واضح قائلا بالنص<br />((تأديب؟ مالكم جرالكم إيه؟ هل مطلوب منا أن تؤله الصحابة؟ هل مطلوب أن نقول أنهم معصومين؟ لا يا سيدي هم بشر مثل باقي البشر لهم من العيوب والمثالب مثل باقي خلق الله ومن حق أي بشري أن ينتقدهم))<br />أقول لامثال هذا أولا اتقوا الله في انفسكم وحاسبوا انفسكم قبل أن تحاسبوا<br />والسيد أبوأحمد يدخل في زمرتهم ما شاء الله واقول لكم واضح من كتاباتكم ان الدين عندكم مهمش وأن كل شيء مباح الخوض فيه<br />أما أنت يا سيد معاذ فقولك (( فلا يوجد أحد فوق النقد - والصحابة ليسوا ملائكة وليسوا أنبياء - والنبي ذاته كان معصوما في الأمور التبليغية والدينية البحتة ولم يمنع هذا أن يجعله الله يخطئ حتى لا نظن فيه أنه<br />ملاك وعلينا أن نكون أكثر مرونة وأكثر عقلانية ))<br />أقول لك كلمات حق أريد بها باطل من عقلك الذي عدم الوعي الديني وهذا ليس سبا بالطبع واقرأ الكلمات جيدا قبل التململ والرد كعنتر بن شداد<br />واسألك بالله عليك<br />حتى وإن أخطا الصحابة في بعض الشياء وهم ليسوا معصومين ونشهد بذلك أيجوز ان يوضع هؤلاء السفرة الكرام البررة الذين حملوا الدين ونصروه ولولا نصرهم هذا لربما كنت انت ممن يعبد الوثن والحجر والشجر أو غيره من الناس<br />والدواب واشاد بهم الله في قوله تعالى( محمد رسول الله والذين معه أشداء على الكفار رحماء بينهم .. الأيات وقوله صلى الله عليه وسلم اصحابي كالنجوم بايهم أقتديتم اهتديتم.<br />أيجوز ان نضع أمثال هؤلاء العمالقة تحت عنوان حقير ينم عن جهل وعقلية عقيمة كعقلية كاتب المقال بقوله (أسوأ عشرة شخصيات في التاريخ الإسلامي)<br />بل ويبدأهم بأم الم<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

