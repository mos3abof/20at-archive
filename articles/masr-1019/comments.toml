[[comments]]
order = 42
subject = "ما هو الهدف من الإساءة الى الصحابة"
author = "هاشم أحمد طه"
posted = "2006-10-10"
text = "الحمد لله رب العالمين والصلاة والسلام على المبعوث رحمة للعالمين وعلى آله وصحبه أجمعين ومن تبع هديه وأستن بسنته الى يوم الدين آمين ،، وبعد<br />أولاً ما وددت أن أكتب أسم المصطفى وأصحابه في مكان لا يليق بهم وهو هذه الساحة التى كان من المفترض أن تخدم الدين وإذا بها تفتح نافذة نقاش غوغائي لا فائدة منه سوى خدمة أعداء الدين ، وأنا لست عالماً بأمور الفقه والدين - إلا الأمور المعلومة بالدين بالضرورة كأي مسلم يؤمن بالله وملائكته وكتبه ورسله واليوم الآخر - وأحسبني كذلك ولا أذكي نفسي على الله ، والله المستعان .<br />وانا لا أتبع سوى القرآن والسنة التي تتماشى مع العقيدة الصحيحة السوية وأحترم جميع الفرق والملل وأرجو أن أكون من الفرقة الناجية. وكذلك أحترم أصحاب العقائد الأخرى - الصحيح منها- ولا أعيب على أحد من الرسل لأنني اؤمن بهم جميعاً .<br />ويبقى لدي سؤال ما الهدف من نشر مثل هذه المقالات وفي هذا الوقت بالذات ؟<br />آلهم لا تؤاخذنا بما فعل السفهاء منا .<br />هل أنتهت جميع رؤى ومشاكل حزب الغد ولم يبقى سوى البحث عن مواضيع إثارة لكسب شعبية على حساب الدين . لا حول ولا قوة الا بالله .<br />أقول لحزب الغد ما هكذا تؤكل الكتف .<br />وأرجو من القائمين على هذه الجريدة البعد عن الإثارة الدينينة . والبحث عن حلول لمشاكلهم باللجوء الى الله وطلب المغفرة والتقرب اليه ليزيل عنا بعض ما نحن فيه من محن وفتن وتربص من اعداء الدين للنيل من أعظم من أنجبتهم البشرية على الإطلاق فقد ورد في كتب الحديث \"\" حدثنا عبد الله حدثني أبي حدثنا يحيى عن اسمعيل قال حدثنا قيس عن أبي سهلة عن عائشة قالت:<br />-قال رسول الله صلى الله عليه وسلم ادعوا إليَّ بعض أصحابي قلت أبو بكر قال لا قلت عمر قال لا قلت ابن عمك علي قال لا قالت قلت عثمان قال نعم فلما ج<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 43
subject = "حرام هجوم علي الحزب"
author = "عماد ابن دمياط"
posted = "2006-10-10"
text = "الاخ اللي بيظهر لينك بجريده المصريون<br />فانا مش هقوله ان الكلام اللي فيه غلط او صح<br />ومش هقوله ان كلامها اللي بيتنشر وخاصه عن الغد بيطلع غلط فيما بعد<br />لكني اقولك زي ماقريت الجريده(ان كنت قريتها اساسا)واضيقت اصبر العدد يوم الاربع واقراها وان لم تقدم اعتزار يرضيك اتكلم واشتمك والعن ولو عايز كوندليزا او اي شيء تقوله قولوه ايمن نور ليه ربنا<br />المهم ماتزعلش من كتابه في جريده انت ماقرتهاش وماشي مع الموجه الغضبانه<br />لو كنت غضبانت من \"السمع\"اقراها الاربع وشوف راينا ايه<br />ولكم التحيه"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 44
subject = "وحرام جنابك اسمه ايه ده النقد السياسك للصحابه"
author = "الكلام اللى جريدة المصريون كتبه راجل بيفهم مش بتاع اثارة ."
posted = "2006-10-11"
text = "وانت بقولنا انا مش هقول ان الجريدة كلامها بيطلع غلط عن الحزب ما انت قلت بس كلامك غلط الكلام انا شايف ان صح ولا انا لازم ابقى فى حزب الغد عشان اشوفه غلط .<br />وبعدين يعتذروا عن اقتناع مش تحت ضغط خوفا مننا الناس اللى راكبة الموج كله .<br />لكن اغلبهم قرنات ويقولك حريه وتعبير وكلام التعبان ده .<br />بس انا عن نفسى اتمنى انها متكررش من ناس مسلمه سنه كمان ولا يبقى سيبنا ايه للاجانب ."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 45
subject = "الى المعلق الاول"
author = "اوعا حد يقرب ناحية عائشة ام المؤمنين"
posted = "2006-10-11"
text = "حكم من سب ام المؤمنين عائشة<br />من سب أم المؤمنين عائشة رضي الله عنها بما برأها الله منه ، فقد أجمع العلماء انه يكفر .<br />قال القاضي أبو يعلي : (( من قذف عائشة رضي الله عنها بما براها الله منه كفر بلا خلاف )) .<br />وقد حكي الإجماع على هذا غير واحد من الأئمة لهذا الحكم .<br />فروي عن مالك : (( من سب أبا بكر جلد ، ومن سب عائشة قتل . قيل له : لم ؟ قال : من رماها فقد خالف القرآن )) . (<br />الصارم المسلول ص 566 ) .<br />وقال ابن شعبان في روايته ، عن مالك : (( لأن الله تعالى يقول : { يعظكم الله ان تعودوا لمثله ابدا إن كنتم مؤمنين }<br />فمن عاد فقد كفر )) . ( الشفا 2 / 1109 ) .<br />والأدلة على كفر من رمى أم المؤمنين صريحة وظاهرة الدلالة ، منها :<br />أولا : ما استدل به الإمام مالك ، ان في هذا تكذيبا للقرآن الذي شهد ببراءتها ، وتكذيب ما جاء به القرآن كفر .<br />قال الإمام ابن كثير : (( وقد اجمع العلماء رحمهم الله قاطبة على أن من سبها بعد هذا ورماها به بعد هذا الذي ذكر في<br />هذه الآية ، فإنه يكفر ، لأنه معاند للقرآن )) . ( راجع تفسير ابن كثير 3 / 276 ، عند تفسير قوله تعالى { إن الذين<br />يرمون المحصنات . . . } ) .<br />وقال ابن حزم - تعليقا على قول الإمام مالك السابق - : (( قول مالك هاهنا صحيح ، وهي ردة تامة ، وتكذيب لله تعالى<br />في قطعه ببراءتها )) . ( المحلي 11 / 15 ) .<br />ثانيا : إن فيه إيذاء وتنقيصا لرسول الله صلى الله عليه وسلم ، من عدة وجوه ، دل عليها القرآن الكريم ، فمن ذلك :<br />إن ابن عباس رضي الله عنهما فرق بين قوله تعالى { والذين يرمون المحصنات ثم لم يأتوا باربعة شهداء } وبين قوله {<br />إن الذين يرمون المحصنات الغافلات المؤمنات } ، فقال عند تفسير الآية الثانية : (( هذه في شأن عائشة وأزواج النبي<br />صل<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

