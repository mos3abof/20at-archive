[[comments]]
order = 31
subject = "كلام جمال سلطان اهوه وهو صحفى"
author = "جمال سلطان"
posted = "2006-10-08"
text = "هناك \"هوجة\" هذه الأيام في بعض صحف القاهرة عنوانها إهانة الصحابة وأمهات المؤمنين ، وخاصة السيدة عائشة الصديقة رضي الله تعالى عنها ، بعضها عبارة عن نوع من الإثارة الصحفية بقصد تحريك التوزيع الراكد للصحيفة كما يفعل عادل حمودة الذي ينشر الصور العارية وآخر أخبار الجنس وأسراره إلى جوار مقال مطول عن أم المؤمنين عائشة أجرى لها فيها شخص تافه محاكمة تاريخية مضحكة ، يفترض أنه قرأ في سبيل كتابتها مئات كتب التراث وكتب التاريخ ومئات آلاف الصفحات التي تناولت وقائع الفتنة الكبرى ، وهو لم يقرأ ولم يفهم ولا يريد أصلا أن يقرأ أو يفهم ، وإنما يريد أن يذهب آخر الأسبوع إلى شركة توزيع الأهرام لكي يستبشر بارتفاع نسبة التوزيع ، والمسألة سهلة ورخيصة ، تأتي بكتاب لأحد متطرفي الشيعة حيث يكون هجاء السيدة عائشة عنده أشبه بتسابيح الصباح والمساء ، ثم تنقل عنه بعض الصفحات دون الإشارة إليه ، هذا إذا برأنا القوم من الأموال المشبوهة التي كثرت في أجواء القاهرة هذه الأيام ، المفارقة المحزنة أنه بينما يشتكي العالم الإسلامي كله من مسلسل إهانة النبي الكريم صلى الله عليه وسلم في الصحافة الغربية ، وآخرها ما تجدد نشره في الدينمارك هذا الأسبوع في صورة تقارير ورسومات وأفلام تتصور الرسول على أنه داعية عنف وإرهابي ، بينما يحدث ذلك في الدينمارك يشتكي المسلمون في مصر من مسلسل إهانة أزواج النبي والصحابة الأطهار بما فيهم المبشرون بالجنة ، أكون مندهشا من أن صحفيا يفترض أنه كبير يخصص افتتاحيات صحيفته بالكامل ، والتي تبلغ صفحة كاملة من القطع الكبير لانتقاص صحابي جليل أو الهجوم على زوجة النبي ، وكأن مصر اليوم قد خلت من أي هموم من أي نوع ، فنضطر إلى الهروب إلى التاريخ البعيد من أجل أن نخوض معركة وهمية لا ناقة لنا فيه<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

