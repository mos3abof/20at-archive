text = "فى بداية الرد على من يزعم بان الصحابة ليسوا معصومين و الخ.. ابدأ بقول الله لعل احدهم يسمع او يعقل ولا ينطبق عليه قول من سيقول لو كنانسمع او نعقل ما كنافى اصحاب السعير ( وَالَّذِينَ جَاءُوا مِنْ بَعْدِهِمْ يَقُولُونَ رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالإِيمَانِ وَلا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَحِيمٌ [الحشر:10]،<br />و يفول رسول الله صلى الله عليه و سلم (لا تسبوا أصحابي، فوالذي نفسي بيده! لو أن أحدكم أنفق مثل أحد ذهباً ما بلغ مد أحدهم ولا نصيفه).<br />تلك نقطة ودت ان ارسيها قبل الردعلى من انتفخت اوداجهم دفاعا عن الحرية فى ابداء الرأى و نسوا حالهم ولم تسعفهم ذاكرتهم كيف كان حال الصحابة الذين نصروا رسول اله صلى الله عليه و سلم و امنوا به و جاهدوا معه حتى رضى الله عنهم و قبل بيعتهم فسبقوا الامة جميعا بمزية لا تأتى لاحد من باقى الامة ولو اجتمعت كلها و هى الاسبقية و نصرة رسول الله وقت لم يؤمن به ولم ينصرة الا القليل من اهل الارض . ( وَالَّذِينَ آمَنُواْ وَهَاجَرُواْ وَجَاهَدُواْ فِي سَبِيلِ اللّهِ وَالَّذِينَ آوَواْ وَّنَصَرُواْ أُولَـئِكَ هُمُ الْمُؤْمِنُونَ حَقّاً لَّهُم مَّغْفِرَةٌ وَرِزْقٌ كَرِيمٌ (الأنفال : 74 )<br />و حين يغيب التوفيق و ينفث الشيطان فى صدر الرجل فيظن ان له شأن و عنده رأى و قدر, وينسى ان اوله نطفة من ماء تعف النفوس ان تمسك بهاو اخره جيفة تعف الانوف ان تشم ريحها, فينطبق عليه قول الشاعر إذا لم يكن عونا من الله للفتى فأول ما يقضى عليه إجتهاده, و يظن ان كل شيئ مستباح له ان يبدى فيه برأيه ولو لم يكن متخصصا فيه او حتى عالما باولياته , فيظن كما ظن من كتب هذا البحث الذى ما هو ببحث ( لان الكاتب ليس متخصصا<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 39
subject = "الحوار اهوه عشان بنحب نلخص"
author = "جمال سلطان"
posted = "2006-10-10"
text = "عندما اتصلت بالسفير ناجي الغطريفي ، رئيس حزب الغد ، أحدثه عن ما فعلته صحيفة الحزب ، حدثني الرجل بأدب رفيع عن احترامه للمشاعر الدينية وأنه شخصيا لا يقبل أن تقدم أي إهانة إلى الصحابة أو أزواج النبي ، وأن الملحق المنشور يهدف إلى تقديم قراءة سياسية في تلك المرحلة ولا يتعرض بتقييم ديني ، وعندما عرضت عليه العنوان كان مذهولا ، واستغرب أن ينشر هذا العنوان الخطير ، لكني لاحظت أنه غير مدرك لخطوة ما نشر في النصوص ذاتها ، وأن الفكرة التي كانت لديه عبارة عن إطار عام بدون أي تفاصيل ، نحيت الاهتمام بالعنوان جانبا وسألته : عندما تأتي إلى صحابي جليل من العشرة المبشرين بالجنة ثم تقول أنه خاض القتال ضد أهل الحق وأراق الدم الحرام وضرب أعناق إخوانه من الصحابة في قتال مرير وكل ذلك من أجل أن يحصل لابنه على منصب مرموق في رأس السلطة ، هل هذا الكلام يمكن أن نقول أنه تقييم سياسي ، أم أنه بذاءة وسفاهة وسفالة ، تتعرض لصلب دين ذلك الصحابي الجليل ومروءته ، وتتهمه بأنه باع دينه بدنياه ، وأسوأ من ذلك أن يكون هذا الصحابي هو واحد من عشرة في بني البشر أجمعين بشرهم النبي الكريم بالجنة ، فيأتي شاب تافه لكي ينسب إليه أنه باع الجنة التي وعد بها من أجل عرض زائل رخيص ، هل هذا تقييم سياسي يا سعادة السفير ؟ ، ثم عندما تتحدث عن صحابي جليل في ثقل ومكانة وحرمة عثمان بن عفان رضي الله عنه ، ذي النورين ، والخليفة المهدي الراشد الثالث ، فتتهمه بأنه تآمر مع أسرته من أجل أن يمكن لهم في مال المسلمين يفعلون به ما يشاؤون وينهبون ما يحبون وكأنهم بعض لصوص البنوك في مصر الآن ، ويقرب أقاربه ويمكن لهم في رأس السلطة دون غيرهم على حساب مصلحة الإسلام والمسلمين ، هل هذا الكلام يدخل أيضا في باب التقييم السياسي أم في باب الشتا<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 40
subject = "بكل هدوء"
author = "عماد فريد"
posted = "2006-10-10"
text = "بعض شخصيات الأسلام لا يجب الإقتراب منها وتحديدا من مناطق معينة في حياتها وذلك لأننا ورثنا موروثا تاريخيا بأن لا مساس ونسينا أنه لا معصوم من الخطأ إلا محمد صلى الله عليه وسلم ،اتفق معكم أنه لا يجوز المساس بالشخصيات ولكن اختلف في حقي أن انتقد المواقف السياسية لأي شخص عدا الرسول ومع ذلك فإننا دائما مانكتب عن مواقف سياسية بالغة العبقرية للرسول ولخالد بن الوليد ولأبي بكر رضي الله عنهم ولعمرو بن العاص وفي رأي الشخصي أن المحلق الصادر عن الغد مشكلته الأساسية في العنوان فقط وأرى فعلا أن هذا العنوان صادم ومخيب للأمال ولكن اتفق في 90% مما ورد في المقال من سرد تاريخي"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

