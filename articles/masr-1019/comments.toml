subject = "آصحابى كالنجوم"
author = "الله الله على آصحابى كالنجوم، بآيهم إقتديتم إهتديتم. حديث شريف آرد بة على من يتطاولون على صحابة رسول الله بدعوى النقد وحرية التعبير. ولا حول ولا قوة إلا بالله العلى العظيم."
