author = "أبو هشام"
posted = "2006-10-11"
text = "الأخت نيفين :<br />تحية طيبة ..<br />تحاورت معك من قبل في موضوعات متعدة تحت اسم \" مصري \" و لكن وجدت هذا الأسم منتشر و يستخدم بكثرة في الموقع فاخترت اسم أبو هشام<br />الموضوع أكبر من ذلك بكثير ليس الأمر مجرد تعليقات أو انتقادات لكاتب في جريدة و لكن الموضوع هو اختراق شيعي لمصر .. أي أن الموضوع خطير<br />و إليك هذه المقالات و هي منقولة من موقع مفكرة الإسلام ::::<br />مفكرة الإسلام: في تحالف جديد من نوعه قام الشيعة في مصر بالتحالف مع العلمانيين من أجل نشر مذهبهم بين العوام عن طريق توزيع صحيفة تابعة لوزارة الثقافة المصرية لكتاب من تأليف مرجع شيعي لبناني وهو 'محمد مهدي شمس الدين' .<br />وأعلن صلاح عيسى ـ العلماني المعروف بعدائه لكل التيارات الإسلامية ـ رئيس تحرير صحيفة 'القاهرة' التي تصدرها الوزارة، أن صحيفته أصدرت الكتاب الثلاثاء 19/9/2006 بالتزامن مع حوالي 8 صحف عربية أخرى تصدر سلسلة شهرية توزعها مجانًا عبر مشروع تتولاه دار 'المدى' في دمشق.<br />وأوضح أن الكتاب عبارة عن وصايا قالها المرجع الشيعي اللبناني الراحل محمد مهدي شمس الدين وهو على فراش المرض في باريس, وادعى أنه لا يتضمن أي تبشير مذهبي.<br />على الجهة المقابلة اعتبر الأستاذ جمال سلطان رئيس تحرير دورية 'المنار الجديد'، أن صدور الكتاب تم بمناسبة شهر رمضان، منتقدًا استيراد كتاب من خارج مصر التي تتمتع بوفرة في علمائها الشرعيين، مؤكدًا أن توزيع كتاب لمرجع شيعي لا يمكن قبوله في دولة كل سكانها من السنة.<br />وتساءل: لمصلحة من نشر كتب تبشيرية لمذهب آخر في مصر، بينما نشهد صراعًا مذهبيًا في العراق والخليج، وكيف يكون هو هدية صحيفة حكومية لمجتمع سني بمناسبة شهر رمضان المبارك .<br />واتهم في تصريحات لـ'العربية.نت' مصادر شيعية في الكويت بتمويل نشر هذا الكتاب، متسائلاً عن سب<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

