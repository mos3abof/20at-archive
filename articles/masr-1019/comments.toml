text = "الرجاء من كل قيادات حزب الغد المتنورة والتى تححب رسول اللة واصحاب رسول اللة ان تقدم اعتذار لكل مسلم وان لا يتكرر هذا مرة اخرة ونحن اعضاء الغد نرفض هذا السلوك من الجريدة واعتقد لوكان الدكتور ايمن نور موجود كان لايمكن ان يحدث هذا واعتقد المسئول عن هذا هو المسئول عن الجريدة فى غياب الدكتور ايمن نور ويجب ان يستقيل من الجريدة لانة وضع الحزب والجريدة واعضاء الحزب وايمن نور فى موقف عجيب وغريب"
