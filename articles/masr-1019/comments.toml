subject = "الى ايمن امام"
author = "ايمن العربى"
posted = "2006-10-09"
text = "لماذا كل هذا الغل والحقد على الغد ووالكتب واخذ الثمن كل دها كلام فارغ وكلام ليس لة معنى الغد قوى وزعيمة فى قلب كل مصرى ان ايمن نور لا يقبل ان تهاجم الجريدة الصحابة ولا نحن اعضاء الغد لا نقبل ذلك نحن نحب رسول اللة وال بيت رسول اللة واصحاب رسول اللة علية الصلاة السلام الاخ ايمن امام الجا بلاش كلام اختراق الجريدة والامن والكلام ده الاستاذ ايمن بركات لم يقول هذا الكلام قال هناك اجتماع وسيتم التحقيق واعتقد ان الجريدة سوفة تعتذر فى العدد القادم كما اعتذر الحزب على موقع الغد ونحن اعضاء الغد نعتذر لكل الشعب المسلم ونحن نرفض هذا السلوك وفى نفس الوقت نحن مع زعيم الحزب والقائد والزعيم ايمن نور حتى يعود با السلامة"
