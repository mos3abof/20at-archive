text = "(( لقد ولد النبى صلى الله عليه وسلم دون ان تتالم امه بولادتة ))<br />ما هذا الكلام يا اخى فى الاسلام هذه العبارات الرنانه \"المعجزيه\" لن تضيف ولن تقدم او تؤخر من مكانه رسول الاسلام محمد عليه الصلاه والسلام."
