author = "ايمن امام"
posted = "2006-10-06"
text = "يبدو ان حزب الغد المؤلم بعد ان فقد تأييد منى مكرم عبيد والاتحاد الاوربى- اراد تن يغازل جونزالزارايس- ليقول لها انا ابنك الغير شرعى سأسب الاسلام لاثبت ولائى لكى- انا صنيعه المسيحيين فى مصر وزعيمتهم منى مكرم عبيد- انا على الولاء الدائم وهذا هو البرهان - الم تلاحطوا ان تصريحات المسئولين عن الحزب تصريحات - تافهه وكاذبه ماذا يعنى انهم سيتولون التحقيق - يعنى نشكل لجنه واللجنه تشكل لجنه وشالوم على اللجان- عيب عليكو ياشويه مرتزقه- كل واحد قبضله شيك باليورو او الدولار- يقولك ها اشكل لجنه لجنه ايه -جريده قذره ومحرر كافر -من سب الصحابه كافر- هذا ليس رأيى - هذا رأى علماء الدين - المهم محرر قذر وجريده قذره وشويه مرتزقه - اختاروا ان يغازلوا امريكا والناظر بتاعها فى مصر بيفتش على صبيانه- وهم لم يستحييو -عندما قالت المعزه الامريكيه - ان هؤلاء وهم عنها شربوا ميه بس - لكن هنا اتعشت ما معنى هذه الكلمه- فى العرف الدبلوماسى اليس معناها انهم شويه صبيان لاقيمه لهم يادوب شويه ميه-يعنى كل واحد ومقامه فاكرين زمان لما كان فى واحد بيتباهى انهم عشوه مرتين فى يوم واحد - المهم نعود الى لجنه حزب الغد - البجاحه انهم يقولوا ان الامن اخترق الجريده نكته بايخه ياابن الجريده انتا وهوا - وكمان بيقولوا ان اللى حصل دا المقصود بيه ضرب ايمن نور والقضاء على شعبيته- يعنى لما تكونوا عاوزين ترفعوا واحد تخلوه يسب فى الصحابه وتقولوا ابداع ولما تكونوا عاوزين تقبضوا شيك باليورو - تقولوا الامن العيب مش عليكو العيب على اللى انخدع فيكم وافتكركم ناس محترمه - واستطرادا للنكت البايخه- يطلع واحد يقولكم - اصل حميده شيعى - مع ان عمرى ماعرفت واحد بتاع عربيه كبده شيعى - المهم الموضوع كله قلاف فى قرف والاحداث اثبتت ان كل من على الساحه -<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 12
subject = "الي اشاوس الاسلام !!"
author = "عبد من عباد الله"
posted = "2006-10-06"
text = "طيب لما الصحابه مقدسين لا يخطئون واحنا ولاد ستين كلب بنسمع اغاني عمرو دياب علشان كده ميحقش لنا نتكلم عن الصحابه<br />طيب العشرون الف الي ماتوا في معركة الجمل ... ذنب مين ذنب عبد الله بن سبا ولا يمكن ايمن نور ولا رجب حميده بتاع الكبده<br />وهو النقد معناه الشتيمه<br />لما نقول دراسه موضوعيه نقديه من اناس يمتلكون الادوات التي تمكنهم من ذلك ... وطبعا مش قصدي الصحفي الحمار الي كتب الموضوع ووضع ام المؤمنين عائشه وسيدنا عثمان في القائمه الغبيه<br />يعني احنا لازم نقرا التاريخ علي طريقة ابن تيميه .... هو كان ابن تيميه مقرر علينا في القران يعني<br />ومينفعش حد ان يجتهد بعده ويقرا التاريخ والاحداث بشكل مختلف<br />من غير شتايم ولا تكفير يا اشاوس الاسلام<br />انا واالله مسلم زيكم وسني كمان مش شيعي عشان الجماعغه اللي عندهم حساسيه من الشيعه"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 13
subject = "معلش اصل اشووس صغنن"
author = "BATISTUTA"
posted = "2006-10-07"
text = "قبل الدخول فى جدال فلسفى وهرطقة ولا اعلم والله نيتك فيهاولا نية الاخوة المثأفين العقلاء المفكرين اصحاب النقد والفكر لان الله اعلم بالنوايا.<br />عندما تريد نقد احد فيجب ان تكون على قدر خلقه او قريب منه فلا يصح ان اكون على اتصال قليل بدينى وانا اسقط على نفسى حتى لا يشتغل اخواننا العقلاء بالرد على وتفنيد كلامى واستخلاص السقطات للرد والافحام اقول لايصح ان اكون غتر ملتزم تماما بالدين مثل الصحابة وانتقدهم اما بالنسبة ان النقد سياسى لا علاقة له بالدين اقول انا اعذرك لاننا فى العصر المتقدم التكنولوجى على ضرورة فصل السياسة عن الدين وهذا رأيك ولكنى اختلف معك ومن اتفق معك فانا ارأى وكذلك الاخوة الاساوش ان السياسة جزء من الدين .<br />اما بالنسبة لموقعة عين الجمل فما حدث فيهافقد تعددت مصادرها لعدد من الرواة لذا لابد ان يكون احدهم صادق والاخرين كاذبين .<br />لو انكم حريصين على المعرفة لاتجهتم الى من عندهم المعرفة من علماء وشيوخ المسلمين الافاضل لكن هناك من يبتع هواه وما يرتاح اليه وهو ارتاح على ان ماحدث سببه عائشة والزبير وبالمرة على بن ابى طالب وعمرو بن العاص معاوية هو حر ولكن ليس كل ما يعتقده الانسان دائما صحيح اما من يريدون نقد الصحابة لانهم كذا وكذا اتلهوا رحوا انقدوا كبير بلدكم وابنه يا اشاوس اكتب باسمك وايميلك ان الرئيس مبارك كذا وكذاولا انتم اشاوس بس على الصحابة .<br />ثم هل اخطاء الصحابة دا لو كان فيه مثل اخطاؤنا حتى لو اخطئوا بيتراجعوا عن الخطأ ولا يصروا عليه وبعدين كده او كده الرسول قال لا تسبوا اصحابى خالف النبى يا مفكر"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 14
subject = "تعقيب اخر لانى اعلم انى لن انتهى مع المجادلين"
author = "BATISUTA"
posted = "2006-10-07"
text = "النقد غالبا ما يكون باطنه السب ولك واحد ونيته هل هو بينقد لان عنده عقدة نقص بيفرغها فى الصحابة ولا حقد عليهم ولا زى ما بيقول بيصلح لافض فوه فى المجتمع"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 15
subject = "حق النقد لمن و على من"
author = "مسلم"
posted = "2006-10-07"
text = "سئل رسول الله عن أحب الناس إليه فقال عائشة ,, و قال عن الصحابة رضوان الله عليهم :: لا تسبوا أصحابي و اللذي نفسي بيده لو أنفق أحدكم مثل جبل أحد ذهبا ما بلغ مد أحدهم أو نصيفه \"\" و المد هو الحفان في اللهجة العامية :: يعني لو إن مننا واحد أنفق في سبيل الله من الأموال مقدار جبل أحد فلن يبلغ ثوابه مثل ثواب صحابي أنفق من الأموال مقدار ملئ اليد فقط<br />و عندما ذكر الله تعالى الصحابة في القرآن قال عنهم : محمد رسول الله و الذين معه أشداء على الكفار رحماء بينهم تراهم ركعا سجدا \"\"<br />هذا لمحة شريعة عن الصحابة الذين مدحهم الرسول صلى الله عليه و سلم و مدحهم الله عزوجل في قرآن يتلي إلى يوم القيامة.<br />فمن يكون له الحق في نقدهم كما يزعمون بل يقولون إننا ننقد المواقف السياسية فأي تجنى هذا على أكرم الخلق .. و إذا كانت تلك دعواهم فإن أي شخص لا يكون بمنأي عن النقد حتى الرسول صلى الله عليه و سلم<br />يا ناس افهموا الصحابة مدحهم الله و رسوله فمن نحن حتى نقول ننتقدهم و هل بعد شهادة الله تعالى لهم أي شئ الرسول صلى الله عليه وسلم قال عن عثمان ما ذر عثمان ما فعل بعد اليوم عندما جهز جيش المسلمين في تبوك ,,ثم يأتي من لا يعرف عدد السنن الرواتب في اليوم ينتقد عثمان ... عمرو بن العاص أدخل الإسلام و نشره في مصر ثم يأتي من لا يحسن الوضوء يقول أنا أنتقد عمرو بن العاص<br />لو أن منك شخص واحد قدم للإسلام 1% مما قدمه أي صحابي كريم ساعتها يمكن نسمع له و نناقشة أما و حالهم هذه فكيف بالله تعالى نسمح لهم بالتهجم على من هم أكرم الناس بعد الأنبياء<br />ولمن له دراية بسيطة بعقائد و آراء الشيعة فالبد و أن يتضح لهم أن هذا الكلام منقول بصورة حرفيا من أفكارهم و هم في مصر أصبح لهم صوت و تواجد فكيف يستغفلنا الكاتب و يقول ليس للتدخل الشيعي<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 16
subject = "لا يوجد شخص منزه عن الخطأ"
author = "فاطمة"
posted = "2006-10-07"
text = "انا اعتقد انه من حقنا نقد الصحابة و التعلم من اخطائهم و لا يوجد شخص منزه عن الخطأ و حتي رسول الله صلي الله عليه و سلم أخطأ و اعترف بخطئه و أصلحه و كل مسلم قاريئ للقرآن يعلم ذلك جيدا و قد كان باستطاعة الله عز و جل أن يجعل نبيه منزها من الخطأ لكنه سبحانه و تعالي أراد أن يعطينا العبرة و الموعظة"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 17
subject = "كبت"
author = "مدحت"
posted = "2006-10-07"
text = "على الرغم من كم المشاكل المحيطة بنا من كل جانب يتجه البعض الى التفتيش عما يمكن أن يستخدمه للاساءة لمن تمكنوا باقتدار من اقامة مجتمع ناجح دينا و دنيا. فى تصورى المشكلة نفسية وليس لها علاقة بالصحابة. غريب حقا امر هذه الرغبة فى التجريح والاساءة المغلفة بكلمة \"نقد\" و المدعومة بأقوال مثل \"أنهم ليسوا ملائكة\" و \"لايوجد شخص منزه عن الخطأ\" و \"نحن في حاجة ماسة أن تكون لدينا الشجاعة في نقد كل رجالات تاريخنا الإسلامي\" وهلما جرى."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 18
subject = "الي الاشاوس مره اخري"
author = "عبد من عباد الله"
posted = "2006-10-07"
text = "اللهم اهلك السلفيين<br />التكفريين بالعلمانين المستغربين ونجنا من بينهم سالمين يارب العالمين<br />اللهم دمر ملك ال سعود وال مبارك وال عبد الله<br />بص يا سيد باتيستوتا هو انا قلت لك انا شيخ الاسلام .... لا ياعم انتي احسني مني عند ربنا ... انا اكثر خلق اللله ذنوبا .... لكن ده علاقته ايه بال انا بتكلم عليه..ديكتاتورية مبارك اللي انت زعلان منها تفرق ايه عن ديكتاريويه معاويه بن ابي سفيان رضي الله عنه ... وملف التوريث قديم من ايام معاويه رضي الله عنه<br />ياسيدي افهموا يلعن ابو الغباء<br />ليس انتقاصا من قدر الصحابه ان تتناول مواقفهم السياسيه بالنقد والتمحيص بعيدا عن لغة الشتائم والسباب ... وانا عندما اقول نتناول سيرتهم بانقد والتمحيص ن لا اقصدك انت او انا بل اقصد من هم مؤهلين لذلك علميا<br />النقد ليس معناه السباب او الشتيمه<br />لكن انت ماتعرفوش يعني ايه نقد بالاساس لانك تيار عنصري يتلفع عباءة الدين ويرفض كل مخالف له ولا يقبل الا من يتماهي مع اطروحاته<br />قريبا سينضب البترول السعودي وينضب معه التيار الديني العنصري الذي احتكر الاسلام حصريا كما يحتكرون قنوات الرياضه<br />فاهم حاجه من اللي انا بقوله ."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 19
subject = "احذروا"
author = "سالي مشالي"
posted = "2006-10-07"
text = "الحمد لله رد محمد بدوي واشرف ومسلم بشكل اكثر من ممتاز بحيث وجدتني لا احتاج الى اضافة تعليق ، ولكن ملاحظة صغيرة للمخلصين في البحث عن الحقيقة والمحبين لله ورسوله والصحابة<br />واقعة الفتنة بها كثير من الروايات الموضوعة والغير صحيحة ، وهذه الروايات مشتهرة لدرجة ان الناس تتعامل معها على انها حقائق مفروغ منها ، وهذا خطأ كبير ، وبالتالي من يريد ان يتثبت ويتاكد من معلوماته حول هذه الواقعة عليه ان يقرأ في كتب أهل السنة الصحيحة ويمكنه الاستعانة ببعض كتب الدكتور جمال عبد الهادي والتي تبين الصحيح من الموضوع في هذه الروايات .<br />الملاحظة الثانية : ان من يبحث من الافضل له ان يبحث ليثقف نفسه طالما انه ليس متخصص وبالتالي فليس مطلوب منه ان يكتب عن الموضوع الا اذا درسه بعناية ودرس كل جوانبه فترة كافية ولا ينسى ان من الصحابة انفسهم من امتنع عن المشاركة في الحرب مع اي من الطرفين ، وامتنع ايضا عن الادلاء برأيه فيما حدث لعلنا نتعظ !!"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 20
subject = "الى مستر عبد من عباد الله"
author = "BATISTUTA"
posted = "2006-10-07"
text = "اللهم اهلك العلمانيين والفلاسفة المجادلين والمتثقفين والمتفكرين .<br />وعشان متزعلش نفسك اللهم دمر آل سعود الف مرة وآل مبارك وآل عبد الله .<br />بس لو سمحت لى فى فرق شاسع جدا بين مبارك ومعاوية الخطأ الوحيد الذى وقع فيه معاوية هو توريث الحكم لابنه يزيد ولكن هل لخطأ سيظل الرجل وهو صحابى كذا وكذا ...الخ من النقد فى نظرك والسباب فى نظرى، معاوية لا يقارن بمبارك ابدا لانه لاتصح المقارنه بين رجل يخشى الله ورجل لا يعرفه .<br />الله وحده اعلم بمنزله معاوية وهل غفر له ذنبه فى التوريث ام لا لذا لايحق لى او لك ان نتتدخل فى حكم الله اما النقد فانا اتفق معك انه ولاسف اول من ابتدع التوريث فى الاسلام معاوية رحمه الله .<br />وعشان متزعلش اكتر يلعن ابو المكر والدهاء المتمسح فى النقد والتمحيص .<br />وقولك انه لا انا ولا انت الذين سننقد ويرد الى من له علم من هم اصحاب العلم اكيد هم الشيوخ وعلماء المسلمين اذه واستمع الى أرآئهم فى تلك المسألة .<br />ملحوظة ليك انت ياللى مش فاهم التيار السلفى مش فى السعودية بس لا دا موجود فى مصر يعنى مش محتاج لا بترول ولا ينضب ولا ما يتحرق حتى فاهم انت حاجة ولا هنفضل نتفلسف كتير يا ابو الذكاء كله ."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 21
subject = "الى كل الذين اعتبروا انفسهم حماة الصحابة"
author = "معاذ محمود عامر"
posted = "2006-10-07"
text = "الذين اعتبروا أنفسهم مدافعين عن الصحابة الكرام<br />أنتم لستم أكثر حبا منا للصحابة<br />يعلم الله ما في القلوب من حب واحترام لأدوارهم في حماية الرسول صلى الله عليه وسلم ودعوته<br />كما أنني عندما تكلمت عن تصرفاتهم السياسية لم أتكلم بتاتا عن فصل الدين عن السياسة مثلا<br />وانما أتكلم أن قيمتهم كعباد وكمدافعين عن النبي تنفصل عن بعض التصرفات السلبية التي فعلها بعضهم,فلو حكمنا عليهم بمقياس<br />الايمان والورع<br />يبقى معنى كده اننا بننفي عنهم أو أي حد متدين وورع انه يغلط<br />وعموما الأخ اللي قال ان النقد جوهره السب<br />ده عشان انت مش فاهم يعني ايه نقد<br />النقد مش اصطياد أخطاء عالفاضي ولا سب<br />النقد هو النقد ومالوش معنى غير كده<br />والنقد يكون للتاريخ فقط لا غير<br />وعموما يا أسود الله كما تحسبون أنفسكم<br />أنتم لستم حملة توكيل الدفاع عن الدين"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 22
subject = "عذر اقبح من ذنب"
author = "ايمن امام"
posted = "2006-10-07"
text = "رئيس تحرير الجريده لايفهم مكن تعليقه للعربيه سوى انه مؤيد لما كتب وتعمد تسطيح الموضوع - بالضبط مثل موضوع حيدر حيدر فى روايه وليمه لاعشاب البحر عندما دافعواعنه بأن ما كتب فى القصه ليس على لسان الكاتب ولكنه على لسان بطل الروايه وبالتالى فأن الكاتب غير مسئولوبطل الروايه هو المسئول- اقول لهذا الشىء المسمى رئيس التحرير- انك انسان ابسط ما يقال عليه انك تلوكط الحقائق وانك مغرض وتتحمل مسئوليه كل حرف كتب فى هذه المقاله العفنه التى لاتصدر الاعن شخص عفن لايعرف سوى ارضاء اسياده الذين دفعوا له الثمن - وبصراحه شديده انتم تجرون هذا البلد الى المجهول - لان رد الفعل على ما يحدث لايضمنه احد - فقد تقوم جماعه ما بتنصيب نفسها مدافعه عن الدين وتستخدم العنف كرد فعل ساعتها ستتحدثون هن الارهاب والظلاميين وتعتبرون هذا او ذاك شهيد القلم الحر وتنصبونه ضحيه وتكتب الاقلام عن سماحه الدين الاسلامى وان هؤلاء لايفهمون فى الدين شىء ويخرج علينا احد العلماء الموظفين ليقول لنا ان هؤلاء مجموعه اوباش وانه يحق للحاكم قتلهم ويخرج علينا شيخ الازهر ليعلن احقيه الحاكم فى ضربهم بالجزمه وقتلهم ويخرج علينا علماء النفس ليحللوا شخصيات هؤلاء الارهابيين وانهم يعانون من امراض نفسيه وان سبب ما وصل اليه مسلك زعيمهم ان ابوه زمان رفض ان يشترى له استيكه - ورفض ان يشترى له وجبه من كنتاكى فخرج الولد حاقدا على كل من يأكل فى كنتاكى ثم يعتدل فى جلسته امام الشاشه ليعلن للمذيع انه سيبوح بسر عرفه من مجرى التحقيقات وليس مجرى البول - هذا السر هو ان احد هؤلاء الارهابيين قبل استجوابه سئله المحقق هل ستشرب الليمون بدون ان تأكل فأجابه الارهابى بأنه يحلم بوجبه كنتاكى - وعلى الفور رق قلب المحقق وامر بأحضار وجبتين للارهابى وعلى نفقته الخاصه وتغاضى عن<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 23
subject = "الأخ معاذ محمود ... النقد إلى أين ؟؟؟"
author = "مسلم"
posted = "2006-10-07"
text = "الأخ معاذ محمود تحية طيبة<br />النقد ..... إلي أين ؟؟؟؟<br />أولا أخي الكريم أنت تقول أن النقد ليس موجه لشخصية الصحابة و لكنه موجه لأفعال و مواقف سياسية أقول لك حسنا و بعد ذلك سوف ننتقد المواقف الاجتماعية للصحابة دون المساس لشخصياتهم .. و بعدها ننقد المواقف الثقافية و الأحوال العلمية لهم .. وبعدها ننقد الحياة الاجتماعية و والملابس و عادات الأكل و الشرب ... كل ذلك و نحن لا نمس شخصيات الصحابة و نعترف لهم بالفضل و الإيمان ..<br />بالله عليك أخي عمر ألا ترى ما يمكن أن يصل بنا الاستطراد في النقد للصحابة .. أقول لك و لا تستبعد كلامي فإن المقدمات تدل على النهايات<br />نقد الصحابة تحت أي مسمى تريده أنت سوف يجرنا بكل الأحوال إلى نقد الرسول صلى الله عليه و سلم أنت الآن تنفي و تقول لا لن يصل الأمر إلى هذا الحد و أنا أقول لك بل سيصل<br />أليس الرسول هو من ربى هؤلاء الصحابة و علمهم أليس هناك مواقف كثيرة للصحابة سوف تقومون بنقدها ثم تفاجءون أن الرسول صلى الله عليه و سلم كان طرفا في بعض هذه المواقف مما يعني بالضرورة نقد مواقف الرسول أيضا .. بل إذا كان الرسول لا ينطق عن الهوى أليس ذلك اجترار لنقد القرآن أيضا ... أتخيلك الآن و أنت تقول لا لن يحدث هذا .. و أنا أقول لا بل سيحدث .. حتى يصل بنا الأمر إلى نقد أفعال الله عز و جل و نقو و العياذ بالله نحن لا ننقد الله بل ننقد التاريخ و المواقف ..<br />أخي الكريم لو أن قاسم أمين كان يدرك أن دعوته لتعليم المرأة سوف تصل في النهاية إلى ما وصلت إليه مما نراه في الجامعات و الشوارع أظنه لن يصدق<br />أخي الكريم إذا كان الصحابة و هم من اختارهم الله عز و جل لحمل رسالة الإسلام إلى البشرية إذا كانوا هم محل النقد فماذا تبقى لنا .. أليس نقدهم مقدمة لإلغاء كل ما هو مقدس و و معظم في حياتن<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

