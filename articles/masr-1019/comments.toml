text = "أصحاب النبى هم أهلنا وسادتناوالسيرة التى نفخر بها فى ظل وضعنا الذى يسر العدو ولايسر الحبيب...ومن هنا يجب أن نلتمس العذر لكاتب التحقيق فلعله من المجتهدين الذين لهم الأجر عند الخطأ وعلى الأخوة الأفاضل عدم الخوض فى شخصه حتى لانرتكب مابه نعاقب من الله علام الغيوب وأرى أن يناقشه علماء الأزهر فيما ذهب إليه هذا هو الطريق الوحيد ... بعدها سيظهر هلال الحق ويكون هو الرأى المصطفى."
