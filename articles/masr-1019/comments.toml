text = "ما حدش قال ما ننقدش الصحابة، لأنهم مش معصومين فعلا، المشكلة مش في إن أنا أقول إن الصحابي الفلاني أخطأ في الموقف ده، ولا هي دي المشكلة في المقال، لكن لما يبقى عنوان المقال أسوأ عشر شخصيات في الإسلام، يبقى لازم نقف، معلش يعني إحنا مهما بلغنا مش هنكون زي الناس دي، حتى لو كان ليهم أخطاءهم، لازم بس يا جماعة نعرف إزاي نعبر عن اللي احنا عايزين نقوله بطريقة صحيحة"
