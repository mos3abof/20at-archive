subject = "ارفع العصابة السوداء عن عينيك"
author = "اشرف"
posted = "2006-10-18"
text = "الى مكفر الفئه الباغيه !يارجل-- اقول لك رب العالمين قال-- ومع زلك تتكبر على الله وترفض اياته ساكتب لك الايات لعلك تفهم ؟واشك فى زلك-- وان طائفتان من(المؤمنين) اقتتلوا فاصلحوا بينهما-- فان(بغت) احدهما على الاخرى فقاتلو التى تبغى حتى تفىء الى امر الله صدق الله العظيم بالله عليكم يااصحاب العقول افيدونا -- ماذا سمى الله الطائفتين؟ الم يقتتلوا؟ الم تكن فيهما طائفة باغيه ؟ ماذا سمى الله الطائفتين فى اول الايات ؟ لم يقل سبحانه وان طائفتان من المسلمين -- بل قال من المؤمنين -- وفرق بين الاسلام والايمان كبير اشك انك تعرفه -- ارجع الى اخر سورة الحجرات نفسها وانت تعرف ---- ثم انك بجهلك زكرت نص حديث رسول الله (صلى الله عليه وسلم) ولم تزكر اسناده -- ياسيد يامبجل راوى الحديث هو عمرو ابن العاص حليف معاويه بن ابى سفيان وكان موجها كلامه لابو الغاديه قاتل عمار فحديث النبى عليه الصلاة والسلام (خاااااص) بقاتل عمار -- فدخول النار خاص بقاتل وسالب عمار -- يارب تكون فهمت -- اما موضوع الايات المكيه والمدنيه فياريتك تقرأ بتانى وتفهم المقصود --فقدقلت لك ان الايات التى استشهدت بها لايصح ان تقصد بها الموحدين بالله المؤمنين برسوله والله سبحانه وتعالى يخص بها المشركين (افنجعل المسلمين كالمجرمين مالكم كيف تحكمون) -------- دع ماجرى بين الصحابة فى الوغى--- بسيوفهم يوم التقى الجمعان ---- فقيتلهم منهم وقاتلهم لهم---- وكلاهما فى الحشر مرحومان--- والله يوم الحشر ينزع ما----- تحوى صدورهم من الاضغان--- والويل للركب اللزين سعوا الى----- عثمان فاجتمعوا على العصيان---- ويل لمن قتل الحسين فانه----- قد باء من مولاه بالخسران----- لسنا نكفر مسلم بخطيئة-----فالله زو عفو وزو غفران"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

