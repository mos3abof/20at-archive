[[comments]]
order = 3
subject = "كلمتين وبس"
author = "معاذ محمود عامر"
posted = "2006-10-06"
text = "الشخص الذي يدعي أنه انسان<br />وليست فيه من الانسانية شيء ماهو الا نموذج آخر للتطرف الذي سرى بيننا كسرطان<br />يا هذا, اتطلب عدم السب والاهانة ثم تسب وتهين وتصف المخالفأنه أحمق وغبي<br />طب سيبك من أحمق أو غبي لأنهم مش شتيمة أوي انماهما صفتان<br />لكن كمان حرمته من دخول الجنة<br />بالنسبة للموضوع نفسه فأنا أرى أنه من حقنا أن ننتقد السابقين وأن نفند التاريخ طالما كان هذا في حدود النقد الموضوعي لا السباب الفارغ<br />وهناك مواقف للصحابة أخطؤا فيها<br />وهم أنفسهم_رضوان الله عليهم_ لم يدعوا العصمة ولا الطهارة من الأخطاء<br />وليس معنى أنهم مبشرون بالجنة أنهم بلا أخطاء<br />والحقيقة أن النقد الذي وجه لم يكن نقدا لهم من الناحية الدينية والايمانية فكلنا نتفق على دورهم الجليل في الاسلام وعلى ورعهم وتقواهم<br />ولكن النقد كان من قبيل نقد التصرفات على المستوى السياسي والفكري<br />لذلك علينا أللانتشنج من مجرد أن نسمع أنهم منتقدون في كذا أو كذا<br />فلا يوجد أحد فوق النقد<br />والصحابة ليسوا ملائكة وليسوا أنبياء<br />والنبي ذاته كان معصوما في الأمور التبليغية والدينية البحتة ولم يمنع هذا أن يجعله الله يخطئ حتى لا نظن فيه أنه ملاك<br />أولم يعاتبه الله عز وجل في كثير من الأمور الحياتية والتصرفات السياسية<br />هل أنقص هذا من عظمته وعصمته في الدين شيئا؟ مع أنه كان نبيا موحى اليه<br />فما بالنا بصحابته الذين لم يقل _ص_ مرة أنهم معصومون<br />علينا أن نكون أكثر مرونة<br />وأكثر عقلانية<br />وعلى كل مخالف أللا يكفر الآخر<br />وال فليرحمنا ويرحم نفسه ولا يتناقش مع مجموعة من الكفرة"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 4
subject = "الى ؟"
author = "مدحت"
posted = "2006-10-06"
text = "لتكن لدينا الشجاعة لنقدانفسنا اولا وبعد ذلك نتجه لنقد الآخرين. امهات المؤمنين والصحابة رضوان الله عليهم لهم فى نفوس المسلمين من الاجلال والحب والتوقير درجة عالية هم بلا ادنى شك اهل لها. انا ارى القول بأنهم ليسوا ملائكة كلمة حق اريد بها باطل.غريب امر هذه الجرأة فى تناول سيرة الرسول صلى الله عليه وسلم و السيدة عائشة التى هى ام المؤمنين والصحابة الكرام الذين جاهدوا مع الرسول صلى الله عليه وسلم فى حياته وبعد مماته من اجل حماية هذا الدين وتدعيم وجوده ووصوله لاجيال عديدة من بعدهم."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 5
subject = "اين الندية"
author = "محمد بدوى"
posted = "2006-10-06"
text = "السلام عليكم ورحمة الله وبركاتة<br />ألا يكفنى ما يأتى من الغرب من احتقر للدين الأسلامى وللرسول عليه افضل الصلاة والسلام الا يكفنى والصحابه رضى الله عنهم اجمعنا<br />يلها من مأساة حقيقة من جريدة عربية مسلمة ولكنه بعد هذا العدد لا تمت بصلة الى العروبة ولا السلام بشىء<br />ايها السادة الستم معى فى انا الناقد لأى شيء يجن ان يكون هو فى نفس مستوى المنقود فيكيف لنا ان نحاسب هؤلاء الصحابة والتابعين رضى الله عنهم وبأى منطق؟؟!!<br />اليس رسول الله صلى الله عليه وسلم هو القائل ( لاتسبوا اصحابى فمن سب اصحابى فقد سبنا ) صدقت يارسول الله<br />اين هذا الغائب عن الوعى من مقولتة اليس الصحابة بشر ولهم اخطاء نعم هم لهم اخطاء لكن اين الأدب مع رسول الله واصحابه رضى الله عنهم<br />اليس رسول الله هو القائل ( لمناديل سعد فى الجنة خير من الدينا وما فيها ) وهذا كله الم يبن لنا مكانة الصحابة فى الأسلام<br />أعتقد أنها قلى ادب ووقاحة هتك لعرض الدين الأسلامى<br />اليس من الميثاق الصحفى ان يتواجد من ينوب عن هؤلاء الصحابة للدفاع عنهم<br />تخلى معى لو انا كلام من هذا الكلام الوقح الذى سوف يكون مواقعة زبالة التاريخ قيل عن سيدةمثل السيدة سوزان مبارك مثلا<br />اعتقد ان الذى سوف يحدث<br />ان هذه الجريدة لن يطلع عليه شمس وانا صاحب المقال سوف ينتهى من على وجه الدينا وسوف يدمر الحى الكائن بها الجريدة<br />حرام عليكم اتقى الله وكفى تجريج فى الأسلام وامهات المؤمنين ( اليست عائشة من أفضل نساء العالمين كم اخبرنا رسول الله ) اين انتم ياعلماء المسلمين<br />ان الضربات تتولى على الاسلام وامهات المؤمنين يهتك عرضهم ورسول الله يسب اين انتم يعلماء المسلمين من هذا كله<br />الم يحن الوقت بعد للدفاع عن الاسلام"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 6
subject = "للحديث بقيه"
author = "اشرف"
posted = "2006-10-06"
text = "بسم الله الرحمن الرحيم ( تلك امة قد خلت لها ماكسبت ولكم ما كسبتم ولا تسالون عما كانو ا يعملون) اولا انا لم اقرا المقال من جريدة الغد لانى ماعدت اشتريها منذ حبس د: ايمن نور وتدهور حال الحذب الى ادنى مستوى له ثانيا تعليقا علىكلام الساده القراء لنعلم جميعا ان هؤ لاء الصحابه هم من اختارهم الله عز وجل بارادته ليكونوا نصرا وعزا لرسوله الخاتم (صلى الله عليه وسلم ) اما مايقال عن نقد الصحابه رضوان الله عليهم ) فبالله عليكم من ينقد من ؟ اينتقد الرمم القمم سبحان الله ؟ومع زلك نقول والله المستعان ليعلم كل مسلم ان صحابة رسول الله نعم اختلفوفيما بينهم وتقاتلو بالسيف ولكن السؤال هل تقاتلو لمنصب اوجاه ام لرأى ارتأه كل منهم انه فيه نصرة لدين الله ؟ وقد سأل على (رضى الله عنه ) عن قتلى المسلمين من الفريقين فى صفين فقال من قاتل فى سبيل ان تكون كلمة الله هى العليا فهو فى الجنه وفى معركة الجمل امر مناديه ان لا يتبع مدبر ولا يزفف على جريح ولم يستحل الاموال ولا السبايا واعاد السيده عائشة (رضى الله عنها) معززة مكرمة مع اخيها محمد بن ابى بكر والذى كان فى جيش على الى المدينه ولم يمسها بسؤ لعلمه بمكانتها فى الاسلام ولعلمه انها لم تخرج لقتاله انما خرجت للاصلاح بين الناس والثار من قتلة عثمان كما جاء فى كلامها مع القعقاع بن عمرو مندوب سيدنا على ووافق على رايها طلحه والزبير (رضى الله عنهم اجمعين)واتفقوا جميعا على الصلح الا ان اهل البغى والنفاق وعلى راسهم ابن السوداء ابواالا الوقيعةبين الفريقين المؤمنين وكان ماكان وكل يبعث على نيته --- اما القول فى عثمان رضى الله عنه فالنعلم اولا ان الصحابة رضى الله عنهم جميعا بريئين من دمه الشريف وان بعض كبار الصحابه مثل على وعمار وعبدالله بن مسعود قد اختلفوا مع<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
