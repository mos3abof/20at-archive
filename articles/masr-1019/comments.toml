text = "قرأت فى جريدة المساء أن النائب السابق بمجلس الشعب الأستاذ سيف الدين محمود قد استقال من حزب الغد احتجاجا على الإساءة لعدد من أصحاب الرسول الكريم صلى الله عليه وسلم ونحن نقدر غيرته على الاسلام ورموزه ولكن ياأستاذى العزيز ليس هكذا يكون الاحتجاج بل بالتوضيح والتغيير .....أستاذى لاتكن سيفا وعد ياسيف محمودلبيتك الغد ورمضان كريم."
