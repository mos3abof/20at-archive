text = "قال رسول الله عندما خرج من منزل عائشة هاهنا الفتنة هاهنا الفتنة حيث يطلع قرن الشيطان {روي في البخاري جزء 2 ص -125} وقالت عائشة على عثمان وهو حي : اقتلوا نعثلا قتله الله فقد كفر .ونزلت آية{عسى ربه إن طلقكن أن يبدله أزواجا خيرا منكن مسلمات مؤمنات قانتات ؟؟؟؟في عائشة وحفصة وكان الإمام علي يلعن في صلاته بقوله { اللهم إلعن معاوية أولا وعمر بن العاص ثانيا وأبو موسى الأشعري ثالثا والأشعث إبن قيس وأبو الأعور السلمي"
