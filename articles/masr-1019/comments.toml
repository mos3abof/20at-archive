text = "هقول ايه؟ ربنا يهدي<br />احنا اللي كلنا عيوب وعبر ننتقد الصحابه الاطهار طيب لما نصلح من نفسنا الاول نبقى نقول كلمه في حقهم مش عاشين على اغاني عمرو دياب وبنتفرج على عادل امام ومنه شلبي وهيفاء والقران مش بيتقري الا مرة لو قرئ وبنصلي الفرض بالعافيه ولا في سنة ولا في قيام وفي الاخر تقولي ننتقد الصحابة.. ."
