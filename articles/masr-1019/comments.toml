text = "بلاوى ايه يااخت نيفين ؟ واضح انك مش فاهمه حاجه خالص !هو اختلاف الصحابه فى امور سياسيه بحته وليست امور عقائديه بتسميه غسيل قذر ؟ يااخت نيفين ماعندناش حاجه نخجل منها من تاريخ الصحابه ؟ اهم حاجه اللى يقرا التاريخ يقرئه من مصادره الموثوق بها ويقرا بعين الأنصاف لا بقصد التعصب لفرقة او مذهب -- روحى ياشيخه منك لله"
