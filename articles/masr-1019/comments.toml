text = "الأستاذ أحمد فكرى رئيس تحرير الغد....من أعماق قلبى أحييك ، وعلى شجاعتك أهنييك ،ولكن أصبح من واجبكم التوضيح حتى يفهم من تسرع فى الحكم ويهدأ من فى قلبه شئ خاصة وأنكم فى البداية أعلنتم حبكم للصحابة وتقديركم لهم.وفى الوقت الحالى أناشدكم عدم التعرض لمثل هذه الموضوعات حتى لايساء فهمها،ولكم منى كل الود."
