[[comments]]
order = 8
subject = "حسبنا الله"
author = "اشرف"
posted = "2006-10-06"
text = "تقبل الله منى ومنكم حتى لا اطيل عليكم لتعلمو اخوانى ان الخوض فى سير الا ولين الاخيار لايكون بمثل هذا الاسلوب الفج الوقح من كاتب نكره يريد الاشتهار ولو على اعراض صحابة خير خلق الله فالكلام عن الصحابه يتطلب منا الترضى عليهم كلما مر ذكرهم لا ان ياتى شخص لايجيد الاستنجاء ولا يعرف احكام الوضؤ ثم يسميهم اشر عشرة اشخاص فى التاريخ ونجد من يوافقه بدعوى حرية النقد ؟ بل وتصل الجراه باحد المعلقين على المقال ان جعل النبى مخطئا فى حياته اليوميه حتى لانظن انه ملاك ؟ بالله عليكم اى مصيبة هذه -- والاخر يريد نقد حياة الرسول قبل البعثه وقبل ان يؤدبه ربه -- ثم اذا قلنا لهم استغفروا ربكم وانيبوا اليه قالو انتم تكفيرين --- ياخوانى لاتغتروا بثقافة هؤلاء فانهم متجرئون على كتاب الله وعلى نصوصه وعلى رسوله و على صحابته ثم بعد زلك تريدون منا السكوت ----- حسبنا الله ونعم الوكيل"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

