subject = "فلنعمل في صمت"
author = "صامت"
posted = "2006-10-08"
text = "دعونا يا أخوتي الأعزاء من الجدال حوال الصحابة و أحسناتهم و أخطائهم و دعونا نعمل من أجل مستقبلنا و مستقبل أبنائنا . هيا بنا نجتهد و نعمل في صمت دون ضجيج . ان تقدمنا لن يأتي بالحديث حول معركة الجمل أو غيرها و عن خطايا الخلفاء بل بالبدء مما انتهى اليه الآخرون و ليس للرجوع الى الخلف و نبش آثار الماضي .<br />مع تحياتي"
