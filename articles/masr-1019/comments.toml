[[comments]]
order = 10
subject = "ــ ولاد البلد ليسوا ولاد البلد ــ"
author = "ــ هيكل الأزهرى ــ"
posted = "2006-10-06"
text = "انا نفسى اعرف امتى السايت دا هيحترم حرمانية شهر زى رمضان ولازال بيطرح امور كلها جدل وبيخلى الشباب من جدال مع النفس الى جدال مع الشخص وشغلانة طيييين ,.. ارجوكم يا اداريى ولاد البلد أنتم الآن لستم اولاد البلد وياريت تحاولوا تغيروا مسار موضعاتكم اللى فعلا بتعمل كل شىء مش فى صالح الإنسان نفسه واهمها طبعا انشغاله بأمور بسيطة جدا ويتكون عنده حدث الساعه .. اللى كتب فى الجريدة دى مجرد جاهل ليس الا وكل اللى كتب عنهم دول ربنا هياخد حقهم منه إن شاء الله عاجلا قبل أجل ,الموضوع مش كبير للأسف اللى نشر الموضوع دا عاوز يعمل خبطة اعلامية وخلاص ودا عيب وبقولك اتقى الله فى شباب وعقول المصريين خاصة والشباب المسلم عامة .. ربنا يهديكم وبجدد رجائى , إحنا فى شهر رحمة ومغفرة وعتق من النيران ارجوكم ساعدوا شبابنا انه يرجع ويتقرب لربنا مش يشتم ويغضب ويتكلم فى امور لا تفيد ."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

