text = "إلى مؤمن الفئة الباغية :تقول أن الفئة الباغية ليست كافرة ؟؟؟؟فلماذا دخلت النار بقوله ص لعمار :تقتل عمارا الفئة الباغية وقاتله وسالبه في النار ؟؟؟؟فهل اقتنعت ؟؟وتقول ان الآيات نزلت في مكة ؟؟ وهل يعني أن مانزل في مكة لأهل مكة وما نزل في المدينة لأهل المدينة يغفر الله لنا جميعا ؟؟؟؟ ....."
