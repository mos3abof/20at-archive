subject = "ولنا حق المناقشة"
author = "محمد سامى"
posted = "2006-10-08"
text = "من حق القارئ العادى أن يصدم ، ولكن القارئ للتاريخ وحقائقه والعارف ببواطن الامور يرى أن ماكتب نقد لمواقف ومناقشة لفكر بشر من كاتب رأى عنده القدرة على الدخول فى الممنوع وهذا يدعونا إلى مناقشته ،ومن وجهة نظرى ومع احترامى الكامل وحبى الخالص لكل الصحابة الكرام أقول للمعارضين رفقا بالكاتب ولاتهيجوا الناس الذين ينفعلون مع أى مناد ، ورمضان كريم والكاتب مسلم والله يوفق الجميع للبيان ،والتوضيح."
