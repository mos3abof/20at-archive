text = "مع كل الاحترام لكل الناس اللى اجازت النقد فيما يتعلق بالصحابه بقول مينفعش مينفعش مينفعش<br />ايوا هما بشر و كل ابن ادم خطاء<br />بس برده مينفعش<br />وبكرر مينفعش ان الانتقادات دى تتنشر علشان مش بس المسلمين اللى بيقرؤؤها<br />اظن الرساله واضحه"
