[[comments]]
order = 25
subject = "جزاك الله خيرا(مسلم)"
author = "BATISTUTA"
posted = "2006-10-08"
text = "سؤال بسيط اوجهه لاصحاب فكرة النقد متى يكون النقد هدام ومتى يكون بناء ؟<br />ومن فى مجتمعنا وفى حياتنا يستحق النقد هل الصحابة ام اسلوب حياتنا؟.... وطريقة تفكيرنا التى بدأت تقلد الغرب فى عدم احترامهم للثوابت اقول الثوابت لانه عندما نتجرأ على صحابة الرسول باى صورة ماذا يتبقى وكما اوضح مسلم فالباب لا يفتح على مصراعيه دفعه واحدة بل خطوة خطوة انا لا اقول ان المدافعين عن النقد يريدون سوء بالصحابة ولكن هل كل الناس مثلك وما يدريك ان شخص ما منا ينتقد لمجرد النقد فمن الممكن ان ينتقد لحقد او تتعدد الاسباب فى ذلك والله اعلم بالنوايا .<br />...الدين ليس حكرا على احد فليتكلم من يريد والله يحاسبه على اقواله ولكن ارجو من الاخوة المعلقيين الا ينساق دائما فى كل مناقشة مع (شوية سلفيين) التى وللاسف يعتبرونها سبة وشتمة مع انى احترمهم لانهم ليسوا بالسوء الذى يتصوره البعض فيقولون فى اى مناقشة معهم الدين ليس حكرا عليكم وانكم لستم اوصياء علينا .<br />الم تفكر للحظة لم هم حريصون فى مجادلتك بالحسنى لانهم حريصون على دينهم وفى نفس الوقت يحرصون عليك .<br />ولكل واحد منا ان يقتنع بكلامهم او يرفضه فكل انسان حر مالم يضر .<br />وكلمة اخيرة الجدال فى تلك الامور يفسدها ولا يريح احد."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

