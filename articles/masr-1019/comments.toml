[[comments]]
order = 60
subject = "الى الضالين"
author = "ابو عمر"
posted = "2006-10-14"
text = "عن فتاوى إبن تيمية : وفي حديث آخر أن عماراً حين جعل يحفر الخندق جعل رسول الله صلّى الله عليه وسلّم يمسح رأسه ويقول: «بؤس ابن سمية تقتلك فئة باغية» (279).أليسوا أصحاب معاوية وعثمان ؟؟؟؟<br />قال ابن تيمية رحمه الله: (وهذا أيضاً يدل على صحة إمامة علي، ووجوب طاعته، وأن الداعي إلى طاعته داع إلى الجنة، والداعي إلى مقاتلته داع إلى النار.......؟؟؟؟فكيف بمن قاتله في صفين و حرب الجمل ونبحته كلاب الحوأب)قال تعالى :إن الشيطان لكم عدو فاتخذوه عدوا إنما يدعو حزبه ليكونوا من أصحاب السعير ـ فاطر6 وإذا قيل لهم اتبعوا ما انزل الله قالوا بل نتبع ماوجد نا عليه آباءنا أولو كان الشيطان يدعوهم إلى عذاب السعير 21ـ لقمان ؛ ويتبع كل شيطان مريد كتب عليه أنه من تولاه فإنه يضله ويهديه إلى عذاب السعيــــــــــــــــــــــــر ؟؟؟صدق الله العظيـــــــــــــــم (وقد بقي بنو امية يلعنون عليا أربعين سنة على منابرهم وإلى الآن إذا شتموا أحدا قالوا له يلعنك با با حسن أي أبا الحسن ويسمون بيته بيت الأدب لان رسول الله كان يقول لبعض أصحابه في بعض الأوقات : قوموا بنا إلى بيت العلم والأدب ؟؟؟ ،"
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 61
subject = "الى ابو لؤلؤه المجوسى"
author = "اشرف"
posted = "2006-10-16"
text = "ايه الجهل ده يابو عمر اولاانت ابنك اسمه عمر ليه ؟ واجب عليك تسميه لؤلؤه علشان تبقى كنيتك على اسم جدك الكبير !ثانيا -- مين اللى قالك ياجاهل ان الفئه الباغيه كافره ؟ الم تقرا سورة الحجرات وتقرا قوله تعالى وان طائفتان من المؤمنين -- الم يسمى الله الطائفتين مؤمنين -- ثم من قال لك ان سيدنا عثمان يمثل احدى الطائفتين ياجهوووول فالرجل كان عند ربه راضيا مرضيا وانما بدات الفتنه بعد قتله ياجاهل -- ثم انك تعرض بعائشه رضى الله عنها ؟ الم تعلم ان الوحى لم ينزل فى فراش زوجات نبيك الا فى فراشها -- الم تعلم ان سورة النور نزلت من اجلها --- الم تعلم ان نبيك مات ورأسه الشريف فى حجرها --- كيف تعرض بها وربك جعلها للمؤمنين امأ -- فان لم تقبلها اما فانت لست مؤمن بنص القران --- ثم ياجاههههههل كيف تستشهد بايات مكيه نزلت فى مكه ؟ ونزلت فى كفار عابدى اصنام وتلصقها انت بموحدين امنوا بالله ورسوله ؟ ثم اين بنى اميه الان فتلك امه قد خلت لها ماكسبت ولكم ما كسبتم ولا تسألون عما كانو يعملون قل خير قول فى صحابة احمد واعرف عليا ايما عرفان لا تنتقصه ولا تزد فى قدره فعليه تصلى النار طائفتان احداهما لا ترتضيه خليفة وتنصه الاخرى الها ثانى والعن زنادقة الروافض انهم اعناقهم غلت الى الاذقان مدحو النبى وخونو اصحابه ورموهم بالظلم والعدوان وكأنما أل النبى وصحبه روح يضم جميعها جسدان قل ان خير الانبياء محمد واجل من يمشى على الكثبان واجل صحب الرسل صحب محمد وكذاك افضل صحبه العمران رجلان خلاقا لنصر محمد بدمى ونفسى ذالك الرجلان رضى الله عن صحابة رسول الل<br />اقرأ بقية التعليق .."
archived = "2006-11-03"
capture_url = "https://web.archive.org/web/20061103073421/http://masr.20at.com:80/article.php?sid=1019"

[[comments]]
order = 62
subject = "شتان مابين الثري والثريا"
author = "عمادمحمد أحمد"
posted = "2006-10-17"
text = "وما يعنينا ان تعتذر الغد او لا تعتذر الظاهر انها هجمه منظمه وأمر مبيت بليل وظاهره للتشيع تغزو بلادنا ولكن ولله الحمد مقام صحابه رسول الله صلي الله عليه وسلم في بلادنا سيظل محفوظا ومكانتهم في القلوب ستظل هي المكانه الساميه ولو كره كلاب العلمانيه واصحاب القلوب النجسه من اهل النفاق والكفر وان تسموا ياسماء المسلمين وحسبنا الله ونعم الوكيل وصدق الله العظيم حيث يقول ماكان الله ليذر المؤمنين علي ما انتم عليه حتي يميز الخبيث من الطيب ومن الخير لنا ان نعرف اعداءنا وان ينزعوا الاقنعه عن وجوههم القبيحه حتي لا تلتبس الامور وحتي تتمايز الصفوف وصلي الله وسلم وبارك علي سيدنا رسول الله وعلي اصحابه الطيبين الطاهرين ولو كره الكافرون والمنافقون"
archived = "2006-11-03"
