text = "نحن نلوم الغرب على سبهم لرسول الله صلى الله عليه وسلم ثم نعود نحن ونؤذيه في أصحابه رضوان الله عليهم الذين اصطفاهم الله لرسوله صلى الله عليه وسلم بل ونؤذيه في أحب الناس إلى قلبه السيده عائشه التي أخذنا عنها ثلثي العلم وفي عثمان الذي شهد له في خمسة مواقف مختلفه أنه من أصحاب الجنه ولكن لا عزاء على جهلنا بمكانتهم و إنالله وإناإليه راجعون فاتق الله ياسيدي الفاضل في أصحاب رسول الله فهم خيرة البشر وارجع إلى كتب التاريخ لتعلم قدرهم ومنزلتهم"
