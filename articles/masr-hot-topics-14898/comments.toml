text = "يجب ان نكون موضوعيين فى انتقادنا للأشخاص و أن نجمع حولهم معلومات<br />كما فعلت دعاء مقال رائع و منصف لعبود الزمر الذى كثير منا لا يعرف عنه سوى الصورة السلبية التى وردتها لنا الحكومة منذ سنين التى تعودت تشويه الناس و تلبيس الوقائع"
