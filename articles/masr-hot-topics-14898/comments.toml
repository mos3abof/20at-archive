author = "والنتيجة !!!!!؟"
posted = "2010-01-16"
text = "ضابط المخابرات شارك فى قتل السادات<br />كلام قديم وكان خاتمة يستحقها المقتول فى نظرة وقتها<br />ولكن ما النتجة من قتل السادات ؟؟؟<br />النتيجة هى ما نعيشة اليوم من معاناة فى طوابير الخبز والغلاء والبطالة والمرض بسبب من خلفة على دكة الحكم<br />قتل السادات ادى الى ان يخلفة الغباء والجهل والعشوائية والتخبط<br />قتل السادات ادى الى التوريث وتحويل البلد الى عزبة او عشة فراخ<br />فليذهب عبود فى ستين داهية ولتكن خاتمتة سوداء على راسة<br />نتيجة فعلتة القبيحة عانى منة ثلاث اجيال من شباب المصريين ضاع مستقبلهم"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127060347/http://www.20at.com:80/masr/hot-topics/14898-2010-01-16-00-29-40.html"
