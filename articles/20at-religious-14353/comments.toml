author = "اسامه سيد طلبه"
posted = "2009-12-12"
text = "الي الجميع<br />من فضلكم قبل تتبادلوا الااراء انظروا الي ماهو مكتوب في يدك راحه كفك اليمين ستجد الرقم 18<br />وراحه يدك الشمال ستجد الرقم 81<br />والمجموع هو 99<br />وهي اسماء الله الحسني<br />وهو الصانه وهو الخالق وكتبها في ايدي الناس جميعا<br />في اي مكان<br />والله واكبر"
archived = "2009-12-14"
capture_url = "https://web.archive.org/web/20091214030615/http://www.20at.com:80/20at/religious/14353-2009-12-11-11-48-27.html"

[[comments]]
