author = "مسلمه"
posted = "2009-12-15"
text = "سبحان الله كلما حاول أعداء الأسلام محاربته غلبهم الله علي يد واحد منهم<br />سبحان مقلب القلوب و الأبصار<br />أللهم ثبت قلبنا على دينك"
