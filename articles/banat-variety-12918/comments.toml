author = "احنا بتوع الفراخ"
posted = "2009-08-12"
text = "احنا بقى بتوع الفراخ<br />ولو فية مكان واسع وامكن تربية ذكر بط فيبقى خير وبركة<br />لان تمن ذكر البط دلوقتى يعنى الدكر المتزغط ب 100 جنية<br />وطبعا لمتذوقى طبق شربة البط حلاوة ومتعة لا تعادل باى حال شربة اخرى<br />اما بتوع العناكب وتربية الصراصير فالناس فيما يعشقون مذاهب<br />وطبعا الكلاب نجسة وتربى فى الزرايب والحقول للحراسة ولا تربى فى البيوت لانها تنجس اى شىء تلمسة<br />اما القطط فيكفى ان تصيب البنات بامراض تمنعهم من الخلفة<br />وكل شعب ولة تقاليدة<br />وفية نسوان بتستخدم الكلاب فى اغراض اخرى وفى حضور ازواجهم"
archived = "2009-09-12"
capture_url = "https://web.archive.org/web/20090912162658/http://www.20at.com:80/masr/t7kyk/12918-2009-08-12-13-21-43.html"
