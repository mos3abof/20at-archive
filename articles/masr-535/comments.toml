[[comments]]
order = 14
subject = "مرتضى ضيعنا والاهلي بكانا"
author = "ميدو"
posted = "2006-06-24"
text = "اولا عاوز اقول حاجة انتوا عاوزين اية من الزمالك بالظبط مش الزمالك دة فريق مصري يعني المفروض كلنا نقف جنبه الاهلاوي قبل الزملكاوي علشان منتخبنا يتحسن لكن الكلام اللى بيتقال دة والتريقة اللى بتحصل دي وطول ما احنا كدة سلبيين عمرنا عمرنا ما هنشم كاس العالم وبعدين الاخ اللي بيقول ملاكمة ولعيبة الزمالك بلطجية وكدة لية هو يعني فريق الاهلي دة ملاك ما زي ما عندكم لعيبة انا بحترمها جدا عندنا لعيبة تحترم جدا وزي ما عندكم اخلا ابو تريكة اللى انا بعشقه عندنا اخلاق حازم امام اللى انا بموت فيه وزي ما عندكم حبسجي اسمه عماد متعب عندنا بلطجي اسمه محمود محمود يجماعة بدل ما نهزئ في بعض المفروض نقول الصح المفروض نقول للعيبتنا كدة عيب لانكم في الاخر اخوات واصدقاء بعد الملعب يجماعة الرحمة الرحمة علشان خاطر ربنا واقفوا جنبنا علشان نادى الزمالك يرجع لبطولاته اللى ملهاش حصر ويبقى عندنا منتخب قوى وندخل وننافس كمان على كاس العالم وربنا يهديكم"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124754/http://masr.20at.com:80/article.php?sid=535"

[[comments]]
order = 15
subject = "زملكاوي ولا مرتضاوي"
author = "محمد الشاذلي"
posted = "2006-06-24"
text = "دخلت على بيوت الزمالكويةوفي المنتدى بتاعه وجدت انقسام وخناقات حول مرتضى منصور<br />فمعظم اعضاء المنتدى رفضوا مرتضى وانقسم الاعضاء الى زملكاوي ومرتضاوي<br />وانا طبعااهلاوي<br />وعايز اسأل الزمالكوية شوية اسئله :<br />ماذا فعل مرتضى للزمالك<br />ماهي البطولات الذي فاز بها الزمالك في عهد مرتضى<br />من هو الاداري بنادي الزمالك الذي لم يقول مرتضى منصور عليه حرامي ولم يختلف معه<br />دا حتى اللاعيبه اتخانق معاهم ( جمال حمزه , حازم امام , طارق بيه السيد )<br />وعايز اسأل مرتضى برضه:<br />ماذا فعل الزمالك لمرتاضى<br />والاجابه هي :<br />الغاء عضوية مرتضى منصور من النادي الاهلي<br />خروج مرتضى منصور من مجلس الشعب بعد سبه لجماهير الاهلي<br />خلعه من رئاسة الزمالك ثم العوده ثم ايقافه مره اخرى بسبب الجزمة<br />الحكم على( أشهر محامي في مصر ) بالسجن 6 شهور بعد ان كسب حسن حمدي القضية<br />مع التوقع بتنفيذ الحكم بعد تطاوله على ذكريا عزمي وقوله عليه انه يسيء سمعة حسني مبارك"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124754/http://masr.20at.com:80/article.php?sid=535"

[[comments]]
order = 16
subject = "لية يا كابتش مرتضى"
author = "لعنة الاهلاوية"
posted = "2006-06-25"
text = "والله والله الى بيعملوا الكابتش مرتضى زى ماقلنا فى جملة سابقة دة اسمة انحطاط بجنيع مقاييس البلطجة العالمية واحنا قلناالراجل دة هيتهد لما يطلع من مجلس الشعب بس مفيش فايدة احنا المفروض والله والله نعدمة رميا بالشباشب اة والله والزنوبة كمان اوكى وانا احب ابلغ رسالة الى النادى الاهلى العريق ذو القيم والمبادئ والاخلاق الرفيعة ان احنا لما كان عندنا كبوة مش عايز اقول زى الزمالكاوية الحمد لله عديناها بكل ادب واحترام والحمد لله ان الاهلى طول عمرة وفى حياتك ومماتك يا صالح يا سليم هنفضل كدة انشاء الله عماد ابوتريكة وارقص يا حضرى وكابتن هادى النجم الاول والاخير بحبك موووووووووووووووووووووووووووووت انت وابوالسيد بس انا ليا تعليق على حاجة بسيطة يا كابتن هادى انت هتعمل ماتش اعتزالك بين منتخب مصر الى هوالاهلى وبين النادى الاهلى طب ازاى يعنى ولمؤاخذة محمدعبد الوهاب مثلا هيرفع كورة للاهلى وبعدين يجرى سقطع هو تانى على اساس ان هو بيلعب هنا وهنا ولا ايةهههههههههههههههههه وومع السلامة بقى"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124754/http://masr.20at.com:80/article.php?sid=535"

