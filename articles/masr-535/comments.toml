text = "نبدأ بالصلاة على النبي ونقول الله يغمك في بدنك يا مرتضى ياكذاب يامنافق وصحيح احنا سعداء بوجودك على قمة منظومة نادي الزمالك ولا هي منظومة ولا حاجة لكن عيب عليك تكذب وتصدق الكذبة قال وايه كمان بتطالب الناس تصدقك !!!!!!!!! يا جدع فوق فضحتنا الله يفضحك سيبك من دور الزعامة ده اللي انت عايشه وسيبك من الخزعبلات اللي في دماغك الله يبهدلك زي مابهدلتنا قدام العالم على الفضائيات وروح منك لله"
