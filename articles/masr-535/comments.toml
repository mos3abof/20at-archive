subject = "محمود محمودالبلطجي"
author = "رضوى نبيل"
posted = "2006-06-20"
text = "التشرد والبلطجة نزلوا فجاة على لعيبة الزمالك ، مين يصدق ان الضربة اللي اضربها اللاعب الخلوق محمد عبد الوهاب خلتوا يفقد الذاكرة للحظات ود. ايهاب على قال ان الضربة كانت هتودي بحياة اللاعب . ولا الضربه اللي خدها متعب، يا سلام ولا اجدع ملاكم، وغير دة كله حلبة المصارعة اللي في المقصورة ومرتضى منصور الي عامل لنا فيها صرماتي . ولا يعني خدوهم بالجزم ليغلبوكم ."
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144217/http://masr.20at.com:80/article.php?sid=535"

[[comments]]
order = 5
subject = "كلمه حق"
author = "نيفين نيفى نوفا"
posted = "2006-06-20"
text = "كلمه حق انى اقول ان الاهلى حديد<br />كلمه حق انى اقول ان الماتش المفروض كان يخلص 6 مش 3 بس<br />كلمه حق انى اقول انى افخر انى اهلاويه جدا<br />كلمه حق انى اقول ان الزماللك بجد صعب عليا و كان نفسى يجيبو جون ينقذو بيه ماء وجههم<br />كلمه حق انى اقول ان فعلا ممكن الحكم يكون اخطأ بس الاهلى هو الاهلى<br />كلمه حق انى اقول ان ابتسامه عبد المنصف كانت ابلغ من الكلام و كان لها دلاله واضحهاوى<br />كلمه حق انى اقول ان مرتضى منصور بلطجى و منافق و انسان بشع بس هو بيحب النادى بجد<br />كلمه حق انى اضم صوتى لصوت الناس اللى قالت ارحمونا من مرتضى لان الاعلام عمل منه بطل و ند لا يقاوم لدرجه ان رجال الشرطه بتخاف منه<br />كلمه حق انى اقول ان عجبنى سمير زاهر و هو ستيب الناس بتتشاكل ف المقصوره و هو بيخرج من باب تانى<br />كلمه حق انى اقول لمدحت شلبى يا نهار ااااابيض"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144217/http://masr.20at.com:80/article.php?sid=535"

