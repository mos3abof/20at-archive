[[comments]]
order = 0
subject = "كده خلاص .....مرتضي جاب اخره ...والزمالك كماااااااان"
author = "محمد السيد"
posted = "2006-06-17"
text = "إيه ياعم أحمد ...بالراحة شوية ... هي ناقصاك إنت كمان ...<br />طيب راعي إن في زمالكاوية بيدخلوا هنا - والله العظيم أنا أهلاوي والحمد لله - بس اكيد في ناس لسة مغيرتش البطاقة ...<br />بيقولك .... الموظف اللي بيغير البطايق طلع زمالكاوي كمان ... وهو بيغير بطافته المكنة باظت .... فالباقيين مش عارفين يغيروها وماشيين بيها كده ...<br />ياعالم ..يا بتوع الزمالك ... يا اللي صابرين علي مرتضي باشا ...<br />ربنا معاكم ...<br />يعني أنا مش عارف إنتو ليه لسة زمالكاوية ... بأمارة إيه ؟؟<br />ماهو الواحد يتحمل حاجة واحدة .. يا الهزايم ..يا إما الفضايح ومشاوير واحد زي الحاج مرتضي ...<br />إنما الاتنين ... ده إنتو رجالة والله<br />يلا حنقول إيه ..<br />شفت أخرتها ...حتي بعد مرتضي باشا ما وقف في مجلس الشعب اللي فات يهلل للاستفتاء وتعديل المادة 76 ...برضه اخر خدمة العز علقة ...<br />ههههههههه ...اخرة النفاق ....<br />وعقبال أحمد شوبير يارب ....<br />وبرضه ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619140255/http://masr.20at.com:80/article.php?sid=535"

[[comments]]
order = 1
subject = "يا ساتر علي نفاق احمد شوبير"
author = "متغاظ"
posted = "2006-06-17"
text = "احمد شوبير دا طلع منافق كبير يعنى بدرجة جزمه و ببقي متغاظ لما يقعد يمجد في علاء و جمال مبارك فى البرنامج بتاعه و لو تفتكروا ايام بطولة الأمم الإفريقيه لما الواد المراسل بتاع البرنامج .. واد سكلي كدا اسمه محمد عباس راح يعمل حوار مع علاء مبارك و ابن الصغير و الواد المراسل قال يعنى مندهش قوي و بيقول كده زي: يا نهار ابيض علاء مبارك باشا و ابنه كمان قاعدين في المدرجات من غير حراسه مع العالم الزباله و الرعاع. يا سلام إيه دا يا باشا دا انتوا مدلعين الشعب ما يصحش كدا دا انتو كان لازم تقعدوا فوق روس الجماهير الزباله دى و تحطوا جزمتكم في عنيهم و هما يطولوا اكيد كانوا هيشيلوها فيعنيهم بكل حب و يسعدوا اكتر لو فقعتوا عينيهم.. هما في ديكى الساعه.ها هو النفاق بعينه من شوبير و بقيت الهتيفه السكليه في مصر. عارفين انا لو اطول و الله اقطع لسان الأشكال دى بضمير مرتاح و نفس هاديه .. هما دول سبب بلاوي البلد و مأسي الشعب. هما دول اللي بينفخوا الحكام و يعملوهم ألهه.<br />علشان كدا ربنا بيقول ( إن المنافقين فى الدرك الأسفل من النار) يعنى في أحط درك و درجه في جهنم يعنى عذابهم امر من المشركين و الكفره."
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619140255/http://masr.20at.com:80/article.php?sid=535"

[[comments]]
order = 2
subject = "مرتضى .......... تاني"
author = "ابو شريف"
posted = "2006-06-18"
text = "اصبح المستشار مرتضى منصور - الشهير بحسن سبانخ - مصدر من مصادر الإبتكارات الرياضية في مصر والوطن العربي فبعد قيامه بشراء كأس وتسليمه للاعبين كرة اليد بناديه العام الماضي ... وبعد قيامه بتجهيز ملفات فساد لحوالي 75 مليون مصري ملوحا بهم لكل من خالفه في الرأي ... وبعد قيامه بمحاولة شراء كتيبة لاعبين وناديه مديون وليس لديه قيمه رواتب موظفيه ... قام علي مرأي ومسمع من ملايين المشاهدين بمصر والدول العربية بخلع حذائه لأمين صندوق النادي الأهلي أمام ممثل رئيس الدولة وأمام رئيس جهاز الرياضة وأمام رئيس أتحاد الكرة عقابا لهم علي هتاف جماهير الأهلي وطلبها منه عدم مغادرة نادي الزمالك حيث أنه يعتبر وجوده بالزمالك مصدر فرح لجماهير الأهلي لما له من قوة علي هدم فريق الزمالك العظيم ولكن المحزن والمؤسف له حقا هو نحن كمصريين وشكلنا امام الدول العربية ... انا مصري مغترب وأعمل بمجال الرياضة ورأيت الأندية والإتحادات تدار بأسلوب راقي متحضر كأسلوب النادي الأهلي المدرب هو إمبراطور الفريق له كامل الحرية في اتخاذ مايراه من قرارات وله الحق في وضع التشكيل الذي يراه واستبعاد مايراه ولايتدخل رئيس النادي في شئ مثل الأهلي وانبي وباقي الأندية المحترمه ولكن الذي يفعله بنا وبنادي الزمالك سيادة المستشار لايرضى أحد وحسنا فعل الصقر حين جمد رئاسته لنادي الزمالك حيث أنه من المستحيل أن يسير طبقا للأصول المتعارف عليها واتمني وأناشد الجمعية العمومية لنادي الزمالك أن لاتكتفي بالغاء رئاسته لنادي الزمالك بل شطبه من سجلات عضوية النادي فنادي الزمالك قلعة من قلاع الرياضة وستظل دائما قلعة بيضاء ناصحة مهما حاول البعض الاساءة فإنها سوف ترتد تلك الاساءة له وسيبقى الزمالك وسنفيم له حفل الاعتزال الذي سيليق به واتوجه اليه بسؤال فعلا محي<br />اقرأ بقية التعليق .."
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619140255/http://masr.20at.com:80/article.php?sid=535"

