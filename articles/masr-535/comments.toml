subject = "دمكم تقيل قوي يا اهلاوية"
author = "ميدو"
posted = "2006-06-25"
text = "مش بقولكم انتوا هايفين بدل ما ندور على حل لمشاكل الكورة عندنا واحد هايف يقولك الكابتن هادى وماتش الاعتزال ومش عارف المنتخب هو الاهلي طيب ياعم ما مادام المنتخب هو الاهلي وشاطرين كدة امال مادخلتوش كاس العالم لية ويعني انا مثلا لما يكون المنتخب هو الاهلي مش هشجعوا مثلا علشان انا زملكاوي وهشجع اية بقى منتخب غانا ولا كوت ديفوار ما هي دي المنتخبات اللى تشرف حرام عليكم تعالى نحط ايدينا في ايد بعض ونحل مشاكل الكورة عندنا علشان نبقى من احسن المنتخبات في العالم وسيبوكم بقى من الاهلي والزمالك مش هيعملونا حاجة لكن المنتخب ربنا يهديكم يا اهلاوية ونبقى فعلا اخوات علشان كل دة في صالح المنتخب"
archived = "2006-07-19"
