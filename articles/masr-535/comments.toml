subject = "إنه عصر الجزمه"
author = "بيبو الاهلاوي"
posted = "2006-06-24"
text = "يا نجم دا العادي بتاع المستشار ميمي اللي بيحترب الفساد والاخلاق الواطيه بالجزمه بدلا من القانون والعقل والمنطق انه عصر سلطه المال فيه تطغا وتسود على الكل انه نتاج لمجتمع ينحني تبجيلا للسافل والمنافق قال ايه يبحترم هيبه الدوله طب باماره ايه لما الراجل كبير الياوران الكاب بتاعه وقع دا نهار اسود على مرتضى وعلى الزمالك كان ناقص ايه تاني دا لازم يتسحل في الشارع دا تطاول على اسياد الكره المصريه"
