posted = "2006-08-12"
text = "أشكرك من كل قلبي ياأستاذة على هذا النقد الجميل الذي قام بتشريح الفيلم وتحليله بصورة لم يقم بها للأسف الكثير ممن يزعمون أنهم نقاد محترفين.. لاأقول ذلك لأن الفيلم أعجبك فقد كان يمكن ألا تتمكني من صياغة أسباب هذا الإعجاب لكنك قرأتي الفيلم بشكل سليم وأنا فخور بمقالك وفخور بآراء قراء عشرينات وأعدكم إنشاء الله بأن أسعى للتجديد دائما<br />لكم تحياتي"
archived = "2006-08-18"
capture_url = "https://web.archive.org/web/20060818132406/http://masr.20at.com:80/article.php?sid=789"

[[comments]]
order = 14
subject = "واحد من الناس"
author = "احمد اسماعيل"
posted = "2006-08-17"
text = "اولا انا احب اقول ان مخرج الفيلم ممتاز ومخرج جدير بالحترام لانة ذهب بنا الى البيئة المصرية البسيطة والناس الغلابة التى كل احلامها ان تغير البوتاجاز او تجيب شفاط للمطبخ وادخلنا ايضا الى النقيض تمام الى حياة رجال الاعمال الحرامية وعن شرط بنفس التقنية العالية فى اضهار كل من الطبقتين وانا ارى ان كريم عبد العزيز بجد بجد احسن ممثل شاب فى هذا الجيل وابضا منة شلبة بسكوتة الفيلم الرقيقة الحبوبة التى تعشق زوجها بسيطة المطالب وكل هذا فى اداء جميل جميل جدا وان انى ارى ان بطل هذا الفيلم الحقيقى هوا كاميرة المخرج التى كانت البطللة فى احدى المشاهد دون ان نراها"
archived = "2006-08-18"
capture_url = "https://web.archive.org/web/20060818132406/http://masr.20at.com:80/article.php?sid=789"

