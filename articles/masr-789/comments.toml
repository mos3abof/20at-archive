[[comments]]
order = 20
subject = "جميل ولكن"
author = "سامح"
posted = "2006-08-20"
text = "الفيلم جميل جدا ويستاهل الواحد يدخله اكتر من مرة ... لكن في شوية تفاصيل في حتت تهنا فيها وبلال سابها لاجتهاد المشاهد مثلا فين سندس ؟ اختفت تماما...<br />كمان في الاخراج مثلا كان واضح جدا ان عناوين الجرائد كانت ورق ملصوق على جرايد قديمة ودي حاجة كان ممكن حلها بسهولة بالكومبيوتر او حتى الة تصوير<br />مع ذلك الفيلم جميل جدا وانا بحب بلال وكريم جدا"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025406/http://masr.20at.com:80/article.php?sid=789"

[[comments]]
order = 21
subject = "فيلم الموسم والمواسم السابقة"
author = "BATISTUTA"
posted = "2006-08-20"
text = "فيلم اكثر من رائع من كاتب اعتدنا على ارائه الجريئه فى الواقع قبل السينمافتجد افلامه كارائه فى جريدة الدستور .<br />كذلك كريم تفوق على نفسه فمستوى افلام كريم لم نر به هبوطا بل فى صعود بدء من حرامية فى كى جى تو الى فيلم واحد من الناس.<br />كريم لم يكن متسلطا فى الفيلم فلم يتدخل فى عمل المخرج ولا مؤلف بعكس كل فنانى مصر الكرام الذى يريد الواحد فيهم ان يكوش على كادر الكاميرا فيظر فى كل احداث الفيلم .<br />الخلاصة فيلم رائع باقل التكاليف عكس يعقوبيان فى تكالبف الانتاج"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025406/http://masr.20at.com:80/article.php?sid=789"

