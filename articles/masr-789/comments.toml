[[comments]]
order = 25
subject = "كلنا محمود"
author = "رادووووو"
posted = "2006-08-27"
text = "ممكن تكون محمود<br />سألت نفسي ؟؟؟<br />قلت ده أقل واجب<br />ده اسهل حاجه الواحد يكون في البلد دي مضهط مظلوم محارب من الجميع<br />الطبيعي نك بتخرج الصبح من بيتك مستعد لمعارك طوال اليوم<br />فمن الطبيعي ان يحدث لك اي أحتكاك مع اي واحد مش من الناس اللي هما احنا<br />الفيلم رائع في أغلبه من زمان مشفتش فيلم مصري زيه<br />شكرا بلال<br />شكرا اسعاد يونس<br />شكرا كريم"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025406/http://masr.20at.com:80/article.php?sid=789"
