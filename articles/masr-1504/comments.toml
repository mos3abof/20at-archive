author = "في مسحيين وبتوجيه من الكنيسة بيدخلو على المواقع ويشاركو في المنتديات بوجيه من الكنيسة..وده حقهم..ولكن مش بالتجريح والشتيمة في تيارات وجماعات ليها دورها في المجتمع المصري.."
