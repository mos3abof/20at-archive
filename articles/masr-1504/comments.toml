subject = "الحمد للة"
author = "الحمد للة الذى لا يحمد على مكروة سواة"
posted = "2007-01-27"
text = "اقول للاخوات اطمئنوا الشرطة عندنا كتير قوى 750000 شرطى 20 فرقة امن مركزى<br />الخير كتير - السفاح هيروح منهم فين<br />اطمئنوا خالص خالص خالص<br />اذا ما مسكوهوش هيجيبوا واحد يعترف انة السفاح وتوتة توتة خلصت الحدوتة<br />اطمئنوا<br />وراكم العين الساهرة"
