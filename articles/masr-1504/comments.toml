text = "[ الكتاب إلى هرقل ]<br />ثبت في \" الصحيحين \" عنه صلى الله عليه وسلم أنه كتب إلى هرقل : بسم الله الرحمن الرحيم من محمد رسول الله إلى هرقل عظيم الروم سلام على من اتبع الهدى أما بعد فإني أدعوك بدعاية الإسلام أسلم تسلم يؤتك الله أجرك مرتين فإن توليت فإن عليك إثم الأريسيين و يا أهل الكتاب تعالوا إلى كلمة سواء بيننا وبينكم ألا نعبد إلا الله ولا نشرك به شيئا ولا يتخذ بعضنا بعضا أربابا من دون الله فإن تولوا فقولوا اشهدوا بأنا مسلمون<br />[ الكتاب إلى كسرى ]<br />وكتب إلى كسرى : بسم الله الرحمن الرحيم من محمد رسول الله إلى كسرى عظيم فارس سلام على من اتبع الهدى وآمن بالله ورسوله وشهد أن لا إله إلا الله وحده لا شريك له وأن محمدا عبده ورسوله أدعوك بدعاية الله فإني أنا رسول الله إلى الناس كافة لينذر من كان حيا ويحق القول على الكافرين أسلم تسلم فإن أبيت فعليك إثم المجوس \" فلما قرئ عليه الكتاب مزقه فبلغ ذلك رسول الله صلى الله عليه وسلم فقال \" مزق الله ملكه<br />[ الكتاب إلى النجاشي ]<br />وكتب إلى النجاشي : بسم الله الرحمن الرحيم من محمد رسول الله إلى النجاشي ملك الحبشة أسلم أنت فإني أحمد إليك الله الذي لا إله إلا هو الملك القدوس السلام المؤمن المهيمن وأشهد أن عيسى ابن مريم روح الله وكلمته ألقاها إلى مريم البتول الطيبة الحصينة فحملت بعيسى فخلقه الله من روحه ونفخه كما خلق آدم بيده وإني أدعوك إلى الله وحده لا شريك له والموالاة على طاعته وأن تتبعني وتؤمن بالذي جاءني فإني رسول الله وإني أدعوك وجنودك إلى الله عز وجل وقد بلغت ونصحت فاقبلوا نصيحتي والسلام على من اتبع الهدى<br />وبعث بالكتاب مع عمرو بن أمية الضمري فقال ابن إسحاق : إن عمرا قال له يا أصحمة إن علي القول وعليك الاستماع إنك كأنك في الرقة علينا<br />اقرأ بقية التعليق .."
