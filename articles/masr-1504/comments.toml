[[comments]]
order = 13
subject = "فى ايه ...كل دا !!!"
author = "مصرية ليبرالية"
posted = "2007-01-28"
text = "اولا : اللى كتب التعليق اللى فوقى دا الاهبل دا ..مش انا ..اكيد ولد او بنت بيستهبل وبلاش الحركات الواقعة دى<br />ثانياً : مش معنى ان فى اجماع ضدى هنا انه فعلا اجماع حقيقى ...لان انا ممكن اكتب عشرين تعليق ورا بعض ويكونوا بأسماء مختلفة !!! ايزى جدا ياشباب<br />ثالثا : انا قرأت لشريف الدواخلى ف جريدة الدستور ولقيت اسلوبه لابأس به ...ليه التحامل عليه !! انما هو كمان اول مرة اعرف عنه انه اسلاماوى اوى كدا !! اسلاماوى وبيكتب ف جريدة ليبرالية<br />بس تقريبا بل اكيد ان الدستور متحالفة مع الاخوان وبتروج لفكرة تأسيس حزب ليهم على اساس انهم جزء من المجتمع ومش عارفة ايه كدا....الخ الخ<br />ماعلينا<br />انا دمجت بين الاخوان والسفاح لان الاتنين واحد...الاتنين بيعتقدوا انهم مقدسين ولازم يفرضوا مسار معين على حركة البشر...<br />بسيطة اوى ومش مستاهلة تنظير يعنى<br />وبعدين اللى بيقول انى معرفش حاجة عن الليبرالية او مقرأتش فيها حاجة احب اقوله:<br />عيب..عيب بجد!<br />ثم ياشريف يادواخلى ، مين ضحك عليك وقالك ان الليبرالية معناها مجمتع اباحى امريكى معرفش ايه؟ يبنى انت لسة معتنق التحليل الساذج دا !!<br />يعنى عايزنى مثلا اقول على حزب الجبهة الديمقراطية اللى هايتأسس قريب انه حزب يشجع الاباحية مثلا؟<br />او ان حزب الغد اعضاءه امريكان وعاوز يخرب قيم الناس والمجتمع والدولة<br />وبالنسبة للى كتب : انتم بتعملوا معايا كدا عشان انا بنت<br />احب اقوله : احنا مش فى حضانة هنا<br />سلام بأة عشان اسمع براين آدمز شوية"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 14
subject = "نداء من القلب"
author = "مصرى"
posted = "2007-01-28"
text = "الاحظ اخوة مسيحيين يأخذوا اسماء مسلمين ويهاجموا ويشتموا الاخوان المسلمين وانا لست اخوانى ولا احمل نفس افكارهم ولكن اتعامل معهم احيانا<br />وهناك مخاوف من المسيحيين من الاخوان وشكوك عميقة تجاههم ولكن والحق يقال هؤلاء الناس يعرفون اللة ولا يحملون اى حقد او عدائية تجاهكم وهم اخر ناس يكرهونكم تلك حقيقة مؤكدة<br />انما المشكلة فى الجهلة وانصاف المتعلمين الذى ييسهل شحنهم نفسيا فيرتكبوا بعض الحماقات تعودنا عليها من الطرفين على مدى التاريخ<br />ولكن مع الاخوان الحقيقيين فانهم فى اعماقهم يكنون كل مودة ورحمة ولا داعى لابواق الحكومة التى تعيش على الشحن وبس المخاوف بين الطرفين لتمرر قانون الطوارىء وقانون مكافحة الارهاب بافتعال حوادث فردية هنا وهناك<br />اننا مصريين امة واحدة حاربنا معا ونعيش معا ونتعامل معا بلا ادنى اى حساسية<br />واذهب الى عيادة اى دكتور مسيحى سوف تجد كل الزبائن من المسلمين واخر شىء ينظر الية المصرى فى المعاملات هو الدين<br />ارجو ان اكون قد وضحت<br />ولا اريد رودودا متشنجة<br />مع احترامى"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

