text = "مصرية ليبرالية...أممممم<br />غريبة جداً مساواة الاخوان عندك بما يسمى سفاح المعادي..مع إن الراجل مقتلش حد لحد دلوقت..يعني مش سفاح..ده وفقاً لتعريف السفاح !!<br />واعتقد إن الموضوع كله على بعضه دورة إعلامية زي كل الموضوعات إلي قبله ...شغل نظام ذكي ..بيلعب بالناس الكورة..ولا اعلام معندوش ضمير ...أهي قصة والسلام نسود بيها الصفحات ونعمل بيها موضوعات ونتكب تحقيقات..وندفع مرتبات !!<br />وبالنسبة للإخوان..معتقدش انهم بالقتامة إلي في \"دماغك\"..واظن انهم اكثر انفتاحاً مما يثار حواليهم من كلام كتير..لأن في نقص في المعلومات عنهم مع حملات التشويه إلي بيعملها النظام عليهم..كل ده بيخلي البعض يخافو منهم...وعلى حد علمي إن كل من احتك بالإخوان عن قرب بيجدهم مش بالصورة إلي بيحاول الاعلام تصورهم بيها!!<br />وعن تجربة شخصية وجدت ان على مستوى الواقع الفعلي ..الإخوان ليهم مشاريع اصلاحية وخدمية جيدة بيستفيد منها طبقات فقيرة وكادحة..بعيد بقى عن الاشكالات السفسطائية..إلي بيحاول البعض اثارتها من آن لآخر..لأن النظام الحالي اسؤ منه مفيش..واتسحل تحت جزمته كل الفئات !!"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

