[[comments]]
order = 18
subject = "ردا علي ما سبق"
author = "مواطن مصري مهموم"
posted = "2007-01-28"
text = "تعليقا علي الرد السابق المسيحين يا سيدي يشاركون بالقول والفعل ليس بنائا علي طلب من احد بل من واقع وطنيتهم وغيرتهم علي هذا البلد.اذ ان اقباط مصر هم تاريخيا السكان الاصلين لهذا البلد.اما ان المسيحين لم يقدموا للبلد شيئ فهذا افتراء وكذب . فقائمةشهداء كل حروب مصر مع الانجليز والفرنسيين والاسرائليين في حربي 1967(النكسه) واكتوبر 1973 مليئه باسماء الشهداء المسيحين الذين قدموا دمائهم وارواحهم لهذا البلد.جنبا الي جنب مع الشهداء المسلمين.وعلي الصعيد السياسي لعلك تعرف جورج اسحق وغيره من مؤسيسي حركة كفايه اللذين يطالبون بحقوق مسلوبه لكل المصريين متحديين بذلك واقع امني باطش .كونك تتجاهل كل هذا واكثر منه فهذا هو التعصب الاعمي بعينه والباس الحق بالكذب والباطل.اما عن تقوقع بعض المسيحين وعدم مشاركتهم فهذا يرجع الي السلوك العدواني الذي تعمده معهم الفاتح العربي لبلادهم طوال سنين طويله لتهميشهم وليس ادل علي كلامي من قتل الشباب المسيحي المصري اثناء الصلاه في الكنائس وجعل بناء واصلاح الكنائس اشبه بالمعجزات التي نادرا ما تحدث .ناهيك عن الوظائف المحظوره علي المسلمين من منطلق (لا ولايه لغير المسلم علي المسلم) كل هذا الارهاب والتخويف والتهميش وتتسائل لماذا بعض المسيحين يفضلون التقوقع وعدم المشاركه.انظر الي ما وصل اليه اقباط المهجر من مناصب في امريكا فلقد اختار الحزب الديمقراطي شاب مسيحي من اصل مصري هو مايكل منير لكي يمثل الحزب الديمقراطي في الانتخابات كحاكم ولايه.العيب ليس في المسحيين يا سيدي العيب في تيار التعصب والكره الاعمي الذي يتم التعامل معهم به. المسيحين لم يفقدوا انتمائهم ابدا لانهم ببساطه هم اهل الدار .المسيحين قدمو دما ونضالا لهذا البلد لا ينكره الا كل متعصب حاقد.المسيحين يا سيدي لم يجادلو<br />اقرأ بقية التعليق .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 19
subject = "الخبر اليقين في سفاح المعادي اللعين"
author = "تدور همسات الشارع السياسي والأمني على أن الموضوع أكبر مما هو مثار وأنه"
posted = "2007-01-28"
text = "خطة لضرب رجل بارز في وزارة الداخلية (إسماعيل الشاعر) في مقتل بطريقة<br />مشابهة للطريقة التي أودت بمصير وزير الداخلية السابق أحمد رشدي في سنة<br />86 عندما سارت قوات الأمن المركزي في مظاهرات كان نتيجتها عزله عن منصبه،<br />ويرجع البعض ذلك للسفاح لتعمد رجال الأمن إتاحة الفرص أكثر من مرة ليهرب<br />رغم أنه كان في قبضتهم، ويضيفون لذلك قيامه بالاعتداء على ضحاياه في وضح<br />النهار، وفي قلب تمركز رجال الأمن<br />وأبدى أصحاب المقاهي في المنطقة من جانبهم استياءهم الشديد من رجال الأمن<br />الذين يتركون عملهم ويسكنون مقاهيهم ليلاً ونهاراً والمشروبات والشيشة<br />ببلاش ويقولون الحساب عند ربنا!!! ومما يُذكر أن بعض مقاهي المنطقة في<br />ميدان أبو عبده والسد العالي أضربت عن العمل وأغلقت أبوابها بسبب عدم دفع<br />الشرطة الحساب!!<br />المصدر<br />نقلا عن:محمد بركات - جريدة الدستور<br />( وإذا جاءهم أمر من الأمن أو الخوف أذاعوا به ولو ردوه إلى الرسول وإلى<br />أولي الأمر منهم لعلمه الذين يستنبطونه منهم ولولا فضل الله عليكم ورحمته<br />لاتبعتم الشيطان إلا قليلاً ) النساء/83 ."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 20
subject = "يامصرية ياليبرالية يامرقعة شرفتى اخوتك المتسكعة"
author = "مصرى هايديكى بالجزمة ياليبرالية"
posted = "2007-01-29"
text = "يامدعية الليبرالية ياجاموسة مفيش حد يستاهل الضرب بالجزمة الا انتى اولا وابوكى وامك ثانية علشان معرفوش يربوكى وعلشان خلفوا واحدة متخلفة عاهرة زيكانتى تطولى ياشازة يامتبرجةانك تكونى فى عصر هارون الرشيد _ هارون الرشيد دة اللى مش عجبك يامتخلفة يامرتدة وصلت الدولة الاسلامية الى اكثر من نصف الكرة الارضية وضافرة برقبة الحكام العرب والمسلمين اللى موجودين وزى قلتهم وبعدين انتى متعقدة من الاخوان لية علشان احسن منك ومن اللى جابوكى يامتخلفة _ مصر دى دولة اسلامية واللى مش عاجبة يسيب البد ويمشى ولو انتى من انصار امريكا ياستى سيبنا احنا وامشى فى ستين داهية تخدك وتاخد اجلك انشاء اللة ياعاهرة_وفى الاخر يجب على كل مصرى انة يديكى بالجزمة وتكون قديمة كمان"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 21
subject = "المسحسين ليسو السكان الاصليين لمصر !!"
author = "محمد حامد"
posted = "2007-01-29"
text = "كتير من المسحيين متوهمين بكتير من الاكاذيب انهم كانو سكان البلاد الاصليين..وأمور كتير متطرفة مظهرتش إلا لما البابا شنودة تولى الكرازة..<br />كلها حاجات لم يثبتها دليل..طيب هنفترض إن المسحين \"كانو\" اغلبية في مصر قبل دخول الاسلام..مع إن كان في ديانات كتير غير المسيحية..المهم أهل مصر إلي هما المصريين أختارو الاسلام وخلاص..بيدعي شخص اسمه عدلي ابادير اضطهاد وكلام كتير كله كدب..لو المصريين اعتنقوا الاسلام نتيجة للإضطهاد مكنش استمر الاسلام ومعدلات دخول المسحيين في الاسلام بالأعداد الكبيرة دي..<br />في مشاكل كتير عند المسحيين نابعة من طبيعة الكنيسة ملهاش علاقة بالاسلام..هو نوع من انواع خلق العدو حتى لا تنهار الكنيسة في مصر يعني نلاقي عدو نوحد عليه شتات المسيحيين في مصر بدل ما يتفرغول لمشاكلهم الداخلية ويكلوا بعض..<br />ده الاسلام وصل إلى أعلى الرؤوس المسيحية ودخل بيوت القساوسة ..بمعنى إن في قساوسة وابنائهم وزموجات قساوسة دخلو الاسلام..طيب متشوفو الخلل فين وتحلوه بدل ما ترموا مشاكلكو على الاسلام والمسلمين..<br />ولو هنفترض جدلاً إن في مصر اضطهاد للمسيحين..اعتقد إنه موصلش للدرجة إلي تخلي 3 آلاف مسيحي يدخلو الاسلام كل سنة\" وفقاً للإحصائيات الرسمية للأزهر\"..ده الرسمي غير المسحيين إلي بيدخلو الاسلام في السر..<br />هتقول إن في مسلمين بيدخلو المسيحية..كام واحد..وطبيعتهم النفسية والاجتماعية إيه..وإيه المغريات إلي اتعرضت عليهم\"شغل-هجرة-منصب\"..<br />في حين إلي بيدخل الاسلام من المسيحيين..بتفتح عليه ابواب جهنم والجهات الرسمية لا توفر له أي حماية وبيتعرض لضغوط رهيبة للرجوع عن اختياره ..وفي الآخر لو اتسلم للكنيسة محدش بيعرف عنه حاجة بعد كده...<br />وبالنسبة لمايكل منير ..هو مش اختار انه يكون امريكي ..واجع دماغنا ودماغة لي<br />اقرأ بقية التعليق .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 22
subject = "السكان الاصليون هم المسلمون"
author = "مصرى"
posted = "2007-01-29"
text = "باختصار وبدون تطويل السكان المصريون لمصر هم المسلمون<br />وحينما اتى عمرو الى مصر ترك الجالية الرومانية والجيش الروماتى كما هو يجمعون لة الضرائب ولمن بعدة من الحكام وحتى عصر قريب جداوذهب جيش عمرو الى شمال افريقيا لاستمرار الفتح<br />هؤلاء الرومان ذوى العيون الخضراء هم اجدادكم وبولس الرسول اليهودى الذى اتى من فلسطين للتبشير بالدين هو جدكم<br />هؤلاء الرومان اجدادكم هم الذين نشروا الين الاسلامى بين الذين كانوا يعبدون رع وامون اذ انهم كانوا يجمعوا ضرائب يسرقون نصفها ويعطون الحاكم الباقى<br />نحن المسلمون الذين امنا بدين اللة ودخلنا فى دين اللة افواجا الاصحاب الحقيقيون وليس اولاد بولس اليهودى ولا اولاد الرومان جباة الضرائب<br />تخاريف الكنيسة التى ترددونها هتوديكم فى داهية<br />خليكم ورا مايكل منير والخنازير التانيين لما تعرفوا حجمكم الحقيقى"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 23
subject = "ايه دا؟"
author = "مصرية ليبرالية"
posted = "2007-01-29"
text = "اولا : الناس اللى بيشتمونى هما احرار ف ارائهم لكن انا كمان حرة ف رأيى ومحدش يقدر يفرض منطقه على الجميع الا برضاهم او اقتناعهم.<br />ثانيا : ايه حكاية المسلمون هما السكان الاصليون والكلام التاريخى الاهبل دا؟<br />مصر لاى حد مصرى سواء كان مسلم او قبطى او يهودى او ملحد او وثنى<br />ومحدش يقدر يدعى ان الارض بتتكلم قرآن مثلا !!!<br />ثم بالنسبة لهارون الرشيد اللى انت فرحان بيه اوى احب اقوللك :<br />ان انا قرأت وثيقة اصلية من ايام الرسول كان مكتوب فيها مامعناه (اسلم تسلم .. وجوشى تطأ ارضك لنشر الدين بين الناس .. لو اسلمت لابقيانك حاكم البلاد كما انت ولكن ايضا سندخل لنشر الدين !! اما لو لم تسلم وقاومتنا فسيكون هناك حاكم آخر من بيننا ) !!!<br />هو دا دين ولا سياسة ياجماعة؟<br />اعتقد ان جورج بوش اكثر رحمة !!<br />ثم يعنى ايه فتوحات اساسا؟ وهو كان فى حد اشتكاله !!! ولا كان فى حد يعرف يعنى ايه اسلام اساسا؟ وهل ياترى مكنش عندهم وسائل تانية لنشر المعرفة غير الحرب !!! ولا هو وبس استيلاء على الثروات ونهبها وفرض افكار واااحدة موحدة على اكبر مساحة ممكنة من البشر !<br />نظام فاشل طبعا والدليل هو سقوطه ! واقتتال اصحابه انفسهم ! (الصحابة يعنى)<br />وبعدين ليه بأة نقول على جورج بوش انه رجل وحش ، طب محنا تاريخنا كان العن منهم!<br />ثم اننا بطموحاتنا التوسعية المتخلفة القذرة لايمكن مقارنتنا بدولة مثل امريكا مثلا!<br />ما السعادة التى يجنيها انسان حين يفرض فكره على الآخرين ويحتل اراضيهم بإسم الله؟"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

