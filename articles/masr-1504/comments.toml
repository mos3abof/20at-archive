[[comments]]
order = 1
subject = "تخلف عقلى"
author = "مصرية ليبرالية"
posted = "2007-01-28"
text = "احب بس اقول ان السفاح اساسا لابد ان يكون مختل نفسيا او عقليا ..<br />بعيدا عن فكرة ان الداخلية دائما تتهم المختلين عقليا<br />فالحقيقة ياشباب ان اللى يعمل كدا اكيييييد هو مختل نفسيا حتى وان كان معتقد انه بينفذ مثلا شرع الله<br />زيه زى اى شيخ او رجل دين بيحاول يفرض الحجاب مثلا على البنات .. اكيد مختل ولازم يتعالج ! وطبعا يتعالج بعد ماياخد بالجزمة الاول<br />المشكلة ان الاخوان بيلعبوا دلوئت على اكتر من صعيد : البرلمان .. محاولة تأسيس حزب .. مسرح اسلامى بدون نساء (ربنا يوكسهم)... زائد : شوية اعمال ارهابية خفيفة عشان يحققوا مكاسبهم واحلامهم الخاصة السياسية على حساب الشعب الغلبان والبنات المكبوتة والحرية اللى وان كنا بنتمتع ببعضها فهما بيحاولوا يقضوا عليها كفرة وكممارسة تماما ويثبتوا انها رجس من عمل الشيطان<br />اقول ايه بس<br />حسبى الله ونعم الوكيل ف الكلاب اللى عاوزين يودوا البلد ف داهية ويرجعونا لايام هارون الرشيد<br />ربنا ياخدكم ويريح البشرية كلها من افكاركم المسمومة وعقولكم المشوشة ونفسيتكم المريضة بشهادة كل علماء النفس والاجتماع"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 2
subject = "الرد على المصرية الليبرالية"
author = "مصري يخشى الله"
posted = "2007-01-28"
text = "تعليقي على تعليق المصرية الليبرالية<br />أحب أقول لها يا مصرية يا ليبرالية - نإتق الله - رجال الدين مش همه إللي بيفرضوا الحجاب على البنات - الحجاب فرض من الله سبحانه وتعالى - ولو عندك دين صحيح وتعرفي حاجة عن القرآن الكريم كنتي عرفتي إن الحجاب فرض من الله وليس من رجال الدين - رجال الدين يا مصرية يا ليبرالية عايزين يطبقوا شرع الله إللي أمثالك هجروه ومش عايزين يطبقوه - وأسأل الله لك الهداية"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 3
subject = "تعليق على كاتبة مقال تخلف عقلي"
author = "مصري بيحب بلده"
posted = "2007-01-28"
text = "إلى كاتبة المقال<br />سفاح المعادي ليس متخلفا عقليا- هو سليم عقليا وعقله ربما يكون أفضل من عقلك وتفكيرك - ولم يقم بهذا العمل لتطبيق شرع الله لأنه ليس مطلوب منه تنفيذه - وشرع الله لم يطبق بهذه الطريقة - ولكن والله أعلم له مآرب أخرى في ذلك لا يعلمها إلا الله - وعايز أسألك ما دخل الإخوان في ذلك ؟ - حضرتك بتكلمي على السفاح ليه تخرجي عن الموضوع - وفي النهاية خللي بالك منه علشان هو في الطريق إليكي"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 4
subject = "إلى مدعية الليبرالية"
author = "حسام الزمر"
posted = "2007-01-28"
text = "السلام عليكم<br />الاخت مدعية الليبرالية أرجوا أن تقرأي عن الليبرالية قبل اضافتها إلى إمضائك لأن من تعليقاتك يبدوا أنكي مدعية ليبراية<br />و الاولى أن تقرأي عن الاسلام و أرشح لكي كتب الشيخ الغزالي رحمه الله<br />سلام<br />حسام الزمر<br />و الالى"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 5
subject = "الموضوع معمول حلو قوى .....ورد على من تدعى الليبرالية !!"
author = "شريف الدواخلى"
posted = "2007-01-28"
text = "اولا : الموضوع حلو قوى قوى قوى<br />لكذا سبب<br />اولاً : الفكره جميلة جدا والعنوان معبر للغاية ما شاء الله<br />ثانيا : التنفيذ كان بينقل القارئ \" صوت وصوره \" انا حسيت انك بتنقلى بث مباشر لآهات تلك البنات الذين يعشون هناك وكأنها يتحدثون \" لايف \" مش الكلام متاخد على لسانهم<br />ثالثا : احييكى على شجاعتك انك روحتى المعادى اصلا<br />رابعا ً : فكره انك تاخدى زاوية لم ينظر لها وهى حال البنات التى تنتظر السفاح ...<br />شدى حيلك<br />اما بخصوص المصرية التى تخشى من ذكر اسمها مدعية انها مصرية ليبرالية فالرد عليها من باب ان الساكت على الحق شيطان اخرس لا اكثر<br />لقد قالت<br />1- \" اللى يعمل كدا اكيييييد هو مختل نفسيا حتى وان كان معتقد انه بينفذ مثلا شرع الله زيه زى اى شيخ او رجل دين بيحاول يفرض الحجاب مثلا على البنات .. اكيد مختل ولازم يتعالج ! وطبعا يتعالج بعد ماياخد بالجزمة الاول \"<br />2- \" حسبى الله ونعم الوكيل ف الكلاب اللى عاوزين يودوا البلد ف داهية ويرجعونا لايام هارون الرشيد \"<br />3- \" ربنا ياخدكم ويريح البشرية كلها من افكاركم المسمومة وعقولكم المشوشة ونفسيتكم المريضة بشهادة كل علماء النفس والاجتماع \"<br />ده جزء من كلامها ..<br />الليبرالية غير المسئولة التى يبدو انك تقتنعين بها سوف تقودنا لو اقتعنا بها إلى ان نصبح صورة \" ملوثه \" من المجتمع الامريكى المفتوح حيث تنعدم القيم ونتحول لمجتمع حيوانى تكون المرأة فيه مجرد \" اداه \" وتنعدم كل الفوارق المعقوله واللامعقوله بينها وبين الرجل ؟؟؟<br />وهذا ما لانرضاه فى مجتمع مسلم حتى النخاع<br />و هذا ان دل على شئ فيدل على انك لاتعلمين اصلا معنى الليبرالية ولم تقرأى كتاباً واحد فيها ولو لمؤلف مصرى ولو قديم !! بل أنك سيدتى الفاضلة تتعاملين من القشور فى الحرية المفرطة<br />اقرأ بقية التعليق .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 6
subject = "برضه شريف الدواخلي تاني"
author = "يا ابني انت جتتك منحسه انت تلقيحه ما بتحسش جبلة يعني"
posted = "2007-01-28"
text = "كل المعلقين رفضوا سخافتك دي يا اخي رفضوا اقتحامك الموقع بهذا الشكل الهمجي الغبي والفلسفة الفارغه اللي مالهاش اي معنى سوى انك تريد الشهرة يا حمار.<br />انا وراك لغاية ما تغور في داهية من هذا الموقع<br />جتك داهية تاخدك غبي"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 7
subject = "روضه"
author = "دة فيلم"
posted = "2007-01-28"
text = "مووضع حلو اوى يامروة<br />بس انا بقى معرفش لية مازال داخلى قناعة ان حكاية السفاح دة فيلم؛ايه يعنى حالتين صدفه والباقى مطبوخ؛ايه يعنى نشر امن فى المنطقة<br />احنا اتعودنا من النظام لما يعوز يبعد انتبهنا وتركيزنا عن حاجة يطلع لنا بحاجة تانية ويطلع فيها إنّ؛وتلقيهاهديت فجأة؛<br />انا مقتنعة انه فيلم"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 8
subject = "الفكرة والتنفيذ !"
author = "محمد حامد"
posted = "2007-01-28"
text = "جميل الموضوع يا مروة فكرة وتنفيذ<br />وبالنسبة لمصرية ليبرالية :<br />بصراحة تعليقلاتك سخيفة ومشوشة ومش عارف ماجيستير إيه إلي إنتي جاية تقولي عليه !!<br />واضح إنك دبلون تيجارة ..مش أكتر !!<br />ولو عندك ماجيستير بجد ..يبقى عليه العوض ومنه العوض في الدراسات العليا !!<br />وباين عليكي عندك هوس !!<br />وبالنسبة لشريف الدواخيلي:<br />يا عم شريف تعليقاتك حلوة وفي الجون ..بس طويلة قوي..ومش لازم التنظير حتى في الكوسة ولا الكوفت ..لأن طبيعة زوار الموقع زي ما إنت شايف..النطيحة.. والموقوذة ..وما أكل السبع !!<br />المهم..علق زي ما انت عايز ..بس مش كتير كده !!"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 9
subject = "الاخوان المتوحشين وشارع كشرى بتاع السبتية"
author = "ياسر أبو عمار"
posted = "2007-01-28"
text = "انا بس اللى غايظنى هو تعليق البنت اللى بتقول انها مصرية مش عارف ايه كده ،الغريب انها ربطت بين السفاح والاخوان من غير لازمة ،والله العظيم كلامها ينم عن جهل واضح وتحامل غير مقبول ،حاجة عجيبة والله ،انا خايف الان لو ان عبارة غرقت تانى ولا قطارين دخلوا فى بعض ان الاخوان الوحشين المتوحشين هما اللى يكونوا عاملينها ومخبيين .<br />لا الجديد بيقولك ان الاخوان هما اللى دخلوا انفلونزا الطيور مصر بس الحكومة مكانتش عاوزة فضايح يعنى ،بس دلوقت انا اطالب الحكومة انها تفضح الاخوان المتوحشين دول ،وتعلن على الملا ومن خلال اى برنامج محترم زى حالة حوار مثلا او عن طريق اى من كتابها البارعين فى التكييل للاخوان ،وليكن حمدى رزق او عبد الرحيم على او عبد الله كلام -اللى فاضى فيهم يسد بقى وخلاص -المهم لازم الحكومة تعلن للناس كشف كامل بالجرائم اللى ارتكبتها الجماعة دى من اول السيول بتاعة درنكة الى كاوتش العربية اللى فرقع اول امبارح فى شارع عبد السلام كشرى فى السبتية .<br />السكوت مش كويس ومش فى مصلحة البلد."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

[[comments]]
order = 10
subject = "اية حكاية البنت الليبرالية دى"
author = "مواطن مصرى"
posted = "2007-01-28"
text = "انا مش فاهم البنت الخايبة اللى واخدة فى نفسها قلم جامد قوى وبتتكلم عن حاجات خايبة قوى ومشحونة فى اتجاة معين انما مفقوسة ومعروف سكتك انت اية<br />احنا يا اختى احنا المصريين مسلمين واقلية مننا مسيحيين انما معندناش ديانة اسمها ليبرالية وغيرة من التعابير الخايبة المنتشرة فى الغرب فى العصور الوسطى ومجتمعنا فى الدستور بعد التعديل راس مالى<br />عايزة اية تانى تشتمى فى الاخوان - عيب<br />خليكى حلوة ورقيقة<br />وبكرة لما تتجوزى هاتنسى السخافات دى<br />العبى برة ياامورة"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131090619/http://masr.20at.com:80/article.php?sid=1504"

