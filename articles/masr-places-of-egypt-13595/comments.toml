author = "مدرسة كشك الثانوية ب"
posted = "2009-10-01"
text = "مدرسة كشك الثانوية بزفتى غربية اقدم من مدرسة السعيدية بسنتين<br />انشات مدرسة كشك الثانوية بزفتى سنة 1904 اى قبل السعيدية بسنتين<br />وسبب انشائها ان الملك كان يضع اسس لاعطاء الباشوية فمن اراد الحصول على درجة الباشوية كان يجب ان يقدم خدمات لابناء وطنة وابناء بلدة وكان مصطفى بك كشك من ابناء زفتى يريد الحصول على درجة الباشوية من مولانا الملك فبنى مدرسة ثانوية وبنى معهد دينى وبنى مسجد ضخم وبنى مستشفى كبير وكلهم فى مربع واحد<br />فمن من باشوات هذا العصر بنى لاهل بلدة مسجد ومدرسة ومعهد دينى ومستشفى للعلاج والتعليم بالمجان<br />واستنارت زفتى<br />وقامت بعدها بجمهورية زفتى ونشرت الفكر التحررى والثورى فى مصر<br />هناك مدارس اعرق من السعيدية<br />فى اعماق الريف المصرى وخرجت رجال كانوا ولا زالوا فى الصف الاول<br />رجال حرسوا الحدود وحموا الوطن ورفعوا راية المجد عاليا<br />مدرسة السعيدية كانت فى العاصمة بعد مدرسة فى الاقاليم بسنتين"
archived = "2009-10-04"
capture_url = "https://web.archive.org/web/20091004041344/http://www.20at.com:80/masr/7eta-mn-baladi/13595-2009-10-01-13-36-27.html"

