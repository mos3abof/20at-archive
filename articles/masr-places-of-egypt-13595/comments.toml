author = "من اجل هذا ؟"
posted = "2009-10-04"
text = "ان معظم القيادات السياسية والقيادات العسكرية والقيادات العلمية والثقافية والادباء من خارج القاهرة والاسكندرية<br />لان الاقاليم والريف والصعيد فيها مدارس ثانوى قبل القاهرة وقبل الاسكندرية<br />مدرسة المنصورة الثانوية خرجت قيادات فكرية وثقافية وعلمية اكثر من القاهرة<br />ومدارس طنطا واسيوط<br />كانت الاقاليم هى التى تقود والرجال العظام يخرجون من مدارس الاقاليم القوية وعلى مدى ال 100 سنة الماضية"
archived = "2009-12-08"
