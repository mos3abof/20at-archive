subject = "إرحمنا"
author = "شريف"
posted = "2006-11-26"
text = "مقالك ظريف ولكن الأظرف منه كان التعليق الأول<br />أود فقط أن أفهم أين الجمال الذي تحبه هذا ؟ في مشاهدتك لمشهد مقزز لإمرأة ترتدي الإختراع المسمي بالنقاب ؟ ثم أنك تتحدث عن أن الشعب المصري ذواقا للجمال ؟؟؟؟؟ ربما يصلح قولك هذا عن الفراعنةةليس العرب اللذين أحتلوا البلد وأسمو هذا الإحتلآل فتحا !!!وكيف لآ وفد نهبوها مع من نهب ... ثم إن كل أمثلتك كانت عن الإباحية !!! وما دخل الإباحية بالحجاب والنقاب وكل السواد الذي إستوردتموه من العرب !"
