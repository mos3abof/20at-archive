[[comments]]
order = 12
subject = "الخواجه فاروق حسنى"
author = "mego_mego"
posted = "2006-11-27"
text = "والله من ساعة ما الازمة دى بدأت وانا ماسك نفسى عن الكلام فيها لعدة اسباب 1- معالى الوزير فاروق حسنى ليس انسان عاديا حتى يعلن رأيه الشخصى بل هو وزير ويجب ان تتسم تصريحاته بالكياسة لانه يمثل الحكومة عندما يتحدث واذا كان الوزير لا يعلم هذا الكلام فهذا موضوع آخر<br />2- الحديث عن شىء يمس العقيدة او الدين لا يجب الخوض فيه دون علم ومن المعروف ان الحجاب وليس النقاب هوما ذكر فى عقيدتنا وديننا 3-مفهوم الجمال مختلف ونسبى وهو ما يحاول الاستاذ احمد صاحب المقال توضيحه فمن الممكن ان يكون الوزير فاروق حسنى لا ييرى ان المرأة بالحجاب دميمة على عكس ناس ىخرون يرون ان المراة بلبس الحجاب جميلة والنسبية هنا تنفى صحة كلام السيد الوزير ولا تثبته ومن الواضح ان الراجل فقد توازنه فادلى بالتصريح وعاد وقال ان هذا راى شخصى وليست هذه المشكلة يا سادة المشكلة ان سيادته زعل من اللى حصل عندما حاول نواب مجلس الشعب تقديم طلبات احاطه واسنكار ما حدث وحاول ان يبيتن الاعتداء السافر الذى حدث على فكر وعقل سيادته وتناسى السيد الوزير انه بكلامه جرح واهان ما يقرب من 3 4 مليون محجبة المعتاد طبعا وزير يغلط فى الناس ماشى تعدى واحد يغلط فى وزير يحصله ؟؟؟؟؟؟<br />وحسبى الله ونعم الوكيل<br />mego_mego"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232121/http://masr.20at.com:80/article.php?sid=1214"

