author = "واحد نظيف"
posted = "2006-11-27"
text = "\"صحيح اللى معندوش شغلة تشغله يفتح الباب ويقفله \" وعواجيز الفرح دايماً يعترضوا على كل الموجودين عشان معندهمش حاجة تشغلهم ولا حاجة جديدة يعملوها ويفيدوا بلدهم ويبنوا فيها ويزينوهابالعلم والإنتاج واللحاق بركب الحضارة هذا هو الجمال الذي رأيته فى الصين التى لم أرى فيها زبالة بل جمال فى جمال وحضارة فى كل مكان.<br />أليس الجمال الحقيقي رؤيةالبلد وهى مزينة بالأشجار الجميلة والورود فى كل مكان وكل شارع وميدان والتطور والرقى علامة للبلد.أم هل يعجبكم منظر الزبالة فى كل مكان.ألايتعارض ذلك مع الجمال.ان بلدناأصبحت عارية من معظم الأشجار والورود والجمال وأصبحت مقلب كبير للأفكار العفنة.أين جمال التطور والتفاني فى العمل لقد ذهب كل ذلك وغيره مع الريح بفضل أفكار عواجيز الفرح وسلملي على التقدميين"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232121/http://masr.20at.com:80/article.php?sid=1214"

[[comments]]
order = 17
subject = "مصر العزيزة لي وطن"
author = "رموزززززززززززززززززززز"
posted = "2006-11-27"
text = "يا شباب تحت مزاعم حريه التعبير والراي قال كل واحد اللي هو عاوزة وزود الجرعه كمان ربنا طالبنا بان القلب السليم له مكانه عندة فلذا لو البنت او الشاب متدين صح مش هيعمل اعمال تسيئ للاسلامه الا اهو محسوب عليه ثانيا فاروق حسني او الاخوان او المعارضه ميهموهمش الشعب ياكل او يشرب او يعيش بنقاء والمشكله ان تقريرات بالسفارة الامريكيه بتسجل انتبعاطكم دى لصالح اجهزة المخابرات سواء المصريه او الامريكيه السويسريه التي بدورها تطبع نسخ لانحاء العالم الواطي"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232121/http://masr.20at.com:80/article.php?sid=1214"

[[comments]]
order = 18
subject = "اعرف عدوك,ساعات يبقى عايش على أرضك ويطعن فيك وأنت فكره صديق"
author = "Drsalah_hanie"
posted = "2006-11-27"
text = "ادخل على الموقع الاتى<br />baladynet.net/<br />الموقع الذى يفضح النصارى ومخططاتهم وأهدافهم الخبيثه فى مصر.<br />قساوسة مصر الذين يدعون حب مصر يقول أحدهم فى أحد الشرائط كلاما كله حب فى مصر وأهل مصر المسلمين الطيبين يقول فيه\"يامبارك لــــــو ماحققتش اللى إحنا عايزينه لو ماإدتناش حقنا يامبارك أقسملك إنك هتلاقى أمريكــــــــــــــــا بكره فى مصــــــــــــــــر ,وها تعمل فيكم يامسلمين زى ماعملت فى العراق,أقسملك يامبارك هانخلى مصـــــــــر عــــــــــــــراق تانيه\".<br />واللى عايز الرابط يقوللى وأنا هاكتبه المره الجايه.<br />والله يانصرانى ياجاهل لأفضح سفالتكم فى كل حته وهابين مدى حقدكم على المسلمين الغلابه اللى عايشين فى مصر اللى أنتم عايشين على أرضهم وبتاكلوا من خيرهم وبعدين تطعنوهم فى ضهرهم.<br />فللأسف عندما غاب الحق وهو الاسلام ,ظهر الباطل بجبنه وقذارته وعوت الذئاب ونبحت كلاب النصارى فى كل وادى.<br />ولكن لاتتعجل الشماته فينا فالاسلام وأهله قادمون وسوف ندافع عن ديننا وأرضنا وأهلنا الطيبين حتى آخر نفس فأبقوا على غيكم حتى يأتى نصر الله."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232121/http://masr.20at.com:80/article.php?sid=1214"

