[[comments]]
order = 4
subject = "الشاب الروش شريف"
author = "شاب مصراوى روش برضه"
posted = "2006-11-27"
text = "شريف باشا بيقول عرب ومش عرب<br />طيب ماهو ايران مش عرب وبيفتخروا بانهم مش عرب وانهم فرس وبيلبسوا حجاب<br />اندونيسياوماليزيا مش عرب برضه ولا العرب حكموهم خالص وبيلبسوا الحجاب_يا راجل ده التليفزيون هناك المذيعات بيلبسوا فبه حجاب<br />تركيا اللى هما حكموا العرب مش العرب اللى حكموهم...الستات هناك هايموتوا ويلبسوا الحجاب_سته عشر وزير فى الحكومه التركيه زوجاتهم لابسين الحجاب<br />الموضوع مالوش دعوة بالعرب خالص.....انا مصراوى برضه وروش طحن وباسمع عمرودياب ومش مقتنع بان احنا عرب<br />بس مقتنع بان الموضوع اكبر من كده...الموضوع موضوع دين..موضوع فكرة...فكرة الكل بيحاربها....فكرة اسمها الاسلام<br />لو الحجاب مش عاجبك....اوكيه...سيبك من الاسلام كله ما تقعدش تقول عرب وماعربش لان العرب اساسا خلاص مابيلبسوش حجاب_انزل دبى والكويت وبيروت واتفرج<br />على فكرة برضه موضوع الفن ده بقى انت ظلمت العرب والدليل قصر الحمراء فى الاندلس والمسجد الاموى فى دمشق وشعراء العصر الجاهلى_يعنى قبل الاسلام اصلا_وابراهيم الموصلى وابو فراس الحمدانى بتاع اراك عصى الدمع بتاع ام كلثوم<br />انا بكرر..انا مصراوى وجدودى فراعنة مش عرب بس مقتنع ان فى فكرة اكبر بتجمعنا فوق كل العنصريات العرقية....فكرة اسمها الاسلام<br />وعلى رأى يوسف شاهين_المصراوى اللى بختلف معاه فى حاجات كتير_بس عجبتنى الكلمة بتاعته:الافكار ليها اجنحة....محدش يقدر يمنعها<br />فكرة الاسلام محدش يقدر يمنعها..لا فاروق حسنى وللا اللى يتشددله"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232121/http://masr.20at.com:80/article.php?sid=1214"

[[comments]]
order = 5
subject = "يا حلاااوة"
author = "عنتر مش لاقى سيفه"
posted = "2006-11-27"
text = "السلام عليكم و رحوة الله و بركاته<br />موضوع جامد جدا يا احمد باشا...و الاجمل الامثلة اللي انت ذكرتها.. و بعدين الشباب ياريت ياخدوا بالهم شوية من الالفاظ..الاخ شاول الطرسوسي احييك علي تقيمك الفني للاخ شريف..زماكانش في داعي يا شيري تسمع الكلام دة..بس يالله...معلش عالئة تفوت و لا حد يموت..و بالنسبة لاقتراح الاخ احمد كاتب المقال باننا نعمل تمثال عاري للفنان روقة فاحب اقوله اقتراح هايل يابو حميد..بالرغم من ان التمثال العاري دة لا هيودي ولا هيجييب لانه لن يكشف عن شيء!!!"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232121/http://masr.20at.com:80/article.php?sid=1214"

[[comments]]
order = 6
subject = "كان غيره أشطر!"
author = "حالمة إلى الأبد"
posted = "2006-11-27"
text = "السلام عليكم ورحمة الله وبركاته<br />برغم قناعتي بأن التعليق حول كلمات الأخ فاروق حسني تعطيها اهتمامًا أكثر مما تستحق، وتمنحه هو نفسه حجمًا ليس له ولن يكون...<br />ورغم أنني أرى أن الحل مع هذه النوعيات هو التجاهل التام والمضي قدمًا...<br />إلا أن المقال أعجبني فعلاً<br />ولي عدة تعليقات:<br />- لم يعجبني الأسلوب المتجاوز واستخدام ألفاظ غير لائقة في الرد، مهما كانت كلمات المردود عليه، المفترض أن أسلوبك علامة عليك، كما أنك بهذا تسيء إلى نفسك وتسيء أكثر للقضية التي تدافع عنها.<br />- الأخ الذي أرسل باسم فاروق حسني -إن لم يكن هو- يبدو أنه (نشن) على الأمثلة التي رأى أنها قد تقوي موقفه وعددها ثلاثة، وتجاهل الأمثلة والشواهد الأخرى التي هي أضعاف الثلاثة، هو حضرته بينقي ليه؟اللي يرد يرد على كله!!! ده طبعًا رغم إني مش مقتنعة أصلاً بردوده ع الكام مثال دول.<br />- لا كلام فاروق ولا متولي ولا غيره هيغير حاجة، ولا هيأثر -مثقال ذرة- ف قضية من الثوابت<br />فرض يعني فرض عجبكوا أو معجبكوش<br />واللي مش عايز محدش ضربه على إيده<br />خلصت<br />لكن تيجي تقوللي الشمس بتطلع م الغرب -قبل يوم القيامة- وعايزني أسمعك وأقتنع برأيك<br />معلش.. آسفة<br />كان غيرك أشطر!!!<br />وأخيرًا...<br />قال الشاعر:<br />\"إذا كل كلب عوى ألقمته حجرًا<br />لصار الحجر مثقالاً بدينار\"<br />تحياتي"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232121/http://masr.20at.com:80/article.php?sid=1214"

[[comments]]
order = 7
subject = "نسيت حاجة"
author = "حالمة إلى الأبد"
posted = "2006-11-27"
text = "استدراك<br />ملحوظة للمذكور شريف<br />اللي (فتح) مصر كانوا (المسلمين) مش (العرب)<br />وإذ1 كان رأي سيادتك إنه (احتلال) يبقى أنصحك تقرا كويس، لأن واضح ان حالتك الثقافية بعافية شوية لأ شوياااااااااات كتير قوي<br />بلاش ننكر حاجة أعداءنا وأشد الناس حقدًا على الإسلام مقدروش يتكلموا فيها<br />ويا ريت بلاش الحقد والكره يبعدنا عن العدل ويخللينا نصر على باطل<br />\"اعدلوا هو أقرب للتقوى\"<br />بطلوا افترا م الآخر<br />نسيت أشكر أحمد عبيد على مقالته الراقية خفيفة الدم ذات الأسلوب المنساب<br />تحياتي"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232121/http://masr.20at.com:80/article.php?sid=1214"

[[comments]]
order = 8
subject = "شكر لكاتب المقال"
author = "waleed68"
posted = "2006-11-27"
text = "تحية لاحمد عبيد على مقالك واسلوبك المبنى على الحجة والمنطق .واسمح لى أن أضيف<br />بداية ما يردده السيد فاروق حسنى يتعارض مع مبدأ الحرية الذى يحاول أن يروج له الوزير!!!!<br />ثم يا سيد فارق ما هذا الخلط بين الاستمتاع بالجمال الذى صنعه الخالق فى الطبيعة أو حتى أبدعه فنان فى لوحة أو تمثال والجمال الانسانى الذى تتصف به أنسانه منحها الله وميزها بعقل هو الاجمل ويحق لها بهذا العقل أن تكون عنصر ايجابى فى الحضارة لا أن تتحول لوحة لتستمتع بها أنت<br />ثم ماذا تريد أن ترى من المرأة؟؟؟<br />لو سلمنا جدلا ووافقنا أن المرأة أجمل لان شعر المرأة كالوردة وعرت المرأة شعرها<br />ماذا عن باقى الجمال فى المرأة ؟؟؟<br />هل سيأتى وزير ثقافة أكثر حرية من جنابك ليقول أن ستر المرأة لباقى الجسد هو تخلف لان الباقى أيضا أجمل ؟؟<br />لا تقحم الجمال فى الاخلاق والقييم والموروث الثقافى يا وزير الثقافة."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232121/http://masr.20at.com:80/article.php?sid=1214"

