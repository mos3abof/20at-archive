[[comments]]
order = 2
subject = "شريف الزفر"
author = "شاول الطرسوسى"
posted = "2006-11-27"
text = "برافو استاذ احمد احييك على المقال وبالنسبه للمريض نفسيا اللى اسمه شريف -- مالك محموؤ اوى وجاى على نفسك كده ؟ ان كان النقاب او الحجاب مزعلك انت حر ياخى لبس مراتك اللى يعجبك انشالله ماتلبسهاش خالص ماحدش هيقولك حاجه ؟ واذا كنت من عينة رووقه يعنى ماليكش غير فى الخشن ابقى لبس اختك ياسيدى وابقى فرجنا جمالها كده وهى بتلعلط بالاستيريتش او بالمينى جيب او الميكروجيب ولو مليكش اخوات بنات ( هقولك ايه) ابقى لبس امك انشالله حتى تلبسها مايوه وتمشيها فى الشارع !ياعم شريف انا عارف انك مسيحى ولكن للاسف جيبت التهذييىء لنفسك لانك اقحمت نفسك فى موضوع ماانتش طرف فيه!لان انت لومسلم هنقولك رسولناعليه الصلاة والسلام قال لا يدخل الجنة (ديوث)---- وبما انك لاتعرف الديوث نعرف هولك هو الذى لايخاف على عرضه ولكنك لا تعرف هذه الالفاظ الغريبه بما انك راجل عر-- قصدى راجل عصرى -- وبتكره العرب اللى جابولك السواد وبتحب اوروبا والغرب اللى عندهم البياض والبلطى والمكرونه وكل انواع الزفاره يازفر"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232121/http://masr.20at.com:80/article.php?sid=1214"

