text = "غلاف الوردة لحمايتها و هى صغيرة و هى حالة يمكن مقارنتها بالطفلة و ليس المراة الناضجة. ايضا النظر الى الكهرباء لن يقتلك محاولة المسك بها هى التى تفتك بيك, أخيرا التماثيل الرومانية كانت مبالغة فنية كمن يصف جمال حبيبتة بالقمر. ليس بالضرورة كل عار جميل.<br />اتمنى ان تفهم"
