author = "ابن عاكف"
posted = "2009-11-16"
text = "هو المرشد عاكف ليس لة ابن كبير كدة وحلو وعايز يفرح بية ويمسكة جماعة الاخوان بعدة - يعنى هيسيب الجماعة كدة من غير ما يسيب احد من عيالة وارث حكمتة وعبقريتة-<br />يا سيادة المرشد<br />ما تمشيش خليك قاعد وهات ابنك دربة وخلية يحكم معاك الجماعة واهو يبقى زيتنا فى دقيقنا واللى نعرفة احسن من اللى مانعرفوش<br />وانصحك ان تعين ابنك مدير مكتب الارشاد وتعدل فى لائحة الجماعة وتخللى وظيفة المرشد بالوراثة"
archived = "2009-11-18"
