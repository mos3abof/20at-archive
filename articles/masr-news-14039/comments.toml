author = "محمد نصر التهامى"
posted = "2009-11-15"
text = "بُوركت يا مرشدنا الغالى ,,, فكم تربيا من موااقفك وكم تعلما من كتاباتك … نعم المرشد انت .. والله إن جماعة الإخوان تحتاج لك ليس لعجز أفرادها على القيام بمهام المرشد ولكن لعظيم قدرك وشأنك .. فأنت رجل وإنسان وقائد وأخ كريم ومرشد عظيم … فنحن لن نتخلى عنك ونريدك معنا كيفما رأت الجماعة إما مرشداً وإما قيادياً وإما جندياً فى الصف الإخوانى… وأنا أحب أن تكون مرشداً,,,"
archived = "2009-11-18"
capture_url = "https://web.archive.org/web/20091118173645/http://www.20at.com:80/masr/news/14039-2009-11-15-09-25-38.html"

