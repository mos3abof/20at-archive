author = "ترتيب اية ؟"
posted = "2009-11-15"
text = "يا عم ارحل بقى<br />وكفاية دورك انتهى على كدة واديت رسالتك وعملت اللى عليك وشكرا<br />ولو اى موقع غير قيادتة حتى كل سنة وجاءت دماء جديدة الحياة هتدب والنشاط هيزداد انما الجمود على قيادة واحدة بيجيب التخلف<br />اتكل على اللة واقعد فى البيت وخللى دكتور من الدكاترة يمسك لفترة انما تقعد على الكرسى لغاية ما تموت فهذا اسلوب فاشل<br />ارحل يا سيادة المرشد وخليها تعمر"
archived = "2009-11-18"
capture_url = "https://web.archive.org/web/20091118173645/http://www.20at.com:80/masr/news/14039-2009-11-15-09-25-38.html"

