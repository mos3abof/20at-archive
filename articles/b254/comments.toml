subject = "تحذير ضرورى"
author = "اسال مجرب"
posted = "2006-01-15"
text = "الى كل الاخوه الذين سيقرؤون هذا المقال لا تنخدعوا بفكرة الكريدت كارد.انا شاب اعيش بالولايات المتحده والكروت هنا شئ طبيعي وعادى لكني كنت اقاطعه بالرغم من قراءتى لبعض الافتاءات التي تجيز التعامل بهذه الكروت.لكن قلبي كان يفتينى بحرمة التعامل.لكنى فى لحظة ضعف وتردداستعملت واحدا منه على اساس انى ساسدد قبل الوقت الذى يجيب فوائد التاخير و هى هنا على الاقل 22% ونجحت في اول الامر لكن بمرور الوقت انجذبت الى الشراء وزاد عدد الكروت وزادت المبالغ ووقعت فى الفخ الذى طالما كنت احذر نفسى منه.والان انا مدين بمبالغ كبيره مع اني اسدد لكن لعنة المال الحرام والفوائد المركبه على المبلغ تجعلك تحت رحمة الدين. و صدق الله حينما حذرنا في كتابه الكريم حيث قال(الذين ياكلون الربا لا يقومون الا كما يقوم الذي يتخبطه الشيطان من المس). ووصف لنا ادعاء اليهود وكذبهم واغرائهم لنا بان نشترى ما نشاء وندفع قبل المده وبهذا تزول الحرمه و شبهة الربا انما كل هذا ما هو الا فخ منصوب ببراعه لنا حيث قال الله(ذلك بانهم قالوا انما البيع مثل الربا واحل الله البيع وحرم الربا) اخوتي ان اصل هذا المال الذي يدفعون به قيمة مشترياتنا هو مال حرام اتى بطرق مشبوهه والمال الذي نسدده وهو حلال انشاء الله يستخدمونه فى تجارات و استثمارات محرمه وكلنا نعرفها.وبهذا نكون قد ساهمنا بحسن نيه فى فعل محرم نتحمل وزره عند الله.ارجوكم لا تنخدعوا بما يسمونه ضروريات العولمه فكل هذا ما هو الا اغراء للوقوع فى الخطاء تماما كالشجره التى اكل منها سيدنا ادم باغراء من الشيطان الرجيم.لا تخرجوا من جنة الله الحقيقيه الباقيه الخالده وتدخلوا جنة الشيطان الزائفه الفقيره.اخيرا اطلب من كل اخ يقرا هذا المقال ان يدعوا لى بتفريج كروبي و همومي التي اصابتنى منذ ان استعملت هذه الكروت اللعينه وهذه حقيقه والله اعلم"
