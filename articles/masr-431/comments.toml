[[comments]]
order = 3
subject = "هوة فى كدة"
author = "بركان"
posted = "2006-06-02"
text = "حسبنا اللة ونعم الوكيل<br />واللة يا جماعة انا لما اقرا الحاجات دى بيجيلى اكتئاب وكراهية لهذا النظام الصهيونى مش كفاية جوعوا الشعب وباعة ارضنا لا كمان بيذلوا فينا واللة زى ما يكونوا يهود ويمكن اكتر على الاقل اليهود مش بيعذبوا شعبهم<br />اللهم انك على نصر المستضعفين قادر وعلى قهر المستبدين قادر فانصرنا ودمرهم"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111125038/http://masr.20at.com:80/article.php?sid=431&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "ياي ..............حاجة فزيعة"
author = "ز...و...ح"
posted = "2006-06-02"
text = "أنا اللي مزعلني وخلاني أتشكك في الحكاية دي إنه إزاي يرموا الأكل ونعمة ربنا على الأرض .. ياي ده حرام والنبي والنبي دا حرام على رأي عفاف رادي .. وإزاي المجرمين الوحشين دول مش يسمحوا بغسل القزازة بمطهر قبل ما تتملي مية نديفة...وبعدين أنا مش مسدق إطلاكا موضوع التلاتين ثانية ده ..لأن بالتأكيد اللي انت عارف إن أي واحد من الكبار قوي قوي عقبال مايظبط الهانش بتاعه على القاعدة البورسيلين بتاعة ابو الفياجرامحتاج فريق من الملاحين الأرضيين علشان يرشدوه إزاي يظبط الهانش على القاعدة وفي زمن أكتر بكتير من نص المدة اللي قضيتيها في المعتكل وبعدين يبدأ في عملية الإخراج الطبيعي أخو التطور الطبيعي ....<br />والله يا أخي بعد ما كنت تعبان قوي من حكايتك المرة مرار العلقم والحصرم والتلتاشر سنة.. قعدت أضحك لأن الشعب النحوس اللحوس ده أكيد عارف كل اللي بيحصل لفلذات كبده من اليوم المشئوم ومع ذلك صابر وساكت ولا يحتج ولا يحتك ولا ينفك يلحس في جزمة الكلاب ...ربنا يعوضك بالجنة يارب وتشوف كل الكلاب دي محشورة ومحصورة في جهنم بتشرب من المهل وبتشخ الماء المهين ...قول آمين... آمين"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111125038/http://masr.20at.com:80/article.php?sid=431&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "رساله من تحت الماء"
author = "الاستاذشيكو"
posted = "2006-06-03"
text = "اولا لا احد يعرف ان كانت الرساله صحيحه ولا لاء<br />بس علي العموم سواء صحيحه ولا مش صحيحه اللي جه فيها شىء بسيط جدا جدا بالمقارنه بالللي بيحصل حتي في القسم العادي اللي الباشا الظابط بيدخل اي واحد مش عاجبه فيه فما بالنا بالي في المعتقل<br />لو كانت الرساله صحيحه فالاخ اللي بيقول كده يحمد الله علي اللي حصله وانها جات لحد كده فيه ناس بيحصل فيها ابشع من ده بكتير بيموت برااااااااحه ووحده وحده<br />ولكي الله ياااااااااااااا مصرنا<br />ولكم جهنم يا بتوع المعتقلات والسجون السياسيه"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111125038/http://masr.20at.com:80/article.php?sid=431&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "وما خفى كان اعظم"
author = "ولاء الشملول"
posted = "2006-06-04"
text = "حقاً نحن نحيا فى بلد حر ديموقراطى...!!<br />وسلم لى على خالتى نزيهة وعمتى شفافية...<br />قال رسول الله صلى الله عليه وسلم:<br />دخلت امرأة النار فى هرة حبستهافلا هى اطعمتها ولا تركتها تأكل من خشاش الأرض.<br />يا ترى اذا كان دا مصير من يسيئ معاملة قطة ...ماذا يكون مصير من يسيئ معاملة الانسان الذى كرمه الله وخلقه فى افضل تقويم؟<br />سؤال يستحق الاجابة."
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111125038/http://masr.20at.com:80/article.php?sid=431&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

