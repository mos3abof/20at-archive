[[comments]]
order = 3
subject = "تغيير الساعة والقطار"
author = "د/ هيثم"
posted = "2006-09-22"
text = "سأحكي لكم موقفا تعرضت له في أحد أيام تأخير الساعة وأترك لكم الحكم.<br />كنت في محافظة المنيا وقمت بالحجز في القطار المتجه إلى القاهرة الساعة السادسة صباحا في يوم تغيير الساعة وسألت موظف حجز التذاكر هل سيأتي القطار في موعده على الساعة الجديدة أم على الساعة القديمة فأجاب بأنه سيأتي طبعا على الساعة الجديدة.<br />وفي يوم السفر توجهت إلى المحطة في الساعةالسادسة صباحا (بعد أن قمت مساء بتغيير الساعة) وجلست أنا والعديد من الركاب الآخرين في انتظار القطار...<br />ومرت ساعة ولم يأتي القطار, فذهبت ومعي العديد من الركاب لنسأل المسؤولين في المحطة عن القطار...<br />وكانت المفاجأة...<br />لقد أجابوا أن القطر عدا من ساعتين...!!!<br />عدا من ساعتين؟!!!<br />إزاي؟!!!<br />قالوا بأن القطار خرج من أول محطة له وهي أسوان قبل الساعة الثانية عشر أي قبل نغيير الساعة ولذلك فقد وصل في السعاعة الخامسة على التوقيت الجديد.<br />قلنا وما العمل الآن وأنتم من قال لنا تعالوا على التوقيت الجديد؟<br />وكانت الإجابة انتوا الغلطانين وذنبكوا على جنبكوا واخبطوا دماغكوا في الحيط.<br />ومن غيظنا ذهبنا وعملنا محضر في قسم شرطة السكة الحديد رغم علمنا أنه لن يقدم ولن يؤخر لأن الشرطة خارج نطاق خدمة الشعب, واضطررنا لحجز مقاعد أخرى على حسابنا في القطار التالي, ومنا من كان ذاهبا لحضور جنازة, ومنا من كان ذاهبا لحضور محاضرة في جامعته وبالتالي ضاعت عليه.<br />هذه حكايتي مع هذا الاختراع المذهل وأترك لكم التعليق."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151310/http://www.20at.com/article2.php?sid=22"
