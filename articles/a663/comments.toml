[[comments]]
order = 1
subject = "nm"
text = "انا والدى دكتور فى الجامعه والناس فعلا بتبص للحكايه دى بغرابه وتسألنى ازاى بيتعامل معاكى أكيد كل شويه ذاكرى ذاكرى بس والله الموضوع غير كده خالص والحياه فعلا بتمشى زى اى بيت فى مصر مع شوية حرص زيا على المظهر العام والحاجات دى"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018185118/http://www.20at.com:80/article.php?sid=663"

[[comments]]
order = 2
subject = "اخطاءتم الزهور والله"
text = "أنا بالفعل زهور لكن والله مش اللي بتتكلموا عليها<br />لأنكم مرة أخرى اخطائتم الزهور<br />وعمري ما شاركت في منتدى عمر خالد ولا أبناء فلسطين<br />والرجاء تزويدي بمعلومات عن زهور المناضلة إن أمكن"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018185118/http://www.20at.com:80/article.php?sid=663"

