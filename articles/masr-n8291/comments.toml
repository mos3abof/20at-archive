posted = "2006-06-12"
text = "طب ولية مانسالش نفسنا مين السبب؟؟ مين اللى خلى الناس تعمل كدة؟؟هوة حد يرضى يضربلدة ؟؟ ابدا بس مفيش غيرة هوة السبب حسني مبارك خلانا ماعندنا ذوق ولا ادب ولا احساس<br />يالا ادوها طراوة وياريت جنب كوبري القبة<br />علشان يحس ويشم مواجعنا<br />لعل النخوة تتحرك فيه ويسيبها مخضرة لينا<br />الله يقرفة زي ماقرفنا"
