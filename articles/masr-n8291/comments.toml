text = "اعتقد ان الموضوع مش استياء الشعب ولا حاجة وان لو الحكومة عملت حمامات عامة هايسيبوهاو يرسمو برضه لا لا . طب انا اول واحد مستاء و لكني لو محصور مش ممكن ارسم في الشارع.<br />المشكلة في اللامبالاة و الذوق العام اللي ضاع للأسف عند معظم الناس .. وافرجها علينا يارب"
