author = "المهتم بالامر"
posted = "2006-06-05"
text = "والله الموضوع جميل وكويس قوى بس هو الاغتراب اللى عامل فى الناس كده، الناس حاسة ان البلد مسروقه ومنهوبة ومافيش وعى والغوغائية هى اللى بتحكمنا والموضوع ده عام يعنى اللى بيعمل كده مين سواقين الميكروباص والعساكر اللى ممكن تبقى واقفة فى الميدان لانه حيروح فين وسواقين النقل العام لان برضه مافيش مكان وواحد ياعينى عنده السكر ومايقدرش يمسك نفسه طيب حيروح فين؟؟؟؟؟<br />وكل ده سوء تخطيط وقلة أدب من الحكومة دلوقتى بكتب لك على دورات المياه الدخول برسوم مقررة من لمحافظة طيب لما يكون ناس غلبانة عارف بيروح يعملها على الحيطة اللى فى ضهر دورة المياه مباشرة.<br />مش باقولك سوء تخطيط من حكومة أستنزافية."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010018/http://masr.20at.com:80/article.php?sid=353"

