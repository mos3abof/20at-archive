subject = "المصرى فى بلدة و برة بلدة"
author = "ايمان محمد"
posted = "2006-06-19"
text = "حنبص نلاقى ان المصرى مبيحترمش بلدة و لا المصرى اللى زية مع انة لو سافر برة حنلاقية بيحترم البلد اللى راحلها هى و اهلهااكثر من بلدة و دة طبعا شىء راجع لعقدة النقص اللى عندة واحساسة بالفقر والعوز و التربية الغلط اللى اتربى عليها و اللى علمتة ان الاجنبى احسن منة"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144114/http://masr.20at.com:80/article.php?sid=353"

[[comments]]
order = 43
subject = "كله تمام يا بلد"
author = "هانى"
posted = "2006-06-19"
text = "والله انا قرات كل التعليقات تقريبا واجمعها فى امرين اللى انا شايف من وجهة نظرى المتواضعة انهم السبب فى الفن الجميل اللى تحت الكبارى:<br />1- ده سلوك شعب سلبى من ضمن الاف السلوكيات المتناقضة فى مجتمعنا ذى رمى الزبالة فى الشوارع والمرور وسط الطريق بالرغم من وجود كبارى وانفاق لعبور المشاه يعنى الاول هوة سلوك<br />2- ان كل واحد- مش الكل طبعا- الغالبية بتشعر ان هى بتقضى يومها ولحظتها فى البلد دى وبس يعنى مش مشكلة عندها غير حالها هى بس والبلد تولع والسبب طبعا ضيق الحال والبحث الصعب عن لقمة العيش والغلى وضعف او نقزل انعدام الدخل فى الوقت اللى بيسمعه فيه ارقام خيالية مسروقة من البلد ..نفس البلد اللى هما مش لاقين فيها قيمتهم او لقمة عيشهم<br />بس بصراحة اسلوب ممتاز لعرض نقدلازع لحال مجتمعنا<br />http://hanyalfawal.jeeran.com/"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144114/http://masr.20at.com:80/article.php?sid=353"

