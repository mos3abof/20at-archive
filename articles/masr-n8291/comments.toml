subject = "مش غريبة عليك يا مصر"
author = "عبد الرحمن"
posted = "2006-06-19"
text = "مش غريبة عليك يا مصر اللي بيعملوه ولادك فيك<br />قرأت أحد كتب التراث وربما كان تاريخ الجبرتي: أن صلاح الدين الأيوبي لما نزل بديار مصر ورأى ظاهرة التبول في الطرقات أصدر حكما بجلد كل من سولت له نفسه أن يشخ في الطريق وبل الفعل امتنع التاس عن ذلك<br />يحكي الجبرتي أن القاهرة سالت أزقتها وشوارعها أنهارا من البول يوم أن سمع الناس خبر وفاة صلاح الدين الأيوبي<br />تفتكروا ليه؟"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144114/http://masr.20at.com:80/article.php?sid=353"

[[comments]]
