[[comments]]
order = 11
subject = "دورات الرسم فى وسط البلد"
author = "Mero"
posted = "2006-05-22"
text = "بجد الموضوع ده بقى فعلا ظاهرة، و ياعينى بقى لما تيجي تتفرج على سواقيين التاكسي و المكروباصات على السور الي بعد مترو الجامعة، نص سواقيين مصر بيروحو يرسمو هناااك ، ههههههههه .<br />و دي بعض دورات الرسم - المياه طبعا - الي ممكن الناس تغنى فيهافى وسط البلد، براحتها و ببلاش كمان D:<br />1. كنتاكي، و ده طبعا احسن مكان<br />2. فى 2 كوفى شوب جنب كنتاكي، كمان<br />3. البستان سنتر، و لو الفراش قالك صباح الخير يا بيه قولو \" صباح النور\"<br />4. فى جراج جنب الهيلتون فيه عدد 2 مبولة، و احواض وضوء فى اوله<br />و اخيرا عايز اشكر الحكومة انها رجمتنا من الحمام العمومى الي كان تحت كوبري اكتوبر الي من ناحية سلم التحرير و بدلته بجنينة دمها خفيف، و غقبال بيقيت الدورات الكوبريه D:"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010018/http://masr.20at.com:80/article.php?sid=353"

