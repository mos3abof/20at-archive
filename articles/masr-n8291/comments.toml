subject = "شفرة دافينشي"
author = "مغترب"
posted = "2006-05-27"
text = "تحية إلي الانسان المصري المبدع..... حياتنا كلها إبداع.... تبدأ من المقدرة و اللياقة البدنية و الخفة في اللحاق بالاوتوبيس تليها الصبر و تحمل زنقة المواصلات و تليهافن كتم الغيظ و الإبداع أمام مدير متسلط مش فاهم راسه من رجلة.... و نهاية بعقلية إقتصادية مبدعة في مواجة طوفان غلاء ..... و<br />يا جماعة كل الصور اللي شوفناها و حسينا بيهاو تقريبا شمناها دي عبارة عن شفرة دافينشي..... من خلال كل الصور دي و بعد ما فكينا الشفرة العجيبة دي..... لقينا ان دي رسالة تحذير من الأنسان المصري للإنسان المصري.... و لو استمر حالنا علي كده..... مصر كلها هتغرق و الصور دي هتبقي في كل حته في مصر مش تحت و فوق الكباري بس (مغترب)"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010018/http://masr.20at.com:80/article.php?sid=353"

