subject = "الشعب الفنان"
author = "تفاعل كيميائي"
posted = "2006-05-21"
text = "بسم الله الرحمن الرحيم طبعا الموضوع دة لا يختلف علية اتنين برغم ان استاذ احمد الهواري صديقي العزيز اجاد استخدام بعض المصطلحات.<br />وجهة نظري ان الشعب المصري لما بيعمل كدة مش علشان (يفك زنقتة ) و انما دة تعبير عن الاستياء.<br />بمعني اخر الشعب نفسة في كدة يعني لو جبتلة حمام او دورة مياة هيسيبها و هيقف يرسم برضة.<br />و بعدين اية هي البلد؟<br />البلد هي عبارة عن دورة مياة او حمام كبير و اكيد انتو فاهمين قصدي.<br />وبعدين الحكومة عاملة الكباري مخصوص علشان كدة ( تمسك الناس و هي بترسم )<br />عموما ربنا يقلل من الكباري"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010018/http://masr.20at.com:80/article.php?sid=353"

