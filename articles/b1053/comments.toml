subject = "المخدوعون"
author = "عزيزالمغربي1982"
posted = "2006-07-11"
text = "بسم الله الرحمان الرحيم<br />و الله إننا نأسف لما أقرأمثل هذه التعليقات على رجل ما قدم للامة من شيئ سوى تعليمها الإباحية وقلة الادب الذي يسمى الفن؟؟؟؟؟<br />نتمنى من الله العفو على جميع الممثلين الآخرين قبل فوات الاوان<br />ووفي النهاية إما قول الحق أم الصمت<br />والسلام ختام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132357/http://www.20at.com/article2.php?sid=1053"

