[[comments]]
order = 7
subject = "برافو دعاء"
author = "Dabdoob"
posted = "2006-07-11"
text = "برافو يا دعاء فعلا<br />الموضوع توقيته هايل ومعلوماته كويسة<br />كانك كنتي عارفة انه هيموت!!!<br />بس احب اضيف انك نسيت اجمل ادواره فعلا بالرغم من صغر الدور وهو دوره في فيلم حب في الزنزانة لانه الدور الوحيد غير النمطي الذي اداه في حياته<br />وسلام<br />مفيش فايدة<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132357/http://www.20at.com/article2.php?sid=1053"

