subject = ""
author = "بياع كشرى"
posted = "2009-09-10"
text = "اى واحد ممكن يحكم البلد دى<br />كدة بالفكاكة<br />يعنى التاريخ بيقول ان الخليفة العباسى اختار واحد والى يحكم مصر<br />والوالى دة كان قاعد فى بغداد ومبسوط ومكسل ييجى مصر يحكمها فارسل عبدا مخصى من عبيدة والعبيد الخصيان هم من يخدموا الحريم - هذا العبد المخصى الذى ارسلة سيدة الى مصر ليحكمها اسمة احمد بن طولون<br />وجاء هذا المخصى وحكم مصر وبنى جامع كبير قوى اسمة جامع ابن طولون<br />يعنى بصريح العبارة اى واحد ممكن يحكم البلد حتى ولو كان بياع كشرى"
archived = "2009-09-14"
capture_url = "https://web.archive.org/web/20090914134649/http://www.20at.com:80/masr/2khbar/13410-2009-09-10-07-24-33.html"

