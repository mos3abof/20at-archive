author = "يعنى اية سياسة"
posted = "2009-09-10"
text = "يعنى اية سياسة فى مصر<br />يعنى حمبوزو لاوى بوزو وعنية حمراء لية<br />سياسة اية يا ابا الحاج<br />احنا طابخين بامية مقمعة ومشرفة اخواتها الاربعة وعندنا سلطانية ملوخية بايتة<br />وطرشة ميتة حمراء<br />مش هى السياسة كدة برضة"
archived = "2009-09-14"
capture_url = "https://web.archive.org/web/20090914134649/http://www.20at.com:80/masr/2khbar/13410-2009-09-10-07-24-33.html"

