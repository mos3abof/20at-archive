[[comments]]
order = 4
subject = "ريا وسكينة"
author = "مفروس"
posted = "2006-05-02"
text = "أكيد التعليق الذي حذف من المقال وربما يريد الكثيرون ترديده هو نفس الكلمة التي قالها الفنان عبد المنعم مدبولي للفنان أحمد بدير ثلاث مرات عندما أراد الأخير أن يصافحه في أحد مشاهد مسرحية ريا وسكينة ... لكن اللهجة القاهرية أكثر دلالة على ما يدور في النفس من اللهجة السكندرية التي استخدمها مدبولي ... المهم أن يتجنب الإنسان عمل أية حركة احتجاجية من منطقة الخيشوم"
archived = "2006-05-05"
capture_url = "https://web.archive.org/web/20060505053222/http://masr.20at.com:80/article.php?sid=245"
