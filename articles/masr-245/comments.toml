order = 3
subject = "يا جماعة متفهموش غلط"
author = "طبعا هى أكيد غلطة مطبعية، والأكيد إنهم يقصدوا الفكر السمكى، ودا فكر خاص بالناس اللى عايشين فى المناطق الساحلية، والناس اللى بيعتنقوه بيأذنوا للصلاة عادى مع الناس بس ساعة الصلاة، وبما إنهم على الساحل لازم يأدوا الصلاة مع الإمام السمكى فى أقرب بركة مياه، وطبعا كا ما كان فى مكان عميق أحسن عشان يزيد خشوع وتقوى ويتنفس مع السمك، والـ....، ......هااااااااااااااه"
posted = "2006-05-01"
text = "وعندها أدرك شهريار الصباح ، ....."
