text = "اولا انا مش اخواني ولا يشرفني ان اكون اخواني يكفيني فخر اني مسلم مصر اجدعها راجل انا بقا بقول يا ناس ياللي عاملين فيها جامعيين انكم معندكوش نخوة ومخكم ضلم ليه الموضوع بيناقش القناة دى يبقي تعليقي يكون عليه ايه اللي جاب الوليد بن طالال بالموضوع المفروض دى حمله لشباب الصحفيين بعشرينات ولاازم نساعدهم لو الموضوع عام كنت هبقي معلق بصفه عامه<br />وبعدين اللي عنده بنات اكيد مش هيفكر يشوفوا الكلام بالقناة دى والا هيطبقوا في الجامعه عدل عموما بعتذر لكم علي اي سؤ فهم المهم وحدة الوطن والخلاف لايفسد للود قضيه<br />ل"
