posted = "2007-05-02"
text = "هو ماينفعش نتكلم مع بعض بأدب؟ القناة دي بالفعل على قدر كبير من الحرفية و بها العديد من البرامج الجذابة و المحترمة.<br />و يؤخذ عليها إذاعة الأفلام بلا قطع.<br />و بالنهاية الاختيار للمشاهد معاك ريموت كنترول ماتتفرجش على أفلام في OTV إتفرج علي إقرأ أو العربية أنت حر و غيرك أيضا حر.<br />أنا عن نفسي لا أقوم بتشغيل أى قنا للوليد ابن طلال حتى قناة الرسالة لعدم ثقتي بنواياه.<br />مش ممكن نفهم الحرية أنت حر في نفسك فقط."
archived = "2009-05-21"
capture_url = "https://web.archive.org/web/20090521081844/http://20at.com:80/masr/t7kyk/5685.html"

