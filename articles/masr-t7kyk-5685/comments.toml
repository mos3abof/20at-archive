[[comments]]
order = 11
subject = ""
author = "عبدالرحمن سمير"
posted = "2007-05-12"
text = "السلام عليكم<br />بارك الله فيكم جميعا … المقال به العديد من الأفكار التي لا تظهر إلا في هذه الأوقات فقط .(أوقات الكلام)<br />وحتي لا نخوض في الحديث إلي نقاط أخري .. فأنا لا أعرف كاتب المقال ولا أعرف أيضاً من الدكتور الذي أخذ منه الحديث .. وهذا ليس تشكيكاً في حديثهم .. ولكنه ليش شئ ملموس مُصدق به .. والذي أراه ملموس هو مُشاهدة القناة بنفسي حتي أستطيع أن أتكلم .<br />ولدي تعليق بسيط علي ما علق به البعض في ردود سابقة .. الكثير كتب ونحن سنغير القناة والشبكة ( هل حقاً رأيت القناة حتي تحكم عليها ؟ ) هذه السؤال للجميع .. والإجابة لا نُريدها هنا حتي لا نذهب بالحديث إلي مواطن أخري .<br />عن نفسي سأشاهد القناة .. وأقوم بتدوين ما أراه .. وأطلب من الجميع هذا (أحكم بنفسك علي ماتراه وليس بما تسمعه وتقرأه)<br />مع مراعاة شئ هام .. التفاههه قائم عليها 90% من القنوات الفضائية .. فالهدف من أن نري القناة هو وجود مشاهد فاضحة لم تراها الشعوب العربية في أغانيها وأفلامها ومسلسلاتها .<br />وتعجبت كثيراً لبعض آراء الفنانين والكتاب والنقاد في هذا المقال ووصفهم بأن القناة تخدش الحياء .. وهل ما تقدموه لنا لا يخدش الحياء .. بالله عليكم شاهدو أنفسكم وحاسبوا أنفسكم قبل أن تنقضوا شئ أنتم تفعلوه أيضاً .<br />لنحتكم إلي ما تراه أعيننا فقط .<br />إن شاء الله سأكون معكم وكل من يُثبت ذلك .. بعد الملاحظة .<br />في حفظ الله"
archived = "2009-05-21"
capture_url = "https://web.archive.org/web/20090521081844/http://20at.com:80/masr/t7kyk/5685.html"

