[[comments]]
order = 13
subject = ""
author = "hassan mohmed saleh"
posted = "2008-01-11"
text = "والله ياجماعه لا ا عرف ليه بنشغل نفسنا بالتفاهات الامور … احاديث الرسول صلوات الله وسلامه عليه اشارات ان هنااناس ياتون في اخر الزمان وهم ارذل الناس واحطهم يتكلمون في امور العامه … وبعدين ليه نعطي دايما المواضيع ولا شخاص المنحطين اكبر من حجمهم لا حمله ولا غيروا را ح تسكت هذاه الافواه القذره … وحده التمسك بتعاليم الا سلام وجعله ظاهر في سرك وعلانيتك هو السلاح الوحيد الذي يقهرهم … ولهذا قال القذر هذا اعلاه في مقابلة سابقه انه يستعجب من المد الا سلامي هنا وهناك … ؛(وفي هذا دليل واضح)واخير وليس اخر تطبيق الدين الصحيح بما فيه من نعاليم كامله وواضحه هو المخرج الوحيد لهذه الامه … مادام ياخوان لسنا قادرين على ايقاف المهازل الذي تحدث من تهجم على الاسلام وعلى المحجبات وفتاوى في غير محلها واحسباه والله مدفوعة الاجر مسبقا وعلى كل ماهو اسلامي او يمت الي الا سلام بصله في بلدان الغالبيه العظمى من سكانه يدينون الاسلام فلماذا لا نبداء الاصلاح من انفسنا من بيتنا من شارعنا ومن ثم نطلق الى الافاق لان \" الله لا يغير ما بقوم حتى يغيروا ما بنفسهم \""
archived = "2009-05-21"
capture_url = "https://web.archive.org/web/20090521081844/http://20at.com:80/masr/t7kyk/5685.html"
