subject = "فعلا الإخوان خذلوا القضاة"
author = "حسين عبد الرحمن"
posted = "2006-05-09"
text = "الإخوان لم يخذلوا القضاة فقط بل خذلوا الشعب الذى كان ينتظر منهم خير ... هم يقولون أنهم مشغولون بتربية الشعب !!!! ربما شعب بوركينا فاسوا لذا لم نراهم فى مظاهرات دعم القضاة"
archived = "2006-09-06"
