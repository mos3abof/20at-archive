[[comments]]
order = 9
subject = "مش أوي"
author = "قذائف الحق"
posted = "2006-05-10"
text = "السلام عليكم<br />الاخوان كانوا موجودين يوم الخميس اللي فات<br />بأعداد مش كبيرة قوي<br />و بكرة انشاء الله هيكونوا موجديين بأعداد أظنها هتكون كبيرة<br />أنا عايز الاخوان يعملوا حاجات أكتر لنصرة القضاة و لكن<br />1-أحيانا تحالف القوى الوطنية بيحدد الاعداد المطلوبة في الفعاليات و بتطلب من الاخوان أعداد محددة و ليس الحشد<br />2-المطلوب أن كل القوى الوطنية تكون ظاهرة في مظاهرات القضاه ووجود الاخوان بشكل كبير بيوحي انها قضية الاخوان بس<br />3-الطلبة و هم الذراع الضارب للاخوان عندهم امتحنات , حتى ان في مناطق كتير الاخوان الكبار في السن قاموا بلصق بوستر \"لا للطوارئ\"<br />و مع ذلك نفسي اننا -الاخوان يعني - نعمل أكتر لنصرة القضاة لأن دي قضيتنا الكبرى دلوقتي<br />العدل العدل العدل<br />سلام<br />أخوكم قذائف الحق<br />من الاخوان"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

