author = "إنسان"
posted = "2006-05-14"
text = "أكبر هدية يمكن أن ينتظرها مبارك وكلابه هى تدخل الأخوان بكل قوتهم فى أزمة القضاة الحالية<br />ولا يعنى هذا أن الأخوان قد خذلوا القضاة<br />بالعكس فكاتب المقال نفسه اعترف بتحرك الأخوان<br />ولكن يجب أن تكون كل الأمور مدروسة<br />فما ينتظره منك عدوك هى لحظة حماقة يندفع بعدها ليطيح بالكل تحت زعم أن القضاة الذين تحركوا هم من الأخوان أو أنهم تحركوا للقيام بانقلاب سياسى لمصلحة الأخوان<br />وأخيراً لا يمكن أن ننتظر فى اللحظة الحالية أن يقوم كل تافه بركوب الموجة<br />إن مجرد انتصار القضاة فى قضيتهم هو لحظة البداية لانهيار الفوضى الحاكمة حالياً<br />لذا علينا أن ندعمهم لا أن يحاول تافه استغلال الموقف لبث سمومه وكراهيته وحقده للإخوان<br />كما ينبغى التصدى للتافه سامح عاشور الذى يحاول استغلال الموقف للحصول على ميزات رخيصة تدعم موقفه بين المحامين<br />علينا أن ندفع كل الانتهازيين إلى مكانهم الطبيعى الذى سيجلس فيه الطاغية<br />مزبلة التاريخ"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 28
subject = "من يتصدى لهذا الحيوان؟؟؟؟"
author = "إنسان"
posted = "2006-05-14"
text = "أكد سامح عاشور نقيب المحامين ورئيس اتحاد المحامين العرب أن بعض قوى المعارضة فى مصر وكذلك من لهم خلافات فى وجهات النظر مع الحكومة المصرية فى بعض الأمور يعملون على تأجيج نيران الخلافات الراهنة فى نادى القضاة وإشعال الموقف من خلال السعي لنصرة فريق على آخر من الأطراف المختلفة بهدف تحقيق أهدافهم .<br />رفض المحامون العرب المشاركون فى اجتماعات المكتب الدائم للامانة العامة للاتحاد فى اليوم الثانى لانعقاده بمدينة سرت الليبية إصدار بيان يتعلق بالأزمة الراهنة فى نادى القضاة بمصر مؤكدين احترامهم وتقديرهم لقضاة مصر وقضائها المستقل، معتبرين ما يجرى فى صفوفهم شأنا داخليا .<br />وأوضح سامح عاشور أن ما يحدث فى هذه الأزمة إنما هو خلاف بين أعضاء مجلس القضاء الأعلى المعنيين بكافة شئون القضاة والذين تقلدوا عضوية هذا المجلس وفقا لكفائتهم وأقدميتهم المطلقة دون أن تتدخل الدولة فى اختيارهم بأى شكل وبين مجلس ادارة نادى القضاة المنتخب .<br />وشدد على حرص الشعب المصرى بصفة عامة ونقابة المحامين بصفة خاصة على استقلال القضاء ورفض التدخل فى الخلاف الدائر لمناصرة فريق على آخر من بين القضاة الذين نكن لهم جميعا كل الاحترام والتقدير ."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 29
subject = "استنوا شوية"
author = "رشاااد"
posted = "2006-05-15"
text = "الاخوان فى الفترة الاخيرة ردود افعالهم متاخرة اوى انا ما بانكرش انهم بيشاركوا وبنصيب كبير و مابنكرش تضحيتهم لكن متاخر و اوى كمان دايما بيبقوا اخر القوى المشاركة مع انهم بيقولوا انهم بيقودوا التغيير وارجعوا لكل احداث الحراك السياسى فى مصر علشان تتاكدوا انا مرة اخرى لا اقلل من اسهام الاخوان و لكن الوم عليهم تاخرهم و اذكر شباب الاخوان بان ترك القوى الوطنية تتهاوى الواحدة تلو الاخرى سيجعلهم وحدهم فى الميدان ايضاوتذكروا حكمة مت يوم ان مات الثور الابيض و اخيرا تذكروا ان ليس كل الاشياء بالامر و التوجية لا تنتظر امرا لتضحى لوطنك او دينك اين الذاتية فى الحركة ؟ ملحوظة هذا ليس كلامى وانما كلام المرشد فى المصرى اليوم حينما قال ان شباب الاخوان لم يشاركوا فى المظاهرات بتكليف"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 30
subject = "الإخوان هم أمل مصر"
author = "مصرى"
posted = "2006-05-20"
text = "الإخوان المسلمين هم أمل مصر لتحريرها من عبودية حسنى مبارك ونحن معهم ومؤيدين لهم لتطهير مصر من هؤلاء الخونة والقضاء هم الدرع الواقى الذين نحتمى به فلا تخزلوا المصريين وجاء يوم الإنتقام لمصر كلها"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 31
subject = "كفاكم ظلم للإخوان"
author = "صلاح جمعة"
posted = "2006-05-21"
text = "أرجوكم.كفاية ظلم للإخوان فهم رمز التضحية والبذل والعطاء علي مر العصور.وحكومتنا الرشيدة تقف لهم بالمرصاد سواء بالإعتقال او بمنع صدور جريدة وماخفي كان أعظم.وطبعا كل المرتزقة حاملي الأقلام ماشيين ورا الموجة..والموجة الآن هي كرة الأخوان..اذن لازم هما كمان يكرهوا الإخوان علشان ينالهم نصيب من الكحكة.<br />والله غالب علي أمرة صدق الله العظيم"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
