text = "السلام عليكم<br />أنا ذهبت اليوم الخميس 11-5-2006<br />معرفتش افلفص<br />الامن المركزي خانق البلد<br />استنيت شوية يمكن افلفص أو حد يقوللي نروح على التحرير أو رمسيس ملقتش حاجة<br />رحت طالع على الشغل<br />أنا بقترح ان يتعمل حاجة غذا بعد صلاة الجمعة في كل حته لوحدها زي أيام تعديل الدستور<br />حد عنده أخبار تانية؟<br />سلام<br />أخوكم<br />قذائف الحق"
