[[comments]]
order = 2
subject = "ومن يدفع الضريبة يا صديقي ؟؟؟"
author = "علاء"
posted = "2006-05-09"
text = "عفواَ عزيزي كاتب المقال... أنا أقرب منك لأزمة القضاة فأرجو أن تعي كلامي.. مشكلة القضاة ليست فيمن يقف بجانبهم فالشعب كله لو استطاع لخرج خلفهم .. ولكن مشكلتهم تبدأ أو فلنقل بدأت عندما تدخلت فصائل بعينها وجماعات معلومة بتوجهاتها لينتصروا لأنفسهم باسم القضاة فوقع الأخيرون في حرج بالغ أولاًً : لما أشاعته أبواق السلطة من أن القضاة يتكلمون بلسان تلك الجماعات.. ثانياً : من خشية الجميع بأنه لو انتصر القضاة سيكونوا مطالبون بسداد الفواتير لمن وقفوا بجانبهم وللأسف كثيرون منهم سيمثلون قريباً أمام منصة القضاء .. فهل لك أن تتخيل الحرج الذي وقع فيه نادي القضاة؟؟"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "الرد على جمال سلطان"
author = "إيهاب"
posted = "2006-05-09"
text = "قام الأستاذ أسامة العيسوى بالرد على كاتب المقال الأستاذ جمال سلطان وتم نشر الرد فى جريدة المصريون ، وهذا جزء منه ...<br />مقالك المنشور اليوم في زاويتك تحت عنوان ((هل خذل الإخوان القضاة ؟! ))<br />الذي جاء فيه : ((من حق الرأي العام السياسي في مصر أن يسأل عن أسباب تجاهل الإخوان المسلمين لانتفاضة القضاء ، فلم نسمع عن أي مسيرة تضامن إخوانية أو مشاركة في دعم انتفاضة القضاة )) ، ((الاتهامات التي وجهها البعض إلى الإخوان بخذلان القضاة في موقفهم الأعظم في تاريخ مصر الحديث لها ما يبررها وما يدعمها في الواقع العملي ، أين هي حشود الإخوان الشعبية التي رأيناها في الانتخابات البرلمانية من الإسكندرية شمالا إلى أسوان جنوبا ، أين هي عشرات الآلاف من الشباب الذين كانوا يحتشدون من أجل الدفاع عن أصوات مرشحيهم وحقهم في المشاركة السياسية حتى سالت دماء المئات منهم واستشهد آخرون ، فص ملح وذاب ، لا أحد يسمع لهذه الحشود صوتا ، وتركوا القضاة وحدهم في معركة الوطن كله ))<br />فأرجو أن يتسع صدرك لما أقول ، أرأيت ياسيدي أن كتاباتك أحيانا تكون مجانبة للواقع بل للصواب وأدلل لك على ماأقول<br />ألم تعلم ياسيدي أن أول تحرك في مجلس الشعب كان من نواب كتلة الإخوان في مسألة القضاة من إستجوابات وطلبات إحاطة عن هذه المشكلة وإليك بعضا منها :<br />1- ((نواب الإخوان أجبروا البرلمان على مناقشة التصعيد ضد القضاة إخوان أون لاين - 19/04/2006 )) وجاء في مقدمة تفاصيل الخبر مايلي ((أجبرت الكتلة البرلمانية لنواب الإخوان المسلمين وعددٌ من نواب المعارضة والمستقلين البرلمانَ المصريَّ على فتح موضوع التصعيد الحكومي ضد القضاة؛ حيث ناقش البرلمان البياناتِ العاجلةَ التي قدَّمها نواب الإخوان وغيرهم. ولم يجد الدكتور فتحي سرور رئيس البرلمان مفرًّا من مناق<br />اقرأ بقية التعليق .."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "بقية الرد"
author = "إيهاب"
posted = "2006-05-09"
text = "2- (( كتلة الإخوان تتبنى مشروع قانون السلطة القضائية )) إخوان أون لاين - 07/03/2006<br />3- ((اعتقال عبد القدوس لمنعه من الاعتصام تضامنًا مع القضاة )) إخوان أون لاين - 27/04/2006<br />4- ((تأجيل محاكمة القضاة وسط مظاهرات غاضبة والاعتداء على نواب الإخوان)) إخوان أون لاين- 27/04/<br />ومما جاء في بعض التفاصيل ((وحاصرت أعدادٌ ضخمةٌ من قوات الأمن نوابَ الإخوان والآلافَ من أفرادِ الإخوان والجماهير المنضمة إليهم لمنعهم من الوصولِ إلى دار القضاء العالي؛ حيث قامت هذه القوات بالاعتداء على نواب الإخوان، كما وقعت اشتباكات بين الجماهير وقوات الأمن التي أغلقت شوارع وسط القاهرة تمامًا لمنع أي فعاليات تضامنية مع القضاة ))<br />5- ((سياسيو الإسكندرية يعلنون وقفهم بجانب القضاة )) إخوان أون لاين - 27/04/2006<br />ومن بعض جاء في الخبر مايلي ((أكد المشاركون في المؤتمر الجماهيري- الذي نظمته اللجنة السياسية بالنقابة العامة للمحامين، بالتعاون مع كتلة نواب الاخوان المسلمين بالاسكندرية- على دعم الشعب بكل طوائفه وفئاته للهيئة القضائية في موقفها الحكيم الذي تتبنَّاه في معالجة أزمة نظام وتجنب كارثة محققة ))<br />وجاء به أيضا مايلي : (( وقد شارك في المؤتمر الذي عُقد الأربعاء 26/4/2006- وسط حصار أمني غير مُسبَق لنادي المحامين البحري بالإسكندرية- حشدٌ كبيرٌ من الشخصيات السياسية والمحامين والمثقفين والمهتمين بالشأن العام، كان في مقدمتهم د حمدي حسن، وصبحي صالح، وصابر أبو الفتوح أعضاء مجلس الشعب، وأحمد سيف الإسلام حمد الناشط في حقوق الإنسان، وأحمد الحمراوي أمين عام نقابة المحامين بالإسكندرية، وعلي عبد الفتاح أمين اللجنة الشعبية لمناصرة الشعب الفلسطيني، وفهمي فتح الباب رئيس نادي أعضاء هيئة التدريس بجامعة الإسكندرية، ود. أسامة نصر ال<br />اقرأ بقية التعليق .."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "بقية الرد 2"
author = "إيهاب"
posted = "2006-05-09"
text = "6- ((مؤتمران بالقاهرة والإسكندرية لدعم ومناصرة القضاة )) إخوان أون لاين - 26/04/2006<br />ومن بعض جاء في الخبر مايلي ((وفي الإسكندرية وتحت شعار (كلنا مع القضاة) تنظم الكتلة البرلمانية لنواب الإخوان المسلمين بالإسكندرية- بالتنسيق مع اللجنة السياسية للنقابة العامة للمحامين- مؤتمرًا شعبيًّا حاشدًا مساء اليوم أيضًا بنادي المحامين بكورنيش الإسكندرية لمناصرة القضاة والوقوف بجانب القضاة المعتصمين ))<br />وحضر المؤتمر حسب تقدير بعض وسائل الإعلام عشرة آلاف<br />ومما جاء بالخبر أيضا ((هذا وقد توجَّه وفدٌ من كتلة نواب الإخوان بالإسكندرية، يتكون من صبحي صالح، والمحمدي سيد أحمد، وصابر أبو الفتوح لنادي القضاة بالإسكندرية بعد قرار المستشار محمود خضيري باعتصام نادي قضاة الإسكندرية تضامنًا مع نادي قضاة القاهرة بخصوص تحويل المستشار أحمد مكي والمستشار هشام البسطاويسي للتحقيق.<br />الجدير بالذكر أن وفدًا من نواب الكتلة البرلمانية للإخوان المسلمين قد زارَ نادي قضاة مصر السبت الماضي، والتقَوا مع القضاة المعتصمين، وأكدوا أنهم في صفِّ القُضاة وبجانبهم؛ لأنَّ حصانةَ القُضاة المدافعين عن الحق هي حصانةٌ لمصر كلها؛ باعتبارهم سدنةَ العدالةِ وحائطَ الصَّدِّ الأخيرَ للحفاظ على كرامة هذا الشعب وحريته ))<br />7- ((20 بيانًا عاجلاً و95 نائبًا يطالبون بمناقشة التصعيد ضد القضاة )) إخوان أون لاين - 17/04/2006<br />ومما جاء بالخبر ((قدَّم أكثر من 20 نائبًا ينتمون للكتلة البرلمانية لنواب الإخوان المسلمين بالبرلمان المصري بياناتٍ عاجلة لرئيس مجلس الوزراء المصري ولوزير العدل حول قرار الوزير بتحويل المستشارين أحمد مكي وهشام البسطاويسي لمجلس الصلاحية )) ، ((على جانبٍ آخر قدَّم أكثر من 95 نائبًا يمثلون كتلة الإخوان وعدد من المستقلين والمعا<br />اقرأ بقية التعليق .."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "مممم؟ أمال مين اللي كان موجود يوم المحاكمة ؟"
author = "محمد السيد"
posted = "2006-05-10"
text = "لا أظن ...<br />طبعا مش كفاية ظني ... لكن الردود اللي بعثها إيهاب من قبلي كفاية ...<br />زائد إن اللي شفته يوم محاكمة القضاة بعنيا الخميس قبل الماضي يدل ... إن أكبر المتواجدين والحشود كانت من الإخوان ...<br />وعلي فكرة صور الضرب اللي صورتها الجزيرة كانت الصبح ... وكانت موجهة لتجمعات الإخوان .....<br />فمش فاهم الكاتب يقصد إيه من خذلان الإخوان للقضاة .<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "الجدع جدع والجبان جبان"
author = "وليد"
posted = "2006-05-10"
text = "من لا يدرك حقيقة اللحظة الآن فستتجاوزه الاحداث والاخوان مطالبون بالكف عن التردد واستخدام صيغة الاستضعاف والترصد ،الاخوان جمعوا الرصيد الاحتجاجى الاكبر لدى الشعب المصرى ولا يصح ولا يجوز وطنيا واخلاقيا ودينيا ان يبدد هذا الرصيد الوطنى لحساب الجماعة فقط ،عايهم ان يحسموا ترددهم وان يكفوا عن التعالى عن تضحيات الاخرين ،وفى النهاية تحية للشباب الشجاع والبريء الذي يدفع ضريبة الوطن دون ان يسال جزاءا او شكورا وتحية للفتيات المصريات اللائى يثبتن انهن بالف راجل، تحية لندى القصاص فى زنزانتها ولرشا عزب واسماء وكل المعتقلين فردا فردا فان شجاعتهم جميعا تعطينا القوة واليقين"
archived = "2006-09-06"
