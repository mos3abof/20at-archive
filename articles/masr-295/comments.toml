subject = "اخدوا صاحبى منى"
author = "ياء"
posted = "2006-05-12"
text = "مكتوبالك يا محمد يا سيد<br />على فكره محمد اتاخد من قلب ميدان رمسيس اخدوه من جوه الجامع اه من جوه الجامع<br />محمد اخد 15 يوم حبس (يعنى الامتحانات راحت عليه )<br />منهم لله اخدو صاحبى منى<br />فى نشيد كنا بنسمعوا مع بعض كان بيقول<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 16
subject = "القضاة والاخوان"
author = "احمد الاسكندرانى"
posted = "2006-05-13"
text = "السلام عليكم اولا احيى اخى ايهاب على تعليقة الجميل الرائع وارد على الكاتب الذى يجهل كثير من الاشياء وهى الثكنات العسكرية التى توجد فى كل مكان فى القاهرة بسبب من غير الاخوان والذين تم اعتقالهم امثال د/ابراهيم الزعفرانى عضو مكتب الارشاد الخميس الماضى اليس هذا الرجل من رموز الاخوان كفاية عليك كدة سلاااااااااام"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 17
subject = "عيش اهبل"
author = "ياقوى"
posted = "2006-05-14"
text = "عيش اهبل تموت مستور<br />عيش عاقل تموت مقهور<br />احسبها وفكر واختار<br />وهادلك لو فكرك حار<br />دى نصايح سهله وبسيطة<br />تعملها تنفد بحياتك<br />تهملها تبقى ابن عبيطه<br />آخر حاجة اتعلمناها<br />كانت لسه امبارح العصر<br />كل حاجة ناوى تعملها<br />لازم تبقى فى حب مصر<br />زور وانهب واسرق واجرى<br />وابنى لك كام فيللا وقصر<br />واعمل زى توتو الأمور<br />زور شهادات جامعة وتجنيد<br />يمكن تبقى ف يوم دكتور<br />وان مسكوك حطوك فى حديد<br />ماتخافش وخليك صنديد<br />امسك مصحف قول ماحصلش<br />دا انا فنان لسه ما حصلش<br />وشوف لك كام عيل مسطول<br />يهتفوا باسمك كده على طول<br />ومتنساش البانجو بتاعهم<br />لو هيفوقوا هتضيعهم<br />تفرق ايه عن ايمن نور؟<br />ده سؤال اهبل له تفسير<br />غيرك ساله كتير وكتير<br />ايمن عاب فى الذات العليا<br />ف الباشا ابو قلب كبير<br />وف ابنه الله يحرسهوله<br />ويشرف مصر بمقداره<br />ماهو شىء برضه علينا كتير<br />خليك جزمه فى رجل سعادته<br />تكسب توصل تبقى امير<br />شفت ازاى يابو مخ تخين<br />انت هتبقى نجم ملعلع<br />والتانى ويا المساجين"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 18
subject = "رد الجميل"
author = "شريف عثمان"
posted = "2006-05-14"
text = "لا أعتقد أن المسألة رد ِجِميل، فتزوير في الإنتخابات وإعتراف القضاة لا يعنى مساعدة للإخوان. فتزوير الإنتخابات ،أى إنتخابات، مسألة تحٌدث منذ قديم الازل، والجديد أن يقوم القضاة بمراقبة العملية الإنتاخابية. ولكن كما توقعنا حدوث تزوير لا محالة فيه فلا يمكن أبداً أن ينتهى في يوم وليلة. والحقيقة التى لا مجال لإنكارها هى دور\" الإخوان المسلمين\" فالمؤكد أن دورهم فى هذه الإنتخابات قد أضفى معنى جديد لها. وحصولهم على عدد لا بأس به من مقاعد مجلس الشعب ليس فقط إنتصار لهم بل هو إنتصار للديمقراطية فى مصر. ولكن لا يذال دور الإخوان وتوجهاتهم وطموحاتهم غير واضحة. ونأمل أن تكون مصرية 100% وللصالح العام والخاص، وأن تشمل جميع الانماط والتوجهات.."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 19
subject = "مقال للكاتب"
author = "ياء"
posted = "2006-05-14"
text = "هذا ماكتبه الاستاذ جمال سلطان بعد يوم الخميس الماضى<br />تواصلت ـ على مدار اليومين الماضيين ـ الرسائل التي وصلت إلى بريدي من أخوة أفاضل من جماعة الإخوان ، كلها بطبيعة الحال تعتب على ما نشرته بخصوص موقف الإخوان من موضوع القضاة ، وكنت عازما على تجاوز الموضوع ورفض التعليق على ما وصل لولا ما حدث أول أمس الخميس ، حيث وصلتني أهم وأقوى رسالة ، وأفضل حجة ودليل لا أملك تجاهه إلا التسليم والتقدير الكامل ، عندما شارك الإخوان بقوة في نصرة القضاة ، ونصرة مسيرة الإصلاح كلها من ورائهم ، ودفع نفر من أبنائهم ضريبة الوطن حيث اعتقل المئات منهم ، أحدهم الصديق العزيز محمد عبد القدوس ، كما اعتقل آخرون منهم الصديق العزيز الدكتور محمد زارع عضو الأمانة العامة لحزب العمل ابن ميت غمر الذي لا يترك موقفا لله وللوطن إلا استجاب له على عجل وحب وشوق وقد كان معي في العاشرة صباحا عند مستشفى الجلاء قبل أن ينتقل ناحية شارع طلعت حرب ثم علمت بعد ساعتين أنه اختطف ، كان يوم الخميس يوما مشهودا ، رأيت حجم قوات الأمن الرهيب والكردونات التي لا نهاية لها من كل اتجاه وناقلات الجنود بالعشرات في النواصي ورأيت آلاف الشباب أكثرهم متفرقين يبحثون عن راية ويسألون عن العمل ، ورأيت لواءات شرطة يمارس الواحد منهم نشاط المخبرين فلا يجد خمسة مجتمعين في مكان إلا طاردهم وخلفه حفنة من فرق الموت ، المعروفة بفرق الكاراتيه ، من الشرطة التي ترتدي الزي المدني وتسحل أي شخص يرتفع صوته أو \" يعصلج\" ، ورأيت مشاهد مضحكة يندر أن تراها حتى في المدن المحتلة ، حيث رجال الإعلام ومصوري الفضائيات يحملون الكاميرات ويهرولون هربا ووراءهم بعض الجنود بالعصي الكهربائية والشوم ، وصراخ وزعيق للإفلات ، القناة الفضائية الوحيدة التي لم يكن رجال الشرطة يقتربون منها هي ق<br />اقرأ بقية التعليق .."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 20
subject = "تابع"
author = "ياء"
posted = "2006-05-14"
text = "في اعتقادي أن يوم الخميس كان نصرا كبيرا للحركة الوطنية المصرية ، بكل فصائلها ، وكان يمثل رسالة إلى العالم بأن الشعب المصري مصر على الإصلاح ، وأن القضاة برهنوا على أنهم أصبحوا بالفعل رمزا لأشواق المصريين نحو الإصلاح ، ومنذ زمن لم تجتمع الحركة الوطنية المصرية على قضية أو موقف مثلما اجتمعت على نصرة القضاة ، كما أثبتت مشاهد يوم الخميس للعالم كله أن المواجهة هي بين نظام خائف قلق متوجس من شعبه وبين القضاة لدرجة حشده هذه القوات التي قدرتها مصادر بأنها قرابة أربعين ألفا لمواجهة حركة الإصلاح ، المشهد كشف أيضا أكذوبة أن ما يحدث خلاف بين القضاة وبعضهم البعض سقطت عيانا ، وأصبح من العار أن يردد هذه الأكاذيب أحد بعد الذي رآه العالم كله ، أحيي الموقف المشرف الذي وقفه الإخوان ، وأحيي الناشطين من حركة كفاية ، وأحيي النخبة الرائعة من أساتذة الجامعات ، وأحيي هذه الوجوه الطيبة التي رأيتها في ساحة النصرة بعضها قادم من الصعيد وبعضها من أعماق الدلتا ، معظمهم لا يعرف أحدا ولا أحزابا ولا راية ، غير إخلاص شديد لوطنهم ، وحب كبير وعظيم لقضاة الحرية ، هؤلاء القضاة الأبطال الذين يفتتحون بجسارتهم وطهارتهم تاريخا جديدا لمصر ، نسأل الله أن ينتقل بها إلى حياة أكثر طهارة وشفافية وحرية وكرامة وعدلا ."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

