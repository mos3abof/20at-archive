[[comments]]
order = 0
subject = "معتقدش !"
author = "على"
posted = "2006-05-09"
text = "بيتهيألى والله اعلم ان الكاتب لم يوفق فى رأيه لأن الاخوان عارفين انهم لو ادخلو فى موضوع القضاة ده هيتعقد اكتر وممكن يخوف القضاة انهم يكملو وقفتهم احسن يتقال عليهم انهم من الاخوان او متحالفين معاهم او الاخوان بيوجهو القضاة وساعتها هيكون شكل القضاة وحش قوى.<br />الحاجة التانية من كلام الاستاذ كاتب المقال فهمت انه بيتهم الاخوان انهم بيستنو لما ناس تضحى وبعد كده بيخدو هما الثمار فى حين انه كاتب فى نفس المقال ان الاخوان ليهم ناس فى المعتقلات وناس ماتت فى مظاهرات بتطالب بالاصلاح واظن ان ده تناقض واضح لأن الاخوان بالفعل ليهم موقف من الازمة الى فيها البلد ولما بيدخلو بيدخلو بالقدر الى ميولعش الامور ويشعللها فممكن تحصل فوضة وكلام كتير على اساسه النظان والشرطة ممكن تضرب المتظاهريين بقسوة وافراط فيتأذى ناس ملهاش ذنب وتيجى على دماغ الشعب فى الآخر لأن النظام الى بيحكمنا نظام سئ ولن يتردد فى انه يضحى بنص الشعب فى سبيل بقائه فى السلطة"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
