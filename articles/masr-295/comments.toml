[[comments]]
order = 24
subject = "مش معقول"
author = "د\\عبدالعظيم محمد"
posted = "2006-05-14"
text = "اظني ان الاخوان لم يتخلوا عن القضاة بشكل كامل ولكن بعض الظروف الطارئة<br />طبعا مش معقول الاخوان يتخلوا عن القضاء لثلاث اسباب هم:- 1) حتي لا يقال ان هؤلاء القضاة من تيار الاخوان المسلمين فتقل قوة قتضيتهم ويتهموا بانهم من جماعة الاخوان المحظورة 2) بسبب الاعتقالات المستمرة والتنكيل اليومي لافراد التيار الاخواني وملاحقتهم الامنية بشتي الصور من كلاب امن الدولة<br />3)هو ان الاخوان يحاولون ان ينظموا صفوفهم مرة اخري من بعد انتخابات الرئاسة ومجلس الشعب للنظر في العديد من القضايا الاخري والتي تتعلق بالوطن ومن اهمها مسالة التوريث, والفساد, والفقر, وايضا القضية الاخطر وهي البطالة المتزايدة يوميا بسبب حكومة الفقر والفساد حكومات الحزب الوطني الديموقراطي"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211133/http://masr.20at.com:80/article.php?sid=295&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

