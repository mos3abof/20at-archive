text = "اعتقد ان كتلة الاخوان انتقلت لها عدوى مرض المصلحة...فهل اصبح للاخوان اعتقاد ان من مصلحتهم الان عدم مساندة القضاة..مع ان القضاة قد ساندوهم كثيرا من قبل و حان الوقت لسداد دين فى رقبة الاخوان لصالح القضاة....ام ان المصلحة الان مع الحكومة<br />ااااااااااااااااه يا بلدالمتخاذلون دائما...يا خساررررررررررررررررررررررررة"
