text = "احترمت فيها مصريتها لقيتها بتفكر زينا. لسة الدنيا بخير يابنت العدل.<br />اروح من خوفى فين مش عارف...خايف ايوة خايف<br />مش على نفسى لأ على عيالى..انا خايف"
