[[comments]]
order = 17
subject = "Enough is enough"
author = "أبو نهى"
posted = "2006-05-08"
text = "للأنجليز قول مأثور يقول يكفي ما يكفي (Enough is Enough) ، وأعتقد أن أحنا وصلنا الى هذه النقطة..<br />فأما أن نتفق جميعا على يوم نخرج فيه للشارع ولا نعود لبيوتنا الا بعد أن نقلب هذا النظام (الزبالة) في صندوق زبالة التاريخ ، وأما علينا أن نوطن أنفسنا على الهوان والرضوخ لهذا للنظام السرطاني والصهيونية والأمبريالية اللتين تستعبدانه.<br />هذين هما الخيارين الوحيدين أمامنا .. ويؤسفني أن أقول أنه لا ثالث لهما! على جميع القيادات الوطنية أن تعي ذلك وتجعله هدفها المعلن مثل قرص الشمس وتسعى اليه علانية وبلا مواربة وأن لا تستشعر في ذلك عيبا ولا خوفا من عواقبه.<br />وأن لم تستطع القيادات الوطنية أن تستقطب وتشحن وتجند ما يكفي من الجماهير للخروج الأول وأشعال الشرارة التي تجعل بقية جموع الشعب تفيق وتلتحق بها ، فأن فشلها هذا يعني أنتهاء مصر الحرة الى ما شاء الله.<br />أبو نهى"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121820/http://masr.20at.com:80/article.php?sid=280"

[[comments]]
order = 18
subject = "أتفق وأختلف"
author = "عبير طلعت"
posted = "2006-05-08"
text = "أشارك بالطبع كاتب أو كاتبة هذا المقال الإعجاب الشديد بالسيدة الرائعة هدى الزيني ولا أعتقد أن همناك من يختلف على ذلك إلا عدد من أعضاء ذلك الكيان الشاذ المعروف بالحزب الوطني، ولكني أختلف فيما يخص المذيعة الرقيقة منى الشاذلي فأنا سيدة محجبة وأحب كثيرا منى الشاذلي فهي برغم عدم ارتدائها الحجاب ولكنها تتمتع بقدر كبير من الاحترام وليس هذا المجال لامتداح خصال منى الشاذلي كل ما أريد أن أقوله أن منى تحاول دائما أن تمثل الرأي الآخر في حلقات الضيف الواحد حتى تتحقق الموضوعية ولكن إذا تأملت نظرات منى فستتأكدي من مدى إعجابهاالشديدبالمستشارة نهى الزيني ثم إن منى دائما ما تبدي الاحترام لرجال الدين والسيدات المحجبات بخلاف شخصية غريبة مثل نجوى إبراهيم وأعتقد أن ظهور المستشارة مع منى رغم إحجامها عن الظهور يدل على مدى مصداقية منى.."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121820/http://masr.20at.com:80/article.php?sid=280"

