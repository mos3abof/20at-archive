[[comments]]
order = 3
subject = "ذاكرة التاريخ"
author = "ايمن المصرى"
posted = "2006-05-08"
text = "ان مافعلتة المستشارة نهى الزينى ليس غريبا على هذا الشعب العظيم . و لكنة اصبح نادرا فى هذا الزمن الذى ضاع فية الحق وسط غوغاء الباطل . ضاع فية الضمير و الشرف من اجل منصب او مال . . و اقول لها سيذكرك التاريخ كاشرف انسان مصرى هذة الايام . . و اقول للشرفاء لتكن نهى الزينى مثال و منارة تهدينى لبر الحرية و الامانة و الشرف . . و اقول للمفسدين و المزورين ارحموا هذا الشعب المسكين . . و انا للة و انا الية راجعون"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121820/http://masr.20at.com:80/article.php?sid=280"

[[comments]]
order = 4
subject = "نهى الزينى"
author = "محمد السيد حمدين"
posted = "2006-05-08"
text = "اناأول من قال عنها فى البى بى سى وموقع كفايه والوفد انها امرأه بمائه رجل<br />والان اقول عنها انها النموذج الامثل للام والاخت والزوجه والانسانه المصريه التى يلزم ان تتقدم الصفوف لتكون القدوه لشبات وبنات مصر بدلا من الغث والرخيص الذى يعرض عليهن فى الاعلام الهابط الرخيص"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121820/http://masr.20at.com:80/article.php?sid=280"

