[[comments]]
order = 13
subject = "بنت العدل"
author = "اروح من خوف فين مش عارف"
posted = "2006-05-08"
text = "خايف ايوة انا خايف<br />مش من سجن ولا معتقل على ولادى انا خايف<br />مين ليهم لو غبت فى طرة ولا الواحات<br />معندهمش غيرى<br />مصر عندها قضاة منهم بنت العدل<br />انام مرتاح على مصر انا مش خايف"
