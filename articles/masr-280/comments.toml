[[comments]]
order = 14
subject = "هى دى مصر"
author = "ياء"
posted = "2006-05-08"
text = "دعوه عامه<br />قلى عايز يعرف مصر على حق يشوف المستشاره نهى الزينى<br />قلى عايز يسمع صوت مصر يسمع المستشاره نهى الزينى<br />قلى عايز يتعلم معنى الوطنيه والايجابيه والكرامه وكل شى جميل ممكن يتعلم من نهى الزينى<br />مصر دائما بيرسموها سيده تضع علم مصر على كتفيها اظن انهم لو اقتربوا من وجهها سيجدون ملامحها نفس ملامح نهى الزينى<br />براء<br />اول مره تكتب مقال بالابداع ده<br />عشره على عشره<br />وانا بسمع المستشاره نهى الزينى افتكرت محمد منير بس اغنيه<br />بلاد طيبه<br />اسمعوها وقبل ما تسمعوها اسمعوا صوت مصر<br />صوت نهى الزينى<br />وبعدها شوف عتعمل ايه<br />لمصر<br />ان فى مصر قضاه لا يخشون الا الله<br />يا قضاه يا قضاه انقذونا من الطغاه<br />yehia2784@hotmail.com"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121820/http://masr.20at.com:80/article.php?sid=280"

