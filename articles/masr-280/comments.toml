[[comments]]
order = 7
subject = "دى قضية مصر كلها"
author = "مصرى"
posted = "2006-05-08"
text = "أعتقد أن الإعتصام حق للإنسان فى دولة حرة ولكن مصر دولة تحت الإحتلال ولننظر كيف كان الزعماء فى عصور الإحتلال لمصر يتعاملون مع المحتل والدفاع عن مصر وعن شرعية وجود المحتل على أرض مصر الغالية وهم جميعاً من الحقوقيين مثل مصطفى كامل ومحمد فريد وسعد زغلول وغيرهم كثير. فنظام الحكم الموجود فى مصر ليس نظام شرعياًلأن الرئيس حسنى مبارك لم يأتى للحكم منذ تولى الرئاسة بإنتخاب الشعب كما ينص الدستور وكان وجوده فى الحكم طوال هذه السنوات بالتزوير وما بنى على الباطل فهو باطل. ثانياً كيف للقضاء أن يرتضى لنفسه هذه الوقفة المستجدية فى دولة محتله كان من المفروض المطالبة بتحرير مصر وليس الإنتظار من المحتل أن يعطيهم حقوقهم التى سلبها منهم الذى هو من وجهة نظر القضاء المتهم الأولى على قتل السادات وكل الأدلة تشير إلى أصابعة الخفية فى ذلك وكان لا بد أن يسقط القضاء شرعية الحاكم فى وجوده فى الحكم. وأيضاً لما أصاب مصر من فساد وتدهور وإخلال بكل مؤشرات الحياة من بطالة وتعليم وصحة وقتله للحياة الديمقراطية لكى يضمن سيطرة على الحكم وهذه نفس سياسة المحتل ولكن الحل الوحيد الذى لا بديل عنه هو الثورة على هذا الفساد وخاصة أن الشعب كله مؤيد لكم وملتف حولكم ولكنه ينقصه القيادة وأنتم القيادة الصالحة التى يتمناها المصريين جميعاً فماذا تنتظرون هل تنتظرون أن يقضى عليكم الحاكم كما فعل فى الحياة الحزبية وبذلك تفقدوا حتى أحترام الشعب لكم لا امل الأن إلا بالثورة والشعب كله معكم وفى إنتظار شرارة البداية على أيديكم يا شرفاء مصر لنطهرها من هذا الفساد المتسرطن"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121820/http://masr.20at.com:80/article.php?sid=280"

[[comments]]
order = 8
subject = "راحة الضمير"
author = "احمد المصري"
posted = "2006-05-08"
text = "ما اجمل رؤية انسان يشع من وجهه الشعور براحة الضمير.اليست تلك هي النفس المطمئنة التي ارضت وترضي ضميرها كل يوم باداء واجبها نحو اسرتها وبلدها وفبل كل شىء ترضي ربها بكلمةحق عند سلطان جائر! انه الشموخ الاصيل التي تستحق به ان تكون بحق ام المصريين.انها نموذج منير انبعث فجأة وسط ظلام دامس ليعطيناالأمل في عودة مصر لأهله ورحيل الغاصبين الذين استمرؤا صبر الشعب عليهم. فليعلموا ان في مصر رجال ونساء افضل من الكثيرين من اشباه الرجال المتشبثين بمقاعدهم التي لا يساوا شيئا وهم فيها ناهيك عن بعد ان يتركوهاكارهين مكرهين بحول الله."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121820/http://masr.20at.com:80/article.php?sid=280"

[[comments]]
order = 9
subject = "الأم المثالية"
author = "مصري جداً"
posted = "2006-05-08"
text = "اتمنى من هذا الموقع الرائع ان يتبنى ترشيح الأستاذة الدكتورة المستشارة بت هذة البلد التى ارى فيها الأحترام و الصدق و الوطنية ز واقول بصراحة اننى لاول مرة اجلس امام التلفزيون لهذا الوقت المتأخر من الليلز لأن لأول مرة استمع لأنسانة و كأنها تقرأ مابداخلي لقد ضحكت معها و أبكتني في اخر اللقاء هذه الأنسانة احيت فينا الأمل . د / نهى نحن نحبك ونعلم انك تحبينا"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121820/http://masr.20at.com:80/article.php?sid=280"

[[comments]]
order = 10
subject = "قضاة مصر الشرفاء"
author = "يوسف وللاسف مصرى"
posted = "2006-05-08"
text = "الأستاذةالدكنورة/نهى الزينى<br />لقدأعطيت لكل مصرى تبرأ سابقا من مصريته بسبب هذا النظام الفاسد فى أن يتراجع ويتمسك بها مرة أخرى بعد أن أعطيتنا أمل فى أنه ما زال أن هناك شرفاء مصريين.وشكرا.<br />فالله سبحانه وتعالى بعث بأنبيائه ورسله وبكتبه السماوية التى أعلمتنا أن القضاة هم عدل الله فى الارض.فإذا إنتصر هذا النظام الظالم على عدل الله فى الارض المتمثل فى الاستقلال لعدل قضاة مصر.فلا وجود لله ولا لأنبياءه ولا لرسله ولا لكتبه السماوية ولا هم يحزنون.وأتمنى أن أموت قبل حدوث كارثة تكفيرنا فى عدم إستقلال القضاة(أى عدم وجود لله)أستغفر الله العظيم."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121820/http://masr.20at.com:80/article.php?sid=280"

[[comments]]
order = 11
subject = "قميص يوسف"
author = "samir hassan"
posted = "2006-05-08"
text = "إن مصر يتيمة<br />إن هواء مصر لايطاق هذه الإيام<br />لقد عجز الرجال عن إزاحة ودفن الجثة المتعفنة والمكومة أمامهم منذ ربع قرن<br />إن أحوال الأمة العربية بأجمعها ليست أفضل حالاً.<br />وفي الجامعة العربية تبادل حرف الباء والراء أماكنهما<br />والحال لايختلف كثيراً في منظمة المؤتمر الإسلامي<br />نهى:<br />انتي التنظيم<br />وأنتي الأمانة<br />وإنتي الجامعة<br />لكل الخصال الجميلة<br />إنتي قميص يوسف الذي نحتاجه ليعيد لنا رؤيتنا<br />إنت القوة التي كانت غائبة زماناً<br />ساعدي هؤلاء الرجال<br />إمنحيهم بعض قوتك<br />علهم يتمكنوا من إزاحة ودفن الجثة المتعفنة والمكومة أمامهم منذ ربع قرن"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121820/http://masr.20at.com:80/article.php?sid=280"

[[comments]]
order = 12
