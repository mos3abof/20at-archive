[[comments]]
order = 0
subject = "جميل اوي"
author = "عبدالله مفتاح"
posted = "2006-05-07"
text = "مقال جميل اوي واكتر جملة عجبتني (ووجه منير لم تلمسه مساحيق التجميل، لكن يشع منه نور الوضوء والابتسام)<br />جمله كنت كتبت جملة بمعناها في (قصة فتاتين)وعشان كده انا متحيز ليها وعجباني جدا<br />واللي عجبني اكتر ان فيتلميح مقصود او غير مقصود لمهمة المراه الاولى ومهمتها التانيه في الحياة هذا والله اعلم بنية الكاتب هل قصد التلميح ام لم يقصد"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121820/http://masr.20at.com:80/article.php?sid=280"

[[comments]]
order = 1
subject = "أمي.. نهى الزيني!"
author = "الهام"
posted = "2006-05-08"
text = "بجد ده اللى كنت بقوله مع نفسى من ساعة ما شفت البرنامج<br />نهى الزينى تشبه أمى و أمك وأمهات العديدين فى بلدنا إمرأة بسيطة فى مظهرها واضحة فى آرائها وأفكارهاووجهها صادق لم تحاول أن تخفيه بالمكياج<br />عندك حق عملت إيه ماما سوزان لينا أنا فاكرة أعياد الطفولة زمان كانت تروح تحضر الحفلة شوية غنا ورقص وهو ده رعايتها للطفولة دلوقتى الأطفال كبروا ومبقاش يضحك عليهم بغنوة ولا لعبة ولما يتعرضوا للضرب والبهدلة ف الأقسام والمظاهرات وغيرها من مظاهر الإحترام الأخرى الموجودة فى البلد ليناتسكت ولاكأنها تعرفنا أو تسمع عنا عشان مصلحة جوزها وأبنائها اللى بجد لكن ماما نهى فعلاً بجد ماما."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121820/http://masr.20at.com:80/article.php?sid=280"

