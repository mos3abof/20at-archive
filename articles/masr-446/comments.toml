subject = "مش شايف أبوك وهو مكشوف"
author = "محمد أحمد"
posted = "2006-06-09"
text = "مشفتش أبوك أيش عمل بالسدات عم أبوك سابقا مش خايف أيش يعملوا فيك أنت وأبوك<br />لتخافش راح يطلعلك واحد من الصعيد يخبط علي رأسك وعلي رأس أبوك وينيك أمك وأختك أخوك ومع الجزمة ياخاين الاسلام والمسلمين وأنا من الاخوان المسلمين من فلسطين وإن شاء الله علي النصر رايحين<br />ياجمال بن حسني مبارك الكلب"
