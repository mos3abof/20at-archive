[[comments]]
order = 11
subject = "دا احنا لولاه لكنا فى حرب"
author = "عادل خفاجه"
posted = "2006-11-06"
text = "اولا انا مصرى من اسماعيليه وبعدين احنا لولاا محمد حسنى مبارك لكنا تشتتنا فى حروب لا اولا لهاو ولا اخر والراجل يشكر انما فى ترتيبه لاغتيال السادات الله واعلم<br />ولاكن احنا لا نريد جمال مبارك يمسك الحكم من بعد محمد حسنى مبارك وانا والشعب المصرى مكانش حد منه اساسا مرشح حسنى مبارك للفتره الرئاسيه دى وبعدين كان فى تزوير والله واعلم<br />وبرده مش عاوزين غلط فى رئيسنا علنااا كداا يعنى عشان كدا مينفعش"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143616/http://masr.20at.com:80/article.php?sid=446&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
