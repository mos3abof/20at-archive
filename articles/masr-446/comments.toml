[[comments]]
order = 0
subject = "صف صف بيه شخوا عليه في الك0000 افيييييييه"
author = "الاستاذشيكو"
posted = "2006-06-03"
text = "والله العظيم مافي حد مودي البلد دى في دهيه غير اللي كتب المقال واللي زييه من الناس دول<br />قبل ما تفكر في الغلط وتقول عليا اني كده ولا كده مش انا اللي قلت الكلام ده ده صف صف بيه<br />انتو فاكرين المسلسل اللي جه في التليفزيون بتاعنا كان اسمه( فريسكا)<br />كان فيه عزب شو عارفينه كان متجوز دينا طبعا عارفينها وكانت اسمها صفيه او الراقصه صفيه وكانت فقيرة وكحيانه وجه بسلامته عزب بيه اللي بيشتغل متعهد افراح وراقصات وتجوزها<br />المهم كانت قطه مغمضه وبعدين فتحت ويعيني خلت الراجل عامل زى 00000 لاؤخذة<br />وفي مرة ثااااااااااار عليها فرفعت عليه ابو وردة عارفينه الزنوبه يعني او الشبشب بالعاميه فقام قالها ايه<br />حرمت يا صف صف والنبي يا صف صف<br />بلاش ابو وردة ياااااااا صفصف<br />هو ده المشهد اللي حاصل بين جمال نيله وصف صف بيه خربها<br />ولكي الله ياااااااا مصرنا"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023121/http://masr.20at.com:80/article.php?sid=446&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "قولوا قناة جديدة"
author = "ابو شريف"
posted = "2006-06-04"
text = "القائد الإعلامي الفذ الذي أفاد باطلاق قناة للحزب الوطني الحاكم ... وهل الحزب الحاكم يحتاج لقناة مخصصة له وماسبيروا وضواحيه طوع أمره ولسان حاله ... الأمر الذي يعني والله انتوا بتهرجوا بعد جمال مبارك (مع حفظ الألقاب والمقامات) وقف في طابور الرخص ليجدد رخصة سواقة الطيارة (علشان ح يشتغل بعد كده سواق طيارة سرفيس علي خط امبابة واشنطن كوبري القبة) حرام يعني يدخل يشرب كوباية شاي في البيت الأبيض علشان يغلف الرخصة ... وبعدين بابا صفوت قاله يروح لعمو بوش علشان يأخذ منه التعليمات باليد علشان الإيميل بتاعه عليه واد هكرز مطلع عينه وبيقول الأسرار العليا للحزب الوطني يعني بالمرة ويوفر في النفقات ... والله احنا غلطانين واسمع اجمل زغروطه للدستور<br />ودستور يا اسيادنا"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023121/http://masr.20at.com:80/article.php?sid=446&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "ياسلام سلم ياسلام"
author = "مبارك يبحث مع أولمرت.. تحريك عملية السلام"
posted = "2006-06-04"
text = "قمة شرم الشيخ تناقش توصيل المساعدات الدولية للفلسطينيين<br />يستقبل الرئيس محمد حسني مبارك اليوم بمدينة شرم الشيخ ايهود اولمرت رئيس الوزراء الإسرائيلي لبحث تطورات الأوضاع علي الساحتين الفلسطينية والإسرائيلية.. يتناول اللقاء الذي يعد الأول منذ تولي اولمرت رئاسة الحكومة الإسرائيلية عددا من القضايا المتعلقة بعملية السلام بين الفلسطينيين والإسرائيليين والجهود المبذولة لتحريك عملية السلام بين الجانبين وإمكانية استئناف المفاوضات بينهما.<br />كما يتناول اللقاء مسألة المساعدات الدولية للفلسطينيين وأموال الضرائب والجمارك الفلسطينية التي تحتجزها إسرائيل لمواجهة الظروف المعيشية والأوضاع المتردية التي يعيشها الفلسطينيون.<br />ومن المقرر أن يطلع اولمرت الرئيس حسني مبارك علي نتائج زيارته الأخيرة للولايات المتحدة.<br />تعد هذه المباحثات فرصة قد تمهد الطريق لعقد قمة ثلاثية بين الرئيس مبارك واولمرت والرئيس محمود عباس \"أبومازن\" رئيس السلطة الوطنية الفلسطينية.<br />وتأتي زيارة اولمرت لمصر في إطار الجهود التي يبذلها الرئيس حسني مبارك لإحياء عملية السلام في الشرق الأوسط."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023121/http://masr.20at.com:80/article.php?sid=446&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "هذا الكلب حامل راية الأفساد..ياشرفاء مصر من الجيش والشعب الثورة الآلآن"
author = "مصرية"
posted = "2006-06-05"
text = "الكلب الحقير صفوت الغير شريف هو أول من حمل راية الأفساد فى مصر من هذه العصابة..بافساد الأعلام وانحلاله وتسطيحه..لتنفبذ المخطط الأمريكى الصهيونى..بافساد الشباب المصرى حتى يسهل اقتياده من عملائهم حكام مصر الآن..انه كتلة من الكذب والنفاق تثير الأشمئزاز والغثيان..هذا الحقير يجب سحله فى ميدان عام فور الخلاص من حكم سيده الطاغية..وعمره ما كان دمه خفيف ولا ابن نكته ولا حتى ابن (..) عشان حرام نظلم الكلب لأنه حيوان وفى ..وهولايعرف الوفاء سوى لسيده وولى نعمته والمفروض أن منصب أى وزير يكون لخدمة الشعب<br />آآآآآآآآ ياوطنى ..كم هنت فى عيون الطغاة...وكم كثرت أصوات النباح فى سمائك الطاهره....<br />ياكل شــــــــــــرفاء مصر من الجيش والشعب<br />الثــــــــــــــــورة الآلآلآلآلآلآلآلآلآن<br />لآلآلآلآلآلآلآلآلآلآلآلآلآ للقرصان وسلالته وعصابته..ونعم ..نعم..نعم..لثورة الجيش والشعب على الظلم والفساد<br />اللهم اجعله يوما قريباآآآآآآآآآآمين"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023121/http://masr.20at.com:80/article.php?sid=446&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

