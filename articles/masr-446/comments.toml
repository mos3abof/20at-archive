subject = "اسمها ايه"
author = "سماره"
posted = "2006-06-07"
text = "اسمها ايه بتسلم عليكواوبتقولكوا ان الزمالك هياخد مقلب فى عمرو ذكى والاهلى اشترى التروماى والحراره النهارده عاليه واللحمه بقت باربعين جنيه ومبنجبهاش وحد يسلفنى علشان ادفع فاتوره النت وياريت لويسلفنى اصيف فى شرم او مارينا مايضرش سلام بقى الاكل شاط"
