[[comments]]
order = 7
subject = "خربها وحيقعد على تلها"
author = "واحد مش عايز يتورث لى التركه"
posted = "2006-06-07"
text = "الموضوع مش وراثه نطلع فى الوصيه ان بسلامتك يابنى انت مصر هديه على العربيه والشقه والجلابيه<br />لا<br />الموضوع والله العظيم حته فيلم هندى محبوك وتطلع المظاهرات بتاع المصريين الهبل لا ولا وهبه يروح قاعد وتصفيق حاد وتخلص الحدوته<br />الفيلم الثانى<br />يروح حزب الاغالبيه مشكل الحكومه ونروح مرشحين ابن الايه لمجلس الوزظراء ولعبه فى الدستور ويلغى رئيس الجمهوريه ويخليها امريكانى واهو بالديمقراطيه<br />على فكره الحزب الوطنى واعضاؤه طيبين وغلابه وهبل علشان بدوا شرعيه لسيستم بايظ<br />على فكره انا عضو فيه ومش حاسيبه احب اضرب بالجزمه واتزل بفرق الحزب عن المدام بايه كله قاعد على نفسنا<br />فينك يا عزرائيل يا تاخدنى يا تاخدهم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023121/http://masr.20at.com:80/article.php?sid=446&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

