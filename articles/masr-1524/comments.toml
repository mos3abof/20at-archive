order = 0
subject = "الخطة الخمسية وطابور العواطلية"
author = "عدد العاطلين وصل الحد لله الي 10 مليون عاطل من الشباب."
posted = "2007-01-30"
text = "وقد تبادل سمو الوالي المقدس حسني مبارك المعرص<br />التهاني مع سمو الخليفة جيمي مبارك باشا التهاني بهذا الرقم العظيم .<br />وقد اعرب معالي الوزير احمدنظيف الخفيف سعادته بهذا الرقم مع تمنياته الكبيرة بزيادة هذا الرقم ليصبح 15 مليون في الخطة الخمسية القادمة.<br />وقد اعلن معالي الوزير نظيف في الصحف الحكومية المباركية انه من اهم انجازات عهد العارف بالله المقدس حسني المعرص انه اذا وقف العاطلين بجوار بعضهم البعض في طابور فسوف يصل الطابور من الاسكندرية الي اسوان, وتهدف الخطة الخمسية النظيفية القادمة وصول طابور العاطلين من الاسكندرية الي دولة جنوب افريقيا بهدف دعم العلاقات المصرية الجنوب افريقية, وتشجيع الاستثمارات والخصخصة والمصمصة."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025732/http://masr.20at.com:80/article.php?sid=1524"

[[comments]]
order = 1
subject = "الاجور فى مصر"
author = "زهرة الرمان"
posted = "2007-01-30"
text = "هل تسمون الملاليم التى يتقاضاها العاملين فى الدولة اجور<br />ان احقر وافقر دولة فى العالم مرتباتها تعادل مائة ضعف المرتبات فى مصر<br />الدولة تسرق موظيفيها وتعطيهم مرتبات تعادل بدل شحاتة والموظفون يسرقون الدولة بعدم الانتاج وعدم الجدية فى العمل واحيانا عرقلة العمل من اجل الرشاوى والبقشيش<br />من هو العبقرى الذى يخطط لتدمير البلد بهذا الشكل<br />الاسعار فى مصر اصبحت اغلى من اى مكان على وجة الكرة الارضية نظرا للجمارك والضرائب وخاتمتها ضريبة المبيعات<br />---اصبحت دولة جباية من شعب معدم وشحات ويعيش معظمة على الكفاف والفاقة--<br />قال ابا ذر الغفارى<br />عجبت لمن بات جائعا ولم يخرج على الناس بسيفة<br />واللة المستعان"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025732/http://masr.20at.com:80/article.php?sid=1524"

[[comments]]
order = 2
subject = "لا للفقر ..لا للبطالة.. لا لقانون الوظيفة العامة الجديد"
author = ":بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-01-30"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو الوسيلة الوحيدة للتوظيف.<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا.<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />5) الغاء الاجازات بدون مرتب , وتقليل الاجازات المرضية لتصبح شهر فقط وبعد ذلك يطرد الموظف المريض اذا تجاوزها ويفصل من الخدمة نهائيا, واجازة وضع واحدة لمدة ثلاث اشهر ولمرة واحدة فقط للموظفات .(6) من حق الطرف الاول (الحكومة) الاستغناء عن الطرف الثاني(الموظف) في اي وقت ولاسباب يراها الطرف الاول , دون ان يحق للطرف الثاني الرجوع علي ذلك.ولا استطيع عرض باقي البنود الظالمة من قانون الوظيفة العامة الجديد. من الاخر ياناس ده قانون ظالم وسيهدم اركان المجتمع الذي يقوم علي<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025732/http://masr.20at.com:80/article.php?sid=1524"

[[comments]]
order = 3
subject = "الموضوع حلو يا بلال .."
author = "شريف الدواخلى"
posted = "2007-01-31"
text = "الموضوع بجد عجبنى جدا يا استاذ بلال لدرجة انى قريته أكتر من مره \" تصور ديه \" وده لان الموضوع معمول فيه شغل صحافة محترفين من اول كلمة لنهاية الموضوع وناخد حاجة حاجة<br />1- توافر عنصر السرعة فى تغطيه الحدث<br />2- المعالجة المتكاملة لكل جوانب الازمة<br />3- التزام الموضوعيه بشكل رائع فى الموضوع<br />4- الاسلوب كان دسم جدا بس واضح قوى<br />وعلى فكره يا بلال انتا من احسن الناس اللى بكتب فى الموقع من وجهه نظرى المتواضعة"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025732/http://masr.20at.com:80/article.php?sid=1524"

[[comments]]
order = 4
subject = "3agab"
author = "لست من محبي متابعة التلفزيون وبرامجه الهادفة الا انني من وقت لاخر تنتابني حالة من الحنين ربما للتسلية بسخافات برامجنا او لاشباع حب الاستطلاع في نفسي لاعلم ما يدور بالعالم الخارجي ( المحلي طبعا) . وبالمصادفة امس احسست بفراغ قاتل في حوالي الساعة العاشرة مسأء ولم اجد مفر لقتل الوقت الا مشاهدة التلفاز واثناء التنقل بين القنوات اوقفتني المذيعة الجميلة مني في برنامجها الموجه العاشرة مساء وبقدر ما كانت المذيعة متألقة ولماحة ومقيدة وحريصة علي استمرار برنامجها الا ان ابتسامتها وتعبيرات وجهها كانت وسيلتها في التعبير عما تراه من مهزلة فكرية حوارية عقائدية لرمز من رموز الحكومة علمت فيما بعد انه وزير التنمية ( الادارية) ولا اعلم اي فكر اداري ينتمي له هذا الوزير ونحن في القرن الواحد والعشرون هل ينتمي الي المدرسة التقليدية الادارية من قرن مضي من الزمان حتي ينظر الي العامل علي انه ترس في الة لا يعمل الا بضغط وكرباك وبدافع الخوف من العقاب ام ينتمي الي المدرسة الادارية الحديثة التي تري الادارة علي انها قدرة المدير علي الادارة مع استخدام الحوافز والثواب والعقاب ."
posted = "2007-01-31"
text = "لم اشعر لحظة من خلال متابعتي للبرنامج ان السادة الحضور لديهم ادني فكرة عن التوجهات الحديثة في الادارة كنظام وحدة متكاملة مدير وعامل ووسائل وادوات والتي تتوقف علي عملية التفاعل بينهم كفاءة الاداء .<br />علي العموم هذا الاتجاه الحديث في الادارة والذي بداء من مدة بسيطة حوالي خمسون سنة يمكن البحث عنه تحت مسمي ( مدخل النظم في الادارة الحديثة) وممكن نلاقي الكتاب في سور الاسبكية ان كان لا يزل قائم.<br />والغريب في الموضوع ان السيد الوزير افصح عن مكنون الفكر الاداري للنظام الذي يمثله والذي لا تنظر للموظف او العامل علي انه عنصر بشري له اهدافه ورغباته<br />اقرأ بقية التعليق .."
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202025732/http://masr.20at.com:80/article.php?sid=1524"

