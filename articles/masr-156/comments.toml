author = "محمد ط لعن"
posted = "2006-04-25"
text = "انت كمعارض يجب ان توحد الجبهة مع الاخوان كفصيل من المعارضة لا نحاول شق الصف فى الضغط عل الحكومة لمزيد من الاصلاحات زانت تعرف جيدا ان الاخوان لم سيتطيعوا ان يصلوا الى الحكم مهما حدث"
