subject = "الغلطة السياسة تذبح المعارضين فقط !"
author = "احمد صبرى"
posted = "2006-04-14"
text = "الغلطة السياسة تذبح المعارضين فقط لنظام الحكم ..<br />يعنى مثلا جيمى مرة طلع وقال .. \"انا فى الموقع ده بفضل والدى\"<br />مبارك قال: \" ماعنديش نائم لانى لم اجد الشخص المناسب\"<br />احمد نظيف: \"الشعب غير ناضج سياسيا\"<br />مممم على فكره انا مش اخوانى .. بس فعلن حوار البيت بيتك كان مستفز جدا ..<br />اه صحيح من امنتى مصر كان بيحكمها مصريين !!؟؟<br />يعنى صلاح الدين .. عمرو بن العاص .. محمد على .. وسلالته ..<br />ياجماعه احنا كنا كويسين اوى طول ما كان بيحكمنا مسلم عادل ( صلاح الدين , عمرو بن العاص ) ..<br />مسلم عادل ولو كان ماليزى خير من مصرى فاسق مراته انجليزيه ..<br />ارحمونا بقى .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

