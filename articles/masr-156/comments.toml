subject = "العق بظر اللات"
author = "السيد الاسود"
posted = "2006-04-19"
text = "فى معرض حديث سهيل ابن عمرومع ابو بكر الصديق فى صلح الحديبية حاول الصديق ان يوضح لة الاسلام ويعرضة علية ولكن الرجل تفاخر بالهتة فما كان من ابى بكر ان وجة لة جملة هى لكل متمسك بالجهل ان قال لة عندما تعود الى مكة ... اذهب فالعق بظر اللات ...وانت يابو شعيب..ااقول لك ....اقول لك اذهب فالعق بظر القومية .لكن سهيل ابن عمرو اسلم .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 20
subject = "لماذا الانحياز؟"
author = "محمد"
posted = "2006-04-20"
text = "ارى ان اغلبيه التعليقات ان لم تكن كلها تهاجم الصحفى على النشروتترك الذى اخطاء با الفعل ماعلينا اذا كان نشر فى جريدة قوميه او جريدة معارضه<br />المهم فى الموضوع ان مرشد الاخوان اخطاء وهو ليس انسان عادى بل هو سياسى ومرشد جماعه اسلاميه ويريد ان يحكم مصر فى يوم من الايام فمن منايريد ان يحكمه شخص سبه فيجب الا نترك الاساس وهو كلام المرشد مهدى عاكف<br />وعلى فكرة انا لست ضد الاخوان المسلمين ولكن بعد هذا الكلام من مرشدهاالعام تغيرت نظرتى لهم"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 21
subject = "الاخوان وتاريخهم الاسود ومرشدهم الكذب"
author = "مصرى"
posted = "2006-04-20"
text = "على الجميع ان يعرف تاريخ الاخوان الاسود وان يقراء التاريخ وعند ذلك لم يستغرب احد على التعلقيات وحقيقه ان لااستطيع ان اعرف حقيقة هذا المرشد هل هو كذب حيث يقول الكلام وبعد ذلك يقول لم اقوال بعد ذلك وعندما تظهر الحقيقه يعترف ثم يقول لن اعتذر واقول الى الاستاذ سعيد لا يضر السحاب نبح الاخوان"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 22
subject = "طب مايسيب مصر اللى طز فيها"
author = "الكاتب الصحفى محمد يوسف"
posted = "2006-04-24"
text = "حقيقى المفروض أن يكون الصديق الصحفى سعيد شعيب راضى جدا بل ومنتشى أيضا وسعيد لاننى اعتقد انها ضربة صحفية لعام 2006 تستغلها روزا تستغلها بوسة احنا صحفيين وديه مادة منشورة وسبق صحفى الرائه اللى فيه ان سعيد فى المقدمة اعترف انه لم يكن حوار لكنه كان خناقة كادت أتصل الى مد الايد فهو قد كشف عن شخصية عنيفة لاتفهم فى السياسة ولا فى كياسة الحوار الصحفى لكنه راجل اخوانجى يؤمن بالعنف والبلطجة وطولة اللسان وسفالة اللفظ المفروض يطلع لنا واحد محامى يطالب ينزع الجنسية المصرية عن مرشد الإخوانجية ويضعه نحت مقضصلة الحسبة زى ماهرونا بيها وكفرونا وجعلونا نمشى نتلفت ورانا برافو سعيد شعيب وأعتقد انه اقوى سبق صحفى نشر هذه الايام لكن المشكلة الاساسية أن اذا كان المرشد البلطجى كشف عن قرارة نفسه السافلة فصديقنا سعيد كشف لنا كشف أخر اشد واعمق هو الانتهازية السياسية والفاشية الموجودة عند الناصريين وجريدة الحزب اللى المفروض ماعندناش حسابات حزبية لانها صحافة وكان المفروض الحوار ينشر كله كامل بدون بتر فى العربى الناصرى لكن حسابات السياسة وسيطرة شوية فاشيست على الجريدة دخلتهم فى اتهام مهم المفروض يجيبوا عليه ايه هى حرية الصحفى الحزبى وديمقراطية المعلومة"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

