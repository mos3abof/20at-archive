[[comments]]
order = 4
subject = "طظ فى من"
author = "صحيفى لجنه السياسات .. روزا"
posted = "2006-04-13"
text = "طظ في مَن؟<br />حفل حوار المرشد بالاحترامِ والتقديرِ للشعبِ المصري وقال في أحدِ المواضع: \"أنا في خدمةِ هذا الشعب .. مش خدمة الإخوان المسلمين بس.. أنا بأقول لك إن مهمتي خدمة الشعب\".<br />ولكن في موضع آخر وحين سأل الصحفي عن الخلافةِ الإسلامية معتبرًا إياها احتلالاً وأنَّ الأتراكَ كانوا محتلين قال المرشد: \"الخلافة كانت تحكم كلَّ العالم العربي والإسلامي.. الإسلام أمة واحدة.. ما تقوليش بقة واحد مسلم جاي يستعمرني\".<br />هنا قال الصحفي: \"أنا شخصيًّا مختلف مع سيادتك.. أنا اللي يحكمني مصري\".<br />فكان ردُّ الأستاذ: \"يا حبيبي طظ في مصر واللي في مصر\".. وإذا كان هناك عتبٌ على اللفظِ- وهو في محله- فإنَّ الأمرَ لا يستحق هذه الضجة المفتعلة لأنَّ الكلمةَ جاءت في معرضِ أنَّ مصلحةَ الأمةِ الإسلامية أكبر من مصلحةِ الأقطار.. سواء كانت مصر أو غيرها.. والإسلام فوق الاعتبارات القطرية.. وإذا كان هناك بعض مَن تأثروا بالعقليةِ الاستبدادية الاستعمارية الواردة كما سمَّاها المرشد وهم يفضلون أن يحكمهم ملحد مصري على أن يحكمهم مسلم ماليزي فهؤلاء هم الذين يستحقون اللفظ السابق.. وليس الشعب المصري المسلم الذي جاهد وضحَّى كثيرًا في سبيلِ أمته.<br />من الواضحِ الآن أنَّ الصحافةَ المصريةَ تفقد الكثيرَ من مصداقيتها بسببِ نزوع \"جيل جديد\" من الصحفيين إلى \"الفبركة\" وعدم الدقة في النقل.. وأصبحنا نرى صحفيين يجلسون في مكتبةِ نقابة الصحفيين يُطالعون ما يُنشر في الصحفِ ثم يسرحون في الخيالِ ويصيغون التصريحاتِ وينسبونها لبعضِ السياسيين.. وقد أصبح مألوفًا أنَّ صحفيًّا في جريدة يومية يختلق كل يوم تقريبًا خبرًا عن الإخوانِ لا أساسَ له من الصحةِ ويُنسبه إلى بعضِ قياداتِ الإخوان.<br />أما أفضل عناصر تلك النوعية الجديدة من الصحفيين فهم الذين يذهبون للمص<br />اقرأ بقية التعليق .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 5
subject = "مشكلة خطيرة!!!!!"
author = "mody kody"
posted = "2006-04-13"
text = "مشكلة خطيرة عند الأستاذ سعيد.. وهي أنه وقف في صف الخبثاء واستخدم أسلحتهم.. حتى وإن لم يكن خبيث النيه....<br />الأستاذ سعيد لو كانت نيته نشر الحقيقة كما يقول.. مكانش نشره في جريدة معروفه بعداءها الشديد للأخوان .. ولكل ما له فكر إسلامي .. جريدة معروفة عند الشعب كله بعلمانيتها الصارخه .. وعلاقتها المشبوهه دائما مع أمن الدولة..<br />جريدة كانت تساق أيام الأنتخابات البرلمانيه من لازغلولى...<br />كل هذا يجعلني أفكر بمنطقية.. طالما بيقول أنه بينشر الحقيقة.. ليه منشرش الموضوع في المصري اليوم مثلا..<br />جريدة معروفه بحيادها الشديد ومحبوبة جدا في الشارع.. ومكانتش هتنشره إلا لو كان حوار حقيقي .. مش كلام مفبرك ومتغير ترتيبه ومعناه"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

