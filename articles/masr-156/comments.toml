[[comments]]
order = 28
subject = "ارحمونا"
author = "مواطن مصرى"
posted = "2006-05-05"
text = "بصراحة احنا لا عايزين اخوان ولا عايزين وطنى عايزين مواطن مصرى يحب مصر ويخاف عليها لان الاخوان هدفهم الاساسى انهم يمسكوا الحكم والوطنى هدفهم الاساسى انهم يسرقوا البلد بالتالى لازم يكونوا دول مش عاجبين دول ولا دول على مزاج دول علة العموم مصر بتتسرق من ايام الفراعنة والشعب مكتوب علية الشقا فى سؤال احب اوجة لكل المصرين ومسئولين الوطنى خاصة<br />لماذا من حق اى مواطن من اى بلد فى العالم ان يسافر الى اى بلد فى العالم ما عدا المواطن المصري يا استاذ سعيد بدل ما تكبر فى الاشاعات او تعمل من الحبة قبة عايزين نحل المشاكل الكبيرة اولا وانت عارفها وشكرا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 29
subject = "تحيه للسيدالأسود"
author = "خالد سيدالأهل"
posted = "2006-05-08"
text = "تحيه خاصه منى إلى الأستاذ سيدالأسود صاحب تعليق إلعق بزر الات السابق تدوينه بعاليه وأدعو الأستاذ سعيد شعيب إلى ان يكون موضوعيا فى مهنته الصحفيه بإعتبارها مهنة الصدق والأمانه وان ينظر بموضوعيه لما أثاره من بلبلة وفتنة وهل لهذا الذى فعله عائد على بلدنا الحبيبة مصر التى عانت الكثير والكثير من الظلم والبؤس وأخيرا اهدى له أغنية الفنان إيهاب توفيق ( هيه نقصاك إنت كمان ) عله يعودويعقل"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"
