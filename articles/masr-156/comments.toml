[[comments]]
order = 25
subject = "كفايه"
author = "مجدي مصطفي"
posted = "2006-04-25"
text = "كفايه تجني علي الاخوانواللي لايري من الغربال يبقي اعمي واحنا شايفين اللى بيحصل في مصر البلد بيتباع واحنا واقفين نتفرج وكل همناننهش في بعضنا ونحاسب الغير حتي علي زلات اللسان ارجوكم فوقوا قبل فوات الاوان"
archived = "2006-05-25"
