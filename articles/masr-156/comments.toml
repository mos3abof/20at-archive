[[comments]]
order = 8
subject = "العقل"
author = "محمد"
posted = "2006-04-13"
text = "اولا ليه مصممين ياشباب الإخوان ان الاخوان ملايكة<br />الاخوان بشر ويخطوءا<br />بس غلط السياسة بدبح<br />المرشد غلط وكل الناس عارفه انه فى اى حوار هيغلط<br />ولو عمل حوار بكرة ممكن اى صحفى يضحك عليه ويخليه يقوله كلمتين<br />المرشد مش بتاع سياسة<br />ملوش فيها يعنى باختصار الراجل ده<br />لو بيحترم الإخوان وخايف عليهم قدامه حلين<br />اما انه يسكت وياخد حد بيفهم سياسة يرد مكانه<br />او يتنازل<br />ويعتذر عن اخطائه المتكررة<br />وبجد المفروض يتنازل ويريحنا<br />والمفروض كل اللى فى الخوان بالدماغ دى يحاولا يغيروا بقى<br />دى سياسة<br />مش خناقة<br />وعلى فكرة محدش يشتم ويقول عميل والكلام الكبير ده"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

