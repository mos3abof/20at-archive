[[comments]]
order = 16
subject = "طز فى الاخوان..وطز فى روزاليوسف ..وطز فى الحكومة *وتحيا مصر"
author = "ٌإبن مصر"
posted = "2006-04-18"
text = "من يستخف بمصر وبالمصريين هو من يستحق ان يقال له طز فيك وطز فى من تمثل..من يسهزء ويقلل من عظمة مصر والمصريين كعادة من يسمون انفسهم الاخوان التضليل والنفاق والتلون-ويجدون من يهلل ويصفق وينخدع بتبريرهم=فهمنا من التعليقات انو طز فى مصر لاتعنى طز فى مصر ولكن بالنهاية ايضا تعنى ظز فى مصر- الضبابية والالتباس وعدم وضوح الموقف والتخفى سمة الخطاب الاخوانى- المشكلة وللتضليل خرجت من جانب الموضوعية وخرجت عما قيل بالحوار الى اين تم النشر واصبح الخطأ ليس الكلام والاجابات على اسئلة الصحفى بل اصبح اين تم النشروانو بروزاليوسف العميلة للنظام وكان الاخوان نفسهم لا ينسقون ولا يمررون للنظام ولم يدعو الناس للمشاركة بانتخابات الرئاسة بوضع كانت كل القوى الودنية تدعو لفضح النظام وعدم المشاركة بالمهزلة- ما علينا<br />اقول للمعلق الاخوانى اللى سب وكتب (خول وابن شرموطة) يقصد الصحفى وعلق انو المرشد رجل عظيم اقول لى اختلط على الامر فلم اعد من المقصود بوصفه الاول هل الصحفى ام المرشد-- رجاء توضيح؟وامانا عينة من مؤيدى الاخوان"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 17
subject = "رابطة محبى ابن شعيب"
author = "واحد حقود"
posted = "2006-04-19"
text = "اندهشت كثيرا فى الواقع لهؤلاء الذين شغلوا أنفسهم بالحوار الأبله الذى دار من عمر مضى مع فضيلة المرشد العام للإخوان المسلمين ، والذى كان الطرف الآخر فيه ذلك المدعو سعيد شعيب ، الذى حاول جاهدا أن يلوث مهنة هى فى الواقع شريفة ، ولكن أمثال ابن شعيب من الوصوليين والانتهازيين يسعون ما وسعهم السعى الى تلويث هذه المهنة ورمى التراب على وجهها والوحل فى بلاطها ، اندهشت أكثر لهؤلاء البلهاء من الذين يطالبون فضيلة المرشد العام بالتنحى أو الاستقالة .<br />هل قرأ أحد الحوار ؟؟؟؟ أم اكتفت غالبية الأصوات الناعقة كالغربان فى المقابر الجماعية ،بقراءة العناوين التى فبركها ابن شعيب عمدا متعمدا ، هو وذلك الأخرق الذى يرأس تحرير جريدة تافهة تسمى روز اليوسف ، الذى ان لم يجد أحدا يهاجمه هاجم نفسه ( متطوعا ) فى محاولاته المستميتة لإرضاء أسياده ( كما يتوهم )كما فعل أخيرا مع أستاذ الأساتذة - أيا كان خطؤه - هيكل ....... يا سادة الحوار الصحفى له قواعد ومبادئ لن أقول أخلاقية فأمثال ابن شعيب لا يكترثون بهذه التفاهات .. ولكن هناك - على الأقل - قواعد ومبادئ مهنية ، أهونها أن يكون حوارا حقيقيا يضئ جوانب مجهولة بهدف الوصول الى حقيقة محددة .. ابن شعيب كان يهدف الى أشياء أخرى ، يهدف الى استفزاز فضيلة المرشد بطريقة يعتبرها هو بطولة ، وقدرة فائقة على ادارة الحوار من صحفى ( مخضرم ) ، وانا أعتقد أنه فشل حتى فى إدارة حوار صحفى يستحق النشر ناهيك عن أن يثير ضجة .. زمن يقرأ الحوار بقليل من التجرد يلاحظ من فوره أن ردود فضيلة المرشد - فى معظمها - لا علاقة لها من قريب أو بعيد بالمانشيتات الضخمة التى درت على روز اليوسف دخلا لابأس به من جراء زيادة المبيعات - ومن المضحك حقا أنه فى إطار استثمار تلك الضحة اعتزام أشاوس روز اليوسف طبع<br />اقرأ بقية التعليق .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

