[[comments]]
order = 26
subject = "الأثنان لا يحترمان مصر"
author = "د.فارس الخياط"
posted = "2006-05-01"
text = "المرشد العام للأخوان المسلمين وقع في خطأيين أولهما بلا شك أن سب مصر وأهلها وهذه جريمة لا تغتفر والثاني أنه أدلي بالحديث لجريدة يعلم الكل لحساب من تعمل. أما عن السيد سعيدشعيب فهو قد نشر الحديث ليس حبا في مصر ولكن تنفيذا للأوامر الصادرة من الجهة التي تعمل الجريدة لحسابها لذلك أنا بأقول أن الله سبحانه وتعالي يقتص من الظالمين بالظالمين."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023200/http://masr.20at.com:80/article.php?sid=156&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

