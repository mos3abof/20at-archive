[[comments]]
order = 7
subject = "ارحموا تامر"
author = "امانى"
posted = "2007-01-16"
text = "بيتهيألى يا جماعه عيب اوى لما نتكلم عن فنان بجد فنان بمعنى الكلمه زى تامر تامر (ملحن،مطرب،ممثل،شاعر) واكيد مش محتاجين اثبات اكتر من كده انه فنان وبالنسبه للى قال ان المراهقات بس اللى وقفوا جنب تامر يبقوا غلطانين لان ناس كتير اوى كبار وامهات وصحفيين وقفوا جنب تامر وقالوا عنه كلام وكويس....... وبيتهيألى لو فرضنا ان تـامـر غلط فهو انسان واى انسان ممكن يغلط ولا حد ليه رأى تانى؟...فى النهايه طلبى ان اللى يتكلم عن فنان محترم زى تامر ليه جمهوره يتكلم بطريقه افضل من كده شويه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128192541/http://masr.20at.com:80/article.php?sid=1397"

[[comments]]
order = 8
subject = "بطلوا حقد يا ولاد الكلب"
author = "sayed el atefi"
posted = "2007-01-16"
text = "والنبى مش حرام<br />ده اسمه فنان ويبقى استاذ للى كتب الموضوع ده<br />انا دلوقتى اقدر اقول ان اللى كتب الموضوع ده هو اللى مش لاقى حاجه يقولها<br />وانت مال امك اصلا يتكرم ولا لا<br />عيب يااخ<br />ده تامر<br />اللى غنى لمصر<br />والى راح احتفالات اكتوبر ادام الريس مبارك<br />تفتكر الريس ممكن يخلى حد خاين يغنى لمصر ادامه!!!!!!!!!!<br />رد يااستا1<br />رد ياللى بتغلط فتامر<br />على فكره<br />تامر ده احسن من اى حد رد بالفاظ عيب عليه<br />انا مش هاقول اكتر من ان كل ده حقد مالى قلوبكم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128192541/http://masr.20at.com:80/article.php?sid=1397"

[[comments]]
order = 9
subject = "بطلوا حقد يا ولاد الكلب"
author = "sayed el atefi"
posted = "2007-01-16"
text = "نسيت اقول<br />اى انسان بيغلط<br />وربنا بيرحم<br />ومحدش ليه دعوه ابدا بحبنا ليه<br />واللى عايز ينتقد حاجه يقول بس فى نطاق الادب واما هايلاقى لسان زباله يرد عليه بنفس الالفاظ اللى بيقولها لتامر<br />انا بقول كده علشابحب تامر<br />اه غلط<br />بس بيصلح كل الاخطاء دلوقتى<br />يبقىة مش نقف ادامه بقى"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128192541/http://masr.20at.com:80/article.php?sid=1397"

