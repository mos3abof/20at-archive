[[comments]]
order = 12
subject = "الحقد حاجة وحشة"
author = "حنين"
posted = "2007-01-26"
text = "لو كان ربنا الي خلقك وخلقنا بيسامح احنا بشر ما انسامحش وما نسمحش مين شاب حساس رقيق موهوب انا أول وحدة علمني الصدق والمحبةوعلم ملايين اما موضوع المراهقات فذا حجة وخدينها عشان تدمروا شاب كل هموا انوا يبسطنا ويدينا أغاني تعبر عنا وانا بعتقد انوا نقضدك لتامر بشكل ذه دليل علي نجاحه غصبا عن الناس الي بيكرهوه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128192541/http://masr.20at.com:80/article.php?sid=1397"
