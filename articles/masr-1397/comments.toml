order = 0
subject = "لماذا يكرمون تامر حسني؟"
author = "مصرية مهمومة"
posted = "2007-01-04"
text = "لماذا يكرمون تامر حسنى ؟<br />ولماذا احتلت اخباره على مدى عدة اشهر صدر الصحف المصرية؟<br />ولماذا خرجت مظاهرة للمطالبة بالافراج عن تامر حسنى؟<br />ولماذا جمعت توقيعات للافراج عن تامر حسنى؟ولماذا ولماذا ولماذا؟؟؟؟؟؟؟؟؟؟<br />الاجابة وحيدة هى اننا شعب فاضى ليس لديه ما يشغله او على الاقل اغلبه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128192541/http://masr.20at.com:80/article.php?sid=1397"

[[comments]]
order = 1
subject = "لماذا يكرمون تامر حسني؟"
author = "مع الاسف اصبحت النماذج السوداء المنحرفه هى صاحبه الشعبيه الاكبر فى الشارع المصرى فها هو تامر حسنى ومن قبله اللاعب ابراهيم سعيد و حاليا المغنى المنحرف سعد الصغير لعلكم رايتم الفيديو بتاعه على النت مع الراقصه فى فرح ، قمه السفاله"
posted = "2007-01-05"
text = "اما ما استفزنى حقا فى تامر بيه انه فى خلال فترات المحاكمه كان ممسكا بمصحف فى يده طوال الوقت فاين كان هذا المصحف اثناء تزويره للاوراق و اين هو الان فى حفلاته و كليباته المبتذله الحافله بالقبلات و الاحضان و شبه العاريات ام انها كانت وسيله لكسب عطف الجمهور<br />اما لماذا يكرمونه لان الاذاعه مع الاسف تتخلى شيئا فشيئا عن مبادئها و تحاول مسايره الجو السائد بكل شكل ممكن."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128192541/http://masr.20at.com:80/article.php?sid=1397"

[[comments]]
order = 2
subject = "الاول فى التزوير"
author = "المصرى اوى"
posted = "2007-01-05"
text = "هذا التامر الحقير 00هو ما نضحت بة ايام الانحطاط فى الفن المصرى من غناء وسينما ومسرح وكافة اشكال الفنون الراقية التى تبؤات به مصر القمم وكانت منارة وملاذا لكافة الفنانين من كل الاقطار العربية0000<br />فلا نتعجب فى زمن الانحدار ووصول المنحنى البيانى الى القاع ان يكون على راس العصر المنحط هو ذلك الشاب الرقيع المخنث00 وامثالة من مروجى التخنث والميوعة0<br />والاذاعة المصرية برئاستها الحالية(ايناس)00ما هى الامراة تعكس الفشل فى كل مناحى الحياة فى بلدنا المنكوب<br />لك اللة يا مصر"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128192541/http://masr.20at.com:80/article.php?sid=1397"

[[comments]]
order = 3
subject = "عشرينات الظلمه ..."
author = "إبن بهيه"
posted = "2007-01-06"
text = "بطلوا حــــئد بــــئى على العالم .. يكرموه ما يكرموهش إحنا مالنا ... هي إذاعة أبونا يعني ؟؟؟<br />مش إحنا اتفقنا إن البلد دي كل واحد قاعد في حته بتبقى بتاعته يعمل ما بداله فيها .. والإذاعه بتاعة اللي بتاعتهم بقى .. يكرموا ما يكرموش .. دي حاجه تخصهم ومن حكم في ماله ما ظلم .. يا ظلمه يا بتوع عشرينات<br />العيال بتوع عشرينات دول اللي بينخوروا في أملاك الخلق دول عايزين .. آهـ .. آهـ .. آهـ .. آهـ .. آهـ .. آهـ ..<br />مش هو الواد ده بتاع الآء دي ؟<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128192541/http://masr.20at.com:80/article.php?sid=1397"

[[comments]]
order = 4
subject = "انحطاط تفكيري خلقي"
author = "المظفر قطز"
posted = "2007-01-09"
text = "تكريم شخص بهذا الشكل هو دليل الانحطاط الفكري و الخلقي لمجتمعاتنا العربيه؟؟؟؟ هل سمعتم عن الطالب الذي انتحر لعدم قبوله في النيابه؟؟؟مع انه طالب متفوق؟؟؟ هذا احد ضحايا هذه المجتمعات التي تمجد التافهين المزورين"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128192541/http://masr.20at.com:80/article.php?sid=1397"

[[comments]]
order = 5
subject = "أء أء"
author = "الفن العاشر"
posted = "2007-01-09"
text = "يا ناس<br />مش مشكلة انه متهرب من التجنيد<br />أهم حاجة انه انسان مبدع ابداع رائع شنيع فظيع قوي خالص جدا<br />في وقت يجلس فيه علي الحجار ومحمد الحلو ومحمد ثروت ومدحت صالح والمطربين بحق بمنازلهم يتم توجيه سعد الصغير وروبي ونانسي وشعبان لتخريب الذوق العام واضاعة معني الفن كسمو للمشاعر .... الخ<br />وبالطبع يكفينامن تامر رائعته الخالدة<br />قصيدة<br />أء أء أء<br />من كلمات عبده الأخرس<br />أقول قولي هذا وحسبي الله ونعم الوكيل في هذا الزمن الجميل .... هاااااه دنياااااا"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128192541/http://masr.20at.com:80/article.php?sid=1397"

