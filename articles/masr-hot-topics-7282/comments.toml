text = "بصراحة الموضوع جميل جدا … يعنى فكره ان شباب الاخوان يرفضون البرنامج ديه اول مره اقراها فى الموقع ده … وما شاء الله جبت كذا مصدر حتى لا يتهمك احد انه اخدت فكره فردية لبعض الاشخاص<br />وبالنسبة للاخ الغير محترم … محترمة باقوله يعنى هو رمضان فين من تزكية النفوس يا اخى ترضى ان حد يقول كلمة على حد من محارمك … اتق الله فى لسانك .. حتى لا تصلى نار جهنم"
