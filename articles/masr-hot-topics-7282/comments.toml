author = "البغدادي"
posted = "2007-10-07"
text = "بتقول إيه يا حبيبي ؟… شباب الإخوان !! من أين لك ان تعرف بأن هؤلاء هم شباب الإخوان وهو أي حد يعلق على أي حاجة يبقى ( قيادي) في الجماعة ، وللا أي حد يعلق على موضوع في موقع يبقى من شباب الإخوان .. هو أي واحد يفبركلو موضوع من عالنت يجي وينشره وللا إيه ، وبعدين مين قالك إن شباب الإخوان بيقدحوا في البرنامج ، هم أصلا أش فهمهم عشان يقدحوا فيه ( ده لو كانوا شباب الإخوان ) خلي واحد في اللي انت ذكرتهم يذكر سبب سخطه وابقى شوفه منطقي وللا واحد زي ده يبقى مسلم مش إخوان ) واحد يقولك المواطنة والمرئة والمؤسسات ، يعني هو عاوز الحاجة تسيب الغسيل والطبيخ وتيجي تشتغل ( حاكمة ) ."
archived = "2010-02-11"
capture_url = "https://web.archive.org/web/20100211205140/http://www.20at.com:80/masr/hot-topics/7282.html"

