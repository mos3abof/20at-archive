posted = "2007-10-07"
text = "ايا كان البرنامج بتاع الاخوان فهو برنامج مصرى ليس فية بيع بنوك ولا شركات ولا مثتثمر رئيسى ولا مستعمر مستتر<br />وهو برنامج وضعة مصريون وليس خبراء البنك الدولى اليهود<br />مرحبا بأى برنامج مصرى"
archived = "2010-02-11"
capture_url = "https://web.archive.org/web/20100211205140/http://www.20at.com:80/masr/hot-topics/7282.html"

