[[comments]]
order = 0
subject = "كيف تسجل بصوتك؟!"
author = "توضيح من موقع كأس العالم 2006"
posted = "2006-06-08"
text = "* اضغط قائمة البدء start menu ثم اختر All programs، ثم اختر Accessories، ثم Entertainment ثم Sound Recorder مع ملاحظة ضرورة وجود مايكروفون (ولو حتى ملحق بسماعة)، وضبطه عن طريق الـMaster Volume الموجودة أسفل يمين الصفحة بجوار الساعة، التي تضغط عليها مرتين فتظهر قائمة تختر منها Options ، ثم Properties، ثم تضغط علامة (صح) على Microphone."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615031806/http://worldcup2006.20at.com:80/article.php?sid=4"

