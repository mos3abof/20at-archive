subject = "ليس هناك ما يبرر"
author = "علي"
posted = "2006-09-03"
text = "ليس هناك للأسف أي رؤية أو مضمون آخر يبرر ما قالة حسن حنفي،، حتى لو كان المقصد حسن وطيب فيكفي أن ذلك فيه سوء أدب في الحديث عن مقدسات إسلامية بل وفي الذات الربانية، سبحان الله وتعالى عما يقولون علو كبيرا."
