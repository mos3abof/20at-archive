[[comments]]
order = 15
subject = "اللهم اهلك امريكا"
author = "ريم بنت السعودية"
posted = "2006-09-02"
text = "اللهم............... عليك بامريكا ومن شايعها ومن احبها اللهم ولاتقم لهم قائمة اللهم اهلك زرعهم واجدب ارضهم واجعلهم في اسفل سافلين وارنا فيهم عجاااااااااااائب قدرتك عاجلا غير اجل واجعلها الى تفكك وزوال ................ اللهم عليك بزعيمها بوووووش فقد سعى في الارض فساد هاهي فلسطين تئن وهاهي العراق وتللك الصامدة لبنان قد دمرها واهلك اطفالها وارمل بنسائها ,,,,,,,,,,,, وهاهم المبتعثين السعوديين اخذوهم وكبلوهم لما لما ........ من اجل انهم قالو لااله الا الله محمد رسول الله ...... قتلو احلامهم وشردو ابنائهم ووضعوهم في سجون التعذيب والقهر ............. هاهي الامة الاسلامية تئن وتئن وتئن ونحن غارقون ........... امريكا تاخذ نا صفعا بدعوى اننا ارهابيين ................. الى متى ونحن غافلون نشجع الصناعة الامريكية ............. عليكم بالدعععععععء على اليهود المغضوب عليهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123552/http://www.20at.com/article2.php?sid=1172"

[[comments]]
order = 16
subject = "الضلال"
author = "ابو حسين - مصراوي قديم"
posted = "2006-09-02"
text = "بسم الله و الصلاة و السلام على رسول الله<br />اعتقد ان الموضوع لا يحتاج الى كل هذه الانتقادات لعدة اسباب, اولا لأن القراّن الكريم اعلى و اعز و اطهر من ان يتم تقيمه او تفسيره او انتقاده من قبل الجهلاء و المرتزقة , ثانيا واضح جدا ان الاستاذ حسن احس ان الفرصة مناسبة و انه فى حاجة لبعض الشهرة او المال او الظهور فى الفضائيات فبحث عن اي مجال يمكن ان يوصله الي مراده, فلم يجد اسهل من اكثر الطرق انتشارا و اسرعها الي الشهرة غير مهاجمة الاسلام و الدين و التطاول عليهما و بالطبع يستغل النوم العميق و حالة الغيبوبة التي يقبع فيها الازهر الشريف و كل الجهات التى يفترض ان تهب دفاعا عن الدين الحنيف,فالعيب و اللوم ليس ابدا على الاستاذ بل علي الاساتذه الذين سمحوا له بالوصول لهذا المنصب و اعتلاء هذا المكان و القاء هذه الخرافات بدعوي حرية الفكر و الابداع."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123552/http://www.20at.com/article2.php?sid=1172"

[[comments]]
order = 17
subject = "بعيدا عن السب والتحريض... محاولة للفهم"
author = "باحث عن الحقيقة"
posted = "2006-09-02"
text = "قبل الخوض في التعليق على الموضوع ذاته لي ملاحظات على الجانب المهني لعمل الموضوع:<br />* من مجموع 3 مصادر حاولتم التحدث معهم قبل مصدر واحد فقط الحديث معكم، وأنا لا أعرف إن كان هذا ضعف في المحرر، أم أن الموقع لم يحظى بالنتسار الكافي داخل مصر حتى لا يهتم هؤلاء بالرد على المحررين، أم أن المصادر أنفسهم يعانون من فوبيا الصحافة، وأغلب الظن أن الأجابة هي خليط من بين كل ما سبق وذلك واضح من كتابة الموضوع، ومن يدقق سيعرف.<br />* كيف تتحدثون عن د. حسن حنفي دون أن توردوا أي شئ ولو خلفية بسيطة عن توجهات الرجل الفكرية، او أن له تصريحات سابقة سبق وقد أن أثارت ضجة، أو أنه حتى تم تكفيره قبل ذلك، وأغلب الظن ان المحررين لا يعلمون عن ذلك شئ.<br />أما فيما يتعلق بتصريحات الرجل ذاته:<br />* أنا لا أبرر تصريحات الرجل، ولكن حسن حنفي يحتاج أكثر لمن يفهم كلامه ويحاوره، لا من يجتزئ كلامه وينقله حرفيا، لذلك كان من الأولى لكم إدارة حوار مع الرجل حول ما قاله.<br />* من يتابع حسن حنفي لا يعجب كثيرا من تصريحاته فالرجل له اجتهادات فكرية قد يصيب أو يخطئ فيها.<br />* هذا لا يعني أني أبرر ما قاله، فأنا ضده شكلا وموضوعا، لكني أؤكد أن حسن حنفي يملك عقلية ورؤية أفضل بكثير من غيره."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123552/http://www.20at.com/article2.php?sid=1172"

