[[comments]]
order = 3
subject = "..& سيبقى القرآن منهج للبشرية رغم أنف كل الحاقدين &.."
author = "..& هيكل الأزهرى &.."
posted = "2006-09-01"
text = "لا تقلقوا يا من اتبعتم دين الإسلام الدين الحنيف الذى ارتضاه الله لنا لا تقلقوا ولا يربككم مثل هذه الأقوال واحب ان اقول أن الفلسفة الإسلامية كلمة حقيقية لها معنى ولكن من ينسب اليها لا يعبر الا عن رايه الشخصى وفقط ولذا احب ان انوه إن الشخص دا اللى قال ان فى تناقض وتسامح ومش عارف ايه دا ان دل على شىء فيدل على عدم فهمه لانه لو كان فعلا فهم صح وتفكر وتعقل فى الكلام اللى قاله كان اكيد غير الكلام دا فورا واعتذر لنفسه واعتذر لكل اللى سمعوا بدا وتانى شىء القرآن محفوظ من فوق سبع سماوات مش محتاج اننا ندافع عنه قال الله عز وجل & إنا نحن نزلنا الذكر وإنا له لحافظون & صدق الله العظيم .. أما عن موضوع حميدان دا يا اخت ريم السعودية 00 احب اقولك انى دخلت فعلا وكتبت تعليق لكن زى ما انتى عارفه مانسيتش الحكام العرب جميعا ههههه ربنا يسهل لو اتنشر هتقريه وان شاء الله مثل هذه المشاكل هتتحل فى اقرب وقت بإذن الله تعالى ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123552/http://www.20at.com/article2.php?sid=1172"

