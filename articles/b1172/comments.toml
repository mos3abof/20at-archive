subject = "اسف اسف"
author = "بجد اسف"
posted = "2006-09-03"
text = "كل واحد عاوز يعمل نفسه بيفهم شوية يخبط شوية في الدين والاسلام..<br />بس انا اسف اني ح اخرج على الموضوع بس العنوان ولصياغة بتاع خبر وفاة اللاعب الخلوق محمد عبد الوهاب زبالةاوي وباين اوي ان مستوى الكاتب منحط وفي الارض ..<br />يا ريت الموقف ده ما يعديش كدة وخلص لازم تاخدوا موقف وياريت ماشوفش اسمه على الموقع تاني وإلا والله ما انا داخل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123552/http://www.20at.com/article2.php?sid=1172"

[[comments]]
order = 23
subject = "مصدرك ايه"
author = "علي ايمن"
posted = "2006-09-03"
text = "كل ما قرأناه هو مجرد نقل ناقل وهذا الكلام المنقول هو قلة ادب وليس إساءة اختيار فالكلام السوقي لا يخرج من دكتور وفي فلسفة الدين وأظني ان بتوع \"الخبطة الصحفية\" - واالله ذكروتوني بأفلام الثمانينات افلام مثل ضربت شمس وغيره - هم من فبرك خبر كهذا او بالأحرى شكل الخبر ليخرج علينا بهذه الفرقعة وان صدق الراوي -هذا وان صدق - فرأيه لنفسه ونحن غير ملزمين بتخاريفه وفلسفه الفاضية فالله هو الله والقرآن هو القرآن بالرغم من قول الأفاكين او قاصري العقول او ضحال التفكير. ولعل مقولة الأمام علي عليه السلام حول القرآن عند الحادثة الشهيرة في التحكيم مع معاوية بأن القرآن \"حمال اوجه\" وصدق الله تعالى عندما قال \"ولا يعلم تاويله الا الله والراسخون في العلم\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123552/http://www.20at.com/article2.php?sid=1172"

[[comments]]
order = 24
subject = "ربنا يشفيه"
author = "قلم جاف"
posted = "2006-09-03"
text = "أي فاشل أو مريض ما قدامهوش إلا الهجوم على النص وليس فهمه .. ومستوى قراءته للنص القرآني سطحي بدرجة تثير الشفقة فعلاً .. ويبدو أن مصطلح مفكر إسلامي - وهو كلام فارغ لا وجود له - بدأ \"يلم\" من الجهال والمغمورين والمتفذلكين ..<br />وإن كان سيادته يرى أن آيات القرآن الكريم متناقضة مع بعضها .. هل \"سيصلحها\" من وجهة نظر سيادته الهجوم عليها؟<br />هؤلاء أعجز من أن ينقدوا شيخ طريقة أو مرشد جماعة ، ولذلك فمن السهل عليهم الهجوم على القرآن وربما الذات العلية..<br />ربنا يشفيه .. ويشفي كل مريض و \"مفكر إسلامي\".."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123552/http://www.20at.com/article2.php?sid=1172"

