text = "لم يفهم(حسن حنفي)أن القرآن نزل ليس لرجل واحد فمثلا<br />تمر على الانسان ظروف مختلفة مثل أيام حرب<br />أيسامح العدوأم يتركه يقتله؟ طبعا يقتله<br />اذا حدث خطأمن أخ لأخيه المسلم أيضربه و يقتله أم يسامحه؟ طبعا يسامحه<br />لم أكن أريد أن أقول ذلك و لكن الظروف تقتضى ذلك<br />t"
