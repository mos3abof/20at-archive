[[comments]]
order = 9
subject = "سوء فهم"
author = "مسmuslimلم"
posted = "2006-09-02"
text = "هناك سوء فهم من الدكتور<br />الله ( سبحانه و تعالى ) اتصف بصفة العدل و لكن العدل يتطلب صفات القوة و الهيمنة و الحكم من غير ظلم , و صفات الرحمة و المغفرة و العفو بدون ضعف , كما أن القران أنزله الله (عز و جل ) مخاطبا أمة ستحكم بشرع الله و سيحدث احنكاكات مع أمم أخرى أثناء تبليغ الرسالة , فأمر المسلمون باعداد القوة للدفاع عن النفس و الدعوة , ولكن حين لا يكون هناك ظلم من الاخرين فعلى الجميع لزوم السلم و الدعوة لطريق الله بالحكمة و الموعظة الحسنة .<br />أما بالنسبة لدور الرسول (صلى الله عليه و سلم ) فهو لم يجبر أحدا على الاسلام و لكن لا يسمح لأحد أن يمنع الناس من التعرف على الاسلام و لذلك شرع القتال للدفاع عن الناس و الدعوة (حرية الرأي ) , و الله و رسوله أعلم.<br />و على الله قصد السبيل ,,"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123552/http://www.20at.com/article2.php?sid=1172"

[[comments]]
order = 10
subject = "انا حزينة فعلا"
author = "امانى"
posted = "2006-09-02"
text = "سلام الله عليكم ورحمته وبركاته<br />انا فعلا حزينةوالله على اللى بيحصل دة حتى المسلمين بيقولوا كدة امال سيبتوا ايه للكفرة؟<br />انا اتخنقت حاسة انى عاوزة اعيط كل حاجة تدعو للاكتئاب من حال المسلمين كل حاجة غش ومفيش ضمير والاسوأ مفيش رد مفيش دفاع عن الاسلام لما الازهر يسيبه يقول كدة امال مين اللى يرد<br />مش كفاية مهزلة الفتاوى اللى فى التليفزيونات اللى خلت الواحد يكره نفسه ويشك فى افعاله مش عارف هو مع الحرام ولا الحلال انا بجد مخنوقة وتعبانة جدا وتعبت اكتر بعد المقال دة<br />ادعولى ربنا يفرج كربى وجميع المسلمين<br />سلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123552/http://www.20at.com/article2.php?sid=1172"

[[comments]]
order = 11
subject = "حسبنا الله و نعم الوكيل"
author = "الفارس"
posted = "2006-09-02"
text = "أخذ الله هذا اللا حسن ولا حنفي بما افتراه ..<br />و الله ان هذا هو النفاق بعينيه ...<br />يدعي التناقض غي القرآن المنزل من رب العالمين الذي له الكمال وحده ...<br />و يستغفل السامعين بآيات التسامح و القتال و هو كدارس يعلم جيدا ان حتى القتال نزلت فيه ايات تحكمه و تضع قواعده و بها من الرحمة و العدل ما أغفله عمدا هذا المنافق ...<br />ويستشهد بقول القرآن (لست عليهم بمسيطر) ثم يتعجب كيف يامر في آية أخرى بالقتال...<br />كأنه لا يعلم بأن القرآن لم ينزل دفعة واحدة و انما متتاليا ففيه آيات تنسخ أخرى - و هو ما يغرف بالناسخ و المنسوخ و أقرب مثال لذلك ان القرآن ذم الخمر مرتين ثم حرمه في الثالثة ...<br />هو يعلم و لكنه يتجاهله عمدا ليستغفل الحضور و يستمر في خوضه , غمسه الله به في الدرك الأسفل من النار ...<br />ُثم يتطاول على أسماء الله و يدعي انها تصفه حاشاه تعالى بالديكتاتور الغير عادل ..<br />و من من حكماء السي آي ايه افتى لجنابه بأن حكم الله في خلقه له راد ؟<br />بل الله يقول للشيء كن فيكون , ولا أظننا نملك ان نقيم استفتاء لتطلع الشمس من الشمال فيكون حكم الله ديمقراطيا.. فقد حكم الله انها تطلع من الشرق و لا راد لحكمه ..<br />اما بالنسبة لمن رفضوا ذكر رأيهم شرعا في هذا ال..شخص , فأظنهم أخذوا بأن الله لن يسأل المرأ منا لم لم تكفر فلانا و لكنه سيسأل لم كفرت فلانا ...<br />حسبنا الله و نعم الوكيل ...<br />بسم الله الرحمن الرحيم<br />(وَعَدَ اللَّهُ الْمُنَافِقِينَ وَالْمُنَافِقَاتِ وَالْكُفَّارَ نَارَ جَهَنَّمَ خَالِدِينَ فِيهَا هِيَ حَسْبُهُمْ وَلَعَنَهُمُ اللَّهُ وَلَهُمْ عَذَابٌ مُقِيمٌ)<br />صدق الله العظيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123552/http://www.20at.com/article2.php?sid=1172"

