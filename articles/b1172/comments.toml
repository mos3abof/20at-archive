order = 19
subject = "الموضوع غير مناسب بالمرة لنشر"
author = "معاذ محمود عامر"
posted = "2006-09-02"
text = "لم يكن مناسبا أن ينشر هذا الموضوع لا كما سبق في المصري اليوم أو الآن في موقعكم لان هذه المواضيع خاصة جدا بأهل الفكر والفلسفة ولا يجب أن تكون متاحة لجميع الناس حتى لا نقع في فخ التكفير.<br />عندما أقام الدكتور مراد وهبة مؤتمره قديما عن الفلسفة ورجل الشارع كتب الدكتور زكي نجيب محمود في الأهرام مقالا بعنوان واذا الموؤودة سئلت بأي ذنب قتلت وكان يقصد بالموؤودة الفلسفة التي اختلطت بتراب الشارع على حد قوله, ووقت أن قرأت هذا الكلام في أحد الكتب مؤخرا رفضته وقلت أن الفلسفة غاية طموح أهلها أن تصل الى رجل الشارع, ولكن الآن أنا مقتنع أن هذا الكلام منطقي كليا فها هو الدكتور حنفي يكفر ويسب من بعض الشباب الذين لم يقرأو حتى كتبه ولا يعرفون شيئا عن مشروعه الفكري وتاريخه.<br />لا يفهم من هذا الكلام أنني مع كلام الدكتور حنفي فأنا مع حرية الرأي حتى وان خلفت المتحدث . وأنا أرى أنه ماكان يجب أن يشبه القرآن هذا التشبيه فقد يكون المعنى صحيحا ولكن قدسية القرآن والكتب المقدسة كعموم لا تسمح بهذه التشبيهات , ثانيا عدم رضاه عن الأسماء القوية لله عز وجل فالله عز وجل متكبر ولكنه عادل جبار على الظالمين رحيم بالطيبين قوي على كل البشر لأنها هي الحقيقة فهو اله خالق ولابد أن تميزه عن الحوادث الذين هم مخلوقاته , أما عن تناقض الآيات فهو شبه صحيح لأن بعض الآيات تتناقض ظاهرا ولكن هذا تناقض ظاهري ضروري فآيات الحرب التي نزلت على المسلمين تحريضا لهم على استرداد حقوقهم المسلوبة كان ولابد أن تختلف عن باقي الآيات في حالات السلم أو آيات الأحكام, كما يجب أن يختلف أسلوب الةعيد عن الوعد والترهيب عن الترغيب. هذا والله أعلم وألطف وأرحم وأحكم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123552/http://www.20at.com/article2.php?sid=1172"

