[[comments]]
order = 26
subject = "لنفكر معا"
author = "مع الدكتور حسن حنفي"
posted = "2006-09-14"
text = "ماقاله الدكتور حسن حنفي هو أقل من الحقيقة . لقد آن الأوان ان نفكر فيما يلقنوننا اياه تحت اسم آيات وأحاديث شريفة . لقد أصبح معروفا ان ليس كل ماهو منقول الينا من آيات قرآنية أو أحاديث شريفة صحيح . ان الانتقام والتكبر هي صفات بشرية تليق بالدونيين من البشر فكيف برب العباد ؟ اما آن الأوان لنا ان تناقش ونفكر فيما نحن اليه منقادون بدون تفحص او دراية بل فقط لانه هكذا قالوا لنا جيلا عن جيل . ان اي موضوع حين يتناقله الناس ستختلف صياغته من شخص الى آخر ومن زمان الى آخر . من قال ان هذه الصيغة القرآنية المتداولة هي الصحيحة ؟ ومن قال ان هذه الاحاديث المتناقلة هي غير مدسوسة ؟ لنراجع التاريخ معا ونقرأ مابين السطور , سنجد العجب العجاب مما لانريد تصديقه ! كيف جمع القرآن ؟ ومن جمعه ؟ ومتى تم جمعه؟ ومن قال انه لاتوجد مصلحة لدى البعض في حذف آيات او دس أيات أو تعديل آيات ؟ ثم متى جمع الحديث ؟ ولماذا رفض البخاري اكثر من خمسين الف حديث قالها ابو هريرة واستبقى منها فقط خمسة آلاف ؟ ولماذا لايحق لنا - كما حق للبخاري - ان نرفض او نقبل الاحاديث التي قبلها هو ؟ يكفينا ماآل اليه حالنا تحت علم امة الاسلام . لقد آن الأوان لنضع كل شيء على الطاولة ونناقش الرأي الآخر ونقبل به اذا اقتنعنا ولانلجأ الى تكفير بعضنا بعضا اذا لم نقتنع فهذه حجة الضعفاء والبسطاء وذوي العقول الجامدة . كل شيء يجب ان يخضع للنقاش بما في ذلك الذات الالهية . اليس كذلك ؟ اتمنى ان أحصل على تعليق منطقي ومدروس بعيدا عن السباب والمهاترات ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123552/http://www.20at.com/article2.php?sid=1172"

