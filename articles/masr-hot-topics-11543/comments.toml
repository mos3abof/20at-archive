text = "مش عندنا القرية الذكية - اللى رئيس الوزراء مهندس الاليكترونيات بيلعب فيها كرة قدم مع الوزراء<br />احنا قلنا وصدقنا ان مصر بتتقدم بينا - طلعت مصر بتتقدم بالصين<br />هى الصين زايدة عنا اية<br />مش زايدة حاجة<br />غير ان لهم حكومة وطنية واحنا<br />ياللة ربنا يسهل<br />انت فين يا طلعت باشا حرب"
