order = 0
subject = "منار"
author = "لسلام عليكم و رحمة الله و بركاته"
text = "بصراحة أنا فعلا بشوف في الفضائيات بعض الداعيات بملابس غير شريعة ملابس مجسمة و حجاب قصير و ميك اب ملحوظ جدا انا أرى إن دا فعلا ليه تأثير مش كويس ليه ؟ لأن الكلام اللي هما بيقوله جميل بس بعض أفعالهم تتنافى مع كلامهم و من أفعالهم طبعا اللبس و طريقة الكلام و كثرة الهزار و هذا طبعا يتأثر به الشباب فيقلدونه و قد رأيت ذلك<br />أنا لست ضد ان تكون الداعيه أنيقة في ملابسها و لكن بدون لفت نظر و بدون مخالفات شريعية<br />على فكرة الإسلام علمنا كيف يكون المظهر و الجوهر معا و ليس احدهما فقط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145140/http://www.20at.com/article.php?sid=1598"

[[comments]]
order = 1
subject = "المحله الكبرى"
author = "نا مروه 20 سنه انا مع الدعاه المودرن وانا بالعكس احب السماع اليهم اكثر من الدعاه التقليديين وبصراحه هناك البعض يتحججون (عفوا)بلبس الداعي او الداعيه التركيز الاول يكون مع كلامهم وانا لا انكر انى اركز مع لبسهم ولكن هذا يعطى صوره جيده عن الاسلام فكانت هناك زمان مقوله ان الملتزمه (فلاحه)ولكن الان صار هناك تصميمات خاصه بالملتزمه واحس انهم اقرب الي والى عقليتى بل بالعكس عرفوا كيف يجذبوا الشباب اليهم والى تلك البرامج الهادفه والجيده وبصراحه هذا افضل ام الفضائيات الاخرى التى اصبح اعوذ بالله العري هو اسلوبه"
text = "يااخوانى يجب علينا ان نشجع هؤلاء الدعاه لا ننقدهم وربنا يكرمهم<br />انا اعرف انه لابد ان يتحسنوا فى مساله الميكب ولكن بعد كل هذا جزاهم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145140/http://www.20at.com/article.php?sid=1598"

[[comments]]
order = 2
subject = "الله يسعد كل من قراء تعليقي"
author = "حبتي والله لمأكتب الا لاني احبكم في الله .."
text = "الحجاب مالغاية من الحجاب (الكتاب بين من عنوانة)<br />اي يكون بينك وبين الاخرين ستر وحشمة وعدم انجذابية<br />هذة هي الغاية من الحجاب كما قالت عائشة رضي اللة عنها ان الصحابيات اذا خرجن كانهن الغربان من السوادوالستر .. حيث ان الفتاة درة مكنوة وسط صدفة والا ما الفرق بين الرجل والمراءة<br />وأما النقاب في أيام الصحابيات :كان مختلفا جدا عن ايامنا هذة ...............<br />أحبتي ..أن الدين النصيحة<br />.......والدليل ان الوجة واجب التغطية<br />عن عائشة رضي الله عنها قالت:<br />كان الركبان يمرون بناونحن محرمات مع الرسول صلى الله عليه وسلم فإذا جاؤنا سدلت أحدانا جلبابها على وجهها من رأسها .فأذا جاوزونا كشفناه.رواة أحمد وأبو داود وابن ماجة.<br />ففي قولها ((فإذا حاذونا )) تعني الركبان ((سدلت إحدانا جلبابها على وجهها))دليل على وجوب ستر الوجه إذا كان بحضرة أجانب. و كشفه اذا لم يكن بحضرة أجانب والدليلعلى ذلك انها قالت ((فإذا جاوزونا كشفناه)) .<br />فدليل ذلك أنة واجب من تغطيتة إذا كان في حظرة أجانب وواجب من تغطيتة أذا لم يكن هناك أجانب فا الواجب لايعارضة الا الواجب<br />فلولا وجوب الأحتجاب وتغطية الوجة عند الأجانب ماساغ ترك ترك الواجب من كشفه حال الأحرام<br />وقد ثبت في الصحيحين وغيرهما :أن المرأه المحرمة تنهى عن القفازان والنقاب .قال شيخ الأسلام أبن تيمية :وهذا مما يدل على أن النقاب والقفازين كانا معروفين في النساء الاتي لم يحرمن وذلك يقتضي ستر وجوههن وأيديهن . منقول من كلا م الشيخ العلامة ابن عثيمين يرحمة الله ..وهناك أدله أكثر من ذلك<br />والله على ما أقول شهيد<br />محبكم في الله.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145140/http://www.20at.com/article.php?sid=1598"

[[comments]]
order = 3
subject = "تامر . الجيزة"
author = "ولاً أحييكم أحبتي في الله بتحية الإسلام, السلام عليكم ورحمة الله وبركاته...."
text = "أحب أن أبدأ بقول الله تبارك وتعالى \" ولاتبرجن تبرج الجاهلية الأولى \" وكان التبرج في الجاهلية هو إظهار الرقبة وعظمة الصدر , أما ما نراه الآن فهو ينطبق على قول الرسول صلى الله عليه وسلم \" صنفان من أهل النار لم أرهما لا يدخلان الجنة ولا يشمان رائحتها مسيرة خمسين عاماً وذكر منهما \" نساء كاسيات عاريات \" .<br />ولكن فيما يخص الدعاة الجدد - الشبان- والنساء منهم على وجه التحديد فإني لا أرى مانعاًشرعياً في ارتداء ثوب جميل نظيف لايشف ولايصف . وفي الحقيقة أرى أن معظمهن من مقدمي البرامج الدينية ملتزمات بهذا ولكن الشئ الذي يؤخذ عليهن هو الألوان الفاقعة اللاتي يرتدينها فمن صفات الثوب الشرعي أيضاً أن تكون ألوانه غير ملفتة للنظر.<br />وبالنسبةللرجال لاأرى مانعاً في أن يرتدي ثوبامن الأثواب الحديثة دون أن تصف جسده وخصوصاً النصف السفلي . فالإسلام لا يدعوا إلى الرجعية والتزمت , فإن أبا بكر قال لرسول الله صلى الله عليه وسلم \"أحب أن يكون ثوبي نظيفاًونعلي نظيفاً \" فرد عليه النبي \" يا أبا بكر إن الله جميل يحب الجمال \" . كما أن السيدة عائشة رضي الله عنها قالت\" ماتمتع الكفار بشئ إلا وتمتع به المؤمنون وزادوا عليه التقوى \"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145140/http://www.20at.com/article.php?sid=1598"

