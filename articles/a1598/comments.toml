subject = "إيهاب جمال من المنوفية"
author = "بسم الله الرحمن الرحيم"
text = "أنا من رأيى أن الزى لا يؤثر مادام الداعية يؤدى ما عليه بأن يقدم النصيحة .....<br />فعلينا أيضًا أن ننتبه لما يقولون ولا نتنظر إلى هذة الأشياء التى لا تنفع ولا تضر<br />ولكننا أمة للأسف تترك المفيد وتلهى نفسها بما لا يفيد...............<br />لذلك لو نظرنا فى الواقع لوجدنا أننا المخطئين وليس الدعاه ،"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145140/http://www.20at.com/article.php?sid=1598"

