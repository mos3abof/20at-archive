text = "سؤال ل أسماء عوني يا ريت اللي يعرف يوصلها يسأله ليها : ايه هو المعيار اللي بتقيسي عليه الرجوله ؟ .. و بعدين خلينا واضحين و بلاش نضحك علي بعض لاننا كلنا شباب و عارفين احنا بنفكر في ايه بالظبط … و كل واحد و كل واحده عارفين هم بيروحوا الاستاد ليه ؟ بلا تشجيع بلا اونطه .. حوار التشجيع ده ممكن تضحكي بيه علي بابا الكول اللطيف او ماما السيده الفري اللي ماعندهاش مشكله …<br />و بعد كده تروحوا البيت معيطين من المعاكسات و المضايقات و التحرش اللي تم ف الاستاد … و اللي راح الاستاد اكتر من مره عارف كويس"
