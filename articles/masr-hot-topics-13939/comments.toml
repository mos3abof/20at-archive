author = "zima"
posted = "2009-11-12"
text = "يخرب بيتكوا … و الله أنا عؤبال مأريت التعليقات بتعتك يا أسماء نسيت ان فى ماتش أساسا<br />يخرب بيت أبو الى يزاعالك يا شيخة<br />نداء عاجل و هام :<br />الى كل بنات ومشجعات مصر الحلويين … لا تحضروا ماتش مصر و الجزائر.. ( ماعدا أسماء طبعا و الناس الى معاها ) الماتشو فيه تشجيعون قاتل .<br />ولو فيه بنت عيزة تروح الماتش …تروح مع أسماء .<br />و عايز أقول حاجة لريم محمود أهمدى أهمدى شوية …أنتى لسة صغيرة على الحاجات دية<br />..من الأخر كدا يا جماعة الماتش دا +18 …<br />و نصيحة أخوية بلاش تلبسى طراطير حمرا كتير ههههههههههههههه ههه"
