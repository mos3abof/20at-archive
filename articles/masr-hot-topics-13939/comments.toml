subject = ""
author = "اسماء عوني"
posted = "2009-11-09"
text = "الكلام للكل<br />بالنسبه للتحرش والشتايم<br />هو الشتايم دي حرام وعيب على البنات انها تسمعها ونصقف للرجاله لما تقولها<br />قمة التناقض<br />بالنسبه للتحرش<br />انا ماحدش يعرف يلمسني الحمد لله اللي مامته داعيه عليه ويقل ادبه .. اعرف كويس اقلع اللي في رجلي واديله على دماغه<br />وبدال ماتقولوا ماتروحيش عشان التحرش<br />اتكسفوا شويه<br />وقولوا<br />اللي جاي يتحرش مايجيش<br />ولا ايه ؟"
