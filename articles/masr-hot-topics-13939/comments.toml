author = "النصر لمص"
posted = "2009-11-14"
text = "احب ابدا كلامى بذكر الله تعالى و تمنياتى بفوز مصر<br />طبعا انا شايف شوية ردود جامدة جدا الحقيقة و بعضها مستفز<br />على العموم انا حدخل فى الموضوع بلنسبة للانسة اسماء انا احب اقول لحضرتك حاجة بس انا شايف من كلامك كدة بجد قلة ادب شوية لان اولا الرد بتاعك مستفز جدا يعنى اية بقمصان النوم مش عيب واحدة محترمة و مثقفة تقول كلام زى كدة و مش عيب انك ترضى الرد برضة ومتنسيش ان الردود الى جاتلك دى بسب استفزازك و كلامك الى يحرق الدم دة و بلذات و انتى بتكلمى على البنات و على العموم احنا مش عاوزين البنات تروح الماتش مش علشان احنا ارجل ولا احسن بس احنا خايفين على البنات من الضرب الى ممكن يحصل و لما تضرب ولا تتعور تروح تعيط لامها ولا انتى مش معايا فاحسن للبنات المحترمة انها تصون كرامتها و تتفرج و تشجع بقلبها من البيت و تتمنى الفوز لمصر.. و ارجو من الشباب انهم يحدو من قلة الادب فى الردود شوية دى مهما كانت بنت برضة…<br />على فكرة انا مش شيخ ولا رجل اعمال ولا حاجة علشان محادش يقول انى كلامى عبر ولا حاجة انا شاب عندى 19 سنة و خايف على اخواتى البنات الى رايحين الماتش و ربنا يوفق مصر ان شاء الله"
archived = "2009-12-14"
capture_url = "https://web.archive.org/web/20091214230652/http://20at.com:80/masr/hot-topics/13939-2009-11-05-15-59-46.html"

