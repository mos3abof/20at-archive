posted = "2009-11-12"
text = "الي ( شيخ الغفر ) اسماء عوني - سوكا - ..<br />انتي اللي دخلتي الامور الشخصية و قعدتي تقولي ابويا و امي و اخواتي و عمتي … و عملتلنا فيها حسن ارابيسك … و بعدين ما احنا عارفين طول لسانك دي شيئ موش جديد علي واحده قالت علي امها الله يرحمها ف المدونه السمجه بتاعتها( مكعب خفة الدم ) اللي كلها استظراف لفظ ( الولية ) ..<br />و لو الاحترام و العلم و التحضر يخليني اوافق ان اختي تقعد تجعر وسط الرجاله قال عشان خاطر منتخب بلدها يبقي طز … ياريتها حتي كانت جعرت ف قضية مهمة تمس الدين او الوطن .. علي فكره انتي اخدتي اكبر من وضعك هنا …<br />روحي بقه ركبي شنب و هاتي جيل الحلاقه الجديد من سبينس - هاينفعك قوي لانك لسه ف الاول - و حلي عن دماغنا"
