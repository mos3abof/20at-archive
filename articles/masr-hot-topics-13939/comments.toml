subject = ""
author = "اسماء عوني"
posted = "2009-11-09"
text = "انا دوري ارد بقا<br />الاخ موهاب<br />انا اصلا لاعبة كرة قدم محترفه في نادي يوث ستوكهولم في السويد .. وده نادي درجه تانيه واعتقد اني بافهم في الكوره والتشجيع اكتر من رجاله كتير اوي .. وبعدين يعني انت زعلان اني اسات لكام راجل ومش زعلان ان الالعلام ومصر كلها بتهين الست والبنت اللي بيروحوا الاستاد وبيتقال عليهم فرافير وبيكبت حريتهم بانهم حاجه بيعملوها واظن ان الرجوله هنا مش معناها شنب ودقن الرجوله هنا معناها وقفه وخدمه لبلدي .<br />استاذ احمد . التعليق رقم 5<br />بص يا محترم<br />اولا<br />بابا الكول اللطيف … تعيش انت<br />وماما الفري اللي ماعندهاش مشكله .. بارضه تعيش انت<br />وانا من سنين باربي اخواتي وباشتغل في السويد وانا لاعبة كرة قدم في فريق درجه تانيه سويدي … مش عارفه حاسه اني مش عايزه اكمل رد عليك . كفايه كده<br />بيج ستورم التعليق رقم 7<br />وهويعني لا قدر الله لو الرجاله بس راحت الاستاد وجبت ناس من الجيم ع الاستاد واتغلبنا . ايه اللي هايحصل … عندك رد … اكيد ماعندكش"
archived = "2009-11-12"
capture_url = "https://web.archive.org/web/20091112203844/http://20at.com:80/masr/hot-topics/13939-2009-11-05-15-59-46.html"

[[comments]]
order = 19
subject = ""
author = "اسماء عوني"
posted = "2009-11-09"
text = "الرد<br />تعليق رقم 11 الاخ احمد يحيى<br />بارضه جاوب ع السؤال ده لو روحتوا انتوا واتغلبتوا هاتفرق كتير صوت 10 بنات ولا صوت واحد م الشرابيه ؟<br />وبعدين ماحنا خدنا بطولة 2006 وكان الاستاد بيتهز وكان فيه بنات<br />هم يعني البنات دول .. عره .. سبه شتيمه انا بنت مصريه واي بتا مصريه ارجل من اي جزائري وبنت من مصر بعشره من اي راجل في العالم واحسن من ميت بنت في الدنيا .ز كلام بعيد عن الحقيقه بعدك عن الشمس<br />الاخ احمد عادي<br />اي بنت هاتروح الاستاد .. هاتبقا زيها زي اي حد في الاستاد وهاتفضل تشجع طول الماتش<br />انا عن نفسي كاهلاويه مابفوتش ماتشات للاهلي لا بره ولا جوه ولا ماتشات منتخب مصر لا بره ولا جوه<br />كفايه اقولك اني كنت موجوده انا وصحابي الولاد والبنات في ماتش الاهلي والصفاقس في تونس بتاع ابو تريكه عشان تعرف يعني ايه بنت تروح الاستاد وتعرف يعني ايه مابنخافش من حاجه"
archived = "2009-11-12"
capture_url = "https://web.archive.org/web/20091112203844/http://20at.com:80/masr/hot-topics/13939-2009-11-05-15-59-46.html"

