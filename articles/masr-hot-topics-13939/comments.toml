posted = "2009-11-12"
text = "ياأسماء لافض فيك وانت 10على عشرة واكتر واحدة بتحبى مصر<br />بس بالهداوة كده وياريت مايتقالش عليا معقد انت ياستى بتلعبى كورة طب حلو الرياضة كويسة انما انت بتلعبى وانت لابسة زى شرعى مثلا وانت والحمد لله اسمك اسماء يعنى ربنا انعم عليكى بنعمة الاسلام فأكيد عارفة ان جسد المرأة عورة برضه مش موضوعنا عشان محدش يقول ده واحد متشدد وبعد بينا عن الموضوع بالعكس هما اللى فى الاستاد دول بيعملوا ايه مش بيشجعوا طب ماهو برضه صوت المرأة عورة انا مابقولش البنات يتمنعوا من دخول الاستاد لأ يروحوا ويتفرجوا بالادب ومن غير صوت ولا رقص وصدقونى الواحدة طالما معاها رجل صالح بتعرف حدودها انما الماتش ده احنا عاوزين ناس تسرخ مش تشجع يبقى اقول للبنات سورى خليكوا والجايات اكتر من الرايحات وياما فى ماتشات جاية مش مصيرية للدرجة ممكن يروحوا يتفرجوا وكله بالادب وياجماعة محدش يقول عليا متخلف اورجعى انما كل شئ بالادب والاصول يبقى كويس"
