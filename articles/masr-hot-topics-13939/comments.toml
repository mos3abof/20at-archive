text = "مهو لو الى هيروحوا الماتش بنات زي الى انتوا جايبينهم فى الصورة دول .. يبقى طبعاً لا وألف لا … دول بيروحوا علشان يتصوروا ويطلعوا فى شاشة الإستاد ويقضوا خروجة جميلة .. مالهمش فى التشجيع الى بجد الى يساعد فرقة انها تعدي من ماتش زي ده<br />تخيلوا كدة مجموعة بنات بصوت مسرسع وبتشجع وبتقول .. مصــــر … هسيبكم تتخيلوا المنظر .. انا شخصياً هتكسف للمنتخب .<br />بس برده فيه بنات رجالة بتشجع بجد وبقلب وبحماس ماشفتهوش فى الرجالة"
