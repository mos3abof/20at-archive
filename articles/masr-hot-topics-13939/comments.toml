posted = "2009-11-12"
text = "مين قالك ان صوت المرأه عورة .. انت جبت الكلام ده منين ؟؟<br />ياخ اشرف الراجل بيتكلم صح جدا ودة شئ طبيعى جدا<br />والاسلام بيقول كدة ولو انتة متعرفش اسأل حد وهوة يقولك<br />بس هوة مش عورة للضرروريات يا ماااااااااااااا ااان"
