author = "Man Cool Gdn"
posted = "2009-11-13"
text = "يا رجالة عيب على فكرة كدة انا معاكو ان فيه سوء تفاهم بي موش يوصل بيكم للشتايم<br />طيب هو دة منظر مشرف ادام العرب لما يشوفونا واحنا بنشتم بعض .<br />وبعدين الاخت اسماء عونى كل اللى محتجاه تغير طرقتها شوية وتفتكر بس ان احنا مصرين يعنى دم حامى موش زاى السويد وانتى حرة فى رايك .<br />والموضوع اصلو الخوف على البنات من البهدلة بتاعت المتش والله انا رايح وخايف اتبهدل وانا راجل اهو اومال النات بقى ربنا معاهم .<br />بس يا اسماء بصراحى انتى موش تنفعى تمثلى مصر فى اى مكان انتى مثال غير مشرف دة راى انا.<br />اهدى شوية يا عم طبيب انت واشرف روقو كدة محدش ينرفز نفسو<br />عادى يعنى الحوار موش مستاهل يعنى اللى بيقل ادبو دة من بيئته<br />اسماء عونى انتى بيئة طحن"
archived = "2009-12-14"
capture_url = "https://web.archive.org/web/20091214230652/http://20at.com:80/masr/hot-topics/13939-2009-11-05-15-59-46.html"

[[comments]]
