posted = "2009-11-10"
text = "اللى عايز يروح يروح دى مباراة كرة قدم هامة لازم كل الناس تكون ورا المنتخب ,انتو اللى حولتوها حرب طب وليه يا جماعة كدة وليه الاخلاق دى ده برضو اللى امرنا به دينا,وبقولها وللاسف خلينا نتعلم من دول اوروبا شايفين عاملين ازاى مع ان المفروض نقول انهم هما اللى يتعلموا مننا,عيب ياجماعة كدة واهدوا مبقولش انكم مترحوش تشجعوا بس باحترام وعلوا صوتكم وكل حاجة بس من غير شتايم وخلى الكل يروح يجماعة وبعدين الاستاد مش مكتوب عليه دلوقتى(لا للبنات)واا معاكو ان فيه بنات بتروح علشان تتصور والكلام الفاضى ده ماشى دول ميرحوش بس متجمعوش واللهى فيه بنات رجالة وقادرة تشجع بجد مش شاطرة فى اكل الايس كريم"
