text = "إلا هى أيه نسبة الحقد ده كله الى فى قلب ( واحد معدي)<br />انا مؤيد أسماء لسبب واحد .. وهى أنكم بتناقضوا نفسكم<br />يعنى انتوا بتقولوا أحنا خايفين على البنات علشان التحرش و الزحمة<br />وفي نفس الوقت أنتوا برده الى هيروحوا الماتش … يبقى مين الى هيتحرش بقى !!!<br />وهى كانت كتبت فى كومنت ليها قبل كدة أننا المفروض نقول للى جاى وناوى يتحرش بواحدة هو ده اللى المفروض نقوله ماتجيش وخليك ببيتك<br />والمفروض أنكم كــــرجـــالة توفروا الحماية للبنات .. في أى مكان .. مهو انتوا رجالة وده واجبكم … لكن لو مش هتقدروا … يبقى فين المعنى الحقيقى للرجولة ..<br />وخلوا بالكم .. فيه فرق كبير جداً جداً وشاسع بين الرجوالة و الذكورة"
