text = "وليد الزمالكاوي<br />انا كمان مش باحترمك . عادي يعني ايه المشكله انا محترمه سواء بمزاجك او بغير مزاجك وللمره التانيه على التوالي … اللي على راسه بطحه<br />حاجه غريبه اوي يقول انا احترم كل الاراء ما عدا اسماء<br />وبعد كده يقولي اخوات<br />عالم غريبه"
