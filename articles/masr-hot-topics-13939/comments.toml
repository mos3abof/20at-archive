subject = ""
author = "الطيب"
posted = "2009-11-12"
text = "من الواضح ان الاخت اسماء اساسا داخلة بدور فرد سيطرة وخدوهم بالصوت لا يغلبوكو<br />براحة وبلاش دور الاسترجال بتاعك دة هدى العب وابلعى ريقك واهدى<br />وفكرى فى الى هيحصل والى بيقول البنات متروحش خايف عليكو مش بيقلل منكو ول حاجة<br />بس الواضح من ردودك بجد انك واخداها عافية وجئارة مش عارف لية وداخلة شمالى فى الناس وعمالة تقولى احنا ارجل حنا ارجل احنا ارجل<br />شكلك كدة مقبلتيش فى حياتك رجالة ودة خطائك انتى<br />فا متلوميش كل الرجالة الى فى مصر وتقولى انكو ارجل<br />وبعدين لو انتى راجل اوى كدة ابقى غسيرى اسمك وريحيى نفسك ومتولعيش الدنيا بردرودك المستفذة"
archived = "2009-12-14"
capture_url = "https://web.archive.org/web/20091214230652/http://20at.com:80/masr/hot-topics/13939-2009-11-05-15-59-46.html"

[[comments]]
