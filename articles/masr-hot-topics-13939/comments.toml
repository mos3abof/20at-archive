text = "الانسه اللى بتقول هو احنا بنروح بقمصان نوم لا انتو مش كدا بس حطى صوت 10 بنات من بتوع الايس كريم جنب صوت راجل من الشرابيه او الزاويه او من الوراق او الدرب الاحمر او اى حته من الاماكن الشعبيه اللى فيها رجاله بجد و شوفى اذا كان صوت ال10 بنات هيغطى على صوت الراجل ده و لا لاء و ابقى اتكلمى بقى و قولى ان حقكوا تروحو عذرا الماتش ده عايز رجاله على الاقل تقدر تشجع 90 دقيقه و مش مهم قبل الماتش و شكرا"
