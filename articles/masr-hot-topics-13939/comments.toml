text = "هههههههههههههه اسماء بجد يا بنتى والله والله انتى شكلك تعبانة اخر حاجة .<br />…يابنتى انتى مش واخدة بالك من الكلام الى انتى بتقولى انتا اكيد مش طبعية انتى بصراحة ..نصفتى الانوثة والاداب والجمال والاحترام وخجول الانثوى.<br />.انتى بجد شكلك معقدة من الرجال ودا مرض عندك<br />..والدليل فى كلامك انا مابئلفش بس هو دا الى واضح انك كونتى متهدا هنا فى مصر من حد او ليكى سبقة مع حد كان بيضيئق او اى حاجة ولما ..خرجتى برا البلد وشوفتى الناس وممكن تكونى لاحظتى بل الفرق بالنسبة ليكى ..جاتلك شوفزرينا او بارلونيا<br />..ودا مرض وحش اوى يخليكى مهجمة بوحشية للجنس الاخر …بصراحة انتى لو صحبتى كان زمانى سبتق من زمااااااااااااا ااااااااااااااا ن<br />:sad"
