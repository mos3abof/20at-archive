text = "البت اشرف<br />اهمدي شويه وخليكي في حالك .. وماتتدخليش في حياة غيرك وانا اتكلمت عن شخصي لما اتسالت في شخصي لكن انتي عشان مابتفهميش وفاكره كل الناس معقده زيك فبتتكلمي بالطريقه دي<br />وطبعا انتي اكيد معقده من البنات وواخده على قفاكي عشان كده فاكراني زيك<br />الاخ اللي بيقول مافيش راجل عرف يعلمها الاخلاق ولا مش عارفه ايه<br />ربنا يشفيك مش اكتر يا بتاع صوت المراه عوره بتتكلم وانت مش فاهم اساسا ال صوت المراه عوره ال"
