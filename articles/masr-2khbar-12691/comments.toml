author = "اية اللى عدل ؟"
posted = "2009-07-19"
text = "وهو فية حاجة عدلة فى البلد دى<br />ما هو كل حاجة متنيلة بستين نيلة<br />هى جت على الرز<br />الطماطم بتاع الهرمونات والخيار اللى بيبوش فى الثلاجة<br />كلة بايظ فى البلد دى<br />زمان كان فية مسرحية اسمها انهم يقتلون الحمير<br />ودلوقتى اظنهم بداوا ينفذوا ما جاء بالمسرحية<br />انهم يقتلون الحمير"
archived = "2009-07-20"
capture_url = "https://web.archive.org/web/20090720133958/http://www.20at.com:80/masr/2khbar/12691-2009-07-19-06-42-07.html"

